.app{max-width:1180px;margin:0 auto;padding:16px 18px 30px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--acc2);display:grid;place-items:center;color:var(--acc);font-weight:800;font-size:1.3rem;border:1px solid var(--line)}
.brand h1{margin:0;font-size:1.25rem;font-weight:800}
.brand small{color:var(--mut);display:block;font-size:.85rem}
.tools{display:flex;gap:8px}
.ib{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;color:var(--ink);min-width:44px}
.ib:hover{background:#F6FAFC}
.screen{display:none;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* setup */
.setup{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 6px 24px rgba(80,110,140,.06)}
.panel h2{margin:0 0 10px;font-size:1.02rem;color:var(--acc);font-weight:800;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc2);font-size:.85rem}
select,input[type=text]{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#FBFDFE;color:var(--ink)}
.axes{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:260px;overflow:auto}
.ax{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:right;color:var(--ink);transition:.2s}
.ax b{color:var(--acc)}
.ax.on{background:var(--acc2);border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.cnt{display:flex;gap:6px;flex-wrap:wrap}
.cnt button{border:1px solid var(--line);background:#fff;border-radius:12px;width:46px;height:42px;font-weight:800;color:var(--ink)}
.cnt button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nm{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.qrow{display:flex;align-items:center;gap:12px;margin-top:6px}
input[type=range]{flex:1;accent-color:var(--acc)}
.qv{font-size:1.6rem;font-weight:800;color:var(--acc);min-width:44px;text-align:center}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 14px;font-weight:700}
.hint{color:var(--mut);font-size:.85rem;margin-top:6px}
.tog{display:inline-flex;background:#F3F7FA;border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:4px}
.tog button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--mut)}
.tog button.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:14px;font-size:1.15rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--acc),#7FB6C9);box-shadow:0 8px 20px rgba(60,120,140,.18)}
.go:disabled{opacity:.5}
/* question */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--mut)}
.turn{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;border:2px solid var(--line);font-weight:800}
.turn .dot{width:22px;height:22px}
.qgrid{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:center}
.qcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 26px;min-height:150px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 26px rgba(80,110,140,.07)}
.qtype{color:var(--mut);font-size:.9rem;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:8px;height:8px;border-radius:50%;background:#E2E8EC}
.lvl i.f{background:var(--acc)}
.qtext{font-size:clamp(1.25rem,2.4vw,1.85rem);font-weight:800;line-height:1.6}
.blank{display:inline-block;min-width:120px;border-bottom:3px dashed var(--acc);margin:0 6px;color:var(--acc);text-align:center;transition:.3s}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .tv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .sec{font-size:2.3rem;font-weight:800;line-height:1}
.ring .pts{font-size:.85rem;color:var(--mut)}
.ring .ov{font-size:.75rem;color:#C08A2E;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{position:relative;border:2px solid transparent;border-radius:18px;padding:16px 18px 16px 18px;text-align:right;font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:700;color:var(--ink);display:flex;align-items:center;gap:12px;transition:transform .15s, box-shadow .2s, opacity .3s;min-height:70px}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.opt .sh{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.7);font-size:1.05rem}
.o0{background:#DDEEFA}.o1{background:#FCE6D6}.o2{background:#E1F3E0}.o3{background:#ECE3F8}
.tfo{background:#E6F4EC}.tfx{background:#FBE6E8}
.opt.ok{border-color:#58B07A;background:#D8F1E0;box-shadow:0 0 0 4px rgba(88,176,122,.15)}
.opt.bad{border-color:#E28A95;background:#FBE1E4}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.bar2{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.soft{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;color:var(--mut)}
.primary{border:0;border-radius:14px;padding:11px 22px;font-weight:800;color:#fff;background:var(--acc)}
.feedback{font-weight:800;font-size:1.15rem;min-height:30px}
.picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.picker button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 18px;font-weight:800;display:flex;align-items:center;gap:8px}
/* results */
.res{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px 20px 12px;box-shadow:0 8px 26px rgba(80,110,140,.07)}
.res h3{margin:0 0 4px;font-size:1.2rem}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:320px;padding:10px 0 0;border-bottom:2px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:clamp(60px,11vw,120px)}
.bar{width:100%;border-radius:14px 14px 4px 4px;height:4px;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bar .sc{position:absolute;top:-30px;left:0;right:0;text-align:center;font-weight:800}
.bar .plus{position:absolute;top:-56px;left:0;right:0;text-align:center;color:#3E9A63;font-weight:800;opacity:0;transition:opacity .4s .9s}
.col.win .bar{box-shadow:0 0 0 4px rgba(255,214,120,.55),0 10px 24px rgba(220,170,60,.25)}
.col.win .plus{opacity:1}
.rk{margin-top:-2px;font-size:.8rem;color:var(--mut)}
.names2{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);margin-top:8px}
.names2 div{width:clamp(60px,11vw,120px);text-align:center;font-weight:800;font-size:.95rem}
.names2 .rkb{display:block;font-size:.78rem;color:var(--mut);font-weight:700}
/* podium */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:360px;margin-top:24px}
.pc{display:flex;flex-direction:column;align-items:center;width:clamp(110px,18vw,190px)}
.pc .who{font-weight:800;font-size:1.1rem;margin-bottom:6px;text-align:center}
.pc .pv{color:var(--mut);font-weight:700;margin-bottom:8px}
.pc .blk{width:100%;border-radius:18px 18px 6px 6px;display:grid;place-items:start center;padding-top:14px;font-size:2rem;font-weight:800;color:rgba(255,255,255,.95);height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.medal{font-size:2.2rem;animation:pop .6s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.rest{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.rest span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
.center{text-align:center}
@media (max-width:860px){.setup{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr}.ring{margin:0 auto;width:120px;height:120px}.ring svg{width:120px;height:120px}.opts{grid-template-columns:1fr}.names{grid-template-columns:1fr}.chart{height:240px}.pod{height:280px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}

 else{btn.classList.add('bad');lastGain=0;lastWho=-1;$('fb').style.color='#C0606E';$('fb').textContent='إجابة غير صحيحة؛ لا نقاط هذه المرة.';snd.bad();}

function ranks(){const sorted=G.map((g,i)=>({i,s:g.s})).sort((a,b)=>b.s-a.s);const r=[];let prev=null,rank=0;sorted.forEach((x,k)=>{if(x.s!==prev){rank=k+1;prev=x.s;}r[x.i]=rank;});return r;}
function showRes(){const max=Math.max(1000,...G.map(g=>g.s));const rk=ranks();const ch=$('chart'),nm=$('names2');ch.innerHTML='';nm.innerHTML='';

 G.forEach((g,i)=>{const c=document.createElement('div');c.className='col'+(i===lastWho?' win':'');const b=document.createElement('div');b.className='bar';b.style.background='linear-gradient(180deg,'+g.c+'cc,'+g.c+')';
  const sc=document.createElement('div');sc.className='sc';sc.textContent=g.s;b.appendChild(sc);const pl=document.createElement('div');pl.className='plus';pl.textContent='+'+(i===lastWho?lastGain:0);b.appendChild(pl);c.appendChild(b);ch.appendChild(c);

 const slots=[1,0,2].filter(k=>k<order.length);const H={0:250,1:185,2:135};const M=['🥇','🥈','🥉'];
 slots.forEach(k=>{const g=order[k];const c=document.createElement('div');c.className='pc';const m=document.createElement('div');m.className='medal';m.textContent=M[k];const w=document.createElement('div');w.className='who';w.textContent=g.name;const v=document.createElement('div');v.className='pv';v.textContent=g.s+' نقطة';
  const b=document.createElement('div');b.className='blk';b.style.background='linear-gradient(180deg,'+g.c+'bb,'+g.c+')';b.textContent=k+1;c.appendChild(m);c.appendChild(w);c.appendChild(v);c.appendChild(b);pod.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=H[k]+'px';}));});
 const rest=$('rest');rest.innerHTML='';order.slice(3).forEach((g,k)=>{const s=document.createElement('span');s.textContent=(k+4)+'. '+g.name+' ('+g.s+')';rest.appendChild(s);});
 $('endSub').textContent=DATA.lessons[S.li].t;show('sEnd');snd.win();confetti();}
function confetti(){const cv=$('cf'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const P=[];for(let i=0;i<90;i++)P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*0.6,r:3+Math.random()*4,vy:0.6+Math.random()*1.1,vx:-0.4+Math.random()*0.8,c:COLORS[i%6],a:Math.random()*6});
 const t0=performance.now();(function f(){const t=performance.now()-t0;x.clearRect(0,0,cv.width,cv.height);x.globalAlpha=t<4500?0.85:Math.max(0,0.85-(t-4500)/1500);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((p.y+p.a*40)/50)*0.3;x.fillStyle=p.c;x.beginPath();x.ellipse(p.x,p.y,p.r,p.r*0.6,p.a,0,7);x.fill();});if(t<6000)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height);})();}
