:root{--bg:#f6f9fc;--card:#fff;--line:#d9e5f0;--pri:#2f5f8f;--soft:#eaf2fb;--ok:#3f7a5a;--okbg:#e6f4ea;--txt:#24324a;--mut:#6b7c93}
*{box-sizing:border-box}
body{margin:0;font-family:T,Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
header{background:var(--soft);border-bottom:1px solid #c9dcf0;padding:14px 16px}
h1{margin:0;font-size:1.15rem;color:var(--pri)}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.mode button{font:inherit;font-weight:700;border:1.5px solid #b7cde3;background:#fff;color:var(--pri);border-radius:22px;padding:7px 18px;cursor:pointer}
.mode button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.explain{font-size:.88rem;color:var(--mut);margin:4px 0}
.now{display:inline-block;margin-top:6px;background:var(--okbg);color:var(--ok);border:1px solid #bfe0c9;border-radius:10px;padding:4px 12px;font-weight:700;font-size:.92rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:260px;max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--pri)}
.tabs button.on{background:var(--soft);border-color:#9fbedc;font-weight:700}
.meta{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;color:var(--mut);margin-bottom:12px}
.meta b{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;background:#f2f7fc;border-bottom:1px solid var(--line);padding:8px 12px}
.ch h3{margin:0;font-size:1rem;color:var(--pri)}
.ch .no{display:inline-block;width:24px;height:24px;line-height:25px;text-align:center;border-radius:50%;background:#fff;border:1px solid #b7cde3;margin-left:6px;font-size:.85rem}
.cp{font:inherit;font-weight:700;background:#fff;border:1.5px solid #9fbedc;color:var(--pri);border-radius:10px;padding:4px 16px;cursor:pointer;min-width:105px}
.cp.done{background:var(--okbg);border-color:#9fd1b0;color:var(--ok)}
pre{margin:0;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:.95rem}
.fb{display:none;padding:8px 12px;border-top:1px dashed var(--line);background:#fffdf5}
.fb textarea{width:100%;min-height:140px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.fb small{color:var(--mut)}
</style>
</head>

n- الطالب: يذكر المصر والكمة والدشداشة واللحية.\n\nالعناصر العمانية (5 دقائق):\n- المعلم: يناقش عناصر الزي العماني في البورتريه.\n- الطالب: يحدد عناصره.\n\nالرسم (25 دقيقة):\n- المعلم: يتابع رسم الوجه وتفاصيله.\n- الطالب: يرسم البورتريه الكاريكاتيري.\n\nالختام (5 دقائق):\n- المعلم: يعرض الأعمال.\n- الطالب: يقيم عمله.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (4) ويسأل: ما الفكرة؟ وكيف خدم الشكل الهندسي الفكرة؟\n- الطالب: يحلل.\n\nتحليل الأعمال (10 دقائق):\n- المعلم: يعرض أعمالًا ويحللها مع الطلبة.\n- الطالب: يحلل.\n\nالعصف الذهني (8 دقائق):\n- المعلم: يدير عصفًا لموضوعات (التلوث البحري، الهدر، السلامة المرورية).\n- الطالب: يختار فكرته.\n\nالتخطيط (12 دقيقة):\n- المعلم: يتابع التخطيط داخل مساحة محددة.\n- الطالب: يخطط لوحته.\n\nالختام (5 دقائق):\n- المعلم: يراجع الأفكار.\n- الطالب: يعرض فكرته.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nالتهيئة (5 دقائق):\n- المعلم: يعرض أعمال الفنان سليم سخي (الشكل 6) ويسأل: كيف أصبحت الكلمة جزءًا من الرسم؟\n- الطالب: يلاحظ تشكيل الحروف.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح اختيار الكلمة المناسبة ورسمها بخطوط هندسية أو حرة.\n- الطالب: يتابع.\n\nالإكمال (22 دقيقة):\n- المعلم: يتابع إكمال اللوحة.\n- الطالب: يضيف الكلمات ويكمل لوحته.\n\nالتقويم (3 دقائق):\n- المعلم: يطرح معايير تقويم.\n- الطالب: يقيم.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتلوين.\n- الطالب: يحفظ لوحته.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nس1 (مستوى الدعم): ما المقصود بالكاريكاتير؟\nالإجابة: رسم يعتمد على المبالغة والسخرية الهادفة للتعبير عن فكرة أو شخصية.\n\nس2 (المستوى المتوقع): ما وظيفة الكاريكاتير في الصحف؟\nالإجابة: التعليق على القضايا والأحداث بأسلوب بصري مؤثر.\n\nس3 (المستوى المتقدم): لماذا تُعد المبالغة أساس الكاريكاتير؟\nالإجابة: لأنها تبرز السمة المقصودة وتلفت الانتباه إلى الفكرة.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nس1 (مستوى الدعم): ما وظيفة الخط الرأسي في رسم الوجه؟\nالإجابة: تحديد التماثل ومواضع أجزاء الوجه.\n\nس2 (المستوى المتوقع): ما الفرق بين الرأس الطبيعي والكاريكاتيري؟\nالإجابة: الكاريكاتيري يبالغ في حجم بعض الأجزاء ومكانها.\n\nس3 (المستوى المتقدم): كيف تختار الجزء الذي تبالغ فيه؟\nالإجابة: بالجزء الأكثر تميزًا في الشخصية.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nس1 (مستوى الدعم): اذكر عنصرين من الزي العماني.\nالإجابة: المصر والكمة.\n\nس2 (المستوى المتوقع): لماذا نضيف التفاصيل في النهاية؟\nالإجابة: لأن البناء العام يجب أن يكون صحيحًا أولًا.\n\nس3 (المستوى المتقدم): حلل شخصية زميل الكاريكاتيرية.\nالإجابة: تحليل معلل.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nس1 (مستوى الدعم): اذكر مجالين لموضوعات الكاريكاتير.\nالإجابة: الصحي والاجتماعي.\n\nس2 (المستوى المتوقع): كيف يخدم الشكل الهندسي الفكرة؟\nالإجابة: يحصر التكوين ويرمز للموضوع (مثلًا دائرة تمثل الأرض).\n\nس3 (المستوى المتقدم): اقترح فكرة كاريكاتيرية عن الهدر الغذائي.\nالإجابة: إجابة إبداعية.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nس1 (مستوى الدعم): من الفنان صاحب الأمثلة في استخدام الكلمات؟\nالإجابة: سليم سخي.\n\nس2 (المستوى المتوقع): ما شروط العبارة الكاريكاتيرية؟\nالإجابة: قصيرة ومعبرة ومناسبة للفكرة.\n\nس3 (المستوى المتقدم): حلل لوحة زميل من حيث التناسب.\nالإجابة: تحليل معلل.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nس1 (مستوى الدعم): اذكر مجالين يتناولهما الكاريكاتير.\nالإجابة: الاجتماعي والصحي (أو الاقتصادي والرياضي).\n\nس2 (المستوى المتوقع): حلل فكرة رسم كاريكاتيري معروض.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): أبدِ رأيك في حدود السخرية في الكاريكاتير.\nالإجابة: رأي معلل يؤكد احترام الأشخاص والقيم.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nس1 (مستوى الدعم): اذكر خطين أساسيين لرسم الوجه.\nالإجابة: الخط الرأسي وخط العينين.\n\nس2 (المستوى المتوقع): صف المبالغة في أحد رسومك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم وضوح الملامح بعد المبالغة.\nالإجابة: تقييم معلل.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nس1 (مستوى الدعم): صف شخصيتك.\  اللونية\n2. الظل والنور\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\n1. النشر\n2. النقد الفني", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nالتعلم القبلي: الألوان الأساسية والثانوية.\n\nالتهيئة:\n- المعلم: يعرض كاريكاتيرًا بالأبيض والأسود وآخر ملونًا ويسأل: أيهما أقوى أثرًا؟\n- الطالب: يقارن.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nالتعلم القبلي: الدائرة اللونية.\n\nالتهيئة:\n- المعلم: ينفذ أمام الطلبة خلفية بلون ووحدة بمكمله ويسأل: ما أثر ذلك؟\n- الطالب: يلاحظ بروز الوحدة.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nالتعلم القبلي: الخطة اللونية.\n\nالتهيئة:\n- المعلم: يسأل: بأي جزء نبدأ: الخلفية أم الشخصية؟\n- الطالب: يقترح الترتيب ويعلل.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nالتعلم القبلي: اللوحة الملونة.\n\nالتهيئة:\n- المعلم: يعرض الشكل (3) ويسأل: ما التفاصيل التي أضافت حيوية؟\n- الطالب: يذكر الظلال والتأثيرات.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nالتعلم القبلي: اللوحة المكتملة.\n\nالتهيئة:\n- المعلم: يسأل: لو نُشرت لوحتك في صحيفة، فما العنوان الذي تضعه؟\n- الطالب: يقترح عنوانًا.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nالتهيئة (5 دقائق):\n- المعلم: يعرض كاريكاتيرًا بالأبيض والأسود وآخر ملونًا ويسأل: أيهما أقوى أثرًا؟\n- الطالب: يقارن.\n\nالدائرة اللونية (12 دقيقة):\n- المعلم: يعرض الدائرة: الأساسية (الأحمر، الأصفر، الأزرق) والثانوية (البرتقالي، البنفسجي، الأخضر) والمتكاملة.\n- الطالب: يدون.\n\nالأدوات (13 دقيقة):\n- المعلم: يقارن بين الحبر والريشة قديمًا والبرامج الرقمية حديثًا.\n- الطالب: يقارن.\n\nتطبيق سريع (5 دقائق):\n- المعلم: يطلب تحديد أزواج متكاملة.\n- الطالب: يحدد.\n\nالختام (5 دقائق):\n- المعلم: يمهد للبيان العملي.\n- الطالب: يختار مجموعة لونية.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nالتهيئة (5 دقائق):\n- المعلم: ينفذ أمام الطلبة خلفية بلون ووحدة بمكمله ويسأل: ما أثر ذلك؟\n- الطالب: يلاحظ بروز الوحدة.\n\nالبيان العملي (10 دقائق):\n- المعلم: ينمذج الخطوة الأولى (اختيار المتكاملة) والتلوين بفرش مختلفة.\n- الطالب: يتابع.\n\nالتجريب (20 دقيقة):\n- المعلم: يتابع تجارب لونية على أجزاء صغيرة.\n- الطالب: يجرب ألوانه.\n\nالختام (5 دقائق):\n- المعلم: يطلب اعتماد الخطة اللونية.\n- الطالب: يعتمد خطته.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: بأي جزء نبدأ: الخلفية أم الشخصية؟\n- الطالب: يقترح الترتيب ويعلل.\n\nالتلوين (28 دقيقة):\n- المعلم: يتابع التلوين ويوجه فرديًا.\n- الطالب: يلون لوحته.\n\nالملاحظة (2 دقيقة):\n- المعلم: يطلب التأمل من بعيد.\n- الطالب: يتأمل.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف.\n- الطالب: ينظف أدواته.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (3) ويسأل: ما التفاصيل التي أضافت حيوية؟\n- الطالب: يذكر الظلال والتأثيرات.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج إضافة ظل على وجه كاريكاتيري.\n- الطالب: يتابع.\n\nالإضافة (25 دقيقة):\n- المعلم: يتابع إضافة التفاصيل.\n- الطالب: يضيف التأثيرات والظل والنور.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يسأل: لو نُشرت لوحتك في صحيفة، فما العنوان الذي تضعه؟\n- الطالب: يقترح عنوانًا.\n\nالمعرض (15 دقيقة):\n- المعلم: ينظم معرضًا ونقدًا.\n- الطالب: يعرض وينقد.\n\nالنشر (10 دقائق):\n- المعلم: يناقش إمكانية النشر في منشور مدرسي أو صحيفة.\n- الطالب: يقترح.\n\nالتلخيص (5 دقائق):\n- المعلم: يطرح أسئلة ختامية.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد للرسوم الكارتونية المصورة.\n- الطالب: يلخص.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nس1 (مستوى الدعم): ما الألوان الأساسية؟\nالإجابة: الأحمر والأصفر والأزرق.\n\nس2 (المستوى المتوقع): ما الألوان المتكاملة؟\nالإجابة: الألوان المتقابلة في الدائرة.\n\nس3 (المستوى المتقدم): قارن بين أداة قديمة وحديثة لإخراج الكاريكاتير.\nالإجابة: الريشة والحبر يدويًا مقابل البرامج الرقمية الأسرع والأسهل في التعديل.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nس1 (مستوى الدعم): لماذا نستخدم المتكاملة للخلفية والوحدات؟\nالإجابة: لإبراز الوحدات بالتباين.\n\nس2 (المستوى المتوقع): لماذا نختار فرشًا بأحجام مختلفة؟\nالإجابة: الكبيرة للمساحات والصغيرة للتفاصيل.\n\nس3 (المستوى المتقدم): حلل خطة زميل اللونية.\nالإجابة: تحليل معلل.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nس1 (مستوى الدعم): ما القيمة المستهدفة في التلوين؟\nالإجابة: التنوع الشكلي اللوني.\n\nس2 (المستوى المتوقع): كيف تتجنب اختلاط الألوان المائية؟\nالإجابة: بانتظار الجفاف بين الطبقات.\n\nس3 (المستوى المتقدم): حلل التنوع في لوحتك.\nالإجابة: تحليل معلل.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nس1 (مستوى الدعم): كيف تضيف ظلًا لوجه؟\nالإجابة: بلون أغمق شفاف في الجهة المعاكسة للضوء.\n\nس2 (المستوى المتوقع): ما أثر التأثيرات اللونية في الخلفية؟\nالإجابة: تمنحها حيوية وعمقًا.\n\nس3 (المستوى المتقدم): اقترح تحسينًا للوحة زميل.\nالإجابة: إجابة معللة.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nس1 (مستوى الدعم): ما معايير نقد اللوحة الكاريكاتيرية؟\nالإجابة: وضوح الفكرة، المبالغة المناسبة، التنوع اللوني.\n\nس2 (المستوى المتوقع): انقد لوحة زميل.\nالإجابة: نقد معلل.\n\nس3 (المستوى المتقدم): اقترح مكانًا لنشر الأعمال.\nالإجابة: إجابة معللة.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nس1 (مستوى الدعم): اذكر لونين متكاملين.\nالإجابة: الأحمر والأخضر.\n\nس2 (المستوى المتوقع): كيف نحصل على البرتقالي؟\nالإجابة: بمزج الأحمر والأصفر.\n\nس3 (المستوى المتقدم): اقترح مجموعة لونية للوحتك وعلل.\nالإجابة: إجابة معللة.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nس1 (مستوى الدعم): ما ألوان خلفيتك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف تجربتك اللونية.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nس1 (مستوى الدعم): ما الفرش التي استخدمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف ترتيب تلوينك.\nالإجابة: إجابة شخصية.\n هائية لإخراج الأعمال الكارتونية\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملًا قبل تحديد الخطوط وبعده ويسأل: ما الفرق؟\n- الطالب: يلاحظ الوضوح.\n\nاللمسات (22 دقيقة):\n- المعلم: يتابع تحديد الخطوط واللمسات.\n- الطالب: يكمل أعماله.\n\nمراجعة الأقران (8 دقائق):\n- المعلم: يوزع بطاقة فحص.\n- الطالب: يفحص عمل زميل.\n\nالختام (5 دقائق):\n- المعلم: يمهد للنشاط الإثرائي الرقمي.\n- الطالب: يقيم.\n\nالحصة 8: نشاط إثرائي: تنفيذ عمل كارتوني بالبرامج الحاسوبية\nالتهيئة (5 دقائق):\n- المعلم: يعرض إطارًا يدويًا ونسخته الرقمية ويسأل: أيهما أسهل في التعديل؟\n- الطالب: يقارن.\n\nالعرض (8 دقائق):\n- المعلم: ينمذج استخدام برنامج رسم أو Canva المرخص.\n- الطالب: يتابع.\n\nالتطبيق (20 دقيقة):\n- المعلم: يتابع التنفيذ في مختبر الحاسوب أو الأجهزة المتاحة.\n- الطالب: ينفذ عملًا رقميًا مبسطًا.\n\nالمقارنة (2 دقيقة):\n- المعلم: يطلب المقارنة.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يذكر بأخلاقيات الاستخدام الرقمي وحقوق الصور.\n- الطالب: يلتزم.\n\nالحصة 9: عرض الأعمال الكارتونية في معرض مدرسي وتسويقها\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننظم معرضًا يجذب الطلبة؟\n- الطالب: يقترح أفكارًا.\n\nالتنظيم (10 دقائق):\n- المعلم: يوزع أدوار تنظيم المعرض.\n- الطالب: يستلم دوره.\n\nالعرض (15 دقيقة):\n- المعلم: يشرف على العرض.\n- الطالب: يعرض أعماله ويشرحها.\n\nالتسويق (5 دقائق):\n- المعلم: يناقش تحويل القصص إلى منشورات.\n- الطالب: يقترح.\n\nالختام (5 دقائق):\n- المعلم: يطلب انطباعات الزوار.\n- الطالب: يدون الانطباعات.\n\nالحصة 10: تقويم وحدة فن الكاريكاتير والكارتون\nالتهيئة (5 دقائق):\n- المعلم: يطلق تحديًا: ارسم في دقيقة وجهًا كاريكاتيريًا بمبالغة واحدة.\n- الطالب: يرسم بسرعة.\n\nالمراجعة التفاعلية (12 دقيقة):\n- المعلم: يدير مسابقة أسئلة على مفاهيم الوحدة.\n- الطالب: يجيب مع مجموعته.\n\nملف الإنجاز (10 دقائق):\n- المعلم: يطلب ترتيب أعمال الوحدة وتقييمها.\n- الطالب: يرتب ويقيم.\n\nأسئلة الكتاب (8 دقائق):\n- المعلم: يطرح أسئلة كتاب الطالب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لوحدة الفسيفساء.\n- الطالب: يحدد هدفًا للتطوير.", "الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة\nس1 (مستوى الدعم): اذكر برنامجًا للرسم الرقمي.\nالإجابة: برنامج رسم رقمي مثل Canva أو برامج الرسوم المتجهة.\n\nس2 (المستوى المتوقع): ما الذي يميز الكارتون العماني؟\nالإجابة: حضور البيئة والهوية العمانية.\n\nس3 (المستوى المتقدم): ما مزايا الرسم الرقمي؟\nالإجابة: سرعة التعديل وسهولة النشر.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\nس1 (مستوى الدعم): ما القيمة المستهدفة؟\nالإجابة: التنوع اللوني.\n\nس2 (المستوى المتوقع): اقترح ألوانًا لقصة تقنية.\nالإجابة: الأزرق والفضي والألوان المضيئة.\n\nس3 (المستوى المتقدم): حلل خطة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: تلوين إطارات القصة الكارتونية (الجزء الأول)\nس1 (مستوى الدعم): لماذا نثبت ألوان الشخصيات؟\nالإجابة: ليتعرفها القارئ بسهولة.\n\nس2 (المستوى المتوقع): بأي ترتيب تلون الإطار؟\nالإجابة: الخلفية ثم الشخصيات ثم التفاصيل.\n\nس3 (المستوى المتقدم): حلل تقدم زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين إطارات القصة الكارتونية (الجزء الثاني) والتأثيرات على الخلفيات\nس1 (مستوى الدعم): كيف توحي بالليل في الخلفية؟\nالإجابة: بألوان زرقاء داكنة وبنفسجية.\n\nس2 (المستوى المتوقع): اذكر تأثيرًا لونيًا للخلفية.\nالإجابة: التدرج أو الرذاذ.\n\nس3 (المستوى المتقدم): حلل التنوع اللوني في قصتك.\nالإجابة: تحليل معلل.\n\nالحصة 5: تلوين غلاف القصة\nس1 (مستوى الدعم): كيف تبرز العنوان؟\nالإجابة: بلون متباين مع الخلفية وحد واضح.\n\nس2 (المستوى المتوقع): هل يجب أن تتطابق ألوان الغلاف مع القصة؟\nالإجابة: نعم لتحقيق الوحدة.\n\nس3 (المستوى المتقدم): حلل غلاف زميل.\nالإجابة: تحليل معلل.\n\nالحصة 6: تلوين البوستر الإعلاني\nس1 (مستوى الدعم): ما أهم مواصفات البوستر الملون؟\nالإجابة: الوضوح والجذب السريع.\n\nس2 (المستوى المتوقع): كيف تختبر وضوح البوستر؟\nالإجابة: بالنظر إليه من مسافة.\n\nس3 (المستوى المتقدم): اقترح تحسينًا لبوستر زميل.\nالإجابة: إجابة معللة.\n\nالحصة 7: اللمسات النهائية لإخراج الأعمال الكارتونية\nس1 (مستوى الدعم): ما فائدة تحديد الخطوط؟\nالإجابة: إبراز الأشكال ووضوحها.\n\nس2 (المستوى المتوقع): اذكر معيارًا من بطاقة الفحص.\nالإجابة: وضوح التسلسل أو ثبات الألوان.\n\nس3 (المستوى المتقدم): حلل إخراج زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: نشاط إثرائي: تنفيذ عمل كارتوني بالبرامج الحاسوبية\nس1 (مستوى الدعم): ما ميزة الطبقات في الرسم الرقمي؟\nالإجابة: تعديل الأجزاء دون التأثير على غيرها.\n\nس2 (المستوى المتوقع): لماذا نحترم حقوق الصور؟\nالإجابة: لأنها ملك أصحابها.\n\nس3 (المستوى المتقدم): قارن بين عملك اليدوي والرقمي.\nالإجابة: مقارنة معللة.\n\nالحصة 9: عرض الأعمال الكارتونية في معرض مدرسي وتسويقها\nس1 (مستوى الدعم): ما أدوار تنظيم المعرض؟\nالإجابة: الترتيب، الشرح، الاستقبال، التوثيق.\n\nس2 (المستوى المتوقع): اقترح طريقة لتسويق القصص.\nالإجابة: نشرها رقميًا أو طباعتها كتيبات.\n\nس3 (المستوى المتقدم): كيف ترتبط القصص المصورة بالصناعات الإبداعية؟\nالإجابة: لأنها منتجات قائمة على الإبداع يمكن تسويقها.\n\nالحصة 10: تقويم وحدة فن الكاريكاتير والكارتون\nس1 (مستوى الدعم): ما الفرق بين الكاريكاتير والكارتون؟\nالإجابة: الكاريكاتير رسم ساخر لفكرة أو شخصية، والكارتون رسوم قصصية مصورة أو متحركة.\n\nس2 (المستوى المتوقع): ما القيمة في تلوين الكاريكاتير؟\nالإجابة: التنوع الشكلي اللوني.\n\nس3 (المستوى المتقدم): صمم سؤالًا لزملائك عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة\nس1 (مستوى الدعم): اذكر فنانًا كارتونيًا عمانيًا عُرض عليك.\nالإجابة: إجابة صحيحة بحسب العرض.\n\nس2 (المستوى المتوقع): قارن بين الرسم اليدوي والرقمي.\nالإجابة: مقارنة معللة.\n\nس3 (المستوى المتقدم): اقترح مشروعًا كارتونيًا عمانيًا.\nالإجابة: إجابة إبداعية.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\nس1 (مستوى الدعم): ما ألوان قصتك الرئيسة؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): علل اختيارك.\nالإجابة: إجابة معللة.\n\nس3 (المستوى المتقدم): قيّم خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تلوين إطارات القصة الكارتونية (الجزء الأول)\nس1 (مستوى الدعم): كم إطارًا لونت؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف ألوان شخصيتك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم نظافتك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين إطارات القصة الكارتونية (الجزء الثاني) والتأثيرات عل الب: يستنتج ضرورة التبسيط.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح التبسيط وتجنب المساحات الصغيرة جدًا.\n- الطالب: يتابع.\n\nالرسم (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرسم التصميم.\n\nالختام (5 دقائق):\n- المعلم: يراجع التصاميم.\n- الطالب: يقيم.\n\nالحصة 3: تقسيم المساحات اللونية في التصميم محققًا التدرج اللوني\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (2) ويسأل: كيف قسم المصمم السماء؟\n- الطالب: يلاحظ أشرطة متدرجة.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح طرق تقسيم المساحات (أشرطة متدرجة، مساحات حرة).\n- الطالب: يتابع.\n\nالتقسيم والتلوين (25 دقيقة):\n- المعلم: يتابع التقسيم والتلوين المبدئي.\n- الطالب: يقسم ويلون.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 4: تكبير التصميم بطريقة المربعات محافظًا على النسب\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننقل تصميمًا صغيرًا إلى مساحة (70×100) سم دون تشويه؟\n- الطالب: يقترح الشبكة.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج الشبكة على التصميم وشبكة مكبرة على السطح (الشكل 3).\n- الطالب: يتابع.\n\nالتكبير (22 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرسم الشبكة وينقل المربعات.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 5: نقل التصميم المكبر إلى مساحة العمل (خشب أو كرتون) وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نعرف لون كل مساحة على اللوح الكبير؟\n- الطالب: يقترح ترقيم المساحات بالألوان.\n\nالنقل (20 دقيقة):\n- المعلم: يتابع النقل والترقيم.\n- الطالب: ينقل التصميم ويرقم المساحات.\n\nالتقويم (10 دقائق):\n- المعلم: يطرح أسئلة الدرس.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لقص السيراميك.\n- الطالب: يجهز لوحه.", "الحصة 1: مفهوم التحليل اللوني واختيار موضوع التصميم (زخرفي أو مشهد طبيعي)\nس1 (مستوى الدعم): ما المقصود بالتحليل اللوني؟\nالإجابة: تقسيم التصميم إلى مساحات لونية محددة.\n\nس2 (المستوى المتوقع): لماذا نحدد عدد الألوان في الفسيفساء؟\nالإجابة: لسهولة التنفيذ وتوفر القطع.\n\nس3 (المستوى المتقدم): اقترح موضوعًا عمانيًا للفسيفساء.\nالإجابة: إجابة إبداعية.\n\nالحصة 2: رسم الخطوط الخارجية للتصميم محققًا التناسب الشكلي بين المساحات\nس1 (مستوى الدعم): لماذا نبسط التصم قطعة.\n\nالتهيئة:\n- المعلم: يسأل: إذا لم يتوفر اللون المطلوب، فما الحل؟\n- الطالب: يقترح أقرب درجة أو خامة بديلة.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nالتعلم القبلي: القطع المفروزة.\n\nالتهيئة:\n- المعلم: يسأل: من أين نبدأ الرص؟\n- الطالب: يقترح البدء بالعنصر الرئيس.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nالتعلم القبلي: العنصر الرئيس المرصوص جزئيًا.\n\nالتهيئة:\n- المعلم: يعرض فسيفساء يتبع فيها الرص انحناء الشكل ويسأل: ماذا أضاف ذلك؟\n- الطالب: يلاحظ الحركة.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nالتعلم القبلي: العناصر المرصوصة.\n\nالتهيئة:\n- المعلم: يسأل: كيف تجعل الخلفية لا تنافس العنصر الرئيس؟\n- الطالب: يقترح ألوانًا أهدأ.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nالتعلم القبلي: العمل المرصوص.\n\nالتهيئة:\n- المعلم: يمرر أصدافًا وخرزًا ويسأل: أين يمكن أن تضيف هذه الخامات لمسة؟\n- الطالب: يقترح مواضع.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nالتعلم القبلي: العمل شبه المكتمل.\n\nالتهيئة:\n- المعلم: يسأل: ما الذي يحدث لقطعة غير مثبتة عند وضع المعجون؟\n- الطالب: يتوقع خروجها.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nالتعلم القبلي: العمل المكتمل تشكيلًا.\n\nالتهيئة:\n- المعلم: يسأل: لماذا يوثق الفنانون مراحل أعمالهم؟\n- الطالب: يذكر التعلم والتسويق.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nالتعلم القبلي: المنتج المشكل.\n\nالتهيئة:\n- المعلم: يعرض عينة بمعجون أبيض وأخرى بداكن ويسأل: أيهما يبرز القطع؟\n- الطالب: يقارن.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورتين: فسيفساء بيزنطية بشخوص وأخرى إسلامية بزخارف نباتية، ويسأل: ما الفرق؟\n- الطالب: يقارن.\n\nالتطور (12 دقيقة):\n- المعلم: يعرض مراحل التطور من المعابد القديمة إلى المساجد والقصور.\n- الطالب: يدون.\n\nالمقارنة (13 دقيقة):\n- المعلم: يطلب مقارنة السمات.\n- الطالب: يقارن.\n\nالتلخيص (5 دقائق):\n- المعلم: يلخص.\n- الطالب: يكمل خريطة ذهنية.\n\nالختام (5 دقائق):\n- المعلم: يمهد لقص السيراميك.\n- الطالب: يذكر سمة.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قط ي الملمسي\nالتهيئة (5 دقائق):\n- المعلم: يمرر أصدافًا وخرزًا ويسأل: أين يمكن أن تضيف هذه الخامات لمسة؟\n- الطالب: يقترح مواضع.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح الإضافة المدروسة دون مبالغة.\n- الطالب: يتابع.\n\nالإضافة (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يضيف الخامات.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الذي يحدث لقطعة غير مثبتة عند وضع المعجون؟\n- الطالب: يتوقع خروجها.\n\nفحص الأقران (10 دقائق):\n- المعلم: يوزع بطاقة فحص.\n- الطالب: يفحص عمل زميل.\n\nالتصحيح (20 دقيقة):\n- المعلم: يتابع.\n- الطالب: يصحح عمله.\n\nالختام (5 دقائق):\n- المعلم: يمهد للإخراج بالمعجون.\n- الطالب: يجهز عمله.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nالتهيئة (5 دقائق):\n- المعلم: يسأل: لماذا يوثق الفنانون مراحل أعمالهم؟\n- الطالب: يذكر التعلم والتسويق.\n\nالتوثيق (10 دقائق):\n- المعلم: يوجه لتصوير المراحل.\n- الطالب: يوثق.\n\nالتقويم (15 دقيقة):\n- المعلم: ينظم عرضًا وتقويمًا.\n- الطالب: يقيم.\n\nأسئلة الكتاب (5 دقائق):\n- المعلم: يطرح سؤالًا من الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لإخراج المنتج.\n- الطالب: يلخص.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nالتهيئة (5 دقائق):\n- المعلم: يعرض عينة بمعجون أبيض وأخرى بداكن ويسأل: أيهما يبرز القطع؟\n- الطالب: يقارن.\n\nطرق الإخراج (10 دقائق):\n- المعلم: يعرض طرق الإخراج (معجون، إطار، تعليق).\n- الطالب: يدون.\n\nاختيار المعجون (15 دقيقة):\n- المعلم: يطلب تجربة ألوان المعجون على عينة.\n- الطالب: يجرب ويختار.\n\nالتخطيط (5 دقائق):\n- المعلم: يطلب كتابة خطة الإخراج.\n- الطالب: يكتب الخطة.\n\nالختام (5 دقائق):\n- المعلم: يمهد للحصة القادمة.\n- الطالب: يحفظ خطته.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nس1 (مستوى الدعم): أين ظهرت الفسيفساء قديمًا؟\nالإجابة: في جدران المعابد القديمة.\n\nس2 (المستوى المتوقع): ما سمة الفسيفساء الإسلامية؟\nالإجابة: الزخارف النباتية والهندسية.\n\nس3 (المستوى المتقدم): لماذا تميزت البيزنطية بالشخوص؟\nالإجابة: لارتباطها بالرسوم الدينية والقصصية.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nس1 (مستوى الدعم): ما أدوات الحماية؟\nالإجابة: النظارات والقفازات.\n\nس2 (المستوى المتوقع): ما الحجم المقترح للقطع؟\nالإجابة: نحو (1) سم مربع.\n\nس3 (المستوى المتقدم): لماذا نقطع بحسب حجم العمل؟\nالإجابة: لتناسب القطع تفاصيل التصميم.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\nس1 (مستوى الدعم): لماذا نفرز القطع؟\nالإجابة: لتسهيل العمل وسرعة اختيار الألوان.\n\nس2 (المستوى المتوقع): كيف نقدر الكمية؟\nالإجابة: بحسب مساحة كل لون في التصميم.\n\nس3 (المستوى المتقدم): اقترح بديلًا للون غير متوفر.\nالإجابة: أقرب درجة أو قطع زجاج أو خامة أخرى.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nس1 (مستوى الدعم): لماذا نترك فواصل متساوية؟\nالإجابة: لتعبئتها بالمعجون لاحقًا ولتحقيق الانتظام.\n\nس2 (المستوى المتوقع): لماذا نبدأ بمركز الاهتمام؟\nالإجابة: لأنه الأهم ويحدد اتجاه الرص.\n\nس3 (المستوى المتقدم): حلل رص زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nس1 (مستوى الدعم): كيف يمنح اتجاه الرص حركة؟\nالإجابة: باتباعه انحناء الشكل.\n\nس2 (المستوى المتوقع): كيف تملأ الزوايا الصغيرة؟\nالإجابة: بقص قطع صغيرة مناسبة.\n\nس3 (المستوى المتقدم): حلل اتجاه الرص لدى زميل.\nالإجابة: تحليل معلل.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nس1 (مستوى الدعم): ما دور الخلفية في الفسيفساء؟\nالإجابة: إبراز العنصر الرئيس.\n\nس2 (المستوى المتوقع): كيف تحقق التدرج في الخلفية؟\nالإجابة: بترتيب الدرجات من الفاتح إلى الداكن.\n\nس3 (المستوى المتقدم): حلل التباين في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nس1 (مستوى الدعم): لماذا نضيف خامات أخرى؟\nالإجابة: لإثراء التنوع اللوني الملمسي.\n\nس2 (المستوى المتوقع): ما خطر الإكثار من الخامات؟\nالإجابة: تشتت العمل وفقدان الوحدة.\n\nس3 (المستوى المتقدم): اقترح خامة من البيئة العمانية.\nالإجابة: الأصداف أو الحصى الملون.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nس1 (مستوى الدعم): لماذا نثبت كل القطع قبل المعجون؟\nالإجابة: حتى لا تتحرك أو تنفصل.\n\nس2 (المستوى المتوقع): اذكر معي تبقية.\n\nالحصة 5: تلوين الشكل المجرد محققًا الانسجام اللوني وعرض أعمال الدرس\nالتعلم القبلي: الشكل المجرد.\n\nالتهيئة:\n- المعلم: يسأل: هل يحتاج العمل التجريدي إلى ألوان واقعية؟\n- الطالب: يناقش.", "الحصة 1: خصائص المدرستين المستقبلية والتجريدية\nالتهيئة (5 دقائق):\n- المعلم: يعرض لوحة مستقبلية لحركة سريعة ويسأل: كيف أظهر الفنان السرعة؟\n- الطالب: يلاحظ التكرار.\n\nالمستقبلية (12 دقيقة):\n- المعلم: يوضح التعبير عن الحركة والسرعة والآلة بالتكرار.\n- الطالب: يدون.\n\nالتجريدية (12 دقيقة):\n- المعلم: يعرض أعمال موندريان (الشكل 1) ويوضح الاختزال.\n- الطالب: يدون.\n\nالمقارنة (6 دقائق):\n- المعلم: يطلب المقارنة.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يطلب اختيار النشاط.\n- الطالب: يختار.\n\nالحصة 2: اختيار الصورة وعمل نسخ منها وقص أجزائها بطريقة مكررة (الكولاج المستقبلي)\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة متسابق ونسخها المقصوصة ويسأل: كيف نصنع منها حركة؟\n- الطالب: يقترح الترتيب المتتابع.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح خطوات النشاط.\n- الطالب: يتابع.\n\nالقص (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يقص الأجزاء.\n\nالختام (5 دقائق):\n- المعلم: يحفظ القطع.\n- الطالب: يرتب قطعه.\n\nالحصة 3: إعادة ترتيب الأجزاء وإلصاقها بأسلوب مستقبلي محققًا الإيقاع الشكلي اللوني\nالتهيئة (5 دقائق):\n- المعلم: يجرب ترتيبين أمام الطلبة ويسأل: أيهما يوحي بحركة أسرع؟\n- الطالب: يقارن.\n\nالترتيب واللصق (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرتب ويلصق.\n\nالعرض (5 دقائق):\n- المعلم: يعرض الأعمال.\n- الطالب: يعرض.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتجريدية.\n- الطالب: يقيم.\n\nالحصة 4: تحويل شكل واقعي إلى شكل تجريدي (جزئي أو كلي)\nالتهيئة (5 دقائق):\n- المعلم: يعرض تجريد الديك للفنانة أميرة المسكرية (الشكل 4) ويسأل: ما الذي بقي من الديك؟\n- الطالب: يحدد الملامح المتبقية.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح التجريد الجزئي والكلي (الشكلان 2، 3).\n- الطالب: يتابع.\n\nالتحويل (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يحول شكله.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 5: تلوين الشكل المجرد محققًا الانسجام اللوني وعرض أعمال الدرس\nالتهيئة ( بالوحشية.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتخطيط.\n- الطالب: يذكر خاصية.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ترسم «القلق» دون أن تكتبه؟\n- الطالب: يقترح خطوطًا ملتوية وألوانًا قوية.\n\nاختيار الشعور (5 دقائق):\n- المعلم: يوجه لاختيار شعور.\n- الطالب: يختار.\n\nالتخطيط (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يخطط عمله (الشكل 5).\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الألوان التي تعبر عن شعورك؟\n- الطالب: يقترح ألوانًا.\n\nالتلوين (28 دقيقة):\n- المعلم: يتابع.\n- الطالب: يلون عمله (الشكل 6).\n\nالتأمل (2 دقيقة):\n- المعلم: يطلب التأمل.\n- الطالب: يتأمل.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف.\n- الطالب: ينظف.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننظم معرضًا يحكي قصة الفن الحديث؟\n- الطالب: يقترح ترتيبًا زمنيًا.\n\nالتنظيم (10 دقائق):\n- المعلم: يوزع الأدوار.\n- الطالب: يستلم دوره.\n\nالعرض (15 دقيقة):\n- المعلم: يشرف على العرض.\n- الطالب: يعرض ويشرح.\n\nلعبة التمييز (5 دقائق):\n- المعلم: يطلب من الزوار تحديد مدرسة كل عمل.\n- الطالب: يشارك.\n\nالختام (5 دقائق):\n- المعلم: يجمع الانطباعات.\n- الطالب: يدون.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورًا سريعة ويطلب تحديد المدرسة في ثوانٍ.\n- الطالب: يتسابق في التحديد.\n\nالمراجعة التفاعلية (12 دقيقة):\n- المعلم: يدير مسابقة أسئلة.\n- الطالب: يجيب.\n\nملف الإنجاز (10 دقائق):\n- المعلم: يطلب تقييم أعمال الفصل.\n- الطالب: يقيم.\n\nأسئلة الكتاب (8 دقائق):\n- المعلم: يطرح أسئلة الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يختم الفصل الدراسي بتحفيز.\n- الطالب: يحدد هدفه.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nس1 (مستوى الدعم): ما أبرز خصائص الوحشية؟\nالإجابة: الألوان الصريحة الجريئة والتضاد.\n\nس2 (المستوى المتوقع): من رائد الوحشية؟\nالإجابة: ماتيس.\n\nس3 (المستوى المتقدم): لماذا سميت بالوحشية؟\nالإجابة: لجرأة ألوانها وخروجها عن المألوف.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى الدعم): ما قياس التخطيط؟\nالإجابة: (15×20) سم.\n\nس2 (المستوى المتوقع): لماذا نبسط الأشكال في الوحشية؟\nالإجابة: لترك المجال للون الصريح.\n\nس3 (المستوى المتقدم): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nس1 (مستوى الدعم): ما التضاد اللوني؟\nالإجابة: تجاور ألوان متقابلة في الدائرة اللونية.\n\nس2 (المستوى المتوقع): اذكر زوجًا متضادًا.\nالإجابة: الأزرق والبرتقالي.\n\nس3 (المستوى المتقدم): حلل خطة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nس1 (مستوى الدعم): ما القيمة المستهدفة؟\nالإجابة: التضاد اللوني.\n\nس2 (المستوى المتوقع): كيف تلون المساحات الوحشية؟\nالإجابة: بألوان صريحة مسطحة متضادة.\n\nس3 (المستوى المتقدم): حلل تلوين زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nس1 (مستوى الدعم): ما معيار نجاح العمل الوحشي؟\nالإجابة: جرأة اللون والتضاد والتبسيط.\n\nس2 (المستوى المتوقع): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nس3 (المستوى المتقدم): اقترح تحسينًا.\nالإجابة: إجابة معللة.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nس1 (مستوى الدعم): بماذا تهتم التعبيرية؟\nالإجابة: بالتعبير عن المشاعر الداخلية.\n\nس2 (المستوى المتوقع): من فنان تعبيري شهير؟\nالإجابة: مونخ.\n\nس3 (المستوى المتقدم): ما الفرق بين الوحشية والتعبيرية؟\nالإجابة: الوحشية تهتم بجمال اللون، والتعبيرية بالمشاعر الداخلية.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nس1 (مستوى الدعم): كيف تعبر الخطوط عن الشعور؟\nالإجابة: الملتوية للقلق والهادئة للسكينة.\n\nس2 (المستوى المتوقع): ما القيمة المستهدفة في التخطيط؟\nالإجابة: التناسب الشكلي مع الأرضية.\n\nس3 (المستوى المتقدم): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nس1 (مستوى الدعم): ما القيمة المستهدفة؟\nالإجابة: الانسجام اللوني.\n\nس2 (المستوى المتوقع): كيف يعبر اللون عن الشعور؟\nالإجابة: بارتباط الألوان بالأحاسيس (الأحمر للانفعال، الأزرق للهدوء).\n\nس3 (المستوى المتقدم): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nس1 (مستوى الدعم): رتب المدارس زمنيًا.\nالإجابة: الواقعية، التأثيرية، الوحشية والتعبيرية، التكعيبية، المستقبلية، التجريدية، السريالية.\n\nس2 (المستوى المتوقع): ما دورك في المعرض؟\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): حدد مدرسة عمل معروض.\nالإجابة: إجابة صحيحة.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nس1 (مستوى الدعم): ما المدرسة التي تعبر عن الأحلام؟\nالإجابة: السريالية.\n\nس2 (المستوى المتوقع): ما المدرسة التي تعتمد الألوان الصريحة؟\nالإجابة: الوحشية.\n\nس3 (المستوى المتقدم): صمم سؤالًا عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nس1 (مستوى الدعم): اذكر خاصيتين للوحشية.\nالإجابة: الألوان الصريحة والتبسيط.\n\nس2 (المستوى المتوقع): حلل لوحة لماتيس.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): أبدِ رأيك في جرأة اللون.\nالإجابة: رأي معلل.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى الدعم): ما موضوعك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف التبسيط.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nس1 (مستوى الدعم): ما أزواجك المتضادة؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف خطتك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم جرأة خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nس1 (مستوى الدعم): صف ألوانك.\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): أين ظهر التضاد؟\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nس1 (مستوى الدعم): ما خاصية الوحشية في عملك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): اقترح عنوانًا.\nالإجابة: إجابة إبداعية.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nس1 (مستوى الدعم): اذكر خاصية للتعبيرية.\nالإجابة: التحريف للتعبير عن المشاعر.\n\nس2 (المستوى المتوقع): حلل لوحة لمونخ.\nالإجابة: تحليل صحيح.\n\nس3 (المستوى المتقدم): أبدِ رأيك في التعبيرية.\nالإجابة: رأي معلل.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nس1 (مستوى الدعم): ما شعورك المختار؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صف تخطيطك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nس1 (مستوى الدعم): صف ألوانك.\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): ما الشعور الذي عبرت عنه؟\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nس1 (مستوى الدعم): ما أكثر مدرسة أحببتها؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس2 (المستوى المتوقع): قيّم تنظيم المعرض.\nالإجابة: تقييم معلل.\n\nس3 (المستوى المتقدم): اقترح فكرة لمعرض قادم.\nالإجابة: إجابة إبداعية.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nس1 (مستوى الدعم): اذكر خاصية للتكعيبية.\nالإجابة: تعدد زوايا النظر.\n\nس2 (المستوى المتوقع): احكم على أفضل أعمالك في الفصل.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): حدد هدفًا للفصل القادم.\nالإجابة: إجابة شخصية.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nإرشاد للطالب: يتأمل لوحات ماتيس.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 52–53.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nإرشاد للطالب: يلاحظ الألوان المتضادة حوله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nإرشاد للطالب: يحتفظ بعمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 52–53.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nإرشاد للطالب: يتأمل علاقة الفن بالمشاعر.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nإرشاد للطالب: يعبر عن مشاعره بطرق صحية.\nإرشاد لولي الأمر: يستمع لابنه ويحاوره.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nإرشاد للطالب: يشارك أسرته صور المعرض.\nإرشاد لولي الأمر: يحضر المعرض إن أمكن.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 39–54.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nإرشاد للطالب: يراجع ملف إنجازه.\nإرشاد لولي الأمر: يطلع على إنجاز ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 39–54."]}];
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
