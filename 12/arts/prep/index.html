 رسمًا كاريكاتيريًا عن ازدحام الطرق ويسأل: ماذا يريد الرسام أن يقول دون كلمات كثيرة؟\n- الطالب: يستنتج الفكرة والرسالة.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nالتعلم القبلي: مفهوم الكاريكاتير.\n\nالتهيئة:\n- المعلم: يرسم وجهًا طبيعيًا ثم يكبر الأنف ويصغر الذقن ويسأل: هل ما زال الوجه معروفًا؟ لماذا؟\n- الطالب: يلاحظ أن الملامح المميزة باقية.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nالتعلم القبلي: الخطوط الأساسية ورسم الرؤوس.\n\nالتهيئة:\n- المعلم: يعرض الشكل (3) ويسأل: ما الذي يدل على أن الشخصية عمانية؟\n- الطالب: يذكر المصر والكمة والدشداشة واللحية.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nالتعلم القبلي: رسم الشخصيات الكاريكاتيرية.\n\nالتهيئة:\n- المعلم: يعرض الشكل (4) ويسأل: ما الفكرة؟ وكيف خدم الشكل الهندسي الفكرة؟\n- الطالب: يحلل.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nالتعلم القبلي: التخطيط المبدئي للوحة.\n\nالتهيئة:\n- المعلم: يعرض أعمال الفنان سليم سخي (الشكل 6) ويسأل: كيف أصبحت الكلمة جزءًا من الرسم؟\n- الطالب: يلاحظ تشكيل الحروف.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nالتهيئة (5 دقائق):\n- المعلم: يعرض رسمًا كاريكاتيريًا عن ازدحام الطرق ويسأل: ماذا يريد الرسام أن يقول دون كلمات كثيرة؟\n- الطالب: يستنتج الفكرة والرسالة.\n\nالمفهوم (12 دقيقة):\n- المعلم: يوضح الكاريكاتير بوصفه رسمًا يعتمد المبالغة والسخرية الهادفة لنقل فكرة.\n- الطالب: يصوغ التعريف.\n\nالتطور (13 دقيقة):\n- المعلم: يعرض أمثلة تاريخية ومعاصرة ويطلب ترتيبها ومقارنتها.\n- الطالب: يرتب ويستنتج مراحل التطور.\n\nالتحليل (5 دقائق):\n- المعلم: يطلب تحليل رسم كاريكاتيري معاصر.\n- الطالب: يحدد الفكرة وعناصر المبالغة.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم الوجه الكاريكاتيري.\n- الطالب: يذكر خاصية للكاريكاتير.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nالتهيئة (5 دقائق):\n- المعلم: يرسم وجهًا طبيعيًا ثم يكبر الأنف ويصغر الذقن ويسأل: هل ما زال الوجه معروفًا؟ لماذا؟\n- الطالب: يلاحظ أن الملامح المميزة باقية.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج الخطوط الأساسية: الخط الرأسي، خطوط العيون والأنف والفم (الشكل 2).\n- الطالب: يتابع.\n\nالتطبيق (22 دقيقة):\n- المعلم: يتابع رسم مجموعة رؤوس بمبالغات مختلفة.\n- الطالب: يرسم رؤوسًا بخطوط أساسية ومبالغات.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقارن بين المبالغات.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (3) ويسأل: ما الذي يدل على أن الشخصية عمانية؟\n- الطالب: يذكر المصر والكمة والدشداشة واللحية.\n\nالعناصر العمانية (5 دقائق):\n- المعلم: يناقش عناصر الزي العماني في البورتريه.\n- الطالب: يحدد عناصره.\n\nالرسم (25 دقيقة):\n- المعلم: يتابع رسم الوجه وتفاصيله.\n- الطالب: يرسم البورتريه الكاريكاتيري.\n\nالختام (5 دقائق):\n- المعلم: يعرض الأعمال.\n- الطالب: يقيم عمله.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (4) ويسأل: ما الفكرة؟ وكيف خدم الشكل الهندسي الفكرة؟\n- الطالب: يحلل.\n\nتحليل الأعمال (10 دقائق):\n- المعلم: يعرض أعمالًا ويحللها مع الطلبة.\n- الطالب: يحلل.\n\nالعصف الذهني (8 دقائق):\n- المعلم: يدير عصفًا لموضوعات (التلوث البحري، الهدر، السلامة المرورية).\n- الطالب: يختار فكرته.\n\nالتخطيط (12 دقيقة):\n- المعلم: يتابع التخطيط داخل مساحة محددة.\n- الطالب: يخطط لوحته.\n\nالختام (5 دقائق):\n- المعلم: يراجع الأفكار.\n- الطالب: يعرض فكرته.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nالتهيئة (5 دقائق):\n- المعلم: يعرض أعمال الفنان سليم سخي (الشكل 6) ويسأل: كيف أصبحت الكلمة جزءًا من الرسم؟\n- الطالب: يلاحظ تشكيل الحروف.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح اختيار الكلمة المناسبة ورسمها بخطوط هندسية أو حرة.\n- الطالب: يتابع.\n\nالإكمال (22 دقيقة):\n- المعلم: يتابع إكمال اللوحة.\n- الطالب: يضيف الكلمات ويكمل لوحته.\n\nالتقويم (3 دقائق):\n- المعلم: يطرح معايير تقويم.\n- الطالب: يقيم.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتلوين.\n- الطالب: يحفظ لوحته.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nس1 (مستوى المعرفة): ما المقصود بالكاريكاتير؟\nالإجابة: رسم يعتمد على المبالغة والسخرية الهادفة للتعبير عن فكرة أو شخصية.\n\nس2 (مستوى التطبيق): ما وظيفة الكاريكاتير في الصحف؟\nالإجابة: التعليق على القضايا والأحداث بأسلوب بصري مؤثر.\n\nس3 (مستوى الاستدلال): لماذا تُعد المبالغة أساس الكاريكاتير؟\nالإجابة: لأنها تبرز السمة المقصودة وتلفت الانتباه إلى الفكرة.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nس1 (مستوى المعرفة): ما وظيفة الخط الرأسي في رسم الوجه؟\nالإجابة: تحديد التماثل ومواضع أجزاء الوجه.\n\nس2 (مستوى التطبيق): ما الفرق بين الرأس الطبيعي والكاريكاتيري؟\nالإجابة: الكاريكاتيري يبالغ في حجم بعض الأجزاء ومكانها.\n\nس3 (مستوى الاستدلال): كيف تختار الجزء الذي تبالغ فيه؟\nالإجابة: بالجزء الأكثر تميزًا في الشخصية.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nس1 (مستوى المعرفة): اذكر عنصرين من الزي العماني.\nالإجابة: المصر والكمة.\n\nس2 (مستوى التطبيق): لماذا نضيف التفاصيل في النهاية؟\nالإجابة: لأن البناء العام يجب أن يكون صحيحًا أولًا.\n\nس3 (مستوى الاستدلال): حلل شخصية زميل الكاريكاتيرية.\nالإجابة: تحليل معلل.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nس1 (مستوى المعرفة): اذكر مجالين لموضوعات الكاريكاتير.\nالإجابة: الصحي والاجتماعي.\n\nس2 (مستوى التطبيق): كيف يخدم الشكل الهندسي الفكرة؟\nالإجابة: يحصر التكوين ويرمز للموضوع (مثلًا دائرة تمثل الأرض).\n\nس3 (مستوى الاستدلال): اقترح فكرة كاريكاتيرية عن الهدر الغذائي.\nالإجابة: إجابة إبداعية.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nس1 (مستوى المعرفة): من الفنان صاحب الأمثلة في استخدام الكلمات؟\nالإجابة: سليم سخي.\n\nس2 (مستوى التطبيق): ما شروط العبارة الكاريكاتيرية؟\nالإجابة: قصيرة ومعبرة ومناسبة للفكرة.\n\nس3 (مستوى الاستدلال): حلل لوحة زميل من حيث التناسب.\nالإجابة: تحليل معلل.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nس1 (مستوى المعرفة): اذكر مجالين يتناولهما الكاريكاتير.\nالإجابة: الاجتماعي والصحي (أو الاقتصادي والرياضي).\n\nس2 (مستوى التطبيق): حلل فكرة رسم كاريكاتيري معروض.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في حدود السخرية في الكاريكاتير.\nالإجا ل والنور.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يسأل: لو نُشرت لوحتك في صحيفة، فما العنوان الذي تضعه؟\n- الطالب: يقترح عنوانًا.\n\nالمعرض (15 دقيقة):\n- المعلم: ينظم معرضًا ونقدًا.\n- الطالب: يعرض وينقد.\n\nالنشر (10 دقائق):\n- المعلم: يناقش إمكانية النشر في منشور مدرسي أو صحيفة.\n- الطالب: يقترح.\n\nالتلخيص (5 دقائق):\n- المعلم: يطرح أسئلة ختامية.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد للرسوم الكارتونية المصورة.\n- الطالب: يلخص.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nس1 (مستوى المعرفة): ما الألوان الأساسية؟\nالإجابة: الأحمر والأصفر والأزرق.\n\nس2 (مستوى التطبيق): ما الألوان المتكاملة؟\nالإجابة: الألوان المتقابلة في الدائرة.\n\nس3 (مستوى الاستدلال): قارن بين أداة قديمة وحديثة لإخراج الكاريكاتير.\nالإجابة: الريشة والحبر يدويًا مقابل البرامج الرقمية الأسرع والأسهل في التعديل.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nس1 (مستوى المعرفة): لماذا نستخدم المتكاملة للخلفية والوحدات؟\nالإجابة: لإبراز الوحدات بالتباين.\n\nس2 (مستوى التطبيق): لماذا نختار فرشًا بأحجام مختلفة؟\nالإجابة: الكبيرة للمساحات والصغيرة للتفاصيل.\n\nس3 (مستوى الاستدلال): حلل خطة زميل اللونية.\nالإجابة: تحليل معلل.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nس1 (مستوى المعرفة): ما القيمة المستهدفة في التلوين؟\nالإجابة: التنوع الشكلي اللوني.\n\nس2 (مستوى التطبيق): كيف تتجنب اختلاط الألوان المائية؟\nالإجابة: بانتظار الجفاف بين الطبقات.\n\nس3 (مستوى الاستدلال): حلل التنوع في لوحتك.\nالإجابة: تحليل معلل.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nس1 (مستوى المعرفة): كيف تضيف ظلًا لوجه؟\nالإجابة: بلون أغمق شفاف في الجهة المعاكسة للضوء.\n\nس2 (مستوى التطبيق): ما أثر التأثيرات اللونية في الخلفية؟\nالإجابة: تمنحها حيوية وعمقًا.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا للوحة زميل.\nالإجابة: إجابة معللة.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nس1 (مستوى المعرفة) لإعلاني.", "الحصة 1: مفهوم القصة الكارتونية المصورة وتخطيط مساحات القصة والعناوين\nالتهيئة (5 دقائق):\n- المعلم: يعرض صفحة قصة مصورة ويسأل: كيف تعرف ترتيب قراءة الأحداث؟\n- الطالب: يلاحظ الإطارات والاتجاه.\n\nالمفهوم (10 دقائق):\n- المعلم: يوضح عناصر القصة المصورة: الإطارات، الشخصيات، السيناريو، العنوان.\n- الطالب: يدون.\n\nاختيار الموضوع (8 دقائق):\n- المعلم: يطلب اختيار موضوع تاريخي أو شعبي أو تقني.\n- الطالب: يختار موضوعه.\n\nتخطيط المساحات (12 دقيقة):\n- المعلم: يعرض الشكل (1) ويتابع تخطيط المساحات.\n- الطالب: يخطط مساحات قصته.\n\nالختام (5 دقائق):\n- المعلم: يراجع التخطيطات.\n- الطالب: يعرض.\n\nالحصة 2: رسم أحداث القصة وشخصياتها في المساحات المحددة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نجعل القارئ يعرف الشخصية في كل إطار؟\n- الطالب: يقترح ثبات الملامح والملابس.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح تنويع اللقطات (قريبة، بعيدة).\n- الطالب: يتابع.\n\nالرسم (25 دقيقة):\n- المعلم: يتابع رسم الأحداث.\n- الطالب: يرسم الأحداث والشخصيات.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 3: أشكال كتابة السيناريو والتخطيط النهائي للقصة\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (3) ويسأل: ما الفرق بين فقاعة الكلام وفقاعة التفكير؟\n- الطالب: يلاحظ الشكل.\n\nأشكال الفقاعات (8 دقائق):\n- المعلم: يوضح أنواع الفقاعات (كلام، تفكير، صراخ، تعليق).\n- الطالب: يتابع.\n\nالكتابة والتخطيط (22 دقيقة):\n- المعلم: يتابع إضافة السيناريو والعنوان.\n- الطالب: يكمل التخطيط النهائي.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 4: تصميم غلاف القصة الكارتونية المصورة\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكلين (5، 6) ويسأل: ما الذي يجعلك تشتري قصة من غلافها؟\n- الطالب: يذكر العنوان والشخصية والألوان.\n\nالتحليل (5 دقائق):\n- المعلم: يحلل عناصر الغلاف الناجح.\n- الطالب: يحدد العناصر.\n\nالتصميم (25 دقيقة):\n- المعلم: يتابع التصميم.\n- الطالب: يصمم غلافه.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 5: تصميم البوستر الإعلاني للقصة الكارتونية\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكلين (7، 8) ويسأل: ما الفرق بين الغلاف والبو بة: إجابة إبداعية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/arts/?l=4", "س1 (مستوى المعرفة): اذكر عنصرين للقصة المصورة.\nالإجابة: الإطارات والسيناريو.\n\nس2 (مستوى التطبيق): احكم على أفضل أعمالك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): حدد هدفًا لتطوير مهاراتك.\nالإجابة: إجابة شخصية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/arts/?l=4", "إرشاد للطالب: يراجع ملف إنجازه.\nإرشاد لولي الأمر: يطلع على ملف إنجاز ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 12–28.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/arts/?l=4"]}], "comb": ["الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة\n1. يتعرف بعض فناني الرسم الكارتوني في سلطنة عمان.\n2. يذكر أهم البرامج المستخدمة في الرسم الكارتوني.\nمخرج آخر: يقدر الإنتاج الكارتوني العماني.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\n1. يختار الألوان المناسبة من الدائرة اللونية لتحقيق التنوع اللوني.\n2. يضع خطة لونية للقصة والغلاف والبوستر.\nمخرج آخر: يربط الألوان بطبيعة الموضوع.\n\nالحصة 3: تلوين إطارات القصة الكارتونية (الجزء الأول)\n1. يلون إطارات القصة بالألوان المائية.\n2. يحافظ على ثبات ألوان الشخصيات.\nمخرج آخر: يهتم بالنظافة.\n\nالحصة 4: تلوين إطارات القصة الكارتونية (الجزء الثاني) والتأثيرات على الخلفيات\n1. يكمل تلوين إطارات القصة.\n2. يضيف تأثيرات لونية على الخلفيات.\nمخرج آخر: يحقق التنوع اللوني.\n\nالحصة 5: تلوين غلاف القصة\n1. يلون غلاف القصة بالألوان المائية.\n2. يبرز العنوان والشخصيات بالتباين اللوني.\nمخرج آخر: يحقق التنوع اللوني.\n\nالحصة 6: تلوين البوستر الإعلاني\n1. يلون البوستر الإعلاني بالألوان المائية.\n2. يحقق الجذب البصري بالتنوع اللوني.\nمخرج آخر: يهتم بالإتقان.\n\nالحصة 7: اللمسات النهائية لإخراج الأعمال الكارتونية\n1. يضيف اللمسات النهائية لإخراج القصة والغلاف والبوستر.\n2. يحدد الخطوط النهائية بالأقلام المناسبة.\nمخرج آخر: يتقن الإخراج.\n\nالحصة 8: نشاط إثرائي: تنفيذ عمل كارتوني بالبرامج الحاسوبية\n1. يستخدم برنا  يدويًا ونسخته الرقمية ويسأل: أيهما أسهل في التعديل؟\n- الطالب: يقارن.\n\nالعرض (8 دقائق):\n- المعلم: ينمذج استخدام برنامج رسم أو Canva المرخص.\n- الطالب: يتابع.\n\nالتطبيق (20 دقيقة):\n- المعلم: يتابع التنفيذ في مختبر الحاسوب أو الأجهزة المتاحة.\n- الطالب: ينفذ عملًا رقميًا مبسطًا.\n\nالمقارنة (2 دقيقة):\n- المعلم: يطلب المقارنة.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يذكر بأخلاقيات الاستخدام الرقمي وحقوق الصور.\n- الطالب: يلتزم.\n\nالحصة 9: عرض الأعمال الكارتونية في معرض مدرسي وتسويقها\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننظم معرضًا يجذب الطلبة؟\n- الطالب: يقترح أفكارًا.\n\nالتنظيم (10 دقائق):\n- المعلم: يوزع أدوار تنظيم المعرض.\n- الطالب: يستلم دوره.\n\nالعرض (15 دقيقة):\n- المعلم: يشرف على العرض.\n- الطالب: يعرض أعماله ويشرحها.\n\nالتسويق (5 دقائق):\n- المعلم: يناقش تحويل القصص إلى منشورات.\n- الطالب: يقترح.\n\nالختام (5 دقائق):\n- المعلم: يطلب انطباعات الزوار.\n- الطالب: يدون الانطباعات.\n\nالحصة 10: تقويم وحدة فن الكاريكاتير والكارتون\nالتهيئة (5 دقائق):\n- المعلم: يطلق تحديًا: ارسم في دقيقة وجهًا كاريكاتيريًا بمبالغة واحدة.\n- الطالب: يرسم بسرعة.\n\nالمراجعة التفاعلية (12 دقيقة):\n- المعلم: يدير مسابقة أسئلة على مفاهيم الوحدة.\n- الطالب: يجيب مع مجموعته.\n\nملف الإنجاز (10 دقائق):\n- المعلم: يطلب ترتيب أعمال الوحدة وتقييمها.\n- الطالب: يرتب ويقيم.\n\nأسئلة الكتاب (8 دقائق):\n- المعلم: يطرح أسئلة كتاب الطالب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لوحدة الفسيفساء.\n- الطالب: يحدد هدفًا للتطوير.", "الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة\nس1 (مستوى المعرفة): اذكر برنامجًا للرسم الرقمي.\nالإجابة: برنامج رسم رقمي مثل Canva أو برامج الرسوم المتجهة.\n\nس2 (مستوى التطبيق): ما الذي يميز الكارتون العماني؟\nالإجابة: حضور البيئة والهوية العمانية.\n\nس3 (مستوى الاستدلال): ما مزايا الرسم الرقمي؟\nالإجابة: سرعة التعديل وسهولة النشر.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\nس1 (مستوى المعرفة): ما القيمة المستهدفة؟\nالإجابة: التنوع اللوني.\n\nس2 (مستوى التطبيق): اقترح لفنان؟\n- الطالب: يقدر عدد الألوان.\n\nالمفهوم (12 دقيقة):\n- المعلم: يوضح التحليل اللوني: تقسيم الصورة إلى مساحات لونية محددة قابلة للتنفيذ.\n- الطالب: يدون.\n\nاختيار الموضوع (13 دقيقة):\n- المعلم: يعرض الشكل (1) ويوجه للاختيار.\n- الطالب: يختار موضوعه.\n\nالتبرير (5 دقائق):\n- المعلم: يطلب تبرير مناسبة الموضوع.\n- الطالب: يبرر.\n\nالختام (5 دقائق):\n- المعلم: يمهد لرسم الخطوط الخارجية.\n- الطالب: يحفظ اختياره.\n\nالحصة 2: رسم الخطوط الخارجية للتصميم محققًا التناسب الشكلي بين المساحات\nالتهيئة (5 دقائق):\n- المعلم: يسأل: هل يمكن تنفيذ تفاصيل رموش العين بقطع سيراميك (1×1) سم؟\n- الطالب: يستنتج ضرورة التبسيط.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح التبسيط وتجنب المساحات الصغيرة جدًا.\n- الطالب: يتابع.\n\nالرسم (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرسم التصميم.\n\nالختام (5 دقائق):\n- المعلم: يراجع التصاميم.\n- الطالب: يقيم.\n\nالحصة 3: تقسيم المساحات اللونية في التصميم محققًا التدرج اللوني\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (2) ويسأل: كيف قسم المصمم السماء؟\n- الطالب: يلاحظ أشرطة متدرجة.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح طرق تقسيم المساحات (أشرطة متدرجة، مساحات حرة).\n- الطالب: يتابع.\n\nالتقسيم والتلوين (25 دقيقة):\n- المعلم: يتابع التقسيم والتلوين المبدئي.\n- الطالب: يقسم ويلون.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 4: تكبير التصميم بطريقة المربعات محافظًا على النسب\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننقل تصميمًا صغيرًا إلى مساحة (70×100) سم دون تشويه؟\n- الطالب: يقترح الشبكة.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج الشبكة على التصميم وشبكة مكبرة على السطح (الشكل 3).\n- الطالب: يتابع.\n\nالتكبير (22 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرسم الشبكة وينقل المربعات.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 5: نقل التصميم المكبر إلى مساحة العمل (خشب أو كرتون) وتقويم الدرس\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف نعرف لون كل مساحة على اللوح الكبير؟\n- الطالب: يقترح ترقيم المساحات بالألوان.\n\nالنقل (20 دقيقة):\n- المعلم: يتابع النقل والترقيم.\n- الطالب: ينقل التصميم ويرقم المساحات.\n\nالتقويم (10 دقا ://afuq-edu.github.io/afuq/q/12/arts/?l=7"]}], "comb": ["الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\n1. يتعرف مراحل تطور فن الفسيفساء في العصور المختلفة.\n2. يميز سمات الفسيفساء الإسلامية والبيزنطية.\nمخرج آخر: يقدر الفسيفساء فنًا تراثيًا.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\n1. يقطع بلاطات السيراميك لقطع مناسبة لحجم العمل (نحو 1 سم²).\n2. يطبق قواعد الأمن والسلامة.\nمخرج آخر: يتعاون في تنظيم العمل.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\n1. يفرز قطع السيراميك في علب بحسب الألوان والدرجات.\n2. يطابق الألوان المتوفرة مع خطة التصميم.\nمخرج آخر: يتعاون مع مجموعته.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\n1. يرص قطع السيراميك بجانب بعضها لتعبئة المساحات الرئيسة.\n2. يحافظ على فواصل منتظمة بين القطع.\nمخرج آخر: يحقق قيمة التنوع اللوني الملمسي.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\n1. يرص القطع حول الحواف والتفاصيل.\n2. يوجه اتجاه الرص ليتبع شكل العنصر.\nمخرج آخر: يقص قطعًا صغيرة لملء الزوايا.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\n1. يعبئ مساحات الخلفية برص متدرج.\n2. يحقق التدرج اللوني في الخلفية.\nمخرج آخر: يحافظ على التباين بين الشكل والخلفية.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\n1. يضيف خامات أخرى (زجاج، أصداف، خرز) لإثراء التنوع.\n2. يحقق قيمة التنوع اللوني الملمسي.\nمخرج آخر: يبتكر في توظيف الخامات.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\n1. يراجع العمل ويصحح الفراغات والقطع غير المثبتة.\n2. يقيم انتظام الرص.\nمخرج آخر: يتقبل ملاحظات زملائه.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\n1. يقيم منتج الفسيفساء في مرحلة التشكيل.\n2. يوثق مراحل عمله بالصور.\nمخرج آخر: يقدر قيمة العمل التعاوني.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\n1. يعدد طرق الإخراج الفني لمنتج الفسيفساء.\n2. يختار لون المعجون المناسب لعمله.\nمخرج آخر: يخطط لخطوات الإخراج.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nالمخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق القطع؟\n- الطالب: يقارن.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورتين: فسيفساء بيزنطية بشخوص وأخرى إسلامية بزخارف نباتية، ويسأل: ما الفرق؟\n- الطالب: يقارن.\n\nالتطور (12 دقيقة):\n- المعلم: يعرض مراحل التطور من المعابد القديمة إلى المساجد والقصور.\n- الطالب: يدون.\n\nالمقارنة (13 دقيقة):\n- المعلم: يطلب مقارنة السمات.\n- الطالب: يقارن.\n\nالتلخيص (5 دقائق):\n- المعلم: يلخص.\n- الطالب: يكمل خريطة ذهنية.\n\nالختام (5 دقائق):\n- المعلم: يمهد لقص السيراميك.\n- الطالب: يذكر سمة.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nالتهيئة (5 دقائق):\n- المعلم: يعرض قاطع السيراميك ويسأل: ما الخطر المحتمل؟\n- الطالب: يذكر الشظايا والحواف الحادة.\n\nالسلامة والنمذجة (10 دقائق):\n- المعلم: يوضح ارتداء النظارات والقفازات وينمذج القطع (الشكل 1).\n- الطالب: يتابع.\n\nالتقطيع (20 دقيقة):\n- المعلم: يتابع.\n- الطالب: يقطع السيراميك.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف الآمن.\n- الطالب: يجمع الشظايا.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\nالتهيئة (5 دقائق):\n- المعلم: يسأل: إذا لم يتوفر اللون المطلوب، فما الحل؟\n- الطالب: يقترح أقرب درجة أو خامة بديلة.\n\nالفرز (10 دقائق):\n- المعلم: يتابع الفرز.\n- الطالب: يفرز القطع.\n\nالمطابقة (15 دقيقة):\n- المعلم: يطلب مطابقة القطع مع التصميم وحساب الكميات.\n- الطالب: يطابق ويحسب.\n\nالتكميل (5 دقائق):\n- المعلم: يتابع قطع الألوان الناقصة.\n- الطالب: يكمل.\n\nالختام (5 دقائق):\n- المعلم: يمهد للرص.\n- الطالب: ينظم علبه.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nالتهيئة (5 دقائق):\n- المعلم: يسأل: من أين نبدأ الرص؟\n- الطالب: يقترح البدء بالعنصر الرئيس.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج الرص مع ترك فواصل متساوية (الشكل 2).\n- الطالب: يتابع.\n\nالرص (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرص قطع العنصر الرئيس.\n\nالختام (5 دقائق):\n- المعلم: يوجه لحفظ العمل.\n- الطالب: يحفظ.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nالتهيئة (5 دقائق):\n- المعلم: يعرض فسيفساء يتبع فيها الرص انحناء الشكل ويسأل: ماذا أضاف ذلك؟\n- الطالب: يلاحظ الحركة.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح رص القطع موازية للحواف.\n- الطالب: يتابع.\n\nالرص (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرص الحواف والتفاصيل.\n\nالختام (5 دقائق):\n- المعلم: يحفظ الأعمال.\n- الطالب: يحفظ.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف تجعل الخلفية لا تنافس العنصر الرئيس؟\n- الطالب: يقترح ألوانًا أهدأ.\n\nتعبئة الخلفية (30 دقيقة):\n- المعلم: يتابع الرص المتدرج.\n- الطالب: يعبئ الخلفية.\n\nالختام (5 دقائق):\n- المعلم: يحفظ الأعمال.\n- الطالب: يحفظ.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nالتهيئة (5 دقائق):\n- المعلم: يمرر أصدافًا وخرزًا ويسأل: أين يمكن أن تضيف هذه الخامات لمسة؟\n- الطالب: يقترح مواضع.\n\nالتوضيح (5 دقائق):\n- المعلم: يوضح الإضافة المدروسة دون مبالغة.\n- الطالب: يتابع.\n\nالإضافة (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يضيف الخامات.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الذي يحدث لقطعة غير مثبتة عند وضع المعجون؟\n- الطالب: يتوقع خروجها.\n\nفحص الأقران (10 دقائق):\n- المعلم: يوزع بطاقة فحص.\n- الطالب: يفحص عمل زميل.\n\nالتصحيح (20 دقيقة):\n- المعلم: يتابع.\n- الطالب: يصحح عمله.\n\nالختام (5 دقائق):\n- المعلم: يمهد للإخراج بالمعجون.\n- الطالب: يجهز عمله.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nالتهيئة (5 دقائق):\n- المعلم: يسأل: لماذا يوثق الفنانون مراحل أعمالهم؟\n- الطالب: يذكر التعلم والتسويق.\n\nالتوثيق (10 دقائق):\n- المعلم: يوجه لتصوير المراحل.\n- الطالب: يوثق.\n\nالتقويم (15 دقيقة):\n- المعلم: ينظم عرضًا وتقويمًا.\n- الطالب: يقيم.\n\nأسئلة الكتاب (5 دقائق):\n- المعلم: يطرح سؤالًا من الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لإخراج المنتج.\n- الطالب: يلخص.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nالتهيئة (5 دقائق):\n- المعلم: يعرض عينة بمعجون أبيض وأخرى بداكن ويسأل: أيهما يبرز القطع؟\n- الطالب: يقارن.\n\nطرق الإخراج (10 دقائق):\n- المعلم: يعرض طرق الإخراج (معجون، إطار، تعليق).\n- الطالب: يدون.\n\nاختيار المعجون (15 دقيقة):\n- المعلم: يطلب تجربة ألوان المعجون على عينة.\n- الطالب: يجرب ويختار.\n\nالتخطيط (5 دقائق):\n- المعلم: يطلب كتابة خطة الإخراج.\n- الطالب: يكتب الخطة.\n\nالختام (5 دقائق):\n- المعلم: يمهد للحصة القادمة.\n- الطالب: يحفظ خطته.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nس1 (مستوى المعرفة): أين ظهرت الفسيفساء قديمًا؟\nالإجابة: في جدران المعابد القديمة.\n\nس2 (مستوى التطبيق): ما سمة الفسيفساء الإسلامية؟\nالإجابة: الزخارف النباتية والهندسية.\n\nس3 (مستوى الاستدلال): لماذا تميزت البيزنطية بالشخوص؟\nالإجابة: لارتباطها بالرسوم الدينية والقصصية.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nس1 (مستوى المعرفة): ما أدوات الحماية؟\nالإجابة: النظارات والقفازات.\n\nس2 (مستوى التطبيق): ما الحجم المقترح للقطع؟\nالإجابة: نحو (1) سم مربع.\n\nس3 (مستوى الاستدلال): لماذا نقطع بحسب حجم العمل؟\nالإجابة: لتناسب القطع تفاصيل التصميم.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\nس1 (مستوى المعرفة): لماذا نفرز القطع؟\nالإجابة: لتسهيل العمل وسرعة اختيار الألوان.\n\nس2 (مستوى التطبيق): كيف نقدر الكمية؟\nالإجابة: بحسب مساحة كل لون في التصميم.\n\nس3 (مستوى الاستدلال): اقترح بديلًا للون غير متوفر.\nالإجابة: أقرب درجة أو قطع زجاج أو خامة أخرى.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nس1 (مستوى المعرفة): لماذا نترك فواصل متساوية؟\nالإجابة: لتعبئتها بالمعجون لاحقًا ولتحقيق الانتظام.\n\nس2 (مستوى التطبيق): لماذا نبدأ بمركز الاهتمام؟\nالإجابة: لأنه الأهم ويحدد اتجاه الرص.\n\nس3 (مستوى الاستدلال): حلل رص زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nس1 (مستوى المعرفة): كيف يمنح اتجاه الرص حركة؟\nالإجابة: باتباعه انحناء الشكل.\n\nس2 (مستوى التطبيق): كيف تملأ الزوايا الصغيرة؟\nالإجابة: بقص قطع صغيرة مناسبة.\n\nس3 (مستوى الاستدلال): حلل اتجاه الرص لدى زميل.\nالإجابة: تحليل معلل.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nس1 (مستوى المعرفة): ما دور الخلفية في الفسيفساء؟\nالإجابة: إبراز العنصر الرئيس.\n\nس2 (مستوى التطبيق): كيف تحقق التدرج في الخلفية؟\nالإجابة: بترتيب الدرجات من الفاتح إلى الداكن.\n\nس3 (مستوى الاستدلال): حلل التباين في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nس1 (مستوى المعرفة): لماذا نضيف خامات أخرى؟\nالإجابة: لإثراء التنوع اللوني الملمسي.\n\nس2 (مستوى التطبيق): ما خطر الإكثار من الخامات؟\nالإجابة: تشتت العمل وفقدان الوحدة.\n\nس3 (مستوى الاستدلال): اقترح خامة من البيئة العمانية.\nالإجابة: الأصداف أو الحصى الملون.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nس1 (مستوى المعرفة): لماذا نثبت كل القطع قبل المعجون؟\nالإجابة: حتى لا تتحرك أو تنفصل.\n\nس2 (مستوى التطبيق): اذكر معيارًا من بطاقة الفحص.\nالإجابة: انتظام الفواصل.\n\nس3 (مستوى الاستدلال): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nس1 (مستوى المعرفة): ما فائدة التوثيق؟\nالإجابة: حفظ المراحل وتسويق العمل.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة؟\nالإجابة: التنوع اللوني الملمسي.\n\nس3 (مستوى الاستدلال): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nس1 (مستوى المعرفة): ما وظيفة المعجون؟\nالإجابة: سد المسامات بين القطع وتثبيتها.\n\nس2 (مستوى التطبيق): كيف يؤثر لون المعجون؟\nالإجابة: الداكن يبرز القطع الفاتحة، والفاتح يبرز الداكنة.\n\nس3 (مستوى الاستدلال): اقترح طريقة إخراج لعملك.\nالإجابة: إجابة معللة.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nس1 (مستوى المعرفة): اذكر مكانًا تستخدم فيه الفسيفساء.\nالإجابة: المساجد والقصور.\n\nس2 (مستوى التطبيق): قارن بين النوعين.\nالإجابة: مقارنة صحيحة.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في الفسيفساء المعاصرة.\nالإجابة: رأي معلل.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nس1 (مستوى المعرفة): اذكر قاعدة سلامة.\nالإجابة: ارتداء النظارات.\n\nس2 (مستوى التطبيق): صف طريقة القطع.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التزامك بالسلامة.\nالإجابة: تقييم معلل.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\nس1 (مستوى المعرفة): كم لونًا فرزت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف عملية المطابقة.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم تنظيمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nس1 (مستوى المعرفة): ما العنصر الذي بدأت به؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف انتظام فواصلك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تقدمك.\nالإجابة: تقييم معلل.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nس1 (مستوى المعرفة): صف اتجاه رصك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما الصعوبة التي واجهتها؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم دقة الحواف.\nالإجابة: تقييم معلل.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nس1 (مستوى المعرفة): ما ألوان خلفيتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التدرج.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التباين.\nالإجابة: تقييم معلل.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nس1 (مستوى المعرفة): ماذا أضفت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف أثرها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التنوع.\nالإجابة: تقييم معلل.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nس1 (مستوى المعرفة): ما الذي صححته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف ملاحظة زميلك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم جاهزية عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nس1 (مستوى المعرفة): اذكر مراحل التشكيل.\nالإجابة: التقطيع، الفرز، الرص، الإضافة، المراجعة.\n\nس2 (مستوى التطبيق): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا.\nالإجابة: إجابة معللة.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nس1 (مستوى المعرفة): اذكر طريقتين للإخراج.\nالإجابة: المعجون والإطار.\n\nس2 (مستوى التطبيق): ما لون معجونك؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): قيّم خطتك.\nالإجابة: تقييم معلل.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nإرشاد للطالب: يلاحظ الفسيفساء في المباني.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 35.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nإرشاد للطالب: يلتزم بالسلامة \nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع\nالتهيئة (5 دقائق):\n- المعلم: يسأل: متى ننظف المعجون الزائد؟\n- الطالب: يجيب قبل جفافه التام.\n\nالتنظيف (28 دقيقة):\n- المعلم: يتابع.\n- الطالب: ينظف المنتج.\n\nالتأمل (2 دقيقة):\n- المعلم: يطلب التأمل.\n- الطالب: يتأمل.\n\nالختام (5 دقائق):\n- المعلم: يحفظ الأعمال لتجف.\n- الطالب: يحفظ.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار)\nالتهيئة (5 دقائق):\n- المعلم: يعرض منتجًا بإطار وآخر بدونه ويسأل: أيهما يبدو أكثر احترافية؟\n- الطالب: يقارن.\n\nالتشطيب (28 دقيقة):\n- المعلم: يتابع.\n- الطالب: يشطب منتجه.\n\nالمراجعة (2 دقيقة):\n- المعلم: يراجع.\n- الطالب: يراجع.\n\nالختام (5 دقائق):\n- المعلم: يمهد للعرض.\n- الطالب: يجهز منتجه.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كم تقدر سعر منتجك؟ وعلى أي أساس؟\n- الطالب: يقدر ويعلل.\n\nالمعرض (15 دقيقة):\n- المعلم: ينظم المعرض.\n- الطالب: يعرض ويشرح.\n\nالتسويق (10 دقائق):\n- المعلم: يناقش التسعير وقنوات البيع.\n- الطالب: يكتب بطاقة تسويق.\n\nالانطباعات (5 دقائق):\n- المعلم: يجمع الانطباعات.\n- الطالب: يدون.\n\nالختام (5 دقائق):\n- المعلم: يمهد لتقويم الوحدة.\n- الطالب: يلخص.\n\nالحصة 5: تقويم وحدة فن الفسيفساء\nالتهيئة (5 دقائق):\n- المعلم: يطلق تحديًا: رتب مراحل إنتاج الفسيفساء في أسرع وقت.\n- الطالب: يرتب مع مجموعته.\n\nالمراجعة التفاعلية (12 دقيقة):\n- المعلم: يدير مسابقة أسئلة.\n- الطالب: يجيب.\n\nملف الإنجاز (10 دقائق):\n- المعلم: يطلب تقييم أعمال الوحدة.\n- الطالب: يقيم.\n\nأسئلة الكتاب (8 دقائق):\n- المعلم: يطرح أسئلة الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يمهد لوحدة الفن الحديث.\n- الطالب: يحدد هدفًا.", "الحصة 1: تحضير المعجون وسد المسامات بين قطع السيراميك\nس1 (مستوى المعرفة): ما أداة توزيع المعجون؟\nالإجابة: سكين المعجون أو الفرشاة.\n\nس2 (مستوى التطبيق): لماذا نرتدي القفازات؟\nالإجابة: لحماية اليدين من المعجون الإسمنتي.\n\nس3 (مستوى الاستدلال): حلل تغطية زميل للمسامات.\nالإجابة: تحليل معلل.\n\nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع\nس1 (مستوى المعرفة): لماذا ننظف قبل الجفاف التام؟\nالإجابة: لسهولة إزالة المعجون الزائد.\n\nس2 (مستوى التطبيق): ماذا نستخدم للتنظيف؟\nالإجابة: قطع القماش والإسفنج.\n\nس3 (مستوى الاستدلال): حلل وضوح القطع في عملك.\nالإجابة: تحليل معلل.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار)\nس1 (مستوى المعرفة): ما فائدة الإطار؟\nالإجابة: حماية الحواف وإبراز العمل.\n\nس2 (مستوى التطبيق): كيف تلمع السطح؟\nالإجابة: بمسحه بقماش جاف نظيف.\n\nس3 (مستوى الاستدلال): حلل تشطيب زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها\nس1 (مستوى المعرفة): ما أسس تسعير المنتج الفني؟\nالإجابة: تكلفة الخامات والوقت والجودة والإبداع.\n\nس2 (مستوى التطبيق): اقترح قناة لبيع الفسيفساء.\nالإجابة: متجر إلكتروني أو معرض حرفي.\n\nس3 (مستوى الاستدلال): كيف ترتبط الفسيفساء بالصناعات الإبداعية؟\nالإجابة: منتجات إبداعية قابلة للتسويق.\n\nالحصة 5: تقويم وحدة فن الفسيفساء\nس1 (مستوى المعرفة): رتب مراحل الفسيفساء.\nالإجابة: التصميم، التحليل اللوني، التكبير، التقطيع، الرص، المعجون، التنظيف.\n\nس2 (مستوى التطبيق): ما سمة الفسيفساء البيزنطية؟\nالإجابة: الشخوص والرسوم القصصية.\n\nس3 (مستوى الاستدلال): صمم سؤالًا عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: تحضير المعجون وسد المسامات بين قطع السيراميك\nس1 (مستوى المعرفة): ما لون معجونك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف طريقتك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التغطية.\nالإجابة: تقييم معلل.\n\nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع\nس1 (مستوى المعرفة): صف خطوات التنظيف.\nالإجابة: إجابة صحيحة.\n\nس2 (مستوى التطبيق): ما الذي ظهر بعد التنظيف؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار)\nس1 (مستوى المعرفة): ما نوع إطارك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التشطيب.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم إخراجك.\nالإجابة: تقييم معلل.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها\nس1 (مستوى المعرفة): ما سعر منتجك المقترح؟\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): صف بطاقة التسويق.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلا  الطالب: يقترح استخدام إطار مقصوص.\n\nالإطار (5 دقائق):\n- المعلم: يوضح استخدام إطار ورقي لاختيار جزء من اللوحة.\n- الطالب: يحدد الجزء.\n\nالتخطيط (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يخطط مشهده.\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 4: تلوين التكوين بالأكريليك وفق أسلوب المدرسة المختارة\nالتهيئة (5 دقائق):\n- المعلم: يعرض لوحة «ليلة النجوم» لفان جوخ ويسأل: كيف رسم السماء؟\n- الطالب: يلاحظ اللمسات الدوامية.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج التعامل مع الأكريليك (سرعة الجفاف، المزج).\n- الطالب: يتابع.\n\nالتلوين (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يلون عمله.\n\nالختام (5 دقائق):\n- المعلم: يوجه لتنظيف الفرش فورًا.\n- الطالب: ينظف.\n\nالحصة 5: إخراج العمل وعرضه ونقده في ضوء خصائص المدرسة\nالتهيئة (5 دقائق):\n- المعلم: يسأل: هل نجحت في نقل روح المدرسة؟ كيف تعرف؟\n- الطالب: يذكر المعايير.\n\nالإخراج (10 دقائق):\n- المعلم: يتابع.\n- الطالب: يخرج عمله.\n\nالعرض والنقد (15 دقيقة):\n- المعلم: ينظم عرضًا ونقدًا.\n- الطالب: يعرض وينقد.\n\nالتلخيص (5 دقائق):\n- المعلم: يلخص.\n- الطالب: يكمل الخط الزمني.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتكعيبية والسريالية.\n- الطالب: يلخص.", "الحصة 1: المدرسة الواقعية وخصائصها وأبرز فنانيها\nس1 (مستوى المعرفة): بماذا اهتمت المدرسة الواقعية؟\nالإجابة: بتصوير الحياة اليومية بصدق ودقة.\n\nس2 (مستوى التطبيق): ما الفرق بين الواقعية والكلاسيكية؟\nالإجابة: الواقعية صورت عامة الناس، والكلاسيكية الموضوعات المثالية والتاريخية.\n\nس3 (مستوى الاستدلال): لماذا ظهرت الواقعية؟\nالإجابة: للتعبير عن واقع المجتمع وقضاياه.\n\nالحصة 2: من الواقعية إلى التأثيرية: المقارنة واختيار التجربة الفنية\nس1 (مستوى المعرفة): ما الفرق في اللمسة بين المدرستين؟\nالإجابة: الواقعية ناعمة دقيقة والتأثيرية سريعة ظاهرة.\n\nس2 (مستوى التطبيق): أي المدرستين أكثر اهتمامًا بالضوء؟\nالإجابة: التأثيرية.\n\nس3 (مستوى الاستدلال): لماذا تعد التأثيرية بداية الفن الحديث؟\nالإجابة: لأنها تحررت من الدقة الأكاديمية.\n\nالحصة 3: تخطيط مشهد بالقلم الرصاص (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى المعرفة): ما قياس التخطيط؟\nالإجابة: (15×20) : خصائص المدرستين التكعيبية والسريالية وأبرز فنانيهما\nالتهيئة (5 دقائق):\n- المعلم: يعرض بورتريه لبيكاسو ويسأل: كم زاوية ترى منها الوجه؟\n- الطالب: يلاحظ تعدد الزوايا.\n\nالتكعيبية (12 دقيقة):\n- المعلم: يوضح تحليل الأشكال إلى أشكال هندسية وتعدد زوايا النظر.\n- الطالب: يدون.\n\nالسريالية (12 دقيقة):\n- المعلم: يوضح التعبير عن الأحلام واللاوعي عند دالي.\n- الطالب: يدون.\n\nالمقارنة (6 دقائق):\n- المعلم: يطلب المقارنة.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يمهد لاختيار النشاط.\n- الطالب: يختار.\n\nالحصة 2: التدرب على رسم أجزاء الوجه بالأسلوب التكعيبي\nالتهيئة (5 دقائق):\n- المعلم: يرسم عينًا من الأمام وأنفًا من الجانب في وجه واحد ويسأل: ما الذي تغير؟\n- الطالب: يلاحظ تعدد الزوايا.\n\nالنمذجة (8 دقائق):\n- المعلم: ينمذج رسم أجزاء الوجه تكعيبيًا (الشكل 1).\n- الطالب: يتابع.\n\nالتدرب (22 دقيقة):\n- المعلم: يتابع.\n- الطالب: يتدرب على الأجزاء ويرسم الخط الخارجي.\n\nالختام (5 دقائق):\n- المعلم: يعرض نماذج.\n- الطالب: يقيم.\n\nالحصة 3: رسم وتلوين وجه تكعيبي أو لوحة سريالية مبتكرة\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكل (8) لوحة مستوحاة من دالي ويسأل: ما الذي غيّره الطالب؟\n- الطالب: يحدد التغييرات.\n\nالتنفيذ (28 دقيقة):\n- المعلم: يتابع.\n- الطالب: يرسم ويلون عمله.\n\nالتأمل (2 دقيقة):\n- المعلم: يطلب التأمل.\n- الطالب: يتأمل.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف.\n- الطالب: ينظف.\n\nالحصة 4: أفكار مبتكرة لتطبيق الأسلوب التكعيبي (الأكواب الورقية، الجرائد، الأسلاك)\nالتهيئة (5 دقائق):\n- المعلم: يعرض الشكلين (5، 6) ويسأل: هل يمكن أن يباع كوب عليه وجه تكعيبي؟\n- الطالب: يناقش.\n\nالأفكار (5 دقائق):\n- المعلم: يعرض الأفكار.\n- الطالب: يختار فكرته.\n\nالتنفيذ (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: ينفذ فكرته.\n\nالختام (5 دقائق):\n- المعلم: يناقش القيمة التسويقية.\n- الطالب: يقترح استخدامًا.\n\nالحصة 5: عرض أعمال التكعيبية والسريالية ونقدها\nالتهيئة (5 دقائق):\n- المعلم: يسأل: هل يمكن معرفة المدرسة من العمل دون أن تخبرنا؟\n- الطالب: يناقش.\n\nالعرض والنقد (20 دقيقة):\n- المعلم: ينظم عرضًا ونقدًا.\n- الطالب: يعرض وينقد.\n\nالتلخيص (10 دقائق):\n- المعلم ده\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الذي يجعل العمل «وحشيًا» حقًا؟\n- الطالب: يذكر الجرأة والتضاد.\n\nالإخراج (10 دقائق):\n- المعلم: يتابع.\n- الطالب: يخرج عمله.\n\nالنقد (15 دقيقة):\n- المعلم: ينظم نقدًا.\n- الطالب: ينقد.\n\nالتمهيد (5 دقائق):\n- المعلم: يمهد للتعبيرية.\n- الطالب: يتابع.\n\nالختام (5 دقائق):\n- المعلم: يلخص.\n- الطالب: يلخص.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nالتهيئة (5 دقائق):\n- المعلم: يعرض لوحة «الصرخة» لمونخ ويسأل: ما الشعور الذي تثيره؟\n- الطالب: يصف الشعور.\n\nالخصائص (12 دقيقة):\n- المعلم: يوضح: التعبير عن المشاعر الداخلية بالتحريف والألوان القوية.\n- الطالب: يدون.\n\nالتحليل (13 دقيقة):\n- المعلم: يطلب تحليل أعمال مونخ (الشكل 4).\n- الطالب: يحلل.\n\nالمقارنة (5 دقائق):\n- المعلم: يقارن بالوحشية.\n- الطالب: يقارن.\n\nالختام (5 دقائق):\n- المعلم: يمهد للتخطيط.\n- الطالب: يذكر خاصية.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ترسم «القلق» دون أن تكتبه؟\n- الطالب: يقترح خطوطًا ملتوية وألوانًا قوية.\n\nاختيار الشعور (5 دقائق):\n- المعلم: يوجه لاختيار شعور.\n- الطالب: يختار.\n\nالتخطيط (25 دقيقة):\n- المعلم: يتابع.\n- الطالب: يخطط عمله (الشكل 5).\n\nالختام (5 دقائق):\n- المعلم: يراجع.\n- الطالب: يقيم.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الألوان التي تعبر عن شعورك؟\n- الطالب: يقترح ألوانًا.\n\nالتلوين (28 دقيقة):\n- المعلم: يتابع.\n- الطالب: يلون عمله (الشكل 6).\n\nالتأمل (2 دقيقة):\n- المعلم: يطلب التأمل.\n- الطالب: يتأمل.\n\nالختام (5 دقائق):\n- المعلم: يوجه للتنظيف.\n- الطالب: ينظف.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nالتهيئة (5 دقائق):\n- المعلم: يسأل: كيف ننظم معرضًا يحكي قصة الفن الحديث؟\n- الطالب: يقترح ترتيبًا زمنيًا.\n\nالتنظيم (10 دقائق):\n- المعلم: يوزع الأدوار.\n- الطالب: يستلم دوره.\n\nالعرض (15 دقيقة):\n- المعلم: يشرف على العرض.\n- الطالب: يعرض ويشرح.\n\nلعبة التمييز (5 دقائق):\n- المعلم: يطلب من الزوار تحديد مدرسة كل عمل.\n- الطالب: يشارك.\n\nالختام (5 دقائق):\n- المعلم: يجمع الانطباعات.\n- الطالب: يدون.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورًا سريعة ويطلب تحديد المدرسة في ثوانٍ.\n- الطالب: يتسابق في التحديد.\n\nالمراجعة التفاعلية (12 دقيقة):\n- المعلم: يدير مسابقة أسئلة.\n- الطالب: يجيب.\n\nملف الإنجاز (10 دقائق):\n- المعلم: يطلب تقييم أعمال الفصل.\n- الطالب: يقيم.\n\nأسئلة الكتاب (8 دقائق):\n- المعلم: يطرح أسئلة الكتاب.\n- الطالب: يجيب.\n\nالختام (5 دقائق):\n- المعلم: يختم الفصل الدراسي بتحفيز.\n- الطالب: يحدد هدفه.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nس1 (مستوى المعرفة): ما أبرز خصائص الوحشية؟\nالإجابة: الألوان الصريحة الجريئة والتضاد.\n\nس2 (مستوى التطبيق): من رائد الوحشية؟\nالإجابة: ماتيس.\n\nس3 (مستوى الاستدلال): لماذا سميت بالوحشية؟\nالإجابة: لجرأة ألوانها وخروجها عن المألوف.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى المعرفة): ما قياس التخطيط؟\nالإجابة: (15×20) سم.\n\nس2 (مستوى التطبيق): لماذا نبسط الأشكال في الوحشية؟\nالإجابة: لترك المجال للون الصريح.\n\nس3 (مستوى الاستدلال): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nس1 (مستوى المعرفة): ما التضاد اللوني؟\nالإجابة: تجاور ألوان متقابلة في الدائرة اللونية.\n\nس2 (مستوى التطبيق): اذكر زوجًا متضادًا.\nالإجابة: الأزرق والبرتقالي.\n\nس3 (مستوى الاستدلال): حلل خطة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nس1 (مستوى المعرفة): ما القيمة المستهدفة؟\nالإجابة: التضاد اللوني.\n\nس2 (مستوى التطبيق): كيف تلون المساحات الوحشية؟\nالإجابة: بألوان صريحة مسطحة متضادة.\n\nس3 (مستوى الاستدلال): حلل تلوين زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nس1 (مستوى المعرفة): ما معيار نجاح العمل الوحشي؟\nالإجابة: جرأة اللون والتضاد والتبسيط.\n\nس2 (مستوى التطبيق): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا.\nالإجابة: إجابة معللة.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nس1 (مستوى المعرفة): بماذا تهتم التعبيرية؟\nالإجابة: بالتعبير عن المشاعر الداخلية.\n\nس2 (مستوى التطبيق): من فنان تعبيري شهير؟\nالإجابة: مونخ.\n\nس3 (مستوى الاستدلال): ما الفرق بين الوحشية والتعبيرية؟\nالإجابة: الوحشية تهتم بجمال اللون، والتعبيرية بالمشاعر الداخلية.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nس1 (مستوى المعرفة): كيف تعبر الخطوط عن الشعور؟\nالإجابة: الملتوية للقلق والهادئة للسكينة.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة في التخطيط؟\nالإجابة: التناسب الشكلي مع الأرضية.\n\nس3 (مستوى الاستدلال): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nس1 (مستوى المعرفة): ما القيمة المستهدفة؟\nالإجابة: الانسجام اللوني.\n\nس2 (مستوى التطبيق): كيف يعبر اللون عن الشعور؟\nالإجابة: بارتباط الألوان بالأحاسيس (الأحمر للانفعال، الأزرق للهدوء).\n\nس3 (مستوى الاستدلال): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nس1 (مستوى المعرفة): رتب المدارس زمنيًا.\nالإجابة: الواقعية، التأثيرية، الوحشية والتعبيرية، التكعيبية، المستقبلية، التجريدية، السريالية.\n\nس2 (مستوى التطبيق): ما دورك في المعرض؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): حدد مدرسة عمل معروض.\nالإجابة: إجابة صحيحة.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nس1 (مستوى المعرفة): ما المدرسة التي تعبر عن الأحلام؟\nالإجابة: السريالية.\n\nس2 (مستوى التطبيق): ما المدرسة التي تعتمد الألوان الصريحة؟\nالإجابة: الوحشية.\n\nس3 (مستوى الاستدلال): صمم سؤالًا عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nس1 (مستوى المعرفة): اذكر خاصيتين للوحشية.\nالإجابة: الألوان الصريحة والتبسيط.\n\nس2 (مستوى التطبيق): حلل لوحة لماتيس.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في جرأة اللون.\nالإجابة: رأي معلل.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى المعرفة): ما موضوعك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التبسيط.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nس1 (مستوى المعرفة): ما أزواجك المتضادة؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف خطتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم جرأة خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nس1 (مستوى المعرفة): صف ألوانك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): أين ظهر التضاد؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nس1 (مستوى المعرفة): ما خاصية الوحشية في عملك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا.\nالإجابة: إجابة إبداعية.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nس1 (مستوى المعرفة): اذكر خاصية للتعبيرية.\nالإجابة: التحريف للتعبير عن المشاعر.\n\nس2 (مستوى التطبيق): حلل لوحة لمونخ.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في التعبيرية.\nالإجابة: رأي معلل.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nس1 (مستوى المعرفة): ما شعورك المختار؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف تخطيطك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nس1 (مستوى المعرفة): صف ألوانك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما الشعور الذي عبرت عنه؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nس1 (مستوى المعرفة): ما أكثر مدرسة أحببتها؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): قيّم تنظيم المعرض.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): اقترح فكرة لمعرض قادم.\nالإجابة: إجابة إبداعية.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nس1 (مستوى المعرفة): اذكر خاصية للتكعيبية.\nالإجابة: تعدد زوايا النظر.\n\nس2 (مستوى التطبيق): احكم على أفضل أعمالك في الفصل.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): حدد هدفًا للفصل القادم.\nالإجابة: إجابة شخصية.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nإرشاد للطالب: يتأمل لوحات ماتيس.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 52–53.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nإرشاد للطالب: يلاحظ الألوان المتضادة حوله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nإرشاد للطالب: يحتفظ بعمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 52–53.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nإرشاد للطالب: يتأمل علاقة الفن بالمشاعر.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nإرشاد للطالب: يعبر عن مشاعره بطرق صحية.\nإرشاد لولي الأمر: يستمع لابنه ويحاوره.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nإرشاد للطالب: يشارك أسرته صور المعرض.\nإرشاد لولي الأمر: يحضر المعرض إن أمكن.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 39–54.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nإرشاد للطالب: يراجع ملف إنجازه.\nإرشاد لولي الأمر: يطلع على إنجاز ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 39–54.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/arts/?l=12"]}];
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';

 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;

  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
