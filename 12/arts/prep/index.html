الحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\n1. صورة توضيحية\n2. أخرى: أقلام رصاص، ورق A4، مسطرة\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: أقلام رصاص، ورق A4، مسطرة\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\n1. صورة توضيحية\n2. الكتاب\n3. أخرى: أقلام رصاص، ورق A4، مسطرة", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\n1. الكاريكاتير\n2. المبالغة\n3. السخرية الهادفة\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\n1. الخطوط الأساسية للوجه\n2. المبالغة\n3. النسب\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\n1. البورتريه الكاريكاتيري\n2. الهوية العمانية\n3. الإخراج\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\n1. الفكرة\n2. المساحة المحددة\n3. التخطيط المبدئي\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\n1. الكلمة المرسومة\n2. التناسب الشكلي الخطي", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nالتعلم القبلي: رسم الوجوه والأشخاص في الصفوف السابقة.\nيعرض المعلم رسمًا كاريكاتيريًا عن ازدحام الطرق ويسأل: ماذا يريد الرسام أن يقول دون كلمات كثيرة؟ ويستنتج الطالب الفكرة والرسالة.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nالتعلم القبلي: مفهوم الكاريكاتير.\nيرسم المعلم وجهًا طبيعيًا ثم يكبر الأنف ويصغر الذقن ويسأل: هل ما زال الوجه معروفًا؟ لماذا؟ ويلاحظ الطالب أن الملامح المميزة باقية.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nالتعلم القبلي: الخطوط الأساسية ورسم الرؤوس.\nيعرض المعلم الشكل (3) ويسأل: ما الذي يدل على أن الشخصية عمانية؟ ويذكر الطالب المصر والكمة والدشداشة واللحية.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nالتعلم القبلي: رسم الشخصيات الكاريكاتيرية.\nيعرض المعلم الشكل (4) ويسأل: ما الفكرة؟ وكيف خدم الشكل الهندسي الفكرة؟ ويحلل الطالب.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nالتعلم القبلي: التخطيط المبدئي للوحة.\nيعرض المعلم أعمال الفنان سليم سخي (الشكل 6) ويسأل: كيف أصبحت الكلمة جزءًا من الرسم؟ ويلاحظ الطالب تشكيل الحروف.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم رسمًا كاريكاتيريًا عن ازدحام الطرق ويسأل: ماذا يريد الرسام أن يقول دون كلمات كثيرة؟ ويستنتج الطالب الفكرة والرسالة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المفهوم: يوضح المعلم الكاريكاتير بوصفه رسمًا يعتمد المبالغة والسخرية الهادفة لنقل فكرة، ويصوغ الطالب التعريف (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التطور: يعرض المعلم أمثلة تاريخية ومعاصرة ويطلب ترتيبها ومقارنتها، ويرتب الطالب ويستنتج مراحل التطور (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. التحليل: يطلب المعلم تحليل رسم كاريكاتيري معاصر، ويحدد الطالب الفكرة وعناصر المبالغة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم لرسم الوجه الكاريكاتيري، ويذكر الطالب خاصية للكاريكاتير (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يرسم المعلم وجهًا طبيعيًا ثم يكبر الأنف ويصغر الذقن ويسأل: هل ما زال الوجه معروفًا؟ لماذا؟ ويلاحظ الطالب أن الملامح المميزة باقية (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. النمذجة: ينمذج المعلم الخطوط الأساسية: الخط الرأسي، خطوط العيون والأنف والفم (الشكل 2)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التطبيق: يتابع المعلم رسم مجموعة رؤوس بمبالغات مختلفة، ويرسم الطالب رؤوسًا بخطوط أساسية ومبالغات (22 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يعرض المعلم نماذج، ويقارن الطالب بين المبالغات (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل (3) ويسأل: ما الذي يدل على أن الشخصية عمانية؟ ويذكر الطالب المصر والكمة والدشداشة واللحية (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. العناصر العمانية: يناقش المعلم عناصر الزي العماني في البورتريه، ويحدد الطالب عناصره (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. الرسم: يتابع المعلم رسم الوجه وتفاصيله، ويرسم الطالب البورتريه الكاريكاتيري (25 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يعرض المعلم الأعمال، ويقيم الطالب عمله (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل (4) ويسأل: ما الفكرة؟ وكيف خدم الشكل الهندسي الفكرة؟ ويحلل الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. تحليل الأعمال: يعرض المعلم أعمالًا ويحللها مع الطلبة، ويحلل الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يدير المعلم عصفًا لموضوعات (التلوث البحري، الهدر، السلامة المرورية)، ويختار الطالب فكرته (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. التخطيط: يتابع المعلم التخطيط داخل مساحة محددة، ويخطط الطالب لوحته (12 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n5. الختام: يراجع المعلم الأفكار، ويعرض الطالب فكرته (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم أعمال الفنان سليم سخي (الشكل 6) ويسأل: كيف أصبحت الكلمة جزءًا من الرسم؟ ويلاحظ الطالب تشكيل الحروف (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. التوضيح: يوضح المعلم اختيار الكلمة المناسبة ورسمها بخطوط هندسية أو حرة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. الإكمال: يتابع المعلم إكمال اللوحة، ويضيف الطالب الكلمات ويكمل لوحته (19 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. التقويم: يطرح المعلم معايير تقويم، ويقيم الطالب (3 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الختام: يمهد المعلم للتلوين، ويحفظ الطالب لوحته (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. ختام الدرس – ريشة توعوية: تقترح المجموعات فكرة رسم كاريكاتيري هادف يعالج سلوكًا يمس المجتمع العماني كرمي المخلفات على الشواطئ أو هدر الماء، وتصف شخصياته ورسالته في جملتين (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nس1 (مستوى المعرفة): ما المقصود بالكاريكاتير؟\nالإجابة: رسم يعتمد على المبالغة والسخرية الهادفة للتعبير عن فكرة أو شخصية.\n\nس2 (مستوى التطبيق): ما وظيفة الكاريكاتير في الصحف؟\nالإجابة: التعليق على القضايا والأحداث بأسلوب بصري مؤثر.\n\nس3 (مستوى الاستدلال): لماذا تُعد المبالغة أساس الكاريكاتير؟\nالإجابة: لأنها تبرز السمة المقصودة وتلفت الانتباه إلى الفكرة.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nس1 (مستوى المعرفة): ما وظيفة الخط الرأسي في رسم الوجه؟\nالإجابة: تحديد التماثل ومواضع أجزاء الوجه.\n\nس2 (مستوى التطبيق): ما الفرق بين الرأس الطبيعي والكاريكاتيري؟\nالإجابة: الكاريكاتيري يبالغ في حجم بعض الأجزاء ومكانها.\n\nس3 (مستوى الاستدلال): كيف تختار الجزء الذي تبالغ فيه؟\nالإجابة: بالجزء الأكثر تميزًا في الشخصية.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nس1 (مستوى المعرفة): اذكر عنصرين من الزي العماني.\nالإجابة: المصر والكمة.\n\nس2 (مستوى التطبيق): لماذا نضيف التفاصيل في النهاية؟\nالإجابة: لأن البناء العام يجب أن يكون صحيحًا أولًا.\n\nس3 (مستوى الاستدلال): حلل شخصية زميل الكاريكاتيرية.\nالإجابة: تحليل معلل.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nس1 (مستوى المعرفة): اذكر مجالين لموضوعات الكاريكاتير.\nالإجابة: الصحي والاجتماعي.\n\nس2 (مستوى التطبيق): كيف يخدم الشكل الهندسي الفكرة؟\nالإجابة: يحصر التكوين ويرمز للموضوع (مثلًا دائرة تمثل الأرض).\n\nس3 (مستوى الاستدلال): اقترح فكرة كاريكاتيرية عن الهدر الغذائي.\nالإجابة: إجابة إبداعية.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nس1 (مستوى المعرفة): من الفنان صاحب الأمثلة في استخدام الكلمات؟\nالإجابة: سليم سخي.\n\nس2 (مستوى التطبيق): ما شروط العبارة الكاريكاتيرية؟\nالإجابة: قصيرة ومعبرة ومناسبة للفكرة.\n\nس3 (مستوى الاستدلال): حلل لوحة زميل من حيث التناسب.\nالإجابة: تحليل معلل.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nس1 (مستوى المعرفة): اذكر مجالين يتناولهما الكاريكاتير.\nالإجابة: الاجتماعي والصحي (أو الاقتصادي والرياضي).\n\nس2 (مستوى التطبيق): حلل فكرة رسم كاريكاتيري معروض.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في حدود السخرية في الكاريكاتير.\nالإجابة: رأي معلل يؤكد احترام الأشخاص والقيم.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nس1 (مستوى المعرفة): اذكر خطين أساسيين لرسم الوجه.\nالإجابة: الخط الرأسي وخط العينين.\n\nس2 (مستوى التطبيق): صف المبالغة في أحد رسومك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم وضوح الملامح بعد المبالغة.\nالإجابة: تقييم معلل.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nس1 (مستوى المعرفة): صف شخصيتك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما الجزء الذي بالغت فيه؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم إبراز الهوية في عملك.\nالإجابة: تقييم معلل.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nس1 (مستوى المعرفة): ما فكرة لوحتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف المساحة التي اخترتها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم وضوح فكرتك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إضافة الكلمات والعبارات وإكمال اللوحة الكاريكاتيرية\nس1 (مستوى المعرفة): ما الكلمة التي أضفتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف كيف رسمتها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم لوحتك.\nالإجابة: تقييم معلل.", "الحصة 1: مفهوم فن الكاريكاتير ومراحل تطوره عبر العصور\nإرشاد للطالب: يتابع رسومًا كاريكاتيرية هادفة في الصحف المحلية.\nإرشاد لولي الأمر: يناقش ابنه في رسائل الكاريكاتير المجتمعية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 12–13.\n\nالحصة 2: الخطوط الأساسية لرسم الوجه والفرق بين الرأس الطبيعي والمبالغ فيه\nإرشاد للطالب: يلاحظ الملامح المميزة في الوجوه.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 14.\n\nالحصة 3: رسم كاريكاتير لوجه عماني (بورتريه) بتفاصيله النهائية\nإرشاد للطالب: يتأمل رسوم فنانين كاريكاتيريين عمانيين.\nإرشاد لولي الأمر: يشجع ابنه على تطوير أسلوبه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 14–15.\n\nالحصة 4: البحث عن فكرة وتحليل أعمال كاريكاتيرية وتخطيط اللوحة مبدئيًا\nإرشاد للطالب: يرصد قضية مجتمعية يعبر عنها.\nإرشاد لولي ال لحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\n1. التأثيرات اللونية\n2. الظل والنور\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\n1. النشر\n2. النقد الفني", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nالتعلم القبلي: الألوان الأساسية والثانوية.\nيعرض المعلم كاريكاتيرًا بالأبيض والأسود وآخر ملونًا ويسأل: أيهما أقوى أثرًا؟ ويقارن الطالب.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nالتعلم القبلي: الدائرة اللونية.\nينفذ المعلم أمام الطلبة خلفية بلون ووحدة بمكمله ويسأل: ما أثر ذلك؟ ويلاحظ الطالب بروز الوحدة.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nالتعلم القبلي: الخطة اللونية.\nيسأل المعلم: بأي جزء نبدأ: الخلفية أم الشخصية؟ ويقترح الطالب الترتيب ويعلل.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nالتعلم القبلي: اللوحة الملونة.\nيعرض المعلم الشكل (3) ويسأل: ما التفاصيل التي أضافت حيوية؟ ويذكر الطالب الظلال والتأثيرات.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nالتعلم القبلي: اللوحة المكتملة.\nيسأل المعلم: لو نُشرت لوحتك في صحيفة، فما العنوان الذي تضعه؟ ويقترح الطالب عنوانًا.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم كاريكاتيرًا بالأبيض والأسود وآخر ملونًا ويسأل: أيهما أقوى أثرًا؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الدائرة اللونية: يعرض المعلم الدائرة: الأساسية (الأحمر، الأصفر، الأزرق) والثانوية (البرتقالي، البنفسجي، الأخضر) والمتكاملة، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الأدوات: يقارن المعلم بين الحبر والريشة قديمًا والبرامج الرقمية حديثًا، ويقارن الطالب (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تطبيق سريع: يطلب المعلم تحديد أزواج متكاملة، ويحدد الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم للبيان العملي، ويختار مجموعة لونية (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينفذ المعلم أمام الطلبة خلفية بلون ووحدة بمكمله ويسأل: ما أثر ذلك؟ ويلاحظ الطالب بروز الوحدة (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. البيان العملي: ينمذج المعلم الخطوة الأولى (اختيار المتكاملة) والتلوين بفرش مختلفة، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التجريب: يتابع المعلم تجارب لونية على أجزاء صغيرة، ويجرب الطالب ألوانه (20 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطلب المعلم اعتماد الخطة اللونية، ويعتمد الطالب خطته (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: بأي جزء نبدأ: الخلفية أم الشخصية؟ ويقترح الطالب الترتيب ويعلل (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التلوين: يتابع المعلم التلوين ويوجه فرديًا، والطلبة يلون لوحته (28 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الملاحظة: يطلب المعلم التأمل من بعيد، ويتأمل الطالب (2 دقيقتان)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب أدواته (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل (3) ويسأل: ما التفاصيل التي أضافت حيوية؟ ويذكر الطالب الظلال والتأثيرات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. النمذجة: ينمذج المعلم إضافة ظل على وجه كاريكاتيري، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n3. الإضافة: يتابع المعلم إضافة التفاصيل، ويضيف الطالب التأثيرات والظل والنور (25 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: لو نُشرت لوحتك في صحيفة، فما العنوان الذي تضعه؟ ويقترح الطالب عنوانًا (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. المعرض: ينظم المعلم معرضًا ونقدًا، ويعرض الطالب وينقد (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. النشر: يناقش المعلم إمكانية النشر في منشور مدرسي أو صحيفة، ويقترح الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. التلخيص: يطرح المعلم أسئلة ختامية، ويجيب الطالب (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. الختام: يمهد المعلم للرسوم الكارتونية المصورة، ويلخص الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. ختام الدرس – ألوان علمنا: يحدد كل زوج موقع ألوان العلم العماني (الأبيض والأحمر والأخضر) في الدائرة اللونية، ثم يقترح مجموعة لونية متناسقة لرسم كاريكاتيري عن العيد الوطني ويشاركها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nس1 (مستوى المعرفة): ما الألوان الأساسية؟\nالإجابة: الأحمر والأصفر والأزرق.\n\nس2 (مستوى التطبيق): ما الألوان المتكاملة؟\nالإجابة: الألوان المتقابلة في الدائرة.\n\nس3 (مستوى الاستدلال): قارن بين أداة قديمة وحديثة لإخراج الكاريكاتير.\nالإجابة: الريشة والحبر يدويًا مقابل البرامج الرقمية الأسرع والأسهل في التعديل.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nس1 (مستوى المعرفة): لماذا نستخدم المتكاملة للخلفية والوحدات؟\nالإجابة: لإبراز الوحدات بالتباين.\n\nس2 (مستوى التطبيق): لماذا نختار فرشًا بأحجام مختلفة؟\nالإجابة: الكبيرة للمساحات والصغيرة للتفاصيل.\n\nس3 (مستوى الاستدلال): حلل خطة زميل اللونية.\nالإجابة: تحليل معلل.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nس1 (مستوى المعرفة): ما القيمة المستهدفة في التلوين؟\nالإجابة: التنوع الشكلي اللوني.\n\nس2 (مستوى التطبيق): كيف تتجنب اختلاط الألوان المائية؟\nالإجابة: بانتظار الجفاف بين الطبقات.\n\nس3 (مستوى الاستدلال): حلل التنوع في لوحتك.\nالإجابة: تحليل معلل.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nس1 (مستوى المعرفة): كيف تضيف ظلًا لوجه؟\nالإجابة: بلون أغمق شفاف في الجهة المعاكسة للضوء.\n\nس2 (مستوى التطبيق): ما أثر التأثيرات اللونية في الخلفية؟\nالإجابة: تمنحها حيوية وعمقًا.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا للوحة زميل.\nالإجابة: إجابة معللة.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nس1 (مستوى المعرفة): ما معايير نقد اللوحة الكاريكاتيرية؟\nالإجابة: وضوح الفكرة، المبالغة المناسبة، التنوع اللوني.\n\nس2 (مستوى التطبيق): انقد لوحة زميل.\nالإجابة: نقد معلل.\n\nس3 (مستوى الاستدلال): اقترح مكانًا لنشر الأعمال.\nالإجابة: إجابة معللة.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nس1 (مستوى المعرفة): اذكر لونين متكاملين.\nالإجابة: الأحمر والأخضر.\n\nس2 (مستوى التطبيق): كيف نحصل على البرتقالي؟\nالإجابة: بمزج الأحمر والأصفر.\n\nس3 (مستوى الاستدلال): اقترح مجموعة لونية للوحتك وعلل.\nالإجابة: إجابة معللة.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nس1 (مستوى المعرفة): ما ألوان خلفيتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف تجربتك اللونية.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تلوين اللوحة الكاريكاتيرية بالفرش المختلفة\nس1 (مستوى المعرفة): ما الفرش التي استخدمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف ترتيب تلوينك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تقدمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: إضافة التفاصيل والتأثيرات اللونية والظل والنور\nس1 (مستوى المعرفة): ماذا أضفت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف مصدر الضوء في لوحتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم إخراجك.\nالإجابة: تقييم معلل.\n\nالحصة 5: عرض اللوحات الكاريكاتيرية ونشرها وتقويم الدرس\nس1 (مستوى المعرفة): ما عنوان لوحتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): احكم على لوحتك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): كيف يمكن أن يصبح الكاريكاتير مهنة؟\nالإجابة: بالعمل في الصحف والإعلام الرقمي والإعلانات.", "الحصة 1: الدائرة اللونية والمجموعات اللونية وأدوات إخراج الكاريكاتير قديمًا وحديثًا\nإرشاد للطالب: يلاحظ الألوان في الرسوم الصحفية.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 18–19.\n\nالحصة 2: البيان العملي: اختيار الألوان المتكاملة لتلوين الخلفية والوحدات\nإرشاد للطالب: يلاحظ الألوان المتكاملة حوله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 20.\n\nالحصة \n1. البوستر الإعلاني\n2. التسويق", "الحصة 1: مفهوم القصة الكارتونية المصورة وتخطيط مساحات القصة والعناوين\nالتعلم القبلي: الرسم الكاريكاتيري.\nيعرض المعلم صفحة قصة مصورة ويسأل: كيف تعرف ترتيب قراءة الأحداث؟ ويلاحظ الطالب الإطارات والاتجاه.\n\nالحصة 2: رسم أحداث القصة وشخصياتها في المساحات المحددة\nالتعلم القبلي: تخطيط المساحات.\nيسأل المعلم: كيف نجعل القارئ يعرف الشخصية في كل إطار؟ ويقترح الطالب ثبات الملامح والملابس.\n\nالحصة 3: أشكال كتابة السيناريو والتخطيط النهائي للقصة\nالتعلم القبلي: رسم الأحداث.\nيعرض المعلم الشكل (3) ويسأل: ما الفرق بين فقاعة الكلام وفقاعة التفكير؟ ويلاحظ الطالب الشكل.\n\nالحصة 4: تصميم غلاف القصة الكارتونية المصورة\nالتعلم القبلي: القصة المخططة.\nيعرض المعلم الشكلين (5، 6) ويسأل: ما الذي يجعلك تشتري قصة من غلافها؟ ويذكر الطالب العنوان والشخصية والألوان.\n\nالحصة 5: تصميم البوستر الإعلاني للقصة الكارتونية\nالتعلم القبلي: الغلاف المصمم.\nيعرض المعلم الشكلين (7، 8) ويسأل: ما الفرق بين الغلاف والبوستر؟ ويذكر الطالب الهدف الإعلاني.", "الحصة 1: مفهوم القصة الكارتونية المصورة وتخطيط مساحات القصة والعناوين — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صفحة قصة مصورة ويسأل: كيف تعرف ترتيب قراءة الأحداث؟ ويلاحظ الطالب الإطارات والاتجاه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المفهوم: يوضح المعلم عناصر القصة المصورة: الإطارات، الشخصيات، السيناريو، العنوان، والطلبة يدون (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. اختيار الموضوع: يطلب المعلم اختيار موضوع تاريخي أو شعبي أو تقني، ويختار الطالب موضوعه (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تخطيط المساحات: يعرض المعلم الشكل (1) ويتابع تخطيط المساحات، ويخطط الطالب مساحات قصته (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يراجع المعلم التخطيطات، ويعرض الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: رسم أحداث القصة وشخصياتها في المساحات المحددة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف نجعل القارئ يعرف الشخصية في كل إطار؟ ويقترح الطالب ثبات الملامح والملابس (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التوضيح: يوضح المعلم تنويع اللقطات (قريبة، بعيدة)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الرسم: يتابع المعلم رسم الأحداث، ويرسم الطالب الأحداث والشخصيات (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: أشكال كتابة السيناريو والتخطيط النهائي للقصة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل (3) ويسأل: ما الفرق بين فقاعة الكلام وفقاعة التفكير؟ ويلاحظ الطالب الشكل (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. أشكال الفقاعات: يوضح المعلم أنواع الفقاعات (كلام، تفكير، صراخ، تعليق)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. الكتابة والتخطيط: يتابع المعلم إضافة السيناريو والعنوان، ويكمل الطالب التخطيط النهائي (22 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: تصميم غلاف القصة الكارتونية المصورة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكلين (5، 6) ويسأل: ما الذي يجعلك تشتري قصة من غلافها؟ ويذكر الطالب العنوان والشخصية والألوان (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التحليل: يحلل المعلم عناصر الغلاف الناجح، ويحدد الطالب العناصر (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التصميم: يتابع المعلم التصميم، ويصمم الطالب غلافه (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: تصميم البوستر الإعلاني للقصة الكارتونية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكلين (7، 8) ويسأل: ما الفرق بين الغلاف والبوستر؟ ويذكر الطالب الهدف الإعلاني (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. المحددات: يوضح المعلم محددات البوستر: العنوان، الشخصيات، عبارة جذابة، والطلبة يدون (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التصميم: يتابع، ويصمم الطالب البوستر (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. العرض: ينظم المعلم عرضًا سريعًا، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم للتلوين، ويحفظ الطالب أعماله (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n6. ختام الدرس – حكاية صانع السفن: تخطط المجموعات مساحات قصة مصورة من أربع لقطات عن صانع سفن في صور أو صياد عماني، وتكتب عنوانًا ونصًا قصيرًا لفقاعة الحوار في كل لقطة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفهوم القصة الكارتونية المصورة وتخطيط مساحات القصة والعناوين\nس1 (مستوى المعرفة): ما عناصر القصة المصورة؟\nالإجابة: الإطارات والشخصيات والسيناريو والعنوان.\n\nس2 (مستوى التطبيق): لماذا تتنوع أحجام الإطارات؟\nالإجابة: لإبراز الأحداث المهمة وتنويع الإيقاع.\n\nس3 (مستوى الاستدلال): اقترح موضوعًا شعبيًا عمانيًا لقصة.\nالإجابة: إجابة إبداعية.\n\nالحصة 2: رسم أحداث القصة وشخصياتها في المساحات المحددة\nس1 (مستوى المعرفة): لماذا نحافظ على ملامح الشخصية؟\nالإجابة: ليتعرفها القارئ في كل إطار.\n\nس2 (مستوى التطبيق): ما فائدة تنويع اللقطات؟\nالإجابة: تحقيق التنوع الشكلي وإبراز المشاعر.\n\nس3 (مستوى الاستدلال): حلل تسلسل أحداث زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: أشكال كتابة السيناريو والتخطيط النهائي للقصة\nس1 (مستوى المعرفة): ما شكل فقاعة التفكير؟\nالإجابة: سحابية بدوائر صغيرة.\n\nس2 (مستوى التطبيق): لماذا يكون السيناريو مختصرًا؟\nالإجابة: حتى لا يزاحم الرسم.\n\nس3 (مستوى الاستدلال): اقترح فقاعة لحدث مفاجئ.\nالإجابة: فقاعة مسننة.\n\nالحصة 4: تصميم غلاف القصة الكارتونية المصورة\nس1 (مستوى المعرفة): ما عناصر الغلاف؟\nالإجابة: العنوان والشخصيات والوحدات الشكلية واسم المؤلف.\n\nس2 (مستوى التطبيق): أين يوضع العنوان عادة؟\nالإجابة: في أعلى الغلاف بخط بارز.\n\nس3 (مستوى الاستدلال): حلل غلاف زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: تصميم البوستر الإعلاني للقصة الكارتونية\nس1 (مستوى المعرفة): ما هدف البوستر الإعلاني؟\nالإجابة: جذب الجمهور للقصة والترويج لها.\n\nس2 (مستوى التطبيق): اذكر محددين للبوستر.\nالإجابة: العنوان والشخصيات.\n\nس3 (مستوى الاستدلال): اقترح عبارة إعلانية لقصتك.\nالإجابة: إجابة إبداعية.", "الحصة 1: مفهوم القصة الكارتونية المصورة وتخطيط مساحات القصة والعناوين\nس1 (مستوى المعرفة): ما موضوع قصتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): كم إطارًا خططت؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 2: رسم أحداث القصة وشخصياتها في المساحات المحددة\nس1 (مستوى المعرفة): كم حدثًا رسمت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف شخصيتك الرئيسة.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم وضوح التسلسل.\nالإجابة: تقييم معلل.\n\nالحصة 3: أشكال كتابة السيناريو والتخطيط النهائي للقصة\nس1 (مستوى المعرفة): ما عنوان قصتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف أنواع الفقاعات التي استخدمتها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تكامل النص والصورة.\nالإجابة: تقييم معلل.\n\nالحصة 4: تصميم غلاف القصة الكارتونية المصورة\nس1 (مستوى المعرفة): ما عنصر الجذب في غلافك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف توزيع العناصر.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم الإجادة في تصميمك.\nالإجابة: تقييم معلل.\n\nالحصة 5: تصميم البوستر الإعلاني للقصة الكارتونية\nس1 (مستوى المعرفة): ما عبارتك الإعلانية؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف تصميمك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم قوة البوستر في الجذب.\nالإجابة: تقييم معلل.", "الحصة 1: مفهوم القصة الكارتونية المصورة وتخطيط مساحات القصة والعناوين\nإرشاد للطالب: يتذكر قصة شعبية عمانية.\nإرشاد لولي الأمر: يحكي لابنه قصة شعبية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 22–23.\n\nالحصة 2: رسم أحداث القصة وشخصياتها في المساحات المحددة\nإرشاد للطالب: يتابع قصته في المدرسة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 23.\n\nالحصة 3: أشكال كتابة السيناريو والتخطيط النهائي للقصة\nإرشاد للطالب: يقرأ قصة مصورة هادفة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 24.\n\nالحصة 4: تصميم غلاف القصة الكارتونية المصورة\nإرشاد للطالب: يتأمل أغلفة الكتب.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 25.\n\nالحصة 5: تصميم البوستر الإعلاني للقصة الكارتونية\nإرشاد للطالب: يتأمل البوسترات الإعلانية.\nإرشاد لولي الأمر: يناقش ابنه في التسو كارتوني المصور.\nيعرض المعلم أعمالًا كارتونية عمانية ويسأل: ما الذي يميزها؟ ويذكر الطالب الهوية والبيئة.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\nالتعلم القبلي: الدائرة اللونية.\nيسأل المعلم: هل تناسب الألوان الزاهية قصة تاريخية عن معركة؟ ويناقش الطالب ملاءمة الألوان للموضوع.\n\nالحصة 3: تلوين إطارات القصة الكارتونية (الجزء الأول)\nالتعلم القبلي: الخطة اللونية.\nيسأل المعلم: ماذا يحدث لو تغير لون ملابس البطل بين الإطارات؟ ويستنتج الطالب تشتت القارئ.\n\nالحصة 4: تلوين إطارات القصة الكارتونية (الجزء الثاني) والتأثيرات على الخلفيات\nالتعلم القبلي: الإطارات الملونة جزئيًا.\nيعرض المعلم الشكل (1 ب) ويسأل: كيف أظهر الرسام الزمن (نهار، ليل)؟ ويلاحظ الطالب ألوان الخلفيات.\n\nالحصة 5: تلوين غلاف القصة\nالتعلم القبلي: الغلاف المصمم.\nيسأل المعلم: ما الذي يجب أن يكون أوضح ما في الغلاف؟ ويذكر الطالب العنوان والبطل.\n\nالحصة 6: تلوين البوستر الإعلاني\nالتعلم القبلي: البوستر المصمم.\nيسأل المعلم: كم ثانية يحتاج المار لقراءة البوستر؟ ويستنتج الطالب ضرورة الوضوح السريع.\n\nالحصة 7: اللمسات النهائية لإخراج الأعمال الكارتونية\nالتعلم القبلي: الأعمال الملونة.\nيعرض المعلم عملًا قبل تحديد الخطوط وبعده ويسأل: ما الفرق؟ ويلاحظ الطالب الوضوح.\n\nالحصة 8: نشاط إثرائي: تنفيذ عمل كارتوني بالبرامج الحاسوبية\nالتعلم القبلي: الأعمال الكارتونية اليدوية.\nيعرض المعلم إطارًا يدويًا ونسخته الرقمية ويسأل: أيهما أسهل في التعديل؟ ويقارن الطالب.\n\nالحصة 9: عرض الأعمال الكارتونية في معرض مدرسي وتسويقها\nالتعلم القبلي: الأعمال المكتملة.\nيسأل المعلم: كيف ننظم معرضًا يجذب الطلبة؟ ويقترح الطالب أفكارًا.\n\nالحصة 10: تقويم وحدة فن الكاريكاتير والكارتون\nالتعلم القبلي: أعمال الوحدة.\nيطلق المعلم تحديًا: ارسم في دقيقة وجهًا كاريكاتيريًا بمبالغة واحدة، ويرسم الطالب بسرعة.", "الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم أعمالًا كارتونية عمانية ويسأل: ما الذي يميزها؟ ويذكر الطالب الهوية والبيئة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الفنانون: يعرض المعلم نماذج لفنانين عمانيين في الر لطالب التلوين ويضيف التأثيرات (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: تلوين غلاف القصة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الذي يجب أن يكون أوضح ما في الغلاف؟ ويذكر الطالب العنوان والبطل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلوين: يتابع، والطلبة يلون الغلاف (28 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. المراجعة: يتحقق المعلم من وضوح العنوان، ويراجع الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 6: تلوين البوستر الإعلاني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كم ثانية يحتاج المار لقراءة البوستر؟ ويستنتج الطالب ضرورة الوضوح السريع (5 دقائق)\nالاستراتيجيات: التعلم الذاتي الموجه.\n\n2. التلوين: يتابع، والطلبة يلون البوستر (28 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. المراجعة: يطلب المعلم اختبار الوضوح من بعيد، ويختبر الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 7: اللمسات النهائية لإخراج الأعمال الكارتونية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عملًا قبل تحديد الخطوط وبعده ويسأل: ما الفرق؟ ويلاحظ الطالب الوضوح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. اللمسات: يتابع المعلم تحديد الخطوط واللمسات، ويكمل الطالب أعماله (22 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. مراجعة الأقران: يوزع المعلم بطاقة فحص، ويفحص الطالب عمل زميل (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يمهد المعلم للنشاط الإثرائي الرقمي، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 8: نشاط إثرائي: تنفيذ عمل كارتوني بالبرامج الحاسوبية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم إطارًا يدويًا ونسخته الرقمية ويسأل: أيهما أسهل في التعديل؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. العرض: ينمذج المعلم استخدام برنامج رسم أو Canva المرخص، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التطبيق: يتابع المعلم التنفيذ في مختبر الحاسوب أو الأجهزة المتاحة، وينفذ الطالب عملًا رقميًا مبسطًا (20 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. المقارنة: يطلب المعلم المقارنة، ويقارن الطالب (2 دقيقتان)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الختام: يذكر المعلم بأخلاقيات الاستخدام الرقمي وحقوق الصور، ويلتزم الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي الموجه.\n\nالحصة 9: عرض الأعمال الكارتونية في معرض مدرسي وتسويقها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف ننظم معرضًا يجذب الطلبة؟ ويقترح الطالب أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التنظيم: يوزع المعلم أدوار تنظيم المعرض، ويستلم الطالب دوره (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. العرض: يشرف المعلم على العرض، ويعرض الطالب أعماله ويشرحها (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. التسويق: يناقش المعلم تحويل القصص إلى منشورات، ويقترح الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: يطلب المعلم انطباعات الزوار، والطلبة يدون الانطباعات (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 10: تقويم وحدة فن الكاريكاتير والكارتون — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطلق المعلم تحديًا: ارسم في دقيقة وجهًا كاريكاتيريًا بمبالغة واحدة، ويرسم الطالب بسرعة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الرابع: تلوين الرسم الكارتوني، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. ملف الإنجاز: يطلب المعلم ترتيب أعمال الوحدة وتقييمها، ويرتب الطالب ويقيم (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. أسئلة الكتاب: يطرح المعلم أسئلة كتاب الطالب، ويجيب الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n5. الختام: يمهد المعلم لوحدة الفسيفساء، ويحدد الطالب هدفًا للتطوير (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. ختام الدرس – بطل كرتوني عماني: تصمم كل مجموعة شخصية كرتونية بزي عماني تمثل قيمة كالأمانة أو التعاون، وتقترح لها اسمًا وألوانًا وبرنامجًا رقميًا لتلوينها، ثم تقدمها للصف (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشروع.", "الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة\nس1 (مستوى المعرفة): اذكر برنامجًا للرسم الرقمي.\nالإجابة: برنامج رسم رقمي مثل Canva أو برامج الرسوم المتجهة.\n\nس2 (مستوى التطبيق): ما الذي يميز الكارتون العماني؟\nالإجابة: حضور البيئة والهوية العمانية.\n\nس3 (مستوى الاستدلال): ما مزايا الرسم الرقمي؟\nالإجابة: سرعة التعديل وسهولة النشر.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\nس1 (مستوى المعرفة): ما القيمة المستهدفة؟\nالإجابة: التنوع اللوني.\n\nس2 (مستوى التطبيق): اقترح ألوانًا لقصة تقنية.\nالإجابة: الأزرق والفضي والألوان المضيئة.\n\nس3 (مستوى الاستدلال): حلل خطة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: تلوين إطارات القصة الكارتونية (الجزء الأول)\nس1 (مستوى المعرفة): لماذا نثبت ألوان الشخصيات؟\nالإجابة: ليتعرفها القارئ بسهولة.\n\nس2 (مستوى التطبيق): بأي ترتيب تلون الإطار؟\nالإجابة: الخلفية ثم الشخصيات ثم التفاصيل.\n\nس3 (مستوى الاستدلال): حلل تقدم زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين إطارات القصة الكارتونية (الجزء الثاني) والتأثيرات على الخلفيات\nس1 (مستوى المعرفة): كيف توحي بالليل في الخلفية؟\nالإجابة: بألوان زرقاء داكنة وبنفسجية.\n\nس2 (مستوى التطبيق): اذكر تأثيرًا لونيًا للخلفية.\nالإجابة: التدرج أو الرذاذ.\n\nس3 (مستوى الاستدلال): حلل التنوع اللوني في قصتك.\nالإجابة: تحليل معلل.\n\nالحصة 5: تلوين غلاف القصة\nس1 (مستوى المعرفة): كيف تبرز العنوان؟\nالإجابة: بلون متباين مع الخلفية وحد واضح.\n\nس2 (مستوى التطبيق): هل يجب أن تتطابق ألوان الغلاف مع القصة؟\nالإجابة: نعم لتحقيق الوحدة.\n\nس3 (مستوى الاستدلال): حلل غلاف زميل.\nالإجابة: تحليل معلل.\n\nالحصة 6: تلوين البوستر الإعلاني\nس1 (مستوى المعرفة): ما أهم مواصفات البوستر الملون؟\nالإجابة: الوضوح والجذب السريع.\n\nس2 (مستوى التطبيق): كيف تختبر وضوح البوستر؟\nالإجابة: بالنظر إليه من مسافة.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا لبوستر زميل.\nالإجابة: إجابة معللة.\n\nالحصة 7: اللمسات النهائية لإخراج الأعمال الكارتونية\nس1 (مستوى المعرفة): ما فائدة تحديد الخطوط؟\nالإجابة: إبراز الأشكال ووضوحها.\n\nس2 (مستوى التطبيق): اذكر معيارًا من بطاقة الفحص.\nالإجابة: وضوح التسلسل أو ثبات الألوان.\n\nس3 (مستوى الاستدلال): حلل إخراج زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: نشاط إثرائي: تنفيذ عمل كارتوني بالبرامج الحاسوبية\nس1 (مستوى المعرفة): ما ميزة الطبقات في الرسم الرقمي؟\nالإجابة: تعديل الأجزاء دون التأثير على غيرها.\n\nس2 (مستوى التطبيق): لماذا نحترم حقوق الصور؟\nالإجابة: لأنها ملك أصحابها.\n\nس3 (مستوى الاستدلال): قارن بين عملك اليدوي والرقمي.\nالإجابة: مقارنة معللة.\n\nالحصة 9: عرض الأعمال الكارتونية في معرض مدرسي وتسويقها\nس1 (مستوى المعرفة): ما أدوار تنظيم المعرض؟\nالإجابة: الترتيب، الشرح، الاستقبال، التوثيق.\n\nس2 (مستوى التطبيق): اقترح طريقة لتسويق القصص.\nالإجابة: نشرها رقميًا أو طباعتها كتيبات.\n\nس3 (مستوى الاستدلال): كيف ترتبط القصص المصورة بالصناعات الإبداعية؟\nالإجابة: لأنها منتجات قائمة على الإبداع يمكن تسويقها.\n\nالحصة 10: تقويم وحدة فن الكاريكاتير والكارتون\nس1 (مستوى المعرفة): ما الفرق بين الكاريكاتير والكارتون؟\nالإجابة: الكاريكاتير رسم ساخر لفكرة أو شخصية، والكارتون رسوم قصصية مصورة أو متحركة.\n\nس2 (مستوى التطبيق): ما القيمة في تلوين الكاريكاتير؟\nالإجابة: التنوع الشكلي اللوني.\n\nس3 (مستوى الاستدلال): صمم سؤالًا لزملائك عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: فنانو الرسم الكارتوني في سلطنة عمان والبرامج الحاسوبية المستخدمة\nس1 (مستوى المعرفة): اذكر فنانًا كارتونيًا عمانيًا عُرض عليك.\nالإجابة: إجابة صحيحة بحسب العرض.\n\nس2 (مستوى التطبيق): قارن بين الرسم اليدوي والرقمي.\nالإجابة: مقارنة معللة.\n\nس3 (مستوى الاستدلال): اقترح مشروعًا كارتونيًا عمانيًا.\nالإجابة: إجابة إبداعية.\n\nالحصة 2: اختيار الألوان من الدائرة اللونية لتحقيق التنوع اللوني للعمل الكارتوني\nس1 (مستوى المعرفة): ما ألوان قصتك الرئيسة؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): علل اختيارك.\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): قيّم خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 3: تلوين إطارات القصة الكارتونية (الجزء الأول)\nس1 (مستوى المعرفة): كم إطارًا لونت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف ألوان شخصيتك.\nالإجابة: قيقة\n\n1. التهيئة: يعرض المعلم لوحتين لمشهد واحد في الصباح والغروب ويسأل: لماذا رسم الفنان المشهد مرتين؟ ويستنتج الطالب اهتمامه بتغير الضوء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الخصائص: يوضح المعلم الخصائص: تسجيل أثر الضوء، اللمسات السريعة، الرسم في الهواء الطلق، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التحليل: يعرض المعلم نماذج (الشكل 1) ويطلب تحليل اللمسات والألوان، ويحلل الطالب (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. خريطة ذهنية: يبني المعلم خريطة ذهنية، ويكمل الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يمهد المعلم لاختيار الموضوع، ويقترح الطالب موضوعًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: رسم لوحة فنية بقلم الرصاص محققًا التناسب بين الشكل والأرضية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: أي موضوع يناسب الأسلوب التأثيري أكثر: آلة دقيقة أم حديقة مشمسة؟ ويختار الطالب الحديقة ويعلل (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. اختيار الموضوع: يوجه المعلم لاختيار موضوع غني بالضوء (طبيعة، سوق، شاطئ)، ويختار الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الرسم: يتابع المعلم الرسم، ويرسم الطالب لوحته (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يراجع المعلم التكوينات، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: تلوين اللوحة بأسلوب تأثيري: اللمسات الأولى والتدرج اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينفذ المعلم لمسات متجاورة صفراء وزرقاء ويسأل: ماذا ترى من بعيد؟ ويلاحظ الطالب امتزاجًا بصريًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: ينمذج المعلم اللمسات التأثيرية، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التلوين: يتابع، والطلبة يلون الطبقة الأولى (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: استكمال التلوين التأثيري وإبراز الضوء والظل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل الظل عند التأثيريين أسود؟ ويستنتج الطالب أنه ملون (بنفسجي، أزرق) (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. الاستكمال: يتابع، ويكمل الطالب التلوين (28 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التأمل: يطلب المعلم النظر من بعيد، ويتأمل الطالب (2 دقيقتان)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يمهد المعلم للإخراج، ويحدد الطالب اللمسات الأخيرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: إخراج اللوحة التأثيرية وعرضها ونقدها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: لو حولنا لوحتك إلى قطع صغيرة ملونة، فكيف ستبدو؟ ويتخيل الطالب الفسيفساء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الإخراج: يتابع المعلم اللمسات الأخيرة، ويخرج الطالب لوحته (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. العرض والنقد: ينظم المعلم عرضًا ونقدًا، ويعرض الطالب وينقد (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الربط: يربط المعلم اللمسة التأثيرية بقطع الفسيفساء، ويستنتج الطالب العلاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم للتحليل اللوني، ويلخص الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n6. ختام الدرس – انطباع من خريف صلالة: يصف كل زوج كيف سيرسم فنان تأثيري ضوء الضباب وخضرة الجبال في خريف ظفار بلمسات لونية سريعة متجاورة، ثم يقارن وصفه بوصف زوج آخر (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: المدرسة التأثيرية وخصائصها وأساليب فنانيها\nس1 (مستوى المعرفة): بماذا اهتم الفنان التأثيري؟\nالإجابة: بتسجيل أثر الضوء وتغيره على الأشياء.\n\nس2 (مستوى التطبيق): صف اللمسة التأثيرية.\nالإجابة: لمسات لونية سريعة متجاورة.\n\nس3 (مستوى الاستدلال): لماذا كان التأثيريون يرسمون في الهواء الطلق؟\nالإجابة: لملاحظة الضوء الطبيعي مباشرة.\n\nالحصة 2: رسم لوحة فنية بقلم الرصاص محققًا التناسب بين الشكل والأرضية\nس1 (مستوى المعرفة): ما القيمة المستهدفة في الرسم؟\nالإجابة: التناسب بين الشكل والأرضية.\n\nس2 (مستوى التطبيق): لماذا نختار موضوعًا غنيًا بالضوء؟\nالإجابة: لأنه يناسب الأسلوب التأثيري.\n\nس3 (مستوى الاستدلال): حلل تكوين زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: تلوين اللوحة بأسلوب تأثيري: اللمسات الأولى والتدرج اللوني\nس1 (مستوى المعرفة): ما المزج البصري؟\nالإجابة: امتزاج الألوان المتجاورة في عين المشاهد.\n\nس2 (مستوى التطبيق): كيف تحقق التدرج بالألوان المائية؟\nالإجابة: بزيادة الماء تدريجيًا.\n\nس3 (مستوى الاستدلال): حلل لمسات زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: استكمال التلوين التأثيري وإبراز الضوء والظل\nس1 (مستوى المعرفة): ما لون الظل عند التأثيريين؟\nالإجابة: ألوان باردة كالبنفسجي والأزرق.\n\nس2 (مستوى التطبيق): كيف تبرز الضوء؟\nالإجابة: بلمسات فاتحة دافئة.\n\nس3 (مستوى الاستدلال): حلل الضوء في لوحتك.\nالإجابة: تحليل معلل.\n\nالحصة 5: إخراج اللوحة التأثيرية وعرضها ونقدها\nس1 (مستوى المعرفة): ما العلاقة بين اللمسة التأثيرية والفسيفساء؟\nالإجابة: كلاهما يبني الصورة من وحدات لونية صغيرة متجاورة.\n\nس2 (مستوى التطبيق): انقد لوحة زميل.\nالإجابة: نقد معلل.\n\nس3 (مستوى الاستدلال): ما معيار نجاح اللوحة التأثيرية؟\nالإجابة: إبراز الضوء وحيوية اللمسات.", "الحصة 1: المدرسة التأثيرية وخصائصها وأساليب فنانيها\nس1 (مستوى المعرفة): اذكر خاصيتين للتأثيرية.\nالإجابة: الاهتمام بالضوء واللمسات السريعة.\n\nس2 (مستوى التطبيق): حلل لوحة تأثيرية معروضة.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في أسلوب التأثيريين.\nالإجابة: رأي معلل.\n\nالحصة 2: رسم لوحة فنية بقلم الرصاص محققًا التناسب بين الشكل والأرضية\nس1 (مستوى المعرفة): ما موضوعك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف توزيع عناصرك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التناسب.\nالإجابة: تقييم معلل.\n\nالحصة 3: تلوين اللوحة بأسلوب تأثيري: اللمسات الأولى والتدرج اللوني\nس1 (مستوى المعرفة): ما الخامة التي استخدمتها؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف لمساتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تقدمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: استكمال التلوين التأثيري وإبراز الضوء والظل\nس1 (مستوى المعرفة): صف ظلالك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): أين مصدر الضوء؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التدرج.\nالإجابة: تقييم معلل.\n\nالحصة 5: إخراج اللوحة التأثيرية وعرضها ونقدها\nس1 (مستوى المعرفة): اذكر خاصية تأثيرية في لوحتك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): احكم على لوحتك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال) لختام: يمهد المعلم لرسم الخطوط الخارجية، ويحفظ الطالب اختياره (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: رسم الخطوط الخارجية للتصميم محققًا التناسب الشكلي بين المساحات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل يمكن تنفيذ تفاصيل رموش العين بقطع سيراميك (1×1) سم؟ ويستنتج الطالب ضرورة التبسيط (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التوضيح: يوضح المعلم التبسيط وتجنب المساحات الصغيرة جدًا، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الرسم: يتابع، ويرسم الطالب التصميم (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يراجع المعلم التصاميم، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: تقسيم المساحات اللونية في التصميم محققًا التدرج اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل (2) ويسأل: كيف قسم المصمم السماء؟ ويلاحظ الطالب أشرطة متدرجة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. التوضيح: يوضح المعلم طرق تقسيم المساحات (أشرطة متدرجة، مساحات حرة)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التقسيم والتلوين: يتابع المعلم التقسيم والتلوين المبدئي، ويقسم الطالب ويلون (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يراجع، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: تكبير التصميم بطريقة المربعات محافظًا على النسب — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف ننقل تصميمًا صغيرًا إلى مساحة (70×100) سم دون تشويه؟ ويقترح الطالب الشبكة (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. النمذجة: ينمذج المعلم الشبكة على التصميم وشبكة مكبرة على السطح (الشكل 3)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التكبير: يتابع، ويرسم الطالب الشبكة وينقل المربعات (22 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يراجع، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: نقل التصميم المكبر إلى مساحة العمل (خشب أو كرتون) وتقويم الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف نعرف لون كل مساحة على اللوح الكبير؟ ويقترح الطالب ترقيم المساحات بالألوان (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النقل: يتابع المعلم النقل والترقيم، وينقل الطالب التصميم ويرقم المساحات (18 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التقويم: يطرح المعلم أسئلة الدرس، ويجيب الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يمهد المعلم لقص السيراميك، ويجهز الطالب لوحه (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. ختام الدرس – فسيفساء الكثبان: تحلل المجموعات مشهد غروب على رمال الشرقية إلى مساحات لونية صغيرة تصلح للفسيفساء، وتتسابق في تحديد الدرجات اللونية اللازمة وترتيبها من الفاتح إلى الداكن (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مفهوم التحليل اللوني واختيار موضوع التصميم (زخرفي أو مشهد طبيعي)\nس1 (مستوى المعرفة): ما المقصود بالتحليل اللوني؟\nالإجابة: تقسيم التصميم إلى مساحات لونية محددة.\n\nس2 (مستوى التطبيق): لماذا نحدد عدد الألوان في الفسيفساء؟\nالإجابة: لسهولة التنفيذ وتوفر القطع.\n\nس3 (مستوى الاستدلال): اقترح موضوعًا عمانيًا للفسيفساء.\nالإجابة: إجابة إبداعية.\n\nالحصة 2: رسم الخطوط الخارجية للتصميم محققًا التناسب الشكلي بين المساحات\nس1 (مستوى المعرفة): لماذا نبسط التصميم؟\nالإجابة: لأن قطع الفسيفساء لا تنفذ التفاصيل الدقيقة.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة؟\nالإجابة: التناسب الشكلي بين المساحات.\n\nس3 (مستوى الاستدلال): حلل تصميم زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: تقسيم المساحات اللونية في التصميم محققًا التدرج اللوني\nس1 (مستوى المعرفة): كيف تحقق التدرج في الفسيفساء؟\nالإجابة: بترتيب قطع من درجات متقاربة في أشرطة متتالية.\n\nس2 (مستوى التطبيق): لماذا نلون التصميم قبل التنفيذ؟\nالإجابة: لتحديد ألوان القطع وكمياتها.\n\nس3 (مستوى الاستدلال): حلل تقسيم زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تكبير التصميم بطريقة المربعات محافظًا على النسب\nس1 (مستوى المعرفة): ما مبدأ التكبير بالمربعات؟\nالإجابة: نقل محتوى كل مربع صغير إلى مربع كبير مقابل.\n\nس2 (مستوى التطبيق): ماذا يحدث لو اختلفت نسب الشبكتين؟\nالإجابة: يتشوه التصميم.\n\nس3 (مستوى الاستدلال): حلل دقة تكبير زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: نقل التصميم المكبر إلى مساحة العمل (خشب أو كرتون) وتقويم الدرس\nس1 (مستوى المعرفة): لماذا نرقم المساحات؟\nالإجابة: لمعرفة لون كل مساحة أثناء التنفيذ.\n\nس2 (مستوى التطبيق): ما السطح المناسب للفسيفساء؟\nالإجابة: الخشب أو الكرتون المقوى.\n\nس3 (مستوى الاستدلال): حلل جاهزية لوح زميل.\nالإجابة: تحليل معلل.", "الحصة 1: مفهوم التحليل اللوني واختيار موضوع التصميم (زخرفي أو مشهد طبيعي)\nس1 (مستوى المعرفة): ما موضوعك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): علل اختيارك.\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): قارن بين الموضوع الزخرفي والطبيعي للفسيفساء.\nالإجابة: مقارنة معللة.\n\nالحصة 2: رسم الخطوط الخارجية للتصميم محققًا التناسب الشكلي بين المساحات\nس1 (مستوى المعرفة): صف تصميمك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما التفاصيل التي حذفتها؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التناسب.\nالإجابة: تقييم معلل.\n\nالحصة 3: تقسيم المساحات اللونية في التصميم محققًا التدرج اللوني\nس1 (مستوى المعرفة): كم مساحة لونية في تصميمك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التدرج.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تصميمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تكبير التصميم بطريقة المربعات محافظًا على النسب\nس1 (مستوى المعرفة): ما مقاس مساحة العمل؟\nالإجابة: (70×100) سم.\n\nس2 (مستوى التطبيق): صف خطوات التكبير.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم دقتك.\nالإجابة: تقييم معلل.\n\nالحصة 5: نقل التصميم المكبر إلى مساحة العمل (خشب أو كرتون) وتقويم الدرس\nس1 (مستوى المعرفة): ما خطوات الدرس؟\nالإجابة: الموضوع، الخطوط، المساحات، التكبير، النقل.\n\nس2 (مستوى التطبيق): قيّم عملك.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا.\nالإجابة: إجابة معللة.", "الحصة 1: مفهوم التحليل اللوني واختيار موضوع التصميم (زخرفي أو مشهد طبيعي)\nإرشاد للطالب: يلاحظ أعمال الفسيفساء في المساجد والمرافق.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 32–33.\n\nالحصة 2: رسم الخطوط الخارجية للتصميم محققًا التناسب الشكلي بين المساحات\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 33.\n\ سة (مركز الاهتمام)\nالتعلم القبلي: القطع المفروزة.\nيسأل المعلم: من أين نبدأ الرص؟ ويقترح الطالب البدء بالعنصر الرئيس.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nالتعلم القبلي: العنصر الرئيس المرصوص جزئيًا.\nيعرض المعلم فسيفساء يتبع فيها الرص انحناء الشكل ويسأل: ماذا أضاف ذلك؟ ويلاحظ الطالب الحركة.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nالتعلم القبلي: العناصر المرصوصة.\nيسأل المعلم: كيف تجعل الخلفية لا تنافس العنصر الرئيس؟ ويقترح الطالب ألوانًا أهدأ.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nالتعلم القبلي: العمل المرصوص.\nيمرر المعلم أصدافًا وخرزًا ويسأل: أين يمكن أن تضيف هذه الخامات لمسة؟ ويقترح الطالب مواضع.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nالتعلم القبلي: العمل شبه المكتمل.\nيسأل المعلم: ما الذي يحدث لقطعة غير مثبتة عند وضع المعجون؟ ويتوقع الطالب خروجها.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nالتعلم القبلي: العمل المكتمل تشكيلًا.\nيسأل المعلم: لماذا يوثق الفنانون مراحل أعمالهم؟ ويذكر الطالب التعلم والتسويق.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nالتعلم القبلي: المنتج المشكل.\nيعرض المعلم عينة بمعجون أبيض وأخرى بداكن ويسأل: أيهما يبرز القطع؟ ويقارن الطالب.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورتين: فسيفساء بيزنطية بشخوص وأخرى إسلامية بزخارف نباتية، ويسأل: ما الفرق؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التطور: يعرض المعلم مراحل التطور من المعابد القديمة إلى المساجد والقصور، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المقارنة: يطلب المعلم مقارنة السمات، ويقارن الطالب (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. التلخيص: يلخص، ويكمل الطالب خريطة ذهنية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم لقص السيراميك، ويذكر الطالب سمة (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم قاطع السيراميك ويسأل: ما الخطر المحتمل؟ ويذكر الطالب الشظايا والحواف الحادة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السلامة والنمذجة: يوضح المعلم ارتداء النظارات والقفازات وينمذج القطع (الشكل 1)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. التقطيع: يتابع، ويقطع الطالب السيراميك (20 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يوجه المعلم للتنظيف الآمن، ويجمع الطالب الشظايا (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: إذا لم يتوفر اللون المطلوب، فما الحل؟ ويقترح الطالب أقرب درجة أو خامة بديلة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الفرز: يتابع المعلم الفرز، ويفرز الطالب القطع (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. المطابقة: يطلب المعلم مطابقة القطع مع التصميم وحساب الكميات، ويطابق الطالب ويحسب (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. التكميل: يتابع المعلم قطع الألوان الناقصة، ويكمل الطالب (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. الختام: يمهد المعلم للرص، وينظم الطالب علبه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: من أين نبدأ الرص؟ ويقترح الطالب البدء بالعنصر الرئيس (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n2. النمذجة: ينمذج المعلم الرص مع ترك فواصل متساوية (الشكل 2)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. الرص: يتابع، ويرص الطالب قطع العنصر الرئيس (25 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يوجه المعلم لحفظ العمل، ويحفظ الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم فسيفساء يتبع فيها الرص انحناء الشكل ويسأل: ماذا أضاف ذلك؟ ويلاحظ الطالب الحركة (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. التوضيح: يوضح المعلم رص القطع موازية للحواف، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الرص: يتابع، ويرص الطالب الحواف والتفاصيل (25 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يحفظ المعلم الأعمال، ويحفظ الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف تجعل الخلفية لا تنافس العنصر الرئيس؟ ويقترح الطالب ألوانًا أهدأ (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. تعبئة الخلفية: يتابع المعلم الرص المتدرج، ويعبئ الطالب الخلفية (30 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. الختام: يحفظ المعلم الأعمال، ويحفظ الطالب (5 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يمرر المعلم أصدافًا وخرزًا ويسأل: أين يمكن أن تضيف هذه الخامات لمسة؟ ويقترح الطالب مواضع (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. التوضيح: يوضح المعلم الإضافة المدروسة دون مبالغة، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. الإضافة: يتابع، ويضيف الطالب الخامات (25 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يراجع، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الذي يحدث لقطعة غير مثبتة عند وضع المعجون؟ ويتوقع الطالب خروجها (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. فحص الأقران: يوزع المعلم بطاقة فحص، ويفحص الطالب عمل زميل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. التصحيح: يتابع، ويصحح الطالب عمله (20 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يمهد المعلم للإخراج بالمعجون، ويجهز الطالب عمله (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: لماذا يوثق الفنانون مراحل أعمالهم؟ ويذكر الطالب التعلم والتسويق (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التوثيق: يوجه المعلم لتصوير المراحل، ويوثق الطالب (10 دقائق)\nالاستراتيجيات: العرض التوضيحي.\n\n3. التقويم: ينظم المعلم عرضًا وتقويمًا، ويقيم الطالب (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أسئلة الكتاب: يطرح المعلم سؤالًا من الكتاب، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n5. الختام: يمهد المعلم لإخراج المنتج، ويلخص الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم عينة بمعجون أبيض وأخرى بداكن ويسأل: أيهما يبرز القطع؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. طرق الإخراج: يعرض المعلم طرق الإخراج (معجون، إطار، تعليق)، والطلبة يدون (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. اختيار المعجون: يطلب المعلم تجربة ألوان المعجون على عينة، ويجرب الطالب ويختار (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. التخطيط: يطلب المعلم كتابة خطة الإخراج، ويكتب الطالب الخطة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: يمهد المعلم للحصة القادمة، ويحفظ الطالب خطته (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. ختام الدرس – فسيفساء لجامع ولايتي: تقارن المجموعات بإيجاز بين سمات الفسيفساء الإسلامية والبيزنطية، ثم تقترح زخرفة إسلامية لفسيفساء تزين مدخل جامع في ولايتها وتبرر اختيارها (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nس1 (مستوى المعرفة): أين ظهرت الفسيفساء قديمًا؟\nالإجابة: في جدران المعابد القديمة.\n\nس2 (مستوى التطبيق): ما سمة الفسيفساء الإسلامية؟\nالإجابة: الزخارف النباتية والهندسية.\n\nس3 (مستوى الاستدلال): لماذا تميزت البيزنطية بالشخوص؟\nالإجابة: لارتباطها بالرسوم الدينية والقصصية.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nس1 (مستوى المعرفة): ما أدوات الحماية؟\nالإجابة: النظارات والقفازات.\n\nس2 (مستوى التطبيق): ما الحجم المقترح للقطع؟\nالإجابة: نحو (1) سم مربع.\n\nس3 (مستوى الاستدلال): لماذا نقطع بحسب حجم العمل؟\nالإجابة: لتناسب القطع تفاصيل التصميم.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\nس1 (مستوى المعرفة): لماذا نفرز القطع؟\nالإجابة: لتسهيل العمل وسرعة اختيار الألوان.\n\nس2 (مستوى التطبيق): كيف نقدر الكمية؟\nالإجابة: بحسب مساحة كل لون في التصميم.\n\nس3 (مستوى الاستدلال): اقترح بديلًا للون غير متوفر.\nالإجابة: أقرب درجة أو قطع زجاج أو خامة أخرى.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nس1 (مستوى المعرفة): لماذا نترك فواصل متساوية؟\nالإجابة: لتعبئتها بالمعجون لاحقًا ولتحقيق الانتظام.\n\nس2 (مستوى التطبيق): لماذا نبدأ بمركز الاهتمام؟\nالإجابة: لأنه الأهم ويحدد اتجاه الرص.\n\nس3 (مستوى الاستدلال): حلل رص زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nس1 (مستوى المعرفة): كيف يمنح اتجاه الرص حركة؟\nالإجابة: باتباعه انحناء الشكل.\n\nس2 (مستوى التطبيق): كيف تملأ الزوايا الصغيرة؟\nالإجابة: بقص قطع صغيرة مناسبة.\n\nس3 (مستوى الاستدلال): حلل اتجاه الرص لدى زميل.\nالإجابة: تحليل معلل.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nس1 (مستوى المعرفة): ما دور الخلفية في الفسيفساء؟\nالإجابة: إبراز العنصر الرئيس.\n\nس2 (مستوى التطبيق): كيف تحقق التدرج في الخلفية؟\nالإجابة: بترتيب الدرجات من الفاتح إلى الداكن.\n\nس3 (مستوى الاستدلال): حلل التباين في عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nس1 (مستوى المعرفة): لماذا نضيف خامات أخرى؟\nالإجابة: لإثراء التنوع اللوني الملمسي.\n\nس2 (مستوى التطبيق): ما خطر الإكثار من الخامات؟\nالإجابة: تشتت العمل وفقدان الوحدة.\n\nس3 (مستوى الاستدلال): اقترح خامة من البيئة العمانية.\nالإجابة: الأصداف أو الحصى الملون.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nس1 (مستوى المعرفة): لماذا نثبت كل القطع قبل المعجون؟\nالإجابة: حتى لا تتحرك أو تنفصل.\n\nس2 (مستوى التطبيق): اذكر معيارًا من بطاقة الفحص.\nالإجابة: انتظام الفواصل.\n\nس3 (مستوى الاستدلال): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 9: تقويم مرحلة التشكيل وتوثيق العمل\nس1 (مستوى المعرفة): ما فائدة التوثيق؟\nالإجابة: حفظ المراحل وتسويق العمل.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة؟\nالإجابة: التنوع اللوني الملمسي.\n\nس3 (مستوى الاستدلال): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nالحصة 10: التخطيط لإخراج المنتج واختيار ألوان المعجون\nس1 (مستوى المعرفة): ما وظيفة المعجون؟\nالإجابة: سد المسامات بين القطع وتثبيتها.\n\nس2 (مستوى التطبيق): كيف يؤثر لون المعجون؟\nالإجابة: الداكن يبرز القطع الفاتحة، والفاتح يبرز الداكنة.\n\nس3 (مستوى الاستدلال): اقترح طريقة إخراج لعملك.\nالإجابة: إجابة معللة.", "الحصة 1: مراحل تطور فن الفسيفساء وأنواعه\nس1 (مستوى المعرفة): اذكر مكانًا تستخدم فيه الفسيفساء.\nالإجابة: المساجد والقصور.\n\nس2 (مستوى التطبيق): قارن بين النوعين.\nالإجابة: مقارنة صحيحة.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في الفسيفساء المعاصرة.\nالإجابة: رأي معلل.\n\nالحصة 2: قواعد السلامة وتقطيع السيراميك إلى قطع مناسبة\nس1 (مستوى المعرفة): اذكر قاعدة سلامة.\nالإجابة: ارتداء النظارات.\n\nس2 (مستوى التطبيق): صف طريقة القطع.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التزامك بالسلامة.\nالإجابة: تقييم معلل.\n\nالحصة 3: فرز قطع السيراميك بحسب الألوان والدرجات\nس1 (مستوى المعرفة): كم لونًا فرزت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف عملية المطابقة.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم تنظيمك.\nالإجابة: تقييم معلل.\n\nالحصة 4: رص القطع وتعبئة المساحات الرئيسة (مركز الاهتمام)\nس1 (مستوى المعرفة): ما العنصر الذي بدأت به؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف انتظام فواصلك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تقدمك.\nالإجابة: تقييم معلل.\n\nالحصة 5: رص القطع حول الحواف والتفاصيل وتوجيه اتجاه الرص\nس1 (مستوى المعرفة): صف اتجاه رصك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما الصعوبة التي واجهتها؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم دقة الحواف.\nالإجابة: تقييم معلل.\n\nالحصة 6: تعبئة مساحات الخلفية بالرص المتدرج\nس1 (مستوى المعرفة): ما ألوان خلفيتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التدرج.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التباين.\nالإجابة: تقييم معلل.\n\nالحصة 7: إضافة خامات أخرى لإثراء التنوع اللوني الملمسي\nس1 (مستوى المعرفة): ماذا أضفت؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف أثرها.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم التنوع.\nالإجابة: تقييم معلل.\n\nالحصة 8: مراجعة العمل وتصحيح الفراغات والقطع غير المثبتة\nس1 (مستوى المعرفة): ما الذي صححته؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف ملاحظة زميلك.\nالإجابة: إجابة شخصية.\n\nس3 (م لب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: متى ننظف المعجون الزائد؟ ويجيب الطالب قبل جفافه التام (5 دقائق)\nالاستراتيجيات: التلميع.\n\n2. التنظيف: يتابع، وينظف الطالب المنتج (28 دقيقة)\nالاستراتيجيات: الإطار).\n\n3. التأمل: يطلب المعلم التأمل، ويتأمل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يحفظ المعلم الأعمال لتجف، ويحفظ الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم منتجًا بإطار وآخر بدونه ويسأل: أيهما يبدو أكثر احترافية؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التشطيب: يتابع، ويشطب الطالب منتجه (28 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. المراجعة: يراجع، ويراجع الطالب (2 دقيقتان)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يمهد المعلم للعرض، ويجهز الطالب منتجه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كم تقدر سعر منتجك؟ وعلى أي أساس؟ ويقدر الطالب ويعلل (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. المعرض: ينظم المعلم المعرض، ويعرض الطالب ويشرح (15 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n3. التسويق: يناقش المعلم التسعير وقنوات البيع، ويكتب الطالب بطاقة تسويق (10 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الانطباعات: يجمع المعلم الانطباعات، والطلبة يدون (5 دقائق)\nالاستراتيجيات: التلميع.\n\n5. الختام: يمهد المعلم لتقويم الوحدة، ويلخص الطالب (5 دقائق)\nالاستراتيجيات: الإطار).\n\nالحصة 5: تقويم وحدة فن الفسيفساء — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطلق المعلم تحديًا: رتب مراحل إنتاج الفسيفساء في أسرع وقت، ويرتب الطالب مع مجموعته (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الرابع: إخراج منتج الفسيفساء، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. ملف الإنجاز: يطلب المعلم تقييم أعمال الوحدة، ويقيم الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أسئلة الكتاب: يطرح المعلم أسئلة الكتاب، ويجيب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: يمهد المعلم لوحدة الفن الحديث، ويحدد الطالب هدفًا (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n6. ختام الدرس – إتقان الحرفي العماني: يربط كل زوج دقة سد المسامات وتوزيع المعجون بإتقان الحرفيين العمانيين في صناعة الفخار والفضة، ثم يكتب قيمة مهنية واحدة يتعلمها منهم ويعرضها (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.", "الحصة 1: تحضير المعجون وسد المسامات بين قطع السيراميك\nس1 (مستوى المعرفة): ما أداة توزيع المعجون؟\nالإجابة: سكين المعجون أو الفرشاة.\n\nس2 (مستوى التطبيق): لماذا نرتدي القفازات؟\nالإجابة: لحماية اليدين من المعجون الإسمنتي.\n\nس3 (مستوى الاستدلال): حلل تغطية زميل للمسامات.\nالإجابة: تحليل معلل.\n\nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع\nس1 (مستوى المعرفة): لماذا ننظف قبل الجفاف التام؟\nالإجابة: لسهولة إزالة المعجون الزائد.\n\nس2 (مستوى التطبيق): ماذا نستخدم للتنظيف؟\nالإجابة: قطع القماش والإسفنج.\n\nس3 (مستوى الاستدلال): حلل وضوح القطع في عملك.\nالإجابة: تحليل معلل.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار)\nس1 (مستوى المعرفة): ما فائدة الإطار؟\nالإجابة: حماية الحواف وإبراز العمل.\n\nس2 (مستوى التطبيق): كيف تلمع السطح؟\nالإجابة: بمسحه بقماش جاف نظيف.\n\nس3 (مستوى الاستدلال): حلل تشطيب زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها\nس1 (مستوى المعرفة): ما أسس تسعير المنتج الفني؟\nالإجابة: تكلفة الخامات والوقت والجودة والإبداع.\n\nس2 (مستوى التطبيق): اقترح قناة لبيع الفسيفساء.\nالإجابة: متجر إلكتروني أو معرض حرفي.\n\nس3 (مستوى الاستدلال): كيف ترتبط الفسيفساء بالصناعات الإبداعية؟\nالإجابة: منتجات إبداعية قابلة للتسويق.\n\nالحصة 5: تقويم وحدة فن الفسيفساء\nس1 (مستوى المعرفة): رتب مراحل الفسيفساء.\nالإجابة: التصميم، التحليل اللوني، التكبير، التقطيع، الرص، المعجون، التنظيف.\n\nس2 (مستوى التطبيق): ما سمة الفسيفساء البيزنطية؟\nالإجابة: الشخوص والرسوم القصصية.\n\nس3 (مستوى الاستدلال): صمم سؤالًا عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: تحضير المعجون وسد المسامات بين قطع السيراميك\nس1 (مستوى المعرفة): ما لون معجونك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف طريقتك.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): قيّم التغطية.\nالإجابة: تقييم معلل.\n\nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع\nس1 (مستوى المعرفة): صف خطوات التنظيف.\nالإجابة: إجابة صحيحة.\n\nس2 (مستوى التطبيق): ما الذي ظهر بعد التنظيف؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار)\nس1 (مستوى المعرفة): ما نوع إطارك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التشطيب.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم إخراجك.\nالإجابة: تقييم معلل.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها\nس1 (مستوى المعرفة): ما سعر منتجك المقترح؟\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): صف بطاقة التسويق.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم المعرض.\nالإجابة: تقييم معلل.\n\nالحصة 5: تقويم وحدة فن الفسيفساء\nس1 (مستوى المعرفة): ما وظيفة المعجون؟\nالإجابة: سد المسامات وتثبيت القطع.\n\nس2 (مستوى التطبيق): احكم على منتجك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): حدد هدفًا للتطوير.\nالإجابة: إجابة شخصية.", "الحصة 1: تحضير المعجون وسد المسامات بين قطع السيراميك\nإرشاد للطالب: يلتزم بالسلامة.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 38.\n\nالحصة 2: تنظيف سطح الفسيفساء بقطع القماش وإظهار القطع\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 38.\n\nالحصة 3: التشطيب النهائي (الحواف، التلميع، الإطار)\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 37–38.\n\nالحصة 4: عرض منتجات الفسيفساء وتسويقها\nإرشاد للطالب: يشارك أسرته منتجه.\nإرشاد لولي الأمر: يدعم ابنه في التسويق.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 37–38.\n\nالحصة 5: تقويم وحدة فن الفسيفساء\nإرشاد للطالب: يراجع ملف إنجازه ية لموضوع متشابه ويسأل: ما الفرق في اللمسة؟ ويقارن الطالب.\n\nالحصة 3: تخطيط مشهد بالقلم الرصاص (15×20) سم محققًا التناسب الشكلي مع الأرضية\nالتعلم القبلي: التجربة المختارة.\nيسأل المعلم: كيف تختار جزءًا من لوحة كبيرة ليكون عملًا متكاملًا؟ ويقترح الطالب استخدام إطار مقصوص.\n\nالحصة 4: تلوين التكوين بالأكريليك وفق أسلوب المدرسة المختارة\nالتعلم القبلي: التخطيط.\nيعرض المعلم لوحة «ليلة النجوم» لفان جوخ ويسأل: كيف رسم السماء؟ ويلاحظ الطالب اللمسات الدوامية.\n\nالحصة 5: إخراج العمل وعرضه ونقده في ضوء خصائص المدرسة\nالتعلم القبلي: العمل الملون.\nيسأل المعلم: هل نجحت في نقل روح المدرسة؟ كيف تعرف؟ ويذكر الطالب المعايير.", "الحصة 1: المدرسة الواقعية وخصائصها وأبرز فنانيها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لوحة واقعية لفلاحين يعملون ويسأل: ما الذي يختلف عن لوحات القصور والملوك؟ ويلاحظ الطالب تصوير الحياة اليومية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الخصائص: يوضح المعلم خصائص الواقعية: تصوير الحياة اليومية بصدق ودقة، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التحليل: يطلب المعلم تحليل لوحات واقعية، ويحلل الطالب (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. خريطة زمنية: يبدأ المعلم خطًا زمنيًا للمدارس الحديثة، ويكمل الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يمهد المعلم لاختيار التجربة الفنية، ويذكر الطالب خاصية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: من الواقعية إلى التأثيرية: المقارنة واختيار التجربة الفنية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لوحة واقعية وأخرى تأثيرية لموضوع متشابه ويسأل: ما الفرق في اللمسة؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. المقارنة: يقود المعلم مقارنة في الموضوع واللمسة والضوء، ويقارن الطالب في جدول أو خريطة (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الاختيار: يعرض المعلم النشاطين ويطلب الاختيار، ويختار الطالب تجربته (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. جمع المراجع: يوجه المعلم لاختيار مرجع بصري، ويختار الطالب مرجعه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: يمهد المعلم للتخطيط، ويذكر الطالب اختياره (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تخطيط مشهد بالقلم الرصاص (15×20) سم محققًا التناسب الشكلي مع الأرضية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف تختار جزءًا من لوحة كبيرة ليكون عملًا متكاملًا؟ ويقترح الطالب استخدام إطار مقصوص (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الإطار: يوضح المعلم استخدام إطار ورقي لاختيار جزء من اللوحة، ويحدد الطالب الجزء (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. التخطيط: يتابع، ويخطط الطالب مشهده (25 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يراجع، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 4: تلوين التكوين بالأكريليك وفق أسلوب المدرسة المختارة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لوحة «ليلة النجوم» لفان جوخ ويسأل: كيف رسم السماء؟ ويلاحظ الطالب اللمسات الدوامية (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. النمذجة: ينمذج المعلم التعامل مع الأكريليك (سرعة الجفاف، المزج)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التلوين: يتابع، والطلبة يلون عمله (25 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يوجه المعلم لتنظيف الفرش فورًا، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: إخراج العمل وعرضه ونقده في ضوء خصائص المدرسة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل نجحت في نقل روح المدرسة؟ كيف تعرف؟ ويذكر الطالب المعايير (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الإخراج: يتابع، ويخرج الطالب عمله (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. العرض والنقد: ينظم المعلم عرضًا ونقدًا، ويعرض الطالب وينقد (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. التلخيص: يلخص، ويكمل الطالب الخط الزمني (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n5. الختام: يمهد المعلم للتكعيبية والسريالية، ويلخص الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. ختام الدرس – لوحتان لسوق واحد: تصف كل مجموعة مشهدًا من الحياة العمانية (سوق الهبطة في العيد أو صيادين على الشاطئ) كما يرسمه فنان واقعي، ثم كما يرسمه فنان تأثيري، وتعرض الفرق (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: المدرسة الواقعية وخصائصها وأبرز فنانيها\nس1 (مستوى المعرفة): بماذا اهتمت المدرسة الواقعية؟\nالإجابة: بتصوير الحياة اليومية بصدق ودقة.\n\nس2 (مستوى التطبيق): ما الفرق بين الواقعية والكلاسيكية؟\nالإجابة: الواقعية صورت عامة الناس، والكلاسيكية الموضوعات المثالية والتاريخية.\n\nس3 (مستوى الاستدلال): لماذا ظهرت الواقعية؟\nالإجابة: للتعبير عن واقع المجتمع وقضاياه.\n\nالحصة 2: من الواقعية إلى التأثيرية: المقارنة واختيار التجربة الفنية\nس1 (مستوى المعرفة): ما الفرق في اللمسة بين المدرستين؟\nالإجابة: الواقعية ناعمة دقيقة والتأثيرية سريعة ظاهرة.\n\nس2 (مستوى التطبيق): أي المدرستين أكثر اهتمامًا بالضوء؟\nالإجابة: التأثيرية.\n\nس3 (مستوى الاستدلال): لماذا تعد التأثيرية بداية الفن الحديث؟\nالإجابة: لأنها تحررت من الدقة الأكاديمية.\n\nالحصة 3: تخطيط مشهد بالقلم الرصاص (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى المعرفة): ما قياس التخطيط؟\nالإجابة: (15×20) سم.\n\nس2 (مستوى التطبيق): كيف يساعد الإطار الورقي؟\nالإجابة: في تحديد جزء متوازن من اللوحة.\n\nس3 (مستوى الاستدلال): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين التكوين بالأكريليك وفق أسلوب المدرسة المختارة\nس1 (مستوى المعرفة): ما خاصية ألوان الأكريليك؟\nالإجابة: سريعة الجفاف ومائية الأساس.\n\nس2 (مستوى التطبيق): كيف تحقق الانسجام؟\nالإجابة: باستخدام مجموعة لونية متقاربة.\n\nس3 (مستوى الاستدلال): حلل لمسات فان جوخ.\nالإجابة: لمسات دوامية كثيفة متكررة تمنح حركة.\n\nالحصة 5: إخراج العمل وعرضه ونقده في ضوء خصائص المدرسة\nس1 (مستوى المعرفة): ما معيار نجاح المحاكاة التأثيرية؟\nالإجابة: وضوح اللمسات وإبراز الضوء.\n\nس2 (مستوى التطبيق): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا لعملك.\nالإجابة: إجابة معللة.", "الحصة 1: المدرسة الواقعية وخصائصها وأبرز فنانيها\nس1 (مستوى المعرفة): اذكر خاصية للواقعية.\nالإجابة: الدقة في تصوير الحياة اليومية.\n\nس2 (مستوى التطبيق): حلل لوحة واقعية.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في قيمة الواقعية اليوم.\nالإجابة: رأي معلل.\n\nالحصة 2: من الواقعية إلى التأثيرية: المقارنة واختيار التجربة الفنية\nس1 (مستوى المعرفة): ما التجربة ال تعلم بالاكتشاف.\n\n2. التكعيبية: يوضح المعلم تحليل الأشكال إلى أشكال هندسية وتعدد زوايا النظر، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. السريالية: يوضح المعلم التعبير عن الأحلام واللاوعي عند دالي، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. المقارنة: يطلب المعلم المقارنة، ويقارن الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم لاختيار النشاط، ويختار الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: التدرب على رسم أجزاء الوجه بالأسلوب التكعيبي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يرسم المعلم عينًا من الأمام وأنفًا من الجانب في وجه واحد ويسأل: ما الذي تغير؟ ويلاحظ الطالب تعدد الزوايا (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. النمذجة: ينمذج المعلم رسم أجزاء الوجه تكعيبيًا (الشكل 1)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: الجرائد.\n\n3. التدرب: يتابع، ويتدرب الطالب على الأجزاء ويرسم الخط الخارجي (22 دقيقة)\nالاستراتيجيات: الأسلاك).\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 3: رسم وتلوين وجه تكعيبي أو لوحة سريالية مبتكرة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل (8) لوحة مستوحاة من دالي ويسأل: ما الذي غيّره الطالب؟ ويحدد الطالب التغييرات (5 دقائق)\nالاستراتيجيات: التفكير الإبداعي.\n\n2. التنفيذ: يتابع، ويرسم الطالب ويلون عمله (28 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التأمل: يطلب المعلم التأمل، ويتأمل الطالب (2 دقيقتان)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: أفكار مبتكرة لتطبيق الأسلوب التكعيبي (الأكواب الورقية، الجرائد، الأسلاك) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكلين (5، 6) ويسأل: هل يمكن أن يباع كوب عليه وجه تكعيبي؟ ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الأفكار: يعرض المعلم الأفكار، ويختار الطالب فكرته (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التنفيذ: يتابع، وينفذ الطالب فكرته (25 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يناقش المعلم القيمة التسويقية، ويقترح الطالب استخدامًا (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: عرض أعمال التكعيبية والسريالية ونقدها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل يمكن معرفة المدرسة من العمل دون أن تخبرنا؟ ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. العرض والنقد: ينظم المعلم عرضًا ونقدًا، ويعرض الطالب وينقد (18 دقيقة)\nالاستراتيجيات: الجرائد.\n\n3. التلخيص: يضيف المعلم المدرستين للخط الزمني، ويكمل الطالب (9 دقائق)\nالاستراتيجيات: الأسلاك).\n\n4. الختام: يمهد المعلم للمستقبلية والتجريدية، ويلخص الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. ختام الدرس – قلعة تكعيبية: تتحدى المجموعات بعضها بتخيل قلعة عمانية مرسومة بأسلوب بيكاسو التكعيبي، أو حلم سريالي على طريقة دالي عن سفينة عمانية، وتصف كل فكرة في جملة واحدة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: خصائص المدرستين التكعيبية والسريالية وأبرز فنانيهما\nس1 (مستوى المعرفة): ما أساس التكعيبية؟\nالإجابة: تحليل الأشكال إلى أشكال هندسية ورؤيتها من زوايا متعددة.\n\nس2 (مستوى التطبيق): بماذا تعبر السريالية؟\nالإجابة: عن الأحلام واللاوعي.\n\nس3 (مستوى الاستدلال): قارن بين بيكاسو ودالي.\nالإجابة: بيكاسو حلل الشكل هندسيًا، ودالي صور الخيال بدقة واقعية.\n\nالحصة 2: التدرب على رسم أجزاء الوجه بالأسلوب التكعيبي\nس1 (مستوى المعرفة): كيف ترسم الأنف تكعيبيًا؟\nالإجابة: من الجانب في وجه مرسوم من الأمام.\n\nس2 (مستوى التطبيق): ما دور الأشكال الهندسية؟\nالإجابة: تبسيط أجزاء الوجه.\n\nس3 (مستوى الاستدلال): حلل تدرب زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: رسم وتلوين وجه تكعيبي أو لوحة سريالية مبتكرة\nس1 (مستوى المعرفة): ما القيمتان المستهدفتان؟\nالإجابة: التناسب الشكلي والانسجام اللوني.\n\nس2 (مستوى التطبيق): كيف تحول لوحة سريالية إلى فكرة خاصة؟\nالإجابة: بتغيير أجزائها حسب موضوعك.\n\nس3 (مستوى الاستدلال): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: أفكار مبتكرة لتطبيق الأسلوب التكعيبي (الأكواب الورقية، الجرائد، الأسلاك)\nس1 (مستوى المعرفة): اذكر خامتين لتطبيق التكعيبية.\nالإجابة: الأكواب الورقية والأسلاك.\n\nس2 (مستوى التطبيق): كيف يتحول العمل
