صة 3: إعادة ترتيب الأجزاء وإلصاقها بأسلوب مستقبلي محققًا الإيقاع الشكلي اللوني\nالتعلم القبلي: القطع المقصوصة.\nيجرب المعلم ترتيبين أمام الطلبة ويسأل: أيهما يوحي بحركة أسرع؟ ويقارن الطالب.\n\nالحصة 4: تحويل شكل واقعي إلى شكل تجريدي (جزئي أو كلي)\nالتعلم القبلي: خصائص التجريدية.\nيعرض المعلم تجريد الديك للفنانة أميرة المسكرية (الشكل 4) ويسأل: ما الذي بقي من الديك؟ ويحدد الطالب الملامح المتبقية.\n\nالحصة 5: تلوين الشكل المجرد محققًا الانسجام اللوني وعرض أعمال الدرس\nالتعلم القبلي: الشكل المجرد.\nيسأل المعلم: هل يحتاج العمل التجريدي إلى ألوان واقعية؟ ويناقش الطالب.", "الحصة 1: خصائص المدرستين المستقبلية والتجريدية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لوحة مستقبلية لحركة سريعة ويسأل: كيف أظهر الفنان السرعة؟ ويلاحظ الطالب التكرار (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المستقبلية: يوضح المعلم التعبير عن الحركة والسرعة والآلة بالتكرار، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التجريدية: يعرض المعلم أعمال موندريان (الشكل 1) ويوضح الاختزال، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. المقارنة: يطلب المعلم المقارنة، ويقارن الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يطلب المعلم اختيار النشاط، ويختار الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: اختيار الصورة وعمل نسخ منها وقص أجزائها بطريقة مكررة (الكولاج المستقبلي) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة متسابق ونسخها المقصوصة ويسأل: كيف نصنع منها حركة؟ ويقترح الطالب الترتيب المتتابع (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التوضيح: يوضح المعلم خطوات النشاط، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. القص: يتابع، ويقص الطالب الأجزاء (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يحفظ المعلم القطع، ويرتب الطالب قطعه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: إعادة ترتيب الأجزاء وإلصاقها بأسلوب مستقبلي محققًا الإيقاع الشكلي اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يجرب المعلم ترتيبين أمام الطلبة ويسأل: أيهما يوحي بحركة أسرع؟ ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الترتيب واللصق: يتابع، ويرتب الطالب ويلصق (25 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. العرض: يعرض المعلم الأعمال، ويعرض الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يمهد المعلم للتجريدية، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: تحويل شكل واقعي إلى شكل تجريدي (جزئي أو كلي) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم تجريد الديك للفنانة أميرة المسكرية (الشكل 4) ويسأل: ما الذي بقي من الديك؟ ويحدد الطالب الملامح المتبقية (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. التوضيح: يوضح المعلم التجريد الجزئي والكلي (الشكلان 2، 3)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التحويل: يتابع، ويحول الطالب شكله (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يعرض المعلم نماذج، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: تلوين الشكل المجرد محققًا الانسجام اللوني وعرض أعمال الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل يحتاج العمل التجريدي إلى ألوان واقعية؟ ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التلوين: يتابع، والطلبة يلون عمله (18 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. العرض: ينظم المعلم عرضًا، ويعرض الطالب وينقد (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يمهد المعلم للوحشية والتعبيرية، ويلخص الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. ختام الدرس – حركة نحو 2040: تقترح المجموعات عملًا فنيًا مستقبليًا يعبر عن حركة التطور في رؤية عمان 2040 (موانئ، طاقة متجددة، مدن حديثة) بخطوط متكررة توحي بالسرعة، وتشرح فكرته (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: خصائص المدرستين المستقبلية والتجريدية\nس1 (مستوى المعرفة): بماذا اهتمت المستقبلية؟\nالإجابة: بالحركة والسرعة والآلة.\n\nس2 (مستوى التطبيق): ما التجريد؟\nالإجابة: اختزال الشكل إلى عناصره الأساسية من خطوط ومساحات وألوان.\n\nس3 (مستوى الاستدلال): كيف تعبر المستقبلية عن الحركة؟\nالإجابة: بتكرار الأشكال وتداخلها.\n\nالحصة 2: اختيار الصورة وعمل نسخ منها وقص أجزائها بطريقة مكررة (الكولاج المستقبلي)\nس1 (مستوى المعرفة): لماذا نعمل عدة نسخ من الصورة؟\nالإجابة: لتكرار الأجزاء وإيهام الحركة.\n\nس2 (مستوى التطبيق): ما الكولاج؟\nالإجابة: تركيب ولصق قطع من خامات وصور.\n\nس3 (مستوى الاستدلال): اقترح صورة مناسبة للحركة.\nالإجابة: عداء أو طائر أو سيارة.\n\nالحصة 3: إعادة ترتيب الأجزاء وإلصاقها بأسلوب مستقبلي محققًا الإيقاع الشكلي اللوني\nس1 (مستوى المعرفة): كيف يتحقق الإيقاع؟\nالإجابة: بتكرار الأجزاء بانتظام أو بتدرج.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة؟\nالإجابة: الإيقاع الشكلي اللوني.\n\nس3 (مستوى الاستدلال): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تحويل شكل واقعي إلى شكل تجريدي (جزئي أو كلي)\nس1 (مستوى المعرفة): ما الفرق بين التجريد الجزئي والكلي؟\nالإجابة: الجزئي يبقي بعض الملامح، والكلي يختزل الشكل كليًا.\n\nس2 (مستوى التطبيق): من الفنانة العمانية صاحبة تجريد الديك؟\nالإجابة: أميرة المسكرية.\n\nس3 (مستوى الاستدلال): حلل تجريد زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: تلوين الشكل المجرد محققًا الانسجام اللوني وعرض أعمال الدرس\nس1 (مستوى المعرفة): هل يلتزم التجريد بالألوان الواقعية؟\nالإجابة: لا، يختار الفنان ألوانه بحرية.\n\nس2 (مستوى التطبيق): كيف تحقق الانسجام؟\nالإجابة: بمجموعة لونية متقاربة.\n\nس3 (مستوى الاستدلال): انقد عمل زميل.\nالإجابة: نقد معلل.", "الحصة 1: خصائص المدرستين المستقبلية والتجريدية\nس1 (مستوى المعرفة): من فنان تجريدي عُرض عليك؟\nالإجابة: موندريان.\n\nس2 (مستوى التطبيق): قارن بين المدرستين.\nالإجابة: مقارنة صحيحة.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في التجريد.\nالإجابة: رأي معلل.\n\nالحصة 2: اختيار الصورة وعمل نسخ منها وقص أجزائها بطريقة مكررة (الكولاج المستقبلي)\nس1 (مستوى المعرفة): ما صورتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف طريقة القص.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم قطعك.\nالإجابة: تقييم معلل.\n\nالحصة 3: إعادة ترتيب الأجزاء وإلصاقها بأسلوب مستقبلي محققًا الإيقاع الشكلي اللوني\nس1 (مستوى المعرفة): صف ترتيبك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): هل يوحي عملك بالحركة؟\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تحويل شكل واقعي إلى شكل تجريدي (جزئي أو كلي)\n لم تحليل لوحات ماتيس (الشكل 1)، ويحلل الطالب (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. خريطة: يضيف المعلم الوحشية للخط الزمني، ويكمل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم للتخطيط، ويذكر الطالب خاصية (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الموضوع المناسب لأسلوب يعتمد على اللون الصريح؟ ويقترح الطالب موضوعات (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. الموضوع: يوجه المعلم لاختيار موضوع، ويختار الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التخطيط: يتابع، ويخطط الطالب عمله (الشكل 2) (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يراجع، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التفكير الإبداعي.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يضع المعلم لونين متضادين متجاورين ويسأل: ماذا حدث لقوة كل منهما؟ ويلاحظ الطالب تقوية الألوان (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التجريب: يتابع المعلم تجارب التضاد، ويجرب الطالب ويضع خطته (25 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. العرض: يعرض المعلم الخطط، ويعرض الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يعتمد المعلم الخطط، ويثبت الطالب خطته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل تحتاج الوحشية إلى تدرج كثير؟ ويستنتج الطالب أنها تعتمد المساحات الصريحة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التلوين: يتابع، والطلبة يلون لوحته (الشكل 3) (28 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التأمل: يطلب المعلم التأمل، ويتأمل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 5: إخراج العمل الوحشي ونقده — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الذي يجعل العمل «وحشيًا» حقًا؟ ويذكر الطالب الجرأة والتضاد (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الإخراج: يتابع، ويخرج الطالب عمله (10 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. النقد: ينظم المعلم نقدًا، وينقد الطالب (15 دقيقة)\nالاستراتيجيات: التفكير الإبداعي.\n\n4. التمهيد: يمهد المعلم للتعبيرية، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الختام: يلخص، ويلخص الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم لوحة «الصرخة» لمونخ ويسأل: ما الشعور الذي تثيره؟ ويصف الطالب الشعور (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الخصائص: يوضح المعلم: التعبير عن المشاعر الداخلية بالتحريف والألوان القوية، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التحليل: يطلب المعلم تحليل أعمال مونخ (الشكل 4)، ويحلل الطالب (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. المقارنة: يقارن المعلم بالوحشية، ويقارن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يمهد المعلم للتخطيط، ويذكر الطالب خاصية (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف ترسم «القلق» دون أن تكتبه؟ ويقترح الطالب خطوطًا ملتوية وألوانًا قوية (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. اختيار الشعور: يوجه المعلم لاختيار شعور، ويختار الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التخطيط: يتابع، ويخطط الطالب عمله (الشكل 5) (25 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يراجع، ويقيم الطالب (5 دقائق)\nالاستراتيجيات: التفكير الإبداعي.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الألوان التي تعبر عن شعورك؟ ويقترح الطالب ألوانًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التلوين: يتابع، والطلبة يلون عمله (الشكل 6) (28 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. التأمل: يطلب المعلم التأمل، ويتأمل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يوجه المعلم للتنظيف، وينظف الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: كيف ننظم معرضًا يحكي قصة الفن الحديث؟ ويقترح الطالب ترتيبًا زمنيًا (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التنظيم: يوزع المعلم الأدوار، ويستلم الطالب دوره (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. العرض: يشرف المعلم على العرض، ويعرض الطالب ويشرح (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. لعبة التمييز: يطلب المعلم من الزوار تحديد مدرسة كل عمل، ويشارك الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n5. الختام: يجمع المعلم الانطباعات، والطلبة يدون (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورًا سريعة ويطلب تحديد المدرسة في ثوانٍ، ويتسابق الطالب في التحديد (4 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n2. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «ما الفرق بين الوحشية والتعبيرية»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. ملف الإنجاز: يطلب المعلم تقييم أعمال الفصل، ويقيم الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. أسئلة الكتاب: يطرح المعلم أسئلة الكتاب، ويجيب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: يختم المعلم الفصل الدراسي بتحفيز، ويحدد الطالب هدفه (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. ختام الدرس – ألوان جريئة للعيالة: يختار كل زوج ألوانًا جريئة على طريقة ماتيس لتصوير فن شعبي عماني كالعيالة أو الرزحة، ويشرح الإحساس الذي تنقله هذه الألوان للمشاهد (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nس1 (مستوى المعرفة): ما أبرز خصائص الوحشية؟\nالإجابة: الألوان الصريحة الجريئة والتضاد.\n\nس2 (مستوى التطبيق): من رائد الوحشية؟\nالإجابة: ماتيس.\n\nس3 (مستوى الاستدلال): لماذا سميت بالوحشية؟\nالإجابة: لجرأة ألوانها وخروجها عن المألوف.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى المعرفة): ما قياس التخطيط؟\nالإجابة: (15×20) سم.\n\nس2 (مستوى التطبيق): لماذا نبسط الأشكال في الوحشية؟\nالإجابة: لترك المجال للون الصريح.\n\nس3 (مستوى الاستدلال): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nس1 (مستوى المعرفة): ما التضاد اللوني؟\nالإجابة: تجاور ألوان متقابلة في الدائرة اللونية.\n\nس2 (مستوى التطبيق): اذكر زوجًا متضادًا.\nالإجابة: الأزرق والبرتقالي.\n\nس3 (مستوى الاستدلال): حلل خطة زميل.\nالإجابة: تحليل معلل.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nس1 (مستوى المعرفة): ما القيمة المستهدفة؟\nالإجابة: التضاد اللوني.\n\nس2 (مستوى التطبيق): كيف تلون المساحات الوحشية؟\nالإجابة: بألوان صريحة مسطحة متضادة.\n\nس3 (مستوى الاستدلال): حلل تلوين زميل.\nالإجابة: تحليل معلل.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nس1 (مستوى المعرفة): ما معيار نجاح العمل الوحشي؟\nالإجابة: جرأة اللون والتضاد والتبسيط.\n\nس2 (مستوى التطبيق): انقد عمل زميل.\nالإجابة: نقد معلل.\n\nس3 (مستوى الاستدلال): اقترح تحسينًا.\nالإجابة: إجابة معللة.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nس1 (مستوى المعرفة): بماذا تهتم التعبيرية؟\nالإجابة: بالتعبير عن المشاعر الداخلية.\n\nس2 (مستوى التطبيق): من فنان تعبيري شهير؟\nالإجابة: مونخ.\n\nس3 (مستوى الاستدلال): ما الفرق بين الوحشية والتعبيرية؟\nالإجابة: الوحشية تهتم بجمال اللون، والتعبيرية بالمشاعر الداخلية.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nس1 (مستوى المعرفة): كيف تعبر الخطوط عن الشعور؟\nالإجابة: الملتوية للقلق والهادئة للسكينة.\n\nس2 (مستوى التطبيق): ما القيمة المستهدفة في التخطيط؟\nالإجابة: التناسب الشكلي مع الأرضية.\n\nس3 (مستوى الاستدلال): حلل تخطيط زميل.\nالإجابة: تحليل معلل.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nس1 (مستوى المعرفة): ما القيمة المستهدفة؟\nالإجابة: الانسجام اللوني.\n\nس2 (مستوى التطبيق): كيف يعبر اللون عن الشعور؟\nالإجابة: بارتباط الألوان بالأحاسيس (الأحمر للانفعال، الأزرق للهدوء).\n\nس3 (مستوى الاستدلال): حلل عمل زميل.\nالإجابة: تحليل معلل.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nس1 (مستوى المعرفة): رتب المدارس زمنيًا.\nالإجابة: الواقعية، التأثيرية، الوحشية والتعبيرية، التكعيبية، المستقبلية، التجريدية، السريالية.\n\nس2 (مستوى التطبيق): ما دورك في المعرض؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): حدد مدرسة عمل معروض.\nالإجابة: إجابة صحيحة.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nس1 (مستوى المعرفة): ما المدرسة التي تعبر عن الأحلام؟\nالإجابة: السريالية.\n\nس2 (مستوى التطبيق): ما المدرسة التي تعتمد الألوان الصريحة؟\nالإجابة: الوحشية.\n\nس3 (مستوى الاستدلال): صمم سؤالًا عن الوحدة.\nالإجابة: إجابة إبداعية.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nس1 (مستوى المعرفة): اذكر خاصيتين للوحشية.\nالإجابة: الألوان الصريحة والتبسيط.\n\nس2 (مستوى التطبيق): حلل لوحة لماتيس.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في جرأة اللون.\nالإجابة: رأي معلل.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nس1 (مستوى المعرفة): ما موضوعك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف التبسيط.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nس1 (مستوى المعرفة): ما أزواجك المتضادة؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف خطتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم جرأة خطتك.\nالإجابة: تقييم معلل.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nس1 (مستوى المعرفة): صف ألوانك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): أين ظهر التضاد؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nس1 (مستوى المعرفة): ما خاصية الوحشية في عملك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): احكم على عملك.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): اقترح عنوانًا.\nالإجابة: إجابة إبداعية.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nس1 (مستوى المعرفة): اذكر خاصية للتعبيرية.\nالإجابة: التحريف للتعبير عن المشاعر.\n\nس2 (مستوى التطبيق): حلل لوحة لمونخ.\nالإجابة: تحليل صحيح.\n\nس3 (مستوى الاستدلال): أبدِ رأيك في التعبيرية.\nالإجابة: رأي معلل.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nس1 (مستوى المعرفة): ما شعورك المختار؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صف تخطيطك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم تخطيطك.\nالإجابة: تقييم معلل.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nس1 (مستوى المعرفة): صف ألوانك.\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): ما الشعور الذي عبرت عنه؟\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيّم عملك.\nالإجابة: تقييم معلل.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nس1 (مستوى المعرفة): ما أكثر مدرسة أحببتها؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس2 (مستوى التطبيق): قيّم تنظيم المعرض.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): اقترح فكرة لمعرض قادم.\nالإجابة: إجابة إبداعية.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nس1 (مستوى المعرفة): اذكر خاصية للتكعيبية.\nالإجابة: تعدد زوايا النظر.\n\nس2 (مستوى التطبيق): احكم على أفضل أعمالك في الفصل.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): حدد هدفًا للفصل القادم.\nالإجابة: إجابة شخصية.", "الحصة 1: خصائص المدرسة الوحشية وأعمال ماتيس\nإرشاد للطالب: يتأمل لوحات ماتيس.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 52–53.\n\nالحصة 2: تخطيط عمل فني وحشي (15×20) سم محققًا التناسب الشكلي مع الأرضية\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 3: التخطيط اللوني الوحشي: الألوان المتضادة الصريحة\nإرشاد للطالب: يلاحظ الألوان المتضادة حوله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 4: تلوين اللوحة بأسلوب الوحشية محققًا التضاد اللوني\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 53.\n\nالحصة 5: إخراج العمل الوحشي ونقده\nإرشاد للطالب: يحتفظ بعمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 52–53.\n\nالحصة 6: خصائص المدرسة التعبيرية وأعمال مونخ\nإرشاد للطالب: يتأمل علاقة الفن بالمشاعر.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 7: تخطيط عمل تعبيري يعبر عن شعور محدد\nإرشاد للطالب: يعبر عن مشاعره بطرق صحية.\nإرشاد لولي الأمر: يستمع لابنه ويحاوره.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 8: تلوين العمل التعبيري محققًا الانسجام اللوني\nإرشاد للطالب: يتابع عمله.\nإرشاد لولي الأمر: يتابع ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 54.\n\nالحصة 9: معرض المدارس الفنية الحديثة: عرض الأعمال ونقدها\nإرشاد للطالب: يشارك أسرته صور المعرض.\nإرشاد لولي الأمر: يحضر المعرض إن أمكن.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 39–54.\n\nالحصة 10: تقويم وحدة الفن الحديث وتقويم الفصل الدراسي\nإرشاد للطالب: يراجع ملف إنجازه.\nإرشاد لولي الأمر: يطلع على إنجاز ابنه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف الثاني عشر) ص 39–54.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/arts/?l=12"]}]);

function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
<script src="/assets/qlink.js" defer></script>
</body>
</html>
