e-height:1.9\"><b>2. تحليل:<\/b> يفسر عمل هذه التطبيقات بدلالة القوة الكهربائية على الجسيمات المشحونة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يقترح تطبيقًا يستفيد من المجال الكهربائي في بيئته المحلية<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على المشاريع<\/span><span class=\"chip\">التعلم التشاركي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>المرسّب الكهروستاتيكي، الطلاء الكهروستاتيكي، الجسيمات المشحونة، التلوث الصناعي، القوة الكهربائية.<\/p>", "<p>يعرض المعلم صورة مدخنة مصنع إسمنت ويسأل: «كيف تُزال جسيمات الغبار من الدخان قبل خروجه دون مرشحات تنسد بسرعة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون شحن الجسيمات وجذبها (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم المرسّب الكهروستاتيكي والطلاء الكهروستاتيكي بمخططات، والطلبة يرسمون مخططًا لكل تطبيق ويحددون اتجاه القوة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> الاستراتيجيتان: التعلم التشاركي، التعلم المبني على المشاريع: يكلف المجموعات بإعداد بطاقة لتطبيق مقترح في البيئة المحلية، والطلبة يصممون البطاقة ويعرضونها باختصار (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على المشاريع.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على المجال الكهربائي، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف يزيل المرسّب الكهروستاتيكي الغبار من الدخان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تُشحن الجسيمات ثم تنجذب إلى ألواح مشحونة بشحنة معاكسة فتتجمع عليها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما فائدة الطلاء الكهروستاتيكي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: توزيع الطلاء بانتظام وتقليل الهدر لأن الجسيمات المشحونة تنجذب إلى الجسم المطلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يصل الطلاء المشحون إلى خلف الجسم أيضًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن خطوط المجال تلتف حول الجسم فتتبعها الجسيمات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نوع القوة المستخدمة في المرسّب الكهروستاتيكي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قوة كهربائية (تجاذب بين شحنتين مختلفتين).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر فائدة بيئية للمرسّب الكهروستاتيكي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقليل تلوث الهواء بالجسيمات الدقيقة الخارجة من المصانع.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تطبيقًا محليًا للمجال الكهربائي مع تفسير مبدأ عمله.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مثال: مرسّب لتنقية هواء ورشة نجارة؛ تُشحن نشارة الخشب الدقيقة وتُجمع على ألواح مشحونة بشحنة معاكسة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-1 وكتابة فقرة عن تطبيق للمجال الكهربائي<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن جهود الحد من تلوث الهواء في المناطق الصناعية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=5<\/p>"]}]}, {"title": "شدة المجال الكهربائي", "sb": "الموضوع 2-2 (الأسئلة 5–8)", "unit": "الوحدة 2: المجالات الكهربائية وقانون كولوم", "periods": [{"axis": "المجال المنتظم بين لوحين فلزيين متوازيين", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "شدة المجال الكهربائي"], ["الحصة", "1 من 3"], ["محور الحصة", "المجال المنتظم بين لوحين فلزيين متوازيين"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "الموضوع 2-2 (الأسئلة 5–8)"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي ص 44"]], "t": ["1. يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎\n2. يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎\nمخرج تعليمي آخر: يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال", "1. تطبيق: يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎\n2. فهم: يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎\n3. تحليل (مخرج آخر): يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: لوحان فلزيان متوازيان ومصدر جهد عالٍ آمن (عرض توضيحي)", "المجال المنتظم، اللوحان المتوازيان، فرق الجهد ‎ΔV‎، المسافة ‎Δd‎، ‎E = ΔV/Δd‎، ‎V/m‎.", "يسأل المعلم: «في لوحين متوازيين يفصلهما ‎1 cm‎ وبينهما ‎100 V‎، وآخرين يفصلهما ‎1 m‎ وبينهما ‎100 V‎؛ أيهما مجاله أقوى؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون أن المسافة الأقل تعطي مجالًا أقوى (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم نشاط «لوحين فلزيين متوازيين» ويشرح ‎E = ΔV/Δd‎ وتكافؤ الوحدات، والطلبة يشتقون تكافؤ ‎V/m‎ و‎N/C‎ ويحسبون مثالين (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل تغيير ‎V‎ و‎d‎، والطلبة يتنبؤون بالنتائج ويحسبون في أزواج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: اكتب معادلة شدة المجال المنتظم بين لوحين.\n• الإجابة النموذجية: ‎E = ΔV/Δd‎\n\n2. مستوى التطبيق: احسب ‎E‎ بين لوحين بينهما ‎200 V‎ والمسافة ‎0.040 m‎.\n• الإجابة النموذجية: ‎E = 5.0 × 10³ V/m‎.\n\n3. مستوى الاستدلال: أثبت أن ‎V/m‎ تكافئ ‎N/C‎.\n• الإجابة النموذجية: ‎V = J/C = N m/C‎، إذن ‎V/m = N/C‎.", "1. مستوى المعرفة: ما أثر مضاعفة المسافة بين اللوحين مع ثبات ‎V‎؟\n• الإجابة النموذجية: تقل ‎E‎ إلى النصف.\n\n2. مستوى التطبيق: احسب فرق الجهد اللازم لمجال ‎2.0 × 10⁴ V/m‎ بين لوحين بينهما ‎5.0 mm‎.\n• الإجابة النموذجية: ‎ΔV = 100 V‎.\n\n3. مستوى الاستدلال: لماذا يكون المجال بين اللوحين منتظمًا في الوسط فقط؟\n• الإجابة النموذجية: لأن خطوط المجال تكون متوازية ومتساوية التباعد في الوسط وتنحني عند الحواف.", "إرشاد للطالب: مراجعة الموضوع 2-2 وحل ثلاث مسائل على ‎E = V/d‎\nإرشاد لولي الأمر: سؤال الابن عن تكافؤ الوحدتين ‎V/m‎ و‎N/C‎\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎<\/li><li>يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: لوحان فلزيان متوازيان ومصدر جهد عالٍ آمن (عرض توضيحي)<\/span><\/div>", "<p>المجال المنتظم، اللوحان المتوازيان، فرق الجهد ‎ΔV‎، المسافة ‎Δd‎، ‎E = ΔV/Δd‎، ‎V/m‎.<\/p>", "<p>يسأل المعلم: «في لوحين متوازيين يفصلهما ‎1 cm‎ وبينهما ‎100 V‎، وآخرين يفصلهما ‎1 m‎ وبينهما ‎100 V‎؛ أيهما مجاله أقوى؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون أن المسافة الأقل تعطي مجالًا أقوى (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم نشاط «لوحين فلزيين متوازيين» ويشرح ‎E = ΔV/Δd‎ وتكافؤ الوحدات، والطلبة يشتقون تكافؤ ‎V/m‎ و‎N/C‎ ويحسبون مثالين (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل تغيير ‎V‎ و‎d‎، والطلبة يتنبؤون بالنتائج ويحسبون في أزواج (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة شدة المجال المنتظم بين لوحين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = ΔV/Δd‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎E‎ بين لوحين بينهما ‎200 V‎ والمسافة ‎0.040 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = 5.0 × 10³ V/m‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أثبت أن ‎V/m‎ تكافئ ‎N/C‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = J/C = N m/C‎، إذن ‎V/m = N/C‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما أثر مضاعفة المسافة بين اللوحين مع ثبات ‎V‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل ‎E‎ إلى النصف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب فرق الجهد اللازم لمجال ‎2.0 × 10⁴ V/m‎ بين لوحين بينهما ‎5.0 mm‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔV = 100 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون المجال بين اللوحين منتظمًا في الوسط فقط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن خطوط المجال تكون متوازية ومتساوية التباعد في الوسط وتنحني عند الحواف.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-2 وحل ثلاث مسائل على ‎E = V/d‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تكافؤ الوحدتين ‎V/m‎ و‎N/C‎<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6<\/p>"]}, {"axis": "حسابات شدة المجال والقوة بين لوحين", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "شدة المجال الكهربائي"], ["الحصة", "2 من 3"], ["محور الحصة", "حسابات شدة المجال والقوة بين لوحين"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "الموضوع 2-2 (الأسئلة 5–8)"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي ص 44"]], "t": ["1. يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا\n2. يحسب تسارع إلكترون أو بروتون في مجال منتظم\nمخرج تعليمي آخر: يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم", "1. تطبيق: يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا\n2. تطبيق: يحسب تسارع إلكترون أو بروتون في مجال منتظم\n3. تحليل (مخرج آخر): يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎F = QE‎، ‎E = V/d‎، تسارع الجسيم المشحون ‎a = F/m‎، شحنة الإلكترون، كتلة الإلكترون، إهمال الوزن.", "يسأل المعلم: «إلكترون بين لوحين بينهما ‎200 V‎ على بعد ‎4.0 cm‎؛ هل يمكن إهمال وزنه عند حساب حركته؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون ويطلبون الحساب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل المعلم مثالًا لحساب ‎E‎ ثم ‎F‎ ثم ‎a‎ للإلكترون ويقارن ‎F‎ بالوزن، والطلبة يتبعون خطوات الحل (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم مسائل متدرجة لبروتون وأيونات، والطلبة يحلون في أزواج ويعرضون (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب القوة على إلكترون ‎(1.60 × 10⁻¹⁹ C)‎ في مجال ‎5.0 × 10³ V/m‎.\n• الإجابة النموذجية: ‎F = 8.0 × 10⁻¹⁶ N‎.\n\n2. مستوى التطبيق: احسب تسارعه ‎(m = 9.11 × 10⁻³¹ kg)‎.\n• الإجابة النموذجية: ‎a = 8.0 × 10⁻¹⁶ ÷ 9.11 × 10⁻³¹ = 8.8 × 10¹⁴ m/s²‎.\n\n3. مستوى الاستدلال: قارن القوة الكهربائية بوزن الإلكترون.\n• الإجابة النموذجية: الوزن ≈ ‎8.9 × 10⁻³⁰ N‎، أي أصغر بنحو ‎10¹⁴‎ مرة، فيُهمل.", "1. مستوى المعرفة: اكتب خطوات حساب القوة على شحنة بين لوحين.\n• الإجابة النموذجية: ‎E = V/d‎ ثم ‎F = QE‎.\n\n2. مستوى التطبيق: احسب القوة على بروتون بين لوحين بينهما ‎500 V‎ والمسافة ‎0.10 m‎.\n• الإجابة النموذجية: ‎E = 5000 V/m‎؛ ‎F = 8.0 × 10⁻¹⁶ N‎.\n\n3. مستوى الاستدلال: إذا كان تسارع البروتون أصغر من تسارع الإلكترون في المجال نفسه، ففسّر ذلك.\n• الإجابة النموذجية: القوة متساوية المقدار لتساوي الشحنتين، لكن كتلة البروتون أكبر بنحو 1840 مرة فيقل تسارعه.", "إرشاد للطالب: حل الأسئلة 5–8 في كتاب الطالب\nإرشاد لولي الأمر: متابعة الابن في ترتيب خطوات الحل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6"], "h": ["<ol class=\"ol\"><li>يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا<\/li><li>يحسب تسارع إلكترون أو بروتون في مجال منتظم<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب تسارع إلكترون أو بروتون في مجال منتظم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>‎F = QE‎، ‎E = V/d‎، تسارع الجسيم المشحون ‎a = F/m‎، شحنة الإلكترون، كتلة الإلكترون، إهمال الوزن.<\/p>", "<p>يسأل المعلم: «إلكترون بين لوحين بينهما ‎200 V‎ على بعد ‎4.0 cm‎؛ هل يمكن إهمال وزنه عند حساب حركته؟»<\/p>", "<div class= ", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب خطوات حساب القوة على شحنة بين لوحين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = V/d‎ ثم ‎F = QE‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب القوة على بروتون بين لوحين بينهما ‎500 V‎ والمسافة ‎0.10 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = 5000 V/m‎؛ ‎F = 8.0 × 10⁻¹⁶ N‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا كان تسارع البروتون أصغر من تسارع الإلكترون في المجال نفسه، ففسّر ذلك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوة متساوية المقدار لتساوي الشحنتين، لكن كتلة البروتون أكبر بنحو 1840 مرة فيقل تسارعه.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل الأسئلة 5–8 في كتاب الطالب<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في ترتيب خطوات الحل<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6<\/p>"]}, {"axis": "نشاط 2-2: حساب القوة وشدة المجال الكهربائي", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "شدة المجال الكهربائي"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "الموضوع 2-2 + كتاب التجارب ص 44"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي ص 44"]], "t": ["1. يحل نشاط 2-2 «حساب القوة وشدة المجال الكهربائي»\n2. يحول الوحدات (‎mm‎، ‎cm‎، ‎kV‎، μ‎C‎) إلى النظام الدولي قبل الحساب\nمخرج تعليمي آخر: يكتشف الأخطاء الشائعة في حلول نموذجية ويصححها", "1. تطبيق: يحل نشاط 2-2 «حساب القوة وشدة المجال الكهربائي»\n2. تطبيق: يحول الوحدات (‎mm‎، ‎cm‎، ‎kV‎، μ‎C‎) إلى ا ددون الاتجاهات ويكتبون علاقة الطاقة (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدم المعلم مسائل حساب سرعة إلكترون بعد تسارعه عبر فرق جهد، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: في أي اتجاه تتسارع شحنة موجبة موضوعة في مجال منتظم؟\n• الإجابة النموذجية: في اتجاه المجال.\n\n2. مستوى التطبيق: ما الشغل المبذول على إلكترون يُسرَّع عبر ‎100 V‎؟\n• الإجابة النموذجية: ‎W = QV = 1.6 × 10⁻¹⁷ J‎.\n\n3. مستوى الاستدلال: احسب سرعة إلكترون بدأ من السكون وتسارع عبر ‎100 V‎.\n• الإجابة النموذجية: ½‎mv² = 1.6 × 10⁻¹⁷ ← v = 5.9 × 10⁶ m/s‎.", "1. مستوى المعرفة: اكتب معادلة القوة على شحنة في مجال كهربائي.\n• الإجابة النموذجية: ‎F = QE‎\n\n2. مستوى التطبيق: ماذا يحدث لإلكترون يدخل مجالًا منتظمًا في اتجاه المجال نفسه؟\n• الإجابة النموذجية: يتباطأ لأن القوة عليه عكس اتجاه المجال.\n\n3. مستوى الاستدلال: إذا تضاعف فرق الجهد المسرِّع، فكم مرة تزداد سرعة الإلكترون النهائية؟\n• الإجابة النموذجية: ‎√2‎ مرة.", "إرشاد للطالب: مراجعة الموضوع 2-3 وحل مسألتين على ‎QV = ½mv²‎\nإرشاد لولي الأمر: الحديث مع الابن عن أجهزة تستخدم مسرعات الجسيمات في الطب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=7"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة القوة المؤثرة على شحنة في مجال كهربائي ‎F = QE‎<\/li><li>يصف تأثير المجال المنتظم على جسيم مشحون يتحرك موازيًا لخطوط المجال (تسارع أو تباطؤ)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب سرعة إلكترون بعد تسارعه عبر فرق جهد باستخدام ‎QV = ½mv²‎<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم معادلة القوة المؤثرة على شحنة في مجال كهربائي ‎F = QE‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف تأثير المجال المنتظم على جسيم مشحون يتحرك موازيًا لخطوط المجال (تسارع أو تباطؤ)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب سرعة إلكترون بعد تسارعه عبر فرق جهد باستخدام ‎QV = ½mv²‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>‎F = QE‎، الشحنة الموجبة والسالبة، التسارع المنتظم، الشغل ‎QV‎، الطاقة الحركية، مدفع الإلكترونات.<\/p>", "<p>يعرض المعلم صورة أنبوب أشعة مهبطية قديم ويسأل: «كيف تُسرَّع الإلكترونات إلى سرعات كبيرة داخله دون أي محرك؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون مجالًا كهربائيًا بين قطبين (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم ‎F = QE‎ واتجاهها لشحنات موجبة وسالبة، ثم تسارع الجسيم الداخل موازيًا للمجال وعلاقة الشغل ‎QV‎، والطلبة يحددون الاتجاهات ويكتبون علاقة الطاقة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب سرعة إلكترون بعد تسارعه عبر فرق جهد، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> في أي اتجاه تتسارع شحنة موجبة موضوعة في مجال منتظم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في اتجاه المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الشغل المبذول على إلكترون يُسرَّع عبر ‎100 V‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = QV = 1.6 × 10⁻¹⁷ J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب سرعة إلكترون بدأ من السكون وتسارع عبر ‎100 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ½‎mv² = 1.6 × 10⁻¹⁷ ← v = 5.9 × 10⁶ m/s‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة القوة على شحنة في مجال كهربائي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = QE‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لإلكترون يدخل مجالًا منتظمًا في اتجاه المجال نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتباطأ لأن القوة عليه عكس اتجاه المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا تضاعف فرق الجهد المسرِّع، فكم مرة تزداد سرعة الإلكترون النهائية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎√2‎ مرة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-3 وحل مسألتين على ‎QV = ½mv²‎<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أجهزة تستخدم مسرعات الجسيمات في الطب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=7<\/p>"]}, {"axis": "حركة الجسيمات المشحونة عموديًا على مجال منتظم", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "القوة المؤثرة على شحنة كهربائية"], ["الحصة", "2 من 2"], ["محور الحصة", "حركة الجسيمات المشحونة عموديًا على مجال منتظم"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-3 + كتاب التجارب ص 46"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: حركة الشحنات في مجال كهربائي ص 46"]], "t": ["1. يصف تأثير المجال الكهربائي المنتظم على جسيم مشحون يدخل عموديًا على خطوط المجال (مسار قطع مكافئ)\n2. يحلل حركة الجسيم إلى مركبتين: منتظمة موازية للألواح ومتسارعة عمودية عليها\nمخرج تعليمي آخر: يحل نشاط 2-3 «حركة الشحنات في مجال كهربائي» والأسئلة 9–12", "1. فهم: يصف تأثير المجال الكهربائي المنتظم على جسيم مشحون يدخل عموديًا على خطوط المجال (مسار قطع مكافئ)\n2. تحليل: يحلل حركة الجسيم إلى مركبتين: منتظمة موازية للألواح ومتسارعة عمودية عليها\n3. تطبيق (مخرج آخر): يحل نشاط 2-3 «حركة الشحنات في مجال كهربائي» والأسئلة 9–12", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز الحاسب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة انحراف الجسيمات المشحونة", "المسار المنحني (قطع مكافئ)، المركبة الأفقية المنتظمة، المركبة الرأسية المتسارعة، الانحراف، المقذوفات.", "يسأل المعلم: «تذكر مسار كرة تُقذف أفقيًا من سطح طاولة؛ ماذا تتوقع لمسار إلكترون يدخل أفقيًا بين لوحين مشحونين؟» (نشاط الجسيمات المشحونة في مجال منتظم).", "1. يطرح المعلم التشبيه، والطلبة يتوقعون مسارًا منحنيًا يشبه المقذوفات (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم تحليل الحركة إلى مركبتين ويعرض محاكاة للانحراف، والطلبة يرسمون المسار ويكتبون معادلتي المركبتين (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يوجه المعلم حل نشاط 2-3 (ص 46) والأسئلة 9–12، والطلبة يحلون في أزواج ويعرضون (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يختم المعلم بمسابقة المجموعات، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. مستوى المعرفة: لماذا تبقى المركبة الأفقية لسرعة الإلكترون ثابتة بين اللوحين؟\n• الإجابة النموذجية: لأن القوة الكهربائية رأسية فقط ولا توجد قوة أفقية.\n\n2. مستوى التطبيق: ما شكل مسار الإلكترون بين اللوحين؟\n• الإجابة النموذجية: قطع مكافئ.\n\n3. مستوى الاستدلال: إلى أي لوح ينحرف الإلكترون؟\n• الإجابة النموذجية: نحو اللوح الموجب.", "1. مستوى المعرفة: ما نوع حركة الإلكترون في الاتجاه العمودي على اللوحين؟\n• الإجابة النموذجية: حركة متسارعة بانتظام.\n\n2. مستوى التطبيق: كيف يتغير الانحراف إذا زادت سرعة الإلكترون الأفقية؟\n• الإجابة النموذجية: يقل، لأن زمن بقائه بين اللوحين يقل.\n\n3. مستوى الاستدلال: إلكترون وبروتون دخلا بالسرعة نفسها بين لوحين؛ قارن انحرافيهما.\n• الإجابة النموذجية: ينحرفان في اتجاهين متعاكسين، وانحراف الإلكترون أكبر بكثير لصغر كتلته.", "إرشاد للطالب: إكمال نشاط 2-3 ص 46 والأسئلة 9–12\nإرشاد لولي الأمر: الحديث مع الابن عن تشابه حركة الإلكترون بين اللوحين وحركة المقذوفات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=7"], "h": ["<ol class=\"ol\"><li>يصف تأثير المجال الكهربائي المنتظم على جسيم مشحون يدخل عموديًا على خطوط المجال (مسار قطع مكافئ)<\/li><li>يحلل حركة الجسيم إلى مركبتين: منتظمة موازية للألواح ومتسارعة عمودية عليها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاط 2-3 «حركة الشحنات في مجال كهربائي» والأسئلة 9–12<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تأثير المجال الكهربائي المنتظم على جسيم مشحون يدخل عموديًا على خطوط المجال (مسار قطع مكافئ)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحلل حركة الجسيم إلى مركبتين: منتظمة موازية للألواح ومتسارعة عمودية عليها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل نشاط 2-3 «حركة الشحنات في مجال كهربائي» والأسئلة 9–12<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز الحاسب<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: محاكاة انحراف الجسيمات المشحونة<\/span><\/div>", "<p>المسار المنحني (قطع مكافئ)، المركبة الأفقية المنتظمة، المركبة الرأسية المتسارعة، الانحراف، المقذوفات.<\/p>", "<p>يسأل المعلم: «تذكر مسار كرة تُقذف أفقيًا من سطح طاولة؛ ماذا تتوقع لمسار إلكترون يدخل أفقيًا بين لوحين مشحونين؟» (نشاط الجسيمات المشحونة في مجال منتظم).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم التشبيه، والطلبة يتوقعون مسارًا منحنيًا يشبه المقذوفات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تحليل الحركة إلى مركبتين ويعرض محاكاة للانحراف، والطلبة يرسمون المسار ويكتبون معادلتي المركبتين (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-3 (ص 46) والأسئلة 9–12، والطلبة يحلون في أزواج ويعرضون (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تبقى المركبة الأفقية لسرعة الإلكترون ثابتة بين اللوحين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن القوة الكهربائية رأسية فقط ولا توجد قوة أفقية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما شكل مسار الإلكترون بين اللوحين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قطع مكافئ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إلى أي لوح ينحرف الإلكترون؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو اللوح الموجب.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نوع حركة الإلكترون في الاتجاه العمودي على اللوحين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حركة متسارعة بانتظام.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف يتغير الانحراف إذا زادت سرعة الإلكترون الأفقية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يقل، لأن زمن بقائه بين اللوحين يقل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إلكترون وبروتون دخلا بالسرعة نفسها بين لوحين؛ قارن انحرافيهما.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ينحرفان في اتجاهين متعاكسين، وانحراف الإلكترون أكبر بكثير لصغر كتلته.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-3 ص 46 والأسئلة 9–12<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن تشابه حركة الإلكترون بين اللوحين وحركة المقذوفات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=7<\/p>"]}]}, {"title": "قانون كولوم والمجالات الشعاعية", "sb": "الموضوع 2-4 (السؤالان 13، 14)", "unit": "الوحدة 2: المجالات الكهربائية وقانون كولوم", "periods": [{"axis": "قانون كولوم للقوة بين شحنتين نقطيتين", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "1 من 3"], ["محور الحصة", "قانون كولوم للقوة بين شحنتين نقطيتين"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 (السؤالان 13، 14)"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎\n2. يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه\nمخرج تعليمي آخر: يقارن بين قانون كولوم وقانون نيوتن للجاذبية", "1. تطبيق: يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎\n2. تذكر: يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه\n3. تحليل (مخرج آخر): يقارن بين قانون كولوم وقانون نيوتن للجاذبية", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "قانون كولوم، سماحية الفراغ ε‎₀‎، الثابت ‎1/(4πε₀) ≈ 8.99 × 10⁹‎، الشحنة النقطية، التربيع العكسي، التجاذب والتنافر.", "يعرض المعلم كرتين خفيفتين مشحونتين معلقتين بخيطين تتنافران ويسأل: «إذا قربنا الكرتين إلى نصف المسافة، فكم مرة تتوقع أن تزداد القوة؟» ويذكّر بقانون نيوتن للجاذبية.", "1. يعرض المعلم الكرتين ويطرح السؤال، والطلبة يتوقعون أربع مرات قياسًا على الجاذبية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «قانون كولوم وخطوط المجال الكهربائي» ويشرح المعادلة وقيمة ε‎₀‎، والطلبة يكتبون المعادلة ويحسبون مثالًا (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدم المعلم مسائل متدرجة ومقارنة بقانون نيوتن، والطلبة يحلون في أزواج ويكملون جدول المقارنة (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب القوة بين شحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.\n• الإجابة النموذجية: ‎F = 8.99 × 10⁹ × (1.0 × 10⁻⁶)² ÷ 0.010 = 0.90 N‎.\n\n2. مستوى التطبيق: ماذا يحدث للقوة إذا ضوعفت كل شحنة؟\n• الإجابة النموذجية: تصبح أربعة أضعاف.\n\n3. مستوى الاستدلال: اذكر فرقًا وتشابهًا بين قانون كولوم وقانون نيوتن للجاذبية.\n• الإجابة النموذجية: كلاهما تربيع عكسي؛ الجاذبية تجاذب فقط بين الكتل، وكولوم تجاذب أو تنافر بين الشحنات.", "1. مستوى المعرفة: ما قيمة ‎1/(4πε₀)‎ تقريبًا؟\n• الإجابة النموذجية: ‎8.99 × 10⁹ N m² C⁻²‎.\n\n2. مستوى التطبيق: من أين تُقاس ‎r‎ للكرة الموصلة المشحونة؟\n• الإجابة النموذجية: من مركزها.\n\n3. مستوى الاستدلال: احسب القوة بين بروتون وإلكترون بينهما ‎5.3 × 10⁻¹¹ m‎.\n• الإجابة النموذجية: ‎F = 8.99 × 10⁹ × (1.6 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N‎.", "إرشاد للطالب: مراجعة الموضوع 2-4 وحل مسألتين على قانون كولوم\nإرشاد لولي الأمر: سؤال الابن عن أوجه الشبه بين قانوني كولوم ونيوتن\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎<\/li><li>يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين قانون كولوم وقانون نيوتن للجاذبية<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين قانون كولوم وقانون نيوتن للجاذبية<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>قانون كولوم، سماحية الفراغ ε‎₀‎، الثابت ‎1/(4πε₀) ≈ 8.99 × 10⁹‎، الشحنة النقطية، التربيع العكسي، التجاذب والتنافر.<\/p>", "<p>يعرض المعلم كرتين خفيفتين مشحونتين معلقتين بخيطين تتنافران ويسأل: «إذا قربنا الكرتين إلى نصف المسافة، فكم مرة تتوقع أن تزداد القوة؟» ويذكّر بقانون نيوتن للجاذبية.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الكرتين ويطرح السؤال، والطلبة يتوقعون أربع مرات قياسًا على الجاذبية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «قانون كولوم وخطوط المجال الكهربائي» ويشرح المعادلة وقيمة ε‎₀‎، والطلبة يكتبون المعادلة ويحسبون مثالًا (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل متدرجة ومقارنة بقانون نيوتن، والطلبة يحلون في أزواج ويكملون جدول المقارنة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب القوة بين شحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 8.99 × 10⁹ × (1.0 × 10⁻⁶)² ÷ 0.010 = 0.90 N‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث للقوة إذا ضوعفت كل شحنة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تصبح أربعة أضعاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اذكر فرقًا وتشابهًا بين قانون كولوم وقانون نيوتن للجاذبية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: كلاهما تربيع عكسي؛ الجاذبية تجاذب فقط بين الكتل، وكولوم تجاذب أو تنافر بين الشحنات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما قيمة ‎1/(4πε₀)‎ تقريبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎8.99 × 10⁹ N m² C⁻²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> من أين تُقاس ‎r‎ للكرة الموصلة المشحونة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من مركزها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب القوة بين بروتون وإلكترون بينهما ‎5.3 × 10⁻¹¹ m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 8.99 × 10⁹ × (1.6 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-4 وحل مسألتين على قانون كولوم<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن أوجه الشبه بين قانوني كولوم ونيوتن<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8<\/p>"]}, {"axis": "شدة المجال الكهربائي لشحنة نقطية", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "2 من 3"], ["محور الحصة", "شدة المجال الكهربائي لشحنة نقطية"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 (السؤالان 13، 14)"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎\n2. يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين\nمخرج تعليمي آخر: يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما", "1. تطبيق: يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎\n2. تحليل: يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين\n3. تحليل (مخرج آخر): يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "المجال الشعاعي، ‎E = Q/(4πε₀r²)‎، التربيع العكسي، المجال المحصل، نقطة انعدام المجال.", "يسأل المعلم: «حول شحنة نقطية، هل يمكن استخدام ‎E = V/d‎ لحساب المجال؟ لماذا؟»", "1. يطرح المعلم السؤال، والطلبة يستنتجون أن المجال غير منتظم حول الشحنة النقطية (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشتق المعلم ‎E = Q/(4πε₀r²)‎ من قانون كولوم ويحل مثالًا، والطلبة يشتقون ويحسبون ‎E‎ على بعد معين (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم مسائل محصلة مجالين على خط واحد، والطلبة يحسبون في مجموعات ويحددون نقطة انعدام المجال (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب ‎E‎ على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.\n• الإجابة النموذجية: ‎E = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.090 = 2.0 × 10² N/C‎.\n\n2. مستوى التطبيق: كيف تتغير ‎E‎ إذا تضاعف البعد عن الشحنة؟\n• الإجابة النموذجية: تقل إلى الربع.\n\n3. مستوى الاستدلال: لماذا لا تصلح ‎E = V/d‎ حول شحنة نقطية؟\n• الإجابة النموذجية: لأن المجال غير منتظم، وتلك العلاقة للمجال المنتظم فقط.", "1. مستوى المعرفة: اكتب معادلة شدة المجال لشحنة نقطية.\n• الإجابة النموذجية: ‎E = Q/(4πε₀r²)‎\n\n2. مستوى التطبيق: شحنتان موجبتان متساويتان؛ أين ينعدم المجال المحصل؟\n• الإجابة النموذجية: في منتصف المسافة بينهما.\n\n3. مستوى الاستدلال: شحنتان ‎+4 μC‎ و‎+1 μC‎ بينهما ‎0.30 m‎. أين ينعدم المجال على الخط الواصل؟\n• الإجابة النموذجية: على بعد ‎0.20 m‎ من الشحنة ‎+4 μC (‎حيث ‎4/x² = 1/(0.30 − x)²‎).", "إرشاد للطالب: مراجعة الموضوع 2-4 وحل مسائل المجال المحصل\nإرشاد لولي الأمر: متابعة الابن في رسم متجهات المجال قبل الحساب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎<\/li><li>يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>المجال الشعاعي، ‎E = Q/(4πε₀r²)‎، التربيع العكسي، المجال المحصل، نقطة انعدام المجال.<\/p>", "<p>يسأل المعلم: «حول شحنة نقطية، هل يمكن استخدام ‎E = V/d‎ لحساب المجال؟ لماذا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يستنتجون أن المجال غير منتظم حول الشحنة النقطية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشتق المعلم ‎E = Q/(4πε₀r²)‎ من قانون كولوم ويحل مثالًا، والطلبة يشتقون ويحسبون ‎E‎ على بعد معين (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل محصلة مجالين على خط واحد، والطلبة يحسبون في مجموعات ويحددون نقطة انعدام المجال (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎E‎ على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.090 = 2.0 × 10² N/C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف تتغير ‎E‎ إذا تضاعف البعد عن الشحنة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل إلى الربع.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تصلح ‎E = V/d‎ حول شحنة نقطية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن المجال غير منتظم، وتلك العلاقة للمجال المنتظم فقط.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة شدة المجال لشحنة نقطية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = Q/(4πε₀r²)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> شحنتان موجبتان متساويتان؛ أين ينعدم المجال المحصل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في منتصف المسافة بينهما.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> شحنتان ‎+4 μC‎ و‎+1 μC‎ بينهما ‎0.30 m‎. أين ينعدم المجال على الخط الواصل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على بعد ‎0.20 m‎ من الشحنة ‎+4 μC (‎حيث ‎4/x² = 1/(0.30 − x)²‎).<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-4 وحل مسائل المجال المحصل<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في رسم متجهات المجال قبل الحساب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8<\/p>"]}, {"axis": "نشاط 2-4 والسؤالان 13 و14 ومقارنة المجالين", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 2-4 والسؤالان 13 و14 ومقارنة المجالين"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 + كتاب التجارب ص 48"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14\n2. يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول\nمخرج تعليمي آخر: يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية", "1. تطبيق: يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14\n2. تحليل: يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول\n3. تطبيق (مخرج آخر): يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "المجال المنتظم، المجال الشعاعي، مجال الجاذبية، جدول المقارنة، منحنى ‎E‎ مقابل ‎r‎.", "يعرض المعلم جدولًا فارغًا بثلاثة أعمدة (جاذبية، كهربائي منتظم، كهربائي شعاعي) ويطلب ملء صف «معادلة الشدة» خلال دقيقة.", "1. يدير المعلم ملء الصف الأول، والطلبة يكتبون المعادلات الثلاث (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الاستراتيجيتان: التعلم الذاتي، التعلم التعاوني: يوجه حل نشاط 2-4 (ص 48) والسؤالين 13 و14، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم إكمال جدول المقارنة ورسم ‎E‎ مقابل ‎r‎، والطلبة يكملون الجدول ويرسمون المنحنى (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يختم المعلم بمسابقة المجموعات على قانون كولوم، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: ما شكل منحنى ‎E‎ مقابل ‎r‎ لشحنة نقطية؟\n• الإجابة النموذجية: منحنى تربيع عكسي يتناقص بسرعة ثم ببطء.\n\n2. مستوى التطبيق: ما وجه الشبه بين ‎E‎ لشحنة نقطية و‎g‎ لكتلة نقطية؟\n• الإجابة النموذجية: كلاهما يتناسب عكسيًا مع مربع البعد.\n\n3. مستوى الاستدلال: ما الفرق بين المجال المنتظم والشعاعي من حيث تغير الشدة؟\n• الإجابة النموذجية: المنتظم ثابت الشدة، والشعاعي تتناقص شدته بالابتعاد عن المصدر.", "1. مستوى المعرفة: اكتب معادلتي شدة المجال الكهربائي المنتظم والشعاعي.\n• الإجابة النموذجية: المنتظم: ‎E = V/d‎، الشعاعي: ‎E = Q/(4πε₀r²)‎.\n\n2. مستوى التطبيق: إذا كانت ‎E = 800 N/C‎ على بعد ‎0.10 m‎ من شحنة نقطية، فكم تكون على بعد ‎0.40 m‎؟\n• الإجابة النموذجية: ‎50 N/C‎.\n\n3. مستوى الاستدلال: احسب الشحنة التي تولد مجالًا ‎9.0 × 10⁴ N/C‎ على بعد ‎0.20 m‎.\n• الإجابة النموذجية: ‎Q = E × 4πε₀ × r² = 9.0 × 10⁴ × 0.040 ÷ 8.99 × 10⁹ = 4.0 × 10⁻⁷ C‎.", "إرشاد للطالب: إكمال نشاط 2-4 ص 48 والسؤالين 13 و14 وجدول المقارنة\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين المجال المنتظم والشعاعي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8"], "h": ["<ol class=\"ol\"><li>يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14<\/li><li>يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>المجال المنتظم، المجال الشعاعي، مجال الجاذبية، جدول المقارنة، منحنى ‎E‎ مقابل ‎r‎.<\/p>", "<p>يعرض المعلم جدولًا فارغًا بثلاثة أعمدة (جاذبية، كهربائي منتظم، كهربائي شعاعي) ويطلب ملء صف «معادلة الشدة» خلال دقيقة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يدير المعلم ملء الصف الأول، والطلبة يكتبون المعادلات الثلاث (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: التعلم الذاتي، التعلم التعاوني: يوجه حل نشاط 2-4 (ص 48) والسؤالين 13 و14، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم إكمال جدول المقارنة ورسم ‎E‎ مقابل ‎r‎، والطلبة يكملون الجدول ويرسمون المنحنى (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على قانون كولوم، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما شكل منحنى ‎E‎ مقابل ‎r‎ لشحنة نقطية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: منحنى تربيع عكسي يتناقص بسرعة ثم ببطء.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما وجه الشبه بين ‎E‎ لشحنة نقطية و‎g‎ لكتلة نقطية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كلاهما يتناسب عكسيًا مع مربع البعد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الفرق بين المجال المنتظم والشعاعي من حيث تغير الشدة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المنتظم ثابت الشدة، والشعاعي تتناقص شدته بالابتعاد عن المصدر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلتي شدة المجال الكهربائي المنتظم والشعاعي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: المنتظم: ‎E = V/d‎، الشعاعي: ‎E = Q/(4πε₀r²)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> إذا كانت ‎E = 800 N/C‎ على بعد ‎0.10 m‎ من شحنة نقطية، فكم تكون على بعد ‎0.40 m‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎50 N/C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب الشحنة التي تولد مجالًا ‎9.0 × 10⁴ N/C‎ على بعد ‎0.20 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = E × 4πε₀ × r² = 9.0 × 10⁴ × 0.040 ÷ 8.99 × 10⁹ = 4.0 × 10⁻⁷ C‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-4 ص 48 والسؤالين 13 و14 وجدول المقارنة<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين المجال المنتظم والشعاعي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8<\/p>"]}]}, {"title": "الجهد وطاقة الوضع الكهربائية", "sb": "الموضوع 2-5 (الأسئلة 15–17)", "unit": "الوحدة 2: المجالات الكهربائية وقانون كولوم", "periods": [{"axis": "تعريف الجهد الكهربائي عند نقطة وجهد شحنة نقطية", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "1 من 3"], ["محور الحصة", "تعريف الجهد الكهربائي عند نقطة وجهد شحنة نقطية"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 (الأسئلة 15–17)"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎\nمخرج تعليمي آخر: يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة", "1. تذكر: يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. تطبيق: يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎\n3. تحليل (مخرج آخر): يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء الجهد الكهربائي", "- الكتاب\n- السبورة الذكية\n- جهاز الحاسب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة الجهد حول شحنة نقطية", "الجهد الكهربائي ‎V‎، الشغل لوحدة الشحنة، اللانهاية، ‎V = Q/(4πε₀r)‎، الفولت = ‎J/C‎، إشارة الجهد.", "يسأل المعلم: «تعلمنا جهد الجاذبية φ = ‎−GM/r‎؛ فما الذي تتوقعه لجهد شحنة نقطية؟ ولماذا قد يكون موجبًا هنا؟»", "1. يطرح المعلم السؤال، والطلبة يستنتجون التشابه ويتوقعون الإشارة الموجبة للشحنة الموجبة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. استقصاء الجهد الكهربائي: ينفذ المعلم «استقصاء الجهد الكهربائي» بمحاكاة لتغير ‎V‎ مع ‎r‎ ويشرح التعريف والمعادلة، والطلبة يسجلون ‎V‎ عند أبعاد مختلفة ويتحققون من ‎V ∝ 1/r‎ (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل حساب الجهد لشحنات موجبة وسالبة، والطلبة يحسبون في أزواج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم السؤال المفصلي (الفرق بين الجهد وفرق الجهد) ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. مستوى المعرفة: احسب الجهد على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.\n• الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.30 = 60 V‎.\n\n2. مستوى التطبيق: ما إشارة الجهد قرب شحنة سالبة؟\n• الإجابة النموذجية: سالبة.\n\n3. مستوى الاستدلال: ما الفرق بين الجهد عند نقطة وفرق الجهد بين نقطتين؟\n• الإجابة النموذجية: الجهد يُقاس نسبة إلى اللانهاية، وفرق الجهد هو الفرق بين جهدي نقطتين.", "1. مستوى المعرفة: ما وحدة الجهد الكهربائي بدلالة ‎J‎ و‎C‎؟\n• الإجابة النموذجية: ‎J/C (‎الفولت).\n\n2. مستوى التطبيق: كيف يتغير الجهد إذا تضاعف البعد عن الشحنة؟\n• الإجابة النموذجية: يقل إلى النصف.\n\n3. مستوى الاستدلال: احسب الجهد على سطح كرة موصلة نصف قطرها ‎0.10 m‎ تحمل ‎5.0 nC‎.\n• الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 5.0 × 10⁻⁹ ÷ 0.10 = 450 V‎.", "إرشاد للطالب: مراجعة الموضوع 2-5 وكتابة تعريف الجهد الكهربائي\nإرشاد لولي الأمر: سؤال الابن عن تشابه جهد الجاذبية والجهد الكهربائي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9"], "h": ["<ol class=\"ol\"><li>يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/li><li>يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">استقصاء الجهد الكهربائي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز الحاسب<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: محاكاة الجهد حول شحنة نقطية<\/span><\/div>", "<p>الجهد الكهربائي ‎V‎، الشغل لوحدة الشحنة، اللانهاية، ‎V = Q/(4πε₀r)‎، الفولت = ‎J/C‎، إشارة الجهد.<\/p>", "<p>يسأل المعلم: «تعلمنا جهد الجاذبية φ = ‎−GM/r‎؛ فما الذي تتوقعه لجهد شحنة نقطية؟ ولماذا قد يكون موجبًا هنا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يستنتجون التشابه ويتوقعون الإشارة الموجبة للشحنة الموجبة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> استقصاء الجهد الكهربائي: ينفذ المعلم «استقصاء الجهد الكهربائي» بمحاكاة لتغير ‎V‎ مع ‎r‎ ويشرح التعريف والمعادلة، والطلبة يسجلون ‎V‎ عند أبعاد مختلفة ويتحققون من ‎V ∝ 1/r‎ (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب الجهد لشحنات موجبة وسالبة، والطلبة يحسبون في أزواج (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي (الفرق بين الجهد وفرق الجهد) ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب الجهد على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.30 = 60 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما إشارة الجهد قرب شحنة سالبة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: سالبة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الفرق بين الجهد عند نقطة وفرق الجهد بين نقطتين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجهد يُقاس نسبة إلى اللانهاية، وفرق الجهد هو الفرق بين جهدي نقطتين.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة الجهد الكهربائي بدلالة ‎J‎ و‎C‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎J/C (‎الفولت).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف يتغير الجهد إذا تضاعف البعد عن الشحنة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يقل إلى النصف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب الجهد على سطح كرة موصلة نصف قطرها ‎0.10 m‎ تحمل ‎5.0 nC‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 5.0 × 10⁻⁹ ÷ 0.10 = 450 V‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-5 وكتابة تعريف الجهد الكهربائي<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشابه جهد الجاذبية والجهد الكهربائي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9<\/p>"]}, {"axis": "طاقة الوضع الكهربائية والعلاقة بين المجال وميل الجهد", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "2 من 3"], ["محور الحصة", "طاقة الوضع الكهربائية والعلاقة بين المجال وميل الجهد"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 (الأسئلة 15–17)"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎\n2. يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎\nمخرج تعليمي آخر: يحسب الشغل اللازم لتقريب شحنتين من بعضهما", "1. تطبيق: يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎\n2. تحليل: يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎\n3. تطبيق (مخرج آخر): يحسب الشغل اللازم لتقريب شحنتين من بعضهما", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "طاقة الوضع الكهربائية، ‎Eₚ = QV‎، ‎Eₚ = Q₁Q₂/(4πε₀r)‎، ميل الجهد، ‎E = −ΔV/Δr‎، الشغل المبذول.", "يسأل المعلم: «لتقريب شحنتين موجبتين من بعضهما نحتاج إلى دفعهما؛ أين تذهب الطاقة التي بذلناها؟»", "1. يطرح المعلم السؤال، والطلبة يستنتجون أنها تُخزن طاقة وضع (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم ‎Eₚ = QV‎ و‎Eₚ = Q₁Q₂/(4πε₀r)‎ وعلاقة المجال بميل الجهد، والطلبة يحسبون ‎Eₚ‎ لشحنتين ويرسمون ‎V‎ مقابل ‎r‎ (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم مسائل الشغل والطاقة ومثالًا لحساب ‎E‎ من ميل منحنى، والطلبة يحلون في مجموعات (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب طاقة الوضع لشحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.\n• الإجابة النموذجية: ‎Eₚ = 8.99 × 10⁹ × 10⁻¹² ÷ 0.10 = 0.090 J‎.\n\n2. مستوى التطبيق: احسب الشغل اللازم لتقريبهما إلى ‎0.050 m‎.\n• الإجابة النموذجية: ‎Eₚ‎ الجديدة = ‎0.18 J‎؛ الشغل = ‎0.090 J‎.\n\n3. مستوى الاستدلال: ماذا يمثل ميل منحنى ‎V‎ مقابل ‎r‎؟\n• الإجابة النموذجية: سالب شدة المجال الكهربائي ‎(E = −ΔV/Δr)‎.", "1. مستوى المعرفة: اكتب علاقة طاقة الوضع لشحنة في نقطة جهدها ‎V‎.\n• الإجابة النموذجية: ‎Eₚ = QV‎\n\n2. مستوى التطبيق: هل طاقة الوضع لشحنتين مختلفتين موجبة أم سالبة؟\n• الإجابة النموذجية: سالبة (تجاذب).\n\n3. مستوى الاستدلال: احسب ‎E‎ إذا تغير الجهد من ‎300 V‎ إلى ‎100 V‎ عبر مسافة ‎0.050 m‎ باتجاه المجال.\n• الإجابة النموذجية: ‎E = 200 ÷ 0.050 = 4.0 × 10³ V/m‎.", "إرشاد للطالب: مراجعة الموضوع 2-5 وحل مسائل طاقة الوضع\nإرشاد لولي الأمر: متابعة الابن في ربط الشغل بتغير طاقة الوضع\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9"], "h": ["<ol class=\"ol\"><li>يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎<\/li><li>يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب الشغل اللازم لتقريب شحنتين من بعضهما<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب الشغل اللازم لتقريب شحنتين من بعضهما<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>طاقة الوضع الكهربائية، ‎Eₚ = QV‎، ‎Eₚ = Q₁Q₂/(4πε₀r)‎، ميل الجهد، ‎E = −ΔV/Δr‎، الشغل المبذول.<\/p>", "<p>يسأل المعلم: «لتقريب شحنتين موجبتين من بعضهما نحتاج إلى دفعهما؛ أين تذهب الطاقة التي بذلناها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يستنتجون أنها تُخزن طاقة وضع (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم ‎Eₚ = QV‎ و‎Eₚ = Q₁Q₂/(4πε₀r)‎ وعلاقة المجال بميل الجهد، والطلبة يحسبون ‎Eₚ‎ لشحنتين ويرسمون ‎V‎ مقابل ‎r‎ (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم مسائل الشغل والطاقة ومثالًا لحساب ‎E‎ من ميل منحنى، والطلبة يحلون في مجموعات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب طاقة الوضع لشحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Eₚ = 8.99 × 10⁹ × 10⁻¹² ÷ 0.10 = 0.090 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الشغل اللازم لتقريبهما إلى ‎0.050 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Eₚ‎ الجديدة = ‎0.18 J‎؛ الشغل = ‎0.090 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يمثل ميل منحنى ‎V‎ مقابل ‎r‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: سالب شدة المجال الكهربائي ‎(E = −ΔV/Δr)‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب علاقة طاقة الوضع لشحنة في نقطة جهدها ‎V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Eₚ = QV‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل طاقة الوضع لشحنتين مختلفتين موجبة أم سالبة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: سالبة (تجاذب).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎E‎ إذا تغير الجهد من ‎300 V‎ إلى ‎100 V‎ عبر مسافة ‎0.050 m‎ باتجاه المجال.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = 200 ÷ 0.050 = 4.0 × 10³ V/m‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-5 وحل مسائل طاقة الوضع<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في ربط الشغل بتغير طاقة الوضع<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9<\/p>"]}, {"axis": "الاستقصاء العملي 2-1 ونشاط 2-5 ومراجعة الوحدة الثانية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 2-1 ونشاط 2-5 ومراجعة الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 + كتاب التجارب ص 51 و58"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية\n2. يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي", "1. تطبيق: ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية\n2. تطبيق: يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17\n3. تقييم (مخرج آخر): يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي", "- التعلم بالاكتشاف\n- التعلم الذاتي\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة، بيانات نموذجية، ورق رسم", "التحقق التجريبي، ‎V‎ مقابل ‎1/r‎، الخط المستقيم المار بالأصل، الميل، ملخص الوحدة.", "يسأل المعلم: «إذا كانت ‎V ∝ 1/r‎، فما التمثيل البياني الذي يعطينا خطًا مستقيمًا للتحقق من ذلك؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون رسم ‎V‎ مقابل ‎1/r‎ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستراتيجيتان: التعلم بالاكتشاف، الاستقصاء العملي: يوجه تنفيذ الاستقصاء العملي 2-1 (ص 58) أو تحليل بياناته النموذجية، والطلبة يرسمون ‎V‎ مقابل ‎1/r‎ ويحسبون الميل ويستنتجون ‎Q‎ (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. يوجه المعلم حل نشاط 2-5 (ص 51) والأسئلة 15–17، والطلبة يحلون في أزواج (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. يختم المعلم بمسابقة المجموعات لمراجعة الوحدة الثانية وقائمة التقويم الذاتي، والطلبة يتنافسون ثم يقيّمون أنفسهم (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. مستوى المعرفة: لماذا نرسم ‎V‎ مقابل ‎1/r‎؟\n• الإجابة النموذجية: لأن العلاقة ‎V = (Q/4πε₀) × 1/r‎ خطية، فيكون الرسم خطًا مستقيمًا مارًا بالأصل.\n\n2. مستوى التطبيق: ماذا يمثل ميل خط ‎V‎ مقابل ‎1/r‎؟\n• الإجابة النموذجية: ‎Q/(4πε₀)‎.\n\n3. مستوى الاستدلال: إذا كان الميل ‎9.0 V m‎، فما الشحنة؟\n• الإجابة النموذجية: ‎Q = 9.0 ÷ 8.99 × 10⁹ = 1.0 × 10⁻⁹ C‎.", "1. مستوى المعرفة: ما الدليل على صحة العلاقة ‎V ∝ 1/r‎ من الرسم؟\n• الإجابة النموذجية: أن يكون خطًا مستقيمًا مارًا بنقطة الأصل.\n\n2. مستوى التطبيق: اذكر مصدرًا للخطأ في الاستقصاء.\n• الإجابة النموذجية: تسرب الشحنة إلى الهواء الرطب، أو عدم دقة قياس البعد من المركز.\n\n3. مستوى الاستدلال: قيّم تعلمك في الوحدة الثانية وحدد موضوعًا للمراجعة مع خطة.\n• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية مثل حل أسئلة نهاية الوحدة المرتبطة به.", "إرشاد للطالب: كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-5 ص 51 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثانية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9"], "h": ["<ol class=\"ol\"><li>ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية<\/li><li>يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة، بيانات نموذجية، ورق رسم<\/span><\/div>", "<p>التحقق التجريبي، ‎V‎ مقابل ‎1/r‎، الخط المستقيم المار بالأصل، الميل، ملخص الوحدة.<\/p>", "<p>يسأل المعلم: «إذا كانت ‎V ∝ 1/r‎، فما التمثيل البياني الذي يعطينا خطًا مستقيمًا للتحقق من ذلك؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون رسم ‎V‎ مقابل ‎1/r‎ (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: التعلم بالاكتشاف، الاستقصاء العملي: يوجه تنفيذ الاستقصاء العملي 2-1 (ص 58) أو تحليل بياناته النموذجية، والطلبة يرسمون ‎V‎ مقابل ‎1/r‎ ويحسبون الميل ويستنتجون ‎Q‎ (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-5 (ص 51) والأسئلة 15–17، والطلبة يحلون في أزواج (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات لمراجعة الوحدة الثانية وقائمة التقويم الذاتي، والطلبة يتنافسون ثم يقيّمون أنفسهم (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا نرسم ‎V‎ مقابل ‎1/r‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن العلاقة ‎V = (Q/4πε₀) × 1/r‎ خطية، فيكون الرسم خطًا مستقيمًا مارًا بالأصل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يمثل ميل خط ‎V‎ مقابل ‎1/r‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q/(4πε₀)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا كان الميل ‎9.0 V m‎، فما الشحنة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 9.0 ÷ 8.99 × 10⁹ = 1.0 × 10⁻⁹ C‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الدليل على صحة العلاقة ‎V ∝ 1/r‎ من الرسم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن يكون خطًا مستقيمًا مارًا بنقطة الأصل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر مصدرًا للخطأ في الاستقصاء.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تسرب الشحنة إلى الهواء الرطب، أو عدم دقة قياس البعد من المركز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم تعلمك في الوحدة الثانية وحدد موضوعًا للمراجعة مع خطة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية مثل حل أسئلة نهاية الوحدة المرتبطة به.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-5 ص 51 وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثانية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9<\/p>"]}]}, {"title": "التيار الكهربائي", "sb": "الموضوع 3-1 (الأسئلة 1–11)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "التيار تدفق لحاملات شحنة مكممة والعلاقة ‎Q = It‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "التيار الكهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "التيار تدفق لحاملات شحنة مكممة والعلاقة ‎Q = It‎"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 3-1 (الأسئلة 1–11)"], ["دليل المعلم", "ص 75–80"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التيار الكهربائي والشحنة الكهربائية ص 70؛ نشاط 3-3: حاملات الشحنات الكهربائية ص 71"]], "t": ["1. يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة\n2. يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن\nمخرج تعليمي آخر: يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎", "1. تذكر: يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة\n2. تطبيق: يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن\n3. تطبيق (مخرج آخر): يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎", "- التعلم بالاكتشاف\n- التعل
