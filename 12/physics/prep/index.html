م التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: أميتر ودائرة بسيطة", "التيار الكهربائي، حاملات الشحنة، الشحنة المكممة، الشحنة الأولية ‎e‎، ‎Q = It‎، ‎Q = Ne‎، الأمبير، الكولوم.", "يعرض المعلم صورة دائرة كهربائية ويطلب رسم مخططها، ثم يسأل: «نقول \"يتدفق التيار\"؛ فما الذي يتدفق فعلًا في السلك؟» (فكرة التمهيد أ).", "1. يعرض المعلم الصورة ويطرح السؤال ومهام بداية الوحدة، والطلبة يرسمون المخطط ويقارنون رسومهم ويقترحون أن الشحنات هي ما يتدفق (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «مدخل إلى التيار الكهربائي كتدفق شحنة كهربائية»: حاملات الشحنة في الفلزات والمحاليل وتكميم الشحنة، والطلبة يكتبون التعريف ويحددون حاملات الشحنة في أوساط مختلفة (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. ينفذ المعلم «استخدام المعادلة ‎Q = It»‎ ومسائل ‎Q = Ne‎، والطلبة يحلون مسائل متدرجة في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم السؤال المفصلي (‎Q = It‎ و‎Q = Nq‎) ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: ما حاملات الشحنة في الفلزات؟\n• الإجابة النموذجية: الإلكترونات الحرة.\n\n2. مستوى التطبيق: احسب الشحنة المارة لتيار ‎0.50 A‎ مدة دقيقتين.\n• الإجابة النموذجية: ‎Q = 0.50 × 120 = 60 C‎.\n\n3. مستوى الاستدلال: كم إلكترونًا يمر في الحالة السابقة؟\n• الإجابة النموذجية: ‎N = 60 ÷ 1.6 × 10⁻¹⁹ = 3.75 × 10²⁰‎ إلكترون.", "1. مستوى المعرفة: لماذا يُعد قول «تدفق التيار» غير دقيق؟\n• الإجابة النموذجية: لأن التيار هو معدل تدفق الشحنة، فالشحنة هي التي تتدفق لا التيار.\n\n2. مستوى التطبيق: ما المقصود بأن الشحنة مكممة؟\n• الإجابة النموذجية: أنها توجد بمضاعفات صحيحة لشحنة الإلكترون ‎e‎.\n\n3. مستوى الاستدلال: احسب الزمن اللازم لمرور ‎1.0 × 10²⁰‎ إلكترون بتيار ‎0.40 A‎.\n• الإجابة النموذجية: ‎Q = 16 C‎؛ ‎t = 40 s‎.", "إرشاد للطالب: مراجعة الموضوع 3-1 وحل مسائل ‎Q = It‎\nإرشاد لولي الأمر: الحديث مع الابن عن الفرق بين التيار والشحنة بتشبيه تدفق الماء\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10"], "h": ["<ol class=\"ol\"><li>يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة<\/li><li>يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: أميتر ودائرة بسيطة<\/span><\/div>", "<p>التيار الكهربائي، حاملات الشحنة، الشحنة المكممة، الشحنة الأولية ‎e‎، ‎Q = It‎، ‎Q = Ne‎، الأمبير، الكولوم.<\/p>", "<p>يعرض المعلم صورة دائرة كهربائية ويطلب رسم مخططها، ثم يسأل: «نقول \"يتدفق التيار\"؛ فما الذي يتدفق فعلًا في السلك؟» (فكرة التمهيد أ).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال ومهام بداية الوحدة، والطلبة يرسمون المخطط ويقارنون رسومهم ويقترحون أن الشحنات هي ما يتدفق (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «مدخل إلى التيار الكهربائي كتدفق شحنة كهربائية»: حاملات الشحنة في الفلزات والمحاليل وتكميم الشحنة، والطلبة يكتبون التعريف ويحددون حاملات الشحنة في أوساط مختلفة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم «استخدام المعادلة ‎Q = It»‎ ومسائل ‎Q = Ne‎، والطلبة يحلون مسائل متدرجة في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي (‎Q = It‎ و‎Q = Nq‎) ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما حاملات الشحنة في الفلزات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الإلكترونات الحرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الشحنة المارة لتيار ‎0.50 A‎ مدة دقيقتين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 0.50 × 120 = 60 C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم إلكترونًا يمر في الحالة السابقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎N = 60 ÷ 1.6 × 10⁻¹⁹ = 3.75 × 10²⁰‎ إلكترون.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا يُعد قول «تدفق التيار» غير دقيق؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن التيار هو معدل تدفق الشحنة، فالشحنة هي التي تتدفق لا التيار.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما المقصود بأن الشحنة مكممة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أنها توجد بمضاعفات صحيحة لشحنة الإلكترون ‎e‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب الزمن اللازم لمرور ‎1.0 × 10²⁰‎ إلكترون بتيار ‎0.40 A‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 16 C‎؛ ‎t = 40 s‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-1 وحل مسائل ‎Q = It‎<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الفرق بين التيار والشحنة بتشبيه تدفق الماء<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10<\/p>"]}, {"axis": "العلاقة ‎I = nAvq‎ وسرعة الانجراف", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "التيار الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "العلاقة ‎I = nAvq‎ وسرعة الانجراف"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 3-1 + كتاب التجارب ص 70 و71"], ["دليل المعلم", "ص 75–80"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التيار الكهربائي والشحنة الكهربائية ص 70؛ نشاط 3-3: حاملات الشحنات الكهربائية ص 71"]], "t": ["1. يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي\n2. يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة\nمخرج تعليمي آخر: يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة", "1. تطبيق: يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي\n2. تحليل: يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة\n3. تطبيق (مخرج آخر): يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "كثافة حاملات الشحنة ‎n‎، مساحة المقطع ‎A‎، سرعة الانجراف ‎v‎، ‎I = nAvq‎، الموصلات وأشباه الموصلات.", "يسأل المعلم: «سرعة انجراف الإلكترونات في سلك أقل من ‎1 mm/s‎، فلماذا يضيء المصباح فور الضغط على المفتاح؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون أن الإلكترونات موجودة في كل السلك وتبدأ الحركة معًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ينفذ المعلم «استنتاج المعادلة ‎I = nAvq‎ واستخدامها»، والطلبة يستنتجون العلاقة بنموذج أسطوانة من السلك (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يوجه المعلم حل نشاط 3-2 (ص 70) ونشاط 3-3 (ص 71)، والطلبة يحلون ويقارنون الموصلات بأشباه الموصلات (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب سرعة الانجراف في سلك نحاس (‎n = 8.5 × 10²⁸ m⁻³‎، ‎A = 1.0 × 10⁻⁶ m²‎) يحمل ‎1.0 A‎.\n• الإجابة النموذجية: ‎v = 1.0 ÷ (8.5 × 10²⁸ × 1.0 × 10⁻⁶ × 1.6 × 10⁻¹⁹) = 7.4 × 10⁻⁵ m/s‎.\n\n2. مستوى التطبيق: لماذا يضيء المصباح فورًا رغم بطء الانجراف؟\n• الإجابة النموذجية: لأن المجال الكهربائي ينتشر في الدائرة بسرعة كبيرة فتبدأ الإلكترونات الموجودة في كل أجزاء السلك بالحركة معًا.\n\n3. مستوى الاستدلال: كيف تتغير سرعة الانجراف إذا نقصت مساحة المقطع إلى النصف مع ثبات التيار؟\n• الإجابة النموذجية: تتضاعف.", "1. مستوى المعرفة: ماذا يمثل ‎n‎ في المعادلة ‎I = nAvq‎؟\n• الإجابة النموذجية: عدد حاملات الشحنة لكل وحدة حجم.\n\n2. مستوى التطبيق: لماذا تكون سرعة الانجراف في أشباه الموصلات أكبر منها في الفلزات للتيار نفسه؟\n• الإجابة النموذجية: لأن ‎n‎ في أشباه الموصلات أصغر بكثير.\n\n3. مستوى الاستدلال: سلكان من المادة نفسها يحملان التيار نفسه، قطر الأول ضعف الثاني. قارن سرعتي الانجراف.\n• الإجابة النموذجية: مساحة الأول أربعة أضعاف، فسرعة الانجراف فيه ربع سرعتها في الثاني.", "إرشاد للطالب: إكمال نشاطي 3-2 و3-3 ص 70 و71\nإرشاد لولي الأمر: سؤال الابن عن سبب إضاءة المصباح فورًا رغم بطء الإلكترونات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10"], "h": ["<ol class=\"ol\"><li>يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي<\/li><li>يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>كثافة حاملات الشحنة ‎n‎، مساحة المقطع ‎A‎، سرعة الانجراف ‎v‎، ‎I = nAvq‎، الموصلات وأشباه الموصلات.<\/p>", "<p>يسأل المعلم: «سرعة انجراف الإلكترونات في سلك أقل من ‎1 mm/s‎، فلماذا يضيء المصباح فور الضغط على المفتاح؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون أن الإلكترونات موجودة في كل السلك وتبدأ الحركة معًا (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «استنتاج المعادلة ‎I = nAvq‎ واستخدامها»، والطلبة يستنتجون العلاقة بنموذج أسطوانة من السلك (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 3-2 (ص 70) ونشاط 3-3 (ص 71)، والطلبة يحلون ويقارنون الموصلات بأشباه الموصلات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب سرعة الانجراف في سلك نحاس (‎n = 8.5 × 10²⁸ m⁻³‎، ‎A = 1.0 × 10⁻⁶ m²‎) يحمل ‎1.0 A‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎v = 1.0 ÷ (8.5 × 10²⁸ × 1.0 × 10⁻⁶ × 1.6 × 10⁻¹⁹) = 7.4 × 10⁻⁵ m/s‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يضيء المصباح فورًا رغم بطء الانجراف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن المجال الكهربائي ينتشر في الدائرة بسرعة كبيرة فتبدأ الإلكترونات الموجودة في كل أجزاء السلك بالحركة معًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تتغير سرعة الانجراف إذا نقصت مساحة المقطع إلى النصف مع ثبات التيار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتضاعف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يمثل ‎n‎ في المعادلة ‎I = nAvq‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عدد حاملات الشحنة لكل وحدة حجم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تكون سرعة الانجراف في أشباه الموصلات أكبر منها في الفلزات للتيار نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎n‎ في أشباه الموصلات أصغر بكثير.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> سلكان من المادة نفسها يحملان التيار نفسه، قطر الأول ضعف الثاني. قارن سرعتي الانجراف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مساحة الأول أربعة أضعاف، فسرعة الانجراف فيه ربع سرعتها في الثاني.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 3-2 و3-3 ص 70 و71<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن سبب إضاءة المصباح فورًا رغم بطء الإلكترونات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10<\/p>"]}]}, {"title": "فرق الجهد الكهربائي", "sb": "الموضوع 3-2 (الأسئلة 1–11)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "تعريف فرق الجهد بأنه الطاقة المنقولة لكل وحدة شحنة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "فرق الجهد الكهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "تعريف فرق الجهد بأنه الطاقة المنقولة لكل وحدة شحنة"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-2 (الأسئلة 1–11)"], ["دليل المعلم", "ص 75–81"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية ص 67"]], "t": ["1. يعرّف فرق الجهد الكهربائي عبر أي مكون بأنه الطاقة المنقولة لكل وحدة شحنة ويستخدم المعادلة ‎V = W/Q‎\n2. يعرّف الفولت بدلالة الجول والكولوم\nمخرج تعليمي آخر: يحسب القدرة الكهربائية ‎P = VI‎ ويربطها بمعدل تحول الطاقة", "1. تطبيق: يعرّف فرق الجهد الكهربائي عبر أي مكون بأنه الطاقة المنقولة لكل وحدة شحنة ويستخدم المعادلة ‎V = W/Q‎\n2. تذكر: يعرّف الفولت بدلالة الجول والكولوم\n3. تطبيق (مخرج آخر): يحسب القدرة الكهربائية ‎P = VI‎ ويربطها بمعدل تحول الطاقة", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: فولتميتر ودائرة بسيطة", "فرق الجهد ‎V‎، الطاقة المنقولة ‎W‎، ‎V = W/Q‎، الفولت = ‎J/C‎، القدرة ‎P = VI‎.", "يسأل المعلم: «بطارية مكتوب عليها ‎9 V‎؛ ماذا يعني هذا الرقم من حيث الطاقة؟» ويستقبل التفسيرات.", "1. يطرح المعلم السؤال، والطلبة يقترحون علاقة بين الجهد والطاقة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف: ينفذ «تعريف فرق الجهد الكهربائي» ويشرح ‎V = W/Q‎ والفولت، والطلبة يكتبون التعريف ويحسبون أمثلة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل على ‎W = QV‎ و‎P = VI‎، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: عرّف فرق الجهد الكهربائي.\n• الإجابة النموذجية: الطاقة المنقولة (المحولة من كهربائية إلى صور أخرى) لكل وحدة شحنة تمر عبر المكون.\n\n2. مستوى التطبيق: احسب فرق الجهد إذا نقلت ‎3.0 C‎ طاقة مقدارها ‎12 J‎.\n• الإجابة النموذجية: ‎V = 4.0 V‎.\n\n3. مستوى الاستدلال: ماذا يعني فرق جهد ‎9 V‎ عبر مكون؟\n• الإجابة النموذجية: أن كل كولوم يمر عبره ينقل ‎9 J‎ من الطاقة.", "1. مستوى المعرفة: عرّف الفولت.\n• الإجابة النموذجية: فرق الجهد عندما تُنقل طاقة مقدارها جول واحد لكل كولوم من الشحنة.\n\n2. مستوى التطبيق: احسب الطاقة المحولة في مصباح فرق الجهد عبره ‎12 V‎ يمر فيه ‎2.0 A‎ مدة دقيقة.\n• الإجابة النموذجية: ‎Q = 120 C‎؛ ‎W = 1440 J‎.\n\n3. مستوى الاستدلال: احسب قدرة المصباح السابق.\n• الإجابة النموذجية: ‎P = VI = 24 W‎.", "إرشاد للطالب: مراجعة الموضوع 3-2 وحل مسائل ‎V = W/Q‎\nإرشاد لولي الأمر: سؤال الابن عن معنى الرقم المكتوب على البطاريات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=11"], "h": ["<ol class=\"ol\"><li>يعرّف فرق الجهد الكهربائي عبر أي مكون بأنه الطاقة المنقولة لكل وحدة شحنة ويستخدم المعادلة ‎V = W/Q‎<\/li><li>يعرّف الفولت بدلالة الجول والكولوم<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب القدرة الكهربائية ‎P = VI‎ ويربطها بمعدل تحول الطاقة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يعرّف فرق الجهد الكهربائي عبر أي مكون بأنه الطاقة المنقولة لكل وحدة شحنة ويستخدم المعادلة ‎V = W/Q‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يعرّف الفولت بدلالة الجول والكولوم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب القدرة الكهربائية ‎P = VI‎ ويربطها بمعدل تحول الطاقة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: فولتميتر ودائرة بسيطة<\/span><\/div>", "<p>فرق الجهد ‎V‎، الطاقة المنقولة ‎W‎، ‎V = W/Q‎، الفولت = ‎J/C‎، القدرة ‎P = VI‎.<\/p>", "<p>يسأل المعلم: «بطارية مكتوب عليها ‎9 V‎؛ ماذا يعني هذا الرقم من حيث الطاقة؟» ويستقبل التفسيرات.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون علاقة بين الجهد والطاقة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف: ينفذ «تعريف فرق الجهد الكهربائي» ويشرح ‎V = W/Q‎ والفولت، والطلبة يكتبون التعريف ويحسبون أمثلة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل على ‎W = QV‎ و‎P = VI‎، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف فرق الجهد الكهربائي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الطاقة المنقولة (المحولة من كهربائية إلى صور أخرى) لكل وحدة شحنة تمر عبر المكون.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب فرق الجهد إذا نقلت ‎3.0 C‎ طاقة مقدارها ‎12 J‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = 4.0 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يعني فرق جهد ‎9 V‎ عبر مكون؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن كل كولوم يمر عبره ينقل ‎9 J‎ من الطاقة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف الفولت.<br><span style=\"opacity:.85\">• الإجابة النموذجية: فرق الجهد عندما تُنقل طاقة مقدارها جول واحد لكل كولوم من الشحنة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الطاقة المحولة في مصباح فرق الجهد عبره ‎12 V‎ يمر فيه ‎2.0 A‎ مدة دقيقة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 120 C‎؛ ‎W = 1440 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب قدرة المصباح السابق.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎P = VI = 24 W‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-2 وحل مسائل ‎V = W/Q‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن معنى الرقم المكتوب على البطاريات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=11<\/p>"]}, {"axis": "الفرق بين فرق الجهد والقوة الدافعة الكهربائية ونشاط 3-1", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "فرق الجهد الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "الفرق بين فرق الجهد والقوة الدافعة الكهربائية ونشاط 3-1"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-2 + كتاب التجارب ص 67"], ["دليل المعلم", "ص 75–81"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية ص 67"]], "t": ["1. يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)\n2. يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»\nمخرج تعليمي آخر: يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة", "1. فهم: يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)\n2. تطبيق: يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»\n3. تقييم (مخرج آخر): يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "القوة الدافعة الكهربائية ‎e.m.f‎.، فرق الجهد، اتجاه تحول الطاقة، المصدر، المكون المستهلك، المقاومة ‎R = V/I‎.", "يعطي المعلم كل طالب ورقة ويتحداه أن يكتب في سطرين الفرق بين «فرق الجهد» و«القوة الدافعة الكهربائية» قبل الشرح.", "1. يجمع المعلم الإجابات المكتوبة سريعًا، والطلبة يكتبون الفرق المتوقع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الاستراتيجيتان: التعلم التعاوني، التعلم الذاتي: يشرح الفرق باتجاه تحول الطاقة ويصحح المفاهيم الخاطئة، والطلبة يعيدون صياغة إجاباتهم الأولى (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 3-1 (ص 67) والأسئلة المتبقية من 1–11، والطلبة يحلون في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يختم المعلم بمسابقة المجموعات على التيار وفرق الجهد، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: عرّف القوة الدافعة الكهربائية.\n• الإجابة النموذجية: الطاقة المحولة من صور أخرى إلى طاقة كهربائية لكل وحدة شحنة تمر عبر المصدر.\n\n2. مستوى التطبيق: في البطارية، أي الكميتين تصف عملها: فرق الجهد أم القوة الدافعة؟\n• الإجابة النموذجية: القوة الدافعة الكهربائية.\n\n3. مستوى الاستدلال: صحح: «فرق الجهد عبر البطارية هو دائمًا قوتها الدافعة».\n• الإجابة النموذجية: غير دقيق؛ فرق الجهد بين طرفي البطارية أقل من قوتها الدافعة عند مرور تيار بسبب مقاومتها الداخلية.", "1. مستوى المعرفة: ما الفرق في اتجاه تحول الطاقة بين ‎e.m.f‎. وفرق الجهد؟\n• الإجابة النموذجية: ‎e.m.f‎.: من صور أخرى إلى كهربائية؛ فرق الجهد: من كهربائية إلى صور أخرى.\n\n2. مستوى التطبيق: هل للقوة الدافعة الكهربائية وحدة القوة؟\n• الإجابة النموذجية: لا، وحدتها الفولت مثل فرق الجهد.\n\n3. مستوى الاستدلال: احسب المقاومة لمكون يمر فيه ‎0.25 A‎ وفرق الجهد عبره ‎6.0 V‎.\n• الإجابة النموذجية: ‎R = 24 Ω‎.", "إرشاد للطالب: إكمال نشاط 3-1 ص 67 والأسئلة المتبقية\nإرشاد لولي الأمر: متابعة الابن في التمييز بين المصطلحين بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=11"], "h": ["<ol class=\"ol\"><li>يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)<\/li><li>يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>القوة الدافعة الكهربائية ‎e.m.f‎.، فرق الجهد، اتجاه تحول الطاقة، المصدر، المكون المستهلك، المقاومة ‎R = V/I‎.<\/p>", "<p>يعطي المعلم كل طالب ورقة ويتحداه أن يكتب في سطرين الفرق بين «فرق الجهد» و«القوة الدافعة الكهربائية» قبل الشرح.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يجمع المعلم الإجابات المكتوبة سريعًا، والطلبة يكتبون الفرق المتوقع (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: التعلم التعاوني، التعلم الذاتي: يشرح الفرق باتجاه تحول الطاقة ويصحح المفاهيم الخاطئة، والطلبة يعيدون صياغة إجاباتهم الأولى (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 3-1 (ص 67) والأسئلة المتبقية من 1–11، والطلبة يحلون في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على التيار وفرق الجهد، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف القوة الدافعة الكهربائية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الطاقة المحولة من صور أخرى إلى طاقة كهربائية لكل وحدة شحنة تمر عبر المصدر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> في البطارية، أي الكميتين تصف عملها: فرق الجهد أم القوة الدافعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوة الدافعة الكهربائية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صحح: «فرق الجهد عبر البطارية هو دائمًا قوتها الدافعة».<br><span style=\"opacity:.85\">• الإجابة النموذجية: غير دقيق؛ فرق الجهد بين طرفي البطارية أقل من قوتها الدافعة عند مرور تيار بسبب مقاومتها الداخلية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق في اتجاه تحول الطاقة بين ‎e.m.f‎. وفرق الجهد؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎e.m.f‎.: من صور أخرى إلى كهربائية؛ فرق الجهد: من كهربائية إلى صور أخرى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل للقوة الدافعة الكهربائية وحدة القوة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا، وحدتها الفولت مثل فرق الجهد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب المقاومة لمكون يمر فيه ‎0.25 A‎ وفرق الجهد عبره ‎6.0 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎R = 24 Ω‎.<\/span><\/p><\/div>", "<p><b>إرشاد للط an class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: أسلاك من المادة نفسها بأطوال وأقطار مختلفة وأوميتر<\/span><\/div>", "<p>المقاومة ‎R‎، المقاومة النوعية ρ، الطول ‎L‎، مساحة المقطع ‎A‎، Ω ‎m‎، الموصلات والعوازل.<\/p>", "<p>يعرض المعلم سلكين من النحاس أحدهما قصير سميك والآخر طويل رفيع ويسأل: «أيهما أكبر مقاومة؟ وهل المقاومة النوعية لهما مختلفة؟» (فكرة التمهيد).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم السلكين ويطرح السؤال، والطلبة يتوقعون ويبررون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم ‎R = ρL/A‎ ووحدة ρ والفرق بين المفهومين مع قياس بالأوميتر، والطلبة يسجلون القياسات ويتحققون من العلاقة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب ‎R‎ وρ وتغيير الأبعاد، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب علاقة المقاومة بالمقاومة النوعية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎R = ρL/A‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما وحدة المقاومة النوعية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: Ω ‎m‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يحدث لمقاومة سلك إذا ضوعف طوله وقطره معًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الطول ×2 والمساحة ×4، فتصبح المقاومة نصف قيمتها.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل تعتمد المقاومة النوعية على أبعاد السلك؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا، تعتمد على نوع المادة (ودرجة الحرارة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب مقاومة سلك طوله ‎2.0 m‎ ومساحة مقطعه ‎2.0 × 10⁻⁷ m²‎ ومقاومته النوعية ‎4.9 × 10⁻⁷ Ω m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎R = 4.9 Ω‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب طول سلك نيكروم (‎ρ = 1.1 × 10⁻⁶ Ω m‎، ‎A = 1.0 × 10⁻⁷ m²‎) مقاومته 22 Ω.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎L = RA/ρ = 2.0 m‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-3 وحل مسائل ‎R = ρL/A‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين المقاومة والمقاومة النوعية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12<\/p>"]}, {"axis": "الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "المقاومة النوعية"], ["الحصة", "2 من 3"], ["محور الحصة", "الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-3 + كتا اق فكيه تمامًا، ويجب طرحها من القراءات.\n\n2. مستوى التطبيق: لماذا يُستخدم تيار صغير في الاستقصاء؟\n• الإجابة النموذجية: لتجنب تسخين السلك الذي يغير مقاومته.\n\n3. مستوى الاستدلال: اقترح تحسينين لدقة قيمة ρ.\n• الإجابة النموذجية: قياس القطر في مواضع أكثر، واستخدام مدى أطوال أكبر، وتقليل زمن مرور التيار.", "إرشاد للطالب: كتابة تقرير الاستقصاء 3-1 مع الرسم البياني وحساب ρ\nإرشاد لولي الأمر: التأكد من رسم الابن البياني ورسم خط أفضل مطابقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12"], "h": ["<ol class=\"ol\"><li>يقيس قطر السلك بالميكرومتر وطوله ومقاومته لأطوال مختلفة<\/li><li>يرسم ‎R‎ مقابل ‎L‎ ويحسب المقاومة النوعية من الميل<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب عدم اليقين في قيمة ρ ويقيّم مصادر الخطأ<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يقيس قطر السلك بالميكرومتر وطوله ومقاومته لأطوال مختلفة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يرسم ‎R‎ مقابل ‎L‎ ويحسب المقاومة النوعية من الميل<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يحسب عدم اليقين في قيمة ρ ويقيّم مصادر الخطأ<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: سلك مقاومة، ميكرومتر، مسطرة مترية، أميتر وفولتميتر أو أوميتر، مصدر جهد منخفض<\/span><\/div>", "<p>الميكرومتر، القياسات المتكررة، ‎R‎ مقابل ‎L‎، الميل = ρ/‎A‎، عدم اليقين، الخطأ الصفري.<\/p>", "<p>يعرض المعلم ميكرومترًا ويسأل: «لماذا لا تكفي المسطرة لقياس قطر سلك رفيع؟ وكم مرة يجب أن نقيس القطر؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\ :.85\">• الإجابة النموذجية: النحاس.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> سلك مقاومته 10 Ω قُطّع إلى خمسة أجزاء متساوية ووُصلت على التوازي. ما المقاومة المكافئة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كل جزء 2 Ω، والخمسة على التوازي = 0.40 Ω.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 3-4 و3-5 والأسئلة 12–15<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حل المسائل متعددة الخطوات بترتيب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12<\/p>"]}]}, {"title": "قانونا كيرشوف", "sb": "الموضوع 3-4 (الأسئلة 16–23)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "القانون الأول لكيرشوف وحفظ الشحنة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "1 من 5"], ["محور الحصة", "القانون الأول لكيرشوف وحفظ الشحنة"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية\n2. يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع\nمخرج تعليمي آخر: يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع", "1. فهم: يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية\n2. تطبيق: يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع\n3. تحليل (مخرج آخر): يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: دائرة بأميترات عند نقطة تفرع", "القانون الأول لكيرشوف، نقطة التفرع، حفظ الشحنة، مجموع التيارات الداخلة = مجموع الخارجة.", "يعرض المعلم دائرة فيها ثلاثة أميترات عند نقطة تفرع (قراءتان معلومتان) ويسأل: «كم تتوقع قراءة الأمي 1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر نص القانون الأول لكيرشوف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مجموع التيارات الداخلة إلى نقطة تفرع يساوي مجموع التيارات الخارجة منها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> على أي قانون حفظ يعتمد القانون الأول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حفظ الشحنة الكهربائية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> يدخل نقطة تفرع ‎3.0 A‎ و‎1.5 A‎، ويخرج منها ‎2.0 A‎ وتيار مجهول. احسبه.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎3.0 + 1.5 − 2.0 = 2.5 A‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا لا تتراكم الشحنة عند نقطة التفرع؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الشحنة لا تفنى ولا تُستحدث، فكل ما يدخل النقطة يخرج منها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> يتفرع تيار ‎0.60 A‎ إلى فرعين، أحدهما ‎0.25 A‎. ما التيار في الآخر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎0.35 A‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> في نقطة تفرع: داخل ‎2.0 A‎ و‎0.5 A‎، وخارج ‎1.2 A‎ و‎I₁‎ و‎I₂‎ حيث ‎I₁ = 2I₂‎. احسب ‎I₁‎ و‎I₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I₁ + I₂ = 1.3 ← I₂ = 0.43 A‎ و‎I₁ = 0.87 A‎.<\/span><\/p> بون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: اذكر نص القانون الثاني لكيرشوف.\n• الإجابة النموذجية: في أي مسار مغلق، مجموع القوى الدافعة الكهربائية يساوي مجموع فروق الجهد ‎(IR)‎.\n\n2. مستوى التطبيق: على أي قانون حفظ يعتمد القانون الثاني؟\n• الإجابة النموذجية: حفظ الطاقة.\n\n3. مستوى الاستدلال: بطارية ‎12 V‎ موصولة بمقاومتين على التوالي، فرق الجهد عبر الأولى ‎7.5 V‎. احسب فرق الجهد عبر الثانية.\n• الإجابة النموذجية: ‎12 − 7.5 = 4.5 V‎.", "1. مستوى المعرفة: ما مجموع التغيرات في الجهد حول مسار مغلق؟\n• الإجابة النموذجية: صفر.\n\n2. مستوى التطبيق: مسار مغلق فيه بطاريتان متعاكستان ‎9.0 V‎ و‎3.0 V‎ ومقاومة 2.0 Ω. احسب التيار.\n• الإجابة النموذجية: ‎I = (9.0 − 3.0) ÷ 2.0 = 3.0 A‎.\n\n3. مستوى الاستدلال: بطارية ‎6.0 V‎ ومقاومتان 4.0 Ω و2.0 Ω على التوالي. احسب فرق الجهد عبر كل منهما.\n• الإجابة النموذجية: ‎I = 1.0 A‎؛ ‎V₁ = 4.0 V‎ و‎V₂ = 2.0 V‎.", "إرشاد للطالب: حل مسائل القانون الثاني ومراجعة قاعدة الإشارات\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «المسار الدائري الذي يعود إلى نقطة البداية»\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة<\/li><li>يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في ><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> على أي قانون حفظ يعتمد القانون الثاني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حفظ الطاقة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> بطارية ‎12 V‎ موصولة بمقاومتين على التوالي، فرق الجهد عبر الأولى ‎7.5 V‎. احسب فرق الجهد عبر الثانية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎12 − 7.5 = 4.5 V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما مجموع التغيرات في الجهد حول مسار مغلق؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: صفر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> مسار مغلق فيه بطاريتان متعاكستان ‎9.0 V‎ و‎3.0 V‎ ومقاومة 2.0 Ω. احسب التيار.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I = (9.0 − 3.0) ÷ 2.0 = 3.0 A‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> بطارية ‎6.0 V‎ ومقاومتان 4.0 Ω و2.0 Ω على التوالي. احسب فرق الجهد عبر كل منهما.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I = 1.0 A‎؛ ‎V₁ = 4.0 V‎ و‎V₂ = 2.0 V‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل مسائل القانون الثاني ومراجعة قاعدة الإشارات<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه «المسار الدائري الذي يعود إلى نقطة البداية»<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "استنتاج المقاومة المكافئة للتوالي والتوازي من قانوني كيرشوف", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "3 من 5"], ["محور الحصة", "استنتاج المقاومة المكافئة للتوالي والتوازي من قانوني كيرشوف"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني\n2. يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول\nمخرج تعليمي آخر: يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات", "1. تحليل: يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني\n2. تحليل: يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول\n3. تطبيق (مخرج آخر): يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية", "المقاومة المكافئة، التوالي ‎R = R₁ + R₂‎، التوازي ‎1/R = 1/R₁ + 1/R₂‎، الشبكات المختلطة.", "يسأل المعلم: «درست قوانين التوالي والتوازي سابقًا؛ هل تستطيع إثباتها الآن باستخدام قانوني كيرشوف فقط؟»", "1. يطرح المعلم التحدي، والطلبة يقترحون البدء بالقانون الثاني للتوالي (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يوجه الطلبة لاستنتاج القانونين خطوة بخطوة، والطلبة يكتبون الاستنتاجين في الدفتر (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يقدم المعلم شبكات مختلطة لحساب المقاومة المكافئة، والطلبة يحسبون في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: استنتج معادلة التوالي من القانون الثاني.\n• الإجابة النموذجية: ‎E = IR₁ + IR₂ = I(R₁ + R₂) = IR ← R = R₁ + R₂‎.\n\n2. مستوى التطبيق: استنتج معادلة التوازي من القانون الأول.\n• الإجابة النموذجية: ‎I = I₁ + I₂ ← V/R = V/R₁ + V/R₂ ← 1/R = 1/R₁ + 1/R₂‎.\n\n3. مستوى الاستدلال: احسب المقاومة المكافئة لـ 6.0 Ω و3.0 Ω على التوازي.\n• الإجابة النموذجية: ‎R = 2.0 Ω‎.", "1. مستوى المعرفة: ما المقاومة المكافئة لـ 4.0 Ω و6.0 Ω على التوالي؟\n• الإجابة النموذجية: 10 Ω.\n\n2. مستوى التطبيق: احسب المقاومة المكافئة لـ 4.0 Ω موصولة على التوالي مع مجموعة 6.0 Ω و3.0 Ω على التوازي.\n• الإجابة النموذجية: ‎4.0 + 2.0 = 6.0 Ω‎.\n\n3. مستوى الاستدلال: لماذا تكون المقاومة المكافئة لمجموعة على التوازي أقل من أصغر مقاومة فيها؟\n• الإجابة النموذجية: لأن إضافة فروع توفر مسارات إضافية للتيار فيزداد التيار الكلي عند فرق الجهد نفسه.", "إرشاد للطالب: كتابة استنتاجي معادلتي التوالي والتوازي وحل ثلاث شبكات مختلطة\nإرشاد لولي الأمر: متابعة الابن في الاستنتاج الرياضي المنظم\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني<\/li><li>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><\/div>", "<p>المقاومة المكافئة، التوالي ‎R = R₁ + R₂‎، التوازي ‎1/R = 1/R₁ + 1/R₂‎، الشبكات المختلطة.<\/p>", "<p>يسأل المعلم: «درست قوانين التوالي والتوازي سابقًا؛ هل تستطيع إثباتها الآن باستخدام قانوني كيرشوف فقط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم التحدي، والطلبة يقترحون البدء بالقانون الثاني للتوالي (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه الطلبة لاستنتاج القانونين خطوة بخطوة، والطلبة يكتبون الاستنتاجين في الدفتر (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم شبكات مختلطة لحساب المقاومة المكافئة، والطلبة يحسبون في أزواج (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> استنتج معادلة التوالي من القانون الثاني.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = IR₁ + IR₂ = I(R₁ + R₂) = IR ← R = R₁ + R₂‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> استنتج معادلة التوازي من القانون الأول.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I = I₁ + I₂ ← V/R = V/R₁ + V/R₂ ← 1/R = 1/R₁ + 1/R₂‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب المقاومة المكافئة لـ 6.0 Ω و3.0 Ω على التوازي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎R = 2.0 Ω‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقاومة المكافئة لـ 4.0 Ω و6.0 Ω على التوالي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 10 Ω.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب المقاومة المكافئة لـ 4.0 Ω موصولة على التوالي مع مجموعة 6.0 Ω و3.0 Ω على التوازي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4.0 + 2.0 = 6.0 Ω‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تكون المقاومة المكافئة لمجموعة على التوازي أقل من أصغر مقاومة فيها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن إضافة فروع توفر مسارات إضافية للتيار فيزداد التيار الكلي عند فرق الجهد نفسه.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة استنتاجي معادلتي التوالي والتوازي وحل ثلاث شبكات مختلطة<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في الاستنتاج الرياضي المنظم<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "أحاجي قانوني كيرشوف ونشاط 3-6", "n": 4, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "4 من 5"], ["محور الحصة", "أحاجي قانوني كيرشوف ونشاط 3-6"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 + كتاب التجارب ص 80"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق\n2. يحل نشاط 3-6 «قانونا كيرشوف»\nمخرج تعليمي آخر: يصمم «أحجية» دائرة لزملائه مع حلها", "1. تطبيق: يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق\n2. تطبيق: يحل نشاط 3-6 «قانونا كيرشوف»\n3. إبداع (مخرج آخر): يصمم «أحجية» دائرة لزملائه مع حلها", "- التعلم المبني على اللعب\n- التعلم التعاوني\n- الأحاجي (الألغاز)", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: بطاقات أحاجي دوائر، كتاب التجارب العملية والأنشطة", "المعادلات الآنية، تحديد اتجاه التيارات، المسارات المغلقة المستقلة، التحقق من الحل.", "يوزع المعلم بطاقات «أحاجي قانوني كيرشوف»: دوائر فيها قيم مفقودة، ويعلن أن الفائز من يكمل أكبر عدد صحيح في عشر دقائق.", "1. يشرح المعلم قواعد نشاط الأحاجي، والطلبة يستعدون في مجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الاستراتيجيتان: الأحاجي (الألغاز)، التعلم المبني على اللعب: ينفذ «أحاجي (ألغاز) في قانوني كيرشوف»، والطلبة يحسبون القيم المفقودة باستخدام القانونين (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 3-6 (ص 80)، والطلبة يحلون فرديًا ثم يقارنون (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يكلف كل مجموعة بتصميم أحجية لمجموعة أخرى، والطلبة يصممون أحجية ويحلون أحجية زملائهم (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: كم معادلة مستقلة نحتاج لحل دائرة بتيارين مجهولين؟\n• الإجابة النموذجية: معادلتان مستقلتان.\n\n2. مستوى التطبيق: ماذا تعني الإشارة السالبة للتيار المحسوب؟\n• الإجابة النموذجية: أن الاتجاه الحقيقي للتيار عكس الاتجاه المفترض.\n\n3. مستوى الاستدلال: دائرة بمسارين: بطارية ‎12 V‎ مع 4.0 Ω، ثم فرعان 6.0 Ω و3.0 Ω على التوازي. احسب التيار في فرع 6.0 Ω.\n• الإجابة النموذجية: ‎I‎ الكلي = ‎2.0 A‎؛ فرق الجهد على الفرعين = ‎4.0 V‎؛ ‎I(6 Ω) = 0.67 A‎.", "1. مستوى المعرفة: ما الخطوة الأولى في حل دائرة بقانوني كيرشوف؟\n• الإجابة النموذجية: تحديد اتجاهات افتراضية للتيارات في كل فرع.\n\n2. مستوى التطبيق: في الدائرة السابقة احسب التيار في فرع 3.0 Ω.\n• الإجابة النموذجية: ‎4.0 ÷ 3.0 = 1.3 A‎.\n\n3. مستوى الاستدلال: كيف تتحقق من صحة حلك؟\n• الإجابة النموذجية: بتطبيق القانون الأول عند نقطة التفرع ‎(0.67 + 1.33 = 2.0 A)‎ والقانون الثاني على مسار آخر.", "إرشاد للطالب: إكمال نشاط 3-6 ص 80 وحل أحجية زميلك\nإرشاد لولي الأمر: تشجيع الابن على التحقق من الحلول بالقانونين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق<\/li><li>يحل نشاط 3-6 «قانونا كيرشوف»<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم «أحجية» دائرة لزملائه مع حلها<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 3-6 «قانونا كيرشوف»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم «أحجية» دائرة لزملائه مع حلها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الأحاجي (الألغاز)<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: بطاقات أحاجي دوائر، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>المعادلات الآنية، تحديد اتجاه التيارات، المسارات المغلقة المستقلة، التحقق من الحل.<\/p>", "<p>يوزع المعلم بطاقات «أحاجي قانوني كيرشوف»: دوائر فيها قيم مفقودة، ويعلن أن الفائز من يكمل أكبر عدد صحيح في عشر دقائق.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يشرح المعلم قواعد نشاط الأحاجي، والطلبة يستعدون في مجموعات (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: الأحاجي (الألغاز)، التعلم المبني على اللعب: ينفذ «أحاجي (ألغاز) في قانوني كيرشوف»، والطلبة يحسبون القيم ا 0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> في الدائرة السابقة احسب التيار في فرع 3.0 Ω.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4.0 ÷ 3.0 = 1.3 A‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تتحقق من صحة حلك؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بتطبيق القانون الأول عند نقطة التفرع ‎(0.67 + 1.33 = 2.0 A)‎ والقانون الثاني على مسار آخر.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-6 ص 80 وحل أحجية زميلك<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التحقق من الحلول بالقانونين<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "تطوير عملي للقانون الثاني ونشاط 3-7 والأسئلة 16–23", "n": 5, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "5 من 5"], ["محور الحصة", "تطوير عملي للقانون الثاني ونشاط 3-7 والأسئلة 16–23"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 + كتاب التجارب ص 84"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق\n2. يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23\nمخرج تعليمي آخر: يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة", "1. تطبيق: يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق\n2. تطبيق: يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23\n3. تقييم (مخرج آخر): يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- أخرى: بطارية، مقاومات، فولتميتر رقمي، أسلاك", "التحقق التجريبي، مقاومة الأسلاك، المقاومة الداخلية، دقة الفولتميتر، المسار المغلق.", "يسأل المعلم: «إذا جمعنا قراءات الفولتميتر عبر كل المقاومات في مسار، هل ستساوي قراءة البطارية تمامًا؟ لماذا قد تختلف؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون فروقًا صغيرة ويقترحون أسبابًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «تطوير عملي للقانون الثاني لكيرشوف» بقياس فروق الجهد، والطلبة يقيسون ويسجلون ويجمعون القراءات (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 3-7 (ص 84) والأسئلة 16–23، والطلبة يحلون في أزواج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم السؤال المفصلي (شبكة مقاومات) ثم يختم بمسابقة المجموعات، والطلبة يجيبون ويتنافسون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: لماذا قد يقل مجموع فروق الجهد المقيسة قليلًا عن القوة الدافعة؟\n• الإجابة النموذجية: بسبب الجهد المفقود في المقاومة الداخلية للبطارية وفي الأسلاك.\n\n2. مستوى التطبيق: كيف يُوصل الفولتميتر لقياس فرق الجهد عبر مقاومة؟\n• الإجابة النموذجية: على التوازي معها.\n\n3. مستوى الاستدلال: قيست فروق الجهد ‎3.1 V‎ و‎2.8 V‎ في مسار بطاريته ‎6.0 V‎. ما الجهد المفقود؟\n• الإجابة النموذجية: ‎6.0 − 5.9 = 0.1 V‎.", "1. مستوى المعرفة: ما الذي تتحقق منه هذه التجربة؟\n• الإجابة النموذجية: القانون الثاني لكيرشوف (حفظ الطاقة).\n\n2. مستوى التطبيق: لماذا يفضل الفولتميتر الرقمي عالي المقاومة؟\n• الإجابة النموذجية: كي لا يسحب تيارًا يذكر فلا يغير الدائرة.\n\n3. مستوى الاستدلال: اقترح تعديلًا يقلل الفرق بين المجموع والقوة الدافعة.\n• الإجابة النموذجية: استخدام أسلاك قصيرة سميكة ومصدر مقاومته الداخلية صغيرة، أو قياس فرق الجهد بين طرفي البطارية أثناء مرور التيار بدل قوتها الدافعة.", "إرشاد للطالب: كتابة تقرير التحقق العملي وإكمال نشاط 3-7 ص 84 والأسئلة 16–23\nإرشاد لولي الأمر: الاطلاع مع الابن على تقريره ومناقشة أسباب الفروق\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق<\/li><li>يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر الفروق
