lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">العصف الذهني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>مجال القوة، مجال الجاذبية، خطوط المجال، المجال الشعاعي، المجال المنتظم، شدة مجال الجاذبية، الكتلة النقطية.<\/p>", "<p>يسقط المعلم كوبًا بلاستيكيًا ثم يعرض صورة الثقب الأسود المرصود عام 2019م ويسأل: «ما العامل المشترك بين هاتين الملاحظتين؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — العصف الذهني:<\/b> ينفذ فكرة التمهيد (أ) ويدير النقاش حول دور الجاذبية<br><span style=\"opacity:.85\">• الطالب: يحددون دور الجاذبية في الحالتين ويجيبون عن مهام بداية الوحدة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — التعلم بالاكتشاف:<\/b> ينفذ «المجالات الشعاعية والمنتظمة»: يذكّر بخطوط المجال المغناطيسي ثم يرسم خطوط مجال الأرض قريبًا وبعيدًا (الشكلان 1-1 و1-2)<br><span style=\"opacity:.85\">• الطالب: يرسمون خطوط المجالين ويستنتجون أن تقارب الخطوط يدل على شدة المجال<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يقدم مواقف (سطح الأرض، قمر صناعي، الفضاء البعيد) لتحديد نوع المجال<br><span style=\"opacity:.85\">• الطالب: يصنفون المجال في كل موقف ويبررون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/t F = Gm₁m₂/r²‎\n2. يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها\nمخرج تعليمي آخر: يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة ‎Gravity Lab‎", "قانون نيوتن للجاذبية، ثابت الجذب العام ‎G‎، قانون التربيع العكسي، الكتلة النقطية، تجربة كافنديش.", "يسأل المعلم: «تجذبك الأرض بقوة نحو ‎600 N‎، فلماذا لا تشعر بجذب زميلك الجالس بجوارك؟»", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يقترحون أثر صغر الكتلة\n\n2. 12 دقيقة — التعلم بالاكتشاف: يشرح قانون نيوتن والتربيع العكسي ويحل مثالًا لقوة بين كتلتين\n• الطالب: يحسبون القوة بين كتلتين صغيرتين ويقارنونها بوزنهما\n\n3. 15 دقيقة — التعلم بالنمذجة: يعرض «تجربة كافنديش» بمقطع مختار ونموذج مبسط، ثم يوجه حل السؤالين 1 و2 ونشاط 1-1 (ص 24)\n• الطالب: يصفون مبدأ التجربة ويحلون الأسئلة في أزواج\n\n4. 8 دقائق: يختم بمسابقة المجموعات\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: اكتب معادلة قانون نيوتن للجاذبية.\n   الإجابة النموذجية: ‎F = Gm₁m₂ / r²‎\n2) (مستوى التطبيق) السؤال: احسب قوة التجاذب بين كتلتين كل منهما ‎1.0 kg‎ بينهما ‎1.0 m‎.\n   الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ N‎.\n3) (مستوى الاستدلال) السؤال: ماذا يحدث للقوة إذا تضاعفت المسافة بين الكتلتين؟\n   الإجابة النموذجية: تقل إلى الربع.", "1) (مستوى المعرفة) السؤال: ما قيمة ‎G‎ ووحدتها؟\n   الإجابة النموذجية: ‎6.67 × 10⁻¹¹ N m² kg⁻²‎.\n2) (مستوى التطبيق) السؤال: من أين تُقاس ‎r‎ عند حساب قوة الجذب بين الأرض والقمر؟\n   الإجابة النموذجية: بين مركزيهما.\n3) (مستوى الاستدلال) السؤال: احسب قوة الجذب بين الأرض ‎(6.0 × 10²⁴ kg)‎ وقمر صناعي كتلته ‎1000 kg‎ على بعد ‎7.0 × 10⁶ m‎ من مركزها.\n   الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 1000 ÷ (7.0 × 10⁶)² = 8.2 × 10³ N‎.", "إرشاد للطالب: حل السؤالين 1 و2 ونشاط 1-1 ص 24\nإرشاد لولي الأمر: مناقشة الابن في سبب عدم شعورنا بجذب الأجسام الصغيرة لبعضها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=1"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎<\/li><li>يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎<\/td><td class=\"lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم بالنمذجة<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: محاكاة ‎Gravity Lab‎<\/span><\/div>", "<p>قانون نيوتن للجاذبية، ثابت الجذب العام ‎G‎، قانون التربيع العكسي، الكتلة النقطية، تجربة كافنديش.<\/p>", "<p>يسأل المعلم: «تجذبك الأرض بقوة نحو ‎600 N‎، فلماذا لا تشعر بجذب زميلك الجالس بجوارك؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون أثر صغر الكتلة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 12 دقيقة — التعلم بالاكتشاف:<\/b> يشرح قانون نيوتن والتربيع العكسي ويحل مثالًا لقوة بين كتلتين<br><span style=\"opacity:.85\">• الطالب: يحسبون القوة بين كتلتين صغيرتين ويقارنونها بوزنهما<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 15 دقيقة — التعلم بالنمذجة:<\/b> يعرض «تجربة كافنديش» بمقطع مختار ونموذج مبسط، ثم يوجه حل السؤالين 1 و2 ونشاط 1-1 (ص 24)<br><span style=\"opacity:.85\">• الطالب: يصفون مبدأ التجربة ويحلون الأسئلة في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب معادلة قانون نيوتن للجاذبية.<\/td><td>‎F = Gm₁m₂ / r²‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب قوة التجاذب بين كتلتين كل منهما ‎1.0 kg‎ بينهما ‎1.0 m‎.<\/td><td>‎F = 6.67 × 10⁻¹¹ N‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ماذا يحدث للقوة إذا تضاعفت المسافة بين الكتلتين؟<\/td><td>تقل إلى الربع.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما قيمة ‎G‎ ووحدتها؟<\/td><td>‎6.67 × 10⁻¹¹ N m² kg⁻²‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>من أين تُقاس ‎r‎ عند حساب قوة الجذب بين الأرض والقمر؟<\/td><td>بين مركزيهما.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب قوة الجذب بين الأرض ‎(6.0 × 10²⁴ kg)‎ وقمر صناعي كتلته ‎1000 kg‎ على بعد ‎7.0 × 10⁶ m‎ من مركزها.<\/td><td>‎F = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 1000 ÷ (7.0 × 10⁶)² = 8.2 × 10³ N‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل السؤالين 1 و2 ونشاط 1-1 ص 24<\/p><p><b>إرشاد لولي الأمر:<\/b> مناقشة الابن في سبب عدم شعورنا بجذب الأجسام الصغيرة لبعضها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=1<\/p>"]}]}, {"title": "شدة مجال الجاذبية ‎g‎", "sb": "الموضوع 1-2 (الأسئلة 3–8)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "استنتاج معادلة شدة مجال الجاذبية ‎g = GM/r²‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "1 من 3"], ["محور الحصة", "استنتاج معادلة شدة مجال الجاذبية ‎g = GM/r²‎"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 (الأسئلة 3–8)"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية\n2. يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع\nمخرج تعليمي آخر: يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "شدة مجال الجاذبية ‎g‎، ‎g = F/m‎، ‎g = GM/r²‎، ‎N/kg‎، ‎m/s²‎، قانون التربيع العكسي.", "يطلب المعلم حساب زمن سقوط جسم من ارتفاع ‎1.0 m‎ عند سطح الأرض ‎(g = 9.81)‎ ثم أعلى قمة إيفرست ‎(g = 9.77)‎، ويسأل: «هل ‎g‎ ثابتة فعلًا؟»", "1. 5 دقائق — التعلم بالاكتشاف: ينفذ فكرة التمهيد ويناقش تغير ‎g‎\n• الطالب: يحسبون الزمن في الحالتين ويقارنون\n\n2. 15 دقيقة — التعلم بالاكتشاف: ينفذ «تعريف شدة مجال الجاذبية واستنتاجها»: من ‎F = GMm/r²‎ إلى ‎g = GM/r²‎ واستنتاج الوحدة\n• الطالب: يستنتجون المعادلة في دفاترهم ويعرض طالب الاستنتاج للصف\n\n3. 12 دقيقة — التعلم التعاوني: يقدم أسئلة على العلاقة بين ‎g‎ و‎r (‎التربيع العكسي)\n• الطالب: يحسبون ‎g‎ عند مسافات مختلفة بالنسبة لـ ‎g‎ عند السطح\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: استنتج معادلة ‎g‎ لكتلة نقطية.\n   الإجابة النموذجية: ‎g = F/m = (GMm/r²)/m = GM/r²‎\n2) (مستوى التطبيق) السؤال: لماذا وحدة ‎N/kg‎ مكافئة لـ ‎m/s²‎؟\n   الإجابة النموذجية: لأن ‎N = kg m/s²‎، فـ ‎N/kg = m/s²‎.\n3) (مستوى الاستدلال) السؤال: كم تصبح ‎g‎ على ارتفاع يساوي نصف قطر الأرض فوق سطحها؟\n   الإجابة النموذجية: ‎r = 2R‎، فتصبح ‎g‎ ربع قيمتها عند السطح ≈ ‎2.45 N/kg‎.", "1) (مستوى المعرفة) السؤال: هل تعتمد ‎g‎ على كتلة الجسم الذي يسقط؟\n   الإجابة النموذجية: لا؛ تعتمد على كتلة الكوكب والبعد عن مركزه فقط.\n2) (مستوى التطبيق) السؤال: ما العلاقة بين ‎g‎ والبعد ‎r‎ عن المركز؟\n   الإجابة النموذجية: ‎g‎ تتناسب عكسيًا مع ‎r²‎.\n3) (مستوى الاستدلال) السؤال: على أي بعد من مركز الأرض تصبح ‎g‎ تسع قيمتها عند السطح؟\n   الإجابة النموذجية: على بعد ‎3R‎ من المركز.", "إرشاد للطالب: مراجعة الموضوع 1-2 وكتابة استنتاج ‎g = GM/r²‎\nإرشاد لولي الأمر: تشجيع الابن على شرح سبب تغير وزنه لو صعد إلى قمة جبل عالٍ\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2"], "h": ["<ol class=\"ol\"><li>يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية<\/li><li>يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي<\/td><td class=\"lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>شدة مجال الجاذبية ‎g‎، ‎g = F/m‎، ‎g = GM/r²‎، ‎N/kg‎، ‎m/s²‎، قانون التربيع العكسي.<\/p>", "<p>يطلب مد ‎g‎ على كتلة الجسم الذي يسقط؟<\/td><td>لا؛ تعتمد على كتلة الكوكب والبعد عن مركزه فقط.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما العلاقة بين ‎g‎ والبعد ‎r‎ عن المركز؟<\/td><td>‎g‎ تتناسب عكسيًا مع ‎r²‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>على أي بعد من مركز الأرض تصبح ‎g‎ تسع قيمتها عند السطح؟<\/td><td>على بعد ‎3R‎ من المركز.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-2 وكتابة استنتاج ‎g = GM/r²‎<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على شرح سبب تغير وزنه لو صعد إلى قمة جبل عالٍ<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2<\/p>"]}, {"axis": "حساب شدة مجال الجاذبية لكواكب وأقمار", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "2 من 3"], ["محور الحصة", "حساب شدة مجال الجاذبية لكواكب وأقمار"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 (الأسئلة 3–8)"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة\n2. يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة\nمخرج تعليمي آخر: يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎g‎ عند سطح الكوكب، كتلة الكوكب، نصف القطر، تسارع السقوط الحر، المثال 1 في كتاب الطالب.", "يعرض المعلم صورة رائد فضاء يقفز على سطح القمر ويسأل: «لماذا يقفز أعلى بستة أضعاف تقريبًا؟ وكيف نحسب ‎g‎ على القمر؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يعرض الصورة ويطرح السؤال\n• الطالب: يقترحون حساب ‎g‎ من كتلة القمر ونصف قطره\n\n2. 15 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: ينفذ «استخدام معادلة شدة مجال الجاذبية» ويحل المثال 1\n• الطالب: يتبعون الحل ويحسبون ‎g‎ للأرض والقمر\n\n3. 12 دقيقة — التعلم المبني على حل المشكلات: يوجه حل الأسئلة 3–8 فرديًا ثم يناقش الحلول\n• الطالب: يحلون ويصححون باستخدام الحلول النموذجية\n\n4. 8 دقائق: يدير السؤال المفصلي (عطارد) ثم التقويم الختامي\n• الطالب: يجيبون عن السؤال المفصلي ويحلون أسئلة التقويم", "1) (مستوى المعرفة) السؤال: احسب ‎g‎ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).\n   الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ (6.4 × 10⁶)² = 9.8 N/kg‎.\n2) (مستوى التطبيق) السؤال: احسب ‎g‎ على سطح عطارد (‎M = 3.30 × 10²³ kg‎، ‎R = 2.44 × 10⁶ m‎).\n   الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 3.30 × 10²³ ÷ (2.44 × 10⁶)² = 3.7 N/kg‎.\n3) (مستوى الاستدلال) السؤال: متى تتساوى شدة مجال الجاذبية وتسارع السقوط الحر عدديًا؟\n   الإجابة النموذجية: عندما تكون الجاذبية القوة الوحيدة المؤثرة على الجسم (بإهمال مقاومة الهواء).", "1) (مستوى المعرفة) السؤال: اكتب علاقة كتلة كوكب بدلالة ‎g‎ و‎R‎.\n   الإجابة النموذجية: ‎M = gR²/G‎\n2) (مستوى التطبيق) السؤال: احسب كتلة كوكب نصف قطره ‎3.4 × 10⁶ m‎ و‎g‎ على سطحه ‎3.7 N/kg‎.\n   الإجابة النموذجية: ‎M = 3.7 × (3.4 × 10⁶)² ÷ 6.67 × 10⁻¹¹ = 6.4 × 10²³ kg‎.\n3) (مستوى الاستدلال) السؤال: كوكب كتلته ضعف كتلة الأرض ونصف قطره ضعف نصف قطرها. قارن ‎g‎ على سطحه بـ ‎g‎ الأرض.\n   الإجابة النموذجية: ‎g = G(2M)/(2R)² = ½ g‎ الأرض.", "إرشاد للطالب: حل الأسئلة 3–8 في كتاب الطالب\nإرشاد لولي الأمر: متابعة الابن في التعامل مع الأعداد الكبيرة بالصيغة العلمية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة<\/li><li>يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>‎g‎ عند سطح الكوكب، كتلة الكوكب، نصف القطر، تسارع السقوط الحر، المثال 1 في كتاب الطالب.<\/p>", "<p>يعرض المعلم صورة رائد فضاء يقفز على سطح القمر ويسأل: «لماذا يقفز أعلى بستة أضعاف تقريبًا؟ وكيف نحسب ‎g‎ على القمر؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يعرض الصورة ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون حساب ‎g‎ من كتلة القمر ونصف قطره<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني:<\/b> ينفذ «استخدام معادلة شدة مجال الجاذبية» ويحل المثال 1<br><span style=\"opacity:.85\">• الطالب: يتبعون الحل ويحسبون ‎g‎ للأرض والقمر<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم المبني على حل المشكلات:<\/b> يوجه حل الأسئلة 3–8 فرديًا ثم يناقش الحلول<br><span style=\"opacity:.85\">• الطالب: يحلون ويصححون باستخدام الحلول النموذجية<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير السؤال المفصلي (عطارد) ثم التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون عن السؤال المفصلي ويحلون أسئلة الت تاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يحل نشاط 1-2 «شدة مجال الجاذبية»\n2. يحلل تمثيلًا بيانيًا لتغير ‎g‎ مع البعد ‎r‎ عن مركز كوكب\nمخرج تعليمي آخر: يقيّم استخدام ‎g = 9.81 N/kg‎ في حسابات الأقمار الصناعية", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "منحنى ‎g‎ مقابل ‎r‎، التربيع العكسي، داخل الكوكب وخارجه، حدود صلاحية القيم.", "يعرض المعلم تمثيلًا بيانيًا لـ ‎g‎ مقابل ‎r‎ ويسأل: «لماذا لا يكون المنحنى خطًا مستقيمًا؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يعرض التمثيل ويطرح السؤال\n• الطالب: يربطون الشكل بالتربيع العكسي\n\n2. 15 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يوجه حل «أسئلة كتاب التجارب العملية والأنشطة» نشاط 1-2 (ص 28)\n• الطالب: يحلون فرديًا ثم يقارنون\n\n3. 12 دقيقة — التعلم المبني على حل المشكلات: يقدم مسألة: هل يصح استخدام 9.81 لقمر على ارتفاع ‎400 km‎؟\n• الطالب: يحسبون ‎g‎ هناك ويقيّمون الخطأ\n\n4. 8 دقائق: يختم بمسابقة المجموعات على شدة المجال\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: كيف تتغير ‎g‎ إذا زاد ‎r‎ ثلاث مرات؟\n   الإجابة النموذجية: تقل إلى التسع.\n2) (مستوى التطبيق) السؤال: احسب ‎g‎ على ارتفاع ‎400 km‎ فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎.\n   الإجابة النموذجية: ‎r = 6.8 × 10⁶‎؛ ‎g = 9.8 × (6.4/6.8)² = 8.7 N/kg‎.\n3) (مستوى الاستدلال) السؤال: ما الخطأ النسبي إذا استخدمنا 9.8 بدل 8.7؟\n   الإجابة النموذجية: نحو 13%، وهو خطأ كبير لا يُهمل.", "1) (مستوى المعرفة) السؤال: ما شكل منحنى ‎g‎ مقابل ‎r‎ خارج الكوكب؟\n   الإجابة النموذجية: منحنى يتناقص بسرعة ثم ببطء (علاقة تربيع عكسي).\n2) (مستوى التطبيق) السؤال: لماذا لا يصح استخدام ‎9.81 N/kg‎ لقمر صناعي على ارتفاع كبير؟\n   الإجابة النموذجية: لأن ‎g‎ تتناقص بزيادة البعد عن مركز الأرض.\n3) (مستوى الاستدلال) السؤال: عند أي ارتفاع فوق سطح الأرض تصبح ‎g‎ ربع قيمتها عند السطح؟\n   الإجابة النموذجية: على ارتفاع يساوي نصف قطر الأرض ‎(6.4 × 10⁶ m)‎.", "إرشاد للطالب: إكمال نشاط 1-2 ص 28\nإرشاد لولي الأمر: متابعة الابن في رسم منحنى ‎g‎ مقابل ‎r‎ بعناية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2"], "h": ["<ol class=\"ol\"><li>يحل نشاط 1-2 «شدة مجال الجاذبية»<\/li><li>يحلل تمثيلًا بيانيًا لتغير ‎g‎ مع البعد ‎r‎ عن مركز كوكب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم استخدام ‎g = 9.81 N/kg‎ في حسابات الأقمار الصناعية<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 1-2 «شدة مجال الجاذبية»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحلل تمثيلًا بيانيًا لتغير ‎g‎ مع البعد ‎r‎ عن مركز كوكب<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقيّم استخدام ‎g = 9.81 N/kg‎ في حسابات الأقمار الصناعية<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>منحنى ‎g‎ مقابل ‎r‎، التربيع العكسي، داخل الكوكب وخارجه، حدود صلاحية القيم.<\/p>", "<p>يعرض المعلم تمثيلًا بيانيًا لـ ‎g‎ مقابل ‎r‎ ويسأل: «لماذا لا يكون المنحنى خطًا مستقيمًا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يعرض التمثيل ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يربطون الشكل بالتربيع العكسي<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني:<\/b> فاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2<\/p>"]}]}, {"title": "الطاقة وجهد الجاذبية", "sb": "الموضوع 1-3 (السؤالان 9، 10)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "جهد الجاذبية وتعريفه", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "1 من 3"], ["محور الحصة", "جهد الجاذبية وتعريفه"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 (السؤالان 9، 10)"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية\nمخرج تعليمي آخر: يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية", "جهد الجاذبية φ، اللانهاية، الشغل لوحدة الكتل، ‎J/kg‎، φ = ‎−GM/r‎، بئر الجهد.", "يعرض المعلم صورة «بئر الجاذبية» (سطح منحنٍ تتدحرج عليه كرات) ويسأل: «لماذا نصف الأرض بأنها في بئر جهد؟ وما المرجع الذي نقيس منه؟»", "1. 5 دقائق — التعلم بالاكتشاف: ينفذ فكرة التمهيد ويطرح السؤال\n• الطالب: يقترحون مرجعًا للجهد الصفري\n\n2. 15 دقيقة — التعلم بالاكتشاف: يشرح «الطاقة في مجال الجاذبية»: تعريف φ واللانهاية مرجعًا وسبب السالبية والمعادلة\n• الطالب: يكتبون التعريف ويحسبون φ عند سطح الأرض\n\n3. 12 دقيقة — التعلم التعاوني: يقدم مسائل حساب φ على أبعاد مختلفة\n• الطالب: يحسبون في أزواج ويرسمون φ مقابل ‎r‎\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: لماذا جهد الجاذبية سالب؟\n   الإجابة النموذجية: لأن الجهد صفر في اللانهاية والجاذبية قوة تجاذب، فيلزم بذل شغل لإخراج الكتلة إلى اللانهاية، أي إن طاقتها أقل من الصفر.\n2) (مستوى التطبيق) السؤال: احسب φ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).\n   الإجابة النموذجية: φ = ‎−6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ 6.4 × 10⁶ = −6.3 × 10⁷ J/kg‎.\n3) (مستوى الاستدلال) السؤال: كيف يتغير φ إذا تضاعف البعد عن المركز؟\n   الإجابة النموذجية: يصبح نصف قيمته (أقل سالبية).", "1) (مستوى المعرفة) السؤال: ما وحدة جهد الجاذبية؟\n   الإجابة النموذجية: ‎J/kg‎.\n2) (مستوى التطبيق) السؤال: أين يكون جهد الجاذبية صفرًا؟\n   الإجابة النموذجية: في اللانهاية.\n3) (مستوى الاستدلال) السؤال: احسب φ على بعد ‎1.28 × 10⁷ m‎ من مركز الأرض.\n   الإجابة النموذجية: φ = ‎−3.1 × 10⁷ J/kg (‎نصف قيمته عند السطح).", "إرشاد للطالب: مراجعة الموضوع 1-3 وكتابة تعريف جهد الجاذبية\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «بئر الجاذبية» ومعناه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3"], "h": ["<ol class=\"ol\"><li>يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/li><li>يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية<\/td><td class=\"lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>جهد الجاذبية φ، اللانهاية، الشغل لوحدة الكتل، ‎J/kg‎، φ = ‎−GM/r‎، بئر الجهد.<\/p>", "<p>يعرض المعلم صورة «بئر الجاذبية» (سطح منحنٍ تتدحرج عليه كرات) ويسأل: «لماذا نصف الأرض بأنها في بئر جهد؟ وما المرجع الذي نقيس منه؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> ينفذ فكرة التمهيد ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون مرجعًا للجهد الصفري<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — التعلم بالاكتشاف:<\/b> يشرح «الطاقة في مجال الجاذبية»: تعريف φ واللانهاية مرجعًا وسبب السالبية والمعادلة<br><span style=\"opacity:.85\">• الطالب: يكتبون التعريف ويحسبون φ عند سطح الأرض<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل حساب φ على أبعاد مختلفة<br><span style=\"opacity:.85\">• الطالب: يحسبون في أزواج ويرسمون φ مقابل ‎r‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا جهد الجاذبية سالب؟<\/td><td>لأن الجهد صفر في اللانهاية والجاذبية قوة تجاذب، فيلزم بذل شغل لإخراج الكتلة إلى اللانهاية، أي إن طاقتها أقل من الصفر.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب φ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).<\/td><td>φ = ‎−6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ 6.4 × 10⁶ = −6.3 × 10⁷ J/kg‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>كيف يتغير φ إذا تضاعف البعد عن المركز؟<\/td><td>يصبح نصف قيمته (أقل سالبية).<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما وحدة جهد الجاذبية؟<\/td><td>‎J/kg‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>أين يكون جهد الجاذبية صفرًا؟<\/td><td>في اللانهاية.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب φ على بعد ‎1.28 × 10⁷ m‎ من مركز الأرض.<\/td><td>φ = ‎−3.1 × 10⁷ J/kg (‎نصف قيمته عند السطح).<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-3 وكتابة تعريف جهد الجاذبية<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه «بئر الجاذبية» ومعناه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3<\/p>"]}, {"axis": "طاقة وضع الجاذبية لكتلتين نقطيتين", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "2 من 3"], ["محور الحصة", "طاقة وضع الجاذبية لكتلتين نقطيتين"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 (السؤالان 9، 10)"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎\n2. يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين\nمخرج تعليمي آخر: يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "طاقة وضع الجاذبية، ‎Eₚ = −GMm/r‎، التغير في الطاقة، فرق الجهد، سرعة الإفلات.", "يسأل المعلم: «لإطلاق قمر صناعي إلى مدار مرتفع، كم طاقة يحتاج؟ ولماذا لا تكفي ‎mgh‎؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يتوقعون أن ‎g‎ ليست ثابتة على الارتفاعات الكبيرة\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يشرح ‎Eₚ = mφ‎ وحساب ‎ΔEₚ = m(φ₂ − φ₁)‎\n• ا d>يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>طاقة وضع الجاذبية، ‎Eₚ = −GMm/r‎، التغير في الطاقة، فرق الجهد، سرعة الإفلات.<\/p>", "<p>يسأل المعلم: «لإطلاق قمر صناعي إلى مدار مرتفع، كم طاقة يحتاج؟ ولماذا لا تكفي ‎mgh‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون أن ‎g‎ ليست ثابتة على الارتفاعات الكبيرة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم المبني على حل المشكلات:<\/b> يشرح ‎Eₚ = mφ‎ وحساب ‎ΔEₚ = m(φ₂ − φ₁)‎<br><span style=\"opacity:.85\">• الطالب: يحسبون التغير في الطاقة لنقل كتلة من سطح الأرض إلى ارتفاع كبير<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني:<\/b> يوجه حل السؤالين 9 و10 ومسألة سرعة الإفلات<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب معادلة طاقة وضع الجاذبية لكتلتين.<\/td><td>‎Eₚ = −GMm/r‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الطاقة اللازمة لنقل ‎100 kg‎ من سطح الأرض ‎(φ = −6.3 × 10⁷ J/kg)‎ إلى نقطة φ = ‎−3.1 × 10⁷ J/kg‎.<\/td><td>‎ΔEₚ = 100 × (−3.1 + 6.3) × 10⁷ = 3.2 × 10⁹ J‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا لا تصلح ‎mgh‎ هنا؟<\/td><td>لأن ‎g‎ تتغير تغيرًا كبيرًا مع الارتفاع.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما العلاقة بين ‎Eₚ‎ وφ؟<\/td><td>‎Eₚ = mφ‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>هل تزداد طاقة وضع الجاذبية أم تقل عند الابتعاد عن الأرض؟<\/td><td>تزداد (تصبح أقل سالبية).<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب سرعة الإفلات من سطح الأرض.<\/td><td>½‎mv² = GMm/R ← v = √(2GM/R) = √(2 × 6.3 × 10⁷) = 1.1 × 10⁴ m/s‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل السؤالين 9 و10 ومراجعة الموضوع 1-3<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الطاقة اللازمة لإطلاق الصواريخ<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3<\/p>"]}, {"axis": "المجال والجهد الناشئ عن كتلتين ونشاطا 1-3 و1-4", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "3 من 3"], ["محور الحصة", "المجال والجهد الناشئ عن كتلتين ونشاطا 1-3 و1-4"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 + كتاب التجارب ص 30 و34"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات\n2. يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري\nمخرج تعليمي آخر: يحدد نقطة انعدام المجال بين الأرض والقمر ويفسر عدم انعدام الجهد عندها", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "جمع المتجهات، المجال المحصل، الجهد الكلي، الجمع الجبري، نقطة انعدام المجال، الكميات المتجهة والعددية.", "يسأل المعلم: «في رحلة من الأرض إلى القمر توجد نقطة لا يشعر فيها رائد الفضاء بأي جذب صافٍ؛ أين تقع تقريبًا؟ وهل الجهد صفر عندها؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يتوقعون أنها أقرب إلى القمر\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يشرح جمع شدتي المجال متجهيًا وجمع الجهدين جبريًا بمثال\n• الطالب: يحسبون المجال والجهد عند نقطة بين كتلتين\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل نشاط 1-3 (ص 30) ونشاط 1-4 (ص 34)\n• الطالب: يحلون في مجموعات\n\n4. 8 دقائق: يختم بمسابقة المجموعات\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: لماذا تُجمع شدتا المجال متجهيًا بينما يُجمع الجهد جبريًا؟\n   الإجابة النموذجية: لأن شدة المجال كمية متجهة والجهد كمية عددية.\n2) (مستوى التطبيق) السؤال: عند نقطة انعدام المجال بين الأرض والقمر، ماذا تساوي شدتا المجالين؟\n   الإجابة النموذجية: متساويتان مقدارًا ومتعاكستان اتجاهًا.\n3) (مستوى الاستدلال) السؤال: لماذا لا يكون الجهد صفرًا عند نقطة انعدام المجال؟\n   الإجابة النموذجية: لأن الجهدين سالبان كلاهما فيجمعان ولا يلغي أحدهما الآخر.", "1) (مستوى المعرفة) السؤال: هل الجهد كمية متجهة أم عددية؟\n   الإجابة النموذجية: عددية.\n2) (مستوى التطبيق) السؤال: كتلتان متساويتان، ما شدة المجال المحصل عند منتصف المسافة بينهما؟\n   الإجابة النموذجية: صفر.\n3) (مستوى الاستدلال) السؤال: احسب الجهد الكلي عند منتصف المسافة بين كتلتين كل منهما ‎1.0 × 10²² kg‎ بينهما ‎2.0 × 10⁸ m‎.\n   الإجابة النموذجية: φ = ‎2 × (−6.67 × 10⁻¹¹ × 1.0 × 10²² ÷ 1.0 × 10⁸) = −1.3 × 10⁴ J/kg‎.", "إرشاد للطالب: إكمال نشاطي 1-3 و1-4 ص 30 و34\nإرشاد لولي الأمر: تشجيع الابن على التمييز بين الكميات المتجهة والعددية بأمثلة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3"], "h": ["<ol class=\"ol\"><li>يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات<\/li><li>يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري<\/li><\/ol><div clas  1-3 (ص 30) ونشاط 1-4 (ص 34)<br><span style=\"opacity:.85\">• الطالب: يحلون في مجموعات<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا تُجمع شدتا المجال متجهيًا بينما يُجمع الجهد جبريًا؟<\/td><td>لأن شدة المجال كمية متجهة والجهد كمية عددية.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>عند نقطة انعدام المجال بين الأرض والقمر، ماذا تساوي شدتا المجالين؟<\/td><td>متساويتان مقدارًا ومتعاكستان اتجاهًا.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا لا يكون الجهد صفرًا عند نقطة انعدام المجال؟<\/td><td>لأن الجهدين سالبان كلاهما فيجمعان ولا يلغي أحدهما الآخر.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>هل الجهد كمية متجهة أم عددية؟<\/td><td>عددية.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>كتلتان متساويتان، ما شدة المجال المحصل عند منتصف المسافة بينهما؟<\/td><td>صفر.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب الجهد الكلي عند منتصف المسافة بين كتلتين كل منهما ‎1.0 × 10²² kg‎ بينهما ‎2.0 × 10⁸ m‎.<\/td><td>φ = ‎2 × (−6.67 × 10⁻¹¹ × 1.0 × 10²² ÷ 1.0 × 10⁸) = −1.3 × 10⁴ J/kg‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 1-3 و1-4 ص 30 و34<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التمييز بين الكميات المتجهة والعددية بأمثلة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3<\/p>"]}]}, {"title": "الدوران تحت تأثير الجاذبية", "sb": "الموضوع 1-4 (الأسئلة 11–14)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "الجاذبية قوة مركزية في المدارات الدائرية", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الدوران تحت تأثير الجاذبية"], ["الحصة", "1 من 4"], ["محور الحصة", "الجاذبية قوة مركزية في المدارات الدائرية"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-4 (الأسئلة 11–14)"], ["دليل المعلم", "ص 36–48"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: الدوران تحت تأثير الجاذبية ص 35"]], "t": ["1. يحلل المدارات الدائرية في مجالات الجاذبية بداللة الجاذبية قوةً مركزية: ‎GMm/r² = mv²/r‎\n2. يستنتج علاقة سرعة القمر المداري ‎v = √(GM/r)‎ ويستخدمها\nمخرج تعليمي آخر: يفسر لماذا لا تعتمد سرعة القمر الصناعي المداري على كتلته", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- المختبر الافتراضي", "- الكتاب\n- السبورة الذكية\n- جهاز الحاسب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة الجاذبية والمدارات", "الحركة الدائرية، القوة المركزية، التسارع المركزي، السرعة المدارية، ‎v = √(GM/r)‎.", "يسأل المعلم: «القمر الصناعي يسقط باستمرار نحو الأرض لكنه لا يصطدم بها؛ كيف يكون ذلك؟» ويستدعي قوانين الحركة الدائرية من الصف الحادي عشر.", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال ويراجع ‎F = mv²/r‎\n• الطالب: يستدعون علاقات الحركة الدائرية\n\n2. 13 دقيقة — الاستراتيجيتان: المختبر الافتراضي، التعلم بالنمذجة: ينفذ «المختبر الافتراضي»: محاكاة تغير السرعة المدارية بتغير نصف القطر\n• الطالب: يجربون قيمًا مختلفة ويسجلون العلاقة بين ‎v‎ و‎r‎\n\n3. 14 دقيقة — التعلم بالاكتشاف: يشتق ‎v = √(GM/r)‎ من مساواة القوتين ويحل مثالًا\n• الطالب: يستنتجون العلاقة ويحسبون سرعة قمر على مدار معين\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: ما القوة التي توفر القوة المركزية للقمر الصناعي؟\n   الإجابة النموذجية: قوة الجاذبية بين الأرض والقمر.\n2) (مستوى التطبيق) السؤال: اشتق علاقة السرعة المدارية.\n   الإجابة النموذجية: ‎GMm/r² = mv²/r ← v² = GM/r ← v = √(GM/r)‎\n3) (مستوى الاستدلال) السؤال: احسب سرعة قمر يدور على بعد ‎7.0 × 10⁶ m‎ من مركز الأرض ‎(GM = 4.0 × 10¹⁴)‎.\n   الإجابة النموذجية: =\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>كيف تتغير السرعة المدارية بزيادة نصف قطر المدار؟<\/td><td>تقل.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا لا تعتمد السرعة المدارية على كتلة القمر؟<\/td><td>لأن الكتلة ‎m‎ تُختصر من طرفي المعادلة.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>قمران على المدار نفسه كتلة أحدهما ضعف الآخر؛ قارن سرعتيهما والقوة المركزية عليهما.<\/td><td>السرعتان متساويتان، والقوة على الأثقل ضعف الأخرى.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-4 واشتقاق علاقة السرعة المدارية<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الأقمار الصناعية للاتصالات والملاحة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4<\/p>"]}, {"axis": "الزمن الدوري للمدار والقمر الصناعي الثابت بالنسبة للأرض", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الدوران تحت تأثير الجاذبية"], ["الحصة", "2 من 4"], ["محور الحصة", "الزمن الدوري للمدار والقمر الصناعي الثابت بالنسبة للأرض"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-4 (الأسئلة 11–14)"], ["دليل المعلم", "ص 36–48"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: الدوران تحت تأثير الجاذبية ص 35"]], "t": ["1. يشتق العلاقة بين الزمن الدوري ونصف قطر المدار ‎T² = 4π²r³/GM‎ ويستخدمها\n2. يذكر أن القمر الصناعي الثابت بالنسبة للأرض يبقى فوق النقطة نفسها، ويدور بزمن دوري 24 ساعة من الغرب إلى الشرق في مستوى خط الاستواء\nمخرج تعليمي آخر: يحسب نصف قطر مدار القمر الصناعي الثابت بالنسبة للأرض", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "الزمن الدوري ‎T‎، ‎T² ∝ r³‎، القمر الصناعي الثابت بالنسبة للأرض، المدار الاستوائي، 24 ساعة، اتجاه الدوران.", "يعرض المعلم صورة طبق استقبال فضائي مثبت على سطح منزل ويسأل: «لماذا لا يحتاج الطبق إلى الدوران لمتابعة القمر الصناعي؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يعرض الصورة ويطرح السؤال\n• الطالب: يستنتجون أن القمر يبدو ثابتًا\n\n2. 13 دقيقة — التعلم التعاوني: يشتق ‎T² = 4π²r³/GM‎ ويشرح شروط القمر الصناعي الثابت\n• الطالب: يشتقون العلاقة ويكتبون الشروط الثلاثة\n\n3. 14 دقيقة — التعلم المبني على حل المشكلات: يوجه حساب نصف قطر المدار الثابت والأسئلة 11–14 (أسئلة كتاب الطالب وأنشطة كتاب التجارب)\n• الطالب: يحسبون ‎r ≈ 4.2 × 10⁷ m‎ ويحلون الأسئلة\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اذكر شروط القمر الصناعي الثابت بالنسبة للأرض.\n   الإجابة النموذجية: زمن دوري 24 ساعة، ومدار في مستوى خط الاستواء، ودوران في اتجاه دوران الأرض (من الغرب إلى الشرق).\n2) (مستوى التطبيق) السؤال: احسب نصف قطر مدار القمر الثابت (‎GM = 4.0 × 10¹⁴‎، ‎T = 8.64 × 10⁴ s‎).\n   الإجابة النموذجية: ‎r³ = GMT²/4π² = 7.6 × 10²² ← r = 4.2 × 10⁷ m‎.\n3) (مستوى الاستدلال) السؤال: كم يبلغ ارتفاعه فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎؟\n   الإجابة النموذجية: نحو ‎3.6 × 10⁷ m‎.", "1) (مستوى المعرفة) السؤال: ما الزمن الدوري للقمر الصناعي الثابت بالنسبة للأرض؟\n   الإجابة النموذجية: 24 ساعة.\n2) (مستوى التطبيق) السؤال: إذا زاد نصف قطر المدار أربع مرات، فكيف يتغير الزمن الدوري؟\n   الإجابة النموذجية: يزداد ثماني مرات ‎(T ∝ r^1.5)‎.\n3) (مستوى الاستدلال) السؤال: لماذا لا يمكن وضع قمر صناعي ثابت فوق سلطنة عمان تمامًا؟\n   الإجابة النموذجية: لأن مدار القمر الثابت يجب أن يكون فوق خط الاستواء، وسلطنة عمان تقع شماله؛ فيُرى القمر من عُمان في السماء جهة الجنوب.", "إرشاد للطالب: حل الأسئلة 11–14 ومراجعة شروط القمر الثابت\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن اتجاه أطباق الاستقبال جهة الجنوب في عُمان وسببه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4"], "h": ["<ol class=\"ol\"><li>يشتق العلاقة بين الزمن الدوري ونصف قطر المدار ‎T² = 4π²r³/GM‎ ويستخدمها<\/li><li>يذكر أن القمر الصناعي الثابت بالنسبة للأرض يبقى فوق النقطة نفسها، ويدور بزمن دوري 24 ساعة من الغرب إلى الشرق في مستوى رًا أدق، وتمر فوق مناطق مختلفة.", "1) (مستوى المعرفة) السؤال: ما الزمن الدوري لقمر صناعي في مدار منخفض مقارنة بالقمر الثابت؟\n   الإجابة النموذجية: أقصر بكثير (نحو 90 دقيقة).\n2) (مستوى التطبيق) السؤال: لماذا تستخدم أقمار الاتصالات المدارات الثابتة؟\n   الإجابة النموذجية: لأنها تبقى فوق النقطة نفسها فلا تحتاج الأطباق إلى تتبعها.\n3) (مستوى الاستدلال) السؤال: ما عيب المدار الثابت لأقمار الاتصالات؟\n   الإجابة النموذجية: بعده الكبير يسبب تأخرًا زمنيًا في الإشارة ويتطلب أجهزة إرسال أقوى.", "إرشاد للطالب: إكمال نشاط 1-5 ص 35\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين أقمار الاتصالات وأقمار التصوير\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4"], "h": ["<ol class=\"ol\"><li>يحل نشاط 1-5 «الدوران تحت تأثير الجاذبية»<\/li><li>يحسب كتلة كوكب من الزمن الدوري ونصف قطر مدار أحد أقماره<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين مدارات منخفضة ومدارات ثابتة من حيث الاستخدام<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 1-5 «الدوران تحت تأثير الجاذبية»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحسب كتلة كوكب من الزمن الدوري ونصف قطر مدار أحد أقماره<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقارن بين مدارات منخفضة ومدارات ثابتة من حيث الاستخدام<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>كتلة الكوكب من بيانات المدار، المدارات المنخفضة، المدارات الثابتة، تطبيقات الأقمار الصناعية.<\/p>", "<p>يسأل المعلم: «كيف عرف العلماء كتلة كوكب المشتري دون أن يزنوه؟» وي /td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا تستخدم أقمار الاتصالات المدارات الثابتة؟<\/td><td>لأنها تبقى فوق النقطة نفسها فلا تحتاج الأطباق إلى تتبعها.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما عيب المدار الثابت لأقمار الاتصالات؟<\/td><td>بعده الكبير يسبب تأخرًا زمنيًا في الإشارة ويتطلب أجهزة إرسال أقوى.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-5 ص 35<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين أقمار الاتصالات وأقمار التصوير<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4<\/p>"]}, {"axis": "مراجعة الوحدة الأولى وأسئلة نهاية الوحدة", "n": 4, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الدوران تحت تأثير الجاذبية"], ["الحصة", "4 من 4"], ["محور الحصة", "مراجعة الوحدة الأولى وأسئلة نهاية الوحدة"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "الوحدة الأولى: أسئلة نهاية الوحدة"], ["دليل المعلم", "ص 36–48"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: الدوران تحت تأثير الجاذبية ص 35"]], "t": ["1. يربط مفاهيم الوحدة (‎g‎، φ، ‎Eₚ‎، المدارات) في منظم بصري\n2. يحل أسئلة نهاية الوحدة الأولى المرتبطة بمجالات الجاذبية\nمخرج تعليمي آخر: يقيّم تعلمه بقائمة التقويم الذاتي للوحدة", "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎", "ملخص الوحدة، ‎g = GM/r²‎، φ = ‎−GM/r‎، ‎Eₚ = −GMm/r‎، ‎v = √(GM/r)‎، ‎T² ∝ r³‎، قائمة التقويم الذاتي.", "ينظم المعلم «تحدي المعادلات»: بطاقات فيها معادلات الوحدة وأخرى فيها أسماؤها، والمطلوب مطابقتها خلال دقيقتين.", "1. 5 دقائق — التعلم المبني على اللعب: يدير التحدي\n• الطالب: يطابقون المعادلات بأسمائها\n\n2. 10 دقائق — التعلم الذاتي: يوجه بناء منظم بصري للوحدة يربط المعادلات بالمفاهيم\n• الطالب: يبنون المنظم في مجموعات\n\n3. 17 دقيقة — التعلم الذاتي: يوزع أسئلة نهاية الوحدة على المجموعات ويناقش الحلول\n• الطالب: يحلون ويعرضون\n\n4. 8 دقائق: يختم بمسابقة المجموعات للمراجعة وقائمة التقويم الذاتي\n• الطالب: يتنافسون ثم يقيّمون أنفسهم", "1) (مستوى المعرفة) السؤال: ما الفرق بين ‎g‎ وφ من حيث النوع والوحدة؟\n   الإجابة النموذجية: ‎g‎ كمية متجهة وحدتها ‎N/kg‎، وφ كمية عددية وحدتها ‎J/kg‎.\n2) (مستوى التطبيق) السؤال: كيف تتغير ‎g‎ وφ بزيادة ‎r‎؟\n   الإجابة النموذجية: ‎g‎ تتناسب مع ‎1/r²‎، وφ مع ‎1/r‎.\n3) (مستوى الاستدلال) السؤال: اربط بين φ وسرعة الإفلات.\n   الإجابة النموذجية: سرعة الإفلات ‎v = √(2|φ|)‎ عند سطح الكوكب.", "1) (مستوى المعرفة) السؤال: اذكر معادلتين من الوحدة تتبعان قانون التربيع العكسي.\n   الإجابة النموذجية: ‎F = GMm/r²‎ و‎g = GM/r²‎.\n2) (مستوى التطبيق) السؤال: احسب ‎g‎ وφ على بعد ‎2R‎ من مركز الأرض بدلالة قيمتيهما عند السطح ‎g₀‎ وφ‎₀‎.\n   الإجابة النموذجية: ‎g = g₀/4‎ وφ = φ‎₀/2‎.\n3) (مستوى الاستدلال) السؤال: قيّم تعلمك في الوحدة: موضوع أتقنته وآخر يحتاج إلى مراجعة وخطة لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.", "إرشاد للطالب: إكمال أسئلة نهاية الوحدة الأولى وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الأولى\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4"], "h": ["<ol class=\"ol\"><li>يربط مفاهيم الوحدة (‎g‎، φ، ‎Eₚ‎، المدارات) في منظم بصري<\/li><li>يحل أسئلة نهاية الوحدة الأولى المرتبطة بمجالات الجاذبية<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه بقائمة التقويم الذاتي للوحدة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يربط مفاهيم الوحدة (‎g‎، φ، ‎Eₚ‎، المدارات) في منظم بصري<\/td><td class=\"lv\">إبداع<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل أسئلة نهاية الوحدة الأولى المرتبطة بمجالات الجاذبية<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقيّم تعلمه بقائمة التقويم الذاتي للوحدة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\ ف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بالون مشحون بالدلك وقصاصات ورق", "الشحنة الكهربائية، المجال الكهربائي، شدة المجال ‎E = F/Q‎، الشحنة الاختبارية الموجبة، ‎N/C‎، التجاذب والتنافر.", "يدلك المعلم بالونًا بقطعة صوف ويقربه من قصاصات ورق دون أن يلمسها، ثم يسأل: «كيف أثّر البالون في الورق عن بعد؟ وما الشبه بين هذا وجذب الأرض للأجسام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1. 5 دقائق — التعلم بالاكتشاف: ينفذ العرض ويطرح السؤال ومهام بداية الوحدة\n• الطالب: يقترحون وجود مجال حول البالون المشحون\n\n2. 13 دقيقة — التعلم بالاكتشاف: يعرّف المجال الكهربائي وشدته ‎E = F/Q‎ واتجاهه، ويقارنه بمجال الجاذبية\n• الطالب: يكملون جدول مقارنة بين المجالين\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مواقف لتحديد اتجاه القوة والمجال على شحنات موجبة وسالبة\n• الطالب: يحددون الاتجاهات في أزواج ويبررون\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: عرّف شدة المجال الكهربائي.\n   الإجابة النموذجية: القوة المؤثرة لكل وحدة شحنة موجبة موضوعة عند تلك النقطة.\n2) (مستوى التطبيق) السؤال: ما وحدة شدة المجال الكهربائي؟\n   الإجابة النموذجية: ‎N/C‎.\n3) (مستوى الاستدلال) السؤال: كيف يكون اتجاه القوة على شحنة سالبة في مجال كهربائي؟\n   الإجابة النموذجية: عكس اتجاه المجال.", "1) (مستوى المعرفة) السؤال: ما الفرق الأساسي بين قوة الجاذبية والقوة الكهربائية؟\n   الإجابة النموذجية: الجاذبية تجاذب دائمًا بين الكتل، والكهربائية قد تكون تجاذبًا أو تنافرًا بين الشحنات.\n2) (مستوى التطبيق) السؤال: احسب شدة المجال إذا أثرت قوة ‎6.0 × 10⁻³ N‎ على شحنة ‎2.0 × 10⁻⁶ C‎.\n   الإجابة النموذجية: ‎E = 3.0 × 10³ N/C‎.\n3) (مستوى الاستدلال) السؤال: لماذا نستخدم شحنة اختبارية صغيرة لتعريف المجال؟\n   الإجابة النموذجية: كي لا تؤثر في المجال الذي نقيسه أو في توزيع الشحنات المسببة له.", "إرشاد للطالب: مراجعة الموضوع 2-1 وإكمال جدول المقارنة بين مجالي الجاذبية والكهرباء\nإرشاد لولي الأمر: الحديث مع الابن عن الكهرباء الساكنة في الحياة اليومية (الشرارة عند لمس مقبض الباب)\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=5"], "h": ["<ol class=\"ol\"><li>يذكر أن المجال الكهربائي مثال على مجال القوة ويعرّف شدة المجال الكهربائي بأنها القوة لوحدة الشحنة الموجبة<\/li><li>يقارن بين مجال الجاذبية والمجال الكهربائي من حيث المصدر ونوع القوة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد اتجاه المجال الكهربائي عند نقطة من اتجاه القوة على شحنة اختبارية موجبة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر أن المجال الكهربائي مثال على مجال القوة ويعرّف شدة المجال الكهربائي بأنها القوة لوحدة الشحنة الموجبة<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يقارن بين مجال الجاذبية والمجال الكهربائي من حيث المصدر ونوع القوة<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحدد اتجاه المجال الكهربائي عند نقطة من اتجاه القوة على شحنة اختبارية موجبة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: بالون مشحون بالدلك وقصاصات ورق<\/span><\/div>", "<p>الشحنة الكهربائية، المجال الكهربائي، شدة المجال ‎E = F/Q‎، الشحنة الاختبارية الموجبة، ‎N/C‎، التجاذب والتنافر.<\/p>", "<p>يدلك المعلم بالونًا بقطعة صوف ويقربه من قصاصات ورق دون أن يلمسها، ثم يسأل: «كيف أثّر البالون في الورق عن بعد؟ وما الشبه بين هذا وجذب الأرض للأجسام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> ينفذ العرض ويطرح السؤال ومهام بداية الوحدة<br><span style=\"opacity:.85\">• الطالب: يقترحون وجود مجال حول البالون المشحون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf 1 «تمثيل مجال كهربائي»\n2. يحل الأسئلة 1–4 في كتاب الطالب\nمخرج تعليمي آخر: يقيّم رسوم زملائه لخطوط المجال وفق قواعد الرسم", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التقييم التبادلي", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "قواعد رسم خطوط المجال، التقييم التبادلي، الأخطاء الشائعة في الرسم.", "يطلب المعلم من كل طالب رسم خطوط مجال شحنتين مختلفتين في 60 ثانية ثم يتبادل الرسم مع زميله ليبحث عن خطأ واحد.", "1. 5 دقائق — الاستراتيجيتان: التقييم التبادلي، التعلم التعاوني: يدير نشاط الرسم السريع\n• الطالب: يرسمون ويتبادلون ويقيّمون\n\n2. 15 دقيقة — التعلم الذاتي: يوجه حل نشاط 2-1 (كتاب التجارب ص 42)\n• الطالب: يحلون فرديًا\n\n3. 12 دقيقة — التعلم الذاتي: يوجه حل الأسئلة 1–4 ويعالج الأخطاء الشائعة\n• الطالب: يحلون ويناقشون\n\n4. 8 دقائق: يختم بمسابقة المجموعات\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: ما الخطأ في رسم خطوط تخرج من شحنة سالبة؟\n   الإجابة النموذجية: خطوط المجال تتجه نحو الشحنة السالبة لا منها.\n2) (مستوى التطبيق) السؤال: ما الخطأ في رسم خطين متقاطعين؟\n   الإجابة النموذجية: الخطوط لا تتقاطع لأن للمجال اتجاهًا واحدًا عند كل نقطة.\n3) (مستوى الاستدلال) السؤال: كيف تمثل مجالًا أقوى في الرسم؟\n   الإجابة النموذجية: برسم خطوط أكثر تقاربًا.", "1) (مستوى المعرفة) السؤال: اذكر ثلاث قواعد لرسم خطوط المجال.\n   الإجابة النموذجية: تبدأ من الموجبة وتنتهي بالسالبة، ولا تتقاطع، وتكون عمودية على سطح الموصل.\n2) (مستوى التطبيق) السؤال: ما اتجاه المجال عند نقطة بين شحنة موجبة وأخرى سالبة على الخط الواصل بينهما؟\n   الإجابة النموذجية: من الموجبة نحو السالبة.\n3) (مستوى الاستدلال) السؤال: قيّم رسم زميلك واذكر ملاحظتين.\n   الإجابة النموذجية: تقييم يتضمن ملاحظة على الاتجاه وأخرى على التقارب أو التقاطع مع اقتراح تصحيح.", "إرشاد للطالب: إكمال نشاط 2-1 ص 42 والأسئلة 1–4\nإرشاد لولي الأمر: متابعة الابن في تصحيح رسومه وفق القواعد\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=5"], "h": ["<ol class= ح السؤال\n• الطالب: يتوقعون أن المسافة الأقل تعطي مجالًا أقوى\n\n2. 15 دقيقة — التعلم التعاوني: ينفذ نشاط «لوحين فلزيين متوازيين» ويشرح ‎E = ΔV/Δd‎ وتكافؤ الوحدات\n• الطالب: يشتقون تكافؤ ‎V/m‎ و‎N/C‎ ويحسبون مثالين\n\n3. 12 دقيقة — التعلم التعاوني: يقدم مسائل تغيير ‎V‎ و‎d‎\n• الطالب: يتنبؤون بالنتائج ويحسبون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اكتب معادلة شدة المجال المنتظم بين لوحين.\n   الإجابة النموذجية: ‎E = ΔV/Δd‎\n2) (مستوى التطبيق) السؤال: احسب ‎E‎ بين لوحين بينهما ‎200 V‎ والمسافة ‎0.040 m‎.\n   الإجابة النموذجية: ‎E = 5.0 × 10³ V/m‎.\n3) (مستوى الاستدلال) السؤال: أثبت أن ‎V/m‎ تكافئ ‎N/C‎.\n   الإجابة النموذجية: ‎V = J/C = N m/C‎، إذن ‎V/m = N/C‎.", "1) (مستوى المعرفة) السؤال: ما أثر مضاعفة المسافة بين اللوحين مع ثبات ‎V‎؟\n   الإجابة النموذجية: تقل ‎E‎ إلى النصف.\n2) (مستوى التطبيق) السؤال: احسب فرق الجهد اللازم لمجال ‎2.0 × 10⁴ V/m‎ بين لوحين بينهما ‎5.0 mm‎.\n   الإجابة النموذجية: ‎ΔV = 100 V‎.\n3) (مستوى الاستدلال) السؤال: لماذا يكون المجال بين اللوحين منتظمًا في الوسط فقط؟\n   الإجابة النموذجية: لأن خطوط المجال تكون متوازية ومتساوية التباعد في الوسط وتنحني عند الحواف.", "إرشاد للطالب: مراجعة الموضوع 2-2 وحل ثلاث مسائل على ‎E = V/d‎\nإرشاد لولي الأمر: سؤال الابن عن تكافؤ الوحدتين ‎V/m‎ و‎N/C‎\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎<\/li><li>يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎<\/td><td c ل المنتظم بين لوحين.<\/td><td>‎E = ΔV/Δd‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب ‎E‎ بين لوحين بينهما ‎200 V‎ والمسافة ‎0.040 m‎.<\/td><td>‎E = 5.0 × 10³ V/m‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>أثبت أن ‎V/m‎ تكافئ ‎N/C‎.<\/td><td>‎V = J/C = N m/C‎، إذن ‎V/m = N/C‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما أثر مضاعفة المسافة بين اللوحين مع ثبات ‎V‎؟<\/td><td>تقل ‎E‎ إلى النصف.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب فرق الجهد اللازم لمجال ‎2.0 × 10⁴ V/m‎ بين لوحين بينهما ‎5.0 mm‎.<\/td><td>‎ΔV = 100 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا يكون المجال بين اللوحين منتظمًا في الوسط فقط؟<\/td><td>لأن خطوط المجال تكون متوازية ومتساوية التباعد في الوسط وتنحني عند الحواف.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-2 وحل ثلاث مسائل على ‎E = V/d‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تكافؤ الوحدتين ‎V/m‎ و‎N/C‎<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6<\/p>"]}, {"axis": "حسابات شدة المجال والقوة بين لوحين", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "شدة المجال الكهربائي"], ["الحصة", "2 من 3"], ["محور الحصة", "حسابات شدة المجال والقوة بين لوحين"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "الموضوع 2-2 (الأسئلة 5–8)"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي ص 44"]], "t": ["1. يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا\n2. يحسب تسارع إلكترون أو بروتون في مجال منتظم\nمخرج تعليمي آخر: يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎F = QE‎، ‎E = V/d‎، تسارع الجسيم المشحون ‎a = F/m‎، شحنة الإلكترون، كتلة الإلكترون، إهمال الوزن.", "يسأل المعلم: «إلكترون بين لوحين بينهما ‎200 V‎ على بعد ‎4.0 cm‎؛ هل يمكن إهمال وزنه عند حساب حركته؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يتوقعون ويطلبون الحساب\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يحل مثالًا لحساب ‎E‎ ثم ‎F‎ ثم ‎a‎ للإلكترون ويقارن ‎F‎ بالوزن\n• الطالب: يتبعون خطوات الحل\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل متدرجة لبروتون وأيونات\n• الطالب: يحلون في أزواج ويعرضون\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: احسب القوة على إلكترون ‎(1.60 × 10⁻¹⁹ C)‎ في مجال ‎5.0 × 10³ V/m‎.\n   الإجابة النموذجية: ‎F = 8.0 × 10⁻¹⁶ N‎.\n2) (مستوى التطبيق) السؤال: احسب تسارعه ‎(m = 9.11 × 10⁻³¹ kg)‎.\n   الإجابة النموذجية: ‎a = 8.0 × 10⁻¹⁶ ÷ 9.11 × 10⁻³¹ = 8.8 × 10¹⁴ m/s²‎.\n3) (مستوى الاستدلال) السؤال: قارن القوة الكهربائية بوزن الإلكترون.\n   الإجابة النموذجية: الوزن ≈ ‎8.9 × 10⁻³⁰ N‎، أي أصغر بنحو ‎10¹⁴‎ مرة، فيُهمل.", "1) (مستوى المعرفة) السؤال: اكتب خطوات حساب القوة على شحنة بين لوحين.\n   الإجابة النموذجية: ‎E = V/d‎ ثم ‎F = QE‎.\n2) (مستوى التطبيق) السؤال: احسب القوة على بروتون بين لوحين بينهما ‎500 V‎ والمسافة ‎0.10 m‎.\n   الإجابة النموذجية: ‎E = 5000 V/m‎؛ ‎F = 8.0 × 10⁻¹⁶ N‎.\n3) (مستوى الاستدلال) السؤال: إذا كان تسارع البروتون أصغر من تسارع الإلكترون في المجال نفسه، ففسّر ذلك.\n   الإجابة النموذجية: القوة متساوية المقدار لتساوي الشحنتين، لكن كتلة البروتون أكبر بنحو 1840 مرة فيقل تسارعه.", "إرشاد للطالب: حل الأسئلة 5–8 في كتاب الطالب\nإرشاد لولي الأمر: متابعة الابن في ترتيب خطوات الحل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6"], "h": ["<ol class=\"ol\"><li>يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا<\/li><li>يحسب تسارع إلكترون أو بروتون في مجال منتظم<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحسب تسارع إلكترون أو بروتون في مجال منتظم<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>‎F = QE‎، ‎E = V/d‎، تسارع الجسيم المشحون ‎a = F/m‎، شحنة الإلكترون، كتلة الإلكترون، إهمال الوزن.<\/p>", "<p>يسأل المعلم: «إلكترون بين لوحين بينهما ‎200 V‎ على بعد ‎4.0 cm‎؛ هل يمكن إهمال وزنه عند حساب حركته؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون ويطلبون الحساب<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم المبني على حل المشكلات:<\/b> يحل مثالًا لحساب ‎E‎ ثم ‎F‎ ثم ‎a‎ للإلكترون ويقارن ‎F‎ بالوزن<br><span style=\"opacity:.85\">• الطالب: يتبعون خطوات الحل<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل متدرجة لبروتون وأيونات<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج ويعرضون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>احسب القوة على إلكترون ‎(1.60 × 10⁻¹⁹ C)‎ في مجال ‎5.0 × 10³ V/m‎.<\/td><td>‎F = 8.0 × 10⁻¹⁶ N‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب تسارعه ‎(m = 9.11 × 10⁻³¹ kg)‎.<\/td><td>‎a = 8.0 × 10⁻¹⁶ ÷ 9.11 × 10⁻³¹ = 8.8 × 10¹⁴ m/s²‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>قارن القوة الكهربائية بوزن الإلكترون.<\/td><td>الوزن ≈ ‎8.9 × 10⁻³⁰ N‎، أي أصغر بنحو ‎10¹⁴‎ مرة، فيُهمل.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب خطوات حساب القوة على شحنة بين لوحين.<\/td><td>‎E = V/d‎ ثم ‎F = QE‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب القوة على بروتون بين لوحين بينهما ‎500 V‎ والمسافة ‎0.10 m‎.<\/td><td>‎E = 5000 V/m‎؛ ‎F = 8.0 × 10⁻¹⁶ N‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>إذا كان تسارع البروتون أصغر من تسارع الإلكترون في المجال نفسه، ففسّر ذلك.<\/td><td>القوة متساوية المقدار لتساوي الشحنتين، لكن كتلة البروتون أكبر بنحو 1840 مرة فيقل تسارعه.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل الأسئلة 5–8 في كتاب الطالب<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في ترتيب خطوات الحل<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=6<\/p>"]}, {"axis": "نشاط 2-2: حساب القوة وشدة المجال الكهربائي", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "شدة المجال الكهربائي"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "الموضوع 2-2 + كتاب التجارب ص 44"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: حساب ال
