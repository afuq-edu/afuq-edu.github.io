= 100 V‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اشتق ‎W = ½CV²‎ من ‎W = ½QV‎.</td><td>بالتعويض ‎Q = CV: W = ½(CV)V = ½CV²‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي صيغة تستخدم إذا عُلمت ‎C‎ و‎V‎ فقط؟</td><td>‎W = ½CV²‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>مكثفان: الأول ‎100 μF‎ عند ‎20 V‎، والثاني ‎400 μF‎ عند ‎10 V‎. أيهما يخزن طاقة أكبر؟</td><td>الأول: ‎0.020 J‎؛ الثاني: ‎0.020 J‎؛ متساويان.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل خمس مسائل على معادلات الطاقة</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في اختيار المعادلة المناسبة للمعطيات</p>"]}, {"axis": "نشاط 4-2 وتطبيقات المكثفات والأسئلة 1–10", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 4-2 وتطبيقات المكثفات والأسئلة 1–10"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 + كتاب التجارب ص 114"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10\n2. يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)\nمخرج تعليمي آخر: يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تقييم", "- التعلم التشاركي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "تطبيقات المكثفات، التفريغ السريع، مزيل الرجفان، وميض الكاميرا، المقارنة بالبطاريات، كثافة الطاقة.", "يعرض المعلم صورة جهاز مزيل الرجفان في مطار أو مستشفى ويسأل: «لماذا يستخدم الجهاز مكثفًا وليس البطارية مباشرة لإيصال الصدمة؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التشاركي\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون أن المكثف يفرغ طاقته بسرعة كبيرة\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم التشاركي\nالمعلم: يوجه حل نشاط 4-2 (ص 114) والأسئلة المتبقية من 1–10\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يدير نقاشًا لمقارنة المكثفات بالبطاريات ويكمل الطلبة جدولًا\nالطالب: يقارنون في مجموعات ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المكثفات والطاقة\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا يُستخدم المكثف في مزيل الرجفان؟\n   الإجابة النموذجية: لأنه يطلق طاقته في زمن قصير جدًا فيعطي قدرة كبيرة.\n2) (المستوى المتوقع) السؤال: احسب الطاقة في مكثف ‎32 μF‎ مشحون إلى ‎5000 V‎.\n   الإجابة النموذجية: ‎W = ½ × 32 × 10⁻⁶ × 2.5 × 10⁷ = 400 J‎.\n3) (المستوى المتقدم) السؤال: اذكر عيبًا للمكثف مقارنة بالبطارية.\n   الإجابة النموذجية: يخزن طاقة أقل بكثير لكل وحدة كتلة، وتتناقص فولتيته أثناء التفريغ.", "1) (مستوى الدعم) السؤال: اذكر تطبيقين للمكثفات في تخزين الطاقة.\n   الإجابة النموذجية: وميض الكاميرا، ومزيل الرجفان.\n2) (المستوى المتوقع) السؤال: ما ميزة المكثف في تطبيقات التفريغ السريع؟\n   الإجابة النموذجية: يطلق الطاقة بسرعة كبيرة فيعطي قدرة عالية لحظية.\n3) (المستوى المتقدم) السؤال: إذا أطلق مكثف ‎400 J‎ خلال ‎4.0 ms‎، فما القدرة المتوسطة؟\n   الإجابة النموذجية: ‎P = 400 ÷ 4.0 × 10⁻³ = 1.0 × 10⁵ W‎.", "إرشاد للطالب: إكمال نشاط 4-2 ص 114 والأسئلة 1–10\nإرشاد لولي الأمر: الحديث مع الابن عن جهاز مزيل الرجفان وأهمية تعلم الإسعافات الأولية"], "h": ["<ol class=\"ol\"><li>يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10</li><li>يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>تطبيقات المكثفات، التفريغ السريع، مزيل الرجفان، وميض الكاميرا، المقارنة بالبطاريات، كثافة الطاقة.</p>", "<p>يعرض المعلم صورة جهاز مزيل الرجفان في مطار أو مستشفى ويسأل: «لماذا يستخدم الجهاز مكثفًا وليس البطارية مباشرة لإيصال الصدمة؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التشاركي</span><br>يعرض الصورة ويطرح السؤال</td><td>يقترحون أن المكثف يفرغ طاقته بسرعة كبيرة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التشاركي</span><br>يوجه حل نشاط 4-2 (ص 114) والأسئلة المتبقية من 1–10</td><td>يحلون فرديًا ثم يقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يدير نقاشًا لمقارنة المكثفات بالبطاريات ويكمل الطلبة جدولًا</td><td>يقارنون في مجموعات ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على المكثفات والطاقة</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يُستخدم المكثف في مزيل الرجفان؟</td><td>لأنه يطلق طاقته في زمن قصير جدًا فيعطي قدرة كبيرة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب الطاقة في مكثف ‎32 μF‎ مشحون إلى ‎5000 V‎.</td><td>‎W = ½ × 32 × 10⁻⁶ × 2.5 × 10⁷ = 400 J‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر عيبًا للمكثف مقارنة بالبطارية.</td><td>يخزن طاقة أقل بكثير لكل وحدة كتلة، وتتناقص فولتيته أثناء التفريغ.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر تطبيقين للمكثفات في تخزين الطاقة.</td><td>وميض الكاميرا، ومزيل الرجفان.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ميزة المكثف في تطبيقات التفريغ السريع؟</td><td>يطلق الطاقة بسرعة كبيرة فيعطي قدرة عالية لحظية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا أطلق مكثف ‎400 J‎ خلال ‎4.0 ms‎، فما القدرة المتوسطة؟</td><td>‎P = 400 ÷ 4.0 × 10⁻³ = 1.0 × 10⁵ W‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 4-2 ص 114 والأسئلة 1–10</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن جهاز مزيل الرجفان وأهمية تعلم الإسعافات الأولية</p>"]}]}, {"title": "توصيل المكثفات على التوازي", "sb": "الموضوع 4-3 (الأسئلة 11–20)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "استنتاج السعة المكافئة للمكثفات الموصولة على التوازي", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوازي"], ["الحصة", "1 من 2"], ["محور الحصة", "استنتاج السعة المكافئة للمكثفات الموصولة على التوازي"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-3 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎\n2. يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها\nمخرج تعليمي آخر: يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: مكثفات وأسلاك ومقياس سعة (للعرض)", "التوصيل على التوازي، فرق الجهد المشترك، الشحنة الكلية ‎Q = Q₁ + Q₂‎، السعة المكافئة ‎C = C₁ + C₂‎.", "يذكّر المعلم الطلبة بنص قانوني كيرشوف ويطلب استخدامهما لاستنتاج معادلات مقاومتين على التوالي ثم على التوازي، ثم يسأل: «هل تتوقع أن تتبع المكثفات القوانين نفسها؟» (فكرة التمهيد).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يراجع استنتاجات المقاومات ويطرح السؤال\nالطالب: يتوقعون ويبررون\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يشتق ‎C = C₁ + C₂‎ من ‎V‎ مشترك و‎Q = Q₁ + Q₂‎\nالطالب: يكتبون الاستنتاج خطوة بخطوة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب السعة المكافئة وشحنة كل مكثف\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما الكمية المشتركة بين المكثفات الموصولة على التوازي؟\n   الإجابة النموذجية: فرق الجهد.\n2) (المستوى المتوقع) السؤال: استنتج معادلة التوازي.\n   الإجابة النموذجية: ‎Q = Q₁ + Q₂ ← CV = C₁V + C₂V ← C = C₁ + C₂‎.\n3) (المستوى المتقدم) السؤال: احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوازي.\n   الإجابة النموذجية: ‎5.0 μF‎.", "1) (مستوى الدعم) السؤال: هل تزداد السعة المكافئة أم تقل بإضافة مكثف على التوازي؟\n   الإجابة النموذجية: تزداد.\n2) (المستوى المتوقع) السؤال: احسب الشحنة على كل مكثف (‎2.0 μF‎ و‎3.0 μF‎) على التوازي مع مصدر ‎12 V‎.\n   الإجابة النموذجية: ‎Q₁ = 24 μC‎، ‎Q₂ = 36 μC‎.\n3) (المستوى المتقدم) السؤال: لماذا يشبه قانون التوازي في المكثفات قانون التوالي في المقاومات؟\n   الإجابة النموذجية: لأن السعة تُجمع مباشرة في التوازي كما تُجمع المقاومات في التوالي.", "إرشاد للطالب: مراجعة الموضوع 4-3 وكتابة استنتاج معادلة التوازي\nإرشاد لولي الأمر: متابعة الابن في التمييز بين قوانين المكثفات والمقاومات"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎</li><li>يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: مكثفات وأسلاك ومقياس سعة (للعرض)</span></div>", "<p>التوصيل على التوازي، فرق الجهد المشترك، الشحنة الكلية ‎Q = Q₁ + Q₂‎، السعة المكافئة ‎C = C₁ + C₂‎.</p>", "<p>يذكّر المعلم الطلبة بنص قانوني كيرشوف ويطلب استخدامهما لاستنتاج معادلات مقاومتين على التوالي ثم على التوازي، ثم يسأل: «هل تتوقع أن تتبع المكثفات القوانين نفسها؟» (فكرة التمهيد).</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يراجع استنتاجات المقاومات ويطرح السؤال</td><td>يتوقعون ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالنمذجة</span><br>يشتق ‎C = C₁ + C₂‎ من ‎V‎ مشترك و‎Q = Q₁ + Q₂‎</td><td>يكتبون الاستنتاج خطوة بخطوة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل حساب السعة المكافئة وشحنة كل مكثف</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الكمية المشتركة بين المكثفات الموصولة على التوازي؟</td><td>فرق الجهد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>استنتج معادلة التوازي.</td><td>‎Q = Q₁ + Q₂ ← CV = C₁V + C₂V ← C = C₁ + C₂‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوازي.</td><td>‎5.0 μF‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل تزداد السعة المكافئة أم تقل بإضافة مكثف على التوازي؟</td><td>تزداد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب الشحنة على كل مكثف (‎2.0 μF‎ و‎3.0 μF‎) على التوازي مع مصدر ‎12 V‎.</td><td>‎Q₁ = 24 μC‎، ‎Q₂ = 36 μC‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يشبه قانون التوازي في المكثفات قانون التوالي في المقاومات؟</td><td>لأن السعة تُجمع مباشرة في التوازي كما تُجمع المقاومات في التوالي.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 4-3 وكتابة استنتاج معادلة التوازي</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين قوانين المكثفات والمقاومات</p>"]}, {"axis": "حسابات المكثفات على التوازي والطاقة المخزنة فيها", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوازي"], ["الحصة", "2 من 2"], ["محور الحصة", "حسابات المكثفات على التوازي والطاقة المخزنة فيها"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-3 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي\n2. يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)\nمخرج تعليمي آخر: يفسر نقص الطاقة الكلية بعد تقاسم الشحنة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الطاقة في التوازي، تقاسم الشحنة، حفظ الشحنة، الجهد المشترك النهائي، فقد الطاقة.", "يسأل المعلم: «وصلنا مكثفًا مشحونًا بآخر فارغ مماثل له؛ هل تبقى الطاقة الكلية كما هي؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يتوقعون بقاء الطاقة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يحل مسألة تقاسم الشحنة: حفظ الشحنة والجهد المشترك والطاقة قبل وبعد\nالطالب: يتتبعون الحل ويكتشفون نقص الطاقة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل طاقة المجموعات على التوازي\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: مكثف ‎10 μF‎ مشحون إلى ‎12 V‎ وُصل بمكثف ‎10 μF‎ فارغ. ما الجهد النهائي؟\n   الإجابة النموذجية: الشحنة ‎120 μC‎ تتوزع على ‎20 μF‎، فيصبح الجهد ‎6.0 V‎.\n2) (المستوى المتوقع) السؤال: احسب الطاقة قبل التوصيل وبعده.\n   الإجابة النموذجية: قبل: ‎7.2 × 10⁻⁴ J‎؛ بعد: ½ × ‎20 × 10⁻⁶ × 36 = 3.6 × 10⁻⁴ J‎.\n3) (المستوى المتقدم) السؤال: أين ذهبت الطاقة المفقودة؟\n   الإجابة النموذجية: تحولت إلى حرارة في الأسلاك وإشعاع أثناء انتقال الشحنة.", "1) (مستوى الدعم) السؤال: ما الكمية المحفوظة عند تقاسم الشحنة؟\n   الإجابة النموذجية: الشحنة الكلية.\n2) (المستوى المتوقع) السؤال: احسب الطاقة الكلية لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوازي مع ‎12 V‎.\n   الإجابة النموذجية: ‎W = ½ × 5.0 × 10⁻⁶ × 144 = 3.6 × 10⁻⁴ J‎.\n3) (المستوى المتقدم) السؤال: لماذا نقصت الطاقة إلى النصف تمامًا في مثال المكثفين المتماثلين؟\n   الإجابة النموذجية: لأن الجهد صار نصفه والسعة ضعفها، فالطاقة ½‎CV²‎ تصبح ½ × ‎2C × (V/2)² =‎ نصف الأصلية.", "إرشاد للطالب: حل مسائل الطاقة وتقاسم الشحنة\nإرشاد لولي الأمر: سؤال الابن عن حفظ الشحنة وعدم حفظ الطاقة الكهربائية في هذه الحالة"], "h": ["<ol class=\"ol\"><li>يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي</li><li>يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر نقص الطاقة الكلية بعد تقاسم الشحنة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر نقص الطاقة الكلية بعد تقاسم الشحنة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>الطاقة في التوازي، تقاسم الشحنة، حفظ الشحنة، الجهد المشترك النهائي، فقد الطاقة.</p>", "<p>يسأل المعلم: «وصلنا مكثفًا مشحونًا بآخر فارغ مماثل له؛ هل تبقى الطاقة الكلية كما هي؟»</p>", "<table c  إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب السعة المكافئة لمكثفين وثلاثة\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما الكمية المشتركة بين المكثفات على التوالي؟\n   الإجابة النموذجية: الشحنة.\n2) (المستوى المتوقع) السؤال: استنتج معادلة التوالي.\n   الإجابة النموذجية: ‎V = V₁ + V₂ ← Q/C = Q/C₁ + Q/C₂ ← 1/C = 1/C₁ + 1/C₂‎.\n3) (المستوى المتقدم) السؤال: احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوالي.\n   الإجابة النموذجية: ‎1/C = 1/2 + 1/3 = 5/6 ← C = 1.2 μF‎.", "1) (مستوى الدعم) السؤال: كيف تقارن السعة المكافئة للتوالي بأصغر مكثف؟\n   الإجابة النموذجية: أصغر منها.\n2) (المستوى المتوقع) السؤال: احسب السعة المكافئة لمكثفين ‎4.0 μF‎ متماثلين على التوالي.\n   الإجابة النموذجية: ‎2.0 μF‎.\n3) (المستوى المتقدم) السؤال: لماذا يحمل اللوحان الأوسطان شحنتين متساويتين ومتعاكستين؟\n   الإجابة النموذجية: لأنهما متصلان معًا ومعزولان، فالإلكترونات التي تنتقل إلى أحدهما تأتي من الآخر وتبقى الشحنة الكلية لهما صفرًا.", "إرشاد للطالب: مراجعة الموضوع 4-4 وكتابة استنتاج معادلة التوالي\nإرشاد لولي الأمر: متابعة الابن في حساب مقلوب السعات بدقة"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎</li><li>يفسر أن المكثفات على التوالي تحمل الشحنة نفسها وأن فرق الجهد الكلي مجموع فروق جهودها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا تحمل المكثفات على التوالي الشحنة نفسها (الشحن بالحث بين اللوحين الداخليين)</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر أن المكثفات على التوالي تحمل الشحنة نفسها وأن فرق الجهد الكلي مجموع فروق جهودها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا تحمل المكثفات على التوالي الشحن لتعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يدونون تخميناتهم\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يحل المثال: السعة المكافئة ثم ‎Q‎ ثم ‎V‎ لكل مكثف\nالطالب: يتبعون الخطوات ويتحققون من التخمين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل متدرجة لمجموعات على التوالي\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب الشحنة المشتركة لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوالي مع ‎12 V‎.\n   الإجابة النموذجية: ‎C = 1.2 μF‎؛ ‎Q = 14.4 μC‎.\n2) (المستوى المتوقع) السؤال: احسب فرق الجهد عبر كل منهما.\n   الإجابة النموذجية: ‎V₁ = 14.4/2.0 = 7.2 V‎، ‎V₂ = 14.4/3.0 = 4.8 V‎.\n3) (المستوى المتقدم) السؤال: لماذا يكون الجهد الأكبر عبر المكثف الأصغر سعة؟\n   الإجابة النموذجية: لأن الشحنة نفسها و‎V = Q/C‎، فكلما صغرت ‎C‎ كبر ‎V‎.", "1) (مستوى الدعم) السؤال: ما مجموع فرقي الجهد في المثال؟\n   الإجابة النموذجية: ‎12 V (‎يساوي جهد المصدر).\n2) (المستوى المتوقع) السؤال: احسب الطاقة في المكثف ‎2.0 μF‎ من المثال.\n   الإجابة النموذجية: ‎W = ½ × 2.0 × 10⁻⁶ × 7.2² = 5.2 × 10⁻⁵ J‎.\n3) (المستوى المتقدم) السؤال: أي المكثفين في المثال يخزن طاقة أكبر؟ ولماذا؟\n   الإجابة النموذجية: المكثف ‎2.0 μF‎، لأن ‎W = Q²/2C‎ والشحنة نفسها فالأصغر سعة يخزن طاقة أكبر.", "إرشاد للطالب: حل مسائل التوالي وكتابة خطوات الحل\nإرشاد لولي الأمر: سؤال الابن عن العلاقة بين السعة وفرق الجهد في التوالي"], "h": ["<ol class=\"ol\"><li>يحسب الشحنة المشتركة وفرق الجهد عبر كل مكثف في مجموعة على التوالي</li><li>يفسر لماذا يكون فرق الجهد الأكبر عبر المكثف الأصغر سعة في التوالي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب الطاقة المخزنة في كل مكثف على التوالي ويقارنها</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب الشحنة المشتركة وفرق الجهد عبر كل مكثف في مجموعة على التوالي</td><td class=\"lv\">تطبيق</td></tr><tr><td F‎؛ ‎Q = 14.4 μC‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب فرق الجهد عبر كل منهما.</td><td>‎V₁ = 14.4/2.0 = 7.2 V‎، ‎V₂ = 14.4/3.0 = 4.8 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون الجهد الأكبر عبر المكثف الأصغر سعة؟</td><td>لأن الشحنة نفسها و‎V = Q/C‎، فكلما صغرت ‎C‎ كبر ‎V‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما مجموع فرقي الجهد في المثال؟</td><td>‎12 V (‎يساوي جهد المصدر).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب الطاقة في المكثف ‎2.0 μF‎ من المثال.</td><td>‎W = ½ × 2.0 × 10⁻⁶ × 7.2² = 5.2 × 10⁻⁵ J‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أي المكثفين في المثال يخزن طاقة أكبر؟ ولماذا؟</td><td>المكثف ‎2.0 μF‎، لأن ‎W = Q²/2C‎ والشحنة نفسها فالأصغر سعة يخزن طاقة أكبر.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل مسائل التوالي وكتابة خطوات الحل</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن العلاقة بين السعة وفرق الجهد في التوالي</p>"]}]}, {"title": "شبكات المكثفات", "sb": "الموضوع 4-5 (الأسئلة 11–20)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "الشبكات المختلطة من المكثفات", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شبكات المكثفات"], ["الحصة", "1 من 3"], ["محور الحصة", "الشبكات المختلطة من المكثفات"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوع 4-5 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحسب السعة المكافئة لشبكات مختلطة من المكثفات على التوالي والتوازي\n2. يحسب الشحنة وفرق الجهد لكل مكثف في شبكة مختلطة\nمخرج تعليمي آخر: يصمم شبكة مكثفات تعطي سعة مطلوبة من مكثفات متماثلة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الشبكة المختلطة، التبسيط التدريجي، المكثف المكافئ الجزئي، الشحنة وفرق الجهد في كل فرع.", "يرسم المعلم شبكة من ثلاثة مكثفات ويسأل: «من أين نبدأ التبسيط؟ من الداخل أم من الخارج؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يعرض الشبكة ويطرح السؤال\nالطالب: يقترحون البدء بأبسط مجموعة داخلية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يحل شبكة مختلطة خطوة بخطوة: ‎2 μF‎ و‎2 μF‎ على التوازي ‎(4 μF)‎ على التوالي مع ‎4 μF‎\nالطالب: يتبعون الحل ويحسبون ‎C = 2.0 μF‎\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يقدم شبكات متدرجة وتحدي تصميم سعة مطلوبة\nالطالب: يحلون ويصممون في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب السعة المكافئة لـ (‎2.0 μF‎ و‎2.0 μF‎ على التوازي) على التوالي مع ‎4.0 μF‎.\n   الإجابة النموذجية: ‎4.0 μF‎ على التوالي مع ‎4.0 μF = 2.0 μF‎.\n2) (المستوى المتوقع) السؤال: إذا وُصلت الشبكة السابقة بـ ‎12 V‎، فما فرق الجهد عبر المكثف ‎4.0 μF‎ المنفرد؟\n   الإجابة النموذجية: ‎Q = 24 μC‎؛ ‎V = 6.0 V‎.\n3) (المستوى المتقدم) السؤال: ما فرق الجهد عبر كل من مكثفي التوازي؟\n   الإجابة النموذجية: ‎12 − 6.0 = 6.0 V‎، وشحنة كل منهما ‎12 μC‎.", "1) (مستوى الدعم) السؤال: ما الخطوة الأولى في تبسيط شبكة مختلطة؟\n   الإجابة النموذجية: تبسيط المجموعات الداخلية الأبسط (التوالي أو التوازي) إلى مكثف مكافئ.\n2) (المستوى المتوقع) السؤال: صمم شبكة تعطي ‎1.5 μF‎ من مكثفات ‎1.0 μF‎.\n   الإجابة النموذجية: مكثفان على التوالي ‎(0.5 μF)‎ على التوازي مع مكثف ثالث ‎(1.0 μF)‎.\n3) (المستوى المتقدم) السؤال: احسب السعة المكافئة لـ (‎3.0 μF‎ و‎6.0 μF‎ على التوالي) على التوازي مع ‎2.0 μF‎.\n   الإجابة النموذجية: ‎2.0 + 2.0 = 4.0 μF‎.", "إرشاد للطالب: حل ثلاث شبكات مختلطة مع تفاصيل الخطوات\nإرشاد لولي الأمر: تشجيع الابن على رسم الشبكة بعد كل خطوة تبسيط"], "h": ["<ol class=\"ol\"><li>يحسب السعة المكافئة لشبكات مختلطة من المكثفات على التوالي والتوازي</li><li>يحسب الشحنة و 0</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب السعة المكافئة لـ (‎2.0 μF‎ و‎2.0 μF‎ على التوازي) على التوالي مع ‎4.0 μF‎.</td><td>‎4.0 μF‎ على التوالي مع ‎4.0 μF = 2.0 μF‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>إذا وُصلت الشبكة السابقة بـ ‎12 V‎، فما فرق الجهد عبر المكثف ‎4.0 μF‎ المنفرد؟</td><td>‎Q = 24 μC‎؛ ‎V = 6.0 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما فرق الجهد عبر كل من مكثفي التوازي؟</td><td>‎12 − 6.0 = 6.0 V‎، وشحنة كل منهما ‎12 μC‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطوة الأولى في تبسيط شبكة مختلطة؟</td><td>تبسيط المجموعات الداخلية الأبسط (التوالي أو التوازي) إلى مكثف مكافئ.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صمم شبكة تعطي ‎1.5 μF‎ من مكثفات ‎1.0 μF‎.</td><td>مكثفان على التوالي ‎(0.5 μF)‎ على التوازي مع مكثف ثالث ‎(1.0 μF)‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب السعة المكافئة لـ (‎3.0 μF‎ و‎6.0 μF‎ على التوالي) على التوازي مع ‎2.0 μF‎.</td><td>‎2.0 + 2.0 = 4.0 μF‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل ثلاث شبكات مختلطة مع تفاصيل الخطوات</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على رسم الشبكة بعد كل خطوة تبسيط</p>"]}, {"axis": "نشاط 4-3 وأسئلة الموضوعات 4-3 إلى 4-5", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شبكات المكثفات"], ["الحصة", "2 من 3"], ["محور الحصة", "نشاط 4-3 وأسئلة الموضوعات 4-3 إلى 4-5"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوعات 4-3 إلى 4-5 + كتاب التجارب ص 117"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحل نشاط 4-3 «توصيل المكثفات على التوالي وعلى التوازي»\n2. يحل الأسئلة 11–20 في كتاب الطالب\nمخرج تعليمي آخر: يكتشف الأخطاء الشائعة في حلول مسائل الشبكات ويصححها", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "مراجعة قوانين التوالي والتوازي، الخلط بين قوانين المكثفات والمقاومات، الأخطاء الشائعة.", "يعرض المعلم حلًا خاطئًا يجمع سعتين على التوالي مباشرة ويسأل: «ما الخطأ؟ ومن أين جاء الخلط؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يعرض الحل الخاطئ\nالطالب: يكتشفون الخلط مع قوانين المقاومات\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم الذاتي\nالمعلم: يوجه حل نشاط 4-3 (ص 117)\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل الأسئلة 11–20 في مجموعات\nالطالب: يحلون ويعرضون الحلول\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المكثفات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما الخطأ في حساب ‎2.0 μF + 3.0 μF = 5.0 μF‎ لمكثفين على التوالي؟\n   الإجابة النموذجية: هذا قانون التوازي؛ في التوالي تُجمع المقلوبات فتكون ‎1.2 μF‎.\n2) (المستوى المتوقع) السؤال: كيف تتذكر أن قوانين المكثفات معكوسة عن المقاومات؟\n   الإجابة النموذجية: في التوازي تُجمع السعات مباشرة كما تُجمع المقاومات في التوالي، والعكس.\n3) (المستوى المتقدم) السؤال: مكثفان متماثلان ‎C‎ على التوالي ثم على التوازي؛ ما نسبة السعتين المكافئتين؟\n   الإجابة النموذجية: ‎C/2‎ إلى ‎2C‎، أي 1 : 4.", "1) (مستوى الدعم) السؤال: ما المقاومة المكافئة التي يشبه قانونها قانون المكثفات على التوالي؟\n   الإجابة النموذجية: المقاومات على التوازي.\n2) (المستوى المتوقع) السؤال: احسب السعة المكافئة لـ ‎1.0 μF‎ و‎1.0 μF‎ و‎2.0 μF‎ جميعها على التوازي.\n   الإجابة النموذجية: ‎4.0 μF‎.\n3) (المستوى المتقدم) السؤال: أربعة مكثفات متماثلة سعة كل منه  4: المكثفات"], ["الدرس", "شبكات المكثفات"], ["الحصة", "3 من 3"], ["محور الحصة", "مقارنة المكثفات بالمقاومات ومسائل تطبيقية"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوع 4-5 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يقارن بين قوانين توصيل المكثفات والمقاومات في جدول منظم\n2. يحل مسائل تطبيقية تجمع الطاقة والشحنة والسعة المكافئة\nمخرج تعليمي آخر: يبرر اختيار توصيل معين لتحقيق متطلبات (سعة أكبر أو تحمل جهد أعلى)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: بطاقات مقارنة", "جدول المقارنة، تحمل الجهد، زيادة السعة، التطبيقات العملية للتوصيل.", "يسأل المعلم: «لديك مكثفات تتحمل ‎50 V‎ فقط، وتحتاج إلى استخدامها في دائرة ‎100 V‎؛ كيف توصلها؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يقترحون التوصيل على التوالي لتقاسم الجهد\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم المبني على اللعب\nالمعلم: يوجه إكمال جدول مقارنة بين المكثفات والمقاومات في التوصيلين\nالطالب: يكملون الجدول في أزواج\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يقدم مسائل تطبيقية (تحمل الجهد، تخزين طاقة أكبر)\nالطالب: يحلون ويبررون اختياراتهم\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على شبكات المكثفات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا يساعد التوصيل على التوالي في تحمل جهد أعلى؟\n   الإجابة النموذجية: لأن الجهد الكلي يتوزع على المكثفات.\n2) (المستوى المتوقع) السؤال: كيف تحصل على سعة أكبر من مكثفات صغيرة؟\n   الإجابة النموذجية: بتوصيلها على التوازي.\n3) (المستوى المتقدم) السؤال: مكثفان متماثلان يتحمل كل منهما ‎50 V‎ على التوالي؛ ما أقصى جهد للمجموعة؟\n   الإجابة النموذجية: ‎100 V‎.", "1) (مستوى الدعم) السؤال: اذكر الكمية المشتركة في كل من: مكثفات التوالي، ومقاومات التوالي.\n   الإجابة النموذجية: الشحنة في المكثفات، والتيار في المقاومات.\n2) (المستوى المتوقع) السؤال: أي التوصيلين يخزن طاقة أكبر لمكثفين متماثلين مع المصدر نفسه؟\n   الإجابة النموذجية: التوازي، لأن سعته المكافئة أكبر والطاقة ½‎CV²‎.\n3) (المستوى المتقدم) السؤال: لماذا لا يصح توصيل مكثفين مختلفي السعة على التوالي ويتحمل كل منهما ‎50 V‎ في دائرة ‎100 V‎؟\n   الإجابة النموذجية: لأن الجهد يتوزع عكسيًا مع السعة، فيقع على الأصغر سعة أكثر من ‎50 V‎ فيتلف.", "إرشاد للطالب: إكمال جدول المقارنة وحل المسائل التطبيقية\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية معرفة حدود تحمل المكونات الإلكترونية"], "h": ["<ol class=\"ol\"><li>يقارن بين قوانين توصيل المكثفات والمقاومات في جدول منظم</li><li>يحل مسائل تطبيقية تجمع الطاقة والشحنة والسعة المكافئة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يبرر اختيار توصيل معين لتحقيق متطلبات (سعة أكبر أو تحمل جهد أعلى)</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يقارن بين قوانين توصيل المكثفات والمقاومات في جدول منظم</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل مسائل تطبيقية تجمع الطاقة والشحنة والسعة المكافئة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يبرر اختيار توصيل معين لتحقيق متطلبات (سعة أكبر أو تحمل جهد أعلى)</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم المبني على اللعب</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: بطاقات مقارنة</span></div>", "<p>جدول المقارنة، تحمل الجهد، زيادة السعة، التطبيقات العملية للتوصيل.</p>", "<p>يسأل المعلم: «لديك مكثفات تتحمل ‎50 V‎ فقط، وتحتاج إلى استخدامها في دائرة ‎100 V‎؛ كيف توصلها؟»</p>", "<table class=\"tb proc ></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يصح توصيل مكثفين مختلفي السعة على التوالي ويتحمل كل منهما ‎50 V‎ في دائرة ‎100 V‎؟</td><td>لأن الجهد يتوزع عكسيًا مع السعة، فيقع على الأصغر سعة أكثر من ‎50 V‎ فيتلف.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال جدول المقارنة وحل المسائل التطبيقية</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أهمية معرفة حدود تحمل المكونات الإلكترونية</p>"]}]}, {"title": "شحن المكثفات وتفريغها", "sb": "الموضوع 4-6 (الأسئلة 21–24)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "استقصاء تفريغ مكثف والتمثيلات البيانية مع الزمن", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "1 من 3"], ["محور الحصة", "استقصاء تفريغ مكثف والتمثيلات البيانية مع الزمن"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 4-6 (الأسئلة 21–24)"], ["دليل المعلم", "ص 124–130"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-4: تفريغ المكثفات ص 121؛ الاستقصاء العملي 4-1: تحديد سعة مكثف في دائرة تيار كهربائي مستمر ص 126"]], "t": ["1. يحلل التمثيلات البيانية لتغير فرق الجهد والشحنة وشدة التيار مع الزمن لمكثف يُفرَّغ عبر مقاومة\n2. يصف الاضمحلال الأسي ويميزه عن التناقص الخطي\nمخرج تعليمي آخر: يتنبأ بأثر زيادة المقاومة أو السعة على سرعة التفريغ", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء تفريغ مكثف", "- الكتاب\n- الأقلام\n- صورة توضيحية\n- أخرى: مكثف كبير السعة، مقاومة كبيرة، فولتميتر رقمي، ساعة إيقاف", "التفريغ، الاضمحلال الأسي، فرق الجهد مع الزمن، الشحنة مع الزمن، التيار مع الزمن، المقاومة، السعة.", "يسأل المعلم: «عند فصل الشاحن، لماذا يبقى ضوء صغير في بعض الأجهزة مضاءً لثوانٍ ثم يخفت تدريجيًا؟» ويذكّر بأن التفريغ يشبه الاضمحلال الإشعاعي.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: استقصاء تفريغ مكثف\nالمعلم: يطرح السؤال\nالطالب: يقترحون تفريغ مكثف ببطء\n2) (18 دقيقة: من الدقيقة 5 إلى 23)\nالاستراتيجية: استقصاء تفريغ مكثف\nالمعلم: ينفذ «استقصاء تفريغ مكثف» بقراءة ‎V‎ كل ‎10 s‎\nالطالب: يسجلون القراءات ويرسمون ‎V‎ مقابل ‎t‎\n3) (10 دقائق: من الدقيقة 23 إلى 33)\nالاستراتيجيتان: التعلم بالاكتشاف، التعلم التعاوني\nالمعلم: يشرح أشكال تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن ويناقش أثر ‎R‎ و‎C‎\nالطالب: يكملون تمثيلات ‎Q‎ و‎I‎ ويتنبؤون بأثر تغيير ‎R‎\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما شكل تمثيل ‎V‎ مقابل ‎t‎ أثناء التفريغ؟\n   الإجابة النموذجية: منحنى اضمحلال أسي يتناقص بسرعة ثم ببطء.\n2) (المستوى المتوقع) السؤال: لماذا يكون التفريغ أبطأ عندما تكون المقاومة أكبر؟\n   الإجابة النموذجية: لأن التيار يكون أصغر فتتدفق الشحنة بمعدل أبطأ.\n3) (المستوى المتقدم) السؤال: ما الذي يميز الاضمحلال الأسي؟\n   الإجابة النموذجية: أن الكمية تقل بالنسبة نفسها في فترات زمنية متساوية.", "1) (مستوى الدعم) السؤال: هل يتشابه شكلا تمثيلي ‎Q‎ و‎I‎ مع الزمن أثناء التفريغ؟\n   الإجابة النموذجية: نعم، كلاهما اضمحلال أسي.\n2) (المستوى المتوقع) السؤال: كيف تتغير سرعة التفريغ بزيادة السعة؟\n   الإجابة النموذجية: يصبح التفريغ أبطأ.\n3) (المستوى المتقدم) السؤال: لماذا لا يصل فرق الجهد إلى الصفر تمامًا نظريًا؟\n   الإجابة النموذجية: لأن الاضمحلال الأسي يقلل الكمية بنسبة ثابتة كل فترة فيقترب من الصفر دون أن يبلغه.", "إرشاد للطالب: مراجعة الموضوع 4-6 ورسم تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن\nإرشاد لولي الأمر: الحديث مع الابن عن أجهزة يبقى ضوؤها قليلًا بعد فصلها"], "h": ["<ol class=\"ol\"><li>يحلل التمثيلات البيانية لتغير فرق الجهد والشحنة وشدة التيار مع الزمن لمكثف يُفرَّغ عبر مقاومة</li><li>يصف الاضمحلال الأسي ويميزه عن التناقص الخطي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بأثر زيادة المقاومة أو السعة على سرعة التفريغ</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحلل التمثيلات البيانية لتغير فرق الجهد والشحنة وشدة التيار مع الزمن لمكثف يُفرَّغ عبر مقاومة</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف الاضمحلال الأسي ويميزه عن التناقص الخطي< ss=\"lvA a1\">مستوى الدعم</td><td>ما شكل تمثيل ‎V‎ مقابل ‎t‎ أثناء التفريغ؟</td><td>منحنى اضمحلال أسي يتناقص بسرعة ثم ببطء.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون التفريغ أبطأ عندما تكون المقاومة أكبر؟</td><td>لأن التيار يكون أصغر فتتدفق الشحنة بمعدل أبطأ.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الذي يميز الاضمحلال الأسي؟</td><td>أن الكمية تقل بالنسبة نفسها في فترات زمنية متساوية.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل يتشابه شكلا تمثيلي ‎Q‎ و‎I‎ مع الزمن أثناء التفريغ؟</td><td>نعم، كلاهما اضمحلال أسي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف تتغير سرعة التفريغ بزيادة السعة؟</td><td>يصبح التفريغ أبطأ.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يصل فرق الجهد إلى الصفر تمامًا نظريًا؟</td><td>لأن الاضمحلال الأسي يقلل الكمية بنسبة ثابتة كل فترة فيقترب من الصفر دون أن يبلغه.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 4-6 ورسم تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أجهزة يبقى ضوؤها قليلًا بعد فصلها</p>"]}, {"axis": "الثابت الزمني τ = ‎RC‎ والمعادلة ‎x = x₀e^(−t/RC)‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "2 من 3"], ["محور الحصة", "الثابت الزمني τ = ‎RC‎ والمعادلة ‎x = x₀e^(−t/RC)‎"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 4-6 (الأسئلة 21–24)"], ["دليل المعلم", "ص 124–130"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-4: تفريغ المكثفات ص 121؛ الاستقصاء العملي 4-1: تحديد سعة مكثف في دائرة تيار كهربائي مستمر ص 126"]], "t": ["1. يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎\n2. يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد\nمخرج تعليمي آخر: يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- تحديد طبيعة تفريغ المكثفات", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الثابت الزمني τ = ‎RC‎، ‎e^(−t/RC)‎، 37%، ‎ln V‎ مقابل ‎t‎، الميل = ‎−1/RC‎، نصف العمر.", "يسأل المعلم: «إذا انخفض جهد مكثف إلى 37% من قيمته بعد ‎47 s‎، فما علاقة هذا الرقم بقيمتي ‎R‎ و‎C‎؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يتوقعون أن الزمن يعتمد على ‎R‎ و‎C‎\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: تحديد طبيعة تفريغ المكثفات\nالمعلم: ينفذ «تحديد طبيعة تفريغ المكثفات»: τ = ‎RC‎ و‎x = x₀e^(−t/RC)‎ وتمثيل ‎ln V‎ مقابل ‎t‎\nالطالب: يشتقون أن ‎V = 0.37V₀‎ عند ‎t = RC‎ ويرسمون ‎ln V‎ مقابل ‎t‎\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني\nالمعلم: يقدم مسائل حساب τ وقيم ‎V‎ و‎Q‎ و‎I‎ بعد زمن معين\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب τ لمكثف ‎470 μF‎ يُفرَّغ عبر ‎100 kΩ‎.\n   الإجابة النموذجية: τ = ‎100 × 10³ × 470 × 10⁻⁶ = 47 s‎.\n2) (المستوى المتوقع) السؤال: احسب ‎V‎ بعد ‎47 s‎ إذا كان ‎V₀ = 12 V‎.\n   الإجابة النموذجية: ‎V = 12e⁻¹ = 4.4 V‎.\n3) (المستوى المتقدم) السؤال: ما ميل تمثيل ‎ln V‎ مقابل ‎t‎؟\n   الإجابة النموذجية: ‎−1/RC‎.", "1) (مستوى الدعم) السؤال: كم تصبح الشحنة بعد زمن يساوي τ؟\n   الإجابة النموذجية: نحو 37% من الشحنة الابتدائية.\n2) (المستوى المتوقع) السؤال: احسب ‎V‎ بعد 2τ إذا كان ‎V₀ = 10 V‎.\n   الإجابة النموذجية: ‎V = 10e⁻² = 1.4 V‎.\n3) (المستوى المتقدم) السؤال: احسب الزمن اللازم لانخفاض ‎V‎ إلى النصف لمكثف τ له ‎47 s‎.\n   الإجابة النموذجية: ‎t = τ ln 2 = 0.693 × 47 = 33 s‎.", "إرشاد للطالب: حل مسائل τ = ‎RC‎ والمعادلة الأسية\nإرشاد لولي الأمر: متابعة الابن في استخدام زري ‎e^x‎ و‎ln‎ في الآلة الحاسبة"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎</li><li>يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">تحديد طبيعة تفريغ المكثفات</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>الثابت الزمني τ = ‎RC‎، ‎e^(−t/RC)‎، 37%، ‎ln V‎ مقابل ‎t‎، الميل = ‎−1/RC‎، نصف العمر.</p>", "<p>يسأل المعلم: «إذا انخفض جهد مكثف إلى 37% من قيمته بعد ‎47 s‎، فما علاقة هذا الرقم بقيمتي ‎R‎ و‎C‎؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يتوقعون أن الزمن يعتمد على ‎R‎ و‎C‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: تحديد طبيعة تفريغ المكثفات</span><br>ينفذ «تحديد طبيعة تفريغ المكثفات»: τ = ‎RC‎ و‎x = x₀e^(−t/RC)‎ وتمثيل ‎ln V‎ مقابل ‎t‎</td><td>يشتقون أن ‎V = 0.37V₀‎ عند ‎t = RC‎ ويرسمون ‎ln V‎ مقابل ‎t‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني</span><br>يقدم مسائل حساب τ وقيم ‎V‎ و‎Q‎ و‎I‎ بعد زمن معين</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب τ لمكثف ‎470 μF‎ يُفرَّغ عبر ‎100 kΩ‎.</td><td>τ = ‎100 × 10³ × 470 × 10⁻⁶ = 47 s‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎V‎ بعد ‎47 s‎ إذا كان ‎V₀ = 12 V‎.</td><td>‎V = 12e⁻¹ = 4.4 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما ميل تمثيل ‎ln V‎ مقابل ‎t‎؟</td><td>‎−1/RC‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كم تصبح الشحنة بعد زمن يساوي τ؟</td><td>نحو 37% من الشحنة الابتدائية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎V‎ بعد 2τ إذا كان ‎V₀ = 10 V‎.</td><td>‎V = 10e⁻² = 1.4 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب الزمن اللازم لانخفاض ‎V‎ إلى النصف لمكثف τ له ‎47 s‎.</td><td>‎t = τ ln 2 = 0.693 × 47 = 33 s‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل مسائل τ = ‎RC‎ والمعادلة الأسية</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في استخدام زري ‎e^x‎ و‎ln‎ في الآلة الحاسبة</p>"]}, {"axis": "الاستقصاء العملي 4-1: تحديد سعة مكثف ونشاط 4-4 ومراجعة الوحدة الرابعة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 4-1: تحديد سعة مكثف ونشاط 4-4 ومراجعة الوحدة الرابعة"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 4-6 + كتاب التجارب ص 121 و126"], ["دليل المعلم", "ص 124–130"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-4: تفريغ المكثفات ص 121؛ الاستقصاء العملي 4-1: تحديد سعة مكثف في دائرة تيار كهربائي مستمر ص 126"]], "t": ["1. ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ\n2. يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24\nمخرج تعليمي آخر: يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم الذاتي\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: مكثف، مقاومة معلومة، فولتميتر رقمي، ساعة إيقاف، ورق رسم، كتاب التجارب العملية والأنشطة", "‎ln V‎ مقابل ‎t‎، خط أفضل مطابقة، خط أسوأ مطابقة، عدم اليقين في الميل، ‎C = −1/(R ×‎ الميل).", "يعرض المعلم جدول بيانات تفريغ نموذجي (‎V‎ مقابل ‎t‎) ويسأل: «كيف نحول هذه البيانات إلى قيمة للسعة باستخدام خط مستقيم؟»", "1) (4 دقائق: من الدقيقة 0 إلى 4)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض البيانات ويطرح السؤال\nالطالب: يقترحون رسم ‎ln V‎ مقابل ‎t‎\n2) (18 دقيقة: من الدقيقة 4 إلى 22)\nالاستراتيجيتان: الاستقصاء العملي، التعلم الذاتي\nالمعلم: يوجه تنفيذ الاستقصاء العملي 4-1 (ص 126) أو تحليل بياناته النموذجية مع خطي أفضل وأسوأ مطابقة\nالطالب: يرسمون ويحسبون الميل و‎C‎ وعدم اليقين\n3) (10 دقائق: من الدقيقة 22 إلى 32)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يوجه حل نشاط 4-4 (ص 121) والأسئلة 21–24\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الرابعة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كيف تُحسب ‎C‎ من ميل ‎ln V‎ مقابل ‎t‎؟\n   الإجابة النموذجية: ‎C = −1/(R ×‎ الميل).\n2) (المستوى المتوقع) السؤال: إذا كان الميل ‎−0.020 s⁻¹‎ و‎R = 100 kΩ‎، فما ‎C‎؟\n   الإجابة النموذجية: ‎C = 1/(100 × 10³ × 0.020) = 5.0 × 10⁻⁴ F = 500 μF‎.\n3) (المستوى المتقدم) السؤال: لماذا نرسم خط أسوأ مطابقة؟\n   الإجابة النموذجية: لتقدير عدم اليقين في الميل ومن ثم في قيمة ‎C‎.", "1) (مستوى الدعم) السؤال: لماذا نستخدم ‎ln V‎ بدل ‎V‎؟\n   الإجابة النموذجية: لتحويل المنحنى الأسي إلى خط مستقيم يسهل حساب ميله.\n2) (المستوى المتوقع) السؤال: اذكر مصدرًا للخطأ في استقصاء تفريغ المكثف.\n   الإجابة النموذجية: زمن رد فعل القارئ عند تسجيل القراءات، أو تسرب الشحنة، أو عدم دقة قيمة ‎R‎.\n3) (المستوى المتقدم) السؤال: قيّم تعلمك في الوحدة الرابعة: موضوع أتقنته وآخر يحتاج إلى مراجعة وخطة لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية.", "إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 وإكمال نشاط 4-4 والأسئلة 21–24 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الرابعة"], "h": ["<ol class=\"ol\"><li>ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ</li><li>يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">الاستقصاء العملي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: مكثف، مقاومة معلومة، فولتميتر رقمي، ساعة إيقاف، ورق رسم، كتاب التجارب العملية والأنشطة</span></div>", "<p>‎ln V‎ مقابل ‎t‎، خط أفضل مطابقة، خط أسوأ مطابقة، عدم اليقين في الميل، ‎C = −1/(R ×‎ الميل).</p>", "<p>يعرض المعلم جدول بيانات تفريغ نموذجي (‎V‎ مقابل ‎t‎) ويسأل: «كيف نحول هذه البيانات إلى قيمة للسعة باستخدام خط مستقيم؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يعرض البيانات ويطرح السؤال</td><td>يقترحون رسم ‎ln V‎ مقابل ‎t‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–22</span><br><small>18 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: الاستقصاء العملي، التعلم الذاتي</span><br>يوجه تنفيذ الاستقصاء العملي 4-1 (ص 126) أو تحليل بياناته النموذجية مع خطي أفضل وأسوأ مطابقة</td><td>يرسمون ويحسبون الميل و‎C‎ وعدم اليقين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">22–32</span><br><small>10 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يوجه حل نشاط 4-4 (ص 121) والأسئلة 21–24</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة الرابعة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تُحسب ‎C‎ من ميل ‎ln V‎ مقابل ‎t‎؟</td><td>‎C = −1/(R ×‎ الميل).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>إذا كان الميل ‎−0.020 s⁻¹‎ و‎R = 100 kΩ‎، فما ‎C‎؟</td><td>‎C = 1/(100 × 10³ × 0.020) = 5.0 × 10⁻⁴ F = 500 μF‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا نرسم خط أسوأ مطابقة؟</td><td>لتقدير عدم اليقين في الميل ومن ثم في قيمة ‎C‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا نستخدم ‎ln V‎ بدل ‎V‎؟</td><td>لتحويل المنحنى الأسي إلى خط مستقيم يسهل حساب ميله.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر مصدرًا ثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 5-1 (الأسئلة 1–3)"], ["دليل المعلم", "ص 142–146"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-1: خطوط المجال المغناطيسي ص 134"]], "t": ["1. يمثل المجالات المغناطيسية المتولدة حول سلك مستقيم وملف دائري وملف حلزوني (لولبي) بخطوط المجال\n2. يحدد اتجاه المجال باستخدام قاعدة قبضة اليد اليمنى\nمخرج تعليمي آخر: يفسر تشابه مجال الملف اللولبي مع مجال المغناطيس المستقيم", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: سلك مستقيم وملف لولبي ومصدر تيار وبرادة حديد", "السلك المستقيم، الملف الدائري، الملف اللولبي، دوائر متحدة المركز، قاعدة قبضة اليد اليمنى، المجال المنتظم داخل الملف.", "يمرر المعلم تيارًا في سلك رأسي يخترق لوحًا عليه برادة حديد، ويسأل: «ما شكل المجال الذي تراه؟ وكيف نعرف اتجاهه؟» (فكرة التمهيد أ).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يصفون الدوائر متحدة المركز\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يشرح أنماط المجال حول السلك والملف الدائري واللولبي وقاعدة قبضة اليد اليمنى\nالطالب: يرسمون الأنماط الثلاثة ويحددون الاتجاهات\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يقدم رسومًا لتحديد اتجاه المجال أو التيار في حالات مختلفة\nالطالب: يطبقون القاعدة في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما شكل خطوط المجال حول سلك مستقيم يحمل تيارًا؟\n   الإجابة النموذجية: دوائر متحدة المركز حول السلك.\n2) (المستوى المتوقع) السؤال: كيف تحدد اتجاه المجال حول سلك بقاعدة قبضة اليد اليمنى؟\n   الإجابة النموذجية: يشير الإبهام إلى اتجاه التيار وتلتف الأصابع في اتجاه المجال.\n3) (المستوى المتقدم) السؤال: لماذا يشبه مجال الملف اللولبي مجال المغناطيس المستقيم؟\n   الإجابة النموذجية: لأن خطوطه تخرج من أحد طرفيه وتدخل الآخر فيتكون قطبان، ويكون المجال داخله منتظمًا تقريبًا.", "1) (مستوى الدعم) السؤال: أين يكون مجال الملف اللولبي منتظمًا تقريبًا؟\n   الإجابة النموذجية: داخل الملف بعيدًا عن طرفيه.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لمجال السلك إذا عُكس اتجاه التيار؟\n   الإجابة النموذجية: ينعكس اتجاه المجال.\n3) (المستوى المتقدم) السؤال: كيف تحدد القطب الشمالي لملف لولبي باليد اليمنى؟\n   الإجابة النموذجية: تلتف الأصابع في اتجاه التيار في اللفات فيشير الإبهام إلى القطب الشمالي.", "إرشاد للطالب: رسم أنماط المجال الثلاثة مع الاتجاهات\nإرشاد لولي الأمر: سؤال الابن عن قاعدة قبضة اليد اليمنى وتطبيقها"], "h": ["<ol class=\"ol\"><li>يمثل المجالات المغناطيسية المتولدة حول سلك مستقيم وملف دائري وملف حلزوني (لولبي) بخطوط المجال</li><li>يحدد اتجاه المجال باستخدام قاعدة قبضة اليد اليمنى</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر تشابه مجال الملف اللولبي مع مجال المغناطيس المستقيم</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يمثل المجالات المغناطيسية المتولدة حول سلك مستقيم وملف دائري وملف حلزوني (لولبي) بخطوط المجال</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد اتجاه المجال باستخدام قاعدة قبضة اليد اليمنى</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر تشابه مجال الملف اللولبي مع مجال المغناطيس المستقيم</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: سلك مستقيم وملف لولبي ومصدر تيار وبرادة حديد</span></div>", "<p>السلك المستقيم، الملف الدائري، الملف اللولبي، دوائر متحدة المركز، قاعدة قبضة اليد اليمنى، المجال المنتظم داخل الملف.</p>", "<p>يمرر المعلم تيارًا في سلك رأسي يخترق لوحًا عليه برادة حديد، ويسأل: «ما شكل المجال الذي تراه؟ وكيف نعرف اتجاهه؟» (فكرة التمهيد أ).</p>", ج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المجالات المغناطيسية\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: في أي جانب من السلك يقوى المجال المحصل؟\n   الإجابة النموذجية: في الجانب الذي يكون فيه مجال السلك في اتجاه المجال المنتظم نفسه.\n2) (المستوى المتوقع) السؤال: إلى أي جانب يتحرك السلك؟\n   الإجابة النموذجية: من منطقة المجال الأقوى إلى منطقة المجال الأضعف.\n3) (المستوى المتقدم) السؤال: ماذا يحدث للقوة إذا كان السلك موازيًا للمجال المنتظم؟\n   الإجابة النموذجية: تنعدم القوة.", "1) (مستوى الدعم) السؤال: ما المجال المحصل؟\n   الإجابة النموذجية: المجموع المتجهي للمجال المنتظم ومجال السلك عند كل نقطة.\n2) (المستوى المتوقع) السؤال: هل يتأثر سلك يحمل تيارًا بقوة إذا وُضع في مجال مغناطيسي؟\n   الإجابة النموذجية: نعم، إذا لم يكن موازيًا للمجال.\n3) (المستوى المتقدم) السؤال: فسّر حركة السلك باستخدام نموذج الخطوط المشدودة.\n   الإجابة النموذجية: الخطوط المتكدسة في جانب المجال الأقوى تعمل كأوتار مشدودة تدفع السلك نحو الجانب الأضعف.", "إرشاد للطالب: إكمال نشاط 5-1 ص 134 والأسئلة 1–3\nإرشاد لولي الأمر: الحديث مع الابن عن مبدأ عمل المحرك الكهربائي في الأجهزة المنزلية"], "h": ["<ol class=\"ol\"><li>يحل نشاط 5-1 «خطوط المجال المغناطيسي» والأسئلة 1–3</li><li>يرسم المجال المحصل لسلك يحمل تيارًا موضوعًا في مجال منتظم</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ باتجاه القوة على السلك من شكل المجال المحصل (تمهيدًا للدرس التالي)</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 5-1 «خطوط المجال المغناطيسي» والأسئلة 1–3</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يرسم المجال المحصل لسلك يحمل تيارًا موضوعًا في مجال منتظم</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ باتجاه القوة على السلك من شكل المجال المحصل (تمهيدًا للدرس التالي)</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني< رك الكهربائي.", "يضع المعلم سلكًا بين مغناطيسين ويمرر تيارًا فيقفز السلك، ويسأل: «لماذا تحرك السلك؟ وكيف نتنبأ باتجاه حركته؟» (فكرة التمهيد ج).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يصفون الحركة ويقترحون تفسيرًا\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يشرح قاعدة فليمنج لليد اليسرى والعوامل المؤثرة نوعيًا\nالطالب: يطبقون القاعدة على العرض ويتحققون من الاتجاه\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يقدم رسومًا لتحديد اتجاه القوة أو التيار أو المجال المجهول\nالطالب: يطبقون القاعدة في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ماذا يمثل كل إصبع في قاعدة فليمنج لليد اليسرى؟\n   الإجابة النموذجية: الإبهام: القوة (الحركة)، السبابة: المجال، الوسطى: التيار.\n2) (المستوى المتوقع) السؤال: ماذا يحدث للقوة إذا عُكس اتجاه التيار؟\n   الإجابة النموذجية: ينعكس اتجاهها.\n3) (المستوى المتقدم) السؤال: ماذا يحدث للقوة إذا عُكس التيار والمجال معًا؟\n   الإجابة النموذجية: يبقى اتجاهها كما هو.", "1) (مستوى الدعم) السؤال: اذكر عاملين يزيدان مقدار القوة على السلك.\n   الإجابة النموذجية: زيادة التيار، وزيادة شدة المجال (أو طول السلك داخل المجال).\n2) (المستوى المتوقع) السؤال: متى تكون القوة على السلك أكبر ما يمكن؟\n   الإجابة النموذجية: عندما يكون السلك عموديًا على المجال.\n3) (المستوى المتقدم) السؤال: كيف تجعل الملف في المحرك يدور باستمرار في الاتجاه نفسه؟\n   الإجابة النموذجية: بعكس اتجاه التيار في الملف كل نصف دورة باستخدام المبدل (الحلقتين المشقوقتين).", "إرشاد للطالب: مراجعة الموضوع 5-2 والتدرب على قاعدة فليمنج لليد اليسرى\nإرشاد لولي الأمر: سؤال الابن عن تطبيق قاعدة اليد اليسرى في المحرك الكهربائي"], "h": ["<ol class=\"ol\"><li>يحدد اتجاه القوة على سلك يحمل تيارًا في مجال مغناطيسي باستخدام قاعدة فليمنج لليد اليسرى</li><li>يصف العوامل المؤثرة في مقدار القوة (التيار، الطول، شدة المجال، الزاوية) نوعيًا</li></ol><div class=\"extra\"><b>مخرج تعليمي آ اويتان مقدارًا ومتعاكستان اتجاهًا (قانون نيوتن الثالث).\n3) (المستوى المتقدم) السؤال: سلكان متوازيان يحملان تيارين ‎2 A‎ و‎6 A‎ في الاتجاه نفسه؛ أيهما يتأثر بقوة أكبر؟ فسّر.\n   الإجابة النموذجية: القوتان متساويتان مقدارًا وفق قانون نيوتن الثالث، رغم اختلاف التيارين.", "إرشاد للطالب: حل أسئلة القوة المغناطيسية في كتابي الطالب والتجارب\nإرشاد لولي الأمر: الحديث مع الابن عن تعريف الأمبير المرتبط بالقوة بين سلكين متوازيين"], "h": ["<ol class=\"ol\"><li>يفسر نوعيًا التجاذب بين سلكين متوازيين يحملان تيارين في الاتجاه نفسه والتنافر عند تعاكسهما</li><li>يطبق قاعدتي قبضة اليد اليمنى وفليمنج لليد اليسرى لتحديد اتجاه القوة بين السلكين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط وأسئلة كتاب التجارب على القوة المغناطيسية</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يفسر نوعيًا التجاذب بين سلكين متوازيين يحملان تيارين في الاتجاه نفسه والتنافر عند تعاكسهما</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يطبق قاعدتي قبضة اليد اليمنى وفليمنج لليد اليسرى لتحديد اتجاه القوة بين السلكين</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط وأسئلة كتاب التجارب على القوة المغناطيسية</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span><span class=\"chip r\">أخرى: سلكان مرنان متوازيان (شريط ألومنيوم) ومصدر تيار للعرض</span></div>", "<p>سلكان متوازيان، التيار في الاتجاه نفسه (تجاذب)، التيار المتعاكس (تنافر)، المجال عند السلك الآخر.</p>", "<p>يمرر المعلم تيارًا في شريطي ألومنيوم متوازيين مرة في الاتجاه نفسه ومرة متعاكسين، ويسأل: «لماذا تقاربا مرة وتباعدا مرة أخرى؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعل لتعريف ويحسبون أمثلة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل بزوايا مختلفة\nالطالب: يحلون في أزواج ويحددون θ بدقة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير السؤال المفصلي (سلك كتلته لكل وحدة طول ‎10 g/m‎ بزاوية ‎45°‎) ثم التقويم الختامي\nالطالب: يجيبون ويناقشون الخيارات الخاطئة\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: عرّف التسلا.\n   الإجابة النموذجية: كثافة الفيض التي تؤثر بقوة ‎1 N‎ على سلك طوله ‎1 m‎ يحمل تيارًا ‎1 A‎ موضوع عموديًا على المجال.\n2) (المستوى المتوقع) السؤال: احسب القوة على سلك طوله ‎0.050 m‎ يحمل ‎3.0 A‎ عموديًا على مجال ‎0.20 T‎.\n   الإجابة النموذجية: ‎F = 0.20 × 3.0 × 0.050 = 0.030 N‎.\n3) (المستوى المتقدم) السؤال: احسب القوة إذا كانت الزاوية بين السلك والمجال ‎30°‎.\n   الإجابة النموذجية: ‎F = 0.030 × sin 30° = 0.015 N‎.", "1) (مستوى الدعم) السؤال: ما وحدة كثافة الفيض المغناطيسي؟\n   الإجابة النموذجية: التسلا ‎(T)‎.\n2) (المستوى المتوقع) السؤال: ما الزاوية θ في المعادلة ‎F = BIL sinθ‎؟\n   الإجابة النموذجية: الزاوية بين السلك (اتجاه التيار) واتجاه المجال.\n3) (المستوى المتقدم) السؤال: احسب ‎B‎ إذا أثرت قوة ‎0.020 N‎ على سلك طوله ‎0.10 m‎ يحمل ‎2.0 A‎ عموديًا على المجال.\n   الإجابة النموذجية: ‎B = 0.10 T‎.", "إرشاد للطالب: مراجعة الموضوع 5-3 وحل مسائل ‎F = BIL sinθ‎\nإرشاد لولي الأمر: متابعة الابن في تحديد الزاوية بين السلك والمجال"], "h": ["<ol class=\"ol\"><li>يعرّف كثافة الفيض المغناطيسي بأنها القوة المؤثرة لكل وحدة تيار لكل وحدة طول من سلك موضوع عموديًا على المجال</li><li>يستخدم المعادلة ‎F = BIL sinθ‎ ويحدد الاتجاهات باستخدام قاعدة فليمنج لليد اليسرى</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد الزاوية θ بصورة صحيحة بين السلك والمجال</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف كثافة الفيض المغناطيسي بأنها القوة المؤثرة لكل وحدة تيار لكل وحدة طول من سلك موضوع عموديًا على المجال</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم المعادلة ‎F = BIL sinθ‎ ويحدد الاتجاهات باستخدام قاعدة فليمنج لليد اليسرى</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد الزاوية θ بصورة صحيحة بين السلك والمجال</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>كثافة الفيض المغناطيسي ‎B‎، التسلا ‎T‎، ‎F = BIL sinθ‎، الزاوية بين السلك والمجال، ‎T = N A⁻¹ m⁻¹‎.</p>", "<p>يسأل المعلم: «قلنا إن القوة تزداد بزيادة التيار والطول وشدة المجال؛ كيف نجمع هذا في معادلة واحدة؟ وما وحدة شدة المجال المغناطيسي؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يقترحون ‎F ∝ BIL‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يعرّف ‎B‎ والتسلا ويشرح ‎F = BIL sinθ‎ مع التنبيه إلى خطأ استخدام ‎cosθ‎</td><td>يكتبون التعريف ويحسبون أمثلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل بزوايا مختلفة</td><td>يحلون في أزواج ويحددون θ بدقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير السؤال المفصلي (سلك كتلته لكل وحدة طول ‎10 g/m‎ بزاوية ‎45°‎) ثم التقويم الختامي</td><td>يجيبون ويناقشون الخيارات الخاطئة</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف التسلا.</td><td>كثافة الفيض التي تؤثر بقوة ‎1 N‎ على سلك طوله ‎1 m‎ يحمل تيارًا ‎1 A‎ موضوع عموديًا على المجال.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب القوة على سلك طوله ‎0.050 m‎ يحمل ‎3.0 A‎ عموديًا على مجال ‎0.20 T‎.</td><td>‎F = 0.20 × 3.0 × 0.050 = 0.030 N‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب القوة إذا كانت الزاوية بين السلك والمجال ‎30°‎.</td><td>‎F = 0.030 × sin 30° = 0.015 N‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وحدة كثافة الفيض المغناطيسي؟</td><td>التسلا ‎(T)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الزاوية θ في المعادلة ‎F = BIL sinθ‎؟</td><td>الزاوية بين السلك (اتجاه التيار) واتجاه المجال.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎B‎ إذا أثرت قوة ‎0.020 N‎ على سلك طوله ‎0.10 m‎ يحمل ‎2.0 A‎ عموديًا على المجال.</td><td>‎B = 0.10 T‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 5-3 وحل مسائل ‎F = BIL sinθ‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في تحديد الزاوية بين السلك والمجال</p>"]}, {"axis": "التسلاميتر (مسبار هول) واستخدامه ونشاط 5-2", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "كثافة الفيض المغناطيسي"], ["الحصة", "2 من 2"], ["محور الحصة", "التسلاميتر (مسبار هول) واستخدامه ونشاط 5-2"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "الموضوع 5-3 + كتاب التجارب ص 137"], ["دليل المعلم", "ص 146–151"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-2: القوة المؤثرة على سلك يسري فيه تيار كهربائي ص 137"]], "t": ["1. يصف استخدام التسلاميتر (مسبار هول) لقياس كثافة الفيض المغناطيسي\n2. يحل نشاط 5-2 «القوة المؤثرة على سلك يسري فيه تيار كهربائي»\nمخرج تعليمي آخر: يستقصي تغير ‎B‎ داخل ملف لولبي أو قرب مغناطيس باستخدام التسلاميتر أو تطبيق هاتف", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: تسلاميتر أو تطبيق مستشعر مغناطيسي في الهاتف، مغناطيسات، ملف لولبي، كتاب التجارب العملية والأنشطة", "التسلاميتر، مسبار هول، توجيه المسبار عموديًا على المجال، معايرة الصفر، قياس ‎B‎.", "يعرض المعلم تطبيق مستشعر المجال المغناطيسي على الهاتف ويقرّب منه مغناطيسًا، ويسأل: «كيف يقيس الهاتف المجال المغناطيسي؟ ولماذا تتغير القراءة بتدوير الهاتف؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض التطبيق ويطرح السؤال\nالطالب: يلاحظون اعتماد القراءة على الاتجاه\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «التسلاميتر (مسبار هول) واستخدامه»: التوجيه ومعايرة الصفر وأخذ القراءات\nالطالب: يقيسون ‎B‎ عند أبعاد مختلفة من مغناطيس أو داخل ملف\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 5-2 (ص 137) والأسئلة 4–12 المختارة\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كيف يُوجَّه مسبار هول للحصول على أكبر قراءة؟\n   الإجابة النموذجية: بحيث يكون سطح المسبار عموديًا على خطوط المجال.\n2) (المستوى المتوقع) السؤال: لماذا يُضبط التسلاميتر على الصفر بعيدًا عن المغناطيسات؟\n   الإجابة النموذجية: لإلغاء أثر المجال المغناطيسي الأرضي والمجالات المحيطة.\n3) (المستوى المتقدم) السؤال: كيف تتغير قراءة ‎B‎ بالابتعاد عن المغناطيس؟\n   الإجابة النموذجية: تتناقص.", "1) (مستوى الدعم) السؤال: ما الجهاز المستخدم لقياس كثافة الفيض المغناطيسي؟\n   الإجابة النموذجية: التسلاميتر (مسبار هول).\n2) (المستوى المتوقع) السؤال: ماذا يحدث للقراءة إذا دُوّر المسبار ليصبح موازيًا للمجال؟\n   الإجابة النموذجية: تقترب من الصفر.\n3) (المستوى المتقدم) السؤال: لماذا تختلف القراءات أحيانًا عند تكرار القياس في الموضع نفسه؟\n   الإجابة النموذجية: لعدم ثبات توجيه المسبار تمامًا أو تغير موضعه قليلًا أو وجود مصادر مغناطيسية قريبة.", "إرشاد للطالب: إكمال نشاط 5-2 ص 137 والأسئلة 4–12\nإرشاد لولي الأمر: يمكن للابن استكشاف مستشعر المجال المغناطيسي في الهاتف بإشراف ولي الأمر"], "h": ["<ol class=\"ol\"><li>يصف استخدام التسلاميتر (مسبار هول) لقياس كثافة الفيض المغناطيسي</li><li>يحل نشاط 5-2 «القوة المؤثرة على سلك يسري فيه تيار كهربائي»</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستقصي تغير ‎B‎ داخل ملف لولبي أو قرب مغناطيس باستخدام التسلاميتر أو تطبيق هاتف</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف استخدام التسلاميتر (مسبار هول) لقياس كثافة الفيض المغناطيسي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 5-2 «القوة المؤثرة على سلك يسري فيه تيار كهربائي»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستقصي تغير ‎B‎ داخل ملف لولبي أو قرب مغناطيس باستخدام التسلاميتر أو تطبيق هاتف</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: تسلاميتر أو تطبيق مستشعر مغناطيسي في الهاتف، مغناطيسات، ملف لولبي، كتاب التجارب العملية والأنشطة</span></div>", "<p>التسلاميتر، مسبار هول، توجيه المسبار عموديًا على المجال، معايرة الصفر، قياس ‎B‎.</p>", "<p>يعرض المعلم تطبيق مستشعر المجال المغناطيسي على الهاتف ويقرّب منه مغناطيسًا، ويسأل: «كيف يقيس الهاتف المجال المغناطيسي؟ ولماذا تتغير القراءة بتدوير الهاتف؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يعرض التطبيق ويطرح السؤال</td><td>يلاحظون اعتماد القراءة على الاتجاه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ «التسلاميتر (مسب
