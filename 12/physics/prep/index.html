pacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي (شبكة مقاومات) ثم يختم بمسابقة المجموعات، والطلبة يجيبون ويتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا قد يقل مجموع فروق الجهد المقيسة قليلًا عن القوة الدافعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بسبب الجهد المفقود في المقاومة الداخلية للبطارية وفي الأسلاك.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف يُوصل الفولتميتر لقياس فرق الجهد عبر مقاومة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على التوازي معها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيست فروق الجهد ‎3.1 V‎ و‎2.8 V‎ في مسار بطاريته ‎6.0 V‎. ما الجهد المفقود؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎6.0 − 5.9 = 0.1 V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الذي تتحقق منه هذه التجربة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: القانون الثاني لكيرشوف (حفظ الطاقة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يفضل الفولتميتر الرقمي عالي المقاومة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كي لا يسحب تيارًا يذكر فلا يغير الدائرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تعديلًا يقلل الفرق بين المجموع والقوة الدافعة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: استخدام أسلاك قصيرة سميكة ومصدر مقاومته الداخلية صغيرة، أو قياس فرق الجهد بين طرفي البطارية أثناء مرور التيار بدل قوتها الدافعة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير التحقق العملي وإكمال نشاط 3-7 ص 84 والأسئلة 16–23<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على تقريره ومناقشة أسباب الفروق<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}]}, {"title": "الدوائر العملية", "sb": "الموضوع 3-5 (الأسئلة 24–31)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "المقاومة الداخلية والجهد المفقود", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "1 من 3"], ["محور الحصة", "المقاومة الداخلية والجهد المفقود"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 (الأسئلة 24–31)"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه\n2. يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود\nمخرج تعليمي آخر: يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني", "1. فهم: يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه\n2. تطبيق: يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود\n3. تحليل (مخرج آخر): يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: خلية جافة، مقاومة متغيرة، أميتر، فولتميتر، أسلاك", "القوة الدافعة الكهربائية ‎E‎، المقاومة الداخلية ‎r‎، فرق الجهد بين الطرفين ‎V‎، الجهد المفقود ‎Ir‎، ‎E = V + Ir‎، التمثيل البياني ‎V‎ مقابل ‎I‎.", "يسأل المعلم: «لماذا تخفت أضواء السيارة لحظة تشغيل المحرك؟» ويذكّر بأن بادئ الحركة يسحب تيارًا كبيرًا (فكرة التمهيد).", "1. يطرح المعلم السؤال، والطلبة يقترحون انخفاض فرق الجهد عند سحب تيار كبير (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يشرح المعلم المقاومة الداخلية و‎E = I(R + r)‎ والجهد المفقود، والطلبة يحلون مثالًا لحساب ‎I‎ و‎V‎ (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الاستراتيجيتان: الاستقصاء العملي، التعلم بالاكتشاف: ينفذ «استقصاء شدة التيار الكهربائي في خلية جافة وفرق الجهد بين طرفيها»، والطلبة يسجلون قراءات ‎V‎ و‎I‎ ويرسمون ‎V‎ مقابل ‎I‎ ويستنتجون ‎E‎ من المقطع و‎r‎ من الميل (15 دقيقة)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. مستوى المعرفة: اكتب العلاقة بين ‎E‎ و‎V‎ و‎r‎.\n• الإجابة النموذجية: ‎E = V + Ir‎\n\n2. مستوى التطبيق: بطارية ‎E = 6.0 V‎ و‎r = 0.50 Ω‎ موصولة بمقاومة 2.5 Ω. احسب التيار وفرق الجهد بين طرفيها.\n• الإجابة النموذجية: ‎I = 6.0 ÷ 3.0 = 2.0 A‎؛ ‎V = 2.0 × 2.5 = 5.0 V‎.\n\n3. مستوى الاستدلال: ماذا يمثل الجزء المقطوع من المحور الرأسي وميل خط ‎V‎ مقابل ‎I‎؟\n• الإجابة النموذجية: المقطع يمثل ‎E‎، والميل يمثل ‎−r‎.", "1. مستوى المعرفة: ما الجهد المفقود؟\n• الإجابة النموذجية: فرق الجهد عبر المقاومة الداخلية ‎(Ir)‎ الذي لا يصل إلى الدائرة الخارجية.\n\n2. مستوى التطبيق: متى يساوي فرق الجهد بين طرفي البطارية قوتها الدافعة؟\n• الإجابة النموذجية: عندما لا يمر تيار ‎(I = 0)‎.\n\n3. مستوى الاستدلال: لماذا تخفت أضواء السيارة عند تشغيل المحرك؟\n• الإجابة النموذجية: لأن بادئ الحركة يسحب تيارًا كبيرًا فيزداد الجهد المفقود ‎Ir‎ وينخفض فرق الجهد بين طرفي البطارية.", "إرشاد للطالب: مراجعة الموضوع 3-5 وكتابة تقرير الاستقصاء مع التمثيل البياني\nإرشاد لولي الأمر: الحديث مع الابن عن سبب خفوت الأضواء عند تشغيل محرك السيارة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14"], "h": ["<ol class=\"ol\"><li>يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه<\/li><li>يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: خلية جافة، مقاومة متغيرة، أميتر، فولتميتر، أسلاك<\/span><\/div>", "<p>القوة الدافعة الكهربائية ‎E‎، المقاومة الداخلية ‎r‎، فرق الجهد بين الطرفين ‎V‎، الجهد المفقود ‎Ir‎، ‎E = V + Ir‎، التمثيل البياني ‎V‎ مقابل ‎I‎.<\/p>", "<p>يسأل المعلم: «لماذا تخفت أضواء السيارة لحظة تشغيل المحرك؟» ويذكّر بأن بادئ الحركة يسحب تيارًا كبيرًا (فكرة التمهيد).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون انخفاض فرق الجهد عند سحب تيار كبير (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم المقاومة الداخلية و‎E = I(R + r)‎ والجهد المفقود، والطلبة يحلون مثالًا لحساب ‎I‎ و‎V‎ (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> الاستراتيجيتان: الاستقصاء العملي، التعلم بالاكتشاف: ينفذ «استقصاء شدة التيار الكهربائي في خلية جافة وفرق الجهد بين طرفيها»، والطلبة يسجلون قراءات ‎V‎ و‎I‎ ويرسمون ‎V‎ مقابل ‎I‎ ويستنتجون ‎E‎ من المقطع و‎r‎ من الميل (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب العلاقة بين ‎E‎ و‎V‎ و‎r‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = V + Ir‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> بطارية ‎E = 6.0 V‎ و‎r = 0.50 Ω‎ موصولة بمقاومة 2.5 Ω. احسب التيار وفرق الجهد بين طرفيها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I = 6.0 ÷ 3.0 = 2.0 A‎؛ ‎V = 2.0 × 2.5 = 5.0 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يمثل الجزء المقطوع من المحور الرأسي وميل خط ‎V‎ مقابل ‎I‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المقطع يمثل ‎E‎، والميل يمثل ‎−r‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الجهد المفقود؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فرق الجهد عبر المقاومة الداخلية ‎(Ir)‎ الذي لا يصل إلى الدائرة الخارجية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> متى يساوي فرق الجهد بين طرفي البطارية قوتها الدافعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عندما لا يمر تيار ‎(I = 0)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تخفت أضواء السيارة عند تشغيل المحرك؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن بادئ الحركة يسحب تيارًا كبيرًا فيزداد الجهد المفقود ‎Ir‎ وينخفض فرق الجهد بين طرفي البطارية.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-5 وكتابة تقرير الاستقصاء مع التمثيل البياني<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن سبب خفوت الأضواء عند تشغيل محرك السيارة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14<\/p>"]}, {"axis": "مجزئ الجهد الكهربائي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "2 من 3"], ["محور الحصة", "مجزئ الجهد الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 (الأسئلة 24–31)"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎\n2. يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب\nمخرج تعليمي آخر: يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة", "1. تطبيق: يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎\n2. تحليل: يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب\n3. إبداع (مخرج آخر): يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة", "- التعلم بالاكتشاف\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- أخرى: مقاومات، مقاومة متغيرة، مقاومة ضوئية ‎LDR‎، فولتميتر، كتاب التجارب العملية والأنشطة", "مجزئ الجهد، ‎Vout‎، نسبة المقاومات، المقاومة الضوئية ‎LDR‎، الثرمستور، المستشعرات.", "يسأل المعلم: «لدينا بطارية ‎12 V‎ وجهاز يحتاج ‎4 V‎ فقط؛ كيف نحصل على ‎4 V‎ دون بطارية جديدة؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون تقسيم الجهد بمقاومتين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم مجزئ الجهد والعلاقة ويحل مثالًا، والطلبة يحسبون ‎Vout‎ لنسب مختلفة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. ينفذ المعلم «استقصاء دائرة مجزئ جهد كهربائي» ويوجه حل نشاط 3-10 (ص 94)، والطلبة يبنون الدائرة ويقيسون ويقارنون ويحلون النشاط (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم السؤال المفصلي (مجزئ ببطارية ‎6.0 V‎) ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "1. مستوى المعرفة: احسب ‎Vout‎ عبر ‎R₂ = 2.0 kΩ‎ في مجزئ مع ‎R₁ = 4.0 kΩ‎ و‎Vin = 12 V‎.\n• الإجابة النموذجية: ‎Vout = 12 × 2.0 ÷ 6.0 = 4.0 V‎.\n\n2. مستوى التطبيق: ماذا يحدث لـ ‎Vout‎ عبر ‎LDR‎ في مجزئ جهد عند زيادة الإضاءة؟\n• الإجابة النموذجية: تقل مقاومة ‎LDR‎ فيقل فرق الجهد عبرها.\n\n3. مستوى الاستدلال: كيف تحصل على ‎Vout‎ متغير باستمرار من 0 إلى ‎Vin‎؟\n• الإجابة النموذجية: باستخدام مقاومة متغيرة ذات ثلاثة أطراف (مجزئ جهد منزلق).", "1. مستوى المعرفة: اكتب علاقة مجزئ الجهد.\n• الإجابة النموذجية: ‎Vout = R₂Vin/(R₁ + R₂)‎\n\n2. مستوى التطبيق: مجزئ جهد بمقاومتين متساويتين و‎9.0 V‎؛ ما ‎Vout‎؟\n• الإجابة النموذجية: ‎4.5 V‎.\n\n3. مستوى الاستدلال: صمم مجزئ جهد يشغل جرسًا عند حلول الظلام، وحدد موضع ‎LDR‎.\n• الإجابة النموذجية: ‎LDR‎ في موضع ‎R₂ (‎عند المخرج)؛ في الظلام تزداد مقاومتها فيرتفع ‎Vout‎ ويشغل الجرس.", "إرشاد للطالب: إكمال نشاط 3-10 ص 94 ورسم دائرة مجزئ جهد بمستشعر\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن الإنارة التلقائية لأعمدة الشوارع\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14"], "h": ["<ol class=\"ol\"><li>يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎<\/li><li>يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على المشاريع<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: مقاومات، مقاومة متغيرة، مقاومة ضوئية ‎LDR‎، فولتميتر، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مجزئ الجهد، ‎Vout‎، نسبة المقاومات، المقاومة الضوئية ‎LDR‎، الثرمستور، المستشعرات.<\/p>", "<p>يسأل المعلم: «لدينا بطارية ‎12 V‎ وجهاز يحتاج ‎4 V‎ فقط؛ كيف نحصل على ‎4 V‎ دون بطارية جديدة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون تقسيم الجهد بمقاومتين (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم مجزئ الجهد والعلاقة ويحل مثالًا، والطلبة يحسبون ‎Vout‎ لنسب مختلفة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على المشاريع.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم «استقصاء دائرة مجزئ جهد كهربائي» ويوجه حل نشاط 3-10 (ص 94)، والطلبة يبنون الدائرة ويقيسون ويقارنون ويحلون النشاط (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي (مجزئ ببطارية ‎6.0 V‎) ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على المشاريع.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎Vout‎ عبر ‎R₂ = 2.0 kΩ‎ في مجزئ مع ‎R₁ = 4.0 kΩ‎ و‎Vin = 12 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Vout = 12 × 2.0 ÷ 6.0 = 4.0 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لـ ‎Vout‎ عبر ‎LDR‎ في مجزئ جهد عند زيادة الإضاءة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل مقاومة ‎LDR‎ فيقل فرق الجهد عبرها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تحصل على ‎Vout‎ متغير باستمرار من 0 إلى ‎Vin‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: باستخدام مقاومة متغيرة ذات ثلاثة أطراف (مجزئ جهد منزلق).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب علاقة مجزئ الجهد.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Vout = R₂Vin/(R₁ + R₂)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> مجزئ جهد بمقاومتين متساويتين و‎9.0 V‎؛ ما ‎Vout‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4.5 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صمم مجزئ جهد يشغل جرسًا عند حلول الظلام، وحدد موضع ‎LDR‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎LDR‎ في موضع ‎R₂ (‎عند المخرج)؛ في الظلام تزداد مقاومتها فيرتفع ‎Vout‎ ويشغل الجرس.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-10 ص 94 ورسم دائرة مجزئ جهد بمستشعر<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن الحديث مع الابن عن الإنارة التلقائية لأعمدة الشوارع<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14<\/p>"]}, {"axis": "مقياس الجهد والطريقة الصفرية ومراجعة الوحدة الثالثة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "3 من 3"], ["محور الحصة", "مقياس الجهد والطريقة الصفرية ومراجعة الوحدة الثالثة"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 + كتاب التجارب ص 87 و90 و97"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه\n2. يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)\nمخرج تعليمي آخر: يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة", "1. تطبيق: يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه\n2. فهم: يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)\n3. تطبيق (مخرج آخر): يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: سلك مقياس جهد، جلفانوميتر، خلايا، كتاب التجارب العملية والأنشطة", "مقياس الجهد، سلك منتظم، طول الاتزان، الجلفانوميتر، الطريقة الصفرية، مقارنة القوى الدافعة ‎E₁/E₂ = L₁/L₂‎.", "يسأل المعلم: «الفولتميتر يسحب تيارًا ولو صغيرًا فيغير ما يقيسه؛ هل يمكن قياس قوة دافعة لخلية دون سحب أي تيار منها؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون موازنة الخلية بجهد آخر (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «استخدام مجزئ الجهد لمقارنة القوة الدافعة الكهربائية للخلايا» ويشرح الطريقة الصفرية، والطلبة يحسبون ‎E₂‎ من أطوال الاتزان (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يوجه المعلم حل نشاطي 3-8 و3-9 (ص 87 و90) ونشاط 3-11 (ص 97) وأسئلة مختارة، والطلبة يحلون في مجموعات ويعرضون (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يختم المعلم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي، والطلبة يتنافسون ثم يقيّمون أنفسهم (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: ماذا يعني أن قراءة الجلفانوميتر صفر عند نقطة الاتزان؟\n• الإجابة النموذجية: لا يمر تيار في الخلية المقيسة، فيكون فرق الجهد عبر طول الاتزان مساويًا لقوتها الدافعة.\n\n2. مستوى التطبيق: خلية ‎E₁ = 1.5 V‎ طول اتزانها ‎60.0 cm‎، وخلية أخرى طول اتزانها ‎48.0 cm‎. احسب ‎E₂‎.\n• الإجابة النموذجية: ‎E₂ = 1.5 × 48.0 ÷ 60.0 = 1.2 V‎.\n\n3. مستوى الاستدلال: لماذا يجب أن يكون سلك مقياس الجهد منتظم المقطع؟\n• الإجابة النموذجية: ليكون فرق الجهد متناسبًا طرديًا مع الطول.", "1. مستوى المعرفة: ما ميزة الطريقة الصفرية؟\n• الإجابة النموذجية: لا يُسحب تيار من الخلية المقيسة، فيُقاس فرق الجهد بدقة دون تأثر بالمقاومة الداخلية.\n\n2. مستوى التطبيق: ما الجهاز الذي يكشف انعدام التيار؟\n• الإجابة النموذجية: الجلفانوميتر.\n\n3. مستوى الاستدلال: لماذا يكون مقياس الجهد أدق من الفولتميتر العادي في قياس ‎e.m.f‎.؟\n• الإجابة النموذجية: لأنه لا يسحب تيارًا عند الاتزان فلا يوجد جهد مفقود، بينما يسحب الفولتميتر تيارًا صغيرًا.", "إرشاد للطالب: إكمال نشاطي 3-8 و3-9 وأسئلة نهاية الوحدة الثالثة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14"], "h": ["<ol class=\"ol\"><li>يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه<\/li><li>يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: سلك مقياس جهد، جلفانوميتر، خلايا، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مقياس الجهد، سلك منتظم، طول الاتزان، الجلفانوميتر، الطريقة الصفرية، مقارنة القوى الدافعة ‎E₁/E₂ = L₁/L₂‎.<\/p>", "<p>يسأل المعلم: «الفولتميتر يسحب تيارًا ولو صغيرًا فيغير ما يقيسه؛ هل يمكن قياس قوة دافعة لخلية دون سحب أي تيار منها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون موازنة الخلية بجهد آخر (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «استخدام مجزئ الجهد لمقارنة القوة الدافعة الكهربائية للخلايا» ويشرح الطريقة الصفرية، والطلبة يحسبون ‎E₂‎ من أطوال الاتزان (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاطي 3-8 و3-9 (ص 87 و90) ونشاط 3-11 (ص 97) وأسئلة مختارة، والطلبة يحلون في مجموعات ويعرضون (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي، والطلبة يتنافسون ثم يقيّمون أنفسهم (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يعني أن قراءة الجلفانوميتر صفر عند نقطة الاتزان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا يمر تيار في الخلية المقيسة، فيكون فرق الجهد عبر طول الاتزان مساويًا لقوتها الدافعة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> خلية ‎E₁ = 1.5 V‎ طول اتزانها ‎60.0 cm‎، وخلية أخرى طول اتزانها ‎48.0 cm‎. احسب ‎E₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E₂ = 1.5 × 48.0 ÷ 60.0 = 1.2 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يجب أن يكون سلك مقياس الجهد منتظم المقطع؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ليكون فرق الجهد متناسبًا طرديًا مع الطول.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ميزة الطريقة الصفرية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا يُسحب تيار من الخلية المقيسة، فيُقاس فرق الجهد بدقة دون تأثر بالمقاومة الداخلية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الجهاز الذي يكشف انعدام التيار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجلفانوميتر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون مقياس الجهد أدق من الفولتميتر العادي في قياس ‎e.m.f‎.؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه لا يسحب تيارًا عند الاتزان فلا يوجد جهد مفقود، بينما يسحب الفولتميتر تيارًا صغيرًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 3-8 و3-9 وأسئلة نهاية الوحدة الثالثة وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14<\/p>"]}]}, {"title": "التعرف على المكثفات", "sb": "الموضوع 4-1 (الأسئلة 1–10)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "المكثف وتعريف السعة ‎C = Q/V‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "التعرف على المكثفات"], ["الحصة", "1 من 2"], ["محور الحصة", "المكثف وتعريف السعة ‎C = Q/V‎"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 4-1 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: الشحنة الكهربائية وفرق الجهد الكهربائي والسعة ص 110"]], "t": ["1. يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح\n2. يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد\nمخرج تعليمي آخر: يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)", "1. تذكر: يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح\n2. تطبيق: يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد\n3. فهم (مخرج آخر): يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مكثفات متنوعة للعرض", "المكثف، اللوحان المتوازيان، العازل، السعة ‎C‎، الفاراد ‎F‎، الميكروفاراد μ‎F‎، ‎C = Q/V‎، الشحنة على كل لوح.", "يعرض المعلم مكثفات مختلفة الأحجام من أجهزة إلكترونية قديمة ويسأل: «ما وظيفة هذه المكونات؟ وكيف يخزن جهاز طاقة دون تفاعل كيميائي كالبطارية؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1. يعرض المعلم المكثفات ويطرح السؤال ومهام بداية الوحدة، والطلبة يقترحون أنها تخزن شحنة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم تركيب المكثف متوازي الألواح وكيفية شحنه وتعريف السعة ووحدتها، والطلبة يرسمون المكثف ويكتبون التعريف والوحدة (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدم المعلم مسائل ‎C = Q/V‎ بوحدات متنوعة (‎μF‎، ‎nF‎، ‎pF‎)، والطلبة يحلون في أزواج مع تحويل الوحدات (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: عرّف سعة المكثف.\n• الإجابة النموذجية: الشحنة المخزنة على أحد اللوحين لكل وحدة فرق جهد بين اللوحين.\n\n2. مستوى التطبيق: احسب الشحنة على مكثف ‎470 μF‎ مشحون إلى ‎12 V‎.\n• الإجابة النموذجية: ‎Q = 470 × 10⁻⁶ × 12 = 5.6 × 10⁻³ C‎.\n\n3. مستوى الاستدلال: لماذا تكون الشحنة الكلية على المكثف المشحون صفرًا؟\n• الإجابة النموذجية: لأن اللوحين يحملان شحنتين متساويتين ومتعاكستين (‎+Q‎ وـ‎Q‎).", "1. مستوى المعرفة: ما وحدة السعة؟\n• الإجابة النموذجية: الفاراد ‎(F) = C/V‎.\n\n2. مستوى التطبيق: احسب فرق الجهد عبر مكثف ‎2.0 μF‎ يحمل ‎6.0 × 10⁻⁵ C‎.\n• الإجابة النموذجية: ‎V = 30 V‎.\n\n3. مستوى الاستدلال: لماذا يُعد الفاراد وحدة كبيرة جدًا عمليًا؟\n• الإجابة النموذجية: لأن مكثفًا سعته ‎1 F‎ عند جهد صغير يخزن شحنة كبيرة جدًا، والمكثفات الشائعة سعتها ميكروفاراد أو أقل.", "إرشاد للطالب: مراجعة الموضوع 4-1 وحل مسائل ‎C = Q/V‎\nإرشاد لولي الأمر: الحديث مع الابن عن المكثفات في الأجهزة الإلكترونية المنزلية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15"], "h": ["<ol class=\"ol\"><li>يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح<\/li><li>يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: مكثفات متنوعة للعرض<\/span><\/div>", "<p>المكثف، اللوحان المتوازيان، العازل، السعة ‎C‎، الفاراد ‎F‎، الميكروفاراد μ‎F‎، ‎C = Q/V‎، الشحنة على كل لوح.<\/p>", "<p>يعرض المعلم مكثفات مختلفة الأحجام من أجهزة إلكترونية قديمة ويسأل: «ما وظيفة هذه المكونات؟ وكيف يخزن جهاز طاقة دون تفاعل كيميائي كالبطارية؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المكثفات ويطرح السؤال ومهام بداية الوحدة، والطلبة يقترحون أنها تخزن شحنة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تركيب المكثف متوازي الألواح وكيفية شحنه وتعريف السعة ووحدتها، والطلبة يرسمون المكثف ويكتبون التعريف والوحدة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل ‎C = Q/V‎ بوحدات متنوعة (‎μF‎، ‎nF‎، ‎pF‎)، والطلبة يحلون في أزواج مع تحويل الوحدات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف سعة المكثف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الشحنة المخزنة على أحد اللوحين لكل وحدة فرق جهد بين اللوحين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الشحنة على مكثف ‎470 μF‎ مشحون إلى ‎12 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 470 × 10⁻⁶ × 12 = 5.6 × 10⁻³ C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تكون الشحنة الكلية على المكثف المشحون صفرًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن اللوحين يحملان شحنتين متساويتين ومتعاكستين (‎+Q‎ وـ‎Q‎).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة السعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الفاراد ‎(F) = C/V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب فرق الجهد عبر مكثف ‎2.0 μF‎ يحمل ‎6.0 × 10⁻⁵ C‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = 30 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يُعد الفاراد وحدة كبيرة جدًا عمليًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن مكثفًا سعته ‎1 F‎ عند جهد صغير يخزن شحنة كبيرة جدًا، والمكثفات الشائعة سعتها ميكروفاراد أو أقل.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-1 وحل مسائل ‎C = Q/V‎<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن المكثفات في الأجهزة الإلكترونية المنزلية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15<\/p>"]}, {"axis": "العلاقة بين الشحنة وفرق الجهد ونشاط 4-1", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "التعرف على المكثفات"], ["الحصة", "2 من 2"], ["محور الحصة", "العلاقة بين الشحنة وفرق الجهد ونشاط 4-1"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 4-1 + كتاب التجارب ص 110"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: الشحنة الكهربائية وفرق الجهد الكهربائي والسعة ص 110"]], "t": ["1. يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا\n2. يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎\nمخرج تعليمي آخر: يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»", "1. تحليل: يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا\n2. تطبيق: يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎\n3. تطبيق (مخرج آخر): يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: مكثف، مصدر تيار ثابت أو بيانات نموذجية، فولتميتر، ساعة إيقاف، كتاب التجارب العملية والأنشطة", "الشحن بتيار ثابت، ‎Q = It‎، تمثيل ‎Q‎ مقابل ‎V‎، الخط المستقيم المار بالأصل، الميل = ‎C‎.", "يسأل المعلم: «لو شحنّا مكثفًا بتيار ثابت، كيف يتغير فرق الجهد بين طرفيه مع الزمن؟» ويطلب رسمًا تنبؤيًا.", "1. يطرح المعلم السؤال، والطلبة يرسمون تنبؤًا خطيًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف: ينفذ «العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه» بتيار ثابت أو بيانات نموذجية، والطلبة يحسبون ‎Q = It‎ ويرسمون ‎Q‎ مقابل ‎V‎ ويحسبون الميل (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 4-1 (ص 110)، والطلبة يحلون في أزواج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يختم المعلم بمسابقة المجموعات على السعة، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: كيف تُحسب الشحنة عند الشحن بتيار ثابت؟\n• الإجابة النموذجية: ‎Q = It‎.\n\n2. مستوى التطبيق: ماذا يمثل ميل خط ‎Q‎ مقابل ‎V‎؟\n• الإجابة النموذجية: سعة المكثف ‎C‎.\n\n3. مستوى الاستدلال: شُحن مكثف بتيار ‎20 μA‎ مدة ‎50 s‎ فأصبح فرق الجهد ‎5.0 V‎. احسب ‎C‎.\n• الإجابة النموذجية: ‎Q = 1.0 × 10⁻³ C‎؛ ‎C = 2.0 × 10⁻⁴ F = 200 μF‎.", "1. مستوى المعرفة: ما شكل تمثيل ‎Q‎ مقابل ‎V‎ لمكثف؟\n• الإجابة النموذجية: خط مستقيم يمر بالأصل.\n\n2. مستوى التطبيق: ماذا يعني مرور الخط بالأصل؟\n• الإجابة النموذجية: أن ‎Q‎ تتناسب طرديًا مع ‎V‎.\n\n3. مستوى الاستدلال: اقترح سببًا لانحراف القراءات عن الخط المستقيم عند الجهود العالية في التجربة.\n• الإجابة النموذجية: تسرب الشحنة عبر العازل أو صعوبة الحفاظ على تيار ثابت تمامًا.", "إرشاد للطالب: إكمال نشاط 4-1 ص 110 ورسم ‎Q‎ مقابل ‎V‎\nإرشاد لولي الأمر: متابعة الابن في حساب الميل من الرسم بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15"], "h": ["<ol class=\"ol\"><li>يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا<\/li><li>يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed  المعلم مسائل حساب الطاقة من تمثيلات بيانية، والطلبة يحسبون الطاقة من المساحات في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: لماذا تُحسب الطاقة من المساحة تحت منحنى ‎V–Q‎؟\n• الإجابة النموذجية: لأن الشغل لنقل شحنة صغيرة ‎ΔQ‎ يساوي ‎VΔQ‎، ومجموع هذه الشرائح يساوي المساحة.\n\n2. مستوى التطبيق: احسب الطاقة المخزنة إذا كانت ‎Q = 4.0 mC‎ عند ‎V = 6.0 V‎.\n• الإجابة النموذجية: ‎W = ½ × 4.0 × 10⁻³ × 6.0 = 0.012 J‎.\n\n3. مستوى الاستدلال: لماذا لا تساوي الطاقة ‎QV‎؟\n• الإجابة النموذجية: لأن فرق الجهد يزداد تدريجيًا من صفر إلى ‎V‎ أثناء الشحن، فالمتوسط ½‎V‎.", "1. مستوى المعرفة: ما الشكل الهندسي تحت منحنى ‎V–Q‎ لمكثف؟\n• الإجابة النموذجية: مثلث قائم.\n\n2. مستوى التطبيق: إذا تضاعف فرق الجهد لمكثف ما، فكيف تتغير الطاقة؟\n• الإجابة النموذجية: تصبح أربعة أضعاف (لأن ‎Q‎ تتضاعف أيضًا).\n\n3. مستوى الاستدلال: لماذا يبذل المصدر شغلًا ‎QV‎ بينما يخزن المكثف ½‎QV‎ فقط؟\n• الإجابة النموذجية: يتحول النصف الآخر إلى طاقة حرارية في مقاومات الدائرة أثناء الشحن.", "إرشاد للطالب: مراجعة الموضوع 4-2 ورسم منحنى ‎V–Q‎ وحساب المساحة\nإرشاد لولي الأمر: الحديث مع الابن عن وميض الكاميرا بوصفه تطبيقًا للمكثفات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16"], "h": ["<ol class=\"ol\"><li>يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)<\/li><li>يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: مكثف كبير السعة ومصباح صغير للعرض<\/span><\/div>", "<p>الطاقة المخزنة ‎W‎، المساحة تحت منحنى ‎V–Q‎، المثلث، ‎W = ½QV‎، الشغل المبذول في الشحن.<\/p>", "<p>يشحن المعلم مكثفًا كبيرًا ثم يفرغه عبر مصباح صغير يومض، ويسأل: «من أين جاءت طاقة الوميض؟ وكيف نحسبها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يقترحون أنها طاقة مخزنة في المكثف (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «الطاقة المخزنة في مكثف مشحون» ويشتق ‎W = ½QV‎ من المساحة تحت منحنى ‎V–Q‎، والطلبة يرسمون المنحنى ويحسبون مساحة المثلث (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب الطاقة من تمثيلات بيانية، والطلبة يحسبون الطاقة من المساحات في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تُحسب الطاقة من المساحة تحت منحنى ‎V–Q‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الشغل لنقل شحنة صغيرة ‎ΔQ‎ يساوي ‎VΔQ‎، ومجموع هذه الشرائح يساوي المساحة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الطاقة المخزنة إذا كانت ‎Q = 4.0 mC‎ عند ‎V = 6.0 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = ½ × 4.0 × 10⁻³ × 6.0 = 0.012 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تساوي الطاقة ‎QV‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن فرق الجهد يزداد تدريجيًا من صفر إلى ‎V‎ أثناء الشحن، فالمتوسط ½‎V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الشكل الهندسي تحت منحنى ‎V–Q‎ لمكثف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: مثلث قائم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> إذا تضاعف فرق الجهد لمكثف ما، فكيف تتغير الطاقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تصبح أربعة أضعاف (لأن ‎Q‎ تتضاعف أيضًا).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يبذل المصدر شغلًا ‎QV‎ بينما يخزن المكثف ½‎QV‎ فقط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتحول النصف الآخر إلى طاقة حرارية في مقاومات الدائرة أثناء الشحن.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-2 ورسم منحنى ‎V–Q‎ وحساب المساحة<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن وميض الكاميرا بوصفه تطبيقًا للمكثفات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16<\/p>"]}, {"axis": "معادلات الطاقة المخزنة ‎W = ½QV = ½CV² = ½Q²/C‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "2 من 3"], ["محور الحصة", "معادلات الطاقة المخزنة ‎W = ½QV = ½CV² = ½Q²/C‎"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة\n2. يختار المعادلة المناسبة بحسب المعطيات\nمخرج تعليمي آخر: يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة", "1. تطبيق: يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة\n2. تحليل: يختار المعادلة المناسبة بحسب المعطيات\n3. تطبيق (مخرج آخر): يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎W = ½QV‎، ‎W = ½CV²‎، ‎W = ½Q²/C‎، اختيار المعادلة، الجول.", "يسأل المعلم: «لدينا ثلاث صيغ للطاقة؛ متى نستخدم كلًا منها؟» ويكتب ثلاث مسائل بمعطيات مختلفة.", "1. يعرض المعلم المسائل الثلاث، والطلبة يحددون المعطيات في كل منها (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشتق المعلم الصيغتين الأخريين بالتعويض عن ‎Q = CV‎ ويحل المسائل الثلاث، والطلبة يتبعون الاشتقاق والحلول (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم مسائل متنوعة للحل في مجموعات، والطلبة يحلون ويختارون الصيغة المناسبة (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب الطاقة المخزنة في مكثف ‎470 μF‎ عند ‎12 V‎.\n• الإجابة النموذجية: ‎W = ½ × 470 × 10⁻⁶ × 144 = 0.034 J‎.\n\n2. مستوى التطبيق: احسب الطاقة في مكثف ‎2.0 μF‎ يحمل ‎4.0 × 10⁻⁴ C‎.\n• الإجابة النموذجية: ‎W = ½Q²/C = ½ × 1.6 × 10⁻⁷ ÷ 2.0 × 10⁻⁶ = 0.040 J‎.\n\n3. مستوى الاستدلال: ما فرق الجهد اللازم لتخزين ‎1.0 J‎ في مكثف ‎200 μF‎؟\n• الإجابة النموذجية: ‎V = √(2W/C) = √(10⁴) = 100 V‎.", "1. مستوى المعرفة: اشتق ‎W = ½CV²‎ من ‎W = ½QV‎.\n• الإجابة النموذجية: بالتعويض ‎Q = CV: W = ½(CV)V = ½CV²‎.\n\n2. مستوى التطبيق: أي صيغة تستخدم إذا عُلمت ‎C‎ و‎V‎ فقط؟\n• الإجابة النموذجية: ‎W = ½CV²‎.\n\n3. مستوى الاستدلال: مكثفان: الأول ‎100 μF‎ عند ‎20 V‎، والثاني ‎400 μF‎ عند ‎10 V‎. أيهما يخزن طاقة أكبر؟\n• الإجابة النموذجية: الأول: ‎0.020 J‎؛ الثاني: ‎0.020 J‎؛ متساويان.", "إرشاد للطالب: حل خمس مسائل على معادلات الطاقة\nإرشاد لولي الأمر: متابعة الابن في اختيار المعادلة المناسبة للمعطيات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة<\/li><li>يختار المعادلة المناسبة بحسب المعطيات<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يختار المعادلة المناسبة بحسب المعطيات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>‎W = ½QV‎، ‎W = ½CV²‎، ‎W = ½Q²/C‎، اختيار المعادلة، الجول.<\/p>", "<p>يسأل المعلم: «لدينا ثلاث صيغ للطاقة؛ متى نستخدم كلًا منها؟» ويكتب ثلاث مسائل بمعطيات مختلفة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المسائل الثلاث، والطلبة يحددون المعطيات في كل منها (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشتق المعلم الصيغتين الأخريين بالتعويض عن ‎Q = CV‎ ويحل المسائل الثلاث، والطلبة يتبعون الاشتقاق والحلول (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل متنوعة للحل في مجموعات، والطلبة يحلون ويختارون الصيغة المناسبة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب الطاقة المخزنة في مكثف ‎470 μF‎ عند ‎12 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = ½ × 470 × 10⁻⁶ × 144 = 0.034 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الطاقة في مكثف ‎2.0 μF‎ يحمل ‎4.0 × 10⁻⁴ C‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = ½Q²/C = ½ × 1.6 × 10⁻⁷ ÷ 2.0 × 10⁻⁶ = 0.040 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما فرق الجهد اللازم لتخزين ‎1.0 J‎ في مكثف ‎200 μF‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = √(2W/C) = √(10⁴) = 100 V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اشتق ‎W = ½CV²‎ من ‎W = ½QV‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بالتعويض ‎Q = CV: W = ½(CV)V = ½CV²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أي صيغة تستخدم إذا عُلمت ‎C‎ و‎V‎ فقط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = ½CV²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> مكثفان: الأول ‎100 μF‎ عند ‎20 V‎، والثاني ‎400 μF‎ عند ‎10 V‎. أيهما يخزن طاقة أكبر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الأول: ‎0.020 J‎؛ الثاني: ‎0.020 J‎؛ متساويان.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل خمس مسائل على معادلات الطاقة<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في اختيار المعادلة المناسبة للمعطيات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16<\/p>"]}, {"axis": "نشاط 4-2 وتطبيقات المكثفات والأسئلة 1–10", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 4-2 وتطبيقات المكثفات والأسئلة 1–10"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 + كتاب التجارب ص 114"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10\n2. يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)\nمخرج تعليمي آخر: يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة", "1. تطبيق: يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10\n2. فهم: يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)\n3. تقييم (مخرج آخر): يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة", "- التعلم التشاركي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "تطبيقات المكثفات، التفريغ السريع، مزيل الرجفان، وميض الكاميرا، المقارنة بالبطاريات، كثافة الطاقة.", "يعرض المعلم صورة جهاز مزيل الرجفان في مطار أو مستشفى ويسأل: «لماذا يستخدم الجهاز مكثفًا وليس البطارية مباشرة لإيصال الصدمة؟»", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أن المكثف يفرغ طاقته بسرعة كبيرة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. يوجه المعلم حل نشاط 4-2 (ص 114) والأسئلة المتبقية من 1–10، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. يدير المعلم نقاشًا لمقارنة المكثفات بالبطاريات ويكمل الطلبة جدولًا، والطلبة يقارنون في مجموعات ويعرضون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يختم المعلم بمسابقة المجموعات على المكثفات والطاقة، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: لماذا يُستخدم المكثف في مزيل الرجفان؟\n• الإجابة النموذجية: لأنه يطلق طاقته في زمن قصير جدًا فيعطي قدرة كبيرة.\n\n2. مستوى التطبيق: احسب الطاقة في مكثف ‎32 μF‎ مشحون إلى ‎5000 V‎.\n• الإجابة النموذجية: ‎W = ½ × 32 × 10⁻⁶ × 2.5 × 10⁷ = 400 J‎.\n\n3. مستوى الاستدلال: اذكر عيبًا للمكثف مقارنة بالبطارية.\n• الإجابة النموذجية: يخزن طاقة أقل بكثير لكل وحدة كتلة، وتتناقص فولتيته أثناء التفريغ.", "1. مستوى المعرفة: اذكر تطبيقين للمكثفات في تخزين الطاقة.\n• الإجابة النموذجية: وميض الكاميرا، ومزيل الرجفان.\n\n2. مستوى التطبيق: ما ميزة المكثف في تطبيقات التفريغ السريع؟\n• الإجابة النموذجية: يطلق الطاقة بسرعة كبيرة فيعطي قدرة عالية لحظية.\n\n3. مستوى الاستدلال: إذا أطلق مكثف ‎400 J‎ خلال ‎4.0 ms‎، فما القدرة المتوسطة؟\n• الإجابة النموذجية: ‎P = 400 ÷ 4.0 × 10⁻³ = 1.0 × 10⁵ W‎.", "إرشاد للطالب: إكمال نشاط 4-2 ص 114 والأسئلة 1–10\nإرشاد لولي الأمر: الحديث مع الابن عن جهاز مزيل الرجفان وأهمية تعلم الإسعافات الأولية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16"], "h": ["<ol class=\"ol\"><li>يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10<\/li><li>يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التشاركي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>تطبيقات المكثفات، التفريغ السريع، مزيل الرجفان، وميض الكاميرا، المقارنة بالبطاريات، كثافة الطاقة.<\/p>", "<p>يعرض المعلم صورة جهاز مزيل الرجفان في مطار أو مستشفى ويسأل: «لماذا يستخدم الجهاز مكثفًا وليس البطارية مباشرة لإيصال الصدمة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أن المكثف يفرغ طاقته بسرعة كبيرة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 4-2 (ص 114) والأسئلة المتبقية من 1–10، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يدير المعلم نقاشًا لمقارنة المكثفات بالبطاريات ويكمل الطلبة جدولًا، والطلبة يقارنون في مجموعات ويعرضون (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على المكثفات والطاقة، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا يُستخدم المكثف في مزيل الرجفان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يطلق طاقته في زمن قصير جدًا فيعطي قدرة كبيرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الطاقة في مكثف ‎32 μF‎ مشحون إلى ‎5000 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = ½ × 32 × 10⁻⁶ × 2.5 × 10⁷ = 400 J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اذكر عيبًا للمكثف مقارنة بالبطارية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يخزن طاقة أقل بكثير لكل وحدة كتلة، وتتناقص فولتيته أثناء التفريغ.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر تطبيقين للمكثفات في تخزين الطاقة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: وميض الكاميرا، ومزيل الرجفان.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ميزة المكثف في تطبيقات التفريغ السريع؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يطلق الطاقة بسرعة كبيرة فيعطي قدرة عالية لحظية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا أطلق مكثف ‎400 J‎ خلال ‎4.0 ms‎، فما القدرة المتوسطة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎P = 400 ÷ 4.0 × 10⁻³ = 1.0 × 10⁵ W‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-2 ص 114 والأسئلة 1–10<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن جهاز مزيل الرجفان وأهمية تعلم الإسعافات الأولية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16<\/p>"]}]}, {"title": "توصيل المكثفات على التوازي", "sb": "الموضوع 4-3 (الأسئلة 11–20)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "استنتاج السعة المكافئة للمكثفات الموصولة على التوازي", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوازي"], ["الحصة", "1 من 2"], ["محور الحصة", "استنتاج السعة المكافئة للمكثفات الموصولة على التوازي"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-3 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎\n2. يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها\nمخرج تعليمي آخر: يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات", "1. تحليل: يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎\n2. فهم: يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها\n3. تحليل (مخرج آخر): يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: مكثفات وأسلاك ومقياس سعة (للعرض)", "التوصيل على التوازي، فرق الجهد المشترك، الشحنة الكلية ‎Q = Q₁ + Q₂‎، السعة المكافئة ‎C = C₁ + C₂‎.", "يذكّر المعلم الطلبة بنص قانوني كيرشوف ويطلب استخدامهما لاستنتاج معادلات مقاومتين على التوالي ثم على التوازي، ثم يسأل: «هل تتوقع أن تتبع المكثفات القوانين نفسها؟» (فكرة التمهيد).", "1. يراجع المعلم استنتاجات المقاومات ويطرح السؤال، والطلبة يتوقعون ويبررون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يشتق المعلم ‎C = C₁ + C₂‎ من ‎V‎ مشترك و‎Q = Q₁ + Q₂‎، والطلبة يكتبون الاستنتاج خطوة بخطوة (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يقدم المعلم مسائل حساب السعة المكافئة وشحنة كل مكثف، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: ما الكمية المشتركة بين المكثفات الموصولة على التوازي؟\n• الإجابة النموذجية: فرق الجهد.\n\n2. مستوى التطبيق: استنتج معادلة التوازي.\n• الإجابة النموذجية: ‎Q = Q₁ + Q₂ ← CV = C₁V + C₂V ← C = C₁ + C₂‎.\n\n3. مستوى الاستدلال: احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوازي.\n• الإجابة النموذجية: ‎5.0 μF‎.", "1. مستوى المعرفة: هل تزداد السعة المكافئة أم تقل بإضافة مكثف على التوازي؟\n• الإجابة النموذجية: تزداد.\n\n2. مستوى التطبيق: احسب الشحنة على كل مكثف (‎2.0 μF‎ و‎3.0 μF‎) على التوازي مع مصدر ‎12 V‎.\n• الإجابة النموذجية: ‎Q₁ = 24 μC‎، ‎Q₂ = 36 μC‎.\n\n3. مستوى الاستدلال: لماذا يشبه قانون التوازي في المكثفات قانون التوالي في المقاومات؟\n• الإجابة النموذجية: لأن السعة تُجمع مباشرة في التوازي كما تُجمع المقاومات في التوالي.", "إرشاد للطالب: مراجعة الموضوع 4-3 وكتابة استنتاج معادلة التوازي\nإرشاد لولي الأمر: متابعة الابن في التمييز بين قوانين المكثفات والمقاومات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎<\/li><li>يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: مكثفات وأسلاك ومقياس سعة (للعرض)<\/span><\/div>", "<p>التوصيل على التوازي، فرق الجهد المشترك، الشحنة الكلية ‎Q = Q₁ + Q₂‎، السعة المكافئة ‎C = C₁ + C₂‎.<\/p>", "<p>يذكّر المعلم الطلبة بنص قانوني كيرشوف ويطلب استخدامهما لاستنتاج معادلات مقاومتين على التوالي ثم على التوازي، ثم يسأل: «هل تتوقع أن تتبع المكثفات القوانين نفسها؟» (فكرة التمهيد).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يراجع المعلم استنتاجات المقاومات ويطرح السؤال، والطلبة يتوقعون ويبررون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشتق المعلم ‎C = C₁ + C₂‎ من ‎V‎ مشترك و‎Q = Q₁ + Q₂‎، والطلبة يكتبون الاستنتاج خطوة بخطوة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب السعة المكافئة وشحنة كل مكثف، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الكمية المشتركة بين المكثفات الموصولة على التوازي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فرق الجهد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> استنتج معادلة التوازي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = Q₁ + Q₂ ← CV = C₁V + C₂V ← C = C₁ + C₂‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوازي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎5.0 μF‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل تزداد السعة المكافئة أم تقل بإضافة مكثف على التوازي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تزداد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الشحنة على كل مكثف (‎2.0 μF‎ و‎3.0 μF‎) على التوازي مع مصدر ‎12 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q₁ = 24 μC‎، ‎Q₂ = 36 μC‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يشبه قانون التوازي في المكثفات قانون التوالي في المقاومات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن السعة تُجمع مباشرة في التوازي كما تُجمع المقاومات في التوالي.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-3 وكتابة استنتاج معادلة التوازي<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التمييز بين قوانين المكثفات والمقاومات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17<\/p>"]}, {"axis": "حسابات المكثفات على التوازي والطاقة المخزنة فيها", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوازي"], ["الحصة", "2 من 2"], ["محور الحصة", "حسابات المكثفات على التوازي والطاقة المخزنة فيها"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-3 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي\n2. يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)\nمخرج تعليمي آخر: يفسر نقص الطاقة الكلية بعد تقاسم الشحنة", "1. تطبيق: يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي\n2. تحليل: يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)\n3. تقييم (مخرج آخر): يفسر نقص الطاقة الكلية بعد تقاسم الشحنة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الطاقة في التوازي، تقاسم الشحنة، حفظ الشحنة، الجهد المشترك النهائي، فقد الطاقة.", "يسأل المعلم: «وصلنا مكثفًا مشحونًا بآخر فارغ مماثل له؛ هل تبقى الطاقة الكلية كما هي؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون بقاء الطاقة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل المعلم مسألة تقاسم الشحنة: حفظ الشحنة والجهد المشترك والطاقة قبل وبعد، والطلبة يتتبعون الحل ويكتشفون نقص الطاقة (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم مسائل طاقة المجموعات على التوازي، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: مكثف ‎10 μF‎ مشحون إلى ‎12 V‎ وُصل بمكثف ‎10 μF‎ فارغ. ما الجهد النهائي؟\n• الإجابة النموذجية: الشحنة ‎120 μC‎ تتوزع على ‎20 μF‎، فيصبح الجهد ‎6.0 V‎.\n\n2. مستوى التطبيق: احسب الطاقة قبل التوصيل وبعده.\n• الإجابة النموذجية: قبل: ‎7.2 × 10⁻⁴ J‎؛ بعد: ½ × ‎20 × 10⁻⁶ × 36 = 3.6 × 10⁻⁴ J‎.\n\n3. مستوى الاستدلال: أين ذهبت الطاقة المفقودة؟\n• الإجابة النموذجية: تحولت إلى حرارة في الأسلاك وإشعاع أثناء انتقال الشحنة.", "1. مستوى المعرفة: ما الكمية المحفوظة عند تقاسم الشحنة؟\n• الإجابة النموذجية: الشحنة الكلية.\n\n2. مستوى التطبيق: احسب الطاقة الكلية لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوازي مع ‎12 V‎.\n• الإجابة النموذجية: ‎W = ½ × 5.0 × 10⁻⁶ × 144 = 3.6 × 10⁻⁴ J‎.\n\n3. مستوى الاستدلال: لماذا نقصت الطاقة إلى النصف تمامًا في مثال المكثفين المتماثلين؟\n• الإجابة النموذجية: لأن الجهد صار نصفه والسعة ضعفها، فالطاقة ½‎CV²‎ تصبح ½ × ‎2C × (V/2)² =‎ نصف الأصلية.", "إرشاد للطالب: حل مسائل الطاقة وتقاسم الشحنة\nإرشاد لولي الأمر: سؤال الابن عن حفظ الشحنة وعدم حفظ الطاقة الكهربائية في هذه الحالة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17"], "h": ["<ol class=\"ol\"><li>يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي<\/li><li>يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر نقص الطاقة الكلية بعد تقاسم الشحنة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يفسر نقص الطاقة الكلية بعد تقاسم الشحنة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الطاقة في التوازي، تقاسم الشحنة، حفظ الشحنة، الجهد المشترك النهائي، فقد الطاقة.<\/p>", "<p>يسأل المعلم: «وصلنا مكثفًا مشحونًا بآخر فارغ مماثل له؛ هل تبقى الطاقة الكلية كما هي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون بقاء الطاقة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل المعلم مسألة تقاسم الشحنة: حفظ الشحنة والجهد المشترك والطاقة قبل وبعد، والطلبة يتتبعون الحل ويكتشفون نقص الطاقة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل طاقة المجموعات على التوازي، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\ ق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يشرح المعلم تساوي الشحنات ويشتق ‎1/C = 1/C₁ + 1/C₂‎، والطلبة يكتبون الاستنتاج خطوة بخطوة (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يقدم المعلم مسائل حساب السعة المكافئة لمكثفين وثلاثة، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: ما الكمية المشتركة بين المكثفات على التوالي؟\n• الإجابة النموذجية: الشحنة.\n\n2. مستوى التطبيق: استنتج معادلة التوالي.\n• الإجابة النموذجية: ‎V = V₁ + V₂ ← Q/C = Q/C₁ + Q/C₂ ← 1/C = 1/C₁ + 1/C₂‎.\n\n3. مستوى الاستدلال: احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوالي.\n• الإجابة النموذجية: ‎1/C = 1/2 + 1/3 = 5/6 ← C = 1.2 μF‎.", "1. مستوى المعرفة: كيف تقارن السعة المكافئة للتوالي بأصغر مكثف؟\n• الإجابة النموذجية: أصغر منها.\n\n2. مستوى التطبيق: احسب السعة المكافئة لمكثفين ‎4.0 μF‎ متماثلين على التوالي.\n• الإجابة النموذجية: ‎2.0 μF‎.\n\n3. مستوى الاستدلال: لماذا يحمل اللوحان الأوسطان شحنتين متساويتين ومتعاكستين؟\n• الإجابة النموذجية: لأنهما متصلان معًا ومعزولان، فالإلكترونات التي تنتقل إلى أحدهما تأتي من الآخر وتبقى الشحنة الكلية لهما صفرًا.", "إرشاد للطالب: مراجعة الموضوع 4-4 وكتابة استنتاج معادلة التوالي\nإرشاد لولي الأمر: متابعة الابن في حساب مقلوب السعات بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=18"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎<\/li><li>يفسر أن المكثفات على التوالي تحمل الشحنة نفسها وأن فرق الجهد الكلي مجموع فروق جهودها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا تحمل المكثفات على التوالي الشحنة نفسها (الشحن بالحث بين اللوحين الداخليين)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎<\/p><p class=\"pstep\" ">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الكمية المشتركة بين المكثفات على التوالي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الشحنة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> استنتج معادلة التوالي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = V₁ + V₂ ← Q/C = Q/C₁ + Q/C₂ ← 1/C = 1/C₁ + 1/C₂‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوالي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎1/C = 1/2 + 1/3 = 5/6 ← C = 1.2 μF‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تقارن السعة المكافئة للتوالي بأصغر مكثف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أصغر منها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب السعة المكافئة لمكثفين ‎4.0 μF‎ متماثلين على التوالي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2.0 μF‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يحمل اللوحان الأوسطان شحنتين متساويتين ومتعاكستين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنهما متصلان معًا ومعزولان، فالإلكترونات التي تنتقل إلى أحدهما تأتي من الآخر وتبقى الشحنة الكلية لهما صفرًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-4 وكتابة استنتاج معادلة التوالي<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حساب مقلوب السعات بدقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب:
