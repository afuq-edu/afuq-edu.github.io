:root{--bg:#f6faf9;--card:#fff;--line:#dcebe8;--ink:#2b3a3a;--teal:#2f5e5a;--soft:#eef5f4;--vio:#56478a;--vsoft:#f4f2fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Plex,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.7}
header{background:linear-gradient(180deg,#eaf4f2,#f6faf9);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0;font-size:1.25rem;color:var(--teal)}
.wrap{max-width:1050px;margin:0 auto;padding:0 14px 40px}
.mode{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;margin:12px 0 6px;width:fit-content;max-width:100%}
.mode button{border:0;background:transparent;font:inherit;padding:8px 18px;border-radius:10px;cursor:pointer;color:#55706d;font-weight:700}
.mode button.on{background:var(--soft);color:var(--teal);box-shadow:inset 0 0 0 1px #cfe2df}
.explain{font-size:.88rem;color:#5d6f6d;margin:2px 0}
.status{margin:8px 0 12px;padding:8px 12px;border-radius:10px;background:var(--vsoft);border:1px solid #e1dbf3;color:var(--vio);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);max-width:100%;min-width:260px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;color:#55706d}
.tabs button.on{background:var(--soft);border-color:#b9d8d3;color:var(--teal);font-weight:700}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin:6px 0 14px;font-size:.88rem}
.info div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.info div.w{grid-column:1/-1}
.info b{color:#3d6b67;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#f3f9f8;border-bottom:1px solid var(--line)}
.ct{font-weight:700;color:var(--teal)}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dff0ec;margin-left:8px;font-size:.85rem}
.copy{font:inherit;font-weight:700;border:1px solid #b9d8d3;background:#fff;color:var(--teal);padding:5px 16px;border-radius:10px;cursor:pointer;min-width:110px;transition:.2s}
.copy:hover{background:var(--soft)}
.copy.ok{background:#e9f7ee;border-color:#9fd3b2;color:#2f7a4d}
.cb{padding:10px 14px}
.sub{border-right:3px solid #cfe2df;padding:2px 10px 6px;margin:6px 0 10px}
.subh{font-weight:700;color:var(--vio);margin-bottom:3px}
.fallback{width:100%;min-height:120px;font:inherit;margin-top:8px;border:1px dashed #c9b9ef;border-radius:10px;padding:8px;background:#fcfbff}
.hint{font-size:.82rem;color:#8a5a2f;margin-top:4px}

.tb{width:100%;border-collapse:collapse;margin:2px 0}
.tb th{background:#eef5f4;color:#2f5e5a;font-weight:700;border:1px solid #cfe2df;padding:4px 6px;font-size:.92em}
.tb td{border:1px solid #dcebe8;padding:4px 6px;vertical-align:top}
.tb td.c,.tb td.lv,.tb td.tm,.tb td.lvA{white-space:nowrap;text-align:center;color:#3a6763;background:#f7fbfa}
.tb td.lv{color:#6a4f9a;background:#f6f3fb}
.tb tr.sum td{background:#f3f8f7;font-weight:700}
.lvA.a1{color:#2f7a4d!important;background:#eef8f1!important}.lvA.a2{color:#2f5e8a!important;background:#eef4fb!important}.lvA.a3{color:#8a5a2f!important;background:#fbf4ec!important}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#eef5f4;border:1px solid #cfe2df;color:#2f5e5a;border-radius:20px;padding:2px 10px}
.chip.r{background:#f4f2fb;border-color:#ddd6f0;color:#56478a}
.ol{margin:0;padding-right:20px}.extra{margin-top:4px;color:#5b4a86}
p{margin:2px 0}

@media(max-width:600px){body{font-size:14px}select{min-width:0;width:100%}.info th{white-space:normal}}
.stg{display:inline-block;font-size:12px;font-weight:700;color:#0f766e;background:#e6f6f4;border:1px solid #bfe5df;border-radius:8px;padding:1px 8px;margin:0 0 4px;line-height:1.6}
</style>
</head>

<h1>نسخ حقول نور – الفيزياء – الصف الثاني عشر – الفصل الدراسي الأول</h1>
<div class="mode" id="mode"><button data-m="sep" class="on">تحضير منفصل</button><button data-m="com">تحضير مدمج</button></div>

const D=[{"title": "تمثيل مجال الجاذبية", "sb": "الموضوع 1-1 (السؤالان 1، 2)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "مجال الجاذبية بوصفه مجال قوة وتمثيله بخطوط المجال", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "تمثيل مجال الجاذبية"], ["الحصة", "1 من 2"], ["محور الحصة", "مجال الجاذبية بوصفه مجال قوة وتمثيله بخطوط المجال"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-1 (السؤالان 1، 2)"], ["دليل المعلم", "ص 28–31"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-1: قانون نيوتن للجاذبية ص 24"]], "t": ["1. يذكر أن مجال الجاذبية مثال على مجال القوة ويعرّف شدة مجال الجاذبية بأنها القوة لكل وحدة كتلة\n2. يمثل مجال الجاذبية بخطوط المجال للمجالين الشعاعي والمنتظم\nمخرج تعليمي آخر: يفسر ثبات وزن الجسم تقريبًا قرب سطح الأرض وتغيره عند الابتعاد عنها", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- العصف الذهني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "مجال القوة، مجال الجاذبية، خطوط المجال، المجال الشعاعي، المجال المنتظم، شدة مجال الجاذبية، الكتلة النقطية.", "يسقط المعلم كوبًا بلاستيكيًا ثم يعرض صورة الثقب الأسود المرصود عام 2019م ويسأل: «ما العامل المشترك بين هاتين الملاحظتين؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: العصف الذهني\nالمعلم: ينفذ فكرة التمهيد (أ) ويدير النقاش حول دور الجاذبية\nالطالب: يحددون دور الجاذبية في الحالتين ويجيبون عن مهام بداية الوحدة\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «المجالات الشعاعية والمنتظمة»: يذكّر بخطوط المجال المغناطيسي ثم يرسم خطوط مجال الأرض قريبًا وبعيدًا (الشكلان 1-1 و1-2)\nالطالب: يرسمون خطوط المجالين ويستنتجون أن تقارب الخطوط يدل على شدة المجال\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مواقف (سطح الأرض، قمر صناعي، الفضاء البعيد) لتحديد نوع المجال\nالطالب: يصنفون المجال في كل موقف ويبررون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: عرّف شدة مجال الجاذبية.\n   الإجابة النموذجية: القوة المؤثرة لكل وحدة كتلة على كتلة صغيرة موضوعة عند تلك النقطة.\n2) (المستوى المتوقع) السؤال: ماذا يدل تقارب خطوط مجال الجاذبية؟\n   الإجابة النموذجية: على أن المجال أشد في تلك المنطقة.\n3) (المستوى المتقدم) السؤال: لماذا نعامل مجال الجاذبية قرب سطح الأرض على أنه منتظم؟\n   الإجابة النموذجية: لأن المسافة المعنية صغيرة جدًا مقارنة بنصف قطر الأرض فتبدو الخطوط متوازية ومتساوية التباعد.", "1) (مستوى الدعم) السؤال: ما اتجاه خطوط مجال الجاذبية حول الأرض؟\n   الإجابة النموذجية: نحو مركز الأرض (شعاعية إلى الداخل).\n2) (المستوى المتوقع) السؤال: ارسم خطوط مجال الجاذبية لكوكب كروي.\n   الإجابة النموذجية: خطوط مستقيمة شعاعية متجهة نحو المركز، يتباعد بعضها عن بعض كلما ابتعدنا عن الكوكب.\n3) (المستوى المتقدم) السؤال: لماذا يقل وزن رائد الفضاء كلما ابتعد عن الأرض؟\n   الإجابة النموذجية: لأن خطوط المجال تتباعد فتقل شدة مجال الجاذبية ومن ثم القوة المؤثرة على كتلته.", "إرشاد للطالب: مراجعة الموضوع 1-1 في كتاب الطالب ورسم المجالين الشعاعي والمنتظم\nإرشاد لولي الأمر: الحديث مع الابن عن الجاذبية في حياتنا اليومية وفي حركة القمر"], "h": ["<ol class=\"ol\"><li>يذكر أن مجال الجاذبية مثال على مجال القوة ويعرّف شدة مجال الجاذبية بأنها القوة لكل وحدة كتلة</li><li>يمثل مجال الجاذبية بخطوط المجال للمجالين الشعاعي والمنتظم</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر ثبات وزن الجسم تقريبًا قرب سطح الأرض وتغيره عند الابتعاد عنها</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر أن مجال الجاذبية مثال على مجال القوة ويعرّف شدة مجال الجاذبية بأنها القوة لكل وحدة كتلة</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يمثل مجال الجاذبية بخطوط المجال للمجالين الشعاعي والمنتظم</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر ثبات وزن الجسم تقريبًا قرب سطح الأرض وتغيره عند الابتعاد عنه ة</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف شدة مجال الجاذبية.</td><td>القوة المؤثرة لكل وحدة كتلة على كتلة صغيرة موضوعة عند تلك النقطة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يدل تقارب خطوط مجال الجاذبية؟</td><td>على أن المجال أشد في تلك المنطقة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا نعامل مجال الجاذبية قرب سطح الأرض على أنه منتظم؟</td><td>لأن المسافة المعنية صغيرة جدًا مقارنة بنصف قطر الأرض فتبدو الخطوط متوازية ومتساوية التباعد.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما اتجاه خطوط مجال الجاذبية حول الأرض؟</td><td>نحو مركز الأرض (شعاعية إلى الداخل).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ارسم خطوط مجال الجاذبية لكوكب كروي.</td><td>خطوط مستقيمة شعاعية متجهة نحو المركز، يتباعد بعضها عن بعض كلما ابتعدنا عن الكوكب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يقل وزن رائد الفضاء كلما ابتعد عن الأرض؟</td><td>لأن خطوط المجال تتباعد فتقل شدة مجال الجاذبية ومن ثم القوة المؤثرة على كتلته.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 1-1 في كتاب الطالب ورسم المجالين الشعاعي والمنتظم</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الجاذبية في حياتنا اليومية وفي حركة القمر</p>"]}, {"axis": "قانون نيوتن للجاذبية وتجربة كافنديش", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "تمثيل مجال الجاذبية"], ["الحصة", "2 من 2"], ["محور الحصة", "قانون نيوتن للجاذبية وتجربة كافنديش"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-1 (السؤالان 1، 2)"], ["دليل المعلم", "ص 28–31"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-1: قانون نيوتن للجاذبية ص 24"]], "t": ["1. يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎\n2. يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها\nمخرج تعليمي آخر: يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة ‎Gravity Lab‎", "قانون نيوتن للجاذبية، ثابت الجذب العام ‎G‎، قانون التربيع العكسي، الكتلة النقطية، تجربة كافنديش.", "يسأل المعلم: «تجذبك الأرض بقوة نحو ‎600 N‎، فلماذا لا تشعر بجذب زميلك الجالس بجوارك؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يقترحون أثر صغر الكتلة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح قانون نيوتن والتربيع العكسي ويحل مثالًا لقوة بين كتلتين\nالطالب: يحسبون القوة بين كتلتين صغيرتين ويقارنونها بوزنهما\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يعرض «تجربة كافنديش» بمقطع مختار ونموذج مبسط، ثم يوجه حل السؤالين 1 و2 ونشاط 1-1 (ص 24)\nالطالب: يصفون مبدأ التجربة ويحلون الأسئلة في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اكتب معادلة قانون نيوتن للجاذبية.\n   الإجابة النموذجية: ‎F = Gm₁m₂ / r²‎\n2) (المستوى المتوقع) السؤال: احسب قوة التجاذب بين كتلتين كل منهما ‎1.0 kg‎ بينهما ‎1.0 m‎.\n   الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ N‎.\n3) (المستوى المتقدم) السؤال: ماذا يحدث للقوة إذا تضاعفت المسافة بين الكتلتين؟\n   الإجابة النموذجية: تقل إلى الربع.", "1) (مستوى الدعم) السؤال: ما قيمة ‎G‎ ووحدتها؟\n   الإجابة النموذجية: ‎6.67 × 10⁻¹¹ N m² kg⁻²‎.\n2) (المستوى المتوقع) السؤال: من أين تُقاس ‎r‎ عند حساب قوة الجذب بين الأرض والقمر؟\n   الإجابة النموذجية: بين مركزيهما.\n3) (المستوى المتقدم) السؤال: احسب قوة الجذب بين الأرض ‎(6.0 × 10²⁴ kg)‎ وقمر صناعي كتلته ‎1000 kg‎ على بعد ‎7.0 × 10⁶ m‎ من مركزها.\n   الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 1000 ÷ (7.0 × 10⁶)² = 8.2 × 10³ N‎.", "إرشاد للطالب: حل السؤالين 1 و2 ونشاط 1-1 ص 24\nإرشاد لولي الأمر: مناقشة الابن في سبب عدم شعورنا بجذب الأجسام الصغيرة لبعضها"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎</li><li>يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎</td><td class=\"lv\">فهم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: محاكاة ‎Gravity Lab‎</span></div>", "<p>قانون نيوتن للجاذبية، ثابت الجذب العام ‎G‎، قانون التربيع العكسي، الكتلة النقطية، تجربة كافنديش.</p>", "<p>يسأل المعلم: «تجذبك الأرض بقوة نحو ‎600 N‎، فلماذا لا تشعر بجذب زميلك الجالس بجوارك؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يطرح السؤال</td><td>يقترحون أثر صغر الكتلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يشرح قانون نيوتن والتربيع العكسي ويحل مثالًا لقوة بين كتلتين</td><td>يحسبون القوة بين كتلتين صغيرتين ويقارنونها بوزنهما</td></tr><tr><td class=\ جالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "1 من 3"], ["محور الحصة", "استنتاج معادلة شدة مجال الجاذبية ‎g = GM/r²‎"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 (الأسئلة 3–8)"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية\n2. يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع\nمخرج تعليمي آخر: يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "شدة مجال الجاذبية ‎g‎، ‎g = F/m‎، ‎g = GM/r²‎، ‎N/kg‎، ‎m/s²‎، قانون التربيع العكسي.", "يطلب المعلم حساب زمن سقوط جسم من ارتفاع ‎1.0 m‎ عند سطح الأرض ‎(g = 9.81)‎ ثم أعلى قمة إيفرست ‎(g = 9.77)‎، ويسأل: «هل ‎g‎ ثابتة فعلًا؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ فكرة التمهيد ويناقش تغير ‎g‎\nالطالب: يحسبون الزمن في الحالتين ويقارنون\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «تعريف شدة مجال الجاذبية واستنتاجها»: من ‎F = GMm/r²‎ إلى ‎g = GM/r²‎ واستنتاج الوحدة\nالطالب: يستنتجون المعادلة في دفاترهم ويعرض طالب الاستنتاج للصف\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم أسئلة على العلاقة بين ‎g‎ و‎r (‎التربيع العكسي)\nالطالب: يحسبون ‎g‎ عند مسافات مختلفة بالنسبة لـ ‎g‎ عند السطح\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: استنتج معادلة ‎g‎ لكتلة نقطية.\n   الإجابة النموذجية: ‎g = F/m = (GMm/r²)/m = GM/r²‎\n2) (المستوى المتوقع) السؤال: لماذا وحدة ‎N/kg‎ مكافئة لـ ‎m/s²‎؟\n   الإجابة النموذجية: لأن ‎N = kg m/s²‎، فـ ‎N/kg = m/s²‎.\n3) (المستوى المتقدم) السؤال: كم تصبح ‎g‎ على ارتفاع يساوي نصف قطر الأرض فوق سطحها؟\n   الإجابة النموذجية: ‎r = 2R‎، فتصبح ‎g‎ ربع قيمتها عند السطح ≈ ‎2.45 N/kg‎.", "1) (مستوى الدعم) السؤال: هل تعتمد ‎g‎ على كتلة الجسم الذي يسقط؟\n   الإجابة النموذجية: لا؛ تعتمد على كتلة الكوكب والبعد عن مركزه فقط.\n2) (المستوى المتوقع) السؤال: ما العلاقة بين ‎g‎ والبعد ‎r‎ عن المركز؟\n   الإجابة النموذجية: ‎g‎ تتناسب عكسيًا مع ‎r²‎.\n3) (المستوى المتقدم) السؤال: على أي بعد من مركز الأرض تصبح ‎g‎ تسع قيمتها عند السطح؟\n   الإجابة النموذجية: على بعد ‎3R‎ من المركز.", "إرشاد للطالب: مراجعة الموضوع 1-2 وكتابة استنتاج ‎g = GM/r²‎\nإرشاد لولي الأمر: تشجيع الابن على شرح سبب تغير وزنه لو صعد إلى قمة جبل عالٍ"], "h": ["<ol class=\"ol\"><li>يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية</li><li>يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي</td><td class=\"lv\">فهم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>شدة مجال الجاذبية ‎g‎، ‎g = F/m‎، ‎g = GM/r²‎، ‎N/kg‎، ‎m/s²‎، قانون التربيع العكسي.</p>", "<p>يطلب المعلم حساب زمن سقوط جسم من ارتفاع ‎1.0 m‎ عند سطح الأرض ‎(g = 9.81)‎ ثم أعلى قمة إيفرست ‎(g = 9.77)‎، ويسأل: «هل ‎g‎ ثابتة فعلًا؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ فكرة التمهيد ويناقش تغير ‎g‎</td><td>يحسبون الزمن في الحالتين ويقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ «تعريف شدة مجال الجاذبية واستنتاجها»: من ‎F = GMm/r²‎ إلى ‎g = GM/r²‎ واستنتاج الوحدة</td><td>يستنتجون المعادلة في دفاترهم ويعرض طالب الاستنتاج للصف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم أسئلة على العلاقة بين ‎g‎ و‎r (‎التربيع العكسي)</td><td>يحسبون ‎g‎ عند مسافات مختلفة بالنسبة لـ ‎g‎ عند السطح</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>استنتج معادلة ‎g‎ لكتلة نقطية.</td><td>‎g = F/m = (GMm/r²)/m = GM/r²‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا وحدة ‎N/kg‎ مكافئة لـ ‎m/s²‎؟</td><td>لأن ‎N = kg m/s²‎، فـ ‎N/kg = m/s²‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم تصبح ‎g‎ على ارتفاع يساوي نصف قطر الأرض فوق سطحها؟</td><td>‎r = 2R‎، فتصبح ‎g‎ ربع قيمتها عند السطح ≈ ‎2.45 N/kg‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل تعتمد ‎g‎ على كتلة الجسم الذي يسقط؟</td><td>لا؛ تعتمد على كتلة الكوكب والبعد عن مركزه فقط.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما العلاقة بين ‎g‎ والبعد ‎r‎ عن المركز؟</td><td>‎g‎ تتناسب عكسيًا مع ‎r²‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>على أي بعد من مركز الأرض تصبح ‎g‎ تسع قيمتها عند السطح؟</td><td>على بعد ‎3R‎ من المركز.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 1-2 وكتابة استنتاج ‎g = GM/r²‎</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح سبب تغير وزنه لو صعد إلى قمة جبل عالٍ</p>"]}, {"axis": "حساب شدة مجال الجاذبية لكواكب وأقمار", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "2 من 3"], ["محور الحصة", "حساب شدة مجال الجاذبية لكواكب وأقمار"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 (الأسئلة 3–8)"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة\n2. يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة\nمخرج تعليمي آخر: يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎g‎ عند سطح الكوكب، كتلة الكوكب، نصف القطر، تسارع السقوط الحر، المثال 1 في كتاب الطالب.", "يعرض المعلم صورة رائد فضاء يقفز على سطح القمر ويسأل: «لماذا يقفز أعلى بستة أضعاف تقريبًا؟ وكيف نحسب ‎g‎ على القمر؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون حساب ‎g‎ من كتلة القمر ونصف قطره\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني\nالمعلم: ينفذ «استخدام معادلة شدة مجال الجاذبية» ويحل المثال 1\nالطالب: يتبعون الحل ويحسبون ‎g‎ للأرض والقمر\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يوجه حل الأسئلة 3–8 فرديًا ثم يناقش الحلول\nالطالب: يحلون ويصححون باستخدام الحلول النموذجية\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير السؤال المفصلي (عطارد) ثم التقويم الختامي\nالطالب: يجيبون عن السؤال المفصلي ويحلون أسئلة التقويم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب ‎g‎ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).\n   الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ (6.4 × 10⁶)² = 9.8 N/kg‎.\n2) (المستوى المتوقع) السؤال: احسب ‎g‎ على سطح عطارد (‎M = 3.30 × 10²³ kg‎، ‎R = 2.44 × 10⁶ m‎).\n   الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 3.30 × 10²³ ÷ (2.44 × 10⁶)² = 3.7 N/kg‎.\n3) (المستوى المتقدم) السؤال: متى تتساوى شدة مجال الجاذبية وتسارع السقوط الحر عدديًا؟\n   الإجابة النموذجية: عندما تكون الجاذبية القوة الوحيدة المؤثرة على الجسم (بإهمال مقاومة الهواء).", "1) (مستوى الدعم) السؤال: اكتب علاقة كتلة كوكب بدلالة ‎g‎ و‎R‎.\n   الإجابة النموذجية: ‎M = gR²/G‎\n2) (المستوى المتوقع) السؤال: احسب كتلة كوكب نصف قطره ‎3.4 × 10⁶ m‎ و‎g‎ على سطحه ‎3.7 N/kg‎.\n   الإجابة النموذجية: ‎M = 3.7 × (3.4 × 10⁶)² ÷ 6.67 × 10⁻¹¹ = 6.4 × 10²³ kg‎.\n3) (المستوى المتقدم) السؤال: كوكب كتلته ضعف كتلة الأرض ونصف قطره ضعف نصف قطرها. قارن ‎g‎ على سطحه بـ ‎g‎ الأرض.\n   الإجابة النموذجية: ‎g = G(2M)/(2R)² = ½ g‎ الأرض.", "إرشاد للطالب: حل الأسئلة 3–8 في كتاب الطالب\nإرشاد لولي الأمر: متابعة الابن في التعامل مع الأعداد الكبيرة بالصيغة العلمية"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة</li><li>يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>‎g‎ عند سطح الكوكب، كتلة الكوكب، نصف القطر، تسارع السقوط الحر، المثال 1 في كتاب الطالب.</p>", "<p>يعرض المعلم صورة رائد فضاء يقفز على سطح القمر ويسأل: «لماذا يقفز أعلى بستة أضعاف تقريبًا؟ وكيف نحسب ‎g‎ على القمر؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يعرض الصورة ويطرح السؤال</td><td>يقترحون حساب ‎g‎ من كتلة القمر ونصف قطره</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني</span><br>ينفذ «استخدام معادلة شدة مجال الجاذبية» ويحل المثال 1</td><td>يتبعون الحل ويحسبون ‎g‎ للأرض والقمر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يوجه حل الأسئلة 3–8 فرديًا ثم يناقش الحلول</td><td>يحلون ويصححون باستخدام الحلول النموذجية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير السؤال المفصلي (عطارد) ثم التقويم الختامي</td><td>يجيبون عن السؤال المفصلي ويحلون أسئلة التقويم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎g‎ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).</td><td>‎g = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ (6.4 × 10⁶)² = 9.8 N/kg‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎g‎ على سطح عطارد (‎M = 3.30 × 10²³ kg‎، ‎R = 2.44 × 10⁶ m‎).</td><td>‎g = 6.67 × 10⁻¹¹ × 3.30 × 10²³ ÷ (2.44 × 10⁶)² = 3.7 N/kg‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>متى تتساوى شدة مجال الجاذبية وتسارع السقوط الحر عدديًا؟</td><td>عندما تكون الجاذبية القوة الوحيدة المؤثرة على الجسم (بإهمال مقاومة الهواء).</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب علاقة كتلة كوكب بدلالة ‎g‎ و‎R‎.</td><td>‎M = gR²/G‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب كتلة كوكب نصف قطره ‎3.4 × 10⁶ m‎ و‎g‎ على سطحه ‎3.7 N/kg‎.</td><td>‎M = 3.7 × (3.4 × 10⁶)² ÷ 6.67 × 10⁻¹¹ = 6.4 × 10²³ kg‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كوكب كتلته ضعف كتلة الأرض ونصف قطره ضعف نصف قطرها. قارن ‎g‎ على سطحه بـ ‎g‎ الأرض.</td><td>‎g = G(2M)/(2R)² = ½ g‎ الأرض.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل الأسئلة 3–8 في كتاب الطالب</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التعامل مع الأعداد الكبيرة بالصيغة العلمية</p>"]}, {"axis": "نشاط 1-2 وأسئلة كتاب التجارب في شدة مجال الجاذبية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 1-2 وأسئلة كتاب التجارب في شدة مجال الجاذبية"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 + كتاب التجارب ص 28"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يحل نشاط 1-2 «شدة مجال الجاذبية»\n2. يحلل تمثيلًا بيانيًا لتغير ‎g‎ مع البعد ‎r‎ عن مركز كوكب\nمخرج تعليمي آخر: يقيّم استخدام ‎g = 9.81 N/kg‎ في حسابات الأقمار الصناعية", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "منحنى ‎g‎ مقابل ‎r‎، التربيع العكسي، داخل الكوكب وخارجه، حدود صلاحية القيم.", "يعرض المعلم تمثيلًا بيانيًا لـ ‎g‎ مقابل ‎r‎ ويسأل: «لماذا لا يكون المنحنى خطًا مستقيمًا؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يعرض التمثيل ويطرح السؤال\nالطالب: يربطون الشكل بالتربيع العكسي\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني\nالمعلم: يوجه حل «أسئلة كتاب التجارب العملية والأنشطة» نشاط 1-2 (ص 28)\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يقدم مسألة: هل يصح استخدام 9.81 لقمر على ارتفاع ‎400 km‎؟\nالطالب: يحسبون ‎g‎ هناك ويقيّمون الخطأ\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على شدة المجال\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كيف تتغير ‎g‎ إذا زاد ‎r‎ ثلاث مرات؟\n   الإجابة النموذجية: تقل إلى التسع.\n2) (المستوى المتوقع) السؤال: احسب ‎g‎ على ارتفاع ‎400 km‎ فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎.\n   الإجابة النموذجية: ‎r = 6.8 × 10⁶‎؛ ‎g = 9.8 × (6.4/6.8)² = 8.7 N/kg‎.\n3) (المستوى المتقدم) السؤال: ما الخطأ النسبي إذا استخدمنا 9.8 بدل 8.7؟\n   الإجابة النموذجية: نحو 13%، وهو خطأ كبير لا يُهمل.", "1) (مستوى الدعم) السؤال: ما شكل منحنى ‎g‎ مقابل ‎r‎ خارج الكوكب؟\n   الإجابة النموذجية: منحنى يتناقص بسرعة ثم ببطء (علاقة تربيع عكسي).\n2) (المستوى المتوقع) السؤال: لماذا لا يصح استخدام ‎9.81 N/kg‎ لقمر صناعي على ارتفاع كبير؟\n   الإجابة النموذجية: لأن ‎g‎ تتناقص بزيادة البعد عن مركز الأرض.\n3) (المستوى المتقدم) السؤال: عند أي ارتفاع فوق سطح الأرض تصبح ‎g‎ ربع قيمتها عند السطح؟\n   الإجابة النموذجية: على ارتفاع يساوي نصف قطر الأرض ‎(6.4 × 10⁶ m)‎.", "إرشاد للطالب: إكمال نشاط 1-2 ص 28\nإرشاد لولي الأمر: متابعة الابن في رسم منحنى ‎g‎ مقابل ‎r‎ بعناية"], "h": ["<ol class=\"ol\"><li>يحل نشاط 1-2 «شدة مجال الجاذبية»</li><li>يحلل تمثيلًا بيانيًا لتغير ‎g‎ مع البعد ‎r‎ عن مركز كوكب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم استخدام ‎g = 9.81 N/kg‎ في حسابات الأقمار الصناعية</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 1-2 «شدة مجال الجاذبية»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحلل تمثيلًا بيانيًا لتغير ‎g‎ مع البعد ‎r‎ عن مركز كوكب</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم استخدام ‎g = 9.81 N/kg‎ في حسابات الأقمار الصناعية</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>منحنى ‎g‎ مقابل ‎r‎، التربيع العكسي، داخل الكوكب وخارجه، حدود صلاحية القيم.</p>", "<p>يعرض المعلم تمثيلًا بيانيًا لـ ‎g‎ مقابل ‎r‎ ويسأل: «لماذا لا يكون المنحنى خطًا مستقيمًا؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يعرض التمثيل ويطرح السؤال</td><td>يربطون الشكل بالتربيع العكسي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني</span><br>يوجه حل «أسئلة كتاب التجارب العملية والأنشطة» نشاط 1-2 (ص 28)</td><td>يحلون فرديًا ثم يقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يقدم مسألة: هل يصح استخدام 9.81 لقمر على ارتفاع ‎400 km‎؟</td><td>يحسبون ‎g‎ هناك ويقيّمون الخطأ</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على شدة المجال</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تتغير ‎g‎ إذا زاد ‎r‎ ثلاث مرات؟</td><td>تقل إلى التسع.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎g‎ على ارتفاع ‎400 km‎ فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎.</td><td>‎r = 6.8 × 10⁶‎؛ ‎g = 9.8 × (6.4/6.8)² = 8.7 N/kg‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الخطأ النسبي إذا استخدمنا 9.8 بدل 8.7؟</td><td>نحو 13%، وهو خطأ كبير لا يُهمل.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما شكل منحنى ‎g‎ مقابل ‎r‎ خارج الكوكب؟</td><td>منحنى يتناقص بسرعة ثم ببطء (علاقة تربيع عكسي).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يصح استخدام ‎9.81 N/kg‎ لقمر صناعي على ارتفاع كبير؟</td><td>لأن ‎g‎ تتناقص بزيادة البعد عن مركز الأرض.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>عند أي ارتفاع فوق سطح الأرض تصبح ‎g‎ ربع قيمتها عند السطح؟</td><td>على ارتفاع يساوي نصف قطر الأرض ‎(6.4 × 10⁶ m)‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 1-2 ص 28</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في رسم منحنى ‎g‎ مقابل ‎r‎ بعناية</p>"]}]}, {"title": "الطاقة وجهد الجاذبية", "sb": "الموضوع 1-3 (السؤالان 9، 10)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "جهد الجاذبية وتعريفه", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "1 من 3"], ["محور الحصة", "جهد الجاذبية وتعريفه"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 (السؤالان 9، 10)"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية\nمخرج تعليمي آخر: يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية", "جهد الجاذبية φ، اللانهاية، الشغل لوحدة الكتل، ‎J/kg‎، φ = ‎−GM/r‎، بئر الجهد.", "يعرض المعلم صورة «بئر الجاذبية» (سطح منحنٍ تتدحرج عليه كرات) ويسأل: «لماذا نصف الأرض بأنها في بئر جهد؟ وما المرجع الذي نقيس منه؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ فكرة التمهيد ويطرح السؤال\nالطالب: يقترحون مرجعًا للجهد الصفري\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح «الطاقة في مجال الجاذبية»: تعريف φ واللانهاية مرجعًا وسبب السالبية والمعادلة\nالطالب: يكتبون التعريف ويحسبون φ عند سطح الأرض\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب φ على أبعاد مختلفة\nالطالب: يحسبون في أزواج ويرسمون φ مقابل ‎r‎\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا جهد الجاذبية سالب؟\n   الإجابة النموذجية: لأن الجهد صفر في اللانهاية والجاذبية قوة تجاذب، فيلزم بذل شغل لإخراج الكتلة إلى اللانهاية، أي إن طاقتها أقل من الصفر.\n2) (المستوى المتوقع) السؤال: احسب φ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).\n   الإجابة النموذجية: φ = ‎−6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ 6.4 × 10⁶ = −6.3 × 10⁷ J/kg‎.\n3) (المستوى المتقدم) السؤال: كيف يتغير φ إذا تضاعف البعد عن المركز؟\n   الإجابة النموذجية: يصبح نصف قيمته (أقل سالبية).", "1) (مستوى الدعم) السؤال: ما وحدة جهد الجاذبية؟\n   الإجابة النموذجية: ‎J/kg‎.\n2) (المستوى المتوقع) السؤال: أين يكون جهد الجاذبية صفرًا؟\n   الإجابة النموذجية: في اللانهاية.\n3) (المستوى المتقدم) السؤال: احسب φ على بعد ‎1.28 × 10⁷ m‎ من مركز الأرض.\n   الإجابة النموذجية: φ = ‎−3.1 × 10⁷ J/kg (‎نصف قيمته عند السطح).", "إرشاد للطالب: مراجعة الموضوع 1-3 وكتابة تعريف جهد الجاذبية\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «بئر الجاذبية» ومعناه"], "h": ["<ol class=\"ol\"><li>يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة</li><li>يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية</td><td class=\"lv\">فهم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>جهد الجاذبية φ، اللانهاية، الشغل لوحدة الكتل، ‎J/kg‎، φ = ‎−GM/r‎، بئر الجهد.</p>", "<p>يعرض المعلم صورة «بئر الجاذبية» (سطح منحنٍ تتدحرج عليه كرات) ويسأل: «لماذا نصف الأرض بأنها في بئر جهد؟ وما المرجع الذي نقيس منه؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ فكرة التمهيد ويطرح السؤال</td><td>يقترحون مرجعًا للجهد الصفري</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يشرح «الطاقة في مجال الجاذبية»: تعريف φ واللانهاية مرجعًا وسبب السالبية والمعادلة</td><td>يكتبون التعريف ويحسبون φ عند سطح الأرض</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل حساب φ على أبعاد مختلفة</td><td>يحسبون في أزواج ويرسمون φ مقابل ‎r‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا جهد الجاذبية سالب؟</td><td>لأن الجهد صفر في اللانهاية والجاذبية قوة تجاذب، فيلزم بذل شغل لإخراج الكتلة إلى اللانهاية، أي إن طاقتها أقل من الصفر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب φ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).</td><td>φ = ‎−6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ 6.4 × 10⁶ = −6.3 × 10⁷ J/kg‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يتغير φ إذا تضاعف البعد عن المركز؟</td><td>يصبح نصف قيمته (أقل سالبية).</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وحدة جهد الجاذبية؟</td><td>‎J/kg‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أين يكون جهد الجاذبية صفرًا؟</td><td>في اللانهاية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب φ على بعد ‎1.28 × 10⁷ m‎ من مركز الأرض.</td><td>φ = ‎−3.1 × 10⁷ J/kg (‎نصف قيمته عند السطح).</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 1-3 وكتابة تعريف جهد الجاذبية</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه «بئر الجاذبية» ومعناه</p>"]}, {"axis": "طاقة وضع الجاذبية لكتلتين نقطيتين", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "2 من 3"], ["محور الحصة", "طاقة وضع الجاذبية لكتلتين نقطيتين"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 (السؤالان 9، 10)"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎\n2. يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين\nمخرج تعليمي آخر: يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "طاقة وضع الجاذبية، ‎Eₚ = −GMm/r‎، التغير في الطاقة، فرق الجهد، سرعة الإفلات.", "يسأل المعلم: «لإطلاق قمر صناعي إلى مدار مرتفع، كم طاقة يحتاج؟ ولماذا لا تكفي ‎mgh‎؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يتوقعون أن ‎g‎ ليست ثابتة على الارتفاعات الكبيرة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يشرح ‎Eₚ = mφ‎ وحساب ‎ΔEₚ = m(φ₂ − φ₁)‎\nالطالب: يحسبون التغير في الطاقة لنقل كتلة من سطح الأرض إلى ارتفاع كبير\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني\nالمعلم: يوجه حل السؤالين 9 و10 ومسألة سرعة الإفلات\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اكتب معادلة طاقة وضع الجاذبية لكتلتين.\n   الإجابة النموذجية: ‎Eₚ = −GMm/r‎\n2) (المستوى المتوقع) السؤال: احسب الطاقة اللازمة لنقل ‎100 kg‎ من سطح الأرض ‎(φ = −6.3 × 10⁷ J/kg)‎ إلى نقطة φ = ‎−3.1 × 10⁷ J/kg‎.\n   الإجابة النموذجية: ‎ΔEₚ = 100 × (−3.1 + 6.3) × 10⁷ = 3.2 × 10⁹ J‎.\n3) (المستوى المتقدم) السؤال: لماذا لا تصلح ‎mgh‎ هنا؟\n   الإجابة النموذجية: لأن ‎g‎ تتغير تغيرًا كبيرًا مع الارتفاع.", "1) (مستوى الدعم) السؤال: ما العلاقة بين ‎Eₚ‎ وφ؟\n   الإجابة النموذجية: ‎Eₚ = mφ‎.\n2) (المستوى المتوقع) السؤال: هل تزداد طاقة وضع الجاذبية أم تقل عند الابتعاد عن الأرض؟\n   الإجابة النموذجية: تزداد (تصبح أقل سالبية).\n3) (المستوى المتقدم) السؤال: احسب سرعة الإفلات من سطح الأرض.\n   الإجابة النموذجية: ½‎mv² = GMm/R ← v = √(2GM/R) = √(2 × 6.3 × 10⁷) = 1.1 × 10⁴ m/s‎.", "إرشاد للطالب: حل السؤالين 9 و10 ومراجعة الموضوع 1-3\nإرشاد لولي الأمر: الحديث مع الابن عن الطاقة اللازمة لإطلاق الصواريخ"], "h": ["<ol class=\"ol\"><li>يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎</li><li>يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>طاقة وضع الجاذبية، ‎Eₚ = −GMm/r‎، التغير في الطاقة، فرق الجهد، سرعة الإفلات.</p>", "<p>يسأل المعلم: «لإطلاق قمر صناعي إلى مدار مرتفع، كم طاقة يحتاج؟ ولماذا لا تكفي ‎mgh‎؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span cl  للطالب:</b> حل السؤالين 9 و10 ومراجعة الموضوع 1-3</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الطاقة اللازمة لإطلاق الصواريخ</p>"]}, {"axis": "المجال والجهد الناشئ عن كتلتين ونشاطا 1-3 و1-4", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "3 من 3"], ["محور الحصة", "المجال والجهد الناشئ عن كتلتين ونشاطا 1-3 و1-4"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 + كتاب التجارب ص 30 و34"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات\n2. يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري\nمخرج تعليمي آخر: يحدد نقطة انعدام المجال بين الأرض والقمر ويفسر عدم انعدام الجهد عندها", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "جمع المتجهات، المجال المحصل، الجهد الكلي، الجمع الجبري، نقطة انعدام المجال، الكميات المتجهة والعددية.", "يسأل المعلم: «في رحلة من الأرض إلى القمر توجد نقطة لا يشعر فيها رائد الفضاء بأي جذب صافٍ؛ أين تقع تقريبًا؟ وهل الجهد صفر عندها؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يتوقعون أنها أقرب إلى القمر\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يشرح جمع شدتي المجال متجهيًا وجمع الجهدين جبريًا بمثال\nالطالب: يحسبون المجال والجهد عند نقطة بين كتلتين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 1-3 (ص 30) ونشاط 1-4 (ص 34)\nالطالب: يحلون في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا تُجمع شدتا المجال متجهيًا بينما يُجمع الجهد جبريًا؟\n   الإجابة النموذجية: لأن شدة المجال كمية متجهة والجهد كمية عددية.\n2) (المستوى المتوقع) السؤال: عند نقطة انعدام المجال بين الأرض والقمر، ماذا تساوي شدتا المجالين؟\n   الإجابة النموذجية: متساويتان مقدارًا ومتعاكستان اتجاهًا.\n3) (المستوى المتقدم) السؤال: لماذا لا يكون الجهد صفرًا عند نقطة انعدام المجال؟\n   الإجابة النموذجية: لأن الجهدين سالبان كلاهما فيجمعان ولا يلغي أحدهما الآخر.", "1) (مستوى الدعم) السؤال: هل الجهد كمية متجهة أم عددية؟\n   الإجابة النموذجية: عددية.\n2) (المستوى المتوقع) السؤال: كتلتان متساويتان، ما شدة المجال المحصل عند منتصف المسافة بينهما؟\n   الإجابة النموذجية: صفر.\n3) (المستوى المتقدم) السؤال: احسب الجهد الكلي عند منتصف المسافة بين كتلتين كل منهما ‎1.0 × 10²² kg‎ بينهما ‎2.0 × 10⁸ m‎.\n   الإجابة النموذجية: φ = ‎2 × (−6.67 × 10⁻¹¹ × 1.0 × 10²² ÷ 1.0 × 10⁸) = −1.3 × 10⁴ J/kg‎.", "إرشاد للطالب: إكمال نشاطي 1-3 و1-4 ص 30 و34\nإرشاد لولي الأمر: تشجيع الابن على التمييز بين الكميات المتجهة والعددية بأمثلة"], "h": ["<ol class=\"ol\"><li>يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات</li><li>يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد نقطة انعدام المجال بين الأرض والقمر ويفسر عدم انعدام الجهد عندها</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد نقطة انعدام المجال بين الأرض والقمر ويفسر عدم انعدام الجهد عندها</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>جمع المتجهات، المجال المحصل، الجهد الكلي، الجمع الجبري، نقطة انعدام المجال، الكميات المتجهة والعددية.</p>", "<p>يسأل المعلم: «في رحلة من الأرض إلى القمر توجد نقطة لا يشعر فيها رائد الفضاء بأي جذب صافٍ؛ أين تقع تقريبًا؟ وهل الجهد صفر عندها؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يتوقعون أنها أقرب إلى القمر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يشرح جمع شدتي المجال متجهيًا وجمع الجهدين جبريًا بمثال</td><td>يحسبون المجال والجهد عند نقطة بين كتلتين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه حل نشاط 1-3 (ص 30) ونشاط 1-4 (ص 34)</td><td>يحلون في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تُجمع شدتا المجال متجهيًا بينما يُجمع الجهد جبريًا؟</td><td>لأن شدة المجال كمية متجهة والجهد كمية عددية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>عند نقطة انعدام المجال بين الأرض والقمر، ماذا تساوي شدتا المجالين؟</td><td>متساويتان مقدارًا ومتعاكستان اتجاهًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يكون الجهد صفرًا عند نقطة انعدام المجال؟</td><td>لأن الجهدين سالبان كلاهما فيجمعان ولا يلغي أحدهما الآخر.</td></tr></t تدعي قوانين الحركة الدائرية من الصف الحادي عشر.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال ويراجع ‎F = mv²/r‎\nالطالب: يستدعون علاقات الحركة الدائرية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجيتان: المختبر الافتراضي، التعلم بالنمذجة\nالمعلم: ينفذ «المختبر الافتراضي»: محاكاة تغير السرعة المدارية بتغير نصف القطر\nالطالب: يجربون قيمًا مختلفة ويسجلون العلاقة بين ‎v‎ و‎r‎\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشتق ‎v = √(GM/r)‎ من مساواة القوتين ويحل مثالًا\nالطالب: يستنتجون العلاقة ويحسبون سرعة قمر على مدار معين\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما القوة التي توفر القوة المركزية للقمر الصناعي؟\n   الإجابة النموذجية: قوة الجاذبية بين الأرض والقمر.\n2) (المستوى المتوقع) السؤال: اشتق علاقة السرعة المدارية.\n   الإجابة النموذجية: ‎GMm/r² = mv²/r ← v² = GM/r ← v = √(GM/r)‎\n3) (المستوى المتقدم) السؤال: احسب سرعة قمر يدور على بعد ‎7.0 × 10⁶ m‎ من مركز الأرض ‎(GM = 4.0 × 10¹⁴)‎.\n   الإجابة النموذجية: ‎v = √(4.0 × 10¹⁴ ÷ 7.0 × 10⁶) = 7.6 × 10³ m/s‎.", "1) (مستوى الدعم) السؤال: كيف تتغير السرعة المدارية بزيادة نصف قطر المدار؟\n   الإجابة النموذجية: تقل.\n2) (المستوى المتوقع) السؤال: لماذا لا تعتمد السرعة المدارية على كتلة القمر؟\n   الإجابة النموذجية: لأن الكتلة ‎m‎ تُختصر من طرفي المعادلة.\n3) (المستوى المتقدم) السؤال: قمران على المدار نفسه كتلة أحدهما ضعف الآخر؛ قارن سرعتيهما والقوة المركزية عليهما.\n   الإجابة النموذجية: السرعتان متساويتان، والقوة على الأثقل ضعف الأخرى.", "إرشاد للطالب: مراجعة الموضوع 1-4 واشتقاق علاقة السرعة المدارية\nإرشاد لولي الأمر: الحديث مع الابن عن الأقمار الصناعية للاتصالات والملاحة"], "h": ["<ol class=\"ol\"><li>يحلل المدارات الدائرية في مجالات الجاذبية بداللة الجاذبية قوةً مركزية: ‎GMm/r² = mv²/r‎</li><li>يستنتج علاقة سرعة القمر المداري ‎v = √(GM/r)‎ ويستخدمها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا لا تعتمد سرعة القمر الصناعي المداري : يوجه حل نشاط 1-5 (كتاب التجارب ص 35)\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني\nالمعلم: يقدم مسألة حساب كتلة كوكب ومقارنة المدارات المنخفضة والثابتة\nالطالب: يحلون في مجموعات ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المدارات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اكتب علاقة كتلة الكوكب من بيانات مدار قمره.\n   الإجابة النموذجية: ‎M = 4π²r³/(GT²)‎\n2) (المستوى المتوقع) السؤال: احسب كتلة الأرض من مدار القمر (‎r = 3.8 × 10⁸ m‎، ‎T = 2.36 × 10⁶ s‎).\n   الإجابة النموذجية: ‎M = 4π² × (3.8 × 10⁸)³ ÷ (6.67 × 10⁻¹¹ × (2.36 × 10⁶)²) = 5.8 × 10²⁴ kg‎.\n3) (المستوى المتقدم) السؤال: لماذا تفضل أقمار التصوير المدارات المنخفضة؟\n   الإجابة النموذجية: لأنها أقرب إلى الأرض فتعطي صورًا أدق، وتمر فوق مناطق مختلفة.", "1) (مستوى الدعم) السؤال: ما الزمن الدوري لقمر صناعي في مدار منخفض مقارنة بالقمر الثابت؟\n   الإجابة النموذجية: أقصر بكثير (نحو 90 دقيقة).\n2) (المستوى المتوقع) السؤال: لماذا تستخدم أقمار الاتصالات المدارات الثابتة؟\n   الإجابة النموذجية: لأنها تبقى فوق النقطة نفسها فلا تحتاج الأطباق إلى تتبعها.\n3) (المستوى المتقدم) السؤال: ما عيب المدار الثابت لأقمار الاتصالات؟\n   الإجابة النموذجية: بعده الكبير يسبب تأخرًا زمنيًا في الإشارة ويتطلب أجهزة إرسال أقوى.", "إرشاد للطالب: إكمال نشاط 1-5 ص 35\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين أقمار الاتصالات وأقمار التصوير"], "h": ["<ol class=\"ol\"><li>يحل نشاط 1-5 «الدوران تحت تأثير الجاذبية»</li><li>يحسب كتلة كوكب من الزمن الدوري ونصف قطر مدار أحد أقماره</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين مدارات منخفضة ومدارات ثابتة من حيث الاستخدام</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 1-5 «الدوران تحت تأثير الجاذبية»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب كتلة كوكب من الزمن الدوري ونصف قطر مدار أحد أقماره</td><td class=\"lv\">تطبيق< (GT²)‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب كتلة الأرض من مدار القمر (‎r = 3.8 × 10⁸ m‎، ‎T = 2.36 × 10⁶ s‎).</td><td>‎M = 4π² × (3.8 × 10⁸)³ ÷ (6.67 × 10⁻¹¹ × (2.36 × 10⁶)²) = 5.8 × 10²⁴ kg‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تفضل أقمار التصوير المدارات المنخفضة؟</td><td>لأنها أقرب إلى الأرض فتعطي صورًا أدق، وتمر فوق مناطق مختلفة.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الزمن الدوري لقمر صناعي في مدار منخفض مقارنة بالقمر الثابت؟</td><td>أقصر بكثير (نحو 90 دقيقة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تستخدم أقمار الاتصالات المدارات الثابتة؟</td><td>لأنها تبقى فوق النقطة نفسها فلا تحتاج الأطباق إلى تتبعها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما عيب المدار الثابت لأقمار الاتصالات؟</td><td>بعده الكبير يسبب تأخرًا زمنيًا في الإشارة ويتطلب أجهزة إرسال أقوى.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 1-5 ص 35</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين أقمار الاتصالات وأقمار التصوير</p>"]}, {"axis": "مراجعة الوحدة الأولى وأسئلة نهاية الوحدة", "n": 4, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الدوران تحت تأثير الجاذبية"], ["الحصة", "4 من 4"], ["محور الحصة", "مراجعة الوحدة الأولى وأسئلة نهاية الوحدة"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "الوحدة الأولى: أسئلة نهاية الوحدة"], ["دليل المعلم", "ص 36–48"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: الدوران تحت تأثير الجاذبية ص 35"]], "t": ["1. يربط مفاهيم الوحدة (‎g‎، φ، ‎Eₚ‎، المدارات) في منظم بصري\n2. يحل أسئلة نهاية الوحدة الأولى المرتبطة بمجالات الجاذبية\nمخرج تعليمي آخر: يقيّم تعلمه بقائمة التقويم الذاتي للوحدة", "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎", "ملخص الوحدة، ‎g = GM/r²‎، φ = ‎−GM/r‎، ‎Eₚ = −GMm/r‎، ‎v = √(GM/r)‎، ‎T² ∝ r³‎، قائمة التقويم الذاتي.", "ينظم المعلم «تحدي المعادلات»: بطاقات فيها معادلات الوحدة وأخرى فيها أسماؤها، والمطلوب مطابقتها خلال دقيقتين.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على اللعب\nالمعلم: يدير التحدي\nالطالب: يطابقون المعادلات بأسمائها\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالاستراتيجية: التعلم الذاتي\nالمعلم: يوجه بناء منظم بصري للوحدة يربط المعادلات بالمفاهيم\nالطالب: يبنون المنظم في مجموعات\n3) (17 دقيقة: من الدقيقة 15 إلى 32)\nالاستراتيجية: التعلم الذاتي\nالمعلم: يوزع أسئلة نهاية الوحدة على المجموعات ويناقش الحلول\nالطالب: يحلون ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات للمراجعة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما الفرق بين ‎g‎ وφ من حيث النوع والوحدة؟\n   الإجابة النموذجية: ‎g‎ كمية متجهة وحدتها ‎N/kg‎، وφ كمية عددية وحدتها ‎J/kg‎.\n2) (المستوى المتوقع) السؤال: كيف تتغير ‎g‎ وφ بزيادة ‎r‎؟\n   الإجابة النموذجية: ‎g‎ تتناسب مع ‎1/r²‎، وφ مع ‎1/r‎.\n3) (المستوى المتقدم) السؤال: اربط بين φ وسرعة الإفلات.\n   الإجابة النموذجية: سرعة الإفلات ‎v = √(2|φ|)‎ عند سطح الكوكب.", "1) (مستوى الدعم) السؤال: اذكر معادلتين من الوحدة تتبعان قانون التربيع العكسي.\n   الإجابة النموذجية: ‎F = GMm/r²‎ و‎g = GM/r²‎.\n2) (المستوى المتوقع) السؤال: احسب ‎g‎ وφ على بعد ‎2R‎ من مركز الأرض بدلالة قيمتيهما عند السطح ‎g₀‎ وφ‎₀‎.\n   الإجابة النموذجية: ‎g = g₀/4‎ وφ = φ‎₀/2‎.\n3) (المستوى المتقدم) السؤال: قيّم تعلمك في الوحدة: موضوع أتقنته وآخر يحتاج إلى مراجعة وخطة لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.", "إرشاد للطالب: إكمال أسئلة نهاية الوحدة الأولى وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الأولى"], "h": ["<ol class=\"ol\"><li>يربط مفاهيم الوحدة (‎g‎، φ، ‎Eₚ‎، المدارات) في منظم بصري</li><li>يحل أسئلة نهاية الوحدة الأولى المرتبطة بمجالات الجاذبية</li></ol><div class=\" ب العملية والأنشطة", "نشاط 2-1: تمثيل مجال كهربائي ص 42"]], "t": ["1. يذكر أن المجال الكهربائي مثال على مجال القوة ويعرّف شدة المجال الكهربائي بأنها القوة لوحدة الشحنة الموجبة\n2. يقارن بين مجال الجاذبية والمجال الكهربائي من حيث المصدر ونوع القوة\nمخرج تعليمي آخر: يحدد اتجاه المجال الكهربائي عند نقطة من اتجاه القوة على شحنة اختبارية موجبة", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بالون مشحون بالدلك وقصاصات ورق", "الشحنة الكهربائية، المجال الكهربائي، شدة المجال ‎E = F/Q‎، الشحنة الاختبارية الموجبة، ‎N/C‎، التجاذب والتنافر.", "يدلك المعلم بالونًا بقطعة صوف ويقربه من قصاصات ورق دون أن يلمسها، ثم يسأل: «كيف أثّر البالون في الورق عن بعد؟ وما الشبه بين هذا وجذب الأرض للأجسام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال ومهام بداية الوحدة\nالطالب: يقترحون وجود مجال حول البالون المشحون\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرّف المجال الكهربائي وشدته ‎E = F/Q‎ واتجاهه، ويقارنه بمجال الجاذبية\nالطالب: يكملون جدول مقارنة بين المجالين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مواقف لتحديد اتجاه القوة والمجال على شحنات موجبة وسالبة\nالطالب: يحددون الاتجاهات في أزواج ويبررون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: عرّف شدة المجال الكهربائي.\n   الإجابة النموذجية: القوة المؤثرة لكل وحدة شحنة موجبة موضوعة عند تلك النقطة.\n2) (المستوى المتوقع) السؤال: ما وحدة شدة المجال الكهربائي؟\n   الإجابة النموذجية: ‎N/C‎.\n3) (المستوى المتقدم) السؤال: كيف يكون اتجاه القوة على شحنة سالبة في مجال كهربائي؟\n   الإجابة النموذجية: عكس اتجاه المجال.", "1) (مستوى الدعم) السؤال: ما الفرق الأساسي بين قوة الجاذبية والقوة الكهربائية؟\n   الإجابة النموذجية: الجاذبية تجاذب دائمًا بين الكتل، والكهربائية قد تكون تجاذبًا أو تنافرًا هربائي ص 42"]], "t": ["1. يحل نشاط 2-1 «تمثيل مجال كهربائي»\n2. يحل الأسئلة 1–4 في كتاب الطالب\nمخرج تعليمي آخر: يقيّم رسوم زملائه لخطوط المجال وفق قواعد الرسم", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التقييم التبادلي", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "قواعد رسم خطوط المجال، التقييم التبادلي، الأخطاء الشائعة في الرسم.", "يطلب المعلم من كل طالب رسم خطوط مجال شحنتين مختلفتين في 60 ثانية ثم يتبادل الرسم مع زميله ليبحث عن خطأ واحد.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجيتان: التقييم التبادلي، التعلم التعاوني\nالمعلم: يدير نشاط الرسم السريع\nالطالب: يرسمون ويتبادلون ويقيّمون\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم الذاتي\nالمعلم: يوجه حل نشاط 2-1 (كتاب التجارب ص 42)\nالطالب: يحلون فرديًا\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم الذاتي\nالمعلم: يوجه حل الأسئلة 1–4 ويعالج الأخطاء الشائعة\nالطالب: يحلون ويناقشون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما الخطأ في رسم خطوط تخرج من شحنة سالبة؟\n   الإجابة النموذجية: خطوط المجال تتجه نحو الشحنة السالبة لا منها.\n2) (المستوى المتوقع) السؤال: ما الخطأ في رسم خطين متقاطعين؟\n   الإجابة النموذجية: الخطوط لا تتقاطع لأن للمجال اتجاهًا واحدًا عند كل نقطة.\n3) (المستوى المتقدم) السؤال: كيف تمثل مجالًا أقوى في الرسم؟\n   الإجابة النموذجية: برسم خطوط أكثر تقاربًا.", "1) (مستوى الدعم) السؤال: اذكر ثلاث قواعد لرسم خطوط المجال.\n   الإجابة النموذجية: تبدأ من الموجبة وتنتهي بالسالبة، ولا تتقاطع، وتكون عمودية على سطح الموصل.\n2) (المستوى المتوقع) السؤال: ما اتجاه المجال عند نقطة بين شحنة موجبة وأخرى سالبة على الخط الواصل بينهما؟\n   الإجابة النموذجية: من الموجبة نحو السالبة.\n3) (المستوى المتقدم) السؤال: قيّم رسم زميلك واذكر ملاحظتين.\n   الإجابة النموذجية: تقييم يتضمن ملاحظة على الاتجاه وأخرى على التقارب أو التقاطع مع اقتراح تصحيح.", "إرشاد للطالب: إكمال نشاط 2-1 ص 42 والأسئلة 1–4\nإرشاد لولي الأمر: متابعة الابن في تصحيح رسومه وفق القواعد"], "h": ["<ol class=\"ol\"><li>يحل نشاط 2-1 «تمثيل مجال كهربائي»</li><li>يحل الأسئلة 1–4 في كتاب الطالب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم رسوم زملائه لخطوط المجال وفق قواعد الرسم</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 2-1 «تمثيل مجال كهربائي»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل الأسئلة 1–4 في كتاب الطالب</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم رسوم زملائه لخطوط المجال وفق قواعد الرسم</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التقييم التبادلي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>قواعد رسم خطوط المجال، التقييم التبادلي، الأخطاء الشائعة في الرسم.</p>", "<p>يطلب المعلم من كل طالب رسم خطوط مجال شحنتين مختلفتين في 60 ثانية ثم يتبادل الرسم مع زميله ليبحث عن خطأ واحد.</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجيتان: التقييم التبادلي، التعلم التعاوني</span><br>يدير نشاط الرسم السريع</td><td>يرسمون ويتبادلون ويقيّمون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم الذاتي</span><br>يوجه حل نشاط 2-1 (كتاب التجارب ص 42)</td><td>يحلون فرديًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم الذاتي</span><br>يوج طة", "نشاط 2-1: تمثيل مجال كهربائي ص 42"]], "t": ["1. يصف تطبيقات عملية للمجال الكهربائي مثل المرسِّب الكهروستاتيكي والطلاء الكهروستاتيكي\n2. يفسر عمل هذه التطبيقات بدلالة القوة الكهربائية على الجسيمات المشحونة\nمخرج تعليمي آخر: يقترح تطبيقًا يستفيد من المجال الكهربائي في بيئته المحلية", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم المبني على المشاريع\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "المرسّب الكهروستاتيكي، الطلاء الكهروستاتيكي، الجسيمات المشحونة، التلوث الصناعي، القوة الكهربائية.", "يعرض المعلم صورة مدخنة مصنع إسمنت ويسأل: «كيف تُزال جسيمات الغبار من الدخان قبل خروجه دون مرشحات تنسد بسرعة؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التشاركي\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون شحن الجسيمات وجذبها\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم التشاركي\nالمعلم: يشرح المرسّب الكهروستاتيكي والطلاء الكهروستاتيكي بمخططات\nالطالب: يرسمون مخططًا لكل تطبيق ويحددون اتجاه القوة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجيتان: التعلم التشاركي، التعلم المبني على المشاريع\nالمعلم: يكلف المجموعات بإعداد بطاقة لتطبيق مقترح في البيئة المحلية\nالطالب: يصممون البطاقة ويعرضونها باختصار\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المجال الكهربائي\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كيف يزيل المرسّب الكهروستاتيكي الغبار من الدخان؟\n   الإجابة النموذجية: تُشحن الجسيمات ثم تنجذب إلى ألواح مشحونة بشحنة معاكسة فتتجمع عليها.\n2) (المستوى المتوقع) السؤال: ما فائدة الطلاء الكهروستاتيكي؟\n   الإجابة النموذجية: توزيع الطلاء بانتظام وتقليل الهدر لأن الجسيمات المشحونة تنجذب إلى الجسم المطلي.\n3) (المستوى المتقدم) السؤال: لماذا يصل الطلاء المشحون إلى خلف الجسم أيضًا؟\n   الإجابة النموذجية: لأن خطوط المجال تلتف حول الجسم فتتبعها الجسيمات.", "1) (مستوى الدعم) السؤال: ما نوع القوة المستخدمة في المرسّب الكهروستاتيكي؟\n   الإجابة النموذجية: قوة كهربائية (تجاذب بين شحنتين مختلفتين).\n2) (المستوى المتوقع) السؤال: اذكر فائدة بيئية للمرسّب الكهروستاتيكي.\n   الإجابة النموذجية: تقليل تلوث الهواء بالجسيمات الدقيقة الخارجة من المصانع.\n3) (المستوى المتقدم) السؤال: اقترح تطبيقًا محليًا للمجال الكهربائي مع تفسير مبدأ عمله.\n   الإجابة النموذجية: مثال: مرسّب لتنقية هواء ورشة نجارة؛ تُشحن نشارة الخشب الدقيقة وتُجمع على ألواح مشحونة بشحنة معاكسة.", "إرشاد للطالب: مراجعة الموضوع 2-1 وكتابة فقرة عن تطبيق للمجال الكهربائي\nإرشاد لولي الأمر: الحديث مع الابن عن جهود الحد من تلوث الهواء في المناطق الصناعية"], "h": ["<ol class=\"ol\"><li>يصف تطبيقات عملية للمجال الكهربائي مثل المرسِّب الكهروستاتيكي والطلاء الكهروستاتيكي</li><li>يفسر عمل هذه التطبيقات بدلالة القوة الكهربائية على الجسيمات المشحونة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقترح تطبيقًا يستفيد من المجال الكهربائي في بيئته المحلية</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تطبيقات عملية للمجال الكهربائي مثل المرسِّب الكهروستاتيكي والطلاء الكهروستاتيكي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر عمل هذه التطبيقات بدلالة القوة الكهربائية على الجسيمات المشحونة</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقترح تطبيقًا يستفيد من المجال الكهربائي في بيئته المحلية</td><td class=\"lv\">إبداع</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على المشاريع</span><span class=\"chip\">التعلم التشاركي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>", "<p>المرسّب الكهروستاتيكي، الطلاء الكهروستاتيكي، الجسيمات المشحونة، التلوث الصناعي، القوة الكهربائية.</p>", "<p>يعرض المعلم صورة مدخنة مصنع إسمنت ويسأل: «كيف تُزال جسيمات الغبار من الدخان قبل خروجه دون مرشحات تنسد بسرعة؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><sp  يشتقون تكافؤ ‎V/m‎ و‎N/C‎ ويحسبون مثالين\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل تغيير ‎V‎ و‎d‎\nالطالب: يتنبؤون بالنتائج ويحسبون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اكتب معادلة شدة المجال المنتظم بين لوحين.\n   الإجابة النموذجية: ‎E = ΔV/Δd‎\n2) (المستوى المتوقع) السؤال: احسب ‎E‎ بين لوحين بينهما ‎200 V‎ والمسافة ‎0.040 m‎.\n   الإجابة النموذجية: ‎E = 5.0 × 10³ V/m‎.\n3) (المستوى المتقدم) السؤال: أثبت أن ‎V/m‎ تكافئ ‎N/C‎.\n   الإجابة النموذجية: ‎V = J/C = N m/C‎، إذن ‎V/m = N/C‎.", "1) (مستوى الدعم) السؤال: ما أثر مضاعفة المسافة بين اللوحين مع ثبات ‎V‎؟\n   الإجابة النموذجية: تقل ‎E‎ إلى النصف.\n2) (المستوى المتوقع) السؤال: احسب فرق الجهد اللازم لمجال ‎2.0 × 10⁴ V/m‎ بين لوحين بينهما ‎5.0 mm‎.\n   الإجابة النموذجية: ‎ΔV = 100 V‎.\n3) (المستوى المتقدم) السؤال: لماذا يكون المجال بين اللوحين منتظمًا في الوسط فقط؟\n   الإجابة النموذجية: لأن خطوط المجال تكون متوازية ومتساوية التباعد في الوسط وتنحني عند الحواف.", "إرشاد للطالب: مراجعة الموضوع 2-2 وحل ثلاث مسائل على ‎E = V/d‎\nإرشاد لولي الأمر: سؤال الابن عن تكافؤ الوحدتين ‎V/m‎ و‎N/C‎"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎</li><li>يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم معادلة حساب شدة المجال الكهربائي المنتظم بين لوحين متوازيين مشحونين ‎E = ΔV/Δd‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر تكافؤ الوحدتين ‎V/m‎ و‎N/C‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بأثر تغيير فرق الجهد أو المسافة بين اللوحين على شدة المجال</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"c ثبت أن ‎V/m‎ تكافئ ‎N/C‎.</td><td>‎V = J/C = N m/C‎، إذن ‎V/m = N/C‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما أثر مضاعفة المسافة بين اللوحين مع ثبات ‎V‎؟</td><td>تقل ‎E‎ إلى النصف.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب فرق الجهد اللازم لمجال ‎2.0 × 10⁴ V/m‎ بين لوحين بينهما ‎5.0 mm‎.</td><td>‎ΔV = 100 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون المجال بين اللوحين منتظمًا في الوسط فقط؟</td><td>لأن خطوط المجال تكون متوازية ومتساوية التباعد في الوسط وتنحني عند الحواف.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 2-2 وحل ثلاث مسائل على ‎E = V/d‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تكافؤ الوحدتين ‎V/m‎ و‎N/C‎</p>"]}, {"axis": "حسابات شدة المجال والقوة بين لوحين", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "شدة المجال الكهربائي"], ["الحصة", "2 من 3"], ["محور الحصة", "حسابات شدة المجال والقوة بين لوحين"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "الموضوع 2-2 (الأسئلة 5–8)"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: حساب القوة وشدة المجال الكهربائي ص 44"]], "t": ["1. يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا\n2. يحسب تسارع إلكترون أو بروتون في مجال منتظم\nمخرج تعليمي آخر: يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎F = QE‎، ‎E = V/d‎، تسارع الجسيم المشحون ‎a = F/m‎، شحنة الإلكترون، كتلة الإلكترون، إهمال الوزن.", "يسأل المعلم: «إلكترون بين لوحين بينهما ‎200 V‎ على بعد ‎4.0 cm‎؛ هل يمكن إهمال وزنه عند حساب حركته؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يتوقعون ويطلبون الحساب\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يحل مثالًا لحساب ‎E‎ ثم ‎F‎ ثم ‎a‎ للإلكترون ويقارن ‎F‎ بالوزن\nالطالب: يتبعون خطوات الحل\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل متدرجة لبروتون وأيونات\nالطالب: يحلون في أزواج ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب القوة على إلكترون ‎(1.60 × 10⁻¹⁹ C)‎ في مجال ‎5.0 × 10³ V/m‎.\n   الإجابة النموذجية: ‎F = 8.0 × 10⁻¹⁶ N‎.\n2) (المستوى المتوقع) السؤال: احسب تسارعه ‎(m = 9.11 × 10⁻³¹ kg)‎.\n   الإجابة النموذجية: ‎a = 8.0 × 10⁻¹⁶ ÷ 9.11 × 10⁻³¹ = 8.8 × 10¹⁴ m/s²‎.\n3) (المستوى المتقدم) السؤال: قارن القوة الكهربائية بوزن الإلكترون.\n   الإجابة النموذجية: الوزن ≈ ‎8.9 × 10⁻³⁰ N‎، أي أصغر بنحو ‎10¹⁴‎ مرة، فيُهمل.", "1) (مستوى الدعم) السؤال: اكتب خطوات حساب القوة على شحنة بين لوحين.\n   الإجابة النموذجية: ‎E = V/d‎ ثم ‎F = QE‎.\n2) (المستوى المتوقع) السؤال: احسب القوة على بروتون بين لوحين بينهما ‎500 V‎ والمسافة ‎0.10 m‎.\n   الإجابة النموذجية: ‎E = 5000 V/m‎؛ ‎F = 8.0 × 10⁻¹⁶ N‎.\n3) (المستوى المتقدم) السؤال: إذا كان تسارع البروتون أصغر من تسارع الإلكترون في المجال نفسه، ففسّر ذلك.\n   الإجابة النموذجية: القوة متساوية المقدار لتساوي الشحنتين، لكن كتلة البروتون أكبر بنحو 1840 مرة فيقل تسارعه.", "إرشاد للطالب: حل الأسئلة 5–8 في كتاب الطالب\nإرشاد لولي الأمر: متابعة الابن في ترتيب خطوات الحل"], "h": ["<ol class=\"ol\"><li>يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا</li><li>يحسب تسارع إلكترون أو بروتون في مجال منتظم</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين القوة الكهربائية ووزن الإلكترون في مجال منتظم</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب القوة على شحنة بين لوحين باستخدام ‎E = V/d‎ و‎F = QE‎ معًا</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب تسارع إلكترون أو بروتون ف اوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "‎F = QE‎، الشحنة الموجبة والسالبة، التسارع المنتظم، الشغل ‎QV‎، الطاقة الحركية، مدفع الإلكترونات.", "يعرض المعلم صورة أنبوب أشعة مهبطية قديم ويسأل: «كيف تُسرَّع الإلكترونات إلى سرعات كبيرة داخله دون أي محرك؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون مجالًا كهربائيًا بين قطبين\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح ‎F = QE‎ واتجاهها لشحنات موجبة وسالبة، ثم تسارع الجسيم الداخل موازيًا للمجال وعلاقة الشغل ‎QV‎\nالطالب: يحددون الاتجاهات ويكتبون علاقة الطاقة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب سرعة إلكترون بعد تسارعه عبر فرق جهد\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: في أي اتجاه تتسارع شحنة موجبة موضوعة في مجال منتظم؟\n   الإجابة النموذجية: في اتجاه المجال.\n2) (المستوى المتوقع) السؤال: ما الشغل المبذول على إلكترون يُسرَّع عبر ‎100 V‎؟\n   الإجابة النموذجية: ‎W = QV = 1.6 × 10⁻¹⁷ J‎.\n3) (المستوى المتقدم) السؤال: احسب سرعة إلكترون بدأ من السكون وتسارع عبر ‎100 V‎.\n   الإجابة النموذجية: ½‎mv² = 1.6 × 10⁻¹⁷ ← v = 5.9 × 10⁶ m/s‎.", "1) (مستوى الدعم) السؤال: اكتب معادلة القوة على شحنة في مجال كهربائي.\n   الإجابة النموذجية: ‎F = QE‎\n2) (المستوى المتوقع) السؤال: ماذا يحدث لإلكترون يدخل مجالًا منتظمًا في اتجاه المجال نفسه؟\n   الإجابة النموذجية: يتباطأ لأن القوة عليه عكس اتجاه المجال.\n3) (المستوى المتقدم) السؤال: إذا تضاعف فرق الجهد المسرِّع، فكم مرة تزداد سرعة الإلكترون النهائية؟\n   الإجابة النموذجية: ‎√2‎ مرة.", "إرشاد للطالب: مراجعة الموضوع 2-3 وحل مسألتين على ‎QV = ½mv²‎\nإرشاد لولي الأمر: الحديث مع الابن عن أجهزة تستخدم مسرعات الجسيمات في الطب"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة القوة المؤثرة على شحنة في مجال كهربائي ‎F = QE‎</li><li>يصف تأثير المجال المنتظم على جسيم مشحون يتحر
