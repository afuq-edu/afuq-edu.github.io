: "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي بالميزان", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "المزيد عن القوى على الموصلات الحاملة لتيار كهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي بالميزان"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-4 (الأسئلة 4–12)"], ["دليل المعلم", "ص 146–151"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي ص 152"]], "t": ["1. يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا\n2. يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل\nمخرج تعليمي آخر: يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: مغناطيس على شكل حرف ‎U‎، ميزان رقمي، سلك مثبت، مصدر تيار، أميتر، مقاومة متغيرة", "الميزان الرقمي، تغير القراءة، ‎F = Δm × g‎، ‎F‎ مقابل ‎I‎، الميل = ‎BL‎، عدم اليقين.", "يضع المعلم مغناطيسًا على ميزان رقمي ويمرر تيارًا في سلك ثابت بين قطبيه فتتغير قراءة الميزان، ويسأل: «لماذا تغيرت القراءة والسلك لا يلمس المغناطيس؟»", "1) (4 دقائق: من الدقيقة 0 إلى 4)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يربطون التغير بقوة متبادلة (قانون نيوتن الثالث)\n2) (20 دقيقة: من الدقيقة 4 إلى 24)\nالاستراتيجيتان: الاستقصاء العملي، التعلم التعاوني\nالمعلم: يوجه تنفيذ الاستقصاء العملي 5-1 (ص 152): قياس تغير القراءة لتيارات مختلفة\nالطالب: يسجلون ‎Δm‎ لكل تيار ويحسبون ‎F = Δm g‎\n3) (10 دقائق: من الدقيقة 24 إلى 34)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يوجه رسم ‎F‎ مقابل ‎I‎ وحساب ‎B‎ من الميل وعدم اليقين\nالطالب: يرسمون ويحسبون ‎B‎\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا تتغير قراءة الميزان؟\n   الإجابة النموذجية: لأن السلك يؤثر على المغناطيس بقوة مساوية ومعاكسة للقوة التي يؤثر بها المجال على السلك.\n2) (المستوى المتوقع) السؤال: تغيرت القراءة بـ ‎2.04 g‎ عند ‎4.0 A‎ وطول السلك في المجال ‎0.050 m‎. احسب ‎B‎.\n   الإجابة النموذجية: ‎F = 0.00204 × 9.81 = 0.020 N‎؛ ‎B = 0.020 ÷ (4.0 × 0.050) = 0.10 T‎.\n3) (المستوى المتقدم) السؤال: ماذا يمثل ميل خط ‎F‎ مقابل ‎I‎؟\n   الإجابة النموذجية: ‎BL‎.", "1) (مستوى الدعم) السؤال: ما الكمية التي نحسبها من تغير قراءة الميزان؟\n   الإجابة النموذجية: القوة ‎F = Δm × g‎.\n2) (المستوى المتوقع) السؤال: لماذا يجب أن يكون السلك عموديًا على المجال؟\n   الإجابة النموذجية: لتكون القوة أكبر ما يمكن ويُطبق ‎F = BIL‎ مباشرة.\n3) (المستوى المتقدم) السؤال: اقترح تحسينين لدقة قياس ‎B‎.\n   الإجابة النموذجية: استخدام مدى تيارات أكبر وتكرار القراءات وقياس طول السلك داخل المجال بدقة (عرض قطبي المغناطيس).", "إرشاد للطالب: كتابة تقرير الاستقصاء 5-1 مع الرسم البياني\nإرشاد لولي الأمر: التأكد من إكمال الابن حساب ‎B‎ وعدم اليقين"], "h": ["<ol class=\"ol\"><li>يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا</li><li>يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: مغناطيس على شكل حرف ‎U‎، ميزان رقمي، سلك مثبت، مصدر تيار، أميتر، مقاومة متغيرة</span></div>", "<p>الميزان الرقمي، تغير القراءة، ‎F = Δm × g‎، ‎F‎ مقابل ‎I‎، الميل = ‎BL‎، عدم اليقين.</p>", "<p>يضع المعلم مغناطيسًا على ميزان رقمي ويمرر تيارًا في سلك ثابت بين قطبيه فتتغير قراءة الميزان، ويسأل: «لماذا تغيرت القراءة والسلك لا يلمس المغناطيس؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ العرض ويطرح السؤال</td><td>يربطون التغير بقوة متبادلة (قانون نيوتن الثالث)</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–24</span><br><small>20 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: الاستقصاء العملي، التعلم التعاوني</span><br>يوجه تنفيذ الاستقصاء العملي 5-1 (ص 152): قياس تغير القراءة لتيارات مختلفة</td><td>يسجلون ‎Δm‎ لكل تيار ويحسبون ‎F = Δm g‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">24–34</span><br><small>10 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يوجه رسم ‎F‎ مقابل ‎I‎ وحساب ‎B‎ من الميل وعدم اليقين</td><td>يرسمون ويحسبون ‎B‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">34–40</span><br><small>6 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تتغير قراءة الميزان؟</td><td>لأن السلك يؤثر على المغناطيس بقوة مساوية ومعاكسة للقوة التي يؤثر بها المجال على السلك.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>تغيرت القراءة بـ ‎2.04 g‎ عند ‎4.0 A‎ وطول السلك في المجال ‎0.050 m‎. احسب ‎B‎.</td><td>‎F = 0.00204 × 9.81 = 0.020 N‎؛ ‎B = 0.020 ÷ (4.0 × 0.050) = 0.10 T‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يمثل ميل خط ‎F‎ مقابل ‎I‎؟</td><td>‎BL‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الكمية التي نحسبها من تغير قراءة الميزان؟</td><td>القوة ‎F = Δm × g‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يجب أن يكون السلك عموديًا على المجال؟</td><td>لتكون القوة أكبر ما يمكن ويُطبق ‎F = BIL‎ مباشرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح تحسينين لدقة قياس ‎B‎.</td><td>استخدام مدى تيارات أكبر وتكرار القراءات وقياس طول السلك داخل المجال بدقة (عرض قطبي المغناطيس).</td></tr></table>", "<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 5-1 مع الرسم البياني</p><p><b>إرشاد لولي الأمر:</b> التأكد من إكمال الابن حساب ‎B‎ وعدم اليقين</p>"]}, {"axis": "مسائل متقدمة في القوى على الموصلات ومراجعة الأسئلة 4–12", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "المزيد عن القوى على الموصلات الحاملة لتيار كهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "مسائل متقدمة في القوى على الموصلات ومراجعة الأسئلة 4–12"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوعان 5-3 و5-4"], ["دليل المعلم", "ص 146–151"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي ص 152"]], "t": ["1. يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)\n2. يحل أسئلة مختارة من 4–12 في كتاب الطالب\nمخرج تعليمي آخر: يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: آلة حاسبة علمية", "اتزان القوى، سلك معلق في مجال، الكتلة لكل وحدة طول، الميزان التياري، الأخطاء الشائعة (‎cosθ‎، الوحدات).", "يعرض المعلم سلكًا أفقيًا معلقًا يرتفع عند تمرير تيار معين، ويسأل: «ما التيار اللازم لجعل السلك «يطفو» في المجال دون أن يسقط؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يقترحون مساواة القوة المغناطيسية بالوزن\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يحل مسألة السلك الطافي ‎(BIL = mg)‎ ويعالج أخطاء الوحدات و‎sin/cos‎\nالطالب: يتبعون الحل ويحسبون التيار\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل أسئلة مختارة من 4–12 وتحدي تصميم ميزان تياري\nالطالب: يحلون ويصممون في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على القوى المغناطيسية\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: سلك أفقي كتلته لكل وحدة طول ‎0.010 kg/m‎ في مجال أفقي ‎0.25 T‎ عمودي عليه. ما التيار الذي يجعله معلقًا؟\n   الإجابة النموذجية: ‎BIL = mg ← I = (0.010 × 9.81) ÷ 0.25 = 0.39 A‎.\n2) (المستوى المتوقع) السؤال: ما اتجاه القوة المغناطيسية اللازمة؟\n   الإجابة النموذجية: إلى أعلى، معاكسة للوزن.\n3) (المستوى المتقدم) السؤال: لماذا لا تعتمد الإجابة السابقة على طول السلك؟\n   الإجابة النموذجية: لأن الوزن والقوة المغناطيسية يتناسبان كلاهما مع الطول فيُختصر.", "1) (مستوى الدعم) السؤال: ما شرط اتزان السلك المعلق في المجال؟\n   الإجابة النموذجية: أن تساوي القوة المغناطيسية وزنه وتعاكسه في الاتجاه.\n2) (المستوى المتوقع) السؤال: لماذا يُعد استخدام ‎cosθ‎ في ‎F = BIL sinθ‎ خطأً شائعًا؟\n   الإجابة النموذجية: لأن θ هي الزاوية بين السلك والمجال، والقوة تتناسب مع ‎sinθ‎ لا ‎cosθ‎.\n3) (المستوى المتقدم) السؤال: صف مبدأ ميزان تياري لقياس ‎B‎.\n   الإجابة النموذجية: سلك على ذراع ميزان داخل المجال، تُوازن القوة المغناطيسية ‎BIL‎ بوزن معلوم، فنحسب ‎B = mg/(IL)‎.", "إرشاد للطالب: حل أسئلة مختارة من 4–12 ومسألة السلك المعلق\nإرشاد لولي الأمر: متابعة الابن في رسم مخطط القوى قبل الحل"], "h": ["<ol class=\"ol\"><li>يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)</li><li>يحل أسئلة مختارة من 4–12 في كتاب الطالب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة مختارة من 4–12 في كتاب الطالب</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه</td><td class=\"lv\">إبداع</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>اتزان القوى، سلك معلق في مجال، الكتلة لكل وحدة طول، الميزان التياري، الأخطاء الشائعة (‎cosθ‎، الوحدات).</p>", "<p>يعرض المعلم سلكًا أفقيًا معلقًا يرتفع عند تمرير تيار معين، ويسأل: «ما التيار اللازم لجعل السلك «يطفو» في المجال دون أن يسقط؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يقترحون مساواة القوة المغناطيسية بالوزن</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يحل مسألة السلك الطافي ‎(BIL = mg)‎ ويعالج أخطاء الوحدات و‎sin/cos‎</td><td>يتبعون الحل ويحسبون التيار</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه حل أسئلة مختارة من 4–12 وتحدي تصميم ميزان تياري</td><td>يحلون ويصممون في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على القوى المغناطيسية</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سلك أفقي كتلته لكل وحدة طول ‎0.010 kg/m‎ في مجال أفقي ‎0.25 T‎ عمودي عليه. ما التيار الذي يجعله معلقًا؟</td><td>‎BIL = mg ← I = (0.010 × 9.81) ÷ 0.25 = 0.39 A‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما اتجاه القوة المغناطيسية اللازمة؟</td><td>إلى أعلى، معاكسة للوزن.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تعتمد الإجابة السابقة على طول السلك؟</td><td>لأن الوزن والقوة المغناطيسية يتناسبان كلاهما مع الطول فيُختصر.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما شرط اتزان السلك المعلق في المجال؟</td><td>أن تساوي القوة المغناطيسية وزنه وتعاكسه في الاتجاه.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُعد استخدام ‎cosθ‎ في ‎F = BIL sinθ‎ خطأً شائعًا؟</td><td>لأن θ هي الزاوية بين السلك والمجال، والقوة تتناسب مع ‎sinθ‎ لا ‎cosθ‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صف مبدأ ميزان تياري لقياس ‎B‎.</td><td>سلك على ذراع ميزان داخل المجال، تُوازن القوة المغناطيسية ‎BIL‎ بوزن معلوم، فنحسب ‎B = mg/(IL)‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل أسئلة مختارة من 4–12 ومسألة السلك المعلق</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في رسم مخطط القوى قبل الحل</p>"]}]}, {"title": "الحث الكهرومغناطيسي", "sb": "الموضوع 5-5 (الأسئلة 13–21)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "مشاهدات تجارب الحث والعوامل المؤثرة في القوة الدافعة المستحثة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "الحث الكهرومغناطيسي"], ["الحصة", "1 من 3"], ["محور الحصة", "مشاهدات تجارب الحث والعوامل المؤثرة في القوة الدافعة المستحثة"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-5 (الأسئلة 13–21)"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي ص 141"]], "t": ["1. يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)\n2. يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)\nمخرج تعليمي آخر: يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: ملف، مغناطيس قوي، جلفانوميتر حساس، أسلاك", "الحث الكهرومغناطيسي، القوة الدافعة الكهربائية المستحثة، التيار المستحث، الحركة النسبية، عدد اللفات، سرعة التغير.", "يحرك المعلم مغناطيسًا داخل ملف موصول بجلفانوميتر فيتحرك المؤشر، ثم يثبته فيعود المؤشر للصفر، ويسأل: «لماذا ظهر تيار أثناء الحركة فقط؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يستنتجون أن التغير هو السبب\n2) (18 دقيقة: من الدقيقة 5 إلى 23)\nالاستراتيجية: الاستقصاء العملي\nالمعلم: ينفذ «العوامل التي تؤثر على مقدار شدة التيار الكهربائي الناتج عن قوة دافعة كهربائية مستحثة» بتغيير السرعة وعدد اللفات وقوة المغناطيس\nالطالب: يسجلون انحراف الجلفانوميتر في كل حالة\n3) (10 دقائق: من الدقيقة 23 إلى 33)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يناقش النتائج ويصحح استخدام «فرق الجهد المستحث» إلى «القوة الدافعة المستحثة»\nالطالب: يلخصون العوامل في جدول\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يدير السؤال المفصلي ثم التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: متى تتولد قوة دافعة كهربائية مستحثة في الملف؟\n   الإجابة النموذجية: عند وجود حركة نسبية بين المغناطيس والملف (تغير في الفيض المغناطيسي).\n2) (المستوى المتوقع) السؤال: اذكر ثلاثة عوامل تزيد القوة الدافعة المستحثة.\n   الإجابة النموذجية: زيادة سرعة الحركة، وزيادة عدد لفات الملف، واستخدام مغناطيس أقوى.\n3) (المستوى المتقدم) السؤال: لماذا ينعدم التيار عند تثبيت المغناطيس داخل الملف؟\n   الإجابة النموذجية: لأن الفيض المغناطيسي عبر الملف لا يتغير.", "1) (مستوى الدعم) السؤال: ما الفرق بين القوة الدافعة المستحثة والتيار المستحث؟\n   الإجابة النموذجية: القوة الدافعة تتولد دائمًا عند تغير الفيض، والتيار يتولد فقط إذا كانت الدائرة مغلقة.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لاتجاه انحراف الجلفانوميتر عند إخراج المغناطيس بدل إدخاله؟\n   الإجابة النموذجية: ينعكس.\n3) (المستوى المتقدم) السؤال: لماذا نستخدم مصطلح «القوة الدافعة الكهربائية المستحثة» لا «فرق الجهد المستحث»؟\n   الإجابة النموذجية: لأن الطاقة تتحول من حركية إلى كهربائية في الملف، وهذا يصف قوة دافعة لا فرق جهد عبر مكون مستهلك.", "إرشاد للطالب: مراجعة الموضوع 5-5 وتلخيص نتائج الاستقصاء\nإرشاد لولي الأمر: الحديث مع الابن عن الدراجة ذات المولد الصغير لإضاءة المصباح"], "h": ["<ol class=\"ol\"><li>يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)</li><li>يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث</td><td class=\"lv\">فهم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\ ار عند تثبيت المغناطيس داخل الملف؟</td><td>لأن الفيض المغناطيسي عبر الملف لا يتغير.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الفرق بين القوة الدافعة المستحثة والتيار المستحث؟</td><td>القوة الدافعة تتولد دائمًا عند تغير الفيض، والتيار يتولد فقط إذا كانت الدائرة مغلقة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لاتجاه انحراف الجلفانوميتر عند إخراج المغناطيس بدل إدخاله؟</td><td>ينعكس.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا نستخدم مصطلح «القوة الدافعة الكهربائية المستحثة» لا «فرق الجهد المستحث»؟</td><td>لأن الطاقة تتحول من حركية إلى كهربائية في الملف، وهذا يصف قوة دافعة لا فرق جهد عبر مكون مستهلك.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 5-5 وتلخيص نتائج الاستقصاء</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الدراجة ذات المولد الصغير لإضاءة المصباح</p>"]}, {"axis": "الفيض المغناطيسي Φ = ‎BA‎ والفيض الكلي ‎NΦ‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "الحث الكهرومغناطيسي"], ["الحصة", "2 من 3"], ["محور الحصة", "الفيض المغناطيسي Φ = ‎BA‎ والفيض الكلي ‎NΦ‎"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-5 (الأسئلة 13–21)"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي ص 141"]], "t": ["1. يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎\n2. يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎\nمخرج تعليمي آخر: يميز بين كثافة الفيض ‎B‎ والفيض Φ", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ملف مسطح وإطار مساحته معلومة", "الفيض المغناطيسي Φ، الويبر ‎Wb‎، Φ = ‎BA‎، الفيض الكلي ‎NΦ‎، الزاوية مع العمودي على المستوى، ‎Wb = T m²‎.", "يمسك المعلم إطارًا مربعًا ويديره في مجال مرسوم بخطوط متوازية على السبورة ويسأل: «متى يخترق الإطار أكبر عدد من الخطوط؟ ومتى لا يخترقه شيء؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يستنتجون أن العدد الأكبر عند التعامد\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: ينفذ «الفيض المغناطيسي والفيض المغناطيسي الكلي»: التعريف والويبر وΦ = ‎BA‎ و‎NΦ‎ وأثر الزاوية\nالطالب: يكتبون التعريفات ويحسبون أمثلة\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يقدم مسائل بزوايا مختلفة وعدد لفات\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب الفيض عبر ملف مساحته ‎0.010 m²‎ عمودي على مجال ‎0.40 T‎.\n   الإجابة النموذجية: Φ = ‎4.0 × 10⁻³ Wb‎.\n2) (المستوى المتوقع) السؤال: احسب الفيض الكلي إذا كان عدد اللفات 200.\n   الإجابة النموذجية: ‎NΦ = 0.80 Wb‎.\n3) (المستوى المتقدم) السؤال: ماذا يصبح الفيض إذا دار الملف حتى صار مستواه موازيًا للمجال؟\n   الإجابة النموذجية: صفرًا.", "1) (مستوى الدعم) السؤال: ما وحدة الفيض المغناطيسي؟\n   الإجابة النموذجية: الويبر ‎(Wb) = T m²‎.\n2) (المستوى المتوقع) السؤال: ما الفرق بين ‎B‎ وΦ؟\n   الإجابة النموذجية: ‎B‎ كثافة الفيض (لكل وحدة مساحة)، وΦ الفيض الكلي عبر مساحة معينة.\n3) (المستوى المتقدم) السؤال: ملف 100 لفة مساحته ‎0.020 m²‎ في مجال ‎0.30 T‎، والعمودي على مستواه يصنع ‎60°‎ مع المجال. احسب ‎NΦ‎.\n   الإجابة النموذجية: ‎NΦ = 100 × 0.30 × 0.020 × cos 60° = 0.30 Wb‎.", "إرشاد للطالب: مراجعة تعريفات الفيض وحل مسائل Φ و‎NΦ‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين كثافة الفيض والفيض"], "h": ["<ol class=\"ol\"><li>يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎</li><li>يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذل  141"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي ص 141"]], "t": ["1. يحل نشاط 5-3 «الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي»\n2. يحل الأسئلة 13–21 في كتاب الطالب\nمخرج تعليمي آخر: يحسب التغير في الفيض الكلي عند تدوير ملف أو إخراجه من المجال", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "التغير في الفيض ‎Δ(NΦ)‎، تدوير الملف ‎90°‎ و‎180°‎، إخراج الملف من المجال، مراجعة المفاهيم.", "يسأل المعلم: «ملف في مجال انقلب نصف دورة ‎(180°)‎؛ هل تغير الفيض عبره صفر لأنه عاد إلى الوضع نفسه؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يناقشون انعكاس اتجاه الفيض بالنسبة للملف\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يوجه حل نشاط 5-3 (ص 141)\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل الأسئلة 13–21 ومسائل التغير في الفيض\nالطالب: يحلون في مجموعات ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الحث والفيض\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما التغير في الفيض عند إخراج ملف ‎NΦ = 0.80 Wb‎ كليًا من المجال؟\n   الإجابة النموذجية: ‎0.80 Wb‎.\n2) (المستوى المتوقع) السؤال: ما التغير في الفيض عند تدوير الملف ‎90°‎ من وضع التعامد؟\n   الإجابة النموذجية: من 0.80 إلى صفر، أي ‎0.80 Wb‎.\n3) (المستوى المتقدم) السؤال: ما التغير عند تدويره ‎180°‎؟\n   الإجابة النموذجية: من +0.80 إلى −0.80، أي ‎1.6 Wb‎.", "1) (مستوى الدعم) السؤال: هل يكون التغير في الفيض صفرًا عند تدوير الملف ‎360°‎؟\n   الإجابة النموذجية: نعم، لأنه يعود إلى الوضع الأصلي نفسه.\n2) (المستوى المتوقع) السؤال: ما الكمية التي يعتمد عليها مقدار القوة الدافعة المستحثة؟\n   الإجابة النموذجية: معدل تغير الفيض الكلي.\n3) (المستوى المتقدم) السؤال: ملف 50 لفة مساحته ‎0.040 m²‎ عمودي على ‎0.20 T‎ قُلب ‎180°‎. احسب التغير في الفيض الكلي.\n   الإجابة النموذجية: ‎NΦ = 0.40 Wb‎؛ التغير = ‎0.80 Wb‎.", "إرشاد للطالب: إكمال نشاط 5-3 ص 141 والأسئلة 13–21\nإرشاد لولي الأمر: متابعة الابن في حساب التغير في الفيض بإشارته"], "h": ["<ol class=\"ol\"><li>يحل نشاط 5-3 «الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي»</li><li>يحل الأسئلة 13–21 في كتاب الطالب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب التغير في الفيض الكلي عند تدوير ملف أو إخراجه من المجال</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 5-3 «الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل الأسئلة 13–21 في كتاب الطالب</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب التغير في الفيض الكلي عند تدوير ملف أو إخراجه من المجال</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>التغير في الفيض ‎Δ(NΦ)‎، تدوير الملف ‎90°‎ و‎180°‎، إخراج الملف من المجال، مراجعة المفاهيم.</p>", "<p>يسأل المعلم: «ملف في مجال انقلب نصف دورة ‎(180°)‎؛ هل تغير الفيض عبره صفر لأنه عاد إلى الوضع نفسه؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يناقشون انعكاس اتجاه الفيض بالنسبة للملف</td></tr><tr مغناطيسي", "sb": "الموضوع 5-6 (الأسئلة 22–32)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "نص قانون فاراداي ومعادلته", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون فاراداي للحث الكهرومغناطيسي"], ["الحصة", "1 من 2"], ["محور الحصة", "نص قانون فاراداي ومعادلته"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-6 (الأسئلة 22–32)"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-4: قانون فاراداي للحث الكهرومغناطيسي وقانون لنز ص 144"]], "t": ["1. يذكر نص قانون فاراداي للحث الكهرومغناطيسي\n2. يستخدم المعادلة ε = ‎−Δ(NΦ)/Δt‎ لحساب مقدار القوة الدافعة المستحثة\nمخرج تعليمي آخر: يحسب القوة الدافعة المستحثة من تغير كثافة الفيض مع الزمن في ملف ثابت", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "قانون فاراداي، معدل تغير الفيض الكلي، ε = ‎−Δ(NΦ)/Δt‎، الإشارة السالبة (لنز)، تغير ‎B‎ مع ثبات المساحة.", "يطلب المعلم من الطلبة قراءة الموضوع 5-6 «قانون فاراداي للحث الكهرومغناطيسي» في كتاب الطالب ثم يسأل: «أي العوامل التي وجدتموها تجريبيًا في الدرس السابق تجمعها معادلة فاراداي؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يوجه القراءة ويطرح السؤال\nالطالب: يربطون العوامل التجريبية بالمعادلة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «قانون فاراداي للحث الكهرومغناطيسي»: النص والمعادلة ومعنى الإشارة السالبة\nالطالب: يكتبون النص ويحلون مثالًا\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل متدرجة بينها السؤال المفصلي (‎0.15 m²‎ و‎3.0 T/s‎)\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اذكر نص قانون فاراداي.\n   الإجابة النموذجية: مقدار القوة الدافعة الكهربائية المستحثة يتناسب طرديًا مع معدل تغير الفيض المغناطيسي الكلي.\n2) (المستوى المتوقع) السؤال: احسب القوة الدافعة المستحثة إذا تغير الفيض الكلي بمقدار ‎0.80 Wb‎ خلال ‎0.20 s‎.\n   الإجابة النموذجية: ε = ‎4.0 V‎.\n3) (المستوى المتقدم) السؤال: يتغير مجال بمعدل ‎3.0 T/s‎ عبر حلقة واحدة مساحتها ‎0.15 m²‎. احسب القوة الدافعة المستحثة.\n   الإجابة النموذجية: ε = ‎0.15 × 3.0 = 0.45 V‎.", "1) (مستوى الدعم) السؤال: إلى أي قانون تشير الإشارة السالبة في معادلة فاراداي؟\n   الإجابة النموذجية: قانون لنز.\n2) (المستوى المتوقع) السؤال: ماذا يحدث للقوة الدافعة إذا حدث التغير نفسه في نصف الزمن؟\n   الإجابة النموذجية: تتضاعف.\n3) (المستوى المتقدم) السؤال: ملف 500 لفة مساحته ‎4.0 × 10⁻³ m²‎ تغير المجال العمودي عليه من ‎0.10 T‎ إلى ‎0.50 T‎ خلال ‎0.020 s‎. احسب ε.\n   الإجابة النموذجية: ‎Δ(NΦ) = 500 × 4.0 × 10⁻³ × 0.40 = 0.80 Wb‎؛ ε = ‎40 V‎.", "إرشاد للطالب: مراجعة الموضوع 5-6 وحل مسائل قانون فاراداي\nإرشاد لولي الأمر: سؤال الابن عن العلاقة بين سرعة التغير ومقدار القوة الدافعة"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون فاراداي للحث الكهرومغناطيسي</li><li>يستخدم المعادلة ε = ‎−Δ(NΦ)/Δt‎ لحساب مقدار القوة الدافعة المستحثة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب القوة الدافعة المستحثة من تغير كثافة الفيض مع الزمن في ملف ثابت</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر نص قانون فاراداي للحث الكهرومغناطيسي</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم المعادلة ε = ‎−Δ(NΦ)/Δt‎ لحساب مقدار القوة الدافعة المستحثة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب القوة الدافعة المستحثة من تغير كثافة الفيض مع الزمن في ملف ثابت</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>قانون فاراداي، معدل تغير الفيض الكلي، ε = ‎−Δ(NΦ)/Δt‎، الإشارة السالبة (لنز)، تغير ‎B‎ مع ثبات المساحة.</p>", "<p>يطلب المعلم من الطلبة قراءة الموضوع 5-6 «قانون فاراداي للحث الكهرومغناطيسي» في كتاب الطالب ثم يسأل: «أي العوامل التي وجدتموها تجريبيًا في الدرس السابق تجمعها معادلة فاراداي؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يوجه القراءة ويطرح السؤال</td><td>يربطون العوامل التجريبية بالمعادلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ «قانون فاراداي للحث الكهرومغناطيسي»: النص والمعادلة ومعنى الإشارة السالبة</td><td>يكتبون النص ويحلون مثالًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل متدرجة بينها السؤال المفصلي (‎0.15 m²‎ و‎3.0 T/s‎)</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر نص قانون فاراداي.</td><td>مقدار القوة الدافعة الكهربائية المستحثة يتناسب طرديًا مع معدل تغير الفيض المغناطيسي الكلي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب القوة الدافعة المستحثة إذا تغير الفيض الكلي بمقدار ‎0.80 Wb‎ خلال ‎0.20 s‎.</td><td>ε = ‎4.0 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>يتغير مجال بمعدل ‎3.0 T/s‎ عبر حلقة واحدة مساحتها ‎0.15 m²‎. احسب القوة الدافعة المستحثة.</td><td>ε = ‎0.15 × 3.0 = 0.45 V‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>إلى أي قانون تشير الإشارة السالبة في معادلة فاراداي؟</td><td>قانون لنز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث للقوة الدافعة إذا حدث التغير نفسه في نصف الزمن؟</td><td>تتضاعف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ملف 500 لفة مساحته ‎4.0 × 10⁻³ m²‎ تغير المجال العمودي عليه من ‎0.10 T‎ إلى ‎0.50 T‎ خلال ‎0.020 s‎. احسب ε.</td><td>‎Δ(NΦ) = 500 × 4.0 × 10⁻³ × 0.40 = 0.80 Wb‎؛ ε = ‎40 V‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 5-6 وحل مسائل قانون فاراداي</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن العلاقة بين سرعة التغير ومقدار القوة الدافعة</p>"]}, {"axis": "القوة الدافعة المستحثة في سلك متحرك ونشاط 5-4", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون فاراداي للحث الكهرومغناطيسي"], ["الحصة", "2 من 2"], ["محور الحصة", "القوة الدافعة المستحثة في سلك متحرك ونشاط 5-4"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-6 + كتاب التجارب ص 144"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-4: قانون فاراداي للحث الكهرومغناطيسي وقانون لنز ص 144"]], "t": ["1. يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي\n2. يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»\nمخرج تعليمي آخر: يشتق ε = ‎BLv‎ من معدل المساحة التي يقطعها السلك", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "السلك المتحرك، المساحة المقطوعة، ε = ‎BLv‎، قطع خطوط الفيض، الطائرات وأجنحتها في المجال الأرضي.", "يسأل المعلم: «جناحا طائرة فلزيان يتحركان بسرعة كبيرة في المجال المغناطيسي الأرضي؛ هل تتولد قوة دافعة بين طرفيهما؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يطرح السؤال\nالطالب: يتوقعون حدوث حث بسبب قطع خطوط المجال\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يشتق ε = ‎BLv‎ من ‎Δ(Φ)/Δt = B × (L × vΔt)/Δt‎ ويحل مثالًا\nالطالب: يتبعون الاشتقاق ويحسبون\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 5-4 (ص 144)\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اشتق ε = ‎BLv‎.\n   الإجابة النموذجية: في زمن ‎Δt‎ يقطع السلك مساحة ‎LvΔt‎، فيتغير الفيض ‎BLvΔt‎، وε = ‎BLvΔt/Δt = BLv‎.\n2) (المستوى المتوقع) السؤال: احسب ε لسلك طوله ‎0.20 m‎ يتحرك بسرعة ‎3.0 m/s‎ عموديًا على مجال ‎0.50 T‎.\n   الإجابة النموذجية: ε = ‎0.30 V‎.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لـ ε إذا تحرك السلك موازيًا للمجال؟\n   الإجابة النموذجية: تنعدم لأنه لا يقطع خطوط الفيض.", "1) (مستوى الدعم) السؤال: اكتب معادلة القوة الدافعة في سلك متحرك عموديًا على المجال.\n   الإجابة النموذجية: ε = ‎BLv‎\n2) (المستوى المتوقع) السؤال: كيف تتغير ε إذا تضاعفت سرعة السلك؟\n   الإجابة النموذجية: تتضاعف.\n3) (المستوى المتقدم) السؤال: جناحا طائرة طولهما ‎30 m‎ تطير بسرعة ‎250 m/s‎، والمركبة الرأسية للمجال الأرضي ‎4.0 × 10⁻⁵ T‎. احسب ε.\n   الإجابة النموذجية: ε = ‎4.0 × 10⁻⁵ × 30 × 250 = 0.30 V‎.", "إرشاد للطالب: إكمال نشاط 5-4 ص 144 وحل مسائل ε = ‎BLv‎\nإرشاد لولي الأمر: الحديث مع الابن عن الحث في أجنحة الطائرات"], "h": ["<ol class=\"ol\"><li>يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي</li><li>يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يشتق ε = ‎BLv‎ من معدل المساحة التي يقطعها السلك</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يشتق ε = ‎BLv‎ من معدل المساحة التي يقطعها السلك</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>السلك المتحرك، المساحة المقطوعة، ε = ‎BLv‎، قطع خطوط الفيض، الطائرات وأجنحتها في المجال الأرضي.</p>", "<p>يسأل المعلم: «جناحا طائرة فلزيان يتحركان بسرعة كبيرة في المجال المغناطيسي الأرضي؛ هل تتولد قوة دافعة بين طرفيهما؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يطرح السؤال</td><td>يتوقعون حدوث حث بسبب قطع خطوط المجال</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالنمذجة</span><br>يشتق ε = ‎BLv‎ من ‎Δ(Φ)/Δt = B × (L × vΔt)/Δt‎ ويحل مثالًا</td><td>يتبعون الاشتقاق ويحسبون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه حل نشاط 5-4 (ص 144)</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اشتق ε = ‎BLv‎.</td><td>في زمن ‎Δt‎ يقطع السلك مساحة ‎LvΔt‎، فيتغير الفيض ‎BLvΔt‎، وε = ‎BLvΔt/Δt = BLv‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ε لسلك طوله ‎0.20 m‎ يتحرك بسرعة ‎3.0 m/s‎ عموديًا على مجال ‎0.50 T‎.</td><td>ε = ‎0.30 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث لـ ε إذا تحرك السلك موازيًا للمجال؟</td><td>تنعدم لأنه لا يقطع خطوط الفيض.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة القوة الدافعة في سلك متحرك عموديًا على المجال.</td><td>ε = ‎BLv‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف تتغير ε إذا تضاعفت سرعة السلك؟</td><td>تتضاعف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>جناحا طائرة طولهما ‎30 m‎ تطير بسرعة ‎250 m/s‎، والمركبة الرأسية للمجال الأرضي ‎4.0 × 10⁻⁵ T‎. احسب ε.</td><td>ε = ‎4.0 × 10⁻⁵ × 30 × 250 = 0.30 V‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 5-4 ص 144 وحل مسائل ε = ‎BLv‎</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الحث في أجنحة الطائرات</p>"]}]}, {"title": "قانون لنز", "sb": "الموضوع 5-7 (الأسئلة 22–32)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "نص قانون لنز وارتباطه بحفظ الطاقة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون لنز"], ["الحصة", "1 من 2"], ["محور الحصة", "نص قانون لنز وارتباطه بحفظ الطاقة"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-7 (الأسئلة 22–32)"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-5: المزيد حول قانون فاراداي ص 147"]], "t": ["1. يذكر نص قانون لنز ويحدد به اتجاه التيار المستحث\n2. يشرح قانون لنز بوصفه نتيجة لقانون حفظ الطاقة\nمخرج تعليمي آخر: يحدد قطبية طرف الملف المواجه للمغناطيس عند إدخاله وإخراجه", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: أنبوب نحاسي ومغناطيس قوي صغير وأنبوب بلاستيكي للمقارنة", "قانون لنز، التيار المستحث يقاوم التغير المسبب له، حفظ الطاقة، القطبية المستحثة، الإبطاء المغناطيسي.", "يسقط المعلم مغناطيسًا قويًا في أنبوب بلاستيكي ثم في أنبوب نحاسي فيسقط في الثاني ببطء شديد، ويسأل: «النحاس ليس مغناطيسيًا؛ فما الذي أبطأ المغناطيس؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يقترحون تيارات مستحثة في النحاس\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «قانون لنز – قانون عام للقوة الدافعة الكهربائية المستحثة» ويشرح ارتباطه بحفظ الطاقة\nالطالب: يحددون اتجاه التيار وقطبية الملف في حالات الإدخال والإخراج\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم حالات متنوعة لتحديد اتجاه التيار المستحث\nالطالب: يحللون في أزواج ويبررون بالقانون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اذكر نص قانون لنز.\n   الإجابة النموذجية: يكون اتجاه التيار (أو القوة الدافعة) المستحث بحيث يقاوم التغير الذي سببه.\n2) (المستوى المتوقع) السؤال: عند إدخال القطب الشمالي لمغناطيس في ملف، ما قطبية طرف الملف المواجه له؟\n   الإجابة النموذجية: شمالي، ليتنافر معه ويقاوم الإدخال.\n3) (المستوى المتقدم) السؤال: لماذا يُعد قانون لنز نتيجة لحفظ الطاقة؟\n   الإجابة النموذجية: لأنه لو ساعد التيار المستحث التغير لتولدت طاقة كهربائية دون بذل شغل، وهذا يخالف حفظ الطاقة.", "1) (مستوى الدعم) السؤال: ما الذي يقاومه التيار المستحث؟\n   الإجابة النموذجية: التغير في الفيض الذي سببه.\n2) (المستوى المتوقع) السؤال: عند إخراج القطب الشمالي من الملف، ما قطبية الطرف المواجه؟\n   الإجابة النموذجية: جنوبي، ليجذب المغناطيس ويقاوم الإخراج.\n3) (المستوى المتقدم) السؤال: لماذا يسقط المغناطيس ببطء في الأنبوب النحاسي؟\n   الإجابة النموذجية: تتولد فيه تيارات مستحثة تنتج مجالات تقاوم حركة المغناطيس وفق قانون لنز، فتتحول طاقته الحركية إلى حرارة.", "إرشاد للطالب: مراجعة الموضوع 5-7 وحالات تحديد اتجاه التيار المستحث\nإرشاد لولي الأمر: سؤال الابن عن تجربة المغناطيس الساقط في الأنبوب النحاسي"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون لنز ويحدد به اتجاه التيار المستحث</li><li>يشرح قانون لنز بوصفه نتيجة لقانون حفظ الطاقة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد قطبية طرف الملف المواجه للمغناطيس عند إدخاله وإخراجه</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر نص قانون لنز ويحدد به اتجاه التيار المستحث</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح قانون لنز بوصفه نتيجة لقانون حفظ الطاقة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد قطبية طرف الملف المواجه للمغناطيس عند إدخاله وإخراجه</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: أنبوب نحاسي ومغناطيس قوي صغير وأنبوب بلاستيكي للمقارنة</span></div>", "<p>قانون لنز، التيار المستحث يقاوم التغير المسبب له، حفظ الطاقة، القطبية المستحثة، الإبطاء المغناطيسي.</p>", "<p>يسقط المعلم مغناطيسًا قويًا في أنبوب بلاستيكي ثم في أنبوب نحاسي فيسقط في الثاني ببطء شديد، ويسأل: «النحاس ليس مغناطيسيًا؛ فما الذي أبطأ المغناطيس؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ العرض ويطرح السؤال</td><td>يقترحون تيارات مستحثة في النحاس</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ «قانون لنز – قانون عام للقوة الدافعة الكهربائية المستحثة» ويشرح ارتباطه بحفظ الط 5", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون لنز"], ["الحصة", "2 من 2"], ["محور الحصة", "قاعدة فليمنج لليد اليمنى ونشاط 5-5"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-7 + كتاب التجارب ص 147"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-5: المزيد حول قانون فاراداي ص 147"]], "t": ["1. يحلل التيار الكهربائي المستحث في سلك متحرك باستخدام قاعدة فليمنج لليد اليمنى\n2. يحل نشاط 5-5 «المزيد حول قانون فاراداي»\nمخرج تعليمي آخر: يربط قاعدة فليمنج لليد اليمنى بقانون لنز بتحديد اتجاه القوة على السلك المستحث", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "قاعدة فليمنج لليد اليمنى (الإبهام: الحركة، السبابة: المجال، الوسطى: التيار المستحث)، المولد، التمييز بين اليدين.", "يسأل المعلم: «استخدمنا اليد اليسرى للمحرك؛ أي يد نستخدم للمولد؟ ولماذا يختلف الاثنان؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يطرح السؤال\nالطالب: يميزون بين تحويل الطاقة في المحرك والمولد\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يشرح قاعدة فليمنج لليد اليمنى ويطبقها على سلك متحرك ويتحقق من اتساقها مع لنز\nالطالب: يطبقون القاعدة ويحددون اتجاه القوة المعاكسة للحركة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 5-5 (ص 147)\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ماذا يمثل كل إصبع في قاعدة فليمنج لليد اليمنى؟\n   الإجابة النموذجية: الإبهام: الحركة، السبابة: المجال، الوسطى: التيار المستحث.\n2) (المستوى المتوقع) السؤال: ما القاعدة المستخدمة للمولدات؟\n   الإجابة النموذجية: قاعدة فليمنج لليد اليمنى.\n3) (المستوى المتقدم) السؤال: كيف تتسق القاعدة مع قانون لنز؟\n   الإجابة النموذجية: التيار المستحث الذي تحدده اليد اليمنى يولد قوة (باليد اليسرى) تعاكس اتجاه الحركة.", "1) (مستوى الدعم) السؤال: ما الفرق بين استخدام اليد اليسرى واليمنى؟\n   الإجابة النموذجية: اليسرى للقوة على سلك يحمل تيارًا (المحرك)، واليمنى للتيار المستحث في سلك متحرك (المولد).\n2) (المستوى المتوقع) السؤال: إذا عُكس اتجاه الحركة، فماذا يحدث للتيار المستحث؟\n   الإجابة النموذجية: ينعكس اتجاهه.\n3) (المستوى المتقدم) السؤال: سلك يتحرك إلى أعلى في مجال يتجه نحو الشمال؛ كيف تحدد اتجاه التيار المستحث؟\n   الإجابة النموذجية: بتوجيه الإبهام لأعلى والسبابة نحو الشمال، فيشير الإصبع الأوسط إلى اتجاه التيار المستحث.", "إرشاد للطالب: إكمال نشاط 5-5 ص 147 والتدرب على قاعدتي اليدين\nإرشاد لولي الأمر: متابعة الابن في التمييز بين قاعدتي اليد اليسرى واليمنى"], "h": ["<ol class=\"ol\"><li>يحلل التيار الكهربائي المستحث في سلك متحرك باستخدام قاعدة فليمنج لليد اليمنى</li><li>يحل نشاط 5-5 «المزيد حول قانون فاراداي»</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط قاعدة فليمنج لليد اليمنى بقانون لنز بتحديد اتجاه القوة على السلك المستحث</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحلل التيار الكهربائي المستحث في سلك متحرك باستخدام قاعدة فليمنج لليد اليمنى</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 5-5 «المزيد حول قانون فاراداي»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط قاعدة فليمنج لليد اليمنى بقانون لنز بتحديد اتجاه القوة على السلك المستحث</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>قاعدة فليمنج لليد اليمنى (الإبهام: الحركة، السبابة: المجال، المستحث في سلك متحرك (المولد).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>إذا عُكس اتجاه الحركة، فماذا يحدث للتيار المستحث؟</td><td>ينعكس اتجاهه.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>سلك يتحرك إلى أعلى في مجال يتجه نحو الشمال؛ كيف تحدد اتجاه التيار المستحث؟</td><td>بتوجيه الإبهام لأعلى والسبابة نحو الشمال، فيشير الإصبع الأوسط إلى اتجاه التيار المستحث.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 5-5 ص 147 والتدرب على قاعدتي اليدين</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين قاعدتي اليد اليسرى واليمنى</p>"]}]}, {"title": "تطبيقات الحث الكهرومغناطيسي", "sb": "الموضوع 5-8 (الأسئلة 22–32)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "أمثلة من الحياة الواقعية للحث الكهرومغناطيسي والتخطيط لرفع حلقة فلزية", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "تطبيقات الحث الكهرومغناطيسي"], ["الحصة", "1 من 1"], ["محور الحصة", "أمثلة من الحياة الواقعية للحث الكهرومغناطيسي والتخطيط لرفع حلقة فلزية"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-8 (الأسئلة 22–32)"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 5-2: التخطيط لرفع حلقة فلزية فوق ملف حامل لتيار كهربائي ص 157"]], "t": ["1. يشرح أمثلة من الحياة الواقعية للحث الكهرومغناطيسي (المولد الكهربائي، الطهي بالحث، كاشف الفلزات)\n2. يخطط استقصاءً لرفع حلقة فلزية فوق ملف حامل لتيار متردد (الاستقصاء العملي 5-2)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الخامسة ويحل أسئلة مختارة من نهاية الوحدة", "المخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج الآخر: تقييم", "- التعلم المبني على المشاريع\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: ملف بقلب حديدي وحلقة ألومنيوم (إن توفرت)، كتاب التجارب العملية والأنشطة", "المولد الكهربائي، الطهي بالحث، كاشف الفلزات، الحلقة القافزة، التيار المتردد، التخطيط للاستقصاء.", "يعرض المعلم مقطعًا قصيرًا لحلقة ألومنيوم تقفز فوق ملف عند تشغيل التيار، ويسأل: «لماذا قفزت الحلقة؟ وما علاقة ذلك بقانوني فاراداي ولنز؟»", "1) (4 دقائق: من الدقيقة 0 إلى 4)\nالاستراتيجية: التعلم المبني على المشاريع\nالمعلم: يعرض المقطع ويطرح السؤال\nالطالب: يفسرون بتيار مستحث في الحلقة يقاوم التغير\n2) (14 دقيقة: من الدقيقة 4 إلى 18)\nالاستراتيجية: التعلم المبني على المشاريع\nالمعلم: ينفذ «أمثلة من الحياة الواقعية للحث الكهرومغناطيسي»: كل مجموعة تشرح مثالًا (المولد، الطهي بالحث، كاشف الفلزات)\nالطالب: يعدون شرحًا قصيرًا ويعرضونه\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم المبني على اللعب\nالمعلم: يوجه تخطيط الاستقصاء العملي 5-2 (ص 157): المتغيرات، الأجهزة، خطوات العمل، السلامة\nالطالب: يكتبون خطة الاستقصاء ويرسمون مخطط الأجهزة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الخامسة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كيف يولد المولد الكهربائي قوة دافعة؟\n   الإجابة النموذجية: يدور ملف في مجال مغناطيسي فيتغير الفيض عبره باستمرار فتتولد قوة دافعة مستحثة.\n2) (المستوى المتوقع) السؤال: لماذا لا يسخن طباخ الحث إلا الأواني الفلزية؟\n   الإجابة النموذجية: لأن التيارات المستحثة تتولد في الفلز الموصل فتسخنه، ولا تتولد في الزجاج أو الخشب.\n3) (المستوى المتقدم) السؤال: ما المتغير المستقل المناسب في استقصاء رفع الحلقة؟\n   الإجابة النموذجية: شدة التيار في الملف (أو عدد اللفات أو مادة الحلقة).", "1) (مستوى الدعم) السؤال: لماذا يجب استخدام تيار متردد في الملف لرفع الحلقة باستمرار؟\n   الإجابة النموذجية: لأن التيار المتردد يغير الفيض باستمرار فتتولد قوة دافعة مستحثة مستمرة في الحلقة.\n2) (المستوى المتوقع) السؤال: اذكر احتياطًا للسلامة في الاستقصاء 5-2.\n   الإجابة النموذجية: الحذر من سخونة الحلقة والملف، وعدم لمس الأسلاك المكشوفة، وفصل المصدر بعد كل قراءة.\n3) (المستوى المتقدم) السؤال: قيّم تعلمك في الوحدة الخامسة واقترح خطة لمراجعة موضوع تحتاج إليه.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية للمراجعة قبل الاختبار.", "إرشاد للطالب: كتابة خطة الاستقصاء 5-2 وحل أسئلة مختارة من نهاية الوحدة الخامسة (22–32) وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات"], "h": ["<ol class=\"ol\"><li>يشرح أمثلة من الحياة الواقعية للحث الكهرومغناطيسي (المولد الكهربائي، الطهي بالحث، كاشف الفلزات)</li><li>يخطط استقصاءً لرفع حلقة فلزية فوق ملف حامل لتيار متردد (الاستقصاء العملي 5-2)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الخامسة ويحل أسئلة مختارة من نهاية الوحدة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح أمثلة من الحياة الواقعية للحث الكهرومغناطيسي (المولد الكهربائي، الطهي بالحث، كاشف الفلزات)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يخطط استقصاءً لرفع حلقة فلزية فوق ملف حامل لتيار متردد (الاستقصاء العملي 5-2)</td><td class=\"lv\">إبداع</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الخامسة ويحل أسئلة مختارة من نهاية الوحدة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على المشاريع</span><span class=\"chip\">التعلم المبني على اللعب</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: ملف بقلب حديدي وحلقة ألومنيوم (إن توفرت)، كتاب التجارب العملية والأنشطة</span></div>", "<p>المولد الكهربائي، الطهي بالحث، كاشف الفلزات، الحلقة القافزة، التيار المتردد، التخطيط للاستقصاء.</p>", "<p>يعرض المعلم مقطعًا قصيرًا لحلقة ألومنيوم تقفز فوق ملف عند تشغيل التيار، ويسأل: «لماذا قفزت الحلقة؟ وما علاقة ذلك بقانوني فاراداي ولنز؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على المشاريع</span><br>يعرض المقطع ويطرح السؤال</td><td>يفسرون بتيار مستحث في الحلقة يقاوم التغير</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–18</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على المشاريع</span><br>ينفذ «أمثلة من الحياة الواقعية للحث الكهرومغناطيسي»: كل مجموعة تشرح مثالًا (المولد، الطهي بالحث، كاشف الفلزات)</td><td>يعدون شرحًا قصيرًا ويعرضونه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على اللعب</span><br>يوجه تخطيط الاستقصاء العملي 5-2 (ص 157): المتغيرات، الأجهزة، خطوات العمل، السلامة</td><td>يكتبون خطة الاستقصاء ويرسمون مخطط الأجهزة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة الخامسة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف يولد المولد الكهربائي قوة دافعة؟</td><td>يدور ملف في مجال مغناطيسي فيتغير الفيض عبره باستمرار فتتولد قوة دافعة مستحثة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يسخن طباخ الحث إلا الأواني الفلزية؟</td><td>لأن التيارات المستحثة تتولد في الفلز الموصل فتسخنه، ولا تتولد في الزجاج أو الخشب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما المتغير المستقل المناسب في استقصاء رفع الحلقة؟</td><td>شدة التيار في الملف (أو عدد اللفات أو مادة الحلقة).</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يجب استخدام تيار متردد في الملف لرفع الحلقة باستمرار؟</td><td>لأن التيار المتردد يغير الفيض باستمرار فتتولد قوة دافعة مستحثة مستمرة في الحلقة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر احتياطًا للسلامة في الاستقصاء 5-2.</td><td>الحذر من سخونة الحلقة والملف، وعدم لمس الأسلاك المكشوفة، وفصل المصدر بعد كل قراءة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم تعلمك في الوحدة الخامسة واقترح خطة لمراجعة موضوع تحتاج إليه.</td><td>إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية للمراجعة قبل الاختبار.</td></tr></table>", "<p><b>إرشاد للطالب:</b> كتابة خطة الاستقصاء 5-2 وحل أسئلة مختارة من نهاية الوحدة الخامسة (22–32) وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات</p>"]}]}];
let st={m:'sep',l:0,p:0};
try{const s=JSON.parse(localStorage.getItem('noorcopy_'+document.title)||'null');if(s&&D[s.l])st=s;}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('noorcopy_'+document.title,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function buildSelect(){let h='',u='';D.forEach((L,i)=>{if(L.unit!==u){if(u)h+='</optgroup>';u=L.unit;h+=`<optgroup label="${esc(u)}">`}h+=`<option value="${i}">${esc(L.title)} (${L.periods.length} حصص)</option>`});h+='</optgroup>';$('les').innerHTML=h}
function render(){
 const L=D[st.l];if(st.p>=L.periods.length)st.p=0;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));
 $('status').textContent=st.m==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة ${st.p+1} من ${L.periods.length}`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم ${L.periods.length} حصص`;
 $('les').value=st.l;
 const tabs=$('tabs');
 if(st.m==='sep'){tabs.style.display='flex';tabs.innerHTML=L.periods.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}">الحصة ${p.n}: ${esc(p.axis)}</button>`).join('')}
 else tabs.style.display='none';
 let rows='';
 if(st.m==='sep'){const hi=L.periods[st.p].hi;rows=hi.map((r,k)=>`<div class="${k===4?'w':''}"><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')}
 else{const h0=L.periods[0].hi;rows=[h0[0],h0[1],h0[2]].map(r=>`<div><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')+
  `<div><b>كتاب الطالب:</b>${esc(L.sb)}</div><div><b>${h0[7][0]}:</b>${esc(h0[7][1])}</div><div><b>${h0[8][0]}:</b>${esc(h0[8][1])}</div>`+
  `<div class="w"><b>الحصص:</b><br>${L.periods.map(p=>`الحصة ${p.n}: ${esc(p.axis)} — ${esc(p.hi[5][1])}`).join('<br>')}</div>`}
 $('info').innerHTML=rows;
 $('cards').innerHTML=FIELDS.map((f,i)=>`<div class="card"><div class="ch"><div class="ct"><span class="num">${i+1}</span>${f}</div><button class="copy" data-f="${i}">نسخ</button></div><div class="cb" id="cb${i}">${fieldHtml(i)}</div></div>`).join('');
 save();
}
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#mode button');if(m){st.m=m.dataset.m;render();return}
 const tb=e.target.closest('#tabs button');if(tb){st.p=+tb.dataset.i;render();return}
 const c=e.target.closest('.copy');if(c){const i=+c.dataset.f,t=fieldText(i);let ok=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);ok=true}catch(err){}}
  if(!ok)ok=legacyCopy(t);
  if(ok)done(c);else fallback(i,t);}
});
$('les').addEventListener('change',e=>{st.l=+e.target.value;st.p=0;render()});
buildSelect();render();
</script>
