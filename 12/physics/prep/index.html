مستوى الاستدلال: لماذا ينعدم التيار عند تثبيت المغناطيس داخل الملف؟\n• الإجابة النموذجية: لأن الفيض المغناطيسي عبر الملف لا يتغير.", "1. مستوى المعرفة: ما الفرق بين القوة الدافعة المستحثة والتيار المستحث؟\n• الإجابة النموذجية: القوة الدافعة تتولد دائمًا عند تغير الفيض، والتيار يتولد فقط إذا كانت الدائرة مغلقة.\n\n2. مستوى التطبيق: ماذا يحدث لاتجاه انحراف الجلفانوميتر عند إخراج المغناطيس بدل إدخاله؟\n• الإجابة النموذجية: ينعكس.\n\n3. مستوى الاستدلال: لماذا نستخدم مصطلح «القوة الدافعة الكهربائية المستحثة» لا «فرق الجهد المستحث»؟\n• الإجابة النموذجية: لأن الطاقة تتحول من حركية إلى كهربائية في الملف، وهذا يصف قوة دافعة لا فرق جهد عبر مكون مستهلك.", "إرشاد للطالب: مراجعة الموضوع 5-5 وتلخيص نتائج الاستقصاء\nإرشاد لولي الأمر: الحديث مع الابن عن الدراجة ذات المولد الصغير لإضاءة المصباح\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25"], "h": ["<ol class=\"ol\"><li>يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)<\/li><li>يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: ملف، مغناطيس قوي، جلفانوميتر حساس، أسلاك<\/span><\/div>", "<p>الحث الكهرومغناطيسي، القوة الدافعة الكهربائية المستحثة، التيار المستحث، الحركة النسبية، عدد اللفات، سرعة التغير.<\/p>", "<p>يحرك المعلم مغناطيسًا داخل ملف موصول بجلفانوميتر فيتحرك المؤشر، ثم يثبته فيعود المؤشر للصفر، ويسأل: «لماذا ظهر تيار أثناء الحركة فقط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يستنتجون أن التغير هو السبب (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «العوامل التي تؤثر على مقدار شدة التيار الكهربائي الناتج عن قوة دافعة كهربائية مستحثة» بتغيير السرعة وعدد اللفات وقوة المغناطيس، والطلبة يسجلون انحراف الجلفانوميتر في كل حالة (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يناقش المعلم النتائج ويصحح استخدام «فرق الجهد المستحث» إلى «القوة الدافعة المستحثة»، والطلبة يلخصون العوامل في جدول (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي ثم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> متى تتولد قوة دافعة كهربائية مستحثة في الملف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عند وجود حركة نسبية بين المغناطيس والملف (تغير في الفيض المغناطيسي).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر ثلاثة عوامل تزيد القوة الدافعة المستحثة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: زيادة سرعة الحركة، وزيادة عدد لفات الملف، واستخدام مغناطيس أقوى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ينعدم التيار عند تثبيت المغناطيس داخل الملف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الفيض المغناطيسي عبر الملف لا يتغير.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق بين القوة الدافعة المستحثة والتيار المستحث؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوة الدافعة تتولد دائمًا عند تغير الفيض، والتيار يتولد فقط إذا كانت الدائرة مغلقة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لاتجاه انحراف الجلفانوميتر عند إخراج المغناطيس بدل إدخاله؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ينعكس.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نستخدم مصطلح «القوة الدافعة الكهربائية المستحثة» لا «فرق الجهد المستحث»؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الطاقة تتحول من حركية إلى كهربائية في الملف، وهذا يصف قوة دافعة لا فرق جهد عبر مكون مستهلك.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 5-5 وتلخيص نتائج الاستقصاء<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الدراجة ذات المولد الصغير لإضاءة المصباح<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25<\/p>"]}, {"axis": "الفيض المغناطيسي Φ = ‎BA‎ والفيض الكلي ‎NΦ‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "الحث الكهرومغناطيسي"], ["الحصة", "2 من 3"], ["محور الحصة", "الفيض المغناطيسي Φ = ‎BA‎ والفيض الكلي ‎NΦ‎"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-5 (الأسئلة 13–21)"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي ص 141"]], "t": ["1. يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎\n2. يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎\nمخرج تعليمي آخر: يميز بين كثافة الفيض ‎B‎ والفيض Φ", "1. تطبيق: يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎\n2. تطبيق: يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎\n3. فهم (مخرج آخر): يميز بين كثافة الفيض ‎B‎ والفيض Φ", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ملف مسطح وإطار مساحته معلومة", "الفيض المغناطيسي Φ، الويبر ‎Wb‎، Φ = ‎BA‎، الفيض الكلي ‎NΦ‎، الزاوية مع العمودي على المستوى، ‎Wb = T m²‎.", "يمسك المعلم إطارًا مربعًا ويديره في مجال مرسوم بخطوط متوازية على السبورة ويسأل: «متى يخترق الإطار أكبر عدد من الخطوط؟ ومتى لا يخترقه شيء؟»", "1. ينفذ المعلم العرض ويطرح السؤال، والطلبة يستنتجون أن العدد الأكبر عند التعامد (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «الفيض المغناطيسي والفيض المغناطيسي الكلي»: التعريف والويبر وΦ = ‎BA‎ و‎NΦ‎ وأثر الزاوية، والطلبة يكتبون التعريفات ويحسبون أمثلة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم مسائل بزوايا مختلفة وعدد لفات، والطلبة يحلون في أزواج (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. مستوى المعرفة: احسب الفيض عبر ملف مساحته ‎0.010 m²‎ عمودي على مجال ‎0.40 T‎.\n• الإجابة النموذجية: Φ = ‎4.0 × 10⁻³ Wb‎.\n\n2. مستوى التطبيق: احسب الفيض الكلي إذا كان عدد اللفات 200.\n• الإجابة النموذجية: ‎NΦ = 0.80 Wb‎.\n\n3. مستوى الاستدلال: ماذا يصبح الفيض إذا دار الملف حتى صار مستواه موازيًا للمجال؟\n• الإجابة النموذجية: صفرًا.", "1. مستوى المعرفة: ما وحدة الفيض المغناطيسي؟\n• الإجابة النموذجية: الويبر ‎(Wb) = T m²‎.\n\n2. مستوى التطبيق: ما الفرق بين ‎B‎ وΦ؟\n• الإجابة النموذجية: ‎B‎ كثافة الفيض (لكل وحدة مساحة)، وΦ الفيض الكلي عبر مساحة معينة.\n\n3. مستوى الاستدلال: ملف 100 لفة مساحته ‎0.020 m²‎ في مجال ‎0.30 T‎، والعمودي على مستواه يصنع ‎60°‎ مع المجال. احسب ‎NΦ‎.\n• الإجابة النموذجية: ‎NΦ = 100 × 0.30 × 0.020 × cos 60° = 0.30 Wb‎.", "إرشاد للطالب: مراجعة تعريفات الفيض وحل مسائل Φ و‎NΦ‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين كثافة الفيض والفيض\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25"], "h": ["<ol class=\"ol\"><li>يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎<\/li><li>يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين كثافة الفيض ‎B‎ والفيض Φ<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يميز بين كثافة الفيض ‎B‎ والفيض Φ<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: ملف مسطح وإطار مساحته معلومة<\/span><\/div>", "<p>الفيض المغناطيسي Φ، الويبر ‎Wb‎، Φ = ‎BA‎، الفيض الكلي ‎NΦ‎، الزاوية مع العمودي على المستوى، ‎Wb = T m²‎.<\/p>", "<p>يمسك المعلم إطارًا مربعًا ويديره في مجال مرسوم بخطوط متوازية على السبورة ويسأل: «متى يخترق الإطار أكبر عدد من الخطوط؟ ومتى لا يخترقه شيء؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يستنتجون أن العدد الأكبر عند التعامد (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «الفيض المغناطيسي والفيض المغناطيسي الكلي»: التعريف والويبر وΦ = ‎BA‎ و‎NΦ‎ وأثر الزاوية، والطلبة يكتبون التعريفات ويحسبون أمثلة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل بزوايا مختلفة وعدد لفات، والطلبة يحلون في أزواج (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب الفيض عبر ملف مساحته ‎0.010 m²‎ عمودي على مجال ‎0.40 T‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: Φ = ‎4.0 × 10⁻³ Wb‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الفيض الكلي إذا كان عدد اللفات 200.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎NΦ = 0.80 Wb‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يصبح الفيض إذا دار الملف حتى صار مستواه موازيًا للمجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: صفرًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة الفيض المغناطيسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الويبر ‎(Wb) = T m²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الفرق بين ‎B‎ وΦ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎B‎ كثافة الفيض (لكل وحدة مساحة)، وΦ الفيض الكلي عبر مساحة معينة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ملف 100 لفة مساحته ‎0.020 m²‎ في مجال ‎0.30 T‎، والعمودي على مستواه يصنع ‎60°‎ مع المجال. احسب ‎NΦ‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎NΦ = 100 × 0.30 × 0.020 × cos 60° = 0.30 Wb‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة تعريفات الفيض وحل مسائل Φ و‎NΦ‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين كثافة الفيض والفيض<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25<\/p>"]}, {"axis": "نشاط 5-3 والأسئلة 13–21 في الفيض والحث", "n": 3, "hi": [["المادة", "الفيزياء – الصف ا ة<\/span><\/div>", "<p>التغير في الفيض ‎Δ(NΦ)‎، تدوير الملف ‎90°‎ و‎180°‎، إخراج الملف من المجال، مراجعة المفاهيم.<\/p>", "<p>يسأل المعلم: «ملف في مجال انقلب نصف دورة ‎(180°)‎؛ هل تغير الفيض عبره صفر لأنه عاد إلى الوضع نفسه؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يناقشون انعكاس اتجاه الفيض بالنسبة للملف (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 5-3 (ص 141)، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل الأسئلة 13–21 ومسائل التغير في الفيض، والطلبة يحلون في مجموعات ويعرضون (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على الحث والفيض، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما التغير في الفيض عند إخراج ملف ‎NΦ = 0.80 Wb‎ كليًا من المجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎0.80 Wb‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما التغير في الفيض عند تدوير الملف ‎90°‎ من وضع التعامد؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من 0.80 إلى صفر، أي ‎0.80 Wb‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;bo opacity:.85\">• الإجابة النموذجية: ε = ‎0.15 × 3.0 = 0.45 V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> إلى أي قانون تشير الإشارة السالبة في معادلة فاراداي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قانون لنز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث للقوة الدافعة إذا حدث التغير نفسه في نصف الزمن؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتضاعف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ملف 500 لفة مساحته ‎4.0 × 10⁻³ m²‎ تغير المجال العمودي عليه من ‎0.10 T‎ إلى ‎0.50 T‎ خلال ‎0.020 s‎. احسب ε.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Δ(NΦ) = 500 × 4.0 × 10⁻³ × 0.40 = 0.80 Wb‎؛ ε = ‎40 V‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 5-6 وحل مسائل قانون فاراداي<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن العلاقة بين سرعة التغير ومقدار القوة الدافعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=26<\/p>"]}, {"axis": "القوة الدافعة المستحثة في سلك متحرك ونشاط 5-4", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون فاراداي للحث الكهرومغناطيسي"], ["الحصة", "2 من 2"], ["محور الحصة", "القوة الدافعة المستحثة في سلك متحرك ونشاط 5-4"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-6 + كتاب التجارب ص 144"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-4: قانون فاراداي للحث الكهرومغناطيسي وقانون لنز ص 144"]], "t": ["1. يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي\n2. يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»\n }
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#mode button');if(m){st.m=m.dataset.m;render();return}
 const tb=e.target.closest('#tabs button');if(tb){st.p=+tb.dataset.i;render();return}
 const c=e.target.closest('.copy');if(c){const i=+c.dataset.f,t=fieldText(i);let ok=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);ok=true}catch(err){}}
  if(!ok)ok=legacyCopy(t);
  if(ok)done(c);else fallback(i,t);}
});
$('les').addEventListener('change',e=>{st.l=+e.target.value;st.p=0;render()});
buildSelect();render();
</script>
<script src="/assets/qlink.js" defer></script>
