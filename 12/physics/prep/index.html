دم مسائل حساب سرعة إلكترون بعد تسارعه عبر فرق جهد</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>في أي اتجاه تتسارع شحنة موجبة موضوعة في مجال منتظم؟</td><td>في اتجاه المجال.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الشغل المبذول على إلكترون يُسرَّع عبر ‎100 V‎؟</td><td>‎W = QV = 1.6 × 10⁻¹⁷ J‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب سرعة إلكترون بدأ من السكون وتسارع عبر ‎100 V‎.</td><td>½‎mv² = 1.6 × 10⁻¹⁷ ← v = 5.9 × 10⁶ m/s‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة القوة على شحنة في مجال كهربائي.</td><td>‎F = QE‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لإلكترون يدخل مجالًا منتظمًا في اتجاه المجال نفسه؟</td><td>يتباطأ لأن القوة عليه عكس اتجاه المجال.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا تضاعف فرق الجهد المسرِّع، فكم مرة تزداد سرعة الإلكترون النهائية؟</td><td>‎√2‎ مرة.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 2-3 وحل مسألتين على ‎QV = ½mv²‎</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أجهزة تستخدم مسرعات الجسيمات في الطب</p>"]}, {"axis": "حركة الجسيمات المشحونة عموديًا على مجال منتظم", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "القوة المؤثرة على شحنة كهربائية"], ["الحصة", "2 من 2"], ["محور الحصة", "حركة الجسيمات المشحونة عموديًا على مجال منتظم"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-3 + كتاب التجارب ص 46"], ["دليل المعلم", "ص 50–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: حركة الشحنات في مجال كهربائي ص 46"]], "t": ["1. يصف تأثير المجال الكهربائي المنتظم على جسيم مشحون يدخل عموديًا على خطوط المجال (مسار قطع مكافئ)\n2. يحلل حركة الجسيم إلى مركبتين: منتظمة موازية للألواح ومتسارعة عمودية عليها\nمخرج تعليمي آخر: يحل نشاط 2-3 «حركة الشحنات في مجال كهربائي» والأسئلة 9–12", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- جهاز الحاسب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة انحراف الجسيمات المشحونة", "المسار المنحني (قطع مكافئ)، المركبة الأفقية المنتظمة، المركبة الرأسية المتسارعة، الانحراف، المقذوفات.", "يسأل المعلم: «تذكر مسار كرة تُقذف أفقيًا من سطح طاولة؛ ماذا تتوقع لمسار إلكترون يدخل أفقيًا بين لوحين مشحونين؟» (نشاط الجسيمات المشحونة في مجال منتظم).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح التشبيه\nالطالب: يتوقعون مسارًا منحنيًا يشبه المقذوفات\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يشرح تحليل الحركة إلى مركبتين ويعرض محاكاة للانحراف\nالطالب: يرسمون المسار ويكتبون معادلتي المركبتين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يوجه حل نشاط 2-3 (ص 46) والأسئلة 9–12\nالطالب: يحلون في أزواج ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا تبقى المركبة الأفقية لسرعة الإلكترون ثابتة بين اللوحين؟\n   الإجابة النموذجية: لأن القوة الكهربائية رأسية فقط ولا توجد قوة أفقية.\n2) (المستوى المتوقع) السؤال: ما شكل مسار الإلكترون بين اللوحين؟\n   الإجابة النموذجية: قطع مكافئ.\n3) (المستوى المتقدم) السؤال: إلى أي لوح ينحرف الإلكترون؟\n   الإجابة النموذجية: نحو اللوح الموجب.", "1) (مستوى الدعم) السؤال: ما نوع حركة الإلكترون في الاتجاه العمودي على اللوحين؟\n   الإجابة النموذجية: حركة متسارعة بانتظام.\n2) (المستوى المتوقع) السؤال: كيف يتغير الانحراف إذا زادت سرعة الإلكترون الأفقية؟\n اتجاهين متعاكسين، وانحراف الإلكترون أكبر بكثير لصغر كتلته.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 2-3 ص 46 والأسئلة 9–12</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن تشابه حركة الإلكترون بين اللوحين وحركة المقذوفات</p>"]}]}, {"title": "قانون كولوم والمجالات الشعاعية", "sb": "الموضوع 2-4 (السؤالان 13، 14)", "unit": "الوحدة 2: المجالات الكهربائية وقانون كولوم", "periods": [{"axis": "قانون كولوم للقوة بين شحنتين نقطيتين", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "1 من 3"], ["محور الحصة", "قانون كولوم للقوة بين شحنتين نقطيتين"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 (السؤالان 13، 14)"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎\n2. يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه\nمخرج تعليمي آخر: يقارن بين قانون كولوم وقانون نيوتن للجاذبية", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "قانون كولوم، سماحية الفراغ ε‎₀‎، الثابت ‎1/(4πε₀) ≈ 8.99 × 10⁹‎، الشحنة النقطية، التربيع العكسي، التجاذب والتنافر.", "يعرض المعلم كرتين خفيفتين مشحونتين معلقتين بخيطين تتنافران ويسأل: «إذا قربنا الكرتين إلى نصف المسافة، فكم مرة تتوقع أن تزداد القوة؟» ويذكّر بقانون نيوتن للجاذبية.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض الكرتين ويطرح السؤال\nالطالب: يتوقعون أربع مرات قياسًا على الجاذبية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «قانون كولوم وخطوط المجال الكهربائي» ويشرح المعادلة وقيمة ε‎₀‎\nالطالب: يكتبون المعادلة ويحسبون مثالًا\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل متدرجة ومقارنة بقانون نيوتن\nالطالب: يحلون في أزواج ويكملون جدول المقارنة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب القوة بين شحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.\n   الإجابة النموذجية: ‎F = 8.99 × 10⁹ × (1.0 × 10⁻⁶)² ÷ 0.010 = 0.90 N‎.\n2) (المستوى المتوقع) السؤال: ماذا يحدث للقوة إذا ضوعفت كل شحنة؟\n   الإجابة النموذجية: تصبح أربعة أضعاف.\n3) (المستوى المتقدم) السؤال: اذكر فرقًا وتشابهًا بين قانون كولوم وقانون نيوتن للجاذبية.\n   الإجابة النموذجية: كلاهما تربيع عكسي؛ الجاذبية تجاذب فقط بين الكتل، وكولوم تجاذب أو تنافر بين الشحنات.", "1) (مستوى الدعم) السؤال: ما قيمة ‎1/(4πε₀)‎ تقريبًا؟\n   الإجابة النموذجية: ‎8.99 × 10⁹ N m² C⁻²‎.\n2) (المستوى المتوقع) السؤال: من أين تُقاس ‎r‎ للكرة الموصلة المشحونة؟\n   الإجابة النموذجية: من مركزها.\n3) (المستوى المتقدم) السؤال: احسب القوة بين بروتون وإلكترون بينهما ‎5.3 × 10⁻¹¹ m‎.\n   الإجابة النموذجية: ‎F = 8.99 × 10⁹ × (1.6 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N‎.", "إرشاد للطالب: مراجعة الموضوع 2-4 وحل مسألتين على قانون كولوم\nإرشاد لولي الأمر: سؤال الابن عن أوجه الشبه بين قانوني كولوم ونيوتن"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎</li><li>يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين قانون كولوم وقانون نيوتن للجاذبية</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر نص قانون كولوم ويستخدم معادلة القوة بين شحنتين نقطيتين في الفراغ ‎F = Q₁Q₂/(4πε₀r²)‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يذكر أنه بالنسبة لنقطة خارج موصل كروي يمكن اعتبار شحنته شحنة نقطية في مركزه</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين قانون كولوم وقانون نيوتن للجاذبية</td><td class=\"lv\">تحليل</td></ ث للقوة إذا ضوعفت كل شحنة؟</td><td>تصبح أربعة أضعاف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر فرقًا وتشابهًا بين قانون كولوم وقانون نيوتن للجاذبية.</td><td>كلاهما تربيع عكسي؛ الجاذبية تجاذب فقط بين الكتل، وكولوم تجاذب أو تنافر بين الشحنات.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما قيمة ‎1/(4πε₀)‎ تقريبًا؟</td><td>‎8.99 × 10⁹ N m² C⁻²‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>من أين تُقاس ‎r‎ للكرة الموصلة المشحونة؟</td><td>من مركزها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب القوة بين بروتون وإلكترون بينهما ‎5.3 × 10⁻¹¹ m‎.</td><td>‎F = 8.99 × 10⁹ × (1.6 × 10⁻¹⁹)² ÷ (5.3 × 10⁻¹¹)² = 8.2 × 10⁻⁸ N‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 2-4 وحل مسألتين على قانون كولوم</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن أوجه الشبه بين قانوني كولوم ونيوتن</p>"]}, {"axis": "شدة المجال الكهربائي لشحنة نقطية", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "2 من 3"], ["محور الحصة", "شدة المجال الكهربائي لشحنة نقطية"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 (السؤالان 13، 14)"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎\n2. يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين\nمخرج تعليمي آخر: يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "المجال الشعاعي، ‎E = Q/(4πε₀r²)‎، التربيع العكسي، المجال المحصل، نقطة انعدام المجال.", "يسأل المعلم: «حول شحنة نقطية، هل يمكن استخدام ‎E = V/d‎ لحساب المجال؟ لماذا؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يستنتجون أن المجال غير منتظم حول الشحنة النقطية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يشتق ‎E = Q/(4πε₀r²)‎ من قانون كولوم ويحل مثالًا\nالطالب: يشتقون ويحسبون ‎E‎ على بعد معين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل محصلة مجالين على خط واحد\nالطالب: يحسبون في مجموعات ويحددون نقطة انعدام المجال\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب ‎E‎ على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.\n   الإجابة النموذجية: ‎E = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.090 = 2.0 × 10² N/C‎.\n2) (المستوى المتوقع) السؤال: كيف تتغير ‎E‎ إذا تضاعف البعد عن الشحنة؟\n   الإجابة النموذجية: تقل إلى الربع.\n3) (المستوى المتقدم) السؤال: لماذا لا تصلح ‎E = V/d‎ حول شحنة نقطية؟\n   الإجابة النموذجية: لأن المجال غير منتظم، وتلك العلاقة للمجال المنتظم فقط.", "1) (مستوى الدعم) السؤال: اكتب معادلة شدة المجال لشحنة نقطية.\n   الإجابة النموذجية: ‎E = Q/(4πε₀r²)‎\n2) (المستوى المتوقع) السؤال: شحنتان موجبتان متساويتان؛ أين ينعدم المجال المحصل؟\n   الإجابة النموذجية: في منتصف المسافة بينهما.\n3) (المستوى المتقدم) السؤال: شحنتان ‎+4 μC‎ و‎+1 μC‎ بينهما ‎0.30 m‎. أين ينعدم المجال على الخط الواصل؟\n   الإجابة النموذجية: على بعد ‎0.20 m‎ من الشحنة ‎+4 μC (‎حيث ‎4/x² = 1/(0.30 − x)²‎).", "إرشاد للطالب: مراجعة الموضوع 2-4 وحل مسائل المجال المحصل\nإرشاد لولي الأمر: متابعة الابن في رسم متجهات المجال قبل الحساب"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎</li><li>يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>المجال الشعاعي، ‎E = Q/(4πε₀r²)‎، التربيع العكسي، المجال المحصل، نقطة انعدام المجال.</p>", "<p>يسأل المعلم: «حول شحنة نقطية، هل يمكن استخدام ‎E = V/d‎ لحساب المجال؟ لماذا؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يستنتجون أن المجال غير منتظم حول الشحنة النقطية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يشتق ‎E = Q/(4πε₀r²)‎ من قانون كولوم ويحل مثالًا</td><td>يشتقون ويحسبون ‎E‎ على بعد معين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل محصلة مجالين على خط واحد</td><td>يحسبون في مجموعات ويحددون نقطة انعدام المجال</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎E‎ على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.</td><td>‎E = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.090 = 2.0 × 10² N/C‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف تتغير ‎E‎ إذا تضاعف البعد عن الشحنة؟</td><td>تقل إلى الربع.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تصلح ‎E = V/d‎ حول شحنة نقطية؟</td><td>لأن المجال غير منتظم، وتلك العلاقة للمجال المنتظم فقط.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة شدة المجال لشحنة نقطية.</td><td>‎E = Q/(4πε₀r²)‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>شحنتان موجبتان متساويتان؛ أين ينعدم المجال المحصل؟</td><td>في منتصف المسافة بينهما.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>شحنتان ‎+4 μC‎ و‎+1 μC‎ بينهما ‎0.30 m‎. أين ينعدم المجال على الخط الواصل؟</td><td>على بعد ‎0.20 m‎ من الشحنة ‎+4 μC (‎حيث ‎4/x² = 1/(0.30 − x)²‎).</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 2-4 وحل مسائل المجال المحصل</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في رسم متجهات المجال قبل الحساب</p>"]}, {"axis": "نشاط 2-4 والسؤالان 13 و14 ومقارنة المجالين", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 2-4 والسؤالان 13 و14 ومقارنة المجالين"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 + كتاب التجارب ص 48"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14\n2. يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول\nمخرج تعليمي آخر: يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "المجال المنتظم، المجال الشعاعي، مجال الجاذبية، جدول المقارنة، منحنى ‎E‎ مقابل ‎r‎.", "يعرض المعلم جدولًا فارغًا بثلاثة أعمدة (جاذبية، كهربائي منتظم، كهربائي شعاعي) ويطلب ملء صف «معادلة الشدة» خلال دقيقة.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يدير ملء الصف الأول\nالطالب: يكتبون المعادلات الثلاث\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجيتان: التعلم الذاتي، التعلم التعاوني\nالمعلم: يوجه حل نشاط 2-4 (ص 48) والسؤالين 13 و14\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه إكمال جدول المقارنة ورسم ‎E‎ مقابل ‎r‎\nالطالب: يكملون الجدول ويرسمون المنحنى\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على قانون كولوم\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما شكل منحنى ‎E‎ مقابل ‎r‎ لشحنة نقطية؟\n   الإجابة النموذجية: منحنى تربيع عكسي يتناقص بسرعة ثم ببطء.\n2) (المستوى المتوقع) السؤال: ما وجه الشبه بين ‎E‎ لشحنة نقطية و‎g‎ لكتلة نقطية؟\n   الإجابة النموذجية: كلاهما يتناسب عكسيًا مع مربع البعد.\n3) (المستوى المتقدم) السؤال: ما الفرق بين المجال المنتظم والشعاعي من حيث تغير الشدة؟\n   الإجابة النموذجية: المنتظم ثابت الشدة، والشعاعي تتناقص شدته بالابتعاد عن المصدر.", "1) (مستوى الدعم) السؤال: اكتب معادلتي شدة المجال الكهربائي المنتظم والشعاعي.\n   الإجابة النموذجية: المنتظم: ‎E = V/d‎، الشعاعي: ‎E = Q/(4πε₀r²)‎.\n2) (المستوى المتوقع) السؤال: إذا كانت ‎E = 800 N/C‎ على بعد ‎0.10 m‎ من شحنة نقطية، فكم تكون على بعد ‎0.40 m‎؟\n   الإجابة النموذجية: ‎50 N/C‎.\n3) (المستوى المتقدم) السؤال: احسب الشحنة التي تولد مجالًا ‎9.0 × 10⁴ N/C‎ على بعد ‎0.20 m‎.\n   الإجابة النموذجية: ‎Q = E × 4πε₀ × r² = 9.0 × 10⁴ × 0.040 ÷ 8.99 × 10⁹ = 4.0 × 10⁻⁷ C‎.", "إرشاد للطالب: إكمال نشاط 2-4 ص 48 والسؤالين 13 و14 وجدول المقارنة\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين المجال المنتظم والشعاعي"], "h": ["<ol class=\"ol\"><li>يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14</li><li>يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>المجال المنتظم، المجال الشعاعي، مجال الجاذبية، جدول المقارنة، منحنى ‎E‎ مقابل ‎r‎.</p>", "<p>يعرض المعلم جدولًا فارغًا بثلاثة أعمدة (جاذبية، كهربائي منتظم، كهربائي شعاعي) ويطلب ملء صف «معادلة الشدة» خلال دقيقة.</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يدير ملء الصف الأول</td><td>يكتبون المعادلات الثلاث</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: التعلم الذاتي، التعلم التعاوني</span><br>يوجه حل نشاط 2-4 (ص 48) والسؤالين 13 و14</td><td>يحلون فرديًا ثم يقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه إكمال جدول المقارنة ورسم ‎E‎ مقابل ‎r‎</td><td>يكملون الجدول ويرسمون المنحنى</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على قانون كولوم</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما شكل منحنى ‎E‎ مقابل ‎r‎ لشحنة نقطية؟</td><td>منحنى تربيع عكسي يتناقص بسرعة ثم ببطء.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما وجه الشبه بين ‎E‎ لشحنة نقطية و‎g‎ لكتلة نقطية؟</td><td>كلاهما يتناسب عكسيًا مع مربع البعد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الفرق بين المجال المنتظم والشعاعي من حيث تغير الشدة؟</td><td>المنتظم ثابت الشدة، والشعاعي تتناقص شدته بالابتعاد عن المصدر.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلتي شدة المجال الكهربائي المنتظم والشعاعي.</td><td>المنتظم: ‎E = V/d‎، الشعاعي: ‎E = Q/(4πε₀r²)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>إذا كانت ‎E = 800 N/C‎ على بعد ‎0.10 m‎ من شحنة نقطية، فكم تكون على بعد ‎0.40 m‎؟</td><td>‎50 N/C‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب الشحنة التي تولد مجالًا ‎9.0 × 10⁴ N/C‎ على بعد ‎0.20 m‎.</td><td>‎Q = E × 4πε₀ × r² = 9.0 × 10⁴ × 0.040 ÷ 8.99 × 10⁹ = 4.0 × 10⁻⁷ C‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 2-4 ص 48 والسؤالين 13 و14 وجدول المقارنة</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين المجال المنتظم والشعاعي</p>"]}]}, {"title": "الجهد وطاقة الوضع الكهربائية", "sb": "الموضوع 2-5 (الأسئلة 15–17)", "unit": "الوحدة 2: المجالات الكهربائية وقانون كولوم", "periods": [{"axis": "تعريف الجهد الكهربائي عند نقطة وجهد شحنة نقطية", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "1 من 3"], ["محور الحصة", "تعريف الجهد الكهربائي عند نقطة وجهد شحنة نقطية"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 (الأسئلة 15–17)"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎\nمخرج تعليمي آخر: يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء الجهد الكهربائي", "- الكتاب\n- السبورة الذكية\n- جهاز الحاسب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة الجهد حول شحنة نقطية", "الجهد الكهربائي ‎V‎، الشغل لوحدة الشحنة، اللانهاية، ‎V = Q/(4πε₀r)‎، الفولت = ‎J/C‎، إشارة الجهد.", "يسأل المعلم: «تعلمنا جهد الجاذبية φ = ‎−GM/r‎؛ فما الذي تتوقعه لجهد شحنة نقطية؟ ولماذا قد يكون موجبًا هنا؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يستنتجون التشابه ويتوقعون الإشارة الموجبة للشحنة الموجبة\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: استقصاء الجهد الكهربائي\nالمعلم: ينفذ «استقصاء الجهد الكهربائي» بمحاكاة لتغير ‎V‎ مع ‎r‎ ويشرح التعريف والمعادلة\nالطالب: يسجلون ‎V‎ عند أبعاد مختلفة ويتحققون من ‎V ∝ 1/r‎\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب الجهد لشحنات موجبة وسالبة\nالطالب: يحسبون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير السؤال المفصلي (الفرق بين الجهد وفرق الجهد) ثم التقويم الختامي\nالطالب: يجيبون ويناقشون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب الجهد على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.\n   الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.30 = 60 V‎.\n2) (المستوى المتوقع) السؤال: ما إشارة الجهد قرب شحنة سالبة؟\n   الإجابة النموذجية: سالبة.\n3) (المستوى المتقدم) السؤال: ما الفرق بين الجهد عند نقطة وفرق الجهد بين نقطتين؟\n   الإجابة النموذجية: الجهد يُقاس نسبة إلى اللانهاية، وفرق الجهد هو الفرق بين جهدي نقطتين.", "1) (مستوى الدعم) السؤال: ما وحدة الجهد الكهربائي بدلالة ‎J‎ و‎C‎؟\n   الإجابة النموذجية: ‎J/C (‎الفولت).\n2) (المستوى المتوقع) السؤال: كيف يتغير الجهد إذا تضاعف البعد عن الشحنة؟\n   الإجابة النموذجية: يقل إلى النصف.\n3) (المستوى المتقدم) السؤال: احسب الجهد على سطح كرة موصلة نصف قطرها ‎0.10 m‎ تحمل ‎5.0 nC‎.\n   الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 5.0 × 10⁻⁹ ÷ 0.10 = 450 V‎.", "إرشاد للطالب: مراجعة الموضوع 2-5 وكتابة تعريف الجهد الكهربائي\nإرشاد لولي الأمر: سؤال الابن عن تشابه جهد الجاذبية والجهد الكهربائي"], "h": ["<ol class=\"ol\"><li>يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة</li><li>يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">استقصاء الجهد الكهربائي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز الحاسب</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: محاكاة الجهد حول شحنة نقطية</span></div>", "<p>الجهد الكهربائي ‎V‎، الشغل لوحدة الشحنة، اللانهاية، ‎V = Q/(4πε₀r)‎، الفولت = ‎J/C‎، إشارة الجهد.</p>", "<p>يسأل المعلم: «تعلمنا جهد الجاذبية φ = ‎−GM/r‎؛ فما الذي تتوقعه لجهد شحنة نقطية؟ ولماذا قد يكون موجبًا هنا؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يطرح السؤال</td><td>يستنتجون التشابه ويتوقعون الإشارة الموجبة للشحنة الموجبة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: استقصاء الجهد الكهربائي</span><br>ينفذ «استقصاء الجهد الكهربائي» بمحاكاة لتغير ‎V‎ مع ‎r‎ ويشرح التعريف والمعادلة</td><td>يسجلون ‎V‎ عند أبعاد مختلفة ويتحققون من ‎V ∝ 1/r‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل حساب الجهد لشحنات موجبة وسالبة</td><td>يحسبون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير السؤال المفصلي (الفرق بين الجهد وفرق الجهد) ثم التقويم الختامي</td><td>يجيبون ويناقشون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب الجهد على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.</td><td>‎V = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.30 = 60 V‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما إشارة الجهد قرب شحنة سالبة؟</td><td>سالبة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الفرق بين الجهد عند نقطة وفرق الجهد بين نقطتين؟</td><td>الجهد يُقاس نسبة إلى اللانهاية، وفرق الجهد هو الفرق بين جهدي نقطتين.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وحدة الجهد الكهربائي بدلالة ‎J‎ و‎C‎؟</td><td>‎J/C (‎الفولت).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يتغير الجهد إذا تضاعف البعد عن الشحنة؟</td><td>يقل إلى النصف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب الجهد على سطح كرة موصلة نصف قطرها ‎0.10 m‎ تحمل ‎5.0 nC‎.</td><td>‎V = 8.99 × 10⁹ × 5.0 × 10⁻⁹ ÷ 0.10 = 450 V‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 2-5 وكتابة تعريف الجهد الكهربائي</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشابه جهد الجاذبية والجهد الكهربائي</p>"]}, {"axis": "طاقة الوضع الكهربائية والعلاقة بين المجال وميل الجهد", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "2 من 3"], ["محور الحصة", "طاقة الوضع الكهربائية والعلاقة بين المجال وميل الجهد"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 (الأسئلة 15–17)"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎\n2. يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎\nمخرج تعليمي آخر: يحسب الشغل اللازم لتقريب شحنتين من بعضهما", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "طاقة الوضع الكهربائية، ‎Eₚ = QV‎، ‎Eₚ = Q₁Q₂/(4πε₀r)‎، ميل الجهد، ‎E = −ΔV/Δr‎، الشغل المبذول.", "يسأل المعلم: «لتقريب شحنتين موجبتين من بعضهما نحتاج إلى دفعهما؛ أين تذهب الطاقة التي بذلناها؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يستنتجون أنها تُخزن طاقة وضع\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يشرح ‎Eₚ = QV‎ و‎Eₚ = Q₁Q₂/(4πε₀r)‎ وعلاقة المجال بميل الجهد\nالطالب: يحسبون ‎Eₚ‎ لشحنتين ويرسمون ‎V‎ مقابل ‎r‎\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني\nالمعلم: يقدم مسائل الشغل والطاقة ومثالًا لحساب ‎E‎ من ميل منحنى\nالطالب: يحلون في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب طاقة الوضع لشحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.\n   الإجابة النموذجية: ‎Eₚ = 8.99 × 10⁹ × 10⁻¹² ÷ 0.10 = 0.090 J‎.\n2) (المستوى المتوقع) السؤال: احسب الشغل اللازم لتقريبهما إلى ‎0.050 m‎.\n   الإجابة النموذجية: ‎Eₚ‎ الجديدة = ‎0.18 J‎؛ الشغل = ‎0.090 J‎.\n3) (المستوى المتقدم) السؤال: ماذا يمثل ميل منحنى ‎V‎ مقابل ‎r‎؟\n   الإجابة النموذجية: سالب شدة المجال الكهربائي ‎(E = −ΔV/Δr)‎.", "1) (مستوى الدعم) السؤال: اكتب علاقة طاقة الوضع لشحنة في نقطة جهدها ‎V‎.\n   الإجابة النموذجية: ‎Eₚ = QV‎\n2) (المستوى المتوقع) السؤال: هل طاقة الوضع لشحنتين مختلفتين موجبة أم سالبة؟\n   الإجابة النموذجية: سالبة (تجاذب).\n3) (المستوى المتقدم) السؤال: احسب ‎E‎ إذا تغير الجهد من ‎300 V‎ إلى ‎100 V‎ عبر مسافة ‎0.050 m‎ باتجاه المجال.\n   الإجابة النموذجية: ‎E = 200 ÷ 0.050 = 4.0 × 10³ V/m‎.", "إرشاد للطالب: مراجعة الموضوع 2-5 وحل مسائل طاقة الوضع\nإرشاد لولي الأمر: متابعة الابن في ربط الشغل بتغير طاقة الوضع"], "h": ["<ol class=\"ol\"><li>يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎</li><li>يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب الشغل اللازم لتقريب شحنتين من بعضهما</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب الشغل اللازم لتقريب شحنتين من بعضهما</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>", "<p>طاقة الوضع الكهربائية، ‎Eₚ = QV‎، ‎Eₚ = Q₁Q₂/(4πε₀r)‎، ميل الجهد، ‎E = −ΔV/Δr‎، الشغل المبذول.</p>", "<p>يسأل المعلم: «لتقريب شحنتين موجبتين من بعضهما نحتاج إلى دفعهما؛ أين تذهب الطاقة التي بذلناها؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يستنتجون أنها تُخزن طاقة وضع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يشرح ‎Eₚ = QV‎ و‎Eₚ = Q₁Q₂/(4πε₀r)‎ وعلاقة المجال بميل الجهد</td><td>يحسبون ‎Eₚ‎ لشحنتين ويرسمون ‎V‎ مقابل ‎r‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني</span><br>يقدم مسائل الشغل والطاقة ومثالًا لحساب ‎E‎ من ميل منحنى</td><td>يحلون في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب طاقة الوضع لشحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.</td><td>‎Eₚ = 8.99 × 10⁹ × 10⁻¹² ÷ 0.10 = 0.090 J‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب الشغل اللازم لتقريبهما إلى ‎0.050 m‎.</td><td>‎Eₚ‎ الجديدة = ‎0.18 J‎؛ الشغل = ‎0.090 J‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يمثل ميل منحنى ‎V‎ مقابل ‎r‎؟</td><td>سالب شدة المجال الكهربائي ‎(E = −ΔV/Δr)‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب علاقة طاقة الوضع لشحنة في نقطة جهدها ‎V‎.</td><td>‎Eₚ = QV‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>هل طاقة الوضع لشحنتين مختلفتين موجبة أم سالبة؟</td><td>سالبة (تجاذب).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎E‎ إذا تغير الجهد من ‎300 V‎ إلى ‎100 V‎ عبر مسافة ‎0.050 m‎ باتجاه المجال.</td><td>‎E = 200 ÷ 0.050 = 4.0 × 10³ V/m‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 2-5 وحل مسائل طاقة الوضع</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في ربط الشغل بتغير طاقة الوضع</p>"]}, {"axis": "الاستقصاء العملي 2-1 ونشاط 2-5 ومراجعة الوحدة الثانية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 2-1 ونشاط 2-5 ومراجعة الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 + كتاب التجارب ص 51 و58"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية\n2. يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم الذاتي\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة، بيانات نموذجية، ورق رسم", "التحقق التجريبي، ‎V‎ مقابل ‎1/r‎، الخط المستقيم المار بالأصل، الميل، ملخص الوحدة.", "يسأل المعلم: «إذا كانت ‎V ∝ 1/r‎، فما التمثيل البياني الذي يعطينا خطًا مستقيمًا للتحقق من ذلك؟»", "1) (4 دقائق: من الدقيقة 0 إلى 4)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يقترحون رسم ‎V‎ مقابل ‎1/r‎\n2) (18 دقيقة: من الدقيقة 4 إلى 22)\nالاستراتيجيتان: التعلم بالاكتشاف، الاستقصاء العملي\nالمعلم: يوجه تنفيذ الاستقصاء العملي 2-1 (ص 58) أو تحليل بياناته النموذجية\nالطالب: يرسمون ‎V‎ مقابل ‎1/r‎ ويحسبون الميل ويستنتجون ‎Q‎\n3) (10 دقائق: من الدقيقة 22 إلى 32)\nالاستراتيجية: التعلم الذاتي\nالمعلم: يوجه حل نشاط 2-5 (ص 51) والأسئلة 15–17\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الثانية وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا نرسم ‎V‎ مقابل ‎1/r‎؟\n   الإجابة النموذجية: لأن العلاقة ‎V = (Q/4πε₀) × 1/r‎ خطية، فيكون الرسم خطًا مستقيمًا مارًا بالأصل.\n2) (المستوى المتوقع) السؤال: ماذا يمثل ميل خط ‎V‎ مقابل ‎1/r‎؟\n   الإجابة النموذجية: ‎Q/(4πε₀)‎.\n3) (المستوى المتقدم) السؤال: إذا كان الميل ‎9.0 V m‎، فما الشحنة؟\n   الإجابة النموذجية: ‎Q = 9.0 ÷ 8.99 × 10⁹ = 1.0 × 10⁻⁹ C‎.", "1) (مستوى الدعم) السؤال: ما الدليل على صحة العلاقة ‎V ∝ 1/r‎ من الرسم؟\n   الإجابة النموذجية: أن يكون خطًا مستقيمًا مارًا بنقطة الأصل.\n2) (المستوى المتوقع) السؤال: اذكر مصدرًا للخطأ في الاستقصاء.\n   الإجابة النموذجية: تسرب الشحنة إلى الهواء الرطب، أو عدم دقة قياس البعد من المركز.\n3) (المستوى المتقدم) السؤال: قيّم تعلمك في الوحدة الثانية وحدد موضوعًا للمراجعة مع خطة.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية مثل حل أسئلة نهاية الوحدة المرتبطة به.", "إرشاد للطالب: كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-5 ص 51 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثانية"], "h": ["<ol class=\"ol\"><li>ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية</li><li>يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">الاستقصاء العملي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة، بيانات نموذجية، ورق رسم</span></div>", "<p>التحقق التجريبي، ‎V‎ مقابل ‎1/r‎، الخط المستقيم المار بالأصل، الميل، ملخص الوحدة.</p>", "<p>يسأل المعلم: «إذا كانت ‎V ∝ 1/r‎، فما التمثيل البياني الذي يعطينا خطًا مستقيمًا للتحقق من ذلك؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يطرح السؤال</td><td>يقترحون رسم ‎V‎ مقابل ‎1/r‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–22</span><br><small>18 دقيقة الأمر:</b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثانية</p>"]}]}, {"title": "التيار الكهربائي", "sb": "الموضوع 3-1 (الأسئلة 1–11)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "التيار تدفق لحاملات شحنة مكممة والعلاقة ‎Q = It‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "التيار الكهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "التيار تدفق لحاملات شحنة مكممة والعلاقة ‎Q = It‎"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 3-1 (الأسئلة 1–11)"], ["دليل المعلم", "ص 75–80"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التيار الكهربائي والشحنة الكهربائية ص 70؛ نشاط 3-3: حاملات الشحنات الكهربائية ص 71"]], "t": ["1. يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة\n2. يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن\nمخرج تعليمي آخر: يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: أميتر ودائرة بسيطة", "التيار الكهربائي، حاملات الشحنة، الشحنة المكممة، الشحنة الأولية ‎e‎، ‎Q = It‎، ‎Q = Ne‎، الأمبير، الكولوم.", "يعرض المعلم صورة دائرة كهربائية ويطلب رسم مخططها، ثم يسأل: «نقول \"يتدفق التيار\"؛ فما الذي يتدفق فعلًا في السلك؟» (فكرة التمهيد أ).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض الصورة ويطرح السؤال ومهام بداية الوحدة\nالطالب: يرسمون المخطط ويقارنون رسومهم ويقترحون أن الشحنات هي ما يتدفق\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «مدخل إلى التيار الكهربائي كتدفق شحنة كهربائية»: حاملات الشحنة في الفلزات والمحاليل وتكميم الشحنة\nالطالب: يكتبون التعريف ويحددون حاملات الشحنة في أوساط مختلفة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: ينفذ «استخدام المعادلة ‎Q = It»‎ ومسائل ‎Q = Ne‎\nالطالب: يحلون مسائل متدرجة في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير السؤال المفصلي (‎Q = It‎ و‎Q = Nq‎) ثم التقويم الختامي\nالطالب: يجيبون ويناقشون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ما حاملات الشحنة في الفلزات؟\n   الإجابة النموذجية: الإلكترونات الحرة.\n2) (المستوى المتوقع) السؤال: احسب الشحنة المارة لتيار ‎0.50 A‎ مدة دقيقتين.\n   الإجابة النموذجية: ‎Q = 0.50 × 120 = 60 C‎.\n3) (المستوى المتقدم) السؤال: كم إلكترونًا يمر في الحالة السابقة؟\n   الإجابة النموذجية: ‎N = 60 ÷ 1.6 × 10⁻¹⁹ = 3.75 × 10²⁰‎ إلكترون.", "1) (مستوى الدعم) السؤال: لماذا يُعد قول «تدفق التيار» غير دقيق؟\n   الإجابة النموذجية: لأن التيار هو معدل تدفق الشحنة، فالشحنة هي التي تتدفق لا التيار.\n2) (المستوى المتوقع) السؤال: ما المقصود بأن الشحنة مكممة؟\n   الإجابة النموذجية: أنها توجد بمضاعفات صحيحة لشحنة الإلكترون ‎e‎.\n3) (المستوى المتقدم) السؤال: احسب الزمن اللازم لمرور ‎1.0 × 10²⁰‎ إلكترون بتيار ‎0.40 A‎.\n   الإجابة النموذجية: ‎Q = 16 C‎؛ ‎t = 40 s‎.", "إرشاد للطالب: مراجعة الموضوع 3-1 وحل مسائل ‎Q = It‎\nإرشاد لولي الأمر: الحديث مع الابن عن الفرق بين التيار والشحنة بتشبيه تدفق الماء"], "h": ["<ol class=\"ol\"><li>يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة</li><li>يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">ال إلكترونًا يمر في الحالة السابقة؟</td><td>‎N = 60 ÷ 1.6 × 10⁻¹⁹ = 3.75 × 10²⁰‎ إلكترون.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يُعد قول «تدفق التيار» غير دقيق؟</td><td>لأن التيار هو معدل تدفق الشحنة، فالشحنة هي التي تتدفق لا التيار.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما المقصود بأن الشحنة مكممة؟</td><td>أنها توجد بمضاعفات صحيحة لشحنة الإلكترون ‎e‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب الزمن اللازم لمرور ‎1.0 × 10²⁰‎ إلكترون بتيار ‎0.40 A‎.</td><td>‎Q = 16 C‎؛ ‎t = 40 s‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 3-1 وحل مسائل ‎Q = It‎</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الفرق بين التيار والشحنة بتشبيه تدفق الماء</p>"]}, {"axis": "العلاقة ‎I = nAvq‎ وسرعة الانجراف", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "التيار الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "العلاقة ‎I = nAvq‎ وسرعة الانجراف"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 3-1 + كتاب التجارب ص 70 و71"], ["دليل المعلم", "ص 75–80"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التيار الكهربائي والشحنة الكهربائية ص 70؛ نشاط 3-3: حاملات الشحنات الكهربائية ص 71"]], "t": ["1. يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي\n2. يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة\nمخرج تعليمي آخر: يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "كثافة حاملات الشحنة ‎n‎، مساحة المقطع ‎A‎، سرعة الانجراف ‎v‎، ‎I = nAvq‎، الموصلات وأشباه الموصلات.", "يسأل المعلم: «سرعة انجراف الإلكترونات في سلك أقل من ‎1 mm/s‎، فلماذا يضيء المصباح فور الضغط على المفتاح؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يطرح السؤال\nالطالب: يقترحون أن الإلكترونات موجودة في كل السلك وتبدأ الحركة معًا\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: ينفذ «استنتاج المعادلة ‎I = nAvq‎ واستخدامها»\nالطالب: يستنتجون العلاقة بنموذج أسطوانة من السلك\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 3-2 (ص 70) ونشاط 3-3 (ص 71)\nالطالب: يحلون ويقارنون الموصلات بأشباه الموصلات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب سرعة الانجراف في سلك نحاس (‎n = 8.5 × 10²⁸ m⁻³‎، ‎A = 1.0 × 10⁻⁶ m²‎) يحمل ‎1.0 A‎.\n   الإجابة النموذجية: ‎v = 1.0 ÷ (8.5 × 10²⁸ × 1.0 × 10⁻⁶ × 1.6 × 10⁻¹⁹) = 7.4 × 10⁻⁵ m/s‎.\n2) (المستوى المتوقع) السؤال: لماذا يضيء المصباح فورًا رغم بطء الانجراف؟\n   الإجابة النموذجية: لأن المجال الكهربائي ينتشر في الدائرة بسرعة كبيرة فتبدأ الإلكترونات الموجودة في كل أجزاء السلك بالحركة معًا.\n3) (المستوى المتقدم) السؤال: كيف تتغير سرعة الانجراف إذا نقصت مساحة المقطع إلى النصف مع ثبات التيار؟\n   الإجابة النموذجية: تتضاعف.", "1) (مستوى الدعم) السؤال: ماذا يمثل ‎n‎ في المعادلة ‎I = nAvq‎؟\n   الإجابة النموذجية: عدد حاملات الشحنة لكل وحدة حجم.\n2) (المستوى المتوقع) السؤال: لماذا تكون سرعة الانجراف في أشباه الموصلات أكبر منها في الفلزات للتيار نفسه؟\n   الإجابة النموذجية: لأن ‎n‎ في أشباه الموصلات أصغر بكثير.\n3) (المستوى المتقدم) السؤال: سلكان من المادة نفسها يحملان التيار نفسه، قطر الأول ضعف الثاني. قارن سرعتي الانجراف.\n   الإجابة النموذجية: مساحة الأول أربعة أضعاف، فسرعة الانجراف فيه ربع سرعتها في الثاني.", "إرشاد للطالب: إكمال نشاطي 3-2 و3-3 ص 70 و71\nإرشاد لولي الأمر: سؤال الابن عن سبب إضاءة المصباح فورًا رغم بطء الإلكترونات"], "h": ["<ol class=\"ol\"><li>يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي</li><li>يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاطي 3-2 و3-3 لثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "فرق الجهد الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "الفرق بين فرق الجهد والقوة الدافعة الكهربائية ونشاط 3-1"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-2 + كتاب التجارب ص 67"], ["دليل المعلم", "ص 75–81"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية ص 67"]], "t": ["1. يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)\n2. يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»\nمخرج تعليمي آخر: يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "القوة الدافعة الكهربائية ‎e.m.f‎.، فرق الجهد، اتجاه تحول الطاقة، المصدر، المكون المستهلك، المقاومة ‎R = V/I‎.", "يعطي المعلم كل طالب ورقة ويتحداه أن يكتب في سطرين الفرق بين «فرق الجهد» و«القوة الدافعة الكهربائية» قبل الشرح.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يجمع الإجابات المكتوبة سريعًا\nالطالب: يكتبون الفرق المتوقع\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجيتان: التعلم التعاوني، التعلم الذاتي\nالمعلم: يشرح الفرق باتجاه تحول الطاقة ويصحح المفاهيم الخاطئة\nالطالب: يعيدون صياغة إجاباتهم الأولى\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 3-1 (ص 67) والأسئلة المتبقية من 1–11\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التيار وفرق الجهد\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: عرّف القوة الدافعة الكهربائية.\n   الإجابة النموذجية: الطاقة المحولة من صور أخرى إلى طاقة كهربائية لكل وحدة شحنة تمر عبر المصدر.\n2) (المستوى المتوقع) السؤال: في البطارية، أي الكميتين تصف عملها: فرق الجهد أم القوة الدافعة؟\n   الإجابة النموذجية: القوة الدافعة الكهربائية.\n3) (المستوى المتقدم) السؤال: صحح: «فرق الجهد عبر البطارية هو دائمًا قوتها الدافعة».\n   الإجابة النموذجية: غير دقيق؛ فرق الجهد بين طرفي البطارية أقل من قوتها الدافعة عند مرور تيار بسبب مقاومتها الداخلية.", "1) (مستوى الدعم) السؤال: ما الفرق في اتجاه تحول الطاقة بين ‎e.m.f‎. وفرق الجهد؟\n   الإجابة النموذجية: ‎e.m.f‎.: من صور أخرى إلى كهربائية؛ فرق الجهد: من كهربائية إلى صور أخرى.\n2) (المستوى المتوقع) السؤال: هل للقوة الدافعة الكهربائية وحدة القوة؟\n   الإجابة النموذجية: لا، وحدتها الفولت مثل فرق الجهد.\n3) (المستوى المتقدم) السؤال: احسب المقاومة لمكون يمر فيه ‎0.25 A‎ وفرق الجهد عبره ‎6.0 V‎.\n   الإجابة النموذجية: ‎R = 24 Ω‎.", "إرشاد للطالب: إكمال نشاط 3-1 ص 67 والأسئلة المتبقية\nإرشاد لولي الأمر: متابعة الابن في التمييز بين المصطلحين بدقة"], "h": ["<ol class=\"ol\"><li>يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)</li><li>يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>القوة الدافعة الكهربائية ‎e.m.f‎.، فرق الجهد، اتجاه تحول الطاقة، المصدر، المكون المستهلك، المقاومة ‎R = V/I‎.</p>", "<p>يعطي المعلم كل طالب ورقة ويتحداه أن يكتب في سطرين الفرق بين «فرق الجهد» و«القوة الدافعة الكهربائية» قبل الشرح.</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يجمع الإجابات المكتوبة سريعًا</td><td>يكتبون الفرق المتوقع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: التعلم التعاوني، التعلم الذاتي</span><br>يشرح الفرق باتجاه تحول الطاقة ويصحح المفاهيم الخاطئة</td><td>يعيدون صياغة إجاباتهم الأولى</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه حل نشاط 3-1 (ص 67) والأسئلة المتبقية من 1–11</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على التيار وفرق الجهد</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف القوة الدافعة الكهربائية.</td><td>الطاقة المحولة من صور أخرى إلى طاقة كهربائية لكل وحدة شحنة تمر عبر المصدر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>في البطارية، أي الكميتين تصف عملها: فرق الجهد أم القوة الدافعة؟</td><td>القوة الدافعة الكهربائية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صحح: «فرق الجهد عبر البطارية هو دائمًا قوتها الدافعة».</td><td>غير دقيق؛ فرق الجهد بين طرفي البطارية أقل من قوتها الدافعة عند مرور تيار بسبب مقاومتها الداخلية.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الفرق في اتجاه تحول الطاقة بين ‎e.m.f‎. وفرق الجهد؟</td><td>‎e.m.f‎.: من صور أخرى إلى كهربائية؛ فرق الجهد: من كهربائية إلى صور أخرى.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>هل للقوة الدافعة الكهربائية وحدة القوة؟</td><td>لا، وحدتها الفولت مثل فرق الجهد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب المقاومة لمكون يمر فيه ‎0.25 A‎ وفرق الجهد عبره ‎6.0 V‎.</td><td>‎R = 24 Ω‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 3-1 ص 67 والأسئلة المتبقية</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين المصطلحين بدقة</p>"]}]}, {"title": "المقاومة النوعية", "sb": "الموضوع 3-3 (الأسئلة 12–15)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "المقاومة النوعية والعلاقة ‎R = ρL/A‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "المقاومة النوعية"], ["الحصة", "1 من 3"], ["محور الحصة", "المقاومة النوعية والعلاقة ‎R = ρL/A‎"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-3 (الأسئلة 12–15)"], ["دليل المعلم", "ص 80–85"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-4 ص 74؛ نشاط 3-5 ص 77؛ الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي ص 100"]], "t": ["1. يستخدم المعادلة ‎R = ρL/A‎ لحساب المقاومة أو المقاومة النوعية\n2. يميز بين المقاومة (خاصية للجسم) والمقاومة النوعية (خاصية للمادة)\nمخرج تعليمي آخر: يتنبأ بأثر تغيير الطول أو القطر على مقاومة سلك", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: أسلاك من المادة نفسها بأطوال وأقطار مختلفة وأوميتر", "المقاومة ‎R‎، المقاومة النوعية ρ، الطول ‎L‎، مساحة المقطع ‎A‎، Ω ‎m‎، الموصلات والعوازل.", "يعرض المعلم سلكين من النحاس أحدهما قصير سميك والآخر طويل رفيع ويسأل: «أيهما أكبر مقاومة؟ وهل المقاومة النوعية لهما مختلفة؟» (فكرة التمهيد).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض السلكين ويطرح السؤال\nالطالب: يتوقعون ويبررون\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يشرح ‎R = ρL/A‎ ووحدة ρ والفرق بين المفهومين مع قياس بالأوميتر\nالطالب: يسجلون القياسات ويتحققون من العلاقة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب ‎R‎ وρ وتغيير الأبعاد\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اكتب علاقة المقاومة بالمقاومة النوعية.\n   الإجابة النموذجية: ‎R = ρL/A‎\n2) (المستوى المتوقع) السؤال: ما وحدة المقاومة النوعية؟\n   الإجابة النموذجية: Ω ‎m‎.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لمقاومة سلك إذا ضوعف طوله وقطره معًا؟\n   الإجابة النموذجية: الطول ×2 والمساحة ×4، فتصبح المقاومة نصف قيمتها.", "1) (مستوى الدعم) السؤال: هل تعتمد المقاومة النوعية على أبعاد السلك؟\n   الإجابة النموذجية: لا، تعتمد على نوع المادة (ودرجة الحرارة).\n2) (المستوى المتوقع) السؤال: احسب مقاومة سلك طوله ‎2.0 m‎ ومساحة مقطعه ‎2.0 × 10⁻⁷ m²‎ ومقاومته النوعية ‎4.9 × 10⁻⁷ Ω m‎.\n   الإجابة النموذجية: ‎R = 4.9 Ω‎.\n3) (المستوى المتقدم) السؤال: احسب طول سلك نيكروم (‎ρ = 1.1 × 10⁻⁶ Ω m‎، ‎A = 1.0 × 10⁻⁷ m²‎) مقاومته 22 Ω.\n   الإجابة النموذجية: ‎L = RA/ρ = 2.0 m‎.", "إرشاد للطالب: مراجعة الموضوع 3-3 وحل مسائل ‎R = ρL/A‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين المقاومة والمقاومة النوعية"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلة ‎R = ρL/A‎ لحساب المقاومة أو المقاومة النوعية</li><li>يميز بين المقاومة (خاصية للجسم) والمقاومة النوعية (خاصية للمادة)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بأثر تغيير الطول أو القطر على مقاومة سلك</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم المعادلة ‎R = ρL/A‎ لحساب المقاومة أو المقاومة النوعية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين المقاومة (خاصية للجسم) والمقاومة النوعية (خاصية للمادة)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بأثر تغيير الطول أو القطر على مقاومة سلك</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: أسلاك من المادة نفسها بأطوال وأقطار مختلفة وأوميتر</span></div>", "<p>المقاومة ‎R‎، المقاومة النوعية ρ، الطول ‎L‎، مساحة المقطع ‎A‎، Ω ‎m‎، الموصلات والعوازل.</p>", "<p>يعرض المعلم سلكين من النحاس أحدهما قصير سميك والآخر طويل رفيع ويسأل: «أيهما أكبر مقاومة؟ وهل المقاومة النوعية لهما مختلفة؟» (فكرة التمهيد).</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يعرض السلكين ويطرح السؤال</td><td>يتوقعون ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يشرح ‎R = ρL/A‎ ووحدة ρ والفرق بين المفهومين مع قياس بالأوميتر</td><td>يسجلون القياسات ويتحققون من العلاقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل حساب ‎R‎ وρ وتغيير الأبعاد</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب علاقة المقاومة بالمقاومة النوعية.</td><td>‎R = ρL/A‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما وحدة المقاومة النوعية؟</td><td>Ω ‎m‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث لمقاومة سلك إذا ضوعف طوله وقطره معًا؟</td><td>الطول ×2 والمساحة ×4، فتصبح المقاومة نصف قيمتها.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل تعتمد المقاومة النوعية على أبعاد السلك؟</td><td>لا، تعتمد على نوع المادة (ودرجة الحرارة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب مقاومة سلك طوله ‎2.0 m‎ ومساحة مقطعه ‎2.0 × 10⁻⁷ m²‎ ومقاومته النوعية ‎4.9 × 10⁻⁷ Ω m‎.</td><td>‎R = 4.9 Ω‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب طول سلك نيكروم (‎ρ = 1.1 × 10⁻⁶ Ω m‎، ‎A = 1.0 × 10⁻⁷ m²‎) مقاومته 22 Ω.</td><td>‎L = RA/ρ = 2.0 m‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 3-3 وحل مسائل ‎R = ρL/A‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين المقاومة والمقاومة النوعية</p>"]}, {"axis": "الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "المقاومة النوعية"], ["الحصة", "2 من 3"], ["محور الحصة", "الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-3 + كتاب التجارب ص 100"], ["دليل المعلم", "ص 80–85"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-4 ص 74؛ نشاط 3-5 ص 77؛ الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي ص 100"]], "t": ["1. يقيس قطر السلك بالميكرومتر وطوله ومقاومته لأطوال مختلفة\n2. يرسم ‎R‎ مقابل ‎L‎ ويحسب المقاومة النوعية من الميل\nمخرج تعليمي آخر: يحسب عدم اليقين في قيمة ρ ويقيّم مصادر الخطأ", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: سلك مقاومة، ميكرومتر، مسطرة مترية، أميتر وفولتميتر أو أوميتر، مصدر جهد منخفض", "الميكرومتر، القياسات المتكررة، ‎R‎ مقابل ‎L‎، الميل = ρ/‎A‎، عدم اليقين، الخطأ الصفري.", "يعرض المعلم ميكرومترًا ويسأل: «لماذا لا تكفي المسطرة لقياس قطر سلك رفيع؟ وكم مرة يجب أن نقيس القطر؟»", "1) (4 دقائق: من الدقيقة 0 إلى 4)\nالاستراتيجية: الاستقصاء العملي\nالمعلم: يعرض الأداة ويطرح السؤال\nالطالب: يقترحون قياسات متكررة في مواضع مختلفة\n2) (22 دقيقة: من الدقيقة 4 إلى 26)\nالاستراتيجيتان: الاستقصاء العملي، التعلم التعاوني\nالمعلم: يوجه تنفيذ الاستقصاء العملي 3-1 (ص 100): قياس القطر وقياس ‎R‎ لأطوال مختلفة\nالطالب: يقيسون ويسجلون البيانات في جدول\n3) (8 دقائق: من الدقيقة 26 إلى 34)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يوجه رسم ‎R‎ مقابل ‎L‎ وحساب الميل وρ\nالطالب: يرسمون ويحسبون ρ\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يناقش مصادر الخطأ ويدير التقويم الختامي\nالطالب: يجيبون ويقترحون تحسينات\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا يُقاس القطر في عدة مواضع واتجاهات؟\n   الإجابة النموذجية: لأن السلك قد لا يكون منتظم المقطع، وأخذ المتوسط يقلل الخطأ العشوائي.\n2) (المستوى المتوقع) السؤال: ماذا يمثل ميل خط ‎R‎ مقابل ‎L‎؟\n   الإجابة النموذجية: ρ/‎A‎.\n3) (المستوى المتقدم) السؤال: احسب ρ إذا كان الميل ‎25 Ω/m‎ والقطر ‎0.50 mm‎.\n   الإجابة النموذجية: ‎A = 1.96 × 10⁻⁷ m²‎؛ ρ = ‎25 × 1.96 × 10⁻⁷ = 4.9 × 10⁻⁶ Ω m‎.", "1) (مستوى الدعم) السؤال: ما الخطأ الصفري للميكرومتر؟\n   الإجابة النموذجية: قراءة غير صفرية عند إغلاق فكيه تمامًا، ويجب طرحها من القراءات.\n2) (المستوى المتوقع) السؤال: لماذا يُستخدم تيار صغير في الاستقصاء؟\n   الإجابة النموذجية: لتجنب تسخين السلك الذي يغير مقاومته.\n3) (المستوى المتقدم) السؤال: اقترح تحسينين لدقة قيمة ρ.\n   الإجابة النموذجية: قياس القطر في مواضع أكثر، واستخدام مدى أطوال أكبر، وتقليل زمن مرور التيار.", "إرشاد للطالب: كتابة تقرير الاستقصاء 3-1 مع الرسم البياني وحساب ρ\nإرشاد لولي الأمر: التأكد من رسم الابن البياني ورسم خط أفضل مطابقة"], "h": ["<ol class=\"ol\"><li>يقيس قطر السلك بالميكرومتر وطوله ومقاومته لأطوال مختلفة</li><li>يرسم ‎R‎ مقابل ‎L‎ ويحسب المقاومة النوعية من الميل</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب عدم اليقين
