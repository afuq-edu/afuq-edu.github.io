tep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يمثل مجال الجاذبية بخطوط المجال للمجالين الشعاعي والمنتظم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يفسر ثبات وزن الجسم تقريبًا قرب سطح الأرض وتغيره عند الابتعاد عنها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">العصف الذهني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>مجال القوة، مجال الجاذبية، خطوط المجال، المجال الشعاعي، المجال المنتظم، شدة مجال الجاذبية، الكتلة النقطية.<\/p>", "<p>يسقط المعلم كوبًا بلاستيكيًا ثم يعرض صورة الثقب الأسود المرصود عام 2019م ويسأل: «ما العامل المشترك بين هاتين الملاحظتين؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم فكرة التمهيد (أ) ويدير النقاش حول دور الجاذبية، والطلبة يحددون دور الجاذبية في الحالتين ويجيبون عن مهام بداية الوحدة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: العصف الذهني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «المجالات الشعاعية والمنتظمة»: يذكّر بخطوط المجال المغناطيسي ثم يرسم خطوط مجال الأرض قريبًا وبعيدًا (الشكلان 1-1 و1-2)، والطلبة يرسمون خطوط المجالين ويستنتجون أن تقارب الخطوط يدل على شدة المجال (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مواقف (سطح الأرض، قمر صناعي، الفضاء البعيد) لتحديد نوع المجال، والطلبة يصنفون المجال في كل موقف ويبررون (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف شدة مجال الجاذبية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوة المؤثرة لكل وحدة كتلة على كتلة صغيرة موضوعة عند تلك النقطة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يدل تقارب خطوط مجال الجاذبية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على أن المجال أشد في تلك المنطقة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نعامل مجال الجاذبية قرب سطح الأرض على أنه منتظم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن المسافة المعنية صغيرة جدًا مقارنة بنصف قطر الأرض فتبدو الخطوط متوازية ومتساوية التباعد.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما اتجاه خطوط مجال الجاذبية حول الأرض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو مركز الأرض (شعاعية إلى الداخل).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ارسم خطوط مجال الجاذبية لكوكب كروي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: خطوط مستقيمة شعاعية متجهة نحو المركز، يتباعد بعضها عن بعض كلما ابتعدنا عن الكوكب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يقل وزن رائد الفضاء كلما ابتعد عن الأرض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن خطوط المجال تتباعد فتقل شدة مجال الجاذبية ومن ثم القوة المؤثرة على كتلته.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-1 في كتاب الطالب ورسم المجالين الشعاعي والمنتظم<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الجاذبية في حياتنا اليومية وفي حركة القمر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=1<\/p>"]}, {"axis": "قانون نيوتن للجاذبية وتجربة كافنديش", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "تمثيل مجال الجاذبية"], ["الحصة", "2 من 2"], ["محور الحصة", "قانون نيوتن للجاذبية وتجربة كافنديش"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-1 (السؤالان 1، 2)"], ["دليل المعلم", "ص 28–31"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-1: قانون نيوتن للجاذبية ص 24"]], "t": ["1. يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎\n2. يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها\nمخرج تعليمي آخر: يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎", "1. تطبيق: يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎\n2. تذكر: يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها\n3. فهم (مخرج آخر): يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎", "- التعلم بالاكتشاف\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة ‎Gravity Lab‎", "قانون نيوتن للجاذبية، ثابت الجذب العام ‎G‎، قانون التربيع العكسي، الكتلة النقطية، تجربة كافنديش.", "يسأل المعلم: «تجذبك الأرض بقوة نحو ‎600 N‎، فلماذا لا تشعر بجذب زميلك الجالس بجوارك؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون أثر صغر الكتلة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم قانون نيوتن والتربيع العكسي ويحل مثالًا لقوة بين كتلتين، والطلبة يحسبون القوة بين كتلتين صغيرتين ويقارنونها بوزنهما (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يعرض المعلم «تجربة كافنديش» بمقطع مختار ونموذج مبسط، ثم يوجه حل السؤالين 1 و2 ونشاط 1-1 (ص 24)، والطلبة يصفون مبدأ التجربة ويحلون الأسئلة في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يختم المعلم بمسابقة المجموعات، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1. مستوى المعرفة: اكتب معادلة قانون نيوتن للجاذبية.\n• الإجابة النموذجية: ‎F = Gm₁m₂ / r²‎\n\n2. مستوى التطبيق: احسب قوة التجاذب بين كتلتين كل منهما ‎1.0 kg‎ بينهما ‎1.0 m‎.\n• الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ N‎.\n\n3. مستوى الاستدلال: ماذا يحدث للقوة إذا تضاعفت المسافة بين الكتلتين؟\n• الإجابة النموذجية: تقل إلى الربع.", "1. مستوى المعرفة: ما قيمة ‎G‎ ووحدتها؟\n• الإجابة النموذجية: ‎6.67 × 10⁻¹¹ N m² kg⁻²‎.\n\n2. مستوى التطبيق: من أين تُقاس ‎r‎ عند حساب قوة الجذب بين الأرض والقمر؟\n• الإجابة النموذجية: بين مركزيهما.\n\n3. مستوى الاستدلال: احسب قوة الجذب بين الأرض ‎(6.0 × 10²⁴ kg)‎ وقمر صناعي كتلته ‎1000 kg‎ على بعد ‎7.0 × 10⁶ m‎ من مركزها.\n• الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 1000 ÷ (7.0 × 10⁶)² = 8.2 × 10³ N‎.", "إرشاد للطالب: حل السؤالين 1 و2 ونشاط 1-1 ص 24\nإرشاد لولي الأمر: مناقشة الابن في سبب عدم شعورنا بجذب الأجسام الصغيرة لبعضها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=1"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎<\/li><li>يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يذكر نص قانون نيوتن للجاذبية ويستخدم المعادلة ‎F = Gm₁m₂/r²‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يذكر أنه بالنسبة لنقطة خارج كرة منتظمة يمكن اعتبار كتلتها كتلة نقطية في مركزها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يصف مبدأ تجربة كافنديش لقياس ثابت الجذب العام ‎G‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم بالنمذجة<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: محاكاة ‎Gravity Lab‎<\/span><\/div>", "<p>قانون نيوتن للجاذبية، ثابت الجذب العام ‎G‎، قانون التربيع العكسي، الكتلة النقطية، تجربة كافنديش.<\/p>", "<p>يسأل المعلم: «تجذبك الأرض بقوة نحو ‎600 N‎، فلماذا لا تشعر بجذب زميلك الجالس بجوارك؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون أثر صغر الكتلة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم قانون نيوتن والتربيع العكسي ويحل مثالًا لقوة بين كتلتين، والطلبة يحسبون القوة بين كتلتين صغيرتين ويقارنونها بوزنهما (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يعرض المعلم «تجربة كافنديش» بمقطع مختار ونموذج مبسط، ثم يوجه حل السؤالين 1 و2 ونشاط 1-1 (ص 24)، والطلبة يصفون مبدأ التجربة ويحلون الأسئلة في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة قانون نيوتن للجاذبية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = Gm₁m₂ / r²‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب قوة التجاذب بين كتلتين كل منهما ‎1.0 kg‎ بينهما ‎1.0 m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ N‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يحدث للقوة إذا تضاعفت المسافة بين الكتلتين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل إلى الربع.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما قيمة ‎G‎ ووحدتها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎6.67 × 10⁻¹¹ N m² kg⁻²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> من أين تُقاس ‎r‎ عند حساب قوة الجذب بين الأرض والقمر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بين مركزيهما.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب قوة الجذب بين الأرض ‎(6.0 × 10²⁴ kg)‎ وقمر صناعي كتلته ‎1000 kg‎ على بعد ‎7.0 × 10⁶ m‎ من مركزها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ × 1000 ÷ (7.0 × 10⁶)² = 8.2 × 10³ N‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل السؤالين 1 و2 ونشاط 1-1 ص 24<\/p><p><b>إرشاد لولي الأمر:<\/b> مناقشة الابن في سبب عدم شعورنا بجذب الأجسام الصغيرة لبعضها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=1<\/p>"]}]}, {"title": "شدة مجال الجاذبية ‎g‎", "sb": "الموضوع 1-2 (الأسئلة 3–8)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "استنتاج معادلة شدة مجال الجاذبية ‎g = GM/r²‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "1 من 3"], ["محور الحصة", "استنتاج معادلة شدة مجال الجاذبية ‎g = GM/r²‎"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 (الأسئلة 3–8)"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية\n2. يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع\nمخرج تعليمي آخر: يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي", "1. تحليل: يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية\n2. فهم: يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع\n3. فهم (مخرج آخر): يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "شدة مجال الجاذبية ‎g‎، ‎g = F/m‎، ‎g = GM/r²‎، ‎N/kg‎، ‎m/s²‎، قانون التربيع العكسي.", "يطلب المعلم حساب زمن سقوط جسم من ارتفاع ‎1.0 m‎ عند سطح الأرض ‎(g = 9.81)‎ ثم أعلى قمة إيفرست ‎(g = 9.77)‎، ويسأل: «هل ‎g‎ ثابتة فعلًا؟»", "1. ينفذ المعلم فكرة التمهيد ويناقش تغير ‎g‎، والطلبة يحسبون الزمن في الحالتين ويقارنون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «تعريف شدة مجال الجاذبية واستنتاجها»: من ‎F = GMm/r²‎ إلى ‎g = GM/r²‎ واستنتاج الوحدة، والطلبة يستنتجون المعادلة في دفاترهم ويعرض طالب الاستنتاج للصف (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدم المعلم أسئلة على العلاقة بين ‎g‎ و‎r (‎التربيع العكسي)، والطلبة يحسبون ‎g‎ عند مسافات مختلفة بالنسبة لـ ‎g‎ عند السطح (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: استنتج معادلة ‎g‎ لكتلة نقطية.\n• الإجابة النموذجية: ‎g = F/m = (GMm/r²)/m = GM/r²‎\n\n2. مستوى التطبيق: لماذا وحدة ‎N/kg‎ مكافئة لـ ‎m/s²‎؟\n• الإجابة النموذجية: لأن ‎N = kg m/s²‎، فـ ‎N/kg = m/s²‎.\n\n3. مستوى الاستدلال: كم تصبح ‎g‎ على ارتفاع يساوي نصف قطر الأرض فوق سطحها؟\n• الإجابة النموذجية: ‎r = 2R‎، فتصبح ‎g‎ ربع قيمتها عند السطح ≈ ‎2.45 N/kg‎.", "1. مستوى المعرفة: هل تعتمد ‎g‎ على كتلة الجسم الذي يسقط؟\n• الإجابة النموذجية: لا؛ تعتمد على كتلة الكوكب والبعد عن مركزه فقط.\n\n2. مستوى التطبيق: ما العلاقة بين ‎g‎ والبعد ‎r‎ عن المركز؟\n• الإجابة النموذجية: ‎g‎ تتناسب عكسيًا مع ‎r²‎.\n\n3. مستوى الاستدلال: على أي بعد من مركز الأرض تصبح ‎g‎ تسع قيمتها عند السطح؟\n• الإجابة النموذجية: على بعد ‎3R‎ من المركز.", "إرشاد للطالب: مراجعة الموضوع 1-2 وكتابة استنتاج ‎g = GM/r²‎\nإرشاد لولي الأمر: تشجيع الابن على شرح سبب تغير وزنه لو صعد إلى قمة جبل عالٍ\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2"], "h": ["<ol class=\"ol\"><li>يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية<\/li><li>يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يستنتج من قانون نيوتن للجاذبية وتعريف شدة المجال المعادلة ‎g = GM/r²‎ لكتلة نقطية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يستنتج وحدة شدة مجال الجاذبية ويربطها بوحدة التسارع<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يفسر لماذا تتناقص ‎g‎ مع زيادة البعد عن مركز الأرض وفق التربيع العكسي<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>شدة مجال الجاذبية ‎g‎، ‎g = F/m‎، ‎g = GM/r²‎، ‎N/kg‎، ‎m/s²‎، قانون التربيع العكسي.<\/p>", "<p>يطلب المعلم حساب زمن سقوط جسم من ارتفاع ‎1.0 m‎ عند سطح الأرض ‎(g = 9.81)‎ ثم أعلى قمة إيفرست ‎(g = 9.77)‎، ويسأل: «هل ‎g‎ ثابتة فعلًا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم فكرة التمهيد ويناقش تغير ‎g‎، والطلبة يحسبون الزمن في الحالتين ويقارنون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «تعريف شدة مجال الجاذبية واستنتاجها»: من ‎F = GMm/r²‎ إلى ‎g = GM/r²‎ واستنتاج الوحدة، والطلبة يستنتجون المعادلة في دفاترهم ويعرض طالب الاستنتاج للصف (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم أسئلة على العلاقة بين ‎g‎ و‎r (‎التربيع العكسي)، والطلبة يحسبون ‎g‎ عند مسافات مختلفة بالنسبة لـ ‎g‎ عند السطح (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> استنتج معادلة ‎g‎ لكتلة نقطية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎g = F/m = (GMm/r²)/m = GM/r²‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا وحدة ‎N/kg‎ مكافئة لـ ‎m/s²‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎N = kg m/s²‎، فـ ‎N/kg = m/s²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم تصبح ‎g‎ على ارتفاع يساوي نصف قطر الأرض فوق سطحها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎r = 2R‎، فتصبح ‎g‎ ربع قيمتها عند السطح ≈ ‎2.45 N/kg‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل تعتمد ‎g‎ على كتلة الجسم الذي يسقط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا؛ تعتمد على كتلة الكوكب والبعد عن مركزه فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما العلاقة بين ‎g‎ والبعد ‎r‎ عن المركز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎g‎ تتناسب عكسيًا مع ‎r²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> على أي بعد من مركز الأرض تصبح ‎g‎ تسع قيمتها عند السطح؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على بعد ‎3R‎ من المركز.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-2 وكتابة استنتاج ‎g = GM/r²‎<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على شرح سبب تغير وزنه لو صعد إلى قمة جبل عالٍ<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2<\/p>"]}, {"axis": "حساب شدة مجال الجاذبية لكواكب وأقمار", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "2 من 3"], ["محور الحصة", "حساب شدة مجال الجاذبية لكواكب وأقمار"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "الموضوع 1-2 (الأسئلة 3–8)"], ["دليل المعلم", "ص 31–34"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: شدة مجال الجاذبية ص 28"]], "t": ["1. يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة\n2. يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة\nمخرج تعليمي آخر: يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان", "1. تطبيق: يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة\n2. تطبيق: يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة\n3. تحليل (مخرج آخر): يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎g‎ عند سطح الكوكب، كتلة الكوكب، نصف القطر، تسارع السقوط الحر، المثال 1 في كتاب الطالب.", "يعرض المعلم صورة رائد فضاء يقفز على سطح القمر ويسأل: «لماذا يقفز أعلى بستة أضعاف تقريبًا؟ وكيف نحسب ‎g‎ على القمر؟»", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون حساب ‎g‎ من كتلة القمر ونصف قطره (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: ينفذ «استخدام معادلة شدة مجال الجاذبية» ويحل المثال 1، والطلبة يتبعون الحل ويحسبون ‎g‎ للأرض والقمر (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل الأسئلة 3–8 فرديًا ثم يناقش الحلول، والطلبة يحلون ويصححون باستخدام الحلول النموذجية (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم السؤال المفصلي (عطارد) ثم التقويم الختامي، والطلبة يجيبون عن السؤال المفصلي ويحلون أسئلة التقويم (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب ‎g‎ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).\n• الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ (6.4 × 10⁶)² = 9.8 N/kg‎.\n\n2. مستوى التطبيق: احسب ‎g‎ على سطح عطارد (‎M = 3.30 × 10²³ kg‎، ‎R = 2.44 × 10⁶ m‎).\n• الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 3.30 × 10²³ ÷ (2.44 × 10⁶)² = 3.7 N/kg‎.\n\n3. مستوى الاستدلال: متى تتساوى شدة مجال الجاذبية وتسارع السقوط الحر عدديًا؟\n• الإجابة النموذجية: عندما تكون الجاذبية القوة الوحيدة المؤثرة على الجسم (بإهمال مقاومة الهواء).", "1. مستوى المعرفة: اكتب علاقة كتلة كوكب بدلالة ‎g‎ و‎R‎.\n• الإجابة النموذجية: ‎M = gR²/G‎\n\n2. مستوى التطبيق: احسب كتلة كوكب نصف قطره ‎3.4 × 10⁶ m‎ و‎g‎ على سطحه ‎3.7 N/kg‎.\n• الإجابة النموذجية: ‎M = 3.7 × (3.4 × 10⁶)² ÷ 6.67 × 10⁻¹¹ = 6.4 × 10²³ kg‎.\n\n3. مستوى الاستدلال: كوكب كتلته ضعف كتلة الأرض ونصف قطره ضعف نصف قطرها. قارن ‎g‎ على سطحه بـ ‎g‎ الأرض.\n• الإجابة النموذجية: ‎g = G(2M)/(2R)² = ½ g‎ الأرض.", "إرشاد للطالب: حل الأسئلة 3–8 في كتاب الطالب\nإرشاد لولي الأمر: متابعة الابن في التعامل مع الأعداد الكبيرة بالصيغة العلمية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة<\/li><li>يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم المعادلة ‎g = GM/r²‎ لحساب شدة مجال الجاذبية لكواكب وأقمار مختلفة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب كتلة كوكب أو نصف قطره من قيمة ‎g‎ المعلومة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يميز بين شدة مجال الجاذبية وتسارع السقوط الحر ويوضح متى تتساويان<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>‎g‎ عند سطح الكوكب، كتلة الكوكب، نصف القطر، تسارع السقوط الحر، المثال 1 في كتاب الطالب.<\/p>", "<p>يعرض المعلم صورة رائد فضاء يقفز على سطح القمر ويسأل: «لماذا يقفز أعلى بستة أضعاف تقريبًا؟ وكيف نحسب ‎g‎ على القمر؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون حساب ‎g‎ من كتلة القمر ونصف قطره (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: ينفذ «استخدام معادلة شدة مجال الجاذبية» ويحل المثال 1، والطلبة يتبعون الحل ويحسبون ‎g‎ للأرض والقمر (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل الأسئلة 3–8 فرديًا ثم يناقش الحلول، والطلبة يحلون ويصححون باستخدام الحلول النموذجية (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي (عطارد) ثم التقويم الختامي، والطلبة يجيبون عن السؤال المفصلي ويحلون أسئلة التقويم (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎g‎ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ (6.4 × 10⁶)² = 9.8 N/kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎g‎ على سطح عطارد (‎M = 3.30 × 10²³ kg‎، ‎R = 2.44 × 10⁶ m‎).<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎g = 6.67 × 10⁻¹¹ × 3.30 × 10²³ ÷ (2.44 × 10⁶)² = 3.7 N/kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> متى تتساوى شدة مجال الجاذبية وتسارع السقوط الحر عدديًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عندما تكون الجاذبية القوة الوحيدة المؤثرة على الجسم (بإهمال مقاومة الهواء).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب علاقة كتلة كوكب بدلالة ‎g‎ و‎R‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎M = gR²/G‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب كتلة كوكب نصف قطره ‎3.4 × 10⁶ m‎ و‎g‎ على سطحه ‎3.7 N/kg‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎M = 3.7 × (3.4 × 10⁶)² ÷ 6.67 × 10⁻¹¹ = 6.4 × 10²³ kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كوكب كتلته ضعف كتلة الأرض ونصف قطره ضعف نصف قطرها. قارن ‎g‎ على سطحه بـ ‎g‎ الأرض.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎g = G(2M)/(2R)² = ½ g‎ الأرض.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل الأسئلة 3–8 في كتاب الطالب<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التعامل مع الأعداد الكبيرة بالصيغة العلمية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2<\/p>"]}, {"axis": "نشاط 1-2 وأسئلة كتاب التجارب في شدة مجال الجاذبية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "شدة مجال الجاذبية ‎g‎"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 1-2 وأسئلة كتاب التجارب في شدة مجال " style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم التمثيل ويطرح السؤال، والطلبة يربطون الشكل بالتربيع العكسي (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يوجه حل «أسئلة كتاب التجارب العملية والأنشطة» نشاط 1-2 (ص 28)، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسألة: هل يصح استخدام 9.81 لقمر على ارتفاع ‎400 km‎؟ والطلبة يحسبون ‎g‎ هناك ويقيّمون الخطأ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على شدة المجال، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تتغير ‎g‎ إذا زاد ‎r‎ ثلاث مرات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل إلى التسع.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎g‎ على ارتفاع ‎400 km‎ فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎r = 6.8 × 10⁶‎؛ ‎g = 9.8 × (6.4/6.8)² = 8.7 N/kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الخطأ النسبي إذا استخدمنا 9.8 بدل 8.7؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو 13%، وهو خطأ كبير لا يُهمل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما شكل منحنى ‎g‎ مقابل ‎r‎ خارج الكوكب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: منحنى يتناقص بسرعة ثم ببطء (علاقة تربيع عكسي).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يصح استخدام ‎9.81 N/kg‎ لقمر صناعي على ارتفاع كبير؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎g‎ تتناقص بزيادة البعد عن مركز الأرض.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> عند أي ارتفاع فوق سطح الأرض تصبح ‎g‎ ربع قيمتها عند السطح؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على ارتفاع يساوي نصف قطر الأرض ‎(6.4 × 10⁶ m)‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-2 ص 28<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في رسم منحنى ‎g‎ مقابل ‎r‎ بعناية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=2<\/p>"]}]}, {"title": "الطاقة وجهد الجاذبية", "sb": "الموضوع 1-3 (السؤالان 9، 10)", "unit": "الوحدة 1: مجالات الجاذبية", "periods": [{"axis": "جهد الجاذبية وتعريفه", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "1 من 3"], ["محور الحصة", "جهد الجاذبية وتعريفه"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 (السؤالان 9، 10)"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية\nمخرج تعليمي آخر: يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية", "1. تذكر: يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. تطبيق: يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية\n3. فهم (مخرج آخر): يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية", "جهد الجاذبية φ، اللانهاية، الشغل لوحدة الكتل، ‎J/kg‎، φ = ‎−GM/r‎، بئر الجهد.", "يعرض المعلم صورة «بئر الجاذبية» (سطح منحنٍ تتدحرج عليه كرات) ويسأل: «لماذا نصف الأرض بأنها في بئر جهد؟ وما المرجع الذي نقيس منه؟»", "1. ينفذ المعلم فكرة التمهيد ويطرح السؤال، والطلبة يقترحون مرجعًا للجهد الصفري (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم «الطاقة في مجال الجاذبية»: تعريف φ واللانهاية مرجعًا وسبب السالبية والمعادلة، والطلبة يكتبون التعريف ويحسبون φ عند سطح الأرض (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدم المعلم مسائل حساب φ على أبعاد مختلفة، والطلبة يحسبون في أزواج ويرسمون φ مقابل ‎r‎ (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: لماذا جهد الجاذبية سالب؟\n• الإجابة النموذجية: لأن الجهد صفر في اللانهاية والجاذبية قوة تجاذب، فيلزم بذل شغل لإخراج الكتلة إلى اللانهاية، أي إن طاقتها أقل من الصفر.\n\n2. مستوى التطبيق: احسب φ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).\n• الإجابة النموذجية: φ = ‎−6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ 6.4 × 10⁶ = −6.3 × 10⁷ J/kg‎.\n\n3. مستوى الاستدلال: كيف يتغير φ إذا تضاعف البعد عن المركز؟\n• الإجابة النموذجية: يصبح نصف قيمته (أقل سالبية).", "1. مستوى المعرفة: ما وحدة جهد الجاذبية؟\n• الإجابة النموذجية: ‎J/kg‎.\n\n2. مستوى التطبيق: أين يكون جهد الجاذبية صفرًا؟\n• الإجابة النموذجية: في اللانهاية.\n\n3. مستوى الاستدلال: احسب φ على بعد ‎1.28 × 10⁷ m‎ من مركز الأرض.\n• الإجابة النموذجية: φ = ‎−3.1 × 10⁷ J/kg (‎نصف قيمته عند السطح).", "إرشاد للطالب: مراجعة الموضوع 1-3 وكتابة تعريف جهد الجاذبية\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «بئر الجاذبية» ومعناه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3"], "h": ["<ol class=\"ol\"><li>يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/li><li>يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف جهد الجاذبية عند نقطة بأنه الشغل المبذول لوحدة الكتل لنقل كتلة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم المعادلة φ = ‎−GM/r‎ لجهد الجاذبية في مجال كتلة نقطية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يفسر سبب سالبية جهد الجاذبية وكون قيمته صفرًا في اللانهاية<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>جهد الجاذبية φ، اللانهاية، الشغل لوحدة الكتل، ‎J/kg‎، φ = ‎−GM/r‎، بئر الجهد.<\/p>", "<p>يعرض المعلم صورة «بئر الجاذبية» (سطح منحنٍ تتدحرج عليه كرات) ويسأل: «لماذا نصف الأرض بأنها في بئر جهد؟ وما المرجع الذي نقيس منه؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم فكرة التمهيد ويطرح السؤال، والطلبة يقترحون مرجعًا للجهد الصفري (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم «الطاقة في مجال الجاذبية»: تعريف φ واللانهاية مرجعًا وسبب السالبية والمعادلة، والطلبة يكتبون التعريف ويحسبون φ عند سطح الأرض (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب φ على أبعاد مختلفة، والطلبة يحسبون في أزواج ويرسمون φ مقابل ‎r‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا جهد الجاذبية سالب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجهد صفر في اللانهاية والجاذبية قوة تجاذب، فيلزم بذل شغل لإخراج الكتلة إلى اللانهاية، أي إن طاقتها أقل من الصفر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب φ عند سطح الأرض (‎M = 6.0 × 10²⁴ kg‎، ‎R = 6.4 × 10⁶ m‎).<br><span style=\"opacity:.85\">• الإجابة النموذجية: φ = ‎−6.67 × 10⁻¹¹ × 6.0 × 10²⁴ ÷ 6.4 × 10⁶ = −6.3 × 10⁷ J/kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف يتغير φ إذا تضاعف البعد عن المركز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يصبح نصف قيمته (أقل سالبية).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة جهد الجاذبية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎J/kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أين يكون جهد الجاذبية صفرًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في اللانهاية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب φ على بعد ‎1.28 × 10⁷ m‎ من مركز الأرض.<br><span style=\"opacity:.85\">• الإجابة النموذجية: φ = ‎−3.1 × 10⁷ J/kg (‎نصف قيمته عند السطح).<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-3 وكتابة تعريف جهد الجاذبية<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه «بئر الجاذبية» ومعناه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3<\/p>"]}, {"axis": "طاقة وضع الجاذبية لكتلتين نقطيتين", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "2 من 3"], ["محور الحصة", "طاقة وضع الجاذبية لكتلتين نقطيتين"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 (السؤالان 9، 10)"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎\n2. يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين\nمخرج تعليمي آخر: يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة", "1. تطبيق: يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎\n2. تطبيق: يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين\n3. تحليل (مخرج آخر): يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "طاقة وضع الجاذبية، ‎Eₚ = −GMm/r‎، التغير في الطاقة، فرق الجهد، سرعة الإفلات.", "يسأل المعلم: «لإطلاق قمر صناعي إلى مدار مرتفع، كم طاقة يحتاج؟ ولماذا لا تكفي ‎mgh‎؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون أن ‎g‎ ليست ثابتة على الارتفاعات الكبيرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم ‎Eₚ = mφ‎ وحساب ‎ΔEₚ = m(φ₂ − φ₁)‎، والطلبة يحسبون التغير في الطاقة لنقل كتلة من سطح الأرض إلى ارتفاع كبير (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يوجه حل السؤالين 9 و10 ومسألة سرعة الإفلات، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: اكتب معادلة طاقة وضع الجاذبية لكتلتين.\n• الإجابة النموذجية: ‎Eₚ = −GMm/r‎\n\n2. مستوى التطبيق: احسب الطاقة اللازمة لنقل ‎100 kg‎ من سطح الأرض ‎(φ = −6.3 × 10⁷ J/kg)‎ إلى نقطة φ = ‎−3.1 × 10⁷ J/kg‎.\n• الإجابة النموذجية: ‎ΔEₚ = 100 × (−3.1 + 6.3) × 10⁷ = 3.2 × 10⁹ J‎.\n\n3. مستوى الاستدلال: لماذا لا تصلح ‎mgh‎ هنا؟\n• الإجابة النموذجية: لأن ‎g‎ تتغير تغيرًا كبيرًا مع الارتفاع.", "1. مستوى المعرفة: ما العلاقة بين ‎Eₚ‎ وφ؟\n• الإجابة النموذجية: ‎Eₚ = mφ‎.\n\n2. مستوى التطبيق: هل تزداد طاقة وضع الجاذبية أم تقل عند الابتعاد عن الأرض؟\n• الإجابة النموذجية: تزداد (تصبح أقل سالبية).\n\n3. مستوى الاستدلال: احسب سرعة الإفلات من سطح الأرض.\n• الإجابة النموذجية: ½‎mv² = GMm/R ← v = √(2GM/R) = √(2 × 6.3 × 10⁷) = 1.1 × 10⁴ m/s‎.", "إرشاد للطالب: حل السؤالين 9 و10 ومراجعة الموضوع 1-3\nإرشاد لولي الأمر: الحديث مع الابن عن الطاقة اللازمة لإطلاق الصواريخ\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3"], "h": ["<ol class=\"ol\"><li>يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎<\/li><li>يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يصف ارتباط جهد الجاذبية بطاقة وضع الجاذبية ويستخدم المعادلة ‎Eₚ = mφ = −GMm/r‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب التغير في طاقة وضع الجاذبية عند نقل كتلة بين نقطتين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحسب سرعة الإفلات من سطح كوكب باستخدام حفظ الطاقة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>طاقة وضع الجاذبية، ‎Eₚ = −GMm/r‎، التغير في الطاقة، فرق الجهد، سرعة الإفلات.<\/p>", "<p>يسأل المعلم: «لإطلاق قمر صناعي إلى مدار مرتفع، كم طاقة يحتاج؟ ولماذا لا تكفي ‎mgh‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون أن ‎g‎ ليست ثابتة على الارتفاعات الكبيرة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم ‎Eₚ = mφ‎ وحساب ‎ΔEₚ = m(φ₂ − φ₁)‎، والطلبة يحسبون التغير في الطاقة لنقل كتلة من سطح الأرض إلى ارتفاع كبير (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يوجه حل السؤالين 9 و10 ومسألة سرعة الإفلات، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة طاقة وضع الجاذبية لكتلتين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Eₚ = −GMm/r‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الطاقة اللازمة لنقل ‎100 kg‎ من سطح الأرض ‎(φ = −6.3 × 10⁷ J/kg)‎ إلى نقطة φ = ‎−3.1 × 10⁷ J/kg‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔEₚ = 100 × (−3.1 + 6.3) × 10⁷ = 3.2 × 10⁹ J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تصلح ‎mgh‎ هنا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎g‎ تتغير تغيرًا كبيرًا مع الارتفاع.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما العلاقة بين ‎Eₚ‎ وφ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Eₚ = mφ‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل تزداد طاقة وضع الجاذبية أم تقل عند الابتعاد عن الأرض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تزداد (تصبح أقل سالبية).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب سرعة الإفلات من سطح الأرض.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ½‎mv² = GMm/R ← v = √(2GM/R) = √(2 × 6.3 × 10⁷) = 1.1 × 10⁴ m/s‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل السؤالين 9 و10 ومراجعة الموضوع 1-3<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الطاقة اللازمة لإطلاق الصواريخ<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=3<\/p>"]}, {"axis": "المجال والجهد الناشئ عن كتلتين ونشاطا 1-3 و1-4", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الطاقة وجهد الجاذبية"], ["الحصة", "3 من 3"], ["محور الحصة", "المجال والجهد الناشئ عن كتلتين ونشاطا 1-3 و1-4"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "الموضوع 1-3 + كتاب التجارب ص 30 و34"], ["دليل المعلم", "ص 33–37"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: الطاقة وجهد الجاذبية ص 30؛ نشاط 1-4: المجال والجهد الناشئ عن كتلتين ص 34"]], "t": ["1. يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات\n2. يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري\nمخرج تعليمي آخر: يحدد نقطة انعدام المجال بين الأرض والقمر ويفسر عدم انعدام الجهد عندها", "1. تطبيق: يحسب محصلة شدة مجال الجاذبية الناشئ عن كتلتين بجمع المتجهات\n2. تطبيق: يحسب الجهد الكلي الناشئ عن كتلتين بالجمع الجبري\n3. تحليل (مخرج آخر): يحدد نقطة انعدام المجال بين الأرض والقمر ويفسر عدم انعدام الجهد عندها", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "جمع المتجهات، المجال المحصل، الجهد الكلي، الجمع الجبري، نقطة انعدام المجال، الكميات المتجهة والعددية.", "يسأل المعلم: «في رحلة من الأرض إلى القمر توجد نقطة لا يشعر فيها رائد الفضاء بأي جذب صافٍ؛ أين تقع تقريبًا؟ وهل الجهد صفر عندها؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون أنها أقرب إلى القمر (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم جمع شدتي المجال متجهيًا وجمع الجهدين جبريًا بمثال، والطلبة يحسبون المجال والجهد عند نقطة بين كتلتين (13 دقيقة)\nالاستراتي iv class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تُجمع شدتا المجال متجهيًا بينما يُجمع الجهد جبريًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن شدة المجال كمية متجهة والجهد كمية عددية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> عند نقطة انعدام المجال بين الأرض والقمر، ماذا تساوي شدتا المجالين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: متساويتان مقدارًا ومتعاكستان اتجاهًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يكون الجهد صفرًا عند نقطة انعدام المجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجهدين سالبان كلاهما فيجمعان ولا يلغي أحدهما الآخر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل الجهد كمية متجهة أم عددية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عددية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كتلتان متساويتان، ما شدة المجال المحصل عند منتصف المسافة بينهما؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: صفر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب الجهد الكلي عند منتصف المسافة بين كتلتين كل منهما ‎1.0 × 10²² kg‎ بينهما ‎2.0 × 10⁸ m‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: φ = ‎2 × (−6.67 × 10⁻¹¹ × 1.0 × 10²² ÷ 1.0 × 10⁸) = −1.3 × 10⁴ J/kg‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 1-3 و1-4 ص 30 و34<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التمييز بين الكميات المتجهة والعددية بأمثلة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفا ، والطلبة يستنتجون العلاقة ويحسبون سرعة قمر على مدار معين (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "1. مستوى المعرفة: ما القوة التي توفر القوة المركزية للقمر الصناعي؟\n• الإجابة النموذجية: قوة الجاذبية بين الأرض والقمر.\n\n2. مستوى التطبيق: اشتق علاقة السرعة المدارية.\n• الإجابة النموذجية: ‎GMm/r² = mv²/r ← v² = GM/r ← v = √(GM/r)‎\n\n3. مستوى الاستدلال: احسب سرعة قمر يدور على بعد ‎7.0 × 10⁶ m‎ من مركز الأرض ‎(GM = 4.0 × 10¹⁴)‎.\n• الإجابة النموذجية: ‎v = √(4.0 × 10¹⁴ ÷ 7.0 × 10⁶) = 7.6 × 10³ m/s‎.", "1. مستوى المعرفة: كيف تتغير السرعة المدارية بزيادة نصف قطر المدار؟\n• الإجابة النموذجية: تقل.\n\n2. مستوى التطبيق: لماذا لا تعتمد السرعة المدارية على كتلة القمر؟\n• الإجابة النموذجية: لأن الكتلة ‎m‎ تُختصر من طرفي المعادلة.\n\n3. مستوى الاستدلال: قمران على المدار نفسه كتلة أحدهما ضعف الآخر؛ قارن سرعتيهما والقوة المركزية عليهما.\n• الإجابة النموذجية: السرعتان متساويتان، والقوة على الأثقل ضعف الأخرى.", "إرشاد للطالب: مراجعة الموضوع 1-4 واشتقاق علاقة السرعة المدارية\nإرشاد لولي الأمر: الحديث مع الابن عن الأقمار الصناعية للاتصالات والملاحة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4"], "h": ["<ol class=\"ol\"><li>يحلل المدارات الدائرية في مجالات الجاذبية بداللة الجاذبية قوةً مركزية: ‎GMm/r² = mv²/r‎<\/li><li>يستنتج علاقة سرعة القمر المداري ‎v = √(GM/r)‎ ويستخدمها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا لا تعتمد سرعة القمر الصناعي المداري على كتلته<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يحلل المدارات الدائرية في مجالات الجاذبية بداللة الجاذبية قوةً مركزية: ‎GMm/r² = mv²/r‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستنتج علاقة سرعة القمر المداري ‎v = √(GM/r)‎ ويستخدمها<\/p><p class=\"pstep\" style=\ تقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما القوة التي توفر القوة المركزية للقمر الصناعي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قوة الجاذبية بين الأرض والقمر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اشتق علاقة السرعة المدارية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎GMm/r² = mv²/r ← v² = GM/r ← v = √(GM/r)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب سرعة قمر يدور على بعد ‎7.0 × 10⁶ m‎ من مركز الأرض ‎(GM = 4.0 × 10¹⁴)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎v = √(4.0 × 10¹⁴ ÷ 7.0 × 10⁶) = 7.6 × 10³ m/s‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تتغير السرعة المدارية بزيادة نصف قطر المدار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا تعتمد السرعة المدارية على كتلة القمر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الكتلة ‎m‎ تُختصر من طرفي المعادلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قمران على المدار نفسه كتلة أحدهما ضعف الآخر؛ قارن سرعتيهما والقوة المركزية عليهما.<br><span style=\"opacity:.85\">• الإجابة النموذجية: السرعتان متساويتان، والقوة على الأثقل ضعف الأخرى.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 1-4 واشتقاق علاقة السرعة المدارية<\/p><p><b>إ  كتاب الطالب وأنشطة كتاب التجارب)، والطلبة يحسبون ‎r ≈ 4.2 × 10⁷ m‎ ويحلون الأسئلة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: اذكر شروط القمر الصناعي الثابت بالنسبة للأرض.\n• الإجابة النموذجية: زمن دوري 24 ساعة، ومدار في مستوى خط الاستواء، ودوران في اتجاه دوران الأرض (من الغرب إلى الشرق).\n\n2. مستوى التطبيق: احسب نصف قطر مدار القمر الثابت (‎GM = 4.0 × 10¹⁴‎، ‎T = 8.64 × 10⁴ s‎).\n• الإجابة النموذجية: ‎r³ = GMT²/4π² = 7.6 × 10²² ← r = 4.2 × 10⁷ m‎.\n\n3. مستوى الاستدلال: كم يبلغ ارتفاعه فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎؟\n• الإجابة النموذجية: نحو ‎3.6 × 10⁷ m‎.", "1. مستوى المعرفة: ما الزمن الدوري للقمر الصناعي الثابت بالنسبة للأرض؟\n• الإجابة النموذجية: 24 ساعة.\n\n2. مستوى التطبيق: إذا زاد نصف قطر المدار أربع مرات، فكيف يتغير الزمن الدوري؟\n• الإجابة النموذجية: يزداد ثماني مرات ‎(T ∝ r^1.5)‎.\n\n3. مستوى الاستدلال: لماذا لا يمكن وضع قمر صناعي ثابت فوق سلطنة عمان تمامًا؟\n• الإجابة النموذجية: لأن مدار القمر الثابت يجب أن يكون فوق خط الاستواء، وسلطنة عمان تقع شماله؛ فيُرى القمر من عُمان في السماء جهة الجنوب.", "إرشاد للطالب: حل الأسئلة 11–14 ومراجعة شروط القمر الثابت\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن اتجاه أطباق الاستقبال جهة الجنوب في عُمان وسببه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4"], "h": ["<ol class=\"ol\"><li>يشتق العلاقة بين الزمن الدوري ونصف قطر المدار ‎T² = 4π²r³/GM‎ ويستخدمها<\/li><li>يذكر أن القمر الصناعي الثابت بالنسبة للأرض يبقى فوق النقطة نفسها، ويدور بزمن دوري 24 ساعة من الغرب إلى الشرق في مستوى خط الاستواء<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب نصف قطر مدار القمر الصناعي الثابت بالنسبة للأرض<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يشتق العلاقة بين الزمن الدوري ونصف قطر المدار ‎T² = 4π²r³/GM‎ ويستخدمها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يذكر أن القمر الصناعي الثابت بالنسبة للأرض يبقى فوق النقطة نفسها، ويدور بزمن دوري 24 ساعة من الغرب إلى الشرق في مستوى خط الاستواء<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب نصف قطر مدار القمر الصناعي الثابت بالنسبة للأرض<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الزمن الدوري ‎T‎، ‎T² ∝ r³‎، القمر الصناعي الثابت بالنسبة للأرض، المدار الاستوائي، 24 ساعة، اتجاه الدوران.<\/p>", "<p>يعرض المعلم صورة طبق استقبال فضائي مثبت على سطح منزل ويسأل: «لماذا لا يحتاج الطبق إلى الدوران لمتابعة القمر الصناعي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يستنتجون أن القمر يبدو ثابتًا (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشتق المعلم ‎T² = 4π²r³/GM‎ ويشرح شروط القمر الصناعي الثابت، والطلبة يشتقون العلاقة ويكتبون الشروط الثلاثة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حساب نصف قطر المدار الثابت والأسئلة 11–14 (أسئلة كتاب الطالب وأنشطة كتاب التجارب)، والطلبة يحسبون ‎r ≈ 4.2 × 10⁷ m‎ ويحلون الأسئلة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر شروط القمر الصناعي الثابت بالنسبة للأرض.<br><span style=\"opacity:.85\">• الإجابة النموذجية: زمن دوري 24 ساعة، ومدار في مستوى خط الاستواء، ودوران في اتجاه دوران الأرض (من الغرب إلى الشرق).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب نصف قطر مدار القمر الثابت (‎GM = 4.0 × 10¹⁴‎، ‎T = 8.64 × 10⁴ s‎).<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎r³ = GMT²/4π² = 7.6 × 10²² ← r = 4.2 × 10⁷ m‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم يبلغ ارتفاعه فوق سطح الأرض ‎(R = 6.4 × 10⁶ m)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو ‎3.6 × 10⁷ m‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الزمن الدوري للقمر الصناعي الثابت بالنسبة للأرض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 24 ساعة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> إذا زاد نصف قطر المدار أربع مرات، فكيف يتغير الزمن الدوري؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يزداد ثماني مرات ‎(T ∝ r^1.5)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يمكن وضع قمر صناعي ثابت فوق سلطنة عمان تمامًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن مدار القمر الثابت يجب أن يكون فوق خط الاستواء، وسلطنة عمان تقع شماله؛ فيُرى القمر من عُمان في السماء جهة الجنوب.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل الأسئلة 11–14 ومراجعة شروط القمر الثابت<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن الحديث مع الابن عن اتجاه أطباق الاستقبال جهة الجنوب في عُمان وسببه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=4<\/p>"]}, {"axis": "نشاط 1-5 ومسائل الدوران تحت تأثير الجاذبية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: مجالات الجاذبية"], ["الدرس", "الدوران تحت تأثير الجاذبية"], ["الحصة", "3 من 4"], ["محور الحصة", "نشاط 1-5 ومسائل الدوران تحت تأثير الجاذبية"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "الموضوع 1-4 + كتاب التجارب ص 35"], ["دليل المعلم", "ص 36–48"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: الدوران تحت تأثير الجاذبية ص 35"]], "t": ["1. يحل نشاط 1-5 «الدوران تحت تأثير الجاذبية»\n2. يحسب كتلة كوكب من الزمن الدوري ونصف قطر مدار أحد أقماره\nمخرج تعليمي آخر: يقارن بين مدارات منخفضة ومدارات ثابتة من حيث الاستخدام", "1. تطبيق: يحل نشاط 1-5 «الدوران تحت تأثير الجاذبية»\n2. تطبيق: يحسب كتلة كوكب من الزمن الدوري ونصف قطر مدار أحد أقماره\n3. تقييم (مخرج آخر): يقارن بين مدارات منخفضة ومدارات ثابتة من حيث الاستخدام", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "كتلة الكوكب من بيانات المدار، المدارات المنخفضة، المدارات الثابتة، تطبيقات الأقمار الصناعية.", "يسأل المعلم: «كيف عرف العلماء كتلة كوكب المشتري دون أن يزنوه؟» ويلمّح إلى أقماره.", "1. يطرح المعلم السؤال، والطلبة يقترحون استخدام مدار أحد أقماره (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يوجه المعلم حل نشاط 1-5 (كتاب التجارب ص 35)، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم م list\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب علاقة كتلة الكوكب من بيانات مدار قمره.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎M = 4π²r³/(GT²)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب كتلة الأرض من مدار القمر (‎r = 3.8 × 10⁸ m‎، ‎T = 2.36 × 10⁶ s‎).<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎M = 4π² × (3.8 × 10⁸)³ ÷ (6.67 × 10⁻¹¹ × (2.36 × 10⁶)²) = 5.8 × 10²⁴ kg‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تفضل أقمار التصوير المدارات المنخفضة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها أقرب إلى الأرض فتعطي صورًا أدق، وتمر فوق مناطق مختلفة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الزمن الدوري لقمر صناعي في مدار منخفض مقارنة بالقمر الثابت؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أقصر بكثير (نحو 90 دقيقة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تستخدم أقمار الاتصالات المدارات الثابتة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها تبقى فوق النقطة نفسها فلا تحتاج الأطباق إلى تتبعها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما عيب المدار الثابت لأقمار الاتصالات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بعده الكبير يسبب تأخرًا زمنيًا في الإشارة ويتطلب أجهزة إرسال أقوى.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-5 ص 35<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين أقمار الاتصالات وأقمار التصوير<\/p><p>🎮 رابط ألعاب ونشاط الدرس الت ة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: بالون مشحون بالدلك وقصاصات ورق<\/span><\/div>", "<p>الشحنة الكهربائية، المجال الكهربائي، شدة المجال ‎E = F/Q‎، الشحنة الاختبارية الموجبة، ‎N/C‎، التجاذب والتنافر.<\/p>", "<p>يدلك المعلم بالونًا بقطعة صوف ويقربه من قصاصات ورق دون أن يلمسها، ثم يسأل: «كيف أثّر البالون في الورق عن بعد؟ وما الشبه بين هذا وجذب الأرض للأجسام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال ومهام بداية الوحدة، والطلبة يقترحون وجود مجال حول البالون المشحون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يعرّف المعلم المجال الكهربائي وشدته ‎E = F/Q‎ واتجاهه، ويقارنه بمجال الجاذبية، والطلبة يكملون جدول مقارنة بين المجالين (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مواقف لتحديد اتجاه القوة والمجال على شحنات موجبة وسالبة، والطلبة يحددون الاتجاهات في أزواج ويبررون (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف شدة المجال الكهربائي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوة المؤثرة لكل وحدة شحنة موجبة موضوعة عند تلك النقطة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما وحدة شدة المجال الكهربائي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎N/C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف يكون اتجاه القوة على شحنة سالبة في مجال كهربائي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عكس اتجاه المجال.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق الأساسي بين قوة الجاذبية والقوة الكهربائية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجاذبية تجاذب دائمًا بين الكتل، والكهربائية قد تكون تجاذبًا أو تنافرًا بين الشحنات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب شدة المجال إذا أثرت قوة ‎6.0 × 10⁻³ N‎ على شحنة ‎2.0 × 10⁻⁶ C‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E = 3.0 × 10³ N/C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نستخدم شحنة اختبارية صغيرة لتعريف المجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كي لا تؤثر في المجال الذي نقيسه أو في توزيع الشحنات المسببة له.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-1 وإكمال جدول المقارنة بين مجالي الجاذبية والكهرباء<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الكهرباء الساكنة في الحياة اليومية (الشرارة عند لمس مقبض الباب)<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=5<\/p>"]}, {"axis": "تمثيل المجال الكهربائي بخطوط المجال", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "المجال الكهربائي"], ["الحصة", "2 من 5"], ["محور الحصة", "تمثيل المجال الكهربائ
