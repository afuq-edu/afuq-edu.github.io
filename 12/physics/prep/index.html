 = ½CV²‎ من ‎W = ½QV‎.<\/td><td>بالتعويض ‎Q = CV: W = ½(CV)V = ½CV²‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>أي صيغة تستخدم إذا عُلمت ‎C‎ و‎V‎ فقط؟<\/td><td>‎W = ½CV²‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>مكثفان: الأول ‎100 μF‎ عند ‎20 V‎، والثاني ‎400 μF‎ عند ‎10 V‎. أيهما يخزن طاقة أكبر؟<\/td><td>الأول: ‎0.020 J‎؛ الثاني: ‎0.020 J‎؛ متساويان.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل خمس مسائل على معادلات الطاقة<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في اختيار المعادلة المناسبة للمعطيات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16<\/p>"]}, {"axis": "نشاط 4-2 وتطبيقات المكثفات والأسئلة 1–10", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 4-2 وتطبيقات المكثفات والأسئلة 1–10"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 + كتاب التجارب ص 114"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10\n2. يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)\nمخرج تعليمي آخر: يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تقييم", "- التعلم التشاركي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "تطبيقات المكثفات، التفريغ السريع، مزيل الرجفان، وميض الكاميرا، المقارنة بالبطاريات، كثافة الطاقة.", "يعرض المعلم صورة جهاز مزيل الرجفان في مطار أو مستشفى ويسأل: «لماذا يستخدم الجهاز مكثفًا وليس البطارية مباشرة لإيصال الصدمة؟»", "1. 5 دقائق — التعلم التشاركي: يعرض الصورة ويطرح السؤال\n• الطالب: يقترحون أن المكثف يفرغ طاقته بسرعة كبيرة\n\n2. 15 دقيقة — التعلم التشاركي: يوجه حل نشاط 4-2 (ص 114) والأسئلة المتبقية من 1–10\n• الطالب: يحلون فرديًا ثم يقارنون\n\n3. 12 دقيقة — التعلم التعاوني: يدير نقاشًا لمقارنة المكثفات بالبطاريات ويكمل الطلبة جدولًا\n• الطالب: يقارنون في مجموعات ويعرضون\n\n4. 8 دقائق: يختم بمسابقة المجموعات على المكثفات والطاقة\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: لماذا يُستخدم المكثف في مزيل الرجفان؟\n   الإجابة النموذجية: لأنه يطلق طاقته في زمن قصير جدًا فيعطي قدرة كبيرة.\n2) (مستوى التطبيق) السؤال: احسب الطاقة في مكثف ‎32 μF‎ مشحون إلى ‎5000 V‎.\n   الإجابة النموذجية: ‎W = ½ × 32 × 10⁻⁶ × 2.5 × 10⁷ = 400 J‎.\n3) (مستوى الاستدلال) السؤال: اذكر عيبًا للمكثف مقارنة بالبطارية.\n   الإجابة النموذجية: يخزن طاقة أقل بكثير لكل وحدة كتلة، وتتناقص فولتيته أثناء التفريغ.", "1) (مستوى المعرفة) السؤال: اذكر تطبيقين للمكثفات في تخزين الطاقة.\n   الإجابة النموذجية: وميض الكاميرا، ومزيل الرجفان.\n2) (مستوى التطبيق) السؤال: ما ميزة المكثف في تطبيقات التفريغ السريع؟\n   الإجابة النموذجية: يطلق الطاقة بسرعة كبيرة فيعطي قدرة عالية لحظية.\n3) (مستوى الاستدلال) السؤال: إذا أطلق مكثف ‎400 J‎ خلال ‎4.0 ms‎، فما القدرة المتوسطة؟\n   الإجابة النموذجية: ‎P = 400 ÷ 4.0 × 10⁻³ = 1.0 × 10⁵ W‎.", "إرشاد للطالب: إكمال نشاط 4-2 ص 114 والأسئلة 1–10\nإرشاد لولي الأمر: الحديث مع الابن عن جهاز مزيل الرجفان وأهمية تعلم الإسعافات الأولية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16"], "h": ["<ol class=\"ol\"><li>يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10<\/li><li>يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 4-2 «الطاقة المخزنة بواسطة مكثف مشحون» والأسئلة المتبقية من 1–10<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يصف تطبيقات تخزين الطاقة في المكثفات (وميض الكاميرا، مزيل الرجفان، الحماية من انقطاع التيار)<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقيّم مزايا المكثفات وعيوبها مقارنة بالبطاريات في تخزين الطاقة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم التشاركي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>تطبيقات المكثفات، التفريغ السريع، مزيل الرجفان، وميض الكاميرا، المقارنة بالبطاريات، كثافة الطاقة.<\/p>", "<p>يعرض المعلم صورة جهاز مزيل الرجفان في مطار أو مستشفى ويسأل: «لماذا يستخدم الجهاز مكثفًا وليس البطارية مباشرة لإيصال الصدمة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التشاركي:<\/b> يعرض الصورة ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون أن المكثف يفرغ طاقته بسرعة كبيرة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — التعلم التشاركي:<\/b> يوجه حل نشاط 4-2 (ص 114) والأسئلة المتبقية من 1–10<br><span style=\"opacity:.85\">• الطالب: يحلون فرديًا ثم يقارنون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يدير نقاشًا لمقارنة المكثفات بالبطاريات ويكمل الطلبة جدولًا<br><span style=\"opacity:.85\">• الطالب: يقارنون في مجموعات ويعرضون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات على المكثفات والطاقة<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا يُستخدم المكثف في مزيل الرجفان؟<\/td><td>لأنه يطلق طاقته في زمن قصير جدًا فيعطي قدرة كبيرة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الطاقة في مكثف ‎32 μF‎ مشحون إلى ‎5000 V‎.<\/td><td>‎W = ½ × 32 × 10⁻⁶ × 2.5 × 10⁷ = 400 J‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>اذكر عيبًا للمكثف مقارنة بالبطارية.<\/td><td>يخزن طاقة أقل بكثير لكل وحدة كتلة، وتتناقص فولتيته أثناء التفريغ.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اذكر تطبيقين للمكثفات في تخزين الطاقة.<\/td><td>وميض الكاميرا، ومزيل الرجفان.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما ميزة المكثف في تطبيقات التفريغ السريع؟<\/td><td>يطلق الطاقة بسرعة كبيرة فيعطي قدرة عالية لحظية.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>إذا أطلق مكثف ‎400 J‎ خلال ‎4.0 ms‎، فما القدرة المتوسطة؟<\/td><td>‎P = 400 ÷ 4.0 × 10⁻³ = 1.0 × 10⁵ W‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-2 ص 114 والأسئلة 1–10<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن جهاز مزيل الرجفان وأهمية تعلم الإسعافات الأولية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16<\/p>"]}]}, {"title": "توصيل المكثفات على التوازي", "sb": "الموضوع 4-3 (الأسئلة 11–20)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "استنتاج السعة المكافئة للمكثفات الموصولة على التوازي", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوازي"], ["الحصة", "1 من 2"], ["محور الحصة", "استنتاج السعة المكافئة للمكثفات الموصولة على التوازي"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-3 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎\n2. يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها\nمخرج تعليمي آخر: يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: مكثفات وأسلاك ومقياس سعة (للعرض)", "التوصيل على التوازي، فرق الجهد المشترك، الشحنة الكلية ‎Q = Q₁ + Q₂‎، السعة المكافئة ‎C = C₁ + C₂‎.", "يذكّر المعلم الطلبة بنص قانوني كيرشوف ويطلب استخدامهما لاستنتاج معادلات مقاومتين على التوالي ثم على التوازي، ثم يسأل: «هل تتوقع أن تتبع المكثفات القوانين نفسها؟» (فكرة التمهيد).", "1. 5 دقائق — التعلم التعاوني: يراجع استنتاجات المقاومات ويطرح السؤال\n• الطالب: يتوقعون ويبررون\n\n2. 13 دقيقة — التعلم بالنمذجة: يشتق ‎C = C₁ + C₂‎ من ‎V‎ مشترك و‎Q = Q₁ + Q₂‎\n• الطالب: يكتبون الاستنتاج خطوة بخطوة\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل حساب السعة المكافئة وشحنة كل مكثف\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: ما الكمية المشتركة بين المكثفات الموصولة على التوازي؟\n   الإجابة النموذجية: فرق الجهد.\n2) (مستوى التطبيق) السؤال: استنتج معادلة التوازي.\n   الإجابة النموذجية: ‎Q = Q₁ + Q₂ ← CV = C₁V + C₂V ← C = C₁ + C₂‎.\n3) (مستوى الاستدلال) السؤال: احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوازي.\n   الإجابة النموذجية: ‎5.0 μF‎.", "1) (مستوى المعرفة) السؤال: هل تزداد السعة المكافئة أم تقل بإضافة مكثف على التوازي؟\n   الإجابة النموذجية: تزداد.\n2) (مستوى التطبيق) السؤال: احسب الشحنة على كل مكثف (‎2.0 μF‎ و‎3.0 μF‎) على التوازي مع مصدر ‎12 V‎.\n   الإجابة النموذجية: ‎Q₁ = 24 μC‎، ‎Q₂ = 36 μC‎.\n3) (مستوى الاستدلال) السؤال: لماذا يشبه قانون التوازي في المكثفات قانون التوالي في المقاومات؟\n   الإجابة النموذجية: لأن السعة تُجمع مباشرة في التوازي كما تُجمع المقاومات في التوالي.", "إرشاد للطالب: مراجعة الموضوع 4-3 وكتابة استنتاج معادلة التوازي\nإرشاد لولي الأمر: متابعة الابن في التمييز بين قوانين المكثفات والمقاومات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎<\/li><li>يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوازي ‎C = C₁ + C₂‎ مستخدمًا ‎C = Q/V‎<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يفسر أن المكثفات على التوازي لها فرق الجهد نفسه وأن الشحنة الكلية مجموع شحناتها<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقارن قانون التوازي في المكثفات بقانون التوالي في المقاومات<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: مكثفات وأسلاك ومقياس سعة (للعرض)<\/span><\/div>", "<p>التوصيل على التوازي، فرق الجهد المشترك، الشحنة الكلية ‎Q = Q₁ + Q₂‎، السعة المكافئة ‎C = C₁ + C₂‎.<\/p>", "<p>يذكّر المعلم الطلبة بنص قانوني كيرشوف ويطلب استخدامهما لاستنتاج معادلات مقاومتين على التوالي ثم على التوازي، ثم يسأل: «هل تتوقع أن تتبع المكثفات القوانين نفسها؟» (فكرة التمهيد).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يراجع استنتاجات المقاومات ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون ويبررون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالنمذجة:<\/b> يشتق ‎C = C₁ + C₂‎ من ‎V‎ مشترك و‎Q = Q₁ + Q₂‎<br><span style=\"opacity:.85\">• الطالب: يكتبون الاستنتاج خطوة بخطوة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل حساب السعة المكافئة وشحنة كل مكثف<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الكمية المشتركة بين المكثفات الموصولة على التوازي؟<\/td><td>فرق الجهد.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>استنتج معادلة التوازي.<\/td><td>‎Q = Q₁ + Q₂ ← CV = C₁V + C₂V ← C = C₁ + C₂‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوازي.<\/td><td>‎5.0 μF‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>هل تزداد السعة المكافئة أم تقل بإضافة مكثف على التوازي؟<\/td><td>تزداد.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الشحنة على كل مكثف (‎2.0 μF‎ و‎3.0 μF‎) على التوازي مع مصدر ‎12 V‎.<\/td><td>‎Q₁ = 24 μC‎، ‎Q₂ = 36 μC‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا يشبه قانون التوازي في المكثفات قانون التوالي في المقاومات؟<\/td><td>لأن السعة تُجمع مباشرة في التوازي كما تُجمع المقاومات في التوالي.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-3 وكتابة استنتاج معادلة التوازي<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التمييز بين قوانين المكثفات والمقاومات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17<\/p>"]}, {"axis": "حسابات المكثفات على التوازي والطاقة المخزنة فيها", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوازي"], ["الحصة", "2 من 2"], ["محور الحصة", "حسابات المكثفات على التوازي والطاقة المخزنة فيها"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-3 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي\n2. يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)\nمخرج تعليمي آخر: يفسر نقص الطاقة الكلية بعد تقاسم الشحنة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الطاقة في التوازي، تقاسم الشحنة، حفظ الشحنة، الجهد المشترك النهائي، فقد الطاقة.", "يسأل المعلم: «وصلنا مكثفًا مشحونًا بآخر فارغ مماثل له؛ هل تبقى الطاقة الكلية كما هي؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يتوقعون بقاء الطاقة\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يحل مسألة تقاسم الشحنة: حفظ الشحنة والجهد المشترك والطاقة قبل وبعد\n• الطالب: يتتبعون الحل ويكتشفون نقص الطاقة\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل طاقة المجموعات على التوازي\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: مكثف ‎10 μF‎ مشحون إلى ‎12 V‎ وُصل بمكثف ‎10 μF‎ فارغ. ما الجهد النهائي؟\n   الإجابة النموذجية: الشحنة ‎120 μC‎ تتوزع على ‎20 μF‎، فيصبح الجهد ‎6.0 V‎.\n2) (مستوى التطبيق) السؤال: احسب الطاقة قبل التوصيل وبعده.\n   الإجابة النموذجية: قبل: ‎7.2 × 10⁻⁴ J‎؛ بعد: ½ × ‎20 × 10⁻⁶ × 36 = 3.6 × 10⁻⁴ J‎.\n3) (مستوى الاستدلال) السؤال: أين ذهبت الطاقة المفقودة؟\n   الإجابة النموذجية: تحولت إلى حرارة في الأسلاك وإشعاع أثناء انتقال الشحنة.", "1) (مستوى المعرفة) السؤال: ما الكمية المحفوظة عند تقاسم الشحنة؟\n   الإجابة النموذجية: الشحنة الكلية.\n2) (مستوى التطبيق) السؤال: احسب الطاقة الكلية لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوازي مع ‎12 V‎.\n   الإجابة النموذجية: ‎W = ½ × 5.0 × 10⁻⁶ × 144 = 3.6 × 10⁻⁴ J‎.\n3) (مستوى الاستدلال) السؤال: لماذا نقصت الطاقة إلى النصف تمامًا في مثال المكثفين المتماثلين؟\n   الإجابة النموذجية: لأن الجهد صار نصفه والسعة ضعفها، فالطاقة ½‎CV²‎ تصبح ½ × ‎2C × (V/2)² =‎ نصف الأصلية.", "إرشاد للطالب: حل مسائل الطاقة وتقاسم الشحنة\nإرشاد لولي الأمر: سؤال الابن عن حفظ الشحنة وعدم حفظ الطاقة الكهربائية في هذه الحالة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17"], "h": ["<ol class=\"ol\"><li>يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي<\/li><li>يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر نقص الطاقة الكلية بعد تقاسم الشحنة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحسب الشحنة والطاقة المخزنة في كل مكثف وفي المجموعة الموصولة على التوازي<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحلل حالة توصيل مكثف مشحون بآخر غير مشحون على التوازي (تقاسم الشحنة)<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يفسر نقص الطاقة الكلية بعد تقاسم الشحنة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الطاقة في التوازي، تقاسم الشحنة، حفظ الشحنة، الجهد المشترك النهائي، فقد الطاقة.<\/p>", "<p>يسأل المعلم: «وصلنا مكثفًا مشحونًا بآخر فارغ مماثل له؛ هل تبقى الطاقة الكلية كما هي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون بقاء الطاقة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم المبني على حل المشكلات:<\/b> يحل مسألة تقاسم الشحنة: حفظ الشحنة والجهد المشترك والطاقة قبل وبعد<br><span style=\"opacity:.85\">• الطالب: يتتبعون الحل ويكتشفون نقص الطاقة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل طاقة المجموعات على التوازي<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>مكثف ‎10 μF‎ مشحون إلى ‎12 V‎ وُصل بمكثف ‎10 μF‎ فارغ. ما الجهد النهائي؟<\/td><td>الشحنة ‎120 μC‎ تتوزع على ‎20 μF‎، فيصبح الجهد ‎6.0 V‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الطاقة قبل التوصيل وبعده.<\/td><td>قبل: ‎7.2 × 10⁻⁴ J‎؛ بعد: ½ × ‎20 × 10⁻⁶ × 36 = 3.6 × 10⁻⁴ J‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>أين ذهبت الطاقة المفقودة؟<\/td><td>تحولت إلى حرارة في الأسلاك وإشعاع أثناء انتقال الشحنة.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الكمية المحفوظة عند تقاسم الشحنة؟<\/td><td>الشحنة الكلية.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الطاقة الكلية لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوازي مع ‎12 V‎.<\/td><td>‎W = ½ × 5.0 × 10⁻⁶ × 144 = 3.6 × 10⁻⁴ J‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا نقصت الطاقة إلى النصف تمامًا في مثال المكثفين المتماثلين؟<\/td><td>لأن الجهد صار نصفه والسعة ضعفها، فالطاقة ½‎CV²‎ تصبح ½ × ‎2C × (V/2)² =‎ نصف الأصلية.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل مسائل الطاقة وتقاسم الشحنة<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن حفظ الشحنة وعدم حفظ الطاقة الكهربائية في هذه الحالة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=17<\/p>"]}]}, {"title": "توصيل المكثفات على التوالي", "sb": "الموضوع 4-4 (الأسئلة 11–20)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "استنتاج السعة المكافئة للمكثفات الموصولة على التوالي", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوالي"], ["الحصة", "1 من 2"], ["محور الحصة", "استنتاج السعة المكافئة للمكثفات الموصولة على التوالي"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوع 4-4 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎\n2. يفسر أن المكثفات على التوالي تحمل الشحنة نفسها وأن فرق الجهد الكلي مجموع فروق جهودها\nمخرج تعليمي آخر: يفسر لماذا تحمل المكثفات على التوالي الشحنة نفسها (الشحن بالحث بين اللوحين الداخليين)", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية", "التوصيل على التوالي، الشحنة المشتركة، ‎V = V₁ + V₂‎، ‎1/C = 1/C₁ + 1/C₂‎، السعة المكافئة أصغر من أصغر سعة.", "يسأل المعلم: «إذا وصلنا مكثفين على التوالي، فإن اللوحين الأوسطين غير متصلين بالمصدر؛ فمن أين تأتي شحنتهما؟»", "1. 5 دقائق — التعلم التعاوني: يطرح السؤال\n• الطالب: يقترحون انتقال الإلكترونات بين اللوحين الأوسطين\n\n2. 13 دقيقة — التعلم بالنمذجة: يشرح تساوي الشحنات ويشتق ‎1/C = 1/C₁ + 1/C₂‎\n• الطالب: يكتبون الاستنتاج خطوة بخطوة\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل حساب السعة المكافئة لمكثفين وثلاثة\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: ما الكمية المشتركة بين المكثفات على التوالي؟\n   الإجابة النموذجية: الشحنة.\n2) (مستوى التطبيق) السؤال: استنتج معادلة التوالي.\n   الإجابة النموذجية: ‎V = V₁ + V₂ ← Q/C = Q/C₁ + Q/C₂ ← 1/C = 1/C₁ + 1/C₂‎.\n3) (مستوى الاستدلال) السؤال: احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوالي.\n   الإجابة النموذجية: ‎1/C = 1/2 + 1/3 = 5/6 ← C = 1.2 μF‎.", "1) (مستوى المعرفة) السؤال: كيف تقارن السعة المكافئة للتوالي بأصغر مكثف؟\n   الإجابة النموذجية: أصغر منها.\n2) (مستوى التطبيق) السؤال: احسب السعة المكافئة لمكثفين ‎4.0 μF‎ متماثلين على التوالي.\n   الإجابة النموذجية: ‎2.0 μF‎.\n3) (مستوى الاستدلال) السؤال: لماذا يحمل اللوحان الأوسطان شحنتين متساويتين ومتعاكستين؟\n   الإجابة النموذجية: لأنهما متصلان معًا ومعزولان، فالإلكترونات التي تنتقل إلى أحدهما تأتي من الآخر وتبقى الشحنة الكلية لهما صفرًا.", "إرشاد للطالب: مراجعة الموضوع 4-4 وكتابة استنتاج معادلة التوالي\nإرشاد لولي الأمر: متابعة الابن في حساب مقلوب السعات بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=18"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎<\/li><li>يفسر أن المكثفات على التوالي تحمل الشحنة نفسها وأن فرق الجهد الكلي مجموع فروق جهودها<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا تحمل المكثفات على التوالي الشحنة نفسها (الشحن بالحث بين اللوحين الداخليين)<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستنتج معادلة السعة المكافئة للمكثفات الموصولة على التوالي ‎1/C = 1/C₁ + 1/C₂‎<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يفسر أن المكثفات على التوالي تحمل الشحنة نفسها وأن فرق الجهد الكلي مجموع فروق جهودها<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يفسر لماذا تحمل المكثفات على التوالي الشحنة نفسها (الشحن بالحث بين اللوحين الداخليين)<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><\/div>", "<p>التوصيل على التوالي، الشحنة المشتركة، ‎V = V₁ + V₂‎، ‎1/C = 1/C₁ + 1/C₂‎، السعة المكافئة أصغر من أصغر سعة.<\/p>", "<p>يسأل المعلم: «إذا وصلنا مكثفين على التوالي، فإن اللوحين الأوسطين غير متصلين بالمصدر؛ فمن أين تأتي شحنتهما؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون انتقال الإلكترونات بين اللوحين الأوسطين<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالنمذجة:<\/b> يشرح تساوي الشحنات ويشتق ‎1/C = 1/C₁ + 1/C₂‎<br><span style=\"opacity:.85\">• الطالب: يكتبون الاستنتاج خطوة بخطوة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل حساب السعة المكافئة لمكثفين وثلاثة<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الكمية المشتركة بين المكثفات على التوالي؟<\/td><td>الشحنة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>استنتج معادلة التوالي.<\/td><td>‎V = V₁ + V₂ ← Q/C = Q/C₁ + Q/C₂ ← 1/C = 1/C₁ + 1/C₂‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب السعة المكافئة لـ ‎2.0 μF‎ و‎3.0 μF‎ على التوالي.<\/td><td>‎1/C = 1/2 + 1/3 = 5/6 ← C = 1.2 μF‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>كيف تقارن السعة المكافئة للتوالي بأصغر مكثف؟<\/td><td>أصغر منها.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب السعة المكافئة لمكثفين ‎4.0 μF‎ متماثلين على التوالي.<\/td><td>‎2.0 μF‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا يحمل اللوحان الأوسطان شحنتين متساويتين ومتعاكستين؟<\/td><td>لأنهما متصلان معًا ومعزولان، فالإلكترونات التي تنتقل إلى أحدهما تأتي من الآخر وتبقى الشحنة الكلية لهما صفرًا.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-4 وكتابة استنتاج معادلة التوالي<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حساب مقلوب السعات بدقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=18<\/p>"]}, {"axis": "حسابات فرق الجهد والشحنة في المكثفات على التوالي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "توصيل المكثفات على التوالي"], ["الحصة", "2 من 2"], ["محور الحصة", "حسابات فرق الجهد والشحنة في المكثفات على التوالي"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوع 4-4 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحسب الشحنة المشتركة وفرق الجهد عبر كل مكثف في مجموعة على التوالي\n2. يفسر لماذا يكون فرق الجهد الأكبر عبر المكثف الأصغر سعة في التوالي\nمخرج تعليمي آخر: يحسب الطاقة المخزنة في كل مكثف على التوالي ويقارنها", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الشحنة المشتركة ‎Q = CV‎، ‎V₁ = Q/C₁‎، التوزيع العكسي للجهد، الطاقة في التوالي.", "يسأل المعلم: «مكثفان ‎2 μF‎ و‎3 μF‎ على التوالي مع ‎12 V‎؛ أيهما سيكون عليه فرق جهد أكبر؟ خمّن قبل الحساب.»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يدونون تخميناتهم\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يحل المثال: السعة المكافئة ثم ‎Q‎ ثم ‎V‎ لكل مكثف\n• الطالب: يتبعون الخطوات ويتحققون من التخمين\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل متدرجة لمجموعات على التوالي\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: احسب الشحنة المشتركة لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوالي مع ‎12 V‎.\n   الإجابة النموذجية: ‎C = 1.2 μF‎؛ ‎Q = 14.4 μC‎.\n2) (مستوى التطبيق) السؤال: احسب فرق الجهد عبر كل منهما.\n   الإجابة النموذجية: ‎V₁ = 14.4/2.0 = 7.2 V‎، ‎V₂ = 14.4/3.0 = 4.8 V‎.\n3) (مستوى الاستدلال) السؤال: لماذا يكون الجهد الأكبر عبر المكثف الأصغر سعة؟\n   الإجابة النموذجية: لأن الشحنة نفسها و‎V = Q/C‎، فكلما صغرت ‎C‎ كبر ‎V‎.", "1) (مستوى المعرفة) السؤال: ما مجموع فرقي الجهد في المثال؟\n   الإجابة النموذجية: ‎12 V (‎يساوي جهد المصدر).\n2) (مستوى التطبيق) السؤال: احسب الطاقة في المكثف ‎2.0 μF‎ من المثال.\n   الإجابة النموذجية: ‎W = ½ × 2.0 × 10⁻⁶ × 7.2² = 5.2 × 10⁻⁵ J‎.\n3) (مستوى الاستدلال) السؤال: أي المكثفين في المثال يخزن طاقة أكبر؟ ولماذا؟\n   الإجابة النموذجية: المكثف ‎2.0 μF‎، لأن ‎W = Q²/2C‎ والشحنة نفسها فالأصغر سعة يخزن طاقة أكبر.", "إرشاد للطالب: حل مسائل التوالي وكتابة خطوات الحل\nإرشاد لولي الأمر: سؤال الابن عن العلاقة بين السعة وفرق الجهد في التوالي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=18"], "h": ["<ol class=\"ol\"><li>يحسب الشحنة المشتركة وفرق الجهد عبر كل مكثف في مجموعة على التوالي<\/li><li>يفسر لماذا يكون فرق الجهد الأكبر عبر المكثف الأصغر سعة في التو لات البيانية لتغير فرق الجهد والشحنة وشدة التيار مع الزمن لمكثف يُفرَّغ عبر مقاومة\n2. يصف الاضمحلال الأسي ويميزه عن التناقص الخطي\nمخرج تعليمي آخر: يتنبأ بأثر زيادة المقاومة أو السعة على سرعة التفريغ", "المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء تفريغ مكثف", "- الكتاب\n- الأقلام\n- صورة توضيحية\n- أخرى: مكثف كبير السعة، مقاومة كبيرة، فولتميتر رقمي، ساعة إيقاف", "التفريغ، الاضمحلال الأسي، فرق الجهد مع الزمن، الشحنة مع الزمن، التيار مع الزمن، المقاومة، السعة.", "يسأل المعلم: «عند فصل الشاحن، لماذا يبقى ضوء صغير في بعض الأجهزة مضاءً لثوانٍ ثم يخفت تدريجيًا؟» ويذكّر بأن التفريغ يشبه الاضمحلال الإشعاعي.", "1. 5 دقائق — استقصاء تفريغ مكثف: يطرح السؤال\n• الطالب: يقترحون تفريغ مكثف ببطء\n\n2. 18 دقيقة — استقصاء تفريغ مكثف: ينفذ «استقصاء تفريغ مكثف» بقراءة ‎V‎ كل ‎10 s‎\n• الطالب: يسجلون القراءات ويرسمون ‎V‎ مقابل ‎t‎\n\n3. 10 دقائق — الاستراتيجيتان: التعلم بالاكتشاف، التعلم التعاوني: يشرح أشكال تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن ويناقش أثر ‎R‎ و‎C‎\n• الطالب: يكملون تمثيلات ‎Q‎ و‎I‎ ويتنبؤون بأثر تغيير ‎R‎\n\n4. 7 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: ما شكل تمثيل ‎V‎ مقابل ‎t‎ أثناء التفريغ؟\n   الإجابة النموذجية: منحنى اضمحلال أسي يتناقص بسرعة ثم ببطء.\n2) (مستوى التطبيق) السؤال: لماذا يكون التفريغ أبطأ عندما تكون المقاومة أكبر؟\n   الإجابة النموذجية: لأن التيار يكون أصغر فتتدفق الشحنة بمعدل أبطأ.\n3) (مستوى الاستدلال) السؤال: ما الذي يميز الاضمحلال الأسي؟\n   الإجابة النموذجية: أن الكمية تقل بالنسبة نفسها في فترات زمنية متساوية.", "1) (مستوى المعرفة) السؤال: هل يتشابه شكلا تمثيلي ‎Q‎ و‎I‎ مع الزمن أثناء التفريغ؟\n   الإجابة النموذجية: نعم، كلاهما اضمحلال أسي.\n2) (مستوى التطبيق) السؤال: كيف تتغير سرعة التفريغ بزيادة السعة؟\n   الإجابة النموذجية: يصبح التفريغ أبطأ.\n3) (مستوى الاستدلال) السؤال: لماذا لا يصل فرق الجهد إلى الصفر تمامًا نظريًا؟\n   الإجابة النموذجية: لأن الاضمحلال الأسي يقلل الكمية بنسبة ثابتة كل فترة فيقترب من الصفر دون أن يبلغه.", "إرشاد للطالب: مراجعة الموضوع 4-6 ورسم تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن\nإرشاد لولي الأمر: الحديث مع الابن عن أجهزة يبقى ضوؤها قليلًا بعد فصلها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20"], "h": ["<ol class=\"ol\"><li>يحلل التمثيلات البيانية لتغير فرق الجهد والشحنة وشدة التيار مع الزمن لمكثف يُفرَّغ عبر مقاومة<\/li><li>يصف الاضمحلال الأسي ويميزه عن التناقص الخطي<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر زيادة المقاومة أو السعة على سرعة التفريغ<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحلل التمثيلات البيانية لتغير فرق الجهد والشحنة وشدة التيار مع الزمن لمكثف يُفرَّغ عبر مقاومة<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يصف الاضمحلال الأسي ويميزه عن التناقص الخطي<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يتنبأ بأثر زيادة المقاومة أو السعة على سرعة التفريغ<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">استقصاء تفريغ مكثف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: مكثف كبير السعة، مقاومة كبيرة، فولتميتر رقمي، ساعة إيقاف<\/span><\/div>", "<p>التفريغ، الاضمحلال الأسي، فرق الجهد مع الزمن، الشحنة مع الزمن، التيار مع الزمن، المقاومة، السعة.<\/p>", "<p>يسأل المعلم: «عند فصل الشاحن، لماذا يبقى ضوء صغير في بعض الأجهزة مضاءً لثوانٍ ثم يخفت تدريجيًا؟» ويذكّر بأن التفريغ يشبه الاضمحلال الإشعاعي.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — استقصاء تفريغ مكثف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون تفريغ مكثف ببطء<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 18 دقيقة — استقصاء تفريغ مكثف:<\/b> ينفذ «استقصاء تفريغ مكثف» بقراءة ‎V‎ كل ‎10 s‎<br><span style=\"opacity:.85\">• الطالب: يسجلون القراءات ويرسمون ‎V‎ مقابل ‎t‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 10 دقائق — الاستراتيجيتان: التعلم بالاكتشاف، التعلم التعاوني:<\/b> يشرح أشكال تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن ويناقش أثر ‎R‎ و‎C‎<br><span style=\"opacity:.85\">• الطالب: يكملون تمثيلات ‎Q‎ و‎I‎ ويتنبؤون بأثر تغيير ‎R‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 7 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما شكل تمثيل ‎V‎ مقابل ‎t‎ أثناء التفريغ؟<\/td><td>منحنى اضمحلال أسي يتناقص بسرعة ثم ببطء.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا يكون التفريغ أبطأ عندما تكون المقاومة أكبر؟<\/td><td>لأن التيار يكون أصغر فتتدفق الشحنة بمعدل أبطأ.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما الذي يميز الاضمحلال الأسي؟<\/td><td>أن الكمية تقل بالنسبة نفسها في فترات زمنية متساوية.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>هل يتشابه شكلا تمثيلي ‎Q‎ و‎I‎ مع الزمن أثناء التفريغ؟<\/td><td>نعم، كلاهما اضمحلال أسي.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>كيف تتغير سرعة التفريغ بزيادة السعة؟<\/td><td>يصبح التفريغ أبطأ.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا لا يصل فرق الجهد إلى الصفر تمامًا نظريًا؟<\/td><td>لأن الاضمحلال الأسي يقلل الكمية بنسبة ثابتة كل فترة فيقترب من الصفر دون أن يبلغه.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-6 ورسم تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أجهزة يبقى ضوؤها قليلًا بعد فصلها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20<\/p>"]}, {"axis": "الثابت الزمني τ = ‎RC‎ والمعادلة ‎x = x₀e^(−t/RC)‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "2 من 3"], ["محور الحصة", "الثابت الزمني τ = ‎RC‎ والمعادلة ‎x = x₀e^(−t/RC)‎"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 4-6 (الأسئلة 21–24)"], ["دليل المعلم", "ص 124–130"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-4: تفريغ المكثفات ص 121؛ الاستقصاء العملي 4-1: تحديد سعة مكثف في دائرة تيار كهربائي مستمر ص 126"]], "t": ["1. يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎\n2. يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد\nمخرج تعليمي آخر: يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- تحديد طبيعة تفريغ المكثفات", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الثابت الزمني τ = ‎RC‎، ‎e^(−t/RC)‎، 37%، ‎ln V‎ مقابل ‎t‎، الميل = ‎−1/RC‎، نصف العمر.", "يسأل المعلم: «إذا انخفض جهد مكثف إلى 37% من قيمته بعد ‎47 s‎، فما علاقة هذا الرقم بقيمتي ‎R‎ و‎C‎؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يتوقعون أن الزمن يعتمد على ‎R‎ و‎C‎\n\n2. 13 دقيقة — تحديد طبيعة تفريغ المكثفات: ينفذ «تحديد طبيعة تفريغ المكثفات»: τ = ‎RC‎ و‎x = x₀e^(−t/RC)‎ وتمثيل ‎ln V‎ مقابل ‎t‎\n• الطالب: يشتقون أن ‎V = 0.37V₀‎ عند ‎t = RC‎ ويرسمون ‎ln V‎ مقابل ‎t‎\n\n3. 14 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم مسائل حساب τ وقيم ‎V‎ و‎Q‎ و‎I‎ بعد زمن معين\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: احسب τ لمكثف ‎470 μF‎ يُفرَّغ عبر ‎100 kΩ‎.\n   الإجابة النموذجية: τ = ‎100 × 10³ × 470 × 10⁻⁶ = 47 s‎.\n2) (مستوى التطبيق) السؤال: احسب ‎V‎ بعد ‎47 s‎ إذا كان ‎V₀ = 12 V‎.\n   الإجابة النموذجية: ‎V = 12e⁻¹ = 4.4 V‎.\n3) (مستوى الاستدلال) السؤال: ما ميل تمثيل ‎ln V‎ مقابل ‎t‎؟\n   الإجابة النموذجية: ‎−1/RC‎.", "1) (مستوى المعرفة) السؤال: كم تصبح الشحنة بعد زمن يساوي τ؟\n   الإجابة النموذجية: نحو 37% من الشحنة الابتدائية.\n2) (مستوى التطبيق) السؤال: احسب ‎V‎ بعد 2τ إذا كان ‎V₀ = 10 V‎.\n   الإجابة النموذجية: ‎V = 10e⁻² = 1.4 V‎.\n3) (مستوى الاستدلال) السؤال: احسب الزمن اللازم لانخفاض ‎V‎ إلى النصف لمكثف τ له ‎47 s‎.\n   الإجابة النموذجية: ‎t = τ ln 2 = 0.693 × 47 = 33 s‎.", "إرشاد للطالب: حل مسائل τ = ‎RC‎ والمعادلة الأسية\nإرشاد لولي الأمر: متابعة الابن في استخدام زري ‎e^x‎ و‎ln‎ في الآلة الحاسبة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎<\/li><li>يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">تحديد طبيعة تفريغ المكثفات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الثابت الزمني τ = ‎RC‎، ‎e^(−t/RC)‎، 37%، ‎ln V‎ مقابل ‎t‎، الميل = ‎−1/RC‎، نصف العمر.<\/p>", "<p>يسأل المعلم: «إذا انخفض جهد مكثف إلى 37% من قيمته بعد ‎47 s‎، فما علاقة هذا الرقم بقيمتي ‎R‎ و‎C‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون أن الزمن يعتمد على ‎R‎ و‎C‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — تحديد طبيعة تفريغ المكثفات:<\/b> ينفذ «تحديد طبيعة تفريغ المكثفات»: τ = ‎RC‎ و‎x = x₀e^(−t/RC)‎ وتمثيل ‎ln V‎ مقابل ‎t‎<br><span style=\"opacity:.85\">• الطالب: يشتقون أن ‎V = 0.37V₀‎ عند ‎t = RC‎ ويرسمون ‎ln V‎ مقابل ‎t‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني:<\/b> يقدم مسائل حساب τ وقيم ‎V‎ و‎Q‎ و‎I‎ بعد زمن معين<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>احسب τ لمكثف ‎470 μF‎ يُفرَّغ عبر ‎100 kΩ‎.<\/td><td>τ = ‎100 × 10³ × 470 × 10⁻⁶ = 47 s‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب ‎V‎ بعد ‎47 s‎ إذا كان ‎V₀ = 12 V‎.<\/td><td>‎V = 12e⁻¹ = 4.4 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما ميل تمثيل ‎ln V‎ مقابل ‎t‎؟<\/td><td>‎−1/RC‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>كم تصبح الشحنة بعد زمن يساوي τ؟<\/td><td>نحو 37% من الشحنة الابتدائية.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب ‎V‎ بعد 2τ إذا كان ‎V₀ = 10 V‎.<\/td><td>‎V = 10e⁻² = 1.4 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب الزمن اللازم لانخفاض ‎V‎ إلى النصف لمكثف τ له ‎47 s‎.<\/td><td>‎t = τ ln 2 = 0.693 × 47 = 33 s‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل مسائل τ = ‎RC‎ والمعادلة الأسية<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في استخدام زري ‎e^x‎ و‎ln‎ في الآلة الحاسبة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20<\/p>"]}, {"axis": "الاستقصاء العملي 4-1: تحديد سعة مكثف ونشاط 4-4 ومراجعة الوحدة الرابعة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 4-1: تحديد سعة مكثف ونشاط 4-4 ومراجعة الوحدة الرابعة"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 4-6 + كتاب التجارب ص 121 و126"], ["دليل المعلم", "ص 124–130"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-4: تفريغ المكثفات ص 121؛ الاستقصاء العملي 4-1: تحديد سعة مكثف في دائرة تيار كهربائي مستمر ص 126"]], "t": ["1. ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ\n2. يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24\nمخرج تعليمي آخر: يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم الذاتي\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: مكثف، مقاومة معلومة، فولتميتر رقمي، ساعة إيقاف، ورق رسم، كتاب التجارب العملية والأنشطة", "‎ln V‎ مقابل ‎t‎، خط أفضل مطابقة، خط أسوأ مطابقة، عدم اليقين في الميل، ‎C = −1/(R ×‎ الميل).", "يعرض المعلم جدول بيانات تفريغ نموذجي (‎V‎ مقابل ‎t‎) ويسأل: «كيف نحول هذه البيانات إلى قيمة للسعة باستخدام خط مستقيم؟»", "1. 4 دقائق — التعلم بالاكتشاف: يعرض البيانات ويطرح السؤال\n• الطالب: يقترحون رسم ‎ln V‎ مقابل ‎t‎\n\n2. 18 دقيقة — الاستراتيجيتان: الاستقصاء العملي، التعلم الذاتي: يوجه تنفيذ الاستقصاء العملي 4-1 (ص 126) أو تحليل بياناته النموذجية مع خطي أفضل وأسوأ مطابقة\n• الطالب: يرسمون ويحسبون الميل و‎C‎ وعدم اليقين\n\n3. 10 دقائق — التعلم بالاكتشاف: يوجه حل نشاط 4-4 (ص 121) والأسئلة 21–24\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يختم بمسابقة المجموعات لمراجعة الوحدة الرابعة وقائمة التقويم الذاتي\n• الطالب: يتنافسون ثم يقيّمون أنفسهم", "1) (مستوى المعرفة) السؤال: كيف تُحسب ‎C‎ من ميل ‎ln V‎ مقابل ‎t‎؟\n   الإجابة النموذجية: ‎C = −1/(R ×‎ الميل).\n2) (مستوى التطبيق) السؤال: إذا كان الميل ‎−0.020 s⁻¹‎ و‎R = 100 kΩ‎، فما ‎C‎؟\n   الإجابة النموذجية: ‎C = 1/(100 × 10³ × 0.020) = 5.0 × 10⁻⁴ F = 500 μF‎.\n3) (مستوى الاستدلال) السؤال: لماذا نرسم خط أسوأ مطابقة؟\n   الإجابة النموذجية: لتقدير عدم اليقين في الميل ومن ثم في قيمة ‎C‎.", "1) (مستوى المعرفة) السؤال: لماذا نستخدم ‎ln V‎ بدل ‎V‎؟\n   الإجابة النموذجية: لتحويل المنحنى الأسي إلى خط مستقيم يسهل حساب ميله.\n2) (مستوى التطبيق) السؤال: اذكر مصدرًا للخطأ في استقصاء تفريغ المكثف.\n   الإجابة النموذجية: زمن رد فعل القارئ عند تسجيل القراءات، أو تسرب الشحنة، أو عدم دقة قيمة ‎R‎.\n3) (مستوى الاستدلال) السؤال: قيّم تعلمك في الوحدة الرابعة: موضوع أتقنته وآخر يحتاج إلى مراجعة وخطة لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية.", "إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 وإكمال نشاط 4-4 والأسئلة 21–24 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الرابعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20"], "h": ["<ol class=\"ol\"><li>ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ<\/li><li>يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة<\/div>", "<table class=\"tb lvl\"><tr><t ي المجالات المغناطيسية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "توليد المجالات المغناطيسية وتمثيلها"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 5-1 والأسئلة 1–3 في المجالات المغناطيسية"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "الموضوع 5-1 + كتاب التجارب ص 134"], ["دليل المعلم", "ص 142–146"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-1: خطوط المجال المغناطيسي ص 134"]], "t": ["1. يحل نشاط 5-1 «خطوط المجال المغناطيسي» والأسئلة 1–3\n2. يرسم المجال المحصل لسلك يحمل تيارًا موضوعًا في مجال منتظم\nمخرج تعليمي آخر: يتنبأ باتجاه القوة على السلك من شكل المجال المحصل (تمهيدًا للدرس التالي)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "المجال المحصل، تقوية المجال وإضعافه، نموذج الخطوط المشدودة، القوة على السلك.", "يرسم المعلم مجالًا منتظمًا بين قطبين وسلكًا عموديًا يحمل تيارًا، ويسأل: «في أي جانب من السلك يقوى المجال؟ وفي أيهما يضعف؟»", "1. 5 دقائق — التعلم التعاوني: يعرض الرسم ويطرح السؤال\n• الطالب: يحددون جانبي التقوية والإضعاف\n\n2. 15 دقيقة — التعلم الذاتي: يوجه حل نشاط 5-1 (ص 134) والأسئلة 1–3\n• الطالب: يحلون فرديًا ثم يقارنون\n\n3. 12 دقيقة — التعلم التعاوني: يوجه رسم المجال المحصل والتنبؤ باتجاه القوة\n• الطالب: يرسمون ويتنبؤون في أزواج\n\n4. 8 دقائق: يختم بمسابقة المجموعات على المجالات المغناطيسية\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: في أي جانب من السلك يقوى المجال المحصل؟\n   الإجابة النموذجية: في الجانب الذي يكون فيه مجال السلك في اتجاه المجال المنتظم نفسه.\n2) (مستوى التطبيق) السؤال: إلى أي جانب يتحرك السلك؟\n   الإجابة النموذجية: من منطقة المجال الأقوى إلى منطقة المجال الأضعف.\n3) (مستوى الاستدلال) السؤال: ماذا يحدث للقوة إذا كان السلك موازيًا للمجال المنتظم؟\n   الإجابة النموذجية: تنعدم القوة.", "1) (مستوى المعرفة) السؤال: ما المجال المحصل؟\n   الإجابة النموذجية: المجموع المتجهي للمجال المنتظم ومجال السلك عند كل نقطة.\n2) (مستوى التطبيق) السؤال: هل يتأثر سلك يحمل تيارًا بقوة إذا وُضع في مجال مغناطيسي؟\n   الإجابة النموذجية: نعم، إذا لم يكن موازيًا للمجال.\n3) (مستوى الاستدلال) السؤال: فسّر حركة السلك باستخدام نموذج الخطوط المشدودة.\n   الإجابة النموذجية: الخطوط المتكدسة في جانب المجال الأقوى تعمل كأوتار مشدودة تدفع السلك نحو الجانب الأضعف.", "إرشاد للطالب: إكمال نشاط 5-1 ص 134 والأسئلة 1–3\nإرشاد لولي الأمر: الحديث مع الابن عن مبدأ عمل المحرك الكهربائي في الأجهزة المنزلية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=21"], "h": ["<ol class=\"ol\"><li>يحل نشاط 5-1 «خطوط المجال المغناطيسي» والأسئلة 1–3<\/li><li>يرسم المجال المحصل لسلك يحمل تيارًا موضوعًا في مجال منتظم<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ باتجاه القوة على السلك من شكل المجال المحصل (تمهيدًا للدرس التالي)<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 5-1 «خطوط المجال المغناطيسي» والأسئلة 1–3<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يرسم المجال المحصل لسلك يحمل تيارًا موضوعًا في مجال منتظم<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يتنبأ باتجاه القوة على السلك من شكل المجال المحصل (تمهيدًا للدرس التالي)<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>المجال المحصل، تقوية المجال وإضعافه، نموذج الخطوط المشدودة، القوة على السلك.<\/p>", "<p>يرسم المعلم مجالًا منتظمًا بين قطبين وسلكًا عموديًا يحمل تيارًا، ويسأل: «في أي جانب من السلك يقوى المجال؟ وفي أي لعوامل المؤثرة نوعيًا\n• الطالب: يطبقون القاعدة على العرض ويتحققون من الاتجاه\n\n3. 14 دقيقة — التعلم بالاكتشاف: يقدم رسومًا لتحديد اتجاه القوة أو التيار أو المجال المجهول\n• الطالب: يطبقون القاعدة في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: ماذا يمثل كل إصبع في قاعدة فليمنج لليد اليسرى؟\n   الإجابة النموذجية: الإبهام: القوة (الحركة)، السبابة: المجال، الوسطى: التيار.\n2) (مستوى التطبيق) السؤال: ماذا يحدث للقوة إذا عُكس اتجاه التيار؟\n   الإجابة النموذجية: ينعكس اتجاهها.\n3) (مستوى الاستدلال) السؤال: ماذا يحدث للقوة إذا عُكس التيار والمجال معًا؟\n   الإجابة النموذجية: يبقى اتجاهها كما هو.", "1) (مستوى المعرفة) السؤال: اذكر عاملين يزيدان مقدار القوة على السلك.\n   الإجابة النموذجية: زيادة التيار، وزيادة شدة المجال (أو طول السلك داخل المجال).\n2) (مستوى التطبيق) السؤال: متى تكون القوة على السلك أكبر ما يمكن؟\n   الإجابة النموذجية: عندما يكون السلك عموديًا على المجال.\n3) (مستوى الاستدلال) السؤال: كيف تجعل الملف في المحرك يدور باستمرار في الاتجاه نفسه؟\n   الإجابة النموذجية: بعكس اتجاه التيار في الملف كل نصف دورة باستخدام المبدل (الحلقتين المشقوقتين).", "إرشاد للطالب: مراجعة الموضوع 5-2 والتدرب على قاعدة فليمنج لليد اليسرى\nإرشاد لولي الأمر: سؤال الابن عن تطبيق قاعدة اليد اليسرى في المحرك الكهربائي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=22"], "h": ["<ol class=\"ol\"><li>يحدد اتجاه القوة على سلك يحمل تيارًا في مجال مغناطيسي باستخدام قاعدة فليمنج لليد اليسرى<\/li><li>يصف العوامل المؤثرة في مقدار القوة (التيار، الطول، شدة المجال، الزاوية) نوعيًا<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر مبدأ عمل محرك كهربائي بسيط في ضوء القوة على السلك<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحدد اتجاه القوة على سلك يحمل تيارًا في مجال مغناطيسي باستخدام قاعدة فليمنج لليد اليسرى<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يصف العوامل المؤثرة في م فصلي (سلك كتلته لكل وحدة طول ‎10 g/m‎ بزاوية ‎45°‎) ثم التقويم الختامي\n• الطالب: يجيبون ويناقشون الخيارات الخاطئة", "1) (مستوى المعرفة) السؤال: عرّف التسلا.\n   الإجابة النموذجية: كثافة الفيض التي تؤثر بقوة ‎1 N‎ على سلك طوله ‎1 m‎ يحمل تيارًا ‎1 A‎ موضوع عموديًا على المجال.\n2) (مستوى التطبيق) السؤال: احسب القوة على سلك طوله ‎0.050 m‎ يحمل ‎3.0 A‎ عموديًا على مجال ‎0.20 T‎.\n   الإجابة النموذجية: ‎F = 0.20 × 3.0 × 0.050 = 0.030 N‎.\n3) (مستوى الاستدلال) السؤال: احسب القوة إذا كانت الزاوية بين السلك والمجال ‎30°‎.\n   الإجابة النموذجية: ‎F = 0.030 × sin 30° = 0.015 N‎.", "1) (مستوى المعرفة) السؤال: ما وحدة كثافة الفيض المغناطيسي؟\n   الإجابة النموذجية: التسلا ‎(T)‎.\n2) (مستوى التطبيق) السؤال: ما الزاوية θ في المعادلة ‎F = BIL sinθ‎؟\n   الإجابة النموذجية: الزاوية بين السلك (اتجاه التيار) واتجاه المجال.\n3) (مستوى الاستدلال) السؤال: احسب ‎B‎ إذا أثرت قوة ‎0.020 N‎ على سلك طوله ‎0.10 m‎ يحمل ‎2.0 A‎ عموديًا على المجال.\n   الإجابة النموذجية: ‎B = 0.10 T‎.", "إرشاد للطالب: مراجعة الموضوع 5-3 وحل مسائل ‎F = BIL sinθ‎\nإرشاد لولي الأمر: متابعة الابن في تحديد الزاوية بين السلك والمجال\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=23"], "h": ["<ol class=\"ol\"><li>يعرّف كثافة الفيض المغناطيسي بأنها القوة المؤثرة لكل وحدة تيار لكل وحدة طول من سلك موضوع عموديًا على المجال<\/li><li>يستخدم المعادلة ‎F = BIL sinθ‎ ويحدد الاتجاهات باستخدام قاعدة فليمنج لليد اليسرى<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الزاوية θ بصورة صحيحة بين السلك والمجال<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يعرّف كثافة الفيض المغناطيسي بأنها القوة المؤثرة لكل وحدة تيار لكل وحدة طول من سلك موضوع عموديًا على المجال<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم المعادلة ‎F = BIL sinθ‎ ويحدد الاتجاهات باستخدام قاعدة فليمنج لليد اليسرى<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحد تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: تسلاميتر أو تطبيق مستشعر مغناطيسي في الهاتف، مغناطيسات، ملف لولبي، كتاب التجارب العملية والأنشطة", "التسلاميتر، مسبار هول، توجيه المسبار عموديًا على المجال، معايرة الصفر، قياس ‎B‎.", "يعرض المعلم تطبيق مستشعر المجال المغناطيسي على الهاتف ويقرّب منه مغناطيسًا، ويسأل: «كيف يقيس الهاتف المجال المغناطيسي؟ ولماذا تتغير القراءة بتدوير الهاتف؟»", "1. 5 دقائق — التعلم بالاكتشاف: يعرض التطبيق ويطرح السؤال\n• الطالب: يلاحظون اعتماد القراءة على الاتجاه\n\n2. 12 دقيقة — التعلم بالاكتشاف: ينفذ «التسلاميتر (مسبار هول) واستخدامه»: التوجيه ومعايرة الصفر وأخذ القراءات\n• الطالب: يقيسون ‎B‎ عند أبعاد مختلفة من مغناطيس أو داخل ملف\n\n3. 15 دقيقة — التعلم التعاوني: يوجه حل نشاط 5-2 (ص 137) والأسئلة 4–12 المختارة\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: كيف يُوجَّه مسبار هول للحصول على أكبر قراءة؟\n   الإجابة النموذجية: بحيث يكون سطح المسبار عموديًا على خطوط المجال.\n2) (مستوى التطبيق) السؤال: لماذا يُضبط التسلاميتر على الصفر بعيدًا عن المغناطيسات؟\n   الإجابة النموذجية: لإلغاء أثر المجال المغناطيسي الأرضي والمجالات المحيطة.\n3) (مستوى الاستدلال) السؤال: كيف تتغير قراءة ‎B‎ بالابتعاد عن المغناطيس؟\n   الإجابة النموذجية: تتناقص.", "1) (مستوى المعرفة) السؤال: ما الجهاز المستخدم لقياس كثافة الفيض المغناطيسي؟\n   الإجابة النموذجية: التسلاميتر (مسبار هول).\n2) (مستوى التطبيق) السؤال: ماذا يحدث للقراءة إذا دُوّر المسبار ليصبح موازيًا للمجال؟\n   الإجابة النموذجية: تقترب من الصفر.\n3) (مستوى الاستدلال) السؤال: لماذا تختلف القراءات أحيانًا عند تكرار القياس في الموضع نفسه؟\n   الإجابة النموذجية: لعدم ثبات توجيه المسبار تمامًا أو تغير موضعه قليلًا أو وجود مصادر مغناطيسية قريبة.", "إرشاد للطالب: إكمال نشاط 5-2 ص 137 والأسئلة 4–12\nإرشاد لولي الأمر: يمكن للابن استكشاف مستشعر المجال المغناطيسي في الهاتف بإشراف ولي الأمر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github. ر قراءة الميزان؟\n   الإجابة النموذجية: لأن السلك يؤثر على المغناطيس بقوة مساوية ومعاكسة للقوة التي يؤثر بها المجال على السلك.\n2) (مستوى التطبيق) السؤال: تغيرت القراءة بـ ‎2.04 g‎ عند ‎4.0 A‎ وطول السلك في المجال ‎0.050 m‎. احسب ‎B‎.\n   الإجابة النموذجية: ‎F = 0.00204 × 9.81 = 0.020 N‎؛ ‎B = 0.020 ÷ (4.0 × 0.050) = 0.10 T‎.\n3) (مستوى الاستدلال) السؤال: ماذا يمثل ميل خط ‎F‎ مقابل ‎I‎؟\n   الإجابة النموذجية: ‎BL‎.", "1) (مستوى المعرفة) السؤال: ما الكمية التي نحسبها من تغير قراءة الميزان؟\n   الإجابة النموذجية: القوة ‎F = Δm × g‎.\n2) (مستوى التطبيق) السؤال: لماذا يجب أن يكون السلك عموديًا على المجال؟\n   الإجابة النموذجية: لتكون القوة أكبر ما يمكن ويُطبق ‎F = BIL‎ مباشرة.\n3) (مستوى الاستدلال) السؤال: اقترح تحسينين لدقة قياس ‎B‎.\n   الإجابة النموذجية: استخدام مدى تيارات أكبر وتكرار القراءات وقياس طول السلك داخل المجال بدقة (عرض قطبي المغناطيس).", "إرشاد للطالب: كتابة تقرير الاستقصاء 5-1 مع الرسم البياني\nإرشاد لولي الأمر: التأكد من إكمال الابن حساب ‎B‎ وعدم اليقين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24"], "h": ["<ol class=\"ol\"><li>يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا<\/li><li>يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", حسب ‎B‎.<\/td><td>‎F = 0.00204 × 9.81 = 0.020 N‎؛ ‎B = 0.020 ÷ (4.0 × 0.050) = 0.10 T‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ماذا يمثل ميل خط ‎F‎ مقابل ‎I‎؟<\/td><td>‎BL‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الكمية التي نحسبها من تغير قراءة الميزان؟<\/td><td>القوة ‎F = Δm × g‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا يجب أن يكون السلك عموديًا على المجال؟<\/td><td>لتكون القوة أكبر ما يمكن ويُطبق ‎F = BIL‎ مباشرة.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>اقترح تحسينين لدقة قياس ‎B‎.<\/td><td>استخدام مدى تيارات أكبر وتكرار القراءات وقياس طول السلك داخل المجال بدقة (عرض قطبي المغناطيس).<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 5-1 مع الرسم البياني<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من إكمال الابن حساب ‎B‎ وعدم اليقين<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24<\/p>"]}, {"axis": "مسائل متقدمة في القوى على الموصلات ومراجعة الأسئلة 4–12", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "المزيد عن القوى على الموصلات الحاملة لتيار كهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "مسائل متقدمة في القوى على الموصلات ومراجعة الأسئلة 4–12"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوعان 5-3 و5-4"], ["دليل المعلم", "ص 146–151"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي ص 152"]], "t": ["1. يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)\n2. يحل أسئلة مختارة من 4–12 في كتاب الطالب\nمخرج تعليمي آخر: يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: آلة حاسبة علمية", "اتزان القوى، سلك معلق في مجال، الكتلة لكل وحدة طول، الميزان التياري، الأخطاء الشائعة (‎cosθ‎، الوحدات).", "يعرض المعلم سلكًا أفقيًا معلقًا يرتفع عند تمرير تيار معين، ويسأل: «ما التيار اللازم لجعل السلك «يطفو» في المجال دون أن يسقط؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يقترحون مساواة القوة المغناطيسية بالوزن\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يحل مسألة السلك الطافي ‎(BIL = mg)‎ ويعالج أخطاء الوحدات و‎sin/cos‎\n• الطالب: يتبعون الحل ويحسبون التيار\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل أسئلة مختارة من 4–12 وتحدي تصميم ميزان تياري\n• الطالب: يحلون ويصممون في مجموعات\n\n4. 8 دقائق: يختم بمسابقة المجموعات على القوى المغناطيسية\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: سلك أفقي كتلته لكل وحدة طول ‎0.010 kg/m‎ في مجال أفقي ‎0.25 T‎ عمودي عليه. ما التيار الذي يجعله معلقًا؟\n   الإجابة النموذجية: ‎BIL = mg ← I = (0.010 × 9.81) ÷ 0.25 = 0.39 A‎.\n2) (مستوى التطبيق) السؤال: ما اتجاه القوة المغناطيسية اللازمة؟\n   الإجابة النموذجية: إلى أعلى، معاكسة للوزن.\n3) (مستوى الاستدلال) السؤال: لماذا لا تعتمد الإجابة السابقة على طول السلك؟\n   الإجابة النموذجية: لأن الوزن والقوة المغناطيسية يتناسبان كلاهما مع الطول فيُختصر.", "1) (مستوى المعرفة) السؤال: ما شرط اتزان السلك المعلق في المجال؟\n   الإجابة النموذجية: أن تساوي القوة المغناطيسية وزنه وتعاكسه في الاتجاه.\n2) (مستوى التطبيق) السؤال: لماذا يُعد استخدام ‎cosθ‎ في ‎F = BIL sinθ‎ خطأً شائعًا؟\n   الإجابة النموذجية: لأن θ هي الزاوية بين السلك والمجال، والقوة تتناسب مع ‎sinθ‎ لا ‎cosθ‎.\n3) (مستوى الاستدلال) السؤال: صف مبدأ ميزان تياري لقياس ‎B‎.\n   الإجابة النموذجية: سلك على ذراع ميزان داخل المجال، تُوازن القوة المغناطيسية ‎BIL‎ بوزن معلوم، فنحسب ‎B = mg/(IL)‎.", "إرشاد للطالب: حل أسئلة مختارة من 4–12 ومسألة السلك المعلق\nإرشاد لولي الأمر: متابعة الابن في رسم مخطط القوى قبل الحل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24"], "h": ["<ol class=\"ol\"><li>يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)<\/li><li>يحل أسئلة مختارة من 4–12 في كتاب الطالب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل أسئلة مختارة من 4–12 في كتاب الطالب<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>اتزان القوى، سلك معلق في مجال، الكتلة لكل وحدة طول، الميزان التياري، الأخطاء الشائعة (‎cosθ‎، الوحدات).<\/p>", "<p>يعرض المعلم سلكًا أفقيًا معلقًا يرتفع عند تمرير تيار معين، ويسأل: «ما التيار اللازم لجعل السلك «يطفو» في المجال دون أن يسقط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون مساواة القوة المغناطيسية بالوزن<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم المبني على حل المشكلات:<\/b> يحل مسألة السلك الطافي ‎(BIL = mg)‎ ويعالج أخطاء الوحدات و‎sin/cos‎<br><span style=\"opacity:.85\">• الطالب: يتبعون الحل ويحسبون التيار<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — ال 3–21)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "مشاهدات تجارب الحث والعوامل المؤثرة في القوة الدافعة المستحثة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "الحث الكهرومغناطيسي"], ["الحصة", "1 من 3"], ["محور الحصة", "مشاهدات تجارب الحث والعوامل المؤثرة في القوة الدافعة المستحثة"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-5 (الأسئلة 13–21)"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي ص 141"]], "t": ["1. يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)\n2. يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)\nمخرج تعليمي آخر: يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: ملف، مغناطيس قوي، جلفانوميتر حساس، أسلاك", "الحث الكهرومغناطيسي، القوة الدافعة الكهربائية المستحثة، التيار المستحث، الحركة النسبية، عدد اللفات، سرعة التغير.", "يحرك المعلم مغناطيسًا داخل ملف موصول بجلفانوميتر فيتحرك المؤشر، ثم يثبته فيعود المؤشر للصفر، ويسأل: «لماذا ظهر تيار أثناء الحركة فقط؟»", "1. 5 دقائق — التعلم بالاكتشاف: ينفذ العرض ويطرح السؤال\n• الطالب: يستنتجون أن التغير هو السبب\n\n2. 18 دقيقة — الاستقصاء العملي: ينفذ «العوامل التي تؤثر على مقدار شدة التيار الكهربائي الناتج عن قوة دافعة كهربائية مستحثة» بتغيير السرعة وعدد اللفات وقوة المغناطيس\n• الطالب: يسجلون انحراف الجلفانوميتر في كل حالة\n\n3. 10 دقائق — التعلم التعاوني: يناقش النتائج ويصحح استخدام «فرق الجهد المستحث» إلى «القوة الدافعة المستحثة»\n• الطالب: يلخصون العوامل في جدول\n\n4. 7 دقائق: يدير السؤال المفصلي ثم التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: متى تتولد قوة دافعة كهربائية مستحثة في الملف؟\n   الإجابة النموذجية: عند وجود حركة نسبية بين المغناطيس والملف (تغير في الفيض المغناطيسي).\n2) (مستوى التطبيق) السؤال: اذكر ثلاثة عوامل تزيد القوة الدافعة المستحثة.\n   الإجابة النموذجية: زيادة سرعة الحركة، وزيادة عدد لفات الملف، واستخدام مغناطيس أقوى.\n3) (مستوى الاستدلال) السؤال: لماذا ينعدم التيار عند تثبيت المغناطيس داخل الملف؟\n   الإجابة النموذجية: لأن الفيض المغناطيسي عبر الملف لا يتغير.", "1) (مستوى المعرفة) السؤال: ما الفرق بين القوة الدافعة المستحثة والتيار المستحث؟\n   الإجابة النموذجية: القوة الدافعة تتولد دائمًا عند تغير الفيض، والتيار يتولد فقط إذا كانت الدائرة مغلقة.\n2) (مستوى التطبيق) السؤال: ماذا يحدث لاتجاه انحراف الجلفانوميتر عند إخراج المغناطيس بدل إدخاله؟\n   الإجابة النموذجية: ينعكس.\n3) (مستوى الاستدلال) السؤال: لماذا نستخدم مصطلح «القوة الدافعة الكهربائية المستحثة» لا «فرق الجهد المستحث»؟\n   الإجابة النموذجية: لأن الطاقة تتحول من حركية إلى كهربائية في الملف، وهذا يصف قوة دافعة لا فرق جهد عبر مكون مستهلك.", "إرشاد للطالب: مراجعة الموضوع 5-5 وتلخيص نتائج الاستقصاء\nإرشاد لولي الأمر: الحديث مع الابن عن الدراجة ذات المولد الصغير لإضاءة المصباح\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25"], "h": ["<ol class=\"ol\"><li>يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)<\/li><li>يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يصف مشاهدات تجارب الحث الكهرومغناطيسي ويشرحها (تحريك مغناطيس داخل ملف، تحريك سلك في مجال)<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحدد العوامل التي تؤثر في مقدار القوة الدافعة الكهربائية المستحثة (سرعة الحركة، عدد اللفات، شدة المجال)<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يميز بين القوة الدافعة الكهربائية المستحثة والتيار المستحث<\/td><td class=\"lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: ملف، مغناطيس قوي، جلفانوميتر حساس، أسلاك<\/span><\/div>", "<p>الحث الكهرومغناطيسي، القوة الدافعة الكهربائية المستحثة، التيار المستحث، الحركة النسبية، عدد اللفات، سرعة التغير.<\/p>", "<p>يحرك المعلم مغناطيسًا داخل ملف موصول بجلفانوميتر فيتحرك المؤشر، ثم يثبته فيعود المؤشر للصفر، ويسأل: «لماذا ظهر تيار أثناء الحركة فقط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> ينفذ العرض ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يستنتجون أن التغير هو السبب<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 18 دقيقة — الاستقصاء العملي:<\/b> ينفذ «العوامل التي تؤثر على مقدار شدة التيار الكهربائي الناتج عن قوة دافعة كهربائية مستحثة» بتغيير السرعة وعدد اللفات وقوة المغناطيس<br><span style=\"opacity:.85\">• الطالب: يسجلون انحراف الجلفانوميتر في كل حالة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 10 دقائق — التعلم التعاوني:<\/b> يناقش النتائج ويصحح استخدام «فرق الجهد المستحث» إلى «القوة الدافعة المستحثة»<br><span style=\"opacity:.85\">• الطالب: يلخصون العوامل في جدول<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 7 دقائق:<\/b> يدير السؤال المفصلي ثم التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><t  ‎NΦ = 100 × 0.30 × 0.020 × cos 60° = 0.30 Wb‎.", "إرشاد للطالب: مراجعة تعريفات الفيض وحل مسائل Φ و‎NΦ‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين كثافة الفيض والفيض\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25"], "h": ["<ol class=\"ol\"><li>يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎<\/li><li>يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين كثافة الفيض ‎B‎ والفيض Φ<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يعرّف الفيض المغناطيسي بأنه حاصل ضرب كثافة الفيض المغناطيسي في مساحة المقطع العرضي العمودية على المجال ويستخدم Φ = ‎BA‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يصف مفهوم الفيض المغناطيسي الكلي ‎NΦ‎ ويستخدمه، بما في ذلك الفيض عند ميل الملف بزاوية ‎(BAN cos θ)‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يميز بين كثافة الفيض ‎B‎ والفيض Φ<\/td><td class=\"lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: ملف مسطح وإطار مساحته معلومة<\/span><\/div>", "<p>الفيض المغناطيسي Φ، الويبر ‎Wb‎، Φ = ‎BA‎، الفيض الكلي ‎NΦ‎، الزاوية مع العمودي على المستوى، ‎Wb = T m²‎.<\/p>", "<p>يمسك المعلم إطارًا مربعًا ويديره في مجال مرسوم بخطوط متوازية على السبورة ويسأل: «متى يخترق الإطار أكبر عدد من الخطوط؟ ومتى لا يخترقه شيء؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> ينفذ العرض
