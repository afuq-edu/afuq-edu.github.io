الخمسة على التوازي = 0.40 Ω.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 3-4 و3-5 والأسئلة 12–15<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حل المسائل متعددة الخطوات بترتيب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12<\/p>"]}]}, {"title": "قانونا كيرشوف", "sb": "الموضوع 3-4 (الأسئلة 16–23)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "القانون الأول لكيرشوف وحفظ الشحنة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "1 من 5"], ["محور الحصة", "القانون الأول لكيرشوف وحفظ الشحنة"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية\n2. يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع\nمخرج تعليمي آخر: يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: دائرة بأميترات عند نقطة تفرع", "القانون الأول لكيرشوف، نقطة التفرع، حفظ الشحنة، مجموع التيارات الداخلة = مجموع الخارجة.", "يعرض المعلم دائرة فيها ثلاثة أميترات عند نقطة تفرع (قراءتان معلومتان) ويسأل: «كم تتوقع قراءة الأميتر الثالث؟ ولماذا؟» (فكرة التمهيد أ).", "1. 5 دقائق — التعلم بالاكتشاف: يعرض الدائرة ويطرح السؤال\n• الطالب: يتوقعون ويبررون\n\n2. 12 دقيقة — التعلم بالاكتشاف: يشرح نص القانون الأول وارتباطه بحفظ الشحنة ويتحقق عمليًا بالأميترات\n• الطالب: يسجلون القراءات ويتحققون من القانون\n\n3. 15 دقيقة — التعلم التعاوني: يقدم شبكات تفرع لحساب التيارات المجهولة\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اذكر نص القانون الأول لكيرشوف.\n   الإجابة النموذجية: مجموع التيارات الداخلة إلى نقطة تفرع يساوي مجموع التيارات الخارجة منها.\n2) (مستوى التطبيق) السؤال: على أي قانون حفظ يعتمد القانون الأول؟\n   الإجابة النموذجية: حفظ الشحنة الكهربائية.\n3) (مستوى الاستدلال) السؤال: يدخل نقطة تفرع ‎3.0 A‎ و‎1.5 A‎، ويخرج منها ‎2.0 A‎ وتيار مجهول. احسبه.\n   الإجابة النموذجية: ‎3.0 + 1.5 − 2.0 = 2.5 A‎.", "1) (مستوى المعرفة) السؤال: لماذا لا تتراكم الشحنة عند نقطة التفرع؟\n   الإجابة النموذجية: لأن الشحنة لا تفنى ولا تُستحدث، فكل ما يدخل النقطة يخرج منها.\n2) (مستوى التطبيق) السؤال: يتفرع تيار ‎0.60 A‎ إلى فرعين، أحدهما ‎0.25 A‎. ما التيار في الآخر؟\n   الإجابة النموذجية: ‎0.35 A‎.\n3) (مستوى الاستدلال) السؤال: في نقطة تفرع: داخل ‎2.0 A‎ و‎0.5 A‎، وخارج ‎1.2 A‎ و‎I₁‎ و‎I₂‎ حيث ‎I₁ = 2I₂‎. احسب ‎I₁‎ و‎I₂‎.\n   الإجابة النموذجية: ‎I₁ + I₂ = 1.3 ← I₂ = 0.43 A‎ و‎I₁ = 0.87 A‎.", "إرشاد للطالب: مراجعة الموضوع 3-4 وحل مسائل القانون الأول\nإرشاد لولي الأمر: تشبيه نقطة التفرع مع الابن بتفرع الماء في الأنابيب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية<\/li><li>يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: دائرة بأميترات عند نقطة تفرع<\/span><\/div>", "<p>القانون الأول لكيرشوف، نقطة التفرع، حفظ الشحنة، مجموع التيارات الداخلة = مجموع الخارجة.<\/p>", "<p>يعرض المعلم دائرة فيها ثلاثة أميترات عند نقطة تفرع (قراءتان معلومتان) ويسأل: «كم تتوقع قراءة الأميتر الثالث؟ ولماذا؟» (فكرة التمهيد أ).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يعرض الدائرة ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون ويبررون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 12 دقيقة — التعلم بالاكتشاف:<\/b> يشرح نص القانون الأول وارتباطه بحفظ الشحنة ويتحقق عمليًا بالأميترات<br><span style=\"opacity:.85\">• الطالب: يسجلون القراءات ويتحققون من القانون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 15 دقيقة — التعلم التعاوني:<\/b> يقدم شبكات تفرع لحساب التيارات المجهولة<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اذكر نص القانون الأول لكيرشوف.<\/td><td>مجموع التيارات الداخلة إلى نقطة تفرع يساوي مجموع التيارات الخارجة منها.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>على أي قانون حفظ يعتمد القانون الأول؟<\/td><td>حفظ الشحنة الكهربائية.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>يدخل نقطة تفرع ‎3.0 A‎ و‎1.5 A‎، ويخرج منها ‎2.0 A‎ وتيار مجهول. احسبه.<\/td><td>‎3.0 + 1.5 − 2.0 = 2.5 A‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا لا تتراكم الشحنة عند نقطة التفرع؟<\/td><td>لأن الشحنة لا تفنى ولا تُستحدث، فكل ما يدخل النقطة يخرج منها.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>يتفرع تيار ‎0.60 A‎ إلى فرعين، أحدهما ‎0.25 A‎. ما التيار في الآخر؟<\/td><td>‎0.35 A‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>في نقطة تفرع: داخل ‎2.0 A‎ و‎0.5 A‎، وخارج ‎1.2 A‎ و‎I₁‎ و‎I₂‎ حيث ‎I₁ = 2I₂‎. احسب ‎I₁‎ و‎I₂‎.<\/td><td>‎I₁ + I₂ = 1.3 ← I₂ = 0.43 A‎ و‎I₁ = 0.87 A‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-4 وحل مسائل القانون الأول<\/p><p><b>إرشاد لولي الأمر:<\/b> تشبيه نقطة التفرع مع الابن بتفرع الماء في الأنابيب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "القانون الثاني لكيرشوف وحفظ الطاقة", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "2 من 5"], ["محور الحصة", "القانون الثاني لكيرشوف وحفظ الطاقة"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة\n2. يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة\nمخرج تعليمي آخر: يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية", "القانون الثاني لكيرشوف، المسار المغلق، مجموع القوى الدافعة = مجموع فروق الجهد، حفظ الطاقة، الإشارات.", "يسأل المعلم: «إذا سرت حول مسار مغلق في دائرة وعدت إلى النقطة نفسها، فهل يتغير جهدك؟ ماذا يقول ذلك عن الطاقة؟»", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يستنتجون أن التغير الكلي في الجهد صفر\n\n2. 13 دقيقة — التعلم بالاكتشاف: يشرح نص القانون الثاني وارتباطه بحفظ الطاقة وقاعدة الإشارات\n• الطالب: يطبقونه على دائرة بسيطة ببطارية ومقاومتين\n\n3. 14 دقيقة — التعلم التعاوني: يقدم دوائر بمسار أو مسارين لحساب فروق الجهد\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اذكر نص القانون الثاني لكيرشوف.\n   الإجابة النموذجية: في أي مسار مغلق، مجموع القوى الدافعة الكهربائية يساوي مجموع فروق الجهد ‎(IR)‎.\n2) (مستوى التطبيق) السؤال: على أي قانون حفظ يعتمد القانون الثاني؟\n   الإجابة النموذجية: حفظ الطاقة.\n3) (مستوى الاستدلال) السؤال: بطارية ‎12 V‎ موصولة بمقاومتين على التوالي، فرق الجهد عبر الأولى ‎7.5 V‎. احسب فرق الجهد عبر الثانية.\n   الإجابة النموذجية: ‎12 − 7.5 = 4.5 V‎.", "1) (مستوى المعرفة) السؤال: ما مجموع التغيرات في الجهد حول مسار مغلق؟\n   الإجابة النموذجية: صفر.\n2) (مستوى التطبيق) السؤال: مسار مغلق فيه بطاريتان متعاكستان ‎9.0 V‎ و‎3.0 V‎ ومقاومة 2.0 Ω. احسب التيار.\n   الإجابة النموذجية: ‎I = (9.0 − 3.0) ÷ 2.0 = 3.0 A‎.\n3) (مستوى الاستدلال) السؤال: بطارية ‎6.0 V‎ ومقاومتان 4.0 Ω و2.0 Ω على التوالي. احسب فرق الجهد عبر كل منهما.\n   الإجابة النموذجية: ‎I = 1.0 A‎؛ ‎V₁ = 4.0 V‎ و‎V₂ = 2.0 V‎.", "إرشاد للطالب: حل مسائل القانون الثاني ومراجعة قاعدة الإشارات\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «المسار الدائري الذي يعود إلى نقطة البداية»\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة<\/li><li>يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><\/div>", "<p>القانون الثاني لكيرشوف، المسار المغلق، مجموع القوى الدافعة = مجموع فروق الجهد، حفظ الطاقة، الإشارات.<\/p>", "<p>يسأل المعلم: «إذا سرت حول مسار مغلق في دائرة وعدت إلى النقطة نفسها، فهل يتغير جهدك؟ ماذا يقول ذلك عن الطاقة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يستنتجون أن التغير الكلي في الجهد صفر<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالاكتشاف:<\/b> يشرح نص القانون الثاني وارتباطه بحفظ الطاقة وقاعدة الإشارات<br><span style=\"opacity:.85\">• الطالب: يطبقونه على دائرة بسيطة ببطارية ومقاومتين<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم دوائر بمسار أو مسارين لحساب فروق الجهد<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اذكر نص القانون الثاني لكيرشوف.<\/td><td>في أي مسار مغلق، مجموع القوى الدافعة الكهربائية يساوي مجموع فروق الجهد ‎(IR)‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>على أي قانون حفظ يعتمد القانون الثاني؟<\/td><td>حفظ الطاقة.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>بطارية ‎12 V‎ موصولة بمقاومتين على التوالي، فرق الجهد عبر الأولى ‎7.5 V‎. احسب فرق الجهد عبر الثانية.<\/td><td>‎12 − 7.5 = 4.5 V‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما مجموع التغيرات في الجهد حول مسار مغلق؟<\/td><td>صفر.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>مسار مغلق فيه بطاريتان متعاكستان ‎9.0 V‎ و‎3.0 V‎ ومقاومة 2.0 Ω. احسب التيار.<\/td><td>‎I = (9.0 − 3.0) ÷ 2.0 = 3.0 A‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>بطارية ‎6.0 V‎ ومقاومتان 4.0 Ω و2.0 Ω على التوالي. احسب فرق الجهد عبر كل منهما.<\/td><td>‎I = 1.0 A‎؛ ‎V₁ = 4.0 V‎ و‎V₂ = 2.0 V‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> حل مسائل القانون الثاني ومراجعة قاعدة الإشارات<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه «المسار الدائري الذي يعود إلى نقطة البداية»<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "استنتاج المقاومة المكافئة للتوالي والتوازي من قانوني كيرشوف", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "3 من 5"], ["محور الحصة", "استنتاج المقاومة المكافئة للتوالي والتوازي من قانوني كيرشوف"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني\n2. يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول\nمخرج تعليمي آخر: يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات", "المخرج 1: تحليل\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية", "المقاومة المكافئة، التوالي ‎R = R₁ + R₂‎، التوازي ‎1/R = 1/R₁ + 1/R₂‎، الشبكات المختلطة.", "يسأل المعلم: «درست قوانين التوالي والتوازي سابقًا؛ هل تستطيع إثباتها الآن باستخدام قانوني كيرشوف فقط؟»", "1. 5 دقائق — التعلم التعاوني: يطرح التحدي\n• الطالب: يقترحون البدء بالقانون الثاني للتوالي\n\n2. 14 دقيقة — التعلم بالنمذجة: يوجه الطلبة لاستنتاج القانونين خطوة بخطوة\n• الطالب: يكتبون الاستنتاجين في الدفتر\n\n3. 13 دقيقة — التعلم التعاوني: يقدم شبكات مختلطة لحساب المقاومة المكافئة\n• الطالب: يحسبون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: استنتج معادلة التوالي من القانون الثاني.\n   الإجابة النموذجية: ‎E = IR₁ + IR₂ = I(R₁ + R₂) = IR ← R = R₁ + R₂‎.\n2) (مستوى التطبيق) السؤال: استنتج معادلة التوازي من القانون الأول.\n   الإجابة النموذجية: ‎I = I₁ + I₂ ← V/R = V/R₁ + V/R₂ ← 1/R = 1/R₁ + 1/R₂‎.\n3) (مستوى الاستدلال) السؤال: احسب المقاومة المكافئة لـ 6.0 Ω و3.0 Ω على التوازي.\n   الإجابة النموذجية: ‎R = 2.0 Ω‎.", "1) (مستوى المعرفة) السؤال: ما المقاومة المكافئة لـ 4.0 Ω و6.0 Ω على التوالي؟\n   الإجابة النموذجية: 10 Ω.\n2) (مستوى التطبيق) السؤال: احسب المقاومة المكافئة لـ 4.0 Ω موصولة على التوالي مع مجموعة 6.0 Ω و3.0 Ω على التوازي.\n   الإجابة النموذجية: ‎4.0 + 2.0 = 6.0 Ω‎.\n3) (مستوى الاستدلال) السؤال: لماذا تكون المقاومة المكافئة لمجموعة على التوازي أقل من أصغر مقاومة فيها؟\n   الإجابة النموذجية: لأن إضافة فروع توفر مسارات إضافية للتيار فيزداد التيار الكلي عند فرق الجهد نفسه.", "إرشاد للطالب: كتابة استنتاجي معادلتي التوالي والتوازي وحل ثلاث شبكات مختلطة\nإرشاد لولي الأمر: متابعة الابن في الاستنتاج الرياضي المنظم\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني<\/li><li>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><\/div>", "<p>المقاومة المكافئة، التوالي ‎R = R₁ + R₂‎، التوازي ‎1/R = 1/R₁ + 1/R₂‎، الشبكات المختلطة.<\/p>", "<p>يسأل المعلم: «درست قوانين التوالي والتوازي سابقًا؛ هل تستطيع إثباتها الآن باستخدام قانوني كيرشوف فقط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يطرح التحدي<br><span style=\"opacity:.85\">• الطالب: يقترحون البدء بالقانون الثاني للتوالي<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 14 دقيقة — التعلم بالنمذجة:<\/b> يوجه الطلبة لاستنتاج القانونين خطوة بخطوة<br><span style=\"opacity:.85\">• الطالب: يكتبون الاستنتاجين في الدفتر<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 13 دقيقة — التعلم التعاوني:<\/b> يقدم شبكات مختلطة لحساب المقاومة المكافئة<br><span style=\"opacity:.85\">• الطالب: يحسبون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>استنتج معادلة التوالي من القانون الثاني.<\/td><td>‎E = IR₁ + IR₂ = I(R₁ + R₂) = IR ← R = R₁ + R₂‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>استنتج معادلة التوازي من القانون الأول.<\/td><td>‎I = I₁ + I₂ ← V/R = V/R₁ + V/R₂ ← 1/R = 1/R₁ + 1/R₂‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب المقاومة المكافئة لـ 6.0 Ω و3.0 Ω على التوازي.<\/td><td>‎R = 2.0 Ω‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما المقاومة المكافئة لـ 4.0 Ω و6.0 Ω على التوالي؟<\/td><td>10 Ω.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب المقاومة المكافئة لـ 4.0 Ω موصولة على التوالي مع مجموعة 6.0 Ω و3.0 Ω على التوازي.<\/td><td>‎4.0 + 2.0 = 6.0 Ω‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا تكون المقاومة المكافئة لمجموعة على التوازي أقل من أصغر مقاومة فيها؟<\/td><td>لأن إضافة فروع توفر مسارات إضافية للتيار فيزداد التيار الكلي عند فرق الجهد نفسه.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> كتابة استنتاجي معادلتي التوالي والتوازي وحل ثلاث شبكات مختلطة<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في الاستنتاج الرياضي المنظم<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "أحاجي قانوني كيرشوف ونشاط 3-6", "n": 4, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "4 من 5"], ["محور الحصة", "أحاجي قانوني كيرشوف ونشاط 3-6"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 + كتاب التجارب ص 80"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق\n2. يحل نشاط 3-6 «قانونا كيرشوف»\nمخرج تعليمي آخر: يصمم «أحجية» دائرة لزملائه مع حلها", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم المبني على اللعب\n- التعلم التعاوني\n- الأحاجي (الألغاز)", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: بطاقات أحاجي دوائر، كتاب التجارب العملية والأنشطة", "المعادلات الآنية، تحديد اتجاه التيارات، المسارات المغلقة المستقلة، التحقق من الحل.", "يوزع المعلم بطاقات «أحاجي قانوني كيرشوف»: دوائر فيها قيم مفقودة، ويعلن أن الفائز من يكمل أكبر عدد صحيح في عشر دقائق.", "1. 4 دقائق — التعلم التعاوني: يشرح قواعد نشاط الأحاجي\n• الطالب: يستعدون في مجموعات\n\n2. 14 دقيقة — الاستراتيجيتان: الأحاجي (الألغاز)، التعلم المبني على اللعب: ينفذ «أحاجي (ألغاز) في قانوني كيرشوف»\n• الطالب: يحسبون القيم المفقودة باستخدام القانونين\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل نشاط 3-6 (ص 80)\n• الطالب: يحلون فرديًا ثم يقارنون\n\n4. 8 دقائق — التعلم التعاوني: يكلف كل مجموعة بتصميم أحجية لمجموعة أخرى\n• الطالب: يصممون أحجية ويحلون أحجية زملائهم", "1) (مستوى المعرفة) السؤال: كم معادلة مستقلة نحتاج لحل دائرة بتيارين مجهولين؟\n   الإجابة النموذجية: معادلتان مستقلتان.\n2) (مستوى التطبيق) السؤال: ماذا تعني الإشارة السالبة للتيار المحسوب؟\n   الإجابة النموذجية: أن الاتجاه الحقيقي للتيار عكس الاتجاه المفترض.\n3) (مستوى الاستدلال) السؤال: دائرة بمسارين: بطارية ‎12 V‎ مع 4.0 Ω، ثم فرعان 6.0 Ω و3.0 Ω على التوازي. احسب التيار في فرع 6.0 Ω.\n   الإجابة النموذجية: ‎I‎ الكلي = ‎2.0 A‎؛ فرق الجهد على الفرعين = ‎4.0 V‎؛ ‎I(6 Ω) = 0.67 A‎.", "1) (مستوى المعرفة) السؤال: ما الخطوة الأولى في حل دائرة بقانوني كيرشوف؟\n   الإجابة النموذجية: تحديد اتجاهات افتراضية للتيارات في كل فرع.\n2) (مستوى التطبيق) السؤال: في الدائرة السابقة احسب التيار في فرع 3.0 Ω.\n   الإجابة النموذجية: ‎4.0 ÷ 3.0 = 1.3 A‎.\n3) (مستوى الاستدلال) السؤال: كيف تتحقق من صحة حلك؟\n   الإجابة النموذجية: بتطبيق القانون الأول عند نقطة التفرع ‎(0.67 + 1.33 = 2.0 A)‎ والقانون الثاني على مسار آخر.", "إرشاد للطالب: إكمال نشاط 3-6 ص 80 وحل أحجية زميلك\nإرشاد لولي الأمر: تشجيع الابن على التحقق من الحلول بالقانونين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق<\/li><li>يحل نشاط 3-6 «قانونا كيرشوف»<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم «أحجية» دائرة لزملائه مع حلها<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل نشاط 3-6 «قانونا كيرشوف»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يصمم «أحجية» دائرة لزملائه مع حلها<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الأحاجي (الألغاز)<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: بطاقات أحاجي دوائر، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>المعادلات الآنية، تحديد اتجاه التيارات، المسارات المغلقة المستقلة، التحقق من الحل.<\/p>", "<p>يوزع المعلم بطاقات «أحاجي قانوني كيرشوف»: دوائر فيها قيم مفقودة، ويعلن أن الفائز من يكمل أكبر عدد صحيح في عشر دقائق.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 4 دقائ  class=\"lvA a3\">مستوى الاستدلال<\/td><td>كيف تتحقق من صحة حلك؟<\/td><td>بتطبيق القانون الأول عند نقطة التفرع ‎(0.67 + 1.33 = 2.0 A)‎ والقانون الثاني على مسار آخر.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-6 ص 80 وحل أحجية زميلك<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التحقق من الحلول بالقانونين<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}, {"axis": "تطوير عملي للقانون الثاني ونشاط 3-7 والأسئلة 16–23", "n": 5, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "5 من 5"], ["محور الحصة", "تطوير عملي للقانون الثاني ونشاط 3-7 والأسئلة 16–23"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 + كتاب التجارب ص 84"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق\n2. يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23\nمخرج تعليمي آخر: يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- أخرى: بطارية، مقاومات، فولتميتر رقمي، أسلاك", "التحقق التجريبي، مقاومة الأسلاك، المقاومة الداخلية، دقة الفولتميتر، المسار المغلق.", "يسأل المعلم: «إذا جمعنا قراءات الفولتميتر عبر كل المقاومات في مسار، هل ستساوي قراءة البطارية تمامًا؟ لماذا قد تختلف؟»", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يتوقعون فروقًا صغيرة ويقترحون أسبابًا\n\n2. 15 دقيقة — التعلم التعاوني: ينفذ «تطوير عملي للقانون الثاني لكيرشوف» بقياس فروق الجهد\n• الطالب: يقيسون ويسجلون ويجمعون القراءات\n\n3. 12 دقيقة — التعلم التعاوني: يوجه حل نشاط 3-7 (ص 84) والأسئلة 16–23\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق — التعلم التعاوني: يدير السؤال المفصلي (شبكة مقاومات) ثم يختم بمسابقة المجموعات\n• الطالب: يجيبون ويتنافسون", "1) (مستوى المعرفة) السؤال: لماذا قد يقل مجموع فروق الجهد المقيسة قليلًا عن القوة الدافعة؟\n   الإجابة النموذجية: بسبب الجهد المفقود في المقاومة الداخلية للبطارية وفي الأسلاك.\n2) (مستوى التطبيق) السؤال: كيف يُوصل الفولتميتر لقياس فرق الجهد عبر مقاومة؟\n   الإجابة النموذجية: على التوازي معها.\n3) (مستوى الاستدلال) السؤال: قيست فروق الجهد ‎3.1 V‎ و‎2.8 V‎ في مسار بطاريته ‎6.0 V‎. ما الجهد المفقود؟\n   الإجابة النموذجية: ‎6.0 − 5.9 = 0.1 V‎.", "1) (مستوى المعرفة) السؤال: ما الذي تتحقق منه هذه التجربة؟\n   الإجابة النموذجية: القانون الثاني لكيرشوف (حفظ الطاقة).\n2) (مستوى التطبيق) السؤال: لماذا يفضل الفولتميتر الرقمي عالي المقاومة؟\n   الإجابة النموذجية: كي لا يسحب تيارًا يذكر فلا يغير الدائرة.\n3) (مستوى الاستدلال) السؤال: اقترح تعديلًا يقلل الفرق بين المجموع والقوة الدافعة.\n   الإجابة النموذجية: استخدام أسلاك قصيرة سميكة ومصدر مقاومته الداخلية صغيرة، أو قياس فرق الجهد بين طرفي البطارية أثناء مرور التيار بدل قوتها الدافعة.", "إرشاد للطالب: كتابة تقرير التحقق العملي وإكمال نشاط 3-7 ص 84 والأسئلة 16–23\nإرشاد لولي الأمر: الاطلاع مع الابن على تقريره ومناقشة أسباب الفروق\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13"], "h": ["<ol class=\"ol\"><li>يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق<\/li><li>يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: بطارية، مقاومات، فولتميتر رقمي، أسلاك<\/span><\/div>", "<p>التحقق التجريبي، مقاومة الأسلاك، المقاومة الداخلية، دقة الفولتميتر، المسار المغلق.<\/p>", "<p>يسأل المعلم: «إذا جمعنا قراءات الفولتميتر عبر كل المقاومات في مسار، هل ستساوي قراءة البطارية تمامًا؟ لماذا قد تختلف؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون فروقًا صغيرة ويقترحون أسبابًا<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — التعلم التعاوني:<\/b> ينفذ «تطوير عملي للقانون الثاني لكيرشوف» بقياس فروق الجهد<br><span style=\"opacity:.85\">• الطالب: يقيسون ويسجلون ويجمعون القراءات<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يوجه حل نشاط 3-7 (ص 84) والأسئلة 16–23<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق — التعلم التعاوني:<\/b> يدير السؤال المفصلي (شبكة مقاومات) ثم يختم بمسابقة المجموعات<br><span style=\"opacity:.85\">• الطالب: يجيبون ويتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا قد يقل مجموع فروق الجهد المقيسة قليلًا عن القوة الدافعة؟<\/td><td>بسبب الجهد المفقود في المقاومة الداخلية للبطارية وفي الأسلاك.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>كيف يُوصل الفولتميتر لقياس فرق الجهد عبر مقاومة؟<\/td><td>على التوازي معها.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>قيست فروق الجهد ‎3.1 V‎ و‎2.8 V‎ في مسار بطاريته ‎6.0 V‎. ما الجهد المفقود؟<\/td><td>‎6.0 − 5.9 = 0.1 V‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الذي تتحقق منه هذه التجربة؟<\/td><td>القانون الثاني لكيرشوف (حفظ الطاقة).<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا يفضل الفولتميتر الرقمي عالي المقاومة؟<\/td><td>كي لا يسحب تيارًا يذكر فلا يغير الدائرة.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>اقترح تعديلًا يقلل الفرق بين المجموع والقوة الدافعة.<\/td><td>استخدام أسلاك قصيرة سميكة ومصدر مقاومته الداخلية صغيرة، أو قياس فرق الجهد بين طرفي البطارية أثناء مرور التيار بدل قوتها الدافعة.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير التحقق العملي وإكمال نشاط 3-7 ص 84 والأسئلة 16–23<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على تقريره ومناقشة أسباب الفروق<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=13<\/p>"]}]}, {"title": "الدوائر العملية", "sb": "الموضوع 3-5 (الأسئلة 24–31)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "المقاومة الداخلية والجهد المفقود", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "1 من 3"], ["محور الحصة", "المقاومة الداخلية والجهد المفقود"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 (الأسئلة 24–31)"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه\n2. يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود\nمخرج تعليمي آخر: يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: خلية جافة، مقاومة متغيرة، أميتر، فولتميتر، أسلاك", "القوة الدافعة الكهربائية ‎E‎، المقاومة الداخلية ‎r‎، فرق الجهد بين الطرفين ‎V‎، الجهد المفقود ‎Ir‎، ‎E = V + Ir‎، التمثيل البياني ‎V‎ مقابل ‎I‎.", "يسأل المعلم: «لماذا تخفت أضواء السيارة لحظة تشغيل المحرك؟» ويذكّر بأن بادئ الحركة يسحب تيارًا كبيرًا (فكرة التمهيد).", "1. 5 دقائق — التعلم التعاوني: يطرح السؤال\n• الطالب: يقترحون انخفاض فرق الجهد عند سحب تيار كبير\n\n2. 13 دقيقة — التعلم بالاكتشاف: يشرح المقاومة الداخلية و‎E = I(R + r)‎ والجهد المفقود\n• الطالب: يحلون مثالًا لحساب ‎I‎ و‎V‎\n\n3. 15 دقيقة — الاستراتيجيتان: الاستقصاء العملي، التعلم بالاكتشاف: ينفذ «استقصاء شدة التيار الكهربائي في خلية جافة وفرق الجهد بين طرفيها»\n• الطالب: يسجلون قراءات ‎V‎ و‎I‎ ويرسمون ‎V‎ مقابل ‎I‎ ويستنتجون ‎E‎ من المقطع و‎r‎ من الميل\n\n4. 7 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اكتب العلاقة بين ‎E‎ و‎V‎ و‎r‎.\n   الإجابة النموذجية: ‎E = V + Ir‎\n2) (مستوى التطبيق) السؤال: بطارية ‎E = 6.0 V‎ و‎r = 0.50 Ω‎ موصولة بمقاومة 2.5 Ω. احسب التيار وفرق الجهد بين طرفيها.\n   الإجابة النموذجية: ‎I = 6.0 ÷ 3.0 = 2.0 A‎؛ ‎V = 2.0 × 2.5 = 5.0 V‎.\n3) (مستوى الاستدلال) السؤال: ماذا يمثل الجزء المقطوع من المحور الرأسي وميل خط ‎V‎ مقابل ‎I‎؟\n   الإجابة النموذجية: المقطع يمثل ‎E‎، والميل يمثل ‎−r‎.", "1) (مستوى المعرفة) السؤال: ما الجهد المفقود؟\n   الإجابة النموذجية: فرق الجهد عبر المقاومة الداخلية ‎(Ir)‎ الذي لا يصل إلى الدائرة الخارجية.\n2) (مستوى التطبيق) السؤال: متى يساوي فرق الجهد بين طرفي البطارية قوتها الدافعة؟\n   الإجابة النموذجية: عندما لا يمر تيار ‎(I = 0)‎.\n3) (مستوى الاستدلال) السؤال: لماذا تخفت أضواء السيارة عند تشغيل المحرك؟\n   الإجابة النموذجية: لأن بادئ الحركة يسحب تيارًا كبيرًا فيزداد الجهد المفقود ‎Ir‎ وينخفض فرق الجهد بين طرفي البطارية.", "إرشاد للطالب: مراجعة الموضوع 3-5 وكتابة تقرير الاستقصاء مع التمثيل البياني\nإرشاد لولي الأمر: الحديث مع الابن عن سبب خفوت الأضواء عند تشغيل محرك السيارة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14"], "h": ["<ol class=\"ol\"><li>يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه<\/li><li>يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: خلية جافة، مقاومة متغيرة، أميتر، فولتميتر، أسلاك<\/span><\/div>", "<p>القوة الدافعة الكهربائية ‎E‎، المقاومة الداخلية ‎r‎، فرق الجهد بين الطرفين ‎V‎، الجهد المفقود ‎Ir‎، ‎E = V + Ir‎، التمثيل البياني ‎V‎ مقابل ‎I‎.<\/p>", "<p>يسأل المعلم: «لماذا تخفت أضواء السيارة لحظة تشغيل المحرك؟» ويذكّر بأن بادئ الحركة يسحب تيارًا كبيرًا (فكرة التمهيد).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون انخفاض فرق الجهد عند سحب تيار كبير<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالاكتشاف:<\/b> يشرح المقاومة الداخلية و‎E = I(R + r)‎ والجهد المفقود<br><span style=\"opacity:.85\">• الطالب: يحلون مثالًا لحساب ‎I‎ و‎V‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 15 دقيقة — الاستراتيجيتان: الاستقصاء العملي، التعلم بالاكتشاف:<\/b> ينفذ «استقصاء شدة التيار الكهربائي في خلية جافة وفرق الجهد بين طرفيها»<br><span style=\"opacity:.85\">• الطالب: يسجلون قراءات ‎V‎ و‎I‎ ويرسمون ‎V‎ مقابل ‎I‎ ويستنتجون ‎E‎ من المقطع و‎r‎ من الميل<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 7 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب العلاقة بين ‎E‎ و‎V‎ و‎r‎.<\/td><td>‎E = V + Ir‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>بطارية ‎E = 6.0 V‎ و‎r = 0.50 Ω‎ موصولة بمقاومة 2.5 Ω. احسب التيار وفرق الجهد بين طرفيها.<\/td><td>‎I = 6.0 ÷ 3.0 = 2.0 A‎؛ ‎V = 2.0 × 2.5 = 5.0 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ماذا يمثل الجزء المقطوع من المحور الرأسي وميل خط ‎V‎ مقابل ‎I‎؟<\/td><td>المقطع يمثل ‎E‎، والميل يمثل ‎−r‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الجهد المفقود؟<\/td><td>فرق الجهد عبر المقاومة الداخلية ‎(Ir)‎ الذي لا يصل إلى الدائرة الخارجية.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>متى يساوي فرق الجهد بين طرفي البطارية قوتها الدافعة؟<\/td><td>عندما لا يمر تيار ‎(I = 0)‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا تخفت أضواء السيارة عند تشغيل المحرك؟<\/td><td>لأن بادئ الحركة يسحب تيارًا كبيرًا فيزداد الجهد المفقود ‎Ir‎ وينخفض فرق الجهد بين طرفي البطارية.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-5 وكتابة تقرير الاستقصاء مع التمثيل البياني<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن سبب خفوت الأضواء عند تشغيل محرك السيارة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14<\/p>"]}, {"axis": "مجزئ الجهد الكهربائي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "2 من 3"], ["محور الحصة", "مجزئ الجهد الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 (الأسئلة 24–31)"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎\n2. يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب\nمخرج تعليمي آخر: يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم بالاكتشاف\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- أخرى: مقاومات، مقاومة متغيرة، مقاومة ضوئية ‎LDR‎، فولتميتر، كتاب التجارب العملية والأنشطة", "مجزئ الجهد، ‎Vout‎، نسبة المقاومات، المقاومة الضوئية ‎LDR‎، الثرمستور، المستشعرات.", "يسأل المعلم: «لدينا بطارية ‎12 V‎ وجهاز يحتاج ‎4 V‎ فقط؛ كيف نحصل على ‎4 V‎ دون بطارية جديدة؟»", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يقترحون تقسيم الجهد بمقاومتين\n\n2. 12 دقيقة — التعلم المبني على المشاريع: يشرح مجزئ الجهد والعلاقة ويحل مثالًا\n• الطالب: يحسبون ‎Vout‎ لنسب مختلفة\n\n3. 15 دقيقة — التعلم بالاكتشاف: ينفذ «استقصاء دائرة مجزئ جهد كهربائي» ويوجه حل نشاط 3-10 (ص 94)\n• الطالب: يبنون الدائرة ويقيسون ويقارنون ويحلون النشاط\n\n4. 8 دقائق: يدير السؤال المفصلي (مجزئ ببطارية ‎6.0 V‎) ثم التقويم الختامي\n• الطالب: يجيبون ويناقشون", "1) (مستوى المعرفة) السؤال: احسب ‎Vout‎ عبر ‎R₂ = 2.0 kΩ‎ في مجزئ مع ‎R₁ = 4.0 kΩ‎ و‎Vin = 12 V‎.\n   الإجابة النموذجية: ‎Vout = 12 × 2.0 ÷ 6.0 = 4.0 V‎.\n2) (مستوى التطبيق) السؤال: ماذا يحدث لـ ‎Vout‎ عبر ‎LDR‎ في مجزئ جهد عند زيادة الإضاءة؟\n   الإجابة النموذجية: تقل مقاومة ‎LDR‎ فيقل فرق الجهد عبرها.\n3) (مستوى الاستدلال) السؤال: كيف تحصل على ‎Vout‎ متغير باستمرار من 0 إلى ‎Vin‎؟\n   الإجابة النموذجية: باستخدام مقاومة متغيرة ذات ثلاثة أطراف (مجزئ جهد منزلق).", "1) (مستوى المعرفة) السؤال: اكتب علاقة مجزئ الجهد.\n   الإجابة النموذجية: ‎Vout = R₂Vin/(R₁ + R₂)‎\n2) (مستوى التطبيق) السؤال: مجزئ جهد بمقاومتين متساويتين و‎9.0 V‎؛ ما ‎Vout‎؟\n   الإجابة النموذجية: ‎4.5 V‎.\n3) (مستوى الاستدلال) السؤال: صمم مجزئ جهد يشغل جرسًا عند حلول الظلام، وحدد موضع ‎LDR‎.\n   الإجابة النموذجية: ‎LDR‎ في موضع ‎R₂ (‎عند المخرج)؛ في الظلام تزداد مقاومتها فيرتفع ‎Vout‎ ويشغل الجرس.", "إرشاد للطالب: إكمال نشاط 3-10 ص 94 ورسم دائرة مجزئ جهد بمستشعر\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن الإنارة التلقائية لأعمدة الشوارع\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14"], "h": ["<ol class=\"ol\"><li>يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎<\/li><li>يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على المشاريع<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: مقاومات، مقاومة متغيرة، مقاومة ضوئية ‎LDR‎، فولتميتر، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مجزئ الجهد، ‎Vout‎، نسبة المقاومات، المقاومة الضوئية ‎LDR‎، الثرمستور، المستشعرات.<\/p>", "<p>يسأل المعلم: «لدينا بطارية ‎12 V‎ وجهاز يحتاج ‎4 V‎ فقط؛ كيف نحصل على ‎4 V‎ دون بطارية جديدة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون تقسيم الجهد بمقاومتين<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 12 دقيقة — التعلم المبني على المشاريع:<\/b> يشرح مجزئ الجهد والعلاقة ويحل مثالًا<br><span style=\"opacity:.85\">• الطالب: يحسبون ‎Vout‎ لنسب مختلفة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 15 دقيقة — التعلم بالاكتشاف:<\/b> ينفذ «استقصاء دائرة مجزئ جهد كهربائي» ويوجه حل نشاط 3-10 (ص 94)<br><span style=\"opacity:.85\">• الطالب: يبنون الدائرة ويقيسون ويقارنون ويحلون النشاط<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير السؤال المفصلي (مجزئ ببطارية ‎6.0 V‎) ثم التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون ويناقشون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>احسب ‎Vout‎ عبر ‎R₂ = 2.0 kΩ‎ في مجزئ مع ‎R₁ = 4.0 kΩ‎ و‎Vin = 12 V‎.<\/td><td>‎Vout = 12 × 2.0 ÷ 6.0 = 4.0 V‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ماذا يحدث لـ ‎Vout‎ عبر ‎LDR‎ في مجزئ جهد عند زيادة الإضاءة؟<\/td><td>تقل مقاومة ‎LDR‎ فيقل فرق الجهد عبرها.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>كيف تحصل على ‎Vout‎ متغير باستمرار من 0 إلى ‎Vin‎؟<\/td><td>باستخدام مقاومة متغيرة ذات ثلاثة أطراف (مجزئ جهد منزلق).<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب علاقة مجزئ الجهد.<\/td><td>‎Vout = R₂Vin/(R₁ + R₂)‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>مجزئ جهد بمقاومتين متساويتين و‎9.0 V‎؛ ما ‎Vout‎؟<\/td><td>‎4.5 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>صمم مجزئ جهد يشغل جرسًا عند حلول الظلام، وحدد موضع ‎LDR‎.<\/td><td>‎LDR‎ في موضع ‎R₂ (‎عند المخرج)؛ في الظلام تزداد مقاومتها فيرتفع ‎Vout‎ ويشغل الجرس.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-10 ص 94 ورسم دائرة مجزئ جهد بمستشعر<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن الحديث مع الابن عن الإنارة التلقائية لأعمدة الشوارع<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14<\/p>"]}, {"axis": "مقياس الجهد والطريقة الصفرية ومراجعة الوحدة الثالثة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "3 من 3"], ["محور الحصة", "مقياس الجهد والطريقة الصفرية ومراجعة الوحدة الثالثة"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 + كتاب التجارب ص 87 و90 و97"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه\n2. يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)\nمخرج تعليمي آخر: يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: سلك مقياس جهد، جلفانوميتر، خلايا، كتاب التجارب العملية والأنشطة", "مقياس الجهد، سلك منتظم، طول الاتزان، الجلفانوميتر، الطريقة الصفرية، مقارنة القوى الدافعة ‎E₁/E₂ = L₁/L₂‎.", "يسأل المعلم: «الفولتميتر يسحب تيارًا ولو صغيرًا فيغير ما يقيسه؛ هل يمكن قياس قوة دافعة لخلية دون سحب أي تيار منها؟»", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يقترحون موازنة الخلية بجهد آخر\n\n2. 13 دقيقة — التعلم بالاكتشاف: ينفذ «استخدام مجزئ الجهد لمقارنة القوة الدافعة الكهربائية للخلايا» ويشرح الطريقة الصفرية\n• الطالب: يحسبون ‎E₂‎ من أطوال الاتزان\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل نشاطي 3-8 و3-9 (ص 87 و90) ونشاط 3-11 (ص 97) وأسئلة مختارة\n• الطالب: يحلون في مجموعات ويعرضون\n\n4. 8 دقائق: يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي\n• الطالب: يتنافسون ثم يقيّمون أنفسهم", "1) (مستوى المعرفة) السؤال: ماذا يعني أن قراءة الجلفانوميتر صفر عند نقطة الاتزان؟\n   الإجابة النموذجية: لا يمر تيار في الخلية المقيسة، فيكون فرق الجهد عبر طول الاتزان مساويًا لقوتها الدافعة.\n2) (مستوى التطبيق) السؤال: خلية ‎E₁ = 1.5 V‎ طول اتزانها ‎60.0 cm‎، وخلية أخرى طول اتزانها ‎48.0 cm‎. احسب ‎E₂‎.\n   الإجابة النموذجية: ‎E₂ = 1.5 × 48.0 ÷ 60.0 = 1.2 V‎.\n3) (مستوى الاستدلال) السؤال: لماذا يجب أن يكون سلك مقياس الجهد منتظم المقطع؟\n   الإجابة النموذجية: ليكون فرق الجهد متناسبًا طرديًا مع الطول.", "1) (مستوى المعرفة) السؤال: ما ميزة الطريقة الصفرية؟\n   الإجابة النموذجية: لا يُسحب تيار من الخلية المقيسة، فيُقاس فرق الجهد بدقة دون تأثر بالمقاومة الداخلية.\n2) (مستوى التطبيق) السؤال: ما الجهاز الذي يكشف انعدام التيار؟\n   الإجابة النموذجية: الجلفانوميتر.\n3) (مستوى الاستدلال) السؤال: لماذا يكون مقياس الجهد أدق من الفولتميتر العادي في قياس ‎e.m.f‎.؟\n   الإجابة النموذجية: لأنه لا يسحب تيارًا عند الاتزان فلا يوجد جهد مفقود، بينما يسحب الفولتميتر تيارًا صغيرًا.", "إرشاد للطالب: إكمال نشاطي 3-8 و3-9 وأسئلة نهاية الوحدة الثالثة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14"], "h": ["<ol class=\"ol\"><li>يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه<\/li><li>يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: سلك مقياس جهد، جلفانوميتر، خلايا، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مقياس الجهد، سلك منتظم، طول الاتزان، الجلفانوميتر، الطريقة الصفرية، مقارنة القوى الدافعة ‎E₁/E₂ = L₁/L₂‎.<\/p>", "<p>يسأل المعلم: «الفولتميتر يسحب تيارًا ولو صغيرًا فيغير ما يقيسه؛ هل يمكن قياس قوة دافعة لخلية دون سحب أي تيار منها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون موازنة الخلية بجهد آخر<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالاكتشاف:<\/b> ينفذ «استخدام مجزئ الجهد لمقارنة القوة الدافعة الكهربائية للخلايا» ويشرح الطريقة الصفرية<br><span style=\"opacity:.85\">• الطالب: يحسبون ‎E₂‎ من أطوال الاتزان<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يوجه حل نشاطي 3-8 و3-9 (ص 87 و90) ونشاط 3-11 (ص 97) وأسئلة مختارة<br><span style=\"opacity:.85\">• الطالب: يحلون في مجموعات ويعرضون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي<br><span style=\"opacity:.85\">• الطالب: يتنافسون ثم يقيّمون أنفسهم<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ماذا يعني أن قراءة الجلفانوميتر صفر عند نقطة الاتزان؟<\/td><td>لا يمر تيار في الخلية المقيسة، فيكون فرق الجهد عبر طول الاتزان مساويًا لقوتها الدافعة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>خلية ‎E₁ = 1.5 V‎ طول اتزانها ‎60.0 cm‎، وخلية أخرى طول اتزانها ‎48.0 cm‎. احسب ‎E₂‎.<\/td><td>‎E₂ = 1.5 × 48.0 ÷ 60.0 = 1.2 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا يجب أن يكون سلك مقياس الجهد منتظم المقطع؟<\/td><td>ليكون فرق الجهد متناسبًا طرديًا مع الطول.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما ميزة الطريقة الصفرية؟<\/td><td>لا يُسحب تيار من الخلية المقيسة، فيُقاس فرق الجهد بدقة دون تأثر بالمقاومة الداخلية.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما الجهاز الذي يكشف انعدام التيار؟<\/td><td>الجلفانوميتر.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا يكون مقياس الجهد أدق من الفولتميتر العادي في قياس ‎e.m.f‎.؟<\/td><td>لأنه لا يسحب تيارًا عند الاتزان فلا يوجد جهد مفقود، بينما يسحب الفولتميتر تيارًا صغيرًا.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 3-8 و3-9 وأسئلة نهاية الوحدة الثالثة وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=14<\/p>"]}]}, {"title": "التعرف على المكثفات", "sb": "الموضوع 4-1 (الأسئلة 1–10)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "المكثف وتعريف السعة ‎C = Q/V‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "التعرف على المكثفات"], ["الحصة", "1 من 2"], ["محور الحصة", "المكثف وتعريف السعة ‎C = Q/V‎"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 4-1 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: الشحنة الكهربائية وفرق الجهد الكهربائي والسعة ص 110"]], "t": ["1. يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح\n2. يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد\nمخرج تعليمي آخر: يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مكثفات متنوعة للعرض", "المكثف، اللوحان المتوازيان، العازل، السعة ‎C‎، الفاراد ‎F‎، الميكروفاراد μ‎F‎، ‎C = Q/V‎، الشحنة على كل لوح.", "يعرض المعلم مكثفات مختلفة الأحجام من أجهزة إلكترونية قديمة ويسأل: «ما وظيفة هذه المكونات؟ وكيف يخزن جهاز طاقة دون تفاعل كيميائي كالبطارية؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1. 5 دقائق — التعلم بالاكتشاف: يعرض المكثفات ويطرح السؤال ومهام بداية الوحدة\n• الطالب: يقترحون أنها تخزن شحنة\n\n2. 13 دقيقة — التعلم بالاكتشاف: يشرح تركيب المكثف متوازي الألواح وكيفية شحنه وتعريف السعة ووحدتها\n• الطالب: يرسمون المكثف ويكتبون التعريف والوحدة\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل ‎C = Q/V‎ بوحدات متنوعة (‎μF‎، ‎nF‎، ‎pF‎)\n• الطالب: يحلون في أزواج مع تحويل الوحدات\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: عرّف سعة المكثف.\n   الإجابة النموذجية: الشحنة المخزنة على أحد اللوحين لكل وحدة فرق جهد بين اللوحين.\n2) (مستوى التطبيق) السؤال: احسب الشحنة على مكثف ‎470 μF‎ مشحون إلى ‎12 V‎.\n   الإجابة النموذجية: ‎Q = 470 × 10⁻⁶ × 12 = 5.6 × 10⁻³ C‎.\n3) (مستوى الاستدلال) السؤال: لماذا تكون الشحنة الكلية على المكثف المشحون صفرًا؟\n   الإجابة النموذجية: لأن اللوحين يحملان شحنتين متساويتين ومتعاكستين (‎+Q‎ وـ‎Q‎).", "1) (مستوى المعرفة) السؤال: ما وحدة السعة؟\n   الإجابة النموذجية: الفاراد ‎(F) = C/V‎.\n2) (مستوى التطبيق) السؤال: احسب فرق الجهد عبر مكثف ‎2.0 μF‎ يحمل ‎6.0 × 10⁻⁵ C‎.\n   الإجابة النموذجية: ‎V = 30 V‎.\n3) (مستوى الاستدلال) السؤال: لماذا يُعد الفاراد وحدة كبيرة جدًا عمليًا؟\n   الإجابة النموذجية: لأن مكثفًا سعته ‎1 F‎ عند جهد صغير يخزن شحنة كبيرة جدًا، والمكثفات الشائعة سعتها ميكروفاراد أو أقل.", "إرشاد للطالب: مراجعة الموضوع 4-1 وحل مسائل ‎C = Q/V‎\nإرشاد لولي الأمر: الحديث مع الابن عن المكثفات في الأجهزة الإلكترونية المنزلية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15"], "h": ["<ol class=\"ol\"><li>يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح<\/li><li>يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)<\/td><td class=\"lv\">فهم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: مكثفات متنوعة للعرض<\/span><\/div>", "<p>المكثف، اللوحان المتوازيان، العازل، السعة ‎C‎، الفاراد ‎F‎، الميكروفاراد μ‎F‎، ‎C = Q/V‎، الشحنة على كل لوح.<\/p>", "<p>يعرض المعلم مكثفات مختلفة الأحجام من أجهزة إلكترونية قديمة ويسأل: «ما وظيفة هذه المكونات؟ وكيف يخزن جهاز طاقة دون تفاعل كيميائي كالبطارية؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يعرض المكثفات ويطرح السؤال ومهام بداية الوحدة<br><span style=\"opacity:.85\">• الطالب: يقترحون أنها تخزن شحنة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالاكتشاف:<\/b> يشرح تركيب المكثف متوازي الألواح وكيفية شحنه وتعريف السعة ووحدتها<br><span style=\"opacity:.85\">• الطالب: يرسمون المكثف ويكتبون التعريف والوحدة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل ‎C = Q/V‎ بوحدات متنوعة (‎μF‎، ‎nF‎، ‎pF‎)<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج مع تحويل الوحدات<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>عرّف سعة المكثف.<\/td><td>الشحنة المخزنة على أحد اللوحين لكل وحدة فرق جهد بين اللوحين.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الشحنة على مكثف ‎470 μF‎ مشحون إلى ‎12 V‎.<\/td><td>‎Q = 470 × 10⁻⁶ × 12 = 5.6 × 10⁻³ C‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا تكون الشحنة الكلية على المكثف المشحون صفرًا؟<\/td><td>لأن اللوحين يحملان شحنتين متساويتين ومتعاكستين (‎+Q‎ وـ‎Q‎).<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما وحدة السعة؟<\/td><td>الفاراد ‎(F) = C/V‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب فرق الجهد عبر مكثف ‎2.0 μF‎ يحمل ‎6.0 × 10⁻⁵ C‎.<\/td><td>‎V = 30 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا يُعد الفاراد وحدة كبيرة جدًا عمليًا؟<\/td><td>لأن مكثفًا سعته ‎1 F‎ عند جهد صغير يخزن شحنة كبيرة جدًا، والمكثفات الشائعة سعتها ميكروفاراد أو أقل.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-1 وحل مسائل ‎C = Q/V‎<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن المكثفات في الأجهزة الإلكترونية المنزلية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15<\/p>"]}, {"axis": "العلاقة بين الشحنة وفرق الجهد ونشاط 4-1", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "التعرف على المكثفات"], ["الحصة", "2 من 2"], ["محور الحصة", "العلاقة بين الشحنة وفرق الجهد ونشاط 4-1"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 4-1 + كتاب التجارب ص 110"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: الشحنة الكهربائية وفرق الجهد الكهربائي والسعة ص 110"]], "t": ["1. يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا\n2. يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎\nمخرج تعليمي آخر: يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: مكثف، مصدر تيار ثابت أو بيانات نموذجية، فولتميتر، ساعة إيقاف، كتاب التجارب العملية والأنشطة", "الشحن بتيار ثابت، ‎Q = It‎، تمثيل ‎Q‎ مقابل ‎V‎، الخط المستقيم المار بالأصل، الميل = ‎C‎.", "يسأل المعلم: «لو شحنّا مكثفًا بتيار ثابت، كيف يتغير فرق الجهد بين طرفيه مع الزمن؟» ويطلب رسمًا تنبؤيًا.", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يرسمون تنبؤًا خطيًا\n\n2. 15 دقيقة — الاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف: ينفذ «العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه» بتيار ثابت أو بيانات نموذجية\n• الطالب: يحسبون ‎Q = It‎ ويرسمون ‎Q‎ مقابل ‎V‎ ويحسبون الميل\n\n3. 12 دقيقة — التعلم التعاوني: يوجه حل نشاط 4-1 (ص 110)\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يختم بمسابقة المجموعات على السعة\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: كيف تُحسب الشحنة عند الشحن بتيار ثابت؟\n   الإجابة النموذجية: ‎Q = It‎.\n2) (مستوى التطبيق) السؤال: ماذا يمثل ميل خط ‎Q‎ مقابل ‎V‎؟\n   الإجابة النموذجية: سعة المكثف ‎C‎.\n3) (مستوى الاستدلال) السؤال: شُحن مكثف بتيار ‎20 μA‎ مدة ‎50 s‎ فأصبح فرق الجهد ‎5.0 V‎. احسب ‎C‎.\n   الإجابة النموذجية: ‎Q = 1.0 × 10⁻³ C‎؛ ‎C = 2.0 × 10⁻⁴ F = 200 μF‎.", "1) (مستوى المعرفة) السؤال: ما شكل تمثيل ‎Q‎ مقابل ‎V‎ لمكثف؟\n   الإجابة النموذجية: خط مستقيم يمر بالأصل.\n2) (مستوى التطبيق) السؤال: ماذا يعني مرور الخط بالأصل؟\n   الإجابة النموذجية: أن ‎Q‎ تتناسب طرديًا مع ‎V‎.\n3) (مستوى الاستدلال) السؤال: اقترح سببًا لانحراف القراءات عن الخط المستقيم عند الجهود العالية في التجربة.\n   الإجابة النموذجية: تسرب الشحنة عبر العازل أو صعوبة الحفاظ على تيار ثابت تمامًا.", "إرشاد للطالب: إكمال نشاط 4-1 ص 110 ورسم ‎Q‎ مقابل ‎V‎\nإرشاد لولي الأمر: متابعة الابن في حساب الميل من الرسم بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15"], "h": ["<ol class=\"ol\"><li>يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا<\/li><li>يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: مكثف، مصدر تيار ثابت أو بيانات نموذجية، فولتميتر، ساعة إيقاف، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الشحن بتيار ثابت، ‎Q = It‎، تمثيل ‎Q‎ مقابل ‎V‎، الخط المستقيم المار بالأصل، الميل = ‎C‎.<\/p>", "<p>يسأل المعلم: «لو شحنّا مكثفًا بتيار ثابت، كيف يتغير فرق الجهد بين طرفيه مع الزمن؟» ويطلب رسمًا تنبؤيًا.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يرسمون تنبؤًا خطيًا<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — الاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف:<\/b> ينفذ «العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه» بتيار ثابت أو بيانات نموذجية<br><span style=\"opacity:.85\">• الطالب: يحسبون ‎Q = It‎ ويرسمون ‎Q‎ مقابل ‎V‎ ويحسبون الميل<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يوجه حل نشاط 4-1 (ص 110)<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات على السعة<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>كيف تُحسب الشحنة عند الشحن بتيار ثابت؟<\/td><td>‎Q = It‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ماذا يمثل ميل خط ‎Q‎ مقابل ‎V‎؟<\/td><td>سعة المكثف ‎C‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>شُحن مكثف بتيار ‎20 μA‎ مدة ‎50 s‎ فأصبح فرق الجهد ‎5.0 V‎. احسب ‎C‎.<\/td><td>‎Q = 1.0 × 10⁻³ C‎؛ ‎C = 2.0 × 10⁻⁴ F = 200 μF‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما شكل تمثيل ‎Q‎ مقابل ‎V‎ لمكثف؟<\/td><td>خط مستقيم يمر بالأصل.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ماذا يعني مرور الخط بالأصل؟<\/td><td>أن ‎Q‎ تتناسب طرديًا مع ‎V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>اقترح سببًا لانحراف القراءات عن الخط المستقيم عند الجهود العالية في التجربة.<\/td><td>تسرب الشحنة عبر العازل أو صعوبة الحفاظ على تيار ثابت تمامًا.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-1 ص 110 ورسم ‎Q‎ مقابل ‎V‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حساب الميل من الرسم بدقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=15<\/p>"]}]}, {"title": "الطاقة المخزنة في مكثف", "sb": "الموضوع 4-2 (الأسئلة 1–10)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "الطاقة من المساحة تحت منحنى فرق الجهد–الشحنة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "1 من 3"], ["محور الحصة", "الطاقة من المساحة تحت منحنى فرق الجهد–الشحنة"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)\n2. يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎\nمخرج تعليمي آخر: يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكثف كبير السعة ومصباح صغير للعرض", "الطاقة المخزنة ‎W‎، المساحة تحت منحنى ‎V–Q‎، المثلث، ‎W = ½QV‎، الشغل المبذول في الشحن.", "يشحن المعلم مكثفًا كبيرًا ثم يفرغه عبر مصباح صغير يومض، ويسأل: «من أين جاءت طاقة الوميض؟ وكيف نحسبها؟»", "1. 5 دقائق — التعلم بالاكتشاف: ينفذ العرض ويطرح السؤال\n• الطالب: يقترحون أنها طاقة مخزنة في المكثف\n\n2. 13 دقيقة — التعلم بالاكتشاف: ينفذ «الطاقة المخزنة في مكثف مشحون» ويشتق ‎W = ½QV‎ من المساحة تحت منحنى ‎V–Q‎\n• الطالب: يرسمون المنحنى ويحسبون مساحة المثلث\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل حساب الطاقة من تمثيلات بيانية\n• الطالب: يحسبون الطاقة من المساحات في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: لماذا تُحسب الطاقة من المساحة تحت منحنى ‎V–Q‎؟\n   الإجابة النموذجية: لأن الشغل لنقل شحنة صغيرة ‎ΔQ‎ يساوي ‎VΔQ‎، ومجموع هذه الشرائح يساوي المساحة.\n2) (مستوى التطبيق) السؤال: احسب الطاقة المخزنة إذا كانت ‎Q = 4.0 mC‎ عند ‎V = 6.0 V‎.\n   الإجابة النموذجية: ‎W = ½ × 4.0 × 10⁻³ × 6.0 = 0.012 J‎.\n3) (مستوى الاستدلال) السؤال: لماذا لا تساوي الطاقة ‎QV‎؟\n   الإجابة النموذجية: لأن فرق الجهد يزداد تدريجيًا من صفر إلى ‎V‎ أثناء الشحن، فالمتوسط ½‎V‎.", "1) (مستوى المعرفة) السؤال: ما الشكل الهندسي تحت منحنى ‎V–Q‎ لمكثف؟\n   الإجابة النموذجية: مثلث قائم.\n2) (مستوى التطبيق) السؤال: إذا تضاعف فرق الجهد لمكثف ما، فكيف تتغير الطاقة؟\n   الإجابة النموذجية: تصبح أربعة أضعاف (لأن ‎Q‎ تتضاعف أيضًا).\n3) (مستوى الاستدلال) السؤال: لماذا يبذل المصدر شغلًا ‎QV‎ بينما يخزن المكثف ½‎QV‎ فقط؟\n   الإجابة النموذجية: يتحول النصف الآخر إلى طاقة حرارية في مقاومات الدائرة أثناء الشحن.", "إرشاد للطالب: مراجعة الموضوع 4-2 ورسم منحنى ‎V–Q‎ وحساب المساحة\nإرشاد لولي الأمر: الحديث مع الابن عن وميض الكاميرا بوصفه تطبيقًا للمكثفات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16"], "h": ["<ol class=\"ol\"><li>يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)<\/li><li>يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: مكثف كبير السعة ومصباح صغير للعرض<\/span><\/div>", "<p>الطاقة المخزنة ‎W‎، المساحة تحت منحنى ‎V–Q‎، المثلث، ‎W = ½QV‎، الشغل المبذول في الشحن.<\/p>", "<p>يشحن المعلم مكثفًا كبيرًا ثم يفرغه عبر مصباح صغير يومض، ويسأل: «من أين جاءت طاقة الوميض؟ وكيف نحسبها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-botto   الإجابة النموذجية: ‎W = ½ × 470 × 10⁻⁶ × 144 = 0.034 J‎.\n2) (مستوى التطبيق) السؤال: احسب الطاقة في مكثف ‎2.0 μF‎ يحمل ‎4.0 × 10⁻⁴ C‎.\n   الإجابة النموذجية: ‎W = ½Q²/C = ½ × 1.6 × 10⁻⁷ ÷ 2.0 × 10⁻⁶ = 0.040 J‎.\n3) (مستوى الاستدلال) السؤال: ما فرق الجهد اللازم لتخزين ‎1.0 J‎ في مكثف ‎200 μF‎؟\n   الإجابة النموذجية: ‎V = √(2W/C) = √(10⁴) = 100 V‎.", "1) (مستوى المعرفة) السؤال: اشتق ‎W = ½CV²‎ من ‎W = ½QV‎.\n   الإجابة النموذجية: بالتعويض ‎Q = CV: W = ½(CV)V = ½CV²‎.\n2) (مستوى التطبيق) السؤال: أي صيغة تستخدم إذا عُلمت ‎C‎ و‎V‎ فقط؟\n   الإجابة النموذجية: ‎W = ½CV²‎.\n3) (مستوى الاستدلال) السؤال: مكثفان: الأول ‎100 μF‎ عند ‎20 V‎، والثاني ‎400 μF‎ عند ‎10 V‎. أيهما يخزن طاقة أكبر؟\n   الإجابة النموذجية: الأول: ‎0.020 J‎؛ الثاني: ‎0.020 J‎؛ متساويان.", "إرشاد للطالب: حل خمس مسائل على معادلات الطاقة\nإرشاد لولي الأمر: متابعة الابن في اختيار المعادلة المناسبة للمعطيات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=16"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة<\/li><li>يختار المعادلة المناسبة بحسب المعطيات<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يختار المعادلة المناسبة بحسب المعطيات<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة ح
