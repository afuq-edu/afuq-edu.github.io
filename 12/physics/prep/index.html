° = 0.30 Wb‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة تعريفات الفيض وحل مسائل Φ و‎NΦ‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين كثافة الفيض والفيض<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25<\/p>"]}, {"axis": "نشاط 5-3 والأسئلة 13–21 في الفيض والحث", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "الحث الكهرومغناطيسي"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 5-3 والأسئلة 13–21 في الفيض والحث"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-5 + كتاب التجارب ص 141"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي ص 141"]], "t": ["1. يحل نشاط 5-3 «الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي»\n2. يحل الأسئلة 13–21 في كتاب الطالب\nمخرج تعليمي آخر: يحسب التغير في الفيض الكلي عند تدوير ملف أو إخراجه من المجال", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "التغير في الفيض ‎Δ(NΦ)‎، تدوير الملف ‎90°‎ و‎180°‎، إخراج الملف من المجال، مراجعة المفاهيم.", "يسأل المعلم: «ملف في مجال انقلب نصف دورة ‎(180°)‎؛ هل تغير الفيض عبره صفر لأنه عاد إلى الوضع نفسه؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يناقشون انعكاس اتجاه الفيض بالنسبة للملف\n\n2. 15 دقيقة — التعلم المبني على حل المشكلات: يوجه حل نشاط 5-3 (ص 141)\n• الطالب: يحلون فرديًا ثم يقارنون\n\n3. 12 دقيقة — التعلم التعاوني: يوجه حل الأسئلة 13–21 ومسائل التغير في الفيض\n• الطالب: يحلون في مجموعات ويعرضون\n\n4. 8 دقائق: يختم بمسابقة المجموعات على الحث والفيض\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: ما التغير في الفيض عند إخراج ملف ‎NΦ = 0.80 Wb‎ كليًا من المجال؟\n   الإجابة النموذجية: ‎0.80 Wb‎.\n2) (مستوى التطبيق) السؤال: ما التغير في الفيض عند تدوير الملف ‎90°‎ من وضع التعامد؟\n   الإجابة النموذجية: من 0.80 إلى صفر، أي ‎0.80 Wb‎.\n3) (مستوى الاستدلال) السؤال: ما التغير عند تدويره ‎180°‎؟\n   الإجابة النموذجية: من +0.80 إلى −0.80، أي ‎1.6 Wb‎.", "1) (مستوى المعرفة) السؤال: هل يكون التغير في الفيض صفرًا عند تدوير الملف ‎360°‎؟\n   الإجابة النموذجية: نعم، لأنه يعود إلى الوضع الأصلي نفسه.\n2) (مستوى التطبيق) السؤال: ما الكمية التي يعتمد عليها مقدار القوة الدافعة المستحثة؟\n   الإجابة النموذجية: معدل تغير الفيض الكلي.\n3) (مستوى الاستدلال) السؤال: ملف 50 لفة مساحته ‎0.040 m²‎ عمودي على ‎0.20 T‎ قُلب ‎180°‎. احسب التغير في الفيض الكلي.\n   الإجابة النموذجية: ‎NΦ = 0.40 Wb‎؛ التغير = ‎0.80 Wb‎.", "إرشاد للطالب: إكمال نشاط 5-3 ص 141 والأسئلة 13–21\nإرشاد لولي الأمر: متابعة الابن في حساب التغير في الفيض بإشارته\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25"], "h": ["<ol class=\"ol\"><li>يحل نشاط 5-3 «الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي»<\/li><li>يحل الأسئلة 13–21 في كتاب الطالب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب التغير في الفيض الكلي عند تدوير ملف أو إخراجه من المجال<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 5-3 «الفيض المغناطيسي وكثافة الفيض المغناطيسي والفيض المغناطيسي الكلي»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل الأسئلة 13–21 في كتاب الطالب<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب التغير في الفيض الكلي عند تدوير ملف أو إخراجه من المجال<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>التغير في الفيض ‎Δ(NΦ)‎، تدوير الملف ‎90°‎ و‎180°‎، إخراج الملف من المجال، مراجعة المفاهيم.<\/p>", "<p>يسأل المعلم: «ملف في مجال انقلب نصف دورة ‎(180°)‎؛ هل تغير الفيض عبره صفر لأنه عاد إلى الوضع نفسه؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يناقشون انعكاس اتجاه الفيض بالنسبة للملف<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — التعلم المبني على حل المشكلات:<\/b> يوجه حل نشاط 5-3 (ص 141)<br><span style=\"opacity:.85\">• الطالب: يحلون فرديًا ثم يقارنون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يوجه حل الأسئلة 13–21 ومسائل التغير في الفيض<br><span style=\"opacity:.85\">• الطالب: يحلون في مجموعات ويعرضون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات على الحث والفيض<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما التغير في الفيض عند إخراج ملف ‎NΦ = 0.80 Wb‎ كليًا من المجال؟<\/td><td>‎0.80 Wb‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما التغير في الفيض عند تدوير الملف ‎90°‎ من وضع التعامد؟<\/td><td>من 0.80 إلى صفر، أي ‎0.80 Wb‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما التغير عند تدويره ‎180°‎؟<\/td><td>من +0.80 إلى −0.80، أي ‎1.6 Wb‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>هل يكون التغير في الفيض صفرًا عند تدوير الملف ‎360°‎؟<\/td><td>نعم، لأنه يعود إلى الوضع الأصلي نفسه.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما الكمية التي يعتمد عليها مقدار القوة الدافعة المستحثة؟<\/td><td>معدل تغير الفيض الكلي.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ملف 50 لفة مساحته ‎0.040 m²‎ عمودي على ‎0.20 T‎ قُلب ‎180°‎. احسب التغير في الفيض الكلي.<\/td><td>‎NΦ = 0.40 Wb‎؛ التغير = ‎0.80 Wb‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 5-3 ص 141 والأسئلة 13–21<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حساب التغير في الفيض بإشارته<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=25<\/p>"]}]}, {"title": "قانون فاراداي للحث الكهرومغناطيسي", "sb": "الموضوع 5-6 (الأسئلة 22–32)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "نص قانون فاراداي ومعادلته", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون فاراداي للحث الكهرومغناطيسي"], ["الحصة", "1 من 2"], ["محور الحصة", "نص قانون فاراداي ومعادلته"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-6 (الأسئلة 22–32)"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-4: قانون فاراداي للحث الكهرومغناطيسي وقانون لنز ص 144"]], "t": ["1. يذكر نص قانون فاراداي للحث الكهرومغناطيسي\n2. يستخدم المعادلة ε = ‎−Δ(NΦ)/Δt‎ لحساب مقدار القوة الدافعة المستحثة\nمخرج تعليمي آخر: يحسب القوة الدافعة المستحثة من تغير كثافة الفيض مع الزمن في ملف ثابت", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "قانون فاراداي، معدل تغير الفيض الكلي، ε = ‎−Δ(NΦ)/Δt‎، الإشارة السالبة (لنز)، تغير ‎B‎ مع ثبات المساحة.", "يطلب المعلم من الطلبة قراءة الموضوع 5-6 «قانون فاراداي للحث الكهرومغناطيسي» في كتاب الطالب ثم يسأل: «أي العوامل التي وجدتموها تجريبيًا في الدرس السابق تجمعها معادلة فاراداي؟»", "1. 5 دقائق — التعلم بالاكتشاف: يوجه القراءة ويطرح السؤال\n• الطالب: يربطون العوامل التجريبية بالمعادلة\n\n2. 13 دقيقة — التعلم بالاكتشاف: ينفذ «قانون فاراداي للحث الكهرومغناطيسي»: النص والمعادلة ومعنى الإشارة السالبة\n• الطالب: يكتبون النص ويحلون مثالًا\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل متدرجة بينها السؤال المفصلي (‎0.15 m²‎ و‎3.0 T/s‎)\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اذكر نص قانون فاراداي.\n   الإجابة النموذجية: مقدار القوة الدافعة الكهربائية المستحثة يتناسب طرديًا مع معدل تغير الفيض المغناطيسي الكلي.\n2) (مستوى التطبيق) السؤال: احسب القوة الدافعة المستحثة إذا تغير الفيض الكلي بمقدار ‎0.80 Wb‎ خلال ‎0.20 s‎.\n   الإجابة النموذجية: ε = ‎4.0 V‎.\n3) (مستوى الاستدلال) السؤال: يتغير مجال بمعدل ‎3.0 T/s‎ عبر حلقة واحدة مساحتها ‎0.15 m²‎. احسب القوة الدافعة المستحثة.\n   الإجابة النموذجية: ε = ‎0.15 × 3.0 = 0.45 V‎.", "1) (مستوى المعرفة) السؤال: إلى أي قانون تشير الإشارة السالبة في معادلة فاراداي؟\n   الإجابة النموذجية: قانون لنز.\n2) (مستوى التطبيق) السؤال: ماذا يحدث للقوة الدافعة إذا حدث التغير نفسه في نصف الزمن؟\n   الإجابة النموذجية: تتضاعف.\n3) (مستوى الاستدلال) السؤال: ملف 500 لفة مساحته ‎4.0 × 10⁻³ m²‎ تغير المجال العمودي عليه من ‎0.10 T‎ إلى ‎0.50 T‎ خلال ‎0.020 s‎. احسب ε.\n   الإجابة النموذجية: ‎Δ(NΦ) = 500 × 4.0 × 10⁻³ × 0.40 = 0.80 Wb‎؛ ε = ‎40 V‎.", "إرشاد للطالب: مراجعة الموضوع 5-6 وحل مسائل قانون فاراداي\nإرشاد لولي الأمر: سؤال الابن عن العلاقة بين سرعة التغير ومقدار القوة الدافعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=26"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون فاراداي للحث الكهرومغناطيسي<\/li><li>يستخدم المعادلة ε = ‎−Δ(NΦ)/Δt‎ لحساب مقدار القوة الدافعة المستحثة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب القوة الدافعة المستحثة من تغير كثافة الفيض مع الزمن في ملف ثابت<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر نص قانون فاراداي للحث الكهرومغناطيسي<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم المعادلة ε = ‎−Δ(NΦ)/Δt‎ لحساب مقدار القوة الدافعة المستحثة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب القوة الدافعة المستحثة من تغير كثافة الفيض مع الزمن في ملف ثابت<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>قانون فاراداي، معدل تغير الفيض الكلي، ε = ‎−Δ(NΦ)/Δt‎، الإشارة السالبة (لنز)، تغير ‎B‎ مع ثبات المساحة.<\/p>", "<p>يطلب المعلم من الطلبة قراءة الموضوع 5-6 «قانون فاراداي للحث الكهرومغناطيسي» في كتاب الطالب ثم يسأل: «أي العوامل التي وجدتموها تجريبيًا في الدرس السابق تجمعها معادلة فاراداي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يوجه القراءة ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يربطون العوامل التجريبية بالمعادلة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالاكتشاف:<\/b> ينفذ «قانون فاراداي للحث الكهرومغناطيسي»: النص والمعادلة ومعنى الإشارة السالبة<br><span style=\"opacity:.85\">• الطالب: يكتبون النص ويحلون مثالًا<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل متدرجة بينها السؤال المفصلي (‎0.15 m²‎ و‎3.0 T/s‎)<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اذكر نص قانون فاراداي.<\/td><td>مقدار القوة الدافعة الكهربائية المستحثة يتناسب طرديًا مع معدل تغير الفيض المغناطيسي الكلي.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب القوة الدافعة المستحثة إذا تغير الفيض الكلي بمقدار ‎0.80 Wb‎ خلال ‎0.20 s‎.<\/td><td>ε = ‎4.0 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>يتغير مجال بمعدل ‎3.0 T/s‎ عبر حلقة واحدة مساحتها ‎0.15 m²‎. احسب القوة الدافعة المستحثة.<\/td><td>ε = ‎0.15 × 3.0 = 0.45 V‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>إلى أي قانون تشير الإشارة السالبة في معادلة فاراداي؟<\/td><td>قانون لنز.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ماذا يحدث للقوة الدافعة إذا حدث التغير نفسه في نصف الزمن؟<\/td><td>تتضاعف.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ملف 500 لفة مساحته ‎4.0 × 10⁻³ m²‎ تغير المجال العمودي عليه من ‎0.10 T‎ إلى ‎0.50 T‎ خلال ‎0.020 s‎. احسب ε.<\/td><td>‎Δ(NΦ) = 500 × 4.0 × 10⁻³ × 0.40 = 0.80 Wb‎؛ ε = ‎40 V‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 5-6 وحل مسائل قانون فاراداي<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن العلاقة بين سرعة التغير ومقدار القوة الدافعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=26<\/p>"]}, {"axis": "القوة الدافعة المستحثة في سلك متحرك ونشاط 5-4", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "قانون فاراداي للحث الكهرومغناطيسي"], ["الحصة", "2 من 2"], ["محور الحصة", "القوة الدافعة المستحثة في سلك متحرك ونشاط 5-4"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-6 + كتاب التجارب ص 144"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-4: قانون فاراداي للحث الكهرومغناطيسي وقانون لنز ص 144"]], "t": ["1. يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي\n2. يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»\nمخرج تعليمي آخر: يشتق ε = ‎BLv‎ من معدل المساحة التي يقطعها السلك", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "السلك المتحرك، المساحة المقطوعة، ε = ‎BLv‎، قطع خطوط الفيض، الطائرات وأجنحتها في المجال الأرضي.", "يسأل المعلم: «جناحا طائرة فلزيان يتحركان بسرعة كبيرة في المجال المغناطيسي الأرضي؛ هل تتولد قوة دافعة بين طرفيهما؟»", "1. 5 دقائق — التعلم التعاوني: يطرح السؤال\n• الطالب: يتوقعون حدوث حث بسبب قطع خطوط المجال\n\n2. 13 دقيقة — التعلم بالنمذجة: يشتق ε = ‎BLv‎ من ‎Δ(Φ)/Δt = B × (L × vΔt)/Δt‎ ويحل مثالًا\n• الطالب: يتبعون الاشتقاق ويحسبون\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل نشاط 5-4 (ص 144)\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اشتق ε = ‎BLv‎.\n   الإجابة النموذجية: في زمن ‎Δt‎ يقطع السلك مساحة ‎LvΔt‎، فيتغير الفيض ‎BLvΔt‎، وε = ‎BLvΔt/Δt = BLv‎.\n2) (مستوى التطبيق) السؤال: احسب ε لسلك طوله ‎0.20 m‎ يتحرك بسرعة ‎3.0 m/s‎ عموديًا على مجال ‎0.50 T‎.\n   الإجابة النموذجية: ε = ‎0.30 V‎.\n3) (مستوى الاستدلال) السؤال: ماذا يحدث لـ ε إذا تحرك السلك موازيًا للمجال؟\n   الإجابة النموذجية: تنعدم لأنه لا يقطع خطوط الفيض.", "1) (مستوى المعرفة) السؤال: اكتب معادلة القوة الدافعة في سلك متحرك عموديًا على المجال.\n   الإجابة النموذجية: ε = ‎BLv‎\n2) (مستوى التطبيق) السؤال: كيف تتغير ε إذا تضاعفت سرعة السلك؟\n   الإجابة النموذجية: تتضاعف.\n3) (مستوى الاستدلال) السؤال: جناحا طائرة طولهما ‎30 m‎ تطير بسرعة ‎250 m/s‎، والمركبة الرأسية للمجال الأرضي ‎4.0 × 10⁻⁵ T‎. احسب ε.\n   الإجابة النموذجية: ε = ‎4.0 × 10⁻⁵ × 30 × 250 = 0.30 V‎.", "إرشاد للطالب: إكمال نشاط 5-4 ص 144 وحل مسائل ε = ‎BLv‎\nإرشاد لولي الأمر: الحديث مع الابن عن الحث في أجنحة الطائرات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=26"], "h": ["<ol class=\"ol\"><li>يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي<\/li><li>يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يشتق ε = ‎BLv‎ من معدل المساحة التي يقطعها السلك<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحسب القوة الدافعة المستحثة في سلك مستقيم يتحرك عموديًا على مجال باستخدام ε = ‎BLv‎ المشتقة من قانون فاراداي<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل نشاط 5-4 «قانون فاراداي للحث الكهرومغناطيسي وقانون لنز»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يشتق ε = ‎BLv‎ من معدل المساحة التي يقطعها السلك<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>السلك المتحرك، المساحة المقطوعة، ε = ‎BLv‎، قطع خطوط الفيض، الطائرات وأجنحتها في المجال الأرضي.<\/p>", "<p>يسأل المعلم: «جناحا طائرة فلزيان يتحركان بسرعة كبيرة في المجال المغناطيسي الأرضي؛ هل تتولد قوة دافعة بين طرفيهما؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون حدوث حث بسبب قطع خطوط المجال<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالنمذجة:<\/b> يشتق ε = ‎BLv‎ من ‎Δ(Φ)/Δt = B × (L × vΔt)/Δt‎ ويحل مثالًا<br><span style=\"opacity:.85\">• الطالب: يتبعون الاشتقاق ويحسبون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يوجه حل نشاط 5-4 (ص 144)<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اشتق ε = ‎BLv‎.<\/td><td>في زمن ‎Δt‎ يقطع السلك مساحة ‎LvΔt‎، فيتغير الفيض ‎BLvΔt‎، وε = ‎BLvΔt/Δt = BLv‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب ε لسلك طوله ‎0.20 m‎ يتحرك بسرعة ‎3.0 m/s‎ عموديًا على مجال ‎0.50 T‎.<\/td><td>ε = ‎0.30 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ماذا يحدث لـ ε إذا تحرك السلك موازيًا للمجال؟<\/td><td>تنعدم لأنه لا يقطع خطوط الفيض.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب معادلة القوة الدافعة في سلك متحرك عموديًا على المجال.<\/td><td>ε = ‎BLv‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>كيف تتغير ε إذا تضاعفت سرعة السلك؟<\/td><td>تتضاعف.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>جناحا طائرة طولهما ‎30 m‎ تطير بسرعة ‎250 m/s‎، والمركبة الرأسية للمجال الأرضي ‎4.0 × 10⁻⁵ T‎. احسب ε.<\/td><td>ε = ‎4.0 × 10⁻⁵ × 30 × 250 = 0.30 V‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 5-4 ص 144 وحل مسائل ε = ‎BLv‎<\/p><p><b>إرشاد لولي الأمر:  بحيث يقاوم التغير الذي سببه.\n2) (مستوى التطبيق) السؤال: عند إدخال القطب الشمالي لمغناطيس في ملف، ما قطبية طرف الملف المواجه له؟\n   الإجابة النموذجية: شمالي، ليتنافر معه ويقاوم الإدخال.\n3) (مستوى الاستدلال) السؤال: لماذا يُعد قانون لنز نتيجة لحفظ الطاقة؟\n   الإجابة النموذجية: لأنه لو ساعد التيار المستحث التغير لتولدت طاقة كهربائية دون بذل شغل، وهذا يخالف حفظ الطاقة.", "1) (مستوى المعرفة) السؤال: ما الذي يقاومه التيار المستحث؟\n   الإجابة النموذجية: التغير في الفيض الذي سببه.\n2) (مستوى التطبيق) السؤال: عند إخراج القطب الشمالي من الملف، ما قطبية الطرف المواجه؟\n   الإجابة النموذجية: جنوبي، ليجذب المغناطيس ويقاوم الإخراج.\n3) (مستوى الاستدلال) السؤال: لماذا يسقط المغناطيس ببطء في الأنبوب النحاسي؟\n   الإجابة النموذجية: تتولد فيه تيارات مستحثة تنتج مجالات تقاوم حركة المغناطيس وفق قانون لنز، فتتحول طاقته الحركية إلى حرارة.", "إرشاد للطالب: مراجعة الموضوع 5-7 وحالات تحديد اتجاه التيار المستحث\nإرشاد لولي الأمر: سؤال الابن عن تجربة المغناطيس الساقط في الأنبوب النحاسي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=27"], "h": ["<ol class=\"ol\"><li>يذكر نص قانون لنز ويحدد به اتجاه التيار المستحث<\/li><li>يشرح قانون لنز بوصفه نتيجة لقانون حفظ الطاقة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد قطبية طرف الملف المواجه للمغناطيس عند إدخاله وإخراجه<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر نص قانون لنز ويحدد به اتجاه التيار المستحث<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يشرح قانون لنز بوصفه نتيجة لقانون حفظ الطاقة<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحدد قطبية طرف الملف المواجه للمغناطيس عند إدخاله وإخراجه<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=  كتاب التجارب العملية والأنشطة", "قاعدة فليمنج لليد اليمنى (الإبهام: الحركة، السبابة: المجال، الوسطى: التيار المستحث)، المولد، التمييز بين اليدين.", "يسأل المعلم: «استخدمنا اليد اليسرى للمحرك؛ أي يد نستخدم للمولد؟ ولماذا يختلف الاثنان؟»", "1. 5 دقائق — التعلم التعاوني: يطرح السؤال\n• الطالب: يميزون بين تحويل الطاقة في المحرك والمولد\n\n2. 13 دقيقة — التعلم بالنمذجة: يشرح قاعدة فليمنج لليد اليمنى ويطبقها على سلك متحرك ويتحقق من اتساقها مع لنز\n• الطالب: يطبقون القاعدة ويحددون اتجاه القوة المعاكسة للحركة\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل نشاط 5-5 (ص 147)\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: ماذا يمثل كل إصبع في قاعدة فليمنج لليد اليمنى؟\n   الإجابة النموذجية: الإبهام: الحركة، السبابة: المجال، الوسطى: التيار المستحث.\n2) (مستوى التطبيق) السؤال: ما القاعدة المستخدمة للمولدات؟\n   الإجابة النموذجية: قاعدة فليمنج لليد اليمنى.\n3) (مستوى الاستدلال) السؤال: كيف تتسق القاعدة مع قانون لنز؟\n   الإجابة النموذجية: التيار المستحث الذي تحدده اليد اليمنى يولد قوة (باليد اليسرى) تعاكس اتجاه الحركة.", "1) (مستوى المعرفة) السؤال: ما الفرق بين استخدام اليد اليسرى واليمنى؟\n   الإجابة النموذجية: اليسرى للقوة على سلك يحمل تيارًا (المحرك)، واليمنى للتيار المستحث في سلك متحرك (المولد).\n2) (مستوى التطبيق) السؤال: إذا عُكس اتجاه الحركة، فماذا يحدث للتيار المستحث؟\n   الإجابة النموذجية: ينعكس اتجاهه.\n3) (مستوى الاستدلال) السؤال: سلك يتحرك إلى أعلى في مجال يتجه نحو الشمال؛ كيف تحدد اتجاه التيار المستحث؟\n   الإجابة النموذجية: بتوجيه الإبهام لأعلى والسبابة نحو الشمال، فيشير الإصبع الأوسط إلى اتجاه التيار المستحث.", "إرشاد للطالب: إكمال نشاط 5-5 ص 147 والتدرب على قاعدتي اليدين\nإرشاد لولي الأمر: متابعة الابن في التمييز بين قاعدتي اليد اليسرى واليمنى\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=27"], "h": ["<ol class=\"ol\"><li>يحلل التيار الكهربائي المستحث في سلك متحرك باستخدام قاعدة فليمنج لليد اليمنى<\/li><li>يحل نشاط 5-5 «المزيد حول قانون فاراداي»<\/li><\/ol ة من الحياة الواقعية للحث الكهرومغناطيسي والتخطيط لرفع حلقة فلزية", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "تطبيقات الحث الكهرومغناطيسي"], ["الحصة", "1 من 1"], ["محور الحصة", "أمثلة من الحياة الواقعية للحث الكهرومغناطيسي والتخطيط لرفع حلقة فلزية"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "الموضوع 5-8 (الأسئلة 22–32)"], ["دليل المعلم", "ص 154–160"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 5-2: التخطيط لرفع حلقة فلزية فوق ملف حامل لتيار كهربائي ص 157"]], "t": ["1. يشرح أمثلة من الحياة الواقعية للحث الكهرومغناطيسي (المولد الكهربائي، الطهي بالحث، كاشف الفلزات)\n2. يخطط استقصاءً لرفع حلقة فلزية فوق ملف حامل لتيار متردد (الاستقصاء العملي 5-2)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الخامسة ويحل أسئلة مختارة من نهاية الوحدة", "المخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج الآخر: تقييم", "- التعلم المبني على المشاريع\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: ملف بقلب حديدي وحلقة ألومنيوم (إن توفرت)، كتاب التجارب العملية والأنشطة", "المولد الكهربائي، الطهي بالحث، كاشف الفلزات، الحلقة القافزة، التيار المتردد، التخطيط للاستقصاء.", "يعرض المعلم مقطعًا قصيرًا لحلقة ألومنيوم تقفز فوق ملف عند تشغيل التيار، ويسأل: «لماذا قفزت الحلقة؟ وما علاقة ذلك بقانوني فاراداي ولنز؟»", "1. 4 دقائق — التعلم المبني على المشاريع: يعرض المقطع ويطرح السؤال\n• الطالب: يفسرون بتيار مستحث في الحلقة يقاوم التغير\n\n2. 14 دقيقة — التعلم المبني على المشاريع: ينفذ «أمثلة من الحياة الواقعية للحث الكهرومغناطيسي»: كل مجموعة تشرح مثالًا (المولد، الطهي بالحث، كاشف الفلزات)\n• الطالب: يعدون شرحًا قصيرًا ويعرضونه\n\n3. 14 دقيقة — التعلم المبني على اللعب: يوجه تخطيط الاستقصاء العملي 5-2 (ص 157): المتغيرات، الأجهزة، خطوات العمل، السلامة\n• الطالب: يكتبون خطة الاستقصاء ويرسمون مخطط الأجهزة\n\n4. 8 دقائق: يختم بمسابقة المجموعات لمراجعة الوحدة الخامسة وقائمة التقويم الذاتي\n• الطالب: يتنافسون ثم يقيّمون أنفسهم", "1) (مستوى المعرفة) السؤال: كيف يولد المولد الكهربائي قوة دافعة؟\n   الإجابة النموذجية: يدور ملف في مجال مغناطيسي فيتغير الفيض عبره باستمرار فتتولد قوة دافعة مستحثة.\n2) (مستوى التطبيق) السؤال: لماذا لا يسخن طباخ الحث إلا الأواني الفلزية؟\n   الإجابة النموذجية: لأن التيارات المستحثة تتولد في الفلز الموصل فتسخنه، ولا تتولد في الزجاج أو الخشب.\n3) (مستوى الاستدلال) السؤال: ما المتغير المستقل المناسب في استقصاء رفع الحلقة؟\n   الإجابة النموذجية: شدة التيار في الملف (أو عدد اللفات أو مادة الحلقة).", "1) (مستوى المعرفة) السؤال: لماذا يجب استخدام تيار متردد في الملف لرفع الحلقة باستمرار؟\n   الإجابة النموذجية: لأن التيار المتردد يغير الفيض باستمرار فتتولد قوة دافعة مستحثة مستمرة في الحلقة.\n2) (مستوى التطبيق) السؤال: اذكر احتياطًا للسلامة في الاستقصاء 5-2.\n   الإجابة النموذجية: الحذر من سخونة الحلقة والملف، وعدم لمس الأسلاك المكشوفة، وفصل المصدر بعد كل قراءة.\n3) (مستوى الاستدلال) السؤال: قيّم تعلمك في الوحدة الخامسة واقترح خطة لمراجعة موضوع تحتاج إليه.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية للمراجعة قبل الاختبار.", "إرشاد للطالب: كتابة خطة الاستقصاء 5-2 وحل أسئلة مختارة من نهاية الوحدة الخامسة (22–32) وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=28"], "h": ["<ol class=\"ol\"><li>يشرح أمثلة من الحياة الواقعية للحث الكهرومغناطيسي (المولد الكهربائي، الطهي بالحث، كاشف الفلزات)<\/li><li>يخطط استقصاءً لرفع حلقة فلزية فوق ملف حامل لتيار متردد (الاستقصاء العملي 5-2)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الخامسة ويحل أسئلة مختارة من نهاية الوحدة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يشرح أمثلة من الحياة الواقعية للحث الكهرومغناطيسي (المولد الكهربائي، الطهي بالحث، كاشف الفلزات)<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يخطط استقصاءً لرفع حلقة فلزية فوق ملف حامل لتيار متردد (الاستقصاء العملي 5-2)<\/td><td class=\"lv\">إبداع<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقيّم تعلمه في الوحدة الخامسة ويحل أسئلة مختارة من نهاية الوحدة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على المشاريع<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: ملف بقلب حديدي وحلقة ألومنيوم (إن توفرت)، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>المولد الكهربائي، الطهي بالحث، كاشف الفلزات، الحلقة القافزة، التيار المتردد، التخطيط للاستقصاء.<\/p>", "<p>يعرض المعلم مقطعًا قصيرًا لحلقة ألومنيوم تقفز فوق ملف عند تشغيل التيار، ويسأل: «لماذا قفزت الحلقة؟ وما علاقة ذلك بقانوني فاراداي ولنز؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 4 دقائق — التعلم المبني على المشاريع:<\/b> يعرض المقطع ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يفسرون بتيار مستحث في الحلقة يقاوم التغير<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 14 دقيقة — التعلم المبني على المشاريع:<\/b> ينفذ «أمثلة من الحياة الواقعية للحث الكهرومغناطيسي»: كل مجموعة تشرح مثالًا (المولد، الطهي بالحث، كاشف الفلزات)<br><span style=\"opacity:.85\">• الطالب: يعدون شرحًا قصيرًا ويعرضونه<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم المبني على اللعب:<\/b> يوجه تخطيط الاستقصاء العملي 5-2 (ص 157): المتغيرات، الأجهزة، خطوات العمل، السلامة<br><span style=\"opacity:.85\">• الطالب: يكتبون خطة الاستقصاء ويرسمون مخطط الأجهزة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات لمراجعة الوحدة الخامسة وقائمة التقويم الذاتي<br><span style=\"opacity:.85\">• الطالب: يتنافسون ثم يقيّمون أنفسهم<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>كيف يولد المولد الكهربائي قوة دافعة؟<\/td><td>يدور ملف في مجال مغناطيسي فيتغير الفيض عبره باستمرار فتتولد قوة دافعة مستحثة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا لا يسخن طباخ الحث إلا الأواني الفلزية؟<\/td><td>لأن التيارات المستحثة تتولد في الفلز الموصل فتسخنه، ولا تتولد في الزجاج أو الخشب.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما المتغير المستقل المناسب في استقصاء رفع الحلقة؟<\/td><td>شدة التيار في الملف (أو عدد اللفات أو مادة الحلقة).<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا يجب استخدام تيار متردد في الملف لرفع الحلقة باستمرار؟<\/td><td>لأن التيار المتردد يغير الفيض باستمرار فتتولد قوة دافعة مستحثة مستمرة في الحلقة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>اذكر احتياطًا للسلامة في الاستقصاء 5-2.<\/td><td>الحذر من سخونة الحلقة والملف، وعدم لمس الأسلاك المكشوفة، وفصل المصدر بعد كل قراءة.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>قيّم تعلمك في الوحدة الخامسة واقترح خطة لمراجعة موضوع تحتاج إليه.<\/td><td>إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية للمراجعة قبل الاختبار.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> كتابة خطة الاستقصاء 5-2 وحل أسئلة مختارة من نهاية الوحدة الخامسة (22–32) وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=28<\/p>"]}]}]);
let st={m:'sep',l:0,p:0};
try{const s=JSON.parse(localStorage.getItem('noorcopy_'+document.title)||'null');if(s&&D[s.l])st=s;}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('noorcopy_'+document.title,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function buildSelect(){let h='',u='';D.forEach((L,i)=>{if(L.unit!==u){if(u)h+='</optgroup>';u=L.unit;h+=`<optgroup label="${esc(u)}">`}h+=`<option value="${i}">${esc(L.title)} (${L.periods.length} حصص)</option>`});h+='</optgroup>';$('les').innerHTML=h}
function render(){
 const L=D[st.l];if(st.p>=L.periods.length)st.p=0;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));
 $('status').textContent=st.m==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة ${st.p+1} من ${L.periods.length}`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم ${L.periods.length} حصص`;
 $('les').value=st.l;
 const tabs=$('tabs');
 if(st.m==='sep'){tabs.style.display='flex';tabs.innerHTML=L.periods.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}">الحصة ${p.n}: ${esc(p.axis)}</button>`).join('')}
 else tabs.style.display='none';
 let rows='';
 if(st.m==='sep'){const hi=L.periods[st.p].hi;rows=hi.map((r,k)=>`<div class="${k===4?'w':''}"><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')}
 else{const h0=L.periods[0].hi;rows=[h0[0],h0[1],h0[2]].map(r=>`<div><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')+
  `<div><b>كتاب الطالب:</b>${esc(L.sb)}</div><div><b>${h0[7][0]}:</b>${esc(h0[7][1])}</div><div><b>${h0[8][0]}:</b>${esc(h0[8][1])}</div>`+
  `<div class="w"><b>الحصص:</b><br>${L.periods.map(p=>`الحصة ${p.n}: ${esc(p.axis)} — ${esc(p.hi[5][1])}`).join('<br>')}</div>`}
 $('info').innerHTML=rows;
 $('cards').innerHTML=FIELDS.map((f,i)=>`<div class="card"><div class="ch"><div class="ct"><span class="num">${i+1}</span>${f}</div><button class="copy" data-f="${i}">نسخ</button></div><div class="cb" id="cb${i}">${fieldHtml(i)}</div></div>`).join('');
 save();
}
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#mode button');if(m){st.m=m.dataset.m;render();return}
 const tb=e.target.closest('#tabs button');if(tb){st.p=+tb.dataset.i;render();return}
 const c=e.target.closest('.copy');if(c){const i=+c.dataset.f,t=fieldText(i);let ok=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);ok=true}catch(err){}}
  if(!ok)ok=legacyCopy(t);
  if(ok)done(c);else fallback(i,t);}
});
$('les').addEventListener('change',e=>{st.l=+e.target.value;st.p=0;render()});
buildSelect();render();
</script>
