كل منهما.\n• الإجابة النموذجية: ‎V₁ = 14.4/2.0 = 7.2 V‎، ‎V₂ = 14.4/3.0 = 4.8 V‎.\n\n3. مستوى الاستدلال: لماذا يكون الجهد الأكبر عبر المكثف الأصغر سعة؟\n• الإجابة النموذجية: لأن الشحنة نفسها و‎V = Q/C‎، فكلما صغرت ‎C‎ كبر ‎V‎.", "1. مستوى المعرفة: ما مجموع فرقي الجهد في المثال؟\n• الإجابة النموذجية: ‎12 V (‎يساوي جهد المصدر).\n\n2. مستوى التطبيق: احسب الطاقة في المكثف ‎2.0 μF‎ من المثال.\n• الإجابة النموذجية: ‎W = ½ × 2.0 × 10⁻⁶ × 7.2² = 5.2 × 10⁻⁵ J‎.\n\n3. مستوى الاستدلال: أي المكثفين في المثال يخزن طاقة أكبر؟ ولماذا؟\n• الإجابة النموذجية: المكثف ‎2.0 μF‎، لأن ‎W = Q²/2C‎ والشحنة نفسها فالأصغر سعة يخزن طاقة أكبر.", "إرشاد للطالب: حل مسائل التوالي وكتابة خطوات الحل\nإرشاد لولي الأمر: سؤال الابن عن العلاقة بين السعة وفرق الجهد في التوالي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=18"], "h": ["<ol class=\"ol\"><li>يحسب الشحنة المشتركة وفرق الجهد عبر كل مكثف في مجموعة على التوالي<\/li><li>يفسر لماذا يكون فرق الجهد الأكبر عبر المكثف الأصغر سعة في التوالي<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب الطاقة المخزنة في كل مكثف على التوالي ويقارنها<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب الشحنة المشتركة وفرق الجهد عبر كل مكثف في مجموعة على التوالي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر لماذا يكون فرق الجهد الأكبر عبر المكثف الأصغر سعة في التوالي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب الطاقة المخزنة في كل مكثف على التوالي ويقارنها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الشحنة المشتركة ‎Q = CV‎، ‎V₁ = Q/C₁‎، التوزيع العكسي للجهد، الطاقة في التوالي.<\/p>", "<p>يسأل المعلم: «مكثفان ‎2 μF‎ و‎3 μF‎ على التوالي مع ‎12 V‎؛ أيهما سيكون عليه فرق جهد أكبر؟ خمّن قبل الحساب.»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يدونون تخميناتهم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل المعلم المثال: السعة المكافئة ثم ‎Q‎ ثم ‎V‎ لكل مكثف، والطلبة يتبعون الخطوات ويتحققون من التخمين (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل متدرجة لمجموعات على التوالي، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب الشحنة المشتركة لمكثفين ‎2.0 μF‎ و‎3.0 μF‎ على التوالي مع ‎12 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎C = 1.2 μF‎؛ ‎Q = 14.4 μC‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب فرق الجهد عبر كل منهما.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V₁ = 14.4/2.0 = 7.2 V‎، ‎V₂ = 14.4/3.0 = 4.8 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون الجهد الأكبر عبر المكثف الأصغر سعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الشحنة نفسها و‎V = Q/C‎، فكلما صغرت ‎C‎ كبر ‎V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما مجموع فرقي الجهد في المثال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎12 V (‎يساوي جهد المصدر).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب الطاقة في المكثف ‎2.0 μF‎ من المثال.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎W = ½ × 2.0 × 10⁻⁶ × 7.2² = 5.2 × 10⁻⁵ J‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أي المكثفين في المثال يخزن طاقة أكبر؟ ولماذا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المكثف ‎2.0 μF‎، لأن ‎W = Q²/2C‎ والشحنة نفسها فالأصغر سعة يخزن طاقة أكبر.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل مسائل التوالي وكتابة خطوات الحل<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن العلاقة بين السعة وفرق الجهد في التوالي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=18<\/p>"]}]}, {"title": "شبكات المكثفات", "sb": "الموضوع 4-5 (الأسئلة 11–20)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "الشبكات المختلطة من المكثفات", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شبكات المكثفات"], ["الحصة", "1 من 3"], ["محور الحصة", "الشبكات المختلطة من المكثفات"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوع 4-5 (الأسئلة 11–20)"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحسب السعة المكافئة لشبكات مختلطة من المكثفات على التوالي والتوازي\n2. يحسب الشحنة وفرق الجهد لكل مكثف في شبكة مختلطة\nمخرج تعليمي آخر: يصمم شبكة مكثفات تعطي سعة مطلوبة من مكثفات متماثلة", "1. تطبيق: يحسب السعة المكافئة لشبكات مختلطة من المكثفات على التوالي والتوازي\n2. تحليل: يحسب الشحنة وفرق الجهد لكل مكثف في شبكة مختلطة\n3. إبداع (مخرج آخر): يصمم شبكة مكثفات تعطي سعة مطلوبة من مكثفات متماثلة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الشبكة المختلطة، التبسيط التدريجي، المكثف المكافئ الجزئي، الشحنة وفرق الجهد في كل فرع.", "يرسم المعلم شبكة من ثلاثة مكثفات ويسأل: «من أين نبدأ التبسيط؟ من الداخل أم من الخارج؟»", "1. يعرض المعلم الشبكة ويطرح السؤال، والطلبة يقترحون البدء بأبسط مجموعة داخلية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يحل المعلم شبكة مختلطة خطوة بخطوة: ‎2 μF‎ و‎2 μF‎ على التوازي ‎(4 μF)‎ على التوالي مع ‎4 μF‎، والطلبة يتبعون الحل ويحسبون ‎C = 2.0 μF‎ (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم شبكات متدرجة وتحدي تصميم سعة مطلوبة، والطلبة يحلون ويصممون في مجموعات (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: احسب السعة المكافئة لـ (‎2.0 μF‎ و‎2.0 μF‎ على التوازي) على التوالي مع ‎4.0 μF‎.\n• الإجابة النموذجية: ‎4.0 μF‎ على التوالي مع ‎4.0 μF = 2.0 μF‎.\n\n2. مستوى التطبيق: إذا وُصلت الشبكة السابقة بـ ‎12 V‎، فما فرق الجهد عبر المكثف ‎4.0 μF‎ المنفرد؟\n• الإجابة النموذجية: ‎Q = 24 μC‎؛ ‎V = 6.0 V‎.\n\n3. مستوى الاستدلال: ما فرق الجهد عبر كل من مكثفي التوازي؟\n• الإجابة النموذجية: ‎12 − 6.0 = 6.0 V‎، وشحنة كل منهما ‎12 μC‎.", "1. مستوى المعرفة: ما الخطوة الأولى في تبسيط شبكة مختلطة؟\n• الإجابة النموذجية: تبسيط المجموعات الداخلية الأبسط (التوالي أو التوازي) إلى مكثف مكافئ.\n\n2. مستوى التطبيق: صمم شبكة تعطي ‎1.5 μF‎ من مكثفات ‎1.0 μF‎.\n• الإجابة النموذجية: مكثفان على التوالي ‎(0.5 μF)‎ على التوازي مع مكثف ثالث ‎(1.0 μF)‎.\n\n3. مستوى الاستدلال: احسب السعة المكافئة لـ (‎3.0 μF‎ و‎6.0 μF‎ على التوالي) على التوازي مع ‎2.0 μF‎.\n• الإجابة النموذجية: ‎2.0 + 2.0 = 4.0 μF‎.", "إرشاد للطالب: حل ثلاث شبكات مختلطة مع تفاصيل الخطوات\nإرشاد لولي الأمر: تشجيع الابن على رسم الشبكة بعد كل خطوة تبسيط\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=19"], "h": ["<ol class=\"ol\"><li>يحسب السعة المكافئة لشبكات مختلطة من المكثفات على التوالي والتوازي<\/li><li>يحسب الشحنة وفرق الجهد لكل مكثف في شبكة مختلطة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم شبكة مكثفات تعطي سعة مطلوبة من مكثفات متماثلة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب السعة المكافئة لشبكات مختلطة من المكثفات على التوالي والتوازي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحسب الشحنة وفرق الجهد لكل مكثف في شبكة مختلطة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم شبكة مكثفات تعطي سعة مطلوبة من مكثفات متماثلة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الشبكة المختلطة، التبسيط التدريجي، المكثف المكافئ الجزئي، الشحنة وفرق الجهد في كل فرع.<\/p>", "<p>يرسم المعلم شبكة من ثلاثة مكثفات ويسأل: «من أين نبدأ التبسيط؟ من الداخل أم من الخارج؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الشبكة ويطرح السؤال، والطلبة يقترحون البدء بأبسط مجموعة داخلية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل المعلم شبكة مختلطة خطوة بخطوة: ‎2 μF‎ و‎2 μF‎ على التوازي ‎(4 μF)‎ على التوالي مع ‎4 μF‎، والطلبة يتبعون الحل ويحسبون ‎C = 2.0 μF‎ (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم شبكات متدرجة وتحدي تصميم سعة مطلوبة، والطلبة يحلون ويصممون في مجموعات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب السعة المكافئة لـ (‎2.0 μF‎ و‎2.0 μF‎ على التوازي) على التوالي مع ‎4.0 μF‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4.0 μF‎ على التوالي مع ‎4.0 μF = 2.0 μF‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> إذا وُصلت الشبكة السابقة بـ ‎12 V‎، فما فرق الجهد عبر المكثف ‎4.0 μF‎ المنفرد؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 24 μC‎؛ ‎V = 6.0 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما فرق الجهد عبر كل من مكثفي التوازي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎12 − 6.0 = 6.0 V‎، وشحنة كل منهما ‎12 μC‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطوة الأولى في تبسيط شبكة مختلطة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تبسيط المجموعات الداخلية الأبسط (التوالي أو التوازي) إلى مكثف مكافئ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صمم شبكة تعطي ‎1.5 μF‎ من مكثفات ‎1.0 μF‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مكثفان على التوالي ‎(0.5 μF)‎ على التوازي مع مكثف ثالث ‎(1.0 μF)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب السعة المكافئة لـ (‎3.0 μF‎ و‎6.0 μF‎ على التوالي) على التوازي مع ‎2.0 μF‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2.0 + 2.0 = 4.0 μF‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل ثلاث شبكات مختلطة مع تفاصيل الخطوات<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على رسم الشبكة بعد كل خطوة تبسيط<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=19<\/p>"]}, {"axis": "نشاط 4-3 وأسئلة الموضوعات 4-3 إلى 4-5", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شبكات المكثفات"], ["الحصة", "2 من 3"], ["محور الحصة", "نشاط 4-3 وأسئلة الموضوعات 4-3 إلى 4-5"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "الموضوعات 4-3 إلى 4-5 + كتاب التجارب ص 117"], ["دليل المعلم", "ص 122–124"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: توصيل المكثفات على التوالي وعلى التوازي ص 117"]], "t": ["1. يحل نشاط 4-3 «توصيل المكثفات على التوالي وعلى التوازي»\n2. يحل الأسئلة 11–20 في كتاب الطالب\nمخرج تعليمي آخر: يكتشف الأخطاء الشائعة في حلول مسائل الشبكات ويصححها", "1. تطبيق: يحل نشاط 4-3 «توصيل المكثفات على التوالي وعلى التوازي»\n2. تطبيق: يحل الأسئلة 11–20 في كتاب الطالب\n3. تقييم (مخرج آخر): يكتشف الأخطاء الشائعة في حلول مسائل الشبكات ويصححها", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "مراجعة قوانين التوالي والتوازي، الخلط بين قوانين المكثفات والمقاومات، الأخطاء الشائعة.", "يعرض المعلم حلًا خاطئًا يجمع سعتين على التوالي مباشرة ويسأل: «ما الخطأ؟ ومن أين جاء الخلط؟»", "1. يعرض المعلم الحل الخاطئ، والطلبة يكتشفون الخلط مع قوانين المقاومات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يوجه المعلم حل نشاط 4-3 (ص 117)، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. يوجه المعلم حل الأسئلة 11–20 في مجموعات، والطلبة يحلون ويعرضون الحلول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يختم المعلم بمسابقة المجموعات على المكثفات، والطلبة يتنافسون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1. مستوى المعرفة: ما الخطأ في حساب ‎2.0 μF + 3.0 μF = 5.0 μF‎ لمكثفين على التوالي؟\n• الإجابة النموذجية: هذا قانون التوازي؛ في التوالي تُجمع المقلوبات فتكون ‎1.2 μF‎.\n\n2. مستوى التطبيق: كيف تتذكر أن قوانين المكثفات معكوسة عن المقاومات؟\n• الإجابة النموذجية: في التوازي تُجمع السعات مباشرة كما تُجمع المقاومات في التوالي، والعكس.\n\n3. مستوى الاستدلال: مكثفان متماثلان ‎C‎ على التوالي ثم على التوازي؛ ما نسبة السعتين المكافئتين؟\n• الإجابة النموذجية: ‎C/2‎ إلى ‎2C‎، أي 1 : 4.", "1. مستوى المعرفة: ما المقاومة المكافئة التي يشبه قانونها قانون المكثفات على التوالي؟\n• الإجابة النموذجية: المقاومات على التوازي.\n\n2. مستوى التطبيق: احسب السعة المكافئة لـ ‎1.0 μF‎ و‎1.0 μF‎ و‎2.0 μF‎ جميعها على التوازي.\n• الإجابة النموذجية: ‎4.0 μF‎.\n\n3. مستوى الاستدلال: أربعة مكثفات متماثلة سعة كل منها ‎C‎؛ ما أكبر وأصغر سعة مكافئة ممكنة؟\n• الإجابة النموذجية: الأكبر ‎4C (‎توازٍ كامل)، والأصغر ‎C/4 (‎توالٍ كامل).", "إرشاد للطالب: إكمال نشاط 4-3 ص 117 والأسئلة 11–20\nإرشاد لولي الأمر: متابعة الابن في تجنب الخلط بين قوانين المكثفات والمقاومات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=19"], "h": ["<ol class=\"ol\"><li>يحل نشاط 4-3 «توصيل المكثفات على التوالي وعلى التوازي»<\/li><li>يحل الأسئلة 11–20 في كتاب الطالب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يكتشف الأخطاء الشائعة في حلول مسائل الشبكات ويصححها<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 4-3 «توصيل المكثفات على التوالي وعلى التوازي»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل الأسئلة 11–20 في كتاب الطالب<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يكتشف الأخطاء الشائعة في حلول مسائل الشبكات ويصححها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مراجعة قوانين التوالي والتوازي، الخلط بين قوانين المكثفات والمقاومات، الأخطاء الشائعة.<\/p>", "<p>يعرض المعلم حلًا خاطئًا يجمع سعتين على التوالي مباشرة ويسأل: «ما الخطأ؟ ومن أين جاء الخلط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الحل الخاطئ، والطلبة يكتشفون الخلط مع قوانين المقاومات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 4-3 (ص 117)، والطلبة يحلون فرديًا ثم يقارنون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل الأسئلة 11–20 في مجموعات، والطلبة يحلون ويعرضون الحلول (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على المكثفات، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطأ في حساب ‎2.0 μF + 3.0 μF = 5.0 μF‎ لمكثفين على التوالي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: هذا قانون التوازي؛ في التوالي تُجمع المقلوبات فتكون ‎1.2 μF‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف تتذكر أن قوانين المكثفات معكوسة عن المقاومات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في التوازي تُجمع السعات مباشرة كما تُجمع المقاومات في التوالي، والعكس.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> مكثفان متماثلان ‎C‎ على التوالي ثم على التوازي؛ ما نسبة السعتين المكافئتين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎C/2‎ إلى ‎2C‎، أي 1 : 4.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقاومة المكافئة التي يشبه قانونها قانون المكثفات على التوالي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المقاومات على التوازي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب السعة المكافئة لـ ‎1.0 μF‎ و‎1.0 μF‎ و‎2.0 μF‎ جميعها على التوازي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4.0 μF‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أربعة مكثفات متماثلة سعة كل منها ‎C‎؛ ما أكبر كافئة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يبرر اختيار توصيل معين لتحقيق متطلبات (سعة أكبر أو تحمل جهد أعلى)<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: بطاقات مقارنة<\/span><\/div>", "<p>جدول المقارنة، تحمل الجهد، زيادة السعة، التطبيقات العملية للتوصيل.<\/p>", "<p>يسأل المعلم: «لديك مكثفات تتحمل ‎50 V‎ فقط، وتحتاج إلى استخدامها في دائرة ‎100 V‎؛ كيف توصلها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون التوصيل على التوالي لتقاسم الجهد (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم إكمال جدول مقارنة بين المكثفات والمقاومات في التوصيلين، والطلبة يكملون الجدول في أزواج (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل تطبيقية (تحمل الجهد، تخزين طاقة أكبر)، والطلبة يحلون ويبررون اختياراتهم (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على شبكات المكثفات، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا يساعد التوصيل على التوالي في تحمل جهد أعلى؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجهد الكلي يتوزع على المكثفات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف تحصل على سعة أكبر من مكثفات صغيرة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بتوصيلها على التوازي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> مكثفان متماثلان يتحمل كل منهما ‎50 V‎ على التوالي؛ ما أقصى جهد للمجموعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎100 V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر الكمية المشتركة في كل من: مكثفات التوالي، ومقاومات التوالي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الشحنة في المكثفات، والتيار في المقاومات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أي التوصيلين يخزن طاقة أكبر لمكثفين متماثلين مع المصدر نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التوازي، لأن سعته المكافئة أكبر والطاقة ½‎CV²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يصح توصيل مكثفين مختلفي السعة على التوالي ويتحمل كل منهما ‎50 V‎ في دائرة ‎100 V‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجهد يتوزع عكسيًا مع السعة، فيقع على الأصغر سعة أكثر من ‎50 V‎ فيتلف.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال جدول المقارنة وحل المسائل التطبيقية<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أهمية معرفة حدود تحمل المكونات الإلكترونية<\/p>< s=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يتنبأ بأثر زيادة المقاومة أو السعة على سرعة التفريغ<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">استقصاء تفريغ مكثف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: مكثف كبير السعة، مقاومة كبيرة، فولتميتر رقمي، ساعة إيقاف<\/span><\/div>", "<p>التفريغ، الاضمحلال الأسي، فرق الجهد مع الزمن، الشحنة مع الزمن، التيار مع الزمن، المقاومة، السعة.<\/p>", "<p>يسأل المعلم: «عند فصل الشاحن، لماذا يبقى ضوء صغير في بعض الأجهزة مضاءً لثوانٍ ثم يخفت تدريجيًا؟» ويذكّر بأن التفريغ يشبه الاضمحلال الإشعاعي.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> استقصاء تفريغ مكثف: يطرح المعلم السؤال، والطلبة يقترحون تفريغ مكثف ببطء (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> استقصاء تفريغ مكثف: ينفذ المعلم «استقصاء تفريغ مكثف» بقراءة ‎V‎ كل ‎10 s‎، والطلبة يسجلون القراءات ويرسمون ‎V‎ مقابل ‎t‎ (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> الاستراتيجيتان: التعلم بالاكتشاف، التعلم التعاوني: يشرح أشكال تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن ويناقش أثر ‎R‎ و‎C‎، والطلبة يكملون تمثيلات ‎Q‎ و‎I‎ ويتنبؤون بأثر تغيير ‎R‎ (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: استقصاء تفريغ مكثف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما شكل تمثيل ‎V‎ مقابل ‎t‎ أثناء التفريغ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: منحنى اضمحلال أسي يتناقص بسرعة ثم ببطء.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون التفريغ أبطأ عندما تكون المقاومة أكبر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن التيار يكون أصغر فتتدفق الشحنة بمعدل أبطأ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الذي يميز الاضمحلال الأسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن الكمية تقل بالنسبة نفسها في فترات زمنية متساوية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل يتشابه شكلا تمثيلي ‎Q‎ و‎I‎ مع الزمن أثناء التفريغ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نعم، كلاهما اضمحلال أسي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف تتغير سرعة التفريغ بزيادة السعة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يصبح التفريغ أبطأ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يصل فرق الجهد إلى الصفر تمامًا نظريًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الاضمحلال الأسي يقلل الكمية بنسبة ثابتة كل فترة فيقترب من الصفر دون أن يبلغه.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 4-6 ورسم تمثيلات ‎Q‎ و‎V‎ و‎I‎ مع الزمن<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أجهزة يبقى ضوؤها قليلًا بعد فصلها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20<\/p>"]}, {"axis": "الثابت الزمني τ = ‎RC‎ والمعادلة ‎x = x₀e^(−t/RC)‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "2 من 3"], ["محور الحصة", "الثابت الزمني τ = ‎RC‎ والمعادلة ‎x = x₀e^(−t/RC)‎"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "الموضوع 4-6 (الأسئلة 21–24)"], ["دليل المعلم", "ص 124–130"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-4: تفريغ المكثفات ص 121؛ الاستقصاء العملي 4-1: تحديد سعة مكثف في دائرة تيار كهربائي مستمر ص 126"]], "t": ["1. يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎\n2. يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد\nمخرج تعليمي آخر: يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎", "1. تطبيق: يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎\n2. تطبيق: يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد\n3. تحليل (مخرج آخر): يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- تحديد طبيعة تفريغ المكثفات", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الثابت الزمني τ = ‎RC‎، ‎e^(−t/RC)‎، 37%، ‎ln V‎ مقابل ‎t‎، الميل = ‎−1/RC‎، نصف العمر.", "يسأل المعلم: «إذا انخفض جهد مكثف إلى 37% من قيمته بعد ‎47 s‎، فما علاقة هذا الرقم بقيمتي ‎R‎ و‎C‎؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون أن الزمن يعتمد على ‎R‎ و‎C‎ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تحديد طبيعة تفريغ المكثفات: ينفذ المعلم «تحديد طبيعة تفريغ المكثفات»: τ = ‎RC‎ و‎x = x₀e^(−t/RC)‎ وتمثيل ‎ln V‎ مقابل ‎t‎، والطلبة يشتقون أن ‎V = 0.37V₀‎ عند ‎t = RC‎ ويرسمون ‎ln V‎ مقابل ‎t‎ (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم مسائل حساب τ وقيم ‎V‎ و‎Q‎ و‎I‎ بعد زمن معين، والطلبة يحلون في أزواج (14 دقيقة)\nالاستراتيجيات: تحديد طبيعة تفريغ المكثفات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1. مستوى المعرفة: احسب τ لمكثف ‎470 μF‎ يُفرَّغ عبر ‎100 kΩ‎.\n• الإجابة النموذجية: τ = ‎100 × 10³ × 470 × 10⁻⁶ = 47 s‎.\n\n2. مستوى التطبيق: احسب ‎V‎ بعد ‎47 s‎ إذا كان ‎V₀ = 12 V‎.\n• الإجابة النموذجية: ‎V = 12e⁻¹ = 4.4 V‎.\n\n3. مستوى الاستدلال: ما ميل تمثيل ‎ln V‎ مقابل ‎t‎؟\n• الإجابة النموذجية: ‎−1/RC‎.", "1. مستوى المعرفة: كم تصبح الشحنة بعد زمن يساوي τ؟\n• الإجابة النموذجية: نحو 37% من الشحنة الابتدائية.\n\n2. مستوى التطبيق: احسب ‎V‎ بعد 2τ إذا كان ‎V₀ = 10 V‎.\n• الإجابة النموذجية: ‎V = 10e⁻² = 1.4 V‎.\n\n3. مستوى الاستدلال: احسب الزمن اللازم لانخفاض ‎V‎ إلى النصف لمكثف τ له ‎47 s‎.\n• الإجابة النموذجية: ‎t = τ ln 2 = 0.693 × 47 = 33 s‎.", "إرشاد للطالب: حل مسائل τ = ‎RC‎ والمعادلة الأسية\nإرشاد لولي الأمر: متابعة الابن في استخدام زري ‎e^x‎ و‎ln‎ في الآلة الحاسبة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎<\/li><li>يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم معادلة الثابت الزمني لمكثف يُفرَّغ عبر مقاومة τ = ‎RC‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم معادلات بالصيغة ‎x = x₀e^(−t/RC)‎ حيث ‎x‎ تيار أو شحنة أو فرق جهد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يستنتج ‎RC‎ من ميل تمثيل ‎ln V‎ مقابل ‎t‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">تحديد طبيعة تفريغ المكثفات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الثابت الزمني τ = ‎RC‎، ‎e^(−t/RC)‎، 37%، ‎ln V‎ مقابل ‎t‎، الميل = ‎−1/RC‎، نصف العمر.<\/p>", "<p>يسأل المعلم: «إذا انخفض جهد مكثف إلى 37% من قيمته بعد ‎47 s‎، فما علاقة هذا الرقم بقيمتي ‎R‎ و‎C‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون أن الزمن يعتمد على ‎R‎ و‎C‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> تحديد طبيعة تفريغ المكثفات: ينفذ المعلم «تحديد طبيعة تفريغ المكثفات»: τ = ‎RC‎ و‎x = x₀e^(−t/RC)‎ وتمثيل ‎ln V‎ مقابل ‎t‎، والطلبة يشتقون أن ‎V = 0.37V₀‎ عند ‎t = RC‎ ويرسمون ‎ln V‎ مقابل ‎t‎ (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم مسائل حساب τ وقيم ‎V‎ و‎Q‎ و‎I‎ بعد زمن معين، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: تحديد طبيعة تفريغ المكثفات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب τ لمكثف ‎470 μF‎ يُفرَّغ عبر ‎100 kΩ‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: τ = ‎100 × 10³ × 470 × 10⁻⁶ = 47 s‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎V‎ بعد ‎47 s‎ إذا كان ‎V₀ = 12 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = 12e⁻¹ = 4.4 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما ميل تمثيل ‎ln V‎ مقابل ‎t‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎−1/RC‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كم تصبح الشحنة بعد زمن يساوي τ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو 37% من الشحنة الابتدائية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎V‎ بعد 2τ إذا كان ‎V₀ = 10 V‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎V = 10e⁻² = 1.4 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب الزمن اللازم لانخفاض ‎V‎ إلى النصف لمكثف τ له ‎47 s‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎t = τ ln 2 = 0.693 × 47 = 33 s‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل مسائل τ = ‎RC‎ والمعادلة الأسية<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في استخدام زري ‎e^x‎ و‎ln‎ في الآلة الحاسبة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20<\/p>"]}, {"axis": "الاستقصاء العملي 4-1: تحديد سعة مكثف ونشاط 4-4 ومراجعة الوحدة الرابعة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "شحن المكثفات وتفريغها"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 4-1: تحديد سعة مكثف ونشاط 4-4 ومراجعة الوحدة الرابعة"], ["الأس  = 100 kΩ‎، فما ‎C‎؟\n• الإجابة النموذجية: ‎C = 1/(100 × 10³ × 0.020) = 5.0 × 10⁻⁴ F = 500 μF‎.\n\n3. مستوى الاستدلال: لماذا نرسم خط أسوأ مطابقة؟\n• الإجابة النموذجية: لتقدير عدم اليقين في الميل ومن ثم في قيمة ‎C‎.", "1. مستوى المعرفة: لماذا نستخدم ‎ln V‎ بدل ‎V‎؟\n• الإجابة النموذجية: لتحويل المنحنى الأسي إلى خط مستقيم يسهل حساب ميله.\n\n2. مستوى التطبيق: اذكر مصدرًا للخطأ في استقصاء تفريغ المكثف.\n• الإجابة النموذجية: زمن رد فعل القارئ عند تسجيل القراءات، أو تسرب الشحنة، أو عدم دقة قيمة ‎R‎.\n\n3. مستوى الاستدلال: قيّم تعلمك في الوحدة الرابعة: موضوع أتقنته وآخر يحتاج إلى مراجعة وخطة لذلك.\n• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية.", "إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 وإكمال نشاط 4-4 والأسئلة 21–24 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الرابعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20"], "h": ["<ol class=\"ol\"><li>ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ<\/li><li>يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> ينفذ الاستقصاء العملي 4-1 «تحديد سعة مكثف في دائرة تيار كهربائي مستمر» من بيانات التفريغ<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 4-4 «تفريغ المكثفات» والأسئلة 21–24<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم عدم اليقين في قيمة ‎C‎ المحسوبة من خطي أفضل وأسوأ مطابقة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: مكثف، مقاومة معلومة، فولتميتر رقمي، ساعة إيقاف، ورق رسم، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>‎ln V‎ مقابل ‎t‎، خط أفضل مطابقة، خط أسوأ مطابقة، عدم اليقين في الميل، ‎C = −1/(R ×‎ الميل).<\/p>", "<p>يعرض المعلم جدول بيانات تفريغ نموذجي (‎V‎ مقابل ‎t‎) ويسأل: «كيف نحول هذه البيانات إلى قيمة للسعة باستخدام خط مستقيم؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم البيانات ويطرح السؤال، والطلبة يقترحون رسم ‎ln V‎ مقابل ‎t‎ (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: الاستقصاء العملي، التعلم الذاتي: يوجه تنفيذ الاستقصاء العملي 4-1 (ص 126) أو تحليل بياناته النموذجية مع خطي أفضل وأسوأ مطابقة، والطلبة يرسمون ويحسبون الميل و‎C‎ وعدم اليقين (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 4-4 (ص 121) والأسئلة 21–24، والطلبة يحلون في أزواج (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات لمراجعة الوحدة الرابعة وقائمة التقويم الذاتي، والطلبة يتنافسون ثم يقيّمون أنفسهم (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تُحسب ‎C‎ من ميل ‎ln V‎ مقابل ‎t‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎C = −1/(R ×‎ الميل).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> إذا كان الميل ‎−0.020 s⁻¹‎ و‎R = 100 kΩ‎، فما ‎C‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎C = 1/(100 × 10³ × 0.020) = 5.0 × 10⁻⁴ F = 500 μF‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نرسم خط أسوأ مطابقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتقدير عدم اليقين في الميل ومن ثم في قيمة ‎C‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا نستخدم ‎ln V‎ بدل ‎V‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتحويل المنحنى الأسي إلى خط مستقيم يسهل حساب ميله.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر مصدرًا للخطأ في استقصاء تفريغ المكثف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: زمن رد فعل القارئ عند تسجيل القراءات، أو تسرب الشحنة، أو عدم دقة قيمة ‎R‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم تعلمك في الوحدة الرابعة: موضوع أتقنته وآخر يحتاج إلى مراجعة وخطة لذلك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 4-1 وإكمال نشاط 4-4 والأسئلة 21–24 وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الرابعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=20<\/p>"]}]}, {"title": "توليد المجالات المغناطيسية وتمثيلها", "sb": "ال #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يرسم خطوط المجال المغناطيسي حول مغناطيس مستقيم وبين قطبين متقابلين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين المجالات الثلاثة (الجاذبية، الكهربائي، المغناطيسي) من حيث المصدر<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: مغناطيسات، برادة حديد، بوصلات صغيرة<\/span><\/div>", "<p>المجال المغناطيسي، المغناطيس الدائم، الشحنات المتحركة، خطوط المجال المغناطيسي، القطب الشمالي والجنوبي، البوصلة.<\/p>", "<p>يقسم المعلم الطلبة إلى مجموعات تصف كل ما تتذكره عن المجالات المغناطيسية وترسم مخططاتها في خمس دقائق (فكرة التمهيد ب)، ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يدير المعلم نشاط التذكر الجماعي ومهام بداية الوحدة، والطلبة يرسمون ما يتذكرونه ويعرضون باختصار (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم أن المجال المغناطيسي مجال قوة مصدره الشحنات المتحركة أو المغناطيس الدائم ويعرض أنماط برادة الحديد، والطلبة يرسمون خطوط المجال لمغناطيس مستقيم وقطبين متقابلين (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم نشاط «تجربة المجال المغناطيسي البسيط» بالبوصلات حول مغناطيسات، والطلبة يحددون اتجاه المجال بالبوصلة في نقاط مختلفة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما مصدرا المجال المغناطيسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الشحنات الكهربائية المتحركة (التيار) والمغناطيس الدائم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما اتجاه خطوط المجال المغناطيسي خارج المغناطيس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من القطب الشمالي إلى القطب الجنوبي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تحدد اتجاه المجال عند نقطة عمليًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بوضع بوصلة صغيرة فيشير قطبها الشمالي إلى اتجاه المجال.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يمثل تقارب خطوط المجال المغناطيسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: مجالًا أقوى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل تتقاطع خطوط المجال المغناطيسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قارن مصدر كل من مجال الجاذبية والكهربائي والمغناطيسي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجاذبية: الكتلة؛ الكهربائي: الشحنة (ساكنة أو متحركة)؛ المغناطيسي: الشحنة المتحركة أو المغناطيس الدائم.<\/span><\/p><\/div>", "<p><b تخدام قاعدة قبضة اليد اليمنى<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر تشابه مجال الملف اللولبي مع مجال المغناطيس المستقيم<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: سلك مستقيم وملف لولبي ومصدر تيار وبرادة حديد<\/span><\/div>", "<p>السلك المستقيم، الملف الدائري، الملف اللولبي، دوائر متحدة المركز، قاعدة قبضة اليد اليمنى، المجال المنتظم داخل الملف.<\/p>", "<p>يمرر المعلم تيارًا في سلك رأسي يخترق لوحًا عليه برادة حديد، ويسأل: «ما شكل المجال الذي تراه؟ وكيف نعرف اتجاهه؟» (فكرة التمهيد أ).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يصفون الدوائر متحدة المركز (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم أنماط المجال حول السلك والملف الدائري واللولبي وقاعدة قبضة اليد اليمنى، والطلبة يرسمون الأنماط الثلاثة ويحددون الاتجاهات (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم رسومًا لتحديد اتجاه المجال أو التيار في حالات مختلفة، والطلبة يطبقون القاعدة في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما شكل خطوط المجال حول سلك مستقيم يحمل تيارًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: دوائر متحدة المركز حول السلك.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف تحدد اتجاه المجال حول سلك بقاعدة قبضة اليد اليمنى؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يشير الإبهام إلى اتجاه التيار وتلتف الأصابع في اتجاه المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يشبه مجال الملف اللولبي مجال المغناطيس المستقيم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن خطوطه تخرج من أحد طرفيه وتدخل الآخر فيتكون قطبان، ويكون المجال داخله منتظمًا تقريبًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين يكون مجال الملف اللولبي منتظمًا تقريبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: داخل الملف بعيدًا عن طرفيه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لمجال السلك إذا عُكس اتجاه التيار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ينعكس اتجاه المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تحدد القطب الشمالي لملف لولبي باليد اليمنى؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تلتف الأصابع في اتجاه التيار في اللفات فيشير الإبهام إلى القطب الشمالي.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> رسم أنماط المجال الثلاثة مع الاتجاهات<\/p><p><b>إرشاد لولي ال "chip r\">أخرى: سلكان مرنان متوازيان (شريط ألومنيوم) ومصدر تيار للعرض<\/span><\/div>", "<p>سلكان متوازيان، التيار في الاتجاه نفسه (تجاذب)، التيار المتعاكس (تنافر)، المجال عند السلك الآخر.<\/p>", "<p>يمرر المعلم تيارًا في شريطي ألومنيوم متوازيين مرة في الاتجاه نفسه ومرة متعاكسين، ويسأل: «لماذا تقاربا مرة وتباعدا مرة أخرى؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يصفون الملاحظتين (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم نشاط «القوة بين الأسلاك الحاملة لتيار كهربائي» ويحلل المجال الناشئ عن كل سلك عند الآخر، والطلبة يحددون اتجاه المجال والقوة بالقاعدتين (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل أسئلة كتاب الطالب وكتاب التجارب على القوة المغناطيسية، والطلبة يحلون في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على القوة المغناطيسية، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يحدث لسلكين متوازيين يحملان تيارين في الاتجاه نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتجاذبان.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث إذا كان التياران متعاكسين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتنافران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يتأثر كل سلك بقوة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يقع في المجال المغناطيسي الذي يولده السلك الآخر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما القاعدة التي تحدد اتجاه مجال السلك الأول عند الثاني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قاعدة قبضة اليد اليمنى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل القوتان المتبادلتان بين السلكين متساويتان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نعم، متساويتان مقدارًا ومتعاكستان اتجاهًا (قانون نيوتن الثالث).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> سلكان متوازيان يحملان تيارين ‎2 A‎ و‎6 A‎ في الاتجاه نفسه؛ أيهما يتأثر بقوة أكبر؟ فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوتان متساويتان مقدارًا وفق قانون نيوتن الثالث، رغم اختلاف التيارين.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل أسئلة القوة المغناطيسية في كتابي الطالب والتجارب<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن تعريف الأمبير المرتبط بالقوة بين سلكين متوازيين<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=22<\/p>"]}]}, {"title": "كثافة الفيض المغناطيسي", "sb": "الموضوع 5-3 (الأسئلة 4–12)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "تعريف كثافة الفيض المغناطيسي والعلاقة ‎F = BIL sinθ‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "كثافة الفيض المغناطيسي"], ["الحصة", "1 من 2"], ["محور الحصة", "تعريف كثافة الفيض الم 20 T‎.\n• الإجابة النموذجية: ‎F = 0.20 × 3.0 × 0.050 = 0.030 N‎.\n\n3. مستوى الاستدلال: احسب القوة إذا كانت الزاوية بين السلك والمجال ‎30°‎.\n• الإجابة النموذجية: ‎F = 0.030 × sin 30° = 0.015 N‎.", "1. مستوى المعرفة: ما وحدة كثافة الفيض المغناطيسي؟\n• الإجابة النموذجية: التسلا ‎(T)‎.\n\n2. مستوى التطبيق: ما الزاوية θ في المعادلة ‎F = BIL sinθ‎؟\n• الإجابة النموذجية: الزاوية بين السلك (اتجاه التيار) واتجاه المجال.\n\n3. مستوى الاستدلال: احسب ‎B‎ إذا أثرت قوة ‎0.020 N‎ على سلك طوله ‎0.10 m‎ يحمل ‎2.0 A‎ عموديًا على المجال.\n• الإجابة النموذجية: ‎B = 0.10 T‎.", "إرشاد للطالب: مراجعة الموضوع 5-3 وحل مسائل ‎F = BIL sinθ‎\nإرشاد لولي الأمر: متابعة الابن في تحديد الزاوية بين السلك والمجال\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=23"], "h": ["<ol class=\"ol\"><li>يعرّف كثافة الفيض المغناطيسي بأنها القوة المؤثرة لكل وحدة تيار لكل وحدة طول من سلك موضوع عموديًا على المجال<\/li><li>يستخدم المعادلة ‎F = BIL sinθ‎ ويحدد الاتجاهات باستخدام قاعدة فليمنج لليد اليسرى<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الزاوية θ بصورة صحيحة بين السلك والمجال<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف كثافة الفيض المغناطيسي بأنها القوة المؤثرة لكل وحدة تيار لكل وحدة طول من سلك موضوع عموديًا على المجال<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يستخدم المعادلة ‎F = BIL sinθ‎ ويحدد الاتجاهات باستخدام قاعدة فليمنج لليد اليسرى<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحدد الزاوية θ بصورة صحيحة بين السلك والمجال<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>كثافة الفيض المغناطيسي ‎B‎، التسلا ‎T‎، ‎F = BIL sinθ‎، الزاوية بين السلك والمجال، ‎T = N A⁻¹ m⁻¹‎.<\/p>", "<p>يسأل المعلم: «قلنا إن القوة تزداد بزيادة التيار والطول وشدة المجال؛ كيف نجمع هذا في معادلة واحدة؟ وما وحدة شدة المجال المغناطيسي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون ‎F ∝ BIL‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يعرّف المعلم ‎B‎ والتسلا ويشرح ‎F = BIL sinθ‎ مع التنبيه إلى خطأ استخدام ‎cosθ‎، والطلبة يكتبون التعريف ويحسبون أمثلة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل بزوايا مختلفة، والطلبة يحلون في أزواج ويحددون θ بدقة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم السؤال المفصلي (سلك كتلته لكل وحدة طول ‎10 g/m‎ بزاوية ‎45°‎) ثم التقويم الختامي، والطلبة يجيبون ويناقشون الخيارات الخاطئة (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف التسلا.<br><span style=\"opacity:.85\">• الإجابة النموذجية: كثافة الفيض التي تؤثر بقوة ‎1 N‎ على سلك طوله ‎1 m‎ يحمل تيارًا ‎1 A‎ موضوع عموديًا على المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب القوة على سلك طوله ‎0.050 m‎ يحمل ‎3.0 A‎ عموديًا على مجال ‎0.20 T‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 0.20 × 3.0 × 0.050 = 0.030 N‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب القوة إذا كانت الزاوية بين السلك والمجال ‎30°‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 0.030 × sin 30° = 0.015 N‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة كثافة الفيض المغناطيسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التسلا ‎(T)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الزاوية θ في المعادلة ‎F = BIL sinθ‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الزاوية بين السلك (اتجاه التيار) واتجاه المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎B‎ إذا أثرت قوة ‎0.020 N‎ على سلك طوله ‎0.10 m‎ يحمل ‎2.0 A‎ عموديًا على المجال.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎B = 0.10 T‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 5-3 وحل مسائل ‎F = BIL sinθ‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في تحديد الزاوية بين السلك والمجال<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=23<\/p>"]}, {"axis": "التسلاميتر (مسبار هول) واستخدامه ونشاط 5-2", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "كثافة الفيض المغناطيسي"], ["الحصة", "2 من 2"], ["محور الحصة", "التسلاميتر (مسبار هول) واستخدامه ونشاط 5-2"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "الموضوع 5-3 + كتاب التجارب ص 137"], ["دليل . مستوى المعرفة: ما الجهاز المستخدم لقياس كثافة الفيض المغناطيسي؟\n• الإجابة النموذجية: التسلاميتر (مسبار هول).\n\n2. مستوى التطبيق: ماذا يحدث للقراءة إذا دُوّر المسبار ليصبح موازيًا للمجال؟\n• الإجابة النموذجية: تقترب من الصفر.\n\n3. مستوى الاستدلال: لماذا تختلف القراءات أحيانًا عند تكرار القياس في الموضع نفسه؟\n• الإجابة النموذجية: لعدم ثبات توجيه المسبار تمامًا أو تغير موضعه قليلًا أو وجود مصادر مغناطيسية قريبة.", "إرشاد للطالب: إكمال نشاط 5-2 ص 137 والأسئلة 4–12\nإرشاد لولي الأمر: يمكن للابن استكشاف مستشعر المجال المغناطيسي في الهاتف بإشراف ولي الأمر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=23"], "h": ["<ol class=\"ol\"><li>يصف استخدام التسلاميتر (مسبار هول) لقياس كثافة الفيض المغناطيسي<\/li><li>يحل نشاط 5-2 «القوة المؤثرة على سلك يسري فيه تيار كهربائي»<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستقصي تغير ‎B‎ داخل ملف لولبي أو قرب مغناطيس باستخدام التسلاميتر أو تطبيق هاتف<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف استخدام التسلاميتر (مسبار هول) لقياس كثافة الفيض المغناطيسي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 5-2 «القوة المؤثرة على سلك يسري فيه تيار كهربائي»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يستقصي تغير ‎B‎ داخل ملف لولبي أو قرب مغناطيس باستخدام التسلاميتر أو تطبيق هاتف<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: تسلاميتر أو تطبيق مستشعر مغناطيسي في الهاتف، مغناطيسات، ملف لولبي، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>التسلاميتر، مسبار هول، توجيه المسبار عموديًا على المجال، معايرة الصفر، قياس ‎B‎.<\/p>", "<p>يعرض المعلم تطبيق مستشعر المجال المغناطيسي على الهاتف ويقرّب منه مغناطيسًا، ويسأل: «كيف يقيس الهاتف المجال المغناطيسي؟ ولماذا تتغير القراءة بتدوير الهاتف؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم التطبيق ويطرح السؤال، والطلبة يلاحظون اعتماد القراءة على الاتجاه (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «التسلاميتر (مسبار هول) واستخدامه»: التوجيه ومعايرة الصفر وأخذ القراءات، والطلبة يقيسون ‎B‎ عند أبعاد مختلفة من مغناطيس أو داخل ملف (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 5-2 (ص 137) والأسئلة 4–12 المختارة، والطلبة يحلون في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف يُوجَّه مسبار هول للحصول على أكبر قراءة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بحيث يكون سطح المسبار عموديًا على خطوط المجال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُضبط التسلاميتر على الصفر بعيدًا عن المغناطيسات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لإلغاء أثر المجال المغناطيسي الأرضي والمجالات المحيطة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تتغير قراءة ‎B‎ بالابتعاد عن المغناطيس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتناقص.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الجهاز المستخدم لقياس كثافة الفيض المغناطيسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التسلاميتر (مسبار هول).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث للقراءة إذا دُوّر المسبار ليصبح موازيًا للمجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقترب من الصفر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تختلف القراءات أحيانًا عند تكرار القياس في الموضع نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لعدم ثبات توجيه المسبار تمامًا أو تغير موضعه قليلًا أو وجود مصادر مغناطيسية قريبة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 5-2 ص 137 والأسئلة 4–12<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن للابن استكشاف مستشعر المجال المغناطيسي في الهاتف بإشراف ولي الأمر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=23<\/p>"]}]}, {"title": "المزيد عن القوى على الموصلات الحاملة لتيار كهربائي", "sb": "الموضوع 5-4 (الأسئلة 4–12)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي بالميزان", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "المزيد عن القوى على الموصلات الحاملة لتيار كهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "الاستقصاء العملي 5-1: قياس كثافة الفيض المغناطيسي بالميزان"], ["ا . مستوى الاستدلال: ماذا يمثل ميل خط ‎F‎ مقابل ‎I‎؟\n• الإجابة النموذجية: ‎BL‎.", "1. مستوى المعرفة: ما الكمية التي نحسبها من تغير قراءة الميزان؟\n• الإجابة النموذجية: القوة ‎F = Δm × g‎.\n\n2. مستوى التطبيق: لماذا يجب أن يكون السلك عموديًا على المجال؟\n• الإجابة النموذجية: لتكون القوة أكبر ما يمكن ويُطبق ‎F = BIL‎ مباشرة.\n\n3. مستوى الاستدلال: اقترح تحسينين لدقة قياس ‎B‎.\n• الإجابة النموذجية: استخدام مدى تيارات أكبر وتكرار القراءات وقياس طول السلك داخل المجال بدقة (عرض قطبي المغناطيس).", "إرشاد للطالب: كتابة تقرير الاستقصاء 5-1 مع الرسم البياني\nإرشاد لولي الأمر: التأكد من إكمال الابن حساب ‎B‎ وعدم اليقين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24"], "h": ["<ol class=\"ol\"><li>يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا<\/li><li>يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يقيس كثافة الفيض المغناطيسي بين قطبي مغناطيس باستخدام ميزان رقمي وسلك يحمل تيارًا<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يرسم القوة مقابل التيار ويحسب ‎B‎ من الميل<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم عدم اليقين في قيمة ‎B‎ المحسوبة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: مغناطيس على شكل حرف ‎U‎، ميزان رقمي، سلك مثبت، مصدر تيار، أميتر، مقاومة متغيرة<\/span><\/div>", "<p>الميزان الرقمي، تغير القراءة، ‎F = Δm × g‎، ‎F‎ مقابل ‎I‎، الميل = ‎BL‎، عدم اليقين.<\/p>", "<p>يضع المعلم مغناطيسًا على ميزان رقمي ويمرر تيارًا في سلك ثابت بين قطبيه فتتغير قراءة الميزان، ويسأل: «لماذا تغيرت القراءة والسلك لا يلمس المغناطيس؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يربطون التغير بقوة متبادلة (قانون نيوتن الثالث) (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> الاستراتيجيتان: الاستقصاء العملي، التعلم التعاوني: يوجه تنفيذ الاستقصاء العملي 5-1 (ص 152): قياس تغير القراءة لتيارات مختلفة، والطلبة يسجلون ‎Δm‎ لكل تيار ويحسبون ‎F = Δm g‎ (20 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم رسم ‎F‎ مقابل ‎I‎ وحساب ‎B‎ من الميل وعدم اليقين، والطلبة يرسمون ويحسبون ‎B‎ (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (6 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تتغير قراءة الميزان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن السلك يؤثر على المغناطيس بقوة مساوية ومعاكسة للقوة التي يؤثر بها المجال على السلك.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> تغيرت القراءة بـ ‎2.04 g‎ عند ‎4.0 A‎ وطول السلك في المجال ‎0.050 m‎. احسب ‎B‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = 0.00204 × 9.81 = 0.020 N‎؛ ‎B = 0.020 ÷ (4.0 × 0.050) = 0.10 T‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يمثل ميل خط ‎F‎ مقابل ‎I‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎BL‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الكمية التي نحسبها من تغير قراءة الميزان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: القوة ‎F = Δm × g‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يجب أن يكون السلك عموديًا على المجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتكون القوة أكبر ما يمكن ويُطبق ‎F = BIL‎ مباشرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تحسينين لدقة قياس ‎B‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: استخدام مدى تيارات أكبر وتكرار القراءات وقياس طول السلك داخل المجال بدقة (عرض قطبي المغناطيس).<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 5-1 مع الرسم البياني<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من إكمال الابن حساب ‎B‎ وعدم اليقين<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24<\/p>"]}, {"axis": "مسائل متقدمة في القوى على الموصلات ومراجعة الأسئلة 4–12", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "المزيد عن القوى على الموصلات الحاملة لتيار كهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "مسائل متقدمة في القوى على الموصلات ومراجعة الأسئلة 4–12"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوعان 5-3 و5-4"], ["دليل المعلم", "ص 146–151"], ["كتاب التجارب العملي 2. مستوى التطبيق: لماذا يُعد استخدام ‎cosθ‎ في ‎F = BIL sinθ‎ خطأً شائعًا؟\n• الإجابة النموذجية: لأن θ هي الزاوية بين السلك والمجال، والقوة تتناسب مع ‎sinθ‎ لا ‎cosθ‎.\n\n3. مستوى الاستدلال: صف مبدأ ميزان تياري لقياس ‎B‎.\n• الإجابة النموذجية: سلك على ذراع ميزان داخل المجال، تُوازن القوة المغناطيسية ‎BIL‎ بوزن معلوم، فنحسب ‎B = mg/(IL)‎.", "إرشاد للطالب: حل أسئلة مختارة من 4–12 ومسألة السلك المعلق\nإرشاد لولي الأمر: متابعة الابن في رسم مخطط القوى قبل الحل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24"], "h": ["<ol class=\"ol\"><li>يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)<\/li><li>يحل أسئلة مختارة من 4–12 في كتاب الطالب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يحل مسائل متقدمة تجمع ‎F = BIL sinθ‎ مع الاتزان (الوزن والشد)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل أسئلة مختارة من 4–12 في كتاب الطالب<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم «ميزانًا تياريًا» لقياس ‎B‎ ويشرح مبدأه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>اتزان القوى، سلك معلق في مجال، الكتلة لكل وحدة طول، الميزان التياري، الأخطاء الشائعة (‎cosθ‎، الوحدات).<\/p>", "<p>يعرض المعلم سلكًا أفقيًا معلقًا يرتفع عند تمرير تيار معين، ويسأل: «ما التيار اللازم لجعل السلك «يطفو» في المجال دون أن يسقط؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون مساواة القوة المغناطيسية بالوزن (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل المعلم مسألة السلك الطافي ‎(BIL = mg)‎ ويعالج أخطاء الوحدات و‎sin/cos‎، والطلبة يتبعون الحل ويحسبون التيار (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل أسئلة مختارة من 4–12 وتحدي تصميم ميزان تياري، والطلبة يحلون ويصممون في مجموعات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يختم المعلم بمسابقة المجموعات على القوى المغناطيسية، والطلبة يتنافسون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سلك أفقي كتلته لكل وحدة طول ‎0.010 kg/m‎ في مجال أفقي ‎0.25 T‎ عمودي عليه. ما التيار الذي يجعله معلقًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎BIL = mg ← I = (0.010 × 9.81) ÷ 0.25 = 0.39 A‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما اتجاه القوة المغناطيسية اللازمة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إلى أعلى، معاكسة للوزن.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تعتمد الإجابة السابقة على طول السلك؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الوزن والقوة المغناطيسية يتناسبان كلاهما مع الطول فيُختصر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما شرط اتزان السلك المعلق في المجال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن تساوي القوة المغناطيسية وزنه وتعاكسه في الاتجاه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُعد استخدام ‎cosθ‎ في ‎F = BIL sinθ‎ خطأً شائعًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن θ هي الزاوية بين السلك والمجال، والقوة تتناسب مع ‎sinθ‎ لا ‎cosθ‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صف مبدأ ميزان تياري لقياس ‎B‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: سلك على ذراع ميزان داخل المجال، تُوازن القوة المغناطيسية ‎BIL‎ بوزن معلوم، فنحسب ‎B = mg/(IL)‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل أسئلة مختارة من 4–12 ومسألة السلك المعلق<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في رسم مخطط القوى قبل الحل<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=24<\/p>"]}]}, {"title": "الحث الكهرومغناطيسي", "sb": "الموضوع 5-5 (الأسئلة 13–21)", "unit": "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي", "periods": [{"axis": "مشاهدات تجارب الحث والعوامل المؤثرة في القوة الدافعة المستحثة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: المغناطيسية والحث الكهرومغناطيسي"], ["الدرس", "الحث الكهرومغناطيسي"], ["الحصة", "1 من 3"], ["محور الحصة", "مشاهدات تجارب الحث والعوامل المؤثرة في القوة الدافعة المستحثة"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "الموضوع 5-5 (الأسئلة 13–21)"], ["دليل المعلم", "ص 151–154"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: ال
