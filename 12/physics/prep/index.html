– الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "2 من 3"], ["محور الحصة", "شدة المجال الكهربائي لشحنة نقطية"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 (السؤالان 13، 14)"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎\n2. يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين\nمخرج تعليمي آخر: يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "المجال الشعاعي، ‎E = Q/(4πε₀r²)‎، التربيع العكسي، المجال المحصل، نقطة انعدام المجال.", "يسأل المعلم: «حول شحنة نقطية، هل يمكن استخدام ‎E = V/d‎ لحساب المجال؟ لماذا؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يستنتجون أن المجال غير منتظم حول الشحنة النقطية\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يشتق ‎E = Q/(4πε₀r²)‎ من قانون كولوم ويحل مثالًا\n• الطالب: يشتقون ويحسبون ‎E‎ على بعد معين\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل محصلة مجالين على خط واحد\n• الطالب: يحسبون في مجموعات ويحددون نقطة انعدام المجال\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: احسب ‎E‎ على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.\n   الإجابة النموذجية: ‎E = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.090 = 2.0 × 10² N/C‎.\n2) (مستوى التطبيق) السؤال: كيف تتغير ‎E‎ إذا تضاعف البعد عن الشحنة؟\n   الإجابة النموذجية: تقل إلى الربع.\n3) (مستوى الاستدلال) السؤال: لماذا لا تصلح ‎E = V/d‎ حول شحنة نقطية؟\n   الإجابة النموذجية: لأن المجال غير منتظم، وتلك العلاقة للمجال المنتظم فقط.", "1) (مستوى المعرفة) السؤال: اكتب معادلة شدة المجال لشحنة نقطية.\n   الإجابة النموذجية: ‎E = Q/(4πε₀r²)‎\n2) (مستوى التطبيق) السؤال: شحنتان موجبتان متساويتان؛ أين ينعدم المجال المحصل؟\n   الإجابة النموذجية: في منتصف المسافة بينهما.\n3) (مستوى الاستدلال) السؤال: شحنتان ‎+4 μC‎ و‎+1 μC‎ بينهما ‎0.30 m‎. أين ينعدم المجال على الخط الواصل؟\n   الإجابة النموذجية: على بعد ‎0.20 m‎ من الشحنة ‎+4 μC (‎حيث ‎4/x² = 1/(0.30 − x)²‎).", "إرشاد للطالب: مراجعة الموضوع 2-4 وحل مسائل المجال المحصل\nإرشاد لولي الأمر: متابعة الابن في رسم متجهات المجال قبل الحساب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎<\/li><li>يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستخدم معادلة شدة المجال الكهربائي الناشئ عن شحنة نقطية في الفراغ ‎E = Q/(4πε₀r²)‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يميز بين المجال الشعاعي حول شحنة نقطية والمجال المنتظم بين لوحين<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب محصلة المجال الناشئ عن شحنتين على الخط الواصل بينهما<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>المجال الشعاعي، ‎E = Q/(4πε₀r²)‎، التربيع العكسي، المجال المحصل، نقطة انعدام المجال.<\/p>", "<p>يسأل المعلم: «حول شحنة نقطية، هل يمكن استخدام ‎E = V/d‎ لحساب المجال؟ لماذا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على حل المشكلات:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يستنتجون أن المجال غير منتظم حول الشحنة النقطية<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم المبني على حل المشكلات:<\/b> يشتق ‎E = Q/(4πε₀r²)‎ من قانون كولوم ويحل مثالًا<br><span style=\"opacity:.85\">• الطالب: يشتقون ويحسبون ‎E‎ على بعد معين<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل محصلة مجالين على خط واحد<br><span style=\"opacity:.85\">• الطالب: يحسبون في مجموعات ويحددون نقطة انعدام المجال<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>احسب ‎E‎ على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.<\/td><td>‎E = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.090 = 2.0 × 10² N/C‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>كيف تتغير ‎E‎ إذا تضاعف البعد عن الشحنة؟<\/td><td>تقل إلى الربع.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>لماذا لا تصلح ‎E = V/d‎ حول شحنة نقطية؟<\/td><td>لأن المجال غير منتظم، وتلك العلاقة للمجال المنتظم فقط.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب معادلة شدة المجال لشحنة نقطية.<\/td><td>‎E = Q/(4πε₀r²)‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>شحنتان موجبتان متساويتان؛ أين ينعدم المجال المحصل؟<\/td><td>في منتصف المسافة بينهما.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>شحنتان ‎+4 μC‎ و‎+1 μC‎ بينهما ‎0.30 m‎. أين ينعدم المجال على الخط الواصل؟<\/td><td>على بعد ‎0.20 m‎ من الشحنة ‎+4 μC (‎حيث ‎4/x² = 1/(0.30 − x)²‎).<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-4 وحل مسائل المجال المحصل<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في رسم متجهات المجال قبل الحساب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8<\/p>"]}, {"axis": "نشاط 2-4 والسؤالان 13 و14 ومقارنة المجالين", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "قانون كولوم والمجالات الشعاعية"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاط 2-4 والسؤالان 13 و14 ومقارنة المجالين"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "الموضوع 2-4 + كتاب التجارب ص 48"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: المجال الكهربائي حول شحنة كهربائية نقطية ص 48"]], "t": ["1. يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14\n2. يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول\nمخرج تعليمي آخر: يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "المجال المنتظم، المجال الشعاعي، مجال الجاذبية، جدول المقارنة، منحنى ‎E‎ مقابل ‎r‎.", "يعرض المعلم جدولًا فارغًا بثلاثة أعمدة (جاذبية، كهربائي منتظم، كهربائي شعاعي) ويطلب ملء صف «معادلة الشدة» خلال دقيقة.", "1. 5 دقائق — التعلم التعاوني: يدير ملء الصف الأول\n• الطالب: يكتبون المعادلات الثلاث\n\n2. 15 دقيقة — الاستراتيجيتان: التعلم الذاتي، التعلم التعاوني: يوجه حل نشاط 2-4 (ص 48) والسؤالين 13 و14\n• الطالب: يحلون فرديًا ثم يقارنون\n\n3. 12 دقيقة — التعلم التعاوني: يوجه إكمال جدول المقارنة ورسم ‎E‎ مقابل ‎r‎\n• الطالب: يكملون الجدول ويرسمون المنحنى\n\n4. 8 دقائق: يختم بمسابقة المجموعات على قانون كولوم\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: ما شكل منحنى ‎E‎ مقابل ‎r‎ لشحنة نقطية؟\n   الإجابة النموذجية: منحنى تربيع عكسي يتناقص بسرعة ثم ببطء.\n2) (مستوى التطبيق) السؤال: ما وجه الشبه بين ‎E‎ لشحنة نقطية و‎g‎ لكتلة نقطية؟\n   الإجابة النموذجية: كلاهما يتناسب عكسيًا مع مربع البعد.\n3) (مستوى الاستدلال) السؤال: ما الفرق بين المجال المنتظم والشعاعي من حيث تغير الشدة؟\n   الإجابة النموذجية: المنتظم ثابت الشدة، والشعاعي تتناقص شدته بالابتعاد عن المصدر.", "1) (مستوى المعرفة) السؤال: اكتب معادلتي شدة المجال الكهربائي المنتظم والشعاعي.\n   الإجابة النموذجية: المنتظم: ‎E = V/d‎، الشعاعي: ‎E = Q/(4πε₀r²)‎.\n2) (مستوى التطبيق) السؤال: إذا كانت ‎E = 800 N/C‎ على بعد ‎0.10 m‎ من شحنة نقطية، فكم تكون على بعد ‎0.40 m‎؟\n   الإجابة النموذجية: ‎50 N/C‎.\n3) (مستوى الاستدلال) السؤال: احسب الشحنة التي تولد مجالًا ‎9.0 × 10⁴ N/C‎ على بعد ‎0.20 m‎.\n   الإجابة النموذجية: ‎Q = E × 4πε₀ × r² = 9.0 × 10⁴ × 0.040 ÷ 8.99 × 10⁹ = 4.0 × 10⁻⁷ C‎.", "إرشاد للطالب: إكمال نشاط 2-4 ص 48 والسؤالين 13 و14 وجدول المقارنة\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين المجال المنتظم والشعاعي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8"], "h": ["<ol class=\"ol\"><li>يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14<\/li><li>يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 2-4 «المجال الكهربائي حول شحنة كهربائية نقطية» والسؤالين 13 و14<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يقارن بين المجالات الكهربائية المنتظمة والشعاعية ومجالات الجاذبية في جدول<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يرسم التمثيل البياني لـ ‎E‎ مقابل ‎r‎ لشحنة نقطية<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>المجال المنتظم، المجال الشعاعي، مجال الجاذبية، جدول المقارنة، منحنى ‎E‎ مقابل ‎r‎.<\/p>", "<p>يعرض المعلم جدولًا فارغًا بثلاثة أعمدة (جاذبية، كهربائي منتظم، كهربائي شعاعي) ويطلب ملء صف «معادلة الشدة» خلال دقيقة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يدير ملء الصف الأول<br><span style=\"opacity:.85\">• الطالب: يكتبون المعادلات الثلاث<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — الاستراتيجيتان: التعلم الذاتي، التعلم التعاوني:<\/b> يوجه حل نشاط 2-4 (ص 48) والسؤالين 13 و14<br><span style=\"opacity:.85\">• الطالب: يحلون فرديًا ثم يقارنون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يوجه إكمال جدول المقارنة ورسم ‎E‎ مقابل ‎r‎<br><span style=\"opacity:.85\">• الطالب: يكملون الجدول ويرسمون المنحنى<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات على قانون كولوم<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما شكل منحنى ‎E‎ مقابل ‎r‎ لشحنة نقطية؟<\/td><td>منحنى تربيع عكسي يتناقص بسرعة ثم ببطء.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما وجه الشبه بين ‎E‎ لشحنة نقطية و‎g‎ لكتلة نقطية؟<\/td><td>كلاهما يتناسب عكسيًا مع مربع البعد.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما الفرق بين المجال المنتظم والشعاعي من حيث تغير الشدة؟<\/td><td>المنتظم ثابت الشدة، والشعاعي تتناقص شدته بالابتعاد عن المصدر.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب معادلتي شدة المجال الكهربائي المنتظم والشعاعي.<\/td><td>المنتظم: ‎E = V/d‎، الشعاعي: ‎E = Q/(4πε₀r²)‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>إذا كانت ‎E = 800 N/C‎ على بعد ‎0.10 m‎ من شحنة نقطية، فكم تكون على بعد ‎0.40 m‎؟<\/td><td>‎50 N/C‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب الشحنة التي تولد مجالًا ‎9.0 × 10⁴ N/C‎ على بعد ‎0.20 m‎.<\/td><td>‎Q = E × 4πε₀ × r² = 9.0 × 10⁴ × 0.040 ÷ 8.99 × 10⁹ = 4.0 × 10⁻⁷ C‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-4 ص 48 والسؤالين 13 و14 وجدول المقارنة<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين المجال المنتظم والشعاعي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=8<\/p>"]}]}, {"title": "الجهد وطاقة الوضع الكهربائية", "sb": "الموضوع 2-5 (الأسئلة 15–17)", "unit": "الوحدة 2: المجالات الكهربائية وقانون كولوم", "periods": [{"axis": "تعريف الجهد الكهربائي عند نقطة وجهد شحنة نقطية", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "1 من 3"], ["محور الحصة", "تعريف الجهد الكهربائي عند نقطة وجهد شحنة نقطية"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 (الأسئلة 15–17)"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة\n2. يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎\nمخرج تعليمي آخر: يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء الجهد الكهربائي", "- الكتاب\n- السبورة الذكية\n- جهاز الحاسب\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: محاكاة الجهد حول شحنة نقطية", "الجهد الكهربائي ‎V‎، الشغل لوحدة الشحنة، اللانهاية، ‎V = Q/(4πε₀r)‎، الفولت = ‎J/C‎، إشارة الجهد.", "يسأل المعلم: «تعلمنا جهد الجاذبية φ = ‎−GM/r‎؛ فما الذي تتوقعه لجهد شحنة نقطية؟ ولماذا قد يكون موجبًا هنا؟»", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يستنتجون التشابه ويتوقعون الإشارة الموجبة للشحنة الموجبة\n\n2. 15 دقيقة — استقصاء الجهد الكهربائي: ينفذ «استقصاء الجهد الكهربائي» بمحاكاة لتغير ‎V‎ مع ‎r‎ ويشرح التعريف والمعادلة\n• الطالب: يسجلون ‎V‎ عند أبعاد مختلفة ويتحققون من ‎V ∝ 1/r‎\n\n3. 12 دقيقة — التعلم التعاوني: يقدم مسائل حساب الجهد لشحنات موجبة وسالبة\n• الطالب: يحسبون في أزواج\n\n4. 8 دقائق: يدير السؤال المفصلي (الفرق بين الجهد وفرق الجهد) ثم التقويم الختامي\n• الطالب: يجيبون ويناقشون", "1) (مستوى المعرفة) السؤال: احسب الجهد على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.\n   الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.30 = 60 V‎.\n2) (مستوى التطبيق) السؤال: ما إشارة الجهد قرب شحنة سالبة؟\n   الإجابة النموذجية: سالبة.\n3) (مستوى الاستدلال) السؤال: ما الفرق بين الجهد عند نقطة وفرق الجهد بين نقطتين؟\n   الإجابة النموذجية: الجهد يُقاس نسبة إلى اللانهاية، وفرق الجهد هو الفرق بين جهدي نقطتين.", "1) (مستوى المعرفة) السؤال: ما وحدة الجهد الكهربائي بدلالة ‎J‎ و‎C‎؟\n   الإجابة النموذجية: ‎J/C (‎الفولت).\n2) (مستوى التطبيق) السؤال: كيف يتغير الجهد إذا تضاعف البعد عن الشحنة؟\n   الإجابة النموذجية: يقل إلى النصف.\n3) (مستوى الاستدلال) السؤال: احسب الجهد على سطح كرة موصلة نصف قطرها ‎0.10 m‎ تحمل ‎5.0 nC‎.\n   الإجابة النموذجية: ‎V = 8.99 × 10⁹ × 5.0 × 10⁻⁹ ÷ 0.10 = 450 V‎.", "إرشاد للطالب: مراجعة الموضوع 2-5 وكتابة تعريف الجهد الكهربائي\nإرشاد لولي الأمر: سؤال الابن عن تشابه جهد الجاذبية والجهد الكهربائي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9"], "h": ["<ol class=\"ol\"><li>يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/li><li>يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يعرّف الجهد الكهربائي عند نقطة بأنه الشغل المبذول لوحدة الشحنة الموجبة لنقل شحنة اختبارية صغيرة من اللانهاية إلى تلك النقطة<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم معادلة الجهد الكهربائي الناشئ عن شحنة نقطية ‎V = Q/(4πε₀r)‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يقارن بين جهد شحنة موجبة وجهد شحنة سالبة من حيث الإشارة<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">استقصاء الجهد الكهربائي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز الحاسب<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: محاكاة الجهد حول شحنة نقطية<\/span><\/div>", "<p>الجهد الكهربائي ‎V‎، الشغل لوحدة الشحنة، اللانهاية، ‎V = Q/(4πε₀r)‎، الفولت = ‎J/C‎، إشارة الجهد.<\/p>", "<p>يسأل المعلم: «تعلمنا جهد الجاذبية φ = ‎−GM/r‎؛ فما الذي تتوقعه لجهد شحنة نقطية؟ ولماذا قد يكون موجبًا هنا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يستنتجون التشابه ويتوقعون الإشارة الموجبة للشحنة الموجبة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 15 دقيقة — استقصاء الجهد الكهربائي:<\/b> ينفذ «استقصاء الجهد الكهربائي» بمحاكاة لتغير ‎V‎ مع ‎r‎ ويشرح التعريف والمعادلة<br><span style=\"opacity:.85\">• الطالب: يسجلون ‎V‎ عند أبعاد مختلفة ويتحققون من ‎V ∝ 1/r‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 12 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل حساب الجهد لشحنات موجبة وسالبة<br><span style=\"opacity:.85\">• الطالب: يحسبون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير السؤال المفصلي (الفرق بين الجهد وفرق الجهد) ثم التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون ويناقشون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>احسب الجهد على بعد ‎0.30 m‎ من شحنة ‎2.0 nC‎.<\/td><td>‎V = 8.99 × 10⁹ × 2.0 × 10⁻⁹ ÷ 0.30 = 60 V‎.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما إشارة الجهد قرب شحنة سالبة؟<\/td><td>سالبة.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ما الفرق بين الجهد عند نقطة وفرق الجهد بين نقطتين؟<\/td><td>الجهد يُقاس نسبة إلى اللانهاية، وفرق الجهد هو الفرق بين جهدي نقطتين.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما وحدة الجهد الكهربائي بدلالة ‎J‎ و‎C‎؟<\/td><td>‎J/C (‎الفولت).<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>كيف يتغير الجهد إذا تضاعف البعد عن الشحنة؟<\/td><td>يقل إلى النصف.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب الجهد على سطح كرة موصلة نصف قطرها ‎0.10 m‎ تحمل ‎5.0 nC‎.<\/td><td>‎V = 8.99 × 10⁹ × 5.0 × 10⁻⁹ ÷ 0.10 = 450 V‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-5 وكتابة تعريف الجهد الكهربائي<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشابه جهد الجاذبية والجهد الكهربائي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9<\/p>"]}, {"axis": "طاقة الوضع الكهربائية والعلاقة بين المجال وميل الجهد", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "2 من 3"], ["محور الحصة", "طاقة الوضع الكهربائية والعلاقة بين المجال وميل الجهد"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 (الأسئلة 15–17)"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎\n2. يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎\nمخرج تعليمي آخر: يحسب الشغل اللازم لتقريب شحنتين من بعضهما", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "طاقة الوضع الكهربائية، ‎Eₚ = QV‎، ‎Eₚ = Q₁Q₂/(4πε₀r)‎، ميل الجهد، ‎E = −ΔV/Δr‎، الشغل المبذول.", "يسأل المعلم: «لتقريب شحنتين موجبتين من بعضهما نحتاج إلى دفعهما؛ أين تذهب الطاقة التي بذلناها؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يستنتجون أنها تُخزن طاقة وضع\n\n2. 13 دقيقة — التعلم المبني على حل المشكلات: يشرح ‎Eₚ = QV‎ و‎Eₚ = Q₁Q₂/(4πε₀r)‎ وعلاقة المجال بميل الجهد\n• الطالب: يحسبون ‎Eₚ‎ لشحنتين ويرسمون ‎V‎ مقابل ‎r‎\n\n3. 14 دقيقة — الاستراتيجيتان: التعلم المبني على حل المشكلات، التعلم التعاوني: يقدم مسائل الشغل والطاقة ومثالًا لحساب ‎E‎ من ميل منحنى\n• الطالب: يحلون في مجموعات\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: احسب طاقة الوضع لشحنتين كل منهما ‎1.0 μC‎ بينهما ‎0.10 m‎.\n   الإجابة النموذجية: ‎Eₚ = 8.99 × 10⁹ × 10⁻¹² ÷ 0.10 = 0.090 J‎.\n2) (مستوى التطبيق) السؤال: احسب الشغل اللازم لتقريبهما إلى ‎0.050 m‎.\n   الإجابة النموذجية: ‎Eₚ‎ الجديدة = ‎0.18 J‎؛ الشغل = ‎0.090 J‎.\n3) (مستوى الاستدلال) السؤال: ماذا يمثل ميل منحنى ‎V‎ مقابل ‎r‎؟\n   الإجابة النموذجية: سالب شدة المجال الكهربائي ‎(E = −ΔV/Δr)‎.", "1) (مستوى المعرفة) السؤال: اكتب علاقة طاقة الوضع لشحنة في نقطة جهدها ‎V‎.\n   الإجابة النموذجية: ‎Eₚ = QV‎\n2) (مستوى التطبيق) السؤال: هل طاقة الوضع لشحنتين مختلفتين موجبة أم سالبة؟\n   الإجابة النموذجية: سالبة (تجاذب).\n3) (مستوى الاستدلال) السؤال: احسب ‎E‎ إذا تغير الجهد من ‎300 V‎ إلى ‎100 V‎ عبر مسافة ‎0.050 m‎ باتجاه المجال.\n   الإجابة النموذجية: ‎E = 200 ÷ 0.050 = 4.0 × 10³ V/m‎.", "إرشاد للطالب: مراجعة الموضوع 2-5 وحل مسائل طاقة الوضع\nإرشاد لولي الأمر: متابعة الابن في ربط الشغل بتغير طاقة الوضع\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9"], "h": ["<ol class=\"ol\"><li>يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎<\/li><li>يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب الشغل اللازم لتقريب شحنتين من بعضهما<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يصف ارتباط الجهد الكهربائي بطاقة الوضع الكهربائية لشحنتين نقطيتين ويستخدم المعادلة ‎Eₚ = Q₁Q₂/(4πε₀r)‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يربط شدة المجال بميل منحنى الجهد مقابل المسافة ‎(E = −ΔV/Δr)‎<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب الشغل اللازم لتقريب شحنتين من بعضهما<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\ b asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب علاقة طاقة الوضع لشحنة في نقطة جهدها ‎V‎.<\/td><td>‎Eₚ = QV‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>هل طاقة الوضع لشحنتين مختلفتين موجبة أم سالبة؟<\/td><td>سالبة (تجاذب).<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب ‎E‎ إذا تغير الجهد من ‎300 V‎ إلى ‎100 V‎ عبر مسافة ‎0.050 m‎ باتجاه المجال.<\/td><td>‎E = 200 ÷ 0.050 = 4.0 × 10³ V/m‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 2-5 وحل مسائل طاقة الوضع<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في ربط الشغل بتغير طاقة الوضع<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9<\/p>"]}, {"axis": "الاستقصاء العملي 2-1 ونشاط 2-5 ومراجعة الوحدة الثانية", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: المجالات الكهربائية وقانون كولوم"], ["الدرس", "الجهد وطاقة الوضع الكهربائية"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 2-1 ونشاط 2-5 ومراجعة الوحدة الثانية"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 2-5 + كتاب التجارب ص 51 و58"], ["دليل المعلم", "ص 57–62"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: الجهد الكهربائي ص 51؛ الاستقصاء العملي 2-1: التحقق من معادلة الجهد الكهربائي ص 58"]], "t": ["1. ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية\n2. يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم الذاتي\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة، بيانات نموذجية، ورق رسم", "التحقق التجريبي، ‎V‎ مقابل ‎1/r‎، الخط المستقيم المار بالأصل، الميل، ملخص الوحدة.", "يسأل المعلم: «إذا كانت ‎V ∝ 1/r‎، فما التمثيل البياني الذي يعطينا خطًا مستقيمًا للتحقق من ذلك؟»", "1. 4 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يقترحون رسم ‎V‎ مقابل ‎1/r‎\n\n2. 18 دقيقة — الاستراتيجيتان: التعلم بالاكتشاف، الاستقصاء العملي: يوجه تنفيذ الاستقصاء العملي 2-1 (ص 58) أو تحليل بياناته النموذجية\n• الطالب: يرسمون ‎V‎ مقابل ‎1/r‎ ويحسبون الميل ويستنتجون ‎Q‎\n\n3. 10 دقائق — التعلم الذاتي: يوجه حل نشاط 2-5 (ص 51) والأسئلة 15–17\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يختم بمسابقة المجموعات لمراجعة الوحدة الثانية وقائمة التقويم الذاتي\n• الطالب: يتنافسون ثم يقيّمون أنفسهم", "1) (مستوى المعرفة) السؤال: لماذا نرسم ‎V‎ مقابل ‎1/r‎؟\n   الإجابة النموذجية: لأن العلاقة ‎V = (Q/4πε₀) × 1/r‎ خطية، فيكون الرسم خطًا مستقيمًا مارًا بالأصل.\n2) (مستوى التطبيق) السؤال: ماذا يمثل ميل خط ‎V‎ مقابل ‎1/r‎؟\n   الإجابة النموذجية: ‎Q/(4πε₀)‎.\n3) (مستوى الاستدلال) السؤال: إذا كان الميل ‎9.0 V m‎، فما الشحنة؟\n   الإجابة النموذجية: ‎Q = 9.0 ÷ 8.99 × 10⁹ = 1.0 × 10⁻⁹ C‎.", "1) (مستوى المعرفة) السؤال: ما الدليل على صحة العلاقة ‎V ∝ 1/r‎ من الرسم؟\n   الإجابة النموذجية: أن يكون خطًا مستقيمًا مارًا بنقطة الأصل.\n2) (مستوى التطبيق) السؤال: اذكر مصدرًا للخطأ في الاستقصاء.\n   الإجابة النموذجية: تسرب الشحنة إلى الهواء الرطب، أو عدم دقة قياس البعد من المركز.\n3) (مستوى الاستدلال) السؤال: قيّم تعلمك في الوحدة الثانية وحدد موضوعًا للمراجعة مع خطة.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية مثل حل أسئلة نهاية الوحدة المرتبطة به.", "إرشاد للطالب: كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-5 ص 51 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثانية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9"], "h": ["<ol class=\"ol\"><li>ينفذ الاستقصاء العملي 2-1 «التحقق من معادلة الجهد الكهربائي» أو يحلل بياناته النموذجية<\/li><li>يحل نشاط 2-5 «الجهد الكهربائي» والأسئلة 15–17<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><t ;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات لمراجعة الوحدة الثانية وقائمة التقويم الذاتي<br><span style=\"opacity:.85\">• الطالب: يتنافسون ثم يقيّمون أنفسهم<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا نرسم ‎V‎ مقابل ‎1/r‎؟<\/td><td>لأن العلاقة ‎V = (Q/4πε₀) × 1/r‎ خطية، فيكون الرسم خطًا مستقيمًا مارًا بالأصل.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ماذا يمثل ميل خط ‎V‎ مقابل ‎1/r‎؟<\/td><td>‎Q/(4πε₀)‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>إذا كان الميل ‎9.0 V m‎، فما الشحنة؟<\/td><td>‎Q = 9.0 ÷ 8.99 × 10⁹ = 1.0 × 10⁻⁹ C‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الدليل على صحة العلاقة ‎V ∝ 1/r‎ من الرسم؟<\/td><td>أن يكون خطًا مستقيمًا مارًا بنقطة الأصل.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>اذكر مصدرًا للخطأ في الاستقصاء.<\/td><td>تسرب الشحنة إلى الهواء الرطب، أو عدم دقة قياس البعد من المركز.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>قيّم تعلمك في الوحدة الثانية وحدد موضوعًا للمراجعة مع خطة.<\/td><td>إجابة شخصية تتضمن موضوعًا محددًا وخطوة عملية مثل حل أسئلة نهاية الوحدة المرتبطة به.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-5 ص 51 وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثانية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=9<\/p>"]}]}, {"title": "التيار الكهربائي", "sb": "الموضوع 3-1 (الأسئلة 1–11)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "التيار تدفق لحاملات شحنة مكممة والعلاقة ‎Q = It‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "التيار الكهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "التيار تدفق لحاملات شحنة مكممة والعلاقة ‎Q = It‎"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 3-1 (الأسئلة 1–11)"], ["دليل المعلم", "ص 75–80"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التيار الكهربائي والشحنة الكهربائية ص 70؛ نشاط 3-3: حاملات الشحنات الكهربائية ص 71"]], "t": ["1. يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة\n2. يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن\nمخرج تعليمي آخر: يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: أميتر ودائرة بسيطة", "التيار الكهربائي، حاملات الشحنة، الشحنة المكممة، الشحنة الأولية ‎e‎، ‎Q = It‎، ‎Q = Ne‎، الأمبير، الكولوم.", "يعرض المعلم صورة دائرة كهربائية ويطلب رسم مخططها، ثم يسأل: «نقول \"يتدفق التيار\"؛ فما الذي يتدفق فعلًا في السلك؟» (فكرة التمهيد أ).", "1. 5 دقائق — التعلم بالاكتشاف: يعرض الصورة ويطرح السؤال ومهام بداية الوحدة\n• الطالب: يرسمون المخطط ويقارنون رسومهم ويقترحون أن الشحنات هي ما يتدفق\n\n2. 13 دقيقة — التعلم بالاكتشاف: ينفذ «مدخل إلى التيار الكهربائي كتدفق شحنة كهربائية»: حاملات الشحنة في الفلزات والمحاليل وتكميم الشحنة\n• الطالب: يكتبون التعريف ويحددون حاملات الشحنة في أوساط مختلفة\n\n3. 14 دقيقة — التعلم التعاوني: ينفذ «استخدام المعادلة ‎Q = It»‎ ومسائل ‎Q = Ne‎\n• الطالب: يحلون مسائل متدرجة في أزواج\n\n4. 8 دقائق: يدير السؤال المفصلي (‎Q = It‎ و‎Q = Nq‎) ثم التقويم الختامي\n• الطالب: يجيبون ويناقشون", "1) (مستوى المعرفة) السؤال: ما حاملات الشحنة في الفلزات؟\n   الإجابة النموذجية: الإلكترونات الحرة.\n2) (مستوى التطبيق) السؤال: احسب الشحنة المارة لتيار ‎0.50 A‎ مدة دقيقتين.\n   الإجابة النموذجية: ‎Q = 0.50 × 120 = 60 C‎.\n3) (مستوى الاستدلال) السؤال: كم إلكترونًا يمر في الحالة السابقة؟\n   الإجابة النموذجية: ‎N = 60 ÷ 1.6 × 10⁻¹⁹ = 3.75 × 10²⁰‎ إلكترون.", "1) (مستوى المعرفة) السؤال: لماذا يُعد قول «تدفق التيار» غير دقيق؟\n   الإجابة النموذجية: لأن التيار هو معدل تدفق الشحنة، فالشحنة هي التي تتدفق لا التيار.\n2) (مستوى التطبيق) السؤال: ما المقصود بأن الشحنة مكممة؟\n   الإجابة النموذجية: أنها توجد بمضاعفات صحيحة لشحنة الإلكترون ‎e‎.\n3) (مستوى الاستدلال) السؤال: احسب الزمن اللازم لمرور ‎1.0 × 10²⁰‎ إلكترون بتيار ‎0.40 A‎.\n   الإجابة النموذجية: ‎Q = 16 C‎؛ ‎t = 40 s‎.", "إرشاد للطالب: مراجعة الموضوع 3-1 وحل مسائل ‎Q = It‎\nإرشاد لولي الأمر: الحديث مع الابن عن الفرق بين التيار والشحنة بتشبيه تدفق الماء\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10"], "h": ["<ol class=\"ol\"><li>يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة<\/li><li>يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يذكر أن التيار الكهربائي هو تدفق لحاملات شحنة كهربائية مكممة<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يستخدم المعادلة ‎Q = It‎ لحساب الشحنة أو التيار أو الزمن<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب عدد الإلكترونات المارة في مقطع موصل خلال زمن معين باستخدام ‎Q = Ne‎<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: أميتر ودائرة بسيطة<\/span><\/div>", "<p>التيار الكهربائي، حاملات الشحنة، الشحنة المكممة، الشحنة الأولية ‎e‎، ‎Q = It‎، ‎Q = Ne‎، الأمبير، الكولوم.<\/p>", "<p>يعرض المعلم صورة دائرة كهربائية ويطلب رسم مخططها، ثم يسأل: «نقول \"يتدفق التيار\"؛ فما الذي يتدفق فعلًا في السلك؟» (فكرة التمهيد أ).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يعرض الصورة ويطرح السؤال ومهام بداية الوحدة<br><span style=\"opacity:.85\">• الطالب: يرسمون المخطط ويقارنون رسومهم ويقترحون أن الشحنات هي ما يتدفق<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالاكتشاف:<\/b> ينفذ «مدخل إلى التيار الكهربائي كتدفق شحنة كهربائية»: حاملات الشحنة في الفلزات والمحاليل وتكميم الشحنة<br><span style=\"opacity:.85\">• الطالب: يكتبون التعريف ويحددون حاملات الشحنة في أوساط مختلفة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> ينفذ «استخدام المعادلة ‎Q = It»‎ ومسائل ‎Q = Ne‎<br><span style=\"opacity:.85\">• الطالب: يحلون مسائل متدرجة في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير السؤال المفصلي (‎Q = It‎ و‎Q = Nq‎) ثم التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون ويناقشون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما حاملات الشحنة في الفلزات؟<\/td><td>الإلكترونات الحرة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الشحنة المارة لتيار ‎0.50 A‎ مدة دقيقتين.<\/td><td>‎Q = 0.50 × 120 = 60 C‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>كم إلكترونًا يمر في الحالة السابقة؟<\/td><td>‎N = 60 ÷ 1.6 × 10⁻¹⁹ = 3.75 × 10²⁰‎ إلكترون.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا يُعد قول «تدفق التيار» غير دقيق؟<\/td><td>لأن التيار هو معدل تدفق الشحنة، فالشحنة هي التي تتدفق لا التيار.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما المقصود بأن الشحنة مكممة؟<\/td><td>أنها توجد بمضاعفات صحيحة لشحنة الإلكترون ‎e‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب الزمن اللازم لمرور ‎1.0 × 10²⁰‎ إلكترون بتيار ‎0.40 A‎.<\/td><td>‎Q = 16 C‎؛ ‎t = 40 s‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-1 وحل مسائل ‎Q = It‎<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الفرق بين التيار والشحنة بتشبيه تدفق الماء<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10<\/p>"]}, {"axis": "العلاقة ‎I = nAvq‎ وسرعة الانجراف", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "التيار الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "العلاقة ‎I = nAvq‎ وسرعة الانجراف"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "الموضوع 3-1 + كتاب التجارب ص 70 و71"], ["دليل المعلم", "ص 75–80"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التيار الكهربائي والشحنة الكهربائية ص 70؛ نشاط 3-3: حاملات الشحنات الكهربائية ص 71"]], "t": ["1. يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي\n2. يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة\nمخرج تعليمي آخر: يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "كثافة حاملات الشحنة ‎n‎، مساحة المقطع ‎A‎، سرعة الانجراف ‎v‎، ‎I = nAvq‎، الموصلات وأشباه الموصلات.", "يسأل المعلم: «سرعة انجراف الإلكترونات في سلك أقل من ‎1 mm/s‎، فلماذا يضيء المصباح فور الضغط على المفتاح؟»", "1. 5 دقائق — التعلم التعاوني: يطرح السؤال\n• الطالب: يقترحون أن الإلكترونات موجودة في كل السلك وتبدأ الحركة معًا\n\n2. 13 دقيقة — التعلم بالنمذجة: ينفذ «استنتاج المعادلة ‎I = nAvq‎ واستخدامها»\n• الطالب: يستنتجون العلاقة بنموذج أسطوانة من السلك\n\n3. 14 دقيقة — التعلم التعاوني: يوجه حل نشاط 3-2 (ص 70) ونشاط 3-3 (ص 71)\n• الطالب: يحلون ويقارنون الموصلات بأشباه الموصلات\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: احسب سرعة الانجراف في سلك نحاس (‎n = 8.5 × 10²⁸ m⁻³‎، ‎A = 1.0 × 10⁻⁶ m²‎) يحمل ‎1.0 A‎.\n   الإجابة النموذجية: ‎v = 1.0 ÷ (8.5 × 10²⁸ × 1.0 × 10⁻⁶ × 1.6 × 10⁻¹⁹) = 7.4 × 10⁻⁵ m/s‎.\n2) (مستوى التطبيق) السؤال: لماذا يضيء المصباح فورًا رغم بطء الانجراف؟\n   الإجابة النموذجية: لأن المجال الكهربائي ينتشر في الدائرة بسرعة كبيرة فتبدأ الإلكترونات الموجودة في كل أجزاء السلك بالحركة معًا.\n3) (مستوى الاستدلال) السؤال: كيف تتغير سرعة الانجراف إذا نقصت مساحة المقطع إلى النصف مع ثبات التيار؟\n   الإجابة النموذجية: تتضاعف.", "1) (مستوى المعرفة) السؤال: ماذا يمثل ‎n‎ في المعادلة ‎I = nAvq‎؟\n   الإجابة النموذجية: عدد حاملات الشحنة لكل وحدة حجم.\n2) (مستوى التطبيق) السؤال: لماذا تكون سرعة الانجراف في أشباه الموصلات أكبر منها في الفلزات للتيار نفسه؟\n   الإجابة النموذجية: لأن ‎n‎ في أشباه الموصلات أصغر بكثير.\n3) (مستوى الاستدلال) السؤال: سلكان من المادة نفسها يحملان التيار نفسه، قطر الأول ضعف الثاني. قارن سرعتي الانجراف.\n   الإجابة النموذجية: مساحة الأول أربعة أضعاف، فسرعة الانجراف فيه ربع سرعتها في الثاني.", "إرشاد للطالب: إكمال نشاطي 3-2 و3-3 ص 70 و71\nإرشاد لولي الأمر: سؤال الابن عن سبب إضاءة المصباح فورًا رغم بطء الإلكترونات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=10"], "h": ["<ol class=\"ol\"><li>يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي<\/li><li>يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستنتج المعادلة ‎I = nAvq‎ ويستخدمها لموصل حامل لتيار كهربائي<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يفسر صغر سرعة انجراف الإلكترونات رغم إضاءة المصباح فور غلق الدائرة<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحل نشاطي 3-2 و3-3 في التيار وحاملات الشحنة<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>كثافة حاملات الشحنة ‎n‎، مساحة المقطع ‎A‎، سرعة الانجراف ‎v‎، ‎I = nAvq‎، الموصلات وأشباه الموصلات.<\/p>", "<p>يسأل المعلم: «سرعة انجراف الإلكترونات في سلك أقل من ‎1 mm/s‎، فلماذا يضيء المصباح فور الضغط على المفتاح؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يقترحون أن الإلكترونات موجودة في كل السلك وتبدأ الحركة معًا<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم بالنمذجة:<\/b> ينفذ «استنتاج المعادلة ‎I = nAvq‎ واستخدامها»<br><span style=\"opacity:.85\">• الطالب: يستنتجون العلاقة بنموذج أسطوانة من السلك<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يوجه حل نشاط 3-2 (ص 70) ونشاط 3-3 (ص 71)<br><span style=\"opacity:.85\">• الطالب: يحلون ويقارنون الموصلات بأشباه الموصلات<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"l لة 1–11)"], ["دليل المعلم", "ص 75–81"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية ص 67"]], "t": ["1. يعرّف فرق الجهد الكهربائي عبر أي مكون بأنه الطاقة المنقولة لكل وحدة شحنة ويستخدم المعادلة ‎V = W/Q‎\n2. يعرّف الفولت بدلالة الجول والكولوم\nمخرج تعليمي آخر: يحسب القدرة الكهربائية ‎P = VI‎ ويربطها بمعدل تحول الطاقة", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: فولتميتر ودائرة بسيطة", "فرق الجهد ‎V‎، الطاقة المنقولة ‎W‎، ‎V = W/Q‎، الفولت = ‎J/C‎، القدرة ‎P = VI‎.", "يسأل المعلم: «بطارية مكتوب عليها ‎9 V‎؛ ماذا يعني هذا الرقم من حيث الطاقة؟» ويستقبل التفسيرات.", "1. 5 دقائق — التعلم بالاكتشاف: يطرح السؤال\n• الطالب: يقترحون علاقة بين الجهد والطاقة\n\n2. 13 دقيقة — الاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف: ينفذ «تعريف فرق الجهد الكهربائي» ويشرح ‎V = W/Q‎ والفولت\n• الطالب: يكتبون التعريف ويحسبون أمثلة\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل على ‎W = QV‎ و‎P = VI‎\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: عرّف فرق الجهد الكهربائي.\n   الإجابة النموذجية: الطاقة المنقولة (المحولة من كهربائية إلى صور أخرى) لكل وحدة شحنة تمر عبر المكون.\n2) (مستوى التطبيق) السؤال: احسب فرق الجهد إذا نقلت ‎3.0 C‎ طاقة مقدارها ‎12 J‎.\n   الإجابة النموذجية: ‎V = 4.0 V‎.\n3) (مستوى الاستدلال) السؤال: ماذا يعني فرق جهد ‎9 V‎ عبر مكون؟\n   الإجابة النموذجية: أن كل كولوم يمر عبره ينقل ‎9 J‎ من الطاقة.", "1) (مستوى المعرفة) السؤال: عرّف الفولت.\n   الإجابة النموذجية: فرق الجهد عندما تُنقل طاقة مقدارها جول واحد لكل كولوم من الشحنة.\n2) (مستوى التطبيق) السؤال: احسب الطاقة المحولة في مصباح فرق الجهد عبره ‎12 V‎ يمر فيه ‎2.0 A‎ مدة دقيقة.\n   الإجابة النموذجية: ‎Q = 120 C‎؛ ‎W = 1440 J‎.\n3) (مستوى الاستدلال) السؤال: احسب قدرة المصباح السابق.\n   الإجابة النموذجية: ‎P = VI = 24 W‎.", "إرشاد للطالب: مراجعة الموضوع 3-2 وحل مسائل ‎V = W/Q‎\nإرشاد لولي ا pan style=\"opacity:.85\">• الطالب: يكتبون التعريف ويحسبون أمثلة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل على ‎W = QV‎ و‎P = VI‎<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>عرّف فرق الجهد الكهربائي.<\/td><td>الطاقة المنقولة (المحولة من كهربائية إلى صور أخرى) لكل وحدة شحنة تمر عبر المكون.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب فرق الجهد إذا نقلت ‎3.0 C‎ طاقة مقدارها ‎12 J‎.<\/td><td>‎V = 4.0 V‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ماذا يعني فرق جهد ‎9 V‎ عبر مكون؟<\/td><td>أن كل كولوم يمر عبره ينقل ‎9 J‎ من الطاقة.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>عرّف الفولت.<\/td><td>فرق الجهد عندما تُنقل طاقة مقدارها جول واحد لكل كولوم من الشحنة.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب الطاقة المحولة في مصباح فرق الجهد عبره ‎12 V‎ يمر فيه ‎2.0 A‎ مدة دقيقة.<\/td><td>‎Q = 120 C‎؛ ‎W = 1440 J‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب قدرة المصباح السابق.<\/td><td>‎P = VI = 24 W‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-2 وحل مسائل ‎V = W/Q‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن معنى الرقم المكتوب على البطاريات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=11<\/p>"]}, {"axis": "الفرق بين فرق الجهد والقوة الدافعة الكهربائية ونشاط 3-1", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "فرق الجهد الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "الفرق بين فرق الجهد والقوة الدافعة الكهربائية ونشاط 3-1"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-2 + كتاب التجارب ص 67"], ["دليل المعلم", "ص 75–81"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية ص 67"]], "t": ["1. يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)\n2. يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»\nمخرج تعليمي آخر: يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "القوة الدافعة الكهربائية ‎e.m.f‎.، فرق الجهد، اتجاه تحول الطاقة، المصدر، المكون المستهلك، المقاومة ‎R = V/I‎.", "يعطي المعلم كل طالب ورقة ويتحداه أن يكتب في سطرين الفرق بين «فرق الجهد» و«القوة الدافعة الكهربائية» قبل الشرح.", "1. 5 دقائق — التعلم التعاوني: يجمع الإجابات المكتوبة سريعًا\n• الطالب: يكتبون الفرق المتوقع\n\n2. 12 دقيقة — الاستراتيجيتان: التعلم التعاوني، التعلم الذاتي: يشرح الفرق باتجاه تحول الطاقة ويصحح المفاهيم الخاطئة\n• الطالب: يعيدون صياغة إجاباتهم الأولى\n\n3. 15 دقيقة — التعلم التعاوني: يوجه حل نشاط 3-1 (ص 67) والأسئلة المتبقية من 1–11\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يختم بمسابقة المجموعات على التيار وفرق الجهد\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: عرّف القوة الدافعة الكهربائية.\n   الإجابة النموذجية: الطاقة المحولة من صور أخرى إلى طاقة كهربائية لكل وحدة شحنة تمر عبر المصدر.\n2) (مستوى التطبيق) السؤال: في البطارية، أي الكميتين تصف عملها: فرق الجهد أم القوة الدافعة؟\n   الإجابة النموذجية: القوة الدافعة الكهربائية.\n3) (مستوى الاستدلال) السؤال: صحح: «فرق الجهد عبر البطارية هو دائمًا قوتها الدافعة».\n   الإجابة النموذجية: غير دقيق؛ فرق الجهد بين طرفي البطارية أقل من قوتها الدافعة عند مرور تيار بسبب مقاومتها الداخلية.", "1) (مستوى المعرفة) السؤال: ما الفرق في اتجاه تحول الطاقة بين ‎e.m.f‎. وفرق الجهد؟\n   الإجابة النموذجية: ‎e.m.f‎.: من صور أخرى إلى كهربائية؛ فرق الجهد: من كهربائية إلى صور أخرى.\n2) (مستوى التطبيق) السؤال: هل للقوة الدافعة الكهربائية وحدة القوة؟\n   الإجابة النموذجية: لا، وحدتها الفولت مثل فرق الجهد.\n3) (مستوى الاستدلال) السؤال: احسب المقاومة لمكون يمر فيه ‎0.25 A‎ وفرق الجهد عبره ‎6.0 V‎.\n   الإجابة النموذجية: ‎R = 24 Ω‎.", "إرشاد للطالب: إكمال نشاط 3-1 ص 67 والأسئلة المتبقية\nإرشاد لولي الأمر: متابعة الابن في التمييز بين المصطلحين بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=11"], "h": ["<ol class=\"ol\"><li>يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)<\/li><li>يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يميز بين فرق الجهد (تحول الطاقة الكهربائية إلى صور أخرى) والقوة الدافعة الكهربائية (تحول صور أخرى إلى كهربائية)<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل نشاط 3-1 «المقاومة، وفرق الجهد الكهربائي، والقوة الدافعة الكهربائية»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يصحح الاستخدام الخاطئ لمصطلحي فرق الجهد والقوة الدافعة في عبارات معطاة<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>القوة الدافعة الكهربائية ‎e.m.f‎.، فرق الجهد، اتجاه تحول الطاقة، المصدر، المكون المستهلك، المقاومة ‎R = V/I‎.<\/p>", "<p>يعطي المعلم كل طالب ورقة ويتحداه أن يكتب في سطرين الفرق بين «فرق الجهد» و«القوة الدافعة الكهربائية» قبل الشرح.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم التعاوني:<\/b> يجمع الإجابات المكتوبة سريعًا<br><span style=\"opacity:.85\">• الطالب: يكتبون الفرق المتوقع<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 12 دقيقة — الاستراتيجيتان: التعلم التعاوني، التعلم الذاتي:<\/b> يشرح الفرق باتجاه تحول الطاقة ويصحح المفاهيم الخاطئة<br><span style=\"opacity:.85\">• الطالب: يعيدون صياغة إجاباتهم الأولى<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 15 دقيقة — التعلم التعاوني:<\/b> يوجه حل نشاط 3-1 (ص 67) والأسئلة المتبقية من 1–11<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يختم بمسابقة المجموعات على التيار وفرق الجهد<br><span style=\"opacity:.85\">• الطالب: يتنافسون<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>عرّف القوة الدافعة الكهربائية.<\/td><td>الطاقة المحولة من صور أخرى إلى طاقة كهربائية لكل وحدة شحنة تمر عبر المصدر.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>في البطارية، أي الكميتين تصف عملها: فرق الجهد أم القوة الدافعة؟<\/td><td>القوة الدافعة الكهربائية.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>صحح: «فرق الجهد عبر البطارية هو دائمًا قوتها الدافعة».<\/td><td>غير دقيق؛ فرق الجهد بين طرفي البطارية أقل من قوتها الدافعة عند مرور تيار بسبب مقاومتها الداخلية.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الفرق في اتجاه تحول الطاقة بين ‎e.m.f‎. وفرق الجهد؟<\/td><td>‎e.m.f‎.: من صور أخرى إلى كهربائية؛ فرق الجهد: من كهربائية إلى صور أخرى.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>هل للقوة الدافعة الكهربائية وحدة القوة؟<\/td><td>لا، وحدتها الفولت مثل فرق الجهد.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب المقاومة لمكون يمر فيه ‎0.25 A‎ وفرق الجهد عبره ‎6.0 V‎.<\/td><td>‎R = 24 Ω‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-1 ص 67 والأسئلة المتبقية<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التمييز بين المصطلحين بدقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=11<\/p>"]}]}, {"title": "المقاومة النوعية", "sb": "الموضوع 3-3 (الأسئلة 12–15)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "المقاومة النوعية والعلاقة ‎R = ρL/A‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "المقاومة النوعية"], ["الحصة", "1 من 3"], ["محور الحصة", "المقاومة النوعية والعلاقة ‎R = ρL/A‎"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-3 (الأسئلة 12–15)"], ["دليل المعلم", "ص 80–85"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-4 ص 74؛ نشاط 3-5 ص 77؛ الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي ص 100"]], "t": ["1. يستخدم المعادلة ‎R = ρL/A‎ لحساب المقاومة أو المقاومة النوعية\n2. يميز بين المقاومة (خاصية للجسم) والمقاومة النوعية (خاصية للمادة)\nمخرج تعليمي آخر: يتنبأ بأثر تغيير الطول أو القطر على مقاومة سلك", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: أسلاك من المادة نفسها بأطوال وأقطار مختلفة وأوميتر", "المقاومة ‎R‎، المقاومة النوعية ρ، الطول ‎L‎، مساحة المقطع ‎A‎، Ω ‎m‎، الموصلات والعوازل.", "يعرض المعلم سلكين من النحاس أحدهما قصير سميك والآخر طويل رفيع ويسأل: «أيهما أكبر مقاومة؟ وهل المقاومة النوعية لهما مختلفة؟» (فكرة التمهيد).", "1. 5 دقائق — التعلم بالاكتشاف: يعرض السلكين ويطرح السؤال\n• الطالب: يتوقعون ويبررون\n\n2. 13 دقيقة — التعلم التعاوني: يشرح ‎R = ρL/A‎ ووحدة ρ والفرق بين المفهومين مع قياس بالأوميتر\n• الطالب: يسجلون القياسات ويتحققون من العلاقة\n\n3. 14 دقيقة — التعلم التعاوني: يقدم مسائل حساب ‎R‎ وρ وتغيير الأبعاد\n• الطالب: يحلون في أزواج\n\n4. 8 دقائق: يدير التقويم الختامي\n• الطالب: يجيبون فرديًا", "1) (مستوى المعرفة) السؤال: اكتب علاقة المقاومة بالمقاومة النوعية.\n   الإجابة النموذجية: ‎R = ρL/A‎\n2) (مستوى التطبيق) السؤال: ما وحدة المقاومة النوعية؟\n   الإجابة النموذجية: Ω ‎m‎.\n3) (مستوى الاستدلال) السؤال: ماذا يحدث لمقاومة سلك إذا ضوعف طوله وقطره معًا؟\n   الإجابة النموذجية: الطول ×2 والمساحة ×4، فتصبح المقاومة نصف قيمتها.", "1) (مستوى المعرفة) السؤال: هل تعتمد المقاومة النوعية على أبعاد السلك؟\n   الإجابة النموذجية: لا، تعتمد على نوع المادة (ودرجة الحرارة).\n2) (مستوى التطبيق) السؤال: احسب مقاومة سلك طوله ‎2.0 m‎ ومساحة مقطعه ‎2.0 × 10⁻⁷ m²‎ ومقاومته النوعية ‎4.9 × 10⁻⁷ Ω m‎.\n   الإجابة النموذجية: ‎R = 4.9 Ω‎.\n3) (مستوى الاستدلال) السؤال: احسب طول سلك نيكروم (‎ρ = 1.1 × 10⁻⁶ Ω m‎، ‎A = 1.0 × 10⁻⁷ m²‎) مقاومته 22 Ω.\n   الإجابة النموذجية: ‎L = RA/ρ = 2.0 m‎.", "إرشاد للطالب: مراجعة الموضوع 3-3 وحل مسائل ‎R = ρL/A‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين المقاومة والمقاومة النوعية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلة ‎R = ρL/A‎ لحساب المقاومة أو المقاومة النوعية<\/li><li>يميز بين المقاومة (خاصية للجسم) والمقاومة النوعية (خاصية للمادة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر تغيير الطول أو القطر على مقاومة سلك<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يستخدم المعادلة ‎R = ρL/A‎ لحساب المقاومة أو المقاومة النوعية<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يميز بين المقاومة (خاصية للجسم) والمقاومة النوعية (خاصية للمادة)<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يتنبأ بأثر تغيير الطول أو القطر على مقاومة سلك<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: أسلاك من المادة نفسها بأطوال وأقطار مختلفة وأوميتر<\/span><\/div>", "<p>المقاومة ‎R‎، المقاومة النوعية ρ، الطول ‎L‎، مساحة المقطع ‎A‎، Ω ‎m‎، الموصلات والعوازل.<\/p>", "<p>يعرض المعلم سلكين من النحاس أحدهما قصير سميك والآخر طويل رفيع ويسأل: «أيهما أكبر مقاومة؟ وهل المقاومة النوعية لهما مختلفة؟» (فكرة التمهيد).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم بالاكتشاف:<\/b> يعرض السلكين ويطرح السؤال<br><span style=\"opacity:.85\">• الطالب: يتوقعون ويبررون<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. 13 دقيقة — التعلم التعاوني:<\/b> يشرح ‎R = ρL/A‎ ووحدة ρ والفرق بين المفهومين مع قياس بالأوميتر<br><span style=\"opacity:.85\">• الطالب: يسجلون القياسات ويتحققون من العلاقة<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 14 دقيقة — التعلم التعاوني:<\/b> يقدم مسائل حساب ‎R‎ وρ وتغيير الأبعاد<br><span style=\"opacity:.85\">• الطالب: يحلون في أزواج<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 8 دقائق:<\/b> يدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون فرديًا<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>اكتب علاقة المقاومة بالمقاومة النوعية.<\/td><td>‎R = ρL/A‎<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ما وحدة المقاومة النوعية؟<\/td><td>Ω ‎m‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>ماذا يحدث لمقاومة سلك إذا ضوعف طوله وقطره معًا؟<\/td><td>الطول ×2 والمساحة ×4، فتصبح المقاومة نصف قيمتها.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>هل تعتمد المقاومة النوعية على أبعاد السلك؟<\/td><td>لا، تعتمد على نوع المادة (ودرجة الحرارة).<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>احسب مقاومة سلك طوله ‎2.0 m‎ ومساحة مقطعه ‎2.0 × 10⁻⁷ m²‎ ومقاومته النوعية ‎4.9 × 10⁻⁷ Ω m‎.<\/td><td>‎R = 4.9 Ω‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب طول سلك نيكروم (‎ρ = 1.1 × 10⁻⁶ Ω m‎، ‎A = 1.0 × 10⁻⁷ m²‎) مقاومته 22 Ω.<\/td><td>‎L = RA/ρ = 2.0 m‎.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> مراجعة الموضوع 3-3 وحل مسائل ‎R = ρL/A‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين المقاومة والمقاومة النوعية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12<\/p>"]}, {"axis": "الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "المقاومة النوعية"], ["الحصة", "2 من 3"], ["محور الحصة", "الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-3 + كتاب التجارب ص 100"], ["دليل المعلم", "ص 80–85"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-4 ص 74؛ نشاط 3-5 ص 77؛ الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي ص 100"]], "t": ["1. يقيس قطر السلك بالميكرومتر وطوله ومقاومته لأطوال مختلفة\n2. يرسم ‎R‎ مقابل ‎L‎ ويحسب المقاومة النوعية من الميل\nمخرج تعليمي آخر: يحسب عدم اليقين في قيمة ρ ويقيّم مصادر الخطأ", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: سلك مقاومة، ميكرومتر، مسطرة مترية، أميتر وفولتميتر أو أوميتر، مصدر جهد منخفض", "الميكرومتر، القياسات المتكررة، ‎R‎ مقابل ‎L‎، الميل = ρ/‎A‎، عدم اليقين، الخطأ الصفري.", "يعرض المعلم ميكرومترًا ويسأل: «لماذا لا تكفي المسطرة لقياس قطر سلك رفيع؟ وكم مرة يجب أن نقيس القطر؟»", "1. 4 دقائق — الاستقصاء العملي: يعرض الأداة ويطرح السؤال\n• الطالب: يقترحون قياسات متكررة في مواضع مختلفة\n\n2. 22 دقيقة — الاستراتيجيتان: الاستقصاء العملي، التعلم التعاوني: يوجه تنفيذ الاستقصاء العملي 3-1 (ص 100): قياس القطر وقياس ‎R‎ لأطوال مختلفة\n• الطالب: يقيسون ويسجلون البيانات في جدول\n\n3. 8 دقائق — التعلم بالاكتشاف: يوجه رسم ‎R‎ مقابل ‎L‎ وحساب الميل وρ\n• الطالب: يرسمون ويحسبون ρ\n\n4. 6 دقائق: يناقش مصادر الخطأ ويدير التقويم الختامي\n• الطالب: يجيبون ويقترحون تحسينات", "1) (مستوى المعرفة) السؤال: لماذا يُقاس القطر في عدة مواضع واتجاهات؟\n   الإجابة النموذجية: لأن السلك قد لا يكون منتظم المقطع، وأخذ المتوسط يقلل الخطأ العشوائي.\n2) (مستوى التطبيق) السؤال: ماذا يمثل ميل خط ‎R‎ مقابل ‎L‎؟\n   الإجابة النموذجية: ρ/‎A‎.\n3) (مستوى الاستدلال) السؤال: احسب ρ إذا كان الميل ‎25 Ω/m‎ والقطر ‎0.50 mm‎.\n   الإجابة النموذجية: ‎A = 1.96 × 10⁻⁷ m²‎؛ ρ = ‎25 × 1.96 × 10⁻⁷ = 4.9 × 10⁻⁶ Ω m‎.", "1) (مستوى المعرفة) السؤال: ما الخطأ الصفري للميكرومتر؟\n   الإجابة النموذجية: قراءة غير صفرية عند إغلاق فكيه تمامًا، ويجب طرحها من القراءات.\n2) (مستوى التطبيق) السؤال: لماذا يُستخدم تيار صغير في الاستقصاء؟\n   الإجابة النموذجية: لتجنب تسخين السلك الذي يغير مقاومته.\n3) (مستوى الاستدلال) السؤال: اقترح تحسينين لدقة قيمة ρ.\n   الإجابة النموذجية: قياس القطر في مواضع أكثر، واستخدام مدى أطوال أكبر، وتقليل زمن مرور التيار.", "إرشاد للطالب: كتابة تقرير الاستقصاء 3-1 مع الرسم البياني وحساب ρ\nإرشاد لولي الأمر: التأكد من رسم الابن البياني ورسم خط أفضل مطابقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12 px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. 8 دقائق — التعلم بالاكتشاف:<\/b> يوجه رسم ‎R‎ مقابل ‎L‎ وحساب الميل وρ<br><span style=\"opacity:.85\">• الطالب: يرسمون ويحسبون ρ<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4. 6 دقائق:<\/b> يناقش مصادر الخطأ ويدير التقويم الختامي<br><span style=\"opacity:.85\">• الطالب: يجيبون ويقترحون تحسينات<\/span><\/p><\/div>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>لماذا يُقاس القطر في عدة مواضع واتجاهات؟<\/td><td>لأن السلك قد لا يكون منتظم المقطع، وأخذ المتوسط يقلل الخطأ العشوائي.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>ماذا يمثل ميل خط ‎R‎ مقابل ‎L‎؟<\/td><td>ρ/‎A‎.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>احسب ρ إذا كان الميل ‎25 Ω/m‎ والقطر ‎0.50 mm‎.<\/td><td>‎A = 1.96 × 10⁻⁷ m²‎؛ ρ = ‎25 × 1.96 × 10⁻⁷ = 4.9 × 10⁻⁶ Ω m‎.<\/td><\/tr><\/table>", "<table class=\"tb asx\"><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><tr><td class=\"lvA a1\">مستوى المعرفة<\/td><td>ما الخطأ الصفري للميكرومتر؟<\/td><td>قراءة غير صفرية عند إغلاق فكيه تمامًا، ويجب طرحها من القراءات.<\/td><\/tr><tr><td class=\"lvA a2\">مستوى التطبيق<\/td><td>لماذا يُستخدم تيار صغير في الاستقصاء؟<\/td><td>لتجنب تسخين السلك الذي يغير مقاومته.<\/td><\/tr><tr><td class=\"lvA a3\">مستوى الاستدلال<\/td><td>اقترح تحسينين لدقة قيمة ρ.<\/td><td>قياس القطر في مواضع أكثر، واستخدام مدى أطوال أكبر، وتقليل زمن مرور التيار.<\/td><\/tr><\/table>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 3-1 مع الرسم البياني وحساب ρ<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من رسم الابن البياني ورسم خط أفضل مطابقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12<\/p>"]}, {"axis": "نشاطا 3-4 و3-5 ومسائل المقاومة النوعية المتقدمة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "المقاومة النوعية"], ["الحصة", "3 من 3"], ["محور الحصة", "نشاطا 3-4 و3-5 ومسائل المقاومة النوعية المتقدمة"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "الموضوع 3-3 + كتاب التجارب ص 74 و77"], ["دليل المعلم", "ص 80–85"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-4 ص 74؛ نشاط 3-5 ص 77؛ الاستقصاء العملي 3-1: المقاومة النوعية لسلك فلزي ص 100"]], "t": ["1. يحل نشاط 3-4 «المقاومة النوعية والمقاومة: الأساسيات» ونشاط 3-5 «مسائل متقدمة»\n2. يحل الأسئلة 12–15 في كتاب الطالب\nمخرج تعليمي آخر: يحسب نسب المقاومات لأسلاك تختلف في أكثر من بعد واحد", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "النسب، تغيير عدة أبعاد معًا، شد السلك (ثبات الحجم)، المسائل المتعددة الخطوات.", "يسأل المعلم: «إذا شددنا سلكًا حتى تضاعف طوله دون أن تتغير كتلته، فماذا يحدث لمقاومته؟»", "1. 5 دقائق — التعلم المبني على حل المشكلات: يطرح السؤال\n• الطالب: يتوقعون ويناقشون ثبات الحجم\n\n2. 15 دقيقة — التعلم التعاوني: يوجه حل نشاط 3-4 (ص 74) ثم نشاط 3-5 (ص 77)\n• الطالب: يحلون فرديًا ثم في أزواج\n\n3. 12 دقيقة — التعلم المبني على حل المشكلات: يحل مع الطلبة مسألة شد السلك ويوجه الأسئلة 12–15\n• الطالب: يحلون ويعرضون\n\n4. 8 دقائق: يختم بمسابقة المجموعات على المقاومة النوعية\n• الطالب: يتنافسون", "1) (مستوى المعرفة) السؤال: عند شد سلك حتى يتضاعف طوله بثبات الحجم، كيف تتغير المساحة؟\n   الإجابة النموذجية: تقل إلى النصف.\n2) (مستوى التطبيق) السؤال: كيف تتغير المقاومة في الحالة السابقة؟\n   الإجابة النموذجية: تصبح أربعة أضعاف (‎L×2‎ و‎A÷2‎).\n3) (مستوى الاستدلال) السؤال: سلكان من المادة نفسها، الأول طوله ضعف الثاني وقطره ضعفه. أوجد ‎R₁/R₂‎.\n   الإجابة النموذجية: ‎R₁/R₂ = 2 ÷ 4 = 0.5‎.", "1) (مستوى المعرفة) السؤال: لماذا يبقى الحجم ثابتًا عند شد السلك؟\n   الإجابة النموذجية: لأن كمية المادة (الكتلة والكثافة) لا تتغير.\n2) (مستوى التطبيق) السؤال: سلك نحاس وسلك ألومنيوم بالأبعاد نفسها؛ أيهما أقل مقاومة إذا كانت ρ للنحاس أصغر؟\n   الإجابة النموذجية: النحاس.\n3) (مستوى الاستدلال) السؤال: سلك مقاومته 10 Ω قُطّع إلى خمسة أجزاء متساوية ووُصلت على التوازي. ما المقاومة المكافئة؟\n   الإجابة النموذجية: كل جزء 2 Ω، والخمسة على التوازي = 0.40 Ω.", "إرشاد للطالب: إكمال نشاطي 3-4 و3-5 والأسئلة 12–15\nإرشاد لولي الأمر: متابعة الابن في حل المسائل متعددة الخطوات بترتيب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/physics/?l=12"], "h": ["<ol class=\"ol\"><li>يحل نشاط 3-4 «المقاومة النوعية والمقاومة: الأساسيات» ونشاط 3-5 «مسائل متقدمة»<\/li><li>يحل الأسئلة 12–15 في كتاب الطالب<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب نسب المقاومات لأسلاك تختلف في أكثر من بعد واحد<\/div>", "<table class=\"tb lvl\"><tr><th>المخرج<\/th><th>نصه<\/th><th>المستوى<\/th><\/tr><tr><td class=\"c\">المخرج 1<\/td><td>يحل نشاط 3-4 «المقاومة النوعية والمقاومة: الأساسيات» ونشاط 3-5 «مسائل متقدمة»<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج 2<\/td><td>يحل الأسئلة 12–15 في كتاب الطالب<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td class=\"c\">المخرج الآخر<\/td><td>يحسب نسب المقاومات لأسلاك تختلف في أكثر من بعد واحد<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>النسب، تغيير عدة أبعاد معًا، شد السلك (ثبات الحجم)، المسائل المتعددة الخطوات.<\/p>", "<p>يسأل المعلم: «إذا شددنا سلكًا حتى تضاعف طوله دون أن تتغير كتلته، فماذا يحدث لمقاومته؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. 5 دقائق — التعلم المبني على ح
