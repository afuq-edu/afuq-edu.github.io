: ["1. يحل نشاط 3-4 «المقاومة النوعية والمقاومة: الأساسيات» ونشاط 3-5 «مسائل متقدمة»\n2. يحل الأسئلة 12–15 في كتاب الطالب\nمخرج تعليمي آخر: يحسب نسب المقاومات لأسلاك تختلف في أكثر من بعد واحد", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "النسب، تغيير عدة أبعاد معًا، شد السلك (ثبات الحجم)، المسائل المتعددة الخطوات.", "يسأل المعلم: «إذا شددنا سلكًا حتى تضاعف طوله دون أن تتغير كتلته، فماذا يحدث لمقاومته؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يطرح السؤال\nالطالب: يتوقعون ويناقشون ثبات الحجم\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 3-4 (ص 74) ثم نشاط 3-5 (ص 77)\nالطالب: يحلون فرديًا ثم في أزواج\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يحل مع الطلبة مسألة شد السلك ويوجه الأسئلة 12–15\nالطالب: يحلون ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المقاومة النوعية\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: عند شد سلك حتى يتضاعف طوله بثبات الحجم، كيف تتغير المساحة؟\n   الإجابة النموذجية: تقل إلى النصف.\n2) (المستوى المتوقع) السؤال: كيف تتغير المقاومة في الحالة السابقة؟\n   الإجابة النموذجية: تصبح أربعة أضعاف (‎L×2‎ و‎A÷2‎).\n3) (المستوى المتقدم) السؤال: سلكان من المادة نفسها، الأول طوله ضعف الثاني وقطره ضعفه. أوجد ‎R₁/R₂‎.\n   الإجابة النموذجية: ‎R₁/R₂ = 2 ÷ 4 = 0.5‎.", "1) (مستوى الدعم) السؤال: لماذا يبقى الحجم ثابتًا عند شد السلك؟\n   الإجابة النموذجية: لأن كمية المادة (الكتلة والكثافة) لا تتغير.\n2) (المستوى المتوقع) السؤال: سلك نحاس وسلك ألومنيوم بالأبعاد نفسها؛ أيهما أقل مقاومة إذا كانت ρ للنحاس أصغر؟\n   الإجابة النموذجية: النحاس.\n3) (المستوى المتقدم) السؤال: سلك مقاومته 10 Ω قُطّع إلى خمسة أجزاء متساوية ووُصلت على التوازي. ما المقاومة المكافئة؟\n   الإجابة النموذجية: كل جزء 2 Ω، والخمسة على التوازي = 0.40 Ω.", "إرشاد للطالب: إكمال نشاطي 3-4 و3-5 والأسئلة 12–15\nإرشاد لولي الأمر: متابعة الابن في حل المسائل متعددة الخطوات بترتيب"], "h": ["<ol class=\"ol\"><li>يحل نشاط 3-4 «المقاومة النوعية والمقاومة: الأساسيات» ونشاط 3-5 «مسائل متقدمة»</li><li>يحل الأسئلة 12–15 في كتاب الطالب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب نسب المقاومات لأسلاك تختلف في أكثر من بعد واحد</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 3-4 «المقاومة النوعية والمقاومة: الأساسيات» ونشاط 3-5 «مسائل متقدمة»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل الأسئلة 12–15 في كتاب الطالب</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب نسب المقاومات لأسلاك تختلف في أكثر من بعد واحد</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>", "<p>النسب، تغيير عدة أبعاد معًا، شد السلك (ثبات الحجم)، المسائل المتعددة الخطوات.</p>", "<p>يسأل المعلم: «إذا شددنا سلكًا حتى تضاعف طوله دون أن تتغير كتلته، فماذا يحدث لمقاومته؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يطرح السؤال</td><td>يتوقعون ويناقشون ثبات الحجم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه حل نشاط 3-4 (ص 74) ثم نشاط 3-5 (ص 77)</td><td>يحلون فرديًا ثم في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على حل المشكلات</span><br>يحل مع الطلبة مسألة شد السلك ويوجه الأسئلة 12–15</td><td>يحلون ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على المقاومة النوعية</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عند شد سلك حتى يتضاعف طوله بثبات الحجم، كيف تتغير المساحة؟</td><td>تقل إلى النصف.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف تتغير المقاومة في الحالة السابقة؟</td><td>تصبح أربعة أضعاف (‎L×2‎ و‎A÷2‎).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>سلكان من المادة نفسها، الأول طوله ضعف الثاني وقطره ضعفه. أوجد ‎R₁/R₂‎.</td><td>‎R₁/R₂ = 2 ÷ 4 = 0.5‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يبقى الحجم ثابتًا عند شد السلك؟</td><td>لأن كمية المادة (الكتلة والكثافة) لا تتغير.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>سلك نحاس وسلك ألومنيوم بالأبعاد نفسها؛ أيهما أقل مقاومة إذا كانت ρ للنحاس أصغر؟</td><td>النحاس.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>سلك مقاومته 10 Ω قُطّع إلى خمسة أجزاء متساوية ووُصلت على التوازي. ما المقاومة المكافئة؟</td><td>كل جزء 2 Ω، والخمسة على التوازي = 0.40 Ω.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاطي 3-4 و3-5 والأسئلة 12–15</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في حل المسائل متعددة الخطوات بترتيب</p>"]}]}, {"title": "قانونا كيرشوف", "sb": "الموضوع 3-4 (الأسئلة 16–23)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "القانون الأول لكيرشوف وحفظ الشحنة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "1 من 5"], ["محور الحصة", "القانون الأول لكيرشوف وحفظ الشحنة"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية\n2. يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع\nمخرج تعليمي آخر: يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: دائرة بأميترات عند نقطة تفرع", "القانون الأول لكيرشوف، نقطة التفرع، حفظ الشحنة، مجموع التيارات الداخلة = مجموع الخارجة.", "يعرض المعلم دائرة فيها ثلاثة أميترات عند نقطة تفرع (قراءتان معلومتان) ويسأل: «كم تتوقع قراءة الأميتر الثالث؟ ولماذا؟» (فكرة التمهيد أ).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض الدائرة ويطرح السؤال\nالطالب: يتوقعون ويبررون\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح نص القانون الأول وارتباطه بحفظ الشحنة ويتحقق عمليًا بالأميترات\nالطالب: يسجلون القراءات ويتحققون من القانون\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم شبكات تفرع لحساب التيارات المجهولة\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اذكر نص القانون الأول لكيرشوف.\n   الإجابة النموذجية: مجموع التيارات الداخلة إلى نقطة تفرع يساوي مجموع التيارات الخارجة منها.\n2) (المستوى المتوقع) السؤال: على أي قانون حفظ يعتمد القانون الأول؟\n   الإجابة النموذجية: حفظ الشحنة الكهربائية.\n3) (المستوى المتقدم) السؤال: يدخل نقطة تفرع ‎3.0 A‎ و‎1.5 A‎، ويخرج منها ‎2.0 A‎ وتيار مجهول. احسبه.\n   الإجابة النموذجية: ‎3.0 + 1.5 − 2.0 = 2.5 A‎.", "1) (مستوى الدعم) السؤال: لماذا لا تتراكم الشحنة عند نقطة التفرع؟\n   الإجابة النموذجية: لأن الشحنة لا تفنى ولا تُستحدث، فكل ما يدخل النقطة يخرج منها.\n2) (المستوى المتوقع) السؤال: يتفرع تيار ‎0.60 A‎ إلى فرعين، أحدهما ‎0.25 A‎. ما التيار في الآخر؟\n   الإجابة النموذجية: ‎0.35 A‎.\n3) (المستوى المتقدم) السؤال: في نقطة تفرع: داخل ‎2.0 A‎ و‎0.5 A‎، وخارج ‎1.2 A‎ و‎I₁‎ و‎I₂‎ حيث ‎I₁ = 2I₂‎. احسب ‎I₁‎ و‎I₂‎.\n   الإجابة النموذجية: ‎I₁ + I₂ = 1.3 ← I₂ = 0.43 A‎ و‎I₁ = 0.87 A‎.", "إرشاد للطالب: مراجعة الموضوع 3-4 وحل مسائل القانون الأول\nإرشاد لولي الأمر: تشبيه نقطة التفرع مع الابن بتفرع الماء في الأنابيب"], "h": ["<ol class=\"ol\"><li>يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية</li><li>يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر القانون الأول لكيرشوف ويشرح أنه نتيجة لقانون حفظ الشحنة الكهربائية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يطبق القانون الأول لحساب تيارات مجهولة عند نقاط التفرع</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا لا تتراكم الشحنة عند نقطة التفرع</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: دائرة بأميترات عند نقطة تفرع</span></div>", "<p>القانون الأول لكيرشوف، نقطة التفرع، حفظ الشحنة، مجموع التيارات الداخلة = مجموع الخارجة.</p>", "<p>يعرض المعلم دائرة فيها ثلاثة أميترات عند نقطة تفرع (قراءتان معلومتان) ويسأل: «كم تتوقع قراءة الأميتر الثالث؟ ولماذا؟» (فكرة التمهيد أ).</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يعرض الدائرة ويطرح السؤال</td><td>يتوقعون ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يشرح نص القانون الأول وارتباطه بحفظ الشحنة ويتحقق عمليًا بالأميترات</td><td>يسجلون القراءات ويتحققون من القانون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم شبكات تفرع لحساب التيارات المجهولة</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر نص القانون الأول لكيرشوف.</td><td>مجموع التيارات الداخلة إلى نقطة تفرع يساوي مجموع التيارات الخارجة منها.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>على أي قانون حفظ يعتمد القانون الأول؟</td><td>حفظ الشحنة الكهربائية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>يدخل نقطة تفرع ‎3.0 A‎ و‎1.5 A‎، ويخرج منها ‎2.0 A‎ وتيار مجهول. احسبه.</td><td>‎3.0 + 1.5 − 2.0 = 2.5 A‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا لا تتراكم الشحنة عند نقطة التفرع؟</td><td>لأن الشحنة لا تفنى ولا تُستحدث، فكل ما يدخل النقطة يخرج منها.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>يتفرع تيار ‎0.60 A‎ إلى فرعين، أحدهما ‎0.25 A‎. ما التيار في الآخر؟</td><td>‎0.35 A‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>في نقطة تفرع: داخل ‎2.0 A‎ و‎0.5 A‎، وخارج ‎1.2 A‎ و‎I₁‎ و‎I₂‎ حيث ‎I₁ = 2I₂‎. احسب ‎I₁‎ و‎I₂‎.</td><td>‎I₁ + I₂ = 1.3 ← I₂ = 0.43 A‎ و‎I₁ = 0.87 A‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 3-4 وحل مسائل القانون الأول</p><p><b>إرشاد لولي الأمر:</b> تشبيه نقطة التفرع مع الابن بتفرع الماء في الأنابيب</p>"]}, {"axis": "القانون الثاني لكيرشوف وحفظ الطاقة", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "2 من 5"], ["محور الحصة", "القانون الثاني لكيرشوف وحفظ الطاقة"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة\n2. يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة\nمخرج تعليمي آخر: يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية", "القانون الثاني لكيرشوف، المسار المغلق، مجموع القوى الدافعة = مجموع فروق الجهد، حفظ الطاقة، الإشارات.", "يسأل المعلم: «إذا سرت حول مسار مغلق في دائرة وعدت إلى النقطة نفسها، فهل يتغير جهدك؟ ماذا يقول ذلك عن الطاقة؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يستنتجون أن التغير الكلي في الجهد صفر\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح نص القانون الثاني وارتباطه بحفظ الطاقة وقاعدة الإشارات\nالطالب: يطبقونه على دائرة بسيطة ببطارية ومقاومتين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم دوائر بمسار أو مسارين لحساب فروق الجهد\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اذكر نص القانون الثاني لكيرشوف.\n   الإجابة النموذجية: في أي مسار مغلق، مجموع القوى الدافعة الكهربائية يساوي مجموع فروق الجهد ‎(IR)‎.\n2) (المستوى المتوقع) السؤال: على أي قانون حفظ يعتمد القانون الثاني؟\n   الإجابة النموذجية: حفظ الطاقة.\n3) (المستوى المتقدم) السؤال: بطارية ‎12 V‎ موصولة بمقاومتين على التوالي، فرق الجهد عبر الأولى ‎7.5 V‎. احسب فرق الجهد عبر الثانية.\n   الإجابة النموذجية: ‎12 − 7.5 = 4.5 V‎.", "1) (مستوى الدعم) السؤال: ما مجموع التغيرات في الجهد حول مسار مغلق؟\n   الإجابة النموذجية: صفر.\n2) (المستوى المتوقع) السؤال: مسار مغلق فيه بطاريتان متعاكستان ‎9.0 V‎ و‎3.0 V‎ ومقاومة 2.0 Ω. احسب التيار.\n   الإجابة النموذجية: ‎I = (9.0 − 3.0) ÷ 2.0 = 3.0 A‎.\n3) (المستوى المتقدم) السؤال: بطارية ‎6.0 V‎ ومقاومتان 4.0 Ω و2.0 Ω على التوالي. احسب فرق الجهد عبر كل منهما.\n   الإجابة النموذجية: ‎I = 1.0 A‎؛ ‎V₁ = 4.0 V‎ و‎V₂ = 2.0 V‎.", "إرشاد للطالب: حل مسائل القانون الثاني ومراجعة قاعدة الإشارات\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «المسار الدائري الذي يعود إلى نقطة البداية»"], "h": ["<ol class=\"ol\"><li>يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة</li><li>يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر القانون الثاني لكيرشوف ويشرح أنه نتيجة لقانون حفظ الطاقة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يطبق القانون الثاني في مسار مغلق لحساب فرق جهد أو قوة دافعة مجهولة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يطبق قاعدة الإشارات عند المرور بمصدر أو مقاومة في اتجاه معين</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span></div>", "<p>القانون الثاني لكيرشوف، المسار المغلق، مجموع القوى الدافعة = مجموع فروق الجهد، حفظ الطاقة، الإشارات.</p>", "<p>يسأل المعلم: «إذا سرت حول مسار مغلق في دائرة وعدت إلى النقطة نفسها، فهل يتغير جهدك؟ ماذا يقول ذلك عن الطاقة؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يطرح السؤال</td><td>يستنتجون أن التغير الكلي في الجهد صفر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يشرح نص القانون الثاني وارتباطه بحفظ الطاقة وقاعدة الإشارات</td><td>يطبقونه على دائرة بسيطة ببطارية ومقاومتين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم دوائر بمسار أو مسارين لحساب فروق الجهد</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر نص القانون الثاني لكيرشوف.</td><td>في أي مسار مغلق، مجموع القوى الدافعة الكهربائية يساوي مجموع فروق الجهد ‎(IR)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>على أي قانون حفظ يعتمد القانون الثاني؟</td><td>حفظ الطاقة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>بطارية ‎12 V‎ موصولة بمقاومتين على التوالي، فرق الجهد عبر الأولى ‎7.5 V‎. احسب فرق الجهد عبر الثانية.</td><td>‎12 − 7.5 = 4.5 V‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما مجموع التغيرات في الجهد حول مسار مغلق؟</td><td>صفر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>مسار مغلق فيه بطاريتان متعاكستان ‎9.0 V‎ و‎3.0 V‎ ومقاومة 2.0 Ω. احسب التيار.</td><td>‎I = (9.0 − 3.0) ÷ 2.0 = 3.0 A‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>بطارية ‎6.0 V‎ ومقاومتان 4.0 Ω و2.0 Ω على التوالي. احسب فرق الجهد عبر كل منهما.</td><td>‎I = 1.0 A‎؛ ‎V₁ = 4.0 V‎ و‎V₂ = 2.0 V‎.</td></tr></table>", "<p><b>إرشاد للطالب:</b> حل مسائل القانون الثاني ومراجعة قاعدة الإشارات</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه «المسار الدائري الذي يعود إلى نقطة البداية»</p>"]}, {"axis": "استنتاج المقاومة المكافئة للتوالي والتوازي من قانوني كيرشوف", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "3 من 5"], ["محور الحصة", "استنتاج المقاومة المكافئة للتوالي والتوازي من قانوني كيرشوف"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 (الأسئلة 16–23)"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني\n2. يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول\nمخرج تعليمي آخر: يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات", "المخرج 1: تحليل\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية", "المقاومة المكافئة، التوالي ‎R = R₁ + R₂‎، التوازي ‎1/R = 1/R₁ + 1/R₂‎، الشبكات المختلطة.", "يسأل المعلم: «درست قوانين التوالي والتوازي سابقًا؛ هل تستطيع إثباتها الآن باستخدام قانوني كيرشوف فقط؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يطرح التحدي\nالطالب: يقترحون البدء بالقانون الثاني للتوالي\n2) (14 دقيقة: من الدقيقة 5 إلى 19)\nالاستراتيجية: التعلم بالنمذجة\nالمعلم: يوجه الطلبة لاستنتاج القانونين خطوة بخطوة\nالطالب: يكتبون الاستنتاجين في الدفتر\n3) (13 دقيقة: من الدقيقة 19 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم شبكات مختلطة لحساب المقاومة المكافئة\nالطالب: يحسبون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: استنتج معادلة التوالي من القانون الثاني.\n   الإجابة النموذجية: ‎E = IR₁ + IR₂ = I(R₁ + R₂) = IR ← R = R₁ + R₂‎.\n2) (المستوى المتوقع) السؤال: استنتج معادلة التوازي من القانون الأول.\n   الإجابة النموذجية: ‎I = I₁ + I₂ ← V/R = V/R₁ + V/R₂ ← 1/R = 1/R₁ + 1/R₂‎.\n3) (المستوى المتقدم) السؤال: احسب المقاومة المكافئة لـ 6.0 Ω و3.0 Ω على التوازي.\n   الإجابة النموذجية: ‎R = 2.0 Ω‎.", "1) (مستوى الدعم) السؤال: ما المقاومة المكافئة لـ 4.0 Ω و6.0 Ω على التوالي؟\n   الإجابة النموذجية: 10 Ω.\n2) (المستوى المتوقع) السؤال: احسب المقاومة المكافئة لـ 4.0 Ω موصولة على التوالي مع مجموعة 6.0 Ω و3.0 Ω على التوازي.\n   الإجابة النموذجية: ‎4.0 + 2.0 = 6.0 Ω‎.\n3) (المستوى المتقدم) السؤال: لماذا تكون المقاومة المكافئة لمجموعة على التوازي أقل من أصغر مقاومة فيها؟\n   الإجابة النموذجية: لأن إضافة فروع توفر مسارات إضافية للتيار فيزداد التيار الكلي عند فرق الجهد نفسه.", "إرشاد للطالب: كتابة استنتاجي معادلتي التوالي والتوازي وحل ثلاث شبكات مختلطة\nإرشاد لولي الأمر: متابعة الابن في الاستنتاج الرياضي المنظم"], "h": ["<ol class=\"ol\"><li>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني</li><li>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوالي من القانون الثاني</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستنتج معادلة المقاومة المكافئة للمقاومات الموصولة على التوازي من القانون الأول</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب المقاومة المكافئة لشبكة مختلطة من المقاومات</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span></div>", "<p>المقاومة المكافئة، التوالي ‎R = R₁ + R₂‎، التوازي ‎1/R = 1/R₁ + 1/R₂‎، الشبكات المختلطة.</p>", "<p>يسأل المعلم: «درست قوانين التوالي والتوازي سابقًا؛ هل تستطيع إثباتها الآن باستخدام قانوني كيرشوف فقط؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يطرح التحدي</td><td>يقترحون البدء بالقانون الثاني للتوالي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–19</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالنمذجة</span><br>يوجه الطلبة لاستنتاج القانونين خطوة بخطوة</td><td>يكتبون الاستنتاجين في الدفتر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">19–32</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم شبكات مختلطة لحساب المقاومة المكافئة</td><td>يحسبون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>استنتج معادلة التوالي من القانون الثاني.</td><td>‎E = IR₁ + IR₂ = I(R₁ + R₂) = IR ← R = R₁ + R₂‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>استنتج معادلة التوازي من القانون الأول.</td><td>‎I = I₁ + I₂ ← V/R = V/R₁ + V/R₂ ← 1/R = 1/R₁ + 1/R₂‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب المقاومة المكافئة لـ 6.0 Ω و3.0 Ω على التوازي.</td><td>‎R = 2.0 Ω‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقاومة المكافئة لـ 4.0 Ω و6.0 Ω على التوالي؟</td><td>10 Ω.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب المقاومة المكافئة لـ 4.0 Ω موصولة على التوالي مع مجموعة 6.0 Ω و3.0 Ω على التوازي.</td><td>‎4.0 + 2.0 = 6.0 Ω‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تكون المقاومة المكافئة لمجموعة على التوازي أقل من أصغر مقاومة فيها؟</td><td>لأن إضافة فروع توفر مسارات إضافية للتيار فيزداد التيار الكلي عند فرق الجهد نفسه.</td></tr></table>", "<p><b>إرشاد للطالب:</b> كتابة استنتاجي معادلتي التوالي والتوازي وحل ثلاث شبكات مختلطة</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في الاستنتاج الرياضي المنظم</p>"]}, {"axis": "أحاجي قانوني كيرشوف ونشاط 3-6", "n": 4, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "قانونا كيرشوف"], ["الحصة", "4 من 5"], ["محور الحصة", "أحاجي قانوني كيرشوف ونشاط 3-6"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "الموضوع 3-4 + كتاب التجارب ص 80"], ["دليل المعلم", "ص 85–89"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-6: قانونا كيرشوف ص 80؛ نشاط 3-7: تطبيق قانون كيرشوف الثاني على دوائر كهربائية ص 84"]], "t": ["1. يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق\n2. يحل نشاط 3-6 «قانونا كيرشوف»\nمخرج تعليمي آخر: يصمم «أحجية» دائرة لزملائه مع حلها", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "- التعلم المبني على اللعب\n- التعلم التعاوني\n- الأحاجي (الألغاز)", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: بطاقات أحاجي دوائر، كتاب التجارب العملية والأنشطة", "المعادلات الآنية، تحديد اتجاه التيارات، المسارات المغلقة المستقلة، التحقق من الحل.", "يوزع المعلم بطاقات «أحاجي قانوني كيرشوف»: دوائر فيها قيم مفقودة، ويعلن أن الفائز من يكمل أكبر عدد صحيح في عشر دقائق.", "1) (4 دقائق: من الدقيقة 0 إلى 4)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يشرح قواعد نشاط الأحاجي\nالطالب: يستعدون في مجموعات\n2) (14 دقيقة: من الدقيقة 4 إلى 18)\nالاستراتيجيتان: الأحاجي (الألغاز)، التعلم المبني على اللعب\nالمعلم: ينفذ «أحاجي (ألغاز) في قانوني كيرشوف»\nالطالب: يحسبون القيم المفقودة باستخدام القانونين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 3-6 (ص 80)\nالطالب: يحلون فرديًا ثم يقارنون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يكلف كل مجموعة بتصميم أحجية لمجموعة أخرى\nالطالب: يصممون أحجية ويحلون أحجية زملائهم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كم معادلة مستقلة نحتاج لحل دائرة بتيارين مجهولين؟\n   الإجابة النموذجية: معادلتان مستقلتان.\n2) (المستوى المتوقع) السؤال: ماذا تعني الإشارة السالبة للتيار المحسوب؟\n   الإجابة النموذجية: أن الاتجاه الحقيقي للتيار عكس الاتجاه المفترض.\n3) (المستوى المتقدم) السؤال: دائرة بمسارين: بطارية ‎12 V‎ مع 4.0 Ω، ثم فرعان 6.0 Ω و3.0 Ω على التوازي. احسب التيار في فرع 6.0 Ω.\n   الإجابة النموذجية: ‎I‎ الكلي = ‎2.0 A‎؛ فرق الجهد على الفرعين = ‎4.0 V‎؛ ‎I(6 Ω) = 0.67 A‎.", "1) (مستوى الدعم) السؤال: ما الخطوة الأولى في حل دائرة بقانوني كيرشوف؟\n   الإجابة النموذجية: تحديد اتجاهات افتراضية للتيارات في كل فرع.\n2) (المستوى المتوقع) السؤال: في الدائرة السابقة احسب التيار في فرع 3.0 Ω.\n   الإجابة النموذجية: ‎4.0 ÷ 3.0 = 1.3 A‎.\n3) (المستوى المتقدم) السؤال: كيف تتحقق من صحة حلك؟\n   الإجابة النموذجية: بتطبيق القانون الأول عند نقطة التفرع ‎(0.67 + 1.33 = 2.0 A)‎ والقانون الثاني على مسار آخر.", "إرشاد للطالب: إكمال نشاط 3-6 ص 80 وحل أحجية زميلك\nإرشاد لولي الأمر: تشجيع الابن على التحقق من الحلول بالقانونين"], "h": ["<ol class=\"ol\"><li>يطبق قانوني كيرشوف معًا لحل دوائر تحتوي أكثر من مسار مغلق</li><li>يحل نشاط 3-6 «قانونا كيرشوف»</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم «أحجية» دائرة لزملائه مع حلها</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class= "1. يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق\n2. يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23\nمخرج تعليمي آخر: يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- أخرى: بطارية، مقاومات، فولتميتر رقمي، أسلاك", "التحقق التجريبي، مقاومة الأسلاك، المقاومة الداخلية، دقة الفولتميتر، المسار المغلق.", "يسأل المعلم: «إذا جمعنا قراءات الفولتميتر عبر كل المقاومات في مسار، هل ستساوي قراءة البطارية تمامًا؟ لماذا قد تختلف؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يتوقعون فروقًا صغيرة ويقترحون أسبابًا\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجية: التعلم التعاوني\nالمعلم: ينفذ «تطوير عملي للقانون الثاني لكيرشوف» بقياس فروق الجهد\nالطالب: يقيسون ويسجلون ويجمعون القراءات\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 3-7 (ص 84) والأسئلة 16–23\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يدير السؤال المفصلي (شبكة مقاومات) ثم يختم بمسابقة المجموعات\nالطالب: يجيبون ويتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا قد يقل مجموع فروق الجهد المقيسة قليلًا عن القوة الدافعة؟\n   الإجابة النموذجية: بسبب الجهد المفقود في المقاومة الداخلية للبطارية وفي الأسلاك.\n2) (المستوى المتوقع) السؤال: كيف يُوصل الفولتميتر لقياس فرق الجهد عبر مقاومة؟\n   الإجابة النموذجية: على التوازي معها.\n3) (المستوى المتقدم) السؤال: قيست فروق الجهد ‎3.1 V‎ و‎2.8 V‎ في مسار بطاريته ‎6.0 V‎. ما الجهد المفقود؟\n   الإجابة النموذجية: ‎6.0 − 5.9 = 0.1 V‎.", "1) (مستوى الدعم) السؤال: ما الذي تتحقق منه هذه التجربة؟\n   الإجابة النموذجية: القانون الثاني لكيرشوف (حفظ الطاقة).\n2) (المستوى المتوقع) السؤال: لماذا يفضل الفولتميتر الرقمي عالي المقاومة؟\n   الإجابة النموذجية: كي لا يسحب تيارًا يذكر فلا يغير الدائرة.\n3) (المستوى المتقدم) السؤال: اقترح تعديلًا يقلل الفرق بين المجموع والقوة الدافعة.\n   الإجابة النموذجية: استخدام أسلاك قصيرة سميكة ومصدر مقاومته الداخلية صغيرة، أو قياس فرق الجهد بين طرفي البطارية أثناء مرور التيار بدل قوتها الدافعة.", "إرشاد للطالب: كتابة تقرير التحقق العملي وإكمال نشاط 3-7 ص 84 والأسئلة 16–23\nإرشاد لولي الأمر: الاطلاع مع الابن على تقريره ومناقشة أسباب الفروق"], "h": ["<ol class=\"ol\"><li>يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق</li><li>يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يتحقق عمليًا من القانون الثاني لكيرشوف بقياس فروق الجهد في مسار مغلق</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 3-7 «تطبيق قانون كيرشوف الثاني على دوائر كهربائية» والأسئلة 16–23</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر الفروق الصغيرة بين مجموع القراءات والقوة الدافعة</td><td class=\"lv\">تقييم</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: بطارية، مقاومات، فولتميتر رقمي، أسلاك</span></div>", "<p>التحقق التجريبي، مقاومة الأسلاك، المقاومة الداخلية، دقة الفولتميتر، المسار المغلق.</p>", "<p>يسأل المعلم: «إذا جمعنا قراءات الفولتميتر عبر كل المقاومات في مسار، هل ستساوي قراءة البطارية تمامًا؟ لماذا قد تختلف؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يطرح السؤال</td><td>يتوقعون فروقًا صغيرة ويقترحون أسبابًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>ينفذ «تطوير عملي للقانون الثاني لكيرشوف» بقياس فروق الجهد</td><td>يقيسون ويسجلون ويجمعون القراءات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يوجه حل نشاط 3-7 (ص 84) والأسئلة 16–23</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يدير السؤال المفصلي (شبكة مقاومات) ثم يختم بمسابقة المجموعات</td><td>يجيبون ويتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا قد يقل مجموع فروق الجهد المقيسة قليلًا عن القوة الدافعة؟</td><td>بسبب الجهد المفقود في المقاومة الداخلية للبطارية وفي الأسلاك.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يُوصل الفولتميتر لقياس فرق الجهد عبر مقاومة؟</td><td>على التوازي معها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيست فروق الجهد ‎3.1 V‎ و‎2.8 V‎ في مسار بطاريته ‎6.0 V‎. ما الجهد المفقود؟</td><td>‎6.0 − 5.9 = 0.1 V‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الذي تتحقق منه هذه التجربة؟</td><td>القانون الثاني لكيرشوف (حفظ الطاقة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يفضل الفولتميتر الرقمي عالي المقاومة؟</td><td>كي لا يسحب تيارًا يذكر فلا يغير الدائرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح تعديلًا يقلل الفرق بين المجموع والقوة الدافعة.</td><td>استخدام أسلاك قصيرة سميكة ومصدر مقاومته الداخلية صغيرة، أو قياس فرق الجهد بين طرفي البطارية أثناء مرور التيار بدل قوتها الدافعة.</td></tr></table>", "<p><b>إرشاد للطالب:</b> كتابة تقرير التحقق العملي وإكمال نشاط 3-7 ص 84 والأسئلة 16–23</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على تقريره ومناقشة أسباب الفروق</p>"]}]}, {"title": "الدوائر العملية", "sb": "الموضوع 3-5 (الأسئلة 24–31)", "unit": "الوحدة 3: الدوائر الكهربائية", "periods": [{"axis": "المقاومة الداخلية والجهد المفقود", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "1 من 3"], ["محور الحصة", "المقاومة الداخلية والجهد المفقود"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 (الأسئلة 24–31)"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه\n2. يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود\nمخرج تعليمي آخر: يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: خلية جافة، مقاومة متغيرة، أميتر، فولتميتر، أسلاك", "القوة الدافعة الكهربائية ‎E‎، المقاومة الداخلية ‎r‎، فرق الجهد بين الطرفين ‎V‎، الجهد المفقود ‎Ir‎، ‎E = V + Ir‎، التمثيل البياني ‎V‎ مقابل ‎I‎.", "يسأل المعلم: «لماذا تخفت أضواء السيارة لحظة تشغيل المحرك؟» ويذكّر بأن بادئ الحركة يسحب تيارًا كبيرًا (فكرة التمهيد).", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يطرح السؤال\nالطالب: يقترحون انخفاض فرق الجهد عند سحب تيار كبير\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح المقاومة الداخلية و‎E = I(R + r)‎ والجهد المفقود\nالطالب: يحلون مثالًا لحساب ‎I‎ و‎V‎\n3) (15 دقيقة: من الدقيقة 18 إلى 33)\nالاستراتيجيتان: الاستقصاء العملي، التعلم بالاكتشاف\nالمعلم: ينفذ «استقصاء شدة التيار الكهربائي في خلية جافة وفرق الجهد بين طرفيها»\nالطالب: يسجلون قراءات ‎V‎ و‎I‎ ويرسمون ‎V‎ مقابل ‎I‎ ويستنتجون ‎E‎ من المقطع و‎r‎ من الميل\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: اكتب العلاقة بين ‎E‎ و‎V‎ و‎r‎.\n   الإجابة النموذجية: ‎E = V + Ir‎\n2) (المستوى المتوقع) السؤال: بطارية ‎E = 6.0 V‎ و‎r = 0.50 Ω‎ موصولة بمقاومة 2.5 Ω. احسب التيار وفرق الجهد بين طرفيها.\n   الإجابة النموذجية: ‎I = 6.0 ÷ 3.0 = 2.0 A‎؛ ‎V = 2.0 × 2.5 = 5.0 V‎.\n3) (المستوى المتقدم) السؤال: ماذا يمثل الجزء المقطوع من المحور الرأسي وميل خط ‎V‎ مقابل ‎I‎؟\n   الإجابة النموذجية: المقطع يمثل ‎E‎، والميل يمثل ‎−r‎.", "1) (مستوى الدعم) السؤال: ما الجهد المفقود؟\n   الإجابة النموذجية: فرق الجهد عبر المقاومة الداخلية ‎(Ir)‎ الذي لا يصل إلى الدائرة الخارجية.\n2) (المستوى المتوقع) السؤال: متى يساوي فرق الجهد بين طرفي البطارية قوتها الدافعة؟\n   الإجابة النموذجية: عندما لا يمر تيار ‎(I = 0)‎.\n3) (المستوى المتقدم) السؤال: لماذا تخفت أضواء السيارة عند تشغيل المحرك؟\n   الإجابة النموذجية: لأن بادئ الحركة يسحب تيارًا كبيرًا فيزداد الجهد المفقود ‎Ir‎ وينخفض فرق الجهد بين طرفي البطارية.", "إرشاد للطالب: مراجعة الموضوع 3-5 وكتابة تقرير الاستقصاء مع التمثيل البياني\nإرشاد لولي الأمر: الحديث مع الابن عن سبب خفوت الأضواء عند تشغيل محرك السيارة"], "h": ["<ol class=\"ol\"><li>يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه</li><li>يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تأثيرات المقاومة الداخلية لمصدر قوة دافعة كهربائية على فرق الجهد بين طرفيه</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم المعادلة ‎E = I(R + r)‎ لحساب التيار وفرق الجهد بين الطرفين والجهد المفقود</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستقصي العلاقة بين شدة التيار وفرق الجهد بين طرفي خلية جافة ويستنتج ‎E‎ و‎r‎ من التمثيل البياني</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: خلية جافة، مقاومة متغيرة، أميتر، فولتميتر، أسلاك</span></div>", "<p>القوة الدافعة الكهربائية ‎E‎، المقاومة الداخلية ‎r‎، فرق الجهد بين الطرفين ‎V‎، الجهد المفقود ‎Ir‎، ‎E = V + Ir‎، التمثيل البياني ‎V‎ مقابل ‎I‎.</p>", "<p>يسأل المعلم: «لماذا تخفت أضواء السيارة لحظة تشغيل المحرك؟» ويذكّر بأن بادئ الحركة يسحب تيارًا كبيرًا (فكرة التمهيد).</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يطرح السؤال</td><td>يقترحون انخفاض فرق الجهد عند سحب تيار كبير</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يشرح المقاومة الداخلية و‎E = I(R + r)‎ والجهد المفقود</td><td>يحلون مثالًا لحساب ‎I‎ و‎V‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–33</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجيتان: الاستقصاء العملي، التعلم بالاكتشاف</span><br>ينفذ «استقصاء شدة التيار الكهربائي في خلية جافة وفرق الجهد بين طرفيها»</td><td>يسجلون قراءات ‎V‎ و‎I‎ ويرسمون ‎V‎ مقابل ‎I‎ ويستنتجون ‎E‎ من المقطع و‎r‎ من الميل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">33–40</span><br><small>7 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب العلاقة بين ‎E‎ و‎V‎ و‎r‎.</td><td>‎E = V + Ir‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>بطارية ‎E = 6.0 V‎ و‎r = 0.50 Ω‎ موصولة بمقاومة 2.5 Ω. احسب التيار وفرق الجهد بين طرفيها.</td><td>‎I = 6.0 ÷ 3.0 = 2.0 A‎؛ ‎V = 2.0 × 2.5 = 5.0 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يمثل الجزء المقطوع من المحور الرأسي وميل خط ‎V‎ مقابل ‎I‎؟</td><td>المقطع يمثل ‎E‎، والميل يمثل ‎−r‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الجهد المفقود؟</td><td>فرق الجهد عبر المقاومة الداخلية ‎(Ir)‎ الذي لا يصل إلى الدائرة الخارجية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>متى يساوي فرق الجهد بين طرفي البطارية قوتها الدافعة؟</td><td>عندما لا يمر تيار ‎(I = 0)‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تخفت أضواء السيارة عند تشغيل المحرك؟</td><td>لأن بادئ الحركة يسحب تيارًا كبيرًا فيزداد الجهد المفقود ‎Ir‎ وينخفض فرق الجهد بين طرفي البطارية.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 3-5 وكتابة تقرير الاستقصاء مع التمثيل البياني</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن سبب خفوت الأضواء عند تشغيل محرك السيارة</p>"]}, {"axis": "مجزئ الجهد الكهربائي", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "2 من 3"], ["محور الحصة", "مجزئ الجهد الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 (الأسئلة 24–31)"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎\n2. يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب\nمخرج تعليمي آخر: يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع", "- التعلم بالاكتشاف\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- أخرى: مقاومات، مقاومة متغيرة، مقاومة ضوئية ‎LDR‎، فولتميتر، كتاب التجارب العملية والأنشطة", "مجزئ الجهد، ‎Vout‎، نسبة المقاومات، المقاومة الضوئية ‎LDR‎، الثرمستور، المستشعرات.", "يسأل المعلم: «لدينا بطارية ‎12 V‎ وجهاز يحتاج ‎4 V‎ فقط؛ كيف نحصل على ‎4 V‎ دون بطارية جديدة؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يقترحون تقسيم الجهد بمقاومتين\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم المبني على المشاريع\nالمعلم: يشرح مجزئ الجهد والعلاقة ويحل مثالًا\nالطالب: يحسبون ‎Vout‎ لنسب مختلفة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «استقصاء دائرة مجزئ جهد كهربائي» ويوجه حل نشاط 3-10 (ص 94)\nالطالب: يبنون الدائرة ويقيسون ويقارنون ويحلون النشاط\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير السؤال المفصلي (مجزئ ببطارية ‎6.0 V‎) ثم التقويم الختامي\nالطالب: يجيبون ويناقشون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب ‎Vout‎ عبر ‎R₂ = 2.0 kΩ‎ في مجزئ مع ‎R₁ = 4.0 kΩ‎ و‎Vin = 12 V‎.\n   الإجابة النموذجية: ‎Vout = 12 × 2.0 ÷ 6.0 = 4.0 V‎.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لـ ‎Vout‎ عبر ‎LDR‎ في مجزئ جهد عند زيادة الإضاءة؟\n   الإجابة النموذجية: تقل مقاومة ‎LDR‎ فيقل فرق الجهد عبرها.\n3) (المستوى المتقدم) السؤال: كيف تحصل على ‎Vout‎ متغير باستمرار من 0 إلى ‎Vin‎؟\n   الإجابة النموذجية: باستخدام مقاومة متغيرة ذات ثلاثة أطراف (مجزئ جهد منزلق).", "1) (مستوى الدعم) السؤال: اكتب علاقة مجزئ الجهد.\n   الإجابة النموذجية: ‎Vout = R₂Vin/(R₁ + R₂)‎\n2) (المستوى المتوقع) السؤال: مجزئ جهد بمقاومتين متساويتين و‎9.0 V‎؛ ما ‎Vout‎؟\n   الإجابة النموذجية: ‎4.5 V‎.\n3) (المستوى المتقدم) السؤال: صمم مجزئ جهد يشغل جرسًا عند حلول الظلام، وحدد موضع ‎LDR‎.\n   الإجابة النموذجية: ‎LDR‎ في موضع ‎R₂ (‎عند المخرج)؛ في الظلام تزداد مقاومتها فيرتفع ‎Vout‎ ويشغل الجرس.", "إرشاد للطالب: إكمال نشاط 3-10 ص 94 ورسم دائرة مجزئ جهد بمستشعر\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن الإنارة التلقائية لأعمدة الشوارع"], "h": ["<ol class=\"ol\"><li>يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎</li><li>يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف مبدأ عمل دائرة مجزئ الجهد ويستخدم العلاقة ‎Vout = R₂Vin/(R₁ + R₂)‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستقصي دائرة مجزئ جهد عمليًا ويقارن النتائج بالحساب</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصمم دائرة مجزئ جهد بمقاومة ضوئية أو حرارية لاستشعار تغير الضوء أو الحرارة</td><td class=\"lv\">إبداع</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على المشاريع</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: مقاومات، مقاومة متغيرة، مقاومة ضوئية ‎LDR‎، فولتميتر، كتاب التجارب العملية والأنشطة</span></div>", "<p>مجزئ الجهد، ‎Vout‎، نسبة المقاومات، المقاومة الضوئية ‎LDR‎، الثرمستور، المستشعرات.</p>", "<p>يسأل المعلم: «لدينا بطارية ‎12 V‎ وجهاز يحتاج ‎4 V‎ فقط؛ كيف نحصل على ‎4 V‎ دون بطارية جديدة؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>يطرح السؤال</td><td>يقترحون تقسيم الجهد بمقاومتين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم المبني على المشاريع</span><br>يشرح مجزئ الجهد والعلاقة ويحل مثالًا</td><td>يحسبون ‎Vout‎ لنسب مختلفة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ «استقصاء دائرة مجزئ جهد كهربائي» ويوجه حل نشاط 3-10 (ص 94)</td><td>يبنون الدائرة ويقيسون ويقارنون ويحلون النشاط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير السؤال المفصلي (مجزئ ببطارية ‎6.0 V‎) ثم التقويم الختامي</td><td>يجيبون ويناقشون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎Vout‎ عبر ‎R₂ = 2.0 kΩ‎ في مجزئ مع ‎R₁ = 4.0 kΩ‎ و‎Vin = 12 V‎.</td><td>‎Vout = 12 × 2.0 ÷ 6.0 = 4.0 V‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لـ ‎Vout‎ عبر ‎LDR‎ في مجزئ جهد عند زيادة الإضاءة؟</td><td>تقل مقاومة ‎LDR‎ فيقل فرق الجهد عبرها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف تحصل على ‎Vout‎ متغير باستمرار من 0 إلى ‎Vin‎؟</td><td>باستخدام مقاومة متغيرة ذات ثلاثة أطراف (مجزئ جهد منزلق).</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب علاقة مجزئ الجهد.</td><td>‎Vout = R₂Vin/(R₁ + R₂)‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>مجزئ جهد بمقاومتين متساويتين و‎9.0 V‎؛ ما ‎Vout‎؟</td><td>‎4.5 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صمم مجزئ جهد يشغل جرسًا عند حلول الظلام، وحدد موضع ‎LDR‎.</td><td>‎LDR‎ في موضع ‎R₂ (‎عند المخرج)؛ في الظلام تزداد مقاومتها فيرتفع ‎Vout‎ ويشغل الجرس.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاط 3-10 ص 94 ورسم دائرة مجزئ جهد بمستشعر</p><p><b>إرشاد لولي الأمر:</b> يمكن الحديث مع الابن عن الإنارة التلقائية لأعمدة الشوارع</p>"]}, {"axis": "مقياس الجهد والطريقة الصفرية ومراجعة الوحدة الثالثة", "n": 3, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: الدوائر الكهربائية"], ["الدرس", "الدوائر العملية"], ["الحصة", "3 من 3"], ["محور الحصة", "مقياس الجهد والطريقة الصفرية ومراجعة الوحدة الثالثة"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 3-5 + كتاب التجارب ص 87 و90 و97"], ["دليل المعلم", "ص 89–94"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-8 ص 87؛ نشاط 3-9 ص 90؛ نشاط 3-10: مجزئ الجهد الكهربائي ص 94؛ نشاط 3-11: مقياس الجهد الكهربائي ص 97"]], "t": ["1. يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه\n2. يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)\nمخرج تعليمي آخر: يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: سلك مقياس جهد، جلفانوميتر، خلايا، كتاب التجارب العملية والأنشطة", "مقياس الجهد، سلك منتظم، طول الاتزان، الجلفانوميتر، الطريقة الصفرية، مقارنة القوى الدافعة ‎E₁/E₂ = L₁/L₂‎.", "يسأل المعلم: «الفولتميتر يسحب تيارًا ولو صغيرًا فيغير ما يقيسه؛ هل يمكن قياس قوة دافعة لخلية دون سحب أي تيار منها؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يقترحون موازنة الخلية بجهد آخر\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «استخدام مجزئ الجهد لمقارنة القوة الدافعة الكهربائية للخلايا» ويشرح الطريقة الصفرية\nالطالب: يحسبون ‎E₂‎ من أطوال الاتزان\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاطي 3-8 و3-9 (ص 87 و90) ونشاط 3-11 (ص 97) وأسئلة مختارة\nالطالب: يحلون في مجموعات ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: ماذا يعني أن قراءة الجلفانوميتر صفر عند نقطة الاتزان؟\n   الإجابة النموذجية: لا يمر تيار في الخلية المقيسة، فيكون فرق الجهد عبر طول الاتزان مساويًا لقوتها الدافعة.\n2) (المستوى المتوقع) السؤال: خلية ‎E₁ = 1.5 V‎ طول اتزانها ‎60.0 cm‎، وخلية أخرى طول اتزانها ‎48.0 cm‎. احسب ‎E₂‎.\n   الإجابة النموذجية: ‎E₂ = 1.5 × 48.0 ÷ 60.0 = 1.2 V‎.\n3) (المستوى المتقدم) السؤال: لماذا يجب أن يكون سلك مقياس الجهد منتظم المقطع؟\n   الإجابة النموذجية: ليكون فرق الجهد متناسبًا طرديًا مع الطول.", "1) (مستوى الدعم) السؤال: ما ميزة الطريقة الصفرية؟\n   الإجابة النموذجية: لا يُسحب تيار من الخلية المقيسة، فيُقاس فرق الجهد بدقة دون تأثر بالمقاومة الداخلية.\n2) (المستوى المتوقع) السؤال: ما الجهاز الذي يكشف انعدام التيار؟\n   الإجابة النموذجية: الجلفانوميتر.\n3) (المستوى المتقدم) السؤال: لماذا يكون مقياس الجهد أدق من الفولتميتر العادي في قياس ‎e.m.f‎.؟\n   الإجابة النموذجية: لأنه لا يسحب تيارًا عند الاتزان فلا يوجد جهد مفقود، بينما يسحب الفولتميتر تيارًا صغيرًا.", "إرشاد للطالب: إكمال نشاطي 3-8 و3-9 وأسئلة نهاية الوحدة الثالثة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة"], "h": ["<ol class=\"ol\"><li>يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه</li><li>يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر مبدأ عمل مقياس الجهد (البوتنشيومتر) كوسيلة لمقارنة فروق الجهد ويستخدمه</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف استخدام الجلفانوميتر بالطرق الصفرية (انعدام شدة التيار)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاطي 3-8 و3-9 وأسئلة مختارة من 24–31 ومن نهاية الوحدة</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span 60.0 = 1.2 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يجب أن يكون سلك مقياس الجهد منتظم المقطع؟</td><td>ليكون فرق الجهد متناسبًا طرديًا مع الطول.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ميزة الطريقة الصفرية؟</td><td>لا يُسحب تيار من الخلية المقيسة، فيُقاس فرق الجهد بدقة دون تأثر بالمقاومة الداخلية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الجهاز الذي يكشف انعدام التيار؟</td><td>الجلفانوميتر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون مقياس الجهد أدق من الفولتميتر العادي في قياس ‎e.m.f‎.؟</td><td>لأنه لا يسحب تيارًا عند الاتزان فلا يوجد جهد مفقود، بينما يسحب الفولتميتر تيارًا صغيرًا.</td></tr></table>", "<p><b>إرشاد للطالب:</b> إكمال نشاطي 3-8 و3-9 وأسئلة نهاية الوحدة الثالثة وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة</p>"]}]}, {"title": "التعرف على المكثفات", "sb": "الموضوع 4-1 (الأسئلة 1–10)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "المكثف وتعريف السعة ‎C = Q/V‎", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "التعرف على المكثفات"], ["الحصة", "1 من 2"], ["محور الحصة", "المكثف وتعريف السعة ‎C = Q/V‎"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 4-1 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: الشحنة الكهربائية وفرق الجهد الكهربائي والسعة ص 110"]], "t": ["1. يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح\n2. يستخدم المعادلة ‎C = Q/V‎ لحساب السعة أو الشحنة أو فرق الجهد\nمخرج تعليمي آخر: يصف تركيب المكثف متوازي الألواح وكيف يشحن (شحنتان متساويتان ومتعاكستان)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مكثفات متنوعة للعرض", "المكثف، اللوحان المتوازيان، العازل، السعة ‎C‎، الفاراد ‎F‎، الميكروفاراد μ‎F‎، ‎C = Q/V‎، الشحنة على كل لوح.", "يعرض المعلم مكثفات مختلفة الأحجام من أجهزة إلكترونية قديمة ويسأل: «ما وظيفة هذه المكونات؟ وكيف يخزن جهاز طاقة دون تفاعل كيميائي كالبطارية؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يعرض المكثفات ويطرح السؤال ومهام بداية الوحدة\nالطالب: يقترحون أنها تخزن شحنة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يشرح تركيب المكثف متوازي الألواح وكيفية شحنه وتعريف السعة ووحدتها\nالطالب: يرسمون المكثف ويكتبون التعريف والوحدة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل ‎C = Q/V‎ بوحدات متنوعة (‎μF‎، ‎nF‎، ‎pF‎)\nالطالب: يحلون في أزواج مع تحويل الوحدات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: عرّف سعة المكثف.\n   الإجابة النموذجية: الشحنة المخزنة على أحد اللوحين لكل وحدة فرق جهد بين اللوحين.\n2) (المستوى المتوقع) السؤال: احسب الشحنة على مكثف ‎470 μF‎ مشحون إلى ‎12 V‎.\n   الإجابة النموذجية: ‎Q = 470 × 10⁻⁶ × 12 = 5.6 × 10⁻³ C‎.\n3) (المستوى المتقدم) السؤال: لماذا تكون الشحنة الكلية على المكثف المشحون صفرًا؟\n   الإجابة النموذجية: لأن اللوحين يحملان شحنتين متساويتين ومتعاكستين (‎+Q‎ وـ‎Q‎).", "1) (مستوى الدعم) السؤال: ما وحدة السعة؟\n   الإجابة النموذجية: الفاراد ‎(F) = C/V‎.\n2) (المستوى المتوقع) السؤال: احسب فرق الجهد عبر مكثف ‎2.0 μF‎ يحمل ‎6.0 × 10⁻⁵ C‎.\n   الإجابة النموذجية: ‎V = 30 V‎.\n3) (المستوى المتقدم) السؤال: لماذا يُعد الفاراد وحدة كبيرة جدًا عمليًا؟\n   الإجابة النموذجية: لأن مكثفًا سعته ‎1 F‎ عند جهد صغير يخزن شحنة كبيرة جدًا، والمكثفات الشائعة سعتها ميكروفاراد أو أقل.", "إرشاد للطالب: مراجعة الموضوع 4-1 وحل مسائل ‎C = Q/V‎\nإرشاد لولي الأمر: الحديث مع الابن عن المكثفات في الأجهزة الإلكترونية المنزلية"], "h": ["<ol class=\"ol\"><li>يعرّف سعة المكثف عند تطبيقها على المكثفات متوازية الألواح</li><li>يستخدم المعادلة ‎C = Q/V‎ لحساب all></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل ‎C = Q/V‎ بوحدات متنوعة (‎μF‎، ‎nF‎، ‎pF‎)</td><td>يحلون في أزواج مع تحويل الوحدات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف سعة المكثف.</td><td>الشحنة المخزنة على أحد اللوحين لكل وحدة فرق جهد بين اللوحين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب الشحنة على مكثف ‎470 μF‎ مشحون إلى ‎12 V‎.</td><td>‎Q = 470 × 10⁻⁶ × 12 = 5.6 × 10⁻³ C‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تكون الشحنة الكلية على المكثف المشحون صفرًا؟</td><td>لأن اللوحين يحملان شحنتين متساويتين ومتعاكستين (‎+Q‎ وـ‎Q‎).</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وحدة السعة؟</td><td>الفاراد ‎(F) = C/V‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب فرق الجهد عبر مكثف ‎2.0 μF‎ يحمل ‎6.0 × 10⁻⁵ C‎.</td><td>‎V = 30 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد الفاراد وحدة كبيرة جدًا عمليًا؟</td><td>لأن مكثفًا سعته ‎1 F‎ عند جهد صغير يخزن شحنة كبيرة جدًا، والمكثفات الشائعة سعتها ميكروفاراد أو أقل.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 4-1 وحل مسائل ‎C = Q/V‎</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن المكثفات في الأجهزة الإلكترونية المنزلية</p>"]}, {"axis": "العلاقة بين الشحنة وفرق الجهد ونشاط 4-1", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "التعرف على المكثفات"], ["الحصة", "2 من 2"], ["محور الحصة", "العلاقة بين الشحنة وفرق الجهد ونشاط 4-1"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "الموضوع 4-1 + كتاب التجارب ص 110"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: الشحنة الكهربائية وفرق الجهد الكهربائي والسعة ص 110"]], "t": ["1. يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا\n2. يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎\nمخرج تعليمي آخر: يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: مكثف، مصدر تيار ثابت أو بيانات نموذجية، فولتميتر، ساعة إيقاف، كتاب التجارب العملية والأنشطة", "الشحن بتيار ثابت، ‎Q = It‎، تمثيل ‎Q‎ مقابل ‎V‎، الخط المستقيم المار بالأصل، الميل = ‎C‎.", "يسأل المعلم: «لو شحنّا مكثفًا بتيار ثابت، كيف يتغير فرق الجهد بين طرفيه مع الزمن؟» ويطلب رسمًا تنبؤيًا.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: يطرح السؤال\nالطالب: يرسمون تنبؤًا خطيًا\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالاستراتيجيتان: التعلم التعاوني، التعلم بالاكتشاف\nالمعلم: ينفذ «العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه» بتيار ثابت أو بيانات نموذجية\nالطالب: يحسبون ‎Q = It‎ ويرسمون ‎Q‎ مقابل ‎V‎ ويحسبون الميل\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يوجه حل نشاط 4-1 (ص 110)\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على السعة\nالطالب: يتنافسون\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: كيف تُحسب الشحنة عند الشحن بتيار ثابت؟\n   الإجابة النموذجية: ‎Q = It‎.\n2) (المستوى المتوقع) السؤال: ماذا يمثل ميل خط ‎Q‎ مقابل ‎V‎؟\n   الإجابة النموذجية: سعة المكثف ‎C‎.\n3) (المستوى المتقدم) السؤال: شُحن مكثف بتيار ‎20 μA‎ مدة ‎50 s‎ فأصبح فرق الجهد ‎5.0 V‎. احسب ‎C‎.\n   الإجابة النموذجية: ‎Q = 1.0 × 10⁻³ C‎؛ ‎C = 2.0 × 10⁻⁴ F = 200 μF‎.", "1) (مستوى الدعم) السؤال: ما شكل تمثيل ‎Q‎ مقابل ‎V‎ لمكثف؟\n   الإجابة النموذجية: خط مستقيم يمر بالأصل.\n2) (المستوى المتوقع) السؤال: ماذا يعني مرور الخط بالأصل؟\n   الإجابة النموذجية: أن ‎Q‎ تتناسب طرديًا مع ‎V‎.\n3) (المستوى المتقدم) السؤال: اقترح سببًا لانحراف القراءات عن الخط المستقيم عند الجهود العالية في التجربة.\n   الإجابة النموذجية: تسرب الشحنة عبر العازل أو صعوبة الحفاظ على تيار ثابت تمامًا.", "إرشاد للطالب: إكمال نشاط 4-1 ص 110 ورسم ‎Q‎ مقابل ‎V‎\nإرشاد لولي الأمر: متابعة الابن في حساب الميل من الرسم بدقة"], "h": ["<ol class=\"ol\"><li>يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا</li><li>يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستقصي العلاقة بين الشحنة المخزنة في مكثف وفرق الجهد بين طرفيه ويمثلها بيانيًا</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستنتج السعة من ميل تمثيل ‎Q‎ مقابل ‎V‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 4-1 «الشحنة الكهربائية وفرق الجهد الكهربائي والسعة»</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: مكثف، مصدر تيار ثابت أو بيانات نموذجية، فولتميتر، ساعة إيقاف، كتاب التجارب العملية والأنشطة</span></div>", "<p>الشحن بتيار ثابت، ‎Q = It‎، تمثيل ‎Q‎ مقابل ‎V‎، الخط المستقيم المار بالأصل، الميل = ‎C‎.</p>", "<p>يسأل المعلم: «لو شحنّا مكثفًا بتيار ثابت، كيف يتغير فرق الجهد بين طرفيه مع الزمن؟» ويطلب رسمًا تنبؤيًا.</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالا بن في حساب الميل من الرسم بدقة</p>"]}]}, {"title": "الطاقة المخزنة في مكثف", "sb": "الموضوع 4-2 (الأسئلة 1–10)", "unit": "الوحدة 4: المكثفات", "periods": [{"axis": "الطاقة من المساحة تحت منحنى فرق الجهد–الشحنة", "n": 1, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "1 من 3"], ["محور الحصة", "الطاقة من المساحة تحت منحنى فرق الجهد–الشحنة"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)\n2. يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎\nمخرج تعليمي آخر: يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكثف كبير السعة ومصباح صغير للعرض", "الطاقة المخزنة ‎W‎، المساحة تحت منحنى ‎V–Q‎، المثلث، ‎W = ½QV‎، الشغل المبذول في الشحن.", "يشحن المعلم مكثفًا كبيرًا ثم يفرغه عبر مصباح صغير يومض، ويسأل: «من أين جاءت طاقة الوميض؟ وكيف نحسبها؟»", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يقترحون أنها طاقة مخزنة في المكثف\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالاستراتيجية: التعلم بالاكتشاف\nالمعلم: ينفذ «الطاقة المخزنة في مكثف مشحون» ويشتق ‎W = ½QV‎ من المساحة تحت منحنى ‎V–Q‎\nالطالب: يرسمون المنحنى ويحسبون مساحة المثلث\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل حساب الطاقة من تمثيلات بيانية\nالطالب: يحسبون الطاقة من المساحات في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: لماذا تُحسب الطاقة من المساحة تحت منحنى ‎V–Q‎؟\n   الإجابة النموذجية: لأن الشغل لنقل شحنة صغيرة ‎ΔQ‎ يساوي ‎VΔQ‎، ومجموع هذه الشرائح يساوي المساحة.\n2) (المستوى المتوقع) السؤال: احسب الطاقة المخزنة إذا كانت ‎Q = 4.0 mC‎ عند ‎V = 6.0 V‎.\n   الإجابة النموذجية: ‎W = ½ × 4.0 × 10⁻³ × 6.0 = 0.012 J‎.\n3) (المستوى المتقدم) السؤال: لماذا لا تساوي الطاقة ‎QV‎؟\n   الإجابة النموذجية: لأن فرق الجهد يزداد تدريجيًا من صفر إلى ‎V‎ أثناء الشحن، فالمتوسط ½‎V‎.", "1) (مستوى الدعم) السؤال: ما الشكل الهندسي تحت منحنى ‎V–Q‎ لمكثف؟\n   الإجابة النموذجية: مثلث قائم.\n2) (المستوى المتوقع) السؤال: إذا تضاعف فرق الجهد لمكثف ما، فكيف تتغير الطاقة؟\n   الإجابة النموذجية: تصبح أربعة أضعاف (لأن ‎Q‎ تتضاعف أيضًا).\n3) (المستوى المتقدم) السؤال: لماذا يبذل المصدر شغلًا ‎QV‎ بينما يخزن المكثف ½‎QV‎ فقط؟\n   الإجابة النموذجية: يتحول النصف الآخر إلى طاقة حرارية في مقاومات الدائرة أثناء الشحن.", "إرشاد للطالب: مراجعة الموضوع 4-2 ورسم منحنى ‎V–Q‎ وحساب المساحة\nإرشاد لولي الأمر: الحديث مع الابن عن وميض الكاميرا بوصفه تطبيقًا للمكثفات"], "h": ["<ol class=\"ol\"><li>يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)</li><li>يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يجد طاقة الوضع الكهربائية المخزنة في مكثف من المساحة الواقعة تحت منحنى (فرق الجهد–الشحنة)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر لماذا تكون الطاقة المخزنة ½‎QV‎ لا ‎QV‎</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين طاقة المكثف والشغل الذي يبذله المصدر في شحنه</td><td class=\"lv\">تحليل</td></tr></table>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: مكثف كبير السعة ومصباح صغير للعرض</span></div>", "<p>الطاقة المخزنة ‎W‎، المساحة تحت منحنى ‎V–Q‎، المثلث، ‎W = ½QV‎، الشغل المبذول في الشحن.</p>", "<p>يشحن المعلم مكثفًا كبيرًا ثم يفرغه عبر مصباح صغير يومض، ويسأل: «من أين جاءت طاقة الوميض؟ وكيف نحسبها؟»</p>", "<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ العرض ويطرح السؤال</td><td>يقترحون أنها طاقة مخزنة في المكثف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم بالاكتشاف</span><br>ينفذ «الطاقة المخزنة في مكثف مشحون» ويشتق ‎W = ½QV‎ من المساحة تحت منحنى ‎V–Q‎</td><td>يرسمون المنحنى ويحسبون مساحة المثلث</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td><span class=\"stg\">الاستراتيجية: التعلم التعاوني</span><br>يقدم مسائل حساب الطاقة من تمثيلات بيانية</td><td>يحسبون الطاقة من المساحات في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تُحسب الطاقة من المساحة تحت منحنى ‎V–Q‎؟</td><td>لأن الشغل لنقل شحنة صغيرة ‎ΔQ‎ يساوي ‎VΔQ‎، ومجموع هذه الشرائح يساوي المساحة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب الطاقة المخزنة إذا كانت ‎Q = 4.0 mC‎ عند ‎V = 6.0 V‎.</td><td>‎W = ½ × 4.0 × 10⁻³ × 6.0 = 0.012 J‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تساوي الطاقة ‎QV‎؟</td><td>لأن فرق الجهد يزداد تدريجيًا من صفر إلى ‎V‎ أثناء الشحن، فالمتوسط ½‎V‎.</td></tr></table>", "<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الشكل الهندسي تحت منحنى ‎V–Q‎ لمكثف؟</td><td>مثلث قائم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>إذا تضاعف فرق الجهد لمكثف ما، فكيف تتغير الطاقة؟</td><td>تصبح أربعة أضعاف (لأن ‎Q‎ تتضاعف أيضًا).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يبذل المصدر شغلًا ‎QV‎ بينما يخزن المكثف ½‎QV‎ فقط؟</td><td>يتحول النصف الآخر إلى طاقة حرارية في مقاومات الدائرة أثناء الشحن.</td></tr></table>", "<p><b>إرشاد للطالب:</b> مراجعة الموضوع 4-2 ورسم منحنى ‎V–Q‎ وحساب المساحة</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن وميض الكاميرا بوصفه تطبيقًا للمكثفات</p>"]}, {"axis": "معادلات الطاقة المخزنة ‎W = ½QV = ½CV² = ½Q²/C‎", "n": 2, "hi": [["المادة", "الفيزياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: المكثفات"], ["الدرس", "الطاقة المخزنة في مكثف"], ["الحصة", "2 من 3"], ["محور الحصة", "معادلات الطاقة المخزنة ‎W = ½QV = ½CV² = ½Q²/C‎"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "الموضوع 4-2 (الأسئلة 1–10)"], ["دليل المعلم", "ص 117–122"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: الطاقة المخزنة بواسطة مكثف مشحون ص 114"]], "t": ["1. يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة\n2. يختار المعادلة المناسبة بحسب المعطيات\nمخرج تعليمي آخر: يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎W = ½QV‎، ‎W = ½CV²‎، ‎W = ½Q²/C‎، اختيار المعادلة، الجول.", "يسأل المعلم: «لدينا ثلاث صيغ للطاقة؛ متى نستخدم كلًا منها؟» ويكتب ثلاث مسائل بمعطيات مختلفة.", "1) (5 دقائق: من الدقيقة 0 إلى 5)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يعرض المسائل الثلاث\nالطالب: يحددون المعطيات في كل منها\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالاستراتيجية: التعلم المبني على حل المشكلات\nالمعلم: يشتق الصيغتين الأخريين بالتعويض عن ‎Q = CV‎ ويحل المسائل الثلاث\nالطالب: يتبعون الاشتقاق والحلول\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالاستراتيجية: التعلم التعاوني\nالمعلم: يقدم مسائل متنوعة للحل في مجموعات\nالطالب: يحلون ويختارون الصيغة المناسبة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة", "1) (مستوى الدعم) السؤال: احسب الطاقة المخزنة في مكثف ‎470 μF‎ عند ‎12 V‎.\n   الإجابة النموذجية: ‎W = ½ × 470 × 10⁻⁶ × 144 = 0.034 J‎.\n2) (المستوى المتوقع) السؤال: احسب الطاقة في مكثف ‎2.0 μF‎ يحمل ‎4.0 × 10⁻⁴ C‎.\n   الإجابة النموذجية: ‎W = ½Q²/C = ½ × 1.6 × 10⁻⁷ ÷ 2.0 × 10⁻⁶ = 0.040 J‎.\n3) (المستوى المتقدم) السؤال: ما فرق الجهد اللازم لتخزين ‎1.0 J‎ في مكثف ‎200 μF‎؟\n   الإجابة النموذجية: ‎V = √(2W/C) = √(10⁴) = 100 V‎.", "1) (مستوى الدعم) السؤال: اشتق ‎W = ½CV²‎ من ‎W = ½QV‎.\n   الإجابة النموذجية: بالتعويض ‎Q = CV: W = ½(CV)V = ½CV²‎.\n2) (المستوى المتوقع) السؤال: أي صيغة تستخدم إذا عُلمت ‎C‎ و‎V‎ فقط؟\n   الإجابة النموذجية: ‎W = ½CV²‎.\n3) (المستوى المتقدم) السؤال: مكثفان: الأول ‎100 μF‎ عند ‎20 V‎، والثاني ‎400 μF‎ عند ‎10 V‎. أيهما يخزن طاقة أكبر؟\n   الإجابة النموذجية: الأول: ‎0.020 J‎؛ الثاني: ‎0.020 J‎؛ متساويان.", "إرشاد للطالب: حل خمس مسائل على معادلات الطاقة\nإرشاد لولي الأمر: متابعة الابن في اختيار المعادلة المناسبة للمعطيات"], "h": ["<ol class=\"ol\"><li>يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة</li><li>يختار المعادلة المناسبة بحسب المعطيات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة</div>", "<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم المعادلات ‎W = ½QV = ½CV² = ½Q²/C‎ لحساب الطاقة المخزنة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يختار المعادلة المناسبة بحسب المعطيات</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب فرق الجهد اللازم لتخزين طاقة معينة في مكثف معلوم السعة</td><td class=\"lv\">تطبيق</td></tr></table>", "<div class=\"chips\"><span class=\"chip\"
