مسابقة بوقت كافٍ؟\nالإجابة: لتوفير الكوادر والتجهيزات.\n\nالحصة 2:\nس1 (مستوى الدعم): قس محاولة وسجلها.\nالإجابة: يقيس.\nس2 (المستوى المتوقع): دافع لمس الإطار، ما القرار؟\nالإجابة: فاشلة.\nس3 (المستوى المتقدم): كيف يحدد الفائز؟\nالإجابة: بأفضل محاولة صحيحة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما الحالة التحكيمية التي وقعت؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الذي يمكن تحسينه؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما مسافتك؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): ما العنصر الذي تحسن أكثر؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الذي يحتاج إلى عمل؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما خطتك؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): أدِّ دفع الجلة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما مسافتك مقارنة بالأسبوع السادس؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما تقييمك لأدائك في الوحدة؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك لجان المسابقات.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على معرفة أدوات التحكيم.\n\nالحصة 3:\nإرشاد لولي الأمر: اسأل طالبك عن دوره في المسابقة.\n\nالحصة 4:\nإرشاد لولي الأمر: راجع مع طالبك دفع الجلة قبل الحصة التالية.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على خطط اللعب في كرة القدم (دليل المعلم ص 54)."}}, {"title": "خطط اللعب في كرة القدم", "unit": "كرة القدم (ذكور)", "week": "التاسع", "date": "1-5/11/2026", "pages": "دليل المعلم ص 54-56", "n": 5, "periods": [{"focus": "مفهوم خطط اللعب وأنواعها (هجومية ودفاعية، فردية وجماعية)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم خطط اللعب وأنواعها.\n2. يميز الخطط الهجومية الجماعية من الفردية.\n3. يصنف مواقف لعب إلى أنواع الخطط.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: بطاقات مواقف", "المفاهيم": "- خطط اللعب\n- الخطط الهجومية\n- الخطط الدفاعية\n- الجماعية والفردية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف يستفيد فريق من نقاط ضعف منافسه؟ (ص 54).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والأنواع.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف بطاقات المواقف.\n- الطالب: يصنف.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة 4 ضد 4 مع تحديد نوع الخطة المستخدمة بعد كل هجمة.\n- الطالب: يلعب ويسمي.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما خطط اللعب؟\nالإجابة: فن تحركات اللاعبين أثناء المباراة للحد من مميزات المنافس والاستفادة من ضعفه.\nس2 (المستوى المتوقع): اذكر نوعي الخطط.\nالإجابة: هجومية ودفاعية.\nس3 (المستوى المتقدم): ما الخطة الهجومية الجماعية؟\nالإجابة: يشترك فيها عدد كبير بالتمرير والجري الحر وتبادل المراكز.", "التقويم الختامي": "س1 (مستوى الدعم): صنف: محاورة فردية لتجاوز مدافع.\nالإجابة: خطة هجومية فردية.\nس2 (المستوى المتوقع): اذكر عوامل تطبيق الخطط.\nالإجابة: الإعداد الذهني والسمات الإرادية.\nس3 (المستوى المتقدم): ما الخطة الهجومية الفردية؟\nالإجابة: التحركات والمهارات التي يؤديها لاعب واحد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك أنواع الخطط."}}, {"focus": "العوامل المهمة لنجاح خطط اللعب والإعداد الذهني والسمات الإرادية", "num": 2, "fields": {"المخرجات التعليمية": "1. يذكر عوامل نجاح الخطط (استقبال الكرة، الخداع، الظهور للزميل، الجري لمساحة خالية، سد الطريق، سرعة الاستجابة، التضييق).\n2. يطبق عاملين أو ثلاثة في تدريب مصغر.\n3. يفسر دور السمات الإرادية في تنفيذ الخطة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة", "المفاهيم": "- الظهور للزميل\n- المساحة الخالية\n- التضييق\n- السمات الإرادية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الذي يفشل الخطة حتى مع لاعبين مهرة؟ (ص 55).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح العوامل والإعداد الذهني والسمات.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 3 ضد 3 بتطبيق الظهور للزميل والجري للمساحة الخالية.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش السمات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر ثلاثة عوامل لنجاح الخطة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الظهور للزميل؟\nالإجابة: التحرك ليكون متاحًا لاستلام التمريرة.\nس3 (المستوى المتقدم): اذكر سمة إرادية.\nالإجابة: الثقة بالنفس أو المثابرة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ 3 ضد 3 بتطبيق عاملين.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا يهم الإعداد الذهني؟\nالإجابة: لتطبيق الخطة تطبيقًا متميزًا.\nس3 (المستوى المتقدم): ما أثر التضييق على المهاجم؟\nالإجابة: يجبره على التحرك للجانب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة وملاحظة الظهور للزميل."}}, {"focus": "الخطط الدفاعية (رجل لرجل في المنطقة) وخطوات تعليم الخطط", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف خطة دفاع رجل لرجل في المنطقة وميزاتها.\n2. يطبق خطوات تعليم الخطة (شرح، تنفيذ دون منافس، مع منافس، مجموعات صغيرة).\n3. يقيم تغطية المنطقة أثناء اللعب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- السبورة الذكية", "المفاهيم": "- دفاع رجل لرجل في المنطقة\n- التغطية\n- خطوات التعليم", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف يحمي المدافعون منطقتهم دون أن يُسحبوا؟ (ص 56).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الخطة وخطوات التعليم بالرسم.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تنفيذ الخطة دون منافس ثم مع منافس في 5 ضد 5.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم التغطية.\n- الطالب: يقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما ميزة دفاع رجل لرجل في المنطقة؟\nالإجابة: تأمين المدافعين ضد سحبهم ووضع المهاجمين تحت الرقابة.\nس2 (المستوى المتوقع): ما أول خطوة لتعليم الخطة؟\nالإجابة: الشرح النظري.\nس3 (المستوى المتقدم): متى ننتقل إلى 11 ضد 11؟\nالإجابة: بعد التدريب في مساحات صغيرة.", "التقويم الختامي": "س1 (مستوى الدعم): نفذ الخطة في 5 ضد 5.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): ما مسؤولية كل مدافع؟\nالإجابة: مراقبة أي مهاجم يدخل منطقته.\nس3 (المستوى المتقدم): اذكر خطوات تعليم الخطة.\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك خطة الدفاع."}}, {"focus": "تطبيق خطة هجومية جماعية (تبادل المراكز والجري الحر)", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق خطة هجومية جماعية بتبادل المراكز.\n2. يقرأ الفراغات ويتحرك للمساحة الخالية.\n3. يتعاون في تنفيذ الخطة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: صدريات ملونة", "المفاهيم": "- تبادل المراكز\n- الجري الحر\n- الخطة الهجومية الجماعية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم خطة هجومية بسيطة بالرسم.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الخطة.\n- الطالب: يستمع.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تنفيذ الخطة دون منافس ثم مع دفاع في 6 ضد 5.\n- الطالب: يتدرب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش الفراغات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما تبادل المراكز؟\nالإجابة: انتقال اللاعبين بين مراكزهم لإرباك الدفاع.\nس2 (المستوى المتوقع): ما الجري الحر؟\nالإجابة: التحرك دون كرة لفتح المساحات.\nس3 (المستوى المتقدم): كم مهاجمًا في التدريب؟\nالإجابة: ستة ضد خمسة.", "التقويم الختامي": "س1 (مستوى الدعم): نفذ الخطة مع زملائك.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): متى نجحت الخطة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحتاجه فريقك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على الجري دون كرة."}}, {"focus": "مباراة تطبيقية للخطط الهجومية والدفاعية والاختبار المهاري للخطط", "num": 5, "fields": {"المخرجات التعليمية": "1. يطبق خطة هجومية وأخرى دفاعية في مباراة.\n2. يضع مع مجموعته خطة ويعرضها (الاختبار المهاري ص 61).\n3. يقيم تنفيذ الخطط.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- السبورة الذكية", "المفاهيم": "- الخطة\n- التنفيذ\n- التقييم", "التهيئة / التمهيد / التعلم القبلي": "يكلف المعلم كل مجموعة بوضع خطة هجومية وأخرى دفاعية.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة ترسم خطتيها.\n- الطالب: يخطط.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات تطبق فيها المجموعات خططها بالتناوب.\n- الطالب: يلعب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم.\n- الطالب: يقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما خطتكم الهجومية؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما خطتكم الدفاعية؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): هل نجحت؟ ولماذا؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): اعرض خطة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما العوامل التي ساعدت على النجاح؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تعدل الخطة ضد فريق أقوى؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على طرق اللعب (دليل المعلم ص 57)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم خطط اللعب وأنواعها.\n2. يميز الخطط الهجومية الجماعية من الفردية.\n3. يصنف مواقف لعب إلى أنواع الخطط.\n\nالحصة 2:\n1. يذكر عوامل نجاح الخطط (استقبال الكرة، الخداع، الظهور للزميل، الجري لمساحة خالية، سد الطريق، سرعة الاستجابة، التضييق).\n2. يطبق عاملين أو ثلاثة في تدريب مصغر.\n3. يفسر دور السمات الإرادية في تنفيذ الخطة.\n\nالحصة 3:\n1. يتعرف خطة دفاع رجل لرجل في المنطقة وميزاتها.\n2. يطبق خطوات تعليم الخطة (شرح، تنفيذ دون منافس، مع منافس، مجموعات صغيرة).\n3. يقيم تغطية المنطقة أثناء اللعب.\n\nالحصة 4:\n1. يطبق خطة هجومية جماعية بتبادل المراكز.\n2. يقرأ الفراغات ويتحرك للمساحة الخالية.\n3. يتعاون في تنفيذ الخطة.\n\nالحصة 5:\n1. يطبق خطة هجومية وأخرى دفاعية في مباراة.\n2. يضع مع مجموعته خطة ويعرضها (الاختبار المهاري ص 61).\n3. يقيم تنفيذ الخطط.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: إبداع\nالم ل تطبيق الخطط.\nالإجابة: الإعداد الذهني والسمات الإرادية.\nس3 (المستوى المتقدم): ما الخطة الهجومية الفردية؟\nالإجابة: التحركات والمهارات التي يؤديها لاعب واحد.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ 3 ضد 3 بتطبيق عاملين.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا يهم الإعداد الذهني؟\nالإجابة: لتطبيق الخطة تطبيقًا متميزًا.\nس3 (المستوى المتقدم): ما أثر التضييق على المهاجم؟\nالإجابة: يجبره على التحرك للجانب.\n\nالحصة 3:\nس1 (مستوى الدعم): نفذ الخطة في 5 ضد 5.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): ما مسؤولية كل مدافع؟\nالإجابة: مراقبة أي مهاجم يدخل منطقته.\nس3 (المستوى المتقدم): اذكر خطوات تعليم الخطة.\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): نفذ الخطة مع زملائك.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): متى نجحت الخطة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحتاجه فريقك؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): اعرض خطة مجموعتك.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): ما العوامل التي ساعدت على النجاح؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تعدل الخطة ضد فريق أقوى؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك أنواع الخطط.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة وملاحظة الظهور للزميل.\n\nالحصة 3:\nإرشاد لولي الأمر: ناقش مع طالبك خطة الدفاع.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على التدرب على الجري دون كرة.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على طرق اللعب (دليل المعلم ص 57)."}}, {"title": "طرق اللعب في كرة القدم", "unit": "كرة القدم (ذكور)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 57-60", "n": 5, "periods": [{"focus": "مفهوم طرق اللعب وأسس اختيارها وأهدافها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم طرق اللعب (توزيع اللاعبين وتحديد المسؤوليات).\n2. يذكر أسس اختيار الطريقة (مناسبة الظروف، المرونة، مستوى اللاعبين).\n3. يفسر أهداف طرق اللعب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": النشط\n- مصيدة التسلل", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم موقفًا ويسأل: هل اللاعب متسلل؟ (ص 60).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المادة 11 بأمثلة.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب: خط دفاع يطبق مصيدة التسلل ومهاجمون يحاولون التوقيت، وحكم مساعد من الطلبة.\n- الطالب: يتدرب ويحكم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: حالات تسلل.\n- الطالب: يقرر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): متى يكون اللاعب في موقف تسلل؟\nالإجابة: إذا كان أقرب إلى مرمى الخصم من الكرة وثاني آخر لاعب منافس.\nس2 (المستوى المتوقع): هل الوجود في موقف تسلل مخالفة؟\nالإجابة: لا، إلا عند الاشتراك في اللعب النشط.\nس3 (المستوى المتقدم): متى لا يكون متسللًا؟\nالإجابة: في نصفه أو في مستوى ثاني آخر لاعب.", "التقويم الختامي": "س1 (مستوى الدعم): قرر في موقف يعرضه المعلم.\nالإجابة: يقرر.\nس2 (المستوى المتوقع): كيف تطبق مصيدة التسلل؟\nالإجابة: بتقدم خط الدفاع معًا لحظة التمرير.\nس3 (المستوى المتقدم): ما عقوبة التسلل؟\nالإجابة: ركلة حرة غير مباشرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قانون التسلل."}}, {"focus": "مباراة 11 ضد 11 بطريقتي اللعب والاختبار المعرفي القصير", "num": 5, "fields": {"المخرجات التعليمية": "1. يطبق طريقة لعب محددة في مباراة.\n2. يجيب عن اختبار قصير (عوامل الخطة، أنواع الخطط، التسلل، طرق اللعب).\n3. يقيم أداء الفريق بالطريقة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: أوراق اختبار", "المفاهيم": "- المباراة\n- طريقة اللعب\n- الاختبار القصير", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم الاختبار القصير (ص 61) ثم تنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار معرفي قصير.\n- الطالب: يجيب.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة بفريق يلعب 4/4/2 وآخر 4/3/3 بحكام.\n- الطالب: يلعب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم.\n- الطالب: يقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر طرق اللعب.\nالإجابة: 4/4/2 و4/3/3.\nس2 (المستوى المتوقع): متى يكون اللاعب متسللًا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اذكر عاملًا لإعداد خطة اللعب.\nالإجابة: مستوى الإعداد الذهني.", "التقويم الختامي": "س1 (مستوى الدعم): ما طريقة فريقك وكيف أديتها؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي الطريقتين كانت أفضل في المباراة ولماذا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي تعدله في طريقتكم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة الخطط والطرق قبل التطبيقات."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم طرق اللعب (توزيع اللاعبين وتحديد المسؤوليات).\n2. يذكر أسس اختيار الطريقة (مناسبة الظروف، المرونة، مستوى اللاعبين).\n3. يفسر أهداف طرق اللعب.\n\nالحصة 2:\n1. يصف طريقة 4/4/2 وواجبات كل خط.\n2. يطبق الطريقة عمليًا دون منافس ثم مع منافس.\n3. يحدد حالات استخدامها (منافس بخطط فنية عالية، امتصاص الضغط والهجمات المرتدة).\n\nالحصة 3:\n1. يصف طريقة 4/3/3 وواجبات لاعبيها.\n2. يطبقها عمليًا مع منافس في مجموعات.\n3. يقارن بين 4/4/2 و4/3/3.\n\nالحصة 4:\n1. يتعرف موقف التسلل ومتى لا يكون اللاعب متسللًا.\n2. يميز المخالفة (الاشتراك في اللعب النشط) من مجرد الوجود في موقف تسلل.\n3. يطبق مصيدة التسلل كخطة دفاعية.\n\nالحصة 5:\n1. يطبق طريقة لعب محددة في مباراة.\n2. يجيب عن اختبار قصير (عوامل الخطة، أنواع الخطط، التسلل، طرق اللعب).\n3. يقيم أداء الفريق بالطريقة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- جهاز عرض البيانات\n- السبورة الذكية\n- أخرى: مجسم ملعب\n\nالحصة 2:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- السبورة الذكية\n\nالحصة 3:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- السبورة الذكية\n\nالحصة 4:\n- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- السبورة الذكية\n\nالحصة 5:\n- أخرى: كرات قدم\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: أوراق اختبار", "المفاهيم": "الحصة 1:\n- طرق اللعب\n- توزيع اللاعبين\n- المرونة\n\nالحصة 2:\n- 4/4/2\n- خط الدفاع\n- خط الوسط\n- الهجمات المرتدة\n\nالحصة 3:\n- 4/3/3\n- الهجوم\n- التحول\n\nالحصة 4:\n- التسلل\n- ثاني آخر لاعب\n- اللعب النشط\n- مصيدة التسلل\n\nالحصة 5:\n- المباراة\n- طريقة اللعب\n- الاختبار القصير", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: ما الفرق بين الخطة وطريقة اللعب؟ (ص 57).\n\nالحصة 2:\nيرسم المعلم 4/4/2 ويسأل: لماذا تؤمن هذه الطريقة الدفاع؟ (ص 58).\n\nالحصة 3:\nيسأل المعلم: متى نلعب بثلاثة مهاجمين؟ (ص 58-59).\n\nالحصة 4:\nيعرض المعلم موقفًا ويسأل: هل اللاعب متسلل؟ (ص 60).\n\nالحصة 5:\nيوضح المعلم الاختبار القصير (ص 61) ثم تنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والأسس والأهداف.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات توزع 11 لاعبًا على مجسم بطريقة من اختيارها وتبرر.\n- الطالب: يوزع.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة بتوزيع المراكز في ملعب مصغر.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الطريقة والواجبات وحالات الاستخدام.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تنفيذ دون منافس ثم مع منافس في مجموعات صغيرة (5/5 ثم 7/7).\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش حالات الاستخدام.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الطريقة وحالات استخدامها (فريق أقل مستوى، سهولة التحول).\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تنفيذ 4/3/3 في 7 ضد 7 ثم 11 ضد 11 حسب المساحة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة الطريقتين.\n- الطالب: يقارن.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المادة 11 بأمثلة.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب: خط دفاع يطبق مصيدة التسلل ومهاجمون يحاولون التوقيت، وحكم مساعد من الطلبة.\n- الطالب: يتدرب ويحكم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: حالات تسلل.\n- الطالب: يقرر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار معرفي قصير.\n- الطالب: يجيب.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة بفريق يلعب 4/4/2 وآخر 4/3/3 بحكام.\n- الطالب: يلعب.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم.\n- الطالب: يقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما طرق اللعب؟\nالإجابة: توزيع لاعبي الفريق في الملعب مع تحديد مسؤولية كل لاعب.\nس2 (المستوى المتوقع): اذكر أساسًا لاختيار الطريقة.\nالإجابة: مناسبتها لمستوى اللاعبين.\nس3 (المستوى المتقدم): اذكر هدفًا لطرق اللعب.\nالإجابة: تعويد اللاعب على الأداء المنظم.\n\nالحصة 2:\nس1 (مستوى الدعم): بماذا تتميز 4/4/2؟\nالإجابة: السيطرة الهجومية والدفاعية وتأمين الدفاع وزيادة عددية في الوسط.\nس2 (المستوى المتوقع): ما واجب خط الدفاع فيها؟\nالإجابة: تأمين المنطقة الخلفية ومساندة الوسط.\nس3 (المستوى المتقدم): متى تستخدم؟\nالإجابة: عند مواجهة فريق بخطط ومهارات عالية.\n\nالحصة 3:\nس1 (مستوى الدعم): متى تستخدم 4/3/3؟\nالإجابة: عند مقابلة فريق أقل مستوى أو لسهولة التحول من الهجوم للدفاع.\nس2 (المستوى المتوقع): كم مهاجمًا فيها؟\nالإجابة: ثلاثة.\nس3 (المستوى المتقدم): ما الفرق عن 4/4/2؟\nالإجابة: لاعب وسط أقل ومهاجم أكثر.\n\nالحصة 4:\nس1 (مستوى الدعم): متى يكون اللاعب في موقف تسلل؟\nالإجابة: إذا كان أقرب إلى مرمى الخصم من الكرة وثاني آخر لاعب منافس.\nس2 (المستوى المتوقع): هل الوجود في موقف تسلل مخالفة؟\nالإجابة: لا، إلا عند الاشتراك في اللعب النشط.\nس3 (المستوى المتقدم): متى لا يكون متسللًا؟\nالإجابة: في نصفه أو في مستوى ثاني آخر لاعب.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر طرق اللعب.\nالإجابة: 4/4/2 و4/3/3.\nس2 (المستوى المتوقع): متى يكون اللاعب متسللًا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اذكر عاملًا لإعداد خطة اللعب.\nالإجابة: مستوى الإعداد الذهني.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ما الفرق بين الخطة وطريقة اللعب؟\nالإجابة: الطريقة توزيع المراكز، والخطة التحركات أثناء المباراة.\nس2 (المستوى المتوقع): لماذا يجب أن تتصف الطريقة بالمرونة؟\nالإجابة: لتتغير حسب ظروف المباراة.\nس3 (المستوى المتقدم): اعرض توزيع مجموعتك.\nالإجابة: يعرض.\n\nالحصة 2:\nس1 (مستوى الدعم): نفذ 4/4/2 في 7 ضد 7.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): كيف تساند خطوط الفريق بعضها؟\nالإجابة: بالتمريرات البينية والحائطية وتبادل المراكز.\nس3 (المستوى المتقدم): لماذا تناسب المباريات على ملعب المنافس؟\nالإجابة: لامتصاص الضغط والهجمات المرتدة.\n\nالحصة 3:\nس1 (مستوى الدعم): نفذ 4/3/3.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): أي الطريقتين أنسب لفريقك ولماذا؟\nالإجابة: يذكر ويعلل.\nس3 (المستوى المتقدم): كيف يتحول الفريق من الهجوم للدفاع في 4/3/3؟\nالإجابة: بعودة الأجنحة لمساندة الوسط.\n\nالحصة 4:\nس1 (مستوى الدعم): قرر في موقف يعرضه المعلم.\nالإجابة: يقرر.\nس2 (المستوى المتوقع): كيف تطبق مصيدة التسلل؟\nالإجابة: بتقدم خط الدفاع معًا لحظة التمرير.\nس3 (المستوى المتقدم): ما عقوبة التسلل؟\nالإجابة: ركلة حرة غير مباشرة.\n\nالحصة 5:\nس1 (مستوى الدعم): ما طريقة فريقك وكيف أديتها؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي الطريقتين كانت أفضل في المباراة ولماذا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي تعدله في طريقتكم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك طرق اللعب المشهورة.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على رسم 4/4/2 وشرح واجباتها.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على متابعة طرق لعب الفرق في المباريات.\n\nالحصة 4:\nإرشاد لولي ال رك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والميزات والعيوب.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: جدول مقارنة بين الدوري وخروج المغلوب.\n- الطالب: يقارن.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: استنتاج متى يناسب كل منهما.\n- الطالب: يستنتج.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما طرق الدوري؟\nالإجابة: يقابل كل فريق الفرق الأخرى مرة أو مرتين.\nس2 (المستوى المتوقع): اذكر ميزة.\nالإجابة: العدالة وتحديد المراكز.\nس3 (المستوى المتقدم): اذكر عيبًا.\nالإجابة: طول الفترة وكثرة المباريات.", "التقويم الختامي": "س1 (مستوى الدعم): متى نفضل الدوري؟\nالإجابة: عند توفر الوقت والإمكانات.\nس2 (المستوى المتوقع): اذكر ثلاث ميزات.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): متى نفضل خروج المغلوب؟\nالإجابة: عند ضيق الوقت.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك ميزات الدوري."}}, {"focus": "الدوري من مرحلة واحدة: احتساب النقاط ومعادلة عدد المباريات", "num": 2, "fields": {"المخرجات التعليمية": "1. يذكر طريقة احتساب النقاط (3 للفائز، 1 للتعادل، 0 للخاسر).\n2. يحسب عدد المباريات بالمعادلة ن(ن-1)/2.\n3. يحل مسائل لأعداد مختلفة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق عمل", "المفاهيم": "- النقاط\n- عدد المباريات\n- المعادلة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كم مباراة لـ10 فرق في دوري من مرحلة؟ (ص 72).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح النقاط والمعادلة بمثال 10 فرق = 45 مباراة.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: حل مسائل (6، 8، 12 فريقًا).\n- الطالب: يحل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض الحلول.\n- الطالب: يعرض.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كم نقطة للفائز؟\nالإجابة: ثلاث.\nس2 (المستوى المتوقع): كم مباراة لـ10 فرق؟\nالإجابة: 45.\nس3 (المستوى المتقدم): ما المعادلة؟\nالإجابة: ن(ن-1)/2.", "التقويم الختامي": "س1 (مستوى الدعم): كم مباراة لـ8 فرق؟\nالإجابة: 28.\nس2 (المستوى المتوقع): كم مباراة لـ12 فريقًا؟\nالإجابة: 66.\nس3 (المستوى المتقدم): ماذا لو تساوت النقاط؟\nالإجابة: يرجع لفارق الأهداف أو لائحة اللجنة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على حل مسائل عدد المباريات."}}, {"focus": "رسم جدول الدوري من مرحلة واحدة (طريقة الميزان والدوران) لـ8 فرق", "num": 3, "fields": {"المخرجات التعليمية": "1. يرسم جدول دوري 8 فرق بالأدوار السبعة.\n2. يطبق طريقة تثبيت فريق ودوران الباقين.\n3. يتحقق من أن كل فريق يقابل الجميع مرة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول", "المفاهيم": "- الأدوار\n- الدوران\n- الميزان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم جدول ص 73 (الدور الأول حتى السابع) ويسأل: كيف رُتبت المباريات؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح طريقة التثبيت والدوران.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل مجموعة ترسم جدول 8 فرق بأسماء ولايات.\n- الطالب: يرسم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: التحقق.\n- الطالب: يتحقق.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كم دورًا لـ8 فرق؟\nالإجابة: سبعة.\nس2 (المستوى المتوقع): كم مباراة في كل دور؟\nالإجابة: أربع.\nس3 (المستوى المتقدم): ما طريقة الترتيب؟\nالإجابة: تثبيت فريق ودوران الباقين.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 8 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): كيف تتحقق من صحة الجدول؟\nالإجابة: بأن كل فريق قابل الجميع مرة.\nس3 (المستوى المتقدم): كم دورًا لـ6 فرق؟\nالإجابة: خمسة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على رسم جدول دوري."}}, {"focus": "جدول الدوري لعدد فردي من الفرق (الراحة) وجدول الترتيب", "num": 4, "fields": {"المخرجات التعليمية": "1. يرسم جدول دوري لعدد فردي من الفرق مع فريق مستريح في كل دور.\n2. يعد جدول الترتيب (لعب، فاز، تعادل، خسر، له، عليه، النقاط).\n3. يرتب الفرق من نتائج افتراضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول", "المفاهيم": "- العدد الفردي\n- الراحة\n- جدول الترتيب\n- فارق الأهداف", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ماذا لو شاركت 7 فرق؟ (ص 75-76).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الراحة وجدول الترتيب.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: رسم جدول 7 فرق وإعداد جدول ترتيب من نتائج معطاة.\n- الطالب: يرسم ويرتب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض.\n- الطالب: يعرض.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كم دورًا لـ7 فرق؟\nالإجابة: سبعة مع فريق مستريح في كل دور.\nس2 (المستوى المتوقع): اذكر أعمدة جدول الترتيب.\nالإجابة: لعب، فاز، تعادل، خسر، له، عليه، النقاط.\nس3 (المستوى المتقدم): كيف نفرق بين فريقين متساويين بالنقاط؟\nالإجابة: بفارق الأهداف.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 7 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): رتب الفرق من  2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على المشاريع\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة\n- أخرى: جداول", "المفاهيم": "- الترتيب النهائي\n- التساوي\n- التقويم", "التهيئة / التمهيد / التعلم القبلي": "تعلن اللجنة الفنية الجولات المتبقية.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (24 دقائق):\n- الاستراتيجية: التعلم المبني على المشاريع\n- المعلم: مباريات الجولات المتبقية والترتيب النهائي.\n- الطالب: يلعب ويسجل.\n\nالنشاط 3 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقويم التنظيم.\n- الطالب: يقوّم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): من فاز بالدوري؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف حللتم التساوي؟\nالإجابة: بفارق الأهداف.\nس3 (المستوى المتقدم): ما نقطة قوة التنظيم؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): ما الذي يحسن في دوري قادم؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كم مباراة لعبت؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي تعلمته من التنظيم؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك نموذج الاختبار ص 77."}}, {"focus": "حل نموذج الاختبار (ترتيب 7 فرق من نتائج) ومراجعة الوحدة", "num": 7, "fields": {"المخرجات التعليمية": "1. يحل مسألة ترتيب 7 فرق من نتائج معطاة.\n2. يذكر ميزات الدوري.\n3. يتحقق من صحة الترتيب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق عمل", "المفاهيم": "- نموذج الاختبار\n- الترتيب\n- النقاط", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم نموذج الاختبار ص 77.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح خطوات الحل.\n- الطالب: يستمع.\n\nالنشاط 3 (20 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: حل المسألة في مجموعات.\n- الطالب: يحل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة الحلول.\n- الطالب: يتحقق.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر ثلاث ميزات للدوري.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كم نقطة لفريق فاز 4 وتعادل 1 وخسر 1؟\nالإجابة: 13.\nس3 (المستوى المتقدم): كيف نحسب الأهداف له وعليه؟\nالإجابة: بجمع أهداف الفريق وأهداف منافسيه.", "التقويم الختامي": "س1 (مستوى الدعم): رتب الفرق السبعة.\nالإجابة: يرتب.\nس2 (المستوى المتوقع): من الأول ومن الأخير؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحدد الترتيب عند التساوي؟\nالإجابة: فارق الأهداف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك مهارات كرة القدم قبل الاختبار العملي (2)."}}, {"focus": "مراجعة شاملة لمهارات وخطط كرة القدم استعدادًا للاختبار", "num": 8, "fields": {"المخرجات التعليمية": "1. يراجع الحائطية والبينية ومهارات الحارس والخطط والطرق.\n2. يحدد ما يحتاج إلى تدريب.\n3. يستعد نفسيًا للاختبار.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: صدريات ملونة", "المفاهيم": "- المراجعة\n- الاستعداد", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم محطات المراجعة ومعايير الاختبار.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات مراجعة بتقييم الأقران.\n- الطالب: يؤدي.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحديد الاحتياج.\n- الطالب: يحدد.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما معايير الاختبار؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أي المهارات أتقنتها؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الخطة التي ستطبقها؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): ما الذي ستتدرب عليه قبل الاختبار؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تستعد نفسيًا؟\nالإجابة: بالثقة والتركيز.\nس3 (المستوى المتقدم): ما دور زميلك في تقييمك؟\nالإجابة: تغذية راجعة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مراجعة المهارات."}}, {"focus": "الاختبار العملي (2): مهارات وخطط كرة القدم", "num": 9, "fields": {"المخرجات التعليمية": "1. يؤدي الحائطية والبينية ومهارات الحارس.\n2. ينفذ خطة هجومية ودفاعية في موقف لعب.\n3. يطبق قانون التسلل في موقف لعب.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرمى\n- أخرى: صدريات ملونة\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- الاختبار العملي\n- المهارات\n- الخطط", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: محطات مهارية وخططية ويرصد المعلم.\n- الطالب: يؤدي عند دوره.\n\nالنشاط 3 (دقيقة واحدة):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تلخيص.\n- الطالب: يستمع.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: واحدة.\nس2 (المستوى المتوقع): متى يكون اللاعب متسللًا؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اذكر طريقة لعب.\nالإجابة: 4/4/2.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ محطات الاختبار.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما تقييمك لأدائك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي تطوره؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك تنظيم الدوري قبل الحصة الأخيرة من الاختبار."}}, {"focus": "الاختبار العملي (2): تنظيم الدوري من مرحلة واحدة (رسم الجداول والترتيب)", "num": 10, "fields": {"المخرجات التعليمية": "1. يرسم جدول دوري لعدد زوجي وفردي من الفرق.\n2. يحسب عدد المباريات ويعد جدول الترتيب من نتائج.\n3. يفسر ميزات الدوري وعيوبه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أوراق اختبار\n- السبورة الذكية", "المفاهيم": "- الاختبار\n- الجدول\n- الترتيب", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم الاختبار الكتابي.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يستمع.\n\nالنشاط 2 (28 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار: جدول 6 فرق، جدول 5 فرق، عدد مباريات 9 فرق، ترتيب من نتائج، ميزات وعيوب.\n- الطالب: يجيب.\n\nالنشاط 3 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مراجعة.\n- الطالب: يصحح.\n\nالنشاط 4 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يستمع.", "التقويم التكويني": "س1 (مستوى الدعم): كم مباراة لـ9 فرق؟\nالإجابة: 36.\nس2 (المستوى المتوقع): كم دورًا لـ5 فرق؟\nالإجابة: خمسة.\nس3 (المستوى المتقدم): اذكر ميزة للدوري.\nالإجابة: العدالة.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 6 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): رتب الفرق من النتائج.\nالإجابة: يرتب.\nس3 (المستوى المتقدم): متى يناسب الدوري المدرسة؟\nالإجابة: عند توفر الوقت.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على الدوري من مرحلتين (دليل المعلم ص 74)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طرق الدوري بوصفها أعدل طرق التنظيم.\n2. يذكر ميزات الدوري (استمرار التنافس، الاحتكاك، العدالة، تحديد المراكز) وعيوبه (طول الفترة، كثرة المباريات).\n3. يقارن الدوري بخروج المغلوب.\n\nالحصة 2:\n1. يذكر طريقة احتساب النقاط (3 للفائز، 1 للتعادل، 0 للخاسر).\n2. يحسب عدد المباريات بالمعادلة ن(ن-1)/2.\n3. يحل مسائل لأعداد مختلفة.\n\nالحصة 3:\n1. يرسم جدول دوري 8 فرق بالأدوار السبعة.\n2. يطبق طريقة تثبيت فريق ودوران الباقين.\n3. يتحقق من أن كل فريق يقابل الجميع مرة.\n\nالحصة 4:\n1. يرسم جدول دوري لعدد فردي من الفرق مع فريق مستريح في كل دور.\n2. يعد جدول الترتيب (لعب، فاز، تعادل، خسر، له، عليه، النقاط).\n3. يرتب الفرق من نتائج افتراضية.\n\nالحصة 5:\n1. ينظم مع زملائه دوريًا مصغرًا (4-5 فرق) من مرحلة واحدة.\n2. يسجل النتائج ويحدث جدول الترتيب.\n3. يؤدي دوره في اللجان.\n\nالحصة 6:\n1. يستكمل جولات الدوري ويعلن الترتيب النهائي.\n2. يحل حالات التساوي بفارق الأهداف.\n3. يقوّم تنظيم الدوري.\n\nالحصة 7:\n1. يحل مسألة ترتيب 7 فرق من نتائج معطاة.\n2. يذكر ميزات الدوري.\n3. يتحقق من صحة الترتيب.\n\nالحصة 8:\n1. يراجع الحائطية والبينية ومهارات الحارس والخطط والطرق.\n2. يحدد ما يحتاج إلى تدريب.\n3. يستعد نفسيًا للاختبار.\n\nالحصة 9:\n1. يؤدي الحائطية والبينية ومهارات الحارس.\n2. ينفذ خطة هجومية ودفاعية في موقف لعب.\n3. يطبق قانون التسلل في موقف لعب.\n\nالحصة 10:\n1. يرسم جدول دوري لعدد زوجي وفردي من الفرق.\n2. يحسب عدد المباريات ويعد جدول الترتيب من نتائج.\n3. يفسر ميزات الدوري وعيوبه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 7:\nالمخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تحليل\n\nالحصة 8:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 9:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 10:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\ ى الدعم): كم مباراة لـ6 فرق من مرحلتين؟\nالإجابة: 30.\nس2 (المستوى المتوقع): لماذا تلعب على أرض الفريقين؟\nالإجابة: لضمان تكافؤ الفرص.\nس3 (المستوى المتقدم): متى تناسب المدرسة؟\nالإجابة: عند توفر فصل دراسي كامل وعدد فرق قليل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على حل مسائل المرحلتين."}}, {"focus": "رسم جدول الدوري من مرحلتين واحتساب النتائج بطريقة النقاط", "num": 2, "fields": {"المخرجات التعليمية": "1. يرسم جدول مرحلتين لـ6 فرق (ذهاب وإياب).\n2. يحتسب النتائج بالنقاط (3، 1، 0).\n3. يرتب الفرق بعد المرحلتين.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- أخرى: أوراق رسم الجداول", "المفاهيم": "- الذهاب\n- الإياب\n- النقاط\n- الترتيب", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نحول جدول مرحلة واحدة إلى مرحلتين؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الرسم بعكس الأرض في الإياب والاحتساب.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: رسم جدول 6 فرق وترتيب من نتائج معطاة.\n- الطالب: يرسم ويرتب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض.\n- الطالب: يعرض.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف يكون الإياب؟\nالإجابة: بتبادل أرض الفريقين.\nس2 (المستوى المتوقع): كم نقطة للتعادل؟\nالإجابة: واحدة.\nس3 (المستوى المتقدم): كم دورًا لـ6 فرق من مرحلتين؟\nالإجابة: عشرة.", "التقويم الختامي": "س1 (مستوى الدعم): ارسم جدول 6 فرق من مرحلتين.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): رتب الفرق.\nالإجابة: يرتب.\nس3 (المستوى المتقدم): ماذا لو تساوى فريقان في كل شيء؟\nالإجابة: مباراة فاصلة أو حسب اللائحة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على رسم ج تين؟\nالإجابة: 90.\nس2 (المستوى المتوقع): ما ميزة المرحلتين؟\nالإجابة: تقل عوامل الصدفة والحظ وتكافؤ الفرص بأرض الفريقين.\nس3 (المستوى المتقدم): ما عيبها؟\nالإجابة: وقت وإمكانات أكبر.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف يكون الإياب؟\nالإجابة: بتبادل أرض الفريقين.\nس2 (المستوى المتوقع): كم نقطة للتعادل؟\nالإجابة: واحدة.\nس3 (المستوى المتقدم): كم دورًا لـ6 فرق من مرحلتين؟\nالإجابة: عشرة.\n\nالحصة 3:\nس1 (مستوى الدعم): كم جولة في الذهاب لـ4 فرق؟\nالإجابة: ثلاث.\nس2 (المستوى المتوقع): كم مباراة في الجولة؟\nالإجابة: مباراتان.\nس3 (المستوى المتقدم): من يتصدر؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): هل تغير الترتيب بعد الإياب؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): من فاز؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): لماذا يقلل الإياب أثر الحظ؟\nالإجابة: لأن كل فريق يلعب مرتين.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر وحدات الفصل.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كم مباراة لـ8 فرق في كل طريقة؟\nالإجابة: 7، 14 تقريبًا، 28، 56.\nس3 (المستوى المتقدم): ما أعدل الطرق؟\nالإجابة: الدوري.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): كم مباراة لـ6 فرق من مرحلتين؟\nالإجابة: 30.\nس2 (المستوى المتوقع): لماذا تلعب على أرض الفريقين؟\nالإجابة: لضمان تكافؤ الفرص.\nس3 (المستوى المتقدم): متى تناسب المدرسة؟\nالإجابة: عند توفر فصل دراسي كامل وعدد فرق قليل.\n\nالحصة 2:\nس1 (مستوى الدعم): ارسم جدول 6 فرق من مرحلتين.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): رتب الفرق.\nالإجابة: يرتب.\nس3 (المستوى المتقدم): ماذا لو تساوى فريقان في كل شيء؟\nالإجابة: مباراة فاصلة أو حسب اللائحة.\n\nالحصة 3:\nس1 (مستوى الدعم): حدّث الترتيب.\nالإجابة: يحدّث.\nس2 (المستوى المتوقع): ما دورك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الفرق التنظيمي عن دوري الأسبوع الماضي؟\nالإجابة: وجود إياب.\n\nالحصة 4:\nس1 (مستوى الدعم): قوّم التنظيم.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما الذي تعلمته؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أي الطرق تفضل لبطولة المدرسة ولماذا؟\nالإجابة: يذكر ويعلل.\n\nالحصة 5:\nس1 (مستوى الدعم): ما العنصر البدني الذي تحسن لديك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما خطتك للعطلة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): أي الطرق تختار لبطولة من أسبوع لـ8 فرق؟\nالإجابة: خروج المغلوب من مرة مع الترضية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على حل مسائل المرحلتين.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على رسم جدول مرحلتين لـ4 فرق.\n\nالحصة 3:\nإرشاد لولي الأمر: اسأل طالبك عن دوري الذهاب والإياب.\n\nالحصة 4:\nإرشاد لولي الأمر: راجع مع طالبك موضوعات الفصل.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على الاستمرار في النشاط البدني في العطلة والاطلاع على موضوعات الفصل الثاني (الكرة الطائرة، كرة السلة، كرة اليد) في دليل المعلم."}}];
const FIELDS = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const GNOTE = "خمس حصص أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ اعتُمد مسار الذكور (كرة القدم) في الوحدة الثالثة.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
