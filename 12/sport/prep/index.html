: تحديد الهدف.\n- الطالب: يحدد.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر وحدات الفصل.\nالإجابة: اللياقة البدنية، مسابقات الميدان، كرة القدم، التنظيم والإدارة.\nس2 (المستوى المتوقع): ما هدف التهدئة؟\nالإجابة: إعادة الجسم لحالته الطبيعية ومنع الشد.\nس3 (المستوى المتقدم): ما الإحماء الخاص؟\nالإجابة: تمرينات تشبه النشاط المقبل.\n\nالحصة 2:\nس1 (مستوى الدعم): كم خطوة إيقاع في الرمح؟\nالإجابة: خمس.\nس2 (المستوى المتوقع): ما أقسام البدء المنخفض؟\nالإجابة: خذ مكانك، استعد، انطلق.\nس3 (المستوى المتقدم): ما أصعب مراحل السباق؟\nالإجابة: النهاية.\n\nالحصة 3:\nس1 (مستوى الدعم): بكم لمسة يعيد الحائط الكرة؟\nالإجابة: واحدة.\nس2 (المستوى المتوقع): إلى أين تمرر البينية؟\nالإجابة: المكان الشاغر خلف المدافعين.\nس3 (المستوى المتقدم): بكم قدم يثب الحارس للكرة العالية؟\nالإجابة: بقدم واحدة.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر وظائف الإدارة.\nالإجابة: التخطيط، التنظيم، القيادة، التنسيق، الرقابة.\nس2 (المستوى المتوقع): كم مباراة لـ8 فرق؟\nالإجابة: 7.\nس3 (المستوى المتقدم): كم يستبقى من 6 فرق؟\nالإجابة: فريقان.\n\nالحصة 5:\nس1 (مستوى الدعم): ما الذي يقيسه الجلوس من الرقود؟\nالإجابة: الجلد العضلي.\nس2 (المستوى المتوقع): ما الذي يقيسه الوثب من الثبات؟\nالإجابة: القدرة.\nس3 (المستوى المتقدم): لماذا نقيس أولًا؟\nالإجابة: لمتابعة التقدم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): قُد إحماءً خاصًا لدفع الجلة.\nالإجابة: يقود.\nس2 (المستوى المتوقع): اذكر ثلاث قواعد للأمن.\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الفرق بين الإحماء العام والخاص؟\nالإجابة: يذكر.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ رمي الرمح من الاقتراب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما زمنك في 50 م؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي ستطوره؟\nالإجابة: يذكر.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الحائطية مع مدافع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ مسك كرة عالية.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): قيّم أداء زميلك.\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): ارسم جدول 8 فرق.\nالإجابة: يرسم.\nس2 (المستوى المتوقع): ما عيب خروج المغلوب من مرة؟\nالإجابة: خروج نصف الفرق مبكرًا.\nس3 (المستوى المتقدم): ما الطريقة الأعدل؟\nالإجابة: الدوري.\n\nالحصة 5:\nس1 (مستوى الدعم): سجل نتائجك.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): ما هدفك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ستحققه؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء وراجع مع طالبك خطة الفصل (دليل المعلم ص 10).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مراجعة المهارات.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التدرب مع الأصدقاء.\n\nالحصة 4:\nإرشاد لولي الأمر: راجع مع طالبك طرق تنظيم المسابقات.\n\nالحصة 5:\nإرشاد لولي الأمر: ساعد طالبك على متابعة هدفه، وراجعا عناصر اللياقة (دليل المعلم ص 17)."}}, {"title": "مراجعة لعناصر اللياقة البدنية وتدريباتها", "unit": "اللياقة البدنية", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 17-21", "n": 5, "periods": [{"focus": "القوة العضلية وتدريباتها بالكرات الطبية", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم القوة وأنواعها.\n2. يؤدي تدريبات القوة بالكرة الطبية (تقوس الجذع لتسليم الكرة، جلوس التوازن بالكرة، رسم دائرة بالكرة).\n3. يميز العضلات العاملة في كل تدريب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: مراتب", "المفاهيم": "- القوة العضلية\n- الكرة الطبية\n- العضلات العاملة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا نراجع عناصر اللياقة في الصف الثاني عشر؟ (ص 17).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج ص 18: تقوس الجذع خلفًا لتسليم الكرة والاستقبال من بين الرجلين، رمي الكرة عاليًا من يد لأخرى، جلوس التوازن بالكرة 5 ثوانٍ، رسم دائرة بالكرة بين القدمين.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات بالكرات الطبية.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحديد العضلات العاملة.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (المستوى المتوقع): أي العضلات تعمل في جلوس التوازن بالكرة؟\nالإجابة: البطن.\nس3 (المستوى المتقدم): اذكر نوعين للقوة.\nالإجابة: القصوى والمميزة بالسرعة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تمرينين بالكرة الطبية.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): لماذا ترتبط القوة بالجلد العضلي؟\nالإجابة: لأن الجلد العضلي يعتمد على قوة العضلات واستمرارها.\nس3 (المستوى المتقدم): اذكر تدريبًا زوجيًا بالكرة.\nالإجابة: تقوس الجذع لتسليم الكرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات القوة بكرة ثقيلة قليلًا."}}, {"focus": "السرعة وأنواعها وتدريباتها", "num": 2, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم السرعة وأنواعها.\n2. يؤدي تدريبات السرعة (العدو 20-30 م من الوضع أمامًا، التمرير بإيقاع سريع، لمس القدمين بالتبادل).\n3. يربط كل تدريب بنوع السرعة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: كرات\n- أخرى: ساعات إيقاف", "المفاهيم": "- سرعة الانتقال\n- سرعة الحركة\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما أنواع السرعة؟ (ص 19).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج التدريبات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: عدو 30 م، تمرير سريع في أزواج، رد الفعل بالإشارة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط التدريبات بالأنواع.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما السرعة؟\nالإجابة: أداء حركة متكررة في أقصر زمن.\nس2 (المستوى المتوقع): ما سرعة رد الفعل؟\nالإجابة: الاستجابة للمثير في أقصر زمن.\nس3 (المستوى المتقدم): اذكر تدريبًا لسرعة الحركة.\nالإجابة: التمرير بإيقاع سريع.", "التقويم الختامي": "س1 (مستوى الدعم): صنف: العدو 30 م.\nالإجابة: سرعة انتقال.\nس2 (المستوى المتوقع): أدِّ 10 تمريرات سريعة مع زميلك.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): اقترح تدريبًا لرد الفعل.\nالإجابة: الانطلاق بإشارات مختلفة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على العدو القصير."}}, {"focus": "المرونة وتدريباتها ومراعاة الحمل", "num": 3, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم المرونة وارتباطها بالرياضات.\n2. يؤدي تدريبات المرونة مع مراعاة الزيادة التدريجية للحمل.\n3. يفسر أهمية خصوصية التدريب للنشاط.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: عصي\n- أخرى: مقاعد سويدية", "المفاهيم": "- المرونة\n- المدى الحركي\n- الحمل\n- الخصوصية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: أي المفاصل يحتاج متسابق الحواجز إلى مرونتها؟ (ص 20).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج تدريبات المرونة الثابتة والمتحركة للفخذ والكتف والجذع.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات إطالة بالتدرج.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا نزيد الحمل تدريجيًا؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما المرونة؟\nالإجابة: المدى الحركي لمفصل أو مجموعة مفاصل.\nس2 (المستوى المتوقع): أي المفاصل يهم رامي الرمح؟\nالإجابة: مفاصل الذراع والكتف.\nس3 (المستوى المتقدم): ما خصوصية التدريب؟\nالإجابة: تناسب التدريب مع النشاط الممارس.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ إطالة لمفصل الفخذ.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): لماذا لا نبدأ بمدى حركي كامل فجأة؟\nالإجابة: لتجنب الإصابة.\nس3 (المستوى المتقدم): اذكر رياضة تحتاج مرونة الكتف.\nالإجابة: قذف القرص.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الإطالة اليومية بتدرج."}}, {"focus": "الرشاقة وتدريباتها وشروط التدريب عليها", "num": 4, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم الرشاقة وشرط عدم التدريب عليها عند التعب.\n2. يؤدي تدريبات الرشاقة (المشي مع التصفيق أمام وخلف، ثني الركبتين وقذف الرجلين للانبطاح المائل).\n3. يفسر لماذا تحتاج الرشاقة إلى استعداد وظيفي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: سلم الرشاقة", "المفاهيم": "- الرشاقة\n- الدقة\n- السرعة\n- الاستعداد الوظيفي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: متى لا ندرب الرشاقة؟ (ص 21).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج التدريبات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الرشاقة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش شرط عدم التعب.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الرشاقة؟\nالإجابة: تغيير أوضاع الجسم في اتجاهات مختلفة بدقة وسرعة.\nس2 (المستوى المتوقع): متى لا ندرب الرشاقة؟\nالإجابة: عند التعب أو الإرهاق.\nس3 (المستوى المتقدم): اذكر تدريبًا.\nالإجابة: المشي مع التصفيق أمام وخلف الجسم.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ ثني الركبتين كاملًا ثم قذف الرجلين للانبطاح المائل 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا تحتاج الرشاقة إلى الاستعداد الوظيفي؟\nالإجابة: لأنها تتطلب تنسيقًا عصبيًا عضليًا دقيقًا.\nس3 (المستوى المتقدم): اذكر رياضة تحتاج الرشاقة.\nالإجابة: كرة القدم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريبات الرشاقة في بداية التدريب."}}, {"focus": "تطبيق متكامل لعناصر اللياقة في دائرة تدريبية", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي دائرة تدريبية تجمع القوة والسرعة والمرونة والرشاقة.\n2. يضبط الحمل والراحة.\n3. يقيم تأثير كل محطة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: سلم الرشاقة\n- أخرى: ساعة إيقاف", "المفاهيم": "- الدائرة التدريبية\n- الحمل\n- الراحة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الدائرة التدريبية (8 محطات).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: دائرة تدريبية 8 محطات 40 ثانية عمل و20 ثانية راحة، جولتان.\n- الطالب: يؤدي.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم المحطات.\n- الطالب: يقيّم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الدائرة التدريبية؟\nالإجابة: مجموعة محطات تؤدى بالتتابع بزمن عمل وراحة.\nس2 (المستوى المتوقع): كم زمن العمل والراحة؟\nالإجابة: 40 و20 ثانية.\nس3 (المستوى المتقدم): أي محطة للرشاقة؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): اقترح محطة للقوة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تزيد الحمل؟\nالإجابة: بزيادة زمن العمل أو الجولات.\nس3 (المستوى المتقدم): ما أصعب محطة ولماذا؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على دائرة تدريبية منزلية، وراجعا الجلد العضلي (دليل المعلم ص 22)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مفهوم القوة وأنواعها.\n2. يؤدي تدريبات القوة بالكرة الطبية (تقوس الجذع لتسليم الكرة، جلوس التوازن بالكرة، رسم دائرة بالكرة).\n3. يميز العضلات العاملة في كل تدريب.\n\nالحصة 2:\n1. يذكر مفهوم السرعة وأنواعها.\n2. يؤدي تدريبات السرعة (العدو 20-30 م من الوضع أمامًا، التمرير بإيقاع سريع، لمس القدمين بالتبادل).\n3. يربط كل تدريب بنوع السرعة.\n\nالحصة 3:\n1. يذكر مفهوم المرونة وارتباطها بالرياضات.\n2. يؤدي تدريبات المرونة مع مراعاة الزيادة التدريجية للحمل.\n3. يفسر أهمية خصوصية التدريب للنشاط.\n\nالحصة 4:\n1. يذكر مفهوم الرشاقة وشرط عدم التدريب عليها عند التعب.\n2. يؤدي تدريبات الرشاقة (المشي مع التصفيق أمام وخلف، ثني الركبتين وقذف الرجلين للانبطاح المائل).\n3. يفسر لماذا تحتاج الرشاقة إلى استعداد وظيفي.\n\nالحصة 5:\n1. يؤدي دائرة تدريبية تجمع القوة والسرعة والمرونة والرشاقة.\n2. يضبط الحمل والراحة.\n3. يقيم تأثير كل محطة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية\n- أخرى: مراتب\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: كرات\n- أخرى: ساعات إيقاف\n\nالحصة 3:\n- أخرى: مراتب\n- أخرى: عصي\n- أخرى: مقاعد سويدية\n\nالحصة 4:\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: سلم الرشاقة\n\nالحصة 5:\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: سلم الرشاقة\n- أخرى: ساعة إيقاف", "المفاهيم": "الحصة 1:\n- القوة العضلية\n- الكرة الطبية\n- العضلات العاملة\n\nالحصة 2:\n- سرعة الانتقال\n- سرعة الحركة\n- سرعة رد الفعل\n\nالحصة 3:\n- المرونة\n- المدى الحركي\n- الحمل\n- الخصوصية\n\nالحصة 4:\n- الرشاقة\n- الدقة\n- السرعة\n- الاستعداد الوظيفي\n\nالحصة 5:\n- الدائرة التدريبية\n- الحمل\n- الراحة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: لماذا نراجع عناصر اللياقة في الصف الثاني عشر؟ (ص 17).\n\nالحصة 2:\nيسأل المعلم: ما أنواع السرعة؟ (ص 19).\n\nالحصة 3:\nيسأل المعلم: أي المفاصل يحتاج متسابق الحواجز إلى مرونتها؟ (ص 20).\n\nالحصة 4:\nيسأل المعلم: متى لا ندرب الرشاقة؟ (ص 21).\n\nالحصة 5:\nيعرض المعلم الدائرة التدريبية (8 محطات).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج ص 18: تقوس الجذع خلفًا لتسليم الكرة والاستقبال من بين الرجلين، رمي الكرة عاليًا من يد لأخرى، جلوس التوازن بالكرة 5 ثوانٍ، رسم دائرة بالكرة بين القدمين.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات بالكرات الطبية.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحديد العضلات العاملة.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج التدريبات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: عدو 30 م، تمرير سريع في أزواج، رد الفعل بالإشارة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط التدريبات بالأنواع.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج تدريبات المرونة الثابتة والمتحركة للفخذ والكتف والجذع.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات إطالة بالتدرج.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش: لماذا نزيد الحمل تدريجيًا؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج التدريبات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الرشاقة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش شرط عدم التعب.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: دائرة تدريبية 8 محطات 40 ثانية عمل و20 ثانية راحة، جولتان.\n- الطالب: يؤدي.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم المحطات.\n- الطالب: يقيّم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (المستوى المتوقع): أي العضلات تعمل في جلوس التوازن بالكرة؟\nالإجابة: البطن.\nس3 (المستوى المتقدم): اذكر نوعين للقوة.\nالإجابة: القصوى والمميزة بالسرعة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما السرعة؟\nالإجابة: أداء حركة متكررة في أقصر زمن.\nس2 (المستوى المتوقع): ما سرعة رد الفعل؟\nالإجابة: الاستجابة للمثير في أقصر زمن.\nس3 (المستوى المتقدم): اذكر تدريبًا لسرعة الحركة.\nالإجابة: التمرير بإيقاع سريع.\n\nالحصة 3:\nس1 (مستوى الدعم): ما المرونة؟\nالإجابة: المدى الحركي لمفصل أو مجموعة مفاصل.\nس2 (المستوى المتوقع): أي المفاصل يهم رامي الرمح؟\nالإجابة: مفاصل الذراع والكتف.\nس3 (المستوى المتقدم): ما خصوصية التدريب؟\nالإجابة: تناسب التدريب مع النشاط الممارس.\n\nالحصة 4:\nس1 (مستوى الدعم): ما الرشاقة؟\nالإجابة: تغيير أوضاع الجسم في اتجاهات مختلفة بدقة وسرعة.\nس2 (المستوى المتوقع): متى لا ندرب الرشاقة؟\nالإجابة: عند التعب أو الإرهاق.\nس3 (المستوى المتقدم): اذكر تدريبًا.\nالإجابة: المشي مع التصفيق أمام وخلف الجسم.\n\nالحصة 5:\nس1 (مستوى الدعم): ما الدائرة التدريبية؟\nالإجابة: مجموعة محطات تؤدى بالتتابع بزمن عمل وراحة.\nس2 (المستوى المتوقع): كم زمن العمل والراحة؟\nالإجابة: 40 و20 ثانية.\nس3 (المستوى المتقدم): أي محطة للرشاقة؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ تمرينين بالكرة الطبية.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): لماذا ترتبط القوة بالجلد العضلي؟\nالإجابة: لأن الجلد العضلي يعتمد على قوة العضلات واستمرارها.\nس3 (المستوى المتقدم): اذكر تدريبًا زوجيًا بالكرة.\nالإجابة: تقوس الجذع لتسليم الكرة.\n\nالحصة 2:\nس1 (مستوى الدعم): صنف: العدو 30 م.\nالإجابة: سرعة انتقال.\nس2 (المستوى المتوقع): أدِّ 10 تمريرات سريعة مع زميلك.\nالإجابة: يؤديها.\nس3 (المستوى المتقدم): اقترح تدريبًا لرد الفعل.\nالإجابة: الانطلاق بإشارات مختلفة.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ إطالة لمفصل الفخذ.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): لماذا لا نبدأ بمدى حركي كامل فجأة؟\nالإجابة: لتجنب الإصابة.\nس3 (المستوى المتقدم): اذكر رياضة تحتاج مرونة الكتف.\nالإجابة: قذف القرص.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ ثني الركبتين كاملًا ثم قذف الرجلين للانبطاح المائل 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا تحتاج الرشاقة إلى الاستعداد الوظيفي؟\nالإجابة: لأنها تتطلب تنسيقًا عصبيًا عضليًا دقيقًا.\nس3 (المستوى المتقدم): اذكر رياضة تحتاج الرشاقة.\nالإجابة: كرة القدم.\n\nالحصة 5:\nس1 (مستوى الدعم): اقترح محطة للقوة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تزيد الحمل؟\nالإجابة: بزيادة زمن العمل أو الجولات.\nس3 (المستوى المتقدم): ما أصعب محطة ولماذا؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات القوة بكرة ثقيلة قليلًا.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على العدو القصير.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على الإطالة اليومية بتدرج.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تدريبات الرشاقة في بداية التدريب.\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على دائرة تدريبية منزلية، وراجعا الجلد العضلي (دليل المعلم ص 22)."}}, {"title": "الجلد العضلي (تحمل القوة)", "unit": "اللياقة البدنية", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 22-24، 28", "n": 5, "periods": [{"focus": "مفهوم الجلد العضلي وخصائص العضلة العاملة فيه", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم الجلد العضلي.\n2. يصف خصائص العضلة العاملة فيه (كثرة الشعيرات، استهلاك الأكسجين).\n3. يميز الجلد العضلي من القوة القصوى.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- الكتاب", "المفاهيم": "- الجلد العضلي\n- تحمل القوة\n- حمض اللاكتيك\n- الشعيرات الدموية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا يتعب بعض الطلبة بعد 10 تكرارات ويستمر آخرون؟ (ص 22).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والخصائص وعلاقته بالجهازين الدوري والتنفسي.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف عبارات صح/خطأ من نموذج الاختبار ص 28.\n- الطالب: يصنف ويعلل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب الطلبة تكرارات كثيرة بشدة أقل ويلاحظون.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما الجلد العضلي؟\nالإجابة: قدرة العضلات على أداء جهد متعاقب بشدة أقل من الحد الأقصى.\nس2 (المستوى المتوقع): هل تعمل عضلات الجلد في غياب الأكسجين؟\nالإجابة: لا، تحتاج إلى الأكسجين.\nس3 (المستوى المتقدم): هل شدة الجهد مرتفعة؟\nالإجابة: لا، أقل من الحد الأقصى.", "التقويم الختامي": "س1 (مستوى الدعم): نبض الفرد اللائق أقل من العادي، صح أم خطأ؟\nالإجابة: صح.\nس2 (المستوى المتوقع): ما الفرق بين الجلد العضلي والقوة القصوى؟\nالإجابة: الجلد تكرار بشدة متوسطة، والقصوى أقصى مقاومة لمرة.\nس3 (المستوى المتقدم): لماذا تحتاج عضلات الجلد إلى كفاءة القلب والرئتين؟\nالإجابة: للتخلص من الفضلات وإمداد الأكسجين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك مفهوم الجلد العضلي."}}, {"focus": "تدريبات الجلد العضلي (الوثب بالكرة، دفع الزميل، الوثب بالقدمين)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات الجلد العضلي بتكرارات عالية.\n2. يضبط الشدة أقل من الحد الأقصى.\n3. يحدد المجموعات العضلية العاملة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- التكرار\n- الشدة\n- المجموعات العضلية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المفهوم ويعرض التدريبات ص 23.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج: (إقعاء. مسك الكرة) الوثب لأعلى مع رفع الذراعين، (وقوف فتحًا) محاولة دفع الزميل للخلف، (وقوف. ثبات الوسط) الوث ", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تدريبين للجلد.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): ما تقييمك لأدائك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الفرق بين الجلد العضلي والجلد الدوري التنفسي؟\nالإجابة: الأول يعتمد على العضلات، والثاني على إمداد الخلايا بالأكسجين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك الجلد الدوري التنفسي (دليل المعلم ص 25)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر مفهوم الجلد العضلي.\n2. يصف خصائص العضلة العاملة فيه (كثرة الشعيرات، استهلاك الأكسجين).\n3. يميز الجلد العضلي من القوة القصوى.\n\nالحصة 2:\n1. يؤدي تدريبات الجلد العضلي بتكرارات عالية.\n2. يضبط الشدة أقل من الحد الأقصى.\n3. يحدد المجموعات العضلية العاملة.\n\nالحصة 3:\n1. يتعرف اختبارات الجلد العضلي.\n2. يطبق اختبار الجلوس من الرقود واختبار الشد على العقلة أو الدفع على المتوازي.\n3. يفسر نتيجته.\n\nالحصة 4:\n1. يؤدي دائرة تدريبية للجلد العضلي.\n2. يتابع نبضه قبل الدائرة وبعدها.\n3. يفسر علاقة النبض بكفاءة الجهازين.\n\nالحصة 5:\n1. يجيب عن اختبار قصير (صح/خطأ) في الجلد العضلي.\n2. يؤدي تدريبات الجلد بشكل صحيح.\n3. يقيم أداءه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- جهاز عرض البيانات\n- السبورة الذكية\n- الكتاب\n\nالحصة 2:\n- أخرى: كرات طبية\n- أخرى: مراتب\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: عقلة\n- أخرى: متوازي\n- أخرى: مراتب\n- أخرى: ساعات إيقاف\n- أخرى: استمارات\n\nالحصة 4:\n- أخرى: كرات طبية\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n\nالحصة 5:\n- أخرى: أوراق اختبار\n- أخرى: كرات طبية\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الجلد العضلي\n- تحمل القوة\n- حمض اللاكتيك\n- الشعيرات الدموية\n\nالحصة 2:\n- التكرار\n- الشدة\n- المجموعات العضلية\n\nالحصة 3:\n- اختبارات الجلد\n- العقلة\n- المتوازي\n- الديناموميتر\n\nالحصة 4:\n- الدائرة التدريبية\n- النبض\n- الكفاءة\n\nالحصة 5:\n- الاختبار القصير\n- الجلد العضلي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: لماذا يتعب بعض الطلبة بعد 10 تكرارات ويستمر آخرون؟ (ص 22).\n\nالحصة 2:\nيراجع المعلم المفهوم ويعرض التدريبات ص 23.\n\nالحصة 3:\nيسأل المعلم: لماذا لا نستخدم الديناموميتر في المدرسة؟ (ص 24).\n\nالحصة 4:\nيعرض المعلم الدائرة ويذكر بقياس النبض.\n\nالحصة 5:\nيوضح المعلم الاختبار (ص 28).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والخصائص وعلاقته بالجهازين الدوري والتنفسي.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تصنف عبارات صح/خطأ من نموذج الاختبار ص 28.\n- الطالب: يصنف ويعلل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب الطلبة تكرارات كثيرة بشدة أقل ويلاحظون.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج: (إقعاء. مسك الكرة) الوثب لأعلى مع رفع الذراعين، (وقوف فتحًا) محاولة دفع الزميل للخلف، (وقوف. ثبات الوسط) الوثب بالقدمين للأمام.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات بتكرارات 20-30 لكل تدريب.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحديد العضلات العاملة.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الاختبارات ونماذجها.\n- الطالب: يقلد.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات الاختبار بالتسجيل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تفسير النتائج.\n- الطالب: يفسر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: دائرة 6 محطات 45 ثانية عمل و15 راحة، جولتان، مع قياس النبض.\n- الطالب: يؤدي ويقيس.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تفسير النبض.\n- الطالب: يفسر.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار قصير كتابي.\n- الطالب: يجيب.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات الجلد في محطات.\n- الطالب: يؤدي.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مراجعة الإجابات.\n- الطالب: يصحح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الجلد العضلي؟\nالإجابة: قدرة العضلات على أداء جهد متعاقب بشدة أقل من الحد الأقصى.\nس2 (المستوى المتوقع): هل تعمل عضلات الجلد في غياب الأكسجين؟\nالإجابة: لا، تحتاج إلى الأكسجين.\nس3 (المستوى المتقدم): هل شدة الجهد مرتفعة؟\nالإجابة: لا، أقل من الحد الأقصى.\n\nالحصة 2:\nس1 (مستوى الدعم): كم تكرارًا في تدريبات الجلد؟\nالإجابة: عدد كبير نسبيًا (20-30).\nس2 (المستوى المتوقع): أي العضلات تعمل في دفع الزميل؟\nالإجابة: الرجلان والذراعان والجذع.\nس3 (المستوى المتقدم): كيف تكون الشدة؟\nالإجابة: أقل من الحد الأقصى.\n\nالحصة 3:\nس1 (مستوى الدعم): أي اختبار يعد للجلد العضلي؟\nالإجابة: أي اختبار فيه تكرار كبير نسبيًا.\nس2 (المستوى المتوقع): لماذا لا يستخدم الديناموميتر؟\nالإجابة: لتكلفته العالية.\nس3 (المستوى المتقدم): ماذا يقيس الشد على العقلة؟\nالإجابة: جلد عضلات الذراعين والمنكبين.\n\nالحصة 4:\nس1 (مستوى الدعم): لماذا يرتفع النبض؟\nالإجابة: لزيادة حاجة العضلات إلى الأكسجين.\nس2 (المستوى المتوقع): ماذا يدل سرعة عودة النبض؟\nالإجابة: على كفاءة الجهازين.\nس3 (المستوى المتقدم): كم محطة في الدائرة؟\nالإجابة: ست.\n\nالحصة 5:\nس1 (مستوى الدعم): تستهلك العضلة العاملة في الجلد أكسجينًا أكبر، صح أم خطأ؟\nالإجابة: صح.\nس2 (المستوى المتوقع): يتميز الجهد في الجلد بارتفاع شدته، صح أم خطأ؟\nالإجابة: خطأ.\nس3 (المستوى المتقدم): العضلة العاملة في الجلد كثيرة الشعيرات، صح أم خطأ؟\nالإجابة: صح.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): نبض الفرد اللائق أقل من العادي، صح أم خطأ؟\nالإجابة: صح.\nس2 (المستوى المتوقع): ما الفرق بين الجلد العضلي والقوة القصوى؟\nالإجابة: الجلد تكرار بشدة متوسطة، والقصوى أقصى مقاومة لمرة.\nس3 (المستوى المتقدم): لماذا تحتاج عضلات الجلد إلى كفاءة القلب والرئتين؟\nالإجابة: للتخلص من الفضلات وإمداد الأكسجين.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ 20 وثبة بالكرة الطبية.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): اقترح تدريبًا لجلد عضلات الذراعين.\nالإجابة: انبطاح مائل ثني الذراعين 20 مرة.\nس3 (المستوى المتقدم): ما علامة الشدة المناسبة؟\nالإجابة: القدرة على الاستمرار دون توقف.\n\nالحصة 3:\nس1 (مستوى الدعم): سجل نتائجك.\nالإجابة: يسجل.\nس2 (المستوى المتوقع): اقترح طريقة لتحسين الشد على العقلة.\nالإجابة: تدريب الشد بمساعدة ثم بدونها.\nس3 (المستوى المتقدم): أي العضلات أضعف لديك؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): ما نبضك قبل وبعد؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تزيد حمل الدائرة؟\nالإجابة: بزيادة الجولات أو التكرارات.\nس3 (المستوى المتقدم): أي محطة كانت الأصعب؟\nالإجابة: يذكر.\n\nالحصة 5:\nس1 (مستوى الدعم): أدِّ تدريبين للجلد.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): ما تقييمك لأدائك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الفرق بين الجلد العضلي والجلد الدوري التنفسي؟\nالإجابة: الأول يعتمد على العضلات، والثاني على إمداد الخلايا بالأكسجين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك مفهوم الجلد العضلي.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريبات التكرار بشدة متوسطة.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تمرينات الدفع والشد.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على دائرة أسبوعية.\n\nالحصة 5:\nإرشاد لولي الأمر: راجع مع طالبك الجلد الدوري التنفسي (دليل المعلم ص 25)."}}, {"title": "الجلد (التحمل) الدوري التنفسي", "unit": "اللياقة البدنية", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 25-28", "n": 5, "periods": [{"focus": "مفهوم الجلد الدوري التنفسي والفرق بينه وبين الجلد العضلي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر مفهوم الجلد الدوري التنفسي.\n2. يميز بينه وبين الجلد العضلي.\n3. يقدر أهميته في الأنشطة طويلة المدة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- جهاز عرض البيانات\n- السبورة الذكية\n- الكتاب", "المفاهيم": "- الجلد الدوري التنفسي\n- الأكسجين\n- فضلات التعب", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الذي يمكن عداء الماراثون من الاستمرار؟ (ص 25).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح المفهوم والفرق.\n- الطالب: يستمع.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: جية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الجلد الدوري التنفسي؟\nالإجابة: كفاءة الجهازين الدوري والتنفسي على إمداد العضلات بالوقود والأكسجين.\nس2 (المستوى المتوقع): على ماذا يعتمد الجلد العضلي؟\nالإجابة: قوة العضلات والتعاون مع الجهاز العصبي.\nس3 (المستوى المتقدم): اذكر نشاطًا يحتاجه.\nالإجابة: جري المسافات الطويلة.\n\nالحصة 2:\nس1 (مستوى الدعم): كم طول فترة الأداء؟\nالإجابة: 5-10 دقائق فأكثر.\nس2 (المستوى المتوقع): كيف تكون الشدة؟\nالإجابة: غير مرتفعة نسبيًا.\nس3 (المستوى المتقدم): لماذا نشرك مجموعات عضلية كبيرة؟\nالإجابة: لرفع حاجة الجسم للأكسجين.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر اختبارًا مباشرًا.\nالإجابة: اختبار الخطوة لهارفرد أو قياس النبض.\nس2 (المستوى المتوقع): ما القياس غير المباشر؟\nالإجابة: الجري لمسافات متوسطة أو طويلة.\nس3 (المستوى المتقدم): أيهما أكثر شيوعًا؟\nالإجابة: غير المباشر.\n\nالحصة 4:\nس1 (مستوى الدعم): ما الفارتلك؟\nالإجابة: جري بتبادل السرعات.\nس2 (المستوى المتوقع): كم مرة أسبوعيًا؟\nالإجابة: 3 مرات على الأقل.\nس3 (المستوى المتقدم): ما ميزة الفارتلك؟\nالإجابة: التنويع وكسر الملل.\n\nالحصة 5:\nس1 (مستوى الدعم): ما الجلد الدوري التنفسي؟\nالإجابة: كفاءة الجهازين في إمداد العضلات بالأكسجين.\nس2 (المستوى المتوقع): اذكر اعتبارًا لتنميته.\nالإجابة: الاستمرارية.\nس3 (المستوى المتقدم): ما نتيجتك مقارنة بالأولية؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): قارن بين الجلدين في نقطتين.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا يعد مكونًا رئيسيًا في السباحة الطويلة؟\nالإجابة: لاستمرار العمل فترات طويلة.\nس3 (المستوى المتقدم): ما دور سرعة التخلص من فضلات التعب؟\nالإجابة: تأخير الإجهاد.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر أربعة اعتبارات.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): لماذا تبدأ تدريباته متأخرة؟\nالإجابة: بعد تنمية القوة والسرعة.\nس3 (المستوى المتقدم): اقترح نشاطًا متنوعًا للجلد.\nالإجابة: مشي سريع ودراجة وسباحة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما نتيجتك في الاختبار؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تحسنها؟\nالإجابة: بتدريب مستمر منتظم.\nس3 (المستوى المتقدم): ما السعة الحيوية؟\nالإجابة: أقصى كمية هواء تخرج بعد أعمق شهيق.\n\nالحصة 4:\nس1 (مستوى الدعم): اعرض برنامجك الأسبوعي.\nالإجابة: يعرض.\nس2 (المستوى المتوقع): لماذا يناسب برنامجك مستواك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تتدرج في البرنامج؟\nالإجابة: بزيادة المدة تدريجيًا.\n\nالحصة 5:\nس1 (مستوى الدعم): أي العناصر تحسن؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما خطتك القادمة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): اذكر اختبارًا غير مباشر.\nالإجابة: جري 12 دقيقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك الفرق بين الجلدين.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على نشاط مستمر 20 دقيقة.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على اختبار الجري أسبوعيًا.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تنفيذ برنامجه.\n\nالحصة 5:\nإرشاد لولي الأمر: راجع مع طالبك مراحل دفع الجلة (دليل المعلم ص 32)."}}, {"title": "دفع الجلة بطريقة الزحف", "unit": "مسابقات الميدان", "week": "الخامس – السادس", "date": "4-8/10/2026 إلى 11-15/10/2026", "pages": "دليل المعلم ص 32-37", "n": 10, "periods": [{"focus": "خصائص دفع الجلة والمراحل الفنية ومسك وحمل الجلة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف خصائص دفع الجلة (قصر مسار السرعة، القوة الانفجارية) ومراحله الخمس.\n2. يؤدي مسك الجلة (على قاعدة سلاميات الأصابع) وحملها بكرة طبية ثم جلة بديلة.\n3. يميز الدفع من الرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة\n- أخرى: كرات طبية\n- أخرى: جلة بديلة\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- دفع الجلة\n- القوة الانفجارية\n- المسك\n- الحمل", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا تدفع الجلة ولا ترمى؟ (ص 32).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص للكتف والرسغ.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الخصائص  مع دوران المشط.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: زحف على خط، زحف إلى علامة المنتصف، زحف بالكرة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحليل أخطاء.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف يكون الزحف؟\nالإجابة: منخفضًا وسريعًا.\nس2 (المستوى المتوقع): أين تصل رجل الارتكاز؟\nالإجابة: منتصف الدائرة تقريبًا.\nس3 (المستوى المتقدم): ماذا يحدث للمشط؟\nالإجابة: يدور للداخل مع ثني الركبة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الزحف دون أداة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما خطأ ارتفاع الجسم أثناء الزحف؟\nالإجابة: يفقد السرعة والتوازن.\nس3 (المستوى المتقدم): أين توزع الثقل في نهاية الزحف؟\nالإجابة: على رجل الارتكاز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الزحف على خط مرسوم."}}, {"focus": "مرحلة الدفع والتخلص", "num": 4, "fields": {"المخرجات التعليمية": "1. يصف مرحلة الدفع والتخلص (نقل السرعة من الجسم إلى الجلة).\n2. يؤدي الدفع والتخلص من الثبات ثم بعد الزحف بالكرة الطبية.\n3. يرتب تسلسل القوى من الرجلين إلى الذراع.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: جلة بديلة\n- أخرى: دائرة دفع\n- أخرى: شريط قياس", "المفاهيم": "- الدفع\n- التخلص\n- نقل السرعة\n- مد الذراع", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من أين تبدأ قوة الدفع؟ (ص 34).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الدفع: مد الركبة ولف الحوض والجذع ومد الذراع وخروج الجلة من الذقن.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: دفع الكرة الطبية من الثبات ثم بعد الزحف، 5 محاولات.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ترتيب تسلسل القوى.\n- الطالب: يرتب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما هدف مرحلة الدفع؟\nالإجابة: نقل السرعة من الجسم إلى الجلة.\nس2 (المستوى المتوقع): ما تسلسل القوى؟\nالإجابة: الرجلان ثم الحوض ثم الجذع ثم الذراع.\nس3 (المستوى المتقدم): من أين تخرج الجلة؟\nالإجابة: من منطقة الذقن بالكامل.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الدفع والتخلص بعد الزحف.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما خطأ الدفع بالذراع فقط؟\nالإجابة: فقد قوة الرجلين والجذع.\nس3 (المستوى المتقدم): لماذا نرفع الذراع بزاوية عند التخلص؟\nالإجابة: لتحقيق زاوية انطلاق مناسبة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على دفع كرة ثقيلة قليلًا بتسلسل القوى."}}, {"focus": "مرحلة الاتزان والأداء الكلي من مقطع الدفع", "num": 5, "fields": {"المخرجات التعليمية": "1. يصف مرحلة الاتزان (تبديل الرجلين، خفض الجذع، الخروج من الخلف).\n2. يؤدي دفع الجلة كليًا بالجلة البديلة ثم القانونية.\n3. يطبق قواعد الأمن والسلامة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة\n- أخرى: جلة بديلة\n- أخرى: دائرة دفع\n- أخرى: شريط قياس", "المفاهيم": "- الاتزان\n- تبديل الرجلين\n- الأداء الكلي\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف لا يخرج الدافع من الدائرة بعد التخلص؟ (ص 35، 40).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الاتزان والأداء الكلي وقواعد الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أداء كلي بالجلة البديلة ثم القانونية، 3 محاولات بالإشارة.\n- الطالب: يؤدي.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش الأمان.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كيف يحفظ الدافع توازنه؟\nالإجابة: بتبديل الرجلين وثني الركبة وخفض الجذع.\nس2 (المستوى المتوقع): من أين يخرج من الدائرة؟\nالإجابة: من الجزء الخلفي.\nس3 (المستوى المتقدم): اذكر قاعدة أمان.\nالإجابة: عدم الدفع إلا بالإذن.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ دفع الجلة كليًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ماذا يفعل الطلبة غير المشاركين؟\nالإجابة: يقفون في منطقة آمنة.\nس3 (المستوى المتقدم): كيف نحمل الجلة أثناء الانتقال؟\nالإجابة: بالطريقة الصحيحة دون رمي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طالبك قواعد الأمان."}}, {"focus": "الإعداد البدني الخاص لدفع الجلة (القوة والسرعة والرشاقة والمرونة)", "num": 6, "fields": {"المخرجات التعليمية": "1. يحدد الصفات البدنية لدفع الجلة.\n2. يؤدي تدريبات إعداد بدني خاص (دفع كرة طبية بقطارات متقابلة، وثب، لف جذع).\n3. يربط كل صفة بمرحلة من مراحل الدفع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: مراتب", "المفاهيم": "- الإعداد البدني\n- القوة المميزة بالسرعة\n- جلد القوة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: أي الصفات أهم في مسافة الدفع؟ (ص 36-37).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الصفات ونماذج التدريبات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: قطارات متقابلة تتبادل دفع الكرة الطبية، ومحطات قوة ومرونة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط الصفات بالمراحل.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر الصفات البدنية لدفع الجلة.\nالإجابة: القوة بأنواعها والسرعة والرشاقة والمرونة.\nس2 (المستوى المتوقع): أي صفة تؤثر في سرعة انطلاق الجلة؟\nالإجابة: السرعة.\nس3 (المستوى المتقدم): ما جلد القوة؟\nالإجابة: تحمل أداء القوة لتكرارات.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تبادل دفع الكرة في القطارات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أي صفة تحتاجها مرحلة الزحف؟\nالإجابة: الرشاقة والسرعة.\nس3 (المستوى المتقدم): أي صفة لمرحلة الدفع؟\nالإجابة: القوة المميزة بالسرعة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات القوة والمرونة."}}, {"focus": "التدرج في تعليم الدفع: من الثبات إلى الزحف الكامل", "num": 7, "fields": {"المخرجات التعليمية": "1. يؤدي الدفع من الثبات ثم من نصف زحف ثم زحف كامل.\n2. يصحح أداء زميله بالنقاط الفنية.\n3. يحسن مسافته تدريجيًا.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة\n- أخرى: كرات طبية\n- أخرى: دائرة دفع\n- أخرى: شريط قياس\n- أخرى: بطاقات تقييم", "المفاهيم": "- التدرج\n- التقييم بالأقران\n- المسافة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم التدرج الثلاثي وبطاقة التقييم.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التدرج.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يدفع أحدهما بالتدرج ويقيّم الآخر بالبطاقة ثم التبادل.\n- الطالب: يؤدي ويقيّم.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش نقاط التحسين.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما مراحل التدرج؟\nالإجابة: من الثبات ثم نصف زحف ثم زحف كامل.\nس2 (المستوى المتوقع): ما بنود بطاقة التقييم؟\nالإجابة: المسك، الاستعداد، الزحف، الدفع، الاتزان.\nس3 (المستوى المتقدم): لماذا نبدأ من الثبات؟\nالإجابة: لإتقان الدفع قبل إضافة السرعة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الدفع بالتدرج الثلاثي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما نقطة التحسين لزميلك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما مسافتك الأفضل؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرج في التدريب."}}, {"focus": "تصحيح الأخطاء الشائعة في دفع الجلة", "num": 8, "fields": {"المخرجات التعليمية": "1. يحدد الأخطاء الشائعة (رفع الجسم في الزحف، الرمي بدل الدفع، فقد الاتزان، خروج الجلة من الجانب).\n2. يطبق تدريبات تصحيحية.\n3. يقيم أداءه بعد التصحيح.", "المستوى المعرفي": "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة\n- أخرى: كرات طبية\n- أخرى: دائرة دفع\n- أخرى: شريط لاصق", "المفاهيم": "- الأخطاء الشائعة\n- التصحيح\n- التغذية الراجعة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم أخطاء مصورة ويسأل: ما الخطأ وما تصحيحه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض الأخطاء والتدريبات التصحيحية.\n- الطالب: يشاهد.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل طالب يحدد خطأه الرئيسي ويؤدي التدريب التصحيحي المناسب بمراقبة زميل.\n- الطالب: يؤدي.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم بعد التصحيح.\n- الطالب: يقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما تصحيح رفع الجسم أثناء الزحف؟\nالإجابة: الزحف على خط منخفض مع ح بة: من النصف الخلفي.\nس3 (المستوى المتقدم): ما قرار لمس أعلى إطار الدائرة؟\nالإجابة: محاولة فاشلة.", "التقويم الختامي": "س1 (مستوى الدعم): قس محاولة زميلك.\nالإجابة: يقيس.\nس2 (المستوى المتوقع): دافع خرج من النصف الأمامي، ما القرار؟\nالإجابة: فاشلة.\nس3 (المستوى المتقدم): اذكر ثلاث قواعد.\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طالبك قواعد دفع الجلة."}}, {"focus": "منافسة دفع الجلة بين المجموعات وتقويم الأداء", "num": 10, "fields": {"المخرجات التعليمية": "1. يؤدي دفع الجلة في منافسة بالقواعد.\n2. يشارك في التحكيم والقياس والتسجيل.\n3. يقيم أداءه ويحدد هدفًا للمسافة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: جلة\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: استمارات", "المفاهيم": "- المنافسة\n- الترتيب\n- الهدف", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم المنافسة والأدوار.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة 3 محاولات لكل طالب بالأدوار والترتيب.\n- الطالب: يتسابق ويحكم.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحديد هدف.\n- الطالب: يحدد.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "س1 (مستوى الدعم): كم محاولة؟\nالإجابة: ثلاث.\nس2 (المستوى المتوقع): كيف يرتب المتسابقون؟\nالإجابة: بأفضل محاولة صحيحة.\nس3 (المستوى المتقدم): ما مسافتك؟\nالإجابة: يذكر.", "التقويم الختامي": "س1 (مستوى الدعم): ما هدفك للمسافة بعد أسبوعين؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما دورك في المنافسة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحتاج إليه أداؤك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على تدريبات دفع الجلة (دليل المعلم ص 37-40)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف خصائص دفع الجلة (قصر مسار السرعة، القوة الانفجارية) ومراحله الخمس.\n2. يؤدي مسك الجلة (على قاعدة سلاميات الأصابع) وحملها بكرة طبية ثم جلة بديلة.\n3. يميز الدفع من الرمي.\n\nالحصة 2:\n1. يصف وقفة الاستعداد والتحفز.\n2. يؤدي التحفز بطرقه (مع أرجحة الرجل الحرة عاليًا، متوسطة، بدون).\n3. يختار الطريقة المناسبة للمبتدئ.\n\nالحصة 3:\n1. يصف مرحلة الزحف (الدفع المنخفض السريع بقدم الارتكاز ولف الرجل والحوض).\n2. يؤدي الزحف دون أداة ثم بالكرة الطبية.\n3. يحلل أخطاء الزحف (الارتفاع، التوقف).\n\nالحصة 4:\n1. يصف مرحلة الدفع والتخلص (نقل السرعة من الجسم إلى الجلة).\n2. يؤدي الدفع والتخلص من الثبات ثم بعد الزحف بالكرة الطبية.\n3. يرتب تسلسل القوى من الرجلين إلى الذراع.\n\nالحصة 5:\n1. يصف مرحلة الاتزان (تبديل الرجلين، خفض الجذع، الخروج من الخلف).\n2. يؤدي دفع الجلة كليًا بالجلة البديلة ثم القانونية.\n3. يطبق قواعد الأمن والسلامة.\n\nالحصة 6:\n1. يحدد الصفات البدنية لدفع الجلة.\n2. يؤدي تدريبات إعداد بدني خاص (دفع كرة طبية بقطارات متقابلة، وثب، لف جذع).\n3. يربط كل صفة بمرحلة من مراحل الدفع.\n\nالحصة 7:\n1. يؤدي الدفع من الثبات ثم من نصف زحف ثم زحف كامل.\n2. يصحح أداء زميله بالنقاط الفنية.\n3. يحسن مسافته تدريجيًا.\n\nالحصة 8:\n1. يحدد الأخطاء الشائعة (رفع الجسم في الزحف، الرمي بدل الدفع، فقد الاتزان، خروج الجلة من الجانب).\n2. يطبق تدريبات تصحيحية.\n3. يقيم أداءه بعد التصحيح.\n\nالحصة 9:\n1. يذكر القواعد القانونية (الدفع بيد واحدة، عدم الخروج، سقوط الجلة في المقطع، الخروج من الخلف).\n2. يقيس المسافة من مكان السقوط إلى الحد الداخلي للدائرة.\n3. يقرر في حالات تحكيمية.\n\nالحصة 10:\n1. يؤدي دفع الجلة في منافسة بالقواعد.\n2. يشارك في التحكيم والقياس والتسجيل.\n3. يقيم أداءه ويحدد هدفًا للمسافة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 6: لحصة 3:\n- الزحف\n- قدم الارتكاز\n- لف الحوض\n- المنتصف\n\nالحصة 4:\n- الدفع\n- التخلص\n- نقل السرعة\n- مد الذراع\n\nالحصة 5:\n- الاتزان\n- تبديل الرجلين\n- الأداء الكلي\n- الأمان\n\nالحصة 6:\n- الإعداد البدني\n- القوة المميزة بالسرعة\n- جلد القوة\n\nالحصة 7:\n- التدرج\n- التقييم بالأقران\n- المسافة\n\nالحصة 8:\n- الأخطاء الشائعة\n- التصحيح\n- التغذية الراجعة\n\nالحصة 9:\n- القواعد القانونية\n- القياس\n- المحاولة الفاشلة\n\nالحصة 10:\n- المنافسة\n- الترتيب\n- الهدف", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: لماذا تدفع الجلة ولا ترمى؟ (ص 32).\n\nالحصة 2:\nيسأل المعلم: لماذا يسمى التكور؟ (ص 33).\n\nالحصة 3:\nيسأل المعلم: كيف ينتقل الجسم إلى منتصف الدائرة بسرعة؟ (ص 34).\n\nالحصة 4:\nيسأل المعلم: من أين تبدأ قوة الدفع؟ (ص 34).\n\nالحصة 5:\nيسأل المعلم: كيف لا يخرج الدافع من الدائرة بعد التخلص؟ (ص 35، 40).\n\nالحصة 6:\nيسأل المعلم: أي الصفات أهم في مسافة الدفع؟ (ص 36-37).\n\nالحصة 7:\nيعرض المعلم التدرج الثلاثي وبطاقة التقييم.\n\nالحصة 8:\nيعرض المعلم أخطاء مصورة ويسأل: ما الخطأ وما تصحيحه؟\n\nالحصة 9:\nيسأل المعلم: متى تحتسب المحاولة فاشلة؟\n\nالحصة 10:\nيعلن المعلم المنافسة والأدوار.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص للكتف والرسغ.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الخصائص والمراحل ونموذج المسك والحمل بالكرة الطبية.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات المسك والحمل: ترك الكرة والتقاطها، التمرير من يد لأخرى، دوائر حول الجسم (ص 39).\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: مقارنة الدفع بالرمي.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الوقفة (الظهر للمقطع، القدم المماثلة خلف الحافة) والتحفز بالطرق الثلاث.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: تكرار الوقفة والتحفز دون أداة ثم بالكرة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: أي الطرق أسهل للمبتدئ؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الزحف المنخفض ولف الرجل اليمنى والحوض ووصول القدم للمنتصف مع دوران المشط.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: زحف على خط، زحف إلى علامة المنتصف، زحف بالكرة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحليل أخطاء.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الدفع: مد الركبة ولف الحوض والجذع ومد الذراع وخروج الجلة من الذقن.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: دفع الكرة الطبية من الثبات ثم بعد الزحف، 5 محاولات.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ترتيب تسلسل القوى.\n- الطالب: يرتب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج الاتزان والأداء الكلي وقواعد الأمان.\n- الطالب: يقلد.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أداء كلي بالجلة البديلة ثم القانونية، 3 محاولات بالإشارة.\n- الطالب: يؤدي.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش الأمان.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 6:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الصفات ونماذج التدريبات.\n- الطالب: يقلد.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: قطارات متقابلة تتبادل دفع الكرة الطبية، ومحطات قوة ومرونة.\n- الطالب: يؤدي.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: ربط الصفات بالمراحل.\n- الطالب: يربط.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 7:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التدرج.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يدفع أحدهما بالتدرج ويقيّم الآخر بالبطاقة ثم التبادل.\n- الطالب: يؤدي ويقيّم.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش نقاط التحسين.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 8:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: عرض الأخطاء والتدريبات التصحيحية.\n- الطالب: يشاهد.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: كل طالب يحدد خطأه الرئيسي ويؤدي التدريب التصحيحي المناسب بمراقبة زميل.\n- الطالب: يؤدي.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تقييم بعد التصحيح.\n- الطالب: يقيّم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 9:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح القواعد والقياس.\n- الطالب: يستمع.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بأدوار (حكم، قائس، مسجل) تدفع وتقيس وتقرر.\n- الطالب: يؤدي ويحكم.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: حالات تحكيمية.\n- الطالب: يقرر.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 10:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة 3 محاولات لكل طالب بالأدوار والترتيب.\n- الطالب: يتسابق ويحكم.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحديد هدف.\n- الطالب: يحدد.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر مراحل دفع الجلة.\nالإجابة: المسك والحمل، الاستعداد والتحفز، الزحف والدوران، الدفع والتخلص، الاتزان.\nس2 (المستوى المتوقع): أين تستند الجلة في المسك؟\nالإجابة: على قاعدة سلاميات الأصابع.\nس3 (المستوى المتقدم): لماذا تعتمد على القوة؟\nالإجابة: لقصر مسار السرعة وضرورة الدفعة الانفجارية.\n\nالحصة 2:\nس1 (مستوى الدعم): أين يقف الدافع في الاستعداد؟\nالإجابة: عند الحافة الخلفية وظهره للمقطع.\nس2 (المستوى المتوقع): اذكر طرق التحفز.\nالإجابة: مع أرجحة عالية، متوسطة، بدون أرجحة.\nس3 (المستوى المتقدم): ما حالة العضلات في الاستعداد؟\nالإجابة: مسترخية.\n\nالحصة 3:\nس1 (مستوى الدعم): كيف يكون الزحف؟\nالإجابة: منخفضًا وسريعًا.\nس2 (المستوى المتوقع): أين تصل رجل الارتكاز؟\nالإجابة: منتصف الدائرة تقريبًا.\nس3 (المستوى المتقدم): ماذا يحدث للمشط؟\nالإجابة: يدور للداخل مع ثني الركبة.\n\nالحصة 4:\nس1 (مستوى الدعم): ما هدف مرحلة الدفع؟\nالإجابة: نقل السرعة من الجسم إلى الجلة.\nس2 (المستوى المتوقع): ما تسلسل القوى؟\nالإجابة: الرجلان ثم الحوض ثم الجذع ثم الذراع.\nس3 (المستوى المتقدم): من أين تخرج الجلة؟\nالإجابة: من منطقة الذقن بالكامل.\n\nالحصة 5:\nس1 (مستوى الدعم): كيف يحفظ الدافع توازنه؟\nالإجابة: بتبديل الرجلين وثني الركبة وخفض الجذع.\nس2 (المستوى المتوقع): من أين يخرج من الدائرة؟\nالإجابة: من الجزء الخلفي.\nس3 (المستوى المتقدم): اذكر قاعدة أمان.\nالإجابة: عدم الدفع إلا بالإذن.\n\nالحصة 6:\nس1 (مستوى الدعم): اذكر الصفات البدنية لدفع الجلة.\nالإجابة: القوة بأنواعها والسرعة والرشاقة والمرونة.\nس2 (المستوى المتوقع): أي صفة تؤثر في سرعة انطلاق الجلة؟\nالإجابة: السرعة.\nس3 (المستوى المتقدم): ما جلد القوة؟\nالإجابة: تحمل أداء القوة لتكرارات.\n\nالحصة 7:\nس1 (مستوى الدعم): ما مراحل التدرج؟\nالإجابة: من الثبات ثم نصف زحف ثم زحف كامل.\nس2 (المستوى المتوقع): ما بنود بطاقة التقييم؟\nالإجابة: المسك، الاستعداد، الزحف، الدفع، الاتزان.\nس3 (المستوى المتقدم): لماذا نبدأ من الثبات؟\nالإجابة: لإتقان الدفع قبل إضافة السرعة.\n\nالحصة 8:\nس1 (مستوى الدعم): ما تصحيح رفع الجسم أثناء الزحف؟\nالإجابة: الزحف على خط منخفض مع حاجز فوق الرأس.\nس2 (المستوى المتوقع): ما تصحيح الرمي بدل الدفع؟\nالإجابة: الدفع من الثبات مع الجلة ملاصقة للذقن.\nس3 (المستوى المتقدم): ما تصحيح فقد الاتزان؟\nالإجابة: تبديل الرجلين وخفض الجذع.\n\nالحصة 9:\nس1 (مستوى الدعم): من أين تقاس المسافة؟\nالإجابة: من مكان السقوط إلى الحد الداخلي للدائرة.\nس2 (المستوى المتوقع): من أي جزء يخرج الدافع؟\nالإجابة: من النصف الخلفي.\nس3 (المستوى المتقدم): ما قرار لمس أعلى إطار الدائرة؟\nالإجابة: محاولة فاشلة.\n\nالحصة 10:\nس1 (مستوى الدعم): كم محاولة؟\nالإجابة: ثلاث.\nس2 (المستوى المتوقع): كيف يرتب المتسابقون؟\nالإجابة: بأفضل محاولة صحيحة.\nس3 (المستوى المتقدم): ما مسافتك؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ المسك والحمل بالكرة الطبية.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع دون مرجحة.\nس3 (المستوى المتقدم): ما التدرج في الأداة؟\nالإجابة: كرة طبية ثم جلة بديلة ثم قانونية.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الاستعداد والتحفز.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أي طريقة تنصح بها للمبتدئ؟\nالإجابة: بدون أرجحة أو متوسطة.\nس3 (المستوى المتقدم): لماذا تكون القدم الأخرى قرب خط المنتصف؟\nالإجابة: لتهيئة الزحف.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الزحف دون أداة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما خطأ ارتفاع الجسم أثناء الزحف؟\nالإجابة: يفقد السرعة والتوازن.\nس3 (المستوى المتقدم): أين توزع الثقل في نهاية الزحف؟\nالإجابة: على رجل الارتكاز.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ الدفع والتخلص بعد الزحف.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما خطأ الدفع بالذراع فقط؟\nالإجابة: فقد قوة الرجلين والجذع.\nس3 (المستوى المتقدم): لماذا نرفع الذراع بزاوية عند التخلص؟\nالإجابة: لتحقيق زاوية انطلاق مناسبة.\n\nالحصة 5:\nس1 (مستوى الدعم): أدِّ دفع الجلة كليًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ماذا يفعل الطلبة غير المشاركين؟\nالإجابة: يقفون في منطقة آمنة.\nس3 (المستوى المتقدم): كيف نحمل الجلة أثناء الانتقال؟\nالإجابة: بالطريقة الصحيحة دون رمي.\n\nالحصة 6:\nس1 (مستوى الدعم): أدِّ تبادل دفع الكرة في القطارات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أي صفة تحتاجها مرحلة الزحف؟\nالإجابة: الرشاقة والسرعة.\nس3 (المستوى المتقدم): أي صفة لمرحلة الدفع؟\nالإجابة: القوة المميزة بالسرعة.\n\nالحصة 7:\nس1 (مستوى الدعم): أدِّ الدفع بالتدرج الثلاثي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما نقطة التحسين لزميلك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما مسافتك الأفضل؟\nالإجابة: يذكر.\n\nالحصة 8:\nس1 (مستوى الدعم): ما خطؤك الرئيسي وتدريبه التصحيحي؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تحسن أداؤك بعد التصحيح؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تعطي زميلك تغذية راجعة بناءة؟\nالإجابة: بذكر نقطة قوة ثم نقطة تحسين.\n\nالحصة 9:\nس1 (مستوى الدعم): قس محاولة زميلك.\nالإجابة: يقيس.\nس2 (المستوى المتوقع): دافع خرج من النصف الأمامي، ما القرار؟\nالإجابة: فاشلة.\nس3 (المستوى المتقدم): اذكر ثلاث قواعد.\nالإجابة: يذكر.\n\nالحصة 10:\nس1 (مستوى الدعم): ما هدفك للمسافة بعد أسبوعين؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما دورك في المنافسة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي يحتاج إليه أداؤك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في دفع الجلة (دليل المعلم ص 40).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريب الوقفة أمام المرآة.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تدريب الزحف على خط مرسوم.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على دفع كرة ثقيلة قليلًا بتسلسل القوى.\n\nالحصة 5:\nإرشاد لولي الأمر: راجع مع طالبك قواعد الأمان.\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على تمرينات القوة والمرونة.\n\nالحصة 7:\nإرشاد لولي الأمر: شجع طالبك على التدرج في التدريب.\n\nالحصة 8:\nإرشاد لولي الأمر: شجع طالبك على التدريب التصحيحي.\n\nالحصة 9:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد دفع الجلة.\n\nالحصة 10:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على تدريبات دفع الجلة (دليل المعلم ص 37-40)."}}, {"title": "تدريبات دفع الجلة", "unit": "مسابقات الميدان", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 37-40", "n": 5, "periods": [{"focus": "تدريبات المسك والحمل والإحساس بالجلة (الترك والالتقاط، التمرير بين اليدين، الدوائر)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي تدريبات الإحساس بالجلة بالكرة الطبية والجلة.\n2. يميز دور الرسغ والأصابع في الدفع.\n3. يحسن مسك الجلة وحملها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: جلة\n- أخرى: مراتب", "المفاهيم": "- الإحساس بالأداة\n- الرسغ\n- الأصابع", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: لماذا تهم عضلات الرسغ والأصابع في الدفع؟ (ص 39).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نماذج: ترك الكرة والتقاطه n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: نموذج التنظيم والأداء الكلي.\n- الطالب: يشاهد.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: قطاران متقابلان يتبادلان الدفع ثم أداء كلي بالجلة من الدائرة.\n- الطالب: يؤدي.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش الإيقاع.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح الإعداد التنافسي.\n- الطالب: يستمع.\n\nالنشاط 3 (18 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: 6 محاولات بشدة عالية مع راحة دقيقتين وتسجيل.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 4 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: تحليل التقدم.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء عام وخاص بنموذج المعلم.\n- الطالب: يقلد.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج تقييم متبادل بالبطاقة مع 3 محاولات وتصحيح.\n- الطالب: يؤدي ويقيّم.\n\nالنشاط 3 (3 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نقاش الاستعداد للمسابقة.\n- الطالب: يستنتج.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة وتلخيص.\n- الطالب: يؤدي التهدئة ويلخص.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما دور الرسغ في التخلص؟\nالإجابة: إعطاء الجلة دفعة أخيرة.\nس2 (المستوى المتوقع): اذكر تدريبًا للإحساس.\nالإجابة: دوائر حول الجسم بالجلة.\nس3 (المستوى المتقدم): لماذا نبدأ بالكرة الطبية؟\nالإجابة: للأمان والإحساس.\n\nالحصة 2:\nس1 (مستوى الدعم): ما هدف الدفع فوق العارضة؟\nالإجابة: ضبط زاوية الانطلاق.\nس2 (المستوى المتوقع): من أي وضع؟\nالإجابة: ثني الركبتين نصفًا.\nس3 (المستوى المتقدم): ما الزاوية المناسبة تقريبًا؟\nالإجابة: نحو 40 درجة.\n\nالحصة 3:\nس1 (مستوى الدعم): ماذا يفعل الطالب بعد الدفع في القطار؟\nالإجابة: يجري ليقف خلف القطار المقابل.\nس2 (المستوى المتوقع): ما الفرق بين الأداء الجزئي والكلي؟\nالإجابة: الكلي يجمع المراحل بإيقاع واحد.\nس3 (المستوى المتقدم): ما قاعدة الأمان في القطارات؟\nالإجابة: الدفع بالتبادل والانتباه للكرة القادمة.\n\nالحصة 4:\nس1 (مستوى الدعم): ما الإعداد التنافسي؟\nالإجابة: تدريب يحاكي ظروف المسابقة.\nس2 (المستوى المتوقع): لماذا الراحة الكافية؟\nالإجابة: لاستعادة القوة الانفجارية.\nس3 (المستوى المتقدم): كم محاولة أديت؟\nالإجابة: ست.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر النقاط الفنية الخمس.\nالإجابة: المسك، الاستعداد، الزحف، الدفع، الاتزان.\nس2 (المستوى المتوقع): ما تقييمك لزحفك؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما الذي صححته؟\nالإجابة: يذكر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ ثلاثة تدريبات إحساس.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): كيف يتحسن المسك بالتدريب؟\nالإجابة: بتثبيت الجلة على قاعدة السلاميات.\nس3 (المستوى المتقدم): ما أثر الأصابع في زاوية الانطلاق؟\nالإجابة: توجيه الجلة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الدفع فوق العارضة 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ماذا يحدث لو كانت الزاوية منخفضة جدًا؟\nالإجابة: تقل المسافة.\nس3 (المستوى المتقدم): ما العضلات العاملة؟\nالإجابة: الرجلان والجذع والذراع.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ المهارة ككل من المقطع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما أثر الإيقاع في المسافة؟\nالإجابة: يحقق انسيابية نقل السرعة.\nس3 (المستوى المتقدم): ما مسافتك؟\nالإجابة: يذكر.\n\nالحصة 4:\nس1 (مستوى الدعم): ما أفضل مسافة اليوم؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): كيف تحسنت عن الأسبوع الماضي؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): ما أثر التعب في المسافة؟\nالإجابة: يقللها.\n\nالحصة 5:\nس1 (مستوى الدعم): ما أفضل مرحلة لديك؟\nالإجابة: يذكر.\nس2 (المستوى المتوقع): ما خطتك قبل المسابقة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تقيّم زميلك بموضوعية؟\nالإجابة: بالبطاقة لا بالانطباع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريبات الإحساس بكرة ثقيلة.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على الدفع فوق حبل في المنزل بكرة خفيفة.\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على تدريبات الدفع بالتبادل مع صديق.\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تسجيل مسافاته.\n\nالحصة 5:\nإرشاد لولي الأمر: راجع مع طالبك لجان تنظيم المسابقات (دليل المعلم ص 41-43)."}}, {"title": "تنظيم وإدارة مسابقة دفع الجلة والاختبار العملي (1)", "unit": "مسابقات الميدان", "week": "الثامن", "date": "25-29/10/2026", "pages": "دليل المعلم ص 41-45", "n": 5, "periods": [{"focus": "الإعداد لتنظيم المسابقة واللجان (الفنية، السكرتارية، الصحية، الأمن، الانتقالات)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف لجان تنظيم المسابقة ومهامها.\n2. يميز مهام اللجنة الفنية (الشروط، اللوائح، الدليل، فحص الأدوات).\n3. يشكل لجان مسابقة الصف.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- السبورة الذكية\n- الكتاب\n- أخرى: بطاقات اللجان", "المفاهيم": "- اللجنة الفنية\n- السكرتارية\n- اللجنة الصحية\n- لجنة الأمن", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما اللجان التي تحتاجها مسابقة دفع جلة على مستوى المدرسة؟ (ص 41-43).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (5 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهيئة.\n- الطالب: يشارك.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: شرح اللجان ومهامها.\n- الطالب: يستمع.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تشكل لجان المسابقة وتوزع المهام.\n- الطالب: يشكل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: عرض.\n- الطالب: يعرض.\n\nالنشاط 5 (2 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تلخيص.\n- الطالب: يلخص.", "التقويم التكويني": "س1 (مستوى الدعم): ما مهمة اللجنة الفنية؟\nالإجابة: وضع الشروط واللوائح وفحص الأدوات وتعيين الحكام.\nس2 (المستوى المتوقع): ما مهمة اللجنة الصحية؟\nالإجابة: الإسعاف والرعاية.\nس3 (المستوى المتقدم): ما مهم
