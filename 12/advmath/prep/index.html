] أوجد أصفار ص = جا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: 0، π، 2π\n3) [مستوى الاستدلال] أكمل: جا(180° + س) = ......\nالإجابة النموذجية: −جا س\n\n4) [مستوى المعرفة] أكمل: جتا(−س) = ......\nالإجابة النموذجية: جتا س\n5) [مستوى التطبيق] ما مدى الدالة ص = ظا س؟\nالإجابة النموذجية: جميع الأعداد الحقيقية\n6) [مستوى الاستدلال] أوجد أصفار ص = جتا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: π/2، 3π/2", "إرشاد للطالب: مراجعة استكشف 2 والعلاقات ص ⁦54–56⁩، ورسم منحنى ص = جا س في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 4-2 (1، 2) ص 64 من كتاب الطالب، ومراجعة خصائص المنحنيات الثلاثة ص ⁦56–59⁩.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=7"]}, {"t": "التمدد: ص = أ جا س و ص = جا(ب س)", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يحدد أثر المعامل أ على السعة والمعامل ب على الدورة في ص = أ جا(ب س) و ص = أ جتا(ب س) (20 دقيقة)\n2) يرسم منحنيات دوال مثلثية بعد تمدد رأسي أو أفقي (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "التمدد الرأسي، التمدد الأفقي، السعة = |أ|، الدورة = 360°/ب أو 2π/ب", "يحرك المعلم منزلقين للمعاملين أ، ب في GeoGebra ويطلب من الطلبة وصف ما يحدث للمنحنى.", "1. التهيئة: يعرض المعلم المنزلقين، ويصف الطالب التغيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يشرح المعلم ص = 2جا س (تمدد رأسي) ثم ص = جا 2س (تمدد أفقي) ص ⁦60–61⁩، ومثال 9، والطلبة يدون القاعدتين (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يعطي كل مجموعة دالة: 3جا 2س، 2جتا(س/2)، ½ جا 3س لتحديد السعة والدورة ورسمها، وترسم وتعرض (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: يكلف المعلم بتمارين 4-2: 3، 4 ص ⁦64–65⁩، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] ما سعة الدالة ص = 3 جا س؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ما دورة الدالة ص = جا 2س؟\nالإجابة النموذجية: 180°\n3) [مستوى الاستدلال] أوجد السعة والدورة للدالة ص = 2 جتا(س/2).\nالإجابة النموذجية: السعة 2، الدورة 720°", "1) [مستوى المعرفة] ما مدى الدالة ص = 4 جتا س؟\nالإجابة النموذجية: −4 ≤ ص ≤ 4\n2) [مستوى التطبيق] أوجد دورة الدالة ص = جا 3س بالراديان.\nالإجابة النموذجية: 2π/3\n3) [مستوى الاستدلال] اكتب دالة جيب سعتها 5 ودورتها 120°.\nالإجابة النموذجية: ص = 5 جا 3س", "إرشاد للطالب: حل تمارين 4-2 (⁦3–5⁩) ص ⁦64–65⁩ من كتاب الطالب، وتمارين 4-2 (⁦1–3⁩) ص ⁦38–39⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=7"]}, {"t": "الانسحاب: ص = جا س + ج و ص = جا(س + د)", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يحدد الانسحاب الرأسي والانسحاب الأفقي لمنحنى دالة مثلثية والمتجه المقابل له (15 دقيقة)\n2) يرسم منحنيات مثل ص = جا(س − 90°) و ص = 1 + 2جتا(س + 90°) بخطوات متتابعة (مثال 10) (25 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "الانسحاب الرأسي، الانسحاب الأفقي، متجه الانسحاب، تركيب التحويلات", "سؤال: «إذا رفعنا منحنى ص = جا س وحدتين إلى الأعلى، فما المدى الجديد؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 1 ≤ ص ≤ 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 10 ص 62 ثم خطوات رسم ص = 1 + 2جتا(س + 90°)، ويتابع الطالب الخطوات ويرسم (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تشاركي: يكلف الأزواج برسم ص = جا س + 2، ص = جتا(س − 60°)، ويرسم الطالب ويتبادل التحقق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تطبيق: يكلف المعلم بتمارين 4-2: 6، 7، 8 ص 65، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما مدى الدالة ص = ج  المنحنى، ويكمل الطالب الجدول ويرسم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يعرض المعلم المنحنى بـ GeoGebra ويحدد الدورة والسعة والقيم العظمى والصغرى، والطلبة يدون الخصائص (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يطلب المعلم استنتاج العلاقات ص 56 (جا(−س)، جا(180° − س)، جا(180° + س)) من الرسم، وتستنتج المجموعة العلاقات وتتحقق بأمثلة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الاكتشاف: ينفذ المعلم استكشف 3 ص 56 لرسم منحنى جيب التمام واستنتاج العلاقات، ويرسم الطالب ويكمل العبارات (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. النمذجة: يرسم المعلم منحنى ظا س ص ⁦57–58⁩ ويوضح خطوط التقارب عند 90° و 270°، ويرسم الطالب ويحدد خطوط التقارب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. تعاوني: يقارن الطلبة بين المنحنيات الثلاثة في جدول (الدورة، المدى، الأصفار)، وتكمل المجموعة الجدول (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: التمدد: ص = أ جا س و ص = جا(ب س) — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم المنزلقين، ويصف الطالب التغيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يشرح المعلم ص = 2جا س (تمدد رأسي) ثم ص = جا 2س (تمدد أفقي) ص ⁦60–61⁩، ومثال 9، والطلبة يدون القاعدتين (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يعطي كل مجموعة دالة: 3جا 2س، 2جتا(س/2)، ½ جا 3س لتحديد السعة والدورة ورسمها، وترسم وتعرض (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: يكلف المعلم بتمارين 4-2: 3، 4 ص ⁦64–65⁩، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: الانسحاب: ص = جا س + ج و ص = جا(س + د) — زمن الحصة 40 دقيقة\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 1 ≤ ص ≤ 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 10 ص 62 ثم خطوات رسم ص = 1 + 2جتا(س + 90°)، ويتابع الطالب الخطوات ويرسم (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تشاركي: يكلف الأزواج برسم ص = جا س + 2، ص = جتا(س − 60°)، ويرسم الطالب ويتبادل التحقق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تطبيق: يكلف المعلم بتمارين 4-2: 6، 7، 8 ص 65، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: الانعكاس وتركيب التحويلات الهندسية — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم المنحنيين، ويصف الطالب الانعكاس (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يشرح المعلم الانعكاس ومثالي 11، 12 ص ⁦63–64⁩، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مشكلات: يعرض المعلم صورًا لمنحنيات ويطلب كتابة معادلاتها (تمارين 4-2: ⁦10–13⁩ ص 66)، وتحلل المجموعات المنحنيات وتكتب المعادلات (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. عرض: تعرض المجموعات استنتاجاتها، ويبرر الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين التمثيلات البيانية ومسابقة الختام — زمن الحصة 40 دقيقة\n1. التهيئة: يطرح المعلم السؤال ويعرضه بالرسم، ويجيب الطالب: مرتين (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمارين 4-2: ⁦14–17⁩ ص ⁦66–67⁩ وتمارين كتاب النشاط ص ⁦41–42⁩ حسب المستوى، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مناقشة: يناقش المعلم الحلول ويربط عدد الحلول بالتقاطع، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ما مدى ص = 2 + جتا 3س»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – مد البحر وجزره: تشبّه المجموعات منحنى الجيب بحركة المد والجزر على شواطئ عمان، فتحدد على الرسم الدورة والسعة والقيم العظمى والصغرى والأصفار، ثم تقترح الوقت المناسب لخروج الصياد بقاربه (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: التمثيل البياني لدالة الجيب\n1) [مستوى المعرفة] ما دورة الدالة ص = جا س؟\nالإجابة النموذجية: 360° أو 2π\n2) [مستوى التطبيق] ما أكبر قيمة للدالة ص = جا س؟ وعند أي قيمة لـ س في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: 1 عند س = 90°\n3) [مستوى الاستدلال] استخدم المنحنى لتبين أن جا(−س) = −جا س.\nالإجابة النموذجية: المنحنى متماثل حول نقطة الأصل؛ قيمة الدالة عند −س معكوس قيمتها عند س\n\n4) [مستوى المعرفة] ما قيمة جتا 0°؟ وما نقطة تقاطع منحنى ص = جتا س مع محور الصادات؟\nالإجابة النموذجية: 1؛ (0، 1)\n5) [مستوى التطبيق] ما دورة الدالة ص = ظا س؟\nالإجابة النموذجية: 180° أو π\n6) [مستوى الاستدلال] حدد معادلات خطوط التقارب لمنحنى ص = ظا س في 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، س = 270°\n\nالحصة 2: التمدد: ص = أ جا س و ص = جا(ب س)\n1) [مستوى المعرفة] ما سعة الدالة ص = 3 جا س؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ما دورة الدالة ص = جا 2س؟\nالإجابة النموذجية: 180°\n3) [مستوى الاستدلال] أوجد السعة والدورة للدالة ص = 2 جتا(س/2).\nالإجابة النموذجية: السعة 2، الدورة 720°\n\nالحصة 3: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n1) [مستوى المعرفة] ما مدى الدالة ص = جا س + 2؟\nالإجابة النموذجية: 1 ≤ ص ≤ 3\n2) [مستوى التطبيق] صف التحويل الذي ينقل ص = جا س إلى ص = جا(س − 90°).\nالإجابة النموذجية: انسحاب أفقي 90° إلى اليمين بالمتجه (90، 0)\n3) [مستوى الاستدلال] أوجد القيمة العظمى والصغرى للدالة ص = 1 + 2جتا(س + 90°).\nالإجابة النموذجية: العظمى 3، الصغرى −1\n\nالحصة 4: الانعكاس وتركيب التحويلات الهندسية\n1) [مستوى المعرفة] صف التحويل من ص = جتا س إلى ص = −جتا س.\nالإجابة النموذجية: انعكاس في محور السينات\n2) [مستوى التطبيق] منحنى جيب قيمته العظمى 3 والصغرى −1 ودورته 360°. اكتب معادلته على صورة ص = أ جا س + ج.\nالإجابة النموذجية: أ = 2، ج = 1 ← ص = 2 جا س + 1\n3) [مستوى الاستدلال] هل ص = جا(−س) هو المنحنى نفسه لـ ص = −جا س؟ برر.\nالإجابة النموذجية: نعم؛ لأن جا(−س) = −جا س\n\nالحصة 5: تمارين التمثيلات البيانية ومسابقة الختام\n1) [مستوى المعرفة] كم حلًا للمعادلة جا س = 0.5 في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: حلان\n2) [مستوى التطبيق] كم حلًا للمعادلة جتا 2س = 0.3 في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: 4 حلول (دورة 180° فتتكرر مرتين)\n3) [مستوى الاستدلال] ارسم ص = جا س و ص = س/90 تقريبيًا ثم حدد عدد حلول جا س = س/90 في 0° ≤ س ≤ 180°.\nالإجابة النموذجية: حلان: س = 0°، س = 90° (لأن جا 90° = 1 = 90/90)", "الحصة 1: التمثيل البياني لدالة الجيب\n1) [مستوى المعرفة] ما مدى الدالة ص = جا س؟\nالإجابة النموذجية: −1 ≤ ص ≤ 1\n2) [مستوى التطبيق] أوجد أصفار ص = جا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: 0، π، 2π\n3) [مستوى الاستدلال] أكمل: جا(180° + س) = ......\nالإجابة النموذجية: −جا س\n\n4) [مستوى المعرفة] أكمل: جتا(−س) = ......\nالإجابة النموذجية: جتا س\n5) [مستوى التطبيق] ما مدى الدالة ص = ظا س؟\nالإجابة النموذجية: جميع الأعداد الحقيقية\n6) [مستوى الاستدلال] أوجد أصفار ص = جتا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: π/2، 3π/2\n\nالحصة 2: التمدد: ص = أ جا س و ص = جا(ب س)\n1) [مستوى المعرفة] ما مدى الدالة ص = 4 جتا س؟\nالإجابة النموذجية: −4 ≤ ص ≤ 4\n2) [مستوى التطبيق] أوجد دورة الدالة ص = جا 3س بالراديان.\nالإجابة النموذجية: 2π/3\n3) [مستوى الاستدلال] اكتب دالة جيب سعتها 5 ودورتها 120°.\nالإجابة النموذجية: ص = 5 جا 3س\n\nالحصة 3: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n1) [مستوى المعرفة] صف التحويل من ص = جتا س إلى ص = جتا س − 1.\nالإجابة النموذجية: انسحاب رأسي وحدة إلى الأسفل\n2) [مستوى التطبيق] ما الدالة الناتجة من انسحاب ص = جا س بمقدار 30° إلى اليسار؟\nالإجابة النموذجية: ص = جا(س + 30°)\n3) [مستوى الاستدلال] بيّن أن جتا(س + 90°) = −جا س باستخدام الانسحاب.\nالإجابة النموذجية: انسحاب منحنى جتا 90° لليسار ينطبق على منحنى −جا س\n\nالحصة 4: الانعكاس وتركيب التحويلات الهندسية\n1) [مستوى المعرفة] ما الدالة الناتجة من انعكاس ص = جا س في محور السينات؟\nالإجابة النموذجية: ص = −جا س\n2) [مستوى التطبيق] أوجد مدى ص = 3 − 2جا س.\nالإجابة النموذجية: 1 ≤ ص ≤ 5\n3) [مستوى الاستدلال] اكتب معادلة على صورة ص = أ جتا(ب س) لمنحنى قيمته العظمى 4 ودورته π.\nالإجابة النموذجية: ص = 4 جتا 2س\n\nالحصة 5: تمارين التمثيلات البيانية ومسابقة الختام\n1) [مستوى المعرفة] ما دورة ص = ظا 2س؟\nالإجابة النموذجية: 90°\n2) [مستوى التطبيق] ما مدى ص = 2 + جتا 3س؟\nالإجابة النموذجية: 1 ≤ ص ≤ 3\n3) [مستوى الاستدلال] كم حلًا للمعادلة 3جا 2س = 4 في 0° ≤ س ≤ 360°؟ برر.\nالإجابة النموذجية: لا حلول؛ ل : تمرين من كتاب النشاط ص 44، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدوال المثلثية العكسية، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – زاوية الصعود الجبلي: يحسب كل زوج زاوية ميل مسار مشي جبلي في عمان باستخدام ظا⁻¹ من ارتفاع ومسافة أفقية يختارانهما، ويتأكدان أن الناتج ضمن القيم الرئيسية، ثم يتحدثان عن السياحة الجبلية وجمال جبال عمان (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\n1) [مستوى المعرفة] ما مدى الدالة جتا⁻¹ س؟\nالإجابة النموذجية: 0° ≤ جتا⁻¹ س ≤ 180°\n2) [مستوى التطبيق] أوجد جا⁻¹(1/2) بالراديان.\nالإجابة النموذجية: π/6\n3) [مستوى الاستدلال] لماذا تكون جتا⁻¹(−1/2) = 120° وليست 240°؟\nالإجابة النموذجية: لأن مدى جتا⁻¹ هو [0°، 180°] و 240° خارجه\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية\n1) [مستوى المعرفة] أوجد القيمة الدقيقة: جا(جتا⁻¹(1/2)).\nالإجابة النموذجية: جا 60° = √3/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جتا(ظا⁻¹(1)).\nالإجابة النموذجية: جتا 45° = √2/2\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا⁻¹(جا 150°).\nالإجابة النموذجية: 30° (لأن مدى جا⁻¹ هو [−90°، 90°])", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\n1) [مستوى المعرفة] أوجد ظا⁻¹(1) بالدرجات.\nالإجابة النموذجية: 45°\n2) [مستوى التطبيق] أوجد جا⁻¹(−√3/2) بالراديان.\nالإجابة النموذجية: −π/3\n3) [مستوى الاستدلال] أوجد جتا⁻¹(0) + جا⁻¹(1) بالراديان.\nالإجابة النموذجية: π/2 + π/2 = π\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية\n1) [مستوى المعرفة] أوجد القيمة الدقيقة: ظا(جا⁻¹(√3/2)).\nالإجابة النموذجية: ظا 60° = √3\n2) [مستوى التطبيق] إذا كانت د(س) = 2 جا س في −π/2 ≤ س ≤ π/2، أوجد د⁻¹(س).\nالإجابة النموذجية: د⁻¹(س) = جا⁻¹(س/2)\n3) [مستوى الاستدلال] ما مجال د⁻¹(س) في السؤال السابق؟\nالإجابة النموذجية: −2 ≤ س ≤ 2", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\nإرشاد للطالب: قراءة المجالات والمديات طوة بخطوة ويعمم: الحل الأول من الحاسبة والثاني 180° − الأول، والطلبة يدون الطريقة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تعاوني: يكلف المعلم بحل: جا س = 0.3، جا س = −0.6 في 0° ≤ س ≤ 360°، وتحل المجموعات وتتحقق بالرسم (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: يكلف المعلم بتمارين 6-2: 1 (أ، ب) ص 82، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: يحل المعلم مثال 16 ص 75 (ظا 2أ = −2.1) ومثالًا على جيب التمام، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تشاركي: يكلف الأزواج: جتا س = −0.5، ظا س = 1، جتا س = 0.4، ويحل الطالب ويتبادل التصحيح (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. فردي: يكلف المعلم بتمارين 6-2: 1 (ج–و) و 2 ص 82، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ) — زمن الحصة 40 دقيقة\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 0°–720°، −30°–330° (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثالي 17، 18 ص ⁦76–78⁩، ويتابع الطالب ويدون الخطوات الأربع (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يكلف المعلم بحل جا 2س = 0.5، جتا(س − 30°) = 0.5 في 0° ≤ س ≤ 360°، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: يكلف المعلم بتمارين 6-2: 4، 5، 6 ص 83، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: معادلات مثلثية في صورة تربيعية ومسابقة الختام — زمن الحصة 40 دقيقة\n1. التهيئة: يطرح المعلم السؤال، ويحولها الطالب إلى 2ك² − ك − 1 = 0 (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم أمثلة 19، 20 ص ⁦79–81⁩، ويتابع الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 6-2: ⁦8–11⁩ ص 83 موزعة على المجموعات، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصويب: يناقش المعلم الحلول المرفوضة، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – رفرفة علم السارية: يتخيل الطلبة طرف علم عمان يرتفع وينخفض مع الريح وفق منحنى جيبي، فتحل كل مجموعة معادلة مثل جا س = 0.5 بين 0° و360° لتحديد لحظتي وصوله إلى ارتفاع معين، وتجد الحل الثاني بالتماثل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: حل معادلات الجيب في فترة معطاة\n1) [مستوى المعرفة] حل: جا س = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 30°، 150°\n2) [مستوى التطبيق] حل: جا س = 0.3 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 17.5°، 162.5°\n3) [مستوى الاستدلال] حل: جا س = −0.6 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 216.9°، 323.1°\n\n4) [مستوى المعرفة] حل: جتا س = −1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 120°، 240°\n5) [مستوى التطبيق] حل: ظا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 45°، 225°\n6) [مستوى الاستدلال] حل: جتا س = 0.4 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 66.4°، 293.6°\n\nالحصة 2: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\n1) [مستوى المعرفة] إذا كانت 0° ≤ س ≤ 180°، ففي أي فترة تقع 2س؟\nالإجابة النموذجية: 0° ≤ 2س ≤ 360°\n2) [مستوى التطبيق] حل: جا 2س = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2س = 30°، 150°، 390°، 510° ← س = 15°، 75°، 195°، 255°\n3) [مستوى الاستدلال] حل: جتا(س − 30°) = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س − 30° = 60°، 300° ← س = 90°، 330°\n\nالحصة 3: معادلات مثلثية في صورة تربيعية ومسابقة الختام\n1) [مستوى المعرفة] حل: (جا س − 1)(2جا س + 1) = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، 210°، 330°\n2) [مستوى التطبيق] حل: ظا² س = 3 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = ±√3 ← س = 60°، 120°، 240°، 300°\n3) [مستوى الاستدلال] حل: جتا² س − 3جتا س − 4 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: (جتا س − 4)(جتا س + 1) = 0؛ جتا س = 4 مرفوض ← س = 180°", "الحصة 1: حل معادلات الجيب في فترة معطاة\n1) [مستوى المعرفة] حل: جا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°\n2) [مستوى التطبيق] حل: جا س = √3/2 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س = π/3، 2π/3\n3) [مستوى الاستدلال] حل: 2جا س + 1 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = −1/2 ← س = 210°، 330°\n\n4) [مستوى المعرفة] حل: جتا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 0°، 360°\n5) [مستوى التطبيق] حل: ظا س = √3 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س = π/3، 4π/3\n6) [مستوى الاستدلال] حل: ظا س = −2.1 حيث 0° ≤ س ≤ 360° (لأقرب 0.01°).\nالإجابة النموذجية: س ≈ 115.46°، 295.46°\n\nالحصة 2: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\n1) [مستوى المعرفة] حل: جتا 2س = 0 حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: 2س = 90°، 270° ← س = 45°، 135°\n2) [مستوى التطبيق] حل: ظا 3س = 1 حيث 0° ≤ س ≤ 120°.\nالإجابة النموذجية: 3س = 45°، 225° ← س = 15°، 75°\n3) [مستوى الاستدلال] حل: جا(س + π/6) = 1 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س + π/6 = π/2 ← س = π/3\n\nالحصة 3: معادلات مثلثية في صورة تربيعية ومسابقة الختام\n1) [مستوى المعرفة] حل: جا² س = 1/4 حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: جا س = 1/2 (السالبة لا تعطي حلولًا في الفترة) ← س = 30°، 150°\n2) [مستوى التطبيق] حل: 2جا² س − جا س − 1 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، 210°، 330°\n3) [مستوى الاستدلال] لماذا لا توجد حلول للمعادلة جا س = 2؟\nالإجابة النموذجية: لأن مدى الجيب [−1، 1]", "الحصة 1: حل معادلات الجيب في فترة معطاة\nإرشاد للطالب: مراجعة مثال 15 ص 74، وحل تمارين 6-2 (1) ص 82 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة مثال 16 ص ⁦75–76⁩، وحل تمارين 6-2 (2، 3) ص 82 من كتاب الطالب، وتمارين 6-2 (1، 2) ص 46 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=9\n\nالحصة 2: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\nإرشاد للطالب: مراجعة مثالي 17، 18 ص ⁦76–78⁩، وحل تمارين 6-2 (⁦4–7⁩) ص 83 من كتاب الطالب، وتمارين 6-2 (⁦3–6⁩) ص 47 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=9\n\nالحصة 3: معادلات مثلثية في صورة تربيعية ومسابقة الختام\nإرشاد للطالب: حل تمارين 6-2 (⁦8–11⁩) ص 83 من كتاب الطالب، وتمارين 6-2 (⁦7–10⁩) ص ⁦48–49⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=9"]}, {"id": "7-2", "title": "المتطابقات المثلثية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦84–86⁩", "wbp": "⁦50–52⁩", "p": [{"t": "المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يبرهن المتطابقتين الأساسيتين باستخدام تعريف النسب المثلثية ونظرية فيثاغورث (20 دقيقة)\n2) يستخدم المتطابقتين لتبسيط عبارات مثلثية والتعبير عنها بدلالة نسبة واحدة (20 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "المتطابقة، الرمز ≡، المتطابقتان الأساسيتان، جا² هـ = 1 − جتا² هـ، جتا² هـ = 1 − جا² هـ", "يطلب المعلم حساب جا² 37° + جتا² 37° على الحاسبة، ثم تجربة زاوية أخرى، ويسأل: «ماذا تلاحظ؟»", "1. التهيئة: ينفذ المعلم النشاط بالحاسبة، ويلاحظ الطالب أن الناتج 1 دائمًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. البرهان: يقود المعلم برهان المتطابقتين ص 84 من دائرة الوحدة (س/نق، ص/نق)، ويشارك الطالب في خطوات البرهان (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 21 ص 84 (التعبير عن عبارة بدلالة جا س فقط)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بتمارين 7-2: 1 ص 85، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] أكمل: جا² هـ + ج  أن: جتا س × ظا س ≡ جا س.\nالإجابة النموذجية: جتا س × جا س/جتا س = جا س\n2) [مستوى التطبيق] أثبت أن: (1 − جتا² س)/جا س ≡ جا س.\nالإجابة النموذجية: جا² س/جا س = جا س\n3) [مستوى الاستدلال] أثبت أن: 1/جتا س − جتا س ≡ جا س ظا س.\nالإجابة النموذجية: (1 − جتا² س)/جتا س = جا² س/جتا س = جا س × جا س/جتا س", "1) [مستوى المعرفة] أثبت أن: ظا س/جا س ≡ 1/جتا س.\nالإجابة النموذجية: (جا س/جتا س) ÷ جا س = 1/جتا س\n2) [مستوى التطبيق] أثبت أن: جا⁴ س − جتا⁴ س ≡ جا² س − جتا² س.\nالإجابة النموذجية: (جا² س − جتا² س)(جا² س + جتا² س) = جا² س − جتا² س\n3) [مستوى الاستدلال] أثبت أن: (1 + جا س)/جتا² س ≡ 1/(1 − جا س).\nالإجابة النموذجية: (1 + جا س)/[(1 − جا س)(1 + جا س)] = 1/(1 − جا س)", "إرشاد للطالب: مراجعة مثال 23 ص 85، وحل تمارين 7-2 (2، 3) ص ⁦85–86⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=10"]}, {"t": "تمارين المتطابقات ومسابقة الختام", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يبرهن متطابقات متنوعة الصعوبة (25 دقيقة)\n2) يستخدم المتطابقات لإيجاد قيم دقيقة لعبارات بمعلومية نسبة (15 دقيقة)", "المخرج 1: تقييم\nالمخرج 2: تطبيق", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المتطابقات الأساسية، البرهان، القيمة الدقيقة", "سؤال سريع: «إذا كان جا س = 0.6 وس حادة، فما جتا س دون حاسبة؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 0.8 (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين 7-2: ⁦4–10⁩ ص 86 وتمارين كتاب النشاط ص ⁦50–52⁩ حسب المستوى، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض: تعرض المجموعات براهينها، ويبرر الطالب ويناقش (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق ات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بتمارين 7-2: 1 ص 85، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: برهنة المتطابقات المثلثية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم البرهان الخاطئ، ويكتشف الطالب الخطأ (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. النمذجة: يحل المعلم مثالي 22، 23 ص 85 ويستخرج إرشادات البرهان، والطلبة يدون الإرشادات (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تشاركي (بطاقات خطوات): يوزع المعلم بطاقات خطوات برهان مبعثرة لمتطابقة ويطلب ترتيبها، ويرتب الطالب الخطوات ويبرر كل خطوة (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. فردي: يكلف المعلم بتمارين 7-2: 2 (أ، ب) ص 85، ويبرهن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 0.8 (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين 7-2: ⁦4–10⁩ ص 86 وتمارين كتاب النشاط ص ⁦50–52⁩ حسب المستوى، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض المجموعات براهينها، ويبرر الطالب ويناقش (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول المتطابقات المثلثية، ويبدأ المعلم بسؤال «أثبت أن: (1 − جتا² س)/جا س ≡ جا س» (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – حجارة الحصن المتطابقة: ينقسم الصف فريقين يتناوبان على خطوات برهان متطابقة مثلثية، وكل خطوة صحيحة تضيف حجرًا إلى رسم حصن عماني على السبورة، ثم يتحدث الطلبة عن قيمة التعاون في بناء الوطن (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\n1) [مستوى المعرفة] أكمل: جا² هـ + جتا² هـ ≡ ......\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] بسّط: جتا هـ × ظا هـ.\nالإجابة النموذجية: جا هـ\n3) [مستوى الاستدلال] اكتب 2جا² س − 7جتا² س + 4 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 7(1 − جا² س) + 4 = 9جا² س − 3\n\nالحصة 2: برهنة المتطابقات المثلثية\n1) [مستوى المعرفة] أثبت أن: جتا س × ظا س ≡ جا س.\nالإجابة النموذجية: جتا س × جا س/جتا س = جا س\n2) [مستوى التطبيق] أثبت أن: (1 − جتا² س)/جا س ≡ جا س.\nالإجابة النموذجية: جا² س/جا س = جا س\n3) [مستوى الاستدلال] أثبت أن: 1/جتا س − جتا س ≡ جا س ظا س.\nالإجابة النموذجية: (1 − جتا² س)/جتا س = جا² س/جتا س = جا س × جا س/جتا س\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\n1) [مستوى المعرفة] إذا كان جا س = 0.6 وس حادة، أوجد جتا س.\nالإجابة النموذجية: 0.8\n2) [مستوى التطبيق] أثبت أن: (جا س + جتا س)² ≡ 1 + 2جا س جتا س.\nالإجابة النموذجية: جا² س + 2جا س جتا س + جتا² س = 1 + 2جا س جتا س\n3) [مستوى الاستدلال] أثبت أن: ظا س + 1/ظا س ≡ 1/(جا س جتا س).\nالإجابة النموذجية: (جا² س + جتا² س)/(جا س جتا س) = 1/(جا س جتا س)", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\n1) [مستوى المعرفة] بسّط: 1 − جا² هـ.\nالإجابة النموذجية: جتا² هـ\n2) [مستوى التطبيق] بسّط: جا هـ ÷ ظا هـ.\nالإجابة النموذجية: جتا هـ\n3) [مستوى الاستدلال] اكتب 3 − 2جا² س بدلالة جتا س.\nالإجابة النموذجية: 3 − 2(1 − جتا² س) = 1 + 2جتا² س\n\nالحصة 2: برهنة المتطابقات المثلثية\n1) [مستوى المعرفة] أثبت أن: ظا س/جا س ≡ 1/جتا س.\nالإجابة النموذجية: (جا س/جتا س) ÷ جا س = 1/جتا س\n2) [مستوى التطبيق] أثبت أن: جا⁴ س − جتا⁴ س ≡ جا² س − جتا² س.\nالإجابة النموذجية: (جا² س − جتا² س)(جا² س + جتا² س) = جا² س − جتا² س\n3) [مستوى الاستدلال] أثبت أن: (1 + جا س)/جتا² س ≡ 1/(1 − جا س).\nالإجابة النموذجية: (1 + جا س)/[(1 − جا س)(1 + جا س)] = 1/(1 − جا س)\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\n1) [مستوى المعرفة] إذا كان جتا س = 5/13 وس حادة، أوجد ظا س.\nالإجابة النموذجية: 12/5\n2) [مستوى التطبيق] أثبت أن: جتا² س − جا² س ≡ 1 − 2جا² س.\nالإجابة النموذجية: (1 − جا² س) − جا² س = 1 − 2جا² س\n3) [مستوى الاستدلال] أثبت أن: (1 − جتا س)(1 + جتا س) ≡ جا² س.\nالإجابة النموذجية: 1 − جتا² س = جا² س", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\nإرشاد للطالب: مراجعة البرهان ص 84 ومثال 21، وحل تمارين 7-2 (1) ص 85 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: برهنة المتطابقات المثلثية\nإرشاد للطالب: مراجعة مثال 23 ص 85، وحل تمارين 7-2 (2، 3) ص ⁦85–86⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 7-2 ص ⁦50–52⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=10"]}, {"id": "8-2", "title": "المزيد من المعادلات المثلثية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦87–95⁩", "wbp": "⁦53–58⁩", "p": [{"t": "معادلات تُحل باستخدام ظا س = جا س/جتا س", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يحوّل معادلات مثل جا س = 2جتا س إلى صورة ظا س = ك ويحلها (25 دقيقة)\n2) يحل معادلات تتضمن جا س جتا س بالتحليل مع مراعاة عدم القسمة على عامل قد يساوي صفرًا (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "استخدام ظا = جا/جتا، القسمة على جتا س، فقدان الحلول، التحليل إلى عوامل", "سؤال: «لو قسمنا طرفي جا س جتا س = جا س على جا س، فما الحلول التي قد نفقدها؟»", "1. التهيئة: يطرح المعلم السؤال، ويكتشف الطالب أن حلول جا س = 0 تضيع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 24 ص 87 وتمرين 8-2: 1 ص 89، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بحل: جا س = 2جتا س، 3جا س = جتا س، جا س جتا س = جا س، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: يكلف المعلم بتمارين 8-2: 2، 4 ص 89، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حل: جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1 ← س = 45°، 225°\n2) [مستوى التطبيق] حل: جا س = 2جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 2 ← س ≈ 63.4°، 243.4°\n3) [مستوى الاستدلال] حل: جا س جتا س = جا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س(جتا س − 1) = 0 ← س = 0°، 180°، 360°", "1) [مستوى المعرفة] حل: √3 جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1/√3 ← س = 30°، 210°\n2) [مستوى التطبيق] حل: جتا س + جا س = 5جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 4 ← س ≈ 76.0°، 256.0°\n3) [مستوى الاستدلال] حل: 2جا س جتا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س(2جا س − 1) = 0 ← س = 30°، 90°، 150°، 270°", "إرشاد للطالب: مراجعة مثال 24 ص 87، وحل تمارين 8-2 (1، 2، 4) ص 89 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}, {"t": "معادلات تُحل باستخدام جا² س + جتا² س = 1", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يحول معادلة تحتوي جا² س وجتا س (أو العكس) إلى معادلة تربيعية في نسبة واحدة ويحلها (25 دقيقة)\n2) يحل معادلات مثل ظا س − جتا س = 0 بتحويلها إلى معادلة تربيعية (مثال 25) (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: برنامج GeoGebra", "الاستبدال جا² س = 1 − جتا² س، المعادلة التربيعية، الصيغة التربيعية، الحلول المرفوضة", "سؤال: «في المعادلة 2جتا² س + 3جا س = 3، كيف نجعل المعادلة كلها بدلالة جا س؟»", "1. التهيئة: يطرح المعلم السؤال، ويقترح الطالب الاستبدال (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 25 ص 88 ويتحقق بالرسم، ويتابع الطالب ويتحقق (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يكلف المعلم بتمارين 8-2: 3، 5، 6 ص 89، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: تمارين 8-2 (⁦1–4⁩) ص ⁦53–54⁩ من كتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] اكتب المعادلة 2جتا² س + 3جا س = 3 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 3جا س + 1 = 0\n2) [مستوى التطبيق] حل المعادلة السابقة حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = 1 أو 1/2 ← س = 30°، 90°، 150°\n3) [مستوى الاستدلال] بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0.\nالإجابة النموذجية: جا س = جتا² س = 1 − جا² س", "1) [مستوى المعرفة] حل: جا² س = جتا² س حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: ظا² س = 1 ← س = 45°، 135°\n2) [مستوى التطبيق] حل: 2جا² س = 1 + جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جتا² س + جتا س − 1 = 0 ← جتا س = 1/2 أو −1 ← س = 60°، 180°، 300°\n3) [مستوى الاستدلال] حل: جا² س + جا س − 1 = 0 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: جا س = (−1 + √5)/2 ≈ 0.618 ← س ≈ 38.2°، 141.8°", "إرشاد للطالب: مراجعة مثال 25 ص 88، وحل تمارين 8-2 (3، ⁦5–9⁩) ص 89 من كتاب الطالب، وتمارين 8-2 ص ⁦53–55⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}, {"t": "مراجعة الوحدة الثانية ومسابقة الختام", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يراجع مهارات الوحدة الثانية (القيم الدقيقة، التمثيلات، الدوال العكسية، المعادلات، المتطابقات) (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم التعاوني، التعلم المبني على اللعب، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مفاهيم الوحدة الثانية: القيم الدقيقة، زاوية الأساس، التمثيلات البيانية، الدوال العكسية، المعادلات والمتطابقات", "يقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثانية ص ⁦91–92⁩.", "1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ وكتاب النشاط ص ⁦56–58⁩: (⁦1–5⁩) للدعم، (⁦6–11⁩) للمتوقع، (⁦12–17⁩) للمتقدم، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مناقشة: يعرض المعلم حلولًا نموذجية، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – أمانة الحل الكامل: يحل كل زوج معادلة تتضمن جا س جتا س مرة بالتحليل ومرة بالقسمة، فيكتشف الحلول التي تضيع بالقسمة، ثم يربط الطلبة ذلك بقيمة الأمانة والدقة في العمل التي يعتز بها المجتمع العماني (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "1) [مستوى المعرفة] أوجد القيمة الدقيقة لـ جتا(5π/6).\nالإجابة النموذجية: −√3/2\n2) [مستوى التطبيق] حل: جتا² س = 1/4 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س = ±1/2 ← س = 60°، 120°، 240°، 300°\n3) [مستوى الاستدلال] بسّط: (جا س + جتا س)² + (جا س − جتا س)².\nالإجابة النموذجية: 2(جا² س + جتا² س) = 2", "1) [مستوى المعرفة] ما سعة الدالة ص = 3جتا 2س ودورتها؟\nالإجابة النموذجية: السعة 3، الدورة 180°\n2) [مستوى التطبيق] أوجد جتا⁻¹(−√2/2) بالراديان.\nالإجابة النموذجية: 3π/4\n3) [مستوى الاستدلال] حل: 3جا س = 2جتا² س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جا² س + 3جا س − 2 = 0 ← جا س = 1/2 ← س = 30°، 150°", "إرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ من كتاب الطالب وص ⁦56–58⁩ من كتاب النشاط، والاستعداد لاختبار قصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}], "c": ["الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) يحوّل معادلات مثل جا س = 2جتا س إلى صورة ظا س = ك ويحلها (25 دقيقة)\n2) يحل معادلات تتضمن جا س جتا س بالتحليل مع مراعاة عدم القسمة على عامل قد يساوي صفرًا (15 دقيقة)\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) يحول معادلة تحتوي جا² س وجتا س (أو العكس) إلى معادلة تربيعية في نسبة واحدة ويحلها (25 دقيقة)\n2) يحل معادلات مثل ظا س − جتا س = 0 بتحويلها إلى معادلة تربيعية (مثال 25) (15 دقيقة)\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) يراجع مهارات الوحدة الثانية (القيم الدقيقة، التمثيلات، الدوال العكسية، المعادلات، المتطابقات) (20 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (20 دقيقة)", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تحليل", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nالتعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nالتعلم التعاوني، التعلم المبني على اللعب، التعلم الذاتي", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: برنامج GeoGebra\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nاستخدام ظا = جا/جتا، القسمة على جتا س، فقدان الحلول، التحليل إلى عوامل\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nالاستبدال جا² س = 1 − جتا² س، المعادلة التربيعية، الصيغة التربيعية، الحلول المرفوضة\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nمفاهيم الوحدة الثانية: القيم الدقيقة، زاوية الأساس، التمثيلات البيانية، الدوال العكسية، المعادلات والمتطابقات", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nسؤال: «لو قسمنا طرفي جا س جتا س = جا س على جا س، فما الحلول التي قد نفقدها؟»\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nسؤال: «في المعادلة 2جتا² س + 3جا س = 3، كيف نجعل المعادلة كلها بدلالة جا س؟»\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nيقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثانية ص ⁦91–92⁩.", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويكتشف الطالب أن حلول جا س = 0 تضيع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 24 ص 87 وتمرين 8-2: 1 ص 89، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بحل: جا س = 2جتا س، 3جا س = جتا س، جا س جتا س = جا س، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: يكلف المعلم بتمارين 8-2: 2، 4 ص 89، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويقترح الطالب الاستبدال (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 25 ص 88 ويتحقق بالرسم، ويتابع الطالب ويتحقق (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 8-2: 3، 5، 6 ص 89، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: تمارين 8-2 (⁦1–4⁩) ص ⁦53–54⁩ من كتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ وكتاب النشاط ص ⁦56–58⁩: (⁦1–5⁩) للدعم، (⁦6–11⁩) للمتوقع، (⁦12–17⁩) للمتقدم، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة: يعرض المعلم حلولًا نموذجية، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. بطاقة الخروج: يكتب كل طالب على بطاقة إجابة سؤال «بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (9 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – أمانة الحل الكامل: يحل كل زوج معادلة تتضمن جا س جتا س مرة بالتحليل ومرة بالقسمة، فيكتشف الحلول التي تضيع بالقسمة، ثم يربط الطلبة ذلك بقيمة الأمانة والدقة في العمل التي يعتز بها المجتمع العماني (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) [مستوى المعرفة] حل: جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1 ← س = 45°، 225°\n2) [مستوى التطبيق] حل: جا س = 2جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 2 ← س ≈ 63.4°، 243.4°\n3) [مستوى الاستدلال] حل: جا س جتا س = جا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س(جتا س − 1) = 0 ← س = 0°، 180°، 360°\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) [مستوى المعرفة] اكتب المعادلة 2جتا² س + 3جا س = 3 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 3جا س + 1 = 0\n2) [مستوى التطبيق] حل المعادلة السابقة حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = 1 أو 1/2 ← س = 30°، 90°، 150°\n3) [مستوى الاستدلال] بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0.\nالإجابة النموذجية: جا س = جتا² س = 1 − جا² س\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) [مستوى المعرفة] أوجد القيمة الدقيقة لـ جتا(5π/6).\nالإجابة النموذجية: −√3/2\n2) [مستوى التطبيق] حل: جتا² س = 1/4 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س = ±1/2 ← س = 60°، 120°، 240°، 300°\n3) [مستوى الاستدلال] بسّط: (جا س + جتا س)² + (جا س − جتا س)².\nالإجابة النموذجية: 2(جا² س + جتا² س) = 2", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) [مستوى المعرفة] حل: √3 جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1/√3 ← س = 30°، 210°\n2) [مستوى التطبيق] حل: جتا س + جا س = 5جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 4 ← س ≈ 76.0°، 256.0°\n3) [مستوى الاستدلال] حل: 2جا س جتا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س(2جا س − 1) = 0 ← س = 30°، 90°، 150°، 270°\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) [مستوى المعرفة] حل: جا² س = جتا² س حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: ظا² س = 1 ← س = 45°، 135°\n2) [مستوى التطبيق] حل: 2جا² س = 1 + جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جتا² س + جتا س − 1 = 0 ← جتا س = 1/2 أو −1 ← س = 60°، 180°، 300°\n3) [مستوى الاستدلال] حل: جا² س + جا س − 1 = 0 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: جا س = (−1 + √5)/2 ≈ 0.618 ← س ≈ 38.2°، 141.8°\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) [مستوى المعرفة] ما سعة الدالة ص = 3جتا 2س ودورتها؟\nالإجابة النموذجية: السعة 3، الدورة 180°\n2) [مستوى التطبيق] أوجد جتا⁻¹(−√2/2) بالراديان.\nالإجابة النموذجية: 3π/4\n3) [مستوى الاستدلال] حل: 3جا س = 2جتا² س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جا² س + 3جا س − 2 = 0 ← جا س = 1/2 ← س = 30°، 150°", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nإرشاد للطالب: مراجعة مثال 24 ص 87، وحل تمارين 8-2 (1، 2، 4) ص 89 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nإرشاد للطالب: مراجعة مثال 25 ص 88، وحل تمارين 8-2 (3، ⁦5–9⁩) ص 89 من كتاب الطالب، وتمارين 8-2 ص ⁦53–55⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nإرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ من كتاب الطالب وص ⁦56–58⁩ من كتاب النشاط، والاستعداد لاختبار قصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 ر د نهاية لـ 1/(س − 3) عند س ← 3 من الرسم»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – الاقتراب من جبل شمس: تقترب المجموعات من قمة جبل شمس، أعلى قمة في عمان، بجدول قيم تقترب فيه س من أ من الجهتين، وتكتب النهاية بالرمز الصحيح وتقرؤها، ثم يذكر كل فرد معلمًا طبيعيًا عمانيًا يتمنى زيارته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفهوم النهاية باستخدام جداول القيم\n1) [مستوى المعرفة] أكمل: عندما تقترب س من 4 تقترب قيمة 3س من ......\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] اقرأ الرمز: نها(س←2⁺) د(س) = 5.\nالإجابة النموذجية: نهاية د(س) عندما تقترب س من 2 من جهة اليمين تساوي 5\n3) [مستوى الاستدلال] استخدم جدول قيم لتقدير نها(س←2) (س² + 1).\nالإجابة النموذجية: القيم تقترب من 5\n\nالحصة 2: النهاية من اليمين واليسار وشرط وجود النهاية\n1) [مستوى المعرفة] إذا كانت نها(س←2⁻) د(س) = 3 و نها(س←2⁺) د(س) = 3، فما نها(س←2) د(س)؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] إذا كانت النهاية من اليسار 1 ومن اليمين 4 عند س = 0، فهل النهاية موجودة؟\nالإجابة النموذجية: لا؛ النهايتان غير متساويتين\n3) [مستوى الاستدلال] هل يلزم أن تكون الدالة معرّفة عند س = أ لتكون لها نهاية عندها؟ مثّل.\nالإجابة النموذجية: لا؛ مثل (س² − 4)/(س − 2) عند 2: غير معرّفة والنهاية 4\n\nالحصة 3: تقدير النهايات من التمثيل البياني ومسابقة الختام\n1) [مستوى المعرفة] من منحنى متصل يمر بالنقطة (1، 3)، ما نها(س←1) د(س)؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] منحنى فيه نقطة معرفة (2، 1) لكن المنحنى يقترب من 4 حولها. ما د(2) وما نها(س←2) د(س)؟\nالإجابة النموذجية: د(2) = 1، النهاية = 4\n3) [مستوى الاستدلال] فسّر لماذا لا توجد نهاية لـ 1/(س − 3) عند س ← 3 من الرسم.\nالإجابة النموذجية: القيم تتزايد بلا حد من جهة وتتناقص بلا حد من الأخرى (خط تقارب رأسي)", "الحصة 1: مفهوم النهاية باستخدام جداول القيم\n1) [مستوى المعرفة] قدّر نها(س←1) (2س + 3).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] ما المقصود بالاقتراب من اليسار عندما س ← 3⁻؟\nالإجابة النموذجية: س تأخذ قيمًا أصغر من 3 وتقترب منها مثل 2.9، 2.99، ...\n3) [مستوى الاستدلال] قدّر بجدول قيم نها(س←0) (س² + س)/س.\nالإجابة النموذجية: القيم تقترب من 1\n\nالحصة 2: النهاية من اليمين واليسار وشرط وجود النهاية\n1) [مستوى المعرفة] متى تكون نها(س←أ) د(س) = ل موجودة؟\nالإجابة النموذجية: عندما تتساوى النهايتان من اليمين واليسار وتساوي ل\n2) [مستوى التطبيق] من منحنى فيه قفزة عند س = 1 (يسارًا 2 ويمينًا −1)، هل النهاية عند 1 موجودة؟\nالإجابة النموذجية: غير موجودة\n3) [مستوى الاستدلال] دالة لها فجوة عند (3، 5) والمنحنى يقترب من 5 من الجهتين. ما نها(س←3) د(س)؟\nالإجابة النموذجية: 5\n\nالحصة 3: تقدير النهايات من التمثيل البياني ومسابقة الختام\n1) [مستوى المعرفة] قدّر نها(س←0) د(س) لمنحنى يقترب من 2 من الجهتين.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] منحنى يقترب من 5 يسار س = 4 ومن 7 يمينها. اكتب النهايتين بالرموز.\nالإجابة النموذجية: نها(س←4⁻) د(س) = 5، نها(س←4⁺) د(س) = 7\n3) [مستوى الاستدلال] في السؤال السابق، هل توجد نها(س←4) د(س)؟ برر.\nالإجابة النموذجية: لا؛ لأن النهايتين من الجهتين غير متساويتين", "الحصة 1: مفهوم النهاية باستخدام جداول القيم\nإرشاد للطالب: مراجعة استكشف 1 ص 97 وتعريف النهاية، وإنشاء جدول قيم لـ نها(س←3) (2س − 1).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: النهاية من اليمين واليسار وشرط وجود النهاية\nإرشاد للطالب: قراءة نتيجة 1 ص 98، وحل تمارين 1-3 (1، 2) ص ⁦59–60⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تقدير النهايات من التمثيل البياني ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 1-3 ص ⁦59–61⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=12"]}, {"id": "1-3أ", "title": "نهاية الدالة كثيرة الحدود", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦99–100⁩", "wbp": "⁦59–61⁩", "p": [{"t": "إيجاد يجاد نهاية كثيرة الحدود بالتعويض المباشر\nيقارن الطلبة بين نتيجة جدول القيم لنها(س←2)(س² + 1) وقيمة الدالة عند 2.\n\nالحصة 2: مسائل على نهايات كثيرات الحدود وإيجاد ثوابت مجهولة\nسؤال: «إذا كانت نها(س←2) (ك س + 1) = 7، فما قيمة ك؟»\n\nالحصة 3: تمارين نهاية كثيرة الحدود ومسابقة الختام\nسؤال: «أي الطريقتين أسرع لإيجاد نها(س←5) (س³ − 100): الجدول أم التعويض؟ ولماذا؟»", "الحصة 1: إيجاد نهاية كثيرة الحدود بالتعويض المباشر — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم المقارنة، ويلاحظ الطالب التساوي (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرض المعلم قاعدة التعويض المباشر ص 99 ومثال 1، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المجموعات بتمارين 1-3أ: 1، 2 ص 100، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. فردي: يكلف المعلم بتمارين 1-3أ: 3 ص 100، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: مسائل على نهايات كثيرات الحدود وإيجاد ثوابت مجهولة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: ك = 3 (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. النمذجة: يحل المعلم مسألتين على إيجاد ثوابت، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. حل مشكلات: يكلف المجموعات بتمارين 1-3أ: 4، 5، 6 ص 100، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. عرض: تعرض المجموعات حلولها، ويبرر الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: تمارين نهاية كثيرة الحدود ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين 1-3أ: 7 ص 100 وتمارين إضافية متدرجة، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تصويب ومناقشة: يعرض المعلم الحلول، ويصحح الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول نهاية الدالة كثيرة الحدود، ويبدأ المعلم بسؤال «أوجد نها(س←1/2) (4س² − 2س + 7)» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – طريق بلا انقطاع: يشبّه الطلبة منحنى كثيرة الحدود بطريق متصل بين محافظتين عمانيتين بلا انقطاع، فتجد كل مجموعة نهايات بالتعويض المباشر وتبرره بالاتصال، ثم تقترح طريقًا عمانيًا تحب السفر عليه (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: إيجاد نهاية كثيرة الحدود بالتعويض المباشر\n1) [مستوى المعرفة] أوجد نها(س←3) (2س + 1).\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] أوجد نها(س←2) (3س² − 4س + 1).\nالإجابة النموذجية: 12 − 8 + 1 = 5\n3) [مستوى الاستدلال] أوجد نها(س←−1) (س³ + 2س² − س).\nالإجابة النموذجية: −1 + 2 + 1 = 2\n\nالحصة 2: مسائل على نهايات كثيرات الحدود وإيجاد ثوابت مجهولة\n1) [مستوى المعرفة] أوجد ك إذا كانت نها(س←2) (ك س + 1) = 7.\nالإجابة النموذجية: 2ك + 1 = 7 ← ك = 3\n2) [مستوى التطبيق] أوجد أ إذا كانت نها(س←1) (س² + أ س − 3) = 4.\nالإجابة النموذجية: 1 + أ − 3 = 4 ← أ = 6\n3) [مستوى الاستدلال] أوجد أ، ب إذا كانت نها(س←1)(أ س + ب) = 5 و نها(س←2)(أ س + ب) = 8.\nالإجابة النموذجية: أ + ب = 5، 2أ + ب = 8 ← أ = 3، ب = 2\n\nالحصة 3: تمارين نهاية كثيرة الحدود ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←5) (س³ − 100).\nالإجابة النموذجية: 25\n2) [مستوى التطبيق] أوجد نها(س←−3) (س² + 4س + 3).\nالإجابة النموذجية: 0\n3) [مستوى الاستدلال] أوجد نها(س←1/2) (4س² − 2س + 7).\nالإجابة النموذجية: 1 − 1 + 7 = 7", "الحصة 1: إيجاد نهاية كثيرة الحدود بالتعويض المباشر\n1) [مستوى المعرفة] أوجد نها(س←0) (س² − 7).\nالإجابة النموذجية: −7\n2) [مستوى التطبيق] أوجد نها(س←1) (س⁴ − 3س + 2).\nالإجابة النموذجية: 0\n3) [مستوى الاستدلال] لماذا يصح التعويض المباشر في كثيرات الحدود؟\nالإجابة النموذجية: لأنها معرّفة لكل الأعداد الحقيقية ومنحنياتها متصلة\n\nالحصة 2: مسائل على نهايات كثيرات الحدود وإيجاد ثوابت مجهولة\n1) [مستوى المعرفة] أوجد ك إذا كانت نها(س←3) (س² − ك) = 4.\nالإجابة النموذجية: ك = 5\n2) [مستوى التطبيق] أوجد نها(س←4) (س − 1)(س + 2).\nالإجابة النموذجية: 3 × 6 = 18\n3) [مستوى الاستدلال] أوجد أ إذا كانت نها(س←−2) (أ س² + 3س) = 6.\nالإجابة النموذجية: 4أ − 6 = 6 ← أ = 3\n\nالحصة 3: تمارين نهاية كثيرة الحدود ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←10) (0.5س + 1).\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد نها(س←−1) (2س³ − س).\nالإجابة النموذجية: −2 + 1 = −1\n3) [مستوى الاستدلال] أوجد ك إذا كانت نها(س←ك) (س² − 2س) = 3 وك > 0.\nالإجابة النموذجية: ك² − 2ك − 3 = 0 ← ك = 3", "الحصة 1: إيجاد نهاية كثيرة الحدود بالتعويض المباشر\nإرشاد للطالب: مراجعة مثال 1 ص 99، وحل تمارين 1-3أ (⁦1–3⁩) ص 100 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: مسائل على نهايات كثيرات الحدود وإيجاد ثوابت مجهولة\nإرشاد للطالب: حل تمارين 1-3أ (⁦4–6⁩) ص 100 من كتاب الطالب، وتمارين 1-3 (4، 5) ص 61 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تمارين نهاية كثيرة الحدود ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 1-3أ ص 100 من كتاب الطالب والمراجعة لدرس نهاية الدالة النسبية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=13"]}, {"id": "1-3ب", "title": "نهاية الدالة النسبية", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦101–109⁩", "wbp": "⁦62–65⁩", "p": [{"t": "نهاية الدالة النسبية بالتعويض المباشر والصيغة غير المعيّنة + إيجاد النهاية بالتحليل إلى عوامل والاختصار", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يجد نهاية دالة نسبية بالتعويض المباشر عندما لا يساوي المقام صفرًا (15 دقيقة)\n2) يتعرف الصيغة غير المعيّنة 0/0 ويدرك ضرورة تبسيط الدالة قبل التعويض (5 دقائق)\n3) يجد نهاية دالة نسبية تعطي 0/0 بالتحليل إلى عوامل واختصار العامل المشترك (15 دقيقة)\n4) يحلل كثيرات حدود (الفرق بين مربعين، ثلاثية،  2س عندما س < 1، و س + 3 عندما س ≥ 1. هل توجد نها(س←1) د(س)؟\nالإجابة النموذجية: لا؛ يسارًا 2 ويمينًا 4\n\nالحصة 2: إيجاد ثابت لتكون النهاية موجودة ومسابقة الختام\n1) [مستوى المعرفة] د(س) = س² + ك عندما س < 1، و 3س − 1 عندما س ≥ 1. أوجد ك لتكون النهاية عند 1 موجودة.\nالإجابة النموذجية: 1 + ك = 2 ← ك = 1\n2) [مستوى التطبيق] د(س) = ك س عندما س < 2، و س² عندما س ≥ 2. أوجد ك.\nالإجابة النموذجية: 2ك = 4 ← ك = 2\n3) [مستوى الاستدلال] د(س) = أ س + 1 عندما س < 3، و س² − أ عندما س ≥ 3. أوجد أ.\nالإجابة النموذجية: 3أ + 1 = 9 − أ ← أ = 2", "الحصة 1: تقدير نهاية الدالة المعرّفة بأكثر من قاعدة من الرسم\n1) [مستوى المعرفة] من الرسم: يقترب المنحنى من 4 من الجهتين عند س = 4.7. ما النهاية؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] اكتب بالرموز: النهاية من اليسار عند س = 2 تساوي 5.\nالإجابة النموذجية: نها(س←2⁻) د(س) = 5\n3) [مستوى الاستدلال] هل وجود قفزة يعني أن الدالة غير معرّفة عند النقطة؟\nالإجابة النموذجية: لا؛ قد تكون معرّفة لكن النهاية غير موجودة\n\n4) [مستوى المعرفة] د(س) = س² عندما س < 0، و س عندما س ≥ 0. أوجد نها(س←0) د(س).\nالإجابة النموذجية: 0\n5) [مستوى التطبيق] د(س) = 3 عندما س < 5، و س − 2 عندما س ≥ 5. أوجد نها(س←5) د(س).\nالإجابة النموذجية: 3\n6) [مستوى الاستدلال] د(س) = س² + 1 عندما س ≤ 1، و 4 − س عندما س > 1. أوجد النهاية عند 1 إن وجدت.\nالإجابة النموذجية: يسارًا 2، يمينًا 3 ← غير موجودة\n\nالحصة 2: إيجاد ثابت لتكون النهاية موجودة ومسابقة الختام\n1) [مستوى المعرفة] د(س) = س + ك عندما س < 0، و 5 عندما س ≥ 0. أوجد ك.\nالإجابة النموذجية: ك = 5\n2) [مستوى التطبيق] د(س) = 2س + ك عندما س < 1، و 4س عندما س ≥ 1. أوجد ك.\nالإجابة النموذجية: 2 + ك = 4 ← ك = 2\n3) [مستوى الاستدلال] د(س) = ك² عندما س < 2، و س + 7 عندما س ≥ 2. أوجد قيم ك.\nالإجابة النموذجية: ك² = 9 ← ك = ±3", "الحصة 1: تقدير نهاية الدالة المعرّفة بأكثر من قاعدة من الرسم\nإرشاد للطالب: مراجعة مثال 5 ص ⁦110–111⁩، وحل تمارين 1-3ج (1) ص 113 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة لب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن الدرس، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – أفق البحّار: تشبّه المجموعات خط التقارب الأفقي بخط الأفق الذي يقترب منه البحّار العماني ولا يبلغه، وتصف بجدول قيم سلوك دالة نسبية عندما س ← ±∞، ثم تكتب جملة تربط ذلك بالطموح الوطني المستمر (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: مفهوم النهاية عند اللانهاية وخط التقارب الأفقي\n1) [مستوى المعرفة] أوجد نها(س←∞) 1/س.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد نها(س←∞) (2 − 1/س).\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] ما خط التقارب الأفقي لمنحنى د(س) = 3 + 5/س؟\nالإجابة النموذجية: ص = 3\n\n4) [مستوى المعرفة] أوجد نها(س←∞) (2س + 1)/(س − 3).\nالإجابة النموذجية: 2\n5) [مستوى التطبيق] أوجد نها(س←∞) (3س² − 1)/(س² + 4).\nالإجابة النموذجية: 3\n6) [مستوى الاستدلال] أوجد نها(س←∞) 5س/(س² + 1).\nالإجابة النموذجية: 0\n\nالحصة 2: تطبيقات على النهاية عند اللانهاية ومسابقة الختام\n1) [مستوى المعرفة] ت(ن) = 5ن/(ن + 2). أوجد نها(ن←∞) ت(ن) وفسرها.\nالإجابة النموذجية: 5؛ يستقر التركيز قرب 5 وحدات\n2) [مستوى التطبيق] ما خط التقارب الأفقي لمنحنى ص = (2س − 3)/(س + 1)؟\nالإجابة النموذجية: ص = 2\n3) [مستوى الاستدلال] اكتب دالة نسبية لها خط تقارب أفقي ص = 4 ورأسي س = 1.\nالإجابة النموذجية: مثل ص = 4س/(س − 1)", "الحصة 1: مفهوم النهاية عند اللانهاية وخط التقارب الأفقي\n1) [مستوى المعرفة] أوجد نها(س←−∞) 4/س².\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد نها(س←∞) (7 + 1/س).\nالإجابة النموذجية: 7\n3) [مستوى الاستدلال] ما خطا التقارب لمنحنى د(س) = 1/(س − 2) + 1؟\nالإجابة النموذجية: رأسي س = 2، أفقي ص = 1\n\n4) [مستوى المعرفة] أوجد نها(س←∞) (4 − س)/(2س + 5).\nالإجابة النموذجية: −1/2\n5) [مستوى التطبيق] أوجد نها(س←−∞) (6س³ + 1)/(2س³ − س).\nالإجابة النموذجية: 3\n6) [مستوى الاستدلال] هل توجد نهاية عددية لـ س²/(س + 1) عندما س ← ∞؟ برر.\nالإجابة النموذجية: لا؛ درجة البسط أكبر فتتزايد القيم بلا حد\n\nالحصة 2: تطبيقات على النهاية عند اللا لتعاوني.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين 3-3: 4، 5، 6 ص 126 وتمارين كتاب النشاط ص ⁦74–75⁩، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مناقشة: يعرض المعلم الحلول، ويصحح الطالب (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «إذا كانت نها د(س) = 3 و نها ع(س) = 6 عند س ← أ، أوجد نها (د(س) × ع(س) + 1)»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ورشة صناعة السفن: يتقاسم أفراد المجموعة نهايات الدوال المكونة كفريق في ورشة صناعة سفن عمانية، يحسب كل فرد جزءًا ثم يجمعون النتائج بالخواص لحساب نهاية الدالة الكلية، مع التحقق من شرط خاصية القسمة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني (جيجسو).", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\n1) [مستوى المعرفة] إذا كانت نها(س←2) د(س) = 4، أوجد نها(س←2) 3د(س).\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] إذا كانت نها د(س) = 4 و نها ع(س) = −1 عند س ← 2، أوجد نها (د(س) − ع(س)).\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] للدالتين السابقتين أوجد نها د(س)/ع(س)، ومتى لا يمكن استخدام خاصية القسمة؟\nالإجابة النموذجية: −4؛ عندما تكون نهاية المقام صفرًا\n\n4) [مستوى المعرفة] إذا كانت نها(س←1) د(س) = 4، أوجد نها(س←1) [د(س)]³.\nالإجابة النموذجية: 64\n5) [مستوى التطبيق] أوجد نها(س←4) √(س + 5).\nالإجابة النموذجية: 3\n6) [مستوى الاستدلال] إذا كانت نها د(س) = 9 عند س ← 2، أوجد نها (√د(س) + د(س)²).\nالإجابة النموذجية: 3 + 81 = 84\n\nالحصة 2: تمارين خواص النهايات ومسابقة الختام\n1) [مستوى المعرفة] إذا كانت نها د(س) = 3 و نها ع(س) = 6 عند س ← أ، أوجد نها (د(س) × ع(س) + 1).\nالإجابة النموذجية: 19\n2) [مستوى التطبيق] للدالتين السابقتين أوجد نها √(ع(س) + د(س)).\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] إذا كانت نها د(س) = 2 عند س ← أ، أوجد نها (د(س)² − 3د(س))/(د(س) + 2).\nالإجابة النموذجية: (4 − 6)/4 = −1/2", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\n1) [مستوى المعرفة] أوجد نها(س←3) 7 (ثابت).\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] إذا كانت نها د(س) = 5 و نها ع(س) = 2 عند س ← 1، أوجد نها (د(س) × ع(س)).\nالإجابة النموذجية: 10\n3) [مستوى الاستدلال] للدالتين السابقتين أوجد نها (2د(س) − 3ع(س)).\nالإجابة النموذجية: 10 − 6 = 4\n\n4) [مستوى المعرفة] أوجد نها(س←2) س⁵.\nالإجابة النموذجية: 32\n5) [مستوى التطبيق] أوجد نها(س←3) ∛(س² − 1).\nالإجابة النموذجية: 2\n6) [مستوى الاستدلال] إذا كانت نها د(س) = −2 عند س ← 0، أوجد نها [د(س)]² ÷ (د(س) + 4).\nالإجابة النموذجية: 4/2 = 2\n\nالحصة 2: تمارين خواص النهايات ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←1) (س³ + 2س)(س − 4).\nالإجابة النموذجية: 3 × (−3) = −9\n2) [مستوى التطبيق] أوجد نها(س←2) (س² + 5)/(س + 1).\nالإجابة النموذجية: 9/3 = 3\n3) [مستوى الاستدلال] إذا كانت نها د(س) = ك عند س ← 1 و نها 5د(س) = 15، أوجد ك.\nالإجابة النموذجية: ك = 3", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\nإرشاد للطالب: حفظ خواص النهايات ص 122، وحل تمارين 3-3 (1) ص 125 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 3-3 (2، 3) ص 125 من كتاب الطالب، وتمارين 3-3 (1، 2) ص 73 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=17\n\nالحصة 2: تمارين خواص النهايات ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 3-3 ص ⁦74–75⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=17"]}, {"id": "4-3", "title": "الاتصال", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦127–136⁩", "wbp": "⁦76–84⁩", "p": [{"t": "شروط اتصال الدالة عند نقطة + أنواع عدم الاتصال من التمثيل البياني", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يذكر الشروط الثلاثة لاتصال الدالة عند س = أ (نتيجة 4) (15 دقيقة)\n2) يحكم على اتصال دالة عند نقطة بالتحقق من الشروط الثلاثة (10 دقائق)\n3) يميز أنواع عدم الاتصال: الفجوة (القابل للإزالة)، القفزة، خط التقارب الرأسي (10 دقائق)\n4) يحدد من التمثيل البياني النقاط التي تكون الدالة عندها غير متصلة ويبرر (5 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: برنامج GeoGebra، أخرى: بطاقات عمل", "الاتصال، عدم الاتصال، د(أ) موجودة، النهاية موجودة، النهاية = د(أ)، عدم الاتصال القابل للإزالة، القفزة، عدم الاتصال اللانهائي", "سؤال: «متى نقول إن مسارًا متصل؟ هل يمكن رسم منحنى متصل دون رفع القلم؟»", "1. التهيئة: يطرح المعلم السؤال ويربطه بالرسم دون رفع القلم، ويناقش الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يعرض المعلم نتيجة 4 ص 127 ويطبقها على منحنيات، والطلبة يدون الشروط (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 13 ص 128، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يعطي المعلم منحنيات لتحديد الشرط المختل عند نقاط معينة، وتحدد المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. النمذجة: يشرح المعلم أنواع عدم الاتصال ص 129 بأمثلة، والطلبة يدون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعاوني: يكلف المعلم بتمارين 4-3: 1، 2 ص 130، وتحل المجموعات (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. فردي: تمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] اذكر الشروط الثلاثة لاتصال د(س) عند س = أ.\nالإجابة النموذجية: د(أ) موجودة، نها(س←أ) د(س) موجودة، النهاية = د(أ)\n2) [مستوى التطبيق] هل الدالة (س² − 1)/(س − 1) متصلة عند س = 1؟ ولماذا؟\nالإجابة النموذجية: لا؛ لأن د(1) غير معرّفة\n3) [مستوى الاستدلال] دالة نهايتها عند 2 تساوي 5 و د(2) = 3. هل هي متصلة عند 2؟\nالإجابة النموذجية: لا؛ النهاية ≠ قيمة الدالة\n\n4) [مستوى المعرفة] ما نوع عدم الاتصال في منحنى (س² − 4)/(س − 2) عند س = 2؟\nالإجابة النموذجية: فجوة (قابل للإزالة)\n5) [مستوى التطبيق] ما نوع عدم الاتصال في منحنى 1/س عند س = 0؟\nالإجابة النموذجية: عدم اتصال لانهائي (خط تقارب رأسي)\n6) [مستوى الاستدلال] كيف يمكن إزالة عدم الاتصال في (س² − 4)/(س − 2) عند 2؟\nالإجابة النموذجية: بتعريف د(2) = 4", "1) [مستوى المعرفة] أي شرط يختل في منحنى به فجوة عند س = 3 مع عدم تعريف الدالة عند 3؟\nالإجابة النموذجية: الشرط الأول: د(3) غير موجودة\n2) [مستوى التطبيق] هل د(س) = س² + 2 متصلة عند س = 1؟\nالإجابة النموذجية: نعم: د(1) = 3 = النهاية\n3) [مستوى الاستدلال] أي شرط يختل عند وجود قفزة؟\nالإجابة النموذجية: الشرط الثاني: النهاية غير موجودة\n\n4) [مستوى المعرفة] ما نوع عدم الاتصال عند قفزة من 1 إلى 3؟\nالإجابة النموذجية: قفزة (غير قابل للإزالة)\n5) [مستوى التطبيق] هل يمكن إزالة عدم اتصال القفزة بإعادة تعريف نقطة واحدة؟\nالإجابة النموذجية: لا؛ لأن النهاية غير موجودة\n6) [مستوى الاستدلال] حدد نقاط عدم الاتصال لـ د(س) = 1/((س − 1)(س + 2)).\nالإجابة النموذجية: س = 1، س = −2", "إرشاد للطالب: حفظ نتيجة 4 ص 127، ومراجعة مثال 13 ص 128.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 4-3 (1، 2) ص 130 من كتاب الطالب، وتمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18"]}, {"t": "اتصال كثيرات الحدود والدوال النسبية", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يستنتج أن كثيرات الحدود متصلة على مجموعة الأعداد الحقيقية (20 دقيقة)\n2) يحدد نقاط عدم اتصال الدوال النسبية (أصفار المقام) (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "اتصال كثيرات الحدود، أصفار المقام، مجال الدالة النسبية", "سؤال: «هل رأيت منحنى كثيرة حدود فيه قفزة أو فجوة؟»", "1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يستنتج المعلم اتصال كثيرا ة الدالة\n\n4) [مستوى المعرفة] ما نوع عدم الاتصال في منحنى (س² − 4)/(س − 2) عند س = 2؟\nالإجابة النموذجية: فجوة (قابل للإزالة)\n5) [مستوى التطبيق] ما نوع عدم الاتصال في منحنى 1/س عند س = 0؟\nالإجابة النموذجية: عدم اتصال لانهائي (خط تقارب رأسي)\n6) [مستوى الاستدلال] كيف يمكن إزالة عدم الاتصال في (س² − 4)/(س − 2) عند 2؟\nالإجابة النموذجية: بتعريف د(2) = 4\n\nالحصة 2: اتصال كثيرات الحدود والدوال النسبية\n1) [مستوى المعرفة] هل د(س) = س³ − 5س + 2 متصلة عند جميع الأعداد الحقيقية؟\nالإجابة النموذجية: نعم؛ كثيرة حدود\n2) [مستوى التطبيق] حدد نقاط عدم اتصال د(س) = (س + 1)/(س² − 9).\nالإجابة النموذجية: س = 3، س = −3\n3) [مستوى الاستدلال] هل د(س) = (س + 2)/(س² + 4) متصلة على ح؟ برر.\nالإجابة النموذجية: نعم؛ لأن المقام لا يساوي صفرًا أبدًا\n\nالحصة 3: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\n1) [مستوى المعرفة] د(س) = س² عندما س < 2، و 2س عندما س ≥ 2. هل هي متصلة عند 2؟\nالإجابة النموذجية: نعم: النهايتان 4 و د(2) = 4\n2) [مستوى التطبيق] د(س) = س + ك عندما س < 3، و 2س − 1 عندما س ≥ 3. أوجد ك لتكون متصلة عند 3.\nالإجابة النموذجية: 3 + ك = 5 ← ك = 2\n3) [مستوى الاستدلال] د(س) = (س² − 9)/(س − 3) عندما س ≠ 3، و ك عندما س = 3. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 6\n\nالحصة 4: الاتصال على فترة مغلقة\n1) [مستوى المعرفة] ما الفرق بين الفترتين ]1، 5[ و [1، 5]؟\nالإجابة النموذجية: الأولى لا تتضمن الطرفين والثانية تتضمنهما\n2) [مستوى التطبيق] هل د(س) = 1/(س − 4) متصلة على [0، 3]؟\nالإجابة النموذجية: نعم؛ س = 4 خارج الفترة\n3) [مستوى الاستدلال] هل د(س) = 1/(س − 4) متصلة على [3، 5]؟ برر.\nالإجابة النموذجية: لا؛ غير معرّفة عند س = 4 داخل الفترة\n\nالحصة 5: مراجعة الوحدة الثالثة ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←3) (س² − 2س − 3)/(س − 3).\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد نها(س←∞) (5س² − 2)/(س² + 3س).\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] د(س) = س² − ك عندما س < 2، و ك س عندما س ≥ 2. أوجد ك لتكون متصلة عند 2.\nالإجابة النموذجية: 4 − ك = 2ك ← ك = 4/3", "الحصة 1: شروط اتصال الدالة عند نقطة\n1) [مستوى المعرفة] أي شرط يختل في منحنى به فجوة عند س = 3 مع عدم تعريف الدالة عند 3؟\nالإجابة النموذجية: الشرط الأول: د(3) غير موجودة\n2) [مستوى التطبيق] هل د(س) = س² + 2 متصلة عند س = 1؟\nالإجابة النموذجية: نعم: د(1) = 3 = النهاية\n3) [مستوى الاستدلال] أي شرط يختل عند وجود قفزة؟\nالإجابة النموذجية: الشرط الثاني: النهاية غير موجودة\n\n4) [مستوى المعرفة] ما نوع عدم الاتصال عند قفزة من 1 إلى 3؟\nالإجابة النموذجية: قفزة (غير قابل للإزالة)\n5) [مستوى التطبيق] هل يمكن إزالة عدم اتصال القفزة بإعادة تعريف نقطة واحدة؟\nالإجابة النموذجية: لا؛ لأن النهاية غير موجودة\n6) [مستوى الاستدلال] حدد نقاط عدم الاتصال لـ د(س) = 1/((س − 1)(س + 2)).\nالإجابة النموذجية: س = 1، س = −2\n\nالحصة 2: اتصال كثيرات الحدود والدوال النسبية\n1) [مستوى المعرفة] حدد نقطة عدم اتصال د(س) = 5/(س − 4).\nالإجابة النموذجية: س = 4\n2) [مستوى التطبيق] هل د(س) = س² − 7 متصلة عند س = 10؟\nالإجابة النموذجية: نعم\n3) [مستوى الاستدلال] حدد نقاط عدم اتصال د(س) = (س − 1)/(س² − 3س + 2).\nالإجابة النموذجية: س = 1، س = 2\n\nالحصة 3: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\n1) [مستوى المعرفة] د(س) = 2س + 1 عندما س ≤ 1، و 4 عندما س > 1. هل هي متصلة عند 1؟\nالإجابة النموذجية: لا؛ يسارًا 3 ويمينًا 4\n2) [مستوى التطبيق] د(س) = ك س² عندما س < 1، و 3 عندما س ≥ 1. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 3\n3) [مستوى الاستدلال] د(س) = أ س + 2 عندما س < 2، و س² + أ عندما س ≥ 2. أوجد أ.\nالإجابة النموذجية: 2أ + 2 = 4 + أ ← أ = 2\n\nالحصة 4: الاتصال على فترة مغلقة\n1) [مستوى المعرفة] هل د(س) = س² + 1 متصلة على [−2، 2]؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] هل د(س) = 1/س متصلة على [−1، 1]؟\nالإجابة النموذجية: لا؛ غير معرّفة عند 0\n3) [مستوى الاستدلال] أوجد فترة مغلقة تكون عليها د(س) = (س + 1)/(س − 2) متصلة.\nالإجابة النموذجية: مثل [3، 6] أو أي فترة لا تحتوي 2\n\nالحصة 5: مراجعة الوحدة الثالثة ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←0) (س² + 4س)/(2س).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] حدد نقاط عدم اتصال د(س) = 3/(س² − س).\nالإجابة النموذجية: س = 0، س = 1\n3) [مستوى الاستدلال] هل د(س) = (س² − 1)/(س + 1) متصلة على [0، 4]؟\nالإجابة النموذجية: نعم؛ س = −1 خارج الفترة", "الحصة 1: شروط اتصال الدالة عند نقطة\nإرشاد للطالب: حفظ نتيجة 4 ص 127، ومراجعة مثال 13 ص 128.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 4-3 (1، 2) ص 130 من كتاب الطالب، وتمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18\n\nالحصة 2: اتصال كثيرات الحدود والدوال النسبية\nإرشاد للطالب: حل تمارين 4-3 (3، 4) ص 131 من كتاب الطالب، وتمرين 4-3 (3) ص 78 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18\n\nالحصة 3: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\nإرشاد للطالب: حل تمارين 4-3 (5، 6) ص ⁦131–132⁩ من كتاب الطالب، وتمارين 4-3 (4، 5) ص ⁦79–80⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18\n\nالحصة 4: الاتصال على فترة مغلقة\nإرشاد للطالب: حل تمارين 4-3 (7) ص 133 من كتاب الطالب، وتمارين 4-3 (6، 7) ص ⁦80–81⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18\n\nالحصة 5: مراجعة الوحدة الثالثة ومسابقة الختام\nإرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الثالثة ص ⁦134–136⁩ من كتاب الطالب وص ⁦82–84⁩ من كتاب النشاط، والاستعداد لاختبار قصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: ـ ص = س²، ويتابع الطالب ويدون (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. النمذجة: يحل المعلم مثال 1 ص ⁦141–142⁩، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. تعاوني: يكلف المعلم بإيجاد مشتقة ص = 3س + 2 و ص = س² + س من المبادئ الأولية، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج — زمن الحصة 40 دقيقة\n1. التهيئة: يراجع المعلم الفك، ويفك الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يحل المعلم تمرين 1-4: 3 ص 143 (ميل الوتر على ص = س³ ونهايته)، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تشاركي: يكلف الأزواج بإيجاد مشتقة س² و س³ و س⁴ (الأخيرة للمتقدمين) وتنظيمها في جدول، ويكمل الطالب الجدول ويستنتج النمط (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بتمارين 1-4: 4، 5 ص 143، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: رموز المشتقة ودالة الميل — زمن الحصة 40 دقيقة\n1. التهيئة: يوزع المعلم البطاقات، ويطابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. بناء المفهوم: يوضح المعلم الرموز ومعناها ويكتب دالة الميل، والطلبة يدون (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق تعاوني: يكلف المعلم بإيجاد الميل عند نقاط على منحنيات س²، س³، س² + س، وتحسب المجموعات (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. فردي: يكلف المعلم بتمارين 1-4: 6 ص 143 وتمارين كتاب النشاط ص 85، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تمارين المشتقة وعلاقتها بالميل — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم الحل، ويكتشف الطالب الخطأ (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني بالمستويات: يوزع المعلم تمارين متدرجة: إيجاد ميول، مبادئ أولية لـ 3س²، لـ 1/س (للمتقدمين)، ويحل الطالب حسب مستواه (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقييم الأقران: تتبادل المجموعات الحلول وتقيّمها، ويقيّم الطالب ويعلق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تلخيص: يلخص المعلم الأخطاء الشائعة، والطلبة يدون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: تطبيقات المشتقة كميل ومسابقة الختام — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم المماس المتحرك، ويصف الطالب التغير (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تعاوني: يكلف المعلم بمسائل: إيجاد النقطة ذات ميل معلوم، والنقطة ذات المماس الأفقي، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كتاب النشاط: يكمل المعلم تمارين 1-4 ص ⁦85–86⁩، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تصويب: يناقش المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – طريق الجبل الأخضر: تحسب المجموعات ميول أوتار على منحنى يمثل طريقًا صاعدًا نحو الجبل الأخضر، وتقرّب النقطتين تدريجيًا لتقدير ميل المماس عند نقطة، ثم تتحدث عن أهمية الطرق في ربط القرى الجبلية بالمدن (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: ميل الوتر وميل المماس لمنحنى\n1) [مستوى المعرفة] أوجد ميل الوتر الواصل بين (2، 4) و (3، 9) على ص = س².\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] أوجد ميل الوتر بين (2، 4) و (2.1، 4.41).\nالإجابة النموذجية: 4.1\n3) [مستوى الاستدلال] ما الذي يقترب منه ميل الوتر عندما تقترب النقطة من (2، 4)؟\nالإجابة النموذجية: 4، وهو ميل المماس عند (2، 4)\n\n4) [مستوى المعرفة] اكتب تعريف المشتقة من المبادئ الأولية.\nالإجابة النموذجية: د′(س) = نها(هـ←0) [د(س + هـ) − د(س)]/هـ\n5) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة د(س) = 3س + 2.\nالإجابة النموذجية: [3(س + هـ) + 2 − 3س − 2]/هـ = 3 ← د′(س) = 3\n6) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة د(س) = س².\nالإجابة النموذجية: [(س + هـ)² − س²]/هـ = 2س + هـ ← 2س\n\nالحصة 2: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\n1) [مستوى المعرفة] فك (س + هـ)³.\nالإجابة النموذجية: س³ + 3س²هـ + 3سهـ² + هـ³\n2) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة ص = س³.\nالإجابة النموذجية: 3س²\n3) [مستوى الاستدلال] استنتج مشتقة ص = س⁵ من النمط.\nالإجابة النموذجية: 5س⁴\n\nالحصة 3: رموز المشتقة ودالة الميل\n1) [مستوى المعرفة] إذا كانت ص = س² فما دص/دس؟\nالإجابة النموذجية: 2س\n2) [مستوى التطبيق] أوجد ميل منحنى ص = س² عند س = −3.\nالإجابة النموذجية: −6\n3) [مستوى الاستدلال] أوجد ميل منحنى ص = س² + س عند النقطة (1، 2).\nالإجابة النموذجية: 3\n\nالحصة 4: تمارين المشتقة وعلاقتها بالميل\n1) [مستوى المعرفة] أوجد من المبادئ الأولية مشتقة ص = 3س².\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد ميل ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة ص = 1/س.\nالإجابة النموذجية: [1/(س + هـ) − 1/س]/هـ = −1/(س(س + هـ)) ← −1/س²\n\nالحصة 5: تطبيقات المشتقة كميل ومسابقة الختام\n1) [مستوى المعرفة] ما إشارة ميل ص = س² عند س = −2؟\nالإجابة النموذجية: سالبة (−4)\n2) [مستوى التطبيق] أوجد النقطة التي يكون عندها المماس لمنحنى ص = س² − 4س أفقيًا.\nالإجابة النموذجية: (2، −4)\n3) [مستوى الاستدلال] عند أي قيمة لـ س يكون ميل ص = س³ يساوي 12؟\nالإجابة النموذجية: 3س² = 12 ← س = ±2", "الحصة 1: ميل الوتر وميل المماس لمنحنى\n1) [مستوى المعرفة] أوجد ميل الوتر بين (1، 1) و (2، 4) على ص = س².\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] أوجد ميل الوتر بين (1، 1) و (1.01، 1.0201).\nالإجابة النموذجية: 2.01\n3) [مستوى الاستدلال] توقع ميل المماس لـ ص = س² عند (1، 1).\nالإجابة النموذجية: 2\n\n4) [مستوى المعرفة] ماذا يمثل المقدار [د(س + هـ) − د(س)]/هـ هندسيًا؟\nالإجابة النموذجية: ميل الوتر\n5) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة د(س) = 5.\nالإجابة النموذجية: 0\n6) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة د(س) = س² + س.\nالإجابة النموذجية: 2س + 1\n\nالحصة 2: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\n1) [مستوى المعرفة] ما مشتقة ص = س³ عند س = 2؟\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة ص = 2س².\nالإجابة النموذجية: 4س\n3) [مستوى الاستدلال] ما النمط في مشتقات س²، س³، س⁴؟\nالإجابة النموذجية: ن سⁿ⁻¹\n\nالحصة 3: رموز المشتقة ودالة الميل\n1) [مستوى المعرفة] ماذا يعني د′(2) = 5؟\nالإجابة النموذجية: ميل المماس للمنحنى عند س = 2 يساوي 5\n2) [مستوى التطبيق] أوجد ميل منحنى ص = س³ عند س = −1.\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] عند أي نقطة على ص = س² يكون الميل 8؟\nالإجابة النموذجية: س = 4 ← (4، 16)\n\nالحصة 4: تمارين المشتقة وعلاقتها بالميل\n1) [مستوى المعرفة] أوجد ميل ص = س² − 4س + 3 عند س = 3.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] عند أي نقطة يكون ميل ص = س² − 4س + 3 صفرًا؟\nالإجابة النموذجية: س = 2 ← (2، −1)\n3) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة ص = س² − 4س.\nالإجابة النموذجية: 2س − 4\n\nالحصة 5: تطبيقات المشتقة كميل ومسابقة الختام\n1) [مستوى المعرفة] ماذا يعني أن ميل المماس عند نقطة يساوي صفرًا؟\nالإجابة النموذجية: المماس أفقي عند تلك النقطة\n2) [مستوى التطبيق] أوجد ميل ص = 2س² عند س = −1.\nالإجابة النموذجية: −4\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² التي ميلها يساوي ميل الوتر بين (0، 0) و (4، 16).\nالإجابة النموذجية: ميل الوتر 4 ← 2س = 4 ← (2، 4)", "الحصة 1: ميل الوتر وميل المماس لمنحنى\nإرشاد للطالب: مراجعة استكشف 1 ص ⁦139–140⁩، وحل تمارين 1-4 (1) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة ص ⁦140–142⁩ ومثال 1، وحل تمارين 1-4 (2) ص 143 من كتاب الطالب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=19\n\nالحصة 2: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\nإرشاد للطالب: حل تمارين 1-4 (⁦3–5⁩) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=19\n\nالحصة 3: رموز ال
