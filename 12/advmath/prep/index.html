:root{--bg:#f6f9fc;--card:#fff;--ink:#26323d;--mut:#5f7183;--line:#dfe7ef;--acc:#3f78ad;--acc2:#e8f1fa;--ok:#3b8a57}
*{box-sizing:border-box}
body{margin:0;font-family:Taj,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
header{background:linear-gradient(180deg,#eef5fc,#f6f9fc);border-bottom:1px solid var(--line);padding:14px 16px 10px;position:sticky;top:0;z-index:5}
h1{margin:0 0 8px;font-size:1.25rem;color:#2f5f8a}
.wrap{max-width:1000px;margin:0 auto}
.mode{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;width:max-content;max-width:100%}
.mode button{border:0;background:transparent;font-family:inherit;font-size:1rem;padding:7px 16px;border-radius:10px;cursor:pointer;color:var(--mut)}
.mode button.on{background:var(--acc);color:#fff;font-weight:700}
.explain{font-size:.88rem;color:var(--mut);margin:6px 0 4px}
.now{display:inline-block;background:#fff7e3;border:1px solid #f0d99c;color:#7a5a12;border-radius:10px;padding:3px 10px;font-size:.92rem;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
select{font-family:inherit;font-size:1rem;padding:6px 10px;border-radius:10px;border:1px solid #c9d8e6;background:#fff;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabs button{font-family:inherit;border:1px solid #c9d8e6;background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:.93rem}
.tabs button.on{background:var(--acc2);border-color:var(--acc);color:#245078;font-weight:700}
main{padding:12px 16px 40px}
.meta{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:.93rem;color:var(--mut)}
.meta b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(30,60,90,.04)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:1rem}
.ch h3 span{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#fff;border:1px solid #c9d6e2;margin-left:6px;font-size:.85rem}
.cp{font-family:inherit;border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:4px 14px;cursor:pointer;font-size:.95rem;min-width:96px;transition:.2s}
.cp:hover{background:var(--acc2)}
.cp.done{background:var(--ok);border-color:var(--ok);color:#fff}
.cb{padding:9px 14px;white-space:pre-wrap;font-size:.97rem}
.hint{font-size:.82rem;color:#9a6b1a;padding:0 14px 8px;display:none}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:10px}
</style>
</head>

const D=[{"id": "1-1", "title": "الراديان", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦20–23⁩", "wbp": "⁦13–16⁩", "p": [{"t": "تعريف الراديان والعلاقة بين الراديان والدرجة", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يعرّف الراديان بأنه قياس زاوية مركزية تحصر قوسًا طوله يساوي طول نصف قطر الدائرة.\n2) يستنتج أن π راديان = 180° وأن الدورة الكاملة = 2π راديان.\nمخرج تعليمي آخر: يكتب قياسات الزوايا الخاصة بدلالة π.", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تذكر", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: خيط ودوائر كرتونية", "الراديان، الزاوية المركزية، القوس، نصف القطر، الدورة الكاملة، π", "مراجعة ما درسه الطالب سابقًا: قياس الزاوية بالدرجات، ومحيط الدائرة = 2π نق. يطرح المعلم سؤالًا: «كم مرة يمكن أن نلف نصف القطر على محيط الدائرة؟» ويستقبل التقديرات.", "(5 د) التهيئة: المعلم: يعرض صورة دائرة ويطرح سؤال لف نصف القطر على المحيط، ويوضح هدف الحصة. | الطالب: يقدّر الإجابة ويتذكر قانون محيط الدائرة.\n(10 د) الاستكشاف: المعلم: يوزع على المجموعات دوائر كرتونية وخيوطًا بطول نصف القطر، ويطلب لف الخيط على المحيط ورسم الزاوية المركزية المقابلة. | الطالب: يلف الخيط ويرسم الزاوية ويقيسها بالمنقلة (≈ 57°) ويعد عدد مرات لف الخيط (≈ 6.28).\n(10 د) بناء المفهوم: المعلم: يعرض تعريف الراديان ص 20 ويستنتج مع الطلبة النتيجتين: قوس طوله نق يقابل 1 راديان، والمحيط يقابل 2π راديان، ومنه π راديان = 180°. | الطالب: يناقش ويسجل التعريف والنتيجتين في دفتره.\n(10 د) تطبيق تعاوني: المعلم: يطلب إكمال جدول الزوايا الخاصة (0°، 30°، 45°، 60°، 90°، 180°، 270°، 360°) بدلالة π. | الطالب: تكمل كل مجموعة الجدول وتعرضه على السبورة.\n(5 د) الغلق والتقويم: المعلم: يطرح أسئلة التقويم الختامي ويلخص الفكرة الرئيسة. | الطالب: يجيب فرديًا على السبورات الصغيرة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما قياس الزاوية المركزية التي تحصر قوسًا طوله يساوي طول نصف قطر الدائرة؟\nالإجابة النموذجية: 1 راديان.\n2) [المستوى المتوقع] اكتب قياس الزاوية 90° بدلالة π.\nالإجابة النموذجية: π/2\n3) [المستوى المتقدم] كم راديانًا تساوي الدورة الكاملة؟ ولماذا؟\nالإجابة النموذجية: 2π راديان؛ لأن المحيط 2π نق، أي إن المحيط يحوي 2π من أنصاف الأقطار.", "1) [مستوى الدعم] أكمل: π راديان = .......°\nالإجابة النموذجية: 180\n2) [المستوى المتوقع] حوّل 45° و 270° إلى الراديان بدلالة π.\nالإجابة النموذجية: 45° = π/4 ، 270° = 3π/2\n3) [المستوى المتقدم] هل الزاوية التي قياسها 1 راديان أكبر أم أصغر من 60°؟ برّر.\nالإجابة النموذجية: أصغر؛ لأن 1 راديان = 180/π ≈ 57.3° < 60°.", "إرشاد للطالب: قراءة تعريف الراديان والنتيجتين 1 و 2 ص 20 من كتاب الطالب، وحفظ جدول الزوايا الخاصة ص 21.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "التحويل بين الدرجات والراديان", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يحوّل قياس الزاوية من الدرجات إلى الراديان بدلالة π أو بقيمة تقريبية.\n2) يحوّل قياس الزاوية من الراديان إلى الدرجات.\nمخرج تعليمي آخر: يقرّب قياس الزاوية بالراديان إلى عدد محدد من الأرقام المعنوية.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: الآلة الحاسبة العلمية، أخرى: بطاقات عمل", "التحويل من الدرجات إلى الراديان (× π/180)، التحويل من الراديان إلى الدرجات (× 180/π)، الأرقام المعنوية", "مراجعة سريعة لجدول الزوايا الخاصة بلعبة «اسأل وأجب»: يذكر المعلم زاوية بالدرجات ويذكر الطالب ما يساويها بالراديان.", "(5 د) التهيئة: المعلم: ينفذ لعبة «اسأل وأجب» على الزوايا الخاصة. | الطالب: يجيب بسرعة ويصحح لزملائه.\n(12 د) النمذجة: المعلم: يحل مثال 1 ص 21 بالطريقتين (التناسب، والضرب في π/180 أو 180/π) ويبرز متى نكتب الناتج بدلالة π. | الطالب: يتابع ويدوّن الطريقتين ويستنتج قاعدتي التحويل.\n(10 د) تطبيق تعاوني: المعلم: يوزع بطاقات مطابقة (زاوية بالدرجات ↔ قياسها بالراديان) على المجموعات. | الطالب: تطابق المجموعة البطاقات وتبرر مطابقتين أمام الصف.\n(8 د) تدريب فردي: المعلم: يكلف بحل تمارين 1-1: 1، 2، 3 (أ، ب) ص ⁦22–23⁩ ويتجول للمتابعة. | الطالب: يحل فرديًا ويقرب إلى 3 أرقام معنوية عند الحاجة.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة الختام ويغلق الحصة بقاعدتي التحويل. | الطالب: يجيب ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حوّل 60° إلى الراديان بدلالة π.\nالإجابة النموذجية: 60 × π/180 = π/3\n2) [المستوى المتوقع] حوّل 5π/9 إلى الدرجات.\nالإجابة النموذجية: 5π/9 × 180/π = 100°\n3) [المستوى المتقدم] حوّل 210° إلى الراديان بدلالة π.\nالإجابة النموذجية: 210 × π/180 = 7π/6", "1) [مستوى الدعم] حوّل π/6 إلى الدرجات.\nالإجابة النموذجية: 30°\n2) [المستوى المتوقع] حوّل 0.8 راديان إلى الدرجات مقربًا إلى أقرب منزلة عشرية.\nالإجابة النموذجية: 0.8 × 180/π ≈ 45.8°\n3) [المستوى المتقدم] حوّل 320° إلى الراديان مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 320 × π/180 ≈ 5.59 راديان", "إرشاد للطالب: مراجعة مثال 1 ص 21، وحل تمارين 1-1 (3، 4، 5) ص 23 من كتاب الطالب، وتمارين 1-1 (1، 2) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يضبط الحاسبة العلمية على وضع الراديان لإيجاد النسب المثلثية لزوايا مقيسة بالراديان.\n2) يحل مسائل في المثلث القائم الزاوية تكون فيها الزوايا مقيسة بالراديان.\nمخرج تعليمي آخر: يتحقق من معقولية الناتج بمقارنة قياس الزاوية بالدرجات.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "وضع الراديان (RAD)، وضع الدرجات (DEG)، الجيب، جيب التمام، الظل، المثلث القائم الزاوية", "سؤال تحفيزي: «احسب جا 30 على الحاسبة، ثم احسب جا(π/6). لماذا قد تختلف النتيجتان على حاسبة زميلك؟» لإبراز أهمية وضع الحاسبة.", "(5 د) التهيئة: المعلم: يطرح سؤال الحاسبة ويستقبل تفسيرات الطلبة. | الطالب: يجرب على الحاسبة ويقارن النتائج.\n(8 د) النمذجة: المعلم: يوضح ضبط الحاسبة على RAD ص 22 ويحسب أمثلة جا(π/6)، جتا(0.9). | الطالب: يطبق الخطوات على حاسبته.\n(10 د) حل مسألة: المعلم: يحل مثال 2 ص 22 (حساب ضلع في مثلث الراديان وحل مسائل في المثلث\nسؤال تحفيزي: «احسب جا 30 على الحاسبة، ثم احسب جا(π/6). لماذا قد تختلف النتيجتان على حاسبة زميلك؟» لإبراز أهمية وضع الحاسبة.", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n(5 د) التهيئة: المعلم: يعرض صورة دائرة ويطرح سؤال لف نصف القطر على المحيط، ويوضح هدف الحصة. | الطالب: يقدّر الإجابة ويتذكر قانون محيط الدائرة.\n(10 د) الاستكشاف: المعلم: يوزع على المجموعات دوائر كرتونية وخيوطًا بطول نصف القطر، ويطلب لف الخيط على المحيط ورسم الزاوية المركزية المقابلة. | الطالب: يلف الخيط ويرسم الزاوية ويقيسها بالمنقلة (≈ 57°) ويعد عدد مرات لف الخيط (≈ 6.28).\n(10 د) بناء المفهوم: المعلم: يعرض تعريف الراديان ص 20 ويستنتج مع الطلبة النتيجتين: قوس طوله نق يقابل 1 راديان، والمحيط يقابل 2π راديان، ومنه π راديان = 180°. | الطالب: يناقش ويسجل التعريف والنتيجتين في دفتره.\n(10 د) تطبيق تعاوني: المعلم: يطلب إكمال جدول الزوايا الخاصة (0°، 30°، 45°، 60°، 90°، 180°، 270°، 360°) بدلالة π. | الطالب: تكمل كل مجموعة الجدول وتعرضه على السبورة.\n(5 د) الغلق والتقويم: المعلم: يطرح أسئلة التقويم الختامي ويلخص الفكرة الرئيسة. | الطالب: يجيب فرديًا على السبورات الصغيرة.\nالمجموع: 40 دقيقة\n\nالحصة 2: التحويل بين الدرجات والراديان\n(5 د) التهيئة: المعلم: ينفذ لعبة «اسأل وأجب» على الزوايا الخاصة. | الطالب: يجيب بسرعة ويصحح لزملائه.\n(12 د) النمذجة: المعلم: يحل مثال 1 ص 21 بالطريقتين (التناسب، والضرب في π/180 أو 180/π) ويبرز متى نكتب الناتج بدلالة π. | الطالب: يتابع ويدوّن الطريقتين ويستنتج قاعدتي التحويل.\n(10 د) تطبيق تعاوني: المعلم: يوزع بطاقات مطابقة (زاوية بالدرجات ↔ قياسها بالراديان) على المجموعات. | الطالب: تطابق المجموعة البطاقات وتبرر مطابقتين أمام الصف.\n(8 د) تدريب فردي: المعلم: يكلف بحل تمارين 1-1: 1، 2، 3 (أ، ب) ص ⁦22–23⁩ ويتجول للمتابعة. | الطالب: يحل فرديًا ويقرب إلى 3 أرقام معنوية عند الحاجة.\n(5 د) التقويم الختامي: المعلم: يعرض أسئلة الختام ويغلق الحصة بقاعدتي التحويل. | الطالب: يجيب ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n(5 د) التهيئة: المعلم: يطرح سؤال الحاسبة ويستقبل تفسيرات الطلبة. | الطالب: يجرب على الحاسبة ويقارن النتائج.\n(8 د) النمذجة: المعلم: يوضح ضبط الحاسبة على RAD ص 22 ويحسب أمثلة جا(π/6)، جتا(0.9). | الطالب: يطبق الخطوات على حاسبته.\n(10 د) حل مسألة: المعلم: يحل مثال 2 ص 22 (حساب ضلع في مثلث زاويته 0.6 راديان) دون التحويل إلى الدرجات. | الطالب: يشارك في خطوات الحل ويكتبها.\n(9 د) تطبيق تعاوني: المعلم: يكلف المجموعات بحل تمارين 1-1: 6، 7 ص 23. | الطالب: تحل المجموعة وتعرض حلًا واحدًا.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس الراديان (5 أسئلة). | الطالب: تتنافس المجموعات وتجيب في الوقت المحدد.\nالمجموع: 40 دقيقة", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n1) [مستوى الدعم] ما قياس الزاوية المركزية التي تحصر قوسًا طوله يساوي طول نصف قطر الدائرة؟\nالإجابة النموذجية: 1 راديان.\n2) [المستوى المتوقع] اكتب قياس الزاوية 90° بدلالة π.\nالإجابة النموذجية: π/2\n3) [المستوى المتقدم] كم راديانًا تساوي الدورة الكاملة؟ ولماذا؟\nالإجابة النموذجية: 2π راديان؛ لأن المحيط 2π نق، أي إن المحيط يحوي 2π من أنصاف الأقطار.\n\nالحصة 2: التحويل بين الدرجات والراديان\n1) [مستوى الدعم] حوّل 60° إلى الراديان بدلالة π.\nالإجابة النموذجية: 60 × π/180 = π/3\n2) [المستوى المتوقع] حوّل 5π/9 إلى الدرجات.\nالإجابة النموذجية: 5π/9 × 180/π = 100°\n3) [المستوى المتقدم] حوّل 210° إلى الراديان بدلالة π.\nالإجابة النموذجية: 210 × π/180 = 7π/6\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n1) [مستوى الدعم] ما قيمة جا(π/6)؟\nالإجابة النموذجية: 0.5\n2) [المستوى المتوقع] أوجد جتا(0.9) مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 0.622\n3) [المستوى المتقدم] مثلث قائم الزاوية طول وتره 12 سم وإحدى زواياه 0.7 راديان. أوجد طول الضلع المقابل لهذه الزاوية.\nالإجابة النموذجية: 12 جا(0.7) ≈ 7.73 سم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n1) [مستوى الدعم] أكمل: π راديان = .......°\nالإجابة النموذجية: 180\n2) [المستوى المتوقع] حوّل 45° و 270° إلى الراديان بدلالة π.\nالإجابة النموذجية: 45° = π/4 ، 270° = 3π/2\n3) [المستوى المتقدم] هل الزاوية التي قياسها 1 راديان أكبر أم أصغر من 60°؟ برّر.\nالإجابة النموذجية: أصغر؛ لأن 1 راديان = 180/π ≈ 57.3° < 60°.\n\nالحصة 2: التحويل بين الدرجات والراديان\n1) [مستوى الدعم] حوّل π/6 إلى الدرجات.\nالإجابة النموذجية: 30°\n2) [المستوى المتوقع] حوّل 0.8 راديان إلى الدرجات مقربًا إلى أقرب منزلة عشرية.\nالإجابة النموذجية: 0.8 × 180/π ≈ 45.8°\n3) [المستوى المتقدم] حوّل 320° إلى الراديان مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 320 × π/180 ≈ 5.59 راديان\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n1) [مستوى الدعم] على أي وضع تُضبط الحاسبة لحساب جتا(1.2)؟\nالإجابة النموذجية: وضع الراديان RAD.\n2) [المستوى المتوقع] أوجد ظا(1.5) مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 14.1\n3) [المستوى المتقدم] مثلث قائم الزاوية طول الضلع المجاور لزاوية قياسها π/5 يساوي 8 سم. أوجد طول الضلع المقابل.\nالإجابة النموذجية: 8 ظا(π/5) ≈ 5.81 سم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nإرشاد للطالب: قراءة تعريف الراديان والنتيجتين 1 و 2 ص 20 من كتاب الطالب، وحفظ جدول الزوايا الخاصة ص 21.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التحويل بين الدرجات والراديان\nإرشاد للطالب: مراجعة مثال 1 ص 21، وحل تمارين 1-1 (3، 4، 5) ص 23 من كتاب الطالب، وتمارين 1-1 (1، 2) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nإرشاد للطالب: حل تمارين 1-1 (6، 8) ص 23 من كتاب الطالب، وتمارين 1-1 (⁦3–6⁩) ص ⁦14–16⁩ من كتاب النشاط، والتأكد من ضبط الحاسبة على الوضع المناسب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "2-1", "title": "طول القوس", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦24–27⁩", "wbp": "⁦17–19⁩", "p": [{"t": "القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يميّز بين القوس والوتر والقطاع الدائري والقطعة الدائرية (الصغرى والكبرى).\n2) يستنتج قانون طول القوس ل = نق × هـ عندما تُقاس هـ بالراديان، ويستخدمه.\nمخرج تعليمي آخر: يعبّر عن طول القوس بدلالة π.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم بالنمذجة", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "القوس الأصغر والأكبر، الوتر، القطاع الدائري، القطعة الدائرية، طول القوس ل = نق هـ", "ينفذ الطلبة استكشف 1 ص 24: مناقشة معاني الكلمات (قطعة دائرية، قطاع دائري، قوس، وتر) من خلال الشكل.", "(7 د) التهيئة (استكشف 1): المعلم: يعرض الشكل ص 24 ويدير نقاشًا حول المصطلحات. | الطالب: يشرح كل مصطلح بلغته ويشير إليه على الشكل.\n(10 د) الاكتشاف: المعلم: يقود الطلبة لاستنتاج أن طول القوس يتناسب مع الزاوية: زاوية 1 راديان ← قوس نق، فزاوية هـ ← قوس نق هـ. | الطالب: يستنتج القانون ويقارنه بقانون الدرجات (س/360) × 2π نق.\n(8 د) النمذجة: المعلم: يحل مثال 3 ص 25 (نق = 15 سم، هـ = π/3). | الطالب: يتابع ويكتب الحل بدلالة π.\n(10 د) تدريب تشاركي: المعلم: يكلف الأزواج بحل تمارين 2-1: 1 (أ–د) ص 26. | الطالب: يحل مع زميله ويتبادلان التصحيح.\n(5 د) الغلق: المعلم: يطرح أسئلة الختام ويلخص القانون وشرطه. | الطالب: يجيب فرديًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] في الشكل: ما الفرق بين القوس الأصغر والوتر الذي يحصره؟\nالإجابة النموذجية: القوس جزء من محيط الدائرة، والوتر قطعة مستقيمة تصل بين طرفي القوس.\n2) [المستوى المتوقع] أوجد طول القوس في دائرة نصف قطرها 8 سم يقابل زاوية مركزية π/4.\nالإجابة النموذجية: ل = 8 × π/4 = 2π سم\n3) [المستوى المتقدم] لماذا لا يصح القانون ل = نق هـ إذا كانت هـ بالدرجات؟ وما الصيغة المكافئة بالدرجات؟\nالإجابة النموذجية: لأن القانون مبني على تعريف الراديان؛ وبالدرجات: ل = (هـ/360) × 2π نق.", "1) [مستوى الدعم] أوجد طول القوس الذي يقابل زاوية مركزية 2 راديان في دائرة نصف قطرها 6 سم.\nالإجابة النموذجية: 12 سم\n2) [المستوى المتوقع] أوجد طول القوس بدلالة π: نق = 7 سم، هـ = π/3.\nالإجابة النموذجية: 7π/3 سم\n3) [المستوى المتقدم] أوجد طول القوس بدلالة π: نق = 24 سم، هـ = 7π/8.\nالإجابة النموذجية: 21π سم", "إرشاد للطالب: مراجعة استكشف 1 ومثال 3 ص ⁦24–25⁩، وحل تمارين 2 المستوى المتقدم] عجلة دوّارة قطرها 158.5 م دارت بزاوية π/16. أوجد المسافة التي يقطعها راكب على محيطها.\nالإجابة النموذجية: نق = 79.25 م، ل = 79.25 × π/16 ≈ 15.6 م", "إرشاد للطالب: حل تمارين 2-1 (5، 6) ص ⁦26–27⁩ من كتاب الطالب، وتمارين 2-1 (⁦1–4⁩) ص ⁦17–18⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يحسب طول الوتر باستخدام قانون جيب التمام أو النسب المثلثية مع الزوايا بالراديان.\n2) يحل مسائل تتضمن محيط مناطق مظللة مكوّنة من أقواس وقطع مستقيمة.\nمخرج تعليمي آخر: يبرهن علاقات هندسية تتضمن طول القوس.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "طول الوتر = 2نق جا(هـ/2)، المماس عمودي على نصف القطر، محيط القطعة الدائرية، المنطقة المظللة", "مراجعة قانوني الجيب وجيب التمام في المثلث، وخاصية المماس العمودي على نصف القطر عند نقطة التماس.", "(5 د) التهيئة: المعلم: يراجع القوانين المطلوبة بأسئلة شفوية. | الطالب: يتذكر القوانين ويكتبها.\n(10 د) النمذجة: المعلم: يحل مثال 5 ص ⁦25–26⁩ خطوة بخطوة، ويبرز تقسيم المثلث المتطابق الضلعين إلى مثلثين قائمين. | الطالب: يتابع ويقترح طريقة بديلة لإيجاد الوتر.\n(12 د) حل مشكلات تعاوني: المعلم: يوزع تمارين 2-1: 6، 7، 8 ص 27 على المجموعات. | الطالب: تحل كل مجموعة مسألة وتشرحها للصف.\n(5 د) تحدٍّ: المعلم: يعرض تمرين 9 ص 27 للطلبة المتقدمين. | الطالب: يحاول إثبات العلاقة المطلوبة.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس طول القوس. | الطالب: تتنافس المجموعات.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد طول القوس في دائرة نصف قطرها 7 سم يقابل زاوية 2 راديان.\nالإجابة النموذجية: 14 سم\n2) [المستوى المتوقع] أوجد طول الوتر المقابل للزاوية المركزية 2 راديان في الدائرة نفسها.\nالإجابة النموذجية: 2 × 7 × جا(1) م، هـ = π/3). | الطالب: يتابع ويكتب الحل بدلالة π.\n(10 د) تدريب تشاركي: المعلم: يكلف الأزواج بحل تمارين 2-1: 1 (أ–د) ص 26. | الطالب: يحل مع زميله ويتبادلان التصحيح.\n(5 د) الغلق: المعلم: يطرح أسئلة الختام ويلخص القانون وشرطه. | الطالب: يجيب فرديًا.\nالمجموع: 40 دقيقة\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\n(5 د) التهيئة: المعلم: يطرح السؤال ويوجه إلى إعادة ترتيب القانون. | الطالب: يجيب: هـ = 2 راديان.\n(10 د) النمذجة: المعلم: يحل مثال 4 ص 25 (إيجاد نق) ويناقش مكونات محيط القطاع (نصفا قطر + قوس). | الطالب: يتابع ويرسم القطاع ويحدد مكونات محيطه.\n(12 د) تطبيق تعاوني: المعلم: يكلف المجموعات بتمارين 2-1: 3، 4، 5 ص 26 (ومنها مسألة العجلة الدوارة). | الطالب: تحل المجموعة وتعرض مسألة العجلة الدوارة.\n(8 د) تدريب فردي: المعلم: يكلف بحل تمرين من كتاب النشاط تمارين 2-1 ص 17. | الطالب: يحل ويقارن بإجابة زميله.\n(5 د) التقويم الختامي: المعلم: يطرح أسئلة الختام. | الطالب: يجيب فرديًا.\nالمجموع: 40 دقيقة\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\n(5 د) التهيئة: المعلم: يراجع القوانين المطلوبة بأسئلة شفوية. | الطالب: يتذكر القوانين ويكتبها.\n(10 د) النمذجة: المعلم: يحل مثال 5 ص ⁦25–26⁩ خطوة بخطوة، ويبرز تقسيم المثلث المتطابق الضلعين إلى مثلثين قائمين. | الطالب: يتابع ويقترح طريقة بديلة لإيجاد الوتر.\n(12 د) حل مشكلات تعاوني: المعلم: يوزع تمارين 2-1: 6، 7، 8 ص 27 على المجموعات. | الطالب: تحل كل مجموعة مسألة وتشرحها للصف.\n(5 د) تحدٍّ: المعلم: يعرض تمرين 9 ص 27 للطلبة المتقدمين. | الطالب: يحاول إثبات العلاقة المطلوبة.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس طول القوس. | الطالب: تتنافس المجموعات.\nالمجموع: 40 دقيقة", "الحصة 1: القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس\n1) [مستوى الدعم] في الشكل: ما الفرق بين القوس الأصغر والوتر الذي يحصره؟\nالإجابة النموذجية: القوس جزء من محيط الدائرة، والوتر قطعة مستقيمة تصل بين طرفي القوس.\n2) [المستوى المتوقع] أوجد طول القوس في دائرة نصف قطرها 8 سم يقابل زاوية مركزية π/4.\nالإجابة النموذجية: ل = 8 × π/4 = 2π سم\n3) [المستوى المتقدم] لماذا لا يصح القانون ل = نق هـ إذا كانت هـ بالدرجات؟ وما الصيغة المكافئة بالدرجات؟\nالإجابة النموذجية: لأن القانون مبني على تعريف الراديان؛ وبالدرجات: ل = (هـ/360) × 2π نق.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\n1) [مستوى الدعم] قطاع دائري طول قوسه 12 سم وقياس زاويته 1.5 راديان. أوجد نصف القطر.\nالإجابة النموذجية: نق = 12 ÷ 1.5 = 8 سم\n2) [المستوى المتوقع] أوجد قياس زاوية القطاع بالراديان إذا كان نق = 10 سم وطول القوس 5 سم.\nالإجابة النموذجية: هـ = 5/10 = 0.5 راديان\n3) [المستوى المتقدم] أوجد محيط قطاع دائري نصف قطره 5 سم وقياس زاويته 1.2 راديان.\nالإجابة النموذجية: 2(5) + 5(1.2) = 16 سم\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\n1) [مستوى الدعم] أوجد طول القوس في دائرة نصف قطرها 7 سم يقابل زاوية 2 راديان.\nالإجابة النموذجية: 14 سم\n2) [المستوى المتوقع] أوجد طول الوتر المقابل للزاوية المركزية 2 راديان في الدائرة نفسها.\nالإجابة النموذجية: 2 × 7 × جا(1) ≈ 11.78 سم\n3) [المستوى المتقدم] أوجد محيط القطعة الدائرية الصغرى المحصورة بين القوس والوتر السابقين.\nالإجابة النموذجية: 14 + 11.78 ≈ 25.78 سم", "الحصة 1: القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس\n1) [مستوى الدعم] أوجد طول القوس الذي يقابل زاوية مركزية 2 راديان في دائرة نصف قطرها 6 سم.\nالإجابة النموذجية: 12 سم\n2) [المستوى المتوقع] أوجد طول القوس بدلالة π: نق = 7 سم، هـ = π/3.\nالإجابة النموذجية: 7π/3 سم\n3) [المستوى المتقدم] أوجد طول القوس بدلالة π: نق = 24 سم، هـ = 7π/8.\nالإجابة النموذجية: 21π سم\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\n1) [مستوى الدعم] أوجد طول القوس: نق = 10 سم، هـ = 1.3 راديان.\nالإجابة النموذجية: 13 سم\n2) [المستوى المتوقع] نق = 12 سم، طول القوس 9.6 سم. أوجد هـ.\nالإجابة النموذجية: 0.8 راديان\n3) [المستوى المتقدم] عجلة دوّارة قطرها 158.5 م دارت بزاوية π/16. أوجد المسافة التي يقطعها راكب على محيطها.\nالإجابة النموذجية: نق = 79.25 م، ل = 79.25 × π/16 ≈ 15.6 م\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\n1) [مستوى الدعم] نق = 6 سم، هـ = π/2. أوجد طول القوس.\nالإجابة النموذجية: 3π ≈ 9.42 سم\n2) [المستوى المتوقع] أوجد طول الوتر المقابل لهذه الزاوية.\nالإجابة النموذجية: 6√2 ≈ 8.49 سم\n3) [المستوى المتقدم] أوجد محيط القطعة الدائرية الصغرى.\nالإجابة النموذجية: 3π + 6√2 ≈ 17.91 سم", "الحصة 1: القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس\nإرشاد للطالب: مراجعة استكشف 1 ومثال 3 ص ⁦24–25⁩، وحل تمارين 2-1 (1، 2) ص 26 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\nإرشاد للطالب: حل تمارين 2-1 (5، 6) ص ⁦26–27⁩ من كتاب الطالب، وتمارين 2-1 (⁦1–4⁩) ص ⁦17–18⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\nإرشاد للطالب: حل تمارين 2-1 (7، 8، 9) ص 27 من كتاب الطالب، وتمارين 2-1 (⁦5–9⁩) ص ⁦18–19⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "3-1", "title": "مساحة القطاع الدائري", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦28–36⁩", "wbp": "⁦20–28⁩", "p": [{"t": "استنتاج قانون مساحة القطاع الدائري", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يستنتج قانون مساحة القطاع الدائري م = ½ نق² هـ باستخدام التناسب.\n2) يحسب مساحة القطاع الدائري بدلالة π أو بقيمة تقريبية.\nمخرج تعليمي آخر: يقارن بين صيغتي المساحة بالدرجات وبالراديان.", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "القطاع الدائري، مساحة القطاع = ½ نق² هـ، التناسب، مساحة الدائرة", "سؤال: «ما مساحة نصف دائرة نصف قطرها 4 سم؟ وربعها؟» ثم «ما مساحة قطاع زاويته π/3 في الدائرة نفسها؟» لربط الجزء بالكل.", "(5 د) التهيئة: المعلم: يطرح أسئلة أجزاء الدائرة. | الطالب: يحسب مساحة النصف والربع ويقترح طريقة للقطاع.\n(10 د) الاكتشاف: المعلم: يقود الطلبة لكتابة التناسب: زاوية القطاع/2π = مساحة القطاع/π نق²، ثم يبسطها إلى ½ نق² هـ. | الطالب: يستنتج القانون ويكتب النتيجة 5 ص 28.\n(8 د) استكشف 2: المعلم: ينفذ استكشف 2 ص 28 بالدرجات ثم يقارن بالقانون الجديد. | الطالب: يكتب عبارة لمساحة القطاع الأصغر بدلالة نق، س.\n(12 د) النمذجة والتدريب: المعلم: يحل مثال 6 ص 28 ويكلف بتمارين 3-1: 1 ص 31. | الطالب: يحل في أزواج ويقارن.\n(5 د) الغلق: المعلم: أسئلة الختام وتلخيص القانون. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أكمل: مساحة القطاع الدائري = ........ (هـ بالراديان)\nالإجابة النموذجية: ½ نق² هـ\n2) [المستوى المتوقع] أوجد بدلالة π مساحة قطاع زاويته π/6 في دائرة نصف قطرها 9 سم.\nالإجابة النموذجية: ½ × 81 × π/6 = 27π/4 سم²\n3) [المستوى المتقدم] بيّن أن قانون مساحة القطاع يعطي مساحة الدائرة عندما هـ = 2π.\nالإجابة النموذجية: ½ نق² × 2π = π نق²", "1) [مستوى الدعم] أوجد مساحة قطاع: نق = 4 سم، هـ = 2 راديان.\nالإجابة النموذجية: 16 سم²\n2) [المستوى المتوقع] أوجد بدلالة π مساحة قطاع: نق = 12 سم، هـ = 5π/6.\nالإجابة النموذجية: 60π سم²\n3) [المستوى المتقدم] قطاعان في الدائرة نفسها، زاوية الأول ضعف زاوية الثاني. ما النسبة بين مساحتيهما؟ برّر.\nالإجابة النموذجية: 2 : 1؛ لأن المساحة تتناسب طرديًا مع هـ عند ثبوت نق.", "إرشاد للطالب: قراءة النتيجة 5 ومثال 6 ص 28، وحل تمارين 3-1 (1) ص 31 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يجد نصف القطر أو قياس الزاوية بمعلومية مساحة القطاع الدائري.\n2) يربط بين طول القوس ومساحة القطاع في مسألة واحدة.\nمخرج تعليمي آخر: يستنتج العلاقة م = ½ نق ل.", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام", "مساحة القطاع، طول القوس، الزاوية المركزية، نصف القطر", "مراجعة سريعة: «قطاع مساحته 12 سم² ونصف قطره 4 سم، كيف نجد زاويته؟»", "(5 د) التهيئة: المعلم: يطرح السؤال ويوجه ل  الوحدة الأولى (كتاب الطالب)", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يراجع مفاهيم الوحدة (الراديان، طول القوس، مساحة القطاع) من خلال قائمة التحقق ص 34.\n2) يحل مسائل مراجعة متنوعة تجمع مهارات الوحدة.\nمخرج تعليمي آخر: يقيّم مستوى تمكنه من مهارات الوحدة ذاتيًا.", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، أخرى: بطاقات عمل", "الراديان، طول القوس، مساحة القطاع، القطعة الدائرية، المنطقة المظللة", "نشاط «قائمة التحقق» ص 34: يقيّم كل طالب نفسه في كل مهارة (أستطيع / أحتاج إلى مراجعة).", "(5 د) التهيئة: المعلم: يوزع قائمة التحقق ويطلب التقييم الذاتي. | الطالب: يقيّم نفسه ويحدد المهارات التي يحتاج إليها.\n(8 د) مراجعة مركزة: المعلم: يلخص قوانين الوحدة بخريطة مفاهيم على السبورة. | الطالب: يكمل الخريطة مع المعلم.\n(17 د) تعاوني (مجموعات متجانسة): المعلم: يوزع تمارين المراجعة ص ⁦35–36⁩ حسب المستوى: (1، 2، 3) للدعم، (4، 5، 6) للمتوقع، (7، 8، 9) للمتقدم. | الطالب: تحل كل مجموعة تمارينها وتقدم حلًا نموذجيًا.\n(5 د) مناقشة: المعلم: يناقش الأخطاء الشائعة (استخدام الدرجات في القانون، نسيان نصفي القطر في المحيط). | الطالب: يصحح أخطاءه.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حوّل 135° إلى الراديان بدلالة π.\nالإجابة النموذجية: 3π/4\n2) [المستوى المتوقع] قطاع نصف قطره 9 سم وزاويته 2π/3. أوجد طول قوسه ومساحته بدلالة π.\nالإجابة النموذجية: ل = 6π سم، م = 27π سم²\n3) [المستوى المتقدم] سلك طوله 24 سم شُكّل منه قطاع دائري نصف قطره نق. بيّن أن مساحته م = 12نق − نق².\nالإجابة النموذجية: ل = 24 − 2نق، م = ½ نق ل = 12نق − نق²", "1) [مستوى الدعم] حوّل 7π/4 إلى الدرجات.\nالإجابة النموذجية: 315°\n2) [المستوى المتوقع] قطاع زاويته 1.4 راديان ومساحته 70 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 100 ← نق = 10 سم\n3) [المستوى المتقدم] في المسألة السابقة (السلك 24 سم)، أوجد أكبر مساحة ممكنة للقطاع.\nالإجابة النموذجية: م = 36 − (نق − 6)² ← أكبر مساحة 36 سم² عند نق = 6", "إرشاد للطالب: حل تمارين مراج ل منهما على محيط الأخرى. ما قياس الزاوية المركزية للقوس المشترك في كل دائرة؟\nالإجابة النموذجية: 2π/3", "إرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الأولى ص ⁦26–28⁩ من كتاب النشاط، والاستعداد لاختبار قصير في الوحدة الأولى.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}], "c": ["الحصة 1: استنتاج قانون مساحة القطاع الدائري\n1) يستنتج قانون مساحة القطاع الدائري م = ½ نق² هـ باستخدام التناسب.\n2) يحسب مساحة القطاع الدائري بدلالة π أو بقيمة تقريبية.\nمخرج تعليمي آخر: يقارن بين صيغتي المساحة بالدرجات وبالراديان.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\n1) يجد نصف القطر أو قياس الزاوية بمعلومية مساحة القطاع الدائري.\n2) يربط بين طول القوس ومساحة القطاع في مسألة واحدة.\nمخرج تعليمي آخر: يستنتج العلاقة م = ½ نق ل.\n\nالحصة 3: مساحة القطعة الدائرية\n1) يحسب مساحة المثلث المحصور بين نصفي القطر والوتر باستخدام ½ أ ب جا ج.\n2) يحسب مساحة القطعة الدائرية الصغرى والكبرى.\nمخرج تعليمي آخر: يستنتج صيغة مختصرة لمساحة القطعة الدائرية.\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\n1) يحلل المنطقة المظللة إلى أجزاء (قطاعات، مثلثات، قطع دائرية) لحساب محيطها ومساحتها.\n2) يعبر عن المحيط والمساحة بدلالة نق أو π في صورة مبسطة.\nمخرج تعليمي آخر: يقترح أكثر من طريقة لتقسيم المنطقة المظللة ويقارن بينها.\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n1) يراجع مفاهيم الوحدة (الراديان، طول القوس، مساحة القطاع) من خلال قائمة التحقق ص 34.\n2) يحل مسائل مراجعة متنوعة تجمع مهارات الوحدة.\nمخرج تعليمي آخر: يقيّم مستوى تمكنه من مهارات الوحدة ذاتيًا.\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n1) يطبق مهارات الوحدة الأولى في حل تمارين كتاب النشاط.\n2) يحل مسائل تتطلب الربط بين القياس الدائري والمثلثات.\nمخرج تعليمي آخر: يتعاون مع زملائه في التنافس العلمي ويحترم دوره.", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\nالمخرج 1: تطبيق\nالمخرج 2: الغلق: المعلم: أسئلة الختام وتلخيص القانون. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\n(5 د) التهيئة: المعلم: يطرح السؤال ويوجه لإعادة ترتيب القانون. | الطالب: يجد هـ = 1.5 راديان.\n(10 د) النمذجة: المعلم: يحل تمرين 3-1: 3 (أ) و 4 ص 32 مع الطلبة، ويبرز العلاقة م = ½ نق × ل. | الطالب: يتابع ويستنتج العلاقة بين المساحة وطول القوس.\n(13 د) تعاوني: المعلم: يكلف المجموعات بتمارين 3-1: 2، 3 (ب) ص ⁦31–32⁩. | الطالب: تحل المجموعات وتتبادل الحلول للتصحيح.\n(7 د) تعلم ذاتي: المعلم: يكلف بحل تمارين 3-1 (1، 2) من كتاب النشاط ص 20. | الطالب: يحل ذاتيًا ويستعين بالأمثلة.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 3: مساحة القطعة الدائرية\n(5 د) التهيئة: المعلم: يعرض الصورة ويستقبل الأفكار. | الطالب: يقترح: مساحة القطاع − مساحة المثلث.\n(12 د) النمذجة: المعلم: يحل مثال 7 ص 29 (نق = 6، هـ = 1.2) لجميع المطلوب، ويستنتج القانون المختصر للقطعة. | الطالب: يحسب الخطوات على الحاسبة في وضع الراديان.\n(10 د) تعاوني: المعلم: يكلف المجموعات بتمارين 3-1: 5، 6 ص 32. | الطالب: تحل وتعرض.\n(8 د) تدريب فردي: المعلم: يكلف بتمارين 3-1 (4، 5) من كتاب النشاط ص 21. | الطالب: يحل فرديًا.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\n(5 د) التهيئة: المعلم: يعرض الشكل ويطلب تحليل المنطقة. | الطالب: يقترح التقسيم إلى قطعتين دائريتين.\n(10 د) النمذجة: المعلم: يحل مثال 8 ص 30 ثم يناقش فكرة مثال 9 ص 31 (الزاوية π/2 − ...). | الطالب: يتابع ويكتب الحل.\n(15 د) حل مشكلات تعاوني: المعلم: يوزع تمارين 3-1: 7، 8، 9، 10 ص ⁦32–33⁩ على المجموعات (تمرين لكل مجموعة). | الطالب: تحل المجموعة وتعد عرضًا قصيرًا للحل.\n(5 د) عرض تشاركي: المعلم: يدير عرض الحلول ويصوب الأخطاء. | الطالب: تعرض كل مجموعة خطوات حلها.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n(5 د) التهيئة: المعلم: يوزع قائمة التحقق ويطلب التقييم الذاتي. | الطالب: يقيّم نفسه ويحدد المهارات التي يحتاج إليها.\n(8 د) مراجعة مركزة: المعلم: يلخص قوانين الوحدة بخريطة مفاهيم على السبورة. | الطالب: يكمل الخريطة مع المعلم.\n(17 د) تعاوني (مجموعات متجانسة): المعلم: يوزع تمارين المراجعة ص ⁦35–36⁩ حسب المستوى: (1، 2، 3) للدعم، (4، 5، 6) للمتوقع، (7، 8، 9) للمتقدم. | الطالب: تحل كل مجموعة تمارينها وتقدم حلًا نموذجيًا.\n(5 د) مناقشة: المعلم: يناقش الأخطاء الشائعة (استخدام الدرجات في القانون، نسيان نصفي القطر في المحيط). | الطالب: يصحح أخطاءه.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n(5 د) التهيئة: المعلم: يعرض سؤال «صحح الخطأ». | الطالب: يكتشف الخطأ: يجب التحويل إلى π/3 فيكون ل = π سم.\n(20 د) تدريب كتاب النشاط: المعلم: يكلف المجموعات بتمارين مراجعة نهاية الوحدة الأولى ص ⁦23–26⁩ من كتاب النشاط مع متابعة فردية للطلبة المحتاجين. | الطالب: يحل ويناقش مع مجموعته.\n(5 د) تصويب: المعلم: يعرض الحلول النموذجية لأبرز التمارين. | الطالب: يصحح ذاتيًا.\n(10 د) مسابقة المجموعات: المعلم: يدير مسابقة المجموعات (10 أسئلة) على الوحدة الأولى. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\n1) [مستوى الدعم] أكمل: مساحة القطاع الدائري = ........ (هـ بالراديان)\nالإجابة النموذجية: ½ نق² هـ\n2) [المستوى المتوقع] أوجد بدلالة π مساحة قطاع زاويته π/6 في دائرة نصف قطرها 9 سم.\nالإجابة النموذجية: ½ × 81 × π/6 = 27π/4 سم²\n3) [المستوى المتقدم] بيّن أن قانون مساحة القطاع يعطي مساحة الدائرة عندما هـ = 2π.\nالإجابة النموذجية: ½ نق² × 2π = π نق²\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\n1) [مستوى الدعم] قطاع دائري نصف قطره 4 سم ومساحته 9 سم². أوجد زاويته.\nالإجابة النموذجية: هـ = 2م/نق² = 18/16 = 1.125 راديان\n2) [المستوى المتوقع] قطاع دائري زاويته 0.5 راديان ومساحته 25 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 2 × 25 ÷ 0.5 = 100 ← نق = 10 سم\n3) [المستوى المتقدم] قطاع نصف قطره 8 سم وطول قوسه 10 سم. أوجد زاويته ومساحته.\nالإجابة النموذجية: هـ = 1.25 راديان، م = ½ × 64 × 1.25 = 40 سم²\n\nالحصة 3: مساحة القطعة الدائرية\n1) [مستوى الدعم] أوجد مساحة المثلث المحصور بين نصفي قطرين طول كل منهما 6 سم والزاوية بينهما 1.2 راديان.\nالإجابة النموذجية: ½ × 36 × جا 1.2 ≈ 16.8 سم²\n2) [المستوى المتوقع] أوجد مساحة القطعة الدائرية الصغرى المقابلة لتلك الزاوية.\nالإجابة النموذجية: 21.6 − 16.8 = 4.8 سم²\n3) [المستوى المتقدم] أوجد مساحة القطعة الدائرية الكبرى في الدائرة نفسها.\nالإجابة النموذجية: π × 36 − 4.8 ≈ 108.3 سم²\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\n1) [مستوى الدعم] مربع طول ضلعه نق رُسم بداخله قوسان من مركزين في رأسين متقابلين. ما مكونات محيط المنطقة المظللة بينهما؟\nالإجابة النموذجية: قوسان، كل منهما ربع دائرة نصف قطرها نق.\n2) [المستوى المتوقع] أوجد محيط المنطقة المظللة السابقة بدلالة نق.\nالإجابة النموذجية: 2 × (نق × π/2) = π نق\n3) [المستوى المتقدم] أوجد مساحة المنطقة المظللة السابقة بدلالة نق.\nالإجابة النموذجية: 2(¼ π نق² − ½ نق²) = نق²(π/2 − 1)\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n1) [مستوى الدعم] حوّل 135° إلى الراديان بدلالة π.\nالإجابة النموذجية: 3π/4\n2) [المستوى المتوقع] قطاع نصف قطره 9 سم وزاويته 2π/3. أوجد طول قوسه ومساحته بدلالة π.\nالإجابة النموذجية: ل = 6π سم، م = 27π سم²\n3) [المستوى المتقدم] سلك طوله 24 سم شُكّل منه قطاع دائري نصف قطره نق. بيّن أن مساحته م = 12نق − نق².\nالإجابة النموذجية: ل = 24 − 2نق، م = ½ نق ل = 12نق − نق²\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n1) [مستوى الدعم] ما طول القوس المقابل لزاوية 60° في دائرة نصف قطرها 3 سم؟\nالإجابة النموذجية: π سم\n2) [المستوى المتوقع] أوجد مساحة قطاع نصف قطره 5 سم وطول قوسه 8 سم.\nالإجابة النموذجية: 20 سم²\n3) [المستوى المتقدم] قطاع محيطه ضعف نصف قطره مضافًا إليه π نق/2. ما قياس زاويته؟\nالإجابة النموذجية: ل = π نق/2 ← هـ = π/2", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\n1) [مستوى الدعم] أوجد مساحة قطاع: نق = 4 سم، هـ = 2 راديان.\nالإجابة النموذجية: 16 سم²\n2) [المستوى المتوقع] أوجد بدلالة π مساحة قطاع: نق = 12 سم، هـ = 5π/6.\nالإجابة النموذجية: 60π سم²\n3) [المستوى المتقدم] قطاعان في الدائرة نفسها، زاوية الأول ضعف زاوية الثاني. ما النسبة بين مساحتيهما؟ برّر.\nالإجابة النموذجية: 2 : 1؛ لأن المساحة تتناسب طرديًا مع هـ عند ثبوت نق.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\n1) [مستوى الدعم] قطاع نصف قطره 6 سم ومساحته 27 سم². أوجد زاويته.\nالإجابة النموذجية: 1.5 راديان\n2) [المستوى المتوقع] أوجد مساحة قطاع نصف قطره 10 سم وطول قوسه 7 سم.\nالإجابة النموذجية: م = ½ × 10 × 7 = 35 سم²\n3) [المستوى المتقدم] قطاع محيطه 20 سم ونصف قطره 5 سم. أوجد مساحته.\nالإجابة النموذجية: ل = 20 − 10 = 10، م = ½ × 5 × 10 = 25 سم²\n\nالحصة 3: مساحة القطعة الدائرية\n1) [مستوى الدعم] أوجد مساحة القطاع: نق = 10 سم، هـ = π/2.\nالإجابة النموذجية: 25π ≈ 78.5 سم²\n2) [المستوى المتوقع] أوجد مساحة القطعة الصغرى في القطاع السابق.\nالإجابة النموذجية: 25π − 50 ≈ 28.5 سم²\n3) [المستوى المتقدم] بيّن أن مساحة القطعة الدائرية = ½ نق²(هـ − جا هـ).\nالإجابة النموذجية: ½ نق² هـ − ½ نق² جا هـ = ½ نق²(هـ − جا هـ)\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\n1) [مستوى الدعم] دائرة نصف قطرها 1 داخل مربع تمس أضلاعه. أوجد المساحة داخل المربع وخارج الدائرة.\nالإجابة النموذجية: 4 − π\n2) [المستوى المتوقع] قطاع نصف قطره 8 سم وزاويته π/3. أوجد مساحة القطعة الصغرى بدلالة π و √3.\nالإجابة النموذجية: 32π/3 − 16√3 سم²\n3) [المستوى المتقدم] مثلث متطابق الأضلاع طول ضلعه 6 سم رسم قوس من أحد رؤوسه نصف قطره 6 سم. أوجد مساحة القطعة المحصورة بين القوس والضلع المقابل.\nالإجابة النموذجية: 6π − 9√3 ≈ 3.26 سم²\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n1) [مستوى الدعم] حوّل 7π/4 إلى الدرجات.\nالإجابة النموذجية: 315°\n2) [المستوى المتوقع] قطاع زاويته 1.4 راديان ومساحته 70 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 100 ← نق = 10 سم\n3) [المستوى المتقدم] في المسألة السابقة (السلك 24 سم)، أوجد أكبر مساحة ممكنة للقطاع.\nالإجابة النموذجية: م = 36 − (نق − 6)² ← أكبر مساحة 36 سم² عند نق = 6\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n1) [مستوى الدعم] حوّل 2.5 راديان إلى الدرجات (أقرب درجة).\nالإجابة النموذجية: 143°\n2) [المستوى المتوقع] أوجد مساحة قطعة دائرية صغرى: نق = 4 سم، هـ = π/3.\nالإجابة النموذجية: 8π/3 − 4√3 ≈ 1.45 سم²\n3) [المستوى المتقدم] دائرتان نصف قطر كل منهما نق ومركز كل منهما على محيط الأخرى. ما قياس الزاوية المركزية للقوس المشترك في كل دائرة؟\nالإجابة النموذجية: 2π/3", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\nإرشاد للطالب: قراءة النتيجة 5 ومثال 6 ص 28، وحل تمارين 3-1 (1) ص 31 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\nإرشاد للطالب: حل تمارين 3-1 (3، 4) ص 32 من كتاب الطالب، وتمارين 3-1 (⁦1–3⁩) ص 20 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مساحة القطعة الدائرية\nإرشاد للطالب: مراجعة مثال 7 ص 29، وحل تمارين 3-1 (5، 6) ص 32 من كتاب الطالب، وتمارين 3-1 (⁦4–6⁩) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦30–31⁩، وحل تمارين 3-1 (11، 12، 13) ص 33 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الأولى (⁦1–6⁩) ص ⁦35–36⁩ من كتاب الطالب، ومراجعة قائمة التحقق ص 34.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\nإرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الأولى ص ⁦26–28⁩ من كتاب النشاط، والاستعداد لاختبار قصير في الوحدة الأولى.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "1-2", "title": "الزوايا بين 0° و 90°", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦ 5 ← 1 − 4/5 = 1/5", "إرشاد للطالب: مراجعة مثال 1 ص 39، وحل تمارين 1-2 (1، 2) ص 41 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "القيم الدقيقة للنسب المثلثية للزوايا الخاصة", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يستنتج القيم الدقيقة لـ جا وجتا وظا للزوايا 30° و 45° و 60° من المثلثين الخاصين.\n2) يتذكر القيم الدقيقة للزوايا 0° و 90° وما يكافئها بالراديان.\nمخرج تعليمي آخر: يكوّن جدولًا منظمًا للقيم الدقيقة بالدرجات والراديان.", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: إبداع", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات عمل", "المثلث 30°–60°–90°، المثلث 45°–45°–90°، القيم الدقيقة، π/6، π/4، π/3، π/2", "يرسم الطلبة مثلثًا متطابق الأضلاع طول ضلعه 2 ومربعًا طول ضلعه 1، ويطلب المعلم رسم ارتفاع المثلث وقطر المربع.", "(5 د) التهيئة: المعلم: يوجه لرسم الشكلين وتقسيمهما. | الطالب: يرسم ويحسب الارتفاع √3 والقطر √2.\n(12 د) الاكتشاف: المعلم: يقود الطلبة لاستنتاج القيم الدقيقة من المثلثين وإكمال جدول الزوايا الخاصة بالدرجات والراديان ص 40. | الطالب: يستنتج القيم ويكمل الجدول.\n(10 د) لعبة البطاقات: المعلم: يوزع بطاقات (زاوية / نسبة / قيمة) لمطابقتها بين المجموعات. | الطالب: تطابق المجموعات البطاقات وتتسابق.\n(8 د) تطبيق: المعلم: يكلف بتمارين 1-2: 4 (أ، ب، ج) ص 41. | الطالب: يحسب القيم الدقيقة.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما القيمة الدقيقة لـ جا 30°؟\nالإجابة النموذجية: 1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة لـ ظا(π/3).\nالإجابة النموذجية: √3\n3) [المستوى المتقدم] بيّن أن جا 45° = جتا 45° باستخدام المثلث الخاص.\nالإجابة النموذجية: في المثلث 45°–45°–90° الضلعان متساويان (1، 1) والوتر √2، فكل منهما = 1/√2 = √2/2", "1) [مستوى الدعم] أكمل: جتا 60° = ......\nالإجابة النموذجية: 1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة: جا 30° × جتا 60°.\nالإجابة النموذجية: 1/2 × 1/2 = 1/4\n3) [المستوى المتقدم] أوجد القيمة الدقيقة: جا² 30° + جتا² 30°. ماذا تلاحظ؟\nالإجابة النموذجية: 1/4 + 3/4 = 1؛ المجموع يساوي 1", "إرشاد للطالب: حفظ جدول القيم الدقيقة للزوايا الخاصة ص 40، وحل تمارين 1-2 (4) ص 41 من كتاب الطالب، وتمارين 1-2 (⁦1–3⁩) ص ⁦29–30⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "إيجاد القيم الدقيقة لعبارات مثلثية", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يجد القيمة الدقيقة لعبارات تتضمن نسبًا مثلثية لزوايا خاصة بالدرجات أو بالراديان.\n2) يبسط العبارات الناتجة ويُنطق مقاماتها.\nمخرج تعليمي آخر: يقيّم صحة حلول زملائه في المسابقة ويبرر.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "القيمة الدقيقة، إنطاق المقام، جا² هـ = (جا هـ)²، الزوايا الخاصة بالراديان", "سؤال: «ما الفرق بين جا² 60° و جا 60²؟» لإبراز معنى الأس على النسبة المثلثية.", "(5 د) التهيئة: المعلم: يطرح السؤال ويناقش الرمز جا² هـ. | الطالب: يميز بين التعبيرين.\n(10 د) النمذجة: المعلم: يحل مثال 2 ص ⁦40–41⁩ (جا²(π/3)، وعبارة بمقام يحتاج إلى إنطاق). | الطالب: يتابع الخطوات ويدونها.\n(10 د) تعاوني: المعلم: يكلف بتمارين 1-2: 4 (د، هـ، و) و 5 ص ⁦41–42⁩. | الطالب: تحل المجموعات وتتبادل التصحيح.\n(7 د) تحدٍّ: المعلم: يعرض تمرين 6 ص 42 على الطلبة المتقدمين ويدعم الآخرين بتمارين كتاب النشاط ص 31. | الطالب: يحل حسب مستواه.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس الزوايا بين 0° و 90°. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد القيمة الدقيقة: جا² 45°.\nالإجابة النموذجية: 1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة: جا 60° جتا 30° + جتا 60° جا 30°.\nالإجابة النموذجية: 3/4 + 1/4 = 1\n3) [المستوى المتقدم] أوجد القيمة الدقيقة: 1 ÷ (1 + ظا(π/6)) في أبسط صورة بمقام نسبي.\nالإجابة النموذجية: 1/(1 + 1/√3) = √3/(√3 + 1) = (3 − √3)/2", "1) [مستوى الدعم] أوجد القيمة الدقيقة: ظا 45° + جتا 0°.\nالإجابة النموذجية: 2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة: ظا²(π/3) − 2جا²(π/4).\nالإجابة النموذجية: 3 − 1 = 2\n3) [المستوى المتقدم] أوجد القيمة الدقيقة: جا(π/3) ÷ جتا(π/4).\nالإجابة النموذجية: (√3/2) ÷ (√2/2) = √3/√2 = √6/2", "إرشاد للطالب: حل تمارين 1-2 (5، 6) ص 42 من كتاب الطالب، وتمارين 1-2 (⁦4–8⁩) ص ⁦31–32⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}], "c": ["الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\n1) يعبر عن جا هـ وجتا هـ وظا هـ بأطوال أضلاع المثلث القائم الزاوية.\n2) يجد القيم الدقيقة لبقية النسب المثلثية لزاوية حادة بمعلومية إحداها باستخدام نظرية فيثاغورث.\nمخرج تعليمي آخر: يُنطق المقام عند كتابة القيمة الدقيقة.\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\n1) يستنتج القيم الدقيقة لـ جا وجتا وظا للزوايا 30° و 45° و 60° من المثلثين الخاصين.\n2) يتذكر القيم الدقيقة للزوايا 0° و 90° وما يكافئها بالراديان.\nمخرج تعليمي آخر: يكوّن جدولًا منظمًا للقيم الدقيقة بالدرجات والراديان.\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n1) يجد القيمة الدقيقة لعبارات تتضمن نسبًا مثلثية لزوايا خاصة بالدرجات أو بالراديان.\n2) يبسط العبارات الناتجة ويُنطق مقاماتها.\nمخرج تعليمي آخر: يقيّم صحة حلول زملائه في المسابقة ويبرر.", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nالمخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: إبداع\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nالتعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الحصة 1: النسب المثلثية في المثلث ال  المعلم: يقود الطلبة لاستنتاج القيم الدقيقة من المثلثين وإكمال جدول الزوايا الخاصة بالدرجات والراديان ص 40. | الطالب: يستنتج القيم ويكمل الجدول.\n(10 د) لعبة البطاقات: المعلم: يوزع بطاقات (زاوية / نسبة / قيمة) لمطابقتها بين المجموعات. | الطالب: تطابق المجموعات البطاقات وتتسابق.\n(8 د) تطبيق: المعلم: يكلف بتمارين 1-2: 4 (أ، ب، ج) ص 41. | الطالب: يحسب القيم الدقيقة.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n(5 د) التهيئة: المعلم: يطرح السؤال ويناقش الرمز جا² هـ. | الطالب: يميز بين التعبيرين.\n(10 د) النمذجة: المعلم: يحل مثال 2 ص ⁦40–41⁩ (جا²(π/3)، وعبارة بمقام يحتاج إلى إنطاق). | الطالب: يتابع الخطوات ويدونها.\n(10 د) تعاوني: المعلم: يكلف بتمارين 1-2: 4 (د، هـ، و) و 5 ص ⁦41–42⁩. | الطالب: تحل المجموعات وتتبادل التصحيح.\n(7 د) تحدٍّ: المعلم: يعرض تمرين 6 ص 42 على الطلبة المتقدمين ويدعم الآخرين بتمارين كتاب النشاط ص 31. | الطالب: يحل حسب مستواه.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس الزوايا بين 0° و 90°. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\n1) [مستوى الدعم] في مثلث قائم الزاوية: المقابل للزاوية هـ = 3، المجاور = 4، الوتر = 5. أوجد جا هـ.\nالإجابة النموذجية: 3/5\n2) [المستوى المتوقع] إذا كان جا هـ = 5/13 وهـ حادة، أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: جتا هـ = 12/13، ظا هـ = 5/12\n3) [المستوى المتقدم] إذا كان ظا هـ = 2 وهـ حادة، أوجد القيمتين الدقيقتين لـ جا هـ وجتا هـ.\nالإجابة النموذجية: جا هـ = 2/√5 = 2√5/5، جتا هـ = 1/√5 = √5/5\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\n1) [مستوى الدعم] ما القيمة الدقيقة لـ جا 30°؟\nالإجابة النموذجية: 1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة لـ ظا(π/3).\nالإجابة النموذجية: √3\n3) [المستوى المتقدم] بيّن أن جا 45° = جتا 45° باستخدام المثلث الخاص.\nالإجابة النموذجية: في المثلث 45°–45°–90° الضلعان متساويان (1، 1) والوتر √2، فكل منهما = 1/√2 = √2/2\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n1) [مستوى الدعم] أوجد القيمة الدقيقة: جا² 45°.\nالإجابة النموذجية: 1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة: جا 60° جتا 30° + جتا 60° جا 30°.\nالإجابة النموذجية: 3/4 + 1/4 = 1\n3) [المستوى المتقدم] أوجد القيمة الدقيقة: 1 ÷ (1 + ظا(π/6)) في أبسط صورة بمقام نسبي.\nالإجابة النموذجية: 1/(1 + 1/√3) = √3/(√3 + 1) = (3 − √3)/2", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\n1) [مستوى الدعم] إذا كان جتا هـ = 4/5 وهـ حادة، أوجد جا هـ.\nالإجابة النموذجية: 3/5\n2) [المستوى المتوقع] إذا كان جا هـ = 1/3 وهـ حادة، أوجد جتا هـ بالقيمة الدقيقة.\nالإجابة النموذجية: 2√2/3\n3) [المستوى المتقدم] إذا كان جتا هـ = √5/3 وهـ حادة، أوجد قيمة 1 − ظا² هـ.\nالإجابة النموذجية: ظا هـ = 2/√5 ← 1 − 4/5 = 1/5\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\n1) [مستوى الدعم] أكمل: جتا 60° = ......\nالإجابة النموذجية: 1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة: جا 30° × جتا 60°.\nالإجابة النموذجية: 1/2 × 1/2 = 1/4\n3) [المستوى المتقدم] أوجد القيمة الدقيقة: جا² 30° + جتا² 30°. ماذا تلاحظ؟\nالإجابة النموذجية: 1/4 + 3/4 = 1؛ المجموع يساوي 1\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n1) [مستوى الدعم] أوجد القيمة الدقيقة: ظا 45° + جتا 0°.\nالإجابة النموذجية: 2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة: ظا²(π/3) − 2جا²(π/4).\nالإجابة النموذجية: 3 − 1 = 2\n3) [المستوى المتقدم] أوجد القيمة الدقيقة: جا(π/3) ÷ جتا(π/4).\nالإجابة النموذجية: (√3/2) ÷ (√2/2) = √3/√2 = √6/2", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nإرشاد للطالب: مراجعة مثال 1 ص 39، وحل تمارين 1-2 (1، 2) ص 41 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nإرشاد للطالب: حفظ جدول القيم الدقيقة للزوايا الخاصة ص 40، وحل تمارين 1-2 (4) ص 41 من كتاب الطالب، وتمارين 1-2 (⁦1–3⁩) ص ⁦29–30⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nإرشاد للطالب: حل تمارين 1-2 (5، 6) ص 42 من كتاب الطالب، وتمارين 1-2 (⁦4–8⁩) ص ⁦31–32⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "2-2", "title": "زاوية الأساس (الزاوية المرجعية)", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦43–48⁩", "wbp": "⁦33–34⁩", "p": [{"t": "الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يرسم الزاوية في الوضع القياسي ويحدد الربع الذي يقع فيه ضلعها النهائي.\n2) يميز بين الزاوية الموجبة (عكس عقارب الساعة) والزاوية السالبة (مع عقارب الساعة) والزوايا الأكبر من دورة.\nمخرج تعليمي آخر: يجد زوايا مشتركة في الضلع النهائي بإضافة أو طرح مضاعفات 360°.", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "الوضع القياسي، الضلع الابتدائي، الضلع النهائي، الأرباع الأربعة، الزاوية الموجبة، الزاوية السالبة، الدورة", "نشاط حركي: يمد الطالب ذراعه على امتداد الجزء الموجب لمحور السينات ثم يدور 120° ثم −90°، ويناقش الطلبة الاتجاه والموقع.", "(5 د) التهيئة: المعلم: ينفذ نشاط الذراع الدوّارة. | الطالب: يؤدي الحركة ويصف الاتجاه.\n(10 د) النمذجة: المعلم: يعرض الزاوية في الوضع القياسي ص 43 باستخدام GeoGebra، ويحرك الضلع النهائي في الأرباع. | الطالب: يلاحظ ويحدد الربع.\n(12 د) تطبيق: المعلم: يحل مع الطلبة مثال 3 (أ–د) ص ⁦43–44⁩ برسم كل زاوية. | الطالب: يرسم الزوايا: 120°، 430°، 3π/4، −2π/3.\n(8 د) تعاوني: المعلم: يكلف المجموعات برسم مثال 3 (هـ، و) وتحديد الربع. | الطالب: ترسم المجموعة وتعرض.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] في أي ربع يقع الضلع النهائي للزاوية 120°؟\nالإجابة النموذجية: الربع الثاني\n2) [المستوى المتوقع] في أي ربع تقع الزاوية −2π/3؟\nالإجابة النموذجية: الربع الثالث\n3) [المستوى المتقدم] في أي ربع تقع الزاوية 430°؟ وما الزاوية بين 0° و 360° التي تشترك | الطالب: ترسم المجموعة وتعرض.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\n(5 د) التهيئة: المعلم: يعرض الرسوم ويستقبل التوقعات. | الطالب: يتوقع العلاقة في كل ربع.\n(10 د) بناء المفهوم: المعلم: يثبت قوانين زاوية الأساس في الأرباع الأربعة ص 46. | الطالب: يدون القوانين في جدول.\n(10 د) النمذجة: المعلم: يحل مثال 4 (أ–ج) ص ⁦46–47⁩. | الطالب: يتابع ويرسم.\n(10 د) تعاوني: المعلم: يكلف المجموعات بتمارين 2-2: 1 ص 47. | الطالب: تحل وتعرض.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\n(5 د) التهيئة: المعلم: ينفذ «أين أقع؟». | الطالب: يرفع بطاقة الربع.\n(12 د) تعاوني: المعلم: يكلف بتمارين 2-2: 2، 3 ص 48. | الطالب: تحل المجموعات.\n(10 د) كتاب النشاط: المعلم: يكلف بتمارين 2-2 (⁦1–3⁩) ص ⁦33–34⁩ من كتاب النشاط مع دعم فردي. | الطالب: يحل ذاتيًا.\n(5 د) تصويب: المعلم: يناقش الأخطاء الشائعة (الخلط بين قوانين الأرباع). | الطالب: يصحح.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس زاوية الأساس. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\n1) [مستوى الدعم] في أي ربع يقع الضلع النهائي للزاوية 120°؟\nالإجابة النموذجية: الربع الثاني\n2) [المستوى المتوقع] في أي ربع تقع الزاوية −2π/3؟\nالإجابة النموذجية: الربع الثالث\n3) [المستوى المتقدم] في أي ربع تقع الزاوية 430°؟ وما الزاوية بين 0° و 360° التي تشترك معها في الضلع النهائي؟\nالإجابة النموذجية: الربع الأول؛ 430 − 360 = 70°\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\n1) [مستوى الدعم] أوجد زاوية الأساس للزاوية 110°.\nالإجابة النموذجية: 70°\n2) [المستوى المتوقع] أوجد زاوية الأساس للزاوية −320°.\nالإجابة النموذجية: 40° (تقع في الربع الأول)\n3) [المستوى المتقدم] زاوية أساسها 42° وتقع في الربع الثاني، 0° ≤ هـ ≤ 360°. أوجد هـ.\nالإجابة النموذجية: هـ = 180° − 42° = 138°\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\n1) [مستوى الدعم] زاوية أساسها 53° وتقع في الربع الثالث ضمن 360° ≤ هـ ≤ 720°. أوجد هـ.\nالإجابة النموذجية: هـ = 360° + 180° + 53° = 593°\n2) [المستوى المتوقع] زاوية أساسها 2π/9 تقع في الربع الرابع ضمن −4π ≤ هـ ≤ −2π. أوجد هـ.\nالإجابة النموذجية: هـ = −2π − 2π/9 = −20π/9\n3) [المستوى المتقدم] أوجد جميع الزوايا في 0° ≤ هـ ≤ 360° التي زاوية أساسها 35°.\nالإجابة النموذجية: 35°، 145°، 215°، 325°", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\n1) [مستوى الدعم] في أي ربع تقع الزاوية 200°؟\nالإجابة النموذجية: الربع الثالث\n2) [المستوى المتوقع] حدد اتجاه الدوران للزاوية −1.2π وفي أي ربع تقع.\nالإجابة النموذجية: مع اتجاه عقارب الساعة؛ تقع في الربع الثاني (تكافئ 0.8π)\n3) [المستوى المتقدم] اكتب زاويتين (موجبة وسالبة) تشتركان في الضلع النهائي مع 45°.\nالإجابة النموذجية: مثل: 405° و −315°\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\n1) [مستوى الدعم] أوجد زاوية الأساس للزاوية 200°.\nالإجابة النموذجية: 20°\n2) [المستوى المتوقع] أوجد زاوية الأساس للزاوية 5π/6.\nالإجابة النموذجية: π/6\n3) [المستوى المتقدم] أوجد زاوية الأساس للزاوية −500°.\nالإجابة النموذجية: −500° + 720° = 220° في الربع الثالث ← زاوية الأساس 40°\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\n1) [مستوى الدعم] أوجد زاوية الأساس للزاوية 7π/4.\nالإجابة النموذجية: π/4\n2) [المستوى المتوقع] زاوية أساسها 60° وتقع في الربع الرابع، 0° ≤ هـ ≤ 360°. أوجد هـ.\nالإجابة النموذجية: 300°\n3) [المستوى المتقدم] زاوية أساسها π/5 وتقع في الربع الثاني، 0 ≤ هـ ≤ 2π. أوجد هـ.\nالإجابة النموذجية: π − π/5 = 4π/5", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\nإرشاد للطالب: مراجعة مثال 3 ص ⁦43–45⁩ ورسم الزوايا في دفتر الواجبات.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\nإرشاد للطالب: مراجعة القوانين ص 46 ومثال 4 ص ⁦46–47⁩، وحل تمارين 2-2 (1) ص 47 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\nإرشاد للطالب: حل تمارين 2-2 (2، 3) ص 48 من كتاب الطالب، وإكمال تمارين 2-2 ص ⁦33–34⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "3-2", "title": "النسب المثلثية للزوايا العامة", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦49–53⁩", "wbp": "⁦35–37⁩", "p": [{"t": "تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يعرّف جا هـ = ص/نق، جتا هـ = س/نق، ظا هـ = ص/س لزاوية في أي ربع حيث نق = √(س² + ص²).\n2) يحسب النسب المثلثية لزاوية يمر ضلعها النهائي بنقطة معلومة.", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "النقطة (س، ص) على الضلع النهائي، نق = √(س² + ص²)، النسب المثلثية للزاوية العامة", "سؤال: «كيف نعرّف جا 150° ولا يوجد مثلث قائم فيه زاوية 150°؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يقترح أفكارًا.\n(12 د) بناء المفهوم: المعلم: يعرض النتيجة 1 ص 49 بالرسم وGeoGebra. | الطالب: يدون التعريف.\n(10 د) النمذجة: المعلم: يحل مثالًا: الضلع النهائي يمر بالنقطة (−3، 4). | الطالب: يحسب نق = 5 ثم النسب.\n(8 د) تعاوني: المعلم: يعطي كل مجموعة نقطة في ربع مختلف لحساب النسب. | الطالب: تحسب وتعرض.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أكمل: جتا هـ = ...... حيث (س، ص) نقطة على الضلع النهائي.\nالإجابة النموذجية: س/نق\n2) [المستوى المتوقع] الضلع النهائي للزاوية هـ يمر بالنقطة (−3، 4). أوجد جا هـ وجتا هـ.\nالإجابة النموذجية: نق = 5، جا هـ = 4/5، جتا هـ = −3/5\n3) [المستوى المتقدم] في المسألة السابقة أوجد ظا هـ، ولماذا تكون سالبة؟\nالإجابة النموذجية: −4/3؛ لأن س سالبة وص موجبة", "1) [مستوى الدعم] الضلع النهائي يمر بالنقطة (5، 12). أوجد جا هـ.\nالإجابة النموذجية: 12/13\n2) [المستوى المتوقع] الضلع النهائي يمر بالنقطة (−6، −8). أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: نق = 10، جتا هـ = −3/5، ظ لربعية والزوايا خارج الدورة\n(5 د) التهيئة: المعلم: يعرض دائرة الوحدة. | الطالب: يحدد الإحداثيات.\n(10 د) الاكتشاف: المعلم: يقود استنتاج النسب للزوايا الربعية (مثال 8 ص 51) ومتى يكون الظل غير معرّف. | الطالب: يكمل جدولًا للزوايا الربعية.\n(10 د) النمذجة: المعلم: يحسب جا 750°، جتا(−240°) بالرد إلى زاوية مكافئة. | الطالب: يتابع.\n(10 د) تشاركي: المعلم: يكلف بتمارين 3-2: 6، 7، 8 ص 53. | الطالب: يحل في أزواج ويتبادل الشرح.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام\n(5 د) التهيئة: المعلم: يعرض العبارات. | الطالب: يحكم ويبرر.\n(15 د) تعاوني: المعلم: يكلف بتمارين 3-2: 9، 10، 11 ص 53 وتمارين كتاب النشاط ⁦6–9⁩ ص ⁦36–37⁩ حسب المستويات. | الطالب: يحل حسب مستواه.\n(10 د) مناقشة: المعلم: يعرض حلولًا نموذجية ويصوب الأخطاء. | الطالب: يصحح.\n(10 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس النسب المثلثية للزوايا العامة. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة\n1) [مستوى الدعم] أكمل: جتا هـ = ...... حيث (س، ص) نقطة على الضلع النهائي.\nالإجابة النموذجية: س/نق\n2) [المستوى المتوقع] الضلع النهائي للزاوية هـ يمر بالنقطة (−3، 4). أوجد جا هـ وجتا هـ.\nالإجابة النموذجية: نق = 5، جا هـ = 4/5، جتا هـ = −3/5\n3) [المستوى المتقدم] في المسألة السابقة أوجد ظا هـ، ولماذا تكون سالبة؟\nالإجابة النموذجية: −4/3؛ لأن س سالبة وص موجبة\n\nالحصة 2: إشارات النسب المثلثية في الأرباع الأربعة\n1) [مستوى الدعم] ما إشارة جتا 200°؟\nالإجابة النموذجية: سالبة (الربع الثالث)\n2) [المستوى المتوقع] ما إشارة ظا 300°؟\nالإجابة النموذجية: سالبة (الربع الرابع)\n3) [المستوى المتقدم] إذا كان جا هـ < 0 وظا هـ > 0، ففي أي ربع تقع هـ؟\nالإجابة النموذجية: الربع الثالث\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس\n1) [مستوى الدعم] اكتب جا 140° بدلالة نسبة زاوية الأساس.\nالإجابة النموذجية: جا 140° = جا 40°\n2) [المستوى المتوقع] أوجد القيمة الدقيقة لـ جتا 315°.\nالإجابة النموذجية: √2/2\n3) [المستوى المتقدم] أوجد القيمة الدقيقة لـ ظا(7π/6).\nالإجابة النموذجية: √3/3\n\nالحصة 4: إيجاد النسب المثلثية بمعلومية إحداها والربع\n1) [مستوى الدعم] إذا كان جتا هـ = −3/5 و 180° < هـ < 270°، أوجد جا هـ.\nالإجابة النموذجية: −4/5\n2) [المستوى المتوقع] في المسألة السابقة أوجد ظا هـ.\nالإجابة النموذجية: 4/3\n3) [المستوى المتقدم] إذا كان ظا هـ = −5/12 و 90° < هـ < 180°، أوجد جا هـ وجتا هـ.\nالإجابة النموذجية: جا هـ = 5/13، جتا هـ = −12/13\n\nالحصة 5: النسب المثلثية للزوايا الربعية والزوايا خارج الدورة\n1) [مستوى الدعم] ما قيمة جا 270°؟\nالإجابة النموذجية: −1\n2) [المستوى المتوقع] ما قيمة جتا π؟\nالإجابة النموذجية: −1\n3) [المستوى المتقدم] أوجد القيمة الدقيقة لـ جا 750°.\nالإجابة النموذجية: 750° − 720° = 30° ← 1/2\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام\n1) [مستوى الدعم] هل جا 150° = جا 30°؟ برر.\nالإجابة النموذجية: نعم؛ زاوية الأساس 30° والجيب موجب في الربع الثاني\n2) [المستوى المتوقع] أوجد القيمة الدقيقة لـ ظا 225°.\nالإجابة النموذجية: 1\n3) [المستوى المتقدم] أثبت أن جا(180° − هـ) = جا هـ لأي زاوية حادة هـ.\nالإجابة النموذجية: 180° − هـ تقع في الربع الثاني وزاوية أساسها هـ والجيب موجب فيه", "الحصة 1: تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة\n1) [مستوى الدعم] الضلع النهائي يمر بالنقطة (5، 12). أوجد جا هـ.\nالإجابة النموذجية: 12/13\n2) [المستوى المتوقع] الضلع النهائي يمر بالنقطة (−6، −8). أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: نق = 10، جتا هـ = −3/5، ظا هـ = 4/3\n3) [المستوى المتقدم] لماذا يكون ظا هـ غير معرّف عندما يقع الضلع النهائي على محور الصادات؟\nالإجابة النموذجية: لأن س = 0 والقسمة على صفر غير معرّفة\n\nالحصة 2: إشارات النسب المثلثية في الأرباع الأربعة\n1) [مستوى الدعم] في أي ربع تكون جميع النسب موجبة؟\nالإجابة النموذجية: الربع الأول\n2) [المستوى المتوقع] ما إشارة جا(5π/4)؟\nالإجابة النموذجية: سالبة\n3) [المستوى المتقدم] إذا كان جتا هـ > 0 وجا هـ < 0، ففي أي ربع تقع هـ؟ وما إشارة ظا هـ؟\nالإجابة النموذجية: الربع الرابع؛ ظا هـ سالبة\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس\n1) [مستوى الدعم] أوجد القيمة الدقيقة لـ جا 210°.\nالإجابة النموذجية: −1/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة لـ ظا 120°.\nالإجابة النموذجية: −√3\n3) [المستوى المتقدم] اكتب جتا(−130°) بدلالة نسبة زاوية الأساس.\nالإجابة النموذجية: −جتا 50°\n\nالحصة 4: إيجاد النسب المثلثية بمعلومية إحداها والربع\n1) [مستوى الدعم] إذا كان جا هـ = 3/5 والزاوية في الربع الثاني، أوجد جتا هـ.\nالإجابة النموذجية: −4/5\n2) [المستوى المتوقع] إذا كان جا هـ = −1/2 و 270° < هـ < 360°، أوجد هـ.\nالإجابة النموذجية: 330°\n3) [المستوى المتقدم] إذا كان ظا هـ = 2 و π < هـ < 3π/2، أوجد جتا هـ بالقيمة الدقيقة.\nالإجابة النموذجية: −1/√5 = −√5/5\n\nالحصة 5: النسب المثلثية للزوايا الربعية والزوايا خارج الدورة\n1) [مستوى الدعم] ما قيمة جتا 270°؟\nالإجابة النموذجية: 0\n2) [المستوى المتوقع] لماذا ظا 90° غير معرّف؟\nالإجابة النموذجية: لأن جتا 90° = 0 والقسمة على صفر غير معرّفة\n3) [المستوى المتقدم] أوجد القيمة الدقيقة لـ جتا(−240°).\nالإجابة النموذجية: تكافئ 120° ← −1/2\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام\n1) [مستوى الدعم] أوجد القيمة الدقيقة لـ جا 300°.\nالإجابة النموذجية: −√3/2\n2) [المستوى المتوقع] أوجد القيمة الدقيقة لـ جتا 150° + جا 120°.\nالإجابة النموذجية: −√3/2 + √3/2 = 0\n3) [المستوى المتقدم] أوجد القيمة الدقيقة لـ ظا 135° × جتا 240° ÷ جا 330°.\nالإجابة النموذجية: (−1)(−1/2) ÷ (−1/2) = −1", "الحصة 1: تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة\nإرشاد للطالب: قراءة النتيجة 1 ص 49 وحل أسئلة مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إشارات النسب المثلثية في الأرباع الأربعة\nإرشاد للطالب: حفظ قاعدة الإشارات ص 49، وحل تمارين 3-2 (1) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس\nإرشاد للطالب: مراجعة مثال 5 ص 50، وحل تمارين 3-2 (1، 2) ص 52 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات  ص = جا(ب س)\n(5 د) التهيئة: المعلم: يعرض المنزلقين. | الطالب: يصف التغيرات.\n(12 د) النمذجة: المعلم: يشرح ص = 2جا س (تمدد رأسي) ثم ص = جا 2س (تمدد أفقي) ص ⁦60–61⁩، ومثال 9. | الطالب: يدون القاعدتين.\n(10 د) تعاوني: المعلم: يعطي كل مجموعة دالة: 3جا 2س، 2جتا(س/2)، ½ جا 3س لتحديد السعة والدورة ورسمها. | الطالب: ترسم وتعرض.\n(8 د) فردي: المعلم: يكلف بتمارين 4-2: 3، 4 ص ⁦64–65⁩. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يجيب: 1 ≤ ص ≤ 3.\n(12 د) النمذجة: المعلم: يحل مثال 10 ص 62 ثم خطوات رسم ص = 1 + 2جتا(س + 90°). | الطالب: يتابع الخطوات ويرسم.\n(10 د) تشاركي: المعلم: يكلف الأزواج برسم ص = جا س + 2، ص = جتا(س − 60°). | الطالب: يرسم ويتبادل التحقق.\n(8 د) تطبيق: المعلم: يكلف بتمارين 4-2: 6، 7، 8 ص 65. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\n(5 د) التهيئة: المعلم: يعرض المنحنيين. | الطالب: يصف الانعكاس.\n(10 د) النمذجة: المعلم: يشرح الانعكاس ومثالي 11، 12 ص ⁦63–64⁩. | الطالب: يتابع.\n(12 د) حل مشكلات: المعلم: يعرض صورًا لمنحنيات ويطلب كتابة معادلاتها (تمارين 4-2: ⁦10–13⁩ ص 66). | الطالب: تحلل المجموعات المنحنيات وتكتب المعادلات.\n(8 د) عرض: المعلم: تعرض المجموعات استنتاجاتها. | الطالب: يبرر.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\n(5 د) التهيئة: المعلم: يطرح السؤال ويعرضه بالرسم. | الطالب: يجيب: مرتين.\n(15 د) تعاوني: المعلم: يكلف بتمارين 4-2: ⁦14–17⁩ ص ⁦66–67⁩ وتمارين كتاب النشاط ص ⁦41–42⁩ حسب المستوى. | الطالب: يحل حسب مستواه.\n(10 د) مناقشة: المعلم: يناقش الحلول ويربط عدد الحلول بالتقاطع. | الطالب: يصحح.\n(10 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس التمثيلات البيانية للدوال المثلثية. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: التمثيل البياني لدالة الجيب\n1) [مستوى الدعم] ما دورة الدالة ص = جا س؟\nالإجابة النموذجية: 360° أو 2π\n2) [المستوى المتوقع] ما أكبر قيمة للدالة ص = جا س؟ وعند أي قيمة لـ س في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: 1 عند س = 90°\n3) [المستوى المتقدم] استخدم المنحنى لتبين أن جا(−س) = −جا س.\nالإجابة النموذجية: المنحنى متماثل حول نقطة الأصل؛ قيمة الدالة عند −س معكوس قيمتها عند س\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\n1) [مستوى الدعم] ما قيمة جتا 0°؟ وما نقطة تقاطع منحنى ص = جتا س مع محور الصادات؟\nالإجابة النموذجية: 1؛ (0، 1)\n2) [المستوى المتوقع] ما دورة الدالة ص = ظا س؟\nالإجابة النموذجية: 180° أو π\n3) [المستوى المتقدم] حدد معادلات خطوط التقارب لمنحنى ص = ظا س في 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، س = 270°\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\n1) [مستوى الدعم] ما سعة الدالة ص = 3 جا س؟\nالإجابة النموذجية: 3\n2) [المستوى المتوقع] ما دورة الدالة ص = جا 2س؟\nالإجابة النموذجية: 180°\n3) [المستوى المتقدم] أوجد السعة والدورة للدالة ص = 2 جتا(س/2).\nالإجابة النموذجية: السعة 2، الدورة 720°\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n1) [مستوى الدعم] ما مدى الدالة ص = جا س + 2؟\nالإجابة النموذجية: 1 ≤ ص ≤ 3\n2) [المستوى المتوقع] صف التحويل الذي ينقل ص = جا س إلى ص = جا(س − 90°).\nالإجابة النموذجية: انسحاب أفقي 90° إلى اليمين بالمتجه (90، 0)\n3) [المستوى المتقدم] أوجد القيمة العظمى والصغرى للدالة ص = 1 + 2جتا(س + 90°).\nالإجابة النموذجية: العظمى 3، الصغرى −1\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\n1) [مستوى الدعم] صف التحويل من ص = جتا س إلى ص = −جتا س.\nالإجابة النموذجية: انعكاس في محور السينات\n2) [المستوى المتوقع] منحنى جيب قيمته العظمى 3 والصغرى −1 ودورته 360°. اكتب معادلته على صورة ص = أ جا س + ج.\nالإجابة النموذجية: أ = 2، ج = 1 ← ص = 2 جا س + 1\n3) [المستوى المتقدم] هل ص = جا(−س) هو المنحنى نفسه لـ ص = −جا س؟ برر.\nالإجابة النموذجية: نعم؛ لأن جا(−س) = −جا س\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\n1) [مستوى الدعم] كم حلًا للمعادلة جا س = 0.5 في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: حلان\n2) [المستوى المتوقع] كم حلًا للمعادلة جتا 2س = 0.3 في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: 4 حلول (دورة 180° فتتكرر مرتين)\n3) [المستوى المتقدم] ارسم ص = جا س و ص = س/90 تقريبيًا ثم حدد عدد حلول جا س = س/90 في 0° ≤ س ≤ 180°.\nالإجابة النموذجية: حلان: س = 0°، س = 90° (لأن جا 90° = 1 = 90/90)", "الحصة 1: التمثيل البياني لدالة الجيب\n1) [مستوى الدعم] ما مدى الدالة ص = جا س؟\nالإجابة النموذجية: −1 ≤ ص ≤ 1\n2) [المستوى المتوقع] أوجد أصفار ص = جا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: 0، π، 2π\n3) [المستوى المتقدم] أكمل: جا(180° + س) = ......\nالإجابة النموذجية: −جا س\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\n1) [مستوى الدعم] أكمل: جتا(−س) = ......\nالإجابة النموذجية: جتا س\n2) [المستوى المتوقع] ما مدى الدالة ص = ظا س؟\nالإجابة النموذجية: جميع الأعداد الحقيقية\n3) [المستوى المتقدم] أوجد أصفار ص = جتا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: π/2، 3π/2\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\n1) [مستوى الدعم] ما مدى الدالة ص = 4 جتا س؟\nالإجابة النموذجية: −4 ≤ ص ≤ 4\n2) [المستوى المتوقع] أوجد دورة الدالة ص = جا 3س بالراديان.\nالإجابة النموذجية: 2π/3\n3) [المستوى المتقدم] اكتب دالة جيب سعتها 5 ودورتها 120°.\nالإجابة النموذجية: ص = 5 جا 3س\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n1) [مستوى الدعم] صف التحويل من ص = جتا س إلى ص = جتا س − 1.\nالإجابة النموذجية: انسحاب رأسي وحدة إلى الأسفل\n2) [المستوى المتوقع] ما الدالة الناتجة من انسحاب ص = جا س بمقدار 30° إلى اليسار؟\nالإجابة النموذجية: ص = جا(س + 30°)\n3) [المستوى المتقدم] بيّن أن جتا(س + 90°) = −جا س باستخدام الانسحاب.\nالإجابة النموذجية: انسحاب منحنى جتا 90° لليسار ينطبق على منحنى −جا س\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\n1) [مستوى الدعم] ما الدالة الناتجة من انعكاس ص = جا س في محور السينات؟\nالإجابة النموذجية: ص = −جا س\n2) [المستوى المتوقع] أوجد مدى ص = 3 − 2جا س.\nالإجابة النموذجية: 1 ≤ ص ≤ 5\n3) [المستوى المتقدم] اكتب معادلة على صورة ص = أ جتا(ب س) لمنحنى قيمته العظمى 4 ودورته π.\nالإجابة النموذجية: ص = 4 جتا 2س\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\n1) [مستوى الدعم] ما دورة ص = ظا 2س؟\nالإجابة النموذجية: 90°\n2) [المستوى المتوقع] ما مدى ص = 2 + جتا 3س؟\nالإجابة النموذجية: 1 ≤ ص ≤ 3\n3) [المستوى المتقدم] كم حلًا للمعادلة 3جا 2س = 4 في 0° ≤ س ≤ 360°؟ برر.\nالإجابة النموذجية: لا حلول؛ لأن أكبر قيمة لـ 3 جا 2س هي 3", "الحصة 1: التمثيل البياني لدالة الجيب\nإرشاد للطالب: مراجعة استكشف 2 والعلاقات ص ⁦54–56⁩، ورسم منحنى ص = جا س في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\nإرشاد للطالب: حل تمارين 4-2 (1، 2) ص 64 من كتاب الطالب، ومراجعة خصائص المنحنيات الثلاثة ص ⁦56–59⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\nإرشاد للطالب: حل تمارين 4-2 (⁦3–5⁩) ص ⁦64–65⁩ من كتاب الطالب، وتمارين 4-2 (⁦1–3⁩) ص ⁦38–39⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\nإرشاد للطالب: حل تمارين 4-2 (⁦6–9⁩) ص 65 من كتاب الطالب، وتمارين 4-2 (4، 5) ص 40 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\nإرشاد للطالب: حل تمارين 4-2 (⁦10–13⁩) ص 66 من كتاب الطالب، وتمارين 4-2 (6، 7) ص 41 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 4-2 ص ⁦41–42⁩ من كتاب النشاط، والتحقق من الرسوم باستخدام GeoGebra أو Desmos.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "5-2", "title": "الدوال المثلثية العكسية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦68–72⁩", "wbp": " nالإجابة النموذجية: س = 120°، 240°\n2) [المستوى المتوقع] حل: ظا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 45°، 225°\n3) [المستوى المتقدم] حل: جتا س = 0.4 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 66.4°، 293.6°\n\nالحصة 3: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\n1) [مستوى الدعم] إذا كانت 0° ≤ س ≤ 180°، ففي أي فترة تقع 2س؟\nالإجابة النموذجية: 0° ≤ 2س ≤ 360°\n2) [المستوى المتوقع] حل: جا 2س = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2س = 30°، 150°، 390°، 510° ← س = 15°، 75°، 195°، 255°\n3) [المستوى المتقدم] حل: جتا(س − 30°) = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س − 30° = 60°، 300° ← س = 90°، 330°\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام\n1) [مستوى الدعم] حل: (جا س − 1)(2جا س + 1) = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، 210°، 330°\n2) [المستوى المتوقع] حل: ظا² س = 3 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = ±√3 ← س = 60°، 120°، 240°، 300°\n3) [المستوى المتقدم] حل: جتا² س − 3جتا س − 4 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: (جتا س − 4)(جتا س + 1) = 0؛ جتا س = 4 مرفوض ← س = 180°", "الحصة 1: حل معادلات الجيب في فترة معطاة\n1) [مستوى الدعم] حل: جا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°\n2) [المستوى المتوقع] حل: جا س = √3/2 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س = π/3، 2π/3\n3) [المستوى المتقدم] حل: 2جا س + 1 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = −1/2 ← س = 210°، 330°\n\nالحصة 2: حل معادلات جيب التمام والظل بالدرجات والراديان\n1) [مستوى الدعم] حل: جتا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 0°، 360°\n2) [المستوى المتوقع] حل: ظا س = √3 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س = π/3، 4π/3\n3) [المستوى المتقدم] حل: ظا س = −2.1 حيث 0° ≤ س ≤ 360° (لأقرب 0.01°).\nالإجابة النموذجية: س ≈ 115.46°، 295.46°\n\nالحصة 3: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\n1) [مستوى الدعم] حل: جتا 2س = 0 حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: 2س = 90°، 270° ← س = 45°، 135°\n2) [المستوى المتوقع] حل: ظا 3س = 1 حيث 0° ≤ س ≤ 120°.\nالإجابة النموذجية: 3س = 45°، 225° ← س = 15°، 75°\n3) [المستوى المتقدم] حل: جا(س + π/6) = 1 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س + π/6 = π/2 ← س = π/3\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام\n1) [مستوى الدعم] حل: جا² س = 1/4 حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: جا س = 1/2 (السالبة لا تعطي حلولًا في الفترة) ← س = 30°، 150°\n2) [المستوى المتوقع] حل: 2جا² س − جا س − 1 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، 210°، 330°\n3) [المستوى المتقدم] لماذا لا توجد حلول للمعادلة جا س = 2؟\nالإجابة النموذجية: لأن مدى الجيب [−1، 1]", "الحصة 1: حل معادلات الجيب في فترة معطاة\nإرشاد للطالب: مراجعة مثال 15 ص 74، وحل تمارين 6-2 (1) ص 82 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: حل معادلات جيب التمام والظل بالدرجات والراديان\nإرشاد للطالب: مراجعة مثال 16 ص ⁦75–76⁩، وحل تمارين 6-2 (2، 3) ص 82 من كتاب الطالب، وتمارين 6-2 (1، 2) ص 46 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\nإرشاد للطالب: مراجعة مثالي 17، 18 ص ⁦76–78⁩، وحل تمارين 6-2 (⁦4–7⁩) ص 83 من كتاب الطالب، وتمارين 6-2 (⁦3–6⁩) ص 47 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام\nإرشاد للطالب: حل تمارين 6-2 (⁦8–11⁩) ص 83 من كتاب الطالب، وتمارين 6-2 (⁦7–10⁩) ص ⁦48–49⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "7-2", "title": "المتطابقات المثلثية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦84–86⁩", "wbp": "⁦50–52⁩", "p": [{"t": "المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يبرهن المتطابقتين الأساسيتين باستخدام تعريف ف الأيمن والطرف الأيسر، توحيد المقامات، الفرق بين مربعين", "يعرض المعلم «برهانًا» يحتوي خطأً متعمدًا ويطلب من الطلبة اكتشافه.", "(5 د) التهيئة: المعلم: يعرض البرهان الخاطئ. | الطالب: يكتشف الخطأ.\n(12 د) النمذجة: المعلم: يحل مثالي 22، 23 ص 85 ويستخرج إرشادات البرهان. | الطالب: يدون الإرشادات.\n(13 د) تشاركي (بطاقات خطوات): المعلم: يوزع بطاقات خطوات برهان مبعثرة لمتطابقة ويطلب ترتيبها. | الطالب: يرتب الخطوات ويبرر كل خطوة.\n(5 د) فردي: المعلم: يكلف بتمارين 7-2: 2 (أ، ب) ص 85. | الطالب: يبرهن.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أثبت أن: جتا س × ظا س ≡ جا س.\nالإجابة النموذجية: جتا س × جا س/جتا س = جا س\n2) [المستوى المتوقع] أثبت أن: (1 − جتا² س)/جا س ≡ جا س.\nالإجابة النموذجية: جا² س/جا س = جا س\n3) [المستوى المتقدم] أثبت أن: 1/جتا س − جتا س ≡ جا س ظا س.\nالإجابة النموذجية: (1 − جتا² س)/جتا س = جا² س/جتا س = جا س × جا س/جتا س", "1) [مستوى الدعم] أثبت أن: ظا س/جا س ≡ 1/جتا س.\nالإجابة النموذجية: (جا س/جتا س) ÷ جا س = 1/جتا س\n2) [المستوى المتوقع] أثبت أن: جا⁴ س − جتا⁴ س ≡ جا² س − جتا² س.\nالإجابة النموذجية: (جا² س − جتا² س)(جا² س + جتا² س) = جا² س − جتا² س\n3) [المستوى المتقدم] أثبت أن: (1 + جا س)/جتا² س ≡ 1/(1 − جا س).\nالإجابة النموذجية: (1 + جا س)/[(1 − جا س)(1 + جا س)] = 1/(1 − جا س)", "إرشاد للطالب: مراجعة مثال 23 ص 85، وحل تمارين 7-2 (2، 3) ص ⁦85–86⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "تمارين المتطابقات ومسابقة الختام", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يبرهن متطابقات متنوعة الصعوبة.\n2) يستخدم المتطابقات لإيجاد قيم دقيقة لعبارات بمعلومية نسبة.", "المخرج 1: تقييم\nالمخرج 2: تطبيق", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المتطابقات الأساسية، البرهان، القيمة الدقيقة", "سؤال سريع: «إذا كان جا س = 0.6 وس حادة، فما جتا س دون حاسبة؟»", "(5 د) التهيئة: المعلم: يطرح السؤال.
