م التعاوني، التعلم المبني على حل المشكلات", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nالكتاب، السبورة الذكية، الأقلام، أخرى: خيط ودوائر كرتونية\n\nالحصة 2: التحويل بين الدرجات والراديان\nالكتاب، السبورة الذكية، الأقلام، أخرى: الآلة الحاسبة العلمية، أخرى: بطاقات عمل\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nالراديان، الزاوية المركزية، القوس، نصف القطر، الدورة الكاملة، π\n\nالحصة 2: التحويل بين الدرجات والراديان\nالتحويل من الدرجات إلى الراديان (× π/180)، التحويل من الراديان إلى الدرجات (× 180/π)، الأرقام المعنوية\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nوضع الراديان (RAD)، وضع الدرجات (DEG)، الجيب، جيب التمام، الظل، المثلث القائم الزاوية", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nمراجعة ما درسه الطالب سابقًا: قياس الزاوية بالدرجات، ومحيط الدائرة = 2π نق. يطرح المعلم سؤالًا: «كم مرة يمكن أن نلف نصف القطر على محيط الدائرة؟» ويستقبل التقديرات.\n\nالحصة 2: التحويل بين الدرجات والراديان\nمراجعة سريعة لجدول الزوايا الخاصة بلعبة «اسأل وأجب»: يذكر المعلم زاوية بالدرجات ويذكر الطالب ما يساويها بالراديان.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nسؤال تحفيزي: «احسب جا 30 على الحاسبة، ثم احسب جا(π/6). لماذا قد تختلف النتيجتان على حاسبة زميلك؟» لإبراز أهمية وضع الحاسبة.", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة دائرة ويطرح سؤال لف نصف القطر على المحيط، ويوضح هدف الحصة، ويقدّر الطالب الإجابة ويتذكر قانون محيط الدائرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستكشاف: يوزع المعلم على المجموعات دوائر كرتونية وخيوطًا بطول نصف القطر، ويطلب لف الخيط على المحيط ورسم الزاوية المركزية المقابلة، ويلف الطالب الخيط ويرسم الزاوية ويقيسها بالمنقلة (≈ 57°) ويعد عدد مرات لف الخيط (≈ 6.28) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. بناء المفهوم: يعرض المعلم تعريف الراديان ص 20 ويستنتج مع الطلبة النتيجتين: قوس طوله نق يقابل 1 راديان، والمحيط يقابل 2π راديان، ومنه π راديان = 180°، ويناقش الطالب ويسجل التعريف والنتيجتين في دفتره (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تطبيق تعاوني: يطلب المعلم إكمال جدول الزوايا الخاصة (0°، 30°، 45°، 60°، 90°، 180°، 270°، 360°) بدلالة π، وتكمل كل مجموعة الجدول وتعرضه على السبورة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الغلق والتقويم: يطرح المعلم أسئلة التقويم الختامي ويلخص الفكرة الرئيسة، ويجيب الطالب فرديًا على السبورات الصغيرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: التحويل بين الدرجات والراديان — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينفذ المعلم لعبة «اسأل وأجب» على الزوايا الخاصة، ويجيب الطالب بسرعة ويصحح لزملائه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يحل المعلم مثال 1 ص 21 بالطريقتين (التناسب، والضرب في π/180 أو 180/π) ويبرز متى نكتب الناتج بدلالة π، ويتابع الطالب ويدوّن الطريقتين ويستنتج قاعدتي التحويل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق تعاوني: يوزع المعلم بطاقات مطابقة (زاوية بالدرجات ↔ قياسها بالراديان) على المجموعات، وتطابق المجموعة البطاقات وتبرر مطابقتين أمام الصف (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تدريب فردي: يكلف المعلم بحل تمارين 1-1: 1، 2، 3 (أ، ب) ص ⁦22–23⁩ ويتجول للمتابعة، ويحل الطالب فرديًا ويقرب إلى 3 أرقام معنوية عند الحاجة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي: يعرض المعلم أسئلة الختام ويغلق الحصة بقاعدتي التحويل، ويجيب الطالب ويصحح ذاتيًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم سؤال الحاسبة ويستقبل تفسيرات الطلبة، ويجرب الطالب على الحاسبة ويقارن النتائج (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يوضح المعلم ضبط الحاسبة على RAD ص 22 ويحسب أمثلة جا(π/6)، جتا(0.9)، ويطبق الطالب الخطوات على حاسبته (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مسألة: يحل المعلم مثال 2 ص 22 (حساب ضلع في مثلث زاويته 0.6 راديان) دون التحويل إلى الدرجات، ويشارك الطالب في خطوات الحل ويكتبها (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تطبيق تعاوني: يكلف المجموعات بحل تمارين 1-1: 6، 7 ص 23، وتحل المجموعة وتعرض حلًا واحدًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «حوّل 5π/9 إلى الدرجات»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس رغيف الرخال: تتخيل المجموعات خبز الرخال العماني الدائري، وتقص من ورقة دائرية قوسًا طوله يساوي نصف القطر لتعيين زاوية راديان واحد، ثم تقدّر عدد هذه الأقواس في نصف الرغيف وتقارنه بالعدد π (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n1) [مستوى المعرفة] ما قياس الزاوية المركزية التي تحصر قوسًا طوله يساوي طول نصف قطر الدائرة؟\nالإجابة النموذجية: 1 راديان.\n2) [مستوى التطبيق] اكتب قياس الزاوية 90° بدلالة π.\nالإجابة النموذجية: π/2\n3) [مستوى الاستدلال] كم راديانًا تساوي الدورة الكاملة؟ ولماذا؟\nالإجابة النموذجية: 2π راديان؛ لأن المحيط 2π نق، أي إن المحيط يحوي 2π من أنصاف الأقطار.\n\nالحصة 2: التحويل بين الدرجات والراديان\n1) [مستوى المعرفة] حوّل 60° إلى الراديان بدلالة π.\nالإجابة النموذجية: 60 × π/180 = π/3\n2) [مستوى التطبيق] حوّل 5π/9 إلى الدرجات.\nالإجابة النموذجية: 5π/9 × 180/π = 100°\n3) [مستوى الاستدلال] حوّل 210° إلى الراديان بدلالة π.\nالإجابة النموذجية: 210 × π/180 = 7π/6\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n1) [مستوى المعرفة] ما قيمة جا(π/6)؟\nالإجابة النموذجية: 0.5\n2) [مستوى التطبيق] أوجد جتا(0.9) مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 0.622\n3) [مستوى الاستدلال] مثلث قائم الزاوية طول وتره 12 سم وإحدى زواياه 0.7 راديان. أوجد طول الضلع المقابل لهذه الزاوية.\nالإجابة النموذجية: 12 جا(0.7) ≈ 7.73 سم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n1) [مستوى المعرفة] أكمل: π راديان = .......°\nالإجابة النموذجية: 180\n2) [مستوى التطبيق] حوّل 45° و 270° إلى الراديان بدلالة π.\nالإجابة النموذجية: 45° = π/4 ، 270° = 3π/2\n3) [مستوى الاستدلال] هل الزاوية التي قياسها 1 راديان أكبر أم أصغر من 60°؟ برّر.\nالإجابة النموذجية: أصغر؛ لأن 1 راديان = 180/π ≈ 57.3° < 60°.\n\nالحصة 2: التحويل بين الدرجات والراديان\n1) [مستوى المعرفة] حوّل π/6 إلى الدرجات.\nالإجابة النموذجية: 30°\n2) [مستوى التطبيق] حوّل 0.8 راديان إلى الدرجات مقربًا إلى أقرب منزلة عشرية.\nالإجابة النموذجية: 0.8 × 180/π ≈ 45.8°\n3) [مستوى الاستدلال] حوّل 320° إلى الراديان مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 320 × π/180 ≈ 5.59 راديان\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n1) [مستوى المعرفة] على أي وضع تُضبط الحاسبة لحساب جتا(1.2)؟\nالإجابة النموذجية: وضع الراديان RAD.\n2) [مستوى التطبيق] أوجد ظا(1.5) مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 14.1\n3) [مستوى الاستدلال] مثلث قائم الزاوية طول الضلع المجاور لزاوية قياسها π/5 يساوي 8 سم. أوجد طول الضلع المقابل.\nالإجابة النموذجية: 8 ظا(π/5) ≈ 5.81 سم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nإرشاد للطالب: قراءة تعريف الراديان والنتيجتين 1 و 2 ص 20 من كتاب الطالب، وحفظ جدول الزوايا الخاصة ص 21.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التحويل بين الدرجات والراديان\nإرشاد للطالب: مراجعة مثال 1 ص 21، وحل تمارين 1-1 (3، 4، 5) ص 23 من كتاب الطالب، وتمارين 1-1 (1، 2) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nإرشاد للطالب: حل تمارين 1-1 (6، 8) ص 23 من كتاب الطالب، وتمارين 1-1 (⁦3–6⁩) ص ⁦14–16⁩ من كتاب النشاط، والتأكد من ضبط الحاسبة على الوضع المناسب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=1"]}, {"id": "2-1", "title": "طول القوس", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦24–27⁩", "wbp": "⁦17–19⁩", "p": [{"t": "القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يميّز بين القوس والوتر والقطاع الدائري والقطعة الدائرية (الصغرى والكبرى) (10 دقائق)\n2) يستنتج قانون طول القوس ل = نق × هـ عندما تُقاس هـ بالراديان، ويستخدمه (15 دقيقة)\nمخرج تعليمي آخر: يعبّر عن طول القوس بدلالة π (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم بالنمذجة", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "القوس الأصغر والأكبر، الوتر، القطاع الدائري، القطعة الدائرية، طول القوس ل = نق هـ", "ينفذ الطلبة استكشف 1 ص 24: مناقشة معاني الكلمات (قطعة دائرية، قطاع دائري، قوس، وتر) من خلال الشكل.", "1. التهيئة (استكشف 1): يعرض المعلم الشكل ص 24 ويدير نقاشًا حول المصطلحات، ويشرح كل مصطلح بلغته ويشير إليه على الشكل (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يقود الطلبة لاستنتاج أن طول القوس يتناسب مع الزاوية: زاوية 1 راديان ← قوس نق، فزاوية هـ ← قوس نق هـ، ويستنتج الطالب القانون ويقارنه بقانون الدرجات (س/360) × 2π نق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النمذجة: يحل المعلم مثال 3 ص 25 (نق = 15 سم، هـ = π/3)، ويتابع الطالب ويكتب الحل بدلالة π (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تدريب تشاركي: يكلف الأزواج بحل تمارين 2-1: 1 (أ–د) ص 26، ويحل الطالب مع زميله ويتبادلان التصحيح (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: يطرح المعلم أسئلة الختام ويلخص القانون وشرطه، ويجيب الطالب فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] في الشكل: ما الفرق بين القوس الأصغر والوتر الذي يحصره؟\nالإجابة النموذجية: القوس جزء من محيط الدائرة، والوتر قطعة مستقيمة تصل بين طرفي القوس.\n2) [مستوى التطبيق] أوجد طول القوس في دائرة نصف قطرها 8 سم يقابل زاوية مركزية π/4.\nالإجابة النموذجية: ل = 8 × π/4 = 2π سم\n3) [مستوى الاستدلال] لماذا لا يصح القانون ل = نق هـ إذا كانت هـ بالدرجات؟ وما الصيغة المكافئة بالدرجات؟\nالإجابة النموذجية: لأن القانون مبني على تعريف الراديان؛ وبالدرجات: ل = (هـ/360) × 2π نق.", "1) [مستوى المعرفة] أوجد طول القوس الذي يقابل زاوية مركزية 2 راديان في دائرة نصف قطرها 6 سم.\nالإجابة النموذجية: 12 سم\n2) [مستوى التطبيق] أوجد طول القوس بدلالة π: نق = 7 سم، هـ = π/3.\nالإجابة النموذجية: 7π/3 سم\n3) [مستوى الاستدلال] أوجد طول القوس بدلالة π: نق = 24 سم، هـ = 7π/8.\nالإجابة النموذجية: 21π سم", "إرشاد للطالب: مراجعة استكشف 1 ومثال 3 ص ⁦24–25⁩، وحل تمارين 2-1 (1، 2) ص 26 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=2"]}, {"t": "إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يجد نصف القطر أو قياس الزاوية المركزية بمعلومية طول القوس (15 دقيقة)\n2) يجد محيط القطاع الدائري = 2نق + نق هـ (10 دقائق)\nمخرج تعليمي آخر: يوظف طول القوس في حل مسائل حياتية (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، صورة توضيحية", "طول القوس، نصف القطر، الزاوية المركزية بالراديان، محيط القطاع الدائري", "سؤال سريع: «قوس طوله 10 سم في دائرة نصف قطرها 5 سم؛ كم راديانًا قياس زاويته؟» لتثبيت فكرة إعادة ترتيب القانون.", "1. التهيئة: يطرح المعلم السؤال ويوجه إلى إعادة ترتيب القانون، ويجيب الطالب: هـ = 2 راديان (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 4 ص 25 (إيجاد نق) ويناقش مكونات محيط القطاع (نصفا قطر + قوس)، ويتابع الطالب ويرسم القطاع ويحدد مكونات محيطه (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق تعاوني: يكلف المجموعات بتمارين 2-1: 3، 4، 5 ص 26 (ومنها مسألة العجلة الدوارة)، وتحل المجموعة وتعرض مسألة العجلة الدوارة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تدريب فردي: يكلف المعلم بحل تمرين من كتاب النشاط تمارين 2-1 ص 17، ويحل الطالب ويقارن بإجابة زميله (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة الختام، ويجيب الطالب فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] قطاع دائري طول قوسه 12 سم وقياس زاويته 1.5 راديان. أوجد نصف القطر.\nالإجابة النموذجية: نق = 12 ÷ 1.5 = 8 سم\n2) [مستوى التطبيق] أوجد قياس زاوية القطاع بالراديان إذا كان نق = 10 سم وطول القوس 5 سم.\nالإجابة النموذجية: هـ = 5/10 = 0.5 راديان\n3) [مستوى الاستدلال] أوجد محيط قطاع دائري نصف قطره 5 سم وقياس زاويته 1.2 راديان.\nالإجابة النموذجية: 2(5) + 5(1.2) = 16 سم", "1) [مستوى المعرفة] أوجد طول القوس: نق = 10 سم، هـ = 1.3 راديان.\nالإجابة النموذجية: 13 سم\n2) [مستوى التطبيق] نق = 12 سم، طول القوس 9.6 سم. أوجد هـ.\nالإجابة النموذجية: 0.8 راديان\n3) [مستوى الاستدلال] عجلة دوّارة قطرها 158.5 م دارت بزاوية π/16. أوجد المسافة التي يقطعها راكب على محيطها.\nالإجابة النموذجية: نق = 79.25 م، ل = 79.25 × π/16 ≈ 15.6 م", "إرشاد للطالب: حل تمارين 2-1 (5، 6) ص ⁦26–27⁩ من كتاب الطالب، وتمارين 2-1 (⁦1–4⁩) ص ⁦17–18⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=2"]}, {"t": "مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يحسب طول الوتر باستخدام قانون جيب التمام أو النسب المثلثية مع الزوايا بالراديان (20 دقيقة)\n2) يحل مسائل تتضمن محيط مناطق مظللة مكوّنة من أقواس وقطع مستقيمة (10 دقائق)\nمخرج تعليمي آخر: يبرهن علاقات هندسية تتضمن طول القوس (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "طول الوتر = 2نق جا(هـ/2)، المماس عمودي على نصف القطر، محيط القطعة الدائرية، المنطقة المظللة", "مراجعة قانوني الجيب وجيب التمام في المثلث، وخاصية المماس العمودي على نصف القطر عند نقطة التماس.", "1. التهيئة: يراجع المعلم القوانين المطلوبة بأسئلة شفوية، ويتذكر الطالب القوانين ويكتبها (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 5 ص ⁦25–26⁩ خطوة بخطوة، ويبرز تقسيم المثلث المتطابق الضلعين إلى مثلثين قائمين، ويتابع الطالب ويقترح طريقة بديلة لإيجاد الوتر (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مشكلات تعاوني: يوزع المعلم تمارين 2-1: 6، 7، 8 ص 27 على المجموعات، وتحل كل مجموعة مسألة وتشرحها للصف (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تحدٍّ: يعرض المعلم تمرين 9 ص 27 للطلبة المتقدمين، ويحاول الطالب إثبات العلاقة المطلوبة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس بوابة القلعة: تحسب كل مجموعة طول قوس زخرفي يزيّن بوابة قلعة عمانية بنصف قطر وزاوية بالراديان تختارهما، وتميّز على رسمها القوس والوتر والقطاع والقطعة، ثم تعرض مجموعة حلها والبقية تتحقق منه (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "1) [مستوى المعرفة] أوجد طول القوس في دائرة نصف قطرها 7 سم يقابل زاوية 2 راديان.\nالإجابة النموذجية: 14 سم\n2) [مستوى التطبيق] أوجد طول الوتر المقابل للزاوية المركزية 2 راديان في الدائرة نفسها.\nالإجابة النموذجية: 2 × 7 × جا(1) ≈ 11.78 سم\n3) [مستوى الاستدلال] أوجد محيط القطعة الدائرية الصغرى المحصورة بين القوس والوتر السابقين.\nالإجابة النموذجية: 14 + 11.78 ≈ 25.78 سم", "1) [مستوى المعرفة] نق = 6 سم، هـ = π/2. أوجد طول القوس.\nالإجابة النموذجية: 3π ≈ 9.42 سم\n2) [مستوى التطبيق] أوجد طول الوتر المقابل لهذه الزاوية.\nالإجابة النموذجية: 6√2 ≈ 8.49 سم\n3) [مستوى الاستدلال] أوجد محيط القطعة الدائرية الصغرى.\nالإجابة النموذجية: 3π + 6√2 ≈ 17.91 سم", "إرشاد للطالب: حل تمارين 2-1 (7، 8، 9) ص 27 من كتاب الطالب، وتمارين 2-1 (⁦5–9⁩) ص ⁦18–19⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الوا ، ويجيب الطالب فرديًا (5 دقائق)\nالاستراتيجيات: ومحيط القطاع الدائري.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال ويوجه إلى إعادة ترتيب القانون، ويجيب الطالب: هـ = 2 راديان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: يحل المعلم مثال 4 ص 25 (إيجاد نق) ويناقش مكونات محيط القطاع (نصفا قطر + قوس)، ويتابع الطالب ويرسم القطاع ويحدد مكونات محيطه (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تطبيق تعاوني: يكلف المجموعات بتمارين 2-1: 3، 4، 5 ص 26 (ومنها مسألة العجلة الدوارة)، وتحل المجموعة وتعرض مسألة العجلة الدوارة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تدريب فردي: يكلف المعلم بحل تمرين من كتاب النشاط تمارين 2-1 ص 17، ويحل الطالب ويقارن بإجابة زميله (8 دقائق)\nالاستراتيجيات: واستنتاج قانون طول القوس.\n\n5. التقويم الختامي: يطرح المعلم أسئلة الختام، ويجيب الطالب فرديًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يراجع المعلم القوانين المطلوبة بأسئلة شفوية، ويتذكر الطالب القوانين ويكتبها (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. النمذجة: يحل المعلم مثال 5 ص ⁦25–26⁩ خطوة بخطوة، ويبرز تقسيم المثلث المتطابق الضلعين إلى مثلثين قائمين، ويتابع الطالب ويقترح طريقة بديلة لإيجاد الوتر (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. حل مشكلات تعاوني: يوزع المعلم تمارين 2-1: 6، 7، 8 ص 27 على المجموعات، وتحل كل مجموعة مسألة وتشرحها للصف (11 دقيقة)\nالاستراتيجيات: ومحيط القطاع الدائري.\n\n4. تحدٍّ: يعرض المعلم تمرين 9 ص 27 للطلبة المتقدمين، ويحاول الطالب إثبات العلاقة المطلوبة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «أوجد طول القوس بدلالة π: نق = 7 سم، هـ = π/3»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس بوابة القلعة: تحسب كل مجموعة طول قوس زخرفي يزيّن بوابة قلعة عمانية بنصف قطر وزاوية بالراديان تختارهما، وتميّز على رسمها القوس والوتر والقطاع والقطعة، ثم تعرض مجموعة حلها والبقية تتحقق منه (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس\n1) [مستوى المعرفة] في الشكل: ما الفرق بين القوس الأصغر والوتر الذي يحصره؟\nالإجابة النموذجية: القوس جزء من محيط الدائرة، والوتر قطعة مستقيمة تصل بين طرفي القوس.\n2) [مستوى التطبيق] أوجد طول القوس في دائرة نصف قطرها 8 سم يقابل زاوية مركزية π/4.\nالإجابة النموذجية: ل = 8 × π/4 = 2π سم\n3) [مستوى الاستدلال] لماذا لا يصح القانون ل = نق هـ إذا كانت هـ بالدرجات؟ وما الصيغة المكافئة بالدرجات؟\nالإجابة النموذجية: لأن القانون مبني على تعريف الراديان؛ وبالدرجات: ل = (هـ/360) × 2π نق.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\n1) [مستوى المعرفة] قطاع دائري طول قوسه 12 سم وقياس زاويته 1.5 راديان. أوجد نصف القطر.\nالإجابة النموذجية: نق = 12 ÷ 1.5 = 8 سم\n2) [مستوى التطبيق] أوجد قياس زاوية القطاع بالراديان إذا كان نق = 10 سم وطول القوس 5 سم.\nالإجابة النموذجية: هـ = 5/10 = 0.5 راديان\n3) [مستوى الاستدلال] أوجد محيط قطاع دائري نصف قطره 5 سم وقياس زاويته 1.2 راديان.\nالإجابة النموذجية: 2(5) + 5(1.2) = 16 سم\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\n1) [مستوى المعرفة] أوجد طول القوس في دائرة نصف قطرها 7 سم يقابل زاوية 2 راديان.\nالإجابة النموذجية: 14 سم\n2) [مستوى التطبيق] أوجد طول الوتر المقابل للزاوية المركزية 2 راديان في الدائرة نفسها.\nالإجابة النموذجية: 2 × 7 × جا(1) ≈ 11.78 سم\n3) [مستوى الاستدلال] أوجد محيط القطعة الدائرية الصغرى المحصورة بين القوس والوتر السابقين.\nالإجابة النموذجية: 14 + 11.78 ≈ 25.78 سم", "الحصة 1: القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس\n1) [مستوى المعرفة] أوجد طول القوس الذي يقابل زاوية مركزية 2 راديان في دائرة نصف قطرها 6 سم.\nالإجابة النموذجية: 12 سم\n2) [مستوى التطبيق] أوجد طول القوس بدلالة π: نق = 7 سم، هـ = π/3.\nالإجابة النموذجية: 7π/3 سم\n3) [مستوى الاستدلال] أوجد طول القوس بدلالة π: نق = 24 سم، هـ = 7π/8.\nالإجابة النموذجية: 21π سم\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\n1) [مستوى المعرفة] أوجد طول القوس: نق = 10 سم، هـ = 1.3 راديان.\nالإجابة النموذجية: 13 سم\n2) [مستوى التطبيق] نق = 12 سم، طول القوس 9.6 سم. أوجد هـ.\nالإجابة النموذجية: 0.8 راديان\n3) [مستوى الاستدلال] عجلة دوّارة قطرها 158.5 م دارت بزاوية π/16. أوجد المسافة التي يقطعها راكب على محيطها.\nالإجابة النموذجية: نق = 79.25 م، ل = 79.25 × π/16 ≈ 15.6 م\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\n1) [مستوى المعرفة] نق = 6 سم، هـ = π/2. أوجد طول القوس.\nالإجابة النموذجية: 3π ≈ 9.42 سم\n2) [مستوى التطبيق] أوجد طول الوتر المقابل لهذه الزاوية.\nالإجابة النموذجية: 6√2 ≈ 8.49 سم\n3) [مستوى الاستدلال] أوجد محيط القطعة الدائرية الصغرى.\nالإجابة النموذجية: 3π + 6√2 ≈ 17.91 سم", "الحصة 1: القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس\nإرشاد للطالب: مراجعة استكشف 1 ومثال 3 ص ⁦24–25⁩، وحل تمارين 2-1 (1، 2) ص 26 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري\nإرشاد للطالب: حل تمارين 2-1 (5، 6) ص ⁦26–27⁩ من كتاب الطالب، وتمارين 2-1 (⁦1–4⁩) ص ⁦17–18⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة\nإرشاد للطالب: حل تمارين 2-1 (7، 8، 9) ص 27 من كتاب الطالب، وتمارين 2-1 (⁦5–9⁩) ص ⁦18–19⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=2"]}, {"id": "3-1", "title": "مساحة القطاع الدائري", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦28–36⁩", "wbp": "⁦20–28⁩", "p": [{"t": "استنتاج قانون مساحة القطاع الدائري", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يستنتج قانون مساحة القطاع الدائري م = ½ نق² هـ باستخدام التناسب (15 دقيقة)\n2) يحسب مساحة القطاع الدائري بدلالة π أو بقيمة تقريبية (10 دقائق)\nمخرج تعليمي آخر: يقارن بين صيغتي المساحة بالدرجات وبالراديان (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "القطاع الدائري، مساحة القطاع = ½ نق² هـ، التناسب، مساحة الدائرة", "سؤال: «ما مساحة نصف دائرة نصف قطرها 4 سم؟ وربعها؟» ثم «ما مساحة قطاع زاويته π/3 في الدائرة نفسها؟» لربط الجزء بالكل.", "1. التهيئة: يطرح المعلم أسئلة أجزاء الدائرة، ويحسب الطالب مساحة النصف والربع ويقترح طريقة للقطاع (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يقود الطلبة لكتابة التناسب: زاوية القطاع/2π = مساحة القطاع/π نق²، ثم يبسطها إلى ½ نق² هـ، ويستنتج الطالب القانون ويكتب النتيجة 5 ص 28 (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. استكشف 2: ينفذ المعلم استكشف 2 ص 28 بالدرجات ثم يقارن بالقانون الجديد، ويكتب الطالب عبارة لمساحة القطاع الأصغر بدلالة نق، س (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. النمذجة والتدريب: يحل المعلم مثال 6 ص 28 ويكلف بتمارين 3-1: 1 ص 31، ويحل الطالب في أزواج ويقارن (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: أسئلة الختام وتلخيص القانون، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] أكمل: مساحة القطاع الدائري = ........ (هـ بالراديان)\nالإجابة النموذجية: ½ نق² هـ\n2) [مستوى التطبيق] أوجد بدلالة π مساحة قطاع زاويته π/6 في دائرة نصف قطرها 9 سم.\nالإجابة النموذجية: ½ × 81 × π/6 = 27π/4 سم²\n3) [مستوى الاستدلال] بيّن أن قانون مساحة القطاع يعطي مساحة الدائرة عندما هـ = 2π.\nالإجابة النموذجية: ½ نق² × 2π = π نق²", "1) [مستوى المعرفة] أوجد مساحة قطاع: نق = 4 سم، هـ = 2 راديان.\nالإجابة النموذجية: 16 سم²\n2) [مستوى التطبيق] أوجد بدلالة π مساحة قطاع: نق = 12 سم، هـ = 5π/6.\nالإجابة النموذجية: 60π سم²\n3) [مستوى الاستدلال] قطاعان في الدائرة نفسها، زاوية الأول ضعف زاوية الثاني. ما النسبة بين مساحتيهما؟ برّر.\nالإجابة النموذجية: 2 : 1؛ لأن المساحة تتناسب طرديًا مع هـ عند ثبوت نق.", "إرشاد للطالب: قراءة النتيجة 5 ومثال 6 ص 28، وحل تمارين 3-1 (1) ص 31 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=3"]}, {"t": "إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يجد نصف القطر أو قياس الزاوية بمعلومية مساحة القطاع الدائري (10 دقائق)\n2) يربط بين طول القوس ومساحة القطاع في مسألة واحدة (20 دقيقة)\nمخرج تعليمي آخر: يستنتج العلاقة م = ½ نق ل (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام", "مساحة القطاع، طول القوس، الزاوية المركزية، نصف القطر", "مراجعة سريعة: «قطاع مساحته 12 سم² ونصف قطره 4 سم، كيف نجد زاويته؟»", "1. التهيئة: يطرح المعلم السؤال ويوجه لإعادة ترتيب القانون، ويجد الطالب هـ = 1.5 راديان (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم تمرين 3-1: 3 (أ) و 4 ص 32 مع الطلبة، ويبرز العلاقة م = ½ نق × ل، ويتابع الطالب ويستنتج العلاقة بين المساحة وطول القوس (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المجموعات بتمارين 3-1: 2، 3 (ب) ص ⁦31–32⁩، وتحل المجموعات وتتبادل الحلول للتصحيح (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تعلم ذاتي: يكلف المعلم بحل تمارين 3-1 (1، 2) من كتاب النشاط ص 20، ويحل الطالب ذاتيًا ويستعين بالأمثلة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] قطاع دائري نصف قطره 4 سم ومساحته 9 سم². أوجد زاويته.\nالإجابة النموذجية: هـ = 2م/نق² = 18/16 = 1.125 راديان\n2) [مستوى التطبيق] قطاع دائري زاويته 0.5 راديان ومساحته 25 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 2 × 25 ÷ 0.5 = 100 ← نق = 10 سم\n3) [مستوى الاستدلال] قطاع نصف قطره 8 سم وطول قوسه 10 سم. أوجد زاويته ومساحته.\nالإجابة النموذجية: هـ = 1.25 راديان، م = ½ × 64 × 1.25 = 40 سم²", "1) [مستوى المعرفة] قطاع نصف قطره 6 سم ومساحته 27 سم². أوجد زاويته.\nالإجابة النموذجية: 1.5 راديان\n2) [مستوى التطبيق] أوجد مساحة قطاع نصف قطره 10 سم وطول قوسه 7 سم.\nالإجابة النموذجية: م = ½ × 10 × 7 = 35 سم²\n3) [مستوى الاستدلال] قطاع محيطه 20 سم ونصف قطره 5 سم. أوجد مساحته.\nالإجابة النموذجية: ل = 20 − 10 = 10، م = ½ × 5 × 10 = 25 سم²", "إرشاد للطالب: حل تمارين 3-1 (3، 4) ص 32 من كتاب الطالب، وتمارين 3-1 (⁦1–3⁩) ص 20 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=3"]}, {"t": "مساحة القطعة الدائرية", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يحسب مساحة المثلث المحصور بين نصفي القطر والوتر باستخدام ½ أ ب جا ج (15 دقيقة)\n2) يحسب مساحة القطعة الدائرية الصغرى والكبرى (10 دقائق)\nمخرج تعليمي آخر: يستنتج صيغة مختصرة لمساحة القطعة الدائرية (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، صورة توضيحية، الأقلام", "القطعة الدائرية الصغرى، القطعة الدائرية الكبرى، مساحة المثلث = ½ أ ب جا ج، مساحة القطعة = ½ نق²(هـ − جا هـ)", "يعرض صورة شريحة بيتزا قُطعت بخط مستقيم ويسأل: «كيف نحسب مساحة الجزء الذي بين الحافة والقطع؟»", "1. التهيئة: يعرض المعلم الصورة ويستقبل الأفكار، ويقترح الطالب: مساحة القطاع − مساحة المثلث (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 7 ص 29 (نق = 6، هـ = 1.2) لجميع المطلوب، ويستنتج القانون المختصر للقطعة، ويحسب الطالب الخطوات على الحاسبة في وضع الراديان (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المجموعات بتمارين 3-1: 5، 6 ص 32، وتحل وتعرض (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تدريب فردي: يكلف المعلم بتمارين 3-1 (4، 5) من كتاب النشاط ص 21، ويحل الطالب فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد مساحة المثلث المحصور بين نصفي قطرين طول كل منهما 6 سم والزاوية بينهما 1.2 راديان.\nالإجابة النموذجية: ½ × 36 × جا 1.2 ≈ 16.8 سم²\n2) [مستوى التطبيق] أوجد مساحة القطعة الدائرية الصغرى المقابلة لتلك الزاوية.\nالإجابة النموذجية: 21.6 − 16.8 = 4.8 سم²\n3) [مستوى الاستدلال] أوجد مساحة القطعة الدائرية الكبرى في الدائرة نفسها.\nالإجابة النموذجية: π × 36 − 4.8 ≈ 108.3 سم²", "1) [مستوى المعرفة] أوجد مساحة القطاع: نق = 10 سم، هـ = π/2.\nالإجابة النموذجية: 25π ≈ 78.5 سم²\n2) [مستوى التطبيق] أوجد مساحة القطعة الصغرى في القطاع السابق.\nالإجابة النموذجية: 25π − 50 ≈ 28.5 سم²\n3) [مستوى الاستدلال] بيّن أن مساحة القطعة الدائرية = ½ نق²(هـ − جا هـ).\nالإجابة النموذجية: ½ نق² هـ − ½ نق² جا هـ = ½ نق²(هـ − جا هـ)", "إرشاد للطالب: مراجعة مثال 7 ص 29، وحل تمارين 3-1 (5، 6) ص 32 من كتاب الطالب، وتمارين 3-1 (⁦4–6⁩) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=3"]}, {"t": "مسائل المناطق المظللة (أقواس وقطع ومثلثات)", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يحلل المنطقة المظللة إلى أجزاء (قطاعات، مثلثات، قطع دائرية) لحساب محيطها ومساحتها (15 دقيقة)\n2) يعبر عن المحيط والمساحة بدلالة نق أو π في صورة مبسطة (15 دقيقة)\nمخرج تعليمي آخر: يقترح أكثر من طريقة لتقسيم المنطقة المظللة ويقارن بينها (10 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، صورة توضيحية", "المنطقة المظللة، تقسيم الشكل، ظا الزاوية في المثلث القائم، الزاوية المستقيمة", "يعرض شكل مثال 8 ص 30 (مربع وقوسان) ويسأل: «من أي أجزاء تتكون المنطقة المظللة؟»", "1. التهيئة: يعرض المعلم الشكل ويطلب تحليل المنطقة، ويقترح الطالب التقسيم إلى قطعتين دائريتين (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 8 ص 30 ثم يناقش فكرة مثال 9 ص 31 (الزاوية π/2 − ...)، ويتابع الطالب ويكتب الحل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مشكلات تعاوني: يوزع المعلم تمارين 3-1: 7، 8، 9، 10 ص ⁦32–33⁩ على المجموعات (تمرين لكل مجموعة)، وتحل المجموعة وتعد عرضًا قصيرًا للحل (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. عرض تشاركي: يدير المعلم عرض الحلول ويصوب الأخطاء، وتعرض كل مجموعة خطوات حلها (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] مربع طول ضلعه نق رُسم بداخله قوسان من مركزين في رأسين متقابلين. ما مكونات محيط المنطقة المظللة بينهما؟\nالإجابة النموذجية: قوسان، كل منهما ربع دائرة نصف قطرها نق.\n2) [مستوى التطبيق] أوجد محيط المنطقة المظللة السابقة بدلالة نق.\nالإجابة النموذجية: 2 × (نق × π/2) = π نق\n3) [مستوى الاستدلال] أوجد مساحة المنطقة المظللة السابقة بدلالة نق.\nالإجابة النموذجية: 2(¼ π نق² − ½ نق²) = نق²(π/2 − 1)", "1) [مستوى المعرفة] دائرة نصف قطرها 1 داخل مربع تمس أضلاعه. أوجد المساحة داخل المربع وخارج الدائرة.\nالإجابة النموذجية: 4 − π\n2) [مستوى التطبيق] قطاع نصف قطره 8 سم وزاويته π/3. أوجد مساحة القطعة الصغرى بدلالة π و √3.\nالإجابة النموذجية: 32π/3 − 16√3 سم²\n3) [مستوى الاستدلال] مثلث متطابق الأضلاع طول ضلعه 6 سم رسم قوس من أحد رؤوسه نصف قطره 6 سم. أوجد مساحة القطعة المحصورة بين القوس والضلع المقابل.\nالإجابة النموذجية: 6π − 9√3 ≈ 3.26 سم²", "إرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦30–31⁩، وحل تمارين 3-1 (11، 12، 13) ص 33 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=3"]}, {"t": "مراجعة الوحدة الأولى (كتاب الطالب)", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يراجع مفاهيم الوحدة (الراديان، طول القوس، مساحة القطاع) من خلال قائمة التحقق ص 34 (15 دقيقة)\n2) يحل مسائل مراجعة متنوعة تجمع مهارات الوحدة (15 دقيقة)\nمخرج تعليمي آخر: يقيّم مستوى تمكنه من مهارات الوحدة ذاتيًا (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، أخرى: بطاقات عمل", "الراديان، طول القوس، مساحة القطاع، القطعة الدائرية، المنطقة المظللة", "نشاط «قائمة التحقق» ص 34: يقيّم كل طالب نفسه في كل مهارة (أستطيع / أحتاج إلى مراجعة).", "1. التهيئة: يوزع المعلم قائمة التحقق ويطلب التقييم الذاتي، ويقيّم الطالب نفسه ويحدد المهارات التي يحتاج إليها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مراجعة مركزة: يلخص المعلم قوانين الوحدة بخريطة مفاهيم على السبورة، ويكمل الطالب الخريطة مع المعلم (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تعاوني (مجموعات متجانسة): يوزع المعلم تمارين المراجعة ص ⁦35–36⁩ حسب المستوى: (1، 2، 3) للدعم، (4، 5، 6) للمتوقع، (7، 8، 9) للمتقدم، وتحل كل مجموعة تمارينها وتقدم حلًا نموذجيًا (17 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. مناقشة: يناقش المعلم الأخطاء الشائعة (استخدام الدرجات في القانون، نسيان نصفي القطر في المحيط)، ويصحح الطالب أخطاءه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] حوّل 135° إلى الراديان بدلالة π.\nالإجابة النموذجية: 3π/4\n2) [مستوى التطبيق] قطاع نصف قطره 9 سم وزاويته 2π/3. أوجد طول قوسه ومساحته بدلالة π.\nالإجابة النموذجية: ل = 6π سم، م = 27π سم²\n3) [مستوى الاستدلال] سلك طوله 24 سم شُكّل منه قطاع دائري نصف قطره نق. بيّن أن مساحته م = 12نق − نق².\nالإجابة النموذجية: ل = 24 − 2نق، م = ½ نق ل = 12نق − نق²", "1) [مستوى المعرفة] حوّل 7π/4 إلى الدرجات.\nالإجابة النموذجية: 315°\n2) [مستوى التطبيق] قطاع زاويته 1.4 راديان ومساحته 70 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 100 ← نق = 10 سم\n3) [مستوى الاستدلال] في المسألة السابقة (السلك 24 سم)، أوجد أكبر مساحة ممكنة للقطاع.\nالإجابة النموذجية: م = 36 − (نق − 6)² ← أكبر مساحة 36 سم² عند نق = 6", "إرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الأولى (⁦1–6⁩) ص ⁦35–36⁩ من كتاب الطالب، ومراجعة قائمة التحقق ص 34.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=3"]}, {"t": "مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام", "w": "الأسبوع الثاني (⁦13–17/9/2026⁩م)", "f": ["1) يطبق مهارات الوحدة الأولى في حل تمارين كتاب النشاط (15 دقيقة)\n2) يحل مسائل تتطلب الربط بين القياس الدائري والمثلثات (10 دقائق)\nمخرج تعليمي آخر: يتعاون مع زملائه في التنافس العلمي ويحترم دوره (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام", "القياس الدائري، طول القوس، مساحة القطاع والقطعة، المحيط", "سؤال سريع «صحح الخطأ»: كتب طالب طول القوس لزاوية 60° في دائرة نصف قطرها 3 سم = 180 سم. أين الخطأ؟", "1. التهيئة: يعرض المعلم سؤال «صحح الخطأ»، ويكتشف الطالب الخطأ: يجب التحويل إلى π/3 فيكون ل = π سم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تدريب كتاب النشاط: يكلف المجموعات بتمارين مراجعة نهاية الوحدة الأولى ص ⁦23–26⁩ من كتاب النشاط مع متابعة فردية للطلبة المحتاجين، ويحل الطالب ويناقش مع مجموعته (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يعرض المعلم الحلول النموذجية لأبرز التمارين، ويصحح الطالب ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – صينية حلوى الضيافة: تقسّم المجموعات صينية حلوى عمانية دائرية إلى قطاعات بزوايا مختلفة بالراديان، وتحسب مساحة كل قطاع بالقانون م = ½ نق² هـ، ثم تتحدث عن عادة تقديم الحلوى مع القهوة إكرامًا للضيف (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ما طول القوس المقابل لزاوية 60° في دائرة نصف قطرها 3 سم؟\nالإجابة النموذجية: π سم\n2) [مستو دقائق)\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n1) يراجع مفاهيم الوحدة (الراديان، طول القوس، مساحة القطاع) من خلال قائمة التحقق ص 34 (15 دقيقة)\n2) يحل مسائل مراجعة متنوعة تجمع مهارات الوحدة (15 دقيقة)\nمخرج تعليمي آخر: يقيّم مستوى تمكنه من مهارات الوحدة ذاتيًا (10 دقائق)\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n1) يطبق مهارات الوحدة الأولى في حل تمارين كتاب النشاط (15 دقيقة)\n2) يحل مسائل تتطلب الربط بين القياس الدائري والمثلثات (10 دقائق)\nمخرج تعليمي آخر: يتعاون مع زملائه في التنافس العلمي ويحترم دوره (15 دقيقة)", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل\n\nالحصة 3: مساحة القطعة الدائرية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\nالمخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\nالتعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي\n\nالحصة 3: مساحة القطعة الدائرية\nالتعلم بالنمذجة، التعلم التعاوني، التعلم بالاكتشاف\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم التشاركي\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\nالتعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\nالكتاب، السبورة الذكية، صورة توضيحية، الأقلام\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\nالكتاب، السبورة ال لى مراجعة).\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\nسؤال سريع «صحح الخطأ»: كتب طالب طول القوس لزاوية 60° في دائرة نصف قطرها 3 سم = 180 سم. أين الخطأ؟", "الحصة 1: استنتاج قانون مساحة القطاع الدائري — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم أسئلة أجزاء الدائرة، ويحسب الطالب مساحة النصف والربع ويقترح طريقة للقطاع (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يقود الطلبة لكتابة التناسب: زاوية القطاع/2π = مساحة القطاع/π نق²، ثم يبسطها إلى ½ نق² هـ، ويستنتج الطالب القانون ويكتب النتيجة 5 ص 28 (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. استكشف 2: ينفذ المعلم استكشف 2 ص 28 بالدرجات ثم يقارن بالقانون الجديد، ويكتب الطالب عبارة لمساحة القطاع الأصغر بدلالة نق، س (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. النمذجة والتدريب: يحل المعلم مثال 6 ص 28 ويكلف بتمارين 3-1: 1 ص 31، ويحل الطالب في أزواج ويقارن (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الغلق: أسئلة الختام وتلخيص القانون، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال ويوجه لإعادة ترتيب القانون، ويجد الطالب هـ = 1.5 راديان (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم تمرين 3-1: 3 (أ) و 4 ص 32 مع الطلبة، ويبرز العلاقة م = ½ نق × ل، ويتابع الطالب ويستنتج العلاقة بين المساحة وطول القوس (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تعاوني: يكلف المجموعات بتمارين 3-1: 2، 3 (ب) ص ⁦31–32⁩، وتحل المجموعات وتتبادل الحلول للتصحيح (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تعلم ذاتي: يكلف المعلم بحل تمارين 3-1 (1، 2) من كتاب النشاط ص 20، ويحل الطالب ذاتيًا ويستعين بالأمثلة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: مساحة القطعة الدائرية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الصورة ويستقبل الأفكار، ويقترح الطالب: مساحة القطاع − مساحة المثلث (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: يحل المعلم مثال 7 ص 29 (نق = 6، هـ = 1.2) لجميع المطلوب، ويستنتج القانون المختصر للقطعة، ويحسب الطالب الخطوات على الحاسبة في وضع الراديان (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تعاوني: يكلف المجموعات بتمارين 3-1: 5، 6 ص 32، وتحل وتعرض (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تدريب فردي: يكلف المعلم بتمارين 3-1 (4، 5) من كتاب النشاط ص 21، ويحل الطالب فرديًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل ويطلب تحليل المنطقة، ويقترح الطالب التقسيم إلى قطعتين دائريتين (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 8 ص 30 ثم يناقش فكرة مثال 9 ص 31 (الزاوية π/2 − ...)، ويتابع الطالب ويكتب الحل (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. حل مشكلات تعاوني: يوزع المعلم تمارين 3-1: 7، 8، 9، 10 ص ⁦32–33⁩ على المجموعات (تمرين لكل مجموعة)، وتحل المجموعة وتعد عرضًا قصيرًا للحل (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. عرض تشاركي: يدير المعلم عرض الحلول ويصوب الأخطاء، وتعرض كل مجموعة خطوات حلها (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوزع المعلم قائمة التحقق ويطلب التقييم الذاتي، ويقيّم الطالب نفسه ويحدد المهارات التي يحتاج إليها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. مراجعة مركزة: يلخص المعلم قوانين الوحدة بخريطة مفاهيم على السبورة، ويكمل الطالب الخريطة مع المعلم (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تعاوني (مجموعات متجانسة): يوزع المعلم تمارين المراجعة ص ⁦35–36⁩ حسب المستوى: (1، 2، 3) للدعم، (4، 5، 6) للمتوقع، (7، 8، 9) للمتقدم، وتحل كل مجموعة تمارينها وتقدم حلًا نموذجيًا (17 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. مناقشة: يناقش المعلم الأخطاء الشائعة (استخدام الدرجات في القانون، نسيان نصفي القطر في المحيط)، ويصحح الطالب أخطاءه (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم سؤال «صحح الخطأ»، ويكتشف الطالب الخطأ: يجب التحويل إلى π/3 فيكون ل = π سم (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تدريب كتاب النشاط: يكلف المجموعات بتمارين مراجعة نهاية الوحدة الأولى ص ⁦23–26⁩ من كتاب النشاط مع متابعة فردية للطلبة المحتاجين، ويحل الطالب ويناقش مع مجموعته (18 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تصويب: يعرض المعلم الحلول النموذجية لأبرز التمارين، ويصحح الطالب ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول مساحة القطاع الدائري، ويبدأ المعلم بسؤال «سلك طوله 24 سم شُكّل منه قطاع دائري نصف قطره نق. بيّن أن مساحته م = 12نق − نق²» (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – صينية حلوى الضيافة: تقسّم المجموعات صينية حلوى عمانية دائرية إلى قطاعات بزوايا مختلفة بالراديان، وتحسب مساحة كل قطاع بالقانون م = ½ نق² هـ، ثم تتحدث عن عادة تقديم الحلوى مع القهوة إكرامًا للضيف (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\n1) [مستوى المعرفة] أكمل: مساحة القطاع الدائري = ........ (هـ بالراديان)\nالإجابة النموذجية: ½ نق² هـ\n2) [مستوى التطبيق] أوجد بدلالة π مساحة قطاع زاويته π/6 في دائرة نصف قطرها 9 سم.\nالإجابة النموذجية: ½ × 81 × π/6 = 27π/4 سم²\n3) [مستوى الاستدلال] بيّن أن قانون مساحة القطاع يعطي مساحة الدائرة عندما هـ = 2π.\nالإجابة النموذجية: ½ نق² × 2π = π نق²\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\n1) [مستوى المعرفة] قطاع دائري نصف قطره 4 سم ومساحته 9 سم². أوجد زاويته.\nالإجابة النموذجية: هـ = 2م/نق² = 18/16 = 1.125 راديان\n2) [مستوى التطبيق] قطاع دائري زاويته 0.5 راديان ومساحته 25 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 2 × 25 ÷ 0.5 = 100 ← نق = 10 سم\n3) [مستوى الاستدلال] قطاع نصف قطره 8 سم وطول قوسه 10 سم. أوجد زاويته ومساحته.\nالإجابة النموذجية: هـ = 1.25 راديان، م = ½ × 64 × 1.25 = 40 سم²\n\nالحصة 3: مساحة القطعة الدائرية\n1) [مستوى المعرفة] أوجد مساحة المثلث المحصور بين نصفي قطرين طول كل منهما 6 سم والزاوية بينهما 1.2 راديان.\nالإجابة النموذجية: ½ × 36 × جا 1.2 ≈ 16.8 سم²\n2) [مستوى التطبيق] أوجد مساحة القطعة الدائرية الصغرى المقابلة لتلك الزاوية.\nالإجابة النموذجية: 21.6 − 16.8 = 4.8 سم²\n3) [مستوى الاستدلال] أوجد مساحة القطعة الدائرية الكبرى في الدائرة نفسها.\nالإجابة النموذجية: π × 36 − 4.8 ≈ 108.3 سم²\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\n1) [مستوى المعرفة] مربع طول ضلعه نق رُسم بداخله قوسان من مركزين في رأسين متقابلين. ما مكونات محيط المنطقة المظللة بينهما؟\nالإجابة النموذجية: قوسان، كل منهما ربع دائرة نصف قطرها نق.\n2) [مستوى التطبيق] أوجد محيط المنطقة المظللة السابقة بدلالة نق.\nالإجابة النموذجية: 2 × (نق × π/2) = π نق\n3) [مستوى الاستدلال] أوجد مساحة المنطقة المظللة السابقة بدلالة نق.\nالإجابة النموذجية: 2(¼ π نق² − ½ نق²) = نق²(π/2 − 1)\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n1) [مستوى المعرفة] حوّل 135° إلى الراديان بدلالة π.\nالإجابة النموذجية: 3π/4\n2) [مستوى التطبيق] قطاع نصف قطره 9 سم وزاويته 2π/3. أوجد طول قوسه ومساحته بدلالة π.\nالإجابة النموذجية: ل = 6π سم، م = 27π سم²\n3) [مستوى الاستدلال] سلك طوله 24 سم شُكّل منه قطاع دائري نصف قطره نق. بيّن أن مساحته م = 12نق − نق².\nالإجابة النموذجية: ل = 24 − 2نق، م = ½ نق ل = 12نق − نق²\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n1) [مستوى المعرفة] ما طول القوس المقابل لزاوية 60° في دائرة نصف قطرها 3 سم؟\nالإجابة النموذجية: π سم\n2) [مستوى التطبيق] أوجد مساحة قطاع نصف قطره 5 سم وطول قوسه 8 سم.\nالإجابة النموذجية: 20 سم²\n3) [مستوى الاستدلال] قطاع محيطه ضعف نصف قطره مضافًا إليه π نق/2. ما قياس زاويته؟\nالإجابة النموذجية: ل = π نق/2 ← هـ = π/2", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\n1) [مستوى المعرفة] أوجد مساحة قطاع: نق = 4 سم، هـ = 2 راديان.\nالإجابة النموذجية: 16 سم²\n2) [مستوى التطبيق] أوجد بدلالة π مساحة قطاع: نق = 12 سم، هـ = 5π/6.\nالإجابة النموذجية: 60π سم²\n3) [مستوى الاستدلال] قطاعان في الدائرة نفسها، زاوية الأول ضعف زاوية الثاني. ما النسبة بين مساحتيهما؟ برّر.\nالإجابة النموذجية: 2 : 1؛ لأن المساحة تتناسب طرديًا مع هـ عند ثبوت نق.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\n1) [مستوى المعرفة] قطاع نصف قطره 6 سم ومساحته 27 سم². أوجد زاويته.\nالإجابة النموذجية: 1.5 راديان\n2) [مستوى التطبيق] أوجد مساحة قطاع نصف قطره 10 سم وطول قوسه 7 سم.\nالإجابة النموذجية: م = ½ × 10 × 7 = 35 سم²\n3) [مستوى الاستدلال] قطاع محيطه 20 سم ونصف قطره 5 سم. أوجد مساحته.\nالإجابة النموذجية: ل = 20 − 10 = 10، م = ½ × 5 × 10 = 25 سم²\n\nالحصة 3: مساحة القطعة الدائرية\n1) [مستوى المعرفة] أوجد مساحة القطاع: نق = 10 سم، هـ = π/2.\nالإجابة النموذجية: 25π ≈ 78.5 سم²\n2) [مستوى التطبيق] أوجد مساحة القطعة الصغرى في القطاع السابق.\nالإجابة النموذجية: 25π − 50 ≈ 28.5 سم²\n3) [مستوى الاستدلال] بيّن أن مساحة القطعة الدائرية = ½ نق²(هـ − جا هـ).\nالإجابة النموذجية: ½ نق² هـ − ½ نق² جا هـ = ½ نق²(هـ − جا هـ)\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\n1) [مستوى المعرفة] دائرة نصف قطرها 1 داخل مربع تمس أضلاعه. أوجد المساحة داخل المربع وخارج الدائرة.\nالإجابة النموذجية: 4 − π\n2) [مستوى التطبيق] قطاع نصف قطره 8 سم وزاويته π/3. أوجد مساحة القطعة الصغرى بدلالة π و √3.\nالإجابة النموذجية: 32π/3 − 16√3 سم²\n3) [مستوى الاستدلال] مثلث متطابق الأضلاع طول ضلعه 6 سم رسم قوس من أحد رؤوسه نصف قطره 6 سم. أوجد مساحة القطعة المحصورة بين القوس والضلع المقابل.\nالإجابة النموذجية: 6π − 9√3 ≈ 3.26 سم²\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\n1) [مستوى المعرفة] حوّل 7π/4 إلى الدرجات.\nالإجابة النموذجية: 315°\n2) [مستوى التطبيق] قطاع زاويته 1.4 راديان ومساحته 70 سم². أوجد نصف قطره.\nالإجابة النموذجية: نق² = 100 ← نق = 10 سم\n3) [مستوى الاستدلال] في المسألة السابقة (السلك 24 سم)، أوجد أكبر مساحة ممكنة للقطاع.\nالإجابة النموذجية: م = 36 − (نق − 6)² ← أكبر مساحة 36 سم² عند نق = 6\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\n1) [مستوى المعرفة] حوّل 2.5 راديان إلى الدرجات (أقرب درجة).\nالإجابة النموذجية: 143°\n2) [مستوى التطبيق] أوجد مساحة قطعة دائرية صغرى: نق = 4 سم، هـ = π/3.\nالإجابة النموذجية: 8π/3 − 4√3 ≈ 1.45 سم²\n3) [مستوى الاستدلال] دائرتان نصف قطر كل منهما نق ومركز كل منهما على محيط الأخرى. ما قياس الزاوية المركزية للقوس المشترك في كل دائرة؟\nالإجابة النموذجية: 2π/3", "الحصة 1: استنتاج قانون مساحة القطاع الدائري\nإرشاد للطالب: قراءة النتيجة 5 ومثال 6 ص 28، وحل تمارين 3-1 (1) ص 31 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد نصف القطر أو الزاوية بمعلومية مساحة القطاع\nإرشاد للطالب: حل تمارين 3-1 (3، 4) ص 32 من كتاب الطالب، وتمارين 3-1 (⁦1–3⁩) ص 20 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مساحة القطعة الدائرية\nإرشاد للطالب: مراجعة مثال 7 ص 29، وحل تمارين 3-1 (5، 6) ص 32 من كتاب الطالب، وتمارين 3-1 (⁦4–6⁩) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: مسائل المناطق المظللة (أقواس وقطع ومثلثات)\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦30–31⁩، وحل تمارين 3-1 (11، 12، 13) ص 33 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: مراجعة الوحدة الأولى (كتاب الطالب)\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الأولى (⁦1–6⁩) ص ⁦35–36⁩ من كتاب الطالب، ومراجعة قائمة التحقق ص 34.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: مراجعة الوحدة الأولى (كتاب النشاط) ومسابقة الختام\nإرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الأولى ص ⁦26–28⁩ من كتاب النشاط، والاستعداد لاختبار قصير في الوحدة الأولى.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=3"]}, {"id": "1-2", "title": "الزوايا بين 0° و 90°", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦39–42⁩", "wbp": "⁦29–32⁩", "p": [{"t": "النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يعبر عن جا هـ وجتا هـ وظا هـ بأطوال أضلاع المثلث القائم الزاوية (10 دقائق)\n2) يجد القيم الدقيقة لبقية النسب المثلثية لزاوية حادة بمعلومية إحداها باستخدام نظرية فيثاغورث (15 دقيقة)\nمخرج تعليمي آخر: يُنطق المقام عند كتابة القيمة الدقيقة (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، صورة توضيحية", "الجيب، جيب التمام، الظل، الوتر، الضلع المقابل، الضلع المجاور، القيمة الدقيقة، نظرية فيثاغورث", "مراجعة «اختبر مهاراتك» ص 38: سؤال 1 (مثلث قائم وتره ر) وسؤال 2 (التحويل بين الدرجات والراديان) بأسلوب الإجابة السريعة.", "1. التهيئة: يعرض المعلم أسئلة «اختبر مهاراتك» ص 38 ويستقبل الإجابات، ويجيب الطالب ويتذكر تعريف النسب المثلثية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 1 ص 39 (جتا هـ = √5/3): يرسم مثلثًا قائمًا ويجد الضلع الثالث ثم بقية النسب، ويوضح إنطاق المقام، ويتابع الطالب ويرسم المثلث ويحسب بقية النسب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المجموعات بتمارين 1-2: 1 (أ–ج) ص 41، وتحل المجموعة وتتحقق بالرسم (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تدريب فردي: يكلف المعلم بتمارين 1-2: 2 (أ، ب) ص 41، ويحل الطالب فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] في مثلث قائم الزاوية: المقابل للزاوية هـ = 3، المجاور = 4، الوتر = 5. أوجد جا هـ.\nالإجابة النموذجية: 3/5\n2) [مستوى التطبيق] إذا كان جا هـ = 5/13 وهـ حادة، أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: جتا هـ = 12/13، ظا هـ = 5/12\n3) [مستوى الاستدلال] إذا كان ظا هـ = 2 وهـ حادة، أوجد القيمتين الدقيقتين لـ جا هـ وجتا هـ.\nالإجابة النموذجية: جا هـ = 2/√5 = 2√5/5، جتا هـ = 1/√5 = √5/5", "1) [مستوى المعرفة] إذا كان جتا هـ = 4/5 وهـ حادة، أوجد جا هـ.\nالإجابة النموذجية: 3/5\n2) [مستوى التطبيق] إذا كان جا هـ = 1/3 وهـ حادة، أوجد جتا هـ بالقيمة الدقيقة.\nالإجابة النموذجية: 2√2/3\n3) [مستوى الاستدلال] إذا كان جتا هـ = √5/3 وهـ حادة، أوجد قيمة 1 − ظا² هـ.\nالإجابة النموذجية: ظا هـ = 2/√5 ← 1 − 4/5 = 1/5", "إرشاد للطالب: مراجعة مثال 1 ص 39، وحل تمارين 1-2 (1، 2) ص 41 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=4"]}, {"t": "القيم الدقيقة للنسب المثلثية للزوايا الخاصة", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يستنتج القيم الدقيقة لـ جا وجتا وظا للزوايا 30° و 45° و 60° من المثلثين الخاصين (15 دقيقة)\n2) يتذكر القيم الدقيقة للزوايا 0° و 90° وما يكافئها بالراديان (10 دقائق)\nمخرج تعليمي آخر: يكوّن جدولًا منظمًا للقيم الدقيقة بالدرجات والراديان (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: إبداع", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات عمل", "المثلث 30°–60°–90°، المثلث 45°–45°–90°، القيم الدقيقة، π/6، π/4، π/3، π/2", "يرسم الطلبة مثلثًا متطابق الأضلاع طول ضلعه 2 ومربعًا طول ضلعه 1، ويطلب المعلم رسم ارتفاع المثلث وقطر المربع.", "1. التهيئة: يوجه المعلم لرسم الشكلين وتقسيمهما، ويرسم الطالب ويحسب الارتفاع √3 والقطر √2 (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يقود الطلبة لاستنتاج القيم الدقيقة من المثلثين وإكمال جدول الزوايا الخاصة بالدرجات والراديان ص 40، ويستنتج الطالب القيم ويكمل الجدول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة البطاقات: يوزع المعلم بطاقات (زاوية / نسبة / قيمة) لمطابقتها بين المجموعات، وتطابق المجموعات البطاقات وتتسابق (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تطبيق: يكلف المعلم بتمارين 1-2: 4 (أ، ب، ج) ص 41، ويحسب الطالب القيم الدقيقة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما القيمة الدقيقة لـ جا 30°؟\nالإجابة النموذجية: 1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة لـ ظا(π/3).\nالإجابة النموذجية: √3\n3) [مستوى الاستدلال] بيّن أن جا 45° = جتا 45° باستخدام المثلث الخاص.\nالإجابة النموذجية: في المثلث 45°–45°–90° الضلعان متساويان (1، 1) والوتر √2، فكل منهما = 1/√2 = √2/2", "1) [مستوى المعرفة] أكمل: جتا 60° = ......\nالإجابة النموذجية: 1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جا 30° × جتا 60°.\nالإجابة النموذجية: 1/2 × 1/2 = 1/4\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا² 30° + جتا² 30°. ماذا تلاحظ؟\nالإجابة النموذجية: 1/4 + 3/4 = 1؛ المجموع يساوي 1", "إرشاد للطالب: حفظ جدول القيم الدقيقة للزوايا الخاصة ص 40، وحل تمارين 1-2 (4) ص 41 من كتاب الطالب، وتمارين 1-2 (⁦1–3⁩) ص ⁦29–30⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=4"]}, {"t": "إيجاد القيم الدقيقة لعبارات مثلثية", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يجد القيمة الدقيقة لعبارات تتضمن نسبًا مثلثية لزوايا خاصة بالدرجات أو بالراديان (20 دقيقة)\n2) يبسط العبارات الناتجة ويُنطق مقاماتها (10 دقائق)\nمخرج تعليمي آخر: يقيّم صحة حلول زملائه في المسابقة ويبرر (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "القيمة الدقيقة، إنطاق المقام، جا² هـ = (جا هـ)²، الزوايا الخاصة بالراديان", "سؤال: «ما الفرق بين جا² 60° و جا 60²؟» لإبراز معنى الأس على النسبة المثلثية.", "1. التهيئة: يطرح المعلم السؤال ويناقش الرمز جا² هـ، ويميز الطالب بين التعبيرين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 2 ص ⁦40–41⁩ (جا²(π/3)، وعبارة بمقام يحتاج إلى إنطاق)، ويتابع الطالب الخطوات ويدونها (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 1-2: 4 (د، هـ، و) و 5 ص ⁦41–42⁩، وتحل المجموعات وتتبادل التصحيح (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تحدٍّ: يعرض المعلم تمرين 6 ص 42 على الطلبة المتقدمين ويدعم الآخرين بتمارين كتاب النشاط ص 31، ويحل الطالب حسب مستواه (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «أوجد القيمة الدقيقة: ظا²(π/3) − 2جا²(π/4)»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – ظل برج القلعة: يقدّر كل زوج ارتفاع برج قلعة عمانية تخيليًا من طول ظله وزاوية ارتفاع الشمس، ثم يجد بقية النسب المثلثية للزاوية باستخدام فيثاغورس، ويتبادل الأزواج النتائج للتحقق منها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "1) [مستوى المعرفة] أوجد القيمة الدقيقة: جا² 45°.\nالإجابة النموذجية: 1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جا 60° جتا 30° + جتا 60° جا 30°.\nالإجابة النموذجية: 3/4 + 1/4 = 1\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: 1 ÷ (1 + ظا(π/6)) في أبسط صورة بمقام نسبي.\nالإجابة النموذجية: 1/(1 + 1/√3) = √3/(√3 + 1) = (3 − √3)/2", "1) [مستوى المعرفة] أوجد القيمة الدقيقة: ظا 45° + جتا 0°.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: ظا²(π/3) − 2جا²(π/4).\nالإجابة النموذجية: 3 − 1 = 2\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا(π/3) ÷ جتا(π/4).\nالإجابة النموذجية: (√3/2) ÷ (√2/2) = √3/√2 = √6/2", "إرشاد للطالب: حل تمارين 1-2 (5، 6) ص 42 من كتاب الطالب، وتمارين 1-2 (⁦4–8⁩) ص ⁦31–32⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=4"]}], "c": ["الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\n1) يعبر عن جا هـ وجتا هـ وظا هـ بأطوال أضلاع المثلث القائم الزاوية (10 دقائق)\n2) يجد القيم الدقيقة لبقية النسب المثلثية لزاوية حادة بمعلومية إحداها باستخدام نظرية فيثاغورث (15 دقيقة)\nمخرج تعليمي آخر: يُنطق المقام عند كتابة القيمة الدقيقة (15 دقيقة)\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\n1) يستنتج القيم الدقيقة لـ جا وجتا وظا للزوايا 30° و 45° و 60° من المثلثين الخاصين (15 دقيقة)\n2) يتذكر القيم الدقيقة للزوايا 0° و 90° وما يكافئها بالراديان (10 دقائق)\nمخرج تعليمي آخر: يكوّن جدولًا منظمًا للقيم الدقيقة بالدرجات والراديان (15 دقيقة)\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n1) يجد القيمة الدقيقة لعبارات تتضمن نسبًا مثلثية لزوايا خاصة بالدرجات أو بالراديان (20 دقيقة)\n2) يبسط العبارات الناتجة ويُنطق مقاماتها (10 دقائق)\nمخرج تعليمي آخر: يقيّم صحة حلول زملائه في المسابقة ويبرر (10 دقائق)", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nالمخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: إبداع\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nالتعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nالكتاب، السبورة الذكية، الأقلام، صورة توضيحية\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nالكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات عمل\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nالكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nالجيب، جيب التمام، الظل، الوتر، الضلع المقابل، الضلع المجاور، القيمة الدقيقة، نظرية فيثاغورث\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nالمثلث 30°–60°–90°، المثلث 45°–45°–90°، القيم الدقيقة، π/6، π/4، π/3، π/2\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nالقيمة الدقيقة، إنطاق المقام، جا² هـ = (جا هـ)²، الزوايا الخاصة بالراديان", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nمراجعة «اختبر مهاراتك» ص 38: سؤال 1 (مثلث قائم وتره ر) وسؤال 2 (التحويل بين الدرجات والراديان) بأسلوب الإجابة السريعة.\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nيرسم الطلبة مثلثًا متطابق الأضلاع طول ضلعه 2 ومربعًا طول ضلعه 1، ويطلب المعلم رسم ارتفاع المثلث وقطر المربع.\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nسؤال: «ما الفرق بين جا² 60° و جا 60²؟» لإبراز معنى الأس على النسبة المثلثية.", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم أسئلة «اختبر مهاراتك» ص 38 ويستقبل الإجابات، ويجيب الطالب ويتذكر تعريف النسب المثلثية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 1 ص 39 (جتا هـ = √5/3): يرسم مثلثًا قائمًا ويجد الضلع الثالث ثم بقية النسب، ويوضح إنطاق المقام، ويتابع الطالب ويرسم المثلث ويحسب بقية النسب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المجموعات بتمارين 1-2: 1 (أ–ج) ص 41، وتحل المجموعة وتتحقق بالرسم (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تدريب فردي: يكلف المعلم بتمارين 1-2: 2 (أ، ب) ص 41، ويحل الطالب فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوجه المعلم لرسم الشكلين وتقسيمهما، ويرسم الطالب ويحسب الارتفاع √3 والقطر √2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الاكتشاف: يقود الطلبة لاستنتاج القيم الدقيقة من المثلثين وإكمال جدول الزوايا الخاصة بالدرجات والراديان ص 40، ويستنتج الطالب القيم ويكمل الجدول (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة البطاقات: يوزع المعلم بطاقات (زاوية / نسبة / قيمة) لمطابقتها بين المجموعات، وتطابق المجموعات البطاقات وتتسابق (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تطبيق: يكلف المعلم بتمارين 1-2: 4 (أ، ب، ج) ص 41، ويحسب الطالب القيم الدقيقة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال ويناقش الرمز جا² هـ، ويميز الطالب بين التعبيرين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 2 ص ⁦40–41⁩ (جا²(π/3)، وعبارة بمقام يحتاج إلى إنطاق)، ويتابع الطالب الخطوات ويدونها (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 1-2: 4 (د، هـ، و) و 5 ص ⁦41–42⁩، وتحل المجموعات وتتبادل التصحيح (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحدٍّ: يعرض المعلم تمرين 6 ص 42 على الطلبة المتقدمين ويدعم الآخرين بتمارين كتاب النشاط ص 31، ويحل الطالب حسب مستواه (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «أوجد القيمة الدقيقة: جا² 45°»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – ظل برج القلعة: يقدّر كل زوج ارتفاع برج قلعة عمانية تخيليًا من طول ظله وزاوية ارتفاع الشمس، ثم يجد بقية النسب المثلثية للزاوية باستخدام فيثاغورس، ويتبادل الأزواج النتائج للتحقق منها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\n1) [مستوى المعرفة] في مثلث قائم الزاوية: المقابل للزاوية هـ = 3، المجاور = 4، الوتر = 5. أوجد جا هـ.\nالإجابة النموذجية: 3/5\n2) [مستوى التطبيق] إذا كان جا هـ = 5/13 وهـ حادة، أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: جتا هـ = 12/13، ظا هـ = 5/12\n3) [مستوى الاستدلال] إذا كان ظا هـ = 2 وهـ حادة، أوجد القيمتين الدقيقتين لـ جا هـ وجتا هـ.\nالإجابة النموذجية: جا هـ = 2/√5 = 2√5/5، جتا هـ = 1/√5 = √5/5\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\n1) [مستوى المعرفة] ما القيمة الدقيقة لـ جا 30°؟\nالإجابة النموذجية: 1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة لـ ظا(π/3).\nالإجابة النموذجية: √3\n3) [مستوى الاستدلال] بيّن أن جا 45° = جتا 45° باستخدام المثلث الخاص.\nالإجابة النموذجية: في المثلث 45°–45°–90° الضلعان متساويان (1، 1) والوتر √2، فكل منهما = 1/√2 = √2/2\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n1) [مستوى المعرفة] أوجد القيمة الدقيقة: جا² 45°.\nالإجابة النموذجية: 1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جا 60° جتا 30° + جتا 60° جا 30°.\nالإجابة النموذجية: 3/4 + 1/4 = 1\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: 1 ÷ (1 + ظا(π/6)) في أبسط صورة بمقام نسبي.\nالإجابة النموذجية: 1/(1 + 1/√3) = √3/(√3 + 1) = (3 − √3)/2", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\n1) [مستوى المعرفة] إذا كان جتا هـ = 4/5 وهـ حادة، أوجد جا هـ.\nالإجابة النموذجية: 3/5\n2) [مستوى التطبيق] إذا كان جا هـ = 1/3 وهـ حادة، أوجد جتا هـ بالقيمة الدقيقة.\nالإجابة النموذجية: 2√2/3\n3) [مستوى الاستدلال] إذا كان جتا هـ = √5/3 وهـ حادة، أوجد قيمة 1 − ظا² هـ.\nالإجابة النموذجية: ظا هـ = 2/√5 ← 1 − 4/5 = 1/5\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\n1) [مستوى المعرفة] أكمل: جتا 60° = ......\nالإجابة النموذجية: 1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جا 30° × جتا 60°.\nالإجابة النموذجية: 1/2 × 1/2 = 1/4\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا² 30° + جتا² 30°. ماذا تلاحظ؟\nالإجابة النموذجية: 1/4 + 3/4 = 1؛ المجموع يساوي 1\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\n1) [مستوى المعرفة] أوجد القيمة الدقيقة: ظا 45° + جتا 0°.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: ظا²(π/3) − 2جا²(π/4).\nالإجابة النموذجية: 3 − 1 = 2\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا(π/3) ÷ جتا(π/4).\nالإجابة النموذجية: (√3/2) ÷ (√2/2) = √3/√2 = √6/2", "الحصة 1: النسب المثلثية في المثلث القائم وإيجادها بمعلومية إحداها\nإرشاد للطالب: مراجعة مثال 1 ص 39، وحل تمارين 1-2 (1، 2) ص 41 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: القيم الدقيقة للنسب المثلثية للزوايا الخاصة\nإرشاد للطالب: حفظ جدول القيم الدقيقة للزوايا الخاصة ص 40، وحل تمارين 1-2 (4) ص 41 من كتاب الطالب، وتمارين 1-2 (⁦1–3⁩) ص ⁦29–30⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: إيجاد القيم الدقيقة لعبارات مثلثية\nإرشاد للطالب: حل تمارين 1-2 (5، 6) ص 42 من كتاب الطالب، وتمارين 1-2 (⁦4–8⁩) ص ⁦31–32⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=4"]}, {"id": "2-2", "title": "زاوية الأساس (الزاوية المرجعية)", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦43–48⁩", "wbp": "⁦33–34⁩", "p": [{"t": "الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يرسم الزاوية في الوضع القياسي ويحدد الربع الذي يقع فيه ضلعها النهائي (15 دقيقة)\n2) يميز بين الزاوية الموجبة (عكس عقارب الساعة) والزاوية السالبة (مع عقارب الساعة) والزوايا الأكبر من دورة (10 دقائق)\nمخرج تعليمي آخر: يجد زوايا مشتركة في الضلع النهائي بإضافة أو طرح مضاعفات 360° (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "الوضع القياسي، الضلع الابتدائي، الضلع النهائي، الأرباع الأربعة، الزاوية الموجبة، الزاوية السالبة، الدورة", "نشاط حركي: يمد الطالب ذراعه على امتداد الجزء الموجب لمحور السينات ثم يدور 120° ثم −90°، ويناقش الطلبة الاتجاه والموقع.", "1. التهيئة: ينفذ المعلم نشاط الذراع الدوّارة، ويؤدي الطالب الحركة ويصف الاتجاه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرض المعلم الزاوية في الوضع القياسي ص 43 باستخدام GeoGebra، ويحرك الضلع النهائي في الأرباع، ويلاحظ الطالب ويحدد الربع (10 ب", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\nالكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\nالكتاب، السبورة الذكية، الأقلام، صورة توضيحية\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\nالكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\nالوضع القياسي، الضلع الابتدائي، الضلع النهائي، الأرباع الأربعة، الزاوية الموجبة، الزاوية السالبة، الدورة\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\nزاوية الأساس (الزاوية المرجعية)، الزاوية الحادة مع محور السينات، ب = 180° − هـ، ب = هـ − 180°، ب = 360° − هـ\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\nزاوية الأساس، الربع، المجال، الدورة الكاملة، الزوايا المشتركة في الضلع النهائي", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\nنشاط حركي: يمد الطالب ذراعه على امتداد الجزء الموجب لمحور السينات ثم يدور 120° ثم −90°، ويناقش الطلبة الاتجاه والموقع.\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\nيعرض المعلم الرسوم ص 46 للأرباع الأربعة ويطلب من الطلبة توقع قانون زاوية الأساس في كل ربع.\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\nمسابقة سريعة «أين أقع؟»: يذكر المعلم زاوية ويرفع الطلبة بطاقة رقم الربع.", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينفذ المعلم نشاط الذراع الدوّارة، ويؤدي الطالب الحركة ويصف الاتجاه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يعرض المعلم الزاوية في الوضع القياسي ص 43 باستخدام GeoGebra، ويحرك الضلع النهائي في الأرباع، ويلاحظ الطالب ويحدد الربع (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق: يحل المعلم مع الطلبة مثال 3 (أ–د) ص ⁦43–44⁩ برسم كل زاوية، ويرسم الطالب الزوايا: 120°، 430°، 3π/4، −2π/3 (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المجموعات برسم مثال 3 (هـ، و) وتحديد الربع، وترسم المجموعة وتعرض (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الرسوم ويستقبل التوقعات، ويتوقع الطالب العلاقة في كل ربع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. بناء المفهوم: يثبت المعلم قوانين زاوية الأساس في الأرباع الأربعة ص 46، والطلبة يدون القوانين في جدول (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. النمذجة: يحل المعلم مثال 4 (أ–ج) ص ⁦46–47⁩، ويتابع الطالب ويرسم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المجموعات بتمارين 2-2: 1 ص 47، وتحل وتعرض (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينفذ المعلم «أين أقع؟»، ويرفع الطالب بطاقة الربع (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني: يكلف المعلم بتمارين 2-2: 2، 3 ص 48، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. كتاب النشاط: يكلف المعلم بتمارين 2-2 (⁦1–3⁩) ص ⁦33–34⁩ من كتاب النشاط مع دعم فردي، ويحل الطالب ذاتيًا (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تصويب: يناقش المعلم الأخطاء الشائعة (الخلط بين قوانين الأرباع)، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول زاوية الأساس (الزاوية المرجعية)، ويبدأ المعلم بسؤال «حدد اتجاه الدوران للزاوية −1.2π وفي أي ربع تقع» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – أوامر ربان السفينة: يمثل الطلبة طاقم سفينة عمانية تقليدية، فيطلب «الربان» زوايا موجبة وسالبة لتوجيه السفينة، ويرسمها كل فريق في الوضع القياسي ويحدد الربع وزاوية الأساس، اعتزازًا بتاريخ عمان البحري (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\n1) [مستوى المعرفة] في أي ربع يقع الضلع النهائي للزاوية 120°؟\nالإجابة النموذجية: الربع الثاني\n2) [مستوى التطبيق] في أي ربع تقع الزاوية −2π/3؟\nالإجابة النموذجية: الربع الثالث\n3) [مستوى الاستدلال] في أي ربع تقع الزاوية 430°؟ وما الزاوية بين 0° و 360° التي تشترك معها في الضلع النهائي؟\nالإجابة النموذجية: الربع الأول؛ 430 − 360 = 70°\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\n1) [مستوى المعرفة] أوجد زاوية الأساس للزاوية 110°.\nالإجابة النموذجية: 70°\n2) [مستوى التطبيق] أوجد زاوية الأساس للزاوية −320°.\nالإجابة النموذجية: 40° (تقع في الربع الأول)\n3) [مستوى الاستدلال] زاوية أساسها 42° وتقع في الربع الثاني، 0° ≤ هـ ≤ 360°. أوجد هـ.\nالإجابة النموذجية: هـ = 180° − 42° = 138°\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\n1) [مستوى المعرفة] زاوية أساسها 53° وتقع في الربع الثالث ضمن 360° ≤ هـ ≤ 720°. أوجد هـ.\nالإجابة النموذجية: هـ = 360° + 180° + 53° = 593°\n2) [مستوى التطبيق] زاوية أساسها 2π/9 تقع في الربع الرابع ضمن −4π ≤ هـ ≤ −2π. أوجد هـ.\nالإجابة النموذجية: هـ = −2π − 2π/9 = −20π/9\n3) [مستوى الاستدلال] أوجد جميع الزوايا في 0° ≤ هـ ≤ 360° التي زاوية أساسها 35°.\nالإجابة النموذجية: 35°، 145°، 215°، 325°", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\n1) [مستوى المعرفة] في أي ربع تقع الزاوية 200°؟\nالإجابة النموذجية: الربع الثالث\n2) [مستوى التطبيق] حدد اتجاه الدوران للزاوية −1.2π وفي أي ربع تقع.\nالإجابة النموذجية: مع اتجاه عقارب الساعة؛ تقع في الربع الثاني (تكافئ 0.8π)\n3) [مستوى الاستدلال] اكتب زاويتين (موجبة وسالبة) تشتركان في الضلع النهائي مع 45°.\nالإجابة النموذجية: مثل: 405° و −315°\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\n1) [مستوى المعرفة] أوجد زاوية الأساس للزاوية 200°.\nالإجابة النموذجية: 20°\n2) [مستوى التطبيق] أوجد زاوية الأساس للزاوية 5π/6.\nالإجابة النموذجية: π/6\n3) [مستوى الاستدلال] أوجد زاوية الأساس للزاوية −500°.\nالإجابة النموذجية: −500° + 720° = 220° في الربع الثالث ← زاوية الأساس 40°\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\n1) [مستوى المعرفة] أوجد زاوية الأساس للزاوية 7π/4.\nالإجابة النموذجية: π/4\n2) [مستوى التطبيق] زاوية أساسها 60° وتقع في الربع الرابع، 0° ≤ هـ ≤ 360°. أوجد هـ.\nالإجابة النموذجية: 300°\n3) [مستوى الاستدلال] زاوية أساسها π/5 وتقع في الربع الثاني، 0 ≤ هـ ≤ 2π. أوجد هـ.\nالإجابة النموذجية: π − π/5 = 4π/5", "الحصة 1: الزاوية في الوضع القياسي والزوايا الموجبة والسالبة والأرباع\nإرشاد للطالب: مراجعة مثال 3 ص ⁦43–45⁩ ورسم الزوايا في دفتر الواجبات.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد زاوية الأساس (الزاوية المرجعية)\nإرشاد للطالب: مراجعة القوانين ص 46 ومثال 4 ص ⁦46–47⁩، وحل تمارين 2-2 (1) ص 47 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تطبيقات على زاوية الأساس وتمارين الدرس\nإرشاد للطالب: حل تمارين 2-2 (2، 3) ص 48 من كتاب الطالب، وإكمال تمارين 2-2 ص ⁦33–34⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=5"]}, {"id": "3-2", "title": "النسب المثلثية للزوايا العامة", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦49–53⁩", "wbp": "⁦35–37⁩", "p": [{"t": "تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يعرّف جا هـ = ص/نق، جتا هـ = س/نق، ظا هـ = ص/س لزاوية في أي ربع حيث نق = √(س² + ص²) (20 دقيقة)\n2) يحسب النسب المثلثية لزاوية يمر ضلعها النهائي بنقطة معلومة (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "النقطة (س، ص) على الضلع النهائي، نق = √(س² + ص²)، النسب المثلثية للزاوية العامة", "سؤال: «كيف نعرّف جا 150° ولا يوجد مثلث قائم فيه زاوية 150°؟»", "1. التهيئة: يطرح المعلم السؤال، ويقترح الطالب أفكارًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يعرض المعلم النتيجة 1 ص 49 بالرسم وGeoGebra، والطلبة يدون التعريف (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثالًا: الضلع النهائي يمر بالنقطة (−3، 4)، ويحسب الطالب نق = 5 ثم النسب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يعطي كل مجموعة نقطة في ربع مختلف لحساب النسب، وتحسب وتعرض (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] أكمل: جتا هـ = ...... حيث (س، ص) نقطة على الضلع النهائي.\nالإجابة النموذجية: س/نق\n2) [مستوى التطبيق] الضلع النهائي للزاوية هـ يمر بالنقطة (−3، 4). أوجد جا هـ وجتا هـ.\nالإجابة النموذجية: نق = 5، جا هـ = 4/5، جتا هـ = −3/5\n3) [مستوى الاستدلال] في المسألة السابقة أوجد ظا هـ، ولماذا تكون سالبة؟\nالإجابة النموذجية: −4/3؛ لأن س سالبة وص موجبة", "1) [مستوى المعرفة] الضلع النهائي يمر بالنقطة (5، 12). أوجد جا هـ.\nالإجابة النموذجية: 12/13\n2) [مستوى التطبيق] الضلع النهائي يمر بالنقطة (−6، −8). أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: نق = 10، جتا هـ = −3/5، ظا هـ = 4/3\n3) [مستوى الاستدلال] لماذا يكون ظا هـ غير معرّف عندما يقع الضلع النهائي على محور الصادات؟\nالإجابة النموذجية: لأن س = 0 والقسمة على صفر غير معرّفة", "إرشاد للطالب: قراءة النتيجة 1 ص 49 وحل أسئلة مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=6"]}, {"t": "إشارات النسب المثلثية في الأرباع الأربعة", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يحدد إشارة كل من جا وجتا وظا في كل ربع (30 دقيقة)\n2) يستخدم إشارات النسب لتحديد الربع الذي تقع فيه الزاوية (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات عمل", "إشارات النسب في الأرباع (الكل – جا – ظا – جتا)، الربع", "ينفذ الطلبة استكشف 1 ص 49 لإكمال جدول الإشارات.", "1. التهيئة: يوزع المعلم جدول استكشف 1، ويبدأ الطالب بالربع الأول (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يقود المعلم إكمال الجدول واستنتاج القاعدة: الربع الأول الكل موجب، الثاني جا، الثالث ظا، الرابع جتا، ويكمل الطالب الجدول ويستنتج القاعدة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة: ينفذ المعلم لعبة «ما إشارتي؟»: بطاقة فيها نسبة لزاوية والمطلوب إشارتها، وتتنافس المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تطبيق: أسئلة: حدد الربع إذا كان جا هـ > 0 وظا هـ < 0 ... إلخ، ويحدد الطالب الربع ويبرر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما إشارة جتا 200°؟\nالإجابة النموذجية: سالبة (الربع الثالث)\n2) [مستوى التطبيق] ما إشارة ظا 300°؟\nالإجابة النموذجية: سالبة (الربع الرابع)\n3) [مستوى الاستدلال] إذا كان جا هـ < 0 وظا هـ > 0، ففي أي ربع تقع هـ؟\nالإجابة النموذجية: الربع الثالث", "1) [مستوى المعرفة] في أي ربع تكون جميع النسب موجبة؟\nالإجابة النموذجية: الربع الأول\n2) [مستوى التطبيق] ما إشارة جا(5π/4)؟\nالإجابة النموذجية: سالبة\n3) [مستوى الاستدلال] إذا كان جتا هـ > 0 وجا هـ < 0، ففي أي ربع تقع هـ؟ وما إشارة ظا هـ؟\nالإجابة النموذجية: الربع الرابع؛ ظا هـ سالبة", "إرشاد للطالب: حفظ قاعدة الإشارات ص 49، وحل تمارين 3-2 (1) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=6"]}, {"t": "القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يكتب النسبة المثلثية لزاوية عامة بدلالة النسبة نفسها لزاوية الأساس مع الإشارة المناسبة (20 دقيقة)\n2) يجد القيم الدقيقة لنسب زوايا مثل 210° و 315° و 2π/3 (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "زاوية الأساس، الإشارة حسب الربع، القيمة الدقيقة", "مراجعة سريعة: زاوية الأساس لـ 140° و −130°، وإشارة جا وجتا في الربعين الثاني والثالث.", "1. التهيئة: أسئلة مراجعة شفو
