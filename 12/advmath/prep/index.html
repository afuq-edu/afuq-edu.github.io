 من قاعدة وإيجاد ثابت يجعلها متصلة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: الاتصال يضيف شرط تساوي النهاية مع د(أ) (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مسألتين على بحث الاتصال وإيجاد ثابت، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مشكلات: يكلف المجموعات بتمارين 4-3: 5، 6 ص ⁦131–132⁩، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. عرض: تعرض المجموعات، ويبرر الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: الاتصال على فترة مغلقة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويتوقع الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. النمذجة: يشرح المعلم الاتصال على فترة ص ⁦132–133⁩، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تعاوني: يكلف المعلم بتمارين 4-3: 7 ص 133، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. فردي: تمارين 4-3 (6، 7) ص ⁦80–81⁩ من كتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 6: مراجعة الوحدة الثالثة ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثالثة ص ⁦134–136⁩ وكتاب النشاط ص ⁦82–84⁩ حسب المستوى، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يعرض المعلم الحلول، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «أوجد نها(س←∞) (5س² − 2)/(س² + 3س)»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – فلج لا ينقطع: يشبّه الطلبة الدالة المتصلة بمجرى فلج عماني يجري دون انقطاع، فتختبر كل مجموعة الشروط الثلاثة للاتصال عند نقطة، وتحدد أين «ينقطع الفلج» في دوال على السبورة، ثم تذكر أهمية المحافظة على الأفلاج (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: شروط اتصال الدالة عند نقطة\n1) [مستوى المعرفة] اذكر الشروط الثلاثة لاتصال د(س) عند س = أ.\nالإجابة النموذجية: د(أ) موجودة، نها(س←أ) د(س) موجودة، النهاية = د(أ)\n2) [مستوى التطبيق] هل الدالة (س² − 1)/(س − 1) متصلة عند س = 1؟ ولماذا؟\nالإجابة النموذجية: لا؛ لأن د(1) غير معرّفة\n3) [مستوى الاستدلال] دالة نهايتها عند 2 تساوي 5 و د(2) = 3. هل هي متصلة عند 2؟\nالإجابة النموذجية: لا؛ النهاية ≠ قيمة الدالة\n\nالحصة 2: أنواع عدم الاتصال من التمثيل البياني\n1) [مستوى المعرفة] ما نوع عدم الاتصال في منحنى (س² − 4)/(س − 2) عند س = 2؟\nالإجابة النموذجية: فجوة (قابل للإزالة)\n2) [مستوى التطبيق] ما نوع عدم الاتصال في منحنى 1/س عند س = 0؟\nالإجابة النموذجية: عدم اتصال لانهائي (خط تقارب رأسي)\n3) [مستوى الاستدلال] كيف يمكن إزالة عدم الاتصال في (س² − 4)/(س − 2) عند 2؟\nالإجابة النموذجية: بتعريف د(2) = 4\n\nالحصة 3: اتصال كثيرات الحدود والدوال النسبية\n1) [مستوى المعرفة] هل د(س) = س³ − 5س + 2 متصلة عند جميع الأعداد الحقيقية؟\nالإجابة النموذجية: نعم؛ كثيرة حدود\n2) [مستوى التطبيق] حدد نقاط عدم اتصال د(س) = (س + 1)/(س² − 9).\nالإجابة النموذجية: س = 3، س = −3\n3) [مستوى الاستدلال] هل د(س) = (س + 2)/(س² + 4) متصلة على ح؟ برر.\nالإجابة النموذجية: نعم؛ لأن المقام لا يساوي صفرًا أبدًا\n\nالحصة 4: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\n1) [مستوى المعرفة] د(س) = س² عندما س < 2، و 2س عندما س ≥ 2. هل هي متصلة عند 2؟\nالإجابة النموذجية: نعم: النهايتان 4 و د(2) = 4\n2) [مستوى التطبيق] د(س) = س + ك عندما س < 3، و 2س − 1 عندما س ≥ 3. أوجد ك لتكون متصلة عند 3.\nالإجابة النموذجية: 3 + ك = 5 ← ك = 2\n3) [مستوى الاستدلال] د(س) = (س² − 9)/(س − 3) عندما س ≠ 3، و ك عندما س = 3. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 6\n\nالحصة 5: الاتصال على فترة مغلقة\n1) [مستوى المعرفة] ما الفرق بين الفترتين ]1، 5[ و [1، 5]؟\nالإجابة النموذجية: الأولى لا تتضمن الطرفين والثانية تتضمنهما\n2) [مستوى التطبيق] هل د(س) = 1/(س − 4) متصلة على [0، 3]؟\nالإجابة النموذجية: نعم؛ س = 4 خارج الفترة\n3) [مستوى الاستدلال] هل د(س) = 1/(س − 4) متصلة على [3، 5]؟ برر.\nالإجابة النموذجية: لا؛ غير معرّفة عند س = 4 داخل الفترة\n\nالحصة 6: مراجعة الوحدة الثالثة ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←3) (س² − 2س − 3)/(س − 3).\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد نها(س←∞) (5س² − 2)/(س² + 3س).\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] د(س) = س² − ك عندما س < 2، و ك س عندما س ≥ 2. أوجد ك لتكون متصلة عند 2.\nالإجابة النموذجية: 4 − ك = 2ك ← ك = 4/3", "الحصة 1: شروط اتصال الدالة عند نقطة\n1) [مستوى المعرفة] أي شرط يختل في منحنى به فجوة عند س = 3 مع عدم تعريف الدالة عند 3؟\nالإجابة النموذجية: الشرط الأول: د(3) غير موجودة\n2) [مستوى التطبيق] هل د(س) = س² + 2 متصلة عند س = 1؟\nالإجابة النموذجية: نعم: د(1) = 3 = النهاية\n3) [مستوى الاستدلال] أي شرط يختل عند وجود قفزة؟\nالإجابة النموذجية: الشرط الثاني: النهاية غير موجودة\n\nالحصة 2: أنواع عدم الاتصال من التمثيل البياني\n1) [مستوى المعرفة] ما نوع عدم الاتصال عند قفزة من 1 إلى 3؟\nالإجابة النموذجية: قفزة (غير قابل للإزالة)\n2) [مستوى التطبيق] هل يمكن إزالة عدم اتصال القفزة بإعادة تعريف نقطة واحدة؟\nالإجابة النموذجية: لا؛ لأن النهاية غير موجودة\n3) [مستوى الاستدلال] حدد نقاط عدم الاتصال لـ د(س) = 1/((س − 1)(س + 2)).\nالإجابة النموذجية: س = 1، س = −2\n\nالحصة 3: اتصال كثيرات الحدود والدوال النسبية\n1) [مستوى المعرفة] حدد نقطة عدم اتصال د(س) = 5/(س − 4).\nالإجابة النموذجية: س = 4\n2) [مستوى التطبيق] هل د(س) = س² − 7 متصلة عند س = 10؟\nالإجابة النموذجية: نعم\n3) [مستوى الاستدلال] حدد نقاط عدم اتصال د(س) = (س − 1)/(س² − 3س + 2).\nالإجابة النموذجية: س = 1، س = 2\n\nالحصة 4: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\n1) [مستوى المعرفة] د(س) = 2س + 1 عندما س ≤ 1، و 4 عندما س > 1. هل هي متصلة عند 1؟\nالإجابة النموذجية: لا؛ يسارًا 3 ويمينًا 4\n2) [مستوى التطبيق] د(س) = ك س² عندما س < 1، و 3 عندما س ≥ 1. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 3\n3) [مستوى الاستدلال] د(س) = أ س + 2 عندما س < 2، و س² + أ عندما س ≥ 2. أوجد أ.\nالإجابة النموذجية: 2أ + 2 = 4 + أ ← أ = 2\n\nالحصة 5: الاتصال على فترة مغلقة\n1) [مستوى المعرفة] هل د(س) = س² + 1 متصلة على [−2، 2]؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] هل د(س) = 1/س متصلة على [−1، 1]؟\nالإجابة النموذجية: لا؛ غير معرّفة عند 0\n3) [مستوى الاستدلال] أوجد فترة مغلقة تكون عليها د(س) = (س + 1)/(س − 2) متصلة.\nالإجابة النموذجية: مثل [3، 6] أو أي فترة لا تحتوي 2\n\nالحصة 6: مراجعة الوحدة الثالثة ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←0) (س² + 4س)/(2س).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] حدد نقاط عدم اتصال د(س) = 3/(س² − س).\nالإجابة النموذجية: س = 0، س = 1\n3) [مستوى الاستدلال] هل د(س) = (س² − 1)/(س + 1) متصلة على [0، 4]؟\nالإجابة النموذجية: نعم؛ س = −1 خارج الفترة", "الحصة 1: شروط اتصال الدالة عند نقطة\nإرشاد للطالب: حفظ نتيجة 4 ص 127، ومراجعة مثال 13 ص 128.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: أنواع عدم الاتصال من التمثيل البياني\nإرشاد للطالب: حل تمارين 4-3 (1، 2) ص 130 من كتاب الطالب، وتمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: اتصال كثيرات الحدود والدوال النسبية\nإرشاد للطالب: حل تمارين 4-3 (3، 4) ص 131 من كتاب الطالب، وتمرين 4-3 (3) ص 78 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\nإرشاد للطالب: حل تمارين 4-3 (5، 6) ص ⁦131–132⁩ من كتاب الطالب، وتمارين 4-3 (4، 5) ص ⁦79–80⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: الاتصال على فترة مغلقة\nإرشاد للطالب: حل تمارين 4-3 (7) ص 133 من كتاب الطالب، وتمارين 4-3 (6، 7) ص ⁦80–81⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في مو جيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج — زمن الحصة 40 دقيقة\n\n1. التهيئة: يراجع المعلم الفك، ويفك الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. النمذجة: يحل المعلم تمرين 1-4: 3 ص 143 (ميل الوتر على ص = س³ ونهايته)، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تشاركي: يكلف الأزواج بإيجاد مشتقة س² و س³ و س⁴ (الأخيرة للمتقدمين) وتنظيمها في جدول، ويكمل الطالب الجدول ويستنتج النمط (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تعاوني: يكلف المعلم بتمارين 1-4: 4، 5 ص 143، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: رموز المشتقة ودالة الميل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوزع المعلم البطاقات، ويطابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. بناء المفهوم: يوضح المعلم الرموز ومعناها ويكتب دالة الميل، والطلبة يدون (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تطبيق تعاوني: يكلف المعلم بإيجاد الميل عند نقاط على منحنيات س²، س³، س² + س، وتحسب المجموعات (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. فردي: يكلف المعلم بتمارين 1-4: 6 ص 143 وتمارين كتاب النشاط ص 85، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: تمارين المشتقة وعلاقتها بالميل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الحل، ويكتشف الطالب الخطأ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني بالمستويات: يوزع المعلم تمارين متدرجة: إيجاد ميول، مبادئ أولية لـ 3س²، لـ 1/س (للمتقدمين)، ويحل الطالب حسب مستواه (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تقييم الأقران: تتبادل المجموعات الحلول وتقيّمها، ويقيّم الطالب ويعلق (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تلخيص: يلخص المعلم الأخطاء الشائعة، والطلبة يدون (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 6: تطبيقات المشتقة كميل ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم المماس المتحرك، ويصف الطالب التغير (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تعاوني: يكلف المعلم بمسائل: إيجاد النقطة ذات ميل معلوم، والنقطة ذات المماس الأفقي، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. كتاب النشاط: يكمل المعلم تمارين 1-4 ص ⁦85–86⁩، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تصويب: يناقش المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن المشتقة وعلاقتها بالميل، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – طريق الجبل الأخضر: تحسب المجموعات ميول أوتار على منحنى يمثل طريقًا صاعدًا نحو الجبل الأخضر، وتقرّب النقطتين تدريجيًا لتقدير ميل المماس عند نقطة، ثم تتحدث عن أهمية الطرق في ربط القرى الجبلية بالمدن (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: ميل الوتر وميل المماس لمنحنى\n1) [مستوى المعرفة] أوجد ميل الوتر الواصل بين (2، 4) و (3، 9) على ص = س².\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] أوجد ميل الوتر بين (2، 4) و (2.1، 4.41).\nالإجابة النموذجية: 4.1\n3) [مستوى الاستدلال] ما الذي يقترب منه ميل الوتر عندما تقترب النقطة من (2، 4)؟\nالإجابة النموذجية: 4، وهو ميل المماس عند (2، 4)\n\nالحصة 2: الاشتقاق من المبادئ الأولية\n1) [مستوى المعرفة] اكتب تعريف المشتقة من المبادئ الأولية.\nالإجابة النموذجية: د′(س) = نها(هـ←0) [د(س + هـ) − د(س)]/هـ\n2) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة د(س) = 3س + 2.\nالإجابة النموذجية: [3(س + هـ) + 2 − 3س − 2]/هـ = 3 ← د′(س) = 3\n3) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة د(س) = س².\nالإجابة النموذجية: [(س + هـ)² − س²]/هـ = 2س + هـ ← 2س\n\nالحصة 3: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\n1) [مستوى المعرفة] فك (س + هـ)³.\nالإجابة النموذجية: س³ + 3س²هـ + 3سهـ² + هـ³\n2) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة ص = س³.\nالإجابة النموذجية: 3س²\n3) [مستوى الاستدلال] استنتج مشتقة ص = س⁵ من النمط.\nالإجابة النموذجية: 5س⁴\n\nالحصة 4: رموز المشتقة ودالة الميل\n1) [مستوى المعرفة] إذا كانت ص = س² فما دص/دس؟\nالإجابة النموذجية: 2س\n2) [مستوى التطبيق] أوجد ميل منحنى ص = س² عند س = −3.\nالإجابة النموذجية: −6\n3) [مستوى الاستدلال] أوجد ميل منحنى ص = س² + س عند النقطة (1، 2).\nالإجابة النموذجية: 3\n\nالحصة 5: تمارين المشتقة وعلاقتها بالميل\n1) [مستوى المعرفة] أوجد من المبادئ الأولية مشتقة ص = 3س².\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد ميل ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة ص = 1/س.\nالإجابة النموذجية: [1/(س + هـ) − 1/س]/هـ = −1/(س(س + هـ)) ← −1/س²\n\nالحصة 6: تطبيقات المشتقة كميل ومسابقة الختام\n1) [مستوى المعرفة] ما إشارة ميل ص = س² عند س = −2؟\nالإجابة النموذجية: سالبة (−4)\n2) [مستوى التطبيق] أوجد النقطة التي يكون عندها المماس لمنحنى ص = س² − 4س أفقيًا.\nالإجابة النموذجية: (2، −4)\n3) [مستوى الاستدلال] عند أي قيمة لـ س يكون ميل ص = س³ يساوي 12؟\nالإجابة النموذجية: 3س² = 12 ← س = ±2", "الحصة 1: ميل الوتر وميل المماس لمنحنى\n1) [مستوى المعرفة] أوجد ميل الوتر بين (1، 1) و (2، 4) على ص = س².\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] أوجد ميل الوتر بين (1، 1) و (1.01، 1.0201).\nالإجابة النموذجية: 2.01\n3) [مستوى الاستدلال] توقع ميل المماس لـ ص = س² عند (1، 1).\nالإجابة النموذجية: 2\n\nالحصة 2: الاشتقاق من المبادئ الأولية\n1) [مستوى المعرفة] ماذا يمثل المقدار [د(س + هـ) − د(س)]/هـ هندسيًا؟\nالإجابة النموذجية: ميل الوتر\n2) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة د(س) = 5.\nالإجابة النموذجية: 0\n3) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة د(س) = س² + س.\nالإجابة النموذجية: 2س + 1\n\nالحصة 3: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\n1) [مستوى المعرفة] ما مشتقة ص = س³ عند س = 2؟\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] أوجد من المبادئ الأولية مشتقة ص = 2س².\nالإجابة النموذجية: 4س\n3) [مستوى الاستدلال] ما النمط في مشتقات س²، س³، س⁴؟\nالإجابة النموذجية: ن سⁿ⁻¹\n\nالحصة 4: رموز المشتقة ودالة الميل\n1) [مستوى المعرفة] ماذا يعني د′(2) = 5؟\nالإجابة النموذجية: ميل المماس للمنحنى عند س = 2 يساوي 5\n2) [مستوى التطبيق] أوجد ميل منحنى ص = س³ عند س = −1.\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] عند أي نقطة على ص = س² يكون الميل 8؟\nالإجابة النموذجية: س = 4 ← (4، 16)\n\nالحصة 5: تمارين المشتقة وعلاقتها بالميل\n1) [مستوى المعرفة] أوجد ميل ص = س² − 4س + 3 عند س = 3.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] عند أي نقطة يكون ميل ص = س² − 4س + 3 صفرًا؟\nالإجابة النموذجية: س = 2 ← (2، −1)\n3) [مستوى الاستدلال] أوجد من المبادئ الأولية مشتقة ص = س² − 4س.\nالإجابة النموذجية: 2س − 4\n\nالحصة 6: تطبيقات المشتقة كميل ومسابقة الختام\n1) [مستوى المعرفة] ماذا يعني أن ميل المماس عند نقطة يساوي صفرًا؟\nالإجابة النموذجية: المماس أفقي عند تلك النقطة\n2) [مستوى التطبيق] أوجد ميل ص = 2س² عند س = −1.\nالإجابة النموذجية: −4\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² التي ميلها يساوي ميل الوتر بين (0، 0) و (4، 16).\nالإجابة النموذجية: ميل الوتر 4 ← 2س = 4 ← (2، 4)", "الحصة 1: ميل الوتر وميل المماس لمنحنى\nإرشاد للطالب: مراجعة استكشف 1 ص ⁦139–140⁩، وحل تمارين 1-4 (1) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: الاشتقاق من المبادئ الأولية\nإرشاد للطالب: مراجعة ص ⁦140–142⁩ ومثال 1، وحل تمارين 1-4 (2) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\nإرشاد للطالب: حل تمارين 1-4 (⁦3–5⁩) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: رموز المشتقة ودالة الميل\nإرشاد للطالب: حل تمارين 1-4 (6) ص 143 من كتاب الطالب، وتمارين 1-4 (1) ص 85 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر ال دي: تمارين 2-4 (⁦1–3⁩) ص 87 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: المشتقة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: نعم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. النمذجة: يحل المعلم مثالي 6، 7 ص ⁦147–148⁩، ويتابع الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يكلف المعلم بتمارين 2-4: ⁦11–20⁩ ص ⁦150–151⁩ حسب المستوى وتمارين كتاب النشاط ص ⁦88–90⁩، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تصويب: يناقش المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «أوجد د″(س) إذا كانت د(س) = 5س³ + 2س» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قطف رطب القوى: تتسابق المجموعات في اشتقاق دوال قوى كتبها المعلم على نخلات مرسومة على السبورة، وكل اشتقاق صحيح يقطف «رطبة»، ثم تذكر المجموعة الفائزة فائدة من فوائد النخلة في حياة العمانيين (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: قاعدة مشتقة دالة القوة\n1) [مستوى المعرفة] أوجد مشتقة ص = س⁷.\nالإجابة النموذجية: 7س⁶\n2) [مستوى التطبيق] أوجد مشتقة ص = 1/س².\nالإجابة النموذجية: −2س⁻³ = −2/س³\n3) [مستوى الاستدلال] أوجد مشتقة ص = √س.\nالإجابة النموذجية: ½ س^(−½) = 1/(2√س)\n\nالحصة 2: مشتقة مضاعف الدالة ومجموع الدوال والميل عند نقطة\n1) [مستوى المعرفة] أوجد دص/دس إذا كانت ص = 4س³ − 5س + 2.\nالإجابة النموذجية: 12س² − 5\n2) [مستوى التطبيق] أوجد دص/دس إذا كانت ص = (س + 2)².\nالإجابة النموذجية: ص = س² + 4س + 4 ← 2س + 4\n3) [مستوى الاستدلال] أوجد ميل ص = (س² + 3)/س عند س = 1.\nالإجابة النموذجية: ص = س + 3س⁻¹ ← 1 − 3/س² = −2\n\nالحصة 3: المشتقة الثانية ومسابقة الختام\n1) [مستوى المعرفة] أوجد د²ص/دس² إذا كانت ص = س⁴ − 3س².\nالإجابة النموذجية: دص/دس = 4س³ − 6س ← 12س² − 6\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = 5س³ + 2س.\nال ملائه ويجيب عن أسئلتهم حول قاعدة السلسلة، ويبدأ المعلم بسؤال «أوجد مشتقة ص = 1/(س² + 1)» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – سلسلة إنتاج اللبان: يمثل الطلبة قاعدة السلسلة بسلسلة إنتاج اللبان العماني: الشجرة ثم الحصاد ثم السوق، فيكتب كل زوج معدل تغير كل مرحلة بالنسبة لسابقتها ويضربها للحصول على المعدل الكلي، ثم يشتقون دالة مثل (أس + ب)ⁿ (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\n1) [مستوى المعرفة] أوجد مشتقة ص = (3س + 1)⁵.\nالإجابة النموذجية: 15(3س + 1)⁴\n2) [مستوى التطبيق] أوجد مشتقة ص = (2س − 7)³.\nالإجابة النموذجية: 6(2س − 7)²\n3) [مستوى الاستدلال] أوجد مشتقة ص = (5 − س)⁴.\nالإجابة النموذجية: −4(5 − س)³\n\nالحصة 2: قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية\n1) [مستوى المعرفة] أوجد مشتقة ص = √(2س − 1).\nالإجابة النموذجية: 1/√(2س − 1)\n2) [مستوى التطبيق] أوجد مشتقة ص = 1/(س² + 1).\nالإجابة النموذجية: −2س/(س² + 1)²\n3) [مستوى الاستدلال] أوجد مشتقة ص = (س² − 4)³.\nالإجابة النموذجية: 6س(س² − 4)²\n\nالحصة 3: تطبيقات قاعدة السلسلة ومسابقة الختام\n1) [مستوى المعرفة] إذا كان ميل ص = (أس + 1)² عند س = 0 يساوي 6، أوجد أ.\nالإجابة النموذجية: أ = 3\n2) [مستوى التطبيق] أوجد النقطة على ص = (2س − 3)² التي ميلها صفر.\nالإجابة النموذجية: س = 1.5 ← (1.5، 0)\n3) [مستوى الاستدلال] أوجد مشتقة ص = (س³ + 2س)⁴.\nالإجابة النموذجية: 4(س³ + 2س)³(3س² + 2)", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\n1) [مستوى المعرفة] حدد الدالة الداخلية في ص = (4س + 3)⁶.\nالإجابة النموذجية: ع = 4س + 3\n2) [مستوى التطبيق] أوجد مشتقة ص = (س + 1)⁸.\nالإجابة النموذجية: 8(س + 1)⁷\n3) [مستوى الاستدلال] أوجد مشتقة ص = 2(3س − 1)⁴.\nالإجابة النموذجية: 24(3س − 1)³\n\nالحصة 2: قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية\n1) [مستوى المعرفة] أوجد مشتقة ص = √(س + 5).\nالإجابة النموذجية: 1/(2√(س + 5))\n2) [مستوى التطبيق] أوجد ميل ص = (س² + 1)³ عند س = 1.\nالإجابة النموذجية: 3(2)²(2) = 24\n3) [مستوى الاستدلال] أوجد مشتقة ص = 4/(3س − 2)².\nالإجابة النموذجية: −24/(3س − 2)³\n\nالحصة 3: تطبيقات قاعدة السلسلة ومسابقة الختام\n1) [مستوى المعرفة] أوجد مشتقة ص = (1 − 2س)⁵.\nالإجابة النموذجية: −10(1 − 2س)⁴\n2) [مستوى التطبيق] أوجد ميل ص = √(4س + 1) عند س = 2.\nالإجابة النموذجية: 2/√(4س + 1) = 2/3\n3) [مستوى الاستدلال] أوجد مشتقة ص = 1/√(س² + 9).\nالإجابة النموذجية: −س/(س² + 9)^(3/2)", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦152–153⁩، وحل تمارين 3-4 (1) ص 157 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية\nإرشاد للطالب: مراجعة أمثلة ⁦10–12⁩ ص ⁦154–156⁩، وحل تمارين 3-4 (⁦2–8⁩) ص 157 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تطبيقات قاعدة السلسلة ومسابقة الختام\nإرشاد للطالب: حل تمارين 3-4 (⁦9–12⁩) ص ⁦157–158⁩ من كتاب الطالب، وتمارين 3-4 ص ⁦91–92⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=21"]}, {"id": "4-4", "title": "المماس والعمودي", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦159–163⁩", "wbp": "⁦93–94⁩", "p": [{"t": "معادلة المماس لمنحنى عند نقطة", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يجد معادلة المماس لمنحنى عند نقطة معلومة باستخدام المشتقة (25 دقيقة)\n2) يجد إحداثي النقطة عندما يكون المعطى قيمة س فقط (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "المماس، ميل المماس = دص/دس عند النقطة، ص − ص₁ = م(س − س₁)", "مراجعة معادلة المستقيم بمعلومية الميل ونقطة من «اختبر مهاراتك» ص 138.", "1. التهيئة: يراجع المعلم المعادلة، ويكتب الطالب معادلة مستقيم (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 14 ص ⁦159–160⁩، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 4-4: 1، 2 ص 161، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحقق رقمي: يعرض المعلم المماسات في GeoGebra للتحقق، ويتحقق الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد ميل المماس لمنحنى ص = س² + 1 عند (1، 2).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد معادلة المماس عند (1، 2).\nالإجابة النموذجية: ص = 2س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س³ − 2س عند س = 2.\nالإجابة النموذجية: ص = 4، الميل 10 ← ص = 10س − 16", "1) [مستوى المعرفة] أوجد ميل المماس لـ ص = 3س² عند س = 1.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: الميل 1/4 ← ص = ¼ س + 1", "إرشاد للطالب: مراجعة مثال 14 ص ⁦159–160⁩، وحل تمارين 4-4 (1، 2) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22"]}, {"t": "معادلة العمودي على المماس", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يجد ميل العمودي بوصفه سالب مقلوب ميل المماس (25 دقيقة)\n2) يجد معادلة العمودي لمنحنى عند نقطة (مثال 15) (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام", "العمودي (المستقيم العمودي على المماس)، م₁ × م₂ = −1", "سؤال: «مستقيم ميله 2، ما ميل المستقيم العمودي عليه؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: −1/2 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 15 ص 160، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تشاركي: يكلف الأزواج بتمارين 4-4: ⁦3–7⁩ ص 161، ويحل الطالب ويتبادل (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. فردي: تمارين 4-4 (⁦1–4⁩) ص 93 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] إذا كان ميل المماس 4، فما ميل العمودي؟\nالإجابة النموذجية: −1/4\n2) [مستوى التطبيق] أوجد معادلة العمودي لـ ص = س² + 1 عند (1، 2).\nالإجابة النموذجية: ص − 2 = −½(س − 1) ← ص = −½ س + 5/2\n3) [مستوى الاستدلال] أوجد معادلة العمودي لـ ص = س³ − 2س عند (2، 4).\nالإجابة النموذجية: الميل −1/10 ← ص = −0.1س + 4.2", "1) [مستوى المعرفة] ما ميل العمودي إذا كان ميل المماس −3؟\nالإجابة النموذجية: 1/3\n2) [مستوى التطبيق] أوجد معادلة العمودي لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = −(1/6)س + 19/6\n3) [مستوى الاستدلال] لماذا لا يمكن إيجاد ميل العمودي بالقسمة إذا كان ميل المماس صفرًا؟ وما معادلته؟\nالإجابة النموذجية: لأن المماس أفقي فيكون العمودي رأسيًا: س = س₁", "إرشاد للطالب: مراجعة مثال 15 ص 160، وحل تمارين 4-4 (⁦3–7⁩) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22"]}, {"t": "مسائل على المماس والعمودي ومسابقة الختام", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يحل مسائل مركبة: نقاط تقاطع المماس أو العمودي مع المحاور أو مع المنحنى (20 دقيقة)\n2) يجد نقطة على المنحنى يكون عندها المماس موازيًا لمستقيم معلوم (20 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التوازي (تساوي الميول)، تقاطع المستقيم مع المحورين، مساحة المثلث المتكون", "سؤال: «متى يكون المماس موازيًا للمستقيم ص = 4س + 1؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: عندما ميله 4 (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بتمارين 4-4: ⁦8–14⁩ ص 162 موزعة على المجموعات، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كتاب النشاط: يكمل المعلم تمارين 4-4 ص ⁦93–94⁩، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. بطاقة الخروج: يكتب كل طالب على بطاقة إجابة سؤال «أوجد مساحة المثلث المحصور بين المماس ص = 2س − 1 والمحورين» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (7 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – رصيف المرفأ: يتخيل الطلبة منحنى ساحل عماني ونقطة مرفأ عليه، فتجد كل مجموعة معادلة المماس عند المرفأ ومعادلة العمودي الذي يمثل اتجاه رصيف ممتد إلى البحر، وتعرض حلها على مجموعة مجاورة للتحقق (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد النقطة على ص = س² التي يكون عندها المماس موازيًا للمستقيم ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] أوجد نقطة تقاطع المماس ص = 2س − 1 مع محور السينات.\nالإجابة النموذجية: (½، 0)\n3) [مستوى الاستدلال] المماس لـ ص = س² عند (1، 1) والعمودي عليه يقطعان محور الصادات. أوجد نقطتي التقاطع.\nالإجابة النموذجية: المماس ص = 2س − 1 ← (0، −1)؛ العمودي ص = −½ س + 3/2 ← (0، 3/2)", "1) [مستوى المعرفة] ميل مماس ص = س² − 2س عند س = 3؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد النقطة على ص = س³ التي يكون المماس عندها موازيًا لـ ص = 3س (س > 0).\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أوجد مساحة المثلث المحصور بين المماس ص = 2س − 1 والمحورين.\nالإجابة النموذجية: ½ × ½ × 1 = ¼ وحدة مربعة", "إرشاد للطالب: حل تمارين 4-4 (⁦8–20⁩) ص ⁦162–163⁩ حسب توجيه المعلم، وتمارين 4-4 ص ⁦93–94⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22"]}], "c": ["الحصة 1: معادلة المماس لمنحنى عند نقطة\n1) يجد معادلة المماس لمنحنى عند نقطة معلومة باستخدام المشتقة (25 دقيقة)\n2) يجد إحداثي النقطة عندما يكون المعطى قيمة س فقط (15 دقيقة)\n\nالحصة 2: معاد ة] أوجد ميل المماس لمنحنى ص = س² + 1 عند (1، 2).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد معادلة المماس عند (1، 2).\nالإجابة النموذجية: ص = 2س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س³ − 2س عند س = 2.\nالإجابة النموذجية: ص = 4، الميل 10 ← ص = 10س − 16\n\nالحصة 2: معادلة العمودي على المماس\n1) [مستوى المعرفة] إذا كان ميل المماس 4، فما ميل العمودي؟\nالإجابة النموذجية: −1/4\n2) [مستوى التطبيق] أوجد معادلة العمودي لـ ص = س² + 1 عند (1، 2).\nالإجابة النموذجية: ص − 2 = −½(س − 1) ← ص = −½ س + 5/2\n3) [مستوى الاستدلال] أوجد معادلة العمودي لـ ص = س³ − 2س عند (2، 4).\nالإجابة النموذجية: الميل −1/10 ← ص = −0.1س + 4.2\n\nالحصة 3: مسائل على المماس والعمودي ومسابقة الختام\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي يكون عندها المماس موازيًا للمستقيم ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] أوجد نقطة تقاطع المماس ص = 2س − 1 مع محور السينات.\nالإجابة النموذجية: (½، 0)\n3) [مستوى الاستدلال] المماس لـ ص = س² عند (1، 1) والعمودي عليه يقطعان محور الصادات. أوجد نقطتي التقاطع.\nالإجابة النموذجية: المماس ص = 2س − 1 ← (0، −1)؛ العمودي ص = −½ س + 3/2 ← (0، 3/2)", "الحصة 1: معادلة المماس لمنحنى عند نقطة\n1) [مستوى المعرفة] أوجد ميل المماس لـ ص = 3س² عند س = 1.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: الميل 1/4 ← ص = ¼ س + 1\n\nالحصة 2: معادلة العمودي على المماس\n1) [مستوى المعرفة] ما ميل العمودي إذا كان ميل المماس −3؟\nالإجابة النموذجية: 1/3\n2) [مستوى التطبيق] أوجد معادلة العمودي لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = −(1/6)س + 19/6\n3) [مستوى الاستدلال] لماذا لا يمكن إيجاد ميل العمودي بالقسمة إذا كان ميل المماس صفرًا؟ وما معادلته؟\nالإجابة النموذجية: لأن المماس أفقي فيكون العمودي رأسيًا: س = س₁\n\nالحصة 3: مسائل على المماس والعمودي ومسابقة الختام\n1) [مستوى المعرفة] ميل مماس ص = س² − 2س عند س = 3؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد النقطة على ص = س³ التي يكون المماس عندها موازيًا لـ ص = 3س (س > 0).\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أوجد مساحة المثلث المحصور بين المماس ص = 2س − 1 والمحورين.\nالإجابة النموذجية: ½ × ½ × 1 = ¼ وحدة مربعة", "الحصة 1: معادلة المماس لمنحنى عند نقطة\nإرشاد للطالب: مراجعة مثال 14 ص ⁦159–160⁩، وحل تمارين 4-4 (1، 2) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: معادلة العمودي على المماس\nإرشاد للطالب: مراجعة مثال 15 ص 160، وحل تمارين 4-4 (⁦3–7⁩) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مسائل على المماس والعمودي ومسابقة الختام\nإرشاد للطالب: حل تمارين 4-4 (⁦8–20⁩) ص ⁦162–163⁩ حسب توجيه المعلم، وتمارين 4-4 ص ⁦93–94⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22"]}, {"id": "5-4", "title": "الدوال المتزايدة والدوال المتناقصة", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦164–167⁩", "wbp": "⁦95–97⁩", "p": [{"t": "مفهوم الدالة المتزايدة والمتناقصة وعلاقتها بإشارة المشتقة", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يعرّف الدالة المتزايدة والمتناقصة من التمثيل البياني (استكشف 2) (20 دقيقة)\n2) يربط بين إشارة المشتقة وتزايد الدالة أو تناقصها (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "الدالة المتزايدة، الدالة المتناقصة، د′(س) > 0، د′(س) < 0", "ينفذ الطلبة استكشف 2 ص 164 بوصف منحنيين.", "1. التهيئة: يعرض المعلم استكشف 2، ويكمل الطالب العبارات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يستنتج المعلم العلاقة بين إشارة الميل والتزايد ص 165، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النمذجة: يحل المعل الدالة المتزايدة والمتناقصة وعلاقتها بإشارة المشتقة\n1) [مستوى المعرفة] إذا كان د′(س) > 0 لجميع س في فترة، فماذا نقول عن الدالة؟\nالإجابة النموذجية: متزايدة في تلك الفترة\n2) [مستوى التطبيق] هل ص = 2س³ + 3 متزايدة دائمًا؟ برر.\nالإجابة النموذجية: نعم؛ د′(س) = 6س² ≥ 0\n3) [مستوى الاستدلال] بيّن أن ص = 5 − 3س متناقصة.\nالإجابة النموذجية: د′(س) = −3 < 0\n\nالحصة 2: تحديد فترات التزايد والتناقص\n1) [مستوى المعرفة] حدد فترات تزايد ص = س² − 6س وتناقصها.\nالإجابة النموذجية: د′ = 2س − 6: متزايدة عندما س > 3، متناقصة عندما س < 3\n2) [مستوى التطبيق] حدد فترات تزايد ص = س³ − 3س.\nالإجابة النموذجية: 3س² − 3 > 0 ← س < −1 أو س > 1\n3) [مستوى الاستدلال] حدد فترة تناقص ص = س³ − 3س.\nالإجابة النموذجية: −1 < س < 1\n\nالحصة 3: تطبيقات على التزايد والتناقص ومسابقة الختام\n1) [مستوى المعرفة] أثبت أن ص = س³ − 6س² + 15س متزايدة لجميع س.\nالإجابة النموذجية: دص/دس = 3س² − 12س + 15 = 3[(س − 2)² + 1] > 0\n2) [مستوى التطبيق] ما إشارة مشتقة ص = −س³ لجميع س ≠ 0؟\nالإجابة النموذجية: سالبة (−3س²)\n3) [مستوى الاستدلال] أوجد قيم ك التي تجعل ص = س³ + ك س متزايدة لجميع س.\nالإجابة النموذجية: 3س² + ك ≥ 0 دائمًا ← ك ≥ 0", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة وعلاقتها بإشارة المشتقة\n1) [مستوى المعرفة] ما إشارة الميل لدالة متناقصة؟\nالإجابة النموذجية: سالبة\n2) [مستوى التطبيق] هل ص = س³ + س متزايدة لجميع س؟\nالإجابة النموذجية: نعم؛ 3س² + 1 > 0\n3) [مستوى الاستدلال] أعط مثالًا لدالة متناقصة لجميع قيم س.\nالإجابة النموذجية: مثل ص = −2س + 1\n\nالحصة 2: تحديد فترات التزايد والتناقص\n1) [مستوى المعرفة] حدد فترة تزايد ص = س² + 4س.\nالإجابة النموذجية: س > −2\n2) [مستوى التطبيق] حدد فترة تناقص ص = 10 + 2س − س².\nالإجابة النموذجية: س > 1\n3) [مستوى الاستدلال] حدد فترات تزايد ص = 2س³ − 6س² .\nالإجابة النموذجية: 6س² − 12س > 0 ← س < 0 أو س > 2\n\nالحصة 3: تطبيقات على التزايد والتناقص ومسابقة الختام\n1) [مستوى المعرفة] هل ص = س² متزايدة لجميع س؟\nالإجابة النموذجية: لا؛ متناقصة عندما س < 0\n2) [مستوى التطبيق] حدد فترة تزايد ص = (س − 3)².\nالإجابة النموذجية: س > 3\n3) [مستوى الاستدلال] هل ص = 1/س متناقصة لكل س > 0؟ برر.\nالإجابة النموذجية: نعم؛ دص/دس = −1/س² < 0", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة وعلاقتها بإشارة المشتقة\nإرشاد للطالب: مراجعة استكشف 2 ومثال 16 ص ⁦164–165⁩، وحل تمارين 5-4 (1، 2) ص 167 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: تحديد فترات التزايد والتناقص\nإرشاد للطالب: مراجعة مثالي 17، 18 ص 166، وحل تمارين 5-4 (⁦3–6⁩) ص 167 من كتاب الطالب، وتمارين 5-4 (⁦1–3⁩) ص 95 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تطبيقات على التزايد والتناقص ومسابقة الختام\nإرشاد للطالب: حل تمارين 5-4 (⁦7–9⁩) ص 167 من كتاب الطالب، وتمارين 5-4 ص ⁦95–97⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=23"]}, {"id": "6-4", "title": "النقاط الحرجة", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦168–180⁩", "wbp": "⁦98–107⁩", "p": [{"t": "تعريف النقطة الحرجة وأنواعها", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يعرّف النقطة الحرجة بأنها نقطة تكون فيها دص/دس = 0 (25 دقيقة)\n2) يميز بين النقطة العظمى والصغرى ونقطة الانعطاف الأفقية من التمثيل البياني (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: فهم", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "النقطة الحرجة (نقطة التحول)، النقطة العظمى المحلية، النقطة الصغرى المحلية، نقطة الانعطاف", "يعرض المعلم منحنى ص 168 ويسأل: «أين يكون المماس أفقيًا؟ وما الذي يحدث للمنحنى قبل تلك النقاط وبعدها؟»", "1. التهيئة: يعرض المعلم المنحنى، ويحدد الطالب النقاط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يشرح المعلم تعريف النقطة الحرجة وأنواعها ص ⁦168–169⁩، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 19 ص ⁦169–170⁩ (إيجاد النقاط الحرجة)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بإيجاد النقاط الحرجة لـ ص = س² − 4س + 1 و ص = س³ − 3س، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] ما قيمة دص/دس عند النقطة الحرجة؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = س² − 4س + 1.\nالإجابة النموذجية: س = 2 ← (2، −3)\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 3س.\nالإجابة النموذجية: س = ±1 ← (1، −2)، (−1، 2)", "1) [مستوى المعرفة] ما شكل المماس عند النقطة الحرجة؟\nالإجابة النموذجية: أفقي\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 3 + 2س − س².\nالإجابة النموذجية: (1، 4)\n3) [مستوى الاستدلال] أوجد النقطة الحرجة لـ ص = س³.\nالإجابة النموذجية: (0، 0)", "إرشاد للطالب: مراجعة ص ⁦168–170⁩ ومثال 19، وحل تمارين 6-4 (1) ص 174 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}, {"t": "تحديد نوع النقطة الحرجة باختبار المشتقة الأولى", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحدد نوع النقطة الحرجة بدراسة تغير إشارة دص/دس قبلها وبعدها (20 دقيقة)\n2) ينظم الحل في جدول إشارات (20 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام", "اختبار المشتقة الأولى، تغير الإشارة من + إلى − (عظمى)، من − إلى + (صغرى)، دون تغير (انعطاف)", "سؤال: «إذا كانت الدالة متزايدة ثم متناقصة، فما نوع النقطة بينهما؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: عظمى (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يطبق المعلم اختبار المشتقة الأولى على ص = س³ − 3س و ص = س³، ويتابع الطالب ويكمل جدول الإشارات (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تشاركي: يكلف الأزواج بتمارين 6-4: 1، 2 ص 174، ويحل الطالب ويتبادل (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. فردي: تمارين 6-4 (1، 2) ص 98 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] تغيرت إشارة المشتقة من سالبة إلى موجبة عند النقطة الحرجة. ما نوعها؟\nالإجابة النموذجية: صغرى\n2) [مستوى التطبيق] حدد نوع النقطة (−1، 2) على ص = س³ − 3س.\nالإجابة النموذجية: عظمى (الإشارة + ثم −)\n3) [مستوى الاستدلال] حدد نوع النقطة (0، 0) على ص = س³.\nالإجابة النموذجية: نقطة انعطاف (المشتقة موجبة قبلها وبعدها)", "1) [مستوى المعرفة] ما نوع النقطة (2، −3) على ص = س² − 4س + 1؟\nالإجابة النموذجية: صغرى\n2) [مستوى التطبيق] ما نوع النقطة (1، 4) على ص = 3 + 2س − س²؟\nالإجابة النموذجية: عظمى\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 12س وحدد نوعها.\nالإجابة النموذجية: (2، −16) صغرى، (−2، 16) عظمى", "إرشاد للطالب: حل تمارين 6-4 (1، 2) ص 174 من كتاب الطالب، وتمارين 6-4 (1، 2) ص 98 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}, {"t": "تحديد نوع النقطة الحرجة باختبار المشتقة الثانية", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحدد نوع النقطة الحرجة باستخدام إشارة د²ص/دس² (مثال 20) (25 دقيقة)\n2) يدرك حالة فشل الاختبار عندما تكون المشتقة الثانية صفرًا (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام", "اختبار المشتقة الثانية، د²ص/دس² < 0 عظمى، > 0 صغرى، = 0 الاختبار غير حاسم", "سؤال: «هل يمكن تحديد النوع دون رسم جدول إشارات؟»", "1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 20 ص 172 (ص = س + 9/س)، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 6-4: ⁦3–6⁩ ص ⁦174–175⁩، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: تمارين 6-4 (3، 4) ص 99 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] إذا كانت د²ص/دس² < 0 عند النقطة الحرجة، فما نوعها؟\nالإجابة النموذجية: عظمى\n2) [مستوى التطبيق] أوجد النقاط الحرجة لـ ص = س + 9/س.\nالإجابة النموذجية: (3، 6)، (−3، −6)\n3) [مستوى الاستدلال] حدد نوعها باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 18/س³: عند 3 موجبة ← صغرى؛ عند −3 سالبة ← عظمى", "1) [مستوى المعرفة] حدد نوع النقطة الحرجة لـ ص = 2س² − 8س باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 4 > 0 ← صغرى عند (2، −8)\n2) [مستوى التطبيق] أوجد د²ص/دس² لـ ص = س⁴ عند س = 0. ماذا تستنتج؟\nالإجابة النموذجية: صفر؛ الاختبار غير حاسم\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = 2س³ − 3س² وحدد نوعها.\nالإجابة النموذجية: (0، 0) عظمى، (1، −1) صغرى", "إرشاد للطالب: مراجعة مثال 20 ص 172، وحل تمارين 6-4 (⁦3–6⁩) ص ⁦174–175⁩ من كتاب الطالب، وتمارين 6-4 (3، 4) ص 99 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}, {"t": "مسائل تطبيقية على القيم العظمى والصغرى", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) ينمذج موقفًا حياتيًا بدالة في متغير واحد ويجد قيمتها العظمى أو الصغرى (مثال 21) (25 دقيقة)\n2) يتحقق من نوع القيمة ومعقولية الحل (15 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: تقييم", "التعلم المبني على حل المشكلات، التعلم المبني على المشاريع، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: ورق مقوى ومقص", "النمذجة، القيمة العظمى، القيمة الصغرى، القيود", "مسألة عملية: من ورق مقوى مربع طول ضلعه 12 سم يُقص مربع صغير من كل ركن لصنع صندوق. ما طول القص الذي يعطي أكبر حجم؟", "1. التهيئة: يعرض المعلم المسألة ويصنع نموذجًا، ويتوقع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 21 ص 173، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. مشروع مصغر تعاوني: تحل كل مجموعة مسألة: الصندوق، السياج بثلاثة جوانب (40 م)، السلك (24 سم)، وتبني الدالة وتشتقها وتجد القيمة (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. عرض: تعرض كل مجموعة نتيجتها، ويعرض الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "1) [مستوى المعرفة] سياج طوله 40 م لثلاثة جوانب من حظيرة مستطيلة بجانب جدار. اكتب المساحة بدلالة عرضها س.\nالإجابة النموذجية: م = س(40 − 2س)\n2) [مستوى التطبيق] أوجد س التي تجعل المساحة أكبر ما يمكن.\nالإجابة النموذجية: 40 − 4س = 0 ← س = 10 م، م = 200 م²\n3) [مستوى الاستدلال] في مسألة الصندوق (12 سم)، الحجم ح = س(12 − 2س)². أوجد س التي تجعل الحجم أكبر ما يمكن.\nالإجابة النموذجية: دح/دس = (12 − 2س)(12 − 6س) = 0 ← س = 2 سم (س = 6 مرفوض)، ح = 128 سم³", "1) [مستوى المعرفة] سلك طوله 24 سم شُكّل مستطيلًا. اكتب مساحته بدلالة طوله س.\nالإجابة النموذجية: م = س(12 − س)\n2) [مستوى التطبيق] أوجد أكبر مساحة ممكنة للمستطيل.\nالإجابة النموذجية: س = 6 ← م = 36 سم²\n3) [مستوى الاستدلال] عددان مجموعهما 20. أوجد أكبر قيمة لحاصل ضربهما.\nالإجابة النموذجية: س(20 − س) ← س = 10 ← 100", "إرشاد للطالب: مراجعة مثال 21 ص 173، وحل تمارين 6-4 (⁦7–13⁩) ص ⁦175–176⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}, {"t": "مراجعة الوحدة الرابعة (كتاب الطالب)", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يراجع مهارات الوحدة الرابعة: الاشتقاق، قاعدة السلسلة، المماس والعمودي، التزايد والتناقص، النقاط الحرجة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشك بيقات مثل Edpuzzle, Padlet, Kahoot", "التفاضل وتطبيقاته", "سؤال «صحح الخطأ»: كتب طالب مشتقة (3س + 2)⁴ = 4(3س + 2)³. ما الخطأ؟", "1. التهيئة: يعرض المعلم الخطأ، ويصححه الطالب: 12(3س + 2)³ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تدريب كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦102–107⁩ من كتاب النشاط، ويحل الطالب ويناقش (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يعرض المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. بطاقة الخروج: يكتب كل طالب على بطاقة إجابة سؤال «أوجد د²ص/دس² إذا كانت ص = س³ + 2س» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (9 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – قمم عمان وأوديتها: ترسم كل مجموعة منحنى لمسار رحلة يمر بقمة جبلية ووادٍ في عمان، وتحدد النقاط الحرجة حيث دص/دس = 0 وتصنفها إلى عظمى وصغرى وانعطاف أفقي، ثم تذكر ولاية عمانية تشتهر بجبالها أو أوديتها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد مشتقة ص = (3س + 2)⁴.\nالإجابة النموذجية: 12(3س + 2)³\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 4س − س² وحدد نوعها.\nالإجابة النموذجية: (2، 4) عظمى\n3) [مستوى الاستدلال] أوجد قيمة ك إذا كان لمنحنى ص = س² + ك س نقطة حرجة عند س = 3.\nالإجابة النموذجية: 2(3) + ك = 0 ← ك = −6", "1) [مستوى المعرفة] أوجد د²ص/دس² إذا كانت ص = س³ + 2س.\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد ميل ص = √(س² + 9) عند س = 4.\nالإجابة النموذجية: س/√(س² + 9) = 4/5\n3) [مستوى الاستدلال] أوجد أصغر قيمة لـ ص = س² − 10س + 30.\nالإجابة النموذجية: عند س = 5 ← ص = 5", "إرشاد للطالب: إكمال تمارين المراجعة في كتاب النشاط ص ⁦102–107⁩، والاستعداد للاختبار القصير والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}], "c": ["الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) يعرّف النقطة الحرجة بأنها نقطة تكون فيها دص/دس = 0 (25 دقيقة)\n2) يميز بين النقطة العظمى والصغرى ونقطة الانعطاف الأفقية من التمثيل البياني (15 دقيقة)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\n1) يحدد نوع النقطة الحرجة بدراسة تغير إشارة دص/دس قبلها وبعدها (20 دقيقة)\n2) ينظم الحل في جدول إشارات (20 دقيقة)\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) يحدد نوع النقطة الحرجة باستخدام إشارة د²ص/دس² (مثال 20) (25 دقيقة)\n2) يدرك حالة فشل الاختبار عندما تكون المشتقة الثانية صفرًا (15 دقيقة)\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\n1) ينمذج موقفًا حياتيًا بدالة في متغير واحد ويجد قيمتها العظمى أو الصغرى (مثال 21) (25 دقيقة)\n2) يتحقق من نوع القيمة ومعقولية الحل (15 دقيقة)\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) يراجع مهارات الوحدة الرابعة: الاشتقاق، قاعدة السلسلة، المماس والعمودي، التزايد والتناقص، النقاط الحرجة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) يطبق مهارات الوحدة الرابعة في تمارين كتاب النشاط (25 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي ويحترم دوره (15 دقيقة)", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nالمخرج 1: فهم\nالمخرج 2: فهم\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\nالمخرج 1: إبداع\nالمخرج 2: تقييم\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\nالتعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\nالتعلم المبني على حل المشكلات، ا ة: من ورق مقوى مربع طول ضلعه 12 سم يُقص مربع صغير من كل ركن لصنع صندوق. ما طول القص الذي يعطي أكبر حجم؟\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\nيقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الرابعة ص 177.\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nسؤال «صحح الخطأ»: كتب طالب مشتقة (3س + 2)⁴ = 4(3س + 2)³. ما الخطأ؟", "الحصة 1: تعريف النقطة الحرجة وأنواعها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم المنحنى، ويحدد الطالب النقاط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يشرح المعلم تعريف النقطة الحرجة وأنواعها ص ⁦168–169⁩، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 19 ص ⁦169–170⁩ (إيجاد النقاط الحرجة)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بإيجاد النقاط الحرجة لـ ص = س² − 4س + 1 و ص = س³ − 3س، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: عظمى (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. النمذجة: يطبق المعلم اختبار المشتقة الأولى على ص = س³ − 3س و ص = س³، ويتابع الطالب ويكمل جدول الإشارات (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تشاركي: يكلف الأزواج بتمارين 6-4: 1، 2 ص 174، ويحل الطالب ويتبادل (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. فردي: تمارين 6-4 (1، 2) ص 98 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: يحل المعلم مثال 20 ص 172 (ص = س + 9/س)، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تعاوني: يكلف المعلم بتمارين 6-4: ⁦3–6⁩ ص ⁦174–175⁩، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: تمارين 6-4 (3، 4) ص 99 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم المسألة ويصنع نموذجًا، ويتوقع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. النمذجة: يحل المعلم مثال 21 ص 173، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. مشروع مصغر تعاوني: تحل كل مجموعة مسألة: الصندوق، السياج بثلاثة جوانب (40 م)، السلك (24 سم)، وتبني الدالة وتشتقها وتجد القيمة (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. عرض: تعرض كل مجموعة نتيجتها، ويعرض الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. مراجعة مركزة: يبني المعلم مع الطلبة خريطة مفاهيم للوحدة، ويكمل الطالب الخريطة (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦178–180⁩ حسب المستوى، ويحل الطالب حسب مستواه (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الخطأ، ويصححه الطالب: 12(3س + 2)³ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تدريب كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦102–107⁩ من كتاب النشاط، ويحل الطالب ويناقش (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يعرض المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص النقاط الحرجة، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – قمم عمان وأوديتها: ترسم كل مجموعة منحنى لمسار رحلة يمر بقمة جبلية ووادٍ في عمان، وتحدد النقاط الحرجة حيث دص/دس = 0 وتصنفها إلى عظمى وصغرى وانعطاف أفقي، ثم تذكر ولاية عمانية تشتهر بجبالها أو أوديتها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) [مستوى المعرفة] ما قيمة دص/دس عند النقطة الحرجة؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = س² − 4س + 1.\nالإجابة النموذجية: س = 2 ← (2، −3)\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 3س.\nالإجابة النموذجية: س = ±1 ← (1، −2)، (−1، 2)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\n1) [مستوى المعرفة] تغيرت إشارة المشتقة من سالبة إلى موجبة عند النقطة الحرجة. ما نوعها؟\nالإجابة النموذجية: صغرى\n2) [مستوى التطبيق] حدد نوع النقطة (−1، 2) على ص = س³ − 3س.\nالإجابة النموذجية: عظمى (الإشارة + ثم −)\n3) [مستوى الاستدلال] حدد نوع النقطة (0، 0) على ص = س³.\nالإجابة النموذجية: نقطة انعطاف (المشتقة موجبة قبلها وبعدها)\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) [مستوى المعرفة] إذا كانت د²ص/دس² < 0 عند النقطة الحرجة، فما نوعها؟\nالإجابة النموذجية: عظمى\n2) [مستوى التطبيق] أوجد النقاط الحرجة لـ ص = س + 9/س.\nالإجابة النموذجية: (3، 6)، (−3، −6)\n3) [مستوى الاستدلال] حدد نوعها باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 18/س³: عند 3 موجبة ← صغرى؛ عند −3 سالبة ← عظمى\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\n1) [مستوى المعرفة] سياج طوله 40 م لثلاثة جوانب من حظيرة مستطيلة بجانب جدار. اكتب المساحة بدلالة عرضها س.\nالإجابة النموذجية: م = س(40 − 2س)\n2) [مستوى التطبيق] أوجد س التي تجعل المساحة أكبر ما يمكن.\nالإجابة النموذجية: 40 − 4س = 0 ← س = 10 م، م = 200 م²\n3) [مستوى الاستدلال] في مسألة الصندوق (12 سم)، الحجم ح = س(12 − 2س)². أوجد س التي تجعل الحجم أكبر ما يمكن.\nالإجابة النموذجية: دح/دس = (12 − 2س)(12 − 6س) = 0 ← س = 2 سم (س = 6 مرفوض)، ح = 128 سم³\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) [مستوى المعرفة] أوجد دص/دس إذا كانت ص = 3س⁴ − 2/س.\nالإجابة النموذجية: 12س³ + 2/س²\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = (2س − 1)³ عند س = 1.\nالإجابة النموذجية: ص = 1، الميل 6(1)² = 6 ← ص = 6س − 5\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 6س² + 9س وحدد نوعها.\nالإجابة النموذجية: (1، 4) عظمى، (3، 0) صغرى\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) [مستوى المعرفة] أوجد مشتقة ص = (3س + 2)⁴.\nالإجابة النموذجية: 12(3س + 2)³\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 4س − س² وحدد نوعها.\nالإجابة النموذجية: (2، 4) عظمى\n3) [مستوى الاستدلال] أوجد قيمة ك إذا كان لمنحنى ص = س² + ك س نقطة حرجة عند س = 3.\nالإجابة النموذجية: 2(3) + ك = 0 ← ك = −6", "الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) [مستوى المعرفة] ما شكل المماس عند النقطة الحرجة؟\nالإجابة النموذجية: أفقي\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 3 + 2س − س².\nالإجابة النموذجية: (1، 4)\n3) [مستوى الاستدلال] أوجد النقطة الحرجة لـ ص = س³.\nالإجابة النموذجية: (0، 0)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\n1) [مستوى المعرفة] ما نوع النقطة (2، −3) على ص = س² − 4س + 1؟\nالإجابة النموذجية: صغرى\n2) [مستوى التطبيق] ما نوع النقطة (1، 4) على ص = 3 + 2س − س²؟\nالإجابة النموذجية: عظمى\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 12س وحدد نوعها.\nالإجابة النموذجية: (2، −16) صغرى، (−2، 16) عظمى\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) [مستوى المعرفة] حدد نوع النقطة الحرجة لـ ص = 2س² − 8س باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 4 > 0 ← صغرى عند (2، −8)\n2) [مستوى التطبيق] أوجد د²ص/دس² لـ ص = س⁴ عند س = 0. ماذا تستنتج؟\nالإجابة النموذجية: صفر؛ الاختبار غير حاسم\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = 2س³ − 3س² وحدد نوعها.\nالإجابة النموذجية: (0، 0) عظمى، (1، −1) صغرى\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\n1) [مستوى المعرفة] سلك طوله 24 سم شُكّل مستطيلًا. اكتب مساحته بدلالة طوله س.\nالإجابة النموذجية: م = س(12 − س)\n2) [مستوى التطبيق] أوجد أكبر مساحة ممكنة للمستطيل.\nالإجابة النموذجية: س = 6 ← م = 36 سم²\n3) [مستوى الاستدلال] عددان مجموعهما 20. أوجد أكبر قيمة لحاصل ضربهما.\nالإجابة النموذجية: س(20 − س) ← س = 10 ← 100\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) [مستوى المعرفة] أوجد مشتقة ص = (س² + 1)⁴.\nالإجابة النموذجية: 8س(س² + 1)³\n2) [مستوى التطبيق] حدد فترة تناقص ص = س² − 8س.\nالإجابة النموذجية: س < 4\n3) [مستوى الاستدلال] أوجد معادلة العمودي لـ ص = س² عند (2، 4).\nالإجابة النموذجية: ص = −¼ س + 4.5\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) [مستوى المعرفة] أوجد د²ص/دس² إذا كانت ص = س³ + 2س.\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد ميل ص = √(س² + 9) عند س = 4.\nالإجابة النموذجية: س/√(س² + 9) = 4/5\n3) [مستوى الاستدلال] أوجد أصغر قيمة لـ ص = س² − 10س + 30.\nالإجابة النموذجية: عند س = 5 ← ص = 5", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nإرشاد للطالب: مراجعة ص ⁦168–170⁩ ومثال 19، وحل تمارين 6-4 (1) ص 174 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\nإرشاد للطالب: حل تمارين 6-4 (1، 2) ص 174 من كتاب الطالب، وتمارين 6-4 (1، 2) ص 98 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nإرشاد للطالب: مراجعة مثال 20 ص 172، وحل تمارين 6-4 (⁦3–6⁩) ص ⁦174–175⁩ من كتاب الطالب، وتمارين 6-4 (3، 4) ص 99 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\nإرشاد للطالب: مراجعة مثال 21 ص 173، وحل تمارين 6-4 (⁦7–13⁩) ص ⁦175–176⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الرابعة ص ⁦178–180⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nإرشاد للطالب: إكمال تمارين المراجعة في كتاب النشاط ص ⁦102–107⁩، والاستعداد للاختبار القصير والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}],[{"id": "1-1", "title": "الراديان", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦20–23⁩", "wbp": "⁦13–16⁩", "p": [{"t": "تعريف الراديان والعلاقة بين الراديان والدرجة", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يعرّف الراديان بأنه قياس زاوية مركزية تحصر قوسًا طوله يساوي طول نصف قطر الدائرة (20 دقيقة)\n2) يستنتج أن π راديان = 180° وأن الدورة الكاملة = 2π راديان (5 دقائق)\nمخرج تعليمي آخر: يكتب قياسات الزوايا الخاصة بدلالة π (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تذكر", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام، أخرى: خيط ودوائر كرتونية", "الراديان، الزاوية المركزية، القوس، نصف القطر، الدورة الكاملة، π", "مراجعة ما درسه الطالب سابقًا: قياس الزاوية بالدرجات، ومحيط الدائرة = 2π نق. يطرح المعلم سؤالًا: «كم مرة يمكن أن نلف نصف القطر على محيط الدائرة؟» ويستقبل التقديرات.", "1. التهيئة: يعرض المعلم صورة دائرة ويطرح سؤال لف نصف القطر على المحيط، ويوضح هدف الحصة، ويقدّر الطالب الإجابة ويتذكر قانون محيط الدائرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستكشاف: يوزع المعلم على المجموعات دوائر كرتونية وخيوطًا بطول نصف القطر، ويطلب لف الخيط على المحيط ورسم الزاوية المركزية المقابلة، ويلف الطالب الخيط ويرسم الزاوية ويقيسها بالمنقلة (≈ 57°) ويعد عدد مرات لف الخيط (≈ 6.28) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. بناء المفهوم: يعرض المعلم تعريف الراديان ص 20 ويستنتج مع الطلبة النتيجتين: قوس طوله نق يقابل 1 راديان، والمحيط يقابل 2π راديان، ومنه π راديان = 180°، ويناقش الطالب ويسجل التعريف والنتيجتين في دفتره (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تطبيق تعاوني: يطلب المعلم إكمال جدول الزوايا الخاصة (0°، 30°، 45°، 60°، 90°، 180°، 270°، 360°) بدلالة π، وتكمل كل مجموعة الجدول وتعرضه على السبورة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق والتقويم: يطرح المعلم أسئلة التقويم الختامي ويلخص الفكرة الرئيسة، ويجيب الطالب فرديًا على السبورات الصغيرة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما قياس الزاوية المركزية التي تحصر قوسًا طوله يساوي طول نصف قطر الدائرة؟\nالإجابة النموذجية: 1 راديان.\n2) [مستوى التطبيق] اكتب قياس الزاوية 90° بدلالة π.\nالإجابة النموذجية: π/2\n3) [مستوى الاستدلال] كم راديانًا تساوي الدورة الكاملة؟ ولماذا؟\nالإجابة النموذجية: 2π راديان؛ لأن المحيط 2π نق، أي إن المحيط يحوي 2π من أنصاف الأقطار.", "1) [مستوى المعرفة] أكمل: π راديان = .......°\nالإجابة النموذجية: 180\n2) [مستوى التطبيق] حوّل 45° و 270° إلى الراديان بدلالة π.\nالإجابة النموذجية: 45° = π/4 ، 270° = 3π/2\n3) [مستوى الاستدلال] هل الزاوية التي قياسها 1 راديان أكبر أم أصغر من 60°؟ برّر.\nالإجابة النموذجية: أصغر؛ لأن 1 راديان = 180/π ≈ 57.3° < 60°.", "إرشاد للطالب: قراءة تعريف الراديان والنتيجتين 1 و 2 ص 20 من كتاب الطالب، وحفظ جدول الزوايا الخاصة ص 21.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=1"]}, {"t": "التحويل بين الدرجات والراديان", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يحوّل قياس الزاوية من الدرجات إلى الراديان بدلالة π أو بقيمة تقريبية (15 دقيقة)\n2) يحوّل قياس الزاوية من الراديان إلى الدرجات (10 دقائق)\nمخرج تعليمي آخر: يقرّب قياس الزاوية بالراديان إلى عدد محدد من الأرقام المعنوية (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: الآلة الحاسبة العلمية، أخرى: بطاقات عمل", "التحويل من الدرجات إلى الراديان (× π/180)، التحويل من الراديان إلى الدرجات (× 180/π)، الأرقام المعنوية", "مراجعة سريعة لجدول الزوايا الخاصة بلعبة «اسأل وأجب»: يذكر المعلم زاوية بالدرجات ويذكر الطالب ما يساويها بالراديان.", "1. التهيئة: ينفذ المعلم لعبة «اسأل وأجب» على الزوايا الخاصة، ويجيب الطالب بسرعة ويصحح لزملائه (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 1 ص 21 بالطريقتين (التناسب، والضرب في π/180 أو 180/π) ويبرز متى نكتب الناتج بدلالة π، ويتابع الطالب ويدوّن الطريقتين ويستنتج قاعدتي التحويل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق تعاوني: يوزع المعلم بطاقات مطابقة (زاوية بالدرجات ↔ قياسها بالراديان) على المجموعات، وتطابق المجموعة البطاقات وتبرر مطابقتين أمام الصف (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تدريب فردي: يكلف المعلم بحل تمارين 1-1: 1، 2، 3 (أ، ب) ص ⁦22–23⁩ ويتجول للمتابعة، ويحل الطالب فرديًا ويقرب إلى 3 أرقام معنوية عند الحاجة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يعرض المعلم أسئلة الختام ويغلق الحصة بقاعدتي التحويل، ويجيب الطالب ويصحح ذاتيًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] حوّل 60° إلى الراديان بدلالة π.\nالإجابة النموذجية: 60 × π/180 = π/3\n2) [مستوى التطبيق] حوّل 5π/9 إلى الدرجات.\nالإجابة النموذجية: 5π/9 × 180/π = 100°\n3) [مستوى الاستدلال] حوّل 210° إلى الراديان بدلالة π.\nالإجابة النموذجية: 210 × π/180 = 7π/6", "1) [مستوى المعرفة] حوّل π/6 إلى الدرجات.\nالإجابة النموذجية: 30°\n2) [مستوى التطبيق] حوّل 0.8 راديان إلى الدرجات مقربًا إلى أقرب منزلة عشرية.\nالإجابة النموذجية: 0.8 × 180/π ≈ 45.8°\n3) [مستوى الاستدلال] حوّل 320° إلى الراديان مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 320 × π/180 ≈ 5.59 راديان", "إرشاد للطالب: مراجعة مثال 1 ص 21، وحل تمارين 1-1 (3، 4، 5) ص 23 من كتاب الطالب، وتمارين 1-1 (1، 2) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز ال  الناتج بمقارنة قياس الزاوية بالدرجات (15 دقيقة)", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nالمخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تذكر\n\nالحصة 2: التحويل بين الدرجات والراديان\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة\n\nالحصة 2: التحويل بين الدرجات والراديان\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nالكتاب، السبورة الذكية، الأقلام، أخرى: خيط ودوائر كرتونية\n\nالحصة 2: التحويل بين الدرجات والراديان\nالكتاب، السبورة الذكية، الأقلام، أخرى: الآلة الحاسبة العلمية، أخرى: بطاقات عمل\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nالراديان، الزاوية المركزية، القوس، نصف القطر، الدورة الكاملة، π\n\nالحصة 2: التحويل بين الدرجات والراديان\nالتحويل من الدرجات إلى الراديان (× π/180)، التحويل من الراديان إلى الدرجات (× 180/π)، الأرقام المعنوية\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nوضع الراديان (RAD)، وضع الدرجات (DEG)، الجيب، جيب التمام، الظل، المثلث القائم الزاوية", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nمراجعة ما درسه الطالب سابقًا: قياس الزاوية بالدرجات، ومحيط الدائرة = 2π نق. يطرح المعلم سؤالًا: «كم مرة يمكن أن نلف نصف القطر على محيط الدائرة؟» ويستقبل التقديرات.\n\nالحصة 2: التحويل بين الدرجات والراديان\nمراجعة سريعة لجدول الزوايا الخاصة بلعبة «اسأل وأجب»: يذكر المعلم زاوية بالدرجات ويذكر الطالب ما يساويها بالراديان.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nسؤال تحفيزي: «احسب جا 30 على الحاسبة، ثم احسب جا(π/6). لماذا قد تختلف النتيجتان على حاسبة زميلك؟» لإبراز أهمية وضع الحاسبة.", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة دائرة ويطرح سؤال لف نصف القطر على المحيط، ويوضح هدف الحصة، ويقدّر الطالب الإجابة ويتذكر قانون محيط الدائرة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستكشاف: يوزع المعلم على المجموعات دوائر كرتونية وخيوطًا بطول نصف القطر، ويطلب لف الخيط على المحيط ورسم الزاوية المركزية المقابلة، ويلف الطالب الخيط ويرسم الزاوية ويقيسها بالمنقلة (≈ 57°) ويعد عدد مرات لف الخيط (≈ 6.28) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. بناء المفهوم: يعرض المعلم تعريف الراديان ص 20 ويستنتج مع الطلبة النتيجتين: قوس طوله نق يقابل 1 راديان، والمحيط يقابل 2π راديان، ومنه π راديان = 180°، ويناقش الطالب ويسجل التعريف والنتيجتين في دفتره (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تطبيق تعاوني: يطلب المعلم إكمال جدول الزوايا الخاصة (0°، 30°، 45°، 60°، 90°، 180°، 270°، 360°) بدلالة π، وتكمل كل مجموعة الجدول وتعرضه على السبورة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الغلق والتقويم: يطرح المعلم أسئلة التقويم الختامي ويلخص الفكرة الرئيسة، ويجيب الطالب فرديًا على السبورات الصغيرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: التحويل بين الدرجات والراديان — زمن الحصة 40 دقيقة\n\n1. التهيئة: ينفذ المعلم لعبة «اسأل وأجب» على الزوايا الخاصة، ويجيب الطالب بسرعة ويصحح لزملائه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يحل المعلم مثال 1 ص 21 بالطريقتين (التناسب، والضرب في π/180 أو 180/π) ويبرز متى نكتب الناتج بدلالة π، ويتابع الطالب ويدوّن الطريقتين ويستنتج قاعدتي التحويل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق تعاوني: يوزع المعلم بطاقات مطابقة (زاوية بالدرجات ↔ قياسها بالراديان) على المجموعات، وتطابق المجموعة البطاقات وتبرر مطابقتين أمام الصف (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تدريب فردي: يكلف المعلم بحل تمارين 1-1: 1، 2، 3 (أ، ب) ص ⁦22–23⁩ ويتجول للمتابعة، ويحل الطالب فرديًا ويقرب إلى 3 أرقام معنوية عند الحاجة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي: يعرض المعلم أسئلة الختام ويغلق الحصة بقاعدتي التحويل، ويجيب الطالب ويصحح ذاتيًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم سؤال الحاسبة ويستقبل تفسيرات الطلبة، ويجرب الطالب على الحاسبة ويقارن النتائج (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يوضح المعلم ضبط الحاسبة على RAD ص 22 ويحسب أمثلة جا(π/6)، جتا(0.9)، ويطبق الطالب الخطوات على حاسبته (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مسألة: يحل المعلم مثال 2 ص 22 (حساب ضلع في مثلث زاويته 0.6 راديان) دون التحويل إلى الدرجات، ويشارك الطالب في خطوات الحل ويكتبها (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تطبيق تعاوني: يكلف المجموعات بحل تمارين 1-1: 6، 7 ص 23، وتحل المجموعة وتعرض حلًا واحدًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «حوّل 5π/9 إلى الدرجات»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس رغيف الرخال: تتخيل المجموعات خبز الرخال العماني الدائري، وتقص من ورقة دائرية قوسًا طوله يساوي نصف القطر لتعيين زاوية راديان واحد، ثم تقدّر عدد هذه الأقواس في نصف الرغيف وتقارنه بالعدد π (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n1) [مستوى المعرفة] ما قياس الزاوية المركزية التي تحصر قوسًا طوله يساوي طول نصف قطر الدائرة؟\nالإجابة النموذجية: 1 راديان.\n2) [مستوى التطبيق] اكتب قياس الزاوية 90° بدلالة π.\nالإجابة النموذجية: π/2\n3) [مستوى الاستدلال] كم راديانًا تساوي الدورة الكاملة؟ ولماذا؟\nالإجابة النموذجية: 2π راديان؛ لأن المحيط 2π نق، أي إن المحيط يحوي 2π من أنصاف الأقطار.\n\nالحصة 2: التحويل بين الدرجات والراديان\n1) [مستوى المعرفة] حوّل 60° إلى الراديان بدلالة π.\nالإجابة النموذجية: 60 × π/180 = π/3\n2) [مستوى التطبيق] حوّل 5π/9 إلى الدرجات.\nالإجابة النموذجية: 5π/9 × 180/π = 100°\n3) [مستوى الاستدلال] حوّل 210° إلى الراديان بدلالة π.\nالإجابة النموذجية: 210 × π/180 = 7π/6\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n1) [مستوى المعرفة] ما قيمة جا(π/6)؟\nالإجابة النموذجية: 0.5\n2) [مستوى التطبيق] أوجد جتا(0.9) مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 0.622\n3) [مستوى الاستدلال] مثلث قائم الزاوية طول وتره 12 سم وإحدى زواياه 0.7 راديان. أوجد طول الضلع المقابل لهذه الزاوية.\nالإجابة النموذجية: 12 جا(0.7) ≈ 7.73 سم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\n1) [مستوى المعرفة] أكمل: π راديان = .......°\nالإجابة النموذجية: 180\n2) [مستوى التطبيق] حوّل 45° و 270° إلى الراديان بدلالة π.\nالإجابة النموذجية: 45° = π/4 ، 270° = 3π/2\n3) [مستوى الاستدلال] هل الزاوية التي قياسها 1 راديان أكبر أم أصغر من 60°؟ برّر.\nالإجابة النموذجية: أصغر؛ لأن 1 راديان = 180/π ≈ 57.3° < 60°.\n\nالحصة 2: التحويل بين الدرجات والراديان\n1) [مستوى المعرفة] حوّل π/6 إلى الدرجات.\nالإجابة النموذجية: 30°\n2) [مستوى التطبيق] حوّل 0.8 راديان إلى الدرجات مقربًا إلى أقرب منزلة عشرية.\nالإجابة النموذجية: 0.8 × 180/π ≈ 45.8°\n3) [مستوى الاستدلال] حوّل 320° إلى الراديان مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 320 × π/180 ≈ 5.59 راديان\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\n1) [مستوى المعرفة] على أي وضع تُضبط الحاسبة لحساب جتا(1.2)؟\nالإجابة النموذجية: وضع الراديان RAD.\n2) [مستوى التطبيق] أوجد ظا(1.5) مقربًا إلى 3 أرقام معنوية.\nالإجابة النموذجية: 14.1\n3) [مستوى الاستدلال] مثلث قائم الزاوية طول الضلع المجاور لزاوية قياسها π/5 يساوي 8 سم. أوجد طول الضلع المقابل.\nالإجابة النموذجية: 8 ظا(π/5) ≈ 5.81 سم", "الحصة 1: تعريف الراديان والعلاقة بين الراديان والدرجة\nإرشاد للطالب: قراءة تعريف الراديان والنتيجتين 1 و 2 ص 20 من كتاب الطالب، وحفظ جدول الزوايا الخاصة ص 21.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التحويل بين الدرجات والراديان\nإرشاد للطالب: مراجعة مثال 1 ص 21، وحل تمارين 1-1 (3، 4، 5) ص 23 من كتاب الطالب، وتمارين 1-1 (1، 2) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: استخدام الحاسبة في وضع الراديان وحل مسائل في المثلث\nإرشاد للطالب: حل تمارين 1-1 (6، 8) ص 23 من كتاب الطالب، وتمارين 1-1 (⁦3–6⁩) ص ⁦14–16⁩ من كتاب النشاط، والتأكد من ضبط الحاسبة على الوضع المناسب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=1"]}, {"id": "2-1", "title": "طول القوس", "unit": "الوحدة الأولى: القياس الدائري", "sbp": "⁦24–27⁩", "wbp": "⁦17–19⁩", "p": [{"t": "القوس والوتر والقطاع والقطعة، واستنتاج قانون طول القوس", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يميّز بين القوس والوتر والقطاع الدائري والقطعة الدائرية (الصغرى والكبرى) (10 دقائق)\n2) يستنتج قانون طول القوس ل = نق × هـ عندما تُقاس هـ بالراديان، ويستخدمه (15 دقيقة)\nمخرج تعليمي آخر: يعبّر عن طول القوس بدلالة π (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم بالنمذجة", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام", "القوس الأصغر والأكبر، الوتر، القطاع الدائري، القطعة الدائرية، طول القوس ل = نق هـ", "ينفذ الطلبة استكشف 1 ص 24: مناقشة معاني الكلمات (قطعة دائرية، قطاع دائري، قوس، وتر) من خلال الشكل.", "1. التهيئة (استكشف 1): يعرض المعلم الشكل ص 24 ويدير نقاشًا حول المصطلحات، ويشرح كل مصطلح بلغته ويشير إليه على الشكل (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يقود الطلبة لاستنتاج أن طول القوس يتناسب مع الزاوية: زاوية 1 راديان ← قوس نق، فزاوية هـ ← قوس نق هـ، ويستنتج الطالب القانون ويقارنه بقانون الدرجات (س/360) × 2π نق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النمذجة: يحل المعلم مثال 3 ص 25 (نق = 15 سم، هـ = π/3)، ويتابع الطالب ويكتب الحل بدلالة π (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تدريب تشاركي: يكلف الأزواج بحل تمارين 2-1: 1 (أ–د) ص 26، ويحل الطالب مع زميله ويتبادلان التصحيح (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الغلق: يطرح المعلم أسئلة الختام ويلخص القانون وشرطه، ويجيب الطالب فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] في الشكل: ما الفرق بين القوس الأصغر والوتر الذي يحصره؟\nالإجابة النموذجية: القوس جزء من محيط الدائرة، والوتر قطعة مستقيمة تصل بين طرفي القوس.\n2) [مستوى التطبيق] أوجد طول القوس في دائرة نصف قطرها 8 سم يقابل زاوية مركزية π/4.\nالإجابة النموذجية: ل = 8 × π/4 = 2π سم\n3) [مستوى الاستدلال] لماذا لا يصح القانون ل = نق هـ إذا كانت هـ بالدرجات؟ وما الصيغة المكافئة بالدرجات؟\nالإجابة النموذجية: لأن القانون مبني على تعريف الراديان؛ وبالدرجات: ل = (هـ/360) × 2π نق.", "1) [مستوى المعرفة] أوجد طول القوس الذي يقابل زاوية مركزية 2 راديان في دائرة نصف قطرها 6 سم.\nالإجابة النموذجية: 12 سم\n2) [مستوى التطبيق] أوجد طول القوس بدلالة π: نق = 7 سم، هـ = π/3.\nالإجابة النموذجية: 7π/3 سم\n3) [مستوى الاستدلال] أوجد طول القوس بدلالة π: نق = 24 سم، هـ = 7π/8.\nالإجابة النموذجية: 21π سم", "إرشاد للطالب: مراجعة استكشف 1 ومثال 3 ص ⁦24–25⁩، وحل تمارين 2-1 (1، 2) ص 26 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=2"]}, {"t": "إيجاد نصف القطر أو الزاوية، ومحيط القطاع الدائري", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يجد نصف القطر أو قياس الزاوية المركزية بمعلومية طول القوس (15 دقيقة)\n2) يجد محيط القطاع الدائري = 2نق + نق هـ (10 دقائق)\nمخرج تعليمي آخر: يوظف طول القوس في حل مسائل حياتية (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، صورة توضيحية", "طول القوس، نصف القطر، الزاوية المركزية بالراديان، محيط القطاع الدائري", "سؤال سريع: «قوس طوله 10 سم في دائرة نصف قطرها 5 سم؛ كم راديانًا قياس زاويته؟» لتثبيت فكرة إعادة ترتيب القانون.", "1. التهيئة: يطرح المعلم السؤال ويوجه إلى إعادة ترتيب القانون، ويجيب الطالب: هـ = 2 راديان (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 4 ص 25 (إيجاد نق) ويناقش مكونات محيط القطاع (نصفا قطر + قوس)، ويتابع الطالب ويرسم القطاع ويحدد مكونات محيطه (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق تعاوني: يكلف المجموعات بتمارين 2-1: 3، 4، 5 ص 26 (ومنها مسألة العجلة الدوارة)، وتحل المجموعة وتعرض مسألة العجلة الدوارة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تدريب فردي: يكلف المعلم بحل تمرين من كتاب النشاط تمارين 2-1 ص 17، ويحل الطالب ويقارن بإجابة زميله (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة الختام، ويجيب الطالب فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] قطاع دائري طول قوسه 12 سم وقياس زاويته 1.5 راديان. أوجد نصف القطر.\nالإجابة النموذجية: نق = 12 ÷ 1.5 = 8 سم\n2) [مستوى التطبيق] أوجد قياس زاوية القطاع بالراديان إذا كان نق = 10 سم وطول القوس 5 سم.\nالإجابة النموذجية: هـ = 5/10 = 0.5 راديان\n3) [مستوى الاستدلال] أوجد محيط قطاع دائري نصف قطره 5 سم وقياس زاويته 1.2 راديان.\nالإجابة النموذجية: 2(5) + 5(1.2) = 16 سم", "1) [مستوى المعرفة] أوجد طول القوس: نق = 10 سم، هـ = 1.3 راديان.\nالإجابة النموذجية: 13 سم\n2) [مستوى التطبيق] نق = 12 سم، طول القوس 9.6 سم. أوجد هـ.\nالإجابة النموذجية: 0.8 راديان\n3) [مستوى الاستدلال] عجلة دوّارة قطرها 158.5 م دارت بزاوية π/16. أوجد المسافة التي يقطعها راكب على محيطها.\nالإجابة النموذجية: نق = 79.25 م، ل = 79.25 × π/16 ≈ 15.6 م", "إرشاد للطالب: حل تمارين 2-1 (5، 6) ص ⁦26–27⁩ من كتاب الطالب، وتمارين 2-1 (⁦1–4⁩) ص ⁦17–18⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=2"]}, {"t": "مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يحسب طول الوتر باستخدام قانون جيب التمام أو النسب المثلثية مع الزوايا بالراديان (20 دقيقة)\n2) يحل مسائل تتضمن محيط مناطق مظللة مكوّنة من أقواس وقطع مستقيمة (10 دقائق)\nمخرج تعليمي آخر: يبرهن علاقات هندسية تتضمن طول القوس (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "طول الوتر = 2نق جا(هـ/2)، المماس عمودي على نصف القطر، محيط القطعة الدائرية، المنطقة المظللة", "مراجعة قانوني الجيب وجيب التمام في المثلث، وخاصية المماس العمودي على نصف القطر عند نقطة التماس.", "1. التهيئة: يراجع المعلم القوانين المطلوبة بأسئلة شفوية، ويتذكر الطالب القوانين ويكتبها (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 5 ص ⁦25–26⁩ خطوة بخطوة، ويبرز تقسيم المثلث المتطابق الضلعين إلى مثلثين قائمين، ويتابع الطالب ويقترح طريقة بديلة لإيجاد الوتر (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل مشكلات تعاوني: يوزع المعلم تمارين 2-1: 6، 7، 8 ص 27 على المجموعات، وتحل كل مجموعة مسألة وتشرحها للصف (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تحدٍّ: يعرض المعلم تمرين 9 ص 27 للطلبة المتقدمين، ويحاول الطالب إثبات العلاقة المطلوبة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن مسائل مركبة على طول القوس والوتر ومحيط المناطق المظللة، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – قوس بوابة القلعة: تحسب كل مجموعة طول قوس زخرفي يزيّن بوابة قلعة عمانية بنصف قطر وزاوية بالراديان تختارهما، وتميّز على رسمها القوس والوتر والقطاع والقطعة، ثم تعرض مجموعة حلها والبقية تتحقق منه (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "1) [مستوى المعرفة] أوجد طول القوس في دائرة نصف قطرها 7 سم يقابل زاوية 2 راديان.\nالإجابة النموذجية: 14 سم\n2) [مستوى التطبيق]
