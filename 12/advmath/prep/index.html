 1/(جا س جتا س)", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\n1) [مستوى الدعم] بسّط: 1 − جا² هـ.\nالإجابة النموذجية: جتا² هـ\n2) [المستوى المتوقع] بسّط: جا هـ ÷ ظا هـ.\nالإجابة النموذجية: جتا هـ\n3) [المستوى المتقدم] اكتب 3 − 2جا² س بدلالة جتا س.\nالإجابة النموذجية: 3 − 2(1 − جتا² س) = 1 + 2جتا² س\n\nالحصة 2: برهنة المتطابقات المثلثية\n1) [مستوى الدعم] أثبت أن: ظا س/جا س ≡ 1/جتا س.\nالإجابة النموذجية: (جا س/جتا س) ÷ جا س = 1/جتا س\n2) [المستوى المتوقع] أثبت أن: جا⁴ س − جتا⁴ س ≡ جا² س − جتا² س.\nالإجابة النموذجية: (جا² س − جتا² س)(جا² س + جتا² س) = جا² س − جتا² س\n3) [المستوى المتقدم] أثبت أن: (1 + جا س)/جتا² س ≡ 1/(1 − جا س).\nالإجابة النموذجية: (1 + جا س)/[(1 − جا س)(1 + جا س)] = 1/(1 − جا س)\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\n1) [مستوى الدعم] إذا كان جتا س = 5/13 وس حادة، أوجد ظا س.\nالإجابة النموذجية: 12/5\n2) [المستوى المتوقع] أثبت أن: جتا² س − جا² س ≡ 1 − 2جا² س.\nالإجابة النموذجية: (1 − جا² س) − جا² س = 1 − 2جا² س\n3) [المستوى المتقدم] أثبت أن: (1 − جتا س)(1 + جتا س) ≡ جا² س.\nالإجابة النموذجية: 1 − جتا² س = جا² س", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\nإرشاد للطالب: مراجعة البرهان ص 84 ومثال 21، وحل تمارين 7-2 (1) ص 85 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: برهنة المتطابقات المثلثية\nإرشاد للطالب: مراجعة مثال 23 ص 85، وحل تمارين 7-2 (2، 3) ص ⁦85–86⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 7-2 ص ⁦50–52⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "8-2", "title": "المزيد من المعادلات المثلثية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦87–95⁩", "wbp": "⁦53–58⁩", "p": [{"t": "معادلات تُحل باستخدام ظا س = جا س/جتا س", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يحوّل معادلات مثل جا س = 2جتا س إلى صورة ظا س = ك ويحلها.\n2) يحل معادلات تتضمن جا س جتا س بالتحليل مع مراعاة عدم القسمة على عامل قد يساوي صفرًا.", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "استخدام ظا = جا/جتا، القسمة على جتا س، فقدان الحلول، التحليل إلى عوامل", "سؤال: «لو قسمنا طرفي جا س جتا س = جا س على جا س، فما الحلول التي قد نفقدها؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يكتشف أن حلول جا س = 0 تضيع.\n(12 د) النمذجة: المعلم: يحل مثال 24 ص 87 وتمرين 8-2: 1 ص 89. | الطالب: يتابع.\n(10 د) تعاوني: المعلم: يكلف بحل: جا س = 2جتا س، 3جا س = جتا س، جا س جتا س = جا س. | الطالب: تحل المجموعات.\n(8 د) فردي: المعلم: يكلف بتمارين 8-2: 2، 4 ص 89. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1 ← س = 45°، 225°\n2) [المستوى المتوقع] حل: جا س = 2جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 2 ← س ≈ 63.4°، 243.4°\n3) [المستوى المتقدم] حل: جا س جتا س = جا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س(جتا س − 1) = 0 ← س = 0°، 180°، 360°", "1) [مستوى الدعم] حل: √3 جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1/√3 ← س = 30°، 210°\n2) [المستوى المتوقع] حل: جتا س + جا س = 5جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 4 ← س ≈ 76.0°، 256.0°\n3) [المستوى المتقدم] حل: 2جا س جتا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س(2جا س − 1) = 0 ← س = 30°، 90°، 150°، 270°", "إرشاد للطالب: مراجعة مثال 24 ص 87، وحل تمارين 8-2 (1، 2، 4) ص 89 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "معادلات تُحل باستخدام جا² س + جتا² س = 1", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يحول معادلة تحتوي جا² س وجتا س (أو العكس) إلى معادلة تربيعية في نسبة واحدة ويحلها.\n2) يحل معادلات مثل ظا س − جتا س = 0 بتحويلها إلى معادلة تربيعية (مثال 25).", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: برنامج GeoGebra", "الاستبدال جا² س = 1 − جتا² س، المعادلة التربيعية، الصيغة التربيعية، الحلول المرفوضة", "سؤال: «في المعادلة 2جتا² س + 3جا س = 3، كيف نجعل المعادلة كلها بدلالة جا س؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يقترح الاستبدال.\n(12 د) النمذجة: المعلم: يحل مثال 25 ص 88 ويتحقق بالرسم. | الطالب: يتابع ويتحقق.\n(10 د) تعاوني: المعلم: يكلف بتمارين 8-2: 3، 5، 6 ص 89. | الطالب: تحل المجموعات.\n(8 د) فردي: المعلم: تمارين 8-2 (⁦1–4⁩) ص ⁦53–54⁩ من كتاب النشاط. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] اكتب المعادلة 2جتا² س + 3جا س = 3 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 3جا س + 1 = 0\n2) [المستوى المتوقع] حل المعادلة السابقة حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = 1 أو 1/2 ← س = 30°، 90°، 150°\n3) [المستوى المتقدم] بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0.\nالإجابة النموذجية: جا س = جتا² س = 1 − جا² س", "1) [مستوى الدعم] حل: جا² س = جتا² س حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: ظا² س = 1 ← س = 45°، 135°\n2) [المستوى المتوقع] حل: 2جا² س = 1 + جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جتا² س + جتا س − 1 = 0 ← جتا س = 1/2 أو −1 ← س = 60°، 180°، 300°\n3) [المستوى المتقدم] حل: جا² س + جا س − 1 = 0 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: جا س = (−1 + √5)/2 ≈ 0.618 ← س ≈ 38.2°، 141.8°", "إرشاد للطالب: مراجعة مثال 25 ص 88، وحل تمارين 8-2 (3، ⁦5–9⁩) ص 89 من كتاب الطالب، وتمارين 8-2 ص ⁦53–55⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "مراجعة الوحدة الثانية ومسابقة الختام", "w": ية: ظا س = 2 ← س ≈ 63.4°، 243.4°\n3) [المستوى المتقدم] حل: جا س جتا س = جا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س(جتا س − 1) = 0 ← س = 0°، 180°، 360°\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) [مستوى الدعم] اكتب المعادلة 2جتا² س + 3جا س = 3 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 3جا س + 1 = 0\n2) [المستوى المتوقع] حل المعادلة السابقة حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = 1 أو 1/2 ← س = 30°، 90°، 150°\n3) [المستوى المتقدم] بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0.\nالإجابة النموذجية: جا س = جتا² س = 1 − جا² س\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) [مستوى الدعم] أوجد القيمة الدقيقة لـ جتا(5π/6).\nالإجابة النموذجية: −√3/2\n2) [المستوى المتوقع] حل: جتا² س = 1/4 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س = ±1/2 ← س = 60°، 120°، 240°، 300°\n3) [المستوى المتقدم] بسّط: (جا س + جتا س)² + (جا س − جتا س)².\nالإجابة النموذجية: 2(جا² س + جتا² س) = 2", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) [مستوى الدعم] حل: √3 جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1/√3 ← س = 30°، 210°\n2) [المستوى المتوقع] حل: جتا س + جا س = 5جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 4 ← س ≈ 76.0°، 256.0°\n3) [المستوى المتقدم] حل: 2جا س جتا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س(2جا س − 1) = 0 ← س = 30°، 90°، 150°، 270°\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) [مستوى الدعم] حل: جا² س = جتا² س حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: ظا² س = 1 ← س = 45°، 135°\n2) [المستوى المتوقع] حل: 2جا² س = 1 + جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جتا² س + جتا س − 1 = 0 ← جتا س = 1/2 أو −1 ← س = 60°، 180°، 300°\n3) [المستوى المتقدم] حل: جا² س + جا س − 1 = 0 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: جا س = (−1 + √5)/2 ≈ 0.618 ← س ≈ 38.2°، 141.8°\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) [مستوى الدعم] ما سعة الدالة ص = 3جتا 2س ودورتها؟\nالإجابة النموذجية: السعة 3، الدورة 180°\n2) [المستوى المتوقع] أوجد جتا⁻¹(−√2/2) بالراديان.\nالإجابة النموذجية: 3π/4\n3)  5ن/(ن + 2). أوجد نها(ن←∞) ت(ن) وفسرها.\nالإجابة النموذجية: 5؛ يستقر التركيز قرب 5 وحدات\n2) [المستوى المتوقع] ما خط التقارب الأفقي لمنحنى ص = (2س − 3)/(س + 1)؟\nالإجابة النموذجية: ص = 2\n3) [المستوى المتقدم] اكتب دالة نسبية لها خط تقارب أفقي ص = 4 ورأسي س = 1.\nالإجابة النموذجية: مثل ص = 4س/(س − 1)", "الحصة 1: مفهوم النهاية عند اللانهاية وخط التقارب الأفقي\n1) [مستوى الدعم] أوجد نها(س←−∞) 4/س².\nالإجابة النموذجية: 0\n2) [المستوى المتوقع] أوجد نها(س←∞) (7 + 1/س).\nالإجابة النموذجية: 7\n3) [المستوى المتقدم] ما خطا التقارب لمنحنى د(س) = 1/(س − 2) + 1؟\nالإجابة النموذجية: رأسي س = 2، أفقي ص = 1\n\nالحصة 2: إيجاد النهاية عند اللانهاية بقسمة الحدود على أعلى قوة\n1) [مستوى الدعم] أوجد نها(س←∞) (4 − س)/(2س + 5).\nالإجابة النموذجية: −1/2\n2) [المستوى المتوقع] أوجد نها(س←−∞) (6س³ + 1)/(2س³ − س).\nالإجابة النموذجية: 3\n3) [المستوى المتقدم] هل توجد نهاية عددية لـ س²/(س + 1) عندما س ← ∞؟ برر.\nالإجابة النموذجية: لا؛ درجة البسط أكبر فتتزايد القيم بلا حد\n\nالحصة 3: تطبيقات على النهاية عند اللانهاية ومسابقة الختام\n1) [مستوى الدعم] أوجد نها(س←∞) (س + 2)/(3س).\nالإجابة النموذجية: 1/3\n2) [المستوى المتوقع] ما خط التقارب الأفقي لمنحنى ص = 7/(س² + 1)؟\nالإجابة النموذجية: ص = 0\n3) [المستوى المتقدم] أوجد نها(س←−∞) (2س² − س)/(5 − س²).\nالإجابة النموذجية: −2", "الحصة 1: مفهوم النهاية عند اللانهاية وخط التقارب الأفقي\nإرشاد للطالب: مراجعة ص ⁦115–116⁩ وحل تمارين 2-3 (1) ص 121 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد النهاية عند اللانهاية بقسمة الحدود على أعلى قوة\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦117–119⁩، وحل تمارين 2-3 (2، 3) ص 121 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تطبيقات على النهاية عند اللانهاية ومسابقة الختام\nإرشاد للطالب: حل تمارين 2-3 (4) ص 121 من كتاب الطالب، وتمارين 2-3 ص ⁦71–72⁩ من كتاب النشاط.\nإرشاد لولي الأم ).\nالإجابة النموذجية: (4 − 6)/4 = −1/2", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\n1) [مستوى الدعم] أوجد نها(س←3) 7 (ثابت).\nالإجابة النموذجية: 7\n2) [المستوى المتوقع] إذا كانت نها د(س) = 5 و نها ع(س) = 2 عند س ← 1، أوجد نها (د(س) × ع(س)).\nالإجابة النموذجية: 10\n3) [المستوى المتقدم] للدالتين السابقتين أوجد نها (2د(س) − 3ع(س)).\nالإجابة النموذجية: 10 − 6 = 4\n\nالحصة 2: خاصيتا القوة والجذر والنهايات الخاصة\n1) [مستوى الدعم] أوجد نها(س←2) س⁵.\nالإجابة النموذجية: 32\n2) [المستوى المتوقع] أوجد نها(س←3) ∛(س² − 1).\nالإجابة النموذجية: 2\n3) [المستوى المتقدم] إذا كانت نها د(س) = −2 عند س ← 0، أوجد نها [د(س)]² ÷ (د(س) + 4).\nالإجابة النموذجية: 4/2 = 2\n\nالحصة 3: تمارين خواص النهايات ومسابقة الختام\n1) [مستوى الدعم] أوجد نها(س←1) (س³ + 2س)(س − 4).\nالإجابة النموذجية: 3 × (−3) = −9\n2) [المستوى المتوقع] أوجد نها(س←2) (س² + 5)/(س + 1).\nالإجابة النموذجية: 9/3 = 3\n3) [المستوى المتقدم] إذا كانت نها د(س) = ك عند س ← 1 و نها 5د(س) = 15، أوجد ك.\nالإجابة النموذجية: ك = 3", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\nإرشاد للطالب: حفظ خواص النهايات ص 122، وحل تمارين 3-3 (1) ص 125 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: خاصيتا القوة والجذر والنهايات الخاصة\nإرشاد للطالب: حل تمارين 3-3 (2، 3) ص 125 من كتاب الطالب، وتمارين 3-3 (1، 2) ص 73 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تمارين خواص النهايات ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 3-3 ص ⁦74–75⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "4-3", "title": "الاتصال", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦127–136⁩", "wbp": "⁦76–84⁩", "p": [{"t": "شروط اتصال ra", "اتصال كثيرات الحدود، أصفار المقام، مجال الدالة النسبية", "سؤال: «هل رأيت منحنى كثيرة حدود فيه قفزة أو فجوة؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يناقش.\n(10 د) النمذجة: المعلم: يستنتج اتصال كثيرات الحدود ويحدد نقاط عدم اتصال دوال نسبية. | الطالب: يتابع.\n(15 د) تشاركي: المعلم: يكلف الأزواج بتمارين 4-3: 3، 4 ص 131. | الطالب: يحل ويتبادل.\n(5 د) فردي: المعلم: تمارين 4-3 (3) ص 78 من كتاب النشاط. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] هل د(س) = س³ − 5س + 2 متصلة عند جميع الأعداد الحقيقية؟\nالإجابة النموذجية: نعم؛ كثيرة حدود\n2) [المستوى المتوقع] حدد نقاط عدم اتصال د(س) = (س + 1)/(س² − 9).\nالإجابة النموذجية: س = 3، س = −3\n3) [المستوى المتقدم] هل د(س) = (س + 2)/(س² + 4) متصلة على ح؟ برر.\nالإجابة النموذجية: نعم؛ لأن المقام لا يساوي صفرًا أبدًا", "1) [مستوى الدعم] حدد نقطة عدم اتصال د(س) = 5/(س − 4).\nالإجابة النموذجية: س = 4\n2) [المستوى المتوقع] هل د(س) = س² − 7 متصلة عند س = 10؟\nالإجابة النموذجية: نعم\n3) [المستوى المتقدم] حدد نقاط عدم اتصال د(س) = (س − 1)/(س² − 3س + 2).\nالإجابة النموذجية: س = 1، س = 2", "إرشاد للطالب: حل تمارين 4-3 (3، 4) ص 131 من كتاب الطالب، وتمرين 4-3 (3) ص 78 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يبحث اتصال دالة معرّفة بأكثر من قاعدة عند نقطة تغير القاعدة.\n2) يجد قيمة ثابت مجهول يجعل الدالة متصلة.", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام", "اتصال الدالة المتعددة القواعد، نقطة التغير، الثابت المجهول", "سؤال: «ما الفرق بين شرط وجود النهاية وشرط الاتصال عند نقطة تغير القاعدة؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يجيب: الاتصال يضيف شرط تساوي النهاية مع د(أ).\n(12 د) النمذجة: المعلم: يحل مسألتين على بحث الاتصال وإيجاد ثابت. | الطالب: يتابع.\n(13 د) حل مشكلات: المعلم: يكلف المجموعات بتمارين 4-3: 5، 6 ص ⁦131–132⁩. | الطالب: تحل المجموعات.\n(5 د) عرض: المعلم: تعرض المجموعات. | الطالب: يبرر.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] د(س) = س² عندما س < 2، و 2س عندما س ≥ 2. هل هي متصلة عند 2؟\nالإجابة النموذجية: نعم: النهايتان 4 و د(2) = 4\n2) [المستوى المتوقع] د(س) = س + ك عندما س < 3، و 2س − 1 عندما س ≥ 3. أوجد ك لتكون متصلة عند 3.\nالإجابة النموذجية: 3 + ك = 5 ← ك = 2\n3) [المستوى المتقدم] د(س) = (س² − 9)/(س − 3) عندما س ≠ 3، و ك عندما س = 3. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 6", "1) [مستوى الدعم] د(س) = 2س + 1 عندما س ≤ 1، و 4 عندما س > 1. هل هي متصلة عند 1؟\nالإجابة النموذجية: لا؛ يسارًا 3 ويمينًا 4\n2) [المستوى المتوقع] د(س) = ك س² عندما س < 1، و 3 عندما س ≥ 1. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 3\n3) [المستوى المتقدم] د(س) = أ س + 2 عندما س < 2، و س² + أ عندما س ≥ 2. أوجد أ.\nالإجابة النموذجية: 2أ + 2 = 4 + أ ← أ = 2", "إرشاد للطالب: حل تمارين 4-3 (5، 6) ص ⁦131–132⁩ من كتاب الطالب، وتمارين 4-3 (4، 5) ص ⁦79–80⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "الاتصال على فترة مغلقة", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يميز بين الفترة المفتوحة والفترة المغلقة ويحدد اتصال دالة على فترة مغلقة.\n2) يحكم على اتصال دوال على فترات معطاة ويبرر.", "المخرج 1: فهم\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "الفترة المغلقة، الفترة المفتوحة، الاتصال على فترة، الاتصال من اليمين واليسار عند الطرفين", "سؤال: «هل د(س) = 1/(س − 4) متصلة على [0، 3]؟ وعلى [3، 5]؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يتوقع.\n(12 د) النمذجة: المعلم: يشرح الاتصال على فترة ص ⁦132–133⁩. | الطالب: يتابع.\n(10 د) تعاوني: المعلم: يكلف بتمارين 4-3: 7 ص 133. | الطالب: تحل المجموعات.\n(8 د) فردي: المعلم: تمارين 4-3 (6، 7) ص  عدم الاتصال من التمثيل البياني\n1) [مستوى الدعم] ما نوع عدم الاتصال في منحنى (س² − 4)/(س − 2) عند س = 2؟\nالإجابة النموذجية: فجوة (قابل للإزالة)\n2) [المستوى المتوقع] ما نوع عدم الاتصال في منحنى 1/س عند س = 0؟\nالإجابة النموذجية: عدم اتصال لانهائي (خط تقارب رأسي)\n3) [المستوى المتقدم] كيف يمكن إزالة عدم الاتصال في (س² − 4)/(س − 2) عند 2؟\nالإجابة النموذجية: بتعريف د(2) = 4\n\nالحصة 3: اتصال كثيرات الحدود والدوال النسبية\n1) [مستوى الدعم] هل د(س) = س³ − 5س + 2 متصلة عند جميع الأعداد الحقيقية؟\nالإجابة النموذجية: نعم؛ كثيرة حدود\n2) [المستوى المتوقع] حدد نقاط عدم اتصال د(س) = (س + 1)/(س² − 9).\nالإجابة النموذجية: س = 3، س = −3\n3) [المستوى المتقدم] هل د(س) = (س + 2)/(س² + 4) متصلة على ح؟ برر.\nالإجابة النموذجية: نعم؛ لأن المقام لا يساوي صفرًا أبدًا\n\nالحصة 4: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\n1) [مستوى الدعم] د(س) = س² عندما س < 2، و 2س عندما س ≥ 2. هل هي متصلة عند 2؟\nالإجابة النموذجية: نعم: النهايتان 4 و د(2) = 4\n2) [المستوى المتوقع] د(س) = س + ك عندما س < 3، و 2س − 1 عندما س ≥ 3. أوجد ك لتكون متصلة عند 3.\nالإجابة النموذجية: 3 + ك = 5 ← ك = 2\n3) [المستوى المتقدم] د(س) = (س² − 9)/(س − 3) عندما س ≠ 3، و ك عندما س = 3. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 6\n\nالحصة 5: الاتصال على فترة مغلقة\n1) [مستوى الدعم] ما الفرق بين الفترتين ]1، 5[ و [1، 5]؟\nالإجابة النموذجية: الأولى لا تتضمن الطرفين والثانية تتضمنهما\n2) [المستوى المتوقع] هل د(س) = 1/(س − 4) متصلة على [0، 3]؟\nالإجابة النموذجية: نعم؛ س = 4 خارج الفترة\n3) [المستوى المتقدم] هل د(س) = 1/(س − 4) متصلة على [3، 5]؟ برر.\nالإجابة النموذجية: لا؛ غير معرّفة عند س = 4 داخل الفترة\n\nالحصة 6: مراجعة الوحدة الثالثة ومسابقة الختام\n1) [مستوى الدعم] أوجد نها(س←3) (س² − 2س − 3)/(س − 3).\nالإجابة النموذجية: 4\n2) [المستوى المتوقع] أوجد نها(س←∞) (5س² − 2)/(س² + 3س).\nالإجابة النموذجية: 5\n3) [المستوى المتقدم] د(س) = س² − ك عندما س < 2، و ك س عندما س ≥ 2. أوجد ك لتكون متصلة عند 2.\nالإجابة النموذجية: 4 − ك = 2ك ← ك = 4/3", "الحصة 1: شروط اتصال الدالة عند نقطة\n1) [مستوى الدعم] أي شرط يختل في منحنى به فجوة عند س = 3 مع عدم تعريف الدالة عند 3؟\nالإجابة النموذجية: الشرط الأول: د(3) غير موجودة\n2) [المستوى المتوقع] هل د(س) = س² + 2 متصلة عند س = 1؟\nالإجابة النموذجية: نعم: د(1) = 3 = النهاية\n3) [المستوى المتقدم] أي شرط يختل عند وجود قفزة؟\nالإجابة النموذجية: الشرط الثاني: النهاية غير موجودة\n\nالحصة 2: أنواع عدم الاتصال من التمثيل البياني\n1) [مستوى الدعم] ما نوع عدم الاتصال عند قفزة من 1 إلى 3؟\nالإجابة النموذجية: قفزة (غير قابل للإزالة)\n2) [المستوى المتوقع] هل يمكن إزالة عدم اتصال القفزة بإعادة تعريف نقطة واحدة؟\nالإجابة النموذجية: لا؛ لأن النهاية غير موجودة\n3) [المستوى المتقدم] حدد نقاط عدم الاتصال لـ د(س) = 1/((س − 1)(س + 2)).\nالإجابة النموذجية: س = 1، س = −2\n\nالحصة 3: اتصال كثيرات الحدود والدوال النسبية\n1) [مستوى الدعم] حدد نقطة عدم اتصال د(س) = 5/(س − 4).\nالإجابة النموذجية: س = 4\n2) [المستوى المتوقع] هل د(س) = س² − 7 متصلة عند س = 10؟\nالإجابة النموذجية: نعم\n3) [المستوى المتقدم] حدد نقاط عدم اتصال د(س) = (س − 1)/(س² − 3س + 2).\nالإجابة النموذجية: س = 1، س = 2\n\nالحصة 4: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\n1) [مستوى الدعم] د(س) = 2س + 1 عندما س ≤ 1، و 4 عندما س > 1. هل هي متصلة عند 1؟\nالإجابة النموذجية: لا؛ يسارًا 3 ويمينًا 4\n2) [المستوى المتوقع] د(س) = ك س² عندما س < 1، و 3 عندما س ≥ 1. أوجد ك لتكون متصلة.\nالإجابة النموذجية: ك = 3\n3) [المستوى المتقدم] د(س) = أ س + 2 عندما س < 2، و س² + أ عندما س ≥ 2. أوجد أ.\nالإجابة النموذجية: 2أ + 2 = 4 + أ ← أ = 2\n\nالحصة 5: الاتصال على فترة مغلقة\n1) [مستوى الدعم] هل د(س) = س² + 1 متصلة على [−2، 2]؟\nالإجابة النموذجية: نعم\n2) [المستوى المتوقع] هل د(س) = 1/س متصلة على [−1، 1]؟\nالإجابة النموذجية: لا؛ غير معرّفة عند 0\n3) [المستوى المتقدم] أوجد فترة مغلقة تكون عليها د(س) = (س + 1)/(س − 2) متصلة.\nالإجابة النموذجية: مثل [3، 6] أو أي فترة لا تحتوي 2\n\nالحصة 6: مراجعة الوحدة الثالثة ومسابقة الختام\n1) [مستوى الدعم] أوجد نها(س←0) (س² + 4س)/(2س).\nالإجابة النموذجية: 2\n2) [المستوى المتوقع] حدد نقاط عدم اتصال د(س) = 3/(س² − س).\nالإجابة النموذجية: س = 0، س = 1\n3) [المستوى المتقدم] هل د(س) = (س² − 1)/(س + 1) متصلة على [0، 4]؟\nالإجابة النموذجية: نعم؛ س = −1 خارج الفترة", "الحصة 1: شروط اتصال الدالة عند نقطة\nإرشاد للطالب: حفظ نتيجة 4 ص 127، ومراجعة مثال 13 ص 128.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: أنواع عدم الاتصال من التمثيل البياني\nإرشاد للطالب: حل تمارين 4-3 (1، 2) ص 130 من كتاب الطالب، وتمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: اتصال كثيرات الحدود والدوال النسبية\nإرشاد للطالب: حل تمارين 4-3 (3، 4) ص 131 من كتاب الطالب، وتمرين 4-3 (3) ص 78 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة\nإرشاد للطالب: حل تمارين 4-3 (5، 6) ص ⁦131–132⁩ من كتاب الطالب، وتمارين 4-3 (4، 5) ص ⁦79–80⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: الاتصال على فترة مغلقة\nإرشاد للطالب: حل تمارين 4-3 (7) ص 133 من كتاب الطالب، وتمارين 4-3 (6، 7) ص ⁦80–81⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: مراجعة الوحدة الثالثة ومسابقة الختام\nإرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الثالثة ص ⁦134–136⁩ من كتاب الطالب وص ⁦82–84⁩ من كتاب النشاط، والاستعداد لاختبار قصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "1-4", "title": "المشتقة وعلاقتها بالميل", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦138–143⁩", "wbp": "⁦85–86⁩", "p": [{"t": "ميل الوتر وميل المماس : 5س⁴\n\nالحصة 4: رموز المشتقة ودالة الميل\n1) [مستوى الدعم] إذا كانت ص = س² فما دص/دس؟\nالإجابة النموذجية: 2س\n2) [المستوى المتوقع] أوجد ميل منحنى ص = س² عند س = −3.\nالإجابة النموذجية: −6\n3) [المستوى المتقدم] أوجد ميل منحنى ص = س² + س عند النقطة (1، 2).\nالإجابة النموذجية: 3\n\nالحصة 5: تمارين المشتقة وعلاقتها بالميل\n1) [مستوى الدعم] أوجد من المبادئ الأولية مشتقة ص = 3س².\nالإجابة النموذجية: 6س\n2) [المستوى المتوقع] أوجد ميل ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [المستوى المتقدم] أوجد من المبادئ الأولية مشتقة ص = 1/س.\nالإجابة النموذجية: [1/(س + هـ) − 1/س]/هـ = −1/(س(س + هـ)) ← −1/س²\n\nالحصة 6: تطبيقات المشتقة كميل ومسابقة الختام\n1) [مستوى الدعم] ما إشارة ميل ص = س² عند س = −2؟\nالإجابة النموذجية: سالبة (−4)\n2) [المستوى المتوقع] أوجد النقطة التي يكون عندها المماس لمنحنى ص = س² − 4س أفقيًا.\nالإجابة النموذجية: (2، −4)\n3) [المستوى المتقدم] عند أي قيمة لـ س يكون ميل ص = س³ يساوي 12؟\nالإجابة النموذجية: 3س² = 12 ← س = ±2", "الحصة 1: ميل الوتر وميل المماس لمنحنى\n1) [مستوى الدعم] أوجد ميل الوتر بين (1، 1) و (2، 4) على ص = س².\nالإجابة النموذجية: 3\n2) [المستوى المتوقع] أوجد ميل الوتر بين (1، 1) و (1.01، 1.0201).\nالإجابة النموذجية: 2.01\n3) [المستوى المتقدم] توقع ميل المماس لـ ص = س² عند (1، 1).\nالإجابة النموذجية: 2\n\nالحصة 2: الاشتقاق من المبادئ الأولية\n1) [مستوى الدعم] ماذا يمثل المقدار [د(س + هـ) − د(س)]/هـ هندسيًا؟\nالإجابة النموذجية: ميل الوتر\n2) [المستوى المتوقع] أوجد من المبادئ الأولية مشتقة د(س) = 5.\nالإجابة النموذجية: 0\n3) [المستوى المتقدم] أوجد من المبادئ الأولية مشتقة د(س) = س² + س.\nالإجابة النموذجية: 2س + 1\n\nالحصة 3: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\n1) [مستوى الدعم] ما مشتقة ص = س³ عند س = 2؟\nالإجابة النموذجية: 12\n2) [المستوى المتوقع] أوجد من المبادئ الأولية مشتقة ص = 2س².\nالإجابة النموذجية: 4س\n3) [المستوى المتقدم] ما النمط في مشتقات س²، س³، س⁴؟\nالإجابة النموذجية: ن سⁿ⁻¹\n\nالحصة 4: رموز المشتقة ودالة الميل\n1) [مستوى الدعم] ماذا يعني د′(2) = 5؟\nالإجابة النموذجية: ميل المماس للمنحنى عند س = 2 يساوي 5\n2) [المستوى المتوقع] أوجد ميل منحنى ص = س³ عند س = −1.\nالإجابة النموذجية: 3\n3) [المستوى المتقدم] عند أي نقطة على ص = س² يكون الميل 8؟\nالإجابة النموذجية: س = 4 ← (4، 16)\n\nالحصة 5: تمارين المشتقة وعلاقتها بالميل\n1) [مستوى الدعم] أوجد ميل ص = س² − 4س + 3 عند س = 3.\nالإجابة النموذجية: 2\n2) [المستوى المتوقع] عند أي نقطة يكون ميل ص = س² − 4س + 3 صفرًا؟\nالإجابة النموذجية: س = 2 ← (2، −1)\n3) [المستوى المتقدم] أوجد من المبادئ الأولية مشتقة ص = س² − 4س.\nالإجابة النموذجية: 2س − 4\n\nالحصة 6: تطبيقات المشتقة كميل ومسابقة الختام\n1) [مستوى الدعم] ماذا يعني أن ميل المماس عند نقطة يساوي صفرًا؟\nالإجابة النموذجية: المماس أفقي عند تلك النقطة\n2) [المستوى المتوقع] أوجد ميل ص = 2س² عند س = −1.\nالإجابة النموذجية: −4\n3) [المستوى المتقدم] أوجد النقطة على ص = س² التي ميلها يساوي ميل الوتر بين (0، 0) و (4، 16).\nالإجابة النموذجية: ميل الوتر 4 ← 2س = 4 ← (2، 4)", "الحصة 1: ميل الوتر وميل المماس لمنحنى\nإرشاد للطالب: مراجعة استكشف 1 ص ⁦139–140⁩، وحل تمارين 1-4 (1) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: الاشتقاق من المبادئ الأولية\nإرشاد للطالب: مراجعة ص ⁦140–142⁩ ومثال 1، وحل تمارين 1-4 (2) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: الاشتقاق من المبادئ الأولية لدوال تكعيبية ومقارنة النتائج\nإرشاد للطالب: حل تمارين 1-4 (⁦3–5⁩) ص 143 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: رموز المشتقة ودالة الميل\nإرشاد للطالب: حل تمارين 1-4 (6) ص 143 من كتاب الطالب، وتمارين 1-4 (1) ص 85 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: تمارين المشتقة وعلاقتها بالميل\nإرشاد للطالب: حل تمارين ية: 6(2س − 7)²\n3) [المستوى المتقدم] أوجد مشتقة ص = (5 − س)⁴.\nالإجابة النموذجية: −4(5 − س)³\n\nالحصة 2: قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية\n1) [مستوى الدعم] أوجد مشتقة ص = √(2س − 1).\nالإجابة النموذجية: 1/√(2س − 1)\n2) [المستوى المتوقع] أوجد مشتقة ص = 1/(س² + 1).\nالإجابة النموذجية: −2س/(س² + 1)²\n3) [المستوى المتقدم] أوجد مشتقة ص = (س² − 4)³.\nالإجابة النموذجية: 6س(س² − 4)²\n\nالحصة 3: تطبيقات قاعدة السلسلة ومسابقة الختام\n1) [مستوى الدعم] إذا كان ميل ص = (أس + 1)² عند س = 0 يساوي 6، أوجد أ.\nالإجابة النموذجية: أ = 3\n2) [المستوى المتوقع] أوجد النقطة على ص = (2س − 3)² التي ميلها صفر.\nالإجابة النموذجية: س = 1.5 ← (1.5، 0)\n3) [المستوى المتقدم] أوجد مشتقة ص = (س³ + 2س)⁴.\nالإجابة النموذجية: 4(س³ + 2س)³(3س² + 2)", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\n1) [مستوى الدعم] حدد الدالة الداخلية في ص = (4س + 3)⁶.\nالإجابة النموذجية: ع = 4س + 3\n2) [المستوى المتوقع] أوجد مشتقة ص = (س + 1)⁸.\nالإجابة النموذجية: 8(س + 1)⁷\n3) [المستوى المتقدم] أوجد مشتقة ص = 2(3س − 1)⁴.\nالإجابة النموذجية: 24(3س − 1)³\n\nالحصة 2: قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية\n1) [مستوى الدعم] أوجد مشتقة ص = √(س + 5).\nالإجابة النموذجية: 1/(2√(س + 5))\n2) [المستوى المتوقع] أوجد ميل ص = (س² + 1)³ عند س = 1.\nالإجابة النموذجية: 3(2)²(2) = 24\n3) [المستوى المتقدم] أوجد مشتقة ص = 4/(3س − 2)².\nالإجابة النموذجية: −24/(3س − 2)³\n\nالحصة 3: تطبيقات قاعدة السلسلة ومسابقة الختام\n1) [مستوى الدعم] أوجد مشتقة ص = (1 − 2س)⁵.\nالإجابة النموذجية: −10(1 − 2س)⁴\n2) [المستوى المتوقع] أوجد ميل ص = √(4س + 1) عند س = 2.\nالإجابة النموذجية: 2/√(4س + 1) = 2/3\n3) [المستوى المتقدم] أوجد مشتقة ص = 1/√(س² + 9).\nالإجابة النموذجية: −س/(س² + 9)^(3/2)", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦152–153⁩، وحل تمارين 3-4 (1) ص 157 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية\nإرشاد للطالب: مرا .\nالإجابة النموذجية: (2، 4)\n2) [المستوى المتوقع] أوجد نقطة تقاطع المماس ص = 2س − 1 مع محور السينات.\nالإجابة النموذجية: (½، 0)\n3) [المستوى المتقدم] المماس لـ ص = س² عند (1، 1) والعمودي عليه يقطعان محور الصادات. أوجد نقطتي التقاطع.\nالإجابة النموذجية: المماس ص = 2س − 1 ← (0، −1)؛ العمودي ص = −½ س + 3/2 ← (0، 3/2)", "الحصة 1: معادلة المماس لمنحنى عند نقطة\n1) [مستوى الدعم] أوجد ميل المماس لـ ص = 3س² عند س = 1.\nالإجابة النموذجية: 6\n2) [المستوى المتوقع] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3\n3) [المستوى المتقدم] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: الميل 1/4 ← ص = ¼ س + 1\n\nالحصة 2: معادلة العمودي على المماس\n1) [مستوى الدعم] ما ميل العمودي إذا كان ميل المماس −3؟\nالإجابة النموذجية: 1/3\n2) [المستوى المتوقع] أوجد معادلة العمودي لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = −(1/6)س + 19/6\n3) [المستوى المتقدم] لماذا لا يمكن إيجاد ميل العمودي بالقسمة إذا كان ميل المماس صفرًا؟ وما معادلته؟\nالإجابة النموذجية: لأن المماس أفقي فيكون العمودي رأسيًا: س = س₁\n\nالحصة 3: مسائل على المماس والعمودي ومسابقة الختام\n1) [مستوى الدعم] ميل مماس ص = س² − 2س عند س = 3؟\nالإجابة النموذجية: 4\n2) [المستوى المتوقع] أوجد النقطة على ص = س³ التي يكون المماس عندها موازيًا لـ ص = 3س (س > 0).\nالإجابة النموذجية: (1، 1)\n3) [المستوى المتقدم] أوجد مساحة المثلث المحصور بين المماس ص = 2س − 1 والمحورين.\nالإجابة النموذجية: ½ × ½ × 1 = ¼ وحدة مربعة", "الحصة 1: معادلة المماس لمنحنى عند نقطة\nإرشاد للطالب: مراجعة مثال 14 ص ⁦159–160⁩، وحل تمارين 4-4 (1، 2) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: معادلة العمودي على المماس\nإرشاد للطالب: مراجعة مثال 15 ص 160، وحل تمارين 4-4 (⁦3–7⁩) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مسائل على المماس والعمودي ومسابقة الختام\nإرشاد للطالب: حل : 1، 2 ص 174. | الطالب: يحل ويتبادل.\n(5 د) فردي: المعلم: تمارين 6-4 (1، 2) ص 98 من كتاب النشاط. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يناقش.\n(12 د) النمذجة: المعلم: يحل مثال 20 ص 172 (ص = س + 9/س). | الطالب: يتابع.\n(13 د) تعاوني: المعلم: يكلف بتمارين 6-4: ⁦3–6⁩ ص ⁦174–175⁩. | الطالب: تحل المجموعات.\n(5 د) فردي: المعلم: تمارين 6-4 (3، 4) ص 99 من كتاب النشاط. | الطالب: يحل.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\n(5 د) التهيئة: المعلم: يعرض المسألة ويصنع نموذجًا. | الطالب: يتوقع.\n(12 د) النمذجة: المعلم: يحل مثال 21 ص 173. | الطالب: يتابع.\n(15 د) مشروع مصغر تعاوني: المعلم: تحل كل مجموعة مسألة: الصندوق، السياج بثلاثة جوانب (40 م)، السلك (24 سم). | الطالب: تبني الدالة وتشتقها وتجد القيمة.\n(3 د) عرض: المعلم: تعرض كل مجموعة نتيجتها. | الطالب: يعرض.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\n(5 د) التهيئة: المعلم: يوزع قائمة التحقق. | الطالب: يقيّم نفسه.\n(8 د) مراجعة مركزة: المعلم: يبني مع الطلبة خريطة مفاهيم للوحدة. | الطالب: يكمل الخريطة.\n(17 د) تعاوني بالمستويات: المعلم: يكلف بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦178–180⁩ حسب المستوى. | الطالب: يحل حسب مستواه.\n(5 د) مناقشة: المعلم: يناقش الأخطاء الشائعة. | الطالب: يصحح.\n(5 د) الختام: المعلم: أسئلة الختام. | الطالب: يجيب.\nالمجموع: 40 دقيقة\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n(5 د) التهيئة: المعلم: يعرض الخطأ. | الطالب: يصححه: 12(3س + 2)³.\n(20 د) تدريب كتاب النشاط: المعلم: يكلف بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦102–107⁩ من كتاب النشاط. | الطالب: يحل ويناقش.\n(5 د) تصويب: المعلم: يعرض الحلول. | الطالب: يصحح.\n(10 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس النقاط الحرجة ومراجعة الوحدة الرابعة. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) [مستوى الدعم] ما قيمة دص/دس عند النقطة الحرجة؟\nالإجابة النموذجية: صفر\n2) [المستوى المتوقع] أوجد النقطة الحرجة لـ ص = س² − 4س + 1.\nالإجابة النموذجية: س = 2 ← (2، −3)\n3) [المستوى المتقدم] أوجد النقاط الحرجة لـ ص = س³ − 3س.\nالإجابة النموذجية: س = ±1 ← (1، −2)، (−1، 2)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\n1) [مستوى الدعم] تغيرت إشارة المشتقة من سالبة إلى موجبة عند النقطة الحرجة. ما نوعها؟\nالإجابة النموذجية: صغرى\n2) [المستوى المتوقع] حدد نوع النقطة (−1، 2) على ص = س³ − 3س.\nالإجابة النموذجية: عظمى (الإشارة + ثم −)\n3) [المستوى المتقدم] حدد نوع النقطة (0، 0) على ص = س³.\nالإجابة النموذجية: نقطة انعطاف (المشتقة موجبة قبلها وبعدها)\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) [مستوى الدعم] إذا كانت د²ص/دس² < 0 عند النقطة الحرجة، فما نوعها؟\nالإجابة النموذجية: عظمى\n2) [المستوى المتوقع] أوجد النقاط الحرجة لـ ص = س + 9/س.\nالإجابة النموذجية: (3، 6)، (−3، −6)\n3) [المستوى المتقدم] حدد نوعها باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 18/س³: عند 3 موجبة ← صغرى؛ عند −3 سالبة ← عظمى\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\n1) [مستوى الدعم] سياج طوله 40 م لثلاثة جوانب من حظيرة مستطيلة بجانب جدار. اكتب المساحة بدلالة عرضها س.\nالإجابة النموذجية: م = س(40 − 2س)\n2) [المستوى المتوقع] أوجد س التي تجعل المساحة أكبر ما يمكن.\nالإجابة النموذجية: 40 − 4س = 0 ← س = 10 م، م = 200 م²\n3) [المستوى المتقدم] في مسألة الصندوق (12 سم)، الحجم ح = س(12 − 2س)². أوجد س التي تجعل الحجم أكبر ما يمكن.\nالإجابة النموذجية: دح/دس = (12 − 2س)(12 − 6س) = 0 ← س = 2 سم (س = 6 مرفوض)، ح = 128 سم³\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) [مستوى الدعم] أوجد دص/دس إذا كانت ص = 3س⁴ − 2/س.\nالإجابة النموذجية: 12س³ + 2/س²\n2) [المستوى المتوقع] أوجد معادلة المماس لـ ص = (2س − 1)³ عند س = 1.\nالإجابة النموذجية: ص = 1، الميل 6(1)² = 6 ← ص = 6س − 5\n3) [المستوى المتقدم] أوجد النقاط الحرجة لـ ص = س³ − 6س² + 9س وحدد نوعها.\nالإجابة النموذجية: (1، 4) عظمى، (3، 0) صغرى\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) [مستوى الدعم] أوجد مشتقة ص = (3س + 2)⁴.\nالإجابة النموذجية: 12(3س + 2)³\n2) [المستوى المتوقع] أوجد النقطة الحرجة لـ ص = 4س − س² وحدد نوعها.\nالإجابة النموذجية: (2، 4) عظمى\n3) [المستوى المتقدم] أوجد قيمة ك إذا كان لمنحنى ص = س² + ك س نقطة حرجة عند س = 3.\nالإجابة النموذجية: 2(3) + ك = 0 ← ك = −6", "الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) [مستوى الدعم] ما شكل المماس عند النقطة الحرجة؟\nالإجابة النموذجية: أفقي\n2) [المستوى المتوقع] أوجد النقطة الحرجة لـ ص = 3 + 2س − س².\nالإجابة النموذجية: (1، 4)\n3) [المستوى المتقدم] أوجد النقطة الحرجة لـ ص = س³.\nالإجابة النموذجية: (0، 0)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\n1) [مستوى الدعم] ما نوع النقطة (2، −3) على ص = س² − 4س + 1؟\nالإجابة النموذجية: صغرى\n2) [المستوى المتوقع] ما نوع النقطة (1، 4) على ص = 3 + 2س − س²؟\nالإجابة النموذجية: عظمى\n3) [المستوى المتقدم] أوجد النقاط الحرجة لـ ص = س³ − 12س وحدد نوعها.\nالإجابة النموذجية: (2، −16) صغرى، (−2، 16) عظمى\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) [مستوى الدعم] حدد نوع النقطة الحرجة لـ ص = 2س² − 8س باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 4 > 0 ← صغرى عند (2، −8)\n2) [المستوى المتوقع] أوجد د²ص/دس² لـ ص = س⁴ عند س = 0. ماذا تستنتج؟\nالإجابة النموذجية: صفر؛ الاختبار غير حاسم\n3) [المستوى المتقدم] أوجد النقاط الحرجة لـ ص = 2س³ − 3س² وحدد نوعها.\nالإجابة النموذجية: (0، 0) عظمى، (1، −1) صغرى\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\n1) [مستوى الدعم] سلك طوله 24 سم شُكّل مستطيلًا. اكتب مساحته بدلالة طوله س.\nالإجابة النموذجية: م = س(12 − س)\n2) [المستوى المتوقع] أوجد أكبر مساحة ممكنة للمستطيل.\nالإجابة النموذجية: س = 6 ← م = 36 سم²\n3) [المستوى المتقدم] عددان مجموعهما 20. أوجد أكبر قيمة لحاصل ضربهما.\nالإجابة النموذجية: س(20 − س) ← س = 10 ← 100\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) [مستوى الدعم] أوجد مشتقة ص = (س² + 1)⁴.\nالإجابة النموذجية: 8س(س² + 1)³\n2) [المستوى المتوقع] حدد فترة تناقص ص = س² − 8س.\nالإجابة النموذجية: س < 4\n3) [المستوى المتقدم] أوجد معادلة العمودي لـ ص = س² عند (2، 4).\nالإجابة النموذجية: ص = −¼ س + 4.5\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) [مستوى الدعم] أوجد د²ص/دس² إذا كانت ص = س³ + 2س.\nالإجابة النموذجية: 6س\n2) [المستوى المتوقع] أوجد ميل ص = √(س² + 9) عند س = 4.\nالإجابة النموذجية: س/√(س² + 9) = 4/5\n3) [المستوى المتقدم] أوجد أصغر قيمة لـ ص = س² − 10س + 30.\nالإجابة النموذجية: عند س = 5 ← ص = 5", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nإرشاد للطالب: مراجعة ص ⁦168–170⁩ ومثال 19، وحل تمارين 6-4 (1) ص 174 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الأولى\nإرشاد للطالب: حل تمارين 6-4 (1، 2) ص 174 من كتاب الطالب، وتمارين 6-4 (1، 2) ص 98 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nإرشاد للطالب: مراجعة مثال 20 ص 172، وحل تمارين 6-4 (⁦3–6⁩) ص ⁦174–175⁩ من كتاب الطالب، وتمارين 6-4 (3، 4) ص 99 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: مسائل تطبيقية على القيم العظمى والصغرى\nإرشاد للطالب: مراجعة مثال 21 ص 173، وحل تمارين 6-4 (⁦7–13⁩) ص ⁦175–176⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب الطالب)\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الرابعة ص ⁦178–180⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nإرشاد للطالب: إكمال تمارين المراجعة في كتاب النشاط ص ⁦102–107⁩، والاستعداد للاختبار القصير والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}];
const TINT=["#eaf3fb","#eef7ef","#fbf3e6","#f3eefa","#e9f6f6","#fdf0ef","#eef1fb","#f1f8e9","#fff6e0","#f0f4f8"];
let mode='s',li=0,pi=0;
const $=s=>document.querySelector(s);
const les=$('#les');
D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' '+l.title;les.appendChild(o)});
les.onchange=()=>{li=+les.value;pi=0;render()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));render()});
function copyText(t,btn,box){
  const ok=()=>{btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
    if(r)ok();else{const rg=document.createRange();rg.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(rg);box.parentNode.querySelector('.hint').style.display='block'}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fallback)}else fallback();
}
function render(){
  const L=D[li];
  $('#now').textContent=mode==='s'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='s'){L.p.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+(i+1)+': '+p.t;if(i===pi)b.className='on';b.onclick=()=>{pi=i;render()};tabs.appendChild(b)})}
  const texts=mode==='s'?L.p[pi].f:L.c;
  $('#meta').innerHTML=`<b>${L.id} ${L.title}</b> — ${L.unit}<br>`+(mode==='s'?`الحصة ${pi+1} من ${L.p.length} — ${L.p[pi].w}`:`عدد الحصص: ${L.p.length}`)+` — كتاب الطالب ص ${L.sbp}، كتاب النشاط ص ${L.wbp}`;
  const box=$('#cards');box.innerHTML='';
  FIELDS.forEach((f,k)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="ch" style="background:${TINT[k]}"><h3><span>${k+1}</span>${f}</h3><button class="cp">نسخ</button></div><div class="cb"></div><div class="hint">تعذّر الوصول إلى الحافظة: النص محدد الآن، انسخه يدويًا.</div>`;
    const cb=c.querySelector('.cb');cb.textContent=texts[k];
    c.querySelector('.cp').onclick=e=>copyText(texts[k],e.currentTarget,cb);
    box.appendChild(c)});
}
render();
</script>
