ات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس — زمن الحصة 40 دقيقة\n\n1. التهيئة: أسئلة مراجعة شفوية، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. النمذجة: يحل المعلم مثال 5 ص 50 (جا 140°، جتا(−130°)) ويعمم الطريقة في ثلاث خطوات، والطلبة يدون الخطوات (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تعاوني: يكلف المجموعات بإيجاد القيم الدقيقة: جا 210°، جتا 315°، ظا 120°، جتا(2π/3)، جا(5π/4)، وتحسب المجموعات وتعرض (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: يكلف المعلم بتمارين 3-2: 1 ص 52، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: إيجاد النسب المثلثية بمعلومية إحداها والربع — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: الثاني أو الثالث (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 6 ص 50 (جتا هـ = −3/5 في 180°–270°) ومثال 7، ويتابع الطالب ويرسم (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 3-2: 3، 4، 5 ص ⁦52–53⁩، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. فردي: تمرين من كتاب النشاط ص 36، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: النسب المثلثية للزوايا الربعية والزوايا خارج الدورة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم دائرة الوحدة، ويحدد الطالب الإحداثيات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الاكتشاف: يقود المعلم استنتاج النسب للزوايا الربعية (مثال 8 ص 51) ومتى يكون الظل غير معرّف، ويكمل الطالب جدولًا للزوايا الربعية (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. النمذجة: يحسب المعلم جا 750°، جتا(−240°) بالرد إلى زاوية مكافئة، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تشاركي: يكلف المعلم بتمارين 3-2: 6، 7، 8 ص 53، ويحل الطالب في أزواج ويتبادل الشرح (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم العبارات، ويحكم الطالب ويبرر (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني: يكلف المعلم بتمارين 3-2: 9، 10، 11 ص 53 وتمارين كتاب النشاط ⁦6–9⁩ ص ⁦36–37⁩ حسب المستويات، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يعرض المعلم حلولًا نموذجية ويصوب الأخطاء، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «أوجد القيمة الدقيقة لـ جتا 315°» على السبورة، ويناقش المعلم الإجابات مع الصف (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – زوايا المعالم العمانية: تضع كل مجموعة معلمًا عمانيًا كدار الأوبرا السلطانية أو جامع السلطان قابوس الأكبر عند نقطة في المستوى الإحداثي، وتحسب النسب المثلثية للزاوية التي يمر ضلعها النهائي بتلك النقطة، ثم تعرّف زملاءها بالمعلم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة\n1) [مستوى المعرفة] أكمل: جتا هـ = ...... حيث (س، ص) نقطة على الضلع النهائي.\nالإجابة النموذجية: س/نق\n2) [مستوى التطبيق] الضلع النهائي للزاوية هـ يمر بالنقطة (−3، 4). أوجد جا هـ وجتا هـ.\nالإجابة النموذجية: نق = 5، جا هـ = 4/5، جتا هـ = −3/5\n3) [مستوى الاستدلال] في المسألة السابقة أوجد ظا هـ، ولماذا تكون سالبة؟\nالإجابة النموذجية: −4/3؛ لأن س سالبة وص موجبة\n\nالحصة 2: إشارات النسب المثلثية في الأرباع الأربعة\n1) [مستوى المعرفة] ما إشارة جتا 200°؟\nالإجابة النموذجية: سالبة (الربع الثالث)\n2) [مستوى التطبيق] ما إشارة ظا 300°؟\nالإجابة النموذجية: سالبة (الربع الرابع)\n3) [مستوى الاستدلال] إذا كان جا هـ < 0 وظا هـ > 0، ففي أي ربع تقع هـ؟\nالإجابة النموذجية: الربع الثالث\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس\n1) [مستوى المعرفة] اكتب جا 140° بدلالة نسبة زاوية الأساس.\nالإجابة النموذجية: جا 140° = جا 40°\n2) [مستوى التطبيق] أوجد القيمة الدقيقة لـ جتا 315°.\nالإجابة النموذجية: √2/2\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة لـ ظا(7π/6).\nالإجابة النموذجية: √3/3\n\nالحصة 4: إيجاد النسب المثلثية بمعلومية إحداها والربع\n1) [مستوى المعرفة] إذا كان جتا هـ = −3/5 و 180° < هـ < 270°، أوجد جا هـ.\nالإجابة النموذجية: −4/5\n2) [مستوى التطبيق] في المسألة السابقة أوجد ظا هـ.\nالإجابة النموذجية: 4/3\n3) [مستوى الاستدلال] إذا كان ظا هـ = −5/12 و 90° < هـ < 180°، أوجد جا هـ وجتا هـ.\nالإجابة النموذجية: جا هـ = 5/13، جتا هـ = −12/13\n\nالحصة 5: النسب المثلثية للزوايا الربعية والزوايا خارج الدورة\n1) [مستوى المعرفة] ما قيمة جا 270°؟\nالإجابة النموذجية: −1\n2) [مستوى التطبيق] ما قيمة جتا π؟\nالإجابة النموذجية: −1\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة لـ جا 750°.\nالإجابة النموذجية: 750° − 720° = 30° ← 1/2\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام\n1) [مستوى المعرفة] هل جا 150° = جا 30°؟ برر.\nالإجابة النموذجية: نعم؛ زاوية الأساس 30° والجيب موجب في الربع الثاني\n2) [مستوى التطبيق] أوجد القيمة الدقيقة لـ ظا 225°.\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] أثبت أن جا(180° − هـ) = جا هـ لأي زاوية حادة هـ.\nالإجابة النموذجية: 180° − هـ تقع في الربع الثاني وزاوية أساسها هـ والجيب موجب فيه", "الحصة 1: تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة\n1) [مستوى المعرفة] الضلع النهائي يمر بالنقطة (5، 12). أوجد جا هـ.\nالإجابة النموذجية: 12/13\n2) [مستوى التطبيق] الضلع النهائي يمر بالنقطة (−6، −8). أوجد جتا هـ وظا هـ.\nالإجابة النموذجية: نق = 10، جتا هـ = −3/5، ظا هـ = 4/3\n3) [مستوى الاستدلال] لماذا يكون ظا هـ غير معرّف عندما يقع الضلع النهائي على محور الصادات؟\nالإجابة النموذجية: لأن س = 0 والقسمة على صفر غير معرّفة\n\nالحصة 2: إشارات النسب المثلثية في الأرباع الأربعة\n1) [مستوى المعرفة] في أي ربع تكون جميع النسب موجبة؟\nالإجابة النموذجية: الربع الأول\n2) [مستوى التطبيق] ما إشارة جا(5π/4)؟\nالإجابة النموذجية: سالبة\n3) [مستوى الاستدلال] إذا كان جتا هـ > 0 وجا هـ < 0، ففي أي ربع تقع هـ؟ وما إشارة ظا هـ؟\nالإجابة النموذجية: الربع الرابع؛ ظا هـ سالبة\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس\n1) [مستوى المعرفة] أوجد القيمة الدقيقة لـ جا 210°.\nالإجابة النموذجية: −1/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة لـ ظا 120°.\nالإجابة النموذجية: −√3\n3) [مستوى الاستدلال] اكتب جتا(−130°) بدلالة نسبة زاوية الأساس.\nالإجابة النموذجية: −جتا 50°\n\nالحصة 4: إيجاد النسب المثلثية بمعلومية إحداها والربع\n1) [مستوى المعرفة] إذا كان جا هـ = 3/5 والزاوية في الربع الثاني، أوجد جتا هـ.\nالإجابة النموذجية: −4/5\n2) [مستوى التطبيق] إذا كان جا هـ = −1/2 و 270° < هـ < 360°، أوجد هـ.\nالإجابة النموذجية: 330°\n3) [مستوى الاستدلال] إذا كان ظا هـ = 2 و π < هـ < 3π/2، أوجد جتا هـ بالقيمة الدقيقة.\nالإجابة النموذجية: −1/√5 = −√5/5\n\nالحصة 5: النسب المثلثية للزوايا الربعية والزوايا خارج الدورة\n1) [مستوى المعرفة] ما قيمة جتا 270°؟\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] لماذا ظا 90° غير معرّف؟\nالإجابة النموذجية: لأن جتا 90° = 0 والقسمة على صفر غير معرّفة\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة لـ جتا(−240°).\nالإجابة النموذجية: تكافئ 120° ← −1/2\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام\n1) [مستوى المعرفة] أوجد القيمة الدقيقة لـ جا 300°.\nالإجابة النموذجية: −√3/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة لـ جتا 150° + جا 120°.\nالإجابة النموذجية: −√3/2 + √3/2 = 0\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة لـ ظا 135° × جتا 240° ÷ جا 330°.\nالإجابة النموذجية: (−1)(−1/2) ÷ (−1/2) = −1", "الحصة 1: تعريف النسب المثلثية لأي زاوية باستخدام إحداثيات نقطة\nإرشاد للطالب: قراءة النتيجة 1 ص 49 وحل أسئلة مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إشارات النسب المثلثية في الأرباع الأربعة\nإرشاد للطالب: حفظ قاعدة الإشارات ص 49، وحل تمارين 3-2 (1) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: القيم الدقيقة لنسب الزوايا العامة باستخدام زاوية الأساس\nإرشاد للطالب: مراجعة مثال 5 ص 50، وحل تمارين 3-2 (1، 2) ص 52 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: إيجاد النسب المثلثية بمعلومية إحداها والربع\nإرشاد للطالب: مراجعة مثالي 6، 7 ص ⁦50–51⁩، وحل تمارين 3-2 (⁦3–5⁩) ص ⁦52–53⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: النسب المثلثية للزوايا الربعية والزوايا خارج الدورة\nإرشاد للطالب: حل تمارين 3-2 (⁦6–8⁩) ص 53 من كتاب الطالب، وتمارين 3-2 (⁦2–5⁩) ص ⁦35–36⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين الدرس وتطبيقاته ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 3-2 من كتاب النشاط ص ⁦35–37⁩ والاستعداد لدرس التمثيلات البيانية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=6"]}, {"id": "4-2", "title": "التمثيلات البيانية للدوال المثلثية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦54–67⁩", "wbp": "⁦38–42⁩", "p": [{"t": "التمثيل البياني لدالة الجيب", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يرسم منحنى ص = جا س بالدرجات وبالراديان ويحدد خصائصه (الدورة، السعة، القيم العظمى والصغرى، الأصفار) (25 دقيقة)\n2) يستنتج علاقات مثل جا(180° − س) = جا س من التمثيل البياني (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، الأقلام، أخرى: ورق رسم بياني", "الدالة الدورية، الدورة 360° (2π)، السعة، المدى [−1، 1]، الأصفار", "يعرض المعلم صورة لموجة صوتية أو حركة مد وجزر ويسأل: «ما الذي يتكرر؟» لربط مفهوم الدالة الدورية.", "1. التهيئة: يعرض المعلم الصورة ويقدم مفهوم الدالة الدورية، ويص ورة الذكية، أخرى: برنامج GeoGebra، الأقلام", "التمدد الرأسي، التمدد الأفقي، السعة = |أ|، الدورة = 360°/ب أو 2π/ب", "يحرك المعلم منزلقين للمعاملين أ، ب في GeoGebra ويطلب من الطلبة وصف ما يحدث للمنحنى.", "1. التهيئة: يعرض المعلم المنزلقين، ويصف الطالب التغيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يشرح المعلم ص = 2جا س (تمدد رأسي) ثم ص = جا 2س (تمدد أفقي) ص ⁦60–61⁩، ومثال 9، والطلبة يدون القاعدتين (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يعطي كل مجموعة دالة: 3جا 2س، 2جتا(س/2)، ½ جا 3س لتحديد السعة والدورة ورسمها، وترسم وتعرض (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: يكلف المعلم بتمارين 4-2: 3، 4 ص ⁦64–65⁩، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] ما سعة الدالة ص = 3 جا س؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ما دورة الدالة ص = جا 2س؟\nالإجابة النموذجية: 180°\n3) [مستوى الاستدلال] أوجد السعة والدورة للدالة ص = 2 جتا(س/2).\nالإجابة النموذجية: السعة 2، الدورة 720°", "1) [مستوى المعرفة] ما مدى الدالة ص = 4 جتا س؟\nالإجابة النموذجية: −4 ≤ ص ≤ 4\n2) [مستوى التطبيق] أوجد دورة الدالة ص = جا 3س بالراديان.\nالإجابة النموذجية: 2π/3\n3) [مستوى الاستدلال] اكتب دالة جيب سعتها 5 ودورتها 120°.\nالإجابة النموذجية: ص = 5 جا 3س", "إرشاد للطالب: حل تمارين 4-2 (⁦3–5⁩) ص ⁦64–65⁩ من كتاب الطالب، وتمارين 4-2 (⁦1–3⁩) ص ⁦38–39⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=7"]}, {"t": "الانسحاب: ص = جا س + ج و ص = جا(س + د)", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يحدد الانسحاب الرأسي والانسحاب الأفقي لمنحنى دالة مثلثية والمتجه المقابل له (15 دقيقة)\n2) يرسم منحنيات مثل ص = جا(س − 90°) و ص = 1 + 2جتا(س + 90°) بخطوات متتابعة (مثال 10) (25 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعا  س + ج و ص = جا(س + د)\nالانسحاب الرأسي، الانسحاب الأفقي، متجه الانسحاب، تركيب التحويلات\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\nالانعكاس في محور السينات، الانعكاس في محور الصادات، تركيب التحويلات، استنتاج المعادلة من الرسم\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\nالتحويلات الهندسية، عدد الحلول، تقاطع المنحنيات", "الحصة 1: التمثيل البياني لدالة الجيب\nيعرض المعلم صورة لموجة صوتية أو حركة مد وجزر ويسأل: «ما الذي يتكرر؟» لربط مفهوم الدالة الدورية.\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\nسؤال: «ما الاختلاف بين جا 0° وجتا 0°؟ هل تتوقع أن يشبه منحنى جتا س منحنى جا س؟»\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\nيحرك المعلم منزلقين للمعاملين أ، ب في GeoGebra ويطلب من الطلبة وصف ما يحدث للمنحنى.\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\nسؤال: «إذا رفعنا منحنى ص = جا س وحدتين إلى الأعلى، فما المدى الجديد؟»\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\nيعرض المعلم منحنيين ص = جا س و ص = −جا س ويسأل: «ما العلاقة بينهما؟»\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\nسؤال: «كم مرة يقطع المستقيم ص = 0.5 منحنى ص = جا س في 0° ≤ س ≤ 360°؟»", "الحصة 1: التمثيل البياني لدالة الجيب — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الصورة ويقدم مفهوم الدالة الدورية، ويصف الطالب التكرار (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاكتشاف: يكلف الطلبة بتنفيذ استكشف 2 ص 54: جدول قيم جا س كل 30° ثم رسم المنحنى، ويكمل الطالب الجدول ويرسم (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يعرض المعلم المنحنى بـ GeoGebra ويحدد الدورة والسعة والقيم العظمى والصغرى، والطلبة يدون الخصائص (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يطلب المعلم استنتاج العلاقات ص 56 (جا(−س)، جا(180° − س)، جا(180° + س)) من الرسم، وتستنتج المجموعة العلاقات وتتحقق بأمثلة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويتوقع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. الاكتشاف: ينفذ المعلم استكشف 3 ص 56 لرسم منحنى جيب التمام واستنتاج العلاقات، ويرسم الطالب ويكمل العبارات (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. النمذجة: يرسم المعلم منحنى ظا س ص ⁦57–58⁩ ويوضح خطوط التقارب عند 90° و 270°، ويرسم الطالب ويحدد خطوط التقارب (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تعاوني: يقارن الطلبة بين المنحنيات الثلاثة في جدول (الدورة، المدى، الأصفار)، وتكمل المجموعة الجدول (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم المنزلقين، ويصف الطالب التغيرات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. النمذجة: يشرح المعلم ص = 2جا س (تمدد رأسي) ثم ص = جا 2س (تمدد أفقي) ص ⁦60–61⁩، ومثال 9، والطلبة يدون القاعدتين (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يعطي كل مجموعة دالة: 3جا 2س، 2جتا(س/2)، ½ جا 3س لتحديد السعة والدورة ورسمها، وترسم وتعرض (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. فردي: يكلف المعلم بتمارين 4-2: 3، 4 ص ⁦64–65⁩، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 1 ≤ ص ≤ 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 10 ص 62 ثم خطوات رسم ص = 1 + 2جتا(س + 90°)، ويتابع الطالب الخطوات ويرسم (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تشاركي: يكلف الأزواج برسم ص = جا س + 2، ص = جتا(س − 60°)، ويرسم الطالب ويتبادل التحقق (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تطبيق: يكلف المعلم بتمارين 4-2: 6، 7، 8 ص 65، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم المنحنيين، ويصف الطالب الانعكاس (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. النمذجة: يشرح المعلم الانعكاس ومثالي 11، 12 ص ⁦63–64⁩، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. حل مشكلات: يعرض المعلم صورًا لمنحنيات ويطلب كتابة معادلاتها (تمارين 4-2: ⁦10–13⁩ ص 66)، وتحلل المجموعات المنحنيات وتكتب المعادلات (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. عرض: تعرض المجموعات استنتاجاتها، ويبرر الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال ويعرضه بالرسم، ويجيب الطالب: مرتين (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بتمارين 4-2: ⁦14–17⁩ ص ⁦66–67⁩ وتمارين كتاب النشاط ص ⁦41–42⁩ حسب المستوى، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مناقشة: يناقش المعلم الحلول ويربط عدد الحلول بالتقاطع، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص التمثيلات البيانية للدوال المثلثية، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – مد البحر وجزره: تشبّه المجموعات منحنى الجيب بحركة المد والجزر على شواطئ عمان، فتحدد على الرسم الدورة والسعة والقيم العظمى والصغرى والأصفار، ثم تقترح الوقت المناسب لخروج الصياد بقاربه (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: التمثيل البياني لدالة الجيب\n1) [مستوى المعرفة] ما دورة الدالة ص = جا س؟\nالإجابة النموذجية: 360° أو 2π\n2) [مستوى التطبيق] ما أكبر قيمة للدالة ص = جا س؟ وعند أي قيمة لـ س في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: 1 عند س = 90°\n3) [مستوى الاستدلال] استخدم المنحنى لتبين أن جا(−س) = −جا س.\nالإجابة النموذجية: المنحنى متماثل حول نقطة الأصل؛ قيمة الدالة عند −س معكوس قيمتها عند س\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\n1) [مستوى المعرفة] ما قيمة جتا 0°؟ وما نقطة تقاطع منحنى ص = جتا س مع محور الصادات؟\nالإجابة النموذجية: 1؛ (0، 1)\n2) [مستوى التطبيق] ما دورة الدالة ص = ظا س؟\nالإجابة النموذجية: 180° أو π\n3) [مستوى الاستدلال] حدد معادلات خطوط التقارب لمنحنى ص = ظا س في 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، س = 270°\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\n1) [مستوى المعرفة] ما سعة الدالة ص = 3 جا س؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ما دورة الدالة ص = جا 2س؟\nالإجابة النموذجية: 180°\n3) [مستوى الاستدلال] أوجد السعة والدورة للدالة ص = 2 جتا(س/2).\nالإجابة النموذجية: السعة 2، الدورة 720°\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n1) [مستوى المعرفة] ما مدى الدالة ص = جا س + 2؟\nالإجابة النموذجية: 1 ≤ ص ≤ 3\n2) [مستوى التطبيق] صف التحويل الذي ينقل ص = جا س إلى ص = جا(س − 90°).\nالإجابة النموذجية: انسحاب أفقي 90° إلى اليمين بالمتجه (90، 0)\n3) [مستوى الاستدلال] أوجد القيمة العظمى والصغرى للدالة ص = 1 + 2جتا(س + 90°).\nالإجابة النموذجية: العظمى 3، الصغرى −1\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\n1) [مستوى المعرفة] صف التحويل من ص = جتا س إلى ص = −جتا س.\nالإجابة النموذجية: انعكاس في محور السينات\n2) [مستوى التطبيق] منحنى جيب قيمته العظمى 3 والصغرى −1 ودورته 360°. اكتب معادلته على صورة ص = أ جا س + ج.\nالإجابة النموذجية: أ = 2، ج = 1 ← ص = 2 جا س + 1\n3) [مستوى الاستدلال] هل ص = جا(−س) هو المنحنى نفسه لـ ص = −جا س؟ برر.\nالإجابة النموذجية: نعم؛ لأن جا(−س) = −جا س\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\n1) [مستوى المعرفة] كم حلًا للمعادلة جا س = 0.5 في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: حلان\n2) [مستوى التطبيق] كم حلًا للمعادلة جتا 2س = 0.3 في 0° ≤ س ≤ 360°؟\nالإجابة النموذجية: 4 حلول (دورة 180° فتتكرر مرتين)\n3) [مستوى الاستدلال] ارسم ص = جا س و ص = س/90 تقريبيًا ثم حدد عدد حلول جا س = س/90 في 0° ≤ س ≤ 180°.\nالإجابة النموذجية: حلان: س = 0°، س = 90° (لأن جا 90° = 1 = 90/90)", "الحصة 1: التمثيل البياني لدالة الجيب\n1) [مستوى المعرفة] ما مدى الدالة ص = جا س؟\nالإجابة النموذجية: −1 ≤ ص ≤ 1\n2) [مستوى التطبيق] أوجد أصفار ص = جا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: 0، π، 2π\n3) [مستوى الاستدلال] أكمل: جا(180° + س) = ......\nالإجابة النموذجية: −جا س\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\n1) [مستوى المعرفة] أكمل: جتا(−س) = ......\nالإجابة النموذجية: جتا س\n2) [مستوى التطبيق] ما مدى الدالة ص = ظا س؟\nالإجابة النموذجية: جميع الأعداد الحقيقية\n3) [مستوى الاستدلال] أوجد أصفار ص = جتا س في 0 ≤ س ≤ 2π.\nالإجابة النموذجية: π/2، 3π/2\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\n1) [مستوى المعرفة] ما مدى الدالة ص = 4 جتا س؟\nالإجابة النموذجية: −4 ≤ ص ≤ 4\n2) [مستوى التطبيق] أوجد دورة الدالة ص = جا 3س بالراديان.\nالإجابة النموذجية: 2π/3\n3) [مستوى الاستدلال] اكتب دالة جيب سعتها 5 ودورتها 120°.\nالإجابة النموذجية: ص = 5 جا 3س\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\n1) [مستوى المعرفة] صف التحويل من ص = جتا س إلى ص = جتا س − 1.\nالإجابة النموذجية: انسحاب رأسي وحدة إلى الأسفل\n2) [مستوى التطبيق] ما الدالة الناتجة من انسحاب ص = جا س بمقدار 30° إلى اليسار؟\nالإجابة النموذجية: ص = جا(س + 30°)\n3) [مستوى الاستدلال] بيّن أن جتا(س + 90°) = −جا س باستخدام الانسحاب.\nالإجابة النموذجية: انسحاب منحنى جتا 90° لليسار ينطبق على منحنى −جا س\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\n1) [مستوى المعرفة] ما الدالة الناتجة من انعكاس ص = جا س في محور السينات؟\nالإجابة النموذجية: ص = −جا س\n2) [مستوى التطبيق] أوجد مدى ص = 3 − 2جا س.\nالإجابة النموذجية: 1 ≤ ص ≤ 5\n3) [مستوى الاستدلال] اكتب معادلة على صورة ص = أ جتا(ب س) لمنحنى قيمته العظمى 4 ودورته π.\nالإجابة النموذجية: ص = 4 جتا 2س\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\n1) [مستوى المعرفة] ما دورة ص = ظا 2س؟\nالإجابة النموذجية: 90°\n2) [مستوى التطبيق] ما مدى ص = 2 + جتا 3س؟\nالإجابة النموذجية: 1 ≤ ص ≤ 3\n3) [مستوى الاستدلال] كم حلًا للمعادلة 3جا 2س = 4 في 0° ≤ س ≤ 360°؟ برر.\nالإجابة النموذجية: لا حلول؛ لأن أكبر قيمة لـ 3 جا 2س هي 3", "الحصة 1: التمثيل البياني لدالة الجيب\nإرشاد للطالب: مراجعة استكشف 2 والعلاقات ص ⁦54–56⁩، ورسم منحنى ص = جا س في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التمثيلان البيانيان لدالتي جيب التمام والظل\nإرشاد للطالب: حل تمارين 4-2 (1، 2) ص 64 من كتاب الطالب، ومراجعة خصائص المنحنيات الثلاثة ص ⁦56–59⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: التمدد: ص = أ جا س و ص = جا(ب س)\nإرشاد للطالب: حل تمارين 4-2 (⁦3–5⁩) ص ⁦64–65⁩ من كتاب الطالب، وتمارين 4-2 (⁦1–3⁩) ص ⁦38–39⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: الانسحاب: ص = جا س + ج و ص = جا(س + د)\nإرشاد للطالب: حل تمارين 4-2 (⁦6–9⁩) ص 65 من كتاب الطالب، وتمارين 4-2 (4، 5) ص 40 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: الانعكاس وتركيب التحويلات الهندسية\nإرشاد للطالب: حل تمارين 4-2 (⁦10–13⁩) ص 66 من كتاب الطالب، وتمارين 4-2 (6، 7) ص 41 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين التمثيلات البيانية ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 4-2 ص ⁦41–42⁩ من كتاب النشاط، والتحقق من الرسوم باستخدام GeoGebra أو Desmos.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=7"]}, {"id": "5-2", "title": "الدوال المثلثية العكسية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦68–72⁩", "wbp": "⁦43–45⁩", "p": [{"t": "تعريف الدوال المثلثية العكسية ومجالاتها ومداها", "w": "الأسبوع السادس (⁦11–15/10/2026⁩م)", "f": ["1) يعرّف جا⁻¹ س وجتا⁻¹ س وظا⁻¹ س ويحدد مجال كل منها ومداها (القيم الرئيسية) (25 دقيقة)\n2) يجد قيمًا رئيسية دقيقة مثل جا⁻¹(1/2) وجتا⁻¹(−1/2) وظا⁻¹(−1) بالدرجات والراديان /10/2026⁩م)", "f": ["1) يجد القيمة الدقيقة لعبارات مثل جا(جتا⁻¹(1/2)) و جتا(ظا⁻¹ 1) (20 دقيقة)\n2) يجد الدالة العكسية لدالة مثلثية بسيطة ومجالها ومداها (مثال 14) (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "تركيب الدوال، الدالة العكسية، مدى الدالة = مجال عكسها", "مراجعة خطوات إيجاد الدالة العكسية من الصف الحادي عشر: «اكتب ص = د(س) ← بادل س وص ← اكتب ص بدلالة س».", "1. التهيئة: يراجع المعلم الخطوات، ويذكر الطالب الخطوات بمثال خطي (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 14 ص ⁦70–71⁩ (د(س) = 3 + جا⁻¹(س/2)... ورسمها وإيجاد عكسها ومداها)، ويتابع الطالب ويدون (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يكلف المعلم بتمارين 5-2: 3، 4، 5 ص ⁦71–72⁩، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. فردي: تمرين من كتاب النشاط ص 44، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «أوجد القيمة الدقيقة: جا⁻¹(جا 150°)»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – زاوية الصعود الجبلي: يحسب كل زوج زاوية ميل مسار مشي جبلي في عمان باستخدام ظا⁻¹ من ارتفاع ومسافة أفقية يختارانهما، ويتأكدان أن الناتج ضمن القيم الرئيسية، ثم يتحدثان عن السياحة الجبلية وجمال جبال عمان (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.", "1) [مستوى المعرفة] أوجد القيمة الدقيقة: جا(جتا⁻¹(1/2)).\nالإجابة النموذجية: جا 60° = √3/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جتا(ظا⁻¹(1)).\nالإجابة النموذجية: جتا 45° = √2/2\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا⁻¹(جا 150°).\nالإجابة النموذجية: 30° (لأن مدى جا⁻¹ هو [−90°، 90°])", "1) [مستوى المعرفة] أوجد القيمة الدقيقة: ظا(جا⁻¹(√3/2)).\nالإجابة النموذجية: ظا 60° = √3\n2) [مستوى التطبيق] إذا كانت د(س) = 2 جا س في −π/2 ≤ س ≤ π/2، أوجد د⁻¹(س). "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\nسؤال: «جا س = 1/2 لها حلول كثيرة، فأي قيمة يعطيها مفتاح sin⁻¹ في الحاسبة؟ ولماذا؟»\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية\nمراجعة خطوات إيجاد الدالة العكسية من الصف الحادي عشر: «اكتب ص = د(س) ← بادل س وص ← اكتب ص بدلالة س».", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال ويجرب على الحاسبة، ويلاحظ الطالب أن الحاسبة تعطي 30° فقط (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يوضح المعلم ضرورة تقييد المجال لتكون الدالة واحدًا لواحد، ويعرض منحنيات الدوال العكسية ص ⁦68–69⁩، والطلبة يدون المجال والمدى لكل دالة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 13 ص 70 (جا⁻¹(0)، جتا⁻¹(√3/2)، ظا⁻¹(−1))، ويتابع الطالب ويحل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بتمارين 5-2: 1، 2 ص 71، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يراجع المعلم الخطوات، ويذكر الطالب الخطوات بمثال خطي (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يحل المعلم مثال 14 ص ⁦70–71⁩ (د(س) = 3 + جا⁻¹(س/2)... ورسمها وإيجاد عكسها ومداها)، ويتابع الطالب ويدون (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يكلف المعلم بتمارين 5-2: 3، 4، 5 ص ⁦71–72⁩، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: تمرين من كتاب النشاط ص 44، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدوال المثلثية العكسية، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – زاوية الصعود الجبلي: يحسب كل زوج زاوية ميل مسار مشي جبلي في عمان باستخدام ظا⁻¹ من ارتفاع ومسافة أفقية يختارانهما، ويتأكدان أن الناتج ضمن القيم الرئيسية، ثم يتحدثان عن السياحة الجبلية وجمال جبال عمان (5 دقائق)\nالاستراتيجيات: التعلم بالأقران.", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\n1) [مستوى المعرفة] ما مدى الدالة جتا⁻¹ س؟\nالإجابة النموذجية: 0° ≤ جتا⁻¹ س ≤ 180°\n2) [مستوى التطبيق] أوجد جا⁻¹(1/2) بالراديان.\nالإجابة النموذجية: π/6\n3) [مستوى الاستدلال] لماذا تكون جتا⁻¹(−1/2) = 120° وليست 240°؟\nالإجابة النموذجية: لأن مدى جتا⁻¹ هو [0°، 180°] و 240° خارجه\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية\n1) [مستوى المعرفة] أوجد القيمة الدقيقة: جا(جتا⁻¹(1/2)).\nالإجابة النموذجية: جا 60° = √3/2\n2) [مستوى التطبيق] أوجد القيمة الدقيقة: جتا(ظا⁻¹(1)).\nالإجابة النموذجية: جتا 45° = √2/2\n3) [مستوى الاستدلال] أوجد القيمة الدقيقة: جا⁻¹(جا 150°).\nالإجابة النموذجية: 30° (لأن مدى جا⁻¹ هو [−90°، 90°])", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\n1) [مستوى المعرفة] أوجد ظا⁻¹(1) بالدرجات.\nالإجابة النموذجية: 45°\n2) [مستوى التطبيق] أوجد جا⁻¹(−√3/2) بالراديان.\nالإجابة النموذجية: −π/3\n3) [مستوى الاستدلال] أوجد جتا⁻¹(0) + جا⁻¹(1) بالراديان.\nالإجابة النموذجية: π/2 + π/2 = π\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية\n1) [مستوى المعرفة] أوجد القيمة الدقيقة: ظا(جا⁻¹(√3/2)).\nالإجابة النموذجية: ظا 60° = √3\n2) [مستوى التطبيق] إذا كانت د(س) = 2 جا س في −π/2 ≤ س ≤ π/2، أوجد د⁻¹(س).\nالإجابة النموذجية: د⁻¹(س) = جا⁻¹(س/2)\n3) [مستوى الاستدلال] ما مجال د⁻¹(س) في السؤال السابق؟\nالإجابة النموذجية: −2 ≤ س ≤ 2", "الحصة 1: تعريف الدوال المثلثية العكسية ومجالاتها ومداها\nإرشاد للطالب: قراءة المجالات والمديات ص ⁦68–69⁩ ومثال 13 ص 70، وحل تمارين 5-2 (1، 2) ص 71 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: تركيب الدوال المثلثية مع عكوسها وإيجاد الدالة العكسية\nإرشاد للطالب: مراجعة مثال 14 ص ⁦70–71⁩، وحل تمارين 5-2 (⁦5–7⁩) ص 72 من كتاب الطالب، وتمارين 5-2 ص ⁦43–45⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في م التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثالي 17، 18 ص ⁦76–78⁩، ويتابع الطالب ويدون الخطوات الأربع (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تعاوني: يكلف المعلم بحل جا 2س = 0.5، جتا(س − 30°) = 0.5 في 0° ≤ س ≤ 360°، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. فردي: يكلف المعلم بتمارين 6-2: 4، 5، 6 ص 83، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويحولها الطالب إلى 2ك² − ك − 1 = 0 (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. النمذجة: يحل المعلم أمثلة 19، 20 ص ⁦79–81⁩، ويتابع الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يكلف المعلم بتمارين 6-2: ⁦8–11⁩ ص 83 موزعة على المجموعات، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصويب: يناقش المعلم الحلول المرفوضة، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «حل: جتا(س − 30°) = 1/2 حيث 0° ≤ س ≤ 360°»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – رفرفة علم السارية: يتخيل الطلبة طرف علم عمان يرتفع وينخفض مع الريح وفق منحنى جيبي، فتحل كل مجموعة معادلة مثل جا س = 0.5 بين 0° و360° لتحديد لحظتي وصوله إلى ارتفاع معين، وتجد الحل الثاني بالتماثل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: حل معادلات الجيب في فترة معطاة\n1) [مستوى المعرفة] حل: جا س = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 30°، 150°\n2) [مستوى التطبيق] حل: جا س = 0.3 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 17.5°، 162.5°\n3) [مستوى الاستدلال] حل: جا س = −0.6 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 216.9°، 323.1°\n\nالحصة 2: حل معادلات جيب التمام والظل بالدرجات والراديان\n1) [مستوى المعرفة] حل: جتا س = −1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 120°، 240°\n2) [مستوى التطبيق] حل: ظا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 45°، 225°\n3) [مستوى الاستدلال] حل: جتا س = 0.4 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: س ≈ 66.4°، 293.6°\n\nالحصة 3: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\n1) [مستوى المعرفة] إذا كانت 0° ≤ س ≤ 180°، ففي أي فترة تقع 2س؟\nالإجابة النموذجية: 0° ≤ 2س ≤ 360°\n2) [مستوى التطبيق] حل: جا 2س = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2س = 30°، 150°، 390°، 510° ← س = 15°، 75°، 195°، 255°\n3) [مستوى الاستدلال] حل: جتا(س − 30°) = 1/2 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س − 30° = 60°، 300° ← س = 90°، 330°\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام\n1) [مستوى المعرفة] حل: (جا س − 1)(2جا س + 1) = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، 210°، 330°\n2) [مستوى التطبيق] حل: ظا² س = 3 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = ±√3 ← س = 60°، 120°، 240°، 300°\n3) [مستوى الاستدلال] حل: جتا² س − 3جتا س − 4 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: (جتا س − 4)(جتا س + 1) = 0؛ جتا س = 4 مرفوض ← س = 180°", "الحصة 1: حل معادلات الجيب في فترة معطاة\n1) [مستوى المعرفة] حل: جا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°\n2) [مستوى التطبيق] حل: جا س = √3/2 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س = π/3، 2π/3\n3) [مستوى الاستدلال] حل: 2جا س + 1 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = −1/2 ← س = 210°، 330°\n\nالحصة 2: حل معادلات جيب التمام والظل بالدرجات والراديان\n1) [مستوى المعرفة] حل: جتا س = 1 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 0°، 360°\n2) [مستوى التطبيق] حل: ظا س = √3 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س = π/3، 4π/3\n3) [مستوى الاستدلال] حل: ظا س = −2.1 حيث 0° ≤ س ≤ 360° (لأقرب 0.01°).\nالإجابة النموذجية: س ≈ 115.46°، 295.46°\n\nالحصة 3: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\n1) [مستوى المعرفة] حل: جتا 2س = 0 حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: 2س = 90°، 270° ← س = 45°، 135°\n2) [مستوى التطبيق] حل: ظا 3س = 1 حيث 0° ≤ س ≤ 120°.\nالإجابة النموذجية: 3س = 45°، 225° ← س = 15°، 75°\n3) [مستوى الاستدلال] حل: جا(س + π/6) = 1 حيث 0 ≤ س ≤ 2π.\nالإجابة النموذجية: س + π/6 = π/2 ← س = π/3\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام\n1) [مستوى المعرفة] حل: جا² س = 1/4 حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: جا س = 1/2 (السالبة لا تعطي حلولًا في الفترة) ← س = 30°، 150°\n2) [مستوى التطبيق] حل: 2جا² س − جا س − 1 = 0 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: س = 90°، 210°، 330°\n3) [مستوى الاستدلال] لماذا لا توجد حلول للمعادلة جا س = 2؟\nالإجابة النموذجية: لأن مدى الجيب [−1، 1]", "الحصة 1: حل معادلات الجيب في فترة معطاة\nإرشاد للطالب: مراجعة مثال 15 ص 74، وحل تمارين 6-2 (1) ص 82 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: حل معادلات جيب التمام والظل بالدرجات والراديان\nإرشاد للطالب: مراجعة مثال 16 ص ⁦75–76⁩، وحل تمارين 6-2 (2، 3) ص 82 من كتاب الطالب، وتمارين 6-2 (1، 2) ص 46 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: معادلات بزوايا مركبة: جا(ك س) وجتا(س ± أ)\nإرشاد للطالب: مراجعة مثالي 17، 18 ص ⁦76–78⁩، وحل تمارين 6-2 (⁦4–7⁩) ص 83 من كتاب الطالب، وتمارين 6-2 (⁦3–6⁩) ص 47 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: معادلات مثلثية في صورة تربيعية ومسابقة الختام\nإرشاد للطالب: حل تمارين 6-2 (⁦8–11⁩) ص 83 من كتاب الطالب، وتمارين 6-2 (⁦7–10⁩) ص ⁦48–49⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=9"]}, {"id": "7-2", "title": "المتطابقات المثلثية", "unit": "الوحدة الثانية: حساب المثلثات", "sbp": "⁦84–86⁩", "wbp": "⁦50–52⁩", "p": [{"t": "المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يبرهن المتطابقتين الأساسيتين باستخدام تعريف النسب المثلثية ونظرية فيثاغورث (20 دقيقة)\n2) يستخدم المتطابقتين لتبسيط عبارات مثلثية والتعبير عنها بدلالة نسبة واحدة (20 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "المتطابقة، الرمز ≡، المتطابقتان الأساسيتان، جا² هـ = 1 − جتا² هـ، جتا² هـ = 1 − جا² هـ", "يطلب المعلم حساب جا² 37° + جتا² 37° على الحاسبة، ثم تجربة زاوية أخرى، ويسأل: «ماذا تلاحظ؟»", "1. التهيئة: ينفذ المعلم النشاط بالحاسبة، ويلاحظ الطالب أن الناتج 1 دائمًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. البرهان: يقود المعلم برهان المتطابقتين ص 84 من دائرة الوحدة (س/نق، ص/نق)، ويشارك الطالب في خطوات البرهان (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 21 ص 84 (التعبير عن عبارة بدلالة جا س فقط)، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بتمارين 7-2: 1 ص 85، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] أكمل: جا² هـ + جتا² هـ ≡ ......\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] بسّط: جتا هـ × ظا هـ.\nالإجابة النموذجية: جا هـ\n3) [مستوى الاستدلال] اكتب 2جا² س − 7جتا² س + 4 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 7(1 − جا² س) + 4 = 9جا² س − 3", "1) [مستوى المعرفة] بسّط: 1 − جا² هـ.\nالإجابة النموذجية: جتا² هـ\n2) [مستوى التطبيق] بسّط: جا هـ ÷ ظا هـ.\nالإجابة النموذجية: جتا هـ\n3) [مستوى الاستدلال] اكتب 3 − 2جا² س بدلالة جتا س.\nالإجابة النموذجية: 3 − 2(1 − جتا² س) = 1 + 2جتا² س", "إرشاد للطالب: مراجعة البرهان ص 84 ومثال 21، وحل تمارين 7-2 (1) ص 85 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=10"]}, {"t": "برهنة المتطابقات المثلثية", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يبرهن متطابقات مثلثية بالبدء من أحد الطرفين والوصول إلى الآخر (25 دقيقة)\n2) يختار الاستراتيجية المناسبة (توحيد المقامات، التحليل، الاستبدال) في البرهان (15 دقيقة)", "المخرج 1: تقييم\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، أخرى: بطاقات عمل", "البرهان، الطرف الأيمن والطرف الأيسر، توحيد المقامات، الفرق بين مربعين", "يعرض المعلم «برهانًا» يحتوي خطأً متعمدًا ويطلب من الطلبة اكتشافه.", "1. التهيئة: يعرض المعلم البرهان الخاطئ، ويكتشف الطالب الخطأ (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثالي 22، 23 ص 85 ويستخرج إرشادات البرهان، والطلبة يدون الإرشادات (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تشاركي (بطاقات خطوات): يوزع المعلم بطاقات خطوات برهان مبعثرة لمتطابقة ويطلب ترتيبها، ويرتب الطالب الخطوات ويبرر كل خطوة (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. فردي: يكلف المعلم بتمارين 7-2: 2 (أ، ب) ص 85، ويبرهن الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] أثبت أن: جتا س × ظا س ≡ جا س.\nالإجابة النموذجية: جتا س × جا س/جتا س = جا س\n2) [مستوى التطبيق] أثبت أن: (1 − جتا² س)/جا س ≡ جا س.\nالإجابة النموذجية: جا² س/جا س = جا س\n3) [مستوى الاستدلال] أثبت أن: 1/جتا س − جتا س ≡ جا س ظا س.\nالإجابة النموذجية: (1 − جتا² س)/جتا س = جا² س/جتا س = جا س × جا س/جتا س", "1) [مستوى المعرفة] أثبت أن: ظا س/جا س ≡ 1/جتا س.\nالإجابة النموذجية: (جا س/جتا س) ÷ جا س = 1/جتا س\n2) [مستوى التطبيق] أثبت أن: جا⁴ س − جتا⁴ س ≡ جا² س − جتا² س.\nالإجابة النموذجية: (جا² س − جتا² س)(جا² س + جتا² س) = جا² س − جتا² س\n3) [مستوى الاستدلال] أثبت أن: (1 + جا س)/جتا² س ≡ 1/(1 − جا س).\nالإجابة النموذجية: (1 + جا س)/[(1 − جا س)(1 + جا س)] = 1/(1 − جا س)", "إرشاد للطالب: مراجعة مثال 23 ص 85، وحل تمارين 7-2 (2، 3) ص ⁦85–86⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، و النمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: 0.8 (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين 7-2: ⁦4–10⁩ ص 86 وتمارين كتاب النشاط ص ⁦50–52⁩ حسب المستوى، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض المجموعات براهينها، ويبرر الطالب ويناقش (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول المتطابقات المثلثية، ويبدأ المعلم بسؤال «أثبت أن: (1 − جتا² س)/جا س ≡ جا س» (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – حجارة الحصن المتطابقة: ينقسم الصف فريقين يتناوبان على خطوات برهان متطابقة مثلثية، وكل خطوة صحيحة تضيف حجرًا إلى رسم حصن عماني على السبورة، ثم يتحدث الطلبة عن قيمة التعاون في بناء الوطن (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\n1) [مستوى المعرفة] أكمل: جا² هـ + جتا² هـ ≡ ......\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] بسّط: جتا هـ × ظا هـ.\nالإجابة النموذجية: جا هـ\n3) [مستوى الاستدلال] اكتب 2جا² س − 7جتا² س + 4 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 7(1 − جا² س) + 4 = 9جا² س − 3\n\nالحصة 2: برهنة المتطابقات المثلثية\n1) [مستوى المعرفة] أثبت أن: جتا س × ظا س ≡ جا س.\nالإجابة النموذجية: جتا س × جا س/جتا س = جا س\n2) [مستوى التطبيق] أثبت أن: (1 − جتا² س)/جا س ≡ جا س.\nالإجابة النموذجية: جا² س/جا س = جا س\n3) [مستوى الاستدلال] أثبت أن: 1/جتا س − جتا س ≡ جا س ظا س.\nالإجابة النموذجية: (1 − جتا² س)/جتا س = جا² س/جتا س = جا س × جا س/جتا س\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\n1) [مستوى المعرفة] إذا كان جا س = 0.6 وس حادة، أوجد جتا س.\nالإجابة النموذجية: 0.8\n2) [مستوى التطبيق] أثبت أن: (جا س + جتا س)² ≡ 1 + 2جا س جتا س.\nالإجابة النموذجية: جا² س + 2جا س جتا س + جتا² س = 1 + 2جا س جتا س\n3) [مستوى الاستدلال] أثبت أن: ظا س + 1/ظا س ≡ 1/(جا س جتا س).\nالإجابة النموذجية: (جا² س + جتا² س)/(جا س جتا س) = 1/(جا س جتا س)", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\n1) [مستوى المعرفة] بسّط: 1 − جا² هـ.\nالإجابة النموذجية: جتا² هـ\n2) [مستوى التطبيق] بسّط: جا هـ ÷ ظا هـ.\nالإجابة النموذجية: جتا هـ\n3) [مستوى الاستدلال] اكتب 3 − 2جا² س بدلالة جتا س.\nالإجابة النموذجية: 3 − 2(1 − جتا² س) = 1 + 2جتا² س\n\nالحصة 2: برهنة المتطابقات المثلثية\n1) [مستوى المعرفة] أثبت أن: ظا س/جا س ≡ 1/جتا س.\nالإجابة النموذجية: (جا س/جتا س) ÷ جا س = 1/جتا س\n2) [مستوى التطبيق] أثبت أن: جا⁴ س − جتا⁴ س ≡ جا² س − جتا² س.\nالإجابة النموذجية: (جا² س − جتا² س)(جا² س + جتا² س) = جا² س − جتا² س\n3) [مستوى الاستدلال] أثبت أن: (1 + جا س)/جتا² س ≡ 1/(1 − جا س).\nالإجابة النموذجية: (1 + جا س)/[(1 − جا س)(1 + جا س)] = 1/(1 − جا س)\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\n1) [مستوى المعرفة] إذا كان جتا س = 5/13 وس حادة، أوجد ظا س.\nالإجابة النموذجية: 12/5\n2) [مستوى التطبيق] أثبت أن: جتا² س − جا² س ≡ 1 − 2جا² س.\nالإجابة النموذجية: (1 − جا² س) − جا² س = 1 − 2جا² س\n3) [مستوى الاستدلال] أثبت أن: (1 − جتا س)(1 + جتا س) ≡ جا² س.\nالإجابة النموذجية: 1 − جتا² س = جا² س", "الحصة 1: المتطابقتان الأساسيتان: ظا هـ = جا هـ/جتا هـ و جا² هـ + جتا² هـ = 1\nإرشاد للطالب: مراجعة البرهان ص 84 ومثال 21، وحل تمارين 7-2 (1) ص 85 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: برهنة المتطابقات المثلثية\nإرشاد للطالب: مراجعة مثال 23 ص 85، وحل تمارين 7-2 (2، 3) ص ⁦85–86⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تمارين المتطابقات ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 7-2 ص ⁦50–52⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفا .\nالإجابة النموذجية: جتا س(2جا س − 1) = 0 ← س = 30°، 90°، 150°، 270°", "إرشاد للطالب: مراجعة مثال 24 ص 87، وحل تمارين 8-2 (1، 2، 4) ص 89 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}, {"t": "معادلات تُحل باستخدام جا² س + جتا² س = 1", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يحول معادلة تحتوي جا² س وجتا س (أو العكس) إلى معادلة تربيعية في نسبة واحدة ويحلها (25 دقيقة)\n2) يحل معادلات مثل ظا س − جتا س = 0 بتحويلها إلى معادلة تربيعية (مثال 25) (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: برنامج GeoGebra", "الاستبدال جا² س = 1 − جتا² س، المعادلة التربيعية، الصيغة التربيعية، الحلول المرفوضة", "سؤال: «في المعادلة 2جتا² س + 3جا س = 3، كيف نجعل المعادلة كلها بدلالة جا س؟»", "1. التهيئة: يطرح المعلم السؤال، ويقترح الطالب الاستبدال (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 25 ص 88 ويتحقق بالرسم، ويتابع الطالب ويتحقق (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تعاوني: يكلف المعلم بتمارين 8-2: 3، 5، 6 ص 89، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: تمارين 8-2 (⁦1–4⁩) ص ⁦53–54⁩ من كتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] اكتب المعادلة 2جتا² س + 3جا س = 3 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 3جا س + 1 = 0\n2) [مستوى التطبيق] حل المعادلة السابقة حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = 1 أو 1/2 ← س = 30°، 90°، 150°\n3) [مستوى الاستدلال] بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0.\nالإجابة النموذجية: جا س = جتا² س = 1 − جا² س", "1) [مستوى المعرفة] حل: جا² س = جتا² س حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: ظا² س = 1 ← س = 45°، 135°\n2) [مستوى التطبيق] حل: 2جا² س = 1 + جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جتا² س + جتا س − 1 = 0 ← جتا س = 1/2 أو −1 ← س = 60°، 180°، 300°\n3) [مستوى الاستدلال] حل: جا² س + جا س − 1 = 0 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: جا س = (−1 + √5)/2 ≈ 0.618 ← س ≈ 38.2°، 141.8°", "إرشاد للطالب: مراجعة مثال 25 ص 88، وحل تمارين 8-2 (3، ⁦5–9⁩) ص 89 من كتاب الطالب، وتمارين 8-2 ص ⁦53–55⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}, {"t": "مراجعة الوحدة الثانية ومسابقة الختام", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يراجع مهارات الوحدة الثانية (القيم الدقيقة، التمثيلات، الدوال العكسية، المعادلات، المتطابقات) (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم التعاوني، التعلم المبني على اللعب، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مفاهيم الوحدة الثانية: القيم الدقيقة، زاوية الأساس، التمثيلات البيانية، الدوال العكسية، المعادلات والمتطابقات", "يقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثانية ص ⁦91–92⁩.", "1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ وكتاب النشاط ص ⁦56–58⁩: (⁦1–5⁩) للدعم، (⁦6–11⁩) للمتوقع، (⁦12–17⁩) للمتقدم، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مناقشة: يعرض المعلم حلولًا نموذجية، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – أمانة الحل الكامل: يحل كل زوج معادلة تتضمن جا س جتا س مرة بالتحليل ومرة بالقسمة، فيكتشف الحلول التي تضيع بالقسمة، ثم يربط الطلبة ذلك بقيمة الأمانة والدقة في العمل التي يعتز بها المجتمع العماني (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "1) [مستوى المعرفة] أوجد القيمة الدقيقة لـ جتا(5π/6).\nالإجابة النموذجية: −√3/2\n2) [مستوى التطبيق] حل: جتا² س = 1/4 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س = ±1/2 ← س = 60°، 120°، 240°، 300°\n3) [مستوى الاستدلال] بسّط: (جا س + جتا س)² + (جا س − جتا س)².\nالإجابة النموذجية: 2(جا² س + جتا² س) = 2", "1) [مستوى المعرفة] ما سعة الدالة ص = 3جتا 2س ودورتها؟\nالإجابة النموذجية: السعة 3، الدورة 180°\n2) [مستوى التطبيق] أوجد جتا⁻¹(−√2/2) بالراديان.\nالإجابة النموذجية: 3π/4\n3) [مستوى الاستدلال] حل: 3جا س = 2جتا² س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جا² س + 3جا س − 2 = 0 ← جا س = 1/2 ← س = 30°، 150°", "إرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ من كتاب الطالب وص ⁦56–58⁩ من كتاب النشاط، والاستعداد لاختبار قصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}], "c": ["الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) يحوّل معادلات مثل جا س = 2جتا س إلى صورة ظا س = ك ويحلها (25 دقيقة)\n2) يحل معادلات تتضمن جا س جتا س بالتحليل مع مراعاة عدم القسمة على عامل قد يساوي صفرًا (15 دقيقة)\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) يحول معادلة تحتوي جا² س وجتا س (أو العكس) إلى معادلة تربيعية في نسبة واحدة ويحلها (25 دقيقة)\n2) يحل معادلات مثل ظا س − جتا س = 0 بتحويلها إلى معادلة تربيعية (مثال 25) (15 دقيقة)\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) يراجع مهارات الوحدة الثانية (القيم الدقيقة، التمثيلات، الدوال العكسية، المعادلات، المتطابقات) (20 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (20 دقيقة)", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nال تا س، جا س جتا س = جا س، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: يكلف المعلم بتمارين 8-2: 2، 4 ص 89، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1 — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويقترح الطالب الاستبدال (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 25 ص 88 ويتحقق بالرسم، ويتابع الطالب ويتحقق (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 8-2: 3، 5، 6 ص 89، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: تمارين 8-2 (⁦1–4⁩) ص ⁦53–54⁩ من كتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ وكتاب النشاط ص ⁦56–58⁩: (⁦1–5⁩) للدعم، (⁦6–11⁩) للمتوقع، (⁦12–17⁩) للمتقدم، ويحل الطالب حسب مستواه (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة: يعرض المعلم حلولًا نموذجية، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. بطاقة الخروج: يكتب كل طالب على بطاقة إجابة سؤال «بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (9 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – أمانة الحل الكامل: يحل كل زوج معادلة تتضمن جا س جتا س مرة بالتحليل ومرة بالقسمة، فيكتشف الحلول التي تضيع بالقسمة، ثم يربط الطلبة ذلك بقيمة الأمانة والدقة في العمل التي يعتز بها المجتمع العماني (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) [مستوى المعرفة] حل: جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1 ← س = 45°، 225°\n2) [مستوى التطبيق] حل: جا س = 2جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 2 ← س ≈ 63.4°، 243.4°\n3) [مستوى الاستدلال] حل: جا س جتا س = جا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س(جتا س − 1) = 0 ← س = 0°، 180°، 360°\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) [مستوى المعرفة] اكتب المعادلة 2جتا² س + 3جا س = 3 بدلالة جا س.\nالإجابة النموذجية: 2جا² س − 3جا س + 1 = 0\n2) [مستوى التطبيق] حل المعادلة السابقة حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جا س = 1 أو 1/2 ← س = 30°، 90°، 150°\n3) [مستوى الاستدلال] بيّن أن ظا س − جتا س = 0 تكافئ جا² س + جا س − 1 = 0.\nالإجابة النموذجية: جا س = جتا² س = 1 − جا² س\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) [مستوى المعرفة] أوجد القيمة الدقيقة لـ جتا(5π/6).\nالإجابة النموذجية: −√3/2\n2) [مستوى التطبيق] حل: جتا² س = 1/4 حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س = ±1/2 ← س = 60°، 120°، 240°، 300°\n3) [مستوى الاستدلال] بسّط: (جا س + جتا س)² + (جا س − جتا س)².\nالإجابة النموذجية: 2(جا² س + جتا² س) = 2", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\n1) [مستوى المعرفة] حل: √3 جا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: ظا س = 1/√3 ← س = 30°، 210°\n2) [مستوى التطبيق] حل: جتا س + جا س = 5جتا س حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: ظا س = 4 ← س ≈ 76.0°، 256.0°\n3) [مستوى الاستدلال] حل: 2جا س جتا س = جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: جتا س(2جا س − 1) = 0 ← س = 30°، 90°، 150°، 270°\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\n1) [مستوى المعرفة] حل: جا² س = جتا² س حيث 0° ≤ س ≤ 180°.\nالإجابة النموذجية: ظا² س = 1 ← س = 45°، 135°\n2) [مستوى التطبيق] حل: 2جا² س = 1 + جتا س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جتا² س + جتا س − 1 = 0 ← جتا س = 1/2 أو −1 ← س = 60°، 180°، 300°\n3) [مستوى الاستدلال] حل: جا² س + جا س − 1 = 0 حيث 0° ≤ س ≤ 360° (لأقرب 0.1°).\nالإجابة النموذجية: جا س = (−1 + √5)/2 ≈ 0.618 ← س ≈ 38.2°، 141.8°\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\n1) [مستوى المعرفة] ما سعة الدالة ص = 3جتا 2س ودورتها؟\nالإجابة النموذجية: السعة 3، الدورة 180°\n2) [مستوى التطبيق] أوجد جتا⁻¹(−√2/2) بالراديان.\nالإجابة النموذجية: 3π/4\n3) [مستوى الاستدلال] حل: 3جا س = 2جتا² س حيث 0° ≤ س ≤ 360°.\nالإجابة النموذجية: 2جا² س + 3جا س − 2 = 0 ← جا س = 1/2 ← س = 30°، 150°", "الحصة 1: معادلات تُحل باستخدام ظا س = جا س/جتا س\nإرشاد للطالب: مراجعة مثال 24 ص 87، وحل تمارين 8-2 (1، 2، 4) ص 89 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: معادلات تُحل باستخدام جا² س + جتا² س = 1\nإرشاد للطالب: مراجعة مثال 25 ص 88، وحل تمارين 8-2 (3، ⁦5–9⁩) ص 89 من كتاب الطالب، وتمارين 8-2 ص ⁦53–55⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مراجعة الوحدة الثانية ومسابقة الختام\nإرشاد للطالب: حل بقية تمارين مراجعة نهاية الوحدة الثانية ص ⁦93–95⁩ من كتاب الطالب وص ⁦56–58⁩ من كتاب النشاط، والاستعداد لاختبار قصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=11"]}, {"id": "1-3", "title": "نهاية الدالة عند نقطة", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦96–98⁩", "wbp": "⁦59–61⁩", "p": [{"t": "مفهوم النهاية باستخدام جداول القيم", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يقدّر نهاية دالة عند نقطة باستخدام جدول قيم تقترب فيه س من أ من الجهتين (30 دقيقة)\n2) يعبّر عن النهاية بالرمز نها(س←أ) د(س) = ل ويقرؤها قراءة صحيحة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: فهم", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، جهاز الحاسب", "النهاية، الاقتراب من اليمين، الاقتراب من اليسار، الرمز نها", "مراجعة «اختبر مهاراتك» ص 96: حساب قيمة دالة نسبية عند نقطة، وتحديد قيم س التي تجعل الدا ة 1 ص 98 ويناقش أن وجود النهاية لا يتطلب تعريف الدالة عند أ، والطلبة يدون النتيجة ويمثل لها (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تشاركي: يعرض المعلم أربعة منحنيات (متصل، فجوة، قفزة، خط تقارب) ويطلب تحديد وجود النهاية، ويحدد الطالب في أزواج ويبرر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تطبيق: أسئلة كتاب النشاط تمارين 1-3 (1، 2) ص ⁦59–60⁩، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: تقدير النهايات من التمثيل البياني ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تطبيق موجّه: يعرض المعلم منحنيات من كتاب النشاط ص ⁦60–61⁩ ويقدر النهايات مع الطلبة، ويقدر الطالب ويكتب بالرموز (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تعاوني: يكلف المجموعات بتمارين 1-3 (⁦3–5⁩) ص ⁦60–61⁩ من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تصويب: يناقش المعلم الأخطاء الشائعة (الخلط بين د(أ) والنهاية)، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «فسّر لماذا لا توجد نهاية لـ 1/(س − 3) عند س ← 3 من الرسم»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – الاقتراب من جبل شمس: تقترب المجموعات من قمة جبل شمس، أعلى قمة في عمان، بجدول قيم تقترب فيه س من أ من الجهتين، وتكتب النهاية بالرمز الصحيح وتقرؤها، ثم يذكر كل فرد معلمًا طبيعيًا عمانيًا يتمنى زيارته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفهوم النهاية باستخدام جداول القيم\n1) [مستوى المعرفة] أكمل: عندما تقترب س من 4 تقترب قيمة 3س من ......\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] اقرأ الرمز: نها(س←2⁺) د(س) = 5.\nالإجابة النموذجية: نهاية د(س) عندما تقترب س من 2 من جهة اليمين تساوي 5\n3) [مستوى الاستدلال] استخدم جدول قيم لتقدير نها(س←2) (س² + 1).\nالإجابة النموذجية: القيم تقترب من 5\n\nالحصة 2: النهاية من اليمين واليسار وشرط وجود النهاية\n1) [مستوى المعرفة] إذا كانت نها(س←2⁻) د(س) = 3 و نها(س←2⁺) د(س) = 3، فما نها(س←2) د(س)؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] إذا كانت النهاية من اليسار 1 ومن اليمين 4 عند س = 0، فهل النهاية موجودة؟\nالإجابة النموذجية: لا؛ النهايتان غير متساويتين\n3) [مستوى الاستدلال] هل يلزم أن تكون الدالة معرّفة عند س = أ لتكون لها نهاية عندها؟ مثّل.\nالإجابة النموذجية: لا؛ مثل (س² − 4)/(س − 2) عند 2: غير معرّفة والنهاية 4\n\nالحصة 3: تقدير النهايات من التمثيل البياني ومسابقة الختام\n1) [مستوى المعرفة] من منحنى متصل يمر بالنقطة (1، 3)، ما نها(س←1) د(س)؟\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] منحنى فيه نقطة معرفة (2، 1) لكن المنحنى يقترب من 4 حولها. ما د(2) وما نها(س←2) د(س)؟\nالإجابة النموذجية: د(2) = 1، النهاية = 4\n3) [مستوى الاستدلال] فسّر لماذا لا توجد نهاية لـ 1/(س − 3) عند س ← 3 من الرسم.\nالإجابة النموذجية: القيم تتزايد بلا حد من جهة وتتناقص بلا حد من الأخرى (خط تقارب رأسي)", "الحصة 1: مفهوم النهاية باستخدام جداول القيم\n1) [مستوى المعرفة] قدّر نها(س←1) (2س + 3).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] ما المقصود بالاقتراب من اليسار عندما س ← 3⁻؟\nالإجابة النموذجية: س تأخذ قيمًا أصغر من 3 وتقترب منها مثل 2.9، 2.99، ...\n3) [مستوى الاستدلال] قدّر بجدول قيم نها(س←0) (س² + س)/س.\nالإجابة النموذجية: القيم تقترب من 1\n\nالحصة 2: النهاية من اليمين واليسار وشرط وجود النهاية\n1) [مستوى المعرفة] متى تكون نها(س←أ) د(س) = ل موجودة؟\nالإجابة النموذجية: عندما تتساوى النهايتان من اليمين واليسار وتساوي ل\n2) [مستوى التطبيق] من منحنى فيه قفزة عند س = 1 (يسارًا 2 ويمينًا −1)، هل النهاية عند 1 موجودة؟\nالإجابة النموذجية: غير موجودة\n3) [مستوى الاستدلال] دالة لها فجوة عند (3، 5) والمنحنى يقترب من 5 من الجهتين. ما نها(س←3) د(س)؟\nالإجابة النموذجية: 5\n\nالحصة 3: تقدير النهايات من التمثيل البياني ومسابقة الختام\n1) [مستوى المعرفة] قدّر نها(س←0) د(س) لمنحنى يقترب من 2 من الجهتين.\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] منحنى يقترب من 5 يسار س = 4 ومن 7 يمينها. اكتب النهايتين بالرموز.\nالإجابة النموذجية: نها(س←4⁻) د(س) = 5، نها(س←4⁺) د(س) = 7\n3) [مستوى 1: نهاية الدالة النسبية بالتعويض المباشر والصيغة غير المعيّنة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم استكشف 2، ويحدد الطالب قيم س غير المعرّفة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الاستكشاف: يقود المعلم تحليل المنحنيين: أحدهما خط تقارب والآخر فجوة، ويقارن الطالب ويستنتج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم أمثلة تعويض مباشر وأمثلة تعطي 0/0، ويميز الطالب الحالتين (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بتصنيف 6 نهايات: تعويض مباشر / 0/0 / مقام صفري وبسط غير صفري، وتصنف المجموعات (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: إيجاد النهاية بالتحليل إلى عوامل والاختصار — زمن الحصة 40 دقيقة\n\n1. التهيئة: مراجعة التحليل، ويحلل الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. النمذجة: يحل المعلم مثالي 2، 3 ص ⁦103–105⁩، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تشاركي: يوزع المعلم بطاقات نهايات على الأزواج، ويحل الطالب ويتبادل التصحيح (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. فردي: يكلف المعلم بتمارين 1-3ب: 2 ص 108، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: النهايات غير الموجودة للدوال النسبية وتمارين الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم المنحنى، ويلاحظ الطالب التباعد (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يناقش المعلم مثال 4 ص ⁦106–107⁩، ويتابع الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تعاوني: يكلف المعلم بتمارين 1-3ب: 4، 5، 6 ص ⁦108–109⁩ وتمارين كتاب النشاط ص ⁦62–65⁩، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تصويب: يناقش المعلم الأخطاء، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «أوجد نها(س←2) (س² + 1)/(س + 3)» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – فك شباك الصياد: تشبّه المجموعات الصيغة 0/0 بشبكة صيد متشابكة يفكّها الصياد العماني بصبر قبل رميها، فتبسّط الدالة النسبية بالتحليل ثم تعوّض، وتتسابق في فك أكبر عدد من «الشباك» المكتوبة على السبورة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: نهاية الدالة النسبية بالتعويض المباشر والصيغة غير المعيّنة\n1) [مستوى المعرفة] أوجد نها(س←1) (س + 3)/(س + 1).\nالإجابة النموذجية: 4/2 = 2\n2) [مستوى التطبيق] ما ناتج التعويض المباشر في (س² − 9)/(س − 3) عند س = 3؟ وماذا يعني؟\nالإجابة النموذجية: 0/0؛ صيغة غير معيّنة تحتاج إلى تبسيط\n3) [مستوى الاستدلال] ما الفرق بين منحنى (3س − 8)/(س − 2) ومنحنى (س² − 9)/(س − 3) عند النقطة غير المعرّفة؟\nالإجابة النموذجية: الأول له خط تقارب رأسي عند س = 2، والثاني له فجوة عند (3، 6)\n\nالحصة 2: إيجاد النهاية بالتحليل إلى عوامل والاختصار\n1) [مستوى المعرفة] أوجد نها(س←3) (س² − 9)/(س − 3).\nالإجابة النموذجية: نها(س + 3) = 6\n2) [مستوى التطبيق] أوجد نها(س←2) (س² + س − 6)/(س − 2).\nالإجابة النموذجية: نها(س + 3) = 5\n3) [مستوى الاستدلال] أوجد نها(س←2) (س³ − 8)/(س − 2).\nالإجابة النموذجية: نها(س² + 2س + 4) = 12\n\nالحصة 3: النهايات غير الموجودة للدوال النسبية وتمارين الدرس\n1) [مستوى المعرفة] هل توجد نها(س←2) 1/(س − 2)؟ برر.\nالإجابة النموذجية: لا؛ الدالة تتزايد بلا حد من اليمين وتتناقص بلا حد من اليسار\n2) [مستوى التطبيق] أوجد نها(س←4) (س² − 16)/(س − 4).\nالإجابة النموذجية: 8\n3) [مستوى الاستدلال] أوجد نها(س←1) (س² − 3س + 2)/(س² − 1).\nالإجابة النموذجية: نها (س − 2)/(س + 1) = −1/2", "الحصة 1: نهاية الدالة النسبية بالتعويض المباشر والصيغة غير المعيّنة\n1) [مستوى المعرفة] أوجد نها(س←2) (س² + 1)/(س + 3).\nالإجابة النموذجية: 5/5 = 1\n2) [مستوى التطبيق] هل يصح التعويض المباشر في (س² − 4)/(س − 2) عند س = 2؟\nالإجابة النموذجية: لا؛ يعطي 0/0\n3) [مستوى الاستدلال] أوجد نها(س←0) (س + 5)/(س² + 1).\nالإجابة النموذجية: 5\n\nالحصة 2: إيجاد النهاية بالتحليل إلى عوامل والاختصار\n1) [مستوى المعرفة] أوجد نها(س←−1) (س² − 1)/(س + 1).\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد نها(س←2) (س² − 5س + 6)/(س² − 4).\nالإجابة النموذجية: نها (س − 3)/(س + 2) = −1/4\n3) [مستوى الاستدلال] أوجد نها(س←0) (س² + 3س)/س.\nالإجابة النموذجية: 3\n\nالحصة 3: النهايات غير الموجودة للدوال النسبية وتمارين الدرس\n1) [مستوى المعرفة] هل توجد نها(س←3) (س + 1)/(س − 3)؟\nالإجابة النموذجية: لا؛ مقام صفري وبسط 4 ≠ 0\n2) [مستوى التطبيق] أوجد نها(س←5) (س − 5)/(س² − 25).\nالإجابة النموذجية: 1/10\n3) [مستوى الاستدلال] أوجد نها(س←−2) (س² + 5س + 6)/(س + 2).\nالإجابة النموذجية: 1", "الحصة 1: نهاية الدالة النسبية بالتعويض المباشر والصيغة غير المعيّنة\nإرشاد للطالب: مراجعة استكشف 2 ص 101 وحل تمارين 1-3ب (1) ص 108 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد النهاية بالتحليل إلى عوامل والاختصار\nإرشاد للطالب: مراجعة مثالي 2، 3 ص ⁦103–105⁩، وحل تمارين 1-3ب (2، 3) ص 108 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: النهايات غير الموجودة للدوال النسبية وتمارين الدرس\nإرشاد للطالب: حل تمارين 1-3ب (⁦4–6⁩) ص ⁦108–109⁩ من كتاب الطالب، وتمارين 1-3ب ص ⁦62–65⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=14"]}, {"id": "1-3ج", "title": "نهاية الدالة المعرّفة بأكثر من قاعدة", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦110–114⁩", "wbp": "⁦66–70⁩", "p": [{"t": "تقدير نهاية الدالة المعرّفة بأكثر من قاعدة من الرسم", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يقرأ التمثيل البياني لدالة معرّفة بأكثر من قاعدة ويحدد الفجوات والقفزات (20 دقيقة)\n2) يقدّر النهايات من اليمين واليسار والنهاية عند نقاط تغير القاعدة (مثال 5) (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، لف الأزواج بثلاث دوال لإيجاد النهايات عند نقاط التغير، ويحل الطالب ويتبادل (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. فردي: يكلف المعلم بتمارين 1-3ج: 2، 3 ص ⁦113–114⁩، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: إيجاد ثابت لتكون النهاية موجودة ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: تساوي النهايتين (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 7 ص ⁦112–113⁩، ويتابع الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تعاوني: يكلف المعلم بتمارين 1-3ج: ⁦5–8⁩ ص 114 وتمارين كتاب النشاط ص ⁦66–70⁩، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. عرض: تعرض المجموعات، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ما المقصود بالقفزة في منحنى دالة»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – أجرة رحلة نزوى: تصمم كل مجموعة دالة معرّفة بأكثر من قاعدة تمثل أجرة رحلة سياحية من مسقط إلى نزوى ثم إلى الجبل، بأسعار تفترضها، وتحدد النهايات من اليمين واليسار عند نقاط تغير القاعدة وتبحث عن القفزات (5 دقائق)\nالاستراتيجيات: التعلم القائم على حل المشكلات.", "الحصة 1: تقدير نهاية الدالة المعرّفة بأكثر من قاعدة من الرسم\n1) [مستوى المعرفة] ما المقصود بالقفزة في منحنى دالة؟\nالإجابة النموذجية: تغير مفاجئ في قيمة الدالة بحيث تختلف النهايتان من الجهتين\n2) [مستوى التطبيق] من منحنى عند س = 2: يسارًا يقترب من 3 ويمينًا من 1. هل النهاية موجودة؟\nالإجابة النموذجية: غير موجودة\n3) [مستوى الاستدلال] لماذا نهتم بنقطة تغير القاعدة بشكل خاص؟\nالإجابة النموذجية: لأن النهايتين من الجهتين تُحسبان بقاعدتين مختلفتين وقد تختلفان\n\nالحصة 2: إيجاد نهاية الدالة المعرّفة بأكثر من قاعدة جبريًا\n1) [مستوى المعرفة] د(س) = س + 1 عندما س < 2، و 5 − س عندما س ≥ 2. أوجد نها(س←2⁻) د(س).\nالإجابة تقارب الأفقي لمنحنى ص = 7/(س² + 1)؟\nالإجابة النموذجية: ص = 0\n3) [مستوى الاستدلال] أوجد نها(س←−∞) (2س² − س)/(5 − س²).\nالإجابة النموذجية: −2", "الحصة 1: مفهوم النهاية عند اللانهاية وخط التقارب الأفقي\nإرشاد للطالب: مراجعة ص ⁦115–116⁩ وحل تمارين 2-3 (1) ص 121 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد النهاية عند اللانهاية بقسمة الحدود على أعلى قوة\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦117–119⁩، وحل تمارين 2-3 (2، 3) ص 121 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تطبيقات على النهاية عند اللانهاية ومسابقة الختام\nإرشاد للطالب: حل تمارين 2-3 (4) ص 121 من كتاب الطالب، وتمارين 2-3 ص ⁦71–72⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=16"]}, {"id": "3-3", "title": "خواص النهايات", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦122–126⁩", "wbp": "⁦73–75⁩", "p": [{"t": "خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يستخدم خواص النهايات (⁦1–5⁩) لحساب نهايات دوال مركبة بمعلومية نهايات الدوال المكونة لها (25 دقيقة)\n2) يحدد شروط استخدام خاصية القسمة (نهاية المقام ≠ 0) (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "خواص النهايات، نهاية الثابت، نهاية مجموع/فرق/حاصل ضرب/خارج قسمة دالتين", "سؤال: «إذا علمت أن نها د(س) = 4 و نها ع(س) = −1 عند س ← 2، فهل يمكن إيجاد نها (د(س) + ع(س)) دون معرفة الدالتين؟»", "1. التهيئة: يطرح المعلم السؤال، ويتوقع الطالب: 3 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. بناء المفهوم: يعرض المعلم نتيجة 3 (الخواص ⁦1–5⁩) ص 12  4، أوجد نها(س←2) 3د(س).\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] إذا كانت نها د(س) = 4 و نها ع(س) = −1 عند س ← 2، أوجد نها (د(س) − ع(س)).\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] للدالتين السابقتين أوجد نها د(س)/ع(س)، ومتى لا يمكن استخدام خاصية القسمة؟\nالإجابة النموذجية: −4؛ عندما تكون نهاية المقام صفرًا\n\nالحصة 2: خاصيتا القوة والجذر والنهايات الخاصة\n1) [مستوى المعرفة] إذا كانت نها(س←1) د(س) = 4، أوجد نها(س←1) [د(س)]³.\nالإجابة النموذجية: 64\n2) [مستوى التطبيق] أوجد نها(س←4) √(س + 5).\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] إذا كانت نها د(س) = 9 عند س ← 2، أوجد نها (√د(س) + د(س)²).\nالإجابة النموذجية: 3 + 81 = 84\n\nالحصة 3: تمارين خواص النهايات ومسابقة الختام\n1) [مستوى المعرفة] إذا كانت نها د(س) = 3 و نها ع(س) = 6 عند س ← أ، أوجد نها (د(س) × ع(س) + 1).\nالإجابة النموذجية: 19\n2) [مستوى التطبيق] للدالتين السابقتين أوجد نها √(ع(س) + د(س)).\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] إذا كانت نها د(س) = 2 عند س ← أ، أوجد نها (د(س)² − 3د(س))/(د(س) + 2).\nالإجابة النموذجية: (4 − 6)/4 = −1/2", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\n1) [مستوى المعرفة] أوجد نها(س←3) 7 (ثابت).\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] إذا كانت نها د(س) = 5 و نها ع(س) = 2 عند س ← 1، أوجد نها (د(س) × ع(س)).\nالإجابة النموذجية: 10\n3) [مستوى الاستدلال] للدالتين السابقتين أوجد نها (2د(س) − 3ع(س)).\nالإجابة النموذجية: 10 − 6 = 4\n\nالحصة 2: خاصيتا القوة والجذر والنهايات الخاصة\n1) [مستوى المعرفة] أوجد نها(س←2) س⁵.\nالإجابة النموذجية: 32\n2) [مستوى التطبيق] أوجد نها(س←3) ∛(س² − 1).\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] إذا كانت نها د(س) = −2 عند س ← 0، أوجد نها [د(س)]² ÷ (د(س) + 4).\nالإجابة النموذجية: 4/2 = 2\n\nالحصة 3: تمارين خواص النهايات ومسابقة الختام\n1) [مستوى المعرفة] أوجد نها(س←1) (س³ + 2س)(س − 4).\nالإجابة النموذجية: 3 × (−3) = −9\n2) [مستوى التطبيق] أوجد نها(س←2) (س² + 5)/(س + 1).\nالإجابة النموذجية: 9/3 = 3\n3) [مستوى الاستدلال] إذا كانت نها د(س) = ك عند س ← 1 و نها 5د(س) = 15، أوجد ك.\nالإجابة النموذجية: ك = 3", "الحصة 1: خواص النهايات الجبرية (الضرب في ثابت، الجمع، الطرح، الضرب، القسمة)\nإرشاد للطالب: حفظ خواص النهايات ص 122، وحل تمارين 3-3 (1) ص 125 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: خاصيتا القوة والجذر والنهايات الخاصة\nإرشاد للطالب: حل تمارين 3-3 (2، 3) ص 125 من كتاب الطالب، وتمارين 3-3 (1، 2) ص 73 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: تمارين خواص النهايات ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 3-3 ص ⁦74–75⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=17"]}, {"id": "4-3", "title": "الاتصال", "unit": "الوحدة الثالثة: مقدمة في النهايات والاتصال", "sbp": "⁦127–136⁩", "wbp": "⁦76–84⁩", "p": [{"t": "شروط اتصال الدالة عند نقطة", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يذكر الشروط الثلاثة لاتصال الدالة عند س = أ (نتيجة 4) (25 دقيقة)\n2) يحكم على اتصال دالة عند نقطة بالتحقق من الشروط الثلاثة (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تحليل", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: برنامج GeoGebra", "الاتصال، عدم الاتصال، د(أ) موجودة، النهاية موجودة، النهاية = د(أ)", "سؤال: «متى نقول إن مسارًا متصل؟ هل يمكن رسم منحنى متصل دون رفع القلم؟»", "1. التهيئة: يطرح المعلم السؤال ويربطه بالرسم دون رفع القلم، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يعرض المعلم نتيجة 4 ص 127 ويطبقها على منحنيات، والطلبة يدون الشروط (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 13 ص 128، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يعطي المعلم منحنيات لتحديد الشرط المختل عند نقاط معينة، وتحدد المجموعات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] اذكر الشروط الثلاثة لاتصال د(س) عند س = أ.\nالإجابة النموذجية: د(أ) موجودة، نها(س←أ) د(س) موجودة، النهاية = د(أ)\n2) [مستوى التطبيق] هل الدالة (س² − 1)/(س − 1) متصلة عند س = 1؟ ولماذا؟\nالإجابة النموذجية: لا؛ لأن د(1) غير معرّفة\n3) [مستوى الاستدلال] دالة نهايتها عند 2 تساوي 5 و د(2) = 3. هل هي متصلة عند 2؟\nالإجابة النموذجية: لا؛ النهاية ≠ قيمة الدالة", "1) [مستوى المعرفة] أي شرط يختل في منحنى به فجوة عند س = 3 مع عدم تعريف الدالة عند 3؟\nالإجابة النموذجية: الشرط الأول: د(3) غير موجودة\n2) [مستوى التطبيق] هل د(س) = س² + 2 متصلة عند س = 1؟\nالإجابة النموذجية: نعم: د(1) = 3 = النهاية\n3) [مستوى الاستدلال] أي شرط يختل عند وجود قفزة؟\nالإجابة النموذجية: الشرط الثاني: النهاية غير موجودة", "إرشاد للطالب: حفظ نتيجة 4 ص 127، ومراجعة مثال 13 ص 128.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18"]}, {"t": "أنواع عدم الاتصال من التمثيل البياني", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يميز أنواع عدم الاتصال: الفجوة (القابل للإزالة)، القفزة، خط التقارب الرأسي (25 دقيقة)\n2) يحدد من التمثيل البياني النقاط التي تكون الدالة عندها غير متصلة ويبرر (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: بطاقات عمل", "عدم الاتصال القابل للإزالة، القفزة، عدم الاتصال اللانهائي", "لعبة «صنّف المنحنى»: بطاقات منحنيات توزع على المجموعات لتصنيفها.", "1. التهيئة: يوزع المعلم البطاقات، ويصنف الطالب أوليًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يشرح المعلم أنواع عدم الاتصال ص 129 بأمثلة، والطلبة يدون (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 4-3: 1، 2 ص 130، وتحل المجموعات (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. فردي: تمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما نوع عدم الاتصال في منحنى (س² − 4)/(س − 2) عند س = 2؟\nالإجابة النموذجية: فجوة (قابل للإزالة)\n2) [مستوى التطبيق] ما نوع عدم الاتصال في منحنى 1/س عند س = 0؟\nالإجابة النموذجية: عدم اتصال لانهائي (خط تقارب رأسي)\n3) [مستوى الاستدلال] كيف يمكن إزالة عدم الاتصال في (س² − 4)/(س − 2) عند 2؟\nالإجابة النموذجية: بتعريف د(2) = 4", "1) [مستوى المعرفة] ما نوع عدم الاتصال عند قفزة من 1 إلى 3؟\nالإجابة النموذجية: قفزة (غير قابل للإزالة)\n2) [مستوى التطبيق] هل يمكن إزالة عدم اتصال القفزة بإعادة تعريف نقطة واحدة؟\nالإجابة النموذجية: لا؛ لأن النهاية غير موجودة\n3) [مستوى الاستدلال] حدد نقاط عدم الاتصال لـ د(س) = 1/((س − 1)(س + 2)).\nالإجابة النموذجية: س = 1، س = −2", "إرشاد للطالب: حل تمارين 4-3 (1، 2) ص 130 من كتاب الطالب، وتمارين 4-3 (1، 2) ص ⁦76–77⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18"]}, {"t": "اتصال كثيرات الحدود والدوال النسبية", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يستنتج أن كثيرات الحدود متصلة على مجموعة الأعداد الحقيقية (20 دقيقة)\n2) يحدد نقاط عدم اتصال الدوال النسبية (أصفار المقام) (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "اتصال كثيرات الحدود، أصفار المقام، مجال الدالة النسبية", "سؤال: «هل رأيت منحنى كثيرة حدود فيه قفزة أو فجوة؟»", "1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. النمذجة: يستنتج المعلم اتصال كثيرات الحدود ويحدد نقاط عدم اتصال دوال نسبية، ويتابع الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تشاركي: يكلف الأزواج بتمارين 4-3: 3، 4 ص 131، ويحل الطالب ويتبادل (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n4. فردي: تمارين 4-3 (3) ص 78 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] هل د(س) = س³ − 5س + 2 متصلة عند جميع الأعداد الحقيقية؟\nالإجابة النموذجية: نعم؛ كثيرة حدود\n2) [مستوى التطبيق] حدد نقاط عدم اتصال د(س) = (س + 1)/(س² − 9).\nالإجابة النموذجية: س = 3، س = −3\n3) [مستوى الاستدلال] هل د(س) = (س + 2)/(س² + 4) متصلة على ح؟ برر.\nالإجابة النموذجية: نعم؛ لأن المقام لا يساوي صفرًا أبدًا", "1) [مستوى المعرفة] حدد نقطة عدم اتصال د(س) = 5/(س − 4).\nالإجابة النموذجية: س = 4\n2) [مستوى التطبيق] هل د(س) = س² − 7 متصلة عند س = 10؟\nالإجابة النموذجية: نعم\n3) [مستوى الاستدلال] حدد نقاط عدم اتصال د(س) = (س − 1)/(س² − 3س + 2).\nالإجابة النموذجية: س = 1، س = 2", "إرشاد للطالب: حل تمارين 4-3 (3، 4) ص 131 من كتاب الطالب، وتمرين 4-3 (3) ص 78 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=18"]}, {"t": "اتصال الدالة المعرّفة بأكثر من قاعدة وإيجاد ثابت يجعلها متصلة", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يبحث اتصال دالة معرّفة بأكثر من قاعدة عند نقطة تغير القاعدة (25 دقيقة)\n2) يجد قيمة ثابت مجهول يجعل الدالة متصلة (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام", "اتصال الدالة المتعددة القواعد، نقطة التغير، الثابت المجهول", "سؤال: «ما الفرق بين شرط وجود النهاية وشرط الاتصال عند نقطة تغير القاعدة؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: الاتصال يضيف شرط تساوي النهاية مع د(أ) (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مسألتين على بحث الاتصال وإيجاد ثابت، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: ا
