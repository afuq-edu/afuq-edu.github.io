ر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة أمثلة ⁦3–5⁩ ص ⁦146–147⁩، وحل تمارين 2-4 (⁦2–10⁩) ص ⁦149–150⁩ من كتاب الطالب، وتمارين 2-4 (⁦1–3⁩) ص 87 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=20\n\nالحصة 2: المشتقة الثانية ومسابقة الختام\nإرشاد للطالب: حل تمارين 2-4 (⁦11–26⁩) ص ⁦150–151⁩ حسب توجيه المعلم، وتمارين 2-4 ص ⁦88–90⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=20"]}, {"id": "3-4", "title": "قاعدة السلسلة", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦152–158⁩", "wbp": "⁦91–92⁩", "p": [{"t": "قاعدة السلسلة لمشتقة (أس + ب)ⁿ + قاعدة السلسلة مع الجذور والكسور والدوال غير الخطية", "w": "الأسبوع الثالث عشر (⁦29/11–3/12/2026⁩م)", "f": ["1) يطبق قاعدة السلسلة دص/دس = دص/دع × دع/دس لاشتقاق دوال مركبة (15 دقيقة)\n2) يشتق دوالًا على الصورة (أس + ب)ⁿ مباشرة (10 دقائق)\n3) يشتق دوالًا مثل √(2س − 1) و 1/(س² + 1) و (س² − 4)³ باستخدام قاعدة السلسلة (10 دقائق)\n4) يجد الميل عند نقطة لدالة مركبة (أمثلة ⁦10–12⁩) (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام", "الدالة المركبة، الدالة الداخلية، الدالة الخارجية، قاعدة السلسلة، الأس الكسري، الأس السالب، الدالة الداخلية غير الخطية", "سؤال: «هل نفك (3س + 1)⁵ لنشتقها؟ ما أقصر طريق؟»", "1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب صعوبة الفك (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يقدم المعلم قاعدة السلسلة ص 152 ويحل مثالي 8، 9، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تعاوني: يكلف المعلم بتمارين 3-4: 1 ص 157، وتحل المجموعات (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. فردي: تمارين 3-4 (1) ية: 15(3س + 1)⁴\n2) [مستوى التطبيق] أوجد مشتقة ص = (2س − 7)³.\nالإجابة النموذجية: 6(2س − 7)²\n3) [مستوى الاستدلال] أوجد مشتقة ص = (5 − س)⁴.\nالإجابة النموذجية: −4(5 − س)³\n\n4) [مستوى المعرفة] أوجد مشتقة ص = √(2س − 1).\nالإجابة النموذجية: 1/√(2س − 1)\n5) [مستوى التطبيق] أوجد مشتقة ص = 1/(س² + 1).\nالإجابة النموذجية: −2س/(س² + 1)²\n6) [مستوى الاستدلال] أوجد مشتقة ص = (س² − 4)³.\nالإجابة النموذجية: 6س(س² − 4)²\n\nالحصة 2: تطبيقات قاعدة السلسلة ومسابقة الختام\n1) [مستوى المعرفة] إذا كان ميل ص = (أس + 1)² عند س = 0 يساوي 6، أوجد أ.\nالإجابة النموذجية: أ = 3\n2) [مستوى التطبيق] أوجد النقطة على ص = (2س − 3)² التي ميلها صفر.\nالإجابة النموذجية: س = 1.5 ← (1.5، 0)\n3) [مستوى الاستدلال] أوجد مشتقة ص = (س³ + 2س)⁴.\nالإجابة النموذجية: 4(س³ + 2س)³(3س² + 2)", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\n1) [مستوى المعرفة] حدد الدالة الداخلية في ص = (4س + 3)⁶.\nالإجابة النموذجية: ع = 4س + 3\n2) [مستوى التطبيق] أوجد مشتقة ص = (س + 1)⁸.\nالإجابة النموذجية: 8(س + 1)⁷\n3) [مستوى الاستدلال] أوجد مشتقة ص = 2(3س − 1)⁴.\nالإجابة النموذجية: 24(3س − 1)³\n\n4) [مستوى المعرفة] أوجد مشتقة ص = √(س + 5).\nالإجابة النموذجية: 1/(2√(س + 5))\n5) [مستوى التطبيق] أوجد ميل ص = (س² + 1)³ عند س = 1.\nالإجابة النموذجية: 3(2)²(2) = 24\n6) [مستوى الاستدلال] أوجد مشتقة ص = 4/(3س − 2)².\nالإجابة النموذجية: −24/(3س − 2)³\n\nالحصة 2: تطبيقات قاعدة السلسلة ومسابقة الختام\n1) [مستوى المعرفة] أوجد مشتقة ص = (1 − 2س)⁵.\nالإجابة النموذجية: −10(1 − 2س)⁴\n2) [مستوى التطبيق] أوجد ميل ص = √(4س + 1) عند س = 2.\nالإجابة النموذجية: 2/√(4س + 1) = 2/3\n3) [مستوى الاستدلال] أوجد مشتقة ص = 1/√(س² + 9).\nالإجابة النموذجية: −س/(س² + 9)^(3/2)", "الحصة 1: قاعدة السلسلة لمشتقة (أس + ب)ⁿ\nإرشاد للطالب: مراجعة مثالي 8، 9 ص ⁦152–153⁩، وحل تمارين 3-4 (1) ص 157 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة أمثلة ⁦10–12⁩ ص ⁦154–156⁩، وحل تمارين 3-4 (⁦2–8⁩) ص 157 من كتاب الطالب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=21\n\nالحصة 2: تطبيقات قاعدة السلسلة ومسابقة الختام\nإرشاد للطالب: حل تمارين 3-4 (⁦9–12⁩) ص ⁦157–158⁩ من كتاب الطالب، وتمارين 3-4 ص ⁦91–92⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=21"]}, {"id": "4-4", "title": "المماس والعمودي", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦159–163⁩", "wbp": "⁦93–94⁩", "p": [{"t": "معادلة المماس لمنحنى عند نقطة + معادلة العمودي على المماس", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يجد معادلة المماس لمنحنى عند نقطة معلومة باستخدام المشتقة (15 دقيقة)\n2) يجد إحداثي النقطة عندما يكون المعطى قيمة س فقط (10 دقائق)\n3) يجد ميل العمودي بوصفه سالب مقلوب ميل المماس (10 دقائق)\n4) يجد معادلة العمودي لمنحنى عند نقطة (مثال 15) (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، الأقلام", "المماس، ميل المماس = دص/دس عند النقطة، ص − ص₁ = م(س − س₁)، العمودي (المستقيم العمودي على المماس)، م₁ × م₂ = −1", "مراجعة معادلة المستقيم بمعلومية الميل ونقطة من «اختبر مهاراتك» ص 138.", "1. التهيئة: يراجع المعلم المعادلة، ويكتب الطالب معادلة مستقيم (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 14 ص ⁦159–160⁩، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 4-4: 1، 2 ص 161، وتحل المجموعات (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحقق رقمي: يعرض المعلم المماسات في GeoGebra للتحقق، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. النمذجة: يحل المعلم مثال 15 ص 160، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تشاركي: يكلف الأزواج بتمارين 4-4: ⁦3–7⁩ ص 161، ويحل الطالب ويتبادل (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. فردي: تمارين 4-4 (⁦1–4⁩) ص 93 من كتاب النشاط، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد ميل المماس لمنحنى ص = س² + 1 عند (1، 2).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد معادلة المماس عند (1، 2).\nالإجابة النموذجية: ص = 2س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س³ − 2س عند س = 2.\nالإجابة النموذجية: ص = 4، الميل 10 ← ص = 10س − 16\n\n4) [مستوى المعرفة] إذا كان ميل المماس 4، فما ميل العمودي؟\nالإجابة النموذجية: −1/4\n5) [مستوى التطبيق] أوجد معادلة العمودي لـ ص = س² + 1 عند (1، 2).\nالإجابة النموذجية: ص − 2 = −½(س − 1) ← ص = −½ س + 5/2\n6) [مستوى الاستدلال] أوجد معادلة العمودي لـ ص = س³ − 2س عند (2، 4).\nالإجابة النموذجية: الميل −1/10 ← ص = −0.1س + 4.2", "1) [مستوى المعرفة] أوجد ميل المماس لـ ص = 3س² عند س = 1.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: الميل 1/4 ← ص = ¼ س + 1\n\n4) [مستوى المعرفة] ما ميل العمودي إذا كان ميل المماس −3؟\nالإجابة النموذجية: 1/3\n5) [مستوى التطبيق] أوجد معادلة العمودي لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = −(1/6)س + 19/6\n6) [مستوى الاستدلال] لماذا لا يمكن إيجاد ميل العمودي بالقسمة إذا كان ميل المماس صفرًا؟ وما معادلته؟\nالإجابة النموذجية: لأن المماس أفقي فيكون العمودي رأسيًا: س = س₁", "إرشاد للطالب: مراجعة مثال 14 ص ⁦159–160⁩، وحل تمارين 4-4 (1، 2) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة مثال 15 ص 160، وحل تمارين 4-4 (⁦3–7⁩) ص 161 من كتاب الطالب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22"]}, {"t": "مسائل على المماس والعمودي ومسابقة الختام", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يحل مسائل مركبة: نقاط تقاطع المماس أو العمودي مع المحاور أو مع المنحنى (20 دقيقة)\n2) يجد نقطة على المنحنى يكون عندها المماس موازيًا لمستقيم معلوم (20 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التوازي (تساوي الميول)، تقاطع المستقيم مع المحورين، مساحة المثلث المتكون", "سؤال: «متى يكون المماس موازيًا للمستقيم ص = 4س + 1؟»", "1. التهيئة: يطرح المعلم السؤال، ويجيب الطالب: عندما ميله 4 (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بتمارين 4-4: ⁦8–14⁩ ص 162 موزعة على المجموعات، وتحل المجموعات (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كتاب النشاط: يكمل المعلم تمارين 4-4 ص ⁦93–94⁩، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. بطاقة الخروج: يكتب كل طالب على بطاقة إجابة سؤال «أوجد مساحة المثلث المحصور بين المماس ص = 2س − 1 والمحورين» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (7 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – رصيف المرفأ: يتخيل الطلبة منحنى ساحل عماني ونقطة مرفأ عليه، فتجد كل مجموعة معادلة المماس عند المرفأ ومعادلة العمودي الذي يمثل اتجاه رصيف ممتد إلى البحر، وتعرض حلها على مجموعة مجاورة للتحقق (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] أوجد النقطة على ص = س² التي يكون عندها المماس موازيًا للمستقيم ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] أوجد نقطة تقاطع المماس ص = 2س − 1 مع محور السينات.\nالإجابة النموذجية: (½، 0)\n3) [مستوى الاستدلال] المماس لـ ص = س² عند (1، 1) والعمودي عليه يقطعان محور الصادات. أوجد نقطتي التقاطع.\nالإجابة النموذجية: المماس ص = 2س − 1 ← (0، −1)؛ العمودي ص = −½ س + 3/2 ← (0، 3/2)", "1) [مستوى المعرفة] ميل مماس ص = س² − 2س عند س = 3؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد النقطة على ص = س³ التي يكون المماس عندها موازيًا لـ ص = 3س (س > 0).\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أو ة على ص = س³ التي يكون المماس عندها موازيًا لـ ص = 3س (س > 0).\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أوجد مساحة المثلث المحصور بين المماس ص = 2س − 1 والمحورين.\nالإجابة النموذجية: ½ × ½ × 1 = ¼ وحدة مربعة", "الحصة 1: معادلة المماس لمنحنى عند نقطة\nإرشاد للطالب: مراجعة مثال 14 ص ⁦159–160⁩، وحل تمارين 4-4 (1، 2) ص 161 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة مثال 15 ص 160، وحل تمارين 4-4 (⁦3–7⁩) ص 161 من كتاب الطالب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22\n\nالحصة 2: مسائل على المماس والعمودي ومسابقة الختام\nإرشاد للطالب: حل تمارين 4-4 (⁦8–20⁩) ص ⁦162–163⁩ حسب توجيه المعلم، وتمارين 4-4 ص ⁦93–94⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=22"]}, {"id": "5-4", "title": "الدوال المتزايدة والدوال المتناقصة", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦164–167⁩", "wbp": "⁦95–97⁩", "p": [{"t": "مفهوم الدالة المتزايدة والمتناقصة وعلاقتها بإشارة المشتقة + تحديد فترات التزايد والتناقص", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يعرّف الدالة المتزايدة والمتناقصة من التمثيل البياني (استكشف 2) (10 دقائق)\n2) يربط بين إشارة المشتقة وتزايد الدالة أو تناقصها (10 دقائق)\n3) يجد الفترات التي تكون فيها دالة متزايدة أو متناقصة بحل المتباينة د′(س) > 0 أو < 0 (10 دقائق)\n4) يستخدم جدول الإشارات لتنظيم الحل (مثالا 17، 18) (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، الأقلام", "الدالة المتزايدة، الدالة المتناقصة، د′(س) > 0، د′(س) < 0، فترات التزايد، فترات التناقص، جدول إشارات المشتقة، ال  أعط مثالًا لدالة متناقصة لجميع قيم س.\nالإجابة النموذجية: مثل ص = −2س + 1\n\n4) [مستوى المعرفة] حدد فترة تزايد ص = س² + 4س.\nالإجابة النموذجية: س > −2\n5) [مستوى التطبيق] حدد فترة تناقص ص = 10 + 2س − س².\nالإجابة النموذجية: س > 1\n6) [مستوى الاستدلال] حدد فترات تزايد ص = 2س³ − 6س² .\nالإجابة النموذجية: 6س² − 12س > 0 ← س < 0 أو س > 2\n\nالحصة 2: تطبيقات على التزايد والتناقص ومسابقة الختام\n1) [مستوى المعرفة] هل ص = س² متزايدة لجميع س؟\nالإجابة النموذجية: لا؛ متناقصة عندما س < 0\n2) [مستوى التطبيق] حدد فترة تزايد ص = (س − 3)².\nالإجابة النموذجية: س > 3\n3) [مستوى الاستدلال] هل ص = 1/س متناقصة لكل س > 0؟ برر.\nالإجابة النموذجية: نعم؛ دص/دس = −1/س² < 0", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة وعلاقتها بإشارة المشتقة\nإرشاد للطالب: مراجعة استكشف 2 ومثال 16 ص ⁦164–165⁩، وحل تمارين 5-4 (1، 2) ص 167 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: مراجعة مثالي 17، 18 ص 166، وحل تمارين 5-4 (⁦3–6⁩) ص 167 من كتاب الطالب، وتمارين 5-4 (⁦1–3⁩) ص 95 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=23\n\nالحصة 2: تطبيقات على التزايد والتناقص ومسابقة الختام\nإرشاد للطالب: حل تمارين 5-4 (⁦7–9⁩) ص 167 من كتاب الطالب، وتمارين 5-4 ص ⁦95–97⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=23"]}, {"id": "6-4", "title": "النقاط الحرجة", "unit": "الوحدة الرابعة: التفاضل", "sbp": "⁦168–180⁩", "wbp": "⁦98–107⁩", "p": [{"t": "تعريف النقطة الحرجة وأنواعها + تحديد نوع النقطة الحرجة باختبار المشتقة الأولى", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يعرّف النقطة الحرجة بأنها نقطة تكون فيها دص/دس = 0 (15 دقيقة)\n2) يميز بين النقطة العظمى والصغرى ونقطة الانعطاف الأفقية من التمثيل البياني (5 دقائق)\n3) يحدد نوع النقطة الحرجة بدراسة تغير إشارة دص/دس قبلها وبعدها (10 دقائق)\n4) ينظم الحل في جدول إشارات (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، الأقلام", "النقطة الحرجة (نقطة التحول)، النقطة العظمى المحلية، النقطة الصغرى المحلية، نقطة الانعطاف، اختبار المشتقة الأولى، تغير الإشارة من + إلى − (عظمى)، من − إلى + (صغرى)، دون تغير (انعطاف)", "يعرض المعلم منحنى ص 168 ويسأل: «أين يكون المماس أفقيًا؟ وما الذي يحدث للمنحنى قبل تلك النقاط وبعدها؟»", "1. التهيئة: يعرض المعلم المنحنى، ويحدد الطالب النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يشرح المعلم تعريف النقطة الحرجة وأنواعها ص ⁦168–169⁩، والطلبة يدون (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 19 ص ⁦169–170⁩ (إيجاد النقاط الحرجة)، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بإيجاد النقاط الحرجة لـ ص = س² − 4س + 1 و ص = س³ − 3س، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. النمذجة: يطبق المعلم اختبار المشتقة الأولى على ص = س³ − 3س و ص = س³، ويتابع الطالب ويكمل جدول الإشارات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تشاركي: يكلف الأزواج بتمارين 6-4: 1، 2 ص 174، ويحل الطالب ويتبادل (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. فردي: تمارين 6-4 (1، 2) ص 98 من كتاب النشاط، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما قيمة دص/دس عند النقطة الحرجة؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = س² − 4س + 1.\nالإجابة النموذجية: س = 2 ← (2، −3)\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 3س.\nالإجابة النموذجية: س = ±1 ← (1، −2)، (−1، 2)\n\n4) [مستوى المعرفة] تغيرت إشارة المشتقة من سالبة إلى موجبة عند النقطة الحرجة. ما نوعها؟\nالإجابة النموذجية: صغرى\n5) [مستوى التطبيق] حدد نوع النقطة (−1، 2) على ص = س³ − 3س.\nالإجابة النموذجية: عظمى (الإشارة + ثم −)\n6) [مستوى الاستدلال] حدد نوع النقطة (0، 0) على ص = س³.\nالإجابة النموذجية: نقطة انعطاف (المشتقة موجبة قبلها وبعدها)", "1) [مستوى المعرفة] ما شكل المماس عند النقطة الحرجة؟\nالإجابة النموذجية: أفقي\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 3 + 2س − س².\nالإجابة النموذجية: (1، 4)\n3) [مستوى الاستدلال] أوجد النقطة الحرجة لـ ص = س³.\nالإجابة النموذجية: (0، 0)\n\n4) [مستوى المعرفة] ما نوع النقطة (2، −3) على ص = س² − 4س + 1؟\nالإجابة النموذجية: صغرى\n5) [مستوى التطبيق] ما نوع النقطة (1، 4) على ص = 3 + 2س − س²؟\nالإجابة النموذجية: عظمى\n6) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 12س وحدد نوعها.\nالإجابة النموذجية: (2، −16) صغرى، (−2، 16) عظمى", "إرشاد للطالب: مراجعة ص ⁦168–170⁩ ومثال 19، وحل تمارين 6-4 (1) ص 174 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 6-4 (1، 2) ص 174 من كتاب الطالب، وتمارين 6-4 (1، 2) ص 98 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}, {"t": "تحديد نوع النقطة الحرجة باختبار المشتقة الثانية", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحدد نوع النقطة الحرجة باستخدام إشارة د²ص/دس² (مثال 20) (25 دقيقة)\n2) يدرك حالة فشل الاختبار عندما تكون المشتقة الثانية صفرًا (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام", "اختبار المشتقة الثانية، د²ص/دس² < 0 عظمى، > 0 صغرى، = 0 الاختبار غير حاسم", "سؤال: «هل يمكن تحديد النوع دون رسم جدول إشارات؟»", "1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 20 ص 172 (ص = س + 9/س)، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 6-4: ⁦3–6⁩ ص ⁦174–175⁩، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: تمارين 6-4 (3، 4) ص 99 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] إذا كانت د²ص/دس² < 0 عند النقطة الحرجة، فما نوعها؟\nالإجابة النموذجية: عظمى\n2) [مستوى التطبيق] أوجد النقاط الحرجة لـ ص = س + 9/س.\nالإجابة النموذجية: (3، 6)، (−3، −6)\n3) [مستوى الاستدلال] حدد نوعها باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 18/س³: عند 3 موجبة ← صغرى؛ عند −3 سالبة ← عظمى", "1) [مستوى المعرفة] حدد نوع النقطة الحرجة لـ ص = 2س² − 8س باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 4 > 0 ← صغرى عند (2، −8)\n2) [مستوى التطبيق] أوجد د²ص/دس² لـ ص = س⁴ عند س = 0. ماذا تستنتج؟\nالإجابة النموذجية: صفر؛ الاختبار غير حاسم\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = 2س³ − 3س² وحدد نوعها.\nالإجابة النموذجية: (0، 0) عظمى، (1، −1) صغرى", "إرشاد للطالب: مراجعة مثال 20 ص 172، وحل تمارين 6-4 (⁦3–6⁩) ص ⁦174–175⁩ من كتاب الطالب، وتمارين 6-4 (3، 4) ص 99 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}, {"t": "مسائل تطبيقية على القيم العظمى والصغرى", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) ينمذج موقفًا حياتيًا بدالة في متغير واحد ويجد قيمتها العظمى أو الصغرى (مثال 21) (25 دقيقة)\n2) يتحقق من نوع القيمة ومعقولية الحل (15 دقيقة)", "المخرج 1: إبداع\nالمخرج 2: تقييم", "التعلم المبني على حل المشكلات، التعلم المبني على المشاريع، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: ورق مقوى ومقص", "النمذجة، القيمة العظمى، القيمة الصغرى، القيود", "مسألة عملية: من ورق مقوى مربع طول ضلعه 12 سم يُقص مربع صغير من كل ركن لصنع صندوق. ما طول القص الذي يعطي أكبر حجم؟", "1. التهيئة: يعرض المعلم المسألة ويصنع نموذجًا، ويتوقع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 2 دقائق)\n3) يحدد نوع النقطة الحرجة بدراسة تغير إشارة دص/دس قبلها وبعدها (10 دقائق)\n4) ينظم الحل في جدول إشارات (10 دقائق)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) يحدد نوع النقطة الحرجة باستخدام إشارة د²ص/دس² (مثال 20) (25 دقيقة)\n2) يدرك حالة فشل الاختبار عندما تكون المشتقة الثانية صفرًا (15 دقيقة)\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\n1) ينمذج موقفًا حياتيًا بدالة في متغير واحد ويجد قيمتها العظمى أو الصغرى (مثال 21) (25 دقيقة)\n2) يتحقق من نوع القيمة ومعقولية الحل (15 دقيقة)\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) يراجع مهارات الوحدة الرابعة: الاشتقاق، قاعدة السلسلة، المماس والعمودي، التزايد والتناقص، النقاط الحرجة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) يطبق مهارات الوحدة الرابعة في تمارين كتاب النشاط (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي ويحترم دوره (20 دقيقة)", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nالمخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\nالمخرج 1: إبداع\nالمخرج 2: تقييم\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\nالتعلم المبني على حل المشكلات، التعلم المبني على المشاريع، التعلم التعاوني\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\nالتعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nالكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، أخرى: ورق مقوى ومقص\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nالنقطة الحرجة (نقطة التحول)، النقطة العظمى المحلية، النقطة الصغرى المحلية، نقطة الانعطاف، اختبار المشتقة الأولى، تغير الإشارة من + إلى − (عظمى)، من − إلى + (صغرى)، دون تغير (انعطاف)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nاختبار المشتقة الثانية، د²ص/دس² < 0 عظمى، > 0 صغرى، = 0 الاختبار غير حاسم\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\nالنمذجة، القيمة العظمى، القيمة الصغرى، القيود\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\nمفاهيم الوحدة الرابعة\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nالتفاضل وتطبيقاته", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nيعرض المعلم منحنى ص 168 ويسأل: «أين يكون المماس أفقيًا؟ وما الذي يحدث للمنحنى قبل تلك النقاط وبعدها؟»\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nسؤال: «هل يمكن تحديد النوع دون رسم جدول إشارات؟»\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\nمسألة عملية: من ورق مقوى مربع طول ضلعه 12 سم يُقص مربع صغير من كل ركن لصنع صندوق. ما طول القص الذي يعطي أكبر حجم؟\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\nيقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الرابعة ص 177.\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nسؤال «صحح الخطأ»: كتب طالب مشتقة (3س + 2)⁴ = 4(3س + 2)³. ما الخطأ؟", "الحصة 1: تعريف النقطة الحرجة وأنواعها — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم المنحنى، ويحدد الطالب النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. بناء المفهوم: يشرح المعلم تعريف النقطة الحرجة وأنواعها ص ⁦168–169⁩، والطلبة يدون (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يحل المعلم مثال 19 ص ⁦169–170⁩ (إيجاد النقاط الحرجة)، ويتابع الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تعاوني: يكلف المعلم بإيجاد النقاط الحرجة لـ ص = س² − 4س + 1 و ص = س³ − 3س، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. النمذجة: يطبق المعلم اختبار المشتقة الأولى على ص = س³ − 3س و ص = س³، ويتابع الطالب ويكمل جدول الإشارات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تشاركي: يكلف الأزواج بتمارين 6-4: 1، 2 ص 174، ويحل الطالب ويتبادل (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. فردي: تمارين 6-4 (1، 2) ص 98 من كتاب النشاط، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الختام: أسئلة الختام، ويجيب الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية — زمن الحصة 40 دقيقة\n1. التهيئة: يطرح المعلم السؤال، ويناقش الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم مثال 20 ص 172 (ص = س + 9/س)، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يكلف المعلم بتمارين 6-4: ⁦3–6⁩ ص ⁦174–175⁩، وتحل المجموعات (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فردي: تمارين 6-4 (3، 4) ص 99 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم المسألة ويصنع نموذجًا، ويتوقع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. النمذجة: يحل المعلم مثال 21 ص 173، ويتابع الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. مشروع مصغر تعاوني: تحل كل مجموعة مسألة: الصندوق، السياج بثلاثة جوانب (40 م)، السلك (24 سم)، وتبني الدالة وتشتقها وتجد القيمة (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. عرض: تعرض كل مجموعة نتيجتها، ويعرض الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب) — زمن الحصة 40 دقيقة\n1. التهيئة: يوزع المعلم قائمة التحقق، ويقيّم الطالب نفسه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مراجعة مركزة: يبني المعلم مع الطلبة خريطة مفاهيم للوحدة، ويكمل الطالب الخريطة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦178–180⁩ حسب المستوى، ويحل الطالب حسب مستواه (17 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: أسئلة الختام، ويجيب الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام — زمن الحصة 40 دقيقة\n1. التهيئة: يعرض المعلم الخطأ، ويصححه الطالب: 12(3س + 2)³ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تدريب كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الرابعة ص ⁦102–107⁩ من كتاب النشاط، ويحل الطالب ويناقش (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يعرض المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. بطاقة الخروج: يكتب كل طالب على بطاقة إجابة سؤال «أوجد د²ص/دس² إذا كانت ص = س³ + 2س» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (9 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – قمم عمان وأوديتها: ترسم كل مجموعة منحنى لمسار رحلة يمر بقمة جبلية ووادٍ في عمان، وتحدد النقاط الحرجة حيث دص/دس = 0 وتصنفها إلى عظمى وصغرى وانعطاف أفقي، ثم تذكر ولاية عمانية تشتهر بجبالها أو أوديتها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) [مستوى المعرفة] ما قيمة دص/دس عند النقطة الحرجة؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = س² − 4س + 1.\nالإجابة النموذجية: س = 2 ← (2، −3)\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 3س.\nالإجابة النموذجية: س = ±1 ← (1، −2)، (−1، 2)\n\n4) [مستوى المعرفة] تغيرت إشارة المشتقة من سالبة إلى موجبة عند النقطة الحرجة. ما نوعها؟\nالإجابة النموذجية: صغرى\n5) [مستوى التطبيق] حدد نوع النقطة (−1، 2) على ص = س³ − 3س.\nالإجابة النموذجية: عظمى (الإشارة + ثم −)\n6) [مستوى الاستدلال] حدد نوع النقطة (0، 0) على ص = س³.\nالإجابة النموذجية: نقطة انعطاف (المشتقة موجبة قبلها وبعدها)\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) [مستوى المعرفة] إذا كانت د²ص/دس² < 0 عند النقطة الحرجة، فما نوعها؟\nالإجابة النموذجية: عظمى\n2) [مستوى التطبيق] أوجد النقاط الحرجة لـ ص = س + 9/س.\nالإجابة النموذجية: (3، 6)، (−3، −6)\n3) [مستوى الاستدلال] حدد نوعها باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 18/س³: عند 3 موجبة ← صغرى؛ عند −3 سالبة ← عظمى\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\n1) [مستوى المعرفة] سياج طوله 40 م لثلاثة جوانب من حظيرة مستطيلة بجانب جدار. اكتب المساحة بدلالة عرضها س.\nالإجابة النموذجية: م = س(40 − 2س)\n2) [مستوى التطبيق] أوجد س التي تجعل المساحة أكبر ما يمكن.\nالإجابة النموذجية: 40 − 4س = 0 ← س = 10 م، م = 200 م²\n3) [مستوى الاستدلال] في مسألة الصندوق (12 سم)، الحجم ح = س(12 − 2س)². أوجد س التي تجعل الحجم أكبر ما يمكن.\nالإجابة النموذجية: دح/دس = (12 − 2س)(12 − 6س) = 0 ← س = 2 سم (س = 6 مرفوض)، ح = 128 سم³\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) [مستوى المعرفة] أوجد دص/دس إذا كانت ص = 3س⁴ − 2/س.\nالإجابة النموذجية: 12س³ + 2/س²\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = (2س − 1)³ عند س = 1.\nالإجابة النموذجية: ص = 1، الميل 6(1)² = 6 ← ص = 6س − 5\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 6س² + 9س وحدد نوعها.\nالإجابة النموذجية: (1، 4) عظمى، (3، 0) صغرى\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) [مستوى المعرفة] أوجد مشتقة ص = (3س + 2)⁴.\nالإجابة النموذجية: 12(3س + 2)³\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 4س − س² وحدد نوعها.\nالإجابة النموذجية: (2، 4) عظمى\n3) [مستوى الاستدلال] أوجد قيمة ك إذا كان لمنحنى ص = س² + ك س نقطة حرجة عند س = 3.\nالإجابة النموذجية: 2(3) + ك = 0 ← ك = −6", "الحصة 1: تعريف النقطة الحرجة وأنواعها\n1) [مستوى المعرفة] ما شكل المماس عند النقطة الحرجة؟\nالإجابة النموذجية: أفقي\n2) [مستوى التطبيق] أوجد النقطة الحرجة لـ ص = 3 + 2س − س².\nالإجابة النموذجية: (1، 4)\n3) [مستوى الاستدلال] أوجد النقطة الحرجة لـ ص = س³.\nالإجابة النموذجية: (0، 0)\n\n4) [مستوى المعرفة] ما نوع النقطة (2، −3) على ص = س² − 4س + 1؟\nالإجابة النموذجية: صغرى\n5) [مستوى التطبيق] ما نوع النقطة (1، 4) على ص = 3 + 2س − س²؟\nالإجابة النموذجية: عظمى\n6) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = س³ − 12س وحدد نوعها.\nالإجابة النموذجية: (2، −16) صغرى، (−2، 16) عظمى\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\n1) [مستوى المعرفة] حدد نوع النقطة الحرجة لـ ص = 2س² − 8س باختبار المشتقة الثانية.\nالإجابة النموذجية: د²ص/دس² = 4 > 0 ← صغرى عند (2، −8)\n2) [مستوى التطبيق] أوجد د²ص/دس² لـ ص = س⁴ عند س = 0. ماذا تستنتج؟\nالإجابة النموذجية: صفر؛ الاختبار غير حاسم\n3) [مستوى الاستدلال] أوجد النقاط الحرجة لـ ص = 2س³ − 3س² وحدد نوعها.\nالإجابة النموذجية: (0، 0) عظمى، (1، −1) صغرى\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\n1) [مستوى المعرفة] سلك طوله 24 سم شُكّل مستطيلًا. اكتب مساحته بدلالة طوله س.\nالإجابة النموذجية: م = س(12 − س)\n2) [مستوى التطبيق] أوجد أكبر مساحة ممكنة للمستطيل.\nالإجابة النموذجية: س = 6 ← م = 36 سم²\n3) [مستوى الاستدلال] عددان مجموعهما 20. أوجد أكبر قيمة لحاصل ضربهما.\nالإجابة النموذجية: س(20 − س) ← س = 10 ← 100\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\n1) [مستوى المعرفة] أوجد مشتقة ص = (س² + 1)⁴.\nالإجابة النموذجية: 8س(س² + 1)³\n2) [مستوى التطبيق] حدد فترة تناقص ص = س² − 8س.\nالإجابة النموذجية: س < 4\n3) [مستوى الاستدلال] أوجد معادلة العمودي لـ ص = س² عند (2، 4).\nالإجابة النموذجية: ص = −¼ س + 4.5\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\n1) [مستوى المعرفة] أوجد د²ص/دس² إذا كانت ص = س³ + 2س.\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد ميل ص = √(س² + 9) عند س = 4.\nالإجابة النموذجية: س/√(س² + 9) = 4/5\n3) [مستوى الاستدلال] أوجد أصغر قيمة لـ ص = س² − 10س + 30.\nالإجابة النموذجية: عند س = 5 ← ص = 5", "الحصة 1: تعريف النقطة الحرجة وأنواعها\nإرشاد للطالب: مراجعة ص ⁦168–170⁩ ومثال 19، وحل تمارين 6-4 (1) ص 174 من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 6-4 (1، 2) ص 174 من كتاب الطالب، وتمارين 6-4 (1، 2) ص 98 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24\n\nالحصة 2: تحديد نوع النقطة الحرجة باختبار المشتقة الثانية\nإرشاد للطالب: مراجعة مثال 20 ص 172، وحل تمارين 6-4 (⁦3–6⁩) ص ⁦174–175⁩ من كتاب الطالب، وتمارين 6-4 (3، 4) ص 99 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24\n\nالحصة 3: مسائل تطبيقية على القيم العظمى والصغرى\nإرشاد للطالب: مراجعة مثال 21 ص 173، وحل تمارين 6-4 (⁦7–13⁩) ص ⁦175–176⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24\n\nالحصة 4: مراجعة الوحدة الرابعة (كتاب الطالب)\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الرابعة ص ⁦178–180⁩ من كتاب الطالب.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24\n\nالحصة 5: مراجعة الوحدة الرابعة (كتاب النشاط) ومسابقة الختام\nإرشاد للطالب: إكمال تمارين المراجعة في كتاب النشاط ص ⁦102–107⁩، والاستعداد للاختبار القصير والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/advmath/?l=24"]}]);
const TINT=["#eaf3fb","#eef7ef","#fbf3e6","#f3eefa","#e9f6f6","#fdf0ef","#eef1fb","#f1f8e9","#fff6e0","#f0f4f8"];
let mode='s',li=0,pi=0;
const $=s=>document.querySelector(s);
const les=$('#les');
D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' '+l.title;les.appendChild(o)});
les.onchange=()=>{li=+les.value;pi=0;render()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));render()});
function copyText(t,btn,box){
  const ok=()=>{btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
    if(r)ok();else{const rg=document.createRange();rg.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(rg);box.parentNode.querySelector('.hint').style.display='block'}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fallback)}else fallback();
}
function render(){
  const L=D[li];
  $('#now').textContent=mode==='s'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='s'){L.p.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+(i+1)+': '+p.t;if(i===pi)b.className='on';b.onclick=()=>{pi=i;render()};tabs.appendChild(b)})}
  const texts=mode==='s'?L.p[pi].f:L.c;
  $('#meta').innerHTML=`<b>${L.id} ${L.title}</b> — ${L.unit}<br>`+(mode==='s'?`الحصة ${pi+1} من ${L.p.length} — ${L.p[pi].w}`:`عدد الحصص: ${L.p.length}`)+` — كتاب الطالب ص ${L.sbp}، كتاب النشاط ص ${L.wbp}`;
  const box=$('#cards');box.innerHTML='';
  FIELDS.forEach((f,k)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="ch" style="background:${TINT[k]}"><h3><span>${k+1}</span>${f}</h3><button class="cp">نسخ</button></div><div class="cb"></div><div class="hint">تعذّر الوصول إلى الحافظة: النص محدد الآن، انسخه يدويًا.</div>`;
    const cb=c.querySelector('.cb');cb.textContent=texts[k];
    c.querySelector('.cp').onclick=e=>copyText(texts[k],e.currentTarget,cb);
    box.appendChild(c)});
}
render();
</script>
