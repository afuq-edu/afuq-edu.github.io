ة مع الكاشف المناسب لكل منها\nإرشاد لولي الأمر: متابعة الابن في إكمال نشاط 1-4"],"h":["<ol class=\"ol\"><li>يرسم منحنيات ‎pH‎ لمعايرة حمض قوي مع قاعدة قوية، وحمض قوي مع قاعدة ضعيفة، وحمض ضعيف مع قاعدة قوية</li><li>يختار الكاشف المناسب لكل معايرة بمقارنة مدى تغير لونه بالجزء الرأسي من المنحنى</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد نقطة التكافؤ و‎pH‎ عندها من منحنى معايرة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يرسم منحنيات ‎pH‎ لمعايرة حمض قوي مع قاعدة قوية، وحمض قوي مع قاعدة ضعيفة، وحمض ضعيف مع قاعدة قوية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يختار الكاشف المناسب لكل معايرة بمقارنة مدى تغير لونه بالجزء الرأسي من المنحنى</td><td class=\"lv\">تقييم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد نقطة التكافؤ و‎pH‎ عندها من منحنى معايرة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>منحنى المعايرة، نقطة التكافؤ، الجزء الرأسي (الانحدار الحاد)، اختيار الكاشف، حمض قوي/قاعدة قوية، حمض ضعيف/قاعدة قوية، حمض قوي/قاعدة ضعيفة.</p>","<p>يعرض المعلم ثلاثة منحنيات معايرة دون عناوين ويسأل: «أي منحنى يمثل إضافة ‎NaOH‎ إلى حمض الإيثانويك؟ وما الدليل؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض المنحنيات ويطرح السؤال</td><td>يقترحون أدلة من ‎pH‎ البدائي ونقطة التكافؤ</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح شكل كل منحنى (‎pH‎ البدائي، الجزء الرأسي، ‎pH‎ عند التكافؤ)</td><td>يرسمون المنحنيات الثلاثة ويعنونونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يوجه حل نشاط 1-4 «الكواشف ومنحنيات المعايرة» (كتاب التجارب ص 28)</td><td>يختارون الكاشف المناسب لكل معايرة ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير سؤالًا مفصليًا عن كاشف غير مناسب ثم التقويم الختامي</td><td>يجيبون ويناقشون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ‎pH‎ عند نقطة التكافؤ لمعايرة حمض قوي مع قاعدة قوية؟</td><td>7.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون ‎pH‎ عند التكافؤ أكبر من 7 في معايرة حمض ضعيف مع قاعدة قوية؟</td><td>لأن الملح الناتج يحتوي القاعدة المرافقة للحمض الضعيف فيكون المحلول قاعديًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يناسب الميثيل البرتقالي معايرة ‎CH₃COOH‎ مع ‎NaOH‎؟</td><td>لأن مدى تغير لونه (3–4.4 تقريبًا) يقع خارج الجزء الرأسي للمنحنى (نحو 7–11).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الكاشف المناسب لمعايرة حمض ضعيف مع قاعدة قوية؟</td><td>الفينولفثالين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الكاشف المناسب لمعايرة حمض قوي مع قاعدة ضعيفة؟</td><td>الميثيل البرتقالي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يصلح الكاشفان معًا لمعايرة حمض قوي مع قاعدة قوية؟</td><td>لأن الجزء الرأسي يمتد تقريبًا من ‎pH 3‎ إلى 11 فيشمل مدى تغير لون الكاشفين.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 39–43 ورسم المنحنيات الثلاثة مع الكاشف المناسب لكل منها</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في إكمال نشاط 1-4</p>"]},{"axis":"الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","معايرة الأحماض والقواعد"],["الحصة","3 من 3"],["محور الحصة","الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 38–43 + كتاب التجارب ص 35"],["دليل المعلم","ص 65–68"],["كتاب التجارب العملية والأنشطة","نشاط 1-4: الكواشف ومنحنيات المعايرة ص 28؛ الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة ص 35"]],"t":["1. ينفذ معايرة حمض بقاعدة مع قياس ‎pH‎ بعد كل إضافة ويسجل النتائج\n2. يرسم منحنى المعايرة من بياناته ويحدد نقطة التكافؤ والكاشف المناسب\nمخرج تعليمي آخر: يقيّم مصادر الخطأ في القياس ويقترح تحسينات","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: سحاحة، ماصة، مقياس ‎pH‎، كأس، محلولا حمض وقاعدة، ورق رسم بياني","السحاحة، الماصة، المعايرة، قراءة مقياس ‎pH‎، الحجم عند التكافؤ، رسم البيانات.","يعرض المعلم سحاحة مملوءة ومقياس ‎pH‎ ويسأل: «كيف نحول قراءات متتالية إلى منحنى يكشف نقطة التكافؤ بدقة؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يعرض الأدوات ويراجع السلامة وقراءة السحاحة\nالطالب: يحددون خطوات العمل\n2) (22 دقيقة: من الدقيقة 4 إلى 26)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 1-1 (كتاب التجارب ص 35) بإضافات ‎1 cm³‎ وتقليلها قرب التكافؤ\nالطالب: يضيفون القاعدة تدريجيًا ويسجلون ‎pH‎ في جدول\n3) (8 دقائق: من الدقيقة 26 إلى 34)\nالمعلم: يوجه رسم المنحنى وتحديد نقطة التكافؤ\nالطالب: يرسمون المنحنى ويحددون الحجم عند التكافؤ والكاشف المناسب\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يناقش مصادر الخطأ ويدير التقويم الختامي\nالطالب: يقترحون تحسينات ويجيبون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا تُقلل الإضافات قرب نقطة التكافؤ؟\n   الإجابة النموذجية: لأن ‎pH‎ يتغير بسرعة كبيرة هناك فنحتاج قراءات أكثر لتحديد النقطة بدقة.\n2) (المستوى المتوقع) السؤال: كيف تحدد نقطة التكافؤ من المنحنى؟\n   الإجابة النموذجية: من منتصف الجزء الرأسي الحاد.\n3) (المستوى المتقدم) السؤال: ما احتياط السلامة عند تعبئة السحاحة؟\n   الإجابة النموذجية: تعبئتها تحت مستوى العين باستخدام قمع وارتداء النظارات الواقية.","1) (مستوى الدعم) السؤال: ما وظيفة الماصة في هذا الاستقصاء؟\n   الإجابة النموذجية: قياس حجم دقيق ثابت من الحمض ونقله إلى الكأس.\n2) (المستوى المتوقع) السؤال: اذكر مصدرين للخطأ في الاستقصاء.\n   الإجابة النموذجية: عدم معايرة مقياس ‎pH‎ قبل الاستخدام، وخطأ قراءة السحاحة (اختلاف زاوية النظر)، وفقاعة هواء في طرف السحاحة.\n3) (المستوى المتقدم) السؤال: إذا كان ‎pH‎ البدائي 2.9 و‎pH‎ عند التكافؤ 8.7، فما نوع الحمض والقاعدة؟ والكاشف المناسب؟\n   الإجابة النموذجية: حمض ضعيف مع قاعدة قوية؛ الكاشف المناسب الفينولفثالين.","إرشاد للطالب: كتابة تقرير الاستقصاء 1-1 مع المنحنى\nإرشاد لولي الأمر: التأكد من إكمال الابن الرسم البياني بعناية ودقة"],"h":["<ol class=\"ol\"><li>ينفذ معايرة حمض بقاعدة مع قياس ‎pH‎ بعد كل إضافة ويسجل النتائج</li><li>يرسم منحنى المعايرة من بياناته ويحدد نقطة التكافؤ والكاشف المناسب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم مصادر الخطأ في القياس ويقترح تحسينات</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>ينفذ معايرة حمض بقاعدة مع قياس ‎pH‎ بعد كل إضافة ويسجل النتائج</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يرسم منحنى المعايرة من بياناته ويحدد نقطة التكافؤ والكاشف المناسب</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم مصادر الخطأ في القياس ويقترح تحسينات</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: سحاحة، ماصة، مقياس ‎pH‎، كأس، محلولا حمض وقاعدة، ورق رسم بياني</span></div>","<p>السحاحة، الماصة، المعايرة، قراءة مقياس ‎pH‎، الحجم عند التكافؤ، رسم البيانات.</p>","<p>يعرض المعلم سحاحة مملوءة ومقياس ‎pH‎ ويسأل: «كيف نحول قراءات متتالية إلى منحنى يكشف نقطة التكافؤ بدقة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يعرض الأدوات ويراجع السلامة وقراءة السحاحة</td><td>يحددون خطوات العمل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–26</span><br><small>22 دقيقة</small></td><td>يوجه تنفيذ الاستقصاء العملي 1-1 (كتاب التجارب ص 35) بإضافات ‎1 cm³‎ وتقليلها قرب التكافؤ</td><td>يضيفون القاعدة تدريجيًا ويسجلون ‎pH‎ في جدول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">26–34</span><br><small>8 دقائق</small></td><td>يوجه رسم المنحنى وتحديد نقطة التكافؤ</td><td>يرسمون المنحنى ويحددون الحجم عند التكافؤ والكاشف المناسب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">34–40</span><br><small>6 دقائق</small></td><td>يناقش مصادر الخطأ ويدير التقويم الختامي</td><td>يقترحون تحسينات ويجيبون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تُقلل الإضافات قرب نقطة التكافؤ؟</td><td>لأن ‎pH‎ يتغير بسرعة كبيرة هناك فنحتاج قراءات أكثر لتحديد النقطة بدقة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف تحدد نقطة التكافؤ من المنحنى؟</td><td>من منتصف الجزء الرأسي الحاد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما احتياط السلامة عند تعبئة السحاحة؟</td><td>تعبئتها تحت مستوى العين باستخدام قمع وارتداء النظارات الواقية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة الماصة في هذا الاستقصاء؟</td><td>قياس حجم دقيق ثابت من الحمض ونقله إلى الكأس.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر مصدرين للخطأ في الاستقصاء.</td><td>عدم معايرة مقياس ‎pH‎ قبل الاستخدام، وخطأ قراءة السحاحة (اختلاف زاوية النظر)، وفقاعة هواء في طرف السحاحة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا كان ‎pH‎ البدائي 2.9 و‎pH‎ عند التكافؤ 8.7، فما نوع الحمض والقاعدة؟ والكاشف المناسب؟</td><td>حمض ضعيف مع قاعدة قوية؛ الكاشف المناسب الفينولفثالين.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 1-1 مع المنحنى</p><p><b>إرشاد لولي الأمر:</b> التأكد من إكمال الابن الرسم البياني بعناية ودقة</p>"]}]},{"title":"الاتزان والذوبانية","sb":"ص 44–49","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"الأملاح شحيحة الذوبان وتعبير ثابت حاصل الذوبانية ‎Ksp‎","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الاتزان والذوبانية"],["الحصة","1 من 6"],["محور الحصة","الأملاح شحيحة الذوبان وتعبير ثابت حاصل الذوبانية ‎Ksp‎"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 44–45"],["دليل المعلم","ص 68–73"],["كتاب التجارب العملية والأنشطة","نشاط 1-5: ثابت حاصل الذوبانية ص 31"]],"t":["1. يعرّف ثابت حاصل الذوبانية ‎Ksp‎ لملح شحيح الذوبان\n2. يكتب تعبيرات ‎Ksp‎ لأملاح مختلفة الصيغ\nمخرج تعليمي آخر: يفسر لماذا لا يظهر تركيز المادة الصلبة في تعبير ‎Ksp‎","المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: محلول مشبع من كبريتات الكالسيوم للعرض","الملح شحيح الذوبان، المحلول المشبع، الاتزان غير المتجانس، ثابت حاصل الذوبانية ‎Ksp‎.","يعرض المعلم صورة لترسبات كربونات الكالسيوم في غلاية ماء (من عُسر الماء) ويسأل: «لماذا لا تذوب هذه الطبقة رغم وجود الماء دائمًا؟» ويربطها بـ «العلوم ضمن سياقها».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون أن الملح شحيح الذوبان\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الاتزان بين الملح الصلب وأيوناته في المحلول المشبع وتعريف ‎Ksp‎\nالطالب: يكتبون معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎AgCl‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم أملاحًا بصيغ مختلفة (‎AgCl‎، ‎PbI₂‎، ‎Ca₃(PO₄)₂‎) لكتابة تعبيراتها\nالطالب: يكتبون التعبيرات في أزواج ويعرضونها\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب تعبير ‎Ksp‎ لـ ‎AgCl‎.\n   الإجابة النموذجية: ‎Ksp = [Ag⁺][Cl⁻]‎\n2) (المستوى المتوقع) السؤال: اكتب تعبير ‎Ksp‎ لـ ‎PbI₂‎.\n   الإجابة النموذجية: ‎Ksp = [Pb²⁺][I⁻]²‎\n3) (المستوى المتقدم) السؤال: لماذا لا يظهر ‎AgCl(s)‎ في تعبير ‎Ksp‎؟\n   الإجابة النموذجية: لأن تركيز المادة الصلبة ثابت فيُدمج في الثابت.","1) (مستوى الدعم) السؤال: عرّف ثابت حاصل الذوبانية.\n   الإجابة النموذجية: حاصل ضرب تراكيز أيونات الملح شحيح الذوبان في محلوله المشبع، كل منها مرفوع إلى أس يساوي عدد مولاته في معادلة الاتزان، عند درجة حرارة معينة.\n2) (المستوى المتوقع) السؤال: اكتب معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎CaF₂‎.\n   الإجابة النموذجية: ‎CaF₂(s) ⇌ Ca²⁺(aq) + 2F⁻(aq)‎؛ ‎Ksp = [Ca²⁺][F⁻]²‎\n3) (المستوى المتقدم) السؤال: اكتب تعبير ‎Ksp‎ لـ ‎Ca₃(PO₄)₂‎.\n   الإجابة النموذجية: ‎Ksp = [Ca²⁺]³[PO₄³⁻]²‎","إرشاد للطالب: مراجعة ص 44–45 وكتابة تعبيرات ‎Ksp‎ لخمسة أملاح\nإرشاد لولي الأمر: الحديث مع الابن عن ترسبات الأملاح في الغلايات وطرق إزالتها"],"h":["<ol class=\"ol\"><li>يعرّف ثابت حاصل الذوبانية ‎Ksp‎ لملح شحيح الذوبان</li><li>يكتب تعبيرات ‎Ksp‎ لأملاح مختلفة الصيغ</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا لا يظهر تركيز المادة الصلبة في تعبير ‎Ksp‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف ثابت حاصل الذوبانية ‎Ksp‎ لملح شحيح الذوبان</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب تعبيرات ‎Ksp‎ لأملاح مختلفة الصيغ</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا لا يظهر تركيز المادة الصلبة في تعبير ‎Ksp‎</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: محلول مشبع من كبريتات الكالسيوم للعرض</span></div>","<p>الملح شحيح الذوبان، المحلول المشبع، الاتزان غير المتجانس، ثابت حاصل الذوبانية ‎Ksp‎.</p>","<p>يعرض المعلم صورة لترسبات كربونات الكالسيوم في غلاية ماء (من عُسر الماء) ويسأل: «لماذا لا تذوب هذه الطبقة رغم وجود الماء دائمًا؟» ويربطها بـ «العلوم ضمن سياقها».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح السؤال</td><td>يقترحون أن الملح شحيح الذوبان</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الاتزان بين الملح الصلب وأيوناته في المحلول المشبع وتعريف ‎Ksp‎</td><td>يكتبون معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎AgCl‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم أملاحًا بصيغ مختلفة (‎AgCl‎، ‎PbI₂‎، ‎Ca₃(PO₄)₂‎) لكتابة تعبيراتها</td><td>يكتبون التعبيرات في أزواج ويعرضونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب تعبير ‎Ksp‎ لـ ‎AgCl‎.</td><td>‎Ksp = [Ag⁺][Cl⁻]‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب تعبير ‎Ksp‎ لـ ‎PbI₂‎.</td><td>‎Ksp = [Pb²⁺][I⁻]²‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يظهر ‎AgCl(s)‎ في تعبير ‎Ksp‎؟</td><td>لأن تركيز المادة الصلبة ثابت فيُدمج في الثابت.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف ثابت حاصل الذوبانية.</td><td>حاصل ضرب تراكيز أيونات الملح شحيح الذوبان في محلوله المشبع، كل منها مرفوع إلى أس يساوي عدد مولاته في معادلة الاتزان، عند درجة حرارة معينة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎CaF₂‎.</td><td>‎CaF₂(s) ⇌ Ca²⁺(aq) + 2F⁻(aq)‎؛ ‎Ksp = [Ca²⁺][F⁻]²‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب تعبير ‎Ksp‎ لـ ‎Ca₃(PO₄)₂‎.</td><td>‎Ksp = [Ca²⁺]³[PO₄³⁻]²‎</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 44–45 وكتابة تعبيرات ‎Ksp‎ لخمسة أملاح</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن ترسبات الأملاح في الغلايات وطرق إزالتها</p>"]},{"axis":"وحدات ‎Ksp‎ وحسابه من الذوبانية","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الاتزان والذوبانية"],["الحصة","2 من 6"],["محور الحصة","وحدات ‎Ksp‎ وحسابه من الذوبانية"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 45–46"],["دليل المعلم","ص 68–73"],["كتاب التجارب العملية والأنشطة","نشاط 1-5: ثابت حاصل الذوبانية ص 31"]],"t":["1. يحدد وحدة ‎Ksp‎ حسب صيغة الملح\n2. يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎\nمخرج تعليمي آخر: يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","الذوبانية المولارية، تحويل ‎g/dm³‎ إلى ‎mol/dm³‎، وحدة ‎Ksp‎، النسب المولية للأيونات.","يطرح المعلم: «ذوبانية ‎AgCl 1.3 × 10⁻⁵ mol/dm³‎. ما تركيز ‎Ag⁺‎ و‎Cl⁻‎ في المحلول المشبع؟» ويمنح دقيقة للتفكير.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يستنتجون أن كل أيون بتركيز الذوبانية نفسه\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يحل أمثلة لحساب ‎Ksp‎ ووحدته لأملاح 1:1 و1:2\nالطالب: يتبعون الخطوات ويكتبون الوحدات\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ «حسابات تتضمن ثوابت حاصل الذوبانية» بمسائل متدرجة\nالطالب: يحلون المسائل في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ‎Ksp‎ لـ ‎AgCl‎ إذا كانت ذوبانيته ‎1.3 × 10⁻⁵ mol/dm³‎.\n   الإجابة النموذجية: ‎Ksp = (1.3 × 10⁻⁵)² = 1.7 × 10⁻¹⁰ mol²/dm⁶‎.\n2) (المستوى المتوقع) السؤال: ما وحدة ‎Ksp‎ لـ ‎PbI₂‎؟\n   الإجابة النموذجية: ‎mol³/dm⁹‎.\n3) (المستوى المتقدم) السؤال: ذوبانية ‎CaF₂‎ تساوي ‎2.0 × 10⁻⁴ mol/dm³‎. احسب ‎Ksp‎.\n   الإجابة النموذجية: ‎[Ca²⁺] = 2.0 × 10⁻⁴‎ و‎[F⁻] = 4.0 × 10⁻⁴‎؛ ‎Ksp = 2.0 × 10⁻⁴ × (4.0 × 10⁻⁴)² = 3.2 × 10⁻¹¹ mol³/dm⁹‎.","1) (مستوى الدعم) السؤال: ما وحدة ‎Ksp‎ لملح من نوع ‎AB‎؟\n   الإجابة النموذجية: ‎mol²/dm⁶‎.\n2) (المستوى المتوقع) السؤال: ذوبانية ‎BaSO₄‎ تساوي ‎1.0 × 10⁻⁵ mol/dm³‎. احسب ‎Ksp‎.\n   الإجابة النموذجية: ‎Ksp = (1.0 × 10⁻⁵)² = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.\n3) (المستوى المتقدم) السؤال: ذوبانية ملح ‎AB (‎كتلته المولية ‎100 g/mol‎) تساوي ‎0.0010 g/dm³‎. احسب ‎Ksp‎.\n   الإجابة النموذجية: الذوبانية = ‎1.0 × 10⁻⁵ mol/dm³‎؛ ‎Ksp = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.","إرشاد للطالب: مراجعة ص 45–46 وحل ثلاث مسائل لحساب ‎Ksp‎\nإرشاد لولي الأمر: متابعة الابن في كتابة الوحدات مع كل ناتج"],"h":["<ol class=\"ol\"><li>يحدد وحدة ‎Ksp‎ حسب صيغة الملح</li><li>يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحدد وحدة ‎Ksp‎ حسب صيغة الملح</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>الذوبانية المولارية، تحويل ‎g/dm³‎ إلى ‎mol/dm³‎، وحدة ‎Ksp‎، النسب المولية للأيونات.</p>","<p>يطرح المعلم: «ذوبانية ‎AgCl 1.3 × 10⁻⁵ mol/dm³‎. ما تركيز ‎Ag⁺‎ و‎Cl⁻‎ في المحلول المشبع؟» ويمنح دقيقة للتفكير.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يستنتجون أن كل أيون بتركيز الذوبانية نفسه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يحل أمثلة لحساب ‎Ksp‎ ووحدته لأملاح 1:1 و1:2</td><td>يتبعون الخطوات ويكتبون الوحدات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينفذ «حسابات تتضمن ثوابت حاصل الذوبانية» بمسائل متدرجة</td><td>يحلون المسائل في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎Ksp‎ لـ ‎AgCl‎ إذا كانت ذوبانيته ‎1.3 × 10⁻⁵ mol/dm³‎.</td><td>‎Ksp = (1.3 × 10⁻⁵)² = 1.7 × 10⁻¹⁰ mol²/dm⁶‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما وحدة ‎Ksp‎ لـ ‎PbI₂‎؟</td><td>‎mol³/dm⁹‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ذوبانية ‎CaF₂‎ تساوي ‎2.0 × 10⁻⁴ mol/dm³‎. احسب ‎Ksp‎.</td><td>‎[Ca²⁺] = 2.0 × 10⁻⁴‎ و‎[F⁻] = 4.0 × 10⁻⁴‎؛ ‎Ksp = 2.0 × 10⁻⁴ × (4.0 × 10⁻⁴)² = 3.2 × 10⁻¹¹ mol³/dm⁹‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وحدة ‎Ksp‎ لملح من نوع ‎AB‎؟</td><td>‎mol²/dm⁶‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ذوبانية ‎BaSO₄‎ تساوي ‎1.0 × 10⁻⁵ mol/dm³‎. احسب ‎Ksp‎.</td><td>‎Ksp = (1.0 × 10⁻⁵)² = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ذوبانية ملح ‎AB (‎كتلته المولية ‎100 g/mol‎) تساوي ‎0.0010 g/dm³‎. احسب ‎Ksp‎.</td><td>الذوبانية = ‎1.0 × 10⁻⁵ mol/dm³‎؛ ‎Ksp = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 45–46 وحل ثلاث مسائل لحساب ‎Ksp‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة الوحدات مع كل ناتج</p>"]},{"axis":"حساب الذوبانية من ‎Ksp‎","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الاتزان والذوبانية"],["الحصة","3 من 6"],["محور الحصة","حساب الذوبانية من ‎Ksp‎"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 46–47"],["دليل المعلم","ص 68–73"],["كتاب التجارب العملية والأنشطة","نشاط 1-5: ثابت حاصل الذوبانية ص 31"]],"t":["1. يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎\n2. يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده\nمخرج تعليمي آخر: يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","الذوبانية ‎s‎، الجذر التربيعي والتكعيبي، المقارنة بين الذوبانيات، الكتلة المذابة.","يطرح المعلم: «‎Ksp‎ لـ ‎AgCl‎ أكبر من ‎Ksp‎ لـ ‎Ag₂CrO₄‎، فهل ‎AgCl‎ أكثر ذوبانًا بالضرورة؟» ويترك السؤال مفتوحًا حتى نهاية الحصة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يدلون بتوقعاتهم\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يحل أمثلة لحساب ‎s‎ من ‎Ksp‎ لأملاح ‎1:1 (s = √Ksp)‎ و‎1:2 (s = ∛(Ksp/4))‎\nالطالب: يتبعون ويكتبون الخطوات\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم مسألة المقارنة بين ‎AgCl‎ و‎Ag₂CrO₄‎ لحلها في مجموعات\nالطالب: يحسبون الذوبانيتين ويجيبون عن سؤال التهيئة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ذوبانية ‎BaSO₄‎ إذا كان ‎Ksp = 1.1 × 10⁻¹⁰ mol²/dm⁶‎.\n   الإجابة النموذجية: ‎s = √(1.1 × 10⁻¹⁰) = 1.05 × 10⁻⁵ mol/dm³‎.\n2) (المستوى المتوقع) السؤال: احسب ذوبانية ‎CaF₂‎ إذا كان ‎Ksp = 3.2 × 10⁻¹¹ mol³/dm⁹‎.\n   الإجابة النموذجية: ‎4s³ = 3.2 × 10⁻¹¹ ← s = 2.0 × 10⁻⁴ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: لماذا لا تكفي مقارنة قيم ‎Ksp‎ لمقارنة ذوبانية ملحين مختلفي الصيغة؟\n   الإجابة النموذجية: لأن العلاقة بين ‎s‎ و‎Ksp‎ تختلف حسب الصيغة (‎s²‎ أو ‎4s³‎)، فيجب حساب ‎s‎ لكل ملح.","1) (مستوى الدعم) السؤال: اكتب العلاقة بين ‎s‎ و‎Ksp‎ لملح ‎AB‎.\n   الإجابة النموذجية: ‎Ksp = s²‎، أي ‎s = √Ksp‎.\n2) (المستوى المتوقع) السؤال: احسب ذوبانية ملح ‎AB‎ إذا كان ‎Ksp = 4.0 × 10⁻¹² mol²/dm⁶‎.\n   الإجابة النموذجية: ‎s = 2.0 × 10⁻⁶ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: ‎Ksp‎ لـ ‎AgCl = 1.8 × 10⁻¹⁰‎ و‎Ksp‎ لـ ‎Ag₂CrO₄ = 1.1 × 10⁻¹²‎. أيهما أكثر ذوبانًا؟\n   الإجابة النموذجية: ‎AgCl: s = 1.3 × 10⁻⁵‎؛ ‎Ag₂CrO₄: s = ∛(2.75 × 10⁻¹³) = 6.5 × 10⁻⁵‎؛ إذن ‎Ag₂CrO₄‎ أكثر ذوبانًا رغم أن ‎Ksp‎ له أصغر.","إرشاد للطالب: مراجعة ص 46–47 وحل مسألتين للمقارنة بين الذوبانيات\nإرشاد لولي الأمر: تشجيع الابن على تذكر قاعدة «احسب ‎s‎ قبل المقارنة»"],"h":["<ol class=\"ol\"><li>يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎</li><li>يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>الذوبانية ‎s‎، الجذر التربيعي والتكعيبي، المقارنة بين الذوبانيات، الكتلة المذابة.</p>","<p>يطرح المعلم: «‎Ksp‎ لـ ‎AgCl‎ أكبر من ‎Ksp‎ لـ ‎Ag₂CrO₄‎، فهل ‎AgCl‎ أكثر ذوبانًا بالضرورة؟» ويترك السؤال مفتوحًا حتى نهاية الحصة.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يدلون بتوقعاتهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يحل أمثلة لحساب ‎s‎ من ‎Ksp‎ لأملاح ‎1:1 (s = √Ksp)‎ و‎1:2 (s = ∛(Ksp/4))‎</td><td>يتبعون ويكتبون الخطوات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم مسألة المقارنة بين ‎AgCl‎ و‎Ag₂CrO₄‎ لحلها في مجموعات</td><td>يحسبون الذوبانيتين ويجيبون عن سؤال التهيئة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ذوبانية ‎BaSO₄‎ إذا كان ‎Ksp = 1.1 × 10⁻¹⁰ mol²/dm⁶‎.</td><td>‎s = √(1.1 × 10⁻¹⁰) = 1.05 × 10⁻⁵ mol/dm³‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ذوبانية ‎CaF₂‎ إذا كان ‎Ksp = 3.2 × 10⁻¹¹ mol³/dm⁹‎.</td><td>‎4s³ = 3.2 × 10⁻¹¹ ← s = 2.0 × 10⁻⁴ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تكفي مقارنة قيم ‎Ksp‎ لمقارنة ذوبانية ملحين مختلفي الصيغة؟</td><td>لأن العلاقة بين ‎s‎ و‎Ksp‎ تختلف حسب الصيغة (‎s²‎ أو ‎4s³‎)، فيجب حساب ‎s‎ لكل ملح.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب العلاقة بين ‎s‎ و‎Ksp‎ لملح ‎AB‎.</td><td>‎Ksp = s²‎، أي ‎s = √Ksp‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ذوبانية ملح ‎AB‎ إذا كان ‎Ksp = 4.0 × 10⁻¹² mol²/dm⁶‎.</td><td>‎s = 2.0 × 10⁻⁶ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>‎Ksp‎ لـ ‎AgCl = 1.8 × 10⁻¹⁰‎ و‎Ksp‎ لـ ‎Ag₂CrO₄ = 1.1 × 10⁻¹²‎. أيهما أكثر ذوبانًا؟</td><td>‎AgCl: s = 1.3 × 10⁻⁵‎؛ ‎Ag₂CrO₄: s = ∛(2.75 × 10⁻¹³) = 6.5 × 10⁻⁵‎؛ إذن ‎Ag₂CrO₄‎ أكثر ذوبانًا رغم أن ‎Ksp‎ له أصغر.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 46–47 وحل مسألتين للمقارنة بين الذوبانيات</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على تذكر قاعدة «احسب ‎s‎ قبل المقارنة»</p>"]},{"axis":"التنبؤ بالترسيب بمقارنة حاصل الأيونات بـ ‎Ksp‎","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الاتزان والذوبانية"],["الحصة","4 من 6"],["محور الحصة","التنبؤ بالترسيب بمقارنة حاصل الأيونات بـ ‎Ksp‎"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 47–48"],["دليل المعلم","ص 68–73"],["كتاب التجارب العملية والأنشطة","نشاط 1-5: ثابت حاصل الذوبانية ص 31"]],"t":["1. يستخدم ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح شحيحة الذوبان عند خلط محلولين\n2. يحسب حاصل ضرب التراكيز الأيونية بعد الخلط مع مراعاة تغير الحجم\nمخرج تعليمي آخر: يفسر تكوّن الراسب في ضوء الاتزان بين المحلول المشبع والمادة الصلبة","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات","- الكتاب\n- السبورة الذكية\n- أخرى: محاليل نترات الفضة وكلوريد الصوديوم المخففة للعرض","حاصل ضرب التراكيز الأيونية، الترسيب، المحلول غير المشبع، المحلول المشبع، التخفيف عند الخلط.","يخلط المعلم قطرات من محلولي ‎AgNO₃‎ و‎NaCl‎ المخففين فيظهر راسب أبيض، ثم يخلط محلولين أكثر تخفيفًا فلا يظهر راسب، ويسأل: «لماذا ترسب في الأولى ولم يترسب في الثانية؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يقترحون أثر التركيز\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح قاعدة الترسيب: إذا تجاوز حاصل ضرب التراكيز ‎Ksp‎ يحدث ترسيب\nالطالب: يكتبون القاعدة ويطبقونها على مثال\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ «استخدام ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح» بمسائل خلط محلولين\nالطالب: يحسبون التراكيز بعد الخلط ويتنبؤون بالترسيب\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: متى يتكون راسب عند خلط محلولين؟\n   الإجابة النموذجية: عندما يكون حاصل ضرب تراكيز الأيونات (بالأسس المناسبة) أكبر من ‎Ksp‎.\n2) (المستوى المتوقع) السؤال: لماذا يجب حساب التراكيز بعد الخلط؟\n   الإجابة النموذجية: لأن الحجم الكلي يزداد فتنخفض تراكيز الأيونات.\n3) (المستوى المتقدم) السؤال: خُلط ‎50 cm³‎ من ‎Ag⁺ (2.0 × 10⁻⁴ mol/dm³)‎ مع ‎50 cm³‎ من ‎Cl⁻ (2.0 × 10⁻⁴ mol/dm³)‎. هل يترسب ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎؟\n   الإجابة النموذجية: بعد الخلط كل تركيز ‎1.0 × 10⁻⁴‎؛ الحاصل = ‎1.0 × 10⁻⁸ > Ksp‎، فيترسب.","1) (مستوى الدعم) السؤال: ماذا يعني أن حاصل الأيونات أقل من ‎Ksp‎؟\n   الإجابة النموذجية: أن المحلول غير مشبع فلا يتكون راسب.\n2) (المستوى المتوقع) السؤال: ما الذي يحدث لتراكيز الأيونات عند خلط حجمين متساويين من محلولين؟\n   الإجابة النموذجية: يقل تركيز كل منها إلى النصف.\n3) (المستوى المتقدم) السؤال: خُلط حجمان متساويان من ‎Ca²⁺ (2.0 × 10⁻³ mol/dm³)‎ و‎SO₄²⁻ (2.0 × 10⁻³ mol/dm³)‎. هل تترسب ‎CaSO₄ (Ksp = 2.4 × 10⁻⁵)‎؟\n   الإجابة النموذجية: بعد الخلط كل تركيز ‎1.0 × 10⁻³‎؛ الحاصل = ‎1.0 × 10⁻⁶ < Ksp‎، فلا تترسب.","إرشاد للطالب: مراجعة ص 47–48 وحل مسألتي ترسيب\nإرشاد لولي الأمر: متابعة الابن في تذكر خطوة «التخفيف بعد الخلط»"],"h":["<ol class=\"ol\"><li>يستخدم ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح شحيحة الذوبان عند خلط محلولين</li><li>يحسب حاصل ضرب التراكيز الأيونية بعد الخلط مع مراعاة تغير الحجم</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر تكوّن الراسب في ضوء الاتزان بين المحلول المشبع والمادة الصلبة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح شحيحة الذوبان عند خلط محلولين</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب حاصل ضرب التراكيز الأيونية بعد الخلط مع مراعاة تغير الحجم</td><td class=\"lv\">تط ><td>لأن الحجم الكلي يزداد فتنخفض تراكيز الأيونات.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>خُلط ‎50 cm³‎ من ‎Ag⁺ (2.0 × 10⁻⁴ mol/dm³)‎ مع ‎50 cm³‎ من ‎Cl⁻ (2.0 × 10⁻⁴ mol/dm³)‎. هل يترسب ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎؟</td><td>بعد الخلط كل تركيز ‎1.0 × 10⁻⁴‎؛ الحاصل = ‎1.0 × 10⁻⁸ &gt; Ksp‎، فيترسب.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا يعني أن حاصل الأيونات أقل من ‎Ksp‎؟</td><td>أن المحلول غير مشبع فلا يتكون راسب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الذي يحدث لتراكيز الأيونات عند خلط حجمين متساويين من محلولين؟</td><td>يقل تركيز كل منها إلى النصف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>خُلط حجمان متساويان من ‎Ca²⁺ (2.0 × 10⁻³ mol/dm³)‎ و‎SO₄²⁻ (2.0 × 10⁻³ mol/dm³)‎. هل تترسب ‎CaSO₄ (Ksp = 2.4 × 10⁻⁵)‎؟</td><td>بعد الخلط كل تركيز ‎1.0 × 10⁻³‎؛ الحاصل = ‎1.0 × 10⁻⁶ &lt; Ksp‎، فلا تترسب.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 47–48 وحل مسألتي ترسيب</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في تذكر خطوة «التخفيف بعد الخلط»</p>"]},{"axis":"تأثير الأيون المشترك في الذوبانية","n":5,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الاتزان والذوبانية"],["الحصة","5 من 6"],["محور الحصة","تأثير الأيون المشترك في الذوبانية"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 48–49"],["دليل المعلم","ص 68–73"],["كتاب التجارب العملية والأنشطة","نشاط 1-5: ثابت حاصل الذوبانية ص 31"]],"t":["1. يفهم تأثير الأيون المشترك ويستخدمه لشرح انخفاض ذوبانية ملح في محلول يحتوي أحد أيوناته\n2. يحسب ذوبانية ملح شحيح الذوبان في محلول يحتوي أيونًا مشتركًا\nمخرج تعليمي آخر: يربط تأثير الأيون المشترك بمبدأ لوشاتلييه وتطبيقات عملية (إزالة الأيونات)","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: محلول كلوريد الصوديوم المشبع وحمض الهيدروكلوريك المركز للعرض","تأثير الأيون المشترك، الأيون المشترك، إزاحة الاتزان، انخفاض الذوبانية، مبدأ لوشاتلييه.","يضيف المعلم قطرات من ‎HCl‎ المركز إلى محلول ‎NaCl‎ المشبع فتظهر بلورات، ويسأل: «لم نُضف ملحًا جديدًا؛ فمن أين جاءت البلورات؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يربطون ظهور البلورات بأيون ‎Cl⁻‎ المضاف\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح تأثير الأيون المشترك بمبدأ لوشاتلييه ويحل مثالًا لذوبانية ‎AgCl‎ في ‎NaCl‎\nالطالب: يتبعون خطوات الحل بإهمال ‎s‎ أمام التركيز المضاف\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مسائل متدرجة لذوبانية أملاح في محاليل بها أيون مشترك\nالطالب: يحلون في مجموعات ويقارنون بالذوبانية في الماء النقي\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما تأثير إضافة ‎NaCl‎ على ذوبانية ‎AgCl‎؟\n   الإجابة النموذجية: تقل الذوبانية لأن زيادة ‎[Cl⁻]‎ تزيح الاتزان نحو ‎AgCl(s)‎.\n2) (المستوى المتوقع) السؤال: احسب ذوبانية ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎ في محلول ‎NaCl‎ تركيزه ‎0.10 mol/dm³‎.\n   الإجابة النموذجية: ‎s = Ksp ÷ [Cl⁻] = 1.8 × 10⁻⁹ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: لماذا نهمل ‎s‎ في ‎[Cl⁻] = 0.10 + s‎؟\n   الإجابة النموذجية: لأن ‎s‎ صغيرة جدًا مقارنة بـ 0.10.","1) (مستوى الدعم) السؤال: عرّف تأثير الأيون المشترك.\n   الإجابة النموذجية: انخفاض ذوبانية ملح شحيح الذوبان عند وجود أحد أيوناته في المحلول من مصدر آخر.\n2) (المستوى المتوقع) السؤال: كم مرة قلّت ذوبانية ‎AgCl‎ في المثال السابق مقارنة بالماء النقي ‎(1.3 × 10⁻⁵)‎؟\n   الإجابة النموذجية: نحو 7000 مرة تقريبًا ‎(1.3 × 10⁻⁵ ÷ 1.8 × 10⁻⁹)‎.\n3) (المستوى المتقدم) السؤال: اقترح طريقة لإزالة أيونات ‎Pb²⁺‎ من ماء ملوث باستخدام فكرة الأيون المشترك.\n   الإجابة النموذجية: إضافة محلول يحتوي أنيونًا يكوّن مع ‎Pb²⁺‎ ملحًا شحيح الذوبان (مثل ‎I⁻‎ أو ‎SO₄²⁻‎) بزيادة، فتقل الذوبانية ويترسب الرصاص ثم يُرشح.","إرشاد للطالب: مراجعة ص 48–49 وحل مسألتين على الأيون المشترك\nإرشاد لولي الأمر: الحديث مع الابن عن معالجة المياه بالترسيب في محطات التحلية"],"h":["<ol class=\"ol\"><li>يفهم تأثير الأيون المشترك ويستخدمه لشرح انخفاض ذوبانية ملح في محلول يحتوي أحد أيوناته</li><li>يحسب ذوبانية ملح شحيح الذوبان في محلول يحتوي أيونًا مشتركًا</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط تأثير الأيون المشترك بمبدأ لوشاتلييه وتطبيقات عملية (إزالة الأيونات)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يفهم تأثير الأيون المشترك ويستخدمه لشرح انخفاض ذوبانية ملح في محلول يحتوي أحد أيوناته</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب ذوبانية ملح شحيح الذوبان في محلول يحتوي أيونًا مشتركًا</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط تأثير الأيون المشترك بمبدأ لوشاتلييه وتطبيقات عملية (إزالة الأيونات)</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: محلول كلوريد الصوديوم المشبع وحمض الهيدروكلوريك المركز للعرض</span></div>","<p>تأثير الأيون المشترك، الأيون المشترك، إزاحة الاتزان، انخفاض الذوبانية، مبدأ لوشاتلييه.</p>","<p>يضيف المعلم قطرات من ‎HCl‎ المركز إلى محلول ‎NaCl‎ المشبع فتظهر بلورات، ويسأل: «لم نُضف ملحًا جديدًا؛ فمن أين جاءت البلورات؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>ينفذ العرض ويطرح السؤال</td><td>يربطون ظهور البلورات بأيون ‎Cl⁻‎ المضاف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح تأثير الأيون المشترك بمبدأ لوشاتلييه ويحل مثالًا لذوبانية ‎AgCl‎ في ‎NaCl‎</td><td>يتبعون خطوات الحل بإهمال ‎s‎ أمام التركيز المضاف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مسائل متدرجة لذوبانية أملاح في محاليل بها أيون مشترك</td><td>يحلون في مجموعات ويقارنون بالذوبانية في الماء النقي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما تأثير إضافة ‎NaCl‎ على ذوبانية ‎AgCl‎؟</td><td>تقل الذوبانية لأن زيادة ‎[Cl⁻]‎ تزيح الاتزان نحو ‎AgCl(s)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ذوبانية ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎ في محلول ‎NaCl‎ تركيزه ‎0.10 mol/dm³‎.</td><td>‎s = Ksp ÷ [Cl⁻] = 1.8 × 10⁻⁹ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا نهمل ‎s‎ في ‎[Cl⁻] = 0.10 + s‎؟</td><td>لأن ‎s‎ صغيرة جدًا مقارنة بـ 0.10.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف تأثير الأيون المشترك.</td><td>انخفاض ذوبانية ملح شحيح الذوبان عند وجود أحد أيوناته في المحلول من مصدر آخر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كم مرة قلّت ذوبانية ‎AgCl‎ في المثال السابق مقارنة بالماء النقي ‎(1.3 × 10⁻⁵)‎؟</td><td>نحو 7000 مرة تقريبًا ‎(1.3 × 10⁻⁵ ÷ 1.8 × 10⁻⁹)‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح طريقة لإزالة أيونات ‎Pb²⁺‎ من ماء ملوث باستخدام فكرة الأيون المشترك.</td><td>إضافة محلول يحتوي أنيونًا يكوّن مع ‎Pb²⁺‎ ملحًا شحيح الذوبان (مثل ‎I⁻‎ أو ‎SO₄²⁻‎) بزيادة، فتقل الذوبانية ويترسب الرصاص ثم يُرشح.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 48–49 وحل مسألتين على الأيون المشترك</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن معالجة المياه بالترسيب في محطات التحلية</p>"]},{"axis":"نشاط 1-5 والسؤال المفصلي ومسائل متدرجة في ‎Ksp‎","n":6,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الاتزان والذوبانية"],["الحصة","6 من 6"],["محور الحصة","نشاط 1-5 والسؤال المفصلي ومسائل متدرجة في ‎Ksp‎"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 44–49 + كتاب التجارب ص 31"],["دليل المعلم","ص 68–73"],["كتاب التجارب العملية والأنشطة","نشاط 1-5: ثابت حاصل الذوبانية ص 31"]],"t":["1. يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة\n2. يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ\nمخرج تعليمي آخر: يصمم مسألة ‎Ksp‎ مع حلها النموذجي","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع","- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- السؤال المفصلي","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","مراجعة ‎Ksp‎، الأخطاء الشائعة (نسيان الأسس، عدم مضاعفة التركيز)، تصميم المسائل.","يعرض المعلم حلًّا خاطئًا لحساب ‎Ksp‎ لـ ‎CaF₂‎ يستخدم ‎[F⁻] = s‎ بدلًا من ‎2s‎، ويسأل: «أين الخطأ؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الحل الخاطئ (السؤال المفصلي)\nالطالب: يكتشفون الخطأ ويصححونه\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 1-5 (كتاب التجارب ص 31)\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يكلف المجموعات بتصميم مسألة ‎Ksp‎ وتبادلها\nالطالب: يصممون ويحلون مسائل زملائهم\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الاتزان والذوبانية\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخطأ في استخدام ‎[F⁻] = s‎ لـ ‎CaF₂‎؟\n   الإجابة النموذجية: كل وحدة ‎CaF₂‎ تعطي أيوني ‎F⁻‎، فيجب أن يكون ‎[F⁻] = 2s‎.\n2) (المستوى المتوقع) السؤال: ما الخطأ في كتابة ‎Ksp = [Ca²⁺][F⁻]‎ لـ ‎CaF₂‎؟\n   الإجابة النموذجية: نسيان رفع ‎[F⁻]‎ إلى الأس 2.\n3) (المستوى المتقدم) السؤال: خطوات حل مسألة ترسيب: رتبها.\n   الإجابة النموذجية: حساب التراكيز بعد الخلط ← حساب حاصل الأيونات ← المقارنة بـ ‎Ksp ←‎ الاستنتاج.","1) (مستوى الدعم) السؤال: احسب ‎Ksp‎ لـ ‎Mg(OH)₂‎ إذا كانت ذوبانيته ‎1.1 × 10⁻⁴ mol/dm³‎.\n   الإجابة النموذجية: ‎[Mg²⁺] = 1.1 × 10⁻⁴‎، ‎[OH⁻] = 2.2 × 10⁻⁴‎؛ ‎Ksp = 1.1 × 10⁻⁴ × (2.2 × 10⁻⁴)² = 5.3 × 10⁻¹² mol³/dm⁹‎.\n2) (المستوى المتوقع) السؤال: لماذا تقل ذوبانية ‎Mg(OH)₂‎ في محلول ‎NaOH‎؟\n   الإجابة النموذجية: بسبب تأثير الأيون المشترك ‎OH⁻‎ الذي يزيح الاتزان نحو المادة الصلبة.\n3) (المستوى المتقدم) السؤال: صمم مسألة لحساب ذوبانية ملح ‎AB‎ من ‎Ksp‎ مع حلها.\n   الإجابة النموذجية: مثال: ‎Ksp‎ لـ ‎AB = 2.5 × 10⁻¹³‎، ‎s = √(2.5 × 10⁻¹³) = 5.0 × 10⁻⁷ mol/dm³‎.","إرشاد للطالب: إكمال نشاط 1-5 ص 31 وتصحيح الأخطاء الشائعة في الدفتر\nإرشاد لولي الأمر: متابعة الابن في حل مسألة من تصميم زميله"],"h":["<ol class=\"ol\"><li>يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة</li><li>يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم مسألة ‎Ksp‎ مع حلها النموذجي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصمم مسألة ‎Ksp‎ مع حلها النموذجي</td><td class=\"lv\">إبداع</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">السؤال المفصلي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>مراجعة ‎Ksp‎، الأخطاء الشائعة (نسيان الأسس، عدم مضاعفة التركيز)، تصميم المسائل.</p>","<p>يعرض المعلم حلًّا خاطئًا لحساب ‎Ksp‎ لـ ‎CaF₂‎ يستخدم ‎[F⁻] = s‎ بدلًا من ‎2s‎، ويسأل: «أين الخطأ؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الحل الخاطئ (السؤال المفصلي)</td><td>يكتشفون الخطأ ويصححونه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-5 (كتاب التجارب ص 31)</td><td>يحلون فرديًا ثم يقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يكلف المجموعات بتصميم مسألة ‎Ksp‎ وتبادلها</td><td>يصممون ويحلون مسائل زملائهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على الاتزان والذوبانية</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطأ في استخدام ‎[F⁻] = s‎ لـ ‎CaF₂‎؟</td><td>كل وحدة ‎CaF₂‎ تعطي أيوني ‎F⁻‎، فيجب أن يكون ‎[F⁻] = 2s‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الخطأ في كتابة ‎Ksp = [Ca²⁺][F⁻]‎ لـ ‎CaF₂‎؟</td><td>نسيان رفع ‎[F⁻]‎ إلى الأس 2.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>خطوات حل مسألة ترسيب: رتبها.</td><td>حساب التراكيز بعد الخلط ← حساب حاصل الأيونات ← المقارنة بـ ‎Ksp ←‎ الاستنتاج.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎Ksp‎ لـ ‎Mg(OH)₂‎ إذا كانت ذوبانيته ‎1.1 × 10⁻⁴ mol/dm³‎.</td><td>‎[Mg²⁺] = 1.1 × 10⁻⁴‎، ‎[OH⁻] = 2.2 × 10⁻⁴‎؛ ‎Ksp = 1.1 × 10⁻⁴ × (2.2 × 10⁻⁴)² = 5.3 × 10⁻¹² mol³/dm⁹‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تقل ذوبانية ‎Mg(OH)₂‎ في محلول ‎NaOH‎؟</td><td>بسبب تأثير الأيون المشترك ‎OH⁻‎ الذي يزيح الاتزان نحو المادة الصلبة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صمم مسألة لحساب ذوبانية ملح ‎AB‎ من ‎Ksp‎ مع حلها.</td><td>مثال: ‎Ksp‎ لـ ‎AB = 2.5 × 10⁻¹³‎، ‎s = √(2.5 × 10⁻¹³) = 5.0 × 10⁻⁷ mol/dm³‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-5 ص 31 وتصحيح الأخطاء الشائعة في الدفتر</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في حل مسألة من تصميم زميله</p>"]}]},{"title":"المحاليل المنظمة","sb":"ص 50–65","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"تعريف المحلول المنظم وتحضيره وآلية عمله","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","المحاليل المنظمة"],["الحصة","1 من 3"],["محور الحصة","تعريف المحلول المنظم وتحضيره وآلية عمله"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 50–52"],["دليل المعلم","ص 73–78"],["كتاب التجارب العملية والأنشطة","نشاط 1-6: المحاليل المنظمة ص 32"]],"t":["1. يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه\n2. يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة\nمخرج تعليمي آخر: يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: محلول منظم ‎(CH₃COOH/CH₃COONa)‎، ماء مقطر، مقياس ‎pH‎، ‎HCl‎ و‎NaOH‎ مخففان","المحلول المنظم، الحمض الضعيف، القاعدة المرافقة، الملح، مقاومة تغير ‎pH‎، المخزون الكبير من ‎HA‎ و‎A⁻‎.","يعرض المعلم مقطعًا لإضافة حمض إلى عينة دم ويسأل: «لو تغير ‎pH‎ الدم بمقدار 0.4 لتعرضت حياتك للخطر؛ فكيف يقاوم الدم التغير عند تناول أطعمة حمضية؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المقطع ويطرح السؤال\nالطالب: يقترحون وجود مواد تقاوم التغير\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يجري عرضًا: إضافة قطرات ‎HCl‎ إلى الماء وإلى المحلول المنظم وقياس ‎pH‎\nالطالب: يسجلون التغير في الحالتين ويقارنون\n3) (17 دقيقة: من الدقيقة 15 إلى 32)\nالمعلم: يشرح تعريف المحلول المنظم وآلية عمله بالمعادلات (‎A⁻‎ يستهلك ‎H⁺‎، و‎HA‎ يعادل ‎OH⁻‎)\nالطالب: يكتبون معادلتي الاستجابة لإضافة الحمض والقاعدة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف المحلول المنظم.\n   الإجابة النموذجية: محلول يقاوم التغير في ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تفاعل المنظم ‎CH₃COOH/CH₃COO⁻‎ مع حمض مضاف.\n   الإجابة النموذجية: ‎CH₃COO⁻ + H⁺ → CH₃COOH‎\n3) (المستوى المتقدم) السؤال: لماذا يجب أن يحتوي المنظم كميات كبيرة من ‎HA‎ و‎A⁻‎ معًا؟\n   الإجابة النموذجية: ليتوفر مخزون يستهلك ‎H⁺‎ أو ‎OH⁻‎ المضاف دون أن تتغير النسبة ‎[HA]/[A⁻]‎ كثيرًا.","1) (مستوى الدعم) السؤال: من أي مكونين يُحضّر المنظم الحمضي؟\n   الإجابة النموذجية: حمض ضعيف وأحد أملاحه مع قاعدة قوية (القاعدة المرافقة).\n2) (المستوى المتوقع) السؤال: اكتب معادلة تفاعل المنظم مع قاعدة مضافة.\n   الإجابة النموذجية: ‎CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O‎\n3) (المستوى المتقدم) السؤال: لماذا لا يصلح خليط ‎HCl‎ و‎NaCl‎ محلولًا منظمًا؟\n   الإجابة النموذجية: لأن ‎HCl‎ حمض قوي متأين كليًا، و‎Cl⁻‎ قاعدة مرافقة ضعيفة جدًا لا تستهلك ‎H⁺‎ المضاف.","إرشاد للطالب: مراجعة ص 50–52 وكتابة معادلات عمل المنظم\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية ثبات ‎pH‎ الدم للحياة"],"h":["<ol class=\"ol\"><li>يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه</li><li>يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span><span class=\"chip r\">أخرى: محلول منظم ‎(CH₃COOH/CH₃COONa)‎، ماء مقطر، مقياس ‎pH‎، ‎HCl‎ و‎NaOH‎ مخففان</span></div>","<p>المحلول المنظم، الحمض الضعيف، القاعدة المرافقة، الملح، مقاومة تغير ‎pH‎، المخزون الكبير من ‎HA‎ و‎A⁻‎.</p>","<p>يعرض المعلم مقطعًا لإضافة حمض إلى عينة دم ويسأل: «لو تغير ‎pH‎ الدم بمقدار 0.4 لتعرضت حياتك للخطر؛ فكيف يقاوم الدم التغير عند تناول أطعمة حمضية؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض المقطع ويطرح السؤال</td><td>يقترحون وجود مواد تقاوم التغير</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يجري عرضًا: إضافة قطرات ‎HCl‎ إلى الماء وإلى المحلول المنظم وقياس ‎pH‎</td><td>يسجلون التغير في الحالتين ويقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–32</span><br><small>17 دقيقة</small></td><td>يشرح تعريف المحلول المنظم وآلية عمله بالمعادلات (‎A⁻‎ يستهلك ‎H⁺‎، و‎HA‎ يعادل ‎OH⁻‎)</td><td>يكتبون معادلتي الاستجابة لإضافة الحمض والقاعدة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف المحلول المنظم.</td><td>محلول يقاوم التغير في ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تفاعل المنظم ‎CH₃COOH/CH₃COO⁻‎ مع حمض مضاف.</td><td>‎CH₃COO⁻ + H⁺ → CH₃COOH‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يجب أن يحتوي المنظم كميات كبيرة من ‎HA‎ و‎A⁻‎ معًا؟</td><td>ليتوفر مخزون يستهلك ‎H⁺‎ أو ‎OH⁻‎ المضاف دون أن تتغير النسبة ‎[HA]/[A⁻]‎ كثيرًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>من أي مكونين يُحضّر المنظم الحمضي؟</td><td>حمض ضعيف وأحد أملاحه مع قاعدة قوية (القاعدة المرافقة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تفاعل المنظم مع قاعدة مضافة.</td><td>‎CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يصلح خليط ‎HCl‎ و‎NaCl‎ محلولًا منظمًا؟</td><td>لأن ‎HCl‎ حمض قوي متأين كليًا، و‎Cl⁻‎ قاعدة مرافقة ضعيفة جدًا لا تستهلك ‎H⁺‎ المضاف.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 50–52 وكتابة معادلات عمل المنظم</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أهمية ثبات ‎pH‎ الدم للحياة</p>"]},{"axis":"حساب ‎pH‎ المحلول المنظم","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","المحاليل المنظمة"],["الحصة","2 من 3"],["محور الحصة","حساب ‎pH‎ المحلول المنظم"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 52–55"],["دليل المعلم","ص 73–78"],["كتاب التجارب العملية والأنشطة","نشاط 1-6: المحاليل المنظمة ص 32"]],"t":["1. يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎\n2. يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة\nمخرج تعليمي آخر: يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","‎[H⁺] = Ka[HA]/[A⁻]‎، ‎pH = pKa + log([A⁻]/[HA])‎، نسبة المكونات، تحضير منظم بقيمة محددة.","يسأل المعلم: «لو أردت تحضير محلول منظم ‎pH‎ له 4.76 بالضبط من حمض الإيثانويك وإيثانوات الصوديوم، فكم من كل منهما تحتاج؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون كميات متساوية ويبررون\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يشرح العلاقة ويحل المثال 12 في كتاب الطالب ومثالًا لتحضير منظم بقيمة محددة\nالطالب: يتبعون الخطوات ويطبقونها\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: ينفذ «حساب الرقم الهيدروجيني للمحاليل المنظمة» بمسائل متدرجة\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ‎pH‎ لمنظم فيه ‎[CH₃COOH] = 0.10‎ و‎[CH₃COO⁻] = 0.10 (Ka = 1.74 × 10⁻⁵)‎.\n   الإجابة النموذجية: ‎[H⁺] = Ka = 1.74 × 10⁻⁵‎، ‎pH = 4.76‎.\n2) (المستوى المتوقع) السؤال: احسب ‎pH‎ إذا أصبح ‎[CH₃COO⁻] = 0.20‎ و‎[CH₃COOH] = 0.10‎.\n   الإجابة النموذجية: ‎[H⁺] = 1.74 × 10⁻⁵ × 0.10/0.20 = 8.7 × 10⁻⁶‎، ‎pH = 5.06‎.\n3) (المستوى المتقدم) السؤال: متى يكون ‎pH = pKa‎ في المنظم؟\n   الإجابة النموذجية: عندما يتساوى ‎[HA]‎ و‎[A⁻]‎.","1) (مستوى الدعم) السؤال: اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ في المنظم.\n   الإجابة النموذجية: ‎[H⁺] = Ka × [HA] / [A⁻]‎\n2) (المستوى المتوقع) السؤال: احسب ‎pH‎ لمنظم فيه ‎[HA] = 0.20‎ و‎[A⁻] = 0.050 (Ka = 1.0 × 10⁻⁵)‎.\n   الإجابة النموذجية: ‎[H⁺] = 4.0 × 10⁻⁵‎، ‎pH = 4.40‎.\n3) (المستوى المتقدم) السؤال: ما نسبة ‎[A⁻]/[HA]‎ اللازمة لمنظم ‎pH‎ له 5.76 من حمض الإيثانويك ‎(pKa = 4.76)‎؟\n   الإجابة النموذجية: ‎5.76 = 4.76 + log(‎النسبة)، النسبة = 10.","إرشاد للطالب: مراجعة ص 52–55 وحل ثلاث مسائل ‎pH‎ للمنظمات\nإرشاد لولي الأمر: متابعة الابن في كتابة العلاقة وتعويض القيم بدقة"],"h":["<ol class=\"ol\"><li>يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎</li><li>يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>‎[H⁺] = Ka[HA]/[A⁻]‎، ‎pH = pKa + log([A⁻]/[HA])‎، نسبة المكونات، تحضير منظم بقيمة محددة.</p>","<p>يسأل المعلم: «لو أردت تحضير محلول منظم ‎pH‎ له 4.76 بالضبط من حمض الإيثانويك وإيثانوات الصوديوم، فكم من كل منهما تحتاج؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون كميات متساوية ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يشرح العلاقة ويحل المثال 12 في كتاب الطالب ومثالًا لتحضير منظم بقيمة محددة</td><td>يتبعون الخطوات ويطبقونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>ينفذ «حساب الرقم الهيدروجيني للمحاليل المنظمة» بمسائل متدرجة</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎pH‎ لمنظم فيه ‎[CH₃COOH] = 0.10‎ و‎[CH₃COO⁻] = 0.10 (Ka = 1.74 × 10⁻⁵)‎.</td><td>‎[H⁺] = Ka = 1.74 × 10⁻⁵‎، ‎pH = 4.76‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎pH‎ إذا أصبح ‎[CH₃COO⁻] = 0.20‎ و‎[CH₃COOH] = 0.10‎.</td><td>‎[H⁺] = 1.74 × 10⁻⁵ × 0.10/0.20 = 8.7 × 10⁻⁶‎، ‎pH = 5.06‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>متى يكون ‎pH = pKa‎ في المنظم؟</td><td>عندما يتساوى ‎[HA]‎ و‎[A⁻]‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ في المنظم.</td><td>‎[H⁺] = Ka × [HA] / [A⁻]‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎pH‎ لمنظم فيه ‎[HA] = 0.20‎ و‎[A⁻] = 0.050 (Ka = 1.0 × 10⁻⁵)‎.</td><td>‎[H⁺] = 4.0 × 10⁻⁵‎، ‎pH = 4.40‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما نسبة ‎[A⁻]/[HA]‎ اللازمة لمنظم ‎pH‎ له 5.76 من حمض الإيثانويك ‎(pKa = 4.76)‎؟</td><td>‎5.76 = 4.76 + log(‎النسبة)، النسبة = 10.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 52–55 وحل ثلاث مسائل ‎pH‎ للمنظمات</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة العلاقة وتعويض القيم بدقة</p>"]},{"axis":"استخدامات المحاليل المنظمة ودور ‎HCO₃⁻‎ في الدم ومراجعة الوحدة الأولى","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","المحاليل المنظمة"],["الحصة","3 من 3"],["محور الحصة","استخدامات المحاليل المنظمة ودور ‎HCO₃⁻‎ في الدم ومراجعة الوحدة الأولى"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 55–65 + كتاب التجارب ص 32"],["دليل المعلم","ص 73–78"],["كتاب التجارب العملية والأنشطة","نشاط 1-6: المحاليل المنظمة ص 32"]],"t":["1. يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم\n2. يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الأولى بقائمة التقويم الذاتي","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","منظم البيكربونات، ‎H₂CO₃/HCO₃⁻‎، ‎pH‎ الدم (نحو 7.4)، تطبيقات المنظمات (الأدوية، الأغذية، الشامبو)، ملخص الوحدة.","يعرض المعلم عبوات (شامبو، قطرة عين، دواء فوار) ويسأل: «ما المشترك بينها في المكونات الكيميائية؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض العبوات ويطرح السؤال\nالطالب: يستنتجون احتواءها على منظمات\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: ينفذ «ضبط الرقم الهيدروجيني في الدم» ويشرح معادلتي ‎HCO₃⁻‎ مع ‎H⁺‎ و‎H₂CO₃‎ مع ‎OH⁻‎\nالطالب: يكتبون المعادلتين ويفسرون الاستجابة\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوجه حل نشاط 1-6 (كتاب التجارب ص 32) وأسئلة مختارة من نهاية الوحدة (ص 59–65)\nالطالب: يحلون في مجموعات ويعرضون\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الأولى وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب معادلة استجابة منظم الدم لزيادة ‎H⁺‎.\n   الإجابة النموذجية: ‎HCO₃⁻ + H⁺ → H₂CO₃‎\n2) (المستوى المتوقع) السؤال: ما قيمة ‎pH‎ الدم الطبيعية تقريبًا؟\n   الإجابة النموذجية: نحو 7.4.\n3) (المستوى المتقدم) السؤال: اذكر استخدامين للمحاليل المنظمة.\n   الإجابة النموذجية: في الأدوية وقطرات العين، وفي حفظ الأغذية، وفي الشامبو ومنتجات العناية.","1) (مستوى الدعم) السؤال: ما الأيون الرئيس في منظم الدم؟\n   الإجابة النموذجية: أيون الهيدروجين كربونات ‎HCO₃⁻‎.\n2) (المستوى المتوقع) السؤال: اكتب معادلة استجابة منظم الدم لزيادة ‎OH⁻‎.\n   الإجابة النموذجية: ‎H₂CO₃ + OH⁻ → HCO₃⁻ + H₂O‎\n3) (المستوى المتقدم) السؤال: لماذا يُعد التغير البسيط في ‎pH‎ الدم خطرًا على الجسم؟\n   الإجابة النموذجية: لأن الإنزيمات والبروتينات تعمل ضمن مدى ضيق من ‎pH‎، والتغير يغير شكلها ويعطل وظائفها.","إرشاد للطالب: إكمال نشاط 1-6 ص 32 ومراجعة ملخص الوحدة ص 58 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الأولى"],"h":["<ol class=\"ol\"><li>يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم</li><li>يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الأولى بقائمة التقويم الذاتي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الأولى بقائمة التقويم الذاتي</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>منظم البيكربونات، ‎H₂CO₃/HCO₃⁻‎، ‎pH‎ الدم (نحو 7.4)، تطبيقات المنظمات (الأدوية، الأغذية، الشامبو)، ملخص الوحدة.</p>","<p>يعرض المعلم عبوات (شامبو، قطرة عين، دواء فوار) ويسأل: «ما المشترك بينها في المكونات الكيميائية؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض العبوات ويطرح السؤال</td><td>يستنتجون احتواءها على منظمات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>ينفذ «ضبط الرقم الهيدروجيني في الدم» ويشرح معادلتي ‎HCO₃⁻‎ مع ‎H⁺‎ و‎H₂CO₃‎ مع ‎OH⁻‎</td><td>يكتبون المعادلتين ويفسرون الاستجابة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–30</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-6 (كتاب التجارب ص 32) وأسئلة مختارة من نهاية الوحدة (ص 59–65)</td><td>يحلون في مجموعات ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة الأولى وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة استجابة منظم الدم لزيادة ‎H⁺‎.</td><td>‎HCO₃⁻ + H⁺ → H₂CO₃‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما قيمة ‎pH‎ الدم الطبيعية تقريبًا؟</td><td>نحو 7.4.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر استخدامين للمحاليل المنظمة.</td><td>في الأدوية وقطرات العين، وفي حفظ الأغذية، وفي الشامبو ومنتجات العناية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأيون الرئيس في منظم الدم؟</td><td>أيون الهيدروجين كربونات ‎HCO₃⁻‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة استجابة منظم الدم لزيادة ‎OH⁻‎.</td><td>‎H₂CO₃ + OH⁻ → HCO₃⁻ + H₂O‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد التغير البسيط في ‎pH‎ الدم خطرًا على الجسم؟</td><td>لأن الإنزيمات والبروتينات تعمل ضمن مدى ضيق من ‎pH‎، والتغير يغير شكلها ويعطل وظائفها.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-6 ص 32 ومراجعة ملخص الوحدة ص 58 وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الأولى</p>"]}]},{"title":"جهود الأقطاب الكهربائية ‎(E)‎","sb":"ص 67–69","unit":"الوحدة 2: الكيمياء الكهربائية","periods":[{"axis":"اتزان تفاعلات الأكسدة والاختزال وجهد القطب","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","جهود الأقطاب الكهربائية ‎(E)‎"],["الحصة","1 من 2"],["محور الحصة","اتزان تفاعلات الأكسدة والاختزال وجهد القطب"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 67–68"],["دليل المعلم","ص 101–103"],["كتاب التجارب العملية والأنشطة","نشاط 2-1: الخلايا الكهروكيميائية ص 44"]],"t":["1. يعرّف المصطلحات: جهد القطب، والقطب الكهربائي، ونصف الخلية\n2. يصف الاتزان بين فلز وأيوناته في المحلول وتكوّن فرق جهد بين الفلز والمحلول\nمخرج تعليمي آخر: يربط بين ميل الفلز لفقد الإلكترونات وقيمة جهد قطبه نسبيًا","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","الأكسدة، الاختزال، نصف الخلية، القطب الكهربائي، جهد القطب، اتزان الأكسدة والاختزال، الفلز وأيوناته.","يعرض المعلم ساق خارصين في محلول كبريتات النحاس ‎II‎ بعد دقائق (طبقة نحاس بنية) ويسأل: «من فقد الإلكترونات ومن كسبها؟ وهل يمكن جعل هذه الإلكترونات تمر في سلك؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الملاحظة ويطرح السؤال ومهام بداية الوحدة\nالطالب: يكتبون نصفي التفاعل ويحددون المؤكسد والمختزل\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح «اتزان تفاعلات الأكسدة والاختزال» بين فلز وأيوناته وتكوّن جهد القطب بالشكل 2-1\nالطالب: يرسمون مخططًا للاتزان ويقرؤون الموضوع 2-1\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يكلف الطلبة برسم مخطط الاتزان لفلزين مختلفين وتقويم مخططات بعضهم\nالطالب: يقارنون ميل ‎Zn‎ و‎Cu‎ لفقد الإلكترونات ويستنتجون الفرق في جهد القطب\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما المقصود بنصف الخلية؟\n   الإجابة النموذجية: فلز (أو قطب خامل) مغموس في محلول يحتوي أيوناته، يحدث فيه نصف تفاعل أكسدة أو اختزال.\n2) (المستوى المتوقع) السؤال: اكتب معادلة الاتزان لنصف الخلية ‎Zn²⁺/Zn‎.\n   الإجابة النموذجية: ‎Zn²⁺(aq) + 2e⁻ ⇌ Zn(s)‎\n3) (المستوى المتقدم) السؤال: لماذا يصبح الخارصين أكثر سالبية من النحاس في محلول أيوناته؟\n   الإجابة النموذجية: لأن ميله لفقد الإلكترونات أكبر، فيتراكم على سطحه عدد أكبر من الإلكترونات.","1) (مستوى الدعم) السؤال: عرّف جهد القطب.\n   الإجابة النموذجية: فرق الجهد الكهربائي بين الفلز (القطب) ومحلول أيوناته في نصف الخلية.\n2) (المستوى المتوقع) السؤال: ما العملية التي تحدث عند فقد الإلكترونات؟\n   الإجابة النموذجية: الأكسدة.\n3) (المستوى المتقدم) السؤال: لماذا لا يمكن قياس جهد قطب مفرد مباشرة؟\n   الإجابة النموذجية: لأن القياس يتطلب توصيل الفولتميتر بقطبين، فنقيس دائمًا فرقًا بين نصفي خلية.","إرشاد للطالب: مراجعة ص 67–68 وكتابة معادلات اتزان لثلاثة أنصاف خلايا\nإرشاد لولي الأمر: الحديث مع الابن عن البطاريات بوصفها خلايا كهروكيميائية"],"h":["<ol class=\"ol\"><li>يعرّف المصطلحات: جهد القطب، والقطب الكهربائي، ونصف الخلية</li><li>يصف الاتزان بين فلز وأيوناته في المحلول وتكوّن فرق جهد بين الفلز والمحلول</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط بين ميل الفلز لفقد الإلكترونات وقيمة جهد قطبه نسبيًا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف المصطلحات: جهد القطب، والقطب الكهربائي، ونصف الخلية</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف الاتزان بين فلز وأيوناته في المحلول وتكوّن فرق جهد بين الفلز والمحلول</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط بين ميل الفلز لفقد الإلكترونات وقيمة جهد قطبه نسبيًا</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>الأكسدة، الاختزال، نصف الخلية، القطب الكهربائي، جهد القطب، اتزان الأكسدة والاختزال، الفلز وأيوناته.</p>","<p>يعرض المعلم ساق خارصين في محلول كبريتات النحاس ‎II‎ بعد دقائق (طبقة نحاس بنية) ويسأل: «من فقد الإلكترونات ومن كسبها؟ وهل يمكن جعل هذه الإلكترونات تمر في سلك؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الملاحظة ويطرح السؤال ومهام بداية الوحدة</td><td>يكتبون نصفي التفاعل ويحددون المؤكسد والمختزل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح «اتزان تفاعلات الأكسدة والاختزال» بين فلز وأيوناته وتكوّن جهد القطب بالشكل 2-1</td><td>يرسمون مخططًا للاتزان ويقرؤون الموضوع 2-1</td></tr><tr><td class=\"tm\"> نية وقياس جهد الخلية"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 68–69 + كتاب التجارب ص 44"],["دليل المعلم","ص 101–103"],["كتاب التجارب العملية والأنشطة","نشاط 2-1: الخلايا الكهروكيميائية ص 44"]],"t":["1. يصف مكونات الخلية الجلفانية: نصفا الخلية، والسلك، والفولتميتر عالي المقاومة، والقنطرة الملحية\n2. يشرح وظيفة القنطرة الملحية وسبب استخدام فولتميتر عالي المقاومة\nمخرج تعليمي آخر: يحل نشاط 2-1 «الخلايا الكهروكيميائية» والسؤال 1","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نصفا خلية ‎Zn/Cu‎، قنطرة ملحية (ورق ترشيح مشبع بـ ‎KNO₃‎)، فولتميتر، أسلاك","الخلية الجلفانية (الكهروكيميائية)، القنطرة الملحية، الفولتميتر عالي المقاومة، الدائرة الخارجية، جهد الخلية.","يعرض المعلم ليمونة موصولة بمسماري خارصين ونحاس وفولتميتر يقرأ جهدًا ويسأل: «من أين جاء هذا الجهد؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض خلية الليمون\nالطالب: يقترحون تفاعل أكسدة واختزال بين الفلزين\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يبني خلية ‎Zn/Cu‎ أمام الطلبة ويشرح «قياس جهود الخلية» والشكل 2-3\nالطالب: يرسمون الخلية ويحددون أجزاءها واتجاه الإلكترونات\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 2-1 (كتاب التجارب ص 44) والسؤال 1\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما وظيفة القنطرة الملحية؟\n   الإجابة النموذجية: إكمال الدائرة الكهربائية بالسماح بحركة الأيونات بين نصفي الخلية دون اختلاط المحلولين.\n2) (المستوى المتوقع) السؤال: لماذا يُستخدم فولتميتر عالي المقاومة؟\n   الإجابة النموذجية: لمنع مرور تيار كبير يغير التراكيز فيقيس فرق الجهد الأقصى للخلية.\n3) (المستوى المتقدم) السؤال: لماذا لا تُستخدم قنطرة من سلك فلزي بدل القنطرة الملحية؟\n   الإجابة النموذجية: لأن السلك ينقل الإلكترونات لا الأيونات، فلا يعادل تراكم الشحنات في المحلولين.","1) (مستوى الدعم) السؤال: ما الأيونات المستخدمة عادة في القنطرة الملحية؟\n   الإجابة النموذجية: أيونات ملح لا يتفاعل مثل ‎KNO₃‎ أو ‎KCl‎.\n2) (المستوى المتوقع) السؤال: في خلية ‎Zn/Cu‎، في أي اتجاه تتحرك الإلكترونات في السلك؟\n   الإجابة النموذجية: من الخارصين إلى النحاس.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لقراءة الفولتميتر إذا أُزيلت القنطرة الملحية؟\n   الإجابة النموذجية: تهبط إلى الصفر لأن الدائرة تصبح مفتوحة.","إرشاد للطالب: إكمال نشاط 2-1 ص 44 والسؤال 1\nإرشاد لولي الأمر: يمكن تنفيذ خلية الليمون في المنزل بإشراف ولي الأمر"],"h":["<ol class=\"ol\"><li>يصف مكونات الخلية الجلفانية: نصفا الخلية، والسلك، والفولتميتر عالي المقاومة، والقنطرة الملحية</li><li>يشرح وظيفة القنطرة الملحية وسبب استخدام فولتميتر عالي المقاومة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 2-1 «الخلايا الكهروكيميائية» والسؤال 1</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف مكونات الخلية الجلفانية: نصفا الخلية، والسلك، والفولتميتر عالي المقاومة، والقنطرة الملحية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح وظيفة القنطرة الملحية وسبب استخدام فولتميتر عالي المقاومة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 2-1 «الخلايا الكهروكيميائية» والسؤال 1</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: نصفا خلية ‎Zn/Cu‎، قنطرة ملحية (ورق ترشيح مشبع بـ ‎KNO₃‎)، فولتميتر، أسلاك</span></div>","<p>الخلية الجلفانية (الكهروكيميائية)، القنطرة الملحية، الفولتميتر عالي المقاومة، الدائرة الخارجية، جهد الخلية.</p>","<p>يعرض المعلم ليمونة موصولة بمسماري خارصين ونحاس وفولتميتر يقرأ جهدًا ويسأل: «من أين جاء هذا الجهد؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض خلية الليمون</td><td>يقترحون تفاعل أكسدة واختزال بين الفلزين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يبني خلية ‎Zn/Cu‎ أمام الطلبة ويشرح «قياس جهود الخلية» والشكل 2-3</td><td>يرسمون الخلية ويحددون أجزاءها واتجاه الإلكترونات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 2-1 (كتاب التجارب ص 44) والسؤال 1</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة القنطرة الملحية؟</td><td>إكمال الدائرة الكهربائية بالسماح بحركة الأيونات بين نصفي الخلية دون اختلاط المحلولين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُستخدم فولتميتر عالي المقاومة؟</td><td>لمنع مرور تيار كبير يغير التراكيز فيقيس فرق الجهد الأقصى للخلية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تُستخدم قنطرة من سلك فلزي بدل القنطرة الملحية؟</td><td>لأن السلك ينقل الإلكترونات لا الأيونات، فلا يعادل تراكم الشحنات في المحلولين.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأيونات المستخدمة عادة في القنطرة الملحية؟</td><td>أيونات ملح لا يتفاعل مثل ‎KNO₃‎ أو ‎KCl‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>في خلية ‎Zn/Cu‎، في أي اتجاه تتحرك الإلكترونات في السلك؟</td><td>من الخارصين إلى النحاس.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث لقراءة الفولتميتر إذا أُزيلت القنطرة الملحية؟</td><td>تهبط إلى الصفر لأن الدائرة تصبح مفتوحة.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-1 ص 44 والسؤال 1</p><p><b>إرشاد لولي الأمر:</b> يمكن تنفيذ خلية الليمون في المنزل بإشراف ولي الأمر</p>"]}]},{"title":"قياس جهود الأقطاب القياسية","sb":"ص 70–75","unit":"الوحدة 2: الكيمياء الكهربائية","periods":[{"axis":"قطب الهيدروجين القياسي","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","قياس جهود الأقطاب القياسية"],["الحصة","1 من 5"],["محور الحصة","قطب الهيدروجين القياسي"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 70–71"],["دليل المعلم","ص 103–106"],["كتاب التجارب العملية والأنشطة","نشاط 2-2: استخدام جهد الاختزال القياسي ص 47"]],"t":["1. يصف قطب الهيدروجين القياسي ومكوناته والظروف القياسية له\n2. يذكر أن جهد قطب الهيدروجين القياسي اصطلح على أنه ‎0.00 V‎\nمخرج تعليمي آخر: يفسر لماذا يُغلف لوح البلاتين بطبقة مسامية من البلاتين الأسود","المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","قطب الهيدروجين القياسي، البلاتين الأسود، غاز الهيدروجين ‎100 kPa‎، ‎[H⁺] = 1.00 mol/dm³‎، ‎298 K‎، القطب المرجعي.","يسأل المعلم: «لقياس طول قمم الجبال نستخدم مستوى سطح البحر مرجعًا صفريًا؛ فما المرجع الصفري لقياس جهود الأقطاب؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح تشبيه مستوى سطح البحر\nالطالب: يستنتجون الحاجة إلى قطب مرجعي\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: ينفذ نشاط «قطب الهيدروجين القياسي» ويشرح الشكل 2-4 والظروف القياسية\nالطالب: يرسمون القطب ويكتبون مواصفاته\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يعرض مقطعًا (الجزء الأول) عن قطب الهيدروجين ويطرح أسئلة توقف\nالطالب: يجيبون عن أسئلة التوقف في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما قيمة جهد قطب الهيدروجين القياسي؟\n   الإجابة النموذجية: ‎0.00 V‎.\n2) (المستوى المتوقع) السؤال: اذكر الظروف القياسية لقطب الهيدروجين.\n   الإجابة النموذجية: ضغط ‎H₂‎ يساوي ‎100 kPa‎، و‎[H⁺] = 1.00 mol/dm³‎، ودرجة حرارة ‎298 K‎.\n3) (المستوى المتقدم) السؤال: لماذا يُستخدم البلاتين في هذا القطب؟\n   الإجابة النموذجية: لأنه خامل لا يتفاعل، ويوصل الكهرباء، ويحفز اتزان ‎H⁺/H₂‎ على سطحه.","1) (مستوى الدعم) السؤال: اكتب نصف المعادلة التي تحدث عند قطب الهيدروجين.\n   الإجابة النموذجية: ‎2H⁺(aq) + 2e⁻ ⇌ H₂(g)‎\n2) (المستوى المتوقع) السؤال: ما وظيفة قطب الهيدروجين القياسي؟\n   الإجابة النموذجية: قطب مرجعي تُقاس بالنسبة إليه جهود الأقطاب الأخرى.\n3) (المستوى المتقدم) السؤال: لماذا يُغلف البلاتين بالبلاتين الأسود المسامي؟\n   الإجابة النموذجية: لزيادة مساحة السطح فيسرع الوصول إلى الاتزان بين ‎H⁺‎ و‎H₂‎.","إرشاد للطالب: مراجعة ص 70–71 ورسم قطب الهيدروجين القياسي مع مواصفاته\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «مستوى سطح البحر» وعلاقته بالقطب المرجعي"],"h":["<ol class=\"ol\"><li>يصف قطب الهيدروجين القياسي ومكوناته والظروف القياسية له</li><li>يذكر أن جهد قطب الهيدروجين القياسي اصطلح على أنه ‎0.00 V‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يُغلف لوح البلاتين بطبقة مسامية من البلاتين الأسود</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف قطب الهيدروجين القياسي ومكوناته والظروف القياسية له</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يذكر أن جهد قطب الهيدروجين القياسي اصطلح على أنه ‎0.00 V‎</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يُغلف لوح البلاتين بطبقة مسامية من البلاتين الأسود</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>قطب الهيدروجين القياسي، البلاتين الأسود، غاز الهيدروجين ‎100 kPa‎، ‎[H⁺] = 1.00 mol/dm³‎، ‎298 K‎، القطب المرجعي.</p>","<p>يسأل المعلم: «لقياس طول قمم الجبال نستخدم مستوى سطح البحر مرجعًا صفريًا؛ فما المرجع الصفري لقياس جهود الأقطاب؟»</p>","<table
