tt‎ بالمثال 1 خطوة بخطوة</td><td>يتبعون الحل ويطبقونه على بيانات ‎NaCl‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نص قانون هس؟</td><td>التغير الكلي في المحتوى الحراري لتفاعل لا يعتمد على المسار، بل على الحالتين الابتدائية والنهائية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الخطوات التي يتكون منها ‎ΔH1‎ لـ ‎NaCl‎؟</td><td>تذرير ‎Na‎، والتأين الأول لـ ‎Na‎، وتذرير ‎Cl‎، والألفة الإلكترونية الأولى لـ ‎Cl‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH1‎ لـ ‎NaCl‎ إذا كانت: ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.</td><td>‎ΔH1 = 107 + 496 + 122 − 349 = +376 kJ/mol‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب العلاقة بين ‎ΔH°f‎ و‎ΔH1‎ و‎ΔH°latt‎.</td><td>‎ΔH°f = ΔH1 + ΔH°latt‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎ΔH°latt‎ لـ ‎NaCl‎ إذا كانت ‎ΔH°f = −411 kJ/mol‎ و‎ΔH1 = +376 kJ/mol‎.</td><td>‎ΔH°latt = −411 − 376 = −787 kJ/mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يجب أن تبدأ الحلقة وتنتهي بالمواد نفسها؟</td><td>لأن قانون هس يتطلب أن يكون مجموع التغيرات في المسار المغلق صفرًا، فنحسب المجهول من بقية الخطوات.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 116–117 ورسم حلقة الطاقة لـ ‎NaCl‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه «طريقي الجبل» لقانون هس</p>"]},{"axis":"حساب طاقة الشبكة البلورية بحلقة بورن-هابر لمركبات أحادية الشحنة","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","حلقة (دورة) بورن-هابر"],["الحصة","2 من 6"],["محور الحصة","حساب طاقة الشبكة البلورية بحلقة بورن-هابر لمركبات أحادية الشحنة"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 117–118"],["دليل المعلم","ص 151–156"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: حلقات بورن-هابر ص 76"]],"t":["1. يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1\n2. يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر\nمخرج تعليمي آخر: يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، ورق رسم","حلقة بورن-هابر، المستويات الطاقية، الأسهم الصاعدة (ماصة) والهابطة (طاردة)، ‎ΔH°f‎، ‎IE1‎، ‎EA1‎، ‎ΔH°at‎.","يعرض المعلم حلقة بورن-هابر لـ ‎NaCl‎ بأسهم مخفية ويسأل: «أي الخطوات ترفعنا إلى أعلى (ماصة) وأيها تنزل بنا (طاردة)؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الحلقة ويطرح السؤال\nالطالب: يصنفون الخطوات حسب الإشارة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: ينفذ «حساب طاقات الشبكة البلورية باستخدام حلقة بورن-هابر» ويرسم الحلقة كاملة لـ ‎KCl‎\nالطالب: يرسمون الحلقة بمقياس تقريبي ويكتبون القيم\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوجه حل السؤال 4 (ب) ورسم حلقة لمركب آخر\nالطالب: يرسمون ويحسبون ويتحققون من الإشارات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما اتجاه سهم الألفة الإلكترونية الأولى للكلور في الحلقة؟\n   الإجابة النموذجية: هابط (طاردة للحرارة).\n2) (المستوى المتوقع) السؤال: احسب ‎ΔH°latt‎ لـ ‎KCl‎ إذا كانت: ‎ΔH°f = −437‎، ‎ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.\n   الإجابة النموذجية: ‎ΔH1 = 89 + 419 + 122 − 349 = +281‎؛ ‎ΔH°latt = −437 − 281 = −718 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: لماذا يكون سهم طاقة الشبكة هابطًا؟\n   الإجابة النموذجية: لأنها طاردة للحرارة (تكوين الشبكة من الأيونات الغازية يطلق طاقة).","1) (مستوى الدعم) السؤال: ما أول خطوة في حلقة بورن-هابر لتكوين ‎NaCl‎؟\n   الإجابة النموذجية: تذرير الصوديوم (أو تذرير الكلور).\n2) (المستوى المتوقع) السؤال: احسب ‎ΔH°latt‎ لـ ‎LiCl‎ إذا كانت ‎ΔH°f = −409‎ و‎ΔH1 = +440 kJ/mol‎.\n   الإجابة النموذجية: ‎ΔH°latt = −409 − 440 = −849 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: طالب حصل على ‎+718 kJ/mol‎ لطاقة شبكة ‎KCl‎. ما الخطأ المحتمل؟\n   الإجابة النموذجية: عكس الإشارة؛ إذ يجب أن تكون طاقة الشبكة سالبة، والأرجح أنه حسب ‎ΔH1 − ΔH°f‎ بدل ‎ΔH°f − ΔH1‎.","إرشاد للطالب: مراجعة ص 117–118 ورسم حلقة بورن-هابر لـ ‎KCl‎\nإرشاد لولي الأمر: متابعة الابن في التحقق من إشارة الناتج النهائي"],"h":["<ol class=\"ol\"><li>يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1</li><li>يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية، ورق رسم</span></div>","<p>حلقة بورن-هابر، المستويات الطاقية، الأسهم الصاعدة (ماصة) والهابطة (طاردة)، ‎ΔH°f‎، ‎IE1‎، ‎EA1‎، ‎ΔH°at‎.</p>","<p>يعرض المعلم حلقة بورن-هابر لـ ‎NaCl‎ بأسهم مخفية ويسأل: «أي الخطوات ترفعنا إلى أعلى (ماصة) وأيها تنزل بنا (طاردة)؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الحلقة ويطرح السؤال</td><td>يصن </b> مراجعة ص 117–118 ورسم حلقة بورن-هابر لـ ‎KCl‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التحقق من إشارة الناتج النهائي</p>"]},{"axis":"حلقة بورن-هابر لمركب كاتيونه ثنائي الشحنة ‎(MgCl₂)‎","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","حلقة (دورة) بورن-هابر"],["الحصة","3 من 6"],["محور الحصة","حلقة بورن-هابر لمركب كاتيونه ثنائي الشحنة ‎(MgCl₂)‎"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 118–119"],["دليل المعلم","ص 151–156"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: حلقات بورن-هابر ص 76"]],"t":["1. يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎\n2. يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة\nمخرج تعليمي آخر: يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","الكاتيون ثنائي الشحنة، طاقة التأين الثانية ‎IE2‎، مضاعفة ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎، صيغة المركب.","يسأل المعلم: «في ‎MgCl₂‎ ذرة مغنيسيوم واحدة وذرتا كلور؛ فكيف تتغير خطوات الحلقة مقارنة بـ ‎NaCl‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون مضاعفة خطوات الكلور وإضافة ‎IE2‎\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يرسم حلقة ‎MgCl₂‎ خطوة بخطوة ويحسب ‎ΔH°latt‎\nالطالب: يتبعون الرسم ويكتبون القيم\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم بيانات ‎CaCl₂‎ لحسابها في مجموعات\nالطالب: يرسمون الحلقة ويحسبون ويتحققون من مضاعفة الخطوات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا تُضاعف ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎ في حلقة ‎MgCl₂‎؟\n   الإجابة النموذجية: لأن الصيغة تحتوي أيوني ‎Cl⁻‎ فيلزم تكوين مولين من ذرات الكلور ثم من أيوناته.\n2) (المستوى المتوقع) السؤال: احسب ‎ΔH1‎ لـ ‎MgCl₂: ΔH°at(Mg) = +148‎، ‎IE1 = +736‎، ‎IE2 = +1450‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.\n   الإجابة النموذجية: ‎148 + 736 + 1450 + 2(122) + 2(−349) = +1880 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH°latt‎ لـ ‎MgCl₂‎ إذا كانت ‎ΔH°f = −641 kJ/mol‎.\n   الإجابة النموذجية: ‎−641 − 1880 = −2521 kJ/mol‎.","1) (مستوى الدعم) السؤال: ما الخطوة الإضافية في حلقة ‎MgCl₂‎ مقارنة بـ ‎NaCl‎ للفلز؟\n   الإجابة النموذجية: طاقة التأين الثانية ‎IE2‎ للمغنيسيوم.\n2) (المستوى المتوقع) السؤال: لماذا طاقة شبكة ‎MgCl₂‎ أكبر مقدارًا من ‎NaCl‎؟\n   الإجابة النموذجية: لأن شحنة ‎Mg²⁺‎ ضعف شحنة ‎Na⁺‎ وحجمه أصغر فيكون الجذب أقوى.\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH°latt‎ لـ ‎CaCl₂: ΔH°f = −796‎، ‎ΔH°at(Ca) = +178‎، ‎IE1 = +590‎، ‎IE2 = +1145‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.\n   الإجابة النموذجية: ‎ΔH1 = 178 + 590 + 1145 + 244 − 698 = +1459‎؛ ‎ΔH°latt = −796 − 1459 = −2255 kJ/mol‎.","إرشاد للطالب: مراجعة ص 118–119 وحل مسألة ‎CaCl₂‎\nإرشاد لولي الأمر: متابعة الابن في تذكر مضاعفة خطوات الأنيون حسب الصيغة"],"h":["<ol class=\"ol\"><li>يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎</li><li>يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>الكاتيون ثنائي الشحنة، طاقة التأين الثانية ‎IE2‎، مضاعفة ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎، صيغة المركب.</p>","<p>يسأل المعلم: «في ‎MgCl₂‎ ذرة مغنيسيوم واحدة وذرتا كلور؛ فكيف تتغير خطوات الحلقة مقارنة بـ ‎NaCl‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون مضاعفة خطوات الكلور وإضافة ‎IE2‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يرسم حلقة ‎MgCl₂‎ خطوة بخطوة ويحسب ‎ΔH°latt‎</td><td>يتبعون الرسم ويكتبون القيم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم بيانات ‎CaCl₂‎ لحسابها في مجموعات</td><td>يرسمون الحلقة ويحسبون ويتحققون من مضاعفة الخطوات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تُضاعف ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎ في حلقة ‎MgCl₂‎؟</td><td>لأن الصيغة تحتوي أيوني ‎Cl⁻‎ فيلزم تكوين مولين من ذرات الكلور ثم من أيوناته.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎ΔH1‎ لـ ‎MgCl₂: ΔH°at(Mg) = +148‎، ‎IE1 = +736‎، ‎IE2 = +1450‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.</td><td>‎148 + 736 + 1450 + 2(122) + 2(−349) = +1880 kJ/mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH°latt‎ لـ ‎MgCl₂‎ إذا كانت ‎ΔH°f = −641 kJ/mol‎.</td><td>‎−641 − 1880 = −2521 kJ/mol‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطوة الإضافية في حلقة ‎MgCl₂‎ مقارنة بـ ‎NaCl‎ للفلز؟</td><td>طاقة التأين الثانية ‎IE2‎ للمغنيسيوم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا طاقة شبكة ‎MgCl₂‎ أكبر مقدارًا من ‎NaCl‎؟</td><td>لأن شحنة ‎Mg²⁺‎ ضعف شحنة ‎Na⁺‎ وحجمه أصغر فيكون الجذب أقوى.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH°latt‎ لـ ‎CaCl₂: ΔH°f = −796‎، ‎ΔH°at(Ca) = +178‎، ‎IE1 = +590‎، ‎IE2 = +1145‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.</td><td>‎ΔH1 = 178 + 590 + 1145 + 244 − 698 = +1459‎؛ ‎ΔH°latt = −796 − 1459 = −2255 kJ/mol‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 118–119 وحل مسألة ‎CaCl₂‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في تذكر مضاعفة خطوات الأنيون حسب الصيغة</p>"]},{"axis":"حلقة بورن-هابر لمركب أنيونه ثنائي الشحنة ‎(MgO)‎ والألفة الثانية","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","حلقة (دورة) بورن-هابر"],["الحصة","4 من 6"],["محور الحصة","حلقة بورن-هابر لمركب أنيونه ثنائي الشحنة ‎(MgO)‎ والألفة الثانية"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 119–121"],["دليل المعلم","ص 151–156"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: حلقات بورن-هابر ص 76"]],"t":["1. يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎\n2. يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة\nمخرج تعليمي آخر: يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","الأنيون ثنائي الشحنة، ‎EA2‎ الماصة، تذرير الأكسجين ‎(½O₂)‎، ‎MgO‎، ‎Na₂O‎، تعويض طاقة الشبكة الكبيرة.","يسأل المعلم: «تكوين ‎O²⁻‎ من ‎O‎ يحتاج طاقة ‎(+657 kJ/mol)‎، فلماذا يتكون أكسيد المغنيسيوم بسهولة عند احتراق الشريط؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون أن طاقة الشبكة الكبيرة تعوض ذلك\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يرسم حلقة ‎MgO‎ بخطواتها ويحسب ‎ΔH°latt‎\nالطالب: يتبعون ويكتبون القيم\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم بيانات ‎Na₂O‎ لحساب طاقة شبكتها في مجموعات\nالطالب: يرسمون ويحسبون مع مضاعفة خطوات الصوديوم\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخطوتان الخاصتان بالأكسجين بعد تذريره؟\n   الإجابة النموذجية: ‎EA1 (‎طاردة) ثم ‎EA2 (‎ماصة).\n2) (المستوى المتوقع) السؤال: احسب ‎ΔH1‎ لـ ‎MgO: ΔH°at(Mg) = +148‎، ‎IE1+IE2 = +2186‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.\n   الإجابة النموذجية: ‎148 + 2186 + 249 − 141 + 798 = +3240 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH°latt‎ لـ ‎MgO‎ إذا كانت ‎ΔH°f = −602 kJ/mol‎.\n   الإجابة النموذجية: ‎−602 − 3240 = −3842 kJ/mol‎.","1) (مستوى الدعم) السؤال: ما سبب تكون ‎MgO‎ رغم أن ‎EA2‎ ماصة؟\n   الإجابة النموذجية: لأن طاقة الشبكة كبيرة جدًا (طاردة) فتعوض الخطوات الماصة ويكون ‎ΔH°f‎ سالبًا.\n2) (المستوى المتوقع) السؤال: في حلقة ‎Na₂O‎، ما الخطوات التي تُضاعف؟\n   الإجابة النموذجية: تذرير ‎Na‎ و‎IE1‎ لـ ‎Na‎.\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH°latt‎ لـ ‎Na₂O: ΔH°f = −414‎، ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.\n   الإجابة النموذجية: ‎ΔH1 = 2(107) + 2(496) + 249 − 141 + 798 = +2112‎؛ ‎ΔH°latt = −414 − 2112 = −2526 kJ/mol‎.","إرشاد للطالب: مراجعة ص 119–121 وحل مسألة ‎Na₂O‎\nإرشاد لولي الأمر: سؤال الابن عن سبب تكون الأكاسيد رغم أن ‎EA2‎ ماصة"],"h":["<ol class=\"ol\"><li>يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎</li><li>يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>الأنيون ثنائي الشحنة، ‎EA2‎ الماصة، تذرير الأكسجين ‎(½O₂)‎، ‎MgO‎، ‎Na₂O‎، تعويض طاقة الشبكة الكبيرة.</p>","<p>يسأل المعلم: «تكوين ‎O²⁻‎ من ‎O‎ يحتاج طاقة ‎(+657 kJ/mol)‎، فلماذا يتكون أكسيد المغنيسيوم بسهولة عند احتراق الشريط؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون أن طاقة الشبكة الكبيرة تعوض ذلك</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يرسم حلقة ‎MgO‎ بخطواتها ويحسب ‎ΔH°latt‎</td><td>يتبعون ويكتبون القيم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم بيانات ‎Na₂O‎ لحساب طاقة شبكتها في مجموعات</td><td>يرسمون ويحسبون مع مضاعفة خطوات الصوديوم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطوتان الخاصتان بالأكسجين بعد تذريره؟</td><td>‎EA1 (‎طاردة) ثم ‎EA2 (‎ماصة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎ΔH1‎ لـ ‎MgO: ΔH°at(Mg) = +148‎، ‎IE1+IE2 = +2186‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.</td><td>‎148 + 2186 + 249 − 141 + 798 = +3240 kJ/mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH°latt‎ لـ ‎MgO‎ إذا كانت ‎ΔH°f = −602 kJ/mol‎.</td><td>‎−602 − 3240 = −3842 kJ/mol‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما سبب تكون ‎MgO‎ رغم أن ‎EA2‎ ماصة؟</td><td>لأن طاقة الشبكة كبيرة جدًا (طاردة) فتعوض الخطوات الماصة ويكون ‎ΔH°f‎ سالبًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>في حلقة ‎Na₂O‎، ما الخطوات التي تُضاعف؟</td><td>تذرير ‎Na‎ و‎IE1‎ لـ ‎Na‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH°latt‎ لـ ‎Na₂O: ΔH°f = −414‎، ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.</td><td>‎ΔH1 = 2(107) + 2(496) + 249 − 141 + 798 = +2112‎؛ ‎ΔH°latt = −414 − 2112 = −2526 kJ/mol‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 119–121 وحل مسألة ‎Na₂O‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن سبب تكون الأكاسيد رغم أن ‎EA2‎ ماصة</p>"]},{"axis":"نشاط 3-1 والأسئلة 4–8","n":5,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","حلقة (دورة) بورن-هابر"],["الحصة","5 من 6"],["محور الحصة","نشاط 3-1 والأسئلة 4–8"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 116–121 + كتاب التجارب ص 76"],["دليل المعلم","ص 151–156"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: حلقات بورن-هابر ص 76"]],"t":["1. يحل نشاط 3-1 «حلقات بورن-هابر»\n2. يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات\nمخرج تعليمي آخر: يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التقييم التبادلي","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","الأخطاء الشائعة: نسيان المضاعفة، عكس الإشارة، استخدام ‎IE‎ بدل ‎EA‎، الخلط بين ‎ΔH°f‎ و‎ΔH°latt‎.","يعرض المعلم ثلاثة حلول لمسألة واحدة فيها أخطاء مختلفة ويطلب من المجموعات تحديد الخطأ في كل حل خلال ثلاث دقائق.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الحلول\nالطالب: يحددون الأخطاء\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 3-1 (كتاب التجارب ص 76)\nالطالب: يحلون فرديًا\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يوجه حل الأسئلة 4–8 مع تقييم تبادلي\nالطالب: يتبادلون الحلول ويقيّمونها\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على حلقات بورن-هابر\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخطأ في استخدام ‎ΔH°at(Cl)‎ مرة واحدة لـ ‎CaCl₂‎؟\n   الإجابة النموذجية: يجب مضاعفتها لأن الصيغة تحتوي ذرتي كلور.\n2) (المستوى المتوقع) السؤال: ما الفرق بين ‎ΔH°f‎ و‎ΔH°latt‎؟\n   الإجابة النموذجية: ‎ΔH°f‎ تكوين مول من المركب من عناصره في حالتها القياسية، و‎ΔH°latt‎ تكوينه من أيوناته الغازية.\n3) (المستوى المتقدم) السؤال: كيف تتحقق من صحة ناتج طاقة الشبكة؟\n   الإجابة النموذجية: بأن تكون سالبة وبمقدار معقول مقارنة بمركبات مشابهة.","1) (مستوى الدعم) السؤال: احسب ‎ΔH°latt‎ لـ ‎NaBr: ΔH°f = −361‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(Br) = +112‎، ‎EA1(Br) = −325‎.\n   الإجابة النموذجية: ‎ΔH1 = 390‎؛ ‎ΔH°latt = −361 − 390 = −751 kJ/mol‎.\n2) (المستوى المتوقع) السؤال: لماذا طاقة شبكة ‎NaBr‎ أقل مقدارًا من ‎NaCl (−787)‎؟\n   الإجابة النموذجية: لأن ‎Br⁻‎ أكبر حجمًا من ‎Cl⁻‎ فيضعف الجذب.\n3) (المستوى المتقدم) السؤال: قيّم حل زميلك لمسألة ‎Na₂O‎ واذكر خطأ شائعًا تتوقع وجوده.\n   الإجابة النموذجية: تقييم يذكر مثلًا نسيان مضاعفة ‎IE1‎ لـ ‎Na‎ أو إهمال ‎EA2‎ أو إشارتها.","إرشاد للطالب: إكمال نشاط 3-1 ص 76 والأسئلة 4–8\nإرشاد لولي الأمر: متابعة الابن في قائمة الأخطاء الشائعة وتجنبها"],"h":["<ol class=\"ol\"><li>يحل نشاط 3-1 «حلقات بورن-هابر»</li><li>يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 3-1 «حلقات بورن-هابر»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التقييم التبادلي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الأخطاء الشائعة: نسيان المضاعفة، عكس الإشارة، استخدام ‎IE‎ بدل ‎EA‎، الخلط بين ‎ΔH°f‎ و‎ΔH°latt‎.</p>","<p>يعرض المعلم ثلاثة حلول لمسألة واحدة فيها أخطاء مختلفة ويطلب من المجموعات تحديد الخطأ في كل حل خلال ثلاث دقائق.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الحلول</td><td>يحددون الأخطاء</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 3-1 (كتاب التجارب ص 76)</td><td>يحلون فرديًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يوجه حل الأسئلة 4–8 مع تقييم تبادلي</td><td>يتبادلون الحلول ويقيّمونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على حلقات بورن-هابر</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطأ في استخدام ‎ΔH°at(Cl)‎ مرة واحدة لـ ‎CaCl₂‎؟</td><td>يجب مضاعفتها لأن الصيغة تحتوي ذرتي كلور.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الفرق بين ‎ΔH°f‎ و‎ΔH°latt‎؟</td><td>‎ΔH°f‎ تكوين مول من المركب من عناصره في حالتها القياسية، و‎ΔH°latt‎ تكوينه من أيوناته الغازية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف تتحقق من صحة ناتج طاقة الشبكة؟</td><td>بأن تكون سالبة وبمقدار معقول مقارنة بمركبات مشابهة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎ΔH°latt‎ لـ ‎NaBr: ΔH°f = −361‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(Br) = +112‎، ‎EA1(Br) = −325‎.</td><td>‎ΔH1 = 390‎؛ ‎ΔH°latt = −361 − 390 = −751 kJ/mol‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا طاقة شبكة ‎NaBr‎ أقل مقدارًا من ‎NaCl (−787)‎؟</td><td>لأن ‎Br⁻‎ أكبر حجمًا من ‎Cl⁻‎ فيضعف الجذب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم حل زميلك لمسألة ‎Na₂O‎ واذكر خطأ شائعًا تتوقع وجوده.</td><td>تقييم يذكر مثلًا نسيان مضاعفة ‎IE1‎ لـ ‎Na‎ أو إهمال ‎EA2‎ أو إشارتها.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 3-1 ص 76 والأسئلة 4–8</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في قائمة الأخطاء الشائعة وتجنبها</p>"]},{"axis":"مسائل متقدمة: حساب قيمة مجهولة في الحلقة","n":6,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","حلقة (دورة) بورن-هابر"],["الحصة","6 من 6"],["محور الحصة","مسائل متقدمة: حساب قيمة مجهولة في الحلقة"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 116–121"],["دليل المعلم","ص 151–156"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: حلقات بورن-هابر ص 76"]],"t":["1. يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎)\n2. يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎\nمخرج تعليمي آخر: يصمم مسألة عكسية على حلقة بورن-هابر مع حلها","المخرج 1: تحليل\nالمخرج 2: تقييم\nالمخرج الآخر: إبداع","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: آلة حاسبة علمية","إعادة ترتيب علاقة هس، القيمة المجهولة، المركبات الافتراضية، ثبات المركب، ‎ΔH°f‎ الموجبة.","يسأل المعلم: «لماذا لا يوجد مركب ‎NaCl₂‎ مع أن ‎Mg‎ يكوّن ‎MgCl₂‎؟ هل يمكن لحلقة بورن-هابر أن تجيب؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يتوقعون أثر ‎IE2‎ الكبيرة جدًا للصوديوم\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يحل مثالًا لحساب ‎EA1‎ مجهولة ومثالًا لحساب ‎ΔH°f‎ لمركب افتراضي\nالطالب: يتبعون إعادة ترتيب العلاقة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يكلّف المجموعات بتصميم مسألة عكسية وتبادلها\nالطالب: يصممون ويحلون مسائل زملائهم\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة حلقات بورن-هابر\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف تحسب ‎EA1‎ من الحلقة إذا عُلمت بقية القيم؟\n   الإجابة النموذجية: ‎EA1 = ΔH°f − (ΔH°latt +‎ بقية خطوات ‎ΔH1‎ المعلومة).\n2) (المستوى المتوقع) السؤال: احسب ‎EA1‎ لعنصر ‎X‎ إذا كانت: ‎ΔH°f(NaX) = −411‎، ‎ΔH°latt = −787‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(X) = +122‎.\n   الإجابة النموذجية: ‎−411 = 107 + 496 + 122 + EA1 − 787 ← EA1 = −349 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: لماذا لا يتكون ‎NaCl₂‎؟\n   الإجابة النموذجية: لأن ‎IE2‎ للصوديوم كبيرة جدًا (نزع إلكترون من غلاف داخلي) فلا تعوضها طاقة الشبكة، فتكون ‎ΔH°f‎ موجبة كبيرة.","1) (مستوى الدعم) السؤال: ماذا تعني ‎ΔH°f‎ موجبة كبيرة لمركب افتراضي؟\n   الإجابة النموذجية: أنه غير ثابت طاقيًا ولا يتكون عمليًا.\n2) (المستوى المتوقع) السؤال: احسب ‎ΔH°f‎ لـ ‎KBr: ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Br) = +112‎، ‎EA1 = −325‎، ‎ΔH°latt = −679‎.\n   الإجابة النموذجية: ‎ΔH°f = 89 + 419 + 112 − 325 − 679 = −384 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: صمم مسألة لحساب ‎IE1‎ مجهولة لفلز مع حلها.\n   الإجابة النموذجية: مسألة تعطي ‎ΔH°f‎ و‎ΔH°latt‎ و‎ΔH°at‎ للعنصرين و‎EA1‎، والحل: ‎IE1 = ΔH°f − (‎المجموع المعلوم).","إرشاد للطالب: حل المسائل العكسية الثلاث ومراجعة جميع حلقات الوحدة\nإرشاد لولي الأمر: تشجيع الابن على مراجعة المسألة التي صممها زميله وحلها"],"h":["<ol class=\"ol\"><li>يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎)</li><li>يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم مسألة عكسية على حلقة بورن-هابر مع حلها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎</td><td class=\"lv\">تقييم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصمم مسألة عكسية على حلقة بورن-هابر مع حلها</td><td class=\"lv\">إبداع</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>إعادة ترتيب علاقة هس، القيمة المجهولة، المركبات الافتراضية، ثبات المركب، ‎ΔH°f‎ الموجبة.</p>","<p>يسأل المعلم: «لماذا لا يوجد مركب ‎NaCl₂‎ مع أن ‎Mg‎ يكوّن ‎MgCl₂‎؟ هل يمكن لحلقة بورن-هابر أن تجيب؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يتوقعون أثر ‎IE2‎ الكبيرة جدًا للصوديوم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يحل مثالًا لحساب ‎EA1‎ مجهولة ومثالًا لحساب ‎ΔH°f‎ لمركب افتراضي</td><td>يتبعون إعادة ترتيب العلاقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يكلّف المجموعات بتصميم مسألة عكسية وتبادلها</td><td>يصممون ويحلون مسائل زملائهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة حلقات بورن-هابر</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تحسب ‎EA1‎ من الحلقة إذا عُلمت بقية القيم؟</td><td>‎EA1 = ΔH°f − (ΔH°latt +‎ بقية خطوات ‎ΔH1‎ المعلومة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎EA1‎ لعنصر ‎X‎ إذا كانت: ‎ΔH°f(NaX) = −411‎، ‎ΔH°latt = −787‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(X) = +122‎.</td><td>‎−411 = 107 + 496 + 122 + EA1 − 787 ← EA1 = −349 kJ/mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يتكون ‎NaCl₂‎؟</td><td>لأن ‎IE2‎ للصوديوم كبيرة جدًا (نزع إلكترون من غلاف داخلي) فلا تعوضها طاقة الشبكة، فتكون ‎ΔH°f‎ موجبة كبيرة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا تعني ‎ΔH°f‎ موجبة كبيرة لمركب افتراضي؟</td><td>أنه غير ثابت طاقيًا ولا يتكون عمليًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎ΔH°f‎ لـ ‎KBr: ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Br) = +112‎، ‎EA1 = −325‎، ‎ΔH°latt = −679‎.</td><td>‎ΔH°f = 89 + 419 + 112 − 325 − 679 = −384 kJ/mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صمم مسألة لحساب ‎IE1‎ مجهولة لفلز مع حلها.</td><td>مسألة تعطي ‎ΔH°f‎ و‎ΔH°latt‎ و‎ΔH°at‎ للعنصرين و‎EA1‎، والحل: ‎IE1 = ΔH°f − (‎المجموع المعلوم).</td></tr></table>","<p><b>إرشاد للطالب:</b> حل المسائل العكسية الثلاث ومراجعة جميع حلقات الوحدة</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على مراجعة المسألة التي صممها زميله وحلها</p>"]}]},{"title":"التغيرات في المحتوى الحراري للمحاليل","sb":"ص 122–135","unit":"الوحدة 3: طاقة الشبكة البلورية","periods":[{"axis":"المحتوى الحراري للذوبان والتميه وحلقة الطاقة","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","التغيرات في المحتوى الحراري للمحاليل"],["الحصة","1 من 2"],["محور الحصة","المحتوى الحراري للذوبان والتميه وحلقة الطاقة"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 122–125"],["دليل المعلم","ص 156–160"],["كتاب التجارب العملية والأنشطة","نشاط 3-2: التغير في المحتوى الحراري للمحاليل ص 78؛ الاستقصاء العملي 3-1: التغير في المحتوى الحراري لذوبان الكلوريدات ص 82"]],"t":["1. يعرّف التغير في المحتوى الحراري للذوبان ‎ΔH°sol‎ والتغير في المحتوى الحراري للتميه ‎ΔH°hyd‎ ويستخدمهما\n2. يرسم حلقة طاقة تربط ‎ΔH°sol‎ و‎ΔH°latt‎ ومجموع ‎ΔH°hyd‎ للأيونات ويستخدمها في الحساب\nمخرج تعليمي آخر: يشرح التميه بتكوين روابط أيون–ثنائي القطب بين الأيونات وجزيئات الماء","المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم","- التعلم بالاكتشاف\n- التعلم بالنمذجة","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كلوريد الأمونيوم وكلوريد الكالسيوم اللامائي وماء وميزان حرارة للعرض","الذوبان، ‎ΔH°sol‎، التميه، ‎ΔH°hyd‎، روابط أيون–ثنائي القطب، المحلول اللانهائي التخفيف، ‎ΔH°sol = −ΔH°latt + ΣΔH°hyd‎.","يذيب المعلم كلوريد الأمونيوم في ماء فتنخفض الحرارة، ثم كلوريد الكالسيوم اللامائي فترتفع، ويسأل: «كلاهما ملح يذوب؛ فلماذا يبرد أحدهما ويسخن الآخر؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يقترحون تنافس طاقتين متعاكستين\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: ينفذ «التغير في المحتوى الحراري للذوبان والتغير في المحتوى الحراري للتميه» ويرسم الحلقة\nالطالب: يرسمون تميه الكاتيونات والأنيونات ويكتبون العلاقة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم مسائل حساب ‎ΔH°sol‎ من البيانات\nالطالب: يحسبون في أزواج ويتنبؤون بالذوبان الماص أو الطارد\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف ‎ΔH°hyd‎.\n   الإجابة النموذجية: التغير في المحتوى الحراري عند ذوبان مول من الأيونات الغازية في الماء لتكوين محلول لانهائي التخفيف.\n2) (المستوى المتوقع) السؤال: اكتب العلاقة بين ‎ΔH°sol‎ و‎ΔH°latt‎ و‎ΔH°hyd‎.\n   الإجابة النموذجية: ‎ΔH°sol = −ΔH°latt + ΣΔH°hyd‎\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH°sol‎ لمركب ‎XY‎ إذا كانت ‎ΔH°latt = −700‎ وΣ‎ΔH°hyd = −690 kJ/mol‎.\n   الإجابة النموذجية: ‎ΔH°sol = 700 − 690 = +10 kJ/mol‎.","1) (مستوى الدعم) السؤال: هل التميه ماص أم طارد للحرارة؟\n   الإجابة النموذجية: طارد للحرارة.\n2) (المستوى المتوقع) السؤال: صف تميه أيون ‎Na⁺‎.\n   الإجابة النموذجية: تحيط جزيئات الماء بالأيون موجهة ذرات الأكسجين (الطرف السالب الجزئي) نحوه بروابط أيون–ثنائي القطب.\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH°sol‎ لملح إذا كانت ‎ΔH°latt = −850‎ و‎ΔH°hyd‎ للكاتيون = −520 وللأنيون = ‎−364 kJ/mol‎.\n   الإجابة النموذجية: Σ‎ΔH°hyd = −884‎؛ ‎ΔH°sol = 850 − 884 = −34 kJ/mol‎.","إرشاد للطالب: مراجعة ص 122–125 ورسم حلقة الذوبان\nإرشاد لولي الأمر: يمكن للابن تجربة إذابة ملح الطعام في الماء وملاحظة التغير الطفيف في الحرارة"],"h":["<ol class=\"ol\"><li>يعرّف التغير في المحتوى الحراري للذوبان ‎ΔH°sol‎ والتغير في المحتوى الحراري للتميه ‎ΔH°hyd‎ ويستخدمهما</li><li>يرسم حلقة طاقة تربط ‎ΔH°sol‎ و‎ΔH°latt‎ ومجموع ‎ΔH°hyd‎ للأيونات ويستخدمها في الحساب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يشرح التميه بتكوين روابط أيون–ثنائي القطب بين الأيونات وجزيئات الماء</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف التغير في المحتوى الحراري للذوبان ‎ΔH°sol‎ والتغير في المحتوى الحراري للتميه ‎ΔH°hyd‎ ويستخدمهما</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يرسم حلقة طاقة تربط ‎ΔH°sol‎ و‎ΔH°latt‎ ومجموع ‎ΔH°hyd‎ للأيونات ويستخدمها في الحساب</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يشرح التميه بتكوين روابط أيون–ثنائي القطب بين الأيونات وجزيئات الماء</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كلوريد الأمونيوم وكلوريد الكالسيوم اللامائي وماء وميزان حرارة للعرض</span></div>","<p>الذوبان، ‎ΔH°sol‎، التميه، ‎ΔH°hyd‎، روابط أيون–ثنائي القطب، المحلول اللانهائي التخفيف، ‎ΔH°sol = −ΔH°latt + ΣΔH°hyd‎.</p>","<p>يذيب المعلم كلوريد الأمونيوم في ماء فتنخفض الحرارة، ثم كلوريد الكالسيوم اللامائي فترتفع، ويسأل: «كلاهما ملح يذوب؛ فلماذا يبرد أحدهما ويسخن الآخر؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>ينفذ العرض ويطرح السؤال</td><td>يقترحون تنافس طاقتين متعاكستين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>ينفذ «التغير في المحتوى الحراري للذوبان والتغير في المحتوى الحراري للتميه» ويرسم الحلقة</td><td>يرسمون تميه الكاتيونات والأنيونات ويكتبون العلاقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم مسائل حساب ‎ΔH°sol‎ من البيانات</td><td>يحسبون في أزواج ويتنبؤون بالذوبان الماص أو الطارد</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف ‎ΔH°hyd‎.</td><td>التغير في المحتوى الحراري عند ذوبان مول من الأيونات الغازية في الماء لتكوين محلول لانهائي التخفيف.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب العلاقة بين ‎ΔH°sol‎ و‎ΔH°latt‎ و‎ΔH°hyd‎.</td><td>‎ΔH°sol = −ΔH°latt + ΣΔH°hyd‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH°sol‎ لمركب ‎XY‎ إذا كانت ‎ΔH°latt = −700‎ وΣ‎ΔH°hyd = −690 kJ/mol‎.</td><td>‎ΔH°sol = 700 − 690 = +10 kJ/mol‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل التميه ماص أم طارد للحرارة؟</td><td>طارد للحرارة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف تميه أيون ‎Na⁺‎.</td><td>تحيط جزيئات الماء بالأيون موجهة ذرات الأكسجين (الطرف السالب الجزئي) نحوه بروابط أيون–ثنائي القطب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH°sol‎ لملح إذا كانت ‎ΔH°latt = −850‎ و‎ΔH°hyd‎ للكاتيون = −520 وللأنيون = ‎−364 kJ/mol‎.</td><td>Σ‎ΔH°hyd = −884‎؛ ‎ΔH°sol = 850 − 884 = −34 kJ/mol‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 122–125 ورسم حلقة الذوبان</p><p><b>إرشاد لولي الأمر:</b> يمكن للابن تجربة إذابة ملح الطعام في الماء وملاحظة التغير الطفيف في الحرارة</p>"]},{"axis":"لماذا تذوب بعض المواد الأيونية؟ أثر الحجم والشحنة على التميه ومراجعة الوحدة","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","التغيرات في المحتوى الحراري للمحاليل"],["الحصة","2 من 2"],["محور الحصة","لماذا تذوب بعض المواد الأيونية؟ أثر الحجم والشحنة على التميه ومراجعة الوحدة"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 125–135 + كتاب التجارب ص 78 و82"],["دليل المعلم","ص 156–160"],["كتاب التجارب العملية والأنشطة","نشاط 3-2: التغير في المحتوى الحراري للمحاليل ص 78؛ الاستقصاء العملي 3-1: التغير في المحتوى الحراري لذوبان الكلوريدات ص 82"]],"t":["1. يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه\n2. يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","كثافة الشحنة، تميه ‎Mg²⁺‎ مقابل ‎Na⁺‎، الذوبانية، التوازن بين طاقة الشبكة والتميه، ملخص الوحدة.","يسأل المعلم: «لماذا يذوب ‎NaCl‎ بسهولة في الماء بينما لا يذوب ‎AgCl‎ تقريبًا؟» ويعرض جدول قيم ‎ΔH°hyd‎ لعدة أيونات.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويعرض الجدول\nالطالب: يلاحظون علاقة الحجم والشحنة بقيمة التميه\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «لماذا تذوب بعض المواد الصلبة الأيونية في الماء؟» ويشرح أثر الحجم والشحنة\nالطالب: يرتبون أيونات حسب مقدار التميه ويفسرون\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 3-2 (ص 78) وتحليل بيانات الاستقصاء 3-1 (ص 82) وأسئلة مختارة من نهاية الوحدة (ص 129–135)\nالطالب: يحلون في مجموعات ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أيهما أكثر طردًا للحرارة في التميه: ‎Mg²⁺‎ أم ‎Na⁺‎؟ ولماذا؟\n   الإجابة النموذجية: ‎Mg²⁺‎ لأنه أصغر وأكبر شحنة فيجذب جزيئات الماء بقوة أكبر.\n2) (المستوى المتوقع) السؤال: رتب حسب مقدار ‎ΔH°hyd: Li⁺‎، ‎Na⁺‎، ‎K⁺‎.\n   الإجابة النموذجية: ‎Li⁺ > Na⁺ > K⁺‎.\n3) (المستوى المتقدم) السؤال: كيف تؤثر الشحنة الأيونية على ‎ΔH°hyd‎؟\n   الإجابة النموذجية: كلما زادت الشحنة زاد مقدار ‎ΔH°hyd (‎أكثر طردًا للحرارة).","1) (مستوى الدعم) السؤال: ما العاملان المؤثران في مقدار ‎ΔH°hyd‎؟\n   الإجابة النموذجية: نصف القطر الأيوني والشحنة الأيونية.\n2) (المستوى المتوقع) السؤال: لماذا لا تكفي إشارة ‎ΔH°sol‎ وحدها للحكم على الذوبان؟\n   الإجابة النموذجية: لأن بعض المواد تذوب رغم أن ذوبانها ماص للحرارة؛ فعوامل أخرى غير المحتوى الحراري تؤثر في الذوبان.\n3) (المستوى المتقدم) السؤال: قيّم تعلمك في الوحدة الثالثة: موضوع أتقنته، وآخر تحتاج إلى مراجعته، وخطة لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.","إرشاد للطالب: إكمال نشاط 3-2 ص 78 وتقرير الاستقصاء 3-1 ومراجعة ملخص الوحدة ص 128\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة"],"h":["<ol class=\"ol\"><li>يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه</li><li>يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>كثافة الشحنة، تميه ‎Mg²⁺‎ مقابل ‎Na⁺‎، الذوبانية، التوازن بين طاقة الشبكة والتميه، ملخص الوحدة.</p>","<p>يسأل المعلم: «لماذا يذوب ‎NaCl‎ بسهولة في الماء بينما لا يذوب ‎AgCl‎ تقريبًا؟» ويعرض جدول قيم ‎ΔH°hyd‎ لعدة أيونات.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويعرض الجدول</td><td>يلاحظون علاقة الحجم والشحنة بقيمة التميه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «لماذا تذوب بعض المواد الصلبة الأيونية في الماء؟» ويشرح أثر الحجم والشحنة</td><td>يرتبون أيونات حسب مقدار التميه ويفسرون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 3-2 (ص 78) وتحليل بيانات الاستقصاء 3-1 (ص 82) وأسئلة مختارة من نهاية الوحدة (ص 129–135)</td><td>يحلون في مجموعات ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أيهما أكثر طردًا للحرارة في التميه: ‎Mg²⁺‎ أم ‎Na⁺‎؟ ولماذا؟</td><td>‎Mg²⁺‎ لأنه أصغر وأكبر شحنة فيجذب جزيئات الماء بقوة أكبر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب حسب مقدار ‎ΔH°hyd: Li⁺‎، ‎Na⁺‎، ‎K⁺‎.</td><td>‎Li⁺ &gt; Na⁺ &gt; K⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف تؤثر الشحنة الأيونية على ‎ΔH°hyd‎؟</td><td>كلما زادت الشحنة زاد مقدار ‎ΔH°hyd (‎أكثر طردًا للحرارة).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما العاملان المؤثران في مقدار ‎ΔH°hyd‎؟</td><td>نصف القطر الأيوني والشحنة الأيونية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا تكفي إشارة ‎ΔH°sol‎ وحدها للحكم على الذوبان؟</td><td>لأن بعض المواد تذوب رغم أن ذوبانها ماص للحرارة؛ فعوامل أخرى غير المحتوى الحراري تؤثر في الذوبان.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم تعلمك في الوحدة الثالثة: موضوع أتقنته، وآخر تحتاج إلى مراجعته، وخطة لذلك.</td><td>إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 3-2 ص 78 وتقرير الاستقصاء 3-1 ومراجعة ملخص الوحدة ص 128</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة</p>"]}]},{"title":"السلسلة المتجانسة للكحولات","sb":"ص 137–140","unit":"الوحدة 4: مشتقات الهيدروكربونات (1)","periods":[{"axis":"تسمية الكحولات وتصنيفها إلى أولية وثانوية وثالثية","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للكحولات"],["الحصة","1 من 2"],["محور الحصة","تسمية الكحولات وتصنيفها إلى أولية وثانوية وثالثية"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 137–139"],["دليل المعلم","ص 175–178"],["كتاب التجارب العملية والأنشطة","نشاط 4-1: تصنيف الكحولات ص 91"]],"t":["1. يسمي الكحولات حتى عشر ذرات كربون وفق نظام ‎IUPAC‎ ويكتب صيغها البنائية والهيكلية\n2. يصنف الكحولات إلى أولية وثانوية وثالثية حسب عدد مجموعات الألكيل المرتبطة بذرة الكربون الحاملة لـ ‎OH‎\nمخرج تعليمي آخر: يفسر تناقص ذوبانية الكحولات في الماء بزيادة طول السلسلة الكربونية","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: فهم","- التعلم التعاوني\n- التعلم بالنمذجة","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج جزيئية (كرات وعصي)","الكحول، مجموعة الهيدروكسيل، الصيغة العامة ‎CnH2n+1OH‎، الكحول الأولي، الثانوي، الثالثي، التسمية النظامية، الروابط الهيدروجينية.","يعرض المعلم صورة معقم يدين وسؤالًا: «المادة الفعالة في المعقم إيثانول؛ ما المجموعة التي تميزه عن الإيثان؟» ثم ينفذ «العلوم ضمن سياقها: تحضير الإيثانول كوقود حيوي» ومهام بداية الوحدة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال ومهام بداية الوحدة\nالطالب: يحددون مجموعة ‎OH‎ ويستدعون تسمية الألكانات\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «تصنيف الكحولات» و«تسمية وتصنيف الكحولات» بنماذج جزيئية لـ ‎propan-1-ol‎ و‎propan-2-ol‎ و‎2-methylpropan-2-ol‎\nالطالب: يبنون النماذج ويسمونها ويصنفونها\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 4-1 (كتاب التجارب ص 91) والسؤالين 1 و2\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الصيغة العامة للكحولات المشبعة أحادية الهيدروكسيل؟\n   الإجابة النموذجية: ‎CnH2n+1OH‎.\n2) (المستوى المتوقع) السؤال: صنّف بروبان-2-ول.\n   الإجابة النموذجية: كحول ثانوي، لأن الكربون الحامل لـ ‎OH‎ مرتبط بمجموعتي ألكيل.\n3) (المستوى المتقدم) السؤال: لماذا يذوب الإيثانول في الماء بينما يقل ذوبان الهكسانول؟\n   الإجابة النموذجية: الإيثانول يكوّن روابط هيدروجينية مع الماء وسلسلته قصيرة، أما الهكسانول فسلسلته الهيدروكربونية الطويلة غير القطبية تقلل الذوبان.","1) (مستوى الدعم) السؤال: سمِّ الكحول ‎CH₃CH₂CH₂OH‎.\n   الإجابة النموذجية: بروبان-1-ول.\n2) (المستوى المتوقع) السؤال: صنّف 2-ميثيل بروبان-2-ول.\n   الإجابة النموذجية: كحول ثالثي.\n3) (المستوى المتقدم) السؤال: اكتب الصيغة البنائية لكحول ثانوي يحتوي أربع ذرات كربون وسمّه.\n   الإجابة النموذجية: ‎CH₃CH(OH)CH₂CH₃‎، بيوتان-2-ول.","إرشاد للطالب: مراجعة ص 137–139 وإكمال نشاط 4-1 ص 91\nإرشاد لولي الأمر: الحديث مع الابن عن استخدامات الإيثانول في المعقمات والوقود الحيوي"],"h":["<ol class=\"ol\"><li>يسمي الكحولات حتى عشر ذرات كربون وفق نظام ‎IUPAC‎ ويكتب صيغها البنائية والهيكلية</li><li>يصنف الكحولات إلى أولية وثانوية وثالثية حسب عدد مجموعات الألكيل المرتبطة بذرة الكربون الحاملة لـ ‎OH‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر تناقص ذوبانية الكحولات في الماء بزيادة طول السلسلة الكربونية</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يسمي الكحولات حتى عشر ذرات كربون وفق نظام ‎IUPAC‎ ويكتب صيغها البنائية والهيكلية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصنف الكحولات إلى أولية وثانوية وثالثية حسب عدد مجموعات الألكيل المرتبطة بذرة الكربون الحاملة لـ ‎OH‎</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر تناقص ذوبانية الكحولات في الماء بزيادة طول السلسلة الكربونية</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالنمذجة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: نماذج جزيئية (كرات وعصي)</span></div>","<p>الكحول، مجموعة الهيدروكسيل، الصيغة العامة ‎CnH2n+1OH‎، الكحول الأولي، الثانوي، الثالثي، التسمية النظامية، الروابط الهيدروجينية.</p>","<p>يعرض المعلم صورة معقم يدين وسؤالًا: «المادة الفعالة في المعقم إيثانول؛ ما المجموعة التي تميزه عن الإيثان؟» ثم ينفذ «العلوم ضمن سياقها: تحضير الإيثانول كوقود حيوي» ومهام بداية الوحدة.</p>","<table class=\"tb proc\"> ><b>إرشاد للطالب:</b> مراجعة ص 137–139 وإكمال نشاط 4-1 ص 91</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن استخدامات الإيثانول في المعقمات والوقود الحيوي</p>"]},{"axis":"اختبار ثلاثي يودوميثان والخواص الفيزيائية للكحولات","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للكحولات"],["الحصة","2 من 2"],["محور الحصة","اختبار ثلاثي يودوميثان والخواص الفيزيائية للكحولات"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 139–140"],["دليل المعلم","ص 175–178"],["كتاب التجارب العملية والأنشطة","نشاط 4-1: تصنيف الكحولات ص 91"]],"t":["1. يصف اختبار ثلاثي يودوميثان للكشف عن وجود المجموعة ‎CH₃CH(OH)–‎ في كحول ما\n2. يتنبأ بنتيجة اختبار ثلاثي يودوميثان لكحولات مختلفة\nمخرج تعليمي آخر: يفسر ارتفاع درجات غليان الكحولات مقارنة بالألكانات المماثلة في الكتلة","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","اختبار ثلاثي يودوميثان، اليود القلوي، الراسب الأصفر ‎CHI₃‎، المجموعة ‎CH₃CH(OH)–‎، درجة الغليان، الروابط الهيدروجينية بين الجزيئات.","يعرض المعلم صورة راسب أصفر باهت في أنبوب اختبار ويسأل: «إذا أضفنا اليود والقاعدة إلى إيثانول ثم إلى ميثانول، أي الأنبوبين ستظهر فيه هذه البلورات؟ ولماذا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يتوقعون ويبررون\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «اختبار يودوميثان» ويشرح شرط وجود ‎CH₃CH(OH)–‎ والراسب الأصفر\nالطالب: يحددون الكحولات التي تعطي نتيجة موجبة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مجموعة كحولات للتنبؤ بنتيجة الاختبار ويناقش درجات الغليان\nالطالب: يتنبؤون ويفسرون بالروابط الهيدروجينية\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الكحولات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الناتج المرئي لاختبار ثلاثي يودوميثان الموجب؟\n   الإجابة النموذجية: راسب أصفر باهت من ثلاثي يودوميثان ‎CHI₃‎ ذو رائحة مميزة.\n2) (المستوى المتوقع) السؤال: هل يعطي بروبان-2-ول نتيجة موجبة؟ ولماذا؟\n   الإجابة النموذجية: نعم، لأنه يحتوي المجموعة ‎CH₃CH(OH)–‎.\n3) (المستوى المتقدم) السؤال: لماذا لا يعطي بروبان-1-ول نتيجة موجبة؟\n   الإجابة النموذجية: لأن ذرة الكربون الحاملة لـ ‎OH‎ ليست مرتبطة بمجموعة ميثيل.","1) (مستوى الدعم) السؤال: ما الكواشف المستخدمة في اختبار ثلاثي يودوميثان؟\n   الإجابة النموذجية: اليود مع محلول قلوي (هيدروكسيد الصوديوم) مع التسخين الهادئ.\n2) (المستوى المتوقع) السؤال: أي الكحولين يعطي نتيجة موجبة: الإيثانول أم الميثانول؟\n   الإجابة النموذجية: الإيثانول.\n3) (المستوى المتقدم) السؤال: لماذا درجة غليان الإيثانول ‎(78 °C)‎ أعلى بكثير من البروبان ‎(−42 °C)‎ رغم تقارب كتلتيهما؟\n   الإجابة النموذجية: لأن جزيئات الإيثانول تكوّن روابط هيدروجينية فيما بينها تحتاج طاقة أكبر للتغلب عليها، بينما في البروبان قوى فاندرفالز ضعيفة فقط.","إرشاد للطالب: مراجعة ص 139–140 وتلخيص شروط اختبار ثلاثي يودوميثان\nإرشاد لولي الأمر: سؤال الابن عن سبب ارتفاع درجة غليان الكحولات"],"h":["<ol class=\"ol\"><li>يصف اختبار ثلاثي يودوميثان للكشف عن وجود المجموعة ‎CH₃CH(OH)–‎ في كحول ما</li><li>يتنبأ بنتيجة اختبار ثلاثي يودوميثان لكحولات مختلفة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر ارتفاع درجات غليان الكحولات مقارنة بالألكانات المماثلة في الكتلة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف اختبار ثلاثي يودوميثان للكشف عن وجود المجموعة ‎CH₃CH(OH)–‎ في كحول ما</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يتنبأ بنتيجة اختبار ثلاثي يودوميثان لكحولات مختلفة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر ارتفاع درجات غليان الكحولات مقارنة بالألكانات المماثلة في الكتلة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>اختبار ثلاثي يودوميثان، اليود القلوي، الراسب الأصفر ‎CHI₃‎، المجموعة ‎CH₃CH(OH)–‎، درجة الغليان، الروابط الهيدروجينية بين الجزيئات.</p>","<p>يعرض المعلم صورة راسب أصفر باهت في أنبوب اختبار ويسأل: «إذا أضفنا اليود والقاعدة إلى إيثانول ثم إلى ميثانول، أي الأنبوبين ستظهر فيه هذه البلورات؟ ولماذا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح السؤال</td><td>يتوقعون ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «اختبار يودوميثان» ويشرح شرط وجود ‎CH₃CH(OH)–‎ والراسب الأصفر</td><td>يحددون الكحولات التي تعطي نتيجة موجبة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مجموعة كحولات للتنبؤ بنتيجة الاختبار ويناقش درجات الغليان</td><td>يتنبؤون ويفسرون بالروابط الهيدروجينية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على الكحولات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الناتج المرئي لاختبار ثلاثي يودوميثان الموجب؟</td><td>راسب أصفر باهت من ثلاثي يودوميثان ‎CHI₃‎ ذو رائحة مميزة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>هل يعطي بروبان-2-ول نتيجة موجبة؟ ولماذا؟</td><td>نعم، لأنه يحتوي المجموعة ‎CH₃CH(OH)–‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يعطي بروبان-1-ول نتيجة موجبة؟</td><td>لأن ذرة الكربون الحاملة لـ ‎OH‎ ليست مرتبطة بمجموعة ميثيل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الكواشف المستخدمة في اختبار ثلاثي يودوميثان؟</td><td>اليود مع محلول قلوي (هيدروكسيد الصوديوم) مع التسخين الهادئ.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي الكحولين يعطي نتيجة موجبة: الإيثانول أم الميثانول؟</td><td>الإيثانول.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا درجة غليان الإيثانول ‎(78 °C)‎ أعلى بكثير من البروبان ‎(−42 °C)‎ رغم تقارب كتلتيهما؟</td><td>لأن جزيئات الإيثانول تكوّن روابط هيدروجينية فيما بينها تحتاج طاقة أكبر للتغلب عليها، بينما في البروبان قوى فاندرفالز ضعيفة فقط.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 139–140 وتلخيص شروط اختبار ثلاثي يودوميثان</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن سبب ارتفاع درجة غليان الكحولات</p>"]}]},{"title":"السلسلتان المتجانستان للألدهيدات والكيتونات","sb":"ص 141–142","unit":"الوحدة 4: مشتقات الهيدروكربونات (1)","periods":[{"axis":"مجموعة الكربونيل وتسمية الألدهيدات والكيتونات وتشاكلها","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلتان المتجانستان للألدهيدات والكيتونات"],["الحصة","1 من 3"],["محور الحصة","مجموعة الكربونيل وتسمية الألدهيدات والكيتونات وتشاكلها"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 141"],["دليل المعلم","ص 178–182"],["كتاب التجارب العملية والأنشطة","نشاط 4-2: مركبات الكربونيل: التحضير والاختزال ص 92"]],"t":["1. يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية\n2. يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل\nمخرج تعليمي آخر: يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج جزيئية، الجدول 4-1 في كتاب الطالب","مجموعة الكربونيل ‎C=O‎، الألدهيد ‎(–CHO)‎، الكيتون (‎C=O‎ داخل السلسلة)، الميثانال، الإيثانال، البروبانون، التشاكل.","يعرض المعلم صيغتي بروبانال وبروبانون ويسأل: «لهما الصيغة الجزيئية نفسها ‎C₃H₆O‎؛ ما الذي يجعلهما مركبين مختلفين؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصيغتين ويطرح السؤال\nالطالب: يحددون موقع مجموعة الكربونيل\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يستخدم الجدول 4-1 لتعريف المجموعات الوظيفية ويشرح التسمية (‎–al‎ و–‎one‎)\nالطالب: يسمون أمثلة ويحددون نوعها\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ «تسمية وتشاكل الألدهيدات والكيتونات»: رسم المتشكلات السبعة لـ ‎C₅H₁₀O (‎الشكل 4-1)\nالطالب: يرسمون المتشكلات في مجموعات ويسمونها\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أين تقع مجموعة الكربونيل في الألدهيد؟\n   الإجابة النموذجية: في نهاية السلسلة الكربونية.\n2) (المستوى المتوقع) السؤال: سمِّ ‎CH₃COCH₃‎.\n   الإجابة النموذجية: بروبانون.\n3) (المستوى المتقدم) السؤال: ارسم متشكلين لـ ‎C₄H₈O‎ أحدهما ألدهيد والآخر كيتون.\n   الإجابة النموذجية: بيوتانال ‎CH₃CH₂CH₂CHO‎، وبيوتانون ‎CH₃COCH₂CH₃‎.","1) (مستوى الدعم) السؤال: ما المجموعة الوظيفية المشتركة بين الألدهيدات والكيتونات؟\n   الإجابة النموذجية: مجموعة الكربونيل ‎C=O‎.\n2) (المستوى المتوقع) السؤال: سمِّ ‎CH₃CH₂CHO‎.\n   الإجابة النموذجية: بروبانال.\n3) (المستوى المتقدم) السؤال: لماذا لا يوجد كيتون يحتوي ذرتي كربون فقط؟\n   الإجابة النموذجية: لأن الكيتون يتطلب ذرتي كربون على جانبي مجموعة الكربونيل، أي ثلاث ذرات كربون على الأقل.","إرشاد للطالب: مراجعة ص 141 ورسم المتشكلات السبعة لـ ‎C₅H₁₀O‎\nإرشاد لولي الأمر: متابعة الابن في التمييز بين لاحقتي –‎al‎ و–‎one‎"],"h":["<ol class=\"ol\"><li>يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية</li><li>يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: نماذج جزيئية، الجدول 4-1 في كتاب الطالب</span></div>","<p>مجموعة الكربونيل ‎C=O‎، الألدهيد ‎(–CHO)‎، الكيتون (‎C=O‎ داخل السلسلة)، الميثانال، الإيثانال، البروبانون، التشاكل.</p>","<p>يعرض المعلم صيغتي بروبانال وبروبانون ويسأل: «لهما الصيغة الجزيئية نفسها ‎C₃H₆O‎؛ ما الذي يجعلهما مركبين مختلفين؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصيغتين ويطرح السؤال</td><td>يحددون موقع مجموعة الكربونيل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يستخدم الجدول 4-1 لتعريف المجموعات الوظيفية ويشرح التسمية (‎–al‎ و–‎one‎)</td><td>يسمون أمثلة ويحددون نوعها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينفذ «تسمية وتشاكل الألدهيدات والكيتونات»: رسم المتشكلات السبعة لـ ‎C₅H₁₀O (‎الشكل 4-1)</td><td>يرسمون المتشكلات في مجموعات ويسمونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين تقع مجموعة الكربونيل في الألدهيد؟</td><td>في نهاية السلسلة الكربونية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>سمِّ ‎CH₃COCH₃‎.</td><td>بروبانون.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ارسم متشكلين لـ ‎C₄H₈O‎ أحدهما ألدهيد والآخر كيتون.</td><td>بيوتانال ‎CH₃CH₂CH₂CHO‎، وبيوتانون ‎CH₃COCH₂CH₃‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المجموعة الوظيفية المشتركة بين الألدهيدات والكيتونات؟</td><td>مجموعة الكربونيل ‎C=O‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>سمِّ ‎CH₃CH₂CHO‎.</td><td>بروبانال.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يوجد كيتون يحتوي ذرتي كربون فقط؟</td><td>لأن الكيتون يتطلب ذرتي كربون على جانبي مجموعة الكربونيل، أي ثلاث ذرات كربون على الأقل.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 141 ورسم المتشكلات السبعة لـ ‎C₅H₁₀O‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين لاحقتي –‎al‎ و–‎one‎</p>"]},{"axis":"تحضير الألدهيدات والكيتونات بأكسدة الكحولات واختزالها","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلتان المتجانستان للألدهيدات والكيتونات"],["الحصة","2 من 3"],["محور الحصة","تحضير الألدهيدات والكيتونات بأكسدة الكحولات واختزالها"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 141–142 + كتاب التجارب ص 92"],["دليل المعلم","ص 178–182"],["كتاب التجارب العملية والأنشطة","نشاط 4-2: مركبات الكربونيل: التحضير والاختزال ص 92"]],"t":["1. يصف تحضير الألدهيدات بأكسدة الكحولات الأولية والكيتونات بأكسدة الكحولات الثانوية بثنائي كرومات البوتاسيوم المحمضة\n2. يصف اختزال الألدهيدات إلى كحولات أولية والكيتونات إلى كحولات ثانوية باستخدام ‎NaBH₄‎\nمخرج تعليمي آخر: يفسر لماذا يُقطّر الألدهيد فور تكونه أثناء التحضير","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة","الأكسدة، ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمضة، تغير اللون من البرتقالي إلى الأخضر، التقطير، الاختزال، ‎NaBH₄‎، ‎[O]‎ و‎[H]‎.","يعرض المعلم أنبوبًا فيه محلول ثنائي كرومات برتقالي ثم أنبوبًا تحول إلى الأخضر بعد تسخينه مع إيثانول، ويسأل: «ماذا حدث للإيثانول؟ وما الذي غيّر اللون؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الأنبوبين ويطرح السؤال\nالطالب: يستنتجون حدوث أكسدة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح أكسدة الكحول الأولي إلى ألدهيد (مع التقطير) والثانوي إلى كيتون، والمعادلات باستخدام ‎[O]‎\nالطالب: يكتبون معادلتي الأكسدة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يشرح الاختزال بـ ‎NaBH₄‎ ويوجه حل نشاط 4-2 (كتاب التجارب ص 92)\nالطالب: يكتبون معادلات الاختزال باستخدام ‎[H]‎ ويحلون النشاط\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما ناتج أكسدة بروبان-2-ول؟\n   الإجابة النموذجية: بروبانون.\n2) (المستوى المتوقع) السؤال: لماذا يُقطّر الألدهيد فور تكونه؟\n   الإجابة النموذجية: لمنع أكسدته أكثر إلى حمض كربوكسيلي.\n3) (المستوى المتقدم) السؤال: ما ناتج اختزال بيوتانون بـ ‎NaBH₄‎؟\n   الإجابة النموذجية: بيوتان-2-ول.","1) (مستوى الدعم) السؤال: ما لون محلول ثنائي كرومات البوتاسيوم قبل الأكسدة وبعدها؟\n   الإجابة النموذجية: برتقالي قبل، وأخضر بعد.\n2) (المستوى المتوقع) السؤال: اكتب معادلة أكسدة الإيثانول إلى إيثانال باستخدام ‎[O]‎.\n   الإجابة النموذجية: ‎CH₃CH₂OH + [O] → CH₃CHO + H₂O‎\n3) (المستوى المتقدم) السؤال: اكتب معادلة اختزال إيثانال باستخدام ‎[H]‎ وسمِّ الناتج.\n   الإجابة النموذجية: ‎CH₃CHO + 2[H] → CH₃CH₂OH‎، إيثانول.","إرشاد للطالب: مراجعة ص 141–142 وإكمال نشاط 4-2 ص 92\nإرشاد لولي الأمر: سؤال الابن عن تغير لون ثنائي كرومات ودلالته"],"h":["<ol class=\"ol\"><li>يصف تحضير الألدهيدات بأكسدة الكحولات الأولية والكيتونات بأكسدة الكحولات الثانوية بثنائي كرومات البوتاسيوم المحمضة</li><li>يصف اختزال الألدهيدات إلى كحولات أولية والكيتونات إلى كحولات ثانوية باستخدام ‎NaBH₄‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يُقطّر الألدهيد فور تكونه أثناء التحضير</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">الم
