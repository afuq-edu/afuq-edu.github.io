\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الاتزان بين الملح الصلب وأيوناته في المحلول المشبع وتعريف ‎Ksp‎، والطلبة يكتبون معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎AgCl‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم أملاحًا بصيغ مختلفة (‎AgCl‎، ‎PbI₂‎، ‎Ca₃(PO₄)₂‎) لكتابة تعبيراتها، والطلبة يكتبون التعبيرات في أزواج ويعرضونها (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب تعبير ‎Ksp‎ لـ ‎AgCl‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ksp = [Ag⁺][Cl⁻]‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب تعبير ‎Ksp‎ لـ ‎PbI₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ksp = [Pb²⁺][I⁻]²‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يظهر ‎AgCl(s)‎ في تعبير ‎Ksp‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن تركيز المادة الصلبة ثابت فيُدمج في الثابت.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف ثابت حاصل الذوبانية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: حاصل ضرب تراكيز أيونات الملح شحيح الذوبان في محلوله المشبع، كل منها مرفوع إلى أس يساوي عدد مولاته في معادلة الاتزان، عند درجة حرارة معينة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎CaF₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CaF₂(s) ⇌ Ca²⁺(aq) + 2F⁻(aq)‎؛ ‎Ksp = [Ca²⁺][F⁻]²‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب تعبير ‎Ksp‎ لـ ‎Ca₃(PO₄)₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ksp = [Ca²⁺]³[PO₄³⁻]²‎<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 44–45 وكتابة تعبيرات ‎Ksp‎ لخمسة أملاح<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن ترسبات الأملاح في الغلايات وطرق إزالتها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6<\/p>"]}, {"axis": "وحدات ‎Ksp‎ وحسابه من الذوبانية", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الاتزان والذوبانية"], ["الحصة", "2 من 6"], ["محور الحصة", "وحدات ‎Ksp‎ وحسابه من الذوبانية"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 45–46"], ["دليل المعلم", "ص 68–73"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: ثابت حاصل الذوبانية ص 31"]], "t": ["1. يحدد وحدة ‎Ksp‎ حسب صيغة الملح (10 دقائق)\n2. يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎ (10 دقائق)\nمخرج تعليمي آخر: يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎ (20 دقيقة)", "1. تطبيق: يحدد وحدة ‎Ksp‎ حسب صيغة الملح\n2. تطبيق: يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎\n3. تطبيق (مخرج آخر): يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الذوبانية المولارية، تحويل ‎g/dm³‎ إلى ‎mol/dm³‎، وحدة ‎Ksp‎، النسب المولية للأيونات.", "يطرح المعلم: «ذوبانية ‎AgCl 1.3 × 10⁻⁵ mol/dm³‎. ما تركيز ‎Ag⁺‎ و‎Cl⁻‎ في المحلول المشبع؟» ويمنح دقيقة للتفكير.", "1. يطرح المعلم السؤال، والطلبة يستنتجون أن كل أيون بتركيز الذوبانية نفسه (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل أمثلة لحساب ‎Ksp‎ ووحدته لأملاح 1: 1 و1:2، والطلبة يتبعون الخطوات ويكتبون الوحدات (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم «حسابات تتضمن ثوابت حاصل الذوبانية» بمسائل متدرجة، والطلبة يحلون المسائل في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ‎Ksp‎ لـ ‎AgCl‎ إذا كانت ذوبانيته ‎1.3 × 10⁻⁵ mol/dm³‎.\n• الإجابة النموذجية: ‎Ksp = (1.3 × 10⁻⁵)² = 1.7 × 10⁻¹⁰ mol²/dm⁶‎.\n\n2. مستوى التطبيق: ما وحدة ‎Ksp‎ لـ ‎PbI₂‎؟\n• الإجابة النموذجية: ‎mol³/dm⁹‎.\n\n3. مستوى الاستدلال: ذوبانية ‎CaF₂‎ تساوي ‎2.0 × 10⁻⁴ mol/dm³‎. احسب ‎Ksp‎.\n• الإجابة النموذجية: ‎[Ca²⁺] = 2.0 × 10⁻⁴‎ و‎[F⁻] = 4.0 × 10⁻⁴‎؛ ‎Ksp = 2.0 × 10⁻⁴ × (4.0 × 10⁻⁴)² = 3.2 × 10⁻¹¹ mol³/dm⁹‎.", "1. مستوى المعرفة: ما وحدة ‎Ksp‎ لملح من نوع ‎AB‎؟\n• الإجابة النموذجية: ‎mol²/dm⁶‎.\n\n2. مستوى التطبيق: ذوبانية ‎BaSO₄‎ تساوي ‎1.0 × 10⁻⁵ mol/dm³‎. احسب ‎Ksp‎.\n• الإجابة النموذجية: ‎Ksp = (1.0 × 10⁻⁵)² = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.\n\n3. مستوى الاستدلال: ذوبانية ملح ‎AB (‎كتلته المولية ‎100 g/mol‎) تساوي ‎0.0010 g/dm³‎. احسب ‎Ksp‎.\n• الإجابة النموذجية: الذوبانية = ‎1.0 × 10⁻⁵ mol/dm³‎؛ ‎Ksp = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.", "إرشاد للطالب: مراجعة ص 45–46 وحل ثلاث مسائل لحساب ‎Ksp‎\nإرشاد لولي الأمر: متابعة الابن في كتابة الوحدات مع كل ناتج\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6"], "h": ["<ol class=\"ol\"><li>يحدد وحدة ‎Ksp‎ حسب صيغة الملح (10 دقائق)<\/li><li>يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎ (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎ (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحدد وحدة ‎Ksp‎ حسب صيغة الملح<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب ‎Ksp‎ من ذوبانية الملح المعطاة بالمول لكل ‎dm³‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحول الذوبانية من ‎g/dm³‎ إلى ‎mol/dm³‎ قبل حساب ‎Ksp‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الذوبانية المولارية، تحويل ‎g/dm³‎ إلى ‎mol/dm³‎، وحدة ‎Ksp‎، النسب المولية للأيونات.<\/p>", "<p>يطرح المعلم: «ذوبانية ‎AgCl 1.3 × 10⁻⁵ mol/dm³‎. ما تركيز ‎Ag⁺‎ و‎Cl⁻‎ في المحلول المشبع؟» ويمنح دقيقة للتفكير.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يستنتجون أن كل أيون بتركيز الذوبانية نفسه (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل أمثلة لحساب ‎Ksp‎ ووحدته لأملاح 1: 1 و1:2، والطلبة يتبعون الخطوات ويكتبون الوحدات (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم «حسابات تتضمن ثوابت حاصل الذوبانية» بمسائل متدرجة، والطلبة يحلون المسائل في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎Ksp‎ لـ ‎AgCl‎ إذا كانت ذوبانيته ‎1.3 × 10⁻⁵ mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ksp = (1.3 × 10⁻⁵)² = 1.7 × 10⁻¹⁰ mol²/dm⁶‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما وحدة ‎Ksp‎ لـ ‎PbI₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎mol³/dm⁹‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ذوبانية ‎CaF₂‎ تساوي ‎2.0 × 10⁻⁴ mol/dm³‎. احسب ‎Ksp‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[Ca²⁺] = 2.0 × 10⁻⁴‎ و‎[F⁻] = 4.0 × 10⁻⁴‎؛ ‎Ksp = 2.0 × 10⁻⁴ × (4.0 × 10⁻⁴)² = 3.2 × 10⁻¹¹ mol³/dm⁹‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة ‎Ksp‎ لملح من نوع ‎AB‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎mol²/dm⁶‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ذوبانية ‎BaSO₄‎ تساوي ‎1.0 × 10⁻⁵ mol/dm³‎. احسب ‎Ksp‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ksp = (1.0 × 10⁻⁵)² = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ذوبانية ملح ‎AB (‎كتلته المولية ‎100 g/mol‎) تساوي ‎0.0010 g/dm³‎. احسب ‎Ksp‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الذوبانية = ‎1.0 × 10⁻⁵ mol/dm³‎؛ ‎Ksp = 1.0 × 10⁻¹⁰ mol²/dm⁶‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 45–46 وحل ثلاث مسائل لحساب ‎Ksp‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة الوحدات مع كل ناتج<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6<\/p>"]}, {"axis": "حساب الذوبانية من ‎Ksp‎", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الاتزان والذوبانية"], ["الحصة", "3 من 6"], ["محور الحصة", "حساب الذوبانية من ‎Ksp‎"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 46–47"], ["دليل المعلم", "ص 68–73"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: ثابت حاصل الذوبانية ص 31"]], "t": ["1. يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎ (10 دقائق)\n2. يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده (15 دقيقة)\nمخرج تعليمي آخر: يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع (15 دقيقة)", "1. تطبيق: يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎\n2. تحليل: يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده\n3. تطبيق (مخرج آخر): يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الذوبانية ‎s‎، الجذر التربيعي والتكعيبي، المقارنة بين الذوبانيات، الكتلة المذابة.", "يطرح المعلم: «‎Ksp‎ لـ ‎AgCl‎ أكبر من ‎Ksp‎ لـ ‎Ag₂CrO₄‎، فهل ‎AgCl‎ أكثر ذوبانًا بالضرورة؟» ويترك السؤال مفتوحًا حتى نهاية الحصة.", "1. يطرح المعلم السؤال، والطلبة يدلون بتوقعاتهم (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل أمثلة لحساب ‎s‎ من ‎Ksp‎ لأملاح ‎1: 1 (s = √Ksp)‎ و‎1:2 (s = ∛(Ksp/4))‎، والطلبة يتبعون ويكتبون الخطوات (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسألة المقارنة بين ‎AgCl‎ و‎Ag₂CrO₄‎ لحلها في مجموعات، والطلبة يحسبون الذوبانيتين ويجيبون عن سؤال التهيئة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ذوبانية ‎BaSO₄‎ إذا كان ‎Ksp = 1.1 × 10⁻¹⁰ mol²/dm⁶‎.\n• الإجابة النموذجية: ‎s = √(1.1 × 10⁻¹⁰) = 1.05 × 10⁻⁵ mol/dm³‎.\n\n2. مستوى التطبيق: احسب ذوبانية ‎CaF₂‎ إذا كان ‎Ksp = 3.2 × 10⁻¹¹ mol³/dm⁹‎.\n• الإجابة النموذجية: ‎4s³ = 3.2 × 10⁻¹¹ ← s = 2.0 × 10⁻⁴ mol/dm³‎.\n\n3. مستوى الاستدلال: لماذا لا تكفي مقارنة قيم ‎Ksp‎ لمقارنة ذوبانية ملحين مختلفي الصيغة؟\n• الإجابة النموذجية: لأن العلاقة بين ‎s‎ و‎Ksp‎ تختلف حسب الصيغة (‎s²‎ أو ‎4s³‎)، فيجب حساب ‎s‎ لكل ملح.", "1. مستوى المعرفة: اكتب العلاقة بين ‎s‎ و‎Ksp‎ لملح ‎AB‎.\n• الإجابة النموذجية: ‎Ksp = s²‎، أي ‎s = √Ksp‎.\n\n2. مستوى التطبيق: احسب ذوبانية ملح ‎AB‎ إذا كان ‎Ksp = 4.0 × 10⁻¹² mol²/dm⁶‎.\n• الإجابة النموذجية: ‎s = 2.0 × 10⁻⁶ mol/dm³‎.\n\n3. مستوى الاستدلال: ‎Ksp‎ لـ ‎AgCl = 1.8 × 10⁻¹⁰‎ و‎Ksp‎ لـ ‎Ag₂CrO₄ = 1.1 × 10⁻¹²‎. أيهما أكثر ذوبانًا؟\n• الإجابة النموذجية: ‎AgCl: s = 1.3 × 10⁻⁵‎؛ ‎Ag₂CrO₄: s = ∛(2.75 × 10⁻¹³) = 6.5 × 10⁻⁵‎؛ إذن ‎Ag₂CrO₄‎ أكثر ذوبانًا رغم أن ‎Ksp‎ له أصغر.", "إرشاد للطالب: مراجعة ص 46–47 وحل مسألتين للمقارنة بين الذوبانيات\nإرشاد لولي الأمر: تشجيع الابن على تذكر قاعدة «احسب ‎s‎ قبل المقارنة»\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6"], "h": ["<ol class=\"ol\"><li>يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎ (10 دقائق)<\/li><li>يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب الذوبانية المولارية لملح من قيمة ‎Ksp‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يقارن بين ذوبانيات أملاح مختلفة بالاعتماد على حساب الذوبانية لا على ‎Ksp‎ وحده<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب كتلة الملح المذابة في حجم معين من محلوله المشبع<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الذوبانية ‎s‎، الجذر التربيعي والتكعيبي، المقارنة بين الذوبانيات، الكتلة المذابة.<\/p>", "<p>يطرح المعلم: «‎Ksp‎ لـ ‎AgCl‎ أكبر من ‎Ksp‎ لـ ‎Ag₂CrO₄‎، فهل ‎AgCl‎ أكثر ذوبانًا بالضرورة؟» ويترك السؤال مفتوحًا حتى نهاية الحصة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يدلون بتوقعاتهم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل أمثلة لحساب ‎s‎ من ‎Ksp‎ لأملاح ‎1: 1 (s = √Ksp)‎ و‎1:2 (s = ∛(Ksp/4))‎، والطلبة يتبعون ويكتبون الخطوات (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسألة المقارنة بين ‎AgCl‎ و‎Ag₂CrO₄‎ لحلها في مجموعات، والطلبة يحسبون الذوبانيتين ويجيبون عن سؤال التهيئة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ذوبانية ‎BaSO₄‎ إذا كان ‎Ksp = 1.1 × 10⁻¹⁰ mol²/dm⁶‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎s = √(1.1 × 10⁻¹⁰) = 1.05 × 10⁻⁵ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ذوبانية ‎CaF₂‎ إذا كان ‎Ksp = 3.2 × 10⁻¹¹ mol³/dm⁹‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4s³ = 3.2 × 10⁻¹¹ ← s = 2.0 × 10⁻⁴ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تكفي مقارنة قيم ‎Ksp‎ لمقارنة ذوبانية ملحين مختلفي الصيغة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن العلاقة بين ‎s‎ و‎Ksp‎ تختلف حسب الصيغة (‎s²‎ أو ‎4s³‎)، فيجب حساب ‎s‎ لكل ملح.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب العلاقة بين ‎s‎ و‎Ksp‎ لملح ‎AB‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ksp = s²‎، أي ‎s = √Ksp‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ذوبانية ملح ‎AB‎ إذا كان ‎Ksp = 4.0 × 10⁻¹² mol²/dm⁶‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎s = 2.0 × 10⁻⁶ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ‎Ksp‎ لـ ‎AgCl = 1.8 × 10⁻¹⁰‎ و‎Ksp‎ لـ ‎Ag₂CrO₄ = 1.1 × 10⁻¹²‎. أيهما أكثر ذوبانًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AgCl: s = 1.3 × 10⁻⁵‎؛ ‎Ag₂CrO₄: s = ∛(2.75 × 10⁻¹³) = 6.5 × 10⁻⁵‎؛ إذن ‎Ag₂CrO₄‎ أكثر ذوبانًا رغم أن ‎Ksp‎ له أصغر.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 46–47 وحل مسألتين للمقارنة بين الذوبانيات<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على تذكر قاعدة «احسب ‎s‎ قبل المقارنة»<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6<\/p>"]}, {"axis": "التنبؤ بالترسيب بمقارنة حاصل الأيونات بـ ‎Ksp‎", "n": 4, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الاتزان والذوبانية"], ["الحصة", "4 من 6"], ["محور الحصة", "التنبؤ بالترسيب بمقارنة حاصل الأيونات بـ ‎Ksp‎"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 47–48"], ["دليل المعلم", "ص 68–73"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: ثابت حاصل الذوبانية ص 31"]], "t": ["1. يستخدم ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح شحيحة الذوبان عند خلط محلولين (15 دقيقة)\n2. يحسب حاصل ضرب التراكيز الأيونية بعد الخلط مع مراعاة تغير الحجم (15 دقيقة)\nمخرج تعليمي آخر: يفسر تكوّن الراسب في ضوء الاتزان بين المحلول المشبع والمادة الصلبة (10 دقائق)", "1. تطبيق: يستخدم ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح شحيحة الذوبان عند خلط محلولين\n2. تطبيق: يحسب حاصل ضرب التراكيز الأيونية بعد الخلط مع مراعاة تغير الحجم\n3. تحليل (مخرج آخر): يفسر تكوّن الراسب في ضوء الاتزان بين المحلول المشبع والمادة الصلبة", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- أخرى: محاليل نترات الفضة وكلوريد الصوديوم المخففة للعرض", "حاصل ضرب التراكيز الأيونية، الترسيب، المحلول غير المشبع، المحلول المشبع، التخفيف عند الخلط.", "يخلط المعلم قطرات من محلولي ‎AgNO₃‎ و‎NaCl‎ المخففين فيظهر راسب أبيض، ثم يخلط محلولين أكثر تخفيفًا فلا يظهر راسب، ويسأل: «لماذا ترسب في الأولى ولم يترسب في الثانية؟»", "1. ينفذ المعلم العرض ويطرح السؤال، والطلبة يقترحون أثر التركيز (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح قاعدة الترسيب: إذا تجاوز حاصل ضرب التراكيز ‎Ksp‎ يحدث ترسيب، والطلبة يكتبون القاعدة ويطبقونها على مثال (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. ينفذ المعلم «استخدام ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح» بمسائل خلط محلولين، والطلبة يحسبون التراكيز بعد الخلط ويتنبؤون بالترسيب (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم:\n1. مستوى المعرفة: متى يتكون راسب عند خلط محلولين؟\n• الإجابة النموذجية: عندما يكون حاصل ضرب تراكيز الأيونات (بالأسس المناسبة) أكبر من ‎Ksp‎.\n\n2. مستوى التطبيق: لماذا يجب حساب التراكيز بعد الخلط؟\n• الإجابة النموذجية: لأن الحجم الكلي يزداد فتنخفض تراكيز الأيونات.\n\n3. مستوى الاستدلال: خُلط ‎50 cm³‎ من ‎Ag⁺ (2.0 × 10⁻⁴ mol/dm³)‎ مع ‎50 cm³‎ من ‎Cl⁻ (2.0 × 10⁻⁴ mol/dm³)‎. هل يترسب ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎؟\n• الإجابة النموذجية: بعد الخلط كل تركيز ‎1.0 × 10⁻⁴‎؛ الحاصل = ‎1.0 × 10⁻⁸ > Ksp‎، فيترسب.", "1. مستوى المعرفة: ماذا يعني أن حاصل الأيونات أقل من ‎Ksp‎؟\n• الإجابة النموذجية: أن المحلول غير مشبع فلا يتكون راسب.\n\n2. مستوى التطبيق: ما الذي يحدث لتراكيز الأيونات عند خلط حجمين متساويين من محلولين؟\n• الإجابة النموذجية: يقل تركيز كل منها إلى النصف.\n\n3. مستوى الاستدلال: خُلط حجمان متساويان من ‎Ca²⁺ (2.0 × 10⁻³ mol/dm³)‎ و‎SO₄²⁻ (2.0 × 10⁻³ mol/dm³)‎. هل تترسب ‎CaSO₄ (Ksp = 2.4 × 10⁻⁵)‎؟\n• الإجابة النموذجية: بعد الخلط كل تركيز ‎1.0 × 10⁻³‎؛ الحاصل = ‎1.0 × 10⁻⁶ < Ksp‎، فلا تترسب.", "إرشاد للطالب: مراجعة ص 47–48 وحل مسألتي ترسيب\nإرشاد لولي الأمر: متابعة الابن في تذكر خطوة «التخفيف بعد الخلط»\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6"], "h": ["<ol class=\"ol\"><li>يستخدم ثوابت حاصل الذوبانية للتنبؤ بترسيب الأملاح شحيحة الذوبان عند خلط محلولين (15 دقيقة)<\/li><li>يحسب حاصل ضرب التراكيز الأيونية بعد الخلط مع مراعاة تغير الحجم (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر تكوّن الراسب في ضوء الاتزان بين المحلول المشبع والمادة الصلبة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\ \"opacity:.85\">• الإجابة النموذجية: يقل تركيز كل منها إلى النصف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> خُلط حجمان متساويان من ‎Ca²⁺ (2.0 × 10⁻³ mol/dm³)‎ و‎SO₄²⁻ (2.0 × 10⁻³ mol/dm³)‎. هل تترسب ‎CaSO₄ (Ksp = 2.4 × 10⁻⁵)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بعد الخلط كل تركيز ‎1.0 × 10⁻³‎؛ الحاصل = ‎1.0 × 10⁻⁶ &lt; Ksp‎، فلا تترسب.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 47–48 وحل مسألتي ترسيب<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في تذكر خطوة «التخفيف بعد الخلط»<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6<\/p>"]}, {"axis": "تأثير الأيون المشترك في الذوبانية", "n": 5, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الاتزان والذوبانية"], ["الحصة", "5 من 6"], ["محور الحصة", "تأثير الأيون المشترك في الذوبانية"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 48–49"], ["دليل المعلم", "ص 68–73"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: ثابت حاصل الذوبانية ص 31"]], "t": ["1. يفهم تأثير الأيون المشترك ويستخدمه لشرح انخفاض ذوبانية ملح في محلول يحتوي أحد أيوناته (20 دقيقة)\n2. يحسب ذوبانية ملح شحيح الذوبان في محلول يحتوي أيونًا مشتركًا (5 دقائق)\nمخرج تعليمي آخر: يربط تأثير الأيون المشترك بمبدأ لوشاتلييه وتطبيقات عملية (إزالة الأيونات) (15 دقيقة)", "1. فهم: يفهم تأثير الأيون المشترك ويستخدمه لشرح انخفاض ذوبانية ملح في محلول يحتوي أحد أيوناته\n2. تطبيق: يحسب ذوبانية ملح شحيح الذوبان في محلول يحتوي أيونًا مشتركًا\n3. تحليل (مخرج آخر): يربط تأثير الأيون المشترك بمبدأ لوشاتلييه وتطبيقات عملية (إزالة الأيونات)", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: محلول كلوريد الصوديوم المشبع وحمض الهيدروكلوريك المركز للعرض", "تأثير الأيون المشترك، الأيون المشترك، إزاحة الاتزان، انخفاض الذوبانية، مبدأ لوشاتلييه.", "يضيف المعلم قطرات من ‎HCl‎ المركز إلى محلول ‎NaCl‎ المشبع فتظهر بلورات، ويسأل: «لم نُضف ملحًا جديدًا؛ فمن أين جاءت البلورات؟»", "1. ينفذ المعلم العرض ويطرح السؤال، والطلبة يربطون ظهور البلورات بأيون ‎Cl⁻‎ المضاف (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم تأثير الأيون المشترك بمبدأ لوشاتلييه ويحل مثالًا لذوبانية ‎AgCl‎ في ‎NaCl‎، والطلبة يتبعون خطوات الحل بإهمال ‎s‎ أمام التركيز المضاف (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل متدرجة لذوبانية أملاح في محاليل بها أيون مشترك، والطلبة يحلون في مجموعات ويقارنون بالذوبانية في الماء النقي (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما تأثير إضافة ‎NaCl‎ على ذوبانية ‎AgCl‎؟\n• الإجابة النموذجية: تقل الذوبانية لأن زيادة ‎[Cl⁻]‎ تزيح الاتزان نحو ‎AgCl(s)‎.\n\n2. مستوى التطبيق: احسب ذوبانية ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎ في محلول ‎NaCl‎ تركيزه ‎0.10 mol/dm³‎.\n• الإجابة النموذجية: ‎s = Ksp ÷ [Cl⁻] = 1.8 × 10⁻⁹ mol/dm³‎.\n\n3. مستوى الاستدلال: لماذا نهمل ‎s‎ في ‎[Cl⁻] = 0.10 + s‎؟\n• الإجابة النموذجية: لأن ‎s‎ صغيرة جدًا مقارنة بـ 0.10.", "1. مستوى المعرفة: عرّف تأثير الأيون المشترك.\n• الإجابة النموذجية: انخفاض ذوبانية ملح شحيح الذوبان عند وجود أحد أيوناته في المحلول من مصدر آخر.\n\n2. مستوى التطبيق: كم مرة قلّت ذوبانية ‎AgCl‎ في المثال السابق مقارنة بالماء النقي ‎(1.3 × 10⁻⁵)‎؟\n• الإجابة النموذجية: نحو 7000 مرة تقريبًا ‎(1.3 × 10⁻⁵ ÷ 1.8 × 10⁻⁹)‎.\n\n3. مستوى الاستدلال: اقترح طريقة لإزالة أيونات ‎Pb²⁺‎ من ماء ملوث باستخدام فكرة الأيون المشترك.\n• الإجابة النموذجية: إضافة محلول يحتوي أنيونًا يكوّن مع ‎Pb²⁺‎ ملحًا شحيح الذوبان (مثل ‎I⁻‎ أو ‎SO₄²⁻‎) بزيادة، فتقل الذوبانية ويترسب الرصاص ثم يُرشح.", "إرشاد للطالب: مراجعة ص 48–49 وحل مسألتين على الأيون المشترك\nإرشاد لولي الأمر: الحديث مع الابن عن معالجة المياه بالترسيب في محطات التحلية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6"], "h": ["<ol class=\"ol\"><li>يفهم تأثير الأيون ال ترك بمبدأ لوشاتلييه ويحل مثالًا لذوبانية ‎AgCl‎ في ‎NaCl‎، والطلبة يتبعون خطوات الحل بإهمال ‎s‎ أمام التركيز المضاف (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل متدرجة لذوبانية أملاح في محاليل بها أيون مشترك، والطلبة يحلون في مجموعات ويقارنون بالذوبانية في الماء النقي (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما تأثير إضافة ‎NaCl‎ على ذوبانية ‎AgCl‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل الذوبانية لأن زيادة ‎[Cl⁻]‎ تزيح الاتزان نحو ‎AgCl(s)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ذوبانية ‎AgCl (Ksp = 1.8 × 10⁻¹⁰)‎ في محلول ‎NaCl‎ تركيزه ‎0.10 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎s = Ksp ÷ [Cl⁻] = 1.8 × 10⁻⁹ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نهمل ‎s‎ في ‎[Cl⁻] = 0.10 + s‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎s‎ صغيرة جدًا مقارنة بـ 0.10.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف تأثير الأيون المشترك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: انخفاض ذوبانية ملح شحيح الذوبان عند وجود أحد أيوناته في المحلول من مصدر آخر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كم مرة قلّت ذوبانية ‎AgCl‎ في المثال السابق مقارنة بالماء النقي ‎(1.3 × 10⁻⁵)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو 7000 مرة تقريبًا ‎(1.3 × 10⁻⁵ ÷ 1.8 × 10⁻⁹)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح طريقة لإزالة أيونات ‎Pb²⁺‎ من ماء ملوث باستخدام فكرة الأيون المشترك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إضافة محلول يحتوي أنيونًا يكوّن مع ‎Pb²⁺‎ ملحًا شحيح الذوبان (مثل ‎I⁻‎ أو ‎SO₄²⁻‎) بزيادة، فتقل الذوبانية ويترسب الرصاص ثم يُرشح.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 48–49 وحل مسألتين على الأيون المشترك<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن معالجة المياه بالترسيب في محطات التحلية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6<\/p>"]}, {"axis": "نشاط 1-5 والسؤال المفصلي ومسائل متدرجة في ‎Ksp‎", "n": 6, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الاتزان والذوبانية"], ["الحصة", "6 من 6"], ["محور الحصة", "نشاط 1-5 والسؤال المفصلي ومسائل متدرجة في ‎Ksp‎"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 44–49 + كتاب التجارب ص 31"], ["دليل المعلم", "ص 68–73"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-5: ثابت حاصل الذوبانية ص 31"]], "t": ["1. يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة (15 دقيقة)\n2. يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ (10 دقائق)\nمخرج تعليمي آخر: يصمم مسألة ‎Ksp‎ مع حلها النموذجي (15 دقيقة)", "1. تطبيق: يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة\n2. تحليل: يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ\n3. إبداع (مخرج آخر): يصمم مسألة ‎Ksp‎ مع حلها النموذجي", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- السؤال المفصلي", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "مراجعة ‎Ksp‎، الأخطاء الشائعة (نسيان الأسس، عدم مضاعفة التركيز)، تصميم المسائل.", "يعرض المعلم حلًّا خاطئًا لحساب ‎Ksp‎ لـ ‎CaF₂‎ يستخدم ‎[F⁻] = s‎ بدلًا من ‎2s‎، ويسأل: «أين الخطأ؟»", "1. يعرض المعلم الحل الخاطئ (السؤال المفصلي)، والطلبة يكتشفون الخطأ ويصححونه (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يوجه المعلم حل نشاط 1-5 (كتاب التجارب ص 31)، والطلبة يحلون فرديًا ثم يقارنون (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يكلف المجموعات بتصميم مسألة ‎Ksp‎ وتبادلها، والطلبة يصممون ويحلون مسائل زملائهم (11 دقيقة)\nالاستراتيجيات: السؤال المفصلي.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن نشاط 1-5 والسؤال المفصلي ومسائل متدرجة في ‎Ksp‎، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – سرّ كهف الهوتة: تفسّر المجموعات تكوّن الهوابط والصواعد في كهف الهوتة بولاية الحمراء بترسّب كربونات الكالسيوم عند تجاوز الحاصل الأيوني قيمة Ksp، وتقترح سلوكًا لحماية هذا الإرث الطبيعي (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما الخطأ في استخدام ‎[F⁻] = s‎ لـ ‎CaF₂‎؟\n• الإجابة النموذجية: كل وحدة ‎CaF₂‎ تعطي أيوني ‎F⁻‎، فيجب أن يكون ‎[F⁻] = 2s‎.\n\n2. مستوى التطبيق: ما الخطأ في كتابة ‎Ksp = [Ca²⁺][F⁻]‎ لـ ‎CaF₂‎؟\n• الإجابة النموذجية: نسيان رفع ‎[F⁻]‎ إلى الأس 2.\n\n3. مستوى الاستدلال: خطوات حل مسألة ترسيب: رتبها.\n• الإجابة النموذجية: حساب التراكيز بعد الخلط ← حساب حاصل الأيونات ← المقارنة بـ ‎Ksp ←‎ الاستنتاج.", "1. مستوى المعرفة: احسب ‎Ksp‎ لـ ‎Mg(OH)₂‎ إذا كانت ذوبانيته ‎1.1 × 10⁻⁴ mol/dm³‎.\n• الإجابة النموذجية: ‎[Mg²⁺] = 1.1 × 10⁻⁴‎، ‎[OH⁻] = 2.2 × 10⁻⁴‎؛ ‎Ksp = 1.1 × 10⁻⁴ × (2.2 × 10⁻⁴)² = 5.3 × 10⁻¹² mol³/dm⁹‎.\n\n2. مستوى التطبيق: لماذا تقل ذوبانية ‎Mg(OH)₂‎ في محلول ‎NaOH‎؟\n• الإجابة النموذجية: بسبب تأثير الأيون المشترك ‎OH⁻‎ الذي يزيح الاتزان نحو المادة الصلبة.\n\n3. مستوى الاستدلال: صمم مسألة لحساب ذوبانية ملح ‎AB‎ من ‎Ksp‎ مع حلها.\n• الإجابة النموذجية: مثال: ‎Ksp‎ لـ ‎AB = 2.5 × 10⁻¹³‎، ‎s = √(2.5 × 10⁻¹³) = 5.0 × 10⁻⁷ mol/dm³‎.", "إرشاد للطالب: إكمال نشاط 1-5 ص 31 وتصحيح الأخطاء الشائعة في الدفتر\nإرشاد لولي الأمر: متابعة الابن في حل مسألة من تصميم زميله\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6"], "h": ["<ol class=\"ol\"><li>يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة (15 دقيقة)<\/li><li>يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم مسألة ‎Ksp‎ مع حلها النموذجي (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 1-5 «ثابت حاصل الذوبانية» موظفًا الحسابات السابقة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحلل إجابات خاطئة في السؤال المفصلي ويحدد مصدر الخطأ<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم مسألة ‎Ksp‎ مع حلها النموذجي<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">السؤال المفصلي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مراجعة ‎Ksp‎، الأخطاء الشائعة (نسيان الأسس، عدم مضاعفة التركيز)، تصميم المسائل.<\/p>", "<p>يعرض المعلم حلًّا خاطئًا لحساب ‎Ksp‎ لـ ‎CaF₂‎ يستخدم ‎[F⁻] = s‎ بدلًا من ‎2s‎، ويسأل: «أين الخطأ؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الحل الخاطئ (السؤال المفصلي)، والطلبة يكتشفون الخطأ ويصححونه (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 1-5 (كتاب التجارب ص 31)، والطلبة يحلون فرديًا ثم يقارنون (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلف المجموعات بتصميم مسألة ‎Ksp‎ وتبادلها، والطلبة يصممون ويحلون مسائل زملائهم (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: السؤال المفصلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن نشاط 1-5 والسؤال المفصلي ومسائل متدرجة في ‎Ksp‎، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – سرّ كهف الهوتة: تفسّر المجموعات تكوّن الهوابط والصواعد في كهف الهوتة بولاية الحمراء بترسّب كربونات الكالسيوم عند تجاوز الحاصل الأيوني قيمة Ksp، وتقترح سلوكًا لحماية هذا الإرث الطبيعي (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطأ في استخدام ‎[F⁻] = s‎ لـ ‎CaF₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كل وحدة ‎CaF₂‎ تعطي أيوني ‎F⁻‎، فيجب أن يكون ‎[F⁻] = 2s‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الخطأ في كتابة ‎Ksp = [Ca²⁺][F⁻]‎ لـ ‎CaF₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نسيان رفع ‎[F⁻]‎ إلى الأس 2.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> خطوات حل مسألة ترسيب: رتبها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: حساب التراكيز بعد الخلط ← حساب حاصل الأيونات ← المقارنة بـ ‎Ksp ←‎ الاستنتاج.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎Ksp‎ لـ ‎Mg(OH)₂‎ إذا كانت ذوبانيته ‎1.1 × 10⁻⁴ mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[Mg²⁺] = 1.1 × 10⁻⁴‎، ‎[OH⁻] = 2.2 × 10⁻⁴‎؛ ‎Ksp = 1.1 × 10⁻⁴ × (2.2 × 10⁻⁴)² = 5.3 × 10⁻¹² mol³/dm⁹‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تقل ذوبانية ‎Mg(OH)₂‎ في محلول ‎NaOH‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بسبب تأثير الأيون المشترك ‎OH⁻‎ الذي يزيح الاتزان نحو المادة الصلبة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صمم مسألة لحساب ذوبانية ملح ‎AB‎ من ‎Ksp‎ مع حلها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مثال: ‎Ksp‎ لـ ‎AB = 2.5 × 10⁻¹³‎، ‎s = √(2.5 × 10⁻¹³) = 5.0 × 10⁻⁷ mol/dm³‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-5 ص 31 وتصحيح الأخطاء الشائعة في الدفتر<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حل مسألة من تصميم زميله<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=6<\/p>"]}]}, {"title": "المحاليل المنظمة", "sb": "ص 50–65", "unit": "الوحدة 1: الاتزان في المحاليل المائية", "periods": [{"axis": "تعريف المحلول المنظم وتحضيره وآلية عمله", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "المحاليل المنظمة"], ["الحصة", "1 من 3"], ["محور الحصة", "تعريف المحلول المنظم وتحضيره وآلية عمله"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "ص 50–52"], ["دليل المعلم", "ص 73–78"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-6: المحاليل المنظمة ص 32"]], "t": ["1. يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه (10 دقائق)\n2. يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة (10 دقائق)\nمخرج تعليمي آخر: يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض (20 دقيقة)", "1. فهم: يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه\n2. فهم: يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة\n3. تحليل (مخرج آخر): يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: محلول منظم ‎(CH₃COOH/CH₃COONa)‎، ماء مقطر، مقياس ‎pH‎، ‎HCl‎ و‎NaOH‎ مخففان", "المحلول المنظم، الحمض الضعيف، القاعدة المرافقة، الملح، مقاومة تغير ‎pH‎، المخزون الكبير من ‎HA‎ و‎A⁻‎.", "يعرض المعلم مقطعًا لإضافة حمض إلى عينة دم ويسأل: «لو تغير ‎pH‎ الدم بمقدار 0.4 لتعرضت حياتك للخطر؛ فكيف يقاوم الدم التغير عند تناول أطعمة حمضية؟»", "1. يعرض المعلم المقطع ويطرح السؤال، والطلبة يقترحون وجود مواد تقاوم التغير (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يجري عرضًا: إضافة قطرات ‎HCl‎ إلى الماء وإلى المحلول المنظم وقياس ‎pH‎، والطلبة يسجلون التغير في الحالتين ويقارنون (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يشرح المعلم تعريف المحلول المنظم وآلية عمله بالمعادلات (‎A⁻‎ يستهلك ‎H⁺‎، و‎HA‎ يعادل ‎OH⁻‎)، والطلبة يكتبون معادلتي الاستجابة لإضافة الحمض والقاعدة (17 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف المحلول المنظم.\n• الإجابة النموذجية: محلول يقاوم التغير في ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة.\n\n2. مستوى التطبيق: اكتب معادلة تفاعل المنظم ‎CH₃COOH/CH₃COO⁻‎ مع حمض مضاف.\n• الإجابة النموذجية: ‎CH₃COO⁻ + H⁺ → CH₃COOH‎\n\n3. مستوى الاستدلال: لماذا يجب أن يحتوي المنظم كميات كبيرة من ‎HA‎ و‎A⁻‎ معًا؟\n• الإجابة النموذجية: ليتوفر مخزون يستهلك ‎H⁺‎ أو ‎OH⁻‎ المضاف دون أن تتغير النسبة ‎[HA]/[A⁻]‎ كثيرًا.", "1. مستوى المعرفة: من أي مكونين يُحضّر المنظم الحمضي؟\n• الإجابة النموذجية: حمض ضعيف وأحد أملاحه مع قاعدة قوية (القاعدة المرافقة).\n\n2. مستوى التطبيق: اكتب معادلة تفاعل المنظم مع قاعدة مضافة.\n• الإجابة النموذجية: ‎CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O‎\n\n3. مستوى الاستدلال: لماذا لا يصلح خليط ‎HCl‎ و‎NaCl‎ محلولًا منظمًا؟\n• الإجابة النموذجية: لأن ‎HCl‎ حمض قوي متأين كليًا، و‎Cl⁻‎ قاعدة مرافقة ضعيفة جدًا لا تستهلك ‎H⁺‎ المضاف.", "إرشاد للطالب: مراجعة ص 50–52 وكتابة معادلات عمل المنظم\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية ثبات ‎pH‎ الدم للحياة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=7"], "h": ["<ol class=\"ol\"><li>يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه (10 دقائق)<\/li><li>يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يعرّف المحلول المنظم ويشرح كيفية تحضيره من حمض ضعيف وأحد أملاحه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح باستخدام المعادلات الكيميائية كيف يتحكم المحلول المنظم في قيمة ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين استجابة الماء والمحلول المنظم لإضافة حمض<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><span class=\"chip r\">أخرى: محلول منظم ‎(CH₃COOH/CH₃COONa)‎، ماء مقطر، مقياس ‎pH‎، ‎HCl‎ و‎NaOH‎ مخففان<\/span><\/div>", "<p>المحلول المنظم، الحمض الضعيف، القاعدة المرافقة، الملح، مقاومة تغير ‎pH‎، المخزون الكبير من ‎HA‎ و‎A⁻‎.<\/p>", "<p>يعرض المعلم مقطعًا لإضافة حمض إلى عينة دم ويسأل: «لو تغير ‎pH‎ الدم بمقدار 0.4 لتعرضت حياتك للخطر؛ فكيف يقاوم الدم التغير عند تناول أطعمة حمضية؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المقطع ويطرح السؤال، والطلبة يقترحون وجود مواد تقاوم التغير (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يجري عرضًا: إضافة قطرات ‎HCl‎ إلى الماء وإلى المحلول المنظم وقياس ‎pH‎، والطلبة يسجلون التغير في الحالتين ويقارنون (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يشرح المعلم تعريف المحلول المنظم وآلية عمله بالمعادلات (‎A⁻‎ يستهلك ‎H⁺‎، و‎HA‎ يعادل ‎OH⁻‎)، والطلبة يكتبون معادلتي الاستجابة لإضافة الحمض والقاعدة (17 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف المحلول المنظم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: محلول يقاوم التغير في ‎pH‎ عند إضافة كميات قليلة من حمض أو قاعدة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تفاعل المنظم ‎CH₃COOH/CH₃COO⁻‎ مع حمض مضاف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COO⁻ + H⁺ → CH₃COOH‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يجب أن يحتوي المنظم كميات كبيرة من ‎HA‎ و‎A⁻‎ معًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ليتوفر مخزون يستهلك ‎H⁺‎ أو ‎OH⁻‎ المضاف دون أن تتغير النسبة ‎[HA]/[A⁻]‎ كثيرًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> من أي مكونين يُحضّر المنظم الحمضي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حمض ضعيف وأحد أملاحه مع قاعدة قوية (القاعدة المرافقة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تفاعل المنظم مع قاعدة مضافة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يصلح خليط ‎HCl‎ و‎NaCl‎ محلولًا منظمًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎HCl‎ حمض قوي متأين كليًا، و‎Cl⁻‎ قاعدة مرافقة ضعيفة جدًا لا تستهلك ‎H⁺‎ المضاف.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 50–52 وكتابة معادلات عمل المنظم<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أهمية ثبات ‎pH‎ الدم للحياة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=7<\/p>"]}, {"axis": "حساب ‎pH‎ المحلول المنظم", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "المحاليل المنظمة"], ["الحصة", "2 من 3"], ["محور الحصة", "حساب ‎pH‎ المحلول المنظم"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "ص 52–55"], ["دليل المعلم", "ص 73–78"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-6: المحاليل المنظمة ص 32"]], "t": ["1. يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎ (10 دقائق)\n2. يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة (15 دقيقة)\nمخرج تعليمي آخر: يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه (15 دقيقة)", "1. تطبيق: يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎\n2. تطبيق: يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة\n3. تحليل (مخرج آخر): يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "‎[H⁺] = Ka[HA]/[A⁻]‎، ‎pH = pKa + log([A⁻]/[HA])‎، نسبة المكونات، تحضير منظم بقيمة محددة.", "يسأل المعلم: «لو أردت تحضير محلول منظم ‎pH‎ له 4.76 بالضبط من حمض الإيثانويك وإيثانوات الصوديوم، فكم من كل منهما تحتاج؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون كميات متساوية ويبررون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم العلاقة ويحل المثال 12 في كتاب الطالب ومثالًا لتحضير منظم بقيمة محددة، والطلبة يتبعون الخطوات ويطبقونها (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم «حساب الرقم الهيدروجيني للمحاليل المنظمة» بمسائل متدرجة، والطلبة يحلون في أزواج (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ‎pH‎ لمنظم فيه ‎[CH₃COOH] = 0.10‎ و‎[CH₃COO⁻] = 0.10 (Ka = 1.74 × 10⁻⁵)‎.\n• الإجابة النموذجية: ‎[H⁺] = Ka = 1.74 × 10⁻⁵‎، ‎pH = 4.76‎.\n\n2. مستوى التطبيق: احسب ‎pH‎ إذا أصبح ‎[CH₃COO⁻] = 0.20‎ و‎[CH₃COOH] = 0.10‎.\n• الإجابة النموذجية: ‎[H⁺] = 1.74 × 10⁻⁵ × 0.10/0.20 = 8.7 × 10⁻⁶‎، ‎pH = 5.06‎.\n\n3. مستوى الاستدلال: متى يكون ‎pH = pKa‎ في المنظم؟\n• الإجابة النموذجية: عندما يتساوى ‎[HA]‎ و‎[A⁻]‎.", "1. مستوى المعرفة: اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ في المنظم.\n• الإجابة النموذجية: ‎[H⁺] = Ka × [HA] / [A⁻]‎\n\n2. مستوى التطبيق: احسب ‎pH‎ لمنظم فيه ‎[HA] = 0.20‎ و‎[A⁻] = 0.050 (Ka = 1.0 × 10⁻⁵)‎.\n• الإجابة النموذجية: ‎[H⁺] = 4.0 × 10⁻⁵‎، ‎pH = 4.40‎.\n\n3. مستوى الاستدلال: ما نسبة ‎[A⁻]/[HA]‎ اللازمة لمنظم ‎pH‎ له 5.76 من حمض الإيثانويك ‎(pKa = 4.76)‎؟\n• الإجابة النموذجية: ‎5.76 = 4.76 + log(‎النسبة)، النسبة = 10.", "إرشاد للطالب: مراجعة ص 52–55 وحل ثلاث مسائل ‎pH‎ للمنظمات\nإرشاد لولي الأمر: متابعة الابن في كتابة العلاقة وتعويض القيم بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=7"], "h": ["<ol class=\"ol\"><li>يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎ (10 دقائق)<\/li><li>يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب ‎pH‎ للمحلول المنظم باستخدام ‎[H⁺] = Ka × [HA]/[A⁻]‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب نسبة ‎[HA]/[A⁻]‎ اللازمة لتحضير منظم بقيمة ‎pH‎ محددة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يستنتج أن ‎pH = pKa‎ عندما يتساوى تركيزا الحمض وملحه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>‎[H⁺] = Ka[HA]/[A⁻]‎، ‎pH = pKa + log([A⁻]/[HA])‎، نسبة المكونات، تحضير منظم بقيمة محددة.<\/p>", "<p>يسأل المعلم: «لو أردت تحضير محلول منظم ‎pH‎ له 4.76 بالضبط من حمض الإيثانويك وإيثانوات الصوديوم، فكم من كل منهما تحتاج؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون كميات متساوية ويبررون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم العلاقة ويحل المثال 12 في كتاب الطالب ومثالًا لتحضير منظم بقيمة محددة، والطلبة يتبعون الخطوات ويطبقونها (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم «حساب الرقم الهيدروجيني للمحاليل المنظمة» بمسائل متدرجة، والطلبة يحلون في أزواج (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎pH‎ لمنظم فيه ‎[CH₃COOH] = 0.10‎ و‎[CH₃COO⁻] = 0.10 (Ka = 1.74 × 10⁻⁵)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = Ka = 1.74 × 10⁻⁵‎، ‎pH = 4.76‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎pH‎ إذا أصبح ‎[CH₃COO⁻] = 0.20‎ و‎[CH₃COOH] = 0.10‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 1.74 × 10⁻⁵ × 0.10/0.20 = 8.7 × 10⁻⁶‎، ‎pH = 5.06‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> متى يكون ‎pH = pKa‎ في المنظم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عندما يتساوى ‎[HA]‎ و‎[A⁻]‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ في المنظم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = Ka × [HA] / [A⁻]‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎pH‎ لمنظم فيه ‎[HA] = 0.20‎ و‎[A⁻] = 0.050 (Ka = 1.0 × 10⁻⁵)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 4.0 × 10⁻⁵‎، ‎pH = 4.40‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما نسبة ‎[A⁻]/[HA]‎ اللازمة لمنظم ‎pH‎ له 5.76 من حمض الإيثانويك ‎(pKa = 4.76)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎5.76 = 4.76 + log(‎النسبة)، النسبة = 10.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 52–55 وحل ثلاث مسائل ‎pH‎ للمنظمات<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة العلاقة وتعويض القيم بدقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=7<\/p>"]}, {"axis": "استخدامات المحاليل المنظمة ودور ‎HCO₃⁻‎ في الدم ومراجعة الوحدة الأولى", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "المحاليل المنظمة"], ["الحصة", "3 من 3"], ["محور الحصة", "استخدامات المحاليل المنظمة ودور ‎HCO₃⁻‎ في الدم ومراجعة الوحدة الأولى"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "ص 55–65 + كتاب التجارب ص 32"], ["دليل المعلم", "ص 73–78"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-6: المحاليل المنظمة ص 32"]], "t": ["1. يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم (15 دقيقة)\n2. يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى (15 دقيقة)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الأولى بقائمة التقويم الذاتي (10 دقائق)", "1. فهم: يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم\n2. تطبيق: يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى\n3. تقييم (مخرج آخر): يقيّم تعلمه في الوحدة الأولى بقائمة التقويم الذاتي", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "منظم البيكربونات، ‎H₂CO₃/HCO₃⁻‎، ‎pH‎ الدم (نحو 7.4)، تطبيقات المنظمات (الأدوية، الأغذية، الشامبو)، ملخص الوحدة.", "يعرض المعلم عبوات (شامبو، قطرة عين، دواء فوار) ويسأل: «ما المشترك بينها في المكونات الكيميائية؟»", "1. يعرض المعلم العبوات ويطرح السؤال، والطلبة يستنتجون احتواءها على منظمات (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ينفذ المعلم «ضبط الرقم الهيدروجيني في الدم» ويشرح معادلتي ‎HCO₃⁻‎ مع ‎H⁺‎ و‎H₂CO₃‎ مع ‎OH⁻‎، والطلبة يكتبون المعادلتين ويفسرون الاستجابة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوجه المعلم حل نشاط 1-6 (كتاب التجارب ص 32) وأسئلة مختارة من نهاية الوحدة (ص 59–65)، والطلبة يحلون في مجموعات ويعرضون (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «ما الأيون الرئيس في منظم الدم» على السبورة، ويناقش المعلم الإجابات مع الصف (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – منظّم المجتمع: تشبّه المجموعات المحلول المنظم الذي يقاوم تغيّر الرقم الهيدروجيني بالتكافل العماني الذي يخفّف أثر الأزمات على الأسر، وتكتب معادلة تفسّر عمل المنظم عند إضافة حمض (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب معادلة استجابة منظم الدم لزيادة ‎H⁺‎.\n• الإجابة النموذجية: ‎HCO₃⁻ + H⁺ → H₂CO₃‎\n\n2. مستوى التطبيق: ما قيمة ‎pH‎ الدم الطبيعية تقريبًا؟\n• الإجابة النموذجية: نحو 7.4.\n\n3. مستوى الاستدلال: اذكر استخدامين للمحاليل المنظمة.\n• الإجابة النموذجية: في الأدوية وقطرات العين، وفي حفظ الأغذية، وفي الشامبو ومنتجات العناية.", "1. مستوى المعرفة: ما الأيون الرئيس في منظم الدم؟\n• الإجابة النموذجية: أيون الهيدروجين كربونات ‎HCO₃⁻‎.\n\n2. مستوى التطبيق: اكتب معادلة استجابة منظم الدم لزيادة ‎OH⁻‎.\n• الإجابة النموذجية: ‎H₂CO₃ + OH⁻ → HCO₃⁻ + H₂O‎\n\n3. مستوى الاستدلال: لماذا يُعد التغير البسيط في ‎pH‎ الدم خطرًا على الجسم؟\n• الإجابة النموذجية: لأن الإنزيمات والبروتينات تعمل ضمن مدى ضيق من ‎pH‎، والتغير يغير شكلها ويعطل وظائفها.", "إرشاد للطالب: إكمال نشاط 1-6 ص 32 ومراجعة ملخص الوحدة ص 58 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الأولى\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=7"], "h": ["<ol class=\"ol\"><li>يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم (15 دقيقة)<\/li><li>يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الأولى بقائمة التقويم الذاتي (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف استخدامات المحاليل المنظمة ويشرح دور ‎HCO₃⁻‎ في التحكم بقيمة ‎pH‎ الدم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 1-6 «المحاليل المنظمة» وأسئلة مختارة من نهاية الوحدة الأولى<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed ><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلف الطلبة برسم مخطط الاتزان لفلزين مختلفين وتقويم مخططات بعضهم، والطلبة يقارنون ميل ‎Zn‎ و‎Cu‎ لفقد الإلكترونات ويستنتجون الفرق في جهد القطب (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقصود بنصف الخلية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فلز (أو قطب خامل) مغموس في محلول يحتوي أيوناته، يحدث فيه نصف تفاعل أكسدة أو اختزال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة الاتزان لنصف الخلية ‎Zn²⁺/Zn‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Zn²⁺(aq) + 2e⁻ ⇌ Zn(s)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يصبح الخارصين أكثر سالبية من النحاس في محلول أيوناته؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ميله لفقد الإلكترونات أكبر، فيتراكم على سطحه عدد أكبر من الإلكترونات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف جهد القطب.<br><span style=\"opacity:.85\">• الإجابة النموذجية: فرق الجهد الكهربائي بين الفلز (القطب) ومحلول أيوناته في نصف الخلية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما العملية التي تحدث عند فقد الإلكترونات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الأكسدة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يمكن قياس جهد قطب مفرد مباشرة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن القياس يتطلب توصيل الفولتميتر بقطبين، فنقيس دائمًا فرقًا بين نصفي خلية.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 67–68 وكتابة معادلات اتزان لثلاثة أنصاف خلايا<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن البطاريات بوصفها خلايا كهروكيميائية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=8<\/p>"]}, {"axis": "الخلية الجلفانية وقياس جهد الخلية", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "جهود الأقطاب الكهربائية ‎(E)‎"], ["الحصة", "2 من 2"], ["محور الحصة", "الخلية الجلفانية وقياس جهد الخلية"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "ص 68–69 + كتاب التجارب ص 44"], ["دليل المعلم", "ص 101–103"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-1: الخلايا الكهروكيميائية ص 44"]], "t": ["1. يصف مكونات الخلية الجلفانية: نصفا الخلية، والسلك، والفولتميتر عالي المقاومة، والقنطرة الملحية (20 دقيقة)\n2. يشرح وظيفة القنطرة الملحية وسبب استخدام فولتميتر عالي المقاومة (5 دقائق)\nمخرج تعليمي آخر: يحل نشاط 2-1 «الخلايا الكهروكيميائية» والسؤال 1 (15 دقيقة)", "1. فهم: يصف مكونات الخلية الجلفانية: نصفا الخلية، والسلك، والفولتميتر عالي المقاومة، والقنطرة الملحية\n2. فهم: يشرح وظيفة القنطرة الملحية وسبب استخدام فولتميتر عالي المقاومة\n3. تطبيق (مخرج آخر): يحل نشاط 2-1 «الخلايا الكهروكيميائية» والسؤال 1", "- التعلم بالنمذجة\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نصفا خلية ‎Zn/Cu‎، قنطرة ملحية (ورق ترشيح مشبع بـ ‎KNO₃‎)، فولتميتر، أسلاك", "الخلية الجلفانية (الكهروكيميائية)، القنطرة الملحية، الفولتميتر عالي المقاومة، الدائرة الخارجية، جهد الخلية.", "يعرض المعلم ليمونة موصولة بمسماري خارصين ونحاس وفولتميتر يقرأ جهدًا ويسأل: «من أين جاء هذا الجهد؟»", "1. يعرض المعلم خلية الليمون، والطلبة يقترحون تفاعل أكسدة واختزال بين الفلزين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يبني المعلم خلية ‎Zn/Cu‎ أمام الطلبة ويشرح «قياس جهود الخلية» والشكل 2-3، والطلبة يرسمون الخلية ويحددون أجزاءها واتجاه الإلكترونات (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يوجه المعلم حل نشاط 2-1 (كتاب التجارب ص 44) والسؤال 1، والطلبة يحلون في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الخلية الجلفانية وقياس جهد الخلية، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – فضة الحِرفيين: تتنبّأ كل مجموعة أيّ الفلزين الفضة أم النحاس أسهل فقدًا للإلكترونات من قيم جهود الأقطاب، وتربط ذلك بصناعة الحلي والخناجر الفضية في نزوى وحفظها من التآكل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما وظيفة القنطرة الملحية؟\n• الإجابة النموذجية: إكمال الدائرة الكهربائية بالسماح بحركة الأيونات بين نصفي الخلية دون اختلاط المحلولين.\n\n2. مستوى التطبيق: لماذا يُستخدم فولتميتر عالي المقاومة؟\n• الإجابة النموذجية: لمنع مرور تيار كبير يغير التراكيز فيقيس فرق الجهد الأقصى للخلية.\n\n3. مستوى الاستدلال: لماذا لا تُستخدم قنطرة من سلك فلزي بدل القنطرة الملحية؟\n• الإجابة النموذجية: لأن السلك ينقل الإلكترونات لا الأيونات، فلا يعادل تراكم الشحنات في المحلولين.", "1. مستوى المعرفة: ما الأيونات المستخدمة عادة في القنطرة الملحية؟\n• الإجابة النموذجية: أيونات ملح لا يتفاعل مثل ‎KNO₃‎ أو ‎KCl‎.\n\n2. مستوى التطبيق: في خلية ‎Zn/Cu‎، في أي اتجاه تتحرك الإلكترونات في السلك؟\n• الإجابة النموذجية: من الخارصين إلى النحاس.\n\n3. مستوى الاستدلال: ماذا يحدث لقراءة الفولتميتر إذا أُزيلت القنطرة الملحية؟\n• الإجابة النموذجية: تهبط إلى الصفر لأن الدائرة تصبح مفتوحة.", "إرشاد للطالب: إكمال نشاط 2-1 ص 44 والسؤال 1\nإرشاد لولي الأمر: يمكن تنفيذ خلية اللي  < Fe²⁺ < Cu²⁺‎.", "إرشاد للطالب: مراجعة ص 71–72 والتعرف على سلسلة جهود الاختزال القياسية في الملحق 2\nإرشاد لولي الأمر: تشجيع الابن على حفظ الظروف القياسية الثلاثة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=9"], "h": ["<ol class=\"ol\"><li>يعرّف جهد الاختزال القياسي ‎E°‎ لنصف خلية (10 دقائق)<\/li><li>يكتب الظروف القياسية: ‎298 K‎، و‎1.00 mol/dm³‎ للأيونات، و‎100 kPa‎ للغازات (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر معنى إشارة ‎E° (‎موجبة أو سالبة) بالنسبة إلى قطب الهيدروجين (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف جهد الاختزال القياسي ‎E°‎ لنصف خلية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يكتب الظروف القياسية: ‎298 K‎، و‎1.00 mol/dm³‎ للأيونات، و‎100 kPa‎ للغازات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر معنى إشارة ‎E° (‎موجبة أو سالبة) بالنسبة إلى قطب الهيدروجين<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)<\/span><\/div>", "<p>جهد الاختزال القياسي ‎E°‎، الظروف القياسية، الإشارة الموجبة والسالبة، سلسلة جهود الاختزال القياسية.<\/p>", "<p>يعرض المعلم قيمتين: ‎Zn²⁺/Zn = −0.76 V‎ و‎Cu²⁺/Cu = +0.34 V‎ ويسأل: «ماذا تخبرنا الإشارة عن ميل كل أيون لكسب الإلكترونات مقارنة بـ ‎H⁺‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم القيمتين ويطرح السؤال، والطلبة يقترحون تفسير الإش الب والمصعد والمهبط في خلية قياس ‎E°‎\n3. تطبيق (مخرج آخر): يكتب نصفي التفاعل والتفاعل الكلي في خلية ‎Zn/H₂‎", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "الفلز/أيون الفلز، المصعد (الأنود)، المهبط (الكاثود)، القطب السالب، القطب الموجب، قراءة الفولتميتر.", "يعرض المعلم الشكل 2-6 (خلية ‎Zn‎ مع قطب الهيدروجين) بقراءة ‎0.76 V‎ ويسأل: «كيف نعرف أن ‎E° = −0.76‎ لا +0.76؟»", "1. يعرض المعلم الشكل ويطرح السؤال، والطلبة يقترحون تحديد القطب السالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم ترتيب التجربة وتحديد القطب السالب ‎(Zn)‎ والموجب وكتابة نصفي التفاعل، والطلبة يكتبون نصفي التفاعل ويحددون المصعد والمهبط (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم أمثلة لأنصاف خلايا (‎Cu‎، ‎Ag‎، ‎Mg‎) مع قطب الهيدروجين لتحليلها، والطلبة يحددون الإشارات واتجاه الإلكترونات في مجموعات (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما القطب السالب في خلية ‎Zn‎ مع قطب الهيدروجين؟\n• الإجابة النموذجية: قطب الخارصين.\n\n2. مستوى التطبيق: اكتب نصف تفاعل الأكسدة في هذه الخلية.\n• الإجابة النموذجية: ‎Zn(s) → Zn²⁺(aq) + 2e⁻‎\n\n3. مستوى الاستدلال: إذا كان قطب النحاس هو الموجب وقراءة الفولتميتر ‎0.34 V‎، فما ‎E°‎ لـ ‎Cu²⁺/Cu‎؟\n• الإجابة النموذجية: ‎+0.34 V‎.", "1. مستوى المعرفة: عند أي قطب يحدث الاختزال؟\n• الإجابة النموذجية: المهبط (الكاثود).\n\n2. مستوى التطبيق: في خلية ‎Zn/H₂‎ القياسية، أين يحدث الاختزال؟\n• الإجابة النموذجية: عند قطب الهيدروجين: ‎2H⁺ + 2e⁻ → H₂‎.\n\n3. مستوى الاستدلال: اكتب التفاعل الكلي لخلية مكونة من ‎Zn²⁺/Zn‎ وقطب الهيدروجين القياسي.\n• الإجابة النموذجية: ‎Zn(s) + 2H⁺(aq) → Zn²⁺(aq) + H₂(g)‎", "إرشاد للطالب: مراجعة ص 72–73 ورسم خلية قياس ‎E°‎ لنصف خلية ‎Cu‎\nإرشاد لولي الأمر: متابعة الابن في التمييز بين المصعد والمهبط\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=9"], "h": ["<ol class=\"ol\"><li>يصف
