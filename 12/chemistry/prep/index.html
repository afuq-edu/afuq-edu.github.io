e class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ناتج أكسدة بروبان-2-ول؟</td><td>بروبانون.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُقطّر الألدهيد فور تكونه؟</td><td>لمنع أكسدته أكثر إلى حمض كربوكسيلي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما ناتج اختزال بيوتانون بـ ‎NaBH₄‎؟</td><td>بيوتان-2-ول.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما لون محلول ثنائي كرومات البوتاسيوم قبل الأكسدة وبعدها؟</td><td>برتقالي قبل، وأخضر بعد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة أكسدة الإيثانول إلى إيثانال باستخدام ‎[O]‎.</td><td>‎CH₃CH₂OH + [O] → CH₃CHO + H₂O‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب معادلة اختزال إيثانال باستخدام ‎[H]‎ وسمِّ الناتج.</td><td>‎CH₃CHO + 2[H] → CH₃CH₂OH‎، إيثانول.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 141–142 وإكمال نشاط 4-2 ص 92</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تغير لون ثنائي كرومات ودلالته</p>"]},{"axis":"التمييز بين الألدهيدات والكيتونات بكاشفي فهلينج وتولن","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلتان المتجانستان للألدهيدات والكيتونات"],["الحصة","3 من 3"],["محور الحصة","التمييز بين الألدهيدات والكيتونات بكاشفي فهلينج وتولن"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 142"],["دليل المعلم","ص 178–182"],["كتاب التجارب العملية والأنشطة","نشاط 4-2: مركبات الكربونيل: التحضير والاختزال ص 92"]],"t":["1. يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن\n2. يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة\nمخرج تعليمي آخر: يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع","- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","كاشف فهلينج، الراسب الأحمر الطوبي ‎(Cu₂O)‎، كاشف تولن، المرآة الفضية، العامل المؤكسد المعتدل، الألدهيد قابل للأكسدة، الكيتون لا يتأكسد.","يعرض المعلم صورة أنبوب مبطن بمرآة فضية لامعة ويسأل: «كيف ظهرت هذه المرآة من محلول شفاف؟ وأي نوع من مركبات الكربونيل يسببها؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يتوقعون حدوث اختزال لأيونات الفضة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح كاشفي فهلينج وتولن ونتائجهما مع الألدهيدات والكيتونات\nالطالب: يكملون جدول النتائج\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم بطاقات مركبات مجهولة مع نتائج اختبارات لتحديد هويتها\nالطالب: يحللون النتائج في مجموعات ويرسمون مخطط تحديد الهوية\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الألدهيدات والكيتونات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما نتيجة تسخين الإيثانال مع محلول فهلينج؟\n   الإجابة النموذجية: يتحول اللون الأزرق إلى راسب أحمر طوبي.\n2) (المستوى المتوقع) السؤال: ما نتيجة تسخين البروبانون مع كاشف تولن؟\n   الإجابة النموذجية: لا يحدث تغير (لا تتكون مرآة فضية).\n3) (المستوى المتقدم) السؤال: لماذا يعطي الألدهيد نتيجة موجبة مع الكاشفين؟\n   الإجابة النموذجية: لأنه يتأكسد بسهولة إلى حمض كربوكسيلي فيختزل أيونات ‎Cu²⁺‎ أو ‎Ag⁺‎.","1) (مستوى الدعم) السؤال: ما الناتج المرئي لكاشف تولن مع الألدهيد؟\n   الإجابة النموذجية: مرآة فضية (أو راسب فضي).\n2) (المستوى المتوقع) السؤال: لماذا لا يتفاعل الكيتون مع كاشف فهلينج؟\n   الإجابة النموذجية: لأن الكيتون لا يتأكسد بالعوامل المؤكسدة المعتدلة.\n3) (المستوى المتقدم) السؤال: مركب ‎C₃H₆O‎ يعطي راسبًا أحمر مع فهلينج ولا يعطي راسبًا أصفر مع اليود القلوي. ما هو؟\n   الإجابة النموذجية: بروبانال.","إرشاد للطالب: مراجعة ص 142 وتلخيص نتائج الاختبارات الثلاثة في جدول\nإرشاد لولي الأمر: تشجيع الابن على رسم مخطط تحديد هوية مركب مجهول"],"h":["<ol class=\"ol\"><li>يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن</li><li>يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان</td><td class=\"lv\">إبداع</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على حل المشكلات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>كاشف فهلينج، الراسب الأحمر الطوبي ‎(Cu₂O)‎، كاشف تولن، المرآة الفضية، العامل المؤكسد المعتدل، الألدهيد قابل للأكسدة، الكيتون لا يتأكسد.</p>","<p>يعرض المعلم صورة أنبوب مبطن بمرآة فضية لامعة ويسأل: «كيف ظهرت هذه المرآة من محلول شفاف؟ وأي نوع من مركبات الكربونيل يسببها؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح السؤال</td><td>يتوقعون حدوث اختزال لأيونات الفضة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح كاشفي فهلينج وتولن ونتائجهما مع الألدهيدات والكيتونات</td><td>يكملون جدول النتائج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم بطاقات مركبات مجهولة مع نتائج اختبارات لتحديد هويتها</td><td>يحللون النتائج في مجموعات ويرسمون مخطط تحديد الهوية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على الألدهيدات والكيتونات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نتيجة تسخين الإيثانال مع محلول فهلينج؟</td><td>يتحول اللون الأزرق إلى راسب أحمر طوبي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما نتيجة تسخين البروبانون مع كاشف تولن؟</td><td>لا يحدث تغير (لا تتكون مرآة فضية).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يعطي الألدهيد نتيجة موجبة مع الكاشفين؟</td><td>لأنه يتأكسد بسهولة إلى حمض كربوكسيلي فيختزل أيونات ‎Cu²⁺‎ أو ‎Ag⁺‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الناتج المرئي لكاشف تولن مع الألدهيد؟</td><td>مرآة فضية (أو راسب فضي).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يتفاعل الكيتون مع كاشف فهلينج؟</td><td>لأن الكيتون لا يتأكسد بالعوامل المؤكسدة المعتدلة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>مركب ‎C₃H₆O‎ يعطي راسبًا أحمر مع فهلينج ولا يعطي راسبًا أصفر مع اليود القلوي. ما هو؟</td><td>بروبانال.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 142 وتلخيص نتائج الاختبارات الثلاثة في جدول</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على رسم مخطط تحديد هوية مركب مجهول</p>"]}]},{"title":"السلسلة المتجانسة للأحماض الكربوكسيلية","sb":"ص 143","unit":"الوحدة 4: مشتقات الهيدروكربونات (1)","periods":[{"axis":"تسمية الأحماض الكربوكسيلية وتحضيرها","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للأحماض الكربوكسيلية"],["الحصة","1 من 2"],["محور الحصة","تسمية الأحماض الكربوكسيلية وتحضيرها"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 143 + كتاب التجارب ص 93"],["دليل المعلم","ص 182–184"],["كتاب التجارب العملية والأنشطة","نشاط 4-3: الأحماض الكربوكسيلية وتحضيرها ص 93؛ نشاط 4-4: تفاعلات الأحماض الكربوكسيلية ص 94"]],"t":["1. يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية\n2. يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات\nمخرج تعليمي آخر: يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: الجدول 4-4 في كتاب الطالب، كتاب التجارب العملية والأنشطة","مجموعة الكربوكسيل –‎COOH‎، حمض الميثانويك، حمض الإيثانويك، التسخين مع الإرجاع (الارتداد)، الأكسدة الكاملة.","يعرض المعلم زجاجة خل ويسأل: «الخل يحتوي حمض الإيثانويك الناتج من أكسدة الإيثانول بالبكتيريا؛ فكيف نحضره في المختبر؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الزجاجة ويطرح السؤال\nالطالب: يقترحون أكسدة الإيثانول\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يعرّف السلسلة المتجانسة بالجدول 4-4 ويشرح التسمية والتحضير بالإرجاع\nالطالب: يسمون أحماضًا ويكتبون معادلة الأكسدة الكاملة باستخدام ‎2[O]‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 4-3 «الأحماض الكربوكسيلية وتحضيرها» (ص 93)\nالطالب: يحلون ويقارنون جهازي التقطير والإرجاع\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: سمِّ ‎CH₃CH₂COOH‎.\n   الإجابة النموذجية: حمض البروبانويك.\n2) (المستوى المتوقع) السؤال: لماذا يُستخدم التسخين مع الإرجاع لتحضير الحمض؟\n   الإجابة النموذجية: لإبقاء الألدهيد المتكون في خليط التفاعل فيتأكسد كليًا إلى حمض كربوكسيلي.\n3) (المستوى المتقدم) السؤال: اكتب معادلة أكسدة الإيثانول إلى حمض الإيثانويك باستخدام ‎[O]‎.\n   الإجابة النموذجية: ‎CH₃CH₂OH + 2[O] → CH₃COOH + H₂O‎","1) (مستوى الدعم) السؤال: ما المجموعة الوظيفية للأحماض الكربوكسيلية؟\n   الإجابة النموذجية: مجموعة الكربوكسيل –‎COOH‎.\n2) (المستوى المتوقع) السؤال: ما ناتج أكسدة البروبانال؟\n   الإجابة النموذجية: حمض البروبانويك.\n3) (المستوى المتقدم) السؤال: من الكحول الأولي نفسه، كيف تحصل مرة على ألدهيد ومرة على حمض؟\n   الإجابة النموذجية: بالتقطير الفوري للحصول على الألدهيد، وبالتسخين مع الإرجاع وزيادة المؤكسد للحصول على الحمض.","إرشاد للطالب: مراجعة ص 143 وإكمال نشاط 4-3 ص 93\nإرشاد لولي الأمر: الحديث مع الابن عن الخل بوصفه محلولًا مخففًا لحمض الإيثانويك"],"h":["<ol class=\"ol\"><li>يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية</li><li>يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: الجدول 4-4 في كتاب الطالب، كتاب التجارب العملية والأنشطة</span></div>","<p>مجموعة الكربوكسيل –‎COOH‎، حمض الميثانويك، حمض الإيثانويك، التسخين مع الإرجاع (الارتداد)، الأكسدة الكاملة.</p>","<p>يعرض المعلم زجاجة خل ويسأل: «الخل يحتوي حمض الإيثانويك الناتج من أكسدة الإيثانول بالبكتيريا؛ فكيف نحضره في المختبر؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الزجاجة ويطرح السؤال</td><td>يقترحون أكسدة الإيثانول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يعرّف السلسلة المتجانسة بالجدول 4-4 ويشرح التسمية والتحضير بالإرجاع</td><td>يسمون أحماضًا ويكتبون معادلة الأكسدة الكاملة باستخدام ‎2[O]‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 4-3 «الأحماض الكربوكسيلية وتحضيرها» (ص 93)</td><td>يحلون ويقارنون جهازي التقطير والإرجاع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سمِّ ‎CH₃CH₂COOH‎.</td><td>حمض البروبانويك.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُستخدم التسخين مع الإرجاع لتحضير الحمض؟</td><td>لإبقاء الألدهيد المتكون في خليط التفاعل فيتأكسد كليًا إلى حمض كربوكسيلي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب معادلة أكسدة الإيثانول إلى حمض الإيثانويك باستخدام ‎[O]‎.</td><td>‎CH₃CH₂OH + 2[O] → CH₃COOH + H₂O‎</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المجموعة الوظيفية للأحماض الكربوكسيلية؟</td><td>مجموعة الكربوكسيل –‎COOH‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ناتج أكسدة البروبانال؟</td><td>حمض البروبانويك.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>من الكحول الأولي نفسه، كيف تحصل مرة على ألدهيد ومرة على حمض؟</td><td>بالتقطير الفوري للحصول على الألدهيد، وبالتسخين مع الإرجاع وزيادة المؤكسد للحصول على الحمض.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 143 وإكمال نشاط 4-3 ص 93</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الخل بوصفه محلولًا مخففًا لحمض الإيثانويك</p>"]},{"axis":"تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للأحماض الكربوكسيلية"],["الحصة","2 من 2"],["محور الحصة","تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 143 + كتاب التجارب ص 94"],["دليل المعلم","ص 182–184"],["كتاب التجارب العملية والأنشطة","نشاط 4-3: الأحماض الكربوكسيلية وتحضيرها ص 93؛ نشاط 4-4: تفاعلات الأحماض الكربوكسيلية ص 94"]],"t":["1. يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها\n2. يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات)\nمخرج تعليمي آخر: يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: حمض الإيثانويك، كربونات الصوديوم، شريط مغنيسيوم، ماء الجير","الملح، إيثانوات الصوديوم، إيثانوات المغنيسيوم، التعادل، تصاعد ‎CO₂‎، تصاعد ‎H₂‎، الكشف عن –‎COOH‎.","يضع المعلم مسحوق كربونات الصوديوم في الخل فيحدث فوران، ثم في الإيثانول فلا يحدث شيء، ويسأل: «ما الغاز المتصاعد؟ ولماذا لم يتصاعد مع الإيثانول؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يتوقعون ‎CO₂‎ ويختبرونه بماء الجير\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «تفاعلات الأحماض الكربوكسيلية» ويكتب معادلات التفاعل مع ‎Mg‎ و‎NaOH‎ و‎Na₂CO₃‎\nالطالب: يكتبون المعادلات ويسمون الأملاح\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 4-4 «تفاعلات الأحماض الكربوكسيلية» (ص 94) والسؤال 6\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الأحماض الكربوكسيلية\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب معادلة تفاعل حمض الإيثانويك مع ‎NaOH‎.\n   الإجابة النموذجية: ‎CH₃COOH + NaOH → CH₃COONa + H₂O‎\n2) (المستوى المتوقع) السؤال: ما الغاز الناتج من تفاعل حمض الإيثانويك مع ‎Mg‎؟\n   الإجابة النموذجية: الهيدروجين.\n3) (المستوى المتقدم) السؤال: كيف تميز بين حمض الإيثانويك والإيثانول بكربونات الصوديوم؟\n   الإجابة النموذجية: الحمض يسبب فورانًا ‎(CO₂)‎ والكحول لا يتفاعل.","1) (مستوى الدعم) السؤال: سمِّ الملح الناتج من تفاعل حمض الإيثانويك مع المغنيسيوم.\n   الإجابة النموذجية: إيثانوات المغنيسيوم.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تفاعل حمض الإيثانويك مع كربونات الصوديوم.\n   الإجابة النموذجية: ‎2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂‎\n3) (المستوى المتقدم) السؤال: لماذا يتفاعل الحمض الكربوكسيلي مع الكربونات بينما لا يتفاعل الكحول؟\n   الإجابة النموذجية: لأن الحمض الكربوكسيلي أقوى حمضية بكثير ويمنح البروتون، أما الكحول فحمضيته ضعيفة جدًا.","إرشاد للطالب: إكمال نشاط 4-4 ص 94 والسؤال 6\nإرشاد لولي الأمر: يمكن تنفيذ تجربة الخل وبيكربونات الصوديوم في المنزل بإشراف ولي الأمر"],"h":["<ol class=\"ol\"><li>يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها</li><li>يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: حمض الإيثانويك، كربونات الصوديوم، شريط مغنيسيوم، ماء الجير</span></div>","<p>الملح، إيثانوات الصوديوم، إيثانوات المغنيسيوم، التعادل، تصاعد ‎CO₂‎، تصاعد ‎H₂‎، الكشف عن –‎COOH‎.</p>","<p>يضع المعلم مسحوق كربونات الصوديوم في الخل فيحدث فوران، ثم في الإيثانول فلا يحدث شيء، ويسأل: «ما الغاز المتصاعد؟ ولماذا لم يتصاعد مع الإيثانول؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>ينفذ العرض ويطرح السؤال</td><td>يتوقعون ‎CO₂‎ ويختبرونه بماء الجير</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «تفاعلات الأحماض الكربوكسيلية» ويكتب معادلات التفاعل مع ‎Mg‎ و‎NaOH‎ و‎Na₂CO₃‎</td><td>يكتبون المعادلات ويسمون الأملاح</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 4-4 «تفاعلات الأحماض الكربوكسيلية» (ص 94) والسؤال 6</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على الأحماض الكربوكسيلية</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة تفاعل حمض الإيثانويك مع ‎NaOH‎.</td><td>‎CH₃COOH + NaOH → CH₃COONa + H₂O‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الغاز الناتج من تفاعل حمض الإيثانويك مع ‎Mg‎؟</td><td>الهيدروجين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف تميز بين حمض الإيثانويك والإيثانول بكربونات الصوديوم؟</td><td>الحمض يسبب فورانًا ‎(CO₂)‎ والكحول لا يتفاعل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سمِّ الملح الناتج من تفاعل حمض الإيثانويك مع المغنيسيوم.</td><td>إيثانوات المغنيسيوم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تفاعل حمض الإيثانويك مع كربونات الصوديوم.</td><td>‎2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يتفاعل الحمض الكربوكسيلي مع الكربونات بينما لا يتفاعل الكحول؟</td><td>لأن الحمض الكربوكسيلي أقوى حمضية بكثير ويمنح البروتون، أما الكحول فحمضيته ضعيفة جدًا.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 4-4 ص 94 والسؤال 6</p><p><b>إرشاد لولي الأمر:</b> يمكن تنفيذ تجربة الخل وبيكربونات الصوديوم في المنزل بإشراف ولي الأمر</p>"]}]},{"title":"السلسلة المتجانسة للإسترات","sb":"ص 144–145","unit":"الوحدة 4: مشتقات الهيدروكربونات (1)","periods":[{"axis":"تسمية الإسترات وصيغها","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للإسترات"],["الحصة","1 من 5"],["محور الحصة","تسمية الإسترات وصيغها"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 144"],["دليل المعلم","ص 184–188"],["كتاب التجارب العملية والأنشطة","نشاط 4-5: الإسترات ص 95"]],"t":["1. يسمي الإسترات وفق النظام ألكيل ألكانوات ويكتب صيغها البنائية والهيكلية\n2. يحدد الحمض الكربوكسيلي والكحول اللذين اشتُق منهما إستر معين\nمخرج تعليمي آخر: يرسم الصيغة الهيكلية لإستر بمعلومية اسمه","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج جزيئية، عينات عطرية لإسترات (للشم الآمن بالتلويح)","الإستر، مجموعة الإستر –‎COO–‎، الجزء المشتق من الكحول (ألكيل)، الجزء المشتق من الحمض (ألكانوات)، إيثانوات الإيثيل، ميثانوات الميثيل.","يعرض المعلم عبوات عطور ونكهات فواكه صناعية ويسأل: «كثير من روائح الفواكه سببها مركبات تسمى الإسترات؛ من أين يأتي اسم إيثانوات الإيثيل؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض العبوات ويطرح السؤال\nالطالب: يقترحون أن الاسم يأتي من حمض وكحول\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح بنية الإستر ونظام التسمية (اسم ألكيل الكحول + اسم أنيون الحمض)\nالطالب: يسمون أمثلة ويحددون جزئي كل إستر\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم بطاقات أسماء وصيغ لمطابقتها في مجموعات\nالطالب: يطابقون ويرسمون الصيغ الهيكلية\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: سمِّ الإستر ‎CH₃COOCH₃‎.\n   الإجابة النموذجية: إيثانوات الميثيل.\n2) (المستوى المتوقع) السؤال: من أي حمض وكحول يُشتق بروبانوات الإيثيل؟\n   الإجابة النموذجية: حمض البروبانويك والإيثانول.\n3) (المستوى المتقدم) السؤال: اكتب الصيغة البنائية لميثانوات البروبيل.\n   الإجابة النموذجية: ‎HCOOCH₂CH₂CH₃‎","1) (مستوى الدعم) السؤال: ما المجموعة الوظيفية للإسترات؟\n   الإجابة النموذجية: –‎COO– (‎مجموعة الإستر).\n2) (المستوى المتوقع) السؤال: سمِّ ‎CH₃CH₂COOCH₃‎.\n   الإجابة النموذجية: بروبانوات الميثيل.\n3) (المستوى المتقدم) السؤال: إستر صيغته ‎CH₃COOCH₂CH₂CH₃‎؛ سمّه وحدد مصدري جزأيه.\n   الإجابة النموذجية: إيثانوات البروبيل؛ من حمض الإيثانويك والبروبان-1-ول.","إرشاد للطالب: مراجعة ص 144 وتسمية خمسة إسترات\nإرشاد لولي الأمر: الحديث مع الابن عن الإسترات في العطور والنكهات الغذائية"],"h":["<ol class=\"ol\"><li>يسمي الإسترات وفق النظام ألكيل ألكانوات ويكتب صيغها البنائية والهيكلية</li><li>يحدد الحمض الكربوكسيلي والكحول اللذين اشتُق منهما إستر معين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يرسم الصيغة الهيكلية لإستر بمعلومية اسمه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يسمي الإسترات وفق النظام ألكيل ألكانوات ويكتب صيغها البنائية والهيكلية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد الحمض الكربوكسيلي والكحول اللذين اشتُق منهما إستر معين</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يرسم الصيغة الهيكلية لإستر بمعلومية اسمه</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: نماذج جزيئية، عينات عطرية لإسترات (للشم الآمن بالتلويح)</span></div>","<p>الإستر، مجموعة الإستر –‎COO–‎، الجزء المشتق من الكحول (ألكيل)، الجزء المشتق من الحمض (ألكانوات)، إيثانوات الإيثيل، ميثانوات الميثيل.</p>","<p>يعرض المعلم عبوات عطور ونكهات فواكه صناعية ويسأل: «كثير من روائح الفواكه سببها مركبات تسمى الإسترات؛ من أين يأتي اسم إيثانوات الإيثيل؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض العبوات ويطرح السؤال</td><td>يقترحون أن الاسم يأتي من حمض وكحول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح بنية الإستر ونظام التسمية (اسم ألكيل الكحول + اسم أنيون الحمض)</td><td>يسمون أمثلة ويحددون جزئي كل إستر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم بطاقات أسماء وصيغ لمطابقتها في مجموعات</td><td>يطابقون ويرسمون الصيغ الهيكلية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سمِّ الإستر ‎CH₃COOCH₃‎.</td><td>إيثانوات الميثيل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>من أي حمض وكحول يُشتق بروبانوات الإيثيل؟</td><td>حمض البروبانويك والإيثانول.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب الصيغة البنائية لميثانوات البروبيل.</td><td>‎HCOOCH₂CH₂CH₃‎</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المجموعة الوظيفية للإسترات؟</td><td>–‎COO– (‎مجموعة الإستر).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>سمِّ ‎CH₃CH₂COOCH₃‎.</td><td>بروبانوات الميثيل.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إستر صيغته ‎CH₃COOCH₂CH₂CH₃‎؛ سمّه وحدد مصدري جزأيه.</td><td>إيثانوات البروبيل؛ من حمض الإيثانويك والبروبان-1-ول.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 144 وتسمية خمسة إسترات</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الإسترات في العطور والنكهات الغذائية</p>"]},{"axis":"تفاعل الأسترة وظروفه","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للإسترات"],["الحصة","2 من 5"],["محور الحصة","تفاعل الأسترة وظروفه"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 144–145"],["دليل المعلم","ص 184–188"],["كتاب التجارب العملية والأنشطة","نشاط 4-5: الإسترات ص 95"]],"t":["1. يصف تفاعل الأسترة بين حمض كربوكسيلي وكحول بوجود حمض الكبريتيك المركز حفازًا مع التسخين\n2. يكتب معادلات الأسترة الموزونة لتكوين إسترات مختلفة\nمخرج تعليمي آخر: يفسر أن الأسترة تفاعل اتزان ويقترح طرقًا لزيادة المردود","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: الشكل 4-2 في كتاب الطالب","الأسترة، التكثيف، حمض الكبريتيك المركز (حفاز)، التسخين، الاتزان، المردود، إزالة الماء.","يكتب المعلم: حمض + كحول ⇌ ؟ + ماء، ويسأل: «ما الناتج الآخر؟ ولماذا وضعنا سهمي الاتزان؟» (نشاط «مقدمة عن الإسترات والأسترة»).","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المعادلة الناقصة ويطرح السؤال\nالطالب: يتوقعون تكوّن الإستر\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الأسترة بمعادلتي الصيغ الهيكلية والموسعة (الشكل 4-2) والظروف\nالطالب: يكتبون معادلة تكوين إيثانوات الإيثيل\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم أزواجًا من الأحماض والكحولات لكتابة معادلاتها وتسمية الإستر\nالطالب: يكتبون المعادلات في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب معادلة تكوين إيثانوات الإيثيل.\n   الإجابة النموذجية: ‎CH₃COOH + CH₃CH₂OH ⇌ CH₃COOCH₂CH₃ + H₂O‎\n2) (المستوى المتوقع) السؤال: ما دور حمض الكبريتيك المركز في الأسترة؟\n   الإجابة النموذجية: حفاز (ويسحب الماء فيزيح الاتزان نحو الإستر).\n3) (المستوى المتقدم) السؤال: كيف يمكن زيادة مردود الإستر؟\n   الإجابة النموذجية: باستخدام زيادة من أحد المتفاعلين أو إزالة الماء أو الإستر من خليط التفاعل.","1) (مستوى الدعم) السؤال: ما الناتج الثانوي لتفاعل الأسترة؟\n   الإجابة النموذجية: الماء.\n2) (المستوى المتوقع) السؤال: سمِّ الإستر الناتج من حمض الميثانويك والبروبان-1-ول.\n   الإجابة النموذجية: ميثانوات البروبيل.\n3) (المستوى المتقدم) السؤال: لماذا لا يتحول كل الحمض والكحول إلى إستر حتى مع التسخين الطويل؟\n   الإجابة النموذجية: لأن الأسترة تفاعل عكسي يصل إلى حالة اتزان.","إرشاد للطالب: مراجعة ص 144–145 وكتابة معادلات أسترة لثلاثة أزواج\nإرشاد لولي الأمر: متابعة الابن في موازنة معادلات الأسترة وتسمية النواتج"],"h":["<ol class=\"ol\"><li>يصف تفاعل الأسترة بين حمض كربوكسيلي وكحول بوجود حمض الكبريتيك المركز حفازًا مع التسخين</li><li>يكتب معادلات الأسترة الموزونة لتكوين إسترات مختلفة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر أن الأسترة تفاعل اتزان ويقترح طرقًا لزيادة المردود</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تفاعل الأسترة بين حمض كربوكسيلي وكحول بوجود حمض الكبريتيك المركز حفازًا مع التسخين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب معادلات الأسترة الموزونة لتكوين إسترات مختلفة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر أن الأسترة تفاعل اتزان ويقترح طرقًا لزيادة المردود</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: الشكل 4-2 في كتاب الطالب</span></div> r><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يتحول كل الحمض والكحول إلى إستر حتى مع التسخين الطويل؟</td><td>لأن الأسترة تفاعل عكسي يصل إلى حالة اتزان.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 144–145 وكتابة معادلات أسترة لثلاثة أزواج</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في موازنة معادلات الأسترة وتسمية النواتج</p>"]},{"axis":"عرض توضيحي: تحضير إستر في المختبر","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للإسترات"],["الحصة","3 من 5"],["محور الحصة","عرض توضيحي: تحضير إستر في المختبر"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 145"],["دليل المعلم","ص 184–188"],["كتاب التجارب العملية والأنشطة","نشاط 4-5: الإسترات ص 95"]],"t":["1. يصف خطوات تحضير إستر في المختبر: الخلط، والتسخين مع الإرجاع، والتقطير، والغسل بكربونات الصوديوم\n2. يحدد احتياطات الأمان عند استخدام حمض الكبريتيك المركز والمواد العضوية القابلة للاشتعال\nمخرج تعليمي آخر: يفسر سبب غسل الإستر الناتج بمحلول كربونات الصوديوم","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني\n- العرض التوضيحي","- الكتاب\n- أخرى: حمض الإيثانويك، الإيثانول، حمض الكبريتيك المركز، أنبوب اختبار، حمام مائي، محلول كربونات الصوديوم","التحضير العملي، الحمام المائي، الرائحة المميزة، طبقة الإستر، الغسل بكربونات الصوديوم، احتياطات الأمان.","يسأل المعلم: «كيف نعرف أن الإستر تكوّن فعلًا دون أجهزة تحليل؟» ويطلب من الطلبة اقتراح دليلين.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون الرائحة وتكون طبقة منفصلة\n2) (18 دقيقة: من الدقيقة 5 إلى 23)\nالمعلم: ينفذ «العرض التوضيحي: تحضير الإسترات» مع شرح كل خطوة واحتياطاتها\nالطالب: يسجلون الخطوات والملاحظات ويصفون الرائحة بالتلويح الآمن\n3) (10 دقائق: من الدقيقة 23 إلى 33)\nالمعلم: يناقش سبب الغسل بكربونات الصوديوم وظهور طبقتين\nالطالب: يفسرون الملاحظات ويكتبون معادلة إزالة الحمض الزائد\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا يُستخدم حمام مائي لا لهب مباشر؟\n   الإجابة النموذجية: لأن الكحولات والإسترات قابلة للاشتعال.\n2) (المستوى المتوقع) السؤال: لماذا يُغسل الإستر بمحلول كربونات الصوديوم؟\n   الإجابة النموذجية: لإزالة بقايا الحمض الكربوكسيلي وحمض الكبريتيك بتحويلها إلى أملاح ذائبة.\n3) (المستوى المتقدم) السؤال: لماذا يطفو الإستر طبقة فوق المحلول المائي؟\n   الإجابة النموذجية: لأنه لا يمتزج بالماء وكثافته أقل منه.","1) (مستوى الدعم) السؤال: اذكر دليلين على تكون الإستر.\n   الإجابة النموذجية: رائحة فواكه مميزة، وظهور طبقة زيتية منفصلة.\n2) (المستوى المتوقع) السؤال: ما احتياط الأمان عند التعامل مع حمض الكبريتيك المركز؟\n   الإجابة النموذجية: ارتداء النظارات والقفازات وإضافته ببطء بقطرات قليلة.\n3) (المستوى المتقدم) السؤال: لماذا يُشم الإستر بالتلويح لا مباشرة؟\n   الإجابة النموذجية: لتجنب استنشاق كمية كبيرة من الأبخرة المهيجة.","إرشاد للطالب: كتابة خطوات العرض التوضيحي وملاحظاته في الدفتر\nإرشاد لولي الأمر: الحديث مع الابن عن قواعد السلامة في التعامل مع الأحماض المركزة"],"h":["<ol class=\"ol\"><li>يصف خطوات تحضير إستر في المختبر: الخلط، والتسخين مع الإرجاع، والتقطير، والغسل بكربونات الصوديوم</li><li>يحدد احتياطات الأمان عند استخدام حمض الكبريتيك المركز والمواد العضوية القابلة للاشتعال</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر سبب غسل الإستر الناتج بمحلول كربونات الصوديوم</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف خطوات تحضير إستر في المختبر: الخلط، والتسخين مع الإرجاع، والتقطير، والغسل بكربونات الصوديوم</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد احتياطات الأمان عند استخدام حمض الكبريتيك المركز والمواد العضوية القابلة للاشتعال</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر سبب غسل الإستر الناتج بمحلول كربونات الصوديوم</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"ch r><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر دليلين على تكون الإستر.</td><td>رائحة فواكه مميزة، وظهور طبقة زيتية منفصلة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما احتياط الأمان عند التعامل مع حمض الكبريتيك المركز؟</td><td>ارتداء النظارات والقفازات وإضافته ببطء بقطرات قليلة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُشم الإستر بالتلويح لا مباشرة؟</td><td>لتجنب استنشاق كمية كبيرة من الأبخرة المهيجة.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة خطوات العرض التوضيحي وملاحظاته في الدفتر</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن قواعد السلامة في التعامل مع الأحماض المركزة</p>"]},{"axis":"التحلل المائي للإسترات في الوسط الحمضي والقاعدي","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للإسترات"],["الحصة","4 من 5"],["محور الحصة","التحلل المائي للإسترات في الوسط الحمضي والقاعدي"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 145"],["دليل المعلم","ص 184–188"],["كتاب التجارب العملية والأنشطة","نشاط 4-5: الإسترات ص 95"]],"t":["1. يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما\n2. يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج\nمخرج تعليمي آخر: يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: الشكل في كتاب الطالب","التحلل المائي، الوسط الحمضي، الوسط القاعدي، ملح الحمض الكربوكسيلي، التفاعل العكسي، التفاعل الكامل، التصبن (للتوسع).","يسأل المعلم: «الأسترة تتطلب حذف الماء؛ فماذا تتوقع إذا سخّنا الإستر مع الماء بوجود حمض؟ ومع ‎NaOH‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يتوقعون عكس الأسترة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «التحلل المائي للإسترات» ويكتب معادلتي التحلل الحمضي والقاعدي لإيثانوات الميثيل\nالطالب: يكتبون المعادلتين ويسمون النواتج\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم إسترات لكتابة نواتج تحللها بالوسطين\nالطالب: يكتبون المعادلات في مجموعات ويقارنون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما نواتج التحلل الحمضي لإيثانوات الميثيل؟\n   الإجابة النموذجية: حمض الإيثانويك والميثانول.\n2) (المستوى المتوقع) السؤال: ما نواتج التحلل القاعدي لإيثانوات الميثيل مع ‎NaOH‎؟\n   الإجابة النموذجية: إيثانوات الصوديوم والميثانول.\n3) (المستوى المتقدم) السؤال: لماذا يكون التحلل القاعدي كاملًا لا عكسيًا؟\n   الإجابة النموذجية: لأن الحمض الناتج يتحول إلى أيون كربوكسيلات (ملح) لا يتفاعل مع الكحول لإعادة تكوين الإستر.","1) (مستوى الدعم) السؤال: اكتب معادلة التحلل القاعدي لإيثانوات الإيثيل.\n   الإجابة النموذجية: ‎CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃CH₂OH‎\n2) (المستوى المتوقع) السؤال: ما الفرق بين ناتجي الوسطين من جهة الحمض؟\n   الإجابة النموذجية: في الحمضي يتكون الحمض الكربوكسيلي نفسه، وفي القاعدي يتكون ملحه.\n3) (المستوى المتقدم) السؤال: كيف تحصل على الحمض الكربوكسيلي نفسه بعد التحلل القاعدي؟\n   الإجابة النموذجية: بإضافة حمض قوي مخفف (مثل ‎HCl‎) إلى الملح الناتج.","إرشاد للطالب: مراجعة ص 145 وكتابة معادلات تحلل ثلاثة إسترات بالوسطين\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين التحلل الحمضي والقاعدي"],"h":["<ol class=\"ol\"><li>يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما</li><li>يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: الشكل في كتاب الطالب</span></div>","<p>التحلل المائي، الوسط الحمضي، الوسط القاعدي، ملح الحمض الكربوكسيلي، التفاعل العكسي، التفاعل الكامل، التصبن (للتوسع).</p>","<p>يسأل المعلم: «الأسترة تتطلب حذف الماء؛ فماذا تتوقع إذا سخّنا الإستر مع الماء بوجود حمض؟ ومع ‎NaOH‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يتوقعون عكس الأسترة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «التحلل المائي للإسترات» ويكتب معادلتي التحلل الحمضي والقاعدي لإيثانوات الميثيل</td><td>يكتبون المعادلتين ويسمون النواتج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم إسترات لكتابة نواتج تحللها بالوسطين</td><td>يكتبون المعادلات في مجموعات ويقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نواتج التحلل الحمضي لإيثانوات الميثيل؟</td><td>حمض الإيثانويك والميثانول.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما نواتج التحلل القاعدي لإيثانوات الميثيل مع ‎NaOH‎؟</td><td>إيثانوات الصوديوم والميثانول.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون التحلل القاعدي كاملًا لا عكسيًا؟</td><td>لأن الحمض الناتج يتحول إلى أيون كربوكسيلات (ملح) لا يتفاعل مع الكحول لإعادة تكوين الإستر.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة التحلل القاعدي لإيثانوات الإيثيل.</td><td>‎CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃CH₂OH‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الفرق بين ناتجي الوسطين من جهة الحمض؟</td><td>في الحمضي يتكون الحمض الكربوكسيلي نفسه، وفي القاعدي يتكون ملحه.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف تحصل على الحمض الكربوكسيلي نفسه بعد التحلل القاعدي؟</td><td>بإضافة حمض قوي مخفف (مثل ‎HCl‎) إلى الملح الناتج.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 145 وكتابة معادلات تحلل ثلاثة إسترات بالوسطين</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين التحلل الحمضي والقاعدي</p>"]},{"axis":"نشاط 4-5 والسؤال 7 ومسائل الإسترات","n":5,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","السلسلة المتجانسة للإسترات"],["الحصة","5 من 5"],["محور الحصة","نشاط 4-5 والسؤال 7 ومسائل الإسترات"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 144–145 + كتاب التجارب ص 95"],["دليل المعلم","ص 184–188"],["كتاب التجارب العملية والأنشطة","نشاط 4-5: الإسترات ص 95"]],"t":["1. يحل نشاط 4-5 «الإسترات» والسؤال 7 في كتاب الطالب\n2. يربط بين تفاعلات تكوين الإسترات وتحللها في مخطط تحويلات\nمخرج تعليمي آخر: يصمم مخطط تحويل من كحول إلى إستر عبر حمض كربوكسيلي","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: إبداع","- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","مخطط التحويلات، كحول ← حمض ← إستر، التحلل، التسمية، ربط التفاعلات.","يكتب المعلم في وسط السبورة «إيثانوات الإيثيل» ويطلب من الطلبة كتابة كل المواد التي تُحضّره أو تنتج منه خلال دقيقتين.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يدير النشاط ويجمع الإجابات\nالطالب: يكتبون المواد ويربطونها بأسهم\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 4-5 (كتاب التجارب ص 95) والسؤال 7\nالطالب: يحلون فرديًا ثم يقارنون\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يكلف المجموعات بتصميم مخطط تحويل من الإيثانول فقط إلى إيثانوات الإيثيل\nالطالب: يصممون المخطط ويحددون الكواشف والظروف\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الإسترات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف تحضر إيثانوات الإيثيل باستخدام الإيثانول وحده مادة عضوية أولية؟\n   الإجابة النموذجية: تأكسد جزءًا منه إلى حمض الإيثانويك بالتسخين مع الإرجاع، ثم تجري الأسترة بين الحمض والجزء الآخر من الإيثانول.\n2) (المستوى المتوقع) السؤال: ما الكاشف اللازم لتحويل الإيثانول إلى حمض الإيثانويك؟\n   الإجابة النموذجية: ثنائي كرومات البوتاسيوم المحمضة مع التسخين والإرجاع.\n3) (المستوى المتقدم) السؤال: ما نواتج تحلل بروبانوات الميثيل بـ ‎NaOH‎؟\n   الإجابة النموذجية: بروبانوات الصوديوم والميثانول.","1) (مستوى الدعم) السؤال: سمِّ الإستر الناتج من حمض البيوتانويك والميثانول.\n   الإجابة النموذجية: بيوتانوات الميثيل.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تكوين ميثانوات الإيثيل.\n   الإجابة النموذجية: ‎HCOOH + CH₃CH₂OH ⇌ HCOOCH₂CH₃ + H₂O‎\n3) (المستوى المتقدم) السؤال: إستر صيغته ‎C₄H₈O₂‎ ينتج عند تحلله الحمضي حمض الإيثانويك. ما الإستر؟ وما الكحول الناتج؟\n   الإجابة النموذجية: إيثانوات الإيثيل، والكحول الإيثانول.","إرشاد للطالب: إكمال نشاط 4-5 ص 95 والسؤال 7 ومراجعة مخطط التحويلات\nإرشاد لولي الأمر: متابعة الابن في إكمال مخطط التحويلات بالكواشف والظروف"],"h":["<ol class=\"ol\"><li>يحل نشاط 4-5 «الإسترات» والسؤال 7 في كتاب الطالب</li><li>يربط بين تفاعلات تكوين الإسترات وتحللها في مخطط تحويلات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصمم مخطط تحويل من كحول إلى إستر عبر حمض كربوكسيلي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 4-5 «الإسترات» والسؤال 7 في كتاب الطالب</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يربط بين تفاعلات تكوين الإسترات وتحللها في مخطط تحويلات</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصمم مخطط تحويل من كحول إلى إستر عبر حمض كربوكسيلي</td><td class=\"lv\">إبداع</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>مخطط التحويلات، كحول ← حمض ← إستر، التحلل، التسمية، ربط التفاعلات.</p>","<p>يكتب المعلم في وسط السبورة «إيثانوات الإيثيل» ويطلب من الطلبة كتابة كل المواد التي تُحضّره أو تنتج منه خلال دقيقتين.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يدير النشاط ويجمع الإجابات</td><td>يكتبون المواد ويربطونها بأسهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 4-5 (كتاب التجارب ص 95) والسؤال 7</td><td>يحلون فرديًا ثم يقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يكلف المجموعات بتصميم مخطط تحويل من الإيثانول فقط إلى إيثانوات الإيثيل</td><td>يصممون المخطط ويحددون الكواشف والظروف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على الإسترات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تحضر إيثانوات الإيثيل باستخدام الإيثانول وحده مادة عضوية أولية؟</td><td>تأكسد جزءًا منه إلى حمض الإيثانويك بالتسخين مع الإرجاع، ثم تجري الأسترة بين الحمض والجزء الآخر من الإيثانول.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الكاشف اللازم لتحويل الإيثانول إلى حمض الإيثانويك؟</td><td>ثنائي كرومات البوتاسيوم المحمضة مع التسخين والإرجاع.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما نواتج تحلل بروبانوات الميثيل بـ ‎NaOH‎؟</td><td>بروبانوات الصوديوم والميثانول.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سمِّ الإستر الناتج من حمض البيوتانويك والميثانول.</td><td>بيوتانوات الميثيل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تكوين ميثانوات الإيثيل.</td><td>‎HCOOH + CH₃CH₂OH ⇌ HCOOCH₂CH₃ + H₂O‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إستر صيغته ‎C₄H₈O₂‎ ينتج عند تحلله الحمضي حمض الإيثانويك. ما الإستر؟ وما الكحول الناتج؟</td><td>إيثانوات الإيثيل، والكحول الإيثانول.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 4-5 ص 95 والسؤال 7 ومراجعة مخطط التحويلات</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في إكمال مخطط التحويلات بالكواشف والظروف</p>"]}]},{"title":"تفاعلات الكحولات","sb":"ص 146–153","unit":"الوحدة 4: مشتقات الهيدروكربونات (1)","periods":[{"axis":"احتراق الكحولات وتفاعلها مع فلز الصوديوم","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","تفاعلات الكحولات"],["الحصة","1 من 3"],["محور الحصة","احتراق الكحولات وتفاعلها مع فلز الصوديوم"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 146–147"],["دليل المعلم","ص 188–195"],["كتاب التجارب العملية والأنشطة","نشاط 4-6: بعض تفاعلات الكحولات ص 96"]],"t":["1. يكتب معادلات الاحتراق الكامل للكحولات\n2. يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين\nمخرج تعليمي آخر: يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: مقطع مرئي لتفاعل الصوديوم مع الإيثانول","الاحتراق الكامل، ‎CO₂‎ والماء، ألكوكسيد الصوديوم (إيثوكسيد الصوديوم)، تصاعد ‎H₂‎، الإيثانول وقودًا.","يعرض المعلم مقطعًا لقطعة صوديوم في الماء ثم في الإيثانول ويسأل: «لماذا كان التفاعل مع الإيثانول أهدأ بكثير؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المقطعين ويطرح السؤال\nالطالب: يلاحظون الفرق ويقترحون تفسيرًا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الاحتراق وموازنة معادلاته ثم «التفاعل مع فلز الصوديوم»\nالطالب: يكتبون معادلات الاحتراق والتفاعل مع ‎Na‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم كحولات مختلفة لموازنة معادلات احتراقها وتسمية ألكوكسيداتها\nالطالب: يوازنون ويسمون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب معادلة الاحتراق الكامل للإيثانول.\n   الإجابة النموذجية: ‎C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O‎\n2) (المستوى المتوقع) السؤال: اكتب معادلة تفاعل الإيثانول مع الصوديوم.\n   الإجابة النموذجية: ‎2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂‎\n3) (المستوى المتقدم) السؤال: لماذا التفاعل مع الإيثانول أهدأ منه مع الماء؟\n   الإجابة النموذجية: لأن الرابطة ‎O–H‎ في الإيثانول أقل قطبية (مجموعة الإيثيل تدفع الإلكترونات) فيكون تحرر ‎H⁺‎ أصعب.","1) (مستوى الدعم) السؤال: ما الغاز الناتج من تفاعل الكحول مع الصوديوم؟\n   الإجابة النموذجية: الهيدروجين.\n2) (المستوى المتوقع) السؤال: سمِّ الناتج العضوي لتفاعل الميثانول مع الصوديوم.\n   الإجابة النموذجية: ميثوكسيد الصوديوم.\n3) (المستوى المتقدم) السؤال: وازن معادلة الاحتراق الكامل للبروبان-1-ول.\n   الإجابة النموذجية: ‎2C₃H₇OH + 9O₂ → 6CO₂ + 8H₂O‎","إرشاد للطالب: مراجعة ص 146–147 وموازنة معادلات احتراق ثلاثة كحولات\nإرشاد لولي الأمر: الحديث مع الابن عن الإيثانول بوصفه وقودًا حيويًا"],"h":["<ol class=\"ol\"><li>يكتب معادلات الاحتراق الكامل للكحولات</li><li>يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يكتب معادلات الاحتراق الكامل للكحولات</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span><span class=\"chip r\">أخرى: مقطع مرئي لتفاعل الصوديوم مع الإيثانول</span></div>","<p>الاحتراق الكامل، ‎CO₂‎ والماء، ألكوكسيد الصوديوم (إيثوكسيد الصوديوم)، تصاعد ‎H₂‎، الإيثانول وقودًا.</p>","<p>يعرض المعلم مقطعًا لقطعة صوديوم في الماء ثم في الإيثانول ويسأل: «لماذا كان التفاعل مع الإيثانول أهدأ بكثير؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض المقطعين ويطرح السؤال</td><td>يلاحظون الفرق ويقترحون تفسيرًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الاحتراق وموازنة معادلاته ثم «التفاعل مع فلز الصوديوم»</td><td>يكتبون معادلات الاحتراق والتفاعل مع ‎Na‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم كحولات مختلفة لموازنة معادلات احتراقها وتسمية ألكوكسيداتها</td><td>يوازنون ويسمون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة الاحتراق الكامل للإيثانول.</td><td>‎C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تفاعل الإيثانول مع الصوديوم.</td><td>‎2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا التفاعل مع الإيثانول أهدأ منه مع الماء؟</td><td>لأن الرابطة ‎O–H‎ في الإيثانول أقل قطبية (مجموعة الإيثيل تدفع الإلكترونات) فيكون تحرر ‎H⁺‎ أصعب.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الغاز الناتج من تفاعل الكحول مع الصوديوم؟</td><td>الهيدروجين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>سمِّ الناتج العضوي لتفاعل الميثانول مع الصوديوم.</td><td>ميثوكسيد الصوديوم.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>وازن معادلة الاحتراق الكامل للبروبان-1-ول.</td><td>‎2C₃H₇OH + 9O₂ → 6CO₂ + 8H₂O‎</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 146–147 وموازنة معادلات احتراق ثلاثة كحولات</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الإيثانول بوصفه وقودًا حيويًا</p>"]},{"axis":"الاستبدال بالهاليدات ونزع الماء من الكحولات","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","تفاعلات الكحولات"],["الحصة","2 من 3"],["محور الحصة","الاستبدال بالهاليدات ونزع الماء من الكحولات"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 147–149"],["دليل المعلم","ص 188–195"],["كتاب التجارب العملية والأنشطة","نشاط 4-6: بعض تفاعلات الكحولات ص 96"]],"t":["1. يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي)\n2. يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز\nمخرج تعليمي آخر: يتنبأ بنواتج نزع الماء من كحولات مختلفة","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- المراجعة النشطة","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة","الاستبدال النيوكليوفيلي، الهالوجينوألكان، ‎HCl‎ المحضر في وعاء التفاعل ‎(NaCl + H₂SO₄)‎، كلوريد الفوسفور ‎(III)‎، نزع الماء، الألكين، ‎Al₂O₃‎.","يسأل المعلم: «نريد تحويل الإيثانول إلى كلوروإيثان مرة، وإلى إيثين مرة أخرى؛ ما الذي يجب أن يُنزع أو يُستبدل في كل حالة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون استبدال ‎OH‎ بـ ‎Cl‎، ونزع ‎H₂O‎\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح «التفاعل مع الهاليدات» وتحضير ‎HCl‎ في الوعاء واستخدام ‎PCl₃‎، ثم نزع الماء\nالطالب: يكتبون معادلات التفاعلين\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: ينفذ مراجعة نشطة بمسائل تنبؤ بنواتج كحولات مختلفة\nالطالب: يتنبؤون بالنواتج ويكتبون المعادلات في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب معادلة تفاعل الإيثانول مع ‎HCl‎.\n   الإجابة النموذجية: ‎CH₃CH₂OH + HCl → CH₃CH₂Cl + H₂O‎\n2) (المستوى المتوقع) السؤال: كيف يُحضّر ‎HCl‎ داخل وعاء التفاعل؟\n   الإجابة النموذجية: بتفاعل كلوريد الصوديوم مع حمض الكبريتيك المركز.\n3) (المستوى المتقدم) السؤال: ما ناتج نزع الماء من بروبان-1-ول؟\n   الإجابة النموذجية: البروبين.","1) (مستوى الدعم) السؤال: ما نوع تفاعل الكحول مع ‎HX‎؟\n   الإجابة النموذجية: استبدال نيوكليوفيلي.\n2) (المستوى المتوقع) السؤال: ما الحفاز المستخدم في نزع الماء من الإيثانول؟\n   الإجابة النموذجية: أكسيد الألومنيوم ‎Al₂O₃‎ الساخن (أو حمض مركز).\n3) (المستوى المتقدم) السؤال: اكتب معادلة نزع الماء من الإيثانول وسمِّ الناتج.\n   الإجابة النموذجية: ‎CH₃CH₂OH → CH₂=CH₂ + H₂O‎، الإيثين.","إرشاد للطالب: مراجعة ص 147–149 وكتابة معادلات الاستبدال ونزع الماء\nإرشاد لولي الأمر: متابعة الابن في التمييز بين تفاعلي الاستبدال والحذف"],"h":["<ol class=\"ol\"><li>يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي)</li><li>يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بنواتج نزع الماء من كحولات مختلفة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بنواتج نزع الماء من كحولات مختلفة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">المراجعة النشطة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الاستبدال النيوكليوفيلي، الهالوجينوألكان، ‎HCl‎ المحضر في وعاء التفاعل ‎(NaCl + H₂SO₄)‎، كلوريد الفوسفور ‎(III)‎، نزع الماء، الألكين، ‎Al₂O₃‎.</p>","<p>يسأل المعلم: «نريد تحويل الإيثانول إلى كلوروإيثان مرة، وإلى إيثين مرة أخرى؛ ما الذي يجب أن يُنزع أو يُستبدل في كل حالة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون استبدال ‎OH‎ بـ ‎Cl‎، ونزع ‎H₂O‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح «التفاعل مع الهاليدات» وتحضير ‎HCl‎ في الوعاء واستخدام ‎PCl₃‎، ثم نزع الماء</td><td>يكتبون معادلات التفاعلين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>ينفذ مراجعة نشطة بمسائل تنبؤ بنواتج كحولات مختلفة</td><td>يتنبؤون بالنواتج ويكتبون المعادلات في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة تفاعل الإيثانول مع ‎HCl‎.</td><td>‎CH₃CH₂OH + HCl → CH₃CH₂Cl + H₂O‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يُحضّر ‎HCl‎ داخل وعاء التفاعل؟</td><td>بتفاعل كلوريد الصوديوم مع حمض الكبريتيك المركز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما ناتج نزع الماء من بروبان-1-ول؟</td><td>البروبين.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نوع تفاعل الكحول مع ‎HX‎؟</td><td>استبدال نيوكليوفيلي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الحفاز المستخدم في نزع الماء من الإيثانول؟</td><td>أكسيد الألومنيوم ‎Al₂O₃‎ الساخن (أو حمض مركز).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب معادلة نزع الماء من الإيثانول وسمِّ الناتج.</td><td>‎CH₃CH₂OH → CH₂=CH₂ + H₂O‎، الإيثين.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 147–149 وكتابة معادلات الاستبدال ونزع الماء</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين تفاعلي الاستبدال والحذف</p>"]},{"axis":"أكسدة الكحولات بثنائي كرومات البوتاسيوم والتمييز بينها","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","تفاعلات الكحولات"],["الحصة","3 من 3"],["محور الحصة","أكسدة الكحولات بثنائي كرومات البوتاسيوم والتمييز بينها"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 150–153 + كتاب التجارب ص 96"],["دليل المعلم","ص 188–195"],["كتاب التجارب العملية والأنشطة","نشاط 4-6: بعض تفاعلات الكحولات ص 96"]],"t":["1. يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض\n2. يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية\nمخرج تعليمي آخر: ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- أخرى: إيثانول، بروبان-2-ول، 2-ميثيل بروبان-2-ول، محلول ثنائي كرومات البوتاسيوم المحمض، حمام مائي، أنابيب اختبار","أكسدة الكحولات، الكحول الأولي ← ألدهيد ← حمض، الكحول الثانوي ← كيتون، الكحول الثالثي لا يتأكسد، البرتقالي إلى الأخضر.","يعرض المعلم ثلاثة أنابيب لكحولات مجهولة ويسأل: «بكاشف واحد فقط، هل يمكن أن تعرف أيها الكحول الثالثي؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح التحدي\nالطالب: يقترحون ثنائي الكرومات\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يشرح «أكسدة الإيثانول» ونواتج أكسدة الأنواع الثلاثة\nالطالب: يكتبون النواتج المتوقعة لكل نوع\n3) (17 دقيقة: من الدقيقة 15 إلى 32)\nالمعلم: ينفذ الاستقصاء العملي «تمييز الكحولات الثالثية من الأولية والثانوية» ويوجه حل نشاط 4-6 (ص 96)\nالطالب: يسخنون الأنابيب في حمام مائي ويسجلون الألوان ويحلون النشاط\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على تفاعلات الكحولات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما نتيجة تسخين كحول ثالثي مع ثنائي الكرومات المحمضة؟\n   الإجابة النموذجية: يبقى اللون برتقاليًا (لا أكسدة).\n2) (المستوى المتوقع) السؤال: لماذا لا يتأكسد الكحول الثالثي؟\n   الإجابة النموذجية: لأن ذرة الكربون الحاملة لـ ‎OH‎ لا ترتبط بذرة هيدروجين.\n3) (المستوى المتقدم) السؤال: هل يميز ثنائي الكرومات بين الكحول الأولي والثانوي وحده؟\n   الإجابة النموذجية: لا، كلاهما يحول اللون إلى الأخضر؛ نحتاج اختبار الناتج (فهلينج أو تولن).","1) (مستوى الدعم) السؤال: ما ناتج أكسدة بيوتان-2-ول؟\n   الإجابة النموذجية: بيوتانون.\n2) (المستوى المتوقع) السؤال: صف تغير اللون عند أكسدة الكحول الأولي.\n   الإجابة النموذجية: يتحول من البرتقالي إلى الأخضر.\n3) (المستوى المتقدم) السؤال: كيف تميز بين ناتجي أكسدة الكحول الأولي (بالتقطير) والثانوي؟\n   الإجابة النموذجية: باختبار فهلينج أو تولن: ناتج الأولي (ألدهيد) يعطي نتيجة موجبة، وناتج الثانوي (كيتون) لا يعطي.","إرشاد للطالب: كتابة تقرير الاستقصاء وإكمال نشاط 4-6 ص 96 والأسئلة 8–15\nإرشاد لولي الأمر: التأكد من فهم الابن لسبب عدم أكسدة الكحول الثالثي"],"h":["<ol class=\"ol\"><li>يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض</li><li>يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">أخرى: إيثانول، بروبان-2-ول، 2-ميثيل بروبان-2-ول، محلول ثنائي كرومات البوتاسيوم المحمض، حمام مائي، أنابيب اختبار</span></div>","<p>أكسدة الكحولات، الكحول الأولي ← ألدهيد ← حمض، الكحول الثانوي ← كيتون، الكحول الثالثي لا يتأكسد، البرتقالي إلى الأخضر.</p>","<p>يعرض المعلم ثلاثة أنابيب لكحولات مجهولة ويسأل: «بكاشف واحد فقط، هل يمكن أن تعرف أيها الكحول الثالثي؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح التحدي</td><td>يقترحون ثنائي الكرومات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يشرح «أكسدة الإيثانول» ونواتج أكسدة الأنواع الثلاثة< ق تحضير الكحولات","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","تفاعلات تحضير الكحولات"],["الحصة","1 من 2"],["محور الحصة","طرائق تحضير الكحولات"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 154–156"],["دليل المعلم","ص 195–201"],["كتاب التجارب العملية والأنشطة","نشاط 4-7: تحضير الكحولات ص 98؛ الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ص 100"]],"t":["1. يذكر تفاعلات تحضير الكحولات (المواد المتفاعلة وظروف التفاعل): الإضافة الإلكتروفيلية للبخار، والاستبدال النيوكليوفيلي، والأكسدة، والتحلل المائي للإسترات، والاختزال\n2. يكتب معادلات تحضير الكحولات بالطرائق المختلفة\nمخرج تعليمي آخر: يختار طريقة مناسبة لتحضير كحول محدد من مادة أولية معطاة","المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- الخريطة الذهنية","- الكتاب\n- السبورة الذكية\n- أخرى: كتاب التجارب العملية والأنشطة","الإضافة الإلكتروفيلية (بخار الماء + ألكين ‎+ H₃PO₄‎)، الاستبدال النيوكليوفيلي (هالوجينوألكان ‎+ NaOH‎ مخفف)، الأكسدة بـ ‎KMnO₄‎ البارد (دايول)، التحلل المائي للإستر، الاختزال (‎NaBH₄‎، ‎LiAlH₄‎).","يكتب المعلم الإيثانول في الوسط ويسأل: «من كم مادة مختلفة درسناها يمكن الوصول إلى الإيثانول؟» ويرسم الأسهم مع الطلبة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويبدأ الخريطة\nالطالب: يقترحون مواد أولية\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: ينفذ «مراجعة تكوين الكحولات من وحدات أخرى وبعض الطرائق الجديدة» ويشرح الطرائق الخمس بمعادلاتها\nالطالب: يكتبون المعادلات ويكملون الخريطة الذهنية\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: ينفذ «اختزال الألدهيدات والكيتونات» ويوجه حل نشاط 4-7 (ص 98)\nالطالب: يحلون النشاط ويحددون الكاشف والظروف لكل طريقة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما ظروف تحضير الإيثانول من الإيثين؟\n   الإجابة النموذجية: تفاعل الإيثين مع بخار الماء بوجود حمض الفوسفوريك المركز حفازًا.\n2) (المستوى المتوقع) السؤال: ما ناتج تسخين بروموإيثان مع محلول ‎NaOH‎ المخفف؟\n   الإجابة النموذجية: الإيثانول وبروميد الصوديوم.\n3) (المستوى المتقدم) السؤال: ما الكاشف الذي يختزل الأحماض الكربوكسيلية إلى كحولات؟\n   الإجابة النموذجية: ‎LiAlH₄‎.","1) (مستوى الدعم) السؤال: اكتب معادلة تحضير الإيثانول من الإيثين.\n   الإجابة النموذجية: ‎C₂H₄(g) + H₂O(g) → CH₃CH₂OH(l)‎ بوجود ‎H₃PO₄‎\n2) (المستوى المتوقع) السؤال: ما ناتج تفاعل الإيثين مع محلول ‎KMnO₄‎ البارد المخفف المحمض؟\n   الإجابة النموذجية: إيثان-1،2-دايول (كحول ثنائي الهيدروكسيل).\n3) (المستوى المتقدم) السؤال: اقترح طريقة لتحضير بروبان-2-ول من البروبانون.\n   الإجابة النموذجية: الاختزال بـ ‎NaBH₄‎.","إرشاد للطالب: مراجعة ص 154–156 وإكمال الخريطة الذهنية ونشاط 4-7 ص 98 والسؤالين 16 و17\nإرشاد لولي الأمر: متابعة الابن في تذكر الكاشف والظروف لكل طريقة"],"h":["<ol class=\"ol\"><li>يذكر تفاعلات تحضير الكحولات (المواد المتفاعلة وظروف التفاعل): الإضافة الإلكتروفيلية للبخار، والاستبدال النيوكليوفيلي، والأكسدة، والتحلل المائي للإسترات، والاختزال</li><li>يكتب معادلات تحضير الكحولات بالطرائق المختلفة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يختار طريقة مناسبة لتحضير كحول محدد من مادة أولية معطاة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر تفاعلات تحضير الكحولات (المواد المتفاعلة وظروف التفاعل): الإضافة الإلكتروفيلية للبخار، والاستبدال النيوكليوفيلي، والأكسدة، والتحلل المائي للإسترات، والاختزال</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب معادلات تحضير الكحولات بالطرائق المختلفة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يختار طريقة مناسبة لتحضير كحول محدد من مادة أولية معطاة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">الخريطة الذهنية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الإضافة الإلكتروفيلية (بخار الماء + ألكين ‎+ H₃PO₄‎)، الاستبدال النيوكليوفيلي (هالوجينوألكان ‎+ NaOH‎ مخفف)، الأكسدة بـ ‎KMnO₄‎ البارد (دايول)، التحلل المائي للإستر، الاختزال (‎NaBH₄‎، ‎LiAlH₄‎).</p>","<p>يكتب المعلم الإيثانول في الوسط ويسأل: «من كم مادة مختلفة درسناها يمكن الوصول إلى الإيثانول؟» ويرسم الأسهم مع الطلبة.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويبدأ الخريطة</td><td>يقترحون مواد أولية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>ينفذ «مراجعة تكوين الكحولات من وحدات أخرى وبعض الطرائق الجديدة» ويشرح الطرائق الخمس بمعادلاتها</td><td>يكتبون المعادلات ويكملون الخريطة الذهنية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>ينفذ «اختزال الألدهيدات والكيتونات» ويوجه حل نشاط 4-7 (ص 98)</td><td>يحلون النشاط ويحددون الكاشف والظروف لكل طريقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ظروف تحضير الإيثانول من الإيثين؟</td><td>تفاعل الإيثين مع بخار الماء بوجود حمض الفوسفوريك المركز حفازًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ناتج تسخين بروموإيثان مع محلول ‎NaOH‎ المخفف؟</td><td>الإيثانول وبروميد الصوديوم.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الكاشف الذي يختزل الأحماض الكربوكسيلية إلى كحولات؟</td><td>‎LiAlH₄‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة تحضير الإيثانول من الإيثين.</td><td>‎C₂H₄(g) + H₂O(g) → CH₃CH₂OH(l)‎ بوجود ‎H₃PO₄‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ناتج تفاعل الإيثين مع محلول ‎KMnO₄‎ البارد المخفف المحمض؟</td><td>إيثان-1،2-دايول (كحول ثنائي الهيدروكسيل).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح طريقة لتحضير بروبان-2-ول من البروبانون.</td><td>الاختزال بـ ‎NaBH₄‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 154–156 وإكمال الخريطة الذهنية ونشاط 4-7 ص 98 والسؤالين 16 و17</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في تذكر الكاشف والظروف لكل طريقة</p>"]},{"axis":"الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ومراجعة الوحدة","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: مشتقات الهيدروكربونات (1)"],["الدرس","تفاعلات تحضير الكحولات"],["الحصة","2 من 2"],["محور الحصة","الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ومراجعة الوحدة"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 157–160 + كتاب التجارب ص 100"],["دليل المعلم","ص 195–201"],["كتاب التجارب العملية والأنشطة","نشاط 4-7: تحضير الكحولات ص 98؛ الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ص 100"]],"t":["1. يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة\n2. يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات\n- الاستقصاء العملي","- الكتاب\n- أخرى: أربع عينات مجهولة (كحول أولي، كحول ثالثي، ألدهيد، حمض كربوكسيلي)، الكواشف المناسبة، حمام مائي","تحديد الهوية، مخطط الاختبارات، الاختبار المميز، النتيجة الموجبة والسالبة، الاستنتاج المبرر.","يعرض المعلم أربعة أنابيب مرقمة ويقول: «في كل أنبوب مركب مما درسناه في الوحدة؛ مهمتكم اليوم أن تكونوا محققين كيميائيين.»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يعرض المهمة وقواعد السلامة\nالطالب: يخططون ترتيب الاختبارات في مخطط\n2) (22 دقيقة: من الدقيقة 4 إلى 26)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 4-1 (كتاب التجارب ص 100)\nالطالب: يجرون الاختبارات ويسجلون الملاحظات ويستنتجون الهوية\n3) (8 دقائق: من الدقيقة 26 إلى 34)\nالمعلم: يناقش النتائج ومبررات الاستنتاج\nالطالب: يعرضون استنتاجاتهم ويقارنونها\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الرابعة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الاختبار الذي يميز الحمض الكربوكسيلي من بين العينات؟\n   الإجابة النموذجية: إضافة كربونات الصوديوم وملاحظة الفوران.\n2) (المستوى المتوقع) السؤال: كيف تميز الألدهيد عن الكحول الأولي؟\n   الإجابة النموذجية: بكاشف فهلينج أو تولن (الألدهيد يعطي نتيجة موجبة).\n3) (المستوى المتقدم) السؤال: ما العينة التي تبقي ثنائي الكرومات برتقاليًا؟\n   الإجابة النموذجية: الكحول الثالثي.","1) (مستوى الدعم) السؤال: رتب الاختبارات ترتيبًا منطقيًا لتحديد هوية العينات الأربع.\n   الإجابة النموذجية: كربونات الصوديوم أولًا (الحمض)، ثم فهلينج أو تولن (الألدهيد)، ثم ثنائي الكرومات (يميز الأولي من الثالثي).\n2) (المستوى المتوقع) السؤال: لماذا يجب استخدام كمية صغيرة من العينة في كل اختبار؟\n   الإجابة النموذجية: للحفاظ على عينة كافية لبقية الاختبارات ولأسباب السلامة.\n3) (المستوى المتقدم) السؤال: عينة لم تتفاعل مع الكربونات، وأعطت لونًا أخضر مع ثنائي الكرومات، ولم تتفاعل مع فهلينج، وأعطت راسبًا أصفر مع اليود القلوي. ما هي على الأرجح؟\n   الإجابة النموذجية: كحول ثانوي يحتوي ‎CH₃CH(OH)–‎، مثل بروبان-2-ول.","إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 ومراجعة ملخص الوحدة ص 157 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات"],"h":["<ol class=\"ol\"><li>يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة</li><li>يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">أخرى: أربع عينات مجهولة (كحول أولي، كحول ثالثي، ألدهيد، حمض كربوكسيلي)، الكواشف المناسبة، حمام مائي</span></div>","<p>تحديد الهوية، مخطط الاختبارات، الاختبار المميز، النتيجة الموجبة والسالبة، الاستنتاج المبرر.</p>","<p>يعرض المعلم أربعة أنابيب مرقمة ويقول: «في كل أنبوب مركب مما درسناه في الوحدة؛ مهمتكم اليوم أن تكونوا محققين كيميائيين.»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يعرض المهمة وقواعد السلامة</td><td>يخططون ترتيب الاختبارات في مخطط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–26</span><br><small>22 دقيقة</small></td><td>يوجه تنفيذ الاستقصاء العملي 4-1 (كتاب التجارب ص 100)</td><td>يجرون الاختبارات ويسجلون الملاحظات ويستنتجون الهوية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">26–34</span><br><small>8 دقائق</small></td><td>يناقش النتائج ومبررات الاستنتاج</td><td>يعرضون استنتاجاتهم ويقارنونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">34–40</span><br><small>6 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة الرابعة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الاختبار الذي يميز الحمض الكربوكسيلي من بين العينات؟</td><td>إضافة كربونات الصوديوم وملاحظة الفوران.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف تميز الألدهيد عن الكحول الأولي؟</td><td>بكاشف فهلينج أو تولن (الألدهيد يعطي نتيجة موجبة).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما العينة التي تبقي ثنائي الكرومات برتقاليًا؟</td><td>الكحول الثالثي.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>رتب الاختبارات ترتيبًا منطقيًا لتحديد هوية العينات الأربع.</td><td>كربونات الصوديوم أولًا (الحمض)، ثم فهلينج أو تولن (الألدهيد)، ثم ثنائي الكرومات (يميز الأولي من الثالثي).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يجب استخدام كمية صغيرة من العينة في كل اختبار؟</td><td>للحفاظ على عينة كافية لبقية الاختبارات ولأسباب السلامة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>عينة لم تتفاعل مع الكربونات، وأعطت لونًا أخضر مع ثنائي الكرومات، ولم تتفاعل مع فهلينج، وأعطت راسبًا أصفر مع اليود القلوي. ما هي على الأرجح؟</td><td>كحول ثانوي يحتوي ‎CH₃CH(OH)–‎، مثل بروبان-2-ول.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 4-1 ومراجعة ملخص الوحدة ص 157 وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات</p>"]}]}];

function render(){
 const L=D[st.l];if(st.p>=L.periods.length)st.p=0;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));
 $('status').textContent=st.m==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة ${st.p+1} من ${L.periods.length}`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم ${L.periods.length} حصص`;

 const tabs=$('tabs');
 if(st.m==='sep'){tabs.style.display='flex';tabs.innerHTML=L.periods.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}">الحصة ${p.n}: ${esc(p.axis)}</button>`).join('')}
 else tabs.style.display='none';
 let rows='';
 if(st.m==='sep'){const hi=L.periods[st.p].hi;rows=hi.map((r,k)=>`<div class="${k===4?'w':''}"><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')}
 else{const h0=L.periods[0].hi;rows=[h0[0],h0[1],h0[2]].map(r=>`<div><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')+
  `<div><b>كتاب الطالب:</b>${esc(L.sb)}</div><div><b>${h0[7][0]}:</b>${esc(h0[7][1])}</div><div><b>${h0[8][0]}:</b>${esc(h0[8][1])}</div>`+
  `<div class="w"><b>الحصص:</b><br>${L.periods.map(p=>`الحصة ${p.n}: ${esc(p.axis)} — ${esc(p.hi[5][1])}`).join('<br>')}</div>`}
 $('info').innerHTML=rows;
 $('cards').innerHTML=FIELDS.map((f,i)=>`<div class="card"><div class="ch"><div class="ct"><span class="num">${i+1}</span>${f}</div><button class="copy" data-f="${i}">نسخ</button></div><div class="cb" id="cb${i}">${fieldHtml(i)}</div></div>`).join('');
 save();
}
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#mode button');if(m){st.m=m.dataset.m;render();return}
 const tb=e.target.closest('#tabs button');if(tb){st.p=+tb.dataset.i;render();return}
 const c=e.target.closest('.copy');if(c){const i=+c.dataset.f,t=fieldText(i);let ok=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);ok=true}catch(err){}}
  if(!ok)ok=legacyCopy(t);
  if(ok)done(c);else fallback(i,t);}
});
$('les').addEventListener('change',e=>{st.l=+e.target.value;st.p=0;render()});
buildSelect();render();
</script>
</body>
