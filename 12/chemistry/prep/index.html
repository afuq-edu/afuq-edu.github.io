e=\"opacity:.85\">• الإجابة النموذجية: لأن ‎HCl‎ يتأين كليًا فيكون ‎[H⁺]‎ أعلى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الفرق بين حمض مركز وحمض قوي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التركيز كمية الحمض في حجم معين، والقوة مدى تأينه؛ فقد يكون الحمض ضعيفًا ومركزًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة تأين حمض الإيثانويك في الماء.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COOH(aq) ⇌ CH₃COO⁻(aq) + H⁺(aq)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر مثالًا لقاعدة قوية وآخر لقاعدة ضعيفة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: قاعدة قوية: ‎NaOH‎؛ قاعدة ضعيفة: ‎NH₃‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تجربتين للتمييز بين محلولي حمض قوي وحمض ضعيف بالتركيز نفسه.<br><span style=\"opacity:.85\">• الإجابة النموذجية: قياس ‎pH (‎القوي أقل)، وقياس التوصيل الكهربائي (القوي أعلى)، أو سرعة التفاعل مع ‎Mg (‎القوي أسرع).<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 24–25 وحل السؤالين 5 و6<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الأحماض الضعيفة في الأطعمة كالخل والليمون<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=2<\/p>"]}]}, {"title": "ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎", "sb": "ص 26–30", "unit": "الوحدة 1: الاتزان في المحاليل المائية", "periods": [{"axis": "ثابت تأين الماء ‎Kw‎ وتركيز ‎H⁺‎ في الماء النقي", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎"], ["الحصة", "1 من 3"], ["محور الحصة", "ثابت تأين الماء ‎Kw‎ وتركيز ‎H⁺‎ في الماء النقي"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 26–27"], ["دليل المعلم", "ص 57–60"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: أيونات الهيدروجين في معادلات ثابت الاتزان ص 26"]], "t": ["1. يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎ (10 دقائق)\n2. يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎ (10 دقائق)\nمخرج تعليمي آخر: يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة (20 دقيقة)", "1. تذكر: يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎\n2. تطبيق: يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎\n3. تحليل (مخرج آخر): يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية", "التأين الذاتي للماء، ثابت تأين الماء ‎Kw‎، ‎[H⁺]‎، ‎[OH⁻]‎، المحلول المتعادل، ‎298 K‎.", "يسأل المعلم: «الماء النقي يوصل الكهرباء بدرجة ضعيفة جدًا؛ من أين تأتي الأيونات في ماء لا يحتوي أي مادة مذابة؟»", "1. يطرح المعلم السؤال ويستقبل الفرضيات، والطلبة يستنتجون حدوث تأين ذاتي ضعيف للماء (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم معادلة التأين الذاتي وتعبير ‎Kw‎ وقيمته، والطلبة يكتبون التعبير ويحسبون ‎[H⁺]‎ في الماء النقي (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل حساب ‎[OH⁻]‎ من ‎[H⁺]‎ والعكس، والطلبة يحلون أربع مسائل متدرجة في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب تعبير ‎Kw‎.\n• الإجابة النموذجية: ‎Kw = [H⁺][OH⁻]‎\n\n2. مستوى التطبيق: احسب ‎[H⁺]‎ في الماء النقي عند ‎298 K‎.\n• الإجابة النموذجية: ‎[H⁺] = √(1.00 × 10⁻¹⁴) = 1.00 × 10⁻⁷ mol/dm³‎.\n\n3. مستوى الاستدلال: احسب ‎[OH⁻]‎ في محلول فيه ‎[H⁺] = 1.0 × 10⁻³ mol/dm³‎.\n• الإجابة النموذجية: ‎[OH⁻] = 1.0 × 10⁻¹⁴ ÷ 1.0 × 10⁻³ = 1.0 × 10⁻¹¹ mol/dm³‎.", "1. مستوى المعرفة: ما قيمة ‎Kw‎ عند ‎298 K‎ ووحدتها؟\n• الإجابة النموذجية: ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎.\n\n2. مستوى التطبيق: احسب ‎[H⁺]‎ في محلول فيه ‎[OH⁻] = 2.0 × 10⁻⁴ mol/dm³‎.\n• الإجابة النموذجية: ‎[H⁺] = 1.0 × 10⁻¹⁴ ÷ 2.0 × 10⁻⁴ = 5.0 × 10⁻¹¹ mol/dm³‎.\n\n3. مستوى الاستدلال: عند ‎323 K‎ يزداد ‎Kw‎. هل يصبح الماء النقي حمضيًا؟ فسّر.\n• الإجابة النموذجية: لا؛ يبقى متعادلًا لأن ‎[H⁺] = [OH⁻]‎ دائمًا في الماء النقي، وإن ازداد كل منهما.", "إرشاد للطالب: مراجعة ص 26–27 وحل ثلاث مسائل على ‎Kw‎\nإرشاد لولي الأمر: تشجيع الابن على التدرب على استخدام الآلة الحاسبة العلمية في الأسس\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=3"], "h": ["<ol class=\"ol\"><li>يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎ (10 دقائق)<\/li><li>يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎ (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>التأين الذاتي للماء، ثابت تأين الماء ‎Kw‎، ‎[H⁺]‎، ‎[OH⁻]‎، المحلول المتعادل، ‎298 K‎.<\/p>", "<p>يسأل المعلم: «الماء النقي يوصل الكهرباء بدرجة ضعيفة جدًا؛ من أين تأتي الأيونات في ماء لا يحتوي أي مادة مذابة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويستقبل الفرضيات، والطلبة يستنتجون حدوث تأين ذاتي ضعيف للماء (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم معادلة التأين الذاتي وتعبير ‎Kw‎ وقيمته، والطلبة يكتبون التعبير ويحسبون ‎[H⁺]‎ في الماء النقي (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب ‎[OH⁻]‎ من ‎[H⁺]‎ والعكس، والطلبة يحلون أربع مسائل متدرجة في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب تعبير ‎Kw‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Kw = [H⁺][OH⁻]‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎[H⁺]‎ في الماء النقي عند ‎298 K‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = √(1.00 × 10⁻¹⁴) = 1.00 × 10⁻⁷ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎[OH⁻]‎ في محلول فيه ‎[H⁺] = 1.0 × 10⁻³ mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[OH⁻] = 1.0 × 10⁻¹⁴ ÷ 1.0 × 10⁻³ = 1.0 × 10⁻¹¹ mol/dm³‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما قيمة ‎Kw‎ عند ‎298 K‎ ووحدتها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎[H⁺]‎ في محلول فيه ‎[OH⁻] = 2.0 × 10⁻⁴ mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 1.0 × 10⁻¹⁴ ÷ 2.0 × 10⁻⁴ = 5.0 × 10⁻¹¹ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> عند ‎323 K‎ يزداد ‎Kw‎. هل يصبح الماء النقي حمضيًا؟ فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا؛ يبقى متعادلًا لأن ‎[H⁺] = [OH⁻]‎ دائمًا في الماء النقي، وإن ازداد كل منهما.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 26–27 وحل ثلاث مسائل على ‎Kw‎<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التدرب على استخدام الآلة الحاسبة العلمية في الأسس<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=3<\/p>"]}, {"axis": "مقياس ‎pH‎ وحسابه للأحماض القوية", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎"], ["الحصة", "2 من 3"], ["محور الحصة", "مقياس ‎pH‎ وحسابه للأحماض القوية"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 27–29"], ["دليل المعلم", "ص 57–60"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: أيونات الهيدروجين في معادلات ثابت الاتزان ص 26"]], "t": ["1. يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات (10 دقائق)\n2. يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎ (20 دقيقة)\nمخرج تعليمي آخر: يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎ (10 دقائق)", "1. تطبيق: يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات\n2. تطبيق: يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎\n3. تحليل (مخرج آخر): يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، مقياس ‎pH‎", "الرقم الهيدروجيني ‎pH‎، اللوغاريتم العشري، ‎pH = −log[H⁺]‎، ‎[H⁺] = 10⁻ᵖᴴ‎، مقياس ‎pH‎ اللوغاريتمي، الحمض أحادي البروتون وثنائيه.", "يعرض المعلم تركيزين: ‎[H⁺] = 0.1‎ و‎0.0000001 mol/dm³‎ ويسأل: «أيهما أسهل للكتابة والمقارنة؟ ولماذا ابتكر العلماء مقياس ‎pH‎؟»", "1. يطرح المعلم السؤال ويعرض أصل مقياس ‎pH‎، والطلبة يستنتجون فائدة اللوغاريتم في تبسيط الأرقام (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم ‎pH = −log[H⁺]‎ وعكسه، ويحل أمثلة لأحماض قوية (‎HCl‎ و‎H₂SO₄‎ بافتراض التأين الكلي)، والطلبة يحسبون ‎pH‎ ويتحققون بالآلة الحاسبة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم نشاط «حساب ‎pH‎ لأحماض قوية بتراكيز مختلفة» مع سلسلة تخفيف، والطلبة يحسبون ‎pH‎ لكل تخفيف ويستنتجون الزيادة بمقدار 1 (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.010 mol/dm³‎.\n• الإجابة النموذجية: ‎[H⁺] = 0.010‎، ‎pH = −log 0.010 = 2.00‎.\n\n2. مستوى التطبيق: احسب ‎[H⁺]‎ لمحلول ‎pH‎ له 3.50.\n• الإجابة النموذجية: ‎[H⁺] = 10⁻³·⁵ = 3.16 × 10⁻⁴ mol/dm³‎.\n\n3. مستوى الاستدلال: ماذا يحدث لـ ‎pH‎ حمض قوي عند تخفيفه عشر مرات؟\n• الإجابة النموذجية: يزداد بمقدار 1 لأن ‎[H⁺]‎ يقل عشر مرات.", "1. مستوى المعرفة: عرّف ‎pH‎ رياضيًا.\n• الإجابة النموذجية: سالب لوغاريتم تركيز أيونات الهيدروجين: ‎pH = −log[H⁺]‎.\n\n2. مستوى التطبيق: احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.050 mol/dm³‎.\n• الإجابة النموذجية: ‎pH = −log 0.050 = 1.30‎.\n\n3. مستوى الاستدلال: احسب ‎pH‎ لمحلول ‎H₂SO₄‎ تركيزه ‎0.050 mol/dm³‎ بافتراض تأينه الكلي، وفسّر اختلافه عن ‎HCl‎ بالتركيز نفسه.\n• الإجابة النموذجية: ‎[H⁺] = 0.10‎، ‎pH = 1.00‎؛ أقل من ‎HCl‎ لأن كل جزيء ‎H₂SO₄‎ يطلق بروتونين.", "إرشاد للطالب: مراجعة ص 27–29 وحل خمس مسائل ‎pH‎ متنوعة\nإرشاد لولي الأمر: متابعة الابن في استخدام زر ‎log‎ في الآلة الحاسبة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=3"], "h": ["<ol class=\"ol\"><li>يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات (10 دقائق)<\/li><li>يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎ (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎ (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية، مقياس ‎pH‎<\/span><\/div>", "<p>الرقم الهيدروجيني ‎pH‎، اللوغاريتم العشري، ‎pH = −log[H⁺]‎، ‎[H⁺] = 10⁻ᵖᴴ‎، مقياس ‎pH‎ اللوغاريتمي، الحمض أحادي البروتون وثنائيه.<\/p>", "<p>يعرض المعلم تركيزين: ‎[H⁺] = 0.1‎ و‎0.0000001 mol/dm³‎ ويسأل: «أيهما أسهل للكتابة والمقارنة؟ ولماذا ابتكر العلماء مقياس ‎pH‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويعرض أصل مقياس ‎pH‎، والطلبة يستنتجون فائدة اللوغاريتم في تبسيط الأرقام (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم ‎pH = −log[H⁺]‎ وعكسه، ويحل أمثلة لأحماض قوية (‎HCl‎ و‎H₂SO₄‎ بافتراض التأين الكلي)، والطلبة يحسبون ‎pH‎ ويتحققون بالآلة الحاسبة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم نشاط «حساب ‎pH‎ لأحماض قوية بتراكيز مختلفة» مع سلسلة تخفيف، والطلبة يحسبون ‎pH‎ لكل تخفيف ويستنتجون الزيادة بمقدار 1 (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.010 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 0.010‎، ‎pH = −log 0.010 = 2.00‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎[H⁺]‎ لمحلول ‎pH‎ له 3.50.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 10⁻³·⁵ = 3.16 × 10⁻⁴ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يحدث لـ ‎pH‎ حمض قوي عند تخفيفه عشر مرات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يزداد بمقدار 1 لأن ‎[H⁺]‎ يقل عشر مرات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف ‎pH‎ رياضيًا.<br><span style=\"opacity:.85\">• الإجابة النموذجية: سالب لوغاريتم تركيز أيونات الهيدروجين: ‎pH = −log[H⁺]‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.050 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎pH = −log 0.050 = 1.30‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎pH‎ لمحلول ‎H₂SO₄‎ تركيزه ‎0.050 mol/dm³‎ بافتراض تأينه الكلي، وفسّر اختلافه عن ‎HCl‎ بالتركيز نفسه.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 0.10‎، ‎pH = 1.00‎؛ أقل من ‎HCl‎ لأن كل جزيء ‎H₂SO₄‎ يطلق بروتونين.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 27–29 وحل خمس مسائل ‎pH‎ متنوعة<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في استخدام زر ‎log‎ في الآلة الحاسبة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=3<\/p>"]}, {"axis": "‎pH‎ القواعد القوية ونشاط 1-3 والأسئلة 7–9", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎"], ["الحصة", "3 من 3"], ["محور الحصة", "‎pH‎ القواعد القوية ونشاط 1-3 والأسئلة 7–9"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 29–30 + كتاب التجارب ص 26"], ["دليل المعلم", "ص 57–60"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-3: أيونات الهيدروجين في معادلات ثابت الاتزان ص 26"]], "t": ["1. يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎ (15 دقيقة)\n2. يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3) (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎ (10 دقائق)", "1. تطبيق: يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎\n2. تطبيق: يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3)\n3. تحليل (مخرج آخر): يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة", "‎pH‎ القواعد القوية، ‎[OH⁻]‎، ‎Kw‎، القاعدة ثنائية الهيدروكسيد، ‎pOH (‎للتوسع).", "يسأل المعلم: «محلول ‎NaOH‎ لا يحتوي تقريبًا أيونات ‎H⁺‎، فكيف نحسب له ‎pH‎؟» ويترك الطلبة يتذكرون ‎Kw‎.", "1. يطرح المعلم السؤال، والطلبة يقترحون استخدام ‎Kw‎ (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ينفذ المعلم نشاط «الرقم الهيدروجيني للقواعد القوية» بأمثلة ‎NaOH‎ و‎Ba(OH)₂‎، والطلبة يتبعون الخطوات: ‎[OH⁻] ← [H⁺] ← pH‎ (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 1-3 (كتاب التجارب ص 26) والأسئلة 7–9، والطلبة يحلون في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن ‎pH‎ القواعد القوية ونشاط 1-3 والأسئلة 7–9، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – مختبر مياه عمان: تحسب المجموعات الرقم الهيدروجيني لعيّنات مياه افتراضية يعطيها المعلم تراكيز [H⁺] لها، ثم تقترح سلوكًا يحمي مصادر المياه في عمان من التلوث (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ‎pH‎ لمحلول ‎NaOH‎ تركيزه ‎0.010 mol/dm³‎.\n• الإجابة النموذجية: ‎[H⁺] = 10⁻¹⁴ ÷ 0.010 = 10⁻¹²‎، ‎pH = 12.00‎.\n\n2. مستوى التطبيق: ما ‎[OH⁻]‎ في محلول ‎Ba(OH)₂‎ تركيزه ‎0.020 mol/dm³‎؟\n• الإجابة النموذجية: ‎0.040 mol/dm³‎.\n\n3. مستوى الاستدلال: احسب ‎pH‎ للمحلول السابق.\n• الإجابة النموذجية: ‎[H⁺] = 10⁻¹⁴ ÷ 0.040 = 2.5 × 10⁻¹³‎، ‎pH = 12.60‎.", "1. مستوى المعرفة: ما الخطوة الأولى لحساب ‎pH‎ قاعدة قوية؟\n• الإجابة النموذجية: حساب ‎[OH⁻]‎ من تركيز القاعدة.\n\n2. مستوى التطبيق: احسب ‎pH‎ لمحلول ‎KOH‎ تركيزه ‎0.0010 mol/dm³‎.\n• الإجابة النموذجية: ‎[H⁺] = 10⁻¹¹‎، ‎pH = 11.00‎.\n\n3. مستوى الاستدلال: محلولا ‎NaOH‎ و‎Ca(OH)₂‎ بالتركيز نفسه ‎0.010 mol/dm³‎؛ أيهما أعلى ‎pH‎؟ وكم الفرق؟\n• الإجابة النموذجية: ‎Ca(OH)₂‎ لأن ‎[OH⁻] = 0.020‎؛ ‎pH = 12.30‎ مقابل 12.00، الفرق 0.30.", "إرشاد للطالب: إكمال نشاط 1-3 ص 26 والأسئلة 7–9\nإرشاد لولي الأمر: متابعة الابن في ترتيب خطوات حساب ‎pH‎ للقواعد\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=3"], "h": ["<ol class=\"ol\"><li>يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎ (15 دقيقة)<\/li><li>يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3) (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎ (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>‎pH‎ القواعد القوية، ‎[OH⁻]‎، ‎Kw‎، القاعدة ثنائية الهيدروكسيد، ‎pOH (‎للتوسع).<\/p>", "<p>يسأل المعلم: «محلول ‎NaOH‎ لا يحتوي تقريبًا أيونات ‎H⁺‎، فكيف نحسب له ‎pH‎؟» ويترك الطلبة يتذكرون ‎Kw‎.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون استخدام ‎Kw‎ (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم نشاط «الرقم الهيدروجيني للقواعد القوية» بأمثلة ‎NaOH‎ و‎Ba(OH)₂‎، والطلبة يتبعون الخطوات: ‎[OH⁻] ← [H⁺] ← pH‎ (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 1-3 (كتاب التجارب ص 26) والأسئلة 7–9، والطلبة يحلون في أزواج (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن ‎pH‎ القواعد القوية ونشاط 1-3 والأسئلة 7–9، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – مختبر مياه عمان: تحسب المجموعات الرقم الهيدروجيني لعيّنات مياه افتراضية يعطيها المعلم تراكيز [H⁺] لها، ثم تقترح سلوكًا يحمي مصادر المياه في عمان من التلوث (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الرؤوس المرقمة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎pH‎ لمحلول ‎NaOH‎ تركيزه ‎0.010 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 10⁻¹⁴ ÷ 0.010 = 10⁻¹²‎، ‎pH = 12.00‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ‎[OH⁻]‎ في محلول ‎Ba(OH)₂‎ تركيزه ‎0.020 mol/dm³‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎0.040 mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎pH‎ للمحلول السابق.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 10⁻¹⁴ ÷ 0.040 = 2.5 × 10⁻¹³‎، ‎pH = 12.60‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطوة الأولى لحساب ‎pH‎ قاعدة قوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حساب ‎[OH⁻]‎ من تركيز القاعدة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎pH‎ لمحلول ‎KOH‎ تركيزه ‎0.0010 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 10⁻¹¹‎، ‎pH = 11.00‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> محلولا ‎NaOH‎ و‎Ca(OH)₂‎ بالتركيز نفسه ‎0.010 mol/dm³‎؛ أيهما أعلى ‎pH‎؟ وكم الفرق؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ca(OH)₂‎ لأن ‎[OH⁻] = 0.020‎؛ ‎pH = 12.30‎ مقابل 12.00، الفرق 0.30.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-3 ص 26 والأسئلة 7–9<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في ترتيب خطوات حساب ‎pH‎ للقواعد<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=3<\/p>"]}]}, {"title": "ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎", "sb": "ص 31–37", "unit": "الوحدة 1: الاتزان في المحاليل المائية", "periods": [{"axis": "تعبير ثابت التأين ‎Ka‎ وقيمة ‎pKa‎", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"], ["الحصة", "1 من 4"], ["محور الحصة", "تعبير ثابت التأين ‎Ka‎ وقيمة ‎pKa‎"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 31–33"], ["دليل المعلم", "ص 60–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]], "t": ["1. يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته (10 دقائق)\n2. يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض (10 دقائق)\nمخرج تعليمي آخر: يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎ (20 دقيقة)", "1. تطبيق: يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته\n2. فهم: يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض\n3. تحليل (مخرج آخر): يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎Ka‎ في كتاب الطالب", "ثابت تأين الحمض ‎Ka‎، ‎pKa‎، الحمض الضعيف، الاتزان، قوة الحمض، الوحدة ‎mol/dm³‎.", "يعرض المعلم جدول قيم ‎Ka‎ لعدة أحماض ويسأل: «ماذا يعني أن ‎Ka‎ لحمض الإيثانويك ‎1.74 × 10⁻⁵‎ بينما لحمض الميثانويك ‎1.6 × 10⁻⁴‎؟»", "1. يعرض المعلم الجدول ويطرح السؤال، والطلبة يستنتجون أن ‎Ka‎ الأكبر يعني تأينًا أكبر (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم كتابة تعبير ‎Ka‎ لـ ‎HA ⇌ H⁺ + A⁻‎ ووحدته وتعريف ‎pKa‎، والطلبة يكتبون تعبير ‎Ka‎ لثلاثة أحماض ويحسبون ‎pKa‎ (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مهمة ترتيب أحماض حسب القوة بالقيم المعطاة، والطلبة يرتبون ويبررون في مجموعات (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب تعبير ‎Ka‎ لحمض الإيثانويك.\n• الإجابة النموذجية: ‎Ka = [CH₃COO⁻][H⁺] / [CH₃COOH]‎\n\n2. مستوى التطبيق: احسب ‎pKa‎ لحمض ‎Ka‎ له ‎1.74 × 10⁻⁵ mol/dm³‎.\n• الإجابة النموذجية: ‎pKa = −log(1.74 × 10⁻⁵) = 4.76‎.\n\n3. مستوى الاستدلال: أيهما أقوى: حمض ‎pKa‎ له 3.2 أم 4.8؟\n• الإجابة النموذجية: الحمض ذو ‎pKa = 3.2‎ لأن ‎pKa‎ الأصغر يعني ‎Ka‎ أكبر.", "1. مستوى المعرفة: ما وحدة ‎Ka‎؟\n• الإجابة النموذجية: ‎mol/dm³‎.\n\n2. مستوى التطبيق: ماذا تدل قيمة ‎Ka‎ الصغيرة جدًا؟\n• الإجابة النموذجية: على أن الحمض ضعيف يتأين بدرجة قليلة.\n\n3. مستوى الاستدلال: رتب تصاعديًا في القوة: ‎HF (Ka = 5.6 × 10⁻⁴)‎، ‎CH₃COOH (1.74 × 10⁻⁵)‎، ‎HCN (4.9 × 10⁻¹⁰)‎.\n• الإجابة النموذجية: ‎HCN < CH₃COOH < HF‎.", "إرشاد للطالب: مراجعة ص 31–33 وكتابة تعبيرات ‎Ka‎ لخمسة أحماض\nإرشاد لولي الأمر: تشجيع الابن على عمل بطاقة تلخص العلاقة بين ‎Ka‎ و‎pKa‎ والقوة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4"], "h": ["<ol class=\"ol\"><li>يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته (10 دقائق)<\/li><li>يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎ (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: جدول قيم ‎Ka‎ في كتاب الطالب<\/span><\/div>", "<p>ثابت تأين الحمض ‎Ka‎، ‎pKa‎، الحمض الضعيف، الاتزان، قوة الحمض، الوحدة ‎mol/dm³‎.<\/p>", "<p>يعرض المعلم جدول قيم ‎Ka‎ لعدة أحماض ويسأل: «ماذا يعني أن ‎Ka‎ لحمض الإيثانويك ‎1.74 × 10⁻⁵‎ بينما لحمض الميثانويك ‎1.6 × 10⁻⁴‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الجدول ويطرح السؤال، والطلبة يستنتجون أن ‎Ka‎ الأكبر يعني تأينًا أكبر (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم كتابة تعبير ‎Ka‎ لـ ‎HA ⇌ H⁺ + A⁻‎ ووحدته وتعريف ‎pKa‎، والطلبة يكتبون تعبير ‎Ka‎ لثلاثة أحماض ويحسبون ‎pKa‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مهمة ترتيب أحماض حسب القوة بالقيم المعطاة، والطلبة يرتبون ويبررون في مجموعات (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب تعبير ‎Ka‎ لحمض الإيثانويك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ka = [CH₃COO⁻][H⁺] / [CH₃COOH]‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎pKa‎ لحمض ‎Ka‎ له ‎1.74 × 10⁻⁵ mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎pKa = −log(1.74 × 10⁻⁵) = 4.76‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أيهما أقوى: حمض ‎pKa‎ له 3.2 أم 4.8؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الحمض ذو ‎pKa = 3.2‎ لأن ‎pKa‎ الأصغر يعني ‎Ka‎ أكبر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وحدة ‎Ka‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا تدل قيمة ‎Ka‎ الصغيرة جدًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على أن الحمض ضعيف يتأين بدرجة قليلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> رتب تصاعديًا في القوة: ‎HF (Ka = 5.6 × 10⁻⁴)‎، ‎CH₃COOH (1.74 × 10⁻⁵)‎، ‎HCN (4.9 × 10⁻¹⁰)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎HCN &lt; CH₃COOH &lt; HF‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 31–33 وكتابة تعبيرات ‎Ka‎ لخمسة أحماض<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على عمل بطاقة تلخص العلاقة بين ‎Ka‎ و‎pKa‎ والقوة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4<\/p>"]}, {"axis": "حساب ‎pH‎ لحمض ضعيف", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"], ["الحصة", "2 من 4"], ["محور الحصة", "حساب ‎pH‎ لحمض ضعيف"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 33–35"], ["دليل المعلم", "ص 60–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]], "t": ["1. يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎ (10 دقائق)\n2. يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه (15 دقيقة)\nمخرج تعليمي آخر: يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما (15 دقيقة)", "1. تطبيق: يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎\n2. تطبيق: يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه\n3. تقييم (مخرج آخر): يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الافتراض الأول: ‎[H⁺] = [A⁻]‎، الافتراض الثاني: ‎[HA]‎ عند الاتزان ≈ التركيز الابتدائي، ‎[H⁺] = √(Ka[HA])‎، حساب ‎Ka‎ من ‎pH‎.", "يسأل المعلم: «في محلول حمض الإيثانويك ‎0.10 mol/dm³‎، هل ‎[H⁺] = 0.10‎؟ لماذا لا؟ وكيف نحسبه إذن؟»", "1. يطرح المعلم السؤال ويذكّر بالتأين الجزئي، والطلبة يستنتجون أن ‎[H⁺]‎ أقل كثيرًا من 0.10 (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشتق المعلم ‎[H⁺] = √(Ka × [HA])‎ مع الافتراضين ويحل مثالًا (المثال في كتاب الطالب)، والطلبة يتبعون خطوات الحل ويطبقونها على مثال ثانٍ (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم مسائل عكسية: حساب ‎Ka‎ من ‎pH‎، والطلبة يحلون في أزواج ويعرضون الحلول (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ‎pH‎ لمحلول حمض الإيثانويك ‎0.10 mol/dm³ (Ka = 1.74 × 10⁻⁵)‎.\n• الإجابة النموذجية: ‎[H⁺] = √(1.74 × 10⁻⁶) = 1.32 × 10⁻³‎، ‎pH = 2.88‎.\n\n2. مستوى التطبيق: ما الافتراض الذي يسمح باعتبار ‎[HA]‎ عند الاتزان مساويًا للتركيز الابتدائي؟\n• الإجابة النموذجية: أن نسبة التأين صغيرة جدًا فلا يتغير تركيز ‎HA‎ كثيرًا.\n\n3. مستوى الاستدلال: لماذا نفترض ‎[H⁺] = [A⁻]‎؟\n• الإجابة النموذجية: لأن كل جزيء يتأين يعطي ‎H⁺‎ واحدًا و‎A⁻‎ واحدًا، مع إهمال ‎H⁺‎ الناتج من تأين الماء.", "1. مستوى المعرفة: اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ لحمض ضعيف.\n• الإجابة النموذجية: ‎[H⁺] = √(Ka × [HA])‎\n\n2. مستوى التطبيق: محلول حمض ضعيف تركيزه ‎0.050 mol/dm³‎ و‎pH‎ له 3.00. احسب ‎Ka‎.\n• الإجابة النموذجية: ‎[H⁺] = 1.0 × 10⁻³‎؛ ‎Ka = (1.0 × 10⁻³)² ÷ 0.050 = 2.0 × 10⁻⁵ mol/dm³‎.\n\n3. مستوى الاستدلال: متى يصبح افتراض ‎[HA] ≈‎ التركيز الابتدائي غير دقيق؟\n• الإجابة النموذجية: عندما يكون الحمض أقوى نسبيًا (‎Ka‎ كبير) أو المحلول مخففًا جدًا فتصبح نسبة التأين كبيرة.", "إرشاد للطالب: مراجعة ص 33–35 وحل ثلاث مسائل لحمض ضعيف\nإرشاد لولي الأمر: متابعة الابن في كتابة الافتراضين قبل كل حل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4"], "h": ["<ol class=\"ol\"><li>يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎ (10 دقائق)<\/li><li>يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الافتراض الأول: ‎[H⁺] = [A⁻]‎، الافتراض الثاني: ‎[HA]‎ عند الاتزان ≈ التركيز الابتدائي، ‎[H⁺] = √(Ka[HA])‎، حساب ‎Ka‎ من ‎pH‎.<\/p>", "<p>يسأل المعلم: «في محلول حمض الإيثانويك ‎0.10 mol/dm³‎، هل ‎[H⁺] = 0.10‎؟ لماذا لا؟ وكيف نحسبه إذن؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويذكّر بالتأين الجزئي، والطلبة يستنتجون أن ‎[H⁺]‎ أقل كثيرًا من 0.10 (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشتق المعلم ‎[H⁺] = √(Ka × [HA])‎ مع الافتراضين ويحل مثالًا (المثال في كتاب الطالب)، والطلبة يتبعون خطوات الحل ويطبقونها على مثال ثانٍ (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم مسائل عكسية: حساب ‎Ka‎ من ‎pH‎، والطلبة يحلون في أزواج ويعرضون الحلول (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎pH‎ لمحلول حمض الإيثانويك ‎0.10 mol/dm³ (Ka = 1.74 × 10⁻⁵)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = √(1.74 × 10⁻⁶) = 1.32 × 10⁻³‎، ‎pH = 2.88‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الافتراض الذي يسمح باعتبار ‎[HA]‎ عند الاتزان مساويًا للتركيز الابتدائي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن نسبة التأين صغيرة جدًا فلا يتغير تركيز ‎HA‎ كثيرًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نفترض ‎[H⁺] = [A⁻]‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن كل جزيء يتأين يعطي ‎H⁺‎ واحدًا و‎A⁻‎ واحدًا، مع إهمال ‎H⁺‎ الناتج من تأين الماء.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ لحمض ضعيف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = √(Ka × [HA])‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> محلول حمض ضعيف تركيزه ‎0.050 mol/dm³‎ و‎pH‎ له 3.00. احسب ‎Ka‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 1.0 × 10⁻³‎؛ ‎Ka = (1.0 × 10⁻³)² ÷ 0.050 = 2.0 × 10⁻⁵ mol/dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> متى يصبح افتراض ‎[HA] ≈‎ التركيز الابتدائي غير دقيق؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عندما يكون الحمض أقوى نسبيًا (‎Ka‎ كبير) أو المحلول مخففًا جدًا فتصبح نسبة التأين كبيرة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 33–35 وحل ثلاث مسائل لحمض ضعيف<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة الافتراضين قبل كل حل<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4<\/p>"]}, {"axis": "ثابت تأين القواعد الضعيفة ‎Kb‎ واستخدام ‎pKa‎ في التفاعلات", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"], ["الحصة", "3 من 4"], ["محور الحصة", "ثابت تأين القواعد الضعيفة ‎Kb‎ واستخدام ‎pKa‎ في التفاعلات"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 35–37"], ["دليل المعلم", "ص 60–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]], "t": ["1. يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد (15 دقيقة)\n2. يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض (10 دقائق)", "1. تطبيق: يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد\n2. تحليل: يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما\n3. تقييم (مخرج آخر): يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎pKa‎", "ثابت تأين القاعدة ‎Kb‎، ‎pKb‎، القاعدة الضعيفة، ‎NH₃‎، الأمينات، اتجاه انتقال البروتون.", "يكتب المعلم معادلة ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎ ويسأل: «كيف نعبر عن مدى قاعدية الأمونيا بقيمة عددية كما فعلنا مع الأحماض؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون ثابتًا مشابهًا لـ ‎Ka‎ (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم تعبير ‎Kb‎ و‎pKb‎ ومقارنة القواعد، والطلبة يكتبون تعبير ‎Kb‎ للأمونيا وأمين بسيط (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم نشاط «استخدام قيم ‎pKa‎ لاستنتاج أحماض وقواعد برونستد-لوري في تفاعل ما»، والطلبة يحللون تفاعلات ويتنبؤون بالاتجاه المفضل (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب تعبير ‎Kb‎ للأمونيا.\n• الإجابة النموذجية: ‎Kb = [NH₄⁺][OH⁻] / [NH₃]‎\n\n2. مستوى التطبيق: أيهما أقوى قاعدة: ‎pKb = 3.4‎ أم ‎pKb = 4.8‎؟\n• الإجابة النموذجية: القاعدة ذات ‎pKb = 3.4‎.\n\n3. مستوى الاستدلال: عند خلط حمضين، أيهما يمنح البروتون للآخر؟\n• الإجابة النموذجية: الحمض ذو ‎pKa‎ الأصغر (الأقوى) يمنح البروتون، ويعمل الآخر قاعدة.", "1. مستوى المعرفة: ماذا تدل قيمة ‎Kb‎ الكبيرة؟\n• الإجابة النموذجية: على قاعدة أقوى تستقبل البروتون بدرجة أكبر.\n\n2. مستوى التطبيق: اكتب تعبير ‎Kb‎ للميثيل أمين ‎CH₃NH₂‎.\n• الإجابة النموذجية: ‎Kb = [CH₃NH₃⁺][OH⁻] / [CH₃NH₂]‎\n\n3. مستوى الاستدلال: في التفاعل ‎CH₃COOH + HCOO⁻ ⇌ CH₃COO⁻ + HCOOH‎، ومع ‎pKa (CH₃COOH) = 4.76‎ و‎pKa (HCOOH) = 3.75‎، أي الاتجاهين مفضل؟ فسّر.\n• الإجابة النموذجية: الاتجاه العكسي (إلى اليسار) مفضل، لأن ‎HCOOH‎ أقوى من ‎CH₃COOH‎ فيميل إلى منح البروتون.", "إرشاد للطالب: مراجعة ص 35–37 وحل تدريبين على ‎Kb‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين ‎Ka‎ و‎Kb‎ بلغته\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4"], "h": ["<ol class=\"ol\"><li>يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد (15 دقيقة)<\/li><li>يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: جدول قيم ‎pKa‎<\/span><\/div>", "<p>ثابت تأين القاعدة ‎Kb‎، ‎pKb‎، القاعدة الضعيفة، ‎NH₃‎، الأمينات، اتجاه انتقال البروتون.<\/p>", "<p>يكتب المعلم معادلة ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎ ويسأل: «كيف نعبر عن مدى قاعدية الأمونيا بقيمة عددية كما فعلنا مع الأحماض؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون ثابتًا مشابهًا لـ ‎Ka‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تعبير ‎Kb‎ و‎pKb‎ ومقارنة القواعد، والطلبة يكتبون تعبير ‎Kb‎ للأمونيا وأمين بسيط (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم نشاط «استخدام قيم ‎pKa‎ لاستنتاج أحماض وقواعد برونستد-لوري في تفاعل ما»، والطلبة يحللون تفاعلات ويتنبؤون بالاتجاه المفضل (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب تعبير ‎Kb‎ للأمونيا.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Kb = [NH₄⁺][OH⁻] / [NH₃]‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أيهما أقوى قاعدة: ‎pKb = 3.4‎ أم ‎pKb = 4.8‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: القاعدة ذات ‎pKb = 3.4‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> عند خلط حمضين، أيهما يمنح البروتون للآخر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الحمض ذو ‎pKa‎ الأصغر (الأقوى) يمنح البروتون، ويعمل الآخر قاعدة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا تدل قيمة ‎Kb‎ الكبيرة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على قاعدة أقوى تستقبل البروتون بدرجة أكبر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب تعبير ‎Kb‎ للميثيل أمين ‎CH₃NH₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Kb = [CH₃NH₃⁺][OH⁻] / [CH₃NH₂]‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> في التفاعل ‎CH₃COOH + HCOO⁻ ⇌ CH₃COO⁻ + HCOOH‎، ومع ‎pKa (CH₃COOH) = 4.76‎ و‎pKa (HCOOH) = 3.75‎، أي الاتجاهين مفضل؟ فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الاتجاه العكسي (إلى اليسار) مفضل، لأن ‎HCOOH‎ أقوى من ‎CH₃COOH‎ فيميل إلى منح البروتون.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 35–37 وحل تدريبين على ‎Kb‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين ‎Ka‎ و‎Kb‎ بلغته<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4<\/p>"]}, {"axis": "حل الأسئلة 10–15 ونشاط 1-2", "n": 4, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"], ["الحصة", "4 من 4"], ["محور الحصة", "حل الأسئلة 10–15 ونشاط 1-2"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "ص 31–37 + كتاب التجارب ص 25"], ["دليل المعلم", "ص 60–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]], "t": ["1. يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15) (15 دقيقة)\n2. يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎ (10 دقائق)\nمخرج تعليمي آخر: يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة (15 دقيقة)", "1. تطبيق: يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15)\n2. تطبيق: يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎\n3. تحليل (مخرج آخر): يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة", "- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة", "مسائل ‎pH‎ المختلطة، اختيار طريقة الحل، التحقق من المعقولية، الأرقام المعنوية.", "يعرض المعلم ثلاث بطاقات مسائل مقلوبة (حمض قوي، حمض ضعيف، قاعدة قوية) ويسأل: «قبل الحل، كيف تعرف أي طريقة تستخدم؟»", "1. يعرض المعلم البطاقات ويناقش معايير اختيار الطريقة، والطلبة يصنفون المسائل حسب نوعها (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يوجه المعلم حل نشاط 1-2 (كتاب التجارب ص 25)، والطلبة يحلون فرديًا ثم يقارنون في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوجه المعلم حل الأسئلة 10–15 في مجموعات، والطلبة يحلون ويعرضون الحلول على السبورة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص حل الأسئلة 10–15 ونشاط 1-2، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – سبلة الأحماض: تجلس المجموعات كأنها في سبلة عمانية تتشاور لترتيب أحماض ضعيفة حسب قيم Ka وpKa التي يعطيها المعلم، ثم يعلن ممثل كل مجموعة القرار مع التبرير (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم:\n1. مستوى المعرفة: كيف تعرف أن الحمض في المسألة ضعيف؟\n• الإجابة النموذجية: وجود قيمة ‎Ka‎ أو ‎pKa‎ أو ذكر أنه حمض ضعيف (كالأحماض العضوية).\n\n2. مستوى التطبيق: احسب ‎pH‎ لمحلول ‎HCOOH‎ تركيزه ‎0.20 mol/dm³ (Ka = 1.6 × 10⁻⁴)‎.\n• الإجابة النموذجية: ‎[H⁺] = √(3.2 × 10⁻⁵) = 5.66 × 10⁻³‎، ‎pH = 2.25‎.\n\n3. مستوى الاستدلال: لماذا ‎pH‎ للحمض الضعيف أعلى من ‎pH‎ لحمض قوي بالتركيز نفسه؟\n• الإجابة النموذجية: لأن تأينه جزئي فيكون ‎[H⁺]‎ أقل.", "1. مستوى المعرفة: احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.20 mol/dm³‎ وقارنه بحمض الميثانويك السابق.\n• الإجابة النموذجية: ‎pH = 0.70‎، وهو أقل من 2.25 لأن ‎HCl‎ يتأين كليًا.\n\n2. مستوى التطبيق: محلول حمض ضعيف ‎pH‎ له 2.50 وتركيزه ‎0.10 mol/dm³‎. احسب ‎pKa‎.\n• الإجابة النموذجية: ‎[H⁺] = 3.16 × 10⁻³‎؛ ‎Ka = 1.0 × 10⁻⁴‎؛ ‎pKa = 4.00‎.\n\n3. مستوى الاستدلال: اقترح طريقة للتحقق من معقولية ناتج ‎pH‎ لحمض ضعيف.\n• الإجابة النموذجية: يجب أن يكون أكبر من ‎pH‎ لحمض قوي بالتركيز نفسه وأقل من 7.", "إرشاد للطالب: إكمال نشاط 1-2 ص 25 والأسئلة المتبقية من 10–15\nإرشاد لولي الأمر: متابعة الابن في التحقق من معقولية نواتجه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4"], "h": ["<ol class=\"ol\"><li>يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15) (15 دقيقة)<\/li><li>يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎ (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مسائل ‎pH‎ المختلطة، اختيار طريقة الحل، التحقق من المعقولية، الأرقام المعنوية.<\/p>", "<p>يعرض المعلم ثلاث بطاقات مسائل مقلوبة (حمض قوي، حمض ضعيف، قاعدة قوية) ويسأل: «قبل الحل، كيف تعرف أي طريقة تستخدم؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم البطاقات ويناقش معايير اختيار الطريقة، والطلبة يصنفون المسائل حسب نوعها (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 1-2 (كتاب التجارب ص 25)، والطلبة يحلون فرديًا ثم يقارنون في أزواج (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل الأسئلة 10–15 في مجموعات، والطلبة يحلون ويعرضون الحلول على السبورة (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص حل الأسئلة 10–15 ونشاط 1-2، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – سبلة الأحماض: تجلس المجموعات كأنها في سبلة عمانية تتشاور لترتيب أحماض ضعيفة حسب قيم Ka وpKa التي يعطيها المعلم، ثم يعلن ممثل كل مجموعة القرار مع التبرير (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تعرف أن الحمض في المسألة ضعيف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: وجود قيمة ‎Ka‎ أو ‎pKa‎ أو ذكر أنه حمض ضعيف (كالأحماض العضوية).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎pH‎ لمحلول ‎HCOOH‎ تركيزه ‎0.20 mol/dm³ (Ka = 1.6 × 10⁻⁴)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = √(3.2 × 10⁻⁵) = 5.66 × 10⁻³‎، ‎pH = 2.25‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ‎pH‎ للحمض الضعيف أعلى من ‎pH‎ لحمض قوي بالتركيز نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن تأينه جزئي فيكون ‎[H⁺]‎ أقل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.20 mol/dm³‎ وقارنه بحمض الميثانويك السابق.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎pH = 0.70‎، وهو أقل من 2.25 لأن ‎HCl‎ يتأين كليًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> محلول حمض ضعيف ‎pH‎ له 2.50 وتركيزه ‎0.10 mol/dm³‎. احسب ‎pKa‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎[H⁺] = 3.16 × 10⁻³‎؛ ‎Ka = 1.0 × 10⁻⁴‎؛ ‎pKa = 4.00‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح طريقة للتحقق من معقولية ناتج ‎pH‎ لحمض ضعيف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يجب أن يكون أكبر من ‎pH‎ لحمض قوي بالتركيز نفسه وأقل من 7.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-2 ص 25 والأسئلة المتبقية من 10–15<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التحقق من معقولية نواتجه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=4<\/p>"]}]}, {"title": "معايرة الأحماض والقواعد", "sb": "ص 38–43", "unit": "الوحدة 1: الاتزان في المحاليل المائية", "periods": [{"axis": "الكواشف أحماض ضعيفة ومدى تغير اللون", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "معايرة الأحماض والقواعد"], ["الحصة", "1 من 3"], ["محور الحصة", "الكواشف أحماض ضعيفة ومدى تغير اللون"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "ص 38–39"], ["دليل المعلم", "ص 65–68"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-4: الكواشف ومنحنيات المعايرة ص 28؛ الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة ص 35"]], "t": ["1. يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎ (15 دقيقة)\n2. يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎ (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه (10 دقائق)", "1. فهم: يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎\n2. تطبيق: يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎\n3. تحليل (مخرج آخر): يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: محاليل ميثيل البرتقالي والفينولفثالين، محاليل حمضية وقاعدية مخففة", "الكاشف، ‎HIn‎ و‎In⁻‎، مدى تغير اللون، نقطة النهاية، ‎pKin‎، الميثيل البرتقالي، الفينولفثالين.", "يعرض المعلم مقطعًا لتغير لون الميثيل البرتقالي عند معادلة حمض ويسأل: «لماذا يتغير لون الكاشف فجأة عند قطرة واحدة؟»", "1. يعرض المعلم المقطع ويطرح السؤال، والطلبة يقترحون تفسيرًا لتغير اللون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم اتزان الكاشف ‎HIn ⇌ H⁺ + In⁻‎ وأثر إضافة حمض أو قاعدة، والطلبة يكتبون معادلة الاتزان ويتنبؤون بالإزاحة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ عرضًا: إضافة حمض وقاعدة إلى الكاشفين وتسجيل الألوان، والطلبة يسجلون الألوان ويحددون مدى التغير التقريبي لكل كاشف (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: لماذا يُعد الكاشف حمضًا ضعيفًا؟\n• الإجابة النموذجية: لأنه يتأين جزئيًا ‎HIn ⇌ H⁺ + In⁻‎ ولكل من ‎HIn‎ و‎In⁻‎ لون مختلف.\n\n2. مستوى التطبيق: ماذا يحدث لاتزان الكاشف عند إضافة حمض؟\n• الإجابة النموذجية: يزداد ‎[H⁺]‎ فيزاح الاتزان نحو ‎HIn‎ ويظهر لونه.\n\n3. مستوى الاستدلال: ما مدى تغير لون الفينولفثالين تقريبًا؟\n• الإجابة النموذجية: من نحو 8.3 إلى 10.", "1. مستوى المعرفة: ما نقطة النهاية؟\n• الإجابة النموذجية: النقطة التي يتغير عندها لون الكاشف أثناء المعايرة.\n\n2. مستوى التطبيق: ما لون الميثيل البرتقالي في الوسط الحمضي القوي؟\n• الإجابة النموذجية: أحمر.\n\n3. مستوى الاستدلال: يتغير لون كاشف عند ‎pH ≈ pKin ± 1‎. إذا كان ‎pKin = 5‎، فما مداه التقريبي؟\n• الإجابة النموذجية: من 4 إلى 6.", "إرشاد للطالب: مراجعة ص 38–39 وتلخيص ألوان الكاشفين في جدول\nإرشاد لولي الأمر: الحديث مع الابن عن كواشف طبيعية مثل الملفوف الأحمر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=5"], "h": ["<ol class=\"ol\"><li>يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎ (15 دقيقة)<\/li><li>يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎ (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><span class=\"chip r\">أخرى: محاليل ميثيل البرتقالي والفينولفثالين، محاليل حمضية وقاعدية مخففة<\/span><\/div>", "<p>الكاشف، ‎HIn‎ و‎In⁻‎، مدى تغير اللون، نقطة النهاية، ‎pKin‎، الميثيل البرتقالي، الفينولفثالين.<\/p>", "<p>يعرض المعلم مقطعًا لتغير لون الميثيل البرتقالي عند معادلة حمض ويسأل: «لماذا يتغير لون الكاشف فجأة عند قطرة واحدة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المقطع ويطرح السؤال، والطلبة يقترحون تفسيرًا لتغير اللون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم اتزان الكاشف ‎HIn ⇌ H⁺ + In⁻‎ وأثر إضافة حمض أو قاعدة، والطلبة يكتبون معادلة الاتزان ويتنبؤون بالإزاحة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ عرضًا: إضافة حمض وقاعدة إلى الكاشفين وتسجيل الألوان، والطلبة يسجلون الألوان ويحددون مدى التغير التقريبي لكل كاشف (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا يُعد الكاشف حمضًا ضعيفًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يتأين جزئيًا ‎HIn ⇌ H⁺ + In⁻‎ ولكل من ‎HIn‎ و‎In⁻‎ لون مختلف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لاتزان الكاشف عند إضافة حمض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يزداد ‎[H⁺]‎ فيزاح الاتزان نحو ‎HIn‎ ويظهر لونه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما مدى تغير لون الفينولفثالين تقريبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من نحو 8.3 إلى 10.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نقطة النهاية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: النقطة التي يتغير عندها لون الكاشف أثناء المعايرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما لون الميثيل البرتقالي في الوسط الحمضي القوي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أحمر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> يتغير لون كاشف عند ‎pH ≈ pKin ± 1‎. إذا كان ‎pKin = 5‎، فما مداه التقريبي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من 4 إلى 6.<\/span><\/p><\/div>", " تيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 1-4 «الكواشف ومنحنيات المعايرة» (كتاب التجارب ص 28)، والطلبة يختارون الكاشف المناسب لكل معايرة ويبررون (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم سؤالًا مفصليًا عن كاشف غير مناسب ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما ‎pH‎ عند نقطة التكافؤ لمعايرة حمض قوي مع قاعدة قوية؟\n• الإجابة النموذجية: 7.\n\n2. مستوى التطبيق: لماذا يكون ‎pH‎ عند التكافؤ أكبر من 7 في معايرة حمض ضعيف مع قاعدة قوية؟\n• الإجابة النموذجية: لأن الملح الناتج يحتوي القاعدة المرافقة للحمض الضعيف فيكون المحلول قاعديًا.\n\n3. مستوى الاستدلال: لماذا لا يناسب الميثيل البرتقالي معايرة ‎CH₃COOH‎ مع ‎NaOH‎؟\n• الإجابة النموذجية: لأن مدى تغير لونه (3–4.4 تقريبًا) يقع خارج الجزء الرأسي للمنحنى (نحو 7–11).", "1. مستوى المعرفة: ما الكاشف المناسب لمعايرة حمض ضعيف مع قاعدة قوية؟\n• الإجابة النموذجية: الفينولفثالين.\n\n2. مستوى التطبيق: ما الكاشف المناسب لمعايرة حمض قوي مع قاعدة ضعيفة؟\n• الإجابة النموذجية: الميثيل البرتقالي.\n\n3. مستوى الاستدلال: لماذا يصلح الكاشفان معًا لمعايرة حمض قوي مع قاعدة قوية؟\n• الإجابة النموذجية: لأن الجزء الرأسي يمتد تقريبًا من ‎pH 3‎ إلى 11 فيشمل مدى تغير لون الكاشفين.", "إرشاد للطالب: مراجعة ص 39–43 ورسم المنحنيات الثلاثة مع الكاشف المناسب لكل منها\nإرشاد لولي الأمر: متابعة الابن في إكمال نشاط 1-4\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=5"], "h": ["<ol class=\"ol\"><li>يرسم منحنيات ‎pH‎ لمعايرة حمض قوي مع قاعدة قوية، وحمض قوي مع قاعدة ضعيفة، وحمض ضعيف مع قاعدة قوية (5 دقائق)<\/li><li>يختار الكاشف المناسب لكل معايرة بمقارنة مدى تغير لونه بالجزء الرأسي من المنحنى (25 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد نقطة التكافؤ و‎pH‎ عندها من منحنى معايرة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يرسم منحنيات ‎pH‎ لمعايرة حمض قوي مع قاعدة p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم سؤالًا مفصليًا عن كاشف غير مناسب ثم التقويم الختامي، والطلبة يجيبون ويناقشون (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ‎pH‎ عند نقطة التكافؤ لمعايرة حمض قوي مع قاعدة قوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 7.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون ‎pH‎ عند التكافؤ أكبر من 7 في معايرة حمض ضعيف مع قاعدة قوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الملح الناتج يحتوي القاعدة المرافقة للحمض الضعيف فيكون المحلول قاعديًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يناسب الميثيل البرتقالي معايرة ‎CH₃COOH‎ مع ‎NaOH‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن مدى تغير لونه (3–4.4 تقريبًا) يقع خارج الجزء الرأسي للمنحنى (نحو 7–11).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الكاشف المناسب لمعايرة حمض ضعيف مع قاعدة قوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الفينولفثالين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الكاشف المناسب لمعايرة حمض قوي مع قاعدة ضعيفة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الميثيل البرتقالي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يصلح الكاشفان معًا لمعايرة حمض قوي مع قاعدة قوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجزء الرأسي يمتد تقريبًا من ‎pH 3‎ إلى 11 فيشمل مدى تغير لون الكاشفين.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 39–43 ورسم المنحنيات الثلاثة مع الكاشف المناسب لكل منها<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في إكمال نشاط 1-4<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=5<\/p>"]}, {"axis": "الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "معايرة الأحماض والقواعد"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "ص 38–43 + كتاب التجارب ص 35"], ["دليل المعلم", "ص 65–68"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-4: الكواشف ومنحنيات المعايرة ص 28؛ الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة ص 35"]], "t": ["1. ينفذ معايرة حمض بقاعدة مع قياس ‎pH‎ بعد كل إضافة ويسجل النتائج (10 دقائق)\n2. يرسم منحنى المعايرة من بياناته ويحدد نقطة التكافؤ والكاشف المناسب (20 دقيقة)\nمخرج تعليمي آخر: يقيّم مصادر الخطأ في القياس ويقترح تحسينات (10 دقائق)", "1. تطبيق: ينفذ معايرة حمض بقاعدة مع قياس ‎pH‎ بعد كل إضافة ويسجل النتائج\n2. تحليل: يرسم منحنى المعايرة من بياناته ويحدد نقطة التكافؤ والكاشف المناسب\n3. تقييم (مخرج آخر): يقيّم مصادر الخطأ في القياس ويقترح تحسينات", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: سحاحة، ماصة، مقياس ‎pH‎، كأس، محلولا حمض وقاعدة، ورق رسم بياني", "السحاحة، الماصة، المعايرة، قراءة مقياس ‎pH‎، الحجم عند التكافؤ، رسم البيانات.", "يعرض المعلم سحاحة مملوءة ومقياس ‎pH‎ ويسأل: «كيف نحول قراءات متتالية إلى منحنى يكشف نقطة التكافؤ بدقة؟»", "1. يعرض المعلم الأدوات ويراجع السلامة وقراءة السحاحة، والطلبة يحددون خطوات العمل (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجه المعلم تنفيذ الاستقصاء العملي 1-1 (كتاب التجارب ص 35) بإضافات ‎1 cm³‎ وتقليلها قرب التكافؤ، والطلبة يضيفون القاعدة تدريجيًا ويسجلون ‎pH‎ في جدول (19 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم رسم المنحنى وتحديد نقطة التكافؤ، والطلبة يرسمون المنحنى ويحددون الحجم عند التكافؤ والكاشف المناسب (7 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يناقش المعلم مصادر الخطأ ويدير التقويم الختامي، والطلبة يقترحون تحسينات ويجيبون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – كاشف بألوان العلم: تختار كل مجموعة الكاشف المناسب لمعايرات مختلفة، وتذكر لونه في الوسط الحمضي والقاعدي، ثم تبحث أيّ الكواشف يُظهر لونًا من ألوان العلم العماني الأحمر والأبيض والأخضر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم:\n1. مستوى المعرفة: لماذا تُقلل الإضافات قرب نقطة التكافؤ؟\n• الإجابة النموذجية: لأن ‎pH‎ يتغير بسرعة كبيرة هناك فنحتاج قراءات أكثر لتحديد النقطة بدقة.\n\n2. مستوى التطبيق: كيف تحدد نقطة التكافؤ من المنحنى؟\n• الإجابة النموذجية: من منتصف الجزء الرأسي الحاد.\n\n3. مستوى الاستدلال: ما احتياط السلامة عند تعبئة السحاحة؟\n• الإجابة النموذجية: تعبئتها تحت مستوى العين باستخدام قمع وارتداء النظارات الواقية.", "1. مستوى المعرفة: ما وظيفة الماصة في هذا الاستقصاء؟\n• الإجابة النموذجية: قياس حجم دقيق ثابت من الحمض ونقله إلى الكأس.\n\n2. مستوى التطبيق: اذكر مصدرين للخطأ في الاستقصاء.\n• الإجابة النموذجية: عدم معايرة مقياس ‎pH‎ قبل الاستخدام، وخطأ قراءة السحاحة (اختلاف زاوية النظر)، وفقاعة هواء في طرف السحاحة.\n\n3. مستوى الاستدلال: إذا كان ‎pH‎ البدائي 2.9 و‎pH‎ عند التكافؤ 8.7، فما نوع الحمض والقاعدة؟ والكاشف المناسب؟\n• الإجابة النموذجية: حمض ضعيف مع قاعدة قوية؛ الكاشف المناسب الفينولفثالين.", "إرشاد للطالب: كتابة تقرير الاستقصاء 1-1 مع المنحنى\nإرشاد لولي الأمر: التأكد من إكمال الابن الرسم البياني بعناية ودقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=5"], "h": ["<ol class=\"ol\"><li>ينفذ معايرة حمض بقاعدة مع قياس ‎pH‎ بعد كل إضافة ويسجل )\nمخرج تعليمي آخر: يفسر لماذا لا يظهر تركيز المادة الصلبة في تعبير ‎Ksp‎ (10 دقائق)", "1. تذكر: يعرّف ثابت حاصل الذوبانية ‎Ksp‎ لملح شحيح الذوبان\n2. تطبيق: يكتب تعبيرات ‎Ksp‎ لأملاح مختلفة الصيغ\n3. فهم (مخرج آخر): يفسر لماذا لا يظهر تركيز المادة الصلبة في تعبير ‎Ksp‎", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: محلول مشبع من كبريتات الكالسيوم للعرض", "الملح شحيح الذوبان، المحلول المشبع، الاتزان غير المتجانس، ثابت حاصل الذوبانية ‎Ksp‎.", "يعرض المعلم صورة لترسبات كربونات الكالسيوم في غلاية ماء (من عُسر الماء) ويسأل: «لماذا لا تذوب هذه الطبقة رغم وجود الماء دائمًا؟» ويربطها بـ «العلوم ضمن سياقها».", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون أن الملح شحيح الذوبان (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم الاتزان بين الملح الصلب وأيوناته في المحلول المشبع وتعريف ‎Ksp‎، والطلبة يكتبون معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎AgCl‎ (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم أملاحًا بصيغ مختلفة (‎AgCl‎، ‎PbI₂‎، ‎Ca₃(PO₄)₂‎) لكتابة تعبيراتها، والطلبة يكتبون التعبيرات في أزواج ويعرضونها (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب تعبير ‎Ksp‎ لـ ‎AgCl‎.\n• الإجابة النموذجية: ‎Ksp = [Ag⁺][Cl⁻]‎\n\n2. مستوى التطبيق: اكتب تعبير ‎Ksp‎ لـ ‎PbI₂‎.\n• الإجابة النموذجية: ‎Ksp = [Pb²⁺][I⁻]²‎\n\n3. مستوى الاستدلال: لماذا لا يظهر ‎AgCl(s)‎ في تعبير ‎Ksp‎؟\n• الإجابة النموذجية: لأن تركيز المادة الصلبة ثابت فيُدمج في الثابت.", "1. مستوى المعرفة: عرّف ثابت حاصل الذوبانية.\n• الإجابة النموذجية: حاصل ضرب تراكيز أيونات الملح شحيح الذوبان في محلوله المشبع، كل منها مرفوع إلى أس يساوي عدد مولاته في معادلة الاتزان، عند درجة حرارة معينة.\n\n2. مستوى التطبيق: اكتب معادلة الاتزان وتعبير ‎Ksp‎ لـ ‎CaF₂‎.\n• الإجابة النموذجية: ‎CaF₂(s) ⇌ Ca²⁺(aq) + 2F⁻(aq)‎؛ ‎Ksp = [Ca²⁺][F⁻]²‎\n\n3. مستوى الاستدلال: اكتب تعبير ‎Ksp‎ لـ ‎Ca₃(PO₄)₂‎.\n• الإجابة النموذجية: ‎Ksp = [Ca²⁺]
