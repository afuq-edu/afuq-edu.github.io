ابة النموذجية: ‎2Cl⁻ → Cl₂ + 2e⁻‎\n3) (المستوى المتقدم) السؤال: لماذا يتصاعد ‎H₂‎ لا ‎Na‎ عند المهبط في محلول ‎NaCl‎ المائي؟\n   الإجابة النموذجية: لأن اختزال الماء (أو ‎H⁺‎) أسهل من اختزال ‎Na⁺‎ ذي ‎E°‎ السالبة جدًا.","1) (مستوى الدعم) السؤال: إلى أي قطب تتجه الأيونات الموجبة؟\n   الإجابة النموذجية: المهبط (القطب السالب).\n2) (المستوى المتوقع) السؤال: ما ناتجا التحليل الكهربائي لمصهور ‎PbBr₂‎؟\n   الإجابة النموذجية: الرصاص عند المهبط والبروم عند المصعد.\n3) (المستوى المتقدم) السؤال: اكتب نصفي التفاعل للتحليل الكهربائي لمحلول ‎CuCl₂‎ بأقطاب خاملة.\n   الإجابة النموذجية: المهبط: ‎Cu²⁺ + 2e⁻ → Cu‎؛ المصعد: ‎2Cl⁻ → Cl₂ + 2e⁻‎.","إرشاد للطالب: مراجعة ص 90–92 وكتابة أنصاف معادلات لثلاثة أمثلة\nإرشاد لولي الأمر: الحديث مع الابن عن استخدام التحليل الكهربائي في طلاء المعادن"],"h":["<ol class=\"ol\"><li>يتنبأ بنواتج التحليل الكهربائي للمركبات الأيونية المنصهرة</li><li>يكتب أنصاف معادلات نزع شحنات الأيونات عند المهبط والمصعد</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر اختلاف نواتج التحليل الكهربائي لمحلول مائي عن مصهور الملح نفسه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يتنبأ بنواتج التحليل الكهربائي للمركبات الأيونية المنصهرة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب أنصاف معادلات نزع شحنات الأيونات عند المهبط والمصعد</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر اختلاف نواتج التحليل الكهربائي لمحلول مائي عن مصهور الملح نفسه</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: خلية تحليل كهربائي لمحلول ‎CuCl₂‎ بأقطاب كربون، مصدر تيار مستمر</span></div>","<p>التحليل الكهربائي، الإلكتروليت، المهبط (السالب)، المصعد (الموجب)، نزع الشحنة، المصهور، المحلول المائي.</p>","<p>يجري المعلم تحليلًا كهربائيًا لمحلول ‎CuCl₂‎ فيترسب نحاس على قطب ويتصاعد غاز عند الآخر، ويسأل: «أي القطبين ترسب عليه النحاس؟ ولماذا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>ينفذ العرض ويطرح السؤال</td><td>يلاحظون ويتنبؤون بالغاز</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح التحليل الكهربائي للمصاهير (‎PbBr₂‎، ‎NaCl‎) ونزع الشحنات وأنصاف المعادلات</td><td>يكتبون أنصاف المعادلات لكل قطب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقارن بين مصهور ‎NaCl‎ ومحلوله المائي ويقدم أمثلة للتنبؤ</td><td>يتنبؤون بالنواتج في مجموعات ويكتبون أنصاف المعادلات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الناتج عند المهبط في التحليل الكهربائي لمصهور ‎NaCl‎؟</td><td>فلز الصوديوم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب نصف معادلة المصعد في التحليل الكهربائي لمصهور ‎NaCl‎.</td><td>‎2Cl⁻ → Cl₂ + 2e⁻‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يتصاعد ‎H₂‎ لا ‎Na‎ عند المهبط في محلول ‎NaCl‎ المائي؟</td><td>لأن اختزال الماء (أو ‎H⁺‎) أسهل من اختزال ‎Na⁺‎ ذي ‎E°‎ السالبة جدًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>إلى أي قطب تتجه الأيونات الموجبة؟</td><td>المهبط (القطب السالب).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ناتجا التحليل الكهربائي لمصهور ‎PbBr₂‎؟</td><td>الرصاص عند المهبط والبروم عند المصعد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب نصفي التفاعل للتحليل الكهربائي لمحلول ‎CuCl₂‎ بأقطاب خاملة.</td><td>المهبط: ‎Cu²⁺ + 2e⁻ → Cu‎؛ المصعد: ‎2Cl⁻ → Cl₂ + 2e⁻‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 90–92 وكتابة أنصاف معادلات لثلاثة أمثلة</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن استخدام التحليل الكهربائي في طلاء المعادن</p>"]},{"axis":"استخدام جهود الأقطاب للتنبؤ بنواتج التحليل الكهربائي","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","التحليل الكهربائي"],["الحصة","2 من 2"],["محور الحصة","استخدام جهود الأقطاب للتنبؤ بنواتج التحليل الكهربائي"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 92–94 + كتاب التجارب ص 54"],["دليل المعلم","ص 114–117"],["كتاب التجارب العملية والأنشطة","نشاط 2-5: التحليل الكهربائي ص 54"]],"t":["1. يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية\n2. يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف)\nمخرج تعليمي آخر: يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الخريطة الذهنية","- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية، كتاب التجارب العملية والأنشطة","الأيون الأسهل اختزالًا، الأيون الأسهل أكسدة، تأثير التركيز، المحلول المركز والمخفف، الحجوم النسبية للغازات.","يسأل المعلم: «في محلول كبريتات النحاس توجد أيونات ‎Cu²⁺‎ و‎H⁺ (‎من الماء)؛ أيهما سيكسب الإلكترونات أولًا عند المهبط؟ وكيف نقرر؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون مقارنة قيم ‎E°‎\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «تأثير قيم جهود الأقطاب القياسية على نزع شحنات الأيونات» ويشرح أثر التركيز في محلول ‎NaCl‎\nالطالب: يطبقون القاعدة على أمثلة ويفسرون الحجوم النسبية للغازات\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 2-5 (كتاب التجارب ص 54) والأسئلة 18–22 ويضيف الحقائق إلى الخريطة الذهنية\nالطالب: يحلون ويحدّثون الخريطة الذهنية للتحليل الكهربائي\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التحليل الكهربائي\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عند المهبط في محلول ‎CuSO₄‎، أي الأيونين يُختزل: ‎Cu²⁺‎ أم ‎H⁺‎؟\n   الإجابة النموذجية: ‎Cu²⁺‎ لأن ‎E°‎ له (+0.34) أكبر من ‎E°‎ لـ ‎H⁺ (0.00)‎.\n2) (المستوى المتوقع) السؤال: ما ناتج المصعد في محلول ‎NaCl‎ المركز؟\n   الإجابة النموذجية: الكلور.\n3) (المستوى المتقدم) السؤال: ما ناتج المصعد في محلول ‎NaCl‎ المخفف جدًا؟ ولماذا؟\n   الإجابة النموذجية: الأكسجين (غالبًا)، لأن تركيز ‎Cl⁻‎ منخفض فيصبح تأكسد الماء/‎OH⁻‎ مفضلًا.","1) (مستوى الدعم) السؤال: ما ناتجا التحليل الكهربائي لمحلول ‎CuSO₄‎ بأقطاب خاملة؟\n   الإجابة النموذجية: النحاس عند المهبط والأكسجين عند المصعد.\n2) (المستوى المتوقع) السؤال: لماذا يتصاعد ‎H₂‎ عند المهبط في تحليل محلول ‎Na₂SO₄‎؟\n   الإجابة النموذجية: لأن اختزال الماء أسهل كثيرًا من اختزال ‎Na⁺‎.\n3) (المستوى المتقدم) السؤال: في تحليل محلول ‎H₂SO₄‎ المخفف، ما النسبة بين حجمي ‎H₂‎ و‎O₂‎؟ ولماذا؟\n   الإجابة النموذجية: 2 : 1، لأن تكوين جزيء ‎O₂‎ يتطلب 4 إلكترونات بينما جزيء ‎H₂‎ يتطلب 2.","إرشاد للطالب: إكمال نشاط 2-5 ص 54 والأسئلة 18–22 وتحديث الخريطة الذهنية\nإرشاد لولي الأمر: متابعة الابن في استخدام سلسلة ‎E°‎ للتنبؤ بالنواتج"],"h":["<ol class=\"ol\"><li>يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية</li><li>يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الخريطة الذهنية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية، كتاب التجارب العملية والأنشطة</span></div>","<p>الأيون الأسهل اختزالًا، الأيون الأسهل أكسدة، تأثير التركيز، المحلول المركز والمخفف، الحجوم النسبية للغازات.</p>","<p>يسأل المعلم: «في محلول كبريتات النحاس توجد أيونات ‎Cu²⁺‎ و‎H⁺ (‎من الماء)؛ أيهما سيكسب الإلكترونات أولًا عند المهبط؟ وكيف نقرر؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون مقارنة قيم ‎E°‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «تأثير قيم جهود الأقطاب القياسية على نزع شحنات الأيونات» ويشرح أثر التركيز في محلول ‎NaCl‎</td><td>يطبقون القاعدة على أمثلة ويفسرون الحجوم النسبية للغازات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 2-5 (كتاب التجارب ص 54) والأسئلة 18–22 ويضيف الحقائق إلى الخريطة الذهنية</td><td>يحلون ويحدّثون الخريطة الذهنية للتحليل الكهربائي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على التحليل الكهربائي</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عند المهبط في محلول ‎CuSO₄‎، أي الأيونين يُختزل: ‎Cu²⁺‎ أم ‎H⁺‎؟</td><td>‎Cu²⁺‎ لأن ‎E°‎ له (+0.34) أكبر من ‎E°‎ لـ ‎H⁺ (0.00)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ناتج المصعد في محلول ‎NaCl‎ المركز؟</td><td>الكلور.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما ناتج المصعد في محلول ‎NaCl‎ المخفف جدًا؟ ولماذا؟</td><td>الأكسجين (غالبًا)، لأن تركيز ‎Cl⁻‎ منخفض فيصبح تأكسد الماء/‎OH⁻‎ مفضلًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ناتجا التحليل الكهربائي لمحلول ‎CuSO₄‎ بأقطاب خاملة؟</td><td>النحاس عند المهبط والأكسجين عند المصعد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يتصاعد ‎H₂‎ عند المهبط في تحليل محلول ‎Na₂SO₄‎؟</td><td>لأن اختزال الماء أسهل كثيرًا من اختزال ‎Na⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>في تحليل محلول ‎H₂SO₄‎ المخفف، ما النسبة بين حجمي ‎H₂‎ و‎O₂‎؟ ولماذا؟</td><td>2 : 1، لأن تكوين جزيء ‎O₂‎ يتطلب 4 إلكترونات بينما جزيء ‎H₂‎ يتطلب 2.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-5 ص 54 والأسئلة 18–22 وتحديث الخريطة الذهنية</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في استخدام سلسلة ‎E°‎ للتنبؤ بالنواتج</p>"]}]},{"title":"حسابات التحليل الكهربائي","sb":"ص 95–110","unit":"الوحدة 2: الكيمياء الكهربائية","periods":[{"axis":"كمية الشحنة ‎Q = It‎ وثابت فارادي","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","حسابات التحليل الكهربائي"],["الحصة","1 من 5"],["محور الحصة","كمية الشحنة ‎Q = It‎ وثابت فارادي"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 95–96"],["دليل المعلم","ص 117–121"],["كتاب التجارب العملية والأنشطة","نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]],"t":["1. يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎\n2. يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎\nمخرج تعليمي آخر: يحسب عدد مولات الإلكترونات المارة من كمية الشحنة","المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج الآخر: تطبيق","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","كمية الشحنة ‎Q‎، شدة التيار ‎I‎، الزمن ‎t‎ بالثواني، الكولوم، ثابت فارادي ‎F‎، مولات الإلكترونات.","يسأل المعلم: «لطلاء ملعقة بطبقة فضة محددة، كيف تعرف كم دقيقة تترك التيار يمر؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون العلاقة بين التيار والزمن وكمية المادة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح ‎Q = It‎ وتحويل الزمن إلى ثوانٍ وثابت فارادي ومولات الإلكترونات\nالطالب: يحلون أمثلة مباشرة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مسائل متدرجة لحساب ‎Q‎ ومولات الإلكترونات\nالطالب: يحلون في أزواج ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب كمية الشحنة لتيار ‎2.0 A‎ يمر مدة 30 دقيقة.\n   الإجابة النموذجية: ‎Q = 2.0 × 1800 = 3600 C‎.\n2) (المستوى المتوقع) السؤال: كم مولًا من الإلكترونات تمثله الشحنة السابقة؟\n   الإجابة النموذجية: ‎3600 ÷ 96500 = 0.0373 mol‎.\n3) (المستوى المتقدم) السؤال: لماذا يجب تحويل الزمن إلى ثوانٍ؟\n   الإجابة النموذجية: لأن وحدة الكولوم تساوي أمبير × ثانية.","1) (مستوى الدعم) السؤال: ما قيمة ثابت فارادي؟\n   الإجابة النموذجية: ‎96500 C/mol‎.\n2) (المستوى المتوقع) السؤال: احسب ‎Q‎ لتيار ‎0.50 A‎ يمر مدة ‎965 s‎.\n   الإجابة النموذجية: ‎Q = 482.5 C‎.\n3) (المستوى المتقدم) السؤال: كم ثانية يلزم لتمرير ‎0.10 mol‎ من الإلكترونات بتيار ‎1.93 A‎؟\n   الإجابة النموذجية: ‎Q = 0.10 × 96500 = 9650 C‎؛ ‎t = 9650 ÷ 1.93 = 5000 s‎.","إرشاد للطالب: مراجعة ص 95–96 وحل أربع مسائل على ‎Q = It‎\nإرشاد لولي الأمر: متابعة الابن في تحويل الوحدات قبل الحساب"],"h":["<ol class=\"ol\"><li>يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎</li><li>يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب عدد مولات الإلكترونات المارة من كمية الشحنة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب عدد مولات الإلكترونات المارة من كمية الشحنة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>كمية الشحنة ‎Q‎، شدة التيار ‎I‎، الزمن ‎t‎ بالثواني، الكولوم، ثابت فارادي ‎F‎، مولات الإلكترونات.</p>","<p>يسأل المعلم: «لطلاء ملعقة بطبقة فضة محددة، كيف تعرف كم دقيقة تترك التيار يمر؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون العلاقة بين التيار والزمن وكمية المادة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح ‎Q = It‎ وتحويل الزمن إلى ثوانٍ وثابت فارادي ومولات الإلكترونات</td><td>يحلون أمثلة مباشرة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مسائل متدرجة لحساب ‎Q‎ ومولات الإلكترونات</td><td>يحلون في أزواج ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب كمية الشحنة لتيار ‎2.0 A‎ يمر مدة 30 دقيقة.</td><td>‎Q = 2.0 × 1800 = 3600 C‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كم مولًا من الإلكترونات تمثله الشحنة السابقة؟</td><td>‎3600 ÷ 96500 = 0.0373 mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يجب تحويل الزمن إلى ثوانٍ؟</td><td>لأن وحدة الكولوم تساوي أمبير × ثانية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما قيمة ثابت فارادي؟</td><td>‎96500 C/mol‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎Q‎ لتيار ‎0.50 A‎ يمر مدة ‎965 s‎.</td><td>‎Q = 482.5 C‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم ثانية يلزم لتمرير ‎0.10 mol‎ من الإلكترونات بتيار ‎1.93 A‎؟</td><td>‎Q = 0.10 × 96500 = 9650 C‎؛ ‎t = 9650 ÷ 1.93 = 5000 s‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 95–96 وحل أربع مسائل على ‎Q = It‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في تحويل الوحدات قبل الحساب</p>"]},{"axis":"حساب كتلة المادة المترسبة وحجم الغاز المتصاعد","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","حسابات التحليل الكهربائي"],["الحصة","2 من 5"],["محور الحصة","حساب كتلة المادة المترسبة وحجم الغاز المتصاعد"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 96–97"],["دليل المعلم","ص 117–121"],["كتاب التجارب العملية والأنشطة","نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]],"t":["1. يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة\n2. يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي\nمخرج تعليمي آخر: يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، جدول دوري","مولات الإلكترونات، النسبة المولية من نصف المعادلة، الكتلة المولية، الحجم المولي للغاز (‎24 dm³‎ عند الظروف العادية)، الكتلة المترسبة.","يسأل المعلم: «إذا مرت الشحنة نفسها في خليتين متتاليتين إحداهما فيها ‎Ag⁺‎ والأخرى فيها ‎Cu²⁺‎، فأيهما يترسب منه عدد أكبر من المولات؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يربطون الإجابة بشحنة الأيون\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: ينفذ «حساب كتلة المادة المترسبة» بأمثلة ‎Cu‎ و‎Ag‎ وحجم ‎O₂‎\nالطالب: يتبعون الخطوات: ‎Q ←‎ مول ‎e⁻ ←‎ مول مادة ← كتلة أو حجم\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم مسائل للحل في مجموعات بينها خلايا متتالية\nالطالب: يحلون ويعرضون الحلول\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب كتلة النحاس المترسبة بتيار ‎2.0 A‎ مدة 30 دقيقة ‎(Ar Cu = 63.5)‎.\n   الإجابة النموذجية: مول ‎e⁻ = 0.0373‎؛ مول ‎Cu = 0.0187‎؛ الكتلة = ‎1.18 g‎.\n2) (المستوى المتوقع) السؤال: احسب كتلة الفضة المترسبة بمرور ‎482.5 C (Ar Ag = 108)‎.\n   الإجابة النموذجية: مول ‎e⁻ = 0.0050‎؛ الكتلة = ‎0.54 g‎.\n3) (المستوى المتقدم) السؤال: لماذا يترسب من الفضة ضعف عدد مولات النحاس بالشحنة نفسها؟\n   الإجابة النموذجية: لأن ‎Ag⁺‎ يحتاج إلكترونًا واحدًا و‎Cu²⁺‎ يحتاج إلكترونين.","1) (مستوى الدعم) السؤال: ما الخطوات الأربع لحساب الكتلة المترسبة؟\n   الإجابة النموذجية: حساب ‎Q‎، ثم مولات الإلكترونات، ثم مولات المادة من نصف المعادلة، ثم الكتلة = المولات × الكتلة المولية.\n2) (المستوى المتوقع) السؤال: احسب حجم ‎O₂ (24 dm³/mol)‎ المتصاعد عند مرور ‎0.20 mol‎ من الإلكترونات.\n   الإجابة النموذجية: ‎4OH⁻ → O₂ + 2H₂O + 4e⁻‎؛ مول ‎O₂ = 0.050‎؛ الحجم = ‎1.2 dm³‎.\n3) (المستوى المتقدم) السؤال: مرت الشحنة نفسها في محلولي ‎AgNO₃‎ و‎CuSO₄‎ فترسب ‎1.08 g Ag‎. احسب كتلة ‎Cu‎.\n   الإجابة النموذجية: مول ‎Ag = 0.010 =‎ مول ‎e⁻‎؛ مول ‎Cu = 0.0050‎؛ الكتلة = ‎0.32 g‎.","إرشاد للطالب: مراجعة ص 96–97 وحل ثلاث مسائل كتلة وحجم\nإرشاد لولي الأمر: متابعة الابن في كتابة نصف المعادلة قبل حساب النسبة المولية"],"h":["<ol class=\"ol\"><li>يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة</li><li>يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية، جدول دوري</span></div>","<p>مولات الإلكترونات، النسبة المولية من نصف المعادلة، الكتلة المولية، الحجم المولي للغاز (‎24 dm³‎ عند الظروف العادية)، الكتلة المترسبة.</p>","<p>يسأل المعلم: «إذا مرت الشحنة نفسها في خليتين متتاليتين إحداهما فيها ‎Ag⁺‎ والأخرى فيها ‎Cu²⁺‎، فأيهما يترسب منه عدد أكبر من المولات؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يربطون الإجابة بشحنة الأيون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>ينفذ «حساب كتلة المادة المترسبة» بأمثلة ‎Cu‎ و‎Ag‎ وحجم ‎O₂‎</td><td>يتبعون الخطوات: ‎Q ←‎ مول ‎e⁻ ←‎ مول مادة ← كتلة أو حجم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم مسائل للحل في مجموعات بينها خلايا متتالية</td><td>يحلون ويعرضون الحلول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب كتلة النحاس المترسبة بتيار ‎2.0 A‎ مدة 30 دقيقة ‎(Ar Cu = 63.5)‎.</td><td>مول ‎e⁻ = 0.0373‎؛ مول ‎Cu = 0.0187‎؛ الكتلة = ‎1.18 g‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب كتلة الفضة المترسبة بمرور ‎482.5 C (Ar Ag = 108)‎.</td><td>مول ‎e⁻ = 0.0050‎؛ الكتلة = ‎0.54 g‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يترسب من الفضة ضعف عدد مولات النحاس بالشحنة نفسها؟</td><td>لأن ‎Ag⁺‎ يحتاج إلكترونًا واحدًا و‎Cu²⁺‎ يحتاج إلكترونين.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطوات الأربع لحساب الكتلة المترسبة؟</td><td>حساب ‎Q‎، ثم مولات الإلكترونات، ثم مولات المادة من نصف المعادلة، ثم الكتلة = المولات × الكتلة المولية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب حجم ‎O₂ (24 dm³/mol)‎ المتصاعد عند مرور ‎0.20 mol‎ من الإلكترونات.</td><td>‎4OH⁻ → O₂ + 2H₂O + 4e⁻‎؛ مول ‎O₂ = 0.050‎؛ الحجم = ‎1.2 dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>مرت الشحنة نفسها في محلولي ‎AgNO₃‎ و‎CuSO₄‎ فترسب ‎1.08 g Ag‎. احسب كتلة ‎Cu‎.</td><td>مول ‎Ag = 0.010 =‎ مول ‎e⁻‎؛ مول ‎Cu = 0.0050‎؛ الكتلة = ‎0.32 g‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 96–97 وحل ثلاث مسائل كتلة وحجم</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة نصف المعادلة قبل حساب النسبة المولية</p>"]},{"axis":"العلاقة ‎F = L × e‎ وتحديد ثابت أفوجادرو بالتحليل الكهربائي","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","حسابات التحليل الكهربائي"],["الحصة","3 من 5"],["محور الحصة","العلاقة ‎F = L × e‎ وتحديد ثابت أفوجادرو بالتحليل الكهربائي"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 97–98"],["دليل المعلم","ص 117–121"],["كتاب التجارب العملية والأنشطة","نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]],"t":["1. يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها\n2. يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس)\nمخرج تعليمي آخر: يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية","ثابت أفوجادرو ‎L‎، شحنة الإلكترون ‎e‎، ‎F = L × e‎، تحديد ‎L‎ تجريبيًا، تغير كتلة القطب.","يسأل المعلم: «كيف عدّ العلماء عدد الذرات في مول دون أن يروا ذرة واحدة؟» ويعرض العلاقة ‎F = L × e‎.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويعرض العلاقة\nالطالب: يتوقعون استخدام التحليل الكهربائي\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح العلاقة ويحسب ‎L‎ من ‎F‎ و‎e‎، ثم يصف تجربة ترسيب النحاس وقياس تغير الكتلة\nالطالب: يحسبون ‎L = 96500 ÷ 1.60 × 10⁻¹⁹‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم بيانات تجريبية لحساب ‎L‎ في مجموعات\nالطالب: يحسبون ‎L‎ ويقارنونها بالقيمة المقبولة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب العلاقة بين ‎F‎ و‎L‎ و‎e‎.\n   الإجابة النموذجية: ‎F = L × e‎\n2) (المستوى المتوقع) السؤال: احسب ‎L‎ من ‎F = 96500 C/mol‎ و‎e = 1.60 × 10⁻¹⁹ C‎.\n   الإجابة النموذجية: ‎L = 6.03 × 10²³ mol⁻¹‎.\n3) (المستوى المتقدم) السؤال: ما القياسات اللازمة لتحديد ‎L‎ بترسيب النحاس؟\n   الإجابة النموذجية: شدة التيار، والزمن، وتغير كتلة المهبط.","1) (مستوى الدعم) السؤال: ما قيمة شحنة الإلكترون؟\n   الإجابة النموذجية: ‎1.60 × 10⁻¹⁹ C‎.\n2) (المستوى المتوقع) السؤال: في تجربة: تيار ‎0.50 A‎ مدة ‎3860 s‎ رسب ‎0.635 g Cu‎. احسب عدد الإلكترونات المارة.\n   الإجابة النموذجية: ‎Q = 1930 C‎؛ عدد الإلكترونات = ‎1930 ÷ 1.60 × 10⁻¹⁹ = 1.21 × 10²²‎.\n3) (المستوى المتقدم) السؤال: أكمل التجربة السابقة لحساب ‎L‎.\n   الإجابة النموذجية: مول ‎Cu = 0.0100‎، فمول ‎e⁻ = 0.0200‎؛ ‎L = 1.21 × 10²² ÷ 0.0200 = 6.0 × 10²³ mol⁻¹‎.","إرشاد للطالب: مراجعة ص 97–98 وحل مسألة تحديد ‎L‎\nإرشاد لولي الأمر: الحديث مع الابن عن ضخامة عدد أفوجادرو بأمثلة من الحياة"],"h":["<ol class=\"ol\"><li>يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها</li><li>يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على حل المشكلات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>ثابت أفوجادرو ‎L‎، شحنة الإلكترون ‎e‎، ‎F = L × e‎، تحديد ‎L‎ تجريبيًا، تغير كتلة القطب.</p>","<p>يسأل المعلم: «كيف عدّ العلماء عدد الذرات في مول دون أن يروا ذرة واحدة؟» ويعرض العلاقة ‎F = L × e‎.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويعرض العلاقة</td><td>يتوقعون استخدام التحليل الكهربائي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح العلاقة ويحسب ‎L‎ من ‎F‎ و‎e‎، ثم يصف تجربة ترسيب النحاس وقياس تغير الكتلة</td><td>يحسبون ‎L = 96500 ÷ 1.60 × 10⁻¹⁹‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم بيانات تجريبية لحساب ‎L‎ في مجموعات</td><td>يحسبون ‎L‎ ويقارنونها بالقيمة المقبولة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب العلاقة بين ‎F‎ و‎L‎ و‎e‎.</td><td>‎F = L × e‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎L‎ من ‎F = 96500 C/mol‎ و‎e = 1.60 × 10⁻¹⁹ C‎.</td><td>‎L = 6.03 × 10²³ mol⁻¹‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما القياسات اللازمة لتحديد ‎L‎ بترسيب النحاس؟</td><td>شدة التيار، والزمن، وتغير كتلة المهبط.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما قيمة شحنة الإلكترون؟</td><td>‎1.60 × 10⁻¹⁹ C‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>في تجربة: تيار ‎0.50 A‎ مدة ‎3860 s‎ رسب ‎0.635 g Cu‎. احسب عدد الإلكترونات المارة.</td><td>‎Q = 1930 C‎؛ عدد الإلكترونات = ‎1930 ÷ 1.60 × 10⁻¹⁹ = 1.21 × 10²²‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أكمل التجربة السابقة لحساب ‎L‎.</td><td>مول ‎Cu = 0.0100‎، فمول ‎e⁻ = 0.0200‎؛ ‎L = 1.21 × 10²² ÷ 0.0200 = 6.0 × 10²³ mol⁻¹‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 97–98 وحل مسألة تحديد ‎L‎</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن ضخامة عدد أفوجادرو بأمثلة من الحياة</p>"]},{"axis":"الاستقصاء العملي 2-2: تحديد ثابت فارادي","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","حسابات التحليل الكهربائي"],["الحصة","4 من 5"],["محور الحصة","الاستقصاء العملي 2-2: تحديد ثابت فارادي"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 95–98 + كتاب التجارب ص 63"],["دليل المعلم","ص 117–121"],["كتاب التجارب العملية والأنشطة","نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]],"t":["1. ينفذ تجربة تحليل كهربائي لمحلول ‎CuSO₄‎ بأقطاب نحاس ويقيس تغير كتلة المهبط\n2. يحسب قيمة تجريبية لثابت فارادي ويقارنها بالقيمة المقبولة\nمخرج تعليمي آخر: يحدد مصادر الخطأ ويقترح تحسينات للتجربة","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: أقطاب نحاس، محلول ‎CuSO₄‎، مصدر تيار مستمر، أميتر، مقاومة متغيرة، ساعة إيقاف، ميزان حساس","تغير كتلة المهبط، ضبط التيار، القيمة التجريبية، النسبة المئوية للخطأ، مصادر الخطأ.","يعرض المعلم قطبي نحاس وميزانًا حساسًا ويسأل: «إذا وزنّا القطب قبل التحليل وبعده، كيف نصل إلى ثابت فارادي؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يطرح السؤال ويراجع خطوات العمل والسلامة\nالطالب: يكتبون خطة الحساب\n2) (22 دقيقة: من الدقيقة 4 إلى 26)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 2-2 (كتاب التجارب ص 63) بتيار ثابت مدة محددة\nالطالب: ينظفون ويزنون الأقطاب ويمررون التيار ويضبطونه ثم يجففون ويزنون\n3) (8 دقائق: من الدقيقة 26 إلى 34)\nالمعلم: يوجه حساب ‎F‎ والنسبة المئوية للخطأ\nالطالب: يحسبون ‎F‎ التجريبي ويقارنونه بـ 96500\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يناقش مصادر الخطأ ويدير التقويم الختامي\nالطالب: يقترحون تحسينات ويجيبون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا يُنظف المهبط ويُجفف قبل الوزن الأول؟\n   الإجابة النموذجية: لإزالة الأكاسيد والشوائب والماء التي تؤثر في دقة الكتلة.\n2) (المستوى المتوقع) السؤال: لماذا يجب ضبط التيار ثابتًا طوال التجربة؟\n   الإجابة النموذجية: لأن العلاقة ‎Q = It‎ تفترض تيارًا ثابتًا.\n3) (المستوى المتقدم) السؤال: اكتب علاقة حساب ‎F‎ من بيانات التجربة.\n   الإجابة النموذجية: ‎F = (I × t) ÷ (2 ×‎ مولات ‎Cu‎ المترسبة).","1) (مستوى الدعم) السؤال: ما مصدر الخطأ إذا سقط جزء من النحاس المترسب قبل الوزن؟\n   الإجابة النموذجية: تقل الكتلة المقيسة فتكون قيمة ‎F‎ المحسوبة أكبر من الحقيقية.\n2) (المستوى المتوقع) السؤال: احسب ‎F‎: تيار ‎0.40 A‎ مدة ‎2412 s‎ رسب ‎0.318 g Cu (63.5)‎.\n   الإجابة النموذجية: ‎Q = 964.8 C‎؛ مول ‎Cu = 0.00501‎؛ مول ‎e⁻ = 0.0100‎؛ ‎F ≈ 96300 C/mol‎.\n3) (المستوى المتقدم) السؤال: اقترح تحسينين لدقة التجربة.\n   الإجابة النموذجية: زيادة زمن التحليل لزيادة الكتلة المترسبة، واستخدام ميزان أدق، وغسل القطب بالماء ثم البروبانون وتجفيفه بلطف.","إرشاد للطالب: كتابة تقرير الاستقصاء 2-2 مع حساب النسبة المئوية للخطأ\nإرشاد لولي الأمر: التأكد من إكمال الابن حسابات التقرير وتقييم مصادر الخطأ"],"h":["<ol class=\"ol\"><li>ينفذ تجربة تحليل كهربائي لمحلول ‎CuSO₄‎ بأقطاب نحاس ويقيس تغير كتلة المهبط</li><li>يحسب قيمة تجريبية لثابت فارادي ويقارنها بالقيمة المقبولة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد مصادر الخطأ ويقترح تحسينات للتجربة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>ينفذ تجربة تحليل كهربائي لمحلول ‎CuSO₄‎ بأقطاب نحاس ويقيس تغير كتلة المهبط</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب قيمة تجريبية لثابت فارادي ويقارنها بالقيمة المقبولة</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد مصادر الخطأ ويقترح تحسينات للتجربة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: أقطاب نحاس، محلول ‎CuSO₄‎، مصدر تيار مستمر، أميتر، مقاومة متغيرة، ساعة إيقاف، ميزان حساس</span></div>","<p>تغير كتلة المهبط، ضبط التيار، القيمة التجريبية، النسبة المئوية للخطأ، مصادر الخطأ.</p>","<p>يعرض المعلم قطبي نحاس وميزانًا حساسًا ويسأل: «إذا وزنّا القطب قبل التحليل وبعده، كيف نصل إلى ثابت فارادي؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يطرح السؤال ويراجع خطوات العمل والسلامة</td><td>يكتبون خطة الحساب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–26</span><br><small>22 دقيقة</small></td><td>يوجه تنفيذ الاستقصاء العملي 2-2 (كتاب التجارب ص 63) بتيار ثابت مدة محددة</td><td>ينظفون ويزنون الأقطاب ويمررون التيار ويضبطونه ثم يجففون ويزنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">26–34</span><br><small>8 دقائق</small></td><td>يوجه حساب ‎F‎ والنسبة المئوية للخطأ</td><td>يحسبون ‎F‎ التجريبي ويقارنونه بـ 96500</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">34–40</span><br><small>6 دقائق</small></td><td>يناقش مصادر الخطأ ويدير التقويم الختامي</td><td>يقترحون تحسينات ويجيبون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يُنظف المهبط ويُجفف قبل الوزن الأول؟</td><td>لإزالة الأكاسيد والشوائب والماء التي تؤثر في دقة الكتلة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يجب ضبط التيار ثابتًا طوال التجربة؟</td><td>لأن العلاقة ‎Q = It‎ تفترض تيارًا ثابتًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب علاقة حساب ‎F‎ من بيانات التجربة.</td><td>‎F = (I × t) ÷ (2 ×‎ مولات ‎Cu‎ المترسبة).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما مصدر الخطأ إذا سقط جزء من النحاس المترسب قبل الوزن؟</td><td>تقل الكتلة المقيسة فتكون قيمة ‎F‎ المحسوبة أكبر من الحقيقية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎F‎: تيار ‎0.40 A‎ مدة ‎2412 s‎ رسب ‎0.318 g Cu (63.5)‎.</td><td>‎Q = 964.8 C‎؛ مول ‎Cu = 0.00501‎؛ مول ‎e⁻ = 0.0100‎؛ ‎F ≈ 96300 C/mol‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح تحسينين لدقة التجربة.</td><td>زيادة زمن التحليل لزيادة الكتلة المترسبة، واستخدام ميزان أدق، وغسل القطب بالماء ثم البروبانون وتجفيفه بلطف.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 2-2 مع حساب النسبة المئوية للخطأ</p><p><b>إرشاد لولي الأمر:</b> التأكد من إكمال الابن حسابات التقرير وتقييم مصادر الخطأ</p>"]},{"axis":"مراجعة الوحدة الثانية وأسئلة نهاية الوحدة ونشاط 2-6","n":5,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","حسابات التحليل الكهربائي"],["الحصة","5 من 5"],["محور الحصة","مراجعة الوحدة الثانية وأسئلة نهاية الوحدة ونشاط 2-6"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 101–110 + كتاب التجارب ص 57"],["دليل المعلم","ص 117–121"],["كتاب التجارب العملية والأنشطة","نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]],"t":["1. يحل نشاط 2-6 «حسابات التحليل الكهربائي»\n2. يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","الخلية الجلفانية مقابل الخلية الإلكتروليتية، ‎E°cell‎، نيرنست، نواتج التحليل، ‎Q = It‎، ملخص الوحدة.","يعرض المعلم جدولًا فارغًا للمقارنة بين الخلية الجلفانية والخلية الإلكتروليتية ويطلب ملأه في دقيقتين.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الجدول ويستقبل الإجابات\nالطالب: يقارنون تحول الطاقة وإشارة الأقطاب وتلقائية التفاعل\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يوجه حل نشاط 2-6 (كتاب التجارب ص 57)\nالطالب: يحلون فرديًا ثم يقارنون\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوزع أسئلة نهاية الوحدة (ص 102–110) على المجموعات\nالطالب: يحلون ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الفرق في تحول الطاقة بين الخلية الجلفانية والإلكتروليتية؟\n   الإجابة النموذجية: الجلفانية تحول الطاقة الكيميائية إلى كهربائية، والإلكتروليتية تحول الكهربائية إلى كيميائية.\n2) (المستوى المتوقع) السؤال: ما إشارة المصعد في الخلية الإلكتروليتية؟\n   الإجابة النموذجية: موجب.\n3) (المستوى المتقدم) السؤال: كم مولًا من ‎Al‎ يترسب بمرور ‎0.30 mol‎ إلكترونات ‎(Al³⁺)‎؟\n   الإجابة النموذجية: ‎0.10 mol‎.","1) (مستوى الدعم) السؤال: هل التفاعل في الخلية الإلكتروليتية تلقائي؟\n   الإجابة النموذجية: لا، يحتاج إلى مصدر طاقة كهربائية خارجي.\n2) (المستوى المتوقع) السؤال: احسب كتلة ‎Al (27)‎ المترسبة بتيار ‎10 A‎ مدة ‎965 s‎.\n   الإجابة النموذجية: ‎Q = 9650 C‎؛ مول ‎e⁻ = 0.10‎؛ مول ‎Al = 0.0333‎؛ الكتلة = ‎0.90 g‎.\n3) (المستوى المتقدم) السؤال: لماذا يكون المصعد سالبًا في الخلية الجلفانية وموجبًا في الإلكتروليتية؟\n   الإجابة النموذجية: في الجلفانية تتولد الإلكترونات بالأكسدة عند المصعد فيصبح سالبًا، وفي الإلكتروليتية يسحب المصدر الخارجي الإلكترونات من المصعد فيصبح موجبًا؛ وفي الحالتين تحدث الأكسدة عند المصعد.","إرشاد للطالب: مراجعة ملخص الوحدة ص 101 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الثانية"],"h":["<ol class=\"ol\"><li>يحل نشاط 2-6 «حسابات التحليل الكهربائي»</li><li>يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 2-6 «حسابات التحليل الكهربائي»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الخلية الجلفانية مقابل الخلية الإلكتروليتية، ‎E°cell‎، نيرنست، نواتج التحليل، ‎Q = It‎، ملخص الوحدة.</p>","<p>يعرض المعلم جدولًا فارغًا للمقارنة بين الخلية الجلفانية والخلية الإلكتروليتية ويطلب ملأه في دقيقتين.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الجدول ويستقبل الإجابات</td><td>يقارنون تحول الطاقة وإشارة الأقطاب وتلقائية التفاعل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يوجه حل نشاط 2-6 (كتاب التجارب ص 57)</td><td>يحلون فرديًا ثم يقارنون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يوزع أسئلة نهاية الوحدة (ص 102–110) على المجموعات</td><td>يحلون ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الفرق في تحول الطاقة بين الخلية الجلفانية والإلكتروليتية؟</td><td>الجلفانية تحول الطاقة الكيميائية إلى كهربائية، والإلكتروليتية تحول الكهربائية إلى كيميائية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما إشارة المصعد في الخلية الإلكتروليتية؟</td><td>موجب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم مولًا من ‎Al‎ يترسب بمرور ‎0.30 mol‎ إلكترونات ‎(Al³⁺)‎؟</td><td>‎0.10 mol‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل التفاعل في الخلية الإلكتروليتية تلقائي؟</td><td>لا، يحتاج إلى مصدر طاقة كهربائية خارجي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب كتلة ‎Al (27)‎ المترسبة بتيار ‎10 A‎ مدة ‎965 s‎.</td><td>‎Q = 9650 C‎؛ مول ‎e⁻ = 0.10‎؛ مول ‎Al = 0.0333‎؛ الكتلة = ‎0.90 g‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون المصعد سالبًا في الخلية الجلفانية وموجبًا في الإلكتروليتية؟</td><td>في الجلفانية تتولد الإلكترونات بالأكسدة عند المصعد فيصبح سالبًا، وفي الإلكتروليتية يسحب المصدر الخارجي الإلكترونات من المصعد فيصبح موجبًا؛ وفي الحالتين تحدث الأكسدة عند المصعد.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ملخص الوحدة ص 101 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الثانية</p>"]}]},{"title":"طاقة الشبكة البلورية ‎(ΔH°latt)‎","sb":"ص 112","unit":"الوحدة 3: طاقة الشبكة البلورية","periods":[{"axis":"تعريف طاقة الشبكة البلورية وإشارتها","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","طاقة الشبكة البلورية ‎(ΔH°latt)‎"],["الحصة","1 من 2"],["محور الحصة","تعريف طاقة الشبكة البلورية وإشارتها"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 112"],["دليل المعلم","ص 145–147"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية\n2. يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة\nمخرج تعليمي آخر: يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا","المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: نموذج بلورة ‎NaCl‎","طاقة الشبكة البلورية ‎ΔH°latt‎، المركب الأيوني، الأيونات الغازية، طاردة للحرارة، قوى الجذب الكهروستاتيكية، الظروف القياسية.","يعرض المعلم نموذج بلورة ‎NaCl‎ ويسأل: «لماذا ينصهر ملح الطعام عند ‎801 °C‎ بينما ينصهر الشمع عند نحو ‎60 °C‎؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض النموذج ويطرح السؤال ومهام بداية الوحدة\nالطالب: يربطون درجة الانصهار بقوة الجذب بين الأيونات\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح تعريف طاقة الشبكة البلورية وإشارتها وكتابة معادلتها ‎(Na⁺(g) + Cl⁻(g) → NaCl(s))‎\nالطالب: يكتبون التعريف والمعادلة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مركبات (‎MgO‎، ‎CaCl₂‎، ‎K₂O‎) لكتابة معادلات طاقة شبكتها مع رموز الحالة\nالطالب: يكتبون المعادلات في أزواج ويصححون رموز الحالة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي ويوجه حل السؤال 1\nالطالب: يجيبون ويحلون السؤال\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف طاقة الشبكة البلورية.\n   الإجابة النموذجية: التغير في المحتوى الحراري عند تكوين مول واحد من مركب أيوني صلب من أيوناته الغازية في الظروف القياسية.\n2) (المستوى المتوقع) السؤال: اكتب معادلة طاقة الشبكة البلورية لـ ‎MgO‎.\n   الإجابة النموذجية: ‎Mg²⁺(g) + O²⁻(g) → MgO(s)‎\n3) (المستوى المتقدم) السؤال: لماذا تكون ‎ΔH°latt‎ سالبة دائمًا؟\n   الإجابة النموذجية: لأن تكوين الروابط الأيونية بين الأيونات المتجاذبة يطلق طاقة.","1) (مستوى الدعم) السؤال: ما الحالة الفيزيائية للأيونات في معادلة طاقة الشبكة؟\n   الإجابة النموذجية: غازية.\n2) (المستوى المتوقع) السؤال: اكتب معادلة طاقة الشبكة البلورية لـ ‎CaCl₂‎.\n   الإجابة النموذجية: ‎Ca²⁺(g) + 2Cl⁻(g) → CaCl₂(s)‎\n3) (المستوى المتقدم) السؤال: لماذا لا يمكن قياس طاقة الشبكة البلورية مباشرة بالتجربة؟\n   الإجابة النموذجية: لأنه لا يمكن عمليًا الحصول على أيونات غازية منفصلة وجعلها تتحد مباشرة لتكوين مول من المركب الصلب.","إرشاد للطالب: مراجعة ص 112 وكتابة معادلات طاقة الشبكة لخمسة مركبات\nإرشاد لولي الأمر: الحديث مع الابن عن سبب صلابة المركبات الأيونية وارتفاع درجات انصهارها"],"h":["<ol class=\"ol\"><li>يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية</li><li>يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: نموذج بلورة ‎NaCl‎</span></div>","<p>طاقة الشبكة البلورية ‎ΔH°latt‎، المركب الأيوني، الأيونات الغازية، طاردة للحرارة، قوى الجذب الكهروستاتيكية، الظروف القياسية.</p>","<p>يعرض المعلم نموذج بلورة ‎NaCl‎ ويسأل: «لماذا ينصهر ملح الطعام عند ‎801 °C‎ بينما ينصهر الشمع عند نحو ‎60 °C‎؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض النموذج ويطرح السؤال ومهام بداية الوحدة</td><td>يربطون درجة الانصهار بقوة الجذب بين الأيونات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح تعريف طاقة الشبكة البلورية وإشارتها وكتابة معادلتها ‎(Na⁺(g) + Cl⁻(g) → NaCl(s))‎</td><td>يكتبون التعريف والمعادلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مركبات (‎MgO‎، ‎CaCl₂‎، ‎K₂O‎) لكتابة معادلات طاقة شبكتها مع رموز الحالة</td><td>يكتبون المعادلات في أزواج ويصححون رموز الحالة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي ويوجه حل السؤال 1</td><td>يجيبون ويحلون السؤال</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف طاقة الشبكة البلورية.</td><td>التغير في المحتوى الحراري عند تكوين مول واحد من مركب أيوني صلب من أيوناته الغازية في الظروف القياسية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة طاقة الشبكة البلورية لـ ‎MgO‎.</td><td>‎Mg²⁺(g) + O²⁻(g) → MgO(s)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تكون ‎ΔH°latt‎ سالبة دائمًا؟</td><td>لأن تكوين الروابط الأيونية بين الأيونات المتجاذبة يطلق طاقة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الحالة الفيزيائية للأيونات في معادلة طاقة الشبكة؟</td><td>غازية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة طاقة الشبكة البلورية لـ ‎CaCl₂‎.</td><td>‎Ca²⁺(g) + 2Cl⁻(g) → CaCl₂(s)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يمكن قياس طاقة الشبكة البلورية مباشرة بالتجربة؟</td><td>لأنه لا يمكن عمليًا الحصول على أيونات غازية منفصلة وجعلها تتحد مباشرة لتكوين مول من المركب الصلب.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 112 وكتابة معادلات طاقة الشبكة لخمسة مركبات</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن سبب صلابة المركبات الأيونية وارتفاع درجات انصهارها</p>"]},{"axis":"أثر نصف القطر الأيوني والشحنة الأيونية على طاقة الشبكة","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","طاقة الشبكة البلورية ‎(ΔH°latt)‎"],["الحصة","2 من 2"],["محور الحصة","أثر نصف القطر الأيوني والشحنة الأيونية على طاقة الشبكة"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 112"],["دليل المعلم","ص 145–147"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية\n2. يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها\nمخرج تعليمي آخر: يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- أخرى: جدول أنصاف أقطار الأيونات وطاقات الشبكة","نصف القطر الأيوني، الشحنة الأيونية، كثافة الشحنة، قوة الجذب الكهروستاتيكي، نمط طاقة الشبكة لهاليدات الصوديوم.","يعرض المعلم قيمتي طاقة الشبكة: ‎NaCl = −787 kJ/mol‎ و‎MgO ≈ −3800 kJ/mol‎ ويسأل: «لماذا تقترب طاقة ‎MgO‎ من خمسة أضعاف طاقة ‎NaCl‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض القيمتين ويطرح السؤال\nالطالب: يقترحون أثر الشحنة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «ما الذي يحدد قيمة طاقة الشبكة البلورية؟» بالشكلين 3-6 و3-7 ونمط هاليدات الصوديوم\nالطالب: يفسرون نمط ‎NaF > NaCl > NaBr > NaI‎ من حيث المقدار\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوزع مجموعات مركبات للترتيب حسب مقدار طاقة الشبكة\nالطالب: يرتبون ويبررون بالحجم والشحنة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف تؤثر زيادة نصف قطر الأنيون على طاقة الشبكة؟\n   الإجابة النموذجية: يقل مقدارها (تصبح أقل سالبية) لأن المسافة بين مركزي الأيونين تزداد فيضعف الجذب.\n2) (المستوى المتوقع) السؤال: لماذا طاقة شبكة ‎MgO‎ أكبر مقدارًا من ‎NaF‎؟\n   الإجابة النموذجية: لأن شحنتي أيوني ‎MgO (+2‎، −2) أكبر فيكون الجذب أقوى كثيرًا.\n3) (المستوى المتقدم) السؤال: رتب حسب مقدار طاقة الشبكة: ‎NaCl‎، ‎NaI‎، ‎NaF‎.\n   الإجابة النموذجية: ‎NaF > NaCl > NaI‎.","1) (مستوى الدعم) السؤال: ما العاملان المؤثران في مقدار طاقة الشبكة؟\n   الإجابة النموذجية: نصف القطر الأيوني والشحنة الأيونية.\n2) (المستوى المتوقع) السؤال: أيهما أعلى درجة انصهار: ‎KCl‎ أم ‎CaO‎؟ فسّر.\n   الإجابة النموذجية: ‎CaO‎، لأن طاقة شبكته أكبر مقدارًا لشحنتي أيونيه الأكبر.\n3) (المستوى المتقدم) السؤال: رتب تنازليًا حسب مقدار طاقة الشبكة: ‎MgO‎، ‎NaCl‎، ‎KBr‎، ‎MgCl₂‎.\n   الإجابة النموذجية: ‎MgO > MgCl₂ > NaCl > KBr‎.","إرشاد للطالب: مراجعة ص 112 وترتيب مجموعتين من المركبات حسب طاقة الشبكة\nإرشاد لولي الأمر: سؤال الابن عن العاملين المؤثرين في طاقة الشبكة بمثال"],"h":["<ol class=\"ol\"><li>يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية</li><li>يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: جدول أنصاف أقطار الأيونات وطاقات الشبكة</span></div>","<p>نصف القطر الأيوني، الشحنة الأيونية، كثافة الشحنة، قوة الجذب الكهروستاتيكي، نمط طاقة الشبكة لهاليدات الصوديوم.</p>","<p>يعرض المعلم قيمتي طاقة الشبكة: ‎NaCl = −787 kJ/mol‎ و‎MgO ≈ −3800 kJ/mol‎ ويسأل: «لماذا تقترب طاقة ‎MgO‎ من خمسة أضعاف طاقة ‎NaCl‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض القيمتين ويطرح السؤال</td><td>يقترحون أثر الشحنة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «ما الذي يحدد قيمة طاقة الشبكة البلورية؟» بالشكلين 3-6 و3-7 ونمط هاليدات الصوديوم</td><td>يفسرون نمط ‎NaF &gt; NaCl &gt; NaBr &gt; NaI‎ من حيث المقدار</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوزع مجموعات مركبات للترتيب حسب مقدار طاقة الشبكة</td><td>يرتبون ويبررون بالحجم والشحنة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تؤثر زيادة نصف قطر الأنيون على طاقة الشبكة؟</td><td>يقل مقدارها (تصبح أقل سالبية) لأن المسافة بين مركزي الأيونين تزداد فيضعف الجذب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا طاقة شبكة ‎MgO‎ أكبر مقدارًا من ‎NaF‎؟</td><td>لأن شحنتي أيوني ‎MgO (+2‎، −2) أكبر فيكون الجذب أقوى كثيرًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>رتب حسب مقدار طاقة الشبكة: ‎NaCl‎، ‎NaI‎، ‎NaF‎.</td><td>‎NaF &gt; NaCl &gt; NaI‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما العاملان المؤثران في مقدار طاقة الشبكة؟</td><td>نصف القطر الأيوني والشحنة الأيونية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أيهما أعلى درجة انصهار: ‎KCl‎ أم ‎CaO‎؟ فسّر.</td><td>‎CaO‎، لأن طاقة شبكته أكبر مقدارًا لشحنتي أيونيه الأكبر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>رتب تنازليًا حسب مقدار طاقة الشبكة: ‎MgO‎، ‎NaCl‎، ‎KBr‎، ‎MgCl₂‎.</td><td>‎MgO &gt; MgCl₂ &gt; NaCl &gt; KBr‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 112 وترتيب مجموعتين من المركبات حسب طاقة الشبكة</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن العاملين المؤثرين في طاقة الشبكة بمثال</p>"]}]},{"title":"التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية","sb":"ص 113–115","unit":"الوحدة 3: طاقة الشبكة البلورية","periods":[{"axis":"التغير في المحتوى الحراري للتذرير ‎ΔH°at‎","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية"],["الحصة","1 من 3"],["محور الحصة","التغير في المحتوى الحراري للتذرير ‎ΔH°at‎"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 113"],["دليل المعلم","ص 147–151"],["كتاب التجارب العملية والأنشطة","نشاط 3-3: التغيرات في المحتوى الحراري وطاقة الشبكة البلورية ص 79"]],"t":["1. يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه\n2. يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية\nمخرج تعليمي آخر: يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا","المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎ΔH°at‎","التذرير (التفكك)، ‎ΔH°at‎، مول من الذرات الغازية، الحالة القياسية للعنصر، طاقة الرابطة.","يسأل المعلم: «لتحويل ملعقة صوديوم صلب إلى ذرات منفردة في الحالة الغازية، هل نحتاج إلى طاقة أم نحصل عليها؟ ولماذا يحتاج الليثيوم طاقة أكبر من الصوديوم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يتوقعون أن العملية تحتاج طاقة لكسر الروابط الفلزية\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ نشاط «التغير في المحتوى الحراري للتذرير» ويكتب معادلات ‎Na(s) → Na(g)‎ و½‎Cl₂(g) → Cl(g)‎\nالطالب: يكتبون معادلات التذرير ويلاحظون معامل ½ للعناصر ثنائية الذرة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم عناصر متنوعة لكتابة معادلات تذريرها ومقارنة القيم (‎Li‎ و‎Na‎)\nالطالب: يكتبون ويفسرون الفرق بقوة الرابطة الفلزية\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف ‎ΔH°at‎.\n   الإجابة النموذجية: التغير في المحتوى الحراري عند تكوين مول واحد من الذرات الغازية من العنصر في حالته القياسية.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تذرير الكلور.\n   الإجابة النموذجية: ½‎Cl₂(g) → Cl(g)‎\n3) (المستوى المتقدم) السؤال: لماذا ‎ΔH°at‎ لليثيوم أكبر من الصوديوم؟\n   الإجابة النموذجية: لأن ذرات الليثيوم أصغر فتكون الرابطة الفلزية أقوى وتحتاج طاقة أكبر لكسرها.","1) (مستوى الدعم) السؤال: هل التذرير ماص أم طارد للحرارة؟\n   الإجابة النموذجية: ماص للحرارة دائمًا.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تذرير المغنيسيوم.\n   الإجابة النموذجية: ‎Mg(s) → Mg(g)‎\n3) (المستوى المتقدم) السؤال: ما العلاقة بين ‎ΔH°at‎ للكلور وطاقة الرابطة ‎Cl–Cl‎؟\n   الإجابة النموذجية: ‎ΔH°at‎ للكلور تساوي نصف طاقة الرابطة ‎Cl–Cl‎ لأن المعادلة تكوّن مولًا واحدًا من الذرات.","إرشاد للطالب: مراجعة ص 113 وكتابة معادلات تذرير ستة عناصر\nإرشاد لولي الأمر: متابعة الابن في كتابة رموز الحالة بدقة"],"h":["<ol class=\"ol\"><li>يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه</li><li>يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: جدول قيم ‎ΔH°at‎</span></div>","<p>التذرير (التفكك)، ‎ΔH°at‎، مول من الذرات الغازية، الحالة القياسية للعنصر، طاقة الرابطة.</p>","<p>يسأل المعلم: «لتحويل ملعقة صوديوم صلب إلى ذرات منفردة في الحالة الغازية، هل نحتاج إلى طاقة أم نحصل عليها؟ ولماذا يحتاج الليثيوم طاقة أكبر من الصوديوم؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يتوقعون أن العملية تحتاج طاقة لكسر الروابط الفلزية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ نشاط «التغير في المحتوى الحراري للتذرير» ويكتب معادلات ‎Na(s) → Na(g)‎ و½‎Cl₂(g) → Cl(g)‎</td><td>يكتبون معادلات التذرير ويلاحظون معامل ½ للعناصر ثنائية الذرة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم عناصر متنوعة لكتابة معادلات تذريرها ومقارنة القيم (‎Li‎ و‎Na‎)</td><td>يكتبون ويفسرون الفرق بقوة الرابطة الفلزية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف ‎ΔH°at‎.</td><td>التغير في المحتوى الحراري عند تكوين مول واحد من الذرات الغازية من العنصر في حالته القياسية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تذرير الكلور.</td><td>½‎Cl₂(g) → Cl(g)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا ‎ΔH°at‎ لليثيوم أكبر من الصوديوم؟</td><td>لأن ذرات الليثيوم أصغر فتكون الرابطة الفلزية أقوى وتحتاج طاقة أكبر لكسرها.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل التذرير ماص أم طارد للحرارة؟</td><td>ماص للحرارة دائمًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تذرير المغنيسيوم.</td><td>‎Mg(s) → Mg(g)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما العلاقة بين ‎ΔH°at‎ للكلور وطاقة الرابطة ‎Cl–Cl‎؟</td><td>‎ΔH°at‎ للكلور تساوي نصف طاقة الرابطة ‎Cl–Cl‎ لأن المعادلة تكوّن مولًا واحدًا من الذرات.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 113 وكتابة معادلات تذرير ستة عناصر</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة رموز الحالة بدقة</p>"]},{"axis":"الألفة الإلكترونية الأولى والثانية ومعادلاتها","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية"],["الحصة","2 من 3"],["محور الحصة","الألفة الإلكترونية الأولى والثانية ومعادلاتها"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 113–115"],["دليل المعلم","ص 147–151"],["كتاب التجارب العملية والأنشطة","نشاط 3-3: التغيرات في المحتوى الحراري وطاقة الشبكة البلورية ص 79"]],"t":["1. يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها\n2. يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة\nمخرج تعليمي آخر: يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم الألفة الإلكترونية","الألفة الإلكترونية الأولى ‎EA1‎، الألفة الإلكترونية الثانية ‎EA2‎، الأيون السالب الغازي، الطرد بين الإلكترون والأيون السالب.","يسأل المعلم: «ذرة الكلور تطلق طاقة عندما تكسب إلكترونًا؛ فهل يطلق أيون ‎O⁻‎ طاقة أيضًا عندما يكسب إلكترونًا ثانيًا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يتوقعون ويناقشون أثر الشحنة السالبة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: ينفذ نشاط «الألفة الإلكترونية»: تعريف ‎EA1‎ و‎EA2‎ ومعادلاتهما وقيم للكلور والأكسجين\nالطالب: يكتبون المعادلات ويحددون إشارة كل قيمة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم مسائل لحساب ‎ΔH‎ لتكوين ‎O²⁻(g)‎ و‎S²⁻(g)‎ من الذرات\nالطالب: يحسبون ‎EA1 + EA2‎ في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف الألفة الإلكترونية الأولى.\n   الإجابة النموذجية: التغير في المحتوى الحراري عند إضافة مول من الإلكترونات إلى مول من الذرات الغازية لتكوين مول من الأيونات الغازية أحادية الشحنة السالبة.\n2) (المستوى المتوقع) السؤال: اكتب معادلة ‎EA1‎ للكلور.\n   الإجابة النموذجية: ‎Cl(g) + e⁻ → Cl⁻(g)‎\n3) (المستوى المتقدم) السؤال: لماذا تكون ‎EA2‎ للأكسجين موجبة؟\n   الإجابة النموذجية: لأن الإلكترون المضاف يتنافر مع الأيون السالب ‎O⁻‎ فيحتاج إلى طاقة للتغلب على هذا التنافر.","1) (مستوى الدعم) السؤال: اكتب معادلة ‎EA2‎ للأكسجين.\n   الإجابة النموذجية: ‎O⁻(g) + e⁻ → O²⁻(g)‎\n2) (المستوى المتوقع) السؤال: هل ‎EA1‎ للكلور طاردة أم ماصة للحرارة؟\n   الإجابة النموذجية: طاردة للحرارة (سالبة).\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH‎ لـ ‎O(g) + 2e⁻ → O²⁻(g)‎ إذا كانت ‎EA1 = −141‎ و‎EA2 = +798 kJ/mol‎.\n   الإجابة النموذجية: ‎ΔH = −141 + 798 = +657 kJ/mol‎.","إرشاد للطالب: مراجعة ص 113–115 وكتابة معادلات ‎EA1‎ و‎EA2‎\nإرشاد لولي الأمر: سؤال الابن عن سبب كون ‎EA2‎ موجبة بأسلوبه"],"h":["<ol class=\"ol\"><li>يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها</li><li>يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: جدول قيم الألفة الإلكترونية</span></div>","<p>الألفة الإلكترونية الأولى ‎EA1‎، الألفة الإلكترونية الثانية ‎EA2‎، الأيون السالب الغازي، الطرد بين الإلكترون والأيون السالب.</p>","<p>يسأل المعلم: «ذرة الكلور تطلق طاقة عندما تكسب إلكترونًا؛ فهل يطلق أيون ‎O⁻‎ طاقة أيضًا عندما يكسب إلكترونًا ثانيًا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يتوقعون ويناقشون أثر الشحنة السالبة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>ينفذ نشاط «الألفة الإلكترونية»: تعريف ‎EA1‎ و‎EA2‎ ومعادلاتهما وقيم للكلور والأكسجين</td><td>يكتبون المعادلات ويحددون إشارة كل قيمة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم مسائل لحساب ‎ΔH‎ لتكوين ‎O²⁻(g)‎ و‎S²⁻(g)‎ من الذرات</td><td>يحسبون ‎EA1 + EA2‎ في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف الألفة الإلكترونية الأولى.</td><td>التغير في المحتوى الحراري عند إضافة مول من الإلكترونات إلى مول من الذرات الغازية لتكوين مول من الأيونات الغازية أحادية الشحنة السالبة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة ‎EA1‎ للكلور.</td><td>‎Cl(g) + e⁻ → Cl⁻(g)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تكون ‎EA2‎ للأكسجين موجبة؟</td><td>لأن الإلكترون المضاف يتنافر مع الأيون السالب ‎O⁻‎ فيحتاج إلى طاقة للتغلب على هذا التنافر.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة ‎EA2‎ للأكسجين.</td><td>‎O⁻(g) + e⁻ → O²⁻(g)‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>هل ‎EA1‎ للكلور طاردة أم ماصة للحرارة؟</td><td>طاردة للحرارة (سالبة).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎ΔH‎ لـ ‎O(g) + 2e⁻ → O²⁻(g)‎ إذا كانت ‎EA1 = −141‎ و‎EA2 = +798 kJ/mol‎.</td><td>‎ΔH = −141 + 798 = +657 kJ/mol‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 113–115 وكتابة معادلات ‎EA1‎ و‎EA2‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن سبب كون ‎EA2‎ موجبة بأسلوبه</p>"]},{"axis":"نمط التدرج في الألفة الإلكترونية للمجموعتين 16 و17","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية"],["الحصة","3 من 3"],["محور الحصة","نمط التدرج في الألفة الإلكترونية للمجموعتين 16 و17"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 115 + كتاب التجارب ص 79"],["دليل المعلم","ص 147–151"],["كتاب التجارب العملية والأنشطة","نشاط 3-3: التغيرات في المحتوى الحراري وطاقة الشبكة البلورية ص 79"]],"t":["1. يصف ويشرح نمط التدرج في قيم الألفة الإلكترونية الأولى لعناصر المجموعتين 16 و17\n2. يشرح العوامل المؤثرة في الألفة الإلكترونية: الشحنة النووية، ونصف القطر، والحجب\nمخرج تعليمي آخر: يفسر شذوذ الفلور (‎EA1‎ أقل سالبية من الكلور)","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎EA1‎، كتاب التجارب العملية والأنشطة","نمط التدرج في الألفة الإلكترونية، الشحنة النووية الفعالة، نصف القطر الذري، الحجب، شذوذ الفلور، المجموعتان 16 و17.","يعرض المعلم قيم ‎EA1: F = −328‎، ‎Cl = −349‎، ‎Br = −325‎، ‎I = −295 kJ/mol‎ ويسأل: «لماذا لا يمتلك الفلور أكثر القيم سالبية كما نتوقع؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض القيم ويطرح السؤال\nالطالب: يلاحظون الشذوذ ويقترحون تفسيرًا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح العوامل المؤثرة ونمط التناقص من ‎Cl‎ إلى ‎I‎ وشذوذ الفلور (صغر الحجم والتنافر الإلكتروني)\nالطالب: يكتبون تفسيرًا لكل جزء من النمط\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 3-3 (كتاب التجارب ص 79) والسؤالين 2 و3\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التذرير والألفة\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف تتغير ‎EA1‎ من الكلور إلى اليود؟\n   الإجابة النموذجية: تصبح أقل سالبية (أقل طردًا للحرارة).\n2) (المستوى المتوقع) السؤال: لماذا تصبح ‎EA1‎ أقل سالبية من ‎Cl‎ إلى ‎I‎؟\n   الإجابة النموذجية: لأن نصف القطر والحجب يزدادان فيضعف جذب النواة للإلكترون المضاف.\n3) (المستوى المتقدم) السؤال: لماذا ‎EA1‎ للفلور أقل سالبية من الكلور؟\n   الإجابة النموذجية: لصغر حجم ذرة الفلور، فيعاني الإلكترون المضاف تنافرًا قويًا مع الإلكترونات الموجودة في الغلاف الصغير.","1) (مستوى الدعم) السؤال: أي هالوجين له ‎EA1‎ الأكثر سالبية؟\n   الإجابة النموذجية: الكلور.\n2) (المستوى المتوقع) السؤال: لماذا ‎EA1‎ للمجموعة 17 أكثر سالبية من المجموعة 16 في الدورة نفسها؟\n   الإجابة النموذجية: لأن الشحنة النووية أكبر ونصف القطر أصغر في المجموعة 17 فيكون جذب الإلكترون المضاف أقوى.\n3) (المستوى المتقدم) السؤال: عند التعليق على قيمتين سالبتين للألفة، كيف تصوغ المقارنة بدقة؟\n   الإجابة النموذجية: تذكر أن إحداهما «أكثر طردًا للحرارة» أو «أكثر سالبية» من الأخرى، لا أنها «أكبر» أو «أصغر» فقط.","إرشاد للطالب: إكمال نشاط 3-3 ص 79 والسؤالين 2 و3\nإرشاد لولي الأمر: تشجيع الابن على استخدام عبارة «أكثر طردًا للحرارة» في المقارنات"],"h":["<ol class=\"ol\"><li>يصف ويشرح نمط التدرج في قيم الألفة الإلكترونية الأولى لعناصر المجموعتين 16 و17</li><li>يشرح العوامل المؤثرة في الألفة الإلكترونية: الشحنة النووية، ونصف القطر، والحجب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر شذوذ الفلور (‎EA1‎ أقل سالبية من الكلور)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف ويشرح نمط التدرج في قيم الألفة الإلكترونية الأولى لعناصر المجموعتين 16 و17</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح العوامل المؤثرة في الألفة الإلكترونية: الشحنة النووية، ونصف القطر، والحجب</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر شذوذ الفلور (‎EA1‎ أقل سالبية من الكلور)</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: جدول قيم ‎EA1‎، كتاب التجارب العملية والأنشطة</span></div>","<p>نمط التدرج في الألفة الإلكترونية، الشحنة النووية الفعالة، نصف القطر الذري، الحجب، شذوذ الفلور، المجموعتان 16 و17.</p>","<p>يعرض المعلم قيم ‎EA1: F = −328‎، ‎Cl = −349‎، ‎Br = −325‎، ‎I = −295 kJ/mol‎ ويسأل: «لماذا لا يمتلك الفلور أكثر القيم سالبية كما نتوقع؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض القيم ويطرح السؤال</td><td>يلاحظون الشذوذ ويقترحون تفسيرًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح العوامل المؤثرة ونمط التناقص من ‎Cl‎ إلى ‎I‎ وشذوذ الفلور (صغر الحجم والتنافر الإلكتروني)</td><td>يكتبون تفسيرًا لكل جزء من النمط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 3-3 (كتاب التجارب ص 79) والسؤالين 2 و3</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على التذرير والألفة</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تتغير ‎EA1‎ من الكلور إلى اليود؟</td><td>تصبح أقل سالبية (أقل طردًا للحرارة).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تصبح ‎EA1‎ أقل سالبية من ‎Cl‎ إلى ‎I‎؟</td><td>لأن نصف القطر والحجب يزدادان فيضعف جذب النواة للإلكترون المضاف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا ‎EA1‎ للفلور أقل سالبية من الكلور؟</td><td>لصغر حجم ذرة الفلور، فيعاني الإلكترون المضاف تنافرًا قويًا مع الإلكترونات الموجودة في الغلاف الصغير.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أي هالوجين له ‎EA1‎ الأكثر سالبية؟</td><td>الكلور.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا ‎EA1‎ للمجموعة 17 أكثر سالبية من المجموعة 16 في الدورة نفسها؟</td><td>لأن الشحنة النووية أكبر ونصف القطر أصغر في المجموعة 17 فيكون جذب الإلكترون المضاف أقوى.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>عند التعليق على قيمتين سالبتين للألفة، كيف تصوغ المقارنة بدقة؟</td><td>تذكر أن إحداهما «أكثر طردًا للحرارة» أو «أكثر سالبية» من الأخرى، لا أنها «أكبر» أو «أصغر» فقط.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 3-3 ص 79 والسؤالين 2 و3</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على استخدام عبارة «أكثر طردًا للحرارة» في المقارنات</p>"]}]},{"title":"حلقة (دورة) بورن-هابر","sb":"ص 116–121","unit":"الوحدة 3: طاقة الشبكة البلورية","periods":[{"axis":"حلقة الطاقة البسيطة وقانون هس","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: طاقة الشبكة البلورية"],["الدرس","حلقة (دورة) بورن-هابر"],["الحصة","1 من 6"],["محور الحصة","حلقة الطاقة البسيطة وقانون هس"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 116–117"],["دليل المعلم","ص 151–156"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: حلقات بورن-هابر ص 76"]],"t":["1. يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية\n2. يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎\nمخرج تعليمي آخر: يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية","حلقة الطاقة، قانون هس، ‎ΔH°f‎، ‎ΔH1 (‎مجموع خطوات تكوين الأيونات الغازية)، المسار المباشر وغير المباشر.","يرسم المعلم طريقين للصعود إلى قمة جبل (مباشر ومتعرج) ويسأل: «هل يختلف فرق الارتفاع بين القاعدة والقمة باختلاف الطريق؟» ليربطه بقانون هس.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يقدم تشبيه الجبل\nالطالب: يستنتجون أن التغير الكلي لا يعتمد على المسار\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «حلقة بورن-هابر–حلقة طاقة بسيطة» بالشكل 3-2 (فلوريد الليثيوم) ويشرح الخطوات الأربع\nالطالب: يرسمون الحلقة ويكتبون الخطوات بالترتيب\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يحل مع الطلبة حساب ‎ΔH1‎ ثم ‎ΔH°latt‎ بالمثال 1 خطوة بخطوة\nالطالب: يتبعون الحل ويطبقونه على بيانات ‎NaCl‎\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما نص قانون هس؟\n   الإجابة النموذجية: التغير الكلي في المحتوى الحراري لتفاعل لا يعتمد على المسار، بل على الحالتين الابتدائية والنهائية.\n2) (المستوى المتوقع) السؤال: ما الخطوات التي يتكون منها ‎ΔH1‎ لـ ‎NaCl‎؟\n   الإجابة النموذجية: تذرير ‎Na‎، والتأين الأول لـ ‎Na‎، وتذرير ‎Cl‎، والألفة الإلكترونية الأولى لـ ‎Cl‎.\n3) (المستوى المتقدم) السؤال: احسب ‎ΔH1‎ لـ ‎NaCl‎ إذا كانت: ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.\n   الإجابة النموذجية: ‎ΔH1 = 107 + 496 + 122 − 349 = +376 kJ/mol‎.","1) (مستوى الدعم) السؤال: اكتب العلاقة بين ‎ΔH°f‎ و‎ΔH1‎ و‎ΔH°latt‎.\n   الإجابة النموذجية: ‎ΔH°f = ΔH1 + ΔH°latt‎\n2) (المستوى المتوقع) السؤال: احسب ‎ΔH°latt‎ لـ ‎NaCl‎ إذا كانت ‎ΔH°f = −411 kJ/mol‎ و‎ΔH1 = +376 kJ/mol‎.\n   الإجابة النموذجية: ‎ΔH°latt = −411 − 376 = −787 kJ/mol‎.\n3) (المستوى المتقدم) السؤال: لماذا يجب أن تبدأ الحلقة وتنتهي بالمواد نفسها؟\n   الإجابة النموذجية: لأن قانون هس يتطلب أن يكون مجموع التغيرات في المسار المغلق صفرًا، فنحسب المجهول من بقية الخطوات.","إرشاد للطالب: مراجعة ص 116–117 ورسم حلقة الطاقة لـ ‎NaCl‎\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «طريقي الجبل» لقانون هس"],"h":["<ol class=\"ol\"><li>يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية</li><li>يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>حلقة الطاقة، قانون هس، ‎ΔH°f‎، ‎ΔH1 (‎مجموع خطوات تكوين الأيونات الغازية)، المسار المباشر وغير المباشر.</p>","<p>يرسم المعلم طريقين للصعود إلى قمة جبل (مباشر ومتعرج) ويسأل: «هل يختلف فرق الارتفاع بين القاعدة والقمة باختلاف الطريق؟» ليربطه بقانون هس.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يقدم تشبيه الجبل</td><td>يستنتجون أن التغير الكلي لا يعتمد على المسار</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «حلقة بورن-هابر–حلقة طاقة بسيطة» بالشكل 3-2 (فلوريد الليثيوم) ويشرح الخطوات الأربع</td><td>يرسمون الحلقة ويكتبون الخطوات بالترتيب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يحل مع الطلبة حساب ‎ΔH1‎ ثم ‎ΔH°la
