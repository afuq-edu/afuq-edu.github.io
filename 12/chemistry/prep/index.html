\/b> يفسر لماذا يُقطّر الألدهيد فور تكونه أثناء التحضير<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الأكسدة، ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمضة، تغير اللون من البرتقالي إلى الأخضر، التقطير، الاختزال، ‎NaBH₄‎، ‎[O]‎ و‎[H]‎.<\/p>", "<p>يعرض المعلم أنبوبًا فيه محلول ثنائي كرومات برتقالي ثم أنبوبًا تحول إلى الأخضر بعد تسخينه مع إيثانول، ويسأل: «ماذا حدث للإيثانول؟ وما الذي غيّر اللون؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الأنبوبين ويطرح السؤال، والطلبة يستنتجون حدوث أكسدة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم أكسدة الكحول الأولي إلى ألدهيد (مع التقطير) والثانوي إلى كيتون، والمعادلات باستخدام ‎[O]‎، والطلبة يكتبون معادلتي الأكسدة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يشرح المعلم الاختزال بـ ‎NaBH₄‎ ويوجه حل نشاط 4-2 (كتاب التجارب ص 92)، والطلبة يكتبون معادلات الاختزال باستخدام ‎[H]‎ ويحلون النشاط (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ناتج أكسدة بروبان-2-ول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروبانون.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُقطّر الألدهيد فور تكونه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لمنع أكسدته أكثر إلى حمض كربوكسيلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما ناتج اختزال بيوتانون بـ ‎NaBH₄‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بيوتان-2-ول.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما لون محلول ثنائي كرومات البوتاسيوم قبل الأكسدة وبعدها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: برتقالي قبل، وأخضر بعد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة أكسدة الإيثانول إلى إيثانال باستخدام ‎[O]‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃CH₂OH + [O] → CH₃CHO + H₂O‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب معادلة اختزال إيثانال باستخدام ‎[H]‎ وسمِّ الناتج.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃CHO + 2[H] → CH₃CH₂OH‎، إيثانول.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 141–142 وإكمال نشاط 4-2 ص 92<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تغير لون ثنائي كرومات ودلالته<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=19<\/p>"]}, {"axis": "التمييز بين الألدهيدات والكيتونات بكاشفي فهلينج وتولن", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلتان المتجانستان للألدهيدات والكيتونات"], ["الحصة", "3 من 3"], ["محور الحصة", "التمييز بين الألدهيدات والكيتونات بكاشفي فهلينج وتولن"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 142"], ["دليل المعلم", "ص 178–182"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: مركبات الكربونيل: التحضير والاختزال ص 92"]], "t": ["1. يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن (20 دقيقة)\n2. يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة (5 دقائق)\nمخرج تعليمي آخر: يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان (15 دقيقة)", "1. تطبيق: يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن\n2. فهم: يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة\n3. إبداع (مخرج آخر): يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "كاشف فهلينج، الراسب الأحمر الطوبي ‎(Cu₂O)‎، كاشف تولن، المرآة الفضية، العامل المؤكسد المعتدل، الألدهيد قابل للأكسدة، الكيتون لا يتأكسد.", "يعرض المعلم صورة أنبوب مبطن بمرآة فضية لامعة ويسأل: «كيف ظهرت هذه المرآة من محلول شفاف؟ وأي نوع من مركبات الكربونيل يسببها؟»", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون حدوث اختزال لأيونات الفضة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم كاشفي فهلينج وتولن ونتائجهما مع الألدهيدات والكيتونات، والطلبة يكملون جدول النتائج (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم بطاقات مركبات مجهولة مع نتائج اختبارات لتحديد هويتها، والطلبة يحللون النتائج في مجموعات ويرسمون مخطط تحديد الهوية (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن التمييز بين الألدهيدات والكيتونات بكاشفي فهلينج وتولن، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – بهارات عمانية: تتنقّل المجموعات بين بطاقات لصيغ ألدهيدات وكيتونات تسمّيها وتميّز بينها، ومنها سينامالديهيد المسؤول عن رائحة القرفة المستخدمة في البهارات والأطباق العمانية (5 دقائق)\nالاستراتيجيات: المحطات.", "تفريد التعليم:\n1. مستوى المعرفة: ما نتيجة تسخين الإيثانال مع محلول فهلينج؟\n• الإجابة النموذجية: يتحول اللون الأزرق إلى راسب أحمر طوبي.\n\n2. مستوى التطبيق: ما نتيجة تسخين البروبانون مع كاشف تولن؟\n• الإجابة النموذجية: لا يحدث تغير (لا تتكون مرآة فضية).\n\n3. مستوى الاستدلال: لماذا يعطي الألدهيد نتيجة موجبة مع الكاشفين؟\n• الإجابة النموذجية: لأنه يتأكسد بسهولة إلى حمض كربوكسيلي فيختزل أيونات ‎Cu²⁺‎ أو ‎Ag⁺‎.", "1. مستوى المعرفة: ما الناتج المرئي لكاشف تولن مع الألدهيد؟\n• الإجابة النموذجية: مرآة فضية (أو راسب فضي).\n\n2. مستوى التطبيق: لماذا لا يتفاعل الكيتون مع كاشف فهلينج؟\n• الإجابة النموذجية: لأن الكيتون لا يتأكسد بالعوامل المؤكسدة المعتدلة.\n\n3. مستوى الاستدلال: مركب ‎C₃H₆O‎ يعطي راسبًا أحمر مع فهلينج ولا يعطي راسبًا أصفر مع اليود القلوي. ما هو؟\n• الإجابة النموذجية: بروبانال.", "إرشاد للطالب: مراجعة ص 142 وتلخيص نتائج الاختبارات الثلاثة في جدول\nإرشاد لولي الأمر: تشجيع الابن على رسم مخطط تحديد هوية مركب مجهول\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=19"], "h": ["<ol class=\"ol\"><li>يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن (20 دقيقة)<\/li><li>يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يميز بين الألدهيد والكيتون بنتائج اختبارات بسيطة باستخدام كاشف فهلينج وكاشف تولن<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يفسر نتائج الاختبارين في ضوء قابلية الألدهيدات للأكسدة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم مخططًا لتحديد هوية مركب كربونيل مجهول باستخدام الاختبارين واختبار ثلاثي يودوميثان<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>كاشف فهلينج، الراسب الأحمر الطوبي ‎(Cu₂O)‎، كاشف تولن، المرآة الفضية، العامل المؤكسد المعتدل، الألدهيد قابل للأكسدة، الكيتون لا يتأكسد.<\/p>", "<p>يعرض المعلم صورة أنبوب مبطن بمرآة فضية لامعة ويسأل: «كيف ظهرت هذه المرآة من محلول شفاف؟ وأي نوع من مركبات الكربونيل يسببها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون حدوث اختزال لأيونات الفضة (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم كاشفي فهلينج وتولن ونتائجهما مع الألدهيدات والكيتونات، والطلبة يكملون جدول النتائج (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم بطاقات مركبات مجهولة مع نتائج اختبارات لتحديد هويتها، والطلبة يحللون النتائج في مجموعات ويرسمون مخطط تحديد الهوية (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن التمييز بين الألدهيدات والكيتونات بكاشفي فهلينج وتولن، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – بهارات عمانية: تتنقّل المجموعات بين بطاقات لصيغ ألدهيدات وكيتونات تسمّيها وتميّز بينها، ومنها سينامالديهيد المسؤول عن رائحة القرفة المستخدمة في البهارات والأطباق العمانية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: المحطات.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نتيجة تسخين الإيثانال مع محلول فهلينج؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتحول اللون الأزرق إلى راسب أحمر طوبي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما نتيجة تسخين البروبانون مع كاشف تولن؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا يحدث تغير (لا تتكون مرآة فضية).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يعطي الألدهيد نتيجة موجبة مع الكاشفين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يتأكسد بسهولة إلى حمض كربوكسيلي فيختزل أيونات ‎Cu²⁺‎ أو ‎Ag⁺‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الناتج المرئي لكاشف تولن مع الألدهيد؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: مرآة فضية (أو راسب فضي).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يتفاعل الكيتون مع كاشف فهلينج؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الكيتون لا يتأكسد بالعوامل المؤكسدة المعتدلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> مركب ‎C₃H₆O‎ يعطي راسبًا أحمر مع فهلينج ولا يعطي راسبًا أصفر مع اليود القلوي. ما هو؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروبانال.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 142 وتلخيص نتائج الاختبارات الثلاثة في جدول<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على رسم مخطط تحديد هوية مركب مجهول<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=19<\/p>"]}]}, {"title": "السلسلة المتجانسة للأحماض الكربوكسيلية", "sb": "ص 143", "unit": "الوحدة 4: مشتقات الهيدروكربونات (1)", "periods": [{"axis": "تسمية الأحماض الكربوكسيلية وتحضيرها", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلة المتجانسة للأحماض الكربوكسيلية"], ["الحصة", "1 من 2"], ["محور الحصة", "تسمية الأحماض الكربوكسيلية وتحضيرها"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 143 + كتاب التجارب ص 93"], ["دليل المعلم", "ص 182–184"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: الأحماض الكربوكسيلية وتحضيرها ص 93؛ نشاط 4-4: تفاعلات الأحماض الكربوكسيلية ص 94"]], "t": ["1. يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية (10 دقائق)\n2. يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات (20 دقيقة)\nمخرج تعليمي آخر: يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه (10 دقائق)", "1. تطبيق: يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية\n2. فهم: يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات\n3. تحليل (مخرج آخر): يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: الجدول 4-4 في كتاب الطالب، كتاب التجارب العملية والأنشطة", "مجموعة الكربوكسيل –‎COOH‎، حمض الميثانويك، حمض الإيثانويك، التسخين مع الإرجاع (الارتداد)، الأكسدة الكاملة.", "يعرض المعلم زجاجة خل ويسأل: «الخل يحتوي حمض الإيثانويك الناتج من أكسدة الإيثانول بالبكتيريا؛ فكيف نحضره في المختبر؟»", "1. يعرض المعلم الزجاجة ويطرح السؤال، والطلبة يقترحون أكسدة الإيثانول (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يعرّف المعلم السلسلة المتجانسة بالجدول 4-4 ويشرح التسمية والتحضير بالإرجاع، والطلبة يسمون أحماضًا ويكتبون معادلة الأكسدة الكاملة باستخدام ‎2[O]‎ (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 4-3 «الأحماض الكربوكسيلية وتحضيرها» (ص 93)، والطلبة يحلون ويقارنون جهازي التقطير والإرجاع (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: سمِّ ‎CH₃CH₂COOH‎.\n• الإجابة النموذجية: حمض البروبانويك.\n\n2. مستوى التطبيق: لماذا يُستخدم التسخين مع الإرجاع لتحضير الحمض؟\n• الإجابة النموذجية: لإبقاء الألدهيد المتكون في خليط التفاعل فيتأكسد كليًا إلى حمض كربوكسيلي.\n\n3. مستوى الاستدلال: اكتب معادلة أكسدة الإيثانول إلى حمض الإيثانويك باستخدام ‎[O]‎.\n• الإجابة النموذجية: ‎CH₃CH₂OH + 2[O] → CH₃COOH + H₂O‎", "1. مستوى المعرفة: ما المجموعة الوظيفية للأحماض الكربوكسيلية؟\n• الإجابة النموذجية: مجموعة الكربوكسيل –‎COOH‎.\n\n2. مستوى التطبيق: ما ناتج أكسدة البروبانال؟\n• الإجابة النموذجية: حمض البروبانويك.\n\n3. مستوى الاستدلال: من الكحول الأولي نفسه، كيف تحصل مرة على ألدهيد ومرة على حمض؟\n• الإجابة النموذجية: بالتقطير الفوري للحصول على الألدهيد، وبالتسخين مع الإرجاع وزيادة المؤكسد للحصول على الحمض.", "إرشاد للطالب: مراجعة ص 143 وإكمال نشاط 4-3 ص 93\nإرشاد لولي الأمر: الحديث مع الابن عن الخل بوصفه محلولًا مخففًا لحمض الإيثانويك\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=20"], "h": ["<ol class=\"ol\"><li>يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية (10 دقائق)<\/li><li>يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يسمي الأحماض الكربوكسيلية حتى عشر ذرات كربون ويكتب صيغها البنائية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف تحضير الأحماض الكربوكسيلية بأكسدة الكحولات الأولية بالتسخين مع الإرجاع أو بأكسدة الألدهيدات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يميز بين ظروف تحضير الألدهيد (تقطير) والحمض (تسخين مع الإرجاع) من الكحول الأولي نفسه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: الجدول 4-4 في كتاب الطالب، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مجموعة الكربوكسيل –‎COOH‎، حمض الميثانويك، حمض الإيثانويك، التسخين مع الإرجاع (الارتداد)، الأكسدة الكاملة.<\/p>", "<p>يعرض المعلم زجاجة خل ويسأل: «الخل يحتوي حمض الإيثانويك الناتج من أكسدة الإيثانول بالبكتيريا؛ فكيف نحضره في المختبر؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الزجاجة ويطرح السؤال، والطلبة يقترحون أكسدة الإيثانول (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يعرّف المعلم السلسلة المتجانسة بالجدول 4-4 ويشرح التسمية والتحضير بالإرجاع، والطلبة يسمون أحماضًا ويكتبون معادلة الأكسدة الكاملة باستخدام ‎2[O]‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 4-3 «الأحماض الكربوكسيلية وتحضيرها» (ص 93)، والطلبة يحلون ويقارنون جهازي التقطير والإرجاع (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سمِّ ‎CH₃CH₂COOH‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: حمض البروبانويك.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُستخدم التسخين مع الإرجاع لتحضير الحمض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لإبقاء الألدهيد المتكون في خليط التفاعل فيتأكسد كليًا إلى حمض كربوكسيلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب معادلة أكسدة الإيثانول إلى حمض الإيثانويك باستخدام ‎[O]‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃CH₂OH + 2[O] → CH₃COOH + H₂O‎<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المجموعة الوظيفية للأحماض الكربوكسيلية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: مجموعة الكربوكسيل –‎COOH‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ناتج أكسدة البروبانال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حمض البروبانويك.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> من الكحول الأولي نفسه، كيف تحصل مرة على ألدهيد ومرة على حمض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بالتقطير الفوري للحصول على الألدهيد، وبالتسخين مع الإرجاع وزيادة المؤكسد للحصول على الحمض.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 143 وإكمال نشاط 4-3 ص 93<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الخل بوصفه محلولًا مخففًا لحمض الإيثانويك<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=20<\/p>"]}, {"axis": "تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلة المتجانسة للأحماض الكربوكسيلية"], ["الحصة", "2 من 2"], ["محور الحصة", "تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 143 + كتاب التجارب ص 94"], ["دليل المعلم", "ص 182–184"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: الأحماض الكربوكسيلية وتحضيرها ص 93؛ نشاط 4-4: تفاعلات الأحماض الكربوكسيلية ص 94"]], "t": ["1. يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها (20 دقيقة)\n2. يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات) (5 دقائق)\nمخرج تعليمي آخر: يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول (15 دقيقة)", "1. تطبيق: يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها\n2. تطبيق: يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات)\n3. تحليل (مخرج آخر): يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: حمض الإيثانويك، كربونات الصوديوم، شريط مغنيسيوم، ماء الجير", "الملح، إيثانوات الصوديوم، إيثانوات المغنيسيوم، التعادل، تصاعد ‎CO₂‎، تصاعد ‎H₂‎، الكشف عن –‎COOH‎.", "يضع المعلم مسحوق كربونات الصوديوم في الخل فيحدث فوران، ثم في الإيثانول فلا يحدث شيء، ويسأل: «ما الغاز المتصاعد؟ ولماذا لم يتصاعد مع الإيثانول؟»", "1. ينفذ المعلم العرض ويطرح السؤال، والطلبة يتوقعون ‎CO₂‎ ويختبرونه بماء الجير (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «تفاعلات الأحماض الكربوكسيلية» ويكتب معادلات التفاعل مع ‎Mg‎ و‎NaOH‎ و‎Na₂CO₃‎، والطلبة يكتبون المعادلات ويسمون الأملاح (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 4-4 «تفاعلات الأحماض الكربوكسيلية» (ص 94) والسؤال 6، والطلبة يحلون في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «سمِّ الملح الناتج من تفاعل حمض الإيثانويك مع المغنيسيوم» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – خلّ التمر: تكتب المجموعات معادلة تحضير حمض الإيثانويك بأكسدة الإيثانول، وتربطه بالخلّ المصنوع من التمر، ثم تقترح طرقًا للاستفادة من فائض التمور والحد من هدر الطعام (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب معادلة تفاعل حمض الإيثانويك مع ‎NaOH‎.\n• الإجابة النموذجية: ‎CH₃COOH + NaOH → CH₃COONa + H₂O‎\n\n2. مستوى التطبيق: ما الغاز الناتج من تفاعل حمض الإيثانويك مع ‎Mg‎؟\n• الإجابة النموذجية: الهيدروجين.\n\n3. مستوى الاستدلال: كيف تميز بين حمض الإيثانويك والإيثانول بكربونات الصوديوم؟\n• الإجابة النموذجية: الحمض يسبب فورانًا ‎(CO₂)‎ والكحول لا يتفاعل.", "1. مستوى المعرفة: سمِّ الملح الناتج من تفاعل حمض الإيثانويك مع المغنيسيوم.\n• الإجابة النموذجية: إيثانوات المغنيسيوم.\n\n2. مستوى التطبيق: اكتب معادلة تفاعل حمض الإيثانويك مع كربونات الصوديوم.\n• الإجابة النموذجية: ‎2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂‎\n\n3. مستوى الاستدلال: لماذا يتفاعل الحمض الكربوكسيلي مع الكربونات بينما لا يتفاعل الكحول؟\n• الإجابة النموذجية: لأن الحمض الكربوكسيلي أقوى حمضية بكثير ويمنح البروتون، أما الكحول فحمضيته ضعيفة جدًا.", "إرشاد للطالب: إكمال نشاط 4-4 ص 94 والسؤال 6\nإرشاد لولي الأمر: يمكن تنفيذ تجربة الخل وبيكربونات الصوديوم في المنزل بإشراف ولي الأمر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=20"], "h": ["<ol class=\"ol\"><li>يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها (20 دقيقة)<\/li><li>يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات) (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يصف تفاعلات الأحماض الكربوكسيلية مع الفلزات النشطة والقلويات والكربونات ويكتب معادلاتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يسمي أملاح الأحماض الكربوكسيلية الناتجة (الإيثانوات)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يستخدم تفاعل الكربونات للكشف عن الحمض الكربوكسيلي وتمييزه عن الكحول<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: حمض الإيثانويك، كربونات الصوديوم، شريط مغنيسيوم، ماء الجير<\/span><\/div>", "<p>الملح، إيثانوات الصوديوم، إيثانوات المغنيسيوم، التعادل، تصاعد ‎CO₂‎، تصاعد ‎H₂‎، الكشف عن –‎COOH‎.<\/p>", "<p>يضع المعلم مسحوق كربونات الصوديوم في الخل فيحدث فوران، ثم في الإيثانول فلا يحدث شيء، ويسأل: «ما الغاز المتصاعد؟ ولماذا لم يتصاعد مع الإيثانول؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يتوقعون ‎CO₂‎ ويختبرونه بماء الجير (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «تفاعلات الأحماض الكربوكسيلية» ويكتب معادلات التفاعل مع ‎Mg‎ و‎NaOH‎ و‎Na₂CO₃‎، والطلبة يكتبون المعادلات ويسمون الأملاح (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 4-4 «تفاعلات الأحماض الكربوكسيلية» (ص 94) والسؤال 6، والطلبة يحلون في أزواج (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «سمِّ الملح الناتج من تفاعل حمض الإيثانويك مع المغنيسيوم» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – خلّ التمر: تكتب المجموعات معادلة تحضير حمض الإيثانويك بأكسدة الإيثانول، وتربطه بالخلّ المصنوع من التمر، ثم تقترح طرقًا للاستفادة من فائض التمور والحد من هدر الطعام (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة تفاعل حمض الإيثانويك مع ‎NaOH‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COOH + NaOH → CH₃COONa + H₂O‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الغاز الناتج من تفاعل حمض الإيثانويك مع ‎Mg‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الهيدروجين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تميز بين حمض الإيثانويك والإيثانول بكربونات الصوديوم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الحمض يسبب فورانًا ‎(CO₂)‎ والكحول لا يتفاعل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سمِّ الملح الناتج من تفاعل حمض الإيثانويك مع المغنيسيوم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إيثانوات المغنيسيوم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تفاعل حمض الإيثانويك مع كربونات الصوديوم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2CH₃COOH + Na₂CO₃ → 2CH₃COONa + H₂O + CO₂‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يتفاعل الحمض الكربوكسيلي مع الكربونات بينما لا يتفاعل الكحول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الحمض الكربوكسيلي أقوى حمضية بكثير ويمنح البروتون، أما الكحول فحمضيته ضعيفة جدًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-4 ص 94 والسؤال 6<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن تنفيذ تجربة الخل وبيكربونات الصوديوم في المنزل بإشراف ولي الأمر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=20<\/p>"]}]}, {"title": "السلسلة المتجانسة للإسترات", "s نوات الميثيل.\n\n2. مستوى التطبيق: من أي حمض وكحول يُشتق بروبانوات الإيثيل؟\n• الإجابة النموذجية: حمض البروبانويك والإيثانول.\n\n3. مستوى الاستدلال: اكتب الصيغة البنائية لميثانوات البروبيل.\n• الإجابة النموذجية: ‎HCOOCH₂CH₂CH₃‎", "1. مستوى المعرفة: ما المجموعة الوظيفية للإسترات؟\n• الإجابة النموذجية: –‎COO– (‎مجموعة الإستر).\n\n2. مستوى التطبيق: سمِّ ‎CH₃CH₂COOCH₃‎.\n• الإجابة النموذجية: بروبانوات الميثيل.\n\n3. مستوى الاستدلال: إستر صيغته ‎CH₃COOCH₂CH₂CH₃‎؛ سمّه وحدد مصدري جزأيه.\n• الإجابة النموذجية: إيثانوات البروبيل؛ من حمض الإيثانويك والبروبان-1-ول.", "إرشاد للطالب: مراجعة ص 144 وتسمية خمسة إسترات\nإرشاد لولي الأمر: الحديث مع الابن عن الإسترات في العطور والنكهات الغذائية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=21"], "h": ["<ol class=\"ol\"><li>يسمي الإسترات وفق النظام ألكيل ألكانوات ويكتب صيغها البنائية والهيكلية (5 دقائق)<\/li><li>يحدد الحمض الكربوكسيلي والكحول اللذين اشتُق منهما إستر معين (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرسم الصيغة الهيكلية لإستر بمعلومية اسمه (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يسمي الإسترات وفق النظام ألكيل ألكانوات ويكتب صيغها البنائية والهيكلية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحدد الحمض الكربوكسيلي والكحول اللذين اشتُق منهما إستر معين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يرسم الصيغة الهيكلية لإستر بمعلومية اسمه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: نماذج جزيئية، عينات عطرية لإسترات (للشم الآمن بالتلويح)<\/span><\/div>", "<p>الإستر، مجموعة الإستر –‎COO–‎، الجزء المشتق من الكحول (ألكيل)، الجزء المشتق من الحمض (ألكانوات)، إيثانوات الإيثيل، ميثانوات الميثيل.<\/p>", "<p>يعرض المعلم عبوات عطور ونكهات فواكه صناعية ويسأل: «كثير من روائح الفواكه سببها مركبات تسمى الإسترات؛ من أين يأتي اسم إيثانوات الإيثيل؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم العبوات ويطرح السؤال، والطلبة يقترحون أن الاسم يأتي من حمض وكحول (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم بنية الإستر ونظام التسمية (اسم ألكيل الكحول + اسم أنيون الحمض)، والطلبة يسمون أمثلة ويحددون جزئي كل إستر (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم بطاقات أسماء وصيغ لمطابقتها في مجموعات، والطلبة يطابقون ويرسمون الصيغ الهيكلية (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سمِّ الإستر ‎CH₃COOCH₃‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إيثانوات الميثيل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> من أي حمض وكحول يُشتق بروبانوات الإيثيل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حمض البروبانويك والإيثانول.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب الصيغة البنائية لميثانوات البروبيل.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎HCOOCH₂CH₂CH₃‎<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المجموعة الوظيفية للإسترات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: –‎COO– (‎مجموعة الإستر).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> سمِّ ‎CH₃CH₂COOCH₃‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروبانوات الميثيل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إستر صيغته ‎CH₃COOCH₂CH₂CH₃‎؛ سمّه وحدد مصدري جزأيه.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إيثانوات البروبيل؛ من حمض الإيثانويك والبروبان-1-ول.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 144 وتسمية خمسة إسترات<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الإسترات في العطور والنكهات الغذائية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=21<\/p>"]}, {"axis": "تفاعل الأسترة وظروفه", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلة المتجانسة للإسترات"], ["الحصة", "2 من 5"], ["محور الحصة", "تفاعل الأسترة وظروفه"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 144–145"], ["دليل المعلم", "ص 184–188"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-5: الإسترات ص 95"]], "t": ["1. يصف تفاعل الأسترة بين حمض كربوكسيلي وكحول بوجود حمض الكبريتيك المركز حفازًا مع التسخين (5 دقائق)\n2. يكتب م ><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الأسترة بمعادلتي الصيغ الهيكلية والموسعة (الشكل 4-2) والظروف، والطلبة يكتبون معادلة تكوين إيثانوات الإيثيل (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم أزواجًا من الأحماض والكحولات لكتابة معادلاتها وتسمية الإستر، والطلبة يكتبون المعادلات في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة تكوين إيثانوات الإيثيل.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COOH + CH₃CH₂OH ⇌ CH₃COOCH₂CH₃ + H₂O‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما دور حمض الكبريتيك المركز في الأسترة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حفاز (ويسحب الماء فيزيح الاتزان نحو الإستر).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف يمكن زيادة مردود الإستر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: باستخدام زيادة من أحد المتفاعلين أو إزالة الماء أو الإستر من خليط التفاعل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px; ttps://afuq-edu.github.io/afuq/q/12/chemistry/?l=21"], "h": ["<ol class=\"ol\"><li>يصف خطوات تحضير إستر في المختبر: الخلط، والتسخين مع الإرجاع، والتقطير، والغسل بكربونات الصوديوم (20 دقيقة)<\/li><li>يحدد احتياطات الأمان عند استخدام حمض الكبريتيك المركز والمواد العضوية القابلة للاشتعال (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب غسل الإستر الناتج بمحلول كربونات الصوديوم (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف خطوات تحضير إستر في المختبر: الخلط، والتسخين مع الإرجاع، والتقطير، والغسل بكربونات الصوديوم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحدد احتياطات الأمان عند استخدام حمض الكبريتيك المركز والمواد العضوية القابلة للاشتعال<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر سبب غسل الإستر الناتج بمحلول كربونات الصوديوم<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">العرض التوضيحي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">أخرى: حمض الإيثانويك، الإيثانول، حمض الكبريتيك المركز، أنبوب اختبار، حمام مائي، محلول كربونات الصوديوم<\/span><\/div>", "<p>التحضير العملي، الحمام المائي، الرائحة المميزة، طبقة الإستر، الغسل بكربونات الصوديوم، احتياطات الأمان.<\/p>", "<p>يسأل المعلم: «كيف نعرف أن الإستر تكوّن فعلًا دون أجهزة تحليل؟» ويطلب من الطلبة اقتراح دليلين.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون الرائحة وتكون طبقة منفصلة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ «العرض التوضيحي: تحضير الإسترات» مع شرح كل خطوة واحتياطاتها، والطلبة يسجلون الخطوات والملاحظات ويصفون الرائحة بالتلويح الآمن (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يناقش المعلم سبب الغسل بكربونات الصوديوم وظهور طبقتين، والطلبة يفسرون الملاحظات ويكتبون معادلة إزالة الحمض الزائد (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: العرض التوضيحي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا يُستخدم حمام مائي لا لهب مباشر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الكحولات والإسترات قابلة للاشتعال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُغسل الإستر بمحلول كربونات الصوديوم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لإزالة بقايا الحمض الكربوكسيلي وحمض الكبريتيك بتحويلها إلى أملاح ذائبة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يطفو الإستر طبقة فوق المحلول المائي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه لا يمتزج بالماء وكثافته أقل منه.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر دليلين على تكون الإستر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: رائحة فواكه مميزة، وظهور طبقة زيتية منفصلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما احتياط الأمان عند التعامل مع حمض الكبريتيك المركز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ارتداء النظارات والقفازات وإضافته ببطء بقطرات قليلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يُشم الإستر بالتلويح لا مباشرة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتجنب استنشاق كمية كبيرة من الأبخرة المهيجة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة خطوات العرض التوضيحي وملاحظاته في الدفتر<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن قواعد السلامة في التعامل مع الأحماض المركزة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=21<\/p>"]}, {"axis": "التحلل المائي للإسترات في الوسط الحمضي والقاعدي", "n": 4, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلة المتجانسة للإسترات"], ["الحصة", "4 من 5"], ["محور الحصة", "التحلل المائي للإسترات في الوسط الحمضي والقاعدي"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 145"], ["دليل المعلم", "ص 184–188"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-5: الإسترات ص 95"]], "t": ["1. يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما (10 دقائق)\n2. يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج (10 دقائق)\nمخرج تعليمي آخر: يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي (20 دقيقة)", "1. فهم: يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما\n2. تحليل: يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج\n3. تحليل (مخرج آخر): يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: الشكل في كتاب الطالب", "التحلل المائي، الوسط الحمضي، الوسط القاعدي، ملح الحمض الكربوكسيلي، التفاعل العكسي، التفاعل الكامل، التصبن (للتوسع).", "يسأل المعلم: «الأسترة تتطلب حذف الماء؛ فماذا تتوقع إذا سخّنا الإستر مع الماء بوجود حمض؟ ومع ‎NaOH‎؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون عكس الأسترة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «التحلل المائي للإسترات» ويكتب معادلتي التحلل الحمضي والقاعدي لإيثانوات الميثيل، والطلبة يكتبون المعادلتين ويسمون النواتج (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم إسترات لكتابة نواتج تحللها بالوسطين، والطلبة يكتبون المعادلات في مجموعات ويقارنون (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما نواتج التحلل الحمضي لإيثانوات الميثيل؟\n• الإجابة النموذجية: حمض الإيثانويك والميثانول.\n\n2. مستوى التطبيق: ما نواتج التحلل القاعدي لإيثانوات الميثيل مع ‎NaOH‎؟\n• الإجابة النموذجية: إيثانوات الصوديوم والميثانول.\n\n3. مستوى الاستدلال: لماذا يكون التحلل القاعدي كاملًا لا عكسيًا؟\n• الإجابة النموذجية: لأن الحمض الناتج يتحول إلى أيون كربوكسيلات (ملح) لا يتفاعل مع الكحول لإعادة تكوين الإستر.", "1. مستوى المعرفة: اكتب معادلة التحلل القاعدي لإيثانوات الإيثيل.\n• الإجابة النموذجية: ‎CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃CH₂OH‎\n\n2. مستوى التطبيق: ما الفرق بين ناتجي الوسطين من جهة الحمض؟\n• الإجابة النموذجية: في الحمضي يتكون الحمض الكربوكسيلي نفسه، وفي القاعدي يتكون ملحه.\n\n3. مستوى الاستدلال: كيف تحصل على الحمض الكربوكسيلي نفسه بعد التحلل القاعدي؟\n• الإجابة النموذجية: بإضافة حمض قوي مخفف (مثل ‎HCl‎) إلى الملح الناتج.", "إرشاد للطالب: مراجعة ص 145 وكتابة معادلات تحلل ثلاثة إسترات بالوسطين\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين التحلل الحمضي والقاعدي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=21"], "h": ["<ol class=\"ol\"><li>يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما (10 دقائق)<\/li><li>يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف التحلل المائي للإسترات بالتسخين مع حمض مخفف ومع قلوي مخفف ويكتب معادلاتهما<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يقارن بين التحلل الحمضي (عكسي) والتحلل القاعدي (كامل) من حيث النواتج<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر لماذا يكون التحلل القاعدي أكمل من الحمضي<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: الشكل في كتاب الطالب<\/span><\/div>", "<p>التحلل المائي، الوسط الحمضي، الوسط القاعدي، ملح الحمض الكربوكسيلي، التفاعل العكسي، التفاعل الكامل، التصبن (للتوسع).<\/p>", "<p>يسأل المعلم: «الأسترة تتطلب حذف الماء؛ فماذا تتوقع إذا سخّنا الإستر مع الماء بوجود حمض؟ ومع ‎NaOH‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون عكس الأسترة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «التحلل المائي للإسترات» ويكتب معادلتي التحلل الحمضي والقاعدي لإيثانوات الميثيل، والطلبة يكتبون المعادلتين ويسمون النواتج (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم إسترات لكتابة نواتج تحللها بالوسطين، والطلبة يكتبون المعادلات في مجموعات ويقارنون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نواتج التحلل الحمضي لإيثانوات الميثيل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حمض الإيثانويك والميثانول.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما نواتج التحلل القاعدي لإيثانوات الميثيل مع ‎NaOH‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إيثانوات الصوديوم والميثانول.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون التحلل القاعدي كاملًا لا عكسيًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الحمض الناتج يتحول إلى أيون كربوكسيلات (ملح) لا يتفاعل مع الكحول لإعادة تكوين الإستر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة التحلل القاعدي لإيثانوات الإيثيل.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COOCH₂CH₃ + NaOH → CH₃COONa + CH₃CH₂OH‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الفرق بين ناتجي الوسطين من جهة الحمض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في الحمضي يتكون الحمض الكربوكسيلي نفسه، وفي القاعدي يتكون ملحه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تحصل على الحمض الكربوكسيلي نفسه بعد التحلل القاعدي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بإضافة حمض قوي مخفف (مثل ‎HCl‎) إلى الملح الناتج.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 145 وكتابة معادلات تحلل ثلاثة إسترات بالوسطين<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين التحلل الحمضي والقاعدي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=21<\/p>"]}, {"axis": "نشاط 4-5 والسؤال 7 ومسائل الإسترات", "n": 5, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلة المتجانسة للإسترات"], ["الحصة", "5 من 5"], ["محور الحصة", "نشاط 4-5 والسؤال 7 ومسائل الإسترات"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 144–145 + كتاب التجارب ص 95"], ["دليل المعلم", "ص 184–188"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-5: الإسترات ص 95"]], "t": ["1. يحل نشاط 4-5 «الإسترات» والسؤال 7 في كتاب الطالب (20 دقيقة)\n2. يربط بين تفاعلات تكوين الإسترات وتحللها في مخطط تحويلات (5 دقائق)\nمخرج تعليمي آخر: يصمم مخطط تحويل من كحول إلى إستر عبر حمض كربوكسيلي (15 دقيقة)", "1. تطبيق: يحل نشاط 4-5 «الإسترات» والسؤال 7 في كتاب الطالب\n2. تحليل: يربط بين تفاعلات تكوين الإسترات وتحللها في مخطط تحويلات\n3. إبداع (مخرج آخر): يصمم مخطط تحويل من كحول إلى إستر عبر حمض كربوكسيلي", "- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "مخطط التحويلات، كحول ← حمض ← إستر، التحلل، التسمية، ربط التفاعلات.", "يكتب المعلم في وسط السبورة «إيثانوات الإيثيل» ويطلب من الطلبة كتابة كل المواد التي تُحضّره أو تنتج منه خلال دقيقتين.", "1. يدير المعلم النشاط ويجمع الإجابات، والطلبة يكتبون المواد ويربطونها بأسهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يوجه المعلم حل نشاط 4-5 (كتاب التجارب ص 95) والسؤال 7، والطلبة يحلون فرديًا ثم يقارنون (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يكلف المجموعات بتصميم مخطط تحويل من الإيثانول فقط إلى إيثانوات الإيثيل، والطلبة يصممون المخطط ويحددون الكواشف والظروف (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول نشاط 4-5 والسؤال 7 ومسائل الإسترات، ويبدأ المعلم بسؤال «كيف تحضر إيثانوات الإيثيل باستخدام الإيثانول وحده مادة عضوية أولية» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – عطور الولايات: تسمّي كل مجموعة إسترًا من حمض وكحول، ثم تقترح اسمًا لعطر يمثّل محافظة عمانية مستوحى من رائحة الإستر الفاكهية، مستحضرة تراث العطور والبخور في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم:\n1. مستوى المعرفة: كيف تحضر إيثانوات الإيثيل باستخدام الإيثانول وحده مادة عضوية أولية؟\n• الإجابة النموذجية: تأكسد جزءًا منه إلى حمض الإيثانويك بالتسخين مع الإرجاع، ثم تجري الأسترة بين الحمض والجزء الآخر من الإيثانول.\n\n2. مستوى التطبيق: ما الكاشف اللازم لتحويل الإيثانول إلى حمض الإيثانويك؟\n• الإجابة النموذجية: ثنائي كرومات البوتاسيوم المحمضة مع التسخين والإرجاع.\n\n3. مستوى الاستدلال: ما نواتج تحلل بروبانوات الميثيل بـ ‎NaOH‎؟\n• الإجابة النموذجية: بروبانوات الصوديوم والميثانول.", "1. مستوى المعرفة: سمِّ الإستر الناتج من حمض البيوتانويك والميثانول.\n• الإجابة النموذجية: بيوتانوات الميثيل.\n\n2. مستوى التطبيق: اكتب معادلة تكوين ميثانوات الإيثيل.\n• الإجابة النموذجية: ‎HCOOH + CH₃CH₂OH ⇌ HCOOCH₂CH₃ + H₂O‎\n\n3. مستوى الاستدلال: إستر صيغته ‎C₄H₈O₂‎ ينتج عند تحلله الحمضي حمض الإيثانويك. ما الإستر؟ وما الكحول الناتج؟\n• الإجابة النموذجية: إيثانوات الإيثيل، والكحول الإيثانول.", "إرشاد للطالب: إكمال نشاط 4-5 ص 95 والسؤال 7 ومراجعة مخطط التحويلات\nإرشاد لولي الأمر: م 1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 4-5 (كتاب التجارب ص 95) والسؤال 7، والطلبة يحلون فرديًا ثم يقارنون (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلف المجموعات بتصميم مخطط تحويل من الإيثانول فقط إلى إيثانوات الإيثيل، والطلبة يصممون المخطط ويحددون الكواشف والظروف (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول نشاط 4-5 والسؤال 7 ومسائل الإسترات، ويبدأ المعلم بسؤال «كيف تحضر إيثانوات الإيثيل باستخدام الإيثانول وحده مادة عضوية أولية» (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – عطور الولايات: تسمّي كل مجموعة إسترًا من حمض وكحول، ثم تقترح اسمًا لعطر يمثّل محافظة عمانية مستوحى من رائحة الإستر الفاكهية، مستحضرة تراث العطور والبخور في عمان (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تحضر إيثانوات الإيثيل باستخدام الإيثانول وحده مادة عضوية أولية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تأكسد جزءًا منه إلى حمض الإيثانويك بالتسخين مع الإرجاع، ثم تجري الأسترة بين الحمض والجزء الآخر من الإيثانول.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الكاشف اللازم لتحويل الإيثانول إلى حمض الإيثانويك؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ثنائي كرومات البوتاسيوم المحمضة مع التسخين والإرجاع.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما نواتج تحلل بروبانوات الميثيل بـ ‎NaOH‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروبانوات الصوديوم والميثانول.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سمِّ الإستر الناتج من حمض البيوتانويك والميثانول.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بيوتانوات الميثيل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تكوين ميثانوات الإيثيل.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎HCOOH + CH₃CH₂OH ⇌ HCOOCH₂CH₃ + H₂O‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إستر صيغته ‎C₄H₈O₂‎ ينتج عند تحلله الحمضي حمض الإيثانويك. ما الإستر؟ وما الكحول الناتج؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إيثانوات الإيثيل، والكحول الإيثانول.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-5 ص 95 والسؤال 7 ومراجعة مخطط التحويلات<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في إكمال مخطط التحويلات بالكواشف والظروف<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=21<\/p>"]}]}, {"title": "تفاعلات الكحولات", "sb": "ص 146–153", "unit": "الوحدة 4: مشتقات الهيدروكربونات (1)", "periods": [{"axis": "احتراق الكحولات وتفاعلها مع فلز الصوديوم", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "تفاعلات الكحولات"], ["الحصة", "1 من 3"], ["محور الحصة", "احتراق الكحولات وتفاعلها مع فلز الصوديوم"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 146–147"], ["دليل المعلم", "ص 188–195"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-6: بعض تفاعلات الكحولات ص 96"]], "t": ["1. يكتب معادلات الاحتراق الكامل للكحولات (15 دقيقة)\n2. يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق (10 دقائق)", "1. تطبيق: يكتب معادلات الاحتراق الكامل للكحولات\n2. فهم: يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين\n3. تحليل (مخرج آخر): يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: مقطع مرئي لتفاعل الصوديوم مع الإيثانول", "الاحتراق الكامل، ‎CO₂‎ والماء، ألكوكسيد الصوديوم (إيثوكسيد الصوديوم)، تصاعد ‎H₂‎، الإيثانول وقودًا.", "يعرض المعلم مقطعًا لقطعة صوديوم في الماء ثم في الإيثانول ويسأل: «لماذا كان التفاعل مع الإيثانول أهدأ بكثير؟»", "1. يعرض المعلم المقطعين ويطرح السؤال، والطلبة يلاحظون الفرق ويقترحون تفسيرًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم الاحتراق وموازنة معادلاته ثم «التفاعل مع فلز الصوديوم»، والطلبة يكتبون معادلات الاحتراق والتفاعل مع ‎Na‎ (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم كحولات مختلفة لموازنة معادلات احتراقها وتسمية ألكوكسيداتها، والطلبة يوازنون ويسمون في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب معادلة الاحتراق الكامل للإيثانول.\n• الإجابة النموذجية: ‎C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O‎\n\n2. مستوى التطبيق: اكتب معادلة تفاعل الإيثانول مع الصوديوم.\n• الإجابة النموذجية: ‎2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂‎\n\n3. مستوى الاستدلال: لماذا التفاعل مع الإيثانول أهدأ منه مع الماء؟\n• الإجابة النموذجية: لأن الرابطة ‎O–H‎ في الإيثانول أقل قطبية (مجموعة الإيثيل تدفع الإلكترونات) فيكون تحرر ‎H⁺‎ أصعب.", "1. مستوى المعرفة: ما الغاز الناتج من تفاعل الكحول مع الصوديوم؟\n• الإجابة النموذجية: الهيدروجين.\n\n2. مستوى التطبيق: سمِّ الناتج العضوي لتفاعل الميثانول مع الصوديوم.\n• الإجابة النموذجية: ميثوكسيد الصوديوم.\n\n3. مستوى الاستدلال: وازن معادلة الاحتراق الكامل للبروبان-1-ول.\n• الإجابة النموذجية: ‎2C₃H₇OH + 9O₂ → 6CO₂ + 8H₂O‎", "إرشاد للطالب: مراجعة ص 146–147 وموازنة معادلات احتراق ثلاثة كحولات\nإرشاد لولي الأمر: الحديث مع الابن عن الإيثانول بوصفه وقودًا حيويًا\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=22"], "h": ["<ol class=\"ol\"><li>يكتب معادلات الاحتراق الكامل للكحولات (15 دقيقة)<\/li><li>يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يكتب معادلات الاحتراق الكامل للكحولات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف تفاعل الكحولات مع فلز الصوديوم وتكوين ألكوكسيد الصوديوم وتصاعد الهيدروجين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين شدة تفاعل الصوديوم مع الماء ومع الإيثانول ويفسر الفرق<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><span class=\"chip r\">أخرى: مقطع مرئي لتفاعل الصوديوم مع الإيثانول<\/span><\/div>", "<p>الاحتراق الكامل، ‎CO₂‎ والماء، ألكوكسيد الصوديوم (إيثوكسيد الصوديوم)، تصاعد ‎H₂‎، الإيثانول وقودًا.<\/p>", "<p>يعرض المعلم مقطعًا لقطعة صوديوم في الماء ثم في الإيثانول ويسأل: «لماذا كان التفاعل مع الإيثانول أهدأ بكثير؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المقطعين ويطرح السؤال، والطلبة يلاحظون الفرق ويقترحون تفسيرًا (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الاحتراق وموازنة معادلاته ثم «التفاعل مع فلز الصوديوم»، والطلبة يكتبون معادلات الاحتراق والتفاعل مع ‎Na‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم كحولات مختلفة لموازنة معادلات احتراقها وتسمية ألكوكسيداتها، والطلبة يوازنون ويسمون في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة الاحتراق الكامل للإيثانول.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تفاعل الإيثانول مع الصوديوم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2C₂H₅OH + 2Na → 2C₂H₅ONa + H₂‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا التفاعل مع الإيثانول أهدأ منه مع الماء؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الرابطة ‎O–H‎ في الإيثانول أقل قطبية (مجموعة الإيثيل تدفع الإلكترونات) فيكون تحرر ‎H⁺‎ أصعب.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الغاز الناتج من تفاعل الكحول مع الصوديوم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الهيدروجين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> سمِّ الناتج العضوي لتفاعل الميثانول مع الصوديوم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ميثوكسيد الصوديوم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> وازن معادلة الاحتراق الكامل للبروبان-1-ول.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2C₃H₇OH + 9O₂ → 6CO₂ + 8H₂O‎<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 146–147 وموازنة معادلات احتراق ثلاثة كحولات<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الإيثانول بوصفه وقودًا حيويًا<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=22<\/p>"]}, {"axis": "الاستبدال بالهاليدات ونزع الماء من الكحولات", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "تفاعلات الكحولات"], ["الحصة", "2 من 3"], ["محور الحصة", "الاستبدال بالهاليدات ونزع الماء من الكحولات"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 147–149"], ["دليل المعلم", "ص 188–195"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-6: بعض تفاعلات الكحولات ص 96"]], "t": ["1. يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي) (10 دقائق)\n2. يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بنواتج نزع الماء من كحولات مختلفة (15 دقيقة)", "1. فهم: يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي)\n2. فهم: يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز\n3. تطبيق (مخرج آخر): يتنبأ بنواتج نزع الماء من كحولات مختلفة", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- المراجعة النشطة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة", "الاستبدال النيوكليوفيلي، الهالوجينوألكان، ‎HCl‎ المحضر في وعاء التفاعل ‎(NaCl + H₂SO₄)‎، كلوريد الفوسفور ‎(III)‎، نزع الماء، الألكين، ‎Al₂O₃‎.", "يسأل المعلم: «نريد تحويل الإيثانول إلى كلوروإيثان مرة، وإلى إيثين مرة أخرى؛ ما الذي يجب أن يُنزع أو يُستبدل في كل حالة؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون استبدال ‎OH‎ بـ ‎Cl‎، ونزع ‎H₂O‎ (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم «التفاعل مع الهاليدات» وتحضير ‎HCl‎ في الوعاء واستخدام ‎PCl₃‎، ثم نزع الماء، والطلبة يكتبون معادلات التفاعلين (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم مراجعة نشطة بمسائل تنبؤ بنواتج كحولات مختلفة، والطلبة يتنبؤون بالنواتج ويكتبون المعادلات في مجموعات (14 دقيقة)\nالاستراتيجيات: المراجعة النشطة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب معادلة تفاعل الإيثانول مع ‎HCl‎.\n• الإجابة النموذجية: ‎CH₃CH₂OH + HCl → CH₃CH₂Cl + H₂O‎\n\n2. مستوى التطبيق: كيف يُحضّر ‎HCl‎ داخل وعاء التفاعل؟\n• الإجابة النموذجية: بتفاعل كلوريد الصوديوم مع حمض الكبريتيك المركز.\n\n3. مستوى الاستدلال: ما ناتج نزع الماء من بروبان-1-ول؟\n• الإجابة النموذجية: البروبين.", "1. مستوى المعرفة: ما نوع تفاعل الكحول مع ‎HX‎؟\n• الإجابة النموذجية: استبدال نيوكليوفيلي.\n\n2. مستوى التطبيق: ما الحفاز المستخدم في نزع الماء من الإيثانول؟\n• الإجابة النموذجية: أكسيد الألومنيوم ‎Al₂O₃‎ الساخن (أو حمض مركز).\n\n3. مستوى الاستدلال: اكتب معادلة نزع الماء من الإيثانول وسمِّ الناتج.\n• الإجابة النموذجية: ‎CH₃CH₂OH → CH₂=CH₂ + H₂O‎، الإيثين.", "إرشاد للطالب: مراجعة ص 147–149 وكتابة معادلات الاستبدال ونزع الماء\nإرشاد لولي الأمر: متابعة الابن في التمييز بين تفاعلي الاستبدال والحذف\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=22"], "h": ["<ol class=\"ol\"><li>يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي) (10 دقائق)<\/li><li>يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بنواتج نزع الماء من كحولات مختلفة (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تفاعل الكحولات مع هاليدات الهيدروجين أو كلوريد الفوسفور ‎(III)‎ لتكوين هالوجينو ألكانات (استبدال نيوكليوفيلي)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف نزع الماء من الكحولات لتكوين الألكينات بالتسخين مع حفاز مثل ‎Al₂O₃‎ أو حمض مركز<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يتنبأ بنواتج نزع الماء من كحولات مختلفة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">المراجعة النشطة<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الاستبدال النيوكليوفيلي، الهالوجينوألكان، ‎HCl‎ المحضر في وعاء التفاعل ‎(NaCl + H₂SO₄)‎، كلوريد الفوسفور ‎(III)‎، نزع الماء، الألكين، ‎Al₂O₃‎.<\/p>", "<p>يسأل المعلم: «نريد تحويل الإيثانول إلى كلوروإيثان مرة، وإلى إيثين مرة أخرى؛ ما الذي يجب أن يُنزع أو يُستبدل في كل حالة؟»<\/p>", "<div c r><span style=\"opacity:.85\">• الإجابة النموذجية: البروبين.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نوع تفاعل الكحول مع ‎HX‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: استبدال نيوكليوفيلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الحفاز المستخدم في نزع الماء من الإيثانول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أكسيد الألومنيوم ‎Al₂O₃‎ الساخن (أو حمض مركز).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب معادلة نزع الماء من الإيثانول وسمِّ الناتج.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃CH₂OH → CH₂=CH₂ + H₂O‎، الإيثين.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 147–149 وكتابة معادلات الاستبدال ونزع الماء<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التمييز بين تفاعلي الاستبدال والحذف<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=22<\/p>"]}, {"axis": "أكسدة الكحولات بثنائي كرومات البوتاسيوم والتمييز بينها", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "تفاعلات الكحولات"], ["الحصة", "3 من 3"], ["محور الحصة", "أكسدة الكحولات بثنائي كرومات البوتاسيوم والتمييز بينها"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 150–153 + كتاب التجارب ص 96"], ["دليل المعلم", "ص 188–195"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-6: بعض تفاعلات الكحولات ص 96"]], "t": ["1. يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض (15 دقيقة)\n2. يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية (15 دقيقة)\nمخرج تعليمي آخر: ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6 (10 دقائق)", "1. فهم: يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض\n2. تطبيق: يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية\n3. تطبيق (مخرج آخر): ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- أخرى: إيثانول، بروبان-2-ول، 2-ميثيل بروبان-2-ول، محلول ثنائي كرومات البوتاسيوم المحمض، حمام مائي، أنابيب اختبار", "أكسدة الكحولات، الكحول الأولي ← ألدهيد ← حمض، الكحول الثانوي ← كيتون، الكحول الثالثي لا يتأكسد، البرتقالي إلى الأخضر.", "يعرض المعلم ثلاثة أنابيب لكحولات مجهولة ويسأل: «بكاشف واحد فقط، هل يمكن أن تعرف أيها الكحول الثالثي؟»", "1. يطرح المعلم التحدي، والطلبة يقترحون ثنائي الكرومات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم «أكسدة الإيثانول» ونواتج أكسدة الأنواع الثلاثة، والطلبة يكتبون النواتج المتوقعة لكل نوع (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم الاستقصاء العملي «تمييز الكحولات الثالثية من الأولية والثانوية» ويوجه حل نشاط 4-6 (ص 96)، والطلبة يسخنون الأنابيب في حمام مائي ويسجلون الألوان ويحلون النشاط (15 دقيقة)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «ما نتيجة تسخين كحول ثالثي مع ثنائي الكرومات المحمضة»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – وقود أنظف: تكتب المجموعات معادلة الاحتراق الكامل للإيثانول، ثم تتحاور حول بدائل الوقود الأنظف ودورها في حماية بيئة عمان وتحقيق أهداف رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم:\n1. مستوى المعرفة: ما نتيجة تسخين كحول ثالثي مع ثنائي الكرومات المحمضة؟\n• الإجابة النموذجية: يبقى اللون برتقاليًا (لا أكسدة).\n\n2. مستوى التطبيق: لماذا لا يتأكسد الكحول الثالثي؟\n• الإجابة النموذجية: لأن ذرة الكربون الحاملة لـ ‎OH‎ لا ترتبط بذرة هيدروجين.\n\n3. مستوى الاستدلال: هل يميز ثنائي الكرومات بين الكحول الأولي والثانوي وحده؟\n• الإجابة النموذجية: لا، كلاهما يحول اللون إلى الأخضر؛ نحتاج اختبار الناتج (فهلينج أو تولن).", "1. مستوى المعرفة: ما ناتج أكسدة بيوتان-2-ول؟\n• الإجابة النموذجية: بيوتانون.\n\n2. مستوى التطبيق: صف تغير اللون عند أكسدة الكحول الأولي.\n• الإجابة النموذجية: يتحول من البرتقالي إلى الأخضر.\n\n3. مستوى الاستدلال: كيف تميز بين ناتجي أكسدة الكحول الأولي (بالتقطير) والثانوي؟\n• الإجابة النموذجية: باختبار فهلينج أو تولن: ناتج الأولي (ألدهيد) يعطي نتيجة موجبة، وناتج الثانوي (كيتون) لا يعطي.", "إرشاد للطالب: كتابة تقرير الاستقصاء وإكمال نشاط 4-6 ص 96 والأسئلة 8–15\nإرشاد لولي الأمر: التأكد من فهم الابن لسبب عدم أكسدة الكحول الثالثي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=22"], "h": ["<ol class=\"ol\"><li>يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض (15 دقيقة)<\/li><li>يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6 (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف أكسدة الكحولات الأولية والثانوية بمحلول ثنائي كرومات البوتاسيوم ‎(VI)‎ المحمض<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يصف كيف يُستخدم محلول ثنائي كرومات البوتاسيوم المحمض للتمييز بين الكحولات الثالثية والكحولات الأولية والثانوية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> ينفذ الاستقصاء العملي لتمييز الكحول الثالثي ويحل نشاط 4-6<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">أخرى: إيثانول، بروبان-2-ول، 2-ميثيل بروبان-2-ول، محلول ثنائي كرومات البوتاسيوم المحمض، حمام مائي، أنابيب اختبار<\/span><\/div>", "<p>أكسدة الكحولات، الكحول الأولي ← ألدهيد ← حمض، الكحول الثانوي ← كيتون، الكحول الثالثي لا يتأكسد، البرتقالي إلى الأخضر.<\/p>", "<p>يعرض المعلم ثلاثة أنابيب لكحولات مجهولة ويسأل: «بكاشف واحد فقط، هل يمكن أن تعرف أيها الكحول الثالثي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم التحدي، والطلبة يقترحون ثنائي الكرومات (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم «أكسدة الإيثانول» ونواتج أكسدة الأنواع الثلاثة، والطلبة يكتبون النواتج المتوقعة لكل نوع (9 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم الاستقصاء العملي «تمييز الكحولات الثالثية من الأولية والثانوية» ويوجه حل نشاط 4-6 (ص 96)، والطلبة يسخنون الأنابيب في حمام مائي ويسجلون الألوان ويحلون النشاط (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «ما نتيجة تسخين كحول ثالثي مع ثنائي الكرومات المحمضة»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – وقود أنظف: تكتب المجموعات معادلة الاحتراق الكامل للإيثانول، ثم تتحاور حول بدائل الوقود الأنظف ودورها في حماية بيئة عمان وتحقيق أهداف رؤية عمان 2040 (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نتيجة تسخين كحول ثالثي مع ثنائي الكرومات المحمضة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يبقى اللون برتقاليًا (لا أكسدة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يتأكسد الكحول الثالثي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ذرة الكربون الحاملة لـ ‎OH‎ لا ترتبط بذرة هيدروجين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> هل يميز ثنائي الكرومات بين الكحول الأولي والثانوي وحده؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا، كلاهما يحول اللون إلى الأخضر؛ نحتاج اختبار الناتج (فهلينج أو تولن).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ناتج أكسدة بيوتان-2-ول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بيوتانون.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صف تغير اللون عند أكسدة الكحول الأولي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتحول من البرتقالي إلى الأخضر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تميز بين ناتجي أكسدة الكحول الأولي (بالتقطير) والثانوي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: باختبار فهلينج أو تولن: ناتج الأولي (ألدهيد) يعطي نتيجة موجبة، وناتج الثانوي (كيتون) لا يعطي.<\/span>
