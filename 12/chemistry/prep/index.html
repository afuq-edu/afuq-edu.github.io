"1. يطرح المعلم السؤال ويبدأ الخريطة، والطلبة يقترحون مواد أولية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ينفذ المعلم «مراجعة تكوين الكحولات من وحدات أخرى وبعض الطرائق الجديدة» ويشرح الطرائق الخمس بمعادلاتها، والطلبة يكتبون المعادلات ويكملون الخريطة الذهنية (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. ينفذ المعلم «اختزال الألدهيدات والكيتونات» ويوجه حل نشاط 4-7 (ص 98)، والطلبة يحلون النشاط ويحددون الكاشف والظروف لكل طريقة (12 دقيقة)\nالاستراتيجيات: الخريطة الذهنية.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما ظروف تحضير الإيثانول من الإيثين؟\n• الإجابة النموذجية: تفاعل الإيثين مع بخار الماء بوجود حمض الفوسفوريك المركز حفازًا.\n\n2. مستوى التطبيق: ما ناتج تسخين بروموإيثان مع محلول ‎NaOH‎ المخفف؟\n• الإجابة النموذجية: الإيثانول وبروميد الصوديوم.\n\n3. مستوى الاستدلال: ما الكاشف الذي يختزل الأحماض الكربوكسيلية إلى كحولات؟\n• الإجابة النموذجية: ‎LiAlH₄‎.", "1. مستوى المعرفة: اكتب معادلة تحضير الإيثانول من الإيثين.\n• الإجابة النموذجية: ‎C₂H₄(g) + H₂O(g) → CH₃CH₂OH(l)‎ بوجود ‎H₃PO₄‎\n\n2. مستوى التطبيق: ما ناتج تفاعل الإيثين مع محلول ‎KMnO₄‎ البارد المخفف المحمض؟\n• الإجابة النموذجية: إيثان-1،2-دايول (كحول ثنائي الهيدروكسيل).\n\n3. مستوى الاستدلال: اقترح طريقة لتحضير بروبان-2-ول من البروبانون.\n• الإجابة النموذجية: الاختزال بـ ‎NaBH₄‎.", "إرشاد للطالب: مراجعة ص 154–156 وإكمال الخريطة الذهنية ونشاط 4-7 ص 98 والسؤالين 16 و17\nإرشاد لولي الأمر: متابعة الابن في تذكر الكاشف والظروف لكل طريقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=23"], "h": ["<ol class=\"ol\"><li>يذكر تفاعلات تحضير الكحولات (المواد المتفاعلة وظروف التفاعل): الإضافة الإلكتروفيلية للبخار، والاستبدال النيوكليوفيلي، والأكسدة، والتحلل المائي للإسترات، والاختزال (15 دقيقة)<\/li><li>يكتب معادلات تحضير الكحولات بالطرائق المختلفة (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يختار طريقة مناسبة لتحضير كحول محدد من مادة أولية معطاة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يذكر تفاعلات تحضير الكحولات (المواد المتفاعلة وظروف التفاعل): الإضافة الإلكتروفيلية للبخار، والاستبدال النيوكليوفيلي، والأكسدة، والتحلل المائي للإسترات، والاختزال<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يكتب معادلات تحضير الكحولات بالطرائق المختلفة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يختار طريقة مناسبة لتحضير كحول محدد من مادة أولية معطاة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">الخريطة الذهنية<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الإضافة الإلكتروفيلية (بخار الماء + ألكين ‎+ H₃PO₄‎)، الاستبدال النيوكليوفيلي (هالوجينوألكان ‎+ NaOH‎ مخفف)، الأكسدة بـ ‎KMnO₄‎ البارد (دايول)، التحلل المائي للإستر، الاختزال (‎NaBH₄‎، ‎LiAlH₄‎).<\/p>", "<p>يكتب المعلم الإيثانول في الوسط ويسأل: «من كم مادة مختلفة درسناها يمكن الوصول إلى الإيثانول؟» ويرسم الأسهم مع الطلبة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويبدأ الخريطة، والطلبة يقترحون مواد أولية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «مراجعة تكوين الكحولات من وحدات أخرى وبعض الطرائق الجديدة» ويشرح الطرائق الخمس بمعادلاتها، والطلبة يكتبون المعادلات ويكملون الخريطة الذهنية (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم «اختزال الألدهيدات والكيتونات» ويوجه حل نشاط 4-7 (ص 98)، والطلبة يحلون النشاط ويحددون الكاشف والظروف لكل طريقة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الخريطة الذهنية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ظروف تحضير الإيثانول من الإيثين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تفاعل الإيثين مع بخار الماء بوجود حمض الفوسفوريك المركز حفازًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ناتج تسخين بروموإيثان مع محلول ‎NaOH‎ المخفف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الإيثانول وبروميد الصوديوم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الكاشف الذي يختزل الأحماض الكربوكسيلية إلى كحولات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎LiAlH₄‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة تحضير الإيثانول من الإيثين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎C₂H₄(g) + H₂O(g) → CH₃CH₂OH(l)‎ بوجود ‎H₃PO₄‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ناتج تفاعل الإيثين مع محلول ‎KMnO₄‎ البارد المخفف المحمض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إيثان-1،2-دايول (كحول ثنائي الهيدروكسيل).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح طريقة لتحضير بروبان-2-ول من البروبانون.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الاختزال بـ ‎NaBH₄‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 154–156 وإكمال الخريطة الذهنية ونشاط 4-7 ص 98 والسؤالين 16 و17<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في تذكر الكاشف والظروف لكل طريقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=23<\/p>"]}, {"axis": "الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ومراجعة الوحدة", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "تفاعلات تحضير الكحولات"], ["الحصة", "2 من 2"], ["محور الحصة", "الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ومراجعة الوحدة"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 157–160 + كتاب التجارب ص 100"], ["دليل المعلم", "ص 195–201"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-7: تحضير الكحولات ص 98؛ الاستقصاء العملي 4-1: تحديد أربعة مركبات عضوية مجهولة ص 100"]], "t": ["1. يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة (20 دقيقة)\n2. يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير (10 دقائق)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة (10 دقائق)", "1. تطبيق: يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة\n2. تحليل: يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير\n3. تقييم (مخرج آخر): يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات\n- الاستقصاء العملي", "- الكتاب\n- أخرى: أربع عينات مجهولة (كحول أولي، كحول ثالثي، ألدهيد، حمض كربوكسيلي)، الكواشف المناسبة، حمام مائي", "تحديد الهوية، مخطط الاختبارات، الاختبار المميز، النتيجة الموجبة والسالبة، الاستنتاج المبرر.", "يعرض المعلم أربعة أنابيب مرقمة ويقول: «في كل أنبوب مركب مما درسناه في الوحدة؛ مهمتكم اليوم أن تكونوا محققين كيميائيين.»", "1. يعرض المعلم المهمة وقواعد السلامة، والطلبة يخططون ترتيب الاختبارات في مخطط (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجه المعلم تنفيذ الاستقصاء العملي 4-1 (كتاب التجارب ص 100)، والطلبة يجرون الاختبارات ويسجلون الملاحظات ويستنتجون الهوية (19 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يناقش المعلم النتائج ومبررات الاستنتاج، والطلبة يعرضون استنتاجاتهم ويقارنونها (7 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «ما العينة التي تبقي ثنائي الكرومات برتقاليًا»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – من الدقم إلى المختبر: ترسم المجموعات مخططًا يبيّن تحضير الإيثانول بإضافة الماء إلى الإيثين وظروف التفاعل، وتربطه بصناعات التكرير والبتروكيماويات في المنطقة الاقتصادية الخاصة بالدقم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما الاختبار الذي يميز الحمض الكربوكسيلي من بين العينات؟\n• الإجابة النموذجية: إضافة كربونات الصوديوم وملاحظة الفوران.\n\n2. مستوى التطبيق: كيف تميز الألدهيد عن الكحول الأولي؟\n• الإجابة النموذجية: بكاشف فهلينج أو تولن (الألدهيد يعطي نتيجة موجبة).\n\n3. مستوى الاستدلال: ما العينة التي تبقي ثنائي الكرومات برتقاليًا؟\n• الإجابة النموذجية: الكحول الثالثي.", "1. مستوى المعرفة: رتب الاختبارات ترتيبًا منطقيًا لتحديد هوية العينات الأربع.\n• الإجابة النموذجية: كربونات الصوديوم أولًا (الحمض)، ثم فهلينج أو تولن (الألدهيد)، ثم ثنائي الكرومات (يميز الأولي من الثالثي).\n\n2. مستوى التطبيق: لماذا يجب استخدام كمية صغيرة من العينة في كل اختبار؟\n• الإجابة النموذجية: للحفاظ على عينة كافية لبقية الاختبارات ولأسباب السلامة.\n\n3. مستوى الاستدلال: عينة لم تتفاعل مع الكربونات، وأعطت لونًا أخضر مع ثنائي الكرومات، ولم تتفاعل مع فهلينج، وأعطت راسبًا أصفر مع اليود القلوي. ما هي على الأرجح؟\n• الإجابة النموذجية: كحول ثانوي يحتوي ‎CH₃CH(OH)–‎، مثل بروبان-2-ول.", "إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 ومراجعة ملخص الوحدة ص 157 وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=23"], "h": ["<ol class=\"ol\"><li>يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة (20 دقيقة)<\/li><li>يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يخطط وينفذ سلسلة اختبارات (كربونات، ثنائي الكرومات، فهلينج أو تولن، اليود القلوي) لتحديد هوية مركبات عضوية مجهولة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر نتائج الاختبارات ويستنتج هوية كل مركب مع التبرير<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم تعلمه في الوحدة الرابعة بقائمة التقويم الذاتي ويحل أسئلة مختارة من نهاية الوحدة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">أخرى: أربع عينات مجهولة (كحول أولي، كحول ثالثي، ألدهيد، حمض كربوكسيلي)، الكواشف المناسبة، حمام مائي<\/span><\/div>", "<p>تحديد الهوية، مخطط الاختبارات، الاختبار المميز، النتيجة الموجبة والسالبة، الاستنتاج المبرر.<\/p>", "<p>يعرض المعلم أربعة أنابيب مرقمة ويقول: «في كل أنبوب مركب مما درسناه في الوحدة؛ مهمتكم اليوم أن تكونوا محققين كيميائيين.»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المهمة وقواعد السلامة، والطلبة يخططون ترتيب الاختبارات في مخطط (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم تنفيذ الاستقصاء العملي 4-1 (كتاب التجارب ص 100)، والطلبة يجرون الاختبارات ويسجلون الملاحظات ويستنتجون الهوية (19 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يناقش المعلم النتائج ومبررات الاستنتاج، والطلبة يعرضون استنتاجاتهم ويقارنونها (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «ما العينة التي تبقي ثنائي الكرومات برتقاليًا»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – من الدقم إلى المختبر: ترسم المجموعات مخططًا يبيّن تحضير الإيثانول بإضافة الماء إلى الإيثين وظروف التفاعل، وتربطه بصناعات التكرير والبتروكيماويات في المنطقة الاقتصادية الخاصة بالدقم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الاختبار الذي يميز الحمض الكربوكسيلي من بين العينات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إضافة كربونات الصوديوم وملاحظة الفوران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف تميز الألدهيد عن الكحول الأولي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بكاشف فهلينج أو تولن (الألدهيد يعطي نتيجة موجبة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما العينة التي تبقي ثنائي الكرومات برتقاليًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الكحول الثالثي.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> رتب الاختبارات ترتيبًا منطقيًا لتحديد هوية العينات الأربع.<br><span style=\"opacity:.85\">• الإجابة النموذجية: كربونات الصوديوم أولًا (الحمض)، ثم فهلينج أو تولن (الألدهيد)، ثم ثنائي الكرومات (يميز الأولي من الثالثي).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يجب استخدام كمية صغيرة من العينة في كل اختبار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: للحفاظ على عينة كافية لبقية الاختبارات ولأسباب السلامة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> عينة لم تتفاعل مع الكربونات، وأعطت لونًا أخضر مع ثنائي الكرومات، ولم تتفاعل مع فهلينج، وأعطت راسبًا أصفر مع اليود القلوي. ما هي على الأرجح؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كحول ثانوي يحتوي ‎CH₃CH(OH)–‎، مثل بروبان-2-ول.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 4-1 ومراجعة ملخص الوحدة ص 157 وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=23<\/p>"]}]}]);
let st={m:'sep',l:0,p:0};
try{const s=JSON.parse(localStorage.getItem('noorcopy_'+document.title)||'null');if(s&&D[s.l])st=s;}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('noorcopy_'+document.title,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function buildSelect(){let h='',u='';D.forEach((L,i)=>{if(L.unit!==u){if(u)h+='</optgroup>';u=L.unit;h+=`<optgroup label="${esc(u)}">`}h+=`<option value="${i}">${esc(L.title)} (${L.periods.length} حصص)</option>`});h+='</optgroup>';$('les').innerHTML=h}
function render(){
 const L=D[st.l];if(st.p>=L.periods.length)st.p=0;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));
 $('status').textContent=st.m==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة ${st.p+1} من ${L.periods.length}`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم ${L.periods.length} حصص`;
 $('les').value=st.l;
 const tabs=$('tabs');
 if(st.m==='sep'){tabs.style.display='flex';tabs.innerHTML=L.periods.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}">الحصة ${p.n}: ${esc(p.axis)}</button>`).join('')}
 else tabs.style.display='none';
 let rows='';
 if(st.m==='sep'){const hi=L.periods[st.p].hi;rows=hi.map((r,k)=>`<div class="${k===4?'w':''}"><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')}
 else{const h0=L.periods[0].hi;rows=[h0[0],h0[1],h0[2]].map(r=>`<div><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')+
  `<div><b>كتاب الطالب:</b>${esc(L.sb)}</div><div><b>${h0[7][0]}:</b>${esc(h0[7][1])}</div><div><b>${h0[8][0]}:</b>${esc(h0[8][1])}</div>`+
  `<div class="w"><b>الحصص:</b><br>${L.periods.map(p=>`الحصة ${p.n}: ${esc(p.axis)} — ${esc(p.hi[5][1])}`).join('<br>')}</div>`}
 $('info').innerHTML=rows;
 $('cards').innerHTML=FIELDS.map((f,i)=>`<div class="card"><div class="ch"><div class="ct"><span class="num">${i+1}</span>${f}</div><button class="copy" data-f="${i}">نسخ</button></div><div class="cb" id="cb${i}">${fieldHtml(i)}</div></div>`).join('');
 save();
}
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#mode button');if(m){st.m=m.dataset.m;render();return}
 const tb=e.target.closest('#tabs button');if(tb){st.p=+tb.dataset.i;render();return}
 const c=e.target.closest('.copy');if(c){const i=+c.dataset.f,t=fieldText(i);let ok=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);ok=true}catch(err){}}
  if(!ok)ok=legacyCopy(t);
  if(ok)done(c);else fallback(i,t);}
});
$('les').addEventListener('change',e=>{st.l=+e.target.value;st.p=0;render()});
buildSelect();render();
</script>
