<div class="mode" id="mode"><button data-m="sep" class="on">تحضير منفصل</button><button data-m="com">تحضير مدمج</button></div>
<div class="explain"><b>المنفصل:</b> نموذج نور مستقل لكل حصة؛ اختر الحصة ثم انسخ بنودها العشرة.</div>
<div class="explain"><b>المدمج:</b> نموذج واحد للدرس كله؛ كل بند يضم حصص الدرس بعناوين «الحصة 1، الحصة 2…».</div>

<script>
const FIELDS=["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const D=[{"title":"الأحماض والقواعد","sb":"ص 20–23","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"تعريف أرهينيوس للأحماض والقواعد","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الأحماض والقواعد"],["الحصة","1 من 3"],["محور الحصة","تعريف أرهينيوس للأحماض والقواعد"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 20–21"],["دليل المعلم","ص 51–54"],["كتاب التجارب العملية والأنشطة","نشاط 1-1: الأحماض والقواعد ص 24"]],"t":["1. يصف تعريف أرهينيوس للأحماض بأنها مواد تنتج أيونات ‎H⁺‎ في المحلول المائي\n2. يصف تعريف أرهينيوس للقواعد بأنها مواد تنتج أيونات ‎OH⁻‎ في المحلول المائي\nمخرج تعليمي آخر: يكتب معادلات تأين أحماض وقواعد شائعة في الماء وفق أرهينيوس","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم التعاوني\n- التعلم بالاكتشاف\n- العصف الذهني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورق تباع الشمس ومحاليل مخففة للعرض","الحمض، القاعدة، تعريف أرهينيوس، أيون الهيدروجين ‎H⁺‎، أيون الهيدروكسيد ‎OH⁻‎، المحلول المائي، التأين.","يعرض المعلم كوب عصير ليمون وقطعة صابون ويسأل: «ما الذي يجعل الأول حامضًا والثاني زلقًا؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة» لاستدعاء مفاهيم الصف الحادي عشر.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الأمثلة ويطرح السؤال ويوجه مهام بداية الوحدة\nالطالب: يستدعون خواص الأحماض والقواعد ويجيبون عن المهام\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح تعريف أرهينيوس بأمثلة: ‎HCl‎ و‎HNO₃‎ و‎NaOH‎ و‎KOH‎ في الماء\nالطالب: يكتبون معادلات التأين ويحددون الأيون المميز لكل نوع\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يوزع بطاقات مواد على المجموعات لتصنيفها حمضًا أو قاعدة وفق أرهينيوس مع كتابة المعادلة\nالطالب: يصنفون ويكتبون المعادلات ويعرضونها\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يناقش قصور تعريف أرهينيوس (الأمونيا) تمهيدًا للحصة التالية ثم يدير التقويم الختامي\nالطالب: يجيبون عن أسئلة التقويم ويطرحون تساؤلًا عن ‎NH₃‎\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف الحمض وفق أرهينيوس.\n   الإجابة النموذجية: مادة تنتج أيونات الهيدروجين ‎H⁺‎ عند ذوبانها في الماء.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تأين ‎HNO₃‎ في الماء وفق أرهينيوس.\n   الإجابة النموذجية: ‎HNO₃(aq) → H⁺(aq) + NO₃⁻(aq)‎\n3) (المستوى المتقدم) السؤال: لماذا يصعب تفسير قاعدية ‎NH₃‎ بتعريف أرهينيوس؟\n   الإجابة النموذجية: لأن جزيء ‎NH₃‎ لا يحتوي مجموعة ‎OH⁻‎ ليطلقها، ومع ذلك يجعل المحلول قاعديًا.","1) (مستوى الدعم) السؤال: ما الأيون المميز للقواعد وفق أرهينيوس؟\n   الإجابة النموذجية: أيون الهيدروكسيد ‎OH⁻‎.\n2) (المستوى المتوقع) السؤال: اكتب معادلة تفكك ‎KOH‎ في الماء.\n   الإجابة النموذجية: ‎KOH(aq) → K⁺(aq) + OH⁻(aq)‎\n3) (المستوى المتقدم) السؤال: صنّف وفق أرهينيوس مع التبرير: ‎H₂SO₄‎، ‎Ca(OH)₂‎، ‎CH₄‎.\n   الإجابة النموذجية: ‎H₂SO₄‎ حمض لأنه يطلق ‎H⁺‎؛ ‎Ca(OH)₂‎ قاعدة لأنها تطلق ‎OH⁻‎؛ ‎CH₄‎ ليس حمضًا ولا قاعدة لأنه لا يتأين في الماء.","إرشاد للطالب: مراجعة كتاب الطالب ص 20–21 وكتابة ثلاث معادلات تأين\nإرشاد لولي الأمر: متابعة الابن في التمييز بين الأحماض والقواعد المنزلية بأمان دون تذوق"],"h":["<ol class=\"ol\"><li>يصف تعريف أرهينيوس للأحماض بأنها مواد تنتج أيونات ‎H⁺‎ في المحلول المائي</li><li>يصف تعريف أرهينيوس للقواعد بأنها مواد تنتج أيونات ‎OH⁻‎ في المحلول المائي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يكتب معادلات تأين أحماض وقواعد شائعة في الماء وفق أرهينيوس</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تعريف أرهينيوس للأحماض بأنها مواد تنتج أيونات ‎H⁺‎ في المحلول المائي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف تعريف أرهينيوس للقواعد بأنها مواد تنتج أيونات ‎OH⁻‎ في المحلول المائي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يكتب معادلات تأين أحماض وقواعد شائعة في الماء وفق أرهينيوس</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">العصف الذهني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: ورق تباع الشمس ومحاليل مخففة للعرض</span></div>","<p>الحمض، القاعدة، تعريف أرهينيوس، أيون الهيدروجين ‎H⁺‎، أيون الهيدروكسيد ‎OH⁻‎، المحلول المائي، التأين.</p>","<p>يعرض المعلم كوب عصير ليمون وقطعة صابون ويسأل: «ما الذي يجعل الأول حامضًا والثاني زلقًا؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة» لاستدعاء مفاهيم الصف الحادي عشر.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الأمثلة ويطرح السؤال ويوجه مهام بداية الوحدة</td><td>يستدعون خواص الأحماض والقواعد ويجيبون عن المهام</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح تعريف أرهينيوس بأمثلة: ‎HCl‎ و‎HNO₃‎ و‎NaOH‎ و‎KOH‎ في الماء</td><td>يكتبون معادلات التأين ويحددون الأيون المميز لكل نوع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوزع بطاقات مواد على المجموعات لتصنيفها حمضًا أو قاعدة وفق أرهينيوس مع كتابة المعادلة</td><td>يصنفون ويكتبون المعادلات ويعرضونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يناقش قصور تعريف أرهينيوس (الأمونيا) تمهيدًا للحصة التالية ثم يدير التقويم الختامي</td><td>يجيبون عن أسئلة التقويم ويطرحون تساؤلًا عن ‎NH₃‎</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف الحمض وفق أرهينيوس.</td><td>مادة تنتج أيونات الهيدروجين ‎H⁺‎ عند ذوبانها في الماء.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تأين ‎HNO₃‎ في الماء وفق أرهينيوس.</td><td>‎HNO₃(aq) → H⁺(aq) + NO₃⁻(aq)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يصعب تفسير قاعدية ‎NH₃‎ بتعريف أرهينيوس؟</td><td>لأن جزيء ‎NH₃‎ لا يحتوي مجموعة ‎OH⁻‎ ليطلقها، ومع ذلك يجعل المحلول قاعديًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأيون المميز للقواعد وفق أرهينيوس؟</td><td>أيون الهيدروكسيد ‎OH⁻‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب معادلة تفكك ‎KOH‎ في الماء.</td><td>‎KOH(aq) → K⁺(aq) + OH⁻(aq)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صنّف وفق أرهينيوس مع التبرير: ‎H₂SO₄‎، ‎Ca(OH)₂‎، ‎CH₄‎.</td><td>‎H₂SO₄‎ حمض لأنه يطلق ‎H⁺‎؛ ‎Ca(OH)₂‎ قاعدة لأنها تطلق ‎OH⁻‎؛ ‎CH₄‎ ليس حمضًا ولا قاعدة لأنه لا يتأين في الماء.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة كتاب الطالب ص 20–21 وكتابة ثلاث معادلات تأين</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين الأحماض والقواعد المنزلية بأمان دون تذوق</p>"]},{"axis":"نظرية برونستد-لوري للأحماض والقواعد","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الأحماض والقواعد"],["الحصة","2 من 3"],["محور الحصة","نظرية برونستد-لوري للأحماض والقواعد"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 21–22"],["دليل المعلم","ص 51–54"],["كتاب التجارب العملية والأنشطة","نشاط 1-1: الأحماض والقواعد ص 24"]],"t":["1. يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون\n2. يحدد الحمض والقاعدة في تفاعلات انتقال البروتون\nمخرج تعليمي آخر: يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: كرات ورقية تمثل البروتونات","برونستد-لوري، مانح البروتون، مستقبل البروتون، انتقال البروتون، أيون الهيدرونيوم ‎H₃O⁺‎، المادة المترددة (الأمفوتيرية).","يمرر المعلم كرة صغيرة بين طالبين ويسأل: «من أعطى ومن أخذ؟ لو كانت الكرة بروتونًا، فمن الحمض ومن القاعدة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يمثل انتقال البروتون بتمرير الكرة\nالطالب: يسمّون المانح والمستقبل\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح نظرية برونستد-لوري بأمثلة: ‎HCl + H₂O‎، ‎NH₃ + H₂O‎، ‎HCl + NH₃‎\nالطالب: يحددون المانح والمستقبل في كل معادلة\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يقدم تفاعلات للماء مع حمض ومع قاعدة ليستنتجوا تردده\nالطالب: يحللون التفاعلات في أزواج ويكتبون دور الماء\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف القاعدة وفق برونستد-لوري.\n   الإجابة النموذجية: مادة تستقبل بروتونًا ‎(H⁺)‎.\n2) (المستوى المتوقع) السؤال: حدد الحمض والقاعدة في: ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎.\n   الإجابة النموذجية: الماء حمض (مانح للبروتون) والأمونيا قاعدة (مستقبلة).\n3) (المستوى المتقدم) السؤال: لماذا يُعد الماء مادة مترددة؟\n   الإجابة النموذجية: لأنه يعمل قاعدة مع ‎HCl (‎يستقبل البروتون) وحمضًا مع ‎NH₃ (‎يمنح البروتون).","1) (مستوى الدعم) السؤال: ما الأيون الناتج عند استقبال الماء بروتونًا؟\n   الإجابة النموذجية: أيون الهيدرونيوم ‎H₃O⁺‎.\n2) (المستوى المتوقع) السؤال: حدد الحمض والقاعدة في: ‎HCl(g) + NH₃(g) → NH₄Cl(s)‎.\n   الإجابة النموذجية: ‎HCl‎ حمض يمنح البروتون، و‎NH₃‎ قاعدة تستقبله.\n3) (المستوى المتقدم) السؤال: لماذا يُعد تعريف برونستد-لوري أشمل من أرهينيوس؟\n   الإجابة النموذجية: لأنه لا يشترط الماء ولا وجود ‎OH⁻‎ في القاعدة، فيفسر تفاعلات في الحالة الغازية وقاعدية ‎NH₃‎.","إرشاد للطالب: مراجعة ص 21–22 وحل تدريبين في تحديد المانح والمستقبل\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «تمرير الكرة» لشرح انتقال البروتون"],"h":["<ol class=\"ol\"><li>يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون</li><li>يحدد الحمض والقاعدة في تفاعلات انتقال البروتون</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد الحمض والقاعدة في تفاعلات انتقال البروتون</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: كرات ورقية تمثل البروتونات</span></div>","<p>برونستد-لوري، مانح البروتون، مستقبل البروتون، انتقال البروتون، أيون الهيدرونيوم ‎H₃O⁺‎، المادة المترددة (الأمفوتيرية).</p>","<p>يمرر المعلم كرة صغيرة بين طالبين ويسأل: «من أعطى ومن أخذ؟ لو كانت الكرة بروتونًا، فمن الحمض ومن القاعدة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يمثل انتقال البروتون بتمرير الكرة</td><td>يسمّون المانح والمستقبل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح نظرية برونستد-لوري بأمثلة: ‎HCl + H₂O‎، ‎NH₃ + H₂O‎، ‎HCl + NH₃‎</td><td>يحددون المانح والمستقبل في كل معادلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يقدم تفاعلات للماء مع حمض ومع قاعدة ليستنتجوا تردده</td><td>يحللون التفاعلات في أزواج ويكتبون دور الماء</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف القاعدة وفق برونستد-لوري.</td><td>مادة تستقبل بروتونًا ‎(H⁺)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>حدد الحمض والقاعدة في: ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎.</td><td>الماء حمض (مانح للبروتون) والأمونيا قاعدة (مستقبلة).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد الماء مادة مترددة؟</td><td>لأنه يعمل قاعدة مع ‎HCl (‎يستقبل البروتون) وحمضًا مع ‎NH₃ (‎يمنح البروتون).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأيون الناتج عند استقبال الماء بروتونًا؟</td><td>أيون الهيدرونيوم ‎H₃O⁺‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>حدد الحمض والقاعدة في: ‎HCl(g) + NH₃(g) → NH₄Cl(s)‎.</td><td>‎HCl‎ حمض يمنح البروتون، و‎NH₃‎ قاعدة تستقبله.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد تعريف برونستد-لوري أشمل من أرهينيوس؟</td><td>لأنه لا يشترط الماء ولا وجود ‎OH⁻‎ في القاعدة، فيفسر تفاعلات في الحالة الغازية وقاعدية ‎NH₃‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 21–22 وحل تدريبين في تحديد المانح والمستقبل</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه «تمرير الكرة» لشرح انتقال البروتون</p>"]},{"axis":"الأزواج المترافقة وحل الأسئلة 1–4 ونشاط 1-1","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الأحماض والقواعد"],["الحصة","3 من 3"],["محور الحصة","الأزواج المترافقة وحل الأسئلة 1–4 ونشاط 1-1"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 22–23 + كتاب التجارب ص 24"],["دليل المعلم","ص 51–54"],["كتاب التجارب العملية والأنشطة","نشاط 1-1: الأحماض والقواعد ص 24"]],"t":["1. يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما\n2. يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية\nمخرج تعليمي آخر: يحل أسئلة الموضوع 1–4 ونشاط 1-1","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم التعاوني\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","الحمض المرافق، القاعدة المرافقة، الزوج المترافق، الفرق بمقدار بروتون واحد.","يكتب المعلم ‎HCl‎ و‎Cl⁻‎ ثم ‎NH₃‎ و‎NH₄⁺‎ ويسأل: «ما الفرق بين كل جزيئين؟ وكيف يرتبطان؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الأزواج ويطرح السؤال\nالطالب: يستنتجون أن الفرق بروتون واحد\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الحمض المرافق والقاعدة المرافقة ويحدد الأزواج في أمثلة\nالطالب: يرسمون أقواسًا تربط كل زوج مترافق في المعادلات\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 1-1 (كتاب التجارب ص 24) والأسئلة 1–4\nالطالب: يحلون في أزواج ويصححون معًا\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الأحماض والقواعد\nالطالب: يتنافسون ويراجعون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما القاعدة المرافقة لـ ‎H₂SO₄‎؟\n   الإجابة النموذجية: ‎HSO₄⁻‎.\n2) (المستوى المتوقع) السؤال: ما الحمض المرافق لـ ‎NH₃‎؟\n   الإجابة النموذجية: ‎NH₄⁺‎.\n3) (المستوى المتقدم) السؤال: حدد الزوجين المترافقين في: ‎CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺‎.\n   الإجابة النموذجية: ‎CH₃COOH/CH₃COO⁻‎ و‎H₃O⁺/H₂O‎.","1) (مستوى الدعم) السؤال: ما الفرق بين الحمض وقاعدته المرافقة؟\n   الإجابة النموذجية: بروتون واحد ‎(H⁺)‎.\n2) (المستوى المتوقع) السؤال: اكتب القاعدة المرافقة للماء والحمض المرافق له.\n   الإجابة النموذجية: القاعدة المرافقة ‎OH⁻‎، والحمض المرافق ‎H₃O⁺‎.\n3) (المستوى المتقدم) السؤال: في التفاعل ‎HNO₃ + H₂SO₄ ⇌ H₂NO₃⁺ + HSO₄⁻‎، حدد الحمض والقاعدة والزوجين المترافقين.\n   الإجابة النموذجية: ‎H₂SO₄‎ حمض و‎HNO₃‎ قاعدة؛ الزوجان: ‎H₂SO₄/HSO₄⁻‎ و‎H₂NO₃⁺/HNO₃‎.","إرشاد للطالب: إكمال نشاط 1-1 ص 24 والأسئلة 1–4\nإرشاد لولي الأمر: متابعة الابن في كتابة أزواج مترافقة لأمثلة جديدة"],"h":["<ol class=\"ol\"><li>يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما</li><li>يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل أسئلة الموضوع 1–4 ونشاط 1-1</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل أسئلة الموضوع 1–4 ونشاط 1-1</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الحمض المرافق، القاعدة المرافقة، الزوج المترافق، الفرق بمقدار بروتون واحد.</p>","<p>يكتب المعلم ‎HCl‎ و‎Cl⁻‎ ثم ‎NH₃‎ و‎NH₄⁺‎ ويسأل: «ما الفرق بين كل جزيئين؟ وكيف يرتبطان؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الأزواج ويطرح السؤال</td><td>يستنتجون أن الفرق بروتون واحد</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الحمض المرافق والقاعدة المرافقة ويحدد الأزواج في أمثلة</td><td>يرسمون أقواسًا تربط كل زوج مترافق في المعادلات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-1 (كتاب التجارب ص 24) والأسئلة 1–4</td><td>يحلون في أزواج ويصححون معًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على الأحماض والقواعد</td><td>يتنافسون ويراجعون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما القاعدة المرافقة لـ ‎H₂SO₄‎؟</td><td>‎HSO₄⁻‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الحمض المرافق لـ ‎NH₃‎؟</td><td>‎NH₄⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>حدد الزوجين المترافقين في: ‎CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺‎.</td><td>‎CH₃COOH/CH₃COO⁻‎ و‎H₃O⁺/H₂O‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الفرق بين الحمض وقاعدته المرافقة؟</td><td>بروتون واحد ‎(H⁺)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب القاعدة المرافقة للماء والحمض المرافق له.</td><td>القاعدة المرافقة ‎OH⁻‎، والحمض المرافق ‎H₃O⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>في التفاعل ‎HNO₃ + H₂SO₄ ⇌ H₂NO₃⁺ + HSO₄⁻‎، حدد الحمض والقاعدة والزوجين المترافقين.</td><td>‎H₂SO₄‎ حمض و‎HNO₃‎ قاعدة؛ الزوجان: ‎H₂SO₄/HSO₄⁻‎ و‎H₂NO₃⁺/HNO₃‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-1 ص 24 والأسئلة 1–4</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة أزواج مترافقة لأمثلة جديدة</p>"]}]},{"title":"الأحماض والقواعد القوية والضعيفة","sb":"ص 24–25","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"التأين الكلي والجزئي والتمييز بين القوية والضعيفة","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","الأحماض والقواعد القوية والضعيفة"],["الحصة","1 من 1"],["محور الحصة","التأين الكلي والجزئي والتمييز بين القوية والضعيفة"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 24–25"],["دليل المعلم","ص 54–57"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي\n2. يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم)\nمخرج تعليمي آخر: يميز بين مفهومي القوة والتركيز للحمض","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: محلولا ‎HCl‎ و‎CH₃COOH‎ بالتركيز نفسه، شرائط مغنيسيوم، جهاز توصيل كهربائي، مقياس ‎pH‎","الحمض القوي، الحمض الضعيف، التأين الكلي، التأين الجزئي، الاتزان الديناميكي، القوة مقابل التركيز.","يضع المعلم شريط مغنيسيوم في محلولي ‎HCl‎ وحمض الإيثانويك بالتركيز نفسه ويسأل: «التركيز واحد؛ فلماذا يختلف الفوران؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يلاحظون الفرق ويقترحون تفسيرًا\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح التأين الكلي والجزئي ورموز المعادلات (→ و⇌) وأمثلة القواعد القوية والضعيفة\nالطالب: يكتبون معادلات تأين حمض قوي وآخر ضعيف\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: ينفذ نشاط «التمييز بين الأحماض القوية والضعيفة» بقياس ‎pH‎ والتوصيل\nالطالب: يسجلون القراءات ويقارنون ويحلون السؤالين 5 و6\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما المقصود بالحمض القوي؟\n   الإجابة النموذجية: حمض يتأين كليًا في المحلول المائي.\n2) (المستوى المتوقع) السؤال: لماذا يكون ‎pH‎ محلول ‎HCl‎ أقل من ‎pH‎ حمض الإيثانويك بالتركيز نفسه؟\n   الإجابة النموذجية: لأن ‎HCl‎ يتأين كليًا فيكون ‎[H⁺]‎ أعلى.\n3) (المستوى المتقدم) السؤال: ما الفرق بين حمض مركز وحمض قوي؟\n   الإجابة النموذجية: التركيز كمية الحمض في حجم معين، والقوة مدى تأينه؛ فقد يكون الحمض ضعيفًا ومركزًا.","1) (مستوى الدعم) السؤال: اكتب معادلة تأين حمض الإيثانويك في الماء.\n   الإجابة النموذجية: ‎CH₃COOH(aq) ⇌ CH₃COO⁻(aq) + H⁺(aq)‎\n2) (المستوى المتوقع) السؤال: اذكر مثالًا لقاعدة قوية وآخر لقاعدة ضعيفة.\n   الإجابة النموذجية: قاعدة قوية: ‎NaOH‎؛ قاعدة ضعيفة: ‎NH₃‎.\n3) (المستوى المتقدم) السؤال: اقترح تجربتين للتمييز بين محلولي حمض قوي وحمض ضعيف بالتركيز نفسه.\n   الإجابة النموذجية: قياس ‎pH (‎القوي أقل)، وقياس التوصيل الكهربائي (القوي أعلى)، أو سرعة التفاعل مع ‎Mg (‎القوي أسرع).","إرشاد للطالب: مراجعة ص 24–25 وحل السؤالين 5 و6\nإرشاد لولي الأمر: الحديث مع الابن عن الأحماض الضعيفة في الأطعمة كالخل والليمون"],"h":["<ol class=\"ol\"><li>يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي</li><li>يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين مفهومي القوة والتركيز للحمض</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين مفهومي القوة والتركيز للحمض</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: محلولا ‎HCl‎ و‎CH₃COOH‎ بالتركيز نفسه، شرائط مغنيسيوم، جهاز توصيل كهربائي، مقياس ‎pH‎</span></div>","<p>الحمض القوي، الحمض الضعيف، التأين الكلي، التأين الجزئي، الاتزان الديناميكي، القوة مقابل التركيز.</p>","<p>يضع المعلم شريط مغنيسيوم في محلولي ‎HCl‎ وحمض الإيثانويك بالتركيز نفسه ويسأل: «التركيز واحد؛ فلماذا يختلف الفوران؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>ينفذ العرض ويطرح السؤال</td><td>يلاحظون الفرق ويقترحون تفسيرًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح التأين الكلي والجزئي ورموز المعادلات (→ و⇌) وأمثلة القواعد القوية والضعيفة</td><td>يكتبون معادلات تأين حمض قوي وآخر ضعيف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>ينفذ نشاط «التمييز بين الأحماض القوية والضعيفة» بقياس ‎pH‎ والتوصيل</td><td>يسجلون القراءات ويقارنون ويحلون السؤالين 5 و6</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بالحمض القوي؟</td><td>حمض يتأين كليًا في المحلول المائي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون ‎pH‎ محلول ‎HCl‎ أقل من ‎pH‎ حمض الإيثانويك بالتركيز نفسه؟</td><td>لأن ‎HCl‎ يتأين كليًا فيكون ‎[H⁺]‎ أعلى.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الفرق بين حمض مركز وحمض قوي؟</td><td>التركيز كمية الحمض في حجم معين، والقوة مدى تأينه؛ فقد يكون الحمض ضعيفًا ومركزًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب معادلة تأين حمض الإيثانويك في الماء.</td><td>‎CH₃COOH(aq) ⇌ CH₃COO⁻(aq) + H⁺(aq)‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر مثالًا لقاعدة قوية وآخر لقاعدة ضعيفة.</td><td>قاعدة قوية: ‎NaOH‎؛ قاعدة ضعيفة: ‎NH₃‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح تجربتين للتمييز بين محلولي حمض قوي وحمض ضعيف بالتركيز نفسه.</td><td>قياس ‎pH (‎القوي أقل)، وقياس التوصيل الكهربائي (القوي أعلى)، أو سرعة التفاعل مع ‎Mg (‎القوي أسرع).</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 24–25 وحل السؤالين 5 و6</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الأحماض الضعيفة في الأطعمة كالخل والليمون</p>"]}]},{"title":"ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎","sb":"ص 26–30","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"ثابت تأين الماء ‎Kw‎ وتركيز ‎H⁺‎ في الماء النقي","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎"],["الحصة","1 من 3"],["محور الحصة","ثابت تأين الماء ‎Kw‎ وتركيز ‎H⁺‎ في الماء النقي"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 26–27"],["دليل المعلم","ص 57–60"],["كتاب التجارب العملية والأنشطة","نشاط 1-3: أيونات الهيدروجين في معادلات ثابت الاتزان ص 26"]],"t":["1. يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎\n2. يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎\nمخرج تعليمي آخر: يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة","المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية","التأين الذاتي للماء، ثابت تأين الماء ‎Kw‎، ‎[H⁺]‎، ‎[OH⁻]‎، المحلول المتعادل، ‎298 K‎.","يسأل المعلم: «الماء النقي يوصل الكهرباء بدرجة ضعيفة جدًا؛ من أين تأتي الأيونات في ماء لا يحتوي أي مادة مذابة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويستقبل الفرضيات\nالطالب: يستنتجون حدوث تأين ذاتي ضعيف للماء\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح معادلة التأين الذاتي وتعبير ‎Kw‎ وقيمته\nالطالب: يكتبون التعبير ويحسبون ‎[H⁺]‎ في الماء النقي\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مسائل حساب ‎[OH⁻]‎ من ‎[H⁺]‎ والعكس\nالطالب: يحلون أربع مسائل متدرجة في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب تعبير ‎Kw‎.\n   الإجابة النموذجية: ‎Kw = [H⁺][OH⁻]‎\n2) (المستوى المتوقع) السؤال: احسب ‎[H⁺]‎ في الماء النقي عند ‎298 K‎.\n   الإجابة النموذجية: ‎[H⁺] = √(1.00 × 10⁻¹⁴) = 1.00 × 10⁻⁷ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: احسب ‎[OH⁻]‎ في محلول فيه ‎[H⁺] = 1.0 × 10⁻³ mol/dm³‎.\n   الإجابة النموذجية: ‎[OH⁻] = 1.0 × 10⁻¹⁴ ÷ 1.0 × 10⁻³ = 1.0 × 10⁻¹¹ mol/dm³‎.","1) (مستوى الدعم) السؤال: ما قيمة ‎Kw‎ عند ‎298 K‎ ووحدتها؟\n   الإجابة النموذجية: ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎.\n2) (المستوى المتوقع) السؤال: احسب ‎[H⁺]‎ في محلول فيه ‎[OH⁻] = 2.0 × 10⁻⁴ mol/dm³‎.\n   الإجابة النموذجية: ‎[H⁺] = 1.0 × 10⁻¹⁴ ÷ 2.0 × 10⁻⁴ = 5.0 × 10⁻¹¹ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: عند ‎323 K‎ يزداد ‎Kw‎. هل يصبح الماء النقي حمضيًا؟ فسّر.\n   الإجابة النموذجية: لا؛ يبقى متعادلًا لأن ‎[H⁺] = [OH⁻]‎ دائمًا في الماء النقي، وإن ازداد كل منهما.","إرشاد للطالب: مراجعة ص 26–27 وحل ثلاث مسائل على ‎Kw‎\nإرشاد لولي الأمر: تشجيع الابن على التدرب على استخدام الآلة الحاسبة العلمية في الأسس"],"h":["<ol class=\"ol\"><li>يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎</li><li>يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف ثابت تأين الماء ‎Kw = [H⁺][OH⁻]‎ ويذكر قيمته ‎1.00 × 10⁻¹⁴ mol²/dm⁶‎ عند ‎298 K‎</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب ‎[H⁺]‎ و‎[OH⁻]‎ في الماء النقي ومحاليل معلومة التركيز باستخدام ‎Kw‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يبقى الماء النقي متعادلًا رغم تغير ‎Kw‎ مع درجة الحرارة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>التأين الذاتي للماء، ثابت تأين الماء ‎Kw‎، ‎[H⁺]‎، ‎[OH⁻]‎، المحلول المتعادل، ‎298 K‎.</p>","<p>يسأل المعلم: «الماء النقي يوصل الكهرباء بدرجة ضعيفة جدًا؛ من أين تأتي الأيونات في ماء لا يحتوي أي مادة مذابة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويستقبل الفرضيات</td><td>يستنتجون حدوث تأين ذاتي ضعيف للماء</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح معادلة التأين الذاتي وتعبير ‎Kw‎ وقيمته</td><td>يكتبون التعبير ويحسبون ‎[H⁺]‎ في الماء النقي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مسائل حساب ‎[OH⁻]‎ من ‎[H⁺]‎ والعكس</td><td>يحلون أربع مسائل متدرجة في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب تعبير ‎Kw‎.</td><td>‎Kw = [H⁺][OH⁻]‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎[H⁺]‎ في الماء النقي عند ‎298 K‎.</td><td>‎[H⁺] = √(1.00 × 10⁻¹⁴) = 1.00 × 10⁻⁷ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎[OH⁻]‎ في محلول فيه ‎[H⁺] = 1.0 × 10⁻³ mol/dm³‎.</td><td>‎[OH⁻] = 1.0 × 10⁻¹⁴ ÷ 1.0 × 10⁻³ = 1.0 × 10⁻¹¹ mol/dm³‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما قيمة ‎Kw‎ عند ‎298 K‎ ووحدتها؟</td><td>‎1.00 × 10⁻¹⁴ mol²/dm⁶‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎[H⁺]‎ في محلول فيه ‎[OH⁻] = 2.0 × 10⁻⁴ mol/dm³‎.</td><td>‎[H⁺] = 1.0 × 10⁻¹⁴ ÷ 2.0 × 10⁻⁴ = 5.0 × 10⁻¹¹ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>عند ‎323 K‎ يزداد ‎Kw‎. هل يصبح الماء النقي حمضيًا؟ فسّر.</td><td>لا؛ يبقى متعادلًا لأن ‎[H⁺] = [OH⁻]‎ دائمًا في الماء النقي، وإن ازداد كل منهما.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 26–27 وحل ثلاث مسائل على ‎Kw‎</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على التدرب على استخدام الآلة الحاسبة العلمية في الأسس</p>"]},{"axis":"مقياس ‎pH‎ وحسابه للأحماض القوية","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎"],["الحصة","2 من 3"],["محور الحصة","مقياس ‎pH‎ وحسابه للأحماض القوية"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 27–29"],["دليل المعلم","ص 57–60"],["كتاب التجارب العملية والأنشطة","نشاط 1-3: أيونات الهيدروجين في معادلات ثابت الاتزان ص 26"]],"t":["1. يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات\n2. يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎\nمخرج تعليمي آخر: يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، مقياس ‎pH‎","الرقم الهيدروجيني ‎pH‎، اللوغاريتم العشري، ‎pH = −log[H⁺]‎، ‎[H⁺] = 10⁻ᵖᴴ‎، مقياس ‎pH‎ اللوغاريتمي، الحمض أحادي البروتون وثنائيه.","يعرض المعلم تركيزين: ‎[H⁺] = 0.1‎ و‎0.0000001 mol/dm³‎ ويسأل: «أيهما أسهل للكتابة والمقارنة؟ ولماذا ابتكر العلماء مقياس ‎pH‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويعرض أصل مقياس ‎pH‎\nالطالب: يستنتجون فائدة اللوغاريتم في تبسيط الأرقام\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح ‎pH = −log[H⁺]‎ وعكسه، ويحل أمثلة لأحماض قوية (‎HCl‎ و‎H₂SO₄‎ بافتراض التأين الكلي)\nالطالب: يحسبون ‎pH‎ ويتحققون بالآلة الحاسبة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: ينفذ نشاط «حساب ‎pH‎ لأحماض قوية بتراكيز مختلفة» مع سلسلة تخفيف\nالطالب: يحسبون ‎pH‎ لكل تخفيف ويستنتجون الزيادة بمقدار 1\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.010 mol/dm³‎.\n   الإجابة النموذجية: ‎[H⁺] = 0.010‎، ‎pH = −log 0.010 = 2.00‎.\n2) (المستوى المتوقع) السؤال: احسب ‎[H⁺]‎ لمحلول ‎pH‎ له 3.50.\n   الإجابة النموذجية: ‎[H⁺] = 10⁻³·⁵ = 3.16 × 10⁻⁴ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لـ ‎pH‎ حمض قوي عند تخفيفه عشر مرات؟\n   الإجابة النموذجية: يزداد بمقدار 1 لأن ‎[H⁺]‎ يقل عشر مرات.","1) (مستوى الدعم) السؤال: عرّف ‎pH‎ رياضيًا.\n   الإجابة النموذجية: سالب لوغاريتم تركيز أيونات الهيدروجين: ‎pH = −log[H⁺]‎.\n2) (المستوى المتوقع) السؤال: احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.050 mol/dm³‎.\n   الإجابة النموذجية: ‎pH = −log 0.050 = 1.30‎.\n3) (المستوى المتقدم) السؤال: احسب ‎pH‎ لمحلول ‎H₂SO₄‎ تركيزه ‎0.050 mol/dm³‎ بافتراض تأينه الكلي، وفسّر اختلافه عن ‎HCl‎ بالتركيز نفسه.\n   الإجابة النموذجية: ‎[H⁺] = 0.10‎، ‎pH = 1.00‎؛ أقل من ‎HCl‎ لأن كل جزيء ‎H₂SO₄‎ يطلق بروتونين.","إرشاد للطالب: مراجعة ص 27–29 وحل خمس مسائل ‎pH‎ متنوعة\nإرشاد لولي الأمر: متابعة الابن في استخدام زر ‎log‎ في الآلة الحاسبة"],"h":["<ol class=\"ol\"><li>يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات</li><li>يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف ‎pH‎ رياضيًا بأنه ‎pH = −log[H⁺]‎ ويستخدمه في الحسابات</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب ‎pH‎ محاليل أحماض قوية بتراكيز مختلفة، ويحسب ‎[H⁺]‎ من ‎pH‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر أثر تخفيف حمض قوي عشر مرات على قيمة ‎pH‎</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية، مقياس ‎pH‎</span></div>","<p>الرقم الهيدروجيني ‎pH‎، اللوغاريتم العشري، ‎pH = −log[H⁺]‎، ‎[H⁺] = 10⁻ᵖᴴ‎، مقياس ‎pH‎ اللوغاريتمي، الحمض أحادي البروتون وثنائيه.</p>","<p>يعرض المعلم تركيزين: ‎[H⁺] = 0.1‎ و‎0.0000001 mol/dm³‎ ويسأل: «أيهما أسهل للكتابة والمقارنة؟ ولماذا ابتكر العلماء مقياس ‎pH‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويعرض أصل مقياس ‎pH‎</td><td>يستنتجون فائدة اللوغاريتم في تبسيط الأرقام</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح ‎pH = −log[H⁺]‎ وعكسه، ويحل أمثلة لأحماض قوية (‎HCl‎ و‎H₂SO₄‎ بافتراض التأين الكلي)</td><td>يحسبون ‎pH‎ ويتحققون بالآلة الحاسبة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>ينفذ نشاط «حساب ‎pH‎ لأحماض قوية بتراكيز مختلفة» مع سلسلة تخفيف</td><td>يحسبون ‎pH‎ لكل تخفيف ويستنتجون الزيادة بمقدار 1</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.010 mol/dm³‎.</td><td>‎[H⁺] = 0.010‎، ‎pH = −log 0.010 = 2.00‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎[H⁺]‎ لمحلول ‎pH‎ له 3.50.</td><td>‎[H⁺] = 10⁻³·⁵ = 3.16 × 10⁻⁴ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث لـ ‎pH‎ حمض قوي عند تخفيفه عشر مرات؟</td><td>يزداد بمقدار 1 لأن ‎[H⁺]‎ يقل عشر مرات.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف ‎pH‎ رياضيًا.</td><td>سالب لوغاريتم تركيز أيونات الهيدروجين: ‎pH = −log[H⁺]‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.050 mol/dm³‎.</td><td>‎pH = −log 0.050 = 1.30‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎pH‎ لمحلول ‎H₂SO₄‎ تركيزه ‎0.050 mol/dm³‎ بافتراض تأينه الكلي، وفسّر اختلافه عن ‎HCl‎ بالتركيز نفسه.</td><td>‎[H⁺] = 0.10‎، ‎pH = 1.00‎؛ أقل من ‎HCl‎ لأن كل جزيء ‎H₂SO₄‎ يطلق بروتونين.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 27–29 وحل خمس مسائل ‎pH‎ متنوعة</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في استخدام زر ‎log‎ في الآلة الحاسبة</p>"]},{"axis":"‎pH‎ القواعد القوية ونشاط 1-3 والأسئلة 7–9","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الماء ‎Kw‎ وحسابات الرقم الهيدروجيني ‎pH‎"],["الحصة","3 من 3"],["محور الحصة","‎pH‎ القواعد القوية ونشاط 1-3 والأسئلة 7–9"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 29–30 + كتاب التجارب ص 26"],["دليل المعلم","ص 57–60"],["كتاب التجارب العملية والأنشطة","نشاط 1-3: أيونات الهيدروجين في معادلات ثابت الاتزان ص 26"]],"t":["1. يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎\n2. يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3)\nمخرج تعليمي آخر: يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة","‎pH‎ القواعد القوية، ‎[OH⁻]‎، ‎Kw‎، القاعدة ثنائية الهيدروكسيد، ‎pOH (‎للتوسع).","يسأل المعلم: «محلول ‎NaOH‎ لا يحتوي تقريبًا أيونات ‎H⁺‎، فكيف نحسب له ‎pH‎؟» ويترك الطلبة يتذكرون ‎Kw‎.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون استخدام ‎Kw‎\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ نشاط «الرقم الهيدروجيني للقواعد القوية» بأمثلة ‎NaOH‎ و‎Ba(OH)₂‎\nالطالب: يتبعون الخطوات: ‎[OH⁻] ← [H⁺] ← pH‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 1-3 (كتاب التجارب ص 26) والأسئلة 7–9\nالطالب: يحلون في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على ‎Kw‎ و‎pH‎\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ‎pH‎ لمحلول ‎NaOH‎ تركيزه ‎0.010 mol/dm³‎.\n   الإجابة النموذجية: ‎[H⁺] = 10⁻¹⁴ ÷ 0.010 = 10⁻¹²‎، ‎pH = 12.00‎.\n2) (المستوى المتوقع) السؤال: ما ‎[OH⁻]‎ في محلول ‎Ba(OH)₂‎ تركيزه ‎0.020 mol/dm³‎؟\n   الإجابة النموذجية: ‎0.040 mol/dm³‎.\n3) (المستوى المتقدم) السؤال: احسب ‎pH‎ للمحلول السابق.\n   الإجابة النموذجية: ‎[H⁺] = 10⁻¹⁴ ÷ 0.040 = 2.5 × 10⁻¹³‎، ‎pH = 12.60‎.","1) (مستوى الدعم) السؤال: ما الخطوة الأولى لحساب ‎pH‎ قاعدة قوية؟\n   الإجابة النموذجية: حساب ‎[OH⁻]‎ من تركيز القاعدة.\n2) (المستوى المتوقع) السؤال: احسب ‎pH‎ لمحلول ‎KOH‎ تركيزه ‎0.0010 mol/dm³‎.\n   الإجابة النموذجية: ‎[H⁺] = 10⁻¹¹‎، ‎pH = 11.00‎.\n3) (المستوى المتقدم) السؤال: محلولا ‎NaOH‎ و‎Ca(OH)₂‎ بالتركيز نفسه ‎0.010 mol/dm³‎؛ أيهما أعلى ‎pH‎؟ وكم الفرق؟\n   الإجابة النموذجية: ‎Ca(OH)₂‎ لأن ‎[OH⁻] = 0.020‎؛ ‎pH = 12.30‎ مقابل 12.00، الفرق 0.30.","إرشاد للطالب: إكمال نشاط 1-3 ص 26 والأسئلة 7–9\nإرشاد لولي الأمر: متابعة الابن في ترتيب خطوات حساب ‎pH‎ للقواعد"],"h":["<ol class=\"ol\"><li>يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎</li><li>يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب ‎pH‎ محاليل قواعد قوية باستخدام ‎Kw‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب تعبيرات ثابت الاتزان المتضمنة أيونات الهيدروجين (نشاط 1-3)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين قاعدتين قويتين مختلفتي عدد مجموعات ‎OH⁻‎ من حيث ‎pH‎</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة</span></div>","<p>‎pH‎ القواعد القوية، ‎[OH⁻]‎، ‎Kw‎، القاعدة ثنائية الهيدروكسيد، ‎pOH (‎للتوسع).</p>","<p>يسأل المعلم: «محلول ‎NaOH‎ لا يحتوي تقريبًا أيونات ‎H⁺‎، فكيف نحسب له ‎pH‎؟» ويترك الطلبة يتذكرون ‎Kw‎.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون استخدام ‎Kw‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ نشاط «الرقم الهيدروجيني للقواعد القوية» بأمثلة ‎NaOH‎ و‎Ba(OH)₂‎</td><td>يتبعون الخطوات: ‎[OH⁻] ← [H⁺] ← pH‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-3 (كتاب التجارب ص 26) والأسئلة 7–9</td><td>يحلون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على ‎Kw‎ و‎pH‎</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎pH‎ لمحلول ‎NaOH‎ تركيزه ‎0.010 mol/dm³‎.</td><td>‎[H⁺] = 10⁻¹⁴ ÷ 0.010 = 10⁻¹²‎، ‎pH = 12.00‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ‎[OH⁻]‎ في محلول ‎Ba(OH)₂‎ تركيزه ‎0.020 mol/dm³‎؟</td><td>‎0.040 mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎pH‎ للمحلول السابق.</td><td>‎[H⁺] = 10⁻¹⁴ ÷ 0.040 = 2.5 × 10⁻¹³‎، ‎pH = 12.60‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطوة الأولى لحساب ‎pH‎ قاعدة قوية؟</td><td>حساب ‎[OH⁻]‎ من تركيز القاعدة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎pH‎ لمحلول ‎KOH‎ تركيزه ‎0.0010 mol/dm³‎.</td><td>‎[H⁺] = 10⁻¹¹‎، ‎pH = 11.00‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>محلولا ‎NaOH‎ و‎Ca(OH)₂‎ بالتركيز نفسه ‎0.010 mol/dm³‎؛ أيهما أعلى ‎pH‎؟ وكم الفرق؟</td><td>‎Ca(OH)₂‎ لأن ‎[OH⁻] = 0.020‎؛ ‎pH = 12.30‎ مقابل 12.00، الفرق 0.30.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-3 ص 26 والأسئلة 7–9</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في ترتيب خطوات حساب ‎pH‎ للقواعد</p>"]}]},{"title":"ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎","sb":"ص 31–37","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"تعبير ثابت التأين ‎Ka‎ وقيمة ‎pKa‎","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"],["الحصة","1 من 4"],["محور الحصة","تعبير ثابت التأين ‎Ka‎ وقيمة ‎pKa‎"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 31–33"],["دليل المعلم","ص 60–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]],"t":["1. يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته\n2. يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض\nمخرج تعليمي آخر: يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎Ka‎ في كتاب الطالب","ثابت تأين الحمض ‎Ka‎، ‎pKa‎، الحمض الضعيف، الاتزان، قوة الحمض، الوحدة ‎mol/dm³‎.","يعرض المعلم جدول قيم ‎Ka‎ لعدة أحماض ويسأل: «ماذا يعني أن ‎Ka‎ لحمض الإيثانويك ‎1.74 × 10⁻⁵‎ بينما لحمض الميثانويك ‎1.6 × 10⁻⁴‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الجدول ويطرح السؤال\nالطالب: يستنتجون أن ‎Ka‎ الأكبر يعني تأينًا أكبر\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح كتابة تعبير ‎Ka‎ لـ ‎HA ⇌ H⁺ + A⁻‎ ووحدته وتعريف ‎pKa‎\nالطالب: يكتبون تعبير ‎Ka‎ لثلاثة أحماض ويحسبون ‎pKa‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مهمة ترتيب أحماض حسب القوة بالقيم المعطاة\nالطالب: يرتبون ويبررون في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب تعبير ‎Ka‎ لحمض الإيثانويك.\n   الإجابة النموذجية: ‎Ka = [CH₃COO⁻][H⁺] / [CH₃COOH]‎\n2) (المستوى المتوقع) السؤال: احسب ‎pKa‎ لحمض ‎Ka‎ له ‎1.74 × 10⁻⁵ mol/dm³‎.\n   الإجابة النموذجية: ‎pKa = −log(1.74 × 10⁻⁵) = 4.76‎.\n3) (المستوى المتقدم) السؤال: أيهما أقوى: حمض ‎pKa‎ له 3.2 أم 4.8؟\n   الإجابة النموذجية: الحمض ذو ‎pKa = 3.2‎ لأن ‎pKa‎ الأصغر يعني ‎Ka‎ أكبر.","1) (مستوى الدعم) السؤال: ما وحدة ‎Ka‎؟\n   الإجابة النموذجية: ‎mol/dm³‎.\n2) (المستوى المتوقع) السؤال: ماذا تدل قيمة ‎Ka‎ الصغيرة جدًا؟\n   الإجابة النموذجية: على أن الحمض ضعيف يتأين بدرجة قليلة.\n3) (المستوى المتقدم) السؤال: رتب تصاعديًا في القوة: ‎HF (Ka = 5.6 × 10⁻⁴)‎، ‎CH₃COOH (1.74 × 10⁻⁵)‎، ‎HCN (4.9 × 10⁻¹⁰)‎.\n   الإجابة النموذجية: ‎HCN < CH₃COOH < HF‎.","إرشاد للطالب: مراجعة ص 31–33 وكتابة تعبيرات ‎Ka‎ لخمسة أحماض\nإرشاد لولي الأمر: تشجيع الابن على عمل بطاقة تلخص العلاقة بين ‎Ka‎ و‎pKa‎ والقوة"],"h":["<ol class=\"ol\"><li>يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته</li><li>يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يكتب تعبير ثابت تأين الحمض الضعيف ‎Ka‎ ويحدد وحدته</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يعرّف ‎pKa = −log Ka‎ ويستخدمه في المقارنة بين قوة الأحماض</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يرتب مجموعة أحماض ضعيفة حسب قوتها بمعلومية ‎Ka‎ أو ‎pKa‎</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: جدول قيم ‎Ka‎ في كتاب الطالب</span></div>","<p>ثابت تأين الحمض ‎Ka‎، ‎pKa‎، الحمض الضعيف، الاتزان، قوة الحمض، الوحدة ‎mol/dm³‎.</p>","<p>يعرض المعلم جدول قيم ‎Ka‎ لعدة أحماض ويسأل: «ماذا يعني أن ‎Ka‎ لحمض الإيثانويك ‎1.74 × 10⁻⁵‎ بينما لحمض الميثانويك ‎1.6 × 10⁻⁴‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الجدول ويطرح السؤال</td><td>يستنتجون أن ‎Ka‎ الأكبر يعني تأينًا أكبر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح كتابة تعبير ‎Ka‎ لـ ‎HA ⇌ H⁺ + A⁻‎ ووحدته وتعريف ‎pKa‎</td><td>يكتبون تعبير ‎Ka‎ لثلاثة أحماض ويحسبون ‎pKa‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مهمة ترتيب أحماض حسب القوة بالقيم المعطاة</td><td>يرتبون ويبررون في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب تعبير ‎Ka‎ لحمض الإيثانويك.</td><td>‎Ka = [CH₃COO⁻][H⁺] / [CH₃COOH]‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎pKa‎ لحمض ‎Ka‎ له ‎1.74 × 10⁻⁵ mol/dm³‎.</td><td>‎pKa = −log(1.74 × 10⁻⁵) = 4.76‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أيهما أقوى: حمض ‎pKa‎ له 3.2 أم 4.8؟</td><td>الحمض ذو ‎pKa = 3.2‎ لأن ‎pKa‎ الأصغر يعني ‎Ka‎ أكبر.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وحدة ‎Ka‎؟</td><td>‎mol/dm³‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا تدل قيمة ‎Ka‎ الصغيرة جدًا؟</td><td>على أن الحمض ضعيف يتأين بدرجة قليلة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>رتب تصاعديًا في القوة: ‎HF (Ka = 5.6 × 10⁻⁴)‎، ‎CH₃COOH (1.74 × 10⁻⁵)‎، ‎HCN (4.9 × 10⁻¹⁰)‎.</td><td>‎HCN &lt; CH₃COOH &lt; HF‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 31–33 وكتابة تعبيرات ‎Ka‎ لخمسة أحماض</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على عمل بطاقة تلخص العلاقة بين ‎Ka‎ و‎pKa‎ والقوة</p>"]},{"axis":"حساب ‎pH‎ لحمض ضعيف","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"],["الحصة","2 من 4"],["محور الحصة","حساب ‎pH‎ لحمض ضعيف"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 33–35"],["دليل المعلم","ص 60–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]],"t":["1. يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎\n2. يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه\nمخرج تعليمي آخر: يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","الافتراض الأول: ‎[H⁺] = [A⁻]‎، الافتراض الثاني: ‎[HA]‎ عند الاتزان ≈ التركيز الابتدائي، ‎[H⁺] = √(Ka[HA])‎، حساب ‎Ka‎ من ‎pH‎.","يسأل المعلم: «في محلول حمض الإيثانويك ‎0.10 mol/dm³‎، هل ‎[H⁺] = 0.10‎؟ لماذا لا؟ وكيف نحسبه إذن؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويذكّر بالتأين الجزئي\nالطالب: يستنتجون أن ‎[H⁺]‎ أقل كثيرًا من 0.10\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يشتق ‎[H⁺] = √(Ka × [HA])‎ مع الافتراضين ويحل مثالًا (المثال في كتاب الطالب)\nالطالب: يتبعون خطوات الحل ويطبقونها على مثال ثانٍ\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يقدم مسائل عكسية: حساب ‎Ka‎ من ‎pH‎\nالطالب: يحلون في أزواج ويعرضون الحلول\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ‎pH‎ لمحلول حمض الإيثانويك ‎0.10 mol/dm³ (Ka = 1.74 × 10⁻⁵)‎.\n   الإجابة النموذجية: ‎[H⁺] = √(1.74 × 10⁻⁶) = 1.32 × 10⁻³‎، ‎pH = 2.88‎.\n2) (المستوى المتوقع) السؤال: ما الافتراض الذي يسمح باعتبار ‎[HA]‎ عند الاتزان مساويًا للتركيز الابتدائي؟\n   الإجابة النموذجية: أن نسبة التأين صغيرة جدًا فلا يتغير تركيز ‎HA‎ كثيرًا.\n3) (المستوى المتقدم) السؤال: لماذا نفترض ‎[H⁺] = [A⁻]‎؟\n   الإجابة النموذجية: لأن كل جزيء يتأين يعطي ‎H⁺‎ واحدًا و‎A⁻‎ واحدًا، مع إهمال ‎H⁺‎ الناتج من تأين الماء.","1) (مستوى الدعم) السؤال: اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ لحمض ضعيف.\n   الإجابة النموذجية: ‎[H⁺] = √(Ka × [HA])‎\n2) (المستوى المتوقع) السؤال: محلول حمض ضعيف تركيزه ‎0.050 mol/dm³‎ و‎pH‎ له 3.00. احسب ‎Ka‎.\n   الإجابة النموذجية: ‎[H⁺] = 1.0 × 10⁻³‎؛ ‎Ka = (1.0 × 10⁻³)² ÷ 0.050 = 2.0 × 10⁻⁵ mol/dm³‎.\n3) (المستوى المتقدم) السؤال: متى يصبح افتراض ‎[HA] ≈‎ التركيز الابتدائي غير دقيق؟\n   الإجابة النموذجية: عندما يكون الحمض أقوى نسبيًا (‎Ka‎ كبير) أو المحلول مخففًا جدًا فتصبح نسبة التأين كبيرة.","إرشاد للطالب: مراجعة ص 33–35 وحل ثلاث مسائل لحمض ضعيف\nإرشاد لولي الأمر: متابعة الابن في كتابة الافتراضين قبل كل حل"],"h":["<ol class=\"ol\"><li>يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎</li><li>يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب ‎[H⁺]‎ و‎pH‎ لمحلول حمض ضعيف بمعلومية ‎Ka‎ والتركيز باستخدام ‎[H⁺] = √(Ka × [HA])‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب ‎Ka‎ لحمض ضعيف من ‎pH‎ وتركيزه</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يوضح الافتراضين المستخدمين في التبسيط وحدود صحتهما</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>الافتراض الأول: ‎[H⁺] = [A⁻]‎، الافتراض الثاني: ‎[HA]‎ عند الاتزان ≈ التركيز الابتدائي، ‎[H⁺] = √(Ka[HA])‎، حساب ‎Ka‎ من ‎pH‎.</p>","<p>يسأل المعلم: «في محلول حمض الإيثانويك ‎0.10 mol/dm³‎، هل ‎[H⁺] = 0.10‎؟ لماذا لا؟ وكيف نحسبه إذن؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويذكّر بالتأين الجزئي</td><td>يستنتجون أن ‎[H⁺]‎ أقل كثيرًا من 0.10</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يشتق ‎[H⁺] = √(Ka × [HA])‎ مع الافتراضين ويحل مثالًا (المثال في كتاب الطالب)</td><td>يتبعون خطوات الحل ويطبقونها على مثال ثانٍ</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يقدم مسائل عكسية: حساب ‎Ka‎ من ‎pH‎</td><td>يحلون في أزواج ويعرضون الحلول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎pH‎ لمحلول حمض الإيثانويك ‎0.10 mol/dm³ (Ka = 1.74 × 10⁻⁵)‎.</td><td>‎[H⁺] = √(1.74 × 10⁻⁶) = 1.32 × 10⁻³‎، ‎pH = 2.88‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الافتراض الذي يسمح باعتبار ‎[HA]‎ عند الاتزان مساويًا للتركيز الابتدائي؟</td><td>أن نسبة التأين صغيرة جدًا فلا يتغير تركيز ‎HA‎ كثيرًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا نفترض ‎[H⁺] = [A⁻]‎؟</td><td>لأن كل جزيء يتأين يعطي ‎H⁺‎ واحدًا و‎A⁻‎ واحدًا، مع إهمال ‎H⁺‎ الناتج من تأين الماء.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب العلاقة المستخدمة لحساب ‎[H⁺]‎ لحمض ضعيف.</td><td>‎[H⁺] = √(Ka × [HA])‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>محلول حمض ضعيف تركيزه ‎0.050 mol/dm³‎ و‎pH‎ له 3.00. احسب ‎Ka‎.</td><td>‎[H⁺] = 1.0 × 10⁻³‎؛ ‎Ka = (1.0 × 10⁻³)² ÷ 0.050 = 2.0 × 10⁻⁵ mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>متى يصبح افتراض ‎[HA] ≈‎ التركيز الابتدائي غير دقيق؟</td><td>عندما يكون الحمض أقوى نسبيًا (‎Ka‎ كبير) أو المحلول مخففًا جدًا فتصبح نسبة التأين كبيرة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 33–35 وحل ثلاث مسائل لحمض ضعيف</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة الافتراضين قبل كل حل</p>"]},{"axis":"ثابت تأين القواعد الضعيفة ‎Kb‎ واستخدام ‎pKa‎ في التفاعلات","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"],["الحصة","3 من 4"],["محور الحصة","ثابت تأين القواعد الضعيفة ‎Kb‎ واستخدام ‎pKa‎ في التفاعلات"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 35–37"],["دليل المعلم","ص 60–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]],"t":["1. يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد\n2. يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما\nمخرج تعليمي آخر: يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎pKa‎","ثابت تأين القاعدة ‎Kb‎، ‎pKb‎، القاعدة الضعيفة، ‎NH₃‎، الأمينات، اتجاه انتقال البروتون.","يكتب المعلم معادلة ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎ ويسأل: «كيف نعبر عن مدى قاعدية الأمونيا بقيمة عددية كما فعلنا مع الأحماض؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون ثابتًا مشابهًا لـ ‎Ka‎\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح تعبير ‎Kb‎ و‎pKb‎ ومقارنة القواعد\nالطالب: يكتبون تعبير ‎Kb‎ للأمونيا وأمين بسيط\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ نشاط «استخدام قيم ‎pKa‎ لاستنتاج أحماض وقواعد برونستد-لوري في تفاعل ما»\nالطالب: يحللون تفاعلات ويتنبؤون بالاتجاه المفضل\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب تعبير ‎Kb‎ للأمونيا.\n   الإجابة النموذجية: ‎Kb = [NH₄⁺][OH⁻] / [NH₃]‎\n2) (المستوى المتوقع) السؤال: أيهما أقوى قاعدة: ‎pKb = 3.4‎ أم ‎pKb = 4.8‎؟\n   الإجابة النموذجية: القاعدة ذات ‎pKb = 3.4‎.\n3) (المستوى المتقدم) السؤال: عند خلط حمضين، أيهما يمنح البروتون للآخر؟\n   الإجابة النموذجية: الحمض ذو ‎pKa‎ الأصغر (الأقوى) يمنح البروتون، ويعمل الآخر قاعدة.","1) (مستوى الدعم) السؤال: ماذا تدل قيمة ‎Kb‎ الكبيرة؟\n   الإجابة النموذجية: على قاعدة أقوى تستقبل البروتون بدرجة أكبر.\n2) (المستوى المتوقع) السؤال: اكتب تعبير ‎Kb‎ للميثيل أمين ‎CH₃NH₂‎.\n   الإجابة النموذجية: ‎Kb = [CH₃NH₃⁺][OH⁻] / [CH₃NH₂]‎\n3) (المستوى المتقدم) السؤال: في التفاعل ‎CH₃COOH + HCOO⁻ ⇌ CH₃COO⁻ + HCOOH‎، ومع ‎pKa (CH₃COOH) = 4.76‎ و‎pKa (HCOOH) = 3.75‎، أي الاتجاهين مفضل؟ فسّر.\n   الإجابة النموذجية: الاتجاه العكسي (إلى اليسار) مفضل، لأن ‎HCOOH‎ أقوى من ‎CH₃COOH‎ فيميل إلى منح البروتون.","إرشاد للطالب: مراجعة ص 35–37 وحل تدريبين على ‎Kb‎\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين ‎Ka‎ و‎Kb‎ بلغته"],"h":["<ol class=\"ol\"><li>يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد</li><li>يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يكتب تعبير ثابت تأين القاعدة الضعيفة ‎Kb‎ ويستخدمه في المقارنة بين قوة القواعد</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستخدم قيم ‎pKa‎ لاستنتاج الحمض والقاعدة وفق برونستد-لوري في تفاعل ما</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ باتجاه تفاعل انتقال بروتون بمقارنة قوى الأحماض</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: جدول قيم ‎pKa‎</span></div>","<p>ثابت تأين القاعدة ‎Kb‎، ‎pKb‎، القاعدة الضعيفة، ‎NH₃‎، الأمينات، اتجاه انتقال البروتون.</p>","<p>يكتب المعلم معادلة ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎ ويسأل: «كيف نعبر عن مدى قاعدية الأمونيا بقيمة عددية كما فعلنا مع الأحماض؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون ثابتًا مشابهًا لـ ‎Ka‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح تعبير ‎Kb‎ و‎pKb‎ ومقارنة القواعد</td><td>يكتبون تعبير ‎Kb‎ للأمونيا وأمين بسيط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينفذ نشاط «استخدام قيم ‎pKa‎ لاستنتاج أحماض وقواعد برونستد-لوري في تفاعل ما»</td><td>يحللون تفاعلات ويتنبؤون بالاتجاه المفضل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب تعبير ‎Kb‎ للأمونيا.</td><td>‎Kb = [NH₄⁺][OH⁻] / [NH₃]‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أيهما أقوى قاعدة: ‎pKb = 3.4‎ أم ‎pKb = 4.8‎؟</td><td>القاعدة ذات ‎pKb = 3.4‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>عند خلط حمضين، أيهما يمنح البروتون للآخر؟</td><td>الحمض ذو ‎pKa‎ الأصغر (الأقوى) يمنح البروتون، ويعمل الآخر قاعدة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا تدل قيمة ‎Kb‎ الكبيرة؟</td><td>على قاعدة أقوى تستقبل البروتون بدرجة أكبر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب تعبير ‎Kb‎ للميثيل أمين ‎CH₃NH₂‎.</td><td>‎Kb = [CH₃NH₃⁺][OH⁻] / [CH₃NH₂]‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>في التفاعل ‎CH₃COOH + HCOO⁻ ⇌ CH₃COO⁻ + HCOOH‎، ومع ‎pKa (CH₃COOH) = 4.76‎ و‎pKa (HCOOH) = 3.75‎، أي الاتجاهين مفضل؟ فسّر.</td><td>الاتجاه العكسي (إلى اليسار) مفضل، لأن ‎HCOOH‎ أقوى من ‎CH₃COOH‎ فيميل إلى منح البروتون.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 35–37 وحل تدريبين على ‎Kb‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين ‎Ka‎ و‎Kb‎ بلغته</p>"]},{"axis":"حل الأسئلة 10–15 ونشاط 1-2","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","ثابت تأين الأحماض الضعيفة ‎Ka‎ والقواعد الضعيفة ‎Kb‎"],["الحصة","4 من 4"],["محور الحصة","حل الأسئلة 10–15 ونشاط 1-2"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 31–37 + كتاب التجارب ص 25"],["دليل المعلم","ص 60–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: حسابات الرقم الهيدروجيني ‎pH‎ ص 25؛ نشاط 1-3 ص 26"]],"t":["1. يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15)\n2. يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎\nمخرج تعليمي آخر: يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة","مسائل ‎pH‎ المختلطة، اختيار طريقة الحل، التحقق من المعقولية، الأرقام المعنوية.","يعرض المعلم ثلاث بطاقات مسائل مقلوبة (حمض قوي، حمض ضعيف، قاعدة قوية) ويسأل: «قبل الحل، كيف تعرف أي طريقة تستخدم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض البطاقات ويناقش معايير اختيار الطريقة\nالطالب: يصنفون المسائل حسب نوعها\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 1-2 (كتاب التجارب ص 25)\nالطالب: يحلون فرديًا ثم يقارنون في أزواج\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يوجه حل الأسئلة 10–15 في مجموعات\nالطالب: يحلون ويعرضون الحلول على السبورة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على ‎Ka‎ و‎pH‎\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف تعرف أن الحمض في المسألة ضعيف؟\n   الإجابة النموذجية: وجود قيمة ‎Ka‎ أو ‎pKa‎ أو ذكر أنه حمض ضعيف (كالأحماض العضوية).\n2) (المستوى المتوقع) السؤال: احسب ‎pH‎ لمحلول ‎HCOOH‎ تركيزه ‎0.20 mol/dm³ (Ka = 1.6 × 10⁻⁴)‎.\n   الإجابة النموذجية: ‎[H⁺] = √(3.2 × 10⁻⁵) = 5.66 × 10⁻³‎، ‎pH = 2.25‎.\n3) (المستوى المتقدم) السؤال: لماذا ‎pH‎ للحمض الضعيف أعلى من ‎pH‎ لحمض قوي بالتركيز نفسه؟\n   الإجابة النموذجية: لأن تأينه جزئي فيكون ‎[H⁺]‎ أقل.","1) (مستوى الدعم) السؤال: احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.20 mol/dm³‎ وقارنه بحمض الميثانويك السابق.\n   الإجابة النموذجية: ‎pH = 0.70‎، وهو أقل من 2.25 لأن ‎HCl‎ يتأين كليًا.\n2) (المستوى المتوقع) السؤال: محلول حمض ضعيف ‎pH‎ له 2.50 وتركيزه ‎0.10 mol/dm³‎. احسب ‎pKa‎.\n   الإجابة النموذجية: ‎[H⁺] = 3.16 × 10⁻³‎؛ ‎Ka = 1.0 × 10⁻⁴‎؛ ‎pKa = 4.00‎.\n3) (المستوى المتقدم) السؤال: اقترح طريقة للتحقق من معقولية ناتج ‎pH‎ لحمض ضعيف.\n   الإجابة النموذجية: يجب أن يكون أكبر من ‎pH‎ لحمض قوي بالتركيز نفسه وأقل من 7.","إرشاد للطالب: إكمال نشاط 1-2 ص 25 والأسئلة المتبقية من 10–15\nإرشاد لولي الأمر: متابعة الابن في التحقق من معقولية نواتجه"],"h":["<ol class=\"ol\"><li>يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15)</li><li>يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل مسائل متنوعة على ‎Ka‎ و‎pKa‎ و‎pH‎ للأحماض الضعيفة (الأسئلة 10–15)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل نشاط 1-2 «حسابات الرقم الهيدروجيني ‎pH»‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز نوع المسألة (حمض قوي، حمض ضعيف، قاعدة قوية) ويختار طريقة الحل المناسبة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: آلة حاسبة علمية، كتاب التجارب العملية والأنشطة</span></div>","<p>مسائل ‎pH‎ المختلطة، اختيار طريقة الحل، التحقق من المعقولية، الأرقام المعنوية.</p>","<p>يعرض المعلم ثلاث بطاقات مسائل مقلوبة (حمض قوي، حمض ضعيف، قاعدة قوية) ويسأل: «قبل الحل، كيف تعرف أي طريقة تستخدم؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض البطاقات ويناقش معايير اختيار الطريقة</td><td>يصنفون المسائل حسب نوعها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-2 (كتاب التجارب ص 25)</td><td>يحلون فرديًا ثم يقارنون في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يوجه حل الأسئلة 10–15 في مجموعات</td><td>يحلون ويعرضون الحلول على السبورة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على ‎Ka‎ و‎pH‎</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تعرف أن الحمض في المسألة ضعيف؟</td><td>وجود قيمة ‎Ka‎ أو ‎pKa‎ أو ذكر أنه حمض ضعيف (كالأحماض العضوية).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎pH‎ لمحلول ‎HCOOH‎ تركيزه ‎0.20 mol/dm³ (Ka = 1.6 × 10⁻⁴)‎.</td><td>‎[H⁺] = √(3.2 × 10⁻⁵) = 5.66 × 10⁻³‎، ‎pH = 2.25‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا ‎pH‎ للحمض الضعيف أعلى من ‎pH‎ لحمض قوي بالتركيز نفسه؟</td><td>لأن تأينه جزئي فيكون ‎[H⁺]‎ أقل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎pH‎ لمحلول ‎HCl‎ تركيزه ‎0.20 mol/dm³‎ وقارنه بحمض الميثانويك السابق.</td><td>‎pH = 0.70‎، وهو أقل من 2.25 لأن ‎HCl‎ يتأين كليًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>محلول حمض ضعيف ‎pH‎ له 2.50 وتركيزه ‎0.10 mol/dm³‎. احسب ‎pKa‎.</td><td>‎[H⁺] = 3.16 × 10⁻³‎؛ ‎Ka = 1.0 × 10⁻⁴‎؛ ‎pKa = 4.00‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح طريقة للتحقق من معقولية ناتج ‎pH‎ لحمض ضعيف.</td><td>يجب أن يكون أكبر من ‎pH‎ لحمض قوي بالتركيز نفسه وأقل من 7.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-2 ص 25 والأسئلة المتبقية من 10–15</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التحقق من معقولية نواتجه</p>"]}]},{"title":"معايرة الأحماض والقواعد","sb":"ص 38–43","unit":"الوحدة 1: الاتزان في المحاليل المائية","periods":[{"axis":"الكواشف أحماض ضعيفة ومدى تغير اللون","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","معايرة الأحماض والقواعد"],["الحصة","1 من 3"],["محور الحصة","الكواشف أحماض ضعيفة ومدى تغير اللون"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 38–39"],["دليل المعلم","ص 65–68"],["كتاب التجارب العملية والأنشطة","نشاط 1-4: الكواشف ومنحنيات المعايرة ص 28؛ الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة ص 35"]],"t":["1. يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎\n2. يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎\nمخرج تعليمي آخر: يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: محاليل ميثيل البرتقالي والفينولفثالين، محاليل حمضية وقاعدية مخففة","الكاشف، ‎HIn‎ و‎In⁻‎، مدى تغير اللون، نقطة النهاية، ‎pKin‎، الميثيل البرتقالي، الفينولفثالين.","يعرض المعلم مقطعًا لتغير لون الميثيل البرتقالي عند معادلة حمض ويسأل: «لماذا يتغير لون الكاشف فجأة عند قطرة واحدة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المقطع ويطرح السؤال\nالطالب: يقترحون تفسيرًا لتغير اللون\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح اتزان الكاشف ‎HIn ⇌ H⁺ + In⁻‎ وأثر إضافة حمض أو قاعدة\nالطالب: يكتبون معادلة الاتزان ويتنبؤون بالإزاحة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ عرضًا: إضافة حمض وقاعدة إلى الكاشفين وتسجيل الألوان\nالطالب: يسجلون الألوان ويحددون مدى التغير التقريبي لكل كاشف\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا يُعد الكاشف حمضًا ضعيفًا؟\n   الإجابة النموذجية: لأنه يتأين جزئيًا ‎HIn ⇌ H⁺ + In⁻‎ ولكل من ‎HIn‎ و‎In⁻‎ لون مختلف.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لاتزان الكاشف عند إضافة حمض؟\n   الإجابة النموذجية: يزداد ‎[H⁺]‎ فيزاح الاتزان نحو ‎HIn‎ ويظهر لونه.\n3) (المستوى المتقدم) السؤال: ما مدى تغير لون الفينولفثالين تقريبًا؟\n   الإجابة النموذجية: من نحو 8.3 إلى 10.","1) (مستوى الدعم) السؤال: ما نقطة النهاية؟\n   الإجابة النموذجية: النقطة التي يتغير عندها لون الكاشف أثناء المعايرة.\n2) (المستوى المتوقع) السؤال: ما لون الميثيل البرتقالي في الوسط الحمضي القوي؟\n   الإجابة النموذجية: أحمر.\n3) (المستوى المتقدم) السؤال: يتغير لون كاشف عند ‎pH ≈ pKin ± 1‎. إذا كان ‎pKin = 5‎، فما مداه التقريبي؟\n   الإجابة النموذجية: من 4 إلى 6.","إرشاد للطالب: مراجعة ص 38–39 وتلخيص ألوان الكاشفين في جدول\nإرشاد لولي الأمر: الحديث مع الابن عن كواشف طبيعية مثل الملفوف الأحمر"],"h":["<ol class=\"ol\"><li>يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎</li><li>يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يفسر عمل الكاشف بوصفه حمضًا ضعيفًا ‎HIn‎ يختلف لونه عن لون قاعدته المرافقة ‎In⁻‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد مدى تغير لون الكاشف (نقطة النهاية) بالنسبة إلى ‎pKin‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بلون كاشف في محلول حمضي وفي محلول قاعدي مستخدمًا مبدأ لوشاتلييه</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span><span class=\"chip r\">أخرى: محاليل ميثيل البرتقالي والفينولفثالين، محاليل حمضية وقاعدية مخففة</span></div>","<p>الكاشف، ‎HIn‎ و‎In⁻‎، مدى تغير اللون، نقطة النهاية، ‎pKin‎، الميثيل البرتقالي، الفينولفثالين.</p>","<p>يعرض المعلم مقطعًا لتغير لون الميثيل البرتقالي عند معادلة حمض ويسأل: «لماذا يتغير لون الكاشف فجأة عند قطرة واحدة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض المقطع ويطرح السؤال</td><td>يقترحون تفسيرًا لتغير اللون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح اتزان الكاشف ‎HIn ⇌ H⁺ + In⁻‎ وأثر إضافة حمض أو قاعدة</td><td>يكتبون معادلة الاتزان ويتنبؤون بالإزاحة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينفذ عرضًا: إضافة حمض وقاعدة إلى الكاشفين وتسجيل الألوان</td><td>يسجلون الألوان ويحددون مدى التغير التقريبي لكل كاشف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يُعد الكاشف حمضًا ضعيفًا؟</td><td>لأنه يتأين جزئيًا ‎HIn ⇌ H⁺ + In⁻‎ ولكل من ‎HIn‎ و‎In⁻‎ لون مختلف.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لاتزان الكاشف عند إضافة حمض؟</td><td>يزداد ‎[H⁺]‎ فيزاح الاتزان نحو ‎HIn‎ ويظهر لونه.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما مدى تغير لون الفينولفثالين تقريبًا؟</td><td>من نحو 8.3 إلى 10.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نقطة النهاية؟</td><td>النقطة التي يتغير عندها لون الكاشف أثناء المعايرة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما لون الميثيل البرتقالي في الوسط الحمضي القوي؟</td><td>أحمر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>يتغير لون كاشف عند ‎pH ≈ pKin ± 1‎. إذا كان ‎pKin = 5‎، فما مداه التقريبي؟</td><td>من 4 إلى 6.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 38–39 وتلخيص ألوان الكاشفين في جدول</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن كواشف طبيعية مثل الملفوف الأحمر</p>"]},{"axis":"منحنيات المعايرة واختيار الكاشف المناسب","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الاتزان في المحاليل المائية"],["الدرس","معايرة الأحماض والقواعد"],["الحصة","2 من 3"],["محور الحصة","منحنيات المعايرة واختيار الكاشف المناسب"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 39–43"],["دليل المعلم","ص 65–68"],["كتاب التجارب العملية والأنشطة","نشاط 1-4: الكواشف ومنحنيات المعايرة ص 28؛ الاستقصاء العملي 1-1: التغير في ‎pH‎ أثناء معايرة حمض-قاعدة ص 35"]],"t":["1. يرسم منحنيات ‎pH‎ لمعايرة حمض قوي مع قاعدة قوية، وحمض قوي مع قاعدة ضعيفة، وحمض ضعيف مع قاعدة قوية\n2. يختار الكاشف المناسب لكل معايرة بمقارنة مدى تغير لونه بالجزء الرأسي من المنحنى\nمخرج تعليمي آخر: يحدد نقطة التكافؤ و‎pH‎ عندها من منحنى معايرة","المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","منحنى المعايرة، نقطة التكافؤ، الجزء الرأسي (الانحدار الحاد)، اختيار الكاشف، حمض قوي/قاعدة قوية، حمض ضعيف/قاعدة قوية، حمض قوي/قاعدة ضعيفة.","يعرض المعلم ثلاثة منحنيات معايرة دون عناوين ويسأل: «أي منحنى يمثل إضافة ‎NaOH‎ إلى حمض الإيثانويك؟ وما الدليل؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المنحنيات ويطرح السؤال\nالطالب: يقترحون أدلة من ‎pH‎ البدائي ونقطة التكافؤ\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح شكل كل منحنى (‎pH‎ البدائي، الجزء الرأسي، ‎pH‎ عند التكافؤ)\nالطالب: يرسمون المنحنيات الثلاثة ويعنونونها\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوجه حل نشاط 1-4 «الكواشف ومنحنيات المعايرة» (كتاب التجارب ص 28)\nالطالب: يختارون الكاشف المناسب لكل معايرة ويبررون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير سؤالًا مفصليًا عن كاشف غير مناسب ثم التقويم الختامي\nالطالب: يجيبون ويناقشون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما ‎pH‎ عند نقطة التكافؤ لمعايرة حمض قوي مع قاعدة قوية؟\n   الإجابة النموذجية: 7.\n2) (المستوى المتوقع) السؤال: لماذا يكون ‎pH‎ عند التكافؤ أكبر من 7 في معايرة حمض ضعيف مع قاعدة قوية؟\n   الإجابة النموذجية: لأن الملح الناتج يحتوي القاعدة المرافقة للحمض الضعيف فيكون المحلول قاعديًا.\n3) (المستوى المتقدم) السؤال: لماذا لا يناسب الميثيل البرتقالي معايرة ‎CH₃COOH‎ مع ‎NaOH‎؟\n   الإجابة النموذجية: لأن مدى تغير لونه (3–4.4 تقريبًا) يقع خارج الجزء الرأسي للمنحنى (نحو 7–11).","1) (مستوى الدعم) السؤال: ما الكاشف المناسب لمعايرة حمض ضعيف مع قاعدة قوية؟\n   الإجابة النموذجية: الفينولفثالين.\n2) (المستوى المتوقع) السؤال: ما الكاشف المناسب لمعايرة حمض قوي مع قاعدة ضعيفة؟\n   الإجابة النموذجية: الميثيل البرتقالي.\n3) (المستوى المتقدم) السؤال: لماذا يصلح الكاشفان معًا لمعايرة حمض قوي مع قاعدة قوية؟\n   الإجابة النموذجية: لأن الجزء الرأسي يمتد تقريبًا من ‎pH 3‎ إلى 11 فيشمل مدى تغير لون الكاشفين.","إرشاد للطالب: مراجعة ص 39–43 ورسم المنحنيات الثلاث
