لمهبط ويُجفف قبل الوزن الأول؟\n• الإجابة النموذجية: لإزالة الأكاسيد والشوائب والماء التي تؤثر في دقة الكتلة.\n\n2. مستوى التطبيق: لماذا يجب ضبط التيار ثابتًا طوال التجربة؟\n• الإجابة النموذجية: لأن العلاقة ‎Q = It‎ تفترض تيارًا ثابتًا.\n\n3. مستوى الاستدلال: اكتب علاقة حساب ‎F‎ من بيانات التجربة.\n• الإجابة النموذجية: ‎F = (I × t) ÷ (2 ×‎ مولات ‎Cu‎ المترسبة).", "1. مستوى المعرفة: ما مصدر الخطأ إذا سقط جزء من النحاس المترسب قبل الوزن؟\n• الإجابة النموذجية: تقل الكتلة المقيسة فتكون قيمة ‎F‎ المحسوبة أكبر من الحقيقية.\n\n2. مستوى التطبيق: احسب ‎F‎: تيار ‎0.40 A‎ مدة ‎2412 s‎ رسب ‎0.318 g Cu (63.5)‎.\n• الإجابة النموذجية: ‎Q = 964.8 C‎؛ مول ‎Cu = 0.00501‎؛ مول ‎e⁻ = 0.0100‎؛ ‎F ≈ 96300 C/mol‎.\n\n3. مستوى الاستدلال: اقترح تحسينين لدقة التجربة.\n• الإجابة النموذجية: زيادة زمن التحليل لزيادة الكتلة المترسبة، واستخدام ميزان أدق، وغسل القطب بالماء ثم البروبانون وتجفيفه بلطف.", "إرشاد للطالب: كتابة تقرير الاستقصاء 2-2 مع حساب النسبة المئوية للخطأ\nإرشاد لولي الأمر: التأكد من إكمال الابن حسابات التقرير وتقييم مصادر الخطأ\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13"], "h": ["<ol class=\"ol\"><li>ينفذ تجربة تحليل كهربائي لمحلول ‎CuSO₄‎ بأقطاب نحاس ويقيس تغير كتلة المهبط (10 دقائق)<\/li><li>يحسب قيمة تجريبية لثابت فارادي ويقارنها بالقيمة المقبولة (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد مصادر الخطأ ويقترح تحسينات للتجربة (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> ينفذ تجربة تحليل كهربائي لمحلول ‎CuSO₄‎ بأقطاب نحاس ويقيس تغير كتلة المهبط<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحسب قيمة تجريبية لثابت فارادي ويقارنها بالقيمة المقبولة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يحدد مصادر الخطأ ويقترح تحسينات للتجربة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الاستقصاء العملي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: أقطاب نحاس، محلول ‎CuSO₄‎، مصدر تيار مستمر، أميتر، مقاومة متغيرة، ساعة إيقاف، ميزان حساس<\/span><\/div>", "<p>تغير كتلة المهبط، ضبط التيار، القيمة التجريبية، النسبة المئوية للخطأ، مصادر الخطأ.<\/p>", "<p>يعرض المعلم قطبي نحاس وميزانًا حساسًا ويسأل: «إذا وزنّا القطب قبل التحليل وبعده، كيف نصل إلى ثابت فارادي؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويراجع خطوات العمل والسلامة، والطلبة يكتبون خطة الحساب (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم تنفيذ الاستقصاء العملي 2-2 (كتاب التجارب ص 63) بتيار ثابت مدة محددة، والطلبة ينظفون ويزنون الأقطاب ويمررون التيار ويضبطونه ثم يجففون ويزنون (22 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حساب ‎F‎ والنسبة المئوية للخطأ، والطلبة يحسبون ‎F‎ التجريبي ويقارنونه بـ 96500 (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يناقش المعلم مصادر الخطأ ويدير التقويم الختامي، والطلبة يقترحون تحسينات ويجيبون (6 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا يُنظف المهبط ويُجفف قبل الوزن الأول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لإزالة الأكاسيد والشوائب والماء التي تؤثر في دقة الكتلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يجب ضبط التيار ثابتًا طوال التجربة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن العلاقة ‎Q = It‎ تفترض تيارًا ثابتًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب علاقة حساب ‎F‎ من بيانات التجربة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = (I × t) ÷ (2 ×‎ مولات ‎Cu‎ المترسبة).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما مصدر الخطأ إذا سقط جزء من النحاس المترسب قبل الوزن؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل الكتلة المقيسة فتكون قيمة ‎F‎ المحسوبة أكبر من الحقيقية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎F‎: تيار ‎0.40 A‎ مدة ‎2412 s‎ رسب ‎0.318 g Cu (63.5)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 964.8 C‎؛ مول ‎Cu = 0.00501‎؛ مول ‎e⁻ = 0.0100‎؛ ‎F ≈ 96300 C/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تحسينين لدقة التجربة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: زيادة زمن التحليل لزيادة الكتلة المترسبة، واستخدام ميزان أدق، وغسل القطب بالماء ثم البروبانون وتجفيفه بلطف.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 2-2 مع حساب النسبة المئوية للخطأ<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من إكمال الابن حسابات التقرير وتقييم مصادر الخطأ<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13<\/p>"]}, {"axis": "مراجعة الوحدة الثانية وأسئلة نهاية الوحدة ونشاط 2-6", "n": 5, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "حسابات التحليل الكهربائي"], ["الحصة", "5 من 5"], ["محور الحصة", "مراجعة الوحدة الثانية وأسئلة نهاية الوحدة ونشاط 2-6"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "ص 101–110 + كتاب التجارب ص 57"], ["دليل المعلم", "ص 117–121"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]], "t": ["1. يحل نشاط 2-6 «حسابات التحليل الكهربائي» (15 دقيقة)\n2. يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي (15 دقيقة)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي (10 دقائق)", "1. تطبيق: يحل نشاط 2-6 «حسابات التحليل الكهربائي»\n2. تطبيق: يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي\n3. تقييم (مخرج آخر): يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "الخلية الجلفانية مقابل الخلية الإلكتروليتية، ‎E°cell‎، نيرنست، نواتج التحليل، ‎Q = It‎، ملخص الوحدة.", "يعرض المعلم جدولًا فارغًا للمقارنة بين الخلية الجلفانية والخلية الإلكتروليتية ويطلب ملأه في دقيقتين.", "1. يعرض المعلم الجدول ويستقبل الإجابات، والطلبة يقارنون تحول الطاقة وإشارة الأقطاب وتلقائية التفاعل (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يوجه المعلم حل نشاط 2-6 (كتاب التجارب ص 57)، والطلبة يحلون فرديًا ثم يقارنون (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوزع المعلم أسئلة نهاية الوحدة (ص 102–110) على المجموعات، والطلبة يحلون ويعرضون (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن مراجعة الوحدة الثانية وأسئلة نهاية الوحدة ونشاط 2-6، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – طلاء الخنجر: تتسابق المجموعات لحساب كتلة الفضة المترسبة عند طلاء زينة خنجر عماني بتيار وزمن يحدّدهما المعلم مستخدمة Q = I × t وثابت فارادي، وتعرض الحل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم:\n1. مستوى المعرفة: ما الفرق في تحول الطاقة بين الخلية الجلفانية والإلكتروليتية؟\n• الإجابة النموذجية: الجلفانية تحول الطاقة الكيميائية إلى كهربائية، والإلكتروليتية تحول الكهربائية إلى كيميائية.\n\n2. مستوى التطبيق: ما إشارة المصعد في الخلية الإلكتروليتية؟\n• الإجابة النموذجية: موجب.\n\n3. مستوى الاستدلال: كم مولًا من ‎Al‎ يترسب بمرور ‎0.30 mol‎ إلكترونات ‎(Al³⁺)‎؟\n• الإجابة النموذجية: ‎0.10 mol‎.", "1. مستوى المعرفة: هل التفاعل في الخلية الإلكتروليتية تلقائي؟\n• الإجابة النموذجية: لا، يحتاج إلى مصدر طاقة كهربائية خارجي.\n\n2. مستوى التطبيق: احسب كتلة ‎Al (27)‎ المترسبة بتيار ‎10 A‎ مدة ‎965 s‎.\n• الإجابة النموذجية: ‎Q = 9650 C‎؛ مول ‎e⁻ = 0.10‎؛ مول ‎Al = 0.0333‎؛ الكتلة = ‎0.90 g‎.\n\n3. مستوى الاستدلال: لماذا يكون المصعد سالبًا في الخلية الجلفانية وموجبًا في الإلكتروليتية؟\n• الإجابة النموذجية: في الجلفانية تتولد الإلكترونات بالأكسدة عند المصعد فيصبح سالبًا، وفي الإلكتروليتية يسحب المصدر الخارجي الإلكترونات من المصعد فيصبح موجبًا؛ وفي الحالتين تحدث الأكسدة عند المصعد.", "إرشاد للطالب: مراجعة ملخص الوحدة ص 101 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الثانية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13"], "h": ["<ol class=\"ol\"><li>يحل نشاط 2-6 «حسابات التحليل الكهربائي» (15 دقيقة)<\/li><li>يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 2-6 «حسابات التحليل الكهربائي»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل أسئلة نهاية الوحدة الثانية في جهود الأقطاب والتحليل الكهربائي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم تعلمه في الوحدة الثانية بقائمة التقويم الذاتي<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الخلية الجلفانية مقابل الخلية الإلكتروليتية، ‎E°cell‎، نيرنست، نواتج التحليل، ‎Q = It‎، ملخص الوحدة.<\/p>", "<p>يعرض المعلم جدولًا فارغًا للمقارنة بين الخلية الجلفانية والخلية الإلكتروليتية ويطلب ملأه في دقيقتين.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الجدول ويستقبل الإجابات، والطلبة يقارنون تحول الطاقة وإشارة الأقطاب وتلقائية التفاعل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 2-6 (كتاب التجارب ص 57)، والطلبة يحلون فرديًا ثم يقارنون (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم أسئلة نهاية الوحدة (ص 102–110) على المجموعات، والطلبة يحلون ويعرضون (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن مراجعة الوحدة الثانية وأسئلة نهاية الوحدة ونشاط 2-6، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – طلاء الخنجر: تتسابق المجموعات لحساب كتلة الفضة المترسبة عند طلاء زينة خنجر عماني بتيار وزمن يحدّدهما المعلم مستخدمة Q = I × t وثابت فارادي، وتعرض الحل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق في تحول الطاقة بين الخلية الجلفانية والإلكتروليتية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجلفانية تحول الطاقة الكيميائية إلى كهربائية، والإلكتروليتية تحول الكهربائية إلى كيميائية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما إشارة المصعد في الخلية الإلكتروليتية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: موجب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم مولًا من ‎Al‎ يترسب بمرور ‎0.30 mol‎ إلكترونات ‎(Al³⁺)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎0.10 mol‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل التفاعل في الخلية الإلكتروليتية تلقائي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا، يحتاج إلى مصدر طاقة كهربائية خارجي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب كتلة ‎Al (27)‎ المترسبة بتيار ‎10 A‎ مدة ‎965 s‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 9650 C‎؛ مول ‎e⁻ = 0.10‎؛ مول ‎Al = 0.0333‎؛ الكتلة = ‎0.90 g‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون المصعد سالبًا في الخلية الجلفانية وموجبًا في الإلكتروليتية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في الجلفانية تتولد الإلكترونات بالأكسدة عند المصعد فيصبح سالبًا، وفي الإلكتروليتية يسحب المصدر الخارجي الإلكترونات من المصعد فيصبح موجبًا؛ وفي الحالتين تحدث الأكسدة عند المصعد.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ملخص الوحدة ص 101 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج قائمة التقويم الذاتي للوحدة الثانية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13<\/p>"]}]}, {"title": "طاقة الشبكة البلورية ‎(ΔH°latt)‎", "sb": "ص 112", "unit": "الوحدة 3: طاقة الشبكة البلورية", "periods": [{"axis": "تعريف طاقة الشبكة البلورية وإشارتها", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "طاقة الشبكة البلورية ‎(ΔH°latt)‎"], ["الحصة", "1 من 2"], ["محور الحصة", "تعريف طاقة الشبكة البلورية وإشارتها"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 112"], ["دليل المعلم", "ص 145–147"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية (10 دقائق)\n2. يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة (10 دقائق)\nمخرج تعليمي آخر: يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا (20 دقيقة)", "1. تذكر: يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية\n2. تطبيق: يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة\n3. فهم (مخرج آخر): يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: نموذج بلورة ‎NaCl‎", "طاقة الشبكة البلورية ‎ΔH°latt‎، المركب الأيوني، الأيونات الغازية، طاردة للحرارة، قوى الجذب الكهروستاتيكية، الظروف القياسية.", "يعرض المعلم نموذج بلورة ‎NaCl‎ ويسأل: «لماذا ينصهر ملح الطعام عند ‎801 °C‎ بينما ينصهر الشمع عند نحو ‎60 °C‎؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1. يعرض المعلم النموذج ويطرح السؤال ومهام بداية الوحدة، والطلبة يربطون درجة الانصهار بقوة الجذب بين الأيونات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم تعريف طاقة الشبكة البلورية وإشارتها وكتابة معادلتها ‎(Na⁺(g) + Cl⁻(g) → NaCl(s))‎، والطلبة يكتبون التعريف والمعادلة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مركبات (‎MgO‎، ‎CaCl₂‎، ‎K₂O‎) لكتابة معادلات طاقة شبكتها مع رموز الحالة، والطلبة يكتبون المعادلات في أزواج ويصححون رموز الحالة (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي ويوجه حل السؤال 1، والطلبة يجيبون ويحلون السؤال (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف طاقة الشبكة البلورية.\n• الإجابة النموذجية: التغير في المحتوى الحراري عند تكوين مول واحد من مركب أيوني صلب من أيوناته الغازية في الظروف القياسية.\n\n2. مستوى التطبيق: اكتب معادلة طاقة الشبكة البلورية لـ ‎MgO‎.\n• الإجابة النموذجية: ‎Mg²⁺(g) + O²⁻(g) → MgO(s)‎\n\n3. مستوى الاستدلال: لماذا تكون ‎ΔH°latt‎ سالبة دائمًا؟\n• الإجابة النموذجية: لأن تكوين الروابط الأيونية بين الأيونات المتجاذبة يطلق طاقة.", "1. مستوى المعرفة: ما الحالة الفيزيائية للأيونات في معادلة طاقة الشبكة؟\n• الإجابة النموذجية: غازية.\n\n2. مستوى التطبيق: اكتب معادلة طاقة الشبكة البلورية لـ ‎CaCl₂‎.\n• الإجابة النموذجية: ‎Ca²⁺(g) + 2Cl⁻(g) → CaCl₂(s)‎\n\n3. مستوى الاستدلال: لماذا لا يمكن قياس طاقة الشبكة البلورية مباشرة بالتجربة؟\n• الإجابة النموذجية: لأنه لا يمكن عمليًا الحصول على أيونات غازية منفصلة وجعلها تتحد مباشرة لتكوين مول من المركب الصلب.", "إرشاد للطالب: مراجعة ص 112 وكتابة معادلات طاقة الشبكة لخمسة مركبات\nإرشاد لولي الأمر: الحديث مع الابن عن سبب صلابة المركبات الأيونية وارتفاع درجات انصهارها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=14"], "h": ["<ol class=\"ol\"><li>يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية (10 دقائق)<\/li><li>يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف طاقة الشبكة البلورية ‎ΔH°latt‎ بأنها التغير في المحتوى الحراري عند تكوين مول من مركب أيوني من أيوناته الغازية في الظروف القياسية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يكتب معادلات تمثل طاقة الشبكة البلورية لمركبات أيونية مختلفة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يفسر لماذا تكون طاقة الشبكة البلورية طاردة للحرارة دائمًا<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: نموذج بلورة ‎NaCl‎<\/span><\/div>", "<p>طاقة الشبكة البلورية ‎ΔH°latt‎، المركب الأيوني، الأيونات الغازية، طاردة للحرارة، قوى الجذب الكهروستاتيكية، الظروف القياسية.<\/p>", "<p>يعرض المعلم نموذج بلورة ‎NaCl‎ ويسأل: «لماذا ينصهر ملح الطعام عند ‎801 °C‎ بينما ينصهر الشمع عند نحو ‎60 °C‎؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم النموذج ويطرح السؤال ومهام بداية الوحدة، والطلبة يربطون درجة الانصهار بقوة الجذب بين الأيونات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تعريف طاقة الشبكة البلورية وإشارتها وكتابة معادلتها ‎(Na⁺(g) + Cl⁻(g) → NaCl(s))‎، والطلبة يكتبون التعريف والمعادلة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مركبات (‎MgO‎، ‎CaCl₂‎، ‎K₂O‎) لكتابة معادلات طاقة شبكتها مع رموز الحالة، والطلبة يكتبون المعادلات في أزواج ويصححون رموز الحالة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي ويوجه حل السؤال 1، والطلبة يجيبون ويحلون السؤال (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف طاقة الشبكة البلورية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: التغير في المحتوى الحراري عند تكوين مول واحد من مركب أيوني صلب من أيوناته الغازية في الظروف القياسية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة طاقة الشبكة البلورية لـ ‎MgO‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Mg²⁺(g) + O²⁻(g) → MgO(s)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تكون ‎ΔH°latt‎ سالبة دائمًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن تكوين الروابط الأيونية بين الأيونات المتجاذبة يطلق طاقة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الحالة الفيزيائية للأيونات في معادلة طاقة الشبكة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: غازية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة طاقة الشبكة البلورية لـ ‎CaCl₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ca²⁺(g) + 2Cl⁻(g) → CaCl₂(s)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يمكن قياس طاقة الشبكة البلورية مباشرة بالتجربة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه لا يمكن عمليًا الحصول على أيونات غازية منفصلة وجعلها تتحد مباشرة لتكوين مول من المركب الصلب.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 112 وكتابة معادلات طاقة الشبكة لخمسة مركبات<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن سبب صلابة المركبات الأيونية وارتفاع درجات انصهارها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=14<\/p>"]}, {"axis": "أثر نصف القطر الأيوني والشحنة الأيونية على طاقة الشبكة", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "طاقة الشبكة البلورية ‎(ΔH°latt)‎"], ["الحصة", "2 من 2"], ["محور الحصة", "أثر نصف القطر الأيوني والشحنة الأيونية على طاقة الشبكة"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 112"], ["دليل المعلم", "ص 145–147"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية (15 دقيقة)\n2. يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها (15 دقيقة)\nمخرج تعليمي آخر: يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني (10 دقائق)", "1. فهم: يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية\n2. تحليل: يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها\n3. تحليل (مخرج آخر): يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية\n- أخرى: جدول أنصاف أقطار الأيونات وطاقات الشبكة", "نصف القطر الأيوني، الشحنة الأيونية، كثافة الشحنة، قوة الجذب الكهروستاتيكي، نمط طاقة الشبكة لهاليدات الصوديوم.", "يعرض المعلم قيمتي طاقة الشبكة: ‎NaCl = −787 kJ/mol‎ و‎MgO ≈ −3800 kJ/mol‎ ويسأل: «لماذا تقترب طاقة ‎MgO‎ من خمسة أضعاف طاقة ‎NaCl‎؟»", "1. يعرض المعلم القيمتين ويطرح السؤال، والطلبة يقترحون أثر الشحنة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «ما الذي يحدد قيمة طاقة الشبكة البلورية؟» بالشكلين 3-6 و3-7 ونمط هاليدات الصوديوم، والطلبة يفسرون نمط ‎NaF > NaCl > NaBr > NaI‎ من حيث المقدار (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوزع مجموعات مركبات للترتيب حسب مقدار طاقة الشبكة، والطلبة يرتبون ويبررون بالحجم والشحنة (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – شبكة الحارة: يقف الطلبة متبادلين أدوار أيونات موجبة وسالبة كبيوت الحارة العمانية المتلاصقة، ويناقشون أثر الشحنة ونصف القطر في قوة التجاذب وقيمة طاقة الشبكة (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم:\n1. مستوى المعرفة: كيف تؤثر زيادة نصف قطر الأنيون على طاقة الشبكة؟\n• الإجابة النموذجية: يقل مقدارها (تصبح أقل سالبية) لأن المسافة بين مركزي الأيونين تزداد فيضعف الجذب.\n\n2. مستوى التطبيق: لماذا طاقة شبكة ‎MgO‎ أكبر مقدارًا من ‎NaF‎؟\n• الإجابة النموذجية: لأن شحنتي أيوني ‎MgO (+2‎، −2) أكبر فيكون الجذب أقوى كثيرًا.\n\n3. مستوى الاستدلال: رتب حسب مقدار طاقة الشبكة: ‎NaCl‎، ‎NaI‎، ‎NaF‎.\n• الإجابة النموذجية: ‎NaF > NaCl > NaI‎.", "1. مستوى المعرفة: ما العاملان المؤثران في مقدار طاقة الشبكة؟\n• الإجابة النموذجية: نصف القطر الأيوني والشحنة الأيونية.\n\n2. مستوى التطبيق: أيهما أعلى درجة انصهار: ‎KCl‎ أم ‎CaO‎؟ فسّر.\n• الإجابة النموذجية: ‎CaO‎، لأن طاقة شبكته أكبر مقدارًا لشحنتي أيونيه الأكبر.\n\n3. مستوى الاستدلال: رتب تنازليًا حسب مقدار طاقة الشبكة: ‎MgO‎، ‎NaCl‎، ‎KBr‎، ‎MgCl₂‎.\n• الإجابة النموذجية: ‎MgO > MgCl₂ > NaCl > KBr‎.", "إرشاد للطالب: مراجعة ص 112 وترتيب مجموعتين من المركبات حسب طاقة الشبكة\nإرشاد لولي الأمر: سؤال الابن عن العاملين المؤثرين في طاقة الشبكة بمثال\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=14"], "h": ["<ol class=\"ol\"><li>يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية (15 دقيقة)<\/li><li>يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار طاقة الشبكة البلورية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يرتب مركبات أيونية حسب مقدار طاقة شبكتها بالاعتماد على حجم الأيونات وشحنتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يربط مقدار طاقة الشبكة بدرجة انصهار المركب الأيوني<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: جدول أنصاف أقطار الأيونات وطاقات الشبكة<\/span><\/div>", "<p>نصف القطر الأيوني، الشحنة الأيونية، كثافة الشحنة، قوة الجذب الكهروستاتيكي، نمط طاقة الشبكة لهاليدات الصوديوم.<\/p>", "<p>يعرض المعلم قيمتي طاقة الشبكة: ‎NaCl = −787 kJ/mol‎ و‎MgO ≈ −3800 kJ/mol‎ ويسأل: «لماذا تقترب طاقة ‎MgO‎ من خمسة أضعاف طاقة ‎NaCl‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم القيمتين ويطرح السؤال، والطلبة يقترحون أثر الشحنة (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «ما الذي يحدد قيمة طاقة الشبكة البلورية؟» بالشكلين 3-6 و3-7 ونمط هاليدات الصوديوم، والطلبة يفسرون نمط ‎NaF &gt; NaCl &gt; NaBr &gt; NaI‎ من حيث المقدار (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع مجموعات مركبات للترتيب حسب مقدار طاقة الشبكة، والطلبة يرتبون ويبررون بالحجم والشحنة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – شبكة الحارة: يقف الطلبة متبادلين أدوار أيونات موجبة وسالبة كبيوت الحارة العمانية المتلاصقة، ويناقشون أثر الشحنة ونصف القطر في قوة التجاذب وقيمة طاقة الشبكة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: لعب الأدوار.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تؤثر زيادة نصف قطر الأنيون على طاقة الشبكة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يقل مقدارها (تصبح أقل سالبية) لأن المسافة بين مركزي الأيونين تزداد فيضعف الجذب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا طاقة شبكة ‎MgO‎ أكبر مقدارًا من ‎NaF‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن شحنتي أيوني ‎MgO (+2‎، −2) أكبر فيكون الجذب أقوى كثيرًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> رتب حسب مقدار طاقة الشبكة: ‎NaCl‎، ‎NaI‎، ‎NaF‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎NaF &gt; NaCl &gt; NaI‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما العاملان المؤثران في مقدار طاقة الشبكة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نصف القطر الأيوني والشحنة الأيونية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أيهما أعلى درجة انصهار: ‎KCl‎ أم ‎CaO‎؟ فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CaO‎، لأن طاقة شبكته أكبر مقدارًا لشحنتي أيونيه الأكبر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> رتب تنازليًا حسب مقدار طاقة الشبكة: ‎MgO‎، ‎NaCl‎، ‎KBr‎، ‎MgCl₂‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎MgO &gt; MgCl₂ &gt; NaCl &gt; KBr‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 112 وترتيب مجموعتين من المركبات حسب طاقة الشبكة<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن العاملين المؤثرين في طاقة الشبكة بمثال<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=14<\/p>"]}]}, {"title": "التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية", "sb": "ص 113–115", "unit": "الوحدة 3: طاقة الشبكة البلورية", "periods": [{"axis": "التغير في المحتوى الحراري للتذرير ‎ΔH°at‎", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية"], ["الحصة", "1 من 3"], ["محور الحصة", "التغير في المحتوى الحراري للتذرير ‎ΔH°at‎"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 113"], ["دليل المعلم", "ص 147–151"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-3: التغيرات في المحتوى الحراري وطاقة الشبكة البلورية ص 79"]], "t": ["1. يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه (15 دقيقة)\n2. يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا (10 دقائق)", "1. تذكر: يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه\n2. تطبيق: يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية\n3. فهم (مخرج آخر): يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎ΔH°at‎", "التذرير (التفكك)، ‎ΔH°at‎، مول من الذرات الغازية، الحالة القياسية للعنصر، طاقة الرابطة.", "يسأل المعلم: «لتحويل ملعقة صوديوم صلب إلى ذرات منفردة في الحالة الغازية، هل نحتاج إلى طاقة أم نحصل عليها؟ ولماذا يحتاج الليثيوم طاقة أكبر من الصوديوم؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون أن العملية تحتاج طاقة لكسر الروابط الفلزية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم نشاط «التغير في المحتوى الحراري للتذرير» ويكتب معادلات ‎Na(s) → Na(g)‎ و½‎Cl₂(g) → Cl(g)‎، والطلبة يكتبون معادلات التذرير ويلاحظون معامل ½ للعناصر ثنائية الذرة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم عناصر متنوعة لكتابة معادلات تذريرها ومقارنة القيم (‎Li‎ و‎Na‎)، والطلبة يكتبون ويفسرون الفرق بقوة الرابطة الفلزية (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف ‎ΔH°at‎.\n• الإجابة النموذجية: التغير في المحتوى الحراري عند تكوين مول واحد من الذرات الغازية من العنصر في حالته القياسية.\n\n2. مستوى التطبيق: اكتب معادلة تذرير الكلور.\n• الإجابة النموذجية: ½‎Cl₂(g) → Cl(g)‎\n\n3. مستوى الاستدلال: لماذا ‎ΔH°at‎ لليثيوم أكبر من الصوديوم؟\n• الإجابة النموذجية: لأن ذرات الليثيوم أصغر فتكون الرابطة الفلزية أقوى وتحتاج طاقة أكبر لكسرها.", "1. مستوى المعرفة: هل التذرير ماص أم طارد للحرارة؟\n• الإجابة النموذجية: ماص للحرارة دائمًا.\n\n2. مستوى التطبيق: اكتب معادلة تذرير المغنيسيوم.\n• الإجابة النموذجية: ‎Mg(s) → Mg(g)‎\n\n3. مستوى الاستدلال: ما العلاقة بين ‎ΔH°at‎ للكلور وطاقة الرابطة ‎Cl–Cl‎؟\n• الإجابة النموذجية: ‎ΔH°at‎ للكلور تساوي نصف طاقة الرابطة ‎Cl–Cl‎ لأن المعادلة تكوّن مولًا واحدًا من الذرات.", "إرشاد للطالب: مراجعة ص 113 وكتابة معادلات تذرير ستة عناصر\nإرشاد لولي الأمر: متابعة الابن في كتابة رموز الحالة بدقة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=15"], "h": ["<ol class=\"ol\"><li>يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه (15 دقيقة)<\/li><li>يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف التغير في المحتوى الحراري للتذرير ‎ΔH°at‎ ويستخدمه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يكتب معادلات التذرير لعناصر فلزية ولافلزية مع مراعاة تكوين مول واحد من الذرات الغازية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يفسر لماذا يكون التذرير ماصًا للحرارة دائمًا<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: جدول قيم ‎ΔH°at‎<\/span><\/div>", "<p>التذرير (التفكك)، ‎ΔH°at‎، مول من الذرات الغازية، الحالة القياسية للعنصر، طاقة الرابطة.<\/p>", "<p>يسأل المعلم: «لتحويل ملعقة صوديوم صلب إلى ذرات منفردة في الحالة الغازية، هل نحتاج إلى طاقة أم نحصل عليها؟ ولماذا يحتاج الليثيوم طاقة أكبر من الصوديوم؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون أن العملية تحتاج طاقة لكسر الروابط الفلزية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم نشاط «التغير في المحتوى الحراري للتذرير» ويكتب معادلات ‎Na(s) → Na(g)‎ و½‎Cl₂(g) → Cl(g)‎، والطلبة يكتبون معادلات التذرير ويلاحظون معامل ½ للعناصر ثنائية الذرة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم عناصر متنوعة لكتابة معادلات تذريرها ومقارنة القيم (‎Li‎ و‎Na‎)، والطلبة يكتبون ويفسرون الفرق بقوة الرابطة الفلزية (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف ‎ΔH°at‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: التغير في المحتوى الحراري عند تكوين مول واحد من الذرات الغازية من العنصر في حالته القياسية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تذرير الكلور.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ½‎Cl₂(g) → Cl(g)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ‎ΔH°at‎ لليثيوم أكبر من الصوديوم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ذرات الليثيوم أصغر فتكون الرابطة الفلزية أقوى وتحتاج طاقة أكبر لكسرها.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل التذرير ماص أم طارد للحرارة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ماص للحرارة دائمًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تذرير المغنيسيوم.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Mg(s) → Mg(g)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما العلاقة بين ‎ΔH°at‎ للكلور وطاقة الرابطة ‎Cl–Cl‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°at‎ للكلور تساوي نصف طاقة الرابطة ‎Cl–Cl‎ لأن المعادلة تكوّن مولًا واحدًا من الذرات.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 113 وكتابة معادلات تذرير ستة عناصر<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة رموز الحالة بدقة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=15<\/p>"]}, {"axis": "الألفة الإلكترونية الأولى والثانية ومعادلاتها", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية"], ["الحصة", "2 من 3"], ["محور الحصة", "الألفة الإلكترونية الأولى والثانية ومعادلاتها"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 113–115"], ["دليل المعلم", "ص 147–151"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-3: التغيرات في المحتوى الحراري وطاقة الشبكة البلورية ص 79"]], "t": ["1. يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها (15 دقيقة)\n2. يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة (5 دقائق)\nمخرج تعليمي آخر: يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎ (20 دقيقة)", "1. تذكر: يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها\n2. فهم: يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة\n3. تطبيق (مخرج آخر): يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم الألفة الإلكترونية", "الألفة الإلكترونية الأولى ‎EA1‎، الألفة الإلكترونية الثانية ‎EA2‎، الأيون السالب الغازي، الطرد بين الإلكترون والأيون السالب.", "يسأل المعلم: «ذرة الكلور تطلق طاقة عندما تكسب إلكترونًا؛ فهل يطلق أيون ‎O⁻‎ طاقة أيضًا عندما يكسب إلكترونًا ثانيًا؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون ويناقشون أثر الشحنة السالبة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ نشاط «الألفة الإلكترونية»: تعريف ‎EA1‎ و‎EA2‎ ومعادلاتهما وقيم للكلور والأكسجين، والطلبة يكتبون المعادلات ويحددون إشارة كل قيمة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل لحساب ‎ΔH‎ لتكوين ‎O²⁻(g)‎ و‎S²⁻(g)‎ من الذرات، والطلبة يحسبون ‎EA1 + EA2‎ في أزواج (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف الألفة الإلكترونية الأولى.\n• الإجابة النموذجية: التغير في المحتوى الحراري عند إضافة مول من الإلكترونات إلى مول من الذرات الغازية لتكوين مول من الأيونات الغازية أحادية الشحنة السالبة.\n\n2. مستوى التطبيق: اكتب معادلة ‎EA1‎ للكلور.\n• الإجابة النموذجية: ‎Cl(g) + e⁻ → Cl⁻(g)‎\n\n3. مستوى الاستدلال: لماذا تكون ‎EA2‎ للأكسجين موجبة؟\n• الإجابة النموذجية: لأن الإلكترون المضاف يتنافر مع الأيون السالب ‎O⁻‎ فيحتاج إلى طاقة للتغلب على هذا التنافر.", "1. مستوى المعرفة: اكتب معادلة ‎EA2‎ للأكسجين.\n• الإجابة النموذجية: ‎O⁻(g) + e⁻ → O²⁻(g)‎\n\n2. مستوى التطبيق: هل ‎EA1‎ للكلور طاردة أم ماصة للحرارة؟\n• الإجابة النموذجية: طاردة للحرارة (سالبة).\n\n3. مستوى الاستدلال: احسب ‎ΔH‎ لـ ‎O(g) + 2e⁻ → O²⁻(g)‎ إذا كانت ‎EA1 = −141‎ و‎EA2 = +798 kJ/mol‎.\n• الإجابة النموذجية: ‎ΔH = −141 + 798 = +657 kJ/mol‎.", "إرشاد للطالب: مراجعة ص 113–115 وكتابة معادلات ‎EA1‎ و‎EA2‎\nإرشاد لولي الأمر: سؤال الابن عن سبب كون ‎EA2‎ موجبة بأسلوبه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=15"], "h": ["<ol class=\"ol\"><li>يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها (15 دقيقة)<\/li><li>يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎ (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف الألفة الإلكترونية الأولى ‎EA1‎ ويكتب معادلاتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يعرّف الألفة الإلكترونية الثانية ‎EA2‎ ويفسر كونها ماصة للحرارة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب التغير الكلي في المحتوى الحراري لتكوين ‎O²⁻(g)‎ من ‎O(g)‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: جدول قيم الألفة الإلكترونية<\/span><\/div>", "<p>الألفة الإلكترونية الأولى ‎EA1‎، الألفة الإلكترونية الثانية ‎EA2‎، الأيون السالب الغازي، الطرد بين الإلكترون والأيون السالب.<\/p>", "<p>يسأل المعلم: «ذرة الكلور تطلق طاقة عندما تكسب إلكترونًا؛ فهل يطلق أيون ‎O⁻‎ طاقة أيضًا عندما يكسب إلكترونًا ثانيًا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون ويناقشون أثر الشحنة السالبة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ نشاط «الألفة الإلكترونية»: تعريف ‎EA1‎ و‎EA2‎ ومعادلاتهما وقيم للكلور والأكسجين، والطلبة يكتبون المعادلات ويحددون إشارة كل قيمة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل لحساب ‎ΔH‎ لتكوين ‎O²⁻(g)‎ و‎S²⁻(g)‎ من الذرات، والطلبة يحسبون ‎EA1 + EA2‎ في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف الألفة الإلكترونية الأولى.<br><span style=\"opacity:.85\">• الإجابة النموذجية: التغير في المحتوى الحراري عند إضافة مول من الإلكترونات إلى مول من الذرات الغازية لتكوين مول من الأيونات الغازية أحادية الشحنة السالبة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة ‎EA1‎ للكلور.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Cl(g) + e⁻ → Cl⁻(g)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تكون ‎EA2‎ للأكسجين موجبة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الإلكترون المضاف يتنافر مع الأيون السالب ‎O⁻‎ فيحتاج إلى طاقة للتغلب على هذا التنافر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب معادلة ‎EA2‎ للأكسجين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎O⁻(g) + e⁻ → O²⁻(g)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل ‎EA1‎ للكلور طاردة أم ماصة للحرارة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: طاردة للحرارة (سالبة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH‎ لـ ‎O(g) + 2e⁻ → O²⁻(g)‎ إذا كانت ‎EA1 = −141‎ و‎EA2 = +798 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH = −141 + 798 = +657 kJ/mol‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 113–115 وكتابة معادلات ‎EA1‎ و‎EA2‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن سبب كون ‎EA2‎ موجبة بأسلوبه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=15<\/p>"]}, {"axis": "نمط التدرج في الألفة الإلكترونية للمجموعتين 16 و17", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "التغير في المحتوى الحراري للتذرير (التفكك) والألفة الإلكترونية"], ["الحصة", "3 من 3"], ["محور الحصة", "نمط التدرج في الألفة الإلكترونية للمجموعتين 16 و17"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 115 + كتاب التجارب ص 79"], ["دليل المعلم", "ص 147–151"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-3: التغيرات في المحتوى الحراري وطاقة الشبكة البلورية ص 79"]], "t": ["1. يصف ويشرح نمط التدرج في قيم الألفة الإلكترونية الأولى لعناصر المجموعتين 16 و17 (10 دقائق)\n2. يشرح العوامل المؤثرة في الألفة الإلكترونية: الشحنة النووية، ونصف القطر، والحجب (20 دقيقة)\nمخرج تعليمي آخر: يفسر شذوذ الفلور (‎EA1‎ أقل سالبية من الكلور) (10 دقائق)", "1. فهم: يصف ويشرح نمط التدرج في قيم الألفة الإلكترونية الأولى لعناصر المجموعتين 16 و17\n2. فهم: يشرح العوامل المؤثرة في الألفة الإلكترونية: الشحنة النووية، ونصف القطر، والحجب\n3. تحليل (مخرج آخر): يفسر شذوذ الفلور (‎EA1‎ أقل سالبية من الكلور)", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: جدول قيم ‎EA1‎، كتاب التجارب العملية والأنشطة", "نمط التدرج في الألفة الإلكترونية، الشحنة النووية الفعالة، نصف القطر الذري، الحجب، شذوذ الفلور، المجموعتان 16 و17.", "يعرض المعلم قيم ‎EA1: F = −328‎، ‎Cl = −349‎، ‎Br = −325‎، ‎I = −295 kJ/mol‎ ويسأل: «لماذا لا يمتلك الفلور أكثر القيم سالبية كما نتوقع؟»", "1. يعرض المعلم القيم ويطرح السؤال، والطلبة يلاحظون الشذوذ ويقترحون تفسيرًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم العوامل المؤثرة ونمط التناقص من ‎Cl‎ إلى ‎I‎ وشذوذ الفلور (صغر الحجم والتنافر الإلكتروني)، والطلبة يكتبون تفسيرًا لكل جزء من النمط (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 3-3 (كتاب التجارب ص 79) والسؤالين 2 و3، والطلبة يحلون في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص نمط التدرج في الألفة الإلكترونية للمجموعتين 16 و17، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ملح المالح: تكتب المجموعات معادلات التذرير والألفة الإلكترونية لتكوين أيونات ملح الطعام، وتربط ذلك باستخدام الملح في تجفيف السمك (المالح) من تراث الصيادين العمانيين (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: كيف تتغير ‎EA1‎ من الكلور إلى اليود؟\n• الإجابة النموذجية: تصبح أقل سالبية (أقل طردًا للحرارة).\n\n2. مستوى التطبيق: لماذا تصبح ‎EA1‎ أقل سالبية من ‎Cl‎ إلى ‎I‎؟\n• الإجابة النموذجية: لأن نصف القطر والحجب يزدادان فيضعف جذب النواة للإلكترون المضاف.\n\n3. مستوى الاستدلال: لماذا ‎EA1‎ للفلور أقل سالبية من الكلور؟\n• الإجابة النموذجية: لصغر حجم ذرة الفلور، فيعاني الإلكترون المضاف تنافرًا قويًا مع الإلكترونات الموجودة في الغلاف الصغير.", "1. مستوى المعرفة: أي هالوجين له ‎EA1‎ الأكثر سالبية؟\n• الإجابة النموذجية: الكلور.\n\n2. مستوى التطبيق: لماذا ‎EA1‎ للمجموعة 17 أكثر سالبية من المجموعة 16 في الدورة نفسها؟\n• الإجابة النموذجية: لأن الشحنة النووية أكبر ونصف القطر أصغر في المجموعة 17 فيكون جذب الإلكترون المضاف أقوى.\n\n3. مستوى الاستدلال: عند التعليق على قيمتين سالبتين للألفة، كيف تصوغ المقارنة بدقة؟\n• الإجابة النموذجية: تذكر أن إحداهما «أكثر طردًا للحرارة» أو «أكثر سالبية» من الأخرى، لا أنها «أكبر» أو «أصغر» فقط.", "إرشاد للطالب: إكمال نشاط 3-3 ص 79 والسؤالين 2 و3\nإرشاد لولي الأمر: تشجيع الابن على استخدام عبارة «أكثر طردًا للحرارة» في المقارنات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=15"], "h": ["<ol class=\"ol\"><li>يصف ويشرح نمط التدرج في قيم الألفة الإلكترونية الأولى لعناصر المجموعتين 16 و17 (10 دقائق)<\/li><li>يشرح العوامل المؤثرة في الألفة الإلكترونية: الشحنة النووية، ونصف القطر، والحجب (20 دقيقة)<\/
