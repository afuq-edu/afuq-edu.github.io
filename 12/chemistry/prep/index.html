 معادلة اختزال ‎Fe³⁺/Fe²⁺‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Fe³⁺(aq) + e⁻ ⇌ Fe²⁺(aq)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صف نصف خلية ‎Cl₂/Cl⁻‎ القياسية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: غاز ‎Cl₂‎ بضغط ‎100 kPa‎ يمرر على قطب بلاتين مغموس في محلول ‎Cl⁻‎ بتركيز ‎1.00 mol/dm³‎ عند ‎298 K‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 73–75 ورسم ثلاثة أنواع من أنصاف الخلايا<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن سبب اختيار البلاتين في هذه الأقطاب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=9<\/p>"]}, {"axis": "نشاط 2-2 والأسئلة 2–7", "n": 5, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "قياس جهود الأقطاب القياسية"], ["الحصة", "5 من 5"], ["محور الحصة", "نشاط 2-2 والأسئلة 2–7"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "ص 70–75 + كتاب التجارب ص 47"], ["دليل المعلم", "ص 103–106"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-2: استخدام جهد الاختزال القياسي ص 47"]], "t": ["1. يحل نشاط 2-2 «استخدام جهد الاختزال القياسي» (15 دقيقة)\n2. يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية (10 دقائق)\nمخرج تعليمي آخر: يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها (15 دقيقة)", "1. تطبيق: يحل نشاط 2-2 «استخدام جهد الاختزال القياسي»\n2. تطبيق: يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية\n3. تقييم (مخرج آخر): يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها", "- التعلم الذاتي\n- التعلم التعاوني\n- التأمل الذاتي", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "مراجعة قياس ‎E°‎، أنواع أنصاف الخلايا، الظروف القياسية، الأخطاء الشائعة.", "يطلب المعلم من كل طالب كتابة «فكرة واحدة واضحة» و«فكرة واحدة غامضة» من الموضوع على بطاقتين ويجمعها.", "1. يجمع المعلم البطاقات ويصنف الأفكار الغامضة، والطلبة يكتبون بطاقاتهم (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يوجه المعلم حل نشاط 2-2 (كتاب التجارب ص 47)، والطلبة يحلون فرديًا ثم في أزواج (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل الأسئلة 2–7 ويعالج الأفكار الغامضة المتكررة، والطلبة يحلون ويناقشون (11 دقيقة)\nالاستراتيجيات: التأمل الذاتي.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن نشاط 2-2 والأسئلة 2–7، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ساعة الفلج المرجعية: تشرح المجموعات حاجتنا إلى قطب الهيدروجين القياسي مرجعًا قيمته صفر، وتربطه باعتماد الأفلاج العمانية على الظل والنجوم مرجعًا لتوزيع حصص الماء بين المزارعين بالعدل (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الخطأ في عبارة: «جهد قطب الهيدروجين القياسي ‎1.00 V»‎؟\n• الإجابة النموذجية: قيمته المصطلح عليها ‎0.00 V‎.\n\n2. مستوى التطبيق: اذكر نوع نصف الخلية ‎Br₂/Br⁻‎ وقطبها.\n• الإجابة النموذجية: لافلز/أيون، وقطبها بلاتين.\n\n3. مستوى الاستدلال: ما الذي يقيسه الفولتميتر في خلية تحتوي قطب الهيدروجين القياسي ونصف خلية أخرى؟\n• الإجابة النموذجية: ‎E°‎ لنصف الخلية الأخرى مباشرة (مع تحديد الإشارة من القطب الموجب).", "1. مستوى المعرفة: لماذا تُحدد الإشارة من قطبية الخلية لا من قراءة الفولتميتر وحدها؟\n• الإجابة النموذجية: لأن الفولتميتر يقرأ المقدار، والإشارة تعتمد على ما إذا كانت نصف الخلية موجبة أو سالبة بالنسبة لقطب الهيدروجين.\n\n2. مستوى التطبيق: نصف خلية مجهولة كانت القطب السالب وقرأ الفولتميتر ‎0.25 V‎ مع قطب الهيدروجين. ما ‎E°‎؟\n• الإجابة النموذجية: ‎−0.25 V‎.\n\n3. مستوى الاستدلال: ما الفكرة التي كانت غامضة لديك في هذا الموضوع؟ وكيف أصبحت أوضح؟\n• الإجابة النموذجية: إجابة تأملية شخصية تذكر فكرة محددة والطريقة التي ساعدت على فهمها.", "إرشاد للطالب: إكمال نشاط 2-2 ص 47 والأسئلة المتبقية من 2–7\nإرشاد لولي الأمر: الاطلاع على بطاقة «الفكرة الغامضة» مع الابن ومساعدته في مراجعتها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=9"], "h": ["<ol class=\"ol\"><li>يحل نشاط 2-2 «استخدام جهد الاختزال القياسي» (15 دقيقة)<\/li><li>يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 2-2 «استخدام جهد الاختزال القياسي»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التأمل الذاتي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مراجعة قياس ‎E°‎، أنواع أنصاف الخلايا، الظروف القياسية، الأخطاء الشائعة.<\/p>", "<p>يطلب المعلم من كل طالب كتابة «فكرة واحدة واضحة» و«فكرة واحدة غامضة» من الموضوع على بطاقتين ويجمعها.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يجمع المعلم البطاقات ويصنف الأفكار الغامضة، والطلبة يكتبون بطاقاتهم (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 2-2 (كتاب التجارب ص 47)، والطلبة يحلون فرديًا ثم في أزواج (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل الأسئلة 2–7 ويعالج الأفكار الغامضة المتكررة، والطلبة يحلون ويناقشون (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التأمل الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن نشاط 2-2 والأسئلة 2–7، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ساعة الفلج المرجعية: تشرح المجموعات حاجتنا إلى قطب الهيدروجين القياسي مرجعًا قيمته صفر، وتربطه باعتماد الأفلاج العمانية على الظل والنجوم مرجعًا لتوزيع حصص الماء بين المزارعين بالعدل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطأ في عبارة: «جهد قطب الهيدروجين القياسي ‎1.00 V»‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قيمته المصطلح عليها ‎0.00 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر نوع نصف الخلية ‎Br₂/Br⁻‎ وقطبها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لافلز/أيون، وقطبها بلاتين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الذي يقيسه الفولتميتر في خلية تحتوي قطب الهيدروجين القياسي ونصف خلية أخرى؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E°‎ لنصف الخلية الأخرى مباشرة (مع تحديد الإشارة من القطب الموجب).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تُحدد الإشارة من قطبية الخلية لا من قراءة الفولتميتر وحدها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الفولتميتر يقرأ المقدار، والإشارة تعتمد على ما إذا كانت نصف الخلية موجبة أو سالبة بالنسبة لقطب الهيدروجين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> نصف خلية مجهولة كانت القطب السالب وقرأ الفولتميتر ‎0.25 V‎ مع قطب الهيدروجين. ما ‎E°‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎−0.25 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الفكرة التي كانت غامضة لديك في هذا الموضوع؟ وكيف أصبحت أوضح؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إجابة تأملية شخصية تذكر فكرة محددة والطريقة التي ساعدت على فهمها.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-2 ص 47 والأسئلة المتبقية من 2–7<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع على بطاقة «الفكرة الغامضة» مع الابن ومساعدته في مراجعتها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=9<\/p>"]}]}, {"title": "جهود الاختزال القياسية", "sb": "ص 76–85", "unit": "الوحدة 2: الكيمياء الكهربائية", "periods": [{"axis": "حساب جهد الخلية القياسي ‎E°cell‎", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "جهود الاختزال القياسية"], ["الحصة", "1 من 5"], ["محور الحصة", "حساب جهد الخلية القياسي ‎E°cell‎"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 76–78"], ["دليل المعلم", "ص 106–110"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]], "t": ["1. يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب) (10 دقائق)\n2. يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر (10 دقائق)\nمخرج تعليمي آخر: يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس (20 دقيقة)", "1. تطبيق: يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)\n2. تطبيق: يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر\n3. تحليل (مخرج آخر): يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)", "جهد الخلية القياسي ‎E°cell‎، القطب الموجب، القطب السالب، الفرق بين جهدي نصفي الخلية.", "يعرض المعلم خلية ‎Ag/Zn‎ وقراءة ‎1.56 V‎ ويسأل: «كيف نحصل على هذه القيمة من قيمتي ‎E°‎ في الجدول دون أي قياس؟»", "1. يعرض المعلم الخلية ويطرح السؤال، والطلبة يقترحون حساب الفرق (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم العلاقة وقاعدة القطب الموجب ويحل أمثلة (‎Ag/Zn = 1.56 V‎، ‎Cu/Fe³⁺ = 0.43 V‎)، والطلبة يتبعون الحل ويتحققون من القيم (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم «حساب قيم جهود الخلايا القياسية» بمسائل متدرجة، والطلبة يحسبون ‎E°cell‎ لخمس خلايا في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب ‎E°cell‎ لخلية ‎Zn²⁺/Zn (−0.76)‎ مع ‎Cu²⁺/Cu (+0.34)‎.\n• الإجابة النموذجية: ‎E°cell = 0.34 − (−0.76) = 1.10 V‎.\n\n2. مستوى التطبيق: أي نصفي الخلية هو القطب الموجب في خلية ‎Ag⁺/Ag (+0.80)‎ مع ‎Cu²⁺/Cu (+0.34)‎؟\n• الإجابة النموذجية: ‎Ag⁺/Ag‎ لأن ‎E°‎ له أكبر.\n\n3. مستوى الاستدلال: احسب ‎E°cell‎ للخلية السابقة.\n• الإجابة النموذجية: ‎0.80 − 0.34 = 0.46 V‎.", "1. مستوى المعرفة: اكتب علاقة حساب ‎E°cell‎.\n• الإجابة النموذجية: ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)\n\n2. مستوى التطبيق: احسب ‎E°cell‎ لخلية ‎Mg²⁺/Mg (−2.38)‎ مع ‎Ag⁺/Ag (+0.80)‎.\n• الإجابة النموذجية: ‎0.80 − (−2.38) = 3.18 V‎.\n\n3. مستوى الاستدلال: خلية من ‎Cu²⁺/Cu (+0.34)‎ ونصف خلية مجهولة ‎X‎ هي القطب السالب، ‎E°cell = 0.59 V‎. احسب ‎E°‎ لـ ‎X‎.\n• الإجابة النموذجية: ‎E°(X) = 0.34 − 0.59 = −0.25 V‎.", "إرشاد للطالب: مراجعة ص 76–78 وحل خمس مسائل ‎E°cell‎\nإرشاد لولي الأمر: متابعة الابن في تحديد القطب الموجب قبل التعويض\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10"], "h": ["<ol class=\"ol\"><li>يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب) (10 دقائق)<\/li><li>يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)<\/span><\/div>", "<p>جهد الخلية القياسي ‎E°cell‎، القطب الموجب، القطب السالب، الفرق بين جهدي نصفي الخلية.<\/p>", "<p>يعرض المعلم خلية ‎Ag/Zn‎ وقراءة ‎1.56 V‎ ويسأل: «كيف نحصل على هذه القيمة من قيمتي ‎E°‎ في الجدول دون أي قياس؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض ا pan><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب علاقة حساب ‎E°cell‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎E°cell‎ لخلية ‎Mg²⁺/Mg (−2.38)‎ مع ‎Ag⁺/Ag (+0.80)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎0.80 − (−2.38) = 3.18 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> خلية من ‎Cu²⁺/Cu (+0.34)‎ ونصف خلية مجهولة ‎X‎ هي القطب السالب، ‎E°cell = 0.59 V‎. احسب ‎E°‎ لـ ‎X‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎E°(X) = 0.34 − 0.59 = −0.25 V‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 76–78 وحل خمس مسائل ‎E°cell‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في تحديد القطب الموجب قبل التعويض<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10<\/p>"]}, {"axis": "إشارة الأقطاب واتجاه تدفق الإلكترونات", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "جهود الاختزال القياسية"], ["الحصة", "2 من 5"], ["محور الحصة", "إشارة الأقطاب واتجاه تدفق الإلكترونات"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 78–80"], ["دليل المعلم", "ص 106–110"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]], "t": ["1. يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎ (10 دقائق)\n2. يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية (5 دقائق)\nمخرج تعليمي آخر: يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة (25 دقيقة)", "1. تطبيق: يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎\n2. تطبيق: يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية\n3. تطبيق (مخرج آخر): يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة", "- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم التبادلي", "- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية", "اتجاه تدفق الإلكترونات، المصعد (‎E°‎ أقل)، المهبط (‎E°‎ أكبر)، التفاعل الكلي للخلية، موازنة الإلكترونات.", "يعرض المعلم الشكل 2-14 (خلية ‎Cu/Fe³⁺‎) ويسأل: «في أي اتجاه تتحرك الإلكترونات في السلك؟ وكيف نعرف دون تجربة؟»", "1. يعرض المعلم الشكل ويطرح السؤال، والطلبة يقترحون مقارنة قيمتي ‎E°‎ (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ينظم القراءة التبادلية: طالب يقرأ «التنبؤ باتجاه تدفق الإلكترونات» وآخر «التنبؤ بقيم جهد الخلية» ثم يتبادلان الشرح، ويشرح كل منهما لزميله ويلخصان القاعدتين (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. يوجه المعلم حل السؤال 11 وكتابة التفاعلات الكلية، والطلبة يحددون الاتجاه ويكتبون المعادلات الموزونة (15 دقيقة)\nالاستراتيجيات: التعلم التبادلي.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: في أي اتجاه تتدفق الإلكترونات في الدائرة الخارجية؟\n• الإجابة النموذجية: من نصف الخلية ذات ‎E°‎ الأقل (المصعد) إلى ذات ‎E°‎ الأكبر (المهبط).\n\n2. مستوى التطبيق: اكتب التفاعل الكلي لخلية ‎Cu²⁺/Cu‎ مع ‎Fe³⁺/Fe²⁺‎.\n• الإجابة النموذجية: ‎Cu + 2Fe³⁺ → Cu²⁺ + 2Fe²⁺‎\n\n3. مستوى الاستدلال: لماذا نضرب نصف معادلة ‎Fe³⁺/Fe²⁺‎ في 2 قبل الجمع؟\n• الإجابة النموذجية: لتتساوى أعداد الإلكترونات المفقودة والمكتسبة.", "1. مستوى المعرفة: في خلية ‎Zn/Ag‎، أي القطبين يتأكسد؟\n• الإجابة النموذجية: الخارصين.\n\n2. مستوى التطبيق: حدد اتجاه الإلكترونات في خلية ‎I₂/I⁻ (+0.54)‎ مع ‎F₂/F⁻ (+2.87)‎.\n• الإجابة النموذجية: من نصف خلية ‎I₂/I⁻‎ إلى نصف خلية ‎F₂/F⁻‎.\n\n3. مستوى الاستدلال: اكتب التفاعل الكلي لخلية ‎Ni²⁺/Ni (−0.25)‎ مع ‎Cu²⁺/Cu (+0.34)‎ واحسب ‎E°cell‎.\n• الإجابة النموذجية: ‎Ni + Cu²⁺ → Ni²⁺ + Cu‎؛ ‎E°cell = 0.59 V‎.", "إرشاد للطالب: مراجعة ص 78–80 وحل السؤال 11\nإرشاد لولي الأمر: سؤال الابن عن قاعدة «من الأقل إلى الأكبر» في اتجاه الإلكترونات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10"], "h": ["<ol class=\"ol\"><li>يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎ (10 دقائق)<\/li><li>يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة (25 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التشاركي<\/span><span class=\"chip\">التعلم التبادلي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية<\/span><\/div>", "<p>اتجاه تدفق الإلكترونات، المصعد (‎E°‎ أقل)، المهبط (‎E°‎ أكبر)، التفاعل الكلي للخلية، موازنة الإلكترونات.<\/p>", "<p>يعرض المعلم الشكل 2-14 (خلية ‎Cu/Fe³⁺‎) ويسأل: «في أي اتجاه تتحرك الإلكترونات في السلك؟ وكيف نعرف دون تجربة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الشكل ويطرح السؤال، والطلبة يقترحون مقارنة قيمتي ‎E°‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينظم القراءة التبادلية: طالب يقرأ «التنبؤ باتجاه تدفق الإلكترونات» وآخر «التنبؤ بقيم جهد الخلية» ثم يتبادلان الشرح، ويشرح كل منهما لزميله ويلخصان القاعدتين (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل السؤال 11 وكتابة التفاعلات الكلية، والطلبة يحددون الاتجاه ويكتبون المعادلات الموزونة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التبادلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> في أي اتجاه تتدفق الإلكترونات في الدائرة الخارجية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من نصف الخلية ذات ‎E°‎ الأقل (المصعد) إلى ذات ‎E°‎ الأكبر (المهبط).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب التفاعل الكلي لخلية ‎Cu²⁺/Cu‎ مع ‎Fe³⁺/Fe²⁺‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Cu + 2Fe³⁺ → Cu²⁺ + 2Fe²⁺‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا نضرب نصف معادلة ‎Fe³⁺/Fe²⁺‎ في 2 قبل الجمع؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتتساوى أعداد الإلكترونات المفقودة والمكتسبة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> في خلية ‎Zn/Ag‎، أي القطبين يتأكسد؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الخارصين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> حدد اتجاه الإلكترونات في خلية ‎I₂/I⁻ (+0.54)‎ مع ‎F₂/F⁻ (+2.87)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: من نصف خلية ‎I₂/I⁻‎ إلى نصف خلية ‎F₂/F⁻‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب التفاعل الكلي لخلية ‎Ni²⁺/Ni (−0.25)‎ مع ‎Cu²⁺/Cu (+0.34)‎ واحسب ‎E°cell‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Ni + Cu²⁺ → Ni²⁺ + Cu‎؛ ‎E°cell = 0.59 V‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 78–80 وحل السؤال 11<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن قاعدة «من الأقل إلى الأكبر» في اتجاه الإلكترونات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10<\/p>"]}, {"axis": "التنبؤ بإمكانية حدوث التفاعل", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "جهود الاختزال القياسية"], ["الحصة", "3 من 5"], ["محور الحصة", "التنبؤ بإمكانية حدوث التفاعل"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 80–83"], ["دليل المعلم", "ص 106–110"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]], "t": ["1. يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا) (15 دقيقة)\n2. يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9) (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل) (10 دقائق)", "1. تطبيق: يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا)\n2. تحليل: يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9)\n3. تقييم (مخرج آخر): يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل)", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية", "الإمكانية (الجدوى)، ‎E°cell‎ الموجب، التفاعل التلقائي، طاقة التنشيط، سرعة التفاعل، الظروف غير القياسية.", "يسأل المعلم: «هل يستطيع الكلور أكسدة أيونات البروميد؟ وهل يستطيع اليود أكسدة أيونات البروميد؟ كيف نعرف قبل التجربة؟»", "1. يطرح المعلم السؤالين، والطلبة يتوقعون باستخدام نشاطية الهالوجينات (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ينفذ المعلم «التنبؤ بحدوث التفاعلات» ويشرح قاعدة ‎E°cell > 0‎ والمثالين 4 و5، والطلبة يطبقون القاعدة على تفاعلي الكلور واليود (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل السؤال 9 (اقتراح مواد لأكسدة أو اختزال) في مجموعات، والطلبة يقترحون المواد ويبررون بالحساب (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: هل يتفاعل ‎Cl₂ (+1.36)‎ مع ‎Br⁻ (Br₂/Br⁻ = +1.07)‎؟\n• الإجابة النموذجية: نعم؛ ‎E°cell = 1.36 − 1.07 = +0.29 V‎ موجب.\n\n2. مستوى التطبيق: هل يتفاعل ‎I₂ (+0.54)‎ مع ‎Br⁻‎؟\n• الإجابة النموذجية: لا؛ ‎E°cell = 0.54 − 1.07 = −0.53 V‎ سالب.\n\n3. مستوى الاستدلال: لماذا قد لا يُلاحظ تفاعل رغم أن ‎E°cell‎ موجب؟\n• الإجابة النموذجية: لأن طاقة التنشيط عالية فيكون التفاعل بطيئًا جدًا، أو لأن الظروف غير قياسية.", "1. مستوى المعرفة: ما شرط إمكانية حدوث التفاعل وفق ‎E°‎؟\n• الإجابة النموذجية: أن تكون قيمة ‎E°cell‎ موجبة.\n\n2. مستوى التطبيق: هل يذيب حمض ‎HCl (H⁺)‎ فلز النحاس ‎(Cu²⁺/Cu = +0.34)‎؟\n• الإجابة النموذجية: لا؛ ‎E°cell = 0.00 − 0.34 = −0.34 V‎ سالب.\n\n3. مستوى الاستدلال: اقترح مادة لاختزال ‎Fe³⁺‎ إلى ‎Fe²⁺‎ وبرر اختيارك.\n• الإجابة النموذجية: ‎I⁻ (E° = +0.54)‎ لأن ‎E°cell = 0.77 − 0.54 = +0.23 V‎ موجب، أو ‎Zn‎.", "إرشاد للطالب: مراجعة ص 80–83 وحل السؤال 9\nإرشاد لولي الأمر: تشجيع الابن على التحقق من الإشارة قبل الحكم على إمكانية التفاعل\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10"], "h": ["<ol class=\"ol\"><li>يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا) (15 دقيقة)<\/li><li>يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9) (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل) (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل)<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية<\/span><\/div>", "<p>الإمكانية (الجدوى)، ‎E°cell‎ الموجب، التفاعل التلقائي، طاقة التنشيط، سرعة التفاعل، الظروف غير القياسية.<\/p>", "<p>يسأل المعلم: «هل يستطيع الكلور أكسدة أيونات البروميد؟ وهل يستطيع اليود أكسدة أيونات البروميد؟ كيف نعرف قبل التجربة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤالين، والطلبة يتوقعون باستخدام نشاطية الهالوجينات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «التنبؤ بحدوث التفاعلات» ويشرح قاعدة ‎E°cell &gt; 0‎ والمثالين 4 و5، والطلبة يطبقون القاعدة على تفاعلي الكلور واليود (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل السؤال 9 (اقتراح مواد لأكسدة أو اختزال) في مجموعات، والطلبة يقترحون المواد ويبررون بالحساب (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل يتفاعل ‎Cl₂ (+1.36)‎ مع ‎Br⁻ (Br₂/Br⁻ = +1.07)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نعم؛ ‎E°cell = 1.36 − 1.07 = +0.29 V‎ موجب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل يتفاعل ‎I₂ (+0.54)‎ مع ‎Br⁻‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا؛ ‎E°cell = 0.54 − 1.07 = −0.53 V‎ سالب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا قد لا يُلاحظ تفاعل رغم أن ‎E°cell‎ موجب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن طاقة التنشيط عالية فيكون التفاعل بطيئًا جدًا، أو لأن الظروف غير قياسية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما شرط إمكانية حدوث التفاعل وفق ‎E°‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن تكون قيمة ‎E°cell‎ موجبة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل يذيب حمض ‎HCl (H⁺)‎ فلز النحاس ‎(Cu²⁺/Cu = +0.34)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا؛ ‎E°cell = 0.00 − 0.34 = −0.34 V‎ سالب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح مادة لاختزال ‎Fe³⁺‎ إلى ‎Fe²⁺‎ وبرر اختيارك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I⁻ (E° = +0.54)‎ لأن ‎E°cell = 0.77 − 0.54 = +0.23 V‎ موجب، أو ‎Zn‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 80–83 وحل السؤال 9<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التحقق من الإشارة قبل الحكم على إمكانية التفاعل<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10<\/p>"]}, {"axis": "القوة النسبية للعوامل المؤكسدة والمختزلة", "n": 4, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "جهود الاختزال القياسية"], ["الحصة", "4 من 5"], ["محور الحصة", "القوة النسبية للعوامل المؤكسدة والمختزلة"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 83–85"], ["دليل المعلم", "ص 106–110"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]], "t": ["1. يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة (10 دقائق)\n2. يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16 (25 دقيقة)\nمخرج تعليمي آخر: يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم (5 دقائق)", "1. تحليل: يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة\n2. تطبيق: يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16\n3. تطبيق (مخرج آخر): يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)", "العامل المؤكسد الأقوى (‎E°‎ الأكبر)، العامل المختزل الأقوى (‎E°‎ الأصغر)، الطرف الأيسر والأيمن من نصف المعادلة، الترتيب.", "يعرض المعلم الشكل 2-16 ويسأل: «أين يقع أقوى عامل مؤكسد في هذه السلسلة؟ وأين يقع أقوى عامل مختزل؟»", "1. يعرض المعلم الشكل ويطرح السؤال، والطلبة يحددون موقعيهما (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «قيم ‎E°‎ والعوامل المؤكسدة والمختزلة» ويشرح قراءة السلسلة (يسار: مؤكسدات، يمين: مختزلات)، والطلبة يرتبون أمثلة حسب القوة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل السؤال 10 ومسائل ترتيب إضافية، والطلبة يحلون في أزواج ويعرضون (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الكرسي الساخن: يجلس طالب متطوع أمام زملائه ويجيب عن أسئلتهم حول القوة النسبية للعوامل المؤكسدة والمختزلة، ويبدأ المعلم بسؤال «رتب تصاعديًا حسب قوة العامل المؤكسد: ‎Cl₂ (+1.36)‎، ‎I₂ (+0.54)‎، ‎Br₂ (+1.07)‎» (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم:\n1. مستوى المعرفة: أي الأيونين أقوى عاملًا مؤكسدًا: ‎Ag⁺ (+0.80)‎ أم ‎Cu²⁺ (+0.34)‎؟\n• الإجابة النموذجية: ‎Ag⁺‎.\n\n2. مستوى التطبيق: أي الفلزين أقوى عاملًا مختزلًا: ‎Mg (−2.38)‎ أم ‎Zn (−0.76)‎؟\n• الإجابة النموذجية: ‎Mg‎.\n\n3. مستوى الاستدلال: لماذا يُعد ‎F₂‎ أقوى عامل مؤكسد في السلسلة؟\n• الإجابة النموذجية: لأن ‎E°‎ لـ ‎F₂/F⁻‎ أكبر قيمة ‎(+2.87 V)‎ فيميل بشدة لكسب الإلكترونات.", "1. مستوى المعرفة: أين يقع العامل المختزل في نصف معادلة الاختزال؟\n• الإجابة النموذجية: في الطرف الأيمن (الناتج).\n\n2. مستوى التطبيق: رتب تصاعديًا حسب قوة العامل المؤكسد: ‎Cl₂ (+1.36)‎، ‎I₂ (+0.54)‎، ‎Br₂ (+1.07)‎.\n• الإجابة النموذجية: ‎I₂ < Br₂ < Cl₂‎.\n\n3. مستوى الاستدلال: أي الأيونات ‎Ag⁺‎ و‎Cr²⁺‎ و‎Fe²⁺‎ يحتاج إلى العامل المختزل الأقوى ليُختزل إلى فلز؟ (‎E°: Ag⁺/Ag = +0.80‎، ‎Fe²⁺/Fe = −0.44‎، ‎Cr²⁺/Cr = −0.91‎)\n• الإجابة النموذجية: ‎Cr²⁺‎ لأن ‎E°‎ له الأصغر فهو الأصعب اختزالًا.", "إرشاد للطالب: مراجعة ص 83–85 وحل السؤال 10\nإرشاد لولي الأمر: سؤال الابن عن أقوى عامل مؤكسد وأقوى عامل مختزل في السلسلة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10"], "h": ["<ol class=\"ol\"><li>يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة (10 دقائق)<\/li><li>يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16 (25 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم (5 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)<\/span><\/div>", "<p>العامل المؤكسد الأقوى (‎E°‎ الأكبر)، العامل المختزل الأقوى (‎E°‎ الأصغر)، الطرف الأيسر والأيمن من نصف المعادلة، الترتيب.<\/p>", "<p>يعرض المعلم الشكل 2-16 ويسأل: «أين يقع أقوى عامل مؤكسد في هذه السلسلة؟ وأين يقع أقوى عامل مختزل؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin: مستوى الاستدلال:<\/b> لماذا يُعد ‎F₂‎ أقوى عامل مؤكسد في السلسلة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎E°‎ لـ ‎F₂/F⁻‎ أكبر قيمة ‎(+2.87 V)‎ فيميل بشدة لكسب الإلكترونات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين يقع العامل المختزل في نصف معادلة الاختزال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في الطرف الأيمن (الناتج).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> رتب تصاعديًا حسب قوة العامل المؤكسد: ‎Cl₂ (+1.36)‎، ‎I₂ (+0.54)‎، ‎Br₂ (+1.07)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎I₂ &lt; Br₂ &lt; Cl₂‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أي الأيونات ‎Ag⁺‎ و‎Cr²⁺‎ و‎Fe²⁺‎ يحتاج إلى العامل المختزل الأقوى ليُختزل إلى فلز؟ (‎E°: Ag⁺/Ag = +0.80‎، ‎Fe²⁺/Fe = −0.44‎، ‎Cr²⁺/Cr = −0.91‎)<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Cr²⁺‎ لأن ‎E°‎ له الأصغر فهو الأصعب اختزالًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 83–85 وحل السؤال 10<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن أقوى عامل مؤكسد وأقوى عامل مختزل في السلسلة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=10<\/p>"]}, {"axis": "الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ونشاط 2-3", "n": 5, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "جهود الاختزال القياسية"], ["الحصة", "5 من 5"], ["محور الحصة", "الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ونشاط 2-3"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 76–85 + كتاب التجارب ص 49 و59"], ["دليل المعلم", "ص 106–110"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]], "t": ["1. يبني خلايا جلفانية من أنصاف خلايا مختلفة ويقيس فولتيتها (10 دقائق)\n2. يقارن القيم المقيسة بالقيم المحسوبة من ‎E°‎ ويفسر الفروق (10 دقائق)\nمخرج تعليمي آخر: يحل نشاط 2-3 «قيم فولتية الخلايا الكهروكيميائية» (20 دقيقة)", "1. تطبيق: يبني خلايا جلفانية من أنصاف خلايا مختلفة ويقيس فولتيتها\n2. تحليل: يقارن القيم المقيسة بالقيم المحسوبة من ‎E°‎ ويفسر الفروق\n3. تطبيق (مخرج آخر): يحل نشاط 2-3 «قيم فولتية الخلايا الكهروكيميائية»", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: أنصاف خلايا ‎Zn‎ و‎Cu‎ و‎Fe‎ و‎Ag‎ ومحاليلها، قنطرة ملحية، فولتميتر رقمي، أسلاك", "الفولتية المقيسة، الفولتية المحسوبة، الظروف غير القياسية، المقاومة الداخلية، نظافة الأقطاب.", "يسأل المعلم: «حسبنا أن خلية ‎Zn/Cu‎ تعطي ‎1.10 V‎؛ هل تتوقع أن يقرأ الفولتميتر هذه القيمة تمامًا في المختبر؟ لماذا؟»", "1. يطرح المعلم السؤال ويراجع السلامة (محاليل نترات الفضة)، والطلبة يقترحون أسباب الاختلاف المحتملة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجه المعلم تنفيذ الاستقصاء العملي 2-1 (كتاب التجارب ص 59) وبناء ثلاث خلايا، والطلبة يقيسون الفولتية ويسجلونها مع القيم المحسوبة في جدول (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يناقش المعلم أسباب الفروق ويوجه حل نشاط 2-3 (ص 49)، والطلبة يفسرون الفروق ويحلون النشاط (9 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – بطارية 2040: تحسب المجموعات E°cell لخلية خارصين–نحاس، ثم تقترح استخدامًا لتخزين الطاقة الشمسية في عمان يخدم توجّه رؤية عمان 2040 نحو الطاقة المتجددة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: لماذا تختلف الفولتية المقيسة عن المحسوبة غالبًا؟\n• الإجابة النموذجية: لأن الظروف قد لا تكون قياسية (تراكيز وحرارة)، ولوجود طبقات أكاسيد على الأقطاب ومقاومة في الدائرة.\n\n2. مستوى التطبيق: لماذا تُنظف الأقطاب بورق صنفرة قبل الاستخدام؟\n• الإجابة النموذجية: لإزالة طبقات الأكس e=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تختلف الفولتية المقيسة عن المحسوبة غالبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الظروف قد لا تكون قياسية (تراكيز وحرارة)، ولوجود طبقات أكاسيد على الأقطاب ومقاومة في الدائرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تُنظف الأقطاب بورق صنفرة قبل الاستخدام؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لإزالة طبقات الأكسيد التي تعيق تبادل الإلكترونات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما احتياط السلامة عند استخدام محلول نترات الفضة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ارتداء القفازات والنظارات لأنه يلوث الجلد ومهيج.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أي خلية تتوقع أن تعطي أكبر فولتية: ‎Zn/Cu‎ أم ‎Zn/Ag‎ أم ‎Cu/Ag‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Zn/Ag (1.56 V)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر متغيرين يجب ضبطهما في هذا الاستقصاء.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تراكيز المحاليل ودرجة الحرارة (ونوع القنطرة الملحية).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تحسينًا يقرب القيم المقيسة من المحسوبة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: استخدام محاليل بتركيز ‎1.00 mol/dm³‎ بدقة، وتنظيف الأقطاب، واستخدام فولتميتر رقمي عالي المقاومة، والقياس عند ‎298 K‎.<\/span><\/p><\/div>", "<p><b>إرشاد ل م أثر زيادة ‎[Ag⁺]‎ على اتزان ‎Ag⁺ + e⁻ ⇌ Ag‎ وقيمة ‎Er‎ بالشكل 2-18، والطلبة يتنبؤون باتجاه الإزاحة والأثر على الجهد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم «التغيرات التي تحدث في نظام أيون-أيون» ‎(Fe³⁺/Fe²⁺)‎ بجدول تنبؤات، والطلبة يتنبؤون ثم يتحققون ويشرحون التغيرات (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ماذا يحدث لقيمة ‎Er‎ لنصف الخلية ‎Ag⁺/Ag‎ عند زيادة ‎[Ag⁺]‎؟\n• الإجابة النموذجية: تزداد (تصبح أكثر موجبية) لأن الاتزان يُزاح نحو اليمين.\n\n2. مستوى التطبيق: ماذا يحدث لـ ‎Er‎ لنصف الخلية ‎Fe³⁺/Fe²⁺‎ عند زيادة ‎[Fe²⁺]‎؟\n• الإجابة النموذجية: تقل لأن الاتزان يُزاح نحو اليسار.\n\n3. مستوى الاستدلال: في خلية ‎Cu/Ag‎، ماذا يحدث لجهد الخلية عند تخفيف محلول ‎Ag⁺‎؟\n• الإجابة النموذجية: يقل لأن ‎Er‎ للقطب الموجب يقل.", "1. مستوى المعرفة: ما المبدأ المستخدم للتنبؤ النوعي بأثر التركيز؟\n• الإجابة النموذجية: مبدأ لوشاتلييه.\n\n2. مستوى التطبيق: كيف يتغير ‎Er‎ لـ ‎Zn²⁺/Zn‎ عند تقليل ‎[Zn²⁺]‎؟\n• الإجابة النموذجية: يقل (يصبح أكثر سالبية).\n\n3. مستوى الاستدلال: لماذا ينخفض جهد البطارية أثناء الاستعمال؟\n• الإجابة النموذجية: لأن تراكيز المواد المتفاعلة تقل وتراكيز النواتج تزداد فتتغير ‎Er‎ لنصفي الخلية ويقل الفرق بينهما.", "إرشاد للطالب: مراجعة ص 86–87 وإكمال جدول التنبؤات\nإرشاد لولي الأمر: الحديث مع الابن عن العادات الصحيحة لشحن البطاريات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=11"], "h": ["<ol class=\"ol\"><li>يتنبأ نوعيًا بأثر تغير تركيز الأيونات على قيمة جهد الاختزال لنصف خلية باستخدام مبدأ لوشاتلييه (25 دقيقة)<\/li><li>يفسر كيف يؤثر تغير جهد نصف الخلية على جهد الخلية الكلي (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط بين نقص الجهد ونفاد البطارية أثناء الاستعمال (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يتنبأ نوعيًا بأثر تغير تركيز الأيونات على قيمة جهد الاختزال لنصف خلية باستخدام مبدأ لوشاتلييه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يفسر كيف يؤثر تغير جهد نصف الخلية على جهد الخلية الكلي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يربط بين نقص الجهد ونفاد البطارية أثناء الاستعمال<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: خلية ‎Cu/Ag‎ ومحاليل نترات الفضة بتراكيز مختلفة للعرض<\/span><\/div>", "<p>الظروف غير القياسية، ‎Er‎، مبدأ لوشاتلييه، زيادة التركيز تزيد ‎Er‎، نقص التركيز يقلل ‎Er‎، التغيرات في نظام أيون-أيون.<\/p>", "<p>يسأل المعلم: «لماذا تضعف بطارية الهاتف تدريجيًا قبل أن تنفد تمامًا؟ ما الذي يتغير داخلها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون تغير تراكيز المواد المتفاعلة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم أثر زيادة ‎[Ag⁺]‎ على اتزان ‎Ag⁺ + e⁻ ⇌ Ag‎ وقيمة ‎Er‎ بالشكل 2-18، والطلبة يتنبؤون باتجاه الإزاحة والأثر على الجهد (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم «التغيرات التي تحدث في نظام أيون-أيون» ‎(Fe³⁺/Fe²⁺)‎ بجدول تنبؤات، والطلبة يتنبؤون ثم يتحققون ويشرحون التغيرات (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يحدث لقيمة ‎Er‎ لنصف الخلية ‎Ag⁺/Ag‎ عند زيادة ‎[Ag⁺]‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تزداد (تصبح أكثر موجبية) لأن الاتزان يُزاح نحو اليمين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لـ ‎Er‎ لنصف الخلية ‎Fe³⁺/Fe²⁺‎ عند زيادة ‎[Fe²⁺]‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقل لأن الاتزان يُزاح نحو اليسار.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> في خلية ‎Cu/Ag‎، ماذا يحدث لجهد الخلية عند تخفيف محلول ‎Ag⁺‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يقل لأن ‎Er‎ للقطب الموجب يقل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المبدأ المستخدم للتنبؤ النوعي بأثر التركيز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: مبدأ لوشاتلييه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف يتغير ‎Er‎ لـ ‎Zn²⁺/Zn‎ عند تقليل ‎[Zn²⁺]‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يقل (يصبح أكثر سالبية).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ينخفض جهد البطارية أثناء الاستعمال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن تراكيز المواد المتفاعلة تقل وتراكيز النواتج تزداد فتتغير ‎Er‎ لنصفي الخلية ويقل الفرق بينهما.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 86–87 وإكمال جدول التنبؤات<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن العادات الصحيحة لشحن البطاريات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=11<\/p>"]}, {"axis": "معادلة نيرنست وحساباتها", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "تأثير تراكيز الأيونات على قيم جهود الاختزال ‎(Er)‎"], ["الحصة", "2 من 3"], ["محور الحصة", "معادلة نيرنست وحساباتها"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "ص 87–89"], ["دليل المعلم", "ص 109–114"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: أثر تغير التركيز على قيم جهود الاختزال ص 52؛ الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ص 68"]], "t": ["1. يستخدم معادلة نيرنست ‎Er = E° − (0.059/z) log Q‎ لحساب جهد نصف خلية في ظروف غير قياسية (25 دقيقة)\n2. يحسب جهد خلية مكونة من نصفي خلية أحدهما أو كلاهما غير قياسي (5 دقائق)\nمخرج تعليمي آخر: يفسر شكل العلاقة البيانية بين ‎Ecell‎ و‎log[Ag⁺] (‎الشكل 2-18) (10 دقائق)", "1. تطبيق: يستخدم معادلة نيرنست ‎Er = E° − (0.059/z) log Q‎ لحساب جهد نصف خلية في ظروف غير قياسية\n2. تطبيق: يحسب جهد خلية مكونة من نصفي خلية أحدهما أو كلاهما غير قياسي\n3. تحليل (مخرج آخر): يفسر شكل العلاقة البيانية بين ‎Ecell‎ و‎log[Ag⁺] (‎الشكل 2-18)", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "معادلة نيرنست، ‎Q (‎حاصل التفاعل)، ‎z (‎عدد الإلكترونات)، 0.059، ‎log₁₀‎، الظروف غير القياسية.", "يعرض المعلم الشكل ‎2-18 (Ecell‎ مقابل ‎log[Ag⁺]‎) ويسأل: «العلاقة خط مستقيم؛ ما الذي يجعلها خطية مع اللوغاريتم؟»", "1. يعرض المعلم الشكل ويطرح السؤال، والطلبة يلاحظون الخطية ويقترحون معادلة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم معادلة نيرنست وتبسيطها والصيغة المتوقعة ويحل مثالًا لـ ‎Ag⁺/Ag‎، والطلبة يتبعون خطوات التعويض ويكتبون ‎Q‎ لكل نصف خلية (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل لـ ‎Cu²⁺/Cu‎ و‎Zn²⁺/Zn‎ وخلية كاملة غير قياسية، والطلبة يحلون في أزواج ويتحققون من الإشارات (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب صيغة معادلة نيرنست المبسطة.\n• الإجابة النموذجية: ‎Er = E° − (0.059/z) log Q‎\n\n2. مستوى التطبيق: احسب ‎Er‎ لـ ‎Ag⁺/Ag (E° = +0.80)‎ عندما ‎[Ag⁺] = 0.010 mol/dm³‎.\n• الإجابة النموذجية: ‎Q = 1/[Ag⁺] = 100‎؛ ‎Er = 0.80 − 0.059 × 2 = 0.68 V‎.\n\n3. مستوى الاستدلال: احسب ‎Er‎ لـ ‎Cu²⁺/Cu (E° = +0.34)‎ عندما ‎[Cu²⁺] = 0.0010 mol/dm³‎.\n• الإجابة النموذجية: ‎Q = 1000‎؛ ‎Er = 0.34 − (0.059/2) × 3 = 0.25 V‎.", "1. مستوى المعرفة: ما الذي يمثله ‎z‎ في معادلة نيرنست؟\n• الإجابة النموذجية: عدد الإلكترونات المتبادلة في نصف التفاعل.\n\n2. مستوى التطبيق: احسب ‎Er‎ لـ ‎Zn²⁺/Zn (E° = −0.76)‎ عندما ‎[Zn²⁺] = 0.10 mol/dm³‎.\n• الإجابة النموذجية: ‎Q = 10‎؛ ‎Er = −0.76 − 0.0295 = −0.79 V‎.\n\n3. مستوى الاستدلال: احسب ‎Ecell‎ لخلية ‎Zn²⁺(0.10)/Zn‎ مع ‎Cu²⁺(1.00)/Cu‎.\n• الإجابة النموذجية: ‎Er(Cu) = 0.34‎؛ ‎Er(Zn) = −0.79‎؛ ‎Ecell = 0.34 − (−0.79) = 1.13 V‎.", "إرشاد للطالب: مراجعة ص 87–89 وحل ثلاث مسائل نيرنست\nإرشاد لولي الأمر: متابعة الابن في كتابة ‎Q‎ بصورة صحيحة قبل التعويض\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=11"], "h": ["<ol class=\"ol\"><li>يستخدم معادلة نيرنست ‎Er = E° − (0.059/z) log Q‎ لحساب جهد نصف خلية في ظروف غير قياسية (25 دقيقة)<\/li><li>يحسب جهد خلية مكونة من نصفي خلية أحدهما أو كلاهما غير قياسي (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر شكل العلاقة البيانية بين ‎Ecell‎ و‎log[Ag⁺] (‎الشكل 2-18) (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تط p\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب صيغة معادلة نيرنست المبسطة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Er = E° − (0.059/z) log Q‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎Er‎ لـ ‎Ag⁺/Ag (E° = +0.80)‎ عندما ‎[Ag⁺] = 0.010 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 1/[Ag⁺] = 100‎؛ ‎Er = 0.80 − 0.059 × 2 = 0.68 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎Er‎ لـ ‎Cu²⁺/Cu (E° = +0.34)‎ عندما ‎[Cu²⁺] = 0.0010 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 1000‎؛ ‎Er = 0.34 − (0.059/2) × 3 = 0.25 V‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الذي يمثله ‎z‎ في معادلة نيرنست؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عدد الإلكترونات المتبادلة في نصف التفاعل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎Er‎ لـ ‎Zn²⁺/Zn (E° = −0.76)‎ عندما ‎[Zn²⁺] = 0.10 mol/dm³‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 10‎؛ ‎Er = −0.76 − 0.0295 = −0.79 V‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎Ecell‎ لخلية ‎Zn²⁺(0.10)/Zn‎ مع ‎Cu²⁺(1.00)/Cu‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Er(Cu) = 0.34‎؛ ‎Er(Zn) = −0.79‎؛ ‎Ecell = 0.34 − (−0.79) = 1.13 V‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 87–89 وحل ثلاث مسائل نيرنست<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة ‎Q‎ بصورة صحيحة قبل التعويض<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=11<\/p>"]}, {"axis": "الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ونشاط 2-4", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "تأثير تراكيز الأيونات على قيم جهود الاختزال ‎(Er)‎"], ["الحصة", "3 من 3"], ["محور الحصة", "الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ونشاط 2-4"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "ص 86–89 + كتاب التجارب ص 52 و68"], ["دليل المعلم", "ص 109–114"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-4: أثر تغير التركيز على قيم جهود الاختزال ص 52؛ الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ص 68"]], "t": ["1. يخطط وينفذ تجربة لقياس أثر تغير تركيز الأيونات على جهد خلية كهروكيميائية (10 دقائق)\n2. يقارن النتائج التجريبية بالقيم المحسوبة بمعادلة نيرنست (15 دقيقة)\nمخرج تعليمي آخر: يحل نشاط 2-4 «أثر تغير التركيز على قيم جهود الاختزال» (15 دقيقة)", "1. تطبيق: يخطط وينفذ تجربة لقياس أثر تغير تركيز الأيونات على جهد خلية كهروكيميائية\n2. تحليل: يقارن النتائج التجريبية بالقيم المحسوبة بمعادلة نيرنست\n3. تطبيق (مخرج آخر): يحل نشاط 2-4 «أثر تغير التركيز على قيم جهود الاختزال»", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: محاليل ‎CuSO₄‎ بتراكيز مخففة متتالية، نصف خلية ‎Zn‎، قنطرة ملحية، فولتميتر رقمي", "التخفيف المتسلسل، المتغير المستقل والتابع والمضبوط، الرسم البياني ‎Ecell‎ مقابل ‎log[Cu²⁺]‎، الميل.", "يسأل المعلم: «لو خففنا محلول ‎CuSO₄‎ عشر مرات، فبكم تتوقع أن يتغير جهد خلية ‎Zn/Cu‎ حسب نيرنست؟»", "1. يطرح المعلم السؤال ويطلب تنبؤًا مكتوبًا، والطلبة يحسبون التغير المتوقع ‎(≈ 0.03 V)‎ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجه المعلم تخطيط وتنفيذ الاستقصاء العملي 2-3 (كتاب التجارب ص 68) بتخفيفات متتالية، والطلبة يحضرون التخفيفات ويقيسون ‎Ecell‎ لكل تركيز ويسجلون (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم رسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎ وحل نشاط 2-4 (ص 52)، والطلبة يرسمون ويحسبون الميل ويقارنونه بـ 0.0295 (9 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ملوحة الباطنة: تتنبّأ المجموعات بأثر تغيّر تركيز الأيونات في جهد الاختزال، ثم تتحاور حول أثر زيادة ملوحة المياه الجوفية في مزارع الباطنة وطرق ترشيد الماء (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم:\n1. مستوى المعرفة: ما المتغير المستقل في هذا الاستقصاء؟\n• الإجابة النموذجية: تركيز أيونات ‎Cu²⁺‎.\n\n2. مستوى التطبيق: ما الميل المتوقع للرسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎؟\n• الإجابة النموذجية: ‎0.059/2 ≈ 0.030 V‎ لكل وحدة ‎log‎.\n\n3. مستوى الاستدلال: كيف تحضر محلولًا تركيزه ‎0.10 mol/dm³‎ من محلول ‎1.0 mol/dm³‎؟\n• الإجابة النموذجية: بأخذ ‎10 cm³‎ من المحلول وإكمالها بالماء المقطر إلى ‎100 cm³‎.", "1. مستوى المعرفة: اذكر متغيرين مضبوطين.\n• الإجابة النموذجية: درجة الحرارة ونصف خلية ‎Zn (‎تركيزها ونوع القطب).\n\n2. مستوى التطبيق: لماذا يقل ‎Ecell‎ عند تخفيف محلول ‎Cu²⁺‎؟\n• الإجابة النموذجية: لأن ‎Er‎ للقطب الموجب ‎(Cu)‎ يقل مع انخفاض ‎[Cu²⁺]‎.\n\n3. مستوى الاستدلال: كانت قيمة الميل التجريبي ‎0.025 V‎. قيّم النتيجة واقترح سببًا للفرق.\n• الإجابة النموذجية: قريبة من القيمة النظرية 0.0295؛ قد يعود الفرق إلى عدم دقة التخفيف أو اختلاف الحرارة عن ‎298 K‎ أو مقاومة الدائرة.", "إرشاد للطالب: كتابة تقرير الاستقصاء 2-3 مع الرسم البياني وإكمال نشاط 2-4 ص 52\nإرشاد لولي الأمر: التأكد من رسم الابن البياني بمقياس مناسب وعنونة المحورين\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=11"], "h": ["<ol class=\"ol\"><li>يخطط وينفذ تجربة لقياس أثر تغير ت سون ‎Ecell‎ لكل تركيز ويسجلون (17 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم رسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎ وحل نشاط 2-4 (ص 52)، والطلبة يرسمون ويحسبون الميل ويقارنونه بـ 0.0295 (9 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ملوحة الباطنة: تتنبّأ المجموعات بأثر تغيّر تركيز الأيونات في جهد الاختزال، ثم تتحاور حول أثر زيادة ملوحة المياه الجوفية في مزارع الباطنة وطرق ترشيد الماء (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المتغير المستقل في هذا الاستقصاء؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تركيز أيونات ‎Cu²⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الميل المتوقع للرسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎0.059/2 ≈ 0.030 V‎ لكل وحدة ‎log‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تحضر محلولًا تركيزه ‎0.10 mol/dm³‎ من محلول ‎1.0 mol/dm³‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بأخذ ‎10 cm³‎ من المحلول وإكمالها بالماء المقطر إلى ‎100 cm³‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر متغيرين مضبوطين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: درجة الحرارة ونصف خلية ‎Zn (‎تركيزها ونوع القطب).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يقل ‎Ecell‎ عند تخفيف محلول ‎Cu²⁺‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎Er‎ للقطب الموجب ‎(Cu)‎ يقل مع انخفاض ‎[Cu²⁺]‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كانت قيمة الميل التجريبي ‎0.025 V‎. قيّم النتيجة واقترح سببًا للفرق.<br><span style=\"opacity:.85\">• الإجابة النموذجية: قريبة من القيمة النظرية 0.0295؛ قد يعود الفرق إلى عدم دقة التخفيف أو اختلاف الحرارة عن ‎298 K‎ أو مقاومة الدائرة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 2-3 مع الرسم البياني وإكمال نشاط 2-4 ص 52<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من رسم الابن البياني بمقياس مناسب وعنونة المحورين<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=11<\/p>"]}]}, {"title": "التحليل الكهربائي", "sb": "ص 90–94", "unit": "الوحدة 2: الكيمياء الكهربائية", "periods": [{"axis": "نواتج التحليل الكهربائي للمصاهير والمحاليل المائية", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "التحليل الكهربائي"], ["الحصة", "1 من 2"], ["محور الحصة", "نواتج التحليل الكهربائي للمصاهير والمحاليل المائية"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "ص 90–92"], ["دليل المعلم", "ص 114–117"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: التحليل الكهربائي ص 54"]], "t": ["1. يتنبأ بنواتج التحليل الكهربائي للمركبات الأيونية المنصهرة (10 دقائق)\n2. يكتب أنصاف معادلات نزع شحنات ا
