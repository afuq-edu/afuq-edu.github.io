ات ويعرضونها (13 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. يناقش المعلم قصور تعريف أرهينيوس (الأمونيا) تمهيدًا للحصة التالية ثم يدير التقويم الختامي، والطلبة يجيبون عن أسئلة التقويم ويطرحون تساؤلًا عن ‎NH₃‎ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف الحمض وفق أرهينيوس.\n• الإجابة النموذجية: مادة تنتج أيونات الهيدروجين ‎H⁺‎ عند ذوبانها في الماء.\n\n2. مستوى التطبيق: اكتب معادلة تأين ‎HNO₃‎ في الماء وفق أرهينيوس.\n• الإجابة النموذجية: ‎HNO₃(aq) → H⁺(aq) + NO₃⁻(aq)‎\n\n3. مستوى الاستدلال: لماذا يصعب تفسير قاعدية ‎NH₃‎ بتعريف أرهينيوس؟\n• الإجابة النموذجية: لأن جزيء ‎NH₃‎ لا يحتوي مجموعة ‎OH⁻‎ ليطلقها، ومع ذلك يجعل المحلول قاعديًا.", "1. مستوى المعرفة: ما الأيون المميز للقواعد وفق أرهينيوس؟\n• الإجابة النموذجية: أيون الهيدروكسيد ‎OH⁻‎.\n\n2. مستوى التطبيق: اكتب معادلة تفكك ‎KOH‎ في الماء.\n• الإجابة النموذجية: ‎KOH(aq) → K⁺(aq) + OH⁻(aq)‎\n\n3. مستوى الاستدلال: صنّف وفق أرهينيوس مع التبرير: ‎H₂SO₄‎، ‎Ca(OH)₂‎، ‎CH₄‎.\n• الإجابة النموذجية: ‎H₂SO₄‎ حمض لأنه يطلق ‎H⁺‎؛ ‎Ca(OH)₂‎ قاعدة لأنها تطلق ‎OH⁻‎؛ ‎CH₄‎ ليس حمضًا ولا قاعدة لأنه لا يتأين في الماء.", "إرشاد للطالب: مراجعة كتاب الطالب ص 20–21 وكتابة ثلاث معادلات تأين\nإرشاد لولي الأمر: متابعة الابن في التمييز بين الأحماض والقواعد المنزلية بأمان دون تذوق\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=1"], "h": ["<ol class=\"ol\"><li>يصف تعريف أرهينيوس للأحماض بأنها مواد تنتج أيونات ‎H⁺‎ في المحلول المائي (5 دقائق)<\/li><li>يصف تعريف أرهينيوس للقواعد بأنها مواد تنتج أيونات ‎OH⁻‎ في المحلول المائي (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يكتب معادلات تأين أحماض وقواعد شائعة في الماء وفق أرهينيوس (30 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تعريف أرهينيوس للأحماض بأنها مواد تنتج أيونات ‎H⁺‎ في المحلول المائي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف تعريف أرهينيوس للقواعد بأنها مواد تنتج أيونات ‎OH⁻‎ في المحلول المائي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يكتب معادلات تأين أحماض وقواعد شائعة في الماء وفق أرهينيوس<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">العصف الذهني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: ورق تباع الشمس ومحاليل مخففة للعرض<\/span><\/div>", "<p>الحمض، القاعدة، تعريف أرهينيوس، أيون الهيدروجين ‎H⁺‎، أيون الهيدروكسيد ‎OH⁻‎، المحلول المائي، التأين.<\/p>", "<p>يعرض المعلم كوب عصير ليمون وقطعة صابون ويسأل: «ما الذي يجعل الأول حامضًا والثاني زلقًا؟» ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة» لاستدعاء مفاهيم الصف الحادي عشر.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الأمثلة ويطرح السؤال ويوجه مهام بداية الوحدة، والطلبة يستدعون خواص الأحماض والقواعد ويجيبون عن المهام (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح تعريف أرهينيوس بأمثلة: ‎HCl‎ و‎HNO₃‎ و‎NaOH‎ و‎KOH‎ في الماء، والطلبة يكتبون معادلات التأين ويحددون الأيون المميز لكل نوع (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم بطاقات مواد على المجموعات لتصنيفها حمضًا أو قاعدة وفق أرهينيوس مع كتابة المعادلة، والطلبة يصنفون ويكتبون المعادلات ويعرضونها (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: العصف الذهني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يناقش المعلم قصور تعريف أرهينيوس (الأمونيا) تمهيدًا للحصة التالية ثم يدير التقويم الختامي، والطلبة يجيبون عن أسئلة التقويم ويطرحون تساؤلًا عن ‎NH₃‎ (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف الحمض وفق أرهينيوس.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مادة تنتج أيونات الهيدروجين ‎H⁺‎ عند ذوبانها في الماء.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تأين ‎HNO₃‎ في الماء وفق أرهينيوس.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎HNO₃(aq) → H⁺(aq) + NO₃⁻(aq)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يصعب تفسير قاعدية ‎NH₃‎ بتعريف أرهينيوس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن جزيء ‎NH₃‎ لا يحتوي مجموعة ‎OH⁻‎ ليطلقها، ومع ذلك يجعل المحلول قاعديًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الأيون المميز للقواعد وفق أرهينيوس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أيون الهيدروكسيد ‎OH⁻‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب معادلة تفكك ‎KOH‎ في الماء.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎KOH(aq) → K⁺(aq) + OH⁻(aq)‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صنّف وفق أرهينيوس مع التبرير: ‎H₂SO₄‎، ‎Ca(OH)₂‎، ‎CH₄‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎H₂SO₄‎ حمض لأنه يطلق ‎H⁺‎؛ ‎Ca(OH)₂‎ قاعدة لأنها تطلق ‎OH⁻‎؛ ‎CH₄‎ ليس حمضًا ولا قاعدة لأنه لا يتأين في الماء.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة كتاب الطالب ص 20–21 وكتابة ثلاث معادلات تأين<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التمييز بين الأحماض والقواعد المنزلية بأمان دون تذوق<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=1<\/p>"]}, {"axis": "نظرية برونستد-لوري للأحماض والقواعد", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الأحماض والقواعد"], ["الحصة", "2 من 3"], ["محور الحصة", "نظرية برونستد-لوري للأحماض والقواعد"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 21–22"], ["دليل المعلم", "ص 51–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-1: الأحماض والقواعد ص 24"]], "t": ["1. يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون (15 دقيقة)\n2. يحدد الحمض والقاعدة في تفاعلات انتقال البروتون (5 دقائق)\nمخرج تعليمي آخر: يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل (20 دقيقة)", "1. فهم: يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون\n2. تطبيق: يحدد الحمض والقاعدة في تفاعلات انتقال البروتون\n3. تحليل (مخرج آخر): يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالأقران", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: كرات ورقية تمثل البروتونات", "برونستد-لوري، مانح البروتون، مستقبل البروتون، انتقال البروتون، أيون الهيدرونيوم ‎H₃O⁺‎، المادة المترددة (الأمفوتيرية).", "يمرر المعلم كرة صغيرة بين طالبين ويسأل: «من أعطى ومن أخذ؟ لو كانت الكرة بروتونًا، فمن الحمض ومن القاعدة؟»", "1. يمثل المعلم انتقال البروتون بتمرير الكرة، والطلبة يسمّون المانح والمستقبل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح نظرية برونستد-لوري بأمثلة: ‎HCl + H₂O‎، ‎NH₃ + H₂O‎، ‎HCl + NH₃‎، والطلبة يحددون المانح والمستقبل في كل معادلة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم تفاعلات للماء مع حمض ومع قاعدة ليستنتجوا تردده، والطلبة يحللون التفاعلات في أزواج ويكتبون دور الماء (12 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف القاعدة وفق برونستد-لوري.\n• الإجابة النموذجية: مادة تستقبل بروتونًا ‎(H⁺)‎.\n\n2. مستوى التطبيق: حدد الحمض والقاعدة في: ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎.\n• الإجابة النموذجية: الماء حمض (مانح للبروتون) والأمونيا قاعدة (مستقبلة).\n\n3. مستوى الاستدلال: لماذا يُعد الماء مادة مترددة؟\n• الإجابة النموذجية: لأنه يعمل قاعدة مع ‎HCl (‎يستقبل البروتون) وحمضًا مع ‎NH₃ (‎يمنح البروتون).", "1. مستوى المعرفة: ما الأيون الناتج عند استقبال الماء بروتونًا؟\n• الإجابة النموذجية: أيون الهيدرونيوم ‎H₃O⁺‎.\n\n2. مستوى التطبيق: حدد الحمض والقاعدة في: ‎HCl(g) + NH₃(g) → NH₄Cl(s)‎.\n• الإجابة النموذجية: ‎HCl‎ حمض يمنح البروتون، و‎NH₃‎ قاعدة تستقبله.\n\n3. مستوى الاستدلال: لماذا يُعد تعريف برونستد-لوري أشمل من أرهينيوس؟\n• الإجابة النموذجية: لأنه لا يشترط الماء ولا وجود ‎OH⁻‎ في القاعدة، فيفسر تفاعلات في الحالة الغازية وقاعدية ‎NH₃‎.", "إرشاد للطالب: مراجعة ص 21–22 وحل تدريبين في تحديد المانح والمستقبل\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «تمرير الكرة» لشرح انتقال البروتون\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=1"], "h": ["<ol class=\"ol\"><li>يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون (15 دقيقة)<\/li><li>يحدد الحمض والقاعدة في تفاعلات انتقال البروتون (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف الحمض وفق برونستد-لوري بأنه مانح للبروتون والقاعدة بأنها مستقبل للبروتون<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحدد الحمض والقاعدة في تفاعلات انتقال البروتون<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر السلوك المتردد للماء بوصفه حمضًا أو قاعدة حسب التفاعل<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالأقران<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: كرات ورقية تمثل البروتونات<\/span><\/div>", "<p>برونستد-لوري، مانح البروتون، مستقبل البروتون، انتقال البروتون، أيون الهيدرونيوم ‎H₃O⁺‎، المادة المترددة (الأمفوتيرية).<\/p>", "<p>يمرر المعلم كرة صغيرة بين طالبين ويسأل: «من أعطى ومن أخذ؟ لو كانت الكرة بروتونًا، فمن الحمض ومن القاعدة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يمثل المعلم انتقال البروتون بتمرير الكرة، والطلبة يسمّون المانح والمستقبل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح نظرية برونستد-لوري بأمثلة: ‎HCl + H₂O‎، ‎NH₃ + H₂O‎، ‎HCl + NH₃‎، والطلبة يحددون المانح والمستقبل في كل معادلة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم تفاعلات للماء مع حمض ومع قاعدة ليستنتجوا تردده، والطلبة يحللون التفاعلات في أزواج ويكتبون دور الماء (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالأقران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف القاعدة وفق برونستد-لوري.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مادة تستقبل بروتونًا ‎(H⁺)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> حدد الحمض والقاعدة في: ‎NH₃ + H₂O ⇌ NH₄⁺ + OH⁻‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الماء حمض (مانح للبروتون) والأمونيا قاعدة (مستقبلة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يُعد الماء مادة مترددة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يعمل قاعدة مع ‎HCl (‎يستقبل البروتون) وحمضًا مع ‎NH₃ (‎يمنح البروتون).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الأيون الناتج عند استقبال الماء بروتونًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أيون الهيدرونيوم ‎H₃O⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> حدد الحمض والقاعدة في: ‎HCl(g) + NH₃(g) → NH₄Cl(s)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎HCl‎ حمض يمنح البروتون، و‎NH₃‎ قاعدة تستقبله.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يُعد تعريف برونستد-لوري أشمل من أرهينيوس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه لا يشترط الماء ولا وجود ‎OH⁻‎ في القاعدة، فيفسر تفاعلات في الحالة الغازية وقاعدية ‎NH₃‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 21–22 وحل تدريبين في تحديد المانح والمستقبل<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه «تمرير الكرة» لشرح انتقال البروتون<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=1<\/p>"]}, {"axis": "الأزواج المترافقة وحل الأسئلة 1–4 ونشاط 1-1", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الأحماض والقواعد"], ["الحصة", "3 من 3"], ["محور الحصة", "الأزواج المترافقة وحل الأسئلة 1–4 ونشاط 1-1"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 22–23 + كتاب التجارب ص 24"], ["دليل المعلم", "ص 51–54"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-1: الأحماض والقواعد ص 24"]], "t": ["1. يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما (10 دقائق)\n2. يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية (10 دقائق)\nمخرج تعليمي آخر: يحل أسئلة الموضوع 1–4 ونشاط 1-1 (20 دقيقة)", "1. فهم: يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما\n2. تطبيق: يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية\n3. تطبيق (مخرج آخر): يحل أسئلة الموضوع 1–4 ونشاط 1-1", "- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "الحمض المرافق، القاعدة المرافقة، الزوج المترافق، الفرق بمقدار بروتون واحد.", "يكتب المعلم ‎HCl‎ و‎Cl⁻‎ ثم ‎NH₃‎ و‎NH₄⁺‎ ويسأل: «ما الفرق بين كل جزيئين؟ وكيف يرتبطان؟»", "1. يعرض الأزواج ويطرح السؤال، والطلبة يستنتجون أن الفرق بروتون واحد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يشرح المعلم الحمض المرافق والقاعدة المرافقة ويحدد الأزواج في أمثلة، والطلبة يرسمون أقواسًا تربط كل زوج مترافق في المعادلات (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوجه المعلم حل نشاط 1-1 (كتاب التجارب ص 24) والأسئلة 1–4، والطلبة يحلون في أزواج ويصححون معًا (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن الأزواج المترافقة وحل الأسئلة 1–4 ونشاط 1-1، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – فنجان البروتون: يمثّل الطلبة في أزواج حمضًا يقدّم فنجانًا (البروتون) وقاعدة تستقبله كما تُقدَّم القهوة في المجلس العماني، ثم يسمّون الأزواج المترافقة في تفاعل يعطيه المعلم (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم:\n1. مستوى المعرفة: ما القاعدة المرافقة لـ ‎H₂SO₄‎؟\n• الإجابة النموذجية: ‎HSO₄⁻‎.\n\n2. مستوى التطبيق: ما الحمض المرافق لـ ‎NH₃‎؟\n• الإجابة النموذجية: ‎NH₄⁺‎.\n\n3. مستوى الاستدلال: حدد الزوجين المترافقين في: ‎CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺‎.\n• الإجابة النموذجية: ‎CH₃COOH/CH₃COO⁻‎ و‎H₃O⁺/H₂O‎.", "1. مستوى المعرفة: ما الفرق بين الحمض وقاعدته المرافقة؟\n• الإجابة النموذجية: بروتون واحد ‎(H⁺)‎.\n\n2. مستوى التطبيق: اكتب القاعدة المرافقة للماء والحمض المرافق له.\n• الإجابة النموذجية: القاعدة المرافقة ‎OH⁻‎، والحمض المرافق ‎H₃O⁺‎.\n\n3. مستوى الاستدلال: في التفاعل ‎HNO₃ + H₂SO₄ ⇌ H₂NO₃⁺ + HSO₄⁻‎، حدد الحمض والقاعدة والزوجين المترافقين.\n• الإجابة النموذجية: ‎H₂SO₄‎ حمض و‎HNO₃‎ قاعدة؛ الزوجان: ‎H₂SO₄/HSO₄⁻‎ و‎H₂NO₃⁺/HNO₃‎.", "إرشاد للطالب: إكمال نشاط 1-1 ص 24 والأسئلة 1–4\nإرشاد لولي الأمر: متابعة الابن في كتابة أزواج مترافقة لأمثلة جديدة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=1"], "h": ["<ol class=\"ol\"><li>يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما (10 دقائق)<\/li><li>يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل أسئلة الموضوع 1–4 ونشاط 1-1 (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يعرّف الحمض المرافق والقاعدة المرافقة ويستخدمهما<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحدد أزواج (الحمض–القاعدة المترافقة) في التفاعلات الكيميائية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل أسئلة الموضوع 1–4 ونشاط 1-1<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الحمض المرافق، القاعدة المرافقة، الزوج المترافق، الفرق بمقدار بروتون واحد.<\/p>", "<p>يكتب المعلم ‎HCl‎ و‎Cl⁻‎ ثم ‎NH₃‎ و‎NH₄⁺‎ ويسأل: «ما الفرق بين كل جزيئين؟ وكيف يرتبطان؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض الأزواج ويطرح السؤال، والطلبة يستنتجون أن الفرق بروتون واحد (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الحمض المرافق والقاعدة المرافقة ويحدد الأزواج في أمثلة، والطلبة يرسمون أقواسًا تربط كل زوج مترافق في المعادلات (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 1-1 (كتاب التجارب ص 24) والأسئلة 1–4، والطلبة يحلون في أزواج ويصححون معًا (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن الأزواج المترافقة وحل الأسئلة 1–4 ونشاط 1-1، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – فنجان البروتون: يمثّل الطلبة في أزواج حمضًا يقدّم فنجانًا (البروتون) وقاعدة تستقبله كما تُقدَّم القهوة في المجلس العماني، ثم يسمّون الأزواج المترافقة في تفاعل يعطيه المعلم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: لعب الأدوار.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما القاعدة المرافقة لـ ‎H₂SO₄‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎HSO₄⁻‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الحمض المرافق لـ ‎NH₃‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎NH₄⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> حدد الزوجين المترافقين في: ‎CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎CH₃COOH/CH₃COO⁻‎ و‎H₃O⁺/H₂O‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق بين الحمض وقاعدته المرافقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروتون واحد ‎(H⁺)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب القاعدة المرافقة للماء والحمض المرافق له.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القاعدة المرافقة ‎OH⁻‎، والحمض المرافق ‎H₃O⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> في التفاعل ‎HNO₃ + H₂SO₄ ⇌ H₂NO₃⁺ + HSO₄⁻‎، حدد الحمض والقاعدة والزوجين المترافقين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎H₂SO₄‎ حمض و‎HNO₃‎ قاعدة؛ الزوجان: ‎H₂SO₄/HSO₄⁻‎ و‎H₂NO₃⁺/HNO₃‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-1 ص 24 والأسئلة 1–4<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة أزواج مترافقة لأمثلة جديدة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=1<\/p>"]}]}, {"title": "الأحماض والقواعد القوية والضعيفة", "sb": "ص 24–25", "unit": "الوحدة 1: الاتزان في المحاليل المائية", "periods": [{"axis": "التأين الكلي والجزئي والتمييز بين القوية والضعيفة", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الاتزان في المحاليل المائية"], ["الدرس", "الأحماض والقواعد القوية والضعيفة"], ["الحصة", "1 من 1"], ["محور الحصة", "التأين الكلي والجزئي والتمييز بين القوية والضعيفة"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 24–25"], ["دليل المعلم", "ص 54–57"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي (20 دقيقة)\n2. يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم) (10 دقائق)\nمخرج تعليمي آخر: يميز بين مفهومي القوة والتركيز للحمض (10 دقائق)", "1. فهم: يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي\n2. تحليل: يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم)\n3. تحليل (مخرج آخر): يميز بين مفهومي القوة والتركيز للحمض", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: محلولا ‎HCl‎ و‎CH₃COOH‎ بالتركيز نفسه، شرائط مغنيسيوم، جهاز توصيل كهربائي، مقياس ‎pH‎", "الحمض القوي، الحمض الضعيف، التأين الكلي، التأين الجزئي، الاتزان الديناميكي، القوة مقابل التركيز.", "يضع المعلم شريط مغنيسيوم في محلولي ‎HCl‎ وحمض الإيثانويك بالتركيز نفسه ويسأل: «التركيز واحد؛ فلماذا يختلف الفوران؟»", "1. ينفذ المعلم العرض ويطرح السؤال، والطلبة يلاحظون الفرق ويقترحون تفسيرًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم التأين الكلي والجزئي ورموز المعادلات (→ و⇌) وأمثلة القواعد القوية والضعيفة، والطلبة يكتبون معادلات تأين حمض قوي وآخر ضعيف (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ المعلم نشاط «التمييز بين الأحماض القوية والضعيفة» بقياس ‎pH‎ والتوصيل، والطلبة يسجلون القراءات ويقارنون ويحلون السؤالين 5 و6 (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ما المقصود بالحمض القوي»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – حموضة اللومي: يصنّف كل زوج أحماضًا منها حمض الستريك في اللومي (الليمون العماني المجفف) إلى قوية وضعيفة، ويبرّران التصنيف بالتأيّن الكلي أو الجزئي، ثم يشاركان الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم:\n1. مستوى المعرفة: ما المقصود بالحمض القوي؟\n• الإجابة النموذجية: حمض يتأين كليًا في المحلول المائي.\n\n2. مستوى التطبيق: لماذا يكون ‎pH‎ محلول ‎HCl‎ أقل من ‎pH‎ حمض الإيثانويك بالتركيز نفسه؟\n• الإجابة النموذجية: لأن ‎HCl‎ يتأين كليًا فيكون ‎[H⁺]‎ أعلى.\n\n3. مستوى الاستدلال: ما الفرق بين حمض مركز وحمض قوي؟\n• الإجابة النموذجية: التركيز كمية الحمض في حجم معين، والقوة مدى تأينه؛ فقد يكون الحمض ضعيفًا ومركزًا.", "1. مستوى المعرفة: اكتب معادلة تأين حمض الإيثانويك في الماء.\n• الإجابة النموذجية: ‎CH₃COOH(aq) ⇌ CH₃COO⁻(aq) + H⁺(aq)‎\n\n2. مستوى التطبيق: اذكر مثالًا لقاعدة قوية وآخر لقاعدة ضعيفة.\n• الإجابة النموذجية: قاعدة قوية: ‎NaOH‎؛ قاعدة ضعيفة: ‎NH₃‎.\n\n3. مستوى الاستدلال: اقترح تجربتين للتمييز بين محلولي حمض قوي وحمض ضعيف بالتركيز نفسه.\n• الإجابة النموذجية: قياس ‎pH (‎القوي أقل)، وقياس التوصيل الكهربائي (القوي أعلى)، أو سرعة التفاعل مع ‎Mg (‎القوي أسرع).", "إرشاد للطالب: مراجعة ص 24–25 وحل السؤالين 5 و6\nإرشاد لولي الأمر: الحديث مع الابن عن الأحماض الضعيفة في الأطعمة كالخل والليمون\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=2"], "h": ["<ol class=\"ol\"><li>يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي (20 دقيقة)<\/li><li>يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم) (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين مفهومي القوة والتركيز للحمض (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف الأحماض والقواعد القوية في ضوء تأينها الكلي، والضعيفة في ضوء تأينها الجزئي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يميز بين حمض قوي وحمض ضعيف بالتجربة (التوصيل الكهربائي، ‎pH‎، سرعة التفاعل مع المغنيسيوم)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يميز بين مفهومي القوة والتركيز للحمض<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: محلولا ‎HCl‎ و‎CH₃COOH‎ بالتركيز نفسه، شرائط مغنيسيوم، جهاز توصيل كهربائي، مقياس ‎pH‎<\/span><\/div>", "<p>الحمض القوي، الحمض الضعيف، التأين الكلي، التأين الجزئي، الاتزان الديناميكي، القوة مقابل التركيز.<\/p>", "<p>يضع المعلم شريط مغنيسيوم في محلولي ‎HCl‎ وحمض الإيثانويك بالتركيز نفسه ويسأل: «التركيز واحد؛ فلماذا يختلف الفوران؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يلاحظون الفرق ويقترحون تفسيرًا (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\"
