 class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح تشبيه مستوى سطح البحر</td><td>يستنتجون الحاجة إلى قطب مرجعي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>ينفذ نشاط «قطب الهيدروجين القياسي» ويشرح الشكل 2-4 والظروف القياسية</td><td>يرسمون القطب ويكتبون مواصفاته</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يعرض مقطعًا (الجزء الأول) عن قطب الهيدروجين ويطرح أسئلة توقف</td><td>يجيبون عن أسئلة التوقف في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما قيمة جهد قطب الهيدروجين القياسي؟</td><td>‎0.00 V‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر الظروف القياسية لقطب الهيدروجين.</td><td>ضغط ‎H₂‎ يساوي ‎100 kPa‎، و‎[H⁺] = 1.00 mol/dm³‎، ودرجة حرارة ‎298 K‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُستخدم البلاتين في هذا القطب؟</td><td>لأنه خامل لا يتفاعل، ويوصل الكهرباء، ويحفز اتزان ‎H⁺/H₂‎ على سطحه.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب نصف المعادلة التي تحدث عند قطب الهيدروجين.</td><td>‎2H⁺(aq) + 2e⁻ ⇌ H₂(g)‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما وظيفة قطب الهيدروجين القياسي؟</td><td>قطب مرجعي تُقاس بالنسبة إليه جهود الأقطاب الأخرى.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُغلف البلاتين بالبلاتين الأسود المسامي؟</td><td>لزيادة مساحة السطح فيسرع الوصول إلى الاتزان بين ‎H⁺‎ و‎H₂‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 70–71 ورسم قطب الهيدروجين القياسي مع مواصفاته</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه «مستوى سطح البحر» وعلاقته بالقطب المرجعي</p>"]},{"axis":"الظروف القياسية وتعريف جهد الاختزال القياسي","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","قياس جهود الأقطاب القياسية"],["الحصة","2 من 5"],["محور الحصة","الظروف القياسية وتعريف جهد الاختزال القياسي"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 71–72"],["دليل المعلم","ص 103–106"],["كتاب التجارب العملية والأنشطة","نشاط 2-2: استخدام جهد الاختزال القياسي ص 47"]],"t":["1. يعرّف جهد الاختزال القياسي ‎E°‎ لنصف خلية\n2. يكتب الظروف القياسية: ‎298 K‎، و‎1.00 mol/dm³‎ للأيونات، و‎100 kPa‎ للغازات\nمخرج تعليمي آخر: يفسر معنى إشارة ‎E° (‎موجبة أو سالبة) بالنسبة إلى قطب الهيدروجين","المخرج 1: تذكر\nالمخرج 2: تذكر\nالمخرج الآخر: تحليل","- التعلم التعاوني\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)","جهد الاختزال القياسي ‎E°‎، الظروف القياسية، الإشارة الموجبة والسالبة، سلسلة جهود الاختزال القياسية.","يعرض المعلم قيمتين: ‎Zn²⁺/Zn = −0.76 V‎ و‎Cu²⁺/Cu = +0.34 V‎ ويسأل: «ماذا تخبرنا الإشارة عن ميل كل أيون لكسب الإلكترونات مقارنة بـ ‎H⁺‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض القيمتين ويطرح السؤال\nالطالب: يقترحون تفسير الإشارة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح تعريف ‎E°‎ والظروف القياسية وكتابة أنصاف المعادلات على صورة اختزال\nالطالب: يكتبون التعريف ويطبقونه على أمثلة من الملحق 2\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوزع أزواج أنصاف خلايا ويطلب ترتيبها حسب ميلها للاختزال\nالطالب: يرتبون ويبررون باستخدام الإشارة والقيمة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف جهد الاختزال القياسي.\n   الإجابة النموذجية: جهد نصف الخلية مقيسًا بالنسبة إلى قطب الهيدروجين القياسي في الظروف القياسية (‎298 K‎، ‎1.00 mol/dm³‎، ‎100 kPa‎).\n2) (المستوى المتوقع) السؤال: ماذا تعني القيمة السالبة لـ ‎E°‎؟\n   الإجابة النموذجية: أن أيونات نصف الخلية أقل ميلًا لكسب الإلكترونات من ‎H⁺‎.\n3) (المستوى المتقدم) السؤال: لماذا تُكتب كل أنصاف المعادلات في السلسلة على صورة اختزال؟\n   الإجابة النموذجية: للمقارنة بينها بطريقة موحدة.","1) (مستوى الدعم) السؤال: ما تركيز الأيونات في الظروف القياسية؟\n   الإجابة النموذجية: ‎1.00 mol/dm³‎.\n2) (المستوى المتوقع) السؤال: أيهما أسهل اختزالًا: ‎Ag⁺ (+0.80 V)‎ أم ‎Zn²⁺ (−0.76 V)‎؟\n   الإجابة النموذجية: ‎Ag⁺‎ لأن ‎E°‎ له أكبر.\n3) (المستوى المتقدم) السؤال: رتب تصاعديًا حسب ميل الأيون لكسب الإلكترونات: ‎Mg²⁺ (−2.38)‎، ‎Cu²⁺ (+0.34)‎، ‎Fe²⁺ (−0.44)‎.\n   الإجابة النموذجية: ‎Mg²⁺ < Fe²⁺ < Cu²⁺‎.","إرشاد للطالب: مراجعة ص 71–72 والتعرف على سلسلة جهود الاختزال القياسية في الملحق 2\nإرشاد لولي الأمر: تشجيع الابن على حفظ الظروف القياسية الثلاثة"],"h":["<ol class=\"ol\"><li>يعرّف جهد الاختزال القياسي ‎E°‎ لنصف خلية</li><li>يكتب الظروف القياسية: ‎298 K‎، و‎1.00 mol/dm³‎ للأيونات، و‎100 kPa‎ للغازات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر معنى إشارة ‎E° (‎موجبة أو سالبة) بالنسبة إلى قطب الهيدروجين</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف جهد الاختزال القياسي ‎E°‎ لنصف خلية</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب الظروف القياسية: ‎298 K‎، و‎1.00 mol/dm³‎ للأيونات، و‎100 kPa‎ للغازات</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر معنى إشارة ‎E° (‎موجبة أو سالبة) بالنسبة إلى قطب الهيدروجين</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)</span></div>","<p>جهد الاختزال القياسي ‎E°‎، الظروف القياسية، الإشارة الموجبة والسالبة، سلسلة جهود الاختزال القياسية.</p>","<p>يعرض المعلم قيمتين: ‎Zn²⁺/Zn = −0.76 V‎ و‎Cu²⁺/Cu = +0.34 V‎ ويسأل: «ماذا تخبرنا الإشارة عن ميل كل أيون لكسب الإلكترونات مقارنة بـ ‎H⁺‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض القيمتين ويطرح السؤال</td><td>يقترحون تفسير الإشارة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح تعريف ‎E°‎ والظروف القياسية وكتابة أنصاف المعادلات على صورة اختزال</td><td>يكتبون التعريف ويطبقونه على أمثلة من الملحق 2</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوزع أزواج أنصاف خلايا ويطلب ترتيبها حسب ميلها للاختزال</td><td>يرتبون ويبررون باستخدام الإشارة والقيمة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف جهد الاختزال القياسي.</td><td>جهد نصف الخلية مقيسًا بالنسبة إلى قطب الهيدروجين القياسي في الظروف القياسية (‎298 K‎، ‎1.00 mol/dm³‎، ‎100 kPa‎).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا تعني القيمة السالبة لـ ‎E°‎؟</td><td>أن أيونات نصف الخلية أقل ميلًا لكسب الإلكترونات من ‎H⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تُكتب كل أنصاف المعادلات في السلسلة على صورة اختزال؟</td><td>للمقارنة بينها بطريقة موحدة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما تركيز الأيونات في الظروف القياسية؟</td><td>‎1.00 mol/dm³‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أيهما أسهل اختزالًا: ‎Ag⁺ (+0.80 V)‎ أم ‎Zn²⁺ (−0.76 V)‎؟</td><td>‎Ag⁺‎ لأن ‎E°‎ له أكبر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>رتب تصاعديًا حسب ميل الأيون لكسب الإلكترونات: ‎Mg²⁺ (−2.38)‎، ‎Cu²⁺ (+0.34)‎، ‎Fe²⁺ (−0.44)‎.</td><td>‎Mg²⁺ &lt; Fe²⁺ &lt; Cu²⁺‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 71–72 والتعرف على سلسلة جهود الاختزال القياسية في الملحق 2</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على حفظ الظروف القياسية الثلاثة</p>"]},{"axis":"قياس ‎E°‎ لنصف خلية فلز/أيون فلز","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","قياس جهود الأقطاب القياسية"],["الحصة","3 من 5"],["محور الحصة","قياس ‎E°‎ لنصف خلية فلز/أيون فلز"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 72–73"],["دليل المعلم","ص 103–106"],["كتاب التجارب العملية والأنشطة","نشاط 2-2: استخدام جهد الاختزال القياسي ص 47"]],"t":["1. يصف طريقة قياس ‎E°‎ لنصف خلية فلز/أيون الفلز بتوصيلها بقطب الهيدروجين القياسي\n2. يحدد القطب الموجب والسالب والمصعد والمهبط في خلية قياس ‎E°‎\nمخرج تعليمي آخر: يكتب نصفي التفاعل والتفاعل الكلي في خلية ‎Zn/H₂‎","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","الفلز/أيون الفلز، المصعد (الأنود)، المهبط (الكاثود)، القطب السالب، القطب الموجب، قراءة الفولتميتر.","يعرض المعلم الشكل 2-6 (خلية ‎Zn‎ مع قطب الهيدروجين) بقراءة ‎0.76 V‎ ويسأل: «كيف نعرف أن ‎E° = −0.76‎ لا +0.76؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الشكل ويطرح السؤال\nالطالب: يقترحون تحديد القطب السالب\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح ترتيب التجربة وتحديد القطب السالب ‎(Zn)‎ والموجب وكتابة نصفي التفاعل\nالطالب: يكتبون نصفي التفاعل ويحددون المصعد والمهبط\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم أمثلة لأنصاف خلايا (‎Cu‎، ‎Ag‎، ‎Mg‎) مع قطب الهيدروجين لتحليلها\nالطالب: يحددون الإشارات واتجاه الإلكترونات في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما القطب السالب في خلية ‎Zn‎ مع قطب الهيدروجين؟\n   الإجابة النموذجية: قطب الخارصين.\n2) (المستوى المتوقع) السؤال: اكتب نصف تفاعل الأكسدة في هذه الخلية.\n   الإجابة النموذجية: ‎Zn(s) → Zn²⁺(aq) + 2e⁻‎\n3) (المستوى المتقدم) السؤال: إذا كان قطب النحاس هو الموجب وقراءة الفولتميتر ‎0.34 V‎، فما ‎E°‎ لـ ‎Cu²⁺/Cu‎؟\n   الإجابة النموذجية: ‎+0.34 V‎.","1) (مستوى الدعم) السؤال: عند أي قطب يحدث الاختزال؟\n   الإجابة النموذجية: المهبط (الكاثود).\n2) (المستوى المتوقع) السؤال: في خلية ‎Zn/H₂‎ القياسية، أين يحدث الاختزال؟\n   الإجابة النموذجية: عند قطب الهيدروجين: ‎2H⁺ + 2e⁻ → H₂‎.\n3) (المستوى المتقدم) السؤال: اكتب التفاعل الكلي لخلية مكونة من ‎Zn²⁺/Zn‎ وقطب الهيدروجين القياسي.\n   الإجابة النموذجية: ‎Zn(s) + 2H⁺(aq) → Zn²⁺(aq) + H₂(g)‎","إرشاد للطالب: مراجعة ص 72–73 ورسم خلية قياس ‎E°‎ لنصف خلية ‎Cu‎\nإرشاد لولي الأمر: متابعة الابن في التمييز بين المصعد والمهبط"],"h":["<ol class=\"ol\"><li>يصف طريقة قياس ‎E°‎ لنصف خلية فلز/أيون الفلز بتوصيلها بقطب الهيدروجين القياسي</li><li>يحدد القطب الموجب والسالب والمصعد والمهبط في خلية قياس ‎E°‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يكتب نصفي التفاعل والتفاعل الكلي في خلية ‎Zn/H₂‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف طريقة قياس ‎E°‎ لنصف خلية فلز/أيون الفلز بتوصيلها بقطب الهيدروجين القياسي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد القطب الموجب والسالب والمصعد والمهبط في خلية قياس ‎E°‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يكتب نصفي التفاعل والتفاعل الكلي في خلية ‎Zn/H₂‎</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>الفلز/أيون الفلز، المصعد (الأنود)، المهبط (الكاثود)، القطب السالب، القطب الموجب، قراءة الفولتميتر.</p>","<p>يعرض المعلم الشكل 2-6 (خلية ‎Zn‎ مع قطب الهيدروجين) بقراءة ‎0.76 V‎ ويسأل: «كيف نعرف أن ‎E° = −0.76‎ لا +0.76؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الشكل ويطرح السؤال</td><td>يقترحون تحديد القطب السالب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح ترتيب التجربة وتحديد القطب السالب ‎(Zn)‎ والموجب وكتابة نصفي التفاعل</td><td>يكتبون نصفي التفاعل ويحددون المصعد والمهبط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم أمثلة لأنصاف خلايا (‎Cu‎، ‎Ag‎، ‎Mg‎) مع قطب الهيدروجين لتحليلها</td><td>يحددون الإشارات واتجاه الإلكترونات في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما القطب السالب في خلية ‎Zn‎ مع قطب الهيدروجين؟</td><td>قطب الخارصين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب نصف تفاعل الأكسدة في هذه الخلية.</td><td>‎Zn(s) → Zn²⁺(aq) + 2e⁻‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا كان قطب النحاس هو الموجب وقراءة الفولتميتر ‎0.34 V‎، فما ‎E°‎ لـ ‎Cu²⁺/Cu‎؟</td><td>‎+0.34 V‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عند أي قطب يحدث الاختزال؟</td><td>المهبط (الكاثود).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>في خلية ‎Zn/H₂‎ القياسية، أين يحدث الاختزال؟</td><td>عند قطب الهيدروجين: ‎2H⁺ + 2e⁻ → H₂‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب التفاعل الكلي لخلية مكونة من ‎Zn²⁺/Zn‎ وقطب الهيدروجين القياسي.</td><td>‎Zn(s) + 2H⁺(aq) → Zn²⁺(aq) + H₂(g)‎</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 72–73 ورسم خلية قياس ‎E°‎ لنصف خلية ‎Cu‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التمييز بين المصعد والمهبط</p>"]},{"axis":"قياس ‎E°‎ لأنصاف خلايا لافلز/أيون وأيون/أيون","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","قياس جهود الأقطاب القياسية"],["الحصة","4 من 5"],["محور الحصة","قياس ‎E°‎ لأنصاف خلايا لافلز/أيون وأيون/أيون"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 73–75"],["دليل المعلم","ص 103–106"],["كتاب التجارب العملية والأنشطة","نشاط 2-2: استخدام جهد الاختزال القياسي ص 47"]],"t":["1. يصف طريقة قياس ‎E°‎ لنصف خلية لافلز/أيون (مثل ‎Cl₂/Cl⁻‎) باستخدام قطب بلاتين\n2. يصف طريقة قياس ‎E°‎ لنصف خلية أيون/أيون (مثل ‎Fe³⁺/Fe²⁺‎) بتراكيز متساوية ‎1.00 mol/dm³‎\nمخرج تعليمي آخر: يبرر استخدام البلاتين قطبًا في هذه الأنواع من أنصاف الخلايا","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","نصف خلية لافلز/أيون، نصف خلية أيون/أيون، قطب البلاتين الخامل، ‎Cl₂/Cl⁻‎، ‎Fe³⁺/Fe²⁺‎، ‎MnO₄⁻/Mn²⁺‎.","يسأل المعلم: «الكلور غاز لا يمكن صنع قطب منه، والحديد ‎II‎ والحديد ‎III‎ أيونان في محلول؛ فكيف نوصل هذه الأنصاف بدائرة كهربائية؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون قطبًا خاملًا موصلًا\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: ينفذ «طرائق متنوعة لقياس قيم جهود الأقطاب القياسية» بالشكلين 2-7 و2-8\nالطالب: يرسمون نصفي الخلية ويكتبون شروطهما\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم أنصاف خلايا متنوعة (‎Br₂/Br⁻‎، ‎MnO₄⁻/Mn²⁺‎، ‎Ag⁺/Ag‎) لتحديد نوع القطب والشروط\nالطالب: يحددون نوع كل نصف خلية وقطبه في مجموعات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما القطب المستخدم في نصف خلية ‎Cl₂/Cl⁻‎؟\n   الإجابة النموذجية: قطب بلاتين خامل.\n2) (المستوى المتوقع) السؤال: ما شرط تراكيز ‎Fe³⁺‎ و‎Fe²⁺‎ في نصف الخلية القياسية؟\n   الإجابة النموذجية: أن يكون تركيز كل منهما ‎1.00 mol/dm³‎.\n3) (المستوى المتقدم) السؤال: لماذا يحتاج نصف خلية ‎MnO₄⁻/Mn²⁺‎ إلى ‎H⁺‎ بتركيز ‎1.00 mol/dm³‎ أيضًا؟\n   الإجابة النموذجية: لأن ‎H⁺‎ يشارك في نصف معادلة الاختزال فيجب أن يكون في الظروف القياسية.","1) (مستوى الدعم) السؤال: لماذا يُستخدم البلاتين في نصف الخلية ‎Fe³⁺/Fe²⁺‎؟\n   الإجابة النموذجية: لأنه موصل خامل ينقل الإلكترونات دون أن يشارك في التفاعل.\n2) (المستوى المتوقع) السؤال: اكتب نصف معادلة اختزال ‎Fe³⁺/Fe²⁺‎.\n   الإجابة النموذجية: ‎Fe³⁺(aq) + e⁻ ⇌ Fe²⁺(aq)‎\n3) (المستوى المتقدم) السؤال: صف نصف خلية ‎Cl₂/Cl⁻‎ القياسية.\n   الإجابة النموذجية: غاز ‎Cl₂‎ بضغط ‎100 kPa‎ يمرر على قطب بلاتين مغموس في محلول ‎Cl⁻‎ بتركيز ‎1.00 mol/dm³‎ عند ‎298 K‎.","إرشاد للطالب: مراجعة ص 73–75 ورسم ثلاثة أنواع من أنصاف الخلايا\nإرشاد لولي الأمر: سؤال الابن عن سبب اختيار البلاتين في هذه الأقطاب"],"h":["<ol class=\"ol\"><li>يصف طريقة قياس ‎E°‎ لنصف خلية لافلز/أيون (مثل ‎Cl₂/Cl⁻‎) باستخدام قطب بلاتين</li><li>يصف طريقة قياس ‎E°‎ لنصف خلية أيون/أيون (مثل ‎Fe³⁺/Fe²⁺‎) بتراكيز متساوية ‎1.00 mol/dm³‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يبرر استخدام البلاتين قطبًا في هذه الأنواع من أنصاف الخلايا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف طريقة قياس ‎E°‎ لنصف خلية لافلز/أيون (مثل ‎Cl₂/Cl⁻‎) باستخدام قطب بلاتين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف طريقة قياس ‎E°‎ لنصف خلية أيون/أيون (مثل ‎Fe³⁺/Fe²⁺‎) بتراكيز متساوية ‎1.00 mol/dm³‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يبرر استخدام البلاتين قطبًا في هذه الأنواع من أنصاف الخلايا</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>نصف خلية لافلز/أيون، نصف خلية أيون/أيون، قطب البلاتين الخامل، ‎Cl₂/Cl⁻‎، ‎Fe³⁺/Fe²⁺‎، ‎MnO₄⁻/Mn²⁺‎.</p>","<p>يسأل المعلم: «الكلور غاز لا يمكن صنع قطب منه، والحديد ‎II‎ والحديد ‎III‎ أيونان في محلول؛ فكيف نوصل هذه الأنصاف بدائرة كهربائية؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون قطبًا خاملًا موصلًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>ينفذ «طرائق متنوعة لقياس قيم جهود الأقطاب القياسية» بالشكلين 2-7 و2-8</td><td>يرسمون نصفي الخلية ويكتبون شروطهما</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم أنصاف خلايا متنوعة (‎Br₂/Br⁻‎، ‎MnO₄⁻/Mn²⁺‎، ‎Ag⁺/Ag‎) لتحديد نوع القطب والشروط</td><td>يحددون نوع كل نصف خلية وقطبه في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما القطب المستخدم في نصف خلية ‎Cl₂/Cl⁻‎؟</td><td>قطب بلاتين خامل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما شرط تراكيز ‎Fe³⁺‎ و‎Fe²⁺‎ في نصف الخلية القياسية؟</td><td>أن يكون تركيز كل منهما ‎1.00 mol/dm³‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يحتاج نصف خلية ‎MnO₄⁻/Mn²⁺‎ إلى ‎H⁺‎ بتركيز ‎1.00 mol/dm³‎ أيضًا؟</td><td>لأن ‎H⁺‎ يشارك في نصف معادلة الاختزال فيجب أن يكون في الظروف القياسية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا يُستخدم البلاتين في نصف الخلية ‎Fe³⁺/Fe²⁺‎؟</td><td>لأنه موصل خامل ينقل الإلكترونات دون أن يشارك في التفاعل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب نصف معادلة اختزال ‎Fe³⁺/Fe²⁺‎.</td><td>‎Fe³⁺(aq) + e⁻ ⇌ Fe²⁺(aq)‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صف نصف خلية ‎Cl₂/Cl⁻‎ القياسية.</td><td>غاز ‎Cl₂‎ بضغط ‎100 kPa‎ يمرر على قطب بلاتين مغموس في محلول ‎Cl⁻‎ بتركيز ‎1.00 mol/dm³‎ عند ‎298 K‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 73–75 ورسم ثلاثة أنواع من أنصاف الخلايا</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن سبب اختيار البلاتين في هذه الأقطاب</p>"]},{"axis":"نشاط 2-2 والأسئلة 2–7","n":5,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","قياس جهود الأقطاب القياسية"],["الحصة","5 من 5"],["محور الحصة","نشاط 2-2 والأسئلة 2–7"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 70–75 + كتاب التجارب ص 47"],["دليل المعلم","ص 103–106"],["كتاب التجارب العملية والأنشطة","نشاط 2-2: استخدام جهد الاختزال القياسي ص 47"]],"t":["1. يحل نشاط 2-2 «استخدام جهد الاختزال القياسي»\n2. يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية\nمخرج تعليمي آخر: يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم التعاوني\n- التأمل الذاتي","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","مراجعة قياس ‎E°‎، أنواع أنصاف الخلايا، الظروف القياسية، الأخطاء الشائعة.","يطلب المعلم من كل طالب كتابة «فكرة واحدة واضحة» و«فكرة واحدة غامضة» من الموضوع على بطاقتين ويجمعها.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يجمع البطاقات ويصنف الأفكار الغامضة\nالطالب: يكتبون بطاقاتهم\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 2-2 (كتاب التجارب ص 47)\nالطالب: يحلون فرديًا ثم في أزواج\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يوجه حل الأسئلة 2–7 ويعالج الأفكار الغامضة المتكررة\nالطالب: يحلون ويناقشون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخطأ في عبارة: «جهد قطب الهيدروجين القياسي ‎1.00 V»‎؟\n   الإجابة النموذجية: قيمته المصطلح عليها ‎0.00 V‎.\n2) (المستوى المتوقع) السؤال: اذكر نوع نصف الخلية ‎Br₂/Br⁻‎ وقطبها.\n   الإجابة النموذجية: لافلز/أيون، وقطبها بلاتين.\n3) (المستوى المتقدم) السؤال: ما الذي يقيسه الفولتميتر في خلية تحتوي قطب الهيدروجين القياسي ونصف خلية أخرى؟\n   الإجابة النموذجية: ‎E°‎ لنصف الخلية الأخرى مباشرة (مع تحديد الإشارة من القطب الموجب).","1) (مستوى الدعم) السؤال: لماذا تُحدد الإشارة من قطبية الخلية لا من قراءة الفولتميتر وحدها؟\n   الإجابة النموذجية: لأن الفولتميتر يقرأ المقدار، والإشارة تعتمد على ما إذا كانت نصف الخلية موجبة أو سالبة بالنسبة لقطب الهيدروجين.\n2) (المستوى المتوقع) السؤال: نصف خلية مجهولة كانت القطب السالب وقرأ الفولتميتر ‎0.25 V‎ مع قطب الهيدروجين. ما ‎E°‎؟\n   الإجابة النموذجية: ‎−0.25 V‎.\n3) (المستوى المتقدم) السؤال: ما الفكرة التي كانت غامضة لديك في هذا الموضوع؟ وكيف أصبحت أوضح؟\n   الإجابة النموذجية: إجابة تأملية شخصية تذكر فكرة محددة والطريقة التي ساعدت على فهمها.","إرشاد للطالب: إكمال نشاط 2-2 ص 47 والأسئلة المتبقية من 2–7\nإرشاد لولي الأمر: الاطلاع على بطاقة «الفكرة الغامضة» مع الابن ومساعدته في مراجعتها"],"h":["<ol class=\"ol\"><li>يحل نشاط 2-2 «استخدام جهد الاختزال القياسي»</li><li>يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل نشاط 2-2 «استخدام جهد الاختزال القياسي»</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة الموضوع 2–7 في قياس جهود الأقطاب القياسية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد الأفكار التي تعيق تمكنه من الموضوع ويضع خطة لمعالجتها</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التأمل الذاتي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>مراجعة قياس ‎E°‎، أنواع أنصاف الخلايا، الظروف القياسية، الأخطاء الشائعة.</p>","<p>يطلب المعلم من كل طالب كتابة «فكرة واحدة واضحة» و«فكرة واحدة غامضة» من الموضوع على بطاقتين ويجمعها.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يجمع البطاقات ويصنف الأفكار الغامضة</td><td>يكتبون بطاقاتهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 2-2 (كتاب التجارب ص 47)</td><td>يحلون فرديًا ثم في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يوجه حل الأسئلة 2–7 ويعالج الأفكار الغامضة المتكررة</td><td>يحلون ويناقشون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخطأ في عبارة: «جهد قطب الهيدروجين القياسي ‎1.00 V»‎؟</td><td>قيمته المصطلح عليها ‎0.00 V‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر نوع نصف الخلية ‎Br₂/Br⁻‎ وقطبها.</td><td>لافلز/أيون، وقطبها بلاتين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الذي يقيسه الفولتميتر في خلية تحتوي قطب الهيدروجين القياسي ونصف خلية أخرى؟</td><td>‎E°‎ لنصف الخلية الأخرى مباشرة (مع تحديد الإشارة من القطب الموجب).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تُحدد الإشارة من قطبية الخلية لا من قراءة الفولتميتر وحدها؟</td><td>لأن الفولتميتر يقرأ المقدار، والإشارة تعتمد على ما إذا كانت نصف الخلية موجبة أو سالبة بالنسبة لقطب الهيدروجين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>نصف خلية مجهولة كانت القطب السالب وقرأ الفولتميتر ‎0.25 V‎ مع قطب الهيدروجين. ما ‎E°‎؟</td><td>‎−0.25 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الفكرة التي كانت غامضة لديك في هذا الموضوع؟ وكيف أصبحت أوضح؟</td><td>إجابة تأملية شخصية تذكر فكرة محددة والطريقة التي ساعدت على فهمها.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-2 ص 47 والأسئلة المتبقية من 2–7</p><p><b>إرشاد لولي الأمر:</b> الاطلاع على بطاقة «الفكرة الغامضة» مع الابن ومساعدته في مراجعتها</p>"]}]},{"title":"جهود الاختزال القياسية","sb":"ص 76–85","unit":"الوحدة 2: الكيمياء الكهربائية","periods":[{"axis":"حساب جهد الخلية القياسي ‎E°cell‎","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","جهود الاختزال القياسية"],["الحصة","1 من 5"],["محور الحصة","حساب جهد الخلية القياسي ‎E°cell‎"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 76–78"],["دليل المعلم","ص 106–110"],["كتاب التجارب العملية والأنشطة","نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]],"t":["1. يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)\n2. يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر\nمخرج تعليمي آخر: يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)","جهد الخلية القياسي ‎E°cell‎، القطب الموجب، القطب السالب، الفرق بين جهدي نصفي الخلية.","يعرض المعلم خلية ‎Ag/Zn‎ وقراءة ‎1.56 V‎ ويسأل: «كيف نحصل على هذه القيمة من قيمتي ‎E°‎ في الجدول دون أي قياس؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الخلية ويطرح السؤال\nالطالب: يقترحون حساب الفرق\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح العلاقة وقاعدة القطب الموجب ويحل أمثلة (‎Ag/Zn = 1.56 V‎، ‎Cu/Fe³⁺ = 0.43 V‎)\nالطالب: يتبعون الحل ويتحققون من القيم\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ «حساب قيم جهود الخلايا القياسية» بمسائل متدرجة\nالطالب: يحسبون ‎E°cell‎ لخمس خلايا في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: احسب ‎E°cell‎ لخلية ‎Zn²⁺/Zn (−0.76)‎ مع ‎Cu²⁺/Cu (+0.34)‎.\n   الإجابة النموذجية: ‎E°cell = 0.34 − (−0.76) = 1.10 V‎.\n2) (المستوى المتوقع) السؤال: أي نصفي الخلية هو القطب الموجب في خلية ‎Ag⁺/Ag (+0.80)‎ مع ‎Cu²⁺/Cu (+0.34)‎؟\n   الإجابة النموذجية: ‎Ag⁺/Ag‎ لأن ‎E°‎ له أكبر.\n3) (المستوى المتقدم) السؤال: احسب ‎E°cell‎ للخلية السابقة.\n   الإجابة النموذجية: ‎0.80 − 0.34 = 0.46 V‎.","1) (مستوى الدعم) السؤال: اكتب علاقة حساب ‎E°cell‎.\n   الإجابة النموذجية: ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)\n2) (المستوى المتوقع) السؤال: احسب ‎E°cell‎ لخلية ‎Mg²⁺/Mg (−2.38)‎ مع ‎Ag⁺/Ag (+0.80)‎.\n   الإجابة النموذجية: ‎0.80 − (−2.38) = 3.18 V‎.\n3) (المستوى المتقدم) السؤال: خلية من ‎Cu²⁺/Cu (+0.34)‎ ونصف خلية مجهولة ‎X‎ هي القطب السالب، ‎E°cell = 0.59 V‎. احسب ‎E°‎ لـ ‎X‎.\n   الإجابة النموذجية: ‎E°(X) = 0.34 − 0.59 = −0.25 V‎.","إرشاد للطالب: مراجعة ص 76–78 وحل خمس مسائل ‎E°cell‎\nإرشاد لولي الأمر: متابعة الابن في تحديد القطب الموجب قبل التعويض"],"h":["<ol class=\"ol\"><li>يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)</li><li>يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب جهد الخلية القياسي باستخدام ‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد القطب الموجب بأنه نصف الخلية ذات ‎E°‎ الأكبر</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب ‎E°‎ لنصف خلية مجهولة من ‎E°cell‎ المقيس</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)</span></div>","<p>جهد الخلية القياسي ‎E°cell‎، القطب الموجب، القطب السالب، الفرق بين جهدي نصفي الخلية.</p>","<p>يعرض المعلم خلية ‎Ag/Zn‎ وقراءة ‎1.56 V‎ ويسأل: «كيف نحصل على هذه القيمة من قيمتي ‎E°‎ في الجدول دون أي قياس؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الخلية ويطرح السؤال</td><td>يقترحون حساب الفرق</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح العلاقة وقاعدة القطب الموجب ويحل أمثلة (‎Ag/Zn = 1.56 V‎، ‎Cu/Fe³⁺ = 0.43 V‎)</td><td>يتبعون الحل ويتحققون من القيم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينفذ «حساب قيم جهود الخلايا القياسية» بمسائل متدرجة</td><td>يحسبون ‎E°cell‎ لخمس خلايا في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>احسب ‎E°cell‎ لخلية ‎Zn²⁺/Zn (−0.76)‎ مع ‎Cu²⁺/Cu (+0.34)‎.</td><td>‎E°cell = 0.34 − (−0.76) = 1.10 V‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي نصفي الخلية هو القطب الموجب في خلية ‎Ag⁺/Ag (+0.80)‎ مع ‎Cu²⁺/Cu (+0.34)‎؟</td><td>‎Ag⁺/Ag‎ لأن ‎E°‎ له أكبر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎E°cell‎ للخلية السابقة.</td><td>‎0.80 − 0.34 = 0.46 V‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب علاقة حساب ‎E°cell‎.</td><td>‎E°cell = E°(‎القطب الموجب) ‎− E°(‎القطب السالب)</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎E°cell‎ لخلية ‎Mg²⁺/Mg (−2.38)‎ مع ‎Ag⁺/Ag (+0.80)‎.</td><td>‎0.80 − (−2.38) = 3.18 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>خلية من ‎Cu²⁺/Cu (+0.34)‎ ونصف خلية مجهولة ‎X‎ هي القطب السالب، ‎E°cell = 0.59 V‎. احسب ‎E°‎ لـ ‎X‎.</td><td>‎E°(X) = 0.34 − 0.59 = −0.25 V‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 76–78 وحل خمس مسائل ‎E°cell‎</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في تحديد القطب الموجب قبل التعويض</p>"]},{"axis":"إشارة الأقطاب واتجاه تدفق الإلكترونات","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","جهود الاختزال القياسية"],["الحصة","2 من 5"],["محور الحصة","إشارة الأقطاب واتجاه تدفق الإلكترونات"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 78–80"],["دليل المعلم","ص 106–110"],["كتاب التجارب العملية والأنشطة","نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]],"t":["1. يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎\n2. يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية\nمخرج تعليمي آخر: يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التشاركي\n- التعلم التبادلي","- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية","اتجاه تدفق الإلكترونات، المصعد (‎E°‎ أقل)، المهبط (‎E°‎ أكبر)، التفاعل الكلي للخلية، موازنة الإلكترونات.","يعرض المعلم الشكل 2-14 (خلية ‎Cu/Fe³⁺‎) ويسأل: «في أي اتجاه تتحرك الإلكترونات في السلك؟ وكيف نعرف دون تجربة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الشكل ويطرح السؤال\nالطالب: يقترحون مقارنة قيمتي ‎E°‎\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينظم القراءة التبادلية: طالب يقرأ «التنبؤ باتجاه تدفق الإلكترونات» وآخر «التنبؤ بقيم جهد الخلية» ثم يتبادلان الشرح\nالطالب: يشرح كل منهما لزميله ويلخصان القاعدتين\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل السؤال 11 وكتابة التفاعلات الكلية\nالطالب: يحددون الاتجاه ويكتبون المعادلات الموزونة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: في أي اتجاه تتدفق الإلكترونات في الدائرة الخارجية؟\n   الإجابة النموذجية: من نصف الخلية ذات ‎E°‎ الأقل (المصعد) إلى ذات ‎E°‎ الأكبر (المهبط).\n2) (المستوى المتوقع) السؤال: اكتب التفاعل الكلي لخلية ‎Cu²⁺/Cu‎ مع ‎Fe³⁺/Fe²⁺‎.\n   الإجابة النموذجية: ‎Cu + 2Fe³⁺ → Cu²⁺ + 2Fe²⁺‎\n3) (المستوى المتقدم) السؤال: لماذا نضرب نصف معادلة ‎Fe³⁺/Fe²⁺‎ في 2 قبل الجمع؟\n   الإجابة النموذجية: لتتساوى أعداد الإلكترونات المفقودة والمكتسبة.","1) (مستوى الدعم) السؤال: في خلية ‎Zn/Ag‎، أي القطبين يتأكسد؟\n   الإجابة النموذجية: الخارصين.\n2) (المستوى المتوقع) السؤال: حدد اتجاه الإلكترونات في خلية ‎I₂/I⁻ (+0.54)‎ مع ‎F₂/F⁻ (+2.87)‎.\n   الإجابة النموذجية: من نصف خلية ‎I₂/I⁻‎ إلى نصف خلية ‎F₂/F⁻‎.\n3) (المستوى المتقدم) السؤال: اكتب التفاعل الكلي لخلية ‎Ni²⁺/Ni (−0.25)‎ مع ‎Cu²⁺/Cu (+0.34)‎ واحسب ‎E°cell‎.\n   الإجابة النموذجية: ‎Ni + Cu²⁺ → Ni²⁺ + Cu‎؛ ‎E°cell = 0.59 V‎.","إرشاد للطالب: مراجعة ص 78–80 وحل السؤال 11\nإرشاد لولي الأمر: سؤال الابن عن قاعدة «من الأقل إلى الأكبر» في اتجاه الإلكترونات"],"h":["<ol class=\"ol\"><li>يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎</li><li>يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستنتج إشارة كل قطب واتجاه تدفق الإلكترونات في الدائرة الخارجية لخلية من قيم ‎E°‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب نصفي التفاعل والتفاعل الكلي الذي يحدث في الخلية الجلفانية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل السؤال 11 لتحديد اتجاه تدفق الإلكترونات لأزواج مختلفة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم التبادلي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية</span></div>","<p>اتجاه تدفق الإلكترونات، المصعد (‎E°‎ أقل)، المهبط (‎E°‎ أكبر)، التفاعل الكلي للخلية، موازنة الإلكترونات.</p>","<p>يعرض المعلم الشكل 2-14 (خلية ‎Cu/Fe³⁺‎) ويسأل: «في أي اتجاه تتحرك الإلكترونات في السلك؟ وكيف نعرف دون تجربة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الشكل ويطرح السؤال</td><td>يقترحون مقارنة قيمتي ‎E°‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينظم القراءة التبادلية: طالب يقرأ «التنبؤ باتجاه تدفق الإلكترونات» وآخر «التنبؤ بقيم جهد الخلية» ثم يتبادلان الشرح</td><td>يشرح كل منهما لزميله ويلخصان القاعدتين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل السؤال 11 وكتابة التفاعلات الكلية</td><td>يحددون الاتجاه ويكتبون المعادلات الموزونة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>في أي اتجاه تتدفق الإلكترونات في الدائرة الخارجية؟</td><td>من نصف الخلية ذات ‎E°‎ الأقل (المصعد) إلى ذات ‎E°‎ الأكبر (المهبط).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب التفاعل الكلي لخلية ‎Cu²⁺/Cu‎ مع ‎Fe³⁺/Fe²⁺‎.</td><td>‎Cu + 2Fe³⁺ → Cu²⁺ + 2Fe²⁺‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا نضرب نصف معادلة ‎Fe³⁺/Fe²⁺‎ في 2 قبل الجمع؟</td><td>لتتساوى أعداد الإلكترونات المفقودة والمكتسبة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>في خلية ‎Zn/Ag‎، أي القطبين يتأكسد؟</td><td>الخارصين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>حدد اتجاه الإلكترونات في خلية ‎I₂/I⁻ (+0.54)‎ مع ‎F₂/F⁻ (+2.87)‎.</td><td>من نصف خلية ‎I₂/I⁻‎ إلى نصف خلية ‎F₂/F⁻‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب التفاعل الكلي لخلية ‎Ni²⁺/Ni (−0.25)‎ مع ‎Cu²⁺/Cu (+0.34)‎ واحسب ‎E°cell‎.</td><td>‎Ni + Cu²⁺ → Ni²⁺ + Cu‎؛ ‎E°cell = 0.59 V‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 78–80 وحل السؤال 11</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن قاعدة «من الأقل إلى الأكبر» في اتجاه الإلكترونات</p>"]},{"axis":"التنبؤ بإمكانية حدوث التفاعل","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","جهود الاختزال القياسية"],["الحصة","3 من 5"],["محور الحصة","التنبؤ بإمكانية حدوث التفاعل"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 80–83"],["دليل المعلم","ص 106–110"],["كتاب التجارب العملية والأنشطة","نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]],"t":["1. يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا)\n2. يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9)\nمخرج تعليمي آخر: يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل)","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية","الإمكانية (الجدوى)، ‎E°cell‎ الموجب، التفاعل التلقائي، طاقة التنشيط، سرعة التفاعل، الظروف غير القياسية.","يسأل المعلم: «هل يستطيع الكلور أكسدة أيونات البروميد؟ وهل يستطيع اليود أكسدة أيونات البروميد؟ كيف نعرف قبل التجربة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤالين\nالطالب: يتوقعون باستخدام نشاطية الهالوجينات\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «التنبؤ بحدوث التفاعلات» ويشرح قاعدة ‎E°cell > 0‎ والمثالين 4 و5\nالطالب: يطبقون القاعدة على تفاعلي الكلور واليود\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل السؤال 9 (اقتراح مواد لأكسدة أو اختزال) في مجموعات\nالطالب: يقترحون المواد ويبررون بالحساب\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: هل يتفاعل ‎Cl₂ (+1.36)‎ مع ‎Br⁻ (Br₂/Br⁻ = +1.07)‎؟\n   الإجابة النموذجية: نعم؛ ‎E°cell = 1.36 − 1.07 = +0.29 V‎ موجب.\n2) (المستوى المتوقع) السؤال: هل يتفاعل ‎I₂ (+0.54)‎ مع ‎Br⁻‎؟\n   الإجابة النموذجية: لا؛ ‎E°cell = 0.54 − 1.07 = −0.53 V‎ سالب.\n3) (المستوى المتقدم) السؤال: لماذا قد لا يُلاحظ تفاعل رغم أن ‎E°cell‎ موجب؟\n   الإجابة النموذجية: لأن طاقة التنشيط عالية فيكون التفاعل بطيئًا جدًا، أو لأن الظروف غير قياسية.","1) (مستوى الدعم) السؤال: ما شرط إمكانية حدوث التفاعل وفق ‎E°‎؟\n   الإجابة النموذجية: أن تكون قيمة ‎E°cell‎ موجبة.\n2) (المستوى المتوقع) السؤال: هل يذيب حمض ‎HCl (H⁺)‎ فلز النحاس ‎(Cu²⁺/Cu = +0.34)‎؟\n   الإجابة النموذجية: لا؛ ‎E°cell = 0.00 − 0.34 = −0.34 V‎ سالب.\n3) (المستوى المتقدم) السؤال: اقترح مادة لاختزال ‎Fe³⁺‎ إلى ‎Fe²⁺‎ وبرر اختيارك.\n   الإجابة النموذجية: ‎I⁻ (E° = +0.54)‎ لأن ‎E°cell = 0.77 − 0.54 = +0.23 V‎ موجب، أو ‎Zn‎.","إرشاد للطالب: مراجعة ص 80–83 وحل السؤال 9\nإرشاد لولي الأمر: تشجيع الابن على التحقق من الإشارة قبل الحكم على إمكانية التفاعل"],"h":["<ol class=\"ol\"><li>يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا)</li><li>يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم قيم ‎E°‎ للتنبؤ بإمكانية حدوث تفاعل أكسدة واختزال (‎E°cell‎ موجب يعني تفاعلًا ممكنًا)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقترح مواد متفاعلة مناسبة لعمليات أكسدة أو اختزال محددة (السؤال 9)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا قد لا يُلاحظ تفاعل ممكن من حيث ‎E° (‎بطء التفاعل)</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية</span></div>","<p>الإمكانية (الجدوى)، ‎E°cell‎ الموجب، التفاعل التلقائي، طاقة التنشيط، سرعة التفاعل، الظروف غير القياسية.</p>","<p>يسأل المعلم: «هل يستطيع الكلور أكسدة أيونات البروميد؟ وهل يستطيع اليود أكسدة أيونات البروميد؟ كيف نعرف قبل التجربة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤالين</td><td>يتوقعون باستخدام نشاطية الهالوجينات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «التنبؤ بحدوث التفاعلات» ويشرح قاعدة ‎E°cell &gt; 0‎ والمثالين 4 و5</td><td>يطبقون القاعدة على تفاعلي الكلور واليود</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل السؤال 9 (اقتراح مواد لأكسدة أو اختزال) في مجموعات</td><td>يقترحون المواد ويبررون بالحساب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>هل يتفاعل ‎Cl₂ (+1.36)‎ مع ‎Br⁻ (Br₂/Br⁻ = +1.07)‎؟</td><td>نعم؛ ‎E°cell = 1.36 − 1.07 = +0.29 V‎ موجب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>هل يتفاعل ‎I₂ (+0.54)‎ مع ‎Br⁻‎؟</td><td>لا؛ ‎E°cell = 0.54 − 1.07 = −0.53 V‎ سالب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا قد لا يُلاحظ تفاعل رغم أن ‎E°cell‎ موجب؟</td><td>لأن طاقة التنشيط عالية فيكون التفاعل بطيئًا جدًا، أو لأن الظروف غير قياسية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما شرط إمكانية حدوث التفاعل وفق ‎E°‎؟</td><td>أن تكون قيمة ‎E°cell‎ موجبة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>هل يذيب حمض ‎HCl (H⁺)‎ فلز النحاس ‎(Cu²⁺/Cu = +0.34)‎؟</td><td>لا؛ ‎E°cell = 0.00 − 0.34 = −0.34 V‎ سالب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح مادة لاختزال ‎Fe³⁺‎ إلى ‎Fe²⁺‎ وبرر اختيارك.</td><td>‎I⁻ (E° = +0.54)‎ لأن ‎E°cell = 0.77 − 0.54 = +0.23 V‎ موجب، أو ‎Zn‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 80–83 وحل السؤال 9</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على التحقق من الإشارة قبل الحكم على إمكانية التفاعل</p>"]},{"axis":"القوة النسبية للعوامل المؤكسدة والمختزلة","n":4,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","جهود الاختزال القياسية"],["الحصة","4 من 5"],["محور الحصة","القوة النسبية للعوامل المؤكسدة والمختزلة"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 83–85"],["دليل المعلم","ص 106–110"],["كتاب التجارب العملية والأنشطة","نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]],"t":["1. يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة\n2. يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16\nمخرج تعليمي آخر: يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم","المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)","العامل المؤكسد الأقوى (‎E°‎ الأكبر)، العامل المختزل الأقوى (‎E°‎ الأصغر)، الطرف الأيسر والأيمن من نصف المعادلة، الترتيب.","يعرض المعلم الشكل 2-16 ويسأل: «أين يقع أقوى عامل مؤكسد في هذه السلسلة؟ وأين يقع أقوى عامل مختزل؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الشكل ويطرح السؤال\nالطالب: يحددون موقعيهما\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: ينفذ «قيم ‎E°‎ والعوامل المؤكسدة والمختزلة» ويشرح قراءة السلسلة (يسار: مؤكسدات، يمين: مختزلات)\nالطالب: يرتبون أمثلة حسب القوة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل السؤال 10 ومسائل ترتيب إضافية\nالطالب: يحلون في أزواج ويعرضون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على جهود الاختزال\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أي الأيونين أقوى عاملًا مؤكسدًا: ‎Ag⁺ (+0.80)‎ أم ‎Cu²⁺ (+0.34)‎؟\n   الإجابة النموذجية: ‎Ag⁺‎.\n2) (المستوى المتوقع) السؤال: أي الفلزين أقوى عاملًا مختزلًا: ‎Mg (−2.38)‎ أم ‎Zn (−0.76)‎؟\n   الإجابة النموذجية: ‎Mg‎.\n3) (المستوى المتقدم) السؤال: لماذا يُعد ‎F₂‎ أقوى عامل مؤكسد في السلسلة؟\n   الإجابة النموذجية: لأن ‎E°‎ لـ ‎F₂/F⁻‎ أكبر قيمة ‎(+2.87 V)‎ فيميل بشدة لكسب الإلكترونات.","1) (مستوى الدعم) السؤال: أين يقع العامل المختزل في نصف معادلة الاختزال؟\n   الإجابة النموذجية: في الطرف الأيمن (الناتج).\n2) (المستوى المتوقع) السؤال: رتب تصاعديًا حسب قوة العامل المؤكسد: ‎Cl₂ (+1.36)‎، ‎I₂ (+0.54)‎، ‎Br₂ (+1.07)‎.\n   الإجابة النموذجية: ‎I₂ < Br₂ < Cl₂‎.\n3) (المستوى المتقدم) السؤال: أي الأيونات ‎Ag⁺‎ و‎Cr²⁺‎ و‎Fe²⁺‎ يحتاج إلى العامل المختزل الأقوى ليُختزل إلى فلز؟ (‎E°: Ag⁺/Ag = +0.80‎، ‎Fe²⁺/Fe = −0.44‎، ‎Cr²⁺/Cr = −0.91‎)\n   الإجابة النموذجية: ‎Cr²⁺‎ لأن ‎E°‎ له الأصغر فهو الأصعب اختزالًا.","إرشاد للطالب: مراجعة ص 83–85 وحل السؤال 10\nإرشاد لولي الأمر: سؤال الابن عن أقوى عامل مؤكسد وأقوى عامل مختزل في السلسلة"],"h":["<ol class=\"ol\"><li>يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة</li><li>يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستنتج من قيم ‎E°‎ النشاط الكيميائي النسبي للعناصر والمركبات والأيونات بوصفها عوامل مؤكسدة أو مختزلة</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يرتب عوامل مؤكسدة ومختزلة حسب قوتها مستعينًا بالشكل 2-16</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل السؤال 10 حول العامل المختزل والمؤكسد الأقوى اللازم</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية (الملحق 2)</span></div>","<p>العامل المؤكسد الأقوى (‎E°‎ الأكبر)، العامل المختزل الأقوى (‎E°‎ الأصغر)، الطرف الأيسر والأيمن من نصف المعادلة، الترتيب.</p>","<p>يعرض المعلم الشكل 2-16 ويسأل: «أين يقع أقوى عامل مؤكسد في هذه السلسلة؟ وأين يقع أقوى عامل مختزل؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الشكل ويطرح السؤال</td><td>يحددون موقعيهما</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>ينفذ «قيم ‎E°‎ والعوامل المؤكسدة والمختزلة» ويشرح قراءة السلسلة (يسار: مؤكسدات، يمين: مختزلات)</td><td>يرتبون أمثلة حسب القوة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه حل السؤال 10 ومسائل ترتيب إضافية</td><td>يحلون في أزواج ويعرضون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على جهود الاختزال</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أي الأيونين أقوى عاملًا مؤكسدًا: ‎Ag⁺ (+0.80)‎ أم ‎Cu²⁺ (+0.34)‎؟</td><td>‎Ag⁺‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي الفلزين أقوى عاملًا مختزلًا: ‎Mg (−2.38)‎ أم ‎Zn (−0.76)‎؟</td><td>‎Mg‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد ‎F₂‎ أقوى عامل مؤكسد في السلسلة؟</td><td>لأن ‎E°‎ لـ ‎F₂/F⁻‎ أكبر قيمة ‎(+2.87 V)‎ فيميل بشدة لكسب الإلكترونات.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين يقع العامل المختزل في نصف معادلة الاختزال؟</td><td>في الطرف الأيمن (الناتج).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب تصاعديًا حسب قوة العامل المؤكسد: ‎Cl₂ (+1.36)‎، ‎I₂ (+0.54)‎، ‎Br₂ (+1.07)‎.</td><td>‎I₂ &lt; Br₂ &lt; Cl₂‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أي الأيونات ‎Ag⁺‎ و‎Cr²⁺‎ و‎Fe²⁺‎ يحتاج إلى العامل المختزل الأقوى ليُختزل إلى فلز؟ (‎E°: Ag⁺/Ag = +0.80‎، ‎Fe²⁺/Fe = −0.44‎، ‎Cr²⁺/Cr = −0.91‎)</td><td>‎Cr²⁺‎ لأن ‎E°‎ له الأصغر فهو الأصعب اختزالًا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 83–85 وحل السؤال 10</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن أقوى عامل مؤكسد وأقوى عامل مختزل في السلسلة</p>"]},{"axis":"الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ونشاط 2-3","n":5,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","جهود الاختزال القياسية"],["الحصة","5 من 5"],["محور الحصة","الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ونشاط 2-3"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 76–85 + كتاب التجارب ص 49 و59"],["دليل المعلم","ص 106–110"],["كتاب التجارب العملية والأنشطة","نشاط 2-3: قيم فولتية الخلايا الكهروكيميائية ص 49؛ الاستقصاء العملي 2-1: مقارنة فولتية الخلايا الجلفانية ص 59"]],"t":["1. يبني خلايا جلفانية من أنصاف خلايا مختلفة ويقيس فولتيتها\n2. يقارن القيم المقيسة بالقيم المحسوبة من ‎E°‎ ويفسر الفروق\nمخرج تعليمي آخر: يحل نشاط 2-3 «قيم فولتية الخلايا الكهروكيميائية»","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: أنصاف خلايا ‎Zn‎ و‎Cu‎ و‎Fe‎ و‎Ag‎ ومحاليلها، قنطرة ملحية، فولتميتر رقمي، أسلاك","الفولتية المقيسة، الفولتية المحسوبة، الظروف غير القياسية، المقاومة الداخلية، نظافة الأقطاب.","يسأل المعلم: «حسبنا أن خلية ‎Zn/Cu‎ تعطي ‎1.10 V‎؛ هل تتوقع أن يقرأ الفولتميتر هذه القيمة تمامًا في المختبر؟ لماذا؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يطرح السؤال ويراجع السلامة (محاليل نترات الفضة)\nالطالب: يقترحون أسباب الاختلاف المحتملة\n2) (20 دقيقة: من الدقيقة 4 إلى 24)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 2-1 (كتاب التجارب ص 59) وبناء ثلاث خلايا\nالطالب: يقيسون الفولتية ويسجلونها مع القيم المحسوبة في جدول\n3) (10 دقائق: من الدقيقة 24 إلى 34)\nالمعلم: يناقش أسباب الفروق ويوجه حل نشاط 2-3 (ص 49)\nالطالب: يفسرون الفروق ويحلون النشاط\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا تختلف الفولتية المقيسة عن المحسوبة غالبًا؟\n   الإجابة النموذجية: لأن الظروف قد لا تكون قياسية (تراكيز وحرارة)، ولوجود طبقات أكاسيد على الأقطاب ومقاومة في الدائرة.\n2) (المستوى المتوقع) السؤال: لماذا تُنظف الأقطاب بورق صنفرة قبل الاستخدام؟\n   الإجابة النموذجية: لإزالة طبقات الأكسيد التي تعيق تبادل الإلكترونات.\n3) (المستوى المتقدم) السؤال: ما احتياط السلامة عند استخدام محلول نترات الفضة؟\n   الإجابة النموذجية: ارتداء القفازات والنظارات لأنه يلوث الجلد ومهيج.","1) (مستوى الدعم) السؤال: أي خلية تتوقع أن تعطي أكبر فولتية: ‎Zn/Cu‎ أم ‎Zn/Ag‎ أم ‎Cu/Ag‎؟\n   الإجابة النموذجية: ‎Zn/Ag (1.56 V)‎.\n2) (المستوى المتوقع) السؤال: اذكر متغيرين يجب ضبطهما في هذا الاستقصاء.\n   الإجابة النموذجية: تراكيز المحاليل ودرجة الحرارة (ونوع القنطرة الملحية).\n3) (المستوى المتقدم) السؤال: اقترح تحسينًا يقرب القيم المقيسة من المحسوبة.\n   الإجابة النموذجية: استخدام محاليل بتركيز ‎1.00 mol/dm³‎ بدقة، وتنظيف الأقطاب، واستخدام فولتميتر رقمي عالي المقاومة، والقياس عند ‎298 K‎.","إرشاد للطالب: كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-3 ص 49\nإرشاد لولي الأمر: التأكد من مقارنة الابن بين القيم المقيسة والمحسوبة في تقريره"],"h":["<ol class=\"ol\"><li>يبني خلايا جلفانية من أنصاف خلايا مختلفة ويقيس فولتيتها</li><li>يقارن القيم المقيسة بالقيم المحسوبة من ‎E°‎ ويفسر الفروق</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 2-3 «قيم فولتية الخلايا الكهروكيميائية»</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يبني خلايا جلفانية من أنصاف خلايا مختلفة ويقيس فولتيتها</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن القيم المقيسة بالقيم المحسوبة من ‎E°‎ ويفسر الفروق</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 2-3 «قيم فولتية الخلايا الكهروكيميائية»</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: أنصاف خلايا ‎Zn‎ و‎Cu‎ و‎Fe‎ و‎Ag‎ ومحاليلها، قنطرة ملحية، فولتميتر رقمي، أسلاك</span></div>","<p>الفولتية المقيسة، الفولتية المحسوبة، الظروف غير القياسية، المقاومة الداخلية، نظافة الأقطاب.</p>","<p>يسأل المعلم: «حسبنا أن خلية ‎Zn/Cu‎ تعطي ‎1.10 V‎؛ هل تتوقع أن يقرأ الفولتميتر هذه القيمة تمامًا في المختبر؟ لماذا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يطرح السؤال ويراجع السلامة (محاليل نترات الفضة)</td><td>يقترحون أسباب الاختلاف المحتملة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–24</span><br><small>20 دقيقة</small></td><td>يوجه تنفيذ الاستقصاء العملي 2-1 (كتاب التجارب ص 59) وبناء ثلاث خلايا</td><td>يقيسون الفولتية ويسجلونها مع القيم المحسوبة في جدول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">24–34</span><br><small>10 دقائق</small></td><td>يناقش أسباب الفروق ويوجه حل نشاط 2-3 (ص 49)</td><td>يفسرون الفروق ويحلون النشاط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">34–40</span><br><small>6 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تختلف الفولتية المقيسة عن المحسوبة غالبًا؟</td><td>لأن الظروف قد لا تكون قياسية (تراكيز وحرارة)، ولوجود طبقات أكاسيد على الأقطاب ومقاومة في الدائرة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تُنظف الأقطاب بورق صنفرة قبل الاستخدام؟</td><td>لإزالة طبقات الأكسيد التي تعيق تبادل الإلكترونات.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما احتياط السلامة عند استخدام محلول نترات الفضة؟</td><td>ارتداء القفازات والنظارات لأنه يلوث الجلد ومهيج.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أي خلية تتوقع أن تعطي أكبر فولتية: ‎Zn/Cu‎ أم ‎Zn/Ag‎ أم ‎Cu/Ag‎؟</td><td>‎Zn/Ag (1.56 V)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر متغيرين يجب ضبطهما في هذا الاستقصاء.</td><td>تراكيز المحاليل ودرجة الحرارة (ونوع القنطرة الملحية).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح تحسينًا يقرب القيم المقيسة من المحسوبة.</td><td>استخدام محاليل بتركيز ‎1.00 mol/dm³‎ بدقة، وتنظيف الأقطاب، واستخدام فولتميتر رقمي عالي المقاومة، والقياس عند ‎298 K‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 2-1 وإكمال نشاط 2-3 ص 49</p><p><b>إرشاد لولي الأمر:</b> التأكد من مقارنة الابن بين القيم المقيسة والمحسوبة في تقريره</p>"]}]},{"title":"تأثير تراكيز الأيونات على قيم جهود الاختزال ‎(Er)‎","sb":"ص 86–89","unit":"الوحدة 2: الكيمياء الكهربائية","periods":[{"axis":"الأثر النوعي لتغير تركيز الأيونات على جهد الاختزال","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","تأثير تراكيز الأيونات على قيم جهود الاختزال ‎(Er)‎"],["الحصة","1 من 3"],["محور الحصة","الأثر النوعي لتغير تركيز الأيونات على جهد الاختزال"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 86–87"],["دليل المعلم","ص 109–114"],["كتاب التجارب العملية والأنشطة","نشاط 2-4: أثر تغير التركيز على قيم جهود الاختزال ص 52؛ الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ص 68"]],"t":["1. يتنبأ نوعيًا بأثر تغير تركيز الأيونات على قيمة جهد الاختزال لنصف خلية باستخدام مبدأ لوشاتلييه\n2. يفسر كيف يؤثر تغير جهد نصف الخلية على جهد الخلية الكلي\nمخرج تعليمي آخر: يربط بين نقص الجهد ونفاد البطارية أثناء الاستعمال","المخرج 1: تحليل\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: خلية ‎Cu/Ag‎ ومحاليل نترات الفضة بتراكيز مختلفة للعرض","الظروف غير القياسية، ‎Er‎، مبدأ لوشاتلييه، زيادة التركيز تزيد ‎Er‎، نقص التركيز يقلل ‎Er‎، التغيرات في نظام أيون-أيون.","يسأل المعلم: «لماذا تضعف بطارية الهاتف تدريجيًا قبل أن تنفد تمامًا؟ ما الذي يتغير داخلها؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال\nالطالب: يقترحون تغير تراكيز المواد المتفاعلة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح أثر زيادة ‎[Ag⁺]‎ على اتزان ‎Ag⁺ + e⁻ ⇌ Ag‎ وقيمة ‎Er‎ بالشكل 2-18\nالطالب: يتنبؤون باتجاه الإزاحة والأثر على الجهد\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينفذ «التغيرات التي تحدث في نظام أيون-أيون» ‎(Fe³⁺/Fe²⁺)‎ بجدول تنبؤات\nالطالب: يتنبؤون ثم يتحققون ويشرحون التغيرات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ماذا يحدث لقيمة ‎Er‎ لنصف الخلية ‎Ag⁺/Ag‎ عند زيادة ‎[Ag⁺]‎؟\n   الإجابة النموذجية: تزداد (تصبح أكثر موجبية) لأن الاتزان يُزاح نحو اليمين.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لـ ‎Er‎ لنصف الخلية ‎Fe³⁺/Fe²⁺‎ عند زيادة ‎[Fe²⁺]‎؟\n   الإجابة النموذجية: تقل لأن الاتزان يُزاح نحو اليسار.\n3) (المستوى المتقدم) السؤال: في خلية ‎Cu/Ag‎، ماذا يحدث لجهد الخلية عند تخفيف محلول ‎Ag⁺‎؟\n   الإجابة النموذجية: يقل لأن ‎Er‎ للقطب الموجب يقل.","1) (مستوى الدعم) السؤال: ما المبدأ المستخدم للتنبؤ النوعي بأثر التركيز؟\n   الإجابة النموذجية: مبدأ لوشاتلييه.\n2) (المستوى المتوقع) السؤال: كيف يتغير ‎Er‎ لـ ‎Zn²⁺/Zn‎ عند تقليل ‎[Zn²⁺]‎؟\n   الإجابة النموذجية: يقل (يصبح أكثر سالبية).\n3) (المستوى المتقدم) السؤال: لماذا ينخفض جهد البطارية أثناء الاستعمال؟\n   الإجابة النموذجية: لأن تراكيز المواد المتفاعلة تقل وتراكيز النواتج تزداد فتتغير ‎Er‎ لنصفي الخلية ويقل الفرق بينهما.","إرشاد للطالب: مراجعة ص 86–87 وإكمال جدول التنبؤات\nإرشاد لولي الأمر: الحديث مع الابن عن العادات الصحيحة لشحن البطاريات"],"h":["<ol class=\"ol\"><li>يتنبأ نوعيًا بأثر تغير تركيز الأيونات على قيمة جهد الاختزال لنصف خلية باستخدام مبدأ لوشاتلييه</li><li>يفسر كيف يؤثر تغير جهد نصف الخلية على جهد الخلية الكلي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط بين نقص الجهد ونفاد البطارية أثناء الاستعمال</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يتنبأ نوعيًا بأثر تغير تركيز الأيونات على قيمة جهد الاختزال لنصف خلية باستخدام مبدأ لوشاتلييه</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر كيف يؤثر تغير جهد نصف الخلية على جهد الخلية الكلي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط بين نقص الجهد ونفاد البطارية أثناء الاستعمال</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: خلية ‎Cu/Ag‎ ومحاليل نترات الفضة بتراكيز مختلفة للعرض</span></div>","<p>الظروف غير القياسية، ‎Er‎، مبدأ لوشاتلييه، زيادة التركيز تزيد ‎Er‎، نقص التركيز يقلل ‎Er‎، التغيرات في نظام أيون-أيون.</p>","<p>يسأل المعلم: «لماذا تضعف بطارية الهاتف تدريجيًا قبل أن تنفد تمامًا؟ ما الذي يتغير داخلها؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال</td><td>يقترحون تغير تراكيز المواد المتفاعلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح أثر زيادة ‎[Ag⁺]‎ على اتزان ‎Ag⁺ + e⁻ ⇌ Ag‎ وقيمة ‎Er‎ بالشكل 2-18</td><td>يتنبؤون باتجاه الإزاحة والأثر على الجهد</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينفذ «التغيرات التي تحدث في نظام أيون-أيون» ‎(Fe³⁺/Fe²⁺)‎ بجدول تنبؤات</td><td>يتنبؤون ثم يتحققون ويشرحون التغيرات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا يحدث لقيمة ‎Er‎ لنصف الخلية ‎Ag⁺/Ag‎ عند زيادة ‎[Ag⁺]‎؟</td><td>تزداد (تصبح أكثر موجبية) لأن الاتزان يُزاح نحو اليمين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لـ ‎Er‎ لنصف الخلية ‎Fe³⁺/Fe²⁺‎ عند زيادة ‎[Fe²⁺]‎؟</td><td>تقل لأن الاتزان يُزاح نحو اليسار.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>في خلية ‎Cu/Ag‎، ماذا يحدث لجهد الخلية عند تخفيف محلول ‎Ag⁺‎؟</td><td>يقل لأن ‎Er‎ للقطب الموجب يقل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المبدأ المستخدم للتنبؤ النوعي بأثر التركيز؟</td><td>مبدأ لوشاتلييه.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يتغير ‎Er‎ لـ ‎Zn²⁺/Zn‎ عند تقليل ‎[Zn²⁺]‎؟</td><td>يقل (يصبح أكثر سالبية).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا ينخفض جهد البطارية أثناء الاستعمال؟</td><td>لأن تراكيز المواد المتفاعلة تقل وتراكيز النواتج تزداد فتتغير ‎Er‎ لنصفي الخلية ويقل الفرق بينهما.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 86–87 وإكمال جدول التنبؤات</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن العادات الصحيحة لشحن البطاريات</p>"]},{"axis":"معادلة نيرنست وحساباتها","n":2,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","تأثير تراكيز الأيونات على قيم جهود الاختزال ‎(Er)‎"],["الحصة","2 من 3"],["محور الحصة","معادلة نيرنست وحساباتها"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 87–89"],["دليل المعلم","ص 109–114"],["كتاب التجارب العملية والأنشطة","نشاط 2-4: أثر تغير التركيز على قيم جهود الاختزال ص 52؛ الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ص 68"]],"t":["1. يستخدم معادلة نيرنست ‎Er = E° − (0.059/z) log Q‎ لحساب جهد نصف خلية في ظروف غير قياسية\n2. يحسب جهد خلية مكونة من نصفي خلية أحدهما أو كلاهما غير قياسي\nمخرج تعليمي آخر: يفسر شكل العلاقة البيانية بين ‎Ecell‎ و‎log[Ag⁺] (‎الشكل 2-18)","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية","معادلة نيرنست، ‎Q (‎حاصل التفاعل)، ‎z (‎عدد الإلكترونات)، 0.059، ‎log₁₀‎، الظروف غير القياسية.","يعرض المعلم الشكل ‎2-18 (Ecell‎ مقابل ‎log[Ag⁺]‎) ويسأل: «العلاقة خط مستقيم؛ ما الذي يجعلها خطية مع اللوغاريتم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الشكل ويطرح السؤال\nالطالب: يلاحظون الخطية ويقترحون معادلة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح معادلة نيرنست وتبسيطها والصيغة المتوقعة ويحل مثالًا لـ ‎Ag⁺/Ag‎\nالطالب: يتبعون خطوات التعويض ويكتبون ‎Q‎ لكل نصف خلية\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم مسائل لـ ‎Cu²⁺/Cu‎ و‎Zn²⁺/Zn‎ وخلية كاملة غير قياسية\nالطالب: يحلون في أزواج ويتحققون من الإشارات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب صيغة معادلة نيرنست المبسطة.\n   الإجابة النموذجية: ‎Er = E° − (0.059/z) log Q‎\n2) (المستوى المتوقع) السؤال: احسب ‎Er‎ لـ ‎Ag⁺/Ag (E° = +0.80)‎ عندما ‎[Ag⁺] = 0.010 mol/dm³‎.\n   الإجابة النموذجية: ‎Q = 1/[Ag⁺] = 100‎؛ ‎Er = 0.80 − 0.059 × 2 = 0.68 V‎.\n3) (المستوى المتقدم) السؤال: احسب ‎Er‎ لـ ‎Cu²⁺/Cu (E° = +0.34)‎ عندما ‎[Cu²⁺] = 0.0010 mol/dm³‎.\n   الإجابة النموذجية: ‎Q = 1000‎؛ ‎Er = 0.34 − (0.059/2) × 3 = 0.25 V‎.","1) (مستوى الدعم) السؤال: ما الذي يمثله ‎z‎ في معادلة نيرنست؟\n   الإجابة النموذجية: عدد الإلكترونات المتبادلة في نصف التفاعل.\n2) (المستوى المتوقع) السؤال: احسب ‎Er‎ لـ ‎Zn²⁺/Zn (E° = −0.76)‎ عندما ‎[Zn²⁺] = 0.10 mol/dm³‎.\n   الإجابة النموذجية: ‎Q = 10‎؛ ‎Er = −0.76 − 0.0295 = −0.79 V‎.\n3) (المستوى المتقدم) السؤال: احسب ‎Ecell‎ لخلية ‎Zn²⁺(0.10)/Zn‎ مع ‎Cu²⁺(1.00)/Cu‎.\n   الإجابة النموذجية: ‎Er(Cu) = 0.34‎؛ ‎Er(Zn) = −0.79‎؛ ‎Ecell = 0.34 − (−0.79) = 1.13 V‎.","إرشاد للطالب: مراجعة ص 87–89 وحل ثلاث مسائل نيرنست\nإرشاد لولي الأمر: متابعة الابن في كتابة ‎Q‎ بصورة صحيحة قبل التعويض"],"h":["<ol class=\"ol\"><li>يستخدم معادلة نيرنست ‎Er = E° − (0.059/z) log Q‎ لحساب جهد نصف خلية في ظروف غير قياسية</li><li>يحسب جهد خلية مكونة من نصفي خلية أحدهما أو كلاهما غير قياسي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر شكل العلاقة البيانية بين ‎Ecell‎ و‎log[Ag⁺] (‎الشكل 2-18)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم معادلة نيرنست ‎Er = E° − (0.059/z) log Q‎ لحساب جهد نصف خلية في ظروف غير قياسية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحسب جهد خلية مكونة من نصفي خلية أحدهما أو كلاهما غير قياسي</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر شكل العلاقة البيانية بين ‎Ecell‎ و‎log[Ag⁺] (‎الشكل 2-18)</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: آلة حاسبة علمية</span></div>","<p>معادلة نيرنست، ‎Q (‎حاصل التفاعل)، ‎z (‎عدد الإلكترونات)، 0.059، ‎log₁₀‎، الظروف غير القياسية.</p>","<p>يعرض المعلم الشكل ‎2-18 (Ecell‎ مقابل ‎log[Ag⁺]‎) ويسأل: «العلاقة خط مستقيم؛ ما الذي يجعلها خطية مع اللوغاريتم؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الشكل ويطرح السؤال</td><td>يلاحظون الخطية ويقترحون معادلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح معادلة نيرنست وتبسيطها والصيغة المتوقعة ويحل مثالًا لـ ‎Ag⁺/Ag‎</td><td>يتبعون خطوات التعويض ويكتبون ‎Q‎ لكل نصف خلية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم مسائل لـ ‎Cu²⁺/Cu‎ و‎Zn²⁺/Zn‎ وخلية كاملة غير قياسية</td><td>يحلون في أزواج ويتحققون من الإشارات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب صيغة معادلة نيرنست المبسطة.</td><td>‎Er = E° − (0.059/z) log Q‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎Er‎ لـ ‎Ag⁺/Ag (E° = +0.80)‎ عندما ‎[Ag⁺] = 0.010 mol/dm³‎.</td><td>‎Q = 1/[Ag⁺] = 100‎؛ ‎Er = 0.80 − 0.059 × 2 = 0.68 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎Er‎ لـ ‎Cu²⁺/Cu (E° = +0.34)‎ عندما ‎[Cu²⁺] = 0.0010 mol/dm³‎.</td><td>‎Q = 1000‎؛ ‎Er = 0.34 − (0.059/2) × 3 = 0.25 V‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الذي يمثله ‎z‎ في معادلة نيرنست؟</td><td>عدد الإلكترونات المتبادلة في نصف التفاعل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>احسب ‎Er‎ لـ ‎Zn²⁺/Zn (E° = −0.76)‎ عندما ‎[Zn²⁺] = 0.10 mol/dm³‎.</td><td>‎Q = 10‎؛ ‎Er = −0.76 − 0.0295 = −0.79 V‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب ‎Ecell‎ لخلية ‎Zn²⁺(0.10)/Zn‎ مع ‎Cu²⁺(1.00)/Cu‎.</td><td>‎Er(Cu) = 0.34‎؛ ‎Er(Zn) = −0.79‎؛ ‎Ecell = 0.34 − (−0.79) = 1.13 V‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 87–89 وحل ثلاث مسائل نيرنست</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة ‎Q‎ بصورة صحيحة قبل التعويض</p>"]},{"axis":"الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ونشاط 2-4","n":3,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","تأثير تراكيز الأيونات على قيم جهود الاختزال ‎(Er)‎"],["الحصة","3 من 3"],["محور الحصة","الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ونشاط 2-4"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 86–89 + كتاب التجارب ص 52 و68"],["دليل المعلم","ص 109–114"],["كتاب التجارب العملية والأنشطة","نشاط 2-4: أثر تغير التركيز على قيم جهود الاختزال ص 52؛ الاستقصاء العملي 2-3: تغير تركيز الأيونات في خلية كهروكيميائية ص 68"]],"t":["1. يخطط وينفذ تجربة لقياس أثر تغير تركيز الأيونات على جهد خلية كهروكيميائية\n2. يقارن النتائج التجريبية بالقيم المحسوبة بمعادلة نيرنست\nمخرج تعليمي آخر: يحل نشاط 2-4 «أثر تغير التركيز على قيم جهود الاختزال»","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: محاليل ‎CuSO₄‎ بتراكيز مخففة متتالية، نصف خلية ‎Zn‎، قنطرة ملحية، فولتميتر رقمي","التخفيف المتسلسل، المتغير المستقل والتابع والمضبوط، الرسم البياني ‎Ecell‎ مقابل ‎log[Cu²⁺]‎، الميل.","يسأل المعلم: «لو خففنا محلول ‎CuSO₄‎ عشر مرات، فبكم تتوقع أن يتغير جهد خلية ‎Zn/Cu‎ حسب نيرنست؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يطرح السؤال ويطلب تنبؤًا مكتوبًا\nالطالب: يحسبون التغير المتوقع ‎(≈ 0.03 V)‎\n2) (20 دقيقة: من الدقيقة 4 إلى 24)\nالمعلم: يوجه تخطيط وتنفيذ الاستقصاء العملي 2-3 (كتاب التجارب ص 68) بتخفيفات متتالية\nالطالب: يحضرون التخفيفات ويقيسون ‎Ecell‎ لكل تركيز ويسجلون\n3) (10 دقائق: من الدقيقة 24 إلى 34)\nالمعلم: يوجه رسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎ وحل نشاط 2-4 (ص 52)\nالطالب: يرسمون ويحسبون الميل ويقارنونه بـ 0.0295\n4) (6 دقائق: من الدقيقة 34 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما المتغير المستقل في هذا الاستقصاء؟\n   الإجابة النموذجية: تركيز أيونات ‎Cu²⁺‎.\n2) (المستوى المتوقع) السؤال: ما الميل المتوقع للرسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎؟\n   الإجابة النموذجية: ‎0.059/2 ≈ 0.030 V‎ لكل وحدة ‎log‎.\n3) (المستوى المتقدم) السؤال: كيف تحضر محلولًا تركيزه ‎0.10 mol/dm³‎ من محلول ‎1.0 mol/dm³‎؟\n   الإجابة النموذجية: بأخذ ‎10 cm³‎ من المحلول وإكمالها بالماء المقطر إلى ‎100 cm³‎.","1) (مستوى الدعم) السؤال: اذكر متغيرين مضبوطين.\n   الإجابة النموذجية: درجة الحرارة ونصف خلية ‎Zn (‎تركيزها ونوع القطب).\n2) (المستوى المتوقع) السؤال: لماذا يقل ‎Ecell‎ عند تخفيف محلول ‎Cu²⁺‎؟\n   الإجابة النموذجية: لأن ‎Er‎ للقطب الموجب ‎(Cu)‎ يقل مع انخفاض ‎[Cu²⁺]‎.\n3) (المستوى المتقدم) السؤال: كانت قيمة الميل التجريبي ‎0.025 V‎. قيّم النتيجة واقترح سببًا للفرق.\n   الإجابة النموذجية: قريبة من القيمة النظرية 0.0295؛ قد يعود الفرق إلى عدم دقة التخفيف أو اختلاف الحرارة عن ‎298 K‎ أو مقاومة الدائرة.","إرشاد للطالب: كتابة تقرير الاستقصاء 2-3 مع الرسم البياني وإكمال نشاط 2-4 ص 52\nإرشاد لولي الأمر: التأكد من رسم الابن البياني بمقياس مناسب وعنونة المحورين"],"h":["<ol class=\"ol\"><li>يخطط وينفذ تجربة لقياس أثر تغير تركيز الأيونات على جهد خلية كهروكيميائية</li><li>يقارن النتائج التجريبية بالقيم المحسوبة بمعادلة نيرنست</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 2-4 «أثر تغير التركيز على قيم جهود الاختزال»</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يخطط وينفذ تجربة لقياس أثر تغير تركيز الأيونات على جهد خلية كهروكيميائية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن النتائج التجريبية بالقيم المحسوبة بمعادلة نيرنست</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 2-4 «أثر تغير التركيز على قيم جهود الاختزال»</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: محاليل ‎CuSO₄‎ بتراكيز مخففة متتالية، نصف خلية ‎Zn‎، قنطرة ملحية، فولتميتر رقمي</span></div>","<p>التخفيف المتسلسل، المتغير المستقل والتابع والمضبوط، الرسم البياني ‎Ecell‎ مقابل ‎log[Cu²⁺]‎، الميل.</p>","<p>يسأل المعلم: «لو خففنا محلول ‎CuSO₄‎ عشر مرات، فبكم تتوقع أن يتغير جهد خلية ‎Zn/Cu‎ حسب نيرنست؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يطرح السؤال ويطلب تنبؤًا مكتوبًا</td><td>يحسبون التغير المتوقع ‎(≈ 0.03 V)‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–24</span><br><small>20 دقيقة</small></td><td>يوجه تخطيط وتنفيذ الاستقصاء العملي 2-3 (كتاب التجارب ص 68) بتخفيفات متتالية</td><td>يحضرون التخفيفات ويقيسون ‎Ecell‎ لكل تركيز ويسجلون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">24–34</span><br><small>10 دقائق</small></td><td>يوجه رسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎ وحل نشاط 2-4 (ص 52)</td><td>يرسمون ويحسبون الميل ويقارنونه بـ 0.0295</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">34–40</span><br><small>6 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المتغير المستقل في هذا الاستقصاء؟</td><td>تركيز أيونات ‎Cu²⁺‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الميل المتوقع للرسم ‎Ecell‎ مقابل ‎log[Cu²⁺]‎؟</td><td>‎0.059/2 ≈ 0.030 V‎ لكل وحدة ‎log‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف تحضر محلولًا تركيزه ‎0.10 mol/dm³‎ من محلول ‎1.0 mol/dm³‎؟</td><td>بأخذ ‎10 cm³‎ من المحلول وإكمالها بالماء المقطر إلى ‎100 cm³‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر متغيرين مضبوطين.</td><td>درجة الحرارة ونصف خلية ‎Zn (‎تركيزها ونوع القطب).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يقل ‎Ecell‎ عند تخفيف محلول ‎Cu²⁺‎؟</td><td>لأن ‎Er‎ للقطب الموجب ‎(Cu)‎ يقل مع انخفاض ‎[Cu²⁺]‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كانت قيمة الميل التجريبي ‎0.025 V‎. قيّم النتيجة واقترح سببًا للفرق.</td><td>قريبة من القيمة النظرية 0.0295؛ قد يعود الفرق إلى عدم دقة التخفيف أو اختلاف الحرارة عن ‎298 K‎ أو مقاومة الدائرة.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 2-3 مع الرسم البياني وإكمال نشاط 2-4 ص 52</p><p><b>إرشاد لولي الأمر:</b> التأكد من رسم الابن البياني بمقياس مناسب وعنونة المحورين</p>"]}]},{"title":"التحليل الكهربائي","sb":"ص 90–94","unit":"الوحدة 2: الكيمياء الكهربائية","periods":[{"axis":"نواتج التحليل الكهربائي للمصاهير والمحاليل المائية","n":1,"hi":[["المادة","الكيمياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الكيمياء الكهربائية"],["الدرس","التحليل الكهربائي"],["الحصة","1 من 2"],["محور الحصة","نواتج التحليل الكهربائي للمصاهير والمحاليل المائية"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 90–92"],["دليل المعلم","ص 114–117"],["كتاب التجارب العملية والأنشطة","نشاط 2-5: التحليل الكهربائي ص 54"]],"t":["1. يتنبأ بنواتج التحليل الكهربائي للمركبات الأيونية المنصهرة\n2. يكتب أنصاف معادلات نزع شحنات الأيونات عند المهبط والمصعد\nمخرج تعليمي آخر: يفسر اختلاف نواتج التحليل الكهربائي لمحلول مائي عن مصهور الملح نفسه","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: خلية تحليل كهربائي لمحلول ‎CuCl₂‎ بأقطاب كربون، مصدر تيار مستمر","التحليل الكهربائي، الإلكتروليت، المهبط (السالب)، المصعد (الموجب)، نزع الشحنة، المصهور، المحلول المائي.","يجري المعلم تحليلًا كهربائيًا لمحلول ‎CuCl₂‎ فيترسب نحاس على قطب ويتصاعد غاز عند الآخر، ويسأل: «أي القطبين ترسب عليه النحاس؟ ولماذا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يلاحظون ويتنبؤون بالغاز\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح التحليل الكهربائي للمصاهير (‎PbBr₂‎، ‎NaCl‎) ونزع الشحنات وأنصاف المعادلات\nالطالب: يكتبون أنصاف المعادلات لكل قطب\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقارن بين مصهور ‎NaCl‎ ومحلوله المائي ويقدم أمثلة للتنبؤ\nالطالب: يتنبؤون بالنواتج في مجموعات ويكتبون أنصاف المعادلات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الناتج عند المهبط في التحليل الكهربائي لمصهور ‎NaCl‎؟\n   الإجابة النموذجية: فلز الصوديوم.\n2) (المستوى المتوقع) السؤال: اكتب نصف معادلة المصعد في التحليل الكهربائي لمصهور ‎NaCl‎.\n   الإج
