ي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 3-3 (كتاب التجارب ص 79) والسؤالين 2 و3، والطلبة يحلون في أزواج (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص نمط التدرج في الألفة الإلكترونية للمجموعتين 16 و17، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ملح المالح: تكتب المجموعات معادلات التذرير والألفة الإلكترونية لتكوين أيونات ملح الطعام، وتربط ذلك باستخدام الملح في تجفيف السمك (المالح) من تراث الصيادين العمانيين (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تتغير ‎EA1‎ من الكلور إلى اليود؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تصبح أقل سالبية (أقل طردًا للحرارة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تصبح ‎EA1‎ أقل سالبية من ‎Cl‎ إلى ‎I‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن نصف القطر والحجب يزدادان فيضعف جذب النواة للإلكترون المضاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ‎EA1‎ للفلور أقل سالبية من الكلور؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لصغر حجم ذرة الفلور، فيعاني الإلكترون المضاف تنافرًا قويًا مع الإلكترونات الموجودة في الغلاف الصغير.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أي هالوجين له ‎EA1‎ الأكثر سالبية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الكلور.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا ‎EA1‎ للمجموعة 17 أكثر سالبية من المجموعة 16 في الدورة نفسها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الشحنة النووية أكبر ونصف القطر أصغر في المجموعة 17 فيكون جذب الإلكترون المضاف أقوى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> عند التعليق على قيمتين سالبتين للألفة، كيف تصوغ المقارنة بدقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تذكر أن إحداهما «أكثر طردًا للحرارة» أو «أكثر سالبية» من الأخرى، لا أنها «أكبر» أو «أصغر» فقط.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-3 ص 79 والسؤالين 2 و3<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على استخدام عبارة «أكثر طردًا للحرارة» في المقارنات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=15<\/p>"]}]}, {"title": "حلقة (دورة) بورن-هابر", "sb": "ص 116–121", "unit": "الوحدة 3: طاقة الشبكة البلورية", "periods": [{"axis": "حلقة الطاقة البسيطة وقانون هس", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "حلقة (دورة) بورن-هابر"], ["الحصة", "1 من 6"], ["محور الحصة", "حلقة الطاقة البسيطة وقانون هس"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "ص 116–117"], ["دليل المعلم", "ص 151–156"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: حلقات بورن-هابر ص 76"]], "t": ["1. يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية (15 دقيقة)\n2. يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎ (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة (10 دقائق)", "1. تطبيق: يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية\n2. تطبيق: يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎\n3. فهم (مخرج آخر): يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: آلة حاسبة علمية", "حلقة الطاقة، قانون هس، ‎ΔH°f‎، ‎ΔH1 (‎مجموع خطوات تكوين الأيونات الغازية)، المسار المباشر وغير المباشر.", "يرسم المعلم طريقين للصعود إلى قمة جبل (مباشر ومتعرج) ويسأل: «هل يختلف فرق الارتفاع بين القاعدة والقمة باختلاف الطريق؟» ليربطه بقانون هس.", "1. يقدم المعلم تشبيه الجبل، والطلبة يستنتجون أن التغير الكلي لا يعتمد على المسار (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ينفذ المعلم «حلقة بورن-هابر–حلقة طاقة بسيطة» بالشكل 3-2 (فلوريد الليثيوم) ويشرح الخطوات الأربع، والطلبة يرسمون الحلقة ويكتبون الخطوات بالترتيب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يحل المعلم مع الطلبة حساب ‎ΔH1‎ ثم ‎ΔH°latt‎ بالمثال 1 خطوة بخطوة، والطلبة يتبعون الحل ويطبقونه على بيانات ‎NaCl‎ (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما نص قانون هس؟\n• الإجابة النموذجية: التغير الكلي في المحتوى الحراري لتفاعل لا يعتمد على المسار، بل على الحالتين الابتدائية والنهائية.\n\n2. مستوى التطبيق: ما الخطوات التي يتكون منها ‎ΔH1‎ لـ ‎NaCl‎؟\n• الإجابة النموذجية: تذرير ‎Na‎، والتأين الأول لـ ‎Na‎، وتذرير ‎Cl‎، والألفة الإلكترونية الأولى لـ ‎Cl‎.\n\n3. مستوى الاستدلال: احسب ‎ΔH1‎ لـ ‎NaCl‎ إذا كانت: ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.\n• الإجابة النموذجية: ‎ΔH1 = 107 + 496 + 122 − 349 = +376 kJ/mol‎.", "1. مستوى المعرفة: اكتب العلاقة بين ‎ΔH°f‎ و‎ΔH1‎ و‎ΔH°latt‎.\n• الإجابة النموذجية: ‎ΔH°f = ΔH1 + ΔH°latt‎\n\n2. مستوى التطبيق: احسب ‎ΔH°latt‎ لـ ‎NaCl‎ إذا كانت ‎ΔH°f = −411 kJ/mol‎ و‎ΔH1 = +376 kJ/mol‎.\n• الإجابة النموذجية: ‎ΔH°latt = −411 − 376 = −787 kJ/mol‎.\n\n3. مستوى الاستدلال: لماذا يجب أن تبدأ الحلقة وتنتهي بالمواد نفسها؟\n• الإجابة النموذجية: لأن قانون هس يتطلب أن يكون مجموع التغيرات في المسار المغلق صفرًا، فنحسب المجهول من بقية الخطوات.", "إرشاد للطالب: مراجعة ص 116–117 ورسم حلقة الطاقة لـ ‎NaCl‎\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «طريقي الجبل» لقانون هس\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16"], "h": ["<ol class=\"ol\"><li>يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية (15 دقيقة)<\/li><li>يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎ (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يرسم حلقة طاقة بسيطة تربط ‎ΔH°f‎ لمركب أيوني بطاقة شبكته ومجموع خطوات تكوين الأيونات الغازية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يطبق قانون هس في حساب طاقة الشبكة: ‎ΔH°latt = ΔH°f − ΔH1‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يفسر لماذا يجب أن تكون حلقة الطاقة مغلقة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>حلقة الطاقة، قانون هس، ‎ΔH°f‎، ‎ΔH1 (‎مجموع خطوات تكوين الأيونات الغازية)، المسار المباشر وغير المباشر.<\/p>", "<p>يرسم المعلم طريقين للصعود إلى قمة جبل (مباشر ومتعرج) ويسأل: «هل يختلف فرق الارتفاع بين القاعدة والقمة باختلاف الطريق؟» ليربطه بقانون هس.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يقدم المعلم تشبيه الجبل، والطلبة يستنتجون أن التغير الكلي لا يعتمد على المسار (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «حلقة بورن-هابر–حلقة طاقة بسيطة» بالشكل 3-2 (فلوريد الليثيوم) ويشرح الخطوات الأربع، والطلبة يرسمون الحلقة ويكتبون الخطوات بالترتيب (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يحل المعلم مع الطلبة حساب ‎ΔH1‎ ثم ‎ΔH°latt‎ بالمثال 1 خطوة بخطوة، والطلبة يتبعون الحل ويطبقونه على بيانات ‎NaCl‎ (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نص قانون هس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التغير الكلي في المحتوى الحراري لتفاعل لا يعتمد على المسار، بل على الحالتين الابتدائية والنهائية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الخطوات التي يتكون منها ‎ΔH1‎ لـ ‎NaCl‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تذرير ‎Na‎، والتأين الأول لـ ‎Na‎، وتذرير ‎Cl‎، والألفة الإلكترونية الأولى لـ ‎Cl‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH1‎ لـ ‎NaCl‎ إذا كانت: ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH1 = 107 + 496 + 122 − 349 = +376 kJ/mol‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب العلاقة بين ‎ΔH°f‎ و‎ΔH1‎ و‎ΔH°latt‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°f = ΔH1 + ΔH°latt‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎ΔH°latt‎ لـ ‎NaCl‎ إذا كانت ‎ΔH°f = −411 kJ/mol‎ و‎ΔH1 = +376 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°latt = −411 − 376 = −787 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يجب أن تبدأ الحلقة وتنتهي بالمواد نفسها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن قانون هس يتطلب أن يكون مجموع التغيرات في المسار المغلق صفرًا، فنحسب المجهول من بقية الخطوات.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 116–117 ورسم حلقة الطاقة لـ ‎NaCl‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه «طريقي الجبل» لقانون هس<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16<\/p>"]}, {"axis": "حساب طاقة الشبكة البلورية بحلقة بورن-هابر لمركبات أحادية الشحنة", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "حلقة (دورة) بورن-هابر"], ["الحصة", "2 من 6"], ["محور الحصة", "حساب طاقة الشبكة البلورية بحلقة بورن-هابر لمركبات أحادية الشحنة"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "ص 117–118"], ["دليل المعلم", "ص 151–156"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: حلقات بورن-هابر ص 76"]], "t": ["1. يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1 (5 دقائق)\n2. يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر (15 دقيقة)\nمخرج تعليمي آخر: يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة (20 دقيقة)", "1. تطبيق: يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1\n2. تطبيق: يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر\n3. تقييم (مخرج آخر): يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، ورق رسم", "حلقة بورن-هابر، المستويات الطاقية، الأسهم الصاعدة (ماصة) والهابطة (طاردة)، ‎ΔH°f‎، ‎IE1‎، ‎EA1‎، ‎ΔH°at‎.", "يعرض المعلم حلقة بورن-هابر لـ ‎NaCl‎ بأسهم مخفية ويسأل: «أي الخطوات ترفعنا إلى أعلى (ماصة) وأيها تنزل بنا (طاردة)؟»", "1. يعرض المعلم الحلقة ويطرح السؤال، والطلبة يصنفون الخطوات حسب الإشارة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ينفذ المعلم «حساب طاقات الشبكة البلورية باستخدام حلقة بورن-هابر» ويرسم الحلقة كاملة لـ ‎KCl‎، والطلبة يرسمون الحلقة بمقياس تقريبي ويكتبون القيم (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل السؤال 4 (ب) ورسم حلقة لمركب آخر، والطلبة يرسمون ويحسبون ويتحققون من الإشارات (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما اتجاه سهم الألفة الإلكترونية الأولى للكلور في الحلقة؟\n• الإجابة النموذجية: هابط (طاردة للحرارة).\n\n2. مستوى التطبيق: احسب ‎ΔH°latt‎ لـ ‎KCl‎ إذا كانت: ‎ΔH°f = −437‎، ‎ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.\n• الإجابة النموذجية: ‎ΔH1 = 89 + 419 + 122 − 349 = +281‎؛ ‎ΔH°latt = −437 − 281 = −718 kJ/mol‎.\n\n3. مستوى الاستدلال: لماذا يكون سهم طاقة الشبكة هابطًا؟\n• الإجابة النموذجية: لأنها طاردة للحرارة (تكوين الشبكة من الأيونات الغازية يطلق طاقة).", "1. مستوى المعرفة: ما أول خطوة في حلقة بورن-هابر لتكوين ‎NaCl‎؟\n• الإجابة النموذجية: تذرير الصوديوم (أو تذرير الكلور).\n\n2. مستوى التطبيق: احسب ‎ΔH°latt‎ لـ ‎LiCl‎ إذا كانت ‎ΔH°f = −409‎ و‎ΔH1 = +440 kJ/mol‎.\n• الإجابة النموذجية: ‎ΔH°latt = −409 − 440 = −849 kJ/mol‎.\n\n3. مستوى الاستدلال: طالب حصل على ‎+718 kJ/mol‎ لطاقة شبكة ‎KCl‎. ما الخطأ المحتمل؟\n• الإجابة النموذجية: عكس الإشارة؛ إذ يجب أن تكون طاقة الشبكة سالبة، والأرجح أنه حسب ‎ΔH1 − ΔH°f‎ بدل ‎ΔH°f − ΔH1‎.", "إرشاد للطالب: مراجعة ص 117–118 ورسم حلقة بورن-هابر لـ ‎KCl‎\nإرشاد لولي الأمر: متابعة الابن في التحقق من إشارة الناتج النهائي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16"], "h": ["<ol class=\"ol\"><li>يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1 (5 دقائق)<\/li><li>يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يرسم حلقة بورن-هابر كاملة لمركب أيوني كاتيونه +1 وأنيونه −1<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب طاقة الشبكة البلورية من بيانات حلقة بورن-هابر<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يتحقق من صحة الإشارات واتجاهات الأسهم في الحلقة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية، ورق رسم<\/span><\/div>", "<p>حلقة بورن-هابر، المستويات الطاقية، الأسهم الصاعدة (ماصة) والهابطة (طاردة)، ‎ΔH°f‎، ‎IE1‎، ‎EA1‎، ‎ΔH°at‎.<\/p>", "<p>يعرض المعلم حلقة بورن-هابر لـ ‎NaCl‎ بأسهم مخفية ويسأل: «أي الخطوات ترفعنا إلى أعلى (ماصة) وأيها تنزل بنا (طاردة)؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الحلقة ويطرح السؤال، والطلبة يصنفون الخطوات حسب الإشارة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «حساب طاقات الشبكة البلورية باستخدام حلقة بورن-هابر» ويرسم الحلقة كاملة لـ ‎KCl‎، والطلبة يرسمون الحلقة بمقياس تقريبي ويكتبون القيم (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل السؤال 4 (ب) ورسم حلقة لمركب آخر، والطلبة يرسمون ويحسبون ويتحققون من الإشارات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما اتجاه سهم الألفة الإلكترونية الأولى للكلور في الحلقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: هابط (طاردة للحرارة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎ΔH°latt‎ لـ ‎KCl‎ إذا كانت: ‎ΔH°f = −437‎، ‎ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH1 = 89 + 419 + 122 − 349 = +281‎؛ ‎ΔH°latt = −437 − 281 = −718 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون سهم طاقة الشبكة هابطًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها طاردة للحرارة (تكوين الشبكة من الأيونات الغازية يطلق طاقة).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما أول خطوة في حلقة بورن-هابر لتكوين ‎NaCl‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تذرير الصوديوم (أو تذرير الكلور).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎ΔH°latt‎ لـ ‎LiCl‎ إذا كانت ‎ΔH°f = −409‎ و‎ΔH1 = +440 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°latt = −409 − 440 = −849 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> طالب حصل على ‎+718 kJ/mol‎ لطاقة شبكة ‎KCl‎. ما الخطأ المحتمل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عكس الإشارة؛ إذ يجب أن تكون طاقة الشبكة سالبة، والأرجح أنه حسب ‎ΔH1 − ΔH°f‎ بدل ‎ΔH°f − ΔH1‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 117–118 ورسم حلقة بورن-هابر لـ ‎KCl‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التحقق من إشارة الناتج النهائي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16<\/p>"]}, {"axis": "حلقة بورن-هابر لمركب كاتيونه ثنائي الشحنة ‎(MgCl₂)‎", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "حلقة (دورة) بورن-هابر"], ["الحصة", "3 من 6"], ["محور الحصة", "حلقة بورن-هابر لمركب كاتيونه ثنائي الشحنة ‎(MgCl₂)‎"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "ص 118–119"], ["دليل المعلم", "ص 151–156"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: حلقات بورن-هابر ص 76"]], "t": ["1. يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎ (15 دقيقة)\n2. يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة (15 دقيقة)\nمخرج تعليمي آخر: يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق (10 دقائق)", "1. تطبيق: يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎\n2. تطبيق: يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة\n3. تحليل (مخرج آخر): يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الكاتيون ثنائي الشحنة، طاقة التأين الثانية ‎IE2‎، مضاعفة ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎، صيغة المركب.", "يسأل المعلم: «في ‎MgCl₂‎ ذرة مغنيسيوم واحدة وذرتا كلور؛ فكيف تتغير خطوات الحلقة مقارنة بـ ‎NaCl‎؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون مضاعفة خطوات الكلور وإضافة ‎IE2‎ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يرسم المعلم حلقة ‎MgCl₂‎ خطوة بخطوة ويحسب ‎ΔH°latt‎، والطلبة يتبعون الرسم ويكتبون القيم (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم بيانات ‎CaCl₂‎ لحسابها في مجموعات، والطلبة يرسمون الحلقة ويحسبون ويتحققون من مضاعفة الخطوات (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: لماذا تُضاعف ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎ في حلقة ‎MgCl₂‎؟\n• الإجابة النموذجية: لأن الصيغة تحتوي أيوني ‎Cl⁻‎ فيلزم تكوين مولين من ذرات الكلور ثم من أيوناته.\n\n2. مستوى التطبيق: احسب ‎ΔH1‎ لـ ‎MgCl₂: ΔH°at(Mg) = +148‎، ‎IE1 = +736‎، ‎IE2 = +1450‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.\n• الإجابة النموذجية: ‎148 + 736 + 1450 + 2(122) + 2(−349) = +1880 kJ/mol‎.\n\n3. مستوى الاستدلال: احسب ‎ΔH°latt‎ لـ ‎MgCl₂‎ إذا كانت ‎ΔH°f = −641 kJ/mol‎.\n• الإجابة النموذجية: ‎−641 − 1880 = −2521 kJ/mol‎.", "1. مستوى المعرفة: ما الخطوة الإضافية في حلقة ‎MgCl₂‎ مقارنة بـ ‎NaCl‎ للفلز؟\n• الإجابة النموذجية: طاقة التأين الثانية ‎IE2‎ للمغنيسيوم.\n\n2. مستوى التطبيق: لماذا طاقة شبكة ‎MgCl₂‎ أكبر مقدارًا من ‎NaCl‎؟\n• الإجابة النموذجية: لأن شحنة ‎Mg²⁺‎ ضعف شحنة ‎Na⁺‎ وحجمه أصغر فيكون الجذب أقوى.\n\n3. مستوى الاستدلال: احسب ‎ΔH°latt‎ لـ ‎CaCl₂: ΔH°f = −796‎، ‎ΔH°at(Ca) = +178‎، ‎IE1 = +590‎، ‎IE2 = +1145‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.\n• الإجابة النموذجية: ‎ΔH1 = 178 + 590 + 1145 + 244 − 698 = +1459‎؛ ‎ΔH°latt = −796 − 1459 = −2255 kJ/mol‎.", "إرشاد للطالب: مراجعة ص 118–119 وحل مسألة ‎CaCl₂‎\nإرشاد لولي الأمر: متابعة الابن في تذكر مضاعفة خطوات الأنيون حسب الصيغة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16"], "h": ["<ol class=\"ol\"><li>يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎ (15 دقيقة)<\/li><li>يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يرسم حلقة بورن-هابر لمركب كاتيونه +2 مثل ‎MgCl₂‎ متضمنة ‎IE1‎ و‎IE2‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب طاقة الشبكة البلورية لـ ‎MgCl₂‎ مع مضاعفة خطوات الكلور بحسب الصيغة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن طاقة شبكة ‎MgCl₂‎ بطاقة شبكة ‎NaCl‎ ويفسر الفرق<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الكاتيون ثنائي الشحنة، طاقة التأين الثانية ‎IE2‎، مضاعفة ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎، صيغة المركب.<\/p>", "<p>يسأل المعلم: «في ‎MgCl₂‎ ذرة مغنيسيوم واحدة وذرتا كلور؛ فكيف تتغير خطوات الحلقة مقارنة بـ ‎NaCl‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون مضاعفة خطوات الكلور وإضافة ‎IE2‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يرسم المعلم حلقة ‎MgCl₂‎ خطوة بخطوة ويحسب ‎ΔH°latt‎، والطلبة يتبعون الرسم ويكتبون القيم (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم بيانات ‎CaCl₂‎ لحسابها في مجموعات، والطلبة يرسمون الحلقة ويحسبون ويتحققون من مضاعفة الخطوات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تُضاعف ‎ΔH°at(Cl)‎ و‎EA1(Cl)‎ في حلقة ‎MgCl₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الصيغة تحتوي أيوني ‎Cl⁻‎ فيلزم تكوين مولين من ذرات الكلور ثم من أيوناته.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎ΔH1‎ لـ ‎MgCl₂: ΔH°at(Mg) = +148‎، ‎IE1 = +736‎، ‎IE2 = +1450‎، ‎ΔH°at(Cl) = +122‎، ‎EA1(Cl) = −349‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎148 + 736 + 1450 + 2(122) + 2(−349) = +1880 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH°latt‎ لـ ‎MgCl₂‎ إذا كانت ‎ΔH°f = −641 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎−641 − 1880 = −2521 kJ/mol‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطوة الإضافية في حلقة ‎MgCl₂‎ مقارنة بـ ‎NaCl‎ للفلز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: طاقة التأين الثانية ‎IE2‎ للمغنيسيوم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا طاقة شبكة ‎MgCl₂‎ أكبر مقدارًا من ‎NaCl‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن شحنة ‎Mg²⁺‎ ضعف شحنة ‎Na⁺‎ وحجمه أصغر فيكون الجذب أقوى.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH°latt‎ لـ ‎CaCl₂: ΔH°f = −796‎، ‎ΔH°at(Ca) = +178‎، ‎IE1 = +590‎، ‎IE2 = +1145‎، ‎ΔH°at(Cl) = +122‎، ‎EA1 = −349‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH1 = 178 + 590 + 1145 + 244 − 698 = +1459‎؛ ‎ΔH°latt = −796 − 1459 = −2255 kJ/mol‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 118–119 وحل مسألة ‎CaCl₂‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في تذكر مضاعفة خطوات الأنيون حسب الصيغة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16<\/p>"]}, {"axis": "حلقة بورن-هابر لمركب أنيونه ثنائي الشحنة ‎(MgO)‎ والألفة الثانية", "n": 4, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "حلقة (دورة) بورن-هابر"], ["الحصة", "4 من 6"], ["محور الحصة", "حلقة بورن-هابر لمركب أنيونه ثنائي الشحنة ‎(MgO)‎ والألفة الثانية"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "ص 119–121"], ["دليل المعلم", "ص 151–156"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: حلقات بورن-هابر ص 76"]], "t": ["1. يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎ (5 دقائق)\n2. يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة (25 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة (10 دقائق)", "1. تطبيق: يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎\n2. تطبيق: يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة\n3. تحليل (مخرج آخر): يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "الأنيون ثنائي الشحنة، ‎EA2‎ الماصة، تذرير الأكسجين ‎(½O₂)‎، ‎MgO‎، ‎Na₂O‎، تعويض طاقة الشبكة الكبيرة.", "يسأل المعلم: «تكوين ‎O²⁻‎ من ‎O‎ يحتاج طاقة ‎(+657 kJ/mol)‎، فلماذا يتكون أكسيد المغنيسيوم بسهولة عند احتراق الشريط؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون أن طاقة الشبكة الكبيرة تعوض ذلك (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يرسم المعلم حلقة ‎MgO‎ بخطواتها ويحسب ‎ΔH°latt‎، والطلبة يتبعون ويكتبون القيم (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم بيانات ‎Na₂O‎ لحساب طاقة شبكتها في مجموعات، والطلبة يرسمون ويحسبون مع مضاعفة خطوات الصوديوم (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما الخطوتان الخاصتان بالأكسجين بعد تذريره؟\n• الإجابة النموذجية: ‎EA1 (‎طاردة) ثم ‎EA2 (‎ماصة).\n\n2. مستوى التطبيق: احسب ‎ΔH1‎ لـ ‎MgO: ΔH°at(Mg) = +148‎، ‎IE1+IE2 = +2186‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.\n• الإجابة النموذجية: ‎148 + 2186 + 249 − 141 + 798 = +3240 kJ/mol‎.\n\n3. مستوى الاستدلال: احسب ‎ΔH°latt‎ لـ ‎MgO‎ إذا كانت ‎ΔH°f = −602 kJ/mol‎.\n• الإجابة النموذجية: ‎−602 − 3240 = −3842 kJ/mol‎.", "1. مستوى المعرفة: ما سبب تكون ‎MgO‎ رغم أن ‎EA2‎ ماصة؟\n• الإجابة النموذجية: لأن طاقة الشبكة كبيرة جدًا (طاردة) فتعوض الخطوات الماصة ويكون ‎ΔH°f‎ سالبًا.\n\n2. مستوى التطبيق: في حلقة ‎Na₂O‎، ما الخطوات التي تُضاعف؟\n• الإجابة النموذجية: تذرير ‎Na‎ و‎IE1‎ لـ ‎Na‎.\n\n3. مستوى الاستدلال: احسب ‎ΔH°latt‎ لـ ‎Na₂O: ΔH°f = −414‎، ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.\n• الإجابة النموذجية: ‎ΔH1 = 2(107) + 2(496) + 249 − 141 + 798 = +2112‎؛ ‎ΔH°latt = −414 − 2112 = −2526 kJ/mol‎.", "إرشاد للطالب: مراجعة ص 119–121 وحل مسألة ‎Na₂O‎\nإرشاد لولي الأمر: سؤال الابن عن سبب تكون الأكاسيد رغم أن ‎EA2‎ ماصة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16"], "h": ["<ol class=\"ol\"><li>يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎ (5 دقائق)<\/li><li>يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة (25 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يرسم حلقة بورن-هابر لمركب أيوني أنيونه −2 متضمنة ‎EA1‎ و‎EA2‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب طاقة الشبكة البلورية لـ ‎MgO‎ أو ‎Na₂O‎ من بيانات معطاة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر لماذا يتكون ‎MgO‎ رغم أن تكوين ‎O²⁻(g)‎ ماص للحرارة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>الأنيون .<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎148 + 2186 + 249 − 141 + 798 = +3240 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH°latt‎ لـ ‎MgO‎ إذا كانت ‎ΔH°f = −602 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎−602 − 3240 = −3842 kJ/mol‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما سبب تكون ‎MgO‎ رغم أن ‎EA2‎ ماصة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن طاقة الشبكة كبيرة جدًا (طاردة) فتعوض الخطوات الماصة ويكون ‎ΔH°f‎ سالبًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> في حلقة ‎Na₂O‎، ما الخطوات التي تُضاعف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تذرير ‎Na‎ و‎IE1‎ لـ ‎Na‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH°latt‎ لـ ‎Na₂O: ΔH°f = −414‎، ‎ΔH°at(Na) = +107‎، ‎IE1(Na) = +496‎، ‎ΔH°at(O) = +249‎، ‎EA1 = −141‎، ‎EA2 = +798‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH1 = 2(107) + 2(496) + 249 − 141 + 798 = +2112‎؛ ‎ΔH°latt = −414 − 2112 = −2526 kJ/mol‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 119–121 وحل مسألة ‎Na₂O‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن سبب تكون الأكاسيد رغم أن ‎EA2‎ ماصة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16<\/p>"]}, {"axis": "نشاط 3-1 والأسئلة 4–8", "n": 5, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "حلقة (دورة) بورن-هابر"], ["الحصة", "5 من 6"], ["محور الحصة", "نشاط 3-1 والأسئلة 4–8"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "ص 116–121 + كتاب التجارب ص 76"], ["دليل المعلم", "ص 151–156"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: حلقات بورن-هابر ص 76"]], "t": ["1. يحل نشاط 3-1 «حلقات بورن-هابر» (15 دقيقة)\n2. يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات (10 دقائق)\nمخرج تعليمي آخر: يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات (15 دقيقة)", "1. تطبيق: يحل نشاط 3-1 «حلقات بورن-هابر»\n2. تطبيق: يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات\n3. تقييم (مخرج آخر): يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات", "- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التقييم التبادلي", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "الأخطاء الشائعة: نسيان المضاعفة، عكس الإشارة، استخدام ‎IE‎ بدل ‎EA‎، الخلط بين ‎ΔH°f‎ و‎ΔH°latt‎.", "يعرض المعلم ثلاثة حلول لمسألة واحدة فيها أخطاء مختلفة ويطلب من المجموعات تحديد الخطأ في كل حل خلال ثلاث دقائق.", "1. يعرض المعلم الحلول، والطلبة يحددون الأخطاء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يوجه المعلم حل نشاط 3-1 (كتاب التجارب ص 76)، والطلبة يحلون فرديًا (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يوجه المعلم حل الأسئلة 4–8 مع تقييم تبادلي، والطلبة يتبادلون الحلول ويقيّمونها (12 دقيقة)\nالاستراتيجيات: التقييم التبادلي.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن نشاط 3-1 والأسئلة 4–8، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم:\n1. مستوى المعرفة: ما الخطأ في استخدام ‎ΔH°at(Cl)‎ مرة واحدة لـ ‎CaCl₂‎؟\n• الإجابة النموذجية: يجب مضاعفتها لأن الصيغة تحتوي ذرتي كلور.\n\n2. مستوى التطبيق: ما الفرق بين ‎ΔH°f‎ و‎ΔH°latt‎؟\n• الإجابة النموذجية: ‎ΔH°f‎ تكوين مول من المركب من عناصره في حالتها القياسية، و‎ΔH°latt‎ تكوينه من أيوناته الغازية.\n\n3. مستوى الاستدلال: كيف تتحقق من صحة ناتج طاقة الشبكة؟\n• الإجابة النموذجية: بأن تكون سالبة وبمقدار معقول مقارنة بمركبات مشابهة.", "1. مستوى المعرفة: احسب ‎ΔH°latt‎ لـ ‎NaBr: ΔH°f = −361‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(Br) = +112‎، ‎EA1(Br) = −325‎.\n• الإجابة النموذجية: ‎ΔH1 = 390‎؛ ‎ΔH°latt = −361 − 390 = −751 kJ/mol‎.\n\n2. مستوى التطبيق: لماذا طاقة شبكة ‎NaBr‎ أقل مقدارًا من ‎NaCl (−787)‎؟\n• الإجابة النموذجية: لأن ‎Br⁻‎ أكبر حجمًا من ‎Cl⁻‎ فيضعف الجذب.\n\n3. مستوى الاستدلال: قيّم حل زميلك لمسألة ‎Na₂O‎ واذكر خطأ شائعًا تتوقع وجوده.\n• الإجابة النموذجية: تقييم يذكر مثلًا نسيان مضاعفة ‎IE1‎ لـ ‎Na‎ أو إهمال ‎EA2‎ أو إشارتها.", "إرشاد للطالب: إكمال نشاط 3-1 ص 76 والأسئلة 4–8\nإرشاد لولي الأمر: متابعة الابن في قائمة الأخطاء الشائعة وتجنبها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16"], "h": ["<ol class=\"ol\"><li>يحل نشاط 3-1 «حلقات بورن-هابر» (15 دقيقة)<\/li><li>يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحل نشاط 3-1 «حلقات بورن-هابر»<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل الأسئلة 4–8 في كتاب الطالب في رسم الحلقات والحسابات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم حلول زملائه ويحدد الأخطاء الشائعة في الإشارات والمضاعفات<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التقييم التبادلي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الأخطاء الشائعة: نسيان المضاعفة، عكس الإشارة، استخدام ‎IE‎ بدل ‎EA‎، الخلط بين ‎ΔH°f‎ و‎ΔH°latt‎.<\/p>", "<p>يعرض المعلم ثلاثة حلول لمسألة واحدة فيها أخطاء مختلفة ويطلب من المجموعات تحديد الخطأ في كل حل خلال ثلاث دقائق.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الحلول، والطلبة يحددون الأخطاء (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 3-1 (كتاب التجارب ص 76)، والطلبة يحلون فرديًا (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل الأسئلة 4–8 مع تقييم تبادلي، والطلبة يتبادلون الحلول ويقيّمونها (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التقييم التبادلي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> صح أم خطأ: يقرأ المعلم عبارات قصيرة عن نشاط 3-1 والأسئلة 4–8، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطأ في استخدام ‎ΔH°at(Cl)‎ مرة واحدة لـ ‎CaCl₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يجب مضاعفتها لأن الصيغة تحتوي ذرتي كلور.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الفرق بين ‎ΔH°f‎ و‎ΔH°latt‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°f‎ تكوين مول من المركب من عناصره في حالتها القياسية، و‎ΔH°latt‎ تكوينه من أيوناته الغازية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تتحقق من صحة ناتج طاقة الشبكة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بأن تكون سالبة وبمقدار معقول مقارنة بمركبات مشابهة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب ‎ΔH°latt‎ لـ ‎NaBr: ΔH°f = −361‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(Br) = +112‎، ‎EA1(Br) = −325‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH1 = 390‎؛ ‎ΔH°latt = −361 − 390 = −751 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا طاقة شبكة ‎NaBr‎ أقل مقدارًا من ‎NaCl (−787)‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎Br⁻‎ أكبر حجمًا من ‎Cl⁻‎ فيضعف الجذب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم حل زميلك لمسألة ‎Na₂O‎ واذكر خطأ شائعًا تتوقع وجوده.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقييم يذكر مثلًا نسيان مضاعفة ‎IE1‎ لـ ‎Na‎ أو إهمال ‎EA2‎ أو إشارتها.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-1 ص 76 والأسئلة 4–8<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في قائمة الأخطاء الشائعة وتجنبها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16<\/p>"]}, {"axis": "مسائل متقدمة: حساب قيمة مجهولة في الحلقة", "n": 6, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "حلقة (دورة) بورن-هابر"], ["الحصة", "6 من 6"], ["محور الحصة", "مسائل متقدمة: حساب قيمة مجهولة في الحلقة"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "ص 116–121"], ["دليل المعلم", "ص 151–156"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-1: حلقات بورن-هابر ص 76"]], "t": ["1. يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎) (20 دقيقة)\n2. يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎ (5 دقائق)\nمخرج تعليمي آخر: يصمم مسألة عكسية على حلقة بورن-هابر مع حلها (15 دقيقة)", "1. تحليل: يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎)\n2. تقييم: يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎\n3. إبداع (مخرج آخر): يصمم مسألة عكسية على حلقة بورن-هابر مع حلها", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: آلة حاسبة علمية", "إعادة ترتيب علاقة هس، القيمة المجهولة، المركبات الافتراضية، ثبات المركب، ‎ΔH°f‎ الموجبة.", "يسأل المعلم: «لماذا لا يوجد مركب ‎NaCl₂‎ مع أن ‎Mg‎ يكوّن ‎MgCl₂‎؟ هل يمكن لحلقة بورن-هابر أن تجيب؟»", "1. يطرح المعلم السؤال، والطلبة يتوقعون أثر ‎IE2‎ الكبيرة جدًا للصوديوم (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل المعلم مثالًا لحساب ‎EA1‎ مجهولة ومثالًا لحساب ‎ΔH°f‎ لمركب افتراضي، والطلبة يتبعون إعادة ترتيب العلاقة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يكلّف المجموعات بتصميم مسألة عكسية وتبادلها، والطلبة يصممون ويحلون مسائل زملائهم (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن مسائل متقدمة: حساب قيمة مجهولة في الحلقة، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – طريقان إلى نزوى: تشبّه المجموعات حلقة بورن–هابر برحلتين من مسقط إلى نزوى: طريق مباشر وآخر بمحطات، والتغيّر الكلي واحد، ثم ترسم الحلقة لتكوين NaCl بالخطوات الصحيحة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: كيف تحسب ‎EA1‎ من الحلقة إذا عُلمت بقية القيم؟\n• الإجابة النموذجية: ‎EA1 = ΔH°f − (ΔH°latt +‎ بقية خطوات ‎ΔH1‎ المعلومة).\n\n2. مستوى التطبيق: احسب ‎EA1‎ لعنصر ‎X‎ إذا كانت: ‎ΔH°f(NaX) = −411‎، ‎ΔH°latt = −787‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(X) = +122‎.\n• الإجابة النموذجية: ‎−411 = 107 + 496 + 122 + EA1 − 787 ← EA1 = −349 kJ/mol‎.\n\n3. مستوى الاستدلال: لماذا لا يتكون ‎NaCl₂‎؟\n• الإجابة النموذجية: لأن ‎IE2‎ للصوديوم كبيرة جدًا (نزع إلكترون من غلاف داخلي) فلا تعوضها طاقة الشبكة، فتكون ‎ΔH°f‎ موجبة كبيرة.", "1. مستوى المعرفة: ماذا تعني ‎ΔH°f‎ موجبة كبيرة لمركب افتراضي؟\n• الإجابة النموذجية: أنه غير ثابت طاقيًا ولا يتكون عمليًا.\n\n2. مستوى التطبيق: احسب ‎ΔH°f‎ لـ ‎KBr: ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Br) = +112‎، ‎EA1 = −325‎، ‎ΔH°latt = −679‎.\n• الإجابة النموذجية: ‎ΔH°f = 89 + 419 + 112 − 325 − 679 = −384 kJ/mol‎.\n\n3. مستوى الاستدلال: صمم مسألة لحساب ‎IE1‎ مجهولة لفلز مع حلها.\n• الإجابة النموذجية: مسألة تعطي ‎ΔH°f‎ و‎ΔH°latt‎ و‎ΔH°at‎ للعنصرين و‎EA1‎، والحل: ‎IE1 = ΔH°f − (‎المجموع المعلوم).", "إرشاد للطالب: حل المسائل العكسية الثلاث ومراجعة جميع حلقات الوحدة\nإرشاد لولي الأمر: تشجيع الابن على مراجعة المسألة التي صممها زميله وحلها\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16"], "h": ["<ol class=\"ol\"><li>يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎) (20 دقيقة)<\/li><li>يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎ (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم مسألة عكسية على حلقة بورن-هابر مع حلها (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يحسب قيمة مجهولة غير طاقة الشبكة في حلقة بورن-هابر (مثل ‎EA1‎ أو ‎IE‎ أو ‎ΔH°f‎)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تقييم:<\/b> يستخدم طاقة الشبكة لتفسير ثبات مركبات أيونية افتراضية مثل ‎NaCl₂‎ أو ‎MgCl‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يصمم مسألة عكسية على حلقة بورن-هابر مع حلها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>إعادة ترتيب علاقة هس، القيمة المجهولة، المركبات الافتراضية، ثبات المركب، ‎ΔH°f‎ الموجبة.<\/p>", "<p>يسأل المعلم: «لماذا لا يوجد مركب ‎NaCl₂‎ مع أن ‎Mg‎ يكوّن ‎MgCl₂‎؟ هل يمكن لحلقة بورن-هابر أن تجيب؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يتوقعون أثر ‎IE2‎ الكبيرة جدًا للصوديوم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل المعلم مثالًا لحساب ‎EA1‎ مجهولة ومثالًا لحساب ‎ΔH°f‎ لمركب افتراضي، والطلبة يتبعون إعادة ترتيب العلاقة (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلّف المجموعات بتصميم مسألة عكسية وتبادلها، والطلبة يصممون ويحلون مسائل زملائهم (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> أكمل الفكرة: يبدأ المعلم جملة عن مسائل متقدمة: حساب قيمة مجهولة في الحلقة، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الحوار والمناقشة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – طريقان إلى نزوى: تشبّه المجموعات حلقة بورن–هابر برحلتين من مسقط إلى نزوى: طريق مباشر وآخر بمحطات، والتغيّر الكلي واحد، ثم ترسم الحلقة لتكوين NaCl بالخطوات الصحيحة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تحسب ‎EA1‎ من الحلقة إذا عُلمت بقية القيم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎EA1 = ΔH°f − (ΔH°latt +‎ بقية خطوات ‎ΔH1‎ المعلومة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎EA1‎ لعنصر ‎X‎ إذا كانت: ‎ΔH°f(NaX) = −411‎، ‎ΔH°latt = −787‎، ‎ΔH°at(Na) = +107‎، ‎IE1 = +496‎، ‎ΔH°at(X) = +122‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎−411 = 107 + 496 + 122 + EA1 − 787 ← EA1 = −349 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يتكون ‎NaCl₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎IE2‎ للصوديوم كبيرة جدًا (نزع إلكترون من غلاف داخلي) فلا تعوضها طاقة الشبكة، فتكون ‎ΔH°f‎ موجبة كبيرة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا تعني ‎ΔH°f‎ موجبة كبيرة لمركب افتراضي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أنه غير ثابت طاقيًا ولا يتكون عمليًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎ΔH°f‎ لـ ‎KBr: ΔH°at(K) = +89‎، ‎IE1 = +419‎، ‎ΔH°at(Br) = +112‎، ‎EA1 = −325‎، ‎ΔH°latt = −679‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°f = 89 + 419 + 112 − 325 − 679 = −384 kJ/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صمم مسألة لحساب ‎IE1‎ مجهولة لفلز مع حلها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مسألة تعطي ‎ΔH°f‎ و‎ΔH°latt‎ و‎ΔH°at‎ للعنصرين و‎EA1‎، والحل: ‎IE1 = ΔH°f − (‎المجموع المعلوم).<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل المسائل العكسية الثلاث ومراجعة جميع حلقات الوحدة<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على مراجعة المسألة التي صممها زميله وحلها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=16<\/p>"]}]}, {"title": "التغيرات في المحتوى الحراري للمحاليل", "sb": "ص 122–135", "unit": "الوحدة 3: طاقة الشبكة البلورية", "periods": [{"axis": "المحتوى الحراري للذوبان والتميه وحلقة الطاقة", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "التغيرات في المحتوى الحراري للمحاليل"], ["الحصة", "1 من 2"], ["محور الحصة", "المحتوى الحراري للذوبان والتميه وحلقة الطاقة"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "ص 122–125"], ["دليل المعلم", "ص 156–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التغير في المحتوى الحراري للمحاليل ص 78؛ الاستقصاء العملي 3-1: التغير في المحتوى الحراري لذوبان الكلوريدات ص 82"]], "t": ["1. يعرّف التغير في المحتوى الحراري للذوبان ‎ΔH°sol‎ والتغير في المحتوى الحراري للتميه ‎ΔH°hyd‎ ويستخدمهما (15 دقيقة)\n2. يرسم حلقة طاقة تربط ‎ΔH°sol‎ و‎ΔH°latt‎ ومجموع ‎ΔH°hyd‎ للأيونات ويستخدمها في الحساب (5 دقائق)\nمخرج تعليمي آخر: يشرح التميه بتكوين روابط أيون–ثنائي القطب بين الأيونات وجزيئات الماء (20 دقيقة)", "1. تذكر: يعرّف التغير في المحتوى الحراري للذوبان ‎ΔH°sol‎ والتغير في المحتوى الحراري للتميه ‎ΔH°hyd‎ ويستخدمهما\n2. تطبيق: يرسم حلقة طاقة تربط ‎ΔH°sol‎ و‎ΔH°latt‎ ومجموع ‎ΔH°hyd‎ للأيونات ويستخدمها في الحساب\n3. فهم (مخرج آخر): يشرح التميه بتكوين روابط أيون–ثنائي القطب بين الأيونات وجزيئات الماء", "- التعلم بالاكتشاف\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كلوريد الأمونيوم وكلوريد الكالسيوم اللامائي وماء وميزان حرارة للعرض", "الذوبان، ‎ΔH°sol‎، التميه، ‎ΔH°hyd‎، روابط أيون–ثنائي القطب، المحلول اللانهائي التخفيف، ‎ΔH°sol = −ΔH°latt + ΣΔH°hyd‎.", "يذيب المعلم كلوريد الأمونيوم في ماء فتنخفض الحرارة، ثم كلوريد الكالسيوم اللامائي فترتفع، ويسأل: «كلاهما ملح يذوب؛ فلماذا يبرد أحدهما ويسخن الآخر؟»", "1. ينفذ المعلم العرض ويطرح السؤال، والطلبة يقترحون تنافس طاقتين متعاكستين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «التغير في المحتوى الحراري للذوبان والتغير في المحتوى الحراري للتميه» ويرسم الحلقة، والطلبة يرسمون تميه الكاتيونات والأنيونات ويكتبون العلاقة (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يقدم المعلم مسائل حساب ‎ΔH°sol‎ من البيانات، والطلبة يحسبون في أزواج ويتنبؤون بالذوبان الماص أو الطارد (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف ‎ΔH°hyd‎.\n• الإجابة النموذجية: التغير في المحتوى الحراري عند ذوبان مول من الأيونات الغازية في الماء لتكوين محلول لانهائي التخفيف.\n\n2. مستوى التطبيق: اكتب العلاقة بين ‎ΔH°sol‎ و‎ΔH°latt‎ و‎ΔH°hyd‎.\n• الإجابة النموذجية: ‎ΔH°sol = −ΔH°latt + ΣΔH°hyd‎\n\n3. مستوى الاستدلال: احسب ‎ΔH°sol‎ لمركب ‎XY‎ إذا كانت ‎ΔH°latt = −700‎ وΣ‎ΔH°hyd = −690 kJ/mol‎.\n• الإجابة النموذجية: ‎ΔH°sol = 700 − 690 = +10 kJ/mol‎.", "1. مستوى المعرفة: هل التميه ماص أم طارد للحرارة؟\n• الإجابة النموذجية: طارد للحرارة.\n\n2. مستوى التطبيق: صف تميه أيون ‎Na⁺‎.\n• الإجابة النموذجية: تحيط جزيئات الماء بالأيون موجهة ذرات الأكسجين (الطرف السالب الجزئي) نحوه بروابط أيون–ثنائي القطب.\n\n3. مستوى الاستدلال: احسب ‎ΔH°sol‎ لملح إذا كانت ‎ΔH°latt = −850‎ و‎ΔH°hyd‎ للكاتيون = −520 وللأنيون = ‎−364 kJ/mol‎.\n• الإجابة النموذجية: Σ‎ΔH°hyd = −884‎؛ ‎ΔH°sol = 850 − 884 = −34 kJ/mol‎.", "إرشاد للطالب: مراجعة ص 122–125 ورسم حلقة الذوبان\nإرشاد لولي الأمر: يمكن للا −690 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ΔH°sol = 700 − 690 = +10 kJ/mol‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> هل التميه ماص أم طارد للحرارة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: طارد للحرارة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صف تميه أيون ‎Na⁺‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تحيط جزيئات الماء بالأيون موجهة ذرات الأكسجين (الطرف السالب الجزئي) نحوه بروابط أيون–ثنائي القطب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> احسب ‎ΔH°sol‎ لملح إذا كانت ‎ΔH°latt = −850‎ و‎ΔH°hyd‎ للكاتيون = −520 وللأنيون = ‎−364 kJ/mol‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: Σ‎ΔH°hyd = −884‎؛ ‎ΔH°sol = 850 − 884 = −34 kJ/mol‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 122–125 ورسم حلقة الذوبان<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن للابن تجربة إذابة ملح الطعام في الماء وملاحظة التغير الطفيف في الحرارة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=17<\/p>"]}, {"axis": "لماذا تذوب بعض المواد الأيونية؟ أثر الحجم والشحنة على التميه ومراجعة الوحدة", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: طاقة الشبكة البلورية"], ["الدرس", "التغيرات في المحتوى الحراري للمحاليل"], ["الحصة", "2 من 2"], ["محور الحصة", "لماذا تذوب بعض المواد الأيونية؟ أثر الحجم والشحنة على التميه ومراجعة الوحدة"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "ص 125–135 + كتاب التجارب ص 78 و82"], ["دليل المعلم", "ص 156–160"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: التغير في المحتوى الحراري للمحاليل ص 78؛ الاستقصاء العملي 3-1: التغير في المحتوى الحراري لذوبان الكلوريدات ص 82"]], "t": ["1. يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه (15 دقيقة)\n2. يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1 (15 دقيقة)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي (10 دقائق)", "1. فهم: يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه\n2. تحليل: يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1\n3. تقييم (مخرج آخر): يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "كثافة الشحنة، تميه ‎Mg²⁺‎ مقابل ‎Na⁺‎، الذوبانية، التوازن بين طاقة الشبكة والتميه، ملخص الوحدة.", "يسأل المعلم: «لماذا يذوب ‎NaCl‎ بسهولة في الماء بينما لا يذوب ‎AgCl‎ تقريبًا؟» ويعرض جدول قيم ‎ΔH°hyd‎ لعدة أيونات.", "1. يطرح المعلم السؤال ويعرض الجدول، والطلبة يلاحظون علاقة الحجم والشحنة بقيمة التميه (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ينفذ المعلم «لماذا تذوب بعض المواد الصلبة الأيونية في الماء؟» ويشرح أثر الحجم والشحنة، والطلبة يرتبون أيونات حسب مقدار التميه ويفسرون (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوجه المعلم حل نشاط 3-2 (ص 78) وتحليل بيانات الاستقصاء 3-1 (ص 82) وأسئلة مختارة من نهاية الوحدة (ص 129–135)، والطلبة يحلون في مجموعات ويعرضون (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «أيهما أكثر طردًا للحرارة في التميه: ‎Mg²⁺‎ أم ‎Na⁺‎؟ ولماذا»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – قهوة الضيافة: يفسّر كل زوج ذوبان السكر في الماء بموازنة طاقة الشبكة وطاقة التميّه، ثم يربطان ذلك بإعداد القهوة والمشروبات في الضيافة العمانية ويشاركان الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم:\n1. مستوى المعرفة: أيهما أكثر طردًا للحرارة في التميه: ‎Mg²⁺‎ أم ‎Na⁺‎؟ ولماذا؟\n• الإجابة النموذجية: ‎Mg²⁺‎ لأنه أصغر وأكبر شحنة فيجذب جزيئات الماء بقوة أكبر.\n\n2. مستوى التطبيق: رتب حسب مقدار ‎ΔH°hyd: Li⁺‎، ‎Na⁺‎، ‎K⁺‎.\n• الإجابة النموذجية: ‎Li⁺ > Na⁺ > K⁺‎.\n\n3. مستوى الاستدلال: كيف تؤثر الشحنة الأيونية على ‎ΔH°hyd‎؟\n• الإجابة النموذجية: كلما زادت الشحنة زاد مقدار ‎ΔH°hyd (‎أكثر طردًا للحرارة).", "1. مستوى المعرفة: ما العاملان المؤثران في مقدار ‎ΔH°hyd‎؟\n• الإجابة النموذجية: نصف القطر الأيوني والشحنة الأيونية.\n\n2. مستوى التطبيق: لماذا لا تكفي إشارة ‎ΔH°sol‎ وحدها للحكم على الذوبان؟\n• الإجابة النموذجية: لأن بعض المواد تذوب رغم أن ذوبانها ماص للحرارة؛ فعوامل أخرى غير المحتوى الحراري تؤثر في الذوبان.\n\n3. مستوى الاستدلال: قيّم تعلمك في الوحدة الثالثة: موضوع أتقنته، وآخر تحتاج إلى مراجعته، وخطة لذلك.\n• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.", "إرشاد للطالب: إكمال نشاط 3-2 ص 78 وتقرير الاستقصاء 3-1 ومراجعة ملخص الوحدة ص 128\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=17"], "h": ["<ol class=\"ol\"><li>يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه (15 دقيقة)<\/li><li>يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1 (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح نوعيًا تأثير نصف القطر الأيوني والشحنة الأيونية على مقدار المحتوى الحراري للتميه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يحل نشاط 3-2 «التغير في المحتوى الحراري للمحاليل» ويحلل نتائج الاستقصاء العملي 3-1<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8 ل المعلم نقاطه على السبورة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – قهوة الضيافة: يفسّر كل زوج ذوبان السكر في الماء بموازنة طاقة الشبكة وطاقة التميّه، ثم يربطان ذلك بإعداد القهوة والمشروبات في الضيافة العمانية ويشاركان الصف (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: فكر – زاوج – شارك.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أيهما أكثر طردًا للحرارة في التميه: ‎Mg²⁺‎ أم ‎Na⁺‎؟ ولماذا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Mg²⁺‎ لأنه أصغر وأكبر شحنة فيجذب جزيئات الماء بقوة أكبر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> رتب حسب مقدار ‎ΔH°hyd: Li⁺‎، ‎Na⁺‎، ‎K⁺‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Li⁺ &gt; Na⁺ &gt; K⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف تؤثر الشحنة الأيونية على ‎ΔH°hyd‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كلما زادت الشحنة زاد مقدار ‎ΔH°hyd (‎أكثر طردًا للحرارة).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما العاملان المؤثران في مقدار ‎ΔH°hyd‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نصف القطر الأيوني والشحنة الأيونية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا تكفي إشارة ‎ΔH°sol‎ وحدها للحكم على الذوبان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن بعض المواد تذوب رغم أن ذوبانها ماص للحرارة؛ فعوامل أخرى غير المحتوى الحراري تؤثر في الذوبان.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم تعلمك في الوحدة الثالثة: موضوع أتقنته، وآخر تحتاج إلى مراجعته، وخطة لذلك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-2 ص 78 وتقرير الاستقصاء 3-1 ومراجعة ملخص الوحدة ص 128<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي للوحدة الثالثة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=17<\/p>"]}]}, {"title": "السلسلة المتجانسة للكحولات", "sb": "ص 137–140", "unit": "الوحدة 4: مشتقات الهيدروكربونات (1)", "periods": [{"axis": "تسمية الكحولات وتصنيفها إلى أولية وثانوية وثالثية", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلة المتجانسة للكحولات"], ["الحصة", "1 من 2"], ["محور الحصة", "تسمية الكحولات وتصنيفها إلى أولية وثانوية وثالثية"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "ص 137–139"], ["دليل المعلم", "ص 175–178"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: تصنيف الكحولات ص 91"]], "t": ["1. يسمي الكحولات حتى عشر ذرات كربون وفق نظام ‎IUPAC‎ ويكتب صيغها البنائية والهيكلية (10 دقائق)\n2. يصنف الكحولات إلى أولية وثانوية وثالثية حسب عدد مجموعات الألكيل المرتبطة بذرة الكربون الحاملة لـ ‎OH‎ (10 دقائق)\nمخرج تعليمي آخر: يفسر تناقص ذوبانية الكحولات في الماء بزيادة طول السلسلة الكربونية (20 دقيقة)", "1. تطبيق: يسمي الكحولات حتى عشر ذرات كربون وفق نظام ‎IUPAC‎ ويكتب صيغها البنائية والهيكلية\n2. تحليل: يصنف الكحولات إلى أولية وثانوية وثالثية حسب عدد مجموعات الألكيل المرتبطة بذرة الكربون الحاملة لـ ‎OH‎\n3. فهم (مخرج آخر): يفسر تناقص ذوبانية الكحولات في الماء بزيادة طول السلسلة الك لكحولات مختلفة\n3. تحليل (مخرج آخر): يفسر ارتفاع درجات غليان الكحولات مقارنة بالألكانات المماثلة في الكتلة", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "اختبار ثلاثي يودوميثان، اليود القلوي، الراسب الأصفر ‎CHI₃‎، المجموعة ‎CH₃CH(OH)–‎، درجة الغليان، الروابط الهيدروجينية بين الجزيئات.", "يعرض المعلم صورة راسب أصفر باهت في أنبوب اختبار ويسأل: «إذا أضفنا اليود والقاعدة إلى إيثانول ثم إلى ميثانول، أي الأنبوبين ستظهر فيه هذه البلورات؟ ولماذا؟»", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون ويبررون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «اختبار يودوميثان» ويشرح شرط وجود ‎CH₃CH(OH)–‎ والراسب الأصفر، والطلبة يحددون الكحولات التي تعطي نتيجة موجبة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم مجموعة كحولات للتنبؤ بنتيجة الاختبار ويناقش درجات الغليان، والطلبة يتنبؤون ويفسرون بالروابط الهيدروجينية (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «لماذا لا يعطي بروبان-1-ول نتيجة موجبة»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ماء ورد الجبل الأخضر: تسمّي المجموعات كحولات وفق IUPAC وتصنّفها، وتذكر أن رائحة الورد تعود إلى مركّبات عضوية بعضها كحولات، رابطة ذلك بصناعة ماء الورد التقليدية في الجبل الأخضر (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الناتج المرئي لاختبار ثلاثي يودوميثان الموجب؟\n• الإجابة النموذجية: راسب أصفر باهت من ثلاثي يودوميثان ‎CHI₃‎ ذو رائحة مميزة.\n\n2. مستوى التطبيق: هل يعطي بروبان-2-ول نتيجة موجبة؟ ولماذا؟\n• الإجابة النموذجية: نعم، لأنه يحتوي المجموعة ‎CH₃CH(OH)–‎.\n\n3. مستوى الاستدلال: لماذا لا يعطي بروبان-1-ول نتيجة موجبة؟\n• الإجابة النموذجية: لأن ذرة الكربون الحاملة لـ ‎OH‎ ليست مرتبطة بمجموعة ميثيل.", "1. مستوى المعرفة: ما الكواشف المستخدمة في اختبار ثلاثي يودوميثان؟\n• الإجابة النموذجية: اليود مع محلول قلوي (هيدروكسيد الصوديوم) مع التسخين الهادئ.\n\n2. مستوى التطبيق: أي الكحولين يعطي نتيجة موجبة: الإيثانول أم الميثانول؟\n• الإجابة النموذجية: الإيثانول.\n\n3. مستوى الاستدلال: لماذا درجة غليان الإيثانول ‎(78 °C)‎ أعلى بكثير من البروبان ‎(−42 °C)‎ رغم تقارب كتلتيهما؟\n• الإجابة النموذجية: لأن جزيئات الإيثانول تكوّن روابط هيدروجينية فيما بينها تحتاج طاقة أكبر للتغلب عليها، بينما في البروبان قوى فاندرفالز ضعيفة فقط.", "إرشاد للطالب: مراجعة ص 139–140 وتلخيص شروط اختبار ثلاثي يودوميثان\nإرشاد لولي الأمر: سؤال الابن عن سبب ارتفاع درجة غليان الكحولات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=18"], "h": ["<ol class=\"ol\"><li>يصف اختبار ثلاثي يودوميثان للكشف عن وجود المجموعة ‎CH₃CH(OH)–‎ في كحول ما (15 دقيقة)<\/li><li>يتنبأ بنتيجة اختبار ثلاثي يودوميثان لكحولات مختلفة (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر ارتفاع درجات غليان الكحولات مقارنة بالألكانات المماثلة في الكتلة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف اختبار ثلاثي يودوميثان للكشف عن وجود المجموعة ‎CH₃CH(OH)–‎ في كحول ما<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يتنبأ بنتيجة اختبار ثلاثي يودوميثان لكحولات مختلفة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر ارتفاع درجات غليان الكحولات مقارنة بالألكانات المماثلة في الكتلة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>اختبار ثلاثي يودوميثان، اليود القلوي، الراسب الأصفر ‎CHI₃‎، المجموعة ‎CH₃CH(OH)–‎، درجة الغليان، الروابط الهيدروجينية بين الجزيئات.<\/p>", "<p>يعرض المعلم صورة راسب أصفر باهت في أنبوب اختبار ويسأل: «إذا أضفنا اليود والقاعدة إلى إيثانول ثم إلى ميثانول، أي الأنبوبين ستظهر فيه هذه البلورات؟ ولماذا؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يتوقعون ويبررون (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «اختبار يودوميثان» ويشرح شرط وجود ‎CH₃CH(OH)–‎ والراسب الأصفر، والطلبة يحددون الكحولات التي تعطي نتيجة موجبة (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم مجموعة كحولات للتنبؤ بنتيجة الاختبار ويناقش درجات الغليان، والطلبة يتنبؤون ويفسرون بالروابط الهيدروجينية (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «لماذا لا يعطي بروبان-1-ول نتيجة موجبة»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ماء ورد الجبل الأخضر: تسمّي المجموعات كحولات وفق IUPAC وتصنّفها، وتذكر أن رائحة الورد تعود إلى مركّبات عضوية بعضها كحولات، رابطة ذلك بصناعة ماء الورد التقليدية في الجبل الأخضر (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الرؤوس المرقمة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الناتج المرئي لاختبار ثلاثي يودوميثان الموجب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: راسب أصفر باهت من ثلاثي يودوميثان ‎CHI₃‎ ذو رائحة مميزة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> هل يعطي بروبان-2-ول نتيجة موجبة؟ ولماذا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نعم، لأنه يحتوي المجموعة ‎CH₃CH(OH)–‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يعطي بروبان-1-ول نتيجة موجبة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ذرة الكربون الحاملة لـ ‎OH‎ ليست مرتبطة بمجموعة ميثيل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الكواشف المستخدمة في اختبار ثلاثي يودوميثان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: اليود مع محلول قلوي (هيدروكسيد الصوديوم) مع التسخين الهادئ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أي الكحولين يعطي نتيجة موجبة: الإيثانول أم الميثانول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الإيثانول.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا درجة غليان الإيثانول ‎(78 °C)‎ أعلى بكثير من البروبان ‎(−42 °C)‎ رغم تقارب كتلتيهما؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن جزيئات الإيثانول تكوّن روابط هيدروجينية فيما بينها تحتاج طاقة أكبر للتغلب عليها، بينما في البروبان قوى فاندرفالز ضعيفة فقط.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 139–140 وتلخيص شروط اختبار ثلاثي يودوميثان<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن سبب ارتفاع درجة غليان الكحولات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=18<\/p>"]}]}, {"title": "السلسلتان المتجانستان للألدهيدات والكيتونات", "sb": "ص 141–142", "unit": "الوحدة 4: مشتقات الهيدروكربونات (1)", "periods": [{"axis": "مجموعة الكربونيل وتسمية الألدهيدات والكيتونات وتشاكلها", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: مشتقات الهيدروكربونات (1)"], ["الدرس", "السلسلتان المتجانستان للألدهيدات والكيتونات"], ["الحصة", "1 من 3"], ["محور الحصة", "مجموعة الكربونيل وتسمية الألدهيدات والكيتونات وتشاكلها"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 141"], ["دليل المعلم", "ص 178–182"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-2: مركبات الكربونيل: التحضير والاختزال ص 92"]], "t": ["1. يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية (5 دقائق)\n2. يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل (15 دقيقة)\nمخرج تعليمي آخر: يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة (20 دقيقة)", "1. تطبيق: يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية\n2. فهم: يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل\n3. تحليل (مخرج آخر): يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج جزيئية، الجدول 4-1 في كتاب الطالب", "مجموعة الكربونيل ‎C=O‎، الألدهيد ‎(–CHO)‎، الكيتون (‎C=O‎ داخل السلسلة)، الميثانال، الإيثانال، البروبانون، التشاكل.", "يعرض المعلم صيغتي بروبانال وبروبانون ويسأل: «لهما الصيغة الجزيئية نفسها ‎C₃H₆O‎؛ ما الذي يجعلهما مركبين مختلفين؟»", "1. يعرض المعلم الصيغتين ويطرح السؤال، والطلبة يحددون موقع مجموعة الكربونيل (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يستخدم المعلم الجدول 4-1 لتعريف المجموعات الوظيفية ويشرح التسمية (‎–al‎ و–‎one‎)، والطلبة يسمون أمثلة ويحددون نوعها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينفذ «تسمية وتشاكل الألدهيدات والكيتونات»: رسم المتشكلات السبعة لـ ‎C₅H₁₀O (‎الشكل 4-1)، والطلبة يرسمون المتشكلات في مجموعات ويسمونها (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: أين تقع مجموعة الكربونيل في الألدهيد؟\n• الإجابة النموذجية: في نهاية السلسلة الكربونية.\n\n2. مستوى التطبيق: سمِّ ‎CH₃COCH₃‎.\n• الإجابة النموذجية: بروبانون.\n\n3. مستوى الاستدلال: ارسم متشكلين لـ ‎C₄H₈O‎ أحدهما ألدهيد والآخر كيتون.\n• الإجابة النموذجية: بيوتانال ‎CH₃CH₂CH₂CHO‎، وبيوتانون ‎CH₃COCH₂CH₃‎.", "1. مستوى المعرفة: ما المجموعة الوظيفية المشتركة بين الألدهيدات والكيتونات؟\n• الإجابة النموذجية: مجموعة الكربونيل ‎C=O‎.\n\n2. مستوى التطبيق: سمِّ ‎CH₃CH₂CHO‎.\n• الإجابة النموذجية: بروبانال.\n\n3. مستوى الاستدلال: لماذا لا يوجد كيتون يحتوي ذرتي كربون فقط؟\n• الإجابة النموذجية: لأن الكيتون يتطلب ذرتي كربون على جانبي مجموعة الكربونيل، أي ثلاث ذرات كربون على الأقل.", "إرشاد للطالب: مراجعة ص 141 ورسم المتشكلات السبعة لـ ‎C₅H₁₀O‎\nإرشاد لولي الأمر: متابعة الابن في التمييز بين لاحقتي –‎al‎ و–‎one‎\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=19"], "h": ["<ol class=\"ol\"><li>يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية (5 دقائق)<\/li><li>يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يسمي الألدهيدات والكيتونات حتى عشر ذرات كربون ويكتب صيغها البنائية والهيكلية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يميز بين الألدهيد والكيتون من موقع مجموعة الكربونيل<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يرسم المتشكلات الممكنة لمركبات كربونيل بصيغة جزيئية معطاة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: نماذج جزيئية، الجدول 4-1 في كتاب الطالب<\/span><\/div>", "<p>مجموعة الكربونيل ‎C=O‎، الألدهيد ‎(–CHO)‎، الكيتون (‎C=O‎ داخل السلسلة)، الميثانال، الإيثانال، البروبانون، التشاكل.<\/p>", "<p>يعرض المعلم صيغتي بروبانال وبروبانون ويسأل: «لهما الصيغة الجزيئية نفسها ‎C₃H₆O‎؛ ما الذي يجعلهما مركبين مختلفين؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصيغتين ويطرح السؤال، والطلبة يحددون موقع مجموعة الكربونيل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يستخدم المعلم الجدول 4-1 لتعريف المجموعات الوظيفية ويشرح التسمية (‎–al‎ و–‎one‎)، والطلبة يسمون أمثلة ويحددون نوعها (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ «تسمية وتشاكل الألدهيدات والكيتونات»: رسم المتشكلات السبعة لـ ‎C₅H₁₀O (‎الشكل 4-1)، والطلبة يرسمون المتشكلات في مجموعات ويسمونها (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين تقع مجموعة الكربونيل في الألدهيد؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في نهاية السلسلة الكربونية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> سمِّ ‎CH₃COCH₃‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروبانون.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ارسم متشكلين لـ ‎C₄H₈O‎ أحدهما ألدهيد والآخر كيتون.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بيوتانال ‎CH₃CH₂CH₂CHO‎، وبيوتانون ‎CH₃COCH₂CH₃‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المجموعة الوظيفية المشتركة بين الألدهيدات والكيتونات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: مجموعة الكربونيل ‎C=O‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> سمِّ ‎CH₃CH₂CHO‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بروبانال.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يوجد كيتون يحتوي ذرتي كربون فقط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الكيتون يتطلب ذرتي كربون على جانبي مجموعة الكربونيل، أي ثلاث ذرات كربون على الأقل.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 141 ورسم المتشكلات السبعة لـ ‎C₅H₁₀O‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التمييز بين لاحقتي –‎al‎ و–‎one‎<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=19<\/p>"]}, {"axis": "تحضير الألدهيدات والكيتونات بأكسدة الكحول
