e=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> ينفذ المعلم العرض ويطرح السؤال، والطلبة يلاحظون ويتنبؤون بالغاز (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم التحليل الكهربائي للمصاهير (‎PbBr₂‎، ‎NaCl‎) ونزع الشحنات وأنصاف المعادلات، والطلبة يكتبون أنصاف المعادلات لكل قطب (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقارن المعلم بين مصهور ‎NaCl‎ ومحلوله المائي ويقدم أمثلة للتنبؤ، والطلبة يتنبؤون بالنواتج في مجموعات ويكتبون أنصاف المعادلات (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الناتج عند المهبط في التحليل الكهربائي لمصهور ‎NaCl‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فلز الصوديوم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب نصف معادلة المصعد في التحليل الكهربائي لمصهور ‎NaCl‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2Cl⁻ → Cl₂ + 2e⁻‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يتصاعد ‎H₂‎ لا ‎Na‎ عند المهبط في محلول ‎NaCl‎ المائي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن اختزال الماء (أو ‎H⁺‎) أسهل من اختزال ‎Na⁺‎ ذي ‎E°‎ السالبة جدًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> إلى أي قطب تتجه الأيونات الموجبة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المهبط (القطب السالب).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ناتجا التحليل الكهربائي لمصهور ‎PbBr₂‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الرصاص عند المهبط والبروم عند المصعد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتب نصفي التفاعل للتحليل الكهربائي لمحلول ‎CuCl₂‎ بأقطاب خاملة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: المهبط: ‎Cu²⁺ + 2e⁻ → Cu‎؛ المصعد: ‎2Cl⁻ → Cl₂ + 2e⁻‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 90–92 وكتابة أنصاف معادلات لثلاثة أمثلة<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن استخدام التحليل الكهربائي في طلاء المعادن<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=12<\/p>"]}, {"axis": "استخدام جهود الأقطاب للتنبؤ بنواتج التحليل الكهربائي", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "التحليل الكهربائي"], ["الحصة", "2 من 2"], ["محور الحصة", "استخدام جهود الأقطاب للتنبؤ بنواتج التحليل الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "ص 92–94 + كتاب التجارب ص 54"], ["دليل المعلم", "ص 114–117"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-5: التحليل الكهربائي ص 54"]], "t": ["1. يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية (10 دقائق)\n2. يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف) (10 دقائق)\nمخرج تعليمي آخر: يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22 (20 دقيقة)", "1. تطبيق: يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية\n2. تحليل: يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف)\n3. تطبيق (مخرج آخر): يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الخريطة الذهنية", "- الكتاب\n- السبورة الذكية\n- أخرى: سلسلة جهود الاختزال القياسية، كتاب التجارب العملية والأنشطة", "الأيون الأسهل اختزالًا، الأيون الأسهل أكسدة، تأثير التركيز، المحلول المركز والمخفف، الحجوم النسبية للغازات.", "يسأل المعلم: «في محلول كبريتات النحاس توجد أيونات ‎Cu²⁺‎ و‎H⁺ (‎من الماء)؛ أيهما سيكسب الإلكترونات أولًا عند المهبط؟ وكيف نقرر؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون مقارنة قيم ‎E°‎ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ينفذ المعلم «تأثير قيم جهود الأقطاب القياسية على نزع شحنات الأيونات» ويشرح أثر التركيز في محلول ‎NaCl‎، والطلبة يطبقون القاعدة على أمثلة ويفسرون الحجوم النسبية للغازات (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 2-5 (كتاب التجارب ص 54) والأسئلة 18–22 ويضيف الحقائق إلى الخريطة الذهنية، والطلبة يحلون ويحدّثون الخريطة الذهنية للتحليل الكهربائي (13 دقيقة)\nالاستراتيجيات: الخريطة الذهنية.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «في تحليل محلول ‎H₂SO₄‎ المخفف، ما النسبة بين حجمي ‎H₂‎ و‎O₂‎؟ ولماذا» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – مصهر صحار: يتنبّأ أصحاب الأرقام في كل مجموعة بنواتج التحليل الكهربائي لمصهور كلوريد الصوديوم، ثم يربطون التحليل الكهربائي بصناعة الألومنيوم في صحار ودورها في الاقتصاد العماني (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم:\n1. مستوى المعرفة: عند المهبط في محلول ‎CuSO₄‎، أي الأيونين يُختزل: ‎Cu²⁺‎ أم ‎H⁺‎؟\n• الإجابة النموذجية: ‎Cu²⁺‎ لأن ‎E°‎ له (+0.34) أكبر من ‎E°‎ لـ ‎H⁺ (0.00)‎.\n\n2. مستوى التطبيق: ما ناتج المصعد في محلول ‎NaCl‎ المركز؟\n• الإجابة النموذجية: الكلور.\n\n3. مستوى الاستدلال: ما ناتج المصعد في محلول ‎NaCl‎ المخفف جدًا؟ ولماذا؟\n• الإجابة النموذجية: الأكسجين (غالبًا)، لأن تركيز ‎Cl⁻‎ منخفض فيصبح تأكسد الماء/‎OH⁻‎ مفضلًا.", "1. مستوى المعرفة: ما ناتجا التحليل الكهربائي لمحلول ‎CuSO₄‎ بأقطاب خاملة؟\n• الإجابة النموذجية: النحاس عند المهبط والأكسجين عند المصعد.\n\n2. مستوى التطبيق: لماذا يتصاعد ‎H₂‎ عند المهبط في تحليل محلول ‎Na₂SO₄‎؟\n• الإجابة النموذجية: لأن اختزال الماء أسهل كثيرًا من اختزال ‎Na⁺‎.\n\n3. مستوى الاستدلال: في تحليل محلول ‎H₂SO₄‎ المخفف، ما النسبة بين حجمي ‎H₂‎ و‎O₂‎؟ ولماذا؟\n• الإجابة النموذجية: 2 : 1، لأن تكوين جزيء ‎O₂‎ يتطلب 4 إلكترونات بينما جزيء ‎H₂‎ يتطلب 2.", "إرشاد للطالب: إكمال نشاط 2-5 ص 54 والأسئلة 18–22 وتحديث الخريطة الذهنية\nإرشاد لولي الأمر: متابعة الابن في استخدام سلسلة ‎E°‎ للتنبؤ بالنواتج\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=12"], "h": ["<ol class=\"ol\"><li>يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية (10 دقائق)<\/li><li>يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف) (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22 (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يستخدم قيم ‎E°‎ للتنبؤ بالأيون الذي تُنزع شحنته عند كل قطب في المحاليل المائية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر أثر تركيز الأيونات على نوع الناتج عند المصعد (‎Cl⁻‎ المركز مقابل المخفف)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل نشاط 2-5 «التحليل الكهربائي» والأسئلة 18–22<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الخريطة الذهنية<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: سلسلة جهود الاختزال القياسية، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الأيون الأسهل اختزالًا، الأيون الأسهل أكسدة، تأثير التركيز، المحلول المركز والمخفف، الحجوم النسبية للغازات.<\/p>", "<p>يسأل المعلم: «في محلول كبريتات النحاس توجد أيونات ‎Cu²⁺‎ و‎H⁺ (‎من الماء)؛ أيهما سيكسب الإلكترونات أولًا عند المهبط؟ وكيف نقرر؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون مقارنة قيم ‎E°‎ (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «تأثير قيم جهود الأقطاب القياسية على نزع شحنات الأيونات» ويشرح أثر التركيز في محلول ‎NaCl‎، والطلبة يطبقون القاعدة على أمثلة ويفسرون الحجوم النسبية للغازات (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-5 (كتاب التجارب ص 54) والأسئلة 18–22 ويضيف الحقائق إلى الخريطة الذهنية، والطلبة يحلون ويحدّثون الخريطة الذهنية للتحليل الكهربائي (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الخريطة الذهنية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «في تحليل محلول ‎H₂SO₄‎ المخفف، ما النسبة بين حجمي ‎H₂‎ و‎O₂‎؟ ولماذا» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – مصهر صحار: يتنبّأ أصحاب الأرقام في كل مجموعة بنواتج التحليل الكهربائي لمصهور كلوريد الصوديوم، ثم يربطون التحليل الكهربائي بصناعة الألومنيوم في صحار ودورها في الاقتصاد العماني (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الرؤوس المرقمة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عند المهبط في محلول ‎CuSO₄‎، أي الأيونين يُختزل: ‎Cu²⁺‎ أم ‎H⁺‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Cu²⁺‎ لأن ‎E°‎ له (+0.34) أكبر من ‎E°‎ لـ ‎H⁺ (0.00)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما ناتج المصعد في محلول ‎NaCl‎ المركز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الكلور.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما ناتج المصعد في محلول ‎NaCl‎ المخفف جدًا؟ ولماذا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الأكسجين (غالبًا)، لأن تركيز ‎Cl⁻‎ منخفض فيصبح تأكسد الماء/‎OH⁻‎ مفضلًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ناتجا التحليل الكهربائي لمحلول ‎CuSO₄‎ بأقطاب خاملة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: النحاس عند المهبط والأكسجين عند المصعد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يتصاعد ‎H₂‎ عند المهبط في تحليل محلول ‎Na₂SO₄‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن اختزال الماء أسهل كثيرًا من اختزال ‎Na⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> في تحليل محلول ‎H₂SO₄‎ المخفف، ما النسبة بين حجمي ‎H₂‎ و‎O₂‎؟ ولماذا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 2 : 1، لأن تكوين جزيء ‎O₂‎ يتطلب 4 إلكترونات بينما جزيء ‎H₂‎ يتطلب 2.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-5 ص 54 والأسئلة 18–22 وتحديث الخريطة الذهنية<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في استخدام سلسلة ‎E°‎ للتنبؤ بالنواتج<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=12<\/p>"]}]}, {"title": "حسابات التحليل الكهربائي", "sb": "ص 95–110", "unit": "الوحدة 2: الكيمياء الكهربائية", "periods": [{"axis": "كمية الشحنة ‎Q = It‎ وثابت فارادي", "n": 1, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "حسابات التحليل الكهربائي"], ["الحصة", "1 من 5"], ["محور الحصة", "كمية الشحنة ‎Q = It‎ وثابت فارادي"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "ص 95–96"], ["دليل المعلم", "ص 117–121"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]], "t": ["1. يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎ (10 دقائق)\n2. يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎ (10 دقائق)\nمخرج تعليمي آخر: يحسب عدد مولات الإلكترونات المارة من كمية الشحنة (20 دقيقة)", "1. تطبيق: يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎\n2. تذكر: يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎\n3. تطبيق (مخرج آخر): يحسب عدد مولات الإلكترونات المارة من كمية الشحنة", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية", "كمية الشحنة ‎Q‎، شدة التيار ‎I‎، الزمن ‎t‎ بالثواني، الكولوم، ثابت فارادي ‎F‎، مولات الإلكترونات.", "يسأل المعلم: «لطلاء ملعقة بطبقة فضة محددة، كيف تعرف كم دقيقة تترك التيار يمر؟»", "1. يطرح المعلم السؤال، والطلبة يقترحون العلاقة بين التيار والزمن وكمية المادة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم ‎Q = It‎ وتحويل الزمن إلى ثوانٍ وثابت فارادي ومولات الإلكترونات، والطلبة يحلون أمثلة مباشرة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل متدرجة لحساب ‎Q‎ ومولات الإلكترونات، والطلبة يحلون في أزواج ويعرضون (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب كمية الشحنة لتيار ‎2.0 A‎ يمر مدة 30 دقيقة.\n• الإجابة النموذجية: ‎Q = 2.0 × 1800 = 3600 C‎.\n\n2. مستوى التطبيق: كم مولًا من الإلكترونات تمثله الشحنة السابقة؟\n• الإجابة النموذجية: ‎3600 ÷ 96500 = 0.0373 mol‎.\n\n3. مستوى الاستدلال: لماذا يجب تحويل الزمن إلى ثوانٍ؟\n• الإجابة النموذجية: لأن وحدة الكولوم تساوي أمبير × ثانية.", "1. مستوى المعرفة: ما قيمة ثابت فارادي؟\n• الإجابة النموذجية: ‎96500 C/mol‎.\n\n2. مستوى التطبيق: احسب ‎Q‎ لتيار ‎0.50 A‎ يمر مدة ‎965 s‎.\n• الإجابة النموذجية: ‎Q = 482.5 C‎.\n\n3. مستوى الاستدلال: كم ثانية يلزم لتمرير ‎0.10 mol‎ من الإلكترونات بتيار ‎1.93 A‎؟\n• الإجابة النموذجية: ‎Q = 0.10 × 96500 = 9650 C‎؛ ‎t = 9650 ÷ 1.93 = 5000 s‎.", "إرشاد للطالب: مراجعة ص 95–96 وحل أربع مسائل على ‎Q = It‎\nإرشاد لولي الأمر: متابعة الابن في تحويل الوحدات قبل الحساب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13"], "h": ["<ol class=\"ol\"><li>يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎ (10 دقائق)<\/li><li>يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎ (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب عدد مولات الإلكترونات المارة من كمية الشحنة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب كمية الشحنة الكهربائية المارة باستخدام ‎Q = I × t‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يعرّف ثابت فارادي بأنه شحنة مول واحد من الإلكترونات ‎(96500 C/mol)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب عدد مولات الإلكترونات المارة من كمية الشحنة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>كمية الشحنة ‎Q‎، شدة التيار ‎I‎، الزمن ‎t‎ بالثواني، الكولوم، ثابت فارادي ‎F‎، مولات الإلكترونات.<\/p>", "<p>يسأل المعلم: «لطلاء ملعقة بطبقة فضة محددة، كيف تعرف كم دقيقة تترك التيار يمر؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يقترحون العلاقة بين التيار والزمن وكمية المادة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم ‎Q = It‎ وتحويل الزمن إلى ثوانٍ وثابت فارادي ومولات الإلكترونات، والطلبة يحلون أمثلة مباشرة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل متدرجة لحساب ‎Q‎ ومولات الإلكترونات، والطلبة يحلون في أزواج ويعرضون (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب كمية الشحنة لتيار ‎2.0 A‎ يمر مدة 30 دقيقة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 2.0 × 1800 = 3600 C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كم مولًا من الإلكترونات تمثله الشحنة السابقة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎3600 ÷ 96500 = 0.0373 mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يجب تحويل الزمن إلى ثوانٍ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن وحدة الكولوم تساوي أمبير × ثانية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما قيمة ثابت فارادي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎96500 C/mol‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎Q‎ لتيار ‎0.50 A‎ يمر مدة ‎965 s‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 482.5 C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم ثانية يلزم لتمرير ‎0.10 mol‎ من الإلكترونات بتيار ‎1.93 A‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 0.10 × 96500 = 9650 C‎؛ ‎t = 9650 ÷ 1.93 = 5000 s‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 95–96 وحل أربع مسائل على ‎Q = It‎<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في تحويل الوحدات قبل الحساب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13<\/p>"]}, {"axis": "حساب كتلة المادة المترسبة وحجم الغاز المتصاعد", "n": 2, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "حسابات التحليل الكهربائي"], ["الحصة", "2 من 5"], ["محور الحصة", "حساب كتلة المادة المترسبة وحجم الغاز المتصاعد"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "ص 96–97"], ["دليل المعلم", "ص 117–121"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]], "t": ["1. يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة (15 دقيقة)\n2. يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي (5 دقائق)\nمخرج تعليمي آخر: يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف (20 دقيقة)", "1. تطبيق: يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة\n2. تطبيق: يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي\n3. تحليل (مخرج آخر): يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: آلة حاسبة علمية، جدول دوري", "مولات الإلكترونات، النسبة المولية من نصف المعادلة، الكتلة المولية، الحجم المولي للغاز (‎24 dm³‎ عند الظروف العادية)، الكتلة المترسبة.", "يسأل المعلم: «إذا مرت الشحنة نفسها في خليتين متتاليتين إحداهما فيها ‎Ag⁺‎ والأخرى فيها ‎Cu²⁺‎، فأيهما يترسب منه عدد أكبر من المولات؟»", "1. يطرح المعلم السؤال، والطلبة يربطون الإجابة بشحنة الأيون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ينفذ المعلم «حساب كتلة المادة المترسبة» بأمثلة ‎Cu‎ و‎Ag‎ وحجم ‎O₂‎، والطلبة يتبعون الخطوات: ‎Q ←‎ مول ‎e⁻ ←‎ مول مادة ← كتلة أو حجم (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم مسائل للحل في مجموعات بينها خلايا متتالية، والطلبة يحلون ويعرضون الحلول (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: احسب كتلة النحاس المترسبة بتيار ‎2.0 A‎ مدة 30 دقيقة ‎(Ar Cu = 63.5)‎.\n• الإجابة النموذجية: مول ‎e⁻ = 0.0373‎؛ مول ‎Cu = 0.0187‎؛ الكتلة = ‎1.18 g‎.\n\n2. مستوى التطبيق: احسب كتلة الفضة المترسبة بمرور ‎482.5 C (Ar Ag = 108)‎.\n• الإجابة النموذجية: مول ‎e⁻ = 0.0050‎؛ الكتلة = ‎0.54 g‎.\n\n3. مستوى الاستدلال: لماذا يترسب من الفضة ضعف عدد مولات النحاس بالشحنة نفسها؟\n• الإجابة النموذجية: لأن ‎Ag⁺‎ يحتاج إلكترونًا واحدًا و‎Cu²⁺‎ يحتاج إلكترونين.", "1. مستوى المعرفة: ما الخطوات الأربع لحساب الكتلة المترسبة؟\n• الإجابة النموذجية: حساب ‎Q‎، ثم مولات الإلكترونات، ثم مولات المادة من نصف المعادلة، ثم الكتلة = المولات × الكتلة المولية.\n\n2. مستوى التطبيق: احسب حجم ‎O₂ (24 dm³/mol)‎ المتصاعد عند مرور ‎0.20 mol‎ من الإلكترونات.\n• الإجابة النموذجية: ‎4OH⁻ → O₂ + 2H₂O + 4e⁻‎؛ مول ‎O₂ = 0.050‎؛ الحجم = ‎1.2 dm³‎.\n\n3. مستوى الاستدلال: مرت الشحنة نفسها في محلولي ‎AgNO₃‎ و‎CuSO₄‎ فترسب ‎1.08 g Ag‎. احسب كتلة ‎Cu‎.\n• الإجابة النموذجية: مول ‎Ag = 0.010 =‎ مول ‎e⁻‎؛ مول ‎Cu = 0.0050‎؛ الكتلة = ‎0.32 g‎.", "إرشاد للطالب: مراجعة ص 96–97 وحل ثلاث مسائل كتلة وحجم\nإرشاد لولي الأمر: متابعة الابن في كتابة نصف المعادلة قبل حساب النسبة المولية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13"], "h": ["<ol class=\"ol\"><li>يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة (15 دقيقة)<\/li><li>يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب كتلة المادة المترسبة عند القطب من كمية الشحنة المارة ونصف المعادلة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحسب حجم الغاز المتصاعد عند قطب في التحليل الكهربائي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين كتل فلزات مختلفة تترسب بالشحنة نفسها مفسرًا الاختلاف<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية، جدول دوري<\/span><\/div>", "<p>مولات الإلكترونات، النسبة المولية من نصف المعادلة، الكتلة المولية، الحجم المولي للغاز (‎24 dm³‎ عند الظروف العادية)، الكتلة المترسبة.<\/p>", "<p>يسأل المعلم: «إذا مرت الشحنة نفسها في خليتين متتاليتين إحداهما فيها ‎Ag⁺‎ والأخرى فيها ‎Cu²⁺‎، فأيهما يترسب منه عدد أكبر من المولات؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال، والطلبة يربطون الإجابة بشحنة الأيون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينفذ المعلم «حساب كتلة المادة المترسبة» بأمثلة ‎Cu‎ و‎Ag‎ وحجم ‎O₂‎، والطلبة يتبعون الخطوات: ‎Q ←‎ مول ‎e⁻ ←‎ مول مادة ← كتلة أو حجم (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل للحل في مجموعات بينها خلايا متتالية، والطلبة يحلون ويعرضون الحلول (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> احسب كتلة النحاس المترسبة بتيار ‎2.0 A‎ مدة 30 دقيقة ‎(Ar Cu = 63.5)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مول ‎e⁻ = 0.0373‎؛ مول ‎Cu = 0.0187‎؛ الكتلة = ‎1.18 g‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب كتلة الفضة المترسبة بمرور ‎482.5 C (Ar Ag = 108)‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مول ‎e⁻ = 0.0050‎؛ الكتلة = ‎0.54 g‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يترسب من الفضة ضعف عدد مولات النحاس بالشحنة نفسها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎Ag⁺‎ يحتاج إلكترونًا واحدًا و‎Cu²⁺‎ يحتاج إلكترونين.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطوات الأربع لحساب الكتلة المترسبة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: حساب ‎Q‎، ثم مولات الإلكترونات، ثم مولات المادة من نصف المعادلة، ثم الكتلة = المولات × الكتلة المولية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب حجم ‎O₂ (24 dm³/mol)‎ المتصاعد عند مرور ‎0.20 mol‎ من الإلكترونات.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎4OH⁻ → O₂ + 2H₂O + 4e⁻‎؛ مول ‎O₂ = 0.050‎؛ الحجم = ‎1.2 dm³‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> مرت الشحنة نفسها في محلولي ‎AgNO₃‎ و‎CuSO₄‎ فترسب ‎1.08 g Ag‎. احسب كتلة ‎Cu‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مول ‎Ag = 0.010 =‎ مول ‎e⁻‎؛ مول ‎Cu = 0.0050‎؛ الكتلة = ‎0.32 g‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 96–97 وحل ثلاث مسائل كتلة وحجم<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في كتابة نصف المعادلة قبل حساب النسبة المولية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13<\/p>"]}, {"axis": "العلاقة ‎F = L × e‎ وتحديد ثابت أفوجادرو بالتحليل الكهربائي", "n": 3, "hi": [["المادة", "الكيمياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الكيمياء الكهربائية"], ["الدرس", "حسابات التحليل الكهربائي"], ["الحصة", "3 من 5"], ["محور الحصة", "العلاقة ‎F = L × e‎ وتحديد ثابت أفوجادرو بالتحليل الكهربائي"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "ص 97–98"], ["دليل المعلم", "ص 117–121"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-6: حسابات التحليل الكهربائي ص 57؛ الاستقصاء العملي 2-2: تحديد ثابت فارادي ص 63"]], "t": ["1. يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها (5 دقائق)\n2. يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس) (15 دقيقة)\nمخرج تعليمي آخر: يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة (20 دقيقة)", "1. تطبيق: يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها\n2. فهم: يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس)\n3. تطبيق (مخرج آخر): يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: آلة حاسبة علمية", "ثابت أفوجادرو ‎L‎، شحنة الإلكترون ‎e‎، ‎F = L × e‎، تحديد ‎L‎ تجريبيًا، تغير كتلة القطب.", "يسأل المعلم: «كيف عدّ العلماء عدد الذرات في مول دون أن يروا ذرة واحدة؟» ويعرض العلاقة ‎F = L × e‎.", "1. يطرح المعلم السؤال ويعرض العلاقة، والطلبة يتوقعون استخدام التحليل الكهربائي (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم العلاقة ويحسب ‎L‎ من ‎F‎ و‎e‎، ثم يصف تجربة ترسيب النحاس وقياس تغير الكتلة، والطلبة يحسبون ‎L = 96500 ÷ 1.60 × 10⁻¹⁹‎ (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يقدم المعلم بيانات تجريبية لحساب ‎L‎ في مجموعات، والطلبة يحسبون ‎L‎ ويقارنونها بالقيمة المقبولة (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب العلاقة بين ‎F‎ و‎L‎ و‎e‎.\n• الإجابة النموذجية: ‎F = L × e‎\n\n2. مستوى التطبيق: احسب ‎L‎ من ‎F = 96500 C/mol‎ و‎e = 1.60 × 10⁻¹⁹ C‎.\n• الإجابة النموذجية: ‎L = 6.03 × 10²³ mol⁻¹‎.\n\n3. مستوى الاستدلال: ما القياسات اللازمة لتحديد ‎L‎ بترسيب النحاس؟\n• الإجابة النموذجية: شدة التيار، والزمن، وتغير كتلة المهبط.", "1. مستوى المعرفة: ما قيمة شحنة الإلكترون؟\n• الإجابة النموذجية: ‎1.60 × 10⁻¹⁹ C‎.\n\n2. مستوى التطبيق: في تجربة: تيار ‎0.50 A‎ مدة ‎3860 s‎ رسب ‎0.635 g Cu‎. احسب عدد الإلكترونات المارة.\n• الإجابة النموذجية: ‎Q = 1930 C‎؛ عدد الإلكترونات = ‎1930 ÷ 1.60 × 10⁻¹⁹ = 1.21 × 10²²‎.\n\n3. مستوى الاستدلال: أكمل التجربة السابقة لحساب ‎L‎.\n• الإجابة النموذجية: مول ‎Cu = 0.0100‎، فمول ‎e⁻ = 0.0200‎؛ ‎L = 1.21 × 10²² ÷ 0.0200 = 6.0 × 10²³ mol⁻¹‎.", "إرشاد للطالب: مراجعة ص 97–98 وحل مسألة تحديد ‎L‎\nإرشاد لولي الأمر: الحديث مع الابن عن ضخامة عدد أفوجادرو بأمثلة من الحياة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13"], "h": ["<ol class=\"ol\"><li>يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها (5 دقائق)<\/li><li>يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس) (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يذكر العلاقة ‎F = L × e‎ بين ثابت فارادي وثابت أفوجادرو وشحنة الإلكترون ويطبقها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف عملية تحديد قيمة ثابت أفوجادرو بوساطة التحليل الكهربائي (ترسيب النحاس)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب قيمة تجريبية لثابت أفوجادرو من بيانات معطاة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: آلة حاسبة علمية<\/span><\/div>", "<p>ثابت أفوجادرو ‎L‎، شحنة الإلكترون ‎e‎، ‎F = L × e‎، تحديد ‎L‎ تجريبيًا، تغير كتلة القطب.<\/p>", "<p>يسأل المعلم: «كيف عدّ العلماء عدد الذرات في مول دون أن يروا ذرة واحدة؟» ويعرض العلاقة ‎F = L × e‎.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويعرض العلاقة، والطلبة يتوقعون استخدام التحليل الكهربائي (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم العلاقة ويحسب ‎L‎ من ‎F‎ و‎e‎، ثم يصف تجربة ترسيب النحاس وقياس تغير الكتلة، والطلبة يحسبون ‎L = 96500 ÷ 1.60 × 10⁻¹⁹‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم بيانات تجريبية لحساب ‎L‎ في مجموعات، والطلبة يحسبون ‎L‎ ويقارنونها بالقيمة المقبولة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب العلاقة بين ‎F‎ و‎L‎ و‎e‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎F = L × e‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> احسب ‎L‎ من ‎F = 96500 C/mol‎ و‎e = 1.60 × 10⁻¹⁹ C‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎L = 6.03 × 10²³ mol⁻¹‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما القياسات اللازمة لتحديد ‎L‎ بترسيب النحاس؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: شدة التيار، والزمن، وتغير كتلة المهبط.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما قيمة شحنة الإلكترون؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎1.60 × 10⁻¹⁹ C‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> في تجربة: تيار ‎0.50 A‎ مدة ‎3860 s‎ رسب ‎0.635 g Cu‎. احسب عدد الإلكترونات المارة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Q = 1930 C‎؛ عدد الإلكترونات = ‎1930 ÷ 1.60 × 10⁻¹⁹ = 1.21 × 10²²‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أكمل التجربة السابقة لحساب ‎L‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مول ‎Cu = 0.0100‎، فمول ‎e⁻ = 0.0200‎؛ ‎L = 1.21 × 10²² ÷ 0.0200 = 6.0 × 10²³ mol⁻¹‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 97–98 وحل مسألة تحديد ‎L‎<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن ضخامة عدد أفوجادرو بأمثلة من الحياة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/chemistry/?l=13<\/p>"]}, {"axis": "
