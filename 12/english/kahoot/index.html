  st.scores.forEach(function(s,i){
    var col=document.createElement('div');col.className='col'+((st.last&&st.last.ok&&st.last.g===i)?' win':'');
    var sc=document.createElement('div');sc.className='sc';sc.textContent=s;
    var bar=document.createElement('div');bar.className='bar c'+(i%COLS);
    var r=document.createElement('div');r.className='rk';r.textContent=rk[i];
    var gain=document.createElement('div');gain.className='gain';
    if(st.last&&st.last.g===i&&st.last.ok){gain.textContent='+'+st.last.pts}
    var row=document.createElement('div');row.className='srow';row.appendChild(r);row.appendChild(sc);col.appendChild(gain);col.appendChild(row);col.appendChild(bar);ch.appendChild(col);
    var d=document.createElement('div');d.textContent=names[i];nm.appendChild(d);
    var base=Math.max(mx,1);
    var h0=8+(st.prev[i]/base)*(avail-8);
    bar.style.height=h0+'px';
    (function(bar,i){setTimeout(function(){bar.style.height=(8+(st.scores[i]/base)*(avail-8))+'px';if(gain.textContent)gain.className='gain show'},80)})(bar,i);
  });
  $('next').textContent=(st.i+1>=st.qs.length)?'Show the podium 🏅':'Next question ▶';
  show('sChart');sPop();
}
$('next').onclick=function(){st.i++;nextQ()};
/* ---------- podium ---------- */
function finish(){
  var order=names.map(function(n,i){return {n:n,s:st.scores[i],i:i}}).sort(function(a,b){return b.s-a.s});
  var rk=ranks(order.map(function(o){return o.s}));
  var pod=$('podium');pod.innerHTML='';
  var top=order.slice(0,3);
  var arrange=top.length===3?[top[1],top[0],top[2]]:(top.length===2?[top[1],top[0]]:[top[0]]);
  var rkTop=rk.slice(0,3);var rkMap=arrange.map(function(o){return rk[order.indexOf(o)]});
  var hs={1:230,2:170,3:120};var meds={1:'🥇',2:'🥈',3:'🥉'};
  var cols=['#f6dca0','#cfe3f3','#f2cfb3'];
  arrange.forEach(function(o,idx){
    var r=rkMap[idx];var d=document.createElement('div');d.className='pod';
    var n=document.createElement('div');n.className='nm';n.textContent=o.n;
    var b=document.createElement('div');b.className='blk';b.style.background=cols[Math.min(r,3)-1];
    var m=document.createElement('div');m.className='medal';m.textContent=meds[Math.min(r,3)];
    var s=document.createElement('div');s.textContent=o.s+' pts';
    b.appendChild(m);b.appendChild(s);d.appendChild(n);d.appendChild(b);pod.appendChild(d);
    setTimeout(function(){b.style.height=hs[Math.min(r,3)]+'px'},200+idx*250);
  });
  var rest=$('rest');rest.innerHTML='';
  order.forEach(function(o,i){var d=document.createElement('div');var a=document.createElement('span');a.textContent=rk[i]+'. '+o.n;var b=document.createElement('span');b.textContent=o.s;d.appendChild(a);d.appendChild(b);rest.appendChild(d)});
  show('sPod');sFanfare();confetti();
}
$('again').onclick=function(){stopConf();show('sStart')};
/* ---------- soft confetti ---------- */
var cv=$('conf'),cx=cv.getContext('2d'),parts=[],raf=null,endAt=0;
function stopConf(){if(raf)cancelAnimationFrame(raf);raf=null;cx.clearRect(0,0,cv.width,cv.height)}
function confetti(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;parts=[];
  var cols=['#9fcdf0','#f4cf8f','#a9dcbb','#d9bfe9','#f2b8b8'];
  for(var i=0;i<110;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,r:3+Math.random()*4,c:cols[i%cols.length],vy:.8+Math.random()*1.4,vx:(Math.random()-.5)*.8,rot:Math.random()*6,vr:(Math.random()-.5)*.06});
  endAt=performance.now()+6500;
  (function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
    if(performance.now()<endAt)raf=requestAnimationFrame(loop);else stopConf()})();
}
window.__test={st:st,pts:pts,build:build,norm:norm,D:D};
