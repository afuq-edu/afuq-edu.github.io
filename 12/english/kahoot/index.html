:root{--bg:#f4f9fc;--ink:#27343f;--card:#fff;--line:#d6e4ee;--blue:#dcecf9;--blue2:#35567f;--green:#dff3e6;--green2:#2f6a48;--sand:#fdf1da;--sand2:#8a6a2c;--rose:#fbe3e3;--rose2:#9a4141}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#f4f9fc,#eef6f1 55%,#fdf7ea);color:var(--ink);font-family:CairoL,CairoA,sans-serif;font-size:17px;line-height:1.6;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 28px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.top h1{font-size:20px;margin:0;color:var(--blue2)}
.icon{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 12px;cursor:pointer;color:var(--blue2)}
.screen{display:none;animation:fade .4s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 6px 22px rgba(70,110,150,.08);margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:18px;color:var(--blue2)}
label{font-weight:700;display:block;margin:6px 0 3px}
select,input[type=text],input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;border:2px solid #bcd6ea;background:#fff;color:var(--blue2);border-radius:12px;padding:6px 18px;cursor:pointer}
.chip.on{background:#d6eafa;border-color:#7fb0dd}
.gnames{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.btn{font:inherit;font-weight:700;font-size:18px;border:none;background:#8bc2ea;color:#16405f;border-radius:14px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #6aa6d0;transition:transform .12s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #6aa6d0}
.btn.alt{background:#bfe5cd;box-shadow:0 4px 0 #9ccdb0;color:#1d5a38}
.center{text-align:center}
.ready{text-align:center;padding:30px 10px}
.ready .gbig{font-size:34px;font-weight:700;color:var(--blue2);margin:10px 0}
.ready select{max-width:320px;margin:6px auto}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--blue);color:var(--blue2);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.tag.l1{background:var(--green);color:var(--green2)}.tag.l2{background:var(--sand);color:var(--sand2)}.tag.l3{background:var(--rose);color:var(--rose2)}
.qrow{display:flex;gap:16px;align-items:center}
.qtext{flex:1;direction:ltr;text-align:left;font-size:27px;font-weight:700;line-height:1.45;padding:12px 6px;color:#243746}
.timer{position:relative;width:104px;height:104px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .bg{fill:none;stroke:#e1edf5;stroke-width:9}
.timer .fg{fill:none;stroke:#7fc3a0;stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:30px;color:var(--blue2)}
.timer .num small{font-size:12px;color:#7a8a98;font-weight:400}
.timer.over .fg{stroke:#e7b46a}.timer.over .num{color:var(--sand2)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;direction:ltr}
.ans{font:inherit;font-size:22px;font-weight:700;text-align:left;border:2px solid transparent;border-radius:16px;padding:16px 18px;cursor:pointer;color:#2a3d4d;transition:transform .12s,box-shadow .2s;box-shadow:0 3px 10px rgba(60,100,140,.08)}
.ans:hover{transform:translateY(-2px)}
.ans:nth-child(1){background:#dcecf9}.ans:nth-child(2){background:#fde9cf}.ans:nth-child(3){background:#dff3e6}.ans:nth-child(4){background:#f2e4f6}
.ans.tf{text-align:center}
.ans.right{border-color:#4fae7b;box-shadow:0 0 0 4px rgba(79,174,123,.25)}
.ans.wrong{border-color:#d77;box-shadow:0 0 0 4px rgba(215,119,119,.22)}
.ans[disabled]{cursor:default;transform:none}
.short{display:flex;gap:10px;margin-top:10px;direction:ltr}
.short input{font-size:24px;padding:12px 14px}
.fbk{text-align:center;padding:18px 10px}
.fbk .big{font-size:34px;font-weight:700;margin:6px 0}
.fbk .ok{color:var(--green2)}.fbk .no{color:var(--rose2)}
.fbk .pts{font-size:46px;font-weight:700;color:var(--blue2)}
.fbk .corr{font-size:22px;direction:ltr;margin:6px 0}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:340px;padding:8px 6px 0;border-bottom:2px solid #cfe0ec}
.col{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar{width:100%;border-radius:12px 12px 4px 4px;min-height:8px;height:8px;transition:height 1.4s cubic-bezier(.2,.8,.2,1);position:relative}
.col .sc{font-weight:700;font-size:19px;color:var(--blue2)}
.srow{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.col .rk{background:#fff;border:2px solid #cfe0ec;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--blue2);z-index:2}
.col.win .bar{box-shadow:0 0 0 4px rgba(240,200,110,.55),0 0 24px rgba(240,200,110,.6)}
.col .gain{min-height:24px;direction:ltr;color:var(--green2);font-weight:700;opacity:0;transition:opacity .6s .9s}
.col .gain.show{opacity:1}
.names{display:flex;justify-content:center;gap:14px;padding-top:6px}
.names div{flex:1;max-width:150px;text-align:center;font-weight:700;font-size:15px;word-break:break-word}
.c0{background:linear-gradient(#a9d3f2,#8bbfe7)}.c1{background:linear-gradient(#f9d9a5,#f2c47c)}.c2{background:linear-gradient(#b8e3c7,#93d0aa)}.c3{background:linear-gradient(#e4cdf0,#cfb0e2)}.c4{background:linear-gradient(#f7c9c9,#eba8a8)}.c5{background:linear-gradient(#c9e5ea,#a3d1d9)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:320px;margin-top:10px}
.pod{width:150px;text-align:center}
.pod .blk{border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;font-weight:700;color:#2a3d4d;height:0;transition:height 1.6s cubic-bezier(.2,.8,.2,1)}
.pod .nm{font-size:19px;font-weight:700;margin-bottom:4px;word-break:break-word}
.pod .medal{font-size:34px}
.rest{margin-top:10px}
.rest div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin:4px auto;max-width:520px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (max-width:700px){.qrow{flex-direction:column-reverse}.qtext{font-size:22px}.answers{grid-template-columns:1fr}.chart{height:260px}.pod{width:96px}.timer{width:84px;height:84px}}
</style></head><body><canvas id="conf"></canvas><div class="wrap">
<div class="top"><h1>🏆 Kahoot Quiz – English 12A</h1><button class="icon" id="mute">🔊 Sound</button></div>

<div class="screen on" id="sStart">
 <div class="card"><h2>1 – Choose the unit and lesson</h2>
  <label for="selL">Unit</label><select id="selL"></select>
  <label for="selP">Lesson focus (its questions come first)</label><select id="selP"></select>
 </div>
 <div class="card"><h2>2 – Teams</h2>
  <div class="opts" id="gCount"></div><div class="gnames" id="gNames"></div>
 </div>
 <div class="card"><h2>3 – Number of questions (1 to 20)</h2>
  <div class="opts" id="qQuick"></div>
  <label for="qNum">Or type a number</label><input type="number" id="qNum" min="1" max="20" value="10" style="max-width:140px">
  <div id="qAvail" style="font-size:14px;color:#6a7c8b;margin-top:4px"></div>
 </div>
 <div class="center"><button class="btn" id="go">Start the contest ▶</button></div>
</div>

<div class="screen" id="sReady"><div class="card ready">
  <div class="tag" id="rProg"></div><div style="margin-top:14px">Team’s turn</div><div class="gbig" id="rGroup"></div>
  <div style="font-size:15px;color:#6a7c8b">The teacher can change the team before the question appears:</div>
  <select id="rSel"></select><div style="margin-top:16px"><button class="btn alt" id="show">Show the question ▶</button></div>
</div></div>

<div class="screen" id="sQ"><div class="card">
  <div class="hud"><span class="tag" id="qProg"></span><span class="tag" id="qLvl"></span><span class="tag" id="qGrp"></span></div>
  <div class="qrow"><div class="qtext" id="qText"></div>
   <div class="timer" id="timer"><svg width="100%" height="100%" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
   <div class="num"><span id="tNum">30</span><small id="tPts">1000 pts</small></div></div></div>
  <div id="qAns"></div>
</div></div>

<div class="screen" id="sFb"><div class="card fbk" id="fbBox"></div><div class="center"><button class="btn" id="toChart">Show the ranking 📊</button></div></div>

<div class="screen" id="sChart"><div class="card"><h2 id="chTitle">Ranking after this question</h2>
  <div class="chart" id="chart"></div><div class="names" id="chNames"></div></div>
  <div class="center"><button class="btn alt" id="next">Next question ▶</button></div></div>

<div class="screen" id="sPod"><div class="card center"><h2>🎉 Final result</h2>
  <div class="podium" id="podium"></div><div class="rest" id="rest"></div></div>

  sel.sort(function(a,b){return a.l-b.l||a._r-b._r});
  return sel;
}
$('go').onclick=function(){
  ctx();clampQ();
  var inp=$('gNames').querySelectorAll('input');names=[];for(var i=0;i<G;i++){var v=(inp[i].value||'').trim();names.push(v||('Team '+(i+1)))}
  var L=D[+selL.value];NQ=+$('qNum').value;
  st.qs=build(L,+selP.value,NQ);st.i=0;st.scores=names.map(function(){return 0});st.prev=st.scores.slice();

};
/* ---------- flow ---------- */
function nextQ(){
  if(st.i>=st.qs.length){return finish()}
  var g=st.i%G;st.group=g;
  $('rProg').textContent='Question '+(st.i+1)+' of '+st.qs.length;
  $('rGroup').textContent=names[g];
  var s=$('rSel');s.innerHTML='';names.forEach(function(n,i){var o=document.createElement('option');o.value=i;o.textContent=n;if(i===g)o.selected=true;s.appendChild(o)});

$('rSel').onchange=function(){st.group=+this.value;$('rGroup').textContent=names[st.group]};
$('show').onclick=function(){ctx();showQ()};
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9\u0600-\u06ff' ]/g,'').replace(/\s+/g,' ').trim()}
function pts(t){if(t<=30)return Math.round(1000-500*(t/30));return Math.max(100,Math.round(500-(t-30)*(400/60)))}
function showQ(){
  var q=st.qs[st.i];st.cur=q;
  $('qProg').textContent='Question '+(st.i+1)+' of '+st.qs.length;
  var lv=$('qLvl');lv.textContent=LV[q.l];lv.className='tag l'+q.l;
  $('qGrp').textContent='Turn: '+names[st.group];
  $('qText').textContent=q.q;
  var box=$('qAns');box.innerHTML='';
  if(q.t==='m'){
    var idx=shuffle(q.o.map(function(_,i){return i}));
    var wrap=document.createElement('div');wrap.className='answers';
    idx.forEach(function(oi,pos){var b=document.createElement('button');b.className='ans';b.textContent=q.o[oi];b.dataset.ok=(oi===q.a)?'1':'0';b.onclick=function(){answer(oi===q.a,q.o[q.a],wrap)};wrap.appendChild(b)});
    box.appendChild(wrap);
  }else if(q.t==='t'){
    var wrap=document.createElement('div');wrap.className='answers';
    [['True ✓',true],['False ✗',false]].forEach(function(p){var b=document.createElement('button');b.className='ans tf';b.textContent=p[0];b.dataset.ok=(p[1]===q.a)?'1':'0';b.onclick=function(){answer(p[1]===q.a,q.a?'True':'False',wrap)};wrap.appendChild(b)});
    box.appendChild(wrap);
  }else{
    var d=document.createElement('div');d.className='short';var inp=document.createElement('input');inp.type='text';inp.placeholder='Type the answer…';inp.autocomplete='off';
    var b=document.createElement('button');b.className='btn';b.textContent='Submit';
    function sub(){var v=norm(inp.value);if(!v)return;var okk=q.a.some(function(a){return norm(a)===v});answer(okk,q.a[0],null)}
    b.onclick=sub;inp.onkeydown=function(e){if(e.key==='Enter')sub()};d.appendChild(inp);d.appendChild(b);box.appendChild(d);setTimeout(function(){inp.focus()},50);
  }
  show('sQ');startTimer();
}
var CIRC=276.46;
function startTimer(){
  stopTimer();st.t0=performance.now();var tm=$('timer'),fg=$('fg');tm.className='timer';fg.style.strokeDashoffset=0;
  var lastSec=-1;
  st.timer=setInterval(function(){
    var t=(performance.now()-st.t0)/1000;
    if(t<=30){var left=30-t;$('tNum').textContent=Math.ceil(left);fg.style.strokeDashoffset=(CIRC*(t/30)).toFixed(1);tm.className='timer';
      if(left<=5&&Math.ceil(left)!==lastSec){lastSec=Math.ceil(left);sTick()}}
    else{tm.className='timer over';$('tNum').textContent='+'+Math.floor(t-30);fg.style.strokeDashoffset=0}
    $('tPts').textContent=pts(t)+' pts';
  },100);
}
function stopTimer(){if(st.timer){clearInterval(st.timer);st.timer=null}}
function answer(okk,correct,wrap){
  if(!st.timer)return;
  var t=(performance.now()-st.t0)/1000;stopTimer();
  var p=okk?pts(t):0;
  st.prev=st.scores.slice();
  if(okk)st.scores[st.group]+=p;
  st.last={ok:okk,pts:p,g:st.group,t:t,corr:correct};
  if(wrap){var bs=wrap.querySelectorAll('button');for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(bs[i].dataset.ok==='1')bs[i].className+=' right';}}
  var fb=$('fbBox');fb.innerHTML='';
  var h=document.createElement('div');h.className='big '+(okk?'ok':'no');h.textContent=okk?'✅ Correct!':'❌ Incorrect';
  var g=document.createElement('div');g.textContent=names[st.group];g.style.fontWeight='700';g.style.fontSize='22px';
  var pp=document.createElement('div');pp.className='pts';pp.textContent=(okk?'+':'')+p;
  var tt=document.createElement('div');tt.style.color='#6a7c8b';tt.textContent=okk?('Answer time: '+t.toFixed(1)+' s'):'';
  var cc=document.createElement('div');cc.className='corr';cc.textContent='Correct answer: '+correct;
  fb.appendChild(h);fb.appendChild(g);fb.appendChild(pp);if(okk)fb.appendChild(tt);fb.appendChild(cc);
  okk?sCorrect():sWrong();
  setTimeout(function(){show('sFb')},okk?700:900);
}
$('toChart').onclick=function(){drawChart()};
function ranks(arr){return arr.map(function(s){var r=1;arr.forEach(function(o){if(o>s)r++});return r})}
function drawChart(){
  var ch=$('chart'),nm=$('chNames');ch.innerHTML='';nm.innerHTML='';
  var mx=Math.max.apply(null,st.scores);var mp=Math.max.apply(null,st.prev);var rk=ranks(st.scores);
  var H=ch.clientHeight||300;var avail=H-70;
  st.scores.forEach(function(s,i){
    var col=document.createElement('div');col.className='col'+((st.last&&st.last.ok&&st.last.g===i)?' win':'');
    var sc=document.createElement('div');sc.className='sc';sc.textContent=s;
    var bar=document.createElement('div');bar.className='bar c'+(i%COLS);
    var r=document.createElement('div');r.className='rk';r.textContent=rk[i];
    var gain=document.createElement('div');gain.className='gain';
    if(st.last&&st.last.g===i&&st.last.ok){gain.textContent='+'+st.last.pts}
    var row=document.createElement('div');row.className='srow';row.appendChild(r);row.appendChild(sc);col.appendChild(gain);col.appendChild(row);col.appendChild(bar);ch.appendChild(col);
    var d=document.createElement('div');d.textContent=names[i];nm.appendChild(d);
    var base=Math.max(mx,1);
    var h0=8+(st.prev[i]/base)*(avail-8);
    bar.style.height=h0+'px';
    (function(bar,i){setTimeout(function(){bar.style.height=(8+(st.scores[i]/base)*(avail-8))+'px';if(gain.textContent)gain.className='gain show'},80)})(bar,i);
  });
  $('next').textContent=(st.i+1>=st.qs.length)?'Show the podium 🏅':'Next question ▶';
  show('sChart');sPop();
}
$('next').onclick=function(){st.i++;nextQ()};
/* ---------- podium ---------- */
function finish(){
  var order=names.map(function(n,i){return {n:n,s:st.scores[i],i:i}}).sort(function(a,b){return b.s-a.s});
  var rk=ranks(order.map(function(o){return o.s}));
  var pod=$('podium');pod.innerHTML='';
  var top=order.slice(0,3);
  var arrange=top.length===3?[top[1],top[0],top[2]]:(top.length===2?[top[1],top[0]]:[top[0]]);
  var rkTop=rk.slice(0,3);var rkMap=arrange.map(function(o){return rk[order.indexOf(o)]});
  var hs={1:230,2:170,3:120};var meds={1:'🥇',2:'🥈',3:'🥉'};
  var cols=['#f6dca0','#cfe3f3','#f2cfb3'];
  arrange.forEach(function(o,idx){
    var r=rkMap[idx];var d=document.createElement('div');d.className='pod';
    var n=document.createElement('div');n.className='nm';n.textContent=o.n;
    var b=document.createElement('div');b.className='blk';b.style.background=cols[Math.min(r,3)-1];
    var m=document.createElement('div');m.className='medal';m.textContent=meds[Math.min(r,3)];
    var s=document.createElement('div');s.textContent=o.s+' pts';
    b.appendChild(m);b.appendChild(s);d.appendChild(n);d.appendChild(b);pod.appendChild(d);
    setTimeout(function(){b.style.height=hs[Math.min(r,3)]+'px'},200+idx*250);
  });
  var rest=$('rest');rest.innerHTML='';
  order.forEach(function(o,i){var d=document.createElement('div');var a=document.createElement('span');a.textContent=rk[i]+'. '+o.n;var b=document.createElement('span');b.textContent=o.s;d.appendChild(a);d.appendChild(b);rest.appendChild(d)});
  show('sPod');sFanfare();confetti();
}
$('again').onclick=function(){stopConf();show('sStart')};
/* ---------- soft confetti ---------- */
var cv=$('conf'),cx=cv.getContext('2d'),parts=[],raf=null,endAt=0;
function stopConf(){if(raf)cancelAnimationFrame(raf);raf=null;cx.clearRect(0,0,cv.width,cv.height)}
function confetti(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;parts=[];
  var cols=['#9fcdf0','#f4cf8f','#a9dcbb','#d9bfe9','#f2b8b8'];
  for(var i=0;i<110;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,r:3+Math.random()*4,c:cols[i%cols.length],vy:.8+Math.random()*1.4,vx:(Math.random()-.5)*.8,rot:Math.random()*6,vr:(Math.random()-.5)*.06});
  endAt=performance.now()+6500;
  (function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
    if(performance.now()<endAt)raf=requestAnimationFrame(loop);else stopConf()})();
}
window.__test={st:st,pts:pts,build:build,norm:norm,D:D};
})();
