ى المتوقع] ك = 50هـ^(−0.05ز). متى تصبح ك = 25؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 2 / 0.05 ≈ 13.9\n3) [المستوى المتقدم] في النموذج ن = 100هـ^(0.3ز) متى يصبح ن = 500؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 5 / 0.3 ≈ 5.36\n\nالحصة 5: تدريبات متنوعة على الصيغتين\n1) [مستوى الدعم] اكتب هـ^3 = 20.09 بالصيغة اللوغاريتمية.\nالإجابة النموذجية: لط 20.09 = 3\n2) [المستوى المتوقع] أوجد س: هـ^(س + 1) = 4 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 4 − 1 ≈ 0.386\n3) [المستوى المتقدم] أوجد س: 2لط س = لط 49.\nالإجابة النموذجية: س = 7\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) [مستوى الدعم] هل لط(س + 2) = لط س + لط 2؟\nالإجابة النموذجية: لا\n2) [المستوى المتوقع] اكتب ص = 5هـ^س في الصيغة اللوغاريتمية.\nالإجابة النموذجية: س = لط(ص/5)\n3) [المستوى المتقدم] أوجد س: هـ^(3س) = 27 بدلالة لط.\nالإجابة النموذجية: س = لط 3", "الحصة 1: التحويل بين الصيغة الأسية والصيغة اللوغاريتمية\n1) [مستوى الدعم] اكتب هـ^0 = 1 في الصيغة اللوغاريتمية.\nالإجابة النموذجية: لط 1 = 0\n2) [المستوى المتوقع] اكتب لط س = 4 في الصيغة الأسية.\nالإجابة النموذجية: س = هـ^4\n3) [المستوى المتقدم] اكتب لط(ص + 1) = س في الصيغة الأسية.\nالإجابة النموذجية: ص + 1 = هـ^س\n\nالحصة 2: إيجاد قيم مجهولة باستخدام التحويل بين الصيغتين\n1) [مستوى الدعم] أوجد س: هـ^س = 1.\nالإجابة النموذجية: س = 0\n2) [المستوى المتوقع] أوجد س: لط س = 0.\nالإجابة النموذجية: س = 1\n3) [المستوى المتقدم] أوجد س: لط(2س) = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = هـ³/2 ≈ 10.04\n\nالحصة 3: خصائص لط هـ^س = س و هـ^(لط س) = س\n1) [مستوى الدعم] بسّط: لط هـ^7.\nالإجابة النموذجية: 7\n2) [المستوى المتوقع] بسّط: هـ^(لط 4 + لط 2).\nالإجابة النموذجية: 8\n3) [المستوى المتقدم] بسّط: هـ^(−لط 2).\nالإجابة النموذجية: 1/2\n\nالحصة 4: التطبيقات على الصيغتين في مواقف حياتية\n1) [مستوى الدعم] ما القيمة الابتدائية في ن = 100هـ^(0.3ز)؟\nالإجابة النموذجية: 100\n2) [المستوى المتوقع] أوجد ن عندما ز = 2 (لأقرب عدد صحيح).\nالإجابة النموذجية: 100هـ^0.6 ≈ 182\n3) [المستوى المتقدم] ن = 1000هـ^(−0.2ز). متى يصبح ن = 500؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 2 / 0.2 ≈ 3.47\n\nالحصة 5: تدريبات متنوعة على الصيغتين\n1) [مستوى الدعم] اكتب لط 0.5 = −0.693 بالصيغة الأسية.\nالإجابة النموذجية: هـ^(−0.693) = 0.5\n2) [المستوى المتوقع] أوجد س: هـ^(س − 2) = 1.\nالإجابة النموذجية: س = 2\n3) [المستوى المتقدم] أوجد س: لط س − لط 3 = لط 4.\nالإجابة النموذجية: س = 12\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) [مستوى الدعم] اكتب لط ص = 2 في الصيغة الأسية.\nالإجابة النموذجية: ص = هـ²\n2) [المستوى المتوقع] بسّط: هـ^(3لط 2).\nالإجابة النموذجية: 8\n3) [المستوى المتقدم] أوجد س: لط(س/2) = 1 (لأقرب منزلتين).\nالإجابة النموذجية: س = 2هـ ≈ 5.44", "الحصة 1: التحويل بين الصيغة الأسية والصيغة اللوغاريتمية\nإرشاد للطالب: حل تمارين 3-1 (1، 2) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: إيجاد قيم مجهولة باستخدام التحويل بين الصيغتين\nإرشاد للطالب: حل تمارين 3-1 (كتاب الطالب)، وتمارين 3-1 (3) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: خصائص لط هـ^س = س و هـ^(لط س) = س\nإرشاد للطالب: حل تمرين 3-1 (4) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: التطبيقات على الصيغتين في مواقف حياتية\nإرشاد للطالب: حل مسائل التطبيقات (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: تدريبات متنوعة على الصيغتين\nإرشاد للطالب: مراجعة تمارين 3-1 (كتاب الطالب) و ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس حل المعادلات الأسية واللوغاريتمية الطبيعية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة f": ["1) يحل معادلات على الصورة لط(أس + ب) = ك بالتحويل إلى الصيغة الأسية.\n2) يتحقق من أن الحل يقع في مجال الدالة اللوغاريتمية.", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "المعادلة اللوغاريتمية، التحويل إلى الصيغة الأسية، مجال اللوغاريتم", "سؤال: «إذا كان لط س = 2 فما س؟ وهل يمكن أن يكون س سالبًا؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يجيب: س = هـ².\n(12 د) النمذجة: المعلم: يحل: لط س = 2، لط(2س − 1) = 3، 3لط س = 6. | الطالب: يتابع.\n(13 د) تشاركي: المعلم: يكلف الأزواج بتمارين 4-1 (3، 4) ص 23 من كتاب النشاط. | الطالب: يحل ويتبادل.\n(5 د) تحقق: المعلم: يتحقق من الحلول بالتعويض. | الطالب: يتحقق.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: لط س = 2 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ² ≈ 7.389\n2) [المستوى المتوقع] حل: لط(2س − 1) = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = (هـ³ + 1)/2 ≈ 10.54\n3) [المستوى المتقدم] حل: 3لط س = 6.\nالإجابة النموذجية: س = هـ² ≈ 7.389", "1) [مستوى الدعم] حل: لط س = 0.\nالإجابة النموذجية: س = 1\n2) [المستوى المتوقع] حل: لط(س + 4) = 1 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ − 4 ≈ −1.282\n3) [المستوى المتقدم] حل: لط(س²) = 4 حيث س > 0 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ² ≈ 7.389", "إرشاد للطالب: حل تمارين 4-1 (3، 4) ص 23 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "معادلات تتضمن أكثر من حد لوغاريتمي", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يستخدم قوانين اللوغاريتمات لدمج الحدود ثم يحل المعادلة.\n2) يستبعد الحلول التي تجعل اللوغاريتم غير معرّف.", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "دمج اللوغاريتمات، المعادلة التربيعية الناتجة، الحلول المرفوضة", "سؤال: «كيف نحل لط س + لط(س + 2) = لط 8؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يقترح الدمج.\n(12 د) النمذجة: المعلم: يحل: لط س + لط(س + 2) = لط 8، لط(س − 1) + لط 3 = لط(س + 1). | الطالب: يتابع.\n(13 د) تعاوني: المعلم: يكلف بمسائل مشابهة من كتاب النشاط ص 23. | الطالب: تحل المجموعات.\n(5 د) مناقشة: المعلم: يناقش الحلول المرفوضة. | الطالب: يبرر.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: لط س + لط(س + 2) = لط 8.\nالإجابة النموذجية: س(س + 2) = 8 ← س = 2 (س = −4 مرفوض)\n2) [المستوى المتوقع] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: 3(س − 1) = س + 1 ← س = 2\n3) [المستوى المتقدم] لماذا نرفض س = −4 في المعادلة الأولى؟\nالإجابة النموذجية: لأن لط(−4) غير معرّف", "1) [مستوى الدعم] حل: لط(2س) = لط 10.\nالإجابة النموذجية: س = 5\n2) [المستوى المتوقع] حل: لط س − لط 2 = لط 6.\nالإجابة النموذجية: س = 12\n3) [المستوى المتقدم] حل: 2لط س = لط(س + 6).\nالإجابة النموذجية: س² = س + 6 ← س = 3 (س = −2 مرفوض)", "إرشاد للطالب: حل تمارين 4-1 (5) ص 23 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "معادلات أسية في صورة تربيعية", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يحل معادلات مثل هـ^(2س) − 5هـ^س + 6 = 0 بالتعويض ص = هـ^س.\n2) يستبعد الحلول المرفوضة (هـ^س ≤ 0).", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "التعويض ص = هـ^س، المعادلة التربيعية، هـ^(2س) = (هـ^س)²", "سؤال: «ما العلاقة بين هـ^(2س) و (هـ^س)²؟»", "(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يجيب: متساويان.\n(12 د) النمذجة: المعلم: يحل: هـ^(2س) − 5هـ^س + 6 = 0، هـ^(2س) − هـ^س − 2 = 0. | الطالب: يتابع.\n(13 د) تشاركي: المعلم: يكلف الأزواج بتمارين 4-1 (6) ص 24 من كتاب النشاط. | الطالب: يحل.\n(5 د) مناقشة: المعلم: يناقش الحلول المرفوضة. | الطالب: يبرر.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: هـ^(2س) − 5هـ^س + 6 = 0.\nالإجابة النموذجية: هـ^س = 2 أو 3 ← س = لط 2 أو لط 3\n2) [المستوى المتوقع] حل: هـ^(2س) − هـ^س − 2 = 0.\nالإجابة النموذجية: هـ^س = 2 (−1 مرفوض) ← س = لط 2\n3) [المستوى المتقدم] لماذا لا يكون للمعادلة هـ^س = −1 حل؟\nالإجابة النموذجية: لأن هـ^س > 0 دائمًا", "1) [مستوى الدعم] حل: (هـ^س)² = 9.\nالإجابة النموذجية: هـ^س = 3 ← س = لط 3\n2) [المستوى المتوقع] حل: هـ^(2س) − 4هـ^س = 0.\nالإجابة النموذجية: هـ^س = 4 ← س = لط 4\n3) [المستوى المتقدم] حل: هـ^س + 6هـ^(−س) = 5.\nالإجابة النموذجية: هـ^(2س) − 5هـ^س + 6 = 0 ← س = لط 2 أو لط 3", "إرشاد للطالب: حل تمارين 4-1 (6، 7) ص 24 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "تطبيقات حياتية على حل المعادلات الأسية", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يحل مسائل حياتية (نمو سكاني، اضمحلال إشعاعي، تناقص الحشرات) بحل معادلات أسية.\n2) يفسر الحل ويقربه بما يناسب السياق.", "المخرج 1: تحليل\nالمخرج 2: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "النمو والاضمحلال، الزمن اللازم، التقريب المناسب للسياق", "مسألة كتاب النشاط ص 24: تتناقص أعداد مستعمرة حشرات وفق صيغة أسية؛ متى يصل العدد إلى قيمة معينة؟", "(5 د) التهيئة: المعلم: يعرض المسألة. | الطالب: يحدد المعطيات.\n(12 د) النمذجة: المعلم: يحل مسألة الحشرات ومسألة نمو. | الطالب: يتابع.\n(13 د) حل مشكلات تعاوني: المعلم: يوزع مسائل كتاب النشاط تمرين 8 ص 24 ومسائل مشابهة. | الطالب: تحل وتفسر.\n(5 د) عرض: المعلم: تعرض المجموعات. | الطالب: يعرض.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ل = 50000هـ^(−0.04ز). متى يصبح ل = 25000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 2 / 0.04 ≈ 17.3\n2) [المستوى المتوقع] ن = 500هـ^(0.2ز). متى يصبح ن = 1  20 (لأقرب 3 منازل).\nالإجابة النموذجية: س = ¼ لط 20 ≈ 0.749", "إرشاد للطالب: إكمال تمارين 4-1 من كتاب النشاط والاستعداد لدرس تحويل علاقة إلى صيغة خطية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}], "c": ["الحصة 1: حل معادلات أسية طبيعية بسيطة\n1) يحل معادلات على الصورة أ هـ^(ك س) = ب بأخذ اللوغاريتم الطبيعي للطرفين.\n2) يعطي الحل بالقيمة الدقيقة وبالتقريب المطلوب.\n\nالحصة 2: حل معادلات لوغاريتمية طبيعية\n1) يحل معادلات على الصورة لط(أس + ب) = ك بالتحويل إلى الصيغة الأسية.\n2) يتحقق من أن الحل يقع في مجال الدالة اللوغاريتمية.\n\nالحصة 3: معادلات تتضمن أكثر من حد لوغاريتمي\n1) يستخدم قوانين اللوغاريتمات لدمج الحدود ثم يحل المعادلة.\n2) يستبعد الحلول التي تجعل اللوغاريتم غير معرّف.\n\nالحصة 4: معادلات أسية في صورة تربيعية\n1) يحل معادلات مثل هـ^(2س) − 5هـ^س + 6 = 0 بالتعويض ص = هـ^س.\n2) يستبعد الحلول المرفوضة (هـ^س ≤ 0).\n\nالحصة 5: تطبيقات حياتية على حل المعادلات الأسية\n1) يحل مسائل حياتية (نمو سكاني، اضمحلال إشعاعي، تناقص الحشرات) بحل معادلات أسية.\n2) يفسر الحل ويقربه بما يناسب السياق.\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) يحل معادلات أسية ولوغاريتمية طبيعية متنوعة.\n2) يقيّم صحة الحلول بالتعويض.", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 2: حل معادلات لوغاريتمية طبيعية\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 3: معادلات تتضمن أكثر من حد لوغاريتمي\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 4: معادلات أسية في صورة تربيعية\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 5: تطبيقات حياتية على حل المعادلات الأسية\nالمخرج 1: تحليل\nالمخرج 2: تحليل\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تقييم", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nالتعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي\n\nالحصة 2: حل معادلات لوغاريتمية طبيعية\nالتعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: معادلات تتضمن أكثر من حد لوغاريتمي\nالتعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني\n\nالحصة 4: معادل يب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 5: تطبيقات حياتية على حل المعادلات الأسية\n(5 د) التهيئة: المعلم: يعرض المسألة. | الطالب: يحدد المعطيات.\n(12 د) النمذجة: المعلم: يحل مسألة الحشرات ومسألة نمو. | الطالب: يتابع.\n(13 د) حل مشكلات تعاوني: المعلم: يوزع مسائل كتاب النشاط تمرين 8 ص 24 ومسائل مشابهة. | الطالب: تحل وتفسر.\n(5 د) عرض: المعلم: تعرض المجموعات. | الطالب: يعرض.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n(5 د) التهيئة: المعلم: يعرض النشاط. | الطالب: يحل ويتحقق.\n(15 د) تعاوني بالمستويات: المعلم: يكلف بإكمال تمارين 4-1 ص ⁦22–24⁩ من كتاب النشاط. | الطالب: يحل حسب مستواه.\n(12 د) تصويب: المعلم: يناقش. | الطالب: يصحح.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس حل المعادلات الأسية واللوغاريتمية الطبيعية. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: حل معادلات أسية طبيعية بسيطة\n1) [مستوى الدعم] حل: هـ^س = 5 (بالقيمة الدقيقة).\nالإجابة النموذجية: س = لط 5\n2) [المستوى المتوقع] حل: 3هـ^س − 2 = 10 (لأقرب 3 منازل).\nالإجابة النموذجية: هـ^س = 4 ← س = لط 4 ≈ 1.386\n3) [المستوى المتقدم] حل: هـ^(2س) = 7 (لأقرب 3 منازل).\nالإجابة النموذجية: س = ½ لط 7 ≈ 0.973\n\nالحصة 2: حل معادلات لوغاريتمية طبيعية\n1) [مستوى الدعم] حل: لط س = 2 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ² ≈ 7.389\n2) [المستوى المتوقع] حل: لط(2س − 1) = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = (هـ³ + 1)/2 ≈ 10.54\n3) [المستوى المتقدم] حل: 3لط س = 6.\nالإجابة النموذجية: س = هـ² ≈ 7.389\n\nالحصة 3: معادلات تتضمن أكثر من حد لوغاريتمي\n1) [مستوى الدعم] حل: لط س + لط(س + 2) = لط 8.\nالإجابة النموذجية: س(س + 2) = 8 ← س = 2 (س = −4 مرفوض)\n2) [المستوى المتوقع] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: 3(س − 1) = س + 1 ← س = 2\n3) [المستوى المتقدم] لماذا نرفض س = −4 في المعادلة الأولى؟\nالإجابة النموذجية: لأن لط(−4) غير معرّف\n\nالحصة 4: معادلات أسية في صورة تربيعية\n1) [مستوى الدعم] حل: هـ^(2س) − 5هـ^س + 6 = 0.\nالإجابة النموذجية: هـ^س = 2 أو 3 ← س = لط 2 أو لط 3\n2) [المستوى المتوقع] حل: هـ^(2س) − هـ^س − 2 = 0.\nالإجابة النموذجية: هـ^س = 2 (−1 مرفوض) ← س = لط 2\n3) [المستوى المتقدم] لماذا لا يكون للمعادلة هـ^س = −1 حل؟\nالإجابة النموذجية: لأن هـ^س > 0 دائمًا\n\nالحصة 5: تطبيقات حياتية على حل المعادلات الأسية\n1) [مستوى الدعم] ل = 50000هـ^(−0.04ز). متى يصبح ل = 25000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 2 / 0.04 ≈ 17.3\n2) [المستوى المتوقع] ن = 500هـ^(0.2ز). متى يصبح ن = 1000؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 2 / 0.2 ≈ 3.47\n3) [المستوى المتقدم] في النموذج الأول، متى يصبح ل = 10000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 5 / 0.04 ≈ 40.2\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) [مستوى الدعم] حل: هـ^(س + 2) = 5 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 5 − 2 ≈ −0.391\n2) [المستوى المتوقع] حل: لط(3س) = 2 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ²/3 ≈ 2.463\n3) [المستوى المتقدم] حل: لط(س + 1) + لط(س − 1) = لط 8.\nالإجابة النموذجية: س² − 1 = 8 ← س = 3", "الحصة 1: حل معادلات أسية طبيعية بسيطة\n1) [مستوى الدعم] حل: هـ^س = 1.\nالإجابة النموذجية: س = 0\n2) [المستوى المتوقع] حل: 2هـ^س = 18 بالقيمة الدقيقة.\nالإجابة النموذجية: س = لط 9\n3) [المستوى المتقدم] حل: هـ^(س − 1) = 6 (لأقرب 3 منازل).\nالإجابة النموذجية: س = 1 + لط 6 ≈ 2.792\n\nالحصة 2: حل معادلات لوغاريتمية طبيعية\n1) [مستوى الدعم] حل: لط س = 0.\nالإجابة النموذجية: س = 1\n2) [المستوى المتوقع] حل: لط(س + 4) = 1 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ − 4 ≈ −1.282\n3) [المستوى المتقدم] حل: لط(س²) = 4 حيث س > 0 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ² ≈ 7.389\n\nالحصة 3: معادلات تتضمن أكثر من حد لوغاريتمي\n1) [مستوى الدعم] حل: لط(2س) = لط 10.\nالإجابة النموذجية: س = 5\n2) [المستوى المتوقع] حل: لط س − لط 2 = لط 6.\nالإجابة النموذجية: س = 12\n3) [المستوى المتقدم] حل: 2لط س = لط(س + 6).\nالإجابة النموذجية: س² = س + 6 ← س = 3 (س = −2 مرفوض)\n\nالحصة 4: معادلات أسية في صورة تربيعية\n1) [مستوى الدعم] حل: (هـ^س)² = 9.\nالإجابة النموذجية: هـ^س = 3 ← س = لط 3\n2) [المستوى المتوقع] حل: هـ^(2س) − 4هـ^س = 0.\nالإجابة النموذجية: هـ^س = 4 ← س = لط 4\n3) [المستوى المتقدم] حل: هـ^س + 6هـ^(−س) = 5.\nالإجابة النموذجية: هـ^(2س) − 5هـ^س + 6 = 0 ← س = لط 2 أو لط 3\n\nالحصة 5: تطبيقات حياتية على حل المعادلات الأسية\n1) [مستوى الدعم] ن = 200هـ^(0.1ز). أوجد ن عندما ز = 0.\nالإجابة النموذجية: 200\n2) [المستوى المتوقع] متى يصبح ن = 600 في النموذج السابق؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 3 / 0.1 ≈ 11.0\n3) [المستوى المتقدم] ك = 80هـ^(−0.5ز). متى تصبح ك = 20؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 4 / 0.5 ≈ 2.77\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) [مستوى الدعم] حل: 5هـ^س = 5.\nالإجابة النموذجية: س = 0\n2) [المستوى المتوقع] حل: لط(س − 3) = 0.\nالإجابة النموذجية: س = 4\n3) [المستوى المتقدم] حل: هـ^(4س) = 20 (لأقرب 3 منازل).\nالإجابة النموذجية: س = ¼ لط 20 ≈ 0.749", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nإرشاد للطالب: حل تمارين 4-1 (1، 2) ص 22 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: حل معادلات لوغاريتمية طبيعية\nإرشاد للطالب: حل تمارين 4-1 (3، 4) ص 23 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: معادلات تتضمن أكثر من حد لوغاريتمي\nإرشاد للطالب: حل تمارين 4-1 (5) ص 23 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: معادلات أسية في صورة تربيعية\nإرشاد للطالب: حل تمارين 4-1 (6، 7) ص 24 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: تطبيقات حياتية على حل المعادلات الأسية\nإرشاد للطالب: حل تمرين 4-1 (8) ص 24 من كتاب النشاط ومسائل التطبيقات (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nإرشاد للطالب: إكمال تمارين 4-1 من كتاب النشاط والاستعداد لدرس تحويل علاقة إلى صيغة خطية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"id": "5-1", "title": "تحويل علاقة إلى صيغة خطية باستخدام اللوغاريتم الطبيعي", "unit": "الوحدة الأولى: الأسس واللوغاريتمات الطبيعية", "sbp": "الأمثلة، تمارين 5-1، مراجعة الوحدة", "wbp": "⁦25–28⁩", "p": [{"t": "الصيغة الخطية وتحويل ص = ك هـ^(أس)", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يحول العلاقة ص = ك هـ^(أس) إلى الصيغة الخطية لط ص = أ س + لط ك.\n2) يحدد المتغيرين المرسومين والميل والمقطع الصادي.", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، عروض تقديمية", "الصيغة الخطية ص = م س + ج، المتغيران الجديدان، الميل، المقطع الصادي", "مراجعة معادلة المستقيم ص = م س + ج: ما الميل والمقطع في ص = 3س − 2؟", "(5 د) التهيئة: المعلم: يراجع المعادلة. | الطالب: يجيب.\n(12 د) النمذجة: المعلم: يعرض شرائح التحويل من دليل المعلم ويحول ص = ك هـ^(أس) إلى لط ص = أ س + لط ك. | الطالب: يتابع ويدون المتغيرات.\n(10 د) تعاوني: المعلم: يكلف بتحويل ص = 3هـ^(2س) و ص = 5هـ^(−س). | الطالب: تحول المجموعات.\n(8 د) فردي: المعلم: تمرين 5-1 (1) ص 25 من كتاب النشاط. | الطالب: يحل.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حوّل ص = 3هـ^(2س) إلى الصيغة الخطية.\nالإجابة النموذجية: لط ص = 2س + لط 3\n2) [المستوى المتوقع] في الصيغة السابقة ما الميل والمقطع الصادي؟\nالإجابة النموذجية: الميل 2، المقطع لط 3\n3) [المستوى المتقدم] ما المتغيران المرسومان على المحورين؟\nالإجابة النموذجية: س على الأفقي و لط ص على الرأسي", "1) [مستوى الدعم] حوّل ص = 5هـ^(−س) إلى الصيغة الخطية.\nالإجابة النموذجية: لط ص = −س + لط 5\n2) [المستوى المتوقع] ما الميل في الصيغة السابقة؟\nالإجابة النموذجية: −1\n3) [المستوى المتقدم] إذا كانت الصيغة الخطية لط ص = 4س + 2، فما ك و أ في ص = ك اوني، التعلم الذاتي، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "مفاهيم الوحدة الأولى", "يقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الأولى (كتاب الطالب).", "(5 د) التهيئة: المعلم: يوزع قائمة التحقق. | الطالب: يقيّم نفسه.\n(8 د) خريطة مفاهيم: المعلم: يبني مع الطلبة خريطة مفاهيم للوحدة. | الطالب: يكمل.\n(17 د) تعاوني بالمستويات: المعلم: يكلف بتمارين مراجعة نهاية الوحدة الأولى (كتاب الطالب). | الطالب: يحل حسب مستواه.\n(5 د) مناقشة: المعلم: يناقش الأخطاء الشائعة. | الطالب: يصحح.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: س = 2\n2) [المستوى المتوقع] حل: هـ^(2س) = 15 (لأقرب منزلتين).\nالإجابة النموذجية: س = ½ لط 15 ≈ 1.35\n3) [المستوى المتقدم] حوّل ص = 4هـ^(3س) إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 3س + لط 4", "1) [مستوى الدعم] بسّط: لط هـ^4 + هـ^(لط 2).\nالإجابة النموذجية: 4 + 2 = 6\n2) [المستوى المتوقع] أوجد معكوس د(س) = هـ^(2س) + 1.\nالإجابة النموذجية: د⁻¹(س) = ½ لط(س − 1)\n3) [المستوى المتقدم] حل: هـ^(2س) − 3هـ^س + 2 = 0.\nالإجابة النموذجية: هـ^س = 1 أو 2 ← س = 0 أو لط 2", "إرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الأولى (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}, {"t": "مراجعة الوحدة الأولى (2) ومسابقة الختام", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط.\n2) يتعاون مع مجموعته في التنافس العلمي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مفاهيم الوحدة الأولى", "سؤال «صحح الخطأ»: حل طالب لط س = 3 فكتب س = 3هـ. ما الخطأ؟", "(5 د) التهيئة: المعلم: يعرض الخطأ. | الطالب: يصحح: س = هـ³.\n(20 د) كتاب النشاط: المعلم: يكلف بتمارين مراجعة نهاية الوحدة الأولى ص ⁦26–28⁩ من كتاب النشاط. | الطالب: يحل ويناقش.\n(5 د) تصويب: المعلم: يعرض الحلول. | الطالب: يصحح.\n(10 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس تحويل علاقة إلى صيغة خطية ومراجعة الوحدة الأولى. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] حل: لط س = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = هـ³ ≈ 20.09\n2) [المستوى المتوقع] حل: لط(س − 1) + لط 2 = لط(س + 1).\nالإجابة النموذجية: 2(س − 1) = س + 1 ← س = 3\n3) [المستوى المتقدم] ف(س) = 3هـ^(−س). معكوسها ف⁻¹(س) = ج − لط س. أوجد ج (لأقرب منزلتين).\nالإجابة النموذجية: ف⁻¹(س) = لط 3 − لط س ← ج = لط 3 ≈ 1.10", "1) [مستوى الدعم] حل: هـ^(س) = 0.5 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 0.5 ≈ −0.693\n2) [المستوى المتوقع] حوّل ل = 400هـ^(−0.2ز) إلى صيغة خطية.\nالإجابة النموذجية: لط ل = −0.2ز + لط 400\n3) [المستوى المتقدم] حل: 2هـ^(2س) = 50 بالقيمة الدقيقة.\nالإجابة النموذجية: س = ½ لط 25 = لط 5", "إرشاد للطالب: إكمال تمارين المراجعة في كتاب النشاط ص ⁦26–28⁩، والاستعداد لاختبار قصير في الوحدة الأولى.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}], "c": ["الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\n1) يحول العلاقة ص = ك هـ^(أس) إلى الصيغة الخطية لط ص = أ س + لط ك.\n2) يحدد المتغيرين المرسومين والميل والمقطع الصادي.\n\nالحصة 2: تحويل العلاقتين ص = ك س^ن و ص = ك أ^س\n1) يحول ص = ك س^ن إلى لط ص = ن لط س + لط ك.\n2) يحول ص = ك أ^س إلى لط ص = (لط أ) س + لط ك.\n\nالحصة 3: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\n1) يجد الثوابت المجهولة ك، أ، ن من ميل المستقيم ومقطعه الصادي.\n2) يجد معادلة المستقيم من نقطتين على التمثيل البياني الخطي.\n\nالحصة 4: نمذجة بيانات حقيقية بالتحويل الخطي\n1) يحول جدول بيانات إلى قيم لط ص (ولط س) ويرسمها لاختبار الخطية.\n2) يقدّر الثوابت من أفضل مستقيم ويكتب النموذج.\n\nالحصة 5: مراجعة الوحدة الأولى (1)\n1) يراجع مهارات الوحدة الأولى: هـ ولط وقوانينهما، المعكوس، المعادلات، التحويل الخطي.\n2) يحل مسائل مراجعة متنوعة.\n\nالحصة 6: مراجعة الوحدة الأولى (2) ومسابقة الخت : يدير مسابقة المجموعات على درس تحويل علاقة إلى صيغة خطية ومراجعة الوحدة الأولى. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\n1) [مستوى الدعم] حوّل ص = 3هـ^(2س) إلى الصيغة الخطية.\nالإجابة النموذجية: لط ص = 2س + لط 3\n2) [المستوى المتوقع] في الصيغة السابقة ما الميل والمقطع الصادي؟\nالإجابة النموذجية: الميل 2، المقطع لط 3\n3) [المستوى المتقدم] ما المتغيران المرسومان على المحورين؟\nالإجابة النموذجية: س على الأفقي و لط ص على الرأسي\n\nالحصة 2: تحويل العلاقتين ص = ك س^ن و ص = ك أ^س\n1) [مستوى الدعم] حوّل ص = 2س³ إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 3 لط س + لط 2\n2) [المستوى المتوقع] حوّل ص = 5 × 3^س إلى صيغة خطية.\nالإجابة النموذجية: لط ص = (لط 3) س + لط 5\n3) [المستوى المتقدم] في ص = 2س³ ما المتغيران المرسومان؟\nالإجابة النموذجية: لط س أفقيًا و لط ص رأسيًا\n\nالحصة 3: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\n1) [مستوى الدعم] مستقيم لط ص مقابل س ميله 0.5 ومقطعه 1.2. اكتب ص بدلالة س.\nالإجابة النموذجية: ص = هـ^1.2 هـ^(0.5س) ≈ 3.32هـ^(0.5س)\n2) [المستوى المتوقع] مستقيم لط ص مقابل لط س ميله 2 ومقطعه 0.7. أوجد ن و ك في ص = ك س^ن.\nالإجابة النموذجية: ن = 2، ك = هـ^0.7 ≈ 2.01\n3) [المستوى المتقدم] مستقيم لط ص مقابل س يمر بـ (1، 3) و (3، 7). أوجد الميل والمقطع.\nالإجابة النموذجية: الميل 2، المقطع 1\n\nالحصة 4: نمذجة بيانات حقيقية بالتحويل الخطي\n1) [مستوى الدعم] لماذا نرسم لط ص مقابل س لاختبار العلاقة ص = ك هـ^(أس)؟\nالإجابة النموذجية: لأنها تصبح خطية: لط ص = أ س + لط ك\n2) [المستوى المتوقع] إذا كانت نقاط لط ص مقابل س على مستقيم ميله 0.4 ومقطعه 2، فاكتب النموذج.\nالإجابة النموذجية: ص = هـ² هـ^(0.4س) ≈ 7.39هـ^(0.4س)\n3) [المستوى المتقدم] إذا كانت نقاط لط ص مقابل لط س على مستقيم، فما نوع العلاقة؟\nالإجابة النموذجية: علاقة قوة ص = ك س^ن\n\nالحصة 5: مراجعة الوحدة الأولى (1)\n1) [مستوى الدعم] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: س = 2\n2) [المستوى المتوقع] حل: هـ^(2س) = 15 (لأقرب منزلتين).\nالإجابة النموذجية: س = ½ لط 15 ≈ 1.35\n3) [المستوى المتقدم] حوّل ص = 4هـ^(3س) إلى صيغة خطية.\n ة: المعلم: يحل المثال 2 (كتاب الطالب): مشتقة 1/س، √س، 2/س³. | الطالب: يتابع.\n(13 د) تشاركي: المعلم: يكلف الأزواج بتمرين 1-2 (2) ص 30 من كتاب النشاط. | الطالب: يحل ويتبادل.\n(5 د) تصويب: المعلم: يناقش الأخطاء (طرح 1 من الأس السالب). | الطالب: يصحح.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 4: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\n(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يتوقع.\n(12 د) النمذجة: المعلم: يحل المثالين 3، 4 (كتاب الطالب). | الطالب: يتابع.\n(13 د) تعاوني: المعلم: يكلف بتمارين 1-2 (كتاب الطالب) (المجموع وفك الأقواس). | الطالب: تحل المجموعات.\n(5 د) فردي: المعلم: تمرين 1-2 (3) ص 30 من كتاب النشاط. | الطالب: يحل.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 5: تدريبات متنوعة على الاشتقاق\n(5 د) التهيئة: المعلم: ينفذ النشاط. | الطالب: يجيب على السبورات.\n(15 د) تعاوني بالمستويات: المعلم: يوزع أوراق عمل متدرجة. | الطالب: يحل حسب مستواه.\n(10 د) تقييم الأقران: المعلم: تتبادل المجموعات الأوراق. | الطالب: يقيّم.\n(5 د) تلخيص: المعلم: يلخص الأخطاء الشائعة. | الطالب: يدون.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n(5 د) التهيئة: المعلم: يعرض الخطأ. | الطالب: يصحح: −1/س².\n(15 د) تعاوني: المعلم: يكلف بمراجعة شاملة على الدرس. | الطالب: يحل.\n(12 د) تصويب: المعلم: يناقش. | الطالب: يصحح.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس المشتقة الأولى. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: ميل المماس ومفهوم المشتقة\n1) [مستوى الدعم] ماذا يمثل ميل المنحنى عند نقطة؟\nالإجابة النموذجية: ميل المماس عند تلك النقطة\n2) [المستوى المتوقع] إذا كان ميل ص = س² يساوي 2س، فما الميل عند س = 3؟\nالإجابة النموذجية: 6\n3) [المستوى المتقدم] اكتب رمزين للمشتقة الأولى.\nالإجابة النموذجية: د′(س) و دص/دس\n\nالحصة 2: قاعدة مشتقة القوة\n1) [مستوى الدعم] أوجد مشتقة ص = س⁴.\nالإجابة النموذجية: 4س³\n2) [المستوى المتوقع] أوجد مشتقة ص = س.\nالإجابة النموذجية: 1\n3) [المستوى المتقدم] أوجد مشتقة ص = س^10.\nالإجابة النموذجية: 10س⁹\n\nالحصة 3: مشتقة الأسس السالبة والكسرية\n1) [مستوى الدعم] اكتب 1/س² في صورة أسية ثم اشتقها.\nالإجابة النموذجية: س^(−2) ← −2س^(−3) = −2/س³\n2) [المستوى المتوقع] أوجد مشتقة ص = √س.\nالإجابة النموذجية: ½ س^(−½) = 1/(2√س)\n3) [المستوى المتقدم] أوجد مشتقة ص = س^(3/2).\nالإجابة النموذجية: (3/2) س^(½)\n\nالحصة 4: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\n1) [مستوى الدعم] أوجد مشتقة ص = 3س² − 4س + 7.\nالإجابة النموذجية: 6س − 4\n2) [المستوى المتوقع] أوجد مشتقة ص = (س + 1)(س − 2).\nالإجابة النموذجية: ص = س² − س − 2 ← 2س − 1\n3) [المستوى المتقدم] أوجد مشتقة ص = (س³ + س)/س.\nالإجابة النموذجية: ص = س² + 1 ← 2س\n\nالحصة 5: تدريبات متنوعة على الاشتقاق\n1) [مستوى الدعم] أوجد مشتقة ص = 6√س.\nالإجابة النموذجية: 3/√س\n2) [المستوى المتوقع] أوجد مشتقة ص = س²(س − 3).\nالإجابة النموذجية: ص = س³ − 3س² ← 3س² − 6س\n3) [المستوى المتقدم] أوجد مشتقة ص = (2س + 1)².\nالإجابة النموذجية: ص = 4س² + 4س + 1 ← 8س + 4\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) [مستوى الدعم] أوجد مشتقة ص = 1/س.\nالإجابة النموذجية: −1/س²\n2) [المستوى المتوقع] أوجد مشتقة ص = 5س³ − 2س + 9.\nالإجابة النموذجية: 15س² − 2\n3) [المستوى المتقدم] أوجد مشتقة ص = (س² + 4)/س.\nالإجابة النموذجية: 1 − 4/س²", "الحصة 1: ميل المماس ومفهوم المشتقة\n1) [مستوى الدعم] احسب ميل المستقيم المار بـ (1، 2) و (3، 8).\nالإجابة النموذجية: 3\n2) [المستوى المتوقع] ما ميل ص = س² عند س = −1؟\nالإجابة النموذجية: −2\n3) [المستوى المتقدم] ماذا يعني أن دص/دس = 0 عند نقطة؟\nالإجابة النموذجية: المماس أفقي عند تلك النقطة\n\nالحصة 2: قاعدة مشتقة القوة\n1) [مستوى الدعم] أوجد مشتقة ص = س⁶.\nالإجابة النموذجية: 6س⁵\n2) [المستوى المتوقع] أوجد مشتقة ص = 7 (ثابت).\nالإجابة النموذجية: 0\n3) [المستوى المتقدم] أوجد مشتقة ص = س².\nالإجابة النموذجية: 2س\n\nالحصة 3: مشتقة الأسس السالبة والكسرية\n1) [مستوى الدعم] أوجد مشتقة ص = 1/س.\nالإجابة النموذجية: −1/س²\n2) [المستوى المتوقع] أوجد مشتقة ص = س^(−3).\nالإجابة النموذجية: −3س^(−4)\n3) [المستوى المتقدم] أوجد مشتقة ص = ∛س.\nالإجابة النموذجية: (1/3) س^(−2/3)\n\nالحصة 4: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\n1) [مستوى الدعم] أوجد مشتقة ص = 5س².\nالإجابة النموذجية: 10س\n2) [المستوى المتوقع] أوجد مشتقة ص = 2س³ + 6س.\nالإجابة النموذجية: 6س² + 6\n3) [المستوى المتقدم] أوجد مشتقة ص = 4/س + س.\nالإجابة النموذجية: −4/س² + 1\n\nالحصة 5: تدريبات متنوعة على الاشتقاق\n1) [مستوى الدعم] أوجد مشتقة ص = −3س.\nالإجابة النموذجية: −3\n2) [المستوى المتوقع] أوجد مشتقة ص = س⁴ − 2س² + 1.\nالإجابة النموذجية: 4س³ − 4س\n3) [المستوى المتقدم] أوجد مشتقة ص = 3/س².\nالإجابة النموذجية: −6/س³\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) [مستوى الدعم] أوجد مشتقة ص = س^8.\nالإجابة النموذجية: 8س⁷\n2) [المستوى المتوقع] أوجد مشتقة ص = 10.\nالإجابة النموذجية: 0\n3) [المستوى المتقدم] أوجد مشتقة ص = 2س^(½).\nالإجابة النموذجية: س^(−½) = 1/√س", "الحصة 1: ميل المماس ومفهوم المشتقة\nإرشاد للطالب: مراجعة استكشف 1 (كتاب الطالب)، وحل تمرين 1-2 (1) ص 29 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: قاعدة مشتقة القوة\nإرشاد للطالب: حل تمارين 1-2 (كتاب الطالب) على قاعدة القوة.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: مشتقة الأسس السالبة والكسرية\nإرشاد للطالب: حل تمرين 1-2 (2) ص 30 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\nإرشاد للطالب: حل تمارين 1-2 (كتاب الطالب)، وتمرين 1-2 (3) ص 30 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: تدريبات متنوعة على الاشتقاق\nإرشاد للطالب: إكمال تمارين 1-2 (كتاب الطالب) وكتاب الن تام درس الميل عند نقطة ومسابقة الختام", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يطبق مهارات الدرس في حل تمارين متنوعة.\n2) يتعاون مع مجموعته في التنافس العلمي.", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الميل عند نقطة", "سؤال «صحح الخطأ»: لإيجاد ميل ص = س² عند (3، 9) عوّض طالب س = 9 في 2س. ما الخطأ؟", "(5 د) التهيئة: المعلم: يعرض الخطأ. | الطالب: يصحح: نعوض س = 3 فالميل 6.\n(15 د) تعاوني: المعلم: مراجعة شاملة لتمارين 2-2. | الطالب: يحل.\n(12 د) تصويب: المعلم: يناقش. | الطالب: يصحح.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس الميل عند نقطة. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] أوجد ميل ص = س² عند (3، 9).\nالإجابة النموذجية: 6\n2) [المستوى المتوقع] أوجد النقطة على ص = س³ التي ميلها 3 وس > 0.\nالإجابة النموذجية: (1، 1)\n3) [المستوى المتقدم] أوجد أ إذا كان ميل ص = س² + أ عند س = 1 يساوي 2.\nالإجابة النموذجية: أي قيمة؛ الميل لا يعتمد على أ", "1) [مستوى الدعم] أوجد ميل ص = 4س² عند س = −1.\nالإجابة النموذجية: −8\n2) [المستوى المتوقع] أوجد ميل ص = √س عند س = 1.\nالإجابة النموذجية: ½\n3) [المستوى المتقدم] أوجد النقطة على ص = س² − 8س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (4، −16)", "إرشاد للطالب: الاستعداد لدرس معادلة المماس.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}], "c": ["الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\n1) يجد ميل المنحنى عند نقطة بالتعويض بالإحداثي السيني في دالة الميل.\n2) يربط إشارة الميل بشكل المنحنى عند النقطة.\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\n1) يجد الميل عند نقطة لدوال بأسس سالبة وكسرية.\n2) يعطي الإجابة بالقيمة الدقيقة أو بالتقريب المطلوب.\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\n1) يجد إحداثيي النقطة على المنحنى التي يكون عندها الميل قيمة معطاة.\n2) يحل المعادلة الناتجة (خطية أو تربيعية) ويجد ص المقابلة.\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\n1) يجد ثابتًا مجهولًا في معادلة منحنى بمعلومية ميله عند نقطة.\n2) يبين أن المماس عند نقطة أفقي بإثبات أن الميل صفر.\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\n1) يفسر المشتقة بوصفها معدل تغير في مواقف حياتية.\n2) يحسب معدل التغير عند لحظة معينة.\n\nالحصة 6: مراجعة الميل عند نقطة (1)\n1) يحل مسائل متنوعة على الميل عند نقطة.\n2) يختار الخطوات المناسبة للحل وينظمها.\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\n1) يجد الميل عند نقطة تقاطع منحنى مع محور.\n2) يقارن ميول منحنى عند نقطتين.\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\n1) يطبق مهارة إيجاد الميل في تمارين كتاب النشاط.\n2) يصوّب أخطاءه ذاتيًا.\n\nالحصة 9: الميل ومقارنة دوال\n1) يقارن ميول منحنيين عند نقطة تقاطعهما.\n2) يجد قيمة س التي يتساوى عندها ميلا منحنيين.\n\nالحصة 10: تدريبات متدرجة على الميل\n1) يحل تدريبات متدرجة الصعوبة على الميل.\n2) يقيّم مستوى إتقانه ويحدد ما يحتاج إلى مراجعة.\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\n1) يوظف الميل في تفسير بيانات ومواقف حياتية.\n2) يبني نموذجًا بسيطًا ويحسب معدل التغير.\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\n1) يطبق مهارات الدرس في حل تمارين متنوعة.\n2) يتعاون مع مجموعته في التنافس العلمي.", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\n\nالحصة 6: مراجعة الميل عند نقطة (1)\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\nالمخرج 1: تحليل\nالمخرج 2: تحليل\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 9: الميل ومقارنة دوال\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\n\nالحصة 10: تدريبات متد  | الطالب: يصحح: نعوض س = 3 فالميل 6.\n(15 د) تعاوني: المعلم: مراجعة شاملة لتمارين 2-2. | الطالب: يحل.\n(12 د) تصويب: المعلم: يناقش. | الطالب: يصحح.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس الميل عند نقطة. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\n1) [مستوى الدعم] أوجد ميل ص = س² + 3س عند س = 2.\nالإجابة النموذجية: دص/دس = 2س + 3 ← 7\n2) [المستوى المتوقع] أوجد ميل ص = س³ − 2س عند س = 1.\nالإجابة النموذجية: 3س² − 2 ← 1\n3) [المستوى المتقدم] أوجد ميل ص = 4/س عند س = 2.\nالإجابة النموذجية: −4/س² ← −1\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\n1) [مستوى الدعم] أوجد ميل ص = √س عند س = 9.\nالإجابة النموذجية: 1/(2√9) = 1/6\n2) [المستوى المتوقع] أوجد ميل ص = 2/س عند س = −1.\nالإجابة النموذجية: −2/س² ← −2\n3) [المستوى المتقدم] أوجد ميل ص = س^(3/2) عند س = 4.\nالإجابة النموذجية: (3/2)√4 = 3\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\n1) [مستوى الدعم] أوجد النقطة على ص = س² − 6س + 1 التي ميلها 4.\nالإجابة النموذجية: 2س − 6 = 4 ← (5، −4)\n2) [المستوى المتوقع] أوجد النقاط على ص = س³ − 3س² التي ميلها 9.\nالإجابة النموذجية: 3س² − 6س − 9 = 0 ← (3، 0)، (−1، −4)\n3) [المستوى المتقدم] أوجد النقطة على ص = س² + 2س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (−1، −1)\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\n1) [مستوى الدعم] أوجد أ إذا كان ميل ص = أس² + 3س عند س = 2 يساوي 11.\nالإجابة النموذجية: 4أ + 3 = 11 ← أ = 2\n2) [المستوى المتوقع] بيّن أن المماس لـ ص = س³ − 3س عند س = 1 أفقي.\nالإجابة النموذجية: دص/دس = 3س² − 3 = 0 عند س = 1\n3) [المستوى المتقدم] أوجد ب إذا كان ميل ص = س³ + ب س عند س = −1 يساوي 5.\nالإجابة النموذجية: 3 + ب = 5 ← ب = 2\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\n1) [مستوى الدعم] ف = 20ز − 5ز². أوجد معدل تغير الارتفاع عند ز = 1.\nالإجابة النموذجية: 10 م/ث\n2) [المستوى المتوقع] متى تكون سرعة الكرة صفرًا؟\nالإجابة النموذجية: 20 − 10ز = 0 ← ز = 2\n3) [المستوى المتقدم] ماذا تعني إشارة دف/دز عند ز = 3؟\nالإجابة النموذجية: سالبة (−10)؛ الكرة تهبط\n\nالحصة 6: مراجعة الميل عند نقطة (1)\n1) [مستوى الدعم] أوجد ميل ص = س³ عند س = 2.\nالإجابة النموذجية: 12\n2) [المستوى المتوقع] أوجد ميل ص = 2س² − 5س عند س = 0.\nالإجابة النموذجية: −5\n3) [المستوى المتقدم] أوجد النقطة على ص = س² + 1 التي ميلها −2.\nالإجابة النموذجية: (−1، 2)\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\n1) [مستوى الدعم] أوجد الميل عند نقطتي تقاطع ص = س² − 4 مع محور السينات.\nالإجابة النموذجية: عند س = 2: 4، عند س = −2: −4\n2) [المستوى المتوقع] أوجد الميل عند نقطة تقاطع ص = س³ + 2س + 1 مع محور الصادات.\nالإجابة النموذجية: عند س = 0: 2\n3) [المستوى المتقدم] أوجد الميل عند نقطة تقاطع ص = س² − 5س + 6 مع محور السينات حيث س > 2.\nالإجابة النموذجية: س = 3: 2س − 5 = 1\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\n1) [مستوى الدعم] أوجد ميل ص = 9س − 2س² عند س = 2.\nالإجابة النموذجية: 9 − 4س ← 1\n2) [المستوى المتوقع] أوجد ميل ص = س² + 1/س عند س = 1.\nالإجابة النموذجية: 2س − 1/س² ← 1\n3) [المستوى المتقدم] أوجد النقطة على ص = 9س − 2س² التي ميلها 1.\nالإجابة النموذجية: س = 2 ← (2، 10)\n\nالحصة 9: الميل ومقارنة دوال\n1) [مستوى الدعم] عند أي س يتساوى ميلا ص = س² و ص = 4س؟\nالإجابة النموذجية: س = 2\n2) [المستوى المتوقع] عند أي س يتساوى ميلا ص = س³ و ص = 12س؟\nالإجابة النموذجية: 3س² = 12 ← س = ±2\n3) [المستوى المتقدم] المنحنيان ص = س² و ص = 2س − 1 يتقاطعان عند (1، 1). قارن ميليهما عندها.\nالإجابة النموذجية: كلاهما 2 (المستقيم مماس للمنحنى)\n\nالحصة 10: تدريبات متدرجة على الميل\n1) [مستوى الدعم] أوجد ميل ص = 2س³ عند س = 1.\nالإجابة النموذجية: 6\n2) [المستوى المتوقع] أوجد النقطة على ص = س² − 2س + 5 التي ميلها 6.\nالإجابة النموذجية: (4، 13)\n3) [المستوى المتقدم] أوجد أ إذا كان ميل ص = أ/س عند س = 2 يساوي −3.\nالإجابة النموذجية: −أ/4 = −3 ← أ = 12\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\n1) [مستوى الدعم] ح = س³ (حجم مكعب). أوجد معدل تغير الحجم عند س = 2.\nالإجابة النموذجية: 3س² ← 12\n2) [المستوى المتوقع] ر(س) = −س² + 40س − 100. أوجد معدل تغير الربح عند س = 10.\nالإجابة النموذجية: −2س + 40 ← 20\n3) [المستوى المتقدم] في السؤال السابق، عند أي قيمة لـ س يتوقف الربح عن التزايد؟\nالإجابة النموذجية: س = 20\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\n1) [مستوى الدعم] أوجد ميل ص = س² عند (3، 9).\nالإجابة النموذجية: 6\n2) [المستوى المتوقع] أوجد النقطة على ص = س³ التي ميلها 3 وس > 0.\nالإجابة النموذجية: (1، 1)\n3) [المستوى المتقدم] أوجد أ إذا كان ميل ص = س² + أ عند س = 1 يساوي 2.\nالإجابة النموذجية: أي قيمة؛ الميل لا يعتمد على أ", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\n1) [مستوى الدعم] أوجد ميل ص = س² عند س = 5.\nالإجابة النموذجية: 10\n2) [المستوى المتوقع] أوجد ميل ص = 3س + 1 عند أي نقطة.\nالإجابة النموذجية: 3\n3) [المستوى المتقدم] ما إشارة ميل ص = −س² عند س = 2؟\nالإجابة النموذجية: سالبة (−4)\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\n1) [مستوى الدعم] أوجد ميل ص = 1/س عند س = 1.\nالإجابة النموذجية: −1\n2) [المستوى المتوقع] أوجد ميل ص = √س عند س = 4.\nالإجابة النموذجية: 1/4\n3) [المستوى المتقدم] أوجد ميل ص = 6/س² عند س = 1.\nالإجابة النموذجية: −12\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\n1) [مستوى الدعم] أوجد النقطة على ص = س² التي ميلها 6.\nالإجابة النموذجية: (3، 9)\n2) [المستوى المتوقع] أوجد النقطة على ص = 3س² التي ميلها −12.\nالإجابة النموذجية: (−2، 12)\n3) [المستوى المتقدم] أوجد النقطة على ص = س² − 4س التي ميلها صفر.\nالإجابة النموذجية: (2، −4)\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\n1) [مستوى الدعم] أوجد ك إذا كان ميل ص = ك س² عند س = 1 يساوي 8.\nالإجابة النموذجية: ك = 4\n2) [المستوى المتوقع] هل المماس لـ ص = س² − 2س عند س = 1 أفقي؟\nالإجابة النموذجية: نعم؛ الميل 0\n3) [المستوى المتقدم] أوجد أ إذا كان ميل ص = س² + أ س عند س = 3 يساوي 0.\nالإجابة النموذجية: 6 + أ = 0 ← أ = −6\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\n1) [مستوى الدعم] م = π نق². أوجد معدل تغير المساحة بالنسبة لنق.\nالإجابة النموذجية: 2π نق\n2) [المستوى المتوقع] أوجد معدل التغير السابق عند نق = 3.\nالإجابة النموذجية: 6π\n3) [المستوى المتقدم] ت(س) = 50 + 2س². أوجد معدل تغير التكلفة عند س = 10.\nالإجابة النموذجية: 4س ← 40\n\nالحصة 6: مراجعة الميل عند نقطة (1)\n1) [مستوى الدعم] أوجد ميل ص = س² − 3 عند س = 4.\nالإجابة النموذجية: 8\n2) [المستوى المتوقع] أوجد ميل ص = 5س عند س = 100.\nالإجابة النموذجية: 5\n3) [المستوى المتقدم] أوجد ميل ص = س⁴ عند س = −1.\nالإجابة النموذجية: −4\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\n1) [مستوى الدعم] أين يقطع ص = س² − 9 محور السينات؟\nالإجابة النموذجية: (3، 0)، (−3، 0)\n2) [المستوى المتوقع] أوجد ميل ص = س² − 9 عند (3، 0).\nالإجابة النموذجية: 6\n3) [المستوى المتقدم] أوجد ميل ص = 2س² + 3 عند نقطة تقاطعه مع محور الصادات.\nالإجابة النموذجية: 0\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\n1) [مستوى الدعم] أوجد ميل ص = 3 − س² عند س = 1.\nالإجابة النموذجية: −2\n2) [المستوى المتوقع] أوجد ميل ص = س³ − س عند س = 0.\nالإجابة النموذجية: −1\n3) [المستوى المتقدم] أوجد ميل ص = 8√س عند س = 4.\nالإجابة النموذجية: 4/√4 = 2\n\nالحصة 9: الميل ومقارنة دوال\n1) [مستوى الدعم] ما ميل ص = 4س؟\nالإجابة النموذجية: 4\n2) [المستوى المتوقع] عند أي س يكون ميل ص = س² مساويًا 10؟\nالإجابة النموذجية: س = 5\n3) [المستوى المتقدم] عند أي س يتساوى ميلا ص = س² + س و ص = 3س؟\nالإجابة النموذجية: 2س + 1 = 3 ← س = 1\n\nالحصة 10: تدريبات متدرجة على الميل\n1) [مستوى الدعم] أوجد ميل ص = س² + 7 عند س = 0.\nالإجابة النموذجية: 0\n2) [المستوى المتوقع] أوجد ميل ص = 1/س² عند س = 1.\nالإجابة النموذجية: −2\n3) [المستوى المتقدم] أوجد النقطة على ص = 5 − س² التي ميلها 4.\nالإجابة النموذجية: (−2، 1)\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\n1) [مستوى الدعم] أوجد معدل تغير مساحة مربع ضلعه س عند س = 5.\nالإجابة النموذجية: 10\n2) [المستوى المتوقع] أوجد معدل تغير ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [المستوى المتقدم] ف = 4ز². أوجد السرعة عند ز = 3.\nالإجابة النموذجية: 8ز ← 24\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\n1) [مستوى الدعم] أوجد ميل ص = 4س² عند س = −1.\nالإجابة النموذجية: −8\n2) [المستوى المتوقع] أوجد ميل ص = √س عند س = 1.\nالإجابة النموذجية: ½\n3) [المستوى المتقدم] أوجد النقطة على ص = س² − 8س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (4، −16)", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دا تابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}], "c": ["الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\n1) يعرّف الدالة المتزايدة والمتناقصة من التمثيل البياني (استكشف 3).\n2) يربط إشارة المشتقة الأولى بتزايد الدالة أو تناقصها.\n\nالحصة 2: تحديد تزايد الدالة أو تناقصها عند نقطة\n1) يحدد ما إذا كانت الدالة متزايدة أو متناقصة عند نقطة بحساب إشارة المشتقة.\n2) يبرر إجابته بقيمة الميل.\n\nالحصة 3: فترات التزايد والتناقص للدالة التربيعية\n1) يجد الفترة التي تكون فيها دالة تربيعية متزايدة والفترة التي تكون فيها متناقصة.\n2) يربط النتيجة برأس القطع المكافئ.\n\nالحصة 4: التحقق من تزايد الدالة أو تناقصها في فترة معطاة\n1) يتحقق من أن دالة متزايدة أو متناقصة في فترة معطاة.\n2) يحدد قيم ثابت تجعل الدالة متزايدة في فترة.\n\nالحصة 5: تطبيقات حياتية: الربح والتكلفة\n1) يوظف التزايد والتناقص في تحليل دالة ربح أو تكلفة.\n2) يفسر النتائج في سياق المسألة.\n\nالحصة 6: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\n1) يحدد فترات التزايد والتناقص من التمثيل البياني للدالة.\n2) ينظم إشارة المشتقة في جدول إشارات ويستنتج منه سلوك الدالة.\n\nالحصة 7: تمارين الدوال المتزايدة والمتناقصة\n1) يحل تمارين متنوعة على الدرس.\n2) يقيّم مستوى إتقانه.\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الأولى والميل\n1) يراجع قواعد الاشتقاق وإيجاد الميل عند نقطة.\n2) يحل مسائل مراجعة.\n\nالحصة 9: مراجعة الوحدة الثانية: معادلة المماس\n1) يراجع إيجاد معادلة المماس.\n2) يحل مسائل مراجعة مركبة.\n\nالحصة 10: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص\n1) يراجع المشتقة الثانية والتزايد والتناقص.\n2) يحل مسائل مراجعة تجمع أكثر من مهارة.\n\nالحصة 11: مراجعة الوحدة الثانية (كتاب النشاط)\n1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط.\n2) يصوّب أخطاءه ذاتيًا.\n\nالحصة 12: ختام الوحدة الثانية ومسابقة الختام\n1) يطبق مهارات الوحدة الثانية في سياقات متنوعة.\n2) يتعاون مع مجموعته في التنافس العلمي.", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\nالمخرج 1: فهم\nالمخرج 2: تحليل\n\nالحصة 2: تحديد تزايد الدالة أو تناقصها عند نقطة\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 3: فترات التزاي ، ب، 0.4 لقيم 1، 2، 3 و ت(س) = 2.2. كيف نجد أ، ب؟»\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nمسألة كتاب النشاط ص 54: عدد الميداليات المتوقعة لرياضي في سباقات الماراثون.\n\nالحصة 5: مراجعة الوحدة الثالثة\nيقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثالثة (كتاب الطالب).\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nسؤال «صحح الخطأ»: حسب طالب التباين = ت(س²) − ت(س). ما الخطأ؟", "الحصة 1: القيمة المتوقعة ت(س)\n(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يتوقع 3.5.\n(12 د) النمذجة: المعلم: يعرض شرائح «القيمة المتوقعة والتباين» من دليل المعلم ويحل المثال 6 (كتاب الطالب). | الطالب: يتابع ويكمل عمود س ل(س).\n(10 د) تعاوني: المعلم: يكلف بتمرين 3-3 (1) ص 51 من كتاب النشاط. | الطالب: تحل المجموعات.\n(8 د) تحقق: المعلم: يقارن الطلبة القيمة المتوقعة لحجر النرد بنتائج تجربة صفية. | الطالب: يقارن.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 2: التباين والانحراف المعياري\n(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يناقش.\n(12 د) النمذجة: المعلم: يحل المثال 7 (كتاب الطالب) بجدول من أعمدة: س، ل(س)، س ل(س)، س² ل(س). | الطالب: يتابع.\n(13 د) تعاوني: المعلم: يكلف بتمرين 3-3 (2) ص 52 من كتاب النشاط. | الطالب: تحل المجموعات.\n(5 د) تصويب: المعلم: يناقش الخطأ الشائع (نسيان تربيع ت(س)). | الطالب: يصحح.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\n(5 د) التهيئة: المعلم: يطرح السؤال. | الطالب: يقترح معادلتين.\n(12 د) النمذجة: المعلم: يحل المسألة: أ + ب = 0.6، أ + 2ب + 1.2 = 2.2. | الطالب: يتابع.\n(13 د) تعاوني: المعلم: يكلف بتمرين 3-3 (3) ص 52 من كتاب النشاط. | الطالب: تحل المجموعات.\n(5 د) عرض: المعلم: تعرض المجموعات. | الطالب: يعرض.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\n(5 د) التهيئة: المعلم: يعرض المسألة. | الطالب: يحدد المعطيات.\n(12 د) النمذجة: المعلم: يحسب القيمة المتوقعة ويفسرها. | الطالب: يتابع.\n(13 د) حل مشكلات: المعلم: يوزع مسائل (لعبة مربحة؟ استثمار؟) على المجموعات. | الطالب: تحسب وتقرر.\n(5 د) عرض: المعلم: تعرض المجموعات قراراتها. | الطالب: يبرر.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 5: مراجعة الوحدة الثالثة\n(5 د) التهيئة: المعلم: يوزع قائمة التحقق. | الطالب: يقيّم نفسه.\n(8 د) خريطة مفاهيم: المعلم: يبني خريطة مفاهيم للوحدة. | الطالب: يكمل.\n(17 د) تعاوني بالمستويات: المعلم: يكلف بتمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وكتاب النشاط ص ⁦55–56⁩. | الطالب: يحل حسب مستواه.\n(5 د) مناقشة: المعلم: يناقش الأخطاء الشائعة. | الطالب: يصحح.\n(5 د) الختام: المعلم: يطرح أسئلة التقويم الختامي ويلخص أهم الأفكار. | الطالب: يجيب فرديًا ويصحح ذاتيًا.\nالمجموع: 40 دقيقة\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\n(5 د) التهيئة: المعلم: يعرض الخطأ. | الطالب: يصحح: − (ت(س))².\n(15 د) تعاوني: المعلم: مراجعة شاملة لكتاب النشاط ص ⁦51–56⁩. | الطالب: يحل.\n(12 د) تصويب: المعلم: يناقش. | الطالب: يصحح.\n(8 د) مسابقة الختام: المعلم: يدير مسابقة المجموعات على درس القيمة المتوقعة والتباين ومراجعة الوحدة الثالثة. | الطالب: تتنافس المجموعات وتتابع مخطط النتائج.\nالمجموع: 40 دقيقة", "الحصة 1: القيمة المتوقعة ت(س)\n1) [مستوى الدعم] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.1 + 0.6 + 1.2 + 0.8 = 2.7\n2) [المستوى المتوقع] أوجد ت(س) لرمي حجر نرد منتظم.\nالإجابة النموذجية: 3.5\n3) [المستوى المتقدم] أوجد ت(س) لعدد الصور في رمي 3 قطع نقدية.\nالإجابة النموذجية: 1.5\n\nالحصة 2: التباين والانحراف المعياري\n1) [مستوى الدعم] للتوزيع 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2 أوجد ت(س²).\nالإجابة النموذجية: 0.1 + 1.2 + 3.6 + 3.2 = 8.1\n2) [المستوى المتوقع] أوجد التباين ع²(س) للتوزيع نفسه.\nالإجابة النموذجية: 8.1 − 2.7² = 0.81\n3) [المستوى المتقدم] أوجد الانحراف المعياري.\nالإجابة النموذجية: 0.9\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\n1) [مستوى الدعم] قيم 1، 2، 3 باحتمالات أ، ب، 0.4 و ت(س) = 2.2. أوجد أ، ب.\nالإجابة النموذجية: أ + ب = 0.6 و أ + 2ب = 1 ← ب = 0.4، أ = 0.2\n2) [المستوى المتوقع] قيم 0، 1، 2 باحتمالات 0.3، ك، 0.5. أوجد ك ثم ت(س).\nالإجابة النموذجية: ك = 0.2؛ ت(س) = 0.2 + 1 = 1.2\n3) [المستوى المتقدم] قيم 1، 2 باحتمالين ل، 1 − ل و ت(س) = 1.7. أوجد ل.\nالإجابة النموذجية: ل + 2 − 2ل = 1.7 ← ل = 0.3\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\n1) [مستوى الدعم] لعبة: تربح 10 ريالات باحتمال 0.1 وتخسر 2 ريال باحتمال 0.9. أوجد الربح المتوقع.\nالإجابة النموذجية: 1 − 1.8 = −0.8 ريال\n2) [المستوى المتوقع] هل اللعبة السابقة في صالح اللاعب؟ برر.\nالإجابة النموذجية: لا؛ الربح المتوقع سالب\n3) [المستوى المتقدم] استثماران لهما القيمة المتوقعة نفسها وتباين الأول أكبر. أيهما أقل مخاطرة؟\nالإجابة النموذجية: الثاني (التباين أصغر)\n\nالحصة 5: مراجعة الوحدة الثالثة\n1) [مستوى الدعم] قيم 2، 3، 4، 5 باحتمالات متساوية. أوجد ت(س).\nالإجابة النموذجية: 3.5\n2) [المستوى المتوقع] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: ت(س²) = 13.5 ← 13.5 − 12.25 = 1.25\n3) [المستوى المتقدم] ل(س) = ك س لـ س = 1، 2، 3. أوجد ك و ت(س).\nالإجابة النموذجية: ك = 1/6؛ ت(س) = (1 + 4 + 9)/6 = 7/3\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\n1) [مستوى الدعم] صحح: التباين = ت(س²) − ت(س).\nالإجابة النموذجية: التباين = ت(س²) − (ت(س))²\n2) [المستوى المتوقع] لرمي حجر نرد: ت(س) = 3.5 و ت(س²) = 91/6. أوجد التباين (لأقرب منزلتين).\nالإجابة النموذجية: 91/6 − 12.25 ≈ 2.92\n3) [المستوى المتقدم] قيم 1، 2، 3 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.5 + 0.6 + 0.6 = 1.7", "الحصة 1: القيمة المتوقعة ت(س)\n1) [مستوى الدعم] ما رمز القيمة المتوقعة؟\nالإجابة النموذجية: ت(س)\n2) [المستوى المتوقع] س: 0، 1 باحتمالين 0.5، 0.5. أوجد ت(س).\nالإجابة النموذجية: 0.5\n3) [المستوى المتقدم] س: 2، 4، 6 باحتمالات 0.2، 0.5، 0.3. أوجد ت(س).\nالإجابة النموذجية: 0.4 + 2 + 1.8 = 4.2\n\nالحصة 2: التباين والانحراف المعياري\n1) [مستوى الدعم] ما العلاقة بين التباين والانحراف المعياري؟\nالإجابة النموذجية: الانحراف المعياري = الجذر التربيعي للتباين\n2) [المستوى المتوقع] لعدد الصور في 3 رميات: ت(س) = 1.5 و ت(س²) = 3. أوجد التباين.\nالإجابة النموذجية: 3 − 2.25 = 0.75\n3) [المستوى المتقدم] إذا كان التباين 0.64 فما الانحراف المعياري؟\nالإجابة النموذجية: 0.8\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\n1) [مستوى الدعم] قيم 0، 10 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 5\n2) [المستوى المتوقع] قيم 1، 3 باحتمالين ل، 1 − ل و ت(س) = 2. أوجد ل.\nالإجابة النموذجية: 0.5\n3) [المستوى المتقدم] قيم 2، 5 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.8 + 3 = 3.8\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\n1) [مستوى الدعم] عدد الميداليات: 0، 1، 2 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.3 + 0.4 = 0.7\n2) [المستوى المتوقع] ماذا يعني ت(س) = 0.7 هنا؟\nالإجابة النموذجية: متوسط عدد الميداليات على المدى الطويل لكل سباق\n3) [المستوى المتقدم] لعبة: تربح 5 باحتمال 0.2 و 0 باحتمال 0.8. أوجد الربح المتوقع.\nالإجابة النموذجية: 1\n\nالحصة 5: مراجعة الوحدة الثالثة\n1) [مستوى الدعم] ما مجموع الاحتمالات في توزيع احتمالي؟\nالإجابة النموذجية: 1\n2) [المستوى المتوقع] قيم 0، 1 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.6\n3) [المستوى المتقدم] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: 0.6 − 0.36 = 0.24\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\n1) [مستوى الدعم] ما رمز التباين؟\nالإجابة النموذجية: ع²(س)\n2) [المستوى المتوقع] إذا كان ع²(س) = 4 فما ع(س)؟\nالإجابة النموذجية: 2\n3) [المستوى المتقدم] قيم 0، 2 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 1", "الحصة 1: القيمة المتوقعة ت(س)\nإرشاد للطالب: مراجعة المثال 6 (كتاب الطالب)، وحل تمرين 3-3 (1) ص 51 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التباين والانحراف المعياري\nإرشاد للطالب: حل تمرين 3-3 (2) ص 52 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nإرشاد للطالب: حل تمرين 3-3 (3) ص 52 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nإرشاد للطالب: حل تمرين 3-3 (4، 5) ص ⁦53–54⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: مراجعة الوحدة الثالثة\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وص ⁦55–56⁩ من كتاب النشاط، والاستعداد للاختبار القصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nإرشاد للطالب: الاستعداد للاختبار القصير في الوحدة الثالثة والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة."]}];
const TINT=["#eaf3fb","#eef7ef","#fbf3e6","#f3eefa","#e9f6f6","#fdf0ef","#eef1fb","#f1f8e9","#fff6e0","#f0f4f8"];
let mode='s',li=0,pi=0;
const $=s=>document.querySelector(s);
const les=$('#les');
D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' '+l.title;les.appendChild(o)});
les.onchange=()=>{li=+les.value;pi=0;render()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));render()});
function copyText(t,btn,box){
  const ok=()=>{btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
    if(r)ok();else{const rg=document.createRange();rg.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(rg);box.parentNode.querySelector('.hint').style.display='block'}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fallback)}else fallback();
}
function render(){
  const L=D[li];
  $('#now').textContent=mode==='s'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='s'){L.p.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+(i+1)+': '+p.t;if(i===pi)b.className='on';b.onclick=()=>{pi=i;render()};tabs.appendChild(b)})}
  const texts=mode==='s'?L.p[pi].f:L.c;
  $('#meta').innerHTML=`<b>${L.id} ${L.title}</b> — ${L.unit}<br>`+(mode==='s'?`الحصة ${pi+1} من ${L.p.length} — ${L.p[pi].w}`:`عدد الحصص: ${L.p.length}`)+` — كتاب الطالب ص ${L.sbp}، كتاب النشاط ص ${L.wbp}`;
  const box=$('#cards');box.innerHTML='';
  FIELDS.forEach((f,k)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="ch" style="background:${TINT[k]}"><h3><span>${k+1}</span>${f}</h3><button class="cp">نسخ</button></div><div class="cb"></div><div class="hint">تعذّر الوصول إلى الحافظة: النص محدد الآن، انسخه يدويًا.</div>`;
    const cb=c.querySelector('.cb');cb.textContent=texts[k];
    c.querySelector('.cp').onclick=e=>copyText(texts[k],e.currentTarget,cb);
    box.appendChild(c)});
}
render();
</script>
