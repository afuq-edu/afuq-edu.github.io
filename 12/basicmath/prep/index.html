زيع\nإرشاد للطالب: حل تمرين 2-3 (2) ص 49 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: حساب احتمالات من جدول التوزيع\nإرشاد للطالب: حل تمرين 2-3 (1) ص 48 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: بناء جدول التوزيع الاحتمالي من تجربة\nإرشاد للطالب: حل تمرين 2-3 (3، 4) ص 50 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: تفسير جداول التوزيع في مواقف حياتية\nإرشاد للطالب: إكمال تمارين 2-3 من كتاب النشاط ص ⁦48–50⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين التوزيع الاحتمالي ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس القيمة المتوقعة والتباين.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12"]}, {"id": "3-3", "title": "القيمة المتوقعة والتباين للمتغير العشوائي المتقطع", "unit": "الوحدة الثالثة: المتغيرات العشوائية المتقطعة (المنفصلة)", "sbp": "المثالان 6، 7، تمارين 3-3، مراجعة الوحدة", "wbp": "⁦51–56⁩", "p": [{"t": "القيمة المتوقعة ت(س)", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحسب القيمة المتوقعة ت(س) = مجموع س × ل(س) (20 دقيقة)\n2) يفسر القيمة المتوقعة بوصفها الوسط الحسابي على المدى الطويل (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، عروض تقديمية، أخرى: الآلة الحاسبة العلمية", "القيمة المتوقعة ت(س)، الوسط الحسابي على المدى الطويل", "سؤال: «إذا رميت حجر نرد مرات كثيرة جدًا، فما متوسط الأرقام الظاهرة الذي تتوقعه؟» (5 دقائق)", "1. النمذجة: يعرض المعلم شرائح «القيمة المتوقعة والتباين» من دليل المعلم ويحل المثال 6 (كتاب الطالب)، ويتابع الطالب ويكمل عمود س ل(س) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (1) ص 51 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يقارن الطلبة القيمة المتوقعة لحجر النرد بنتائج تجربة صفية، ويقارن الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.1 + 0.6 + 1.2 + 0.8 = 2.7\n2) [مستوى التطبيق] أوجد ت(س) لرمي حجر نرد منتظم.\nالإجابة النموذجية: 3.5\n3) [مستوى الاستدلال] أوجد ت(س) لعدد الصور في رمي 3 قطع نقدية.\nالإجابة النموذجية: 1.5", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز القيمة المتوقعة؟\nالإجابة النموذجية: ت(س)\n2) [مستوى التطبيق] س: 0، 1 باحتمالين 0.5، 0.5. أوجد ت(س).\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] س: 2، 4، 6 باحتمالات 0.2، 0.5، 0.3. أوجد ت(س).\nالإجابة النموذجية: 0.4 + 2 + 1.8 = 4.2", "إرشاد للطالب: مراجعة المثال 6 (كتاب الطالب)، وحل تمرين 3-3 (1) ص 51 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "التباين والانحراف المعياري", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحسب التباين ع²(س) = مجموع س² ل(س) − (ت(س))² (25 دقيقة)\n2) يحسب الانحراف المعياري ع(س) ويفسره مقياسًا لانتشار القيم (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، عروض تقديمية، أخرى: الآلة الحاسبة العلمية", "التباين ع²(س)، الانحراف المعياري ع(س)، ت(س²)، الانتشار", "سؤال: «توزيعان لهما القيمة المتوقعة نفسها، كيف نعرف أيهما أكثر انتشارًا؟» (5 دقائق)", "1. النمذجة: يحل المعلم المثال 7 (كتاب الطالب) بجدول من أعمدة: س، ل(س)، س ل(س)، س² ل(س)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (2) ص 52 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تصويب: يناقش المعلم الخطأ الشائع (نسيان تربيع ت(س))، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] للتوزيع 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2 أوجد ت(س²).\nالإجابة النموذجية: 0.1 + 1.2 + 3.6 + 3.2 = 8.1\n2) [مستوى التطبيق] أوجد التباين ع²(س) للتوزيع نفسه.\nالإجابة النموذجية: 8.1 − 2.7² = 0.81\n3) [مستوى الاستدلال] أوجد الانحراف المعياري.\nالإجابة النموذجية: 0.9", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما العلاقة بين التباين والانحراف المعياري؟\nالإجابة النموذجية: الانحراف المعياري = الجذر التربيعي للتباين\n2) [مستوى التطبيق] لعدد الصور في 3 رميات: ت(س) = 1.5 و ت(س²) = 3. أوجد التباين.\nالإجابة النموذجية: 3 − 2.25 = 0.75\n3) [مستوى الاستدلال] إذا كان التباين 0.64 فما الانحراف المعياري؟\nالإجابة النموذجية: 0.8", "إرشاد للطالب: حل تمرين 3-3 (2) ص 52 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "إيجاد مجاهيل بمعلومية القيمة المتوقعة", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يجد احتمالات أو قيمًا مجهولة بمعلومية مجموع الاحتمالات والقيمة المتوقعة (25 دقيقة)\n2) يحل نظام معادلتين خطيتين ناتجًا من شرطي التوزيع (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام", "معادلتا مجموع الاحتمالات والقيمة المتوقعة، المجاهيل", "سؤال: «جدول احتمالاته أ، ب، 0.4 لقيم 1، 2، 3 و ت(س) = 2.2. كيف نجد أ، ب؟» (5 دقائق)", "1. النمذجة: يحل المعلم المسألة: أ + ب = 0.6، أ + 2ب + 1.2 = 2.2، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (3) ص 52 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 1، 2، 3 باحتمالات أ، ب، 0.4 و ت(س) = 2.2. أوجد أ، ب.\nالإجابة النموذجية: أ + ب = 0.6 و أ + 2ب = 1 ← ب = 0.4، أ = 0.2\n2) [مستوى التطبيق] قيم 0، 1، 2 باحتمالات 0.3، ك، 0.5. أوجد ك ثم ت(س).\nالإجابة النموذجية: ك = 0.2؛ ت(س) = 0.2 + 1 = 1.2\n3) [مستوى الاستدلال] قيم 1، 2 باحتمالين ل، 1 − ل و ت(س) = 1.7. أوجد ل.\nالإجابة النموذجية: ل + 2 − 2ل = 1.7 ← ل = 0.3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] قيم 0، 10 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] قيم 1، 3 باحتمالين ل، 1 − ل و ت(س) = 2. أوجد ل.\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] قيم 2، 5 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.8 + 3 = 3.8", "إرشاد للطالب: حل تمرين 3-3 (3) ص 52 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "تطبيقات حياتية على القيمة المتوقعة والتباين", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحسب القيمة المتوقعة في مواقف حياتية (ألعاب، أرباح، ميداليات) (25 دقيقة)\n2) يتخذ قرارًا بناءً على القيمة المتوقعة والانتشار (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم المبني على حل المشكلات، التعلم المبني على المشاريع، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "العائد المتوقع، العدالة في الألعاب، المخاطرة (الانتشار)", "مسألة كتاب النشاط ص 54: عدد الميداليات المتوقعة لرياضي في سباقات الماراثون. (5 دقائق)", "1. النمذجة: يحسب المعلم القيمة المتوقعة ويفسرها، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. حل مشكلات: يوزع المعلم مسائل (لعبة مربحة؟ استثمار؟) على المجموعات، وتحسب وتقرر (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات قراراتها، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] لعبة: تربح 10 ريالات باحتمال 0.1 وتخسر 2 ريال باحتمال 0.9. أوجد الربح المتوقع.\nالإجابة النموذجية: 1 − 1.8 = −0.8 ريال\n2) [مستوى التطبيق] هل اللعبة السابقة في صالح اللاعب؟ برر.\nالإجابة النموذجية: لا؛ الربح المتوقع سالب\n3) [مستوى الاستدلال] استثماران لهما القيمة المتوقعة نفسها وتباين الأول أكبر. أيهما أقل مخاطرة؟\nالإجابة النموذجية: الثاني (التباين أصغر)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] عدد الميداليات: 0، 1، 2 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.3 + 0.4 = 0.7\n2) [مستوى التطبيق] ماذا يعني ت(س) = 0.7 هنا؟\nالإجابة النموذجية: متوسط عدد الميداليات على المدى الطويل لكل سباق\n3) [مستوى الاستدلال] لعبة: تربح 5 باحتمال 0.2 و 0 باحتمال 0.8. أوجد الربح المتوقع.\nالإجابة النموذجية: 1", "إرشاد للطالب: حل تمرين 3-3 (4، 5) ص ⁦53–54⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "مراجعة الوحدة الثالثة", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يراجع مفاهيم الوحدة الثالثة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع المتغير والتوزيع والتوقع والتباين (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "المتغير العشوائي المتقطع، التوزيع الاحتمالي، القيمة المتوقعة، التباين", "يقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثالثة (كتاب الطالب). (5 دقائق)", "1. خريطة مفاهيم: يبني المعلم خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وكتاب النشاط ص ⁦55–56⁩، ويحل الطالب حسب مستواه (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 2، 3، 4، 5 باحتمالات متساوية. أوجد ت(س).\nالإجابة النموذجية: 3.5\n2) [مستوى التطبيق] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: ت(س²) = 13.5 ← 13.5 − 12.25 = 1.25\n3) [مستوى الاستدلال] ل(س) = ك س لـ س = 1، 2، 3. أوجد ك و ت(س).\nالإجابة النموذجية: ك = 1/6؛ ت(س) = (1 + 4 + 9)/6 = 7/3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما مجموع الاحتمالات في توزيع احتمالي؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] قيم 0، 1 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.6\n3) [مستوى الاستدلال] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: 0.6 − 0.36 = 0.24", "إرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وص ⁦55–56⁩ من كتاب النشاط، والاستعداد للاختبار القصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "ختام الوحدة الثالثة ومسابقة الختام", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يطبق مهارات الوحدة الثالثة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المتغيرات العشوائية المتقطعة", "سؤال «صحح الخطأ»: حسب طالب التباين = ت(س²) − ت(س). ما الخطأ؟ (5 دقائق)", "1. تعاوني: مراجعة شاملة لكتاب النشاط ص ⁦51–56⁩، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مسابقة تاريخ عمان: تحسب المجموعات القيمة المتوقعة لنقاط فريق في مسابقة ثقافية عن عمان علمت احتمالات حصوله على 1 أو 2 أو 3 نقاط، ثم تجري جولة أسئلة قصيرة للتحقق (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صحح: التباين = ت(س²) − ت(س).\nالإجابة النموذجية: التباين = ت(س²) − (ت(س))²\n2) [مستوى التطبيق] لرمي حجر نرد: ت(س) = 3.5 و ت(س²) = 91/6. أوجد التباين (لأقرب منزلتين).\nالإجابة النموذجية: 91/6 − 12.25 ≈ 2.92\n3) [مستوى الاستدلال] قيم 1، 2، 3 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.5 + 0.6 + 0.6 = 1.7", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز التباين؟\nالإجابة النموذجية: ع²(س)\n2) [مستوى التطبيق] إذا كان ع²(س) = 4 فما ع(س)؟\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] قيم 0، 2 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 1", "إرشاد للطالب: الاستعداد للاختبار القصير في الوحدة الثالثة والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}], "c": ["الحصة 1: القيمة المتوقعة ت(س)\n1) يحسب القيمة المتوقعة ت(س) = مجموع س × ل(س) (20 دقيقة)\n2) يفسر القيمة المتوقعة بوصفها الوسط الحسابي على المدى الطويل (20 دقيقة)\n\nالحصة 2: التباين والانحراف المعياري\n1) يحسب التباين ع²(س) = مجموع س² ل(س) − (ت(س))² (25 دقيقة)\n2) يحسب الانحراف المعياري ع(س) ويفسره مقياسًا لانتشار القيم (15 دقيقة)\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\n1) يجد احتمالات أو قيمًا مجهولة بمعلومية مجموع الاحتمالات والقيمة المتوقعة (25 دقيقة)\n2) يحل نظام معادلتين خطيتين ناتجًا من شرطي التوزيع (15 دقيقة)\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\n1) يحسب القيمة المتوقعة في مواقف حياتية (ألعاب، أرباح، ميداليات) (25 دقيقة)\n2) يتخذ قرارًا بناءً على القيمة المتوقعة والانتشار (15 دقيقة)\n\nالحصة 5: مراجعة الوحدة الثالثة\n1) يراجع مفاهيم الوحدة الثالثة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع المتغير والتوزيع والتوقع والتباين (15 دقيقة)\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\n1) يطبق مهارات الوحدة الثالثة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: القيمة المتوقعة ت(س)\nالمخرج 1: تطبيق\nالمخرج 2: فهم\n\nالحصة 2: التباين والانحراف المعياري\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 5: مراجعة الوحدة الثالثة\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: القيمة المتوقعة ت(س)\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني\n\nالحصة 2: التباين والانحراف المعياري\nالتعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nالتعلم المبني على حل المشكلات، التعلم المبني على المشاريع، التعلم التعاوني\n\nالحصة 5: مراجعة الوحدة الثالثة\nالتعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الحصة 1: القيمة المتوقعة ت(س)\nالكتاب، السبورة الذكية، عروض تقديمية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 2: التباين والانحراف المعياري\nالكتاب، السبورة الذكية، عروض تقديمية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 5: مراجعة الوحدة الثالثة\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: القيمة المتوقعة ت(س)\nالقيمة المتوقعة ت(س)، الوسط الحسابي على المدى الطويل\n\nالحصة 2: التباين والانحراف المعياري\nالتباين ع²(س)، الانحراف المعياري ع(س)، ت(س²)، الانتشار\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nمعادلتا مجموع الاحتمالات والقيمة المتوقعة، المجاهيل\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nالعائد المتوقع، العدالة في الألعاب، المخاطرة (الانتشار)\n\nالحصة 5: مراجعة الوحدة الثالثة\nالمتغير العشوائي المتقطع، التوزيع الاحتمالي، القيمة المتوقعة، التباين\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nالمتغيرات العشوائية المتقطعة", "الحصة 1: القيمة المتوقعة ت(س)\nسؤال: «إذا رميت حجر نرد مرات كثيرة جدًا، فما متوسط الأرقام الظاهرة الذي تتوقعه؟» (5 دقائق)\n\nالحصة 2: التباين والانحراف المعياري\nسؤال: «توزيعان لهما القيمة المتوقعة نفسها، كيف نعرف أيهما أكثر انتشارًا؟» (5 دقائق)\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nسؤال: «جدول احتمالاته أ، ب، 0.4 لقيم 1، 2، 3 و ت(س) = 2.2. كيف نجد أ، ب؟» (5 دقائق)\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nمسألة كتاب النشاط ص 54: عدد الميداليات المتوقعة لرياضي في سباقات الماراثون. (5 دقائق)\n\nالحصة 5: مراجعة الوحدة الثالثة\nيقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثالثة (كتاب الطالب). (5 دقائق)\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nسؤال «صحح الخطأ»: حسب طالب التباين = ت(س²) − ت(س). ما الخطأ؟ (5 دقائق)", "الحصة 1: القيمة المتوقعة ت(س) — زمن الحصة 40 دقيقة\n\n1. النمذجة: يعرض المعلم شرائح «القيمة المتوقعة والتباين» من دليل المعلم ويحل المثال 6 (كتاب الطالب)، ويتابع الطالب ويكمل عمود س ل(س) (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (1) ص 51 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يقارن الطلبة القيمة المتوقعة لحجر النرد بنتائج تجربة صفية، ويقارن الطالب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: التباين والانحراف المعياري — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 7 (كتاب الطالب) بجدول من أعمدة: س، ل(س)، س ل(س)، س² ل(س)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (2) ص 52 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تصويب: يناقش المعلم الخطأ الشائع (نسيان تربيع ت(س))، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المسألة: أ + ب = 0.6، أ + 2ب + 1.2 = 2.2، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (3) ص 52 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحسب المعلم القيمة المتوقعة ويفسرها، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. حل مشكلات: يوزع المعلم مسائل (لعبة مربحة؟ استثمار؟) على المجموعات، وتحسب وتقرر (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. عرض: تعرض المجموعات قراراتها، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: مراجعة الوحدة الثالثة — زمن الحصة 40 دقيقة\n\n1. خريطة مفاهيم: يبني المعلم خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وكتاب النشاط ص ⁦55–56⁩، ويحل الطالب حسب مستواه (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: مراجعة شاملة لكتاب النشاط ص ⁦51–56⁩، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. غلق الدرس – مسابقة تاريخ عمان: تحسب المجموعات القيمة المتوقعة لنقاط فريق في مسابقة ثقافية عن عمان علمت احتمالات حصوله على 1 أو 2 أو 3 نقاط، ثم تجري جولة أسئلة قصيرة للتحقق (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: القيمة المتوقعة ت(س)\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.1 + 0.6 + 1.2 + 0.8 = 2.7\n2) [مستوى التطبيق] أوجد ت(س) لرمي حجر نرد منتظم.\nالإجابة النموذجية: 3.5\n3) [مستوى الاستدلال] أوجد ت(س) لعدد الصور في رمي 3 قطع نقدية.\nالإجابة النموذجية: 1.5\n\nالحصة 2: التباين والانحراف المعياري\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] للتوزيع 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2 أوجد ت(س²).\nالإجابة النموذجية: 0.1 + 1.2 + 3.6 + 3.2 = 8.1\n2) [مستوى التطبيق] أوجد التباين ع²(س) للتوزيع نفسه.\nالإجابة النموذجية: 8.1 − 2.7² = 0.81\n3) [مستوى الاستدلال] أوجد الانحراف المعياري.\nالإجابة النموذجية: 0.9\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 1، 2، 3 باحتمالات أ، ب، 0.4 و ت(س) = 2.2. أوجد أ، ب.\nالإجابة النموذجية: أ + ب = 0.6 و أ + 2ب = 1 ← ب = 0.4، أ = 0.2\n2) [مستوى التطبيق] قيم 0، 1، 2 باحتمالات 0.3، ك، 0.5. أوجد ك ثم ت(س).\nالإجابة النموذجية: ك = 0.2؛ ت(س) = 0.2 + 1 = 1.2\n3) [مستوى الاستدلال] قيم 1، 2 باحتمالين ل، 1 − ل و ت(س) = 1.7. أوجد ل.\nالإجابة النموذجية: ل + 2 − 2ل = 1.7 ← ل = 0.3\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] لعبة: تربح 10 ريالات باحتمال 0.1 وتخسر 2 ريال باحتمال 0.9. أوجد الربح المتوقع.\nالإجابة النموذجية: 1 − 1.8 = −0.8 ريال\n2) [مستوى التطبيق] هل اللعبة السابقة في صالح اللاعب؟ برر.\nالإجابة النموذجية: لا؛ الربح المتوقع سالب\n3) [مستوى الاستدلال] استثماران لهما القيمة المتوقعة نفسها وتباين الأول أكبر. أيهما أقل مخاطرة؟\nالإجابة النموذجية: الثاني (التباين أصغر)\n\nالحصة 5: مراجعة الوحدة الثالثة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 2، 3، 4، 5 باحتمالات متساوية. أوجد ت(س).\nالإجابة النموذجية: 3.5\n2) [مستوى التطبيق] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: ت(س²) = 13.5 ← 13.5 − 12.25 = 1.25\n3) [مستوى الاستدلال] ل(س) = ك س لـ س = 1، 2، 3. أوجد ك و ت(س).\nالإجابة النموذجية: ك = 1/6؛ ت(س) = (1 + 4 + 9)/6 = 7/3\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صحح: التباين = ت(س²) − ت(س).\nالإجابة النموذجية: التباين = ت(س²) − (ت(س))²\n2) [مستوى التطبيق] لرمي حجر نرد: ت(س) = 3.5 و ت(س²) = 91/6. أوجد التباين (لأقرب منزلتين).\nالإجابة النموذجية: 91/6 − 12.25 ≈ 2.92\n3) [مستوى الاستدلال] قيم 1، 2، 3 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.5 + 0.6 + 0.6 = 1.7", "الحصة 1: القيمة المتوقعة ت(س)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز القيمة المتوقعة؟\nالإجابة النموذجية: ت(س)\n2) [مستوى التطبيق] س: 0، 1 باحتمالين 0.5، 0.5. أوجد ت(س).\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] س: 2، 4، 6 باحتمالات 0.2، 0.5، 0.3. أوجد ت(س).\nالإجابة النموذجية: 0.4 + 2 + 1.8 = 4.2\n\nالحصة 2: التباين والانحراف المعياري\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما العلاقة بين التباين والانحراف المعياري؟\nالإجابة النموذجية: الانحراف المعياري = الجذر التربيعي للتباين\n2) [مستوى التطبيق] لعدد الصور في 3 رميات: ت(س) = 1.5 و ت(س²) = 3. أوجد التباين.\nالإجابة النموذجية: 3 − 2.25 = 0.75\n3) [مستوى الاستدلال] إذا كان التباين 0.64 فما الانحراف المعياري؟\nالإجابة النموذجية: 0.8\n\nالحصة 3: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] قيم 0، 10 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] قيم 1، 3 باحتمالين ل، 1 − ل و ت(س) = 2. أوجد ل.\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] قيم 2، 5 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.8 + 3 = 3.8\n\nالحصة 4: تطبيقات حياتية على القيمة المتوقعة والتباين\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] عدد الميداليات: 0، 1، 2 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.3 + 0.4 = 0.7\n2) [مستوى التطبيق] ماذا يعني ت(س) = 0.7 هنا؟\nالإجابة النموذجية: متوسط عدد الميداليات على المدى الطويل لكل سباق\n3) [مستوى الاستدلال] لعبة: تربح 5 باحتمال 0.2 و 0 باحتمال 0.8. أوجد الربح المتوقع.\nالإجابة النموذجية: 1\n\nالحصة 5: مراجعة الوحدة الثالثة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما مجموع الاحتمالات في توزيع احتمالي؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] قيم 0، 1 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.6\n3) [مستوى الاستدلال] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: 0.6 − 0.36 = 0.24\n\nالحصة 6: ختام الوحدة الثالثة ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز التباين؟\nالإجابة النموذجية: ع²(س)\n2) [مستوى التطبيق] إذا كان ع²(س) = 4 فما ع(س)؟\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] قيم 0، 2 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 1", "الحصة 1: القيمة المتوقعة ت(س)\nإرشاد للطالب: مراجعة المثال 6 (كتاب الطالب)، وحل تمرين 3-3 (1) ص 51 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: التباين والانحراف المعياري\nإرشاد للطالب: حل تمرين 3-3 (2) ص 52 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في ", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، جهاز الحاسب، برنامج GeoGebra، أخرى: الآلة الحاسبة العلمية", "الأساس الطبيعي هـ، العدد غير النسبي، ثابت أويلر، التقريب، الدالة الأسية الطبيعية، المقطع الصادي (0، 1)، خط التقارب الأفقي ص = 0، الدالة المتزايدة", "مراجعة قوانين الأسس من الصف الحادي عشر (الضرب والقسمة والقوة) بأسئلة سريعة: 2³ × 2⁴، (3²)³، 5⁰. (5 دقائق)", "1. الاستكشاف: ينفذ المعلم استكشف 1: حساب (1 + 1/ن)ⁿ لقيم ن = 1، 10، 100، 1000، 10000 بالحاسبة، ويكمل الطالب الجدول ويلاحظ الاقتراب من 2.718 (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. بناء المفهوم: يقدم المعلم العدد هـ وخصائصه ومفتاح هـˣ في الحاسبة، والطلبة يدون ويجرب المفتاح (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يكلف المجموعات بإيجاد هـ²، هـ⁻¹، هـ^0.5 مقربة إلى 3 منازل، وتحسب وتقارن (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يرسم المعلم مع الطلبة جدول قيم ومنحنى هـ^س ويقارنه بـ 2^س و 3^س في GeoGebra، ويرسم الطالب ويقارن (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. بناء المفهوم: يستخلص المعلم خصائص المنحنى: يمر بـ (0، 1)، لا يقطع محور السينات، متزايد، والطلبة يدون الخصائص (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعاوني: يكلف المعلم بتمارين 1-1 (2، 3) ص ⁦13–14⁩ من كتاب النشاط، وتحل المجموعات (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما القيمة التقريبية للعدد هـ مقربة إلى 3 منازل عشرية؟\nالإجابة النموذجية: 2.718\n2) [مستوى التطبيق] احسب هـ² مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: 7.389\n3) [مستوى الاستدلال] ماذا يحدث لقيمة (1 + 1/ن)ⁿ كلما كبرت ن؟\nالإجابة النموذجية: تقترب من هـ ≈ 2.718\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] ما نقطة تقاطع منحنى ص = هـ^س مع محور الصادات؟\nالإجابة النموذجية: (0، 1)\n5) [مستوى التطبيق] ما مدى الدالة ص = هـ^س؟\nالإجابة النموذجية: ص > 0\n6) [مستوى الاستدلال] لماذا لا يقطع منحنى ص = هـ^س محور السينات؟\nالإجابة النموذجية: لأن هـ^س > 0 لجميع قيم س", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل هـ عدد نسبي؟\nالإجابة النموذجية: لا؛ عدد غير نسبي\n2) [مستوى التطبيق] احسب هـ⁻¹ مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: 0.368\n3) [مستوى الاستدلال] رتب تصاعديًا: هـ، 2.7، 2.72.\nالإجابة النموذجية: 2.7، هـ، 2.72\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] ما مجال الدالة ص = هـ^س؟\nالإجابة النموذجية: جميع الأعداد الحقيقية\n5) [مستوى التطبيق] ما خط التقارب الأفقي لمنحنى ص = هـ^س؟\nالإجابة النموذجية: ص = 0\n6) [مستوى الاستدلال] هل الدالة ص = هـ^س متزايدة أم متناقصة؟\nالإجابة النموذجية: متزايدة", "إرشاد للطالب: مراجعة استكشف 1 (كتاب الطالب)، وحل تمارين 1-1 (1) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: رسم منحنى ص = هـ^س في الدفتر، وحل تمارين 1-1 (2، 3) ص ⁦13–14⁩ من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=1"]}, {"t": "تحويلات منحنى الدالة الأسية الطبيعية", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يرسم منحنيات مثل ص = هـ^(−س) و ص = هـ^س + ك و ص = أ هـ^س بالتحويلات الهندسية (15 دقيقة)\n2) يحدد المقطع الصادي وخط التقارب لكل منحنى (25 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "الانعكاس، الانسحاب الرأسي، التمدد، خط التقارب ص = ك", "مراجعة التحويلات الهندسية من الصف الحادي عشر: ص = د(س) + ك، ص = د(−س)، ص = أ د(س). (5 دقائق)", "1. النمذجة: يرسم المعلم ص = هـ^(−س) و ص = هـ^س − 2 و ص = 3هـ^س باستخدام GeoGebra، ويتابع الطالب ويحدد المقطع وخط التقارب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يعطي كل مجموعة منحنى لتحديد معادلته من بين خيارات، وتطابق المنحنيات بالمعادلات (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. فردي: يكلف المعلم بتمارين 1-1 (4، 5) ص ⁦14–15⁩ من كتاب النشاط، ويحل الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما خط التقارب الأفقي لمنحنى ص = هـ^س − 2؟\nالإجابة النموذجية: ص = −2\n2) [مستوى التطبيق] ما المقطع الصادي لمنحنى ص = 3هـ^س؟\nالإجابة النموذجية: (0، 3)\n3) [مستوى الاستدلال] صف التحويل الذي ينقل ص = هـ^س إلى ص = هـ^(−س).\nالإجابة النموذجية: انعكاس في محور الصادات", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما المقطع الصادي لمنحنى ص = هـ^س + 4؟\nالإجابة النموذجية: (0، 5)\n2) [مستوى التطبيق] هل الدالة ص = هـ^(−س) متزايدة أم متناقصة؟\nالإجابة النموذجية: متناقصة\n3) [مستوى الاستدلال] ما مدى الدالة ص = 2 + هـ^س؟\nالإجابة النموذجية: ص > 2", "إرشاد للطالب: حل تمارين 1-1 (4، 5) ص ⁦14–15⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=1"]}, {"t": "حساب قيم الدالة الأسية الطبيعية بالحاسبة والتقدير", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يستخدم الحاسبة لإيجاد قيم عبارات أسية طبيعية بدقة محددة (20 دقيقة)\n2) يقدّر قيمًا من التمثيل البياني ويتحقق منها بالحاسبة (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، الأقلام", "مفتاح هـ^س، التقريب لمنازل عشرية، التقدير من المنحنى", "تحدٍّ سريع: «احسب هـ^3 + هـ^(−2) دون كتابة نتائج وسيطة»، لمناقشة ترتيب إدخال العمليات في الحاسبة. (5 دقائق)", "1. النمذجة: يوضح المعلم أمثلة الدرس على استخدام الحاسبة ويعرض الأخطاء الشائعة (الأقواس في الأس)، والطلبة يدون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمارين 1-1 (كتاب الطالب) حسب توجيه المعلم، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقدير: يعرض المعلم منحنى ص = هـ^س ويطلب تقدير قيم ثم التحقق، ويقدر الطالب ويتحقق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. ا ني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ن = 500هـ^(0.2ز). ما القيمة الابتدائية لـ ن؟\nالإجابة النموذجية: 500\n2) [مستوى التطبيق] أوجد ن عندما ز = 5 (لأقرب عدد صحيح).\nالإجابة النموذجية: 500هـ ≈ 1359\n3) [مستوى الاستدلال] كمية دواء ك = 80هـ^(−0.1ز). أوجد ك بعد 10 ساعات لأقرب منزلة عشرية.\nالإجابة النموذجية: 80هـ^(−1) ≈ 29.4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل النموذج ن = 200هـ^(−0.3ز) يمثل نموًا أم اضمحلالًا؟\nالإجابة النموذجية: اضمحلالًا\n2) [مستوى التطبيق] للنموذج السابق: ما قيمة ن عندما ز = 0؟\nالإجابة النموذجية: 200\n3) [مستوى الاستدلال] أوجد ن عندما ز = 2 في النموذج السابق لأقرب عدد صحيح.\nالإجابة النموذجية: 200هـ^(−0.6) ≈ 110", "إرشاد للطالب: حل مسائل التطبيقات في تمارين 1-1 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=1"]}, {"t": "تمارين الدرس ومسابقة الختام", "w": "الأسبوع الأول (⁦6–10/9/2026⁩م)", "f": ["1) يحل تمارين متنوعة على الدالة الأسية الطبيعية (20 دقيقة)\n2) يقيّم إجابات الأقران ويصوبها (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الدالة الأسية الطبيعية، خصائصها، تطبيقاتها", "نشاط «صح أم خطأ»: هـ^0 = 0؛ هـ^س > 0 دائمًا؛ منحنى هـ^س يمر بـ (1، هـ). (5 دقائق)", "1. تعاوني بالمستويات: يكلف المعلم بإكمال تمارين 1-1 من كتاب النشاط ص ⁦13–16⁩ حسب المستوى، ويحل الطالب حسب مستواه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش المعلم الحلول، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – نمو أشجار القرم: تحسب المجموعات بالدالة الافتراضية ص = 100 هـ^(0.1ن) عدد شتلات قر  الأسية الطبيعية\nالانعكاس، الانسحاب الرأسي، التمدد، خط التقارب ص = ك\n\nالحصة 3: حساب قيم الدالة الأسية الطبيعية بالحاسبة والتقدير\nمفتاح هـ^س، التقريب لمنازل عشرية، التقدير من المنحنى\n\nالحصة 4: تطبيقات حياتية على الدالة الأسية الطبيعية (النمو والاضمحلال)\nالنمو الأسي، الاضمحلال الأسي، القيمة الابتدائية، الثابت ك\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nالدالة الأسية الطبيعية، خصائصها، تطبيقاتها", "الحصة 1: الأساس الطبيعي هـ وقيمته التقريبية\nمراجعة قوانين الأسس من الصف الحادي عشر (الضرب والقسمة والقوة) بأسئلة سريعة: 2³ × 2⁴، (3²)³، 5⁰. (5 دقائق)\n\nالحصة 2: تحويلات منحنى الدالة الأسية الطبيعية\nمراجعة التحويلات الهندسية من الصف الحادي عشر: ص = د(س) + ك، ص = د(−س)، ص = أ د(س). (5 دقائق)\n\nالحصة 3: حساب قيم الدالة الأسية الطبيعية بالحاسبة والتقدير\nتحدٍّ سريع: «احسب هـ^3 + هـ^(−2) دون كتابة نتائج وسيطة»، لمناقشة ترتيب إدخال العمليات في الحاسبة. (5 دقائق)\n\nالحصة 4: تطبيقات حياتية على الدالة الأسية الطبيعية (النمو والاضمحلال)\nيعرض صورة لمستعمرة بكتيريا ويسأل: «إذا تضاعف العدد بسرعة، فأي دالة تمثل ذلك؟» (5 دقائق)\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nنشاط «صح أم خطأ»: هـ^0 = 0؛ هـ^س > 0 دائمًا؛ منحنى هـ^س يمر بـ (1، هـ). (5 دقائق)", "الحصة 1: الأساس الطبيعي هـ وقيمته التقريبية — زمن الحصة 40 دقيقة\n1. الاستكشاف: ينفذ المعلم استكشف 1: حساب (1 + 1/ن)ⁿ لقيم ن = 1، 10، 100، 1000، 10000 بالحاسبة، ويكمل الطالب الجدول ويلاحظ الاقتراب من 2.718 (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. بناء المفهوم: يقدم المعلم العدد هـ وخصائصه ومفتاح هـˣ في الحاسبة، والطلبة يدون ويجرب المفتاح (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يكلف المجموعات بإيجاد هـ²، هـ⁻¹، هـ^0.5 مقربة إلى 3 منازل، وتحسب وتقارن (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يرسم المعلم مع الطلبة جدول قيم ومنحنى هـ^س ويقارنه بـ 2^س و 3^س في GeoGebra، ويرسم الطالب ويقارن (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. بناء المفهوم: يستخلص المعلم خصائص المنحنى: يمر بـ (0، 1)، لا يقطع محور السينات، متزايد، والطلبة يدون الخصائص (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تعاوني: يكلف المعلم بتمارين 1-1 (2، 3) ص ⁦13–14⁩ من كتاب النشاط، وتحل المجموعات (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: تحويلات منحنى الدالة الأسية الطبيعية — زمن الحصة 40 دقيقة\n1. النمذجة: يرسم المعلم ص = هـ^(−س) و ص = هـ^س − 2 و ص = 3هـ^س باستخدام GeoGebra، ويتابع الطالب ويحدد المقطع وخط التقارب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يعطي كل مجموعة منحنى لتحديد معادلته من بين خيارات، وتطابق المنحنيات بالمعادلات (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. فردي: يكلف المعلم بتمارين 1-1 (4، 5) ص ⁦14–15⁩ من كتاب النشاط، ويحل الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: حساب قيم الدالة الأسية الطبيعية بالحاسبة والتقدير — زمن الحصة 40 دقيقة\n1. النمذجة: يوضح المعلم أمثلة الدرس على استخدام الحاسبة ويعرض الأخطاء الشائعة (الأقواس في الأس)، والطلبة يدون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمارين 1-1 (كتاب الطالب) حسب توجيه المعلم، وتحل المجموعات (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تقدير: يعرض المعلم منحنى ص = هـ^س ويطلب تقدير قيم ثم التحقق، ويقدر الطالب ويتحقق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تطبيقات حياتية على الدالة الأسية الطبيعية (النمو والاضمحلال) — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم مسألة نمو: ن = 500هـ^(0.2ز) ومسألة اضمحلال: ك = 80هـ^(−0.1ز)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات تعاوني: يوزع المعلم مسائل حياتية (سكان، دواء، تبريد) على المجموعات، وتحل وتفسر (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض المجموعات تفسيرها، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين الدرس ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني بالمستويات: يكلف المعلم بإكمال تمارين 1-1 من كتاب النشاط ص ⁦13–16⁩ حسب المستوى، ويحل الطالب حسب مستواه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش المعلم الحلول، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – نمو أشجار القرم: تحسب المجموعات بالدالة الافتراضية ص = 100 هـ^(0.1ن) عدد شتلات قرم في محمية بعد سنوات مختلفة، ثم تناقش أهمية أشجار القرم في سواحل عمان وحمايتها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: الأساس الطبيعي هـ وقيمته التقريبية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما القيمة التقريبية للعدد هـ مقربة إلى 3 منازل عشرية؟\nالإجابة النموذجية: 2.718\n2) [مستوى التطبيق] احسب هـ² مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: 7.389\n3) [مستوى الاستدلال] ماذا يحدث لقيمة (1 + 1/ن)ⁿ كلما كبرت ن؟\nالإجابة النموذجية: تقترب من هـ ≈ 2.718\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] ما نقطة تقاطع منحنى ص = هـ^س مع محور الصادات؟\nالإجابة النموذجية: (0، 1)\n5) [مستوى التطبيق] ما مدى الدالة ص = هـ^س؟\nالإجابة النموذجية: ص > 0\n6) [مستوى الاستدلال] لماذا لا يقطع منحنى ص = هـ^س محور السينات؟\nالإجابة النموذجية: لأن هـ^س > 0 لجميع قيم س\n\nالحصة 2: تحويلات منحنى الدالة الأسية الطبيعية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما خط التقارب الأفقي لمنحنى ص = هـ^س − 2؟\nالإجابة النموذجية: ص = −2\n2) [مستوى التطبيق] ما المقطع الصادي لمنحنى ص = 3هـ^س؟\nالإجابة النموذجية: (0، 3)\n3) [مستوى الاستدلال] صف التحويل الذي ينقل ص = هـ^س إلى ص = هـ^(−س).\nالإجابة النموذجية: انعكاس في محور الصادات\n\nالحصة 3: حساب قيم الدالة الأسية الطبيعية بالحاسبة والتقدير\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] احسب هـ^3 مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: 20.086\n2) [مستوى التطبيق] احسب 4هـ^(0.5) مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: 6.595\n3) [مستوى الاستدلال] احسب هـ^(2×1.5 ل] احسب 100هـ^(−0.2) مقربًا إلى أقرب عدد صحيح.\nالإجابة النموذجية: 82\n\nالحصة 4: تطبيقات حياتية على الدالة الأسية الطبيعية (النمو والاضمحلال)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل النموذج ن = 200هـ^(−0.3ز) يمثل نموًا أم اضمحلالًا؟\nالإجابة النموذجية: اضمحلالًا\n2) [مستوى التطبيق] للنموذج السابق: ما قيمة ن عندما ز = 0؟\nالإجابة النموذجية: 200\n3) [مستوى الاستدلال] أوجد ن عندما ز = 2 في النموذج السابق لأقرب عدد صحيح.\nالإجابة النموذجية: 200هـ^(−0.6) ≈ 110\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما قيمة هـ^0؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] احسب هـ^2 − هـ مقربًا إلى منزلتين عشريتين.\nالإجابة النموذجية: 4.67\n3) [مستوى الاستدلال] ما المقطع الصادي لمنحنى ص = 5 − هـ^س؟\nالإجابة النموذجية: (0، 4)", "الحصة 1: الأساس الطبيعي هـ وقيمته التقريبية\nإرشاد للطالب: مراجعة استكشف 1 (كتاب الطالب)، وحل تمارين 1-1 (1) ص 13 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: رسم منحنى ص = هـ^س في الدفتر، وحل تمارين 1-1 (2، 3) ص ⁦13–14⁩ من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=1\n\nالحصة 2: تحويلات منحنى الدالة الأسية الطبيعية\nإرشاد للطالب: حل تمارين 1-1 (4، 5) ص ⁦14–15⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=1\n\nالحصة 3: حساب قيم الدالة الأسية الطبيعية بالحاسبة والتقدير\nإرشاد للطالب: حل تمارين 1-1 (كتاب الطالب)، وتمارين 1-1 (6، 7) ص ⁦15–16⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=1\n\nالحصة 4: تطبيقات ح ق] أوجد معكوس ع(س) = لط(س + 1).\nالإجابة النموذجية: ع⁻¹(س) = هـ^س − 1\n3) [مستوى الاستدلال] ما مجال د⁻¹(س) = لط(س − 2)؟\nالإجابة النموذجية: س > 2\n\nالحصة 4: تحويلات منحنى اللوغاريتم الطبيعي\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ما مجال ص = لط(س − 2)؟\nالإجابة النموذجية: س > 2\n2) [مستوى التطبيق] ما خط التقارب الرأسي لمنحنى ص = لط(س + 3)؟\nالإجابة النموذجية: س = −3\n3) [مستوى الاستدلال] أين يقطع منحنى ص = 2 + لط س محور السينات؟\nالإجابة النموذجية: لط س = −2 ← س = هـ^(−2) ≈ 0.135\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بسّط: هـ^(لط 7).\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] اكتب 3لط 2 + لط 5 بلوغاريتم واحد.\nالإجابة النموذجية: لط 40\n3) [مستوى الاستدلال] أوجد معكوس د(س) = 4 + لط س.\nالإجابة النموذجية: د⁻¹(س) = هـ^(س − 4)", "الحصة 1: اللوغاريتم الطبيعي لط س\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] لط س هو لوغاريتم للأساس:\nالإجابة النموذجية: هـ\n2) [مستوى التطبيق] احسب لط 0.5 مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: −0.693\n3) [مستوى الاستدلال] لماذا لط(−2) غير معرّف؟\nالإجابة النموذجية: لأن هـ^ص > 0 دائمًا فلا يوجد ص يحقق هـ^ص = −2\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] اكتب لط 20 − لط 4 في صورة لوغاريتم واحد.\nالإجابة النموذجية: لط 5\n5) [مستوى التطبيق] بسّط: 3 لط هـ.\nالإجابة النموذجية: 3\n6) [مستوى الاستدلال] بسّط: لط هـ² + لط 1.\nالإجابة النموذجية: 2\n\nالحصة 2: منحنى الدالة اللوغاريتمية الطبيعية وعلاقته بمنحنى هـ^س\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما خط التقارب الرأسي لمنحنى ص = لط س؟\nالإجابة النموذجية: س = 0\n2) [مستوى التطبيق] ما مدى الدالة ص = لط س؟\nالإجابة النموذجية: جميع الأعداد الحقيقية\n3) [مستوى الاستدلال] إذا كانت النقطة (2، 7.389) على منحنى هـ^س، فما النقطة المقابلة على منحنى لط س؟\nالإجابة النموذجية: (7.389، 2)\n\nالحصة 3: إيجاد معكوس دوال أسية ولوغاريتمية طبيعية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد معكوس د(س) = هـ^(2س).\nالإجابة النموذجية: د⁻¹(س) = ½ لط س\n2) [مستوى التطبيق] أوجد معكوس د(س) = 3هـ^(2س).\nالإجابة النموذجية: د⁻¹(س) = ½ لط(س/3)\n3) [مستوى الاستدلال] تحقق: إذا كانت د(س) = هـ^س + 2 فما د⁻¹(د(0))؟\nالإجابة النموذجية: د(0) = 3، د⁻¹(3) = لط 1 = 0\n\nالحصة 4: تحويلات منحنى اللوغاريتم الطبيعي\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما خط التقارب لمنحنى ص = لط(س − 2)؟\nالإجابة النموذجية: س = 2\n2) [مستوى التطبيق] ما مجال ص = لط(−س)؟\nالإجابة النموذجية: س < 0\n3) [مستوى الاستدلال] أين يقطع منحنى ص = لط(س − 2) محور السينات؟\nالإجابة النموذجية: س = 3\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] بسّط: لط هـ^(3س).\nالإجابة النموذجية: 3س\n2) [مستوى التطبيق] احسب لط 10 مقربًا إلى 3 منازل عشرية.\nالإجابة النموذجية: 2.303\n3) [مستوى الاستدلال] أوجد معكوس د(س) = هـ^(س − 1).\nالإجابة النموذجية: د⁻¹(س) = 1 + لط س", "الحصة 1: اللوغاريتم الطبيعي لط س\nإرشاد للطالب: حل تمارين 2-1 (1) ص 17 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 2-1 (2) ص ⁦17–18⁩ من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=2\n\nالحصة 2: منحنى الدالة اللوغاريتمية الطبيعية وعلاقته بمنحنى هـ^س\nإرشاد للطالب: رسم المنحنيين في الدفتر، وحل تمارين 2-1 (5) ص 19 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=2\n\nالحصة 3: إيجاد معكوس دوال أسية ولوغاريتمية طبيعية\nإرشاد للطالب: حل تمارين 2-1 (3، 4) ص 18 من كتاب النشاط وتمارين 2-1 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=2\n\nالحصة 4: تحويلات منحنى اللوغاريتم الطبيعي\nإرشاد للطالب: حل تمارين 2-1 (6، 7) ص ⁦19–20⁩ م  1.5، هـ^(2س) = 9، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمارين 3-1 (كتاب الطالب)، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. فردي: تمارين 3-1 (3) ص 21 من كتاب النشاط، ويحل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب هـ² = 7.389 في الصيغة اللوغاريتمية.\nالإجابة النموذجية: لط 7.389 = 2\n2) [مستوى التطبيق] اكتب لط 20 = 2.996 في الصيغة الأسية.\nالإجابة النموذجية: هـ^2.996 = 20\n3) [مستوى الاستدلال] اكتب ص = هـ^(3س) في الصيغة اللوغاريتمية.\nالإجابة النموذجية: 3س = لط ص\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد س إذا كانت هـ^س = 10 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 10 ≈ 2.303\n5) [مستوى التطبيق] أوجد س إذا كانت لط س = 1.5 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ^1.5 ≈ 4.482\n6) [مستوى الاستدلال] أوجد س إذا كانت هـ^(2س) = 9 بدلالة لط.\nالإجابة النموذجية: س = ½ لط 9 = لط 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] اكتب هـ^0 = 1 في الصيغة اللوغاريتمية.\nالإجابة النموذجية: لط 1 = 0\n2) [مستوى التطبيق] اكتب لط س = 4 في الصيغة الأسية.\nالإجابة النموذجية: س = هـ^4\n3) [مستوى الاستدلال] اكتب لط(ص + 1) = س في الصيغة الأسية.\nالإجابة النموذجية: ص + 1 = هـ^س\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد س: هـ^س = 1.\nالإجابة النموذجية: س = 0\n5) [مستوى التطبيق] أوجد س: لط س = 0.\nالإجابة النموذجية: س = 1\n6) [مستوى الاستدلال] أوجد س: لط(2س) = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = هـ³/2 ≈ 10.04", "إرشاد للطالب: حل تمارين 3-1 (1، 2) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 3-1 (كتاب الطالب)، وتمارين 3-1 (3) ص 21 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=3"]}, {"t": "خصائص لط هـ^س = س و هـ^(لط س) = س", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يطبق الخاصيتين لط هـ^س = س و هـ^(لط س) = س في التبسيط (15 دقيقة)\n2) يبسط عبارات مركبة تجمع بين القوانين والخاصيتين (25 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "الدالة وعكسها، التركيب، التبسيط", "سؤال: «ما ناتج تركيب دالة مع معكوسها؟ طبّق على هـ^(لط 5).» (5 دقائق)", "1. النمذجة: يبسط المعلم عبارات مثل هـ^(2لط 3)، لط(هـ²/هـ⁵)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بقائمة تبسيطات، ويحل الطالب ويتبادل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمرين 3-1 (4) ص 21 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بسّط: هـ^(لط 5).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] بسّط: هـ^(2لط 3).\nالإجابة النموذجية: هـ^(لط 9) = 9\n3) [مستوى الاستدلال] بسّط: لط(هـ²/هـ⁵).\nالإجابة النموذجية: −3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] بسّط: لط هـ^7.\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] بسّط: هـ^(لط 4 + لط 2).\nالإجابة النموذجية: 8\n3) [مستوى الاستدلال] بسّط: هـ^(−لط 2).\nالإجابة النموذجية: 1/2", "إرشاد للطالب: حل تمرين 3-1 (4) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=3"]}, {"t": "التطبيقات على الصيغتين في مواقف حياتية", "w": "الأسبوع الثالث (⁦20–24/9/2026⁩م)", "f": ["1) يحول نموذجًا أسيًا حياتيًا إلى صيغة لوغاريتمية لإيجاد الزمن (25 دقيقة)\n2) يفسر الناتج في سياق المسألة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم التشاركي", "الكتاب، ا دل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمرين 3-1 (4) ص 21 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: التطبيقات على الصيغتين في مواقف حياتية — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم مسألة التضاعف بالتحويل: هـ^(0.3ز) = 2، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات: يوزع المعلم مسائل (نصف العمر، التبريد، الاستثمار) على المجموعات، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض المجموعات، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تدريبات متنوعة على الصيغتين — زمن الحصة 40 دقيقة\n1. تعاوني بالمستويات: يوزع المعلم أوراق عمل متدرجة (معرفة/تطبيق/استدلال)، ويحل الطالب حسب مستواه (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تقييم الأقران: تتبادل المجموعات الأوراق، ويقيّم الطالب (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تلخيص: يلخص المعلم الأخطاء الشائعة، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: تمارين الدرس ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: يكلف المعلم بإكمال تمارين 3-1 (كتاب الطالب) وكتاب النشاط ص 21، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – بطاقات التوأم: تطابق المجموعات بطاقات الصيغة الأسية مع ما يكافئها من الصيغة اللوغاريتمية، ويحمل كل زوج صحيح حرفًا، فتكوّن الحروف معًا كلمة «عُمان» أو «وطني» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: التحويل بين الصيغة الأسية والصيغة اللوغاريتمية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب ختامي (5 دقائق):\n1) [مستوى المعرفة] اكتب هـ^0 = 1 في الصيغة اللوغاريتمية.\nالإجابة النموذجية: لط 1 = 0\n2) [مستوى التطبيق] اكتب لط س = 4 في الصيغة الأسية.\nالإجابة النموذجية: س = هـ^4\n3) [مستوى الاستدلال] اكتب لط(ص + 1) = س في الصيغة الأسية.\nالإجابة النموذجية: ص + 1 = هـ^س\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد س: هـ^س = 1.\nالإجابة النموذجية: س = 0\n5) [مستوى التطبيق] أوجد س: لط س = 0.\nالإجابة النموذجية: س = 1\n6) [مستوى الاستدلال] أوجد س: لط(2س) = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = هـ³/2 ≈ 10.04\n\nالحصة 2: خصائص لط هـ^س = س و هـ^(لط س) = س\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] بسّط: لط هـ^7.\nالإجابة النموذجية: 7\n2) [مستوى التطبيق] بسّط: هـ^(لط 4 + لط 2).\nالإجابة النموذجية: 8\n3) [مستوى الاستدلال] بسّط: هـ^(−لط 2).\nالإجابة النموذجية: 1/2\n\nالحصة 3: التطبيقات على الصيغتين في مواقف حياتية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما القيمة الابتدائية في ن = 100هـ^(0.3ز)؟\nالإجابة النموذجية: 100\n2) [مستوى التطبيق] أوجد ن عندما ز = 2 (لأقرب عدد صحيح).\nالإجابة النموذجية: 100هـ^0.6 ≈ 182\n3) [مستوى الاستدلال] ن = 1000هـ^(−0.2ز). متى يصبح ن = 500؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 2 / 0.2 ≈ 3.47\n\nالحصة 4: تدريبات متنوعة على الصيغتين\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] اكتب لط 0.5 = −0.693 بالصيغة الأسية.\nالإجابة النموذجية: هـ^(−0.693) = 0.5\n2) [مستوى التطبيق] أوجد س: هـ^(س − 2) = 1.\nالإجابة النموذجية: س = 2\n3) [مستوى الاستدلال] أوجد س: لط س − لط 3 = لط 4.\nالإجابة النموذجية: س = 12\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] اكتب لط ص = 2 في الصيغة الأسية.\nالإجابة النموذجية: ص = هـ²\n2) [مستوى التطبيق] بسّط: هـ^(3لط 2).\nالإجابة النموذجية: 8\n3) [مستوى الاستدلال] أوجد س: لط(س/2) = 1 (لأقرب منزلتين).\nالإجابة النموذجية: س = 2هـ ≈ 5.44", "الحصة 1: التحويل بين الصيغة الأسية والصيغة اللوغاريتمية\nإرشاد للطالب: حل تمارين 3-1 (1، 2) ص 21 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأ = لط 2 أو لط 3\n2) [مستوى التطبيق] حل: هـ^(2س) − هـ^س − 2 = 0.\nالإجابة النموذجية: هـ^س = 2 (−1 مرفوض) ← س = لط 2\n3) [مستوى الاستدلال] لماذا لا يكون للمعادلة هـ^س = −1 حل؟\nالإجابة النموذجية: لأن هـ^س > 0 دائمًا", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: (هـ^س)² = 9.\nالإجابة النموذجية: هـ^س = 3 ← س = لط 3\n2) [مستوى التطبيق] حل: هـ^(2س) − 4هـ^س = 0.\nالإجابة النموذجية: هـ^س = 4 ← س = لط 4\n3) [مستوى الاستدلال] حل: هـ^س + 6هـ^(−س) = 5.\nالإجابة النموذجية: هـ^(2س) − 5هـ^س + 6 = 0 ← س = لط 2 أو لط 3", "إرشاد للطالب: حل تمارين 4-1 (6، 7) ص 24 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=4"]}, {"t": "تطبيقات حياتية على حل المعادلات الأسية", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يحل مسائل حياتية (نمو سكاني، اضمحلال إشعاعي، تناقص الحشرات) بحل معادلات أسية (25 دقيقة)\n2) يفسر الحل ويقربه بما يناسب السياق (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "النمو والاضمحلال، الزمن اللازم، التقريب المناسب للسياق", "مسألة كتاب النشاط ص 24: تتناقص أعداد مستعمرة حشرات وفق صيغة أسية؛ متى يصل العدد إلى قيمة معينة؟ (5 دقائق)", "1. النمذجة: يحل المعلم مسألة الحشرات ومسألة نمو، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات تعاوني: يوزع المعلم مسائل كتاب النشاط تمرين 8 ص 24 ومسائل مشابهة، وتحل وتفسر (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ل = 50000هـ^(−0.04ز). متى يصبح ل = 25000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 2 / 0.04 ≈ 17.3\n2) [مستوى التطبيق] ن = 500هـ^(0.2ز). متى يصبح ن = 1000؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 2 / 0.2 ≈ 3.47\n3) [مستوى الاستدلال] في النموذج الأول، متى يصبح ل = 10000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 5 / 0.04 ≈ 40.2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ن = 200هـ^(0.1ز). أوجد ن عندما ز = 0.\nالإجابة النموذجية: 200\n2) [مستوى التطبيق] متى يصبح ن = 600 في النموذج السابق؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 3 / 0.1 ≈ 11.0\n3) [مستوى الاستدلال] ك = 80هـ^(−0.5ز). متى تصبح ك = 20؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 4 / 0.5 ≈ 2.77", "إرشاد للطالب: حل تمرين 4-1 (8) ص 24 من كتاب النشاط ومسائل التطبيقات (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=4"]}, {"t": "تمارين الدرس ومسابقة الختام", "w": "الأسبوع الرابع (⁦27/9–1/10/2026⁩م)", "f": ["1) يحل معادلات أسية ولوغاريتمية طبيعية متنوعة (20 دقيقة)\n2) يقيّم صحة الحلول بالتعويض (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المعادلات الأسية واللوغاريتمية الطبيعية", "نشاط «حل وتحقق»: يحل الطالب هـ^(س + 2) = 5 ثم يتحقق بالحاسبة. (5 دقائق)", "1. تعاوني بالمستويات: يكلف المعلم بإكمال تمارين 4-1 ص ⁦22–24⁩ من كتاب النشاط، ويحل الطالب حسب مستواه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – ادخار لمشروع عماني: تحل المجموعات المعادلة 500 هـ^(0.05ن) = 1000 لمعرفة زمن مضاعفة مدخرات شاب يحلم بمشروع صغير، وتربط ذلك بريادة الأعمال في رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: هـ^(س + 2) = 5 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 5 − 2 ≈ −0.391\n2) [مستوى التطبيق] حل: لط(3س) = 2 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ²/3 ≈ 2.463\n3) [مستوى الاستدلال] حل: لط(س + 1) + لط(س − 1) = لط 8.\nالإجابة النموذجية: س² − 1 = 8 ← س = 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: 5هـ^س = 5.\nالإجابة النموذجية: س = 0\n2) [مستوى التطبيق] حل: لط(س − 3) = 0.\nالإجابة النموذجية: س = 4\n3) [مستوى الاستدلال] حل: هـ^(4س) = 20 (لأقرب 3 منازل).\nالإجابة النموذجية: س = ¼ لط 20 ≈ 0.749", "إرشاد للطالب: إكمال تمارين 4-1 من كتاب النشاط والاستعداد لدرس تحويل علاقة إلى صيغة خطية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=4"]}], "c": ["الحصة 1: حل معادلات أسية طبيعية بسيطة\n1) يحل معادلات على الصورة أ هـ^(ك س) = ب بأخذ اللوغاريتم الطبيعي للطرفين (10 دقائق)\n2) يعطي الحل بالقيمة الدقيقة وبالتقريب المطلوب (10 دقائق)\n3) يحل معادلات على الصورة لط(أس + ب) = ك بالتحويل إلى الصيغة الأسية (15 دقيقة)\n4) يتحقق من أن الحل يقع في مجال الدالة اللوغاريتمية (5 دقائق)\n\nالحصة 2: معادلات تتضمن أكثر من حد لوغاريتمي\n1) يستخدم قوانين اللوغاريتمات لدمج الحدود ثم يحل المعادلة (25 دقيقة)\n2) يستبعد الحلول التي تجعل اللوغاريتم غير معرّف (15 دقيقة)\n\nالحصة 3: معادلات أسية في صورة تربيعية\n1) يحل معادلات مثل هـ^(2س) − 5هـ^س + 6 = 0 بالتعويض ص = هـ^س (25 دقيقة)\n2) يستبعد الحلول المرفوضة (هـ^س ≤ 0) (15 دقيقة)\n\nالحصة 4: تطبيقات حياتية على حل المعادلات الأسية\n1) يحل مسائل حياتية (نمو سكاني، اضمحلال إشعاعي، تناقص الحشرات) بحل معادلات أسية (25 دقيقة)\n2) يفسر الحل ويقربه بما يناسب السياق (15 دقيقة)\n\nالحصة 5: تمارين الدرس ومسابقة الختام\n1) يحل معادلات أسية ولوغاريتمية طبيعية متنوعة (20 دقيقة)\n2) يقيّم صحة الحلول بالتعويض (20 دقيقة)", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تقييم\n\nالحصة 2: معادلات تتضمن أكثر من حد لوغاريتمي\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 3: معادلات أسية في صورة تربيعية\nالمخرج 1: تطبيق\n  تربيعية\nسؤال: «ما العلاقة بين هـ^(2س) و (هـ^س)²؟» (5 دقائق)\n\nالحصة 4: تطبيقات حياتية على حل المعادلات الأسية\nمسألة كتاب النشاط ص 24: تتناقص أعداد مستعمرة حشرات وفق صيغة أسية؛ متى يصل العدد إلى قيمة معينة؟ (5 دقائق)\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nنشاط «حل وتحقق»: يحل الطالب هـ^(س + 2) = 5 ثم يتحقق بالحاسبة. (5 دقائق)", "الحصة 1: حل معادلات أسية طبيعية بسيطة — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم أمثلة الدرس (كتاب الطالب): هـ^س = 5، 3هـ^س − 2 = 10، هـ^(2س) = 7، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمارين 4-1 (1، 2) ص 22 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. فردي: يكلف المعلم بتمارين 4-1 (كتاب الطالب)، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم: لط س = 2، لط(2س − 1) = 3، 3لط س = 6، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تشاركي: يكلف الأزواج بتمارين 4-1 (3، 4) ص 23 من كتاب النشاط، ويحل الطالب ويتبادل (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. تحقق: يتحقق المعلم من الحلول بالتعويض، ويتحقق الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: معادلات تتضمن أكثر من حد لوغاريتمي — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم: لط س + لط(س + 2) = لط 8، لط(س − 1) + لط 3 = لط(س + 1)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بمسائل مشابهة من كتاب النشاط ص 23، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة: يناقش المعلم الحلول المرفوضة، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: معادلات أسية في صورة تربيعية — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم: هـ^(2س) − 5هـ^س + 6 = 0، هـ^(2س) − هـ^س − 2 = 0، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تشاركي: يكلف الأزواج بتمارين 4-1 (6) ص 24 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم الحلول المرفوضة، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 4: تطبيقات حياتية على حل المعادلات الأسية — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم مسألة الحشرات ومسألة نمو، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات تعاوني: يوزع المعلم مسائل كتاب النشاط تمرين 8 ص 24 ومسائل مشابهة، وتحل وتفسر (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين الدرس ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني بالمستويات: يكلف المعلم بإكمال تمارين 4-1 ص ⁦22–24⁩ من كتاب النشاط، ويحل الطالب حسب مستواه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – ادخار لمشروع عماني: تحل المجموعات المعادلة 500 هـ^(0.05ن) = 1000 لمعرفة زمن مضاعفة مدخرات شاب يحلم بمشروع صغير، وتربط ذلك بريادة الأعمال في رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: هـ^س = 5 (بالقيمة الدقيقة).\nالإجابة النموذجية: س = لط 5\n2) [مستوى التطبيق] حل: 3هـ^س − 2 = 10 (لأقرب 3 منازل).\nالإجابة النموذجية: هـ^س = 4 ← س = لط 4 ≈ 1.386\n3) [مستوى الاستدلال] حل: هـ^(2س) = 7 (لأقرب 3 منازل).\nالإجابة النموذجية: س = ½ لط 7 ≈ 0.973\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] حل: لط س = 2 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ² ≈ 7.389\n5) [مستوى التطبيق] حل: لط(2س − 1) = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = (هـ³ + 1)/2 ≈ 10.54\n6) [مستوى الاستدلال] حل: 3لط س = 6.\nالإجابة النموذجية: س = هـ² ≈ 7.389\n\nالحصة 2: معادلات تتضمن أكثر من حد لوغاريتمي\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: لط س + لط(س + 2) = لط 8.\nالإجابة النموذجية: س(س + 2) = 8 ← س = 2 (س = −4 مرفوض)\n2) [مستوى التطبيق] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: 3(س − 1) = س + 1 ← س = 2\n3) [مستوى الاستدلال] لماذا نرفض س = −4 في المعادلة الأولى؟\nالإجابة النموذجية: لأن لط(−4) غير معرّف\n\nالحصة 3: معادلات أسية في صورة تربيعية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: هـ^(2س) − 5هـ^س + 6 = 0.\nالإجابة النموذجية: هـ^س = 2 أو 3 ← س = لط 2 أو لط 3\n2) [مستوى التطبيق] حل: هـ^(2س) − هـ^س − 2 = 0.\nالإجابة النموذجية: هـ^س = 2 (−1 مرفوض) ← س = لط 2\n3) [مستوى الاستدلال] لماذا لا يكون للمعادلة هـ^س = −1 حل؟\nالإجابة النموذجية: لأن هـ^س > 0 دائمًا\n\nالحصة 4: تطبيقات حياتية على حل المعادلات الأسية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ل = 50000هـ^(−0.04ز). متى يصبح ل = 25000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 2 / 0.04 ≈ 17.3\n2) [مستوى التطبيق] ن = 500هـ^(0.2ز). متى يصبح ن = 1000؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 2 / 0.2 ≈ 3.47\n3) [مستوى الاستدلال] في النموذج الأول، متى يصبح ل = 10000؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 5 / 0.04 ≈ 40.2\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: هـ^(س + 2) = 5 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 5 − 2 ≈ −0.391\n2) [مستوى التطبيق] حل: لط(3س) = 2 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ²/3 ≈ 2.463\n3) [مستوى الاستدلال] حل: لط(س + 1) + لط(س − 1) = لط 8.\nالإجابة النموذجية: س² − 1 = 8 ← س = 3", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: هـ^س = 1.\nالإجابة النموذجية: س = 0\n2) [مستوى التطبيق] حل: 2هـ^س = 18 بالقيمة الدقيقة.\nالإجابة النموذجية: س = لط 9\n3) [مستوى الاستدلال] حل: هـ^(س − 1) = 6 (لأقرب 3 منازل).\nالإجابة النموذجية: س = 1 + لط 6 ≈ 2.792\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] حل: لط س = 0.\nالإجابة النموذجية: س = 1\n5) [مستوى التطبيق] حل: لط(س + 4) = 1 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ − 4 ≈ −1.282\n6) [مستوى الاستدلال] حل: لط(س²) = 4 حيث س > 0 (لأقرب 3 منازل).\nالإجابة النموذجية: س = هـ² ≈ 7.389\n\nالحصة 2: معادلات تتضمن أكثر من حد لوغاريتمي\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: لط(2س) = لط 10.\nالإجابة النموذجية: س = 5\n2) [مستوى التطبيق] حل: لط س − لط 2 = لط 6.\nالإجابة النموذجية: س = 12\n3) [مستوى الاستدلال] حل: 2لط س = لط(س + 6).\nالإجابة النموذجية: س² = س + 6 ← س = 3 (س = −2 مرفوض)\n\nالحصة 3: معادلات أسية في صورة تربيعية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: (هـ^س)² = 9.\nالإجابة النموذجية: هـ^س = 3 ← س = لط 3\n2) [مستوى التطبيق] حل: هـ^(2س) − 4هـ^س = 0.\nالإجابة النموذجية: هـ^س = 4 ← س = لط 4\n3) [مستوى الاستدلال] حل: هـ^س + 6هـ^(−س) = 5.\nالإجابة النموذجية: هـ^(2س) − 5هـ^س + 6 = 0 ← س = لط 2 أو لط 3\n\nالحصة 4: تطبيقات حياتية على حل المعادلات الأسية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ن = 200هـ^(0.1ز). أوجد ن عندما ز = 0.\nالإجابة النموذجية: 200\n2) [مستوى التطبيق] متى يصبح ن = 600 في النموذج السابق؟ (لأقرب منزلة)\nالإجابة النموذجية: ز = لط 3 / 0.1 ≈ 11.0\n3) [مستوى الاستدلال] ك = 80هـ^(−0.5ز). متى تصبح ك = 20؟ (لأقرب منزلتين)\nالإجابة النموذجية: ز = لط 4 / 0.5 ≈ 2.77\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: 5هـ^س = 5.\nالإجابة النموذجية: س = 0\n2) [مستوى التطبيق] حل: لط(س − 3) = 0.\nالإجابة النموذجية: س = 4\n3) [مستوى الاستدلال] حل: هـ^(4س) = 20 (لأقرب 3 منازل).\nالإجابة النموذجية: س = ¼ لط 20 ≈ 0.749", "الحصة 1: حل معادلات أسية طبيعية بسيطة\nإرشاد للطالب: حل تمارين 4-1 (1، 2) ص 22 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 4-1 (3، 4) ص 23 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/ba (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، عروض تقديمية", "الصيغة الخطية ص = م س + ج، المتغيران الجديدان، الميل، المقطع الصادي، العلاقة الأسية، علاقة القوة، اختيار المتغيرين (لط س، لط ص) أو (س، لط ص)", "مراجعة معادلة المستقيم ص = م س + ج: ما الميل والمقطع في ص = 3س − 2؟ (5 دقائق)", "1. النمذجة: يعرض المعلم شرائح التحويل من دليل المعلم ويحول ص = ك هـ^(أس) إلى لط ص = أ س + لط ك، ويتابع الطالب ويدون المتغيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتحويل ص = 3هـ^(2س) و ص = 5هـ^(−س)، وتحول المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمرين 5-1 (1) ص 25 من كتاب النشاط، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحول المعلم ص = ك س^ن و ص = ك أ^س بأمثلة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تشاركي: يكلف الأزواج بتحويل 4 علاقات وتحديد المتغيرين والميل والمقطع، ويحل الطالب ويتبادل (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. فردي: تمرين 5-1 (2) ص 25 من كتاب النشاط، ويحل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حوّل ص = 3هـ^(2س) إلى الصيغة الخطية.\nالإجابة النموذجية: لط ص = 2س + لط 3\n2) [مستوى التطبيق] في الصيغة السابقة ما الميل والمقطع الصادي؟\nالإجابة النموذجية: الميل 2، المقطع لط 3\n3) [مستوى الاستدلال] ما المتغيران المرسومان على المحورين؟\nالإجابة النموذجية: س على الأفقي و لط ص على الرأسي\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] حوّل ص = 2س³ إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 3 لط س + لط 2\n5) [مستوى التطبيق] حوّل ص = 5 × 3^س إلى صيغة خطية.\nالإجابة النموذجية: لط ص = (لط 3) س + لط 5\n6) [مستوى الاستدلال] في ص = 2س³ ما المتغيران المرسومان؟\nالإجابة النموذجية: لط س أفقيًا و لط ص رأسيًا", "أسئلة التقويم الختامي (5 دقائق): ني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مستقيم لط ص مقابل س ميله 0.5 ومقطعه 1.2. اكتب ص بدلالة س.\nالإجابة النموذجية: ص = هـ^1.2 هـ^(0.5س) ≈ 3.32هـ^(0.5س)\n2) [مستوى التطبيق] مستقيم لط ص مقابل لط س ميله 2 ومقطعه 0.7. أوجد ن و ك في ص = ك س^ن.\nالإجابة النموذجية: ن = 2، ك = هـ^0.7 ≈ 2.01\n3) [مستوى الاستدلال] مستقيم لط ص مقابل س يمر بـ (1، 3) و (3، 7). أوجد الميل والمقطع.\nالإجابة النموذجية: الميل 2، المقطع 1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] إذا كان المقطع الصادي لط ك = 0، فما ك؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] إذا كان الميل في لط ص مقابل س يساوي −0.3، فما أ في ص = ك هـ^(أس)؟\nالإجابة النموذجية: أ = −0.3\n3) [مستوى الاستدلال] في السؤال الثالث من التقويم التكويني اكتب ص بدلالة س.\nالإجابة النموذجية: ص = هـ هـ^(2س) = هـ^(2س + 1)", "إرشاد للطالب: حل تمرين 5-1 (3) ص 25 من كتاب النشاط وتمارين 5-1 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5"]}, {"t": "نمذجة بيانات حقيقية بالتحويل الخطي", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يحول جدول بيانات إلى قيم لط ص (ولط س) ويرسمها لاختبار الخطية (25 دقيقة)\n2) يقدّر الثوابت من أفضل مستقيم ويكتب النموذج (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: إبداع", "التعلم المبني على المشاريع، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، جهاز الحاسب، أخرى: الآلة الحاسبة العلمية، أخرى: برنامج جداول البيانات", "البيانات التجريبية، اختبار الخطية، أفضل مستقيم، النموذج", "يعرض جدول بيانات لنمو نبات خلال أيام ويسأل: «هل النمو خطي أم أسي؟ كيف نتحقق؟» (5 دقائق)", "1. النمذجة: يحسب المعلم لط ص لكل قيمة ويرسم لط ص مقابل س باستخدام جداول البيانات، ويتابع الطالب ويحسب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مشروع مصغر: تعطى كل مجموعة جدولًا لتحديد النموذج وكتابة معادلته، وتحسب وترسم وتكتب النموذج (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض: تعرض المجموعات نماذجها، وتعرض (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] لماذا نرسم لط ص مقابل س لاختبار العلاقة ص = ك هـ^(أس)؟\nالإجابة النموذجية: لأنها تصبح خطية: لط ص = أ س + لط ك\n2) [مستوى التطبيق] إذا كانت نقاط لط ص مقابل س على مستقيم ميله 0.4 ومقطعه 2، فاكتب النموذج.\nالإجابة النموذجية: ص = هـ² هـ^(0.4س) ≈ 7.39هـ^(0.4س)\n3) [مستوى الاستدلال] إذا كانت نقاط لط ص مقابل لط س على مستقيم، فما نوع العلاقة؟\nالإجابة النموذجية: علاقة قوة ص = ك س^ن", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما قيمة لط ص عندما ص = 20؟ (لأقرب منزلتين)\nالإجابة النموذجية: 3.00\n2) [مستوى التطبيق] مستقيم لط ص مقابل لط س ميله 3 ومقطعه 0. اكتب العلاقة.\nالإجابة النموذجية: ص = س³\n3) [مستوى الاستدلال] إذا لم تقع نقاط لط ص مقابل س على مستقيم، فماذا نستنتج؟\nالإجابة النموذجية: العلاقة ليست على الصورة ص = ك هـ^(أس)", "إرشاد للطالب: حل تمرين 5-1 (4) ص 25 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5"]}, {"t": "مراجعة الوحدة الأولى (1)", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يراجع مهارات الوحدة الأولى: هـ ولط وقوانينهما، المعكوس، المعادلات، التحويل الخطي (25 دقيقة)\n2) يحل مسائل مراجعة متنوعة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "مفاهيم الوحدة الأولى", "يقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الأولى (كتاب الطالب). (5 دقائق)", "1. خريطة مفاهيم: يبني المعلم مع الطلبة خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الأولى (كتاب الطالب)، ويحل الطالب حسب مستواه (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: س = 2\n2) [مستوى التطبيق] حل: هـ^(2س) = 15 (لأقرب منزلتين).\nالإجابة النموذجية: س = ½ لط 15 ≈ 1.35\n3) [مستوى الاستدلال] حوّل ص = 4هـ^(3س) إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 3س + لط 4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] بسّط: لط هـ^4 + هـ^(لط 2).\nالإجابة النموذجية: 4 + 2 = 6\n2) [مستوى التطبيق] أوجد معكوس د(س) = هـ^(2س) + 1.\nالإجابة النموذجية: د⁻¹(س) = ½ لط(س − 1)\n3) [مستوى الاستدلال] حل: هـ^(2س) − 3هـ^س + 2 = 0.\nالإجابة النموذجية: هـ^س = 1 أو 2 ← س = 0 أو لط 2", "إرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الأولى (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5"]}, {"t": "مراجعة الوحدة الأولى (2) ومسابقة الختام", "w": "الأسبوع الخامس (⁦4–8/10/2026⁩م)", "f": ["1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط (25 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مفاهيم الوحدة الأولى", "سؤال «صحح الخطأ»: حل طالب لط س = 3 فكتب س = 3هـ. ما الخطأ؟ (5 دقائق)", "1. كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الأولى ص ⁦26–28⁩ من كتاب النشاط، ويحل الطالب ويناقش (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يعرض المعلم الحلول، ويصحح الطالب (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مشتل الأمن الغذائي: يحول كل
