نا؟\nالإجابة النموذجية: متوسط عدد الميداليات على المدى الطويل لكل سباق\n3) [مستوى الاستدلال] لعبة: تربح 5 باحتمال 0.2 و 0 باحتمال 0.8. أوجد الربح المتوقع.\nالإجابة النموذجية: 1", "إرشاد للطالب: حل تمرين 3-3 (4، 5) ص ⁦53–54⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "مراجعة الوحدة الثالثة", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يراجع مفاهيم الوحدة الثالثة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع المتغير والتوزيع والتوقع والتباين (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "المتغير العشوائي المتقطع، التوزيع الاحتمالي، القيمة المتوقعة، التباين", "يقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الثالثة (كتاب الطالب). (5 دقائق)", "1. خريطة مفاهيم: يبني المعلم خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وكتاب النشاط ص ⁦55–56⁩، ويحل الطالب حسب مستواه (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 2، 3، 4، 5 باحتمالات متساوية. أوجد ت(س).\nالإجابة النموذجية: 3.5\n2) [مستوى التطبيق] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: ت(س²) = 13.5 ← 13.5 − 12.25 = 1.25\n3) [مستوى الاستدلال] ل(س) = ك س لـ س = 1، 2، 3. أوجد ك و ت(س).\nالإجابة النموذجية: ك = 1/6؛ ت(س) = (1 + 4 + 9)/6 = 7/3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما مجموع الاحتمالات في توزيع احتمالي؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] قيم 0، 1 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.6\n3) [مستوى الاستدلال] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: 0.6 − 0.36 = 0.24", "إرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وص ⁦55–56⁩ من كتاب النشاط، والاستعداد للاختبار القصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "ختام الوحدة الثالثة ومسابقة الختام", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يطبق مهارات الوحدة الثالثة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المتغيرات العشوائية المتقطعة", "سؤال «صحح الخطأ»: حسب طالب التباين = ت(س²) − ت(س). ما الخطأ؟ (5 دقائق)", "1. تعاوني: مراجعة شاملة لكتاب النشاط ص ⁦51–56⁩، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مسابقة تاريخ عمان: تحسب المجموعات القيمة المتوقعة لنقاط فريق في مسابقة ثقافية عن عمان علمت احتمالات حصوله على 1 أو 2 أو 3 نقاط، ثم تجري جولة أسئلة قصيرة للتحقق (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صحح: التباين = ت(س²) − ت(س).\nالإجابة النموذجية: التباين = ت(س²) − (ت(س))²\n2) [مستوى التطبيق] لرمي حجر نرد: ت(س) = 3.5 و ت(س²) = 91/6. أوجد التباين (لأقرب منزلتين).\nالإجابة النموذجية: 91/6 − 12.25 ≈ 2.92\n3) [مستوى الاستدلال] قيم 1، 2، 3 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.5 + 0.6 + 0.6 = 1.7", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز التباين؟\nالإجابة النموذجية: ع²(س)\n2) [مستوى التطبيق] إذا كان ع²(س) = 4 فما ع(س)؟\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] قيم 0، 2 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 1", "إرشاد للطالب: الاستعداد للاختبار القصير في الوحدة الثالثة والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}], "c": ["الحصة 1: القيمة المتوقعة ت(س)\n1) يحسب القيمة المتوقعة ت(س) = مجموع س × ل(س) (10 دقائق)\n2) يفسر القيمة المتوقعة بوصفها الوسط الحسابي على المدى الطويل (10 دقائق)\n3) يحسب التباين ع²(س) = مجموع س² ل(س) − (ت(س))² (15 دقيقة)\n4) يحسب الانحراف المعياري ع(س) ويفسره مقياسًا لانتشار القيم (5 دقائق)\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة\n1) يجد احتمالات أو قيمًا مجهولة بمعلومية مجموع الاحتمالات والقيمة المتوقعة (25 دقيقة)\n2) يحل نظام معادلتين خطيتين ناتجًا من شرطي التوزيع (15 دقيقة)\n\nالحصة 3: تطبيقات حياتية على القيمة المتوقعة والتباين\n1) يحسب القيمة المتوقعة في مواقف حياتية (ألعاب، أرباح، ميداليات) (25 دقيقة)\n2) يتخذ قرارًا بناءً على القيمة المتوقعة والانتشار (15 دقيقة)\n\nالحصة 4: مراجعة الوحدة الثالثة\n1) يراجع مفاهيم الوحدة الثالثة (25 دقيقة)\n2) يحل مسائل مراجعة تجمع المتغير والتوزيع والتوقع والتباين (15 دقيقة)\n\nالحصة 5: ختام الوحدة الثالثة ومسابقة الختام\n1) يطبق مهارات الوحدة الثالثة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: القيمة المتوقعة ت(س)\nالمخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\n\nالحصة 3: تطبيقات حياتية على القيمة المتوقعة والتباين\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 4: مراجعة الوحدة الثالثة\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 5: ختام الوحدة الثالثة ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: القيمة المتوقعة ت(س)\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة\n\nالحصة 3: تطبيقات حياتية على الق توقعة ت(س) — زمن الحصة 40 دقيقة\n1. النمذجة: يعرض المعلم شرائح «القيمة المتوقعة والتباين» من دليل المعلم ويحل المثال 6 (كتاب الطالب)، ويتابع الطالب ويكمل عمود س ل(س) (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (1) ص 51 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يقارن الطلبة القيمة المتوقعة لحجر النرد بنتائج تجربة صفية، ويقارن الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم المثال 7 (كتاب الطالب) بجدول من أعمدة: س، ل(س)، س ل(س)، س² ل(س)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمرين 3-3 (2) ص 52 من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. تصويب: يناقش المعلم الخطأ الشائع (نسيان تربيع ت(س))، ويصحح الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المسألة: أ + ب = 0.6، أ + 2ب + 1.2 = 2.2، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (3) ص 52 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تطبيقات حياتية على القيمة المتوقعة والتباين — زمن الحصة 40 دقيقة\n1. النمذجة: يحسب المعلم القيمة المتوقعة ويفسرها، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. حل مشكلات: يوزع المعلم مسائل (لعبة مربحة؟ استثمار؟) على المجموعات، وتحسب وتقرر (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات قراراتها، ويبرر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 4: مراجعة الوحدة الثالثة — زمن الحصة 40 دقيقة\n1. خريطة مفاهيم: يبني المعلم خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وكتاب النشاط ص ⁦55–56⁩، ويحل الطالب حسب مستواه (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: ختام الوحدة الثالثة ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: مراجعة شاملة لكتاب النشاط ص ⁦51–56⁩، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مسابقة تاريخ عمان: تحسب المجموعات القيمة المتوقعة لنقاط فريق في مسابقة ثقافية عن عمان علمت احتمالات حصوله على 1 أو 2 أو 3 نقاط، ثم تجري جولة أسئلة قصيرة للتحقق (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: القيمة المتوقعة ت(س)\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.1 + 0.6 + 1.2 + 0.8 = 2.7\n2) [مستوى التطبيق] أوجد ت(س) لرمي حجر نرد منتظم.\nالإجابة النموذجية: 3.5\n3) [مستوى الاستدلال] أوجد ت(س) لعدد الصور في رمي 3 قطع نقدية.\nالإجابة النموذجية: 1.5\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] للتوزيع 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2 أوجد ت(س²).\nالإجابة النموذجية: 0.1 + 1.2 + 3.6 + 3.2 = 8.1\n5) [مستوى التطبيق] أوجد التباين ع²(س) للتوزيع نفسه.\nالإجابة النموذجية: 8.1 − 2.7² = 0.81\n6) [مستوى الاستدلال] أوجد الانحراف المعياري.\nالإجابة النموذجية: 0.9\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 1، 2، 3 باحتمالات أ، ب، 0.4 و ت(س) = 2.2. أوجد أ، ب.\nالإجابة النموذجية: أ + ب = 0.6 و أ + 2ب = 1 ← ب = 0.4، أ = 0.2\n2) [مستوى التطبيق] قيم 0، 1، 2 باحتمالات 0.3، ك، 0.5. أوجد ك ثم ت(س).\nالإجابة النموذجية: ك = 0.2؛ ت(س) = 0.2 + 1 = 1.2\n3) [مستوى الاستدلال] قيم 1، 2 باحتمالين ل، 1 − ل و ت(س) = 1.7. أوجد ل.\nالإجابة النموذجية: ل + 2 − 2ل = 1.7 ← ل = 0.3\n\nالحصة 3: تطبيقات حياتية على القيمة المتوقعة والتباين\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] لعبة: تربح 10 ريالات باحتمال 0.1 وتخسر 2 ريال باحتمال 0.9. أوجد الربح المتوقع.\nالإجابة النموذجية: 1 − 1.8 = −0.8 ريال\n2) [مستوى التطبيق] هل اللعبة السابقة في صالح اللاعب؟ برر.\nالإجابة النموذجية: لا؛ الربح المتوقع سالب\n3) [مستوى الاستدلال] استثماران لهما القيمة المتوقعة نفسها وتباين الأول أكبر. أيهما أقل مخاطرة؟\nالإجابة النموذجية: الثاني (التباين أصغر)\n\nالحصة 4: مراجعة الوحدة الثالثة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 2، 3، 4، 5 باحتمالات متساوية. أوجد ت(س).\nالإجابة النموذجية: 3.5\n2) [مستوى التطبيق] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: ت(س²) = 13.5 ← 13.5 − 12.25 = 1.25\n3) [مستوى الاستدلال] ل(س) = ك س لـ س = 1، 2، 3. أوجد ك و ت(س).\nالإجابة النموذجية: ك = 1/6؛ ت(س) = (1 + 4 + 9)/6 = 7/3\n\nالحصة 5: ختام الوحدة الثالثة ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] صحح: التباين = ت(س²) − ت(س).\nالإجابة النموذجية: التباين = ت(س²) − (ت(س))²\n2) [مستوى التطبيق] لرمي حجر نرد: ت(س) = 3.5 و ت(س²) = 91/6. أوجد التباين (لأقرب منزلتين).\nالإجابة النموذجية: 91/6 − 12.25 ≈ 2.92\n3) [مستوى الاستدلال] قيم 1، 2، 3 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.5 + 0.6 + 0.6 = 1.7", "الحصة 1: القيمة المتوقعة ت(س)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز القيمة المتوقعة؟\nالإجابة النموذجية: ت(س)\n2) [مستوى التطبيق] س: 0، 1 باحتمالين 0.5، 0.5. أوجد ت(س).\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] س: 2، 4، 6 باحتمالات 0.2، 0.5، 0.3. أوجد ت(س).\nالإجابة النموذجية: 0.4 + 2 + 1.8 = 4.2\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] ما العلاقة بين التباين والانحراف المعياري؟\nالإجابة النموذجية: الانحراف المعياري = الجذر التربيعي للتباين\n5) [مستوى التطبيق] لعدد الصور في 3 رميات: ت(س) = 1.5 و ت(س²) = 3. أوجد التباين.\nالإجابة النموذجية: 3 − 2.25 = 0.75\n6) [مستوى الاستدلال] إذا كان التباين 0.64 فما الانحراف المعياري؟\nالإجابة النموذجية: 0.8\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] قيم 0، 10 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] قيم 1، 3 باحتمالين ل، 1 − ل و ت(س) = 2. أوجد ل.\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] قيم 2، 5 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.8 + 3 = 3.8\n\nالحصة 3: تطبيقات حياتية على القيمة المتوقعة والتباين\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] عدد الميداليات: 0، 1، 2 باحتمالات 0.5، 0.3، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.3 + 0.4 = 0.7\n2) [مستوى التطبيق] ماذا يعني ت(س) = 0.7 هنا؟\nالإجابة النموذجية: متوسط عدد الميداليات على المدى الطويل لكل سباق\n3) [مستوى الاستدلال] لعبة: تربح 5 باحتمال 0.2 و 0 باحتمال 0.8. أوجد الربح المتوقع.\nالإجابة النموذجية: 1\n\nالحصة 4: مراجعة الوحدة الثالثة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما مجموع الاحتمالات في توزيع احتمالي؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] قيم 0، 1 باحتمالين 0.4، 0.6. أوجد ت(س).\nالإجابة النموذجية: 0.6\n3) [مستوى الاستدلال] أوجد ع²(س) للتوزيع السابق.\nالإجابة النموذجية: 0.6 − 0.36 = 0.24\n\nالحصة 5: ختام الوحدة الثالثة ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز التباين؟\nالإجابة النموذجية: ع²(س)\n2) [مستوى التطبيق] إذا كان ع²(س) = 4 فما ع(س)؟\nالإجابة النموذجية: 2\n3) [مستوى الاستدلال] قيم 0، 2 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 1", "الحصة 1: القيمة المتوقعة ت(س)\nإرشاد للطالب: مراجعة المثال 6 (كتاب الطالب)، وحل تمرين 3-3 (1) ص 51 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 3-3 (2) ص 52 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13\n\nالحصة 2: إيجاد مجاهيل بمعلومية القيمة المتوقعة\nإرشاد للطالب: حل تمرين 3-3 (3) ص 52 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13\n\nالحصة 3: تطبيقات حياتية على القيمة المتوقعة والتباين\nإرشاد للطالب: حل تمرين 3-3 (4، 5) ص ⁦53–54⁩ من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13\n\nالحصة 4: مراجعة الوحدة الثالثة\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الثالثة (كتاب الطالب) وص ⁦55–56⁩ من كتاب النشاط، والاستعداد للاختبار القصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13\n\nالحصة 5: ختام الوحدة الثالثة ومسابقة الختام\nإرشاد للطالب: الاستعداد للاختبار القصير في الوحدة الثالثة والتقويم الختامي للفصل.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}]);
const TINT=["#eaf3fb","#eef7ef","#fbf3e6","#f3eefa","#e9f6f6","#fdf0ef","#eef1fb","#f1f8e9","#fff6e0","#f0f4f8"];
let mode='s',li=0,pi=0;

D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' '+l.title;les.appendChild(o)});
les.onchange=()=>{li=+les.value;pi=0;render()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));render()});
function copyText(t,btn,box){
  const ok=()=>{btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
    if(r)ok();else{const rg=document.createRange();rg.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(rg);box.parentNode.querySelector('.hint').style.display='block'}};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fallback)}else fallback();
}
function render(){
  const L=D[li];
  $('#now').textContent=mode==='s'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';

  const texts=mode==='s'?L.p[pi].f:L.c;

  const box=$('#cards');box.innerHTML='';
  FIELDS.forEach((f,k)=>{
