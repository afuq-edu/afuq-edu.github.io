ا، المعكوس، المعادلات، التحويل الخطي (25 دقيقة)\n2) يحل مسائل مراجعة متنوعة (15 دقيقة)\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\n1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط (25 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (15 دقيقة)", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nالمخرج 1: تحليل\nالمخرج 2: إبداع\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nالتعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nالتعلم المبني على المشاريع، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nالتعلم التعاوني، التعلم الذاتي، التعلم المبني على حل المشكلات\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nالكتاب، السبورة الذكية، عروض تقديمية\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nالكتاب، السبورة الذكية، جهاز الحاسب، أخرى: الآلة الحاسبة العلمية، أخرى: برنامج جداول البيانات\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nالصيغة الخطية ص = م س + ج، المتغيران الجديدان، الميل، المقطع الصادي، العلاقة الأسية، علاقة القوة، اختيار المتغيرين (لط س، لط ص) أو (س، لط ص)\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nالميل من نقطتين، المقطع الصادي، استرجاع الثوابت\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nالبيانات التجريبية، اختبار الخطية، أفضل مستقيم، النموذج\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nمفاهيم الوحدة الأولى\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nمفاهيم الوحدة الأولى", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nمراجعة معادلة المستقيم ص = م س + ج: ما الميل والمقطع في ص = 3س − 2؟ (5 دقائق)\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nسؤال: «مستقيم لط ص مقابل س يمر بالنقطتين (0، 1.2) و (2، 2.2). ما ميله؟» (5 دقائق)\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nيعرض جدول بيانات لنمو نبات خلال أيام ويسأل: «هل النمو خطي أم أسي؟ كيف نتحقق؟» (5 دقائق)\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nيقيّم الطالب نفسه في قائمة التحقق في نهاية الوحدة الأولى (كتاب الطالب). (5 دقائق)\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nسؤال «صحح الخطأ»: حل طالب لط س = 3 فكتب س = 3هـ. ما الخطأ؟ (5 دقائق)", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس) — زمن الحصة 40 دقيقة\n1. النمذجة: يعرض المعلم شرائح التحويل من دليل المعلم ويحول ص = ك هـ^(أس) إلى لط ص = أ س + لط ك، ويتابع الطالب ويدون المتغيرات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتحويل ص = 3هـ^(2س) و ص = 5هـ^(−س)، وتحول المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمرين 5-1 (1) ص 25 من كتاب النشاط، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحول المعلم ص = ك س^ن و ص = ك أ^س بأمثلة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تشاركي: يكلف الأزواج بتحويل 4 علاقات وتحديد المتغيرين والميل والمقطع، ويحل الطالب ويتبادل (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. فردي: تمرين 5-1 (2) ص 25 من كتاب النشاط، ويحل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي — زمن الحصة 40 دقيقة\n1. النمذجة: يجد المعلم ك، أ من المستقيم: ص = هـ^1.2 هـ^(0.5س)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بتمارين 5-1 (كتاب الطالب) لإيجاد الثوابت، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمرين 5-1 (3) ص 25 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي — زمن الحصة 40 دقيقة\n1. النمذجة: يحسب المعلم لط ص لكل قيمة ويرسم لط ص مقابل س باستخدام جداول البيانات، ويتابع الطالب ويحسب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مشروع مصغر: تعطى كل مجموعة جدولًا لتحديد النموذج وكتابة معادلته، وتحسب وترسم وتكتب النموذج (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض: تعرض المجموعات نماذجها، وتعرض (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: مراجعة الوحدة الأولى (1) — زمن الحصة 40 دقيقة\n1. خريطة مفاهيم: يبني المعلم مع الطلبة خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني بالمستويات: يكلف المعلم بتمارين مراجعة نهاية الوحدة الأولى (كتاب الطالب)، ويحل الطالب حسب مستواه (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يناقش المعلم الأخطاء الشائعة، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام — زمن الحصة 40 دقيقة\n1. كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الأولى ص ⁦26–28⁩ من كتاب النشاط، ويحل الطالب ويناقش (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يعرض المعلم الحلول، ويصحح الطالب (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مشتل الأمن الغذائي: يحول كل زوج علاقة نمو فسائل في مشتل زراعي ص = ك هـ^(أس) إلى الصيغة الخطية لط ص = أ س + لط ك، ويحدد الميل والمقطع، ثم يتحدث عن أهمية الزراعة للأمن الغذائي (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حوّل ص = 3هـ^(2س) إلى الصيغة الخطية.\nالإجابة النموذجية: لط ص = 2س + لط 3\n2) [مستوى التطبيق] في الصيغة السابقة ما الميل والمقطع الصادي؟\nالإجابة النموذجية: الميل 2، المقطع لط 3\n3) [مستوى الاستدلال] ما المتغيران المرسومان على المحورين؟\nالإجابة النموذجية: س على الأفقي و لط ص على الرأسي\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] حوّل ص = 2س³ إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 3 لط س + لط 2\n5) [مستوى التطبيق] حوّل ص = 5 × 3^س إلى صيغة خطية.\nالإجابة النموذجية: لط ص = (لط 3) س + لط 5\n6) [مستوى الاستدلال] في ص = 2س³ ما المتغيران المرسومان؟\nالإجابة النموذجية: لط س أفقيًا و لط ص رأسيًا\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مستقيم لط ص مقابل س ميله 0.5 ومقطعه 1.2. اكتب ص بدلالة س.\nالإجابة النموذجية: ص = هـ^1.2 هـ^(0.5س) ≈ 3.32هـ^(0.5س)\n2) [مستوى التطبيق] مستقيم لط ص مقابل لط س ميله 2 ومقطعه 0.7. أوجد ن و ك في ص = ك س^ن.\nالإجابة النموذجية: ن = 2، ك = هـ^0.7 ≈ 2.01\n3) [مستوى الاستدلال] مستقيم لط ص مقابل س يمر بـ (1، 3) و (3، 7). أوجد الميل والمقطع.\nالإجابة النموذجية: الميل 2، المقطع 1\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] لماذا نرسم لط ص مقابل س لاختبار العلاقة ص = ك هـ^(أس)؟\nالإجابة النموذجية: لأنها تصبح خطية: لط ص = أ س + لط ك\n2) [مستوى التطبيق] إذا كانت نقاط لط ص مقابل س على مستقيم ميله 0.4 ومقطعه 2، فاكتب النموذج.\nالإجابة النموذجية: ص = هـ² هـ^(0.4س) ≈ 7.39هـ^(0.4س)\n3) [مستوى الاستدلال] إذا كانت نقاط لط ص مقابل لط س على مستقيم، فما نوع العلاقة؟\nالإجابة النموذجية: علاقة قوة ص = ك س^ن\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: لط(س − 1) + لط 3 = لط(س + 1).\nالإجابة النموذجية: س = 2\n2) [مستوى التطبيق] حل: هـ^(2س) = 15 (لأقرب منزلتين).\nالإجابة النموذجية: س = ½ لط 15 ≈ 1.35\n3) [مستوى الاستدلال] حوّل ص = 4هـ^(3س) إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 3س + لط 4\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] حل: لط س = 3 (لأقرب منزلتين).\nالإجابة النموذجية: س = هـ³ ≈ 20.09\n2) [مستوى التطبيق] حل: لط(س − 1) + لط 2 = لط(س + 1).\nالإجابة النموذجية: 2(س − 1) = س + 1 ← س = 3\n3) [مستوى الاستدلال] ف(س) = 3هـ^(−س). معكوسها ف⁻¹(س) = ج − لط س. أوجد ج (لأقرب منزلتين).\nالإجابة النموذجية: ف⁻¹(س) = لط 3 − لط س ← ج = لط 3 ≈ 1.10", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حوّل ص = 5هـ^(−س) إلى الصيغة الخطية.\nالإجابة النموذجية: لط ص = −س + لط 5\n2) [مستوى التطبيق] ما الميل في الصيغة السابقة؟\nالإجابة النموذجية: −1\n3) [مستوى الاستدلال] إذا كانت الصيغة الخطية لط ص = 4س + 2، فما ك و أ في ص = ك هـ^(أس)؟\nالإجابة النموذجية: أ = 4، ك = هـ² ≈ 7.39\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] حوّل ص = 7س² إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 2 لط س + لط 7\n5) [مستوى التطبيق] ما الميل في لط ص = (لط 3) س + لط 5؟\nالإجابة النموذجية: لط 3 ≈ 1.099\n6) [مستوى الاستدلال] حوّل ص = ك س^(0.5) إلى صيغة خطية.\nالإجابة النموذجية: لط ص = 0.5 لط س + لط ك\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] إذا كان المقطع الصادي لط ك = 0، فما ك؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] إذا كان الميل في لط ص مقابل س يساوي −0.3، فما أ في ص = ك هـ^(أس)؟\nالإجابة النموذجية: أ = −0.3\n3) [مستوى الاستدلال] في السؤال الثالث من التقويم التكويني اكتب ص بدلالة س.\nالإجابة النموذجية: ص = هـ هـ^(2س) = هـ^(2س + 1)\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما قيمة لط ص عندما ص = 20؟ (لأقرب منزلتين)\nالإجابة النموذجية: 3.00\n2) [مستوى التطبيق] مستقيم لط ص مقابل لط س ميله 3 ومقطعه 0. اكتب العلاقة.\nالإجابة النموذجية: ص = س³\n3) [مستوى الاستدلال] إذا لم تقع نقاط لط ص مقابل س على مستقيم، فماذا نستنتج؟\nالإجابة النموذجية: العلاقة ليست على الصورة ص = ك هـ^(أس)\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] بسّط: لط هـ^4 + هـ^(لط 2).\nالإجابة النموذجية: 4 + 2 = 6\n2) [مستوى التطبيق] أوجد معكوس د(س) = هـ^(2س) + 1.\nالإجابة النموذجية: د⁻¹(س) = ½ لط(س − 1)\n3) [مستوى الاستدلال] حل: هـ^(2س) − 3هـ^س + 2 = 0.\nالإجابة النموذجية: هـ^س = 1 أو 2 ← س = 0 أو لط 2\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] حل: هـ^(س) = 0.5 (لأقرب 3 منازل).\nالإجابة النموذجية: س = لط 0.5 ≈ −0.693\n2) [مستوى التطبيق] حوّل ل = 400هـ^(−0.2ز) إلى صيغة خطية.\nالإجابة النموذجية: لط ل = −0.2ز + لط 400\n3) [مستوى الاستدلال] حل: 2هـ^(2س) = 50 بالقيمة الدقيقة.\nالإجابة النموذجية: س = ½ لط 25 = لط 5", "الحصة 1: الصيغة الخطية وتحويل ص = ك هـ^(أس)\nإرشاد للطالب: حل تمرين 5-1 (1) ص 25 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 5-1 (2) ص 25 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5\n\nالحصة 2: إيجاد الثوابت المجهولة من الميل والمقطع الصادي\nإرشاد للطالب: حل تمرين 5-1 (3) ص 25 من كتاب النشاط وتمارين 5-1 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5\n\nالحصة 3: نمذجة بيانات حقيقية بالتحويل الخطي\nإرشاد للطالب: حل تمرين 5-1 (4) ص 25 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5\n\nالحصة 4: مراجعة الوحدة الأولى (1)\nإرشاد للطالب: حل تمارين مراجعة نهاية الوحدة الأولى (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5\n\nالحصة 5: مراجعة الوحدة الأولى (2) ومسابقة الختام\nإرشاد للطالب: إكمال تمارين المراجعة في كتاب النشاط ص ⁦26–28⁩، والاستعداد لاختبار قصير في الوحدة الأولى.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=5"]}, {"id": "1-2", "title": "المشتقة الأولى", "unit": "الوحدة الثانية: التفاضل", "sbp": "استكشف 1، الأمثلة ⁦1–4⁩، تمارين 1-2", "wbp": "⁦29–30⁩", "p": [{"t": "ميل المماس ومفهوم المشتقة + قاعدة مشتقة القوة", "w": "الأسبوع السادس (⁦11–15/10/2026⁩م)", "f": ["1) يفهم أن ميل المنحنى عند نقطة هو ميل المماس عند تلك النقطة (15 دقيقة)\n2) يتعرف رموز المشتقة د′(س) و دص/دس بوصفها دالة الميل (5 دقائق)\n3) يطبق قاعدة مشتقة القوة: إذا كانت ص = س^ن فإن دص/دس = ن س^(ن−1) (10 دقائق)\n4) يشتق دوالًا ذات أسس صحيحة موجبة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، أخرى: بطاقات عمل", "الميل، المماس، المشتقة الأولى، دالة الميل، د′(س)، دص/دس، قاعدة القوة، الأس، المعامل", "مراجعة حساب ميل مستقيم يمر بنقطتين (استكشف 1 (كتاب الطالب)). (5 دقائق)", "1. الاستكشاف: ينفذ المعلم استكشف 1: رسم مماسات لمنحنى ص = س² عند نقاط مختلفة وتقدير ميولها، ويرسم الطالب ويقدر الميول (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. بناء المفهوم: يستنتج المعلم أن ميل المماس لـ ص = س² يساوي 2س ويقدم الرموز، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يقدّر المعلم ميل المماس عند نقاط باستخدام GeoGebra، وتقدر المجموعات وتقارن بالقاعدة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم المثال 1 (كتاب الطالب) على قاعدة القوة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. لعبة بطاقات: بطاقات دوال ومشتقاتها للمطابقة، وتطابق المجموعات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. فردي: تمارين 1-2 (كتاب الطالب) (البنود الأولى)، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ماذا يمثل ميل المنحنى عند نقطة؟\nالإجابة النموذجية: ميل المماس عند تلك النقطة\n2) [مستوى التطبيق] إذا كان ميل ص = س² يساوي 2س، فما الميل عند س = 3؟\nالإجابة النموذجية: 6\n3) [مستوى الاستدلال] اكتب رمزين للمشتقة الأولى.\nالإجابة النموذجية: د′(س) و دص/دس\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد مشتقة ص = س⁴.\nالإجابة النموذجية: 4س³\n5) [مستوى التطبيق] أوجد مشتقة ص = س.\nالإجابة النموذجية: 1\n6) [مستوى الاستدلال] أوجد مشتقة ص = س^10.\nالإجابة النموذجية: 10س⁹", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] احسب ميل المستقيم المار بـ (1، 2) و (3، 8).\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ما ميل ص = س² عند س = −1؟\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] ماذا يعني أن دص/دس = 0 عند نقطة؟\nالإجابة النموذجية: المماس أفقي عند تلك النقطة\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد مشتقة ص = س⁶.\nالإجابة النموذجية: 6س⁵\n5) [مستوى التطبيق] أوجد مشتقة ص = 7 (ثابت).\nالإجابة النموذجية: 0\n6) [مستوى الاستدلال] أوجد مشتقة ص = س².\nالإجابة النموذجية: 2س", "إرشاد للطالب: مراجعة استكشف 1 (كتاب الطالب)، وحل تمرين 1-2 (1) ص 29 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 1-2 (كتاب الطالب) على قاعدة القوة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.i  — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المثالين 3، 4 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمارين 1-2 (كتاب الطالب) (المجموع وفك الأقواس)، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. فردي: تمرين 1-2 (3) ص 30 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تدريبات متنوعة على الاشتقاق — زمن الحصة 40 دقيقة\n1. تعاوني بالمستويات: يوزع المعلم أوراق عمل متدرجة، ويحل الطالب حسب مستواه (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تقييم الأقران: تتبادل المجموعات الأوراق، ويقيّم الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تلخيص: يلخص المعلم الأخطاء الشائعة، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: تمارين الدرس ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: يكلف المعلم بمراجعة شاملة على الدرس، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – طريق الجبل الأخضر: تناقش المجموعات تغيّر ميل المماس عند نقاط مختلفة على منحنى يمثل طريقًا جبليًا صاعدًا إلى الجبل الأخضر، وتربط شدة الميل بقواعد السلامة المرورية (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: ميل المماس ومفهوم المشتقة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ماذا يمثل ميل المنحنى عند نقطة؟\nالإجابة النموذجية: ميل المماس عند تلك النقطة\n2) [مستوى التطبيق] إذا كان ميل ص = س² يساوي 2س، فما الميل عند س = 3؟\nالإجابة النموذجية: 6\n3) [مستوى الاستدلال] اكتب رمزين للمشتقة الأولى.\nالإجابة النموذجية: د′(س) و دص/دس\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد مشتقة ص = س⁴.\nالإجابة النموذجية: 4س³\n5) [مستوى التطبيق] أوجد مشتقة ص = س.\nالإجابة النموذجية: 1\n6) [مستوى الاستدلال] أوجد مشتقة ص = س^10.\nالإجابة النموذجية: 10س⁹\n\nالحصة 2: مشتقة الأسس السالبة والكسرية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اكتب 1/س² في صورة أسية ثم اشتقها.\nالإجابة النموذجية: س^(−2) ← −2س^(−3) = −2/س³\n2) [مستوى التطبيق] أوجد مشتقة ص = √س.\nالإجابة النموذجية: ½ س^(−½) = 1/(2√س)\n3) [مستوى الاستدلال] أوجد مشتقة ص = س^(3/2).\nالإجابة النموذجية: (3/2) س^(½)\n\nالحصة 3: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = 3س² − 4س + 7.\nالإجابة النموذجية: 6س − 4\n2) [مستوى التطبيق] أوجد مشتقة ص = (س + 1)(س − 2).\nالإجابة النموذجية: ص = س² − س − 2 ← 2س − 1\n3) [مستوى الاستدلال] أوجد مشتقة ص = (س³ + س)/س.\nالإجابة النموذجية: ص = س² + 1 ← 2س\n\nالحصة 4: تدريبات متنوعة على الاشتقاق\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = 6√س.\nالإجابة النموذجية: 3/√س\n2) [مستوى التطبيق] أوجد مشتقة ص = س²(س − 3).\nالإجابة النموذجية: ص = س³ − 3س² ← 3س² − 6س\n3) [مستوى الاستدلال] أوجد مشتقة ص = (2س + 1)².\nالإجابة النموذجية: ص = 4س² + 4س + 1 ← 8س + 4\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = 1/س.\nالإجابة النموذجية: −1/س²\n2) [مستوى التطبيق] أوجد مشتقة ص = 5س³ − 2س + 9.\nالإجابة النموذجية: 15س² − 2\n3) [مستوى الاستدلال] أوجد مشتقة ص = (س² + 4)/س.\nالإجابة النموذجية: 1 − 4/س²", "الحصة 1: ميل المماس ومفهوم المشتقة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] احسب ميل المستقيم المار بـ (1، 2) و (3، 8).\nالإجابة النموذجية: 3\n2) [مستوى التطبيق] ما ميل ص = س² عند س = −1؟\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] ماذا يعني أن دص/دس = 0 عند نقطة؟\nالإجابة النموذجية: المماس أفقي عند تلك النقطة\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد مشتقة ص = س⁶.\nالإجابة النموذجية: 6س⁵\n5) [مستوى التطبيق] أوجد مشتقة ص = 7 (ثابت).\nالإجابة النموذجية: 0\n6) [مستوى الاستدلال] أوجد مشتقة ص = س².\nالإجابة النموذجية: 2س\n\nالحصة 2: مشتقة الأسس السالبة والكسرية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = 1/س.\nالإجابة النموذجية: −1/س²\n2) [مستوى التطبيق] أوجد مشتقة ص = س^(−3).\nالإجابة النموذجية: −3س^(−4)\n3) [مستوى الاستدلال] أوجد مشتقة ص = ∛س.\nالإجابة النموذجية: (1/3) س^(−2/3)\n\nالحصة 3: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = 5س².\nالإجابة النموذجية: 10س\n2) [مستوى التطبيق] أوجد مشتقة ص = 2س³ + 6س.\nالإجابة النموذجية: 6س² + 6\n3) [مستوى الاستدلال] أوجد مشتقة ص = 4/س + س.\nالإجابة النموذجية: −4/س² + 1\n\nالحصة 4: تدريبات متنوعة على الاشتقاق\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = −3س.\nالإجابة النموذجية: −3\n2) [مستوى التطبيق] أوجد مشتقة ص = س⁴ − 2س² + 1.\nالإجابة النموذجية: 4س³ − 4س\n3) [مستوى الاستدلال] أوجد مشتقة ص = 3/س².\nالإجابة النموذجية: −6/س³\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = س^8.\nالإجابة النموذجية: 8س⁷\n2) [مستوى التطبيق] أوجد مشتقة ص = 10.\nالإجابة النموذجية: 0\n3) [مستوى الاستدلال] أوجد مشتقة ص = 2س^(½).\nالإجابة النموذجية: س^(−½) = 1/√س", "الحصة 1: ميل المماس ومفهوم المشتقة\nإرشاد للطالب: مراجعة استكشف 1 (كتاب الطالب)، وحل تمرين 1-2 (1) ص 29 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 1-2 (كتاب الطالب) على قاعدة القوة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=6\n\nالحصة 2: مشتقة الأسس السالبة والكسرية\nإرشاد للطالب: حل تمرين 1-2 (2) ص 30 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=6\n\nالحصة 3: مشتقة مضاعف الدالة ومجموع الدوال والفرق بينها\nإرشاد للطالب: حل تمارين 1-2 (كتاب الطالب)، وتمرين 1-2 (3) ص 30 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=6\n\nالحصة 4: تدريبات متنوعة على الاشتقاق\nإرشاد للطالب: إكمال تمارين 1-2 (كتاب الطالب) وكتاب النشاط ص ⁦29–30⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=6\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس الميل عند نقطة.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=6"]}, {"id": "2-2", "title": "الميل عند نقطة", "unit": "الوحدة الثانية: التفاضل", "sbp": "استكشف 2، المثالان 5، 6، تمارين 2-2", "wbp": "⁦31–33⁩", "p": [{"t": "إيجاد الميل عند نقطة بالتعويض في دالة الميل + الميل عند نقاط على منحنيات بأسس سالبة وكسرية", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يجد ميل المنحنى عند نقطة بالتعويض بالإحداثي السيني في دالة الميل (10 دقائق)\n2) يربط إشارة الميل بشكل المنحنى عند النقطة (10 دقائق)\n3) يجد الميل عند نقطة لدوال بأسس سالبة وكسرية (15 دقيقة)\n4) يعطي الإجابة بالقيمة الدقيقة أو بالتقريب المطلوب (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، أخرى: الآلة الحاسبة العلمية", "الميل عند نقطة، دالة الميل، التعويض، الميل الموجب والسالب، الأسس السالبة والكسرية", "ينفذ الطلبة استكشف 2 (كتاب الطالب) لربط دالة الميل بالميل عند نقطة. (5 دقائق)", "1. النمذجة: يحل المعلم المثال 5 (كتاب الطالب)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني: يكلف المعلم بتمرين 2-2 (1) ص 31 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق رقمي: يتحقق المعلم من الميول في GeoGebra، ويتحقق الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم أمثلة: ميل √س عند س = 9، ميل 2/س عند س = −1، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. تشاركي: يكلف الأزواج بقائمة دوال ونقاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. فردي: تمرين 2-2 (1 هـ، و) ص 31 من كتاب النشاط، ويحل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² + 3س عند س = 2.\nالإجابة النموذجية: دص/دس = 2س + 3 ← 7\n2) [مستوى التطبيق] أوجد ميل ص = س³ − 2س عند س = 1.\nالإجابة النموذجية: 3س² − 2 ← 1\n3) [مستوى الاستدلال] أوجد ميل ص = 4/س عند س = 2.\nالإجابة النموذجية: −4/س² ← −1\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد ميل ص = √س عند س = 9.\nالإجابة النموذجية: 1/(2√9) = 1/6\n5) [مستوى التطبيق] أوجد ميل ص = 2/س عند س = −1.\nالإجابة النموذجية: −2/س² ← −2\n6) [مستوى الاستدلال] أوجد ميل ص = س^(3/2) عند س = 4.\nالإجابة النموذجية: (3/2)√4 = 3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² عند س = 5.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] أوجد ميل ص = 3س + 1 عند أي نقطة.\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] ما إشارة ميل ص = −س² عند س = 2؟\nالإجابة النموذجية: سالبة (−4)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد ميل ص = 1/س عند س = 1.\nالإجابة النموذجية: −1\n5) [مستوى التطبيق] أوجد ميل ص = √س عند س = 4.\nالإجابة النموذجية: 1/4\n6) [مستوى الاستدلال] أوجد ميل ص = 6/س² عند س = 1.\nالإجابة النموذجية: −12", "إرشاد للطالب: حل تمرين 2-2 (1) ص 31 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: إكمال تمرين 2-2 (1) ص 31 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "إيجاد النقطة التي يكون عندها الميل معلومًا + إيجاد ثابت مجهول بمعلومية الميل عند نقطة", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يجد إحداثيي النقطة على المنحنى التي يكون عندها الميل قيمة معطاة (15 دقيقة)\n2) يحل المعادلة الناتجة (خطية أو تربيعية) ويجد ص المقابلة (10 دقائق)\n3) يجد ثابتًا مجهولًا في معادلة منحنى بمعلومية ميله عند نقطة (5 دقائق)\n4) يبين أن المماس عند نقطة أفقي بإثبات أن الميل صفر (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل", "التعلم بالنمذجة، التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام", "معادلة الميل، حل المعادلات، الإحداثي الصادي، الثابت المجهول، المماس الأفقي", "سؤال: «عند أي نقطة على ص = س² يكون الميل 6؟» (5 دقائق)", "1. النمذجة: يحل المعلم المثال 6 (كتاب الطالب)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بتمرين 2-2 (2) ص 32 من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات حلولها، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم أمثلة على إيجاد ثوابت وإثبات مماس أفقي، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تشاركي: يكلف الأزواج بتمرينات 2-2 (4، 5) ص 33 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. تصويب: يناقش، ويصحح الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² − 6س + 1 التي ميلها 4.\nالإجابة النموذجية: 2س − 6 = 4 ← (5، −4)\n2) [مستوى التطبيق] أوجد النقاط على ص = س³ − 3س² التي ميلها 9.\nالإجابة النموذجية: 3س² − 6س − 9 = 0 ← (3، 0)، (−1، −4)\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² + 2س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (−1، −1)\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد أ إذا كان ميل ص = أس² + 3س عند س = 2 يساوي 11.\nالإجابة النموذجية: 4أ + 3 = 11 ← أ = 2\n5) [مستوى التطبيق] بيّن أن المماس لـ ص = س³ − 3س عند س = 1 أفقي.\nالإجابة النموذجية: دص/دس = 3س² − 3 = 0 عند س = 1\n6) [مستوى الاستدلال] أوجد ب إذا كان ميل ص = س³ + ب س عند س = −1 يساوي 5.\nالإجابة النموذجية: 3 + ب = 5 ← ب = 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي ميلها 6.\nالإجابة النموذجية: (3، 9)\n2) [مستوى التطبيق] أوجد النقطة على ص = 3س² التي ميلها −12.\nالإجابة النموذجية: (−2، 12)\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 4س التي ميلها صفر.\nالإجابة النموذجية: (2، −4)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد ك إذا كان ميل ص = ك س² عند س = 1 يساوي 8.\nالإجابة النموذجية: ك = 4\n5) [مستوى التطبيق] هل المماس لـ ص = س² − 2س عند س = 1 أفقي؟\nالإجابة النموذجية: نعم؛ الميل 0\n6) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = س² + أ س عند س = 3 يساوي 0.\nالإجابة النموذجية: 6 + أ = 0 ← أ = −6", "إرشاد للطالب: حل تمرين 2-2 (2) ص 32 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرينات 2-2 (4، 5) ص 33 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "تطبيقات الميل في مواقف حياتية (معدل التغير)", "w": "الأسبوع السابع (⁦18–22/10/2026⁩م)", "f": ["1) يفسر المشتقة بوصفها معدل تغير في مواقف حياتية (25 دقيقة)\n2) يحسب معدل التغير عند لحظة معينة (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، صورة توضيحية", "معدل التغير، السرعة اللحظية، التفسير", "يعرض صورة كرة مقذوفة: ارتفاعها ف = 20ز − 5ز². «ما سرعة الكرة عند ز = 1؟» (5 دقائق)", "1. النمذجة: يحسب المعلم دف/دز = 20 − 10ز ويفسر عند ز = 1، 2، 3، ويتابع الطالب ويفسر الإشارة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات تعاوني: ح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س³ عند س = 2.\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] أوجد ميل ص = 2س² − 5س عند س = 0.\nالإجابة النموذجية: −5\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² + 1 التي ميلها −2.\nالإجابة النموذجية: (−1، 2)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² − 3 عند س = 4.\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد ميل ص = 5س عند س = 100.\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] أوجد ميل ص = س⁴ عند س = −1.\nالإجابة النموذجية: −4", "إرشاد للطالب: مراجعة تمارين 2-2 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "الميل والإحداثيات: مسائل مركبة", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يجد الميل عند نقطة تقاطع منحنى مع محور (25 دقيقة)\n2) يقارن ميول منحنى عند نقطتين (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تحليل", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "نقاط التقاطع مع المحاور، الميل عند نقاط التقاطع", "سؤال: «أين يقطع منحنى ص = س² − 4 محور السينات؟ وما الميل عند كل نقطة؟» (5 دقائق)", "1. النمذجة: يحسب المعلم الميل عند نقاط التقاطع ويقارن، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بمسائل مشابهة، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تحقق: يتحقق المعلم بالرسم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الميل عند نقطتي تقاطع ص = س² − 4 مع محور السينات.\nالإجابة النموذجية: عند س = 2: 4، عند س = −2: −4\n2) [مستوى التطبيق] أوجد الميل عند نقطة تقاطع ص = س³ + 2س + 1 مع محور الصادات.\nالإجابة النموذجية: عند س = 0: 2\n3) [مستوى الاستدلال] أوجد الميل عند نقطة تقاطع ص = س² − 5س + 6 مع محور السينات حيث س > 2.\nالإجابة النموذجية: س = 3: 2س − 5 = 1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أين يقطع ص = س² − 9 محور السينات؟\nالإجابة النموذجية: (3، 0)، (−3، 0)\n2) [مستوى التطبيق] أوجد ميل ص = س² − 9 عند (3، 0).\nالإجابة النموذجية: 6\n3) [مستوى الاستدلال] أوجد ميل ص = 2س² + 3 عند نقطة تقاطعه مع محور الصادات.\nالإجابة النموذجية: 0", "إرشاد للطالب: حل مسائل مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يطبق مهارة إيجاد الميل في تمارين كتاب النشاط (25 دقيقة)\n2) يصوّب أخطاءه ذاتيًا (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية", "الميل عند نقطة", "مراجعة سريعة للأخطاء الشائعة في التعويض. (5 دقائق)", "1. كتاب النشاط: يكلف المعلم بإكمال تمارين 2-2 ص ⁦31–33⁩ من كتاب النشاط، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب ذاتي: يعرض المعلم الإجابات، ويصحح الطالب ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم التمارين الأصعب، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 9س − 2س² عند س = 2.\nالإجابة النموذجية: 9 − 4س ← 1\n2) [مستوى التطبيق] أوجد ميل ص = س² + 1/س عند س = 1.\nالإجابة النموذجية: 2س − 1/س² ← 1\n3) [مستوى الاستدلال] أوجد النقطة على ص = 9س − 2س² التي ميلها 1.\nالإجابة النموذجية: س = 2 ← (2، 10)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 3 − س² عند س = 1.\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد ميل ص = س³ − س عند س = 0.\nالإجابة النموذجية: −1\n3) [مستوى الاستدلال] أوجد ميل ص = 8√س عند س = 4.\nالإجابة النموذجية: 4/√4 = 2", "إرشاد للطالب: إكمال تمارين 2-2 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "الميل ومقارنة دوال", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يقارن ميول منحنيين عند نقطة تقاطعهما (25 دقيقة)\n2) يجد قيمة س التي يتساوى عندها ميلا منحنيين (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "تساوي الميول، نقطة التقاطع، المقارنة", "سؤال: «عند أي قيمة لـ س يتساوى ميلا ص = س² و ص = 4س؟» (5 دقائق)", "1. النمذجة: يحل المعلم أمثلة على تساوي الميول، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بمسائل مشابهة، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يتحقق المعلم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عند أي س يتساوى ميلا ص = س² و ص = 4س؟\nالإجابة النموذجية: س = 2\n2) [مستوى التطبيق] عند أي س يتساوى ميلا ص = س³ و ص = 12س؟\nالإجابة النموذجية: 3س² = 12 ← س = ±2\n3) [مستوى الاستدلال] المنحنيان ص = س² و ص = 2س − 1 يتقاطعان عند (1، 1). قارن ميليهما عندها.\nالإجابة النموذجية: كلاهما 2 (المستقيم مماس للمنحنى)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل ص = 4س؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] عند أي س يكون ميل ص = س² مساويًا 10؟\nالإجابة النموذجية: س = 5\n3) [مستوى الاستدلال] عند أي س يتساوى ميلا ص = س² + س و ص = 3س؟\nالإجابة النموذجية: 2س + 1 = 3 ← س = 1", "إرشاد للطالب: حل مسائل مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "تدريبات متدرجة على الميل", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يحل تدريبات متدرجة الصعوبة على الميل (20 دقيقة)\n2) يقيّم مستوى إتقانه ويحدد ما يحتاج إلى مراجعة (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: سبورات صغيرة للمجموعات", "الميل عند نقطة، النقطة ذات الميل المعلوم، الثوابت", "اختبار قصير ذاتي التصحيح (5 أسئلة). (5 دقائق)", "1. اختبار قصير: يتابع الطلبة، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصحيح ذاتي: يعرض المعلم الإجابات، ويصحح الطالب ويحدد نقاط الضعف (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. علاجي/إثرائي: يدعم المعلم المحتاجين ويقدم مسائل إثرائية للمتقدمين، ويعالج الطالب أو يثري (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 2س³ عند س = 1.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد النقطة على ص = س² − 2س + 5 التي ميلها 6.\nالإجابة النموذجية: (4، 13)\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = أ/س عند س = 2 يساوي −3.\nالإجابة النموذجية: −أ/4 = −3 ← أ = 12", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² + 7 عند س = 0.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد ميل ص = 1/س² عند س = 1.\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] أوجد النقطة على ص = 5 − س² التي ميلها 4.\nالإجابة النموذجية: (−2، 1)", "إرشاد للطالب: مراجعة نقاط الضعف التي حددها الطالب في الاختبار القصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "ميل منحنيات حياتية ونمذجة", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يوظف الميل في تفسير بيانات ومواقف حياتية (15 دقيقة)\n2) يبني نموذجًا بسيطًا ويحسب معدل التغير (25 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: إبداع", "التعلم المبني على المشاريع، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، جهاز الحاسب", "معدل التغير، النمذجة، التفسير", "موقف: مساحة مربع س² تتزايد. ما معدل تغير المساحة عندما يكون الضلع 5 سم؟ (5 دقائق)", "1. النمذجة: يحل المعلم مواقف (حجم مكعب، ربح شركة)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مشروع مصغر: تختار كل مجموعة موقفًا من حياتها وتبني نموذجًا تربيعيًا وتحسب معدل التغير، وتبني وتحسب وتعرض (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض سريع، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ح = س³ (حجم مكعب). أوجد معدل تغير الحجم عند س = 2.\nالإجابة النموذجية: 3س² ← 12\n2) [مستوى التطبيق] ر(س) = −س² + 40س − 100. أوجد معدل تغير الربح عند س = 10.\nالإجابة النموذجية: −2س + 40 ← 20\n3) [مستوى الاستدلال] في السؤال السابق، عند أي قيمة لـ س يتوقف الربح عن التزايد؟\nالإجابة النموذجية: س = 20", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد معدل تغير مساحة مربع ضلعه س عند س = 5.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] أوجد معدل تغير ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] ف = 4ز². أوجد السرعة عند ز = 3.\nالإجابة النموذجية: 8ز ← 24", "إرشاد للطالب: كتابة موقف حياتي يمكن نمذجته بدالة تربيعية وإيجاد معدل تغيره.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"t": "ختام درس الميل عند نقطة ومسابقة الختام", "w": "الأسبوع الثامن (⁦25–29/10/2026⁩م)", "f": ["1) يطبق مهارات الدرس في حل تمارين متنوعة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الميل عند نقطة", "سؤال «صحح الخطأ»: لإيجاد ميل ص = س² عند (3، 9) عوّض طالب س = 9 في 2س. ما الخطأ؟ (5 دقائق)", "1. تعاوني: مراجعة شاملة لتمارين 2-2، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – ميل قناة الفلج: تحسب المجموعات ميل منحنى ص = 0.01 س² عند نقاط مختلفة، وتناقش لماذا حرص بناة الأفلاج العمانية على ميل صغير منتظم ليجري الماء بالجاذبية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² عند (3، 9).\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد النقطة على ص = س³ التي ميلها 3 وس > 0.\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = س² + أ عند س = 1 يساوي 2.\nالإجابة النموذجية: أي قيمة؛ الميل لا يعتمد على أ", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 4س² عند س = −1.\nالإجابة النموذجية: −8\n2) [مستوى التطبيق] أوجد ميل ص = √س عند س = 1.\nالإجابة النموذجية: ½\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 8س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (4، −16)", "إرشاد للطالب: الاستعداد لدرس معادلة المماس.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}], "c": ["الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\n1) يجد ميل المنحنى عند نقطة بالتعويض بالإحداثي السيني في دالة الميل (10 دقائق)\n2) يربط إشارة الميل بشكل المنحنى عند النقطة (10 دقائق)\n3) يجد الميل عند نقطة لدوال بأسس سالبة وكسرية (15 دقيقة)\n4) يعطي الإجابة بالقيمة الدقيقة أو بالتقريب المطلوب (5 دقائق)\n\nالحصة 2: إيجاد النقطة التي يكون عندها الميل معلومًا\n1) يجد إحداثيي النقطة على المنحنى التي يكون عندها الميل قيمة معطاة (15 دقيقة)\n2) يحل المعادلة الناتجة (خطية أو تربيعية) ويجد ص المقابلة (10 دقائق)\n3) يجد ثابتًا مجهولًا في معادلة منحنى بمعلومية ميله عند نقطة (5 دقائق)\n4) يبين أن المماس عند نقطة أفقي بإثبات أن الميل صفر (10 دقائق)\n\nالحصة 3: تطبيقات الميل في مواقف حياتية (معدل التغير)\n1) يفسر المشتقة بوصفها معدل تغير في مواقف حياتية (25 دقيقة)\n2) يحسب معدل التغير عند لحظة معينة (15 دقيقة)\n\nالحصة 4: مراجعة الميل عند نقطة (1)\n1) يحل مسائل متنوعة على الميل عند نقطة (25 دقيقة)\n2) يختار الخطوات المناسبة للحل وينظمها (15 دقيقة)\n\nالحصة 5: الميل والإحداثيات: مسائل مركبة\n1) يجد الميل عند نقطة تقاطع منحنى مع محور (25 دقيقة)\n2) يقارن ميول منحنى عند نقطتين (15 دقيقة)\n\nالحصة 6: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\n1) يطبق مهارة إيجاد الميل في تمارين كتاب النشاط (25 دقيقة)\n2) يصوّب أخطاءه ذاتيًا (15 دقيقة)\n\nالحصة 7: الميل ومقارنة دوال\n1) يقارن ميول منحنيين عند نقطة تقاطعهما (25 دقيقة)\n2) يجد قيمة س التي يتساوى عندها ميلا منحنيين (15 دقيقة)\n\nالحصة 8: تدريبات متدرجة على الميل\n1) يحل تدريبات متدرجة الصعوبة على الميل (20 دقيقة)\n2) يقيّم مستوى إتقانه ويحدد ما يحتاج إلى مراجعة (20 دقيقة)\n\nالحصة 9: ميل منحنيات حياتية ونمذجة\n1) يوظف الميل في تفسير بيانات ومواقف حياتية (15 دقيقة)\n2) يبني نموذجًا بسيطًا ويحسب معدل التغير (25 دقيقة)\n\nالحصة 10: ختام درس الميل عند نقطة ومسابقة الختام\n1) يطبق مهارات الدرس في حل تمارين متنوعة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\n\nالحصة 2: إيجاد النقطة التي يكون عندها الميل معلومًا\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\n\nالحصة 3: تطبيقات الميل في مواقف ح  ميل ص = س³ عند س = 2. (5 دقائق)\n\nالحصة 5: الميل والإحداثيات: مسائل مركبة\nسؤال: «أين يقطع منحنى ص = س² − 4 محور السينات؟ وما الميل عند كل نقطة؟» (5 دقائق)\n\nالحصة 6: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\nمراجعة سريعة للأخطاء الشائعة في التعويض. (5 دقائق)\n\nالحصة 7: الميل ومقارنة دوال\nسؤال: «عند أي قيمة لـ س يتساوى ميلا ص = س² و ص = 4س؟» (5 دقائق)\n\nالحصة 8: تدريبات متدرجة على الميل\nاختبار قصير ذاتي التصحيح (5 أسئلة). (5 دقائق)\n\nالحصة 9: ميل منحنيات حياتية ونمذجة\nموقف: مساحة مربع س² تتزايد. ما معدل تغير المساحة عندما يكون الضلع 5 سم؟ (5 دقائق)\n\nالحصة 10: ختام درس الميل عند نقطة ومسابقة الختام\nسؤال «صحح الخطأ»: لإيجاد ميل ص = س² عند (3، 9) عوّض طالب س = 9 في 2س. ما الخطأ؟ (5 دقائق)", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المثال 5 (كتاب الطالب)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني: يكلف المعلم بتمرين 2-2 (1) ص 31 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق رقمي: يتحقق المعلم من الميول في GeoGebra، ويتحقق الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم أمثلة: ميل √س عند س = 9، ميل 2/س عند س = −1، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. تشاركي: يكلف الأزواج بقائمة دوال ونقاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. فردي: تمرين 2-2 (1 هـ، و) ص 31 من كتاب النشاط، ويحل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: إيجاد النقطة التي يكون عندها الميل معلومًا — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المثال 6 (كتاب الطالب)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بتمرين 2-2 (2) ص 32 من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات حلولها، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم أمثلة على إيجاد ثوابت وإثبات مماس أفقي، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تشاركي: يكلف الأزواج بتمرينات 2-2 (4، 5) ص 33 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. تصويب: يناقش، ويصحح الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تطبيقات الميل في مواقف حياتية (معدل التغير) — زمن الحصة 40 دقيقة\n1. النمذجة: يحسب المعلم دف/دز = 20 − 10ز ويفسر عند ز = 1، 2، 3، ويتابع الطالب ويفسر الإشارة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات تعاوني: يوزع المعلم مواقف (مساحة دائرة تتغير، تكلفة إنتاج)، وتحل وتفسر (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. عرض: تعرض المجموعات، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: مراجعة الميل عند نقطة (1) — زمن الحصة 40 دقيقة\n1. تعاوني بالمستويات: يكلف المعلم بتمارين 2-2 (كتاب الطالب) حسب المستوى، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. مناقشة: يعرض المعلم الحلول، ويصحح الطالب (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تلخيص: يلخص المعلم خطوات إيجاد الميل، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: الميل والإحداثيات: مسائل مركبة — زمن الحصة 40 دقيقة\n1. النمذجة: يحسب المعلم الميل عند نقاط التقاطع ويقارن، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بمسائل مشابهة، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تحقق: يتحقق المعلم بالرسم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 6: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط — زمن الحصة 40 دقيقة\n1. كتاب النشاط: يكلف المعلم بإكمال تمارين 2-2 ص ⁦31–33⁩ من كتاب النشاط، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب ذاتي: يعرض المعلم الإجابات، ويصحح الطالب ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم التمارين الأصعب، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 7: الميل ومقارنة دوال — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم أمثلة على تساوي الميول، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بمسائل مشابهة، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يتحقق المعلم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 8: تدريبات متدرجة على الميل — زمن الحصة 40 دقيقة\n1. اختبار قصير: يتابع الطلبة، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصحيح ذاتي: يعرض المعلم الإجابات، ويصحح الطالب ويحدد نقاط الضعف (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. علاجي/إثرائي: يدعم المعلم المحتاجين ويقدم مسائل إثرائية للمتقدمين، ويعالج الطالب أو يثري (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 9: ميل منحنيات حياتية ونمذجة — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم مواقف (حجم مكعب، ربح شركة)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مشروع مصغر: تختار كل مجموعة موقفًا من حياتها وتبني نموذجًا تربيعيًا وتحسب معدل التغير، وتبني وتحسب وتعرض (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض سريع، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 10: ختام درس الميل عند نقطة ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: مراجعة شاملة لتمارين 2-2، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – ميل قناة الفلج: تحسب المجموعات ميل منحنى ص = 0.01 س² عند نقاط مختلفة، وتناقش لماذا حرص بناة الأفلاج العمانية على ميل صغير منتظم ليجري الماء بالجاذبية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² + 3س عند س = 2.\nالإجابة النموذجية: دص/دس = 2س + 3 ← 7\n2) [مستوى التطبيق] أوجد ميل ص = س³ − 2س عند س = 1.\nالإجابة النموذجية: 3س² − 2 ← 1\n3) [مستوى الاستدلال] أوجد ميل ص = 4/س عند س = 2.\nالإجابة النموذجية: −4/س² ← −1\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد ميل ص = √س عند س = 9.\nالإجابة النموذجية: 1/(2√9) = 1/6\n5) [مستوى التطبيق] أوجد ميل ص = 2/س عند س = −1.\nالإجابة النموذجية: −2/س² ← −2\n6) [مستوى الاستدلال] أوجد ميل ص = س^(3/2) عند س = 4.\nالإجابة النموذجية: (3/2)√4 = 3\n\nالحصة 2: إيجاد النقطة التي يكون عندها الميل معلومًا\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² − 6س + 1 التي ميلها 4.\nالإجابة النموذجية: 2س − 6 = 4 ← (5، −4)\n2) [مستوى التطبيق] أوجد النقاط على ص = س³ − 3س² التي ميلها 9.\nالإجابة النموذجية: 3س² − 6س − 9 = 0 ← (3، 0)، (−1، −4)\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² + 2س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (−1، −1)\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد أ إذا كان ميل ص = أس² + 3س عند س = 2 يساوي 11.\nالإجابة النموذجية: 4أ + 3 = 11 ← أ = 2\n5) [مستوى التطبيق] بيّن أن المماس لـ ص = س³ − 3س عند س = 1 أفق لمنحنى)\n\nالحصة 8: تدريبات متدرجة على الميل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 2س³ عند س = 1.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد النقطة على ص = س² − 2س + 5 التي ميلها 6.\nالإجابة النموذجية: (4، 13)\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = أ/س عند س = 2 يساوي −3.\nالإجابة النموذجية: −أ/4 = −3 ← أ = 12\n\nالحصة 9: ميل منحنيات حياتية ونمذجة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ح = س³ (حجم مكعب). أوجد معدل تغير الحجم عند س = 2.\nالإجابة النموذجية: 3س² ← 12\n2) [مستوى التطبيق] ر(س) = −س² + 40س − 100. أوجد معدل تغير الربح عند س = 10.\nالإجابة النموذجية: −2س + 40 ← 20\n3) [مستوى الاستدلال] في السؤال السابق، عند أي قيمة لـ س يتوقف الربح عن التزايد؟\nالإجابة النموذجية: س = 20\n\nالحصة 10: ختام درس الميل عند نقطة ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² عند (3، 9).\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد النقطة على ص = س³ التي ميلها 3 وس > 0.\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = س² + أ عند س = 1 يساوي 2.\nالإجابة النموذجية: أي قيمة؛ الميل لا يعتمد على أ", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² عند س = 5.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] أوجد ميل ص = 3س + 1 عند أي نقطة.\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] ما إشارة ميل ص = −س² عند س = 2؟\nالإجابة النموذجية: سالبة (−4)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد ميل ص = 1/س عند س = 1.\nالإجابة النموذجية: −1\n5) [مستوى التطبيق] أوجد ميل ص = √س عند س = 4.\nالإجابة النموذجية: 1/4\n6) [مستوى الاستدلال] أوجد ميل ص = 6/س² عند س = 1.\nالإجابة النموذجية: −12\n\nالحصة 2: إيجاد النقطة التي يكون عندها الميل معلومًا\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي ميلها 6.\nالإجابة النموذجية: (3، 9)\n2) [مستوى التطبيق] أوجد النقطة على ص = 3س² التي ميلها −12.\nالإجابة النموذجية: (−2، 12)\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 4س التي ميلها صفر.\nالإجابة النموذجية: (2، −4)\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد ك إذا كان ميل ص = ك س² عند س = 1 يساوي 8.\nالإجابة النموذجية: ك = 4\n5) [مستوى التطبيق] هل المماس لـ ص = س² − 2س عند س = 1 أفقي؟\nالإجابة النموذجية: نعم؛ الميل 0\n6) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = س² + أ س عند س = 3 يساوي 0.\nالإجابة النموذجية: 6 + أ = 0 ← أ = −6\n\nالحصة 3: تطبيقات الميل في مواقف حياتية (معدل التغير)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] م = π نق². أوجد معدل تغير المساحة بالنسبة لنق.\nالإجابة النموذجية: 2π نق\n2) [مستوى التطبيق] أوجد معدل التغير السابق عند نق = 3.\nالإجابة النموذجية: 6π\n3) [مستوى الاستدلال] ت(س) = 50 + 2س². أوجد معدل تغير التكلفة عند س = 10.\nالإجابة النموذجية: 4س ← 40\n\nالحصة 4: مراجعة الميل عند نقطة (1)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² − 3 عند س = 4.\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد ميل ص = 5س عند س = 100.\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] أوجد ميل ص = س⁴ عند س = −1.\nالإجابة النموذجية: −4\n\nالحصة 5: الميل والإحداثيات: مسائل مركبة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أين يقطع ص = س² − 9 محور السينات؟\nالإجابة النموذجية: (3، 0)، (−3، 0)\n2) [مستوى التطبيق] أوجد ميل ص = س² − 9 عند (3، 0).\nالإجابة النموذجية: 6\n3) [مستوى الاستدلال] أوجد ميل ص = 2س² + 3 عند نقطة تقاطعه مع محور الصادات.\nالإجابة النموذجية: 0\n\nالحصة 6: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 3 − س² عند س = 1.\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد ميل ص = س³ − س عند س = 0.\nالإجابة النموذجية: −1\n3) [مستوى الاستدلال] أوجد ميل ص = 8√س عند س = 4.\nالإجابة النموذجية: 4/√4 = 2\n\nالحصة 7: الميل ومقارنة دوال\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل ص = 4س؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] عند أي س يكون ميل ص = س² مساويًا 10؟\nالإجابة النموذجية: س = 5\n3) [مستوى الاستدلال] عند أي س يتساوى ميلا ص = س² + س و ص = 3س؟\nالإجابة النموذجية: 2س + 1 = 3 ← س = 1\n\nالحصة 8: تدريبات متدرجة على الميل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² + 7 عند س = 0.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد ميل ص = 1/س² عند س = 1.\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] أوجد النقطة على ص = 5 − س² التي ميلها 4.\nالإجابة النموذجية: (−2، 1)\n\nالحصة 9: ميل منحنيات حياتية ونمذجة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد معدل تغير مساحة مربع ضلعه س عند س = 5.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] أوجد معدل تغير ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] ف = 4ز². أوجد السرعة عند ز = 3.\nالإجابة النموذجية: 8ز ← 24\n\nالحصة 10: ختام درس الميل عند نقطة ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 4س² عند س = −1.\nالإجابة النموذجية: −8\n2) [مستوى التطبيق] أوجد ميل ص = √س عند س = 1.\nالإجابة النموذجية: ½\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 8س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (4، −16)", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nإرشاد للطالب: حل تمرين 2-2 (1) ص 31 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: إكمال تمرين 2-2 (1) ص 31 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7\n\nالحصة 2: إيجاد النقطة التي يكون عندها الميل معلومًا\nإرشاد للطالب: حل تمرين 2-2 (2) ص 32 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرينات 2-2 (4، 5) ص 33 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7\n\nالحصة 3: تطبيقات الميل في مواقف حياتية (معدل التغير)\nإرشاد للطالب: حل مسائل التطبيقات (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط
