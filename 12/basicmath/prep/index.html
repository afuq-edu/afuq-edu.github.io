). (5 دقائق)\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\nموقف: مساحة مربع س² تتزايد. ما معدل تغير المساحة عندما يكون الضلع 5 سم؟ (5 دقائق)\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\nسؤال «صحح الخطأ»: لإيجاد ميل ص = س² عند (3، 9) عوّض طالب س = 9 في 2س. ما الخطأ؟ (5 دقائق)", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 5 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني: يكلف المعلم بتمرين 2-2 (1) ص 31 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق رقمي: يتحقق المعلم من الميول في GeoGebra، ويتحقق الطالب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة: ميل √س عند س = 9، ميل 2/س عند س = −1، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. تشاركي: يكلف الأزواج بقائمة دوال ونقاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. فردي: تمرين 2-2 (1 هـ، و) ص 31 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 6 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تعاوني: يكلف المعلم بتمرين 2-2 (2) ص 32 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض: تعرض المجموعات حلولها، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة على إيجاد ثوابت وإثبات مماس أفقي، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تشاركي: يكلف الأزواج بتمرينات 2-2 (4، 5) ص 33 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير) — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحسب المعلم دف/دز = 20 − 10ز ويفسر عند ز = 1، 2، 3، ويتابع الطالب ويفسر الإشارة (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حل مشكلات تعاوني: يوزع المعلم مواقف (مساحة دائرة تتغير، تكلفة إنتاج)، وتحل وتفسر (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. عرض: تعرض المجموعات، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 6: مراجعة الميل عند نقطة (1) — زمن الحصة 40 دقيقة\n\n1. تعاوني بالمستويات: يكلف المعلم بتمارين 2-2 (كتاب الطالب) حسب المستوى، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مناقشة: يعرض المعلم الحلول، ويصحح الطالب (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تلخيص: يلخص المعلم خطوات إيجاد الميل، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحسب المعلم الميل عند نقاط التقاطع ويقارن، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تعاوني: يكلف المعلم بمسائل مشابهة، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحقق: يتحقق المعلم بالرسم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط — زمن الحصة 40 دقيقة\n\n1. كتاب النشاط: يكلف المعلم بإكمال تمارين 2-2 ص ⁦31–33⁩ من كتاب النشاط، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تصويب ذاتي: يعرض المعلم الإجابات، ويصحح الطالب ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مناقشة: يناقش المعلم التمارين الأصعب، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 9: الميل ومقارنة دوال — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة على تساوي الميول، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تشاركي: يكلف الأزواج بمسائل مشابهة، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يتحقق المعلم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 10: تدريبات متدرجة على الميل — زمن الحصة 40 دقيقة\n\n1. اختبار قصير: يتابع الطلبة، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. تصحيح ذاتي: يعرض المعلم الإجابات، ويصحح الطالب ويحدد نقاط الضعف (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. علاجي/إثرائي: يدعم المعلم المحتاجين ويقدم مسائل إثرائية للمتقدمين، ويعالج الطالب أو يثري (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 11: ميل منحنيات حياتية ونمذجة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم مواقف (حجم مكعب، ربح شركة)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. مشروع مصغر: تختار كل مجموعة موقفًا من حياتها وتبني نموذجًا تربيعيًا وتحسب معدل التغير، وتبني وتحسب وتعرض (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض سريع، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: مراجعة شاملة لتمارين 2-2، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. غلق الدرس – ميل قناة الفلج: تحسب المجموعات ميل منحنى ص = 0.01 س² عند نقاط مختلفة، وتناقش لماذا حرص بناة الأفلاج العمانية على ميل صغير منتظم ليجري الماء بالجاذبية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² + 3س عند س = 2.\nالإجابة النموذجية: دص/دس = 2س + 3 ← 7\n2) [مستوى التطبيق] أوجد ميل ص = س³ − 2س عند س = 1.\nالإجابة النموذجية: 3س² − 2 ← 1\n3) [مستوى الاستدلال] أوجد ميل ص = 4/س عند س = 2.\nالإجابة النموذجية: −4/س² ← −1\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = √س عند س = 9.\nالإجابة النموذجية: 1/(2√9) = 1/6\n2) [مستوى التطبيق] أوجد ميل ص = 2/س عند س = −1.\nالإجابة النموذجية: −2/س² ← −2\n3) [مستوى الاستدلال] أوجد ميل ص = س^(3/2) عند س = 4.\nالإجابة النموذجية: (3/2)√4 = 3\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² − 6س + 1 التي ميلها 4.\nالإجابة النموذجية: 2س − 6 = 4 ← (5، −4)\n2) [مستوى التطبيق] أوجد النقاط على ص = س³ − 3س² التي ميلها 9.\nالإجابة النموذجية: 3س² − 6س − 9 = 0 ← (3، 0)، (−1، −4)\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² + 2س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (−1، −1)\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد أ إذا كان ميل ص = أس² + 3س عند س = 2 يساوي 11.\nالإجابة النموذجية: 4أ + 3 = 11 ← أ = 2\n2) [مستوى التطبيق] بيّن أن المماس لـ ص = س³ − 3س عند س = 1 أفقي.\nالإجابة النموذجية: دص/دس = 3س² − 3 = 0 عند س = 1\n3) [مستوى الاستدلال] أوجد ب إذا كان ميل ص = س³ + ب س عند س = −1 يساوي 5.\nالإجابة النموذجية: 3 + ب = 5 ← ب = 2\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ف = 20ز − 5ز². أوجد معدل تغير الارتفاع عند ز = 1.\nالإجابة النموذجية: 10 م/ث\n2) [مستوى التطبيق] متى تكون سرعة الكرة صفرًا؟\nالإجابة النموذجية: 20 − 10ز = 0 ← ز = 2\n3) [مستوى الاستدلال] ماذا تعني إشارة دف/دز عند ز = 3؟\nالإجابة النموذجية: سالبة (−10)؛ الكرة تهبط\n\nالحصة 6: مراجعة الميل عند نقطة (1)\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س³ عند س = 2.\nالإجابة النموذجية: 12\n2) [مستوى التطبيق] أوجد ميل ص = 2س² − 5س عند س = 0.\nالإجابة النموذجية: −5\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² + 1 التي ميلها −2.\nالإجابة النموذجية: (−1، 2)\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد الميل عند نقطتي تقاطع ص = س² − 4 مع محور السينات.\nالإجابة النموذجية: عند س = 2: 4، عند س = −2: −4\n2) [مستوى التطبيق] أوجد الميل عند نقطة تقاطع ص = س³ + 2س + 1 مع محور الصادات.\nالإجابة النموذجية: عند س = 0: 2\n3) [مستوى الاستدلال] أوجد الميل عند نقطة تقاطع ص = س² − 5س + 6 مع محور السينات حيث س > 2.\nالإجابة النموذجية: س = 3: 2س − 5 = 1\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 9س − 2س² عند س = 2.\nالإجابة النموذجية: 9 − 4س ← 1\n2) [مستوى التطبيق] أوجد ميل ص = س² + 1/س عند س = 1.\nالإجابة النموذجية: 2س − 1/س² ← 1\n3) [مستوى الاستدلال] أوجد النقطة على ص = 9س − 2س² التي ميلها 1.\nالإجابة النموذجية: س = 2 ← (2، 10)\n\nالحصة 9: الميل ومقارنة دوال\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عند أي س يتساوى ميلا ص = س² و ص = 4س؟\nالإجابة النموذجية: س = 2\n2) [مستوى التطبيق] عند أي س يتساوى ميلا ص = س³ و ص = 12س؟\nالإجابة النموذجية: 3س² = 12 ← س = ±2\n3) [مستوى الاستدلال] المنحنيان ص = س² و ص = 2س − 1 يتقاطعان عند (1، 1). قارن ميليهما عندها.\nالإجابة النموذجية: كلاهما 2 (المستقيم مماس للمنحنى)\n\nالحصة 10: تدريبات متدرجة على الميل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 2س³ عند س = 1.\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد النقطة على ص = س² − 2س + 5 التي ميلها 6.\nالإجابة النموذجية: (4، 13)\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = أ/س عند س = 2 يساوي −3.\nالإجابة النموذجية: −أ/4 = −3 ← أ = 12\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ح = س³ (حجم مكعب). أوجد معدل تغير الحجم عند س = 2.\nالإجابة النموذجية: 3س² ← 12\n2) [مستوى التطبيق] ر(س) = −س² + 40س − 100. أوجد معدل تغير الربح عند س = 10.\nالإجابة النموذجية: −2س + 40 ← 20\n3) [مستوى الاستدلال] في السؤال السابق، عند أي قيمة لـ س يتوقف الربح عن التزايد؟\nالإجابة النموذجية: س = 20\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² عند (3، 9).\nالإجابة النموذجية: 6\n2) [مستوى التطبيق] أوجد النقطة على ص = س³ التي ميلها 3 وس > 0.\nالإجابة النموذجية: (1، 1)\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = س² + أ عند س = 1 يساوي 2.\nالإجابة النموذجية: أي قيمة؛ الميل لا يعتمد على أ", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² عند س = 5.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] أوجد ميل ص = 3س + 1 عند أي نقطة.\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] ما إشارة ميل ص = −س² عند س = 2؟\nالإجابة النموذجية: سالبة (−4)\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 1/س عند س = 1.\nالإجابة النموذجية: −1\n2) [مستوى التطبيق] أوجد ميل ص = √س عند س = 4.\nالإجابة النموذجية: 1/4\n3) [مستوى الاستدلال] أوجد ميل ص = 6/س² عند س = 1.\nالإجابة النموذجية: −12\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي ميلها 6.\nالإجابة النموذجية: (3، 9)\n2) [مستوى التطبيق] أوجد النقطة على ص = 3س² التي ميلها −12.\nالإجابة النموذجية: (−2، 12)\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 4س التي ميلها صفر.\nالإجابة النموذجية: (2، −4)\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ك إذا كان ميل ص = ك س² عند س = 1 يساوي 8.\nالإجابة النموذجية: ك = 4\n2) [مستوى التطبيق] هل المماس لـ ص = س² − 2س عند س = 1 أفقي؟\nالإجابة النموذجية: نعم؛ الميل 0\n3) [مستوى الاستدلال] أوجد أ إذا كان ميل ص = س² + أ س عند س = 3 يساوي 0.\nالإجابة النموذجية: 6 + أ = 0 ← أ = −6\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] م = π نق². أوجد معدل تغير المساحة بالنسبة لنق.\nالإجابة النموذجية: 2π نق\n2) [مستوى التطبيق] أوجد معدل التغير السابق عند نق = 3.\nالإجابة النموذجية: 6π\n3) [مستوى الاستدلال] ت(س) = 50 + 2س². أوجد معدل تغير التكلفة عند س = 10.\nالإجابة النموذجية: 4س ← 40\n\nالحصة 6: مراجعة الميل عند نقطة (1)\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² − 3 عند س = 4.\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد ميل ص = 5س عند س = 100.\nالإجابة النموذجية: 5\n3) [مستوى الاستدلال] أوجد ميل ص = س⁴ عند س = −1.\nالإجابة النموذجية: −4\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أين يقطع ص = س² − 9 محور السينات؟\nالإجابة النموذجية: (3، 0)، (−3، 0)\n2) [مستوى التطبيق] أوجد ميل ص = س² − 9 عند (3، 0).\nالإجابة النموذجية: 6\n3) [مستوى الاستدلال] أوجد ميل ص = 2س² + 3 عند نقطة تقاطعه مع محور الصادات.\nالإجابة النموذجية: 0\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 3 − س² عند س = 1.\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد ميل ص = س³ − س عند س = 0.\nالإجابة النموذجية: −1\n3) [مستوى الاستدلال] أوجد ميل ص = 8√س عند س = 4.\nالإجابة النموذجية: 4/√4 = 2\n\nالحصة 9: الميل ومقارنة دوال\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل ص = 4س؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] عند أي س يكون ميل ص = س² مساويًا 10؟\nالإجابة النموذجية: س = 5\n3) [مستوى الاستدلال] عند أي س يتساوى ميلا ص = س² + س و ص = 3س؟\nالإجابة النموذجية: 2س + 1 = 3 ← س = 1\n\nالحصة 10: تدريبات متدرجة على الميل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² + 7 عند س = 0.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد ميل ص = 1/س² عند س = 1.\nالإجابة النموذجية: −2\n3) [مستوى الاستدلال] أوجد النقطة على ص = 5 − س² التي ميلها 4.\nالإجابة النموذجية: (−2، 1)\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد معدل تغير مساحة مربع ضلعه س عند س = 5.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] أوجد معدل تغير ص = 3س² عند س = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] ف = 4ز². أوجد السرعة عند ز = 3.\nالإجابة النموذجية: 8ز ← 24\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 4س² عند س = −1.\nالإجابة النموذجية: −8\n2) [مستوى التطبيق] أوجد ميل ص = √س عند س = 1.\nالإجابة النموذجية: ½\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 8س التي يكون عندها المماس أفقيًا.\nالإجابة النموذجية: (4، −16)", "الحصة 1: إيجاد الميل عند نقطة بالتعويض في دالة الميل\nإرشاد للطالب: حل تمرين 2-2 (1) ص 31 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: الميل عند نقاط على منحنيات بأسس سالبة وكسرية\nإرشاد للطالب: إكمال تمرين 2-2 (1) ص 31 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: إيجاد النقطة التي يكون عندها الميل معلومًا\nإرشاد للطالب: حل تمرين 2-2 (2) ص 32 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: إيجاد ثابت مجهول بمعلومية الميل عند نقطة\nإرشاد للطالب: حل تمرينات 2-2 (4، 5) ص 33 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: تطبيقات الميل في مواقف حياتية (معدل التغير)\nإرشاد للطالب: حل مسائل التطبيقات (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: مراجعة الميل عند نقطة (1)\nإرشاد للطالب: مراجعة تمارين 2-2 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 7: الميل والإحداثيات: مسائل مركبة\nإرشاد للطالب: حل مسائل مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 8: مراجعة الميل عند نقطة (2) باستخدام كتاب النشاط\nإرشاد للطالب: إكمال تمارين 2-2 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 9: الميل ومقارنة دوال\nإرشاد للطالب: حل مسائل مشابهة في الدفتر.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 10: تدريبات متدرجة على الميل\nإرشاد للطالب: مراجعة نقاط الضعف التي حددها الطالب في الاختبار القصير.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 11: ميل منحنيات حياتية ونمذجة\nإرشاد للطالب: كتابة موقف حياتي يمكن نمذجته بدالة تربيعية وإيجاد معدل تغيره.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 12: ختام درس الميل عند نقطة ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس معادلة المماس.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=7"]}, {"id": "3-2", "title": "معادلة المماس", "unit": "الوحدة الثانية: التفاضل", "sbp": "الأمثلة، تمارين 3-2", "wbp": "⁦34–36⁩", "p": [{"t": "معادلة المماس عند نقطة معلومة", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يجد معادلة المماس لمنحنى عند نقطة معلومة باستخدام الميل والنقطة (20 دقيقة)\n2) يكتب المعادلة على الصورة ص = م س + ج (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم بالاكتشاف", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، عروض تقديمية", "المماس، الميل، ص − ص₁ = م(س − س₁)، ص = م س + ج", "مراجعة: معادلة مستقيم ميله 2 ويمر بـ (4، 3). (5 دقائق)", "1. النمذجة: يعرض المعلم شرائح معادلة المماس (دليل المعلم) لمنحنى ص = س² − 6س + 11 عند (4، 3)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 3-2 (1) ص 34 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحقق: يتحقق المعلم من المماس في GeoGebra، ويتحقق الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² − 6س + 11 عند (4، 3).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد معادلة المماس عند (4، 3).\nالإجابة النموذجية: ص = 2س − 5\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س³ عند (1، 1).\nالإجابة النموذجية: ص = 3س − 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] مستقيم ميله 3 ويمر بـ (0، 2). اكتب معادلته.\nالإجابة النموذجية: ص = 3س + 2\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² عند (2، 4).\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 1/س عند (1، 1).\nالإجابة النموذجية: ص = −س + 2", "إرشاد للطالب: حل تمرين 3-2 (1) ص 34 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "معادلة المماس عند نقطة معلوم إحداثيها السيني فقط", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يجد الإحداثي الصادي للنقطة ثم الميل ثم معادلة المماس (25 دقيقة)\n2) ينظم خطوات الحل بشكل منطقي (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل", "التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "خطوات إيجاد معادلة المماس: ص₁، الميل، المعادلة", "سؤال: «ما الذي ينقصنا لإيجاد معادلة المماس إذا علمنا س = 2 فقط؟» (5 دقائق)", "1. النمذجة: يحل المعلم أمثلة الدرس (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 3-2 (3) ص 35 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس لـ ص = 2س² + 1 عند س = −1.\nالإجابة النموذجية: ص = 3، الميل −4 ← ص = −4س − 1\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 10 − س² عند س = 2.\nالإجابة النموذجية: ص = 6، الميل −4 ← ص = −4س + 14\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: ص = 2، الميل 1/4 ← ص = ¼ س + 1", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ص عندما س = 3 على ص = س² − 1.\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² − 1 عند س = 3.\nالإجابة النموذجية: ص = 6س − 10\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 4/س عند س = 2.\nالإجابة النموذجية: ص = 2، الميل −1 ← ص = −س + 4", "إرشاد للطالب: حل تمرين 3-2 (3) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "المماس الأفقي ونقاط التقاطع مع المحاور", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يجد معادلة المماس الأفقي لمنحنى (25 دقيقة)\n2) يجد نقاط تقاطع المماس مع المحورين (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "المماس الأفقي ص = ك، التقاطع مع المحاور", "سؤال: «ما معادلة المماس عند رأس القطع المكافئ ص = س² − 4س + 7؟» (5 دقائق)", "1. النمذجة: يجد المعلم الرأس (2، 3) ويكتب ص = 3، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بإيجاد مماسات وتقاطعاتها مع المحاور، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس الأفقي لـ ص = س² − 4س + 7.\nالإجابة النموذجية: ص = 3\n2) [مستوى التطبيق] المماس ص = 2س − 5. أين يقطع محور السينات؟\nالإجابة النموذجية: (2.5، 0)\n3) [مستوى الاستدلال] أين يقطع المماس ص = −4س + 14 محور الصادات؟\nالإجابة النموذجية: (0، 14)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس الأفقي؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد معادلة المماس الأفقي لـ ص = 5 − س².\nالإجابة النموذجية: ص = 5\n3) [مستوى الاستدلال] أين يقطع المماس ص = 3س − 2 محور السينات؟\nالإجابة النموذجية: (2/3، 0)", "إرشاد للطالب: حل تمرين 3-2 (4) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "المماس الموازي لمستقيم معلوم", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يجد النقطة التي يكون عندها المماس موازيًا لمستقيم معلوم (25 دقيقة)\n2) يكتب معادلة ذلك المماس (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "المستقيمات المتوازية، تساوي الميول", "سؤال: «ما ميل أي مستقيم يوازي ص = 4س + 1؟» (5 دقائق)", "1. النمذجة: يحل المعلم: النقطة على ص = س² التي مماسها يوازي ص = 4س + 1 ثم معادلته، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 3-2 (5) ص 36 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي مماسها يوازي ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] اكتب معادلة ذلك المماس.\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 3س التي مماسها يوازي محور السينات.\nالإجابة النموذجية: (1.5، −2.25)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المستقيم ص = −2س + 7؟\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد النقطة على ص = س² التي مماسها يوازي ص = −2س + 7.\nالإجابة النموذجية: (−1، 1)\n3) [مستوى الاستدلال] اكتب معادلة المماس في السؤال السابق.\nالإجابة النموذجية: ص = −2س − 1", "إرشاد للطالب: حل تمرين 3-2 (5) ص 36 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "المماس المشترك وتدريبات متنوعة", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يتحقق من كون مستقيم مماسًا لمنحنيين (المماس المشترك) (25 دقيقة)\n2) يحل تدريبات متنوعة على معادلة لمبني على حل المشكلات.\n\nالحصة 2: معادلة المماس عند نقطة معلوم إحداثيها السيني فقط — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة الدرس (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تشاركي: يكلف الأزواج بتمرين 3-2 (3) ص 35 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: المماس الأفقي ونقاط التقاطع مع المحاور — زمن الحصة 40 دقيقة\n\n1. النمذجة: يجد المعلم الرأس (2، 3) ويكتب ص = 3، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تعاوني: يكلف المعلم بإيجاد مماسات وتقاطعاتها مع المحاور، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: المماس الموازي لمستقيم معلوم — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم: النقطة على ص = س² التي مماسها يوازي ص = 4س + 1 ثم معادلته، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تشاركي: يكلف الأزواج بتمرين 3-2 (5) ص 36 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: المماس المشترك وتدريبات متنوعة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم تمرين المماس المشترك من كتاب النشاط ص 36، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تعاوني: يكلف المعلم بإكمال تمارين 3-2 ص ⁦34–36⁩ من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 6: تمارين معادلة المماس ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: مراجعة شاملة لتمارين 3-2 (كتاب الطالب)، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. غلق الدرس – مماس على قبة: تمثل المجموعات قبة جامع بالمنحنى ص = 9 − س² وتجد معادلة المماس عند النقطة (1، 8)، ثم تتحدث عن جمال القباب في عمارة المساجد العمانية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: معادلة المماس عند نقطة معلومة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² − 6س + 11 عند (4، 3).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد معادلة المماس عند (4، 3).\nالإجابة النموذجية: ص = 2س − 5\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س³ عند (1، 1).\nالإجابة النموذجية: ص = 3س − 2\n\nالحصة 2: معادلة المماس عند نقطة معلوم إحداثيها السيني فقط\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس لـ ص = 2س² + 1 عند س = −1.\nالإجابة النموذجية: ص = 3، الميل −4 ← ص = −4س − 1\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 10 − س² عند س = 2.\nالإجابة النموذجية: ص = 6، الميل −4 ← ص = −4س + 14\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: ص = 2، الميل 1/4 ← ص = ¼ س + 1\n\nالحصة 3: المماس الأفقي ونقاط التقاطع مع المحاور\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس الأفقي لـ ص = س² − 4س + 7.\nالإجابة النموذجية: ص = 3\n2) [مستوى التطبيق] المماس ص = 2س − 5. أين يقطع محور السينات؟\nالإجابة النموذجية: (2.5، 0)\n3) [مستوى الاستدلال] أين يقطع المماس ص = −4س + 14 محور الصادات؟\nالإجابة النموذجية: (0، 14)\n\nالحصة 4: المماس الموازي لمستقيم معلوم\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي مماسها يوازي ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] اكتب معادلة ذلك المماس.\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 3س التي مماسها يوازي محور السينات.\nالإجابة النموذجية: (1.5، −2.25)\n\nالحصة 5: المماس المشترك وتدريبات متنوعة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بيّن أن ص = 2س − 1 مماس لـ ص = س² عند (1، 1).\nالإجابة النموذجية: الميل عند س = 1 هو 2 والنقطة تحقق المستقيم\n2) [مستوى التطبيق] بيّن أن ص = 2س − 1 يمس ص = س² − 4س + 8 أيضًا.\nالإجابة النموذجية: عند س = 3: ص = 5 والميل 2(3) − 4 = 2، و 2(3) − 1 = 5\n3) [مستوى الاستدلال] ما معنى المماس المشترك؟\nالإجابة النموذجية: مستقيم يمس المنحنيين كليهما\n\nالحصة 6: تمارين معادلة المماس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس لـ ص = س² + 2س عند (1، 3).\nالإجابة النموذجية: ص = 4س − 1\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 2س³ عند س = 1.\nالإجابة النموذجية: ص = 6س − 4\n3) [مستوى الاستدلال] أوجد معادلة المماس الأفقي لـ ص = س² + 6س.\nالإجابة النموذجية: ص = −9", "الحصة 1: معادلة المماس عند نقطة معلومة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] مستقيم ميله 3 ويمر بـ (0، 2). اكتب معادلته.\nالإجابة النموذجية: ص = 3س + 2\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² عند (2، 4).\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 1/س عند (1، 1).\nالإجابة النموذجية: ص = −س + 2\n\nالحصة 2: معادلة المماس عند نقطة معلوم إحداثيها السيني فقط\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ص عندما س = 3 على ص = س² − 1.\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² − 1 عند س = 3.\nالإجابة النموذجية: ص = 6س − 10\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 4/س عند س = 2.\nالإجابة النموذجية: ص = 2، الميل −1 ← ص = −س + 4\n\nالحصة 3: المماس الأفقي ونقاط التقاطع مع المحاور\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس الأفقي؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد معادلة المماس الأفقي لـ ص = 5 − س².\nالإجابة النموذجية: ص = 5\n3) [مستوى الاستدلال] أين يقطع المماس ص = 3س − 2 محور السينات؟\nالإجابة النموذجية: (2/3، 0)\n\nالحصة 4: المماس الموازي لمستقيم معلوم\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المستقيم ص = −2س + 7؟\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد النقطة على ص = س² التي مماسها يوازي ص = −2س + 7.\nالإجابة النموذجية: (−1، 1)\n3) [مستوى الاستدلال] اكتب معادلة المماس في السؤال السابق.\nالإجابة النموذجية: ص = −2س − 1\n\nالحصة 5: المماس المشترك وتدريبات متنوعة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل ص = 4س − 4 مماس لـ ص = س² عند (2، 4)؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س³ − س عند س = 0.\nالإجابة النموذجية: ص = −س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3\n\nالحصة 6: تمارين معادلة المماس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس لـ ص = س² + 2س عند س = 1؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 5س عند س = 2.\nالإجابة النموذجية: ص = 5س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س² − 1 عند (1، 0).\nالإجابة النموذجية: ص = 2س − 2", "الحصة 1: معادلة المماس عند نقطة معلومة\nإرشاد للطالب: حل تمرين 3-2 (1) ص 34 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: معادلة المماس عند نقطة معلوم إحداثيها السيني فقط\nإرشاد للطالب: حل تمرين 3-2 (3) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 3: المماس الأفقي ونقاط التقاطع مع المحاور\nإرشاد للطالب: حل تمرين 3-2 (4) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 4: المماس الموازي لمستقيم معلوم\nإرشاد للطالب: حل تمرين 3-2 (5) ص 36 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 5: المماس المشترك وتدريبات متنوعة\nإرشاد للطالب: إكمال تمارين 3-2 من كتاب النشاط ص ⁦34–36⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 6: تمارين معادلة المماس ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس المشتقة الثانية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"id": "4-2", "title": "المشتقة الثانية", "unit": "الوحدة الثانية: التفاضل", "sbp": "المثالان 7، 8، تمارين 4-2", "wbp": "⁦37–38⁩", "p": [{"t": "مفهوم المشتقة الثانية ورموزها", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يعرّف المشتقة الثانية بأنها مشتقة المشتقة الأولى ويستخدم الرموز د″(س) و د²ص/دس² (20 دقيقة)\n2) يجد المشتقة الثانية لكثيرات حدود (20 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "المشتقة الثانية، د″(س)، د²ص/دس²، معدل تغير الميل", "سؤال: «إذا كانت دالة الميل نفسها دالة، فهل يمكن أن نشتقها؟» (5 دقائق)", "1. النمذجة: يحل المعلم المثال 7 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 4-2 (1) ص 37 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمارين 4-2 (كتاب الطالب)، ويحل الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س³ − 3س² + 2.\nالإجابة النموذجية: دص/دس = 3س² − 6س ← د²ص/دس² = 6س − 6\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = 2س⁴.\nالإجابة النموذجية: 24س²\n3) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = 5س + 3.\nالإجابة النموذجية: 0", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = س³.\nالإجابة النموذجية: 6س\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4س³ − س.\nالإجابة النموذجية: 24س", "إرشاد للطالب: حل تمرين 4-2 (1) ص 37 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=9"]}, {"t": "المشتقة الثانية لدوال بأسس سالبة وكسرية", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يجد المشتقة الثانية لدوال ذات أسس سالبة وكسرية (25 دقيقة)\n2) يكتب الإجابة في أبسط صورة (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "الأسس السالبة، الأسس الكسرية، المشتقة الثانية", "مراجعة اشتقاق 1/س و √س. (5 دقائق)", "1. النمذجة: يحل المعلم المثال 8 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بقائمة دوال، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. فردي: تمرين 4-2 (2) ص 37 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د²ص/دس² لـ ص = 1/س.\nالإجابة النموذجية: 2/س³\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = √س.\nالإجابة النموذجية: −¼ س^(−3/2)\n3) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = س² + 2/س.\nالإجابة النموذجية: 2 + 4/س³", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س^(−1).\nالإجابة النموذجية: 2س^(−3)\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = 3/س.\nالإجابة النموذجية: 6/س³\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = س^(5/2).\nالإجابة النموذجية: (15/4) س^(½)", "إرشاد للطالب: حل تمرين 4-2 (2) ص 37 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة /basicmath/?l=9"]}, {"t": "العلاقة بين المشتقتين ومسائل تتطلب ربطهما", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يحل مسائل تربط بين المشتقة الأولى والمشتقة الثانية لدالتين (25 دقيقة)\n2) يفسر المشتقة الثانية بوصفها معدل تغير الميل (التسارع) (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: فهم", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "التسارع، معدل تغير الميل، الربط بين المشتقتين", "موقف: ف = ز³ − 6ز² (إزاحة جسم). «ما السرعة؟ وما التسارع؟» (5 دقائق)", "1. النمذجة: يحسب المعلم السرعة دف/دز والتسارع د²ف/دز²، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف المعلم بتمرين 4-2 (4) ص 38 من كتاب النشاط (مساواة المشتقتين)، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة: يناقش المعلم التفسير، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ف = ز³ − 6ز². أوجد التسارع عند ز = 1.\nالإجابة النموذجية: 6ز − 12 ← −6\n2) [مستوى التطبيق] متى يكون التسارع صفرًا في الموقف السابق؟\nالإجابة النموذجية: ز = 2\n3) [مستوى الاستدلال] إذا كانت المشتقة الأولى لـ د(س) = س² + 2س تساوي المشتقة الثانية لـ هـ(س) = س³، فأوجد س.\nالإجابة النموذجية: 2س + 2 = 6س ← س = ½", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ف = 5ز². أوجد التسارع.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] ف = ز³. أوجد السرعة عند ز = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] ف = ز³. أوجد التسارع عند ز = 2.\nالإجابة النموذجية: 12", "إرشاد للطالب: حل تمرين 4-2 (4) ص 38 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=9"]}, {"t": "تدريبات متنوعة على المشتقة الثانية", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يحل تدريبات متنوعة على المشتقة الثانية (25 دقيقة)\n2) يحدد أخطاءه ويصوبها (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: سبورات صغيرة للمجموعات", "المشتقة الثانية", "نشاط السبورات الصغيرة: مشتقة ثانية سريعة لعدة دوال. (5 دقائق)", "1. تعاوني بالمستويات: يوزع المعلم أوراق عمل متدرجة، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تقييم الأقران: تتبادل المجموعات الأوراق، ويقيّم الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تلخيص: يلخص، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = (س + 2)².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س²(س + 1).\nالإجابة النموذجية: ص = س³ + س² ← 6س + 2\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = (س³ + 1)/س.\nالإجابة النموذجية: ص = س² + 1/س ← 2 + 2/س³", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = 7س.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س⁵.\nالإجابة النموذجية: 20س³\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 3س² − 4س.\nالإجابة النموذجية: 6", "إرشاد للطالب: إكمال تمارين 4-2 (كتاب الطالب) وكتاب النشاط ص ⁦37–38⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=9"]}, {"t": "تمارين المشتقة الثانية ومسابقة الختام", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يطبق مهارات الدرس (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "المشتقة الأولى والثانية", "سؤال «صحح الخطأ»: كتب طالب د″(س) لـ س³ = 3س². ما الخطأ؟ (5 دقائق)", "1. تعاوني: مراجعة شاملة على الدرس، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – تسارع السفينة الشراعية: يجد كل زوج المشتقة الثانية لدالة موقع افتراضية لقارب شراعي في سباق قوارب تقليدي ويفسرها تسارعًا، ثم يذكر معلومة عن تاريخ عمان البحري (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(س) لـ د(س) = س³.\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد د″(3) لـ د(س) = س³ − 2س².\nالإجابة النموذجية: 6س − 4 ← 14\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4√س.\nالإجابة النموذجية: −س^(−3/2)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = 9س².\nالإجابة النموذجية: 18\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س⁴ − س.\nالإجابة النموذجية: 12س²\n3) [مستوى الاستدلال] أوجد د″(0) لـ د(س) = س³ + 5س² .\nالإجابة النموذجية: 10", "إرشاد للطالب: الاستعداد لدرس الدوال المتزايدة والمتناقصة.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=9"]}], "c": ["الحصة 1: مفهوم المشتقة الثانية ورموزها\n1) يعرّف المشتقة الثانية بأنها مشتقة المشتقة الأولى ويستخدم الرموز د″(س) و د²ص/دس² (20 دقيقة)\n2) يجد المشتقة الثانية لكثيرات حدود (20 دقيقة)\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\n1) يجد المشتقة الثانية لدوال ذات أسس سالبة وكسرية (25 دقيقة)\n2) يكتب الإجابة في أبسط صورة (15 دقيقة)\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\n1) يحسب قيمة المشتقة الثانية عند قيمة معطاة لـ س (25 دقيقة)\n2) يجد ثابتًا مجهولًا بمعلومية قيمة المشتقة الثانية (15 دقيقة)\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\n1) يحل مسائل تربط بين المشتقة الأولى والمشتقة الثانية لدالتين (25 دقيقة)\n2) يفسر المشتقة الثانية بوصفها معدل تغير الميل (التسارع) (15 دقيقة)\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\n1) يحل تدريبات متنوعة على المشتقة الثانية (25 دقيقة)\n2) يحدد أخطاءه ويصوبها (15 دقيقة)\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\n1) يطبق مهارات الدرس (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nالمخرج 1: فهم\nالمخرج 2: تطبيق\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nالمخرج 1: تحليل\nالمخرج 2: فهم\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nالتعلم بالنمذجة، التعلم التشاركي، التعلم الذاتي\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nالتعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nالتعلم الذاتي، التعلم التعاوني، التعلم المبني على اللعب\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nالكتاب، السبورة الذكية، أخرى: سبورات صغيرة للمجموعات\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nالمشتقة الثانية، د″(س)، د²ص/دس²، معدل تغير الميل\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nالأسس السالبة، الأسس الكسرية، المشتقة الثانية\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nقيمة د″(أ)، الثابت المجهول\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nالتسارع، معدل تغير الميل، الربط بين المشتقتين\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nالمشتقة الثانية\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\nالمشتقة الأولى والثانية", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nسؤال: «إذا كانت دالة الميل نفسها دالة، فهل يمكن أن نشتقها؟» (5 دقائق)\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nمراجعة اشتقاق 1/س و √س. (5 دقائق)\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nسؤال: «إذا كانت د(س) = س³ + س² فما د″(2)؟» (5 دقائق)\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nموقف: ف = ز³ − 6ز² (إزاحة جسم). «ما السرعة؟ وما التسارع؟» (5 دقائق)\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nنشاط السبورات الصغيرة: مشتقة ثانية سريعة لعدة دوال. (5 دقائق)\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\nسؤال «صحح الخطأ»: كتب طالب د″(س) لـ س³ = 3س². ما الخطأ؟ (5 دقائق)", "الحصة 1: مفهوم المشتقة الثانية ورموزها — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 7 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 4-2 (1) ص 37 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمارين 4-2 (كتاب الطالب)، ويحل الطالب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 8 (كتاب الطالب)، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تشاركي: يكلف الأزواج بقائمة دوال، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. فردي: تمرين 4-2 (2) ص 37 من كتاب النشاط، ويحل الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة على القيم والثوابت، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني: يكلف المعلم بتمرين 4-2 (3) ص 38 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحسب المعلم السرعة دف/دز والتسارع د²ف/دز²، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تشاركي: يكلف المعلم بتمرين 4-2 (4) ص 38 من كتاب النشاط (مساواة المشتقتين)، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم التفسير، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية — زمن الحصة 40 دقيقة\n\n1. تعاوني بالمستويات: يوزع المعلم أوراق عمل متدرجة، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تقييم الأقران: تتبادل المجموعات الأوراق، ويقيّم الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تلخيص: يلخص، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: مراجعة شاملة على الدرس، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. غلق الدرس – تسارع السفينة الشراعية: يجد كل زوج المشتقة الثانية لدالة موقع افتراضية لقارب شراعي في سباق قوارب تقليدي ويفسرها تسارعًا، ثم يذكر معلومة عن تاريخ عمان البحري (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س³ − 3س² + 2.\nالإجابة النموذجية: دص/دس = 3س² − 6س ← د²ص/دس² = 6س − 6\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = 2س⁴.\nالإجابة النموذجية: 24س²\n3) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = 5س + 3.\nالإجابة النموذجية: 0\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د²ص/دس² لـ ص = 1/س.\nالإجابة النموذجية: 2/س³\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = √س.\nالإجابة النموذجية: −¼ س^(−3/2)\n3) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = س² + 2/س.\nالإجابة النموذجية: 2 + 4/س³\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(2) إذا كانت د(س) = س³ + س².\nالإجابة النموذجية: 6س + 2 ← 14\n2) [مستوى التطبيق] أوجد أ إذا كانت د(س) = أ س³ و د″(1) = 12.\nالإجابة النموذجية: 6أ = 12 ← أ = 2\n3) [مستوى الاستدلال] أوجد قيم س التي تجعل د″(س) = 0 للدالة د(س) = س³ − 6س².\nالإجابة النموذجية: 6س − 12 = 0 ← س = 2\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ف = ز³ − 6ز². أوجد التسارع عند ز = 1.\nالإجابة النموذجية: 6ز − 12 ← −6\n2) [مستوى التطبيق] متى يكون التسارع صفرًا في الموقف السابق؟\nالإجابة النموذجية: ز = 2\n3) [مستوى الاستدلال] إذا كانت المشتقة الأولى لـ د(س) = س² + 2س تساوي المشتقة الثانية لـ هـ(س) = س³، فأوجد س.\nالإجابة النموذجية: 2س + 2 = 6س ← س = ½\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = (س + 2)².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س²(س + 1).\nالإجابة النموذجية: ص = س³ + س² ← 6س + 2\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = (س³ + 1)/س.\nالإجابة النموذجية: ص = س² + 1/س ← 2 + 2/س³\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(س) لـ د(س) = س³.\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد د″(3) لـ د(س) = س³ − 2س².\nالإجابة النموذجية: 6س − 4 ← 14\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4√س.\nالإجابة النموذجية: −س^(−3/2)", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = س³.\nالإجابة النموذجية: 6س\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4س³ − س.\nالإجابة النموذجية: 24س\n\nالحصة 2: المشتقة الثانية لدوال بأسس سالبة وكسرية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س^(−1).\nالإجابة النموذجية: 2س^(−3)\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = 3/س.\nالإجابة النموذجية: 6/س³\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = س^(5/2).\nالإجابة النموذجية: (15/4) س^(½)\n\nالحصة 3: قيمة المشتقة الثانية عند نقطة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(1) إذا كانت د(س) = 4س².\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد د″(−1) إذا كانت د(س) = س⁴.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] أوجد ك إذا كانت د(س) = ك س² و د″(س) = 10.\nالإجابة النموذجية: ك = 5\n\nالحصة 4: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ف = 5ز². أوجد التسارع.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] ف = ز³. أوجد السرعة عند ز = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] ف = ز³. أوجد التسارع عند ز = 2.\nالإجابة النموذجية: 12\n\nالحصة 5: تدريبات متنوعة على المشتقة الثانية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = 7س.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س⁵.\nالإجابة النموذجية: 20س³\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 3س² − 4س.\nالإجابة النموذجية: 6\n\nالحصة 6: تمارين المشتقة الثانية ومسابقة الخ تكشف 3) (15 دقيقة)\n2) يربط إشارة المشتقة الأولى بتزايد الدالة أو تناقصها (25 دقيقة)\n\nالحصة 2: تحديد تزايد الدالة أو تناقصها عند نقطة\n1) يحدد ما إذا كانت الدالة متزايدة أو متناقصة عند نقطة بحساب إشارة المشتقة (25 دقيقة)\n2) يبرر إجابته بقيمة الميل (15 دقيقة)\n\nالحصة 3: فترات التزايد والتناقص للدالة التربيعية\n1) يجد الفترة التي تكون فيها دالة تربيعية متزايدة والفترة التي تكون فيها متناقصة (25 دقيقة)\n2) يربط النتيجة برأس القطع المكافئ (15 دقيقة)\n\nالحصة 4: التحقق من تزايد الدالة أو تناقصها في فترة معطاة\n1) يتحقق من أن دالة متزايدة أو متناقصة في فترة معطاة (25 دقيقة)\n2) يحدد قيم ثابت تجعل الدالة متزايدة في فترة (15 دقيقة)\n\nالحصة 5: تطبيقات حياتية: الربح والتكلفة\n1) يوظف التزايد والتناقص في تحليل دالة ربح أو تكلفة (25 دقيقة)\n2) يفسر النتائج في سياق المسألة (15 دقيقة)\n\nالحصة 6: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\n1) يحدد فترات التزايد والتناقص من التمثيل البياني للدالة (15 دقيقة)\n2) ينظم إشارة المشتقة في جدول إشارات ويستنتج منه سلوك الدالة (25 دقيقة)\n\nالحصة 7: تمارين الدوال المتزايدة والمتناقصة\n1) يحل تمارين متنوعة على الدرس (20 دقيقة)\n2) يقيّم مستوى إتقانه (20 دقيقة)\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الأولى والميل\n1) يراجع قواعد الاشتقاق وإيجاد الميل عند نقطة (25 دقيقة)\n2) يحل مسائل مراجعة (15 دقيقة)\n\nالحصة 9: مراجعة الوحدة الثانية: معادلة المماس\n1) يراجع إيجاد معادلة المماس (30 دقيقة)\n2) يحل مسائل مراجعة مركبة (10 دقائق)\n\nالحصة 10: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص\n1) يراجع المشتقة الثانية والتزايد والتناقص (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)\n\nالحصة 11: مراجعة الوحدة الثانية (كتاب النشاط)\n1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط (25 دقيقة)\n2) يصوّب أخطاءه ذاتيًا (15 دقيقة)\n\nالحصة 12: ختام الوحدة الثانية ومسابقة الختام\n1) يطبق مهارات الوحدة الثانية في سياقات متنوعة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\nالمخرج 1: فهم\nالمخرج 2: تحليل\n\nالحصة 2: تحديد تزايد الدالة أو تناقصها عن 1. بناء المفهوم: يستنتج المعلم العلاقة بين إشارة الميل والتزايد والتناقص، والطلبة يدون (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم المثال 9 (كتاب الطالب)، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يحدد المعلم إشارة الميل لمنحنيات معروضة، وتحدد المجموعات (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: تحديد تزايد الدالة أو تناقصها عند نقطة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة الدرس، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. تعاوني: يكلف المعلم بتمرين 5-2 (1) ص 39 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: فترات التزايد والتناقص للدالة التربيعية — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 10 (كتاب الطالب) ويحل المتباينة، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تشاركي: يكلف الأزواج بتمرين 5-2 (2) ص 40 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحقق: يتحقق المعلم في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 4: التحقق من تزايد الدالة أو تناقصها في فترة معطاة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة على التحقق في فترة، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 5-2 (3، 4) ص ⁦40–41⁩ من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: تيجيات: التعلم المبني على المشاريع.\n\nالحصة 12: ختام الوحدة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: مراجعة شاملة، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. غلق الدرس – منحنى موسم الخريف: ترسم المجموعات منحنى تقريبيًا لأعداد زوار صلالة خلال العام، وتحدد فترات التزايد في موسم الخريف وفترات التناقص بعده وإشارة المشتقة الأولى في كل فترة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] إذا كان د′(س) > 0 في فترة فالدالة فيها:\nالإجابة النموذجية: متزايدة\n2) [مستوى التطبيق] هل ص = 3س + 1 متزايدة أم متناقصة؟\nالإجابة النموذجية: متزايدة (الميل 3 > 0)\n3) [مستوى الاستدلال] هل ص = 5 − 2س متزايدة أم متناقصة؟\nالإجابة النموذجية: متناقصة\n\nالحصة 2: تحديد تزايد الدالة أو تناقصها عند نقطة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل ص = س² + 3س متزايدة أم متناقصة عند س = −1؟\nالإجابة النموذجية: الميل 1 > 0 ← متزايدة\n2) [مستوى التطبيق] هل ص = 12 − 7س + س² متزايدة عند س = 2؟\nالإجابة النموذجية: الميل −3 < 0 ← متناقصة\n3) [مستوى الاستدلال] هل ص = س³ − 3س متزايدة عند س = 0؟\nالإجابة النموذجية: الميل −3 ← متناقصة\n\nالحصة 3: فترات التزايد والتناقص للدالة التربيعية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد فترة تزايد ص = س² − 4س.\nالإجابة النموذجية: 2س − 4 > 0 ← س > 2\n2) [مستوى التطبيق] أوجد فترة تناقص ص = س² − 4س.\nالإجابة النموذجية: س < 2\n3) [مستوى الاستدلال] أوجد فترة تزايد ص = 5 + 6س − س².\nالإجابة النموذجية: 6 − 2س > 0 ← س < 3\n\nالحصة 4: التحقق من تزايد الدالة أو تناقصها في فترة معطاة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل ص = س² − 6س متزايدة في 4 < س < 7؟\nالإجابة النموذجية: نعم؛ 2س − 6 > 0 لكل س > 3\n2) [مستوى التطبيق] هل ص = 6س − س² متناقصة في 4 < س < 7؟\nالإجابة النموذجية: نعم؛ 6 − 2س < 0 لكل س > 3\n3) [مستوى الاستدلال] بيّن أن ص = س³ + 2س متزايدة لجميع س.\nالإجابة النموذجية: دص/دس = 3س² + 2 > 0 دائمًا\n\nالحصة 5: تطبيقات حياتية: الربح والتكلفة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ر(س) = −س² + 40س − 100. متى يكون الربح متزايدًا؟\nالإجابة النموذجية: −2س + 40 > 0 ← س < 20\n2) [مستوى التطبيق] في المسألة نفسها، ما عدد السلع الذي يعطي أكبر ربح؟\nالإجابة النموذجية: 20 سلعة\n3) [مستوى الاستدلال] أوجد أكبر ربح.\nالإجابة النموذجية: ر(20) = 300\n\nالحصة 6: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] من جدول الإشارات: د′(س) < 0 عندما س < 3 و د′(س) > 0 عندما س > 3. صف الدالة.\nالإجابة النموذجية: متناقصة عندما س < 3 ومتزايدة عندما س > 3\n2) [مستوى التطبيق] أوجد فترة تزايد ص = س² − 6س + 5.\nالإجابة النموذجية: س > 3\n3) [مستوى الاستدلال] منحنى قطع مكافئ رأسه (−1، 4) ومفتوح للأسفل. أين يكون متزايدًا؟\nالإجابة النموذجية: س < −1\n\nالحصة 7: تمارين الدوال المتزايدة والمتناقصة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل ص = س² − 10س متزايدة عند س = 6؟\nالإجابة النموذجية: نعم؛ الميل 2\n2) [مستوى التطبيق] أوجد فترة تزايد ص = 2س² − 12س.\nالإجابة النموذجية: س > 3\n3) [مستوى الاستدلال] أوجد فترة تناقص ص = 8س − س².\nالإجابة النموذجية: س > 4\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الأولى والميل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = 2س³ + 10 − 16س عند س = −2.\nالإجابة النموذجية: 6س² − 16 ← 8\n2) [مستوى التطبيق] أوجد مشتقة ص = (س + 3)(س − 1).\nالإجابة النموذجية: 2س + 2\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 5س التي ميلها 1.\nالإجابة النموذجية: (3، −6)\n\nالحصة 9: مراجعة الوحدة الثانية: معادلة المماس\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس لـ ص = س² + 3 عند س = 2.\nالإجابة النموذجية: ص = 4س − 1\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 6/س عند (2، 3).\nالإجابة النموذجية: ص = −1.5س + 6\n3) [مستوى الاستدلال] أوجد النقطة التي يقطع عندها المماس ص = 4س − 1 محور السينات.\nالإجابة النموذجية: (¼، 0)\n\nالحصة 10: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(س) لـ د(س) = 2س³ − 9س² + 12س.\nالإجابة النموذجية: 12س − 18\n2) [مستوى التطبيق] أوجد فترة تزايد ص = س النموذجية: نعم\n2) [مستوى التطبيق] هل ص = س² متناقصة في −3 < س < −1؟\nالإجابة النموذجية: نعم؛ 2س < 0\n3) [مستوى الاستدلال] هل ص = س² − 2س متزايدة في 0 < س < 3؟\nالإجابة النموذجية: لا؛ متناقصة في 0 < س < 1 ومتزايدة في 1 < س < 3\n\nالحصة 5: تطبيقات حياتية: الربح والتكلفة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ت(س) = س² − 10س + 50. متى تكون التكلفة متناقصة؟\nالإجابة النموذجية: س < 5\n2) [مستوى التطبيق] ر(س) = 30س − س². متى يكون الربح متزايدًا؟\nالإجابة النموذجية: س < 15\n3) [مستوى الاستدلال] ما أكبر ربح في السؤال السابق؟\nالإجابة النموذجية: 225\n\nالحصة 6: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما إشارة المشتقة على جزء صاعد من المنحنى؟\nالإجابة النموذجية: موجبة\n2) [مستوى التطبيق] أوجد فترة تناقص ص = س² − 6س + 5.\nالإجابة النموذجية: س < 3\n3) [مستوى الاستدلال] منحنى قطع مكافئ رأسه (2، −1) ومفتوح للأعلى. أين يكون متناقصًا؟\nالإجابة النموذجية: س < 2\n\nالحصة 7: تمارين الدوال المتزايدة والمتناقصة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل ص = 7 − 3س متزايدة؟\nالإجابة النموذجية: لا\n2) [مستوى التطبيق] أوجد فترة تزايد ص = س² + 6س.\nالإجابة النموذجية: س > −3\n3) [مستوى الاستدلال] هل ص = س³ متزايدة عند س = 2؟\nالإجابة النموذجية: نعم\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الأولى والميل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد مشتقة ص = 6س².\nالإجابة النموذجية: 12س\n2) [مستوى التطبيق] أوجد مشتقة ص = 2/س.\nالإجابة النموذجية: −2/س²\n3) [مستوى الاستدلال] أوجد ميل ص = س³ عند س = −1.\nالإجابة النموذجية: 3\n\nالحصة 9: مراجعة الوحدة الثانية: معادلة المماس\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل المماس لـ ص = س² + 3 عند س = 2.\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² عند (0، 0).\nالإجابة النموذجية: ص = 0\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 3س − س² عند س = 1.\nالإجابة النموذجية: ص = س + 1\n\nالحصة 10: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى ز بين المتغير العشوائي المتقطع والمتصل بأمثلة (20 دقيقة)\n\nالحصة 2: تحديد القيم الممكنة لمتغير عشوائي متقطع\n1) يحدد القيم الممكنة لمتغير عشوائي متقطع في تجربة معطاة (20 دقيقة)\n2) يحدد أصغر قيمة وأكبر قيمة والقيمة الأكثر احتمالًا (20 دقيقة)\n\nالحصة 3: متغيرات من تجارب متعددة المراحل\n1) يحدد القيم الممكنة لمتغير ناتج من تجربة على مرحلتين (25 دقيقة)\n2) يستخدم الجداول ومخططات النواتج لتنظيم القيم (15 دقيقة)\n\nالحصة 4: المتغيرات الناتجة من عمليات على متغيرين\n1) يحدد القيم الممكنة لمتغير مثل (م + ع) أو الفرق بين متغيرين (25 دقيقة)\n2) يقارن بين قيم متغيرين عشوائيين (15 دقيقة)\n\nالحصة 5: تمثيل متغير عشوائي متقطع بمواقف حياتية\n1) يصوغ متغيرًا عشوائيًا متقطعًا من موقف حياتي ويحدد قيمه (25 دقيقة)\n2) يبرر كون المتغير متقطعًا (15 دقيقة)\n\nالحصة 6: تمارين الدرس ومسابقة الختام\n1) يطبق مفاهيم المتغير العشوائي المتقطع (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nالمخرج 1: فهم\nالمخرج 2: فهم\n\nالحصة 2: تحديد القيم الممكنة لمتغير عشوائي متقطع\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 3: متغيرات من تجارب متعددة المراحل\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 4: المتغيرات الناتجة من عمليات على متغيرين\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 5: تمثيل متغير عشوائي متقطع بمواقف حياتية\nالمخرج 1: إبداع\nالمخرج 2: تقييم\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nالتعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة\n\nالحصة 2: تحديد القيم الممكنة لمتغير عشوائي متقطع\nالتعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب\n\nالحصة 3: متغيرات من تجارب متعددة المراحل\nالتعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني\n\nالحصة 4: المتغيرات الناتجة من عمليات على متغيرين\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي\n\nالحصة 5: تمثيل متغير عشوائي متقطع بمواقف حياتية\nالتعلم المبني على المشاريع، التعلم التعاوني، التعلم التشاركي\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "  المتقطع من نتائج التجربة ويقارنه بالمتصل (الطول، الزمن)، والطلبة يدون ويمثل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: يحل المعلم المثال 1 (كتاب الطالب)، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يصنف المجموعات قائمة متغيرات إلى متقطعة ومتصلة، وتصنف وتبرر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: تحديد القيم الممكنة لمتغير عشوائي متقطع — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 2 (كتاب الطالب) ويبني جدول نواتج حجري نرد، ويكمل الطالب الجدول (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني: يكلف المعلم بتمارين 1-3 (2، 3) ص 45 من كتاب النشاط، وتحل المجموعات (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. فردي: تمارين 1-3 (كتاب الطالب)، ويحل الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: متغيرات من تجارب متعددة المراحل — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المسألة بجدول نواتج، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تشاركي: يكلف الأزواج بتمرين 1-3 (4) ص 46 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: يعرض المعلم الحلول، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 4: المتغيرات الناتجة من عمليات على متغيرين — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم أمثلة كتاب النشاط ص ⁦46–47⁩، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 1-3 (5) ص 47 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 5: تمثيل متغير عشوائي متقطع بمواقف حياتية — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحلل المعلم مثالًا حياتيًا ويحدد قيمه، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. مشروع مصغر: تصوغ كل مجموعة متغيرين من بيئتها المدرسية وتحدد قيمهما، وتصوغ وتعرض (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض سريع، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 6: تمارين الدرس ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: يكلف المعلم بإكمال تمارين 1-3 ص ⁦44–47⁩ من كتاب النشاط، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. غلق الدرس – قارب أم شبكة؟: يعرض المعلم متغيرات من الحياة العمانية (عدد القوارب العائدة إلى الميناء، وزن الصيد، عدد النخيل، كمية الأمطار)، فيصنفها المتحدث المرقم إلى متقطعة أو متصلة مع التعليل (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عند رمي قطعة نقدية 3 مرات، ما القيم الممكنة لعدد مرات ظهور الصورة؟\nالإجابة النموذجية: 0، 1، 2، 3\n2) [مستوى التطبيق] هل عدد الطلاب الغائبين يوميًا متغير متقطع أم متصل؟\nالإجابة النموذجية: متقطع\n3) [مستوى الاستدلال] هل طول الطالب متغير متقطع؟ برر.\nالإجابة النموذجية: لا؛ متصل لأنه يأخذ أي قيمة ضمن مدى\n\nالحصة 2: تحديد القيم الممكنة لمتغير عشوائي متقطع\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عند رمي حجري نرد، ما أصغر وأكبر قيمة لمجموع الرقمين؟\nالإجابة النموذجية: 2 و 12\n2) [مستوى التطبيق] ما القيمة الأكثر احتمالًا لمجموع الرقمين؟\nالإجابة النموذجية: 7\n3) [مستوى الاستدلال] س = الفرق المطلق بين رقمي حجري نرد. اكتب القيم الممكنة.\nالإجابة النموذجية: 0، 1، 2، 3، 4، 5\n\nالحصة 3: متغيرات من تجارب متعددة المراحل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مربع دوّار مرقم 1، 2، 3 أُدير مرتين. ما القيم الممكنة لمجموع الناتجين؟\nالإجابة النموذجية: 2، 3، 4، 5، 6\n2) [مستوى التطبيق] في السؤال السابق ما عدد النواتج الكلية؟\nالإجابة النموذجية: 9\n3) [مستوى الاستدلال] ما القيمة الأكثر تكرارًا لمجموع الناتجين؟\nالإجابة النموذجية: 4\n\nالحصة 4: المتغيرات الناتجة من عمليات على متغيرين\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] م ∈ {1، 2، 3} و ع ∈ {0، 1}. ما القيم الممكنة لـ م + ع؟\nالإجابة النموذجية: 1، 2، 3، 4\n2) [مستوى التطبيق] للمتغيرين السابقين: ما الفرق بين أكبر قيمة لـ م وأصغر قيمة لـ ع؟\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] ما القيم الممكنة لـ م × ع؟\nالإجابة النموذجية: 0، 1، 2، 3\n\nالحصة 5: تمثيل متغير عشوائي متقطع بمواقف حياتية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اقترح متغيرًا عشوائيًا متقطعًا من بيئة المدرسة.\nالإجابة النموذجية: مثل: عدد الطلاب المتأخرين يوميًا\n2) [مستوى التطبيق] ما القيم الممكنة لعدد البنات في أسرة لديها 3 أطفال؟\nالإجابة النموذجية: 0، 1، 2، 3\n3) [مستوى الاستدلال] لماذا يعد عدد الأهداف في مباراة متغيرًا متقطعًا؟\nالإجابة النموذجية: لأنه يأخذ قيمًا صحيحة قابلة للعد\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل زمن السباق متغير متقطع؟\nالإجابة النموذجية: لا؛ متصل\n2) [مستوى التطبيق] عند رمي 4 قطع نقدية، ما القيم الممكنة لعدد الصور؟\nالإجابة النموذجية: 0، 1، 2، 3، 4\n3) [مستوى الاستدلال] سُحبت كرتان من كيس فيه 3 حمراء و 2 زرقاء. ما القيم الممكنة لعدد الحمراء؟\nالإجابة النموذجية: 0، 1، 2", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما المقصود بالمتغير العشوائي المتقطع؟\nالإجابة النموذجية: متغير يأخذ قيمًا قابلة للعد تحدث عشوائيًا\n2) [مستوى التطبيق] عند رمي حجر نرد، ما القيم الممكنة للعدد الظاهر؟\nالإجابة النموذجية: 1، 2، 3، 4، 5، 6\n3) [مستوى الاستدلال] صنّف: زمن الوصول إلى المدرسة.\nالإجابة النموذجية: متصل\n\nالحصة 2: تحديد القيم الممكنة لمتغير عشوائي متقطع\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] كم عدد القيم الممكنة لمجموع رقمي حجري نرد؟\nالإجابة النموذجية: 11\n2) [مستوى التطبيق] عند رمي قطعتين نقديتين، ما القيم الممكنة لعدد الكتابات؟\nالإجابة النموذجية: 0، 1، 2\n3) [مستوى الاستدلال] س = حاصل ضرب رقمي حجري نرد. ما أكبر قيمة؟\nالإجابة النموذجية: 36\n\nالحصة 3: متغيرات من تجارب متعددة المراحل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] قطعة نقدية رُميت مرتين. اكتب فضاء العينة.\nالإجابة النموذجية: {ص ص، ص ك، ك ص، ك ك}\n2) [مستوى التطبيق] ما عدد النواتج عند رمي قطعة نقدية وحجر نرد معًا؟\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] رُمي حجر نرد مرتين و س = أكبر الرقمين. ما القيم الممكنة لـ س؟\nالإجابة النموذجية: 1، 2، 3، 4، 5، 6\n\nالحصة 4: المتغيرات الناتجة من عمليات على متغيرين\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] م ∈ {2، 4} و ع ∈ {1، 3}. ما القيم الممكنة لـ م + ع؟\nالإجابة النموذجية: 3، 5، 7\n2) [مستوى التطبيق] للمتغيرين السابقين ما أكبر قيمة لـ م − ع؟\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] للمتغيرين السابقين ما أصغر قيمة لـ م − ع؟\nالإجابة النموذجية: −1\n\nالحصة 5: تمثيل متغير عشوائي متقطع بمواقف حياتية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل عدد السيارات عند الإشارة متقطع؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] هل كتلة حقيبة الطالب متغير متقطع؟\nالإجابة النموذجية: لا؛ متصل\n3) [مستوى الاستدلال] ما القيم الممكنة لعدد الإجابات الصحيحة في اختبار من 5 أسئلة؟\nالإجابة النموذجية: 0، 1، 2، 3، 4، 5\n\nالحصة 6: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل عدد الطلاب في الصف متغير متقطع؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] رُمي حجر نرد. ما أصغر قيمة ممكنة؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] س = عدد الأرقام الزوجية عند رمي حجري نرد. ما القيم الممكنة؟\nالإجابة النموذجية: 0، 1، 2", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nإرشاد للطالب: مراجعة المثال 1 (كتاب الطالب)، وحل تمارين 1-3 (1) ص 44 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n\nالحصة 2: تحدي  2) و ل(س ≤ 2)؟» (5 دقائق)\n\nالحصة 4: بناء جدول التوزيع الاحتمالي من تجربة\nيدير الطلبة مربعًا دوّارًا مرقمًا ⁦1–4⁩ مرتين ويسجلون مجموع الناتجين. (5 دقائق)\n\nالحصة 5: تفسير جداول التوزيع في مواقف حياتية\nجدول: عدد أيام المطر في الأسبوع واحتمالاتها. «ما احتمال أكثر من يومين ممطرين؟» (5 دقائق)\n\nالحصة 6: تمارين التوزيع الاحتمالي ومسابقة الختام\nسؤال «صحح الخطأ»: كتب طالب ل(س ≥ 3) = ل(س = 3) فقط في توزيع قيمه ⁦1–4⁩. (5 دقائق)", "الحصة 1: مفهوم التوزيع الاحتمالي وخصائصه — زمن الحصة 40 دقيقة\n\n1. بناء المفهوم: يبني المعلم جدول التوزيع لعدد الصور في 3 رميات ويستخلص الخاصيتين، ويكمل الطالب الجدول (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم المثال 3 (كتاب الطالب)، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يتحقق المعلم من صحة جداول معروضة (هل تمثل توزيعًا احتماليًا؟)، وتحكم المجموعات وتبرر (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: إيجاد ثابت مجهول في جدول التوزيع — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 4 (كتاب الطالب) ومثالًا على ل(س) = ك س، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. تعاوني: يكلف المعلم بتمرين 2-3 (2) ص 49 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: حساب احتمالات من جدول التوزيع — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحل المعلم المثال 5 (كتاب الطالب) ويحسب احتمالات متنوعة، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 2-3 (1) ص 48 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تصويب: يناقش المعلم أخطاء المتباينات، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: بناء جدول التوزيع الاحتمالي من تجربة — زمن الحصة 40 دقيقة\n\n1. النمذجة: يبني المعلم جدول التوزيع لمجموع ناتجي المربع الدوّار، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 2-3 (3، 4) ص 50 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تحقق: يتحقق المعلم من مجموع الاحتمالات، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 5: تفسير جداول التوزيع في مواقف حياتية — زمن الحصة 40 دقيقة\n\n1. النمذجة: يحسب المعلم ويفسر احتمالات من الجدول، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. حل مشكلات: يوزع المعلم جداول حياتية على المجموعات، وتحسب وتفسر (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 6: تمارين التوزيع الاحتمالي ومسابقة الختام — زمن الحصة 40 دقيقة\n\n1. تعاوني: مراجعة شاملة لتمارين 2-3 (كتاب الطالب)، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. غلق الدرس – عجلة المحافظات: تصمم المجموعات عجلة دوارة مقسمة إلى أجزاء بأسماء محافظات عمانية، وتكتب جدول التوزيع الاحتمالي لها وتتحقق أن مجموع الاحتمالات يساوي 1 (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مفهوم التوزيع الاحتمالي وخصائصه\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] في رمي 3 قطع نقدية، ما ل(س = 2) حيث س عدد الصور؟\nالإجابة النموذجية: 3/8\n2) [مستوى التطبيق] ما مجموع الاحتمالات في أي توزيع احتمالي؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] هل الجدول ل(س) = 0.3، 0.5، 0.4 يمثل توزيعًا احتماليًا؟ برر.\nالإجابة النموذجية: لا؛ المجموع 1.2 ≠ 1\n\nالحصة 2: إيجاد ثابت مجهول في جدول التوزيع\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول احتمالات: 0.1، 0.3، ك، 0.2. أوجد ك.\nالإجابة النموذجية: ك = 0.4\n2) [مستوى التطبيق] ل(س) = ك س حيث س = 1، 2، 3، 4. أوجد ك.\nالإجابة النموذجية: 10ك = 1 ← ك = 0.1\n3) [مستوى الاستدلال] ل(س) = ك س² حيث س = 1، 2، 3. أوجد ك.\nالإجابة النموذجية: 14ك = 1 ← ك = 1/14\n\nالحصة 3: حساب احتمالات من جدول التوزيع\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ل(س ≤ 2).\nالإجابة النموذجية: 0.4\n2) [مستوى التطبيق] للتوزيع نفسه أوجد ل(س > 1).\nالإجابة النموذجية: 1 − 0.1 = 0.9\n3) [مستوى الاستدلال] للتوزيع نفسه أوجد ل(2 < س ≤ 4).\nالإجابة النموذجية: 0.4 + 0.2 = 0.6\n\nالحصة 4: بناء جدول التوزيع الاحتمالي من تجربة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مربع دوّار مرقم ⁦1–4⁩ أُدير مرتين. ما ل(المجموع = 5)؟\nالإجابة النموذجية: 4/16 = 1/4\n2) [مستوى التطبيق] ما ل(المجموع = 2)؟\nالإجابة النموذجية: 1/16\n3) [مستوى الاستدلال] ما احتمال أن يكون المجموع عددًا زوجيًا؟\nالإجابة النموذجية: 8/16 = 1/2\n\nالحصة 5: تفسير جداول التوزيع في مواقف حياتية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول عدد الرسائل اليومية: 0، 1، 2، 3 باحتمالات 0.2، 0.4، 0.3، 0.1. ما ل(رسالة واحدة على الأقل)؟\nالإجابة النموذجية: 0.8\n2) [مستوى التطبيق] ما القيمة الأكثر احتمالًا؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] ما احتمال أكثر من رسالة؟\nالإجابة النموذجية: 0.4\n\nالحصة 6: تمارين التوزيع الاحتمالي ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول: 0.2، 0.2، ك، 0.1. أوجد ك.\nالإجابة النموذجية: 0.5\n2) [مستوى التطبيق] ل(س) = ك(س + 1) حيث س = 0، 1، 2. أوجد ك.\nالإجابة النموذجية: 6ك = 1 ← ك = 1/6\n3) [مستوى الاستدلال] للتوزيع ل(س) = (س + 1)/6 حيث س = 0، 1، 2، أوجد ل(س ≥ 1).\nالإجابة النموذجية: 2/6 + 3/6 = 5/6", "الحصة 1: مفهوم التوزيع الاحتمالي وخصائصه\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] في رمي 3 قطع نقدية، ما ل(
