ق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "المماس الأفقي ص = ك، التقاطع مع المحاور", "سؤال: «ما معادلة المماس عند رأس القطع المكافئ ص = س² − 4س + 7؟» (5 دقائق)", "1. النمذجة: يجد المعلم الرأس (2، 3) ويكتب ص = 3، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بإيجاد مماسات وتقاطعاتها مع المحاور، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس الأفقي لـ ص = س² − 4س + 7.\nالإجابة النموذجية: ص = 3\n2) [مستوى التطبيق] المماس ص = 2س − 5. أين يقطع محور السينات؟\nالإجابة النموذجية: (2.5، 0)\n3) [مستوى الاستدلال] أين يقطع المماس ص = −4س + 14 محور الصادات؟\nالإجابة النموذجية: (0، 14)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس الأفقي؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد معادلة المماس الأفقي لـ ص = 5 − س².\nالإجابة النموذجية: ص = 5\n3) [مستوى الاستدلال] أين يقطع المماس ص = 3س − 2 محور السينات؟\nالإجابة النموذجية: (2/3، 0)", "إرشاد للطالب: حل تمرين 3-2 (4) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "المماس الموازي لمستقيم معلوم", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يجد النقطة التي يكون عندها المماس موازيًا لمستقيم معلوم (25 دقيقة)\n2) يكتب معادلة ذلك المماس (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام", "المستقيمات المتوازية، تساوي الميول", "سؤال: «ما ميل أي مستقيم يوازي ص = 4س + 1؟» (5 دقائق)", "1. النمذجة: يحل المعلم: النقطة على ص = س² التي مماسها يوازي ص = 4س + 1 ثم معادلته، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 3-2 (5) ص 36 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي مماسها يوازي ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] اكتب معادلة ذلك المماس.\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 3س التي مماسها يوازي محور السينات.\nالإجابة النموذجية: (1.5، −2.25)", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المستقيم ص = −2س + 7؟\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد النقطة على ص = س² التي مماسها يوازي ص = −2س + 7.\nالإجابة النموذجية: (−1، 1)\n3) [مستوى الاستدلال] اكتب معادلة المماس في السؤال السابق.\nالإجابة النموذجية: ص = −2س − 1", "إرشاد للطالب: حل تمرين 3-2 (5) ص 36 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "المماس المشترك وتدريبات متنوعة", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يتحقق من كون مستقيم مماسًا لمنحنيين (المماس المشترك) (25 دقيقة)\n2) يحل تدريبات متنوعة على معادلة المماس (15 دقيقة)", "المخرج 1: تقييم\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra", "المماس المشترك، التحقق", "يعرض المنحنيين ص = س² و ص = س² − 4س + 8 ويسأل: «هل يوجد مستقيم يمس كليهما؟» (5 دقائق)", "1. النمذجة: يحل المعلم تمرين المماس المشترك من كتاب النشاط ص 36، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بإكمال تمارين 3-2 ص ⁦34–36⁩ من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بيّن أن ص = 2س − 1 مماس لـ ص = س² عند (1، 1).\nالإجابة النموذجية: الميل عند س = 1 هو 2 والنقطة تحقق المستقيم\n2) [مستوى التطبيق] بيّن أن ص = 2س − 1 يمس ص = س² − 4س + 8 أيضًا.\nالإجابة النموذجية: عند س = 3: ص = 5 والميل 2(3) − 4 = 2، و 2(3) − 1 = 5\n3) [مستوى الاستدلال] ما معنى المماس المشترك؟\nالإجابة النموذجية: مستقيم يمس المنحنيين كليهما", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل ص = 4س − 4 مماس لـ ص = س² عند (2، 4)؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س³ − س عند س = 0.\nالإجابة النموذجية: ص = −س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3", "إرشاد للطالب: إكمال تمارين 3-2 من كتاب النشاط ص ⁦34–36⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"t": "تمارين معادلة المماس ومسابقة الختام", "w": "الأسبوع التاسع (⁦1–5/11/2026⁩م)", "f": ["1) يطبق مهارات إيجاد معادلة المماس (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "معادلة المماس", "سؤال «صحح الخطأ»: كتب طالب معادلة المماس لـ ص = س² عند (2، 4) هي ص = 2س. ما الخطأ؟ (5 دقائق)", "1. تعاوني: مراجعة شاملة لتمارين 3-2 (كتاب الطالب)، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مماس على قبة: تمثل المجموعات قبة جامع بالمنحنى ص = 9 − س² وتجد معادلة المماس عند النقطة (1، 8)، ثم تتحدث عن جمال القباب في عمارة المساجد العمانية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس لـ ص = س² + 2س عند (1، 3).\nالإجابة النموذجية: ص = 4س − 1\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 2س³ عند س = 1.\nالإجابة النموذجية: ص = 6س − 4\n3) [مستوى الاستدلال] أوجد معادلة المماس الأفقي لـ ص = س² + 6س.\nالإجابة النموذجية: ص = −9", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس لـ ص = س² + 2س عند س = 1؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 5س عند س = 2.\nالإجابة النموذجية: ص = 5س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س² − 1 عند (1، 0).\nالإجابة النموذجية: ص = 2س − 2", "إرشاد للطالب: الاستعداد لدرس المشتقة الثانية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}], "c": ["الحصة 1: معادلة المماس عند نقطة معلومة\n1) يجد معادلة المماس لمنحنى عند نقطة معلومة باستخدام الميل والنقطة (10 دقائق)\n2) يكتب المعادلة على الصورة ص = م س + ج (10 دقائق)\n3) يجد الإحداثي الصادي للنقطة ثم الميل ثم معادلة المماس (15 دقيقة)\n4) ينظم خطوات الحل بشكل منطقي (5 دقائق)\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\n1) يجد معادلة المماس الأفقي لمنحنى (25 دقيقة)\n2) يجد نقاط تقاطع المماس مع المحورين (15 دقيقة)\n\nالحصة 3: المماس الموازي لمستقيم معلوم\n1) يجد النقطة التي يكون عندها المماس موازيًا لمستقيم معلوم (25 دقيقة)\n2) يكتب معادلة ذلك المماس (15 دقيقة)\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\n1) يتحقق من كون مستقيم مماسًا لمنحنيين (المماس المشترك) (25 دقيقة)\n2) يحل تدريبات متنوعة على معادلة المماس (15 دقيقة)\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\n1) يطبق مهارات إيجاد معادلة المماس (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: معادلة المماس عند نقطة معلومة\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nالمخرج 1: تحليل\nالمخرج 2: تطبيق\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nالمخرج 1: تقييم\nالمخرج 2: تطبيق\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: معادلة المماس عند نقطة معلومة\nالتعلم بالنمذجة، التعلم التعاوني، التعلم بالاكتشاف، التعلم التشاركي\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nالتعلم المبني على حل المشكلات، التعلم التشاركي، التعلم التعاوني\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nالتعلم المبني على حل المشكلات، التعلم التعاوني، التعلم الذاتي\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nالتعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الحصة 1: معادلة المماس عند نقطة معلومة\nالكتاب، السبورة الذكية، أخرى: برنامج GeoGebra، عروض تقديمية\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nالكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nالكتاب، السبورة الذكية، الأقلام\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nالكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nالكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الحصة 1: معادلة المماس عند نقطة معلومة\nالمماس، الميل، ص − ص₁ = م(س − س₁)، ص = م س + ج\nخطوات إيجاد معادلة المماس: ص₁، الميل، المعادلة\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nالمماس الأفقي ص = ك، التقاطع مع المحاور\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nالمستقيمات المتوازية، تساوي الميول\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nالمماس المشترك، التحقق\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nمعادلة المماس", "الحصة 1: معادلة المماس عند نقطة معلومة\nمراجعة: معادلة مستقيم ميله 2 ويمر بـ (4، 3). (5 دقائق)\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nسؤال: «ما معادلة المماس عند رأس القطع المكافئ ص = س² − 4س + 7؟» (5 دقائق)\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nسؤال: «ما ميل أي مستقيم يوازي ص = 4س + 1؟» (5 دقائق)\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nيعرض المنحنيين ص = س² و ص = س² − 4س + 8 ويسأل: «هل يوجد مستقيم يمس كليهما؟» (5 دقائق)\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nسؤال «صحح الخطأ»: كتب طالب معادلة المماس لـ ص = س² عند (2، 4) هي ص = 2س. ما الخطأ؟ (5 دقائق)", "الحصة 1: معادلة المماس عند نقطة معلومة — زمن الحصة 40 دقيقة\n1. النمذجة: يعرض المعلم شرائح معادلة المماس (دليل المعلم) لمنحنى ص = س² − 6س + 11 عند (4، 3)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 3-2 (1) ص 34 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحقق: يتحقق المعلم من المماس في GeoGebra، ويتحقق الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم أمثلة الدرس (كتاب الطالب)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. تشاركي: يكلف الأزواج بتمرين 3-2 (3) ص 35 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تصويب: يناقش، ويصحح الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور — زمن الحصة 40 دقيقة\n1. النمذجة: يجد المعلم الرأس (2، 3) ويكتب ص = 3، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بإيجاد مماسات وتقاطعاتها مع المحاور، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: المماس الموازي لمستقيم معلوم — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم: النقطة على ص = س² التي مماسها يوازي ص = 4س + 1 ثم معادلته، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 3-2 (5) ص 36 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: المماس المشترك وتدريبات متنوعة — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم تمرين المماس المشترك من كتاب النشاط ص 36، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بإكمال تمارين 3-2 ص ⁦34–36⁩ من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: مراجعة شاملة لتمارين 3-2 (كتاب الطالب)، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – مماس على قبة: تمثل المجموعات قبة جامع بالمنحنى ص = 9 − س² وتجد معادلة المماس عند النقطة (1، 8)، ثم تتحدث عن جمال القباب في عمارة المساجد العمانية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: معادلة المماس عند نقطة معلومة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد ميل ص = س² − 6س + 11 عند (4، 3).\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد معادلة المماس عند (4، 3).\nالإجابة النموذجية: ص = 2س − 5\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س³ عند (1، 1).\nالإجابة النموذجية: ص = 3س − 2\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد معادلة المماس لـ ص = 2س² + 1 عند س = −1.\nالإجابة النموذجية: ص = 3، الميل −4 ← ص = −4س − 1\n5) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 10 − س² عند س = 2.\nالإجابة النموذجية: ص = 6، الميل −4 ← ص = −4س + 14\n6) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = √س عند س = 4.\nالإجابة النموذجية: ص = 2، الميل 1/4 ← ص = ¼ س + 1\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس الأفقي لـ ص = س² − 4س + 7.\nالإجابة النموذجية: ص = 3\n2) [مستوى التطبيق] المماس ص = 2س − 5. أين يقطع محور السينات؟\nالإجابة النموذجية: (2.5، 0)\n3) [مستوى الاستدلال] أين يقطع المماس ص = −4س + 14 محور الصادات؟\nالإجابة النموذجية: (0، 14)\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد النقطة على ص = س² التي مماسها يوازي ص = 4س + 1.\nالإجابة النموذجية: (2، 4)\n2) [مستوى التطبيق] اكتب معادلة ذلك المماس.\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد النقطة على ص = س² − 3س التي مماسها يوازي محور السينات.\nالإجابة النموذجية: (1.5، −2.25)\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] بيّن أن ص = 2س − 1 مماس لـ ص = س² عند (1، 1).\nالإجابة النموذجية: الميل عند س = 1 هو 2 والنقطة تحقق المستقيم\n2) [مستوى التطبيق] بيّن أن ص = 2س − 1 يمس ص = س² − 4س + 8 أيضًا.\nالإجابة النموذجية: عند س = 3: ص = 5 والميل 2(3) − 4 = 2، و 2(3) − 1 = 5\n3) [مستوى الاستدلال] ما معنى المماس المشترك؟\nالإجابة النموذجية: مستقيم يمس المنحنيين كليهما\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد معادلة المماس لـ ص = س² + 2س عند (1، 3).\nالإجابة النموذجية: ص = 4س − 1\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 2س³ عند س = 1.\nالإجابة النموذجية: ص = 6س − 4\n3) [مستوى الاستدلال] أوجد معادلة المماس الأفقي لـ ص = س² + 6س.\nالإجابة النموذجية: ص = −9", "الحصة 1: معادلة المماس عند نقطة معلومة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] مستقيم ميله 3 ويمر بـ (0، 2). اكتب معادلته.\nالإجابة النموذجية: ص = 3س + 2\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² عند (2، 4).\nالإجابة النموذجية: ص = 4س − 4\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 1/س عند (1، 1).\nالإجابة النموذجية: ص = −س + 2\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد ص عندما س = 3 على ص = س² − 1.\nالإجابة النموذجية: 8\n5) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س² − 1 عند س = 3.\nالإجابة النموذجية: ص = 6س − 10\n6) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 4/س عند س = 2.\nالإجابة النموذجية: ص = 2، الميل −1 ← ص = −س + 4\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس الأفقي؟\nالإجابة النموذجية: صفر\n2) [مستوى التطبيق] أوجد معادلة المماس الأفقي لـ ص = 5 − س².\nالإجابة النموذجية: ص = 5\n3) [مستوى الاستدلال] أين يقطع المماس ص = 3س − 2 محور السينات؟\nالإجابة النموذجية: (2/3، 0)\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المستقيم ص = −2س + 7؟\nالإجابة النموذجية: −2\n2) [مستوى التطبيق] أوجد النقطة على ص = س² التي مماسها يوازي ص = −2س + 7.\nالإجابة النموذجية: (−1، 1)\n3) [مستوى الاستدلال] اكتب معادلة المماس في السؤال السابق.\nالإجابة النموذجية: ص = −2س − 1\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل ص = 4س − 4 مماس لـ ص = س² عند (2، 4)؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = س³ − س عند س = 0.\nالإجابة النموذجية: ص = −س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = 3س² عند (1، 3).\nالإجابة النموذجية: ص = 6س − 3\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ميل المماس لـ ص = س² + 2س عند س = 1؟\nالإجابة النموذجية: 4\n2) [مستوى التطبيق] أوجد معادلة المماس لـ ص = 5س عند س = 2.\nالإجابة النموذجية: ص = 5س\n3) [مستوى الاستدلال] أوجد معادلة المماس لـ ص = س² − 1 عند (1، 0).\nالإجابة النموذجية: ص = 2س − 2", "الحصة 1: معادلة المماس عند نقطة معلومة\nإرشاد للطالب: حل تمرين 3-2 (1) ص 34 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 3-2 (3) ص 35 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8\n\nالحصة 2: المماس الأفقي ونقاط التقاطع مع المحاور\nإرشاد للطالب: حل تمرين 3-2 (4) ص 35 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8\n\nالحصة 3: المماس الموازي لمستقيم معلوم\nإرشاد للطالب: حل تمرين 3-2 (5) ص 36 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8\n\nالحصة 4: المماس المشترك وتدريبات متنوعة\nإرشاد للطالب: إكمال تمارين 3-2 من كتاب النشاط ص ⁦34–36⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8\n\nالحصة 5: تمارين معادلة المماس ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس المشتقة الثانية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=8"]}, {"id": "4-2", "title": "المشتقة الثانية", "unit": "الوحدة الثانية: التفاضل", "sbp": "المثالان 7، 8، تمارين 4-2", "wbp": "⁦37–38⁩", "p": [{"t": "مفهوم المشتقة الثانية ورموزها + المشتقة الثانية لدوال بأسس سالبة وكسرية", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يعرّف المشتقة الثانية بأنها مشتقة المشتقة الأولى ويستخدم الرموز د″(س) و د²ص/دس² (10 دقائق)\n2) يجد المشتقة الثانية لكثيرات حدود (10 دقائق)\n3) يجد المشتقة الثانية لدوال ذات أسس سالبة وكسرية (15 دقيقة)\n4) يكتب الإجابة في أبسط صورة (5 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام", "المشتقة الثانية، د″(س)، د²ص/دس²، معدل تغير الميل، الأسس السالبة، الأسس الكسرية", "سؤال: «إذا كانت دالة الميل نفسها دالة، فهل يمكن أن نشتقها؟» (5 دقائق)", "1. النمذجة: يحل المعلم المثال 7 (كتاب الطالب)، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 4-2 (1) ص 37 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. فردي: تمارين 4-2 (كتاب الطالب)، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم المثال 8 (كتاب الطالب)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. تشاركي: يكلف الأزواج بقائمة دوال، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. فردي: تمرين 4-2 (2) ص 37 من كتاب النشاط، ويحل الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س³ − 3س² + 2.\nالإجابة النموذجية: دص/دس = 3س² − 6س ← د²ص/دس² = 6س − 6\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = 2س⁴.\nالإجابة النموذجية: 24س²\n3) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = 5س + 3.\nالإجابة النموذجية: 0\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد د²ص/دس² لـ ص = 1/س.\nالإجابة النموذجية: 2/س³\n5) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = √س.\nالإجابة النموذجية: −¼ س^(−3/2)\n6) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = س² + 2/س.\nالإجابة النموذجية: 2 + 4/س³", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = س³.\nالإجابة النموذجية: 6س\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4س³ − س.\nالإجابة النموذجية: 24س\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س^(−1).\nالإجابة النموذجية: 2س^(−3)\n5) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = 3/س.\nالإجابة النموذجية: 6/س³\n6) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = س^(5/2).\nالإجابة النموذجية: (15/4) س^(½)", "إرشاد للطالب: حل تمرين 4-2 (1) ص 37 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 4-2 (2) ص 37 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=9"]}, {"t": "قيمة المشتقة الثانية عند نقطة", "w": "الأسبوع العاشر (⁦8–12/11/2026⁩م)", "f": ["1) يحسب قيمة المشتقة الثانية عند قيمة معطاة لـ س (25 دقيقة)\n2) يجد ثابتًا مجهولًا بمعلومية قيمة المشتقة الثانية (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام", "قيمة د″(أ)، الثابت المجهول", "سؤال: «إذا كانت د(س) = س³ + س² فما د″(2)؟» (5 دقائق)", "1. النمذجة: يحل المعلم أمثلة على القيم والثوابت، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 4-2 (3) ص 38 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(2) إذا كانت د(س) = س³ + س².\nالإجابة النموذجية: 6س + 2 ← 14\n2) [مستوى التطبيق] أوجد أ إذا كانت د(س) = أ س³ و د″(1) = 12.\nالإجابة النموذجية: 6أ = 12 ← أ = 2\n3) [مستوى الاستدلال] أوجد قيم س التي تجعل د″(س) = 0 للدالة د(س) = س³ − 6س².\nالإجابة النموذجية: 6س − 12 = 0 ← س = 2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(1) إذا كانت د(س) = 4س².\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد د″(−1) إذا كانت د(س) = س⁴.\nا جة: يحل المعلم أمثلة على القيم والثوابت، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 4-2 (3) ص 38 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: العلاقة بين المشتقتين ومسائل تتطلب ربطهما — زمن الحصة 40 دقيقة\n1. النمذجة: يحسب المعلم السرعة دف/دز والتسارع د²ف/دز²، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف المعلم بتمرين 4-2 (4) ص 38 من كتاب النشاط (مساواة المشتقتين)، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة: يناقش المعلم التفسير، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: تدريبات متنوعة على المشتقة الثانية — زمن الحصة 40 دقيقة\n1. تعاوني بالمستويات: يوزع المعلم أوراق عمل متدرجة، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تقييم الأقران: تتبادل المجموعات الأوراق، ويقيّم الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تلخيص: يلخص، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين المشتقة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: مراجعة شاملة على الدرس، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – تسارع السفينة الشراعية: يجد كل زوج المشتقة الثانية لدالة موقع افتراضية لقارب شراعي في سباق قوارب تقليدي ويفسرها تسارعًا، ثم يذكر معلومة عن تاريخ عمان البحري (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س³ − 3س² + 2.\nالإجابة النموذجية: دص/دس = 3س² − 6س ← د²ص/دس² = 6س − 6\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = 2س⁴.\nالإجابة النموذجية: 24س²\n3) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = 5س + 3.\nالإجابة النموذجية: 0\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] أوجد د²ص/دس² لـ ص = 1/س.\nالإجابة النموذجية: 2/س³\n5) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = √س.\nالإجابة النموذجية: −¼ س^(−3/2)\n6) [مستوى الاستدلال] أوجد د²ص/دس² لـ ص = س² + 2/س.\nالإجابة النموذجية: 2 + 4/س³\n\nالحصة 2: قيمة المشتقة الثانية عند نقطة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(2) إذا كانت د(س) = س³ + س².\nالإجابة النموذجية: 6س + 2 ← 14\n2) [مستوى التطبيق] أوجد أ إذا كانت د(س) = أ س³ و د″(1) = 12.\nالإجابة النموذجية: 6أ = 12 ← أ = 2\n3) [مستوى الاستدلال] أوجد قيم س التي تجعل د″(س) = 0 للدالة د(س) = س³ − 6س².\nالإجابة النموذجية: 6س − 12 = 0 ← س = 2\n\nالحصة 3: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ف = ز³ − 6ز². أوجد التسارع عند ز = 1.\nالإجابة النموذجية: 6ز − 12 ← −6\n2) [مستوى التطبيق] متى يكون التسارع صفرًا في الموقف السابق؟\nالإجابة النموذجية: ز = 2\n3) [مستوى الاستدلال] إذا كانت المشتقة الأولى لـ د(س) = س² + 2س تساوي المشتقة الثانية لـ هـ(س) = س³، فأوجد س.\nالإجابة النموذجية: 2س + 2 = 6س ← س = ½\n\nالحصة 4: تدريبات متنوعة على المشتقة الثانية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = (س + 2)².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س²(س + 1).\nالإجابة النموذجية: ص = س³ + س² ← 6س + 2\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = (س³ + 1)/س.\nالإجابة النموذجية: ص = س² + 1/س ← 2 + 2/س³\n\nالحصة 5: تمارين المشتقة الثانية ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(س) لـ د(س) = س³.\nالإجابة النموذجية: 6س\n2) [مستوى التطبيق] أوجد د″(3) لـ د(س) = س³ − 2س².\nالإجابة النموذجية: 6س − 4 ← 14\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4√س.\nالإجابة النموذجية: −س^(−3/2)", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س².\nالإجابة النموذجية: 2\n2) [مستوى التطبيق] أوجد د″(س) إذا كانت د(س) = س³.\nالإجابة النموذجية: 6س\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 4س³ − س.\nالإجابة النموذجية: 24س\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س^(−1).\nالإجابة النموذجية: 2س^(−3)\n5) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = 3/س.\nالإجابة النموذجية: 6/س³\n6) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = س^(5/2).\nالإجابة النموذجية: (15/4) س^(½)\n\nالحصة 2: قيمة المشتقة الثانية عند نقطة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(1) إذا كانت د(س) = 4س².\nالإجابة النموذجية: 8\n2) [مستوى التطبيق] أوجد د″(−1) إذا كانت د(س) = س⁴.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] أوجد ك إذا كانت د(س) = ك س² و د″(س) = 10.\nالإجابة النموذجية: ك = 5\n\nالحصة 3: العلاقة بين المشتقتين ومسائل تتطلب ربطهما\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ف = 5ز². أوجد التسارع.\nالإجابة النموذجية: 10\n2) [مستوى التطبيق] ف = ز³. أوجد السرعة عند ز = 2.\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] ف = ز³. أوجد التسارع عند ز = 2.\nالإجابة النموذجية: 12\n\nالحصة 4: تدريبات متنوعة على المشتقة الثانية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = 7س.\nالإجابة النموذجية: 0\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س⁵.\nالإجابة النموذجية: 20س³\n3) [مستوى الاستدلال] أوجد المشتقة الثانية لـ ص = 3س² − 4س.\nالإجابة النموذجية: 6\n\nالحصة 5: تمارين المشتقة الثانية ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = 9س².\nالإجابة النموذجية: 18\n2) [مستوى التطبيق] أوجد المشتقة الثانية لـ ص = س⁴ − س.\nالإجابة النموذجية: 12س²\n3) [مستوى الاستدلال] أوجد د″(0) لـ د(س) = س³ + 5س² .\nالإجابة النموذجية: 10", "الحصة 1: مفهوم المشتقة الثانية ورموزها\nإرشاد للطالب: حل تمرين 4-2 (1) ص 37 من كتاب النشاط.\nإرشاد لولي الأم ة النموذجية: الميل −3 ← متناقصة", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما إشارة ميل دالة متناقصة؟\nالإجابة النموذجية: سالبة\n2) [مستوى التطبيق] هل ص = −س + 4 متزايدة؟\nالإجابة النموذجية: لا؛ متناقصة\n3) [مستوى الاستدلال] أعط مثالًا لدالة متزايدة لجميع س.\nالإجابة النموذجية: مثل ص = 2س\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] هل ص = س² متزايدة عند س = 3؟\nالإجابة النموذجية: نعم (الميل 6)\n5) [مستوى التطبيق] هل ص = 4 − س² متزايدة عند س = 1؟\nالإجابة النموذجية: لا؛ الميل −2\n6) [مستوى الاستدلال] هل ص = 2س² − 8س متزايدة عند س = 2؟\nالإجابة النموذجية: لا هذه ولا تلك؛ الميل 0", "إرشاد للطالب: مراجعة استكشف 3 والمثال 9 (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 5-2 (1) ص 39 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=10"]}, {"t": "فترات التزايد والتناقص للدالة التربيعية + التحقق من تزايد الدالة أو تناقصها في فترة معطاة", "w": "الأسبوع الحادي عشر (⁦15–19/11/2026⁩م)", "f": ["1) يجد الفترة التي تكون فيها دالة تربيعية متزايدة والفترة التي تكون فيها متناقصة (15 دقيقة)\n2) يربط النتيجة برأس القطع المكافئ (10 دقائق)\n3) يتحقق من أن دالة متزايدة أو متناقصة في فترة معطاة (10 دقائق)\n4) يحدد قيم ثابت تجعل الدالة متزايدة في فترة (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\nالمخرج 4: تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: برنامج GeoGebra\nالكتاب، السبورة الذكية، الأقلام", "حل المتباينة د′(س) > 0، رأس القطع المكافئ، الفترة المعطاة، إشارة المشتقة في الفترة", "سؤال: «أين يتحول منحنى ص = س² − 4س من الهبوط إلى الصعود؟» (5 دقائق)", "1. النمذجة: يحل المعلم المثال 10 (كتاب الطالب) ويحل المتباينة، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تشاركي: يكلف الأزواج بتمرين 5-2 (2) ص 40 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يتحقق المعلم في GeoGebra، ويتحقق الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم أمثلة على التحقق في فترة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمرين 5-2 (3، 4) ص ⁦40–41⁩ من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. عرض: تعرض المجموعات، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد فترة تزايد ص = س² − 4س.\nالإجابة النموذجية: 2س − 4 > 0 ← س > 2\n2) [مستوى التطبيق] أوجد فترة تناقص ص = س² − 4س.\nالإجابة النموذجية: س < 2\n3) [مستوى الاستدلال] أوجد فترة تزايد ص = 5 + 6س − س².\nالإجابة النموذجية: 6 − 2س > 0 ← س < 3\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] هل ص = س² − 6س متزايدة في 4 < س < 7؟\nالإجابة النموذجية: نعم؛ 2س − 6 > 0 لكل س > 3\n5) [مستوى التطبيق] هل ص = 6س − س² متناقصة في 4 < س < 7؟\nالإجابة النموذجية: نعم؛ 6 − 2س < 0 لكل س > 3\n6) [مستوى الاستدلال] بيّن أن ص = س³ + 2س متزايدة لجميع س.\nالإجابة النموذجية: دص/دس = 3س² + 2 > 0 دائمًا", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد فترة تزايد ص = س².\nالإجابة النموذجية: س > 0\n2) [مستوى التطبيق] أوجد فترة تناقص ص = س² + 2س.\nالإجابة النموذجية: س < −1\n3) [مستوى الاستدلال] أوجد فترة تناقص ص = 3 − س².\nالإجابة النموذجية: س > 0\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] هل ص = 2س + 5 متزايدة في 0 < س < 10؟\nالإجابة النموذجية: نعم\n5) [مستوى التطبيق] هل ص = س² متناقصة في −3 < س < −1؟\nالإجابة النموذجية: نعم؛ 2س < 0\n6) [مستوى الاستدلال] هل ص = س² − 2س متزايدة في 0 < س < 3؟\nالإجابة النموذجية: لا؛ متناقصة في 0 < س < 1 ومتزايدة في 1 < س < 3", "إرشاد للطالب: حل تمرين 5-2 (2) ص 40 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند مل 4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد د″(س) لـ د(س) = 2س³ − 9س² + 12س.\nالإجابة النموذجية: 12س − 18\n2) [مستوى التطبيق] أوجد فترة تزايد ص = س² − 8س + 3.\nالإجابة النموذجية: س > 4\n3) [مستوى الاستدلال] هل د(س) = 2س³ − 9س² + 12س متزايدة عند س = 1.5؟\nالإجابة النموذجية: د′ = 6س² − 18س + 12 = −1.5 ← متناقصة", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] أوجد المشتقة الثانية لـ ص = س⁴.\nالإجابة النموذجية: 12س²\n2) [مستوى التطبيق] هل ص = 10 − س² متزايدة عند س = −2؟\nالإجابة النموذجية: نعم؛ الميل 4\n3) [مستوى الاستدلال] أوجد فترة تناقص ص = س² − 8س + 3.\nالإجابة النموذجية: س < 4", "إرشاد للطالب: حل بقية تمارين المراجعة (كتاب الطالب).\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=10"]}, {"t": "مراجعة الوحدة الثانية (كتاب النشاط)", "w": "الأسبوع الثاني عشر (⁦22–26/11/2026⁩م)", "f": ["1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط (25 دقيقة)\n2) يصوّب أخطاءه ذاتيًا (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تقييم", "التعلم الذاتي، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية", "مفاهيم الوحدة الثانية", "مراجعة سريعة لأخطاء الطلبة في الاختبارات القصيرة. (5 دقائق)", "1. كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية ص ⁦42–43⁩ من كتاب النشاط، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يعرض المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم التمارين الأصعب، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى الم اجعة مركبة (10 دقائق)\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص\n1) يراجع المشتقة الثانية والتزايد والتناقص (25 دقيقة)\n2) يحل مسائل مراجعة تجمع أكثر من مهارة (15 دقيقة)\n\nالحصة 9: مراجعة الوحدة الثانية (كتاب النشاط)\n1) يطبق مهارات الوحدة في تمارين مراجعة كتاب النشاط (25 دقيقة)\n2) يصوّب أخطاءه ذاتيًا (15 دقيقة)\n\nالحصة 10: ختام الوحدة الثانية ومسابقة الختام\n1) يطبق مهارات الوحدة الثانية في سياقات متنوعة (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\nالمخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تحليل\n\nالحصة 2: فترات التزايد والتناقص للدالة التربيعية\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\nالمخرج 4: تحليل\n\nالحصة 3: تطبيقات حياتية: الربح والتكلفة\nالمخرج 1: تحليل\nالمخرج 2: تحليل\n\nالحصة 4: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\nالمخرج 1: فهم\nالمخرج 2: تحليل\n\nالحصة 5: تمارين الدوال المتزايدة والمتناقصة\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 6: مراجعة الوحدة الثانية: المشتقة الأولى والميل\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\n\nالحصة 7: مراجعة الوحدة الثانية: معادلة المماس\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\n\nالحصة 9: مراجعة الوحدة الثانية (كتاب النشاط)\nالمخرج 1: تطبيق\nالمخرج 2: تقييم\n\nالحصة 10: ختام الوحدة الثانية ومسابقة الختام\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\nالتعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي\n\nالحصة 2: فترات التزايد والتناقص للدالة التربيعية\nالتعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات، التعلم التشاركي\n\nالحصة 3: تطبيقات حياتية: الربح والتكلفة\nالتعلم المبني على حل المشكلات، التعلم المبني على المشاريع، التعلم التعاوني\n\nالحصة 4: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\nالتعلم بالنمذجة، التعلم التعاوني، التعلم بالاكتشاف\n\nالحصة 5: تمارين الدوال المتزايدة والمتناقصة\nالتعلم الذاتي، جيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم المثال 9 (كتاب الطالب)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يحدد المعلم إشارة الميل لمنحنيات معروضة، وتحدد المجموعات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم أمثلة الدرس، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمرين 5-2 (1) ص 39 من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. عرض: تعرض المجموعات، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: فترات التزايد والتناقص للدالة التربيعية — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المثال 10 (كتاب الطالب) ويحل المتباينة، ويتابع الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تشاركي: يكلف الأزواج بتمرين 5-2 (2) ص 40 من كتاب النشاط، ويحل الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يتحقق المعلم في GeoGebra، ويتحقق الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم أمثلة على التحقق في فترة، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمرين 5-2 (3، 4) ص ⁦40–41⁩ من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. عرض: تعرض المجموعات، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: تطبيقات حياتية: الربح والتكلفة — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم مسألة ر(س) = −س² + 40س − 100، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. حل مشكلات تعاوني: يوزع المعلم مسائل مشابهة، وتحل وتفسر (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: تعرض المجموعات، ويفسر الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 4: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات — زمن الحصة 40 دقيقة\n1. النمذجة: يبني المعلم جدول إشارات المشتقة لـ ص = س² − 6س + 5 ويربطه بالمنحنى، ويتابع الطالب ويكمل الجدول (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يعطي كل مجموعة منحنى وجدولًا لاستنتاج فترات التزايد والتناقص، وتحدد المجموعات الفترات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحقق: يتحقق المعلم من النتائج في GeoGebra، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين الدوال المتزايدة والمتناقصة — زمن الحصة 40 دقيقة\n1. اختبار: يتابع، ويحل الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصحيح ذاتي: يعرض المعلم الإجابات، ويصحح الطالب (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. علاجي/إثرائي: يدعم المعلم ويثري، ويعالج الطالب أو يثري (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 6: مراجعة الوحدة الثانية: المشتقة الأولى والميل — زمن الحصة 40 دقيقة\n1. خريطة مفاهيم: يبني المعلم خريطة مفاهيم للوحدة، ويكمل الطالب (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تعاوني: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية (كتاب الطالب) (الجزء الأول)، ويحل الطالب (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مناقشة: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 7: مراجعة الوحدة الثانية: معادلة المماس — زمن الحصة 40 دقيقة\n1. تعاوني: يكلف المعلم بتمارين المراجعة الخاصة بالمماس، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. مناقشة: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تلخيص: يلخص المعلم خطوات معادلة المماس، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 8: مراجعة الوحدة الثانية: المشتقة الثانية والتزايد والتناقص — زمن الحصة 40 دقيقة\n1. تعاوني: يكلف المعلم بتمارين المراجعة الخاصة بالجزء الثاني، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. مناقشة: يناقش، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تلخيص: يلخص، والطلبة يدون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 9: مراجعة الوحدة الثانية (كتاب النشاط) — زمن الحصة 40 دقيقة\n1. كتاب النشاط: يكلف المعلم بتمارين مراجعة نهاية الوحدة الثانية ص ⁦42–43⁩ من كتاب النشاط، ويحل الطالب (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يعرض المعلم الحلول، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. مناقشة: يناقش المعلم التمارين الأصعب، ويناقش الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 10: ختام الوحدة الثانية ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: مراجعة شاملة، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – منحنى موسم الخريف: ترسم المجموعات منحنى تقريبيًا لأعداد زوار صلالة خلال العام، وتحدد فترات التزايد في موسم الخريف وفترات التناقص بعده وإشارة المشتقة الأولى في كل فترة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفهوم الدالة المتزايدة والمتناقصة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] إذا كان د′(س) > 0 في فترة فالدالة فيها:\nالإجابة النموذجية: متزايدة\n2) [مستوى التطبيق] هل ص = 3س + 1 متزايدة أم متناقصة؟\nالإجابة النموذجية: متزايدة (الميل 3 > 0)\n3) [مستوى الاستدلال] هل ص = 5 − 2س متزايدة أم متناقصة؟\nالإجابة النموذجية: متناقصة\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] هل ص = س² + 3س متزايدة أم متناقصة عند س = −1؟\nالإجابة النموذجية: الميل 1 > 0 ← متزايدة\n5) [مستوى التطبيق] هل ص = 12 − 7س + س² متزايدة عند س = 2؟\nالإجابة النموذجية: الميل −3 < 0 ← متناقصة\n6) [مستوى الاستدلال] هل ص = س³ − 3س متزايدة عند س = 0؟\nالإجابة النموذجية: الميل −3 ← متناقصة\n\nالحصة 2: فترات التزايد والتناقص للدالة التربيعية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] أوجد فترة تزايد ص = س² − 4س.\nالإجابة النموذجية: 2س − 4 > 0 ← س > 2\n2) [مستوى التطبيق] أوجد فترة تناقص ص = س² − 4س.\nالإجابة النموذجية: س < 2\n3) [مستوى الاستدلال] أوجد فترة تزايد ص = 5 + 6س − س².\nالإجابة النموذجية: 6 − 2س > 0 ← س < 3\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] هل ص = س² − 6س متزايدة في 4 < س < 7؟\nالإجابة النموذجية: نعم؛ 2س − 6 > 0 لكل س > 3\n5) [مستوى التطبيق] هل ص = 6س − س² متناقصة في 4 < س < 7؟\nالإجابة النموذجية: نعم؛ 6 − 2س < 0 لكل س > 3\n6) [مستوى الاستدلال] بيّن أن ص = س³ + 2س متزايدة لجميع س.\nالإجابة النموذجية: دص/دس = 3س² + 2 > 0 دائمًا\n\nالحصة 3: تطبيقات حياتية: الربح والتكلفة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] ر(س) = −س² + 40س − 100. متى يكون الربح متزايدًا؟\nالإجابة النموذجية: −2س + 40 > 0 ← س < 20\n2) [مستوى التطبيق] في المسألة نفسها، ما عدد السلع الذي يعطي أكبر ربح؟\nالإجابة النموذجية: 20 سلعة\n3) [مستوى الاستدلال] أوجد أكبر ربح.\nالإجابة النموذجية: ر(20) = 300\n\nالحصة 4: قراءة التزايد والتناقص من التمثيل البياني وجدول الإشارات\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] من جدول الإشارات: د′(س) < 0 عندما س < 3 و د′(س) > 0 عندما س > 3. صف الدالة.\nالإجابة النموذجية: متناقصة عندما س < 3 ومتزايدة عندما س > 3\n2) [مستوى التطبيق] أوجد فترة تزايد ص = س² − 6س + 5.\nالإجابة النموذجية: س > 3\n3) [مستوى الاستدلال] منحنى قطع مكافئ رأسه (−1، 4) ومفتوح للأسفل. أين يكون متزايدًا؟\nالإجابة النموذجية: س < −1\n\nالحصة 5: تمارين الد عد تحدث عشوائيًا (10 دقائق)\n2) يميز بين المتغير العشوائي المتقطع والمتصل بأمثلة (10 دقائق)\n3) يحدد القيم الممكنة لمتغير عشوائي متقطع في تجربة معطاة (10 دقائق)\n4) يحدد أصغر قيمة وأكبر قيمة والقيمة الأكثر احتمالًا (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالنمذجة، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، نماذج مجسمة، أخرى: قطع نقدية وأحجار نرد\nالكتاب، السبورة الذكية، أخرى: أحجار نرد ومربعات دوّارة", "المتغير العشوائي، المتغير المتقطع (المنفصل)، المتغير المتصل، القيم الممكنة، أصغر قيمة، أكبر قيمة، القيمة الأكثر احتمالًا", "تجربة صفية: يرمي كل طالب قطعة نقدية 3 مرات ويسجل عدد مرات ظهور الصورة. (5 دقائق)", "1. بناء المفهوم: يعرّف المعلم المتغير العشوائي المتقطع من نتائج التجربة ويقارنه بالمتصل (الطول، الزمن)، والطلبة يدون ويمثل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: يحل المعلم المثال 1 (كتاب الطالب)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يصنف المجموعات قائمة متغيرات إلى متقطعة ومتصلة، وتصنف وتبرر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم المثال 2 (كتاب الطالب) ويبني جدول نواتج حجري نرد، ويكمل الطالب الجدول (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمارين 1-3 (2، 3) ص 45 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. فردي: تمارين 1-3 (كتاب الطالب)، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عند رمي قطعة نقدية 3 مرات، ما القيم الممكنة لعدد مرات ظهور الصورة؟\nالإجابة النموذجية: 0، 1، 2، 3\n2) [مستوى التطبيق] هل عدد الطلاب الغائبين يوميًا متغير متقطع أم متصل؟\nالإجابة النموذجية: متقطع\n3) [مستوى الاستدلال] هل طول الطالب متغير متقطع؟ برر.\nالإجابة النموذجية: لا؛ متصل لأنه يأخذ أي قيمة ضمن مدى\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المع صورة. (5 دقائق)\n\nالحصة 2: متغيرات من تجارب متعددة المراحل\nمسألة كتاب النشاط: حجر نرد ذو 12 وجهًا عليه أرقام مكررة (ص 46). (5 دقائق)\n\nالحصة 3: المتغيرات الناتجة من عمليات على متغيرين\nسؤال: «إذا كان م ∈ {1، 2، 3} و ع ∈ {0، 1}، فما القيم الممكنة لـ م + ع؟» (5 دقائق)\n\nالحصة 4: تمثيل متغير عشوائي متقطع بمواقف حياتية\nيعرض أمثلة حياتية: عدد الأهداف في مباراة، عدد السيارات عند إشارة، عدد الرسائل اليومية. (5 دقائق)\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nسؤال «صح أم خطأ»: «زمن السباق متغير متقطع». (5 دقائق)", "الحصة 1: مفهوم المتغير العشوائي المتقطع — زمن الحصة 40 دقيقة\n1. بناء المفهوم: يعرّف المعلم المتغير العشوائي المتقطع من نتائج التجربة ويقارنه بالمتصل (الطول، الزمن)، والطلبة يدون ويمثل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. النمذجة: يحل المعلم المثال 1 (كتاب الطالب)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تعاوني: يصنف المجموعات قائمة متغيرات إلى متقطعة ومتصلة، وتصنف وتبرر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم المثال 2 (كتاب الطالب) ويبني جدول نواتج حجري نرد، ويكمل الطالب الجدول (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمارين 1-3 (2، 3) ص 45 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. فردي: تمارين 1-3 (كتاب الطالب)، ويحل الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: متغيرات من تجارب متعددة المراحل — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المسألة بجدول نواتج، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 1-3 (4) ص 46 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. عرض: يعرض المعلم الحلول، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: المتغيرات الناتجة من عمليات على متغيرين — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم أمثلة كتاب النشاط ص ⁦46–47⁩، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 1-3 (5) ص 47 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تمثيل متغير عشوائي متقطع بمواقف حياتية — زمن الحصة 40 دقيقة\n1. النمذجة: يحلل المعلم مثالًا حياتيًا ويحدد قيمه، ويتابع الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مشروع مصغر: تصوغ كل مجموعة متغيرين من بيئتها المدرسية وتحدد قيمهما، وتصوغ وتعرض (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض سريع، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين الدرس ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: يكلف المعلم بإكمال تمارين 1-3 ص ⁦44–47⁩ من كتاب النشاط، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – قارب أم شبكة؟: يعرض المعلم متغيرات من الحياة العمانية (عدد القوارب العائدة إلى الميناء، وزن الصيد، عدد النخيل، كمية الأمطار)، فيصنفها المتحدث المرقم إلى متقطعة أو متصلة مع التعليل (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] عند رمي قطعة نقدية 3 مرات، ما القيم الممكنة لعدد مرات ظهور الصورة؟\nالإجابة النموذجية: 0، 1، 2، 3\n2) [مستوى التطبيق] هل عدد الطلاب الغائبين يوميًا متغير متقطع أم متصل؟\nالإجابة النموذجية: متقطع\n3) [مستوى الاستدلال] هل طول الطالب متغير متقطع؟ برر.\nالإجابة النموذجية: لا؛ متصل لأنه يأخذ أي قيمة ضمن مدى\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] عند رمي حجري نرد، ما أصغر وأكبر قيمة لمجموع الرقمين؟\nالإجابة النموذجية: 2 و 12\n5) [مستوى التطبيق] ما القيمة الأكثر احتمالًا لمجموع الرقمين؟\nالإجابة النموذجية: 7\n6) [مستوى الاستدلال] س = الفرق المطلق بين رقمي حجري نرد. اكتب القيم الممكنة.\nالإجابة النموذجية: 0، 1، 2، 3، 4، 5\n\nالحصة 2: متغيرات من تجارب متعددة المراحل\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مربع دوّار مرقم 1، 2، 3 أُدير مرتين. ما القيم الممكنة لمجموع الناتجين؟\nالإجابة النموذجية: 2، 3، 4، 5، 6\n2) [مستوى التطبيق] في السؤال السابق ما عدد النواتج الكلية؟\nالإجابة النموذجية: 9\n3) [مستوى الاستدلال] ما القيمة الأكثر تكرارًا لمجموع الناتجين؟\nالإجابة النموذجية: 4\n\nالحصة 3: المتغيرات الناتجة من عمليات على متغيرين\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] م ∈ {1، 2، 3} و ع ∈ {0، 1}. ما القيم الممكنة لـ م + ع؟\nالإجابة النموذجية: 1، 2، 3، 4\n2) [مستوى التطبيق] للمتغيرين السابقين: ما الفرق بين أكبر قيمة لـ م وأصغر قيمة لـ ع؟\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] ما القيم الممكنة لـ م × ع؟\nالإجابة النموذجية: 0، 1، 2، 3\n\nالحصة 4: تمثيل متغير عشوائي متقطع بمواقف حياتية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] اقترح متغيرًا عشوائيًا متقطعًا من بيئة المدرسة.\nالإجابة النموذجية: مثل: عدد الطلاب المتأخرين يوميًا\n2) [مستوى التطبيق] ما القيم الممكنة لعدد البنات في أسرة لديها 3 أطفال؟\nالإجابة النموذجية: 0، 1، 2، 3\n3) [مستوى الاستدلال] لماذا يعد عدد الأهداف في مباراة متغيرًا متقطعًا؟\nالإجابة النموذجية: لأنه يأخذ قيمًا صحيحة قابلة للعد\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] هل زمن السباق متغير متقطع؟\nالإجابة النموذجية: لا؛ متصل\n2) [مستوى التطبيق] عند رمي 4 قطع نقدية، ما القيم الممكنة لعدد الصور؟\nالإجابة النموذجية: 0، 1، 2، 3، 4\n3) [مستوى الاستدلال] سُحبت كرتان من كيس فيه 3 حمراء و 2 زرقاء. ما القيم الممكنة لعدد الحمراء؟\nالإجابة النموذجية: 0، 1، 2", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما المقصود بالمتغير العشوائي المتقطع؟\nالإجابة النموذجية: متغير يأخذ قيمًا قابلة للعد تحدث عشوائيًا\n2) [مستوى التطبيق] عند رمي حجر نرد، ما القيم الممكنة للعدد الظاهر؟\nالإجابة النموذجية: 1، 2، 3، 4، 5، 6\n3) [مستوى الاستدلال] صنّف: زمن الوصول إلى المدرسة.\nالإجابة النموذجية: متصل\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] كم عدد القيم الممكنة لمجموع رقمي حجري نرد؟\nالإجابة النموذجية: 11\n5) [مستوى التطبيق] عند رمي قطعتين نقديتين، ما القيم الممكنة لعدد الكتابات؟\nالإجابة النموذجية: 0، 1، 2\n6) [مستوى الاستدلال] س = حاصل ضرب رقمي حجري نرد. ما أكبر قيمة؟\nالإجابة النموذجية: 36\n\nالحصة 2: متغيرات من تجارب متعددة المراحل\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] قطعة نقدية رُميت مرتين. اكتب فضاء العينة.\nالإجابة النموذجية: {ص ص، ص ك، ك ص، ك ك}\n2) [مستوى التطبيق] ما عدد النواتج عند رمي قطعة نقدية وحجر نرد معًا؟\nالإجابة النموذجية: 12\n3) [مستوى الاستدلال] رُمي حجر نرد مرتين و س = أكبر الرقمين. ما القيم الممكنة لـ س؟\nالإجابة النموذجية: 1، 2، 3، 4، 5، 6\n\nالحصة 3: المتغيرات الناتجة من عمليات على متغيرين\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] م ∈ {2، 4} و ع ∈ {1، 3}. ما القيم الممكنة لـ م + ع؟\nالإجابة النموذجية: 3، 5، 7\n2) [مستوى التطبيق] للمتغيرين السابقين ما أكبر قيمة لـ م − ع؟\nالإجابة النموذجية: 3\n3) [مستوى الاستدلال] للمتغيرين السابقين ما أصغر قيمة لـ م − ع؟\nالإجابة النموذجية: −1\n\nالحصة 4: تمثيل متغير عشوائي متقطع بمواقف حياتية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل عدد السيارات عند الإشارة متقطع؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] هل كتلة حقيبة الطالب متغير متقطع؟\nالإجابة النموذجية: لا؛ متصل\n3) [مستوى الاستدلال] ما القيم الممكنة لعدد الإجابات الصحيحة في اختبار من 5 أسئلة؟\nالإجابة النموذجية: 0، 1، 2، 3، 4، 5\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] هل عدد الطلاب في الصف متغير متقطع؟\nالإجابة النموذجية: نعم\n2) [مستوى التطبيق] رُمي حجر نرد. ما أصغر قيمة ممكنة؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] س = عدد الأرقام الزوجية عند رمي حجري نرد. ما القيم الممكنة؟\nالإجابة النموذجية: 0، 1، 2", "الحصة 1: مفهوم المتغير العشوائي المتقطع\nإرشاد للطالب: مراجعة المثال 1 (كتاب الطالب)، وحل تمارين 1-3 (1) ص 44 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمارين 1-3 (2، 3) ص 45 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=11\n\nالحصة 2: متغيرات من تجارب متعددة المراحل\nإرشاد للطالب: حل تمرين 1-3 (4) ص 46 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=11\n\nالحصة 3: المتغيرات الناتجة من عمليات على متغيرين\nإرشاد للطالب: حل تمرين 1-3 (5) ص 47 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=11\n\nالحصة 4: تمثيل متغير عشوائي متقطع بمواقف حياتية\nإرشاد للطالب: كتابة 3 أمثلة لمتغيرات عشوائية متقطعة من الحياة اليومية.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=11\n\nالحصة 5: تمارين الدرس ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس التوزيع الاحتمالي.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=11"]}, {"id": "2-3", "title": "التوزيع الاحتمالي للمتغير العشوائي المتقطع", "unit": "الوحدة الثالثة: المتغيرات العشوائية المتقطعة (المنفصلة)", "sbp": "الأمثلة ⁦3–5⁩، تمارين 2-3", "wbp": "⁦48–50⁩", "p": [{"t": "مفهوم التوزيع الاحتمالي وخصائصه + إيجاد : التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مربع دوّار مرقم ⁦1–4⁩ أُدير مرتين. ما ل(المجموع = 5)؟\nالإجابة النموذجية: 4/16 = 1/4\n2) [مستوى التطبيق] ما ل(المجموع = 2)؟\nالإجابة النموذجية: 1/16\n3) [مستوى الاستدلال] ما احتمال أن يكون المجموع عددًا زوجيًا؟\nالإجابة النموذجية: 8/16 = 1/2", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] رُمي حجر نرد. ما ل(س = 4)؟\nالإجابة النموذجية: 1/6\n2) [مستوى التطبيق] رُمي حجرا نرد. ما ل(المجموع = 7)؟\nالإجابة النموذجية: 6/36 = 1/6\n3) [مستوى الاستدلال] رُمي حجرا نرد. ما ل(المجموع = 12)؟\nالإجابة النموذجية: 1/36", "إرشاد للطالب: حل تمرين 2-3 (3، 4) ص 50 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12"]}, {"t": "تفسير جداول التوزيع في مواقف حياتية", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يقرأ ويفسر جدول توزيع احتمالي لموقف حياتي (25 دقيقة)\n2) يتخذ قرارًا بسيطًا بناءً على الاحتمالات (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تقييم", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية", "التفسير، القرار، الاحتمال في الحياة", "جدول: عدد أيام المطر في الأسبوع واحتمالاتها. «ما احتمال أكثر من يومين ممطرين؟» (5 دقائق)", "1. النمذجة: يحسب المعلم ويفسر احتمالات من الجدول، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات: يوزع المعلم جداول حياتية على المجموعات، وتحسب وتفسر (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول عدد الرسائل اليومية: 0، 1، 2، 3 باحتمالات 0.2، 0.4، 0.3، 0.1. ما ل(رسالة واحدة على الأقل)؟\nالإجابة النموذجية: 0.8\n2) [مستوى التطبيق] ما القيمة الأكثر احتمالًا؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] ما احتمال أكثر من رسالة؟\nالإجابة النموذجية: 0.4", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ل(س = 0) في الجدول السابق؟\nالإجابة النموذجية: 0.2\n2) [مستوى التطبيق] ما ل(س ≤ 1)؟\nالإجابة النموذجية: 0.6\n3) [مستوى الاستدلال] ما ل(س = 3)؟\nالإجابة النموذجية: 0.1", "إرشاد للطالب: إكمال تمارين 2-3 من كتاب النشاط ص ⁦48–50⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12"]}, {"t": "تمارين التوزيع الاحتمالي ومسابقة الختام", "w": "الأسبوع الرابع عشر (⁦6–10/12/2026⁩م)", "f": ["1) يطبق مهارات الدرس (20 دقيقة)\n2) يتعاون مع مجموعته في التنافس العلمي (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "التوزيع الاحتمالي", "سؤال «صحح الخطأ»: كتب طالب ل(س ≥ 3) = ل(س = 3) فقط في توزيع قيمه ⁦1–4⁩. (5 دقائق)", "1. تعاوني: مراجعة شاملة لتمارين 2-3 (كتاب الطالب)، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – عجلة المحافظات: تصمم المجموعات عجلة دوارة مقسمة إلى أجزاء بأسماء محافظات عمانية، وتكتب جدول التوزيع الاحتمالي لها وتتحقق أن مجموع الاحتمالات يساوي 1 (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول: 0.2، 0.2، ك، 0.1. أوجد ك.\nالإجابة النموذجية: 0.5\n2) [مستوى التطبيق] ل(س) = ك(س + 1) حيث س = 0، 1، 2. أوجد ك.\nالإجابة النموذجية: 6ك = 1 ← ك = 1/6\n3) [مستوى الاستدلال] للتوزيع ل(س) = (س + 1)/6 حيث س = 0، 1، 2، أوجد ل(س ≥ 1).\nالإجابة النموذجية: 2/6 + 3/6 = 5/6", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما مجموع احتمالات أي توزيع؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] جدول: ك، ك، 2ك. أوجد ك.\nالإجابة ال حتمالي وخصائصه — زمن الحصة 40 دقيقة\n1. بناء المفهوم: يبني المعلم جدول التوزيع لعدد الصور في 3 رميات ويستخلص الخاصيتين، ويكمل الطالب الجدول (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. النمذجة: يحل المعلم المثال 3 (كتاب الطالب)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تعاوني: يتحقق المعلم من صحة جداول معروضة (هل تمثل توزيعًا احتماليًا؟)، وتحكم المجموعات وتبرر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: يحل المعلم المثال 4 (كتاب الطالب) ومثالًا على ل(س) = ك س، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمرين 2-3 (2) ص 49 من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. عرض: تعرض المجموعات، ويعرض الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: حساب احتمالات من جدول التوزيع — زمن الحصة 40 دقيقة\n1. النمذجة: يحل المعلم المثال 5 (كتاب الطالب) ويحسب احتمالات متنوعة، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. تشاركي: يكلف الأزواج بتمرين 2-3 (1) ص 48 من كتاب النشاط، ويحل الطالب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصويب: يناقش المعلم أخطاء المتباينات، ويصحح الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: بناء جدول التوزيع الاحتمالي من تجربة — زمن الحصة 40 دقيقة\n1. النمذجة: يبني المعلم جدول التوزيع لمجموع ناتجي المربع الدوّار، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 2-3 (3، 4) ص 50 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحقق: يتحقق المعلم من مجموع الاحتمالات، ويتحقق الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تفسير جداول التوزيع في مواقف حياتية — زمن الحصة 40 دقيقة\n1. النمذجة: يحسب المعلم ويفسر احتمالات من الجدول، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. حل مشكلات: يوزع المعلم جداول حياتية على المجموعات، وتحسب وتفسر (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 5: تمارين التوزيع الاحتمالي ومسابقة الختام — زمن الحصة 40 دقيقة\n1. تعاوني: مراجعة شاملة لتمارين 2-3 (كتاب الطالب)، ويحل الطالب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصويب: يناقش، ويصحح الطالب (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. غلق الدرس – عجلة المحافظات: تصمم المجموعات عجلة دوارة مقسمة إلى أجزاء بأسماء محافظات عمانية، وتكتب جدول التوزيع الاحتمالي لها وتتحقق أن مجموع الاحتمالات يساوي 1 (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مفهوم التوزيع الاحتمالي وخصائصه\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] في رمي 3 قطع نقدية، ما ل(س = 2) حيث س عدد الصور؟\nالإجابة النموذجية: 3/8\n2) [مستوى التطبيق] ما مجموع الاحتمالات في أي توزيع احتمالي؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] هل الجدول ل(س) = 0.3، 0.5، 0.4 يمثل توزيعًا احتماليًا؟ برر.\nالإجابة النموذجية: لا؛ المجموع 1.2 ≠ 1\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] جدول احتمالات: 0.1، 0.3، ك، 0.2. أوجد ك.\nالإجابة النموذجية: ك = 0.4\n5) [مستوى التطبيق] ل(س) = ك س حيث س = 1، 2، 3، 4. أوجد ك.\nالإجابة النموذجية: 10ك = 1 ← ك = 0.1\n6) [مستوى الاستدلال] ل(س) = ك س² حيث س = 1، 2، 3. أوجد ك.\nالإجابة النموذجية: 14ك = 1 ← ك = 1/14\n\nالحصة 2: حساب احتمالات من جدول التوزيع\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ل(س ≤ 2).\nالإجابة النموذجية: 0.4\n2) [مستوى التطبيق] للتوزيع نفسه أوجد ل(س > 1).\nالإجابة النموذجية: 1 − 0.1 = 0.9\n3) [مستوى الاستدلال] للتوزيع نفسه أوجد ل(2 < س ≤ 4).\nالإجابة النموذجية: 0.4 + 0.2 = 0.6\n\nالحصة 3: بناء جدول التوزيع الاحتمالي من تجربة\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] مربع دوّار مرقم ⁦1–4⁩ أُدير مرتين. ما ل(المجموع = 5)؟\nالإجابة النموذجية: 4/16 = 1/4\n2) [مستوى التطبيق] ما ل(المجموع = 2)؟\nالإجابة النموذجية: 1/16\n3) [مستوى الاستدلال] ما احتمال أن يكون المجموع عددًا زوجيًا؟\nالإجابة النموذجية: 8/16 = 1/2\n\nالحصة 4: تفسير جداول التوزيع في مواقف حياتية\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول عدد الرسائل اليومية: 0، 1، 2، 3 باحتمالات 0.2، 0.4، 0.3، 0.1. ما ل(رسالة واحدة على الأقل)؟\nالإجابة النموذجية: 0.8\n2) [مستوى التطبيق] ما القيمة الأكثر احتمالًا؟\nالإجابة النموذجية: 1\n3) [مستوى الاستدلال] ما احتمال أكثر من رسالة؟\nالإجابة النموذجية: 0.4\n\nالحصة 5: تمارين التوزيع الاحتمالي ومسابقة الختام\nتفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] جدول: 0.2، 0.2، ك، 0.1. أوجد ك.\nالإجابة النموذجية: 0.5\n2) [مستوى التطبيق] ل(س) = ك(س + 1) حيث س = 0، 1، 2. أوجد ك.\nالإجابة النموذجية: 6ك = 1 ← ك = 1/6\n3) [مستوى الاستدلال] للتوزيع ل(س) = (س + 1)/6 حيث س = 0، 1، 2، أوجد ل(س ≥ 1).\nالإجابة النموذجية: 2/6 + 3/6 = 5/6", "الحصة 1: مفهوم التوزيع الاحتمالي وخصائصه\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] في رمي 3 قطع نقدية، ما ل(س = 0)؟\nالإجابة النموذجية: 1/8\n2) [مستوى التطبيق] هل يمكن أن يكون الاحتمال −0.2؟\nالإجابة النموذجية: لا\n3) [مستوى الاستدلال] أكمل: ل(س = 3) في رمي 3 قطع نقدية = ......\nالإجابة النموذجية: 1/8\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] جدول احتمالات: 0.25، أ، 0.5. أوجد أ.\nالإجابة النموذجية: 0.25\n5) [مستوى التطبيق] جدول احتمالات: 2ك، 3ك، 5ك. أوجد ك.\nالإجابة النموذجية: ك = 0.1\n6) [مستوى الاستدلال] ل(س) = ك حيث س = 1، 2، 3، 4، 5. أوجد ك.\nالإجابة النموذجية: ك = 0.2\n\nالحصة 2: حساب احتمالات من جدول التوزيع\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] للتوزيع نفسه أوجد ل(س = 3).\nالإجابة النموذجية: 0.4\n2) [مستوى التطبيق] أوجد ل(س < 3).\nالإجابة النموذجية: 0.4\n3) [مستوى الاستدلال] أوجد ل(س ≥ 2).\nالإجابة النموذجية: 0.9\n\nالحصة 3: بناء جدول التوزيع الاحتمالي من تجربة\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] رُمي حجر نرد. ما ل(س = 4)؟\nالإجابة النموذجية: 1/6\n2) [مستوى التطبيق] رُمي حجرا نرد. ما ل(المجموع = 7)؟\nالإجابة النموذجية: 6/36 = 1/6\n3) [مستوى الاستدلال] رُمي حجرا نرد. ما ل(المجموع = 12)؟\nالإجابة النموذجية: 1/36\n\nالحصة 4: تفسير جداول التوزيع في مواقف حياتية\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما ل(س = 0) في الجدول السابق؟\nالإجابة النموذجية: 0.2\n2) [مستوى التطبيق] ما ل(س ≤ 1)؟\nالإجابة النموذجية: 0.6\n3) [مستوى الاستدلال] ما ل(س = 3)؟\nالإجابة النموذجية: 0.1\n\nالحصة 5: تمارين التوزيع الاحتمالي ومسابقة الختام\nأسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما مجموع احتمالات أي توزيع؟\nالإجابة النموذجية: 1\n2) [مستوى التطبيق] جدول: ك، ك، 2ك. أوجد ك.\nالإجابة النموذجية: 0.25\n3) [مستوى الاستدلال] رُمي حجر نرد. ما ل(س > 4)؟\nالإجابة النموذجية: 1/3", "الحصة 1: مفهوم التوزيع الاحتمالي وخصائصه\nإرشاد للطالب: مراجعة المثال 3 (كتاب الطالب)، وحل تمارين 2-3 (1) ص 48 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 2-3 (2) ص 49 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12\n\nالحصة 2: حساب احتمالات من جدول التوزيع\nإرشاد للطالب: حل تمرين 2-3 (1) ص 48 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12\n\nالحصة 3: بناء جدول التوزيع الاحتمالي من تجربة\nإرشاد للطالب: حل تمرين 2-3 (3، 4) ص 50 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12\n\nالحصة 4: تفسير جداول التوزيع في مواقف حياتية\nإرشاد للطالب: إكمال تمارين 2-3 من كتاب النشاط ص ⁦48–50⁩.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12\n\nالحصة 5: تمارين التوزيع الاحتمالي ومسابقة الختام\nإرشاد للطالب: الاستعداد لدرس القيمة المتوقعة والتباين.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=12"]}, {"id": "3-3", "title": "القيمة المتوقعة والتباين للمتغير العشوائي المتقطع", "unit": "الوحدة الثالثة: المتغيرات العشوائية المتقطعة (المنفصلة)", "sbp": "المثالان 6، 7، تمارين 3-3، مراجعة الوحدة", "wbp": "⁦51–56⁩", "p": [{"t": "القيمة المتوقعة ت(س) + التباين والانحراف المعياري", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يحسب القيمة المتوقعة ت(س) = مجموع س × ل(س) (10 دقائق)\n2) يفسر القيمة المتوقعة بوصفها الوسط الحسابي على المدى الطويل (10 دقائق)\n3) يحسب التباين ع²(س) = مجموع س² ل(س) − (ت(س))² (15 دقيقة)\n4) يحسب الانحراف المعياري ع(س) ويفسره مقياسًا لانتشار القيم (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، عروض تقديمية، أخرى: الآلة الحاسبة العلمية", "القيمة المتوقعة ت(س)، الوسط الحسابي على المدى الطويل، التباين ع²(س)، الانحراف المعياري ع(س)، ت(س²)، الانتشار", "سؤال: «إذا رميت حجر نرد مرات كثيرة جدًا، فما متوسط الأرقام الظاهرة الذي تتوقعه؟» (5 دقائق)", "1. النمذجة: يعرض المعلم شرائح «القيمة المتوقعة والتباين» من دليل المعلم ويحل المثال 6 (كتاب الطالب)، ويتابع الطالب ويكمل عمود س ل(س) (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (1) ص 51 من كتاب النشاط، وتحل المجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحقق: يقارن الطلبة القيمة المتوقعة لحجر النرد بنتائج تجربة صفية، ويقارن الطالب (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. النمذجة: يحل المعلم المثال 7 (كتاب الطالب) بجدول من أعمدة: س، ل(س)، س ل(س)، س² ل(س)، ويتابع الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تعاوني: يكلف المعلم بتمرين 3-3 (2) ص 52 من كتاب النشاط، وتحل المجموعات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. تصويب: يناقش المعلم الخطأ الشائع (نسيان تربيع ت(س))، ويصحح الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] س: 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2. أوجد ت(س).\nالإجابة النموذجية: 0.1 + 0.6 + 1.2 + 0.8 = 2.7\n2) [مستوى التطبيق] أوجد ت(س) لرمي حجر نرد منتظم.\nالإجابة النموذجية: 3.5\n3) [مستوى الاستدلال] أوجد ت(س) لعدد الصور في رمي 3 قطع نقدية.\nالإجابة النموذجية: 1.5\n\nتفريد التعليم (5 دقائق):\n4) [مستوى المعرفة] للتوزيع 1، 2، 3، 4 باحتمالات 0.1، 0.3، 0.4، 0.2 أوجد ت(س²).\nالإجابة النموذجية: 0.1 + 1.2 + 3.6 + 3.2 = 8.1\n5) [مستوى التطبيق] أوجد التباين ع²(س) للتوزيع نفسه.\nالإجابة النموذجية: 8.1 − 2.7² = 0.81\n6) [مستوى الاستدلال] أوجد الانحراف المعياري.\nالإجابة النموذجية: 0.9", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] ما رمز القيمة المتوقعة؟\nالإجابة النموذجية: ت(س)\n2) [مستوى التطبيق] س: 0، 1 باحتمالين 0.5، 0.5. أوجد ت(س).\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] س: 2، 4، 6 باحتمالات 0.2، 0.5، 0.3. أوجد ت(س).\nالإجابة النموذجية: 0.4 + 2 + 1.8 = 4.2\n\nأسئلة التقويم الختامي (5 دقائق):\n4) [مستوى المعرفة] ما العلاقة بين التباين والانحراف المعياري؟\nالإجابة النموذجية: الانحراف المعياري = الجذر التربيعي للتباين\n5) [مستوى التطبيق] لعدد الصور في 3 رميات: ت(س) = 1.5 و ت(س²) = 3. أوجد التباين.\nالإجابة النموذجية: 3 − 2.25 = 0.75\n6) [مستوى الاستدلال] إذا كان التباين 0.64 فما الانحراف المعياري؟\nالإجابة النموذجية: 0.8", "إرشاد للطالب: مراجعة المثال 6 (كتاب الطالب)، وحل تمرين 3-3 (1) ص 51 من كتاب النشاط.\nإرشاد لولي الأمر: متابعة إنجاز الواجب في موعده، ومراجعة دفتر الطالب والتأكد من كتابة خطوات الحل كاملة، والتواصل مع المعلم عند ملاحظة صعوبة.\nإرشاد للطالب: حل تمرين 3-3 (2) ص 52 من كتاب النشاط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/basicmath/?l=13"]}, {"t": "إيجاد مجاهيل بمعلومية القيمة المتوقعة", "w": "الأسبوع الخامس عشر (⁦13–17/12/2026⁩م)", "f": ["1) يجد احتمالات أو قيمًا مجهولة بمعلومية مجموع الاحتمالات والقيمة المتوقعة (25 دقيقة)\n2) يحل نظام معادلتين خطيتين ناتجًا من شرطي التوزيع (15 دقيقة)", "المخرج 1: تحليل\nالمخرج 2: تطبيق", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم بالنمذجة", "الكتاب، السبورة الذكية، الأقلام", "معادلتا مجموع الاحتمالات والقيمة المتوقعة، المجاهيل", "سؤال: «جدول احتمالاته أ، ب، 0.4 لقيم 1، 2، 3 و ت(س) = 2.2. كيف نجد أ، ب؟» (5 دقائق)", "1. النمذجة: يحل المعلم المسألة: أ + ب = 0.6، أ + 2ب + 1.2 = 2.2، ويتابع الطالب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعاوني: يكلف المعلم بتمرين 3-3 (3) ص 52 من كتاب النشاط، وتحل المجموعات (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. عرض: تعرض المجموعات، ويعرض الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: يطرح المعلم أسئلة التقويم الختامي ويلخص أهم الأفكار، ويجيب الطالب فرديًا ويصحح ذاتيًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1) [مستوى المعرفة] قيم 1، 2، 3 باحتمالات أ، ب، 0.4 و ت(س) = 2.2. أوجد أ، ب.\nالإجابة النموذجية: أ + ب = 0.6 و أ + 2ب = 1 ← ب = 0.4، أ = 0.2\n2) [مستوى التطبيق] قيم 0، 1، 2 باحتمالات 0.3، ك، 0.5. أوجد ك ثم ت(س).\nالإجابة النموذجية: ك = 0.2؛ ت(س) = 0.2 + 1 = 1.2\n3) [مستوى الاستدلال] قيم 1، 2 باحتمالين ل، 1 − ل و ت(س) = 1.7. أوجد ل.\nالإجابة النموذجية: ل + 2 − 2ل = 1.7 ← ل = 0.3", "أسئلة التقويم الختامي (5 دقائق):\n1) [مستوى المعرفة] قيم 0، 10 باحتمالين متساويين. أوجد ت(س).\nالإجابة النموذجية: 5\n2) [مستوى التطبيق] قيم 1، 3 باحتمالين ل، 1 − ل و ت(س) = 2. أوجد ل.\nالإجابة النموذجية: 0.5\n3) [مستوى الاستدلال] قيم 2، 5 باحتمالين 0.4، 0.6. أوجد ت(س).\n
