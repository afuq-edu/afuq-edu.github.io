 const n=$('names');n.innerHTML='';for(let i=0;i<S.g;i++){const w=document.createElement('div');w.className='nm';const d=document.createElement('span');d.className='dot';d.style.background=COLORS[i];const inp=document.createElement('input');inp.type='text';inp.value=S.names[i];inp.maxLength=24;inp.oninput=()=>{S.names[i]=inp.value;};w.appendChild(d);w.appendChild(inp);n.appendChild(w);}}
$('qn').oninput=e=>{S.n=+e.target.value;$('qnv').textContent=S.n;};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{S.n=+b.dataset.v;$('qn').value=S.n;$('qnv').textContent=S.n;});
$('mRot').onclick=()=>{S.mode='rot';$('mRot').classList.add('on');$('mPick').classList.remove('on');};
$('mPick').onclick=()=>{S.mode='pick';$('mPick').classList.add('on');$('mRot').classList.remove('on');};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQs(){const L=DATA.lessons[S.li],p=S.pi+1;const byD=arr=>{const r=[];[1,2,3].forEach(d=>r.push(...shuffle(arr.filter(q=>q.d===d))));return r;};
 const own=byD(L.qs.filter(q=>q.p===p));let others=L.qs.filter(q=>q.p!==p);others=shuffle(others).sort((a,b)=>Math.abs(a.p-p)-Math.abs(b.p-p));
 let sel=own.slice(0,S.n);for(const q of others){if(sel.length>=S.n)break;sel.push(q);}
 return sel.map((q,i)=>({...q,_i:i})).sort((a,b)=>a.d-b.d||a._i-b._i);}
$('start').onclick=startGame;$('again').onclick=startGame;$('setup2').onclick=()=>show('sSetup');
function startGame(){ac();G=[];for(let i=0;i<S.g;i++)G.push({name:(S.names[i]||DEF[i]).trim()||DEF[i],c:COLORS[i],s:0});Q=pickQs();qi=0;turn=0;nextQ();}
function nextQ(){if(qi>=Q.length){return endGame();}if(S.mode==='pick'){const p=$('picker');p.innerHTML='';$('pkInfo').textContent='السؤال '+(qi+1)+' من '+Q.length;G.forEach((g,i)=>{const b=document.createElement('button');b.style.borderColor=g.c;const d=document.createElement('span');d.className='dot';d.style.background=g.c;b.appendChild(d);b.appendChild(document.createTextNode(g.name));b.onclick=()=>{turn=i;askQ();};p.appendChild(b);});show('sPick');}else{turn=qi%G.length;askQ();}}
const SH=['●','■','▲','◆'];
function askQ(){const q=Q[qi],L=DATA.lessons[S.li];locked=false;$('qcount').textContent='السؤال '+(qi+1)+' من '+Q.length;$('qper').textContent='الحصة '+q.p+': '+L.ax[q.p-1];
 const g=G[turn];$('turn').innerHTML='';const d=document.createElement('span');d.className='dot';d.style.background=g.c;$('turn').appendChild(d);$('turn').appendChild(document.createTextNode('دور: '+g.name));$('turn').style.borderColor=g.c;
 const tt={mc:'اختيار من متعدد',tf:'صواب أم خطأ؟',fill:'أكمل الفراغ'}[q.t];$('qtype').innerHTML='';$('qtype').appendChild(document.createTextNode(tt+' '));const lv=document.createElement('span');lv.className='lvl';for(let i=1;i<=3;i++){const x=document.createElement('i');if(i<=q.d)x.className='f';lv.appendChild(x);}$('qtype').appendChild(lv);
 const qt=$('qtext');qt.innerHTML='';if(q.t==='fill'){const parts=q.q.split('____');qt.appendChild(document.createTextNode(parts[0]));const bl=document.createElement('span');bl.className='blank';bl.id='blank';bl.textContent='؟';qt.appendChild(bl);qt.appendChild(document.createTextNode(parts.slice(1).join('____')));}else qt.textContent=q.q;
 const o=$('opts');o.innerHTML='';let opts=q.t==='tf'?[{x:'صواب',v:true,c:'tfo',s:'✓'},{x:'خطأ',v:false,c:'tfx',s:'✗'}]:shuffle(q.o.map((x,i)=>({x,v:i}))).map((o,k)=>({x:o.x,v:o.v,c:'o'+(k%4),s:SH[k%4]}));
 opts.forEach((op,k)=>{const b=document.createElement('button');b.className='opt '+op.c;const sh=document.createElement('span');sh.className='sh';sh.textContent=op.s;b.appendChild(sh);b.appendChild(document.createTextNode(op.x));b.onclick=()=>answer(op.v,b);b.dataset.v=String(op.v);o.appendChild(b);});
 $('fb').textContent='';$('toRes').style.display='none';$('reveal').style.display='';show('sQ');startTimer();}
function pointsAt(t){if(t<=30)return Math.round(1000-500*t/30);return Math.max(100,Math.round(500-400*(t-30)/30));}
let lastSec=-1;
function startTimer(){t0=performance.now();lastSec=-1;$('ov').textContent='';const arc=$('arc');arc.style.stroke='var(--acc)';cancelAnimationFrame(raf);
 const loop=()=>{const t=(performance.now()-t0)/1000;const rem=Math.max(0,30-t);arc.setAttribute('stroke-dashoffset',String(402.1*(1-rem/30)));
  if(t<=30){const s=Math.ceil(rem);$('sec').textContent=s;if(s<=5&&s!==lastSec&&s>0){snd.tick();}lastSec=s;}else{arc.style.stroke='#E3B65C';arc.setAttribute('stroke-dashoffset','0');$('sec').textContent='+'+Math.floor(t-30);$('ov').textContent='وقت إضافي: النقاط تتناقص';}
  $('pts').textContent=pointsAt(t)+' نقطة';raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);}
function stopTimer(){cancelAnimationFrame(raf);}
function correctVal(q){return q.t==='tf'?String(q.a):String(q.a);}
function answer(v,btn){if(locked)return;locked=true;stopTimer();const q=Q[qi];const t=(performance.now()-t0)/1000;const ok=String(v)===correctVal(q);
 const btns=[...document.querySelectorAll('#opts .opt')];btns.forEach(b=>{b.disabled=true;if(b.dataset.v===correctVal(q))b.classList.add('ok');else if(b!==btn)b.classList.add('dim');});
 if(q.t==='fill'){$('blank').textContent=q.o[q.a];}
 if(ok){const p=pointsAt(t);G[turn].s+=p;lastGain=p;lastWho=turn;$('fb').style.color='#3E9A63';$('fb').textContent='إجابة صحيحة! +'+p+' نقطة لـ '+G[turn].name;snd.ok();}
 else{btn.classList.add('bad');lastGain=0;lastWho=-1;$('fb').style.color='#C0606E';$('fb').textContent='إجابة غير صحيحة؛ لا نقاط هذه المرة.';snd.bad();}
 $('reveal').style.display='none';$('toRes').style.display='';}
$('reveal').onclick=()=>{if(locked)return;locked=true;stopTimer();const q=Q[qi];document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;if(b.dataset.v===correctVal(q))b.classList.add('ok');else b.classList.add('dim');});if(q.t==='fill')$('blank').textContent=q.o[q.a];lastGain=0;lastWho=-1;$('fb').style.color='var(--mut)';$('fb').textContent='كُشفت الإجابة دون احتساب نقاط.';$('reveal').style.display='none';$('toRes').style.display='';};
$('toRes').onclick=showRes;
function ranks(){const sorted=G.map((g,i)=>({i,s:g.s})).sort((a,b)=>b.s-a.s);const r=[];let prev=null,rank=0;sorted.forEach((x,k)=>{if(x.s!==prev){rank=k+1;prev=x.s;}r[x.i]=rank;});return r;}
function showRes(){const max=Math.max(1000,...G.map(g=>g.s));const rk=ranks();const ch=$('chart'),nm=$('names2');ch.innerHTML='';nm.innerHTML='';
 $('rTitle').textContent='الترتيب بعد السؤال '+(qi+1);$('rSub').textContent=lastWho>=0?('الفائزة بهذا السؤال: '+G[lastWho].name):'لم تُحسب نقاط في هذا السؤال';
 G.forEach((g,i)=>{const c=document.createElement('div');c.className='col'+(i===lastWho?' win':'');const b=document.createElement('div');b.className='bar';b.style.background='linear-gradient(180deg,'+g.c+'cc,'+g.c+')';
  const sc=document.createElement('div');sc.className='sc';sc.textContent=g.s;b.appendChild(sc);const pl=document.createElement('div');pl.className='plus';pl.textContent='+'+(i===lastWho?lastGain:0);b.appendChild(pl);c.appendChild(b);ch.appendChild(c);
  const n=document.createElement('div');n.textContent=g.name;const r=document.createElement('span');r.className='rkb';r.textContent='المركز '+rk[i];n.appendChild(r);nm.appendChild(n);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=Math.max(4,Math.round(270*g.s/max))+'px';}));});
 $('next').textContent=qi+1>=Q.length?'إعلان النتائج':'السؤال التالي';show('sRes');snd.bars();}
$('next').onclick=()=>{qi++;nextQ();};
function endGame(){stopTimer();const order=G.map((g,i)=>({...g,i})).sort((a,b)=>b.s-a.s);const pod=$('pod');pod.innerHTML='';
 const slots=[1,0,2].filter(k=>k<order.length);const H={0:250,1:185,2:135};const M=['🥇','🥈','🥉'];
 slots.forEach(k=>{const g=order[k];const c=document.createElement('div');c.className='pc';const m=document.createElement('div');m.className='medal';m.textContent=M[k];const w=document.createElement('div');w.className='who';w.textContent=g.name;const v=document.createElement('div');v.className='pv';v.textContent=g.s+' نقطة';
  const b=document.createElement('div');b.className='blk';b.style.background='linear-gradient(180deg,'+g.c+'bb,'+g.c+')';b.textContent=k+1;c.appendChild(m);c.appendChild(w);c.appendChild(v);c.appendChild(b);pod.appendChild(c);requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.height=H[k]+'px';}));});
 const rest=$('rest');rest.innerHTML='';order.slice(3).forEach((g,k)=>{const s=document.createElement('span');s.textContent=(k+4)+'. '+g.name+' ('+g.s+')';rest.appendChild(s);});
 $('endSub').textContent=DATA.lessons[S.li].t;show('sEnd');snd.win();confetti();}
function confetti(){const cv=$('cf'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const P=[];for(let i=0;i<90;i++)P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*0.6,r:3+Math.random()*4,vy:0.6+Math.random()*1.1,vx:-0.4+Math.random()*0.8,c:COLORS[i%6],a:Math.random()*6});
 const t0=performance.now();(function f(){const t=performance.now()-t0;x.clearRect(0,0,cv.width,cv.height);x.globalAlpha=t<4500?0.85:Math.max(0,0.85-(t-4500)/1500);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((p.y+p.a*40)/50)*0.3;x.fillStyle=p.c;x.beginPath();x.ellipse(p.x,p.y,p.r,p.r*0.6,p.a,0,7);x.fill();});if(t<6000)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height);})();}
document.addEventListener('keydown',e=>{if($('sQ').classList.contains('on')&&!locked){const k=parseInt(e.key,10);const b=[...document.querySelectorAll('#opts .opt')];if(k>=1&&k<=b.length)b[k-1].click();}else if(e.key==='Enter'){if($('sQ').classList.contains('on')&&locked)$('toRes').click();else if($('sRes').classList.contains('on'))$('next').click();}});
buildLessons();buildAxes();buildGroups();
</script></body></html>
