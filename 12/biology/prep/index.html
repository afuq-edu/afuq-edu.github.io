قنوات ‎K⁺‎ المبوبة بالجهد وخروج ‎K⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا ينشأ جهد فعل جديد خلال فترة الجموح؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن قنوات ‎Na⁺‎ تكون مغلقة وغير قابلة للفتح مؤقتًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقصود بمبدأ الكل أو لا شيء؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إذا بلغ المنبه العتبة نشأ جهد فعل كامل بالقيمة نفسها، وإن لم يبلغها لا ينشأ جهد فعل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف يدل الجهاز العصبي على شدة المنبه إذا كانت جهود الفعل متساوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بزيادة تكرار جهود الفعل (عددها في الثانية).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اشرح أهمية فترة الجموح لاتجاه انتقال النبضة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تمنع الجزء الذي مرت به النبضة من إعادة إزالة الاستقطاب فورًا، فتنتقل النبضة في اتجاه واحد إلى الأمام.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 5-1 ص 122 ورسم تمثيل جهد الفعل وعنونته<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على شرح مراحل جهد الفعل بالترتيب مستعينًا بالرسم<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23<\/p>"]}, {"axis": "النقل الوثبي والمستقبلات الحسية (براعم التذوق)", "n": 4, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "التواصل العصبي"], ["الحصة", "4 من 5"], ["محور الحصة", "النقل الوثبي والمستقبلات الحسية (براعم التذوق)"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 178–183 + كتاب التجارب ص 127"], ["دليل المعلم", "ص 224–231"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]], "t": ["1. يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي (10 دقائق)\n2. يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق) (10 دقائق)\nمخرج تعليمي آخر: يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2) (20 دقيقة)", "1. فهم: يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي\n2. فهم: يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق)\n3. تطبيق (مخرج آخر): يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2)", "- التعلم بالاكتشاف\n- التعلم التشاركي\n- المناقشة الصفية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة", "النقل الوثبي، عقد رانفييه، سرعة النبضة، المستقبل الحسي، المستقبل الكيميائي، برعم التذوق، جهد المستقبل، المحوِّل (تحويل الطاقة).", "يسأل المعلم: «نبضة في محور مايليني تقطع نحو ‎100 m/s‎، وفي محور غير مايليني نحو ‎1 m/s‎؛ كيف تقفز النبضة هذه القفزة في السرعة؟»", "1. يطرح المعلم السؤال ويعرض قيم السرعة، والطلبة يقترحون دور المايلين (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم النقل الوثبي ثم المستقبلات الحسية وبراعم التذوق (‎Na⁺‎ في الطعم المالح) وتكوين جهد المستقبل، والطلبة يرسمون مخططًا لخطوات تحويل الطعم إلى جهد فعل (12 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. يدير المعلم مناقشة صفية «مقارنة النبضات العصبية بالتيارات الكهربائية» ثم نشاط 5-2 «استخدام اللغة التقنية» (ص 127)، والطلبة يقارنون ويصححون عبارات علمية غير دقيقة (15 دقيقة)\nالاستراتيجيات: المناقشة الصفية.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: أين تحدث إزالة الاستقطاب في المحور المايليني؟\n• الإجابة النموذجية: عند عقد رانفييه فقط.\n\n2. مستوى التطبيق: لماذا يكون النقل الوثبي أسرع؟\n• الإجابة النموذجية: لأن النبضة تقفز من عقدة إلى أخرى بدل أن تمر بكل جزء من الغشاء.\n\n3. مستوى الاستدلال: ما الذي يسبب جهد المستقبل في برعم التذوق للطعم المالح؟\n• الإجابة النموذجية: دخول أيونات ‎Na⁺‎ إلى الخلية المستقبلة فتزيل الاستقطاب جزئيًا.", "1. مستوى المعرفة: ما وظيفة المستقبل الحسي؟\n• الإجابة النموذجية: تحويل طاقة المنبه إلى إشارة كهربائية (جهد مستقبل يؤدي إلى جهد فعل).\n\n2. مستوى التطبيق: متى يؤدي جهد المستقبل إلى جهد فعل في الخلية الحسية؟\n• الإجابة النموذجية: عندما يبلغ العتبة.\n\n3. مستوى الاستدلال: صحح العبارة: «النبضة العصبية تيار من الإلكترونات يجري في المحور كالسلك».\n• الإجابة النموذجية: غير دقيقة؛ النبضة موجة من إزالة الاستقطاب تنتقل بحركة أيونات (‎Na⁺‎ و‎K⁺‎) عبر الغشاء، لا تدفق إلكترونات على طول المحور.", "إرشاد للطالب: إكمال نشاط 5-2 ص 127 ومراجعة ص 178–183\nإرشاد لولي الأمر: سؤال الابن: لماذا يشعر المصاب ببعض أمراض المايلين ببطء في الحركة؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23"], "h": ["<ol class=\"ol\"><li>يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي (10 دقائق)<\/li><li>يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق) (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2) (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2)<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التشاركي<\/span><span class=\"chip\">المناقشة الصفية<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>النقل الوثبي، عقد رانفييه، سرعة النبضة، المستقبل الحسي، المستقبل الكيميائي، برعم التذوق، جهد المستقبل، المحوِّل (تحويل الطاقة).<\/p>", "<p>يسأل المعلم: «نبضة في محور مايليني تقطع نحو ‎100 m/s‎، وفي محور غير مايليني نحو ‎1 m/s‎؛ كيف تقفز النبضة هذه القفزة في السرعة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويعرض قيم السرعة، والطلبة يقترحون دور المايلين (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم النقل الوثبي ثم المستقبلات الحسية وبراعم التذوق (‎Na⁺‎ في الطعم المالح) وتكوين جهد المستقبل، والطلبة يرسمون مخططًا لخطوات تحويل الطعم إلى جهد فعل (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يدير المعلم مناقشة صفية «مقارنة النبضات العصبية بالتيارات الكهربائية» ثم نشاط 5-2 «استخدام اللغة التقنية» (ص 127)، والطلبة يقارنون ويصححون عبارات علمية غير دقيقة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: المناقشة الصفية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين تحدث إزالة الاستقطاب في المحور المايليني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عند عقد رانفييه فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون النقل الوثبي أسرع؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن النبضة تقفز من عقدة إلى أخرى بدل أن تمر بكل جزء من الغشاء.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الذي يسبب جهد المستقبل في برعم التذوق للطعم المالح؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: دخول أيونات ‎Na⁺‎ إلى الخلية المستقبلة فتزيل الاستقطاب جزئيًا.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة المستقبل الحسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تحويل طاقة المنبه إلى إشارة كهربائية (جهد مستقبل يؤدي إلى جهد فعل).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> متى يؤدي جهد المستقبل إلى جهد فعل في الخلية الحسية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عندما يبلغ العتبة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صحح العبارة: «النبضة العصبية تيار من الإلكترونات يجري في المحور كالسلك».<br><span style=\"opacity:.85\">• الإجابة النموذجية: غير دقيقة؛ النبضة موجة من إزالة الاستقطاب تنتقل بحركة أيونات (‎Na⁺‎ و‎K⁺‎) عبر الغشاء، لا تدفق إلكترونات على طول المحور.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 5-2 ص 127 ومراجعة ص 178–183<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن: لماذا يشعر المصاب ببعض أمراض المايلين ببطء في الحركة؟<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23<\/p>"]}, {"axis": "التشابك العصبي الكوليني", "n": 5, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "التواصل العصبي"], ["الحصة", "5 من 5"], ["محور الحصة", "التشابك العصبي الكوليني"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 184–188"], ["دليل المعلم", "ص 224–231"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]], "t": ["1. يصف تركيب التشابك العصبي الكوليني (الغشاء قبل التشابكي، الحويصلات، الشق، المستقبلات) (10 دقائق)\n2. يشرح خطوات انتقال الإشارة عبر التشابك بما في ذلك دور أيونات الكالسيوم والأستيل كولين وإنزيم الأستيل كولين إستريز (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بأثر مادة تثبط إنزيم الأستيل كولين إستريز على انتقال النبضات (15 دقيقة)", "1. فهم: يصف تركيب التشابك العصبي الكوليني (الغشاء قبل التشابكي، الحويصلات، الشق، المستقبلات)\n2. فهم: يشرح خطوات انتقال الإشارة عبر التشابك بما في ذلك دور أيونات الكالسيوم والأستيل كولين وإنزيم الأستيل كولين إستريز\n3. تقييم (مخرج آخر): يتنبأ بأثر مادة تثبط إنزيم الأستيل كولين إستريز على انتقال النبضات", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)", "التشابك العصبي، الغشاء قبل التشابكي، الغشاء بعد التشابكي، الشق التشابكي، الحويصلات، الأستيل كولين، قنوات الكالسيوم، الأستيل كولين إستريز.", "يسأل المعلم: «الخلايا العصبية لا تتلامس؛ بينها فجوة دقيقة؛ كيف تعبر الرسالة الكهربائية فجوة لا يمر فيها التيار؟»", "1. يطرح المعلم السؤال ويستقبل الإجابات، والطلبة يقترحون رسولًا كيميائيًا (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح خطوات الانتقال: وصول جهد الفعل، دخول ‎Ca²⁺‎، اندماج الحويصلات، انتشار الأستيل كولين، ارتباطه بالمستقبلات، دخول ‎Na⁺‎، تحلله بالإنزيم، والطلبة يرسمون التشابك ويرقمون الخطوات (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم سيناريوهات «ماذا لو؟» (مبيد يثبط الإنزيم، مادة تحجب المستقبلات)، والطلبة يتنبؤون بالنتائج في مجموعات ويبررون (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – يد الخزاف: يمثل الطلبة خزافًا في بهلا يلمس الفرن الساخن فيسحب يده، ويتتبعون مسار القوس الانعكاسي، ثم يذكرون قيمة الحرفة وأهمية السلامة (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم:\n1. مستوى المعرفة: ما الأيون الذي يدخل الطرف قبل التشابكي عند وصول جهد الفعل؟\n• الإجابة النموذجية: الكالسيوم ‎(Ca²⁺)‎.\n\n2. مستوى التطبيق: ما وظيفة إنزيم الأستيل كولين إستريز؟\n• الإجابة النموذجية: تحليل الأستيل كولين في الشق التشابكي لإنهاء الإشارة.\n\n3. مستوى الاستدلال: لماذا تنتقل الإشارة عبر التشابك في اتجاه واحد؟\n• الإجابة النموذجية: لأن الحويصلات توجد في الطرف قبل التشابكي فقط والمستقبلات في الغشاء بعد التشابكي فقط.", "1. مستوى المعرفة: ما الناقل العصبي في التشابك الكوليني؟\n• الإجابة النموذجية: الأستيل كولين.\n\n2. مستوى التطبيق: رتب: ارتباط الأستيل كولين بالمستقبلات، دخول ‎Ca²⁺‎، اندماج الحويصلات، إزالة استقطاب الغشاء بعد التشابكي.\n• الإجابة النموذجية: دخول ‎Ca²⁺ ←‎ اندماج الحويصلات ← ارتباط الأستيل كولين بالمستقبلات ← إزالة استقطاب الغشاء بعد التشابكي.\n\n3. مستوى الاستدلال: ما أثر مبيد حشري يثبط الأستيل كولين إستريز؟\n• الإجابة النموذجية: يبقى الأستيل كولين مرتبطًا بالمستقبلات فتستمر إزالة الاستقطاب وتنقبض العضلات باستمرار (شلل تشنجي).", "إرشاد للطالب: مراجعة ص 184–188 ورسم التشابك مع ترقيم الخطوات\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية الحذر عند استخدام المبيدات الحشرية في المنزل والمزرعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23"], "h": ["<ol class=\"ol\"><li>يصف تركيب التشابك العصبي الكوليني (الغشاء قبل التشابكي، الحويصلات، الشق، المستقبلات) (10 دقائق)<\/li><li>يشرح خطوات انتقال الإشارة عبر التشابك بما في ذلك دور أيونات الكالسيوم والأستيل كولين وإنزيم الأستيل كولين إستريز (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر مادة تثبط إنزيم الأستيل كولين إستريز على انتقال النبضات (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padd ق:<\/b> رتب: ارتباط الأستيل كولين بالمستقبلات، دخول ‎Ca²⁺‎، اندماج الحويصلات، إزالة استقطاب الغشاء بعد التشابكي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: دخول ‎Ca²⁺ ←‎ اندماج الحويصلات ← ارتباط الأستيل كولين بالمستقبلات ← إزالة استقطاب الغشاء بعد التشابكي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما أثر مبيد حشري يثبط الأستيل كولين إستريز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يبقى الأستيل كولين مرتبطًا بالمستقبلات فتستمر إزالة الاستقطاب وتنقبض العضلات باستمرار (شلل تشنجي).<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 184–188 ورسم التشابك مع ترقيم الخطوات<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أهمية الحذر عند استخدام المبيدات الحشرية في المنزل والمزرعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23<\/p>"]}]}, {"title": "الانقباض العضلي", "sb": "ص 188–193", "unit": "الوحدة 5: التحكم والتنسيق", "periods": [{"axis": "التركيب الدقيق للعضلة المخططة والقطعة العضلية", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "الانقباض العضلي"], ["الحصة", "1 من 3"], ["محور الحصة", "التركيب الدقيق للعضلة المخططة والقطعة العضلية"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 188–191"], ["دليل المعلم", "ص 232–235"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين) (10 دقائق)\n2. يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎ (20 دقيقة)\nمخرج تعليمي آخر: يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط (10 دقائق)", "1. فهم: يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين)\n2. تطبيق: يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎\n3. تحليل (مخرج آخر): يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة", "العضلة المخططة، الليف العضلي، اللييفة العضلية، القطعة العضلية (الساركومير)، الأكتين، الميوسين، خط ‎Z‎، الحزمة ‎A‎، الحزمة ‎I‎، الحزمة ‎H‎.", "يعرض المعلم صورة مجهرية لعضلة مخططة ويسأل: «من أين جاء هذا التخطيط المنتظم كأنه سلم؟»", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون ترتيبًا منتظمًا لمكونات داخلية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المستويات من العضلة إلى القطعة العضلية بالأشكال 5-22 إلى 5-24، والطلبة يرسمون قطعة عضلية ويحددون أجزاءها (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوزع المعلم صورًا مجهرية إلكترونية لعنونتها وقياس طول القطعة العضلية بالمقياس، والطلبة يعنونون ويحسبون الطول الفعلي (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما الخيوط التي تكوّن الحزمة ‎I‎؟\n• الإجابة النموذجية: الخيوط الرفيعة (الأكتين) فقط.\n\n2. مستوى التطبيق: ما الحدود التي تفصل بين قطعتين عضليتين؟\n• الإجابة النموذجية: خط ‎Z‎.\n\n3. مستوى الاستدلال: لماذا تبدو الحزمة ‎A‎ داكنة؟\n• الإجابة النموذجية: لأنها تحتوي الخيوط السميكة (الميوسين) المتداخلة مع الخيوط الرفيعة.", "1. مستوى المعرفة: ما القطعة العضلية؟\n• الإجابة النموذجية: الوحدة الانقباضية المتكررة في اللييفة العضلية، تقع بين خطي ‎Z‎ متتاليين.\n\n2. مستوى التطبيق: ما الذي تحتويه الحزمة ‎H‎؟\n• الإجابة النموذجية: الخيوط السميكة (الميوسين) فقط.\n\n3. مستوى الاستدلال: لماذا تحتوي الألياف العضلية على أنوية متعددة؟\n• الإجابة النموذجية: لأنها تتكون من اندماج خلايا كثيرة أثناء النمو، فيصبح الليف طويلًا متعدد الأنوية.", "إرشاد للطالب: مراجعة ص 188–191 ورسم القطعة العضلية مع الأجزاء\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين الحزمة ‎A‎ والحزمة ‎I‎\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=24"], "h": ["<ol class=\"ol\"><li>يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين) (10 دقائق)<\/li><li>يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎ (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><\/div>", "<p>العضلة المخططة، الليف العضلي، اللييفة العضلية، القطعة العضلية (الساركومير)، الأكتين، الميوسين، خط ‎Z‎، الحزمة ‎A‎، الحزمة ‎I‎، الحزمة ‎H‎.<\/p>", "<p>يعرض المعلم صورة مجهرية لعضلة مخططة ويسأل: «من أين جاء هذا التخطيط المنتظم كأنه سلم؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون ترتيبًا منتظمًا لمكونات داخلية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم المستويات من العضلة إلى القطعة العضلية بالأشكال 5-22 إلى 5-24، والطلبة يرسمون قطعة عضلية ويحددون أجزاءها (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم صورًا مجهرية إلكترونية لعنونتها وقياس طول القطعة العضلية بالمقياس، والطلبة يعنونون ويحسبون الطول الفعلي (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخيوط التي تكوّن الحزمة ‎I‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الخيوط الرفيعة (الأكتين) فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الحدود التي تفصل بين قطعتين عضليتين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: خط ‎Z‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تبدو الحزمة ‎A‎ داكنة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها تحتوي الخيوط السميكة (الميوسين) المتداخلة مع الخيوط الرفيعة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما القطعة العضلية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الوحدة الانقباضية المتكررة في اللييفة العضلية، تقع بين خطي ‎Z‎ متتاليين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الذي تحتويه الحزمة ‎H‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الخيوط السميكة (الميوسين) فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تحتوي الألياف العضلية على أنوية متعددة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها تتكون من اندماج خلايا كثيرة أثناء النمو، فيصبح الليف طويلًا متعدد الأنوية.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 188–191 ورسم القطعة العضلية مع الأجزاء<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين الحزمة ‎A‎ والحزمة ‎I‎<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=24<\/p>"]}, {"axis": "نموذج الخيط المنزلق ودور الكالسيوم و‎ATP‎", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "الانقباض العضلي"], ["الحصة", "2 من 3"], ["محور الحصة", "نموذج الخيط المنزلق ودور الكالسيوم و‎ATP‎"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 191–193"], ["دليل المعلم", "ص 232–235"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يشرح نموذج الخيط المنزلق لانقباض العضلة بما في ذلك تكوين الجسور المتقاطعة بين رؤوس الميوسين والأكتين (10 دقائق)\n2. يشرح دور التروبونين والتروبوميوسين وأيونات الكالسيوم و‎ATP‎ في الانقباض (15 دقيقة)\nمخرج تعليمي آخر: يحلل تغير أطوال الحزم ‎A‎ و‎I‎ والحزمة ‎H‎ أثناء الانقباض (15 دقيقة)", "1. فهم: يشرح نموذج الخيط المنزلق لانقباض العضلة بما في ذلك تكوين الجسور المتقاطعة بين رؤوس الميوسين والأكتين\n2. فهم: يشرح دور التروبونين والتروبوميوسين وأيونات الكالسيوم و‎ATP‎ في الانقباض\n3. تحليل (مخرج آخر): يحلل تغير أطوال الحزم ‎A‎ و‎I‎ والحزمة ‎H‎ أثناء الانقباض", "- التعلم بالنمذجة\n- التعلم التعاوني\n- نمذجة انقباض العضلات", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)", "نموذج الخيط المنزلق، الجسر المتقاطع، رأس الميوسين، التروبوميوسين، التروبونين، أيونات الكالسيوم، الشبكة الساركوبلازمية، ‎ATP‎، انثناء رأس الميوسين.", "يمسك المعلم يديه متشابكتي الأصابع جزئيًا ثم يقربهما دون أن تقصر الأصابع، ويسأل: «هل قصرت أصابعي؟ أم انزلقت؟ هكذا تنقبض العضلة!»", "1. يقدم المعلم تشبيه الأصابع، والطلبة يستنتجون أن الخيوط تنزلق ولا تقصر (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح خطوات الانقباض: إفراز ‎Ca²⁺‎ من الشبكة الساركوبلازمية، ارتباطه بالتروبونين، إزاحة التروبوميوسين، تكوين الجسور، انثناء رأس الميوسين، دور ‎ATP‎ في الانفصال وإعادة التهيئة، والطلبة يرتبون بطاقات الخطوات (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم «نمذجة انقباض العضلات» بأدوات بسيطة (أشرطة وأصابع ورقية)، والطلبة يمثلون الخطوات ويقيسون أطوال الحزم قبل الانقباض وبعده (14 دقيقة)\nالاستراتيجيات: نمذجة انقباض العضلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الذي يحجب مواقع الارتباط على الأكتين في العضلة المسترخية؟\n• الإجابة النموذجية: التروبوميوسين.\n\n2. مستوى التطبيق: ما دور أيونات الكالسيوم في الانقباض؟\n• الإجابة النموذجية: ترتبط بالتروبونين فيتغير شكله ويُزيح التروبوميوسين لتنكشف مواقع ارتباط الميوسين على الأكتين.\n\n3. مستوى الاستدلال: ما دور ‎ATP‎ في دورة الجسور المتقاطعة؟\n• الإجابة النموذجية: يرتبط برأس الميوسين فينفصل عن الأكتين، ويُحلل لإعادة تهيئة الرأس للضربة التالية.", "1. مستوى المعرفة: أي الحزم يبقى طولها ثابتًا أثناء الانقباض؟\n• الإجابة النموذجية: الحزمة ‎A‎.\n\n2. مستوى التطبيق: ماذا يحدث لطول الحزمة ‎I‎ والحزمة ‎H‎ أثناء الانقباض؟\n• الإجابة النموذجية: يقصران.\n\n3. مستوى الاستدلال: فسّر تيبس العضلات بعد الوفاة.\n• الإجابة النموذجية: لعدم توفر ‎ATP‎ تبقى رؤوس الميوسين مرتبطة بالأكتين فلا تنفصل الجسور المتقاطعة.", "إرشاد للطالب: مراجعة ص 191–193 وكتابة خطوات الخيط المنزلق بالترتيب\nإرشاد لولي الأمر: تشجيع الابن على شرح تشبيه انزلاق الأصابع لأحد أفراد الأسرة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github دة تهيئة الرأس للضربة التالية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أي الحزم يبقى طولها ثابتًا أثناء الانقباض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الحزمة ‎A‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا يحدث لطول الحزمة ‎I‎ والحزمة ‎H‎ أثناء الانقباض؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يقصران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> فسّر تيبس العضلات بعد الوفاة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لعدم توفر ‎ATP‎ تبقى رؤوس الميوسين مرتبطة بالأكتين فلا تنفصل الجسور المتقاطعة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 191–193 وكتابة خطوات الخيط المنزلق بالترتيب<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على شرح تشبيه انزلاق الأصابع لأحد أفراد الأسرة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=24<\/p>"]}, {"axis": "كتابة نص لنموذج الخيط المنزلق والأسئلة 12–13", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "الانقباض العضلي"], ["الحصة", "3 من 3"], ["محور الحصة", "كتابة نص لنموذج الخيط المنزلق والأسئلة 12–13"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 188–193"], ["دليل المعلم", "ص 232–235"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يكتب نصًا علميًا متسلسلًا يصف الانقباض من وصول النبضة إلى الوصلة العصبية العضلية حتى ارتخاء العضلة (20 دقيقة)\n2. يحل السؤالين 12 و13 في كتاب الطالب (5 دقائق)\nمخرج تعليمي آخر: يقيّم نصوص الزملاء وفق معايير الدقة والتسلسل والمصطلحات (15 دقيقة)", "1. إبداع: يكتب نصًا علميًا متسلسلًا يصف الانقباض من وصول النبضة إلى الوصلة العصبية العضلية حتى ارتخاء العضلة\n2. تطبيق: يحل السؤالين 12 و13 في كتاب الطالب\n3. تقييم (مخرج آخر): يقيّم نصوص الزملاء وفق معايير الدقة والتسلسل والمصطلحات", "- التعلم الذاتي\n- التعلم التعاوني\n- الكتابة العلمية", "- الكتاب\n- الأقلام\n- أخرى: بطاقات معايير التقييم", "الوصلة العصبية العضلية، إزالة استقطاب الليف العضلي، أنيبيبات ‎T‎، الارتخاء، إعادة امتصاص الكالسيوم، التسلسل العلمي.", "يعرض المعلم مقطعًا قصيرًا لعدّاء ينطلق، ويطلب: «اكتب في سطر واحد: من أين بدأت حركة ساقه؟» ثم يناقش الإجابات.", "1. يعرض المعلم المقطع ويستقبل الإجابات، والطلبة يربطون الحركة بإشارة عصبية من الدماغ (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يوجه المعلم «كتابة نص لنموذج الخيط المنزلق» (نشاط دليل المعلم) من الوصلة العصبية العضلية إلى الارتخاء، والطلبة يكتبون النص في أزواج مستخدمين المصطلحات العلمية (19 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينظم المعلم تقييمًا تبادليًا وفق المعايير ثم يوجه حل السؤالين 12 و13، والطلبة يقيّمون النصوص ويحلون السؤالين (11 دقيقة)\nالاستراتيجيات: الكتابة العلمية.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – مجدفو القارب: تحاكي المجموعات حركة التجديف في سباق قوارب تقليدي لتفسير انزلاق خيوط الأكتين والميوسين، ثم تذكر معلومة عن تاريخ عمان البحري (5 دقائق)\nالاستراتيجيات: المحاكاة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الذي يحدث عند الوصلة العصبية العضلية؟\n• الإجابة النموذجية: يُفرز الأستيل كولين فيرتبط بمستقبلات غشاء الليف العضلي ويزيل استقطابه.\n\n2. مستوى التطبيق: ما دور أنيبيبات ‎T‎؟\n• الإجابة النموذجية: نقل إزالة الاستقطاب إلى داخل الليف قرب الشبكة الساركوبلازمية لتحرير الكالسيوم.\n\n3. مستوى الاستدلال: كيف ترتخي العضلة؟\n• الإجابة النموذجية: يُعاد ضخ الكالسيوم إلى الشبكة الساركوبلازمية بالنقل النشط فيعود التروبوميوسين لحجب مواقع الارتباط.", "1. مستوى المعرفة: ما المعيار الأهم لتقييم نص الانقباض في رأيك؟ ولماذا؟\n• الإجابة النموذجية: مثال: صحة التسلسل، لأن الخطأ في ترتيب الخطوات يدل على سوء فهم الآلية.\n\n2. مستوى التطبيق: لماذا تحتاج العضلات إلى ‎ATP‎ للارتخاء أيضًا؟\n• الإجابة النموذجية: لأن إعادة ضخ الكالسيوم إلى الشبكة الساركوبلازمية نقل نشط يستهلك ‎ATP‎.\n\n3. مستوى الاستدلال: اكتب ثلاث جمل متسلسلة تصف سيق في النباتات"], ["الحصة", "1 من 2"], ["محور الحصة", "الأكسين ونمو الاستطالة"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 194–195"], ["دليل المعلم", "ص 236–239"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: تأثير الأكسين على نمو الجذر والساق ص 129؛ الاستقصاء العملي 5-2 (إثرائي) ص 142"]], "t": ["1. يشرح دور الأكسين في نمو الاستطالة عن طريق تحفيز ضخ البروتونات المسبب لحموضة جدران الخلايا (10 دقائق)\n2. يصف كيف تؤدي حموضة الجدار إلى تنشيط بروتينات الاستطالة وارتخاء الجدار ودخول الماء واستطالة الخلية (15 دقيقة)\nمخرج تعليمي آخر: يفسر الانتحاء الضوئي في ضوء توزيع الأكسين (15 دقيقة)", "1. فهم: يشرح دور الأكسين في نمو الاستطالة عن طريق تحفيز ضخ البروتونات المسبب لحموضة جدران الخلايا\n2. فهم: يصف كيف تؤدي حموضة الجدار إلى تنشيط بروتينات الاستطالة وارتخاء الجدار ودخول الماء واستطالة الخلية\n3. تحليل (مخرج آخر): يفسر الانتحاء الضوئي في ضوء توزيع الأكسين", "- التعلم بالنمذجة\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "الأكسين ‎(IAA)‎، منظم النمو النباتي، نمو الاستطالة، ضخ البروتونات، تحمّض جدار الخلية، بروتينات الاستطالة، الانتحاء الضوئي.", "يعرض المعلم صورة نبتة على حافة نافذة مائلة نحو الضوء ويسأل: «النبات لا يملك عضلات ولا أعصابًا؛ كيف انحنى نحو الضوء؟»", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون مادة كيميائية تتحكم في النمو (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح آلية الأكسين: الارتباط بالمستقبلات، تنشيط مضخات البروتون، تحمض الجدار، بروتينات الاستطالة، دخول الماء والاستطالة، والطلبة يرسمون مخططًا انسيابيًا للآلية (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدم المعلم مواقف (ضوء من جهة واحدة، قمة مقطوعة) لتحليلها في مجموعات، والطلبة يتنبؤون بالنمو ويفسرونه بتوزيع الأكسين (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: كيف يجعل الأكسين جدار الخلية حمضيًا؟\n• الإجابة النموذجية: يحفز ضخ البروتونات ‎(H⁺)‎ من السيتو التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف يجعل الأكسين جدار الخلية حمضيًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يحفز ضخ البروتونات ‎(H⁺)‎ من السيتوبلازم إلى جدار الخلية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما دور بروتينات الاستطالة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تنشط في الوسط الحمضي فتكسر الروابط بين ألياف السليلوز فيرتخي الجدار ويتمدد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ينحني الساق نحو الضوء؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأكسين يتجمع في الجانب المظلل فتستطيل خلاياه أكثر فينحني الساق نحو الضوء.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الأكسين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: منظم نمو نباتي (هرمون نباتي) يحفز استطالة الخلايا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> رتب: دخول الماء، ضخ البروتونات، ارتخاء الجدار، تنشيط بروتينات الاستطالة، استطالة الخلية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ضخ البروتونات ← تنشيط بروتينات الاستطالة ← ارتخاء الجدار ← دخول الماء ← استطالة الخلية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تستطيل الخلية رغم وجود الأكسين إذا كان الماء قليلًا جدًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الاستطالة تحتاج إلى دخول الماء بالأسموزية لتمديد الجدار المرتخي.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 194–195 وحل السؤال 14<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن تنفيذ تجربة منزلية بسيطة لإنبات بذور قرب نافذة وملاحظة انحنائها نحو الضوء<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=25<\/p>"]}, {"axis": "نشاط 5-3: تأثير الأكسين ومراجعة الوحدة الخامسة", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "التحكم والتنسيق في النباتات"], ["الحصة", "2 من 2"], ["محور الحصة", "نشاط 5-3: تأثير الأكسين ومراجعة الوحدة الخامسة"], ["الأسبوع والتاريخ", "الأسبوع الخامس عشر (13–17/12/2026)"], ["كتاب الطالب", "ص 196–205 + كتاب التجارب ص 129"], ["دليل المعلم", "ص 236–239"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-3: تأثير الأكسين على نمو الجذر والساق ص 129؛ الاستقصاء العملي 5-2 (إثرائي) ص 142"]], "t": ["1. يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3) (15 دقيقة)\n2. يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي (15 دقيقة)\nمخرج تعليمي آخر: يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة (10 دقائق)", "1. تحليل: يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3)\n2. تطبيق: يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي\n3. تقييم (مخرج آخر): يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "منحنى الاستجابة للتركيز، التركيز الأمثل، التثبيط عند التراكيز العالية، الجذر، الساق، ملخص الوحدة.", "يعرض المعلم تمثيلًا بيانيًا لاستجابة الجذر والساق لتراكيز الأكسين ويسأل: «تركيز واحد ينشط الساق ويثبط الجذر؛ كيف يكون ذلك؟»", "1. يعرض المعلم التمثيل ويطرح السؤال، والطلبة يلاحظون اختلاف التركيز الأمثل (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يوجه المعلم حل نشاط 5-3 «تأثير الأكسين على نمو الجذر والساق» (كتاب التجارب ص 129)، والطلبة يحللون البيانات ويحددون التراكيز المثلى (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوزع المعلم أسئلة نهاية الوحدة (ص 198–205) على المجموعات، والطلبة يحلون ويعرضون الحلول (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – انحناء نحو الشمس: تفسر المجموعات دور الأكسين في انحناء النبات نحو الضوء، وتقترح تطبيقًا لهذه المعرفة في المزارع العمانية لدعم الأمن الغذائي (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم:\n1. مستوى المعرفة: أيهما أكثر حساسية للأكسين: الجذر أم الساق؟\n• الإجابة النموذجية: الجذر؛ فتركيزه الأمثل أقل بكثير.\n\n2. مستوى التطبيق: ماذا يحدث لنمو الجذر عند تراكيز أكسين عالية؟\n• الإجابة النموذجية: يُثبط.\n\n3. مستوى الاستدلال: اربط بين جهد الفعل في الخلية العصبية والانقباض العضلي في جملة.\n• الإجابة النموذجية: يصل جهد الفعل إلى الوصلة العصبية العضلية فيُفرز الأستيل كولين ويزيل استقطاب الليف فيتحرر الكالسيوم ويحدث الانقباض.", "1. مستوى المعرفة: اذكر تشابهًا واحدًا بين التأشير في الحيوان والنبات.\n• الإجابة النموذجية: كلاهما يستخدم مواد كيميائية ترتبط بمستقبلات نوعية في خلايا هدف (هرمونات أو أكسين).\n\n2. مستوى التطبيق: لماذا يؤدي التركيز نفسه من الأكسين إلى استجابتين مختلفتين في الجذر والساق؟\n• الإجابة النموذجية: لاختلاف حساسية خلايا العضوين للأكسين، فالتركيز المحفز للساق يكون مثبطًا للجذر.\n\n3. مستوى الاستدلال: قيّم تعلمك في الوحدة الخامسة: موضوع أتقنته، وآخر يحتاج إلى مراجعة، وخطة لذلك.\n• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.", "إرشاد للطالب: إكمال نشاط 5-3 وأسئلة نهاية الوحدة وقائمة التقويم الذاتي ومراجعة الملخص ص 196–197\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=25"], "h": ["<ol class=\"ol\"><li>يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3) (15 دقيقة)<\/li><li>يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>منحنى الاستجابة للتركيز، التركيز الأمثل، التثبيط عند التراكيز العالية، الجذر، الساق، ملخص الوحدة.<\/p>", "<p>يعرض المعلم تمثيلًا بيانيًا لاستجابة الجذر والساق لتراكيز الأكسين ويسأل: «تركيز واحد ينشط الساق ويثبط الجذر؛ كيف يكون ذلك؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم التمثيل ويطرح السؤال، والطلبة يلاحظون اختلاف التركيز الأمثل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 5-3 «تأثير الأكسين على نمو الجذر والساق» (كتاب التجارب ص 129)، والطلبة يحللون البيانات ويحددون التراكيز المثلى (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم أسئلة نهاية الوحدة (ص 198–205) على المجموعات، والطلبة يحلون ويعرضون الحلول (1 ابتين مختلفتين في الجذر والساق؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لاختلاف حساسية خلايا العضوين للأكسين، فالتركيز المحفز للساق يكون مثبطًا للجذر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم تعلمك في الوحدة الخامسة: موضوع أتقنته، وآخر يحتاج إلى مراجعة، وخطة لذلك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 5-3 وأسئلة نهاية الوحدة وقائمة التقويم الذاتي ومراجعة الملخص ص 196–197<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=25<\/p>"]}]}]);
let st={m:'sep',l:0,p:0};
try{const s=JSON.parse(localStorage.getItem('noorcopy_'+document.title)||'null');if(s&&D[s.l])st=s;}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('noorcopy_'+document.title,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function buildSelect(){let h='',u='';D.forEach((L,i)=>{if(L.unit!==u){if(u)h+='</optgroup>';u=L.unit;h+=`<optgroup label="${esc(u)}">`}h+=`<option value="${i}">${esc(L.title)} (${L.periods.length} حصص)</option>`});h+='</optgroup>';$('les').innerHTML=h}
function render(){
 const L=D[st.l];if(st.p>=L.periods.length)st.p=0;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));
 $('status').textContent=st.m==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة ${st.p+1} من ${L.periods.length}`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم ${L.periods.length} حصص`;
 $('les').value=st.l;
 const tabs=$('tabs');
 if(st.m==='sep'){tabs.style.display='flex';tabs.innerHTML=L.periods.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}">الحصة ${p.n}: ${esc(p.axis)}</button>`).join('')}
 else tabs.style.display='none';
 let rows='';
 if(st.m==='sep'){const hi=L.periods[st.p].hi;rows=hi.map((r,k)=>`<div class="${k===4?'w':''}"><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')}
 else{const h0=L.periods[0].hi;rows=[h0[0],h0[1],h0[2]].map(r=>`<div><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')+
  `<div><b>كتاب الطالب:</b>${esc(L.sb)}</div><div><b>${h0[7][0]}:</b>${esc(h0[7][1])}</div><div><b>${h0[8][0]}:</b>${esc(h0[8][1])}</div>`+
  `<div class="w"><b>الحصص:</b><br>${L.periods.map(p=>`الحصة ${p.n}: ${esc(p.axis)} — ${esc(p.hi[5][1])}`).join('<br>')}</div>`}
 $('info').innerHTML=rows;
 $('cards').innerHTML=FIELDS.map((f,i)=>`<div class="card"><div class="ch"><div class="ct"><span class="num">${i+1}</span>${f}</div><button class="copy" data-f="${i}">نسخ</button></div><div class="cb" id="cb${i}">${fieldHtml(i)}</div></div>`).join('');
 save();
}
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
