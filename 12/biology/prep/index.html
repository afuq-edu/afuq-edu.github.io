الدقيقة 17 إلى 30)\nالمعلم: يوزع شرائط ورقية لنمذجة الربط والربط البديل\nالطالب: يقصّون الإنترونات ويلصقون الإكسونات بترتيبين مختلفين ويعدّون البروتينات المحتملة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير سؤالًا مفصليًا والتقويم الختامي\nالطالب: يجيبون ويعللون اختلاف حجم ‎mRNA‎ الناضج عن النسخة الأولية\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الإنترونات؟\n   الإجابة النموذجية: تتابعات غير مشفرة تُزال من نسخة ‎RNA‎ الأولية.\n2) (المستوى المتوقع) السؤال: ماذا ينتج من ربط الإكسونات؟\n   الإجابة النموذجية: جزيء ‎mRNA‎ ناضج يحمل التتابعات المشفرة فقط.\n3) (المستوى المتقدم) السؤال: نسخة أولية فيها 4 إكسونات؛ ماذا يعني الربط البديل لها؟\n   الإجابة النموذجية: ربط إكسونات مختلفة أو بترتيبات مختلفة لإنتاج أكثر من ‎mRNA‎ وبالتالي أكثر من بروتين.","1) (مستوى الدعم) السؤال: أين تحدث معالجة ‎RNA‎ في الخلية حقيقية النواة؟\n   الإجابة النموذجية: في النواة قبل مغادرة ‎mRNA‎ عبر الثقوب النووية.\n2) (المستوى المتوقع) السؤال: لماذا يكون ‎mRNA‎ الناضج أقصر من النسخة الأولية؟\n   الإجابة النموذجية: لأن الإنترونات أُزيلت منها.\n3) (المستوى المتقدم) السؤال: يحتوي جينوم الإنسان نحو 20 ألف جين لكنه ينتج عددًا أكبر بكثير من البروتينات. فسّر.\n   الإجابة النموذجية: بسبب الربط البديل، إذ تُربط إكسونات الجين بطرائق مختلفة فينتج الجين الواحد عدة بروتينات.","إرشاد للطالب: قراءة ص 31 وكتابة تعريفات المصطلحات الأربعة الجديدة\nإرشاد لولي الأمر: مناقشة الابن في تشبيه «حذف الكلمات الزائدة» لشرح الإنترونات"],"h":["<ol class=\"ol\"><li>يصف تعديل نسخة ‎RNA‎ الأولية في حقيقيات النواة بإزالة الإنترونات وربط الإكسونات</li><li>يفسر كيف يؤدي الربط البديل إلى إنتاج بروتينات مختلفة من جين واحد</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين ‎mRNA‎ في بدائيات النواة وحقيقيات النواة من حيث المعالجة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تعديل نسخة ‎RNA‎ الأولية في حقيقيات النواة بإزالة الإنترونات وربط الإكسونات</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر كيف يؤدي الربط البديل إلى إنتاج بروتينات مختلفة من جين واحد</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين ‎mRNA‎ في بدائيات النواة وحقيقيات النواة من حيث المعالجة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: شريط ورقي ملون يمثل الإكسونات والإنترونات ومقص</span></div>","<p>نسخة ‎RNA‎ الأولية، معالجة ‎RNA‎، الإنترونات، الإكسونات، الربط، الربط البديل.</p>","<p>يعرض المعلم جملة طويلة تتخللها كلمات زائدة ملونة ويطلب حذفها لقراءة الرسالة، ثم يسأل: «هل تحدث عملية مشابهة لـ ‎mRNA‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الجملة ويطلب استخراج الرسالة</td><td>يحذفون الكلمات الزائدة ويستنتجون فكرة التعديل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح معالجة ‎RNA‎ في حقيقيات النواة (الإنترونات، الإكسونات، الربط) والربط البديل</td><td>يعرّفون المصطلحات في الدفتر ويرسمون نسخة أولية ونسخة ناضجة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوزع شرائط ورقية لنمذجة الربط والربط البديل</td><td>يقصّون الإنترونات ويلصقون الإكسونات بترتيبين مختلفين ويعدّون البروتينات المحتملة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير سؤالًا مفصليًا والتقويم الختامي</td><td>يجيبون ويعللون اختلاف حجم ‎mRNA‎ الناضج عن النسخة الأولية</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الإنترونات؟</td><td>تتابعات غير مشفرة تُزال من نسخة ‎RNA‎ الأولية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا ينتج من ربط الإكسونات؟</td><td>جزيء ‎mRNA‎ ناضج يحمل التتابعات المشفرة فقط.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>نسخة أولية فيها 4 إكسونات؛ ماذا يعني الربط البديل لها؟</td><td>ربط إكسونات مختلفة أو بترتيبات مختلفة لإنتاج أكثر من ‎mRNA‎ وبالتالي أكثر من بروتين.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين تحدث معالجة ‎RNA‎ في الخلية حقيقية النواة؟</td><td>في النواة قبل مغادرة ‎mRNA‎ عبر الثقوب النووية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون ‎mRNA‎ الناضج أقصر من النسخة الأولية؟</td><td>لأن الإنترونات أُزيلت منها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>يحتوي جينوم الإنسان نحو 20 ألف جين لكنه ينتج عددًا أكبر بكثير من البروتينات. فسّر.</td><td>بسبب الربط البديل، إذ تُربط إكسونات الجين بطرائق مختلفة فينتج الجين الواحد عدة بروتينات.</td></tr></table>","<p><b>إرشاد للطالب:</b> قراءة ص 31 وكتابة تعريفات المصطلحات الأربعة الجديدة</p><p><b>إرشاد لولي الأمر:</b> مناقشة الابن في تشبيه «حذف الكلمات الزائدة» لشرح الإنترونات</p>"]},{"axis":"الترجمة: الرايبوسوم و‎tRNA‎ والكودون المضاد","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","بناء البروتين"],["الحصة","3 من 5"],["محور الحصة","الترجمة: الرايبوسوم و‎tRNA‎ والكودون المضاد"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 31–33"],["دليل المعلم","ص 57–61"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف عملية الترجمة على الرايبوسوم وتكوين الروابط الببتيدية\n2. يشرح دور ‎tRNA‎ والكودون المضاد في نقل الحمض الأميني المناسب\nمخرج تعليمي آخر: يحدد الكودون المضاد المقابل لكودون معطى","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","الترجمة، الرايبوسوم، الكودون، الكودون المضاد، ‎tRNA‎، الحمض الأميني، الرابطة الببتيدية، عديد الببتيد.","يسأل المعلم: «لدينا رسالة بلغة القواعد في ‎mRNA‎، ونحتاج إلى بناء جملة بلغة الأحماض الأمينية؛ من المترجم؟» ويعرض صورة رايبوسوم.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح سؤال المترجم ويعرض صورة الرايبوسوم\nالطالب: يقترحون جزيئات تقوم بدور المترجم\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات الترجمة: ارتباط ‎mRNA‎ بالرايبوسوم، ودخول ‎tRNA‎ بكودون مضاد متمم، وتكوين الرابطة الببتيدية، والانتقال، والإيقاف\nالطالب: يرتبون بطاقات خطوات الترجمة ترتيبًا صحيحًا\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يعرض مقطع محاكاة للترجمة ويوقفه عند كل خطوة للسؤال\nالطالب: يصفون ما يحدث عند كل توقف ويحددون الكودون والكودون المضاد\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا ويصححون مع زملائهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أين تحدث الترجمة؟\n   الإجابة النموذجية: على الرايبوسومات في السيتوبلازم.\n2) (المستوى المتوقع) السؤال: ما الكودون المضاد للكودون ‎AUG‎؟\n   الإجابة النموذجية: ‎UAC‎.\n3) (المستوى المتقدم) السؤال: ما الرابطة التي تتكون بين حمضين أمينيين متجاورين؟\n   الإجابة النموذجية: رابطة ببتيدية.","1) (مستوى الدعم) السؤال: ما وظيفة ‎tRNA‎؟\n   الإجابة النموذجية: نقل حمض أميني معين إلى الرايبوسوم ومطابقة كودونه المضاد مع الكودون على ‎mRNA‎.\n2) (المستوى المتوقع) السؤال: لماذا يجب أن يكون الكودون المضاد متممًا للكودون؟\n   الإجابة النموذجية: لضمان إضافة الحمض الأميني الصحيح الذي يشفره الكودون، فيتكون التتابع الصحيح لعديد الببتيد.\n3) (المستوى المتقدم) السؤال: ‎mRNA‎ فيه: ‎AUG-GCU-UGG-UAA‎. اكتب الكودونات المضادة لأول ثلاثة كودونات وفسّر سبب عدم وجود ‎tRNA‎ للأخير.\n   الإجابة النموذجية: ‎UAC‎، ‎CGA‎، ‎ACC‎؛ الأخير شيفرة إيقاف لا يقابلها ‎tRNA‎ فتتوقف الترجمة.","إرشاد للطالب: مراجعة ص 31–33 ورسم مخطط للترجمة يتضمن الرايبوسوم و‎tRNA‎\nإرشاد لولي الأمر: سؤال الابن: «ما الفرق بين الكودون والكودون المضاد؟»"],"h":["<ol class=\"ol\"><li>يصف عملية الترجمة على الرايبوسوم وتكوين الروابط الببتيدية</li><li>يشرح دور ‎tRNA‎ والكودون المضاد في نقل الحمض الأميني المناسب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد الكودون المضاد المقابل لكودون معطى</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف عملية الترجمة على الرايبوسوم وتكوين الروابط الببتيدية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح دور ‎tRNA‎ والكودون المضاد في نقل الحمض الأميني المناسب</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد الكودون المضاد المقابل لكودون معطى</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الترجمة، الرايبوسوم، الكودون، الكودون المضاد، ‎tRNA‎، الحمض الأميني، الرابطة الببتيدية، عديد الببتيد.</p>","<p>يسأل المعلم: «لدينا رسالة بلغة القواعد في ‎mRNA‎، ونحتاج إلى بناء جملة بلغة الأحماض الأمينية؛ من المترجم؟» ويعرض صورة رايبوسوم.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح سؤال المترجم ويعرض صورة الرايبوسوم</td><td>يقترحون جزيئات تقوم بدور المترجم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خطوات الترجمة: ارتباط ‎mRNA‎ بالرايبوسوم، ودخول ‎tRNA‎ بكودون مضاد متمم، وتكوين الرابطة الببتيدية، والانتقال، والإيقاف</td><td>يرتبون بطاقات خطوات الترجمة ترتيبًا صحيحًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يعرض مقطع محاكاة للترجمة ويوقفه عند كل خطوة للسؤال</td><td>يصفون ما يحدث عند كل توقف ويحددون الكودون والكودون المضاد</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا ويصححون مع زملائهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين تحدث الترجمة؟</td><td>على الرايبوسومات في السيتوبلازم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الكودون المضاد للكودون ‎AUG‎؟</td><td>‎UAC‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الرابطة التي تتكون بين حمضين أمينيين متجاورين؟</td><td>رابطة ببتيدية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة ‎tRNA‎؟</td><td>نقل حمض أميني معين إلى الرايبوسوم ومطابقة كودونه المضاد مع الكودون على ‎mRNA‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يجب أن يكون الكودون المضاد متممًا للكودون؟</td><td>لضمان إضافة الحمض الأميني الصحيح الذي يشفره الكودون، فيتكون التتابع الصحيح لعديد الببتيد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>‎mRNA‎ فيه: ‎AUG-GCU-UGG-UAA‎. اكتب الكودونات المضادة لأول ثلاثة كودونات وفسّر سبب عدم وجود ‎tRNA‎ للأخير.</td><td>‎UAC‎، ‎CGA‎، ‎ACC‎؛ الأخير شيفرة إيقاف لا يقابلها ‎tRNA‎ فتتوقف الترجمة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 31–33 ورسم مخطط للترجمة يتضمن الرايبوسوم و‎tRNA‎</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن: «ما الفرق بين الكودون والكودون المضاد؟»</p>"]},{"axis":"من الجين إلى عديد الببتيد: لعب أدوار بناء البروتين","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","بناء البروتين"],["الحصة","4 من 5"],["محور الحصة","من الجين إلى عديد الببتيد: لعب أدوار بناء البروتين"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 29–33"],["دليل المعلم","ص 57–61"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح\n2. يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم\nمخرج تعليمي آخر: يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: إبداع","- التعلم المبني على اللعب\n- التعلم التعاوني\n- لعب الأدوار","- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات أدوار وأسماء جزيئات وحبال ملونة","بناء البروتين، النسخ، الترجمة، الثقب النووي، الجين، عديد الببتيد، التسلسل الزمني.","يوزع المعلم بطاقات أدوار مقلوبة ويقول: «كل واحد منكم جزيء في الخلية؛ مهمتنا اليوم أن نصنع بروتينًا دون خطأ واحد».","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يوزع البطاقات ويشرح قواعد النشاط\nالطالب: يتعرفون أدوارهم ويحددون مواقعهم (نواة، سيتوبلازم، رايبوسوم)\n2) (18 دقيقة: من الدقيقة 4 إلى 22)\nالمعلم: يدير لعب أدوار بناء البروتين (نشاط دليل المعلم) ويتوقف عند كل مرحلة للسؤال\nالطالب: يمثلون النسخ وخروج ‎mRNA‎ والترجمة ويعلق «المراقبون» على الأخطاء\n3) (10 دقائق: من الدقيقة 22 إلى 32)\nالمعلم: يكلف المجموعات بإنشاء جدول زمني لبناء البروتين\nالطالب: يرتبون الأحداث زمنيًا ويكتبون موقع كل حدث\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات (5 أسئلة)\nالطالب: يتنافسون ويراجعون الأسئلة الخاطئة\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: رتب: الترجمة، النسخ، خروج ‎mRNA‎ من النواة.\n   الإجابة النموذجية: النسخ، ثم خروج ‎mRNA‎ من النواة، ثم الترجمة.\n2) (المستوى المتوقع) السؤال: ما الجزيء الذي يحمل الرسالة من النواة إلى الرايبوسوم؟\n   الإجابة النموذجية: ‎mRNA‎.\n3) (المستوى المتقدم) السؤال: لو تعطل خروج ‎mRNA‎ عبر الثقوب النووية، فأي مرحلة تتوقف؟\n   الإجابة النموذجية: الترجمة، لأن ‎mRNA‎ لن يصل إلى الرايبوسومات.","1) (مستوى الدعم) السؤال: اذكر مرحلتي بناء البروتين وموقع كل منهما.\n   الإجابة النموذجية: النسخ في النواة، والترجمة على الرايبوسومات في السيتوبلازم.\n2) (المستوى المتوقع) السؤال: ارسم مخططًا انسيابيًا مبسطًا لبناء البروتين يتضمن: نواة، ثقب نووي، ‎DNA‎، ‎mRNA‎، نسخ، ترجمة، رايبوسوم، ‎tRNA‎، حمض أميني، عديد ببتيد.\n   الإجابة النموذجية: مخطط صحيح التسلسل: ‎DNA‎ في النواة ← نسخ ← ‎mRNA ←‎ ثقب نووي ← رايبوسوم ← ‎tRNA‎ يحمل حمضًا أمينيًا ← ترجمة ← عديد ببتيد.\n3) (المستوى المتقدم) السؤال: قيّم: «الرايبوسوم يقرأ ‎DNA‎ مباشرة».\n   الإجابة النموذجية: غير صحيحة؛ الرايبوسوم يقرأ ‎mRNA‎ المنسوخ من ‎DNA‎، أما ‎DNA‎ فيبقى في النواة.","إرشاد للطالب: كتابة الجدول الزمني لبناء البروتين بشكل نهائي ومراجعة ص 29–33\nإرشاد لولي الأمر: تشجيع الابن على شرح بناء البروتين بتشبيه من الحياة اليومية"],"h":["<ol class=\"ol\"><li>يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح</li><li>يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد</td><td class=\"lv\">إبداع</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">لعب الأدوار</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: بطاقات أدوار وأسماء جزيئات وحبال ملونة</span></div>","<p>بناء البروتين، النسخ، الترجمة، الثقب النووي، الجين، عديد الببتيد، التسلسل الزمني.</p>","<p>يوزع المعلم بطاقات أدوار مقلوبة ويقول: «كل واحد منكم جزيء في الخلية؛ مهمتنا اليوم أن نصنع بروتينًا دون خطأ واحد».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يوزع البطاقات ويشرح قواعد النشاط</td><td>يتعرفون أدوارهم ويحددون مواقعهم (نواة، سيتوبلازم، رايبوسوم)</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–22</span><br><small>18 دقيقة</small></td><td>يدير لعب أدوار بناء البروتين (نشاط دليل المعلم) ويتوقف عند كل مرحلة للسؤال</td><td>يمثلون النسخ وخروج ‎mRNA‎ والترجمة ويعلق «المراقبون» على الأخطاء</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">22–32</span><br><small>10 دقائق</small></td><td>يكلف المجموعات بإنشاء جدول زمني لبناء البروتين</td><td>يرتبون الأحداث زمنيًا ويكتبون موقع كل حدث</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات (5 أسئلة)</td><td>يتنافسون ويراجعون الأسئلة الخاطئة</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>رتب: الترجمة، النسخ، خروج ‎mRNA‎ من النواة.</td><td>النسخ، ثم خروج ‎mRNA‎ من النواة، ثم الترجمة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الجزيء الذي يحمل الرسالة من النواة إلى الرايبوسوم؟</td><td>‎mRNA‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لو تعطل خروج ‎mRNA‎ عبر الثقوب النووية، فأي مرحلة تتوقف؟</td><td>الترجمة، لأن ‎mRNA‎ لن يصل إلى الرايبوسومات.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر مرحلتي بناء البروتين وموقع كل منهما.</td><td>النسخ في النواة، والترجمة على الرايبوسومات في السيتوبلازم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ارسم مخططًا انسيابيًا مبسطًا لبناء البروتين يتضمن: نواة، ثقب نووي، ‎DNA‎، ‎mRNA‎، نسخ، ترجمة، رايبوسوم، ‎tRNA‎، حمض أميني، عديد ببتيد.</td><td>مخطط صحيح التسلسل: ‎DNA‎ في النواة ← نسخ ← ‎mRNA ←‎ ثقب نووي ← رايبوسوم ← ‎tRNA‎ يحمل حمضًا أمينيًا ← ترجمة ← عديد ببتيد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم: «الرايبوسوم يقرأ ‎DNA‎ مباشرة».</td><td>غير صحيحة؛ الرايبوسوم يقرأ ‎mRNA‎ المنسوخ من ‎DNA‎، أما ‎DNA‎ فيبقى في النواة.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة الجدول الزمني لبناء البروتين بشكل نهائي ومراجعة ص 29–33</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح بناء البروتين بتشبيه من الحياة اليومية</p>"]},{"axis":"مسائل تطبيقية في بناء البروتين وحل السؤال 8","n":5,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","بناء البروتين"],["الحصة","5 من 5"],["محور الحصة","مسائل تطبيقية في بناء البروتين وحل السؤال 8"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 32–33"],["دليل المعلم","ص 57–61"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين\n2. يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل\nمخرج تعليمي آخر: يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: جدول الشيفرة الجينية (الملحق 2)","النسبة بين القواعد والكودونات والأحماض الأمينية، الملحق 2، الترجمة العكسية، تتابع الأحماض الأمينية.","يطرح المعلم لغزًا: «بروتين من 150 حمضًا أمينيًا؛ كم قاعدة على الأقل في ‎mRNA‎ الناضج الذي يشفره؟» ويمنح دقيقتين للتفكير.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح اللغز ويستقبل الحلول\nالطالب: يحسبون ويشرحون: ‎150 × 3 + 3‎ لشيفرة الإيقاف = 453\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يحل مثالًا متدرجًا: من شريط القالب إلى ‎mRNA‎ إلى ‎tRNA‎ إلى أحماض أمينية باستخدام الملحق 2\nالطالب: يتابعون الحل ويكملون الجداول\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يوجه حل السؤال 8 ومسائل إضافية في مجموعات\nالطالب: يحلون المسائل ويعرضون الحلول على السبورة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على مسائل بناء البروتين\nالطالب: يتنافسون في المسابقة\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كم كودونًا في ‎mRNA‎ يشفر 50 حمضًا أمينيًا مع شيفرة إيقاف؟\n   الإجابة النموذجية: 51 كودونًا.\n2) (المستوى المتوقع) السؤال: حوّل شريط القالب ‎TAC-AAA‎ إلى ‎mRNA‎.\n   الإجابة النموذجية: ‎AUG-UUU‎.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لعديد الببتيد إذا تحول الكودون الثالث إلى شيفرة إيقاف؟\n   الإجابة النموذجية: يتوقف عند حمضين أمينيين فقط فيكون قصيرًا وغالبًا غير وظيفي.","1) (مستوى الدعم) السؤال: ما عدد القواعد في ‎mRNA‎ الناضج الذي يشفر عديد ببتيد من 100 حمض أميني؟\n   الإجابة النموذجية: 300 قاعدة للأحماض + 3 لشيفرة الإيقاف = 303 قاعدة على الأقل.\n2) (المستوى المتوقع) السؤال: كودونا ‎mRNA: GGU‎ و‎GGC‎ يشفران الجلايسين. ماذا يدل ذلك عليه؟\n   الإجابة النموذجية: على أن الشيفرة منحلة (أكثر من كودون للحمض الأميني نفسه).\n3) (المستوى المتقدم) السؤال: لماذا قد يكون الجين في ‎DNA‎ أطول بكثير من 3 أضعاف عدد الأحماض الأمينية؟\n   الإجابة النموذجية: لوجود الإنترونات وتتابعات تنظيمية غير مشفرة تُزال أو لا تُترجم.","إرشاد للطالب: حل السؤال 8 ومسألتين إضافيتين ومراجعة الملحق 2\nإرشاد لولي الأمر: متابعة الابن في التدرب على مسائل الحساب"],"h":["<ol class=\"ol\"><li>يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين</li><li>يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: جدول الشيفرة الجينية (الملحق 2)</span></div>","<p>النسبة بين القواعد والكودونات والأحماض الأمينية، الملحق 2، الترجمة العكسية، تتابع الأحماض الأمينية.</p>","<p>يطرح المعلم لغزًا: «بروتين من 150 حمضًا أمينيًا؛ كم قاعدة على الأقل في ‎mRNA‎ الناضج الذي يشفره؟» ويمنح دقيقتين للتفكير.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح اللغز ويستقبل الحلول</td><td>يحسبون ويشرحون: ‎150 × 3 + 3‎ لشيفرة الإيقاف = 453</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يحل مثالًا متدرجًا: من شريط القالب إلى ‎mRNA‎ إلى ‎tRNA‎ إلى أحماض أمينية باستخدام الملحق 2</td><td>يتابعون الحل ويكملون الجداول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوجه حل السؤال 8 ومسائل إضافية في مجموعات</td><td>يحلون المسائل ويعرضون الحلول على السبورة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات على مسائل بناء البروتين</td><td>يتنافسون في المسابقة</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كم كودونًا في ‎mRNA‎ يشفر 50 حمضًا أمينيًا مع شيفرة إيقاف؟</td><td>51 كودونًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>حوّل شريط القالب ‎TAC-AAA‎ إلى ‎mRNA‎.</td><td>‎AUG-UUU‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث لعديد الببتيد إذا تحول الكودون الثالث إلى شيفرة إيقاف؟</td><td>يتوقف عند حمضين أمينيين فقط فيكون قصيرًا وغالبًا غير وظيفي.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما عدد القواعد في ‎mRNA‎ الناضج الذي يشفر عديد ببتيد من 100 حمض أميني؟</td><td>300 قاعدة للأحماض + 3 لشيفرة الإيقاف = 303 قاعدة على الأقل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كودونا ‎mRNA: GGU‎ و‎GGC‎ يشفران الجلايسين. ماذا يدل ذلك عليه؟</td><td>على أن الشيفرة منحلة (أكثر من كودون للحمض الأميني نفسه).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا قد يكون الجين في ‎DNA‎ أطول بكثير من 3 أضعاف عدد الأحماض الأمينية؟</td><td>لوجود الإنترونات وتتابعات تنظيمية غير مشفرة تُزال أو لا تُترجم.</td></tr></table>","<p><b>إرشاد للطالب:</b> حل السؤال 8 ومسألتين إضافيتين ومراجعة الملحق 2</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في التدرب على مسائل الحساب</p>"]}]},{"title":"الطفرات الجينية","sb":"ص 34–44","unit":"الوحدة 1: الأحماض النووية وبناء البروتين","periods":[{"axis":"مفهوم الطفرة الجينية وطفرة الاستبدال","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الطفرات الجينية"],["الحصة","1 من 5"],["محور الحصة","مفهوم الطفرة الجينية وطفرة الاستبدال"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 34–35"],["دليل المعلم","ص 62–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]],"t":["1. يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف\n2. يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني\nمخرج تعليمي آخر: يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: جدول الشيفرة الجينية (الملحق 2)","الطفرة الجينية، الأليل، الاستبدال، الطفرة الصامتة، تغير الحمض الأميني، شيفرة إيقاف مبكرة.","يكتب المعلم جملة: «سار الولد إلى الدار» ثم يغير حرفًا واحدًا: «سال الولد إلى الدار»، ويسأل: «كيف يغير حرف واحد المعنى؟ وهل يحدث ذلك في ‎DNA‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الجملتين ويستثير المقارنة\nالطالب: يحددون الحرف المتغير وأثره في المعنى\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يعرّف الطفرة الجينية ويشرح طفرة الاستبدال بأمثلة من الملحق 2\nالطالب: يحددون أثر استبدال قاعدة في ثلاثية على الحمض الأميني\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يوزع تتابعات على المجموعات لإحداث استبدالات وتحليل أثرها (صامتة، تغير حمض، إيقاف مبكر)\nالطالب: يصنفون نتائج كل استبدال ويعرضونها\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون ويناقشون لماذا لا تؤثر بعض الطفرات\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف الطفرة الجينية.\n   الإجابة النموذجية: تغير في تتابع أزواج القواعد في جزيء ‎DNA‎ قد يؤدي إلى تكوين عديد ببتيد مختلف.\n2) (المستوى المتوقع) السؤال: كيف يؤدي الاستبدال إلى طفرة صامتة؟\n   الإجابة النموذجية: عندما يتحول الكودون إلى كودون آخر يشفر الحمض الأميني نفسه بسبب انحلال الشيفرة.\n3) (المستوى المتقدم) السؤال: ما أثر استبدال يحول كودونًا إلى شيفرة إيقاف؟\n   الإجابة النموذجية: توقف مبكر للترجمة وعديد ببتيد قصير غالبًا غير وظيفي.","1) (مستوى الدعم) السؤال: ما الأليل؟\n   الإجابة النموذجية: أحد الأشكال المختلفة للجين نفسه، وينشأ الأليل الجديد بالطفرة.\n2) (المستوى المتوقع) السؤال: فسّر: طفرة الاستبدال تؤثر غالبًا في حمض أميني واحد فقط.\n   الإجابة النموذجية: لأن إطار القراءة لا يتغير، فيتأثر الكودون الذي حدث فيه الاستبدال فقط.\n3) (المستوى المتقدم) السؤال: كودون ‎DNA (‎القالب) ‎CTT‎ يشفر حمض الجلوتاميك؛ أصبح ‎CAT‎. ماذا يحدث في ‎mRNA‎ والحمض الأميني؟\n   الإجابة النموذجية: يتحول كودون ‎mRNA‎ من ‎GAA‎ إلى ‎GUA‎، فيحل الفالين محل حمض الجلوتاميك.","إرشاد للطالب: مراجعة ص 34–35 وكتابة مثال لطفرة استبدال صامتة وآخر مغيِّر للحمض الأميني\nإرشاد لولي الأمر: سؤال الابن عن مثال جملة يغير فيها حرف واحد المعنى ومقارنته بالطفرة"],"h":["<ol class=\"ol\"><li>يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف</li><li>يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: جدول الشيفرة الجينية (الملحق 2)</span></div>","<p>الطفرة الجينية، الأليل، الاستبدال، الطفرة الصامتة، تغير الحمض الأميني، شيفرة إيقاف مبكرة.</p>","<p>يكتب المعلم جملة: «سار الولد إلى الدار» ثم يغير حرفًا واحدًا: «سال الولد إلى الدار»، ويسأل: «كيف يغير حرف واحد المعنى؟ وهل يحدث ذلك في ‎DNA‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الجملتين ويستثير المقارنة</td><td>يحددون الحرف المتغير وأثره في المعنى</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يعرّف الطفرة الجينية ويشرح طفرة الاستبدال بأمثلة من الملحق 2</td><td>يحددون أثر استبدال قاعدة في ثلاثية على الحمض الأميني</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوزع تتابعات على المجموعات لإحداث استبدالات وتحليل أثرها (صامتة، تغير حمض، إيقاف مبكر)</td><td>يصنفون نتائج كل استبدال ويعرضونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون ويناقشون لماذا لا تؤثر بعض الطفرات</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف الطفرة الجينية.</td><td>تغير في تتابع أزواج القواعد في جزيء ‎DNA‎ قد يؤدي إلى تكوين عديد ببتيد مختلف.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يؤدي الاستبدال إلى طفرة صامتة؟</td><td>عندما يتحول الكودون إلى كودون آخر يشفر الحمض الأميني نفسه بسبب انحلال الشيفرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما أثر استبدال يحول كودونًا إلى شيفرة إيقاف؟</td><td>توقف مبكر للترجمة وعديد ببتيد قصير غالبًا غير وظيفي.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأليل؟</td><td>أحد الأشكال المختلفة للجين نفسه، وينشأ الأليل الجديد بالطفرة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>فسّر: طفرة الاستبدال تؤثر غالبًا في حمض أميني واحد فقط.</td><td>لأن إطار القراءة لا يتغير، فيتأثر الكودون الذي حدث فيه الاستبدال فقط.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كودون ‎DNA (‎القالب) ‎CTT‎ يشفر حمض الجلوتاميك؛ أصبح ‎CAT‎. ماذا يحدث في ‎mRNA‎ والحمض الأميني؟</td><td>يتحول كودون ‎mRNA‎ من ‎GAA‎ إلى ‎GUA‎، فيحل الفالين محل حمض الجلوتاميك.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 34–35 وكتابة مثال لطفرة استبدال صامتة وآخر مغيِّر للحمض الأميني</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن مثال جملة يغير فيها حرف واحد المعنى ومقارنته بالطفرة</p>"]},{"axis":"الإدخال والحذف وطفرة انزياح الإطار","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الطفرات الجينية"],["الحصة","2 من 5"],["محور الحصة","الإدخال والحذف وطفرة انزياح الإطار"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 35–36"],["دليل المعلم","ص 62–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]],"t":["1. يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة\n2. يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد\nمخرج تعليمي آخر: يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم بالاكتشاف\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات ثلاثيات قابلة للتحريك","الإدخال، الحذف، إطار القراءة، طفرة انزياح الإطار، الثلاثيات المتأثرة.","يكتب المعلم: «قطّ كبر نام» مقسمة ثلاثيات، ثم يحذف الحرف الأول ويعيد التقسيم: «طّكبرنام...» ويسأل: «ماذا حدث للمعنى؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المثال ويناقش انزياح التقسيم\nالطالب: يلاحظون تغير جميع المقاطع بعد الحذف\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الإدخال والحذف بمثال ‎TAG‎ المتكرر في كتاب الطالب ص 35–36\nالطالب: يكتبون التتابع بعد الحذف والإدخال ويقسمونه ثلاثيات\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: ينظم لعبة «ثلاثيات متحركة»: كل مجموعة تحدث طفرة وتطلب من الأخرى تحديد نوعها\nالطالب: يتبادلون الطفرات ويحللون الأثر على الأحماض الأمينية\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير سؤالًا مفصليًا عن أشد الطفرات أثرًا ثم التقويم الختامي\nالطالب: يرتبون الطفرات حسب شدة الأثر ويعللون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما المقصود بإطار القراءة؟\n   الإجابة النموذجية: طريقة تقسيم تتابع القواعد إلى ثلاثيات متتالية بدءًا من شيفرة البدء.\n2) (المستوى المتوقع) السؤال: لماذا تسمى طفرة الحذف طفرة انزياح الإطار؟\n   الإجابة النموذجية: لأن حذف قاعدة يزيح التقسيم بمقدار قاعدة فتتغير كل الثلاثيات بعدها.\n3) (المستوى المتقدم) السؤال: أيهما أشد أثرًا عادة: حذف قاعدة قرب بداية الجين أم قرب نهايته؟\n   الإجابة النموذجية: قرب البداية، لأن عدد الثلاثيات المتأثرة بعد الطفرة أكبر.","1) (مستوى الدعم) السؤال: اكتب التتابع ‎TAGTAGTAG‎ بعد إدخال ‎A‎ بعد القاعدة الأولى.\n   الإجابة النموذجية: ‎TAAGTAGTAG ←‎ الثلاثيات: ‎TAA-GTA-GTA-G‎، فتتغير كل الثلاثيات.\n2) (المستوى المتوقع) السؤال: لماذا يكون بروتين طفرة الانزياح غالبًا غير فعّال؟\n   الإجابة النموذجية: لأن الأحماض الأمينية بعد الطفرة تتغير كلها وقد تظهر شيفرة إيقاف مبكرة فيتغير شكل البروتين ووظيفته.\n3) (المستوى المتقدم) السؤال: قيّم: «حذف ثلاث قواعد متتالية أخطر من حذف قاعدة واحدة».\n   الإجابة النموذجية: غالبًا غير صحيحة؛ حذف ثلاث قواعد متتالية يزيل حمضًا أمينيًا واحدًا (أو يغير اثنين) دون انزياح الإطار، بينما حذف قاعدة واحدة يغير كل الثلاثيات اللاحقة.","إرشاد للطالب: حل تدريبات الإدخال والحذف ومراجعة ص 35–36\nإرشاد لولي الأمر: سؤال الابن عن معنى «انزياح الإطار» بمثال من كلمات عربية"],"h":["<ol class=\"ol\"><li>يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة</li><li>يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: بطاقات ثلاثيات قابلة للتحريك</span></div>","<p>الإدخال، الحذف، إطار القراءة، طفرة انزياح الإطار، الثلاثيات المتأثرة.</p>","<p>يكتب المعلم: «قطّ كبر نام» مقسمة ثلاثيات، ثم يحذف الحرف الأول ويعيد التقسيم: «طّكبرنام...» ويسأل: «ماذا حدث للمعنى؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض المثال ويناقش انزياح التقسيم</td><td>يلاحظون تغير جميع المقاطع بعد الحذف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الإدخال والحذف بمثال ‎TAG‎ المتكرر في كتاب الطالب ص 35–36</td><td>يكتبون التتابع بعد الحذف والإدخال ويقسمونه ثلاثيات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>ينظم لعبة «ثلاثيات متحركة»: كل مجموعة تحدث طفرة وتطلب من الأخرى تحديد نوعها</td><td>يتبادلون الطفرات ويحللون الأثر على الأحماض الأمينية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير سؤالًا مفصليًا عن أشد الطفرات أثرًا ثم التقويم الختامي</td><td>يرتبون الطفرات حسب شدة الأثر ويعللون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بإطار القراءة؟</td><td>طريقة تقسيم تتابع القواعد إلى ثلاثيات متتالية بدءًا من شيفرة البدء.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تسمى طفرة الحذف طفرة انزياح الإطار؟</td><td>لأن حذف قاعدة يزيح التقسيم بمقدار قاعدة فتتغير كل الثلاثيات بعدها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أيهما أشد أثرًا عادة: حذف قاعدة قرب بداية الجين أم قرب نهايته؟</td><td>قرب البداية، لأن عدد الثلاثيات المتأثرة بعد الطفرة أكبر.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب التتابع ‎TAGTAGTAG‎ بعد إدخال ‎A‎ بعد القاعدة الأولى.</td><td>‎TAAGTAGTAG ←‎ الثلاثيات: ‎TAA-GTA-GTA-G‎، فتتغير كل الثلاثيات.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون بروتين طفرة الانزياح غالبًا غير فعّال؟</td><td>لأن الأحماض الأمينية بعد الطفرة تتغير كلها وقد تظهر شيفرة إيقاف مبكرة فيتغير شكل البروتين ووظيفته.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم: «حذف ثلاث قواعد متتالية أخطر من حذف قاعدة واحدة».</td><td>غالبًا غير صحيحة؛ حذف ثلاث قواعد متتالية يزيل حمضًا أمينيًا واحدًا (أو يغير اثنين) دون انزياح الإطار، بينما حذف قاعدة واحدة يغير كل الثلاثيات اللاحقة.</td></tr></table>","<p><b>إرشاد للطالب:</b> حل تدريبات الإدخال والحذف ومراجعة ص 35–36</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن معنى «انزياح الإطار» بمثال من كلمات عربية</p>"]},{"axis":"فقر الدم المنجلي: من طفرة إلى مرض","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الطفرات الجينية"],["الحصة","3 من 5"],["محور الحصة","فقر الدم المنجلي: من طفرة إلى مرض"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 34–35"],["دليل المعلم","ص 62–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]],"t":["1. يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين\n2. يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها\nمخرج تعليمي آخر: يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- دراسة الحالة","- الكتاب\n- جهاز عرض البيانات\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","فقر الدم المنجلي، الهيموجلوبين، أليل ‎HbS‎، أليل ‎HbA‎، حمض الجلوتاميك، الفالين، الخلايا المنجلية.","يعرض المعلم صورة مجهرية لخلايا دم حمراء منجلية وطبيعية ويسأل: «ما الذي حوّل هذه الخلية إلى منجل؟» ويذكّر بتركيب الهيموجلوبين.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة المجهرية ويستقبل الفرضيات\nالطالب: يقارنون شكل الخليتين ويقترحون أسبابًا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح استبدال قاعدة في جين سلسلة β ‎(CTT→CAT)‎ وحلول الفالين محل حمض الجلوتاميك\nالطالب: يتتبعون التغير من ‎DNA‎ إلى ‎mRNA‎ إلى الحمض الأميني\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم دراسة حالة مريض ويطلب سلسلة سبب ونتيجة من الطفرة إلى الأعراض\nالطالب: يكتبون سلسلة السبب والنتيجة في مجموعات ويعرضونها\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الحمض الأميني الذي يحل محل حمض الجلوتاميك في ‎HbS‎؟\n   الإجابة النموذجية: الفالين.\n2) (المستوى المتوقع) السؤال: ما نوع الطفرة في فقر الدم المنجلي؟\n   الإجابة النموذجية: طفرة استبدال قاعدة واحدة.\n3) (المستوى المتقدم) السؤال: لماذا تسبب الخلايا المنجلية انسداد الشعيرات الدموية؟\n   الإجابة النموذجية: لأن شكلها المنجلي غير المرن يجعلها تتكدس وتعلق في الشعيرات الضيقة.","1) (مستوى الدعم) السؤال: ما الجين المصاب في فقر الدم المنجلي؟\n   الإجابة النموذجية: جين سلسلة β في الهيموجلوبين.\n2) (المستوى المتوقع) السؤال: اكتب سلسلة مختصرة من الطفرة إلى ظهور الأعراض.\n   الإجابة النموذجية: استبدال قاعدة ← تغير كودون ← فالين بدل جلوتاميك ← تكتل جزيئات الهيموجلوبين عند انخفاض الأكسجين ← خلايا منجلية ← انسداد الشعيرات ونقص نقل الأكسجين ← ألم وفقر دم.\n3) (المستوى المتقدم) السؤال: لماذا لا تظهر الأعراض الشديدة لدى الشخص ‎HbA HbS‎ غالبًا؟\n   الإجابة النموذجية: لأن أليل ‎HbA‎ ينتج هيموجلوبينًا طبيعيًا كافيًا لمنع تكون معظم الخلايا المنجلية في الظروف العادية.","إرشاد للطالب: مراجعة ص 34–35 وكتابة سلسلة السبب والنتيجة لفقر الدم المنجلي\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن أهمية فحص ما قبل الزواج في سلطنة عُمان للوقاية من أمراض الدم الوراثية"],"h":["<ol class=\"ol\"><li>يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين</li><li>يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">دراسة الحالة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>فقر الدم المنجلي، الهيموجلوبين، أليل ‎HbS‎، أليل ‎HbA‎، حمض الجلوتاميك، الفالين، الخلايا المنجلية.</p>","<p>يعرض المعلم صورة مجهرية لخلايا دم حمراء منجلية وطبيعية ويسأل: «ما الذي حوّل هذه الخلية إلى منجل؟» ويذكّر بتركيب الهيموجلوبين.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة المجهرية ويستقبل الفرضيات</td><td>يقارنون شكل الخليتين ويقترحون أسبابًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح استبدال قاعدة في جين سلسلة β ‎(CTT→CAT)‎ وحلول الفالين محل حمض الجلوتاميك</td><td>يتتبعون التغير من ‎DNA‎ إلى ‎mRNA‎ إلى الحمض الأميني</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم دراسة حالة مريض ويطلب سلسلة سبب ونتيجة من الطفرة إلى الأعراض</td><td>يكتبون سلسلة السبب والنتيجة في مجموعات ويعرضونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الحمض الأميني الذي يحل محل حمض الجلوتاميك في ‎HbS‎؟</td><td>الفالين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما نوع الطفرة في فقر الدم المنجلي؟</td><td>طفرة استبدال قاعدة واحدة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تسبب الخلايا المنجلية انسداد الشعيرات الدموية؟</td><td>لأن شكلها المنجلي غير المرن يجعلها تتكدس وتعلق في الشعيرات الضيقة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الجين المصاب في فقر الدم المنجلي؟</td><td>جين سلسلة β في الهيموجلوبين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب سلسلة مختصرة من الطفرة إلى ظهور الأعراض.</td><td>استبدال قاعدة ← تغير كودون ← فالين بدل جلوتاميك ← تكتل جزيئات الهيموجلوبين عند انخفاض الأكسجين ← خلايا منجلية ← انسداد الشعيرات ونقص نقل الأكسجين ← ألم وفقر دم.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تظهر الأعراض الشديدة لدى الشخص ‎HbA HbS‎ غالبًا؟</td><td>لأن أليل ‎HbA‎ ينتج هيموجلوبينًا طبيعيًا كافيًا لمنع تكون معظم الخلايا المنجلية في الظروف العادية.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 34–35 وكتابة سلسلة السبب والنتيجة لفقر الدم المنجلي</p><p><b>إرشاد لولي الأمر:</b> يمكن الحديث مع الابن عن أهمية فحص ما قبل الزواج في سلطنة عُمان للوقاية من أمراض الدم الوراثية</p>"]},{"axis":"نشاط 1-2: كتابة إجابات جيدة والسؤالان 9 و10","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الطفرات الجينية"],["الحصة","4 من 5"],["محور الحصة","نشاط 1-2: كتابة إجابات جيدة والسؤالان 9 و10"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 36 + كتاب التجارب ص 28"],["دليل المعلم","ص 62–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]],"t":["1. يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9\n2. يكتب إجابات علمية دقيقة مكتملة وفق معايير نشاط 1-2\nمخرج تعليمي آخر: يقيّم إجابات نموذجية مختلفة ويحدد نقاط القوة والضعف فيها","المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم التشاركي\n- التقييم الذاتي","- الكتاب\n- الأقلام\n- أخرى: كتاب التجارب العملية والأنشطة","الإجابة الجيدة، الأفعال الإجرائية (صف، اشرح، قارن)، المصطلح العلمي، جدول المقارنة.","يعرض المعلم إجابتين لسؤال واحد إحداهما مختصرة غامضة والأخرى دقيقة، ويسأل: «أيهما تمنحها الدرجة الكاملة؟ ولماذا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الإجابتين ويناقش معايير الإجابة الجيدة\nالطالب: يحددون الفروق ويستنتجون المعايير\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 1-2 في كتاب التجارب ص 28\nالطالب: يكتبون الإجابات وفق الأفعال الإجرائية\n3) (12 دقيقة: من الدقيقة 20 إلى 32)\nالمعلم: يوجه حل السؤالين 9 و10 في كتاب الطالب ص 36\nالطالب: يكملون جدول ‎DNA‎ و‎mRNA‎ ويرسمون المخطط الانسيابي\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: ينظم تقييمًا تبادليًا للإجابات بمعايير محددة\nالطالب: يقيّمون إجابات زملائهم ويقدمون تغذية راجعة\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الفرق بين الفعلين «صف» و«اشرح»؟\n   الإجابة النموذجية: «صف» تذكر ما يحدث، و«اشرح» تذكر ما يحدث مع السبب.\n2) (المستوى المتوقع) السؤال: اذكر فرقين بين ‎DNA‎ و‎mRNA‎ من حيث الموقع والوظيفة.\n   الإجابة النموذجية: ‎DNA‎ في النواة ويخزن المعلومات الوراثية؛ ‎mRNA‎ ينتقل إلى السيتوبلازم وينقل نسخة الجين إلى الرايبوسوم.\n3) (المستوى المتقدم) السؤال: حسّن الإجابة: «الطفرة تغير البروتين».\n   الإجابة النموذجية: الطفرة تغير تتابع القواعد في ‎DNA‎، فتتغير الكودونات في ‎mRNA‎، وقد يتغير تتابع الأحماض الأمينية فيتغير شكل البروتين ووظيفته.","1) (مستوى الدعم) السؤال: قارن بين ‎DNA‎ و‎mRNA‎ من حيث عدد الأشرطة ونوع السكر.\n   الإجابة النموذجية: ‎DNA‎ شريطان وسكره ديؤكسي رايبوز؛ ‎mRNA‎ شريط واحد وسكره رايبوز.\n2) (المستوى المتوقع) السؤال: صِف مراحل بناء البروتين في ثلاث جمل.\n   الإجابة النموذجية: يُنسخ الجين إلى ‎mRNA‎ في النواة، ثم يخرج ‎mRNA‎ إلى الرايبوسوم، ثم تُترجم كودوناته إلى أحماض أمينية بواسطة ‎tRNA‎.\n3) (المستوى المتقدم) السؤال: اشرح لماذا يُعدّ ‎mRNA‎ وسيطًا ضروريًا بين ‎DNA‎ والبروتين في حقيقيات النواة.\n   الإجابة النموذجية: لأن ‎DNA‎ يبقى في النواة ولا يغادرها، بينما يحدث بناء البروتين على الرايبوسومات في السيتوبلازم، فيحمل ‎mRNA‎ نسخة من الجين إليها.","إرشاد للطالب: إكمال نشاط 1-2 في كتاب التجارب ص 28 والسؤالين 9 و10\nإرشاد لولي الأمر: تشجيع الابن على قراءة إجاباته بصوت مرتفع والتأكد من استخدامه المصطلحات العلمية"],"h":["<ol class=\"ol\"><li>يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9</li><li>يكتب إجابات علمية دقيقة مكتملة وفق معايير نشاط 1-2</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم إجابات نموذجية مختلفة ويحدد نقاط القوة والضعف فيها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب إجابات علمية دقيقة مكتملة وفق معايير نشاط 1-2</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم إجابات نموذجية مختلفة ويحدد نقاط القوة والضعف فيها</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التقييم الذاتي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الإجابة الجيدة، الأفعال الإجرائية (صف، اشرح، قارن)، المصطلح العلمي، جدول المقارنة.</p>","<p>يعرض المعلم إجابتين لسؤال واحد إحداهما مختصرة غامضة والأخرى دقيقة، ويسأل: «أيهما تمنحها الدرجة الكاملة؟ ولماذا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الإجابتين ويناقش معايير الإجابة الجيدة</td><td>يحددون الفروق ويستنتجون المعايير</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-2 في كتاب التجارب ص 28</td><td>يكتبون الإجابات وفق الأفعال الإجرائية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–32</span><br><small>12 دقيقة</small></td><td>يوجه حل السؤالين 9 و10 في كتاب الطالب ص 36</td><td>يكملون جدول ‎DNA‎ و‎mRNA‎ ويرسمون المخطط الانسيابي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>ينظم تقييمًا تبادليًا للإجابات بمعايير محددة</td><td>يقيّمون إجابات زملائهم ويقدمون تغذية راجعة</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الفرق بين الفعلين «صف» و«اشرح»؟</td><td>«صف» تذكر ما يحدث، و«اشرح» تذكر ما يحدث مع السبب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر فرقين بين ‎DNA‎ و‎mRNA‎ من حيث الموقع والوظيفة.</td><td>‎DNA‎ في النواة ويخزن المعلومات الوراثية؛ ‎mRNA‎ ينتقل إلى السيتوبلازم وينقل نسخة الجين إلى الرايبوسوم.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>حسّن الإجابة: «الطفرة تغير البروتين».</td><td>الطفرة تغير تتابع القواعد في ‎DNA‎، فتتغير الكودونات في ‎mRNA‎، وقد يتغير تتابع الأحماض الأمينية فيتغير شكل البروتين ووظيفته.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>قارن بين ‎DNA‎ و‎mRNA‎ من حيث عدد الأشرطة ونوع السكر.</td><td>‎DNA‎ شريطان وسكره ديؤكسي رايبوز؛ ‎mRNA‎ شريط واحد وسكره رايبوز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صِف مراحل بناء البروتين في ثلاث جمل.</td><td>يُنسخ الجين إلى ‎mRNA‎ في النواة، ثم يخرج ‎mRNA‎ إلى الرايبوسوم، ثم تُترجم كودوناته إلى أحماض أمينية بواسطة ‎tRNA‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اشرح لماذا يُعدّ ‎mRNA‎ وسيطًا ضروريًا بين ‎DNA‎ والبروتين في حقيقيات النواة.</td><td>لأن ‎DNA‎ يبقى في النواة ولا يغادرها، بينما يحدث بناء البروتين على الرايبوسومات في السيتوبلازم، فيحمل ‎mRNA‎ نسخة من الجين إليها.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-2 في كتاب التجارب ص 28 والسؤالين 9 و10</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على قراءة إجاباته بصوت مرتفع والتأكد من استخدامه المصطلحات العلمية</p>"]},{"axis":"مراجعة الوحدة الأولى: نشاط 1-3 وأسئلة نهاية الوحدة","n":5,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الطفرات الجينية"],["الحصة","5 من 5"],["محور الحصة","مراجعة الوحدة الأولى: نشاط 1-3 وأسئلة نهاية الوحدة"],["الأسبوع والتاريخ","الأسبوع الرابع (27/9–1/10/2026)"],["كتاب الطالب","ص 37–44 + كتاب التجارب ص 29"],["دليل المعلم","ص 62–65"],["كتاب التجارب العملية والأنشطة","نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]],"t":["1. يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم\n2. يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين\nمخرج تعليمي آخر: يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي","المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب\n- خريطة المفاهيم","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","الملخص، خريطة المفاهيم، قائمة التقويم الذاتي، أسئلة نهاية الوحدة.","يكتب المعلم في وسط السبورة «‎DNA»‎ ويطلب من كل طالب إضافة كلمة مرتبطة بسهم وعبارة ربط خلال دقيقتين.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يبدأ بنشاط الكلمة المركزية ويجمع إسهامات الطلبة\nالطالب: يضيفون مفاهيم وعبارات ربط\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يوجه نشاط 1-3 «تكوين روابط عبر المواضيع المختلفة» (كتاب التجارب ص 29)\nالطالب: يكوّنون روابط بين المواضيع في أزواج\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يوزع أسئلة نهاية الوحدة (ص 38–44) على المجموعات ويناقش الحلول\nالطالب: يحلون الأسئلة المكلفين بها ويعرضون الحلول\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة ويوجه استخدام قائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم بالقائمة\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما العلاقة بين التضاعف وبناء البروتين من حيث القالب المستخدم؟\n   الإجابة النموذجية: كلاهما يستخدم ‎DNA‎ قالبًا؛ التضاعف ينسخ الشريطين لإنتاج ‎DNA‎، والنسخ يستخدم شريطًا واحدًا لإنتاج ‎mRNA‎.\n2) (المستوى المتوقع) السؤال: اربط بين الطفرة والأليلات الجديدة.\n   الإجابة النموذجية: الطفرة تغير تتابع الجين فينتج شكل جديد منه (أليل جديد).\n3) (المستوى المتقدم) السؤال: كيف يمكن لطفرة في إنترون ألا تغير البروتين؟\n   الإجابة النموذجية: لأن الإنترون يُزال أثناء معالجة ‎RNA‎ فلا يدخل في ‎mRNA‎ الناضج.","1) (مستوى الدعم) السؤال: اذكر الإنزيم المرتبط بكل عملية: التضاعف، النسخ.\n   الإجابة النموذجية: التضاعف: ‎DNA‎ بوليميريز (و‎DNA‎ ليجيز)؛ النسخ: ‎RNA‎ بوليميريز.\n2) (المستوى المتوقع) السؤال: رتب: طفرة في ‎DNA‎، تغير شكل البروتين، تغير كودون ‎mRNA‎، تغير الحمض الأميني.\n   الإجابة النموذجية: طفرة في ‎DNA ←‎ تغير كودون ‎mRNA ←‎ تغير الحمض الأميني ← تغير شكل البروتين.\n3) (المستوى المتقدم) السؤال: صمم خريطة مفاهيم تربط ستة مفاهيم من الوحدة بعبارات ربط صحيحة.\n   الإجابة النموذجية: خريطة تتضمن مثلًا: ‎DNA ← (‎يُنسخ إلى) ‎mRNA ← (‎يُترجم إلى) عديد ببتيد؛ ‎DNA ← (‎يتضاعف بواسطة) ‎DNA‎ بوليميريز؛ الطفرة ← (تغير) تتابع القواعد ← (قد ينتج) أليل جديد.","إرشاد للطالب: مراجعة ملخص الوحدة ص 37 وإكمال أسئلة نهاية الوحدة غير المحلولة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع على قائمة التقويم الذاتي مع الابن لمعرفة الموضوعات التي تحتاج إلى مراجعة"],"h":["<ol class=\"ol\"><li>يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم</li><li>يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم</td><td class=\"lv\">إبداع</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">خريطة المفاهيم</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>الملخص، خريطة المفاهيم، قائمة التقويم الذاتي، أسئلة نهاية الوحدة.</p>","<p>يكتب المعلم في وسط السبورة «‎DNA»‎ ويطلب من كل طالب إضافة كلمة مرتبطة بسهم وعبارة ربط خلال دقيقتين.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يبدأ بنشاط الكلمة المركزية ويجمع إسهامات الطلبة</td><td>يضيفون مفاهيم وعبارات ربط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يوجه نشاط 1-3 «تكوين روابط عبر المواضيع المختلفة» (كتاب التجارب ص 29)</td><td>يكوّنون روابط بين المواضيع في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوزع أسئلة نهاية الوحدة (ص 38–44) على المجموعات ويناقش الحلول</td><td>يحلون الأسئلة المكلفين بها ويعرضون الحلول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة ويوجه استخدام قائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم بالقائمة</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما العلاقة بين التضاعف وبناء البروتين من حيث القالب المستخدم؟</td><td>كلاهما يستخدم ‎DNA‎ قالبًا؛ التضاعف ينسخ الشريطين لإنتاج ‎DNA‎، والنسخ يستخدم شريطًا واحدًا لإنتاج ‎mRNA‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اربط بين الطفرة والأليلات الجديدة.</td><td>الطفرة تغير تتابع الجين فينتج شكل جديد منه (أليل جديد).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يمكن لطفرة في إنترون ألا تغير البروتين؟</td><td>لأن الإنترون يُزال أثناء معالجة ‎RNA‎ فلا يدخل في ‎mRNA‎ الناضج.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر الإنزيم المرتبط بكل عملية: التضاعف، النسخ.</td><td>التضاعف: ‎DNA‎ بوليميريز (و‎DNA‎ ليجيز)؛ النسخ: ‎RNA‎ بوليميريز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب: طفرة في ‎DNA‎، تغير شكل البروتين، تغير كودون ‎mRNA‎، تغير الحمض الأميني.</td><td>طفرة في ‎DNA ←‎ تغير كودون ‎mRNA ←‎ تغير الحمض الأميني ← تغير شكل البروتين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صمم خريطة مفاهيم تربط ستة مفاهيم من الوحدة بعبارات ربط صحيحة.</td><td>خريطة تتضمن مثلًا: ‎DNA ← (‎يُنسخ إلى) ‎mRNA ← (‎يُترجم إلى) عديد ببتيد؛ ‎DNA ← (‎يتضاعف بواسطة) ‎DNA‎ بوليميريز؛ الطفرة ← (تغير) تتابع القواعد ← (قد ينتج) أليل جديد.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ملخص الوحدة ص 37 وإكمال أسئلة نهاية الوحدة غير المحلولة وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع على قائمة التقويم الذاتي مع الابن لمعرفة الموضوعات التي تحتاج إلى مراجعة</p>"]}]},{"title":"الأمشاج والتكاثر","sb":"ص 45–50","unit":"الوحدة 2: الوراثة","periods":[{"axis":"الجين والمجموعة الكروموسومية وضرورة الانقسام المنصف","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الأمشاج والتكاثر"],["الحصة","1 من 3"],["محور الحصة","الجين والمجموعة الكروموسومية وضرورة الانقسام المنصف"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 45–47"],["دليل المعلم","ص 79–83"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 2-1: دراسة أطوار الانقسام الاختزالي في المتك ص 57"]],"t":["1. يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎\n2. يشرح المقصود بأزواج الكروموسومات المتماثلة\nمخرج تعليمي آخر: يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم التعاوني\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: صورة نمط نووي (كاريوتايب) للإنسان","الجين، الكروموسوم، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎، الكروموسومات المتماثلة، الأمشاج، الإخصاب، الانقسام المنصف.","يعرض المعلم صورة نمط نووي للإنسان ويسأل: «إذا كانت خلية الأب وخلية الأم تحتوي كل منهما 46 كروموسومًا، فلماذا لا يحمل الطفل 92؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض النمط النووي ويطرح السؤال\nالطالب: يقترحون تفسيرًا لثبات عدد الكروموسومات\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الجين والموقع الجيني و‎n‎ و‎2n‎ والكروموسومات المتماثلة بالأشكال 2-1 إلى 2-3\nالطالب: يحددون الأزواج المتماثلة على صورة النمط النووي\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يكلّف المجموعات بمخطط لدورة حياة الإنسان يوضح مواقع الانقسام المنصف والإخصاب وعدد الكروموسومات\nالطالب: يرسمون المخطط ويكتبون ‎n‎ أو ‎2n‎ عند كل مرحلة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي ويوجه حل السؤالين 1 و2\nالطالب: يجيبون فرديًا ثم يتبادلون التصحيح\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما عدد الكروموسومات في مشيج الإنسان؟\n   الإجابة النموذجية: 23 كروموسومًا ‎(n)‎.\n2) (المستوى المتوقع) السؤال: ما المقصود بالكروموسومات المتماثلة؟\n   الإجابة النموذجية: زوج كروموسومات متشابهان في الطول وموقع السنترومير وتحمل الجينات نفسها في المواقع نفسها، أحدهما من الأب والآخر من الأم.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لعدد الكروموسومات عبر الأجيال لو تكونت الأمشاج بالانقسام المتساوي؟\n   الإجابة النموذجية: سيتضاعف في كل جيل.","1) (مستوى الدعم) السؤال: عرّف ثنائي المجموعة الكروموسومية.\n   الإجابة النموذجية: خلية تحتوي مجموعتين كاملتين من الكروموسومات ‎(2n)‎، واحدة من كل أب.\n2) (المستوى المتوقع) السؤال: لماذا لا تحمل الكروموسومات المتماثلة بالضرورة الأليلات نفسها؟\n   الإجابة النموذجية: لأنها تحمل الجينات نفسها، لكن قد يكون لكل جين أليلان مختلفان على الكروموسومين.\n3) (المستوى المتقدم) السؤال: خلية جسمية في حيوان فيها 38 كروموسومًا. كم كروموسومًا في مشيجه؟ وكم زوجًا متماثلًا في خليته الجسمية؟\n   الإجابة النموذجية: المشيج 19 كروموسومًا، والخلية الجسمية فيها 19 زوجًا متماثلًا.","إرشاد للطالب: مراجعة ص 45–47 وحل السؤالين 1 و2\nإرشاد لولي الأمر: الحديث مع الابن عن سبب تشابه الأبناء مع الوالدين واختلافهم في الوقت نفسه"],"h":["<ol class=\"ol\"><li>يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎</li><li>يشرح المقصود بأزواج الكروموسومات المتماثلة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح المقصود بأزواج الكروموسومات المتماثلة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: صورة نمط نووي (كاريوتايب) للإنسان</span></div>","<p>الجين، الكروموسوم، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎، الكروموسومات المتماثلة، الأمشاج، الإخصاب، الانقسام المنصف.</p>","<p>يعرض المعلم صورة نمط نووي للإنسان ويسأل: «إذا كانت خلية الأب وخلية الأم تحتوي كل منهما 46 كروموسومًا، فلماذا لا يحمل الطفل 92؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small>< ا. كم كروموسومًا في مشيجه؟ وكم زوجًا متماثلًا في خليته الجسمية؟</td><td>المشيج 19 كروموسومًا، والخلية الجسمية فيها 19 زوجًا متماثلًا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 45–47 وحل السؤالين 1 و2</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن سبب تشابه الأبناء مع الوالدين واختلافهم في الوقت نفسه</p>"]},{"axis":"سلوك الكروموسومات في أطوار الانقسام الاختزالي","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الأمشاج والتكاثر"],["الحصة","2 من 3"],["محور الحصة","سلوك الكروموسومات في أطوار الانقسام الاختزالي"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 47–50"],["دليل المعلم","ص 79–83"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 2-1: دراسة أطوار الانقسام الاختزالي في المتك ص 57"]],"t":["1. يصف سلوك الكروموسومات في الانقسامين الأول والثاني من الانقسام الاختزالي\n2. يميز بين أحداث الطور التمهيدي الأول والاستوائي الأول والانفصالي الأول ونظائرها في الانقسام الثاني\nمخرج تعليمي آخر: ينمذج الانقسام الاختزالي باستخدام نماذج كروموسومات ملونة","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)","الانقسام الاختزالي الأول والثاني، الطور التمهيدي، الاستوائي، الانفصالي، النهائي، الثنائيات (الأزواج المتماثلة المتقابلة)، الكروماتيدات الشقيقة.","يعرض المعلم ثنائيتين من نماذج الكروموسومات (ملونة بلون الأب ولون الأم) ويسأل: «كيف تتوزع هذه على أربع خلايا بحيث تحصل كل خلية على نسخة واحدة من كل كروموسوم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض النماذج ويطرح التحدي\nالطالب: يقترحون طريقة التوزيع\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح أطوار الانقسامين بالأشكال 2-4 إلى 2-6 مع التركيز على انفصال الكروموسومات المتماثلة في الأول والكروماتيدات في الثاني\nالطالب: يملؤون جدولًا لأحداث كل طور\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه نمذجة الانقسام الاختزالي بالنماذج الملونة في مجموعات (نشاط دليل المعلم)\nالطالب: يحركون النماذج عبر الأطوار ويصوّرون أو يرسمون كل طور\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون ويقارنون الانقسام الاختزالي بالمتساوي\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ماذا ينفصل في الطور الانفصالي الأول؟\n   الإجابة النموذجية: الكروموسومات المتماثلة.\n2) (المستوى المتوقع) السؤال: ماذا ينفصل في الطور الانفصالي الثاني؟\n   الإجابة النموذجية: الكروماتيدات الشقيقة.\n3) (المستوى المتقدم) السؤال: لماذا تكون الخلايا الناتجة من الانقسام الأول أحادية المجموعة رغم احتواء كل كروموسوم على كروماتيدين؟\n   الإجابة النموذجية: لأن كل خلية تحتوي كروموسومًا واحدًا من كل زوج متماثل.","1) (مستوى الدعم) السؤال: كم خلية تنتج من الانقسام الاختزالي؟ وما عدد مجموعاتها الكروموسومية؟\n   الإجابة النموذجية: أربع خلايا أحادية المجموعة الكروموسومية ‎(n)‎.\n2) (المستوى المتوقع) السؤال: صف ما يحدث للكروموسومات المتماثلة في الطور الاستوائي الأول.\n   الإجابة النموذجية: تصطف أزواجًا (ثنائيات) على خط الاستواء.\n3) (المستوى المتقدم) السؤال: قارن بين الطور الاستوائي الأول والطور الاستوائي الثاني.\n   الإجابة النموذجية: الأول: الكروموسومات المتماثلة تصطف أزواجًا؛ الثاني: الكروموسومات تصطف منفردة وكل منها مكون من كروماتيدين.","إرشاد للطالب: مراجعة ص 47–50 ورسم مخطط للأطوار الثمانية\nإرشاد لولي الأمر: تشجيع الابن على شرح أطوار الانقسام الاختزالي باستخدام أدوات منزلية بسيطة كالأقلام الملونة"],"h":["<ol class=\"ol\"><li>يصف سلوك الكروموسومات في الانقسامين الأول والثاني من الانقسام الاختزالي</li><li>يميز بين أحداث الطور التمهيدي الأول والاستوائي الأول والانفصالي الأول ونظائرها في الانقسام الثاني</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> ينمذج الانقسام الاختزالي باستخدام نماذج كروموسومات ملونة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف سلوك الكروموسومات في الانقسامين الأول والثاني من الانقسام الاختزالي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين أحداث الطور التمهيدي الأول والاستوائي الأول والانفصالي الأول ونظائرها في الانقسام الثاني</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>ينمذج الانقسام الاختزالي باستخدام نماذج كروموسومات ملونة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الانقسام الاختزالي الأول والثاني، الطور التمهيدي، الاستوائي، الانفصالي، النهائي، الثنائيات (الأزواج المتماثلة المتقابلة)، الكروماتيدات الشقيقة.</p>","<p>يعرض المعلم ثنائيتين من نماذج الكروموسومات (ملونة بلون الأب ولون الأم) ويسأل: «كيف تتوزع هذه على أربع خلايا بحيث تحصل كل خلية على نسخة واحدة من كل كروموسوم؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض النماذج ويطرح التحدي</td><td>يقترحون طريقة التوزيع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح أطوار الانقسامين بالأشكال 2-4 إلى 2-6 مع التركيز على انفصال الكروموسومات المتماثلة في الأول والكروماتيدات في الثاني</td><td>يملؤون جدولًا لأحداث كل طور</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه نمذجة الانقسام الاختزالي بالنماذج الملونة في مجموعات (نشاط دليل المعلم)</td><td>يحركون النماذج عبر الأطوار ويصوّرون أو يرسمون كل طور</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون ويقارنون الانقسام الاختزالي بالمتساوي</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا ينفصل في الطور الانفصالي الأول؟</td><td>الكروموسومات المتماثلة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا ينفصل في الطور الانفصالي الثاني؟</td><td>الكروماتيدات الشقيقة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تكون الخلايا الناتجة من الانقسام الأول أحادية المجموعة رغم احتواء كل كروموسوم على كروماتيدين؟</td><td>لأن كل خلية تحتوي كروموسومًا واحدًا من كل زوج متماثل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كم خلية تنتج من الانقسام الاختزالي؟ وما عدد مجموعاتها الكروموسومية؟</td><td>أربع خلايا أحادية المجموعة الكروموسومية ‎(n)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف ما يحدث للكروموسومات المتماثلة في الطور الاستوائي الأول.</td><td>تصطف أزواجًا (ثنائيات) على خط الاستواء.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قارن بين الطور الاستوائي الأول والطور الاستوائي الثاني.</td><td>الأول: الكروموسومات المتماثلة تصطف أزواجًا؛ الثاني: الكروموسومات تصطف منفردة وكل منها مكون من كروماتيدين.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 47–50 ورسم مخطط للأطوار الثمانية</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح أطوار الانقسام الاختزالي باستخدام أدوات منزلية بسيطة كالأقلام الملونة</p>"]},{"axis":"الاستقصاء العملي 2-1: أطوار الانقسام الاختزالي في المتك","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الأمشاج والتكاثر"],["الحصة","3 من 3"],["محور الحصة","الاستقصاء العملي 2-1: أطوار الانقسام الاختزالي في المتك"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 48–50 + كتاب التجارب ص 57"],["دليل المعلم","ص 79–83"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 2-1: دراسة أطوار الانقسام الاختزالي في المتك ص 57"]],"t":["1. يفسر الصور المجهرية الضوئية والرسوم التخطيطية للخلايا في مراحل الانقسام الاختزالي ويحدد أطوارها\n2. يحضّر شريحة أو يفحص شريحة جاهزة لمتك نبات ويرسم الخلايا في أطوار مختلفة\nمخرج تعليمي آخر: يقارن بين أمشاج ذكرية وأنثوية من حيث الحجم والحركة والعدد (مقارنة الأمشاج)","المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- صورة توضيحية\n- أخرى: مجاهر ضوئية، شرائح متك جاهزة أو براعم زهرية، صبغة أسيتوكارمين","المتك، حبوب اللقاح، الشريحة المجهرية، الصبغة، تحديد الأطوار، الأمشاج الذكرية والأنثوية.","يعرض المعلم صورة مجهرية غير معنونة لخلايا في الانقسام ويسأل: «كيف نعرف إن كانت هذه الخلية في الانقسام الأول أم الثاني؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يعرض الصورة ويستثير التفكير في الأدلة المجهرية\nالطالب: يقترحون أدلة: عدد الخلايا المتجاورة، وجود ثنائيات\n2) (20 دقيقة: من الدقيقة 4 إلى 24)\nالمعلم: يوجّه تنفيذ الاستقصاء العملي 2-1 (كتاب التجارب ص 57) وفحص الشرائح\nالطالب: يفحصون الشرائح ويرسمون خلايا في ثلاثة أطوار على الأقل ويحددونها\n3) (8 دقائق: من الدقيقة 24 إلى 32)\nالمعلم: يناقش رسوم الطلبة ويقدم صورًا مجهرية مرجعية\nالطالب: يقارنون رسومهم بالصور ويصححون التحديد\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير مقارنة سريعة بين الأمشاج (نشاط دليل المعلم) والتقويم الختامي\nالطالب: يكملون جدول المقارنة ويجيبون عن أسئلة التقويم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا يُستخدم المتك لدراسة الانقسام الاختزالي؟\n   الإجابة النموذجية: لأن خلاياه تنقسم انقسامًا اختزاليًا لتكوين حبوب اللقاح.\n2) (المستوى المتوقع) السؤال: ما الدليل المجهري على أن خلية في الطور الاستوائي الأول؟\n   الإجابة النموذجية: اصطفاف الكروموسومات أزواجًا (ثنائيات) على خط الاستواء.\n3) (المستوى المتقدم) السؤال: كيف تميز الطور الانفصالي الثاني من الأول في صورة مجهرية؟\n   الإجابة النموذجية: في الثاني يحدث الانفصال في خليتين متجاورتين معًا وتتحرك كروماتيدات مفردة.","1) (مستوى الدعم) السؤال: ما وظيفة الصبغة في الشريحة؟\n   الإجابة النموذجية: تلوين الكروموسومات لتظهر بوضوح تحت المجهر.\n2) (المستوى المتوقع) السؤال: اذكر فرقين بين المشيج الذكري والأنثوي في الإنسان.\n   الإجابة النموذجية: الذكري صغير ومتحرك وينتج بأعداد كبيرة؛ الأنثوي كبير وغير متحرك وينتج بأعداد قليلة.\n3) (المستوى المتقدم) السؤال: لماذا قد لا تظهر جميع الأطوار في شريحة واحدة؟\n   الإجابة النموذجية: لأن الأطوار تستغرق مددًا مختلفة، والقصيرة منها تظهر في عدد قليل من الخلايا، ولأن المتك قد يكون في مرحلة نمو محددة.","إرشاد للطالب: كتابة تقرير الاستقصاء العملي 2-1 مع الرسوم ومراجعة ص 48–50\nإرشاد لولي الأمر: التأكد من إكمال الابن رسومه وتحديد أسماء الأطوار عليها"],"h":["<ol class=\"ol\"><li>يفسر الصور المجهرية الضوئية والرسوم التخطيطية للخلايا في مراحل الانقسام الاختزالي ويحدد أطوارها</li><li>يحضّر شريحة أو يفحص شريحة جاهزة لمتك نبات ويرسم الخلايا في أطوار مختلفة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين أمشاج ذكرية وأنثوية من حيث الحجم والحركة والعدد (مقارنة الأمشاج)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يفسر الصور المجهرية الضوئية والرسوم التخطيطية للخلايا في مراحل الانقسام الاختزالي ويحدد أطوارها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحضّر شريحة أو يفحص شريحة جاهزة لمتك نبات ويرسم الخلايا في أطوار مختلفة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين أمشاج ذكرية وأنثوية من حيث الحجم والحركة والعدد (مقارنة الأمشاج)</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: مجاهر ضوئية، شرائح متك جاهزة أو براعم زهرية، صبغة أسيتوكارمين</span></div>","<p>المتك، حبوب اللقاح، الشريحة المجهرية، الصبغة، تحديد الأطوار، الأمشاج الذكرية والأنثوية.</p>","<p>يعرض المعلم صورة مجهرية غير معنونة لخلايا في الانقسام ويسأل: «كيف نعرف إن كانت هذه الخلية في الانقسام الأول أم الثاني؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يعرض الصورة ويستثير التفكير في الأدلة المجهرية</td><td>يقترحون أدلة: عدد الخلايا المتجاورة، وجود ثنائيات</td></tr><
