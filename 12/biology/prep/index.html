يحدث لها؟</td><td>لا توجد مخازن لها، فتُنزع مجموعة الأمين منها في الكبد وتتحول إلى أمونيا ثم إلى يوريا تُطرح، ويُستخدم الجزء المتبقي في التنفس أو يُخزن.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 122–124 وحل السؤالين 1 و2</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أمثلة يومية للاتزان الداخلي مثل التعرق في الصيف العُماني</p>"]}]},{"title":"تركيب الكلية","sb":"ص 125–134","unit":"الوحدة 4: الاتزان الداخلي","periods":[{"axis":"التركيب الخارجي والداخلي للكلية والنفرون","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","تركيب الكلية"],["الحصة","1 من 4"],["محور الحصة","التركيب الخارجي والداخلي للكلية والنفرون"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 125–127"],["دليل المعلم","ص 167–171"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 4-1: تركيب الكُلية ص 97"]],"t":["1. يصف تركيب كلية الإنسان: القشرة، واللب، والحوض، والحالب، والأوعية الدموية الكلوية\n2. يصف أجزاء النفرون: كبسولة بومان، والكبيبة، والأنيبيب الملتف القريب، والتواء هنلي، والأنيبيب الملتف البعيد، والقناة الجامعة\nمخرج تعليمي آخر: يحدد مواقع أجزاء النفرون في القشرة واللب على رسم تخطيطي","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة","الكلية، القشرة، اللب، الحوض، الحالب، النفرون، كبسولة بومان، الكبيبة، الأنيبيب الملتف القريب، التواء هنلي، الأنيبيب الملتف البعيد، القناة الجامعة.","يعرض المعلم نموذجًا مجسمًا للكلية ويسأل: «يمر عبر كليتيك نحو 1.2 لتر من الدم في الدقيقة؛ كيف يُصفّى كل هذا الدم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض النموذج ويطرح السؤال\nالطالب: يقترحون وجود وحدات ترشيح دقيقة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح التركيب الخارجي والداخلي للكلية والنفرون بالأشكال 4-3 إلى 4-6\nالطالب: يرسمون النفرون ويسمون أجزاءه\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوزع رسومًا صامتة للكلية والنفرون على المجموعات للتسمية والمطابقة\nالطالب: يكملون الرسوم ويحددون ما يقع في القشرة وما يقع في اللب\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الوحدة الوظيفية للكلية؟\n   الإجابة النموذجية: النفرون.\n2) (المستوى المتوقع) السؤال: في أي منطقة من الكلية تقع الكبيبات؟\n   الإجابة النموذجية: في القشرة.\n3) (المستوى المتقدم) السؤال: لماذا يمتد التواء هنلي داخل اللب؟\n   الإجابة النموذجية: لأن دوره في تركيز البول يعتمد على تكوين تدرج في تركيز الأملاح داخل اللب.","1) (مستوى الدعم) السؤال: ما الحالب؟\n   الإجابة النموذجية: أنبوب ينقل البول من حوض الكلية إلى المثانة.\n2) (المستوى المتوقع) السؤال: رتب أجزاء النفرون حسب مرور السائل فيها.\n   الإجابة النموذجية: كبسولة بومان ← الأنيبيب الملتف القريب ← التواء هنلي ← الأنيبيب الملتف البعيد ← القناة الجامعة.\n3) (المستوى المتقدم) السؤال: قارن بين الشريان الوارد والشريان الصادر للكبيبة من حيث القطر وأثر ذلك.\n   الإجابة النموذجية: الوارد أوسع من الصادر، فيرتفع ضغط الدم في الكبيبة مما يساعد على الترشيح الفائق.","إرشاد للطالب: مراجعة ص 125–127 ورسم النفرون مع تسمية أجزائه\nإرشاد لولي الأمر: تشجيع الابن على شرب الماء الكافي والحديث عن أهمية صحة الكلى"],"h":["<ol class=\"ol\"><li>يصف تركيب كلية الإنسان: القشرة، واللب، والحوض، والحالب، والأوعية الدموية الكلوية</li><li>يصف أجزاء النفرون: كبسولة بومان، والكبيبة، والأنيبيب الملتف القريب، والتواء هنلي، والأنيبيب الملتف البعيد، والقناة الجامعة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد مواقع أجزاء النفرون في القشرة واللب على رسم تخطيطي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب كلية الإنسان: القشرة، واللب، والحوض، والحالب، والأوعية الدموية الكلوية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف أجزاء النفرون: كبسولة بومان، والكبيبة، والأنيبيب الملتف القريب، والتواء هنلي، والأنيبيب الملتف البعيد، والقناة الجامعة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد مواقع أجزاء النفرون في القشرة واللب على رسم تخطيطي</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">نماذج مجسمة</span></div>","<p>الكلية، القشرة، اللب، الحوض، الحالب، النفرون، كبسولة بومان، الكبيبة، الأنيبيب الملتف القريب، التواء هنلي، الأنيبيب الملتف البعيد، القناة الجامعة.</p>","<p>يعرض المعلم نموذجًا مجسمًا للكلية ويسأل: «يمر عبر كليتيك نحو 1.2 لتر من الدم في الدقيقة؛ كيف يُصفّى كل هذا الدم؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض النموذج ويطرح السؤال</td><td>يقترحون وجود وحدات ترشيح دقيقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح التركيب الخارجي والداخلي للكلية والنفرون بالأشكال 4-3 إلى 4-6</td><td>يرسمون النفرون ويسمون أجزاءه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوزع رسومًا صامتة للكلية والنفرون على المجموعات للتسمية والمطابقة</td><td>يكملون الرسوم ويحددون ما يقع في القشرة وما يقع في اللب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الوحدة الوظيفية للكلية؟</td><td>النفرون.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>في أي منطقة من الكلية تقع الكبيبات؟</td><td>في القشرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يمتد التواء هنلي داخل اللب؟</td><td>لأن دوره في تركيز البول يعتمد على تكوين تدرج في تركيز الأملاح داخل اللب.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الحالب؟</td><td>أنبوب ينقل البول من حوض الكلية إلى المثانة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب أجزاء النفرون حسب مرور السائل فيها.</td><td>كبسولة بومان ← الأنيبيب الملتف القريب ← التواء هنلي ← الأنيبيب الملتف البعيد ← القناة الجامعة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قارن بين الشريان الوارد والشريان الصادر للكبيبة من حيث القطر وأثر ذلك.</td><td>الوارد أوسع من الصادر، فيرتفع ضغط الدم في الكبيبة مما يساعد على الترشيح الفائق.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 125–127 ورسم النفرون مع تسمية أجزائه</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرب الماء الكافي والحديث عن أهمية صحة الكلى</p>"]},{"axis":"الترشيح الفائق في الكبيبة","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","تركيب الكلية"],["الحصة","2 من 4"],["محور الحصة","الترشيح الفائق في الكبيبة"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 128–130"],["دليل المعلم","ص 167–171"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 4-1: تركيب الكُلية ص 97"]],"t":["1. يصف الترشيح الفائق في الكبيبة ودور ضغط الدم وطبقات الترشيح (البطانة، الغشاء القاعدي، الخلايا القدمية)\n2. يحدد مكونات الدم التي ترشح والتي لا ترشح وفق حجمها\nمخرج تعليمي آخر: يفسر أثر تغير ضغط الدم على معدل الترشيح الكبيبي","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم بالنمذجة","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","الترشيح الفائق، ضغط الدم الهيدروستاتيكي، بطانة الشعيرات، الغشاء القاعدي، الخلايا القدمية، الراشح الكبيبي، معدل الترشيح الكبيبي.","يعرض المعلم مصفاة شاي ويصب فيها خليطًا من الماء والرمل والحصى، ويسأل: «ما الذي مر وما الذي احتُجز؟ وما الذي يقابل كلًا منها في الكبيبة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: ينفذ العرض ويطرح السؤال\nالطالب: يربطون حجم الجسيمات بالمرور\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح طبقات الترشيح والضغط المرتفع ومحتوى الراشح بالشكل 4-7\nالطالب: يكملون جدولًا: مادة، ترشح أم لا، السبب\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يقدم بيانات تراكيز مواد في البلازما والراشح للتحليل\nالطالب: يحللون البيانات ويستنتجون دور الغشاء القاعدي كمرشح\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما القوة التي تدفع السوائل من الكبيبة إلى كبسولة بومان؟\n   الإجابة النموذجية: الضغط الهيدروستاتيكي المرتفع للدم في الكبيبة.\n2) (المستوى المتوقع) السؤال: لماذا لا تمر بروتينات البلازما الكبيرة إلى الراشح؟\n   الإجابة النموذجية: لأن الغشاء القاعدي يعمل مرشحًا يمنع مرور الجزيئات الكبيرة.\n3) (المستوى المتقدم) السؤال: ماذا تتوقع لمعدل الترشيح إذا انخفض ضغط الدم بشدة؟\n   الإجابة النموذجية: ينخفض معدل الترشيح الكبيبي.","1) (مستوى الدعم) السؤال: اذكر ثلاث مواد توجد في الراشح الكبيبي.\n   الإجابة النموذجية: الماء، والجلوكوز، واليوريا (والأملاح والأحماض الأمينية).\n2) (المستوى المتوقع) السؤال: ما الخلايا القدمية؟\n   الإجابة النموذجية: خلايا في جدار كبسولة بومان لها امتدادات تترك فراغات صغيرة يمر منها الراشح.\n3) (المستوى المتقدم) السؤال: لماذا يعد وجود البروتين في البول مؤشرًا على مشكلة في الكلية؟\n   الإجابة النموذجية: لأنه يدل على تلف الغشاء القاعدي للكبيبة فيسمح بمرور البروتينات الكبيرة.","إرشاد للطالب: مراجعة ص 128–130 وإكمال جدول مواد الراشح\nإرشاد لولي الأمر: الحديث مع الابن عن الفحوص الدورية للبول ودلالتها"],"h":["<ol class=\"ol\"><li>يصف الترشيح الفائق في الكبيبة ودور ضغط الدم وطبقات الترشيح (البطانة، الغشاء القاعدي، الخلايا القدمية)</li><li>يحدد مكونات الدم التي ترشح والتي لا ترشح وفق حجمها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر أثر تغير ضغط الدم على معدل الترشيح الكبيبي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف الترشيح الفائق في الكبيبة ودور ضغط الدم وطبقات الترشيح (البطانة، الغشاء القاعدي، الخلايا القدمية)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد مكونات الدم التي ترشح والتي لا ترشح وفق حجمها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر أثر تغير ضغط الدم على معدل الترشيح الكبيبي</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالنمذجة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>الترشيح الفائق، ضغط الدم الهيدروستاتيكي، بطانة الشعيرات، الغشاء القاعدي، الخلايا القدمية، الراشح الكبيبي، معدل الترشيح الكبيبي.</p>","<p>يعرض المعلم مصفاة شاي ويصب فيها خليطًا من الماء والرمل والحصى، ويسأل: «ما الذي مر وما الذي احتُجز؟ وما الذي يقابل كلًا منها في الكبيبة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>ينفذ العرض ويطرح السؤال</td><td>يربطون حجم الجسيمات بالمرور</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح طبقات الترشيح والضغط المرتفع ومحتوى الراشح بالشكل 4-7</td><td>يكملون جدولًا: مادة، ترشح أم لا، السبب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يقدم بيانات تراكيز مواد في البلازما والراشح للتحليل</td><td>يحللون البيانات ويستنتجون دور الغشاء القاعدي كمرشح</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما القوة التي تدفع السوائل من الكبيبة إلى كبسولة بومان؟</td><td>الضغط الهيدروستاتيكي المرتفع للدم في الكبيبة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا تمر بروتينات البلازما الكبيرة إلى الراشح؟</td><td>لأن الغشاء القاعدي يعمل مرشحًا يمنع مرور الجزيئات الكبيرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا تتوقع لمعدل الترشيح إذا انخفض ضغط الدم بشدة؟</td><td>ينخفض معدل الترشيح الكبيبي.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر ثلاث مواد توجد في الراشح الكبيبي.</td><td>الماء، والجلوكوز، واليوريا (والأملاح والأحماض الأمينية).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الخلايا القدمية؟</td><td>خلايا في جدار كبسولة بومان لها امتدادات تترك فراغات صغيرة يمر منها الراشح.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يعد وجود البروتين في البول مؤشرًا على مشكلة في الكلية؟</td><td>لأنه يدل على تلف الغشاء القاعدي للكبيبة فيسمح بمرور البروتينات الكبيرة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 128–130 وإكمال جدول مواد الراشح</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الفحوص الدورية للبول ودلالتها</p>"]},{"axis":"إعادة الامتصاص الانتقائي وتكوين البول","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","تركيب الكلية"],["الحصة","3 من 4"],["محور الحصة","إعادة الامتصاص الانتقائي وتكوين البول"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 130–134"],["دليل المعلم","ص 167–171"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 4-1: تركيب الكُلية ص 97"]],"t":["1. يصف إعادة الامتصاص الانتقائي في الأنيبيب الملتف القريب للجلوكوز والأحماض الأمينية والأملاح والماء\n2. يربط تكيفات خلايا الأنيبيب القريب (الزغيبات، الميتوكوندريا، البروتينات الناقلة) بوظيفتها\nمخرج تعليمي آخر: يشرح دور التواء هنلي والقناة الجامعة في تركيز البول بصورة مبسطة","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: فهم","- التعلم بالاكتشاف\n- التعلم التعاوني\n- قصة علمية","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","إعادة الامتصاص الانتقائي، الأنيبيب الملتف القريب، الزغيبات الدقيقة، النقل النشط، النقل المشترك مع الصوديوم، الأسموزية، التواء هنلي، تركيز البول.","يقرأ المعلم بداية «قصة حزينة عن حمض أميني غير مرغوب فيه» (نشاط دليل المعلم) ويسأل: «إذا رشحت الكبيبة الجلوكوز، فلماذا لا يظهر في بول الشخص السليم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال بعد القصة\nالطالب: يستنتجون حدوث إعادة امتصاص\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح إعادة الامتصاص في الأنيبيب القريب (نقل نشط للصوديوم، ونقل مشترك للجلوكوز، وأسموزية الماء) وتكيفات الخلايا\nالطالب: يرسمون خلية أنيبيب قريب ويكتبون اتجاه حركة كل مادة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يكلّف المجموعات بإكمال «القصة الحزينة» برحلة جزيء جلوكوز وجزيء يوريا عبر النفرون\nالطالب: يكتبون القصتين ويقرؤون مقاطع منها\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أين يُعاد امتصاص معظم الجلوكوز؟\n   الإجابة النموذجية: في الأنيبيب الملتف القريب.\n2) (المستوى المتوقع) السؤال: لماذا تحتوي خلايا الأنيبيب القريب على ميتوكوندريا كثيرة؟\n   الإجابة النموذجية: لتوفير ‎ATP‎ اللازم للنقل النشط.\n3) (المستوى المتقدم) السؤال: كيف يُعاد امتصاص الماء من الأنيبيب القريب؟\n   الإجابة النموذجية: بالأسموزية بعد إعادة امتصاص الأملاح والجلوكوز التي تخفض الجهد المائي في الخلايا والدم.","1) (مستوى الدعم) السؤال: ما وظيفة الزغيبات الدقيقة في خلايا الأنيبيب القريب؟\n   الإجابة النموذجية: زيادة مساحة السطح لإعادة الامتصاص.\n2) (المستوى المتوقع) السؤال: لماذا يظهر الجلوكوز في بول المصاب بالسكري غير المعالج؟\n   الإجابة النموذجية: لأن تركيزه في الراشح يتجاوز قدرة البروتينات الناقلة على إعادة امتصاصه كله.\n3) (المستوى المتقدم) السؤال: لماذا يزداد تركيز اليوريا في البول مقارنة بالراشح؟\n   الإجابة النموذجية: لأن معظم الماء يُعاد امتصاصه بينما يُعاد امتصاص جزء قليل من اليوريا.","إرشاد للطالب: مراجعة ص 130–134 وحل الأسئلة 3–6\nإرشاد لولي الأمر: سؤال الابن عن «رحلة جزيء الجلوكوز» في الكلية ليرويها بأسلوبه"],"h":["<ol class=\"ol\"><li>يصف إعادة الامتصاص الانتقائي في الأنيبيب الملتف القريب للجلوكوز والأحماض الأمينية والأملاح والماء</li><li>يربط تكيفات خلايا الأنيبيب القريب (الزغيبات، الميتوكوندريا، البروتينات الناقلة) بوظيفتها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يشرح دور التواء هنلي والقناة الجامعة في تركيز البول بصورة مبسطة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف إعادة الامتصاص الانتقائي في الأنيبيب الملتف القريب للجلوكوز والأحماض الأمينية والأملاح والماء</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يربط تكيفات خلايا الأنيبيب القريب (الزغيبات، الميتوكوندريا، البروتينات الناقلة) بوظيفتها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يشرح دور التواء هنلي والقناة الجامعة في تركيز البول بصورة مبسطة</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">قصة علمية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>إعادة الامتصاص الانتقائي، الأنيبيب الملتف القريب، الزغيبات الدقيقة، النقل النشط، النقل المشترك مع الصوديوم، الأسموزية، التواء هنلي، تركيز البول.</p>","<p>يقرأ المعلم بداية «قصة حزينة عن حمض أميني غير مرغوب فيه» (نشاط دليل المعلم) ويسأل: «إذا رشحت الكبيبة الجلوكوز، فلماذا لا يظهر في بول الشخص السليم؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال بعد القصة</td><td>يستنتجون حدوث إعادة امتصاص</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح إعادة الامتصاص في الأنيبيب القريب (نقل نشط للصوديوم، ونقل مشترك للجلوكوز، وأسموزية الماء) وتكيفات الخلايا</td><td>يرسمون خلية أنيبيب قريب ويكتبون اتجاه حركة كل مادة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يكلّف المجموعات بإكمال «القصة الحزينة» برحلة جزيء جلوكوز وجزيء يوريا عبر النفرون</td><td>يكتبون القصتين ويقرؤون مقاطع منها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين يُعاد امتصاص معظم الجلوكوز؟</td><td>في الأنيبيب الملتف القريب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تحتوي خلايا الأنيبيب القريب على ميتوكوندريا كثيرة؟</td><td>لتوفير ‎ATP‎ اللازم للنقل النشط.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يُعاد امتصاص الماء من الأنيبيب القريب؟</td><td>بالأسموزية بعد إعادة امتصاص الأملاح والجلوكوز التي تخفض الجهد المائي في الخلايا والدم.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة الزغيبات الدقيقة في خلايا الأنيبيب القريب؟</td><td>زيادة مساحة السطح لإعادة الامتصاص.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يظهر الجلوكوز في بول المصاب بالسكري غير المعالج؟</td><td>لأن تركيزه في الراشح يتجاوز قدرة البروتينات الناقلة على إعادة امتصاصه كله.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يزداد تركيز اليوريا في البول مقارنة بالراشح؟</td><td>لأن معظم الماء يُعاد امتصاصه بينما يُعاد امتصاص جزء قليل من اليوريا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 130–134 وحل الأسئلة 3–6</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن «رحلة جزيء الجلوكوز» في الكلية ليرويها بأسلوبه</p>"]},{"axis":"الاستقصاء العملي 4-1: تركيب الكُلية","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","تركيب الكلية"],["الحصة","4 من 4"],["محور الحصة","الاستقصاء العملي 4-1: تركيب الكُلية"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 125–134 + كتاب التجارب ص 97"],["دليل المعلم","ص 167–171"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 4-1: تركيب الكُلية ص 97"]],"t":["1. يفحص كلية حيوان (أو نموذجًا/صورًا) ويحدد القشرة واللب والحوض والأوعية\n2. يفحص شرائح أو صورًا مجهرية لنسيج الكلية ويحدد الكبيبات والأنيبيبات\nمخرج تعليمي آخر: يلتزم باحتياطات السلامة والنظافة عند التشريح","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: كلية خروف طازجة، أدوات تشريح، قفازات، مجاهر وشرائح نسيج الكلية","التشريح، المقطع الطولي للكلية، القشرة، اللب، الأهرامات الكلوية، الحوض، الصورة المجهرية، الكبيبة.","يعرض المعلم كلية خروف كاملة ويسأل: «ماذا تتوقع أن ترى عند قطعها طوليًا؟» ويطلب رسمًا تنبؤيًا سريعًا.","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يعرض الكلية ويطلب الرسم التنبؤي\nالطالب: يرسمون توقعاتهم\n2) (18 دقيقة: من الدقيقة 4 إلى 22)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 4-1 (كتاب التجارب ص 97): القطع الطولي ورسم المقطع\nالطالب: يشرّحون الكلية في مجموعات مع التزام السلامة ويرسمون المقطع ويسمون الأجزاء\n3) (10 دقائق: من الدقيقة 22 إلى 32)\nالمعلم: يعرض شرائح أو صورًا مجهرية للقشرة واللب\nالطالب: يحددون الكبيبات والأنيبيبات ويقارنون القشرة باللب\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يناقش الملاحظات ويدير التقويم الختامي\nالطالب: يقارنون رسومهم التنبؤية بالنتائج ويجيبون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الفرق في المظهر بين القشرة واللب؟\n   الإجابة النموذجية: القشرة حبيبية المظهر لاحتوائها الكبيبات، واللب مخطط لاحتوائه التواءات هنلي والقنوات الجامعة.\n2) (المستوى المتوقع) السؤال: لماذا نرتدي القفازات أثناء التشريح؟\n   الإجابة النموذجية: للوقاية من الميكروبات والحفاظ على النظافة.\n3) (المستوى المتقدم) السؤال: ما التراكيب التي تظهر كبقع دائرية في الشريحة المجهرية للقشرة؟\n   الإجابة النموذجية: الكبيبات داخل كبسولات بومان.","1) (مستوى الدعم) السؤال: سمِّ ثلاث مناطق تظهر في المقطع الطولي للكلية.\n   الإجابة النموذجية: القشرة، واللب (الأهرامات)، والحوض.\n2) (المستوى المتوقع) السؤال: لماذا يبدو اللب مخططًا؟\n   الإجابة النموذجية: لاصطفاف التواءات هنلي والقنوات الجامعة بشكل متوازٍ.\n3) (المستوى المتقدم) السؤال: اقترح تحسينًا للاستقصاء يجعل تحديد الأجزاء أدق.\n   الإجابة النموذجية: استخدام عدسة مكبرة أو مجهر تشريحي، وحقن صبغة في الشريان الكلوي لإظهار الأوعية، ومقارنة المقطع بصورة مرجعية.","إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 مع الرسوم\nإرشاد لولي الأمر: التأكد من إكمال الابن رسم المقطع الطولي مع التسميات"],"h":["<ol class=\"ol\"><li>يفحص كلية حيوان (أو نموذجًا/صورًا) ويحدد القشرة واللب والحوض والأوعية</li><li>يفحص شرائح أو صورًا مجهرية لنسيج الكلية ويحدد الكبيبات والأنيبيبات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يلتزم باحتياطات السلامة والنظافة عند التشريح</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يفحص كلية حيوان (أو نموذجًا/صورًا) ويحدد القشرة واللب والحوض والأوعية</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفحص شرائح أو صورًا مجهرية لنسيج الكلية ويحدد الكبيبات والأنيبيبات</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يلتزم باحتياطات السلامة والنظافة عند التشريح</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: كلية خروف طازجة، أدوات تشريح، قفازات، مجاهر وشرائح نسيج الكلية</span></div>","<p>التشريح، المقطع الطولي للكلية، القشرة، اللب، الأهرامات الكلوية، الحوض، الصورة المجهرية، الكبيبة.</p>","<p>يعرض المعلم كلية خروف كاملة ويسأل: «ماذا تتوقع أن ترى عند قطعها طوليًا؟» ويطلب رسمًا تنبؤيًا سريعًا.</p>","<table class=\"tb proc\" ق.</td><td>استخدام عدسة مكبرة أو مجهر تشريحي، وحقن صبغة في الشريان الكلوي لإظهار الأوعية، ومقارنة المقطع بصورة مرجعية.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 4-1 مع الرسوم</p><p><b>إرشاد لولي الأمر:</b> التأكد من إكمال الابن رسم المقطع الطولي مع التسميات</p>"]}]},{"title":"التحكم في المحتوى المائي","sb":"ص 135–138","unit":"الوحدة 4: الاتزان الداخلي","periods":[{"axis":"التنظيم الأسموزي وهرمون ‎ADH‎ والأكوابورينات","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","التحكم في المحتوى المائي"],["الحصة","1 من 1"],["محور الحصة","التنظيم الأسموزي وهرمون ‎ADH‎ والأكوابورينات"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 135–138"],["دليل المعلم","ص 172–175"],["كتاب التجارب العملية والأنشطة","نشاط 4-2: التنظيم الأسموزي والمشروبات متساوية التركيز (إثرائي) ص 87"]],"t":["1. يشرح دور منطقة تحت المهاد والغدة النخامية الخلفية وهرمون ‎ADH‎ في التحكم في المحتوى المائي\n2. يشرح كيف يزيد ‎ADH‎ نفاذية القنوات الجامعة للماء عبر إدخال الأكوابورينات في الغشاء\nمخرج تعليمي آخر: يطبق مبدأ التغذية الراجعة السلبية على تنظيم الجهد المائي للدم","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الجمل المختلطة","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة","التنظيم الأسموزي، الجهد المائي للدم، منطقة تحت المهاد، المستقبلات الأسموزية، الغدة النخامية الخلفية، هرمون ‎ADH‎، الأكوابورينات، القناة الجامعة.","يسأل المعلم: «بعد مباراة كرة قدم في ظهيرة صيفية يكون بولك قليلًا داكنًا، وبعد شرب لترين من الماء يصبح كثيرًا فاتحًا؛ من يتحكم في ذلك؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يطرح السؤال ويستقبل الإجابات\nالطالب: يربطون كمية البول بكمية الماء في الجسم\n2) (14 دقيقة: من الدقيقة 4 إلى 18)\nالمعلم: يشرح التنظيم الأسموزي: المستقبلات الأسموزية، وإفراز ‎ADH‎، والأكوابورينات، والتغذية الراجعة بالأشكال 4-12 إلى 4-18\nالطالب: يرسمون حلقتي التغذية الراجعة (نقص الماء وزيادته)\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يوجه نشاط 4-2 (إثرائي، ص 87) أو نشاط «الجمل المختلطة» عن ‎ADH‎\nالطالب: يرتبون الجمل المختلطة ويحلون الأسئلة 7–9\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التحكم في المحتوى المائي\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أين توجد المستقبلات الأسموزية؟\n   الإجابة النموذجية: في منطقة تحت المهاد في الدماغ.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لإفراز ‎ADH‎ عند انخفاض الجهد المائي للدم؟\n   الإجابة النموذجية: يزداد إفرازه من الغدة النخامية الخلفية.\n3) (المستوى المتقدم) السؤال: كيف يزيد ‎ADH‎ إعادة امتصاص الماء؟\n   الإجابة النموذجية: يرتبط بمستقبلات خلايا القناة الجامعة فتندمج حويصلات تحمل الأكوابورينات بالغشاء فتزيد نفاذيته للماء.","1) (مستوى الدعم) السؤال: ما الغدة التي تفرز ‎ADH‎ في الدم؟\n   الإجابة النموذجية: الغدة النخامية الخلفية.\n2) (المستوى المتوقع) السؤال: صف أثر شرب كمية كبيرة من الماء على ‎ADH‎ والبول.\n   الإجابة النموذجية: يرتفع الجهد المائي للدم فيقل إفراز ‎ADH‎ فتقل الأكوابورينات في القناة الجامعة فيُطرح بول كثير مخفف.\n3) (المستوى المتقدم) السؤال: لماذا يعد تنظيم المحتوى المائي مثالًا على التغذية الراجعة السلبية؟\n   الإجابة النموذجية: لأن انخفاض الجهد المائي يؤدي إلى استجابات (زيادة ‎ADH‎ وإعادة امتصاص الماء) ترفعه مجددًا، وارتفاعه يؤدي إلى عكس ذلك.","إرشاد للطالب: مراجعة ص 135–138 وحل الأسئلة 7–9\nإرشاد لولي الأمر: تشجيع الابن على شرب الماء بانتظام خاصة في الأجواء الحارة وملاحظة لون البول مؤشرًا على الترطيب"],"h":["<ol class=\"ol\"><li>يشرح دور منطقة تحت المهاد والغدة النخامية الخلفية وهرمون ‎ADH‎ في التحكم في المحتوى المائي</li><li>يشرح كيف يزيد ‎ADH‎ نفاذية القنوات الجامعة للماء عبر إدخال الأكوابورينات في الغشاء</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يطبق مبدأ التغذية الراجعة السلبية على تنظيم الجهد المائي للدم</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح دور منطقة تحت المهاد والغدة النخامية الخلفية وهرمون ‎ADH‎ في التحكم في المحتوى المائي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح كيف يزيد ‎ADH‎ نفاذية القنوات الجامعة للماء عبر إدخال الأكوابورينات في الغشاء</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يطبق مبدأ التغذية الراجعة السلبية على تنظيم الجهد المائي للدم</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الجمل المختلطة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>التنظيم الأسموزي، الجهد المائي للدم، منطقة تحت المهاد، المستقبلات الأسموزية، الغدة النخامية الخلفية، هرمون ‎ADH‎، الأكوابورينات، القناة الجامعة.</p>","<p>يسأل المعلم: «بعد مباراة كرة قدم في ظهيرة صيفية يكون بولك قليلًا داكنًا، وبعد شرب لترين من الماء يصبح كثيرًا فاتحًا؛ من يتحكم في ذلك؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يطرح السؤال ويستقبل الإجابات</td><td>يربطون كمية البول بكمية الماء في الجسم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–18</span><br><small>14 دقيقة</small></td><td>يشرح التنظيم الأسموزي: المستقبلات الأسموزية، وإفراز ‎ADH‎، والأكوابورينات، والتغذية الراجعة بالأشكال 4-12 إلى 4-18</td><td>يرسمون حلقتي التغذية الراجعة (نقص الماء وزيادته)</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يوجه نشاط 4-2 (إثرائي، ص 87) أو نشاط «الجمل المختلطة» عن ‎ADH‎</td><td>يرتبون الجمل المختلطة ويحلون الأسئلة 7–9</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات على التحكم في المحتوى المائي</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين توجد المستقبلات الأسموزية؟</td><td>في منطقة تحت المهاد في الدماغ.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لإفراز ‎ADH‎ عند انخفاض الجهد المائي للدم؟</td><td>يزداد إفرازه من الغدة النخامية الخلفية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يزيد ‎ADH‎ إعادة امتصاص الماء؟</td><td>يرتبط بمستقبلات خلايا القناة الجامعة فتندمج حويصلات تحمل الأكوابورينات بالغشاء فتزيد نفاذيته للماء.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الغدة التي تفرز ‎ADH‎ في الدم؟</td><td>الغدة النخامية الخلفية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف أثر شرب كمية كبيرة من الماء على ‎ADH‎ والبول.</td><td>يرتفع الجهد المائي للدم فيقل إفراز ‎ADH‎ فتقل الأكوابورينات في القناة الجامعة فيُطرح بول كثير مخفف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يعد تنظيم المحتوى المائي مثالًا على التغذية الراجعة السلبية؟</td><td>لأن انخفاض الجهد المائي يؤدي إلى استجابات (زيادة ‎ADH‎ وإعادة امتصاص الماء) ترفعه مجددًا، وارتفاعه يؤدي إلى عكس ذلك.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 135–138 وحل الأسئلة 7–9</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرب الماء بانتظام خاصة في الأجواء الحارة وملاحظة لون البول مؤشرًا على الترطيب</p>"]}]},{"title":"التحكم في تركيز جلوكوز الدم","sb":"ص 139–145","unit":"الوحدة 4: الاتزان الداخلي","periods":[{"axis":"الإنسولين والجلوكاجون والتغذية الراجعة السلبية","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","التحكم في تركيز جلوكوز الدم"],["الحصة","1 من 4"],["محور الحصة","الإنسولين والجلوكاجون والتغذية الراجعة السلبية"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 139–141"],["دليل المعلم","ص 176–180"],["كتاب التجارب العملية والأنشطة","نشاط 4-1: آلية عمل عقار ميتفورمين ص 80؛ الاستقصاء العملي 4-2: تحليل البول (إثرائي) ص 105"]],"t":["1. يشرح كيف تنظم آليات التغذية الراجعة السلبية تركيز الجلوكوز في الدم بالإنسولين والجلوكاجون\n2. يصف تأثير الإنسولين في خلايا العضلات والكبد بزيادة نفاذيتها للجلوكوز (نواقل ‎GLUT4‎) وتحويله إلى جلايكوجين\nمخرج تعليمي آخر: يحلل تمثيلات بيانية لتراكيز الجلوكوز والإنسولين والجلوكاجون بعد وجبة","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني\n- المناقشة التفاعلية","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","خلايا بيتا، خلايا ألفا، الإنسولين، الجلوكاجون، نواقل ‎GLUT4‎، الجلايكوجين، تحلل الجلايكوجين، استحداث الجلوكوز، التغذية الراجعة السلبية.","يعرض المعلم تمثيلًا بيانيًا لتركيز الجلوكوز بعد وجبة (منحنى يشبه الموجة) ويسأل: «لماذا ارتفع المنحنى ثم عاد؟ ومن أعاده؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض التمثيل البياني ويطرح السؤال\nالطالب: يصفون التغير ويقترحون دور الهرمونات\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خلايا ألفا وبيتا في البنكرياس، وعمل الإنسولين (‎GLUT4‎، الجلايكوجين) والجلوكاجون (تحلل الجلايكوجين، استحداث الجلوكوز)\nالطالب: يرسمون حلقتي التغذية الراجعة لارتفاع الجلوكوز وانخفاضه\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يدير «مناقشة تفاعلية للصف ككل: وصف التمثيلات البيانية وشرحها»\nالطالب: يصفون ويشرحون تغير تراكيز الهرمونين على تمثيلات معطاة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخلايا التي تفرز الإنسولين؟\n   الإجابة النموذجية: خلايا بيتا في البنكرياس.\n2) (المستوى المتوقع) السؤال: كيف يزيد الإنسولين امتصاص خلايا العضلات للجلوكوز؟\n   الإجابة النموذجية: يحفز إدخال نواقل ‎GLUT4‎ في غشاء الخلية فتزيد نفاذيتها للجلوكوز.\n3) (المستوى المتقدم) السؤال: لماذا ينخفض تركيز الجلوكاجون بعد الوجبة؟\n   الإجابة النموذجية: لأن ارتفاع الجلوكوز في الدم يثبط إفرازه من خلايا ألفا.","1) (مستوى الدعم) السؤال: ما وظيفة الجلوكاجون؟\n   الإجابة النموذجية: رفع تركيز الجلوكوز في الدم بتحفيز تحلل الجلايكوجين واستحداث الجلوكوز في الكبد.\n2) (المستوى المتوقع) السؤال: صف التغذية الراجعة السلبية عند ارتفاع الجلوكوز بعد وجبة.\n   الإجابة النموذجية: يرتفع الجلوكوز ← تكشفه خلايا بيتا ← يُفرز الإنسولين ← تمتص الخلايا الجلوكوز ويتحول إلى جلايكوجين ← ينخفض الجلوكوز إلى الطبيعي ← يقل إفراز الإنسولين.\n3) (المستوى المتقدم) السؤال: لماذا يُعد وجود هرمونين متعاكسين أدق من هرمون واحد في التنظيم؟\n   الإجابة النموذجية: لأنه يسمح بتصحيح الانحراف في الاتجاهين بسرعة ودقة بدلًا من الاعتماد على انخفاض هرمون واحد فقط.","إرشاد للطالب: مراجعة ص 139–141 ورسم حلقتي التغذية الراجعة\nإرشاد لولي الأمر: الحديث مع الابن عن العادات الغذائية الصحية وأثرها على تنظيم سكر الدم"],"h":["<ol class=\"ol\"><li>يشرح كيف تنظم آليات التغذية الراجعة السلبية تركيز الجلوكوز في الدم بالإنسولين والجلوكاجون</li><li>يصف تأثير الإنسولين في خلايا العضلات والكبد بزيادة نفاذيتها للجلوكوز (نواقل ‎GLUT4‎) وتحويله إلى جلايكوجين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحلل تمثيلات بيانية لتراكيز الجلوكوز والإنسولين والجلوكاجون بعد وجبة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح كيف تنظم آليات التغذية الراجعة السلبية تركيز الجلوكوز في الدم بالإنسولين والجلوكاجون</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف تأثير الإنسولين في خلايا العضلات والكبد بزيادة نفاذيتها للجلوكوز (نواقل ‎GLUT4‎) وتحويله إلى جلايكوجين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحلل تمثيلات بيانية لتراكيز الجلوكوز والإنسولين والجلوكاجون بعد وجبة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">المناقشة التفاعلية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>خلايا بيتا، خلايا ألفا، الإنسولين، الجلوكاجون، نواقل ‎GLUT4‎، الجلايكوجين، تحلل الجلايكوجين، استحداث الجلوكوز، التغذية الراجعة السلبية.</p>","<p>يعرض المعلم تمثيلًا بيانيًا لتركيز الجلوكوز بعد وجبة (منحنى يشبه الموجة) ويسأل: «لماذا ارتفع المنحنى ثم عاد؟ ومن أعاده؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض التمثيل البياني ويطرح السؤال</td><td>يصفون التغير ويقترحون دور الهرمونات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خلايا ألفا وبيتا في البنكرياس، وعمل الإنسولين (‎GLUT4‎، الجلايكوجين) والجلوكاجون (تحلل الجلايكوجين، استحداث الجلوكوز)</td><td>يرسمون حلقتي التغذية الراجعة لارتفاع الجلوكوز وانخفاضه</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يدير «مناقشة تفاعلية للصف ككل: وصف التمثيلات البيانية وشرحها»</td><td>يصفون ويشرحون تغير تراكيز الهرمونين على تمثيلات معطاة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخلايا التي تفرز الإنسولين؟</td><td>خلايا بيتا في البنكرياس.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يزيد الإنسولين امتصاص خلايا العضلات للجلوكوز؟</td><td>يحفز إدخال نواقل ‎GLUT4‎ في غشاء الخلية فتزيد نفاذيتها للجلوكوز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا ينخفض تركيز الجلوكاجون بعد الوجبة؟</td><td>لأن ارتفاع الجلوكوز في الدم يثبط إفرازه من خلايا ألفا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة الجلوكاجون؟</td><td>رفع تركيز الجلوكوز في الدم بتحفيز تحلل الجلايكوجين واستحداث الجلوكوز في الكبد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف التغذية الراجعة السلبية عند ارتفاع الجلوكوز بعد وجبة.</td><td>يرتفع الجلوكوز ← تكشفه خلايا بيتا ← يُفرز الإنسولين ← تمتص الخلايا الجلوكوز ويتحول إلى جلايكوجين ← ينخفض الجلوكوز إلى الطبيعي ← يقل إفراز الإنسولين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد وجود هرمونين متعاكسين أدق من هرمون واحد في التنظيم؟</td><td>لأنه يسمح بتصحيح الانحراف في الاتجاهين بسرعة ودقة بدلًا من الاعتماد على انخفاض هرمون واحد فقط.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 139–141 ورسم حلقتي التغذية الراجعة</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن العادات الغذائية الصحية وأثرها على تنظيم سكر الدم</p>"]},{"axis":"التأشير الخلوي: الجلوكاجون والرسول الثاني ‎cAMP‎","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","التحكم في تركيز جلوكوز الدم"],["الحصة","2 من 4"],["محور الحصة","التأشير الخلوي: الجلوكاجون والرسول الثاني ‎cAMP‎"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 141–143"],["دليل المعلم","ص 176–180"],["كتاب التجارب العملية والأنشطة","نشاط 4-1: آلية عمل عقار ميتفورمين ص 80؛ الاستقصاء العملي 4-2: تحليل البول (إثرائي) ص 105"]],"t":["1. يصف مبادئ التأشير الخلوي بمثال الجلوكاجون: ارتباطه بالمستقبل، وتنشيط بروتين ‎G‎، وإنزيم أدينيليل سيكليز، وتكوين ‎cAMP‎\n2. يشرح تضخيم الإشارة عبر سلسلة تفاعلات إنزيمية تنتهي بتنشيط إنزيم فوسفوريليز الجلايكوجين\nمخرج تعليمي آخر: يفسر لماذا لا يدخل الجلوكاجون إلى الخلية مع ذلك يغير نشاطها","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني\n- فهم الآليات","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","التأشير الخلوي، المستقبل، بروتين ‎G‎، أدينيليل سيكليز، ‎cAMP (‎الرسول الثاني)، بروتين كاينيز ‎A‎، سلسلة الإنزيمات، التضخيم، فوسفوريليز الجلايكوجين.","يسأل المعلم: «الجلوكاجون بروتين كبير لا يعبر الغشاء؛ كيف يوصل رسالته إلى داخل خلية الكبد؟» ويشبّه ذلك بجرس الباب.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال وتشبيه الجرس\nالطالب: يقترحون وجود مستقبل على سطح الخلية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات التأشير بالشكل 4-20 (ارتباط الهرمون، بروتين ‎G‎، أدينيليل سيكليز، ‎cAMP‎، سلسلة إنزيمات الكاينيز، الفوسفوريليز)\nالطالب: يرتبون بطاقات الخطوات ويرسمون سهم التضخيم\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: ينفذ نشاط «فهم الآليات» بلعب أدوار التضخيم (كل طالب ينشط اثنين)\nالطالب: يمثلون السلسلة ويحسبون عدد الجزيئات المنشطة في كل مستوى\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الرسول الثاني في تأشير الجلوكاجون؟\n   الإجابة النموذجية: ‎cAMP‎.\n2) (المستوى المتوقع) السؤال: ما الإنزيم الذي يحول ‎ATP‎ إلى ‎cAMP‎؟\n   الإجابة النموذجية: أدينيليل سيكليز.\n3) (المستوى المتقدم) السؤال: ما معنى تضخيم الإشارة؟\n   الإجابة النموذجية: جزيء هرمون واحد يؤدي إلى تنشيط أعداد كبيرة جدًا من الإنزيمات عبر سلسلة التفاعلات.","1) (مستوى الدعم) السؤال: أين يرتبط الجلوكاجون في الخلية الهدف؟\n   الإجابة النموذجية: بمستقبل نوعي على غشاء سطح الخلية.\n2) (المستوى المتوقع) السؤال: رتب: ‎cAMP‎، بروتين ‎G‎، المستقبل، أدينيليل سيكليز، فوسفوريليز الجلايكوجين.\n   الإجابة النموذجية: المستقبل ← بروتين ‎G ←‎ أدينيليل سيكليز ← ‎cAMP ← (‎بروتين كاينيز ‎A) ←‎ فوسفوريليز الجلايكوجين.\n3) (المستوى المتقدم) السؤال: لماذا تستجيب خلايا الكبد للجلوكاجون بينما لا تستجيب خلايا أخرى؟\n   الإجابة النموذجية: لأن خلايا الكبد تمتلك المستقبلات النوعية للجلوكاجون على أغشيتها.","إرشاد للطالب: مراجعة ص 141–143 وكتابة خطوات التأشير الخلوي بترتيب صحيح\nإرشاد لولي الأمر: تشجيع الابن على شرح تشبيه «جرس الباب» لأحد أفراد الأسرة"],"h":["<ol class=\"ol\"><li>يصف مبادئ التأشير الخلوي بمثال الجلوكاجون: ارتباطه بالمستقبل، وتنشيط بروتين ‎G‎، وإنزيم أدينيليل سيكليز، وتكوين ‎cAMP‎</li><li>يشرح تضخيم الإشارة عبر سلسلة تفاعلات إنزيمية تنتهي بتنشيط إنزيم فوسفوريليز الجلايكوجين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا لا يدخل الجلوكاجون إلى الخلية مع ذلك يغير نشاطها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف مبادئ التأشير الخلوي بمثال الجلوكاجون: ارتباطه بالمستقبل، وتنشيط بروتين ‎G‎، وإنزيم أدينيليل سيكليز، وتكوين ‎cAMP‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح تضخيم الإشارة عبر سلسلة تفاعلات إنزيمية تنتهي بتنشيط إنزيم فوسفوريليز الجلايكوجين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا لا يدخل الجلوكاجون إلى الخلية مع ذلك يغير نشاطها</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">فهم الآليات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>التأشير الخلوي، المستقبل، بروتين ‎G‎، أدينيليل سيكليز، ‎cAMP (‎الرسول الثاني)، بروتين كاينيز ‎A‎، سلسلة الإنزيمات، التضخيم، فوسفوريليز الجلايكوجين.</p>","<p>يسأل المعلم: «الجلوكاجون بروتين كبير لا يعبر الغشاء؛ كيف يوصل رسالته إلى داخل خلية الكبد؟» ويشبّه ذلك بجرس الباب.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال وتشبيه الجرس</td><td>يقترحون وجود مستقبل على سطح الخلية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خطوات التأشير بالشكل 4-20 (ارتباط الهرمون، بروتين ‎G‎، أدينيليل سيكليز، ‎cAMP‎، سلسلة إنزيمات الكاينيز، الفوسفوريليز)</td><td>يرتبون بطاقات الخطوات ويرسمون سهم التضخيم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>ينفذ نشاط «فهم الآليات» بلعب أدوار التضخيم (كل طالب ينشط اثنين)</td><td>يمثلون السلسلة ويحسبون عدد الجزيئات المنشطة في كل مستوى</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الرسول الثاني في تأشير الجلوكاجون؟</td><td>‎cAMP‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الإنزيم الذي يحول ‎ATP‎ إلى ‎cAMP‎؟</td><td>أدينيليل سيكليز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما معنى تضخيم الإشارة؟</td><td>جزيء هرمون واحد يؤدي إلى تنشيط أعداد كبيرة جدًا من الإنزيمات عبر سلسلة التفاعلات.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين يرتبط الجلوكاجون في الخلية الهدف؟</td><td>بمستقبل نوعي على غشاء سطح الخلية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب: ‎cAMP‎، بروتين ‎G‎، المستقبل، أدينيليل سيكليز، فوسفوريليز الجلايكوجين.</td><td>المستقبل ← بروتين ‎G ←‎ أدينيليل سيكليز ← ‎cAMP ← (‎بروتين كاينيز ‎A) ←‎ فوسفوريليز الجلايكوجين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تستجيب خلايا الكبد للجلوكاجون بينما لا تستجيب خلايا أخرى؟</td><td>لأن خلايا الكبد تمتلك المستقبلات النوعية للجلوكاجون على أغشيتها.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 141–143 وكتابة خطوات التأشير الخلوي بترتيب صحيح</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح تشبيه «جرس الباب» لأحد أفراد الأسرة</p>"]},{"axis":"شرائط الاختبار والمستشعرات الحيوية للجلوكوز","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","التحكم في تركيز جلوكوز الدم"],["الحصة","3 من 4"],["محور الحصة","شرائط الاختبار والمستشعرات الحيوية للجلوكوز"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 144–145"],["دليل المعلم","ص 176–180"],["كتاب التجارب العملية والأنشطة","نشاط 4-1: آلية عمل عقار ميتفورمين ص 80؛ الاستقصاء العملي 4-2: تحليل البول (إثرائي) ص 105"]],"t":["1. يشرح مبادئ عمل شرائط اختبار الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز\n2. يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم\nمخرج تعليمي آخر: يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تقييم","- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات\n- العرض التوضيحي","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: شرائط اختبار الجلوكوز، محاليل جلوكوز بتراكيز مختلفة، جهاز قياس سكر الدم (للعرض)","شرائط الاختبار، الجلوكوز أكسيديز، البيروكسيديز، تغير اللون، المستشعر الحيوي، القطب الكهربائي، الإشارة الكهربائية.","يقدم المعلم «عرضًا توضيحيًا موجزًا: لماذا التثبيت؟» بغمس شريط اختبار في محلول جلوكوز ويسأل: «كيف عرف الشريط الجلوكوز من بين كل مكونات البول؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يجري العرض ويطرح السؤال\nالطالب: يقترحون وجود إنزيم نوعي\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح تفاعلي الجلوكوز أكسيديز (جلوكوز ← حمض الجلوكونيك ‎+ H₂O₂‎) والبيروكسيديز (تغير لون الصبغة) ومبدأ المستشعر الحيوي\nالطالب: يكتبون المعادلات اللفظية ويرسمون مبدأ المستشعر\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوزع محاليل مجهولة التركيز لاختبارها بالشرائط ومقارنتها بالمخطط اللوني\nالطالب: يقدرون التراكيز ويحلون الأسئلة 14 و16\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الإنزيم الذي يتفاعل مع الجلوكوز في شريط الاختبار؟\n   الإجابة النموذجية: الجلوكوز أكسيديز.\n2) (المستوى المتوقع) السؤال: لماذا لا يتفاعل الشريط مع سكريات أخرى؟\n   الإجابة النموذجية: لأن الجلوكوز أكسيديز نوعي للجلوكوز وفق شكل موقعه النشط.\n3) (المستوى المتقدم) السؤال: اذكر ميزة لاستخدام الشرائط بدل محلول بندكت.\n   الإجابة النموذجية: أسرع ولا تحتاج تسخينًا ونوعية للجلوكوز وتعطي تقديرًا لتركيزه.","1) (مستوى الدعم) السؤال: ما الناتج الذي يكشفه إنزيم البيروكسيديز؟\n   الإجابة النموذجية: فوق أكسيد الهيدروجين ‎(H₂O₂)‎، فيتفاعل مع صبغة ويتغير لونها.\n2) (المستوى المتوقع) السؤال: ما مبدأ عمل المستشعر الحيوي للجلوكوز؟\n   الإجابة النموذجية: يتفاعل الجلوكوز مع إنزيم مثبت على قطب فتنتج إشارة كهربائية تتناسب مع تركيزه تُعرض رقميًا.\n3) (المستوى المتقدم) السؤال: لماذا يفضل قياس الجلوكوز في الدم بالمستشعر على قياسه في البول بالشرائط؟\n   الإجابة النموذجية: لأنه يعطي التركيز الحالي الدقيق في الدم مباشرة، بينما البول يعكس تركيزًا سابقًا ولا يظهر الجلوكوز فيه إلا عند تجاوز حد إعادة الامتصاص.","إرشاد للطالب: مراجعة ص 144–145 وحل الأسئلة 14–16\nإرشاد لولي الأمر: يمكن عرض جهاز قياس السكر المنزلي على الابن (إن وُجد) وشرح طريقة عمله"],"h":["<ol class=\"ol\"><li>يشرح مبادئ عمل شرائط اختبار الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز</li><li>يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح مبادئ عمل شرائط اختبار الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">العرض التوضيحي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: شرائط اختبار الجلوكوز، محاليل جلوكوز بتراكيز مختلفة، جهاز قياس سكر الدم (للعرض)</span></div>","<p>شرائط الاختبار، الجلوكوز أكسيديز، البيروكسيديز، تغير اللون، المستشعر الحيوي، القطب الكهربائي، الإشارة الكهربائية.</p>","<p>يقدم المعلم «عرضًا توضيحيًا موجزًا: لماذا التثبيت؟» بغمس شريط اختبار في محلول جلوكوز ويسأل: «كيف عرف الشريط الجلوكوز من بين كل مكونات البول؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يجري العرض ويطرح السؤال</td><td>يقترحون وجود إنزيم نوعي</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح تفاعلي الجلوكوز أكسيديز (جلوكوز ← حمض الجلوكونيك ‎+ H₂O₂‎) والبيروكسيديز (تغير لون الصبغة) ومبدأ المستشعر الحيوي</td><td>يكتبون المعادلات اللفظية ويرسمون مبدأ المستشعر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوزع محاليل مجهولة التركيز لاختبارها بالشرائط ومقارنتها بالمخطط اللوني</td><td>يقدرون التراكيز ويحلون الأسئلة 14 و16</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الإنزيم الذي يتفاعل مع الجلوكوز في شريط الاختبار؟</td><td>الجلوكوز أكسيديز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يتفاعل الشريط مع سكريات أخرى؟</td><td>لأن الجلوكوز أكسيديز نوعي للجلوكوز وفق شكل موقعه النشط.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر ميزة لاستخدام الشرائط بدل محلول بندكت.</td><td>أسرع ولا تحتاج تسخينًا ونوعية للجلوكوز وتعطي تقديرًا لتركيزه.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الناتج الذي يكشفه إنزيم البيروكسيديز؟</td><td>فوق أكسيد الهيدروجين ‎(H₂O₂)‎، فيتفاعل مع صبغة ويتغير لونها.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما مبدأ عمل المستشعر الحيوي للجلوكوز؟</td><td>يتفاعل الجلوكوز مع إنزيم مثبت على قطب فتنتج إشارة كهربائية تتناسب مع تركيزه تُعرض رقميًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يفضل قياس الجلوكوز في الدم بالمستشعر على قياسه في البول بالشرائط؟</td><td>لأنه يعطي التركيز الحالي الدقيق في الدم مباشرة، بينما البول يعكس تركيزًا سابقًا ولا يظهر الجلوكوز فيه إلا عند تجاوز حد إعادة الامتصاص.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 144–145 وحل الأسئلة 14–16</p><p><b>إرشاد لولي الأمر:</b> يمكن عرض جهاز قياس السكر المنزلي على الابن (إن وُجد) وشرح طريقة عمله</p>"]},{"axis":"نشاط 4-1: عقار ميتفورمين ومرض السكري","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","التحكم في تركيز جلوكوز الدم"],["الحصة","4 من 4"],["محور الحصة","نشاط 4-1: عقار ميتفورمين ومرض السكري"],["الأسبوع والتاريخ","الأسبوع الثاني عشر (22–26/11/2026)"],["كتاب الطالب","ص 139–145 + كتاب التجارب ص 80"],["دليل المعلم","ص 176–180"],["كتاب التجارب العملية والأنشطة","نشاط 4-1: آلية عمل عقار ميتفورمين ص 80؛ الاستقصاء العملي 4-2: تحليل البول (إثرائي) ص 105"]],"t":["1. يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم\n2. يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24)\nمخرج تعليمي آخر: يفسر سبب عدم إمكانية تناول الإنسولين بالفم","المخرج 1: تحليل\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- أخرى: كتاب التجارب العملية والأنشطة","داء السكري، مقاومة الإنسولين، عقار ميتفورمين، استحداث الجلوكوز، التمثيل البياني، الحقن.","يعرض المعلم الشكل 4-24 (منحنيات شخص سليم ومصاب) ويسأل: «ما أول فرق تلاحظه بين المنحنيين؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الشكل ويستقبل الملاحظات\nالطالب: يصفون الفروق في القمة وزمن العودة\n2) (15 دقيقة: من الدقيقة 5 إلى 20)\nالمعلم: يوجه حل نشاط 4-1 «آلية عمل عقار ميتفورمين» (كتاب التجارب ص 80)\nالطالب: يحللون البيانات في مجموعات ويستنتجون أثر العقار في الكبد\n3) (10 دقائق: من الدقيقة 20 إلى 30)\nالمعلم: يوجه حل السؤال 15 (أ، ب)\nالطالب: يصفون التغيرات ويفسرون عدم تناول الإنسولين بالفم\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على تنظيم الجلوكوز\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ماذا يحدث لتركيز الجلوكوز بعد تناوله لدى المصاب بالسكري مقارنة بالسليم؟\n   الإجابة النموذجية: يرتفع أكثر ويبقى مرتفعًا مدة أطول.\n2) (المستوى المتوقع) السؤال: لماذا لا يؤخذ الإنسولين بالفم؟\n   الإجابة النموذجية: لأنه بروتين تهضمه إنزيمات البروتييز في القناة الهضمية قبل امتصاصه.\n3) (المستوى المتقدم) السؤال: كيف يخفض ميتفورمين الجلوكوز في الدم وفق النشاط؟\n   الإجابة النموذجية: بتقليل استحداث الجلوكوز في الكبد وزيادة حساسية الخلايا للإنسولين.","1) (مستوى الدعم) السؤال: اقترح طريقة لمراقبة فاعلية الإنسولين لدى المصاب بالسكري.\n   الإجابة النموذجية: قياس الجلوكوز في الدم بالمستشعر الحيوي قبل الوجبات وبعدها بانتظام.\n2) (المستوى المتوقع) السؤال: صف منحنى الإنسولين لدى الشخص السليم بعد تناول الجلوكوز.\n   الإجابة النموذجية: يرتفع سريعًا بعد ارتفاع الجلوكوز ثم ينخفض مع عودة الجلوكوز إلى الطبيعي.\n3) (المستوى المتقدم) السؤال: لماذا قد يرتفع الإنسولين لدى بعض مرضى السكري دون أن ينخفض الجلوكوز كثيرًا؟\n   الإجابة النموذجية: بسبب مقاومة الخلايا للإنسولين (ضعف استجابة مستقبلاتها)، فلا تمتص الجلوكوز بكفاءة رغم وجوده.","إرشاد للطالب: إكمال نشاط 4-1 ص 80 وحل السؤال 15\nإرشاد لولي الأمر: الحديث مع الابن عن الوقاية من السكري بالنشاط البدني والغذاء المتوازن"],"h":["<ol class=\"ol\"><li>يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم</li><li>يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر سبب عدم إمكانية تناول الإنسولين بالفم</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر سبب عدم إمكانية تناول الإنسولين بالفم</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>داء السكري، مقاومة الإنسولين، عقار ميتفورمين، استحداث الجلوكوز، التمثيل البياني، الحقن.</p>","<p>يعرض المعلم الشكل 4-24 (منحنيات شخص سليم ومصاب) ويسأل: «ما أول فرق تلاحظه بين المنحنيين؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الشكل ويستقبل الملاحظات</td><td>يصفون الفروق في القمة وزمن العودة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–20</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 4-1 «آلية عمل عقار ميتفورمين» (كتاب التجارب ص 80)</td><td>يحللون البيانات في مجموعات ويستنتجون أثر العقار في الكبد</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">20–30</span><br><small>10 دقائق</small></td><td>يوجه حل السؤال 15 (أ، ب)</td><td>يصفون التغيرات ويفسرون عدم تناول الإنسولين بالفم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات على تنظيم الجلوكوز</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا يحدث لتركيز الجلوكوز بعد تناوله لدى المصاب بالسكري مقارنة بالسليم؟</td><td>يرتفع أكثر ويبقى مرتفعًا مدة أطول.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يؤخذ الإنسولين بالفم؟</td><td>لأنه بروتين تهضمه إنزيمات البروتييز في القناة الهضمية قبل امتصاصه.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يخفض ميتفورمين الجلوكوز في الدم وفق النشاط؟</td><td>بتقليل استحداث الجلوكوز في الكبد وزيادة حساسية الخلايا للإنسولين.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اقترح طريقة لمراقبة فاعلية الإنسولين لدى المصاب بالسكري.</td><td>قياس الجلوكوز في الدم بالمستشعر الحيوي قبل الوجبات وبعدها بانتظام.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف منحنى الإنسولين لدى الشخص السليم بعد تناول الجلوكوز.</td><td>يرتفع سريعًا بعد ارتفاع الجلوكوز ثم ينخفض مع عودة الجلوكوز إلى الطبيعي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا قد يرتفع الإنسولين لدى بعض مرضى السكري دون أن ينخفض الجلوكوز كثيرًا؟</td><td>بسبب مقاومة الخلايا للإنسولين (ضعف استجابة مستقبلاتها)، فلا تمتص الجلوكوز بكفاءة رغم وجوده.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 4-1 ص 80 وحل السؤال 15</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن الوقاية من السكري بالنشاط البدني والغذاء المتوازن</p>"]}]},{"title":"الاتزان الداخلي في النباتات","sb":"ص 146–163","unit":"الوحدة 4: الاتزان الداخلي","periods":[{"axis":"تركيب الخلايا الحارسة والثغور","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","الاتزان الداخلي في النباتات"],["الحصة","1 من 3"],["محور الحصة","تركيب الخلايا الحارسة والثغور"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 146–148"],["دليل المعلم","ص 181–184"],["كتاب التجارب العملية والأنشطة","نشاط 4-3: فتح الثغور في النباتات ص 90"]],"t":["1. يصف تركيب الخلايا الحارسة ووظيفتها\n2. يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء\nمخرج تعليمي آخر: يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء الخلايا الحارسة","- الكتاب\n- صورة توضيحية\n- أخرى: مجاهر، أوراق نباتات، طلاء أظافر شفاف، شرائح","الثغر، الخلايا الحارسة، الجدار الخلوي غير المتساوي السمك، البلاستيدات الخضراء، النتح، تبادل الغازات، المفاضلة (التوازن).","يسأل المعلم: «الورقة تحتاج ‎CO₂‎ للبناء الضوئي، لكن كل فتحة تُدخل ‎CO₂‎ تُخرج ماءً؛ كيف تحل النبتة هذه المعضلة في صيف عمان؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح المعضلة ويستقبل الحلول\nالطالب: يقترحون التحكم في فتح الفتحات وإغلاقها\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يشرح تركيب الخلايا الحارسة (جدار داخلي سميك، بلاستيدات) والمفاضلة بين ‎CO₂‎ والماء\nالطالب: يرسمون ثغرًا مفتوحًا ومغلقًا\n3) (18 دقيقة: من الدقيقة 15 إلى 33)\nالمعلم: يوجه «استقصاء الخلايا الحارسة والثغور» بطبعة طلاء الأظافر\nالطالب: يحضرون الطبعة ويفحصونها ويعدون الثغور في مجال الرؤية\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما وظيفة الخلايا الحارسة؟\n   الإجابة النموذجية: التحكم في فتح الثغر وإغلاقه.\n2) (المستوى المتوقع) السؤال: لماذا يكون الجدار الداخلي للخلية الحارسة أسمك؟\n   الإجابة النموذجية: لأن عدم تساوي السمك يجعل الخلية تنحني عند امتلائها بالماء فيُفتح الثغر.\n3) (المستوى المتقدم) السؤال: لماذا تُغلق الثغور غالبًا في الظلام؟\n   الإجابة النموذجية: لأن البناء الضوئي يتوقف فلا حاجة لدخول ‎CO₂‎، فيقل فقد الماء.","1) (مستوى الدعم) السؤال: سمِّ الخليتين المحيطتين بالثغر.\n   الإجابة النموذجية: الخليتان الحارستان.\n2) (المستوى المتوقع) السؤال: ما المقصود بالمفاضلة في عمل الثغور؟\n   الإجابة النموذجية: الموازنة بين الحاجة إلى إدخال ‎CO₂‎ للبناء الضوئي وتجنب فقد الماء بالنتح.\n3) (المستوى المتقدم) السؤال: لماذا قد تُغلق الثغور في منتصف نهار شديد الحرارة رغم توفر الضوء؟\n   الإجابة النموذجية: لأن فقد الماء الشديد يهدد النبات بالذبول، فتُقدَّم حماية الماء على البناء الضوئي مؤقتًا.","إرشاد للطالب: مراجعة ص 146–148 ورسم الثغر المفتوح والمغلق\nإرشاد لولي الأمر: يمكن تنفيذ تجربة طبعة طلاء الأظافر على ورقة نبات منزلي بإشراف ولي الأمر"],"h":["<ol class=\"ol\"><li>يصف تركيب الخلايا الحارسة ووظيفتها</li><li>يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب الخلايا الحارسة ووظيفتها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">استقصاء الخلايا الحارسة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: مجاهر، أوراق نباتات، طلاء أظافر شفاف، شرائح</span></div>","<p>الثغر، الخلايا الحارسة، الجدار الخلوي غير المتساوي السمك، البلاستيدات الخضراء، النتح، تبادل الغازات، المفاضلة (التوازن).</p>","<p>يسأل المعلم: «الورقة تحتاج ‎CO₂‎ للبناء الضوئي، لكن كل فتحة تُدخل ‎CO₂‎ تُخرج ماءً؛ كيف تحل النبتة هذه المعضلة في صيف عمان؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح المعضلة ويستقبل الحلول</td><td>يقترحون التحكم في فتح الفتحات وإغلاقها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يشرح تركيب الخلايا الحارسة (جدار داخلي سميك، بلاستيدات) والمفاضلة بين ‎CO₂‎ والماء</td><td>يرسمون ثغرًا مفتوحًا ومغلقًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–33</span><br><small>18 دقيقة</small></td><td>يوجه «استقصاء الخلايا الحارسة والثغور» بطبعة طلاء الأظافر</td><td>يحضرون الطبعة ويفحصونها ويعدون الثغور في مجال الرؤية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">33–40</span><br><small>7 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة الخلايا الحارسة؟</td><td>التحكم في فتح الثغر وإغلاقه.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون الجدار الداخلي للخلية الحارسة أسمك؟</td><td>لأن عدم تساوي السمك يجعل الخلية تنحني عند امتلائها بالماء فيُفتح الثغر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تُغلق الثغور غالبًا في الظلام؟</td><td>لأن البناء الضوئي يتوقف فلا حاجة لدخول ‎CO₂‎، فيقل فقد الماء.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سمِّ الخليتين المحيطتين بالثغر.</td><td>الخليتان الحارستان.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما المقصود بالمفاضلة في عمل الثغور؟</td><td>الموازنة بين الحاجة إلى إدخال ‎CO₂‎ للبناء الضوئي وتجنب فقد الماء بالنتح.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا قد تُغلق الثغور في منتصف نهار شديد الحرارة رغم توفر الضوء؟</td><td>لأن فقد الماء الشديد يهدد النبات بالذبول، فتُقدَّم حماية الماء على البناء الضوئي مؤقتًا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 146–148 ورسم الثغر المفتوح والمغلق</p><p><b>إرشاد لولي الأمر:</b> يمكن تنفيذ تجربة طبعة طلاء الأظافر على ورقة نبات منزلي بإشراف ولي الأمر</p>"]},{"axis":"آلية فتح الثغور وإغلاقها","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","الاتزان الداخلي في النباتات"],["الحصة","2 من 3"],["محور الحصة","آلية فتح الثغور وإغلاقها"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 148–150 + كتاب التجارب ص 90"],["دليل المعلم","ص 181–184"],["كتاب التجارب العملية والأنشطة","نشاط 4-3: فتح الثغور في النباتات ص 90"]],"t":["1. يصف آلية فتح الثغر: ضخ البروتونات، ودخول أيونات البوتاسيوم، وانخفاض الجهد المائي، ودخول الماء، وانتفاخ الخلايا\n2. يصف آلية إغلاق الثغر عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎\nمخرج تعليمي آخر: يحل نشاط 4-3 «فتح الثغور في النباتات»","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني\n- الدفتر القالب","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: كتاب التجارب العملية والأنشطة","مضخات البروتون، أيونات البوتاسيوم، الجهد المائي، الأسموزية، الانتفاخ، حمض الأبسيسيك ‎(ABA)‎، إغلاق الثغور.","يعرض المعلم بالونين طويلين ملصقًا عليهما شريط لاصق من جهة واحدة، وينفخهما ليظهر انحناؤهما وتكوّن فتحة بينهما، ويسأل: «ما الذي يقابل الهواء في الخلية الحارسة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض نموذج البالونين\nالطالب: يربطون الهواء بالماء والشريط بالجدار السميك\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات الفتح بالأسهم ثم الإغلاق ودور ‎ABA‎\nالطالب: يرسمون مخططًا انسيابيًا للخطوات في «الدفتر القالب»\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوجه حل نشاط 4-3 (كتاب التجارب ص 90)\nالطالب: يحلون في أزواج ويفسرون البيانات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الأيونات التي تدخل الخلايا الحارسة عند فتح الثغر؟\n   الإجابة النموذجية: أيونات البوتاسيوم ‎(K⁺)‎.\n2) (المستوى المتوقع) السؤال: ما أثر دخول ‎K⁺‎ على الجهد المائي للخلية الحارسة؟\n   الإجابة النموذجية: ينخفض الجهد المائي فيدخل الماء بالأسموزية.\n3) (المستوى المتقدم) السؤال: ما دور ‎ABA‎ عند الجفاف؟\n   الإجابة النموذجية: يحفز خروج أيونات البوتاسيوم من الخلايا الحارسة فيخرج الماء وتفقد انتفاخها ويُغلق الثغر.","1) (مستوى الدعم) السؤال: ما الخطوة الأولى في فتح الثغر؟\n   الإجابة النموذجية: ضخ البروتونات ‎(H⁺)‎ خارج الخلية الحارسة بالنقل النشط باستخدام ‎ATP‎.\n2) (المستوى المتوقع) السؤال: رتب: انتفاخ الخلايا، دخول الماء، ضخ البروتونات، دخول ‎K⁺‎، انخفاض الجهد المائي.\n   الإجابة النموذجية: ضخ البروتونات ← دخول ‎K⁺ ←‎ انخفاض الجهد المائي ← دخول الماء ← انتفاخ الخلايا وفتح الثغر.\n3) (المستوى المتقدم) السؤال: نبات طافر لا ينتج ‎ABA‎. توقع ما يحدث له في الجفاف.\n   الإجابة النموذجية: تبقى ثغوره مفتوحة فيفقد الماء بسرعة ويذبل.","إرشاد للطالب: إكمال نشاط 4-3 ص 90 ومراجعة ص 148–150\nإرشاد لولي الأمر: سؤال الابن عن نموذج البالونين وما يمثله كل جزء منه"],"h":["<ol class=\"ol\"><li>يصف آلية فتح الثغر: ضخ البروتونات، ودخول أيونات البوتاسيوم، وانخفاض الجهد المائي، ودخول الماء، وانتفاخ الخلايا</li><li>يصف آلية إغلاق الثغر عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 4-3 «فتح الثغور في النباتات»</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف آلية فتح الثغر: ضخ البروتونات، ودخول أيونات البوتاسيوم، وانخفاض الجهد المائي، ودخول الماء، وانتفاخ الخلايا</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف آلية إغلاق الثغر عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 4-3 «فتح الثغور في النباتات»</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الدفتر القالب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>مضخات البروتون، أيونات البوتاسيوم، الجهد المائي، الأسموزية، الانتفاخ، حمض الأبسيسيك ‎(ABA)‎، إغلاق الثغور.</p>","<p>يعرض المعلم بالونين طويلين ملصقًا عليهما شريط لاصق من جهة واحدة، وينفخهما ليظهر انحناؤهما وتكوّن فتحة بينهما، ويسأل: «ما الذي يقابل الهواء في الخلية الحارسة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض نموذج البالونين</td><td>يربطون الهواء بالماء والشريط بالجدار السميك</td></tr><tr><td class=\"tm\"> الرابعة وأسئلة نهاية الوحدة","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","الاتزان الداخلي في النباتات"],["الحصة","3 من 3"],["محور الحصة","مراجعة الوحدة الرابعة وأسئلة نهاية الوحدة"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 151–163"],["دليل المعلم","ص 181–184"],["كتاب التجارب العملية والأنشطة","نشاط 4-3: فتح الثغور في النباتات ص 90"]],"t":["1. يربط بين آليات الاتزان الداخلي في الحيوان والنبات في منظم مقارنة\n2. يحل أسئلة نهاية الوحدة الرابعة في الكلية والهرمونات والثغور\nمخرج تعليمي آخر: يقيّم تعلمه بقائمة التقويم الذاتي ويحدد خطة مراجعة","المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎","ملخص الوحدة، الإخراج، التنظيم الأسموزي، تنظيم الجلوكوز، التأشير الخلوي، الثغور، قائمة التقويم الذاتي.","يطرح المعلم سؤال «الدخيل»: «‎ADH‎، الإنسولين، الجلوكاجون، الأكسين — أيها الدخيل في الاتزان الداخلي للثدييات؟ ولماذا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح سؤال الدخيل ويناقش الإجابات\nالطالب: يحددون الأكسين لأنه هرمون نباتي\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يوجه بناء جدول مقارنة: العامل، المستقبل، المنسق، المستجيب (للماء، والجلوكوز، والثغور)\nالطالب: يكملون الجدول في مجموعات\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوزع أسئلة نهاية الوحدة (ص 153–163) على المجموعات\nالطالب: يحلون ويعرضون الحلول\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما العامل الذي يكشفه كل من: المستقبلات الأسموزية، وخلايا بيتا؟\n   الإجابة النموذجية: المستقبلات الأسموزية: الجهد المائي للدم؛ خلايا بيتا: تركيز الجلوكوز في الدم.\n2) (المستوى المتوقع) السؤال: ما المشترك بين تأثير ‎ADH‎ والإنسولين في الخلايا الهدف؟\n   الإجابة النموذجية: كلاهما يرتبط بمستقبلات على غشاء الخلية ويؤدي إلى إدخال بروتينات نقل (أكوابورينات أو ‎GLUT4‎) في الغشاء.\n3) (المستوى المتقدم) السؤال: لماذا تُعد الثغور مثالًا على الاتزان الداخلي في النبات؟\n   الإجابة النموذجية: لأنها تستجيب لتغيرات البيئة لتحافظ على توازن الماء وتبادل الغازات داخل النبات.","1) (مستوى الدعم) السؤال: اذكر هرمونين يعملان بالتغذية الراجعة السلبية في الثدييات.\n   الإجابة النموذجية: ‎ADH‎ والإنسولين (أو الجلوكاجون).\n2) (المستوى المتوقع) السؤال: لماذا تحتاج الخلايا الهدف إلى مستقبلات على سطحها لهرمونات ‎ADH‎ والإنسولين والجلوكاجون؟\n   الإجابة النموذجية: لأنها هرمونات ببتيدية كبيرة ومحبة للماء لا تعبر الغشاء، فتؤثر عبر الارتباط بمستقبلات سطحية.\n3) (المستوى المتقدم) السؤال: قيّم أداءك في الوحدة: اذكر موضوعًا أتقنته وآخر تحتاج إلى مراجعته وخطوة عملية لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة واضحة مثل حل أسئلة إضافية أو إعادة رسم مخطط.","إرشاد للطالب: مراجعة ملخص الوحدة ص 151–152 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الوحدة الرابعة"],"h":["<ol class=\"ol\"><li>يربط بين آليات الاتزان الداخلي في الحيوان والنبات في منظم مقارنة</li><li>يحل أسئلة نهاية الوحدة الرابعة في الكلية والهرمونات والثغور</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه بقائمة التقويم الذاتي ويحدد خطة مراجعة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يربط بين آليات الاتزان الداخلي في الحيوان والنبات في منظم مقارنة</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نهاية الوحدة الرابعة في الكلية والهرمونات والثغور</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه بقائمة التقويم الذاتي ويحدد خطة مراجعة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edp
