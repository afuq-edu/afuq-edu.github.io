tep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما فائدة المحاصيل المقاومة لمبيدات الأعشاب للمزارع؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يمكنه رش المبيد لقتل الأعشاب المنافسة دون أن يتأثر المحصول فتزيد الإنتاجية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اذكر خطرًا محتملًا لزراعة محاصيل ‎Bt‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: قد تنشأ حشرات مقاومة للسم، أو قد يتأثر بعض الحشرات غير المستهدفة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تتنافس الأعشاب الضارة مع المحاصيل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها تشاركها في الأرض والضوء والماء والمواد الغذائية في التربة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اشرح مزايا زراعة أصناف ‎Bt‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقتل الآفات الحشرية التي تتغذى عليها فتقل الخسائر ويقل رش المبيدات الحشرية وتكلفته.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح خطوتين للحد من مخاطر المحاصيل المعدلة جينيًا.<br><span style=\"opacity:.85\">• الإجابة النموذجية: زراعة مناطق عازلة من محاصيل غير معدلة لتأخير ظهور المقاومة، ووضع تشريعات ورقابة على زراعتها وتداولها.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 107–109 وحل السؤالين 13 و14<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن تنظيم سلطنة عمان لتداول المبيدات وأهمية الزراعة الآمنة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=16<\/p>"]}, {"axis": "الحيوانات المعدلة جينيًا ومراجعة الوحدة الثالثة", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: التقنية الجينية"], ["الدرس", "التقنية الجينية والزراعة"], ["الحصة", "2 من 2"], ["محور الحصة", "الحيوانات المعدلة جينيًا ومراجعة الوحدة الثالثة"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 109–121"], ["دليل المعلم", "ص 145–147"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء (15 دقيقة)\n2. يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها (15 دقيقة)\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي (10 دقائق)", "1. فهم: يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء\n2. تطبيق: يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها\n3. تقييم (مخرج آخر): يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎", "الحيوانات المعدلة جينيًا، السلمون الأطلسي المعدل، هرمون النمو، ملخص الوحدة، أسئلة نهاية الوحدة.", "يعرض المعلم صورتين لسمكتي سلمون بالعمر نفسه وأحجام مختلفة ويسأل: «ما الذي جعل إحداهما تنمو أسرع؟»", "1. يعرض المعلم الصورتين ويستقبل التفسيرات، والطلبة يقترحون جينًا لهرمون النمو (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يشرح المعلم السلمون المعدل جينيًا وسبب ندرة الحيوانات المعدلة لإنتاج الغذاء مقارنة بالنباتات، والطلبة يدونون الفائدة والمخاوف (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوزع المعلم أسئلة نهاية الوحدة (ص 113–121) على المجموعات، والطلبة يحلون ويعرضون الحلول (18 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – مناظرة المحصول المعدل: تتناظر مجموعتان حول استخدام المحاصيل المعدلة جينيًا لتحمل الجفاف والملوحة في عمان، مستندتين إلى أهمية الأمن الغذائي في رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: المناظرة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الصفة التي حُسنت في السلمون الأطلسي المعدل جينيًا؟\n• الإجابة النموذجية: سرعة النمو.\n\n2. مستوى التطبيق: لماذا تُعد الحيوانات المعدلة لإنتاج الغذاء أقل انتشارًا من النباتات؟\n• الإجابة النموذجية: بسبب صعوبة التقنية وتكلفتها والمخاوف الأخلاقية والبيئية كهروبها واختلاطها بالمجموعات البرية.\n\n3. مستوى الاستدلال: اربط بين ‎PCR‎ والهندسة الجينية.\n• الإجابة النموذجية: يُستخدم ‎PCR‎ لتضخيم الجين المطلوب قبل إدخاله في الناقل أو للتأكد من وجوده في الكائن المعدل.", "1. مستوى المعرفة: اذكر خطرًا بيئيًا لهروب سمك سلمون معدل إلى البيئة.\n• الإجابة النموذجية: قد ينافس الأسماك البرية على الغذاء أو يتزاوج معها فينقل الجين إلى المجموعات البرية.\n\n2. مستوى التطبيق: رتب أدوات إنتاج بكتيريا تنتج إنسولينًا: ترانسكريبتيز العكسي، البلازميد، إنزيم القطع، ‎DNA‎ ليجيز.\n• الإجابة النموذجية: ترانسكريبتيز العكسي ‎(cDNA) ←‎ إنزيم القطع (قطع البلازميد ونهايات الجين) ← ‎DNA‎ ليجيز (الربط) ← البلازميد يُدخل في البكتيريا.\n\n3. مستوى الاستدلال: قيّم: «التقنية الجينية مفيدة في الطب لكنها لا مكان لها في الزراعة».\n• الإجابة النموذجية: رأي غير متوازن؛ فالزراعة تستفيد بزيادة الإنتاج وتقليل المبيدات، مع ضرورة إدارة المخاطر بالتشريعات والرقابة.", "إرشاد للطالب: مراجعة ملخص الوحدة ص 112 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي وتحديد موضوع يحتاج إلى مراجعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=16"], "h": ["<ol class=\"ol\"><li>يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء (15 دقيقة)<\/li><li>يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها<\/p><p class=\"pst .<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الصفة التي حُسنت في السلمون الأطلسي المعدل جينيًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: سرعة النمو.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تُعد الحيوانات المعدلة لإنتاج الغذاء أقل انتشارًا من النباتات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بسبب صعوبة التقنية وتكلفتها والمخاوف الأخلاقية والبيئية كهروبها واختلاطها بالمجموعات البرية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اربط بين ‎PCR‎ والهندسة الجينية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يُستخدم ‎PCR‎ لتضخيم الجين المطلوب قبل إدخاله في الناقل أو للتأكد من وجوده في الكائن المعدل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر خطرًا بيئيًا لهروب سمك سلمون معدل إلى البيئة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: قد ينافس الأسماك البرية على الغذاء أو يتزاوج معها فينقل الجين إلى المجموعات البرية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> رتب أدوات إنتاج بكتيريا تنتج إنسولينًا: ترانسكريبتيز العكسي، البلازميد، إنزيم القطع، ‎DNA‎ ليجيز.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ترانسكريبتيز العكسي ‎(cDNA) ←‎ إنزيم القطع (قطع البلازميد ونهايات الجين) ← ‎DNA‎ ليجيز (الربط) ← البلازميد يُدخل في البكتيريا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم: «التقنية الجينية مفيدة في الطب لكنها لا مكان لها في الزراعة».<br><span style=\"opacity:.85\">• الإجابة النموذجية: رأي غير متوازن؛ فالزراعة تستفيد بزيادة الإنتاج وتقليل المبيدات، مع ضرورة إدارة المخاطر بالتشريعات والرقابة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ملخص الوحدة ص 112 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على نتائج تقويمه الذاتي وتحديد موضوع يحتاج إلى مراجعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=16<\/p>"]}]}, {"title": "الاتزان الداخلي", "sb": "ص 122–124", "unit": "الوحدة 4: الاتزان الداخلي", "periods": [{"axis": "مبادئ الاتزان الداخلي والتغذية الراجعة السلبية واليوريا", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: الاتزان الداخلي"], ["الدرس", "الاتزان الداخلي"], ["الحصة", "1 من 1"], ["محور الحصة", "مبادئ الاتزان الداخلي والتغذية الراجعة السلبية واليوريا"], ["الأسبوع والتاريخ", "الأسبوع الحادي عشر (15–19/11/2026)"], ["كتاب الطالب", "ص 122–124"], ["دليل المعلم", "ص 163–166"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يعرّف الاتزان الداخلي ويذكر أهميته في الثدييات (10 دقائق)\n2. يذكر مبادئ الاتزان الداخلي: المنبهات، والمستقبلات، وأجهزة التنسيق، والمستجيبات، والتغذية الراجعة السلبية (10 دقائق)\nمخرج تعليمي آخر: يذكر أن اليوريا تُنتج في الكبد بنزع مجموعة الأمين من الأحماض الأمينية الزائدة (20 دقيقة)", "1. تذكر: يعرّف الاتزان الداخلي ويذكر أهميته في الثدييات\n2. فهم: يذكر مبادئ الاتزان الداخلي: المنبهات، والمستقبلات، وأجهزة التنسيق، والمستجيبات، والتغذية الراجعة السلبية\n3. تذكر (مخرج آخر): يذكر أن اليوريا تُنتج في الكبد بنزع مجموعة الأمين من الأحماض الأمينية الزائدة", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التوصل إلى تعريف", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "الاتزان الداخلي، البيئة الداخلية، المنبه، المستقبل، المستجيب، التغذية الراجعة السلبية، المنظمات الحرارية، نزع مجموعة الأمين، اليوريا.", "يعرض المعلم صورة الدب الأسود في سباته العميق (العلوم ضمن سياقها) ويسأل: «كيف تبقى درجة حرارة جسمه وبيئته الداخلية مناسبة شهورًا دون طعام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1. يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون آليات للحفاظ على البيئة الداخلية (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يقود المعلم نشاط «التوصل إلى تعريف» للاتزان الداخلي ثم يشرح مكونات نظام التحكم بالشكل 4-1، والطلبة يصيغون تعريفًا جماعيًا ويرسمون حلقة التغذية الراجعة السلبية (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم نشاط «المنظمات الحرارية» ثم يشرح إنتاج اليوريا في الكبد، والطلبة يطبقون الحلقة على تنظيم الحرارة ويكتبون معادلة لفظية لنزع مجموعة الأمين (11 دقيقة)\nالاستراتيجيات: التوصل إلى تعريف.\n\n4. يوجه المعلم حل السؤالين 1 و2 (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ربان السفينة: يشبه كل زوج التغذية الراجعة السلبية بربان سفينة عمانية يصحح اتجاهها كلما انحرفت، ثم يحدد المنبه والمستقبل والمؤثر في التشبيه (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف الاتزان الداخلي.\n• الإجابة النموذجية: الحفاظ على بيئة داخلية ثابتة نسبيًا في الجسم رغم التغيرات في البيئة الخارجية والداخلية.\n\n2. مستوى التطبيق: ما دور المستجيب في نظام التحكم؟\n• الإجابة النموذجية: تنفيذ الاستجابة التي تعيد العامل المتغير إلى قيمته الطبيعية.\n\n3. مستوى الاستدلال: لماذا تُسمى التغذية الراجعة «سلبية»؟\n• الإجابة النموذجية: لأن الاستجابة تعاكس اتجاه التغير فتعيد العامل إلى نقطة الضبط.", "1. مستوى المعرفة: أين تُنتج اليوريا؟\n• الإجابة النموذجية: في الكبد.\n\n2. مستوى التطبيق: رتب مكونات نظام التحكم: مستجيب، منبه، مستقبل، جهاز تنسيق، استجابة.\n• الإجابة النموذجية: منبه ← مستقبل ← جهاز تنسيق ← مستجيب ← استجابة.\n\n3. مستوى الاستدلال: لماذا لا يستطيع الجسم تخزين الأحماض الأمينية الزائدة كما هي؟ وماذا يحدث لها؟\n• الإجابة النموذجية: لا توجد مخازن لها، فتُنزع مجموعة الأمين منها في الكبد وتتحول إلى أمونيا ثم إلى يوريا تُطرح، ويُستخدم الجزء المتبقي في التنفس أو يُخزن.", "إرشاد للطالب: مراجعة ص 122–124 وحل السؤالين 1 و2\nإرشاد لولي الأمر: الحديث مع الابن ع  والطلبة يحددون الكبيبات والأنيبيبات ويقارنون القشرة باللب (9 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يناقش المعلم الملاحظات ويدير التقويم الختامي، والطلبة يقارنون رسومهم التنبؤية بالنتائج ويجيبون (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – الكلية ومحطة التحلية: تقارن المجموعات بين أجزاء النفرون ومراحل عمل محطات تحلية مياه البحر في عمان من ترشيح وإعادة امتصاص، وتعرض أوجه الشبه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما الفرق في المظهر بين القشرة واللب؟\n• الإجابة النموذجية: القشرة حبيبية المظهر لاحتوائها الكبيبات، واللب مخطط لاحتوائه التواءات هنلي والقنوات الجامعة.\n\n2. مستوى التطبيق: لماذا نرتدي القفازات أثناء التشريح؟\n• الإجابة النموذجية: للوقاية من الميكروبات والحفاظ على النظافة.\n\n3. مستوى الاستدلال: ما التراكيب التي تظهر كبقع دائرية في الشريحة المجهرية للقشرة؟\n• الإجابة النموذجية: الكبيبات داخل كبسولات بومان.", "1. مستوى المعرفة: سمِّ ثلاث مناطق تظهر في المقطع الطولي للكلية.\n• الإجابة النموذجية: القشرة، واللب (الأهرامات)، والحوض.\n\n2. مستوى التطبيق: لماذا يبدو اللب مخططًا؟\n• الإجابة النموذجية: لاصطفاف التواءات هنلي والقنوات الجامعة بشكل متوازٍ.\n\n3. مستوى الاستدلال: اقترح تحسينًا للاستقصاء يجعل تحديد الأجزاء أدق.\n• الإجابة النموذجية: استخدام عدسة مكبرة أو مجهر تشريحي، وحقن صبغة في الشريان الكلوي لإظهار الأوعية، ومقارنة المقطع بصورة مرجعية.", "إرشاد للطالب: كتابة تقرير الاستقصاء 4-1 مع الرسوم\nإرشاد لولي الأمر: التأكد من إكمال الابن رسم المقطع الطولي مع التسميات\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=18"], "h": ["<ol class=\"ol\"><li>يفحص كلية حيوان (أو نموذجًا/صورًا) ويحدد القشرة واللب والحوض والأوعية (10 دقائق)<\/li><li>يفحص شرائح أو صورًا مجهرية لنسيج الكلية ويحدد الكبيبات والأنيبيبات (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يلتزم باحتياطات السلامة والنظافة عند التشريح (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashe list\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال وتشبيه الجرس، والطلبة يقترحون وجود مستقبل على سطح الخلية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم خطوات التأشير بالشكل 4-20 (ارتباط الهرمون، بروتين ‎G‎، أدينيليل سيكليز، ‎cAMP‎، سلسلة إنزيمات الكاينيز، الفوسفوريليز)، والطلبة يرتبون بطاقات الخطوات ويرسمون سهم التضخيم (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ المعلم نشاط «فهم الآليات» بلعب أدوار التضخيم (كل طالب ينشط اثنين)، والطلبة يمثلون السلسلة ويحسبون عدد الجزيئات المنشطة في كل مستوى (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: فهم الآليات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الرسول الثاني في تأشير الجلوكاجون؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎cAMP‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الإنزيم الذي يحول ‎ATP‎ إلى ‎cAMP‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أدينيليل سيكليز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما معنى تضخيم ر الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز (10 دقائق)\n2. يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم (10 دقائق)\nمخرج تعليمي آخر: يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري (20 دقيقة)", "1. فهم: يشرح مبادئ عمل شرائط اختبار الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز\n2. فهم: يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم\n3. تقييم (مخرج آخر): يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات\n- العرض التوضيحي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: شرائط اختبار الجلوكوز، محاليل جلوكوز بتراكيز مختلفة، جهاز قياس سكر الدم (للعرض)", "شرائط الاختبار، الجلوكوز أكسيديز، البيروكسيديز، تغير اللون، المستشعر الحيوي، القطب الكهربائي، الإشارة الكهربائية.", "يقدم المعلم «عرضًا توضيحيًا موجزًا: لماذا التثبيت؟» بغمس شريط اختبار في محلول جلوكوز ويسأل: «كيف عرف الشريط الجلوكوز من بين كل مكونات البول؟»", "1. يجري المعلم العرض ويطرح السؤال، والطلبة يقترحون وجود إنزيم نوعي (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم تفاعلي الجلوكوز أكسيديز (جلوكوز ← حمض الجلوكونيك ‎+ H₂O₂‎) والبيروكسيديز (تغير لون الصبغة) ومبدأ المستشعر الحيوي، والطلبة يكتبون المعادلات اللفظية ويرسمون مبدأ المستشعر (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يوزع المعلم محاليل مجهولة التركيز لاختبارها بالشرائط ومقارنتها بالمخطط اللوني، والطلبة يقدرون التراكيز ويحلون الأسئلة 14 و16 (15 دقيقة)\nالاستراتيجيات: العرض التوضيحي.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: ما الإنزيم الذي يتفاعل مع الجلوكوز في شريط الاختبار؟\n• الإجابة النموذجية: الجلوكوز أكسيديز.\n\n2. مستوى التطبيق: لماذا لا يتفاعل الشريط مع سكريات أخرى؟\n• الإجابة النموذجية: لأن الجلوكوز أكسيديز نوعي للجلوكوز وفق شكل موقعه النشط.\n\n3. مستوى الاستدلال: اذكر ميزة لاستخدام الشرائط بدل محلول بندكت.\n• الإجابة النموذجية: أسرع ولا تحتاج تسخينًا ونوعية للجلوكوز وتعطي تقديرًا لتركيزه.", "1. مستوى المعرفة: ما الناتج الذي يكشفه إنزيم البيروكسيديز؟\n• الإجابة النموذجية: فوق أكسيد الهيدروجين ‎(H₂O₂)‎، فيتفاعل مع صبغة ويتغير لونها.\n\n2. مستوى التطبيق: ما مبدأ عمل المستشعر الحيوي للجلوكوز؟\n• الإجابة النموذجية: يتفاعل الجلوكوز مع إنزيم مثبت على قطب فتنتج إشارة كهربائية تتناسب مع تركيزه تُعرض رقميًا.\n\n3. مستوى الاستدلال: لماذا يفضل قياس الجلوكوز في الدم بالمستشعر على قياسه في البول بالشرائط؟\n• الإجابة النموذجية: لأنه يعطي التركيز الحالي الدقيق في الدم مباشرة، بينما البول يعكس تركيزًا سابقًا ولا يظهر الجلوكوز فيه إلا عند تجاوز حد إعادة الامتصاص.", "إرشاد للطالب: مراجعة ص 144–145 وحل الأسئلة 14–16\nإرشاد لولي الأمر: يمكن عرض جهاز قياس السكر المنزلي على الابن (إن وُجد) وشرح طريقة عمله\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=20"], "h": ["<ol class=\"ol\"><li>يشرح مبادئ عمل شرائط اختبار الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز (10 دقائق)<\/li><li>يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح مبادئ عمل شرائط اختبار الجلوكوز في البول باستخدام إنزيمي الجلوكوز أكسيديز والبيروكسيديز<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح مبدأ عمل المستشعر الحيوي الإلكتروني لقياس الجلوكوز في الدم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقارن بين شرائط البول والمستشعر الحيوي من حيث الدقة والفائدة لمرضى السكري<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">العرض التوضيحي<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: شرائط اختبار الجلوكوز، محاليل جلوكوز بتراكيز مختلفة، جهاز قياس سكر الدم (للعرض)<\/span><\/div>", "<p>شرائط الاختبار، الجلوكوز أكسيديز، البيروكسيديز، تغير اللون، المستشعر الحيوي، القطب الكهربائي، الإشارة الكهربائية.<\/p>", "<p>يقدم المعلم «عرضًا توضيحيًا موجزًا: لماذا التثبيت؟» بغمس شريط اختبار في محلول جلوكوز ويسأل: «كيف عرف الشريط الجلوكوز من بين كل مكونات البول؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يجري المعلم العرض ويطرح السؤال، والطلبة يقترحون وجود إنزيم نوعي (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تفاعلي الجلوكوز أكسيديز (جلوكوز ← حمض الجلوكونيك ‎+ H₂O₂‎) والبيروكسيديز (تغير لون الصبغة) ومبدأ المستشعر الحيوي، والطلبة يكتبون المعادلات اللفظية ويرسمون مبدأ المستشعر (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم محاليل مجهولة التركيز لاختبارها بالشرائط ومقارنتها بالمخطط اللوني، والطلبة يقدرون التراكيز ويحلون الأسئلة 14 و16 (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: العرض التوضيحي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الإنزيم الذي يتفاعل مع الجلوكوز في شريط الاختبار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجلوكوز أكسيديز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يتفاعل الشريط مع سكريات أخرى؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجلوكوز أكسيديز نوعي للجلوكوز وفق شكل موقعه النشط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اذكر ميزة لاستخدام الشرائط بدل محلول بندكت.<br><span style=\"opacity:.85\">• الإجابة النموذجية: أسرع ولا تحتاج تسخينًا ونوعية للجلوكوز وتعطي تقديرًا لتركيزه.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الناتج الذي يكشفه إنزيم البيروكسيديز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فوق أكسيد الهيدروجين ‎(H₂O₂)‎، فيتفاعل مع صبغة ويتغير لونها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما مبدأ عمل المستشعر الحيوي للجلوكوز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتفاعل الجلوكوز مع إنزيم مثبت على قطب فتنتج إشارة كهربائية تتناسب مع تركيزه تُعرض رقميًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يفضل قياس الجلوكوز في الدم بالمستشعر على قياسه في البول بالشرائط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يعطي التركيز الحالي الدقيق في الدم مباشرة، بينما البول يعكس تركيزًا سابقًا ولا يظهر الجلوكوز فيه إلا عند تجاوز حد إعادة الامتصاص.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 144–145 وحل الأسئلة 14–16<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن عرض جهاز قياس السكر المنزلي على الابن (إن وُجد) وشرح طريقة عمله<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=20<\/p>"]}, {"axis": "نشاط 4-1: عقار ميتفورمين ومرض السكري", "n": 4, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: الاتزان الداخلي"], ["الدرس", "التحكم في تركيز جلوكوز الدم"], ["الحصة", "4 من 4"], ["محور الحصة", "نشاط 4-1: عقار ميتفورمين ومرض السكري"], ["الأسبوع والتاريخ", "الأسبوع الثاني عشر (22–26/11/2026)"], ["كتاب الطالب", "ص 139–145 + كتاب التجارب ص 80"], ["دليل المعلم", "ص 176–180"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-1: آلية عمل عقار ميتفورمين ص 80؛ الاستقصاء العملي 4-2: تحليل البول (إثرائي) ص 105"]], "t": ["1. يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم (20 دقيقة)\n2. يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24) (5 دقائق)\nمخرج تعليمي آخر: يفسر سبب عدم إمكانية تناول الإنسولين بالفم (15 دقيقة)", "1. تحليل: يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم\n2. تحليل: يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24)\n3. تطبيق (مخرج آخر): يفسر سبب عدم إمكانية تناول الإنسولين بالفم", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: كتاب التجارب العملية والأنشطة", "داء السكري، مقاومة الإنسولين، عقار ميتفورمين، استحداث الجلوكوز، التمثيل البياني، الحقن.", "يعرض المعلم الشكل 4-24 (منحنيات شخص سليم ومصاب) ويسأل: «ما أول فرق تلاحظه بين المنحنيين؟»", "1. يعرض المعلم الشكل ويستقبل الملاحظات، والطلبة يصفون الفروق في القمة وزمن العودة (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يوجه المعلم حل نشاط 4-1 «آلية عمل عقار ميتفورمين» (كتاب التجارب ص 80)، والطلبة يحللون البيانات في مجموعات ويستنتجون أثر العقار في الكبد (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل السؤال 15 (أ، ب)، والطلبة يصفون التغيرات ويفسرون عدم تناول الإنسولين بالفم (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – تمرة مع القهوة: يتتبع المتحدثون المرقمون تغير جلوكوز الدم بعد تناول التمر مع القهوة العمانية، ودور الإنسولين والجلوكاجون، مع نصيحة بالاعتدال (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم:\n1. مستوى المعرفة: ماذا يحدث لتركيز الجلوكوز بعد تناوله لدى المصاب بالسكري مقارنة بالسليم؟\n• الإجابة النموذجية: يرتفع أكثر ويبقى مرتفعًا مدة أطول.\n\n2. مستوى التطبيق: لماذا لا يؤخذ الإنسولين بالفم؟\n• الإجابة النموذجية: لأنه بروتين تهضمه إنزيمات البروتييز في القناة الهضمية قبل امتصاصه.\n\n3. مستوى الاستدلال: كيف يخفض ميتفورمين الجلوكوز في الدم وفق النشاط؟\n• الإجابة النموذجية: بتقليل استحداث الجلوكوز في الكبد وزيادة حساسية الخلايا للإنسولين.", "1. مستوى المعرفة: اقترح طريقة لمراقبة فاعلية الإنسولين لدى المصاب بالسكري.\n• الإجابة النموذجية: قياس الجلوكوز في الدم بالمستشعر الحيوي قبل الوجبات وبعدها بانتظام.\n\n2. مستوى التطبيق: صف منحنى الإنسولين لدى الشخص السليم بعد تناول الجلوكوز.\n• الإجابة النموذجية: يرتفع سريعًا بعد ارتفاع الجلوكوز ثم ينخفض مع عودة الجلوكوز إلى الطبيعي.\n\n3. مستوى الاستدلال: لماذا قد يرتفع الإنسولين لدى بعض مرضى السكري دون أن ينخفض الجلوكوز كثيرًا؟\n• الإجابة النموذجية: بسبب مقاومة الخلايا للإنسولين (ضعف استجابة مستقبلاتها)، فلا تمتص الجلوكوز بكفاءة رغم وجوده.", "إرشاد للطالب: إكمال نشاط 4-1 ص 80 وحل السؤال 15\nإرشاد لولي الأمر: الحديث مع الابن عن الوقاية من السكري بالنشاط البدني والغذاء المتوازن\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=20"], "h": ["<ol class=\"ol\"><li>يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم (20 دقيقة)<\/li><li>يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24) (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب عدم إمكانية تناول الإنسولين بالفم (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يحلل بيانات نشاط 4-1 عن آلية عمل عقار ميتفورمين في ضبط تركيز الجلوكوز في الدم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر الاختلاف بين استجابة الشخص السليم والمصاب بالسكري لتناول الجلوكوز (الشكل 4-24)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يفسر سبب عدم إمكانية تناول الإنسولين بالفم<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>داء السكري، مقاومة الإنسولين، عقار ميتفورمين، استحداث الجلوكوز، التمثيل البياني، الحقن.<\/p>", "<p>يعرض المعلم الشكل 4-24 (منحنيات شخص سليم ومصاب) ويسأل: «ما أول فرق تلاحظه بين المنحنيين؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الشكل ويستقبل الملاحظات، والطلبة يصفون الفروق في القمة وزمن العودة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم حل نشاط 4-1 «آلية عمل عقار ميتفورمين» (كتاب التجارب ص 80)، والطلبة يحللون البيانات في مجموعات ويستنتجون أثر العقار في الكبد (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل السؤال 15 (أ، ب)، والطلبة يصفون التغيرات ويفسرون عدم تناول الإنسولين بالفم (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – تمرة مع القهوة: يتتبع المتحدثون المرقمون تغير جلوكوز الدم بعد تناول التمر مع القهوة العمانية، ودور الإنسولين والجلوكاجون، مع نصيحة بالاعتدال (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الرؤوس المرقمة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يحدث لتركيز الجلوكوز بعد تناوله لدى المصاب بالسكري مقارنة بالسليم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يرتفع أكثر ويبقى مرتفعًا مدة أطول.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يؤخذ الإنسولين بالفم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه بروتين تهضمه إنزيمات البروتييز في القناة الهضمية قبل امتصاصه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف يخفض ميتفورمين الجلوكوز في الدم وفق النشاط؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بتقليل استحداث الجلوكوز في الكبد وزيادة حساسية الخلايا للإنسولين.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اقترح طريقة لمراقبة فاعلية الإنسولين لدى المصاب بالسكري.<br><span style=\"opacity:.85\">• الإجابة النموذجية: قياس الجلوكوز في الدم بالمستشعر الحيوي قبل الوجبات وبعدها بانتظام.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صف منحنى الإنسولين لدى الشخص السليم بعد تناول الجلوكوز.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يرتفع سريعًا بعد ارتفاع الجلوكوز ثم ينخفض مع عودة الجلوكوز إلى الطبيعي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا قد يرتفع الإنسولين لدى بعض مرضى السكري دون أن ينخفض الجلوكوز كثيرًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بسبب مقاومة الخلايا للإنسولين (ضعف استجابة مستقبلاتها)، فلا تمتص الجلوكوز بكفاءة رغم وجوده.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-1 ص 80 وحل السؤال 15<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن الوقاية من السكري بالنشاط البدني والغذاء المتوازن<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=20<\/p>"]}]}, {"title": "الاتزان الداخلي في النباتات", "sb": "ص 146–163", "unit": "الوحدة 4: الاتزان الداخلي", "periods": [{"axis": "تركيب الخلايا الحارسة والثغور", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: الاتزان الداخلي"], ["الدرس", "الاتزان الداخلي في النباتات"], ["الحصة", "1 من 3"], ["محور الحصة", "تركيب الخلايا الحارسة والثغور"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 146–148"], ["دليل المعلم", "ص 181–184"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: فتح الثغور في النباتات ص 90"]], "t": ["1. يصف تركيب الخلايا الحارسة ووظيفتها (20 دقيقة)\n2. يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء (10 دقائق)\nمخرج تعليمي آخر: يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين (10 دقائق)", "1. فهم: يصف تركيب الخلايا الحارسة ووظيفتها\n2. فهم: يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء\n3. تطبيق (مخرج آخر): يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- استقصاء الخلايا الحارسة", "- الكتاب\n- صورة توضيحية\n- أخرى: مجاهر، أوراق نباتات، طلاء أظافر شفاف، شرائح", "الثغر، الخلايا الحارسة، الجدار الخلوي غير المتساوي السمك، البلاستيدات الخضراء، النتح، تبادل الغازات، المفاضلة (التوازن).", "يسأل المعلم: «الورقة تحتاج ‎CO₂‎ للبناء الضوئي، لكن كل فتحة تُدخل ‎CO₂‎ تُخرج ماءً؛ كيف تحل النبتة هذه المعضلة في صيف عمان؟»", "1. يطرح المعلم المعضلة ويستقبل الحلول، والطلبة يقترحون التحكم في فتح الفتحات وإغلاقها (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم تركيب الخلايا الحارسة (جدار داخلي سميك، بلاستيدات) والمفاضلة بين ‎CO₂‎ والماء، والطلبة يرسمون ثغرًا مفتوحًا ومغلقًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم «استقصاء الخلايا الحارسة والثغور» بطبعة طلاء الأظافر، والطلبة يحضرون الطبعة ويفحصونها ويعدون الثغور في مجال الرؤية (18 دقيقة)\nالاستراتيجيات: استقصاء الخلايا الحارسة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: ما وظيفة الخلايا الحارسة؟\n• الإجابة النموذجية: التحكم في فتح الثغر وإغلاقه.\n\n2. مستوى التطبيق: لماذا يكون الجدار الداخلي للخلية الحارسة أسمك؟\n• الإجابة النموذجية: لأن عدم تساوي السمك يجعل الخلية تنحني عند امتلائها بالماء فيُفتح الثغر.\n\n3. مستوى الاستدلال: لماذا تُغلق الثغور غالبًا في الظلام؟\n• الإجابة النموذجية: لأن البناء الضوئي يتوقف فلا حاجة لدخول ‎CO₂‎، فيقل فقد الماء.", "1. مستوى المعرفة: سمِّ الخليتين المحيطتين بالثغر.\n• الإجابة النموذجية: الخليتان الحارستان.\n\n2. مستوى التطبيق: ما المقصود بالمفاضلة في عمل الثغور؟\n• الإجابة النموذجية: الموازنة بين الحاجة إلى إدخال ‎CO₂‎ للبناء الضوئي وتجنب فقد الماء بالنتح.\n\n3. مستوى الاستدلال: لماذا قد تُغلق الثغور في منتصف نهار شديد الحرارة رغم توفر الضوء؟\n• الإجابة النموذجية: لأن فقد الماء الشديد يهدد النبات بالذبول، فتُقدَّم حماية الماء على البناء الضوئي مؤقتًا.", "إرشاد للطالب: مراجعة ص 146–148 ورسم الثغر المفتوح والمغلق\nإرشاد لولي الأمر: يمكن تنفيذ تجربة طبعة طلاء الأظافر على ورقة نبات منزلي بإشراف ولي الأمر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=21"], "h": ["<ol class=\"ol\"><li>يصف تركيب الخلايا الحارسة ووظيفتها (20 دقيقة)<\/li><li>يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تركيب الخلايا الحارسة ووظيفتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح أن الثغور تستجيب للتغيرات البيئية بالفتح والإغلاق لتوازن بين امتصاص ‎CO₂‎ وفقد الماء<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يفحص بشرة ورقة مجهريًا ويرسم ثغرًا وخليتيه الحارستين<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">استقصاء الخلايا الحارسة<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: مجاهر، أوراق نباتات، طلاء أظافر شفاف، شرائح<\/span><\/div>", "<p>الثغر، الخلايا الحارسة، الجدار الخلوي غير المتساوي السمك، البلاستيدات الخضراء، النتح، تبادل الغازات، المفاضلة (التوازن).<\/p>", "<p>يسأل المعلم: «الورقة تحتاج ‎CO₂‎ للبناء الضوئي، لكن كل فتحة تُدخل ‎CO₂‎ تُخرج ماءً؛ كيف تحل النبتة هذه المعضلة في صيف عمان؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم المعضلة ويستقبل الحلول، والطلبة يقترحون التحكم في فتح الفتحات وإغلاقها (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تركيب الخلايا الحارسة (جدار داخلي سميك، بلاستيدات) والمفاضلة بين ‎CO₂‎ والماء، والطلبة يرسمون ثغرًا مفتوحًا ومغلقًا (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم «استقصاء الخلايا الحارسة والثغور» بطبعة طلاء الأظافر، والطلبة يحضرون الطبعة ويفحصونها ويعدون الثغور في مجال الرؤية (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: استقصاء الخلايا الحارسة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة الخلايا الحارسة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التحكم في فتح الثغر وإغلاقه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون الجدار الداخلي للخلية الحارسة أسمك؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن عدم تساوي السمك يجعل الخلية تنحني عند امتلائها بالماء فيُفتح الثغر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تُغلق الثغور غالبًا في الظلام؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن البناء الضوئي يتوقف فلا حاجة لدخول ‎CO₂‎، فيقل فقد الماء.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سمِّ الخليتين المحيطتين بالثغر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الخليتان الحارستان.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما المقصود بالمفاضلة في عمل الثغور؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الموازنة بين الحاجة إلى إدخال ‎CO₂‎ للبناء الضوئي وتجنب فقد الماء بالنتح.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا قد تُغلق الثغور في منتصف نهار شديد الحرارة رغم توفر الضوء؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن فقد الماء الشديد يهدد النبات بالذبول، فتُقدَّم حماية الماء على البناء الضوئي مؤقتًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 146–148 ورسم الثغر المفتوح والمغلق<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن تنفيذ تجربة طبعة طلاء الأظافر على ورقة نبات منزلي بإشراف ولي الأمر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=21<\/p>"]}, {"axis": "آلية فتح الثغور وإغلاقها", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: الاتزان الداخلي"], ["الدرس", "الاتزان الداخلي في النباتات"], ["الحصة", "2 من 3"], ["محور الحصة", "آلية فتح الثغور وإغلاقها"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 148–150 + كتاب التجارب ص 90"], ["دليل المعلم", "ص 181–184"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: فتح الثغور في النباتات ص 90"]], "t": ["1. يصف آلية فتح الثغر: ضخ البروتونات، ودخول أيونات البوتاسيوم، وانخفاض الجهد المائي، ودخول الماء، وانتفاخ الخلايا (10 دقائق)\n2. يصف آلية إغلاق الثغر عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎ (15 دقيقة)\nمخرج تعليمي آخر: يحل نشاط 4-3 «فتح الثغور في النباتات» (15 دقيقة)", "1. فهم: يصف آلية فتح الثغر: ضخ البروتونات، ودخول أيونات البوتاسيوم، وانخفاض الجهد المائي، ودخول الماء، وانتفاخ الخلايا\n2. فهم: يصف آلية إغلاق الثغر عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎\n3. تطبيق (مخرج آخر): يحل نشاط 4-3 «فتح الثغور في النباتات»", "- التعلم بالنمذجة\n- التعلم التعاوني\n- الدفتر القالب", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: كتاب التجارب العملية والأنشطة", "مضخات البروتون، أيونات البوتاسيوم، الجهد المائي، الأسموزية، الانتفاخ، حمض الأبسيسيك ‎(ABA)‎، إغلاق الثغور.", "يعرض المعلم بالو  عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎ (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحل نشاط 4-3 «فتح الثغور في النباتات» (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف آلية فتح الثغر: ضخ البروتونات، ودخول أيونات البوتاسيوم، وانخفاض الجهد المائي، ودخول الماء، وانتفاخ الخلايا<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف آلية إغلاق الثغر عند الجفاف ودور حمض الأبسيسيك ‎(ABA)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحل نشاط 4-3 «فتح الثغور في النباتات»<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">الدفتر القالب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>مضخات البروتون، أيونات البوتاسيوم، الجهد المائي، الأسموزية، الانتفاخ، حمض الأبسيسيك ‎(ABA)‎، إغلاق الثغور.<\/p>", "<p>يعرض المعلم بالونين طويلين ملصقًا عليهما شريط لاصق من جهة واحدة، وينفخهما ليظهر انحناؤهما وتكوّن فتحة بينهما، ويسأل: «ما الذي يقابل الهواء في الخلية الحارسة؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم نموذج البالونين، والطلبة يربطون الهواء بالماء والشريط بالجدار السميك (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم خطوات الفتح بالأسهم ثم الإغلاق ودور ‎ABA‎، والطلبة يرسمون مخططًا انسيابيًا للخطوات في «الدفتر القالب» (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 4-3 (كتاب التجارب ص 90)، والطلبة يحلون في أزواج ويفسرون البيانات (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الدفتر القالب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الأيونات التي تدخل الخلايا الحارسة عند فتح الثغر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أيونات البوتاسيوم ‎(K⁺)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما أثر دخول ‎K⁺‎ على الجهد المائي للخلية الحارسة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ينخفض الجهد المائي فيدخل الماء بالأسموزية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما دور ‎ABA‎ عند الجفاف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يحفز خروج أيونات البوتاسيوم من الخلايا الحارسة فيخرج الماء وتفقد انتفاخها ويُغلق الثغر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخطوة الأولى في فتح الثغر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ضخ البروتونات ‎(H⁺)‎ خارج الخلية الحارسة بالنقل النشط باستخدام ‎ATP‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> رتب: انتفاخ الخلايا، دخول الماء، ضخ البروتونات، دخول ‎K⁺‎، انخفاض الجهد المائي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ضخ البروتونات ← دخول ‎K⁺ ←‎ انخفاض الجهد المائي ← دخول الماء ← انتفاخ الخلايا وفتح الثغر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> نبات طافر لا ينتج ‎ABA‎. توقع ما يحدث له في الجفاف.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تبقى ثغوره مفتوحة فيفقد الماء بسرعة ويذبل.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 4-3 ص 90 ومراجعة ص 148–150<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن نموذج البالونين وما يمثله كل جزء منه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=21<\/p>"]}, {"axis": "مراجعة الوحدة الرابعة وأسئلة نهاية الوحدة", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 4: الاتزان الداخلي"], ["الدرس", "الاتزان الداخلي في النباتات"], ["الحصة", "3 من 3"], ["محور الحصة", "مراجعة الوحدة الرابعة وأسئلة نهاية الوحدة"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 151–163"], ["دليل المعلم", "ص 181–184"], ["كتاب التجارب العملية والأنشطة", "نشاط 4-3: فتح الثغور في النباتات ص 90"]], "t": ["1. يربط بين آليات الاتزان الداخلي في الحيوان والنبات في منظم مقارنة (10 دقائق)\n2. يحل أسئلة نهاية الوحدة الرابعة في الكلية والهرمونات والثغور (20 دقيقة)\nمخرج تعليمي آخر: يقيّم تعلمه بقائمة التقويم الذاتي ويحدد خطة مراجعة (10 دقائق)", "1. تحليل: يربط بين آليات الاتزان الداخلي في الحيوان والنبات في منظم مقارنة\n2. تطبيق: يحل أسئلة نهاية الوحدة الرابعة في الكلية والهرمونات والثغور\n3. تقييم (مخرج آخر): يقيّم تعلمه بقائمة التقويم الذاتي ويحدد خطة مراجعة", "- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎", "ملخص الوحدة، الإخراج، التنظيم الأسموزي، تنظيم الجلوكوز، التأشير الخلوي، الثغو \/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه بناء جدول مقارنة: العامل، المستقبل، المنسق، المستجيب (للماء، والجلوكوز، والثغور)، والطلبة يكملون الجدول في مجموعات (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم أسئلة نهاية الوحدة (ص 153–163) على المجموعات، والطلبة يحلون ويعرضون الحلول (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ثغور الغافة: تفسر المجموعات كيف تغلق الخلايا الحارسة ثغور أشجار الغاف والسمر في حر الصيف، وتقترح زراعة الأشجار المحلية للمحافظة على بيئة عمان (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما العامل الذي يكشفه كل من: المستقبلات الأسموزية، وخلايا بيتا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المستقبلات الأسموزية: الجهد المائي للدم؛ خلايا بيتا: تركيز الجلوكوز في الدم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما المشترك بين تأثير ‎ADH‎ والإنسولين في الخلايا الهدف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: كلاهما يرتبط بمستقبلات على غشاء الخلية ويؤدي إلى إدخال بروتينات نقل (أكوابورينات أو ‎GLUT4‎) في الغشاء.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تُعد الثغور مثالًا على الاتزان الداخلي في النبات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها تستجيب لتغيرات البيئة لتحافظ على توازن الماء وتبادل الغازات داخل النبات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر هرمونين يعملان بالتغذية الراجعة السلبية في الثدييات.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ADH‎ والإنسولين (أو الجلوكاجون).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تحتاج الخلايا الهدف إلى مستقبلات على سطحها لهرمونات ‎ADH‎ والإنسولين والجلوكاجون؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها هرمونات ببتيدية كبيرة ومحبة للماء لا تعبر الغشاء، فتؤثر عبر الارتباط بمستقبلات سطحية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم أداءك في الوحدة: اذكر موضوعًا أتقنته وآخر تحتاج إلى مراجعته وخطوة عملية لذلك.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة واضحة مثل حل أسئلة إضافية أو إعادة رسم مخطط.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ملخص الوحدة ص 151–152 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي<\/p><p><b>إرشاد لولي الأمر:<\/b> الاطلاع مع الابن على خطته لمراجعة الوحدة الرابعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=21<\/p>"]}]}, {"title": "مقارنة جهاز الغدد الصماء والجهاز العصبي", "sb": "ص 164", "unit": "الوحدة 5: التحكم والتنسيق", "periods": [{"axis": "مقارنة التأشير الهرموني والتأشير العصبي", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "مقارنة جهاز الغدد الصماء والجهاز العصبي"], ["الحصة", "1 من 2"], ["محور الحصة", "مقارنة التأشير الهرموني والتأشير العصبي"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 164"], ["دليل • الإجابة النموذجية: لأن الخلايا الهدف وحدها تمتلك المستقبلات النوعية لذلك الهرمون.", "1. مستوى المعرفة: اذكر فرقين بين جهاز الغدد الصماء والجهاز العصبي.\n• الإجابة النموذجية: الغدد الصماء: إشارة كيميائية عبر الدم، أبطأ وتأثيرها أطول وأوسع؛ العصبي: إشارة كهربائية عبر الخلايا العصبية، أسرع وتأثيرها قصير ومحدد.\n\n2. مستوى التطبيق: صنّف: سحب اليد من الحرارة، تنظيم سكر الدم، النمو.\n• الإجابة النموذجية: سحب اليد: عصبي؛ تنظيم السكر: هرموني؛ النمو: هرموني.\n\n3. مستوى الاستدلال: لماذا يُعد التنسيق بين الجهازين ضروريًا في الاستجابة للخطر؟\n• الإجابة النموذجية: لأن الجهاز العصبي يعطي استجابة فورية، والهرمونات (مثل الأدرينالين) تطيل الاستجابة وتهيئ الجسم كله لها.", "إرشاد للطالب: مراجعة ص 164 وحل السؤالين 1 و2\nإرشاد لولي الأمر: الحديث مع الابن عن مواقف يومية تظهر فيها الاستجابة العصبية السريعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=22"], "h": ["<ol class=\"ol\"><li>يقارن بين جهاز الغدد الصماء والجهاز العصبي من حيث طبيعة الإشارة ووسيلة نقلها وسرعتها ومدة تأثيرها (15 دقيقة)<\/li><li>يذكر أن الهرمونات تُنقل في بلازما الدم إلى خلايا هدف تمتلك مستقبلات نوعية (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصنف أمثلة استجابات إلى عصبية أو هرمونية أو مشتركة (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يقارن بين جهاز الغدد الصماء والجهاز العصبي من حيث طبيعة الإشارة ووسيلة نقلها وسرعتها ومدة تأثيرها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تذكر:<\/b> يذكر أن الهرمونات تُنقل في بلازما الدم إلى خلايا هدف تمتلك مستقبلات نوعية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يصنف أمثلة استجابات إلى عصبية أو هرمونية أو مشتركة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">مقارنة العمليات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: بطاقات استجابات لتصنيفها<\/span><\/div>", "<p>جهاز الغدد الصماء، الغدة الصماء، الهرمون، الخلية الهدف، الجهاز العصبي، النبضة العصبية، سرعة الاستجابة، مدة التأثير.<\/p>", "<p>يسأل المعلم: «عندما تلمس سطحًا ساخنًا تسحب يدك في أقل من ثانية، لكن النمو في طولك يستغرق سنوات؛ ما الفرق بين الرسالتين؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ومهام بداية الوحدة، والطلبة يقترحون الفرق بين الإشارة العصبية والهرمونية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الجدول 5-1 والشكل 5-1 للمقارنة بين الجهازين، والطلبة يكملون جدول مقارنة بخمسة معايير (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينفذ نشاط «مقارنة العمليات»: بطاقات استجابات يصنفها الطلبة، والطلبة يصنفون البطاقات ويبررون تصنيفهم أمام الصف (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: مقارنة العمليات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يوجه المعلم حل السؤالين 1 و2 (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تُنقل الهرمونات إلى الخلايا الهدف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في بلازما الدم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أيهما أسرع: الاستجابة العصبية أم الهرمونية؟ ولماذا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: العصبية؛ لأن النبضات تنتقل مباشرة على طول الخلايا العصبية بسرعة كبيرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تستجيب كل خلايا الجسم لهرمون معين رغم وصوله إليها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الخلايا الهدف وحدها تمتلك المستقبلات النوعية لذلك الهرمون.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر فرقين بين جهاز الغدد الصماء والجهاز العصبي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الغدد الصماء: إشارة كيميائية عبر الدم، أبطأ وتأثيرها أطول وأوسع؛ العصبي: إشارة كهربائية عبر الخلايا العصبية، أسرع وتأثيرها قصير ومحدد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صنّف: سحب اليد من الحرارة، تنظيم سكر الدم، النمو.<br><span style=\"opacity:.85\">• الإجابة النموذجية: سحب اليد: عصبي؛ تنظيم السكر: هرموني؛ النمو: هرموني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يُعد التنسيق بين الجهازين ضروريًا في الاستجابة للخطر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجهاز العصبي يعطي استجابة فورية، والهرمونات (مثل الأدرينالين) تطيل الاستجابة وتهيئ الجسم كله لها.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 164 وحل السؤالين 1 و2<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن مواقف يومية تظهر فيها الاستجابة العصبية السريعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=22<\/p>"]}, {"axis": "الاستقصاء العملي 5-1: ردود الفعل المنعكس واستنتاج الأفكار", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "مقارنة جهاز الغدد الصماء والجهاز العصبي"], ["الحصة", "2 من 2"], ["محور الحصة", "الاستقصاء العملي 5-1: ردود الفعل المنعكس واستنتاج الأفكار"], ["الأسبوع والتاريخ", "الأسبوع الثالث عشر (29/11–3/12/2026)"], ["كتاب الطالب", "ص 164"], ["دليل المعلم", "ص 220–223"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 5-1: استقصاء ردود الفعل المنعكس عند الإنسان ص 132"]], "t": ["1. ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات (20 دقيقة)\n2. يستنتج خصائص الفعل المنعكس: سريع، لا إرادي، نمطي (5 دقائق)\nمخرج تعليمي آخر: يقيس زمن رد الفعل (التقاط مسطرة) ويقارنه بالفعل المنعكس (15 دقيقة)", "1. تطبيق: ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات\n2. تحليل: يستنتج خصائص الفعل المنعكس: سريع، لا إرادي، نمطي\n3. تطبيق (مخرج آخر): يقيس زمن رد الفعل (التقاط مسطرة) ويقارنه بالفعل المنعكس", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: مطرقة مطاطية، مصباح يدوي، مسطرة مترية، كتاب التجارب العملية والأنشطة", "الفعل المنعكس، الاستجابة اللاإرادية، منعكس الركبة، منعكس الحدقة، زمن رد الفعل، السلامة.", "يسقط المعلم مسطرة فجأة أمام طالب ليلتقطها، ثم يسأل: «هل فكرت قبل أن تلتقطها؟ وهل يختلف ذلك عن رمش عينك حين يقترب شيء منها؟»", "1. ينفذ المعلم عرض المسطرة ويطرح السؤال، والطلبة يقارنون بين الحركة الإرادية والمنعكسة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجه المعلم تنفيذ الاستقصاء العملي 5-1 (كتاب التجارب ص 132) مع التشديد على السلامة، والطلبة ينفذون منعكس الركبة والحدقة وقياس زمن الالتقاط ويسجلون النتائج (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يدير المعلم نشاط «استنتاج الأفكار» من النتائج، والطلبة يستنتجون خصائص الفعل المنعكس ويحسبون متوسط زمن رد الفعل (7 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – الرسول والهاتف: تقارن المجموعات جهاز الغدد الصماء بالرسائل التي كانت تنقلها السفن، والجهاز العصبي بالاتصالات الحديثة في عمان، من حيث السرعة ومدة التأثير (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: لماذا يُعد منعكس الركبة لا إراديًا؟\n• الإجابة النموذجية: لأنه يحدث تلقائيًا دون تفكير أو تحكم واعٍ من الدماغ.\n\n2. مستوى التطبيق: ماذا يحدث لحدقة العين عند تسليط ضوء قوي عليها؟\n• الإجابة النموذجية: تضيق.\n\n3. مستوى الاستدلال: لماذا يكون زمن التقاط المسطرة أطول من زمن منعكس الركبة؟\n• الإجابة النموذجية: لأن الالتقاط فعل إرادي تمر إشارته بالدماغ ومعالجة أكثر، بينما المنعكس يمر عبر مسار عصبي قصير.", "1. مستوى المعرفة: اذكر خاصيتين للفعل المنعكس.\n• الإجابة النموذجية: سريع ولا إرادي (ونمطي يتكرر بالطريقة نفسها).\n\n2. مستوى التطبيق: ما فائدة منعكس الحدقة للإنسان؟\n• الإجابة النموذجية: حماية الشبكية من الضوء الشديد.\n\n3. مستوى الاستدلال: اقترح طريقة لتحسين موثوقية قياس زمن رد الفعل.\n• الإجابة النموذجية: تكرار القياس عدة مرات وحساب المتوسط، وتثبيت ارتفاع إسقاط المسطرة ووضع اليد، واستخدام عدة أشخاص.", "إرشاد للطالب: كتابة تقرير الاستقصاء 5-1 وحساب متوسط زمن رد الفعل\nإرشاد لولي الأمر: يمكن إجراء تجربة التقاط المسطرة مع الابن في المنزل ومقارنة أزمنة أفراد الأسرة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=22"], "h": ["<ol class=\"ol\"><li>ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات (20 دقيقة)<\/li><li>يستنتج خصائص الفعل المنعكس: سريع، لا إرادي، نمطي (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيس زمن رد الفعل (التقاط مسطرة) ويقارنه بالفعل المنعكس (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf; ding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تركيب الخلايا العصبية الثلاث والمايلين بالأشكال 5-2 إلى 5-6، والطلبة يرسمون خلية حسية وحركية ويسمون أجزاءهما (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقود المعلم نشاط «دراسة تركيب الخلايا العصبية» ثم يبني مع الطلبة القوس الانعكاسي على السبورة، والطلبة يرتبون بطاقات القوس الانعكاسي ويحددون اتجاه النبضة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: دراسة تركيب الخلايا العصبية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة الخلية العصبية الحسية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نقل النبضات من المستقبلات إلى الجهاز العصبي المركزي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أين يقع جسم الخلية العصبية الحركية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: داخل الجهاز العصبي المركزي (الحبل الشوكي أو الدماغ).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الخلايا التي تكوّن غمد المايلين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: خلايا شوان.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> رتب مكونات القوس الانعكاسي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مستقبل ← خلية عصبية حسية ← خلية عصبية موصلة ← خلية عصبية حركية ← مستجيب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما عقد رانفييه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فجوات قصيرة غير مغطاة بالمايلين بين خلايا شوان على طول المحور الأسطواني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون القوس الانعكاسي سريعًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يتضمن عددًا قليلًا من الخلايا العصبية والتشابكات ولا يحتاج إلى معالجة واعية في الدماغ.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 165–170 ورسم القوس الانعكاسي<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن أجزاء الخلية العصبية بالاستعانة برسمه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23<\/p>"]}, {"axis": "جهد الراحة ومضخة الصوديوم والبوتاسيوم", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "التواصل العصبي"], ["الحصة", "2 من 5"], ["محور الحصة", "جهد الراحة ومضخة الصوديوم والبوتاسيوم"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 171–172"], ["دليل المعلم", "ص 224–231"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]], "t": ["1. يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه (10 دقائق)\n2. يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎ (20 دقيقة)\nمخرج تعليمي آخر: يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة (10 دقائق)", "1. فهم: يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه\n2. فهم: يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎\n3. تحليل (مخرج آخر): يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة", "- التعلم بالنمذجة\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)", "جهد الغشاء، جهد الراحة، الاستقطاب، مضخة الصوديوم والبوتاسيوم، النقل النشط، قنوات البوتاسيوم، تدرج التركيز، ‎ATP‎.", "يعرض المعلم بطارية ويسأل: «الخلية العصبية في الراحة تشبه بطارية مشحونة صغيرة؛ ما الذي يصنع فرق الجهد بين داخلها وخارجها؟»", "1. يعرض المعلم البطارية ويطرح السؤال، والطلبة يقترحون اختلاف توزيع الأيونات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم جهد الراحة ومضخة ‎Na⁺/K⁺‎ ونفاذية الغشاء لـ ‎K⁺‎ بالشكل المناسب، والطلبة يرسمون الغشاء ويحددون اتجاه حركة كل أيون (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. ينظم نمذجة: طلاب يمثلون أيونات ومضخة على «غشاء» مرسوم على الأرض، والطلبة يمثلون عمل المضخة ويحسبون صافي الشحنة المنقولة لكل دورة (14 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: كم قيمة جهد الراحة تقريبًا؟\n• الإجابة النموذجية: نحو ‎−70 mV‎.\n\n2. مستوى التطبيق: كم أيون ‎Na⁺‎ و‎K⁺‎ تنقلها المضخة في كل دورة؟\n• الإجابة النموذجية: تخرج ‎3 Na⁺‎ وتدخل ‎2 K⁺‎.\n\n3. مستوى الاستدلال: لماذا يكون داخل الخلية سالبًا في الراحة؟\n• الإجابة النموذجية: لأن المضخة تخرج شحنات موجبة أكثر مما تدخل، ولأن الغشاء أكثر نفاذية لـ ‎K⁺‎ فيتسرب للخارج، إضافة إلى وجود أنيونات كبيرة داخل الخلية.", "1. مستوى المعرفة: ما نوع النقل في مضخة الصوديوم والبوتاسيوم؟\n• الإجابة النموذجية: نقل نشط يستهلك ‎ATP‎.\n\n2. مستوى التطبيق: أين يكون تركيز ‎Na⁺‎ أعلى في الراحة؟ وأين يكون ‎K⁺‎ أعلى؟\n• الإجابة النموذجية: ‎Na⁺‎ أعلى خارج الخلية، و‎K⁺‎ أعلى داخلها.\n\n3. مستوى الاستدلال: ماذا يحدث لجهد الراحة إذا ثُبطت إنتاجية ‎ATP‎ في الخلية العصبية؟\n• الإجابة النموذجية: تتوقف المضخة تدريجيًا فتتلاشى تدرجات الأيونات ويقترب جهد الغشاء من الصفر فتفقد الخلية قدرتها على نقل النبضات.", "إرشاد للطالب: مراجعة ص 171–172 ورسم توزيع الأيونات على جانبي الغشاء\nإرشاد لولي الأمر: سؤال الابن عن تشبيه البطارية وكيف ينطبق على الخلية العصبية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23"], "h": ["<ol class=\"ol\"><li>يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه (10 دقائق)<\/li><li>يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎ (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>جهد الغشاء، جهد الراحة، الاستقطاب، مضخة الصوديوم والبوتاسيوم، النقل النشط، قنوات البوتاسيوم، تدرج التركيز، ‎ATP‎.<\/p>", "<p>يعرض المعلم بطارية ويسأل: «الخلية العصبية في الراحة تشبه بطارية مشحونة صغيرة؛ ما الذي يصنع فرق الجهد بين داخلها وخارجها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم البطارية ويطرح السؤال، والطلبة يقترحون اختلاف توزيع الأيونات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم جهد الراحة ومضخة ‎Na⁺/K⁺‎ ونفاذية الغشاء لـ ‎K⁺‎ بالشكل المناسب، والطلبة يرسمون الغشاء ويحددون اتجاه حركة كل أيون (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينظم نمذجة: طلاب يمثلون أيونات ومضخة على «غشاء» مرسوم على الأرض، والطلبة يمثلون عمل المضخة ويحسبون صافي الشحنة المنقولة لكل دورة (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كم قيمة جهد الراحة تقريبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نحو ‎−70 mV‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كم أيون ‎Na⁺‎ و‎K⁺‎ تنقلها المضخة في كل دورة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تخرج ‎3 Na⁺‎ وتدخل ‎2 K⁺‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون داخل الخلية سالبًا في الراحة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن المضخة تخرج شحنات موجبة أكثر مما تدخل، ولأن الغشاء أكثر نفاذية لـ ‎K⁺‎ فيتسرب للخارج، إضافة إلى وجود أنيونات كبيرة داخل الخلية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نوع النقل في مضخة الصوديوم والبوتاسيوم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نقل نشط يستهلك ‎ATP‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أين يكون تركيز ‎Na⁺‎ أعلى في الراحة؟ وأين يكون ‎K⁺‎ أعلى؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Na⁺‎ أعلى خارج الخلية، و‎K⁺‎ أعلى داخلها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يحدث لجهد الراحة إذا ثُبطت إنتاجية ‎ATP‎ في الخلية العصبية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتوقف المضخة تدريجيًا فتتلاشى تدرجات الأيونات ويقترب جهد الغشاء من الصفر فتفقد الخلية قدرتها على نقل النبضات.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 171–172 ورسم توزيع الأيونات على جانبي الغشاء<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه البطارية وكيف ينطبق على الخلية العصبية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23<\/p>"]}, {"axis": "جهد الفعل وفترة الجموح", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 5: التحكم والتنسيق"], ["الدرس", "التواصل العصبي"], ["الحصة", "3 من 5"], ["محور الحصة", "جهد الفعل وفترة الجموح"], ["الأسبوع والتاريخ", "الأسبوع الرابع عشر (6–10/12/2026)"], ["كتاب الطالب", "ص 173–177 + كتاب التجارب ص 122"], ["دليل المعلم", "ص 224–231"], ["كتاب التجارب العملية والأنشطة", "نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]], "t": ["1. يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد (15 دقيقة)\n2. يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد (5 دقائق)\nمخرج تعليمي آخر: يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه (20 دقيقة)", "1. فهم: يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد\n2. فهم: يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد\n3. تحليل (مخرج آخر): يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه", "- التعلم بالنمذجة\n- التعلم التعاوني\n- جعل معنى منطقي للآليات", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: كتاب التجارب العملية والأنشطة", "جهد الفعل، العتبة، إزالة الاستقطاب، إعادة الاستقطاب، فرط الاستقطاب، القنوات المبوبة بالجهد، فترة الجموح، مبدأ الكل أو لا شيء.", "يعرض المعلم تمثيلًا بيانيًا لجهد الفعل دون عناوين ويسأل: «في أقل من ثلاثة ملي ثانية صعد الجهد من −70 إلى +40 ثم عاد؛ ما الذي فُتح وأُغلق؟»", "1. يعرض المعلم التمثيل ويطرح السؤال، والطلبة يقترحون فتح قنوات أيونية (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم مراحل جهد الفعل والقنوات المبوبة بالجهد والعتبة ومبدأ الكل أو لا شيء وفترة الجموح، والطلبة يعنونون مراحل التمثيل البياني ويكتبون الأيون المتحرك في كل مرحلة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 5-1 «النبضات العصبية» (كتاب التجارب ص 122)، والطلبة يحلون في أزواج ويفسرون البيانات (14 دقيقة)\nالاستراتيجيات: جعل معنى منطقي للآليات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الذي يسبب إزالة الاستقطاب؟\n• الإجابة النموذجية: فتح قنوات ‎Na⁺‎ المبوبة بالجهد ودخول ‎Na⁺‎ بسرعة إلى الخلية.\n\n2. مستوى التطبيق: ما الذي يسبب إعادة الاستقطاب؟\n• الإجابة النموذجية: إغلاق قنوات ‎Na⁺‎ وفتح قنوات ‎K⁺‎ المبوبة بالجهد وخروج ‎K⁺‎.\n\n3. مستوى الاستدلال: لماذا لا ينشأ جهد فعل جديد خلال فترة الجموح؟\n• الإجابة النموذجية: لأن قنوات ‎Na⁺‎ تكون مغلقة وغير قابلة للفتح مؤقتًا.", "1. مستوى المعرفة: ما المقصود بمبدأ الكل أو لا شيء؟\n• الإجابة النموذجية: إذا بلغ المنبه العتبة نشأ جهد فعل كامل بالقيمة نفسها، وإن لم يبلغها لا ينشأ جهد فعل.\n\n2. مستوى التطبيق: كيف يدل الجهاز العصبي على شدة المنبه إذا كانت جهود الفعل متساوية؟\n• الإجابة النموذجية: بزيادة تكرار جهود الفعل (عددها في الثانية).\n\n3. مستوى الاستدلال: اشرح أهمية فترة الجموح لاتجاه انتقال النبضة.\n• الإجابة النموذجية: تمنع الجزء الذي مرت به النبضة من إعادة إزالة الاستقطاب فورًا، فتنتقل النبضة في اتجاه واحد إلى الأمام.", "إرشاد للطالب: إكمال نشاط 5-1 ص 122 ورسم تمثيل جهد الفعل وعنونته\nإرشاد لولي الأمر: تشجيع الابن على شرح مراحل جهد الفعل بالترتيب مستعينًا بالرسم\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=23"], "h": ["<ol class=\"ol\"><li>يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد (15 دقيقة)<\/li><li>يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">جعل معنى منطقي للآليات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>جهد الفعل، العتبة، إزالة الاستقطاب، إعادة الاستقطاب، فرط الاستقطاب، القنوات المبوبة بالجهد، فترة الجموح، مبدأ الكل أو لا شيء.<\/p>", "<p>يعر
