0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يكتب مخطط وراثة لصفة مرتبطة بالجنس باستخدام الرموز ‎Xᴴ‎ و‎Xʰ‎ و‎Y‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر لماذا تظهر الصفات المتنحية المرتبطة بـ ‎X‎ في الذكور أكثر من الإناث<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>الكروموسومات الجنسية، ‎X‎ و‎Y‎، الوراثة المرتبطة بالجنس، الأنثى الحاملة، الهيموفيليا، عمى الألوان.<\/p>", "<p>يعرض المعلم صورة لوحة اختبار عمى الألوان (إيشيهارا) ويسأل: «لماذا ينتشر عمى الألوان بين الرجال أكثر من النساء؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم اللوحة ويطرح السؤال، والطلبة يقترحون تفسيرات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الكروموسومات الجنسية وتحديد الجنس وتمثيل الأليلات على ‎X‎، والطلبة يرسمون مخطط تحديد الجنس ويكتبون الطرز الجينية الخمسة لصفة مرتبطة بـ ‎X‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل الهيموفيليا وعمى الألوان للحل في مجموعات، والطلبة يحلون المسائل بمخططات كاملة ويستنتجون نسب الإصابة حسب الجنس (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الطراز الجيني لأنثى حاملة للهيموفيليا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎XᴴXʰ‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يكون الذكر حاملًا لصفة متنحية مرتبطة بـ ‎X‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يحمل كروموسوم ‎X‎ واحدًا، فإما أن يظهر الأليل المتنحي أو لا يوجد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أم حاملة وأب سليم: ما احتمال إصابة ابن ذكر بالهيموفيليا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 50% من الذكور.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا لا ينقل الأب صفة مرتبطة بـ ‎X‎ إلى أبنائه الذكور؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأب يعطي أبناءه الذكور الكروموسوم ‎Y‎ لا ‎X‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب مخطط وراثة لأم حاملة لعمى الألوان وأب مصاب.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎XᴮXᵇ × XᵇY‎: البنات ‎XᴮXᵇ (‎حاملة) و‎XᵇXᵇ (‎مصابة)، والأبناء ‎XᴮY (‎سليم) و‎XᵇY (‎مصاب)؛ 50% من كل جنس مصاب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> فسّر ندرة الإصابة بالهيموفيليا عند الإناث.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأنثى تحتاج إلى أليلين متنحيين (من الأب المصاب والأم الحاملة)، وهذا التركيب نادر.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 59–60 وحل مسألتين في الوراثة المرتبطة بالجنس<\/p><p><b>إرشاد لولي الأمر:<\/b> مناقشة الابن في أهمية الاستشارة الوراثية للأسر التي تظهر فيها أمراض وراثية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9<\/p>"]}, {"axis": "التزاوجات ثنائية الهجين ونسبة 9:3:3:1", "n": 4, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الوراثة والمخططات الجينية"], ["الحصة", "4 من 8"], ["محور الحصة", "التزاوجات ثنائية الهجين ونسبة 9:3:3:1"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "ص 61–63 + كتاب التجارب ص 46"], ["دليل المعلم", "ص 91–95"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]], "t": ["1. يكتب مخطط وراثة لتزاوج ثنائي الهجين لجينين غير مرتبطين مستخدمًا مربع بانيت ‎4×4‎ (10 دقائق)\n2. يفسر نسبة 9:3:3:1 في ضوء الاصطفاف العشوائي للكروموسومات (15 دقيقة)\nمخرج تعليمي آخر: يجيب عن أسئلة تتضمن تزاوجات ثنائية الهجين (نشاط 2-3) (15 دقيقة)", "1. تطبيق: يكتب مخطط وراثة لتزاوج ثنائي الهجين لجينين غير مرتبطين مستخدمًا مربع بانيت ‎4×4‎\n2. تحليل: يفسر نسبة 9:3:3:1 في ضوء الاصطفاف العشوائي للكروموسومات\n3. تطبيق (مخرج آخر): يجيب عن أسئلة تتضمن تزاوجات ثنائية الهجين (نشاط 2-3)", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: كتاب التجارب العملية والأنشطة", "التزاوج ثنائي الهجين، الجينات غير المرتبطة، أمشاج ثنائية الأليلات، مربع بانيت ‎4×4‎، النسبة 9:3:3:1.", "يعرض المعلم صورة بذور بازلاء صفراء ملساء وخضراء مجعدة ويسأل: «إذا تتبعنا صفتين معًا، كم نوعًا من الأمشاج ينتج نبات ‎YyRr‎؟»", "1. يطرح المعلم السؤال ويستقبل الإجابات، والطلبة يستنتجون أربعة أنواع: ‎YR‎ و‎Yr‎ و‎yR‎ و‎yr‎ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل نيت ‎4×4‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر نسبة 9:3:3:1 في ضوء الاصطفاف العشوائي للكروموسومات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يجيب عن أسئلة تتضمن تزاوجات ثنائية الهجين (نشاط 2-3)<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>التزاوج ثنائي الهجين، الجينات غير المرتبطة، أمشاج ثنائية الأليلات، مربع بانيت ‎4×4‎، النسبة 9:3:3:1.<\/p>", "<p>يعرض المعلم صورة بذور بازلاء صفراء ملساء وخضراء مجعدة ويسأل: «إذا تتبعنا صفتين معًا، كم نوعًا من الأمشاج ينتج نبات ‎YyRr‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويستقبل الإجابات، والطلبة يستنتجون أربعة أنواع: ‎YR‎ و‎Yr‎ و‎yR‎ و‎yr‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل المعلم مثال ‎YyRr × YyRr‎ بمربع بانيت ‎4×4‎ ويربط الأمشاج الأربعة بالاصطفاف العشوائي، والطلبة يملؤون المربع ويستخرجون النسبة 9:3:3:1 (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-3 (كتاب التجارب ص 46)، والطلبة يحلون الأسئلة في أزواج (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الأمشاج التي ينتجها الفرد ‎AaBb‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AB‎ و‎Ab‎ و‎aB‎ و‎ab‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما نسبة الطراز المظهري المتنحي في الصفتين في نسل ‎AaBb × AaBb‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 1/16.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا ينتج ‎AaBb‎ أربعة أنواع من الأمشاج بنسب متساوية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجينين على كروموسومين مختلفين فتصطف الأزواج عشوائيًا ويتوزع كل أليل مستقلًا عن الآخر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نسبة الطرز المظهرية في نسل تزاوج ثنائي الهجين بين فردين متباينين في الجينين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 9:3:3:1.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب أمشاج الفرد ‎AABb‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AB‎ و‎Ab‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم فردًا متوقعًا بالطراز المظهري السائد في الصفتين من 320 نبتة ناتجة عن ‎AaBb × AaBb‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎9/16 × 320 = 180‎ نبتة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-3 ص 46 ومراجعة ص 61–63<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على التدرب على رسم مربع بانيت ‎4×4‎ بدقة وترتيب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9<\/p>"]}, {"axis": "تدريب: تزاوجات ثنائية الهجين والتلقيح الاختباري الثنائي", "n": 5, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الوراثة والمخططات الجينية"], ["الحصة", "5 من 8"], ["محور الحصة", "تدريب: تزاوجات ثنائية الهجين والتلقيح الاختباري الثنائي"], ["الأسبوع والتاريخ", "الأسبوع السادس (11–15/10/2026)"], ["كتاب الطالب", "ص 61–63 + كتاب التجارب ص 49"], ["دليل المعلم", "ص 91–95"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]], "t": ["1. يحل مسائل تزاوج ثنائي الهجين تتضمن تلقيحًا اختباريًا ‎(AaBb × aabb)‎ (15 دقيقة)\n2. يستنتج الطرز الجينية للآباء من نسب النسل الناتج (15 دقيقة)\nمخرج تعليمي آخر: يقيّم حلولًا مختلفة لمسألة واحدة ويحدد الخطأ فيها (10 دقائق)", "1. تطبيق: يحل مسائل تزاوج ثنائي الهجين تتضمن تلقيحًا اختباريًا ‎(AaBb × aabb)‎\n2. تحليل: يستنتج الطرز الجينية للآباء من نسب النسل الناتج\n3. تقييم (مخرج آخر): يقيّم حلولًا مختلفة لمسألة واحدة ويحدد الخطأ فيها", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: كتاب التجارب العملية والأنشطة", "التلقيح الاختباري الثنائي، النسبة 1:1:1:1، الاستدلال العكسي، النسب المتوقعة.", "يعرض المعلم نتيجة تزاوج غامض: «النسل بنسبة 1:1:1:1» ويسأل: «من هما الأبوان؟» ويمنح دقيقة للتفكير.", "1. يعرض المعلم اللغز ويناقش الاحتمالات، والطلبة يقترحون ‎AaBb × aabb‎ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل مثال التلقيح الاختباري الثنائي ويبين النسبة 1: 1:1:1، والطلبة يكملون المخطط ويقارنونه بنسبة 9:3:3:1 (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل نشاط 2-4 «تزاوج آخر لثنائي الهجين» (كتاب التجارب ص 49)، والطلبة ي :<\/b> يستنتج الطرز الجينية للآباء من نسب النسل الناتج<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يقيّم حلولًا مختلفة لمسألة واحدة ويحدد الخطأ فيها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>التلقيح الاختباري الثنائي، النسبة 1:1:1:1، الاستدلال العكسي، النسب المتوقعة.<\/p>", "<p>يعرض المعلم نتيجة تزاوج غامض: «النسل بنسبة 1:1:1:1» ويسأل: «من هما الأبوان؟» ويمنح دقيقة للتفكير.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم اللغز ويناقش الاحتمالات، والطلبة يقترحون ‎AaBb × aabb‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل مثال التلقيح الاختباري الثنائي ويبين النسبة 1: 1:1:1، والطلبة يكملون المخطط ويقارنونه بنسبة 9:3:3:1 (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-4 «تزاوج آخر لثنائي الهجين» (كتاب التجارب ص 49)، والطلبة يحلون في مجموعات ويقيّمون حلول مجموعة أخرى (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اكتب أمشاج الفرد ‎aabb‎» على السبورة، ويناقش المعلم الإجابات مع الصف (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نسبة النسل في التزاوج ‎AaBb × aabb‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 1:1:1:1.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> نسل نسبته 3:1:3:1. ما الطرازان المحتملان للأبوين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AaBb × Aabb (‎أو ‎AaBb × aaBb‎).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكشف التلقيح الاختباري أمشاج الأب المجهول مباشرة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأب المتنحي يعطي أمشاجًا ‎ab‎ فقط، فيظهر في النسل أثر أليلات أمشاج الأب المجهول كما هي.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب أمشاج الفرد ‎aabb‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎ab‎ فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لُقّح نبات طويل أرجواني الأزهار مع نبات قصير أبيض ‎(ttpp)‎، فكان النسل كله طويلًا أرجوانيًا. ما طراز النبات الأول؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎TTPP‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اكتشف الخطأ: «في تزاوج ‎AaBb × aabb‎ تكون النسبة 9:3:3:1».<br><span style=\"opacity:.85\">• الإجابة النموذجية: خطأ؛ النسبة 1:1:1:1 لأن الأب الثاني ينتج نوعًا واحدًا من الأمشاج.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-4 ص 49 ومراجعة أخطائه في مسائل ثنائي الهجين<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في حل مسألتين وتشجيعه على التحقق من مجموع النسب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9<\/p>"]}, {"axis": "التفوق الجيني", "n": 6, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الوراثة والمخططات الجينية"], ["الحصة", "6 من 8"], ["محور الحصة", "التفوق الجيني"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 64–65 + كتاب التجارب ص 53"], ["دليل المعلم", "ص 91–95"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]], "t": ["1. يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر (15 دقيقة)\n2. يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4) (15 دقيقة)\nمخرج تعليمي آخر: يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني (10 دقائق)", "1. فهم: يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر\n2. تطبيق: يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4)\n3. تحليل (مخرج آخر): يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني", "- التعلم المبني على حل المشكلات\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة", "التفوق الجيني، الجين المتفوق، الجين المتفوق عليه، النسب المعدلة، المسار الإنزيمي.", "يعرض المعلم صورًا لفئران بألوان أغوتي وسوداء وبيضاء ويسأل: «لماذا يظهر لون ثالث (أبيض) لا يفسره جين اللون وحده؟»", "1. يعرض المعلم الصور ويثير التساؤل، والطلبة يقترحون وجود جين آخر يتحكم في ظهور اللون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم التفوق الجيني بمسار إنزيمي من خطوتين يتحكم في الصبغة، والطلبة يرسمون المسار ويحددون أثر غياب كل إنزيم (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يوجه المعلم حل نشاط 2-7 «التفوق الجيني» (كتاب التجارب ص 53)، والطلبة يحلون المسائل ويستخرجون النسب المعدلة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: ما التفوق الجيني؟\n• الإجابة النموذجية: تفاعل بين جينين في مواقع مختلفة يخفي فيه أحدهما أثر الآخر في الطراز المظهري.\n\n2. مستوى التطبيق: ما مجموع أجزاء النسب المعدلة في تزاوج ثنائي الهجين متباين؟\n• الإجابة النموذجية: 16 دائمًا (مثل 9:3:4 أو 9:7).\n\n3. مستوى الاستدلال: في مسار: مادة أولية ←(إنزيم ‎A)←‎ وسيط ←(إنزيم ‎B)←‎ صبغة، ما لون الفرد ‎aaBB‎؟\n• الإجابة النموذجية: بلا صبغة، لأن غياب الإنزيم ‎A‎ يمنع تكون الوسيط.", "1. مستوى المعرفة: كيف تميز التفوق الجيني من نتائج النسل؟\n• الإجابة النموذجية: بظهور نسب معدلة مجموعها 16 تختلف عن 9:3:3:1.\n\n2. مستوى التطبيق: اشرح سبب النسبة 9:3:4 في مثال الفئران.\n• الإجابة النموذجية: الأفراد ‎cc‎ـ ـ (متماثلو أليل التفوق المتنحي) بيض جميعًا مهما كان جين اللون الآخر، فتُضم فئتان (3 + 1) إلى فئة البيض.\n\n3. مستوى الاستدلال: تزاوج ‎AaBb × AaBb‎ أعطى نسبة 9:7. فسّر في ضوء مسار إنزيمي.\n• الإجابة النموذجية: يلزم وجود أليل سائد في الجينين معًا (‎A‎ـ ‎B‎ـ) لإنتاج الصفة (9)، وغياب أي إنزيم يمنعها فتجتمع الفئات الأخرى ‎(3+3+1 = 7)‎.", "إرشاد للطالب: إكمال نشاط 2-7 ص 53 ومراجعة ص 64–65\nإرشاد لولي الأمر: سؤال الابن: «كيف يخفي جين أثر جين آخر؟» ليشرحه بمثال المسار الإنزيمي\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9"], "h": ["<ol class=\"ol\"><li>يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر (15 دقيقة)<\/li><li>يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4) (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>التفوق الجيني، الجين المتفوق، الجين المتفوق عليه، النسب المعدلة، المسار الإنزيمي.<\/p>", "<p>يعرض المعلم صورًا لفئران بألوان أغوتي وسوداء وبيضاء ويسأل: «لماذا يظهر لون ثالث (أبيض) لا يفسره جين اللون وحده؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصور ويثير التساؤل، والطلبة يقترحون وجود جين آخر يتحكم في ظهور اللون (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم التفوق الجيني بمسار إنزيمي من خطوتين يتحكم في الصبغة، والطلبة يرسمون المسار ويحددون أثر غياب كل إنزيم (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-7 «التفوق الجيني» (كتاب التجارب ص 53)، والطلبة يحلون المسائل ويستخرجون النسب المعدلة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما التفوق الجيني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تفاعل بين جينين في مواقع مختلفة يخفي فيه أحدهما أثر الآخر في الطراز المظهري.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما مجموع أجزاء النسب المعدلة في تزاوج ثنائي الهجين متباين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 16 دائمًا (مثل 9:3:4 أو 9:7).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> في مسار: مادة أولية ←(إنزيم ‎A)←‎ وسيط ←(إنزيم ‎B)←‎ صبغة، ما لون الفرد ‎aaBB‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بلا صبغة، لأن غياب الإنزيم ‎A‎ يمنع تكون الوسيط.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كيف تميز التفوق الجيني من نتائج النسل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بظهور نسب معدلة مجموعها 16 تختلف عن 9:3:3:1.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اشرح سبب النسبة 9:3:4 في مثال الفئران.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الأفراد ‎cc‎ـ ـ (متماثلو أليل التفوق المتنحي) بيض جميعًا مهما كان جين اللون الآخر، فتُضم فئتان (3 + 1) إلى فئة البيض.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> تزاوج ‎AaBb × AaBb‎ أعطى نسبة 9:7. فسّر في ضوء مسار إنزيمي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يلزم وجود أليل سائد في الجينين معًا (‎A‎ـ ‎B‎ـ) لإنتاج الصفة (9)، وغياب أي إنزيم يمنعها فتجتمع الفئات الأخرى ‎(3+3+1 = 7)‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 2-7 ص 53 ومراجعة ص 64–65<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن: «كيف يخفي جين أثر جين آخر؟» ليشرحه بمثال المسار الإنزيمي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9<\/p>"]}, {"axis": "الارتباط بالكروموسوم الجسدي والعبور", "n": 7, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الوراثة والمخططات الجينية"], ["الحصة", "7 من 8"], ["محور الحصة", "الارتباط بالكروموسوم الجسدي والعبور"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 66–70 + كتاب التجارب ص 51–52"], ["دليل المعلم", "ص 91–95"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]], "t": ["1. يشرح المقصود بالجينات المرتبطة بالكروموسوم الجسدي وأثرها في نسب النسل (20 دقيقة)\n2. يفسر ظهور أفراد معاد تركيبهم (مؤتلفين) بنسبة قليلة نتيجة العبور (5 دقائق)\nمخرج تعليمي آخر: يحسب نسبة الأفراد المؤتلفين من نتائج تلقيح اختباري (15 دقيقة)", "1. فهم: يشرح المقصود بالجينات المرتبطة بالكروموسوم الجسدي وأثرها في نسب النسل\n2. تحليل: يفسر ظهور أفراد معاد تركيبهم (مؤتلفين) بنسبة قليلة نتيجة العبور\n3. تطبيق (مخرج آخر): يحسب نسبة الأفراد المؤتلفين من نتائج تلقيح اختباري", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج كروموسومات، كتاب التجارب العملية والأنشطة", "الارتباط بالكروموسوم الجسدي، الجينات المرتبطة، الأفراد الأبويون، الأفراد المؤتلفون (معاد تركيبهم)، العبور بين الجينين.", "يعرض المعلم نتيجة تلقيح اختباري: 45% : 45% : 5% : 5% ويسأل: «لماذا لم تكن 25% لكل فئة كما نتوقع؟»", "1. يعرض المعلم النتائج ويطرح السؤال، والطلبة يقارنون بالنسبة 1:1:1:1 ويقترحون تفسيرًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم الارتباط بنماذج كروموسومات (نمذجة الجينات المرتبطة) وأثر العبور، والطلبة يرسمون ep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح المقصود بالجينات المرتبطة بالكروموسوم الجسدي وأثرها في نسب النسل<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يفسر ظهور أفراد معاد تركيبهم (مؤتلفين) بنسبة قليلة نتيجة العبور<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب نسبة الأفراد المؤتلفين من نتائج تلقيح اختباري<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: نماذج كروموسومات، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الارتباط بالكروموسوم الجسدي، الجينات المرتبطة، الأفراد الأبويون، الأفراد المؤتلفون (معاد تركيبهم)، العبور بين الجينين.<\/p>", "<p>يعرض المعلم نتيجة تلقيح اختباري: 45% : 45% : 5% : 5% ويسأل: «لماذا لم تكن 25% لكل فئة كما نتوقع؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم النتائج ويطرح السؤال، والطلبة يقارنون بالنسبة 1:1:1:1 ويقترحون تفسيرًا (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الارتباط بنماذج كروموسومات (نمذجة الجينات المرتبطة) وأثر العبور، والطلبة يرسمون الجينين على كروموسوم واحد ويوضحون كيف ينتج العبور تراكيب جديدة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-5 «الارتباط ity:.85\">• الإجابة النموذجية: كلما زادت المسافة بينهما زاد احتمال العبور بينهما فتزيد نسبة المؤتلفين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح تفسيرًا لنتيجة تلقيح اختباري: 42% و40% (أبويان) و9% و9% (مؤتلفان).<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجينان مرتبطان على كروموسوم واحد، والعبور بينهما حدث في بعض الخلايا فقط فأنتج 18% مؤتلفين.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاطي 2-5 و2-6 ص 51–52 ومراجعة ص 66–70<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين الجينات المرتبطة وغير المرتبطة بمثال بسيط<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9<\/p>"]}, {"axis": "الاستقصاء العملي 2-2: نمذجة تكرار الأليلات ومراجعة الأسئلة", "n": 8, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الوراثة والمخططات الجينية"], ["الحصة", "8 من 8"], ["محور الحصة", "الاستقصاء العملي 2-2: نمذجة تكرار الأليلات ومراجعة الأسئلة"], ["الأسبوع والتاريخ", "الأسبوع السابع (18–22/10/2026)"], ["كتاب الطالب", "ص 56–70 + كتاب التجارب ص 60"], ["دليل المعلم", "ص 91–95"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]], "t": ["1. يستخدم نموذجًا (حبوبًا أو بطاقات ملونة) لمحاكاة تكرار الأليلات واحتمالات الأمشاج (15 دقيقة)\n2. يقارن النتائج التجريبية بالنسب المتوقعة نظريًا ويفسر الفروق (10 دقائق)\nمخرج تعليمي آخر: يحل مجموعة مختارة من الأسئلة 7–22 في كتاب الطالب مراجعةً للدرس (15 دقيقة)", "1. تطبيق: يستخدم نموذجًا (حبوبًا أو بطاقات ملونة) لمحاكاة تكرار الأليلات واحتمالات الأمشاج\n2. تحليل: يقارن النتائج التجريبية بالنسب المتوقعة نظريًا ويفسر الفروق\n3. تطبيق (مخرج آخر): يحل مجموعة مختارة من الأسئلة 7–22 في كتاب الطالب مراجعةً للدرس", "- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: حبوب أو خرز بلونين، أكياس ورقية، كتاب التجارب العملية والأنشطة", "تكرار الأليل، الاحتمال، النسب المتوقعة، النسب الملاحظة، حجم العينة، الخطأ العشوائي.", "يرمي المعلم قطعة نقود عشر مرات ويسأل: «هل كانت النتيجة 5:5 تمامًا؟ ولماذا لا تتطابق النتائج الفعلية مع المتوقعة دائمًا؟»", "1. يجري المعلم التجربة السريعة ويناقش الاحتمال، والطلبة يسجلون النتائج ويقارنونها بالتوقع (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجه المعلم تنفيذ الاستقصاء العملي 2-2 «نمذجة تكرار الأليلات» (كتاب التجارب ص 60)، والطلبة يسحبون الخرز عشوائيًا ويسجلون الطرز الجينية ويحسبون النسب (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يجمع المعلم نتائج المجموعات في جدول صفي واحد، والطلبة يقارنون النتائج المجمعة بالمتوقعة ويستنتجون أثر حجم العينة (7 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يوجه المعلم حل أسئلة مختارة من 7–22 ثم التقويم الختامي، والطلبة يحلون الأسئلة ويناقشونها (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – مربع الفحص قبل الزواج: تكتب المجموعات مخطط وراثة لأبوين حاملين لصفة فقر الدم المنجلي وتحسب النسب، ثم تناقش أهمية الفحص الطبي قبل الزواج للمحافظة على صحة الأسرة العمانية (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم:\n1. مستوى المعرفة: ماذا يمثل كل كيس من الخرز في النموذج؟\n• الإجابة النموذجية: أمشاج أحد الأبوين بأليلاته.\n\n2. مستوى التطبيق: لماذا تقترب نتائج الصف المجمعة من النسبة المتوقعة أكثر من نتائج مجموعة واحدة؟\n• الإجابة النموذجية: لأن زيادة حجم العينة تقلل أثر الصدفة (الخطأ العشوائي).\n\n3. مستوى الاستدلال: إذا كان الكيس يحوي 70 خرزة حمراء ‎(A)‎ و30 بيضاء ‎(a)‎، فما تكرار الأليل ‎a‎؟\n• الإجابة النموذجية: ‎30/100 = 0.3‎.", "1. مستوى المعرفة: ما الفرق بين النسبة المتوقعة والنسبة الملاحظة؟\n• الإجابة النموذجية: المتوقعة تُحسب نظريًا من مخطط الوراثة، والملاحظة تُعدّ فعليًا من النتائج.\n\n2. مستوى التطبيق: اقترح تعديلًا على النموذج لزيادة موثوقية النتائج.\n• الإجابة النموذجية: زيادة عدد مرات السحب وإرجاع الخرزة بعد كل سحب وتكرار التجربة.\n\n3. مستوى الاستدلال: نتائج نسل: 152 سائد و48 متنحٍ. هل تتوافق مع 3:1؟ فسّر.\n• الإجابة النموذجية: المتوقع 150:50 م shed #d8d0bf;line-height:1.9\"><b>1.<\/b> يجري المعلم التجربة السريعة ويناقش الاحتمال، والطلبة يسجلون النتائج ويقارنونها بالتوقع (3 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم تنفيذ الاستقصاء العملي 2-2 «نمذجة تكرار الأليلات» (كتاب التجارب ص 60)، والطلبة يسحبون الخرز عشوائيًا ويسجلون الطرز الجينية ويحسبون النسب (16 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يجمع المعلم نتائج المجموعات في جدول صفي واحد، والطلبة يقارنون النتائج المجمعة بالمتوقعة ويستنتجون أثر حجم العينة (7 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: الاستقصاء العملي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يوجه المعلم حل أسئلة مختارة من 7–22 ثم التقويم الختامي، والطلبة يحلون الأسئلة ويناقشونها (9 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – مربع الفحص قبل الزواج: تكتب المجموعات مخطط وراثة لأبوين حاملين لصفة فقر الدم المنجلي وتحسب النسب، ثم تناقش أهمية الفحص الطبي قبل الزواج للمحافظة على صحة الأسرة العمانية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: حل المشكلات.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يمثل كل كيس من الخرز في النموذج؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أمشاج أحد الأبوين بأليلاته.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تقترب نتائج الصف المجمعة من النسبة المتوقعة أكثر من نتائج مجموعة واحدة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن زيادة حجم العينة تقلل أثر الصدفة (الخطأ العشوائي).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا كان الكيس يحوي 70 خرزة حمراء ‎(A)‎ و30 بيضاء ‎(a)‎، فما تكرار الأليل ‎a‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎30/100 = 0.3‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق بين النسبة المتوقعة والنسبة الملاحظة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المتوقعة تُحسب نظريًا من مخطط الوراثة، والملاحظة تُعدّ فعليًا من النتائج.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اقترح تعديلًا على النموذج لزيادة موثوقية النتائج.<br><span style=\"opacity:.85\">• الإجابة النموذجية: زيادة عدد مرات السحب وإرجاع الخرزة بعد كل سحب وتكرار التجربة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> نتائج نسل: 152 سائد و48 متنحٍ. هل تتوافق مع 3:1؟ فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: المتوقع 150:50 من 200، والملاحظ قريب جدًا، فالنتائج تتوافق مع 3:1 والفرق صغير يُعزى إلى الصدفة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير الاستقصاء 2-2 وإكمال الأسئلة المتبقية من 7–22<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من إنجاز الابن تقرير الاستقصاء ومراجعة مسائل الدرس كاملة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9<\/p>"]}]}, {"title": "الجينات والبروتينات والطراز المظهري", "sb": "ص 71–73", "unit": "الوحدة 2: الوراثة", "periods": [{"axis": "المهق وفقر ا iv class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">دراسة الحالة<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>الجين ‎TYR‎، التايروسينيز، الميلانين، المهق، الجين ‎HBB‎، سلسلة β-جلوبين، الاختصارات الجينية (خط مائل للجين).<\/p>", "<p>يعرض المعلم صورة لشخص مصاب بالمهق ويسأل: «ما البروتين الذي غاب هنا؟ وكيف يؤدي غياب إنزيم إلى لون مختلف للجلد والشعر والعينين؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح السؤال، والطلبة يقترحون علاقة بين الإنزيم والصبغة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم طريقة كتابة الجينات (‎TYR‎ بخط مائل للجين ومستقيم للبروتين) ومسار التايروسين ← الميلانين، والطلبة يرسمون سلسلة: جين ‎TYR ←‎ تايروسينيز ← ميلانين ← لون (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم بطاقتي حالة (المهق، فقر الدم المنجلي) على المجموعات لبناء سلسلة «جين ← بروتين ← طراز مظهري»، والطلبة يكملون السلسلة ويعرضونها (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: دراسة الحالة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الإنزيم الذي يشفره الجين ‎TYR‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: التايروسينيز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون المصاب بالمهق فاتح البشرة والشعر؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لغياب صبغة الميلانين أو نقصها بسبب عدم عمل التايروسينيز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف يُكتب رمز جين التايروسينيز ورمز البروتين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الجين ‎TYR‎ بخط مائل، والبروتين ‎TYR‎ بخط غير مائل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما البروتين الذي يشفره الجين ‎HBB‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: سلسلة β-جلوبين في الهيموجلوبين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب سلسلة من الجين إلى الطراز المظهري للمهق.<br><span style=\"opacity:.85\">• الإجابة النموذجية: أليل طافر للجين ‎TYR ←‎ تايروسينيز غير فعال ← عدم تحويل التايروسين إلى ميلانين ← غياب الصبغة في الجلد والشعر والعينين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يكون المهق صفة متنحية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن أليلًا طبيعيًا واحدًا ينتج كمية كافية من التايروسينيز الفعال لتكوين الميلانين، فلا يظهر المهق إلا في متماثل الأليل الطافر.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 71–72 وكتابة سلسلتي المهق وفقر الدم المنجلي<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع ا ن يشفر بروتينًا ذا وظيفة في تركيب الخلية أو عملياتها (كالإنزيمات وبروتينات النقل).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> قارن بين الإنزيم القابل للحث والإنزيم القابل للتثبيط.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القابل للحث يُنتج عند وجود مادته الأساس، والقابل للتثبيط يتوقف إنتاجه عند ارتفاع تركيز ناتجه النهائي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> بكتيريا تعيش في وسط فيه جلوكوز ولا لاكتوز. توقع حالة إنزيم بيتا-جالاكتوسيديز وفسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا يُنتج تقريبًا لأنه إنزيم قابل للحث يُنتج فقط عند وجود اللاكتوز.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 73–74 وكتابة تعريفات المصطلحات<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن تشبيه يوضح فكرة التحكم في تشغيل الجينات وإيقافها<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=11<\/p>"]}, {"axis": "أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "التحكم في التعبير الجيني"], ["الحصة", "2 من 5"], ["محور الحصة", "أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "ص 74–75"], ["دليل المعلم", "ص 99–102"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-8: التحكم في التعبير الجيني ص 55"]], "t": ["1. يصف تركيب أوبرون ‎Lac‎: الجين المنظم، المحفز، المشغل، الجينات التركيبية ‎lacZ‎ و‎lacY‎ و‎lacA‎ (10 دقائق)\n2. يشرح آلية التحكم في نسخ جينات أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بأثر طفرة في الجين المنظم أو المشغل على إنتاج الإنزيم (15 دقيقة)", "1. فهم: يصف تركيب أوبرون ‎Lac‎: الجين المنظم، المحفز، المشغل، الجينات التركيبية ‎lacZ‎ و‎lacY‎ و‎lacA‎\n2. فهم: يشرح آلية التحكم في نسخ جينات أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده\n3. تقييم (م =\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة الجين المنظم في أوبرون ‎Lac‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يشفر البروتين المثبط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صف ما يحدث لنسخ الجينات التركيبية عند إضافة اللاكتوز.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ينفصل المثبط عن المشغل فيرتبط ‎RNA‎ بوليميريز بالمحفز وينسخ الجينات التركيبية فيُنتج بيتا-جالاكتوسيديز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> طفرة جعلت البروتين المثبط غير قادر على الارتباط بالمشغل. توقع النتيجة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تُنسخ الجينات التركيبية باستمرار حتى في غياب اللاكتوز، فيُهدر الإنزيم والطاقة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 74–75 ورسم مخططي أوبرون ‎Lac‎ في الحالتين<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في شرح المخطط بصوته لتثبيت الخطوات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=11<\/p>"]}, {"axis": "عوامل النسخ في حقيقيات النواة", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "التحكم في التعبير الجيني"], ["الحصة", "3 من 5"], ["محور الحصة", "عوامل النسخ في حقيقيات النواة"], ["الأسبوع والتاريخ", "الأسبوع الثامن (25–29/10/2026)"], ["كتاب الطالب", "ص 75–76"], ["دليل المعلم", "ص 99–102"], ["كتاب التجارب العملية والأنشطة", "نشاط 2-8: التحكم في التعبير الجيني ص 55"]], "t": ["1. يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة (10 دقائق)\n2. يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز (10 دقائق)\nمخرج تعليمي آخر: يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد) (20 دقيقة)", "1. تذكر: يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة\n2. فهم: يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز\n3. تحليل (مخرج آخر): يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد)", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "عامل النسخ، عامل النسخ المنشط، عامل النسخ المثبط، موقع الارتباط، المحفز، التعبير الجيني في حقيقيات النواة.", "يسأل المعلم: «لماذا يسمرّ الجلد بعد التعرض للشمس أيامًا؟ ما الذي يأمر خلايا الجلد بإنتاج صبغة أكثر؟» (نشاط عوامل النسخ والدباغة).", "1. يطرح المعلم سؤال الدباغة ويستقبل الفرضيات، والطلبة يقترحون دورًا لإشارة تشغل الجينات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم عوامل النسخ ونوعيها بالشكل 2-11، والطلبة يرسمون الحالتين ويحددون موقع ارتباط العامل والمحفز (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم سيناريو الدباغة واصطباغ الجلد ويطلب سلسلة: ضوء ← إشارة ← عامل نسخ ← جين الصبغة ← ميلانين، والطلبة يكملون السلسلة في مجموعات ويعرضونها (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما عامل النسخ؟\n• الإجابة النموذجية: بروتين يرتبط بموقع محدد في ‎DNA‎ فيزيد أو يقلل نسخ جين معين.\n\n2. مستوى التطبيق: كيف يزيد عامل النسخ المنشط معدل النسخ؟\n• الإجابة النموذجية: يحفز ارتباط ‎RNA‎ بوليميريز بالمحفز.\n\n3. مستوى الاستدلال: اذكر استجابة يتحكم فيها عامل نسخ.\n• الإجابة النموذجية: الاستجابة للهرمونات مثل التستوستيرون، أو التطور من زيجوت إلى جنين، أو تنظيم نمو الخلايا وموتها.", "1. مستوى المعرفة: كيف يقلل عامل النسخ المثبط التعبير الجيني؟\n• الإجابة النموذجية: بالارتباط بموقعه في ‎DNA‎ ومنع ارتباط ‎RNA‎ بوليميريز بالمحفز.\n\n2. مستوى التطبيق: قارن بين التحكم في التعبير الجيني في بدائيات النواة وحقيقيات النواة.\n• الإجابة النموذجية: في بدائيات النواة بالأوبرونات (مثل ‎Lac‎) ومثبط على المشغل؛ وفي حقيقيات النواة بعوامل نسخ منشطة ومثبطة ترتبط بمواقع في ‎DNA‎.\n\n3. مستوى الاستدلال: لماذا تحتوي خلايا الكبد والعضلات الجينات نفسها لكنها تنتج بروتينات مختلفة؟\n• الإجابة النموذجية: لأن عوامل نسخ مختلفة نشطة في كل نوع خلايا فتُشغَّل جينات مختلفة.", "إرشاد للطالب: مراجعة ص 75–76 وكتابة سلسلة الدباغة\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية الوقاية من أشعة الشمس الطويلة رغم أن الدباغة استجابة دفاعية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=11"], "h": ["<ol class=\"ol\"><li>يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة (10 دقائق)<\/li><li>يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد) (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد)<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>عامل النسخ، عامل النسخ المنشط، عامل النسخ المثبط، موقع الارتباط، المحف d\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة ترانسكريبتيز العكسي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: بناء شريط ‎DNA‎ متمم ‎(cDNA)‎ باستخدام ‎mRNA‎ قالبًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُنقل المحفز مع الجين المطلوب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎RNA‎ بوليميريز يحتاج إلى الارتباط بالمحفز لنسخ الجين في الخلية المستقبلة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كيف يساعد جين ‎GFP‎ في تحديد الخلايا المعدلة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الخلايا التي أخذت الجين المطلوب مع جين ‎GFP‎ تتوهج باللون الأخضر تحت الأشعة فوق البنفسجية فيسهل تمييزها.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما ‎cDNA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎DNA‎ متمم يُبنى من ‎mRNA‎ ولا يحتوي إنترونات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُعد ‎cDNA‎ مناسبًا للتعبير في البكتيريا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه خالٍ من الإنترونات، والبكتيريا لا تستطيع إزالة الإنترونات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح سببًا لاستخدام العلامات المتوهجة بدلًا من جينات مقاومة المضادات الحيوية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتجنب خطر انتقال جينات مقاومة المضادات الحيوية إلى بكتيريا ممرضة، ولسهولة رؤية الخلايا المعدلة مباشرة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 3-1 ص 67 ومراجعة ص 88–95<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من فهم الابن الفرق بين ‎cDNA‎ والجين الأصلي في ‎DNA‎<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=13<\/p>"]}]}, {"title": "فصل وتضخيم ‎DNA‎", "sb": "ص 96–100", "unit": "الوحدة 3: التقنية الجينية", "periods": [{"axis": "تفاعل البوليميريز المتسلسل ‎(PCR)‎", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: التقنية الجينية"], ["الدرس", "فصل وتضخيم ‎DNA‎"], ["الحصة", "1 من 2"], ["محور الحصة", "تفاعل البوليميريز المتسلسل ‎(PCR)‎"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "ص 96–98"], ["دليل المعلم", "ص 138–141"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: استخدام الفصل الكهربائي الهلامي (إثرائي) ص 68"]], "t": ["1. يصف مراحل تفاعل البوليميريز المتسلسل: التمسخ، والالتصاق، والاستطالة ودرجات حرارتها (5 دقائق)\n2. يشرح دور إنزيم ‎Taq‎ بوليميريز والبادئات في تضخيم ‎DNA‎ (15 دقيقة)\nمخرج تعليمي آخر: يحسب عدد نسخ ‎DNA‎ الناتجة بعد عدد معين من دورات ‎PCR‎ (20 دقيقة)", "1. فهم: يصف مراحل تفاعل البوليميريز المتسلسل: التمسخ، والالتصاق، والاستطالة ودرجات حرارتها\n2. فهم: يشرح دور إنزيم ‎Taq‎ بوليميريز والبادئات في تضخيم ‎DNA‎\n3. تطبيق (مخرج آخر): يحسب عدد نسخ ‎DNA‎ الناتجة بعد عدد معين من دورات ‎PCR‎", "- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم في السياق", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "تفاعل البوليميريز المتسلسل ‎(PCR)‎، التمسخ، الالتصاق، الاستطالة، البادئات، ‎Taq‎ بوليميريز، المدوِّر الحراري، التضخيم.", "يعرض المعلم صورة باحثة عمانية في المديرية العامة للبحوث الزراعية والحيوانية تحمّل جهاز ‎PCR‎ ويسأل: «من شعرة واحدة في مسرح جريمة لا يكفي ‎DNA‎ للتحليل؛ كيف نحصل على مليارات النسخ؟» (نشاط ‎PCR‎ في السياق).", "1. يعرض المعلم الصورة ويطرح المشكلة، والطلبة يقترحون نسخ ‎DNA‎ مرات كثيرة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل الثلاث ودرجات الحرارة ودور البادئات و‎Taq‎ بوليميريز، وال ine-height:1.9\"><b>1. فهم:<\/b> يصف مراحل تفاعل البوليميريز المتسلسل: التمسخ، والالتصاق، والاستطالة ودرجات حرارتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح دور إنزيم ‎Taq‎ بوليميريز والبادئات في تضخيم ‎DNA‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب عدد نسخ ‎DNA‎ الناتجة بعد عدد معين من دورات ‎PCR‎<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم في السياق<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">صورة توضيحية<\/span><\/div>", "<p>تفاعل البوليميريز المتسلسل ‎(PCR)‎، التمسخ، الالتصاق، الاستطالة، البادئات، ‎Taq‎ بوليميريز، المدوِّر الحراري، التضخيم.<\/p>", "<p>يعرض المعلم صورة باحثة عمانية في المديرية العامة للبحوث الزراعية والحيوانية تحمّل جهاز ‎PCR‎ ويسأل: «من شعرة واحدة في مسرح جريمة لا يكفي ‎DNA‎ للتحليل؛ كيف نحصل على مليارات النسخ؟» (نشاط ‎PCR‎ في السياق).<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الصورة ويطرح المشكلة، والطلبة يقترحون نسخ ‎DNA‎ مرات كثيرة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم المراحل الثلاث ودرجات الحرارة ودور البادئات و‎Taq‎ بوليميريز، والطلبة يرسمون دورة ‎PCR‎ ويكتبون درجة حرارة كل مرحلة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدم المعلم مسائل حساب النسخ (2ⁿ) وسيناريوهات تطبيقية (طب شرعي، تشخيص)، والطلبة يحسبون النسخ ويربطون ‎PCR‎ بالتطبيقات (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم في السياق.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ماذا يحدث في مرحلة التمسخ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تسخين ‎DNA‎ إلى نحو ‎95°C‎ فتنكسر الروابط الهيدروجينية وينفصل الشريطان.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يُستخدم ‎Taq‎ بوليميريز تحديدًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه مأخوذ من بكتيريا تعيش في الينابيع الحارة فيتحمل درجات الحرارة المرتفعة دون أن يتمسخ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم نسخة من ‎DNA‎ تنتج من جزيء واحد بعد 10 دورات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎2¹⁰ = 1024‎ نسخة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة البادئات في ‎PCR‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتزاوج مع أطراف الجزء المراد تضخيمه لتوفر نقطة بدء يبني منها البوليميريز الشريط الجديد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> رتب مراحل الدورة وفق درجات حرارتها.<br><span style=\"opacity:.85\">• الإجابة النموذجية: التمسخ ‎(≈95°C) ←‎ الالتصاق (أقل، نحو ‎55–65°C) ←‎ الاستطالة ‎(≈72°C)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تتطلب كل دورة خفض الحرارة ثم رفعها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الخفض يسمح للبادئات بالالتصاق بالأشرطة المفردة، والرفع إلى ‎72°C‎ هو الأنسب لعمل ‎Taq‎ بوليميريز في بناء الأشرطة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 96–98 وحل السؤال 8<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن الحديث مع الابن عن استخدام ‎PCR‎ في تشخيص الأمراض والطب الشرعي<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=14<\/p>"]}, {"axis": "الفصل الكهربائي الهلامي وتطبيقاته", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: التقنية الجينية"], ["الدرس", "فصل وتضخيم ‎DNA‎"], ["الحصة", "2 من 2"], ["محور الحصة", "الفصل الكهربائي الهلامي وتطبيقاته"], ["الأسبوع والتاريخ", "الأسبوع التاسع (1–5/11/2026)"], ["كتاب الطالب", "ص 98–100 + كتاب التجارب ص 68"], ["دليل المعلم", "ص 138–141"], ["كتاب التجارب العملية والأنشطة", "نشاط 3-2: استخدام الفصل الكهربائي الهلامي (إثرائي) ص 68"]], "t": ["1. يصف كيفية استخدام الفصل الكهربائي الهلامي لفصل قطع ‎DNA‎ مختلفة الطول (15 دقيقة)\n2. يفسر اتجاه حركة قطع ‎DNA‎ نحو القطب الموجب وسرعتها وفق حجمها (10 دقائق)\nمخرج تعليمي آخر: يحلل نتائج هلام لتحديد تطابق عينات ‎DNA (‎البصمة الوراثية) (15 دقيقة)", "1. فهم: يصف كيفية استخدام الفصل الكهربائي الهلامي لفصل قطع ‎DNA‎ مختلفة الطول\n2. تحليل: يفسر اتجاه حركة قطع ‎DNA‎ نحو القطب الموجب وسرعتها وفق حجمها\n3. تحليل (مخرج آخر): يحلل نتائج هلام لتحديد تطابق عينات ‎DNA (‎البصمة الوراثية)", "- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة، صور نتائج فصل هلامي", "الفصل الكهربائي الهلامي، الهلام (جل الأجاروز)، القطب الموجب، الشحنة السالبة لـ ‎DNA‎، الحزم، المسلم (السلم) المرجعي، البصمة الوراثية.", "يعرض المعلم صورة هلام فيه حز \"><b>3. تقييم (مخرج آخر):<\/b> يبرر استخدام خلايا الهامستر لإنتاج العامل الثامن بدلًا من البكتيريا<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">صورة توضيحية<\/span><\/div>", "<p>البروتين المعاد تركيبه، الإنسولين البشري، العامل الثامن، الهيموفيليا، خلايا الهامستر، أجهزة التخمير، العدوى المنقولة بالدم.<\/p>", "<p>يسأل المعلم: «قبل ثمانينيات القرن الماضي كان مريض الهيموفيليا يتلقى العامل الثامن من دم المتبرعين؛ ما الخطر الذي كان يواجهه؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويستقبل الإجابات، والطلبة يذكرون خطر العدوى مثل ‎HIV‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم إنتاج الإنسولين المعاد التركيب بالبكتيريا والعامل الثامن بخلايا الهامستر في أجهزة التخمير (نشاط تقنيات ‎DNA‎ معاد التركيب في الطب)، والطلبة يكملون جدولًا: البروتين، الخلية المنتجة، المصدر القديم، المزايا (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يدير نقاشًا موجهًا: «لماذا تُستخدم خلايا ثدييات لبعض البروتينات؟»، والطلبة يناقشون في مجموعات ويقدمون مبررات (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الخلايا المستخدمة لإنتاج العامل الثامن المعاد التركيب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: خلايا الكلية والمبيض في الهامستر.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر ميزتين للإنسولين المعاد التركيب.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مطابق للإنسولين البشري فيقل خطر الحساسية، ويُنتج بكميات كبيرة وبتكلفة أقل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يُعد العامل الثامن المعاد التركيب أكثر أمانًا من المستخلص من الدم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه خالٍ من مخاطر العدوى المنقولة بالدم مثل فيروس نقص المناعة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المرض الذي يعالج بالعامل الثامن؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الهيموفيليا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> من أين كان يُستخلص الإنسولين قبل التقنية الجينية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: من بنكرياس الأبقار والخنازير.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح سببًا لإنتاج بعض البروتينات البشرية في خلايا ثدييات لا بكتيريا.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن خلايا الثدييات تجري تعديلات بعد الترجمة (كإضافة سكريات) لا تجريها البكتيريا، فيكون البروتين الناتج أقرب للبشري وفعالًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 101–102 وإكمال جدول المقارنة<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن أثر التقنية الجينية في تحسين حياة مرضى السكري والهيموفيليا<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=15<\/p>"]}, {"axis": "نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎ والفحص الجيني", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: التقنية الجينية"], ["الدرس", "التقنية الجينية والطب"], ["الحصة", "2 من 3"], ["محور الحصة", "نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎ والفحص الجيني"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 102–104"], ["دليل المعلم", "ص 142–144"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎ (15 دقيقة)\n2. يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض (5 دقائق)\nمخرج تعليمي آخر: يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه (20 دقيقة)", "1. فهم: يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎\n2. فهم: يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض\n3. تقييم (مخرج آخر): يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه", "- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- المناقشة الصفية", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل الاجتماعية", "نقص المناعة المشترك الشديد ‎(SCID)‎، الجين ‎ADA‎، إنزيم أدينوسين دي أمينيز، الفحص الجيني، الحامل للأليل، القضايا الأخلاقية.", "يقدم المعلم قصة «طفل الفقاعة» الذي عاش في بيئة معقمة بسبب نقص المناعة، ويسأل: «كيف يمكن لإنزيم واحد أن يحرم الجسم من مناعته؟»", "1. يعرض المعلم القصة ويطرح السؤال، والطلبة يربطون الإنزيم بالخلايا المناعية (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. يشرح المعلم طفرة جين ‎ADA‎ على الكروموسوم 20 وأثرها، وطرق العلاج بالإنزيم المعاد التركيب، ثم الفحص الجيني، والطلبة يلخصون في مخطط: طفرة ← نقص إنزيم ← تراكم مواد سامة ← موت الخلايا اللمفية (12 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. يدير المعلم مناقشة صفية حول حالة افتراضية لفحص جيني (حق المعرفة، الخصوصية، القرارات)، والطلبة يناقشون في مجموعات ويقدمون آراء مبررة (15 دقيقة)\nالاستراتيجيات: المناقشة الصفية.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "تفريد التعليم:\n1. مستوى المعرفة: على أي كروموسوم يقع جين ‎ADA‎؟\n• الإجابة النموذجية: الكروموسوم 20.\n\n2. مستوى التطبيق: ما أثر نقص إنزيم ‎ADA‎ على الجهاز المناعي؟\n• الإجابة النموذجية: تتراكم مواد سامة للخلايا اللمفية فتموت ويضعف الجهاز المناعي بشدة.\n\n3. مستوى الاستدلال: ما الفحص الجيني؟\n• الإجابة النموذجية: تحليل ‎DNA‎ الفرد للكشف عن وجود أليلات مرتبطة بأمراض وراثية.", "1. مستوى المعرفة: اذكر فائدة للفحص الجيني للأزواج قبل الإنجاب.\n• الإجابة النموذجية: معرفة إن كانا حاملين لأليل متنحٍ لمرض وراثي، وحساب احتمال إصابة أبنائهما.\n\n2. مستوى التطبيق: لماذا لا يُعد علاج المصاب بإعطائه الإنزيم المعاد التركيب شفاء دائمًا؟\n• الإجابة النموذجية: لأن الجين الطافر يبقى في خلاياه، فيحتاج إلى جرعات منتظمة طوال حياته.\n\n3. مستوى الاستدلال: ناقش قضية أخلاقية واحدة يثيرها الفحص الجيني مع رأي مبرر.\n• الإجابة النموذجية: مثال: خصوصية النتائج؛ يجب ألا تُستخدم نتائج الفحص ضد الفرد في العمل أو التأمين، لأنها معلومات صحية شخصية لا اختيار له فيها.", "إرشاد للطالب: مراجعة ص 102–104 وكتابة رأي مبرر في قضية أخلاقية\nإرشاد لولي الأمر: مناقشة الابن في أهمية الفحص الطبي قبل الزواج المعمول به في سلطنة عمان\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=15"], "h": ["<ol class=\"ol\"><li>يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎ (15 دقيقة)<\/li><li>يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التشاركي<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">المناقشة الصفية<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">الوسائل الاجتماعية<\/span><\/div>", "<p>نقص المناعة المشترك الشديد ‎(SCID)‎، الجين ‎ADA‎، إنزيم أدينوسين دي أمينيز، الفحص الجيني، الحامل للأليل، القضايا الأخلاقية.<\/p>", "<p>يقدم المعلم قصة «طفل الفقاعة» الذي عاش في بيئة معقمة بسبب نقص المناعة، ويسأل: «كيف يمكن لإنزيم واحد أن يحرم الجسم من مناعته؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم القصة ويطرح السؤال، والطلبة يربطون الإنزيم بالخلايا المناعية (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم طفرة جين ‎ADA‎ على الكروموسوم 20 وأثرها، وطرق العلاج بالإنزيم المعاد التركيب، ثم الفحص الجيني، والطلبة يلخصون في مخطط: طفرة ← نقص إنزيم ← تراكم مواد سامة ← موت الخلايا اللمفية (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يدير المعلم مناقشة صفية حول حالة افتراضية لفحص جيني (حق المعرفة، الخصوصية، القرارات)، والطلبة يناقشون في مجموعات ويقدمون آراء مبررة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: المناقشة الصفية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التشاركي.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> على أي كروموسوم يقع جين ‎ADA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الكروموسوم 20.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما أثر نقص إنزيم ‎ADA‎ على الجهاز المناعي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتراكم مواد سامة للخلايا اللمفية فتموت ويضعف الجهاز المناعي بشدة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الفحص الجيني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تحليل ‎DNA‎ الفرد للكشف عن وجود أليلات مرتبطة بأمراض وراثية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر فائدة للفحص الجيني للأزواج قبل الإنجاب.<br><span style=\"opacity:.85\">• الإجابة النموذجية: معرفة إن كانا حاملين لأليل متنحٍ لمرض وراثي، وحساب احتمال إصابة أبنائهما.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا يُعد علاج المصاب بإعطائه الإنزيم المعاد التركيب شفاء دائمًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الجين الطافر يبقى في خلاياه، فيحتاج إلى جرعات منتظمة طوال حياته.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ناقش قضية أخلاقية واحدة يثيرها الفحص الجيني مع رأي مبرر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مثال: خصوصية النتائج؛ يجب ألا تُستخدم نتائج الفحص ضد الفرد في العمل أو التأمين، لأنها معلومات صحية شخصية لا اختيار له فيها.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 102–104 وكتابة رأي مبرر في قضية أخلاقية<\/p><p><b>إرشاد لولي الأمر:<\/b> مناقشة الابن في أهمية الفحص الطبي قبل الزواج المعمول به في سلطنة عمان<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=15<\/p>"]}, {"axis": "الفحص الجنيني غير الجراحي وإنتاج ملصق توعوي", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: التقنية الجينية"], ["الدرس", "التقنية الجينية والطب"], ["الحصة", "3 من 3"], ["محور الحصة", "الفحص الجنيني غير الجراحي وإنتاج ملصق توعوي"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 104–106"], ["دليل المعلم", "ص 142–144"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يصف الفحص الجنيني غير الجراحي قبل الولادة ويقارنه بفحص السائل الأمنيوسي وعينة الخملات المشيمية (15 دقيقة)\n2. يصمم ملصقًا توعويًا عن تطبيق طبي للتقنية الجينية (15 دقيقة)\nمخرج تعليمي آخر: يحل السؤالين 11 و12 في كتاب الطالب (10 دقائق)", "1. فهم: يصف الفحص الجنيني غير الجراحي قبل الولادة ويقارنه بفحص السائل الأمنيوسي وعينة الخملات المشيمية\n2. إبداع: يصمم ملصقًا توعويًا عن تطبيق طبي للتقنية الجينية\n3. تطبيق (مخرج آخر): يحل السؤالين 11 و12 في كتاب الطالب", "- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أوراق ملصقات وأقلام ملونة", "الفحص الجنيني غير الجراحي، ‎DNA‎ الجنين في دم الأم، فحص السائل الأمنيوسي، عينة الخملات المشيمية، متلازمة داون، التليف الكيسي.", "يسأل المعلم: «كيف يمكن فحص جينات جنين دون إدخال إبرة إلى الرحم؟» ثم يلمح إلى أن أجزاء من ‎DNA‎ المشيمة تصل إلى دم الأم.", "1. يطرح المعلم السؤال ويستقبل الأفكار، و \"><b>1. مستوى المعرفة:<\/b> ما المقصود بعينة الخملات المشيمية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أخذ عينة من نسيج المشيمة لتحليل ‎DNA‎ الجنين، وهو فحص جراحي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر نوعين من الاختلالات يكشفها تحليل ‎DNA‎ الجنين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تغير عدد الكروموسومات (متلازمة داون)، وطفرات الجين المفرد (التليف الكيسي).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم ملصق زميلك وفق معيارين: الدقة العلمية والوضوح.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تقييم يتضمن ملاحظة على صحة المعلومة واستخدام المصطلح، وملاحظة على تنظيم العرض ووضوح الرسالة مع اقتراح تحسين.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال الملصق التوعوي وحل السؤالين 11 و12 ومراجعة ص 101–106<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن للأسرة مناقشة الملصق مع الابن وتشجيعه على عرضه في الإذاعة المدرسية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=15<\/p>"]}]}, {"title": "التقنية الجينية والزراعة", "sb": "ص 107–121", "unit": "الوحدة 3: التقنية الجينية", "periods": [{"axis": "المحاصيل المقاومة لمبيدات الأعشاب والآفات الحشرية ‎(Bt)‎", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 3: التقنية الجينية"], ["الدرس", "التقنية الجينية والزراعة"], ["الحصة", "1 من 2"], ["محور الحصة", "المحاصيل المقاومة لمبيدات الأعشاب والآفات الحشرية ‎(Bt)‎"], ["الأسبوع والتاريخ", "الأسبوع العاشر (8–12/11/2026)"], ["كتاب الطالب", "ص 107–109"], ["دليل المعلم", "ص 145–147"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يشرح كيف تساعد الهندسة الجينية في حل مشكلة الطلب العالمي على الغذاء بتحسين جودة المحاصيل وإنتاجيتها (10 دقائق)\n2. يصف المحاصيل المقاومة لمبيدات الأعشاب والمحاصيل المقاومة للحشرات ‎(Bt)‎ ومزاياها (10 دقائق)\nمخرج تعليمي آخر: يلخص المخاطر المحتملة ل  التربة.\n\n2. مستوى التطبيق: اشرح مزايا زراعة أصناف ‎Bt‎.\n• الإجابة النموذجية: تقتل الآفات الحشرية التي تتغذى عليها فتقل الخسائر ويقل رش المبيدات الحشرية وتكلفته.\n\n3. مستوى الاستدلال: اقترح خطوتين للحد من مخاطر المحاصيل المعدلة جينيًا.\n• الإجابة النموذجية: زراعة مناطق عازلة من محاصيل غير معدلة لتأخير ظهور المقاومة، ووضع تشريعات ورقابة على زراعتها وتداولها.", "إرشاد للطالب: مراجعة ص 107–109 وحل السؤالين 13 و14\nإرشاد لولي الأمر: الحديث مع الابن عن تنظيم سلطنة عمان لتداول المبيدات وأهمية الزراعة الآمنة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=16"], "h": ["<ol class=\"ol\"><li>يشرح كيف تساعد الهندسة الجينية في حل مشكلة الطلب العالمي على الغذاء بتحسين جودة المحاصيل وإنتاجيتها (10 دقائق)<\/li><li>يصف المحاصيل المقاومة لمبيدات الأعشاب والمحاصيل المقاومة للحشرات ‎(Bt)‎ ومزاياها (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يلخص المخاطر المحتملة لزراعة المحاصيل المعدلة جينيًا ويقترح طرقًا للحد منها (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح كيف تساعد الهندسة الجينية في حل مشكلة الطلب العالمي على الغذاء بتحسين جودة المحاصيل وإنتاجيتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يصف المحاصيل المقاومة لمبيدات الأعشاب والمحاصيل المقاومة للحشرات ‎(Bt)‎ ومزاياها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يلخص المخاطر المحتملة لزراعة المحاصيل المعدلة جينيًا ويقترح طرقًا للحد منها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التشاركي<\/span><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">المناقشة الصفية<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span>
