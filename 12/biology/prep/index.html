لم التقويم الختامي، والطلبة يجيبون فرديًا ويصححون مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: أين تحدث الترجمة؟\n• الإجابة النموذجية: على الرايبوسومات في السيتوبلازم.\n\n2. مستوى التطبيق: ما الكودون المضاد للكودون ‎AUG‎؟\n• الإجابة النموذجية: ‎UAC‎.\n\n3. مستوى الاستدلال: ما الرابطة التي تتكون بين حمضين أمينيين متجاورين؟\n• الإجابة النموذجية: رابطة ببتيدية.", "1. مستوى المعرفة: ما وظيفة ‎tRNA‎؟\n• الإجابة النموذجية: نقل حمض أميني معين إلى الرايبوسوم ومطابقة كودونه المضاد مع الكودون على ‎mRNA‎.\n\n2. مستوى التطبيق: لماذا يجب أن يكون الكودون المضاد متممًا للكودون؟\n• الإجابة النموذجية: لضمان إضافة الحمض الأميني الصحيح الذي يشفره الكودون، فيتكون التتابع الصحيح لعديد الببتيد.\n\n3. مستوى الاستدلال: ‎mRNA‎ فيه: ‎AUG-GCU-UGG-UAA‎. اكتب الكودونات المضادة لأول ثلاثة كودونات وفسّر سبب عدم وجود ‎tRNA‎ للأخير.\n• الإجابة النموذجية: ‎UAC‎، ‎CGA‎، ‎ACC‎؛ الأخير شيفرة إيقاف لا يقابلها ‎tRNA‎ فتتوقف الترجمة.", "إرشاد للطالب: مراجعة ص 31–33 ورسم مخطط للترجمة يتضمن الرايبوسوم و‎tRNA‎\nإرشاد لولي الأمر: سؤال الابن: «ما الفرق بين الكودون والكودون المضاد؟»\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4"], "h": ["<ol class=\"ol\"><li>يصف عملية الترجمة على الرايبوسوم وتكوين الروابط الببتيدية (15 دقيقة)<\/li><li>يشرح دور ‎tRNA‎ والكودون المضاد في نقل الحمض الأميني المناسب (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الكودون المضاد المقابل لكودون معطى (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف عملية الترجمة على الرايبوسوم وتكوين الروابط الببتيدية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح دور ‎tRNA‎ والكودون المضاد في نقل الحمض الأميني المناسب<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحدد الكودون المضاد المقابل لكودون معطى<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>الترجمة، الرايبوسوم، الكودون، الكودون المضاد، ‎tRNA‎، الحمض الأميني، الرابطة الببتيدية، عديد الببتيد.<\/p>", "<p>يسأل المعلم: «لدينا رسالة بلغة القواعد في ‎mRNA‎، ونحتاج إلى بناء جملة بلغة الأحماض الأمينية؛ من المترجم؟» ويعرض صورة رايبوسوم.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم سؤال المترجم ويعرض صورة الرايبوسوم، والطلبة يقترحون جزيئات تقوم بدور المترجم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح خطوات الترجمة: ارتباط ‎mRNA‎ بالرايبوسوم، ودخول ‎tRNA‎ بكودون مضاد متمم، وتكوين الرابطة الببتيدية، والانتقال، والإيقاف، والطلبة يرتبون بطاقات خطوات الترجمة ترتيبًا صحيحًا (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يعرض المعلم مقطع محاكاة للترجمة ويوقفه عند كل خطوة للسؤال، والطلبة يصفون ما يحدث عند كل توقف ويحددون الكودون والكودون المضاد (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا ويصححون مع زملائهم (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين تحدث الترجمة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على الرايبوسومات في السيتوبلازم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الكودون المضاد للكودون ‎AUG‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎UAC‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما الرابطة التي تتكون بين حمضين أمينيين متجاورين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: رابطة ببتيدية.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما وظيفة ‎tRNA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: نقل حمض أميني معين إلى الرايبوسوم ومطابقة كودونه المضاد مع الكودون على ‎mRNA‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يجب أن يكون الكودون المضاد متممًا للكودون؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لضمان إضافة الحمض الأميني الصحيح الذي يشفره الكودون، فيتكون التتابع الصحيح لعديد الببتيد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ‎mRNA‎ فيه: ‎AUG-GCU-UGG-UAA‎. اكتب الكودونات المضادة لأول ثلاثة كودونات وفسّر سبب عدم وجود ‎tRNA‎ للأخير.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎UAC‎، ‎CGA‎، ‎ACC‎؛ الأخير شيفرة إيقاف لا يقابلها ‎tRNA‎ فتتوقف الترجمة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 31–33 ورسم مخطط للترجمة يتضمن الرايبوسوم و‎tRNA‎<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن: «ما الفرق بين الكودون والكودون المضاد؟»<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4<\/p>"]}, {"axis": "من الجين إلى عديد الببتيد: لعب أدوار بناء البروتين", "n": 4, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "بناء البروتين"], ["الحصة", "4 من 5"], ["محور الحصة", "من الجين إلى عديد الببتيد: لعب أدوار بناء البروتين"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "ص 29–33"], ["دليل المعلم", "ص 57–61"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح (20 دقيقة)\n2. يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم (10 دقائق)\nمخرج تعليمي آخر: يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد (10 دقائق)", "1. تطبيق: يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح\n2. فهم: يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم\n3. إبداع (مخرج آخر): يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد", "- التعلم المبني على اللعب\n- التعلم التعاوني\n- لعب الأدوار", "- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات أدوار وأسماء جزيئات وحبال ملونة", "بناء البروتين، النسخ، الترجمة، الثقب النووي، الجين، عديد الببتيد، التسلسل الزمني.", "يوزع المعلم بطاقات أدوار مقلوبة ويقول: «كل واحد منكم جزيء في الخلية؛ مهمتنا اليوم أن نصنع بروتينًا دون خطأ واحد».", "1. يوزع المعلم البطاقات ويشرح قواعد النشاط، والطلبة يتعرفون أدوارهم ويحددون مواقعهم (نواة، سيتوبلازم، رايبوسوم) (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. يدير المعلم لعب أدوار بناء البروتين (نشاط دليل المعلم) ويتوقف عند كل مرحلة للسؤال، والطلبة يمثلون النسخ وخروج ‎mRNA‎ والترجمة ويعلق «المراقبون» على الأخطاء (18 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يكلف المجموعات بإنشاء جدول زمني لبناء البروتين، والطلبة يرتبون الأحداث زمنيًا ويكتبون موقع كل حدث (10 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n4. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «قيّم: «الرايبوسوم يقرأ ‎DNA‎ مباشرة»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم:\n1. مستوى المعرفة: رتب: الترجمة، النسخ، خروج ‎mRNA‎ من النواة.\n• الإجابة النموذجية: النسخ، ثم خروج ‎mRNA‎ من النواة، ثم الترجمة.\n\n2. مستوى التطبيق: ما الجزيء الذي يحمل الرسالة من النواة إلى الرايبوسوم؟\n• الإجابة النموذجية: ‎mRNA‎.\n\n3. مستوى الاستدلال: لو تعطل خروج ‎mRNA‎ عبر الثقوب النووية، فأي مرحلة تتوقف؟\n• الإجابة النموذجية: الترجمة، لأن ‎mRNA‎ لن يصل إلى الرايبوسومات.", "1. مستوى المعرفة: اذكر مرحلتي بناء البروتين وموقع كل منهما.\n• الإجابة النموذجية: النسخ في النواة، والترجمة على الرايبوسومات في السيتوبلازم.\n\n2. مستوى التطبيق: ارسم مخططًا انسيابيًا مبسطًا لبناء البروتين يتضمن: نواة، ثقب نووي، ‎DNA‎، ‎mRNA‎، نسخ، ترجمة، رايبوسوم، ‎tRNA‎، حمض أميني، عديد ببتيد.\n• الإجابة النموذجية: مخطط صحيح التسلسل: ‎DNA‎ في النواة ← نسخ ← ‎mRNA ←‎ ثقب نووي ← رايبوسوم ← ‎tRNA‎ يحمل حمضًا أمينيًا ← ترجمة ← عديد ببتيد.\n\n3. مستوى الاستدلال: قيّم: «الرايبوسوم يقرأ ‎DNA‎ مباشرة».\n• الإجابة النموذجية: غير صحيحة؛ الرايبوسوم يقرأ ‎mRNA‎ المنسوخ من ‎DNA‎، أما ‎DNA‎ فيبقى في النواة.", "إرشاد للطالب: كتابة الجدول الزمني لبناء البروتين بشكل نهائي ومراجعة ص 29–33\nإرشاد لولي الأمر: تشجيع الابن على شرح بناء البروتين بتشبيه من الحياة اليومية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4"], "h": ["<ol class=\"ol\"><li>يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح (20 دقيقة)<\/li><li>يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يمثل مراحل بناء البروتين من النسخ إلى الترجمة في تسلسل صحيح<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يحدد دور كل جزيء في بناء البروتين: ‎DNA‎، ‎RNA‎ بوليميريز، ‎mRNA‎، ‎tRNA‎، الرايبوسوم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. إبداع (مخرج آخر):<\/b> يبني مخططًا انسيابيًا متكاملًا لبناء البروتين من الجين حتى عديد الببتيد<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">لعب الأدوار<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: بطاقات أدوار وأسماء جزيئات وحبال ملونة<\/span><\/div>", "<p>بناء البروتين، النسخ، الترجمة، الثقب النووي، الجين، عديد الببتيد، التسلسل الزمني.<\/p>", "<p>يوزع المعلم بطاقات أدوار مقلوبة ويقول: «كل واحد منكم جزيء في الخلية؛ مهمتنا اليوم أن نصنع بروتينًا دون خطأ واحد».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يوزع المعلم البطاقات ويشرح قواعد النشاط، والطلبة يتعرفون أدوارهم ويحددون مواقعهم (نواة، سيتوبلازم، رايبوسوم) (4 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يدير المعلم لعب أدوار بناء البروتين (نشاط دليل المعلم) ويتوقف عند كل مرحلة للسؤال، والطلبة يمثلون النسخ وخروج ‎mRNA‎ والترجمة ويعلق «المراقبون» على الأخطاء (18 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلف المجموعات بإنشاء جدول زمني لبناء البروتين، والطلبة يرتبون الأحداث زمنيًا ويكتبون موقع كل حدث (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: لعب الأدوار.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «قيّم: «الرايبوسوم يقرأ ‎DNA‎ مباشرة»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> رتب: الترجمة، النسخ، خروج ‎mRNA‎ من النواة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: النسخ، ثم خروج ‎mRNA‎ من النواة، ثم الترجمة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الجزيء الذي يحمل الرسالة من النواة إلى الرايبوسوم؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎mRNA‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لو تعطل خروج ‎mRNA‎ عبر الثقوب النووية، فأي مرحلة تتوقف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الترجمة، لأن ‎mRNA‎ لن يصل إلى الرايبوسومات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر مرحلتي بناء البروتين وموقع كل منهما.<br><span style=\"opacity:.85\">• الإجابة النموذجية: النسخ في النواة، والترجمة على الرايبوسومات في السيتوبلازم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ارسم مخططًا انسيابيًا مبسطًا لبناء البروتين يتضمن: نواة، ثقب نووي، ‎DNA‎، ‎mRNA‎، نسخ، ترجمة، رايبوسوم، ‎tRNA‎، حمض أميني، عديد ببتيد.<br><span style=\"opacity:.85\">• الإجابة النموذجية: مخطط صحيح التسلسل: ‎DNA‎ في النواة ← نسخ ← ‎mRNA ←‎ ثقب نووي ← رايبوسوم ← ‎tRNA‎ يحمل حمضًا أمينيًا ← ترجمة ← عديد ببتيد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم: «الرايبوسوم يقرأ ‎DNA‎ مباشرة».<br><span style=\"opacity:.85\">• الإجابة النموذجية: غير صحيحة؛ الرايبوسوم يقرأ ‎mRNA‎ المنسوخ من ‎DNA‎، أما ‎DNA‎ فيبقى في النواة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة الجدول الزمني لبناء البروتين بشكل نهائي ومراجعة ص 29–33<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على شرح بناء البروتين بتشبيه من الحياة اليومية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4<\/p>"]}, {"axis": "مسائل تطبيقية في بناء البروتين وحل السؤال 8", "n": 5, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "بناء البروتين"], ["الحصة", "5 من 5"], ["محور الحصة", "مسائل تطبيقية في بناء البروتين وحل السؤال 8"], ["الأسبوع والتاريخ", "الأسبوع الثالث (20–24/9/2026)"], ["كتاب الطالب", "ص 32–33"], ["دليل المعلم", "ص 57–61"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين (20 دقيقة)\n2. يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل (5 دقائق)\nمخرج تعليمي آخر: يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج (15 دقيقة)", "1. تطبيق: يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين\n2. تطبيق: يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل\n3. تحليل (مخرج آخر): يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: جدول الشيفرة الجينية (الملحق 2)", "النسبة بين القواعد والكودونات والأحماض الأمينية، الملحق 2، الترجمة العكسية، تتابع الأحماض الأمينية.", "يطرح المعلم لغزًا: «بروتين من 150 حمضًا أمينيًا؛ كم قاعدة على الأقل في ‎mRNA‎ الناضج الذي يشفره؟» ويمنح دقيقتين للتفكير.", "1. يطرح المعلم اللغز ويستقبل الحلول، والطلبة يحسبون ويشرحون: ‎150 × 3 + 3‎ لشيفرة الإيقاف = 453 (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يحل مثالًا متدرجًا: من شريط القالب إلى ‎mRNA‎ إلى ‎tRNA‎ إلى أحماض أمينية باستخدام الملحق 2، والطلبة يتابعون الحل ويكملون الجداول (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم حل السؤال 8 ومسائل إضافية في مجموعات، والطلبة يحلون المسائل ويعرضون الحلول على السبورة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – ورشة السفن في صور: يمثل الطلبة بناء البروتين كورشة لصناعة السفن في صور: مخطط منسوخ كـmRNA، وعمال يحضرون الألواح كـtRNA، وقاعدة تجميع كالريبوسوم (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم:\n1. مستوى المعرفة: كم كودونًا في ‎mRNA‎ يشفر 50 حمضًا أمينيًا مع شيفرة إيقاف؟\n• الإجابة النموذجية: 51 كودونًا.\n\n2. مستوى التطبيق: حوّل شريط القالب ‎TAC-AAA‎ إلى ‎mRNA‎.\n• الإجابة النموذجية: ‎AUG-UUU‎.\n\n3. مستوى الاستدلال: ماذا يحدث لعديد الببتيد إذا تحول الكودون الثالث إلى شيفرة إيقاف؟\n• الإجابة النموذجية: يتوقف عند حمضين أمينيين فقط فيكون قصيرًا وغالبًا غير وظيفي.", "1. مستوى المعرفة: ما عدد القواعد في ‎mRNA‎ الناضج الذي يشفر عديد ببتيد من 100 حمض أميني؟\n• الإجابة النموذجية: 300 قاعدة للأحماض + 3 لشيفرة الإيقاف = 303 قاعدة على الأقل.\n\n2. مستوى التطبيق: كودونا ‎mRNA: GGU‎ و‎GGC‎ يشفران الجلايسين. ماذا يدل ذلك عليه؟\n• الإجابة النموذجية: على أن الشيفرة منحلة (أكثر من كودون للحمض الأميني نفسه).\n\n3. مستوى الاستدلال: لماذا قد يكون الجين في ‎DNA‎ أطول بكثير من 3 أضعاف عدد الأحماض الأمينية؟\n• الإجابة النموذجية: لوجود الإنترونات وتتابعات تنظيمية غير مشفرة تُزال أو لا تُترجم.", "إرشاد للطالب: حل السؤال 8 ومسألتين إضافيتين ومراجعة الملحق 2\nإرشاد لولي الأمر: متابعة الابن في التدرب على مسائل الحساب\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4"], "h": ["<ol class=\"ol\"><li>يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين (20 دقيقة)<\/li><li>يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل (5 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يحسب عدد الأحماض الأمينية والكودونات والقواعد في مسائل بناء البروتين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل السؤال 8 في كتاب الطالب ويبرر خطوات الحل<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحلل تأثير تغيّر كودون واحد في ‎mRNA‎ على عديد الببتيد الناتج<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: جدول الشيفرة الجينية (الملحق 2)<\/span><\/div>", "<p>النسبة بين القواعد والكودونات والأحماض الأمينية، الملحق 2، الترجمة العكسية، تتابع الأحماض الأمينية.<\/p>", "<p>يطرح المعلم لغزًا: «بروتين من 150 حمضًا أمينيًا؛ كم قاعدة على الأقل في ‎mRNA‎ الناضج الذي يشفره؟» ويمنح دقيقتين للتفكير.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم اللغز ويستقبل الحلول، والطلبة يحسبون ويشرحون: ‎150 × 3 + 3‎ لشيفرة الإيقاف = 453 (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يحل مثالًا متدرجًا: من شريط القالب إلى ‎mRNA‎ إلى ‎tRNA‎ إلى أحماض أمينية باستخدام الملحق 2، والطلبة يتابعون الحل ويكملون الجداول (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل السؤال 8 ومسائل إضافية في مجموعات، والطلبة يحلون المسائل ويعرضون الحلول على السبورة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ورشة السفن في صور: يمثل الطلبة بناء البروتين كورشة لصناعة السفن في صور: مخطط منسوخ كـmRNA، وعمال يحضرون الألواح كـtRNA، وقاعدة تجميع كالريبوسوم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: لعب الأدوار.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كم كودونًا في ‎mRNA‎ يشفر 50 حمضًا أمينيًا مع شيفرة إيقاف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 51 كودونًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> حوّل شريط القالب ‎TAC-AAA‎ إلى ‎mRNA‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AUG-UUU‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يحدث لعديد الببتيد إذا تحول الكودون الثالث إلى شيفرة إيقاف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتوقف عند حمضين أمينيين فقط فيكون قصيرًا وغالبًا غير وظيفي.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما عدد القواعد في ‎mRNA‎ الناضج الذي يشفر عديد ببتيد من 100 حمض أميني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 300 قاعدة للأحماض + 3 لشيفرة الإيقاف = 303 قاعدة على الأقل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كودونا ‎mRNA: GGU‎ و‎GGC‎ يشفران الجلايسين. ماذا يدل ذلك عليه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: على أن الشيفرة منحلة (أكثر من كودون للحمض الأميني نفسه).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا قد يكون الجين في ‎DNA‎ أطول بكثير من 3 أضعاف عدد الأحماض الأمينية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لوجود الإنترونات وتتابعات تنظيمية غير مشفرة تُزال أو لا تُترجم.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل السؤال 8 ومسألتين إضافيتين ومراجعة الملحق 2<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في التدرب على مسائل الحساب<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4<\/p>"]}]}, {"title": "الطفرات الجينية", "sb": "ص 34–44", "unit": "الوحدة 1: الأحماض النووية وبناء البروتين", "periods": [{"axis": "مفهوم الطفرة الجينية وطفرة الاستبدال", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الطفرات الجينية"], ["الحصة", "1 من 5"], ["محور الحصة", "مفهوم الطفرة الجينية وطفرة الاستبدال"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 34–35"], ["دليل المعلم", "ص 62–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]], "t": ["1. يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف (10 دقائق)\n2. يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني (10 دقائق)\nمخرج تعليمي آخر: يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني (20 دقيقة)", "1. تذكر: يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف\n2. فهم: يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني\n3. تحليل (مخرج آخر): يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: جدول الشيفرة الجينية (الملحق 2)", "الطفرة الجينية، الأليل، الاستبدال، الطفرة الصامتة، تغير الحمض الأميني، شيفرة إيقاف مبكرة.", "يكتب المعلم جملة: «سار الولد إلى الدار» ثم يغير حرفًا واحدًا: «سال الولد إلى الدار»، ويسأل: «كيف يغير حرف واحد المعنى؟ وهل يحدث ذلك في ‎DNA‎؟»", "1. يعرض المعلم الجملتين ويستثير المقارنة، والطلبة يحددون الحرف المتغير وأثره في المعنى (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يعرّف المعلم الطفرة الجينية ويشرح طفرة الاستبدال بأمثلة من الملحق 2، والطلبة يحددون أثر استبدال قاعدة في ثلاثية على الحمض الأميني (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوزع المعلم تتابعات على المجموعات لإحداث استبدالات وتحليل أثرها (صامتة، تغير حمض، إيقاف مبكر)، والطلبة يصنفون نتائج كل استبدال ويعرضونها (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون ويناقشون لماذا لا تؤثر بعض الطفرات (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: عرّف الطفرة الجينية.\n• الإجابة النموذجية: تغير في تتابع أزواج القواعد في جزيء ‎DNA‎ قد يؤدي إلى تكوين عديد ببتيد مختلف.\n\n2. مستوى التطبيق: كيف يؤدي الاستبدال إلى طفرة صامتة؟\n• الإجابة النموذجية: عندما يتحول الكودون إلى كودون آخر يشفر الحمض الأميني نفسه بسبب انحلال الشيفرة.\n\n3. مستوى الاستدلال: ما أثر استبدال يحول كودونًا إلى شيفرة إيقاف؟\n• الإجابة النموذجية: توقف مبكر للترجمة وعديد ببتيد قصير غالبًا غير وظيفي.", "1. مستوى المعرفة: ما الأليل؟\n• الإجابة النموذجية: أحد الأشكال المختلفة للجين نفسه، وينشأ الأليل الجديد بالطفرة.\n\n2. مستوى التطبيق: فسّر: طفرة الاستبدال تؤثر غالبًا في حمض أميني واحد فقط.\n• الإجابة النموذجية: لأن إطار القراءة لا يتغير، فيتأثر الكودون الذي حدث فيه الاستبدال فقط.\n\n3. مستوى الاستدلال: كودون ‎DNA (‎القالب) ‎CTT‎ يشفر حمض الجلوتاميك؛ أصبح ‎CAT‎. ماذا يحدث في ‎mRNA‎ والحمض الأميني؟\n• الإجابة النموذجية: يتحول كودون ‎mRNA‎ من ‎GAA‎ إلى ‎GUA‎، فيحل الفالين محل حمض الجلوتاميك.", "إرشاد للطالب: مراجعة ص 34–35 وكتابة مثال لطفرة استبدال صامتة وآخر مغيِّر للحمض الأميني\nإرشاد لولي الأمر: سؤال الابن عن مثال جملة يغير فيها حرف واحد المعنى ومقارنته بالطفرة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5"], "h": ["<ol class=\"ol\"><li>يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف (10 دقائق)<\/li><li>يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تذكر:<\/b> يعرّف الطفرة الجينية بأنها تغير في تتابع أزواج القواعد في ‎DNA‎ قد يؤدي إلى عديد ببتيد مختلف<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح تأثير طفرة الاستبدال على الكودون والحمض الأميني<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يميز بين الطفرة الصامتة وطفرة الاستبدال التي تغير الحمض الأميني<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: جدول الشيفرة الجينية (الملحق 2)<\/span><\/div>", "<p>الطفرة الجينية، الأليل، الاستبدال، الطفرة الصامتة، تغير الحمض الأميني، شيفرة إيقاف مبكرة.<\/p>", "<p>يكتب المعلم جملة: «سار الولد إلى الدار» ثم يغير حرفًا واحدًا: «سال الولد إلى الدار»، ويسأل: «كيف يغير حرف واحد المعنى؟ وهل يحدث ذلك في ‎DNA‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الجملتين ويستثير المقارنة، والطلبة يحددون الحرف المتغير وأثره في المعنى (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يعرّف المعلم الطفرة الجينية ويشرح طفرة الاستبدال بأمثلة من الملحق 2، والطلبة يحددون أثر استبدال قاعدة في ثلاثية على الحمض الأميني (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم تتابعات على المجموعات لإحداث استبدالات وتحليل أثرها (صامتة، تغير حمض، إيقاف مبكر)، والطلبة يصنفون نتائج كل استبدال ويعرضونها (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي، والطلبة يجيبون ويناقشون لماذا لا تؤثر بعض الطفرات (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف الطفرة الجينية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تغير في تتابع أزواج القواعد في جزيء ‎DNA‎ قد يؤدي إلى تكوين عديد ببتيد مختلف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كيف يؤدي الاستبدال إلى طفرة صامتة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: عندما يتحول الكودون إلى كودون آخر يشفر الحمض الأميني نفسه بسبب انحلال الشيفرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما أثر استبدال يحول كودونًا إلى شيفرة إيقاف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: توقف مبكر للترجمة وعديد ببتيد قصير غالبًا غير وظيفي.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الأليل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أحد الأشكال المختلفة للجين نفسه، وينشأ الأليل الجديد بالطفرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> فسّر: طفرة الاستبدال تؤثر غالبًا في حمض أميني واحد فقط.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن إطار القراءة لا يتغير، فيتأثر الكودون الذي حدث فيه الاستبدال فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كودون ‎DNA (‎القالب) ‎CTT‎ يشفر حمض الجلوتاميك؛ أصبح ‎CAT‎. ماذا يحدث في ‎mRNA‎ والحمض الأميني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يتحول كودون ‎mRNA‎ من ‎GAA‎ إلى ‎GUA‎، فيحل الفالين محل حمض الجلوتاميك.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 34–35 وكتابة مثال لطفرة استبدال صامتة وآخر مغيِّر للحمض الأميني<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن مثال جملة يغير فيها حرف واحد المعنى ومقارنته بالطفرة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5<\/p>"]}, {"axis": "الإدخال والحذف وطفرة انزياح الإطار", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الطفرات الجينية"], ["الحصة", "2 من 5"], ["محور الحصة", "الإدخال والحذف وطفرة انزياح الإطار"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 35–36"], ["دليل المعلم", "ص 62–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]], "t": ["1. يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة (15 دقيقة)\n2. يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين (10 دقائق)", "1. فهم: يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة\n2. تحليل: يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد\n3. تقييم (مخرج آخر): يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين", "- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات ثلاثيات قابلة للتحريك", "الإدخال، الحذف، إطار القراءة، طفرة انزياح الإطار، الثلاثيات المتأثرة.", "يكتب المعلم: «قطّ كبر نام» مقسمة ثلاثيات، ثم يحذف الحرف الأول ويعيد التقسيم: «طّكبرنام...» ويسأل: «ماذا حدث للمعنى؟»", "1. يعرض المعلم المثال ويناقش انزياح التقسيم، والطلبة يلاحظون تغير جميع المقاطع بعد الحذف (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يشرح المعلم الإدخال والحذف بمثال ‎TAG‎ المتكرر في كتاب الطالب ص 35–36، والطلبة يكتبون التتابع بعد الحذف والإدخال ويقسمونه ثلاثيات (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. ينظم لعبة «ثلاثيات متحركة»: كل مجموعة تحدث طفرة وتطلب من الأخرى تحديد نوعها، والطلبة يتبادلون الطفرات ويحللون الأثر على الأحماض الأمينية (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. يدير المعلم سؤالًا مفصليًا عن أشد الطفرات أثرًا ثم التقويم الختامي، والطلبة يرتبون الطفرات حسب شدة الأثر ويعللون (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم:\n1. مستوى المعرفة: ما المقصود بإطار القراءة؟\n• الإجابة النموذجية: طريقة تقسيم تتابع القواعد إلى ثلاثيات متتالية بدءًا من شيفرة البدء.\n\n2. مستوى التطبيق: لماذا تسمى طفرة الحذف طفرة انزياح الإطار؟\n• الإجابة النموذجية: لأن حذف قاعدة يزيح التقسيم بمقدار قاعدة فتتغير كل الثلاثيات بعدها.\n\n3. مستوى الاستدلال: أيهما أشد أثرًا عادة: حذف قاعدة قرب بداية الجين أم قرب نهايته؟\n• الإجابة النموذجية: قرب البداية، لأن عدد الثلاثيات المتأثرة بعد الطفرة أكبر.", "1. مستوى المعرفة: اكتب التتابع ‎TAGTAGTAG‎ بعد إدخال ‎A‎ بعد القاعدة الأولى.\n• الإجابة النموذجية: ‎TAAGTAGTAG ←‎ الثلاثيات: ‎TAA-GTA-GTA-G‎، فتتغير كل الثلاثيات.\n\n2. مستوى التطبيق: لماذا يكون بروتين طفرة الانزياح غالبًا غير فعّال؟\n• الإجابة النموذجية: لأن الأحماض الأمينية بعد الطفرة تتغير كلها وقد تظهر شيفرة إيقاف مبكرة فيتغير شكل البروتين ووظيفته.\n\n3. مستوى الاستدلال: قيّم: «حذف ثلاث قواعد متتالية أخطر من حذف قاعدة واحدة».\n• الإجابة النموذجية: غالبًا غير صحيحة؛ حذف ثلاث قواعد متتالية يزيل حمضًا أمينيًا واحدًا (أو يغير اثنين) دون انزياح الإطار، بينما حذف قاعدة واحدة يغير كل الثلاثيات اللاحقة.", "إرشاد للطالب: حل تدريبات الإدخال والحذف ومراجعة ص 35–36\nإرشاد لولي الأمر: سؤال الابن عن معنى «انزياح الإطار» بمثال من كلمات عربية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5"], "h": ["<ol class=\"ol\"><li>يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة (15 دقيقة)<\/li><li>يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح كيف يؤدي إدخال قاعدة أو حذفها إلى انزياح إطار القراءة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يقارن بين أثر الاستبدال وأثر الإدخال أو الحذف في عديد الببتيد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يتنبأ بأثر إدخال أو حذف ثلاث قواعد متتالية على البروتين<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: بطاقات ثلاثيات قابلة للتحريك<\/span><\/div>", "<p>الإدخال، الحذف، إطار القراءة، طفرة انزياح الإطار، الثلاثيات المتأثرة.<\/p>", "<p>يكتب المعلم: «قطّ كبر نام» مقسمة ثلاثيات، ثم يحذف الحرف الأول ويعيد التقسيم: «طّكبرنام...» ويسأل: «ماذا حدث للمعنى؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم المثال ويناقش انزياح التقسيم، والطلبة يلاحظون تغير جميع المقاطع بعد الحذف (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الإدخال والحذف بمثال ‎TAG‎ المتكرر في كتاب الطالب ص 35–36، والطلبة يكتبون التتابع بعد الحذف والإدخال ويقسمونه ثلاثيات (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينظم لعبة «ثلاثيات متحركة»: كل مجموعة تحدث طفرة وتطلب من الأخرى تحديد نوعها، والطلبة يتبادلون الطفرات ويحللون الأثر على الأحماض الأمينية (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم سؤالًا مفصليًا عن أشد الطفرات أثرًا ثم التقويم الختامي، والطلبة يرتبون الطفرات حسب شدة الأثر ويعللون (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقصود بإطار القراءة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: طريقة تقسيم تتابع القواعد إلى ثلاثيات متتالية بدءًا من شيفرة البدء.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تسمى طفرة الحذف طفرة انزياح الإطار؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن حذف قاعدة يزيح التقسيم بمقدار قاعدة فتتغير كل الثلاثيات بعدها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أيهما أشد أثرًا عادة: حذف قاعدة قرب بداية الجين أم قرب نهايته؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: قرب البداية، لأن عدد الثلاثيات المتأثرة بعد الطفرة أكبر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب التتابع ‎TAGTAGTAG‎ بعد إدخال ‎A‎ بعد القاعدة الأولى.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎TAAGTAGTAG ←‎ الثلاثيات: ‎TAA-GTA-GTA-G‎، فتتغير كل الثلاثيات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون بروتين طفرة الانزياح غالبًا غير فعّال؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأحماض الأمينية بعد الطفرة تتغير كلها وقد تظهر شيفرة إيقاف مبكرة فيتغير شكل البروتين ووظيفته.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم: «حذف ثلاث قواعد متتالية أخطر من حذف قاعدة واحدة».<br><span style=\"opacity:.85\">• الإجابة النموذجية: غالبًا غير صحيحة؛ حذف ثلاث قواعد متتالية يزيل حمضًا أمينيًا واحدًا (أو يغير اثنين) دون انزياح الإطار، بينما حذف قاعدة واحدة يغير كل الثلاثيات اللاحقة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> حل تدريبات الإدخال والحذف ومراجعة ص 35–36<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن معنى «انزياح الإطار» بمثال من كلمات عربية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5<\/p>"]}, {"axis": "فقر الدم المنجلي: من طفرة إلى مرض", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الطفرات الجينية"], ["الحصة", "3 من 5"], ["محور الحصة", "فقر الدم المنجلي: من طفرة إلى مرض"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 34–35"], ["دليل المعلم", "ص 62–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]], "t": ["1. يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين (10 دقائق)\n2. يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها (10 دقائق)\nمخرج تعليمي آخر: يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎ (20 دقيقة)", "1. فهم: يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين\n2. تحليل: يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها\n3. تقييم (مخرج آخر): يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎", "- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n- دراسة الحالة", "- الكتاب\n- جهاز عرض البيانات\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "فقر الدم المنجلي، الهيموجلوبين، أليل ‎HbS‎، أليل ‎HbA‎، حمض الجلوتاميك، الفالين، الخلايا المنجلية.", "يعرض المعلم صورة مجهرية لخلايا دم حمراء منجلية وطبيعية ويسأل: «ما الذي حوّل هذه الخلية إلى منجل؟» ويذكّر بتركيب الهيموجلوبين.", "1. يعرض المعلم الصورة المجهرية ويستقبل الفرضيات، والطلبة يقارنون شكل الخليتين ويقترحون أسبابًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. يشرح المعلم استبدال قاعدة في جين سلسلة β ‎(CTT→CAT)‎ وحلول الفالين محل حمض الجلوتاميك، والطلبة يتتبعون التغير من ‎DNA‎ إلى ‎mRNA‎ إلى الحمض الأميني (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقدم المعلم دراسة حالة مريض ويطلب سلسلة سبب ونتيجة من الطفرة إلى الأعراض، والطلبة يكتبون سلسلة السبب والنتيجة في مجموعات ويعرضونها (15 دقيقة)\nالاستراتيجيات: دراسة الحالة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون فرديًا (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم:\n1. مستوى المعرفة: ما الحمض الأميني الذي يحل محل حمض الجلوتاميك في ‎HbS‎؟\n• الإجابة النموذجية: الفالين.\n\n2. مستوى التطبيق: ما نوع الطفرة في فقر الدم المنجلي؟\n• الإجابة النموذجية: طفرة استبدال قاعدة واحدة.\n\n3. مستوى الاستدلال: لماذا تسبب الخلايا المنجلية انسداد الشعيرات الدموية؟\n• الإجابة النموذجية: لأن شكلها المنجلي غير المرن يجعلها تتكدس وتعلق في الشعيرات الضيقة.", "1. مستوى المعرفة: ما الجين المصاب في فقر الدم المنجلي؟\n• الإجابة النموذجية: جين سلسلة β في الهيموجلوبين.\n\n2. مستوى التطبيق: اكتب سلسلة مختصرة من الطفرة إلى ظهور الأعراض.\n• الإجابة النموذجية: استبدال قاعدة ← تغير كودون ← فالين بدل جلوتاميك ← تكتل جزيئات الهيموجلوبين عند انخفاض الأكسجين ← خلايا منجلية ← انسداد الشعيرات ونقص نقل الأكسجين ← ألم وفقر دم.\n\n3. مستوى الاستدلال: لماذا لا تظهر الأعراض الشديدة لدى الشخص ‎HbA HbS‎ غالبًا؟\n• الإجابة النموذجية: لأن أليل ‎HbA‎ ينتج هيموجلوبينًا طبيعيًا كافيًا لمنع تكون معظم الخلايا المنجلية في الظروف العادية.", "إرشاد للطالب: مراجعة ص 34–35 وكتابة سلسلة السبب والنتيجة لفقر الدم المنجلي\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن أهمية فحص ما قبل الزواج في سلطنة عُمان للوقاية من أمراض الدم الوراثية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5"], "h": ["<ol class=\"ol\"><li>يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين (10 دقائق)<\/li><li>يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎ (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف الطفرة المسببة لفقر الدم المنجلي في جين الهيموجلوبين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يربط بين تغير حمض أميني واحد وتغير شكل خلايا الدم الحمراء ووظيفتها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يستنتج سبب ظهور أعراض المرض لدى متماثلي الأليل ‎HbS‎<\/p><\/div>", "<div class=\"chips\"><span class=  class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الحمض الأميني الذي يحل محل حمض الجلوتاميك في ‎HbS‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الفالين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما نوع الطفرة في فقر الدم المنجلي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: طفرة استبدال قاعدة واحدة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا تسبب الخلايا المنجلية انسداد الشعيرات الدموية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن شكلها المنجلي غير المرن يجعلها تتكدس وتعلق في الشعيرات الضيقة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الجين المصاب في فقر الدم المنجلي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: جين سلسلة β في الهيموجلوبين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب سلسلة مختصرة من الطفرة إلى ظهور الأعراض.<br><span style=\"opacity:.85\">• الإجابة النموذجية: استبدال قاعدة ← تغير كودون ← فالين بدل جلوتاميك ← تكتل جزيئات الهيموجلوبين عند انخفاض الأكسجين ← خلايا منجلية ← انسداد الشعيرات ونقص نقل الأكسجين ← ألم وفقر دم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا تظهر الأعراض الشديدة لدى الشخص ‎HbA HbS‎ غالبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن أليل ‎HbA‎ ينتج هيموجلوبينًا طبيعيًا كافيًا لمنع تكون معظم الخلايا المنجلية في الظروف العادية.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 34–35 وكتابة سلسلة السبب والنتيجة لفقر الدم المنجلي<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن الحديث مع الابن عن أهمية فحص ما قبل الزواج في سلطنة عُمان للوقاية من أمراض الدم الوراثية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5<\/p>"]}, {"axis": "نشاط 1-2: كتابة إجابات جيدة والسؤالان 9 و10", "n": 4, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الطفرات الجينية"], ["الحصة", "4 من 5"], ["محور الحصة", "نشاط 1-2: كتابة إجابات جيدة والسؤالان 9 و10"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 36 + كتاب التجارب ص 28"], ["دليل المعلم", "ص 62–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]], "t": ["1. يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9 (15 دقيقة)\n2. يكتب إجابات علمية دقيقة مكتملة وفق معايير نشاط 1-2 (15 دقيقة)\nمخرج تعليمي آخر: يقيّم إجابات نموذجية مختلفة ويحدد نقاط القوة والضعف فيها (10 دقائق)", "1. تحليل: يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9\n2. تطبيق: يكتب إجابات علمية دقيقة مكتملة وفق معايير نشاط 1-2\n3. تقييم (مخرج آخر): يقيّم إجابات نموذجية مختلفة ويحدد نقاط القوة والضعف فيها", "- التعلم الذاتي\n- التعلم التشاركي\n- التقييم الذاتي", "- الكتاب\n- الأقلام\n- أخرى: كتاب التجارب العملية والأنشطة", "الإجابة الجيدة، الأفعال الإجرائية (صف، اشرح، قارن)، المصطلح العلمي، جدول المقارنة.", "يعرض المعلم إجابتين لسؤال واحد إحداهما مختصرة غامضة والأخرى دقيقة، ويسأل: «أيهما تمنحها الدرجة الكاملة؟ ولماذا؟»", "1. يعرض المعلم الإجابتين ويناقش معايير الإجابة الجيدة، والطلبة يحددون الفروق ويستنتجون المعايير (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يوجه المعلم حل نشاط 1-2 في كتاب التجارب ص 28، والطلبة يكتبون الإجابات وفق الأفعال الإجرائية (15 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n3. يوجه المعلم حل السؤالين 9 و10 في كتاب الطالب ص 36، والطلبة يكملون جدول ‎DNA‎ و‎mRNA‎ ويرسمون المخطط الانسيابي (12 دقيقة)\nالاستراتيجيات: التقييم الذاتي.\n\n4. ينظم المعلم تقييمًا تبادليًا للإجابات بمعايير محددة، والطلبة يقيّمون إجابات زملائهم ويقدمون تغذية راجعة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم:\n1. مستوى المعرفة: ما الفرق بين الفعلين «صف» و«اشرح»؟\n• الإجابة النموذجية: «صف» تذكر ما يحدث، و«اشرح» تذكر ما يحدث مع السبب.\n\n2. مستوى التطبيق: اذكر فرقين بين ‎DNA‎ و‎mRNA‎ من حيث الموقع والوظيفة.\n• الإجابة النموذجية: ‎DNA‎ في النواة ويخزن المعلومات الوراثية؛ ‎mRNA‎ ينتقل إلى السيتوبلازم وينقل نسخة الجين إلى الرايبوسوم.\n\n3. مستوى الاستدلال: حسّن الإجابة: «الطفرة تغير البروتين».\n• الإجابة النموذجية: الطفرة تغير تتابع القواعد في ‎DNA‎، فتتغير الكودونات في ‎mRNA‎، وقد يتغير تتابع الأحماض الأمينية فيتغير شكل البروتين ووظيفته.", "1. مستوى المعرفة: قارن بين ‎DNA‎ و‎mRNA‎ من حيث عدد الأشرطة ونوع السكر.\n• الإجابة النموذجية: ‎DNA‎ شريطان وسكره ديؤكسي رايبوز؛ ‎mRNA‎ شريط واحد وسكره رايبوز.\n\n2. مستوى التطبيق: صِف مراحل بناء البروتين في ثلاث جمل.\n• الإجابة النموذجية: يُنسخ الجين إلى ‎mRNA‎ في النواة، ثم يخرج ‎mRNA‎ إلى الرايبوسوم، ثم تُترجم كودوناته إلى أحماض أمينية بواسطة ‎tRNA‎.\n\n3. مستوى الاستدلال: اشرح لماذا يُعدّ ‎mRNA‎ وسيطًا ضروريًا بين ‎DNA‎ والبروتين في حقيقيات النواة.\n• الإجابة النموذجية: لأن ‎DNA‎ يبقى في النواة ولا يغادرها، بينما يحدث بناء البروتين على الرايبوسومات في السيتوبلازم، فيحمل ‎mRNA‎ نسخة من الجين إليها.", "إرشاد للطالب: إكمال نشاط 1-2 في كتاب التجارب ص 28 والسؤالين 9 و10\nإرشاد لولي الأمر: تشجيع الابن على قراءة إجاباته بصوت مرتفع والتأكد من استخدامه المصطلحات العلمية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5"], "h": ["<ol class=\"ol\"><li>يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9 (15 دقيقة)<\/li><li>يكتب إجابات علمية دقيقة مكتملة وفق معايير نشاط 1-2 (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم إجابات نموذجية مختلفة ويحدد نقاط القوة والضعف فيها (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تحليل:<\/b> يقارن بين ‎DNA‎ و‎mRNA‎ في جدول منظم وفق السؤال 9 بمعايير محددة، والطلبة يقيّمون إجابات زملائهم ويقدمون تغذية راجعة (8 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الفرق بين الفعلين «صف» و«اشرح»؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: «صف» تذكر ما يحدث، و«اشرح» تذكر ما يحدث مع السبب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اذكر فرقين بين ‎DNA‎ و‎mRNA‎ من حيث الموقع والوظيفة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎DNA‎ في النواة ويخزن المعلومات الوراثية؛ ‎mRNA‎ ينتقل إلى السيتوبلازم وينقل نسخة الجين إلى الرايبوسوم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> حسّن الإجابة: «الطفرة تغير البروتين».<br><span style=\"opacity:.85\">• الإجابة النموذجية: الطفرة تغير تتابع القواعد في ‎DNA‎، فتتغير الكودونات في ‎mRNA‎، وقد يتغير تتابع الأحماض الأمينية فيتغير شكل البروتين ووظيفته.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> قارن بين ‎DNA‎ و‎mRNA‎ من حيث عدد الأشرطة ونوع السكر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎DNA‎ شريطان وسكره ديؤكسي رايبوز؛ ‎mRNA‎ شريط واحد وسكره رايبوز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صِف مراحل بناء البروتين في ثلاث جمل.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يُنسخ الجين إلى ‎mRNA‎ في النواة، ثم يخرج ‎mRNA‎ إلى الرايبوسوم، ثم تُترجم كودوناته إلى أحماض أمينية بواسطة ‎tRNA‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اشرح لماذا يُعدّ ‎mRNA‎ وسيطًا ضروريًا بين ‎DNA‎ والبروتين في حقيقيات النواة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎DNA‎ يبقى في النواة ولا يغادرها، بينما يحدث بناء البروتين على الرايبوسومات في السيتوبلازم، فيحمل ‎mRNA‎ نسخة من الجين إليها.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-2 في كتاب التجارب ص 28 والسؤالين 9 و10<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على قراءة إجاباته بصوت مرتفع والتأكد من استخدامه المصطلحات العلمية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5<\/p>"]}, {"axis": "مراجعة الوحدة الأولى: نشاط 1-3 وأسئلة نهاية الوحدة", "n": 5, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الطفرات الجينية"], ["الحصة", "5 من 5"], ["محور الحصة", "مراجعة الوحدة الأولى: نشاط 1-3 وأسئلة نهاية الوحدة"], ["الأسبوع والتاريخ", "الأسبوع الرابع (27/9–1/10/2026)"], ["كتاب الطالب", "ص 37–44 + كتاب التجارب ص 29"], ["دليل المعلم", "ص 62–65"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-2: كتابة إجابات جيدة للأسئلة ص 28؛ نشاط 1-3: تكوين روابط عبر المواضيع المختلفة ص 29"]], "t": ["1. يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم (10 دقائق)\n2. يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين (20 دقيقة)\nمخرج تعليمي آخر: يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي (10 دقائق)", "1. إبداع: يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم\n2. تطبيق: يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين\n3. تقييم (مخرج آخر): يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي", "- التعلم الذاتي\n- التعلم المبني على اللعب\n- خريطة المفاهيم", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة", "الملخص، خريطة المفاهيم، قائمة التقويم الذاتي، أسئلة نهاية الوحدة.", "يكتب المعلم في وسط السبورة «‎DNA»‎ ويطلب من كل طالب إضافة كلمة مرتبطة بسهم وعبارة ربط خلال دقيقتين.", "1. يبدأ المعلم بنشاط الكلمة المركزية ويجمع إسهامات الطلبة، والطلبة يضيفون مفاهيم وعبارات ربط (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. يوجه المعلم نشاط 1-3 «تكوين روابط عبر المواضيع المختلفة» (كتاب التجارب ص 29)، والطلبة يكوّنون روابط بين المواضيع في أزواج (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. يوزع المعلم أسئلة نهاية الوحدة (ص 38–44) على المجموعات ويناقش الحلول، والطلبة يحلون الأسئلة المكلفين بها ويعرضون الحلول (15 دقيقة)\nالاستراتيجيات: خريطة المفاهيم.\n\n4. غلق الدرس (نشاط ممتع مع المواطنة) – حرف يغير المعنى: تغير المجموعات حرفًا في جملة من كلمات ثلاثية الحروف لتوضيح الاستبدال والحذف، ثم تربط ذلك بفقر الدم المنجلي وأهمية الفحص الطبي قبل الزواج في عمان (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم:\n1. مستوى المعرفة: ما العلاقة بين التضاعف وبناء البروتين من حيث القالب المستخدم؟\n• الإجابة النموذجية: كلاهما يستخدم ‎DNA‎ قالبًا؛ التضاعف ينسخ الشريطين لإنتاج ‎DNA‎، والنسخ يستخدم شريطًا واحدًا لإنتاج ‎mRNA‎.\n\n2. مستوى التطبيق: اربط بين الطفرة والأليلات الجديدة.\n• الإجابة النموذجية: الطفرة تغير تتابع الجين فينتج شكل جديد منه (أليل جديد).\n\n3. مستوى الاستدلال: كيف يمكن لطفرة في إنترون ألا تغير البروتين؟\n• الإجابة النموذجية: لأن الإنترون يُزال أثناء معالجة ‎RNA‎ فلا يدخل في ‎mRNA‎ الناضج.", "1. مستوى المعرفة: اذكر الإنزيم المرتبط بكل عملية: التضاعف، النسخ.\n• الإجابة النموذجية: التضاعف: ‎DNA‎ بوليميريز (و‎DNA‎ ليجيز)؛ النسخ: ‎RNA‎ بوليميريز.\n\n2. مستوى التطبيق: رتب: طفرة في ‎DNA‎، تغير شكل البروتين، تغير كودون ‎mRNA‎، تغير الحمض الأميني.\n• الإجابة النموذجية: طفرة في ‎DNA ←‎ تغير كودون ‎mRNA ←‎ تغير الحمض الأميني ← تغير شكل البروتين.\n\n3. مستوى الاستدلال: صمم خريطة مفاهيم تربط ستة مفاهيم من الوحدة بعبارات ربط صحيحة.\n• الإجابة النموذجية: خريطة تتضمن مثلًا: ‎DNA ← (‎يُنسخ إلى) ‎mRNA ← (‎يُترجم إلى) عديد ببتيد؛ ‎DNA ← (‎يتضاعف بواسطة) ‎DNA‎ بوليميريز؛ الطفرة ← (تغير) تتابع القواعد ← (قد ينتج) أليل جديد.", "إرشاد للطالب: مراجعة ملخص الوحدة ص 37 وإكمال أسئلة نهاية الوحدة غير المحلولة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع على قائمة التقويم الذاتي مع الابن لمعرفة الموضوعات التي تحتاج إلى مراجعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=5"], "h": ["<ol class=\"ol\"><li>يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم (10 دقائق)<\/li><li>يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. إبداع:<\/b> يربط بين مفاهيم الوحدة (التركيب، التضاعف، الشيفرة، بناء البروتين، الطفرات) في خريطة مفاهيم<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يحل أسئلة نهاية الوحدة الأولى المرتبطة بالطفرات وبناء البروتين<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تقييم (مخرج آخر):<\/b> يحدد نقاط القوة والضعف في تعلمه باستخدام قائمة التقويم الذاتي<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">التعلم المبني على اللعب<\/span><span class=\"chip\">خريطة المفاهيم<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎<\/span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الملخص، خريطة المفاهيم، قائمة التقويم الذاتي، أسئلة نهاية الوحدة.<\/p>", "<p>يكتب المعلم في وسط السبورة «‎DNA»‎ ويطلب من كل طالب إضافة كلمة مرتبطة بسهم وعبارة ربط خلال دقيقتين.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px das "الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الأمشاج والتكاثر"], ["الحصة", "1 من 3"], ["محور الحصة", "الجين والمجموعة الكروموسومية وضرورة الانقسام المنصف"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "ص 45–47"], ["دليل المعلم", "ص 79–83"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 2-1: دراسة أطوار الانقسام الاختزالي في المتك ص 57"]], "t": ["1. يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎ (5 دقائق)\n2. يشرح المقصود بأزواج الكروموسومات المتماثلة (15 دقيقة)\nمخرج تعليمي آخر: يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا (20 دقيقة)", "1. فهم: يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎\n2. فهم: يشرح المقصود بأزواج الكروموسومات المتماثلة\n3. تحليل (مخرج آخر): يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا", "- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: صورة نمط نووي (كاريوتايب) للإنسان", "الجين، الكروموسوم، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎، الكروموسومات المتماثلة، الأمشاج، الإخصاب، الانقسام المنصف.", "يعرض المعلم صورة نمط نووي للإنسان ويسأل: «إذا كانت خلية الأب وخلية الأم تحتوي كل منهما 46 كروموسومًا، فلماذا لا يحمل الطفل 92؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».", "1. يعرض المعلم النمط النووي ويطرح السؤال، والطلبة يقترحون تفسيرًا لثبات عدد الكروموسومات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يشرح المعلم الجين والموقع الجيني و‎n‎ و‎2n‎ والكروموسومات المتماثلة بالأشكال 2-1 إلى 2-3، والطلبة يحددون الأزواج المتماثلة على صورة النمط النووي (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يكلّف المجموعات بمخطط لدورة حياة الإنسان يوضح مواقع الانقسام المنصف والإخصاب وعدد الكروموسومات، والطلبة يرسمون المخطط ويكتبون ‎n‎ أو ‎2n‎ عند كل مرحلة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يدير المعلم التقويم الختامي ويوجه حل السؤالين 1 و2، والطلبة يجيبون فرديًا ثم يتبادلون التصحيح (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم:\n1. مستوى المعرفة: ما عدد الكروموسومات في مشيج الإنسان؟\n• الإجابة النموذجية: 23 كروموسومًا ‎(n)‎.\n\n2. مستوى التطبيق: ما المقصود بالكروموسومات المتماثلة؟\n• الإجابة النموذجية: زوج كروموسومات متشابهان في الطول وموقع السنترومير وتحمل الجينات نفسها في المواقع نفسها، أحدهما من الأب والآخر من الأم.\n\n3. مستوى الاستدلال: ماذا يحدث لعدد الكروموسومات عبر الأجيال لو تكونت الأمشاج بالانقسام المتساوي؟\n• الإجابة النموذجية: سيتضاعف في كل جيل.", "1. مستوى المعرفة: عرّف ثنائي المجموعة الكروموسومية.\n• الإجابة النموذجية: خلية تحتوي مجموعتين كاملتين من الكروموسومات ‎(2n)‎، واحدة من كل أب.\n\n2. مستوى التطبيق: لماذا لا تحمل الكروموسومات المتماثلة بالضرورة الأليلات نفسها؟\n• الإجابة النموذجية: لأنها تحمل الجينات نفسها، لكن قد يكون لكل جين أليلان مختلفان على الكروموسومين.\n\n3. مستوى الاستدلال: خلية جسمية في حيوان فيها 38 كروموسومًا. كم كروموسومًا في مشيجه؟ وكم زوجًا متماثلًا في خليته الجسمية؟\n• الإجابة النموذجية: المشيج 19 كروموسومًا، والخلية الجسمية فيها 19 زوجًا متماثلًا.", "إرشاد للطالب: مراجعة ص 45–47 وحل السؤالين 1 و2\nإرشاد لولي الأمر: الحديث مع الابن عن سبب تشابه الأبناء مع الوالدين واختلافهم في الوقت نفسه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=6"], "h": ["<ol class=\"ol\"><li>يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎ (5 دقائق)<\/li><li>يشرح المقصود بأزواج الكروموسومات المتماثلة (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يشرح معنى المصطلحات: الجين، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح المقصود بأزواج الكروموسومات المتماثلة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يفسر ضرورة الانقسام المنصف في تكوين الأمشاج للحفاظ على عدد الكروموسومات ثابتًا<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: صورة نمط نووي (كاريوتايب) للإنسان<\/span><\/div>", "<p>الجين، الكروموسوم، أحادي المجموعة الكروموسومية ‎(n)‎، ثنائي المجموعة الكروموسومية ‎(2n)‎، الكروموسومات المتماثلة، الأمشاج، الإخصاب، الانقسام المنصف.<\/p>", "<p>يعرض المعلم صورة نمط نووي للإنسان ويسأل: «إذا كانت خلية الأب وخلية الأم تحتوي كل منهما 46 كروموسومًا، فلماذا لا يحمل الطفل 92؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم النمط النووي ويطرح السؤال، والطلبة يقترحون تفسيرًا لثبات عدد الكروموسومات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الجين والموقع الجيني و‎n‎ و‎2n‎ والكروموسومات المتماثلة بالأشكال 2-1 إلى 2-3، والطلبة يحددون الأزواج المتماثلة على صورة النمط النووي (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلّف المجموعات بمخطط لدورة حياة الإنسان يوضح مواقع الانقسام المنصف والإخصاب وعدد الكروموسومات، والطلبة يرسمون المخطط ويكتبون ‎n‎ أو ‎2n‎ عند كل مرحلة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي ويوجه حل السؤالين 1 و2، والطلبة يجيبون فرديًا ثم يتبادلون التصحيح (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما عدد الكروموسومات في مشيج الإنسان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 23 كروموسومًا ‎(n)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما المقصود بالكروموسومات المتماثلة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: زوج كروموسومات متشابهان في الطول وموقع السنترومير وتحمل الجينات نفسها في المواقع نفسها، أحدهما من الأب والآخر من الأم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يحدث لعدد الكروموسومات عبر الأجيال لو تكونت الأمشاج بالانقسام المتساوي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: سيتضاعف في كل جيل.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف ثنائي المجموعة الكروموسومية.<br><span style=\"opacity:.85\">• الإجابة النموذجية: خلية تحتوي مجموعتين كاملتين من الكروموسومات ‎(2n)‎، واحدة من كل أب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا لا تحمل الكروموسومات المتماثلة بالضرورة الأليلات نفسها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنها تحمل الجينات نفسها، لكن قد يكون لكل جين أليلان مختلفان على الكروموسومين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> خلية جسمية في حيوان فيها 38 كروموسومًا. كم كروموسومًا في مشيجه؟ وكم زوجًا متماثلًا في خليته الجسمية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: المشيج 19 كروموسومًا، والخلية الجسمية فيها 19 زوجًا متماثلًا.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 45–47 وحل السؤالين 1 و2<\/p><p><b>إرشاد لولي الأمر:<\/b> الحديث مع الابن عن سبب تشابه الأبناء مع الوالدين واختلافهم في الوقت نفسه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=6<\/p>"]}, {"axis": "سلوك الكروموسومات في أطوار الانقسام الاختزالي", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 2: الوراثة"], ["الدرس", "الأمشاج والتكاثر"], ["الحصة", "2 من 3"], ["محور الحصة", "سلوك الكروموسومات في أطوار الانقسام الاختزالي"], ["الأسبوع والتاريخ", "الأسبوع الخامس (4–8/10/2026)"], ["كتاب الطالب", "ص 47–50"], ["دليل المعلم", "ص 79–83"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 2-1: دراسة أطوار الانقسام الاختزالي في المتك ص 57"]], "t": ["1. يصف سلوك الكروموسومات في الانقسامين الأول والثاني من الانقسام الاختزالي (10 دقائق)\n2. يميز بين أحداث الطور التمهيدي الأول والاستوائي الأول والانفصالي الأول ونظائرها في الانقسام الثاني (10 دقائق)\nمخرج تعليمي آخر: ينمذج الانقسام الاختزالي باستخدام نماذج كروموسومات ملونة (20 دقيقة)", "1. فهم: يصف سلوك الكروموسومات في الانقسامين الأول والثاني من الانقسام الاختزالي\n2. تحليل: يميز بين أحداث الطور التمهيدي الأول والاستوائي الأول والانفصالي الأول ونظائرها في الانقسام الثاني\n3. تطبيق (مخرج آخر): ينمذج الانقسام الاختزالي باستخدام نماذج كروموسومات ملونة", "- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)", "الانقسام الاختزالي الأول والثاني، الطور التمهيدي، الاستوائي، الانفصالي، النهائي، الثنائيات (الأزواج المتماثلة المتقابلة)، الكروماتيدات الشقيقة.", "يعرض المعلم ثنائيتين من نماذج الكروموسومات (ملونة بلون الأب ولون الأم) ويسأل: «كيف تتوزع هذه على أربع خلايا بحيث تحصل كل خلية على نسخة واحدة من كل كروموسوم؟»", "1. يعرض المعلم النماذج ويطرح التحدي، والطلبة يقترحون طريقة التوزيع (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم أطوار الانقسامين بالأشكال 2-4 إلى 2-6 مع التركيز على انفصال الكروموسومات المتماثلة في الأول والكروماتيدات في الثاني، والطلبة يملؤون جدولًا لأحداث كل طور (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجه المعلم نمذجة الانقسام الاختزالي بالنماذج الملونة في مجموعات (نشاط دليل المعلم)، والطلبة يحركون النماذج عبر الأطوار ويصوّرون أو يرسمون كل طور (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. يدير المعلم التقويم الختامي، والطلبة يجيبون ويقارنون الانقسام الاختزالي بالمتساوي (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ماذا ينفصل في الطور الانفصالي الأول؟\n• الإجابة النموذجية: الكروموسومات المتماثلة.\n\n2. مستوى التطبيق: ماذا ينفصل في الطور الانفصالي الثاني؟\n• الإجابة النموذجية: الكروماتيدات الشقيقة.\n\n3. مستوى الاستدلال: لماذا تكون الخلايا الناتجة من الانقسام الأول أحادية المجموعة رغم احتواء كل كروموسوم على كروماتيدين؟\n• الإجابة النموذجية: لأن كل خلية تحتوي كروموسومًا واحدًا من كل زوج متماثل.", "1. مستوى المعرفة: كم خلية تنتج من الانقسام الاختزالي؟ وما عدد مجموعاتها الكروموسومية؟\n• الإجابة النموذجية: أربع خلايا أحادية المجموعة الكروموسومية ‎(n)‎.\n\n2. مستوى التطبيق: صف ما يحدث للكروموسومات المتماثلة في الطور الاستوائي الأول.\n• الإجابة النموذجية: تصطف أزواجًا (ثنائيات) على خط الاستواء.\n\n3. مستوى الاستدلال: قارن بين الطور الاستوائي الأول والطور الاستوائي الثاني.\n• الإجابة النموذجية: الأول: الكروموسومات المتماثلة تصطف أزواجًا؛ الثاني: الكروموسومات تصطف منفردة وكل منها مكون من كروماتيدين.", "إرشاد للطالب: مراجعة ص 47–50 ورسم مخطط للأطوار الثمانية\nإرشاد لولي الأمر: تشجيع الابن على شرح أطوار الانقسام الاختزالي باستخدام أدوات منزلية بسيطة كالأقلام الملونة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=6"], "h": ["<ol class=\"ol\"><li>يصف سلوك الكروموسومات في الانقسامين الأول والثاني من الانقسام الاختزالي (10  بطاقات مصطلحات، كتاب التجارب العملية والأنشطة<\/span><\/div>", "<p>الأليل، السائد، المتنحي، السيادة المشتركة، متماثل الأليلات، متباين الأليلات، الطراز الجيني، الطراز المظهري.<\/p>", "<p>يعرض المعلم صورًا لطلبة بخاصية ثني اللسان وعدمها ويسأل: «هل ما نراه هو الجينات نفسها؟ أم أثرها؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الأمثلة ويفرّق بين ما نراه وما نرثه، والطلبة يقترحون الفرق بين الطراز الجيني والمظهري (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> ينظم المعلم نشاط «الدوارة (كاروسيل) المصطلحات العلمية الرئيسية» (دليل المعلم ص 90)، والطلبة يتنقلون بين المحطات ويكتبون تعريفًا ومثالًا لكل مصطلح (16 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجه المعلم حل نشاط 2-2 «مصطلحات في علم الوراثة» (كتاب التجارب ص 44)، والطلبة يحلون النشاط في أزواج (14 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الدوارة (الكاروسيل).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – أليلات المها: يسحب كل زوج بطاقتي أليلين لصفة افتراضية في المها العربي، ويحدد الطراز الجيني والمظهري، ثم يناقش أهمية التنوع الجيني في جهود حماية المها في عمان (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على اللعب.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقصود بالأليل المتنحي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أليل لا يظهر أثره في الطراز المظهري إلا عند وجوده بنسختين (متماثل الأليلات).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب طرازين جينيين متماثلين وطرازًا متباينًا لجين رمزه ‎A‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: متماثلان: ‎AA‎ و‎aa‎؛ متباين: ‎Aa‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ماذا يعني أن أليلين يُظهران سيادة مشتركة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: يظهر أثر الأليلين معًا في الطراز المظهري للفرد متباين الأليلات.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف الطراز المظهري.<br><span style=\"opacity:.85\">• الإجابة النموذجية: الصفات الظاهرة أو القابلة للقياس في الكائن الحي الناتجة عن تفاعل الطراز الجيني مع البيئة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يمكن أن يتشابه الطراز المظهري لفردين مختلفين في الطراز الجيني؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأليل السائد يظهر أثره في ‎AA‎ و‎Aa‎ معًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> صنّف: (فصيلة الدم ‎AB‎، لون البازلاء الأصفر ‎Yy‎، المهق ‎aa‎) حسب نمط الوراثة والطراز الجيني.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AB‎ سيادة مشتركة ومتباين الأليلات؛ ‎Yy‎ سيادة تامة ومتباين؛ ‎aa‎ متنحٍ متماثل الأليلات.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 55 وإكمال نشاط 2-2 وإعداد بطاقات للمصطلحات<\/p><p><b>إرشاد لولي الأمر:<\/b> مساعدة الابن على تسميع المصطلحات باستخدام البطاقات<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=8<\/p>"]}]}, {"title": " : التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: ما أنواع الأمشاج التي ينتجها الفرد ‎Tt‎؟\n• الإجابة النموذجية: ‎T‎ و‎t‎.\n\n2. مستوى التطبيق: ما نسبة الطرز المظهرية في نسل ‎Tt × Tt (‎سيادة تامة)؟\n• الإجابة النموذجية: 3 سائد : 1 متنحٍ.\n\n3. مستوى الاستدلال: ما نسبة الطرز الجينية في نسل ‎Tt × Tt‎؟\n• الإجابة النموذجية: ‎1 TT : 2 Tt : 1 tt‎.", "1. مستوى المعرفة: ما المقصود بالجيل الأول ‎F1‎؟\n• الإجابة النموذجية: النسل الناتج من تزاوج الآباء الأصليين (الجيل الأبوي ‎P‎).\n\n2. مستوى التطبيق: اكتب مخطط وراثة لتزاوج ‎Aa × aa‎ ونسب النسل.\n• الإجابة النموذجية: الأمشاج: ‎A‎ و‎a‎ من الأول، و‎a‎ من الثاني؛ النسل: ‎1 Aa : 1 aa‎؛ أي 50% سائد و50% متنحٍ.\n\n3. مستوى الاستدلال: أبوان غير مصابين أنجبا طفلًا مصابًا بالمهق. ما احتمال أن يكون الطفل التالي مصابًا؟ فسّر.\n• الإجابة النموذجية: الأبوان ‎Aa‎، ومن مخطط ‎Aa × Aa‎ احتمال ‎aa = 1/4 (25%)‎ لكل طفل مستقل.", "إرشاد للطالب: مراجعة ص 56–57 وحل مسألتين إضافيتين بمخطط كامل\nإرشاد لولي الأمر: متابعة الابن في كتابة خطوات مخطط الوراثة بالترتيب الصحيح\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=9"], "h": ["<ol class=\"ol\"><li>يكتب مخطط وراثة كاملًا لتزاوج أحادي الهجين (الطرز الجينية للآباء، الأمشاج، مربع بانيت، النسب) (10 دقائق)<\/li><li>يشرح معنى الجيل الأول ‎F1‎ والجيل الثاني ‎F2‎ (10 دقائق)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بنسب الطرز الجينية والمظهرية في نسل تزاوج ‎Aa × Aa‎ (20 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> يكتب مخطط وراثة كاملًا لتزاوج أحادي الهجين (الطرز الجينية للآباء، الأمشاج، مربع بانيت، النسب)<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح معنى الجيل الأول ‎F1‎ والجيل الثاني ‎F2‎<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يتنبأ بنسب الطرز ال t:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يحلل نتائج تلقيح اختباري لاستنتاج الطراز الجيني للأب المجهول<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات<\/span><span class=\"chip\">التعلم التعاوني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">الأقلام<\/span><span class=\"chip r\">صورة توضيحية<\/span><\/div>", "<p>السيادة المشتركة، الأليلات المتعددة، فصائل الدم ‎ABO‎، ‎Iᴬ‎ و‎Iᴮ‎ و‎Iᴼ‎، التلقيح الاختباري.<\/p>", "<p>يسأل المعلم: «لماذا تحتاج بنوك الدم إلى معرفة فصيلة دمك؟ وكيف تكون فصيلة دم الابن ‎O‎ من أبوين ‎A‎ و‎B‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم السؤال ويسجل التخمينات، والطلبة يقترحون الطرز الجينية الممكنة (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم الأليلات الثلاثة لفصائل الدم وعلاقات السيادة والسيادة المشتركة، والطلبة يكتبون الطرز الجينية الستة والطرز المظهرية الأربعة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يشرح المعلم التلقيح الاختباري بمثال حيوان سائد الصفة مجهول الطراز، والطلبة يرسمون مخططي الاحتمالين ويستنتجون قاعدة الاستدلال (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم المبني على حل المشكلات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> ينظم المعلم «تحدي البنك» بمسائل فصائل الدم في المجموعات ثم التقويم الختامي، والطلبة يحلون المسائل ويعرضون الحلول (11 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الطرز الجينية الممكنة لفصيلة الدم ‎A‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎IᴬIᴬ‎ أو ‎IᴬIᴼ‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الطراز الذي يُستخدم في التلقيح الاختباري؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: فرد متماثل الأليلات المتنحية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> أبوان ‎IᴬIᴼ × IᴮIᴼ‎. ما الفصائل الممكنة للأبناء؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎AB‎ و‎A‎ و‎B‎ و‎O‎ بنسبة 1:1:1:1.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لماذا تُعدّ فصيلة الدم ‎AB‎ مثالًا على السيادة المشتركة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الأليلين ‎Iᴬ‎ و‎Iᴮ‎ يظهر أثرهما معًا في الطراز المظهري.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لُقّح نبات طويل مجهول الطراز مع نبات قصير ‎tt‎ فكان نصف النسل قصيرًا. ما طراز النبات الطويل؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎Tt‎، لأن ظهور النسل القصير يعني أنه أعطى أمشاجًا ‎t‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> هل يمكن لأبوين فصيلتهما ‎AB‎ و‎O‎ إنجاب طفل فصيلته ‎AB‎ أو ‎O‎؟ فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لا؛ الأبناء يرثون ‎Iᴬ‎ أو ‎Iᴮ‎ من الأب ‎AB‎ و‎Iᴼ‎ من الآخر، فيكونون ‎IᴬIᴼ (A)‎ أو ‎IᴮIᴼ (B)‎ فقط.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 57–58 وحل مسائل فصائل الدم
