<header><div class="wrap" style="padding-bottom:0">

<div class="mode" id="mode"><button data-m="sep" class="on">تحضير منفصل</button><button data-m="com">تحضير مدمج</button></div>
<div class="explain"><b>المنفصل:</b> نموذج نور مستقل لكل حصة؛ اختر الحصة ثم انسخ بنودها العشرة.</div>
<div class="explain"><b>المدمج:</b> نموذج واحد للدرس كله؛ كل بند يضم حصص الدرس بعناوين «الحصة 1، الحصة 2…».</div>

<script>
const FIELDS=["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const D=[{"title":"تركيب ‎DNA‎ و‎RNA‎","sb":"ص 20–26","unit":"الوحدة 1: الأحماض النووية وبناء البروتين","periods":[{"axis":"مكونات النيوكليوتيد وأنواع القواعد النيتروجينية","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تركيب ‎DNA‎ و‎RNA‎"],["الحصة","1 من 5"],["محور الحصة","مكونات النيوكليوتيد وأنواع القواعد النيتروجينية"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 20–21"],["دليل المعلم","ص 46–49"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]],"t":["1. يصف تركيب النيوكليوتيد من سكر خماسي ومجموعة فوسفات وقاعدة نيتروجينية\n2. يصنّف القواعد النيتروجينية إلى بيورينات (أدنين، جوانين) وبيريميدينات (سايتوسين، ثايمين، يوراسيل) وفق عدد الحلقات\nمخرج تعليمي آخر: يقارن بين سكر الرايبوز وسكر الديؤكسي رايبوز في النيوكليوتيدات","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم التعاوني\n- التعلم بالاكتشاف\n- العصف الذهني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بطاقات أشكال القواعد النيتروجينية","النيوكليوتيد، السكر الخماسي، الرايبوز، الديؤكسي رايبوز، مجموعة الفوسفات، القاعدة النيتروجينية، البيورين، البيريميدين.","يعرض المعلم صورة لبصمة وراثية ويسأل: «ما الجزيء الذي يجعل كل إنسان مختلفًا عن غيره؟ ومن أي وحدات بنائية يتكون؟» ويستحضر مع الطلبة ما درسوه سابقًا عن البوليمرات والمونومرات، ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض صورة البصمة الوراثية ويدير نقاش التعلم القبلي حول البوليمرات ويسجل الأفكار على السبورة\nالطالب: يستدعون أمثلة لبوليمرات ومونومراتها ويجيبون عن مهام «قبل أن تبدأ بدراسة الوحدة»\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يعرض الشكل 1-1 في كتاب الطالب ص 20 ويشرح مكونات النيوكليوتيد الثلاثة وموقع ارتباطها بالسكر\nالطالب: يرسمون نيوكليوتيدًا مبسطًا ويسمّون أجزاءه ويحددون الكربون 1′ و5′ في السكر\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يوزع بطاقات أشكال القواعد الخمس على المجموعات ويطلب تصنيفها وفق عدد الحلقات قبل الكشف عن المصطلحين\nالطالب: يصنّفون القواعد في مجموعات تعاونية ويستنتجون الفرق بين البيورين والبيريميدين ويعرضون تصنيفهم\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير تقويمًا ختاميًا شفهيًا وكتابيًا ويوضح الأخطاء الشائعة (الخلط بين الرايبوز والديؤكسي رايبوز)\nالطالب: يجيبون عن أسئلة التقويم في الدفتر ويصححون إجاباتهم مع زملائهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: سمِّ المكونات الثلاثة للنيوكليوتيد.\n   الإجابة النموذجية: سكر خماسي، ومجموعة فوسفات، وقاعدة نيتروجينية.\n2) (المستوى المتوقع) السؤال: صنّف القواعد: أدنين، سايتوسين، جوانين، يوراسيل إلى بيورينات وبيريميدينات.\n   الإجابة النموذجية: البيورينات: أدنين وجوانين (حلقتان)؛ البيريميدينات: سايتوسين ويوراسيل (حلقة واحدة).\n3) (المستوى المتقدم) السؤال: لماذا يسمى سكر ‎DNA‎ بالديؤكسي رايبوز؟\n   الإجابة النموذجية: لأنه ينقصه ذرة أكسجين واحدة عند الكربون 2′ مقارنة بسكر الرايبوز (يحمل ‎H‎ بدل ‎OH‎).","1) (مستوى الدعم) السؤال: أي القواعد الخمس لا توجد في ‎DNA‎؟\n   الإجابة النموذجية: اليوراسيل ‎(U)‎.\n2) (المستوى المتوقع) السؤال: ارسم نيوكليوتيدًا مبسطًا واكتب أسماء أجزائه.\n   الإجابة النموذجية: رسم يوضح الفوسفات مرتبطًا بالكربون 5′ للسكر الخماسي والقاعدة مرتبطة بالكربون 1′.\n3) (المستوى المتقدم) السؤال: فسّر: يكفي معرفة نوع السكر ونوع القاعدة لتحديد ما إذا كان النيوكليوتيد من ‎DNA‎ أو ‎RNA‎.\n   الإجابة النموذجية: لأن ‎DNA‎ يحتوي ديؤكسي رايبوز والثايمين، أما ‎RNA‎ فيحتوي الرايبوز واليوراسيل؛ فوجود أيٍّ منهما يحدد نوع الحمض.","إرشاد للطالب: مراجعة كتاب الطالب ص 20–21 وتلخيص مكونات النيوكليوتيد في جدول\nإرشاد لولي الأمر: متابعة الابن في رسم نيوكليوتيد مبسط وتسمية أجزائه في الدفتر"],"h":["<ol class=\"ol\"><li>يصف تركيب النيوكليوتيد من سكر خماسي ومجموعة فوسفات وقاعدة نيتروجينية</li><li>يصنّف القواعد النيتروجينية إلى بيورينات (أدنين، جوانين) وبيريميدينات (سايتوسين، ثايمين، يوراسيل) وفق عدد الحلقات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقارن بين سكر الرايبوز وسكر الديؤكسي رايبوز في النيوكليوتيدات</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب النيوكليوتيد من سكر خماسي ومجموعة فوسفات وقاعدة نيتروجينية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصنّف القواعد النيتروجينية إلى بيورينات (أدنين، جوانين) وبيريميدينات (سايتوسين، ثايمين، يوراسيل) وفق عدد الحلقات</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقارن بين سكر الرايبوز وسكر الديؤكسي رايبوز في النيوكليوتيدات</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">العصف الذهني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: بطاقات أشكال القواعد النيتروجينية</span></div>","<p>النيوكليوتيد، السكر الخماسي، الرايبوز، الديؤكسي رايبوز، مجموعة الفوسفات، القاعدة النيتروجينية، البيورين، البيريميدين.</p>","<p>يعرض المعلم صورة لبصمة وراثية ويسأل: «ما الجزيء الذي يجعل كل إنسان مختلفًا عن غيره؟ ومن أي وحدات بنائية يتكون؟» ويستحضر مع الطلبة ما درسوه سابقًا عن البوليمرات والمونومرات، ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض صورة البصمة الوراثية ويدير نقاش التعلم القبلي حول البوليمرات ويسجل الأفكار على السبورة</td><td>يستدعون أمثلة لبوليمرات ومونومراتها ويجيبون عن مهام «قبل أن تبدأ بدراسة الوحدة»</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يعرض الشكل 1-1 في كتاب الطالب ص 20 ويشرح مكونات النيوكليوتيد الثلاثة وموقع ارتباطها بالسكر</td><td>يرسمون نيوكليوتيدًا مبسطًا ويسمّون أجزاءه ويحددون الكربون 1′ و5′ في السكر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوزع بطاقات أشكال القواعد الخمس على المجموعات ويطلب تصنيفها وفق عدد الحلقات قبل الكشف عن المصطلحين</td><td>يصنّفون القواعد في مجموعات تعاونية ويستنتجون الفرق بين البيورين والبيريميدين ويعرضون تصنيفهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير تقويمًا ختاميًا شفهيًا وكتابيًا ويوضح الأخطاء الشائعة (الخلط بين الرايبوز والديؤكسي رايبوز)</td><td>يجيبون عن أسئلة التقويم في الدفتر ويصححون إجاباتهم مع زملائهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>سمِّ المكونات الثلاثة للنيوكليوتيد.</td><td>سكر خماسي، ومجموعة فوسفات، وقاعدة نيتروجينية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صنّف القواعد: أدنين، سايتوسين، جوانين، يوراسيل إلى بيورينات وبيريميدينات.</td><td>البيورينات: أدنين وجوانين (حلقتان)؛ البيريميدينات: سايتوسين ويوراسيل (حلقة واحدة).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يسمى سكر ‎DNA‎ بالديؤكسي رايبوز؟</td><td>لأنه ينقصه ذرة أكسجين واحدة عند الكربون 2′ مقارنة بسكر الرايبوز (يحمل ‎H‎ بدل ‎OH‎).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أي القواعد الخمس لا توجد في ‎DNA‎؟</td><td>اليوراسيل ‎(U)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ارسم نيوكليوتيدًا مبسطًا واكتب أسماء أجزائه.</td><td>رسم يوضح الفوسفات مرتبطًا بالكربون 5′ للسكر الخماسي والقاعدة مرتبطة بالكربون 1′.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>فسّر: يكفي معرفة نوع السكر ونوع القاعدة لتحديد ما إذا كان النيوكليوتيد من ‎DNA‎ أو ‎RNA‎.</td><td>لأن ‎DNA‎ يحتوي ديؤكسي رايبوز والثايمين، أما ‎RNA‎ فيحتوي الرايبوز واليوراسيل؛ فوجود أيٍّ منهما يحدد نوع الحمض.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة كتاب الطالب ص 20–21 وتلخيص مكونات النيوكليوتيد في جدول</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في رسم نيوكليوتيد مبسط وتسمية أجزائه في الدفتر</p>"]},{"axis":"النيوكليوتيد المفسفر ‎ATP‎ وتكوين عديد النيوكليوتيد","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تركيب ‎DNA‎ و‎RNA‎"],["الحصة","2 من 5"],["محور الحصة","النيوكليوتيد المفسفر ‎ATP‎ وتكوين عديد النيوكليوتيد"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 21–22"],["دليل المعلم","ص 46–49"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]],"t":["1. يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات\n2. يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات\nمخرج تعليمي آخر: يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: مشابك ورقية ملونة لنمذجة الروابط","‎ATP‎، النيوكليوتيد المفسفر، رابطة فوسفوداي إستر، تفاعل التكثيف، عديد النيوكليوتيد، العمود الفقري (سكر–فوسفات)، الطرف 5′، الطرف 3′.","يسأل المعلم: «ما مصدر الطاقة المباشر في الخلية؟» ثم يكتب ‎ATP‎ على السبورة ويطلب من الطلبة تخمين ما تعنيه الحروف ‎A‎ و‎T‎ و‎P‎، ليربط بين الطاقة والنيوكليوتيدات.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح سؤال الطاقة في الخلية ويستقبل تخمينات الطلبة لمعنى ‎ATP‎\nالطالب: يخمّنون معنى الاختصار ويربطونه بالأدنين والرايبوز والفوسفات\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يشرح تركيب ‎ATP (‎أدنين + رايبوز + 3 مجموعات فوسفات) ويقارنه بنيوكليوتيد ‎RNA‎\nالطالب: يرسمون ‎ATP‎ مبسطًا ويحددون أوجه الشبه مع نيوكليوتيد ‎RNA‎\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوجّه نشاط نمذجة: كل مجموعة تربط 4 نيوكليوتيدات ورقية بتفاعلات تكثيف وتحدد موقع رابطة فوسفوداي إستر\nالطالب: يبنون شريطًا من النماذج ويحددون الطرفين 5′ و3′ ويكتبون عدد جزيئات الماء الناتجة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يطرح أسئلة التقويم الختامي ويعالج الخلط بين الرابطة الهيدروجينية ورابطة فوسفوداي إستر\nالطالب: يجيبون فرديًا ثم يتبادلون الدفاتر للتصحيح\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كم مجموعة فوسفات في جزيء ‎ATP‎؟\n   الإجابة النموذجية: ثلاث مجموعات فوسفات.\n2) (المستوى المتوقع) السؤال: ما الرابطة التي تربط نيوكليوتيدين متجاورين في الشريط نفسه؟\n   الإجابة النموذجية: رابطة فوسفوداي إستر بين فوسفات نيوكليوتيد وسكر النيوكليوتيد التالي.\n3) (المستوى المتقدم) السؤال: كم جزيء ماء ينتج عند تكوين شريط من 10 نيوكليوتيدات؟\n   الإجابة النموذجية: 9 جزيئات ماء (بعدد الروابط المتكونة).","1) (مستوى الدعم) السؤال: ما نوع السكر في جزيء ‎ATP‎؟\n   الإجابة النموذجية: الرايبوز.\n2) (المستوى المتوقع) السؤال: صف كيف يتكون العمود الفقري لشريط عديد النيوكليوتيد.\n   الإجابة النموذجية: يرتبط فوسفات نيوكليوتيد بالكربون 3′ لسكر النيوكليوتيد السابق بتفاعل تكثيف مكونًا رابطة فوسفوداي إستر، فتتكرر وحدات سكر–فوسفات على طول الشريط.\n3) (المستوى المتقدم) السؤال: فسّر: يُعدّ ‎ATP‎ نيوكليوتيدًا رغم أن وظيفته نقل الطاقة.\n   الإجابة النموذجية: لأنه يتكون من قاعدة (أدنين) وسكر خماسي (رايبوز) ومجموعات فوسفات، وهي مكونات النيوكليوتيد نفسها، والفرق فقط في عدد مجموعات الفوسفات.","إرشاد للطالب: قراءة كتاب الطالب ص 21–22 ورسم ‎ATP‎ وشريط من ثلاثة نيوكليوتيدات\nإرشاد لولي الأمر: تشجيع الابن على شرح الفرق بين ‎ATP‎ ونيوكليوتيد ‎RNA‎ بأسلوبه"],"h":["<ol class=\"ol\"><li>يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات</li><li>يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: مشابك ورقية ملونة لنمذجة الروابط</span></div>","<p>‎ATP‎، النيوكليوتيد المفسفر، رابطة فوسفوداي إستر، تفاعل التكثيف، عديد النيوكليوتيد، العمود الفقري (سكر–فوسفات)، الطرف 5′، الطرف 3′.</p>","<p>يسأل المعلم: «ما مصدر الطاقة المباشر في الخلية؟» ثم يكتب ‎ATP‎ على السبورة ويطلب من الطلبة تخمين ما تعنيه الحروف ‎A‎ و‎T‎ و‎P‎، ليربط بين الطاقة والنيوكليوتيدات.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح سؤال الطاقة في الخلية ويستقبل تخمينات الطلبة لمعنى ‎ATP‎</td><td>يخمّنون معنى الاختصار ويربطونه بالأدنين والرايبوز والفوسفات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يشرح تركيب ‎ATP (‎أدنين + رايبوز + 3 مجموعات فوسفات) ويقارنه بنيوكليوتيد ‎RNA‎</td><td>يرسمون ‎ATP‎ مبسطًا ويحددون أوجه الشبه مع نيوكليوتيد ‎RNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–30</span><br><small>15 دقيقة</small></td><td>يوجّه نشاط نمذجة: كل مجموعة تربط 4 نيوكليوتيدات ورقية بتفاعلات تكثيف وتحدد موقع رابطة فوسفوداي إستر</td><td>يبنون شريطًا من النماذج ويحددون الطرفين 5′ و3′ ويكتبون عدد جزيئات الماء الناتجة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يطرح أسئلة التقويم الختامي ويعالج الخلط بين الرابطة الهيدروجينية ورابطة فوسفوداي إستر</td><td>يجيبون فرديًا ثم يتبادلون الدفاتر للتصحيح</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كم مجموعة فوسفات في جزيء ‎ATP‎؟</td><td>ثلاث مجموعات فوسفات.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الرابطة التي تربط نيوكليوتيدين متجاورين في الشريط نفسه؟</td><td>رابطة فوسفوداي إستر بين فوسفات نيوكليوتيد وسكر النيوكليوتيد التالي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم جزيء ماء ينتج عند تكوين شريط من 10 نيوكليوتيدات؟</td><td>9 جزيئات ماء (بعدد الروابط المتكونة).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نوع السكر في جزيء ‎ATP‎؟</td><td>الرايبوز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف كيف يتكون العمود الفقري لشريط عديد النيوكليوتيد.</td><td>يرتبط فوسفات نيوكليوتيد بالكربون 3′ لسكر النيوكليوتيد السابق بتفاعل تكثيف مكونًا رابطة فوسفوداي إستر، فتتكرر وحدات سكر–فوسفات على طول الشريط.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>فسّر: يُعدّ ‎ATP‎ نيوكليوتيدًا رغم أن وظيفته نقل الطاقة.</td><td>لأنه يتكون من قاعدة (أدنين) وسكر خماسي (رايبوز) ومجموعات فوسفات، وهي مكونات النيوكليوتيد نفسها، والفرق فقط في عدد مجموعات الفوسفات.</td></tr></table>","<p><b>إرشاد للطالب:</b> قراءة كتاب الطالب ص 21–22 ورسم ‎ATP‎ وشريط من ثلاثة نيوكليوتيدات</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح الفرق بين ‎ATP‎ ونيوكليوتيد ‎RNA‎ بأسلوبه</p>"]},{"axis":"تركيب جزيء ‎DNA‎: اللولب المزدوج وتزاوج القواعد","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تركيب ‎DNA‎ و‎RNA‎"],["الحصة","3 من 5"],["محور الحصة","تركيب جزيء ‎DNA‎: اللولب المزدوج وتزاوج القواعد"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 22–24"],["دليل المعلم","ص 46–49"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]],"t":["1. يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه\n2. يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها\nمخرج تعليمي آخر: يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)","اللولب المزدوج، الشريطان المتعاكسان (المتوازيان عكسيًا)، تزاوج القواعد المتممة، الروابط الهيدروجينية، زوج ‎A–T (‎رابطتان)، زوج ‎C–G (‎ثلاث روابط).","يعرض المعلم نموذجًا مجسمًا للولب ‎DNA‎ ويسأل: «لماذا يبدو الشريطان متوازيين كدرجات سلم، وما الذي يثبت الدرجات؟» ثم يعرض صورة حيود الأشعة السينية لروزاليند فرانكلين باختصار.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض نموذج اللولب المزدوج ويطرح سؤال الدرجات\nالطالب: يتأملون النموذج ويقترحون ما يربط الشريطين\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الشكلين في ص 22–23: الاتجاه المتعاكس، وتزاوج البيورين مع البيريميدين، وعدد الروابط الهيدروجينية\nالطالب: يكملون مخططًا لشريطين ويكتبون الطرفين 5′ و3′ لكل شريط\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يقدّم مسائل نسب القواعد (قاعدة شارجاف) ويحل مثالًا نموذجيًا\nالطالب: يحلون في أزواج مسألتين لحساب نسب القواعد ويعرضون الحل على السبورة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يطرح سؤالًا مفصليًا: «لماذا يكون عرض اللولب ثابتًا؟» ثم يدير التقويم الختامي\nالطالب: يجيبون ويفسرون ثبات العرض بتزاوج قاعدة ذات حلقتين مع قاعدة ذات حلقة واحدة\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اكتب تتابع الشريط المتمم للشريط ‎5′-ATGCCA-3′‎.\n   الإجابة النموذجية: ‎3′-TACGGT-5′‎\n2) (المستوى المتوقع) السؤال: كم رابطة هيدروجينية بين ‎C‎ و‎G‎؟\n   الإجابة النموذجية: ثلاث روابط هيدروجينية.\n3) (المستوى المتقدم) السؤال: إذا كانت نسبة الأدنين 30% في عينة ‎DNA‎ فما نسبة الجوانين؟\n   الإجابة النموذجية: الثايمين 30%، فيبقى 40% لـ ‎C‎ و‎G‎ معًا؛ الجوانين = 20%.","1) (مستوى الدعم) السؤال: ما المقصود بأن شريطي ‎DNA‎ متعاكسا الاتجاه؟\n   الإجابة النموذجية: أن أحد الشريطين يمتد من 5′ إلى 3′ والآخر من 3′ إلى 5′ في الاتجاه نفسه.\n2) (المستوى المتوقع) السؤال: فسّر ثبات عرض جزيء ‎DNA‎ على طوله.\n   الإجابة النموذجية: لأن كل زوج قواعد يتكون من بيورين (حلقتان) وبيريميدين (حلقة واحدة)، فيكون طول كل زوج متساويًا.\n3) (المستوى المتقدم) السؤال: جزيء ‎DNA‎ فيه 1200 زوج قواعد، منها 320 زوجًا من ‎C–G‎. احسب عدد الروابط الهيدروجينية الكلي.\n   الإجابة النموذجية: أزواج ‎A–T = 880 × 2 = 1760‎، وأزواج ‎C–G = 320 × 3 = 960‎؛ المجموع 2720 رابطة.","إرشاد للطالب: مراجعة ص 22–24 وحل مسألتين إضافيتين في نسب القواعد\nإرشاد لولي الأمر: مساعدة الابن على كتابة أزواج القواعد وعدد روابطها في بطاقة مراجعة"],"h":["<ol class=\"ol\"><li>يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه</li><li>يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>اللولب المزدوج، الشريطان المتعاكسان (المتوازيان عكسيًا)، تزاوج القواعد المتممة، الروابط الهيدروجينية، زوج ‎A–T (‎رابطتان)، زوج ‎C–G (‎ثلاث روابط).</p>","<p>يعرض المعلم نموذجًا مجسمًا للولب ‎DNA‎ ويسأل: «لماذا يبدو الشريطان متوازيين كدرجات سلم، وما الذي يثبت الدرجات؟» ثم يعرض صورة حيود الأشعة السينية لروزاليند فرانكلين باختصار.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض نموذج اللولب المزدوج ويطرح سؤال الدرجات</td><td>يتأملون النموذج ويقترحون ما يربط الشريطين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الشكلين في ص 22–23: الاتجاه المتعاكس، وتزاوج البيورين مع البيريميدين، وعدد الروابط الهيدروجينية</td><td>يكملون مخططًا لشريطين ويكتبون الطرفين 5′ و3′ لكل شريط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يقدّم مسائل نسب القواعد (قاعدة شارجاف) ويحل مثالًا نموذجيًا</td><td>يحلون في أزواج مسألتين لحساب نسب القواعد ويعرضون الحل على السبورة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يطرح سؤالًا مفصليًا: «لماذا يكون عرض اللولب ثابتًا؟» ثم يدير التقويم الختامي</td><td>يجيبون ويفسرون ثبات العرض بتزاوج قاعدة ذات حلقتين مع قاعدة ذات حلقة واحدة</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب تتابع الشريط المتمم للشريط ‎5′-ATGCCA-3′‎.</td><td>‎3′-TACGGT-5′‎</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كم رابطة هيدروجينية بين ‎C‎ و‎G‎؟</td><td>ثلاث روابط هيدروجينية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا كانت نسبة الأدنين 30% في عينة ‎DNA‎ فما نسبة الجوانين؟</td><td>الثايمين 30%، فيبقى 40% لـ ‎C‎ و‎G‎ معًا؛ الجوانين = 20%.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بأن شريطي ‎DNA‎ متعاكسا الاتجاه؟</td><td>أن أحد الشريطين يمتد من 5′ إلى 3′ والآخر من 3′ إلى 5′ في الاتجاه نفسه.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>فسّر ثبات عرض جزيء ‎DNA‎ على طوله.</td><td>لأن كل زوج قواعد يتكون من بيورين (حلقتان) وبيريميدين (حلقة واحدة)، فيكون طول كل زوج متساويًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>جزيء ‎DNA‎ فيه 1200 زوج قواعد، منها 320 زوجًا من ‎C–G‎. احسب عدد الروابط الهيدروجينية الكلي.</td><td>أزواج ‎A–T = 880 × 2 = 1760‎، وأزواج ‎C–G = 320 × 3 = 960‎؛ المجموع 2720 رابطة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 22–24 وحل مسألتين إضافيتين في نسب القواعد</p><p><b>إرشاد لولي الأمر:</b> مساعدة الابن على كتابة أزواج القواعد وعدد روابطها في بطاقة مراجعة</p>"]},{"axis":"تركيب ‎RNA‎ والمقارنة بين ‎DNA‎ و‎RNA‎","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تركيب ‎DNA‎ و‎RNA‎"],["الحصة","4 من 5"],["محور الحصة","تركيب ‎RNA‎ والمقارنة بين ‎DNA‎ و‎RNA‎"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 24–26"],["دليل المعلم","ص 46–49"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]],"t":["1. يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد\n2. يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة\nمخرج تعليمي آخر: يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: فهم","- التعلم التعاوني\n- التعلم الذاتي\n- خريطة المفاهيم","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","‎RNA‎، الشريط المفرد، ‎RNA‎ المرسال ‎(mRNA)‎، ‎RNA‎ الناقل ‎(tRNA)‎، ‎RNA‎ الرايبوسومي ‎(rRNA)‎، اليوراسيل، الرايبوز.","يعرض المعلم جدولًا فارغًا بعنوان «توأمان مختلفان: ‎DNA‎ و‎RNA»‎ ويطلب من الطلبة توقع ثلاثة فروق قبل القراءة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الجدول الفارغ ويستقبل التوقعات\nالطالب: يكتبون ثلاثة فروق متوقعة في الدفتر\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يوجه قراءة ص 24–26 ويشرح تركيب ‎RNA‎ وأنواعه الثلاثة مع صور توضيحية\nالطالب: يقرؤون فرديًا ويحددون شكل كل نوع من أنواع ‎RNA‎\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يكلّف المجموعات بإكمال جدول المقارنة ورسم خريطة مفاهيم تربط ‎DNA‎ و‎RNA‎ بالبروتين\nالطالب: يكملون الجدول والخريطة تعاونيًا ويعرض ممثل كل مجموعة جزءًا منها\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي ويصحح المفهوم الخاطئ أن ‎RNA‎ لولب مزدوج\nالطالب: يجيبون عن الأسئلة ويراجعون توقعاتهم الأولى ويصححونها\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اذكر فرقين بين ‎DNA‎ و‎RNA‎.\n   الإجابة النموذجية: ‎DNA‎: ديؤكسي رايبوز وثايمين وشريطان؛ ‎RNA‎: رايبوز ويوراسيل وشريط مفرد.\n2) (المستوى المتوقع) السؤال: أي أنواع ‎RNA‎ يبقى على شكل شريط غير ملتف؟\n   الإجابة النموذجية: ‎RNA‎ المرسال ‎(mRNA)‎.\n3) (المستوى المتقدم) السؤال: لماذا لا يتزاوج اليوراسيل مع الأدنين داخل جزيء ‎mRNA‎ عادة؟\n   الإجابة النموذجية: لأن ‎mRNA‎ شريط مفرد غير ملتف، فلا توجد قواعد متقابلة على شريط آخر لتتزاوج معها.","1) (مستوى الدعم) السؤال: ما القاعدة التي تحل محل الثايمين في ‎RNA‎؟\n   الإجابة النموذجية: اليوراسيل.\n2) (المستوى المتوقع) السؤال: املأ: ‎RNA‎ الناقل و ‎RNA‎ الرايبوسومي ينثنيان على شكل ... بينما يبقى ‎mRNA‎ ...\n   الإجابة النموذجية: تراكيب معقدة، شريطًا غير ملتف.\n3) (المستوى المتقدم) السؤال: قيّم العبارة: «‎RNA‎ نسخة مطابقة تمامًا لـ ‎DNA»‎.\n   الإجابة النموذجية: غير دقيقة؛ فـ ‎RNA‎ شريط مفرد يحوي الرايبوز واليوراسيل، ويكون متممًا لأحد شريطي ‎DNA‎ لا مطابقًا له.","إرشاد للطالب: مراجعة ص 24–26 وإكمال جدول المقارنة بين ‎DNA‎ و‎RNA‎ في الدفتر\nإرشاد لولي الأمر: سؤال الابن عن أنواع ‎RNA‎ الثلاثة ووظيفة كل منها باختصار"],"h":["<ol class=\"ol\"><li>يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد</li><li>يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام</td><td class=\"lv\">فهم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">خريطة المفاهيم</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>‎RNA‎، الشريط المفرد، ‎RNA‎ المرسال ‎(mRNA)‎، ‎RNA‎ الناقل ‎(tRNA)‎، ‎RNA‎ الرايبوسومي ‎(rRNA)‎، اليوراسيل، الرايبوز.</p>","<p>يعرض المعلم جدولًا فارغًا بعنوان «توأمان مختلفان: ‎DNA‎ و‎RNA»‎ ويطلب من الطلبة توقع ثلاثة فروق قبل القراءة.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الجدول الفارغ ويستقبل التوقعات</td><td>يكتبون ثلاثة فروق متوقعة في الدفتر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يوجه قراءة ص 24–26 ويشرح تركيب ‎RNA‎ وأنواعه الثلاثة مع صور توضيحية</td><td>يقرؤون فرديًا ويحددون شكل كل نوع من أنواع ‎RNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يكلّف المجموعات بإكمال جدول المقارنة ورسم خريطة مفاهيم تربط ‎DNA‎ و‎RNA‎ بالبروتين</td><td>يكملون الجدول والخريطة تعاونيًا ويعرض ممثل كل مجموعة جزءًا منها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي ويصحح المفهوم الخاطئ أن ‎RNA‎ لولب مزدوج</td><td>يجيبون عن الأسئلة ويراجعون توقعاتهم الأولى ويصححونها</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر فرقين بين ‎DNA‎ و‎RNA‎.</td><td>‎DNA‎: ديؤكسي رايبوز وثايمين وشريطان؛ ‎RNA‎: رايبوز ويوراسيل وشريط مفرد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي أنواع ‎RNA‎ يبقى على شكل شريط غير ملتف؟</td><td>‎RNA‎ المرسال ‎(mRNA)‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا يتزاوج اليوراسيل مع الأدنين داخل جزيء ‎mRNA‎ عادة؟</td><td>لأن ‎mRNA‎ شريط مفرد غير ملتف، فلا توجد قواعد متقابلة على شريط آخر لتتزاوج معها.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما القاعدة التي تحل محل الثايمين في ‎RNA‎؟</td><td>اليوراسيل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>املأ: ‎RNA‎ الناقل و ‎RNA‎ الرايبوسومي ينثنيان على شكل ... بينما يبقى ‎mRNA‎ ...</td><td>تراكيب معقدة، شريطًا غير ملتف.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم العبارة: «‎RNA‎ نسخة مطابقة تمامًا لـ ‎DNA»‎.</td><td>غير دقيقة؛ فـ ‎RNA‎ شريط مفرد يحوي الرايبوز واليوراسيل، ويكون متممًا لأحد شريطي ‎DNA‎ لا مطابقًا له.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 24–26 وإكمال جدول المقارنة بين ‎DNA‎ و‎RNA‎ في الدفتر</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن أنواع ‎RNA‎ الثلاثة ووظيفة كل منها باختصار</p>"]},{"axis":"الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل وحل أسئلة الموضوع","n":5,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تركيب ‎DNA‎ و‎RNA‎"],["الحصة","5 من 5"],["محور الحصة","الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل وحل أسئلة الموضوع"],["الأسبوع والتاريخ","الأسبوع الأول (6–10/9/2026)"],["كتاب الطالب","ص 20–26 + كتاب التجارب ص 32"],["دليل المعلم","ص 46–49"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]],"t":["1. ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات السلامة\n2. يفسر دور كل من المنظف والملح والإيثانول البارد في عملية الاستخلاص\nمخرج تعليمي آخر: يجيب عن أسئلة الموضوع 1-1 (1–3) موظفًا مفاهيم تركيب الأحماض النووية","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: أدوات الاستقصاء: بصل، منظف، ملح، إيثانول بارد، ورق ترشيح، أنابيب اختبار","الاستخلاص، الغشاء البلازمي، الغشاء النووي، المنظف، الترسيب، الإيثانول البارد، خيوط ‎DNA‎.","يسأل المعلم: «لو أردت رؤية ‎DNA‎ بالعين المجردة، كم خلية تحتاج؟ وكيف تخرجه من النواة؟» ويستقبل الاقتراحات قبل عرض أدوات الاستقصاء.","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يطرح سؤال التهيئة ويراجع قواعد السلامة في المختبر\nالطالب: يقترحون طرقًا لإخراج ‎DNA‎ ويستمعون لتعليمات السلامة\n2) (18 دقيقة: من الدقيقة 4 إلى 22)\nالمعلم: يوجّه تنفيذ الاستقصاء العملي 1-1 (كتاب التجارب ص 32) ويتابع عمل المجموعات\nالطالب: يهرسون البصل مع المنظف والملح ويرشحونه ثم يضيفون الإيثانول البارد ويلاحظون الخيوط\n3) (8 دقائق: من الدقيقة 22 إلى 30)\nالمعلم: يناقش النتائج ويسأل عن دور كل مادة\nالطالب: يفسرون: المنظف يذيب الأغشية، والملح يعادل شحنات ‎DNA‎ ويساعد تجمعه، والإيثانول يرسّب ‎DNA‎\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يوجه حل أسئلة الموضوع 1-1 (1–3) في كتاب الطالب ويراجع الإجابات\nالطالب: يحلون الأسئلة فرديًا ثم يناقشون الإجابات\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا نستخدم منظفًا في الاستخلاص؟\n   الإجابة النموذجية: لإذابة الدهون في الغشاء البلازمي والغشاء النووي وتحرير ‎DNA‎.\n2) (المستوى المتوقع) السؤال: ماذا نلاحظ عند إضافة الإيثانول البارد؟\n   الإجابة النموذجية: تظهر خيوط بيضاء لزجة من ‎DNA‎ عند حد الإيثانول مع المحلول.\n3) (المستوى المتقدم) السؤال: لماذا يترسب ‎DNA‎ في الإيثانول؟\n   الإجابة النموذجية: لأن ‎DNA‎ لا يذوب في الإيثانول فيتجمع ويترسب عند الحد الفاصل.","1) (مستوى الدعم) السؤال: اذكر احتياطين للسلامة في هذا الاستقصاء.\n   الإجابة النموذجية: الحذر عند استخدام السكين، وإبعاد الإيثانول عن اللهب، وارتداء النظارات الواقية.\n2) (المستوى المتوقع) السؤال: لماذا تكون الخيوط الظاهرة مكونة من ملايين جزيئات ‎DNA‎ لا جزيئًا واحدًا؟\n   الإجابة النموذجية: لأن جزيء ‎DNA‎ الواحد رفيع جدًا لا يُرى، والمرئي تجمع لعدد هائل من الجزيئات من خلايا كثيرة.\n3) (المستوى المتقدم) السؤال: اقترح طريقة للتأكد أن الخيوط المستخلصة ‎DNA‎ وليست بروتينًا.\n   الإجابة النموذجية: إضافة إنزيم بروتييز قبل الترسيب (يبقى الراسب)، أو استخدام صبغة خاصة بـ ‎DNA‎، أو معاملته بإنزيم يحلل ‎DNA‎ فيختفي الراسب.","إرشاد للطالب: كتابة تقرير مختصر عن الاستقصاء ومراجعة إجابات الأسئلة 1–3 ص 20–26\nإرشاد لولي الأمر: يمكن مشاركة الابن تجربة منزلية آمنة لاستخلاص ‎DNA‎ الفراولة بإشراف ولي الأمر"],"h":["<ol class=\"ol\"><li>ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات السلامة</li><li>يفسر دور كل من المنظف والملح والإيثانول البارد في عملية الاستخلاص</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يجيب عن أسئلة الموضوع 1-1 (1–3) موظفًا مفاهيم تركيب الأحماض النووية</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات السلامة</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر دور كل من المنظف والملح والإيثانول البارد في عملية الاستخلاص</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يجيب عن أسئلة الموضوع 1-1 (1–3) موظفًا مفاهيم تركيب الأحماض النووية</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: أدوات الاستقصاء: بصل، منظف، ملح، إيثانول بارد، ورق ترشيح، أنابيب اختبار</span></div>","<p>الاستخلاص، الغشاء البلازمي، الغشاء النووي، المنظف، الترسيب، الإيثانول البارد، خيوط ‎DNA‎.</p>","<p>يسأل المعلم: «لو أردت رؤية ‎DNA‎ بالعين المجردة، كم خلية تحتاج؟ وكيف تخرجه من النواة؟» ويستقبل الاقتراحات قبل عرض أدوات الاستقصاء.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يطرح سؤال التهيئة ويراجع قواعد السلامة في المختبر</td><td>يقترحون طرقًا لإخراج ‎DNA‎ ويستمعون لتعليمات السلامة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–22</span><br><small>18 دقيقة</small></td><td>يوجّه تنفيذ الاستقصاء العملي 1-1 (كتاب التجارب ص 32) ويتابع عمل المجموعات</td><td>يهرسون البصل مع المنظف والملح ويرشحونه ثم يضيفون الإيثانول البارد ويلاحظون الخيوط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">22–30</span><br><small>8 دقائق</small></td><td>يناقش النتائج ويسأل عن دور كل مادة</td><td>يفسرون: المنظف يذيب الأغشية، والملح يعادل شحنات ‎DNA‎ ويساعد تجمعه، والإيثانول يرسّب ‎DNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يوجه حل أسئلة الموضوع 1-1 (1–3) في كتاب الطالب ويراجع الإجابات</td><td>يحلون الأسئلة فرديًا ثم يناقشون الإجابات</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا نستخدم منظفًا في الاستخلاص؟</td><td>لإذابة الدهون في الغشاء البلازمي والغشاء النووي وتحرير ‎DNA‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا نلاحظ عند إضافة الإيثانول البارد؟</td><td>تظهر خيوط بيضاء لزجة من ‎DNA‎ عند حد الإيثانول مع المحلول.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يترسب ‎DNA‎ في الإيثانول؟</td><td>لأن ‎DNA‎ لا يذوب في الإيثانول فيتجمع ويترسب عند الحد الفاصل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر احتياطين للسلامة في هذا الاستقصاء.</td><td>الحذر عند استخدام السكين، وإبعاد الإيثانول عن اللهب، وارتداء النظارات الواقية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تكون الخيوط الظاهرة مكونة من ملايين جزيئات ‎DNA‎ لا جزيئًا واحدًا؟</td><td>لأن جزيء ‎DNA‎ الواحد رفيع جدًا لا يُرى، والمرئي تجمع لعدد هائل من الجزيئات من خلايا كثيرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح طريقة للتأكد أن الخيوط المستخلصة ‎DNA‎ وليست بروتينًا.</td><td>إضافة إنزيم بروتييز قبل الترسيب (يبقى الراسب)، أو استخدام صبغة خاصة بـ ‎DNA‎، أو معاملته بإنزيم يحلل ‎DNA‎ فيختفي الراسب.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير مختصر عن الاستقصاء ومراجعة إجابات الأسئلة 1–3 ص 20–26</p><p><b>إرشاد لولي الأمر:</b> يمكن مشاركة الابن تجربة منزلية آمنة لاستخلاص ‎DNA‎ الفراولة بإشراف ولي الأمر</p>"]}]},{"title":"تضاعف ‎DNA‎","sb":"ص 26–27","unit":"الوحدة 1: الأحماض النووية وبناء البروتين","periods":[{"axis":"خطوات تضاعف ‎DNA‎ ودور الإنزيمات","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تضاعف ‎DNA‎"],["الحصة","1 من 3"],["محور الحصة","خطوات تضاعف ‎DNA‎ ودور الإنزيمات"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 26–27"],["دليل المعلم","ص 50–53"],["كتاب التجارب العملية والأنشطة","نشاط 1-1: إجابة أسئلة الاختيار من متعدد عن ‎DNA‎ ص 24"]],"t":["1. يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة\n2. يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف\nمخرج تعليمي آخر: يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تذكر","- التعلم بالنمذجة\n- التعلم التعاوني\n- لعب الأدوار","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)","التضاعف، الطور ‎S‎، الانفكاك، ‎DNA‎ بوليميريز، ‎DNA‎ ليجيز، النيوكليوتيدات الحرة، الشريط الأصلي (القالب).","يسأل المعلم: «انقسمت خلية جلدك اليوم؛ كيف حصلت كل خلية جديدة على نسخة كاملة من ‎DNA‎؟» ويذكّر بدورة الخلية والطور ‎S‎.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح سؤال التهيئة ويعرض مخطط دورة الخلية\nالطالب: يحددون الطور الذي يتضاعف فيه ‎DNA‎\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات التضاعف باستخدام الشكل 1-7 (الانفكاك، ‎DNA‎ بوليميريز، الروابط الهيدروجينية، ‎DNA‎ ليجيز)\nالطالب: يرسمون مخططًا انسيابيًا لخطوات التضاعف\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: ينظم لعب أدوار: طلاب يمثلون الشريطين وآخرون ‎DNA‎ بوليميريز وليجيز ونيوكليوتيدات حرة\nالطالب: يمثلون العملية ويصفون دور كل «ممثل» بلغة علمية\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي ويوجه حل السؤال 4 في كتاب الطالب\nالطالب: يجيبون عن السؤال 4 (أ، ب، ج) ويصححون جماعيًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الذي يُكسر عند انفكاك شريطي ‎DNA‎؟\n   الإجابة النموذجية: الروابط الهيدروجينية بين القواعد المتزاوجة.\n2) (المستوى المتوقع) السؤال: ما وظيفة ‎DNA‎ بوليميريز؟\n   الإجابة النموذجية: إضافة نيوكليوتيدات حرة متممة واحدًا تلو الآخر لبناء الشريط الجديد.\n3) (المستوى المتقدم) السؤال: ما وظيفة ‎DNA‎ ليجيز؟\n   الإجابة النموذجية: ربط قطع الشريط الجديدة معًا بروابط فوسفوداي إستر.","1) (مستوى الدعم) السؤال: في أي جزء من الخلية حقيقية النواة يحدث تضاعف ‎DNA‎؟\n   الإجابة النموذجية: في النواة (وفي الميتوكوندريا والبلاستيدات الخضراء لـ ‎DNA‎ الخاص بها).\n2) (المستوى المتوقع) السؤال: كوّن قائمة بالجزيئات اللازمة لتضاعف ‎DNA‎.\n   الإجابة النموذجية: شريطا ‎DNA‎ الأصليان (قالب)، ونيوكليوتيدات حرة، وإنزيم ‎DNA‎ بوليميريز، وإنزيم ‎DNA‎ ليجيز، وطاقة.\n3) (المستوى المتقدم) السؤال: لماذا يجب أن يتضاعف ‎DNA‎ قبل الانقسام الخلوي؟\n   الإجابة النموذجية: لتحصل كل خلية ناتجة على نسخة كاملة مطابقة من المعلومات الوراثية.","إرشاد للطالب: مراجعة ص 26 وحل السؤال 4 في كتاب الطالب\nإرشاد لولي الأمر: مناقشة الابن في سبب تضاعف ‎DNA‎ قبل انقسام الخلية"],"h":["<ol class=\"ol\"><li>يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة</li><li>يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية</td><td class=\"lv\">تذكر</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">لعب الأدوار</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>التضاعف، الطور ‎S‎، الانفكاك، ‎DNA‎ بوليميريز، ‎DNA‎ ليجيز، النيوكليوتيدات الحرة، الشريط الأصلي (القالب).</p>","<p>يسأل المعلم: «انقسمت خلية جلدك اليوم؛ كيف حصلت كل خلية جديدة على نسخة كاملة من ‎DNA‎؟» ويذكّر بدورة الخلية والطور ‎S‎.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح سؤال التهيئة ويعرض مخطط دورة الخلية</td><td>يحددون الطور الذي يتضاعف فيه ‎DNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خطوات التضاعف باستخدام الشكل 1-7 (الانفكاك، ‎DNA‎ بوليميريز، الروابط الهيدروجينية، ‎DNA‎ ليجيز)</td><td>يرسمون مخططًا انسيابيًا لخطوات التضاعف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>ينظم لعب أدوار: طلاب يمثلون الشريطين وآخرون ‎DNA‎ بوليميريز وليجيز ونيوكليوتيدات حرة</td><td>يمثلون العملية ويصفون دور كل «ممثل» بلغة علمية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي ويوجه حل السؤال 4 في كتاب الطالب</td><td>يجيبون عن السؤال 4 (أ، ب، ج) ويصححون جماعيًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الذي يُكسر عند انفكاك شريطي ‎DNA‎؟</td><td>الروابط الهيدروجينية بين القواعد المتزاوجة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما وظيفة ‎DNA‎ بوليميريز؟</td><td>إضافة نيوكليوتيدات حرة متممة واحدًا تلو الآخر لبناء الشريط الجديد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما وظيفة ‎DNA‎ ليجيز؟</td><td>ربط قطع الشريط الجديدة معًا بروابط فوسفوداي إستر.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>في أي جزء من الخلية حقيقية النواة يحدث تضاعف ‎DNA‎؟</td><td>في النواة (وفي الميتوكوندريا والبلاستيدات الخضراء لـ ‎DNA‎ الخاص بها).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كوّن قائمة بالجزيئات اللازمة لتضاعف ‎DNA‎.</td><td>شريطا ‎DNA‎ الأصليان (قالب)، ونيوكليوتيدات حرة، وإنزيم ‎DNA‎ بوليميريز، وإنزيم ‎DNA‎ ليجيز، وطاقة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يجب أن يتضاعف ‎DNA‎ قبل الانقسام الخلوي؟</td><td>لتحصل كل خلية ناتجة على نسخة كاملة مطابقة من المعلومات الوراثية.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 26 وحل السؤال 4 في كتاب الطالب</p><p><b>إرشاد لولي الأمر:</b> مناقشة الابن في سبب تضاعف ‎DNA‎ قبل انقسام الخلية</p>"]},{"axis":"الشريط المتقدم والشريط المتأخر وقطع أوكازاكي","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تضاعف ‎DNA‎"],["الحصة","2 من 3"],["محور الحصة","الشريط المتقدم والشريط المتأخر وقطع أوكازاكي"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 26–27"],["دليل المعلم","ص 50–53"],["كتاب التجارب العملية والأنشطة","نشاط 1-1: إجابة أسئلة الاختيار من متعدد عن ‎DNA‎ ص 24"]],"t":["1. يفسر سبب تكوين الشريط المتقدم بصورة متصلة والمتأخر على شكل قطع\n2. يربط عمل ‎DNA‎ بوليميريز في الاتجاه 5′→3′ بآلية بناء الشريطين\nمخرج تعليمي آخر: يرسم مخططًا لشوكة التضاعف يوضح الشريطين وقطع أوكازاكي","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","الشريط المتقدم، الشريط المتأخر، قطع أوكازاكي، الاتجاه 5′ إلى 3′، اتجاه الانفكاك، شوكة التضاعف.","يعرض المعلم سهمين متعاكسين على السبورة ويقول: «إنزيم لا يمشي إلا في اتجاه واحد، وأمامه طريقان متعاكسان؛ كيف ينجز المهمة؟» ليولّد التساؤل حول الشريط المتأخر.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض لغز السهمين ويستقبل الحلول المقترحة\nالطالب: يقترحون حلولًا ويناقشونها\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح الشكل 1-7 ص 27: اتجاه الانفكاك، والشريط المتقدم، والمتأخر، وقطع أوكازاكي، ودور الليجيز\nالطالب: يحددون على الشكل اتجاه عمل البوليميريز على كل شريط\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يعرض محاكاة مرئية لشوكة التضاعف ويوجه رسم المخطط\nالطالب: يرسمون شوكة التضاعف ويكتبون الطرفين 5′ و3′ على كل شريط\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير سؤالًا مفصليًا ثم التقويم الختامي\nالطالب: يجيبون ويشرحون لزملائهم سبب تقطع الشريط المتأخر\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: في أي اتجاه يبني ‎DNA‎ بوليميريز الشريط الجديد؟\n   الإجابة النموذجية: من 5′ إلى 3′ فقط.\n2) (المستوى المتوقع) السؤال: أي الشريطين يُبنى بصورة متصلة؟\n   الإجابة النموذجية: الشريط المتقدم.\n3) (المستوى المتقدم) السؤال: لماذا يحتاج الشريط المتأخر إلى ‎DNA‎ ليجيز أكثر من المتقدم؟\n   الإجابة النموذجية: لأنه يُبنى على شكل قطع قصيرة (قطع أوكازاكي) يجب ربطها معًا.","1) (مستوى الدعم) السؤال: عرّف قطع أوكازاكي.\n   الإجابة النموذجية: قطع قصيرة من ‎DNA‎ تُبنى على الشريط المتأخر بعكس اتجاه الانفكاك ثم تُربط بواسطة ‎DNA‎ ليجيز.\n2) (المستوى المتوقع) السؤال: فسّر: يُبنى الشريط المتأخر بعكس اتجاه الانفكاك.\n   الإجابة النموذجية: لأن ‎DNA‎ بوليميريز يعمل في الاتجاه 5′→3′ فقط، والقالب في هذا الشريط موجّه بحيث يكون هذا الاتجاه معاكسًا لحركة الانفكاك.\n3) (المستوى المتقدم) السؤال: ارسم شوكة تضاعف وحدد عليها الشريط المتقدم والمتأخر وقطع أوكازاكي.\n   الإجابة النموذجية: رسم صحيح يبين الشريط المتقدم متصلًا باتجاه الانفكاك، والمتأخر قطعًا متتالية بالاتجاه المعاكس مع أطراف 5′ و3′ صحيحة.","إرشاد للطالب: مراجعة ص 27 ورسم شوكة التضاعف من الذاكرة\nإرشاد لولي الأمر: الطلب من الابن شرح لغز «الإنزيم ذي الاتجاه الواحد» لأحد أفراد الأسرة"],"h":["<ol class=\"ol\"><li>يفسر سبب تكوين الشريط المتقدم بصورة متصلة والمتأخر على شكل قطع</li><li>يربط عمل ‎DNA‎ بوليميريز في الاتجاه 5′→3′ بآلية بناء الشريطين</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يرسم مخططًا لشوكة التضاعف يوضح الشريطين وقطع أوكازاكي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يفسر سبب تكوين الشريط المتقدم بصورة متصلة والمتأخر على شكل قطع</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يربط عمل ‎DNA‎ بوليميريز في الاتجاه 5′→3′ بآلية بناء الشريطين</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يرسم مخططًا لشوكة التضاعف يوضح الشريطين وقطع أوكازاكي</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الشريط المتقدم، الشريط المتأخر، قطع أوكازاكي، الاتجاه 5′ إلى 3′، اتجاه الانفكاك، شوكة التضاعف.</p>","<p>يعرض المعلم سهمين متعاكسين على السبورة ويقول: «إنزيم لا يمشي إلا في اتجاه واحد، وأمامه طريقان متعاكسان؛ كيف ينجز المهمة؟» ليولّد التساؤل حول الشريط المتأخر.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض لغز السهمين ويستقبل الحلول المقترحة</td><td>يقترحون حلولًا ويناقشونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح الشكل 1-7 ص 27: اتجاه الانفكاك، والشريط المتقدم، والمتأخر، وقطع أوكازاكي، ودور الليجيز</td><td>يحددون على الشكل اتجاه عمل البوليميريز على كل شريط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يعرض محاكاة مرئية لشوكة التضاعف ويوجه رسم المخطط</td><td>يرسمون شوكة التضاعف ويكتبون الطرفين 5′ و3′ على كل شريط</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير سؤالًا مفصليًا ثم التقويم الختامي</td><td>يجيبون ويشرحون لزملائهم سبب تقطع الشريط المتأخر</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>في أي اتجاه يبني ‎DNA‎ بوليميريز الشريط الجديد؟</td><td>من 5′ إلى 3′ فقط.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي الشريطين يُبنى بصورة متصلة؟</td><td>الشريط المتقدم.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يحتاج الشريط المتأخر إلى ‎DNA‎ ليجيز أكثر من المتقدم؟</td><td>لأنه يُبنى على شكل قطع قصيرة (قطع أوكازاكي) يجب ربطها معًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف قطع أوكازاكي.</td><td>قطع قصيرة من ‎DNA‎ تُبنى على الشريط المتأخر بعكس اتجاه الانفكاك ثم تُربط بواسطة ‎DNA‎ ليجيز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>فسّر: يُبنى الشريط المتأخر بعكس اتجاه الانفكاك.</td><td>لأن ‎DNA‎ بوليميريز يعمل في الاتجاه 5′→3′ فقط، والقالب في هذا الشريط موجّه بحيث يكون هذا الاتجاه معاكسًا لحركة الانفكاك.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ارسم شوكة تضاعف وحدد عليها الشريط المتقدم والمتأخر وقطع أوكازاكي.</td><td>رسم صحيح يبين الشريط المتقدم متصلًا باتجاه الانفكاك، والمتأخر قطعًا متتالية بالاتجاه المعاكس مع أطراف 5′ و3′ صحيحة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 27 ورسم شوكة التضاعف من الذاكرة</p><p><b>إرشاد لولي الأمر:</b> الطلب من الابن شرح لغز «الإنزيم ذي الاتجاه الواحد» لأحد أفراد الأسرة</p>"]},{"axis":"التضاعف شبه المحافظ وحل نشاط 1-1","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","تضاعف ‎DNA‎"],["الحصة","3 من 3"],["محور الحصة","التضاعف شبه المحافظ وحل نشاط 1-1"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 26–27"],["دليل المعلم","ص 50–53"],["كتاب التجارب العملية والأنشطة","نشاط 1-1: إجابة أسئلة الاختيار من متعدد عن ‎DNA‎ ص 24"]],"t":["1. يشرح مفهوم التضاعف شبه المحافظ ويميزه عن التضاعف المحافظ\n2. يطبق مفهوم التضاعف شبه المحافظ في رسم الجزيئات الناتجة (السؤال 5)\nمخرج تعليمي آخر: يجيب عن أسئلة الاختيار من متعدد في نشاط 1-1 بكتاب التجارب ص 24","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تطبيق","- التعلم الذاتي\n- التعلم التعاوني\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: أقلام تلوين حمراء وزرقاء","التضاعف شبه المحافظ، التضاعف المحافظ، الجزيء الأصلي، الجزيء الناتج، الشريط القديم، الشريط الجديد.","يعرض المعلم صورة لنسخة ورقية ممزقة نصفين ويسأل: «إذا كتبنا على كل نصف ما يكمله، هل نحتفظ بشيء من الأصل؟» ليمهد لمفهوم شبه المحافظ.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض التشبيه ويناقش معنى «يحتفظ بنصف الأصل»\nالطالب: يربطون التشبيه بتضاعف ‎DNA‎\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يشرح التضاعف شبه المحافظ والمحافظ بالشكل 1-9 ص 27\nالطالب: يلوّنون الأشرطة القديمة بالأحمر والجديدة بالأزرق في الحالتين\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوجه حل نشاط 1-1 (كتاب التجارب ص 24) في أزواج ويتابع\nالطالب: يحلون أسئلة الاختيار من متعدد ويبررون كل إجابة كتابيًا\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يناقش الإجابات ويدير التقويم الختامي والسؤال 5 من كتاب الطالب\nالطالب: يرسمون جزيئي السؤال 5 ويقارنون إجاباتهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما المقصود بالتضاعف شبه المحافظ؟\n   الإجابة النموذجية: أن كل جزيء ‎DNA‎ ناتج يحتوي شريطًا أصليًا وشريطًا جديدًا.\n2) (المستوى المتوقع) السؤال: لو كان التضاعف محافظًا، كيف سيبدو الجزيئان الناتجان؟\n   الإجابة النموذجية: جزيء أصلي كما هو بشريطيه القديمين، وجزيء جديد بشريطين جديدين.\n3) (المستوى المتقدم) السؤال: بعد جيلين من التضاعف شبه المحافظ لجزيء واحد، كم جزيئًا يحمل شريطًا أصليًا؟\n   الإجابة النموذجية: جزيئان من أصل أربعة.","1) (مستوى الدعم) السؤال: لوّن الجزيئين الناتجين من تضاعف شبه محافظ لجزيء شريطاه أحمر وأزرق.\n   الإجابة النموذجية: كل جزيء ناتج: شريط أصلي (أحمر أو أزرق) مع شريط جديد بلون مختلف يمثل الجديد.\n2) (المستوى المتوقع) السؤال: لماذا سُمّي التضاعف «شبه» محافظ؟\n   الإجابة النموذجية: لأنه يحافظ على نصف الجزيء الأصلي فقط في كل جزيء ناتج.\n3) (المستوى المتقدم) السؤال: إذا تضاعف جزيء ‎DNA‎ ثلاث مرات، فما نسبة الأشرطة الأصلية إلى مجموع الأشرطة؟\n   الإجابة النموذجية: 8 جزيئات = 16 شريطًا، منها شريطان أصليان؛ النسبة ‎2/16 = 1/8‎.","إرشاد للطالب: إكمال نشاط 1-1 في كتاب التجارب ص 24 ومراجعة ص 27\nإرشاد لولي الأمر: التأكد من إنجاز الابن نشاط 1-1 ومناقشته في إجابة سؤال واحد"],"h":["<ol class=\"ol\"><li>يشرح مفهوم التضاعف شبه المحافظ ويميزه عن التضاعف المحافظ</li><li>يطبق مفهوم التضاعف شبه المحافظ في رسم الجزيئات الناتجة (السؤال 5)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يجيب عن أسئلة الاختيار من متعدد في نشاط 1-1 بكتاب التجارب ص 24</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح مفهوم التضاعف شبه المحافظ ويميزه عن التضاعف المحافظ</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يطبق مفهوم التضاعف شبه المحافظ في رسم الجزيئات الناتجة (السؤال 5)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يجيب عن أسئلة الاختيار من متعدد في نشاط 1-1 بكتاب التجارب ص 24</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: أقلام تلوين حمراء وزرقاء</span></div>","<p>التضاعف شبه المحافظ، التضاعف المحافظ، الجزيء الأصلي، الجزيء الناتج، الشريط القديم، الشريط الجديد.</p>","<p>يعرض المعلم صورة لنسخة ورقية ممزقة نصفين ويسأل: «إذا كتبنا على كل نصف ما يكمله، هل نحتفظ بشيء من الأصل؟» ليمهد لمفهوم شبه المحافظ.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض التشبيه ويناقش معنى «يحتفظ بنصف الأصل»</td><td>يربطون التشبيه بتضاعف ‎DNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يشرح التضاعف شبه المحافظ والمحافظ بالشكل 1-9 ص 27</td><td>يلوّنون الأشرطة القديمة بالأحمر والجديدة بالأزرق في الحالتين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–30</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 1-1 (كتاب التجارب ص 24) في أزواج ويتابع</td><td>يحلون أسئلة الاختيار من متعدد ويبررون كل إجابة كتابيًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يناقش الإجابات ويدير التقويم الختامي والسؤال 5 من كتاب الطالب</td><td>يرسمون جزيئي السؤال 5 ويقارنون إجاباتهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بالتضاعف شبه المحافظ؟</td><td>أن كل جزيء ‎DNA‎ ناتج يحتوي شريطًا أصليًا وشريطًا جديدًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لو كان التضاعف محافظًا، كيف سيبدو الجزيئان الناتجان؟</td><td>جزيء أصلي كما هو بشريطيه القديمين، وجزيء جديد بشريطين جديدين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>بعد جيلين من التضاعف شبه المحافظ لجزيء واحد، كم جزيئًا يحمل شريطًا أصليًا؟</td><td>جزيئان من أصل أربعة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لوّن الجزيئين الناتجين من تضاعف شبه محافظ لجزيء شريطاه أحمر وأزرق.</td><td>كل جزيء ناتج: شريط أصلي (أحمر أو أزرق) مع شريط جديد بلون مختلف يمثل الجديد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا سُمّي التضاعف «شبه» محافظ؟</td><td>لأنه يحافظ على نصف الجزيء الأصلي فقط في كل جزيء ناتج.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا تضاعف جزيء ‎DNA‎ ثلاث مرات، فما نسبة الأشرطة الأصلية إلى مجموع الأشرطة؟</td><td>8 جزيئات = 16 شريطًا، منها شريطان أصليان؛ النسبة ‎2/16 = 1/8‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 1-1 في كتاب التجارب ص 24 ومراجعة ص 27</p><p><b>إرشاد لولي الأمر:</b> التأكد من إنجاز الابن نشاط 1-1 ومناقشته في إجابة سؤال واحد</p>"]}]},{"title":"الشيفرة الجينية","sb":"ص 28","unit":"الوحدة 1: الأحماض النووية وبناء البروتين","periods":[{"axis":"الجين والشيفرة الثلاثية وخصائص الشيفرة","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الشيفرة الجينية"],["الحصة","1 من 2"],["محور الحصة","الجين والشيفرة الثلاثية وخصائص الشيفرة"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 28"],["دليل المعلم","ص 54–56"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يذكر أن الجين تتابع من النيوكليوتيدات في ‎DNA‎ يشفّر لعديد ببتيد\n2. يصف خصائص الشيفرة الجينية: ثلاثية، عالمية، غير متداخلة، منحلة\nمخرج تعليمي آخر: يفسر لماذا يجب أن تكون الشيفرة ثلاثية القواعد رياضيًا","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: جدول الشيفرة الجينية (الملحق 2)","الجين، الشيفرة الجينية، الثلاثية، الشيفرة العالمية، الانحلال (التكرار)، عدم التداخل، عديد الببتيد.","يكتب المعلم رسالة مشفرة بتجميع الحروف في ثلاثيات ويطلب فكها، ثم يسأل: «كيف تكتب 4 قواعد فقط لغة تكفي 20 حمضًا أمينيًا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الرسالة المشفرة ويطرح سؤال الأرقام\nالطالب: يفكون الرسالة ويقترحون حلًا لمسألة 4 قواعد و20 حمضًا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يقود استكشافًا رياضيًا: ‎4¹=4‎، ‎4²=16‎، ‎4³=64‎، ويستنتج مع الطلبة ضرورة الثلاثية\nالطالب: يحسبون عدد التراكيب الممكنة ويستنتجون أن الثلاثية أقل طول كافٍ\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يشرح خصائص الشيفرة (عالمية، منحلة، غير متداخلة) بأمثلة من الملحق 2\nالطالب: يستخرجون من الجدول أمثلة على الانحلال وكودونات البدء والإيقاف\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي ويوجه حل السؤال 6\nالطالب: يجيبون فرديًا ويصححون مع المعلم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كم ثلاثية مختلفة يمكن تكوينها من 4 قواعد؟\n   الإجابة النموذجية: ‎4³ = 64‎ ثلاثية.\n2) (المستوى المتوقع) السؤال: ما المقصود بأن الشيفرة منحلة؟\n   الإجابة النموذجية: أن أكثر من ثلاثية واحدة قد تشفر للحمض الأميني نفسه.\n3) (المستوى المتقدم) السؤال: لماذا لا تكفي ثنائيات القواعد للشيفرة؟\n   الإجابة النموذجية: لأنها تعطي 16 تركيبًا فقط، وهي أقل من 20 حمضًا أمينيًا.","1) (مستوى الدعم) السؤال: عرّف الجين.\n   الإجابة النموذجية: تتابع من النيوكليوتيدات يشكل جزءًا من جزيء ‎DNA‎ ويشفر لعديد ببتيد معين.\n2) (المستوى المتوقع) السؤال: ما الدليل على أن الشيفرة الجينية عالمية؟\n   الإجابة النموذجية: أن الثلاثيات نفسها تشفر الأحماض الأمينية نفسها في معظم الكائنات الحية تقريبًا، ولذلك يمكن نقل جين بشري إلى بكتيريا لتنتج البروتين البشري.\n3) (المستوى المتقدم) السؤال: إذا كان طول جين 900 قاعدة (دون إنترونات)، فكم حمضًا أمينيًا يشفر تقريبًا؟\n   الإجابة النموذجية: ‎900 ÷ 3 = 300‎ ثلاثية؛ أي نحو 299 حمضًا أمينيًا إذا كانت آخر ثلاثية شيفرة إيقاف.","إرشاد للطالب: مراجعة ص 28 والاطلاع على الملحق 2 (ثلاثيات ‎DNA‎ وكودونات ‎mRNA‎)\nإرشاد لولي الأمر: مشاركة الابن لعبة رسائل مشفرة بالثلاثيات لتثبيت الفكرة"],"h":["<ol class=\"ol\"><li>يذكر أن الجين تتابع من النيوكليوتيدات في ‎DNA‎ يشفّر لعديد ببتيد</li><li>يصف خصائص الشيفرة الجينية: ثلاثية، عالمية، غير متداخلة، منحلة</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا يجب أن تكون الشيفرة ثلاثية القواعد رياضيًا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر أن الجين تتابع من النيوكليوتيدات في ‎DNA‎ يشفّر لعديد ببتيد</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف خصائص الشيفرة الجينية: ثلاثية، عالمية، غير متداخلة، منحلة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا يجب أن تكون الشيفرة ثلاثية القواعد رياضيًا</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: جدول الشيفرة الجينية (الملحق 2)</span></div>","<p>الجين، الشيفرة الجينية، الثلاثية، الشيفرة العالمية، الانحلال (التكرار)، عدم التداخل، عديد الببتيد.</p>","<p>يكتب المعلم رسالة مشفرة بتجميع الحروف في ثلاثيات ويطلب فكها، ثم يسأل: «كيف تكتب 4 قواعد فقط لغة تكفي 20 حمضًا أمينيًا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الرسالة المشفرة ويطرح سؤال الأرقام</td><td>يفكون الرسالة ويقترحون حلًا لمسألة 4 قواعد و20 حمضًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يقود استكشافًا رياضيًا: ‎4¹=4‎، ‎4²=16‎، ‎4³=64‎، ويستنتج مع الطلبة ضرورة الثلاثية</td><td>يحسبون عدد التراكيب الممكنة ويستنتجون أن الثلاثية أقل طول كافٍ</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يشرح خصائص الشيفرة (عالمية، منحلة، غير متداخلة) بأمثلة من الملحق 2</td><td>يستخرجون من الجدول أمثلة على الانحلال وكودونات البدء والإيقاف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي ويوجه حل السؤال 6</td><td>يجيبون فرديًا ويصححون مع المعلم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كم ثلاثية مختلفة يمكن تكوينها من 4 قواعد؟</td><td>‎4³ = 64‎ ثلاثية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما المقصود بأن الشيفرة منحلة؟</td><td>أن أكثر من ثلاثية واحدة قد تشفر للحمض الأميني نفسه.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تكفي ثنائيات القواعد للشيفرة؟</td><td>لأنها تعطي 16 تركيبًا فقط، وهي أقل من 20 حمضًا أمينيًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف الجين.</td><td>تتابع من النيوكليوتيدات يشكل جزءًا من جزيء ‎DNA‎ ويشفر لعديد ببتيد معين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الدليل على أن الشيفرة الجينية عالمية؟</td><td>أن الثلاثيات نفسها تشفر الأحماض الأمينية نفسها في معظم الكائنات الحية تقريبًا، ولذلك يمكن نقل جين بشري إلى بكتيريا لتنتج البروتين البشري.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا كان طول جين 900 قاعدة (دون إنترونات)، فكم حمضًا أمينيًا يشفر تقريبًا؟</td><td>‎900 ÷ 3 = 300‎ ثلاثية؛ أي نحو 299 حمضًا أمينيًا إذا كانت آخر ثلاثية شيفرة إيقاف.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 28 والاطلاع على الملحق 2 (ثلاثيات ‎DNA‎ وكودونات ‎mRNA‎)</p><p><b>إرشاد لولي الأمر:</b> مشاركة الابن لعبة رسائل مشفرة بالثلاثيات لتثبيت الفكرة</p>"]},{"axis":"شيفرات البدء والإيقاف وقراءة جدول الشيفرة","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","الشيفرة الجينية"],["الحصة","2 من 2"],["محور الحصة","شيفرات البدء والإيقاف وقراءة جدول الشيفرة"],["الأسبوع والتاريخ","الأسبوع الثاني (13–17/9/2026)"],["كتاب الطالب","ص 28"],["دليل المعلم","ص 54–56"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يستخدم جدول الشيفرة الجينية لتحديد الأحماض الأمينية المقابلة لتتابع معين\n2. يحدد دور شيفرة البدء وشيفرات الإيقاف في تحديد بداية عديد الببتيد ونهايته\nمخرج تعليمي آخر: يحل السؤال 7 في كتاب الطالب ويبرر إجابته","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: جدول الشيفرة الجينية (الملحق 2)","شيفرة البدء، شيفرة الإيقاف، إطار القراءة، جدول الشيفرة، الميثيونين.","يعرض المعلم تتابعًا قصيرًا من ‎DNA‎ ويسأل: «من أين نبدأ القراءة؟ ومتى نتوقف؟» ويقارن ذلك بعلامات الترقيم في الجملة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض التتابع ويقارن البدء والإيقاف بعلامات الترقيم\nالطالب: يقترحون نقطة البدء والتوقف\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح شيفرة البدء وشيفرات الإيقاف وطريقة قراءة الجدول بمثال محلول\nالطالب: يتدربون على قراءة ثلاثيتين من الجدول\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: ينظم لعبة «فك الشيفرة» بين المجموعات: لكل مجموعة تتابع تترجمه إلى أحماض أمينية\nالطالب: يفكون التتابعات ويتحققون من نقطة البدء والإيقاف ويعرضون النتائج\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات (5 أسئلة) على الشيفرة الجينية\nالطالب: يتنافسون في المسابقة ويراجعون الأخطاء\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الحمض الأميني الذي تشفره شيفرة البدء؟\n   الإجابة النموذجية: الميثيونين.\n2) (المستوى المتوقع) السؤال: ماذا يحدث عند الوصول إلى شيفرة إيقاف؟\n   الإجابة النموذجية: يتوقف إضافة الأحماض الأمينية وينتهي عديد الببتيد.\n3) (المستوى المتقدم) السؤال: كم شيفرة إيقاف توجد في الجدول؟\n   الإجابة النموذجية: ثلاث شيفرات إيقاف.","1) (مستوى الدعم) السؤال: استخدم الجدول لتحديد الحمض الأميني لكودون ‎mRNA (AUG)‎.\n   الإجابة النموذجية: الميثيونين، وهو أيضًا شيفرة البدء.\n2) (المستوى المتوقع) السؤال: ما أهمية وجود شيفرة البدء؟\n   الإجابة النموذجية: تحدد نقطة بداية القراءة وإطارها الصحيح، فتُقرأ الثلاثيات اللاحقة بصورة صحيحة.\n3) (المستوى المتقدم) السؤال: تتابع ‎mRNA‎ فيه 15 قاعدة يبدأ بـ ‎AUG‎ وينتهي بشيفرة إيقاف. كم حمضًا أمينيًا في عديد الببتيد؟\n   الإجابة النموذجية: 5 كودونات، الأخير إيقاف؛ إذن 4 أحماض أمينية.","إرشاد للطالب: مراجعة ص 28 وحل السؤال 7 والتدرب على قراءة الجدول\nإرشاد لولي الأمر: يمكن مساعدة الابن بإعطائه تتابعًا قصيرًا ليترجمه باستخدام الجدول"],"h":["<ol class=\"ol\"><li>يستخدم جدول الشيفرة الجينية لتحديد الأحماض الأمينية المقابلة لتتابع معين</li><li>يحدد دور شيفرة البدء وشيفرات الإيقاف في تحديد بداية عديد الببتيد ونهايته</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل السؤال 7 في كتاب الطالب ويبرر إجابته</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم جدول الشيفرة الجينية لتحديد الأحماض الأمينية المقابلة لتتابع معين</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد دور شيفرة البدء وشيفرات الإيقاف في تحديد بداية عديد الببتيد ونهايته</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل السؤال 7 في كتاب الطالب ويبرر إجابته</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: جدول الشيفرة الجينية (الملحق 2)</span></div>","<p>شيفرة البدء، شيفرة الإيقاف، إطار القراءة، جدول الشيفرة، الميثيونين.</p>","<p>يعرض المعلم تتابعًا قصيرًا من ‎DNA‎ ويسأل: «من أين نبدأ القراءة؟ ومتى نتوقف؟» ويقارن ذلك بعلامات الترقيم في الجملة.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض التتابع ويقارن البدء والإيقاف بعلامات الترقيم</td><td>يقترحون نقطة البدء والتوقف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح شيفرة البدء وشيفرات الإيقاف وطريقة قراءة الجدول بمثال محلول</td><td>يتدربون على قراءة ثلاثيتين من الجدول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>ينظم لعبة «فك الشيفرة» بين المجموعات: لكل مجموعة تتابع تترجمه إلى أحماض أمينية</td><td>يفكون التتابعات ويتحققون من نقطة البدء والإيقاف ويعرضون النتائج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات (5 أسئلة) على الشيفرة الجينية</td><td>يتنافسون في المسابقة ويراجعون الأخطاء</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الحمض الأميني الذي تشفره شيفرة البدء؟</td><td>الميثيونين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث عند الوصول إلى شيفرة إيقاف؟</td><td>يتوقف إضافة الأحماض الأمينية وينتهي عديد الببتيد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم شيفرة إيقاف توجد في الجدول؟</td><td>ثلاث شيفرات إيقاف.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>استخدم الجدول لتحديد الحمض الأميني لكودون ‎mRNA (AUG)‎.</td><td>الميثيونين، وهو أيضًا شيفرة البدء.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما أهمية وجود شيفرة البدء؟</td><td>تحدد نقطة بداية القراءة وإطارها الصحيح، فتُقرأ الثلاثيات اللاحقة بصورة صحيحة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>تتابع ‎mRNA‎ فيه 15 قاعدة يبدأ بـ ‎AUG‎ وينتهي بشيفرة إيقاف. كم حمضًا أمينيًا في عديد الببتيد؟</td><td>5 كودونات، الأخير إيقاف؛ إذن 4 أحماض أمينية.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 28 وحل السؤال 7 والتدرب على قراءة الجدول</p><p><b>إرشاد لولي الأمر:</b> يمكن مساعدة الابن بإعطائه تتابعًا قصيرًا ليترجمه باستخدام الجدول</p>"]}]},{"title":"بناء البروتين","sb":"ص 29–33","unit":"الوحدة 1: الأحماض النووية وبناء البروتين","periods":[{"axis":"النسخ: دور ‎RNA‎ بوليميريز وشريط القالب","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","بناء البروتين"],["الحصة","1 من 5"],["محور الحصة","النسخ: دور ‎RNA‎ بوليميريز وشريط القالب"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 29–30"],["دليل المعلم","ص 57–61"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف عملية النسخ لتكوين ‎mRNA‎ من شريط القالب في ‎DNA‎\n2. يميز بين شريط القالب (شريط النسخ) والشريط غير القالب (الشريط المشفر)\nمخرج تعليمي آخر: يكتب تتابع ‎mRNA‎ الناتج من نسخ تتابع معطى من شريط القالب","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني\n- الخرائط الذهنية","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","النسخ، ‎RNA‎ بوليميريز، شريط القالب (شريط النسخ)، الشريط المشفر (غير القالب)، ‎mRNA‎، النيوكليوتيدات الحرة.","يعرض المعلم صورة لمكتبة لا يُسمح بإخراج كتبها ويسأل: «كيف تنقل وصفة من كتاب محفوظ إلى المطبخ؟» ليربط بين بقاء ‎DNA‎ في النواة وحاجة الخلية إلى نسخة متنقلة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض تشبيه المكتبة ويستنتج مع الطلبة الحاجة إلى نسخة من الجين\nالطالب: يقترحون كيف تنتقل المعلومات من النواة إلى الرايبوسوم\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات النسخ: انفكاك جزء من ‎DNA‎، وارتباط ‎RNA‎ بوليميريز، وتزاوج النيوكليوتيدات الحرة مع شريط القالب (‎U‎ مقابل ‎A‎)\nالطالب: يرسمون مخططًا للنسخ ويحددون اتجاه بناء ‎mRNA‎\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يقدّم تدريبًا موجهًا على كتابة تتابع ‎mRNA‎ من شريط قالب ثم من شريط مشفر\nالطالب: يحلون ثلاثة تدريبات في أزواج ويقارنون الشريط المشفر بـ ‎mRNA‎\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي ويصحح خطأ استخدام ‎T‎ في ‎mRNA‎\nالطالب: يجيبون ويستنتجون أن ‎mRNA‎ يطابق الشريط المشفر مع استبدال ‎T‎ بـ ‎U‎\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الإنزيم المسؤول عن النسخ؟\n   الإجابة النموذجية: ‎RNA‎ بوليميريز.\n2) (المستوى المتوقع) السؤال: اكتب ‎mRNA‎ الناتج من شريط القالب ‎3′-TACGGA-5′‎.\n   الإجابة النموذجية: ‎5′-AUGCCU-3′‎\n3) (المستوى المتقدم) السؤال: لماذا يشبه ‎mRNA‎ الشريطَ المشفر لا شريطَ القالب؟\n   الإجابة النموذجية: لأنه متمم لشريط القالب، والشريط المشفر متمم له أيضًا، فيتطابقان عدا استبدال ‎T‎ بـ ‎U‎.","1) (مستوى الدعم) السؤال: أين تحدث عملية النسخ في الخلية حقيقية النواة؟\n   الإجابة النموذجية: في النواة.\n2) (المستوى المتوقع) السؤال: قارن بين ‎DNA‎ بوليميريز و‎RNA‎ بوليميريز من حيث الناتج.\n   الإجابة النموذجية: ‎DNA‎ بوليميريز يبني شريط ‎DNA‎ جديدًا أثناء التضاعف، أما ‎RNA‎ بوليميريز فيبني جزيء ‎mRNA‎ أثناء النسخ.\n3) (المستوى المتقدم) السؤال: الشريط المشفر لجزء من جين هو ‎5′-ATGTTC-3′‎. اكتب شريط القالب و‎mRNA‎.\n   الإجابة النموذجية: القالب: ‎3′-TACAAG-5′‎؛ ‎mRNA: 5′-AUGUUC-3′‎.","إرشاد للطالب: مراجعة ص 29–30 والتدرب على كتابة ‎mRNA‎ من تتابعات مختلفة\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين شريط القالب والشريط المشفر"],"h":["<ol class=\"ol\"><li>يصف عملية النسخ لتكوين ‎mRNA‎ من شريط القالب في ‎DNA‎</li><li>يميز بين شريط القالب (شريط النسخ) والشريط غير القالب (الشريط المشفر)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يكتب تتابع ‎mRNA‎ الناتج من نسخ تتابع معطى من شريط القالب</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف عملية النسخ لتكوين ‎mRNA‎ من شريط القالب في ‎DNA‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين شريط القالب (شريط النسخ) والشريط غير القالب (الشريط المشفر)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يكتب تتابع ‎mRNA‎ الناتج من نسخ تتابع معطى من شريط القالب</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الخرائط الذهنية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>النسخ، ‎RNA‎ بوليميريز، شريط القالب (شريط النسخ)، الشريط المشفر (غير القالب)، ‎mRNA‎، النيوكليوتيدات الحرة.</p>","<p>يعرض المعلم صورة لمكتبة لا يُسمح بإخراج كتبها ويسأل: «كيف تنقل وصفة من كتاب محفوظ إلى المطبخ؟» ليربط بين بقاء ‎DNA‎ في النواة وحاجة الخلية إلى نسخة متنقلة.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض تشبيه المكتبة ويستنتج مع الطلبة الحاجة إلى نسخة من الجين</td><td>يقترحون كيف تنتقل المعلومات من النواة إلى الرايبوسوم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خطوات النسخ: انفكاك جزء من ‎DNA‎، وارتباط ‎RNA‎ بوليميريز، وتزاوج النيوكليوتيدات الحرة مع شريط القالب (‎U‎ مقابل ‎A‎)</td><td>يرسمون مخططًا للنسخ ويحددون اتجاه بناء ‎mRNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يقدّم تدريبًا موجهًا على كتابة تتابع ‎mRNA‎ من شريط قالب ثم من شريط مشفر</td><td>يحلون ثلاثة تدريبات في أزواج ويقارنون الشريط المشفر بـ ‎mRNA‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي ويصحح خطأ استخدام ‎T‎ في ‎mRNA‎</td><td>يجيبون ويستنتجون أن ‎mRNA‎ يطابق الشريط المشفر مع استبدال ‎T‎ بـ ‎U‎</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الإنزيم المسؤول عن النسخ؟</td><td>‎RNA‎ بوليميريز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب ‎mRNA‎ الناتج من شريط القالب ‎3′-TACGGA-5′‎.</td><td>‎5′-AUGCCU-3′‎</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يشبه ‎mRNA‎ الشريطَ المشفر لا شريطَ القالب؟</td><td>لأنه متمم لشريط القالب، والشريط المشفر متمم له أيضًا، فيتطابقان عدا استبدال ‎T‎ بـ ‎U‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين تحدث عملية النسخ في الخلية حقيقية النواة؟</td><td>في النواة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>قارن بين ‎DNA‎ بوليميريز و‎RNA‎ بوليميريز من حيث الناتج.</td><td>‎DNA‎ بوليميريز يبني شريط ‎DNA‎ جديدًا أثناء التضاعف، أما ‎RNA‎ بوليميريز فيبني جزيء ‎mRNA‎ أثناء النسخ.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>الشريط المشفر لجزء من جين هو ‎5′-ATGTTC-3′‎. اكتب شريط القالب و‎mRNA‎.</td><td>القالب: ‎3′-TACAAG-5′‎؛ ‎mRNA: 5′-AUGUUC-3′‎.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 29–30 والتدرب على كتابة ‎mRNA‎ من تتابعات مختلفة</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين شريط القالب والشريط المشفر</p>"]},{"axis":"معالجة ‎mRNA‎: الإنترونات والإكسونات والربط","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 1: الأحماض النووية وبناء البروتين"],["الدرس","بناء البروتين"],["الحصة","2 من 5"],["محور الحصة","معالجة ‎mRNA‎: الإنترونات والإكسونات والربط"],["الأسبوع والتاريخ","الأسبوع الثالث (20–24/9/2026)"],["كتاب الطالب","ص 31"],["دليل المعلم","ص 57–61"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف تعديل نسخة ‎RNA‎ الأولية في حقيقيات النواة بإزالة الإنترونات وربط الإكسونات\n2. يفسر كيف يؤدي الربط البديل إلى إنتاج بروتينات مختلفة من جين واحد\nمخرج تعليمي آخر: يقارن بين ‎mRNA‎ في بدائيات النواة وحقيقيات النواة من حيث المعالجة","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- أخرى: شريط ورقي ملون يمثل الإكسونات والإنترونات ومقص","نسخة ‎RNA‎ الأولية، معالجة ‎RNA‎، الإنترونات، الإكسونات، الربط، الربط البديل.","يعرض المعلم جملة طويلة تتخللها كلمات زائدة ملونة ويطلب حذفها لقراءة الرسالة، ثم يسأل: «هل تحدث عملية مشابهة لـ ‎mRNA‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الجملة ويطلب استخراج الرسالة\nالطالب: يحذفون الكلمات الزائدة ويستنتجون فكرة التعديل\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح معالجة ‎RNA‎ في حقيقيات النواة (الإنترونات، الإكسونات، الربط) والربط البديل\nالطالب: يعرّفون المصطلحات في الدفتر ويرسمون نسخة أولية ونسخة ناضجة\n3) (13 دقيقة: من
