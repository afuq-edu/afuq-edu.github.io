ل 1-1 في كتاب الطالب ص 20 ويشرح مكونات النيوكليوتيد الثلاثة وموقع ارتباطها بالسكر، والطلبة يرسمون نيوكليوتيدًا مبسطًا ويسمّون أجزاءه ويحددون الكربون 1′ و5′ في السكر (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يوزع المعلم بطاقات أشكال القواعد الخمس على المجموعات ويطلب تصنيفها وفق عدد الحلقات قبل الكشف عن المصطلحين، والطلبة يصنّفون القواعد في مجموعات تعاونية ويستنتجون الفرق بين البيورين والبيريميدين ويعرضون تصنيفهم (13 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n4. يدير المعلم تقويمًا ختاميًا شفهيًا وكتابيًا ويوضح الأخطاء الشائعة (الخلط بين الرايبوز والديؤكسي رايبوز)، والطلبة يجيبون عن أسئلة التقويم في الدفتر ويصححون إجاباتهم مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: سمِّ المكونات الثلاثة للنيوكليوتيد.\n• الإجابة النموذجية: سكر خماسي، ومجموعة فوسفات، وقاعدة نيتروجينية.\n\n2. مستوى التطبيق: صنّف القواعد: أدنين، سايتوسين، جوانين، يوراسيل إلى بيورينات وبيريميدينات.\n• الإجابة النموذجية: البيورينات: أدنين وجوانين (حلقتان)؛ البيريميدينات: سايتوسين ويوراسيل (حلقة واحدة).\n\n3. مستوى الاستدلال: لماذا يسمى سكر ‎DNA‎ بالديؤكسي رايبوز؟\n• الإجابة النموذجية: لأنه ينقصه ذرة أكسجين واحدة عند الكربون 2′ مقارنة بسكر الرايبوز (يحمل ‎H‎ بدل ‎OH‎).", "1. مستوى المعرفة: أي القواعد الخمس لا توجد في ‎DNA‎؟\n• الإجابة النموذجية: اليوراسيل ‎(U)‎.\n\n2. مستوى التطبيق: ارسم نيوكليوتيدًا مبسطًا واكتب أسماء أجزائه.\n• الإجابة النموذجية: رسم يوضح الفوسفات مرتبطًا بالكربون 5′ للسكر الخماسي والقاعدة مرتبطة بالكربون 1′.\n\n3. مستوى الاستدلال: فسّر: يكفي معرفة نوع السكر ونوع القاعدة لتحديد ما إذا كان النيوكليوتيد من ‎DNA‎ أو ‎RNA‎.\n• الإجابة النموذجية: لأن ‎DNA‎ يحتوي ديؤكسي رايبوز والثايمين، أما ‎RNA‎ فيحتوي الرايبوز واليوراسيل؛ فوجود أيٍّ منهما يحدد نوع الحمض.", "إرشاد للطالب: مراجعة كتاب الطالب ص 20–21 وتلخيص مكونات النيوكليوتيد في جدول\nإرشاد لولي الأمر: متابعة الابن في رسم نيوكليوتيد مبسط وتسمية أجزائه في الدفتر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1"], "h": ["<ol class=\"ol\"><li>يصف تركيب النيوكليوتيد من سكر خماسي ومجموعة فوسفات وقاعدة نيتروجينية (15 دقيقة)<\/li><li>يصنّف القواعد النيتروجينية إلى بيورينات (أدنين، جوانين) وبيريميدينات (سايتوسين، ثايمين، يوراسيل) وفق عدد الحلقات (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين سكر الرايبوز وسكر الديؤكسي رايبوز في النيوكليوتيدات (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تركيب النيوكليوتيد من سكر خماسي ومجموعة فوسفات وقاعدة نيتروجينية<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يصنّف القواعد النيتروجينية إلى بيورينات (أدنين، جوانين) وبيريميدينات (سايتوسين، ثايمين، يوراسيل) وفق عدد الحلقات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تحليل (مخرج آخر):<\/b> يقارن بين سكر الرايبوز وسكر الديؤكسي رايبوز في النيوكليوتيدات<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">العصف الذهني<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">صورة توضيحية<\/span><span class=\"chip r\">أخرى: بطاقات أشكال القواعد النيتروجينية<\/span><\/div>", "<p>النيوكليوتيد، السكر الخماسي، الرايبوز، الديؤكسي رايبوز، مجموعة الفوسفات، القاعدة النيتروجينية، البيورين، البيريميدين.<\/p>", "<p>يعرض المعلم صورة لبصمة وراثية ويسأل: «ما الجزيء الذي يجعل كل إنسان مختلفًا عن غيره؟ ومن أي وحدات بنائية يتكون؟» ويستحضر مع الطلبة ما درسوه سابقًا عن البوليمرات والمونومرات، ثم ينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم صورة البصمة الوراثية ويدير نقاش التعلم القبلي حول البوليمرات ويسجل الأفكار على السبورة، والطلبة يستدعون أمثلة لبوليمرات ومونومراتها ويجيبون عن مهام «قبل أن تبدأ بدراسة الوحدة» (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يعرض المعلم الشكل 1-1 في كتاب الطالب ص 20 ويشرح مكونات النيوكليوتيد الثلاثة وموقع ارتباطها بالسكر، والطلبة يرسمون نيوكليوتيدًا مبسطًا ويسمّون أجزاءه ويحددون الكربون 1′ و5′ في السكر (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم بطاقات أشكال القواعد الخمس على المجموعات ويطلب تصنيفها وفق عدد الحلقات قبل الكشف عن المصطلحين، والطلبة يصنّفون القواعد في مجموعات تعاونية ويستنتجون الفرق بين البيورين والبيريميدين ويعرضون تصنيفهم (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: العصف الذهني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم تقويمًا ختاميًا شفهيًا وكتابيًا ويوضح الأخطاء الشائعة (الخلط بين الرايبوز والديؤكسي رايبوز)، والطلبة يجيبون عن أسئلة التقويم في الدفتر ويصححون إجاباتهم مع زملائهم (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> سمِّ المكونات الثلاثة للنيوكليوتيد.<br><span style=\"opacity:.85\">• الإجابة النموذجية: سكر خماسي، ومجموعة فوسفات، وقاعدة نيتروجينية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صنّف القواعد: أدنين، سايتوسين، جوانين، يوراسيل إلى بيورينات وبيريميدينات.<br><span style=\"opacity:.85\">• الإجابة النموذجية: البيورينات: أدنين وجوانين (حلقتان)؛ البيريميدينات: سايتوسين ويوراسيل (حلقة واحدة).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يسمى سكر ‎DNA‎ بالديؤكسي رايبوز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه ينقصه ذرة أكسجين واحدة عند الكربون 2′ مقارنة بسكر الرايبوز (يحمل ‎H‎ بدل ‎OH‎).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أي القواعد الخمس لا توجد في ‎DNA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: اليوراسيل ‎(U)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ارسم نيوكليوتيدًا مبسطًا واكتب أسماء أجزائه.<br><span style=\"opacity:.85\">• الإجابة النموذجية: رسم يوضح الفوسفات مرتبطًا بالكربون 5′ للسكر الخماسي والقاعدة مرتبطة بالكربون 1′.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> فسّر: يكفي معرفة نوع السكر ونوع القاعدة لتحديد ما إذا كان النيوكليوتيد من ‎DNA‎ أو ‎RNA‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎DNA‎ يحتوي ديؤكسي رايبوز والثايمين، أما ‎RNA‎ فيحتوي الرايبوز واليوراسيل؛ فوجود أيٍّ منهما يحدد نوع الحمض.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة كتاب الطالب ص 20–21 وتلخيص مكونات النيوكليوتيد في جدول<\/p><p><b>إرشاد لولي الأمر:<\/b> متابعة الابن في رسم نيوكليوتيد مبسط وتسمية أجزائه في الدفتر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1<\/p>"]}, {"axis": "النيوكليوتيد المفسفر ‎ATP‎ وتكوين عديد النيوكليوتيد", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "تركيب ‎DNA‎ و‎RNA‎"], ["الحصة", "2 من 5"], ["محور الحصة", "النيوكليوتيد المفسفر ‎ATP‎ وتكوين عديد النيوكليوتيد"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 21–22"], ["دليل المعلم", "ص 46–49"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]], "t": ["1. يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات (15 دقيقة)\n2. يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات (15 دقيقة)\nمخرج تعليمي آخر: يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد (10 دقائق)", "1. فهم: يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات\n2. فهم: يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات\n3. تطبيق (مخرج آخر): يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالأقران", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: مشابك ورقية ملونة لنمذجة الروابط", "‎ATP‎، النيوكليوتيد المفسفر، رابطة فوسفوداي إستر، تفاعل التكثيف، عديد النيوكليوتيد، العمود الفقري (سكر–فوسفات)، الطرف 5′، الطرف 3′.", "يسأل المعلم: «ما مصدر الطاقة المباشر في الخلية؟» ثم يكتب ‎ATP‎ على السبورة ويطلب من الطلبة تخمين ما تعنيه الحروف ‎A‎ و‎T‎ و‎P‎، ليربط بين الطاقة والنيوكليوتيدات.", "1. يطرح المعلم سؤال الطاقة في الخلية ويستقبل تخمينات الطلبة لمعنى ‎ATP‎، والطلبة يخمّنون معنى الاختصار ويربطونه بالأدنين والرايبوز والفوسفات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم تركيب ‎ATP (‎أدنين + رايبوز + 3 مجموعات فوسفات) ويقارنه بنيوكليوتيد ‎RNA‎، والطلبة يرسمون ‎ATP‎ مبسطًا ويحددون أوجه الشبه مع نيوكليوتيد ‎RNA‎ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يوجّه نشاط نمذجة: كل مجموعة تربط 4 نيوكليوتيدات ورقية بتفاعلات تكثيف وتحدد موقع رابطة فوسفوداي إستر، والطلبة يبنون شريطًا من النماذج ويحددون الطرفين 5′ و3′ ويكتبون عدد جزيئات الماء الناتجة (15 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n4. يطرح المعلم أسئلة التقويم الختامي ويعالج الخلط بين الرابطة الهيدروجينية ورابطة فوسفوداي إستر، والطلبة يجيبون فرديًا ثم يتبادلون الدفاتر للتصحيح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: كم مجموعة فوسفات في جزيء ‎ATP‎؟\n• الإجابة النموذجية: ثلاث مجموعات فوسفات.\n\n2. مستوى التطبيق: ما الرابطة التي تربط نيوكليوتيدين متجاورين في الشريط نفسه؟\n• الإجابة النموذجية: رابطة فوسفوداي إستر بين فوسفات نيوكليوتيد وسكر النيوكليوتيد التالي.\n\n3. مستوى الاستدلال: كم جزيء ماء ينتج عند تكوين شريط من 10 نيوكليوتيدات؟\n• الإجابة النموذجية: 9 جزيئات ماء (بعدد الروابط المتكونة).", "1. مستوى المعرفة: ما نوع السكر في جزيء ‎ATP‎؟\n• الإجابة النموذجية: الرايبوز.\n\n2. مستوى التطبيق: صف كيف يتكون العمود الفقري لشريط عديد النيوكليوتيد.\n• الإجابة النموذجية: يرتبط فوسفات نيوكليوتيد بالكربون 3′ لسكر النيوكليوتيد السابق بتفاعل تكثيف مكونًا رابطة فوسفوداي إستر، فتتكرر وحدات سكر–فوسفات على طول الشريط.\n\n3. مستوى الاستدلال: فسّر: يُعدّ ‎ATP‎ نيوكليوتيدًا رغم أن وظيفته نقل الطاقة.\n• الإجابة النموذجية: لأنه يتكون من قاعدة (أدنين) وسكر خماسي (رايبوز) ومجموعات فوسفات، وهي مكونات النيوكليوتيد نفسها، والفرق فقط في عدد مجموعات الفوسفات.", "إرشاد للطالب: قراءة كتاب الطالب ص 21–22 ورسم ‎ATP‎ وشريط من ثلاثة نيوكليوتيدات\nإرشاد لولي الأمر: تشجيع الابن على شرح الفرق بين ‎ATP‎ ونيوكليوتيد ‎RNA‎ بأسلوبه\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1"], "h": ["<ol class=\"ol\"><li>يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات (15 دقيقة)<\/li><li>يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تركيب النيوكليوتيد المفسفر ‎ATP‎ بوصفه نيوكليوتيدًا يحمل ثلاث مجموعات فوسفات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح ارتباط النيوكليوتيدات بروابط فوسفوداي إستر لتكوين عمود فقري من السكر والفوسفات<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحدد الطرفين 5′ و3′ لشريط عديد النيوكليوتيد<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم بالأقران<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">أخرى: مشابك ورقية ملونة لنمذجة الروابط<\/span><\/div>", "<p>‎ATP‎، النيوكليوتيد المفسفر، رابطة فوسفوداي إستر، تفاعل التكثيف، عديد النيوكليوتيد، العمود الفقري (سكر–فوسفات)، الطرف 5′، الطرف 3′.<\/p>", "<p>يسأل المعلم: «ما مصدر الطاقة المباشر في الخلية؟» ثم يكتب ‎ATP‎ على السبورة ويطلب من الطلبة تخمين ما تعنيه الحروف ‎A‎ و‎T‎ و‎P‎، ليربط بين الطاقة والنيوكليوتيدات.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم سؤال الطاقة في الخلية ويستقبل تخمينات الطلبة لمعنى ‎ATP‎، والطلبة يخمّنون معنى الاختصار ويربطونه بالأدنين والرايبوز والفوسفات (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم تركيب ‎ATP (‎أدنين + رايبوز + 3 مجموعات فوسفات) ويقارنه بنيوكليوتيد ‎RNA‎، والطلبة يرسمون ‎ATP‎ مبسطًا ويحددون أوجه الشبه مع نيوكليوتيد ‎RNA‎ (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوجّه نشاط نمذجة: كل مجموعة تربط 4 نيوكليوتيدات ورقية بتفاعلات تكثيف وتحدد موقع رابطة فوسفوداي إستر، والطلبة يبنون شريطًا من النماذج ويحددون الطرفين 5′ و3′ ويكتبون عدد جزيئات الماء الناتجة (15 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالأقران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يطرح المعلم أسئلة التقويم الختامي ويعالج الخلط بين الرابطة الهيدروجينية ورابطة فوسفوداي إستر، والطلبة يجيبون فرديًا ثم يتبادلون الدفاتر للتصحيح (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> كم مجموعة فوسفات في جزيء ‎ATP‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ثلاث مجموعات فوسفات.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الرابطة التي تربط نيوكليوتيدين متجاورين في الشريط نفسه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: رابطة فوسفوداي إستر بين فوسفات نيوكليوتيد وسكر النيوكليوتيد التالي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> كم جزيء ماء ينتج عند تكوين شريط من 10 نيوكليوتيدات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 9 جزيئات ماء (بعدد الروابط المتكونة).<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما نوع السكر في جزيء ‎ATP‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الرايبوز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> صف كيف يتكون العمود الفقري لشريط عديد النيوكليوتيد.<br><span style=\"opacity:.85\">• الإجابة النموذجية: يرتبط فوسفات نيوكليوتيد بالكربون 3′ لسكر النيوكليوتيد السابق بتفاعل تكثيف مكونًا رابطة فوسفوداي إستر، فتتكرر وحدات سكر–فوسفات على طول الشريط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> فسّر: يُعدّ ‎ATP‎ نيوكليوتيدًا رغم أن وظيفته نقل الطاقة.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يتكون من قاعدة (أدنين) وسكر خماسي (رايبوز) ومجموعات فوسفات، وهي مكونات النيوكليوتيد نفسها، والفرق فقط في عدد مجموعات الفوسفات.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> قراءة كتاب الطالب ص 21–22 ورسم ‎ATP‎ وشريط من ثلاثة نيوكليوتيدات<\/p><p><b>إرشاد لولي الأمر:<\/b> تشجيع الابن على شرح الفرق بين ‎ATP‎ ونيوكليوتيد ‎RNA‎ بأسلوبه<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1<\/p>"]}, {"axis": "تركيب جزيء ‎DNA‎: اللولب المزدوج وتزاوج القواعد", "n": 3, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "تركيب ‎DNA‎ و‎RNA‎"], ["الحصة", "3 من 5"], ["محور الحصة", "تركيب جزيء ‎DNA‎: اللولب المزدوج وتزاوج القواعد"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 22–24"], ["دليل المعلم", "ص 46–49"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]], "t": ["1. يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه (15 دقيقة)\n2. يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها (15 دقيقة)\nمخرج تعليمي آخر: يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها (10 دقائق)", "1. فهم: يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه\n2. تطبيق: يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها\n3. تطبيق (مخرج آخر): يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها", "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم بالأقران", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)", "اللولب المزدوج، الشريطان المتعاكسان (المتوازيان عكسيًا)، تزاوج القواعد المتممة، الروابط الهيدروجينية، زوج ‎A–T (‎رابطتان)، زوج ‎C–G (‎ثلاث روابط).", "يعرض المعلم نموذجًا مجسمًا للولب ‎DNA‎ ويسأل: «لماذا يبدو الشريطان متوازيين كدرجات سلم، وما الذي يثبت الدرجات؟» ثم يعرض صورة حيود الأشعة السينية لروزاليند فرانكلين باختصار.", "1. يعرض المعلم نموذج اللولب المزدوج ويطرح سؤال الدرجات، والطلبة يتأملون النموذج ويقترحون ما يربط الشريطين (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح الشكلين في ص 22–23: الاتجاه المتعاكس، وتزاوج البيورين مع البيريميدين، وعدد الروابط الهيدروجينية، والطلبة يكملون مخططًا لشريطين ويكتبون الطرفين 5′ و3′ لكل شريط (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يقدّم المعلم مسائل نسب القواعد (قاعدة شارجاف) ويحل مثالًا نموذجيًا، والطلبة يحلون في أزواج مسألتين لحساب نسب القواعد ويعرضون الحل على السبورة (13 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n4. يطرح سؤالًا مفصليًا: «لماذا يكون عرض اللولب ثابتًا؟» ثم يدير التقويم الختامي، والطلبة يجيبون ويفسرون ثبات العرض بتزاوج قاعدة ذات حلقتين مع قاعدة ذات حلقة واحدة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: اكتب تتابع الشريط المتمم للشريط ‎5′-ATGCCA-3′‎.\n• الإجابة النموذجية: ‎3′-TACGGT-5′‎\n\n2. مستوى التطبيق: كم رابطة هيدروجينية بين ‎C‎ و‎G‎؟\n• الإجابة النموذجية: ثلاث روابط هيدروجينية.\n\n3. مستوى الاستدلال: إذا كانت نسبة الأدنين 30% في عينة ‎DNA‎ فما نسبة الجوانين؟\n• الإجابة النموذجية: الثايمين 30%، فيبقى 40% لـ ‎C‎ و‎G‎ معًا؛ الجوانين = 20%.", "1. مستوى المعرفة: ما المقصود بأن شريطي ‎DNA‎ متعاكسا الاتجاه؟\n• الإجابة النموذجية: أن أحد الشريطين يمتد من 5′ إلى 3′ والآخر من 3′ إلى 5′ في الاتجاه نفسه.\n\n2. مستوى التطبيق: فسّر ثبات عرض جزيء ‎DNA‎ على طوله.\n• الإجابة النموذجية: لأن كل زوج قواعد يتكون من بيورين (حلقتان) وبيريميدين (حلقة واحدة)، فيكون طول كل زوج متساويًا.\n\n3. مستوى الاستدلال: جزيء ‎DNA‎ فيه 1200 زوج قواعد، منها 320 زوجًا من ‎C–G‎. احسب عدد الروابط الهيدروجينية الكلي.\n• الإجابة النموذجية: أزواج ‎A–T = 880 × 2 = 1760‎، وأزواج ‎C–G = 320 × 3 = 960‎؛ المجموع 2720 رابطة.", "إرشاد للطالب: مراجعة ص 22–24 وحل مسألتين إضافيتين في نسب القواعد\nإرشاد لولي الأمر: مساعدة الابن على كتابة أزواج القواعد وعدد روابطها في بطاقة مراجعة\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1"], "h": ["<ol class=\"ol\"><li>يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه (15 دقيقة)<\/li><li>يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تركيب ‎DNA‎ بوصفه لولبًا مزدوجًا من شريطين متعاكسي الاتجاه<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تطبيق:<\/b> يطبق قاعدة تزاوج القواعد المتممة (‎A‎ مع ‎T‎ و‎C‎ مع ‎G‎) والروابط الهيدروجينية بينها<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تطبيق (مخرج آخر):<\/b> يحسب نسب القواعد في جزيء ‎DNA‎ بمعلومية نسبة إحداها<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم بالأقران<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>اللولب المزدوج، الشريطان المتعاكسان (المتوازيان عكسيًا)، تزاوج القواعد المتممة، الروابط الهيدروجينية، زوج ‎A–T (‎رابطتان)، زوج ‎C–G (‎ثلاث روابط).<\/p>", "<p>يعرض المعلم نموذجًا مجسمًا للولب ‎DNA‎ ويسأل: «لماذا يبدو الشريطان متوازيين كدرجات سلم، وما الذي يثبت الدرجات؟» ثم يعرض صورة حيود الأشعة السينية لروزاليند فرانكلين باختصار.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم نموذج اللولب المزدوج ويطرح سؤال الدرجات، والطلبة يتأملون النموذج ويقترحون ما يربط الشريطين (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح الشكلين في ص 22–23: الاتجاه المتعاكس، وتزاوج البيورين مع البيريميدين، وعدد الروابط الهيدروجينية، والطلبة يكملون مخططًا لشريطين ويكتبون الطرفين 5′ و3′ لكل شريط (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدّم المعلم مسائل نسب القواعد (قاعدة شارجاف) ويحل مثالًا نموذجيًا، والطلبة يحلون في أزواج مسألتين لحساب نسب القواعد ويعرضون الحل على السبورة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالأقران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يطرح سؤالًا مفصليًا: «لماذا يكون عرض اللولب ثابتًا؟» ثم يدير التقويم الختامي، والطلبة يجيبون ويفسرون ثبات العرض بتزاوج قاعدة ذات حلقتين مع قاعدة ذات حلقة واحدة (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اكتب تتابع الشريط المتمم للشريط ‎5′-ATGCCA-3′‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎3′-TACGGT-5′‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كم رابطة هيدروجينية بين ‎C‎ و‎G‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ثلاث روابط هيدروجينية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا كانت نسبة الأدنين 30% في عينة ‎DNA‎ فما نسبة الجوانين؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الثايمين 30%، فيبقى 40% لـ ‎C‎ و‎G‎ معًا؛ الجوانين = 20%.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقصود بأن شريطي ‎DNA‎ متعاكسا الاتجاه؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن أحد الشريطين يمتد من 5′ إلى 3′ والآخر من 3′ إلى 5′ في الاتجاه نفسه.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> فسّر ثبات عرض جزيء ‎DNA‎ على طوله.<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن كل زوج قواعد يتكون من بيورين (حلقتان) وبيريميدين (حلقة واحدة)، فيكون طول كل زوج متساويًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> جزيء ‎DNA‎ فيه 1200 زوج قواعد، منها 320 زوجًا من ‎C–G‎. احسب عدد الروابط الهيدروجينية الكلي.<br><span style=\"opacity:.85\">• الإجابة النموذجية: أزواج ‎A–T = 880 × 2 = 1760‎، وأزواج ‎C–G = 320 × 3 = 960‎؛ المجموع 2720 رابطة.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 22–24 وحل مسألتين إضافيتين في نسب القواعد<\/p><p><b>إرشاد لولي الأمر:<\/b> مساعدة الابن على كتابة أزواج القواعد وعدد روابطها في بطاقة مراجعة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1<\/p>"]}, {"axis": "تركيب ‎RNA‎ والمقارنة بين ‎DNA‎ و‎RNA‎", "n": 4, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "تركيب ‎DNA‎ و‎RNA‎"], ["الحصة", "4 من 5"], ["محور الحصة", "تركيب ‎RNA‎ والمقارنة بين ‎DNA‎ و‎RNA‎"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 24–26"], ["دليل المعلم", "ص 46–49"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]], "t": ["1. يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد (10 دقائق)\n2. يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة (15 دقيقة)\nمخرج تعليمي آخر: يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام (15 دقيقة)", "1. فهم: يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد\n2. تحليل: يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة\n3. فهم (مخرج آخر): يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام", "- التعلم التعاوني\n- التعلم الذاتي\n- خريطة المفاهيم", "- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية", "‎RNA‎، الشريط المفرد، ‎RNA‎ المرسال ‎(mRNA)‎، ‎RNA‎ الناقل ‎(tRNA)‎، ‎RNA‎ الرايبوسومي ‎(rRNA)‎، اليوراسيل، الرايبوز.", "يعرض المعلم جدولًا فارغًا بعنوان «توأمان مختلفان: ‎DNA‎ و‎RNA»‎ ويطلب من الطلبة توقع ثلاثة فروق قبل القراءة.", "1. يعرض المعلم الجدول الفارغ ويستقبل التوقعات، والطلبة يكتبون ثلاثة فروق متوقعة في الدفتر (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. يوجه المعلم قراءة ص 24–26 ويشرح تركيب ‎RNA‎ وأنواعه الثلاثة مع صور توضيحية، والطلبة يقرؤون فرديًا ويحددون شكل كل نوع من أنواع ‎RNA‎ (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. يكلّف المجموعات بإكمال جدول المقارنة ورسم خريطة مفاهيم تربط ‎DNA‎ و‎RNA‎ بالبروتين، والطلبة يكملون الجدول والخريطة تعاونيًا ويعرض ممثل كل مجموعة جزءًا منها (13 دقيقة)\nالاستراتيجيات: خريطة المفاهيم.\n\n4. يدير المعلم التقويم الختامي ويصحح المفهوم الخاطئ أن ‎RNA‎ لولب مزدوج، والطلبة يجيبون عن الأسئلة ويراجعون توقعاتهم الأولى ويصححونها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: اذكر فرقين بين ‎DNA‎ و‎RNA‎.\n• الإجابة النموذجية: ‎DNA‎: ديؤكسي رايبوز وثايمين وشريطان؛ ‎RNA‎: رايبوز ويوراسيل وشريط مفرد.\n\n2. مستوى التطبيق: أي أنواع ‎RNA‎ يبقى على شكل شريط غير ملتف؟\n• الإجابة النموذجية: ‎RNA‎ المرسال ‎(mRNA)‎.\n\n3. مستوى الاستدلال: لماذا لا يتزاوج اليوراسيل مع الأدنين داخل جزيء ‎mRNA‎ عادة؟\n• الإجابة النموذجية: لأن ‎mRNA‎ شريط مفرد غير ملتف، فلا توجد قواعد متقابلة على شريط آخر لتتزاوج معها.", "1. مستوى المعرفة: ما القاعدة التي تحل محل الثايمين في ‎RNA‎؟\n• الإجابة النموذجية: اليوراسيل.\n\n2. مستوى التطبيق: املأ: ‎RNA‎ الناقل و ‎RNA‎ الرايبوسومي ينثنيان على شكل ... بينما يبقى ‎mRNA‎ ...\n• الإجابة النموذجية: تراكيب معقدة، شريطًا غير ملتف.\n\n3. مستوى الاستدلال: قيّم العبارة: «‎RNA‎ نسخة مطابقة تمامًا لـ ‎DNA»‎.\n• الإجابة النموذجية: غير دقيقة؛ فـ ‎RNA‎ شريط مفرد يحوي الرايبوز واليوراسيل، ويكون متممًا لأحد شريطي ‎DNA‎ لا مطابقًا له.", "إرشاد للطالب: مراجعة ص 24–26 وإكمال جدول المقارنة بين ‎DNA‎ و‎RNA‎ في الدفتر\nإرشاد لولي الأمر: سؤال الابن عن أنواع ‎RNA‎ الثلاثة ووظيفة كل منها باختصار\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1"], "h": ["<ol class=\"ol\"><li>يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد (10 دقائق)<\/li><li>يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف تركيب ‎RNA‎ بوصفه شريطًا مفردًا من عديد النيوكليوتيد<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. تحليل:<\/b> يقارن بين ‎DNA‎ و‎RNA‎ من حيث السكر والقواعد وعدد الأشرطة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. فهم (مخرج آخر):<\/b> يميز بين أنواع ‎RNA‎ الثلاثة (‎mRNA‎ و‎tRNA‎ و‎rRNA‎) من حيث الشكل العام<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">التعلم الذاتي<\/span><span class=\"chip\">خريطة المفاهيم<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">جهاز عرض البيانات<\/span><span class=\"chip r\">صورة توضيحية<\/span><\/div>", "<p>‎RNA‎، الشريط المفرد، ‎RNA‎ المرسال ‎(mRNA)‎، ‎RNA‎ الناقل ‎(tRNA)‎، ‎RNA‎ الرايبوسومي ‎(rRNA)‎، اليوراسيل، الرايبوز.<\/p>", "<p>يعرض المعلم جدولًا فارغًا بعنوان «توأمان مختلفان: ‎DNA‎ و‎RNA»‎ ويطلب من الطلبة توقع ثلاثة فروق قبل القراءة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الجدول الفارغ ويستقبل التوقعات، والطلبة يكتبون ثلاثة فروق متوقعة في الدفتر (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يوجه المعلم قراءة ص 24–26 ويشرح تركيب ‎RNA‎ وأنواعه الثلاثة مع صور توضيحية، والطلبة يقرؤون فرديًا ويحددون شكل كل نوع من أنواع ‎RNA‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يكلّف المجموعات بإكمال جدول المقارنة ورسم خريطة مفاهيم تربط ‎DNA‎ و‎RNA‎ بالبروتين، والطلبة يكملون الجدول والخريطة تعاونيًا ويعرض ممثل كل مجموعة جزءًا منها (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: خريطة المفاهيم.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي ويصحح المفهوم الخاطئ أن ‎RNA‎ لولب مزدوج، والطلبة يجيبون عن الأسئلة ويراجعون توقعاتهم الأولى ويصححونها (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> اذكر فرقين بين ‎DNA‎ و‎RNA‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎DNA‎: ديؤكسي رايبوز وثايمين وشريطان؛ ‎RNA‎: رايبوز ويوراسيل وشريط مفرد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> أي أنواع ‎RNA‎ يبقى على شكل شريط غير ملتف؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎RNA‎ المرسال ‎(mRNA)‎.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا لا يتزاوج اليوراسيل مع الأدنين داخل جزيء ‎mRNA‎ عادة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن ‎mRNA‎ شريط مفرد غير ملتف، فلا توجد قواعد متقابلة على شريط آخر لتتزاوج معها.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما القاعدة التي تحل محل الثايمين في ‎RNA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: اليوراسيل.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> املأ: ‎RNA‎ الناقل و ‎RNA‎ الرايبوسومي ينثنيان على شكل ... بينما يبقى ‎mRNA‎ ...<br><span style=\"opacity:.85\">• الإجابة النموذجية: تراكيب معقدة، شريطًا غير ملتف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> قيّم العبارة: «‎RNA‎ نسخة مطابقة تمامًا لـ ‎DNA»‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: غير دقيقة؛ فـ ‎RNA‎ شريط مفرد يحوي الرايبوز واليوراسيل، ويكون متممًا لأحد شريطي ‎DNA‎ لا مطابقًا له.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 24–26 وإكمال جدول المقارنة بين ‎DNA‎ و‎RNA‎ في الدفتر<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن أنواع ‎RNA‎ الثلاثة ووظيفة كل منها باختصار<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1<\/p>"]}, {"axis": "الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل وحل أسئلة الموضوع", "n": 5, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "تركيب ‎DNA‎ و‎RNA‎"], ["الحصة", "5 من 5"], ["محور الحصة", "الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل وحل أسئلة الموضوع"], ["الأسبوع والتاريخ", "الأسبوع الأول (6–10/9/2026)"], ["كتاب الطالب", "ص 20–26 + كتاب التجارب ص 32"], ["دليل المعلم", "ص 46–49"], ["كتاب التجارب العملية والأنشطة", "الاستقصاء العملي 1-1: استخلاص ‎DNA‎ البصل (إثرائي) ص 32"]], "t": ["1. ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات السلامة (5 دقائق)\n2. يفسر دور كل من المنظف والملح والإيثانول البارد في عملية الاستخلاص (20 دقيقة)\nمخرج تعليمي آخر: يجيب عن أسئلة الموضوع 1-1 (1–3) موظفًا مفاهيم تركيب الأحماض النووية (15 دقيقة)", "1. تطبيق: ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات السلامة\n2. تحليل: يفسر دور كل من المنظف والملح والإيثانول البارد في عملية الاستخلاص\n3. تطبيق (مخرج آخر): يجيب عن أسئلة الموضوع 1-1 (1–3) موظفًا مفاهيم تركيب الأحماض النووية", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي", "- الكتاب\n- الأقلام\n- أخرى: أدوات الاستقصاء: بصل، منظف، ملح، إيثانول بارد، ورق ترشيح، أنابيب اختبار", "الاستخلاص، الغشاء البلازمي، الغشاء النووي، المنظف، الترسيب، الإيثانول البارد، خيوط ‎DNA‎.", "يسأل المعلم: «لو أردت رؤية ‎DNA‎ بالعين المجردة، كم خلية تحتاج؟ وكيف تخرجه من النواة؟» ويستقبل الاقتراحات قبل عرض أدوات الاستقصاء.", "1. يطرح المعلم سؤال التهيئة ويراجع قواعد السلامة في المختبر، والطلبة يقترحون طرقًا لإخراج ‎DNA‎ ويستمعون لتعليمات السلامة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. يوجّه المعلم تنفيذ الاستقصاء العملي 1-1 (كتاب التجارب ص 32) ويتابع عمل المجموعات، والطلبة يهرسون البصل مع المنظف والملح ويرشحونه ثم يضيفون الإيثانول البارد ويلاحظون الخيوط (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يناقش المعلم النتائج ويسأل عن دور كل مادة، والطلبة يفسرون: المنظف يذيب الأغشية، والملح يعادل شحنات ‎DNA‎ ويساعد تجمعه، والإيثانول يرسّب ‎DNA‎ (7 دقائق)\nالاستراتيجيات: الاستقصاء العملي.\n\n4. يوجه المعلم حل أسئلة الموضوع 1-1 (1–3) في كتاب الطالب ويراجع الإجابات، والطلبة يحلون الأسئلة فرديًا ثم يناقشون الإجابات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – حبل من ليف النخيل: تبني المجموعات نموذجًا ورقيًا للولب المزدوج وتشبهه بحبل مجدول من ليف النخيل في الحرف العمانية، ثم تطابق القواعد النيتروجينية المتممة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم:\n1. مستوى المعرفة: لماذا نستخدم منظفًا في الاستخلاص؟\n• الإجابة النموذجية: لإذابة الدهون في الغشاء البلازمي والغشاء النووي وتحرير ‎DNA‎.\n\n2. مستوى التطبيق: ماذا نلاحظ عند إضافة الإيثانول البارد؟\n• الإجابة النموذجية: تظهر خيوط بيضاء لزجة من ‎DNA‎ عند حد الإيثانول مع المحلول.\n\n3. مستوى الاستدلال: لماذا يترسب ‎DNA‎ في الإيثانول؟\n• الإجابة النموذجية: لأن ‎DNA‎ لا يذوب في الإيثانول فيتجمع ويترسب عند الحد الفاصل.", "1. مستوى المعرفة: اذكر احتياطين للسلامة في هذا الاستقصاء.\n• الإجابة النموذجية: الحذر عند استخدام السكين، وإبعاد الإيثانول عن اللهب، وارتداء النظارات الواقية.\n\n2. مستوى التطبيق: لماذا تكون الخيوط الظاهرة مكونة من ملايين جزيئات ‎DNA‎ لا جزيئًا واحدًا؟\n• الإجابة النموذجية: لأن جزيء ‎DNA‎ الواحد رفيع جدًا لا يُرى، والمرئي تجمع لعدد هائل من الجزيئات من خلايا كثيرة.\n\n3. مستوى الاستدلال: اقترح طريقة للتأكد أن الخيوط المستخلصة ‎DNA‎ وليست بروتينًا.\n• الإجابة النموذجية: إضافة إنزيم بروتييز قبل الترسيب (يبقى الراسب)، أو استخدام صبغة خاصة بـ ‎DNA‎، أو معاملته بإنزيم يحلل ‎DNA‎ فيختفي الراسب.", "إرشاد للطالب: كتابة تقرير مختصر عن الاستقصاء ومراجعة إجابات الأسئلة 1–3 ص 20–26\nإرشاد لولي الأمر: يمكن مشاركة الابن تجربة منزلية آمنة لاستخلاص ‎DNA‎ الفراولة بإشراف ولي الأمر\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1"], "h": ["<ol class=\"ol\"><li>ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات السلامة (5 دقائق)<\/li><li>يفسر دور كل من المنظف والملح والإيثانول البارد في عملية الاستخلاص (20 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يجيب عن أسئلة الموضوع 1-1 (1–3) موظفًا مفاهيم تركيب الأحماض النووية (15 دقيقة)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. تطبيق:<\/b> ينفذ خطوات استخلاص ‎DNA‎ من البصل باتباع التعليمات واحتياطات ا <span style=\"opacity:.85\">• الإجابة النموذجية: الحذر عند استخدام السكين، وإبعاد الإيثانول عن اللهب، وارتداء النظارات الواقية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا تكون الخيوط الظاهرة مكونة من ملايين جزيئات ‎DNA‎ لا جزيئًا واحدًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن جزيء ‎DNA‎ الواحد رفيع جدًا لا يُرى، والمرئي تجمع لعدد هائل من الجزيئات من خلايا كثيرة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> اقترح طريقة للتأكد أن الخيوط المستخلصة ‎DNA‎ وليست بروتينًا.<br><span style=\"opacity:.85\">• الإجابة النموذجية: إضافة إنزيم بروتييز قبل الترسيب (يبقى الراسب)، أو استخدام صبغة خاصة بـ ‎DNA‎، أو معاملته بإنزيم يحلل ‎DNA‎ فيختفي الراسب.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> كتابة تقرير مختصر عن الاستقصاء ومراجعة إجابات الأسئلة 1–3 ص 20–26<\/p><p><b>إرشاد لولي الأمر:<\/b> يمكن مشاركة الابن تجربة منزلية آمنة لاستخلاص ‎DNA‎ الفراولة بإشراف ولي الأمر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=1<\/p>"]}]}, {"title": "تضاعف ‎DNA‎", "sb": "ص 26–27", "unit": "الوحدة 1: الأحماض النووية وبناء البروتين", "periods": [{"axis": "خطوات تضاعف ‎DNA‎ ودور الإنزيمات", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "تضاعف ‎DNA‎"], ["الحصة", "1 من 3"], ["محور الحصة", "خطوات تضاعف ‎DNA‎ ودور الإنزيمات"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 26–27"], ["دليل المعلم", "ص 50–53"], ["كتاب التجارب العملية والأنشطة", "نشاط 1-1: إجابة أسئلة الاختيار من متعدد عن ‎DNA‎ ص 24"]], "t": ["1. يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة (15 دقيقة)\n2. يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف (15 دقيقة)\nمخرج تعليمي آخر: يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية (10 دقائق)", "1. فهم: يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة\n2. فهم: يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف\n3. تذكر (مخرج آخر): يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية", "- التعلم بالنمذجة\n- التعلم التعاوني\n- لعب الأدوار", "- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)", "التضاعف، الطور ‎S‎، الانفكاك، ‎DNA‎ بوليميريز، ‎DNA‎ ليجيز، النيوكليوتيدات الحرة، الشريط الأصلي (القالب).", "يسأل المعلم: «انقسمت خلية جلدك اليوم؛ كيف حصلت كل خلية جديدة على نسخة كاملة من ‎DNA‎؟» ويذكّر بدورة الخلية والطور ‎S‎.", "1. يطرح المعلم سؤال التهيئة ويعرض مخطط دورة الخلية، والطلبة يحددون الطور الذي يتضاعف فيه ‎DNA‎ (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم خطوات التضاعف باستخدام الشكل 1-7 (الانفكاك، ‎DNA‎ بوليميريز، الروابط الهيدروجينية، ‎DNA‎ ليجيز)، والطلبة يرسمون مخططًا انسيابيًا لخطوات التضاعف (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ينظم لعب أدوار: طلاب يمثلون الشريطين وآخرون ‎DNA‎ بوليميريز وليجيز ونيوكليوتيدات حرة، والطلبة يمثلون العملية ويصفون دور كل «ممثل» بلغة علمية (12 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n4. يدير المعلم التقويم الختامي ويوجه حل السؤال 4 في كتاب الطالب، والطلبة يجيبون عن السؤال 4 (أ، ب، ج) ويصححون جماعيًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم:\n1. مستوى المعرفة: ما الذي يُكسر عند انفكاك شريطي ‎DNA‎؟\n• الإجابة النموذجية: الروابط الهيدروجينية بين القواعد المتزاوجة.\n\n2. مستوى التطبيق: ما وظيفة ‎DNA‎ بوليميريز؟\n• الإجابة النموذجية: إضافة نيوكليوتيدات حرة متممة واحدًا تلو الآخر لبناء الشريط الجديد.\n\n3. مستوى الاستدلال: ما وظيفة ‎DNA‎ ليجيز؟\n• الإجابة النموذجية: ربط قطع الشريط الجديدة معًا بروابط فوسفوداي إستر.", "1. مستوى المعرفة: في أي جزء من الخلية حقيقية النواة يحدث تضاعف ‎DNA‎؟\n• الإجابة النموذجية: في النواة (وفي الميتوكوندريا والبلاستيدات الخضراء لـ ‎DNA‎ الخاص بها).\n\n2. مستوى التطبيق: كوّن قائمة بالجزيئات اللازمة لتضاعف ‎DNA‎.\n• الإجابة النموذجية: شريطا ‎DNA‎ الأصليان (قالب)، ونيوكليوتيدات حرة، وإنزيم ‎DNA‎ بوليميريز، وإنزيم ‎DNA‎ ليجيز، وطاقة.\n\n3. مستوى الاستدلال: لماذا يجب أن يتضاعف ‎DNA‎ قبل الانقسام الخلوي؟\n• الإجابة النموذجية: لتحصل كل خلية ناتجة على نسخة كاملة مطابقة من المعلومات الوراثية.", "إرشاد للطالب: مراجعة ص 26 وحل السؤال 4 في كتاب الطالب\nإرشاد لولي الأمر: مناقشة الابن في سبب تضاعف ‎DNA‎ قبل انقسام الخلية\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=2"], "h": ["<ol class=\"ol\"><li>يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة (15 دقيقة)<\/li><li>يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف (15 دقيقة)<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية (10 دقائق)<\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. فهم:<\/b> يصف أحداث تضاعف ‎DNA‎ في الطور ‎S‎: الانفكاك وكسر الروابط الهيدروجينية وإضافة النيوكليوتيدات المتممة<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. فهم:<\/b> يشرح دور إنزيمي ‎DNA‎ بوليميريز و‎DNA‎ ليجيز في التضاعف<\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. تذكر (مخرج آخر):<\/b> يحدد موقع حدوث تضاعف ‎DNA‎ في الخلية حقيقية النواة وتوقيته في دورة الخلية<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم التعاوني<\/span><span class=\"chip\">لعب الأدوار<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">نماذج مجسمة<\/span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>التضاعف، الطور ‎S‎، الانفكاك، ‎DNA‎ بوليميريز، ‎DNA‎ ليجيز، النيوكليوتيدات الحرة، الشريط الأصلي (القالب).<\/p>", "<p>يسأل المعلم: «انقسمت خلية جلدك اليوم؛ كيف حصلت كل خلية جديدة على نسخة كاملة من ‎DNA‎؟» ويذكّر بدورة الخلية والطور ‎S‎.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يطرح المعلم سؤال التهيئة ويعرض مخطط دورة الخلية، والطلبة يحددون الطور الذي يتضاعف فيه ‎DNA‎ (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم خطوات التضاعف باستخدام الشكل 1-7 (الانفكاك، ‎DNA‎ بوليميريز، الروابط الهيدروجينية، ‎DNA‎ ليجيز)، والطلبة يرسمون مخططًا انسيابيًا لخطوات التضاعف (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> ينظم لعب أدوار: طلاب يمثلون الشريطين وآخرون ‎DNA‎ بوليميريز وليجيز ونيوكليوتيدات حرة، والطلبة يمثلون العملية ويصفون دور كل «ممثل» بلغة علمية (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: لعب الأدوار.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي ويوجه حل السؤال 4 في كتاب الطالب، والطلبة يجيبون عن السؤال 4 (أ، ب، ج) ويصححون جماعيًا (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الذي يُكسر عند انفكاك شريطي ‎DNA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: الروابط الهيدروجينية بين القواعد المتزاوجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما وظيفة ‎DNA‎ بوليميريز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: إضافة نيوكليوتيدات حرة متممة واحدًا تلو الآخر لبناء الشريط الجديد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> ما وظيفة ‎DNA‎ ليجيز؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ربط قطع الشريط الجديدة معًا بروابط فوسفوداي إستر.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> في أي جزء من الخلية حقيقية النواة يحدث تضاعف ‎DNA‎؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في النواة (وفي الميتوكوندريا والبلاستيدات الخضراء لـ ‎DNA‎ الخاص بها).<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> كوّن قائمة بالجزيئات اللازمة لتضاعف ‎DNA‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: شريطا ‎DNA‎ الأصليان (قالب)، ونيوكليوتيدات حرة، وإنزيم ‎DNA‎ بوليميريز، وإنزيم ‎DNA‎ ليجيز، وطاقة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يجب أن يتضاعف ‎DNA‎ قبل الانقسام الخلوي؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لتحصل كل خلية ناتجة على نسخة كاملة مطابقة من المعلومات الوراثية.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 26 وحل السؤال 4 في كتاب الطالب<\/p><p><b>إرشاد لولي الأمر:<\/b> مناقشة الابن في سبب تضاعف ‎DNA‎ قبل انقسام الخلية<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=2<\/p>"]}, {"axis": "الشريط المتقدم والشريط المتأخر وقطع أوكازاكي", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "تضاعف ‎DNA‎"], ["الحصة", "2 من 3"], ["محور الحصة", "الشريط المتقدم والشريط المتأخر وقطع أوكازاكي"], ["الأسبوع والتاريخ", "ال dding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يناقش المعلم الإجابات ويدير التقويم الختامي والسؤال 5 من كتاب الطالب، والطلبة يرسمون جزيئي السؤال 5 ويقارنون إجاباتهم (9 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم الذاتي.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>5.<\/b> غلق الدرس (نشاط ممتع مع المواطنة) – ناسخ المخطوطة: يشبه كل زوج تضاعف DNA شبه المحافظ بناسخ يحتفظ بصفحة من مخطوطة عمانية قديمة ويكتب مقابلها نسخة جديدة، ثم يوضح دور كل إنزيم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: فكر – زاوج – شارك.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما المقصود بالتضاعف شبه المحافظ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن كل جزيء ‎DNA‎ ناتج يحتوي شريطًا أصليًا وشريطًا جديدًا.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لو كان التضاعف محافظًا، كيف سيبدو الجزيئان الناتجان؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: جزيء أصلي كما هو بشريطيه القديمين، وجزيء جديد بشريطين جديدين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> بعد جيلين من التضاعف شبه المحافظ لجزيء واحد، كم جزيئًا يحمل شريطًا أصليًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: جزيئان من أصل أربعة.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> لوّن الجزيئين الناتجين من تضاعف شبه محافظ لجزيء شريطاه أحمر وأزرق.<br><span style=\"opacity:.85\">• الإجابة النموذجية: كل جزيء ناتج: شريط أصلي (أحمر أو أزرق) مع شريط جديد بلون مختلف يمثل الجديد.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا سُمّي التضاعف «شبه» محافظ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه يحافظ على نصف الجزيء الأصلي فقط في كل جزيء ناتج.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا تضاعف جزيء ‎DNA‎ ثلاث مرات، فما نسبة الأشرطة الأصلية إلى مجموع الأشرطة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: 8 جزيئات = 16 شريطًا، منها شريطان أصليان؛ النسبة ‎2/16 = 1/8‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> إكمال نشاط 1-1 في كتاب التجارب ص 24 ومراجعة ص 27<\/p><p><b>إرشاد لولي الأمر:<\/b> التأكد من إنجاز الابن نشاط 1-1 ومناقشته في إجابة سؤال واحد<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=2<\/p>"]}]}, {"title": "الشيفرة الجينية", "sb": "ص 28", "unit": "الوحدة 1: الأحماض النووية وبناء البروتين", "periods": [{"axis": "الجين والشيفرة الثلاثية وخصائص الشيفرة", "n": 1, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الشيفرة الجينية"], ["الحصة", "1 من 2"], ["محور الحصة", "الجين والشيفرة الثلاثية وخصائص الشيفرة"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 28"], ["دليل المعلم", "ص 54–56"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يذكر أن الجين تتابع من النيوكليوتيدات في ‎DNA‎ يشفّر لعديد ببتيد (10 دقائق)\n2. يصف خصائص الشيفرة الجينية: ثلاثية، عالمية، غير متداخلة، منحلة (15 دقيقة)\nمخرج تعليمي آخر: يفسر لماذا يجب أن تكون الشيفرة ثلاثية القواعد رياضيًا (15 دقيقة)", "1. تذكر: يذكر أن الجين تتابع من النيوكليوتيدات في ‎DNA‎ يشفّر لعديد ببتيد\n2. فهم: يصف خصائص الشيفرة الجينية: ثلاثية، عالمية، غير متداخلة، منحلة\n3. تحليل (مخرج آخر): يفسر لماذا يجب أن تكون الشيفرة ثلاثية القواعد رياضيًا", "- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\ dding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> عرّف الجين.<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتابع من النيوكليوتيدات يشكل جزءًا من جزيء ‎DNA‎ ويشفر لعديد ببتيد معين.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ما الدليل على أن الشيفرة الجينية عالمية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: أن الثلاثيات نفسها تشفر الأحماض الأمينية نفسها في معظم الكائنات الحية تقريبًا، ولذلك يمكن نقل جين بشري إلى بكتيريا لتنتج البروتين البشري.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> إذا كان طول جين 900 قاعدة (دون إنترونات)، فكم حمضًا أمينيًا يشفر تقريبًا؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎900 ÷ 3 = 300‎ ثلاثية؛ أي نحو 299 حمضًا أمينيًا إذا كانت آخر ثلاثية شيفرة إيقاف.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 28 والاطلاع على الملحق 2 (ثلاثيات ‎DNA‎ وكودونات ‎mRNA‎)<\/p><p><b>إرشاد لولي الأمر:<\/b> مشاركة الابن لعبة رسائل مشفرة بالثلاثيات لتثبيت الفكرة<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=3<\/p>"]}, {"axis": "شيفرات البدء والإيقاف وقراءة جدول الشيفرة", "n": 2, "hi": [["المادة", "الأحياء – الصف الثاني عشر"], ["الوحدة", "الوحدة 1: الأحماض النووية وبناء البروتين"], ["الدرس", "الشيفرة الجينية"], ["الحصة", "2 من 2"], ["محور الحصة", "شيفرات البدء والإيقاف وقراءة جدول الشيفرة"], ["الأسبوع والتاريخ", "الأسبوع الثاني (13–17/9/2026)"], ["كتاب الطالب", "ص 28"], ["دليل المعلم", "ص 54–56"], ["كتاب التجارب العملية والأنشطة", "—"]], "t": ["1. يستخدم جدول الشيفرة الجينية لتحديد الأحماض الأمينية المقابلة لتتابع معين (10 دقائق)\n2. يحدد دور شيفرة البدء وشيفرات الإيقاف في تحديد بداية عديد الببتيد ونهايته (15 دقيقة)\nمخرج تعليمي آخر: يحل السؤال 7 في كتاب الطالب ويبرر إجابته (15 دقيقة)", "1. تطبيق: يستخدم جدول الشيفرة الجينية لتحديد الأحماض ا chip r\">الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>", "<p>النسخ، ‎RNA‎ بوليميريز، شريط القالب (شريط النسخ)، الشريط المشفر (غير القالب)، ‎mRNA‎، النيوكليوتيدات الحرة.<\/p>", "<p>يعرض المعلم صورة لمكتبة لا يُسمح بإخراج كتبها ويسأل: «كيف تنقل وصفة من كتاب محفوظ إلى المطبخ؟» ليربط بين بقاء ‎DNA‎ في النواة وحاجة الخلية إلى نسخة متنقلة.<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم تشبيه المكتبة ويستنتج مع الطلبة الحاجة إلى نسخة من الجين، والطلبة يقترحون كيف تنتقل المعلومات من النواة إلى الرايبوسوم (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح خطوات النسخ: انفكاك جزء من ‎DNA‎، وارتباط ‎RNA‎ بوليميريز، وتزاوج النيوكليوتيدات الحرة مع شريط القالب (‎U‎ مقابل ‎A‎)، والطلبة يرسمون مخططًا للنسخ ويحددون اتجاه بناء ‎mRNA‎ (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم التعاوني.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يقدّم المعلم تدريبًا موجهًا على كتابة تتابع ‎mRNA‎ من شريط قالب ثم من شريط مشفر، والطلبة يحلون ثلاثة تدريبات في أزواج ويقارنون الشريط المشفر بـ ‎mRNA‎ (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: الخرائط الذهنية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم التقويم الختامي ويصحح خطأ استخدام ‎T‎ في ‎mRNA‎، والطلبة يجيبون ويستنتجون أن ‎mRNA‎ يطابق الشريط المشفر مع استبدال ‎T‎ بـ ‎U‎ (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الإنزيم المسؤول عن النسخ؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎RNA‎ بوليميريز.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> اكتب ‎mRNA‎ الناتج من شريط القالب ‎3′-TACGGA-5′‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎5′-AUGCCU-3′‎<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> لماذا يشبه ‎mRNA‎ الشريطَ المشفر لا شريطَ القالب؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأنه متمم لشريط القالب، والشريط المشفر متمم له أيضًا، فيتطابقان عدا استبدال ‎T‎ بـ ‎U‎.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين تحدث عملية النسخ في الخلية حقيقية النواة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في النواة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> قارن بين ‎DNA‎ بوليميريز و‎RNA‎ بوليميريز من حيث الناتج.<br><span style=\"opacity:.85\">• الإجابة النموذجية: ‎DNA‎ بوليميريز يبني شريط ‎DNA‎ جديدًا أثناء التضاعف، أما ‎RNA‎ بوليميريز فيبني جزيء ‎mRNA‎ أثناء النسخ.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> الشريط المشفر لجزء من جين هو ‎5′-ATGTTC-3′‎. اكتب شريط القالب و‎mRNA‎.<br><span style=\"opacity:.85\">• الإجابة النموذجية: القالب: ‎3′-TACAAG-5′‎؛ ‎mRNA: 5′-AUGUUC-3′‎.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> مراجعة ص 29–30 والتدرب على كتابة ‎mRNA‎ من تتابعات مختلفة<\/p><p><b>إرشاد لولي الأمر:<\/b> سؤال الابن عن الفرق بين شريط القالب والشريط المشفر<\/p><p>🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/12/biology/?l=4<\/p>"]}, {"axis": "معالجة ‎mRNA‎: الإنترونات والإكسونا خر):<\/b> يقارن بين ‎mRNA‎ في بدائيات النواة وحقيقيات النواة من حيث المعالجة<\/p><\/div>", "<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة<\/span><span class=\"chip\">التعلم بالاكتشاف<\/span><span class=\"chip\">التعلم بالأقران<\/span><\/div>", "<div class=\"chips\"><span class=\"chip r\">الكتاب<\/span><span class=\"chip r\">السبورة الذكية<\/span><span class=\"chip r\">أخرى: شريط ورقي ملون يمثل الإكسونات والإنترونات ومقص<\/span><\/div>", "<p>نسخة ‎RNA‎ الأولية، معالجة ‎RNA‎، الإنترونات، الإكسونات، الربط، الربط البديل.<\/p>", "<p>يعرض المعلم جملة طويلة تتخللها كلمات زائدة ملونة ويطلب حذفها لقراءة الرسالة، ثم يسأل: «هل تحدث عملية مشابهة لـ ‎mRNA‎؟»<\/p>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1.<\/b> يعرض المعلم الجملة ويطلب استخراج الرسالة، والطلبة يحذفون الكلمات الزائدة ويستنتجون فكرة التعديل (5 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2.<\/b> يشرح المعلم معالجة ‎RNA‎ في حقيقيات النواة (الإنترونات، الإكسونات، الربط) والربط البديل، والطلبة يعرّفون المصطلحات في الدفتر ويرسمون نسخة أولية ونسخة ناضجة (12 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالاكتشاف.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3.<\/b> يوزع المعلم شرائط ورقية لنمذجة الربط والربط البديل، والطلبة يقصّون الإنترونات ويلصقون الإكسونات بترتيبين مختلفين ويعدّون البروتينات المحتملة (13 دقيقة)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالأقران.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:8px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>4.<\/b> يدير المعلم سؤالًا مفصليًا والتقويم الختامي، والطلبة يجيبون ويعللون اختلاف حجم ‎mRNA‎ الناضج عن النسخة الأولية (10 دقائق)<br><span style=\"opacity:.8\">الاستراتيجيات: التعلم بالنمذجة.<\/span><\/p><\/div>", "<p class=\"tfrd\" style=\"margin:0 0 6px;font-weight:700;color:#2E6F73\">تفريد التعليم:<\/p><div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> ما الإنترونات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: تتابعات غير مشفرة تُزال من نسخة ‎RNA‎ الأولية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> ماذا ينتج من ربط الإكسونات؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: جزيء ‎mRNA‎ ناضج يحمل التتابعات المشفرة فقط.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> نسخة أولية فيها 4 إكسونات؛ ماذا يعني الربط البديل لها؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: ربط إكسونات مختلفة أو بترتيبات مختلفة لإنتاج أكثر من ‎mRNA‎ وبالتالي أكثر من بروتين.<\/span><\/p><\/div>", "<div class=\"plist\"><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>1. مستوى المعرفة:<\/b> أين تحدث معالجة ‎RNA‎ في الخلية حقيقية النواة؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: في النواة قبل مغادرة ‎mRNA‎ عبر الثقوب النووية.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>2. مستوى التطبيق:<\/b> لماذا يكون ‎mRNA‎ الناضج أقصر من النسخة الأولية؟<br><span style=\"opacity:.85\">• الإجابة النموذجية: لأن الإنترونات أُزيلت منها.<\/span><\/p><p class=\"pstep\" style=\"margin:0;padding:10px 2px;border-bottom:1px dashed #d8d0bf;line-height:1.9\"><b>3. مستوى الاستدلال:<\/b> يحتوي جينوم الإنسان نحو 20 ألف جين لكنه ينتج عددًا أكبر بكثير من البروتينات. فسّر.<br><span style=\"opacity:.85\">• الإجابة النموذجية: بسبب الربط البديل، إذ تُربط إكسونات الجين بطرائق مختلفة فينتج الجين الواحد عدة بروتينات.<\/span><\/p><\/div>", "<p><b>إرشاد للطالب:<\/b> قراءة ص 31 وكتابة تعريفات
