ass=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نسبة النسل المتوقعة في تلقيح اختباري لجينين مرتبطين ارتباطًا تامًا دون عبور؟</td><td>1:1 (طرازان أبويان فقط).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يؤثر بعد الجينين على الكروموسوم في نسبة المؤتلفين؟</td><td>كلما زادت المسافة بينهما زاد احتمال العبور بينهما فتزيد نسبة المؤتلفين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح تفسيرًا لنتيجة تلقيح اختباري: 42% و40% (أبويان) و9% و9% (مؤتلفان).</td><td>الجينان مرتبطان على كروموسوم واحد، والعبور بينهما حدث في بعض الخلايا فقط فأنتج 18% مؤتلفين.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاطي 2-5 و2-6 ص 51–52 ومراجعة ص 66–70</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين الجينات المرتبطة وغير المرتبطة بمثال بسيط</p>"]},{"axis":"الاستقصاء العملي 2-2: نمذجة تكرار الأليلات ومراجعة الأسئلة","n":8,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","8 من 8"],["محور الحصة","الاستقصاء العملي 2-2: نمذجة تكرار الأليلات ومراجعة الأسئلة"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 56–70 + كتاب التجارب ص 60"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يستخدم نموذجًا (حبوبًا أو بطاقات ملونة) لمحاكاة تكرار الأليلات واحتمالات الأمشاج\n2. يقارن النتائج التجريبية بالنسب المتوقعة نظريًا ويفسر الفروق\nمخرج تعليمي آخر: يحل مجموعة مختارة من الأسئلة 7–22 في كتاب الطالب مراجعةً للدرس","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: حبوب أو خرز بلونين، أكياس ورقية، كتاب التجارب العملية والأنشطة","تكرار الأليل، الاحتمال، النسب المتوقعة، النسب الملاحظة، حجم العينة، الخطأ العشوائي.","يرمي المعلم قطعة نقود عشر مرات ويسأل: «هل كانت النتيجة 5:5 تمامًا؟ ولماذا لا تتطابق النتائج الفعلية مع المتوقعة دائمًا؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يجري التجربة السريعة ويناقش الاحتمال\nالطالب: يسجلون النتائج ويقارنونها بالتوقع\n2) (18 دقيقة: من الدقيقة 4 إلى 22)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 2-2 «نمذجة تكرار الأليلات» (كتاب التجارب ص 60)\nالطالب: يسحبون الخرز عشوائيًا ويسجلون الطرز الجينية ويحسبون النسب\n3) (8 دقائق: من الدقيقة 22 إلى 30)\nالمعلم: يجمع نتائج المجموعات في جدول صفي واحد\nالطالب: يقارنون النتائج المجمعة بالمتوقعة ويستنتجون أثر حجم العينة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يوجه حل أسئلة مختارة من 7–22 ثم التقويم الختامي\nالطالب: يحلون الأسئلة ويناقشونها\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ماذا يمثل كل كيس من الخرز في النموذج؟\n   الإجابة النموذجية: أمشاج أحد الأبوين بأليلاته.\n2) (المستوى المتوقع) السؤال: لماذا تقترب نتائج الصف المجمعة من النسبة المتوقعة أكثر من نتائج مجموعة واحدة؟\n   الإجابة النموذجية: لأن زيادة حجم العينة تقلل أثر الصدفة (الخطأ العشوائي).\n3) (المستوى المتقدم) السؤال: إذا كان الكيس يحوي 70 خرزة حمراء ‎(A)‎ و30 بيضاء ‎(a)‎، فما تكرار الأليل ‎a‎؟\n   الإجابة النموذجية: ‎30/100 = 0.3‎.","1) (مستوى الدعم) السؤال: ما الفرق بين النسبة المتوقعة والنسبة الملاحظة؟\n   الإجابة النموذجية: المتوقعة تُحسب نظريًا من مخطط الوراثة، والملاحظة تُعدّ فعليًا من النتائج.\n2) (المستوى المتوقع) السؤال: اقترح تعديلًا على النموذج لزيادة موثوقية النتائج.\n   الإجابة النموذجية: زيادة عدد مرات السحب وإرجاع الخرزة بعد كل سحب وتكرار التجربة.\n3) (المستوى المتقدم) السؤال: نتائج نسل: 152 سائد و48 متنحٍ. هل تتوافق مع 3:1؟ فسّر.\n   الإجابة النموذجية: المتوقع 150:50 من 200، والملاحظ قريب جدًا، فالنتائج تتوافق مع 3:1 والفرق صغير يُعزى إلى الصدفة.","إرشاد للطالب: كتابة تقرير الاستقصاء 2-2 وإكمال الأسئلة المتبقية من 7–22\nإرشاد لولي الأمر: التأكد من إنجاز الابن تقرير الاستقصاء ومراجعة مسائل الدرس كاملة"],"h":["<ol class=\"ol\"><li>يستخدم نموذجًا (حبوبًا أو بطاقات ملونة) لمحاكاة تكرار الأليلات واحتمالات الأمشاج</li><li>يقارن النتائج التجريبية بالنسب المتوقعة نظريًا ويفسر الفروق</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل مجموعة مختارة من الأسئلة 7–22 في كتاب الطالب مراجعةً للدرس</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يستخدم نموذجًا (حبوبًا أو بطاقات ملونة) لمحاكاة تكرار الأليلات واحتمالات الأمشاج</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن النتائج التجريبية بالنسب المتوقعة نظريًا ويفسر الفروق</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل مجموعة مختارة من الأسئلة 7–22 في كتاب الطالب مراجعةً للدرس</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: حبوب أو خرز بلونين، أكياس ورقية، كتاب التجارب العملية والأنشطة</span></div>","<p>تكرار الأليل، الاحتمال، النسب المتوقعة، النسب الملاحظة، حجم العينة، الخطأ العشوائي.</p>","<p>يرمي المعلم قطعة نقود عشر مرات ويسأل: «هل كانت النتيجة 5:5 تمامًا؟ ولماذا لا تتطابق النتائج الفعلية مع المتوقعة دائمًا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يجري التجربة السريعة ويناقش الاحتمال</td><td>يسجلون النتائج ويقارنونها بالتوقع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–22</span><br><small>18 دقيقة</small></td><td>يوجه تنفيذ الاستقصاء العملي 2-2 «نمذجة تكرار الأليلات» (كتاب التجارب ص 60)</td><td>يسحبون الخرز عشوائيًا ويسجلون الطرز الجينية ويحسبون النسب</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">22–30</span><br><small>8 دقائق</small></td><td>يجمع نتائج المجموعات في جدول صفي واحد</td><td>يقارنون النتائج المجمعة بالمتوقعة ويستنتجون أثر حجم العينة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يوجه حل أسئلة مختارة من 7–22 ثم التقويم الختامي</td><td>يحلون الأسئلة ويناقشونها</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا يمثل كل كيس من الخرز في النموذج؟</td><td>أمشاج أحد الأبوين بأليلاته.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تقترب نتائج الصف المجمعة من النسبة المتوقعة أكثر من نتائج مجموعة واحدة؟</td><td>لأن زيادة حجم العينة تقلل أثر الصدفة (الخطأ العشوائي).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>إذا كان الكيس يحوي 70 خرزة حمراء ‎(A)‎ و30 بيضاء ‎(a)‎، فما تكرار الأليل ‎a‎؟</td><td>‎30/100 = 0.3‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الفرق بين النسبة المتوقعة والنسبة الملاحظة؟</td><td>المتوقعة تُحسب نظريًا من مخطط الوراثة، والملاحظة تُعدّ فعليًا من النتائج.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اقترح تعديلًا على النموذج لزيادة موثوقية النتائج.</td><td>زيادة عدد مرات السحب وإرجاع الخرزة بعد كل سحب وتكرار التجربة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>نتائج نسل: 152 سائد و48 متنحٍ. هل تتوافق مع 3:1؟ فسّر.</td><td>المتوقع 150:50 من 200، والملاحظ قريب جدًا، فالنتائج تتوافق مع 3:1 والفرق صغير يُعزى إلى الصدفة.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 2-2 وإكمال الأسئلة المتبقية من 7–22</p><p><b>إرشاد لولي الأمر:</b> التأكد من إنجاز الابن تقرير الاستقصاء ومراجعة مسائل الدرس كاملة</p>"]}]},{"title":"الجينات والبروتينات والطراز المظهري","sb":"ص 71–73","unit":"الوحدة 2: الوراثة","periods":[{"axis":"المهق وفقر الدم المنجلي: من الجين إلى الطراز المظهري","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الجينات والبروتينات والطراز المظهري"],["الحصة","1 من 2"],["محور الحصة","المهق وفقر الدم المنجلي: من الجين إلى الطراز المظهري"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 71–72"],["دليل المعلم","ص 96–98"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح الصلة بين الجين ‎TYR‎ وإنزيم التايروسينيز والمهق\n2. يشرح الصلة بين الجين ‎HBB‎ والهيموجلوبين وفقر الدم المنجلي\nمخرج تعليمي آخر: يستخدم الطريقة المتفق عليها لكتابة رموز جينات الإنسان وبروتيناتها","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- دراسة الحالة","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","الجين ‎TYR‎، التايروسينيز، الميلانين، المهق، الجين ‎HBB‎، سلسلة β-جلوبين، الاختصارات الجينية (خط مائل للجين).","يعرض المعلم صورة لشخص مصاب بالمهق ويسأل: «ما البروتين الذي غاب هنا؟ وكيف يؤدي غياب إنزيم إلى لون مختلف للجلد والشعر والعينين؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون علاقة بين الإنزيم والصبغة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح طريقة كتابة الجينات (‎TYR‎ بخط مائل للجين ومستقيم للبروتين) ومسار التايروسين ← الميلانين\nالطالب: يرسمون سلسلة: جين ‎TYR ←‎ تايروسينيز ← ميلانين ← لون\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوزع بطاقتي حالة (المهق، فقر الدم المنجلي) على المجموعات لبناء سلسلة «جين ← بروتين ← طراز مظهري»\nالطالب: يكملون السلسلة ويعرضونها\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الإنزيم الذي يشفره الجين ‎TYR‎؟\n   الإجابة النموذجية: التايروسينيز.\n2) (المستوى المتوقع) السؤال: لماذا يكون المصاب بالمهق فاتح البشرة والشعر؟\n   الإجابة النموذجية: لغياب صبغة الميلانين أو نقصها بسبب عدم عمل التايروسينيز.\n3) (المستوى المتقدم) السؤال: كيف يُكتب رمز جين التايروسينيز ورمز البروتين؟\n   الإجابة النموذجية: الجين ‎TYR‎ بخط مائل، والبروتين ‎TYR‎ بخط غير مائل.","1) (مستوى الدعم) السؤال: ما البروتين الذي يشفره الجين ‎HBB‎؟\n   الإجابة النموذجية: سلسلة β-جلوبين في الهيموجلوبين.\n2) (المستوى المتوقع) السؤال: اكتب سلسلة من الجين إلى الطراز المظهري للمهق.\n   الإجابة النموذجية: أليل طافر للجين ‎TYR ←‎ تايروسينيز غير فعال ← عدم تحويل التايروسين إلى ميلانين ← غياب الصبغة في الجلد والشعر والعينين.\n3) (المستوى المتقدم) السؤال: لماذا يكون المهق صفة متنحية؟\n   الإجابة النموذجية: لأن أليلًا طبيعيًا واحدًا ينتج كمية كافية من التايروسينيز الفعال لتكوين الميلانين، فلا يظهر المهق إلا في متماثل الأليل الطافر.","إرشاد للطالب: مراجعة ص 71–72 وكتابة سلسلتي المهق وفقر الدم المنجلي\nإرشاد لولي الأمر: الحديث مع الابن عن احترام ذوي الحالات الوراثية والتوعية بها"],"h":["<ol class=\"ol\"><li>يشرح الصلة بين الجين ‎TYR‎ وإنزيم التايروسينيز والمهق</li><li>يشرح الصلة بين الجين ‎HBB‎ والهيموجلوبين وفقر الدم المنجلي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستخدم الطريقة المتفق عليها لكتابة رموز جينات الإنسان وبروتيناتها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح الصلة بين الجين ‎TYR‎ وإنزيم التايروسينيز والمهق</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح الصلة بين الجين ‎HBB‎ والهيموجلوبين وفقر الدم المنجلي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستخدم الطريقة المتفق عليها لكتابة رموز جينات الإنسان وبروتيناتها</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">دراسة الحالة</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الجين ‎TYR‎، التايروسينيز، الميلانين، المهق، الجين ‎HBB‎، سلسلة β-جلوبين، الاختصارات الجينية (خط مائل للجين).</p>","<p>يعرض المعلم صورة لشخص مصاب بالمهق ويسأل: «ما البروتين الذي غاب هنا؟ وكيف يؤدي غياب إنزيم إلى لون مختلف للجلد والشعر والعينين؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح السؤال</td><td>يقترحون علاقة بين الإنزيم والصبغة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح طريقة كتابة الجينات (‎TYR‎ بخط مائل للجين ومستقيم للبروتين) ومسار التايروسين ← الميلانين</td><td>يرسمون سلسلة: جين ‎TYR ←‎ تايروسينيز ← ميلانين ← لون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوزع بطاقتي حالة (المهق، فقر الدم المنجلي) على المجموعات لبناء سلسلة «جين ← بروتين ← طراز مظهري»</td><td>يكملون السلسلة ويعرضونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الإنزيم الذي يشفره الجين ‎TYR‎؟</td><td>التايروسينيز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون المصاب بالمهق فاتح البشرة والشعر؟</td><td>لغياب صبغة الميلانين أو نقصها بسبب عدم عمل التايروسينيز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يُكتب رمز جين التايروسينيز ورمز البروتين؟</td><td>الجين ‎TYR‎ بخط مائل، والبروتين ‎TYR‎ بخط غير مائل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما البروتين الذي يشفره الجين ‎HBB‎؟</td><td>سلسلة β-جلوبين في الهيموجلوبين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب سلسلة من الجين إلى الطراز المظهري للمهق.</td><td>أليل طافر للجين ‎TYR ←‎ تايروسينيز غير فعال ← عدم تحويل التايروسين إلى ميلانين ← غياب الصبغة في الجلد والشعر والعينين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون المهق صفة متنحية؟</td><td>لأن أليلًا طبيعيًا واحدًا ينتج كمية كافية من التايروسينيز الفعال لتكوين الميلانين، فلا يظهر المهق إلا في متماثل الأليل الطافر.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 71–72 وكتابة سلسلتي المهق وفقر الدم المنجلي</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن احترام ذوي الحالات الوراثية والتوعية بها</p>"]},{"axis":"الهيموفيليا ومرض هنتنغتون والاستشارة الوراثية","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الجينات والبروتينات والطراز المظهري"],["الحصة","2 من 2"],["محور الحصة","الهيموفيليا ومرض هنتنغتون والاستشارة الوراثية"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 72–73"],["دليل المعلم","ص 96–98"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح الصلة بين الجين ‎F8‎ والعامل الثامن والهيموفيليا\n2. يشرح الصلة بين الجين ‎HTT‎ وتكرار الثلاثية ‎CAG‎ ومرض هنتنغتون\nمخرج تعليمي آخر: يقدم استشارة وراثية مبسطة لأسرة في حالة افتراضية مبررًا الاحتمالات","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تقييم","- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- لعب الأدوار","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بطاقات حالات للاستشارة الوراثية","الجين ‎F8‎، العامل الثامن، الهيموفيليا، الجين ‎HTT‎، بروتين هنتنغتن، تكرار ‎CAG‎، مرض هنتنغتون، الاستشارة الوراثية.","يعرض المعلم شجرة عائلة الملكة فيكتوريا مبسطة ويسأل: «لماذا انتشرت الهيموفيليا بين الأمراء الذكور في الأسر الملكية الأوروبية؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الشجرة ويستثير النقاش (نشاط الملوك الأوروبيون والهيموفيليا)\nالطالب: يحددون الحاملات والمصابين\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح ‎F8‎ والعامل الثامن والتجلط، ثم ‎HTT‎ وتكرار ‎CAG‎ وسيادة الأليل وتأخر ظهور الأعراض\nالطالب: يقارنون بين الحالتين في جدول (نمط الوراثة، الجين، البروتين، الأثر)\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: ينظم لعب أدوار «استشارة وراثية» (نشاط دليل المعلم)\nالطالب: يؤدون دوري المستشار والأسرة ويحسبون الاحتمالات ويقدمون النصح\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما البروتين الذي يشفره الجين ‎F8‎؟\n   الإجابة النموذجية: العامل الثامن اللازم لتجلط الدم.\n2) (المستوى المتوقع) السؤال: كم مرة يجب أن تتكرر الثلاثية ‎CAG‎ ليصاب الشخص بمرض هنتنغتون غالبًا؟\n   الإجابة النموذجية: أكثر من 40 مرة.\n3) (المستوى المتقدم) السؤال: لماذا قد ينجب المصاب بهنتنغتون أطفالًا قبل معرفة إصابته؟\n   الإجابة النموذجية: لأن الأعراض لا تظهر غالبًا إلا بين سن 30 و40.","1) (مستوى الدعم) السؤال: ما نمط وراثة مرض هنتنغتون؟\n   الإجابة النموذجية: سائد (الأليل غير الطبيعي سائد).\n2) (المستوى المتوقع) السؤال: أب مصاب بهنتنغتون (متباين) وأم سليمة. ما احتمال إصابة الطفل؟\n   الإجابة النموذجية: 50% (واحد من اثنين).\n3) (المستوى المتقدم) السؤال: قارن بين الهيموفيليا وهنتنغتون من حيث نمط الوراثة وزمن ظهور الأعراض.\n   الإجابة النموذجية: الهيموفيليا متنحية مرتبطة بـ ‎X‎ وتظهر منذ الطفولة؛ هنتنغتون سائد على كروموسوم جسدي (4) وتظهر أعراضه غالبًا في منتصف العمر.","إرشاد للطالب: مراجعة ص 72–73 وإكمال جدول المقارنة بين الحالات الأربع\nإرشاد لولي الأمر: يمكن تعريف الابن بخدمة الفحص والاستشارة الوراثية المتوفرة في المؤسسات الصحية"],"h":["<ol class=\"ol\"><li>يشرح الصلة بين الجين ‎F8‎ والعامل الثامن والهيموفيليا</li><li>يشرح الصلة بين الجين ‎HTT‎ وتكرار الثلاثية ‎CAG‎ ومرض هنتنغتون</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقدم استشارة وراثية مبسطة لأسرة في حالة افتراضية مبررًا الاحتمالات</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح الصلة بين الجين ‎F8‎ والعامل الثامن والهيموفيليا</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح الصلة بين الجين ‎HTT‎ وتكرار الثلاثية ‎CAG‎ ومرض هنتنغتون</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقدم استشارة وراثية مبسطة لأسرة في حالة افتراضية مبررًا الاحتمالات</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">لعب الأدوار</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: بطاقات حالات للاستشارة الوراثية</span></div>","<p>الجين ‎F8‎، العامل الثامن، الهيموفيليا، الجين ‎HTT‎، بروتين هنتنغتن، تكرار ‎CAG‎، مرض هنتنغتون، الاستشارة الوراثية.</p>","<p>يعرض المعلم شجرة عائلة الملكة فيكتوريا مبسطة ويسأل: «لماذا انتشرت الهيموفيليا بين الأمراء الذكور في الأسر الملكية الأوروبية؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الشجرة ويستثير النقاش (نشاط الملوك الأوروبيون والهيموفيليا)</td><td>يحددون الحاملات والمصابين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح ‎F8‎ والعامل الثامن والتجلط، ثم ‎HTT‎ وتكرار ‎CAG‎ وسيادة الأليل وتأخر ظهور الأعراض</td><td>يقارنون بين الحالتين في جدول (نمط الوراثة، الجين، البروتين، الأثر)</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>ينظم لعب أدوار «استشارة وراثية» (نشاط دليل المعلم)</td><td>يؤدون دوري المستشار والأسرة ويحسبون الاحتمالات ويقدمون النصح</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما البروتين الذي يشفره الجين ‎F8‎؟</td><td>العامل الثامن اللازم لتجلط الدم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كم مرة يجب أن تتكرر الثلاثية ‎CAG‎ ليصاب الشخص بمرض هنتنغتون غالبًا؟</td><td>أكثر من 40 مرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا قد ينجب المصاب بهنتنغتون أطفالًا قبل معرفة إصابته؟</td><td>لأن الأعراض لا تظهر غالبًا إلا بين سن 30 و40.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نمط وراثة مرض هنتنغتون؟</td><td>سائد (الأليل غير الطبيعي سائد).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أب مصاب بهنتنغتون (متباين) وأم سليمة. ما احتمال إصابة الطفل؟</td><td>50% (واحد من اثنين).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قارن بين الهيموفيليا وهنتنغتون من حيث نمط الوراثة وزمن ظهور الأعراض.</td><td>الهيموفيليا متنحية مرتبطة بـ ‎X‎ وتظهر منذ الطفولة؛ هنتنغتون سائد على كروموسوم جسدي (4) وتظهر أعراضه غالبًا في منتصف العمر.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 72–73 وإكمال جدول المقارنة بين الحالات الأربع</p><p><b>إرشاد لولي الأمر:</b> يمكن تعريف الابن بخدمة الفحص والاستشارة الوراثية المتوفرة في المؤسسات الصحية</p>"]}]},{"title":"التحكم في التعبير الجيني","sb":"ص 73–85","unit":"الوحدة 2: الوراثة","periods":[{"axis":"الجينات التركيبية والمنظمة والإنزيمات القابلة للحث والتثبيط","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","التحكم في التعبير الجيني"],["الحصة","1 من 5"],["محور الحصة","الجينات التركيبية والمنظمة والإنزيمات القابلة للحث والتثبيط"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 73–74"],["دليل المعلم","ص 99–102"],["كتاب التجارب العملية والأنشطة","نشاط 2-8: التحكم في التعبير الجيني ص 55"]],"t":["1. يصف الاختلافات بين الجينات التركيبية والجينات المنظمة\n2. يميز بين الإنزيمات القابلة للحث والإنزيمات القابلة للتثبيط\nمخرج تعليمي آخر: يفسر أهمية التحكم في التعبير الجيني لتوفير الطاقة والمواد في الخلية","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية","التعبير الجيني، الجين التركيبي، الجين المنظم، الإنزيم القابل للحث، الإنزيم القابل للتثبيط، البروتين المثبط.","يسأل المعلم: «هل يعمل مصباح غرفتك طوال الوقت؟ لماذا لا تنتج الخلية كل بروتيناتها طوال الوقت أيضًا؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح تشبيه المصباح ويستقبل الإجابات\nالطالب: يربطون التحكم بتوفير الطاقة والمواد\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الجينات التركيبية والمنظمة وأنواع الإنزيمات بالأمثلة\nالطالب: يصنفون أمثلة بروتينات إلى تركيبية ومنظمة\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يقدم مواقف (وجود مادة أو غيابها) ويطلب تصنيف الإنزيم قابلًا للحث أو للتثبيط\nالطالب: يحللون المواقف في مجموعات ويبررون التصنيف\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الجين المنظم؟\n   الإجابة النموذجية: جين يشفر بروتينًا يتحكم في التعبير عن جينات أخرى.\n2) (المستوى المتوقع) السؤال: ما الإنزيم القابل للحث؟\n   الإجابة النموذجية: إنزيم يُنتج فقط عند وجود مادته الأساس (المحفِّز).\n3) (المستوى المتقدم) السؤال: لماذا تُعدّ إنتاجية الإنزيم عند الحاجة فقط ميزة للبكتيريا؟\n   الإجابة النموذجية: لأنها توفر الطاقة والأحماض الأمينية والنيوكليوتيدات التي كانت ستُهدر في إنتاج إنزيم غير لازم.","1) (مستوى الدعم) السؤال: ما الجين التركيبي؟\n   الإجابة النموذجية: جين يشفر بروتينًا ذا وظيفة في تركيب الخلية أو عملياتها (كالإنزيمات وبروتينات النقل).\n2) (المستوى المتوقع) السؤال: قارن بين الإنزيم القابل للحث والإنزيم القابل للتثبيط.\n   الإجابة النموذجية: القابل للحث يُنتج عند وجود مادته الأساس، والقابل للتثبيط يتوقف إنتاجه عند ارتفاع تركيز ناتجه النهائي.\n3) (المستوى المتقدم) السؤال: بكتيريا تعيش في وسط فيه جلوكوز ولا لاكتوز. توقع حالة إنزيم بيتا-جالاكتوسيديز وفسّر.\n   الإجابة النموذجية: لا يُنتج تقريبًا لأنه إنزيم قابل للحث يُنتج فقط عند وجود اللاكتوز.","إرشاد للطالب: مراجعة ص 73–74 وكتابة تعريفات المصطلحات\nإرشاد لولي الأمر: سؤال الابن عن تشبيه يوضح فكرة التحكم في تشغيل الجينات وإيقافها"],"h":["<ol class=\"ol\"><li>يصف الاختلافات بين الجينات التركيبية والجينات المنظمة</li><li>يميز بين الإنزيمات القابلة للحث والإنزيمات القابلة للتثبيط</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر أهمية التحكم في التعبير الجيني لتوفير الطاقة والمواد في الخلية</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف الاختلافات بين الجينات التركيبية والجينات المنظمة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين الإنزيمات القابلة للحث والإنزيمات القابلة للتثبيط</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر أهمية التحكم في التعبير الجيني لتوفير الطاقة والمواد في الخلية</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>التعبير الجيني، الجين التركيبي، الجين المنظم، الإنزيم القابل للحث، الإنزيم القابل للتثبيط، البروتين المثبط.</p>","<p>يسأل المعلم: «هل يعمل مصباح غرفتك طوال الوقت؟ لماذا لا تنتج الخلية كل بروتيناتها طوال الوقت أيضًا؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح تشبيه المصباح ويستقبل الإجابات</td><td>يربطون التحكم بتوفير الطاقة والمواد</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الجينات التركيبية والمنظمة وأنواع الإنزيمات بالأمثلة</td><td>يصنفون أمثلة بروتينات إلى تركيبية ومنظمة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يقدم مواقف (وجود مادة أو غيابها) ويطلب تصنيف الإنزيم قابلًا للحث أو للتثبيط</td><td>يحللون المواقف في مجموعات ويبررون التصنيف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الجين المنظم؟</td><td>جين يشفر بروتينًا يتحكم في التعبير عن جينات أخرى.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الإنزيم القابل للحث؟</td><td>إنزيم يُنتج فقط عند وجود مادته الأساس (المحفِّز).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تُعدّ إنتاجية الإنزيم عند الحاجة فقط ميزة للبكتيريا؟</td><td>لأنها توفر الطاقة والأحماض الأمينية والنيوكليوتيدات التي كانت ستُهدر في إنتاج إنزيم غير لازم.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الجين التركيبي؟</td><td>جين يشفر بروتينًا ذا وظيفة في تركيب الخلية أو عملياتها (كالإنزيمات وبروتينات النقل).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>قارن بين الإنزيم القابل للحث والإنزيم القابل للتثبيط.</td><td>القابل للحث يُنتج عند وجود مادته الأساس، والقابل للتثبيط يتوقف إنتاجه عند ارتفاع تركيز ناتجه النهائي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>بكتيريا تعيش في وسط فيه جلوكوز ولا لاكتوز. توقع حالة إنزيم بيتا-جالاكتوسيديز وفسّر.</td><td>لا يُنتج تقريبًا لأنه إنزيم قابل للحث يُنتج فقط عند وجود اللاكتوز.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 73–74 وكتابة تعريفات المصطلحات</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه يوضح فكرة التحكم في تشغيل الجينات وإيقافها</p>"]},{"axis":"أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","التحكم في التعبير الجيني"],["الحصة","2 من 5"],["محور الحصة","أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 74–75"],["دليل المعلم","ص 99–102"],["كتاب التجارب العملية والأنشطة","نشاط 2-8: التحكم في التعبير الجيني ص 55"]],"t":["1. يصف تركيب أوبرون ‎Lac‎: الجين المنظم، المحفز، المشغل، الجينات التركيبية ‎lacZ‎ و‎lacY‎ و‎lacA‎\n2. يشرح آلية التحكم في نسخ جينات أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده\nمخرج تعليمي آخر: يتنبأ بأثر طفرة في الجين المنظم أو المشغل على إنتاج الإنزيم","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تقييم","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","الأوبرون، أوبرون ‎Lac‎، الجين المنظم، البروتين المثبط، المحفز، المشغل، ‎lacZ‎، بيتا-جالاكتوسيديز، الإشريكية القولونية.","يعرض المعلم صورة بكتيريا الإشريكية القولونية في الأمعاء ويسأل: «بعد شربك الحليب يصل اللاكتوز إليها فجأة؛ كيف تشغّل جينات هضمه بسرعة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويعرض الشكل 2-10\nالطالب: يحددون مكونات الأوبرون على الشكل\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح الحالتين: غياب اللاكتوز (المثبط على المشغل) ووجوده (اللاكتوز يرتبط بالمثبط فيتغير شكله وينفصل)\nالطالب: يرسمون مخططين للحالتين بالأسهم\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يقدم أسئلة «ماذا لو؟» عن طفرات في المنظم أو المشغل\nالطالب: يتنبؤون بالنتيجة في أزواج ويبررون\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أين يرتبط البروتين المثبط في غياب اللاكتوز؟\n   الإجابة النموذجية: بالمشغل، فيمنع ‎RNA‎ بوليميريز من نسخ الجينات التركيبية.\n2) (المستوى المتوقع) السؤال: ماذا يحدث للمثبط عند وجود اللاكتوز؟\n   الإجابة النموذجية: يرتبط به اللاكتوز فيتغير شكله وينفصل عن المشغل.\n3) (المستوى المتقدم) السؤال: لماذا تُنسخ جينات ‎lacZ‎ و‎lacY‎ و‎lacA‎ معًا؟\n   الإجابة النموذجية: لأنها تحت تحكم المحفز نفسه في الأوبرون.","1) (مستوى الدعم) السؤال: ما وظيفة الجين المنظم في أوبرون ‎Lac‎؟\n   الإجابة النموذجية: يشفر البروتين المثبط.\n2) (المستوى المتوقع) السؤال: صف ما يحدث لنسخ الجينات التركيبية عند إضافة اللاكتوز.\n   الإجابة النموذجية: ينفصل المثبط عن المشغل فيرتبط ‎RNA‎ بوليميريز بالمحفز وينسخ الجينات التركيبية فيُنتج بيتا-جالاكتوسيديز.\n3) (المستوى المتقدم) السؤال: طفرة جعلت البروتين المثبط غير قادر على الارتباط بالمشغل. توقع النتيجة.\n   الإجابة النموذجية: تُنسخ الجينات التركيبية باستمرار حتى في غياب اللاكتوز، فيُهدر الإنزيم والطاقة.","إرشاد للطالب: مراجعة ص 74–75 ورسم مخططي أوبرون ‎Lac‎ في الحالتين\nإرشاد لولي الأمر: متابعة الابن في شرح المخطط بصوته لتثبيت الخطوات"],"h":["<ol class=\"ol\"><li>يصف تركيب أوبرون ‎Lac‎: الجين المنظم، المحفز، المشغل، الجينات التركيبية ‎lacZ‎ و‎lacY‎ و‎lacA‎</li><li>يشرح آلية التحكم في نسخ جينات أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بأثر طفرة في الجين المنظم أو المشغل على إنتاج الإنزيم</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب أوبرون ‎Lac‎: الجين المنظم، المحفز، المشغل، الجينات التركيبية ‎lacZ‎ و‎lacY‎ و‎lacA‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح آلية التحكم في نسخ جينات أوبرون ‎Lac‎ في غياب اللاكتوز ووجوده</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بأثر طفرة في الجين المنظم أو المشغل على إنتاج الإنزيم</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الأوبرون، أوبرون ‎Lac‎، الجين المنظم، البروتين المثبط، المحفز، المشغل، ‎lacZ‎، بيتا-جالاكتوسيديز، الإشريكية القولونية.</p>","<p>يعرض المعلم صورة بكتيريا الإشريكية القولونية في الأمعاء ويسأل: «بعد شربك الحليب يصل اللاكتوز إليها فجأة؛ كيف تشغّل جينات هضمه بسرعة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويعرض الشكل 2-10</td><td>يحددون مكونات الأوبرون على الشكل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح الحالتين: غياب اللاكتوز (المثبط على المشغل) ووجوده (اللاكتوز يرتبط بالمثبط فيتغير شكله وينفصل)</td><td>يرسمون مخططين للحالتين بالأسهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يقدم أسئلة «ماذا لو؟» عن طفرات في المنظم أو المشغل</td><td>يتنبؤون بالنتيجة في أزواج ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين يرتبط البروتين المثبط في غياب اللاكتوز؟</td><td>بالمشغل، فيمنع ‎RNA‎ بوليميريز من نسخ الجينات التركيبية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث للمثبط عند وجود اللاكتوز؟</td><td>يرتبط به اللاكتوز فيتغير شكله وينفصل عن المشغل.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تُنسخ جينات ‎lacZ‎ و‎lacY‎ و‎lacA‎ معًا؟</td><td>لأنها تحت تحكم المحفز نفسه في الأوبرون.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة الجين المنظم في أوبرون ‎Lac‎؟</td><td>يشفر البروتين المثبط.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صف ما يحدث لنسخ الجينات التركيبية عند إضافة اللاكتوز.</td><td>ينفصل المثبط عن المشغل فيرتبط ‎RNA‎ بوليميريز بالمحفز وينسخ الجينات التركيبية فيُنتج بيتا-جالاكتوسيديز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>طفرة جعلت البروتين المثبط غير قادر على الارتباط بالمشغل. توقع النتيجة.</td><td>تُنسخ الجينات التركيبية باستمرار حتى في غياب اللاكتوز، فيُهدر الإنزيم والطاقة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 74–75 ورسم مخططي أوبرون ‎Lac‎ في الحالتين</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في شرح المخطط بصوته لتثبيت الخطوات</p>"]},{"axis":"عوامل النسخ في حقيقيات النواة","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","التحكم في التعبير الجيني"],["الحصة","3 من 5"],["محور الحصة","عوامل النسخ في حقيقيات النواة"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 75–76"],["دليل المعلم","ص 99–102"],["كتاب التجارب العملية والأنشطة","نشاط 2-8: التحكم في التعبير الجيني ص 55"]],"t":["1. يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة\n2. يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز\nمخرج تعليمي آخر: يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد)","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","عامل النسخ، عامل النسخ المنشط، عامل النسخ المثبط، موقع الارتباط، المحفز، التعبير الجيني في حقيقيات النواة.","يسأل المعلم: «لماذا يسمرّ الجلد بعد التعرض للشمس أيامًا؟ ما الذي يأمر خلايا الجلد بإنتاج صبغة أكثر؟» (نشاط عوامل النسخ والدباغة).","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح سؤال الدباغة ويستقبل الفرضيات\nالطالب: يقترحون دورًا لإشارة تشغل الجينات\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح عوامل النسخ ونوعيها بالشكل 2-11\nالطالب: يرسمون الحالتين ويحددون موقع ارتباط العامل والمحفز\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يقدم سيناريو الدباغة واصطباغ الجلد ويطلب سلسلة: ضوء ← إشارة ← عامل نسخ ← جين الصبغة ← ميلانين\nالطالب: يكملون السلسلة في مجموعات ويعرضونها\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما عامل النسخ؟\n   الإجابة النموذجية: بروتين يرتبط بموقع محدد في ‎DNA‎ فيزيد أو يقلل نسخ جين معين.\n2) (المستوى المتوقع) السؤال: كيف يزيد عامل النسخ المنشط معدل النسخ؟\n   الإجابة النموذجية: يحفز ارتباط ‎RNA‎ بوليميريز بالمحفز.\n3) (المستوى المتقدم) السؤال: اذكر استجابة يتحكم فيها عامل نسخ.\n   الإجابة النموذجية: الاستجابة للهرمونات مثل التستوستيرون، أو التطور من زيجوت إلى جنين، أو تنظيم نمو الخلايا وموتها.","1) (مستوى الدعم) السؤال: كيف يقلل عامل النسخ المثبط التعبير الجيني؟\n   الإجابة النموذجية: بالارتباط بموقعه في ‎DNA‎ ومنع ارتباط ‎RNA‎ بوليميريز بالمحفز.\n2) (المستوى المتوقع) السؤال: قارن بين التحكم في التعبير الجيني في بدائيات النواة وحقيقيات النواة.\n   الإجابة النموذجية: في بدائيات النواة بالأوبرونات (مثل ‎Lac‎) ومثبط على المشغل؛ وفي حقيقيات النواة بعوامل نسخ منشطة ومثبطة ترتبط بمواقع في ‎DNA‎.\n3) (المستوى المتقدم) السؤال: لماذا تحتوي خلايا الكبد والعضلات الجينات نفسها لكنها تنتج بروتينات مختلفة؟\n   الإجابة النموذجية: لأن عوامل نسخ مختلفة نشطة في كل نوع خلايا فتُشغَّل جينات مختلفة.","إرشاد للطالب: مراجعة ص 75–76 وكتابة سلسلة الدباغة\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية الوقاية من أشعة الشمس الطويلة رغم أن الدباغة استجابة دفاعية"],"h":["<ol class=\"ol\"><li>يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة</li><li>يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يذكر أن عوامل النسخ بروتينات ترتبط بـ ‎DNA‎ وتتحكم في التعبير الجيني في حقيقيات النواة</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين عامل النسخ المنشط وعامل النسخ المثبط من حيث تأثيرهما في ارتباط ‎RNA‎ بوليميريز بالمحفز</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط عوامل النسخ بالاستجابة للهرمونات والمنبهات البيئية (مثل الدباغة واصطباغ الجلد)</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>عامل النسخ، عامل النسخ المنشط، عامل النسخ المثبط، موقع الارتباط، المحفز، التعبير الجيني في حقيقيات النواة.</p>","<p>يسأل المعلم: «لماذا يسمرّ الجلد بعد التعرض للشمس أيامًا؟ ما الذي يأمر خلايا الجلد بإنتاج صبغة أكثر؟» (نشاط عوامل النسخ والدباغة).</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح سؤال الدباغة ويستقبل الفرضيات</td><td>يقترحون دورًا لإشارة تشغل الجينات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح عوامل النسخ ونوعيها بالشكل 2-11</td><td>يرسمون الحالتين ويحددون موقع ارتباط العامل والمحفز</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يقدم سيناريو الدباغة واصطباغ الجلد ويطلب سلسلة: ضوء ← إشارة ← عامل نسخ ← جين الصبغة ← ميلانين</td><td>يكملون السلسلة في مجموعات ويعرضونها</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما عامل النسخ؟</td><td>بروتين يرتبط بموقع محدد في ‎DNA‎ فيزيد أو يقلل نسخ جين معين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يزيد عامل النسخ المنشط معدل النسخ؟</td><td>يحفز ارتباط ‎RNA‎ بوليميريز بالمحفز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر استجابة يتحكم فيها عامل نسخ.</td><td>الاستجابة للهرمونات مثل التستوستيرون، أو التطور من زيجوت إلى جنين، أو تنظيم نمو الخلايا وموتها.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف يقلل عامل النسخ المثبط التعبير الجيني؟</td><td>بالارتباط بموقعه في ‎DNA‎ ومنع ارتباط ‎RNA‎ بوليميريز بالمحفز.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>قارن بين التحكم في التعبير الجيني في بدائيات النواة وحقيقيات النواة.</td><td>في بدائيات النواة بالأوبرونات (مثل ‎Lac‎) ومثبط على المشغل؛ وفي حقيقيات النواة بعوامل نسخ منشطة ومثبطة ترتبط بمواقع في ‎DNA‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تحتوي خلايا الكبد والعضلات الجينات نفسها لكنها تنتج بروتينات مختلفة؟</td><td>لأن عوامل نسخ مختلفة نشطة في كل نوع خلايا فتُشغَّل جينات مختلفة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 75–76 وكتابة سلسلة الدباغة</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أهمية الوقاية من أشعة الشمس الطويلة رغم أن الدباغة استجابة دفاعية</p>"]},{"axis":"نشاط 2-8 ولعب أدوار أوبرون ‎Lac‎","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","التحكم في التعبير الجيني"],["الحصة","4 من 5"],["محور الحصة","نشاط 2-8 ولعب أدوار أوبرون ‎Lac‎"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 73–76 + كتاب التجارب ص 55"],["دليل المعلم","ص 99–102"],["كتاب التجارب العملية والأنشطة","نشاط 2-8: التحكم في التعبير الجيني ص 55"]],"t":["1. يمثل آلية عمل أوبرون ‎Lac‎ في الحالتين بلعب الأدوار\n2. يحل أسئلة نشاط 2-8 «التحكم في التعبير الجيني» موظفًا مفاهيم الدرس\nمخرج تعليمي آخر: يقيّم دقة تمثيل الزملاء ويصحح الأخطاء العلمية فيه","المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم المبني على اللعب\n- التعلم التعاوني\n- لعب الأدوار","- الكتاب\n- أخرى: بطاقات أدوار (منظم، مثبط، مشغل، محفز، ‎RNA‎ بوليميريز، لاكتوز)، كتاب التجارب العملية والأنشطة","نمذجة الأوبرون، الحالة المغلقة، الحالة المفتوحة، التحكم السلبي، المحاكاة.","يوزع المعلم بطاقات أدوار ويقول: «اليوم أنتم أوبرون ‎Lac‎ داخل بكتيريا؛ وسأكون أنا كوب الحليب المفاجئ!»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يوزع الأدوار ويحدد القواعد\nالطالب: يتعرفون أدوارهم\n2) (14 دقيقة: من الدقيقة 4 إلى 18)\nالمعلم: يدير لعب الأدوار «أوبرون ‎Lac» (‎دليل المعلم) في حالتي غياب اللاكتوز ووجوده\nالطالب: يمثلون الحالتين ويعلق المراقبون على الدقة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوجه حل نشاط 2-8 (كتاب التجارب ص 55)\nالطالب: يحلون الأسئلة في أزواج\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التحكم في التعبير الجيني\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: من يقف على المشغل في بداية لعب الأدوار؟ ولماذا؟\n   الإجابة النموذجية: البروتين المثبط، لأن اللاكتوز غائب.\n2) (المستوى المتوقع) السؤال: ماذا يفعل «اللاكتوز» عند دخوله المشهد؟\n   الإجابة النموذجية: يرتبط بالمثبط فيغير شكله وينفصل عن المشغل.\n3) (المستوى المتقدم) السؤال: ماذا يحدث بعد استهلاك كل اللاكتوز؟\n   الإجابة النموذجية: يعود المثبط الحر إلى الارتباط بالمشغل فيتوقف النسخ.","1) (مستوى الدعم) السؤال: ما الدور الذي لا يغيب أبدًا عن المشهد في الحالتين؟ ولماذا؟\n   الإجابة النموذجية: الجين المنظم وإنتاج المثبط، لأنه يُنسخ باستمرار.\n2) (المستوى المتوقع) السؤال: رتب الأحداث عند إضافة اللاكتوز: نسخ الجينات، انفصال المثبط، ارتباط اللاكتوز، ارتباط ‎RNA‎ بوليميريز.\n   الإجابة النموذجية: ارتباط اللاكتوز بالمثبط ← انفصال المثبط ← ارتباط ‎RNA‎ بوليميريز ← نسخ الجينات.\n3) (المستوى المتقدم) السؤال: انتقد العبارة: «اللاكتوز يرتبط بالمشغل ليشغل الجينات».\n   الإجابة النموذجية: خطأ؛ اللاكتوز يرتبط بالبروتين المثبط لا بالمشغل، فيغير شكله وينفصل عن المشغل.","إرشاد للطالب: إكمال نشاط 2-8 ص 55 ومراجعة أخطاء لعب الأدوار\nإرشاد لولي الأمر: التأكد من إكمال الابن نشاط 2-8"],"h":["<ol class=\"ol\"><li>يمثل آلية عمل أوبرون ‎Lac‎ في الحالتين بلعب الأدوار</li><li>يحل أسئلة نشاط 2-8 «التحكم في التعبير الجيني» موظفًا مفاهيم الدرس</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم دقة تمثيل الزملاء ويصحح الأخطاء العلمية فيه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يمثل آلية عمل أوبرون ‎Lac‎ في الحالتين بلعب الأدوار</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نشاط 2-8 «التحكم في التعبير الجيني» موظفًا مفاهيم الدرس</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم دقة تمثيل الزملاء ويصحح الأخطاء العلمية فيه</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">لعب الأدوار</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">أخرى: بطاقات أدوار (منظم، مثبط، مشغل، محفز، ‎RNA‎ بوليميريز، لاكتوز)، كتاب التجارب العملية والأنشطة</span></div>","<p>نمذجة الأوبرون، الحالة المغلقة، الحالة المفتوحة، التحكم السلبي، المحاكاة.</p>","<p>يوزع المعلم بطاقات أدوار ويقول: «اليوم أنتم أوبرون ‎Lac‎ داخل بكتيريا؛ وسأكون أنا كوب الحليب المفاجئ!»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يوزع الأدوار ويحدد القواعد</td><td>يتعرفون أدوارهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–18</span><br><small>14 دقيقة</small></td><td>يدير لعب الأدوار «أوبرون ‎Lac» (‎دليل المعلم) في حالتي غياب اللاكتوز ووجوده</td><td>يمثلون الحالتين ويعلق المراقبون على الدقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يوجه حل نشاط 2-8 (كتاب التجارب ص 55)</td><td>يحلون الأسئلة في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على التحكم في التعبير الجيني</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>من يقف على المشغل في بداية لعب الأدوار؟ ولماذا؟</td><td>البروتين المثبط، لأن اللاكتوز غائب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يفعل «اللاكتوز» عند دخوله المشهد؟</td><td>يرتبط بالمثبط فيغير شكله وينفصل عن المشغل.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث بعد استهلاك كل اللاكتوز؟</td><td>يعود المثبط الحر إلى الارتباط بالمشغل فيتوقف النسخ.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الدور الذي لا يغيب أبدًا عن المشهد في الحالتين؟ ولماذا؟</td><td>الجين المنظم وإنتاج المثبط، لأنه يُنسخ باستمرار.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب الأحداث عند إضافة اللاكتوز: نسخ الجينات، انفصال المثبط، ارتباط اللاكتوز، ارتباط ‎RNA‎ بوليميريز.</td><td>ارتباط اللاكتوز بالمثبط ← انفصال المثبط ← ارتباط ‎RNA‎ بوليميريز ← نسخ الجينات.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>انتقد العبارة: «اللاكتوز يرتبط بالمشغل ليشغل الجينات».</td><td>خطأ؛ اللاكتوز يرتبط بالبروتين المثبط لا بالمشغل، فيغير شكله وينفصل عن المشغل.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-8 ص 55 ومراجعة أخطاء لعب الأدوار</p><p><b>إرشاد لولي الأمر:</b> التأكد من إكمال الابن نشاط 2-8</p>"]},{"axis":"مراجعة الوحدة الثانية وأسئلة نهاية الوحدة","n":5,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","التحكم في التعبير الجيني"],["الحصة","5 من 5"],["محور الحصة","مراجعة الوحدة الثانية وأسئلة نهاية الوحدة"],["الأسبوع والتاريخ","الأسبوع الثامن (25–29/10/2026)"],["كتاب الطالب","ص 77–85"],["دليل المعلم","ص 99–102"],["كتاب التجارب العملية والأنشطة","نشاط 2-8: التحكم في التعبير الجيني ص 55"]],"t":["1. يلخص المفاهيم الرئيسة للوحدة الثانية في منظم بصري\n2. يحل أسئلة نهاية الوحدة الثانية في الانقسام الاختزالي والوراثة والتحكم الجيني\nمخرج تعليمي آخر: يقيّم تعلمه باستخدام قائمة التقويم الذاتي ويحدد موضوعات المراجعة","المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب\n- التقييم الذاتي","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎","ملخص الوحدة، أسئلة نهاية الوحدة، قائمة التقويم الذاتي، المنظم البصري.","ينظم المعلم «سباق الدقيقة»: كل مجموعة تكتب أكبر عدد من المصطلحات الصحيحة من الوحدة الثانية خلال دقيقة واحدة.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يدير سباق الدقيقة ويجمع المصطلحات\nالطالب: يتنافسون في كتابة المصطلحات\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يوجه بناء منظم بصري للوحدة (انقسام اختزالي ← تباين ← وراثة ← تحكم)\nالطالب: يبنون المنظم في مجموعات\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوزع أسئلة نهاية الوحدة (ص 78–85) على المجموعات ويتابع الحلول\nالطالب: يحلون ويعرضون إجابات مختارة\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات للمراجعة ويوجه قائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: اربط بين الانقسام الاختزالي والتباين الجيني.\n   الإجابة النموذجية: الانقسام الاختزالي يسبب التباين بالعبور والاصطفاف العشوائي، ثم يزيده الإخصاب العشوائي.\n2) (المستوى المتوقع) السؤال: ما نسبة الطرز المظهرية لتزاوج ثنائي الهجين بين متباينين لجينين غير مرتبطين؟\n   الإجابة النموذجية: 9:3:3:1.\n3) (المستوى المتقدم) السؤال: كيف يتحكم البروتين المثبط في أوبرون ‎Lac‎؟\n   الإجابة النموذجية: يرتبط بالمشغل في غياب اللاكتوز فيمنع النسخ.","1) (مستوى الدعم) السؤال: عدّد ثلاثة مصادر للتباين الجيني في التكاثر الجنسي.\n   الإجابة النموذجية: العبور، والاصطفاف العشوائي، والإخصاب العشوائي.\n2) (المستوى المتوقع) السؤال: أم حاملة لعمى الألوان وأب سليم. ما احتمال إنجاب بنت مصابة؟\n   الإجابة النموذجية: 0%، لأن البنات يرثن ‎Xᴮ‎ السليم من الأب.\n3) (المستوى المتقدم) السؤال: قيّم: «كل طفرة تؤدي إلى مرض وراثي».\n   الإجابة النموذجية: غير صحيحة؛ بعض الطفرات صامتة أو في إنترونات أو لا تغير وظيفة البروتين، وبعضها قد يكون مفيدًا.","إرشاد للطالب: مراجعة ملخص الوحدة ص 77 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج قائمة التقويم الذاتي ووضع خطة مراجعة قصيرة"],"h":["<ol class=\"ol\"><li>يلخص المفاهيم الرئيسة للوحدة الثانية في منظم بصري</li><li>يحل أسئلة نهاية الوحدة الثانية في الانقسام الاختزالي والوراثة والتحكم الجيني</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه باستخدام قائمة التقويم الذاتي ويحدد موضوعات المراجعة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يلخص المفاهيم الرئيسة للوحدة الثانية في منظم بصري</td><td class=\"lv\">إبداع</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نهاية الوحدة الثانية في الانقسام الاختزالي والوراثة والتحكم الجيني</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه باستخدام قائمة التقويم الذاتي ويحدد موضوعات المراجعة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التقييم الذاتي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span></div>","<p>ملخص الوحدة، أسئلة نهاية الوحدة، قائمة التقويم الذاتي، المنظم البصري.</p>","<p>ينظم المعلم «سباق الدقيقة»: كل مجموعة تكتب أكبر عدد من المصطلحات الصحيحة من الوحدة الثانية خلال دقيقة واحدة.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يدير سباق الدقيقة ويجمع المصطلحات</td><td>يتنافسون في كتابة المصطلحات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يوجه بناء منظم بصري للوحدة (انقسام اختزالي ← تباين ← وراثة ← تحكم)</td><td>يبنون المنظم في مجموعات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–30</span><br><small>15 دقيقة</small></td><td>يوزع أسئلة نهاية الوحدة (ص 78–85) على المجموعات ويتابع الحلول</td><td>يحلون ويعرضون إجابات مختارة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات للمراجعة ويوجه قائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اربط بين الانقسام الاختزالي والتباين الجيني.</td><td>الانقسام الاختزالي يسبب التباين بالعبور والاصطفاف العشوائي، ثم يزيده الإخصاب العشوائي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما نسبة الطرز المظهرية لتزاوج ثنائي الهجين بين متباينين لجينين غير مرتبطين؟</td><td>9:3:3:1.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يتحكم البروتين المثبط في أوبرون ‎Lac‎؟</td><td>يرتبط بالمشغل في غياب اللاكتوز فيمنع النسخ.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عدّد ثلاثة مصادر للتباين الجيني في التكاثر الجنسي.</td><td>العبور، والاصطفاف العشوائي، والإخصاب العشوائي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أم حاملة لعمى الألوان وأب سليم. ما احتمال إنجاب بنت مصابة؟</td><td>0%، لأن البنات يرثن ‎Xᴮ‎ السليم من الأب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم: «كل طفرة تؤدي إلى مرض وراثي».</td><td>غير صحيحة؛ بعض الطفرات صامتة أو في إنترونات أو لا تغير وظيفة البروتين، وبعضها قد يكون مفيدًا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ملخص الوحدة ص 77 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على نتائج قائمة التقويم الذاتي ووضع خطة مراجعة قصيرة</p>"]}]},{"title":"الهندسة الجينية","sb":"ص 86","unit":"الوحدة 3: التقنية الجينية","periods":[{"axis":"مفهوم الهندسة الجينية و‎DNA‎ معاد التركيب","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","الهندسة الجينية"],["الحصة","1 من 1"],["محور الحصة","مفهوم الهندسة الجينية و‎DNA‎ معاد التركيب"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 86"],["دليل المعلم","ص 130–132"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح معنى المصطلح ‎DNA‎ معاد التركيب\n2. يشرح أن الهندسة الجينية معالجة مقصودة للمادة الجينية لتعديل خصائص معينة في الكائن الحي\nمخرج تعليمي آخر: يميز بين مصادر الجينات المنقولة: من النوع نفسه أو من نوع آخر أو مصنعة","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم بالأقران","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","الهندسة الجينية، ‎DNA‎ معاد التركيب، الكائن المعدل جينيًا، الجين المطلوب، الكائن المستقبِل، النوع المانح.","يعرض المعلم صورة عبوة إنسولين ويسأل: «كان مرضى السكري يعتمدون على إنسولين من بنكرياس الأبقار والخنازير؛ كيف أصبحت البكتيريا اليوم تنتج إنسولينًا بشريًا؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح سؤال الإنسولين ويستقبل الفرضيات\nالطالب: يقترحون نقل الجين البشري إلى البكتيريا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يقدّم «لمحة عامة عن الهندسة الجينية» (دليل المعلم) ويعرّف ‎DNA‎ معاد التركيب ومصادر الجينات\nالطالب: يكتبون التعريفات ويرسمون مخططًا مبسطًا لخطوات الهندسة الجينية\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: يوزع بطاقات أمثلة (إنسولين، قطن ‎Bt‎، سلمون معدل…) لتصنيف مصدر الجين والهدف\nالطالب: يصنفون الأمثلة في مجموعات ويحلون السؤال 1\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على مفاهيم الهندسة الجينية\nالطالب: يتنافسون ويراجعون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما ‎DNA‎ معاد التركيب؟\n   الإجابة النموذجية: ‎DNA‎ يتكون من تتابعات نيوكليوتيدات من مصدرين مختلفين (غالبًا من نوعين مختلفين) رُبطت معًا.\n2) (المستوى المتوقع) السؤال: ما الهدف من الهندسة الجينية؟\n   الإجابة النموذجية: تعديل خصائص محددة في كائن حي بمعالجة مادته الجينية عمدًا.\n3) (المستوى المتقدم) السؤال: لماذا يمكن لبكتيريا قراءة جين بشري؟\n   الإجابة النموذجية: لأن الشيفرة الجينية عالمية.","1) (مستوى الدعم) السؤال: عرّف الكائن المعدل جينيًا.\n   الإجابة النموذجية: كائن حي عُدّلت مادته الجينية بإدخال جين أو أكثر بطريقة الهندسة الجينية.\n2) (المستوى المتوقع) السؤال: اذكر ثلاثة مصادر محتملة للجين المنقول.\n   الإجابة النموذجية: من كائن من النوع نفسه، أو من نوع آخر، أو جين مصنع مخبريًا.\n3) (المستوى المتقدم) السؤال: لماذا يُعدّ إنتاج الإنسولين البشري بالبكتيريا أفضل من استخلاصه من الحيوانات؟\n   الإجابة النموذجية: لأنه مطابق للإنسولين البشري، ويُنتج بكميات كبيرة ونقية، ويقلل الحساسية والاعتماد على الحيوانات.","إرشاد للطالب: مراجعة ص 86 وحل السؤال 1\nإرشاد لولي الأمر: الحديث مع الابن عن أمثلة الهندسة الجينية في الدواء والغذاء"],"h":["<ol class=\"ol\"><li>يشرح معنى المصطلح ‎DNA‎ معاد التركيب</li><li>يشرح أن الهندسة الجينية معالجة مقصودة للمادة الجينية لتعديل خصائص معينة في الكائن الحي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين مصادر الجينات المنقولة: من النوع نفسه أو من نوع آخر أو مصنعة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح معنى المصطلح ‎DNA‎ معاد التركيب</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح أن الهندسة الجينية معالجة مقصودة للمادة الجينية لتعديل خصائص معينة في الكائن الحي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين مصادر الجينات المنقولة: من النوع نفسه أو من نوع آخر أو مصنعة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم بالأقران</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الهندسة الجينية، ‎DNA‎ معاد التركيب، الكائن المعدل جينيًا، الجين المطلوب، الكائن المستقبِل، النوع المانح.</p>","<p>يعرض المعلم صورة عبوة إنسولين ويسأل: «كان مرضى السكري يعتمدون على إنسولين من بنكرياس الأبقار والخنازير؛ كيف أصبحت البكتيريا اليوم تنتج إنسولينًا بشريًا؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح سؤال الإنسولين ويستقبل الفرضيات</td><td>يقترحون نقل الجين البشري إلى البكتيريا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يقدّم «لمحة عامة عن الهندسة الجينية» (دليل المعلم) ويعرّف ‎DNA‎ معاد التركيب ومصادر الجينات</td><td>يكتبون التعريفات ويرسمون مخططًا مبسطًا لخطوات الهندسة الجينية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>يوزع بطاقات أمثلة (إنسولين، قطن ‎Bt‎، سلمون معدل…) لتصنيف مصدر الجين والهدف</td><td>يصنفون الأمثلة في مجموعات ويحلون السؤال 1</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات على مفاهيم الهندسة الجينية</td><td>يتنافسون ويراجعون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ‎DNA‎ معاد التركيب؟</td><td>‎DNA‎ يتكون من تتابعات نيوكليوتيدات من مصدرين مختلفين (غالبًا من نوعين مختلفين) رُبطت معًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الهدف من الهندسة الجينية؟</td><td>تعديل خصائص محددة في كائن حي بمعالجة مادته الجينية عمدًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يمكن لبكتيريا قراءة جين بشري؟</td><td>لأن الشيفرة الجينية عالمية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف الكائن المعدل جينيًا.</td><td>كائن حي عُدّلت مادته الجينية بإدخال جين أو أكثر بطريقة الهندسة الجينية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر ثلاثة مصادر محتملة للجين المنقول.</td><td>من كائن من النوع نفسه، أو من نوع آخر، أو جين مصنع مخبريًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعدّ إنتاج الإنسولين البشري بالبكتيريا أفضل من استخلاصه من الحيوانات؟</td><td>لأنه مطابق للإنسولين البشري، ويُنتج بكميات كبيرة ونقية، ويقلل الحساسية والاعتماد على الحيوانات.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 86 وحل السؤال 1</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أمثلة الهندسة الجينية في الدواء والغذاء</p>"]}]},{"title":"أدوات تقني الجينات","sb":"ص 87–95","unit":"الوحدة 3: التقنية الجينية","periods":[{"axis":"إنزيمات القطع والليجيز والبلازميدات","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","أدوات تقني الجينات"],["الحصة","1 من 2"],["محور الحصة","إنزيمات القطع والليجيز والبلازميدات"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 87–91"],["دليل المعلم","ص 133–137"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: مصطلحات التقنيات الجينية ص 67"]],"t":["1. يشرح دور إنزيمات القطع (إندونيوكلييز) في قطع ‎DNA‎ عند تتابعات محددة وتكوين نهايات لاصقة\n2. يشرح دور ‎DNA‎ ليجيز والبلازميدات بوصفها نواقل في تكوين ‎DNA‎ معاد التركيب\nمخرج تعليمي آخر: يرتب خطوات إدخال جين في بلازميد ترتيبًا صحيحًا","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني\n- التشبيهات","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: شرائط ورقية لنمذجة القطع والربط، مقص، شريط لاصق","إنزيم القطع (إندونيوكلييز)، موقع التعرف، النهايات اللاصقة، ‎DNA‎ ليجيز، البلازميد، الناقل، البكتيريا المحوّلة.","يقدّم المعلم تشبيهًا: «إنزيم القطع مقص ذكي لا يقص إلا عند كلمة سرية، والليجيز شريط لاصق جزيئي». ثم يسأل: «ما الذي يجب أن يتوفر في الجين والبلازميد ليلتصقا؟» (نشاط التشبيهات المفيدة).","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض التشبيهات ويطرح السؤال\nالطالب: يقترحون أن يُقطعا بالإنزيم نفسه\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح إنزيمات القطع والنهايات اللاصقة والليجيز والبلازميد بالأشكال 3-1 إلى 3-3\nالطالب: يحددون موقع التعرف والنهايات اللاصقة على تتابع مكتوب\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه نمذجة ورقية: قطع جين وبلازميد بالإنزيم نفسه ثم ربطهما\nالطالب: يقصون الشرائط عند موقع التعرف ويلصقون النهايات المتممة ويكتبون الخطوات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما وظيفة إنزيم القطع؟\n   الإجابة النموذجية: قطع ‎DNA‎ عند تتابع قواعد محدد (موقع التعرف) مكونًا غالبًا نهايات لاصقة.\n2) (المستوى المتوقع) السؤال: لماذا يُقطع الجين والبلازميد بإنزيم القطع نفسه؟\n   الإجابة النموذجية: لتكوين نهايات لاصقة متممة يمكنها التزاوج معًا.\n3) (المستوى المتقدم) السؤال: ما وظيفة ‎DNA‎ ليجيز في هذه التقنية؟\n   الإجابة النموذجية: تكوين روابط فوسفوداي إستر تربط الجين بالبلازميد.","1) (مستوى الدعم) السؤال: ما البلازميد؟\n   الإجابة النموذجية: جزيء ‎DNA‎ دائري صغير في البكتيريا يُستخدم ناقلًا لإدخال الجين.\n2) (المستوى المتوقع) السؤال: ما المقصود بالنهايات اللاصقة؟\n   الإجابة النموذجية: أطراف قصيرة مفردة الشريط تتكون عند القطع ويمكنها التزاوج مع أطراف متممة.\n3) (المستوى المتقدم) السؤال: رتب: ربط بالليجيز، قطع البلازميد والجين بالإنزيم نفسه، إدخال البلازميد في البكتيريا، خلط الجين بالبلازميد.\n   الإجابة النموذجية: القطع بالإنزيم نفسه ← خلط الجين بالبلازميد ← الربط بالليجيز ← إدخال البلازميد في البكتيريا.","إرشاد للطالب: مراجعة ص 87–91 ورسم خطوات إدخال الجين في بلازميد\nإرشاد لولي الأمر: سؤال الابن عن تشبيه «المقص الذكي والشريط اللاصق»"],"h":["<ol class=\"ol\"><li>يشرح دور إنزيمات القطع (إندونيوكلييز) في قطع ‎DNA‎ عند تتابعات محددة وتكوين نهايات لاصقة</li><li>يشرح دور ‎DNA‎ ليجيز والبلازميدات بوصفها نواقل في تكوين ‎DNA‎ معاد التركيب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يرتب خطوات إدخال جين في بلازميد ترتيبًا صحيحًا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح دور إنزيمات القطع (إندونيوكلييز) في قطع ‎DNA‎ عند تتابعات محددة وتكوين نهايات لاصقة</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح دور ‎DNA‎ ليجيز والبلازميدات بوصفها نواقل في تكوين ‎DNA‎ معاد التركيب</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يرتب خطوات إدخال جين في بلازميد ترتيبًا صحيحًا</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التشبيهات</span></div>","<
