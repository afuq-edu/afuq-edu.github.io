بة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر هرمونين يعملان بالتغذية الراجعة السلبية في الثدييات.</td><td>‎ADH‎ والإنسولين (أو الجلوكاجون).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تحتاج الخلايا الهدف إلى مستقبلات على سطحها لهرمونات ‎ADH‎ والإنسولين والجلوكاجون؟</td><td>لأنها هرمونات ببتيدية كبيرة ومحبة للماء لا تعبر الغشاء، فتؤثر عبر الارتباط بمستقبلات سطحية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم أداءك في الوحدة: اذكر موضوعًا أتقنته وآخر تحتاج إلى مراجعته وخطوة عملية لذلك.</td><td>إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة واضحة مثل حل أسئلة إضافية أو إعادة رسم مخطط.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ملخص الوحدة ص 151–152 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على خطته لمراجعة الوحدة الرابعة</p>"]}]},{"title":"مقارنة جهاز الغدد الصماء والجهاز العصبي","sb":"ص 164","unit":"الوحدة 5: التحكم والتنسيق","periods":[{"axis":"مقارنة التأشير الهرموني والتأشير العصبي","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","مقارنة جهاز الغدد الصماء والجهاز العصبي"],["الحصة","1 من 2"],["محور الحصة","مقارنة التأشير الهرموني والتأشير العصبي"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 164"],["دليل المعلم","ص 220–223"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 5-1: استقصاء ردود الفعل المنعكس عند الإنسان ص 132"]],"t":["1. يقارن بين جهاز الغدد الصماء والجهاز العصبي من حيث طبيعة الإشارة ووسيلة نقلها وسرعتها ومدة تأثيرها\n2. يذكر أن الهرمونات تُنقل في بلازما الدم إلى خلايا هدف تمتلك مستقبلات نوعية\nمخرج تعليمي آخر: يصنف أمثلة استجابات إلى عصبية أو هرمونية أو مشتركة","المخرج 1: تحليل\nالمخرج 2: تذكر\nالمخرج الآخر: تطبيق","- التعلم التعاوني\n- التعلم بالاكتشاف\n- مقارنة العمليات","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: بطاقات استجابات لتصنيفها","جهاز الغدد الصماء، الغدة الصماء، الهرمون، الخلية الهدف، الجهاز العصبي، النبضة العصبية، سرعة الاستجابة، مدة التأثير.","يسأل المعلم: «عندما تلمس سطحًا ساخنًا تسحب يدك في أقل من ثانية، لكن النمو في طولك يستغرق سنوات؛ ما الفرق بين الرسالتين؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ومهام بداية الوحدة\nالطالب: يقترحون الفرق بين الإشارة العصبية والهرمونية\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الجدول 5-1 والشكل 5-1 للمقارنة بين الجهازين\nالطالب: يكملون جدول مقارنة بخمسة معايير\n3) (13 دقيقة: من الدقيقة 17 إلى 30)\nالمعلم: ينفذ نشاط «مقارنة العمليات»: بطاقات استجابات يصنفها الطلبة\nالطالب: يصنفون البطاقات ويبررون تصنيفهم أمام الصف\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يوجه حل السؤالين 1 و2 ثم يختم بمسابقة المجموعات\nالطالب: يحلون ويتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف تُنقل الهرمونات إلى الخلايا الهدف؟\n   الإجابة النموذجية: في بلازما الدم.\n2) (المستوى المتوقع) السؤال: أيهما أسرع: الاستجابة العصبية أم الهرمونية؟ ولماذا؟\n   الإجابة النموذجية: العصبية؛ لأن النبضات تنتقل مباشرة على طول الخلايا العصبية بسرعة كبيرة.\n3) (المستوى المتقدم) السؤال: لماذا لا تستجيب كل خلايا الجسم لهرمون معين رغم وصوله إليها؟\n   الإجابة النموذجية: لأن الخلايا الهدف وحدها تمتلك المستقبلات النوعية لذلك الهرمون.","1) (مستوى الدعم) السؤال: اذكر فرقين بين جهاز الغدد الصماء والجهاز العصبي.\n   الإجابة النموذجية: الغدد الصماء: إشارة كيميائية عبر الدم، أبطأ وتأثيرها أطول وأوسع؛ العصبي: إشارة كهربائية عبر الخلايا العصبية، أسرع وتأثيرها قصير ومحدد.\n2) (المستوى المتوقع) السؤال: صنّف: سحب اليد من الحرارة، تنظيم سكر الدم، النمو.\n   الإجابة النموذجية: سحب اليد: عصبي؛ تنظيم السكر: هرموني؛ النمو: هرموني.\n3) (المستوى المتقدم) السؤال: لماذا يُعد التنسيق بين الجهازين ضروريًا في الاستجابة للخطر؟\n   الإجابة النموذجية: لأن الجهاز العصبي يعطي استجابة فورية، والهرمونات (مثل الأدرينالين) تطيل الاستجابة وتهيئ الجسم كله لها.","إرشاد للطالب: مراجعة ص 164 وحل السؤالين 1 و2\nإرشاد لولي الأمر: الحديث مع الابن عن مواقف يومية تظهر فيها الاستجابة العصبية السريعة"],"h":["<ol class=\"ol\"><li>يقارن بين جهاز الغدد الصماء والجهاز العصبي من حيث طبيعة الإشارة ووسيلة نقلها وسرعتها ومدة تأثيرها</li><li>يذكر أن الهرمونات تُنقل في بلازما الدم إلى خلايا هدف تمتلك مستقبلات نوعية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يصنف أمثلة استجابات إلى عصبية أو هرمونية أو مشتركة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يقارن بين جهاز الغدد الصماء والجهاز العصبي من حيث طبيعة الإشارة ووسيلة نقلها وسرعتها ومدة تأثيرها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يذكر أن الهرمونات تُنقل في بلازما الدم إلى خلايا هدف تمتلك مستقبلات نوعية</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يصنف أمثلة استجابات إلى عصبية أو هرمونية أو مشتركة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">مقارنة العمليات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: بطاقات استجابات لتصنيفها</span></div>","<p>جهاز الغدد الصماء، الغدة الصماء، الهرمون، الخلية الهدف، الجهاز العصبي، النبضة العصبية، سرعة الاستجابة، مدة التأثير.</p>","<p>يسأل المعلم: «عندما تلمس سطحًا ساخنًا تسحب يدك في أقل من ثانية، لكن النمو في طولك يستغرق سنوات؛ ما الفرق بين الرسالتين؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ومهام بداية الوحدة</td><td>يقترحون الفرق بين الإشارة العصبية والهرمونية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الجدول 5-1 والشكل 5-1 للمقارنة بين الجهازين</td><td>يكملون جدول مقارنة بخمسة معايير</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–30</span><br><small>13 دقيقة</small></td><td>ينفذ نشاط «مقارنة العمليات»: بطاقات استجابات يصنفها الطلبة</td><td>يصنفون البطاقات ويبررون تصنيفهم أمام الصف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يوجه حل السؤالين 1 و2 ثم يختم بمسابقة المجموعات</td><td>يحلون ويتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كيف تُنقل الهرمونات إلى الخلايا الهدف؟</td><td>في بلازما الدم.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أيهما أسرع: الاستجابة العصبية أم الهرمونية؟ ولماذا؟</td><td>العصبية؛ لأن النبضات تنتقل مباشرة على طول الخلايا العصبية بسرعة كبيرة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا تستجيب كل خلايا الجسم لهرمون معين رغم وصوله إليها؟</td><td>لأن الخلايا الهدف وحدها تمتلك المستقبلات النوعية لذلك الهرمون.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر فرقين بين جهاز الغدد الصماء والجهاز العصبي.</td><td>الغدد الصماء: إشارة كيميائية عبر الدم، أبطأ وتأثيرها أطول وأوسع؛ العصبي: إشارة كهربائية عبر الخلايا العصبية، أسرع وتأثيرها قصير ومحدد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>صنّف: سحب اليد من الحرارة، تنظيم سكر الدم، النمو.</td><td>سحب اليد: عصبي؛ تنظيم السكر: هرموني؛ النمو: هرموني.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد التنسيق بين الجهازين ضروريًا في الاستجابة للخطر؟</td><td>لأن الجهاز العصبي يعطي استجابة فورية، والهرمونات (مثل الأدرينالين) تطيل الاستجابة وتهيئ الجسم كله لها.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 164 وحل السؤالين 1 و2</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن مواقف يومية تظهر فيها الاستجابة العصبية السريعة</p>"]},{"axis":"الاستقصاء العملي 5-1: ردود الفعل المنعكس واستنتاج الأفكار","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","مقارنة جهاز الغدد الصماء والجهاز العصبي"],["الحصة","2 من 2"],["محور الحصة","الاستقصاء العملي 5-1: ردود الفعل المنعكس واستنتاج الأفكار"],["الأسبوع والتاريخ","الأسبوع الثالث عشر (29/11–3/12/2026)"],["كتاب الطالب","ص 164"],["دليل المعلم","ص 220–223"],["كتاب التجارب العملية والأنشطة","الاستقصاء العملي 5-1: استقصاء ردود الفعل المنعكس عند الإنسان ص 132"]],"t":["1. ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات\n2. يستنتج خصائص الفعل المنعكس: سريع، لا إرادي، نمطي\nمخرج تعليمي آخر: يقيس زمن رد الفعل (التقاط مسطرة) ويقارنه بالفعل المنعكس","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العملي","- الكتاب\n- الأقلام\n- أخرى: مطرقة مطاطية، مصباح يدوي، مسطرة مترية، كتاب التجارب العملية والأنشطة","الفعل المنعكس، الاستجابة اللاإرادية، منعكس الركبة، منعكس الحدقة، زمن رد الفعل، السلامة.","يسقط المعلم مسطرة فجأة أمام طالب ليلتقطها، ثم يسأل: «هل فكرت قبل أن تلتقطها؟ وهل يختلف ذلك عن رمش عينك حين يقترب شيء منها؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: ينفذ عرض المسطرة ويطرح السؤال\nالطالب: يقارنون بين الحركة الإرادية والمنعكسة\n2) (20 دقيقة: من الدقيقة 4 إلى 24)\nالمعلم: يوجه تنفيذ الاستقصاء العملي 5-1 (كتاب التجارب ص 132) مع التشديد على السلامة\nالطالب: ينفذون منعكس الركبة والحدقة وقياس زمن الالتقاط ويسجلون النتائج\n3) (8 دقائق: من الدقيقة 24 إلى 32)\nالمعلم: يدير نشاط «استنتاج الأفكار» من النتائج\nالطالب: يستنتجون خصائص الفعل المنعكس ويحسبون متوسط زمن رد الفعل\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا يُعد منعكس الركبة لا إراديًا؟\n   الإجابة النموذجية: لأنه يحدث تلقائيًا دون تفكير أو تحكم واعٍ من الدماغ.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لحدقة العين عند تسليط ضوء قوي عليها؟\n   الإجابة النموذجية: تضيق.\n3) (المستوى المتقدم) السؤال: لماذا يكون زمن التقاط المسطرة أطول من زمن منعكس الركبة؟\n   الإجابة النموذجية: لأن الالتقاط فعل إرادي تمر إشارته بالدماغ ومعالجة أكثر، بينما المنعكس يمر عبر مسار عصبي قصير.","1) (مستوى الدعم) السؤال: اذكر خاصيتين للفعل المنعكس.\n   الإجابة النموذجية: سريع ولا إرادي (ونمطي يتكرر بالطريقة نفسها).\n2) (المستوى المتوقع) السؤال: ما فائدة منعكس الحدقة للإنسان؟\n   الإجابة النموذجية: حماية الشبكية من الضوء الشديد.\n3) (المستوى المتقدم) السؤال: اقترح طريقة لتحسين موثوقية قياس زمن رد الفعل.\n   الإجابة النموذجية: تكرار القياس عدة مرات وحساب المتوسط، وتثبيت ارتفاع إسقاط المسطرة ووضع اليد، واستخدام عدة أشخاص.","إرشاد للطالب: كتابة تقرير الاستقصاء 5-1 وحساب متوسط زمن رد الفعل\nإرشاد لولي الأمر: يمكن إجراء تجربة التقاط المسطرة مع الابن في المنزل ومقارنة أزمنة أفراد الأسرة"],"h":["<ol class=\"ol\"><li>ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات</li><li>يستنتج خصائص الفعل المنعكس: سريع، لا إرادي، نمطي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيس زمن رد الفعل (التقاط مسطرة) ويقارنه بالفعل المنعكس</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>ينفذ استقصاء رد فعل منعكس (الركبة أو حدقة العين) ويسجل الملاحظات</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستنتج خصائص الفعل المنعكس: سريع، لا إرادي، نمطي</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيس زمن رد الفعل (التقاط مسطرة) ويقارنه بالفعل المنعكس</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الاستقصاء العملي</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: مطرقة مطاطية، مصباح يدوي، مسطرة مترية، كتاب التجارب العملية والأنشطة</span></div>","<p>الفعل المنعكس، الاستجابة اللاإرادية، منعكس الركبة، منعكس الحدقة، زمن رد الفعل، السلامة.</p>","<p>يسقط المعلم مسطرة فجأة أمام طالب ليلتقطها، ثم يسأل: «هل فكرت قبل أن تلتقطها؟ وهل يختلف ذلك عن رمش عينك حين يقترب شيء منها؟»</p>","<table وتثبيت ارتفاع إسقاط المسطرة ووضع اليد، واستخدام عدة أشخاص.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء 5-1 وحساب متوسط زمن رد الفعل</p><p><b>إرشاد لولي الأمر:</b> يمكن إجراء تجربة التقاط المسطرة مع الابن في المنزل ومقارنة أزمنة أفراد الأسرة</p>"]}]},{"title":"التواصل العصبي","sb":"ص 165–187","unit":"الوحدة 5: التحكم والتنسيق","periods":[{"axis":"الخلايا العصبية الحسية والحركية والموصلة والقوس الانعكاسي","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التواصل العصبي"],["الحصة","1 من 5"],["محور الحصة","الخلايا العصبية الحسية والحركية والموصلة والقوس الانعكاسي"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 165–170"],["دليل المعلم","ص 224–231"],["كتاب التجارب العملية والأنشطة","نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]],"t":["1. يصف تركيب الخلية العصبية الحسية والحركية ووظيفتهما ويذكر أن الخلية الموصلة تربط بينهما\n2. يصف مسار القوس الانعكاسي من المستقبل إلى المستجيب\nمخرج تعليمي آخر: يربط تركيب غمد المايلين وعقد رانفييه بزيادة سرعة النبضة تمهيدًا لدراسة النقل الوثبي","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني\n- دراسة تركيب الخلايا العصبية","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة","الخلية العصبية الحسية، الخلية العصبية الحركية، الخلية العصبية الموصلة، جسم الخلية، المحور الأسطواني، الشجيرات، غمد المايلين، خلايا شوان، عقد رانفييه، القوس الانعكاسي.","يعرض المعلم صورة مجهرية لخلية عصبية حركية ويسأل: «هذه الخلية قد يصل طولها إلى متر في ساقك؛ لماذا تحتاج إلى هذا الطول والامتدادات؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يربطون الطول بنقل الإشارة لمسافات بعيدة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح تركيب الخلايا العصبية الثلاث والمايلين بالأشكال 5-2 إلى 5-6\nالطالب: يرسمون خلية حسية وحركية ويسمون أجزاءهما\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقود نشاط «دراسة تركيب الخلايا العصبية» ثم يبني مع الطلبة القوس الانعكاسي على السبورة\nالطالب: يرتبون بطاقات القوس الانعكاسي ويحددون اتجاه النبضة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما وظيفة الخلية العصبية الحسية؟\n   الإجابة النموذجية: نقل النبضات من المستقبلات إلى الجهاز العصبي المركزي.\n2) (المستوى المتوقع) السؤال: أين يقع جسم الخلية العصبية الحركية؟\n   الإجابة النموذجية: داخل الجهاز العصبي المركزي (الحبل الشوكي أو الدماغ).\n3) (المستوى المتقدم) السؤال: ما الخلايا التي تكوّن غمد المايلين؟\n   الإجابة النموذجية: خلايا شوان.","1) (مستوى الدعم) السؤال: رتب مكونات القوس الانعكاسي.\n   الإجابة النموذجية: مستقبل ← خلية عصبية حسية ← خلية عصبية موصلة ← خلية عصبية حركية ← مستجيب.\n2) (المستوى المتوقع) السؤال: ما عقد رانفييه؟\n   الإجابة النموذجية: فجوات قصيرة غير مغطاة بالمايلين بين خلايا شوان على طول المحور الأسطواني.\n3) (المستوى المتقدم) السؤال: لماذا يكون القوس الانعكاسي سريعًا؟\n   الإجابة النموذجية: لأنه يتضمن عددًا قليلًا من الخلايا العصبية والتشابكات ولا يحتاج إلى معالجة واعية في الدماغ.","إرشاد للطالب: مراجعة ص 165–170 ورسم القوس الانعكاسي\nإرشاد لولي الأمر: سؤال الابن عن أجزاء الخلية العصبية بالاستعانة برسمه"],"h":["<ol class=\"ol\"><li>يصف تركيب الخلية العصبية الحسية والحركية ووظيفتهما ويذكر أن الخلية الموصلة تربط بينهما</li><li>يصف مسار القوس الانعكاسي من المستقبل إلى المستجيب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يربط تركيب غمد المايلين وعقد رانفييه بزيادة سرعة النبضة تمهيدًا لدراسة النقل الوثبي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب الخلية العصبية الحسية والحركية ووظيفتهما ويذكر أن الخلية الموصلة تربط بينهما</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف مسار القوس الانعكاسي من المستقبل إلى المستجيب</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يربط تركيب غمد المايلين وعقد رانفييه بزيادة سرعة النبضة تمهيدًا لدراسة النقل الوثبي</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">دراسة تركيب الخلايا العصبية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">نماذج مجسمة</span></div>","<p>الخلية العصبية الحسية، الخلية العصبية الحركية، الخلية العصبية الموصلة، جسم الخلية، المحور الأسطواني، الشجيرات، غمد المايلين، خلايا شوان، عقد رانفييه، القوس الانعكاسي.</p>","<p>يعرض المعلم صورة مجهرية لخلية عصبية حركية ويسأل: «هذه الخلية قد يصل طولها إلى متر في ساقك؛ لماذا تحتاج إلى هذا الطول والامتدادات؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح السؤال</td><td>يربطون الطول بنقل الإشارة لمسافات بعيدة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح تركيب الخلايا العصبية الثلاث والمايلين بالأشكال 5-2 إلى 5-6</td><td>يرسمون خلية حسية وحركية ويسمون أجزاءهما</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقود نشاط «دراسة تركيب الخلايا العصبية» ثم يبني مع الطلبة القوس الانعكاسي على السبورة</td><td>يرتبون بطاقات القوس الانعكاسي ويحددون اتجاه النبضة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة الخلية العصبية الحسية؟</td><td>نقل النبضات من المستقبلات إلى الجهاز العصبي المركزي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أين يقع جسم الخلية العصبية الحركية؟</td><td>داخل الجهاز العصبي المركزي (الحبل الشوكي أو الدماغ).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الخلايا التي تكوّن غمد المايلين؟</td><td>خلايا شوان.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>رتب مكونات القوس الانعكاسي.</td><td>مستقبل ← خلية عصبية حسية ← خلية عصبية موصلة ← خلية عصبية حركية ← مستجيب.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما عقد رانفييه؟</td><td>فجوات قصيرة غير مغطاة بالمايلين بين خلايا شوان على طول المحور الأسطواني.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون القوس الانعكاسي سريعًا؟</td><td>لأنه يتضمن عددًا قليلًا من الخلايا العصبية والتشابكات ولا يحتاج إلى معالجة واعية في الدماغ.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 165–170 ورسم القوس الانعكاسي</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن أجزاء الخلية العصبية بالاستعانة برسمه</p>"]},{"axis":"جهد الراحة ومضخة الصوديوم والبوتاسيوم","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التواصل العصبي"],["الحصة","2 من 5"],["محور الحصة","جهد الراحة ومضخة الصوديوم والبوتاسيوم"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 171–172"],["دليل المعلم","ص 224–231"],["كتاب التجارب العملية والأنشطة","نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]],"t":["1. يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه\n2. يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎\nمخرج تعليمي آخر: يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","جهد الغشاء، جهد الراحة، الاستقطاب، مضخة الصوديوم والبوتاسيوم، النقل النشط، قنوات البوتاسيوم، تدرج التركيز، ‎ATP‎.","يعرض المعلم بطارية ويسأل: «الخلية العصبية في الراحة تشبه بطارية مشحونة صغيرة؛ ما الذي يصنع فرق الجهد بين داخلها وخارجها؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض البطارية ويطرح السؤال\nالطالب: يقترحون اختلاف توزيع الأيونات\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح جهد الراحة ومضخة ‎Na⁺/K⁺‎ ونفاذية الغشاء لـ ‎K⁺‎ بالشكل المناسب\nالطالب: يرسمون الغشاء ويحددون اتجاه حركة كل أيون\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: ينظم نمذجة: طلاب يمثلون أيونات ومضخة على «غشاء» مرسوم على الأرض\nالطالب: يمثلون عمل المضخة ويحسبون صافي الشحنة المنقولة لكل دورة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كم قيمة جهد الراحة تقريبًا؟\n   الإجابة النموذجية: نحو ‎−70 mV‎.\n2) (المستوى المتوقع) السؤال: كم أيون ‎Na⁺‎ و‎K⁺‎ تنقلها المضخة في كل دورة؟\n   الإجابة النموذجية: تخرج ‎3 Na⁺‎ وتدخل ‎2 K⁺‎.\n3) (المستوى المتقدم) السؤال: لماذا يكون داخل الخلية سالبًا في الراحة؟\n   الإجابة النموذجية: لأن المضخة تخرج شحنات موجبة أكثر مما تدخل، ولأن الغشاء أكثر نفاذية لـ ‎K⁺‎ فيتسرب للخارج، إضافة إلى وجود أنيونات كبيرة داخل الخلية.","1) (مستوى الدعم) السؤال: ما نوع النقل في مضخة الصوديوم والبوتاسيوم؟\n   الإجابة النموذجية: نقل نشط يستهلك ‎ATP‎.\n2) (المستوى المتوقع) السؤال: أين يكون تركيز ‎Na⁺‎ أعلى في الراحة؟ وأين يكون ‎K⁺‎ أعلى؟\n   الإجابة النموذجية: ‎Na⁺‎ أعلى خارج الخلية، و‎K⁺‎ أعلى داخلها.\n3) (المستوى المتقدم) السؤال: ماذا يحدث لجهد الراحة إذا ثُبطت إنتاجية ‎ATP‎ في الخلية العصبية؟\n   الإجابة النموذجية: تتوقف المضخة تدريجيًا فتتلاشى تدرجات الأيونات ويقترب جهد الغشاء من الصفر فتفقد الخلية قدرتها على نقل النبضات.","إرشاد للطالب: مراجعة ص 171–172 ورسم توزيع الأيونات على جانبي الغشاء\nإرشاد لولي الأمر: سؤال الابن عن تشبيه البطارية وكيف ينطبق على الخلية العصبية"],"h":["<ol class=\"ol\"><li>يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه</li><li>يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف جهد الراحة لغشاء الخلية العصبية (نحو ‎−70 mV‎) وكيفية الحفاظ عليه</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح دور مضخة الصوديوم والبوتاسيوم (‎3Na⁺‎ للخارج و‎2K⁺‎ للداخل) ونفاذية الغشاء لأيونات ‎K⁺‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر سبب سالبية الداخل مقارنة بالخارج أثناء الراحة</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>جهد الغشاء، جهد الراحة، الاستقطاب، مضخة الصوديوم والبوتاسيوم، النقل النشط، قنوات البوتاسيوم، تدرج التركيز، ‎ATP‎.</p>","<p>يعرض المعلم بطارية ويسأل: «الخلية العصبية في الراحة تشبه بطارية مشحونة صغيرة؛ ما الذي يصنع فرق الجهد بين داخلها وخارجها؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض البطارية ويطرح السؤال</td><td>يقترحون اختلاف توزيع الأيونات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح جهد الراحة ومضخة ‎Na⁺/K⁺‎ ونفاذية الغشاء لـ ‎K⁺‎ بالشكل المناسب</td><td>يرسمون الغشاء ويحددون اتجاه حركة كل أيون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>ينظم نمذجة: طلاب يمثلون أيونات ومضخة على «غشاء» مرسوم على الأرض</td><td>يمثلون عمل المضخة ويحسبون صافي الشحنة المنقولة لكل دورة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>كم قيمة جهد الراحة تقريبًا؟</td><td>نحو ‎−70 mV‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كم أيون ‎Na⁺‎ و‎K⁺‎ تنقلها المضخة في كل دورة؟</td><td>تخرج ‎3 Na⁺‎ وتدخل ‎2 K⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكون داخل الخلية سالبًا في الراحة؟</td><td>لأن المضخة تخرج شحنات موجبة أكثر مما تدخل، ولأن الغشاء أكثر نفاذية لـ ‎K⁺‎ فيتسرب للخارج، إضافة إلى وجود أنيونات كبيرة داخل الخلية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نوع النقل في مضخة الصوديوم والبوتاسيوم؟</td><td>نقل نشط يستهلك ‎ATP‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أين يكون تركيز ‎Na⁺‎ أعلى في الراحة؟ وأين يكون ‎K⁺‎ أعلى؟</td><td>‎Na⁺‎ أعلى خارج الخلية، و‎K⁺‎ أعلى داخلها.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يحدث لجهد الراحة إذا ثُبطت إنتاجية ‎ATP‎ في الخلية العصبية؟</td><td>تتوقف المضخة تدريجيًا فتتلاشى تدرجات الأيونات ويقترب جهد الغشاء من الصفر فتفقد الخلية قدرتها على نقل النبضات.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 171–172 ورسم توزيع الأيونات على جانبي الغشاء</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه البطارية وكيف ينطبق على الخلية العصبية</p>"]},{"axis":"جهد الفعل وفترة الجموح","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التواصل العصبي"],["الحصة","3 من 5"],["محور الحصة","جهد الفعل وفترة الجموح"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 173–177 + كتاب التجارب ص 122"],["دليل المعلم","ص 224–231"],["كتاب التجارب العملية والأنشطة","نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]],"t":["1. يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد\n2. يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد\nمخرج تعليمي آخر: يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني\n- جعل معنى منطقي للآليات","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- أخرى: كتاب التجارب العملية والأنشطة","جهد الفعل، العتبة، إزالة الاستقطاب، إعادة الاستقطاب، فرط الاستقطاب، القنوات المبوبة بالجهد، فترة الجموح، مبدأ الكل أو لا شيء.","يعرض المعلم تمثيلًا بيانيًا لجهد الفعل دون عناوين ويسأل: «في أقل من ثلاثة ملي ثانية صعد الجهد من −70 إلى +40 ثم عاد؛ ما الذي فُتح وأُغلق؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض التمثيل ويطرح السؤال\nالطالب: يقترحون فتح قنوات أيونية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح مراحل جهد الفعل والقنوات المبوبة بالجهد والعتبة ومبدأ الكل أو لا شيء وفترة الجموح\nالطالب: يعنونون مراحل التمثيل البياني ويكتبون الأيون المتحرك في كل مرحلة\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوجه حل نشاط 5-1 «النبضات العصبية» (كتاب التجارب ص 122)\nالطالب: يحلون في أزواج ويفسرون البيانات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الذي يسبب إزالة الاستقطاب؟\n   الإجابة النموذجية: فتح قنوات ‎Na⁺‎ المبوبة بالجهد ودخول ‎Na⁺‎ بسرعة إلى الخلية.\n2) (المستوى المتوقع) السؤال: ما الذي يسبب إعادة الاستقطاب؟\n   الإجابة النموذجية: إغلاق قنوات ‎Na⁺‎ وفتح قنوات ‎K⁺‎ المبوبة بالجهد وخروج ‎K⁺‎.\n3) (المستوى المتقدم) السؤال: لماذا لا ينشأ جهد فعل جديد خلال فترة الجموح؟\n   الإجابة النموذجية: لأن قنوات ‎Na⁺‎ تكون مغلقة وغير قابلة للفتح مؤقتًا.","1) (مستوى الدعم) السؤال: ما المقصود بمبدأ الكل أو لا شيء؟\n   الإجابة النموذجية: إذا بلغ المنبه العتبة نشأ جهد فعل كامل بالقيمة نفسها، وإن لم يبلغها لا ينشأ جهد فعل.\n2) (المستوى المتوقع) السؤال: كيف يدل الجهاز العصبي على شدة المنبه إذا كانت جهود الفعل متساوية؟\n   الإجابة النموذجية: بزيادة تكرار جهود الفعل (عددها في الثانية).\n3) (المستوى المتقدم) السؤال: اشرح أهمية فترة الجموح لاتجاه انتقال النبضة.\n   الإجابة النموذجية: تمنع الجزء الذي مرت به النبضة من إعادة إزالة الاستقطاب فورًا، فتنتقل النبضة في اتجاه واحد إلى الأمام.","إرشاد للطالب: إكمال نشاط 5-1 ص 122 ورسم تمثيل جهد الفعل وعنونته\nإرشاد لولي الأمر: تشجيع الابن على شرح مراحل جهد الفعل بالترتيب مستعينًا بالرسم"],"h":["<ol class=\"ol\"><li>يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد</li><li>يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تغيرات جهد الغشاء أثناء جهد الفعل: إزالة الاستقطاب، وإعادة الاستقطاب، وفرط الاستقطاب، ودور القنوات المبوبة بالجهد</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح أهمية فترة الجموح في تحديد تكرار النبضات وانتقالها في اتجاه واحد</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحلل تمثيلًا بيانيًا لجهد الفعل ويحدد مراحله وقيمه</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">جعل معنى منطقي للآليات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>جهد الفعل، العتبة، إزالة الاستقطاب، إعادة الاستقطاب، فرط الاستقطاب، القنوات المبوبة بالجهد، فترة الجموح، مبدأ الكل أو لا شيء.</p>","<p>يعرض المعلم تمثيلًا بيانيًا لجهد الفعل دون عناوين ويسأل: «في أقل من ثلاثة ملي ثانية صعد الجهد من −70 إلى +40 ثم عاد؛ ما الذي فُتح وأُغلق؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض التمثيل ويطرح السؤال</td><td>يقترحون فتح قنوات أيونية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح مراحل جهد الفعل والقنوات المبوبة بالجهد والعتبة ومبدأ الكل أو لا شيء وفترة الجموح</td><td>يعنونون مراحل التمثيل البياني ويكتبون الأيون المتحرك في كل مرحلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يوجه حل نشاط 5-1 «النبضات العصبية» (كتاب التجارب ص 122)</td><td>يحلون في أزواج ويفسرون البيانات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الذي يسبب إزالة الاستقطاب؟</td><td>فتح قنوات ‎Na⁺‎ المبوبة بالجهد ودخول ‎Na⁺‎ بسرعة إلى الخلية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما الذي يسبب إعادة الاستقطاب؟</td><td>إغلاق قنوات ‎Na⁺‎ وفتح قنوات ‎K⁺‎ المبوبة بالجهد وخروج ‎K⁺‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا لا ينشأ جهد فعل جديد خلال فترة الجموح؟</td><td>لأن قنوات ‎Na⁺‎ تكون مغلقة وغير قابلة للفتح مؤقتًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بمبدأ الكل أو لا شيء؟</td><td>إذا بلغ المنبه العتبة نشأ جهد فعل كامل بالقيمة نفسها، وإن لم يبلغها لا ينشأ جهد فعل.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كيف يدل الجهاز العصبي على شدة المنبه إذا كانت جهود الفعل متساوية؟</td><td>بزيادة تكرار جهود الفعل (عددها في الثانية).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اشرح أهمية فترة الجموح لاتجاه انتقال النبضة.</td><td>تمنع الجزء الذي مرت به النبضة من إعادة إزالة الاستقطاب فورًا، فتنتقل النبضة في اتجاه واحد إلى الأمام.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 5-1 ص 122 ورسم تمثيل جهد الفعل وعنونته</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح مراحل جهد الفعل بالترتيب مستعينًا بالرسم</p>"]},{"axis":"النقل الوثبي والمستقبلات الحسية (براعم التذوق)","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التواصل العصبي"],["الحصة","4 من 5"],["محور الحصة","النقل الوثبي والمستقبلات الحسية (براعم التذوق)"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 178–183 + كتاب التجارب ص 127"],["دليل المعلم","ص 224–231"],["كتاب التجارب العملية والأنشطة","نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]],"t":["1. يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي\n2. يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق)\nمخرج تعليمي آخر: يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2)","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالاكتشاف\n- التعلم التشاركي\n- المناقشة الصفية","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة","النقل الوثبي، عقد رانفييه، سرعة النبضة، المستقبل الحسي، المستقبل الكيميائي، برعم التذوق، جهد المستقبل، المحوِّل (تحويل الطاقة).","يسأل المعلم: «نبضة في محور مايليني تقطع نحو ‎100 m/s‎، وفي محور غير مايليني نحو ‎1 m/s‎؛ كيف تقفز النبضة هذه القفزة في السرعة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويعرض قيم السرعة\nالطالب: يقترحون دور المايلين\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح النقل الوثبي ثم المستقبلات الحسية وبراعم التذوق (‎Na⁺‎ في الطعم المالح) وتكوين جهد المستقبل\nالطالب: يرسمون مخططًا لخطوات تحويل الطعم إلى جهد فعل\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يدير مناقشة صفية «مقارنة النبضات العصبية بالتيارات الكهربائية» ثم نشاط 5-2 «استخدام اللغة التقنية» (ص 127)\nالطالب: يقارنون ويصححون عبارات علمية غير دقيقة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أين تحدث إزالة الاستقطاب في المحور المايليني؟\n   الإجابة النموذجية: عند عقد رانفييه فقط.\n2) (المستوى المتوقع) السؤال: لماذا يكون النقل الوثبي أسرع؟\n   الإجابة النموذجية: لأن النبضة تقفز من عقدة إلى أخرى بدل أن تمر بكل جزء من الغشاء.\n3) (المستوى المتقدم) السؤال: ما الذي يسبب جهد المستقبل في برعم التذوق للطعم المالح؟\n   الإجابة النموذجية: دخول أيونات ‎Na⁺‎ إلى الخلية المستقبلة فتزيل الاستقطاب جزئيًا.","1) (مستوى الدعم) السؤال: ما وظيفة المستقبل الحسي؟\n   الإجابة النموذجية: تحويل طاقة المنبه إلى إشارة كهربائية (جهد مستقبل يؤدي إلى جهد فعل).\n2) (المستوى المتوقع) السؤال: متى يؤدي جهد المستقبل إلى جهد فعل في الخلية الحسية؟\n   الإجابة النموذجية: عندما يبلغ العتبة.\n3) (المستوى المتقدم) السؤال: صحح العبارة: «النبضة العصبية تيار من الإلكترونات يجري في المحور كالسلك».\n   الإجابة النموذجية: غير دقيقة؛ النبضة موجة من إزالة الاستقطاب تنتقل بحركة أيونات (‎Na⁺‎ و‎K⁺‎) عبر الغشاء، لا تدفق إلكترونات على طول المحور.","إرشاد للطالب: إكمال نشاط 5-2 ص 127 ومراجعة ص 178–183\nإرشاد لولي الأمر: سؤال الابن: لماذا يشعر المصاب ببعض أمراض المايلين ببطء في الحركة؟"],"h":["<ol class=\"ol\"><li>يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي</li><li>يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح الانتقال السريع للنبضة في الخلايا العصبية المايلينية بالنقل الوثبي</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف تسلسل الأحداث التي تؤدي إلى جهد الفعل في الخلية الحسية باستخدام مستقبل كيميائي (برعم التذوق)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يستخدم اللغة التقنية بدقة في وصف العمليات العصبية (نشاط 5-2)</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">المناقشة الصفية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>النقل الوثبي، عقد رانفييه، سرعة النبضة، المستقبل الحسي، المستقبل الكيميائي، برعم التذوق، جهد المستقبل، المحوِّل (تحويل الطاقة).</p>","<p>يسأل المعلم: «نبضة في محور مايليني تقطع نحو ‎100 m/s‎، وفي محور غير مايليني نحو ‎1 m/s‎؛ كيف تقفز النبضة هذه القفزة في السرعة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويعرض قيم السرعة</td><td>يقترحون دور المايلين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح النقل الوثبي ثم المستقبلات الحسية وبراعم التذوق (‎Na⁺‎ في الطعم المالح) وتكوين جهد المستقبل</td><td>يرسمون مخططًا لخطوات تحويل الطعم إلى جهد فعل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يدير مناقشة صفية «مقارنة النبضات العصبية بالتيارات الكهربائية» ثم نشاط 5-2 «استخدام اللغة التقنية» (ص 127)</td><td>يقارنون ويصححون عبارات علمية غير دقيقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أين تحدث إزالة الاستقطاب في المحور المايليني؟</td><td>عند عقد رانفييه فقط.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يكون النقل الوثبي أسرع؟</td><td>لأن النبضة تقفز من عقدة إلى أخرى بدل أن تمر بكل جزء من الغشاء.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الذي يسبب جهد المستقبل في برعم التذوق للطعم المالح؟</td><td>دخول أيونات ‎Na⁺‎ إلى الخلية المستقبلة فتزيل الاستقطاب جزئيًا.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة المستقبل الحسي؟</td><td>تحويل طاقة المنبه إلى إشارة كهربائية (جهد مستقبل يؤدي إلى جهد فعل).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>متى يؤدي جهد المستقبل إلى جهد فعل في الخلية الحسية؟</td><td>عندما يبلغ العتبة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صحح العبارة: «النبضة العصبية تيار من الإلكترونات يجري في المحور كالسلك».</td><td>غير دقيقة؛ النبضة موجة من إزالة الاستقطاب تنتقل بحركة أيونات (‎Na⁺‎ و‎K⁺‎) عبر الغشاء، لا تدفق إلكترونات على طول المحور.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 5-2 ص 127 ومراجعة ص 178–183</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن: لماذا يشعر المصاب ببعض أمراض المايلين ببطء في الحركة؟</p>"]},{"axis":"التشابك العصبي الكوليني","n":5,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التواصل العصبي"],["الحصة","5 من 5"],["محور الحصة","التشابك العصبي الكوليني"],["الأسبوع والتاريخ","الأسبوع الرابع عشر (6–10/12/2026)"],["كتاب الطالب","ص 184–188"],["دليل المعلم","ص 224–231"],["كتاب التجارب العملية والأنشطة","نشاط 5-1: النبضات العصبية ص 122؛ نشاط 5-2: استخدام اللغة التقنية ص 127"]],"t":["1. يصف تركيب التشابك العصبي الكوليني (الغشاء قبل التشابكي، الحويصلات، الشق، المستقبلات)\n2. يشرح خطوات انتقال الإشارة عبر التشابك بما في ذلك دور أيونات الكالسيوم والأستيل كولين وإنزيم الأستيل كولين إستريز\nمخرج تعليمي آخر: يتنبأ بأثر مادة تثبط إنزيم الأستيل كولين إستريز على انتقال النبضات","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تقييم","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل المتعددة (سمعية - بصرية)","التشابك العصبي، الغشاء قبل التشابكي، الغشاء بعد التشابكي، الشق التشابكي، الحويصلات، الأستيل كولين، قنوات الكالسيوم، الأستيل كولين إستريز.","يسأل المعلم: «الخلايا العصبية لا تتلامس؛ بينها فجوة دقيقة؛ كيف تعبر الرسالة الكهربائية فجوة لا يمر فيها التيار؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويستقبل الإجابات\nالطالب: يقترحون رسولًا كيميائيًا\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات الانتقال: وصول جهد الفعل، دخول ‎Ca²⁺‎، اندماج الحويصلات، انتشار الأستيل كولين، ارتباطه بالمستقبلات، دخول ‎Na⁺‎، تحلله بالإنزيم\nالطالب: يرسمون التشابك ويرقمون الخطوات\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم سيناريوهات «ماذا لو؟» (مبيد يثبط الإنزيم، مادة تحجب المستقبلات)\nالطالب: يتنبؤون بالنتائج في مجموعات ويبررون\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التواصل العصبي\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الأيون الذي يدخل الطرف قبل التشابكي عند وصول جهد الفعل؟\n   الإجابة النموذجية: الكالسيوم ‎(Ca²⁺)‎.\n2) (المستوى المتوقع) السؤال: ما وظيفة إنزيم الأستيل كولين إستريز؟\n   الإجابة النموذجية: تحليل الأستيل كولين في الشق التشابكي لإنهاء الإشارة.\n3) (المستوى المتقدم) السؤال: لماذا تنتقل الإشارة عبر التشابك في اتجاه واحد؟\n   الإجابة النموذجية: لأن الحويصلات توجد في الطرف قبل التشابكي فقط والمستقبلات في الغشاء بعد التشابكي فقط.","1) (مستوى الدعم) السؤال: ما الناقل العصبي في التشابك الكوليني؟\n   الإجابة النموذجية: الأستيل كولين.\n2) (المستوى المتوقع) السؤال: رتب: ارتباط الأستيل كولين بالمستقبلات، دخول ‎Ca²⁺‎، اندماج الحويصلات، إزالة استقطاب الغشاء بعد التشابكي.\n   الإجابة النموذجية: دخول ‎Ca²⁺ ←‎ اندماج الحويصلات ← ارتباط الأستيل كولين بالمستقبلات ← إزالة استقطاب الغشاء بعد التشابكي.\n3) (المستوى المتقدم) السؤال: ما أثر مبيد حشري يثبط الأستيل كولين إستريز؟\n   الإجابة النموذجية: يبقى الأستيل كولين مرتبطًا بالمستقبلات فتستمر إزالة الاستقطاب وتنقبض العضلات باستمرار (شلل تشنجي).","إرشاد للطالب: مراجعة ص 184–188 ورسم التشابك مع ترقيم الخطوات\nإرشاد لولي الأمر: الحديث مع الابن عن أهمية الحذر عند استخدام المبيدات الحشرية في المنزل والمزرعة"],"h":["<ol class=\"ol\"><li>يصف تركيب التشابك العصبي الكوليني (الغشاء قبل التشابكي، الحويصلات، الشق، المستقبلات)</li><li>يشرح خطوات انتقال الإشارة عبر التشابك بما في ذلك دور أيونات الكالسيوم والأستيل كولين وإنزيم الأستيل كولين إستريز</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بأثر مادة تثبط إنزيم الأستيل كولين إستريز على انتقال النبضات</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف تركيب التشابك العصبي الكوليني (الغشاء قبل التشابكي، الحويصلات، الشق، المستقبلات)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح خطوات انتقال الإشارة عبر التشابك بما في ذلك دور أيونات الكالسيوم والأستيل كولين وإنزيم الأستيل كولين إستريز</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بأثر مادة تثبط إنزيم الأستيل كولين إستريز على انتقال النبضات</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>التشابك العصبي، الغشاء قبل التشابكي، الغشاء بعد التشابكي، الشق التشابكي، الحويصلات، الأستيل كولين، قنوات الكالسيوم، الأستيل كولين إستريز.</p>","<p>يسأل المعلم: «الخلايا العصبية لا تتلامس؛ بينها فجوة دقيقة؛ كيف تعبر الرسالة الكهربائية فجوة لا يمر فيها التيار؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويستقبل الإجابات</td><td>يقترحون رسولًا كيميائيًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خطوات الانتقال: وصول جهد الفعل، دخول ‎Ca²⁺‎، اندماج الحويصلات، انتشار الأستيل كولين، ارتباطه بالمستقبلات، دخول ‎Na⁺‎، تحلله بالإنزيم</td><td>يرسمون التشابك ويرقمون الخطوات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يقدم سيناريوهات «ماذا لو؟» (مبيد يثبط الإنزيم، مادة تحجب المستقبلات)</td><td>يتنبؤون بالنتائج في مجموعات ويبررون</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على التواصل العصبي</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأيون الذي يدخل الطرف قبل التشابكي عند وصول جهد الفعل؟</td><td>الكالسيوم ‎(Ca²⁺)‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما وظيفة إنزيم الأستيل كولين إستريز؟</td><td>تحليل الأستيل كولين في الشق التشابكي لإنهاء الإشارة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تنتقل الإشارة عبر التشابك في اتجاه واحد؟</td><td>لأن الحويصلات توجد في الطرف قبل التشابكي فقط والمستقبلات في الغشاء بعد التشابكي فقط.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الناقل العصبي في التشابك الكوليني؟</td><td>الأستيل كولين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب: ارتباط الأستيل كولين بالمستقبلات، دخول ‎Ca²⁺‎، اندماج الحويصلات، إزالة استقطاب الغشاء بعد التشابكي.</td><td>دخول ‎Ca²⁺ ←‎ اندماج الحويصلات ← ارتباط الأستيل كولين بالمستقبلات ← إزالة استقطاب الغشاء بعد التشابكي.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما أثر مبيد حشري يثبط الأستيل كولين إستريز؟</td><td>يبقى الأستيل كولين مرتبطًا بالمستقبلات فتستمر إزالة الاستقطاب وتنقبض العضلات باستمرار (شلل تشنجي).</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 184–188 ورسم التشابك مع ترقيم الخطوات</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أهمية الحذر عند استخدام المبيدات الحشرية في المنزل والمزرعة</p>"]}]},{"title":"الانقباض العضلي","sb":"ص 188–193","unit":"الوحدة 5: التحكم والتنسيق","periods":[{"axis":"التركيب الدقيق للعضلة المخططة والقطعة العضلية","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","الانقباض العضلي"],["الحصة","1 من 3"],["محور الحصة","التركيب الدقيق للعضلة المخططة والقطعة العضلية"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 188–191"],["دليل المعلم","ص 232–235"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين)\n2. يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎\nمخرج تعليمي آخر: يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة","العضلة المخططة، الليف العضلي، اللييفة العضلية، القطعة العضلية (الساركومير)، الأكتين، الميوسين، خط ‎Z‎، الحزمة ‎A‎، الحزمة ‎I‎، الحزمة ‎H‎.","يعرض المعلم صورة مجهرية لعضلة مخططة ويسأل: «من أين جاء هذا التخطيط المنتظم كأنه سلم؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون ترتيبًا منتظمًا لمكونات داخلية\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح المستويات من العضلة إلى القطعة العضلية بالأشكال 5-22 إلى 5-24\nالطالب: يرسمون قطعة عضلية ويحددون أجزاءها\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوزع صورًا مجهرية إلكترونية لعنونتها وقياس طول القطعة العضلية بالمقياس\nالطالب: يعنونون ويحسبون الطول الفعلي\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخيوط التي تكوّن الحزمة ‎I‎؟\n   الإجابة النموذجية: الخيوط الرفيعة (الأكتين) فقط.\n2) (المستوى المتوقع) السؤال: ما الحدود التي تفصل بين قطعتين عضليتين؟\n   الإجابة النموذجية: خط ‎Z‎.\n3) (المستوى المتقدم) السؤال: لماذا تبدو الحزمة ‎A‎ داكنة؟\n   الإجابة النموذجية: لأنها تحتوي الخيوط السميكة (الميوسين) المتداخلة مع الخيوط الرفيعة.","1) (مستوى الدعم) السؤال: ما القطعة العضلية؟\n   الإجابة النموذجية: الوحدة الانقباضية المتكررة في اللييفة العضلية، تقع بين خطي ‎Z‎ متتاليين.\n2) (المستوى المتوقع) السؤال: ما الذي تحتويه الحزمة ‎H‎؟\n   الإجابة النموذجية: الخيوط السميكة (الميوسين) فقط.\n3) (المستوى المتقدم) السؤال: لماذا تحتوي الألياف العضلية على أنوية متعددة؟\n   الإجابة النموذجية: لأنها تتكون من اندماج خلايا كثيرة أثناء النمو، فيصبح الليف طويلًا متعدد الأنوية.","إرشاد للطالب: مراجعة ص 188–191 ورسم القطعة العضلية مع الأجزاء\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين الحزمة ‎A‎ والحزمة ‎I‎"],"h":["<ol class=\"ol\"><li>يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين)</li><li>يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف التركيب الدقيق للعضلة المخططة: الألياف العضلية، واللييفات العضلية، والخيوط السميكة (الميوسين) والرفيعة (الأكتين)</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحدد أجزاء القطعة العضلية على صورة مجهرية إلكترونية: خط ‎Z‎، والحزمة ‎A‎، والحزمة ‎I‎، والحزمة ‎H‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر المظهر المخطط للعضلة في ضوء ترتيب الخيوط</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">نماذج مجسمة</span></div>","<p>العضلة المخططة، الليف العضلي، اللييفة العضلية، القطعة العضلية (الساركومير)، الأكتين، الميوسين، خط ‎Z‎، الحزمة ‎A‎، الحزمة ‎I‎، الحزمة ‎H‎.</p>","<p>يعرض المعلم صورة مجهرية لعضلة مخططة ويسأل: «من أين جاء هذا التخطيط المنتظم كأنه سلم؟»</p>","<tabl  ورسم القطعة العضلية مع الأجزاء</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن الفرق بين الحزمة ‎A‎ والحزمة ‎I‎</p>"]},{"axis":"نموذج الخيط المنزلق ودور الكالسيوم و‎ATP‎","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","الانقباض العضلي"],["الحصة","2 من 3"],["محور الحصة","نموذج الخيط المنزلق ودور الكالسيوم و‎ATP‎"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 191–193"],["دليل المعلم","ص 232–235"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح نموذج الخيط المنزلق لانقباض العضلة بما في ذلك تكوين الجسور المتقاطعة بين رؤوس الميوسين والأكتين\n2. يشرح دور التروبونين والتروبوميوسين وأيونات الكالسيوم و‎ATP‎ في الانقباض\nمخرج تعليمي آخر: يحلل تغير أطوال الحزم ‎A‎ و‎I‎ والحزمة ‎H‎ أثناء الانقباض","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم التعاوني\n- نمذجة انقباض العضلات","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- الوسائل المتعددة (سمعية - بصرية)","نموذج الخيط المنزلق، الجسر المتقاطع، رأس الميوسين، التروبوميوسين، التروبونين، أيونات الكالسيوم، الشبكة الساركوبلازمية، ‎ATP‎، انثناء رأس الميوسين.","يمسك المعلم يديه متشابكتي الأصابع جزئيًا ثم يقربهما دون أن تقصر الأصابع، ويسأل: «هل قصرت أصابعي؟ أم انزلقت؟ هكذا تنقبض العضلة!»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يقدم تشبيه الأصابع\nالطالب: يستنتجون أن الخيوط تنزلق ولا تقصر\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح خطوات الانقباض: إفراز ‎Ca²⁺‎ من الشبكة الساركوبلازمية، ارتباطه بالتروبونين، إزاحة التروبوميوسين، تكوين الجسور، انثناء رأس الميوسين، دور ‎ATP‎ في الانفصال وإعادة التهيئة\nالطالب: يرتبون بطاقات الخطوات\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يوجه «نمذجة انقباض العضلات» بأدوات بسيطة (أشرطة وأصابع ورقية)\nالطالب: يمثلون الخطوات ويقيسون أطوال الحزم قبل الانقباض وبعده\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الذي يحجب مواقع الارتباط على الأكتين في العضلة المسترخية؟\n   الإجابة النموذجية: التروبوميوسين.\n2) (المستوى المتوقع) السؤال: ما دور أيونات الكالسيوم في الانقباض؟\n   الإجابة النموذجية: ترتبط بالتروبونين فيتغير شكله ويُزيح التروبوميوسين لتنكشف مواقع ارتباط الميوسين على الأكتين.\n3) (المستوى المتقدم) السؤال: ما دور ‎ATP‎ في دورة الجسور المتقاطعة؟\n   الإجابة النموذجية: يرتبط برأس الميوسين فينفصل عن الأكتين، ويُحلل لإعادة تهيئة الرأس للضربة التالية.","1) (مستوى الدعم) السؤال: أي الحزم يبقى طولها ثابتًا أثناء الانقباض؟\n   الإجابة النموذجية: الحزمة ‎A‎.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لطول الحزمة ‎I‎ والحزمة ‎H‎ أثناء الانقباض؟\n   الإجابة النموذجية: يقصران.\n3) (المستوى المتقدم) السؤال: فسّر تيبس العضلات بعد الوفاة.\n   الإجابة النموذجية: لعدم توفر ‎ATP‎ تبقى رؤوس الميوسين مرتبطة بالأكتين فلا تنفصل الجسور المتقاطعة.","إرشاد للطالب: مراجعة ص 191–193 وكتابة خطوات الخيط المنزلق بالترتيب\nإرشاد لولي الأمر: تشجيع الابن على شرح تشبيه انزلاق الأصابع لأحد أفراد الأسرة"],"h":["<ol class=\"ol\"><li>يشرح نموذج الخيط المنزلق لانقباض العضلة بما في ذلك تكوين الجسور المتقاطعة بين رؤوس الميوسين والأكتين</li><li>يشرح دور التروبونين والتروبوميوسين وأيونات الكالسيوم و‎ATP‎ في الانقباض</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحلل تغير أطوال الحزم ‎A‎ و‎I‎ والحزمة ‎H‎ أثناء الانقباض</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح نموذج الخيط المنزلق لانقباض العضلة بما في ذلك تكوين الجسور المتقاطعة بين رؤوس الميوسين والأكتين</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح دور التروبونين والتروبوميوسين وأيونات الكالسيوم و‎ATP‎ في الانقباض</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحلل تغير أطوال الحزم ‎A‎ و‎I‎ والحزمة ‎H‎ أثناء الانقباض</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">نمذجة انقباض العضلات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>نموذج الخيط المنزلق، الجسر المتقاطع، رأس الميوسين، التروبوميوسين، التروبونين، أيونات الكالسيوم، الشبكة الساركوبلازمية، ‎ATP‎، انثناء رأس الميوسين.</p>","<p>يمسك المعلم يديه متشابكتي الأصابع جزئيًا ثم يقربهما دون أن تقصر الأصابع، ويسأل: «هل قصرت أصابعي؟ أم انزلقت؟ هكذا تنقبض العضلة!»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يقدم تشبيه الأصابع</td><td>يستنتجون أن الخيوط تنزلق ولا تقصر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح خطوات الانقباض: إفراز ‎Ca²⁺‎ من الشبكة الساركوبلازمية، ارتباطه بالتروبونين، إزاحة التروبوميوسين، تكوين الجسور، انثناء رأس الميوسين، دور ‎ATP‎ في الانفصال وإعادة التهيئة</td><td>يرتبون بطاقات الخطوات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–32</span><br><small>14 دقيقة</small></td><td>يوجه «نمذجة انقباض العضلات» بأدوات بسيطة (أشرطة وأصابع ورقية)</td><td>يمثلون الخطوات ويقيسون أطوال الحزم قبل الانقباض وبعده</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الذي يحجب مواقع الارتباط على الأكتين في العضلة المسترخية؟</td><td>التروبوميوسين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما دور أيونات الكالسيوم في الانقباض؟</td><td>ترتبط بالتروبونين فيتغير شكله ويُزيح التروبوميوسين لتنكشف مواقع ارتباط الميوسين على الأكتين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما دور ‎ATP‎ في دورة الجسور المتقاطعة؟</td><td>يرتبط برأس الميوسين فينفصل عن الأكتين، ويُحلل لإعادة تهيئة الرأس للضربة التالية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أي الحزم يبقى طولها ثابتًا أثناء الانقباض؟</td><td>الحزمة ‎A‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لطول الحزمة ‎I‎ والحزمة ‎H‎ أثناء الانقباض؟</td><td>يقصران.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>فسّر تيبس العضلات بعد الوفاة.</td><td>لعدم توفر ‎ATP‎ تبقى رؤوس الميوسين مرتبطة بالأكتين فلا تنفصل الجسور المتقاطعة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 191–193 وكتابة خطوات الخيط المنزلق بالترتيب</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على شرح تشبيه انزلاق الأصابع لأحد أفراد الأسرة</p>"]},{"axis":"كتابة نص لنموذج الخيط المنزلق والأسئلة 12–13","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","الانقباض العضلي"],["الحصة","3 من 3"],["محور الحصة","كتابة نص لنموذج الخيط المنزلق والأسئلة 12–13"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 188–193"],["دليل المعلم","ص 232–235"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يكتب نصًا علميًا متسلسلًا يصف الانقباض من وصول النبضة إلى الوصلة العصبية العضلية حتى ارتخاء العضلة\n2. يحل السؤالين 12 و13 في كتاب الطالب\nمخرج تعليمي آخر: يقيّم نصوص الزملاء وفق معايير الدقة والتسلسل والمصطلحات","المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم التعاوني\n- الكتابة العلمية","- الكتاب\n- الأقلام\n- أخرى: بطاقات معايير التقييم","الوصلة العصبية العضلية، إزالة استقطاب الليف العضلي، أنيبيبات ‎T‎، الارتخاء، إعادة امتصاص الكالسيوم، التسلسل العلمي.","يعرض المعلم مقطعًا قصيرًا لعدّاء ينطلق، ويطلب: «اكتب في سطر واحد: من أين بدأت حركة ساقه؟» ثم يناقش الإجابات.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المقطع ويستقبل الإجابات\nالطالب: يربطون الحركة بإشارة عصبية من الدماغ\n2) (18 دقيقة: من الدقيقة 5 إلى 23)\nالمعلم: يوجه «كتابة نص لنموذج الخيط المنزلق» (نشاط دليل المعلم) من الوصلة العصبية العضلية إلى الارتخاء\nالطالب: يكتبون النص في أزواج مستخدمين المصطلحات العلمية\n3) (10 دقائق: من الدقيقة 23 إلى 33)\nالمعلم: ينظم تقييمًا تبادليًا وفق المعايير ثم يوجه حل السؤالين 12 و13\nالطالب: يقيّمون النصوص ويحلون السؤالين\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على الانقباض العضلي\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الذي يحدث عند الوصلة العصبية العضلية؟\n   الإجابة النموذجية: يُفرز الأستيل كولين فيرتبط بمستقبلات غشاء الليف العضلي ويزيل استقطابه.\n2) (المستوى المتوقع) السؤال: ما دور أنيبيبات ‎T‎؟\n   الإجابة النموذجية: نقل إزالة الاستقطاب إلى داخل الليف قرب الشبكة الساركوبلازمية لتحرير الكالسيوم.\n3) (المستوى المتقدم) السؤال: كيف ترتخي العضلة؟\n   الإجابة النموذجية: يُعاد ضخ الكالسيوم إلى الشبكة الساركوبلازمية بالنقل النشط فيعود التروبوميوسين لحجب مواقع الارتباط.","1) (مستوى الدعم) السؤال: ما المعيار الأهم لتقييم نص الانقباض في رأيك؟ ولماذا؟\n   الإجابة النموذجية: مثال: صحة التسلسل، لأن الخطأ في ترتيب الخطوات يدل على سوء فهم الآلية.\n2) (المستوى المتوقع) السؤال: لماذا تحتاج العضلات إلى ‎ATP‎ للارتخاء أيضًا؟\n   الإجابة النموذجية: لأن إعادة ضخ الكالسيوم إلى الشبكة الساركوبلازمية نقل نشط يستهلك ‎ATP‎.\n3) (المستوى المتقدم) السؤال: اكتب ثلاث جمل متسلسلة تصف الانقباض من دخول الكالسيوم حتى انزلاق الخيوط.\n   الإجابة النموذجية: يرتبط الكالسيوم بالتروبونين فيُزاح التروبوميوسين؛ ترتبط رؤوس الميوسين بالأكتين مكونة جسورًا متقاطعة؛ تنثني الرؤوس فتسحب خيوط الأكتين نحو مركز القطعة العضلية.","إرشاد للطالب: تحسين النص العلمي وفق ملاحظات الزملاء وحل السؤالين 12 و13\nإرشاد لولي الأمر: الاطلاع على نص الابن العلمي وتشجيعه على قراءته بصوت مرتفع"],"h":["<ol class=\"ol\"><li>يكتب نصًا علميًا متسلسلًا يصف الانقباض من وصول النبضة إلى الوصلة العصبية العضلية حتى ارتخاء العضلة</li><li>يحل السؤالين 12 و13 في كتاب الطالب</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم نصوص الزملاء وفق معايير الدقة والتسلسل والمصطلحات</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\ ><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الذي يحدث عند الوصلة العصبية العضلية؟</td><td>يُفرز الأستيل كولين فيرتبط بمستقبلات غشاء الليف العضلي ويزيل استقطابه.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما دور أنيبيبات ‎T‎؟</td><td>نقل إزالة الاستقطاب إلى داخل الليف قرب الشبكة الساركوبلازمية لتحرير الكالسيوم.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف ترتخي العضلة؟</td><td>يُعاد ضخ الكالسيوم إلى الشبكة الساركوبلازمية بالنقل النشط فيعود التروبوميوسين لحجب مواقع الارتباط.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المعيار الأهم لتقييم نص الانقباض في رأيك؟ ولماذا؟</td><td>مثال: صحة التسلسل، لأن الخطأ في ترتيب الخطوات يدل على سوء فهم الآلية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تحتاج العضلات إلى ‎ATP‎ للارتخاء أيضًا؟</td><td>لأن إعادة ضخ الكالسيوم إلى الشبكة الساركوبلازمية نقل نشط يستهلك ‎ATP‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتب ثلاث جمل متسلسلة تصف الانقباض من دخول الكالسيوم حتى انزلاق الخيوط.</td><td>يرتبط الكالسيوم بالتروبونين فيُزاح التروبوميوسين؛ ترتبط رؤوس الميوسين بالأكتين مكونة جسورًا متقاطعة؛ تنثني الرؤوس فتسحب خيوط الأكتين نحو مركز القطعة العضلية.</td></tr></table>","<p><b>إرشاد للطالب:</b> تحسين النص العلمي وفق ملاحظات الزملاء وحل السؤالين 12 و13</p><p><b>إرشاد لولي الأمر:</b> الاطلاع على نص الابن العلمي وتشجيعه على قراءته بصوت مرتفع</p>"]}]},{"title":"التحكم والتنسيق في النباتات","sb":"ص 194–205","unit":"الوحدة 5: التحكم والتنسيق","periods":[{"axis":"الأكسين ونمو الاستطالة","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التحكم والتنسيق في النباتات"],["الحصة","1 من 2"],["محور الحصة","الأكسين ونمو الاستطالة"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 194–195"],["دليل المعلم","ص 236–239"],["كتاب التجارب العملية والأنشطة","نشاط 5-3: تأثير الأكسين على نمو الجذر والساق ص 129؛ الاستقصاء العملي 5-2 (إثرائي) ص 142"]],"t":["1. يشرح دور الأكسين في نمو الاستطالة عن طريق تحفيز ضخ البروتونات المسبب لحموضة جدران الخلايا\n2. يصف كيف تؤدي حموضة الجدار إلى تنشيط بروتينات الاستطالة وارتخاء الجدار ودخول الماء واستطالة الخلية\nمخرج تعليمي آخر: يفسر الانتحاء الضوئي في ضوء توزيع الأكسين","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم بالنمذجة\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","الأكسين ‎(IAA)‎، منظم النمو النباتي، نمو الاستطالة، ضخ البروتونات، تحمّض جدار الخلية، بروتينات الاستطالة، الانتحاء الضوئي.","يعرض المعلم صورة نبتة على حافة نافذة مائلة نحو الضوء ويسأل: «النبات لا يملك عضلات ولا أعصابًا؛ كيف انحنى نحو الضوء؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون مادة كيميائية تتحكم في النمو\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح آلية الأكسين: الارتباط بالمستقبلات، تنشيط مضخات البروتون، تحمض الجدار، بروتينات الاستطالة، دخول الماء والاستطالة\nالطالب: يرسمون مخططًا انسيابيًا للآلية\n3) (14 دقيقة: من الدقيقة 18 إلى 32)\nالمعلم: يقدم مواقف (ضوء من جهة واحدة، قمة مقطوعة) لتحليلها في مجموعات\nالطالب: يتنبؤون بالنمو ويفسرونه بتوزيع الأكسين\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: كيف يجعل الأكسين جدار الخلية حمضيًا؟\n   الإجابة النموذجية: يحفز ضخ البروتونات ‎(H⁺)‎ من السيتوبلازم إلى جدار الخلية.\n2) (المستوى المتوقع) السؤال: ما دور بروتينات الاستطالة؟\n   الإجابة النموذجية: تنشط في الوسط الحمضي فتكسر الروابط بين ألياف السليلوز فيرتخي الجدار ويتمدد.\n3) (المستوى المتقدم) السؤال: لماذا ينحني الساق نحو الضوء؟\n   الإجابة النموذجية: لأن الأكسين يتجمع في الجانب المظلل فتستطيل خلاياه أكثر فينحني الساق نحو الضوء.","1) (مستوى الدعم) السؤال: ما الأكسين؟\n   الإجابة النموذجية: منظم نمو نباتي (هرمون نباتي) يحفز استطالة الخلايا.\n2) (المستوى المتوقع) السؤال: رتب: دخول الماء، ضخ البروتونات، ارتخاء الجدار، تنشيط بروتينات الاستطالة، استطالة الخلية.\n   الإجابة النموذجية: ضخ البروتونات ← تنشيط بروتينات الاستطالة ← ارتخاء الجدار ← دخول الماء ← استطالة الخلية.\n3) (المستوى المتقدم) السؤال: لماذا لا تستطيل الخلية رغم وجود الأكسين إذا كان الماء قليلًا جدًا؟\n   الإجابة النموذجية: لأن الاستطالة تحتاج إلى دخول الماء بالأسموزية لتمديد الجدار المرتخي.","إرشاد للطالب: مراجعة ص 194–195 وحل السؤال 14\nإرشاد لولي الأمر: يمكن تنفيذ تجربة منزلية بسيطة لإنبات بذور قرب نافذة وملاحظة انحنائها نحو الضوء"],"h":["<ol class=\"ol\"><li>يشرح دور الأكسين في نمو الاستطالة عن طريق تحفيز ضخ البروتونات المسبب لحموضة جدران الخلايا</li><li>يصف كيف تؤدي حموضة الجدار إلى تنشيط بروتينات الاستطالة وارتخاء الجدار ودخول الماء واستطالة الخلية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر الانتحاء الضوئي في ضوء توزيع الأكسين</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح دور الأكسين في نمو الاستطالة عن طريق تحفيز ضخ البروتونات المسبب لحموضة جدران الخلايا</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف كيف تؤدي حموضة الجدار إلى تنشيط بروتينات الاستطالة وارتخاء الجدار ودخول الماء واستطالة الخلية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر الانتحاء الضوئي في ضوء توزيع الأكسين</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الأكسين ‎(IAA)‎، منظم النمو النباتي، نمو الاستطالة، ضخ البروتونات، تحمّض جدار الخلية، بروتينات الاستطالة، الانتحاء الضوئي.</p>","<p>يعرض المعلم صورة نبتة على حافة نافذة مائلة نحو الضوء ويسأل: «النبات لا يملك عضلات ولا أعصابًا؛ كيف انحنى نحو الضوء؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm ًا جدًا؟</td><td>لأن الاستطالة تحتاج إلى دخول الماء بالأسموزية لتمديد الجدار المرتخي.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 194–195 وحل السؤال 14</p><p><b>إرشاد لولي الأمر:</b> يمكن تنفيذ تجربة منزلية بسيطة لإنبات بذور قرب نافذة وملاحظة انحنائها نحو الضوء</p>"]},{"axis":"نشاط 5-3: تأثير الأكسين ومراجعة الوحدة الخامسة","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 5: التحكم والتنسيق"],["الدرس","التحكم والتنسيق في النباتات"],["الحصة","2 من 2"],["محور الحصة","نشاط 5-3: تأثير الأكسين ومراجعة الوحدة الخامسة"],["الأسبوع والتاريخ","الأسبوع الخامس عشر (13–17/12/2026)"],["كتاب الطالب","ص 196–205 + كتاب التجارب ص 129"],["دليل المعلم","ص 236–239"],["كتاب التجارب العملية والأنشطة","نشاط 5-3: تأثير الأكسين على نمو الجذر والساق ص 129؛ الاستقصاء العملي 5-2 (إثرائي) ص 142"]],"t":["1. يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3)\n2. يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي\nمخرج تعليمي آخر: يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة","المخرج 1: تحليل\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎\n- أخرى: كتاب التجارب العملية والأنشطة","منحنى الاستجابة للتركيز، التركيز الأمثل، التثبيط عند التراكيز العالية، الجذر، الساق، ملخص الوحدة.","يعرض المعلم تمثيلًا بيانيًا لاستجابة الجذر والساق لتراكيز الأكسين ويسأل: «تركيز واحد ينشط الساق ويثبط الجذر؛ كيف يكون ذلك؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض التمثيل ويطرح السؤال\nالطالب: يلاحظون اختلاف التركيز الأمثل\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يوجه حل نشاط 5-3 «تأثير الأكسين على نمو الجذر والساق» (كتاب التجارب ص 129)\nالطالب: يحللون البيانات ويحددون التراكيز المثلى\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يوزع أسئلة نهاية الوحدة (ص 198–205) على المجموعات\nالطالب: يحلون ويعرضون الحلول\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: أيهما أكثر حساسية للأكسين: الجذر أم الساق؟\n   الإجابة النموذجية: الجذر؛ فتركيزه الأمثل أقل بكثير.\n2) (المستوى المتوقع) السؤال: ماذا يحدث لنمو الجذر عند تراكيز أكسين عالية؟\n   الإجابة النموذجية: يُثبط.\n3) (المستوى المتقدم) السؤال: اربط بين جهد الفعل في الخلية العصبية والانقباض العضلي في جملة.\n   الإجابة النموذجية: يصل جهد الفعل إلى الوصلة العصبية العضلية فيُفرز الأستيل كولين ويزيل استقطاب الليف فيتحرر الكالسيوم ويحدث الانقباض.","1) (مستوى الدعم) السؤال: اذكر تشابهًا واحدًا بين التأشير في الحيوان والنبات.\n   الإجابة النموذجية: كلاهما يستخدم مواد كيميائية ترتبط بمستقبلات نوعية في خلايا هدف (هرمونات أو أكسين).\n2) (المستوى المتوقع) السؤال: لماذا يؤدي التركيز نفسه من الأكسين إلى استجابتين مختلفتين في الجذر والساق؟\n   الإجابة النموذجية: لاختلاف حساسية خلايا العضوين للأكسين، فالتركيز المحفز للساق يكون مثبطًا للجذر.\n3) (المستوى المتقدم) السؤال: قيّم تعلمك في الوحدة الخامسة: موضوع أتقنته، وآخر يحتاج إلى مراجعة، وخطة لذلك.\n   الإجابة النموذجية: إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.","إرشاد للطالب: إكمال نشاط 5-3 وأسئلة نهاية الوحدة وقائمة التقويم الذاتي ومراجعة الملخص ص 196–197\nإرشاد لولي الأمر: الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات"],"h":["<ol class=\"ol\"><li>يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3)</li><li>يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحلل بيانات تأثير تراكيز الأكسين المختلفة على نمو الجذر والساق (نشاط 5-3)</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نهاية الوحدة الخامسة في التواصل العصبي والعضلي والنباتي</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه بقائمة التقويم الذاتي للوحدة الخامسة</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>منحنى الاستجابة للتركيز، التركيز الأمثل، التثبيط عند التراكيز العالية، الجذر، الساق، ملخص الوحدة.</p>","<p>يعرض المعلم تمثيلًا بيانيًا لاستجابة الجذر والساق لتراكيز الأكسين ويسأل: «تركيز واحد ينشط الساق ويثبط الجذر؛ كيف يكون ذلك؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض التمثيل ويطرح السؤال</td><td>يلاحظون اختلاف التركيز الأمثل</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يوجه حل نشاط 5-3 «تأثير الأكسين على نمو الجذر والساق» (كتاب التجارب ص 129)</td><td>يحللون البيانات ويحددون التراكيز المثلى</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يوزع أسئلة نهاية الوحدة (ص 198–205) على المجموعات</td><td>يحلون ويعرضون الحلول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>أيهما أكثر حساسية للأكسين: الجذر أم الساق؟</td><td>الجذر؛ فتركيزه الأمثل أقل بكثير.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ماذا يحدث لنمو الجذر عند تراكيز أكسين عالية؟</td><td>يُثبط.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اربط بين جهد الفعل في الخلية العصبية والانقباض العضلي في جملة.</td><td>يصل جهد الفعل إلى الوصلة العصبية العضلية فيُفرز الأستيل كولين ويزيل استقطاب الليف فيتحرر الكالسيوم ويحدث الانقباض.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر تشابهًا واحدًا بين التأشير في الحيوان والنبات.</td><td>كلاهما يستخدم مواد كيميائية ترتبط بمستقبلات نوعية في خلايا هدف (هرمونات أو أكسين).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يؤدي التركيز نفسه من الأكسين إلى استجابتين مختلفتين في الجذر والساق؟</td><td>لاختلاف حساسية خلايا العضوين للأكسين، فالتركيز المحفز للساق يكون مثبطًا للجذر.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم تعلمك في الوحدة الخامسة: موضوع أتقنته، وآخر يحتاج إلى مراجعة، وخطة لذلك.</td><td>إجابة شخصية تتضمن موضوعًا محددًا لكل حالة وخطوة عملية للمراجعة.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 5-3 وأسئلة نهاية الوحدة وقائمة التقويم الذاتي ومراجعة الملخص ص 196–197</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على خطته لمراجعة الفصل الدراسي استعدادًا للاختبارات</p>"]}]}];
let st={m:'sep',l:0,p:0};
try{const s=JSON.parse(localStorage.getItem('noorcopy_'+document.title)||'null');if(s&&D[s.l])st=s;}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('noorcopy_'+document.title,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function buildSelect(){let h='',u='';D.forEach((L,i)=>{if(L.unit!==u){if(u)h+='</optgroup>';u=L.unit;h+=`<optgroup label="${esc(u)}">`}h+=`<option value="${i}">${esc(L.title)} (${L.periods.length} حصص)</option>`});h+='</optgroup>';$('les').innerHTML=h}
function render(){
 const L=D[st.l];if(st.p>=L.periods.length)st.p=0;
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));
 $('status').textContent=st.m==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة — الحصة ${st.p+1} من ${L.periods.length}`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم ${L.periods.length} حصص`;
 $('les').value=st.l;
 const tabs=$('tabs');
 if(st.m==='sep'){tabs.style.display='flex';tabs.innerHTML=L.periods.map((p,i)=>`<button class="${i===st.p?'on':''}" data-i="${i}">الحصة ${p.n}: ${esc(p.axis)}</button>`).join('')}
 else tabs.style.display='none';
 let rows='';
 if(st.m==='sep'){const hi=L.periods[st.p].hi;rows=hi.map((r,k)=>`<div class="${k===4?'w':''}"><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')}
 else{const h0=L.periods[0].hi;rows=[h0[0],h0[1],h0[2]].map(r=>`<div><b>${r[0]}:</b>${esc(r[1])}</div>`).join('')+
  `<div><b>كتاب الطالب:</b>${esc(L.sb)}</div><div><b>${h0[7][0]}:</b>${esc(h0[7][1])}</div><div><b>${h0[8][0]}:</b>${esc(h0[8][1])}</div>`+
  `<div class="w"><b>الحصص:</b><br>${L.periods.map(p=>`الحصة ${p.n}: ${esc(p.axis)} — ${esc(p.hi[5][1])}`).join('<br>')}</div>`}
 $('info').innerHTML=rows;
 $('cards').innerHTML=FIELDS.map((f,i)=>`<div class="card"><div class="ch"><div class="ct"><span class="num">${i+1}</span>${f}</div><button class="copy" data-f="${i}">نسخ</button></div><div class="cb" id="cb${i}">${fieldHtml(i)}</div></div>`).join('');
 save();
}
function fieldHtml(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].h[i];
 return L.periods.map(p=>`<div class="sub"><div class="subh">الحصة ${p.n}: ${esc(p.axis)}</div>${p.h[i]}</div>`).join('')}
function fieldText(i){const L=D[st.l];if(st.m==='sep')return L.periods[st.p].t[i];
 return L.periods.map(p=>`الحصة ${p.n}: ${p.axis}\n${p.t[i]}`).join('\n\n')}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok')},1800)}
function fallback(i,t){const cb=$('cb'+i);let ta=cb.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';cb.appendChild(ta);const h=document.createElement('div');h.className='hint';h.textContent='تعذّر الوصول إلى الحافظة في هذا المتصفح: النص محدد الآن، انسخه يدويًا (اضغط مطولًا ثم نسخ، أو Ctrl+C).';cb.appendChild(h)}ta.value=t;ta.focus();ta.select();ta.setSelectionRange(0,t.length)}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#mode button');if(m){st.m=m.dataset.m;render();return}
 const tb=e.target.closest('#tabs button');if(tb){st.p=+tb.dataset.i;render();return}
 const c=e.target.closest('.copy');if(c){const i=+c.dataset.f,t=fieldText(i);let ok=false;
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(t);ok=true}catch(err){}}
  if(!ok)ok=legacyCopy(t);
  if(ok)done(c);else fallback(i,t);}
});
$('les').addEventListener('change',e=>{st.l=+e.target.value;st.p=0;render()});
buildSelect();render();
</script>
</body>
</html>
