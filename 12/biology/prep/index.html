روابط فوسفوداي إستر تربط الجين بالبلازميد.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما البلازميد؟</td><td>جزيء ‎DNA‎ دائري صغير في البكتيريا يُستخدم ناقلًا لإدخال الجين.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما المقصود بالنهايات اللاصقة؟</td><td>أطراف قصيرة مفردة الشريط تتكون عند القطع ويمكنها التزاوج مع أطراف متممة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>رتب: ربط بالليجيز، قطع البلازميد والجين بالإنزيم نفسه، إدخال البلازميد في البكتيريا، خلط الجين بالبلازميد.</td><td>القطع بالإنزيم نفسه ← خلط الجين بالبلازميد ← الربط بالليجيز ← إدخال البلازميد في البكتيريا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 87–91 ورسم خطوات إدخال الجين في بلازميد</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن عن تشبيه «المقص الذكي والشريط اللاصق»</p>"]},{"axis":"ترانسكريبتيز العكسي والمحفز والعلامات الجينية","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","أدوات تقني الجينات"],["الحصة","2 من 2"],["محور الحصة","ترانسكريبتيز العكسي والمحفز والعلامات الجينية"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 88–95 + كتاب التجارب ص 67"],["دليل المعلم","ص 133–137"],["كتاب التجارب العملية والأنشطة","نشاط 3-1: مصطلحات التقنيات الجينية ص 67"]],"t":["1. يشرح دور ترانسكريبتيز العكسي و‎DNA‎ بوليميريز في بناء ‎cDNA‎ من ‎mRNA‎\n2. يفسر سبب نقل المحفز مع الجين المطلوب واستخدام العلامات الجينية المتوهجة ‎(GFP)‎ لتأكيد التعبير\nمخرج تعليمي آخر: يحل نشاط 3-1 «مصطلحات التقنيات الجينية»","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم الذاتي\n- تحويل الرسوم التخطيطية إلى كلمات","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة","ترانسكريبتيز العكسي، ‎cDNA‎، ‎dNTPs‎، البادئة، المحفز، العلامة الجينية، البروتين المتوهج ‎(GFP)‎.","يسأل المعلم: «لماذا يفضل العلماء البدء من ‎mRNA‎ الإنسولين في خلايا البنكرياس بدلًا من جين الإنسولين في ‎DNA‎؟» ويذكّر بالإنترونات وعدم قدرة البكتيريا على إزالتها.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويربطه بالإنترونات\nالطالب: يستنتجون أن ‎mRNA‎ خالٍ من الإنترونات\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح بناء ‎cDNA‎ بالشكل 3-2 (بادئة، ‎dNTPs‎، ترانسكريبتيز العكسي، إزالة ‎mRNA‎، ‎DNA‎ بوليميريز، نهايات لاصقة)\nالطالب: يحولون الشكل إلى خطوات مكتوبة (نشاط تحويل الرسوم إلى كلمات)\n3) (10 دقائق: من الدقيقة 18 إلى 28)\nالمعلم: يشرح أهمية المحفز والعلامات الجينية المتوهجة\nالطالب: يقترحون طريقة لاختيار البكتيريا التي أخذت الجين\n4) (12 دقيقة: من الدقيقة 28 إلى 40)\nالمعلم: يوجه حل نشاط 3-1 (كتاب التجارب ص 67) والأسئلة 2–7 المختارة\nالطالب: يحلون في أزواج ثم يصححون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما وظيفة ترانسكريبتيز العكسي؟\n   الإجابة النموذجية: بناء شريط ‎DNA‎ متمم ‎(cDNA)‎ باستخدام ‎mRNA‎ قالبًا.\n2) (المستوى المتوقع) السؤال: لماذا يُنقل المحفز مع الجين المطلوب؟\n   الإجابة النموذجية: لأن ‎RNA‎ بوليميريز يحتاج إلى الارتباط بالمحفز لنسخ الجين في الخلية المستقبلة.\n3) (المستوى المتقدم) السؤال: كيف يساعد جين ‎GFP‎ في تحديد الخلايا المعدلة؟\n   الإجابة النموذجية: الخلايا التي أخذت الجين المطلوب مع جين ‎GFP‎ تتوهج باللون الأخضر تحت الأشعة فوق البنفسجية فيسهل تمييزها.","1) (مستوى الدعم) السؤال: ما ‎cDNA‎؟\n   الإجابة النموذجية: ‎DNA‎ متمم يُبنى من ‎mRNA‎ ولا يحتوي إنترونات.\n2) (المستوى المتوقع) السؤال: لماذا يُعد ‎cDNA‎ مناسبًا للتعبير في البكتيريا؟\n   الإجابة النموذجية: لأنه خالٍ من الإنترونات، والبكتيريا لا تستطيع إزالة الإنترونات.\n3) (المستوى المتقدم) السؤال: اقترح سببًا لاستخدام العلامات المتوهجة بدلًا من جينات مقاومة المضادات الحيوية.\n   الإجابة النموذجية: لتجنب خطر انتقال جينات مقاومة المضادات الحيوية إلى بكتيريا ممرضة، ولسهولة رؤية الخلايا المعدلة مباشرة.","إرشاد للطالب: إكمال نشاط 3-1 ص 67 ومراجعة ص 88–95\nإرشاد لولي الأمر: التأكد من فهم الابن الفرق بين ‎cDNA‎ والجين الأصلي في ‎DNA‎"],"h":["<ol class=\"ol\"><li>يشرح دور ترانسكريبتيز العكسي و‎DNA‎ بوليميريز في بناء ‎cDNA‎ من ‎mRNA‎</li><li>يفسر سبب نقل المحفز مع الجين المطلوب واستخدام العلامات الجينية المتوهجة ‎(GFP)‎ لتأكيد التعبير</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل نشاط 3-1 «مصطلحات التقنيات الجينية»</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح دور ترانسكريبتيز العكسي و‎DNA‎ بوليميريز في بناء ‎cDNA‎ من ‎mRNA‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر سبب نقل المحفز مع الجين المطلوب واستخدام العلامات الجينية المتوهجة ‎(GFP)‎ لتأكيد التعبير</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل نشاط 3-1 «مصطلحات التقنيات الجينية»</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">تحويل الرسوم التخطيطية إلى كلمات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>ترانسكريبتيز العكسي، ‎cDNA‎، ‎dNTPs‎، البادئة، المحفز، العلامة الجينية، البروتين المتوهج ‎(GFP)‎.</p>","<p>يسأل المعلم: «لماذا يفضل العلماء البدء من ‎mRNA‎ الإنسولين في خلايا البنكرياس بدلًا من جين الإنسولين في ‎DNA‎؟» ويذكّر بالإنترونات وعدم قدرة البكتيريا على إزالتها.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويربطه بالإنترونات</td><td>يستنتجون أن ‎mRNA‎ خالٍ من الإنترونات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح بناء ‎cDNA‎ بالشكل 3-2 (بادئة، ‎dNTPs‎، ترانسكريبتيز العكسي، إزالة ‎mRNA‎، ‎DNA‎ بوليميريز، نهايات لاصقة)</td><td>يحولون الشكل إلى خطوات مكتوبة (نشاط تحويل الرسوم إلى كلمات)</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–28</span><br><small>10 دقائق</small></td><td>يشرح أهمية المحفز والعلامات الجينية المتوهجة</td><td>يقترحون طريقة لاختيار البكتيريا التي أخذت الجين</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">28–40</span><br><small>12 دقيقة</small></td><td>يوجه حل نشاط 3-1 (كتاب التجارب ص 67) والأسئلة 2–7 المختارة</td><td>يحلون في أزواج ثم يصححون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة ترانسكريبتيز العكسي؟</td><td>بناء شريط ‎DNA‎ متمم ‎(cDNA)‎ باستخدام ‎mRNA‎ قالبًا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُنقل المحفز مع الجين المطلوب؟</td><td>لأن ‎RNA‎ بوليميريز يحتاج إلى الارتباط بالمحفز لنسخ الجين في الخلية المستقبلة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كيف يساعد جين ‎GFP‎ في تحديد الخلايا المعدلة؟</td><td>الخلايا التي أخذت الجين المطلوب مع جين ‎GFP‎ تتوهج باللون الأخضر تحت الأشعة فوق البنفسجية فيسهل تمييزها.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما ‎cDNA‎؟</td><td>‎DNA‎ متمم يُبنى من ‎mRNA‎ ولا يحتوي إنترونات.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُعد ‎cDNA‎ مناسبًا للتعبير في البكتيريا؟</td><td>لأنه خالٍ من الإنترونات، والبكتيريا لا تستطيع إزالة الإنترونات.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح سببًا لاستخدام العلامات المتوهجة بدلًا من جينات مقاومة المضادات الحيوية.</td><td>لتجنب خطر انتقال جينات مقاومة المضادات الحيوية إلى بكتيريا ممرضة، ولسهولة رؤية الخلايا المعدلة مباشرة.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 3-1 ص 67 ومراجعة ص 88–95</p><p><b>إرشاد لولي الأمر:</b> التأكد من فهم الابن الفرق بين ‎cDNA‎ والجين الأصلي في ‎DNA‎</p>"]}]},{"title":"فصل وتضخيم ‎DNA‎","sb":"ص 96–100","unit":"الوحدة 3: التقنية الجينية","periods":[{"axis":"تفاعل البوليميريز المتسلسل ‎(PCR)‎","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","فصل وتضخيم ‎DNA‎"],["الحصة","1 من 2"],["محور الحصة","تفاعل البوليميريز المتسلسل ‎(PCR)‎"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 96–98"],["دليل المعلم","ص 138–141"],["كتاب التجارب العملية والأنشطة","نشاط 3-2: استخدام الفصل الكهربائي الهلامي (إثرائي) ص 68"]],"t":["1. يصف مراحل تفاعل البوليميريز المتسلسل: التمسخ، والالتصاق، والاستطالة ودرجات حرارتها\n2. يشرح دور إنزيم ‎Taq‎ بوليميريز والبادئات في تضخيم ‎DNA‎\nمخرج تعليمي آخر: يحسب عدد نسخ ‎DNA‎ الناتجة بعد عدد معين من دورات ‎PCR‎","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات\n- التعلم في السياق","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","تفاعل البوليميريز المتسلسل ‎(PCR)‎، التمسخ، الالتصاق، الاستطالة، البادئات، ‎Taq‎ بوليميريز، المدوِّر الحراري، التضخيم.","يعرض المعلم صورة باحثة عمانية في المديرية العامة للبحوث الزراعية والحيوانية تحمّل جهاز ‎PCR‎ ويسأل: «من شعرة واحدة في مسرح جريمة لا يكفي ‎DNA‎ للتحليل؛ كيف نحصل على مليارات النسخ؟» (نشاط ‎PCR‎ في السياق).","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح المشكلة\nالطالب: يقترحون نسخ ‎DNA‎ مرات كثيرة\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يشرح المراحل الثلاث ودرجات الحرارة ودور البادئات و‎Taq‎ بوليميريز\nالطالب: يرسمون دورة ‎PCR‎ ويكتبون درجة حرارة كل مرحلة\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يقدم مسائل حساب النسخ (2ⁿ) وسيناريوهات تطبيقية (طب شرعي، تشخيص)\nالطالب: يحسبون النسخ ويربطون ‎PCR‎ بالتطبيقات\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ماذا يحدث في مرحلة التمسخ؟\n   الإجابة النموذجية: تسخين ‎DNA‎ إلى نحو ‎95°C‎ فتنكسر الروابط الهيدروجينية وينفصل الشريطان.\n2) (المستوى المتوقع) السؤال: لماذا يُستخدم ‎Taq‎ بوليميريز تحديدًا؟\n   الإجابة النموذجية: لأنه مأخوذ من بكتيريا تعيش في الينابيع الحارة فيتحمل درجات الحرارة المرتفعة دون أن يتمسخ.\n3) (المستوى المتقدم) السؤال: كم نسخة من ‎DNA‎ تنتج من جزيء واحد بعد 10 دورات؟\n   الإجابة النموذجية: ‎2¹⁰ = 1024‎ نسخة.","1) (مستوى الدعم) السؤال: ما وظيفة البادئات في ‎PCR‎؟\n   الإجابة النموذجية: تتزاوج مع أطراف الجزء المراد تضخيمه لتوفر نقطة بدء يبني منها البوليميريز الشريط الجديد.\n2) (المستوى المتوقع) السؤال: رتب مراحل الدورة وفق درجات حرارتها.\n   الإجابة النموذجية: التمسخ ‎(≈95°C) ←‎ الالتصاق (أقل، نحو ‎55–65°C) ←‎ الاستطالة ‎(≈72°C)‎.\n3) (المستوى المتقدم) السؤال: لماذا تتطلب كل دورة خفض الحرارة ثم رفعها؟\n   الإجابة النموذجية: الخفض يسمح للبادئات بالالتصاق بالأشرطة المفردة، والرفع إلى ‎72°C‎ هو الأنسب لعمل ‎Taq‎ بوليميريز في بناء الأشرطة.","إرشاد للطالب: مراجعة ص 96–98 وحل السؤال 8\nإرشاد لولي الأمر: يمكن الحديث مع الابن عن استخدام ‎PCR‎ في تشخيص الأمراض والطب الشرعي"],"h":["<ol class=\"ol\"><li>يصف مراحل تفاعل البوليميريز المتسلسل: التمسخ، والالتصاق، والاستطالة ودرجات حرارتها</li><li>يشرح دور إنزيم ‎Taq‎ بوليميريز والبادئات في تضخيم ‎DNA‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب عدد نسخ ‎DNA‎ الناتجة بعد عدد معين من دورات ‎PCR‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف مراحل تفاعل البوليميريز المتسلسل: التمسخ، والالتصاق، والاستطالة ودرجات حرارتها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح دور إنزيم ‎Taq‎ بوليميريز والبادئات في تضخيم ‎DNA‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب عدد نسخ ‎DNA‎ الناتجة بعد عدد معين من دورات ‎PCR‎</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم في السياق</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>تفاعل البوليميريز المتسلسل ‎(PCR)‎، التمسخ، الالتصاق، الاستطالة، البادئات، ‎Taq‎ بوليميريز، المدوِّر الحراري، التضخيم.</p>","<p>يعرض المعلم صورة باحثة عمانية في المديرية العامة للبحوث الزراعية والحيوانية تحمّل جهاز ‎PCR‎ ويسأل: «من شعرة واحدة في مسرح جريمة لا يكفي ‎DNA‎ للتحليل؛ كيف نحصل على مليارات النسخ؟» (نشاط ‎PCR‎ في السياق).</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح المشكلة</td><td>يقترحون نسخ ‎DNA‎ مرات كثيرة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يشرح المراحل الثلاث ودرجات الحرارة ودور البادئات و‎Taq‎ بوليميريز</td><td>يرسمون دورة ‎PCR‎ ويكتبون درجة حرارة كل مرحلة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يقدم مسائل حساب النسخ (2ⁿ) وسيناريوهات تطبيقية (طب شرعي، تشخيص)</td><td>يحسبون النسخ ويربطون ‎PCR‎ بالتطبيقات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا يحدث في مرحلة التمسخ؟</td><td>تسخين ‎DNA‎ إلى نحو ‎95°C‎ فتنكسر الروابط الهيدروجينية وينفصل الشريطان.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُستخدم ‎Taq‎ بوليميريز تحديدًا؟</td><td>لأنه مأخوذ من بكتيريا تعيش في الينابيع الحارة فيتحمل درجات الحرارة المرتفعة دون أن يتمسخ.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم نسخة من ‎DNA‎ تنتج من جزيء واحد بعد 10 دورات؟</td><td>‎2¹⁰ = 1024‎ نسخة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما وظيفة البادئات في ‎PCR‎؟</td><td>تتزاوج مع أطراف الجزء المراد تضخيمه لتوفر نقطة بدء يبني منها البوليميريز الشريط الجديد.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب مراحل الدورة وفق درجات حرارتها.</td><td>التمسخ ‎(≈95°C) ←‎ الالتصاق (أقل، نحو ‎55–65°C) ←‎ الاستطالة ‎(≈72°C)‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا تتطلب كل دورة خفض الحرارة ثم رفعها؟</td><td>الخفض يسمح للبادئات بالالتصاق بالأشرطة المفردة، والرفع إلى ‎72°C‎ هو الأنسب لعمل ‎Taq‎ بوليميريز في بناء الأشرطة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 96–98 وحل السؤال 8</p><p><b>إرشاد لولي الأمر:</b> يمكن الحديث مع الابن عن استخدام ‎PCR‎ في تشخيص الأمراض والطب الشرعي</p>"]},{"axis":"الفصل الكهربائي الهلامي وتطبيقاته","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","فصل وتضخيم ‎DNA‎"],["الحصة","2 من 2"],["محور الحصة","الفصل الكهربائي الهلامي وتطبيقاته"],["الأسبوع والتاريخ","الأسبوع التاسع (1–5/11/2026)"],["كتاب الطالب","ص 98–100 + كتاب التجارب ص 68"],["دليل المعلم","ص 138–141"],["كتاب التجارب العملية والأنشطة","نشاط 3-2: استخدام الفصل الكهربائي الهلامي (إثرائي) ص 68"]],"t":["1. يصف كيفية استخدام الفصل الكهربائي الهلامي لفصل قطع ‎DNA‎ مختلفة الطول\n2. يفسر اتجاه حركة قطع ‎DNA‎ نحو القطب الموجب وسرعتها وفق حجمها\nمخرج تعليمي آخر: يحلل نتائج هلام لتحديد تطابق عينات ‎DNA (‎البصمة الوراثية)","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تحليل","- التعلم بالاكتشاف\n- التعلم المبني على حل المشكلات","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة، صور نتائج فصل هلامي","الفصل الكهربائي الهلامي، الهلام (جل الأجاروز)، القطب الموجب، الشحنة السالبة لـ ‎DNA‎، الحزم، المسلم (السلم) المرجعي، البصمة الوراثية.","يعرض المعلم صورة هلام فيه حزم لعينات من مسرح جريمة ومشتبه بهم ويسأل: «أيهم الجاني؟ وكيف ظهرت هذه الخطوط؟» (نشاط تحديد الاختلافات).","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويستقبل التخمينات\nالطالب: يقارنون الحزم بصريًا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح خطوات الفصل الهلامي ولماذا تتحرك القطع نحو القطب الموجب وتفصل حسب الطول\nالطالب: يرسمون حوض الفصل ويحددون القطبين واتجاه الحركة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه نشاط 3-2 «استخدام الفصل الكهربائي الهلامي» (إثرائي، ص 68) وتحليل نتائج افتراضية\nالطالب: يحللون الحزم ويحددون العينات المتطابقة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: لماذا تتحرك قطع ‎DNA‎ نحو القطب الموجب؟\n   الإجابة النموذجية: لأن مجموعات الفوسفات تمنح ‎DNA‎ شحنة سالبة.\n2) (المستوى المتوقع) السؤال: أي القطع تقطع مسافة أكبر في الهلام؟\n   الإجابة النموذجية: القطع الأقصر (الأصغر).\n3) (المستوى المتقدم) السؤال: ما فائدة السلم المرجعي في الهلام؟\n   الإجابة النموذجية: يحتوي قطعًا معروفة الأطوال تُقارن بها العينات لتقدير أطوالها.","1) (مستوى الدعم) السؤال: ماذا يمثل كل خط (حزمة) في الهلام؟\n   الإجابة النموذجية: مجموعة من قطع ‎DNA‎ متساوية الطول.\n2) (المستوى المتوقع) السؤال: لماذا يُستخدم إنزيم القطع قبل الفصل الهلامي في البصمة الوراثية؟\n   الإجابة النموذجية: لتقطيع ‎DNA‎ إلى قطع مختلفة الطول تختلف بين الأفراد فيظهر نمط حزم مميز.\n3) (المستوى المتقدم) السؤال: عينة من مسرح جريمة تطابق حزمها المشتبه به الثاني في جميع المواقع. ماذا تستنتج؟ وما الذي يزيد ثقة الاستنتاج؟\n   الإجابة النموذجية: احتمال كبير أن العينة من المشتبه به الثاني؛ وتزيد الثقة بفحص عدد أكبر من المواقع وتكرار التحليل ومنع تلوث العينات.","إرشاد للطالب: مراجعة ص 98–100 وإكمال نشاط 3-2 وحل السؤالين 9 و10\nإرشاد لولي الأمر: الحديث مع الابن عن استخدام البصمة الوراثية في إثبات النسب والتعرف على الهوية"],"h":["<ol class=\"ol\"><li>يصف كيفية استخدام الفصل الكهربائي الهلامي لفصل قطع ‎DNA‎ مختلفة الطول</li><li>يفسر اتجاه حركة قطع ‎DNA‎ نحو القطب الموجب وسرعتها وفق حجمها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحلل نتائج هلام لتحديد تطابق عينات ‎DNA (‎البصمة الوراثية)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف كيفية استخدام الفصل الكهربائي الهلامي لفصل قطع ‎DNA‎ مختلفة الطول</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر اتجاه حركة قطع ‎DNA‎ نحو القطب الموجب وسرعتها وفق حجمها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحلل نتائج هلام لتحديد تطابق عينات ‎DNA (‎البصمة الوراثية)</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم المبني على حل المشكلات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة، صور نتائج فصل هلامي</span></div>","<p>الفصل الكهربائي الهلامي، الهلام (جل الأجاروز)، القطب الموجب، الشحنة السالبة لـ ‎DNA‎، الحزم، المسلم (السلم) المرجعي، البصمة الوراثية.</p>","<p>يعرض المعلم صورة هلام فيه حزم لعينات من مسرح جريمة ومشتبه بهم ويسأل: «أيهم الجاني؟ وكيف ظهرت هذه الخطوط؟» (نشاط تحديد الاختلافات).</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويستقبل التخمينات</td><td>يقارنون الحزم بصريًا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح خطوات الفصل الهلامي ولماذا تتحرك القطع نحو القطب الموجب وتفصل حسب الطول</td><td>يرسمون حوض الفصل ويحددون القطبين واتجاه الحركة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يوجه نشاط 3-2 «استخدام الفصل الكهربائي الهلامي» (إثرائي، ص 68) وتحليل نتائج افتراضية</td><td>يحللون الحزم ويحددون العينات المتطابقة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تتحرك قطع ‎DNA‎ نحو القطب الموجب؟</td><td>لأن مجموعات الفوسفات تمنح ‎DNA‎ شحنة سالبة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>أي القطع تقطع مسافة أكبر في الهلام؟</td><td>القطع الأقصر (الأصغر).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما فائدة السلم المرجعي في الهلام؟</td><td>يحتوي قطعًا معروفة الأطوال تُقارن بها العينات لتقدير أطوالها.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ماذا يمثل كل خط (حزمة) في الهلام؟</td><td>مجموعة من قطع ‎DNA‎ متساوية الطول.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يُستخدم إنزيم القطع قبل الفصل الهلامي في البصمة الوراثية؟</td><td>لتقطيع ‎DNA‎ إلى قطع مختلفة الطول تختلف بين الأفراد فيظهر نمط حزم مميز.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>عينة من مسرح جريمة تطابق حزمها المشتبه به الثاني في جميع المواقع. ماذا تستنتج؟ وما الذي يزيد ثقة الاستنتاج؟</td><td>احتمال كبير أن العينة من المشتبه به الثاني؛ وتزيد الثقة بفحص عدد أكبر من المواقع وتكرار التحليل ومنع تلوث العينات.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 98–100 وإكمال نشاط 3-2 وحل السؤالين 9 و10</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن استخدام البصمة الوراثية في إثبات النسب والتعرف على الهوية</p>"]}]},{"title":"التقنية الجينية والطب","sb":"ص 101–106","unit":"الوحدة 3: التقنية الجينية","periods":[{"axis":"البروتينات البشرية المعاد تركيبها: الإنسولين والعامل الثامن","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","التقنية الجينية والطب"],["الحصة","1 من 3"],["محور الحصة","البروتينات البشرية المعاد تركيبها: الإنسولين والعامل الثامن"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 101–102"],["دليل المعلم","ص 142–144"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح مزايا استخدام بروتينات الإنسان المعاد تركيبها في العلاج بمثالي الإنسولين والعامل الثامن\n2. يقارن بين مصادر الإنسولين والعامل الثامن قبل التقنية الجينية وبعدها\nمخرج تعليمي آخر: يبرر استخدام خلايا الهامستر لإنتاج العامل الثامن بدلًا من البكتيريا","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم التعاوني\n- التعلم المبني على حل المشكلات","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- صورة توضيحية","البروتين المعاد تركيبه، الإنسولين البشري، العامل الثامن، الهيموفيليا، خلايا الهامستر، أجهزة التخمير، العدوى المنقولة بالدم.","يسأل المعلم: «قبل ثمانينيات القرن الماضي كان مريض الهيموفيليا يتلقى العامل الثامن من دم المتبرعين؛ ما الخطر الذي كان يواجهه؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويستقبل الإجابات\nالطالب: يذكرون خطر العدوى مثل ‎HIV‎\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح إنتاج الإنسولين المعاد التركيب بالبكتيريا والعامل الثامن بخلايا الهامستر في أجهزة التخمير (نشاط تقنيات ‎DNA‎ معاد التركيب في الطب)\nالطالب: يكملون جدولًا: البروتين، الخلية المنتجة، المصدر القديم، المزايا\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يدير نقاشًا موجهًا: «لماذا تُستخدم خلايا ثدييات لبعض البروتينات؟»\nالطالب: يناقشون في مجموعات ويقدمون مبررات\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الخلايا المستخدمة لإنتاج العامل الثامن المعاد التركيب؟\n   الإجابة النموذجية: خلايا الكلية والمبيض في الهامستر.\n2) (المستوى المتوقع) السؤال: اذكر ميزتين للإنسولين المعاد التركيب.\n   الإجابة النموذجية: مطابق للإنسولين البشري فيقل خطر الحساسية، ويُنتج بكميات كبيرة وبتكلفة أقل.\n3) (المستوى المتقدم) السؤال: لماذا يُعد العامل الثامن المعاد التركيب أكثر أمانًا من المستخلص من الدم؟\n   الإجابة النموذجية: لأنه خالٍ من مخاطر العدوى المنقولة بالدم مثل فيروس نقص المناعة.","1) (مستوى الدعم) السؤال: ما المرض الذي يعالج بالعامل الثامن؟\n   الإجابة النموذجية: الهيموفيليا.\n2) (المستوى المتوقع) السؤال: من أين كان يُستخلص الإنسولين قبل التقنية الجينية؟\n   الإجابة النموذجية: من بنكرياس الأبقار والخنازير.\n3) (المستوى المتقدم) السؤال: اقترح سببًا لإنتاج بعض البروتينات البشرية في خلايا ثدييات لا بكتيريا.\n   الإجابة النموذجية: لأن خلايا الثدييات تجري تعديلات بعد الترجمة (كإضافة سكريات) لا تجريها البكتيريا، فيكون البروتين الناتج أقرب للبشري وفعالًا.","إرشاد للطالب: مراجعة ص 101–102 وإكمال جدول المقارنة\nإرشاد لولي الأمر: الحديث مع الابن عن أثر التقنية الجينية في تحسين حياة مرضى السكري والهيموفيليا"],"h":["<ol class=\"ol\"><li>يشرح مزايا استخدام بروتينات الإنسان المعاد تركيبها في العلاج بمثالي الإنسولين والعامل الثامن</li><li>يقارن بين مصادر الإنسولين والعامل الثامن قبل التقنية الجينية وبعدها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يبرر استخدام خلايا الهامستر لإنتاج العامل الثامن بدلًا من البكتيريا</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح مزايا استخدام بروتينات الإنسان المعاد تركيبها في العلاج بمثالي الإنسولين والعامل الثامن</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يقارن بين مصادر الإنسولين والعامل الثامن قبل التقنية الجينية وبعدها</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يبرر استخدام خلايا الهامستر لإنتاج العامل الثامن بدلًا من البكتيريا</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التعلم المبني على حل المشكلات</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">صورة توضيحية</span></div>","<p>البروتين المعاد تركيبه، الإنسولين البشري، العامل الثامن، الهيموفيليا، خلايا الهامستر، أجهزة التخمير، العدوى المنقولة بالدم.</p>","<p>يسأل المعلم: «قبل ثمانينيات القرن الماضي كان مريض الهيموفيليا يتلقى العامل الثامن من دم المتبرعين؛ ما الخطر الذي كان يواجهه؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويستقبل الإجابات</td><td>يذكرون خطر العدوى مثل ‎HIV‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح إنتاج الإنسولين المعاد التركيب بالبكتيريا والعامل الثامن بخلايا الهامستر في أجهزة التخمير (نشاط تقنيات ‎DNA‎ معاد التركيب في الطب)</td><td>يكملون جدولًا: البروتين، الخلية المنتجة، المصدر القديم، المزايا</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يدير نقاشًا موجهًا: «لماذا تُستخدم خلايا ثدييات لبعض البروتينات؟»</td><td>يناقشون في مجموعات ويقدمون مبررات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الخلايا المستخدمة لإنتاج العامل الثامن المعاد التركيب؟</td><td>خلايا الكلية والمبيض في الهامستر.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر ميزتين للإنسولين المعاد التركيب.</td><td>مطابق للإنسولين البشري فيقل خطر الحساسية، ويُنتج بكميات كبيرة وبتكلفة أقل.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يُعد العامل الثامن المعاد التركيب أكثر أمانًا من المستخلص من الدم؟</td><td>لأنه خالٍ من مخاطر العدوى المنقولة بالدم مثل فيروس نقص المناعة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المرض الذي يعالج بالعامل الثامن؟</td><td>الهيموفيليا.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>من أين كان يُستخلص الإنسولين قبل التقنية الجينية؟</td><td>من بنكرياس الأبقار والخنازير.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح سببًا لإنتاج بعض البروتينات البشرية في خلايا ثدييات لا بكتيريا.</td><td>لأن خلايا الثدييات تجري تعديلات بعد الترجمة (كإضافة سكريات) لا تجريها البكتيريا، فيكون البروتين الناتج أقرب للبشري وفعالًا.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 101–102 وإكمال جدول المقارنة</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن أثر التقنية الجينية في تحسين حياة مرضى السكري والهيموفيليا</p>"]},{"axis":"نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎ والفحص الجيني","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","التقنية الجينية والطب"],["الحصة","2 من 3"],["محور الحصة","نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎ والفحص الجيني"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 102–104"],["دليل المعلم","ص 142–144"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎\n2. يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض\nمخرج تعليمي آخر: يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تقييم","- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- المناقشة الصفية","- الكتاب\n- السبورة الذكية\n- جهاز عرض البيانات\n- الوسائل الاجتماعية","نقص المناعة المشترك الشديد ‎(SCID)‎، الجين ‎ADA‎، إنزيم أدينوسين دي أمينيز، الفحص الجيني، الحامل للأليل، القضايا الأخلاقية.","يقدم المعلم قصة «طفل الفقاعة» الذي عاش في بيئة معقمة بسبب نقص المناعة، ويسأل: «كيف يمكن لإنزيم واحد أن يحرم الجسم من مناعته؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض القصة ويطرح السؤال\nالطالب: يربطون الإنزيم بالخلايا المناعية\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح طفرة جين ‎ADA‎ على الكروموسوم 20 وأثرها، وطرق العلاج بالإنزيم المعاد التركيب، ثم الفحص الجيني\nالطالب: يلخصون في مخطط: طفرة ← نقص إنزيم ← تراكم مواد سامة ← موت الخلايا اللمفية\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يدير مناقشة صفية حول حالة افتراضية لفحص جيني (حق المعرفة، الخصوصية، القرارات)\nالطالب: يناقشون في مجموعات ويقدمون آراء مبررة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: على أي كروموسوم يقع جين ‎ADA‎؟\n   الإجابة النموذجية: الكروموسوم 20.\n2) (المستوى المتوقع) السؤال: ما أثر نقص إنزيم ‎ADA‎ على الجهاز المناعي؟\n   الإجابة النموذجية: تتراكم مواد سامة للخلايا اللمفية فتموت ويضعف الجهاز المناعي بشدة.\n3) (المستوى المتقدم) السؤال: ما الفحص الجيني؟\n   الإجابة النموذجية: تحليل ‎DNA‎ الفرد للكشف عن وجود أليلات مرتبطة بأمراض وراثية.","1) (مستوى الدعم) السؤال: اذكر فائدة للفحص الجيني للأزواج قبل الإنجاب.\n   الإجابة النموذجية: معرفة إن كانا حاملين لأليل متنحٍ لمرض وراثي، وحساب احتمال إصابة أبنائهما.\n2) (المستوى المتوقع) السؤال: لماذا لا يُعد علاج المصاب بإعطائه الإنزيم المعاد التركيب شفاء دائمًا؟\n   الإجابة النموذجية: لأن الجين الطافر يبقى في خلاياه، فيحتاج إلى جرعات منتظمة طوال حياته.\n3) (المستوى المتقدم) السؤال: ناقش قضية أخلاقية واحدة يثيرها الفحص الجيني مع رأي مبرر.\n   الإجابة النموذجية: مثال: خصوصية النتائج؛ يجب ألا تُستخدم نتائج الفحص ضد الفرد في العمل أو التأمين، لأنها معلومات صحية شخصية لا اختيار له فيها.","إرشاد للطالب: مراجعة ص 102–104 وكتابة رأي مبرر في قضية أخلاقية\nإرشاد لولي الأمر: مناقشة الابن في أهمية الفحص الطبي قبل الزواج المعمول به في سلطنة عمان"],"h":["<ol class=\"ol\"><li>يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎</li><li>يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح كيف تُستخدم التقنية الجينية في علاج نقص إنزيم أدينوسين دي أمينيز ‎(ADA)‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف استخدامات الفحص الجيني في الكشف عن الأليلات المسببة للأمراض</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يناقش القضايا الأخلاقية المرتبطة بالفحص الجيني ونتائجه</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">المناقشة الصفية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">جهاز عرض البيانات</span><span class=\"chip r\">الوسائل الاجتماعية</span></div>","<p>نقص المناعة المشترك الشديد ‎(SCID)‎، الجين ‎ADA‎، إنزيم أدينوسين دي أمينيز، الفحص الجيني، الحامل للأليل، القضايا الأخلاقية.</p>","<p>يقدم المعلم قصة «طفل الفقاعة» الذي عاش في بيئة معقمة بسبب نقص المناعة، ويسأل: «كيف يمكن لإنزيم واحد أن يحرم الجسم من مناعته؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض القصة ويطرح السؤال</td><td>يربطون الإنزيم بالخلايا المناعية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح طفرة جين ‎ADA‎ على الكروموسوم 20 وأثرها، وطرق العلاج بالإنزيم المعاد التركيب، ثم الفحص الجيني</td><td>يلخصون في مخطط: طفرة ← نقص إنزيم ← تراكم مواد سامة ← موت الخلايا اللمفية</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يدير مناقشة صفية حول حالة افتراضية لفحص جيني (حق المعرفة، الخصوصية، القرارات)</td><td>يناقشون في مجموعات ويقدمون آراء مبررة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>على أي كروموسوم يقع جين ‎ADA‎؟</td><td>الكروموسوم 20.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما أثر نقص إنزيم ‎ADA‎ على الجهاز المناعي؟</td><td>تتراكم مواد سامة للخلايا اللمفية فتموت ويضعف الجهاز المناعي بشدة.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما الفحص الجيني؟</td><td>تحليل ‎DNA‎ الفرد للكشف عن وجود أليلات مرتبطة بأمراض وراثية.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر فائدة للفحص الجيني للأزواج قبل الإنجاب.</td><td>معرفة إن كانا حاملين لأليل متنحٍ لمرض وراثي، وحساب احتمال إصابة أبنائهما.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يُعد علاج المصاب بإعطائه الإنزيم المعاد التركيب شفاء دائمًا؟</td><td>لأن الجين الطافر يبقى في خلاياه، فيحتاج إلى جرعات منتظمة طوال حياته.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ناقش قضية أخلاقية واحدة يثيرها الفحص الجيني مع رأي مبرر.</td><td>مثال: خصوصية النتائج؛ يجب ألا تُستخدم نتائج الفحص ضد الفرد في العمل أو التأمين، لأنها معلومات صحية شخصية لا اختيار له فيها.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 102–104 وكتابة رأي مبرر في قضية أخلاقية</p><p><b>إرشاد لولي الأمر:</b> مناقشة الابن في أهمية الفحص الطبي قبل الزواج المعمول به في سلطنة عمان</p>"]},{"axis":"الفحص الجنيني غير الجراحي وإنتاج ملصق توعوي","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","التقنية الجينية والطب"],["الحصة","3 من 3"],["محور الحصة","الفحص الجنيني غير الجراحي وإنتاج ملصق توعوي"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 104–106"],["دليل المعلم","ص 142–144"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف الفحص الجنيني غير الجراحي قبل الولادة ويقارنه بفحص السائل الأمنيوسي وعينة الخملات المشيمية\n2. يصمم ملصقًا توعويًا عن تطبيق طبي للتقنية الجينية\nمخرج تعليمي آخر: يحل السؤالين 11 و12 في كتاب الطالب","المخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج الآخر: تطبيق","- التعلم المبني على المشاريع\n- التعلم التعاوني","- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أوراق ملصقات وأقلام ملونة","الفحص الجنيني غير الجراحي، ‎DNA‎ الجنين في دم الأم، فحص السائل الأمنيوسي، عينة الخملات المشيمية، متلازمة داون، التليف الكيسي.","يسأل المعلم: «كيف يمكن فحص جينات جنين دون إدخال إبرة إلى الرحم؟» ثم يلمح إلى أن أجزاء من ‎DNA‎ المشيمة تصل إلى دم الأم.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويستقبل الأفكار\nالطالب: يقترحون فحص دم الأم\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يشرح الفحص الجنيني غير الجراحي بالشكل 3-11 وأمثلة الاختلالات التي يكشفها\nالطالب: يقارنون بينه وبين الفحوص الجراحية في جدول\n3) (17 دقيقة: من الدقيقة 15 إلى 32)\nالمعلم: يوجه إنتاج ملصق توعوي في مجموعات (نشاط دليل المعلم) عن تطبيق طبي (إنسولين، عامل ثامن، ‎ADA‎، فحص جيني)\nالطالب: يصممون الملصق ويعرضونه في معرض سريع\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على التقنية الجينية والطب\nالطالب: يتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: من أين تُستخلص عينة ‎DNA‎ الجنين في الفحص غير الجراحي؟\n   الإجابة النموذجية: من دم الأم، حيث تنتقل إليه أجزاء من ‎DNA‎ خلايا المشيمة.\n2) (المستوى المتوقع) السؤال: ما ميزة الفحص غير الجراحي على فحص السائل الأمنيوسي؟\n   الإجابة النموذجية: لا يتطلب إدخال إبرة إلى الرحم فلا يعرض الجنين لخطر الإجهاض.\n3) (المستوى المتقدم) السؤال: اذكر مثالًا لاختلال في عدد الكروموسومات يكشفه الفحص.\n   الإجابة النموذجية: متلازمة داون (كروموسوم 21 إضافي).","1) (مستوى الدعم) السؤال: ما المقصود بعينة الخملات المشيمية؟\n   الإجابة النموذجية: أخذ عينة من نسيج المشيمة لتحليل ‎DNA‎ الجنين، وهو فحص جراحي.\n2) (المستوى المتوقع) السؤال: اذكر نوعين من الاختلالات يكشفها تحليل ‎DNA‎ الجنين.\n   الإجابة النموذجية: تغير عدد الكروموسومات (متلازمة داون)، وطفرات الجين المفرد (التليف الكيسي).\n3) (المستوى المتقدم) السؤال: قيّم ملصق زميلك وفق معيارين: الدقة العلمية والوضوح.\n   الإجابة النموذجية: تقييم يتضمن ملاحظة على صحة المعلومة واستخدام المصطلح، وملاحظة على تنظيم العرض ووضوح الرسالة مع اقتراح تحسين.","إرشاد للطالب: إكمال الملصق التوعوي وحل السؤالين 11 و12 ومراجعة ص 101–106\nإرشاد لولي الأمر: يمكن للأسرة مناقشة الملصق مع الابن وتشجيعه على عرضه في الإذاعة المدرسية"],"h":["<ol class=\"ol\"><li>يصف الفحص الجنيني غير الجراحي قبل الولادة ويقارنه بفحص السائل الأمنيوسي وعينة الخملات المشيمية</li><li>يصمم ملصقًا توعويًا عن تطبيق طبي للتقنية الجينية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحل السؤالين 11 و12 في كتاب الطالب</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف الفحص الجنيني غير الجراحي قبل الولادة ويقارنه بفحص السائل الأمنيوسي وعينة الخملات المشيمية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصمم ملصقًا توعويًا عن تطبيق طبي للتقنية الجينية</td><td class=\"lv\">إبداع</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحل السؤالين 11 و12 في كتاب الطالب</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على المشاريع</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">الوسائل الاجتماعية</span><span class=\"chip r\">أخرى: أوراق ملصقات وأقلام ملونة</span></div>","<p>الفحص الجنيني غير الجراحي، ‎DNA‎ الجنين في دم الأم، فحص السائل الأمنيوسي، عينة الخملات المشيمية، متلازمة داون، التليف الكيسي.</p>","<p>يسأل المعلم: «كيف يمكن فحص جينات جنين دون إدخال إبرة إلى الرحم؟» ثم يلمح إلى أن أجزاء من ‎DNA‎ المشيمة تصل إلى دم الأم.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويستقبل الأفكار</td><td>يقترحون فحص دم الأم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يشرح الفحص الجنيني غير الجراحي بالشكل 3-11 وأمثلة الاختلالات التي يكشفها</td><td>يقارنون بينه وبين الفحوص الجراحية في جدول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–32</span><br><small>17 دقيقة</small></td><td>يوجه إنتاج ملصق توعوي في مجموعات (نشاط دليل المعلم) عن تطبيق طبي (إنسولين، عامل ثامن، ‎ADA‎، فحص جيني)</td><td>يصممون الملصق ويعرضونه في معرض سريع</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يختم بمسابقة المجموعات على التقنية الجينية والطب</td><td>يتنافسون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>من أين تُستخلص عينة ‎DNA‎ الجنين في الفحص غير الجراحي؟</td><td>من دم الأم، حيث تنتقل إليه أجزاء من ‎DNA‎ خلايا المشيمة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما ميزة الفحص غير الجراحي على فحص السائل الأمنيوسي؟</td><td>لا يتطلب إدخال إبرة إلى الرحم فلا يعرض الجنين لخطر الإجهاض.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر مثالًا لاختلال في عدد الكروموسومات يكشفه الفحص.</td><td>متلازمة داون (كروموسوم 21 إضافي).</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بعينة الخملات المشيمية؟</td><td>أخذ عينة من نسيج المشيمة لتحليل ‎DNA‎ الجنين، وهو فحص جراحي.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اذكر نوعين من الاختلالات يكشفها تحليل ‎DNA‎ الجنين.</td><td>تغير عدد الكروموسومات (متلازمة داون)، وطفرات الجين المفرد (التليف الكيسي).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم ملصق زميلك وفق معيارين: الدقة العلمية والوضوح.</td><td>تقييم يتضمن ملاحظة على صحة المعلومة واستخدام المصطلح، وملاحظة على تنظيم العرض ووضوح الرسالة مع اقتراح تحسين.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال الملصق التوعوي وحل السؤالين 11 و12 ومراجعة ص 101–106</p><p><b>إرشاد لولي الأمر:</b> يمكن للأسرة مناقشة الملصق مع الابن وتشجيعه على عرضه في الإذاعة المدرسية</p>"]}]},{"title":"التقنية الجينية والزراعة","sb":"ص 107–121","unit":"الوحدة 3: التقنية الجينية","periods":[{"axis":"المحاصيل المقاومة لمبيدات الأعشاب والآفات الحشرية ‎(Bt)‎","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","التقنية الجينية والزراعة"],["الحصة","1 من 2"],["محور الحصة","المحاصيل المقاومة لمبيدات الأعشاب والآفات الحشرية ‎(Bt)‎"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 107–109"],["دليل المعلم","ص 145–147"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يشرح كيف تساعد الهندسة الجينية في حل مشكلة الطلب العالمي على الغذاء بتحسين جودة المحاصيل وإنتاجيتها\n2. يصف المحاصيل المقاومة لمبيدات الأعشاب والمحاصيل المقاومة للحشرات ‎(Bt)‎ ومزاياها\nمخرج تعليمي آخر: يلخص المخاطر المحتملة لزراعة المحاصيل المعدلة جينيًا ويقترح طرقًا للحد منها","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تقييم","- التعلم التشاركي\n- التعلم المبني على حل المشكلات\n- المناقشة الصفية","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","المحاصيل المعدلة جينيًا، مقاومة مبيدات الأعشاب، العصوية التورنجية ‎(Bt)‎، سم ‎Bt‎، الآفات الحشرية، الإنتاجية.","يعرض المعلم صورة حقل ذرة مقاوم لمبيدات الأعشاب بعد الرش (الصورة 3-10) ويسأل: «كيف ماتت الأعشاب وبقيت الذرة سليمة؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون وجود جين مقاومة في الذرة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح المحاصيل المقاومة لمبيدات الأعشاب (فول الصويا) والمحاصيل ‎Bt (‎القطن، الذرة) ويذكر قانون المبيدات في سلطنة عمان 2006\nالطالب: يكملون جدول: المحصول، الجين المنقول، الفائدة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يدير مناقشة صفية (نشاط دليل المعلم) حول المزايا والمخاطر\nالطالب: يحلون السؤالين 13 و14 في مجموعات ويقترحون خطوات للحد من المخاطر\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما مصدر جين سم ‎Bt‎؟\n   الإجابة النموذجية: بكتيريوم العصوية التورنجية ‎Bacillus thuringiensis‎.\n2) (المستوى المتوقع) السؤال: ما فائدة المحاصيل المقاومة لمبيدات الأعشاب للمزارع؟\n   الإجابة النموذجية: يمكنه رش المبيد لقتل الأعشاب المنافسة دون أن يتأثر المحصول فتزيد الإنتاجية.\n3) (المستوى المتقدم) السؤال: اذكر خطرًا محتملًا لزراعة محاصيل ‎Bt‎.\n   الإجابة النموذجية: قد تنشأ حشرات مقاومة للسم، أو قد يتأثر بعض الحشرات غير المستهدفة.","1) (مستوى الدعم) السؤال: لماذا تتنافس الأعشاب الضارة مع المحاصيل؟\n   الإجابة النموذجية: لأنها تشاركها في الأرض والضوء والماء والمواد الغذائية في التربة.\n2) (المستوى المتوقع) السؤال: اشرح مزايا زراعة أصناف ‎Bt‎.\n   الإجابة النموذجية: تقتل الآفات الحشرية التي تتغذى عليها فتقل الخسائر ويقل رش المبيدات الحشرية وتكلفته.\n3) (المستوى المتقدم) السؤال: اقترح خطوتين للحد من مخاطر المحاصيل المعدلة جينيًا.\n   الإجابة النموذجية: زراعة مناطق عازلة من محاصيل غير معدلة لتأخير ظهور المقاومة، ووضع تشريعات ورقابة على زراعتها وتداولها.","إرشاد للطالب: مراجعة ص 107–109 وحل السؤالين 13 و14\nإرشاد لولي الأمر: الحديث مع الابن عن تنظيم سلطنة عمان لتداول المبيدات وأهمية الزراعة الآمنة"],"h":["<ol class=\"ol\"><li>يشرح كيف تساعد الهندسة الجينية في حل مشكلة الطلب العالمي على الغذاء بتحسين جودة المحاصيل وإنتاجيتها</li><li>يصف المحاصيل المقاومة لمبيدات الأعشاب والمحاصيل المقاومة للحشرات ‎(Bt)‎ ومزاياها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يلخص المخاطر المحتملة لزراعة المحاصيل المعدلة جينيًا ويقترح طرقًا للحد منها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح كيف تساعد الهندسة الجينية في حل مشكلة الطلب العالمي على الغذاء بتحسين جودة المحاصيل وإنتاجيتها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يصف المحاصيل المقاومة لمبيدات الأعشاب والمحاصيل المقاومة للحشرات ‎(Bt)‎ ومزاياها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يلخص المخاطر المحتملة لزراعة المحاصيل المعدلة جينيًا ويقترح طرقًا للحد منها</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم التشاركي</span><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">المناقشة الصفية</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>المحاصيل المعدلة جينيًا، مقاومة مبيدات الأعشاب، العصوية التورنجية ‎(Bt)‎، سم ‎Bt‎، الآفات الحشرية، الإنتاجية.</p>","<p>يعرض المعلم صورة حقل ذرة مقاوم لمبيدات الأعشاب بعد الرش (الصورة 3-10) ويسأل: «كيف ماتت الأعشاب وبقيت الذرة سليمة؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورة ويطرح السؤال</td><td>يقترحون وجود جين مقاومة في الذرة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح المحاصيل المقاومة لمبيدات الأعشاب (فول الصويا) والمحاصيل ‎Bt (‎القطن، الذرة) ويذكر قانون المبيدات في سلطنة عمان 2006</td><td>يكملون جدول: المحصول، الجين المنقول، الفائدة</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يدير مناقشة صفية (نشاط دليل المعلم) حول المزايا والمخاطر</td><td>يحلون السؤالين 13 و14 في مجموعات ويقترحون خطوات للحد من المخاطر</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما مصدر جين سم ‎Bt‎؟</td><td>بكتيريوم العصوية التورنجية ‎Bacillus thuringiensis‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما فائدة المحاصيل المقاومة لمبيدات الأعشاب للمزارع؟</td><td>يمكنه رش المبيد لقتل الأعشاب المنافسة دون أن يتأثر المحصول فتزيد الإنتاجية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اذكر خطرًا محتملًا لزراعة محاصيل ‎Bt‎.</td><td>قد تنشأ حشرات مقاومة للسم، أو قد يتأثر بعض الحشرات غير المستهدفة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا تتنافس الأعشاب الضارة مع المحاصيل؟</td><td>لأنها تشاركها في الأرض والضوء والماء والمواد الغذائية في التربة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اشرح مزايا زراعة أصناف ‎Bt‎.</td><td>تقتل الآفات الحشرية التي تتغذى عليها فتقل الخسائر ويقل رش المبيدات الحشرية وتكلفته.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اقترح خطوتين للحد من مخاطر المحاصيل المعدلة جينيًا.</td><td>زراعة مناطق عازلة من محاصيل غير معدلة لتأخير ظهور المقاومة، ووضع تشريعات ورقابة على زراعتها وتداولها.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 107–109 وحل السؤالين 13 و14</p><p><b>إرشاد لولي الأمر:</b> الحديث مع الابن عن تنظيم سلطنة عمان لتداول المبيدات وأهمية الزراعة الآمنة</p>"]},{"axis":"الحيوانات المعدلة جينيًا ومراجعة الوحدة الثالثة","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 3: التقنية الجينية"],["الدرس","التقنية الجينية والزراعة"],["الحصة","2 من 2"],["محور الحصة","الحيوانات المعدلة جينيًا ومراجعة الوحدة الثالثة"],["الأسبوع والتاريخ","الأسبوع العاشر (8–12/11/2026)"],["كتاب الطالب","ص 109–121"],["دليل المعلم","ص 145–147"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء\n2. يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها\nمخرج تعليمي آخر: يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تقييم","- التعلم الذاتي\n- التعلم المبني على اللعب","- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎","الحيوانات المعدلة جينيًا، السلمون الأطلسي المعدل، هرمون النمو، ملخص الوحدة، أسئلة نهاية الوحدة.","يعرض المعلم صورتين لسمكتي سلمون بالعمر نفسه وأحجام مختلفة ويسأل: «ما الذي جعل إحداهما تنمو أسرع؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورتين ويستقبل التفسيرات\nالطالب: يقترحون جينًا لهرمون النمو\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يشرح السلمون المعدل جينيًا وسبب ندرة الحيوانات المعدلة لإنتاج الغذاء مقارنة بالنباتات\nالطالب: يدونون الفائدة والمخاوف\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوزع أسئلة نهاية الوحدة (ص 113–121) على المجموعات\nالطالب: يحلون ويعرضون الحلول\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي\nالطالب: يتنافسون ثم يقيّمون أنفسهم\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الصفة التي حُسنت في السلمون الأطلسي المعدل جينيًا؟\n   الإجابة النموذجية: سرعة النمو.\n2) (المستوى المتوقع) السؤال: لماذا تُعد الحيوانات المعدلة لإنتاج الغذاء أقل انتشارًا من النباتات؟\n   الإجابة النموذجية: بسبب صعوبة التقنية وتكلفتها والمخاوف الأخلاقية والبيئية كهروبها واختلاطها بالمجموعات البرية.\n3) (المستوى المتقدم) السؤال: اربط بين ‎PCR‎ والهندسة الجينية.\n   الإجابة النموذجية: يُستخدم ‎PCR‎ لتضخيم الجين المطلوب قبل إدخاله في الناقل أو للتأكد من وجوده في الكائن المعدل.","1) (مستوى الدعم) السؤال: اذكر خطرًا بيئيًا لهروب سمك سلمون معدل إلى البيئة.\n   الإجابة النموذجية: قد ينافس الأسماك البرية على الغذاء أو يتزاوج معها فينقل الجين إلى المجموعات البرية.\n2) (المستوى المتوقع) السؤال: رتب أدوات إنتاج بكتيريا تنتج إنسولينًا: ترانسكريبتيز العكسي، البلازميد، إنزيم القطع، ‎DNA‎ ليجيز.\n   الإجابة النموذجية: ترانسكريبتيز العكسي ‎(cDNA) ←‎ إنزيم القطع (قطع البلازميد ونهايات الجين) ← ‎DNA‎ ليجيز (الربط) ← البلازميد يُدخل في البكتيريا.\n3) (المستوى المتقدم) السؤال: قيّم: «التقنية الجينية مفيدة في الطب لكنها لا مكان لها في الزراعة».\n   الإجابة النموذجية: رأي غير متوازن؛ فالزراعة تستفيد بزيادة الإنتاج وتقليل المبيدات، مع ضرورة إدارة المخاطر بالتشريعات والرقابة.","إرشاد للطالب: مراجعة ملخص الوحدة ص 112 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي\nإرشاد لولي الأمر: الاطلاع مع الابن على نتائج تقويمه الذاتي وتحديد موضوع يحتاج إلى مراجعة"],"h":["<ol class=\"ol\"><li>يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء</li><li>يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يصف مثال سمك السلمون الأطلسي المعدل جينيًا وفائدته في إنتاج الغذاء</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل أسئلة نهاية الوحدة الثالثة في أدوات التقنية الجينية وتطبيقاتها</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم تعلمه في الوحدة الثالثة بقائمة التقويم الذاتي</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم الذاتي</span><span class=\"chip\">التعلم المبني على اللعب</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">برمجيات / تطبيقات مثل ‎Edpuzzle, Padlet, Kahoot‎</span></div>","<p>الحيوانات المعدلة جينيًا، السلمون الأطلسي المعدل، هرمون النمو، ملخص الوحدة، أسئلة نهاية الوحدة.</p>","<p>يعرض المعلم صورتين لسمكتي سلمون بالعمر نفسه وأحجام مختلفة ويسأل: «ما الذي جعل إحداهما تنمو أسرع؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصورتين ويستقبل التفسيرات</td><td>يقترحون جينًا لهرمون النمو</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يشرح السلمون المعدل جينيًا وسبب ندرة الحيوانات المعدلة لإنتاج الغذاء مقارنة بالنباتات</td><td>يدونون الفائدة والمخاوف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–30</span><br><small>15 دقيقة</small></td><td>يوزع أسئلة نهاية الوحدة (ص 113–121) على المجموعات</td><td>يحلون ويعرضون الحلول</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات لمراجعة الوحدة الثالثة وقائمة التقويم الذاتي</td><td>يتنافسون ثم يقيّمون أنفسهم</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الصفة التي حُسنت في السلمون الأطلسي المعدل جينيًا؟</td><td>سرعة النمو.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا تُعد الحيوانات المعدلة لإنتاج الغذاء أقل انتشارًا من النباتات؟</td><td>بسبب صعوبة التقنية وتكلفتها والمخاوف الأخلاقية والبيئية كهروبها واختلاطها بالمجموعات البرية.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اربط بين ‎PCR‎ والهندسة الجينية.</td><td>يُستخدم ‎PCR‎ لتضخيم الجين المطلوب قبل إدخاله في الناقل أو للتأكد من وجوده في الكائن المعدل.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اذكر خطرًا بيئيًا لهروب سمك سلمون معدل إلى البيئة.</td><td>قد ينافس الأسماك البرية على الغذاء أو يتزاوج معها فينقل الجين إلى المجموعات البرية.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>رتب أدوات إنتاج بكتيريا تنتج إنسولينًا: ترانسكريبتيز العكسي، البلازميد، إنزيم القطع، ‎DNA‎ ليجيز.</td><td>ترانسكريبتيز العكسي ‎(cDNA) ←‎ إنزيم القطع (قطع البلازميد ونهايات الجين) ← ‎DNA‎ ليجيز (الربط) ← البلازميد يُدخل في البكتيريا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>قيّم: «التقنية الجينية مفيدة في الطب لكنها لا مكان لها في الزراعة».</td><td>رأي غير متوازن؛ فالزراعة تستفيد بزيادة الإنتاج وتقليل المبيدات، مع ضرورة إدارة المخاطر بالتشريعات والرقابة.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ملخص الوحدة ص 112 وإكمال أسئلة نهاية الوحدة وقائمة التقويم الذاتي</p><p><b>إرشاد لولي الأمر:</b> الاطلاع مع الابن على نتائج تقويمه الذاتي وتحديد موضوع يحتاج إلى مراجعة</p>"]}]},{"title":"الاتزان الداخلي","sb":"ص 122–124","unit":"الوحدة 4: الاتزان الداخلي","periods":[{"axis":"مبادئ الاتزان الداخلي والتغذية الراجعة السلبية واليوريا","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 4: الاتزان الداخلي"],["الدرس","الاتزان الداخلي"],["الحصة","1 من 1"],["محور الحصة","مبادئ الاتزان الداخلي والتغذية الراجعة السلبية واليوريا"],["الأسبوع والتاريخ","الأسبوع الحادي عشر (15–19/11/2026)"],["كتاب الطالب","ص 122–124"],["دليل المعلم","ص 163–166"],["كتاب التجارب العملية والأنشطة","—"]],"t":["1. يعرّف الاتزان الداخلي ويذكر أهميته في الثدييات\n2. يذكر مبادئ الاتزان الداخلي: المنبهات، والمستقبلات، وأجهزة التنسيق، والمستجيبات، والتغذية الراجعة السلبية\nمخرج تعليمي آخر: يذكر أن اليوريا تُنتج في الكبد بنزع مجموعة الأمين من الأحماض الأمينية الزائدة","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تذكر","- التعلم بالاكتشاف\n- التعلم التعاوني\n- التوصل إلى تعريف","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","الاتزان الداخلي، البيئة الداخلية، المنبه، المستقبل، المستجيب، التغذية الراجعة السلبية، المنظمات الحرارية، نزع مجموعة الأمين، اليوريا.","يعرض المعلم صورة الدب الأسود في سباته العميق (العلوم ضمن سياقها) ويسأل: «كيف تبقى درجة حرارة جسمه وبيئته الداخلية مناسبة شهورًا دون طعام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصورة ويطرح السؤال\nالطالب: يقترحون آليات للحفاظ على البيئة الداخلية\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يقود نشاط «التوصل إلى تعريف» للاتزان الداخلي ثم يشرح مكونات نظام التحكم بالشكل 4-1\nالطالب: يصيغون تعريفًا جماعيًا ويرسمون حلقة التغذية الراجعة السلبية\n3) (13 دقيقة: من الدقيقة 15 إلى 28)\nالمعلم: يقدم نشاط «المنظمات الحرارية» ثم يشرح إنتاج اليوريا في الكبد\nالطالب: يطبقون الحلقة على تنظيم الحرارة ويكتبون معادلة لفظية لنزع مجموعة الأمين\n4) (12 دقيقة: من الدقيقة 28 إلى 40)\nالمعلم: يوجه حل السؤالين 1 و2 ثم يختم بمسابقة المجموعات\nالطالب: يحلون السؤالين ويتنافسون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: عرّف الاتزان الداخلي.\n   الإجابة النموذجية: الحفاظ على بيئة داخلية ثابتة نسبيًا في الجسم رغم التغيرات في البيئة الخارجية والداخلية.\n2) (المستوى المتوقع) السؤال: ما دور المستجيب في نظام التحكم؟\n   الإجابة النموذجية: تنفيذ الاستجابة التي تعيد العامل المتغير إلى قيمته الطبيعية.\n3) (المستوى المتقدم) السؤال: لماذا تُسمى التغذية الراجعة «سلبية»؟\n   الإجابة النموذجية: لأن الاستجابة تعاكس اتجاه التغير فتعيد العامل إلى نقطة الضبط.","1) (مستوى الدعم) السؤال: أين تُنتج اليوريا؟\n   الإجابة النموذجية: في الكبد.\n2) (المستوى المتوقع) السؤال: رتب مكونات نظام التحكم: مستجيب، منبه، مستقبل، جهاز تنسيق، استجابة.\n   الإجابة النموذجية: منبه ← مستقبل ← جهاز تنسيق ← مستجيب ← استجابة.\n3) (المستوى المتقدم) السؤال: لماذا لا يستطيع الجسم تخزين الأحماض الأمينية الزائدة كما هي؟ وماذا يحدث لها؟\n   الإجابة النموذجية: لا توجد مخازن لها، فتُنزع مجموعة الأمين منها في الكبد وتتحول إلى أمونيا ثم إلى يوريا تُطرح، ويُستخدم الجزء المتبقي في التنفس أو يُخزن.","إرشاد للطالب: مراجعة ص 122–124 وحل السؤالين 1 و2\nإرشاد لولي الأمر: الحديث مع الابن عن أمثلة يومية للاتزان الداخلي مثل التعرق في الصيف العُماني"],"h":["<ol class=\"ol\"><li>يعرّف الاتزان الداخلي ويذكر أهميته في الثدييات</li><li>يذكر مبادئ الاتزان الداخلي: المنبهات، والمستقبلات، وأجهزة التنسيق، والمستجيبات، والتغذية الراجعة السلبية</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يذكر أن اليوريا تُنتج في الكبد بنزع مجموعة الأمين من الأحماض الأمينية الزائدة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف الاتزان الداخلي ويذكر أهميته في الثدييات</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يذكر مبادئ الاتزان الداخلي: المنبهات، والمستقبلات، وأجهزة التنسيق، والمستجيبات، والتغذية الراجعة السلبية</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يذكر أن اليوريا تُنتج في الكبد بنزع مجموعة الأمين من الأحماض الأمينية الزائدة</td><td class=\"lv\">تذكر</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالاكتشاف</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">التوصل إلى تعريف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الاتزان الداخلي، البيئة الداخلية، المنبه، المستقبل، المستجيب، التغذية الراجعة السلبية، المنظمات الحرارية، نزع مجموعة الأمين، اليوريا.</p>","<p>يعرض المعلم صورة الدب الأسود في سباته العميق (العلوم ضمن سياقها) ويسأل: «كيف تبقى درجة حرارة جسمه وبيئته الداخلية مناسبة شهورًا دون طعام؟» وينفّذ مهام «قبل أن تبدأ بدراسة الوحدة».</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th>
