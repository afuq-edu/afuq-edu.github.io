حددة.</td></tr></table>","<p><b>إرشاد للطالب:</b> كتابة تقرير الاستقصاء العملي 2-1 مع الرسوم ومراجعة ص 48–50</p><p><b>إرشاد لولي الأمر:</b> التأكد من إكمال الابن رسومه وتحديد أسماء الأطوار عليها</p>"]}]},{"title":"كيف يحدث التباين الجيني؟","sb":"ص 51–54","unit":"الوحدة 2: الوراثة","periods":[{"axis":"مصادر التباين: العبور والاصطفاف العشوائي والإخصاب العشوائي","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","كيف يحدث التباين الجيني؟"],["الحصة","1 من 1"],["محور الحصة","مصادر التباين: العبور والاصطفاف العشوائي والإخصاب العشوائي"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 51–54"],["دليل المعلم","ص 84–87"],["كتاب التجارب العملية والأنشطة","نشاط 2-1: وصف الانقسام الاختزالي ص 42"]],"t":["1. يشرح كيف يؤدي العبور بين الكروماتيدات غير الشقيقة إلى تكوين تراكيب جديدة من الأليلات\n2. يشرح أن الاصطفاف العشوائي للأزواج المتماثلة والاندماج العشوائي للأمشاج يؤديان إلى أفراد مختلفين جينيًا\nمخرج تعليمي آخر: يحسب عدد التراكيب الممكنة للأمشاج الناتجة عن الاصطفاف العشوائي (2ⁿ)","المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج كروموسومات ملونة، كتاب التجارب العملية والأنشطة","التباين الجيني، العبور، التصالب (الكيازما)، الكروماتيدات غير الشقيقة، الاصطفاف العشوائي (التوزيع الحر)، الإخصاب العشوائي.","يعرض المعلم صورة لإخوة أشقاء ويسأل: «من الأب نفسه والأم نفسها، فلماذا لا يتطابق الإخوة (عدا التوائم المتطابقة)؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يعرض الصورة ويستقبل التفسيرات\nالطالب: يقترحون مصادر الاختلاف\n2) (12 دقيقة: من الدقيقة 4 إلى 16)\nالمعلم: يشرح العبور والتصالب بالشكل 2-6 والاصطفاف العشوائي بالنماذج الملونة (نشاط توضيح الاصطفاف العشوائي)\nالطالب: يحسبون تراكيب الأمشاج لخلية فيها زوجان ثم ثلاثة أزواج\n3) (14 دقيقة: من الدقيقة 16 إلى 30)\nالمعلم: يوجه حل نشاط 2-1 «وصف الانقسام الاختزالي» (كتاب التجارب ص 42)\nالطالب: يصفون الأطوار ومصادر التباين كتابيًا في أزواج\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على مصادر التباين\nالطالب: يتنافسون ويراجعون الأخطاء\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: في أي طور يحدث العبور؟\n   الإجابة النموذجية: الطور التمهيدي الأول.\n2) (المستوى المتوقع) السؤال: كم تركيبًا مختلفًا من الأمشاج ينتج عن الاصطفاف العشوائي لخلية فيها 3 أزواج متماثلة؟\n   الإجابة النموذجية: ‎2³ = 8‎ تراكيب.\n3) (المستوى المتقدم) السؤال: لماذا يزيد الإخصاب العشوائي التباين؟\n   الإجابة النموذجية: لأن أي مشيج ذكري يمكن أن يندمج مع أي مشيج أنثوي، فتتضاعف التراكيب الممكنة.","1) (مستوى الدعم) السؤال: ما نقاط التصالب (الكيازما)؟\n   الإجابة النموذجية: مواقع تلامس الكروماتيدات غير الشقيقة التي يحدث عندها تبادل أجزاء منها أثناء العبور.\n2) (المستوى المتوقع) السؤال: اشرح كيف يؤدي العبور إلى تراكيب جديدة من الأليلات.\n   الإجابة النموذجية: تتبادل الكروماتيدات غير الشقيقة أجزاء تحمل أليلات، فتنتج كروماتيدات تحمل تراكيب أليلات لم تكن في كروموسومي الأبوين.\n3) (المستوى المتقدم) السؤال: احسب عدد تراكيب أمشاج الإنسان الممكنة من الاصطفاف العشوائي وحده، ثم بيّن لماذا يكون التباين الفعلي أكبر.\n   الإجابة النموذجية: ‎2²³ ≈ 8.4‎ مليون تركيب؛ ويكون التباين أكبر بسبب العبور والإخصاب العشوائي.","إرشاد للطالب: إكمال نشاط 2-1 ومراجعة ص 51–54\nإرشاد لولي الأمر: مناقشة الابن في أسباب الاختلاف بين الإخوة في الأسرة الواحدة"],"h":["<ol class=\"ol\"><li>يشرح كيف يؤدي العبور بين الكروماتيدات غير الشقيقة إلى تكوين تراكيب جديدة من الأليلات</li><li>يشرح أن الاصطفاف العشوائي للأزواج المتماثلة والاندماج العشوائي للأمشاج يؤديان إلى أفراد مختلفين جينيًا</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب عدد التراكيب الممكنة للأمشاج الناتجة عن الاصطفاف العشوائي (2ⁿ)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح كيف يؤدي العبور بين الكروماتيدات غير الشقيقة إلى تكوين تراكيب جديدة من الأليلات</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح أن الاصطفاف العشوائي للأزواج المتماثلة والاندماج العشوائي للأمشاج يؤديان إلى أفراد مختلفين جينيًا</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب عدد التراكيب الممكنة للأمشاج الناتجة عن الاصطفاف العشوائي (2ⁿ)</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">نماذج مجسمة</span><span class=\"chip r\">أخرى: نماذج كروموسومات ملونة، كتاب التجارب العملية والأنشطة</span></div>","<p>التباين الجيني، العبور، التصالب (الكيازما)، الكروماتيدات غير الشقيقة، الاصطفاف العشوائي (التوزيع الحر)، الإخصاب العشوائي.</p>","<p>يعرض المعلم صورة لإخوة أشقاء ويسأل: «من الأب نفسه والأم نفسها، فلماذا لا يتطابق الإخوة (عدا التوائم المتطابقة)؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يعرض الصورة ويستقبل التفسيرات</td><td>يقترحون مصادر الاختلاف</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–16</span><br><small>12 دقيقة</small></td><td>يشرح العبور والتصالب بالشكل 2-6 والاصطفاف العشوائي بالنماذج الملونة (نشاط توضيح الاصطفاف العشوائي)</td><td>يحسبون تراكيب الأمشاج لخلية فيها زوجان ثم ثلاثة أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">16–30</span><br><small>14 دقيقة</small></td><td>يوجه حل نشاط 2-1 «وصف الانقسام الاختزالي» (كتاب التجارب ص 42)</td><td>يصفون الأطوار ومصادر التباين كتابيًا في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات على مصادر التباين</td><td>يتنافسون ويراجعون الأخطاء</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>في أي طور يحدث العبور؟</td><td>الطور التمهيدي الأول.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>كم تركيبًا مختلفًا من الأمشاج ينتج عن الاصطفاف العشوائي لخلية فيها 3 أزواج متماثلة؟</td><td>‎2³ = 8‎ تراكيب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يزيد الإخصاب العشوائي التباين؟</td><td>لأن أي مشيج ذكري يمكن أن يندمج مع أي مشيج أنثوي، فتتضاعف التراكيب الممكنة.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نقاط التصالب (الكيازما)؟</td><td>مواقع تلامس الكروماتيدات غير الشقيقة التي يحدث عندها تبادل أجزاء منها أثناء العبور.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اشرح كيف يؤدي العبور إلى تراكيب جديدة من الأليلات.</td><td>تتبادل الكروماتيدات غير الشقيقة أجزاء تحمل أليلات، فتنتج كروماتيدات تحمل تراكيب أليلات لم تكن في كروموسومي الأبوين.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>احسب عدد تراكيب أمشاج الإنسان الممكنة من الاصطفاف العشوائي وحده، ثم بيّن لماذا يكون التباين الفعلي أكبر.</td><td>‎2²³ ≈ 8.4‎ مليون تركيب؛ ويكون التباين أكبر بسبب العبور والإخصاب العشوائي.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-1 ومراجعة ص 51–54</p><p><b>إرشاد لولي الأمر:</b> مناقشة الابن في أسباب الاختلاف بين الإخوة في الأسرة الواحدة</p>"]}]},{"title":"الوراثة","sb":"ص 55","unit":"الوحدة 2: الوراثة","periods":[{"axis":"مصطلحات علم الوراثة","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة"],["الحصة","1 من 1"],["محور الحصة","مصطلحات علم الوراثة"],["الأسبوع والتاريخ","الأسبوع الخامس (4–8/10/2026)"],["كتاب الطالب","ص 55"],["دليل المعلم","ص 88–90"],["كتاب التجارب العملية والأنشطة","نشاط 2-2: مصطلحات في علم الوراثة ص 44"]],"t":["1. يعرّف مصطلحات الوراثة: الأليل، السائد، المتنحي، السيادة المشتركة، متماثل الأليلات، متباين الأليلات\n2. يميز بين الطراز الجيني والطراز المظهري ويستخدم الرموز الصحيحة للأليلات\nمخرج تعليمي آخر: يطبق المصطلحات في وصف أمثلة وراثية من الحياة","المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم المبني على اللعب\n- التعلم التعاوني\n- الدوارة (الكاروسيل)","- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات مصطلحات، كتاب التجارب العملية والأنشطة","الأليل، السائد، المتنحي، السيادة المشتركة، متماثل الأليلات، متباين الأليلات، الطراز الجيني، الطراز المظهري.","يعرض المعلم صورًا لطلبة بخاصية ثني اللسان وعدمها ويسأل: «هل ما نراه هو الجينات نفسها؟ أم أثرها؟»","1) (4 دقائق: من الدقيقة 0 إلى 4)\nالمعلم: يعرض الأمثلة ويفرّق بين ما نراه وما نرثه\nالطالب: يقترحون الفرق بين الطراز الجيني والمظهري\n2) (14 دقيقة: من الدقيقة 4 إلى 18)\nالمعلم: ينظم نشاط «الدوارة (كاروسيل) المصطلحات العلمية الرئيسية» (دليل المعلم ص 90)\nالطالب: يتنقلون بين المحطات ويكتبون تعريفًا ومثالًا لكل مصطلح\n3) (12 دقيقة: من الدقيقة 18 إلى 30)\nالمعلم: يوجه حل نشاط 2-2 «مصطلحات في علم الوراثة» (كتاب التجارب ص 44)\nالطالب: يحلون النشاط في أزواج\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات على المصطلحات\nالطالب: يتنافسون ويراجعون المصطلحات التي أخطؤوا فيها\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما المقصود بالأليل المتنحي؟\n   الإجابة النموذجية: أليل لا يظهر أثره في الطراز المظهري إلا عند وجوده بنسختين (متماثل الأليلات).\n2) (المستوى المتوقع) السؤال: اكتب طرازين جينيين متماثلين وطرازًا متباينًا لجين رمزه ‎A‎.\n   الإجابة النموذجية: متماثلان: ‎AA‎ و‎aa‎؛ متباين: ‎Aa‎.\n3) (المستوى المتقدم) السؤال: ماذا يعني أن أليلين يُظهران سيادة مشتركة؟\n   الإجابة النموذجية: يظهر أثر الأليلين معًا في الطراز المظهري للفرد متباين الأليلات.","1) (مستوى الدعم) السؤال: عرّف الطراز المظهري.\n   الإجابة النموذجية: الصفات الظاهرة أو القابلة للقياس في الكائن الحي الناتجة عن تفاعل الطراز الجيني مع البيئة.\n2) (المستوى المتوقع) السؤال: لماذا يمكن أن يتشابه الطراز المظهري لفردين مختلفين في الطراز الجيني؟\n   الإجابة النموذجية: لأن الأليل السائد يظهر أثره في ‎AA‎ و‎Aa‎ معًا.\n3) (المستوى المتقدم) السؤال: صنّف: (فصيلة الدم ‎AB‎، لون البازلاء الأصفر ‎Yy‎، المهق ‎aa‎) حسب نمط الوراثة والطراز الجيني.\n   الإجابة النموذجية: ‎AB‎ سيادة مشتركة ومتباين الأليلات؛ ‎Yy‎ سيادة تامة ومتباين؛ ‎aa‎ متنحٍ متماثل الأليلات.","إرشاد للطالب: مراجعة ص 55 وإكمال نشاط 2-2 وإعداد بطاقات للمصطلحات\nإرشاد لولي الأمر: مساعدة الابن على تسميع المصطلحات باستخدام البطاقات"],"h":["<ol class=\"ol\"><li>يعرّف مصطلحات الوراثة: الأليل، السائد، المتنحي، السيادة المشتركة، متماثل الأليلات، متباين الأليلات</li><li>يميز بين الطراز الجيني والطراز المظهري ويستخدم الرموز الصحيحة للأليلات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يطبق المصطلحات في وصف أمثلة وراثية من الحياة</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يعرّف مصطلحات الوراثة: الأليل، السائد، المتنحي، السيادة المشتركة، متماثل الأليلات، متباين الأليلات</td><td class=\"lv\">تذكر</td></tr><tr><td class=\"c\">المخرج 2</td><td>يميز بين الطراز الجيني والطراز المظهري ويستخدم الرموز الصحيحة للأليلات</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يطبق المصطلحات في وصف أمثلة وراثية من الحياة</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على اللعب</span><span class=\"chip\">التعلم التعاوني</span><span class=\"chip\">الدوارة (الكاروسيل)</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">أخرى: بطاقات مصطلحات، كتاب التجارب العملية والأنشطة</span></div>","<p>الأليل، السائد، المتنحي، السيادة المشتركة، متماثل الأليلات، متباين الأليلات، الطراز الجيني، الطراز المظهري.</p>","<p>يعرض المعلم صورًا لطلبة بخاصية ثني اللسان وعدمها ويسأل: «هل ما نراه هو الجينات نفسها؟ أم أثرها؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–4</span><br><small>4 دقائق</small></td><td>يعرض الأمثلة ويفرّق بين ما نراه وما نرثه</td><td>يقترحون الفرق بين الطراز الجيني والمظهري</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">4–18</span><br><small>14 دقيقة</small></td><td>ينظم نشاط «الدوارة (كاروسيل) المصطلحات العلمية الرئيسية» (دليل المعلم ص 90)</td><td>يتنقلون بين المحطات ويكتبون تعريفًا ومثالًا لكل مصطلح</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–30</span><br><small>12 دقيقة</small></td><td>يوجه حل نشاط 2-2 «مصطلحات في علم الوراثة» (كتاب التجارب ص 44)</td><td>يحلون النشاط في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات على المصطلحات</td><td>يتنافسون ويراجعون المصطلحات التي أخطؤوا فيها</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بالأليل المتنحي؟</td><td>أليل لا يظهر أثره في الطراز المظهري إلا عند وجوده بنسختين (متماثل الأليلات).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب طرازين جينيين متماثلين وطرازًا متباينًا لجين رمزه ‎A‎.</td><td>متماثلان: ‎AA‎ و‎aa‎؛ متباين: ‎Aa‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ماذا يعني أن أليلين يُظهران سيادة مشتركة؟</td><td>يظهر أثر الأليلين معًا في الطراز المظهري للفرد متباين الأليلات.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>عرّف الطراز المظهري.</td><td>الصفات الظاهرة أو القابلة للقياس في الكائن الحي الناتجة عن تفاعل الطراز الجيني مع البيئة.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا يمكن أن يتشابه الطراز المظهري لفردين مختلفين في الطراز الجيني؟</td><td>لأن الأليل السائد يظهر أثره في ‎AA‎ و‎Aa‎ معًا.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>صنّف: (فصيلة الدم ‎AB‎، لون البازلاء الأصفر ‎Yy‎، المهق ‎aa‎) حسب نمط الوراثة والطراز الجيني.</td><td>‎AB‎ سيادة مشتركة ومتباين الأليلات؛ ‎Yy‎ سيادة تامة ومتباين؛ ‎aa‎ متنحٍ متماثل الأليلات.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 55 وإكمال نشاط 2-2 وإعداد بطاقات للمصطلحات</p><p><b>إرشاد لولي الأمر:</b> مساعدة الابن على تسميع المصطلحات باستخدام البطاقات</p>"]}]},{"title":"الوراثة والمخططات الجينية","sb":"ص 56–70","unit":"الوحدة 2: الوراثة","periods":[{"axis":"التزاوجات أحادية الهجين وكتابة مخطط الوراثة","n":1,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","1 من 8"],["محور الحصة","التزاوجات أحادية الهجين وكتابة مخطط الوراثة"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 56–57"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يكتب مخطط وراثة كاملًا لتزاوج أحادي الهجين (الطرز الجينية للآباء، الأمشاج، مربع بانيت، النسب)\n2. يشرح معنى الجيل الأول ‎F1‎ والجيل الثاني ‎F2‎\nمخرج تعليمي آخر: يتنبأ بنسب الطرز الجينية والمظهرية في نسل تزاوج ‎Aa × Aa‎","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الأقلام","التزاوج أحادي الهجين، مخطط الوراثة، مربع بانيت، الجيل الأول ‎F1‎، الجيل الثاني ‎F2‎، النسبة 3:1، النسبة 1:2:1.","يطرح المعلم مسألة: «أبوان كلاهما غير مصاب بالمهق وأنجبا طفلًا مصابًا. كيف حدث ذلك؟» ويترك الطلبة يقترحون الطرز الجينية.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض المسألة ويستقبل الفرضيات\nالطالب: يقترحون أن الأبوين حاملان ‎Aa‎\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يعرض النموذج الكامل لمخطط الوراثة خطوة بخطوة بالشكل 2-7\nالطالب: ينسخون الخطوات في الدفتر ويحددون الأمشاج\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم ثلاث مسائل متدرجة للحل في أزواج\nالطالب: يحلون المسائل بمخططات كاملة ويعرض أزواج مختارون حلولهم\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما أنواع الأمشاج التي ينتجها الفرد ‎Tt‎؟\n   الإجابة النموذجية: ‎T‎ و‎t‎.\n2) (المستوى المتوقع) السؤال: ما نسبة الطرز المظهرية في نسل ‎Tt × Tt (‎سيادة تامة)؟\n   الإجابة النموذجية: 3 سائد : 1 متنحٍ.\n3) (المستوى المتقدم) السؤال: ما نسبة الطرز الجينية في نسل ‎Tt × Tt‎؟\n   الإجابة النموذجية: ‎1 TT : 2 Tt : 1 tt‎.","1) (مستوى الدعم) السؤال: ما المقصود بالجيل الأول ‎F1‎؟\n   الإجابة النموذجية: النسل الناتج من تزاوج الآباء الأصليين (الجيل الأبوي ‎P‎).\n2) (المستوى المتوقع) السؤال: اكتب مخطط وراثة لتزاوج ‎Aa × aa‎ ونسب النسل.\n   الإجابة النموذجية: الأمشاج: ‎A‎ و‎a‎ من الأول، و‎a‎ من الثاني؛ النسل: ‎1 Aa : 1 aa‎؛ أي 50% سائد و50% متنحٍ.\n3) (المستوى المتقدم) السؤال: أبوان غير مصابين أنجبا طفلًا مصابًا بالمهق. ما احتمال أن يكون الطفل التالي مصابًا؟ فسّر.\n   الإجابة النموذجية: الأبوان ‎Aa‎، ومن مخطط ‎Aa × Aa‎ احتمال ‎aa = 1/4 (25%)‎ لكل طفل مستقل.","إرشاد للطالب: مراجعة ص 56–57 وحل مسألتين إضافيتين بمخطط كامل\nإرشاد لولي الأمر: متابعة الابن في كتابة خطوات مخطط الوراثة بالترتيب الصحيح"],"h":["<ol class=\"ol\"><li>يكتب مخطط وراثة كاملًا لتزاوج أحادي الهجين (الطرز الجينية للآباء، الأمشاج، مربع بانيت، النسب)</li><li>يشرح معنى الجيل الأول ‎F1‎ والجيل الثاني ‎F2‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يتنبأ بنسب الطرز الجينية والمظهرية في نسل تزاوج ‎Aa × Aa‎</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يكتب مخطط وراثة كاملًا لتزاوج أحادي الهجين (الطرز الجينية للآباء، الأمشاج، مربع بانيت، النسب)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح معنى الجيل الأول ‎F1‎ والجيل الثاني ‎F2‎</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يتنبأ بنسب الطرز الجينية والمظهرية في نسل تزاوج ‎Aa × Aa‎</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الأقلام</span></div>","<p>التزاوج أحادي الهجين، مخطط الوراثة، مربع بانيت، الجيل الأول ‎F1‎، الجيل الثاني ‎F2‎، النسبة 3:1، النسبة 1:2:1.</p>","<p>يطرح المعلم مسألة: «أبوان كلاهما غير مصاب بالمهق وأنجبا طفلًا مصابًا. كيف حدث ذلك؟» ويترك الطلبة يقترحون الطرز الجينية.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض المسألة ويستقبل الفرضيات</td><td>يقترحون أن الأبوين حاملان ‎Aa‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يعرض النموذج الكامل لمخطط الوراثة خطوة بخطوة بالشكل 2-7</td><td>ينسخون الخطوات في الدفتر ويحددون الأمشاج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم ثلاث مسائل متدرجة للحل في أزواج</td><td>يحلون المسائل بمخططات كاملة ويعرض أزواج مختارون حلولهم</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما أنواع الأمشاج التي ينتجها الفرد ‎Tt‎؟</td><td>‎T‎ و‎t‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما نسبة الطرز المظهرية في نسل ‎Tt × Tt (‎سيادة تامة)؟</td><td>3 سائد : 1 متنحٍ.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>ما نسبة الطرز الجينية في نسل ‎Tt × Tt‎؟</td><td>‎1 TT : 2 Tt : 1 tt‎.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما المقصود بالجيل الأول ‎F1‎؟</td><td>النسل الناتج من تزاوج الآباء الأصليين (الجيل الأبوي ‎P‎).</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب مخطط وراثة لتزاوج ‎Aa × aa‎ ونسب النسل.</td><td>الأمشاج: ‎A‎ و‎a‎ من الأول، و‎a‎ من الثاني؛ النسل: ‎1 Aa : 1 aa‎؛ أي 50% سائد و50% متنحٍ.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أبوان غير مصابين أنجبا طفلًا مصابًا بالمهق. ما احتمال أن يكون الطفل التالي مصابًا؟ فسّر.</td><td>الأبوان ‎Aa‎، ومن مخطط ‎Aa × Aa‎ احتمال ‎aa = 1/4 (25%)‎ لكل طفل مستقل.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 56–57 وحل مسألتين إضافيتين بمخطط كامل</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في كتابة خطوات مخطط الوراثة بالترتيب الصحيح</p>"]},{"axis":"السيادة المشتركة والأليلات المتعددة والتلقيح الاختباري","n":2,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","2 من 8"],["محور الحصة","السيادة المشتركة والأليلات المتعددة والتلقيح الاختباري"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 57–58"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يحل مسائل وراثية تتضمن السيادة المشتركة والأليلات المتعددة (فصائل الدم)\n2. يشرح معنى التلقيح الاختباري واستخدامه في تحديد الطراز الجيني\nمخرج تعليمي آخر: يحلل نتائج تلقيح اختباري لاستنتاج الطراز الجيني للأب المجهول","المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الأقلام\n- صورة توضيحية","السيادة المشتركة، الأليلات المتعددة، فصائل الدم ‎ABO‎، ‎Iᴬ‎ و‎Iᴮ‎ و‎Iᴼ‎، التلقيح الاختباري.","يسأل المعلم: «لماذا تحتاج بنوك الدم إلى معرفة فصيلة دمك؟ وكيف تكون فصيلة دم الابن ‎O‎ من أبوين ‎A‎ و‎B‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويسجل التخمينات\nالطالب: يقترحون الطرز الجينية الممكنة\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الأليلات الثلاثة لفصائل الدم وعلاقات السيادة والسيادة المشتركة\nالطالب: يكتبون الطرز الجينية الستة والطرز المظهرية الأربعة\n3) (12 دقيقة: من الدقيقة 17 إلى 29)\nالمعلم: يشرح التلقيح الاختباري بمثال حيوان سائد الصفة مجهول الطراز\nالطالب: يرسمون مخططي الاحتمالين ويستنتجون قاعدة الاستدلال\n4) (11 دقيقة: من الدقيقة 29 إلى 40)\nالمعلم: ينظم «تحدي البنك» بمسائل فصائل الدم في المجموعات ثم التقويم الختامي\nالطالب: يحلون المسائل ويعرضون الحلول\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الطرز الجينية الممكنة لفصيلة الدم ‎A‎؟\n   الإجابة النموذجية: ‎IᴬIᴬ‎ أو ‎IᴬIᴼ‎.\n2) (المستوى المتوقع) السؤال: ما الطراز الذي يُستخدم في التلقيح الاختباري؟\n   الإجابة النموذجية: فرد متماثل الأليلات المتنحية.\n3) (المستوى المتقدم) السؤال: أبوان ‎IᴬIᴼ × IᴮIᴼ‎. ما الفصائل الممكنة للأبناء؟\n   الإجابة النموذجية: ‎AB‎ و‎A‎ و‎B‎ و‎O‎ بنسبة 1:1:1:1.","1) (مستوى الدعم) السؤال: لماذا تُعدّ فصيلة الدم ‎AB‎ مثالًا على السيادة المشتركة؟\n   الإجابة النموذجية: لأن الأليلين ‎Iᴬ‎ و‎Iᴮ‎ يظهر أثرهما معًا في الطراز المظهري.\n2) (المستوى المتوقع) السؤال: لُقّح نبات طويل مجهول الطراز مع نبات قصير ‎tt‎ فكان نصف النسل قصيرًا. ما طراز النبات الطويل؟\n   الإجابة النموذجية: ‎Tt‎، لأن ظهور النسل القصير يعني أنه أعطى أمشاجًا ‎t‎.\n3) (المستوى المتقدم) السؤال: هل يمكن لأبوين فصيلتهما ‎AB‎ و‎O‎ إنجاب طفل فصيلته ‎AB‎ أو ‎O‎؟ فسّر.\n   الإجابة النموذجية: لا؛ الأبناء يرثون ‎Iᴬ‎ أو ‎Iᴮ‎ من الأب ‎AB‎ و‎Iᴼ‎ من الآخر، فيكونون ‎IᴬIᴼ (A)‎ أو ‎IᴮIᴼ (B)‎ فقط.","إرشاد للطالب: مراجعة ص 57–58 وحل مسائل فصائل الدم\nإرشاد لولي الأمر: يمكن للأسرة مشاركة الابن في التعرف على فصائل دم أفرادها وتحليلها وراثيًا بأسلوب ممتع"],"h":["<ol class=\"ol\"><li>يحل مسائل وراثية تتضمن السيادة المشتركة والأليلات المتعددة (فصائل الدم)</li><li>يشرح معنى التلقيح الاختباري واستخدامه في تحديد الطراز الجيني</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحلل نتائج تلقيح اختباري لاستنتاج الطراز الجيني للأب المجهول</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل مسائل وراثية تتضمن السيادة المشتركة والأليلات المتعددة (فصائل الدم)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يشرح معنى التلقيح الاختباري واستخدامه في تحديد الطراز الجيني</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحلل نتائج تلقيح اختباري لاستنتاج الطراز الجيني للأب المجهول</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<d A a1\">مستوى الدعم</td><td>لماذا تُعدّ فصيلة الدم ‎AB‎ مثالًا على السيادة المشتركة؟</td><td>لأن الأليلين ‎Iᴬ‎ و‎Iᴮ‎ يظهر أثرهما معًا في الطراز المظهري.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لُقّح نبات طويل مجهول الطراز مع نبات قصير ‎tt‎ فكان نصف النسل قصيرًا. ما طراز النبات الطويل؟</td><td>‎Tt‎، لأن ظهور النسل القصير يعني أنه أعطى أمشاجًا ‎t‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>هل يمكن لأبوين فصيلتهما ‎AB‎ و‎O‎ إنجاب طفل فصيلته ‎AB‎ أو ‎O‎؟ فسّر.</td><td>لا؛ الأبناء يرثون ‎Iᴬ‎ أو ‎Iᴮ‎ من الأب ‎AB‎ و‎Iᴼ‎ من الآخر، فيكونون ‎IᴬIᴼ (A)‎ أو ‎IᴮIᴼ (B)‎ فقط.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 57–58 وحل مسائل فصائل الدم</p><p><b>إرشاد لولي الأمر:</b> يمكن للأسرة مشاركة الابن في التعرف على فصائل دم أفرادها وتحليلها وراثيًا بأسلوب ممتع</p>"]},{"axis":"الكروموسومات الجنسية والوراثة المرتبطة بالجنس","n":3,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","3 من 8"],["محور الحصة","الكروموسومات الجنسية والوراثة المرتبطة بالجنس"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 59–60"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يشرح المقصود بالوراثة المرتبطة بالجنس ودور الكروموسوم ‎X‎ فيها\n2. يكتب مخطط وراثة لصفة مرتبطة بالجنس باستخدام الرموز ‎Xᴴ‎ و‎Xʰ‎ و‎Y‎\nمخرج تعليمي آخر: يفسر لماذا تظهر الصفات المتنحية المرتبطة بـ ‎X‎ في الذكور أكثر من الإناث","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)","الكروموسومات الجنسية، ‎X‎ و‎Y‎، الوراثة المرتبطة بالجنس، الأنثى الحاملة، الهيموفيليا، عمى الألوان.","يعرض المعلم صورة لوحة اختبار عمى الألوان (إيشيهارا) ويسأل: «لماذا ينتشر عمى الألوان بين الرجال أكثر من النساء؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض اللوحة ويطرح السؤال\nالطالب: يقترحون تفسيرات\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الكروموسومات الجنسية وتحديد الجنس وتمثيل الأليلات على ‎X‎\nالطالب: يرسمون مخطط تحديد الجنس ويكتبون الطرز الجينية الخمسة لصفة مرتبطة بـ ‎X‎\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يقدم مسائل الهيموفيليا وعمى الألوان للحل في مجموعات\nالطالب: يحلون المسائل بمخططات كاملة ويستنتجون نسب الإصابة حسب الجنس\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الطراز الجيني لأنثى حاملة للهيموفيليا؟\n   الإجابة النموذجية: ‎XᴴXʰ‎.\n2) (المستوى المتوقع) السؤال: لماذا لا يكون الذكر حاملًا لصفة متنحية مرتبطة بـ ‎X‎؟\n   الإجابة النموذجية: لأنه يحمل كروموسوم ‎X‎ واحدًا، فإما أن يظهر الأليل المتنحي أو لا يوجد.\n3) (المستوى المتقدم) السؤال: أم حاملة وأب سليم: ما احتمال إصابة ابن ذكر بالهيموفيليا؟\n   الإجابة النموذجية: 50% من الذكور.","1) (مستوى الدعم) السؤال: لماذا لا ينقل الأب صفة مرتبطة بـ ‎X‎ إلى أبنائه الذكور؟\n   الإجابة النموذجية: لأن الأب يعطي أبناءه الذكور الكروموسوم ‎Y‎ لا ‎X‎.\n2) (المستوى المتوقع) السؤال: اكتب مخطط وراثة لأم حاملة لعمى الألوان وأب مصاب.\n   الإجابة النموذجية: ‎XᴮXᵇ × XᵇY‎: البنات ‎XᴮXᵇ (‎حاملة) و‎XᵇXᵇ (‎مصابة)، والأبناء ‎XᴮY (‎سليم) و‎XᵇY (‎مصاب)؛ 50% من كل جنس مصاب.\n3) (المستوى المتقدم) السؤال: فسّر ندرة الإصابة بالهيموفيليا عند الإناث.\n   الإجابة النموذجية: لأن الأنثى تحتاج إلى أليلين متنحيين (من الأب المصاب والأم الحاملة)، وهذا التركيب نادر.","إرشاد للطالب: مراجعة ص 59–60 وحل مسألتين في الوراثة المرتبطة بالجنس\nإرشاد لولي الأمر: مناقشة الابن في أهمية الاستشارة الوراثية للأسر التي تظهر فيها أمراض وراثية"],"h":["<ol class=\"ol\"><li>يشرح المقصود بالوراثة المرتبطة بالجنس ودور الكروموسوم ‎X‎ فيها</li><li>يكتب مخطط وراثة لصفة مرتبطة بالجنس باستخدام الرموز ‎Xᴴ‎ و‎Xʰ‎ و‎Y‎</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يفسر لماذا تظهر الصفات المتنحية المرتبطة بـ ‎X‎ في الذكور أكثر من الإناث</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح المقصود بالوراثة المرتبطة بالجنس ودور الكروموسوم ‎X‎ فيها</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يكتب مخطط وراثة لصفة مرتبطة بالجنس باستخدام الرموز ‎Xᴴ‎ و‎Xʰ‎ و‎Y‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يفسر لماذا تظهر الصفات المتنحية المرتبطة بـ ‎X‎ في الذكور أكثر من الإناث</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">الوسائل المتعددة (سمعية - بصرية)</span></div>","<p>الكروموسومات الجنسية، ‎X‎ و‎Y‎، الوراثة المرتبطة بالجنس، الأنثى الحاملة، الهيموفيليا، عمى الألوان.</p>","<p>يعرض المعلم صورة لوحة اختبار عمى الألوان (إيشيهارا) ويسأل: «لماذا ينتشر عمى الألوان بين الرجال أكثر من النساء؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض اللوحة ويطرح السؤال</td><td>يقترحون تفسيرات</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–17</span><br><small>12 دقيقة</small></td><td>يشرح الكروموسومات الجنسية وتحديد الجنس وتمثيل الأليلات على ‎X‎</td><td>يرسمون مخطط تحديد الجنس ويكتبون الطرز الجينية الخمسة لصفة مرتبطة بـ ‎X‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">17–32</span><br><small>15 دقيقة</small></td><td>يقدم مسائل الهيموفيليا وعمى الألوان للحل في مجموعات</td><td>يحلون المسائل بمخططات كاملة ويستنتجون نسب الإصابة حسب الجنس</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">32–40</span><br><small>8 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الطراز الجيني لأنثى حاملة للهيموفيليا؟</td><td>‎XᴴXʰ‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لماذا لا يكون الذكر حاملًا لصفة متنحية مرتبطة بـ ‎X‎؟</td><td>لأنه يحمل كروموسوم ‎X‎ واحدًا، فإما أن يظهر الأليل المتنحي أو لا يوجد.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>أم حاملة وأب سليم: ما احتمال إصابة ابن ذكر بالهيموفيليا؟</td><td>50% من الذكور.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>لماذا لا ينقل الأب صفة مرتبطة بـ ‎X‎ إلى أبنائه الذكور؟</td><td>لأن الأب يعطي أبناءه الذكور الكروموسوم ‎Y‎ لا ‎X‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب مخطط وراثة لأم حاملة لعمى الألوان وأب مصاب.</td><td>‎XᴮXᵇ × XᵇY‎: البنات ‎XᴮXᵇ (‎حاملة) و‎XᵇXᵇ (‎مصابة)، والأبناء ‎XᴮY (‎سليم) و‎XᵇY (‎مصاب)؛ 50% من كل جنس مصاب.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>فسّر ندرة الإصابة بالهيموفيليا عند الإناث.</td><td>لأن الأنثى تحتاج إلى أليلين متنحيين (من الأب المصاب والأم الحاملة)، وهذا التركيب نادر.</td></tr></table>","<p><b>إرشاد للطالب:</b> مراجعة ص 59–60 وحل مسألتين في الوراثة المرتبطة بالجنس</p><p><b>إرشاد لولي الأمر:</b> مناقشة الابن في أهمية الاستشارة الوراثية للأسر التي تظهر فيها أمراض وراثية</p>"]},{"axis":"التزاوجات ثنائية الهجين ونسبة 9:3:3:1","n":4,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","4 من 8"],["محور الحصة","التزاوجات ثنائية الهجين ونسبة 9:3:3:1"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 61–63 + كتاب التجارب ص 46"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يكتب مخطط وراثة لتزاوج ثنائي الهجين لجينين غير مرتبطين مستخدمًا مربع بانيت ‎4×4‎\n2. يفسر نسبة 9:3:3:1 في ضوء الاصطفاف العشوائي للكروموسومات\nمخرج تعليمي آخر: يجيب عن أسئلة تتضمن تزاوجات ثنائية الهجين (نشاط 2-3)","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: كتاب التجارب العملية والأنشطة","التزاوج ثنائي الهجين، الجينات غير المرتبطة، أمشاج ثنائية الأليلات، مربع بانيت ‎4×4‎، النسبة 9:3:3:1.","يعرض المعلم صورة بذور بازلاء صفراء ملساء وخضراء مجعدة ويسأل: «إذا تتبعنا صفتين معًا، كم نوعًا من الأمشاج ينتج نبات ‎YyRr‎؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يطرح السؤال ويستقبل الإجابات\nالطالب: يستنتجون أربعة أنواع: ‎YR‎ و‎Yr‎ و‎yR‎ و‎yr‎\n2) (13 دقيقة: من الدقيقة 5 إلى 18)\nالمعلم: يحل مثال ‎YyRr × YyRr‎ بمربع بانيت ‎4×4‎ ويربط الأمشاج الأربعة بالاصطفاف العشوائي\nالطالب: يملؤون المربع ويستخرجون النسبة 9:3:3:1\n3) (15 دقيقة: من الدقيقة 18 إلى 33)\nالمعلم: يوجه حل نشاط 2-3 (كتاب التجارب ص 46)\nالطالب: يحلون الأسئلة في أزواج\n4) (7 دقائق: من الدقيقة 33 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الأمشاج التي ينتجها الفرد ‎AaBb‎؟\n   الإجابة النموذجية: ‎AB‎ و‎Ab‎ و‎aB‎ و‎ab‎.\n2) (المستوى المتوقع) السؤال: ما نسبة الطراز المظهري المتنحي في الصفتين في نسل ‎AaBb × AaBb‎؟\n   الإجابة النموذجية: 1/16.\n3) (المستوى المتقدم) السؤال: لماذا ينتج ‎AaBb‎ أربعة أنواع من الأمشاج بنسب متساوية؟\n   الإجابة النموذجية: لأن الجينين على كروموسومين مختلفين فتصطف الأزواج عشوائيًا ويتوزع كل أليل مستقلًا عن الآخر.","1) (مستوى الدعم) السؤال: ما نسبة الطرز المظهرية في نسل تزاوج ثنائي الهجين بين فردين متباينين في الجينين؟\n   الإجابة النموذجية: 9:3:3:1.\n2) (المستوى المتوقع) السؤال: اكتب أمشاج الفرد ‎AABb‎.\n   الإجابة النموذجية: ‎AB‎ و‎Ab‎.\n3) (المستوى المتقدم) السؤال: كم فردًا متوقعًا بالطراز المظهري السائد في الصفتين من 320 نبتة ناتجة عن ‎AaBb × AaBb‎؟\n   الإجابة النموذجية: ‎9/16 × 320 = 180‎ نبتة.","إرشاد للطالب: إكمال نشاط 2-3 ص 46 ومراجعة ص 61–63\nإرشاد لولي الأمر: تشجيع الابن على التدرب على رسم مربع بانيت ‎4×4‎ بدقة وترتيب"],"h":["<ol class=\"ol\"><li>يكتب مخطط وراثة لتزاوج ثنائي الهجين لجينين غير مرتبطين مستخدمًا مربع بانيت ‎4×4‎</li><li>يفسر نسبة 9:3:3:1 في ضوء الاصطفاف العشوائي للكروموسومات</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يجيب عن أسئلة تتضمن تزاوجات ثنائية الهجين (نشاط 2-3)</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يكتب مخطط وراثة لتزاوج ثنائي الهجين لجينين غير مرتبطين مستخدمًا مربع بانيت ‎4×4‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر نسبة 9:3:3:1 في ضوء الاصطفاف العشوائي للكروموسومات</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يجيب عن أسئلة تتضمن تزاوجات ثنائية الهجين (نشاط 2-3)</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>التزاوج ثنائي الهجين، الجينات غير المرتبطة، أمشاج ثنائية الأليلات، مربع بانيت ‎4×4‎، النسبة 9:3:3:1.</p>","<p>يعرض المعلم صورة بذور بازلاء صفراء ملساء وخضراء مجعدة ويسأل: «إذا تتبعنا صفتين معًا، كم نوعًا من الأمشاج ينتج نبات ‎YyRr‎؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يطرح السؤال ويستقبل الإجابات</td><td>يستنتجون أربعة أنواع: ‎YR‎ و‎Yr‎ و‎yR‎ و‎yr‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–18</span><br><small>13 دقيقة</small></td><td>يحل مثال ‎YyRr × YyRr‎ بمربع بانيت ‎4×4‎ ويربط الأمشاج الأربعة بالاصطفاف العشوائي</td><td>يملؤون المربع ويستخرجون النسبة 9:3:3:1</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">18–33</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 2-3 (كتاب التجارب ص 46)</td><td>يحلون الأسئلة في أزواج</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">33–40</span><br><small>7 دقائق</small></td><td>يدير التقويم الختامي</td><td>يجيبون فرديًا</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما الأمشاج التي ينتجها الفرد ‎AaBb‎؟</td><td>‎AB‎ و‎Ab‎ و‎aB‎ و‎ab‎.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>ما نسبة الطراز المظهري المتنحي في الصفتين في نسل ‎AaBb × AaBb‎؟</td><td>1/16.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا ينتج ‎AaBb‎ أربعة أنواع من الأمشاج بنسب متساوية؟</td><td>لأن الجينين على كروموسومين مختلفين فتصطف الأزواج عشوائيًا ويتوزع كل أليل مستقلًا عن الآخر.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نسبة الطرز المظهرية في نسل تزاوج ثنائي الهجين بين فردين متباينين في الجينين؟</td><td>9:3:3:1.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>اكتب أمشاج الفرد ‎AABb‎.</td><td>‎AB‎ و‎Ab‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>كم فردًا متوقعًا بالطراز المظهري السائد في الصفتين من 320 نبتة ناتجة عن ‎AaBb × AaBb‎؟</td><td>‎9/16 × 320 = 180‎ نبتة.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-3 ص 46 ومراجعة ص 61–63</p><p><b>إرشاد لولي الأمر:</b> تشجيع الابن على التدرب على رسم مربع بانيت ‎4×4‎ بدقة وترتيب</p>"]},{"axis":"تدريب: تزاوجات ثنائية الهجين والتلقيح الاختباري الثنائي","n":5,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","5 من 8"],["محور الحصة","تدريب: تزاوجات ثنائية الهجين والتلقيح الاختباري الثنائي"],["الأسبوع والتاريخ","الأسبوع السادس (11–15/10/2026)"],["كتاب الطالب","ص 61–63 + كتاب التجارب ص 49"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يحل مسائل تزاوج ثنائي الهجين تتضمن تلقيحًا اختباريًا ‎(AaBb × aabb)‎\n2. يستنتج الطرز الجينية للآباء من نسب النسل الناتج\nمخرج تعليمي آخر: يقيّم حلولًا مختلفة لمسألة واحدة ويحدد الخطأ فيها","المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم","- التعلم المبني على حل المشكلات\n- التعلم التعاوني","- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: كتاب التجارب العملية والأنشطة","التلقيح الاختباري الثنائي، النسبة 1:1:1:1، الاستدلال العكسي، النسب المتوقعة.","يعرض المعلم نتيجة تزاوج غامض: «النسل بنسبة 1:1:1:1» ويسأل: «من هما الأبوان؟» ويمنح دقيقة للتفكير.","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض اللغز ويناقش الاحتمالات\nالطالب: يقترحون ‎AaBb × aabb‎\n2) (10 دقائق: من الدقيقة 5 إلى 15)\nالمعلم: يحل مثال التلقيح الاختباري الثنائي ويبين النسبة 1:1:1:1\nالطالب: يكملون المخطط ويقارنونه بنسبة 9:3:3:1\n3) (15 دقيقة: من الدقيقة 15 إلى 30)\nالمعلم: يوجه حل نشاط 2-4 «تزاوج آخر لثنائي الهجين» (كتاب التجارب ص 49)\nالطالب: يحلون في مجموعات ويقيّمون حلول مجموعة أخرى\n4) (10 دقائق: من الدقيقة 30 إلى 40)\nالمعلم: يختم بمسابقة المجموعات في مسائل ثنائي الهجين\nالطالب: يتنافسون ويراجعون\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما نسبة النسل في التزاوج ‎AaBb × aabb‎؟\n   الإجابة النموذجية: 1:1:1:1.\n2) (المستوى المتوقع) السؤال: نسل نسبته 3:1:3:1. ما الطرازان المحتملان للأبوين؟\n   الإجابة النموذجية: ‎AaBb × Aabb (‎أو ‎AaBb × aaBb‎).\n3) (المستوى المتقدم) السؤال: لماذا يكشف التلقيح الاختباري أمشاج الأب المجهول مباشرة؟\n   الإجابة النموذجية: لأن الأب المتنحي يعطي أمشاجًا ‎ab‎ فقط، فيظهر في النسل أثر أليلات أمشاج الأب المجهول كما هي.","1) (مستوى الدعم) السؤال: اكتب أمشاج الفرد ‎aabb‎.\n   الإجابة النموذجية: ‎ab‎ فقط.\n2) (المستوى المتوقع) السؤال: لُقّح نبات طويل أرجواني الأزهار مع نبات قصير أبيض ‎(ttpp)‎، فكان النسل كله طويلًا أرجوانيًا. ما طراز النبات الأول؟\n   الإجابة النموذجية: ‎TTPP‎.\n3) (المستوى المتقدم) السؤال: اكتشف الخطأ: «في تزاوج ‎AaBb × aabb‎ تكون النسبة 9:3:3:1».\n   الإجابة النموذجية: خطأ؛ النسبة 1:1:1:1 لأن الأب الثاني ينتج نوعًا واحدًا من الأمشاج.","إرشاد للطالب: إكمال نشاط 2-4 ص 49 ومراجعة أخطائه في مسائل ثنائي الهجين\nإرشاد لولي الأمر: متابعة الابن في حل مسألتين وتشجيعه على التحقق من مجموع النسب"],"h":["<ol class=\"ol\"><li>يحل مسائل تزاوج ثنائي الهجين تتضمن تلقيحًا اختباريًا ‎(AaBb × aabb)‎</li><li>يستنتج الطرز الجينية للآباء من نسب النسل الناتج</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يقيّم حلولًا مختلفة لمسألة واحدة ويحدد الخطأ فيها</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يحل مسائل تزاوج ثنائي الهجين تتضمن تلقيحًا اختباريًا ‎(AaBb × aabb)‎</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج 2</td><td>يستنتج الطرز الجينية للآباء من نسب النسل الناتج</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يقيّم حلولًا مختلفة لمسألة واحدة ويحدد الخطأ فيها</td><td class=\"lv\">تقييم</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم التعاوني</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">الأقلام</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>التلقيح الاختباري الثنائي، النسبة 1:1:1:1، الاستدلال العكسي، النسب المتوقعة.</p>","<p>يعرض المعلم نتيجة تزاوج غامض: «النسل بنسبة 1:1:1:1» ويسأل: «من هما الأبوان؟» ويمنح دقيقة للتفكير.</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض اللغز ويناقش الاحتمالات</td><td>يقترحون ‎AaBb × aabb‎</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">5–15</span><br><small>10 دقائق</small></td><td>يحل مثال التلقيح الاختباري الثنائي ويبين النسبة 1:1:1:1</td><td>يكملون المخطط ويقارنونه بنسبة 9:3:3:1</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">15–30</span><br><small>15 دقيقة</small></td><td>يوجه حل نشاط 2-4 «تزاوج آخر لثنائي الهجين» (كتاب التجارب ص 49)</td><td>يحلون في مجموعات ويقيّمون حلول مجموعة أخرى</td></tr><tr><td class=\"tm\"><span dir=\"ltr\">30–40</span><br><small>10 دقائق</small></td><td>يختم بمسابقة المجموعات في مسائل ثنائي الهجين</td><td>يتنافسون ويراجعون</td></tr><tr class=\"sum\"><td class=\"tm\">المجموع</td><td colspan=\"2\">40 دقيقة</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>ما نسبة النسل في التزاوج ‎AaBb × aabb‎؟</td><td>1:1:1:1.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>نسل نسبته 3:1:3:1. ما الطرازان المحتملان للأبوين؟</td><td>‎AaBb × Aabb (‎أو ‎AaBb × aaBb‎).</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>لماذا يكشف التلقيح الاختباري أمشاج الأب المجهول مباشرة؟</td><td>لأن الأب المتنحي يعطي أمشاجًا ‎ab‎ فقط، فيظهر في النسل أثر أليلات أمشاج الأب المجهول كما هي.</td></tr></table>","<table class=\"tb asx\"><tr><th>المستوى</th><th>السؤال</th><th>الإجابة النموذجية</th></tr><tr><td class=\"lvA a1\">مستوى الدعم</td><td>اكتب أمشاج الفرد ‎aabb‎.</td><td>‎ab‎ فقط.</td></tr><tr><td class=\"lvA a2\">المستوى المتوقع</td><td>لُقّح نبات طويل أرجواني الأزهار مع نبات قصير أبيض ‎(ttpp)‎، فكان النسل كله طويلًا أرجوانيًا. ما طراز النبات الأول؟</td><td>‎TTPP‎.</td></tr><tr><td class=\"lvA a3\">المستوى المتقدم</td><td>اكتشف الخطأ: «في تزاوج ‎AaBb × aabb‎ تكون النسبة 9:3:3:1».</td><td>خطأ؛ النسبة 1:1:1:1 لأن الأب الثاني ينتج نوعًا واحدًا من الأمشاج.</td></tr></table>","<p><b>إرشاد للطالب:</b> إكمال نشاط 2-4 ص 49 ومراجعة أخطائه في مسائل ثنائي الهجين</p><p><b>إرشاد لولي الأمر:</b> متابعة الابن في حل مسألتين وتشجيعه على التحقق من مجموع النسب</p>"]},{"axis":"التفوق الجيني","n":6,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","6 من 8"],["محور الحصة","التفوق الجيني"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 64–65 + كتاب التجارب ص 53"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر\n2. يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4)\nمخرج تعليمي آخر: يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني","المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل","- التعلم المبني على حل المشكلات\n- التعلم بالاكتشاف","- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كتاب التجارب العملية والأنشطة","التفوق الجيني، الجين المتفوق، الجين المتفوق عليه، النسب المعدلة، المسار الإنزيمي.","يعرض المعلم صورًا لفئران بألوان أغوتي وسوداء وبيضاء ويسأل: «لماذا يظهر لون ثالث (أبيض) لا يفسره جين اللون وحده؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض الصور ويثير التساؤل\nالطالب: يقترحون وجود جين آخر يتحكم في ظهور اللون\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح التفوق الجيني بمسار إنزيمي من خطوتين يتحكم في الصبغة\nالطالب: يرسمون المسار ويحددون أثر غياب كل إنزيم\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 2-7 «التفوق الجيني» (كتاب التجارب ص 53)\nالطالب: يحلون المسائل ويستخرجون النسب المعدلة\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما التفوق الجيني؟\n   الإجابة النموذجية: تفاعل بين جينين في مواقع مختلفة يخفي فيه أحدهما أثر الآخر في الطراز المظهري.\n2) (المستوى المتوقع) السؤال: ما مجموع أجزاء النسب المعدلة في تزاوج ثنائي الهجين متباين؟\n   الإجابة النموذجية: 16 دائمًا (مثل 9:3:4 أو 9:7).\n3) (المستوى المتقدم) السؤال: في مسار: مادة أولية ←(إنزيم ‎A)←‎ وسيط ←(إنزيم ‎B)←‎ صبغة، ما لون الفرد ‎aaBB‎؟\n   الإجابة النموذجية: بلا صبغة، لأن غياب الإنزيم ‎A‎ يمنع تكون الوسيط.","1) (مستوى الدعم) السؤال: كيف تميز التفوق الجيني من نتائج النسل؟\n   الإجابة النموذجية: بظهور نسب معدلة مجموعها 16 تختلف عن 9:3:3:1.\n2) (المستوى المتوقع) السؤال: اشرح سبب النسبة 9:3:4 في مثال الفئران.\n   الإجابة النموذجية: الأفراد ‎cc‎ـ ـ (متماثلو أليل التفوق المتنحي) بيض جميعًا مهما كان جين اللون الآخر، فتُضم فئتان (3 + 1) إلى فئة البيض.\n3) (المستوى المتقدم) السؤال: تزاوج ‎AaBb × AaBb‎ أعطى نسبة 9:7. فسّر في ضوء مسار إنزيمي.\n   الإجابة النموذجية: يلزم وجود أليل سائد في الجينين معًا (‎A‎ـ ‎B‎ـ) لإنتاج الصفة (9)، وغياب أي إنزيم يمنعها فتجتمع الفئات الأخرى ‎(3+3+1 = 7)‎.","إرشاد للطالب: إكمال نشاط 2-7 ص 53 ومراجعة ص 64–65\nإرشاد لولي الأمر: سؤال الابن: «كيف يخفي جين أثر جين آخر؟» ليشرحه بمثال المسار الإنزيمي"],"h":["<ol class=\"ol\"><li>يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر</li><li>يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4)</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح التفوق الجيني بوصفه تفاعلًا بين جينين يخفي فيه أحدهما أثر الآخر</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يحل مسائل تفوق جيني ويفسر النسب المعدلة (مثل 9:3:4)</td><td class=\"lv\">تطبيق</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يميز بين نسب ثنائي الهجين العادية ونسب التفوق الجيني</td><td class=\"lv\">تحليل</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم المبني على حل المشكلات</span><span class=\"chip\">التعلم بالاكتشاف</span></div>","<div class=\"chips\"><span class=\"chip r\">الكتاب</span><span class=\"chip r\">السبورة الذكية</span><span class=\"chip r\">صورة توضيحية</span><span class=\"chip r\">أخرى: كتاب التجارب العملية والأنشطة</span></div>","<p>التفوق الجيني، الجين المتفوق، الجين المتفوق عليه، النسب المعدلة، المسار الإنزيمي.</p>","<p>يعرض المعلم صورًا لفئران بألوان أغوتي وسوداء وبيضاء ويسأل: «لماذا يظهر لون ثالث (أبيض) لا يفسره جين اللون وحده؟»</p>","<table class=\"tb proc\"><tr><th>الزمن</th><th>دور المعلم</th><th>دور الطالب</th></tr><tr><td class=\"tm\"><span dir=\"ltr\">0–5</span><br><small>5 دقائق</small></td><td>يعرض الصور ويثير التساؤل</td><td>يقترحون وجود جين د للطالب:</b> إكمال نشاط 2-7 ص 53 ومراجعة ص 64–65</p><p><b>إرشاد لولي الأمر:</b> سؤال الابن: «كيف يخفي جين أثر جين آخر؟» ليشرحه بمثال المسار الإنزيمي</p>"]},{"axis":"الارتباط بالكروموسوم الجسدي والعبور","n":7,"hi":[["المادة","الأحياء – الصف الثاني عشر"],["الوحدة","الوحدة 2: الوراثة"],["الدرس","الوراثة والمخططات الجينية"],["الحصة","7 من 8"],["محور الحصة","الارتباط بالكروموسوم الجسدي والعبور"],["الأسبوع والتاريخ","الأسبوع السابع (18–22/10/2026)"],["كتاب الطالب","ص 66–70 + كتاب التجارب ص 51–52"],["دليل المعلم","ص 91–95"],["كتاب التجارب العملية والأنشطة","نشاط 2-3 ص 46؛ نشاط 2-4 ص 49؛ نشاط 2-5 ص 51؛ نشاط 2-6 ص 52؛ نشاط 2-7 ص 53؛ الاستقصاء العملي 2-2 ص 60"]],"t":["1. يشرح المقصود بالجينات المرتبطة بالكروموسوم الجسدي وأثرها في نسب النسل\n2. يفسر ظهور أفراد معاد تركيبهم (مؤتلفين) بنسبة قليلة نتيجة العبور\nمخرج تعليمي آخر: يحسب نسبة الأفراد المؤتلفين من نتائج تلقيح اختباري","المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق","- التعلم بالنمذجة\n- التعلم المبني على حل المشكلات","- الكتاب\n- السبورة الذكية\n- نماذج مجسمة\n- أخرى: نماذج كروموسومات، كتاب التجارب العملية والأنشطة","الارتباط بالكروموسوم الجسدي، الجينات المرتبطة، الأفراد الأبويون، الأفراد المؤتلفون (معاد تركيبهم)، العبور بين الجينين.","يعرض المعلم نتيجة تلقيح اختباري: 45% : 45% : 5% : 5% ويسأل: «لماذا لم تكن 25% لكل فئة كما نتوقع؟»","1) (5 دقائق: من الدقيقة 0 إلى 5)\nالمعلم: يعرض النتائج ويطرح السؤال\nالطالب: يقارنون بالنسبة 1:1:1:1 ويقترحون تفسيرًا\n2) (12 دقيقة: من الدقيقة 5 إلى 17)\nالمعلم: يشرح الارتباط بنماذج كروموسومات (نمذجة الجينات المرتبطة) وأثر العبور\nالطالب: يرسمون الجينين على كروموسوم واحد ويوضحون كيف ينتج العبور تراكيب جديدة\n3) (15 دقيقة: من الدقيقة 17 إلى 32)\nالمعلم: يوجه حل نشاط 2-5 «الارتباط بالكروموسوم الجسدي» ونشاط 2-6 «الارتباط والعبور» (ص 51–52)\nالطالب: يحلون في مجموعات ويحسبون نسب المؤتلفين\n4) (8 دقائق: من الدقيقة 32 إلى 40)\nالمعلم: يدير التقويم الختامي\nالطالب: يجيبون فرديًا\nالمجموع: 40 دقيقة","1) (مستوى الدعم) السؤال: ما الجينات المرتبطة؟\n   الإجابة النموذجية: جينات تقع على الكروموسوم الجسدي نفسه وتميل إلى الانتقال معًا إلى الأمشاج.\n2) (المستوى المتوقع) السؤال: لماذا يقل عدد الأفراد المؤتلفين عن الأبويين؟\n   الإجابة النموذجية: لأنهم ينتجون فقط عند حدوث عبور بين موقعي الجينين، وهو لا يحدث في كل الخلايا.\n3) (المستوى المتقدم) السؤال: من 200 نسل تلقيح اختباري ظهر 18 مؤتلفًا. احسب نسبة المؤتلفين.\n   الإجابة النموذجية: ‎18/200 × 100 = 9%‎.","1) (مستوى الدعم) السؤال: ما نسبة النسل المتوقعة في تلقيح اختباري لجينين مرتبطين ارتباطًا تامًا دون عبور؟\n   الإجابة النموذجية: 1:1 (طرازان أبويان فقط).\n2) (المستوى المتوقع) السؤال: كيف يؤثر بعد الجينين على الكروموسوم في نسبة المؤتلفين؟\n   الإجابة النموذجية: كلما زادت المسافة بينهما زاد احتمال العبور بينهما فتزيد نسبة المؤتلفين.\n3) (المستوى المتقدم) السؤال: اقترح تفسيرًا لنتيجة تلقيح اختباري: 42% و40% (أبويان) و9% و9% (مؤتلفان).\n   الإجابة النموذجية: الجينان مرتبطان على كروموسوم واحد، والعبور بينهما حدث في بعض الخلايا فقط فأنتج 18% مؤتلفين.","إرشاد للطالب: إكمال نشاطي 2-5 و2-6 ص 51–52 ومراجعة ص 66–70\nإرشاد لولي الأمر: سؤال الابن عن الفرق بين الجينات المرتبطة وغير المرتبطة بمثال بسيط"],"h":["<ol class=\"ol\"><li>يشرح المقصود بالجينات المرتبطة بالكروموسوم الجسدي وأثرها في نسب النسل</li><li>يفسر ظهور أفراد معاد تركيبهم (مؤتلفين) بنسبة قليلة نتيجة العبور</li></ol><div class=\"extra\"><b>مخرج تعليمي آخر:</b> يحسب نسبة الأفراد المؤتلفين من نتائج تلقيح اختباري</div>","<table class=\"tb lvl\"><tr><th>المخرج</th><th>نصه</th><th>المستوى</th></tr><tr><td class=\"c\">المخرج 1</td><td>يشرح المقصود بالجينات المرتبطة بالكروموسوم الجسدي وأثرها في نسب النسل</td><td class=\"lv\">فهم</td></tr><tr><td class=\"c\">المخرج 2</td><td>يفسر ظهور أفراد معاد تركيبهم (مؤتلفين) بنسبة قليلة نتيجة العبور</td><td class=\"lv\">تحليل</td></tr><tr><td class=\"c\">المخرج الآخر</td><td>يحسب نسبة الأفراد المؤتلفين من نتائج تلقيح اختباري</td><td class=\"lv\">تطبيق</td></tr></table>","<div class=\"chips\"><span class=\"chip\">التعلم بالنمذجة</span><span class=\"chip\">التعلم المبني على حل المشكلات</span></div>","<div class=\"chips\"><span cla
