دة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. تسجيل النشيد الملحّن ومسرح الدمى", "1. النشيد\n2. الإيقاع\n3. أنا نظيف", "تعرض المعلمة صفحة النشيد وتمهد بقصة قصيرة عن موضوعه، ثم تسأل: عمّ تتوقعون أن يتحدث النشيد؟ (5 دقائق)", "1. الاستماع إلى النشيد: تعرض المعلمة النشيد وتنشده ملحّنًا مرتين، ويستمع التلميذ وينصت (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. معاني الكلمات: توضح المعلمة الكلمات الجديدة بالصور والتمثيل (تقويم تكويني)، ويربط التلميذ الكلمة بمعناها (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. فكرة النشيد: تسأل المعلمة: عمّ يتحدث النشيد؟ ما القيمة التي يدعو إليها؟ ويعبّر التلميذ عن فكرة النشيد بجملة (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ما عنوان النشيد»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الحفظ بالترديد: تنشد المعلمة البيت وتردده المجموعات بالتناوب، ويردد التلميذ الأبيات حتى يحفظها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الإنشاد المعبّر: تنمذج المعلمة الإيماءات لكل بيت (تقويم تكويني)، وينشد التلميذ مع الإيماءات ولغة الجسد (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. منافسة الإنشاد: تقيّم المعلمة أداء المجموعات وتعزز الأسرع حفظًا، وتنشد كل مجموعة ويقيّم الزملاء الأداء (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n9. غلق الدرس – أبطال النظافة في عمان: يقسّم المعلم الأطفال إلى مجموعات تنشد كل منها مقطعًا من النشيد مع حركة تمثل عملًا نظيفًا، كغسل اليدين وتنظيف الشارع، ثم يقولون معًا: «عمان نظيفة بأيدينا» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان النشيد؟\nالإجابة: «نشيد النظافة».\nس2 (مستوى التطبيق): أنشد بيتًا من النشيد.\nالإجابة: إنشاد صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي يدعو إليها النشيد؟\nالإجابة: قيمة متصلة بمحور «أنا نظيف».\n\n• نشاط علاجي (لمن لم يتقن): ينشد المعلم مع التلميذ بيتًا من «نشيد النظافة» ويمثّلان معانيه بحركات (غسل اليدين، تنظيف الأسنان)، ويكرره التلميذ مع زميل؛ وللتحقق يسأله: ما عنوان النشيد؟ ثم ينشد البيت وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم لوحة مصورة لعادات النظافة الواردة في «نشيد النظافة» وأداء النشيد بحركات معبّرة، ثم يشرحون لزملائهم لماذا نحافظ على النظافة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أنشد النشيد مع زملائك.\nالإجابة: إنشاد جماعي صحيح.\nس2 (مستوى التطبيق): اذكر كلمة من النشيد فيها حرف من حروف المحور.\nالإجابة: كلمة صحيحة.\nس3 (مستوى الاستدلال): عبّر عن مشاعرك تجاه موضوع النشيد بجملة.\nالإجابة: جملة معبّرة صحيحة.", "للطالب: ينشد نشيد «نشيد النظافة» لأسرته (دليل المعلم ص 314–317).\nلولي الأمر: يستمع إلى إنشاد طفله ويشجعه.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=25"]}]}, {"t": "قراءة تشاركية – المحور الثالث", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "القراءة", "p": ["قبل القراءة: التعريف بقصة المحور وتوقع أحداثها من الغلاف والعنوان", "أثناء القراءة: القراءة التشاركية الجهرية ومتابعة الصور"], "w": "الأسبوع الحادي عشر", "f": ["1. يشارك في القراءة التشاركية لقصة المحور (20 دقيقة)\n2. يتوقع أحداث القصة من الصور والعنوان (25 دقيقة)\n3. يحدد شخصيات القصة وأحداثها (15 دقيقة)\nمخرج تعليمي آخر:\n- يربط القصة بقيم محور «أنا نظيف» (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج الآخر: تقييم", "1. التعلم التشاركي\n2. التعلم التعاوني\n3. التعلم بالاكتشاف\n4. التعلم الذاتي\n5. التعلم المبني على اللعب\n6. فكر – زاوج – شارك", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. قصة المحور من سلسلة القراءة التشاركية", "1. القصة\n2. العنوان\n3. الشخصيات\n4. الأحداث", "تجلس المعلمة مع المتعلمين في ركن القراءة وتعرض قصة المحور، وتسأل: ماذا ترون على الغلاف؟ (5 دقائق)", "1. التعريف بالسلسلة: تعرّف المعلمة بسلسلة القراءة التشاركية وتعرض غلاف قصة المحور وعنوانها، ويتأمل التلميذ الغلاف ويقرأ العنوان مع المعلمة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أتوقع: تسأل المعلمة: من الشخصيات؟ أين تقع الأحداث؟ ماذا سيحدث؟ (تقويم تكويني)، ويتوقع التلميذ الأحداث من الصور (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. كلمات القصة: تعرض كلمات مفتاحية من القصة بالصور، ويقرأ التلميذ الكلمات مع المعلمة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. القراءة النموذجية: تقرأ المعلمة القصة قراءة جهرية معبّرة وتشير إلى الكلمات، ويتابع التلميذ بإصبعه وينظر إلى الصور (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. القراءة المشتركة: تتوقف المعلمة لتكمل المجموعات الكلمات المتكررة (تقويم تكويني)، ويشارك التلميذ في قراءة الكلمات المتكررة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. هل صدق توقعي؟: تقارن المعلمة الأحداث بالتوقعات، ويقارن التلميذ ويعلّق (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «لماذا تصرفت الشخصية هكذا في رأيك»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n10. غلق الدرس – من القصة إلى حيّنا: يتحدث كل زوج عن تصرف نظيف قامت به شخصية في القصة، ثم يقترحان عملًا مشابهًا يقومان به في الحي أو المسجد أو الحديقة العامة، ويعرضانه بجملة قصيرة (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان القصة؟\nالإجابة: عنوان قصة المحور.\nس2 (مستوى التطبيق): من الشخصية الرئيسة في القصة؟\nالإجابة: ذكر الشخصية.\nس3 (مستوى الاستدلال): لماذا تصرفت الشخصية هكذا في رأيك؟\nالإجابة: تعليل منطقي من أحداث القصة.\n\n• نشاط علاجي (لمن لم يتقن): يتصفح المعلم مع التلميذ صور قصة محور «أنا نظيف»، ويطرح عند كل صورة سؤالًا بسيطًا (من؟ ماذا يفعل؟) ويساعده زميل؛ وللتحقق يسأله: ما عنوان القصة؟ ومن شخصيتها الرئيسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب صور مشاهد قصة محور «أنا نظيف» وسرد أحداثها، ثم يعلل كل منهم تصرف الشخصية الرئيسة ويذكر عادة نظافة تعلمها منها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا حدث في بداية القصة؟\nالإجابة: ذكر الحدث الأول.\nس2 (مستوى التطبيق): رتّب ثلاث صور من القصة.\nالإجابة: ترتيب صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي تعلّمتها من القصة؟\nالإجابة: قيمة متصلة بمحور «أنا نظيف».", "للطالب: يحكي قصة المحور لأسرته.\nلولي الأمر: يقرأ مع طفله قصة قصيرة ويسأله عن شخصياتها.\nالمرجع: كتاب الطالب: لا يتضمن القصة (سلسلة القراءة التشاركية غير متوفرة لديّ).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=26"]}]}, {"t": "حرف ء (الهمزة): أنا وعلبة الغذاء", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ء وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «أنا وعلبة الغذاء»"], "w": "الأسبوع الحادي عشر", "f": ["1. يتعرّف حرف ء (الهمزة) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ء من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ء (10 دقائق)\n4. يستمع إلى نص «أنا وعلبة الغذاء» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: شكر الله على نعمة الغذاء (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. الحوار والمناقشة\n10. فكر – زاوج – شارك", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ء وألوان", "1. حرف الهمزة\n2. الصوت\n3. أنشودة الحروف\n4. الغذاء\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. الإفطار", "تعرض المعلمة بطاقة كبيرة لحرف ء، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «أنا وعلبة الغذاء». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ء أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ء من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ء، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا أرنب» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ء (تقويم تكويني)، ويشير التلميذ إلى حرف ء في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن حرف ء (الهمزة): أنا وعلبة الغذاء، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ء بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: شكر الله على نعمة الغذاء (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «رتّب حدثين من أحداث النص»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. غلق الدرس – ماذا في علبتي؟: يصف كل طفل لزميله بجملة تامة ما في علبة غذائه من خيرات عمان كالتمر واللبن، ويخمّن زميله ما وصفه، ويرفع الزملاء أيديهم عند سماع كلمة فيها الهمزة مثل: ماء، غذاء، ثم يقولان: «نأكل غذاءً صحيًا من خيرات بلادنا» (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ء»؟\nالإجابة: الهمزة.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: شكر الله على نعمة الغذاء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي أرنب وأسد ويبرز صوت الهمزة في أولهما، ثم يرسم التلميذ الهمزة الصغيرة «ء» فوق الألف في بطاقة ويلوّنها؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم علبة غذاء صحية وتسمية أطعمة ومشروبات فيها همزة (أرز، إجاص، ماء)، ثم يقول كل منهم جملة يشكر فيها الله على نعمة الغذاء كما في نص «أنا وعلبة الغذاء».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ء.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ء: «فَأْرٌ» أم «سَبّورةٌ»؟\nالإجابة: «فَأْرٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ء في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «أنا وعلبة الغذاء» بأسلوبه (دليل المعلم ص 324–331 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ء ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=27"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ء مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ء مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ء"], "w": "الأسبوع الحادي عشر – الأسبوع الثاني عشر", "f": ["1. ينطق صوت حرف ء مع الفتحة والضمة والكسرة: أَ، أُ، إِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ء في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ء مع المدود: آ، أو، إي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (أَ ← آ) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ء مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «أَحْمِلُ عُلْبةَ الغِذاءِ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «أَرْنَبٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ء (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ء قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «أَحْمِلُ عُلْبةَ الغِذاءِ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ء من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني\n9. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «أَرْنَبٌ» وتقرؤها بإطالة صوت ء، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة أَ، أُ، إِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: أَسَدٌ (أول)، فَأْرٌ (وسط)، ماءٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات أَ، أُ، إِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «أين حرف ء في كلمة «سَماءٌ»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. المدود الثلاثة: تعرض المعلمة آ، أو، إي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: أَرْنَبٌ، بِئْرٌ، سَماءٌ، ثم الجملة «أَحْمِلُ عُلْبةَ الغِذاءِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الدرس، ويبدأ المعلم بسؤال «اقرأ الجملة: «أَحْمِلُ عُلْبةَ الغِذاءِ.»» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n11. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. من الكلمة إلى المقطع والصوت: تقسم المعلمة «أَرْنَبٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n13. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ء (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. أجرّد الحرف: تكتب المعلمة إِبْريقٌ، رَأْسٌ، غِذاءٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ء في كل كلمة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n15. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n16. غلق الدرس – سلة الخيرات: تضع المعلمة في سلة بطاقات كلمات فيها الهمزة مثل: ماء، غذاء، أرنب، ويسحب طفل من كل مجموعة بطاقة ويقرؤها ويحدد موقع الهمزة فيها، ثم تذكر المجموعة غذاءً عمانيًا تحبه وتحمله في علبة غذائها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: أَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: أُ أم أو؟\nالإجابة: أو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ء من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي أرنب وأسد ويبرز صوت الهمزة في أولهما، ثم يرسم التلميذ الهمزة الصغيرة «ء» فوق الألف في بطاقة ويلوّنها؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم علبة غذاء صحية وتسمية أطعمة ومشروبات فيها همزة (أرز، إجاص، ماء)، ثم يقول كل منهم جملة يشكر فيها الله على نعمة الغذاء كما في نص «أنا وعلبة الغذاء».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ء في كلمة «رَأْسٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ء في كلمة «سَماءٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «بِئْرٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع أَ، أُ، إِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «أَحْمِلُ عُلْبةَ الغِذاءِ.»؛ يرتب كلمات الجملة «أَحْمِلُ عُلْبةَ الغِذاءِ.» ويقرؤها (دليل المعلم ص 324–331 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ء.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=27"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ء وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الثاني عشر", "f": ["1. يتعرّف أشكال حرف ء: أ، إ، ؤ، ئ، ء (10 دقائق)\n2. يكتب حرف ء بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (10 دقائق)\n3. ينسخ جملة «أَحْمِلُ عُلْبةَ الغِذاءِ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم المبني على اللعب\n4. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ء كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: أ، إ، ؤ، ئ، ء، وتبيّن أن للحرف خمسة أشكال تقريبًا بحسب موضعها، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: أَرْنَبٌ، ماءٌ، ثم الجملة «أَحْمِلُ عُلْبةَ الغِذاءِ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «انسخ الجملة: «أَحْمِلُ عُلْبةَ الغِذاءِ.»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – علبة غذاء عمانية: تختار كل مجموعة ما تضعه في علبة غذاء صحية من خيرات عمان مثل: التمر واللبن والموز، ويذكر الأطفال كلمات فيها الهمزة مثل: ماء، غذاء، ثم يعرضون اختيارهم على الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ء منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ء؟\nالإجابة: خمسة أشكال تقريبًا بحسب موضعها.\nس3 (مستوى الاستدلال): اكتب كلمة «فَأْرٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي أرنب وأسد ويبرز صوت الهمزة في أولهما، ثم يرسم التلميذ الهمزة الصغيرة «ء» فوق الألف في بطاقة ويلوّنها؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم علبة غذاء صحية وتسمية أطعمة ومشروبات فيها همزة (أرز، إجاص، ماء)، ثم يقول كل منهم جملة يشكر فيها الله على نعمة الغذاء كما في نص «أنا وعلبة الغذاء».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: أَ أُ إِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «أَحْمِلُ عُلْبةَ الغِذاءِ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ء لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ء بأشكاله وينسخ الجملة (دليل المعلم ص 324–331 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=27"]}]}, {"t": "حرف ج (الجيم): وجبتي المفضلة", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "التحدث", "p": ["أتحدث: التعبير عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ج", "أستمع وأجيب: نص الاستماع «وجبتي المفضلة»"], "w": "الأسبوع الثاني عشر", "f": ["1. يتحدث عن لوحة الدرس بجمل تامة (10 دقائق)\n2. يتوقع أحداثًا من تفاصيل اللوحة (10 دقائق)\n3. يوظّف في حديثه كلمات فيها حرف ج (10 دقائق)\n4. يستمع إلى نص «وجبتي المفضلة» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يلتزم آداب التحدث: الإنصات وعدم المقاطعة (10 دقائق)\n- يستنتج قيمة النص: الاعتماد على النفس وشكر نعمة الغذاء (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التشاركي\n2. التعلم بالاكتشاف\n3. التعلم التعاوني\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم الذاتي\n9. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. الوسائل المتعددة (سمعية - بصرية)", "1. آداب التحدث\n2. الجملة التامة\n3. الوجبة\n4. المفضلة\n5. الاستماع\n6. الشخصيات\n7. الأحداث", "تعرض المعلمة لوحة «أتحدث» وتسأل: ماذا ترون؟ وماذا تتوقعون أن يحدث؟ ثم تذكّر بآداب التحدث الخمسة. (5 دقائق)", "1. أسئلة اللوحة: تطرح المعلمة أسئلة تكون إجابتها جملة تامة: ما هذا؟ من هؤلاء؟ ماذا يفعلون؟ ويجيب التلميذ بجمل تامة مثل: «هذا جمل» (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أتوقع: تسأل المعلمة: برأيك عمّ يتحدثون؟ ماذا سيحدث بعد ذلك؟ (تقويم تكويني)، ويتوقع أحداثًا ويبرّر توقعه (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كلمات فيها ج: تطلب كلمات من اللوحة فيها حرف ج وتكتبها على السبورة، ويذكر كلمات مثل: جَزَرٌ، نَجْمةٌ (7 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. القيمة: تستقرئ المعلمة معهم قيمة اللوحة: الاعتماد على النفس وشكر نعمة الغذاء، ويبدي التلميذ رأيه في القيمة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ج بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: الاعتماد على النفس وشكر نعمة الغذاء (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n11. غلق الدرس – أحاور الطاهي: يمثّل كل زوج حوارًا قصيرًا بين طفل وطاهٍ في مطعم عماني، يسأل الطفل عن وجبة فيها حرف الجيم مثل: الدجاج والجبن، ويجيب الطاهي بجملة تامة، ثم يشكره الطفل بأدب ويقول: «أحب أكلات بلادي عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا ترى في اللوحة؟\nالإجابة: جملة تامة تصف ما في اللوحة.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: الاعتماد على النفس وشكر نعمة الغذاء.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي جمل وجزر وينطق الكلمتين، ويشكّل التلميذ حرف ج بالصلصال ويضع نقطته في بطنه، ثم يلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بوصف وجبتهم المفضلة بجمل تامة توظف كلمات فيها حرف ج (دجاج، جبن، جزر)، ثم يتوقعون من لوحة درس «وجبتي المفضلة» ماذا يحدث بعد الوجبة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ج.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): كوّن جملة تامة فيها كلمة «نَجْمةٌ».\nالإجابة: جملة صحيحة تامة.\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يتحدث مع أسرته عن لوحة الدرس بثلاث جمل؛ يحكي لأسرته نص «وجبتي المفضلة» بأسلوبه (دليل المعلم ص 339–352 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يحاور طفله عن اللوحة ويشجعه على الإجابة بجمل تامة بالفصحى؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=28"]}, {"k": "القراءة", "p": ["التعرف البصري إلى حرف ج وإنشاد بيته من أنشودة الحروف", "ألاحظ: صوت حرف ج مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ج مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ج"], "w": "الأسبوع الثاني عشر – الأسبوع الثالث عشر", "f": ["1. يتعرّف حرف ج (الجيم) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ج من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يذكر كلمات يسمع فيها صوت حرف ج مثل: جَمَلٌ، جَزَرٌ (10 دقائق)\n4. ينطق صوت حرف ج مع الفتحة والضمة والكسرة: جَ، جُ، جِ (10 دقائق)\n5. يميّز سمعيًا موقع حرف ج في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n6. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n7. يقرأ حرف ج مع المدود: جا، جو، جي (10 دقائق)\n8. يميّز نطقًا بين المقطع القصير والطويل (جَ ← جا) (15 دقيقة)\n9. يقرأ كلمات وجملًا فيها حرف ج مستعينًا بالصور (5 دقائق)\n10. يحلل جملة «هذهِ وَجْبَتي المُفَضَّلةُ.» إلى كلمات (10 دقائق)\n11. يحلل كلمة «جَمَلٌ» إلى مقاطع وأصوات (10 دقائق)\n12. يركّب كلمات من مقاطع فيها حرف ج (10 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (10 دقائق)\n- يقرأ مقاطع قصيرة بحرف ج قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «هذهِ وَجْبَتي المُفَضَّلةُ.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف ج من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: فهم\nالمخرج 7: تطبيق\nالمخرج 8: تحليل\nالمخرج 9: تطبيق\nالمخرج 10: تحليل\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تطبيق\nالمخرج الآخر 4: تحليل", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. التعلم التعاوني\n10. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ج وألوان\n8. بطاقات المقاطع وبطاقات الحركات\n9. صورة توضيحية\n10. بطاقات كلمات مصورة\n11. بطاقات الجملة والكلمات والمقاطع", "1. حرف الجيم\n2. الصوت\n3. أنشودة الحروف\n4. الوجبة\n5. الحركات القصيرة\n6. المقطع القصير\n7. موقع الحرف\n8. المقطع الطويل\n9. المد بالألف\n10. المد بالواو\n11. المد بالياء\n12. الجملة\n13. الكلمة\n14. المقطع\n15. التجريد", "تعرض المعلمة بطاقة كبيرة لحرف ج، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «وجبتي المفضلة». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ج أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ج (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ج من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. صيد الأصوات: تذكر كلمات (جَمَلٌ، دَجاجةٌ، ثَلْجٌ) وأخرى ليس فيها الحرف، وتطلب التصفيق عند سماع صوت ج (تقويم تكويني)، ويصفّق التلميذ عند سماع صوت الحرف (10 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. بطاقة الحرف: توزّع المعلمة بطاقة الحرف ليرسمه المتعلم في الهواء وعلى الطاولة بإصبعه، ويرسم التلميذ الحرف في الهواء ثم بإصبعه على الطاولة (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. ألاحظ: الحركات: تنطق المعلمة جَ، جُ، جِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. أين الحرف؟: تنطق كلمات: جَزَرٌ (أول)، دَجاجةٌ (وسط)، ثَلْجٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. لعبة المقاطع: توزّع المعلمة بطاقات جَ، جُ، جِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أكمل الفكرة: يبدأ المعلم جملة عن ألاحظ: صوت حرف ج مع الحركات القصيرة وموقعه في الكلمة، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n10. المدود الثلاثة: تعرض المعلمة جا، جو، جي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n11. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: جَمَلٌ، نَجْمةٌ، تاجٌ، ثم الجملة «هذهِ وَجْبَتي المُفَضَّلةُ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n13. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «ما المد في المقطع «جي»»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n15. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n16. من الكلمة إلى المقطع والصوت: تقسم المعلمة «جَمَلٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n17. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ج (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n18. أجرّد الحرف: تكتب المعلمة جُبْنٌ، شَجَرةٌ، بُرْجٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ج في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n19. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n20. غلق الدرس – سباق الهجن: يرسم المعلم مضمار سباق للهجن على السبورة، وكلما قرأ طفل مقطعًا أو كلمة فيها حرف الجيم (جَ، جُ، جِ، جا، جو، جي، جَمَلٌ) قراءة صحيحة تقدّم جمل مجموعته خطوة، ثم تقول المجموعة الفائزة جملة عن سباق الهجن من تراث عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ج»؟\nالإجابة: الجيم.\nس2 (مستوى التطبيق): أي المقطعين أطول: جُ أم جو؟\nالإجابة: جو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ج من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي جمل وجزر وينطق الكلمتين، ويشكّل التلميذ حرف ج بالصلصال ويضع نقطته في بطنه، ثم يلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بوصف وجبتهم المفضلة بجمل تامة توظف كلمات فيها حرف ج (دجاج، جبن، جزر)، ثم يتوقعون من لوحة درس «وجبتي المفضلة» ماذا يحدث بعد الوجبة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ج في كلمة «شَجَرةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ج: «دَجاجةٌ» أم «بَحْرٌ»؟\nالإجابة: «دَجاجةٌ».\nس3 (مستوى الاستدلال): اقرأ كلمة «نَجْمةٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يلوّن حرف ج في ص الدرس الأولى وينشد بيته؛ يقرأ مقاطع جَ، جُ، جِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «هذهِ وَجْبَتي المُفَضَّلةُ.»؛ يرتب كلمات الجملة «هذهِ وَجْبَتي المُفَضَّلةُ.» ويقرؤها (دليل المعلم ص 339–352 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ج ويبحث معه عن أشياء في البيت تبدأ به؛ يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ج.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=28"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ج وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الثالث عشر", "f": ["1. يتعرّف أشكال حرف ج: جـ (أول الكلمة)، ـجـ (وسطها)، ـج (آخرها متصلًا)، ج (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ج بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «هذهِ وَجْبَتي المُفَضَّلةُ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. الحوار والمناقشة\n4. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ج كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: جـ (أول الكلمة)، ـجـ (وسطها)، ـج (آخرها متصلًا)، ج (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: جَمَلٌ، ثَلْجٌ، ثم الجملة «هذهِ وَجْبَتي المُفَضَّلةُ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن أكتب: أشكال حرف ج وكتابته في كلمات وجملة، وأختبر تعلمي، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – جولة في المطبخ العماني: يذكر كل طفل أكلته العمانية المفضلة مثل: المجبوس أو الهريس أو العرسية، ويرفع زملاؤه أيديهم إذا سمعوا صوت حرف الجيم، ثم يتعلمون أن الأكلات العمانية جزء من تراثنا (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ج منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ج؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «دَجاجةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي جمل وجزر وينطق الكلمتين، ويشكّل التلميذ حرف ج بالصلصال ويضع نقطته في بطنه، ثم يلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بوصف وجبتهم المفضلة بجمل تامة توظف كلمات فيها حرف ج (دجاج، جبن، جزر)، ثم يتوقعون من لوحة درس «وجبتي المفضلة» ماذا يحدث بعد الوجبة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: جَ جُ جِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «هذهِ وَجْبَتي المُفَضَّلةُ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ج لم ترد في الدرس.\nالإجابة: كلمة اثًا ويبرّر توقعه (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كلمات فيها و: تطلب كلمات من اللوحة فيها حرف و وتكتبها على السبورة، ويذكر كلمات مثل: وَلَدٌ، سِوارٌ (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. القيمة: تستقرئ المعلمة معهم قيمة اللوحة: العادات الصحية في الغذاء، ويبدي التلميذ رأيه في القيمة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف و بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: العادات الصحية في الغذاء (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أستمع وأجيب: نص الاستماع «وجبة اليوم»، ويبدأ المعلم بسؤال «ما عنوان النص الذي استمعت إليه» (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n11. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n12. غلق الدرس – ضيف في المجلس: تمثّل كل مجموعة مجلسًا عمانيًا يستقبل ضيفًا، فيرحب به الأطفال بجمل تامة فيها حرف الواو مثل: «تفضل وجبة اليوم»، ويقدمون له القهوة والتمر المتخيلين، ثم يقولون: «إكرام الضيف من عاداتنا العمانية» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا ترى في اللوحة؟\nالإجابة: جملة تامة تصف ما في اللوحة.\nس2 (مستوى التطبيق): من شخصيات النص؟\n
