 لوحة الدرس", "أستمع وأجيب: نص الاستماع «بيت كبير»"], "w": "الأسبوع الثاني", "f": ["1. يتعرّف حرف ب (الباء) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ب من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ب (10 دقائق)\n4. يستمع إلى نص «بيت كبير» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (10 دقائق)\n- يستنتج قيمة النص: احترام الجد والجدة والترابط الأسري (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ب وألوان", "1. حرف الباء\n2. الصوت\n3. أنشودة الحروف\n4. الأسرة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. البشر", "تعرض المعلمة بطاقة كبيرة لحرف ب، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «بيت كبير». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ب أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ب من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ب، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا باب» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ب (تقويم تكويني)، ويشير التلميذ إلى حرف ب في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ب بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: احترام الجد والجدة والترابط الأسري (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن أستمع وأجيب: نص الاستماع «بيت كبير»، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «بيت كبير» فيها كلمة بحرف ب، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: باب، بخور، بساط، بيت، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ب»؟\nالإجابة: الباء.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ب.\nالإجابة: مثل: باب.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: احترام الجد والجدة والترابط الأسري.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ب مع صورتي باب وبطة، ويرسم التلميذ الحرف بإصبعه على الرمل وهو ينطق صوته، ثم يلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث في صورة نص «بيت كبير» عن أشياء فيها حرف ب (باب، حبل)، ثم يقول كل منهم جملة عن احترام الجد والجدة تضم كلمة فيها حرف ب.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى ال جواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «بابٌ» وتقرؤها بإطالة صوت ب، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة بَ، بُ، بِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: بَطّةٌ (أول)، عُلْبةٌ (وسط)، كَلْبٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات بَ، بُ، بِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة با، بو، بي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: بابٌ، سَبّورةٌ، ذَهَبٌ، ثم الجملة «عَبيرُ قُرْبَ البابِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «بابٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ب (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة بَيْتٌ، حُبوبٌ، عِنَبٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ب في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اقرأ المقاطع: بَ، بُ، بِ» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. غلق الدرس – سباق بطاقات حرف ب: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ب، ومنها كلمات من عمان مثل: باب، بخور، بساط، بيت، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: بَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: بُ أم بو؟\nالإجابة: بو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ب من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ب مع صورتي باب وبطة، ويرسم التلميذ الحرف بإصبعه على الرمل وهو ينطق صوته، ثم يلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث في صورة نص «بيت كبير» عن أشياء فيها حرف ب (باب، حبل)، ثم يقول كل منهم جملة عن احترام الجد والجدة تضم كلمة فيها حرف ب.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ب في كلمة «حُبوبٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «بي»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف ب في أولها وأخرى في آخرها.\nالإجابة: مثل: بيت، عنب.", "للطالب: يقرأ مقاطع بَ، بُ، بِ ويحدد موقع الحرف في ثلاث كلمات (كتاب الطالب ص 44–53). يقرأ المقاطع الطويلة والجملة «عَبيرُ قُرْبَ البابِ.» (كتاب الطالب ص 44–53). يرتب كلمات الجملة «عَبيرُ قُرْبَ البابِ.» ويقرؤها (كتاب الطالب ص 44–53).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ب.\nالمرجع: كتاب الطالب – الجزء الأول: ص 44–53.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=4"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ب وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الثاني", "f": ["1. يتعرّف أشكال حرف ب: بـ (أول الكلمة)، ـبـ (وسطها)، ـب (آخرها متصلًا)، ب (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ب بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «عَبيرُ قُرْبَ البابِ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ب كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: بـ (أول الكلمة)، ـبـ (وسطها)، ـب (آخرها متصلًا)، ب (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: بابٌ، كَلْبٌ، ثم الجملة «عَبيرُ قُرْبَ البابِ.» (تقويم تكو إلى حرف ل وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «غيرة ليلى»"], "w": "الأسبوع الثالث", "f": ["1. يتعرّف حرف ل (اللام) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ل من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ل (10 دقائق)\n4. يستمع إلى نص «غيرة ليلى» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: التعاطف وتقدير الذات واحترام أفراد الأسرة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ل وألوان", "1. حرف اللام\n2. الصوت\n3. أنشودة الحروف\n4. الغيرة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. البكاء", "تعرض المعلمة بطاقة كبيرة لحرف ل، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «غيرة ليلى». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ل أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ل من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ل، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا ليمون» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ل (تقويم تكويني)، ويشير التلميذ إلى حرف ل في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ل بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: التعاطف وتقدير الذات واحترام أفراد الأسرة (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. أكمل الفكرة: يبدأ المعلم جملة عن حرف ل (اللام): غيرة ليلى، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «غيرة ليلى» فيها كلمة بحرف ل، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: لبان، ليمون، لؤلؤ، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ل»؟\nالإجابة: اللام.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ل.\nالإجابة: مثل: ليمون.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: التعاطف وتقدير الذات واحترام أفراد الأسرة.\n\n• نشاط علاجي (لمن لم يتقن): يشكّل التلميذ حرف ل بالصلصال مع المعلم وينطق صوته، ثم يختار من بين صور (ليمون، لبن، موز) ما يبدأ بحرف ل؛ وللتحقق يعرض المعلم الحرف ويسأل: ما اسمه؟ ويطلب كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركات جديدة لبيت حرف ل وإنشاده، ثم يقترحون تصرفًا لطيفًا تعبّر به ليلى عن مشاعرها في نص «غيرة ليلى» بجملة فيها كلمة بحرف ل.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ل.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ل.\nالإجابة: مثل: «لَيْلى تَلْعَبُ مَعَ أَخيها.».", "للطالب: يلوّن حرف ل في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 54–63). يحكي لأسرته نص «غيرة ليلى» بأسلوبه (كتاب الطالب ص 54–63).\nلولي الأمر: يردد مع طفله بيت حرف ل ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 54–63.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=5"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ل مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ل مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ل"], "w": "الأسبوع الثالث", "f": ["1. ينطق صوت حرف ل مع الفتحة والضمة والكسرة: لَ، لُ، لِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ل في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ل مع المدود: لا، لو، لي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (لَ ← لا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ل مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «لَيْلى تَلْعَبُ مَعَ أَخيها.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «لَيْمونٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ل (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ل قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «لَيْلى تَلْعَبُ مَعَ أَخيها.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ل من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «لَيْمونٌ» وتقرؤها بإطالة صوت ل، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة لَ، لُ، لِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: لَبَنٌ (أول)، قَلَمٌ (وسط)، فيلٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات لَ، لُ، لِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة لا، لو، لي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: لَيْمونٌ، نَحْلةٌ، جَمَلٌ، ثم الجملة «لَيْلى تَلْعَبُ مَعَ أَخيها.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (4 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «لَيْمونٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ل (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة لُعْبةٌ، سُلَّمٌ، نَخيلٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ل في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «اذكر كلمتين: واحدة حرف ل في أولها وأخرى في آخرها»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. غلق الدرس – سباق بطاقات حرف ل: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ل، ومنها كلمات من عمان مثل: لبان، ليمون، لؤلؤ، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: لَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: لُ أم لو؟\nالإجابة: لو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ل من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يشكّل التلميذ حرف ل بالصلصال مع المعلم وينطق صوته، ثم يختار من بين صور (ليمون، لبن، موز) ما يبدأ بحرف ل؛ وللتحقق يعرض المعلم الحرف ويسأل: ما اسمه؟ ويطلب كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركات جديدة لبيت حرف ل وإنشاده، ثم يقترحون تصرفًا لطيفًا تعبّر به ليلى عن مشاعرها في نص «غيرة ليلى» بجملة فيها كلمة بحرف ل.", "أسئلة التقويم الختامي (5 دقائق):\n  بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: لَيْمونٌ، فيلٌ، ثم الجملة «لَيْلى تَلْعَبُ مَعَ أَخيها.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص أكتب: أشكال حرف ل وكتابته في كلمات وجملة، وأختبر تعلمي، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. غلق الدرس – لام اللبان والليمون: يتنافس الأطفال في أزواج على ذكر كلمات من عمان فيها حرف اللام مثل: لبان، ليمون، لؤلؤ، ثم يقول كل زوج جملة قصيرة عن حب الإخوة وتعاونهم في البيت كما في قصة ليلى (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ل منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ل؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «قَلَمٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يشكّل التلميذ حرف ل بالصلصال مع المعلم وينطق صوته، ثم يختار من بين صور (ليمون، لبن، موز) ما يبدأ بحرف ل؛ وللتحقق يعرض المعلم الحرف ويسأل: ما اسمه؟ ويطلب كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركات جديدة لبيت حرف ل وإنشاده، ثم يقترحون تصرفًا لطيفًا تعبّر به ليلى عن مشاعرها في نص «غيرة ليلى» بجملة فيها كلمة بحرف ل.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: لَ لُ لِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «لَيْلى تَلْعَبُ مَعَ أَخيها.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ل لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ل بأشكاله وينسخ الجملة (كتاب الطالب ص 54–63).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الأول: ص 54–63.\n🎮 را كّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف م، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا موز» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف م (تقويم تكويني)، ويشير التلميذ إلى حرف م في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف م بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: التعاون وآداب الزيارة والانتماء إلى الأسرة (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اذكر كلمة تبدأ بحرف م» على السبورة، ويناقش المعلم الإجابات مع الصف (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «أسرتي متعاونة» فيها كلمة بحرف م، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: ماء، مائدة، مسقط، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «م»؟\nالإجابة: الميم.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف م.\nالإجابة: مثل: موز.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: التعاون وآداب الزيارة والانتماء إلى الأسرة.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم كلمات مصورة (موز، مفتاح، قلم) ويصفق التلميذ عند سماع صوت الميم في أولها، ثم يتتبع حرف م المنقّط ويلوّنه؛ وللتحقق يسأله: ما اسم الحرف «م»؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مشهد تعاون أسري قصير مستوحى من نص «أسرتي متعاونة» يستعملون فيه كلمات بحرف م (مائدة، مكنسة، ماء)، ثم يعدّون الكلمات التي نطقوا فيها الميم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف م.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف م.\nالإجابة: مثل: «أُسْرَتي مُتَعاوِنةٌ.».", "للطالب: يلوّن حرف م في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 64–73). يحكي لأسرته نص «أسرتي متعاونة» بأسلوبه (كتاب الطالب ص 64–73).\nلولي الأمر: يردد مع طفله بيت حرف م ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 64–73.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=6"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف م مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف م مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف م"], "w": "الأسبوع الثالث", "f": ["1. ينطق صوت حرف م مع الفتحة والضمة والكسرة: مَ، مُ، مِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف م في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف م مع المدود: ما، مو، مي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (مَ ← ما) (15 دقيقة)\n6. يقرأ كلمات وجملًا فيها حرف م مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «أُسْرَتي مُتَعاوِنةٌ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «مَوْزٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف م (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف م قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «أُسْرَتي مُتَعاوِنةٌ.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف م من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تعرض كلمات مصورة: مَوْزٌ، تَمْرٌ، عَلَمٌ، ثم الجملة «أُسْرَتي مُتَعاوِنةٌ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (2 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «مَوْزٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف م (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة مَسْجِدٌ، قَمَرٌ، فَمٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف م في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص ألاحظ: صوت حرف م مع الحركات القصيرة وموقعه في الكلمة، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n14. غلق الدرس – سباق بطاقات حرف م: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف م، ومنها كلمات من عمان مثل: ماء، مائدة، مسقط، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: مَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: مُ أم مو؟\nالإجابة: مو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف م من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم كلمات مصورة (موز، مفتاح، قلم) ويصفق التلميذ عند سماع صوت الميم في أولها، ثم يتتبع حرف م المنقّط ويلوّنه؛ وللتحقق يسأله: ما اسم الحرف «م»؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم ال السبورة، ويذكر كلمات مثل: ريشةٌ، فَراشةٌ (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. القيمة: تستقرئ المعلمة معهم قيمة اللوحة: الانتماء إلى الأسرة واحترام أفرادها، ويبدي التلميذ رأيه في القيمة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ر بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: الانتماء إلى الأسرة واحترام أفرادها (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «رقية مسرورة» فيها كلمة بحرف ر، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: رمان الجبل الأخضر، رطب، رمل، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا ترى في اللوحة؟\nالإجابة: جملة تامة تصف ما في اللوحة.\nس2 (مستوى التطبيق): اذكر كلمة من اللوحة فيها حرف ر.\nالإجابة: مثل: ريشة.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: الانتماء إلى الأسرة واحترام أفرادها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي رمان وريشة وينطق الكلمتين مع إبراز صوت الراء، ويكرر التلميذ ثم يرسم الحرف في الهواء وعلى السبورة؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتأمل لوحة درس «رقية مسرورة» وتوقع سبب سرور رقية، ثم يقول كل منهم جملة تامة فيها كلمتان بحرف ر، مثل: رقية ترسم ريشة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ر.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): ما القيمة التي تعلّمتها من اللوحة؟\nالإجابة: الانتماء إلى الأسرة واحترام أفرادها.", "للطالب: يتحدث مع أسرته عن لوحة الدرس بثلاث جمل (كتاب الطالب ص 74–83). يحكي لأسرته نص «رقية مسرورة» بأسلوبه (كتاب الطالب ص 74–83).\nلولي الأمر: يحاور طفله عن اللوحة ويشجعه على الإجابة بجمل تامة بالفصحى. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 74–83.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=7"]}, {"k": "القراءة", "p": ["التعرف البصري إلى حرف ر وإنشاد بيته من أنشودة الحروف", "ألاحظ: صوت حرف ر مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ر مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ر"], "w": "الأسبوع الرابع", "f": ["1. يتعرّف حرف ر (الراء) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ر من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يذكر كلمات يسمع فيها صوت حرف ر مثل: رُمّانٌ، ريشةٌ (15 دقيقة)\n4. ينطق صوت حرف ر مع الفتحة والضمة والكسرة: رَ، رُ، رِ (10 دقائق)\n5. يميّز سمعيًا موقع حرف ر في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n6. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n7. يقرأ حرف ر مع المدود: را، رو، ري (10 دقائق)\n8. يميّز نطقًا بين المقطع القصير والطويل (رَ ← را) (15 دقيقة)\n9. يقرأ كلمات وجملًا فيها حرف ر مستعينًا بالصور (5 دقائق)\n10. يحلل جملة «رُقَيّةُ مَسْرورةٌ.» إلى كلمات (10 دقائق)\n11. يحلل كلمة «رُمّانٌ» إلى مقاطع وأصوات (10 دقائق)\n12. يركّب كلمات من مقاطع فيها حرف ر (10 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يقرأ مقاطع قصيرة بحرف ر قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «رُقَيّةُ مَسْرورةٌ.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف ر من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: فهم\nالمخرج 7: تطبيق\nالمخرج 8: تحليل\nالمخرج 9: تطبيق\nالمخرج 10: تحليل\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تطبيق\nالمخرج الآخر 4: تحليل", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. التعلم التعاوني\n6. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. صورة توضيحية\n8. أخرى: بطاقة حرف ر وألوان، بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. حرف الراء\n2. الصوت\n3. أنشودة الحروف\n4. مسرورة\n5. الحركات القصيرة\n6. المقطع القصير\n7. موقع الحرف\n8. المقطع الطويل\n9. المد بالألف\n10. المد بالواو\n11. المد بالياء\n12. الجملة\n13. الكلمة\n14. المقطع\n15. التجريد", "تعرض المعلمة بطاقة كبيرة لحرف ر، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «رقية مسرورة». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ر أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ر (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ر من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. صيد الأصوات: تذكر كلمات (رُمّانٌ، بُرْتُقالٌ، قَمَرٌ) وأخرى ليس فيها الحرف، وتطلب التصفيق عند سماع صوت ر (تقويم تكويني)، ويصفّق التلميذ عند سماع صوت الحرف (11 دقيقة)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. بطاقة الحرف: توزّع المعلمة بطاقة الحرف ليرسمه المتعلم في الهواء وعلى الطاولة بإصبعه، ويرسم التلميذ الحرف في الهواء ثم بإصبعه على الطاولة (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. ألاحظ: الحركات: تنطق المعلمة رَ، رُ، رِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. أين الحرف؟: تنطق كلمات: ريشةٌ (أول)، بُرْتُقالٌ (وسط)، قَمَرٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. لعبة المقاطع: توزّع المعلمة بطاقات رَ، رُ، رِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n8. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. المدود الثلاثة: تعرض المعلمة را، رو، ري وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: رُمّانٌ، فَراشةٌ، نَمِرٌ، ثم الجملة «رُقَيّةُ مَسْرورةٌ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n12. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (2 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. من الكلمة إلى المقطع والصوت: تقسم المعلمة «رُمّانٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n15. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ر (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n16. أجرّد الحرف: تكتب المعلمة رَسّامٌ، زَرافةٌ، بَحْرٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ر في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n17. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «قل جملة تامة فيها كلمتان بهما حرف ر» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n18. غلق الدرس – سباق بطاقات حرف ر: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ر، ومنها كلمات من عمان مثل: رمان الجبل الأخضر، رطب، رمل، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ر»؟\nالإجابة: الراء.\nس2 (مستوى التطبيق): أي المقطعين أطول: رُ أم رو؟\nالإجابة: رو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ر من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي رمان وريشة وينطق الكلمتين مع إبراز صوت الراء، ويكرر التلميذ ثم يرسم الحرف في الهواء وعلى السبورة؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتأمل لوحة درس «رقية مسرورة» وتوقع سبب سرور رقية، ثم يقول كل منهم جملة تامة فيها كلمتان بحرف ر، مثل: رقية ترسم ريشة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ر في كلمة «زَرافةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ر في كلمة «نَمِرٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ر.\nالإجابة: مثل: «رُقَيّةُ مَسْرورةٌ.».", "للطالب: يلوّن حرف ر في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 74–83). يقرأ مقاطع رَ، رُ، رِ ويحدد موقع الحرف في ثلاث كلمات (كتاب الطالب ص 74–83). يقرأ المقاطع الطويلة والجملة «رُقَيّةُ مَسْرورةٌ.» (كتاب الطالب ص 74–83). يرتب كلمات الجملة «رُقَيّةُ مَسْرورةٌ.» ويقرؤها (كتاب الطالب ص 74–83).\nلولي الأمر: يردد مع طفله بيت حرف ر ويبحث معه عن أشياء في البي عاوِنةٌ.» / «رُقَيّةُ مَسْرورةٌ.»، ويقرأ التلميذ الجمل قراءة سليمة (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n6. طابق الكلمة بالصورة: توزّع المعلمة بطاقات كلمات وصور على المجموعات (تقويم تكويني)، وتطابق المجموعة الكلمة بصورتها (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n7. أسمع وأميّز: تنطق كلمات من دروس الحروف وتطلب رفع بطاقة الحرف المسموع، ويرفع التلميذ بطاقة الحرف الصحيح (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أين الحرف؟: تعرض كلمات: عُلْبةٌ، قَلَمٌ، سَمَكةٌ، بُرْتُقالٌ وتطلب تحديد موقع الحرف (تقويم تكويني)، ويحدد التلميذ الموقع: أول/وسط/آخر (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n9. صندوق الحروف: تضع المعلمة بطاقات أشكال الحروف في صندوق وتسحب بطاقة، ويسمّي التلميذ الحرف ويذكر كلمة فيه (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. أحلل: تعرض المعلمة جملة «عَبيرُ قُرْبَ البابِ.» وتحللها مع المتعلمين، ويحلل التلميذ الجملة إلى كلمات ومقاطع (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. أركّب: توزّع المعلمة مقاطع لتركيب كلمات (تقويم تكويني)، ويركّب كلمات ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n12. أرتب الجملة: توزّع كلمات جملة «رُقَيّةُ مَسْرورةٌ.» مبعثرة، ويرتب التلميذ الكلمات ويقرأ الجملة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «اقرأ صف المقاطع الطويلة لحروف (ب، ل، م، ر)»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. غلق الدرس – قطار حروف بلادي: يقرأ أطفال كل مجموعة مقاطع قصيرة وطويلة على السبورة (بَ، با، لو، مي، رِ…) كأنهم عربات قطار، ثم يقول كل طفل كلمة عن عمان تبدأ بأحد الحروف مثل: مسقط، بحر، رمل، لبان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: بُ\nالإجابة: قراءة صحيحة بالضمة.\nس2 (مستوى التطبيق): أين حرف ر في «بُرْتُقالٌ»؟\nالإجابة: في وسطها.\nس3 (مستوى الاستدلال): ركّب كلمة من مقطعين وأضفها إلى جملة.\nالإجابة: كلمة وجملة صحيحتان.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم بطاقة حرف ب أمام  آخر:\n- يعتز بإنجازه في المحور الأول (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. أخرى: بطاقات الحروف والمقاطع", "1. حروف المحور: ب\n2. ل\n3. م\n4. ر\n5. المقطع\n6. الكلمة\n7. الجملة", "تعرض المعلمة بطاقات حروف (ب، ل، م، ر) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. أشكال الحروف: تعرض المعلمة أشكال كل حرف وتنمذج كتابته، ويكتب التلميذ الأشكال في الدفتر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أنسخ: تكتب كلمات وجمل الدروس على السبورة (تقويم تكويني)، وينسخ التلميذ بخط واضح مراعيًا المسافات (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. معرض الخط: تعرض المعلمة أجمل الكتابات على لوحة الصف، ويقيّم التلميذ كتابته وكتابة زميله بنجمة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الكتابة: أشكال حروف (ب، ل، م، ر) ونسخ كلمات وجمل، ويبدأ المعلم بسؤال «اقرأ كلمة «سَبّورةٌ»» (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. غلق الدرس – معرض خط بلادي: تكتب كل مجموعة بخط واضح كلمة عن عمان من حروف المحور (بحر، رمل، لبان، مسقط) على بطاقة، وتعلّقها في معرض الخط على لوحة الصف، ثم يقرأ الأطفال الكلمات معًا ويصفّقون للمجموعة الأجمل خطًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ب في أول الكلمة.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): انسخ كلمة «قَمَرٌ».\nالإجابة: نسخ صحيح.\nس3 (مستوى الاستدلال): انسخ جملة «رُقَيّةُ مَسْرورةٌ.» مراعيًا المسافات.\nالإجابة: نسخ صحيح منظم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم بطاقة حرف ب أمام بطاقات الحركات والمدود ويقرأ مع التلميذ: بَ بُ بِ ثم با بو بي مع مدّ اليد للمد، ويكرر ذلك مع حرف ر؛ وللتحقق يقرأ التلميذ مقطعًا مثل «بُ» أو «ري».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتركيب كلمات من بطاقات مقاطع حروف (ب، ل، م، ر) مثل: بابٌ، ريمُ، رامي، مالي، وقراءتها، ثم يفرزون مقاطع ورقية إلى مجموعتي «قصير» و«طويل».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ هذا الحرف: ر\nالإجابة: الراء.\nس2 (مستوى التطبيق): اقرأ كلمة «سَبّورةٌ».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): اكتب جملة قصيرة فيها كلمة من دروس حروف (ب، ل، م، ر).\nالإجابة: جملة صحيحة.", "للطالب: يراجع حروف (ب، ل، م، ر) قراءة وكتابة (كتاب الطالب ص 84–88).\nلولي الأمر: يراجع مع طفله الحروف ويملي عليه كلمتين.\nالمرجع: كتاب الطالب – الجزء الأول: ص 84–88.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=8"]}]}, {"t": "النشيد: أمي وأبي", "u": "المحور الأول: هنا أعيش", "s": [{"k": "القراءة", "p": ["الاستماع إلى نشيد «أمي وأبي» وفهم معانيه", "حفظ نشيد «أمي وأبي» وإنشاده بالإيماءات ولغة الجسد"], "w": "الأسبوع الخامس", "f": ["1. يستمع إلى نشيد «أمي وأبي» وينشده بصوت جميل (20 دقيقة)\n2. يعبّر عن فكرة النشيد بلغته (14 دقيقة)\n3. يتعرف معاني الكلمات الجديدة في النشيد (13 دقيقة)\n4. يستخدم الإيماءات ولغة الجسد للتعبير عن المشاعر في أثناء الإنشاد (20 دقيقة)\nمخرج تعليمي آخر:\n- يتمثّل قيمة المحور «هنا أعيش» (13 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التشاركي\n2. التعلم المبني على اللعب\n3. التعلم بالنمذجة", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: تسجيل النشيد الملحّن ومسرح الدمى", "1. النشيد\n2. الإيقاع\n3. هنا أعيش", "تعرض المعلمة صفحة النشيد وتمهد بقصة قصيرة عن موضوعه، ثم تسأل: عمّ تتوقعون أن يتحدث النشيد؟ (5 دقائق)", "1. الاستماع إلى النشيد: تعرض المعلمة النشيد وتنشده ملحّنًا مرتين، ويستمع التلميذ وينصت (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. معاني الكلمات: توضح المعلمة الكلمات الجديدة بالصور والتمثيل (تقويم تكويني)، ويربط التلميذ الكلمة بمعناها (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. فكرة النشيد: تسأل المعلمة: عمّ يتحدث النشيد؟ ما القيمة التي يدعو إليها؟ ويعبّر التلميذ عن فكرة النشيد بجملة (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الحفظ بالترديد: تنشد المعلمة البيت وتردده المجموعات بالتناوب، ويردد التلميذ الأبيات حتى يحفظها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الإنشاد المعبّر: تنمذج المعلمة الإيماءات لكل بيت (تقويم تكويني)، وينشد التلميذ مع الإيماءات ولغة الجسد (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. منافسة الإنشاد: تقيّم المعلمة أداء المجموعات وتعزز الأسرع حفظًا، وتنشد كل مجموعة ويقيّم الزملاء الأداء (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الاستماع إلى نشيد «أمي وأبي» وفهم معانيه، ويبدأ المعلم بسؤال «ما القيمة التي يدعو إليها النشيد» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. غلق الدرس – بر الوالدين تاج: يتعاون كل زوج في تمثيل موقف من بر الوالدين كما في النشيد: تقبيل يد الأم أو رأس الأب وحمل الأغراض عنهما، ثم ينشدان مقطعًا من النشيد معًا، فبر الوالدين من أجمل قيم الأسرة العمانية (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان النشيد؟\nالإجابة: «أمي وأبي».\nس2 (مستوى التطبيق): أنشد بيتًا من النشيد.\nالإجابة: إنشاد صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي يدعو إليها النشيد؟\nالإجابة: قيمة متصلة بمحور «هنا أعيش».\n\n• نشاط علاجي (لمن لم يتقن): ينشد المعلم مع التلميذ بيتًا واحدًا من نشيد «أمي وأبي» مقطعًا مقطعًا مع حركات يد تعبّر عن المعنى، ويعيده التلميذ مع زميل؛ وللتحقق يسأله: ما عنوان النشيد؟ ثم ينشد البيت وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركات معبّرة لأبيات نشيد «أمي وأبي» وأدائه أمام الصف، ثم يذكر كل منهم عملًا يبرّ به والديه في البيت ويربطه بمحور «هنا أعيش».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أنشد النشيد مع زملائك.\nالإجابة: إنشاد جماعي صحيح.\nس2 (مستوى التطبيق): اذكر كلمة من النشيد فيها حرف من حروف المحور.\nالإجابة: كلمة صحيحة.\nس3 (مستوى الاستدلال): عبّر عن مشاعرك تجاه موضوع النشيد بجملة.\nالإجابة: جملة معبّرة صحيحة.", "للطالب: ينشد نشيد «أمي وأبي» لأسرته (كتاب الطالب ص 89–90).\nلولي الأمر: يستمع إلى إنشاد طفله ويشجعه.\nالمرجع: كتاب الطالب – الجزء الأول: ص 89–90 خصية الرئيسة في القصة» على السبورة، ويناقش المعلم الإجابات مع الصف (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. غلق الدرس – أعيش في عمان وأحب: يرسم كل طفل في الهواء شيئًا يحبه في بيته أو حيه العماني، ويعرضه لزميله بجملة: «أنا أعيش في عمان وأحب…»، ثم يختار الزوجان جملة جميلة يقولانها للصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان القصة؟\nالإجابة: عنوان قصة المحور.\nس2 (مستوى التطبيق): من الشخصية الرئيسة في القصة؟\nالإجابة: ذكر الشخصية.\nس3 (مستوى الاستدلال): لماذا تصرفت الشخصية هكذا في رأيك؟\nالإجابة: تعليل منطقي من أحداث القصة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم عرض صور قصة محور «هنا أعيش» صورة صورة، ويشير إلى الشخصية الرئيسة ويسأل: من هذا؟ ماذا يفعل؟ ويساعده زميل في الإجابة؛ وللتحقق يسأله: ما عنوان القصة؟ ومن شخصيتها الرئيسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مشهد من قصة محور «هنا أعيش»، ثم يقترحون نهاية أخرى للقصة ويعللون تصرف الشخصية الرئيسة بجملة تبدأ بـ«لأن».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا حدث في بداية القصة؟\nالإجابة: ذكر الحدث الأول.\nس2 (مستوى التطبيق): رتّب ثلاث صور من القصة.\nالإجابة: ترتيب صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي تعلّمتها من القصة؟\nالإجابة: قيمة متصلة بمحور «هنا أعيش».", "للطالب: يحكي قصة المحور لأسرته.\nلولي الأمر: يقرأ مع طفله قصة قصيرة ويسأله عن شخصياتها.\nالمرجع: كتاب الطالب: لا يتضمن القصة (سلسلة القراءة التشاركية غير متوفرة لديّ).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=10"]}]}, {"t": "حرف د (الدال): المدرسة", "u": "المحور الثاني: هنا أتعلم", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف د وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «المدرسة»"], "w": "الأسبوع الخامس", "f": ["1. يتعرّف حرف د (الدال) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف د من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف د (10 دقائق)\n4. يستمع إلى نص «المدرسة» استماعًا جيدًا مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: الانضباط وحب المدرسة (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. أكمل الفكرة: يبدأ المعلم جملة عن حرف د (الدال): المدرسة، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «المدرسة» فيها كلمة بحرف د، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: دلّة، مدرسة، دار، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «د»؟\nالإجابة: الدال.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف د.\nالإجابة: مثل: ديك.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: الانضباط وحب المدرسة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور (ديك، دب، تفاحة) ويطلب من التلميذ التقاط ما يبدأ بصوت الدال، ثم يتتبع حرف د المنقّط ويلوّنه؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالتجول في الصف لاكتشاف أشياء فيها حرف د (دفتر، درج، مدرسة)، ثم يقول كل منهم جملة تامة عن الانضباط وحب المدرسة كما في نص «المدرسة» تضم كلمة بحرف د.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف د.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف د.\nالإجابة: مثل: «أَذْهَبُ إلى المَدْرَسةِ.».", "للطالب: يلوّن حرف د في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 94–105). يحكي لأسرته نص «المدرسة» بأسلوبه (كتاب الطالب ص
