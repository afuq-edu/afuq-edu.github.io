د بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «ديكٌ» وتقرؤها بإطالة صوت د، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة دَ، دُ، دِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: دُبٌّ (أول)، مَدْرَسةٌ (وسط)، يَدٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات دَ، دُ، دِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة دا، دو، دي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: ديكٌ، وَرْدةٌ، أَسَدٌ، ثم الجملة «أَذْهَبُ إلى المَدْرَسةِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «ديكٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف د (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة دَفْتَرٌ، بُنْدُقةٌ، وَلَدٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف د في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «أين حرف د في كلمة «مَدْرَسةٌ»»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. غلق الدرس – سباق بطاقات حرف د: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف د، ومنها كلمات من عمان مثل: دلّة، مدرسة، دار، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: دَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: دُ أم دو؟\nالإجابة: دو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف د من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور (ديك، دب، تفاحة) ويطلب من التلميذ التقاط ما يبدأ بصوت الدال، ثم يتتبع حرف د المنقّط ويلوّنه؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالتجول في الصف لاكتشاف أشياء فيها حرف د (دفتر، درج، مدرسة)، ثم يقول كل منهم جملة تامة عن الانضباط وحب المدرسة كما في نص «المدرسة» تضم كلمة بحرف د.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف د في كلمة «بُنْدُقةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «دي»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف د في أولها وأخرى في آخرها.\nالإجابة: مثل: دفتر، ولد.", "للطالب: يقرأ مقاطع دَ، دُ، دِ ويحدد موقع الحرف في ثلاث كلمات (كتاب الطالب ص 94–105). يقرأ المقاطع الطويلة والجملة «أَذْهَبُ إلى المَدْرَسةِ.» (كتاب الطالب ص 94–105). يرتب كلمات الجملة «أَذْهَبُ إلى المَدْرَسةِ.» ويقرؤها (كتاب الطالب ص 94–105).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف د.\nالمرجع: كتاب الطالب – الجزء الأول: ص 94–105.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=11"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف د وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الخامس", "f": ["1. يتعرّف أشكال حرف د: د (منفصلًا)، ـد (متصلًا بما قبله) (10 دقائق)\n2. يكتب حرف د بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «أَذْهَبُ إلى المَدْرَسةِ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف د كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: د (منفصلًا)، ـد (متصلًا بما قبله)، وتبيّن أن للحرف شكلان، ولا يتصل بما بعده، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: ديكٌ، يَدٌ، ثم الجملة «أَذْهَبُ إلى المَدْرَسةِ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أكتب: أشكال حرف د وكتابته في كلمات وجملة، وأختبر تعلمي، ويبدأ المعلم بسؤال «انسخ الجملة: «أَذْهَبُ إلى المَدْرَسةِ.»» (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس – دلّة الضيافة: يجلس الأطفال في حلقة ويمررون «دلّة» متخيلة، ومن تصله يقول كلمة فيها حرف الدال مثل: دلّة، مدرسة، دار، ثم يذكر المعلم أن الدلة رمز للكرم والضيافة العمانية (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف د منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف د؟\nالإجابة: شكلان، ولا يتصل بما بعده.\nس3 (مستوى الاستدلال): اكتب كلمة «مَدْرَسةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور (ديك، دب، تفاحة) ويطلب من التلميذ التقاط ما يبدأ بصوت الدال، ثم يتتبع حرف د المنقّط ويلوّنه؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالتجول في الصف لاكتشاف أشياء فيها حرف د (دفتر، درج، مدرسة)، ثم يقول كل منهم جملة تامة عن الانضباط وحب المدرسة كما في نص «المدرسة» تضم كلمة بحرف د.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: دَ دُ دِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «أَذْهَبُ إلى المَدْرَسةِ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف د لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف د بأشكاله وينسخ الجملة (كتاب الطالب ص 94–105).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الأول: ص 94–105.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=11"]}]}, {"t": "حرف س (السين): تحية الإسلام", "u": "المحور الثاني: هنا أتعلم", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف س وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «تحية الإسلام»"], "w": "الأسبوع الخامس – الأسبوع السادس", "f": ["1. يتعرّف حرف س (السين) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف س من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف س (10 دقائق)\n4. يستمع إلى نص «تحية الإسلام» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (10 دقائق)\n- يستنتج قيمة النص: إفشاء السلام بين الناس (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف س وألوان", "1. حرف السين\n2. الصوت\n3. أنشودة الحروف\n4. التحية\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. السلام", "تعرض المعلمة بطاقة كبيرة لحرف س، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «تحية الإسلام». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف س أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف س (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف س من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف س، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا سمكة» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف س (تقويم تكويني)، ويشير التلميذ إلى حرف س في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف س بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: إفشاء السلام بين الناس (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن أستمع وأجيب: نص الاستماع «تحية الإسلام»، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «تحية الإسلام» فيها كلمة بحرف س، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: سلام، سفينة، سوق، ساحل، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «س»؟\nالإجابة: السين.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف س.\nالإجابة: مثل: سمكة.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: إفشاء السلام بين الناس.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم حرف س كبيرًا على الأرض فيمشي التلميذ فوقه وهو ينطق «سـ سـ»، ثم يختار صورتي سمكة وسيارة من بين صور أخرى؛ وللتحقق يعرض الحرف ويسأل: ما اسمه؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مواقف لإلقاء تحية الإسلام «السلام عليكم» وردّها كما في نص «تحية الإسلام»، وتحديد الكلمة التي فيها حرف س، ثم يؤلفون جملة فيها كلمتان بحرف س.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف س.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف س.\nالإجابة: مثل: «السَّلامُ عَلَيْكُمْ.».", "للطالب: يلوّن حرف س في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 106–115). يحكي لأسرته نص «تحية الإسلام» بأسلوبه (كتاب الطالب ص 106–115).\nلولي الأمر: يردد مع طفله بيت حرف س ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 106–115.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=12"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف س مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف س مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف س"], "w": "الأسبوع السادس", "f": ["1. ينطق صوت حرف س مع الفتحة والضمة والكسرة: سَ، سُ، سِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف س في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف س مع المدود: سا، سو، سي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (سَ ← سا) (15 دقيقة)\n6. يقرأ كلمات وجملًا فيها حرف س مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «السَّلامُ عَلَيْكُمْ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «سَمَكةٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف س (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف س قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «السَّلامُ عَلَيْكُمْ.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف س من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «سَمَكةٌ» وتقرؤها بإطالة صوت س، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة سَ، سُ، سِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: سَيّارةٌ (أول)، مَسْجِدٌ (وسط)، شَمْسٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات سَ، سُ، سِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة سا، سو، سي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: سَمَكةٌ، كُرْسيٌّ، فَأْسٌ، ثم الجملة «السَّلامُ عَلَيْكُمْ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (2 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «سَمَكةٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف س (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة ساعةٌ، مِسْطَرةٌ، جَرَسٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف س في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اذكر كلمتين: واحدة حرف س في أولها وأخرى في آخرها» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. غلق الدرس – سباق بطاقات حرف س: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف س، ومنها كلمات من عمان مثل: سلام، سفينة، سوق، ساحل، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: سَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: سُ أم سو؟\nالإجابة: سو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف س من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم حرف س كبيرًا على الأرض فيمشي التلميذ فوقه وهو ينطق «سـ سـ»، ثم يختار صورتي سمكة وسيارة من بين صور أخرى؛ وللتحقق يعرض الحرف ويسأل: ما اسمه؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مواقف لإلقاء تحية الإسلام «السلام عليكم» وردّها كما في نص «تحية الإسلام»، وتحديد الكلمة التي فيها حرف س، ثم يؤلفون جملة فيها كلمتان بحرف س.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف س في كلمة «مِسْطَرةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «سي»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف س في أولها وأخرى في آخرها.\nالإجابة: مثل: ساعة، جرس.", "للطالب: يقرأ مقاطع سَ، سُ، سِ ويحدد موقع الحرف في ثلاث كلمات (كتاب الطالب ص 106–115). يقرأ المقاطع الطويلة والجملة «السَّلامُ عَلَيْكُمْ.» (كتاب الطالب ص 106–115). يرتب كلمات الجملة «السَّلامُ عَلَيْكُمْ.» ويقرؤها (كتاب الطالب ص 106–115).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف س.\nالمرجع: كتاب الطالب – الجزء الأول: ص 106–115.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=12"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف س وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع السادس", "f": ["1. يتعرّف أشكال حرف س: سـ (أول الكلمة)، ـسـ (وسطها)، ـس (آخرها متصلًا)، س (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف س بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «السَّلامُ عَلَيْكُمْ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف س كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: سـ (أول الكلمة)، ـسـ (وسطها)، ـس (آخرها متصلًا)، س (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: سَمَكةٌ، شَمْسٌ، ثم الجملة «السَّلامُ عَلَيْكُمْ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن أكتب: أشكال حرف س وكتابته في كلمات وجملة، وأختبر تعلمي، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس – سلام يا وطني: يتبادل الأطفال في أزواج تحية الإسلام: «السلام عليكم» و«وعليكم السلام»، ثم يذكرون كلمات بحرف السين مثل: سلام، سفينة، سوق، ساحل، ويتعلمون أن العمانيين يحيّون الناس بالسلام والابتسامة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف س منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف س؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «مَسْجِدٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم حرف س كبيرًا على الأرض فيمشي التلميذ فوقه وهو ينطق «سـ سـ»، ثم يختار صورتي سمكة وسيارة من بين صور أخرى؛ وللتحقق يعرض الحرف ويسأل: ما اسمه؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مواقف لإلقاء تحية الإسلام «السلام عليكم» وردّها كما في نص «تحية الإسلام»، وتحديد الكلمة التي فيها حرف س، ثم يؤلفون جملة فيها كلمتان بحرف س.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: سَ سُ سِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «السَّلامُ عَلَيْكُمْ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف س لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف س بأشكاله وينسخ الجملة (كتاب الطالب ص 106–115).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الأول: ص 106–115.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=12"]}]}, {"t": "حرف ك (الكاف): أنا أكتب", "u": "المحور الثاني: هنا أتعلم", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ك وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «أنا أكتب»"], "w": "الأسبوع السادس", "f": ["1. يتعرّف حرف ك (الكاف) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ك من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ك (10 دقائق)\n4. يستمع إلى نص «أنا أكتب» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (10 دقائق)\n- يستنتج قيمة النص: المحافظة على الأدوات المدرسية (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ك وألوان", "1. حرف الكاف\n2. الصوت\n3. أنشودة الحروف\n4. الكتابة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. الأدوات", "تعرض المعلمة بطاقة كبيرة لحرف ك، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «أنا أكتب». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ك أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ك (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ك من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ك، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا كتاب» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ك (تقويم تكويني)، ويشير التلميذ إلى حرف ك في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ك بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: المحافظة على الأدوات المدرسية (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. أكمل الفكرة: يبدأ المعلم جملة عن أستمع وأجيب: نص الاستماع «أنا أكتب»، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «أنا أكتب» فيها كلمة بحرف ك، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: كمّة، كرم، كتاب، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ك»؟\nالإجابة: الكاف.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ك.\nالإجابة: مثل: كتاب.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: المحافظة على الأدوات المدرسية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ك مع صورتي كتاب وكرة، ويشكّل التلميذ الحرف بالصلصال وينطق صوته، ثم يلوّنه في كلمة «كتاب»؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإخراج أدوات من حقائبهم في أسمائها حرف ك (كتاب، كراسة) وتسميتها، ثم يذكرون طريقتين للمحافظة على الأدوات المدرسية كما في نص «أنا أكتب» بجمل تامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ك.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ك.\nالإجابة: مثل: «أَنا أَكْتُبُ بِالقَلَمِ.».", "للطالب: يلوّن حرف ك في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 116–129). يحكي لأسرته نص «أنا أكتب» بأسلوبه (كتاب الطالب ص 116–129).\nلولي الأمر: يردد مع طفله بيت حرف ك ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 116–129.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=13"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ك مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ك مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ك"], "w": "الأسبوع السادس", "f": ["1. ينطق صوت حرف ك مع الفتحة والضمة والكسرة: كَ، كُ، كِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ك في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ك مع المدود: كا، كو، كي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (كَ ← كا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ك مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «أَنا أَكْتُبُ بِالقَلَمِ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «كِتابٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ك (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ك قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «أَنا أَكْتُبُ بِالقَلَمِ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ك من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «كِتابٌ» وتقرؤها بإطالة صوت ك، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة كَ، كُ، كِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: كُرةٌ (أول)، سَمَكةٌ (وسط)، ديكٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات كَ، كُ، كِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة كا، كو، كي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: كِتابٌ، سُكَّرٌ، سَمَكٌ، ثم الجملة «أَنا أَكْتُبُ بِالقَلَمِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «كِتابٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ك (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة كَعْكةٌ، مِكْنَسةٌ، مَلِكٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ك في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اذكر كلمتين: واحدة حرف ك في أولها وأخرى في آخرها» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. غلق الدرس – سباق بطاقات حرف ك: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ك، ومنها كلمات من عمان مثل: كمّة، كرم، كتاب، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: كَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: كُ أم كو؟\nالإجابة: كو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ك من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ك مع صورتي كتاب وكرة، ويشكّل التلميذ الحرف بالصلصال وينطق صوته، ثم يلوّنه في كلمة «كتاب»؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإخراج أدوات من حقائبهم في أسمائها حرف ك (كتاب، كراسة) وتسميتها، ثم يذكرون طريقتين للمحافظة على الأدوات المدرسية كما في نص «أنا أكتب» بجمل تامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ك في كلمة «مِكْنَسةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «كي»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف ك في أولها وأخرى في آخرها.\nالإجابة: مثل: كعكة، ملك.", "للطالب: يقرأ مقاطع كَ، كُ، كِ ويحدد موقع الحرف في ثلاث كلمات (كتاب الطالب ص 116–129). يقرأ المقاطع الطويلة والجملة «أَنا أَكْتُبُ بِالقَلَمِ.» (كتاب الطالب ص 116–129). يرتب كلمات الجملة «أَنا أَكْتُبُ بِالقَلَمِ.» ويقرؤها (كتاب الطالب ص 116–129).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ك.\nالمرجع: كتاب الطالب – الجزء الأول: ص 116–129.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=13"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ك وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع السادس", "f": ["1. يتعرّف أشكال حرف ك: كـ (أول الكلمة)، ـكـ (وسطها)، ـك (آخرها متصلًا)، ك (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ك بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «أَنا أَكْتُبُ بِالقَلَمِ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ك كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: كـ (أول الكلمة)، ـكـ (وسطها)، ـك (آخرها متصلًا)، ك (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: كِتابٌ، ديكٌ، ثم الجملة «أَنا أَكْتُبُ بِالقَلَمِ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس – كاف الكمّة العمانية: يكتب أطفال كل مجموعة حرف الكاف في الهواء ثم يذكرون كلمات فيها الكاف مثل: كمّة، كرم، كتاب، ثم يتحدثون عن الكمّة العمانية التي يلبسها الرجال والأولاد في المناسبات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ك منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ك؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «سَمَكةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ك مع صورتي كتاب وكرة، ويشكّل التلميذ الحرف بالصلصال وينطق صوته، ثم يلوّنه في كلمة «كتاب»؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإخراج أدوات من حقائبهم في أسمائها حرف ك (كتاب، كراسة) وتسميتها، ثم يذكرون طريقتين للمحافظة على الأدوات المدرسية كما في نص «أنا أكتب» بجمل تامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: كَ كُ كِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «أَنا أَكْتُبُ بِالقَلَمِ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ك لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ك بأشكاله وينسخ الجملة (كتاب الطالب ص 116–129).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الأول: ص 116–129.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=13"]}]}, {"t": "حرف ن (النون): لعبة ألوان", "u": "المحور الثاني: هنا أتعلم", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ن وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «لعبة ألوان»"], "w": "الأسبوع السادس – الأسبوع السابع", "f": ["1. يتعرّف حرف ن (النون) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ن من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ن (10 دقائق)\n4. يستمع إلى نص «لعبة ألوان» استماعًا جيدًا (10 دقائق)\n5. يجيب عن أسئلة النص إجابات صحيحة (15 دقيقة)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: اللعب الجماعي والتعاون مع الزملاء (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ن وألوان", "1. حرف النون\n2. الصوت\n3. أنشودة الحروف\n4. الألوان\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. اللعب", "تعرض المعلمة بطاقة كبيرة لحرف ن، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «لعبة ألوان». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ن أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ن (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ن من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ن، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا نحلة» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ن (تقويم تكويني)، ويشير التلميذ إلى حرف ن في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ن بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: اللعب الجماعي والتعاون مع الزملاء (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن حرف ن (النون): لعبة ألوان، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «لعبة ألوان» فيها كلمة بحرف ن، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: نخلة، نجمة، عُمان، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ن»؟\nالإجابة: النون.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ن.\nالإجابة: مثل: نحلة.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: اللعب الجماعي والتعاون مع الزملاء.\n\n• نشاط علاجي (لمن لم يتقن): ينطق المعلم كلمات (نحلة، نمر، باب) ويرفع التلميذ بطاقة حرف ن عند سماع صوت النون، ثم يرسم الحرف ونقطته في الهواء وعلى السبورة؛ وللتحقق يسأله: ما اسم الحرف «ن»؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتلوين حرف ن في كلمات بطاقة بلون واحد وعدّها، ثم يقترحون لعبة جماعية جديدة كما في نص «لعبة ألوان» ويصفونها بجملة فيها كلمتان بحرف ن.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ن.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ن.\nالإجابة: مثل: «نَلْعَبُ لُعْبةَ الأَلْوانِ.».", "للطالب: يلوّن حرف ن في ص الدرس الأولى وينشد بيته (كتاب الطالب ص 130–139). يحكي لأسرته نص «لعبة ألوان» بأسلوبه (كتاب الطالب ص 130–139).\nلولي الأمر: يردد مع طفله بيت حرف ن ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 130–139.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=14"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ن مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ن مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ن"], "w": "الأسبوع السابع", "f": ["1. ينطق صوت حرف ن مع الفتحة والضمة والكسرة: نَ، نُ، نِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ن في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ن مع المدود: نا، نو، ني (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (نَ ← نا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ن مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «نَلْعَبُ لُعْبةَ الأَلْوانِ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «نَحْلةٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ن (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ن قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «نَلْعَبُ لُعْبةَ الأَلْوانِ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ن من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «نَحْلةٌ» وتقرؤها بإطالة صوت ن، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة نَ، نُ، نِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: نَجْمةٌ (أول)، عِنَبٌ (وسط)، لَيْمونٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات نَ، نُ، نِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة نا، نو، ني وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: نَحْلةٌ، بِنْتٌ، فِنْجانٌ، ثم الجملة «نَلْعَبُ لُعْبةَ الأَلْوانِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «نَحْلةٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ن (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة نافِذةٌ، مِنْشارٌ، حِصانٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ن في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «أين حرف ن في كلمة «عِنَبٌ»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. غلق الدرس – سباق بطاقات حرف ن: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ن، ومنها كلمات من عمان مثل: نخلة، نجمة، عُمان، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: نَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: نُ أم نو؟\nالإجابة: نو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ن من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): ينطق المعلم كلمات (نحلة، نمر، باب) ويرفع التلميذ بطاقة حرف ن عند سماع صوت النون، ثم يرسم الحرف ونقطته في الهواء وعلى السبورة؛ وللتحقق يسأله: ما اسم الحرف «ن»؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتلوين حرف ن في كلمات بطاقة بلون واحد وعدّها، ثم يقترحون لعبة جماعية جديدة كما في نص «لعبة ألوان» ويصفونها بجملة فيها كلمتان بحرف ن.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مس يد: تنشد المعلمة البيت وتردده المجموعات بالتناوب، ويردد التلميذ الأبيات حتى يحفظها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. الإنشاد المعبّر: تنمذج المعلمة الإيماءات لكل بيت (تقويم تكويني)، وينشد التلميذ مع الإيماءات ولغة الجسد (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. منافسة الإنشاد: تقيّم المعلمة أداء المجموعات وتعزز الأسرع حفظًا، وتنشد كل مجموعة ويقيّم الزملاء الأداء (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. أكمل الفكرة: يبدأ المعلم جملة عن الاستماع إلى نشيد «مدرستي حديقتي» وفهم معانيه، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n8. غلق الدرس – حديقة مدرستي الخضراء: تتفق كل مجموعة على عمل واحد تخدم به حديقة مدرستها كسقي شجرة أو جمع الأوراق، وتمثّله أمام الصف وهي تنشد مقطعًا من النشيد، لأن المحافظة على البيئة من حب عمان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان النشيد؟\nالإجابة: «مدرستي حديقتي».\nس2 (مستوى التطبيق): أنشد بيتًا من النشيد.\nالإجابة: إنشاد صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي يدعو إليها النشيد؟\nالإجابة: قيمة متصلة بمحور «هنا أتعلم».\n\n• نشاط علاجي (لمن لم يتقن): يقسّم المعلم بيتًا من نشيد «مدرستي حديقتي» إلى مقاطع قصيرة، ويردده التلميذ بعده مع التصفيق للإيقاع وحركات تعبّر عن الحديقة؛ وللتحقق يسأله: ما عنوان النشيد؟ ثم ينشد البيت.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بشرح سبب تسمية المدرسة حديقة في نشيد «مدرستي حديقتي»، ثم يرسمون مدرستهم حديقة ويقول كل منهم جملة عن حبه للتعلم في محور «هنا أتعلم».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أنشد النشيد مع زملائك.\nالإجابة: إنشاد جماعي صحيح.\nس2 (مستوى التطبيق): اذكر كلمة من النشيد فيها حرف من حروف المحور.\nالإجابة: كلمة صحيحة.\nس3 (مستوى الاستدلال): عبّر عن مشاعرك تجاه موضوع النشيد بجملة.\nالإجابة: جملة معبّرة صحيحة.", "للطالب: ينشد نشيد «مدرستي حديقتي» لأسرته (كتاب الطالب ص 146–147).\nلولي الأمر: يستمع إلى إنشاد طفله ويشجعه.\nالمرجع: كتاب الطالب – الجزء الأول: ص 146–147.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://  إلى زميل ويسأله سؤالًا آخر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. غلق الدرس – معلمي قدوتي: يتحدث الأطفال في أزواج عن شخصية من القصة ويقولون كيف يحترمون معلمهم وزملاءهم، ثم يقول كل زوج شكرًا لمعلمه بجملة جميلة، فاحترام المعلم من قيم المجتمع العماني (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان القصة؟\nالإجابة: عنوان قصة المحور.\nس2 (مستوى التطبيق): من الشخصية الرئيسة في القصة؟\nالإجابة: ذكر الشخصية.\nس3 (مستوى الاستدلال): لماذا تصرفت الشخصية هكذا في رأيك؟\nالإجابة: تعليل منطقي من أحداث القصة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم غلاف قصة محور «هنا أتعلم» وصورها، ويشير مع التلميذ إلى العنوان ثم إلى الشخصية الرئيسة في كل صورة ويسميانها معًا؛ وللتحقق يسأله: ما عنوان القصة؟ ومن شخصيتها الرئيسة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالتنبؤ بما يحدث بعد نهاية قصة محور «هنا أتعلم» ورسمه، ثم يعللون تصرف الشخصية الرئيسة ويربطونه بحب التعلم والمدرسة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا حدث في بداية القصة؟\nالإجابة: ذكر الحدث الأول.\nس2 (مستوى التطبيق): رتّب ثلاث صور من القصة.\nالإجابة: ترتيب صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي تعلّمتها من القصة؟\nالإجابة: قيمة متصلة بمحور «هنا أتعلم».", "للطالب: يحكي قصة المحور لأسرته.\nلولي الأمر: يقرأ مع طفله قصة قصيرة ويسأله عن شخصياتها.\nالمرجع: كتاب الطالب: لا يتضمن القصة (سلسلة القراءة التشاركية غير متوفرة لديّ).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=17"]}]}, {"t": "حرف ف (الفاء): الفتى النظيف", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ف وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «الفتى النظيف»"], "w": "الأسبوع الثامن", "f": ["1. يتعرّف حرف ف (الفاء) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ف من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ف (10 دقائق)\n4. يستمع إلى نص «الفتى النظيف» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: المحافظة على نظافة الجسم (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ف وألوان", "1. حرف الفاء\n2. الصوت\n3. أنشودة الحروف\n4. النظافة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. الفتى", "تعرض المعلمة بطاقة كبيرة لحرف ف، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «الفتى النظيف». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ف أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ف (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ف من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ف، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا فيل» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ف (تقويم تكويني)، ويشير التلميذ إلى حرف ف في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ف بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: المحافظة على نظافة الجسم (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول حرف ف (الفاء): الفتى النظيف، ويبدأ المعلم بسؤال «ما اسم هذا الحرف: «ف»» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «الفتى النظيف» فيها كلمة بحرف ف، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: فلج، فخار، فرح، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ف»؟\nالإجابة: الفاء.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ف.\nالإجابة: مثل: فيل.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: المحافظة على نظافة الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي فيل وفراشة وينفخ مع التلميذ لإخراج صوت الفاء، ثم يتتبع التلميذ حرف ف المنقّط ويضع نقطته فوقه؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مصورة لأدوات النظافة التي يحتاجها «الفتى النظيف» وتلوين حرف ف فيما يحتويه منها (فرشاة، منشفة)، ثم يعللون أهمية كل أداة بجملة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ف.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ف.\nالإجابة: مثل: «الفَتى النَّظيفُ مَحْبوبٌ.».", "للطالب: يلوّن حرف ف في ص الدرس الأولى وينشد بيته (دليل المعلم ص 246–254 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يحكي لأسرته نص «الفتى النظيف» بأسلوبه (دليل المعلم ص 246–254 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ف ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=18"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ف مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ف مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ف"], "w": "الأسبوع الثامن", "f": ["1. ينطق صوت حرف ف مع الفتحة والضمة والكسرة: فَ، فُ، فِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ف في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (5 دقائق)\n4. يقرأ حرف ف مع المدود: فا، فو، في (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (فَ ← فا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ف مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «الفَتى النَّظيفُ مَحْبوبٌ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «فيلٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ف (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ف قراءة صحيحة (15 دقيقة)\n- يقرأ الجملة «الفَتى النَّظيفُ مَحْبوبٌ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ف من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «فيلٌ» وتقرؤها بإطالة صوت ف، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة فَ، فُ، فِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: فَراشةٌ (أول)، سَفينةٌ (وسط)، سَيْفٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات فَ، فُ، فِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة فا، فو، في وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: فيلٌ، تُفّاحةٌ، خَروفٌ، ثم الجملة «الفَتى النَّظيفُ مَحْبوبٌ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «فيلٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ف (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة فُرْشاةٌ، مِفْتاحٌ، رَفٌّ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ف في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الدرس، ويبدأ المعلم بسؤال «اقرأ المقاطع: فا، فو، في» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n14. غلق الدرس – سباق بطاقات حرف ف: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ف، ومنها كلمات من عمان مثل: فلج، فخار، فرح، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: فَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: فُ أم فو؟\nالإجابة: فو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ف من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي فيل وفراشة وينفخ مع التلميذ لإخراج صوت الفاء، ثم يتتبع التلميذ حرف ف المنقّط ويضع نقطته فوقه؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مصورة لأدوات النظافة التي يحتاجها «الفتى النظيف» وتلوين حرف ف فيما يحتويه منها (فرشاة، منشفة)، ثم يعللون أهمية كل أداة بجملة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ف في كلمة «مِفْتاحٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «في»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف ف في أولها وأخرى في آخرها.\nالإجابة: مثل: فرشاة، رف.", "للطالب: يقرأ مقاطع فَ، فُ، فِ ويحدد موقع الحرف في ثلاث كلمات (دليل المعلم ص 246–254 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يقرأ المقاطع الطويلة والجملة «الفَتى النَّظيفُ مَحْبوبٌ.» (دليل المعلم ص 246–254 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يرتب كلمات الجملة «الفَتى النَّظيفُ مَحْبوبٌ.» ويقرؤها (دليل المعلم ص 246–254 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ف.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=18"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ف وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الثامن", "f": ["1. يتعرّف أشكال حرف ف: فـ (أول الكلمة)، ـفـ (وسطها)، ـف (آخرها متصلًا)، ف (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ف بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «الفَتى النَّظيفُ مَحْبوبٌ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ف كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: فـ (أول الكلمة)، ـفـ (وسطها)، ـف (آخرها متصلًا)، ف (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: فيلٌ، سَيْفٌ، ثم الجملة «الفَتى النَّظيفُ مَحْبوبٌ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن أكتب: أشكال حرف ف وكتابته في كلمات وجملة، وأختبر تعلمي، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. غلق الدرس – فرقة النظافة: تكوّن كل مجموعة «فرقة نظافة» ترتب ركنها في الصف خلال دقيقة، ويقول الأطفال كلمات بحرف الفاء مثل: فلج، فخار، فرح، ويتعلمون أن نظافة المكان من حب الوطن (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ف منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ف؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «سَفينةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي فيل وفراشة وينفخ مع التلميذ لإخراج صوت الفاء، ثم يتتبع التلميذ حرف ف المنقّط ويضع نقطته فوقه؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة مصورة لأدوات النظافة التي يحتاجها «الفتى النظيف» وتلوين حرف ف فيما يحتويه منها (فرشاة، منشفة)، ثم يعللون أهمية كل أداة بجملة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: فَ فُ فِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «الفَتى النَّظيفُ مَحْبوبٌ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ف لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ف بأشكاله وينسخ الجملة (دليل المعلم ص 246–254 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=18"]}]}, {"t": "حرف ت (التاء): حمزة وفاطمة", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ت وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «حمزة وفاطمة»"], "w": "الأسبوع الثامن", "f": ["1. يتعرّف حرف ت (التاء) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ت من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ت (15 دقيقة)\n4. يستمع إلى نص «حمزة وفاطمة» استماعًا جيدًا (10 دقائق)\n5. يجيب عن أسئلة النص إجابات صحيحة (15 دقيقة)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: المحافظة على نظافة الأسنان (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ت وألوان", "1. حرف التاء\n2. الصوت\n3. أنشودة الحروف\n4. الأسنان\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. المعجون", "تعرض المعلمة بطاقة كبيرة لحرف ت، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «حمزة وفاطمة». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ت أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ت (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ت من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ت، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا تفاحة» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ت (تقويم تكويني)، ويشير التلميذ إلى حرف ت في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ت بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: المحافظة على نظافة الأسنان (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «ما اسم هذا الحرف: «ت»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «حمزة وفاطمة» فيها كلمة بحرف ت، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: تمر، توت، تاج، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ت»؟\nالإجابة: التاء.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ت.\nالإجابة: مثل: تفاحة.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: المحافظة على نظافة الأسنان.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ت مع صورتي تفاحة وتمر، ويعدّ مع التلميذ نقطتي الحرف ويضعهما بالأزرار فوقه وهو ينطق صوته؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بجمع كلمات فيها حرف ت في أولها ووسطها وآخرها (تمر، كتاب، بيت)، ثم يقولون جملة تامة عن نظافة الأسنان كما في نص «حمزة وفاطمة» تضم كلمة بحرف ت.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ت.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ت.\nالإجابة: مثل: «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.».", "للطالب: يلوّن حرف ت في ص الدرس الأولى وينشد بيته (دليل المعلم ص 255–263 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يحكي لأسرته نص «حمزة وفاطمة» بأسلوبه (دليل المعلم ص 255–263 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ت ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=19"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ت مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ت مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ت"], "w": "الأسبوع الثامن", "f": ["1. ينطق صوت حرف ت مع الفتحة والضمة والكسرة: تَ، تُ، تِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ت في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (5 دقائق)\n4. يقرأ حرف ت مع المدود: تا، تو، تي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (تَ ← تا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ت مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «تُفّاحةٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ت (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ت قراءة صحيحة (15 دقيقة)\n- يقرأ الجملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ت من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «تُفّاحةٌ» وتقرؤها بإطالة صوت ت، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة تَ، تُ، تِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: تَمْرٌ (أول)، كِتابٌ (وسط)، بَيْتٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات تَ، تُ، تِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة تا، تو، تي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: تُفّاحةٌ، مِفْتاحٌ، حوتٌ، ثم الجملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «تُفّاحةٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ت (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة تاجٌ، سِتارةٌ، توتٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ت في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. أكمل الفكرة: يبدأ المعلم جملة عن الدرس، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n14. غلق الدرس – سباق بطاقات حرف ت: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ت، ومنها كلمات من عمان مثل: تمر، توت، تاج، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: تَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: تُ أم تو؟\nالإجابة: تو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ت من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ت مع صورتي تفاحة وتمر، ويعدّ مع التلميذ نقطتي الحرف ويضعهما بالأزرار فوقه وهو ينطق صوته؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بجمع كلمات فيها حرف ت في أولها ووسطها وآخرها (تمر، كتاب، بيت)، ثم يقولون جملة تامة عن نظافة الأسنان كما في نص «حمزة وفاطمة» تضم كلمة بحرف ت.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ت في كلمة «سِتارةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «تي»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف ت في أولها وأخرى في آخرها.\nالإجابة: مثل: تاج، توت.", "للطالب: يقرأ مقاطع تَ، تُ، تِ ويحدد موقع الحرف في ثلاث كلمات (دليل المعلم ص 255–263 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يقرأ المقاطع الطويلة والجملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» (دليل المعلم ص 255–263 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يرتب كلمات الجملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» ويقرؤها (دليل المعلم ص 255–263 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ت.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=19"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ت وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الثامن", "f": ["1. يتعرّف أشكال حرف ت: تـ (أول الكلمة)، ـتـ (وسطها)، ـت (آخرها متصلًا)، ت (آخرها منفصلًا) (15 دقيقة)\n2. يكتب حرف ت بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ت كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: تـ (أول الكلمة)، ـتـ (وسطها)، ـت (آخرها متصلًا)، ت (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: تُفّاحةٌ، بَيْتٌ، ثم الجملة «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «اكتب كلمة «كِتابٌ» واذكر شكل الحرف فيها»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – تمر الضيافة: يمثّل كل زوج ضيافة عمانية: يقدّم أحدهما «تمرًا» متخيلًا والآخر يشكره، ويذكران كلمات فيها حرف التاء مثل: تمر، توت، تاج، ثم يقولان: «إكرام الضيف من عادات أهل عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ت منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ت؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «كِتابٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقة حرف ت مع صورتي تفاحة وتمر، ويعدّ مع التلميذ نقطتي الحرف ويضعهما بالأزرار فوقه وهو ينطق صوته؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بجمع كلمات فيها حرف ت في أولها ووسطها وآخرها (تمر، كتاب، بيت)، ثم يقولون جملة تامة عن نظافة الأسنان كما في نص «حمزة وفاطمة» تضم كلمة بحرف ت.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: تَ تُ تِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ت لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ت بأشكاله وينسخ الجملة (دليل المعلم ص 255–263 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=19"]}]}, {"t": "حرف ح (الحاء): فرح والحمامة", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ح وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «فرح والحمامة»"], "w": "الأسبوع التاسع", "f": ["1. يتعرّف حرف ح (الحاء) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ح من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ح (10 دقائق)\n4. يستمع إلى نص «فرح والحمامة» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: الاقتصاد في استخدام الماء ونظافة الجسم (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم بالاكتشاف\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. أخرى: بطاقة حرف ح وألوان", "1. حرف الحاء\n2. الصوت\n3. أنشودة الحروف\n4. البشاشة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. الحمامة", "تعرض المعلمة بطاقة كبيرة لحرف ح، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «فرح والحمامة». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ح أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة
