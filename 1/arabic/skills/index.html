 ويلوّن حرف ح (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ح من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ح، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا حصان» (9 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ح (تقويم تكويني)، ويشير التلميذ إلى حرف ح في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ح بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n7. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n8. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: الاقتصاد في استخدام الماء ونظافة الجسم (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n9. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص حرف ح (الحاء): فرح والحمامة، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – المذيع العماني الصغير: يقف طفل من كل مجموعة أمام الصف كأنه مذيع في الإذاعة المدرسية، ويقول جملة تامة عن نص «فرح والحمامة» فيها كلمة بحرف ح، ثم يذكر زملاؤه كلمات من عمان فيها الحرف مثل: حمامة، حلوى، حصن، ويختمون معًا: «نتحدث العربية ونحب عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ح»؟\nالإجابة: الحاء.\nس2 (مستوى التطبيق): اذكر كلمة تبدأ بحرف ح.\nالإجابة: مثل: حصان.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: الاقتصاد في استخدام الماء ونظافة الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور (حصان، حليب، حمامة) وينطق التلميذ صوت الحاء من الحلق واضعًا يده على عنقه، ثم يلوّن الحرف في الكلمات؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة حكاية «فرح والحمامة» بجملتين فيهما كلمات بحرف ح، ثم يقترحون طريقتين للاقتصاد في استخدام الماء عند الاستحمام وغسل اليدين.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ح.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): رتّب حدثين من أحداث النص.\nالإجابة: ترتيب صحيح للحدثين.\nس3 (مستوى الاستدلال): قل جملة تامة فيها كلمتان بهما حرف ح.\nالإجابة: مثل: «فَرَحُ تُحِبُّ الحَمامةَ.».", "للطالب: يلوّن حرف ح في ص الدرس الأولى وينشد بيته (دليل المعلم ص 264–275 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يحكي لأسرته نص «فرح والحمامة» بأسلوبه (دليل المعلم ص 264–275 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ح ويبحث معه عن أشياء في البيت تبدأ به. يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=20"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ح مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ح مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ح"], "w": "الأسبوع التاسع", "f": ["1. ينطق صوت حرف ح مع الفتحة والضمة والكسرة: حَ، حُ، حِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ح في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (5 دقائق)\n4. يقرأ حرف ح مع المدود: حا، حو، حي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (حَ ← حا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ح مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «فَرَحُ تُحِبُّ الحَمامةَ.» إلى كلمات (15 دقيقة)\n8. يحلل كلمة «حِصانٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ح (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ح قراءة صحيحة (15 دقيقة)\n- يقرأ الجملة «فَرَحُ تُحِبُّ الحَمامةَ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ح من الكلمات بمواقعه المختلفة (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. استراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. صورة توضيحية\n7. أخرى: بطاقات المقاطع وبطاقات الحركات، بطاقات كلمات مصورة، بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «حِصانٌ» وتقرؤها بإطالة صوت ح، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة حَ، حُ، حِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: حَمامةٌ (أول)، نَحْلةٌ (وسط)، تُفّاحٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات حَ، حُ، حِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. المدود الثلاثة: تعرض المعلمة حا، حو، حي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: حِصانٌ، بَحْرٌ، مِفْتاحٌ، ثم الجملة «فَرَحُ تُحِبُّ الحَمامةَ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. من الكلمة إلى المقطع والصوت: تقسم المعلمة «حِصانٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ح (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أجرّد الحرف: تكتب المعلمة حَليبٌ، مِحْفَظةٌ، مِلْحٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ح في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الدرس، ويبدأ المعلم بسؤال «اقرأ الجملة: «فَرَحُ تُحِبُّ الحَمامةَ.»» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n14. غلق الدرس – سباق بطاقات حرف ح: تتسابق المجموعات في قراءة بطاقات مقاطع وكلمات فيها حرف ح، ومنها كلمات من عمان مثل: حمامة، حلوى، حصن، وكلما قرأت مجموعة بطاقة صحيحة رفعت علم عمان الصغير، ثم يقول الأطفال معًا: «أقرأ لغتي وأحب وطني عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: حَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: حُ أم حو؟\nالإجابة: حو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ح من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور (حصان، حليب، حمامة) وينطق التلميذ صوت الحاء من الحلق واضعًا يده على عنقه، ثم يلوّن الحرف في الكلمات؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة حكاية «فرح والحمامة» بجملتين فيهما كلمات بحرف ح، ثم يقترحون طريقتين للاقتصاد في استخدام الماء عند الاستحمام وغسل اليدين.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ح في كلمة «مِحْفَظةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): ما المد في المقطع «حي»؟\nالإجابة: المد بالياء.\nس3 (مستوى الاستدلال): اذكر كلمتين: واحدة حرف ح في أولها وأخرى في آخرها.\nالإجابة: مثل: حليب، ملح.", "للطالب: يقرأ مقاطع حَ، حُ، حِ ويحدد موقع الحرف في ثلاث كلمات (دليل المعلم ص 264–275 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يقرأ المقاطع الطويلة والجملة «فَرَحُ تُحِبُّ الحَمامةَ.» (دليل المعلم ص 264–275 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)). يرتب كلمات الجملة «فَرَحُ تُحِبُّ الحَمامةَ.» ويقرؤها (دليل المعلم ص 264–275 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟». يستمع إلى قراءة طفله ويصحح مد الأصوات. يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ح.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=20"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ح وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع التاسع", "f": ["1. يتعرّف أشكال حرف ح: حـ (أول الكلمة)، ـحـ (وسطها)، ـح (آخرها متصلًا)، ح (آخرها منفصلًا) (15 دقيقة)\n2. يكتب حرف ح بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «فَرَحُ تُحِبُّ الحَمامةَ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. أخرى: سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ح كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: حـ (أول الكلمة)، ـحـ (وسطها)، ـح (آخرها متصلًا)، ح (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: حِصانٌ، تُفّاحٌ، ثم الجملة «فَرَحُ تُحِبُّ الحَمامةَ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «اكتب حرف ح منفصلًا»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. غلق الدرس – حمامة ورفق: يمثّل أطفال كل مجموعة رعاية حمامة بلطف كتقديم الماء لها، ويذكرون كلمات بحرف الحاء مثل: حمامة، حلوى، حصن، ثم يتحدثون عن الرفق بالحيوان قيمةً يحبها أهل عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ح منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ح؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «نَحْلةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور (حصان، حليب، حمامة) وينطق التلميذ صوت الحاء من الحلق واضعًا يده على عنقه، ثم يلوّن الحرف في الكلمات؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة حكاية «فرح والحمامة» بجملتين فيهما كلمات بحرف ح، ثم يقترحون طريقتين للاقتصاد في استخدام الماء عند الاستحمام وغسل اليدين.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: حَ حُ حِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «فَرَحُ تُحِبُّ الحَمامةَ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ح لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ح بأشكاله وينسخ الجملة (دليل المعلم ص 264–275 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=20"]}]}, {"t": "حرف ق (القاف): هذه قريتي", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ق وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «هذه قريتي»"], "w": "الأسبوع التاسع", "f": ["1. يتعرّف حرف ق (القاف) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ق من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ق (10 دقائق)\n4. يستمع إلى نص «هذه قريتي» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: المحافظة على نظافة البيئة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. التعلم الذاتي\n10. الحوار والمناقشة\n11. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ق وألوان", "1. حرف القاف\n2. الصوت\n3. أنشودة الحروف\n4. القرية\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. السوق", "تعرض المعلمة بطاقة كبيرة لحرف ق، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «هذه قريتي». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ق أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ق من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ق، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا قلم» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ق (تقويم تكويني)، ويشير التلميذ إلى حرف ق في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص حرف ق (القاف): هذه قريتي، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ق بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: المحافظة على نظافة البيئة (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أستمع وأجيب: نص الاستماع «هذه قريتي»، ويبدأ المعلم بسؤال «رتّب حدثين من أحداث النص» (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n11. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. غلق الدرس – دليل القرية: يتناوب أفراد كل مجموعة على دور «الدليل» الذي يعرّف زملاءه بقرية عمانية بجملة تامة فيها حرف القاف مثل: «في قريتي قلعة قديمة»، ويصفّق الزملاء عند سماع صوت القاف، ثم يقولون معًا: «قريتي نظيفة جميلة» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ق»؟\nالإجابة: القاف.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: المحافظة على نظافة البيئة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي قلم وقمر وينطق الكلمتين ببطء مع إبراز صوت القاف، ويرسم التلميذ الحرف بنقطتيه على الرمل؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم قريتهم أو حيّهم وتسمية ثلاثة أشياء فيه فيها حرف ق (قلعة، سوق، طريق)، ثم يقولون جملة عن المحافظة على نظافة البيئة كما في نص «هذه قريتي».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ق.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ق: «بَقَرةٌ» أم «بَحْرٌ»؟\nالإجابة: «بَقَرةٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ق في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «هذه قريتي» بأسلوبه (دليل المعلم ص 276–284 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ق ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=21"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ق مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ق مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ق"], "w": "الأسبوع التاسع", "f": ["1. ينطق صوت حرف ق مع الفتحة والضمة والكسرة: قَ، قُ، قِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ق في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ق مع المدود: قا، قو، قي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (قَ ← قا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ق مستعينًا بالصور (10 دقائق)\n7. يحلل جملة «هذهِ قَرْيَتي.» إلى كلمات (15 دقيقة)\n8. يحلل كلمة «قَلَمٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ق (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ق قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «هذهِ قَرْيَتي.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف ق من الكلمات بمواقعه المختلفة (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني\n9. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «قَلَمٌ» وتقرؤها بإطالة صوت ق، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة قَ، قُ، قِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: قِطّةٌ (أول)، بَقَرةٌ (وسط)، طَبَقٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات قَ، قُ، قِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اذكر كلمتين: واحدة حرف ق في أولها وأخرى في آخرها» على السبورة، ويناقش المعلم الإجابات مع الصف (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. المدود الثلاثة: تعرض المعلمة قا، قو، قي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: قَلَمٌ، حَقيبةٌ، سوقٌ، ثم الجملة «هذهِ قَرْيَتي.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (2 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. من الكلمة إلى المقطع والصوت: تقسم المعلمة «قَلَمٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ق (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. أجرّد الحرف: تكتب المعلمة قَمَرٌ، مِلْعَقةٌ، بَرْقٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ق في كل كلمة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ق، ويبدأ المعلم بسؤال «كم كلمة في جملة «هذهِ قَرْيَتي.»» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n15. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n16. غلق الدرس – سوق المقاطع: يرسم المعلم على السبورة دكاكين سوق عماني قديم، في كل دكان مقطع (قَ، قُ، قِ، قا، قو، قي)، ويتسابق أفراد المجموعات في «الشراء» بقراءة المقطع قراءة صحيحة، ثم يذكر كل فريق شيئًا يحبه في سوق قريته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: قَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: قُ أم قو؟\nالإجابة: قو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ق من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي قلم وقمر وينطق الكلمتين ببطء مع إبراز صوت القاف، ويرسم التلميذ الحرف بنقطتيه على الرمل؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم قريتهم أو حيّهم وتسمية ثلاثة أشياء فيه فيها حرف ق (قلعة، سوق، طريق)، ثم يقولون جملة عن المحافظة على نظافة البيئة كما في نص «هذه قريتي».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ق في كلمة «مِلْعَقةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ق في كلمة «سوقٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «حَقيبةٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع قَ، قُ، قِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «هذهِ قَرْيَتي.»؛ يرتب كلمات الجملة «هذهِ قَرْيَتي.» ويقرؤها (دليل المعلم ص 276–284 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ق.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=21"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ق وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع التاسع", "f": ["1. يتعرّف أشكال حرف ق: قـ (أول الكلمة)، ـقـ (وسطها)، ـق (آخرها متصلًا)، ق (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ق بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «هذهِ قَرْيَتي.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ق كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: قـ (أول الكلمة)، ـقـ (وسطها)، ـق (آخرها متصلًا)، ق (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: قَلَمٌ، طَبَقٌ، ثم الجملة «هذهِ قَرْيَتي.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن أكتب: أشكال حرف ق وكتابته في كلمات وجملة، وأختبر تعلمي، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – قريتي العمانية: يذكر كل طفل في مجموعته شيئًا من القرية العمانية فيه حرف القاف مثل: قلعة، قرية، قارب، قهوة، ثم ترسم المجموعة في الهواء قلعة القرية وتقول جملة عن جمالها (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ق منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ق؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «بَقَرةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي قلم وقمر وينطق الكلمتين ببطء مع إبراز صوت القاف، ويرسم التلميذ الحرف بنقطتيه على الرمل؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم قريتهم أو حيّهم وتسمية ثلاثة أشياء فيه فيها حرف ق (قلعة، سوق، طريق)، ثم يقولون جملة عن المحافظة على نظافة البيئة كما في نص «هذه قريتي».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: قَ قُ قِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «هذهِ قَرْيَتي.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ق لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ق بأشكاله وينسخ الجملة (دليل المعلم ص 276–284 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=21"]}]}, {"t": "حرف ز (الزاي): زيارة إلى كمزار", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ز وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «زيارة إلى كمزار»"], "w": "الأسبوع العاشر", "f": ["1. يتعرّف حرف ز (الزاي) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ز من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ز (10 دقائق)\n4. يستمع إلى نص «زيارة إلى كمزار» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: المحافظة على نظافة المدن السياحية (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. التعلم الذاتي\n10. الحوار والمناقشة\n11. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ز وألوان", "1. حرف الزاي\n2. الصوت\n3. أنشودة الحروف\n4. الزوار\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. الزوارق", "تعرض المعلمة بطاقة كبيرة لحرف ز، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «زيارة إلى كمزار». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ز أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ز (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ز من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ز، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا زرافة» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ز (تقويم تكويني)، ويشير التلميذ إلى حرف ز في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص حرف ز (الزاي): زيارة إلى كمزار، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ز بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: المحافظة على نظافة المدن السياحية (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أستمع وأجيب: نص الاستماع «زيارة إلى كمزار»، ويبدأ المعلم بسؤال «ماذا تعلّمت من النص» (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n11. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. غلق الدرس – مرشد في مسندم: يمثّل طفل من كل مجموعة دور المرشد في زورق متخيل يتجه إلى كمزار، ويصف لزملائه ما يراه بجملة تامة فيها حرف الزاي مثل: «الماء أزرق»، ويرفع الزملاء أيديهم عند سماع صوت الزاي، ثم يقولون معًا: «مسندم جميلة في وطني عمان» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ز»؟\nالإجابة: الزاي.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: المحافظة على نظافة المدن السياحية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي زرافة وزيتون، وينطق التلميذ صوت الزاي كطنين النحلة «ززز»، ثم يكتب الحرف ونقطته بإصبعه على الرمل؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتحديد حرف ز في كلمتي «زيارة» و«كمزار» وفي كلمات أخرى (موز، زر)، ثم يصفون بجملتين مكانًا سياحيًا زاروه ويذكرون طريقة للمحافظة على نظافته.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ز.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ز: «غَزالٌ» أم «بَحْرٌ»؟\nالإجابة: «غَزالٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ز في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «زيارة إلى كمزار» بأسلوبه (دليل المعلم ص 285–297 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ز ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=22"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ز مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ز مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ز"], "w": "الأسبوع العاشر", "f": ["1. ينطق صوت حرف ز مع الفتحة والضمة والكسرة: زَ، زُ، زِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ز في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ز مع المدود: زا، زو، زي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (زَ ← زا) (15 دقيقة)\n6. يقرأ كلمات وجملًا فيها حرف ز مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «الزُّوّارُ في كُمْزارَ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «زَرافةٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ز (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ز قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «الزُّوّارُ في كُمْزارَ.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف ز من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «زَرافةٌ» وتقرؤها بإطالة صوت ز، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة زَ، زُ، زِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: زَيْتونٌ (أول)، غَزالٌ (وسط)، مَوْزٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات زَ، زُ، زِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن ألاحظ: صوت حرف ز مع الحركات القصيرة وموقعه في الكلمة، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. المدود الثلاثة: تعرض المعلمة زا، زو، زي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: زَرافةٌ، جَزَرٌ، خُبْزٌ، ثم الجملة «الزُّوّارُ في كُمْزارَ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. من الكلمة إلى المقطع والصوت: تقسم المعلمة «زَرافةٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ز (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. أجرّد الحرف: تكتب المعلمة زَهْرةٌ، مِزْمارٌ، أَرُزٌّ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ز في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n15. غلق الدرس – زورق المقاطع: يرسم المعلم زورقًا عمانيًا على السبورة في أشرعته مقاطع (زَ، زُ، زِ، زا، زو، زي)، ويتسابق أفراد المجموعات في قراءتها ليبحر الزورق إلى كمزار، ثم يذكرون كلمة فيها حرف الزاي من رحلتهم مثل: زورق، زيارة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: زَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: زُ أم زو؟\nالإجابة: زو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ز من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي زرافة وزيتون، وينطق التلميذ صوت الزاي كطنين النحلة «ززز»، ثم يكتب الحرف ونقطته بإصبعه على الرمل؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتحديد حرف ز في كلمتي «زيارة» و«كمزار» وفي كلمات أخرى (موز، زر)، ثم يصفون بجملتين مكانًا سياحيًا زاروه ويذكرون طريقة للمحافظة على نظافته.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ز في كلمة «مِزْمارٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ز في كلمة «خُبْزٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «جَزَرٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع زَ، زُ، زِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «الزُّوّارُ في كُمْزارَ.»؛ يرتب كلمات الجملة «الزُّوّارُ في كُمْزارَ.» ويقرؤها (دليل المعلم ص 285–297 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ز.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=22"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ز وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع العاشر", "f": ["1. يتعرّف أشكال حرف ز: ز (منفصلًا)، ـز (متصلًا بما قبله) (15 دقيقة)\n2. يكتب حرف ز بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «الزُّوّارُ في كُمْزارَ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ز كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: ز (منفصلًا)، ـز (متصلًا بما قبله)، وتبيّن أن للحرف شكلان، ولا يتصل بما بعده، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: زَرافةٌ، مَوْزٌ، ثم الجملة «الزُّوّارُ في كُمْزارَ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «اكتب حرف ز منفصلًا»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – رحلة إلى مسندم: يتخيل الأطفال رحلة بالقارب إلى قرية كمزار في محافظة مسندم، ويذكر كل طفل كلمة فيها حرف الزاي مثل: زورق، زرقاء، زيارة، ثم يقول جملة عن جمال بحر بلاده (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ز منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ز؟\nالإجابة: شكلان، ولا يتصل بما بعده.\nس3 (مستوى الاستدلال): اكتب كلمة «غَزالٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي زرافة وزيتون، وينطق التلميذ صوت الزاي كطنين النحلة «ززز»، ثم يكتب الحرف ونقطته بإصبعه على الرمل؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتحديد حرف ز في كلمتي «زيارة» و«كمزار» وفي كلمات أخرى (موز، زر)، ثم يصفون بجملتين مكانًا سياحيًا زاروه ويذكرون طريقة للمحافظة على نظافته.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: زَ زُ زِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «الزُّوّارُ في كُمْزارَ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ز لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ز بأشكاله وينسخ الجملة (دليل المعلم ص 285–297 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=22"]}]}, {"t": "حرف ط (الطاء): مطر على الشاطئ", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ط وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «مطر على الشاطئ»"], "w": "الأسبوع العاشر", "f": ["1. يتعرّف حرف ط (الطاء) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ط من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ط (10 دقائق)\n4. يستمع إلى نص «مطر على الشاطئ» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: نظافة الشواطئ مسؤولية الجميع (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. التعلم التعاوني\n10. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ط وألوان", "1. حرف الطاء\n2. الصوت\n3. أنشودة الحروف\n4. الشاطئ\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. المطر", "تعرض المعلمة بطاقة كبيرة لحرف ط، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «مطر على الشاطئ». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ط أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ط (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ط من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ط، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا طائرة» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ط (تقويم تكويني)، ويشير التلميذ إلى حرف ط في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن حرف ط (الطاء): مطر على الشاطئ، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ط بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: نظافة الشواطئ مسؤولية الجميع (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اذكر كلمة سمعتها في النص فيها حرف ط» على السبورة، ويناقش المعلم الإجابات مع الصف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n11. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. غلق الدرس – نشرة الطقس: يقدّم طفل من كل مجموعة نشرة طقس قصيرة عن مطر على شاطئ عماني بجملة تامة فيها حرف الطاء مثل: «هطل المطر على الشاطئ»، ويصفّق زملاؤه عند سماع صوت الطاء، ثم تقول المجموعة: «نحافظ على شواطئ عمان نظيفة» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ط»؟\nالإجابة: الطاء.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: نظافة الشواطئ مسؤولية الجميع.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي طائرة وطماطم وينطق الكلمتين بتفخيم صوت الطاء، ثم يشكّل التلميذ الحرف بخيط أو صلصال ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باكتشاف حرف ط في عنوان «مطر على الشاطئ» وفي كلمات أخرى (بطة، قطة)، ثم يقترحون قاعدتين للمحافظة على نظافة الشاطئ بجمل تامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ط.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ط: «قِطّةٌ» أم «عُلْبةٌ»؟\nالإجابة: «قِطّةٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ط في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «مطر على الشاطئ» بأسلوبه (دليل المعلم ص 298–308 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ط ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=23"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ط مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ط مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ط"], "w": "الأسبوع العاشر", "f": ["1. ينطق صوت حرف ط مع الفتحة والضمة والكسرة: طَ، طُ، طِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ط في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ط مع المدود: طا، طو، طي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (طَ ← طا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ط مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «هَطَلَ المَطَرُ على الشّاطِئِ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «طائِرةٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ط (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ط قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «هَطَلَ المَطَرُ على الشّاطِئِ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ط من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني\n9. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «طائِرةٌ» وتقرؤها بإطالة صوت ط، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة طَ، طُ، طِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: طَبْلٌ (أول)، قِطّةٌ (وسط)، خَيْطٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات طَ، طُ، طِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول ألاحظ: صوت حرف ط مع الحركات القصيرة وموقعه في الكلمة، ويبدأ المعلم بسؤال «هل يتغير صوت حرف ط إذا جاء في آخر الكلمة؟ وضّح بمثال» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. المدود الثلاثة: تعرض المعلمة طا، طو، طي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: طائِرةٌ، بَطّةٌ، مُشْطٌ، ثم الجملة «هَطَلَ المَطَرُ على الشّاطِئِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (4 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. من الكلمة إلى المقطع والصوت: تقسم المعلمة «طائِرةٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ط (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. أجرّد الحرف: تكتب المعلمة طَماطِمُ، مَطَرٌ، بَطٌّ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ط في كل كلمة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. أكمل الفكرة: يبدأ المعلم جملة عن أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ط، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n15. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n16. غلق الدرس – قطرات المطر: يلصق المعلم على السبورة قطرات مطر ورقية في كل منها مقطع أو كلمة فيها حرف الطاء (طَ، طُ، طِ، طا، طو، طي، مَطَرٌ)، ويقطف طفل من كل مجموعة قطرة ويقرؤها، فإن أصاب سقى شجرة يرسمها المعلم، ثم يقولون معًا: «المطر خير لأرض عمان» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: طَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: طُ أم طو؟\nالإجابة: طو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ط من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي طائرة وطماطم وينطق الكلمتين بتفخيم صوت الطاء، ثم يشكّل التلميذ الحرف بخيط أو صلصال ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باكتشاف حرف ط في عنوان «مطر على الشاطئ» وفي كلمات أخرى (بطة، قطة)، ثم يقترحون قاعدتين للمحافظة على نظافة الشاطئ بجمل تامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ط في كلمة «مَطَرٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ط في كلمة «مُشْطٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «بَطّةٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع طَ، طُ، طِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «هَطَلَ المَطَرُ على الشّاطِئِ.»؛ يرتب كلمات الجملة «هَطَلَ المَطَرُ على الشّاطِئِ.» ويقرؤها (دليل المعلم ص 298–308 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ط.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=23"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ط وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع العاشر", "f": ["1. يتعرّف أشكال حرف ط: طـ (أول الكلمة)، ـطـ (وسطها)، ـط (آخرها متصلًا)، ط (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ط بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (10 دقائق)\n3. ينسخ جملة «هَطَلَ المَطَرُ على الشّاطِئِ.» بخط واضح (5 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ط كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: طـ (أول الكلمة)، ـطـ (وسطها)، ـط (آخرها متصلًا)، ط (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: طائِرةٌ، خَيْطٌ، ثم الجملة «هَطَلَ المَطَرُ على الشّاطِئِ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n6. غلق الدرس – شاطئ نظيف جميل: تمثّل كل مجموعة رحلة إلى شاطئ عماني بعد المطر، فيجمع الأطفال قمامة متخيلة في كيس، ويذكرون كلمات بحرف الطاء مثل: شاطئ، مطر، طيور، ثم يقولون: «نحافظ على شواطئ عمان نظيفة» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ط منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ط؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «قِطّةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي طائرة وطماطم وينطق الكلمتين بتفخيم صوت الطاء، ثم يشكّل التلميذ الحرف بخيط أو صلصال ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باكتشاف حرف ط في عنوان «مطر على الشاطئ» وفي كلمات أخرى (بطة، قطة)، ثم يقترحون قاعدتين للمحافظة على نظافة الشاطئ بجمل تامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: طَ طُ طِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «هَطَلَ المَطَرُ على الشّاطِئِ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ط لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ط بأشكاله وينسخ الجملة (دليل المعلم ص 298–308 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=23"]}]}, {"t": "مراجعة المحور الثالث (ف، ت، ح، ق، ز، ط)", "u": "المحور الثالث: أنا نظيف", "s": [{"k": "القراءة", "p": ["قراءة مقاطع حروف (ف، ت، ح، ق، ز، ط) بالحركات القصيرة والمدود", "قراءة كلمات وجمل تضم حروف (ف، ت، ح، ق، ز، ط) مستعينًا بالصور", "التمييز السمعي والبصري بين حروف (ف، ت، ح، ق، ز، ط) وتحديد مواقعها في الكلمات"], "w": "الأسبوع الحادي عشر", "f": ["1. يقرأ مقاطع حروف (ف، ت، ح، ق، ز، ط) بالحركات القصيرة قراءة صحيحة (25 دقيقة)\n2. يقرأ المقاطع الطويلة بالمدود الثلاثة (5 دقائق)\n3. يميّز بين المقطع القصير والطويل (5 دقائق)\n4. يقرأ كلمات تضم حروف (ف، ت، ح، ق، ز، ط) قراءة صحيحة (15 دقيقة)\n5. يقرأ جمل دروس الحروف قراءة سليمة (10 دقائق)\n6. يطابق الكلمة بالصورة المعبّرة عنها (10 دقائق)\n7. يميّز سمعيًا بين أصوات حروف (ف، ت، ح، ق، ز، ط) (10 دقائق)\n8. يحدد موقع الحرف في الكلمة (أول، وسط، آخر) (10 دقائق)\n9. يميّز بصريًا بين أشكال الحروف (10 دقائق)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في المحور الثالث (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: فهم\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: فهم\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي\n4. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ف، ت، ح، ق، ز، ط\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ف، ت، ح، ق، ز، ط) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. قطار المقاطع: تعرض المعلمة جدول المقاطع لحروف (ف، ت، ح، ق، ز، ط) بالحركات والمدود وتقود قراءة متدرجة، ويقرأ التلميذ المقاطع أفقيًا وعموديًا (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة من الحروف (تقويم تكويني)، ويرفع التلميذ بطاقة قصير/طويل (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. سباق القراءة: تقسّم المعلمة الصف مجموعات تتسابق في قراءة بطاقات المقاطع، وتقرأ المجموعة البطاقات بسرعة ودقة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن قراءة مقاطع حروف (ف، ت، ح، ق، ز، ط) بالحركات القصيرة والمدود، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. أقرأ الكلمات: تعرض كلمات مصورة: فيلٌ، تُفّاحةٌ، حِصانٌ، قَلَمٌ، زَرافةٌ، طائِرةٌ، ويقرأ التلميذ الكلمات فرديًا وزمريًا (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. أقرأ الجمل: تعرض المعلمة جمل الدروس: «الفَتى النَّظيفُ مَحْبوبٌ.» / «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» / «فَرَحُ تُحِبُّ الحَمامةَ.» / «هذهِ قَرْيَتي.»، ويقرأ التلميذ الجمل قراءة سليمة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. طابق الكلمة بالصورة: توزّع المعلمة بطاقات كلمات وصور على المجموعات (تقويم تكويني)، وتطابق المجموعة الكلمة بصورتها (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن قراءة كلمات وجمل تضم حروف (ف، ت، ح، ق، ز، ط) مستعينًا بالصور، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. أسمع وأميّز: تنطق كلمات من دروس الحروف وتطلب رفع بطاقة الحرف المسموع، ويرفع التلميذ بطاقة الحرف الصحيح (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أين الحرف؟: تعرض كلمات: سَفينةٌ، كِتابٌ، نَحْلةٌ، بَقَرةٌ، غَزالٌ، قِطّةٌ وتطلب تحديد موقع الحرف (تقويم تكويني)، ويحدد التلميذ الموقع: أول/وسط/آخر (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n11. صندوق الحروف: تضع المعلمة بطاقات أشكال الحروف في صندوق وتسحب بطاقة، ويسمّي التلميذ الحرف ويذكر كلمة فيه (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n13. غلق الدرس – رحلة في ربوع عمان: يرسم المعلم طريقًا على السبورة عليه محطات، عند كل محطة بطاقة كلمة فيها أحد حروف (ف، ت، ح، ق، ز، ط)، وتتقدم المجموعة محطة كلما قرأت الكلمة قراءة صحيحة، ثم تذكر عند وصولها اسم مكان جميل في عمان تحب زيارته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: فُ\nالإجابة: قراءة صحيحة بالضمة.\nس2 (مستوى التطبيق): اقرأ الجملة «هَطَلَ المَطَرُ على الشّاطِئِ.».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): اذكر كلمة لكل حرف من حروف (ف، ت، ح، ق، ز، ط).\nالإجابة: كلمات صحيحة.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ مقاطع حرف ف بالتدريج: فَ فُ فِ ثم فا فو في، مستخدمًا بطاقات ملونة للحركات ومدّ اليد للمدود، ثم يكرر ذلك مع حرف ط؛ وللتحقق يقرأ التلميذ «فُ» أو «طي».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتركيب كلمات من بطاقات مقاطع حروف (ف، ت، ح، ق، ز، ط) مثل: توتٌ، حوتٌ، زيتٌ، ثم يحددون المقطع الطويل في كل كلمة ويقرؤونها أمام زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ هذا الحرف: ط\nالإجابة: الطاء.\nس2 (مستوى التطبيق): اقرأ كلمة «تُفّاحةٌ».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): اكتب جملة قصيرة فيها كلمة من دروس حروف (ف، ت، ح، ق، ز، ط).\nالإجابة: جملة صحيحة.", "للطالب: يراجع حروف (ف، ت، ح، ق، ز، ط) قراءة وكتابة (دليل المعلم ص 309–313).\nلولي الأمر: يراجع مع طفله الحروف ويملي عليه كلمتين.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=24"]}, {"k": "الإملاء", "p": ["الإملاء المنظور وأختبر تعلمي في حروف (ف، ت، ح، ق، ز، ط)"], "w": "الأسبوع الحادي عشر", "f": ["1. يكتب كلمات إملاءً منظورًا كتابة صحيحة (10 دقائق)\n2. يحل أنشطة مراجعة المحور (10 دقائق)\n3. يقيّم تعلّمه في حروف المحور (10 دقائق)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في المحور الثالث (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تقييم\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ف، ت، ح، ق، ز، ط\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ف، ت، ح، ق، ز، ط) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. إملاء منظور: تعرض كلمات ثم تخفيها وتمليها: سَيْفٌ، بَيْتٌ، تُفّاحٌ : يراجع مع طفله الحروف ويملي عليه كلمتين.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=24"]}, {"k": "الخط", "p": ["الكتابة: أشكال حروف (ف، ت، ح، ق، ز، ط) ونسخ كلمات وجمل"], "w": "الأسبوع الحادي عشر", "f": ["1. يكتب حروف (ف، ت، ح، ق، ز، ط) بأشكالها المختلفة (10 دقائق)\n2. ينسخ كلمات وجملًا بخط واضح (10 دقائق)\n3. يراعي اتجاه الكتابة والمسافة بين الكلمات (15 دقيقة)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في المحور الثالث (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ف، ت، ح، ق، ز، ط\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ف، ت، ح، ق، ز، ط) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. أشكال الحروف: تعرض المعلمة أشكال كل حرف وتنمذج كتابته، ويكتب التلميذ الأشكال في الدفتر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أنسخ: تكتب كلمات وجمل الدروس على السبورة (تقويم تكويني)، وينسخ التلميذ بخط واضح مراعيًا المسافات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. معرض الخط: تعرض المعلمة أجمل الكتابات على لوحة الصف، ويقيّم التلميذ كتابته وكتابة زميله بنجمة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص الكتابة: أشكال حروف (ف، ت، ح، ق، ز، ط) ونسخ كلمات وجمل، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – لوحة صفنا الجميل: تكتب كل مجموعة بخط واضح كلمة فيها أحد حروف (ف، ت، ح، ق، ز، ط) على شريط ورقي، وتلصقه على لوحة عنوانها «صفنا نظيف وعمان أجمل»، ثم يختار الصف أجمل خط ويصفّق
