وا، وو، وي (10 دقائق)\n8. يميّز نطقًا بين المقطع القصير والطويل (وَ ← وا) (10 دقائق)\n9. يقرأ كلمات وجملًا فيها حرف و مستعينًا بالصور (5 دقائق)\n10. يحلل جملة «وَجْبةُ اليَوْمِ لَذيذةٌ.» إلى كلمات (10 دقائق)\n11. يحلل كلمة «وَرْدةٌ» إلى مقاطع وأصوات (10 دقائق)\n12. يركّب كلمات من مقاطع فيها حرف و (10 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يقرأ مقاطع قصيرة بحرف و قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «وَجْبةُ اليَوْمِ لَذيذةٌ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف و من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: فهم\nالمخرج 7: تطبيق\nالمخرج 8: تحليل\nالمخرج 9: تطبيق\nالمخرج 10: تحليل\nالمخرج 11: تحليل\nالمخرج 12: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تطبيق\nالمخرج الآخر 4: تحليل", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. التعلم التعاوني\n10. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف و وألوان\n8. بطاقات المقاطع وبطاقات الحركات\n9. صورة توضيحية\n10. بطاقات كلمات مصورة\n11. بطاقات الجملة والكلمات والمقاطع", "1. حرف الواو\n2. الصوت\n3. أنشودة الحروف\n4. الوجبة\n5. الحركات القصيرة\n6. المقطع القصير\n7. موقع الحرف\n8. المقطع الطويل\n9. المد بالألف\n10. المد بالواو\n11. المد بالياء\n12. الجملة\n13. الكلمة\n14. المقطع\n15. التجريد", "تعرض المعلمة بطاقة كبيرة لحرف و، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «وجبة اليوم». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف و أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف و (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف و من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. صيد الأصوات: تذكر كلمات (وَرْدةٌ، حَيَوانٌ، دَلْوٌ) وأخرى ليس فيها الحرف، وتطلب التصفيق عند سماع صوت و (تقويم تكويني)، ويصفّق التلميذ عند سماع صوت الحرف (10 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. بطاقة الحرف: توزّع المعلمة بطاقة الحرف ليرسمه المتعلم في الهواء وعلى الطاولة بإصبعه، ويرسم التلميذ الحرف في الهواء ثم بإصبعه على الطاولة (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص التعرف البصري إلى حرف و وإنشاد بيته من أنشودة الحروف، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. ألاحظ: الحركات: تنطق المعلمة وَ، وُ، وِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أين الحرف؟: تنطق كلمات: وَلَدٌ (أول)، حَيَوانٌ (وسط)، دَلْوٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. لعبة المقاطع: توزّع المعلمة بطاقات وَ، وُ، وِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n9. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (5 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n10. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن ألاحظ: صوت حرف و مع الحركات القصيرة وموقعه في الكلمة، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. المدود الثلاثة: تعرض المعلمة وا، وو، وي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: وَرْدةٌ، سِوارٌ، جَرْوٌ، ثم الجملة «وَجْبةُ اليَوْمِ لَذيذةٌ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n14. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n15. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n16. من الكلمة إلى المقطع والصوت: تقسم المعلمة «وَرْدةٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n17. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف و (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n18. أجرّد الحرف: تكتب المعلمة وَزّةٌ، طاوُوسٌ، عَفْوٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف و في كل كلمة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n19. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n20. غلق الدرس – وردة الوطن: يرسم المعلم وردة كبيرة على السبورة على أوراقها مقاطع وكلمات فيها حرف الواو (وَ، وُ، وِ، وا، وو، وي، وَرْدةٌ)، ويقطف طفل من كل مجموعة ورقة ويقرؤها قراءة صحيحة، ثم تقول المجموعة جملة عن حبها لوطنها عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «و»؟\nالإجابة: الواو.\nس2 (مستوى التطبيق): أي المقطعين أطول: وُ أم وو؟\nالإجابة: وو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف و من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي وردة وولد، ويرسم التلميذ حرف و على الرمل ثم في الهواء وهو ينطق صوته، ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة «وجبة اليوم» مصورة لأسرتهم وتلوين حرف و في أسماء أطعمتها (موز، توت، لوز)، ثم يتحدثون عنها بجمل تامة ملتزمين الإنصات وعدم المقاطعة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف و في كلمة «طاوُوسٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت و: «حَيَوانٌ» أم «بَحْرٌ»؟\nالإجابة: «حَيَوانٌ».\nس3 (مستوى الاستدلال): اقرأ كلمة «سِوارٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يلوّن حرف و في ص الدرس الأولى وينشد بيته؛ يقرأ مقاطع وَ، وُ، وِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «وَجْبةُ اليَوْمِ لَذيذةٌ.»؛ يرتب كلمات الجملة «وَجْبةُ اليَوْمِ لَذيذةٌ.» ويقرؤها (دليل المعلم ص 332–338 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف و ويبحث معه عن أشياء في البيت تبدأ به؛ يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف و.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=29"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف و وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الرابع عشر", "f": ["1. يتعرّف أشكال حرف و: و (منفصلًا)، ـو (متصلًا بما قبله) (15 دقيقة)\n2. يكتب حرف و بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «وَجْبةُ اليَوْمِ لَذيذةٌ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. الحوار والمناقشة\n4. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف و كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: و (منفصلًا)، ـو (متصلًا بما قبله)، وتبيّن أن للحرف شكلان، ولا يتصل بما بعده، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: وَرْدةٌ، دَلْوٌ، ثم الجملة «وَجْبةُ اليَوْمِ لَذيذةٌ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أكتب: أشكال حرف و وكتابته في كلمات وجملة، وأختبر تعلمي، ويبدأ المعلم بسؤال «انسخ الجملة: «وَجْبةُ اليَوْمِ لَذيذةٌ.»» (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – وجبة تجمع الأسرة: تمثّل كل مجموعة أسرة عمانية تجتمع حول وجبة واحدة، ويقول كل طفل كلمة فيها حرف الواو مثل: ولد، ورد، وطن، ثم يتحدثون عن الأكل معًا وشكر الله والوالدين (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف و منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف و؟\nالإجابة: شكلان، ولا يتصل بما بعده.\nس3 (مستوى الاستدلال): اكتب كلمة «حَيَوانٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي وردة وولد، ويرسم التلميذ حرف و على الرمل ثم في الهواء وهو ينطق صوته، ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة «وجبة اليوم» مصورة لأسرتهم وتلوين حرف و في أسماء أطعمتها (موز، توت، لوز)، ثم يتحدثون عنها بجمل تامة ملتزمين الإنصات وعدم المقاطعة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: وَ وُ وِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «وَجْبةُ اليَوْمِ لَذيذةٌ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف و لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف و بأشكاله وينسخ الجملة (دليل المعلم ص 332–338 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=29"]}]}, {"t": "حرف ش (الشين): شجرة مشمش", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ش وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «شجرة مشمش»"], "w": "الأسبوع الرابع عشر", "f": ["1. يتعرّف حرف ش (الشين) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ش من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (15 دقيقة)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ش (10 دقائق)\n4. يستمع إلى نص «شجرة مشمش» استماعًا جيدًا (10 دقائق)\n5. يجيب عن أسئلة النص إجابات صحيحة (15 دقيقة)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: شكر الله على نعمة الغذاء وتقدير النظافة (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. الحوار والمناقشة\n10. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ش وألوان", "1. حرف الشين\n2. الصوت\n3. أنشودة الحروف\n4. الشجرة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. الغرس", "تعرض المعلمة بطاقة كبيرة لحرف ش، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «شجرة مشمش». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ش أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ش (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ش من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ش، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا شمس» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ش (تقويم تكويني)، ويشير التلميذ إلى حرف ش في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول حرف ش (الشين): شجرة مشمش، ويبدأ المعلم بسؤال «أنشد بيت حرف ش من أنشودة الحروف بأسلوب معبّر» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ش بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: شكر الله على نعمة الغذاء وتقدير النظافة (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. غلق الدرس – حديث الشجرة: يمثّل طفل من كل مجموعة دور شجرة من أشجار عمان كالنخلة أو المشمش، فتتحدث «الشجرة» عن نفسها بجملة فيها حرف الشين مثل: «أنا شجرة مشمش أحب الشمس»، ويصفّق الزملاء عند سماع صوت الشين، ثم يقولون: «نزرع الشجر لتبقى عمان خضراء» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ش»؟\nالإجابة: الشين.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: شكر الله على نعمة الغذاء وتقدير النظافة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي شمس وشجرة، وينطق التلميذ صوت الشين واضعًا إصبعه على فمه «ششش»، ثم يعدّ نقاط الحرف الثلاث ويضعها بالأزرار؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعدّ حروف الشين في عنوان «شجرة مشمش» (ثلاثة)، ورسم شجرة يكتبون على ثمارها كلمات فيها حرف ش، ثم يقولون جملة يشكرون فيها الله على نعمة الغذاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ش.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ش: «مِشْمِشٌ» أم «عُلْبةٌ»؟\nالإجابة: «مِشْمِشٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ش في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «شجرة مشمش» بأسلوبه (دليل المعلم ص 353–378 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ش ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=30"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ش مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ش مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ش"], "w": "الأسبوع الرابع عشر", "f": ["1. ينطق صوت حرف ش مع الفتحة والضمة والكسرة: شَ، شُ، شِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ش في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ش مع المدود: شا، شو، شي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (شَ ← شا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ش مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «شَمْسٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ش (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ش قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ش من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني\n9. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «شَمْسٌ» وتقرؤها بإطالة صوت ش، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة شَ، شُ، شِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: شَجَرةٌ (أول)، مِشْمِشٌ (وسط)، عُشٌّ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات شَ، شُ، شِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «هل يتغير صوت حرف ش إذا جاء في آخر الكلمة؟ وضّح بمثال» على السبورة، ويناقش المعلم الإجابات مع الصف (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. المدود الثلاثة: تعرض المعلمة شا، شو، شي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: شَمْسٌ، فَراشةٌ، ريشٌ، ثم الجملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص الدرس، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n11. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. من الكلمة إلى المقطع والصوت: تقسم المعلمة «شَمْسٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n13. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ش (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. أجرّد الحرف: تكتب المعلمة شايٌ، مُشْطٌ، كَبْشٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ش في كل كلمة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n15. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n16. غلق الدرس – قطف المشمش: يرسم المعلم شجرة مشمش على السبورة على ثمارها مقاطع وكلمات فيها حرف الشين (شَ، شُ، شِ، شا، شو، شي، مِشْمِشٌ)، وتقطف كل مجموعة ثمرة وتقرؤها قراءة صحيحة، ثم تذكر شجرة تحبها في بلدها عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: شَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: شُ أم شو؟\nالإجابة: شو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ش من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي شمس وشجرة، وينطق التلميذ صوت الشين واضعًا إصبعه على فمه «ششش»، ثم يعدّ نقاط الحرف الثلاث ويضعها بالأزرار؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعدّ حروف الشين في عنوان «شجرة مشمش» (ثلاثة)، ورسم شجرة يكتبون على ثمارها كلمات فيها حرف ش، ثم يقولون جملة يشكرون فيها الله على نعمة الغذاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ش في كلمة «مُشْطٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ش في كلمة «ريشٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «فَراشةٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع شَ، شُ، شِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.»؛ يرتب كلمات الجملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.» ويقرؤها (دليل المعلم ص 353–378 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ش.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=30"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ش وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الرابع عشر", "f": ["1. يتعرّف أشكال حرف ش: شـ (أول الكلمة)، ـشـ (وسطها)، ـش (آخرها متصلًا)، ش (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ش بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. التعلم المبني على اللعب", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ش كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: شـ (أول الكلمة)، ـشـ (وسطها)، ـش (آخرها متصلًا)، ش (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: شَمْسٌ، عُشٌّ، ثم الجملة «شَجَرةُ المِشْمِشِ كَبيرةٌ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص أكتب: أشكال حرف ش وكتابته في كلمات وجملة، وأختبر تعلمي، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – شجرة في وطني: يذكر أطفال كل مجموعة أشجارًا في عمان مثل: النخلة والمانجو والليمون، ويصفّقون عند سماع حرف الشين في كلمات مثل: شجرة، مشمش، شمس، ثم يتعهدون بسقي شجرة في البيت أو المدرسة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ش منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ش؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «مِشْمِشٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي شمس وشجرة، وينطق التلميذ صوت الشين واضعًا إصبعه على فمه «ششش»، ثم يعدّ نقاط الحرف الثلاث ويضعها بالأزرار؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعدّ حروف الشين في عنوان «شجرة مشمش» (ثلاثة)، ورسم شجرة يكتبون على ثمارها كلمات فيها حرف ش، ثم يقولون جملة يشكرون فيها الله على نعمة الغذاء.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: شَ شُ شِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «شَجَرةُ المِشْمِشِ كَبيرةٌ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ش لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ش بأشكاله وينسخ الجملة (دليل المعلم ص 353–378 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=30"]}]}, {"t": "حرف ع (العين): موعد على العشاء", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ع وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «موعد على العشاء»"], "w": "الأسبوع الرابع عشر", "f": ["1. يتعرّف حرف ع (العين) بصريًا ويلوّنه في الكلمات (15 دقيقة)\n2. ينشد بيت حرف ع من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ع (10 دقائق)\n4. يستمع إلى نص «موعد على العشاء» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: شكر الله على نعمة الغذاء والتعامل مع الآخرين (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. التعلم الذاتي\n10. فكر – زاوج – شارك", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ع وألوان", "1. حرف العين\n2. الصوت\n3. أنشودة الحروف\n4. الموعد\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. المعدة", "تعرض المعلمة بطاقة كبيرة لحرف ع، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «موعد على العشاء». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ع أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ع (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ع من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ع، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا عنب» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ع (تقويم تكويني)، ويشير التلميذ إلى حرف ع في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن حرف ع (العين): موعد على العشاء، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ع بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (6 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: شكر الله على نعمة الغذاء والتعامل مع الآخرين (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص أستمع وأجيب: نص الاستماع «موعد على العشاء»، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n11. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. غلق الدرس – دعوة إلى العشاء: يدعو كل طفل زميله إلى العشاء بجملة تامة فيها حرف العين مثل: «موعدنا على العشاء»، ويرد الزميل بالشكر، ثم يذكران عادة عمانية في استقبال الضيوف كتقديم القهوة والتمر، ويعرضان الحوار على الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ع»؟\nالإجابة: العين.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: شكر الله على نعمة الغذاء والتعامل مع الآخرين.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي عنب وعصفور ويبرز صوت العين من الحلق، ثم يتتبع التلميذ حرف ع المنقّط ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن حرف ع في عنوان «موعد على العشاء» وتحديد موضعه في كل كلمة، ثم يصفون مائدة عشاء أسرتهم بجملتين فيهما كلمات بحرف ع.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ع.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ع: «مِلْعَقةٌ» أم «بَحْرٌ»؟\nالإجابة: «مِلْعَقةٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ع في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «موعد على العشاء» بأسلوبه (دليل المعلم ص 379–388 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ع ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=31"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ع مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ع مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ع"], "w": "الأسبوع الرابع عشر", "f": ["1. ينطق صوت حرف ع مع الفتحة والضمة والكسرة: عَ، عُ، عِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ع في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ع مع المدود: عا، عو، عي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (عَ ← عا) (15 دقيقة)\n6. يقرأ كلمات وجملًا فيها حرف ع مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «مَوْعِدُنا على العَشاءِ.» إلى كلمات (10 دقائق)\n8. يحلل كلمة «عِنَبٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ع (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ع قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «مَوْعِدُنا على العَشاءِ.» قراءة صحيحة (10 دقائق)\n- يجرّد حرف ع من الكلمات بمواقعه المختلفة (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني\n9. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «عِنَبٌ» وتقرؤها بإطالة صوت ع، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة عَ، عُ، عِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: عُصْفورٌ (أول)، مِلْعَقةٌ (وسط)، ضِفْدَعٌ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات عَ، عُ، عِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول ألاحظ: صوت حرف ع مع الحركات القصيرة وموقعه في الكلمة، ويبدأ المعلم بسؤال «هل يتغير صوت حرف ع إذا جاء في آخر الكلمة؟ وضّح بمثال» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. المدود الثلاثة: تعرض المعلمة عا، عو، عي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: عِنَبٌ، شَمْعةٌ، شارِعٌ، ثم الجملة «مَوْعِدُنا على العَشاءِ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. أكمل الفكرة: يبدأ المعلم جملة عن الدرس، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n11. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. من الكلمة إلى المقطع والصوت: تقسم المعلمة «عِنَبٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n13. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ع (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. أجرّد الحرف: تكتب المعلمة عَيْنٌ، نَعامةٌ، إِصْبَعٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ع في كل كلمة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n15. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n16. غلق الدرس – أطباق العشاء: يرسم المعلم مائدة عشاء على السبورة عليها أطباق، في كل طبق مقطع أو كلمة فيها حرف العين (عَ، عُ، عِ، عا، عو، عي، عَشاءٌ)، ويتناوب أفراد المجموعات على قراءتها، ثم يذكرون عادة عمانية جميلة على مائدة الأسرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: عَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: عُ أم عو؟\nالإجابة: عو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ع من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي عنب وعصفور ويبرز صوت العين من الحلق، ثم يتتبع التلميذ حرف ع المنقّط ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن حرف ع في عنوان «موعد على العشاء» وتحديد موضعه في كل كلمة، ثم يصفون مائدة عشاء أسرتهم بجملتين فيهما كلمات بحرف ع.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ع في كلمة «نَعامةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ع في كلمة «شارِعٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «شَمْعةٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع عَ، عُ، عِ ويحدد موقع الحرف في ثلاث كلمات؛ يقرأ المقاطع الطويلة والجملة «مَوْعِدُنا على العَشاءِ.»؛ يرتب كلمات الجملة «مَوْعِدُنا على العَشاءِ.» ويقرؤها (دليل المعلم ص 379–388 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يقرأ مع طفله المقاطع ويلعب معه لعبة «أين الحرف؟»؛ يستمع إلى قراءة طفله ويصحح مد الأصوات؛ يقطّع مع طفله كلمات بالتصفيق ويحدد معه حرف ع.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=31"]}, {"k": "الخط", "p": ["أكتب: أشكال حرف ع وكتابته في كلمات وجملة، وأختبر تعلمي"], "w": "الأسبوع الخامس عشر", "f": ["1. يتعرّف أشكال حرف ع: عـ (أول الكلمة)، ـعـ (وسطها)، ـع (آخرها متصلًا)، ع (آخرها منفصلًا) (10 دقائق)\n2. يكتب حرف ع بحركاته القصيرة مفردًا وفي كلمات بحسب موضعه (5 دقائق)\n3. ينسخ جملة «مَوْعِدُنا على العَشاءِ.» بخط واضح (10 دقائق)\nمخرج تعليمي آخر:\n- يحل أنشطة «أختبر تعلمي» للحرف حلًا صحيحًا (15 دقيقة)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم بالنمذجة\n2. التعلم الذاتي\n3. الحوار والمناقشة\n4. العصف الذهني", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. السبورة التقليدية\n7. سبورة رملية وكراسة الخط", "1. أشكال الحرف\n2. الاتصال والانفصال\n3. اتجاه الكتابة", "ترسم المعلمة حرف ع كبيرًا على السبورة بالأسهم الموضحة لاتجاه الكتابة، وتطلب رسمه في الهواء. (5 دقائق)", "1. أشكال الحرف: تعرض المعلمة الأشكال: عـ (أول الكلمة)، ـعـ (وسطها)، ـع (آخرها متصلًا)، ع (آخرها منفصلًا)، وتبيّن أن للحرف أربعة أشكال، ويلاحظ التلميذ الأشكال ويشير إلى كل شكل في كلمة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أكتب الحرف: تنمذج المعلمة الكتابة على السطر بالحركات، وتتابع مسك القلم والجلسة، ويكتب التلميذ الحرف بأشكاله في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أكتب الكلمة والجملة: تملي المعلمة نقلًا: عِنَبٌ، ضِفْدَعٌ، ثم الجملة «مَوْعِدُنا على العَشاءِ.» (تقويم تكويني)، وينسخ التلميذ الكلمتين والجملة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول أكتب: أشكال حرف ع وكتابته في كلمات وجملة، وأختبر تعلمي، ويبدأ المعلم بسؤال «اكتب كلمة «مِلْعَقةٌ» واذكر شكل الحرف فيها» (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – عين على عمان: يقول كل طفل في مجموعته كلمة فيها حرف العين مثل: عُمان، عسل، علم، عيد، ثم تختار المجموعة كلمة واحدة وترسمها في الهواء وتقول عنها جملة مثل: «أحب علم عمان» (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ع منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ع؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «مِلْعَقةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي عنب وعصفور ويبرز صوت العين من الحلق، ثم يتتبع التلميذ حرف ع المنقّط ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن حرف ع في عنوان «موعد على العشاء» وتحديد موضعه في كل كلمة، ثم يصفون مائدة عشاء أسرتهم بجملتين فيهما كلمات بحرف ع.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: عَ عُ عِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «مَوْعِدُنا على العَشاءِ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ع لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ع بأشكاله وينسخ الجملة (دليل المعلم ص 379–388 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=31"]}]}, {"t": "حرف ظ (الظاء): ظافر طفل محظوظ", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "التحدث", "p": ["التعرف البصري إلى حرف ظ وإنشاد بيته من أنشودة الحروف والتحدث عن لوحة الدرس", "أستمع وأجيب: نص الاستماع «ظافر طفل محظوظ»"], "w": "الأسبوع الخامس عشر", "f": ["1. يتعرّف حرف ظ (الظاء) بصريًا ويلوّنه في الكلمات (10 دقائق)\n2. ينشد بيت حرف ظ من أنشودة الحروف مستخدمًا الإيماءات ولغة الجسد (10 دقائق)\n3. يتحدث عن لوحة الدرس بجمل تامة توظّف كلمات فيها حرف ظ (15 دقيقة)\n4. يستمع إلى نص «ظافر طفل محظوظ» استماعًا جيدًا (15 دقيقة)\n5. يجيب عن أسئلة النص إجابات صحيحة (10 دقائق)\n6. يحدد شخصيات النص وأحداثه الرئيسة (5 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالإنشاد الجماعي ويعبّر عن مشاعره (5 دقائق)\n- يستنتج قيمة النص: العادات الصحية في الحياة اليومية (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: فهم\nالمخرج 6: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم بالاكتشاف\n9. لعب الأدوار", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. الوسائل المتعددة (سمعية - بصرية)\n7. بطاقة حرف ظ وألوان", "1. حرف الظاء\n2. الصوت\n3. أنشودة الحروف\n4. الظهيرة\n5. الاستماع\n6. الشخصيات\n7. الأحداث\n8. مظلمة", "تعرض المعلمة بطاقة كبيرة لحرف ظ، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «ظافر طفل محظوظ». (5 دقائق)", "1. أتأمل ثم ألوّن: توجّه المعلمة إلى صفحة الدرس الأولى وتطلب تلوين حرف ظ أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا، ويتأمل التلميذ الصورة ويلوّن حرف ظ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أنشد: تعرض المعلمة بيت حرف ظ من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه، وينشد التلميذ البيت مع الإيماءات ولغة الجسد (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أتحدث: تذكّر المعلمة بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ظ، ويتحدث التلميذ عن اللوحة بجمل مثل: «هذا ظرف» (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. كلمات من الصورة: تكتب المعلمة على السبورة كلمات ذكرها المتعلمون فيها حرف ظ (تقويم تكويني)، ويشير التلميذ إلى حرف ظ في الكلمات المكتوبة (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «أي الكلمتين فيها صوت ظ: «نَظّارةٌ» أم «بَحْرٌ»»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الاستماع الأول: تقرأ المعلمة النص قراءة جهرية سليمة مع تلوين الصوت، وتبرز حرف ظ بنبرة واضحة، ويستمع التلميذ بانتباه دون مقاطعة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الاستماع الثاني: تعيد المعلمة القراءة مع الإشارة إلى الكلمات والصور في العرض، ويربط التلميذ بين الكلمات المسموعة والصور (7 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n8. أجيب: تطرح المعلمة أسئلة «أجيب»: من شخصيات النص؟ أين وقعت الأحداث؟ ماذا حدث؟ (تقويم تكويني)، ويجيب التلميذ ويرسم أو يختار الإجابة في الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n9. أستنتج القيمة: تسأل المعلمة: ماذا تعلّمنا من النص؟ ويذكر التلميذ القيمة: العادات الصحية في الحياة اليومية (4 دقائق)\nالاستراتيجيات: التنبؤ.\n\n10. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. غلق الدرس – لقاء مع ظافر: يمثّل طفل دور ظافر ويجيب عن أسئلة زملاء مجموعته بجمل تامة فيها حرف الظاء مثل: «أنا ظافر، أحافظ على نظافة صفي»، ويصفّق الزملاء عند سماع صوت الظاء، ثم يذكر كل طفل شيئًا يحافظ عليه في وطنه عمان (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم هذا الحرف: «ظ»؟\nالإجابة: الظاء.\nس2 (مستوى التطبيق): من شخصيات النص؟\nالإجابة: ذكر شخصيات النص كما وردت.\nس3 (مستوى الاستدلال): ماذا تعلّمت من النص؟\nالإجابة: العادات الصحية في الحياة اليومية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي ظرف وظبي، وينطق التلميذ صوت الظاء بإخراج طرف لسانه قليلًا، ثم يرسم الحرف ونقطته ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعدّ حرف ظ في عنوان «ظافر طفل محظوظ» والتمييز بينه وبين الطاء في كلمة «طفل»، ثم يذكرون عادتين صحيتين تجعلان الطفل محظوظًا في يومه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر كلمة سمعتها في النص فيها حرف ظ.\nالإجابة: كلمة صحيحة من النص فيها الحرف.\nس2 (مستوى التطبيق): أي الكلمتين فيها صوت ظ: «نَظّارةٌ» أم «بَحْرٌ»؟\nالإجابة: «نَظّارةٌ».\nس3 (مستوى الاستدلال): لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\nالإجابة: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يلوّن حرف ظ في ص الدرس الأولى وينشد بيته؛ يحكي لأسرته نص «ظافر طفل محظوظ» بأسلوبه (دليل المعلم ص 389–396 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يردد مع طفله بيت حرف ظ ويبحث معه عن أشياء في البيت تبدأ به؛ يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=32"]}, {"k": "القراءة", "p": ["ألاحظ: صوت حرف ظ مع الحركات القصيرة وموقعه في الكلمة", "أقرأ: حرف ظ مع المدود (ا، و، ي) وقراءة كلمات وجمل مستعينًا بالصور", "أحلل وأركّب: الجملة والكلمة والمقطع والصوت مع حرف ظ"], "w": "الأسبوع الخامس عشر", "f": ["1. ينطق صوت حرف ظ مع الفتحة والضمة والكسرة: ظَ، ظُ، ظِ (10 دقائق)\n2. يميّز سمعيًا موقع حرف ظ في الكلمة (أولها، وسطها، آخرها) (10 دقائق)\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة (10 دقائق)\n4. يقرأ حرف ظ مع المدود: ظا، ظو، ظي (10 دقائق)\n5. يميّز نطقًا بين المقطع القصير والطويل (ظَ ← ظا) (10 دقائق)\n6. يقرأ كلمات وجملًا فيها حرف ظ مستعينًا بالصور (5 دقائق)\n7. يحلل جملة «ظافِرٌ طِفْلٌ مَحْظوظٌ.» إلى كلمات (15 دقيقة)\n8. يحلل كلمة «ظَرْفٌ» إلى مقاطع وأصوات (10 دقائق)\n9. يركّب كلمات من مقاطع فيها حرف ظ (10 دقائق)\nمخرج تعليمي آخر:\n- يقرأ مقاطع قصيرة بحرف ظ قراءة صحيحة (10 دقائق)\n- يقرأ الجملة «ظافِرٌ طِفْلٌ مَحْظوظٌ.» قراءة صحيحة (15 دقيقة)\n- يجرّد حرف ظ من الكلمات بمواقعه المختلفة (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج 7: تحليل\nالمخرج 8: تحليل\nالمخرج 9: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تحليل", "1. التعلم بالنمذجة\n2. التعلم المبني على اللعب\n3. التعلم بالاكتشاف\n4. التدريس المباشر\n5. السؤال والجواب\n6. التنبؤ\n7. العصف الذهني\n8. التعلم التعاوني\n9. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات المقاطع وبطاقات الحركات\n7. صورة توضيحية\n8. بطاقات كلمات مصورة\n9. بطاقات الجملة والكلمات والمقاطع", "1. الصوت\n2. الحركات القصيرة\n3. المقطع القصير\n4. موقع الحرف\n5. المقطع الطويل\n6. المد بالألف\n7. المد بالواو\n8. المد بالياء\n9. الجملة\n10. الكلمة\n11. المقطع\n12. التجريد", "تعرض المعلمة كلمة «ظَرْفٌ» وتقرؤها بإطالة صوت ظ، ثم تسأل: ما الصوت الذي سمعتموه في أول الكلمة؟ (5 دقائق)", "1. ألاحظ: الحركات: تنطق المعلمة ظَ، ظُ، ظِ وتربط كل حركة بإيماءة يد (فتحة للأعلى، ضمة دائرية، كسرة للأسفل)، ويحاكي التلميذ النطق مع الإيماءة فرديًا وجماعيًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أين الحرف؟: تنطق كلمات: ظِلٌّ (أول)، نَظّارةٌ (وسط)، حَظٌّ (آخر)، وتطلب تحديد الموقع (تقويم تكويني)، ويرفع التلميذ بطاقة: أول / وسط / آخر (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة المقاطع: توزّع المعلمة بطاقات ظَ، ظُ، ظِ مبعثرة وتنطق مقطعًا لتلتقطه المجموعة، وتلتقط المجموعة البطاقة الصحيحة وتقرؤها (8 دقائق)\nالاستراتيجيات: التدريس المباشر.\n\n4. تعميم: تكتب المعلمة: اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه، والتلاميذ يرددون التعميم (4 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n5. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول ألاحظ: صوت حرف ظ مع الحركات القصيرة وموقعه في الكلمة، ويبدأ المعلم بسؤال «اقرأ المقاطع: ظَ، ظُ، ظِ» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. المدود الثلاثة: تعرض المعلمة ظا، ظو، ظي وتربط كل مد بحركته (الفتحة مع الألف، الضمة مع الواو، الكسرة مع الياء)، ويقرأ التلميذ المقاطع الطويلة ويمد الصوت (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة ويرفع المتعلمون بطاقة «قصير» أو «طويل» (تقويم تكويني)، ويرفع التلميذ البطاقة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. أقرأ مستعينًا بالصور: تعرض كلمات مصورة: ظَرْفٌ، مِظَلّةٌ، حِفْظٌ، ثم الجملة «ظافِرٌ طِفْلٌ مَحْظوظٌ.»، ويقرأ التلميذ الكلمات والجملة فرديًا وزمريًا (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أكمل بالمقطع: توجّه المعلمة نشاط «أكمل بالمقطع المناسب» في الكتاب، ويكمل التلميذ الكلمات بالمقطع المناسب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. من الجملة إلى الكلمة: تقص المعلمة الشريط إلى كلمات (3 كلمات) وتطلب ترتيبها من جديد، ويرتب التلميذ الكلمات لتكوين الجملة ويقرؤها (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. من الكلمة إلى المقطع والصوت: تقسم المعلمة «ظَرْفٌ» إلى مقاطع بالتصفيق ثم إلى أصوات، ويصفّق التلميذ لكل مقطع ثم ينطق الأصوات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. أركّب: توزّع المعلمة على المجموعات بطاقات مقاطع لتركيب كلمات فيها حرف ظ (تقويم تكويني)، وتركّب المجموعة كلمات وتقرؤها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. أجرّد الحرف: تكتب المعلمة ظَبْيٌ، مَحْفَظةٌ، لَفْظٌ وتطلب وضع دائرة حول الحرف، ويضع التلميذ دائرة حول حرف ظ في كل كلمة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n14. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى تلميذ فيجيب عن سؤال من الدرس مثل «كم كلمة في جملة «ظافِرٌ طِفْلٌ مَحْظوظٌ.»»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n15. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n16. غلق الدرس – حارس النظافة: يقرأ طفل من كل مجموعة بطاقة فيها مقطع أو كلمة فيها حرف الظاء (ظَ، ظُ، ظِ، ظا، ظو، ظي، نَظيفٌ)، فإن أصاب نال شارة «حارس النظافة» لمجموعته، ثم تقول المجموعة جملة عن المحافظة على نظافة وطنها عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: ظَ\nالإجابة: قراءة صحيحة بالفتحة.\nس2 (مستوى التطبيق): أي المقطعين أطول: ظُ أم ظو؟\nالإجابة: ظو.\nس3 (مستوى الاستدلال): ركّب كلمة جديدة فيها حرف ظ من بطاقات المقاطع.\nالإجابة: تركيب كلمة صحيحة وقراءتها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي ظرف وظبي، وينطق التلميذ صوت الظاء بإخراج طرف لسانه قليلًا، ثم يرسم الحرف ونقطته ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعدّ حرف ظ في عنوان «ظافر طفل محظوظ» والتمييز بينه وبين الطاء في كلمة «طفل»، ثم يذكرون عادتين صحيتين تجعلان الطفل محظوظًا في يومه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ضع دائرة حول حرف ظ في كلمة «مَحْفَظةٌ».\nالإجابة: تحديد الحرف في وسط الكلمة.\nس2 (مستوى التطبيق): أين حرف ظ في كلمة «حِفْظٌ»؟\nالإجابة: في آخرها.\nس3 (مستوى الاستدلال): اقرأ كلمة «مِظَلّةٌ» واذكر مقطعًا طويلًا فيها إن وُجد.\nالإجابة: قراءة صحيحة مع تحديد المقطع الطويل أو بيان عدم وجوده.", "للطالب: يقرأ مقاطع ظَ، ظُ، ظِ وي  أختبر تعلمي: توجّه المعلمة حل أنشطة التقويم في آخر الدرس وتصحح فرديًا، ويحل التلميذ الأنشطة ويصحح أخطاءه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن أكتب: أشكال حرف ظ وكتابته في كلمات وجملة، وأختبر تعلمي، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. غلق الدرس – محظوظ لأني عماني: يكمل كل زوج جملة «أنا محظوظ لأن في بلادي…» بشيء جميل في عمان كالبحر أو الجبال أو الأمان، ويذكران كلمة فيها حرف الظاء مثل: ظافر، نظيف، محظوظ، ثم يشاركان الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ظ منفصلًا.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): كم شكلًا لحرف ظ؟\nالإجابة: أربعة أشكال.\nس3 (مستوى الاستدلال): اكتب كلمة «نَظّارةٌ» واذكر شكل الحرف فيها.\nالإجابة: كتابة صحيحة مع تحديد شكل الحرف في وسط الكلمة أو اتصاله بما قبله.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورتي ظرف وظبي، وينطق التلميذ صوت الظاء بإخراج طرف لسانه قليلًا، ثم يرسم الحرف ونقطته ويلوّنه في الكلمتين؛ وللتحقق يسأله: ما اسم هذا الحرف؟ واذكر كلمة تبدأ به.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعدّ حرف ظ في عنوان «ظافر طفل محظوظ» والتمييز بينه وبين الطاء في كلمة «طفل»، ثم يذكرون عادتين صحيتين تجعلان الطفل محظوظًا في يومه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اكتب: ظَ ظُ ظِ\nالإجابة: كتابة صحيحة للمقاطع.\nس2 (مستوى التطبيق): انسخ الجملة: «ظافِرٌ طِفْلٌ مَحْظوظٌ.»\nالإجابة: نسخ صحيح بخط واضح.\nس3 (مستوى الاستدلال): اكتب كلمة جديدة فيها حرف ظ لم ترد في الدرس.\nالإجابة: كلمة صحيحة فيها الحرف.", "للطالب: يكتب حرف ظ بأشكاله وينسخ الجملة (دليل المعلم ص 389–396 (الجزء الثاني من كتاب الطالب غير متوفر لديّ)).\nلولي الأمر: يتابع طفله في مسك القلم واتجاه الكتابة من اليمين إلى اليسار.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ء، ج، و، ش، ع، ظ\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ء، ج، و) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. قطار المقاطع: تعرض المعلمة جدول المقاطع لحروف (ء، ج، و، ش، ع، ظ) بالحركات والمدود وتقود قراءة متدرجة، ويقرأ التلميذ المقاطع أفقيًا وعموديًا (26 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. قصير أم طويل؟: تنطق المعلمة مقاطع مختلطة من الحروف (تقويم تكويني)، ويرفع التلميذ بطاقة قصير/طويل (23 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. سباق القراءة: تقسّم المعلمة الصف مجموعات تتسابق في قراءة بطاقات المقاطع، وتقرأ المجموعة البطاقات بسرعة ودقة (23 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن قراءة مقاطع حروف (ء، ج، و) بالحركات القصيرة والمدود، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن قراءة مقاطع حروف (ش، ع، ظ) بالحركات القصيرة والمدود، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. أقرأ الكلمات: تعرض كلمات مصورة: أَرْنَبٌ، جَمَلٌ، وَرْدةٌ، شَمْسٌ، عِنَبٌ، ظَرْفٌ، ويقرأ التلميذ الكلمات فرديًا وزمريًا (26 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أقرأ الجمل: تعرض المعلمة جمل الدروس: «أَحْمِلُ عُلْبةَ الغِذاءِ.» / «هذهِ وَجْبَتي المُفَضَّلةُ.» / «وَجْبةُ اليَوْمِ لَذيذةٌ.» / «شَجَرةُ المِشْمِشِ كَبيرةٌ.» / «مَوْعِدُنا على العَشاءِ.» / «ظافِرٌ طِفْلٌ مَحْظوظٌ.»، ويقرأ التلميذ الجمل قراءة سليمة (22 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n8. طابق الكلمة بالصورة: توزّع المعلمة بطاقات كلمات وصور على المجموعات (تقويم تكويني)، وتطابق المجموعة الكلمة بصورتها (22 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أسمع وأميّز: تنطق كلمات من دروس الحروف وتطلب رفع بطاقة الحرف المسموع، ويرفع التلميذ بطاقة الحرف الصحيح (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أين الحرف؟: تعرض كلمات: فَأْرٌ، دَجاجةٌ، حَيَوانٌ، مِشْمِشٌ، مِلْعَقةٌ، نَظّارةٌ وتطلب تحديد موقع الحرف (تقويم تكويني)، ويحدد التلميذ الموقع: أول/وسط/آخر (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n11. صندوق الحروف: تضع المعلمة بطاقات أشكال الحروف في صندوق وتسحب بطاقة، ويسمّي التلميذ الحرف ويذكر كلمة فيه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. أحلل: تعرض المعلمة الجمل «أَحْمِلُ عُلْبةَ الغِذاءِ.» / «شَجَرةُ المِشْمِشِ كَبيرةٌ.» وتحللها مع المتعلمين، ويحلل التلميذ الجملة إلى كلمات ومقاطع (26 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. أركّب: توزّع المعلمة مقاطع لتركيب كلمات (تقويم تكويني)، ويركّب كلمات ويقرؤها (22 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n14. أرتب الجملة: توزّع كلمات الجمل «وَجْبةُ اليَوْمِ لَذيذةٌ.» / «ظافِرٌ طِفْلٌ مَحْظوظٌ.» مبعثرة، ويرتب التلميذ الكلمات ويقرأ الجملة (22 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n15. بنك الكلمات: تطلب المعلمة من كل مجموعة جمع أكبر عدد من الكلمات بحروف المحور، وتكتب المجموعة كلماتها وتقرؤها (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n16. الكلمة الناقصة: تعرض كلمات ينقصها حرف (تقويم تكويني)، ويكمل التلميذ الحرف الناقص (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n17. من أنا؟: تصف المعلمة حرفًا ليخمّنه المتعلمون، ويخمّن التلميذ الحرف ويكتبه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n18. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n19. غلق الدرس – عقد اللؤلؤ: يعلّق المعلم على السبورة عقدًا من حبات لؤلؤ ورقية، على كل حبة كلمة فيها أحد حروف (ء، ج، و، ش، ع، ظ)، وتلتقط كل مجموعة حبة وتقرؤها قراءة صحيحة، ثم يذكرون أن الغوص على اللؤلؤ من تراث أجدادنا في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ: أُ\nالإجابة: قراءة صحيحة بالضمة.\nس2 (مستوى التطبيق): أين حرف ظ في «نَظّارةٌ»؟\nالإجابة: في وسطها.\nس3 (مستوى الاستدلال): كوّن كلمة جديدة من حرفين من حروف المحور.\nالإجابة: كلمة صحيحة.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ مقاطع الهمزة بالحركات (أَ أُ إِ) ثم مقاطع حرف و بالحركات والمدود (وَ وُ وِ، وا وو وي) مع بطاقات ملونة وإشارة اليد للمد؛ وللتحقق يقرأ التلميذ «أُ» أو «وي».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتركيب كلمات من بطاقات مقاطع حروف (ء، ج، و، ش، ع، ظ) مثل: شايٌ، جوعٌ، عاشَ، ثم يحددون المقطع الطويل في كل كلمة ويقرؤونها أمام زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ هذا الحرف: ظ\nالإجابة: الظاء.\nس2 (مستوى التطبيق): اقرأ كلمة «بِئْرٌ».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): اكتب جملة قصيرة فيها كلمة من دروس حروف (ء، ج، و، ش، ع، ظ).\nالإجابة: جملة صحيحة.", "للطالب: يراجع حروف (ء، ج، و، ش، ع، ظ) قراءة وكتابة (دليل المعلم ص 397–398).\nلولي الأمر: يراجع مع طفله الحروف ويملي عليه كلمتين.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=33"]}, {"k": "الإملاء", "p": ["الإملاء المنظور وأختبر تعلمي في حروف (ء، ج، و، ش، ع، ظ)"], "w": "الأسبوع السادس عشر", "f": ["1. يكتب كلمات إملاءً منظورًا كتابة صحيحة (10 دقائق)\n2. يحل أنشطة مراجعة المحور (10 دقائق)\n3. يقيّم تعلّمه في حروف المحور (10 دقائق)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في المحور الرابع (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تقييم\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي\n4. الحوار والمناقشة\n5. الرؤوس المرقمة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ء، ج، و، ش، ع، ظ\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ء، ج، و، ش، ع، ظ) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. إملاء منظور: تعرض كلمات ثم تخفيها وتمليها: ماءٌ، ثَلْجٌ، دَلْوٌ، عُشٌّ، ويكتب التلميذ الكلمات من الذاكرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أختبر تعلمي: توجّه المعلمة حل أنشطة صفحات المراجعة (تقويم تكويني)، ويحل التلميذ الأنشطة فرديًا io/afuq/q/1/arabic/?l=33"]}, {"k": "الخط", "p": ["الكتابة: أشكال حروف (ء، ج، و، ش، ع، ظ) ونسخ كلمات وجمل"], "w": "الأسبوع السادس عشر", "f": ["1. يكتب حروف (ء، ج، و، ش، ع، ظ) بأشكالها المختلفة (10 دقائق)\n2. ينسخ كلمات وجملًا بخط واضح (10 دقائق)\n3. يراعي اتجاه الكتابة والمسافة بين الكلمات (10 دقائق)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في المحور الرابع (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ء، ج، و، ش، ع، ظ\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ء، ج، و، ش، ع، ظ) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. أشكال الحروف: تعرض المعلمة أشكال كل حرف وتنمذج كتابته، ويكتب التلميذ الأشكال في الدفتر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أنسخ: تكتب كلمات وجمل الدروس على السبورة (تقويم تكويني)، وينسخ التلميذ بخط واضح مراعيًا المسافات (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. معرض الخط: تعرض المعلمة أجمل الكتابات على لوحة الصف، ويقيّم التلميذ كتابته وكتابة زميله بنجمة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «سمِّ هذا الحرف: ظ» على السبورة، ويناقش المعلم الإجابات مع الصف (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – بطاقة ترحيب: تكتب كل مجموعة بخط واضح على بطاقة مزينة كلمة فيها أحد حروف (ء، ج، و، ش، ع، ظ) لترحب بها بضيف الصف، ثم تقدمها له مع جملة ترحيب كما يكرم العمانيون ضيوفهم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اكتب حرف ء في أول الكلمة.\nالإجابة: كتابة صحيحة.\nس2 (مستوى التطبيق): انسخ كلمة «حَظٌّ».\nالإجابة: نسخ صحيح.\nس3 (مستوى الاستدلال): انسخ جملة «ظافِرٌ طِفْلٌ مَحْظوظٌ.» مراعيًا المسافات.\nالإجابة: نسخ صحيح منظم.\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم مع التلميذ مقاطع الهمزة بالحركات (أَ أُ إِ) ثم مقاطع حرف و بالحركات والمدود (وَ وُ وِ، وا وو وي) مع بطاقات ملونة وإشارة اليد للمد؛ وللتحقق يقرأ التلميذ «أُ» أو «وي».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتركيب كلمات من بطاقات مقاطع حروف (ء، ج، و، ش، ع، ظ) مثل: شايٌ، جوعٌ، عاشَ، ثم يحددون المقطع الطويل في كل كلمة ويقرؤونها أمام زملائهم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ هذا الحرف: ظ\nالإجابة: الظاء.\nس2 (مستوى التطبيق): اقرأ كلمة «بِئْرٌ».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): اكتب جملة قصيرة فيها كلمة من دروس حروف (ء، ج، و، ش، ع، ظ).\nالإجابة: جملة صحيحة.", "للطالب: يراجع حروف (ء، ج، و، ش، ع، ظ) قراءة وكتابة (دليل المعلم ص 397–398).\nلولي الأمر: يراجع مع طفله الحروف ويملي عليه كلمتين.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=33"]}]}, {"t": "النشيد: توازن الغذاء", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "القراءة", "p": ["الاستماع إلى نشيد «توازن الغذاء» وفهم معانيه", "حفظ نشيد «توازن الغذاء» وإنشاده بالإيماءات ولغة الجسد", "استخراج حروف المحور (ء، ج، و، ش، ع، ظ) من النشيد والأداء الجماعي"], "w": "الأسبوع السادس عشر", "f": ["1. يستمع إلى نشيد «توازن الغذاء» وينشده بصوت جميل (30 دقيقة)\n2. يعبّر عن فكرة النشيد بلغته (25 دقيقة)\n3. يتعرف معاني الكلمات الجديدة في النشيد (10 دقائق)\n4. يستخدم الإيماءات ولغة الجسد للتعبير عن المشاعر في أثناء الإنشاد (25 دقيقة)\nمخرج تعليمي آخر:\n- يتمثّل قيمة المحور «هذا غدائي» (30 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التشاركي\n2. التعلم المبني على اللعب\n3. التعلم بالنمذجة\n4. التعلم التعاوني\n5. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. الوسائل المتعددة (سمعية - بصرية)\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. تسجيل النشيد الملحّن ومسرح الدمى", "1. النشيد\n2. الإيقاع\n3. هذا غدائي", "تعرض المعلمة صفحة النشيد وتمهد بقصة قصيرة عن موضوعه، ثم تسأل: عمّ تتوقعون أن يتحدث النشيد؟ (5 دقائق)", "1. الاستماع إلى النشيد: تعرض المعلمة النشيد وتنشده ملحّنًا مرتين، ويستمع التلميذ وينصت (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. معاني الكلمات: توضح المعلمة الكلمات الجديدة بالصور والتمثيل (تقويم تكويني)، ويربط التلميذ الكلمة بمعناها (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. فكرة النشيد: تسأل المعلمة: عمّ يتحدث النشيد؟ ما القيمة التي يدعو إليها؟ ويعبّر التلميذ عن فكرة النشيد بجملة (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «عبّر عن مشاعرك تجاه موضوع النشيد بجملة» على السبورة، ويناقش المعلم الإجابات مع الصف (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الحفظ بالترديد: تنشد المعلمة البيت وتردده المجموعات بالتناوب، ويردد التلميذ الأبيات حتى يحفظها (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الإنشاد المعبّر: تنمذج المعلمة الإيماءات لكل بيت (تقويم تكويني)، وينشد التلميذ مع الإيماءات ولغة الجسد (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. منافسة الإنشاد: تقيّم المعلمة أداء المجموعات وتعزز الأسرع حفظًا، وتنشد كل مجموعة ويقيّم الزملاء الأداء (9 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول حفظ نشيد «توازن الغذاء» وإنشاده بالإيماءات ولغة الجسد، ويبدأ المعلم بسؤال «ما القيمة التي يدعو إليها النشيد» (6 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n9. صيد الحروف: تعرض المعلمة النشيد مكتوبًا وتطلب البحث عن حروف المحور، ويلوّن التلميذ حروف المحور في النشيد (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. كلمات من النشيد: تطلب المعلمة قراءة كلمات من النشيد فيها حروف المحور (تقويم تكويني)، ويقرأ التلميذ الكلمات ويحدد الحرف (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n11. الأداء الختامي: تنظم المعلمة إنشادًا جماعيًا بمسرح الدمى إن أمكن، وينشد التلميذ مع زملائه أداءً جماعيًا (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n13. غلق الدرس – طبق عماني متوازن: تتعاون كل مجموعة في تكوين طبق متوازن من أطعمة عمانية كالسمك والأرز والخضار والتمر، وتنشد مقطعًا من النشيد وهي تعرضه، ثم يقول الأطفال: «نأكل من خيرات بلادنا باعتدال» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما عنوان النشيد؟\nالإجابة: «توازن الغذاء».\nس2 (مستوى التطبيق): أنشد بيتًا من النشيد.\nالإجابة: إنشاد صحيح.\nس3 (مستوى الاستدلال): ما القيمة التي يدعو إليها النشيد؟\nالإجابة: قيمة متصلة بمحور «هذا غدائي».\n\n• نشاط علاجي (لمن لم يتقن): ينشد المعلم مع التلميذ بيتًا من نشيد «توازن الغذاء» وهو يعرض صور أطعمة صحية متنوعة، فيرفع التلميذ صورة ويردد البيت؛ وللتحقق يسأله: ما عنوان النشيد؟ ثم ينشد البيت وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم طبق غذاء متوازن بالقص واللصق مستوحى من نشيد «توازن الغذاء» وأداء النشيد بحركات معبّرة، ثم يشرحون لماذا نأكل أنواعًا مختلفة من الطعام.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أنشد النشيد مع زملائك.\nالإجابة: إنشاد جماعي صحيح.\nس2 (مستوى التطبيق): اذكر كلمة من النشيد فيها حرف من حروف المحور.\nالإجابة: كلمة صحيحة.\nس3 (مستوى الاستدلال): عبّر عن مشاعرك تجاه موضوع النشيد بجملة.\nالإجابة: جملة معبّرة صحيحة.", "للطالب: ينشد نشيد «توازن الغذاء» لأسرته (دليل المعلم ص 399–402).\nلولي الأمر: يستمع إلى إنشاد طفله ويشجعه.\nالمرجع: كتاب الطالب – الجزء الثاني: غير متوفر لديّ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=34"]}]}, {"t": "قراءة تشاركية – المحور الرابع", "u": "المحور الرابع: هذا غدائي", "s": [{"k": "التحدث", "p": ["إعادة سرد القصة وتمثيلها"], "w": "الأسبوع السادس عشر", "f": ["1. يشارك في القراءة التشاركية لقصة المحور (5 دقائق)\n2. يتوقع أحداث القصة من الصور والعنوان (15 دقيقة)\n3. يحدد شخصيات القصة وأحداثها (10 دقائق)\nمخرج تعليمي آخر:\n- يربط القصة بقيم محور «هذا غدائي» (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج ات لتكوين جملة مفيدة (10 دقائق)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في الفصل الدراسي الأول (45 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تحليل\nالمخرج 5: تحليل\nالمخرج 6: فهم\nالمخرج 7: تحليل\nالمخرج 8: إبداع\nالمخرج 9: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي\n4. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ب، ل، م، ر، د، س، ك، ن، ف، ت، ح، ق، ز، ط، ء، ج، و، ش، ع، ظ\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ب، ل، م، ر) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. أقرأ الكلمات: تعرض كلمات مصورة: بابٌ، لَيْمونٌ، مَوْزٌ، رُمّانٌ، ديكٌ، سَمَكةٌ، كِتابٌ، نَحْلةٌ، فيلٌ، تُفّاحةٌ، حِصانٌ، قَلَمٌ، زَرافةٌ، طائِرةٌ، أَرْنَبٌ، جَمَلٌ، وَرْدةٌ، شَمْسٌ، عِنَبٌ، ظَرْفٌ، ويقرأ التلميذ الكلمات فرديًا وزمريًا (78 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أقرأ الجمل: تعرض المعلمة جمل الدروس: «عَبيرُ قُرْبَ البابِ.» / «لَيْلى تَلْعَبُ مَعَ أَخيها.» / «أُسْرَتي مُتَعاوِنةٌ.» / «رُقَيّةُ مَسْرورةٌ.» / «أَذْهَبُ إلى المَدْرَسةِ.» / «السَّلامُ عَلَيْكُمْ.» / «أَنا أَكْتُبُ بِالقَلَمِ.» / «نَلْعَبُ لُعْبةَ الأَلْوانِ.» / «الفَتى النَّظيفُ مَحْبوبٌ.» / «حَمْزةُ يُنَظِّفُ أَسْنانَهُ.» / «فَرَحُ تُحِبُّ الحَمامةَ.» / «هذهِ قَرْيَتي.» / «الزُّوّارُ في كُمْزارَ.» / «هَطَلَ المَطَرُ على الشّاطِئِ.» / «أَحْمِلُ عُلْبةَ الغِذاءِ.» / «هذهِ وَجْبَتي المُفَضَّلةُ.» / «وَجْبةُ اليَوْمِ لَذيذةٌ.» / «شَجَرةُ المِشْمِشِ كَبيرةٌ.» / «مَوْعِدُنا على العَشاءِ.» / «ظافِرٌ طِفْلٌ مَحْظوظٌ.»، ويقرأ التلميذ الجمل قراءة سليمة (67 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. طابق الكلمة بالصورة: توزّع المعلمة بطاقات كلمات وصور على المجموعات (تقويم تكويني)، وتطابق المجموعة الكلمة بصورتها (67 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «اكتب جملة قصيرة فيها كلمة من دروس حروف (ب، ل، م، ر)» على السبورة، ويناقش المعلم الإجابات مع الصف (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن قراءة كلمات وجمل تضم حروف (د، س، ك، ن) مستعينًا بالصور، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. أسمع وأميّز: تنطق كلمات من دروس الحروف وتطلب رفع بطاقة الحرف المسموع، ويرفع التلميذ بطاقة الحرف الصحيح (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أين الحرف؟: تعرض كلمات: عُلْبةٌ، كِتابٌ، عِنَبٌ، نَحْلةٌ، دَجاجةٌ، مَسْجِدٌ، مِشْمِشٌ، قِطّةٌ، نَظّارةٌ وتطلب تحديد موقع الحرف (تقويم تكويني)، ويحدد التلميذ الموقع: أول/وسط/آخر (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n8. صندوق الحروف: تضع المعلمة بطاقات أشكال الحروف في صندوق وتسحب بطاقة، ويسمّي التلميذ الحرف ويذكر كلمة فيه (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أحلل: تعرض المعلمة جملة «عَبيرُ قُرْبَ البابِ.» وتحللها مع المتعلمين، ويحلل التلميذ الجملة إلى كلمات ومقاطع (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أركّب: توزّع المعلمة مقاطع لتركيب كلمات (تقويم تكويني)، ويركّب كلمات ويقرؤها (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n11. أرتب الجملة: توزّع كلمات جملة «مَوْعِدُنا على العَشاءِ.» مبعثرة، ويرتب التلميذ الكلمات ويقرأ الجملة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد المتعلمون الخلاصة ويدوّنون المطلوب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n13. غلق الدرس – نجوم الفصل: يقف التلاميذ في دائرة ويمررون «نجمة» ورقية في أثناء الإنشاد، ومن تتوقف عنده يقرأ كلمة من دروس الحروف ويقول جملة عن حبه لوطنه عمان، احتفالًا بختام الفصل الدراسي الأول (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اقرأ كلمة «بابٌ».\nالإجابة: قراءة صحيحة.\nس2 (مستوى التطبيق): اقرأ الجملة «وَجْبةُ اليَوْمِ لَذيذةٌ.».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): ركّب كلمة من مقطعين وأضفها إلى جملة.\nالإجابة: كلمة وجملة صحيحتان.\n\n• نشاط علاجي (لمن لم يتقن): يختار المعلم كلمة من كل محور (بابٌ، ديكٌ، حوتٌ، جملٌ) ويقرؤها مع التلميذ مقطعًا مقطعًا وهو يطابقها بصورتها، ثم يحدد التلميذ الحرف المدروس فيها؛ وللتحقق يقرأ «بابٌ» ويسمّي حرفها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقراءة جمل دروس الحروف مثل «رُقَيّةُ مَسْرورةٌ»، وتأليف جملة جديدة من كلمات فيها حروف المحاور الأربعة، ثم يحدد كل منهم الحروف المدروسة في جملته.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ هذا الحرف: ع\nالإجابة: العين.\nس2 (مستوى التطبيق): اقرأ كلمة «سَبّورةٌ».\nالإجابة: قراءة صحيحة.\nس3 (مستوى الاستدلال): اكتب جملة قصيرة فيها كلمة من دروس حروف (ء، ج، و).\nالإجابة: جملة صحيحة.", "للطالب: يراجع حروف (ب، ل، م، ر، د، س، ك، ن، ف، ت، ح، ق، ز، ط، ء، ج، و، ش، ع، ظ) قراءة وكتابة (دليل المعلم ص —).\nلولي الأمر: يراجع مع طفله الحروف ويملي عليه كلمتين.\nالمرجع: كتاب الطالب – الجزآن: صفحات المراجعة في المحاور الأربعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/arabic/?l=36"]}, {"k": "الإملاء", "p": ["الإملاء المنظور وأختبر تعلمي في حروف (ر، د، ز، و، ء، ل)"], "w": "الأسبوع السابع عشر", "f": ["1. يكتب كلمات إملاءً منظورًا كتابة صحيحة (10 دقائق)\n2. يحل أنشطة مراجعة المحور (10 دقائق)\n3. يقيّم تعلّمه في حروف المحور (10 دقائق)\nمخرج تعليمي آخر:\n- يعتز بإنجازه في الفصل الدراسي الأول (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تقييم\nالمخرج 3: تقييم\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. جهاز عرض البيانات\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. بطاقات الحروف والمقاطع", "1. حروف المحور: ر، د، ز، و، ء، ل\n2. المقطع\n3. الكلمة\n4. الجملة", "تعرض المعلمة بطاقات حروف (ر، د، ز، و، ء، ل) مقلوبة، ويقلب كل متعلم بطاقة ويسمّي حرفها ويذكر كلمة تبدأ به. (5 دقائق)", "1. إملاء منظور: تعرض كلمات ثم تخفيها وتمليها: قَمَرٌ، يَدٌ، مَوْزٌ، دَلْوٌ، ويكتب التلميذ الكلمات من الذاكرة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أختبر تعلمي: توجّه المعلمة حل أنشطة صفحات المراجعة (تقويم تكويني)، ويحل التل
