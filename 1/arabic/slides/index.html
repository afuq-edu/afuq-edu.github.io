<style>
/* Layout: one projector stage per slide — header with lesson-procedure rail, flexible body, control dock. Single bright "classroom notebook" look. */
:root{
  --sky:#e8f4ff; --paper:#ffffff; --ink:#1d2756; --ink2:#4a5486; --line:#cfe0f5;
  --sun:#ffc23d; --grass:#3fb54a; --leaf:#2e9a3a; --berry:#e23d55; --ocean:#2f8cf0; --grape:#8a5cf6; --orange:#ff8a2b;
  --ok:#2fae55; --bad:#e2483d;
  --f-ui:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;
  --f-read:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --axis:var(--sun);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-ui);direction:rtl;overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px, rgba(47,140,240,.13) 1.2px, transparent 0);background-size:26px 26px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--ocean);outline-offset:3px}
.hl{color:var(--berry)}
.read{font-family:var(--f-read);line-height:2.1}
.hidden{display:none!important}
.svgi{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.18em}.svgi svg{width:100%;height:100%}
[hidden]{display:none!important}

/* ---------- HOME ---------- */
#home{height:100%;overflow:auto;padding:clamp(16px,3vw,40px)}
.home-in{max-width:1180px;margin:0 auto;display:grid;gap:28px}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand .logo{width:clamp(64px,9vw,96px);aspect-ratio:1;border-radius:28px;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:clamp(38px,5vw,58px);font-weight:800;box-shadow:0 8px 0 #b52a40;transform:rotate(-6deg)}
.brand h1{margin:0;font-size:clamp(30px,4.4vw,54px);line-height:1.1}
.brand p{margin:4px 0 0;color:var(--ink2);font-size:clamp(15px,1.6vw,19px)}
.axis{display:grid;gap:14px}
.axis h2{margin:0;font-size:clamp(20px,2.3vw,28px);display:flex;align-items:center;gap:10px}
.axis h2 small{font-size:.65em;color:var(--ink2);font-weight:500}
.axis h2 .dot{width:16px;height:16px;border-radius:50%;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.lcard{border:0;background:var(--paper);border-radius:22px;padding:16px 16px 14px;text-align:right;display:grid;gap:6px;box-shadow:0 5px 0 var(--line);transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden}
.lcard:hover{transform:translateY(-4px);box-shadow:0 9px 0 var(--line)}
.lcard .big{display:flex;align-items:center;justify-content:space-between}
.lcard .ltr{font-size:58px;font-weight:800;line-height:1;color:var(--c)}
.lcard .pic{font-size:44px;line-height:1}
.lcard b{font-size:19px}
.lcard > span{color:var(--ink2);font-size:14px}
.lcard::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:var(--c)}
.tips{background:var(--paper);border-radius:20px;padding:16px 20px;color:var(--ink2);font-size:15px;line-height:1.9}
.tips kbd{background:var(--sky);border-radius:6px;padding:0 7px;font-family:var(--f-ui);color:var(--ink)}

/* ---------- DECK ---------- */
#deck{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2vw,24px);background:var(--paper);box-shadow:0 3px 0 var(--line);min-width:0}
.top .lt{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.top .lt .badge{width:46px;height:46px;border-radius:14px;background:var(--axis);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--ink);flex:none}
.top .lt b{font-size:clamp(15px,1.5vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap;min-width:0}
.rail button{border:0;border-radius:99px;padding:4px 12px;font-size:clamp(11px,1.05vw,15px);background:var(--sky);color:var(--ink2);font-weight:700;white-space:nowrap}
.rail button.on{background:var(--pc);color:#fff}
.rail button.done{background:color-mix(in srgb,var(--pc) 22%,#fff);color:var(--ink)}
.count{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700;white-space:nowrap}
.stage{position:relative;overflow:hidden;padding:clamp(10px,1.6vw,22px) clamp(16px,2.4vw,34px)}
.slide{height:100%;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px);animation:sin .35s ease}
@keyframes sin{from{opacity:.0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{background:var(--pc);color:#fff;border-radius:12px;padding:3px 14px;font-weight:800;font-size:clamp(15px,2.3vh,23px)}
.shead h2{margin:0;font-size:clamp(24px,4.6vh,48px);line-height:1.25;text-wrap:balance}
.sbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:safe center;gap:clamp(10px,2vh,22px);padding:4px}
.dock{display:flex;align-items:center;gap:8px;padding:8px clamp(12px,2vw,24px) calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);box-shadow:0 -3px 0 var(--line);flex-wrap:wrap}
.dock .sp{flex:1}
.btn{border:0;border-radius:14px;padding:9px 16px;background:var(--sky);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#d6eafe}
.btn.pri{background:var(--ocean);color:#fff;box-shadow:0 4px 0 #1e64b5}
.btn.pri:active{transform:translateY(3px);box-shadow:0 1px 0 #1e64b5}
.btn.big{font-size:clamp(18px,2vw,24px);padding:12px 26px;border-radius:18px}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #d89c12}
.btn.green{background:var(--grass);color:#fff;box-shadow:0 4px 0 var(--leaf)}
.btn svg{width:20px;height:20px}
.progress{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:100%}
.progress i{display:block;height:100%;background:var(--pc,var(--ocean));transition:width .3s}

/* notes drawer */
#notes{position:fixed;inset:auto 16px 78px 16px;max-width:760px;margin-inline:auto;background:#fffbe9;border:3px solid var(--sun);border-radius:20px;padding:14px 20px;font-size:17px;line-height:1.9;box-shadow:0 12px 30px rgba(29,39,86,.18);z-index:30;max-height:46vh;overflow:auto}
#notes h4{margin:0 0 4px;font-size:18px}
#notes ol,#notes ul{margin:0;padding-inline-start:22px}
/* overview */
#overview{position:fixed;inset:0;background:rgba(29,39,86,.55);z-index:40;display:grid;place-items:center;padding:16px}
#overview .ov{background:var(--paper);border-radius:24px;max-width:1100px;width:100%;max-height:88vh;overflow:auto;padding:20px}
#overview .ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
#overview button{border:0;border-radius:14px;padding:10px;text-align:right;background:var(--sky);display:grid;gap:3px;border-inline-start:6px solid var(--pc)}
#overview button.cur{outline:3px solid var(--ocean)}
#overview button small{color:var(--ink2)}
/* scoreboard */
#score{position:fixed;top:76px;left:16px;z-index:25;background:var(--paper);border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(29,39,86,.15);display:grid;gap:8px;min-width:200px}
.team{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.team .n{font-size:30px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.team button{border:0;border-radius:10px;width:34px;height:34px;font-size:20px;background:var(--sky)}
.team.t1 .n{color:var(--berry)} .team.t2 .n{color:var(--ocean)}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;z-index:60;font-size:16px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- SLIDE COMPONENTS ---------- */
.center{display:grid;place-items:center;text-align:center}
.row{display:flex;gap:clamp(10px,1.6vw,22px);flex-wrap:wrap;justify-content:center;align-items:stretch}
.card{background:var(--paper);border-radius:24px;padding:clamp(12px,1.6vw,22px);box-shadow:0 6px 0 var(--line)}
.pic{font-size:clamp(60px,12vh,130px);line-height:1.1}
.pic svg{width:1.1em;height:1.1em;vertical-align:middle}
.q{font-size:clamp(24px,4.2vh,44px);font-weight:700;text-align:center;text-wrap:balance}
.q.read{font-weight:700}
.muted{color:var(--ink2)}
.say{border:0;background:var(--sun);border-radius:50%;width:48px;height:48px;display:inline-grid;place-items:center;box-shadow:0 4px 0 #d89c12;flex:none}
.say svg{width:24px;height:24px}
.say.sm{width:38px;height:38px}
.say.sm svg{width:19px;height:19px}

/* cover */
.cover{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px}
.cover .ttl{display:grid;gap:10px}
.cover .ttl .eb{font-size:clamp(16px,1.8vw,22px);color:var(--ink2);font-weight:700}
.cover .ttl h1{margin:0;font-size:clamp(40px,7vw,92px);line-height:1.05}
.cover .ttl p{margin:0;font-size:clamp(17px,2vw,24px);color:var(--ink2)}
.cover .art{position:relative;display:grid;place-items:center}
.cover .art .L{font-size:clamp(140px,30vh,300px);font-weight:800;color:var(--berry);line-height:1;text-shadow:0 10px 0 rgba(226,61,85,.15)}
.cover .art .m{position:absolute;bottom:4%;left:8%;font-size:clamp(60px,12vh,120px);animation:bob 2.4s ease-in-out infinite}
.cover .art .m svg{width:1em;height:1em}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
.flow{display:flex;gap:8px;flex-wrap:wrap}
.flow span{background:var(--paper);border-radius:12px;padding:4px 12px;font-weight:700;border-bottom:4px solid var(--pc)}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:20px;padding:14px 16px;font-size:clamp(18px,3.1vh,30px);line-height:1.6;box-shadow:0 5px 0 var(--line)}
.goal i{font-style:normal;flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sky);font-size:24px}

/* mystery boxes */
.boxes{display:flex;gap:clamp(10px,2vw,26px);justify-content:center;flex-wrap:wrap}
.box{width:clamp(130px,23vh,240px);aspect-ratio:1;border:0;border-radius:24px;background:var(--grape);color:#fff;font-size:clamp(48px,7vw,80px);font-weight:800;box-shadow:0 8px 0 #6439c9;display:grid;place-items:center;position:relative;transition:transform .2s}
.box:hover{transform:rotate(-3deg) scale(1.03)}
.box.open{background:var(--paper);color:var(--ink);box-shadow:0 8px 0 var(--line);animation:pop .4s}
.box.open .w{font-size:clamp(18px,2vw,26px);font-family:var(--f-read);font-weight:700}
.box .in{display:grid;gap:2px;place-items:center}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.reveal{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.answer{font-size:clamp(26px,4vw,48px);font-weight:800;background:var(--sun);border-radius:20px;padding:8px 26px;animation:pop .4s}

/* letter */
.letterwrap{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,40px);align-items:center}
.bigL{width:clamp(220px,46vh,460px);aspect-ratio:1;background:var(--paper);border-radius:36px;box-shadow:0 8px 0 var(--line);display:grid;place-items:center;position:relative}
.bigL svg{width:100%;height:100%}
.bigL text{font-family:var(--f-ui);font-weight:800}
.draw{fill:transparent;stroke:var(--berry);stroke-width:3;stroke-dasharray:1400;stroke-dashoffset:1400;animation:drawL 2.6s ease forwards}
.fillL{fill:var(--berry);opacity:0;animation:fillL .6s 2.3s forwards}
@keyframes drawL{to{stroke-dashoffset:0}}
@keyframes fillL{to{opacity:1}}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.form{border:0;background:var(--paper);border-radius:20px;padding:10px;display:grid;gap:4px;place-items:center;box-shadow:0 5px 0 var(--line)}
.form b{font-size:clamp(56px,11vh,120px);line-height:1.2;color:var(--berry)}
.form span{font-size:15px;color:var(--ink2);font-weight:700}
.lname{display:flex;align-items:center;gap:14px;font-size:clamp(28px,4vw,52px);font-weight:800}

/* word cards */
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:clamp(10px,1.6vw,20px)}
.wcard{border:0;background:var(--paper);border-radius:26px;padding:14px;display:grid;gap:6px;place-items:center;box-shadow:0 6px 0 var(--line);min-height:clamp(170px,36vh,340px);transition:transform .2s}
.wcard:hover{transform:translateY(-3px)}
.wcard .w{font-family:var(--f-read);font-size:clamp(34px,7vh,72px);font-weight:700;line-height:1.6}
.wcard .w.cov{color:transparent;background:var(--sky);border-radius:14px;min-width:70%;position:relative}
.wcard .w.cov .hl{color:transparent}
.wcard .w.cov::after{content:"؟";position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-family:var(--f-ui)}
.wcard .pos{font-size:14px;color:var(--ink2);font-weight:700}

/* harakat */
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.5vw,18px)}
.hk{border:0;border-radius:24px;padding:10px;background:var(--paper);box-shadow:0 6px 0 var(--line);display:grid;place-items:center;gap:2px}
.hk b{font-family:var(--f-read);font-size:clamp(60px,12.5vh,136px);line-height:1.5;color:var(--ink)}
.hk span{font-size:15px;color:var(--ink2);font-weight:700}
.hk.long{background:#fff6dc}
.hk.zoom{animation:pop .4s}

/* syllables & sentences */
.sylgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.syl{border:0;background:var(--paper);border-radius:18px;padding:4px 24px;font-family:var(--f-read);font-size:clamp(36px,7.4vh,76px);font-weight:700;box-shadow:0 5px 0 var(--line);line-height:1.7;min-width:90px}
.syl.lit{background:var(--sun);box-shadow:0 5px 0 #d89c12;animation:pop .4s}
.sent{font-family:var(--f-read);font-size:clamp(36px,8vh,82px);font-weight:700;text-align:center;line-height:2;background:var(--paper);border-radius:26px;padding:10px 26px;box-shadow:0 6px 0 var(--line)}
.wordsplit{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.wpart{border:0;background:var(--paper);border-radius:18px;padding:2px 18px;font-family:var(--f-read);font-size:clamp(30px,6.6vh,66px);font-weight:700;box-shadow:0 5px 0 var(--line);line-height:1.8;animation:pop .35s both}
.wpart.l{background:#ffe7ea}
.arrow{font-size:28px;color:var(--ink2);text-align:center}

/* story */
.story{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(12px,2vw,26px);align-items:start;min-height:0}
.paras{display:grid;gap:10px}
.para{border:0;text-align:right;background:var(--paper);border-radius:20px;padding:10px 18px;font-family:var(--f-read);font-size:clamp(22px,4vh,40px);line-height:2;font-weight:500;box-shadow:0 4px 0 var(--line);opacity:.35;transition:opacity .3s,background .3s}
.para.on{opacity:1}
.para.cur{background:#fff6dc}
.scene{background:var(--paper);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line);display:grid;gap:10px;place-items:center;text-align:center}
.scene .pic{font-size:clamp(56px,12vh,120px);letter-spacing:6px}
.scene p{margin:0;color:var(--ink2);font-size:16px}

/* talk */
.talk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:center}
.qlist{display:grid;gap:10px}
.qitem{border:0;text-align:right;background:var(--paper);border-radius:18px;padding:10px 16px;font-size:clamp(20px,3.6vh,36px);font-weight:700;box-shadow:0 4px 0 var(--line);display:flex;gap:10px;align-items:center}
.qitem i{font-style:normal;width:34px;height:34px;flex:none;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-size:18px}
.qitem .hint{display:block;font-weight:500;color:var(--leaf);font-size:.85em}

/* mcq */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:clamp(10px,1.4vw,18px)}
.opt{border:0;background:var(--paper);border-radius:22px;padding:12px;font-size:clamp(26px,4.8vh,50px);font-weight:700;box-shadow:0 6px 0 var(--line);display:grid;gap:4px;place-items:center;min-height:clamp(100px,20vh,220px);transition:transform .15s}
.opt .read{font-weight:700}
.opt:hover{transform:translateY(-3px)}
.opt.ok{background:#dcf7e3;box-shadow:0 6px 0 var(--ok)}
.opt.no{background:#ffe1df;box-shadow:0 6px 0 var(--bad);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.qnav{display:flex;align-items:center;justify-content:center;gap:12px}
.qdots{display:flex;gap:6px}
.qdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.qdots i.on{background:var(--pc)}
.qdots i.ok{background:var(--ok)}
.qpic{font-size:clamp(70px,15vh,150px);text-align:center;line-height:1.1}
.qpic svg{width:1em;height:1em}
.explain{text-align:center;font-size:clamp(20px,3.2vh,30px);color:var(--leaf);font-weight:700;min-height:1.6em}

/* sort */
.sortwrap{display:grid;gap:14px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px}
.chip{border:0;background:var(--paper);border-radius:16px;padding:6px 16px;font-family:var(--f-read);font-size:clamp(24px,4.6vh,46px);font-weight:700;box-shadow:0 5px 0 var(--line);display:inline-flex;align-items:center;gap:6px;line-height:1.7;touch-action:none}
.chip .e{font-size:1.1em;font-family:var(--f-ui)}
.chip.sel{outline:4px solid var(--ocean);transform:translateY(-3px)}
.chip.ok{background:#dcf7e3}
.chip.no{animation:shake .4s;background:#ffe1df}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.bucket{border:3px dashed var(--line);border-radius:22px;padding:10px;min-height:clamp(120px,22vh,220px);background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:8px;align-items:center}
.bucket h3{margin:0;background:var(--pc);color:#fff;border-radius:12px;padding:2px 14px;font-size:clamp(17px,2vw,24px)}
.bucket.hot{border-color:var(--ocean);background:#eef6ff}
.bucket .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,6vw,90px);align-items:center}
.mcol{display:grid;gap:10px}
.mi{border:0;background:var(--paper);border-radius:18px;padding:8px 14px;font-size:clamp(24px,4.6vh,46px);font-weight:700;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:10px;min-height:clamp(70px,11vh,110px)}
.mi.read{font-weight:700}
.mi.sel{outline:4px solid var(--ocean)}
.mi.done{opacity:.95;color:#fff}

/* build */
.build{display:grid;gap:12px;justify-items:center}
.slots{display:flex;gap:8px;direction:rtl}
.slot{min-width:clamp(80px,14vh,140px);height:clamp(80px,14vh,140px);border-radius:18px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--f-read);font-size:clamp(30px,5vh,52px);font-weight:700;background:rgba(255,255,255,.6)}
.slot.f{border-style:solid;border-color:var(--ok);background:#dcf7e3}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{border:0;background:var(--sun);border-radius:18px;padding:4px 24px;font-family:var(--f-read);font-size:clamp(34px,7vh,72px);font-weight:700;box-shadow:0 5px 0 #d89c12;line-height:1.6}
.tile.used{visibility:hidden}
.result{font-family:var(--f-read);font-size:clamp(34px,6vh,64px);font-weight:700;color:var(--leaf);min-height:1.5em;text-align:center}

/* trace */
.trace{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:stretch;min-height:0;flex:1}
.board{position:relative;background:var(--paper);border-radius:26px;box-shadow:0 6px 0 var(--line);overflow:hidden;min-height:clamp(240px,48vh,560px)}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;max-width:300px}
.tools .sw{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tools .sw.on{box-shadow:0 0 0 4px var(--ink)}
.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.models button{border:0;background:var(--paper);border-radius:14px;padding:4px 12px;font-family:var(--f-read);font-size:28px;font-weight:700;box-shadow:0 4px 0 var(--line);line-height:1.6}
.models button.on{background:var(--sun);box-shadow:0 4px 0 #d89c12}

/* balloon game */
.arena{position:relative;flex:1;min-height:clamp(260px,52vh,600px);border-radius:26px;overflow:hidden;background:linear-gradient(#bfe3ff,#eaf6ff 70%,#d7f2c8 70%)}
.balloon{position:absolute;bottom:-160px;width:clamp(96px,11vw,140px);height:clamp(118px,13.5vw,170px);border:0;background:none;padding:0}
.balloon .b{position:absolute;inset:0 0 22% 0;border-radius:50% 50% 46% 46%;background:var(--bc);display:grid;place-items:center;color:#fff;font-family:var(--f-read);font-size:clamp(22px,2.6vw,34px);font-weight:700;box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);line-height:1.5;padding:4px}
.balloon .s{position:absolute;bottom:0;left:50%;width:2px;height:24%;background:#8a93b8}
.balloon.boom{animation:boom .3s forwards}
@keyframes boom{to{transform:scale(1.6);opacity:0}}
.hud{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:22px;font-weight:800}
.hud .pill{background:var(--paper);border-radius:99px;padding:4px 16px;box-shadow:0 4px 0 var(--line);font-variant-numeric:tabular-nums}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(232,244,255,.82);text-align:center;z-index:2}
.overlay .card{display:grid;gap:12px;justify-items:center;max-width:90%}

/* memory */
.mem{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:clamp(8px,1.2vw,14px);max-width:960px;margin:0 auto;width:100%}
.mc{border:0;aspect-ratio:1.35;border-radius:20px;background:var(--ocean);box-shadow:0 5px 0 #1e64b5;color:#fff;font-size:clamp(34px,5vh,58px);font-weight:800;display:grid;place-items:center;padding:4px}
.mc.up{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line);animation:pop .3s}
.mc.ok{background:#dcf7e3;box-shadow:0 5px 0 var(--ok)}
.mc .read{font-size:.75em;line-height:1.5}

/* race */
.race{display:grid;gap:12px}
.track{display:grid;gap:8px}
.lane{position:relative;height:clamp(54px,8vh,74px);border-radius:16px;background:repeating-linear-gradient(90deg,#fff 0 40px,#f1f6fd 40px 80px);box-shadow:0 4px 0 var(--line);overflow:hidden}
.lane .car{position:absolute;top:50%;transform:translate(50%,-50%);font-size:clamp(34px,5.6vh,52px);line-height:0;transition:right .6s cubic-bezier(.3,1.4,.6,1)}
.lane .flag{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:34px}
.lane b{position:absolute;right:10px;top:4px;font-size:14px;color:var(--ink2)}
.turn{font-size:22px;font-weight:800;text-align:center}
.turn span{padding:2px 14px;border-radius:12px;color:#fff}

/* wheel */
.wheelwrap{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.wheel{width:clamp(240px,46vh,440px);aspect-ratio:1;position:relative}
.wheel canvas{width:100%;height:100%}
.wheel .pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink)}
.wout{display:grid;gap:14px;justify-items:center;text-align:center}
.wout .res{font-family:var(--f-read);font-size:clamp(60px,12vh,130px);font-weight:700;line-height:1.5;min-height:1.5em}

/* song */
.song{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px clamp(16px,4vw,60px);max-width:1000px;margin:0 auto;width:100%}
.verse{border:0;background:var(--paper);border-radius:16px;padding:4px 16px;font-family:var(--f-read);font-size:clamp(26px,5.4vh,56px);font-weight:700;line-height:2;box-shadow:0 4px 0 var(--line);opacity:.4;transition:all .3s;text-align:center}
.verse.on{opacity:1}
.verse.cur{background:var(--sun);box-shadow:0 4px 0 #d89c12;transform:scale(1.03)}
.song.many .verse{font-size:clamp(20px,3.7vh,40px);line-height:1.75;padding:2px 14px}
.match.many .mi{min-height:clamp(52px,8vh,80px);font-size:clamp(22px,3.8vh,38px);padding:4px 12px}
.match.many .mcol{gap:7px}
.author{text-align:center;color:var(--ink2);font-size:16px}

/* self assess */
.assess{display:grid;gap:10px;max-width:880px;margin:0 auto;width:100%}
.arow{display:grid;grid-template-columns:150px repeat(3,1fr);gap:10px;align-items:center}
.arow b{background:var(--pc);color:#fff;border-radius:14px;padding:8px;text-align:center;font-size:20px}
.face{border:0;background:var(--paper);border-radius:16px;font-size:clamp(34px,5vh,50px);padding:4px;box-shadow:0 4px 0 var(--line);filter:grayscale(1);opacity:.6}
.face.on{filter:none;opacity:1;background:#fff6dc;transform:scale(1.06)}

/* summary */
.learned{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.learned div{background:var(--paper);border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 var(--line);display:grid;gap:4px}
.learned b{font-size:16px;color:var(--ink2)}
.learned span{font-family:var(--f-read);font-size:clamp(26px,5vh,50px);font-weight:700;line-height:1.8}
.hw{background:#fff6dc;border-radius:20px;padding:12px 18px;font-size:clamp(17px,2vw,22px);line-height:1.8;border:3px dashed var(--sun)}

/* lines (writing paper) */
.lines{background:repeating-linear-gradient(transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%)}

@media (max-width:820px){
  .cover,.letterwrap,.story,.talk,.wheelwrap,.trace{grid-template-columns:1fr}

  .arow{grid-template-columns:90px repeat(3,1fr)}
  .rail{display:none}
  body{overflow-y:auto;overflow-x:hidden}
  #deck{height:auto;min-height:100%}

}

/* ---------- deck ---------- */
function openLesson(id,i){
  L=LESSONS.find(l=>l.id===id); if(!L) return renderHome();
  $('#home').hidden=true; $('#deck').hidden=false;
  const ac=AX[L.axis].c; document.documentElement.style.setProperty('--axis',ac);
  $('#lt').innerHTML=`<span class="badge">${esc(L.letter||'★')}</span><b>${esc(L.title)}</b>`;
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  go(i||0);
}
function phasesOf(l){ const seen=[]; l.slides.forEach(s=>{ if(!seen.includes(s.ph)) seen.push(s.ph); }); return seen; }
function go(i){
  if(!L) return;
  idx=Math.max(0,Math.min(L.slides.length-1,i));
  cleanups.forEach(f=>{try{f()}catch(e){}}); cleanups=[];
  try{ speechSynthesis.cancel(); }catch(e){}
  const s=L.slides[idx], ph=PH[s.ph]||PH.taarf;
  document.documentElement.style.setProperty('--pc',ph.c);
  // rail
  const phs=phasesOf(L), cur=phs.indexOf(s.ph);
  $('#rail').innerHTML=phs.map((p,k)=>`<button style="--pc:${PH[p].c}" class="${k===cur?'on':k<cur?'done':''}" data-p="${p}">${PH[p].n}</button>`).join('');
  $('#rail').querySelectorAll('button').forEach(b=>b.onclick=()=>go(L.slides.findIndex(x=>x.ph===b.dataset.p)));
  $('#count').textContent=`${toAr(idx+1)} / ${toAr(L.slides.length)}`;
  $('#bar').style.width=((idx+1)/L.slides.length*100)+'%';
  // slide
  const st=$('#stage'); st.innerHTML='';
  const wrap=h('div',{class:'slide'});
  if(s.t!=='cover'){
    const hd=h('div',{class:'shead'}, `<span class="tag">${esc(s.tag||ph.n)}</span><h2>${s.titleHtml||esc(s.title||'')}</h2>`);
    wrap.appendChild(hd);
  }
  const body=h('div',{class:'sbody'});
  wrap.appendChild(body); st.appendChild(wrap);
  try{ (R[s.t]||R.info)(s,body,wrap); }catch(e){ body.innerHTML='<p class="q">تعذّر عرض هذه الشريحة</p>'; console.error(e); }
  // notes
  const n=$('#notes');
  n.innerHTML=`<h4>👩‍🏫 إجراءات المعلّم — ${esc(ph.n)}</h4>`+notesHtml(s);
  $('#prev').disabled=idx===0; $('#next').disabled=idx===L.slides.length-1;
}
function notesHtml(s){
  const arr=Array.isArray(s.notes)?s.notes:(s.notes?[s.notes]:[]);
  if(!arr.length) return '<p>اعرض الشريحة وناقش الطّلاب.</p>';
  return '<ol>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>';
}

/* multiple choice (single or series) */
R.mcq = (s,b)=>{
  const qs=s.qs||[s];

  if(qs.length>1){ nav.append(pv,dots,nx); }
  function draw(){
    const q=qs[k]; holder.innerHTML='';
    const top=h('div',{class:'center',style:'gap:8px'});
    if(q.pic) top.appendChild(h('div',{class:'qpic'},pic(q.pic)));

    top.appendChild(qq);

      const o=q.o[i]; const isArr=Array.isArray(o);
      const e=h('button',{class:'opt'}, isArr?`<div class="pic" style="font-size:clamp(56px,11vh,120px)">${pic(o[0])}</div>${o[1]?`<div class="read">${hl(o[1],q.ohl||'')}</div>`:''}`:`<div class="${q.plain?'':'read'}">${hl(o,q.ohl||'')}</div>`);
      e.onclick=()=>{ if(i===q.a){ e.classList.add('ok'); done[k]=true; dotsDraw(); good(); ex.textContent=q.ex||'أحسنت! 🌟'; } else { e.classList.remove('no'); void e.offsetWidth; e.classList.add('no'); sfx.no(); ex.textContent='حاول مرّة أخرى 💪'; } };
      opts.appendChild(e);

/* sort into buckets (tap item, tap bucket; or drag) */
R.sort = (s,b)=>{
  const wrap=h('div',{class:'sortwrap'});

  const pool=h('div',{class:'pool'});
  const bk=h('div',{class:'buckets'});
  let sel=null, left=s.items.length;
  const bEls=s.buckets.map((name,k)=>{ const e=h('div',{class:'bucket'},`<h3>${esc(name)}</h3><div class="got"></div>`); e.onclick=()=>drop(k); bk.appendChild(e); return e; });
  shuffle(s.items).forEach(it=>{
    const c=h('button',{class:'chip'},`${it.e?`<span class="e">${pic(it.e)}</span>`:''}<span>${hl(it.t,s.hl||'')}</span>`);
    c._b=it.b; c._t=it.t;
    c.onclick=e=>{ e.stopPropagation(); if(c.parentNode!==pool) return; pool.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); sel=c; c.classList.add('sel'); bEls.forEach(x=>x.classList.add('hot')); if(s.say!==false) say(it.t); };
    pool.appendChild(c);
  });
  function drop(k){
    if(!sel) return; const c=sel;
    bEls.forEach(x=>x.classList.remove('hot'));
    if(c._b===k){ c.classList.remove('sel'); c.classList.add('ok'); bEls[k].querySelector('.got').appendChild(c); sel=null; sfx.ok(); if(--left===0){ good(120); } }
    else { c.classList.remove('no'); void c.offsetWidth; c.classList.add('no'); sfx.no(); }
  }
  wrap.append(pool,bk); b.appendChild(wrap);
};

/* match pairs: tap left then right */
R.match = (s,b)=>{
  if(s.q) b.appendChild(h('div',{class:'q'},esc(s.q)));
  const m=h('div',{class:'match'+(s.pairs.length>4?' many':'')});
  const A=h('div',{class:'mcol'}), B=h('div',{class:'mcol'});
  const cols=['#e23d55','#2f8cf0','#3fb54a','#8a5cf6','#ff8a2b','#00a6a6'];
  let sel=null, n=0;
  const mk=(v,k,side)=>{ const isPic=typeof v==='string'&&(/^\p{Extended_Pictographic}/u.test(v)||v[0]==='@'); const e=h('button',{class:'mi'+(isPic?'':' read')},isPic?`<span class="pic" style="font-size:clamp(40px,8vh,72px)">${pic(v)}</span>`:`<span>${hl(v,s.hl||'')}</span>`); e._k=k; e._s=side; e.onclick=()=>tap(e); return e; };
  shuffle(s.pairs.map((p,k)=>[p[0],k])).forEach(([v,k])=>A.appendChild(mk(v,k,0)));
  shuffle(s.pairs.map((p,k)=>[p[1],k])).forEach(([v,k])=>B.appendChild(mk(v,k,1)));
  function tap(e){
    if(e.classList.contains('done')) return;
    if(!sel||sel._s===e._s){ m.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); sel=e; e.classList.add('sel'); return; }
    if(sel._k===e._k){ const c=cols[n%cols.length]; [sel,e].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.style.background=c;x.style.boxShadow='none';}); n++; sel=null; if(n===s.pairs.length) good(120); else sfx.ok(); }
    else { sfx.no(); e.style.animation='shake .4s'; setTimeout(()=>e.style.animation='',420); sel.classList.remove('sel'); sel=null; }
  }
  m.append(A,B); b.appendChild(m);
};

/* writing board */
R.trace = (s,b)=>{
  b.style.justifyContent='stretch';
  const wrap=h('div',{class:'trace'});
  const board=h('div',{class:'board'});
  const cv=h('canvas'); board.appendChild(cv);
  const side=h('div',{class:'tools'});
  const models=h('div',{class:'models'});
  let model=s.items[0], color='#1d2756';
  const PN={'#slant':'╱ مائل','#corner':'└ زاوية','#zigzag':'⋁⋁ متعرّج','#bowl':'◡ قوس','#hook':'⌐ خطّاف','#waves':'∿ موج'};
  s.items.forEach((m,k)=>{ const e=h('button',{class:k?'':'on',style:(m[0]==='#'?'font-family:var(--f-ui);font-size:20px;':'')+(m.length>7?'grid-column:1/-1;font-size:22px':'')},esc(PN[m]||m)); e.onclick=()=>{ models.querySelectorAll('button').forEach(x=>x.classList.remove('on')); e.classList.add('on'); model=m; clear(); }; models.appendChild(e); });
  const sws=['#1d2756','#e23d55','#2f8cf0','#2e9a3a'].map((c,k)=>{ const e=h('button',{class:'sw'+(k?'':' on'),style:`background:${c}`,'aria-label':'لون'}); e.onclick=()=>{ side.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); e.classList.add('on'); color=c; }; return e; });
  const clr=h('button',{class:'btn'},'🧽 امسح');
  clr.onclick=()=>clear();
  const swRow=h('div',{style:'display:flex;gap:6px;flex-wrap:wrap'}); sws.forEach(x=>swRow.appendChild(x));
  side.append(models,swRow,clr);
  wrap.append(board,side);
  if(s.q) b.appendChild(h('div',{class:'q',style:'font-size:clamp(18px,2.4vh,26px)'},esc(s.q)));
  b.appendChild(wrap);
  const ctx=cv.getContext('2d'); let dpr=1, W=0, H=0;
  function size(){ const r=board.getBoundingClientRect(); dpr=devicePixelRatio||1; W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); clear(); }
  function guide(){
    ctx.save();
    // 4-line writing guide like the textbook
    ctx.strokeStyle='#cfe0f5'; ctx.lineWidth=2;
    const top=H*.18, gap=H*.2; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(14,top+gap*i); ctx.lineTo(W-14,top+gap*i); ctx.stroke(); }
    ctx.strokeStyle='#e23d55'; ctx.globalAlpha=.25; ctx.beginPath(); ctx.moveTo(14,top+gap*2); ctx.lineTo(W-14,top+gap*2); ctx.stroke();
    ctx.globalAlpha=1;
    if(model[0]==='#'){ drawPattern(model); ctx.restore(); return; }
    const fs=Math.min(H*.62, W/(Math.max(1,model.length)*.62));
    ctx.font=`700 ${fs}px "Noto Naskh Arabic", serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.direction='rtl';
    ctx.fillStyle='#eef2f9'; ctx.fillText(model,W/2,top+gap*2+fs*.02);
    ctx.setLineDash([6,8]); ctx.lineWidth=2.5; ctx.strokeStyle='#9fb0d6'; ctx.strokeText(model,W/2,top+gap*2+fs*.02);
    ctx.restore();
  }
  function drawPattern(m){
    ctx.setLineDash([4,12]); ctx.lineWidth=6; ctx.lineCap='round'; ctx.strokeStyle='#9fb0d6';
    const y0=H*.25, y1=H*.75, n=6, step=(W-80)/n;
    ctx.beginPath();
    for(let i=0;i<n;i++){ const x=W-40-i*step;
      if(m==='#slant'){ ctx.moveTo(x,y0); ctx.lineTo(x-step*.6,y1); }
      if(m==='#corner'){ ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.lineTo(x-step*.7,y1); }
      if(m==='#zigzag'){ if(i===0) ctx.moveTo(x,y0); ctx.lineTo(x-step/2,y1); ctx.lineTo(x-step,y0); }
      if(m==='#bowl'){ ctx.moveTo(x,y0); ctx.quadraticCurveTo(x-step*.45,y1+H*.18,x-step*.9,y0); }
      if(m==='#hook'){ ctx.moveTo(x,y0); ctx.quadraticCurveTo(x+4,y1,x-step*.7,y1-H*.02); }
      if(m==='#waves'){ if(i===0) ctx.moveTo(x,(y0+y1)/2); ctx.quadraticCurveTo(x-step/4,y0,x-step/2,(y0+y1)/2); ctx.quadraticCurveTo(x-step*.75,y1,x-step,(y0+y1)/2); }
    }
    ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle='#e23d55';
    for(let i=0;i<n;i++){ const x=W-40-i*step; if(m==='#zigzag'||m==='#waves'){ if(i===0){ctx.beginPath();ctx.arc(x,m==='#waves'?(y0+y1)/2:y0,9,0,7);ctx.fill();} } else { ctx.beginPath(); ctx.arc(x,y0,9,0,7); ctx.fill(); } }
  }
  function clear(){ ctx.clearRect(0,0,W,H); guide(); }
  let drawing=false, last=null;
  cv.addEventListener('pointerdown',e=>{ drawing=true; cv.setPointerCapture(e.pointerId); const r=cv.getBoundingClientRect(); last=[e.clientX-r.left,e.clientY-r.top]; });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const r=cv.getBoundingClientRect(); const p=[e.clientX-r.left,e.clientY-r.top]; ctx.strokeStyle=color; ctx.lineWidth=Math.max(8,H/40); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last=p; });
  const end=()=>drawing=false; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  const ro=new ResizeObserver(()=>size()); ro.observe(board); onCleanup(()=>ro.disconnect());
  if(document.fonts) document.fonts.ready.then(()=>clear());
};

/* balloon pop game */
R.balloons = (s,b)=>{
  b.style.justifyContent='stretch';
  const hud=h('div',{class:'hud'});
  const sc=h('span',{class:'pill'},'⭐ 0'), tm=h('span',{class:'pill'},'⏱️ '+(s.time||60));
  hud.append(h('span',{},esc(s.q)),sc,tm);
  const ar=h('div',{class:'arena'});
  const ov=h('div',{class:'overlay'},`<div class="card"><div class="q">${esc(s.q)}</div><div class="muted" style="font-size:18px">${esc(s.rule||'')}</div></div>`);
  const st=h('button',{class:'btn big green'},'▶ ابدأ اللّعبة'); ov.firstChild.appendChild(st);
  ar.appendChild(ov);
  b.append(hud,ar);
  const cols=['#e23d55','#2f8cf0','#3fb54a','#8a5cf6','#ff8a2b','#00a6a6','#d89c12'];
  let points=0, time=s.time||60, timers=[], raf=0, live=[];
  onCleanup(()=>{ timers.forEach(clearInterval); cancelAnimationFrame(raf); });
  st.onclick=()=>{
    ov.hidden=true; points=0; time=s.time||60; sc.textContent='⭐ 0';
    timers.push(setInterval(spawn,1100));
    timers.push(setInterval(()=>{ tm.textContent='⏱️ '+(--time); if(time<=0) finish(); },1000));
    let lastT=performance.now();
    const loop=t=>{ const dt=(t-lastT)/1000; lastT=t; const H=ar.clientHeight; live=live.filter(o=>{ o.y+=o.v*dt; o.el.style.transform=`translateY(${-o.y}px)`; if(o.y>H+200){ o.el.remove(); return false;} return true; }); raf=requestAnimationFrame(loop); };
    raf=requestAnimationFrame(loop);
    spawn();
  };
  function spawn(){
    const isGood=Math.random()<.55; const pool=isGood?s.good:s.bad; const w=pool[Math.random()*pool.length|0];
    const el=h('button',{class:'balloon',style:`left:${4+Math.random()*80}%;--bc:${cols[Math.random()*cols.length|0]}`},`<div class="b">${esc(w)}</div><div class="s"></div>`);
    const o={el,y:0,v:60+Math.random()*50};

    ar.appendChild(el); live.push(o);
  }
  function finish(){ timers.forEach(clearInterval); timers=[]; cancelAnimationFrame(raf); live.forEach(o=>o.el.remove()); live=[]; ov.hidden=false; ov.firstChild.innerHTML=`<div class="q">انتهى الوقت! 🎉</div><div class="answer">⭐ ${points} نقطة</div>`; ov.firstChild.appendChild(st); st.textContent='↻ العب مرّة أخرى'; sfx.win(); confetti(140); }
};

    tn.innerHTML=`الدّور على: <span style="background:${turn?'#2f8cf0':'#e23d55'}">${names[turn]}</span> · سؤال ${k+1} من ${qs.length}`;

/* spinning wheel */
R.wheel = (s,b)=>{
  const wrap=h('div',{class:'wheelwrap'});
  const wh=h('div',{class:'wheel'}); const cv=h('canvas',{width:600,height:600}); wh.append(cv,h('div',{class:'pin'}));

  const sp=h('button',{class:'btn big green'},'🎡 أدِر العجلة'); out.appendChild(sp);
  wrap.append(wh,out); b.appendChild(wrap);
  const x=cv.getContext('2d'), N=s.items.length, cols=['#e23d55','#2f8cf0','#3fb54a','#8a5cf6','#ff8a2b','#00a6a6','#d89c12','#ef5b9c'];
  let ang=0;
  function draw(){ x.clearRect(0,0,600,600); for(let i=0;i<N;i++){ const a0=ang+i*2*Math.PI/N, a1=a0+2*Math.PI/N; x.beginPath(); x.moveTo(300,300); x.arc(300,300,290,a0,a1); x.fillStyle=cols[i%cols.length]; x.fill(); x.strokeStyle='#fff'; x.lineWidth=4; x.stroke(); x.save(); x.translate(300,300); x.rotate((a0+a1)/2); x.fillStyle='#fff'; x.font=`700 ${N>10?34:44}px "Noto Naskh Arabic", serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(s.items[i],185,0); x.restore(); } x.beginPath(); x.arc(300,300,36,0,7); x.fillStyle='#fff'; x.fill(); }
  draw(); if(document.fonts) document.fonts.ready.then(draw);
  let spinning=false;
  sp.onclick=()=>{ if(spinning) return; spinning=true; const target=ang+Math.PI*2*(4+Math.random()*2); const start=ang, t0=performance.now(), dur=3200; out.querySelector('.res').textContent='';
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); ang=start+(target-start)*e; draw(); if(p<1) requestAnimationFrame(step); else { spinning=false; const a=((-Math.PI/2-ang)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); const i=Math.floor(a/(2*Math.PI/N)); const w=s.items[i]; out.querySelector('.res').innerHTML=hl(w,s.hl??L.letter); sfx.ok(); } };
    requestAnimationFrame(step); };
};

/* synthesized everyday sounds for listening games */
const SYN = {
