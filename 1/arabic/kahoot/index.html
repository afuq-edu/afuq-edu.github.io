:root{--bg:#F3F9F7;--ink:#24343A;--muted:#5D7A72;--line:#D5E6DF;--card:#FFFFFF;--mint:#4FA58A;--mint-50:#E6F4EE;
--sky:#6FA8DC;--sky-50:#EAF3FB;--sand:#E9C77F;--sand-50:#FBF3DF;--rose:#E99AAA;--rose-50:#FCEDEF;--ok:#3E9B73;--bad:#D9798B}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Baloo,"Baloo Bhaijaan 2",system-ui,sans-serif;font-size:18px;line-height:1.5;
padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.screen{display:none;min-height:100%;padding:18px clamp(12px,3vw,40px) 30px}
.screen.on{display:block}
/* ---------- البداية ---------- */
.brand{text-align:center;margin:6px 0 18px}
.brand h1{margin:0;font-size:clamp(30px,5vw,52px);font-weight:800;color:#2F6E5A;letter-spacing:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:clamp(15px,2vw,19px)}
.steps{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.step{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px}
.step h2{margin:0 0 8px;font-size:20px;color:#2F6E5A;display:flex;gap:10px;align-items:center}
.step h2 i{font-style:normal;display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--sand-50);border:1.5px solid #EBD7A5;align-items:center;justify-content:center;font-size:16px;color:#7A5D20}
.wide{grid-column:1/-1}
select{width:100%;font-family:inherit;font-size:18px;padding:9px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.periods{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.periods label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:17px;line-height:1.45}
.periods input{margin-top:6px;accent-color:var(--mint)}
.periods label:has(input:checked){background:var(--mint-50);border-color:#9FD0BC}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:24px;color:#2F6E5A}
.stepper b{font-size:28px;min-width:30px;text-align:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.names div{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:4px 8px;background:#fff}
.names input{border:0;font-family:inherit;font-size:17px;width:100%;background:transparent;color:var(--ink)}
.emb{width:28px;height:28px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.emb svg{width:18px;height:18px}
.count{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.count input[type=range]{flex:1 1 220px;accent-color:var(--mint);height:30px}
.count output{font-size:30px;font-weight:800;color:#2F6E5A;min-width:40px;text-align:center}
.quick{display:flex;gap:8px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;font-size:17px;color:#2F6E5A}
.quick button.on{background:var(--mint-50);border-color:#9FD0BC}
.go{display:block;margin:18px auto 0;border:0;background:#4FA58A;color:#fff;font-size:24px;font-weight:700;padding:12px 44px;border-radius:999px;box-shadow:0 6px 0 #3E8A72}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #3E8A72}
.note{text-align:center;color:var(--muted);font-size:15px;margin-top:8px}
/* ---------- اللعب ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .where{flex:1;color:var(--muted);font-size:16px;min-width:200px}
.bar .prog{font-weight:700;color:#2F6E5A}
.icon{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-size:16px;color:#2F6E5A}
.turns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.turns button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 6px;font-size:17px;color:var(--ink)}
.turns button.now{border-width:2.5px;background:var(--sand-50);border-color:#E3C27B}
.turns button[disabled]{opacity:.55;cursor:default}
.turn-label{font-size:clamp(18px,2.4vw,24px);font-weight:700;color:#7A5D20;margin-bottom:4px}
.stage{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:18px;align-items:start}
.timer{position:relative;width:100%;aspect-ratio:1/1;max-width:220px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bgc{fill:none;stroke:#E2EEEA;stroke-width:12}
.timer .fg{fill:none;stroke:url(#gr);stroke-width:12;stroke-linecap:round;transition:stroke .4s}
.timer.over .fg{stroke:var(--sand)}
.timer .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .sec{font-size:clamp(38px,6vw,64px);font-weight:800;line-height:1;color:#2F6E5A}
.timer.over .sec{color:#9A7524}
.timer .pts{font-size:15px;color:var(--muted)}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:16px 20px}
.qmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px;margin-bottom:6px}
.dots{display:inline-flex;gap:3px}.dots span{width:9px;height:9px;border-radius:50%;background:#D7E6E0}.dots span.f{background:var(--mint)}
.qtext{font-size:clamp(24px,3.6vw,40px);font-weight:700;line-height:1.45;margin:0}
.blank{display:inline-block;min-width:90px;border-bottom:3px dashed #A9CDB9;margin:0 6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:20px;padding:12px 16px;font-size:clamp(19px,2.6vw,28px);color:var(--ink);min-height:72px;transition:background .25s,border-color .25s,transform .15s}
.opt:hover:not([disabled]){border-color:#9FD0BC;transform:translateY(-2px)}
.opt .k{flex:none;width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.opt.right{background:#E3F4EA;border-color:#8CC7A6}
.opt.wrong{background:var(--rose-50);border-color:var(--rose)}
.opt.dim{opacity:.55}
.feedback{min-height:42px;margin-top:12px;text-align:center;font-size:24px;font-weight:700}
.feedback.ok{color:var(--ok)}.feedback.no{color:#B65D6E}
.ctrl{display:flex;justify-content:center;gap:10px;margin-top:6px}
.soft{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 20px;font-size:17px;color:#2F6E5A}
.primary{border:0;background:#4FA58A;color:#fff;border-radius:999px;padding:9px 30px;font-size:20px;font-weight:700;box-shadow:0 5px 0 #3E8A72}
/* ---------- النتائج ---------- */
.overlay{position:fixed;inset:0;background:rgba(236,245,241,.86);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.overlay.on{display:flex}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:28px;width:min(980px,100%);padding:18px 20px 20px;box-shadow:0 20px 50px rgba(47,110,90,.12)}
.panel h2{margin:0;text-align:center;font-size:clamp(22px,3vw,32px);color:#2F6E5A}
.panel .sub{text-align:center;color:var(--muted);font-size:16px}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,34px);height:clamp(220px,42vh,380px);margin:14px 0 8px;padding:0 6px;border-bottom:2px solid var(--line)}
.col{flex:1 1 0;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .val{font-size:clamp(18px,2.4vw,26px);font-weight:800;margin-bottom:4px}
.col .barv{width:100%;border-radius:16px 16px 6px 6px;height:6px;transition:height 1s cubic-bezier(.2,.8,.2,1);position:relative;display:flex;justify-content:center}
.col .barv .emb{position:absolute;top:-16px;background:#fff;border:2px solid currentColor;width:32px;height:32px}
.col.win .barv{box-shadow:0 0 0 4px #F3DFA8}
.col .rk{margin-top:6px;font-size:15px;color:var(--muted)}
.labels{display:flex;justify-content:center;gap:clamp(10px,3vw,34px);padding:0 6px}
.labels div{flex:1 1 0;max-width:130px;text-align:center;font-size:clamp(15px,2vw,19px);font-weight:700;line-height:1.3}
.labels .tag{display:block;font-size:13px;color:#9A7524;font-weight:600}
/* ---------- التتويج ---------- */
#final{text-align:center}
#final h1{font-size:clamp(30px,5vw,50px);color:#2F6E5A;margin:8px 0 0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,28px);margin:26px auto 10px;max-width:760px;--u:1px}
.pd{flex:1 1 0;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pd .who{font-size:clamp(18px,2.6vw,26px);font-weight:800;margin-bottom:2px}
.pd .sc{color:var(--muted);font-size:17px;margin-bottom:6px}
.pd .blk{width:100%;border-radius:18px 18px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:40px;font-weight:800;color:#fff;transform-origin:bottom;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.pd .crown{font-size:30px;line-height:1}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.rest{max-width:520px;margin:10px auto;display:flex;flex-direction:column;gap:6px}
.rest div{display:flex;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;font-size:18px}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:4}
@media (max-width:760px){
  .steps{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr}
  .timer{max-width:150px;margin:0 auto}
  .opts{grid-template-columns:1fr}
  .podium{--u:.72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function balanced(list, n) {

  while (out.length < n && (by[1].length || by[2].length || by[3].length)) for (const d of [1, 2, 3]) if (by[d].length && out.length < n) out.push(by[d].shift());

function pick(L, k, n) {

    rest = balanced(others, n - own.length);
  }
  return own.map(q => ({ ...q, own: 1 })).concat(rest.map(q => ({ ...q, own: 0 })))
    .sort((a, b) => a.d - b.d || b.own - a.own)
    .map(q => {
      if (q.t === 'tf') return { ...q, opts: q.o.map((x, i) => ({ x, ok: i === q.a })) };
      return { ...q, opts: shuffle(q.o.map((x, i) => ({ x, ok: i === q.a }))) };
    });
}

  const q = S.qs[S.idx], t = (performance.now() - S.t0) / 1000, ok = q.opts[i].ok, pts = ok ? points(t) : 0;
  markOpts(i);
  const fb = $('#fb');
  if (ok) { fb.textContent = 'أحسنتم! +' + pts + ' نقطة لمجموعة ' + S.groups[S.turn].name; fb.className = 'feedback ok'; SND.ok(); }
  else { fb.textContent = 'إجابة غير صحيحة – الإجابة الصحيحة مظلّلة بالأخضر'; fb.className = 'feedback no'; SND.no(); }
  finishQ(ok, pts);
}
$('#reveal').onclick = () => { if (S.answered) return; markOpts(-1); $('#fb').textContent = 'هذه هي الإجابة الصحيحة (بلا نقاط)'; $('#fb').className = 'feedback'; finishQ(false, 0); };

/* ---------- مخطط الأعمدة ---------- */
function showResults() {
  const n = S.groups.length, max = Math.max(1000, ...S.groups.map(g => g.score));
  const order = S.groups.map((g, i) => i).sort((a, b) => S.groups[b].score - S.groups[a].score);
  const rank = {}; order.forEach((gi, r) => rank[gi] = (r > 0 && S.groups[gi].score === S.groups[order[r - 1]].score) ? rank[order[r - 1]] : r + 1);
  $('#resT').textContent = 'ترتيب المجموعات بعد السؤال ' + (S.idx + 1);
  $('#resS').textContent = S.winner >= 0 ? 'الفائزة بهذا السؤال: مجموعة ' + S.groups[S.winner].name : 'لا نقاط في هذا السؤال';
  const ch = $('#chart'), lb = $('#labels'); ch.innerHTML = ''; lb.innerHTML = '';
  S.groups.forEach((g, i) => {
    const col = document.createElement('div'); col.className = 'col' + (i === S.winner ? ' win' : '');
    col.innerHTML = '<div class="val">' + S.prev[i] + '</div><div class="barv" style="background:' + COLORS[g.c] + ';color:' + COLORS[g.c] + '">' + embHTML(g.c) + '</div><div class="rk">المركز ' + rank[i] + '</div>';
    ch.appendChild(col);
    const l = document.createElement('div'); l.textContent = g.name;
    if (i === S.winner) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'فازت بالسؤال'; l.appendChild(t); }
    lb.appendChild(l);
    const bar = col.querySelector('.barv'), val = col.querySelector('.val');
    bar.style.height = Math.max(6, S.prev[i] / max * 82) + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.height = Math.max(6, g.score / max * 82) + '%'; }));
    countUp(val, S.prev[i], g.score);
  });
  $('#next').textContent = S.idx + 1 < S.qs.length ? 'السؤال التالي' : 'إلى منصة التتويج';
  $('#res').classList.add('on'); SND.chart(); $('#next').focus();
}
function countUp(el, a, b) {
  const t0 = performance.now(), d = 900;
  const step = now => { const p = Math.min(1, (now - t0) / d); el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
$('#next').onclick = () => {
  $('#res').classList.remove('on');
  if (S.idx + 1 < S.qs.length) { S.idx++; S.turn = (S.turn + 1) % S.groups.length; question(); }
  else finale();
};

/* ---------- التتويج ---------- */
function finale() {
  cancelAnimationFrame(S.raf);
  const order = S.groups.map((g, i) => i).sort((a, b) => S.groups[b].score - S.groups[a].score);
  $('#finS').textContent = D.lessons[S.li].title + ' – الحصة ' + S.k + ' – عدد الأسئلة: ' + S.qs.length;
  const pod = $('#podium'); pod.innerHTML = '';
  const slots = order.length >= 3 ? [order[1], order[0], order[2]] : [order[1], order[0]];
  const H = { 0: 'calc(var(--u) * 200)', 1: 'calc(var(--u) * 145)', 2: 'calc(var(--u) * 105)' };
  slots.forEach(gi => {
    const place = order.indexOf(gi), g = S.groups[gi];
    const d = document.createElement('div'); d.className = 'pd';
    d.innerHTML = (place === 0 ? '<div class="crown">👑</div>' : '') + embHTML(g.c) + '<div class="who"></div><div class="sc">' + g.score + ' نقطة</div>' +
      '<div class="blk" style="height:' + H[place] + ';background:' + COLORS[g.c] + ';animation-delay:' + (place === 0 ? .5 : place === 1 ? .25 : 0) + 's">' + (place + 1) + '</div>';
    d.querySelector('.who').textContent = g.name;
    pod.appendChild(d);
  });
  const rest = $('#rest'); rest.innerHTML = '';
  order.slice(3).forEach((gi, r) => { const g = S.groups[gi], d = document.createElement('div'); d.innerHTML = '<span>المركز ' + (r + 4) + ': <b></b></span><span>' + g.score + ' نقطة</span>'; d.querySelector('b').textContent = g.name; rest.appendChild(d); });
  show('final'); SND.fin(); confetti();
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#conf'), x = c.getContext('2d'); let W, Hh;
  const size = () => { W = c.width = innerWidth * devicePixelRatio; Hh = c.height = innerHeight * devicePixelRatio; };
  size();
  const P = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: -Math.random() * Hh * .6, r: (4 + Math.random() * 6) * devicePixelRatio, vy: (.6 + Math.random() * 1.1) * devicePixelRatio, vx: (Math.random() - .5) * .6 * devicePixelRatio, c: COLORS[Math.floor(Math.random() * 6)], a: Math.random() * 6.28 }));
  const t0 = performance.now();
  const loop = now => {
    const el = now - t0; x.clearRect(0, 0, W, Hh);
    x.globalAlpha = el > 5000 ? Math.max(0, 1 - (el - 5000) / 1500) : .8;
    P.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin((p.y + p.a * 40) / 60) * .4; x.fillStyle = p.c; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.28); x.fill(); if (p.y > Hh + 20) { p.y = -20; } });
    if (el < 6500) requestAnimationFrame(loop); else x.clearRect(0, 0, W, Hh);
  };
  requestAnimationFrame(loop);
}

/* ---------- عناصر التحكم ---------- */
$('#start').onclick = () => { tone(0, .01, 'sine', .0001); start(); };
$('#mute').onclick = e => { muted = !muted; e.currentTarget.setAttribute('aria-pressed', muted); e.currentTarget.textContent = muted ? '🔇 مكتوم' : '🔈 الصوت'; };
$('#quit').onclick = () => { if (confirm('هل تريد إنهاء المسابقة الآن والانتقال إلى منصة التتويج؟')) { $('#res').classList.remove('on'); finale(); } };
$('#again').onclick = () => start();
$('#newGame').onclick = () => show('setup');
document.addEventListener('keydown', e => {
  if ($('#play').classList.contains('on') && !$('#res').classList.contains('on') && !S.answered) {
    const m = { '1': 0, '2': 1, '3': 2, '4': 3, '١': 0, '٢': 1, '٣': 2, '٤': 3 }[e.key];
    if (m !== undefined && m < S.qs[S.idx].opts.length) answer(m);
  }
});
</script>
