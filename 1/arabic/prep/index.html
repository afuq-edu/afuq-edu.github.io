:root{--ink:#26343B;--muted:#5E7F70;--sage:#2F5F4F;--sage-50:#EEF5F1;--sage-100:#DCE7E1;--sage-300:#A9CDB9;
--sand-50:#FBF4E2;--sand-200:#EEDDB3;--sky-50:#EEF4FA;--sky-600:#35566E;--bg:#F7FAF8;--ok:#2E7D5B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Naskh,"Noto Naskh Arabic",serif;font-size:17px;line-height:1.8;
padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:920px;margin:0 auto;padding:14px 14px 60px}
header.top{background:#fff;border:1.3px solid #C9DFD3;border-radius:14px;padding:12px 16px}
.subj{font-family:Plex,sans-serif;font-size:13px;color:var(--muted)}
h1{font-family:Plex,sans-serif;font-size:22px;color:var(--sage);margin:2px 0 8px;line-height:1.4}
.mode{display:flex;background:var(--sage-50);border:1px solid var(--sage-100);border-radius:999px;padding:4px;gap:4px;width:max-content;max-width:100%}
.mode button{font-family:Plex,sans-serif;font-size:15px;border:0;background:transparent;color:var(--sage);padding:7px 18px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 1.5px var(--sage-300) inset;color:var(--ink)}
.mode button:focus-visible,.tabs button:focus-visible,select:focus-visible,.copy:focus-visible{outline:3px solid #7DB3E0;outline-offset:2px}
.explain{margin:8px 0 0;font-size:15px;color:#41525A}
.explain p{margin:0}

ع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   المتعلم: يردد المتعلمون الخلاصة ويدوّنون المطلوب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما عنوان النص الذي استمعت إليه؟\n   الإجابة النموذجية: «غيرة ليلى».\n2) [المستوى المتوقع] من شخصيات النص؟\n   الإجابة النموذجية: ذكر شخصيات النص كما وردت.\n3) [المستوى المتقدم] ماذا تعلّمت من النص؟\n   الإجابة النموذجية: التعاطف وتقدير الذات واحترام أفراد الأسرة.", "1) [مستوى الدعم] اذكر كلمة سمعتها في النص فيها حرف ل.\n   الإجابة النموذجية: كلمة صحيحة من النص فيها الحرف.\n2) [المستوى المتوقع] رتّب حدثين من أحداث النص.\n   الإجابة النموذجية: ترتيب صحيح للحدثين.\n3) [المستوى المتقدم] لو كنت إحدى شخصيات النص، ماذا كنت ستفعل؟\n   الإجابة النموذجية: إجابة منطقية تتسق مع قيمة النص.", "للطالب: يحكي لأسرته نص «غيرة ليلى» بأسلوبه (كتاب الطالب ص 54–63).\nلولي الأمر: يستمع إلى طفله وهو يحكي النص ويسأله عن القيمة المستفادة.\nالمرجع: كتاب الطالب – الجزء الأول: ص 54–63."]}, {"k": 3, "axis": "ألاحظ: صوت حرف ل مع الحركات القصيرة وموقعه في الكلمة", "week": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1. ينطق صوت حرف ل مع الفتحة والضمة والكسرة: لَ، لُ، لِ.\n2. يميّز سمعيًا موقع حرف ل في الكلمة (أولها، وسطها، آخرها).\n3. يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة.\nمخرج تعليمي آخر: يقرأ مقاطع قصيرة بحرف ل قراءة صحيحة.", "المخرج 1: ينطق صوت حرف ل مع الفتحة والضمة والكسرة: لَ، لُ، لِ. ← تطبيق\nالمخرج 2: يميّز سمعيًا موقع حرف ل في الكلمة (أولها، وسطها، آخرها). ← تحليل\nالمخرج 3: يتعرّف أن اسم الحرف وصوته لا يتغيران مهما تغيّر مكانه في الكلمة. ← فهم\nالمخرج الآخر: يقرأ مقاطع قصيرة بحرف ل قراءة صحيحة. ← تطبيق", "التعلم بالنمذجة، التعلم المبني على اللعب، التعلم بالاكتشاف\nاستراتيجيات أخرى من دليل المعلم: التدريس المباشر، السؤال والجواب، التنبؤ، العصف الذهني (من دليل المعلم)", "الكتاب، السبورة الذكية، جهاز عرض البيانات، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات المقاطع وبطاقات الحركات", "الصوت، الحركات القصيرة، المقطع القصير، موقع الحرف", " اطئ", "تعرض المعلمة بطاقة كبيرة لحرف ط، وتسأل المتعلمين عن اسمه وأين رأوه، ثم تشوّقهم إلى درس اليوم «مطر على الشاطئ».", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تعرض بطاقة كبيرة لحرف ط وتسأل: من يعرف اسم هذا الحرف؟ وأين رأيتموه؟\n   المتعلم: يخمّنون اسم الحرف ويذكرون أماكن رأوه فيها.\n2) أتأمل ثم ألوّن (6 د: من الدقيقة 4 إلى 10)\n   المعلمة: توجّه إلى صفحة الدرس الأولى وتطلب تلوين حرف ط أينما ظهر، دون تدريس الحرف تدريسًا مباشرًا.\n   المتعلم: يتأمل الصورة ويلوّن حرف ط.\n3) أنشد (7 د: من الدقيقة 10 إلى 17)\n   المعلمة: تعرض بيت حرف ط من أنشودة الحروف، وتنشده منفردة ثم مع المتعلمين، مراعية إخراج الحرف من مخرجه.\n   المتعلم: ينشد البيت مع الإيماءات ولغة الجسد.\n4) أتحدث (8 د: من الدقيقة 17 إلى 25)\n   المعلمة: تذكّر بآداب التحدث، ثم تطرح أسئلة عن اللوحة تكون الإجابة عنها بجملة تامة فيها كلمات بحرف ط.\n   المتعلم: يتحدث عن اللوحة بجمل مثل: «هذا طائرة».\n5) كلمات من الصورة (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تكتب على السبورة كلمات ذكرها المتعلمون فيها حرف ط (تقويم تكويني).\n   المتعلم: يشير إلى حرف ط في الكلمات المكتوبة.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة متدرجة (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   المتعلم: يجيب كل متعلم عن السؤال الموجّه إليه شفويًا أو كتابيًا.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية وتختار الدرس وعنوان الحصة وعددًا من الأسئلة يناسب الوقت.\n   المتعلم: تجيب المجموعة صاحبة الدور خلال الوقت وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص ما تعلّمه المتعلمون في جملة وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   المتعلم: يردد المتعلمون الخلاصة ويدوّنون المطلوب.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما اسم هذا الحرف: «ط»؟\n   الإجابة النموذجية: الطاء.\n2) [المستوى المتوقع] اذكر كلمة تبدأ بحرف ط.\n   الإجابة النموذجية: مثل: طائرة.\n3) [المستوى المتقدم] أنشد بيت حرف ط من أنشودة الحروف بأسلوب معبّر.\n   الإجابة النموذجية: إنشاد صحيح معبّر بالإيماءات.", " const $ = s => document.querySelector(s);
let mode = 'sep', li = 0, pi = 0;
$('#subj').textContent = D.subject;
D.lessons.forEach((L, i) => {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = 'الأسبوع ' + L.weeks.join('، ') + ' – ' + L.title + ' (' + L.n + (L.n > 2 ? ' حصص' : (L.n === 2 ? ' حصتان' : ' حصة')) + ')';
  $('#lesson').appendChild(o);
});
function fieldText(L, fi) {
  if (mode === 'sep') return L.periods[pi].f[fi];
  return L.periods.map(P => 'الحصة ' + P.k + ' (' + P.axis + '):\n' + P.f[fi]).join('\n\n');
}
function render() {
  const L = D.lessons[li];
  $('#mSep').setAttribute('aria-pressed', mode === 'sep');
  $('#mCom').setAttribute('aria-pressed', mode === 'com');
  $('#status').textContent = mode === 'sep'
    ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة (الحصة ' + (pi + 1) + ' من ' + L.n + ').'
    : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه الـ' + L.n + '.';
  const tabs = $('#tabs'); tabs.innerHTML = '';
  tabs.style.display = mode === 'sep' ? 'flex' : 'none';
  if (mode === 'sep') L.periods.forEach((P, i) => {
    const b = document.createElement('button');
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === pi);
    b.textContent = 'الحصة ' + P.k;
    b.title = P.axis;
    b.onclick = () => { pi = i; render(); };
    tabs.appendChild(b);
  });
  const P = L.periods[pi];
  $('#info').innerHTML = '<div class="row"><span><b>الدرس:</b> ' + L.title + '</span><span><b>الوحدة:</b> ' + L.unit + '</span>' +
    (mode === 'sep' ? '<span><b>' + P.week + '</b></span><span><b>الحصة ' + P.k + ' من ' + L.n + '</b></span>' : '<span><b>عدد الحصص:</b> ' + L.n + '</span>') +
    '</div><div class="row"><span>' + L.sb + '</span><span>' + L.tg + '</span></div>' +
    (mode === 'sep' ? '<div class="axis"><b>محور الحصة:</b> ' + P.axis + '</div>' : '');

    const c = document.createElement('section'); c.className = 'card';
    const t = fieldText(L, fi);
    c.innerHTML = '<h2><span class="num">' + (fi + 1) + '</span><span class="name"></span><button class="copy" type="button">نسخ</button></h2><pre class="txt"></pre><p class="hint">لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، انسخه يدويًّا.</p>';

    c.querySelector('.txt').textContent = t;

}
function flash(btn) {
  btn.textContent = 'تم النسخ ✓'; btn.classList.add('done');
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = 'نسخ'; btn.classList.remove('done'); }, 1800);
}
function legacyCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta); return ok;
}
function selectCard(card) {
  card.classList.add('manual');
  const r = document.createRange(); r.selectNodeContents(card.querySelector('.txt'));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
async function copyText(t, btn, card) {
  card.classList.remove('manual');
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); flash(btn); return; }
  } catch (e) {}
  if (legacyCopy(t)) { flash(btn); return; }
  selectCard(card);
}
$('#lesson').onchange = e => { li = +e.target.value; pi = 0; render(); };
$('#mSep').onclick = () => { mode = 'sep'; render(); };
