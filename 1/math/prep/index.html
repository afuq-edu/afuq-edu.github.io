يقة نفسها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بعد مجموعة من ٩ أشياء مبعثرة دون تكرار أو إغفال بطريقتين مختلفتين، ثم يشرحون لماذا يبقى العدد ٩ مهما بدأنا العد من أي شيء.", "١. (مستوى المعرفة) السؤال: عُدّ من ١ إلى ١٠. — الإجابة النموذجية: ١، ٢، ...، ١٠.\n٢. (مستوى التطبيق) السؤال: عُدّ تنازليًا من ١٠ إلى ٥. — الإجابة النموذجية: ١٠، ٩، ٨، ٧، ٦، ٥.\n٣. (مستوى الاستدلال) السؤال: أنا عدد قبل ٩ وبعد ٧، من أنا؟ — الإجابة النموذجية: ٨.", "يمارس الطفل مع أسرته العد التصاعدي والتنازلي أثناء صعود الدرج أو نزوله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=2"]}, {"num": "٣", "ax": "تطبيقات ومراجعة الوحدة ١: كتاب العد", "sb": "٤–٦", "ab": "٨–١٠", "f": ["١. يمثل الأعداد حتى ١٠ بالرسم والكتابة (15 دقيقة)\n٢. يعد ويقرأ ويكتب الأعداد حتى ١٠ في مواقف متنوعة (10 دقائق)\nمخرج تعليمي آخر: يصنع كتاب عدّ صغيرًا من ١ إلى ١٠ (15 دقيقة)", "المخرج ١: تطبيق — يمثل الأعداد حتى ١٠ بالرسم والكتابة.\nالمخرج ٢: تطبيق — يعد ويقرأ ويكتب الأعداد حتى ١٠ في مواقف متنوعة.\nالمخرج الآخر: إبداع — يصنع كتاب عدّ صغيرًا من ١ إلى ١٠.", "التعلم المبني على المشاريع، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، الأقلام، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: أوراق A4 مطوية ودبّاسة وألوان", "كتاب العد، العدد، الرقم، الكمية", "يعرض المعلم كتاب عدّ صغيرًا صنعه بنفسه، ويقلّب صفحاته ويسأل: «ماذا رسمت في صفحة ٣؟ هل الرسم صحيح؟».", "1. التهيئة: يعرض المعلم نموذج كتاب العد ويناقش صفحاته، والتلاميذ يعدّون الرسوم في الصفحات (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أمثل الأعداد حتى ١٠»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مشروع كتاب العد: يوزع المعلم أوراقًا مطوية مرقمة ١–١٠ ويتابع الرسم، والتلاميذ يرسمون في كل صفحة أشياء بعدد رقمها ويكتبون الرقم (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. مراجعة: يعرض المعلم صفحتي كتاب التلميذ ص٤–٦ للمراجعة السريعة، والتلاميذ يقرؤون الأعداد ويعدّون (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشا ردات: أطول، أقصر، أعلى، أكثر انخفاضًا (15 دقيقة)\nمخرج تعليمي آخر: يرتب ثلاثة أشياء من الأقصر إلى الأطول (15 دقيقة)", "المخرج ١: فهم — يقارن بين طولين أو ارتفاعين مقارنة مباشرة.\nالمخرج ٢: تذكر — يستخدم مفردات: أطول، أقصر، أعلى، أكثر انخفاضًا.\nالمخرج الآخر: تطبيق — يرتب ثلاثة أشياء من الأقصر إلى الأطول.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالمحسوسات", "الكتاب، السبورة الذكية، أخرى: أقلام وأشرطة بأطوال مختلفة، مكعبات متشابكة", "الطول، الارتفاع، أطول، أقصر، أعلى، نقطة البداية", "يطلب المعلم من تلميذين الوقوف ظهرًا لظهر، ويسأل: «من الأطول؟ كيف نتأكد؟»، ويلفت الانتباه إلى الوقوف على الأرض نفسها.", "1. التهيئة: ينفذ المعلم موقف المقارنة بين تلميذين، والتلاميذ يقارنون ويقترحون طريقة التأكد (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقارن الأطوال»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النمذجة: يقارن المعلم قلمين بوضعهما على خط بداية واحد ويستخدم المفردات، والتلاميذ يرددون: «هذا القلم أطول من ذلك» (8 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. نشاط: المعلم: يوزع أشياء مختلفة الأطوال على المجموعات يقارنون ويرتبون من الأقصر إلى الأطول ويصفون بالمفردات (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص١١ (الطول) ويناقش الصور يحددون الأطول والأقصر والأعلى في الصور (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون ويبررون (4 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.", "١. (مستوى المعرفة) السؤال: أي القلمين أطول؟ (قلمان ظاهران) — الإجابة النموذجية: تحديد الأطول بالمقارنة.\n٢. (مستوى التطبيق) السؤال: لماذا نضع الشيئين على خط بداية واحد؟ — الإجابة النموذجية: لتكون المقارنة عادلة.\n٣. (مستوى الاستدلال) السؤال: رتّب ثلاثة أشرطة من الأقصر إلى الأطول. — الإجابة النموذجية: ترتيب صحيح حسب الأشرطة.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم مع التلميذ قلمين على خط بداية واحد مرسوم على الطاولة ويقارنان طرفيهما ليحدد الأطول والأقصر، ثم يُسأل التلميذ: أي الشريطين أقصر؟ بعد أن يضعهما بنفسه على خط البداية.\n• نشاط إثرائ ا (٨ أزواج) وكيف تأكدوا أنهم لم ينسوا زوجًا.", "١. (مستوى المعرفة) السؤال: أكمل: ٦ + ... = ٩. — الإجابة النموذجية: ٣.\n٢. (مستوى التطبيق) السؤال: اكتب زوجين للعدد ٨. — الإجابة النموذجية: مثل: ٧ + ١، ٦ + ٢.\n٣. (مستوى الاستدلال) السؤال: ما العدد المفقود: ... + ٣ = ٧؟ — الإجابة النموذجية: ٤.", "يتدرب الطفل على أزواج الأعداد من ٦ إلى ٩ بلعبة اليدين في البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=7"]}]}, {"id": "٤-٢", "title": "أكثر من ١٠ بقليل", "unit": "الوحدة ٤: العد ما بعد العشرة", "u": 4, "week": "السادس (١١ – ١٥/١٠/٢٠٢٦م)", "tb": "٣٠–٣٣، ٣٦–٣٨", "periods": [{"num": "١", "ax": "تكوين الأعداد من ١١ إلى ٢٠ بعشرة وآحاد", "sb": "١٣", "ab": "—", "f": ["١. يكوّن الأعداد من ١١ إلى ٢٠ بأنها عشرة وعدد من الآحاد (25 دقيقة)\n٢. يقرأ الأعداد من ١١ إلى ٢٠ ويكتبها (5 دقائق)\nمخرج تعليمي آخر: يمثل العدد باستخدام بطاقات سهم العشرات والآحاد (10 دقائق)", "المخرج ١: فهم — يكوّن الأعداد من ١١ إلى ٢٠ بأنها عشرة وعدد من الآحاد.\nالمخرج ٢: تذكر — يقرأ الأعداد من ١١ إلى ٢٠ ويكتبها.\nالمخرج الآخر: تطبيق — يمثل العدد باستخدام بطاقات سهم العشرات والآحاد.", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم بالمحسوسات", "الكتاب، السبورة الذكية، أخرى: إطارا عشرة لكل تلميذ، مواد عد، بطاقات سهم العشرات والآحاد (كتاب النشاط ص٥٩–٦١)", "عشرة، آحاد، العشرات والآحاد، أحد عشر … عشرون", "يملأ المعلم إطار عشرة كاملًا ويضع ٣ مكعبات في إطار ثانٍ، ويسأل: «كم في الإطار الممتلئ؟ وكم في الثاني؟ وكم الكل؟».", "1. التهيئة: يعرض المعلم الإطارين ويطرح الأسئلة، والتلاميذ يعدّون ويذكرون ١٣ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أكوّن الأعداد من ١١ إلى ٢٠»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. النمذجة: يكوّن المعلم ١٤ بإطار ممتلئ و٤، ثم يضع بطاقة ١٠ وفوقها بطاقة ٤ ليظهر ١٤، والتلاميذ يرددون: «١٤ هي عشرة وأربعة» (10 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. نشاط ثنائي: يحدد المعلم أعدادًا بين ١١ و٢٠ ويتابع، والتلاميذ يكوّنون العدد بالإطارين، ثم يعكسون النشاط فيكتبون العدد من الإطارين (12 د n٢. (مستوى التطبيق) السؤال: كم ضلعًا للمربع؟ — الإجابة النموذجية: ٤.\n٣. (مستوى الاستدلال) السؤال: ما الفرق بين المربع والمستطيل؟ — الإجابة النموذجية: أضلاع المربع متساوية، والمستطيل له ضلعان طويلان وضلعان قصيران.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ أشكالًا ورقية (دائرة، مربع، مستطيل، مثلث)، فيمرر إصبعه على أضلاع كل شكل ويعدها مع المعلم ويسميه، ثم يُسأل: كم ضلعًا للمثلث؟ (٣).\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بفرز مجموعة أشكال بطريقتين مختلفتين (حسب عدد الأضلاع ثم حسب اللون) وتبرير كل طريقة، ثم يرسمون شكلًا له ٦ أضلاع ويسمونه (السداسي).", "١. (مستوى المعرفة) السؤال: كم رأسًا للمثلث؟ — الإجابة النموذجية: ٣.\n٢. (مستوى التطبيق) السؤال: ما الشكل الذي ليس له أضلاع ولا رؤوس؟ — الإجابة النموذجية: الدائرة.\n٣. (مستوى الاستدلال) السؤال: شكل له ٦ أضلاع. ما اسمه؟ — الإجابة النموذجية: السداسي.", "يبحث الطفل في البيت عن أشكال (دائرة، مربع، مستطيل، مثلث) ويسميها، ويراجع كتاب التلميذ ص١٦.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=11"]}, {"num": "٢", "ax": "فرز الأشكال وتصنيفها حسب خصائصها", "sb": "١٦–١٧", "ab": "٢١", "f": ["١. يفرز الأشكال حسب عدد الأضلاع أو اللون أو الحجم (15 دقيقة)\n٢. يبرر طريقة الفرز التي اختارها (10 دقائق)\nمخرج تعليمي آخر: يكتشف أن الشكل لا يتغير بتغير لونه أو حجمه أو وضعه (15 دقيقة)", "المخرج ١: تحليل — يفرز الأشكال حسب عدد الأضلاع أو اللون أو الحجم.\nالمخرج ٢: تقييم — يبرر طريقة الفرز التي اختارها.\nالمخرج الآخر: فهم — يكتشف أن الشكل لا يتغير بتغير لونه أو حجمه أو وضعه.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، الأقلام، أخرى: أطواق فرز، قطع أشكال، كتاب النشاط ص٢١", "الفرز، التصنيف، الضلع، الحجم", "يضع المعلم أشكالًا متنوعة على الطاولة ويسأل: «كيف يمكن أن نقسم هذه الأشكال إلى مجموعات؟».", "1. التهيئة: يعرض المعلم الأشكال ويثير السؤال، والتلاميذ يقترحون طرق الفرز (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أفرز الأشكال وأوضح طريقتي»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط: المعلم: يوزع الأشكال وأطواق الفرز يفرزون حسب قاعدة يختارونها (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تخمين القاعدة: يطلب المعلم من كل مجموعة عرض فرزها دون ذكر القاعدة، وتخمّن المجموعات الأخرى قاعدة الفرز (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢١ (الأشكال الثنائية الأبعاد)، والتلاميذ يلونون ويصنفون الأشكال (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يعرض المعلم مثلثًا مقلوبًا وكبيرًا ويسأل: «هل ما زال مثلثًا؟»، والتلاميذ يجيبون ويبررون (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "١. (مستوى المعرفة) السؤال: ضع كل المثلثات في الطوق. — الإجابة النموذجية: المثلثات فقط.\n٢. (مستوى التطبيق) السؤال: افرز الأشكال إلى: لها ٤ أضلاع، وليس لها ٤ أضلاع. — الإجابة النموذجية: فرز صحيح.\n٣. (مستوى الاستدلال) السؤال: مثلث كبير أحمر ومثلث صغير أزرق: لماذا هما في المجموعة نفسها؟ — الإجابة النموذجية: لأن كلًا منهما له ٣ أضلاع.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ أشكالًا ورقية (دائرة، مربع، مستطيل، مثلث)، فيمرر إصبعه على أضلاع كل شكل ويعدها مع المعلم ويسميه، ثم يُسأل: كم ضلعًا للمثلث؟ (٣).\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بفرز مجموعة أشكال بطريقتين مختلفتين (حسب عدد الأضلاع ثم حسب اللون) وتبرير كل طريقة، ثم يرسمون شكلًا له ٦ أضلاع ويسمونه (السداسي).", "١. (مستوى المعرفة) السؤال: لوّن المربعات باللون الأحمر. — الإجابة النموذجية: المربعات فقط.\n٢. (مستوى التطبيق) السؤال: كم شكلًا له ٤ أضلاع في المجموعة؟ — الإجابة النموذجية: حسب الشكل المعروض.\n٣. (مستوى الاستدلال) السؤال: فرز علي الأشكال إلى مجموعتين: دوائر وغيرها. اقترح قاعدة أخرى. — الإجابة النموذجية: مثل: حسب اللون أو عدد الأضلاع.", "يحل الطفل كتاب النشاط ص٢١، ويفرز أشياء البيت حسب شكلها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=11"]}, {"num": "٣", "ax": "الاصطفاف بالفسيفساء وتكوين أشكال من أشكال", "sb": "١٧", "ab": "٢٠", "f": ["١. يكوّن أشكالًا جديدة بتجميع أشكال ثنائية الأبعاد (15 دقيقة)\n٢. يحدد الأشكال التي تتلاصق دون فراغات (10 دقائق)\nمخرج تعليمي آخر: يصنع مربعًا كبيرًا من أربعة مربعات (15 دقيقة)", "المخرج ١: إبداع — يكوّن أشكالًا جديدة بتجميع أشكال ثنائية الأبعاد.\nالمخرج ٢: تحليل — يحدد الأشكال التي تتلاصق دون فراغات.\nالمخرج الآخر: تطبيق — يصنع مربعًا كبيرًا من أربعة مربعات.", "التعلم بالاكتشاف، التعلم المبني على المشاريع، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، صورة توضيحية، أخرى: قطع أشكال، صور زخارف إسلامية، كتاب النشاط ص٢٠", "الفسيفساء، تلاصق، فراغ، يكوّن", "يعرض المعلم صورة لزخرفة إسلامية من مسجد في عُمان، ويسأل: «ما الأشكال التي ترونها؟ هل بينها فراغات؟».", "1. التهيئة: يعرض المعلم صورة الزخرفة ويناقش، والتلاميذ يسمون الأشكال الظاهرة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أكوّن أشكالًا من أشكال»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. النمذجة: يرصف المعلم مربعات متجاورة بلا فراغ، ثم دوائر ليلاحظوا الفراغات، والتلاميذ يلاحظون ويقارنون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مشروع الفسيفساء: يوزع المعلم قطع الأشكال على المجموعات، والتلاميذ يصممون لوحة فسيفساء ويحددون الأشكال التي لا تترك فراغات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب التلميذ والنشاط: يوجه المعلم إلى ص١٧ (صناعة أربعة مربعات) وكتاب النشاط ص٢٠ (ماذا يتبقى؟)، والتلاميذ يحلون المهام (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n6. الختام: يعرض المعلم أجمل اللوحات، والتلاميذ يصفون الأشكال المستخدمة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. ختام الدرس – أشكال من بلادي: تبحث المجموعات في رسم سريع لعلم عُمان وباب قلعة عن مستطيلات ومربعات ومثلثات ودوائر، وتعد أضلاع كل شكل ورؤوسه، ثم تعرض أكثر شكل وجدته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: ضع مربعين جنبًا إلى جنب. هل يوجد فراغ؟ — الإجابة النموذجية: لا.\n٢. (مستوى التطبيق) السؤال: ضع دائرتين متلاصقتين. ماذا تلاحظ؟ — الإجابة النموذجية: يبقى فراغ بينهما.\n٣. (مستوى الاستدلال) السؤال: كم مربعًا صغيرًا تحتاج لتكوين مربع كبير؟ — الإجابة النموذجية: ٤.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ أشكالًا ورقية (دائرة، مربع، مستطيل، مثلث)، فيمرر إصبعه على أضلاع كل شكل ويعدها مع المعلم ويسميه، ثم يُسأل: كم ضلعًا للمثلث؟ (٣).\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بفرز مجموعة أشكال بطريقتين مختلفتين (حسب عدد الأضلاع ثم حسب اللون) وتبرير كل طريقة، ثم يرسمون شكلًا له ٦ أضلاع ويسمونه (السداسي).", "١. (مستوى المعرفة) السؤال: سمِّ شكلين يتلاصقان دون فراغ. — الإجابة النموذجية: المربع والمستطيل (أو المثلث).\n٢. (مستوى التطبيق) السؤال: كوّن مستطيلًا من مربعين. — الإجابة النموذجية: مربعان متجاوران.\n٣. (مستوى الاستدلال) السؤال: صمّم نمطًا من المثلثات دون فراغات وصِفه. — الإجابة النموذجية: تصميم مقبول مع وصف.", "يحل الطفل كتاب النشاط ص٢٠، ويتأمل الزخارف في البيت والمسجد ويحدد أشكالها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=11"]}]}, {"id": "٦-٢", "title": "المجسمات", "unit": "الوحدة ٦: الأشكال ثنائية الأبعاد والمجسمات وأنماطها", "u": 6, "week": "الثامن (٢٥ – ٢٩/١٠/٢٠٢٦م)", "tb": "٥٢–٥٥", "periods": [{"num": "١", "ax": "تسمية المجسمات: الكيس الغامض", "sb": "١٨", "ab": "—", "f": ["١. يسمي المجسمات: المكعب، متوازي المستطيلات، الكرة، الأسطوانة، المخروط، الهرم (15 دقيقة)\n٢. يربط المجسمات بأشياء من الحياة (10 دقائق)\nمخرج تعليمي آخر: يتعرف المجسم باللمس دون رؤيته (15 دقيقة)", "المخرج ١: تذكر — يسمي المجسمات: المكعب، متوازي المستطيلات، الكرة، الأسطوانة، المخروط، الهرم.\nالمخرج ٢: فهم — يربط المجسمات بأشياء من الحياة.\nالمخرج الآخر: تحليل — يتعرف المجسم باللمس دون رؤيته.", "التعلم المبني على اللعب، التعلم بالنمذجة، التعلم بالمحسوسات", "الكتاب، السبورة الذكية، نماذج مجسمة، أخرى: كيس غير شفاف، علب فارغة، كرة", "المجسم، المكعب، متوازي المستطيلات، الكرة، الأسطوانة، المخروط، الهرم", "يُخرج المعلم من حقيبته علبة عصير وكرة وعلبة مناديل، ويسأل: «هل هذه أشكال مسطحة مثل الدائرة والمربع؟ ما الفرق؟».", "1. التهيئة: يعرض المعلم الأشياء ويطرح السؤال، والتلاميذ يلاحظون أن لها سمكًا وتُمسك باليد (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أسمي المجسمات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يعرض كل مجسم ويسميه ويربطه بمثال حياتي (المخروط ← قمع الآيس كريم)، والتلاميذ يرددون الأسماء ويذكرون أمثلة (10 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. لعبة الكيس الغامض: يضع المعلم مجسمًا في الكيس ويختار تلميذًا يتحسسه ويصفه، ويصف أحدهم ويخمن الآخرون (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. كتاب: المعلم: يوجه إلى ص١٨ (المجسمات) يسمون المجسمات ويحددون الأشكال المسطحة التي تكوّنها (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.", "١. (مستوى المعرفة) السؤال: ما اسم هذا المجسم؟ (كرة) — الإجابة النموذجية: كرة.\n٢. (مستوى التطبيق) السؤال: اذكر شيئًا في الصف يشبه متوازي المستطيلات. — الإجابة النموذجية: مثل: الكتاب، الخزانة.\n٣. (مستوى الاستدلال) السؤال: تحسست مجسمًا له رأس مدبب وقاعدة دائرية. ما هو؟ — الإجابة النموذجية: المخروط.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم أمام التلميذ مجسمات حقيقية (كرة، علبة عصير أسطوانية، صندوق) ويسمي كل مجسم وهو يتحسسه معه ويطابقه بشيء من الصف، ثم يُسأل: ما اسم هذا المجسم؟ مشيرًا إلى الأسطوانة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة الكيس الغامض: يتحسس أحدهم مجسمًا دون رؤيته ويصفه (أوجه مسطحة، سطح منحنٍ، رأس مدبب) ليخمّن زميله اسمه، ثم يصنفون المجسمات إلى ما يتدحرج وما لا يتدحرج.", "١. (مستوى المعرفة) السؤال: أي المجسمات يشبه علبة المشروب؟ — الإجابة النموذجية: الأسطوانة.\n٢. (مستوى التطبيق) السؤال: سمِّ مجسمًا يشبه حجر النرد. — الإجابة النموذجية: المكعب.\n٣. (مستوى الاستدلال) السؤال: ما الفرق بين المربع والمكعب؟ — الإجابة النموذجية: المربع شكل مسطح، والمكعب مجسم أوجهه مربعات.", "يبحث الطفل في البيت عن أشياء تشبه المجسمات ويسميها، ويراجع كتاب التلميذ ص١٨.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=12"]}, {"num": "٢", "ax": "خصائص المجسمات: الأوجه المسطحة والمنحنية", "sb": "١٨", "ab": "٢٢", "f": ["١. يميز المجسمات ذات الأوجه المسطحة من ذات الأوجه المنحنية (20 دقيقة)\n٢. يتنبأ بالمجسمات التي تتدحرج أو تُرص (5 دقائق)\nمخرج تعليمي آخر: يبني برجًا من المجسمات ويبرر اختيار المجسمات (15 دقيقة)", "المخرج ١: تحليل — يميز المجسمات ذات الأوجه المسطحة من ذات الأوجه المنحنية.\nالمخرج ٢: تطبيق — يتنبأ بالمجسمات التي تتدحرج أو تُرص.\nالمخرج الآخر: إبداع — يبني برجًا من المجسمات ويبرر اختيار المجسمات.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، نماذج مجسمة، أخرى: مجسمات متنوعة، لوح مائل، كتاب النشاط ص٢٢", "وجه مسطح، وجه منحنٍ، يتدحرج، يُرص", "يضع المعلم لوحًا مائلًا ويسأل: «أي هذه المجسمات سيتدحرج إذا وضعناه هنا؟»، ويسجل التوقعات.", "1. التهيئة: يعرض المعلم اللوح المائل ويسجل التوقعات، والتلاميذ يتوقعون (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أصف أوجه المجسمات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التجربة: يختبر المعلم المجسمات على اللوح أمام الصف، والتلاميذ يقارنون النتائج بتوقعاتهم ويفسرون (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تحدي البرج: يطلب المعلم من المجموعات بناء أعلى برج، والتلاميذ يبنون ويكتشفون أن الأوجه المسطحة تُرص (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢٢ (المجسمات)، والتلاميذ يحلون التمارين (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. ختام الدرس – ألغاز المجسمات العمانية: يصف المعلم شيئًا عمانيًا (برج قلعة نزوى، صندوق المندوس، حبة رمان)، فتتسابق المجموعات لتسمية المجسم الذي يشبهه: أسطوانة، متوازي مستطيلات، كرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "١. (مستوى المعرفة) السؤال: هل تتدحرج الكرة؟ لماذا؟ — الإجابة النموذجية: نعم؛ لأن سطحها منحنٍ.\n٢. (مستوى التطبيق) السؤال: أي المجسمين يُرص بسهولة: المكعب أم الكرة؟ — الإجابة النموذجية: المكعب.\n٣. (مستوى الاستدلال) السؤال: الأسطوانة تتدحرج وتُرص. كيف؟ — الإجابة النموذجية: تتدحرج على وجهها المنحني وتُرص على وجهيها المسطحين.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم أمام التلميذ مجسمات حقيقية (كرة، علبة عصير أسطوانية، صندوق) ويسمي كل مجسم وهو يتحسسه معه ويطابقه بشيء من الصف، ثم يُسأل: ما اسم هذا المجسم؟ مشيرًا إلى الأسطوانة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة الكيس الغامض: يتحسس أحدهم مجسمًا دون رؤيته ويصفه (أوجه مسطحة، سطح منحنٍ، رأس مدبب) ليخمّن زميله اسمه، ثم يصنفون المجسمات إلى ما يتدحرج وما لا يتدحرج.", "١. (مستوى المعرفة) السؤال: كم وجهًا للمكعب؟ — الإجابة النموذجية: ٦.\n٢. (مستوى التطبيق) السؤال: سمِّ مجسمًا كل أوجهه مسطحة. — الإجابة النموذجية: المكعب أو متوازي المستطيلات.\n٣. (مستوى الاستدلال) السؤال: لماذا لا نضع الكرة أسفل البرج؟ — الإجابة النموذجية: لأنها تتدحرج ولا تثبت.", "يحل الطفل كتاب النشاط ص٢٢، ويجرب في البيت أي الأشياء تتدحرج وأيها يُرص.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=12"]}]}, {"id": "٦-٣", "title": "التماثل والأنماط", "unit": "الوحدة ٦: الأشكال ثنائية الأبعاد والمجسمات وأنماطها", "u": 6, "week": "الثامن (٢٥ – ٢٩/١٠/٢٠٢٦م)", "tb": "٥٦–٥٨", "periods": [{"num": "١", "ax": "خط التماثل بطي الأشكال", "sb": "٢٠", "ab": "٢٣–٢٤", "f": ["١. يحدد خط التماثل في شكل بالطي (15 دقيقة)\n٢. يميز الأشكال المتماثلة في الحياة (15 دقيقة)\nمخرج تعليمي آخر: يصنع شكلًا متماثلًا بالطي والقص (10 دقائق)", "المخرج ١: تطبيق — يحدد خط التماثل في شكل بالطي.\nالمخرج ٢: فهم — يميز الأشكال المتماثلة في الحياة.\nالمخرج الآخر: إبداع — يصنع شكلًا متماثلًا بالطي والقص.", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، الأقلام، صورة توضيحية، أخرى: ورق مربع، مقصات آمنة، مرآة صغيرة، كتاب النشاط ص٢٣–٢٤", "التماثل، خط التماثل، الطي، متطابق", "يعرض المعلم صورة فراشة وورقة شجر، ويطوي ورقة على شكل فراشة من المنتصف، ويسأل: «ماذا تلاحظون على الجزأين؟».", "1. التهيئة: يعرض المعلم الصور ويطوي الورقة، والتلاميذ يلاحظون تطابق الجزأين (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أجد خط التماثل»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يطوي المعلم مربعًا ويقص شكلًا على خط الطي ثم يفتحه ويحدد خط التماثل، والتلاميذ يتابعون ويسم le": "قياس السعة", "unit": "الوحدة ٨: السعة (١)", "u": 8, "week": "العاشر (٨ – ١٢/١١/٢٠٢٦م)", "tb": "٧٠–٧١", "periods": [{"num": "١", "ax": "مفهوم السعة والمقارنة المباشرة بين الأوعية", "sb": "٢٣", "ab": "—", "f": ["١. يوضح أن السعة هي ما يحمله الوعاء (20 دقيقة)\n٢. يقارن سعة وعاءين بالصب المباشر (5 دقائق)\nمخرج تعليمي آخر: يستخدم مفردات: يحمل أكثر، يحمل أقل، ممتلئ، فارغ (15 دقيقة)", "المخرج ١: فهم — يوضح أن السعة هي ما يحمله الوعاء.\nالمخرج ٢: تطبيق — يقارن سعة وعاءين بالصب المباشر.\nالمخرج الآخر: تذكر — يستخدم مفردات: يحمل أكثر، يحمل أقل، ممتلئ، فارغ.", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم بالمحسوسات", "الكتاب، السبورة الذكية، أخرى: أوعية مختلفة السعة، ماء أو رمل جاف، قمع، دلو", "السعة، يحمل أكثر، يحمل أقل، ممتلئ، فارغ", "يعرض المعلم كوبًا طويلًا ضيقًا وآخر قصيرًا عريضًا، ويسأل: «أيهما يحمل ماءً أكثر؟»، ويسجل التوقعات دون تجريب.", "1. التهيئة: يعرض المعلم الكوبين ويسجل التوقعات، والتلاميذ يتوقعون ويبررون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقارن سعة الأوعية»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التجربة النموذجية: يملأ المعلم الكوب الطويل ويصبه في العريض ليرى هل يفيض، والتلاميذ يلاحظون ويصححون توقعاتهم (10 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. نشاط: المعلم: يوزع أزواج أوعية وماء أو رمل يقارنون بالصب ويحددون الذي يحمل أكثر (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص٢٣ (السعة) ويناقش الصور يحددون الوعاء الأكبر سعة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.", "١. (مستوى المعرفة) السؤال: أي الوعاءين ممتلئ؟ — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: صببنا الكوب (أ) في (ب) ففاض. أيهما يحمل أكثر؟ — الإجابة النموذجية: الكوب (أ).\n٣. (مستوى الاستدلال) السؤال: هل الوعاء الأطول يحمل دائمًا أكثر؟ لماذا؟ — الإجابة النموذجية: لا؛ لأن العرض مهم أيضًا.\n\n• نشاط علاجي (لمن لم يتقن): يصب التلميذ مع المعلم الماء من كوب صغير في كوب كبير فيلاحظ أنه لم يمتلئ، ثم يصب من الكبير في الصغير فيفيض، ويقول: «الكبير يحمل أكثر»، ثم يُسأل: أي الوعاءين فارغ؟ مشيرًا إلى وعاءين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس سعة وعاءين بعدد الأكواب الصغيرة المتماثلة وتسجيل النتيجة، ثم يتنبؤون أيهما يحمل أكثر: وعاء طويل ضيق أم وعاء قصير عريض، ويتحققون بالصب.", "١. (مستوى المعرفة) السؤال: أشر إلى الوعاء الفارغ. — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: أيهما يحمل أكثر: الدلو أم الفنجان؟ — الإجابة النموذجية: الدلو.\n٣. (مستوى الاستدلال) السؤال: صببنا الإبريق في القارورة فلم تمتلئ. ماذا نستنتج؟ — الإجابة النموذجية: القارورة تحمل أكثر من الإبريق.", "يقارن الطفل في البيت سعة أكواب مختلفة بصب الماء من أحدها في الآخر، ويراجع كتاب التلميذ ص٢٣.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=16"]}, {"num": "٢", "ax": "قياس السعة بوحدات غير قياسية: كم عدد الأكواب؟", "sb": "٢٣", "ab": "٢٦", "f": ["١. يقيس سعة وعاء بعدد الأكواب الصغيرة المتماثلة (15 دقيقة)\n٢. يقارن بين سعتين بعدد الأكواب (15 دقيقة)\nمخرج تعليمي آخر: يقدّر عدد الأكواب قبل القياس (10 دقائق)", "المخرج ١: تطبيق — يقيس سعة وعاء بعدد الأكواب الصغيرة المتماثلة.\nالمخرج ٢: تحليل — يقارن بين سعتين بعدد الأكواب.\nالمخرج الآخر: تقييم — يقدّر عدد الأكواب قبل القياس.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: أكواب صغيرة متماثلة، أوعية مختلفة، ماء، كتاب النشاط ص٢٦", "السعة، كوب، وحدة القياس، التقدير", "يسأل المعلم: «كم كوب ماء نحتاج لملء هذا الإبريق؟»، ويطلب كتابة التقديرات على السبورات الصغيرة.", "1. التهيئة: يعرض المعلم الإبريق ويجمع التقديرات، والتلاميذ يقدّرون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقيس السعة بالأكواب»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النمذجة: يملأ المعلم الإبريق كوبًا كوبًا والتلاميذ يعدّون، ويؤكد ملء الكوب إلى حافته، والتلاميذ يعدّون الأكواب (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. نشاط: المعلم: يوزع أوعية مختلفة وأكوابًا متماثلة يقدّرون ثم يقيسون ويسجلون عدد الأكواب (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢٦ (كم عدد الأكواب؟)، والتلاميذ يحلون التمارين (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "١. (مستوى المعرفة) السؤال: ملأنا الوعاء بـ ٤ أكواب. ما سعته بالأكواب؟ — الإجابة النموذجية: ٤ أكواب.\n٢. (مستوى التطبيق) السؤال: لماذا يجب ملء الكوب إلى حافته كل مرة؟ — الإجابة النموذجية: ليكون القياس دقيقًا.\n٣. (مستوى الاستدلال) السؤال: وعاء (أ) ٦ أكواب ووعاء (ب) ٩. أيهما يحمل أكثر؟ وبكم؟ — الإجابة النموذجية: (ب) بثلاثة أكواب.\n\n• نشاط علاجي (لمن لم يتقن): يصب التلميذ مع المعلم الماء من كوب صغير في كوب كبير فيلاحظ أنه لم يمتلئ، ثم يصب من الكبير في الصغير فيفيض، ويقول: «الكبير يحمل أكثر»، ثم يُسأل: أي الوعاءين فارغ؟ مشيرًا إلى وعاءين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس سعة وعاءين بعدد الأكواب الصغيرة المتماثلة وتسجيل النتيجة، ثم يتنبؤون أيهما يحمل أكثر: وعاء طويل ضيق أم وعاء قصير عريض، ويتحققون بالصب.", "١. (مستوى المعرفة) السؤال: كم كوبًا يملأ القارورة (حسب التجربة)؟ — الإجابة النموذجية: حسب القياس.\n٢. (مستوى التطبيق) السؤال: وعاء سعته ٥ أكواب وآخر ٣. أيهما أقل سعة؟ — الإجابة النموذجية: الذي سعته ٣.\n٣. (مستوى الاستدلال) السؤال: قاست مريم بأكواب كبيرة وسعيد بأكواب صغيرة الوعاء نفسه. من سيحصل على عدد أكبر؟ — الإجابة النموذجية: سعيد.", "يحل الطفل كتاب النشاط ص٢٦، ويقيس سعة وعاء في المطبخ بعدد الأكواب مع أسرته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=16"]}, {"num": "٣", "ax": "ترتيب الأوعية حسب السعة وحل مشكلات", "sb": "٢٣", "ab": "٢٦", "f": ["١. يرتب ثلاثة أوعية حسب سعتها (15 دقيقة)\n٢. يحل مشكلة بسيطة تتعلق بالسعة (5 دقائق)\nمخرج تعليمي آخر: يبرر الترتيب بنتائج القياس (20 دقيقة)", "المخرج ١: تطبيق — يرتب ثلاثة أوعية حسب سعتها.\nالمخرج ٢: تحليل — يحل مشكلة بسيطة تتعلق بالسعة.\nالمخرج الآخر: تقييم — يبرر الترتيب بنتائج القياس.", "ا  "الترتيب، السعة، الأكثر، الأقل", "يعرض المعلم صور قنينة ماء وإبريق ودلو وفنجان، ويطلب من التلاميذ الوقوف في صف بحسب ترتيب الصور التي يحملونها من الأقل سعة.", "1. التهيئة: يوزع المعلم الصور وينظم الترتيب، والتلاميذ يرتبون أنفسهم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أرتب السعات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. كتاب: المعلم: يوجه إلى ص٢٤ (ترتيب السعات) يرتبون الأوعية المرسومة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تطبيق عملي: يعرض المعلم ثلاثة أوعية حقيقية للتقدير ثم التحقق، والتلاميذ يقدّرون ويتحققون بالصب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «قدّرت أن الكوب يملأ القارورة، لكنه لم يملأها. ماذا تستنتج» على السبورة، ويناقش المعلم الإجابات مع الصف (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يلخص المعلم مفردات الوحدة، والتلاميذ يذكرون المفردات (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. ختام الدرس – فنجان القهوة العمانية: يمثل الأزواج تقديم القهوة العمانية للضيف، فيشير أحدهما إلى مستوى في فنجان مرسوم ويصفه زميله: ممتلئ، نصف ممتلئ، تقريبًا فارغ، مع تحية الضيف واحترام الكبير (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "١. (مستوى المعرفة) السؤال: أيهما أقل سعة: الفنجان أم الإبريق؟ — الإجابة النموذجية: الفنجان.\n٢. (مستوى التطبيق) السؤال: رتّب: دلو، كوب، قنينة من الأقل. — الإجابة النموذجية: كوب، قنينة، دلو.\n٣. (مستوى الاستدلال) السؤال: وعاء يحمل أكثر من (أ) وأقل من (ب). أين تضعه في الترتيب؟ — الإجابة النموذجية: بين (أ) و(ب).\n\n• نشاط علاجي (لمن لم يتقن): يملأ المعلم أمام التلميذ أربعة أوعية شفافة بالأرز بمستويات مختلفة، ويسمي معه كل حالة: ممتلئ، تقريبًا ممتلئ، تقريبًا فارغ، فارغ، ثم يطلب منه أن يشير إلى الوعاء الذي هو تقريبًا فارغ.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب ثلاثة أوعية من الأقل إلى الأكثر سعة بالتقدير ثم التحقق بالصب، ثم يملأ كل منهم وعاءً إلى نصفه ويشرح كيف عرف أنه نصف ممتلئ.", "١. (مستوى المعرفة) السؤال: أشر إلى الوعاء الأكثر سعة. — الإجابة النموذجية: حسب الصورة. ون أطعمة لقائمتهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "١. (مستوى المعرفة) السؤال: سمِّ ثلاثة أطعمة في الصورة. — الإجابة النموذجية: مثل: تمر، فاكهة، شطيرة.\n٢. (مستوى التطبيق) السؤال: كم مشروبًا في مجموعتك؟ — الإجابة النموذجية: حسب المجموعة.\n٣. (مستوى الاستدلال) السؤال: لماذا نضع الماء في قائمة المطعم؟ — الإجابة النموذجية: لأنه مشروب صحي ضروري.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ بطاقات مصورة لأطعمة ومشروبات، ويفرزها معه في سلتين: أطعمة ومشروبات، ثم يعدّان ما في كل سلة، ثم يُسأل: في أي سلة نضع الحليب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بسؤال ٥ من زملائهم عن مشروبهم المفضل وتسجيل الإجابات بعلامات العد، ثم يقترحون وجبة صحية لمطعم المدرسة ويبررون اختيارهم بناءً على ما جمعوه.", "١. (مستوى المعرفة) السؤال: صنّف: موز، ماء، شطيرة. — الإجابة النموذجية: فاكهة، مشروب، طعام.\n٢. (مستوى التطبيق) السؤال: اختر طعامًا ومشروبًا لوجبة. — الإجابة النموذجية: اختيار مناسب.\n٣. (مستوى الاستدلال) السؤال: لماذا تختلف قوائم الطعام بين المجموعات؟ — الإجابة النموذجية: لأن كل مجموعة اختارت حسب تفضيلها.", "يتحدث الطفل مع أسرته عن الأطعمة الصحية المناسبة لمطعم المدرسة، ويحل كتاب النشاط ص٢٨.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=18"]}, {"num": "٢", "ax": "جمع تفضيلات الصف وتصميم قائمة الطعام", "sb": "٢٥", "ab": "٢٨", "f": ["١. يجمع معلومات بسيطة عن تفضيلات زملائه بعلامات العد أو المكعبات (10 دقائق)\n٢. يحدد الطعام الأكثر تفضيلًا من البيانات (10 دقائق)\nمخرج تعليمي آخر: يصمم قائمة طعام بأشكال هندسية مختلفة (20 دقيقة)", "المخرج ١: تطبيق — يجمع معلومات بسيطة عن تفضيلات زملائه بعلامات العد أو المكعبات.\nالمخرج ٢: تحليل — يحدد الطعام الأكثر تفضيلًا من البيانات.\nالمخرج الآخر: إبداع — يصمم قائمة طعام بأشكال هندسية مختلفة.", "التعلم المبني على المشاريع، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: مكعبات متشابكة، ورق ملون بأشكال هندسية", "التصويت، الأكثر، الأقل، البيانات", "يعرض المعلم صور أربعة أطعمة ويسأل: «أي طعام تفضّل؟»، ويضع كل تلميذ مكعبًا فوق صورة الطعام الذي يفضله.", "1. التهيئة: ينظم المعلم التصويت بالمكعبات، والتلاميذ يصوتون بوضع المكعبات (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أجمع البيانات وأقرأها»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. قراءة البيانات: يضم المعلم المكعبات في أبراج ويسأل: «أي برج أطول؟ ماذا يعني ذلك؟»، والتلاميذ يقارنون الأبراج ويحددون الأكثر والأقل (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تصميم القائمة: يوزع المعلم أوراقًا بأشكال (دائرة، مستطيل، مربع)، والتلاميذ يصممون قائمة طعام تضم الأطعمة الأكثر تفضيلًا (11 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. عرض: يعرض بعض القوائم، والتلاميذ يصفون شكل القائمة ومحتواها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. ختام الدرس – مائدة عمانية: تصنف المجموعات بطاقات أو رسومًا لأطعمة ومشروبات عمانية (عرسية، هريس، تمر، لبن، قهوة، ماء) إلى طعام وشراب، وتختار وجبة صحية وتعد عناصرها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: أي برج هو الأطول؟ — الإجابة النموذجية: حسب البيانات.\n٢. (مستوى التطبيق) السؤال: كم تلميذًا فضّل التمر؟ — الإجابة النموذجية: حسب البرج.\n٣. (مستوى الاستدلال) السؤال: بكم يزيد برج العصير عن برج الحليب؟ — الإجابة النموذجية: حسب البيانات.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ بطاقات مصورة لأطعمة ومشروبات، ويفرزها معه في سلتين: أطعمة ومشروبات، ثم يعدّان ما في كل سلة، ثم يُسأل: في أي سلة نضع الحليب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بسؤال ٥ من زملائهم عن مشروبهم المفضل وتسجيل الإجابات بعلامات العد، ثم يقترحون وجبة صحية لمطعم المدرسة ويبررون اختيارهم بناءً على ما جمعوه.", "١. (مستوى المعرفة) السؤال: ما الطعام الأقل تفضيلًا؟ — الإجابة النموذجية: حسب البيانات.\n٢. (مستوى التطبيق) السؤال: ما شكل القائمة التي صممتها؟ — الإجابة النموذجية: مثل: مستطيل.\n٣. (مستوى الاستدلال) السؤال: لو أضفنا ٣ أصوات للطعام الأقل، هل يتغير الترتيب؟ — الإجابة النموذجية: حسب البيانات مع تبرير.", "يسأل الطفل أفراد أسرته عن أطعمتهم المفضلة ويسجل الإجابات بعلامات بسيطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=18"]}]}, {"id": "٩-٢", "title": "النقود", "unit": "الوحدة ٩: النقود والوقت", "u": 9, "week": "الحادي عشر (١٥ – ١٩/١١/٢٠٢٦م)", "tb": "٧٨–٧٩، ٨٧", "periods": [{"num": "١", "ax": "التعرف على الأوراق النقدية العمانية", "sb": "٢٦", "ab": "—", "f": ["١. يتعرف الأوراق النقدية: ريال، ٥ ريالات، ١٠ ريالات (10 دقائق)\n٢. يعد مجموع أوراق نقدية من فئة الريال حتى ١٠ (10 دقائق)\nمخرج تعليمي آخر: يوضح أن ورقة ٥ ريالات تساوي ٥ أوراق من فئة الريال (20 دقيقة)", "المخرج ١: تذكر — يتعرف الأوراق النقدية: ريال، ٥ ريالات، ١٠ ريالات.\nالمخرج ٢: تطبيق — يعد مجموع أوراق نقدية من فئة الريال حتى ١٠.\nالمخرج الآخر: فهم — يوضح أن ورقة ٥ ريالات تساوي ٥ أوراق من فئة الريال.", "التعلم بالنمذجة، التعلم المبني على اللعب، لعب الأدوار", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: نماذج أوراق نقدية عمانية تعليمية (ريال، ٥، ١٠)", "النقود، الريال العماني، ورقة نقدية، قيمة", "يعرض المعلم محفظة ويخرج منها ورقة ١٠ ريالات وورقة ريال، ويسأل: «أيهما تشتري بها أشياء أكثر؟ لماذا؟».", "1. التهيئة: يعرض المعلم المحفظة ويطرح السؤال، والتلاميذ يجيبون ويبررون (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أتعرف الريالات العمانية»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. النمذجة: يعرض كل ورقة ويقرأ قيمتها ويوضح أن ٥ أوراق ريال تساوي ورقة ٥ ريالات، والتلاميذ يقرؤون القيم ويعدّون (10 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n4. نشاط ثنائي: يوزع المعلم نماذج أوراق نقدية، والتلاميذ يفرزون الأوراق حسب قيمتها ويعدّون أوراق الريال (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. كتاب: المعلم: يوجه إلى ص٢٦ (ما الثمن؟) ويناقش أسعار الأطعمة يقرؤون الأسعار ويحددون الأغلى والأرخص (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الختام: يطرح المعلم أسئلة التق  عن وزن الكرة؟ — الإجابة النموذجية: يساوي وزن المكعبات.", "يصنع الطفل ميزانًا بسيطًا من علاقة ملابس وكيسين، ويقارن أوزان أشياء، ويراجع كتاب التلميذ ص٣١.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=23"]}, {"num": "٢", "ax": "موازنة الأشياء بالمكعبات: خمسة مكعبات", "sb": "٣١", "ab": "٣٥", "f": ["١. يجد عدد المكعبات التي توازن شيئًا (20 دقيقة)\n٢. يقارن وزن شيئين بعدد المكعبات (5 دقائق)\nمخرج تعليمي آخر: يصنع نموذجين متوازنين من المكعبات (15 دقيقة)", "المخرج ١: تطبيق — يجد عدد المكعبات التي توازن شيئًا.\nالمخرج ٢: تحليل — يقارن وزن شيئين بعدد المكعبات.\nالمخرج الآخر: إبداع — يصنع نموذجين متوازنين من المكعبات.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، نماذج مجسمة، أخرى: موازين، مكعبات متماثلة، نسخة المكعبات الخمسة (دليل المعلم ص١٠٠)، كتاب النشاط ص٣٥", "يوازن، المكعبات، عدد المكعبات، متوازن", "يضع المعلم حذاءً في كفة ويسأل: «كم مكعبًا نحتاج في الكفة الأخرى حتى يتوازن الميزان؟».", "1. التهيئة: يعرض المعلم الحذاء في الميزان، والتلاميذ يقدّرون عدد المكعبات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أوازن الأشياء بالمكعبات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النمذجة: يضيف المعلم المكعبات واحدًا واحدًا حتى التوازن ويعدّ، والتلاميذ يعدّون معه (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. نشاط: المعلم: يوزع أشياء ومكعبات يجدون عدد المكعبات الموازنة لكل شيء ويسجلون (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٣٥ (خمسة مكعبات)، والتلاميذ يحلون المهمة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "١. (مستوى المعرفة) السؤال: كم مكعبًا وازن القلم؟ — الإجابة النموذجية: حسب التجربة.\n٢. (مستوى التطبيق) السؤال: الكرة وازنت ٨ مكعبات والتفاحة ٥. أيهما أثقل؟ — الإجابة النموذجية: الكرة.\n٣. (مستوى الاستدلال) السؤال: كم مكعبًا يزيد  — الإجابة النموذجية: فردي.\n٢. (مستوى التطبيق) السؤال: اكتب عددين زوجيين بين ٢٠ و٣٠. — الإجابة النموذجية: مثل ٢٢، ٢٤.\n٣. (مستوى الاستدلال) السؤال: مع ليلى ٩ قطع حلوى تريد تقسيمها مع أختها بالتساوي. هل يمكن ذلك دون باقٍ؟ — الإجابة النموذجية: لا؛ ٩ عدد فردي.", "يصنف الطفل أعدادًا يراها في البيت (أرقام الصفحات، الساعة) إلى زوجية وفردية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=25"]}]}, {"id": "١٢-١", "title": "ترتيب الأعداد", "unit": "الوحدة ١٢: ترتيب الأعداد (١)", "u": 12, "week": "الثالث عشر (٢٩/١١ – ٣/١٢/٢٠٢٦م)", "tb": "١١٠–١١٣، ١١٦", "periods": [{"num": "١", "ax": "الأعداد الترتيبية: الأول، الثاني، ... العاشر", "sb": "٣٥", "ab": "—", "f": ["١. يستخدم الأعداد الترتيبية من الأول إلى العاشر (15 دقيقة)\n٢. يحدد موقع شخص أو شيء في صف باستخدام العدد الترتيبي (10 دقائق)\nمخرج تعليمي آخر: يميز العدد الترتيبي من العدد الأصلي (15 دقيقة)", "المخرج ١: تذكر — يستخدم الأعداد الترتيبية من الأول إلى العاشر.\nالمخرج ٢: تطبيق — يحدد موقع شخص أو شيء في صف باستخدام العدد الترتيبي.\nالمخرج الآخر: فهم — يميز العدد الترتيبي من العدد الأصلي.", "التعلم بالنمذجة، التعلم المبني على اللعب، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: بطاقات الترتيب (كتاب النشاط ص٦٣–٦٥)، تقويم", "الأول، الثاني، الثالث، العاشر، الأخير، الترتيب", "يُجري المعلم سباقًا قصيرًا في المشي بين خمسة تلاميذ، ويسأل: «من وصل أولًا؟ من الثاني؟ من الأخير؟».", "1. التهيئة: ينفذ المعلم السباق ويسأل عن الترتيب، والتلاميذ يذكرون الترتيب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أستخدم الأعداد الترتيبية»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. النمذجة: يصف المعلم ١٠ تلاميذ في طابور ويعلق على كل منهم بطاقة ترتيبية، والتلاميذ يقرؤون البطاقات: الأول ... العاشر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة الطابور: يعطي المعلم تعليمات: «الرابع يرفع يده، السابع يقفز»، والتلاميذ ينفذون حسب مواقعهم (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تطبيق: يعرض المعلم صفًا من الصور ويطرح أسئلة الترتيب، والتلاميذ يحددون مواقع الصور (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: من الأول في الطابور؟ — الإجابة النموذجية: تحديد صحيح.\n٢. (مستوى التطبيق) السؤال: ما ترتيب التلميذ الذي يقف بعد الثالث؟ — الإجابة النموذجية: الرابع.\n٣. (مستوى الاستدلال) السؤال: في طابور من ٨، من هو الأخير؟ ما ترتيبه؟ — الإجابة النموذجية: الثامن.\n\n• نشاط علاجي (لمن لم يتقن): يصطف خمسة تلاميذ أمام الصف ويعطي المعلم كلًا منهم بطاقة (الأول، الثاني، الثالث، الرابع، الخامس) ويقرأها التلميذ مع المعلم مشيرًا إلى كل واحد، ثم يُسأل: من يقف في الترتيب الثالث؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإكمال نمط خرز (أحمر، أزرق، أحمر، ...) حتى الخرزة العاشرة وتحديد لون الخرزة السابعة والعاشرة، ثم يشرحون الفرق بين «٧ خرزات» و«الخرزة السابعة».", "١. (مستوى المعرفة) السؤال: أشر إلى الحيوان الثاني. — الإجابة النموذجية: تحديد صحيح.\n٢. (مستوى التطبيق) السؤال: ما ترتيب يوم الاثنين إذا بدأ الأسبوع بالأحد؟ — الإجابة النموذجية: الثاني.\n٣. (مستوى الاستدلال) السؤال: كم شخصًا قبل الخامس في الطابور؟ — الإجابة النموذجية: ٤.", "يستخدم الطفل الأعداد الترتيبية في البيت (أول من يستيقظ، ثاني طبق...) ويراجع كتاب التلميذ ص٣٥.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=26"]}, {"num": "٢", "ax": "الأعداد بالترتيب: أنماط الخرز", "sb": "٣٥", "ab": "٤٠", "f": ["١. يكمل نمط خرز ويحدد لون خرزة في موقع ترتيبي (15 دقيقة)\n٢. يصف موقع الخرزة بالعدد الترتيبي (5 دقائق)\nمخرج تعليمي آخر: يصمم سلسلة خرز بنمط ويطرح سؤالًا ترتيبيًا عليها (20 دقيقة)", "المخرج ١: تحليل — يكمل نمط خرز ويحدد لون خرزة في موقع ترتيبي.\nالمخرج ٢: تطبيق — يصف موقع الخرزة بالعدد الترتيبي.\nالمخرج الآخر: إبداع — يصمم سلسلة خرز بنمط ويطرح سؤالًا ترتيبيًا عليها.", "التعلم بالاكتشاف، التعلم المبني على المشاريع، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، أخرى: خرز ملون وخيوط، مكعبات ملونة، كتاب النشاط ص٤٠", "النمط، الخرزة الخامسة، الترتيب، يتكرر", "يعرض المعلم سلسلة خرز: أحمر، أزرق، أحمر، أزرق... ويسأل: «ما لون الخرزة السادسة؟ كيف عرفت؟».", "1. التهيئة: يعرض المعلم السلسلة ويطرح السؤال، والتلاميذ يجيبون ويبررون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أحدد موقع الخرزة في النمط»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. كتاب: المعلم: يوجه إلى ص٣٥ (الأعداد بالترتيب) ويساعد في رسم السلاسل يكملون السلاسل ويحددون لون الخرزة المطلوبة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تصميم السلسلة: يوزع المعلم الخرز والخيوط، ويصمم كل تلميذ سلسلة بنمط ويسأل زميله عن الخرزة الثامنة مثلًا (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٤٠ (الترتيب)، والتلاميذ يحلون التمارين (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: ما لون الخرزة الثالثة في: أحمر، أصفر، أحمر، أصفر؟ — الإجابة النموذجية: أحمر.\n٢. (مستوى التطبيق) السؤال: ما لون الخرزة العاشرة في النمط نفسه؟ — الإجابة النموذجية: أصفر.\n٣. (مستوى الاستدلال) السؤال: في نمط أحمر، أحمر، أزرق: ما لون التاسعة؟ — الإجابة النموذجية: أزرق.\n\n• نشاط علاجي (لمن لم يتقن): يصطف خمسة تلاميذ أمام الصف ويعطي المعلم كلًا منهم بطاقة (الأول، الثاني، الثالث، الرابع، الخامس) ويقرأها التلميذ مع المعلم مشيرًا إلى كل واحد، ثم يُسأل: من يقف في الترتيب الثالث؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإكمال نمط خرز (أحمر، أزرق، أحمر، ...) حتى الخرزة العاشرة وتحديد لون الخرزة السابعة والعاشرة، ثم يشرحون الفرق بين «٧ خرزات» و«الخرزة السابعة».", "١. (مستوى المعرفة) السؤال: لوّن الخرزة الخامسة باللون الأخضر. — الإجابة النموذجية: تلوين صحيح.\n٢. (مستوى التطبيق) السؤال: ما ترتيب أول خرزة زرقاء في: أحمر، أحمر، أزرق؟ — الإجابة النموذجية: الثالثة.\n٣. (مستوى الاستدلال) السؤال: صمّم نمطًا تكون فيه الخرزة السادسة صفراء. — الإجابة النموذجية: تصميم صحيح.", "يحل الطفل كتاب النشاط ص٤٠، ويصمم سلسلة خرز أو أزرار بنمط مع أسرته.\n🎮 رابط أل  المكعبات، والتلاميذ يقرؤون مع المعلم جماعيًا ثم فرديًا، ويعدّون المكعبات تحت كل رقم (6 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. نشاط ثنائي: يوزع المعلم بطاقات الأرقام ١–١٠ ومواد العد على كل ثنائي ويتابع المطابقة، ويختار أحدهما بطاقة ويقرؤها، ويضع الآخر الكمية المطابقة ثم يتبادلان (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. كتاب: المعلم: يوجه التلاميذ إلى ص٤–٥ ويسأل: «أين ترى العدد ٣؟ كم فيلًا في الصورة؟» يقرؤون الأعداد ويعدّون الأشياء المرسومة ويشيرون إلى الرقم المطابق (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. عرض الهدف: يعرض المعلم: «أستطيع أن أكتب الأرقام من ١ إلى ٥»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n7. النمذجة: يكتب كل رقم على السبورة الذكية خطوة خطوة مع وصف لفظي لحركة القلم ويبيّن نقطة البداية، والتلاميذ يتتبعون الحركة بأصابعهم في الهواء ثم على أطباق الرمل (6 دقائق)\nالاستراتيجيات: التعلم الحسي الحركي.\n\n8. نشاط المحطات: ينظم المعلم ثلاث محطات: رمل، صلصال، سبورة صغيرة، ويتنقل للتصحيح، والتلاميذ يكتبون الأرقام ١–٥ في كل محطة ويعدّون بجانب كل رقم أشياء مطابقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. كتاب النشاط: يوجّه التلاميذ إلى كتاب النشاط ص٩ (التدريب العددي) ويتابع اتجاه الكتابة، والتلاميذ يتتبعون الأرقام المنقطة ثم يكتبونها مستقلين (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. الختام: يملي المعلم أرقامًا ويطلب كتابتها على السبورات الصغيرة، والتلاميذ يكتبون ويرفعون السبورات (3 دقائق)\nالاستراتيجيات: التعلم الحسي الحركي.", "١. (مستوى المعرفة) السؤال: أشر إلى العدد ٤ على شريط الأعداد. — الإجابة النموذجية: يشير التلميذ إلى الرقم ٤.\n٢. (مستوى التطبيق) السؤال: ضع تحت الرقم ٧ عددًا مناسبًا من المكعبات. — الإجابة النموذجية: ٧ مكعبات.\n٣. (مستوى الاستدلال) السؤال: أي العددين يأتي أولًا عند العد: ٩ أم ٦؟ ولماذا؟ — الإجابة النموذجية: ٦؛ لأنه يأتي قبل ٩ عند العد من ١.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قراءة الأعداد من ١ إلى ١٠ على شريط الأعداد مشيرًا بإصبعه، ويضع تحت كل بطاقة عدد مكعبات مماثلًا بالعد معه، ثم يطلب منه أن يشير إلى العدد ٣ ويضع تحته ٣ مكعبات.\n• نشاط إثرائي (للمت  نعم، ٦.\n٣. (مستوى الاستدلال) السؤال: قطعة ٢ و٤: لماذا ليست ضعفًا؟ — الإجابة النموذجية: لأن الجزأين غير متساويين.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم أمام التلميذ مكعبين ثم يضع مثلهما تمامًا، ويعدّان معًا المجموع (٤)، ويكرر ذلك بأصابع اليدين للعدد ٣، ثم يسأله: ما ضعف ٤؟ (٨).\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإيجاد قطع الدومينو التي على جانبيها النقاط نفسها وكتابة ضعف كل منها حتى ضعف ٥، ثم يجيبون: هل يمكن أن يكون ضعف عدد ما هو ٧؟ ويتحققون بالمكعبات.", "١. (مستوى المعرفة) السؤال: ضعف ١ = ... — الإجابة النموذجية: ٢.\n٢. (مستوى التطبيق) السؤال: ارسم قطعة دومينو تمثل ضعف ٥. — الإجابة النموذجية: ٥ نقاط و٥ نقاط = ١٠.\n٣. (مستوى الاستدلال) السؤال: مجموع ضعفٍ يساوي ٦. ما العدد؟ — الإجابة النموذجية: ٣.", "يحل الطفل كتاب النشاط ص١٤، ويلعب مع أسرته لعبة أضعاف الأصابع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=5"]}]}, {"id": "٣-١", "title": "قياس الطول", "unit": "الوحدة ٣: الطول", "u": 3, "week": "السادس (١١ – ١٥/١٠/٢٠٢٦م)", "tb": "٢٢–٢٤", "periods": [{"num": "١", "ax": "مقارنة الأطوال والارتفاعات مقارنة مباشرة", "sb": "١١", "ab": "—", "f": ["١. يقارن بين طولين أو ارتفاعين مقارنة مباشرة (10 دقائق)\n٢. يستخدم مفردات: أطول، أقصر، أعلى، أكثر انخفاضًا (15 دقيقة)\nمخرج تعليمي آخر: يرتب ثلاثة أشياء من الأقصر إلى الأطول (15 دقيقة)", "المخرج ١: فهم — يقارن بين طولين أو ارتفاعين مقارنة مباشرة.\nالمخرج ٢: تذكر — يستخدم مفردات: أطول، أقصر، أعلى، أكثر انخفاضًا.\nالمخرج الآخر: تطبيق — يرتب ثلاثة أشياء من الأقصر إلى الأطول.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم بالمحسوسات", "الكتاب، السبورة الذكية، أخرى: أقلام وأشرطة بأطوال مختلفة، مكعبات متشابكة", "الطول، الارتفاع، أطول، أقصر، أعلى، نقطة البداية", "يطلب المعلم من تلميذين الوقوف ظهرًا لظهر، ويسأل: «من الأطول؟ كيف نتأكد؟»، ويلفت الانتباه إلى الوقوف على الأرض نفسها.", "1. التهيئة: ينفذ المعلم موقف المقارنة بين تلميذين، والتلاميذ يقارنون ويقترحون طريقة التأكد (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقارن الأطوال»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النمذجة: يقارن المعلم قلمين بوضعهما على خط بداية واحد ويستخدم المفردات، والتلاميذ يرددون: «هذا القلم أطول من ذلك» (8 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. نشاط: المعلم: يوزع أشياء مختلفة الأطوال على المجموعات يقارنون ويرتبون من الأقصر إلى الأطول ويصفون بالمفردات (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص١١ (الطول) ويناقش الصور يحددون الأطول والأقصر والأعلى في الصور (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون ويبررون (4 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.", "١. (مستوى المعرفة) السؤال: أي القلمين أطول؟ (قلمان ظاهران) — الإجابة النموذجية: تحديد الأطول بالمقارنة.\n٢. (مستوى التطبيق) السؤال: لماذا نضع الشيئين على خط بداية واحد؟ — الإجابة النموذجية: لتكون المقارنة عادلة.\n٣. (مستوى الاستدلال) السؤال: رتّب ثلاثة أشرطة من الأقصر إلى الأطول. — الإجابة النموذجية: ترتيب صحيح حسب الأشرطة.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم مع التلميذ قلمين على خط بداية واحد مرسوم على الطاولة ويقارنان طرفيهما ليحدد الأطول والأقصر، ثم يُسأل التلميذ: أي الشريطين أقصر؟ بعد أن يضعهما بنفسه على خط البداية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس طول كتاب وطول دفتر بعدد المكعبات المتماثلة، ثم يرتبون ثلاثة أشياء من الأقصر إلى الأطول ويشرحون لماذا يجب أن تكون المكعبات متماثلة ومتلاصقة.", "١. (مستوى المعرفة) السؤال: أشر إلى الشيء الأطول في الصورة. — الإجابة النموذجية: حسب الصورة.\n٢. (مستوى التطبيق) السؤال: أيهما أعلى: النخلة أم الطاولة؟ — الإجابة النموذجية: النخلة.\n٣. (مستوى الاستدلال) السؤال: القلم الأحمر أطول من الأزرق، والأزرق أطول من الأخضر. أيها الأقصر؟ — الإجابة النموذجية: الأخضر.", "يقارن الطفل أطوال أشياء في البيت (ملعقة وشوكة، قلمين) ويستخدم كلمات أطول وأقصر، ويراجع كتاب التلميذ ص١١.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=6"]}, {"num": "٢", "ax": "القياس بوحدات غير قياسية: بصمة القدم العملاقة", "sb": "١٠", "ab": "—", "f": ["١. يقيس طول شيء بوحدات غير قياسية متماثلة (مكعبات، أقدام) (20 دقيقة)\n٢. يعبّر عن الطول بعدد الوحدات (5 دقائق)\nمخرج تعليمي آخر: يقدّر الطول بالوحدات قبل القياس ثم يتحقق (15 دقيقة)", "المخرج ١: تطبيق — يقيس طول شيء بوحدات غير قياسية متماثلة (مكعبات، أقدام).\nالمخرج ٢: فهم — يعبّر عن الطول بعدد الوحدات.\nالمخرج الآخر: تقييم — يقدّر الطول بالوحدات قبل القياس ثم يتحقق.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، الأقلام، أخرى: بصمة قدم كبيرة من الورق، مكعبات متشابكة، ورق A4", "القياس، وحدة، طول بصمة القدم، تقدير", "يدخل المعلم ببصمة قدم عملاقة من الورق ويقول: «وجدنا هذه البصمة في ساحة المدرسة! كم هي أطول من أقدامنا؟».", "1. التهيئة: يعرض المعلم البصمة العملاقة ويثير التساؤل، والتلاميذ يقارنون أقدامهم بها (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقيس الطول بالمكعبات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. النمذجة: يقيس المعلم البصمة بمكعبات متلاصقة بلا فراغات ويعدّها، والتلاميذ يعدّون المكعبات مع المعلم (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. نشاط: المعلم: يوزع أوراقًا لرسم بصمات أقدام التلاميذ ومكعبات للقياس يقدّرون ثم يقيسون بصماتهم ويسجلون عدد المكعبات (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص١٠ (بصمة قدم عملاقة) ويناقش يجيبون عن أسئلة الصفحة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يقارن المعلم أطول وأقصر بصمة في الصف، والتلاميذ يذكرون نتائجهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "١. (مستوى المعرفة) السؤال: كم مكعبًا طول هذا القلم (٥ مكعبات)؟ — الإجابة النموذجية: ٥.\n٢. (مستوى التطبيق) السؤال: لماذا يجب ألا نترك فراغات بين المكعبات؟ — الإجابة النموذجية: حتى يكون القياس صحيحًا.\n٣. (مستوى الاستدلال) السؤال: قدّرت ٨ مكعبات وكان القياس ١٠. هل تقديرك قريب؟ — الإجابة النموذجية: نعم قريب، الفرق مكعبان.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم مع التلميذ قلمين على خط بداية واحد مرسوم على الطاولة ويقارنان طرفيهما ليحدد الأطول والأقصر، ثم يُسأل التلميذ: أي الشريطين أقصر؟ بعد أن يضعهما بنفسه على خط البداية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس طول كتاب وطول دفتر بعدد المكعبات المتماثلة، ثم يرتبون ثلاثة أشياء من الأقصر إلى الأطول ويشرحون لماذا يجب أن تكون المكعبات متماثلة ومتلاصقة.", "١. (مستوى المعرفة) السؤال: قِس طول الكتاب بالمكعبات. — الإجابة النموذجية: حسب القياس.\n٢. (مستوى التطبيق) السؤال: قلم طوله ٦ مكعبات وآخر ٩. أيهما أطول؟ — الإجابة النموذجية: الذي طوله ٩.\n٣. (مستوى الاستدلال) السؤال: قاس أحمد الطاولة بالأقلام وقاسها خالد بالمكعبات فاختلف العدد. لماذا؟ — الإجابة النموذجية: لأن الوحدة مختلفة.", "يقيس الطفل أشياء في البيت بوحدات بسيطة (ملاعق، مشابك) ويسجل النتيجة، ويراجع كتاب التلميذ ص١٠.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=6"]}, {"num": "٣", "ax": "تطبيقات على الطول: دودة الصلصال والثعابين", "sb": "١٠–١١", "ab": "١٥–١٦", "f": ["١. يصنع أشياء بأطوال محددة ويقارن بينها (10 دقائق)\n٢. يرتب أشياء حسب الطول (5 دقائق)\nمخرج تعليمي آخر: يصنع دودة صلصال أطول من دودة زميله وأقصر من أخرى (25 دقيقة)", "المخرج ١: تطبيق — يصنع أشياء بأطوال محددة ويقارن بينها.\nالمخرج ٢: تطبيق — يرتب أشياء حسب الطول.\nالمخرج الآخر: إبداع — يصنع دودة صلصال أطول من دودة زميله وأقصر من أخرى.", "التعلم المبني على اللعب، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: صلصال، كتاب النشاط ص١٥–١٦", "أطول، أقصر، الترتيب، الطول", "يشكّل المعلم دودتين من الصلصال بطولين مختلفين ويسأل: «أيهما أطول؟ كيف أصنع دودة بينهما في الطول؟».", "1. التهيئة: يعرض المعلم دودتي الصلصال ويطرح التحدي، والتلاميذ يقترحون أفكارًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أصنع وأرتب أطوالًا مختلفة»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط الصلصال: يوزع المعلم الصلصال ويطلب صنع ثلاث ديدان مختلفة الطول، والتلاميذ يصنعون ويرتبون ديدانهم من الأقصر إلى الأطول (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص١٥–١٦ (دودة الصلصال، الثعابين)، والتلاميذ يحلون التمارين (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص قياس الطول، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. ختام الدرس – الأطول في بلادي: ترسم كل مجموعة ثلاثة أشياء من عُمان (نخلة، برج قلعة، خنجر) وترتبها من الأقصر إلى الأطول، وتقول جملًا مثل: النخلة أطول من الخنجر (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: اصنع دودة أطول من هذه. — الإجابة النموذجية: دودة أطول.\n٢. (مستوى التطبيق) السؤال: رتّب الثعابين الثلاثة من الأقصر. — الإجابة النموذجية: ترتيب صحيح.\n٣. (مستوى الاستدلال) السؤال: اصنع دودة طولها بين دودتين معطاتين. — الإجابة النموذجية: دودة أطول من الأولى وأقصر من الثانية.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم مع التلميذ قلمين على خط بداية واحد مرسوم على الطاولة ويقارنان طرفيهما ليحدد الأطول والأقصر، ثم يُسأل التلميذ: أي الشريطين أقصر؟ بعد أن يضعهما بنفسه على خط البداية.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس طول كتاب وطول دفتر بعدد المكعبات المتماثلة، ثم يرتبون ثلاثة أشياء من الأقصر إلى الأطول ويشرحون لماذا يجب أن تكون المكعبات متماثلة ومتلاصقة.", "١. (مستوى المعرفة) السؤال: لوّن الثعبان الأطول. — الإجابة النموذجية: الثعبان الأطول.\n٢. (مستوى التطبيق) السؤال: أيهما أقصر: قلم الرصاص أم المسطرة؟ — الإجابة النموذجية: قلم الرصاص (غالبًا) حسب المعروض.\n٣. (مستوى الاستدلال) السؤال: صِف طول دودتك مقارنة بدودة زميلك. — الإجابة النموذجية: مثل: دودتي أطول من دودة زميلي.", "يحل الطفل كتاب النشاط ص١٥–١٦، ويصنع من الصلصال ثلاثة أشياء بأطوال مختلفة ويرتبها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=6"]}]}, {"id": "٤-١", "title": "أزواج الأعداد الأقل من ١٠", "unit": "الوحدة ٤: العد ما بعد العشرة", "u": 4, "week": "السادس (١١ – ١٥/١٠/٢٠٢٦م)", "tb": "٢٦–٢٩، ٣٤–٣٥", "periods": [{"num": "١", "ax": "أزواج العدد ٥ باستخدام إطار الخمسة", "sb": "١٢", "ab": "—", "f": [" ثر من، أقل من (5 دقائق)\nيقارن تقديرين ويحدد الأقرب للعدد الفعلي (5 دقائق)", "المخرج ١: فهم — يقدّر عدد مجموعة من الأشياء حتى ٢٠ دون عدّ.\nالمخرج ٢: تقييم — يتحقق من التقدير بالعد ويقارن بينهما.\nالمخرج ٣: تطبيق — يستخدم مجموعة معلومة العدد مرجعًا للتقدير.\nالمخرج ٤: تقييم — يحكم على معقولية التقدير.\nالمخرج الآخر: تذكر — يستخدم كلمات: تقريبًا، أكثر من، أقل من.\nالمخرج الآخر: تحليل — يقارن تقديرين ويحدد الأقرب للعدد الفعلي.", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التشاركي، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: جرّة شفافة بها نحو ١٨ عنصرًا، أشرطة الأعداد\nالكتاب، السبورة الذكية، أخرى: وعاءان متماثلان: أحدهما فيه ١٠ عناصر للمرجعية والآخر أكثر", "التقدير، تقريبًا، العدد الفعلي، أكثر من، أقل من، المرجع، قريب من، معقول", "يعرض المعلم جرّة شفافة مملوءة بالكرات الصغيرة لثوانٍ ثم يخفيها، ويسأل: «كم كرة تقريبًا؟ لا وقت للعد!»، ويسجل تقديرات التلاميذ.", "1. التهيئة: يعرض المعلم الجرّة لثوانٍ ويسجل التقديرات، والتلاميذ يقدّرون دون عدّ (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقدّر ثم أتحقق بالعد»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يوضح المعلم أن التقدير تخمين ذكي قريب من العدد، ثم يعدّ محتوى الجرّة ويقارن بالتقديرات، والتلاميذ يعدّون معه ويقارنون تقديراتهم (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. نشاط ثنائي: يوزع المعلم أوعية بأعداد مختلفة من الأشياء، ويتفقان التلميذ على تقدير ثم يعدّان بوضع عنصر على كل عدد في شريط الأعداد (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص١٤ (التقدير والعد) يقدّرون ثم يتحققون بالعد (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. عرض الهدف: يعرض المعلم: «أستطيع أن أقدّر مستعينًا بمرجع»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n7. النمذجة: يفكر المعلم بصوت مرتفع: «هذا الوعاء يبدو مثل وعاءين من العشرة، إذن نحو ٢٠»، والتلاميذ يتابعون طريقة التفكير (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. محطات التقدير: يعدّ المعلم محطات بأوعية كلًا له ٤ أضلاع في المجموعة؟ — الإجابة النموذجية: حسب الشكل المعروض.\n٣. (مستوى الاستدلال) السؤال: فرز علي الأشكال إلى مجموعتين: دوائر وغيرها. اقترح قاعدة أخرى. — الإجابة النموذجية: مثل: حسب اللون أو عدد الأضلاع.", "يحل الطفل كتاب النشاط ص٢١، ويفرز أشياء البيت حسب شكلها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=11"]}, {"num": "٣", "ax": "الاصطفاف بالفسيفساء وتكوين أشكال من أشكال", "sb": "١٧", "ab": "٢٠", "f": ["١. يكوّن أشكالًا جديدة بتجميع أشكال ثنائية الأبعاد (15 دقيقة)\n٢. يحدد الأشكال التي تتلاصق دون فراغات (10 دقائق)\nمخرج تعليمي آخر: يصنع مربعًا كبيرًا من أربعة مربعات (15 دقيقة)", "المخرج ١: إبداع — يكوّن أشكالًا جديدة بتجميع أشكال ثنائية الأبعاد.\nالمخرج ٢: تحليل — يحدد الأشكال التي تتلاصق دون فراغات.\nالمخرج الآخر: تطبيق — يصنع مربعًا كبيرًا من أربعة مربعات.", "التعلم بالاكتشاف، التعلم المبني على المشاريع، التعلم التعاوني", "الكتاب، السبورة الذكية، الأقلام، صورة توضيحية، أخرى: قطع أشكال، صور زخارف إسلامية، كتاب النشاط ص٢٠", "الفسيفساء، تلاصق، فراغ، يكوّن", "يعرض المعلم صورة لزخرفة إسلامية من مسجد في عُمان، ويسأل: «ما الأشكال التي ترونها؟ هل بينها فراغات؟».", "1. التهيئة: يعرض المعلم صورة الزخرفة ويناقش، والتلاميذ يسمون الأشكال الظاهرة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أكوّن أشكالًا من أشكال»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. النمذجة: يرصف المعلم مربعات متجاورة بلا فراغ، ثم دوائر ليلاحظوا الفراغات، والتلاميذ يلاحظون ويقارنون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مشروع الفسيفساء: يوزع المعلم قطع الأشكال على المجموعات، والتلاميذ يصممون لوحة فسيفساء ويحددون الأشكال التي لا تترك فراغات (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب التلميذ والنشاط: يوجه المعلم إلى ص١٧ (صناعة أربعة مربعات) وكتاب النشاط ص٢٠ (ماذا يتبقى؟)، والتلاميذ يحلون المهام (9 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n6. الختام: يعرض المعلم أجمل اللوحات، والتلاميذ يصفون الأشكال المستخدمة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. ختام الدرس – أشكال من بلادي: تبحث المجموعات في رسم سريع لعلم عُمان وباب قلعة عن مستطيلات ومربعات ومثلثات ودوائر، وتعد أضلاع كل شكل ورؤوسه، ثم تعرض أكثر شكل وجدته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: ضع مربعين جنبًا إلى جنب. هل يوجد فراغ؟ — الإجابة النموذجية: لا.\n٢. (مستوى التطبيق) السؤال: ضع دائرتين متلاصقتين. ماذا تلاحظ؟ — الإجابة النموذجية: يبقى فراغ بينهما.\n٣. (مستوى الاستدلال) السؤال: كم مربعًا صغيرًا تحتاج لتكوين مربع كبير؟ — الإجابة النموذجية: ٤.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ أشكالًا ورقية (دائرة، مربع، مستطيل، مثلث)، فيمرر إصبعه على أضلاع كل شكل ويعدها مع المعلم ويسميه، ثم يُسأل: كم ضلعًا للمثلث؟ (٣).\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بفرز مجموعة أشكال بطريقتين مختلفتين (حسب عدد الأضلاع ثم حسب اللون) وتبرير كل طريقة، ثم يرسمون شكلًا له ٦ أضلاع ويسمونه (السداسي).", "١. (مستوى المعرفة) السؤال: سمِّ شكلين يتلاصقان دون فراغ. — الإجابة النموذجية: المربع والمستطيل (أو المثلث).\n٢. (مستوى التطبيق) السؤال: كوّن مستطيلًا من مربعين. — الإجابة النموذجية: مربعان متجاوران.\n٣. (مستوى الاستدلال) السؤال: صمّم نمطًا من المثلثات دون فراغات وصِفه. — الإجابة النموذجية: تصميم مقبول مع وصف.", "يحل الطفل كتاب النشاط ص٢٠، ويتأمل الزخارف في البيت والمسجد ويحدد أشكالها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=11"]}]}, {"id": "٦-٢", "title": "المجسمات", "unit": "الوحدة ٦: الأشكال ثنائية الأبعاد والمجسمات وأنماطها", "u": 6, "week": "الثامن (٢٥ – ٢٩/١٠/٢٠٢٦م)", "tb": "٥٢–٥٥", "periods": [{"num": "١", "ax": "تسمية المجسمات: الكيس الغامض", "sb": "١٨", "ab": "—", "f": ["١. يسمي المجسمات: المكعب، متوازي المستطيلات، الكرة، الأسطوانة، المخروط، الهرم (15 دقيقة)\n٢. يربط المجسمات بأشياء من الحياة (10 دقائق)\nمخرج تعليمي آخر: يتعرف المجسم باللمس دون رؤيته (15 دقيقة)", "المخرج ١: تذكر — يسمي المجسمات: المكعب، متوازي المستطيلات، الكرة، الأسطوانة، المخروط، الهرم.\nالمخرج ٢: فهم — يربط المجسمات بأشياء من الحياة.\nالمخرج الآخر: تحليل — يتعرف المجسم باللمس دون رؤيته.", "التعلم المبني على اللعب، التعلم بالنمذجة، التعلم بالمحسوسات", "الكتاب، السبورة الذكية، نماذج مجسمة، أخرى: كيس غير شفاف، علب فارغة، كرة", "المجسم، المكعب، متوازي المستطيلات، الكرة، الأسطوانة، المخروط، الهرم", "يُخرج المعلم من حقيبته علبة عصير وكرة وعلبة مناديل، ويسأل: «هل هذه أشكال مسطحة مثل الدائرة والمربع؟ ما الفرق؟».", "1. التهيئة: يعرض المعلم الأشياء ويطرح السؤال، والتلاميذ يلاحظون أن لها سمكًا وتُمسك باليد (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أسمي المجسمات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يعرض كل مجسم ويسميه ويربطه بمثال حياتي (المخروط ← قمع الآيس كريم)، والتلاميذ يرددون الأسماء ويذكرون أمثلة (10 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. لعبة الكيس الغامض: يضع المعلم مجسمًا في الكيس ويختار تلميذًا يتحسسه ويصفه، ويصف أحدهم ويخمن الآخرون (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. كتاب: المعلم: يوجه إلى ص١٨ (المجسمات) يسمون المجسمات ويحددون الأشكال المسطحة التي تكوّنها (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.", "١. (مستوى المعرفة) السؤال: ما اسم هذا المجسم؟ (كرة) — الإجابة النموذجية: كرة.\n٢. (مستوى التطبيق) السؤال: اذكر شيئًا في الصف يشبه متوازي المستطيلات. — الإجابة النموذجية: مثل: الكتاب، الخزانة.\n٣. (مستوى الاستدلال) السؤال: تحسست مجسمًا له رأس مدبب وقاعدة دائرية. ما هو؟ — الإجابة النموذجية: المخروط.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم أمام التلميذ مجسمات حقيقية (كرة، علبة عصير أسطوانية، صندوق) ويسمي كل مجسم وهو يتحسسه معه ويطابقه بشيء من الصف، ثم يُسأل: ما اسم هذا المجسم؟ مشيرًا إلى الأسطوانة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة الكيس الغامض: يتحسس أحدهم مجسمًا دون رؤيته ويصفه (أوجه مسطحة، سطح منحنٍ، رأس مدبب) ليخمّن زميله اسمه، ثم يصنفون المجسمات إلى ما يتدحرج وما لا يتدحرج.", "١. (مستوى المعرفة) السؤال: أي المجسمات يشبه علبة المشروب؟ — الإجابة النموذجية: الأسطوانة.\n٢. (مستوى التطبيق) السؤال: سمِّ مجسمًا يشبه حجر النرد. — الإجابة النموذجية: المكعب.\n٣. (مستوى الاستدلال) السؤال: ما الفرق بين المربع والمكعب؟ — الإجابة النموذجية: المربع شكل مسطح، والمكعب مجسم أوجهه مربعات.", "يبحث الطفل في البيت عن أشياء تشبه المجسمات ويسميها، ويراجع كتاب التلميذ ص١٨.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=12"]}, {"num": "٢", "ax": "خصائص المجسمات: الأوجه المسطحة والمنحنية", "sb": "١٨", "ab": "٢٢", "f": ["١. يميز المجسمات ذات الأوجه المسطحة من ذات الأوجه المنحنية (20 دقيقة)\n٢. يتنبأ بالمجسمات التي تتدحرج أو تُرص (5 دقائق)\nمخرج تعليمي آخر: يبني برجًا من المجسمات ويبرر اختيار المجسمات (15 دقيقة)", "المخرج ١: تحليل — يميز المجسمات ذات الأوجه المسطحة من ذات الأوجه المنحنية.\nالمخرج ٢: تطبيق — يتنبأ بالمجسمات التي تتدحرج أو تُرص.\nالمخرج الآخر: إبداع — يبني برجًا من المجسمات ويبرر اختيار المجسمات.", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، نماذج مجسمة، أخرى: مجسمات متنوعة، لوح مائل، كتاب النشاط ص٢٢", "وجه مسطح، وجه منحنٍ، يتدحرج، يُرص", "يضع المعلم لوحًا مائلًا ويسأل: «أي هذه المجسمات سيتدحرج إذا وضعناه هنا؟»، ويسجل التوقعات.", "1. التهيئة: يعرض المعلم اللوح المائل ويسجل التوقعات، والتلاميذ يتوقعون (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أصف أوجه المجسمات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التجربة: يختبر المعلم المجسمات على اللوح أمام الصف، والتلاميذ يقارنون النتائج بتوقعاتهم ويفسرون (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. تحدي البرج: يطلب المعلم من المجموعات بناء أعلى برج، والتلاميذ يبنون ويكتشفون أن الأوجه المسطحة تُرص (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢٢ (المجسمات)، والتلاميذ يحلون التمارين (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. ختام الدرس – ألغاز المجسمات العمانية: يصف المعلم شيئًا عمانيًا (برج قلعة نزوى، صندوق المندوس، حبة رمان)، فتتسابق المجموعات لتسمية المجسم الذي يشبهه: أسطوانة، متوازي مستطيلات، كرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "١. (مستوى المعرفة) السؤال: هل تتدحرج الكرة؟ لماذا؟ — الإجابة النموذجية: نعم؛ لأن سطحها منحنٍ.\n٢. (مستوى التطبيق) السؤال: أي المجسمين يُرص بسهولة: المكعب أم الكرة؟ — الإجابة النموذجية: المكعب.\n٣. (مستوى الاستدلال) السؤال: الأسطوانة تتدحرج وتُرص. كيف؟ — الإجابة النموذجية: تتدحرج على وجهها المنحني وتُرص على وجهيها المسطحين.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم أمام التلميذ مجسمات حقيقية (كرة، علبة عصير أسطوانية، صندوق) ويسمي كل مجسم وهو يتحسسه معه ويطابقه بشيء من الصف، ثم يُسأل: ما اسم هذا المجسم؟ مشيرًا إلى الأسطوانة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة الكيس الغامض: يتحسس أحدهم مجسمًا دون رؤيته ويصفه (أوجه مسطحة، سطح منحنٍ، رأس مدبب) ليخمّن زميله اسمه، ثم يصنفون المجسمات إلى ما يتدحرج وما لا يتدحرج.", "١. (مستوى المعرفة) السؤال: كم وجهًا للمكعب؟ — الإجابة النموذجية: ٦.\n٢. (مستوى التطبيق) السؤال: سمِّ مجسمًا كل أوجهه مسطحة. — الإجابة النموذجية: المكعب أو متوازي المستطيلات.\n٣. (مستوى الاستدلال) السؤال: لماذا لا نضع الكرة أسفل البرج؟ — الإجابة النموذجية: لأنها تتدحرج ولا تثبت.", "يحل الطفل كتاب النشاط ص٢٢، ويجرب في البيت أي الأشياء تتدحرج وأيها يُرص.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=12"]}]}, {"id": "٦-٣", "title": "التماثل والأنماط", "unit": "الوحدة ٦: الأشكال ثنائية الأبعاد والمجسمات وأنماطها", "u": 6, "week": "الثامن (٢٥ – ٢٩/١٠/٢٠٢٦م)", "tb": "٥٦–٥٨", "periods": [{"num": "١", "ax": "خط التماثل بطي الأشكال", "sb": "٢٠", "ab": "٢٣–٢٤", "f": ["١. يحدد خط التماثل في شكل بالطي (15 دقيقة)\n٢. يميز الأشكال المتماثلة في الحياة (15 دقيقة)\nمخرج تعليمي آخر: يصنع شكلًا متماثلًا بالطي والقص (10 دقائق)", "المخرج ١: تطبيق — يحدد خط التماثل في شكل بالطي.\nالمخرج ٢: فهم — يميز الأشكال المتماثلة في الحياة.\nالمخرج الآخر: إبداع — يصنع شكلًا متماثلًا بالطي والقص.", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، الأقلام، صورة توضيحية، أخرى: ورق مربع، مقصات آمنة، مرآة صغيرة، كتاب النشاط ص٢٣–٢٤", "التماثل، خط التماثل، الطي، متطابق", "يعرض المعلم صورة فراشة وورقة شجر، ويطوي ورقة على شكل فراشة من المنتصف، ويسأل: «ماذا تلاحظون على الجزأين؟».", "1. التهيئة: يعرض المعلم الصور ويطوي الورقة، والتلاميذ يلاحظون تطابق الجزأين (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أجد خط التماثل»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. النمذجة: يطوي المعلم مربعًا ويقص شكلًا على خط الطي ثم يفتحه ويحدد خط التماثل، والتلاميذ يتابعون ويسمون خط التماثل (10 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. نشاط فردي: يوزع المعلم الأوراق المربعة، والتلاميذ يطوون ويقصون ويفتحون ويرسمون خط التماثل (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢٣–٢٤ (التماثل)، والتلاميذ يكملون الأشكال المتماثلة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. الختام: يعرض المعلم أشكالًا ويسأل: «متماثل أم لا؟»، والتلاميذ يجيبون بالإشارة (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.", "١. (مستوى المعرفة) السؤال: أين خط التماثل في هذا القلب؟ — الإجابة النموذجية: في المنتصف عموديًا.\n٢. (مستوى التطبيق) السؤال: اطوِ المربع لتجد خط تماثل. — الإجابة النموذجية: طي من المنتصف.\n٣. (مستوى الاستدلال) السؤال: هل لكل الأشكال خط تماثل؟ أعطِ مثالًا. — الإجابة النموذجية: لا، مثل شكل غير منتظم.\n\n• نشاط علاجي (لمن لم يتقن): يطوي التلميذ مع المعلم ورقة مربعة من المنتصف ويتحقق من تطابق النصفين ثم يرسم خط التماثل على خط الطي، ثم يُكمل نمطًا بسيطًا (أحمر، أزرق، أحمر، ...) ويذكر اللون التالي.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بصنع شكل متماثل بالطي والقص (فراشة أو شجرة)، ثم يصمم كل منهم نمطًا متكررًا من ثلاثة أشكال ويطلب من زميله تحديد الجزء الذي يتكرر وإكماله.", "١. (مستوى المعرفة) السؤال: ارسم خط التماثل للفراشة. — الإجابة النموذجية: خط في المنتصف.\n٢. (مستوى التطبيق) السؤال: أكمل الشكل ليصبح متماثلًا. — الإجابة النموذجية: إكمال الجزء الناقص مطابقًا.\n٣. (مستوى الاستدلال) السؤال: كم خط تماثل للمربع وجدت بالطي؟ — الإجابة النموذجية: ٤ خطوط (أو ما توصل إليه بالطي: عمودي وأفقي وقطريان).", "يحل الطفل كتاب النشاط ص٢٣–٢٤، ويبحث عن أشياء متماثلة في البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=13"]}, {"num": "٢", "ax": "الأنماط المتكررة: ما التالي؟", "sb": "١٩", "ab": "٢٥", "f": ["١. يكمل نمطًا متكررًا من الأشكال أو الألوان (10 دقائق)\n٢. يحدد الجزء الذي يتكرر في النمط (10 دقائق)\nمخرج تعليمي آخر: يصمم نمطًا خاصًا به ويشرح قاعدته (20 دقيقة)", "المخرج ١: تطبيق — يكمل نمطًا متكررًا من الأشكال أو الألوان.\nالمخرج ٢: تحليل — يحدد الجزء الذي يتكرر في النمط.\nالمخرج الآخر: إبداع — يصمم نمطًا خاصًا به ويشرح قاعدته.", "التعلم بالاكتشاف، التعلم المبني على اللعب، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: خرز وخيوط، مكعبات ملونة، أقمشة عمانية بزخارف، كتاب النشاط ص٢٥", "النمط، يتكرر، ما التالي؟، القاعدة", "يصطف ستة تلاميذ بوضعيات: واقف، جالس، واقف، جالس... ويسأل المعلم: «ما وضعية التالي؟»، ثم يعرض قطعة قماش عمانية بزخرفة متكررة.", "1. التهيئة: ينظم المعلم صف التلاميذ ويعرض القماش، والتلاميذ يتوقعون التالي (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أكمل النمط وأصممه»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. النمذجة: يبني المعلم نمط مربع، مثلث، مربع، مثلث، ويحوّط الجزء المتكرر، والتلاميذ يحددون الجزء المتكرر ويكملون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تحدي الأنماط: يوزع المعلم خرزًا ومكعبات، ويصمم كل ثنائي نمطًا ويطلب من زميله إكماله (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب التلميذ والنشاط: يوجه المعلم إلى ص١٩ (ما التالي؟) وكتاب النشاط ص٢٥ (السيد نمط)، والتلاميذ يكملون الأنماط (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الختام: يعرض المعلم نمطًا ناقصًا من المنتصف، والتلاميذ يحددون الجزء الناقص (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. ختام الدرس – خنجر متماثل: يطوي كل زوجين ورقة ويرسمان نصف خنجر عماني على خط الطي ثم يقصانه، فيظهر شكل متماثل، ويتحدثان عن الخنجر رمزًا يظهر في الشعار الوطني (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: أكمل: ● ■ ● ■ ● ... — الإجابة النموذجية: ■.\n٢. (مستوى التطبيق) السؤال: ما الجزء المتكرر في: أحمر، أحمر، أزرق، أحمر، أحمر، أزرق؟ — الإجابة النموذجية: أحمر، أحمر، أزرق.\n٣. (مستوى الاستدلال) السؤال: ما الشكل العاشر في النمط: مثلث، دائرة، مثلث، دائرة...؟ — الإجابة النموذجية: دائرة.\n\n• نشاط علاجي (لمن لم يتقن): يطوي التلميذ مع المعلم ورقة مربعة من المنتصف ويتحقق من تطابق النصفين ثم يرسم خط التماثل على خط الطي، ثم يُكمل نمطًا بسيطًا (أحمر، أزرق، أحمر، ...) ويذكر اللون التالي.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بصنع شكل متماثل بالطي والقص (فراشة أو شجرة)، ثم يصمم كل منهم نمطًا متكررًا من ثلاثة أشكال ويطلب من زميله تحديد الجزء الذي يتكرر وإكماله.", "١. (مستوى المعرفة) السؤال: أكمل النمط: ▲ ▲ ■ ▲ ▲ ... — الإجابة النموذجية: ■.\n٢. (مستوى التطبيق) السؤال: لوّن الخرزة التالية في النمط. — الإجابة النموذجية: حسب النمط.\n٣. (مستوى الاستدلال) السؤال: صمّم نمطًا من شكلين واكتب قاعدته. — الإجابة النموذجية: نمط صحيح مع قاعدة.", "يحل الطفل كتاب النشاط ص٢٥، ويصمم نمطًا من أدوات المطبخ أو الألعاب في البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=13"]}]}, {"id": "٧-١", "title": "أزواج الأعداد حتى ١٠", "unit": "الوحدة ٧: العد لما بعد العشرين", "u": 7, "week": "التاسع (١ – ٥/١١/٢٠٢٦م)", "tb": "٦٠–٦٣", "periods": [{"num": "١", "ax": "أزواج الأعداد باستخدام الدومينو", "sb": "٢١", "ab": "—", "f": ["١. يجد أزواج الأعداد حتى ١٠ باستخدام قطع الدومينو (10 دقائق)\n٢. يدرك أن قطعًا مختلفة قد يكون لها المجموع نفسه (5 دقائق)\nمخرج تعليمي آخر: يجد كل قطع الدومينو التي مجموعها ٦ (25 دقيقة)", "المخرج ١: تطبيق — يجد أزواج الأعداد حتى ١٠ باستخدام قطع الدومينو.\nالمخرج ٢: فهم — يدرك أن قطعًا مختلفة قد يكون لها المجموع نفسه.\nالمخرج الآخر: تحليل — يجد كل قطع الدومينو التي مجموعها ٦.", "التعلم بالاكتشاف، التعلم المبني على اللعب، التعلم التعاوني", "الكتاب، السبورة الذكية، أخرى: قطع دومينو (مجموعتان لكل ثنائي)", "الدومينو، المجموع، زوج ال
