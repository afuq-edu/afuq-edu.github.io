", "unit": "الوحدة ٨: السعة (١)", "u": 8, "week": "العاشر (٨ – ١٢/١١/٢٠٢٦م)", "tb": "٧٠–٧١", "periods": [{"num": "١", "ax": "مفهوم السعة والمقارنة المباشرة بين الأوعية + قياس السعة بوحدات غير قياسية: كم عدد الأكواب؟", "sb": "٢٣", "ab": "—", "f": ["١. يوضح أن السعة هي ما يحمله الوعاء.\n٢. يقارن سعة وعاءين بالصب المباشر.\n٣. يقيس سعة وعاء بعدد الأكواب الصغيرة المتماثلة.\n٤. يقارن بين سعتين بعدد الأكواب.\n\nمخرج تعليمي آخر:\nيستخدم مفردات: يحمل أكثر، يحمل أقل، ممتلئ، فارغ.\nيقدّر عدد الأكواب قبل القياس.", "المخرج ١: فهم — يوضح أن السعة هي ما يحمله الوعاء.\nالمخرج ٢: تطبيق — يقارن سعة وعاءين بالصب المباشر.\nالمخرج ٣: تطبيق — يقيس سعة وعاء بعدد الأكواب الصغيرة المتماثلة.\nالمخرج ٤: تحليل — يقارن بين سعتين بعدد الأكواب.\nالمخرج الآخر: تذكر — يستخدم مفردات: يحمل أكثر، يحمل أقل، ممتلئ، فارغ.\nالمخرج الآخر: تقييم — يقدّر عدد الأكواب قبل القياس.", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم بالمحسوسات، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: أوعية مختلفة السعة، ماء أو رمل جاف، قمع، دلو\nالكتاب، السبورة الذكية، الأقلام، أخرى: أكواب صغيرة متماثلة، أوعية مختلفة، ماء، كتاب النشاط ص٢٦", "السعة، يحمل أكثر، يحمل أقل، ممتلئ، فارغ، كوب، وحدة القياس، التقدير", "يعرض المعلم كوبًا طويلًا ضيقًا وآخر قصيرًا عريضًا، ويسأل: «أيهما يحمل ماءً أكثر؟»، ويسجل التوقعات دون تجريب.", "(٠–٢ د) التهيئة: المعلم: يعرض الكوبين ويسجل التوقعات. الطالب: يتوقعون ويبررون.\n(٢–٣ د) عرض الهدف: المعلم: يعرض: «أستطيع أن أقارن سعة الأوعية». الطالب: يقرؤون الهدف.\n(٣–٩ د) التجربة النموذجية: المعلم: يملأ الكوب الطويل ويصبه في العريض ليرى هل يفيض. الطالب: يلاحظون ويصححون توقعاتهم.\n(٩–١٦ د) نشاط المجموعات: المعلم: يوزع أزواج أوعية وماء أو رمل. الطالب: يقارنون بالصب ويحددون الذي يحمل أكثر.\n(١٦–٢٠ د) كتاب التلميذ: المعلم: يوجه إلى ص٢٣ (السعة) ويناقش الصور. الطالب: يحددون الوعاء الأكبر سعة.\n(٢٠–٢١ د) عرض الهدف: المعلم: يعرض: «أستطيع أن أقيس السعة بالأكواب». الطالب: يقرؤون الهدف.\n(٢١–٢٦ د) النمذجة: المعلم: يملأ الإبريق كوبًا كوبًا والتلاميذ يعدّون، ويؤكد ملء الكوب إلى حافته. الطالب: يعدّون الأكواب.\n(٢٦–٣٣ د) نشاط المجموعات: المعلم: يوزع أوعية مختلفة وأكوابًا متماثلة. الطالب: يقدّرون ثم يقيسون ويسجلون عدد الأكواب.\n(٣٣–٣٧ د) كتاب النشاط: المعلم: يوجه إلى كتاب النشاط ص٢٦ (كم عدد الأكواب؟). الطالب: يحلون التمارين.\n(٣٧–٤٠ د) الختام: المعلم: يطرح أسئلة التقويم الختامي. الطالب: يجيبون.\nالمجموع: ٤٠ دقيقة", "١. (مستوى المعرفة) السؤال: أي الوعاءين ممتلئ؟ — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: صببنا الكوب (أ) في (ب) ففاض. أيهما يحمل أكثر؟ — الإجابة النموذجية: الكوب (أ).\n٣. (مستوى الاستدلال) السؤال: هل الوعاء الأطول يحمل دائمًا أكثر؟ لماذا؟ — الإجابة النموذجية: لا؛ لأن العرض مهم أيضًا.\n\n٤. (مستوى المعرفة) السؤال: ملأنا الوعاء بـ ٤ أكواب. ما سعته بالأكواب؟ — الإجابة النموذجية: ٤ أكواب.\n٥. (مستوى التطبيق) السؤال: لماذا يجب ملء الكوب إلى حافته كل مرة؟ — الإجابة النموذجية: ليكون القياس دقيقًا.\n٦. (مستوى الاستدلال) السؤال: وعاء (أ) ٦ أكواب ووعاء (ب) ٩. أيهما يحمل أكثر؟ وبكم؟ — الإجابة النموذجية: (ب) بثلاثة أكواب.", "١. (مستوى المعرفة) السؤال: أشر إلى الوعاء الفارغ. — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: أيهما يحمل أكثر: الدلو أم الفنجان؟ — الإجابة النموذجية: الدلو.\n٣. (مستوى الاستدلال) السؤال: صببنا الإبريق في القارورة فلم تمتلئ. ماذا نستنتج؟ — الإجابة النموذجية: القارورة تحمل أكثر من الإبريق.\n\n٤. (مستوى المعرفة) السؤال: كم كوبًا يملأ القارورة (حسب التجربة)؟ — الإجابة النموذجية: حسب القياس.\n٥. (مستوى التطبيق) السؤال: وعاء سعته ٥ أكواب وآخر ٣. أيهما أقل سعة؟ — الإجابة النموذجية: الذي سعته ٣.\n٦. (مستوى الاستدلال) السؤال: قاست مريم بأكواب كبيرة وسعيد بأكواب صغيرة الوعاء نفسه. من سيحصل على عدد أكبر؟ — الإجابة النموذجية: سعيد.", "يقارن الطفل في البيت سعة أكواب مختلفة بصب الماء من أحدها في الآخر، ويراجع كتاب التلميذ ص٢٣.\nيحل الطفل كتاب النشاط ص٢٦، ويقيس سعة وعاء في المطبخ بعدد الأكواب مع أسرته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=16"]}, {"num": "٢", "ax": "ترتيب الأوعية حسب السعة وحل مشكلات", "sb": "٢٣", "ab": "٢٦", "f": ["١. يرتب ثلاثة أوعية حسب سعتها.\n٢. يذًا فضّل التمر؟ — الإجابة النموذجية: حسب البرج.\n٣. (مستوى الاستدلال) السؤال: بكم يزيد برج العصير عن برج الحليب؟ — الإجابة النموذجية: حسب البيانات.", "١. (مستوى المعرفة) السؤال: ما الطعام الأقل تفضيلًا؟ — الإجابة النموذجية: حسب البيانات.\n٢. (مستوى التطبيق) السؤال: ما شكل القائمة التي صممتها؟ — الإجابة النموذجية: مثل: مستطيل.\n٣. (مستوى الاستدلال) السؤال: لو أضفنا ٣ أصوات للطعام الأقل، هل يتغير الترتيب؟ — الإجابة النموذجية: حسب البيانات مع تبرير.", "يسأل الطفل أفراد أسرته عن أطعمتهم المفضلة ويسجل الإجابات بعلامات بسيطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=18"]}]}, {"id": "٩-٢", "title": "النقود", "unit": "الوحدة ٩: النقود والوقت", "u": 9, "week": "الحادي عشر (١٥ – ١٩/١١/٢٠٢٦م)", "tb": "٧٨–٧٩، ٨٧", "periods": [{"num": "١", "ax": "التعرف على الأوراق النقدية العمانية", "sb": "٢٦", "ab": "—", "f": ["١. يتعرف الأوراق النقدية: ريال، ٥ ريالات، ١٠ ريالات.\n٢. يعد مجموع أوراق نقدية من فئة الريال حتى ١٠.\nمخرج تعليمي آخر: يوضح أن ورقة ٥ ريالات تساوي ٥ أوراق من فئة الريال.", "المخرج ١: تذكر — يتعرف الأوراق النقدية: ريال، ٥ ريالات، ١٠ ريالات.\nالمخرج ٢: تطبيق — يعد مجموع أوراق نقدية من فئة الريال حتى ١٠.\nالمخرج الآخر: فهم — يوضح أن ورقة ٥ ريالات تساوي ٥ أوراق من فئة الريال.", "التعلم بالنمذجة، التعلم المبني على اللعب، لعب الأدوار", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: نماذج أوراق نقدية عمانية تعليمية (ريال، ٥، ١٠)", "النقود، الريال العماني، ورقة نقدية، قيمة", "يعرض المعلم محفظة ويخرج منها ورقة ١٠ ريالات وورقة ريال، ويسأل: «أيهما تشتري بها أشياء أكثر؟ لماذا؟».", "(٠–٤ د) التهيئة: المعلم: يعرض المحفظة ويطرح السؤال. الطالب: يجيبون ويبررون.\n(٤–٦ د) عرض الهدف: المعلم: يعرض: «أستطيع أن أتعرف الريالات العمانية». الطالب: يقرؤون الهدف.\n(٦–١٦ د) النمذجة: المعلم: يعرض كل ورقة ويقرأ قيمتها ويوضح أن ٥ أوراق ريال تساوي ورقة ٥ ريالات. الطالب: يقرؤون القيم ويعدّون.\n(١٦–٢٦ د) نشاط ثنائي: المعلم: يوزع نماذج أوراق نقدية. الطالب: يفرزون الأوراق حسب قيمتها ويعدّون أوراق الريال.\n(٢٦–٣٦ د) كتاب التلميذ: المعلم: يوجه إلى ص٢٦ (ما الثمن؟)
