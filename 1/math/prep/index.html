]}]}, {"id": "٨-١", "title": "قياس السعة", "unit": "الوحدة ٨: السعة (١)", "u": 8, "week": "العاشر (٨ – ١٢/١١/٢٠٢٦م)", "tb": "٧٠–٧١", "periods": [{"num": "١", "ax": "مفهوم السعة والمقارنة المباشرة بين الأوعية + قياس السعة بوحدات غير قياسية: كم عدد الأكواب؟", "sb": "٢٣", "ab": "—", "f": ["١. يوضح أن السعة هي ما يحمله الوعاء (10 دقائق)\n٢. يقارن سعة وعاءين بالصب المباشر (10 دقائق)\n٣. يقيس سعة وعاء بعدد الأكواب الصغيرة المتماثلة (5 دقائق)\n٤. يقارن بين سعتين بعدد الأكواب (5 دقائق)\n\nمخرج تعليمي آخر:\nيستخدم مفردات: يحمل أكثر، يحمل أقل، ممتلئ، فارغ (5 دقائق)\nيقدّر عدد الأكواب قبل القياس (5 دقائق)", "المخرج ١: فهم — يوضح أن السعة هي ما يحمله الوعاء.\nالمخرج ٢: تطبيق — يقارن سعة وعاءين بالصب المباشر.\nالمخرج ٣: تطبيق — يقيس سعة وعاء بعدد الأكواب الصغيرة المتماثلة.\nالمخرج ٤: تحليل — يقارن بين سعتين بعدد الأكواب.\nالمخرج الآخر: تذكر — يستخدم مفردات: يحمل أكثر، يحمل أقل، ممتلئ، فارغ.\nالمخرج الآخر: تقييم — يقدّر عدد الأكواب قبل القياس.", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم بالمحسوسات، التعلم التعاوني، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، أخرى: أوعية مختلفة السعة، ماء أو رمل جاف، قمع، دلو\nالكتاب، السبورة الذكية، الأقلام، أخرى: أكواب صغيرة متماثلة، أوعية مختلفة، ماء، كتاب النشاط ص٢٦", "السعة، يحمل أكثر، يحمل أقل، ممتلئ، فارغ، كوب، وحدة القياس، التقدير", "يعرض المعلم كوبًا طويلًا ضيقًا وآخر قصيرًا عريضًا، ويسأل: «أيهما يحمل ماءً أكثر؟»، ويسجل التوقعات دون تجريب.", "1. التهيئة: يعرض المعلم الكوبين ويسجل التوقعات، والتلاميذ يتوقعون ويبررون (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقارن سعة الأوعية»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التجربة النموذجية: يملأ المعلم الكوب الطويل ويصبه في العريض ليرى هل يفيض، والتلاميذ يلاحظون ويصححون توقعاتهم (6 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n4. نشاط: المعلم: يوزع أزواج أوعية وماء أو رمل يقارنون بالصب ويحددون الذي يحمل أكثر (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص٢٣ (السعة) ويناقش الصور يحددون الوعاء الأكبر سعة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. عرض الهدف: يعرض المعلم: «أستطيع أن أقيس السعة بالأكواب»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n7. النمذجة: يملأ المعلم الإبريق كوبًا كوبًا والتلاميذ يعدّون، ويؤكد ملء الكوب إلى حافته، والتلاميذ يعدّون الأكواب (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. نشاط: المعلم: يوزع أوعية مختلفة وأكوابًا متماثلة يقدّرون ثم يقيسون ويسجلون عدد الأكواب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢٦ (كم عدد الأكواب؟)، والتلاميذ يحلون التمارين (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "١. (مستوى المعرفة) السؤال: أي الوعاءين ممتلئ؟ — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: صببنا الكوب (أ) في (ب) ففاض. أيهما يحمل أكثر؟ — الإجابة النموذجية: الكوب (أ).\n٣. (مستوى الاستدلال) السؤال: هل الوعاء الأطول يحمل دائمًا أكثر؟ لماذا؟ — الإجابة النموذجية: لا؛ لأن العرض مهم أيضًا.\n\n• نشاط علاجي (لمن لم يتقن): يصب التلميذ مع المعلم الماء من كوب صغير في كوب كبير فيلاحظ أنه لم يمتلئ، ثم يصب من الكبير في الصغير فيفيض، ويقول: «الكبير يحمل أكثر»، ثم يُسأل: أي الوعاءين فارغ؟ مشيرًا إلى وعاءين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس سعة وعاءين بعدد الأكواب الصغيرة المتماثلة وتسجيل النتيجة، ثم يتنبؤون أيهما يحمل أكثر: وعاء طويل ضيق أم وعاء قصير عريض، ويتحققون بالصب.\n\n٤. (مستوى المعرفة) السؤال: ملأنا الوعاء بـ ٤ أكواب. ما سعته بالأكواب؟ — الإجابة النموذجية: ٤ أكواب.\n٥. (مستوى التطبيق) السؤال: لماذا يجب ملء الكوب إلى حافته كل مرة؟ — الإجابة النموذجية: ليكون القياس دقيقًا.\n٦. (مستوى الاستدلال) السؤال: وعاء (أ) ٦ أكواب ووعاء (ب) ٩. أيهما يحمل أكثر؟ وبكم؟ — الإجابة النموذجية: (ب) بثلاثة أكواب.\n\n• نشاط علاجي (لمن لم يتقن): يصب التلميذ مع المعلم الماء من كوب صغير في كوب كبير فيلاحظ أنه لم يمتلئ، ثم يصب من الكبير في الصغير فيفيض، ويقول: «الكبير يحمل أكثر»، ثم يُسأل: أي الوعاءين فارغ؟ مشيرًا إلى وعاءين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس سعة وعاءين بعدد الأكواب الصغيرة المتماثلة وتسجيل النتيجة، ثم يتنبؤون أيهما يحمل أكثر: وعاء طويل ضيق أم وعاء قصير عريض، ويتحققون بالصب.", "١. (مستوى المعرفة) السؤال: أشر إلى الوعاء الفارغ. — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: أيهما يحمل أكثر: الدلو أم الفنجان؟ — الإجابة النموذجية: الدلو.\n٣. (مستوى الاستدلال) السؤال: صببنا الإبريق في القارورة فلم تمتلئ. ماذا نستنتج؟ — الإجابة النموذجية: القارورة تحمل أكثر من الإبريق.\n\n٤. (مستوى المعرفة) السؤال: كم كوبًا يملأ القارورة (حسب التجربة)؟ — الإجابة النموذجية: حسب القياس.\n٥. (مستوى التطبيق) السؤال: وعاء سعته ٥ أكواب وآخر ٣. أيهما أقل سعة؟ — الإجابة النموذجية: الذي سعته ٣.\n٦. (مستوى الاستدلال) السؤال: قاست مريم بأكواب كبيرة وسعيد بأكواب صغيرة الوعاء نفسه. من سيحصل على عدد أكبر؟ — الإجابة النموذجية: سعيد.", "يقارن الطفل في البيت سعة أكواب مختلفة بصب الماء من أحدها في الآخر، ويراجع كتاب التلميذ ص٢٣.\nيحل الطفل كتاب النشاط ص٢٦، ويقيس سعة وعاء في المطبخ بعدد الأكواب مع أسرته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=16"]}, {"num": "٢", "ax": "ترتيب الأوعية حسب السعة وحل مشكلات", "sb": "٢٣", "ab": "٢٦", "f": ["١. يرتب ثلاثة أوعية حسب سعتها (15 دقيقة)\n٢. يحل مشكلة بسيطة تتعلق بالسعة (5 دقائق)\n\nمخرج تعليمي آخر: يبرر الترتيب بنتائج القياس (20 دقيقة)", "المخرج ١: تطبيق — يرتب ثلاثة أوعية حسب سعتها.\nالمخرج ٢: تحليل — يحل مشكلة بسيطة تتعلق بالسعة.\nالمخرج الآخر: تقييم — يبرر الترتيب بنتائج القياس.", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ثلاثة أوعية مختلفة، أكواب، رمل", "الأكثر سعة، الأقل سعة، الترتيب", "يطرح المعلم مشكلة: «نريد سقي النبتة، أي الأوعية الثلاثة يحمل أكثر ماء فنأخذه؟»، ويعرض الأوعية.", "1. التهيئة: يعرض المعلم المشكلة والأوعية، والتلاميذ يقترحون طريقة الحل (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أرتب الأوعية حسب سعتها»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل المشكلة: يوجه المجموعات لقياس كل وعاء بالأكواب، والتلاميذ يقيسون ويرتبون من الأكثر إلى الأقل (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. مشاركة: يقارن المعلم نتائج المجموعات، والتلاميذ يبررون الترتيب (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. أكمل الفكرة: يبدأ المعلم جملة عن قياس السعة، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (9 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. ختام الدرس – جرة الماء الفخارية: تقارن المجموعات بين جرة فخارية مرسومة وكوب صغير: أيهما يحمل أكثر؟ ومتى تكون ممتلئة أو فارغة؟ ثم يتحدثون عن المحافظة على ماء الأفلاج وعدم الإسراف (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "١. (مستوى المعرفة) السؤال: أي الأوعية يحمل أكثر؟ — الإجابة النموذجية: حسب القياس.\n٢. (مستوى التطبيق) السؤال: رتّب: ٧ أكواب، ٢ كوب، ٥ أكواب من الأقل. — الإجابة النموذجية: ٢، ٥، ٧.\n٣. (مستوى الاستدلال) السؤال: نحتاج ٦ أكواب لملء حوض صغير، والوعاء يحمل ٣. كم مرة نملؤه؟ — الإجابة النموذجية: مرتين.\n\n• نشاط علاجي (لمن لم يتقن): يصب التلميذ مع المعلم الماء من كوب صغير في كوب كبير فيلاحظ أنه لم يمتلئ، ثم يصب من الكبير في الصغير فيفيض، ويقول: «الكبير يحمل أكثر»، ثم يُسأل: أي الوعاءين فارغ؟ مشيرًا إلى وعاءين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقياس سعة وعاءين بعدد الأكواب الصغيرة المتماثلة وتسجيل النتيجة، ثم يتنبؤون أيهما يحمل أكثر: وعاء طويل ضيق أم وعاء قصير عريض، ويتحققون بالصب.", "١. (مستوى المعرفة) السؤال: أي الوعاءين أقل سعة: ٤ أكواب أم ٨؟ — الإجابة النموذجية: ٤ أكواب.\n٢. (مستوى التطبيق) السؤال: رتّب الأوعية من الأكثر سعة. — الإجابة النموذجية: ترتيب صحيح.\n٣. (مستوى الاستدلال) السؤال: اقترح وعاءً في البيت يحمل أكثر من الكوب وأقل من الدلو. — الإجابة النموذجية: مثل: الإبريق.", "يرتب الطفل ثلاثة أوعية في المطبخ من الأقل سعة إلى الأكثر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=16"]}]}, {"id": "٨-٢", "title": "تقدير السعة", "unit": "الوحدة ٨: السعة (١)", "u": 8, "week": "العاشر (٨ – ١٢/١١/٢٠٢٦م)", "tb": "٧٢–٧٤", "periods": [{"num": "١", "ax": "ممتلئ، فارغ، تقريبًا ممتلئ، تقريبًا فارغ", "sb": "٢٤", "ab": "—", "f": ["١. يصف وعاءً بالكلمات: ممتلئ، فارغ، تقريبًا ممتلئ، تقريبًا فارغ (15 دقيقة)\n٢. يقدّر هل يكفي وعاء لاستيعاب محتوى وعاء آخر (10 دقائق)\nمخرج تعليمي آخر: يستخدم «نصف ممتلئ» لوصف وعاء (15 دقيقة)", "المخرج ١: فهم — يصف وعاءً بالكلمات: ممتلئ، فارغ، تقريبًا ممتلئ، تقريبًا فارغ.\nالمخرج ٢: تقييم — يقدّر هل يكفي وعاء لاستيعاب محتوى وعاء آخر.\nالمخرج الآخر: فهم — يستخدم «نصف ممتلئ» لوصف وعاء.", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التشاركي", "الكتاب، السبورة الذكية، أخرى: ٤ أوعية شفافة متماثلة بها أرز بكميات مختلفة، بطاقات الكلمات", "ممتلئ، فارغ، تقريبًا ممتلئ، تقريبًا فارغ، نصف ممتلئ", "يعرض المعلم أربعة أوعية شفافة بكميات أرز مختلفة، ويطلب من التلاميذ ترتيبها من الفارغ إلى الممتلئ.", "1. التهيئة: يعرض المعلم الأوعية، ويرتبونها التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أصف كمية ما في الوعاء»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. النمذجة: يضع المعلم بطاقة الكلمة المناسبة تحت كل وعاء ويقرؤها، والتلاميذ يقرؤون ويطابقون (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. نشاط التقدير: يحمل المعلم وعاءً صغيرًا ويسأل: «هل يكفي لمحتوى هذا الوعاء؟» ثم يصب ببطء، والتلاميذ يتوقعون ويلاحظون الفيضان أو عدمه (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. نشاط ثنائي: يعطي المعلم أوعية وأرزًا، ويملأ أحدهما حسب كلمة يقولها الآخر (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "١. (مستوى المعرفة) السؤال: أشر إلى الوعاء الممتلئ. — الإجابة النموذجية: حسب العرض.\n٢. (مستوى التطبيق) السؤال: صِف وعاءً فيه قليل جدًا من الأرز. — الإجابة النموذجية: تقريبًا فارغ.\n٣. (مستوى الاستدلال) السؤال: سنصب وعاءً ممتلئًا كبيرًا في صغير. ماذا تتوقع؟ — الإجابة النموذجية: سيفيض الماء/الأرز.\n\n• نشاط علاجي (لمن لم يتقن): يملأ المعلم أمام التلميذ أربعة أوعية شفافة بالأرز بمستويات مختلفة، ويسمي معه كل حالة: ممتلئ، تقريبًا ممتلئ، تقريبًا فارغ، فارغ، ثم يطلب منه أن يشير إلى الوعاء الذي هو تقريبًا فارغ.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب ثلاثة أوعية من الأقل إلى الأكثر سعة بالتقدير ثم التحقق بالصب، ثم يملأ كل منهم وعاءً إلى نصفه ويشرح كيف عرف أنه نصف ممتلئ.", "١. (مستوى المعرفة) السؤال: الوعاء الذي ليس فيه شيء ... — الإجابة النموذجية: فارغ.\n٢. (مستوى التطبيق) السؤال: املأ الكوب حتى المنتصف وصِفه. — الإجابة النموذجية: نصف ممتلئ.\n٣. (مستوى الاستدلال) السؤال: أي الكلمتين أقرب لوعاء ينقصه قليل: تقريبًا ممتلئ أم تقريبًا فارغ؟ — الإجابة النموذجية: تقريبًا ممتلئ.", "يصف الطفل كميات الماء في أكواب الأسرة بالكلمات: ممتلئ، فارغ، نصف ممتلئ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=17"]}, {"num": "٢", "ax": "ترتيب السعات ومراجعة الوحدة ٨", "sb": "٢٤", "ab": "٢٦", "f": ["١. يرتب الأوعية من الأقل إلى الأكثر سعة (15 دقيقة)\n٢. يقدّر ويقارن السعات بالمقارنة المباشرة (10 دقائق)\nمخرج تعليمي آخر: يشرح سبب اختلاف تقديراته عن القياس (15 دقيقة)", "المخرج ١: تطبيق — يرتب الأوعية من الأقل إلى الأكثر سعة.\nالمخرج ٢: تقييم — يقدّر ويقارن السعات بالمقارنة المباشرة.\nالمخرج الآخر: تحليل — يشرح سبب اختلاف تقديراته عن القياس.", "التعلم التعاوني، التعلم المبني على اللعب، التعلم الذاتي", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، صورة توضيحية، أخرى: صور أوعية، أوعية حقيقية", "الترتيب، السعة، الأكثر، الأقل", "يعرض المعلم صور قنينة ماء وإبريق ودلو وفنجان، ويطلب من التلاميذ الوقوف في صف بحسب ترتيب الصور التي يحملونها من الأقل سعة.", "1. التهيئة: يوزع المعلم الصور وينظم الترتيب، والتلاميذ يرتبون أنفسهم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أرتب السعات»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. كتاب: المعلم: يوجه إلى ص٢٤ (ترتيب السعات) يرتبون الأوعية المرسومة (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تطبيق عملي: يعرض المعلم ثلاثة أوعية حقيقية للتقدير ثم التحقق، والتلاميذ يقدّرون ويتحققون بالصب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «قدّرت أن الكوب يملأ القارورة، لكنه لم يملأها. ماذا تستنتج» على السبورة، ويناقش المعلم الإجابات مع الصف (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يلخص المعلم مفردات الوحدة، والتلاميذ يذكرون المفردات (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. ختام الدرس – فنجان القهوة العمانية: يمثل الأزواج تقديم القهوة العمانية للضيف، فيشير أحدهما إلى مستوى في فنجان مرسوم ويصفه زميله: ممتلئ، نصف ممتلئ، تقريبًا فارغ، مع تحية الضيف واحترام الكبير (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "١. (مستوى المعرفة) السؤال: أيهما أقل سعة: الفنجان أم الإبريق؟ — الإجابة النموذجية: الفنجان.\n٢. (مستوى التطبيق) السؤال: رتّب: دلو، كوب، قنينة من الأقل. — الإجابة النموذجية: كوب، قنينة، دلو.\n٣. (مستوى الاستدلال) السؤال: وعاء يحمل أكثر من (أ) وأقل من (ب). أين تضعه في الترتيب؟ — الإجابة النموذجية: بين (أ) و(ب).\n\n• نشاط علاجي (لمن لم يتقن): يملأ المعلم أمام التلميذ أربعة أوعية شفافة بالأرز بمستويات مختلفة، ويسمي معه كل حالة: ممتلئ، تقريبًا ممتلئ، تقريبًا فارغ، فارغ، ثم يطلب منه أن يشير إلى الوعاء الذي هو تقريبًا فارغ.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب ثلاثة أوعية من الأقل إلى الأكثر سعة بالتقدير ثم التحقق بالصب، ثم يملأ كل منهم وعاءً إلى نصفه ويشرح كيف عرف أنه نصف ممتلئ.", "١. (مستوى المعرفة) السؤال: أشر إلى الوعاء الأكثر سعة. — الإجابة النموذجية: حسب الصورة.\n٢. (مستوى التطبيق) السؤال: رتّب ثلاثة أوعية حقيقية من الأكثر سعة. — الإجابة النموذجية: ترتيب صحيح.\n٣. (مستوى الاستدلال) السؤال: قدّرت أن الكوب يملأ القارورة، لكنه لم يملأها. ماذا تستنتج؟ — الإجابة النموذجية: القارورة سعتها أكبر من الكوب.", "يراجع الطفل كتاب التلميذ ص٢٣–٢٤ وكتاب النشاط ص٢٦.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=17"]}]}, {"id": "٩-١", "title": "أهلًا بك في مطعم المدرسة", "unit": "الوحدة ٩: النقود والوقت", "u": 9, "week": "العاشر (٨ – ١٢/١١/٢٠٢٦م)", "tb": "٧٦–٧٧، ٨٦", "periods": [{"num": "١", "ax": "مطعم المدرسة: اختيار الأطعمة وتنظيم قائمة", "sb": "٢٥", "ab": "٢٨", "f": ["١. يصنف الأطعمة والمشروبات في مجموعات (15 دقيقة)\n٢. يتخذ قرارًا لاختيار وجبة بناءً على معلومات (10 دقائق)\nمخرج تعليمي آخر: يعد عدد الأطعمة في كل مجموعة (15 دقيقة)", "المخرج ١: تحليل — يصنف الأطعمة والمشروبات في مجموعات.\nالمخرج ٢: تقييم — يتخذ قرارًا لاختيار وجبة بناءً على معلومات.\nالمخرج الآخر: تطبيق — يعد عدد الأطعمة في كل مجموعة.", "التعلم المبني على المشاريع، التعلم التعاوني، التعلم التشاركي", "الكتاب، السبورة الذكية، صورة توضيحية، أخرى: صور أطعمة ومشروبات، قائمة الطعام (دليل المعلم ص٨٦)، كتاب النشاط ص٢٨", "قائمة الطعام، المطعم، تصنيف، الوجبة", "يسأل المعلم: «من زار مطعمًا من قبل؟ ماذا رأيت على قائمة الطعام؟ سنحوّل ركنًا من صفنا إلى مطعم المدرسة!».", "1. التهيئة: يفتح المعلم النقاش حول المطاعم، والتلاميذ يذكرون خبراتهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أصنف الأطعمة وأختار وجبة»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كتاب: المعلم: يوجه إلى ص٢٥ (مطعم المدرسة) ويسأل: «ما الأطعمة التي يجب أن يبيعها المطعم؟» يذكرون الأطعمة ويقترحون (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تصنيف الأطعمة: يوزع المعلم صور أطعمة على المجموعات، ويصنفونها التلميذ: أطعمة، مشروبات، فواكه، ويعدّون كل مجموعة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٢٨ (قائمة الطعام الخاصة بنا)، والتلاميذ يختارون أطعمة لقائمتهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "١. (مستوى المعرفة) السؤال: سمِّ ثلاثة أطعمة في الصورة. — الإجابة النموذجية: مثل: تمر، فاكهة، شطيرة.\n٢. (مستوى التطبيق) السؤال: كم مشروبًا في مجموعتك؟ — الإجابة النموذجية: حسب المجموعة.\n٣. (مستوى الاستدلال) السؤال: لماذا نضع الماء في قائمة المطعم؟ — الإجابة النموذجية: لأنه مشروب صحي ضروري.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ بطاقات مصورة لأطعمة ومشروبات، ويفرزها معه في سلتين: أطعمة ومشروبات، ثم يعدّان ما في كل سلة، ثم يُسأل: في أي سلة نضع الحليب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بسؤال ٥ من زملائهم عن مشروبهم المفضل وتسجيل الإجابات بعلامات العد، ثم يقترحون وجبة صحية لمطعم المدرسة ويبررون اختيارهم بناءً على ما جمعوه.", "١. (مستوى المعرفة) السؤال: صنّف: موز، ماء، شطيرة. — الإجابة النموذجية: فاكهة، مشروب، طعام.\n٢. (مستوى التطبيق) السؤال: اختر طعامًا ومشروبًا لوجبة. — الإجابة النموذجية: اختيار مناسب.\n٣. (مستوى الاستدلال) السؤال: لماذا تختلف قوائم الطعام بين المجموعات؟ — الإجابة النموذجية: لأن كل مجموعة اختارت حسب تفضيلها.", "يتحدث الطفل مع أسرته عن الأطعمة الصحية المناسبة لمطعم المدرسة، ويحل كتاب النشاط ص٢٨.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=18"]}, {"num": "٢", "ax": "جمع تفضيلات الصف وتصميم قائمة الطعام", "sb": "٢٥", "ab": "٢٨", "f": ["١. يجمع معلومات بسيطة عن تفضيلات زملائه بعلامات العد أو المكعبات (10 دقائق)\n٢. يحدد الطعام الأكثر تفضيلًا من البيانات (10 دقائق)\nمخرج تعليمي آخر: يصمم قائمة طعام بأشكال هندسية مختلفة (20 دقيقة)", "المخرج ١: تطبيق — يجمع معلومات بسيطة عن تفضيلات زملائه بعلامات العد أو المكعبات.\nالمخرج ٢: تحليل — يحدد الطعام الأكثر تفضيلًا من البيانات.\nالمخرج الآخر: إبداع — يصمم قائمة طعام بأشكال هندسية مختلفة.", "التعلم المبني على المشاريع، التعلم التعاوني، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: مكعبات متشابكة، ورق ملون بأشكال هندسية", "التصويت، الأكثر، الأقل، البيانات", "يعرض المعلم صور أربعة أطعمة ويسأل: «أي طعام تفضّل؟»، ويضع كل تلميذ مكعبًا فوق صورة الطعام الذي يفضله.", "1. التهيئة: ينظم المعلم التصويت بالمكعبات، والتلاميذ يصوتون بوضع المكعبات (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أجمع البيانات وأقرأها»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. قراءة البيانات: يضم المعلم المكعبات في أبراج ويسأل: «أي برج أطول؟ ماذا يعني  التمرين (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «كم ساعة بين الساعة ٧ والساعة ٩» على السبورة، ويناقش المعلم الإجابات مع الصف (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الختام: يعرض بعض الملصقات، والتلاميذ يشرحون ملصقاتهم (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. ختام الدرس – يوم الصياد العماني: ترتب المجموعات بطاقات مرسومة ليوم صياد عماني (يخرج إلى البحر صباحًا، يبيع السمك، يعود إلى أسرته مساءً)، وتضبط ساعة مرسومة على وقت كامل لكل حدث (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: ارسم عقربي الساعة الثامنة على ملصقك. — الإجابة النموذجية: الصغير على ٨ والكبير على ١٢.\n٢. (مستوى التطبيق) السؤال: كم ساعة بين الساعة ٧ والساعة ٩؟ — الإجابة النموذجية: ساعتان.\n٣. (مستوى الاستدلال) السؤال: ما المعلومات الضرورية في ملصق أوقات العمل؟ — الإجابة النموذجية: وقت الفتح ووقت الإغلاق.\n\n• نشاط علاجي (لمن لم يتقن): يثبت التلميذ مع المعلم العقرب الكبير على ١٢ في ساعة كرتونية ويحركان الصغير إلى ٢ ثم ٥ ويقرأ: «الساعة الثانية، الساعة الخامسة»، ثم يُطلب منه ضبط الساعة على السادسة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق لأوقات عمل مطعم المدرسة بالساعات الكاملة (يفتح الساعة ٨ ويغلق الساعة ١١)، ثم يحسبون كم ساعة يعمل المطعم (٣) ويرتبون ثلاثة أحداث من يومهم حسب أوقاتها.", "١. (مستوى المعرفة) السؤال: كم الساعة؟ (على ١٢) — الإجابة النموذجية: الثانية عشرة.\n٢. (مستوى التطبيق) السؤال: ماء بريال وشطيرة بريالين. كم المجموع؟ — الإجابة النموذجية: ٣ ريالات.\n٣. (مستوى الاستدلال) السؤال: يفتح المطعم الساعة ٧ ويغلق الساعة ١٢. هل هو مفتوح الساعة ١٠؟ — الإجابة النموذجية: نعم.", "يحل الطفل كتاب النشاط ص٣٢، ويراجع صفحات الوحدة ٩ في كتاب التلميذ ص٢٥–٢٨.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=21"]}]}, {"id": "١٠-١", "title": "المقارنة المباشرة", "unit": "الوحدة ١٠: مقارنة الوزن", "u": 10, "week": "الثاني عشر (٢٢ – ٢٦/١١/٢٠٢٦م)", "tb": "٩٢–٩٥، ٩٩", "periods": [{"num": "١", "ax": "مفهوم الوزن: أثقل وأخف بالحمل باليدين + تصنيف الأشياء إلى أخف من وأثقل من", "sb": "٢٩", "ab": "—", "f": ["١. يقارن وزن شيئين بحملهما باليدين (5 دقائق)\n٢. يستخدم مفردات: أثقل من، أخف من (10 دقائق)\n٣. يصنف أشياء إلى أخف من وأثقل من شيء مرجعي (10 دقائق)\n٤. يتحقق من التصنيف بالحمل (5 دقائق)\n\nمخرج تعليمي آخر:\nيدرك أن الشيء الأكبر ليس دائمًا الأثقل (5 دقائق)\nيبرر تصنيف شيء في أحد الحوضين (5 دقائق)", "المخرج ١: تطبيق — يقارن وزن شيئين بحملهما باليدين.\nالمخرج ٢: تذكر — يستخدم مفردات: أثقل من، أخف من.\nالمخرج ٣: تحليل — يصنف أشياء إلى أخف من وأثقل من شيء مرجعي.\nالمخرج ٤: تقييم — يتحقق من التصنيف بالحمل.\nالمخرج الآخر: فهم — يدرك أن الشيء الأكبر ليس دائمًا الأثقل.\nالمخرج الآخر: تقييم — يبرر تصنيف شيء في أحد الحوضين.", "التعلم بالاكتشاف، التعلم بالمحسوسات، التعلم التشاركي، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، أخرى: أشياء صفية مختلفة الوزن: تفاحة، قلم، كتاب، بالون، حجر صغير، حوضان بملصقي «أخف من» و«أثقل من»، تفاحة مرجعية، أشياء صفية، كتاب النشاط ص٣٣", "الوزن، أثقل من، أخف من، يحمل، التصنيف، المرجع", "يحمل المعلم بالونًا كبيرًا بيد وحجرًا صغيرًا بالأخرى، ويسأل: «أيهما أكبر؟ وأيهما أثقل؟».", "1. التهيئة: يعرض المعلم البالون والحجر، والتلاميذ يتوقعون ويجربون (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أقارن الأوزان»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n3. النمذجة: يحمل المعلم شيئين ويفكر بصوت مرتفع: «أشعر أن الكتاب يشد يدي أكثر، إذن هو أثقل»، والتلاميذ يجربون الحمل ويرددون المفردات (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. نشاط ثنائي: يوزع أزواج أشياء، والتلاميذ يتوقعون ثم يحملون ويقولون: «... أثقل من ...» (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كتاب: المعلم: يوجه إلى ص٢٩ (الأخف والأثقل) يحددون الأثقل والأخف في الصور (4 دقائق)\nالاستراتيجيات: التعلم بالمحسوسات.\n\n6. عرض الهدف: يعرض المعلم: «أستطيع أن أصنف الأشياء حسب وزنها»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. نشاط: المعلم: يوزع أشياء وتفاحة مرجعية لكل مجموعة يصنفون الأشياء في الحوضين ويتحققون بالحمل (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. كتاب: المعلم: يوجه إلى ص٣٠ (أخف من وأثقل من) يصنفون الأشياء المرسومة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٣٣ (خفيف أم ثقيل؟)، والتلاميذ يحلون التمارين (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n10. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "١. (مستوى المعرفة) السؤال: احمل القلم والكتاب. أيهما أثقل؟ — الإجابة النموذجية: الكتاب.\n٢. (مستوى التطبيق) السؤال: أكمل: الريشة ... من الحجر. — الإجابة النموذجية: أخف.\n٣. (مستوى الاستدلال) السؤال: هل البالون الكبير أثقل من الحجر الصغير؟ لماذا؟ — الإجابة النموذجية: لا؛ الحجم الكبير لا يعني وزنًا أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يحمل التلميذ في كل يد شيئًا (كتاب وممحاة) ويصف مع المعلم: «الكتاب أثقل من الممحاة، والممحاة أخف من الكتاب»، ثم يكرر مع شيئين آخرين، ثم يُسأل: أكمل: الحقيبة ... من القلم.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإحضار شيء كبير خفيف (بالون أو علبة فارغة) وشيء صغير ثقيل (حجر)، والتنبؤ بالأثقل ثم التحقق بالحمل، ثم يصنفون خمسة أشياء إلى أخف وأثقل من كتاب الرياضيات.\n\n٤. (مستوى المعرفة) السؤال: الممحاة: أخف من التفاحة أم أثقل؟ — الإجابة النموذجية: أخف.\n٥. (مستوى التطبيق) السؤال: ضع القارورة الممتلئة في الحوض المناسب. — الإجابة النموذجية: أثقل من (غالبًا).\n٦. (مستوى الاستدلال) السؤال: لماذا وضعت هذا الشيء في حوض «أثقل من»؟ — الإجابة النموذجية: لأنه شد يدي أكثر من التفاحة.\n\n• نشاط علاجي (لمن لم يتقن): يحمل التلميذ في كل يد شيئًا (كتاب وممحاة) ويصف مع المعلم: «الكتاب أثقل من الممحاة، والممحاة أخف من الكتاب»، ثم يكرر مع شيئين آخرين، ثم يُسأل: أكمل: الحقيبة ... من القلم.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإحضار شيء كبير خفيف (بالون أو علبة فارغة) وشيء صغير ثقيل (حجر)، والتنبؤ بالأثقل ثم التحقق بالحمل، ثم يصنفون خمسة أشياء إلى أخف وأثقل من كتاب الرياضيات.", "١. (مستوى المعرفة) السؤال: أيهما أخف: الورقة أم الحقيبة؟ — الإجابة النموذجية: الورقة.\n٢. (مستوى التطبيق) السؤال: صِف وزن التفاحة مقارنة بحبة ا ون معه (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. نشاط: المعلم: يوزع أشياء ومكعبات يجدون عدد المكعبات الموازنة لكل شيء ويسجلون (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٣٥ (خمسة مكعبات)، والتلاميذ يحلون المهمة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "١. (مستوى المعرفة) السؤال: الكفة اليمنى منخفضة. أين الشيء الأثقل؟ — الإجابة النموذجية: في الكفة اليمنى.\n٢. (مستوى التطبيق) السؤال: ضع القلم والممحاة في الميزان. أيهما أثقل؟ — الإجابة النموذجية: حسب النتيجة.\n٣. (مستوى الاستدلال) السؤال: ماذا يعني أن الكفتين في مستوى واحد؟ — الإجابة النموذجية: الوزنان متساويان (متوازن).\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم مع التلميذ مكعبًا في كفة وكتابًا في الأخرى، فيلاحظ أن الكفة الأثقل تنخفض والأخف ترتفع ويقول ذلك بلسانه، ثم يضعان شيئين جديدين ويُسأل: أي الكفتين فيها الشيء الأخف؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإيجاد عدد المكعبات التي توازن قلمًا ثم ممحاة، ومقارنة وزنيهما بعدد المكعبات، ثم يشرحون كيف يعرفون أن الكفتين متوازنتان.\n\n٤. (مستوى المعرفة) السؤال: كم مكعبًا وازن القلم؟ — الإجابة النموذجية: حسب التجربة.\n٥. (مستوى التطبيق) السؤال: الكرة وازنت ٨ مكعبات والتفاحة ٥. أيهما أثقل؟ — الإجابة النموذجية: الكرة.\n٦. (مستوى الاستدلال) السؤال: كم مكعبًا يزيد وزن الكرة عن التفاحة؟ — الإجابة النموذجية: ٣ مكعبات.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم مع التلميذ مكعبًا في كفة وكتابًا في الأخرى، فيلاحظ أن الكفة الأثقل تنخفض والأخف ترتفع ويقول ذلك بلسانه، ثم يضعان شيئين جديدين ويُسأل: أي الكفتين فيها الشيء الأخف؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإيجاد عدد المكعبات التي توازن قلمًا ثم ممحاة، ومقارنة وزنيهما بعدد المكعبات، ثم يشرحون كيف يعرفون أن الكفتين متوازنتان.", "١. (مستوى المعرفة) السؤال: أي كفة ترتفع: كفة الريشة أم كفة الحجر؟ — الإجابة النموذجية: كفة الريشة.\n٢. (مستوى التطبيق) السؤال: ارسم ميزانًا فيه تفاحة أثقل من فراولة. — الإجابة النموذجية: كفة التفاحة منخفضة.\n٣. (مستوى الاستدلال) السؤال: ميزان متوازن فيه كرة ومكعبات. ماذا نعرف عن وزن الكرة؟ — الإجابة النموذجية: يساوي وزن المكعبات.\n\n٤. (مستوى المعرفة) السؤال: الممحاة توازن ٢ مكعب. اكتب وزنها بالمكعبات. — الإجابة النموذجية: ٢ مكعب.\n٥. (مستوى التطبيق) السؤال: أيهما أخف: شيء يوازن ٤ مكعبات أم ٧؟ — الإجابة النموذجية: الذي يوازن ٤.\n٦. (مستوى الاستدلال) السؤال: ابنِ نموذجين من ٥ مكعبات بشكلين مختلفين. هل يتوازنان؟ لماذا؟ — الإجابة النموذجية: نعم؛ لأن عدد المكعبات متساوٍ.", "يصنع الطفل ميزانًا بسيطًا من علاقة ملابس وكيسين، ويقارن أوزان أشياء، ويراجع كتاب التلميذ ص٣١.\nيحل الطفل كتاب النشاط ص٣٥، ويوازن ألعابه بأشياء متماثلة في البيت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=23"]}, {"num": "٢", "ax": "ترتيب الأشياء حسب الوزن باستخدام الميزان", "sb": "٣١", "ab": "٣٣–٣٥", "f": ["١. يرتب ثلاثة أشياء حسب الوزن باستخدام الميزان (15 دقيقة)\n٢. يحل مشكلة: إيجاد الأثقل بأقل عدد من الوزنات (10 دقائق)\n\nمخرج تعليمي آخر: يسجل نتائج الوزن في جدول بسيط (15 دقيقة)", "المخرج ١: تطبيق — يرتب ثلاثة أشياء حسب الوزن باستخدام الميزان.\nالمخرج ٢: تحليل — يحل مشكلة: إيجاد الأثقل بأقل عدد من الوزنات.\nالمخرج الآخر: تطبيق — يسجل نتائج الوزن في جدول بسيط.", "التعلم المبني على حل المشكلات، التعلم التعاوني، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، أخرى: موازين، ثلاثة صناديق متشابهة مختلفة الوزن", "الأثقل، الأخف، الترتيب، النتيجة", "يعرض المعلم ثلاثة صناديق متشابهة الشكل، ويسأل: «كيف نعرف أي صندوق هو الأثقل دون أن نفتحها؟».", "1. التهيئة: يعرض المعلم الصناديق ويطرح المشكلة، والتلاميذ يقترحون استخدام الميزان (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أرتب الأشياء بالميزان»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حل المشكلة: يوزع المعلم الصناديق والموازين على المجموعات، والتلاميذ يزنون مثنى مثنى ويرتبون ويسجلون النتائج (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. مشاركة: يقارن المعلم نتائج المجموعات وطرقها، والتلاميذ يعرضو  والتلاميذ يقفون أو يجلسون (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أميز الزوجي والفردي»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n3. كتاب: المعلم: يوجه إلى ص٣٤ (زوجي أم فردي؟): الجوارب والقفازات يعدّون ويحددون نوع العدد (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. فرز البطاقات: يوزع المعلم بطاقات أعداد حتى ٣٠، ويفرزونها التلميذ في عمودين: زوجي وفردي (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. بطاقة الخروج: يكتب كل تلميذ على بطاقة إجابة سؤال «مع ليلى ٩ قطع حلوى تريد تقسيمها مع أختها بالتساوي. هل يمكن ذلك دون باقٍ» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (9 دقائق)\nالاستراتيجيات: التقويم البنائي.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. ختام الدرس – لا نترك أحدًا وحده: ترتب كل مجموعة مكعبات حتى ٢٠ أزواجًا، فإن بقي مكعب وحده فالعدد فردي، ثم يتحدث الطلبة عن عادة العمانيين في ضم الوحيد إليهم ومساعدة الجار (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: كم جوربًا في الصورة؟ هل العدد زوجي؟ — الإجابة النموذجية: حسب الصورة.\n٢. (مستوى التطبيق) السؤال: ضع البطاقة ١٧ في العمود المناسب. — الإجابة النموذجية: فردي.\n٣. (مستوى الاستدلال) السؤال: ٢ + ٤ = ٦. هل مجموع عددين زوجيين زوجي دائمًا؟ جرّب مثالًا آخر. — الإجابة النموذجية: نعم، مثل ٤ + ٦ = ١٠.\n\n• نشاط علاجي (لمن لم يتقن): يرتب التلميذ مع المعلم ٥ مكعبات أزواجًا فيبقى مكعب وحده، ويقول: «تبقى واحد، إذن ٥ عدد فردي»، ثم يكرر مع ٧، ثم يُسأل: رتب ٩ مكعبات أزواجًا، كم يتبقى؟ (١).\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصنيف الأعداد ١١ و١٨ و٢٣ و٣٠ و٢٧ في جدول (زوجي / فردي)، ثم يحددون العدد الفردي بين ٢٦ و٢٨ (٢٧) ويشرحون كيف تتناوب الأعداد الزوجية والفردية.", "١. (مستوى المعرفة) السؤال: زوجي أم فردي: ٢١؟ — الإجابة النموذجية: فردي.\n٢. (مستوى التطبيق) السؤال: اكتب عددين زوجيين بين ٢٠ و٣٠. — الإجابة النموذجية: مثل ٢٢، ٢٤.\n٣. (مستوى الاستدلال) السؤال: مع ليلى ٩ قطع حلوى تريد تقسيمها مع أختها بالتساوي. هل يمكن ذلك دون باقٍ؟ — الإجابة النموذجية: لا؛ ٩ عدد فردي.", "يصنف الطفل أعدادًا يراها في البيت (أرقام الصفحات، الساعة) إلى زوجية وفردية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=25"]}]}, {"id": "١٢-١", "title": "ترتيب الأعداد", "unit": "الوحدة ١٢: ترتيب الأعداد (١)", "u": 12, "week": "الثالث عشر (٢٩/١١ – ٣/١٢/٢٠٢٦م)", "tb": "١١٠–١١٣، ١١٦", "periods": [{"num": "١", "ax": "الأعداد الترتيبية: الأول، الثاني، ... العاشر + الأعداد بالترتيب: أنماط الخرز", "sb": "٣٥", "ab": "—", "f": ["١. يستخدم الأعداد الترتيبية من الأول إلى العاشر (10 دقائق)\n٢. يحدد موقع شخص أو شيء في صف باستخدام العدد الترتيبي (5 دقائق)\n٣. يكمل نمط خرز ويحدد لون خرزة في موقع ترتيبي (5 دقائق)\n٤. يصف موقع الخرزة بالعدد الترتيبي (5 دقائق)\n\nمخرج تعليمي آخر:\nيميز العدد الترتيبي من العدد الأصلي (5 دقائق)\nيصمم سلسلة خرز بنمط ويطرح سؤالًا ترتيبيًا عليها (10 دقائق)", "المخرج ١: تذكر — يستخدم الأعداد الترتيبية من الأول إلى العاشر.\nالمخرج ٢: تطبيق — يحدد موقع شخص أو شيء في صف باستخدام العدد الترتيبي.\nالمخرج ٣: تحليل — يكمل نمط خرز ويحدد لون خرزة في موقع ترتيبي.\nالمخرج ٤: تطبيق — يصف موقع الخرزة بالعدد الترتيبي.\nالمخرج الآخر: فهم — يميز العدد الترتيبي من العدد الأصلي.\nالمخرج الآخر: إبداع — يصمم سلسلة خرز بنمط ويطرح سؤالًا ترتيبيًا عليها.", "التعلم بالنمذجة، التعلم المبني على اللعب، التعلم التعاوني، التعلم بالاكتشاف، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، أخرى: بطاقات الترتيب (كتاب النشاط ص٦٣–٦٥)، تقويم\nالكتاب، السبورة الذكية، الأقلام، أخرى: خرز ملون وخيوط، مكعبات ملونة، كتاب النشاط ص٤٠", "الأول، الثاني، الثالث، العاشر، الأخير، الترتيب، النمط، الخرزة الخامسة، يتكرر", "يُجري المعلم سباقًا قصيرًا في المشي بين خمسة تلاميذ، ويسأل: «من وصل أولًا؟ من الثاني؟ من الأخير؟».", "1. التهيئة: ينفذ المعلم السباق ويسأل عن الترتيب، والتلاميذ يذكرون الترتيب (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أستخدم الأعداد الترتيبية»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. النمذجة: يصف المعلم ١٠ تلاميذ في طابور ويعلق على كل منهم بطاقة ترتيبية، والتلاميذ يقرؤون البطاقات: الأول ... العاشر (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة الطابور: يعطي المعلم تعليمات: «الرابع يرفع يده، السابع يقفز»، والتلاميذ ينفذون حسب مواقعهم (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تطبيق: يعرض المعلم صفًا من الصور ويطرح أسئلة الترتيب، والتلاميذ يحددون مواقع الصور (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. عرض الهدف: يعرض المعلم: «أستطيع أن أحدد موقع الخرزة في النمط»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. كتاب: المعلم: يوجه إلى ص٣٥ (الأعداد بالترتيب) ويساعد في رسم السلاسل يكملون السلاسل ويحددون لون الخرزة المطلوبة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تصميم السلسلة: يوزع المعلم الخرز والخيوط، ويصمم كل تلميذ سلسلة بنمط ويسأل زميله عن الخرزة الثامنة مثلًا (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. كتاب النشاط: يوجه المعلم إلى كتاب النشاط ص٤٠ (الترتيب)، والتلاميذ يحلون التمارين (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n10. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: من الأول في الطابور؟ — الإجابة النموذجية: تحديد صحيح.\n٢. (مستوى التطبيق) السؤال: ما ترتيب التلميذ الذي يقف بعد الثالث؟ — الإجابة النموذجية: الرابع.\n٣. (مستوى الاستدلال) السؤال: في طابور من ٨، من هو الأخير؟ ما ترتيبه؟ — الإجابة النموذجية: الثامن.\n\n• نشاط علاجي (لمن لم يتقن): يصطف خمسة تلاميذ أمام الصف ويعطي المعلم كلًا منهم بطاقة (الأول، الثاني، الثالث، الرابع، الخامس) ويقرأها التلميذ مع المعلم مشيرًا إلى كل واحد، ثم يُسأل: من يقف في الترتيب الثالث؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإكمال نمط خرز (أحمر، أزرق، أحمر، ...) حتى الخرزة العاشرة وتحديد لون الخرزة السابعة والعاشرة، ثم يشرحون الفرق بين «٧ خرزات» و«الخرزة السابعة».\n\n٤. (مستوى المعرفة) السؤال: ما لون الخرزة الثالثة في: أحمر، أصفر، أحمر، أصفر؟ — الإجابة النموذجية: أحمر.\n٥. (مستوى التطبيق) السؤال: ما لون الخرزة العاشرة في النمط نفسه؟ — الإجابة النموذجية: أصفر.\n٦. (مستوى الاستدلال) السؤال: في نمط أحمر، أحمر، أزرق: ما لون التاسعة؟ — الإجابة النموذجية: أزرق.\n\n• نشاط علاجي (لمن لم يتقن): يصطف خمسة تلاميذ أمام الصف ويعطي المعلم كلًا منهم بطاقة (الأول، الثاني، الثالث، الرابع، الخامس) ويقرأها التلميذ مع المعلم مشيرًا إلى كل واحد، ثم يُسأل: من يقف في الترتيب الثالث؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإكمال نمط خرز (أحمر، أزرق، أحمر، ...) حتى الخرزة العاشرة وتحديد لون الخرزة السابعة والعاشرة، ثم يشرحون الفرق بين «٧ خرزات» و«الخرزة السابعة».", "١. (مستوى المعرفة) السؤال: أشر إلى الحيوان الثاني. — الإجابة النموذجية: تحديد صحيح.\n٢. (مستوى التطبيق) السؤال: ما ترتيب يوم الاثنين إذا بدأ الأسبوع بالأحد؟ — الإجابة النموذجية: الثاني.\n٣. (مستوى الاستدلال) السؤال: كم شخصًا قبل الخامس في الطابور؟ — الإجابة النموذجية: ٤.\n\n٤. (مستوى المعرفة) السؤال: لوّن الخرزة الخامسة باللون الأخضر. — الإجابة النموذجية: تلوين صحيح.\n٥. (مستوى التطبيق) السؤال: ما ترتيب أول خرزة زرقاء في: أحمر، أحمر، أزرق؟ — الإجابة النموذجية: الثالثة.\n٦. (مستوى الاستدلال) السؤال: صمّم نمطًا تكون فيه الخرزة السادسة صفراء. — الإجابة النموذجية: تصميم صحيح.", "يستخدم الطفل الأعداد الترتيبية في البيت (أول من يستيقظ، ثاني طبق...) ويراجع كتاب التلميذ ص٣٥.\nيحل الطفل كتاب النشاط ص٤٠، ويصمم سلسلة خرز أو أزرار بنمط مع أسرته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=26"]}, {"num": "٢", "ax": "ترتيب الأعداد على خط الأعداد ولوحة المائة", "sb": "٣٥", "ab": "٣٩", "f": ["١. يرتب مجموعة أعداد حتى ٣٠ من الأصغر إلى الأكبر (20 دقيقة)\n٢. يحدد الأعداد المفقودة على خط الأعداد (10 دقائق)\n\nمخرج تعليمي آخر: يقارن عددين باستخدام: أكبر من، أصغر من (10 دقائق)", "المخرج ١: تطبيق — يرتب مجموعة أعداد حتى ٣٠ من الأصغر إلى الأكبر.\nالمخرج ٢: تحليل — يحدد الأعداد المفقودة على خط الأعداد.\nالمخرج الآخر: فهم — يقارن عددين باستخدام: أكبر من، أصغر من.", "التعلم المبني على اللعب، التعلم الذاتي، التعلم التعاوني", "الكتاب، السبورة الذكية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: لوحة المائة، بطاقات ر: ٢١ أم ١٢؟ — الإجابة النموذجية: ٢١.\n٣. (مستوى الاستدلال) السؤال: رتّب من الأكبر إلى الأصغر: ١٩، ٢٩، ٩، ٢٥. — الإجابة النموذجية: ٢٩، ٢٥، ١٩، ٩.", "يحل الطفل كتاب النشاط ص٣٩، ويرتب بطاقات أعداد يصنعها مع أسرته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/math/?l=26"]}]}, {"id": "١٢-٢", "title": "بين", "unit": "الوحدة ١٢: ترتيب الأعداد (١)", "u": 12, "week": "الرابع عشر (٦ – ١٠/١٢/٢٠٢٦م)", "tb": "١١٤–١١٧", "periods": [{"num": "١", "ax": "معنى «بين» على شريط الأعداد ولوحة المائة", "sb": "٣٦", "ab": "٥٣", "f": ["١. يحدد الأعداد التي تقع بين عددين حتى ٥٠ (15 دقيقة)\n٢. يوضح معنى كلمة «بين» (15 دقيقة)\nمخرج تعليمي آخر: يحدد العدد الذي في المنتصف بين عددين قريبين (10 دقائق)", "المخرج ١: تطبيق — يحدد الأعداد التي تقع بين عددين حتى ٥٠.\nالمخرج ٢: فهم — يوضح معنى كلمة «بين».\nالمخرج الآخر: تحليل — يحدد العدد الذي في المنتصف بين عددين قريبين.", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني", "الكتاب، السبورة الذكية، جهاز عرض البيانات، أخرى: لوحة المائة (كتاب النشاط ص٥٣)، بطاقات الترتيب، أقلام تلوين", "بين، قبل، بعد، المنتصف", "يقف المعلم بين تلميذين ويقول: «أنا أقف بين سالم وأحمد»، ثم يطلب من تلميذ الوقوف بين اثنين ووصف موقعه.", "1. التهيئة: يمثل المعلم معنى «بين» بالوقوف، والتلاميذ يصفون المواقع (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أجد الأعداد بين عددين»، والتلاميذ يقرؤون الهدف (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. النمذجة: يحوّط المعلم ٢٣ و٢٧ على لوحة المائة ويلوّن الأعداد بينهما، والتلاميذ يقرؤون الأعداد: ٢٤، ٢٥، ٢٦ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط ثنائي: يعطي أزواج أعداد على لوحة المائة، والتلاميذ يلونون الأعداد بين كل زوج ويعدّونها (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تطبيق فردي: يكتب المعلم أسئلة: «ما الأعداد بين ٣٨ و٤٢؟»، والتلاميذ يكتبون الإجابات (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "١. (مستوى المعرفة) السؤال: ما الع ياضي بلا أربطة و٣ أربطة ملونة، ماصات ملونة", "التركيبة، الاحتمال، منظم، كل الطرق، الطريقة المنظمة، التنبؤ", "يعرض المعلم قميصين (أحمر وأزرق) وسروالين (أسود وأبيض)، ويسأل: «كم طريقة مختلفة يمكن أن أرتدي بها قميصًا وسروالًا؟».", "1. التهيئة: يعرض المعلم الملابس ويطرح السؤال، والتلاميذ يتوقعون العدد (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. عرض الهدف: يعرض المعلم: «أستطيع أن أجد كل التركيبات»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. النمذجة: يثبت المعلم قميصًا ويغير السروال، ثم القميص الآخر، ويسجل ٤ تركيبات، والتلاميذ يتابعون الطريقة المنظمة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط: المعلم: يعطي ٣ قمصان و٢ سروال (رسومات للتلوين) يلونون كل التركيبات الممكنة ويعدّونها (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. مشاركة: يقارن المعلم نتائج المجموعات، والتلاميذ يتحققون من عدم التكرار (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. عرض الهدف: يعرض المعلم: «أستطيع أن أجد التركيبات بطريقة منظمة»، والتلاميذ يقرؤون الهدف (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n7. تجربة الأربطة: يوجه المجموعات لتجريب الأربطة وتسجيل التركيبات، والتلاميذ يجربون ويسجلون ويقارنون بالتوقع (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تحدي الماصات: يعطي المعلم ماصات بلونين لصنع أزواج، والتلاميذ يجدون كل الأزواج الممكنة من الألوان (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n9. مشاركة: يعرض المعلم طرق المجموعات، والتلاميذ يشرحون طريقتهم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. الختام: يطرح المعلم أسئلة التقويم الختامي، والتلاميذ يجيبون (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "١. (مستوى المعرفة) السؤال: قميص واحد وسروالان. كم تركيبة؟ — الإجابة النموذجية: ٢.\n٢. (مستوى التطبيق) السؤال: قميصان وسروالان. كم تركيبة؟ — الإجابة النموذجية: ٤.\n٣. (مستوى الاستدلال) السؤال: ٣ قمصان وسروالان. كم تركيبة؟ — الإجابة النموذجية: ٦.\n\n• نشاط علاجي (لمن لم يتقن): يعطي المعلم التلميذ صورتي قميصين (أحمر وأزرق) وصورة سروال واحد، فيضع كل قميص مع السروال ويعد التركيبات (٢)، ثم يضيف سروالًا ث   const ab = mode === "sep" ? p.ab : (uniq(l.periods.map(x => x.ab)).join("، ") || "—");
  $("head").innerHTML = `<div class="head"><div class="lesson"><span class="code">${esc(l.id)}</span>${esc(l.title)}</div>
   <div class="meta"><span><b>الوحدة:</b>${esc(l.unit)}</span><span><b>الأسبوع:</b>${esc(l.week)}</span>
   <span><b>كتاب التلميذ:</b>ص${esc(sb)}</span><span><b>كتاب النشاط:</b>${ab === "—" ? "—" : "ص" + esc(ab)}</span>
   <span><b>دليل المعلم:</b>ص${esc(l.tb)}</span>
   <span><b>${mode === "sep" ? "الحصة" : "عدد الحصص"}:</b>${mode === "sep" ? p.num + " من " + AR(l.periods.length) : AR(l.periods.length) + " حصص × ٤٠ دقيقة"}</span></div>
   ${mode === "sep" ? `<div class="axis"><b>محور الحصة:</b> ${esc(p.ax)}</div>` : ""}</div>`;
  $("cards").innerHTML = ITEMS.map((t, i) => `<section class="card"><div class="ch"><span class="n">${AR(i + 1)}</span>
    <span class="ct">${t}</span><button class="copy" data-i="${i}">نسخ</button></div>
    <div class="cb" id="cb${i}">${esc(fieldText(l, i))}</div><div class="hint" id="h${i}">لم يسمح المتصفح بالنسخ التلقائي: النص محدّد الآن، اضغط Ctrl+C أو اختر «نسخ» من القائمة.</div></section>`).join("");
  document.querySelectorAll(".copy").forEach(b => b.onclick = () => copy(+b.dataset.i, b));
}
function selectText(el){
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta); return ok;
}
async function copy(i, btn){
  const text = fieldText(D[li], i);
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch(e) {}
  if (!ok) ok = legacyCopy(text);
  if (ok){
    btn.textContent = "تم النسخ ✓"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "نسخ"; btn.classList.remove("ok"); }, 1600);
  } else {
    selectText($("cb" + i)); $("h" + i).classList.add("show");
  }
}
$("mSep").onclick = () => { mode = "sep"; render(); };
$("mMer").onclick = () => { mode = "mer"; render(); };
$("sel").onchange = e => { li = +e.target.value; pi = 0; render(); };
$("prev").onclick = () => { if (li > 0){ li--; pi = 0; render(); } };
$("next").onclick = () => { if (li < D.length - 1){ li++; pi = 0; render(); } };
fill(); render();
