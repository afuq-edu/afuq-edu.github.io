ع البطاقة المناسبة.", "1. التهيئة: تقرأ المعلمة العبارة الأولى، والتلاميذ يرفعون بطاقة «خطأ» ويعللون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أتعاون مع زملائي ص76: توجّه المعلمة إلى نشاط المجموعات وتقرأ العبارات وتترك مجالًا للتفكير، وتناقش كل مجموعة العبارات (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. إجابات شفوية: تطلب المعلمة من مجموعات الإجابة شفويًا وتصحح (تقويم تكويني)، والتلاميذ يجيبون ويصححون السلوك الخاطئ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. لعبة «صح أم خطأ»: تعرض المعلمة عبارات أخرى: أستنجي باليمين، أترك الحمام متسخًا، أغسل يديّ، والتلاميذ يرفعون البطاقات بسرعة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الماء نعمة: تؤكد المعلمة عدم الإسراف في الماء، والتلاميذ يذكرون طرقًا للمحافظة على الماء (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. أختبر تعلمي ص77: توجه المعلمة حل النشاطين: الطهارة من النجاسات، والمحافظة على الصحة، والتلاميذ يحلون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. تصحيح: تصحح المعلمة وتناقش (تقويم تكويني)، والتلاميذ يعللون إجاباتهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. خريطة «طهارتي»: تكمل المعلمة مع المجموعات خريطة مفاهيم تربط الدروس، وتضيف كل مجموعة فرعًا بمعلومة من درس (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n9. وعد الطهارة: تطلب المعلمة جملة وعد، والتلاميذ يقولون: أعد أن أحافظ على طهارتي (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] هل ترك الماء مفتوحًا سلوك صحيح؟\n   الإجابة النموذجية: لا، إنه إسراف.\n2) [مستوى التطبيق] صحح السلوك: استنجى سالم بيده اليمنى.\n   الإجابة النموذجية: يستنجي بيده اليسرى.\n3) [مستوى الاستدلال] لماذا يُعدّ ترك الحمام متسخًا سلوكًا خاطئًا؟\n   الإجابة النموذجية: لأنه يؤذي الآخرين ويخالف نظافة المسلم.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الحوار المصوّر عن الاستنجاء بالصور، ويوضح أنه تطهير مكان خروج البول والغائط بالماء، ثم يسأله: بماذا نستنجي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالربط بين دروس النجاسات وآداب قضاء الحاجة والاستنجاء في مخطط بسيط، وتوضيح لماذا نستنجي قبل الصلاة.\n\n4) [مستوى المعرفة] بماذا نزيل النجاسة عند الاستنجاء؟\n   الإجابة النموذجية: بالماء.\n5) [مستوى التطبيق] اذكر درسين يتصلان بالطهارة.\n   الإجابة النموذجية: مثل: النجاسات، وآداب قضاء الحاجة.\n6) [مستوى الاستدلال] كيف تحافظ الطهارة على صحتنا؟\n   الإجابة النموذجية: تمنع الجراثيم والأمراض.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الحوار المصوّر عن الاستنجاء بالصور، ويوضح أنه تطهير مكان خروج البول والغائط بالماء، ثم يسأله: بماذا نستنجي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالربط بين دروس النجاسات وآداب قضاء الحاجة والاستنجاء في مخطط بسيط، وتوضيح لماذا نستنجي قبل الصلاة.", "1) [مستوى المعرفة] ارفع البطاقة: «أغسل يديّ بعد الاستنجاء».\n   الإجابة النموذجية: صح.\n2) [مستوى التطبيق] اذكر سلوكًا خاطئًا عند التطهر.\n   الإجابة النموذجية: مثل: الإسراف في الماء أو الاستنجاء باليمين.\n3) [مستوى الاستدلال] اقترح لافتة توضع في دورة المياه.\n   الإجابة النموذجية: مثل: «أستنجي بيساري، وأحافظ على الماء، وأترك المكان نظيفًا».\n\n4) [مستوى المعرفة] أكمل: أستنجي بيدي ...\n   الإجابة النموذجية: اليسرى.\n5) [مستوى التطبيق] هل تصح الصلاة بلا طهارة؟\n   الإجابة النموذجية: لا.\n6) [مستوى الاستدلال] اكتب ثلاث خطوات تحافظ بها على طهارتك يوميًا.\n   الإجابة النموذجية: أستنجي بالماء، أغسل يديّ بالصابون، ألبس ثيابًا طاهرة.", "للطالب: يكمل نشاط ص76 ويتجنب الإسراف في الماء.\nلولي الأمر: يتابع إغلاق طفله صنبور الماء بعد الاستعمال.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 74–77.\nللطالب: يراجع دروس الطهارة ويكمل ص77.\nلولي الأمر: يتابع طفله في تطبيق آداب الطهارة يوميًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=30"]}], "weeks": [16]}, {"id": "musaada", "title": "أساعد الآخرين", "unit": "الوحدة الرابعة", "sb": "كتاب الطالب – الجزء الثاني: ص 78–82", "tg": "دليل المعلم: ص 101–103", "n": 1, "periods": [{"k": 1, "axis": "قيمة التعاون ومساعدة الآخرين (حوار أحمد ومريم وأمهما) واقتراح أعمال المساعدة + تطبيق «وتعاونوا على البر والتقوى» (أفكر وأطبق) وأختبر تعلمي", "week": "الأسبوع السابع عشر (27–30/12/2026م)", "f": ["1. يتعرّف قيمة التعاون ومساعدة الآخرين في الإسلام.\n2. يقترح أعمالًا يساعد بها الآخرين في أماكن مختلفة.\n3. يشارك مجموعته في العصف الذهني.\n4. يطبق قول الله تعالى: «وتعاونوا على البر والتقوى».\n5. يقيّم بعض التصرفات في مساعدة الآخرين.\n6. يحرص على تقديم المساعدة المناسبة للآخرين.\n\nمخرج تعليمي آخر:\nيستشعر سرور الآخرين عند مساعدتهم.\nيدرك أن التعاون يكون في الخير فقط.", "المخرج 1: يتعرّف قيمة التعاون ومساعدة الآخرين في الإسلام. ← فهم\nالمخرج 2: يقترح أعمالًا يساعد بها الآخرين في أماكن مختلفة. ← إبداع\nالمخرج 3: يشارك مجموعته في العصف الذهني. ← تطبيق\nالمخرج 4: يطبق قول الله تعالى: «وتعاونوا على البر والتقوى». ← تطبيق\nالمخرج 5: يقيّم بعض التصرفات في مساعدة الآخرين. ← تقييم\nالمخرج 6: يحرص على تقديم المساعدة المناسبة للآخرين. ← تطبيق\nالمخرج الآخر: يستشعر سرور الآخرين عند مساعدتهم. ← تقييم\nالمخرج الآخر: يدرك أن التعاون يكون في الخير فقط. ← فهم", "التعلم التعاوني، التعلم التشاركي، التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم الذاتي\nاستراتيجيات أخرى من دليل المعلم: تمثيل الأدوار، العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام", "التعاون، المساعدة، إدخال السرور، البر، التقوى", "تكلّف المعلمة تلميذًا بترتيب كتب الصف وحده، ثم تطلب من آخر مساعدته، وتسأل: متى انتهى العمل أسرع؟ وكيف شعر الأول؟", "1. التهيئة: تنفذ المعلمة موقف الترتيب وتسأل، والتلاميذ يلاحظون أثر المساعدة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أستمع وأناقش ص78: تقرأ المعلمة الحوار بنبرات مناسبة وتركز على: «لقد كنتِ رائعة بمساعدتك لها»، «هذا عمل يرضي الله ورسوله»، «الله يحب الذين يدخلون السرور على الآخرين»، والتلاميذ يمثلون الحوار ويرددون العبارات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أناقش: تسأل المعلمة: لماذا فرحت الأم؟ من الذي ساعدته مريم؟ (تقويم تكويني)، والتلاميذ يجيبون ويذكرون مواقف مساعدة (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n4. أتعاون مع زملائي ص79: تقسم المعلمة أماكن على المجموعات: البيت، المسجد، الشارع، المدرسة، الحديقة، لاقتراح عملين في كل مكان، وتقترح المجموعات وتعرض (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. أعزز: تكتب المعلمة المقترحات وتعزز المجموعات، والتلاميذ يختارون عملًا ينفذونه هذا الأسبوع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أفكر وأطبق ص80: توضح المعلمة مشاهد الصور (مساعدة كفيف، حمل أغراض جدة، مساعدة على الغش) وتطلب تقييمها (تقويم تكويني)، والتلاميذ يقيّمون التصرفات ويستبعدون التعاون على الخطأ (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. التعاون في الخير فقط: توضح المعلمة أن المساعدة على الغش ليست تعاونًا محمودًا، والتلاميذ يذكرون أمثلة للتعاون على الخير (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. أختبر تعلمي ص81–82: توجه المعلمة حل الأنشطة: التوصيل، والتقييم، والكتابة، والتلاميذ يحلون الأنشطة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. رضا الله: تختم المعلمة بأن المساعدة تُرضي الله وتُدخل السرور، والتلاميذ يرددون الآية (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] ماذا نسمي العمل مع الآخرين لإنجاز عمل ما؟\n   الإجابة النموذجية: التعاون.\n2) [مستوى التطبيق] اقترح عملًا تساعد به أمك في البيت.\n   الإجابة النموذجية: مثل: ترتيب المائدة.\n3) [مستوى الاستدلال] لماذا يحب الله من يُدخل السرور على الآخرين؟\n   الإجابة النموذجية: لأنه يساعدهم ويفرحهم وينشر المحبة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا لأطفال يساعدون غيرهم (في البيت، في الصف، في الشارع)، ويمثّل معه موقفًا للتعاون، ثم يسأله: اقترح عملًا تساعد به أمك.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة تعاون صفية لأسبوع يوزعون فيها أعمالًا لمساعدة الآخرين، وبيان أثر المساعدة في إدخال السرور على الناس.\n\n4) [مستوى المعرفة] أكمل: «وتعاونوا على البر و...».\n   الإجابة النموذجية: التقوى.\n5) [مستوى التطبيق] هل مساعدة زميل على الغش تعاون صحيح؟\n   الإجابة النموذجية: لا، لأنه تعاون على الخطأ.\n6) [مستوى الاستدلال] صِل الموقف بالمساعدة المناسبة: رجل كفيف عند الطريق ← ...\n   الإجابة النموذجية: أمسك يده وأساعده على عبور الطريق.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا لأطفال يساعدون غيرهم (في البيت، في الصف، في الشارع)، ويمثّل معه موقفًا للتعاون، ثم يسأله: اقترح عملًا تساعد به أمك.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة تعاون صفية لأسبوع يوزعون فيها أعمالًا لمساعدة الآخرين، وبيان أثر المساعدة في إدخال السرور على الناس.", "1) [مستوى المعرفة] اقترح عملًا تساعد به زميلك في المدرسة.\n   الإجابة النموذجية: مثل: أشرح له ما لم يفهمه.\n2) [مستوى التطبيق] هل مساعدة الآخرين ترضي الله؟\n   الإجابة النموذجية: نعم.\n3) [مستوى الاستدلال] اختر مكانًا واقترح فيه عملين للمساعدة.\n   الإجابة النموذجية: المسجد: أرتب المصاحف، وأساعد كبار السن.\n\n4) [مستوى المعرفة] ما معنى «البر»     ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة (الحصة ' + (pi + 1) + ' من ' + L.n + ').'
    : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه الـ' + L.n + '.';
  const tabs = $('#tabs'); tabs.innerHTML = '';
  tabs.style.display = mode === 'sep' ? 'flex' : 'none';
  if (mode === 'sep') L.periods.forEach((P, i) => {
    const b = document.createElement('button');
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', i === pi);
    b.textContent = 'الحصة ' + P.k;
    b.title = P.axis;
    b.onclick = () => { pi = i; render(); };
    tabs.appendChild(b);
  });
  const P = L.periods[pi];
  $('#info').innerHTML = '<div class="row"><span><b>الدرس:</b> ' + L.title + '</span><span><b>الوحدة:</b> ' + L.unit + '</span>' +
    (mode === 'sep' ? '<span><b>' + P.week + '</b></span><span><b>الحصة ' + P.k + ' من ' + L.n + '</b></span>' : '<span><b>عدد الحصص:</b> ' + L.n + '</span>') +
    '</div><div class="row"><span>' + L.sb + '</span><span>' + L.tg + '</span></div>' +
    (mode === 'sep' ? '<div class="axis"><b>محور الحصة:</b> ' + P.axis + '</div>' : '');
  const box = $('#cards'); box.innerHTML = '';
  D.fields.forEach((name, fi) => {
    const c = document.createElement('section'); c.className = 'card';
    const t = fieldText(L, fi);
    c.innerHTML = '<h2><span class="num">' + (fi + 1) + '</span><span class="name"></span><button class="copy" type="button">نسخ</button></h2><pre class="txt"></pre><p class="hint">لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، انسخه يدويًّا.</p>';
    c.querySelector('.name').textContent = name;
    c.querySelector('.txt').textContent = t;
    c.querySelector('.copy').onclick = e => copyText(t, e.currentTarget, c);
    box.appendChild(c);
  });
}
function flash(btn) {
  btn.textContent = 'تم النسخ ✓'; btn.classList.add('done');
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = 'نسخ'; btn.classList.remove('done'); }, 1800);
}
function legacyCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta); return ok;
}
function selectCard(card) {
  card.classList.add('manual');
  const r = document.createRange(); r.selectNodeContents(card.querySelector('.txt'));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
async function copyText(t, btn, card) {
  card.classList.remove('manual');
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); flash(btn); return; }
  } catch (e) {}
  if (legacyCopy(t)) { flash(btn); return; }
  selectCard(card);
}
$('#lesson').onchange = e => { li = +e.target.value; pi = 0; render(); };
$('#mSep').onclick = () => { mode = 'sep'; render(); };
$('#mCom').onclick = () => { mode = 'com'; pi = 0; render(); };
render();
</script>
