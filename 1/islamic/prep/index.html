رى: المصحف الشريف، صورة توضيحية، الأقلام، أخرى: صفحة الملصقات ص89", "الفلق، المعوذات، الاستعاذة، الغاسق، الحسد، شر ما خلق", "تعرض المعلمة صورة شروق الصبح وانفلاق النور من الظلام، وتسأل: ماذا نسمي هذا الوقت؟ هناك سورة سُمّيت باسمه.", "1. التهيئة: تعرض المعلمة صورة الصبح وتسأل، والتلاميذ يجيبون: الصبح / الفجر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. من أنا؟ ص16: تقرأ المعلمة العنصر بنبرات متنوعة وتوضح سبب التسمية وعدد الآيات وموضعها، والتلاميذ يستخرجون: خمس آيات، في الجزء الثلاثين، قبل سورة الناس (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أين أجدها؟: تطلب المعلمة تحديد السورة في المصحف مباشرة، والتلاميذ يفتحون المصحف ويحددون السورة قبل الناس (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n4. أتلو وأفهم ص17: تلاوة المعلمة نموذجية ثم ترديد، مع تصحيح «النفّاثات» بالفاء ثم الثاء (لا تزيد على 7 دقائق) (تقويم تكويني)، والتلاميذ يتلون ويصححون النطق (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. المعوذات: تذكر المعلمة أن الرسول ﷺ أوصى بقراءة الإخلاص والمعوذتين قبل النوم، والتلاميذ يعدّدون المعوذات: الإخلاص والفلق والناس (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. أكتشف المعنى ص18: توضح المعلمة أن النشاط يطلب اختيار الرسمة من الملصقات ووضعها مقابل الكلمة، والتلاميذ يضعون الملصق المناسب أمام: الفلق، غاسق، حاسد (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. من شر ما خلق: تناقش المعلمة المخلوقات الضارة (العقرب، الأفعى، العنكبوت السام) وتستنتج معنى الاستعاذة منها (تقويم تكويني)، والتلاميذ يذكرون مخلوقات ضارة ويستعيذون بالله منها (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. أفكر وأطبق: الحسد: توضح المعلمة أن الحسد تمنّي زوال نعمة الغير، وتطلب تلوين الشكل الذي يحتوي سلوك الحاسد، والتلاميذ يلونون السلوك الخاطئ ويقترحون البديل (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. أختبر تعلمي ص20–21: توجه المعلمة حل الأنشطة: معنى «من شر ما خلق»، كلمة الغسق، كتابة الكلمات، والتلاميذ يحلون الأنشطة (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ما معنى «الفلق»؟\n   الإجابة النموذجية: الصبح.\n2) [مستوى التطبيق] كم آية في سورة الفلق؟\n   الإجابة النموذجية: خمس آيات.\n3) [مستوى الاستدلال] لماذا سُمّيت السورة بالفلق؟\n   الإجابة النموذجية: لأنها تبدأ بالاستعاذة برب الفلق أي الصبح.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورة لطلوع الصبح ويربطها بكلمة «الفلق»، ثم يعدّ معه آيات سورة الفلق الخمس في المصحف، ثم يسأله: ما معنى «الفلق»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتفسير سبب تسمية سورة الفلق بهذا الاسم لزميل، وبيان متى نقرأ المعوذات، مع تلاوة السورة بضبط «النفّاثات».\n\n4) [مستوى المعرفة] ما معنى «غاسق إذا وقب»؟\n   الإجابة النموذجية: الليل إذا اشتد ظلامه.\n5) [مستوى التطبيق] ما الحسد؟\n   الإجابة النموذجية: أن يتمنى الإنسان زوال النعمة عن غيره.\n6) [مستوى الاستدلال] نجح زميلك وحصل على جائزة، فكيف يتصرف المسلم الذي لا يحسد؟\n   الإجابة النموذجية: يفرح له ويهنئه ويدعو الله أن يرزقه مثلها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورة لطلوع الصبح ويربطها بكلمة «الفلق»، ثم يعدّ معه آيات سورة الفلق الخمس في المصحف، ثم يسأله: ما معنى «الفلق»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتفسير سبب تسمية سورة الفلق بهذا الاسم لزميل، وبيان متى نقرأ المعوذات، مع تلاوة السورة بضبط «النفّاثات».", "1) [مستوى المعرفة] ما السورة التي تأتي بعد الفلق في المصحف؟\n   الإجابة النموذجية: سورة الناس.\n2) [مستوى التطبيق] انطق كلمة «النفّاثات» نطقًا صحيحًا.\n   الإجابة النموذجية: نطق صحيح بالفاء المشددة ثم الثاء.\n3) [مستوى الاستدلال] متى نقرأ سورة الفلق؟ ومن أوصانا بذلك؟\n   الإجابة النموذجية: قبل النوم، أوصانا الرسول ﷺ.\n\n4) [مستوى المعرفة] اذكر مخلوقًا ضارًا نستعيذ بالله من شره.\n   الإجابة النموذجية: مثل: العقرب.\n5) [مستوى التطبيق] أكمل: «ومن شر حاسد إذا ...».\n   الإجابة النموذجية: حسد.\n6) [مستوى الاستدلال] ماذا تعلمت من سورة الفلق لتطبقه في حياتك؟\n   الإجابة النموذجية: أن أستعيذ بالله من الشر، وأحب الخير للآخرين ولا أحسدهم.", "للطالب: يقرأ عنصر «من أنا؟» ص16 ويتلو السورة على أسرته.\nلولي الأمر: يقرأ مع طفله المعوذات قبل النوم.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 16–21.\nللطالب: يكمل أنشطة ص18–21 ويقرأ السورة قبل النوم.\nلولي الأمر: يناقش طفله في محبة الخير للآخرين وتهنئتهم بنجاحهم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=17"]}], "weeks": [11]}, {"id": "rabbkul", "title": "الله تعالى رب كل شيء", "unit": "الوحدة الثالثة", "sb": "كتاب الطالب – الجزء الثاني: ص 22–28", "tg": "دليل المعلم: ص 72–74", "n": 1, "periods": [{"k": 1, "axis": "مظاهر ربوبية الله في المخلوقات: البحار والجبال والأشجار والناس + ما سخّره الله للإنسان ليتعلم ويعيش، واستشعار الربوبية عند الدعاء", "week": "الأسبوع الحادي عشر (15–19/11/2026م)", "f": ["1. يتعرّف مظاهر ربوبية الله تعالى في البحار والجبال والأشجار والناس.\n2. يجيب عن أسئلة قصة السلحفاة.\n3. يستنتج أن الله رب كل شيء.\n4. يميز بين ما سخّره الله تعالى لتعلّم الإنسان وما سخّره لمعيشته.\n5. يربط الدعاء القرآني بالصورة المناسبة له.\n6. يستشعر ربوبية الله تعالى عند دعائه.\n\nمخرج تعليمي آخر:\nيكتب استنتاجه في المكان المخصص في الكتاب.\nيشكر الله تعالى على ما سخّره له.", "المخرج 1: يتعرّف مظاهر ربوبية الله تعالى في البحار والجبال والأشجار والناس. ← فهم\nالمخرج 2: يجيب عن أسئلة قصة السلحفاة. ← فهم\nالمخرج 3: يستنتج أن الله رب كل شيء. ← تحليل\nالمخرج 4: يميز بين ما سخّره الله تعالى لتعلّم الإنسان وما سخّره لمعيشته. ← تحليل\nالمخرج 5: يربط الدعاء القرآني بالصورة المناسبة له. ← فهم\nالمخرج 6: يستشعر ربوبية الله تعالى عند دعائه. ← تقييم\nالمخرج الآخر: يكتب استنتاجه في المكان المخصص في الكتاب. ← تطبيق\nالمخرج الآخر: يشكر الله تعالى على ما سخّره له. ← تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم التعاوني، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام، أخرى: صفحة الملصقات ص89", "الربوبية، المخلوقات، البيئة، التسخير، الدعاء، ربّ", "تعرض المعلمة صورة سلحفاة على الشاطئ وتسأل: هل تعيش السلحفاة في الماء أم على اليابسة؟ لنستمع إلى قصتها.", "1. التهيئة: تعرض المعلمة الصورة وتسأل، والتلاميذ يتوقعون (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أستمع وأجيب ص22–23: تقرأ المعلمة قصة السلحفاة والولد بأسلوب مؤثر، ثم تناقش السؤالين بعدها، والتلاميذ يجيبون: الله رب كل شيء زوّدها بالقدرة على العيش في الماء واليابسة (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تعلمت أن ص24: تعرض المعلمة الصور: البحر يمنعه الله من أن يطغى، الجبال الراسخة، الأشجار تُسقى بماء واحد وثمارها مختلفة، الناس مختلفون وربهم واحد (تقويم تكويني)، والتلاميذ يصفون كل صورة ويذكرون مظهر الربوبية فيها (5 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n4. الناس سواء: تؤكد المعلمة أن الناس متساوون في الخلق ويتفاضلون بالعمل الصالح، والتلاميذ يذكرون أعمالًا صالحة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. أكتب استنتاجي: تطلب المعلمة كتابة الاستنتاج، والتلاميذ يكتبون: الله رب كل شيء (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. أتعاون مع زملائي ص25: تطلب المعلمة جمع صور الأشياء من صفحة الملصقات ووضعها تحت: «سخّره ربي لأتعلم» و«سخّره ربي لأعيش»، وتصنف المجموعات الصور وتلصقها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أفكر وأطبق ص26: تتلو المعلمة آيات دعاء تبدأ بـ«رب» مثل: «وقل رب ارحمهما كما ربياني صغيرًا»، «رب اجعل هذا البلد آمنًا»، وتطلب وصلها بالصور (تقويم تكويني)، والتلاميذ يصلون كل آية بالصورة المناسبة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. أختبر تعلمي ص27–28: توجه المعلمة ترتيب الكلمات لتكوين جملة «الله تعالى رب كل شيء» وإكمال العبارات والتلوين، والتلاميذ يحلون الأنشطة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أدعو ربي: تطلب المعلمة دعاءً قصيرًا يبدأ بـ«ربِّ»، والتلاميذ يدعون: ربِّ احفظ والديّ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] من الذي زوّد السلحفاة بالقدرة على العيش في الماء واليابسة؟\n   الإجابة النموذجية: الله تعالى.\n2) [مستوى التطبيق] اذكر مظهرًا لربوبية الله في الأشجار.\n   الإجابة النموذجية: تُسقى بماء واحد وتختلف ثمارها وألوانها.\n3) [مستوى الاستدلال] الناس مختلفون في ألوانهم، فبماذا يتفاضلون؟\n   الإجابة النموذجية: بالعمل الصالح.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة السلحفاة بالصور، ويريه صورًا لأشجار مختلفة الثمار، ويردد معه «الله رب كل شيء»، ثم يسأله: من الذي زوّد السلحفاة بقدرتها؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بجمع صور لمخلوقات من البحر والجبال والأشجار، وكتابة جملة عن كل صورة تبيّن مظهرًا من مظاهر ربوبية الله تعالى.\n\n4) [مستوى المعرفة] هل الكتاب مما سخّره الله لنتعلم أم لنعيش؟\n   الإجابة النموذجية: لنتعلم.\n5) [مستوى التطبيق] أكمل الدعاء: «وقل ربِّ ارحمهما كما ...».\n   الإجابة النموذجية: ربياني صغيرًا.\n6) [مستوى الاستدلال] لماذا نبدأ دعاءنا بقول «ربّ»؟\n   الإجابة النموذجية: لأن الله ربنا الذي يرعانا ويستجيب لنا.\n\n• "1) [مستوى المعرفة] كم آية في سورة المسد؟\n   الإجابة النموذجية: خمس آيات.\n2) [مستوى التطبيق] أكمل: «تبّت يدا أبي لهب ...».\n   الإجابة النموذجية: وتبّ.\n3) [مستوى الاستدلال] اتلُ الآية الرابعة مع ضبط «حمّالة».\n   الإجابة النموذجية: «وامرأته حمّالة الحطب».\n\n• نشاط علاجي (لمن لم يتقن): يتلو المعلم سورة المسد آيةً آيةً ويرددها التلميذ مع ضبط «تبّتْ، لهب، حمّالة الحطب، مسد»، ثم يطلب منه إكمال: «تبّت يدا أبي لهب ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتلاوة سورة المسد كاملة غيبًا مع ضبط كلماتها، ثم ترتيب بطاقات آياتها الخمس المخلوطة ترتيبًا صحيحًا.", "1) [مستوى المعرفة] ما آخر كلمة في سورة المسد؟\n   الإجابة النموذجية: «مَسَد».\n2) [مستوى التطبيق] ما السورة التي تأتي بعد المسد في المصحف؟\n   الإجابة النموذجية: سورة الإخلاص.\n3) [مستوى الاستدلال] سمّع سورة المسد كاملة.\n   الإجابة النموذجية: تسميع صحيح.", "للطالب: يسمّع سورة المسد ص13 لأسرته.\nلولي الأمر: يستمع إلى طفله ويصحح نطق «تبّت».\nالمرجع: كتاب الطالب (الجزء الثاني) ص 11، 13.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=19"]}], "weeks": [12]}, {"id": "taam", "title": "من آداب الطعام (حديث شريف)", "unit": "الوحدة الثالثة", "sb": "كتاب الطالب – الجزء الثاني: ص 29–36", "tg": "دليل المعلم: ص 75–77", "n": 1, "periods": [{"k": 1, "axis": "الحديث الشريف «يا غلام، سمِّ الله، وكُل بيمينك، وكُل مما يليك» ومعاني مفرداته + تجنب المخالفات في الطعام وأذكار الطعام، وأختبر تعلمي", "week": "الأسبوع الثاني عشر (22–26/11/2026م (اليوم الوطني))", "f": ["1. يقرأ الحديث الشريف قراءة صحيحة ويحفظه.\n2. يتعرّف معاني: غلام، سمِّ الله، يليك.\n3. يبيّن آداب الطعام المتضمنة في الحديث.\n4. يتجنب السلوكيات المخالفة لتوجيهات الرسول ﷺ في الطعام.\n5. يحفظ ذكر ما قبل الطعام وما بعده.\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nيستخدم يده اليمنى في الطعام.\nيوضح آثار مخالفة آداب الطعام.", "المخرج 1: يقرأ الحديث الشريف قراءة صحيحة ويحفظه. ← تذكر\nالمخرج 2: يتعرّف معاني: غلام، سمِّ الله، يليك. ← فهم\nالمخرج 3: يبيّن آداب الطعام المتضمنة في الحديث. ← فهم\nالمخرج 4: يتجنب السلوكيات المخالفة لتوجيهات الرسول ﷺ في الطعام. ← تطبيق\nالمخرج 5: يحفظ ذكر ما قبل الطعام وما بعده. ← تذكر\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يستخدم يده اليمنى في الطعام. ← تطبيق\nالمخرج الآخر: يوضح آثار مخالفة آداب الطعام. ← تحليل", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم المبني على حل المشكلات، التعلم المبني على اللعب، التعلم التعاوني\nاستراتيجيات أخرى من دليل المعلم: المحاكاة والترديد", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: لوحة الحديث الشريف، الأقلام", "الغلام، التسمية، ما يليك، آداب الطعام، ذكر الطعام، الحمد", "تضع المعلمة طبقًا وملعقة على الطاولة وتسأل: قبل أن نأكل، ماذا نقول؟ وبأي يد نأكل؟", "1. التهيئة: تعرض المعلمة الطبق وتسأل، والتلاميذ يجيبون: بسم الله، باليمين (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أكتشف المعنى ص29–30: تعرض المعلمة لوحة الحديث وتقرؤه، وتلوّن الكلمات المراد توضيحها، والتلاميذ يقرؤون الكلمات الملونة ويربطونها بالرسومات (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. حفظ الحديث: تقود المعلمة ترديدًا فرديًا وزمريًا وتمحو الكلمات تدريجيًا، والتلاميذ يسمّعون الحديث (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n4. علمني رسولي ﷺ ص31: تقول المعلمة: لنتعرف ماذا استفاد أحمد من الحديث، وتناقش التوجيهات الثلاثة (تقويم تكويني)، والتلاميذ يذكرون: التسمية، الأكل باليمين، الأكل مما يليه (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. آداب أخرى: تطلب المعلمة ذكر آداب أخرى للطعام لم ترد في الحديث، والتلاميذ يذكرون: غسل اليدين، عدم الإسراف (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. آثار المخالفة: تسأل المعلمة: لماذا أمرنا الرسول ﷺ بالتسمية؟ ماذا يحدث لو أكلنا باليسرى؟ والتلاميذ يجيبون ويستنتجون حكمة الآداب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أتعلم وأطبق ص32–33: تستثمر المعلمة الإجابات للوصول إلى الأذكار: «بسم الله» قبل الطعام و«الحمد لله» بعده، وتطلب توصيل الذكر بالصورة (تقويم تكويني)، والتلاميذ يصلون الذكر بالصورة ويضعون (×) تحت السلوك الخطأ (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. أختبر تعلمي ص34–36: توجّه المعلمة حل الأنشطة: التسمية، تلوين اليد اليمنى، النشاط الإثرائي، والتلاميذ يحلون الأنشطة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n9. وليمة تمثيلية: تمثل مجموعة جلسة طعام بالآداب، والتلاميذ يمثلون ويعلق الزملاء (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ما معنى «غلام»؟\n   الإجابة النموذجية: الولد الصغير.\n2) [مستوى التطبيق] ماذا نقول قبل الطعام؟\n   الإجابة النموذجية: بسم الله.\n3) [مستوى الاستدلال] ما معنى «كُل مما يليك»؟\n   الإجابة النموذجية: كُل من الطعام القريب منك ولا تمدّ يدك أمام غيرك.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ أمام طبق حقيقي أو مصور، ويطبق معه آداب الحديث: قول «بسم الله» والأكل باليمين ومما يليه، ثم يسأله: ماذا نقول قبل الطعام؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مشهد مائدة يخالف فيه طفل آداب الحديث، وتصحيح خطئه بعبارات الحديث: «سمِّ الله، وكل بيمينك، وكل مما يليك».\n\n4) [مستوى المعرفة] ماذا نقول بعد الانتهاء من الطعام؟\n   الإجابة النموذجية: الحمد لله.\n5) [مستوى التطبيق] ضع (×) تحت السلوك الخطأ: يأكل بيمينه / يمد يده إلى طعام غيره.\n   الإجابة النموذجية: × يمد يده إلى طعام غيره.\n6) [مستوى الاستدلال] لماذا نأكل مما يلينا؟\n   الإجابة النموذجية: احترامًا للآخرين ولكي لا نؤذيهم.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ أمام طبق حقيقي أو مصور، ويطبق معه آداب الحديث: قول «بسم الله» والأكل باليمين ومما يليه، ثم يسأله: ماذا نقول قبل الطعام؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل مشهد مائدة يخالف فيه طفل آداب الحديث، وتصحيح خطئه بعبارات الحديث: «سمِّ الله، وكل بيمينك، وكل مما يليك».", "1) [مستوى المعرفة] أكمل الحديث: «يا غلام، سمِّ الله، وكُل ...».\n   الإجابة النموذجية: بيمينك، وكُل مما يليك.\n2) [مستوى التطبيق] بأي يد نأكل؟\n   الإجابة النموذجية: باليد اليمنى.\n3) [مستوى الاستدلال] اذكر آداب الطعام الثلاثة في الحديث.\n   الإجابة النموذجية: التسمية، والأكل باليمين، والأكل مما يلي الآكل.\n\n4) [مستوى المعرفة] لوّن اليد التي نأكل بها.\n   الإجابة النموذجية: اليد اليمنى.\n5) [مستوى التطبيق] صِل الذكر بوقته: «بسم الله» ← ...\n   الإجابة النموذجية: قبل الطعام.\n6) [مستوى الاستدلال] نصح أحمد أخاه الصغير على المائدة، فماذا قال له؟\n   الإجابة النموذجية: يا أخي، سمِّ الله وكُل بيمينك وكُل مما يليك.", "للطالب: يحفظ الحديث ص29 ويطبقه في وجبة الغداء.\nلولي الأمر: يتابع تطبيق طفله للآداب الثلاثة على المائدة.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 29–36.\nللطالب: يراجع ص32–36 ويقول أذكار الطعام مع أسرته.\nلولي الأمر: يذكّر طفله بالتسمية والحمد ويثني على التزامه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=20"]}], "weeks": [12]}, {"id": "hajah", "title": "آداب قضاء الحاجة", "unit": "الوحدة الثالثة", "sb": "كتاب الطالب – الجزء الثاني: ص 37–42", "tg": "دليل المعلم: ص 78–81", "n": 1, "periods": [{"k": 1, "axis": "معنى قضاء الحاجة وآدابه وأذكار دخول الحمام والخروج منه + تطبيق آداب قضاء الحاجة ونظافة الحمام وغسل اليدين، وأختبر تعلمي", "week": "الأسبوع الثاني عشر (22–26/11/2026م (اليوم الوطني))", "f": ["1. يفهم معنى قضاء الحاجة بأسلوب مبسّط.\n2. يتعرّف آداب قضاء الحاجة.\n3. يحفظ ذكر دخول الحمام: «اللهم إني أعوذ بك من الخبث والخبائث» وذكر الخروج: «غفرانك».\n4. يطبق آداب قضاء الحاجة في حياته اليومية.\n5. يحافظ على غسل يديه ونظافة الحمام بعد قضاء الحاجة.\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nيقدّم رجله اليسرى عند الدخول واليمنى عند الخروج.\nيحافظ على الماء ولا يسرف فيه.", "المخرج 1: يفهم معنى قضاء الحاجة بأسلوب مبسّط. ← فهم\nالمخرج 2: يتعرّف آداب قضاء الحاجة. ← تذكر\nالمخرج 3: يحفظ ذكر دخول الحمام: «اللهم إني أعوذ بك من الخبث والخبائث» وذكر الخروج: «غفرانك». ← تذكر\nالمخرج 4: يطبق آداب قضاء الحاجة في حياته اليومية. ← تطبيق\nالمخرج 5: يحافظ على غسل يديه ونظافة الحمام بعد قضاء الحاجة. ← تطبيق\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يقدّم رجله اليسرى عند الدخول واليمنى عند الخروج. ← تطبيق\nالمخرج الآخر: يحافظ على الماء ولا يسرف فيه. ← تقييم", "التعلم بالنمذجة، التعلم بالاكتشاف، التعلم التعاوني، التعلم الذاتي\nاستراتيجيات أخرى من دليل المعلم: العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقتا الذكرين، الأقلام، أخرى: بطاقات كلمات ملونة لملء الفراغ", "قضاء الحاجة، الخبث والخبائث، غفرانك، نظافة الحمام، غسل اليدين، عدم الإسراف", "تعرض المعلمة الفقرة والصورة في عنصر «أتأمل وأناقش» ص37 (حوار أحمد وأمه) وتطرح السؤالين.", "1. التهيئة: تعرض المعلمة الحوار وتطرح السؤالين، والتلاميذ يجيبون (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ما قضاء الحاجة؟: تقدم المعلمة تعريفًا مبسطًا: الذهاب إلى الحمام للتبول أو التبرز، والتلاميذ يرددون التعريف (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. أتعرف وأفهم ص38–39: تعرض المعلمة الصور واحدة واحدة مع جملها: الدخول باليسرى مع الذكر، عدم إدخال المصحف، الخروج باليمنى مع «غفرانك»، والتلاميذ يقرؤون الجمل فرديًا وزمريًا ويربطونها بالصور (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n4. حفظ الذكرين: تكتب المعلمة الذكرين في بطاقة كبيرة وتكررهما (تقويم تكويني)، والتلاميذ يرددون الذكرين حتى يحفظوهما (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أمثل بالإشارة: تطلب المعلمة تمثيل الدخول والخروج بالقدم الصحيحة، والتلاميذ يمثلون مع قول الذكر (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. تطبيق عملي: تصطحب مجموعة إلى دورة مياه المدرسة بمساعدة زميلة، مع نشاط بديل لمن يبقى في الصف، والتلاميذ يطبقون الدخول والخروج والذكر وغسل اليدين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. أفكر وأطبق ص40: تعرض المعلمة الصورتين وبطاقات الكلمات وتطلب اختيار الكلمة المناسبة للفراغ (تقويم تكويني)، والتلاميذ يكملون الجمل: أغسل يديّ بالماء والصابون، أرمي المناديل في السلة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. أختبر تعلمي ص41–42: توجه المعلمة حل الأنشطة الأربعة: المصحف، الأذكار، محبة الدين، البحث، والتلاميذ يحلون الأنشطة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. آراء المجموعات: تدوّن المعلمة آراء المجموعات في أهمية الآداب، وتعبّر كل مجموعة عن رأيها (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "1) [مستوى المعرفة] ماذا نقول عند دخول الحمام؟\n   الإجابة النموذجية: اللهم إني أعوذ بك من الخبث والخبائث.\n2) [مستوى التطبيق] بأي رجل ندخل الحمام؟\n   الإجابة النموذجية: باليسرى.\n3) [مستوى الاستدلال] لماذا لا ندخل المصحف إلى الحمام؟\n   الإجابة النموذجية: تعظيمًا للقرآن الكريم.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ الدخول إلى الحمام بالرجل اليسرى مع ذكر الدخول، والخروج باليمنى مع قول «غفرانك» بالترديد، ثم يسأله: بأي رجل ندخل الحمام؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ملصق مصور لآداب قضاء الحاجة يتضمن ذكري الدخول والخروج، وتفسير لماذا لا ندخل المصحف إلى الحمام.\n\n4) [مستوى المعرفة] ماذا أفعل بيديّ بعد قضاء الحاجة؟\n   الإجابة النموذجية: أغسلهما بالماء والصابون.\n5) [مستوى التطبيق] أين أرمي المناديل المستعملة؟\n   الإجابة النموذجية: في سلة المهملات.\n6) [مستوى الاستدلال] لماذا لا أسرف في الماء عند غسل يديّ؟\n   الإجابة النموذجية: لأن الماء نعمة يجب المحافظة عليها.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ الدخول إلى الحمام بالرجل اليسرى مع ذكر الدخول، والخروج باليمنى مع قول «غفرانك» بالترديد، ثم يسأله: بأي رجل ندخل الحمام؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ملصق مصور لآداب قضاء الحاجة يتضمن ذكري الدخول والخروج، وتفسير لماذا لا ندخل المصحف إلى الحمام.", "1) [مستوى المعرفة] ماذا نقول عند الخروج من الحمام؟\n   الإجابة النموذجية: غفرانك.\n2) [مستوى التطبيق] بأي رجل نخرج من الحمام؟\n   الإجابة النموذجية: باليمنى.\n3) [مستوى الاستدلال] رتّب: أخرج باليمنى وأقول غفرانك – أدخل باليسرى وأقول الذكر – أقضي حاجتي.\n   الإجابة النموذجية: أدخل باليسرى وأقول الذكر، أقضي حاجتي، أخرج باليمنى وأقول غفرانك.\n\n4) [مستوى المعرفة] أكمل: أترك الحمام ... بعد استعماله.\n   الإجابة النموذجية: نظيفًا.\n5) [مستوى التطبيق] اذكر ذكري دخول الحمام والخروج منه.\n   الإجابة النموذجية: اللهم إني أعوذ بك من الخبث والخبائث، غفرانك.\n6) [مستوى الاستدلال] لماذا علّمنا الإسلام آداب قضاء الحاجة؟\n   الإجابة النموذجية: لنحافظ على طهارتنا ونظافتنا وصحتنا ونظافة المكان.", "للطالب: يحفظ ذكري الدخول والخروج ص38–39 ويطبقهما في البيت.\nلولي الأمر: يعلّق بطاقة الذكرين عند باب الحمام ويتابع طفله.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 37–42.\nللطالب: يطبق آداب قضاء الحاجة ويكمل ص40–42.\nلولي الأمر: يتابع نظافة الحمام بعد استعمال طفله وغسله يديه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=21"]}], "weeks": [12]}, {"id": "h_nasr", "title": "سورة النصر (تلاوة وحفظ)", "unit": "مقرر التلاوة والحفظ (الجزء الثاني)", "sb": "كتاب الطالب – الجزء الثاني: ص 11، 13", "tg": "دليل المعلم: ص 21، 24 (توجيهات حصص التلاوة والمحاكاة والترديد)", "n": 1, "periods": [{"k": 1, "axis": "تلاوة سورة النصر وحفظها + تسميع سورة النصر ومراجعة سورة المسد", "week": "الأسبوع الثالث عشر (29/11–3/12/2026م (يوم الأنشطة التربوية))", "f": ["1. يتلو سورة النصر تلاوة صحيحة.\n2. يحفظ سورة النصر كاملة.\n3. يضبط نطق: «أفواجًا، فسبّحْ، واستغفرْه، توّابًا».\n4. يسمّع سورة النصر حفظًا متقنًا.\n5. يسمّع سورة المسد مراجعةً لما سبق.\n6. يرتب سور الكوثر والكافرون والنصر والمسد بحسب ترتيب المصحف.\n\nمخرج تعليمي آخر:\nيذكر الله تعالى بالتسبيح والحمد.\nيقيّم تلاوة زميله ببطاقة التقييم.", "المخرج 1: يتلو سورة النصر تلاوة صحيحة. ← تطبيق\nالمخرج 2: يحفظ سورة النصر كاملة. ← تذكر\nالمخرج 3: يضبط نطق: «أفواجًا، فسبّحْ، واستغفرْه، توّابًا». ← تطبيق\nالمخرج 4: يسمّع سورة النصر حفظًا متقنًا. ← تذكر\nالمخرج 5: يسمّع سورة المسد مراجعةً لما سبق. ← تذكر\nالمخرج 6: يرتب سور الكوثر والكافرون والنصر والمسد بحسب ترتيب المصحف. ← فهم\nالمخرج الآخر: يذكر الله تعالى بالتسبيح والحمد. ← تطبيق\nالمخرج الآخر: يقيّم تلاوة زميله ببطاقة التقييم. ← تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: المحاكاة والترديد", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: المصحف الشريف، أخرى: بطاقة تقييم التلاوة وبطاقات أسماء السور", "النصر، الفتح، التسبيح، الاستغفار، التسميع، ترتيب السور، المراجعة", "تسأل المعلمة: ماذا نقول عندما ننجح أو نفوز؟ وتستمع للإجابات، ثم تقول: في سورة اليوم يعلّمنا الله ماذا نقول عند النصر.", "1. التهيئة: تطرح المعلمة السؤال، والتلاميذ يجيبون: الحمد لله (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: تُسمعهم المعلمة السورة ص13 من الجزء الثاني مرتين، والتلاميذ ينصتون ويتابعون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلقين والترديد: تلقّن المعلمة الآيات الثلاث وتضبط «أفواجًا، فسبّحْ، واستغفرْه، توّابًا»، والتلاميذ يرددون جماعيًا وزمريًا وفرديًا (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n4. سبحان الله وبحمده: تربط المعلمة «فسبّح بحمد ربك واستغفره» بقول: سبحان الله وبحمده، أستغفر الله (تقويم تكويني)، والتلاميذ يرددون الذكرين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أعدّ الآيات: تطلب المعلمة عدّ الآيات وتحديد الموقع، والتلاميذ يعدّون ثلاث آيات ويحددون أنها قبل المسد (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تلاوة جماعية: تقود المعلمة تلاوة النصر ثم المسد، والتلاميذ يتلون جماعيًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. التسميع الفردي والثنائي: تسمّع المعلمة لعدد من التلاميذ، والبقية أزواج ببطاقة تقييم، والتلاميذ يسمّعون ويقيّمون (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n8. معالجة الأخطاء: تعالج المعلمة «توّابًا، حمّالة» (تقويم تكويني)، والتلاميذ يكررون النطق الصحيح (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. ترتيب السور: تصحح المعلمة ترتيب السور: الكوثر، الكافرون، النصر، المسد، والتلاميذ يرتبون البطاقات ترتيبًا صحيحًا (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] كم آية في سورة النصر؟\n   الإجابة النموذجية: ثلاث آيات.\n2) [مستوى التطبيق] أكمل: «إذا جاء نصر الله ...».\n   الإجابة النموذجية: والفتح.\n3) [مستوى الاستدلال] ماذا علّمتنا السورة أن نقول عند النصر؟\n   الإجابة النموذجية: نسبّح الله ونحمده ونستغفره.\n\n• نشاط علاجي (لمن لم يتقن): يتلو المعلم سورة النصر آيةً آيةً ويرددها التلميذ مع ضبط «أفواجًا، فسبّحْ، واستغفرْه، توّابًا»، ثم يطلب منه إكمال: «إذا جاء نصر الله ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتسميع سورة النصر غيبًا، وبيان ما علمتنا السورة أن نقوله عند النصر، واقتراح موقف يومي يفرحون فيه فيحمدون الله ويستغفرونه.\n\n4) [مستوى المعرفة] سمّع سورة النصر.\n   الإجابة النموذجية: تسميع صحيح.\n5) [مستوى التطبيق] أيهما أولًا في المصحف: النصر أم المسد؟\n   الإجابة النموذجية: النصر.\n6) [مستوى الاستدلال] استمع إلى زميلك وبيّن له كلمة تحتاج إلى ضبط.\n   الإجابة النموذجية: تحديد صحيح.\n\n• نشاط علاجي (لمن لم يتقن): يتلو المعلم سورة النصر آيةً آيةً ويرددها التلميذ مع ضبط «أفواجًا، فسبّحْ، واستغفرْه، توّابًا»، ثم يطلب منه إكمال: «إذا جاء نصر الله ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتسميع سورة النصر غيبًا، وبيان ما علمتنا السورة أن نقوله عند النصر، واقتراح موقف يومي يفرحون فيه فيحمدون الله ويستغفرونه.", "1) [مستوى المعرفة] ما معنى «أفواجًا»؟\n   الإجابة النموذجية: جماعات كثيرة.\n2) [مستوى التطبيق] ما السورة التي تأتي بعد النصر في المصحف؟\n   الإجابة النموذجية: سورة المسد.\n3) [مستوى الاستدلال] اتلُ سورة النصر كاملة.\n   الإجابة النموذجية: تلاوة صحيحة.\n\n4) [مستوى المعرفة] سمّع سورة المسد.\n   الإجابة النموذجية: تسميع صحيح.\n5) [مستوى التطبيق] ما آخر كلمة في سورة النصر؟\n   الإجابة النموذجية: «توّابًا».\n6) [مستوى الاستدلال] رتّب: المسد، الكوثر، النصر، الكافرون.\n   الإجابة النموذجية: الكوثر، الكافرون، النصر، المسد.", "للطالب: يردد سورة النصر ص13 ويقول «سبحان الله وبحمده» صباحًا ومساءً.\nلولي الأمر: يستمع إلى طفله ويضبط نطق «توّابًا».\nالمرجع: كتاب الطالب (الجزء الثاني) ص 11، 13.\nللطالب: يسمّع النصر والمسد لأسرته ويرتب أسماء السور.\nلولي الأمر: يستمع إلى تسميع طفله ويكافئه على الإتقان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=22"]}], "weeks": [13, 14]}, {"id": "tifl", "title": "محمد ﷺ الطفل المبارك", "unit": "الوحدة الثالثة", "sb": "كتاب الطالب – الجزء الثاني: ص 43–47", "tg": "دليل المعلم: ص 82–84", "n": 1, "periods": [{"k": 1, "axis": "حليمة السعدية مرضعة الرسول ﷺ ومظاهر بركته عليها + موقف حليمة السعدية النبيل ومحبة الرسول ﷺ، وأختبر تعلمي", "week": "الأسبوع الثالث عشر (29/11–3/12/2026م (يوم الأنشطة التربوية))", "f": ["1. يتعرّف مرضعة الرسول ﷺ حليمة السعدية.\n2. يوضح مظاهر بركة الرسول ﷺ على حليمة السعدية وأسرتها.\n3. يجيب عن أسئلة القصة إجابات صحيحة.\n4. يقدّر موقف حليمة السعدية في رضاع الرسول ﷺ.\n5. يضيف إلى الصورة ما يدل على بركة الرسول ﷺ مع مجموعته.\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nيتعرّف معاني الكلمات الملونة في القصة.\nيعبّر عن محبته للرسول ﷺ.", "المخرج 1: يتعرّف مرضعة الرسول ﷺ حليمة السعدية. ← تذكر\nالمخرج 2: يوضح مظاهر بركة الرسول ﷺ على حليمة السعدية وأسرتها. ← فهم\nالمخرج 3: يجيب عن أسئلة القصة إجابات صحيحة. ← فهم\nالمخرج 4: يقدّر موقف حليمة السعدية في رضاع الرسول ﷺ. ← تقييم\nالمخرج 5: يضيف إلى الصورة ما يدل على بركة الرسول ﷺ مع مجموعته. ← إبداع\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يتعرّف معاني الكلمات الملونة في القصة. ← فهم\nالمخرج الآخر: يعبّر عن محبته للرسول ﷺ. ← تطبيق", "التعلم التشاركي، التعلم بالاكتشاف، التعلم التعاوني\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية\nاستراتيجيات أخرى من دليل المعلم: العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام، أخرى: ألوان", "الرضاع، البادية، البركة، المرضعة، الرضا بالقليل، المروءة، المحبة", "تسأل المعلمة: من أرضعك وأنت صغير؟ وتقول: كان من عادة أهل مكة أن يرسلوا أطفالهم إلى البادية ليُرضَعوا هناك، فمن أرضعت الرسول ﷺ؟", "1. التهيئة: تطرح المعلمة السؤال وتمهد للقصة، والتلاميذ يجيبون ويتشوقون (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. أستمع وأناقش ص43: تقرأ المعلمة قصة الجدة لأحفادها بنبرات متنوعة: رفض المرضعات أخذ اليتيم وقبول حليمة السعدية، والتلاميذ يستمعون ويتابعون الصور (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. مناقشة الأسئلة ص44: تسأل المعلمة: لماذا رفضت المرضعات؟ ما اسم مرضعته؟ ماذا حدث لحليمة بعد أخذه؟ (تقويم تكويني)، والتلاميذ يجيبون: خفن من قلة المال، حليمة السعدية، حلّت البركة (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n4. مظاهر البركة: تدوّن المعلمة على السبورة: أخصبت المراعي، سمنت الأغنام، كثر الخير، والتلاميذ يرددون مظاهر البركة (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. معاني الكلمات: توضح المعلمة الكلمات الملونة بالأحمر مستعينة بالرسومات، والتلاميذ يعبّرون عن معانيها شفويًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أفكر وأناقش: تقرأ المعلمة العبارة وتناقش: علامَ يدل موقف حليمة؟ ما رأيكم فيه؟ والتلاميذ يجيبون: يدل على مروءتها ورضاها بالقليل، موقف نبيل (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. أتعاون مع زملائي ص45: تطلب المعلمة إضافة ما يدل على البركة إلى الصورة (أغنام سمينة، عشب أخضر) (تقويم تكويني)، وترسم المجموعات وتلون وتعرض (5 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n8. أختبر تعلمي ص46–47: توجه المعلمة الأنشطة: الوصل بين الجملة والصورة، المقارنة شفويًا قبل الرضاع وبعده، التلوين، والتلاميذ يحلون الأنشطة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. بركة الرسول ﷺ على أهل عُمان: تشير المعلمة إلى دعاء الرسول ﷺ لأهل عُمان وبركته، والتلاميذ يصلّون على النبي ﷺ (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] من مرضعة الرسول ﷺ؟\n   الإجابة النموذجية: حليمة السعدية.\n2) [مستوى التطبيق] لماذا رفضت المرضعات أخذ الرسول ﷺ؟\n   الإجابة النموذجية: لأنه كان يتيم الأب فخفن من قلة المال.\n3) [مستوى الاستدلال] اذكر مظهرين لبركة الرسول ﷺ على حليمة.\n   الإجابة النموذجية: أخصبت المراعي وسمنت الأغنام.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة حليمة السعدية بالصور (رفض المرضعات، أخذ حليمة للرسول ﷺ، خصب المراعي وسمن الأغنام)، ثم يسأله: من مرضعة الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم صورتين: حال حليمة قبل أخذ الرسول ﷺ وبعده، وكتابة جملة تبيّن مظهر البركة في كل صورة.\n\n4) [مستوى المعرفة] هل موقف حليمة السعدية نبيل؟ لماذا؟\n   الإجابة النموذجية: نعم، لأنها رضيت بالقليل وأخذت اليتيم.\n5) [مستوى التطبيق] صِل: «سمنت الأغنام» بالصورة المناسبة.\n   الإجابة النموذجية: صورة أغنام سمينة.\n6) [مستوى الاستدلال] قارن بين حال حليمة قبل رضاع الرسول ﷺ وبعده.\n   الإجابة النموذجية: قبله: قلة وضعف، وبعده: بركة وخير ومراعٍ خصبة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة حليمة السعدية بالصور (رفض المرضعات، أخذ حليمة للرسول ﷺ، خصب المراعي وسمن الأغنام)، ثم يسأله: من مرضعة الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم صورتين: حال حليمة قبل أخذ الرسول ﷺ وبعده، وكتابة جملة تبيّن مظهر البركة في كل صورة.", "1) [مستوى المعرفة] أين عاش الرسول ﷺ مع حليمة؟\n   الإجابة النموذجية: في بادية بني سعد.\n2) [مستوى التطبيق] ما معنى «أخصبت المراعي»؟\n   الإجابة النموذجية: اخضرّت الأرض وكثر فيها العشب.\n3) [مستوى الاستدلال] كيف تغيرت حياة حليمة بعد أن أخذت الرسول ﷺ؟\n   الإجابة النموذجية: حلّت البركة في بيتها وصحتها وأغنامها وكثر عندها الخير.\n\n4) [مستوى المعرفة] لوّن العبارة: أحب الرسول ﷺ.\n   الإجابة النموذجية: تلوين صحيح.\n5) [مستوى التطبيق] كيف أقتدي بحليمة السعدية؟\n   الإجابة النموذجية: أرحم اليتيم وأساعده وأرضى بالقليل.\n6) [مستوى الاستدلال] ما واجبي تجاه من يحب الرسول ﷺ؟\n   الإجابة النموذجية: أحبه وأقتدي به في محبة الرسول ﷺ.", "للطالب: يحكي قصة حليمة السعدية ص43 لأسرته.\nلولي الأمر: يحدّث طفله عن بركة الرسول ﷺ ويصليان عليه.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 43–47.\nللطالب: يكمل أنشطة ص45–47 ويقارن لأسرته حال حليمة قبل الرضاع وبعده.\nلولي الأمر: يحدّث طفله عن رحمة اليتيم اقتداءً بحليمة السعدية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=23"]}], "weeks": [13]}, {"id": "muallimati", "title": "أحترم معلمتي", "unit": "الوحدة الثالثة", "sb": "كتاب الطالب – الجزء الثاني: ص 48–54", "tg": "دليل المعلم: ص 85–88", "n": 1, "periods": [{"k": 1, "axis": "أسباب احترام المعلمة ومظاهر احترامها + احترام المعلمة داخل المدرسة وخارجها وآثار عدم احترامها، ونشيد معلمتي", "week": "الأسبوع الثالث عشر (29/11–3/12/2026م (يوم الأنشطة التربوية))", "f": ["1. يتعرّف أسباب وجوب احترام المعلمة.\n2. يعدّد بعض مظاهر احترام المعلمة.\n3. يضيف مظاهر أخرى لاحترام المعلمة لم ترد في النشاط.\n4. يحرص على احترام المعلمة داخل المدرسة وخارجها.\n5. يستنتج الآثار السلبية لعدم احترام المعلمة في أثناء الشرح.\n6. ينشد نشيد «معلمتي» بصوت جميل.\n\nمخرج تعليمي آخر:\nيحترم جميع العاملين في المدرسة.\nيقترح سلوكيات بديلة للتصرفات الخاطئة.", "المخرج 1: يتعرّف أسباب وجوب احترام المعلمة. ← فهم\nالمخرج 2: يعدّد بعض مظاهر احترام المعلمة. ← تذكر\nالمخرج 3: يضيف مظاهر أخرى لاحترام المعلمة لم ترد في النشاط. ← إبداع\nالمخرج 4: يحرص على احترام المعلمة داخل المدرسة وخارجها. ← تطبيق\nالمخرج 5: يستنتج الآثار السلبية لعدم احترام المعلمة في أثناء الشرح. ← تحليل\nالمخرج 6: ينشد نشيد «معلمتي» بصوت جميل. ← تطبيق\nالمخرج الآخر: يحترم جميع العاملين في المدرسة. ← تطبيق\nالمخرج الآخر: يقترح سلوكيات بديلة للتصرفات الخاطئة. ← إبداع", "التعلم التشاركي، التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على حل المشكلات\nاستراتيجيات أخرى من دليل المعلم: الحوار والمناقشة\nاستراتيجيات أخرى من دليل المعلم: تمثيل الأدوار", "الكتاب، السبورة الذكية، صورة توضيحية، السبورة التقليدية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الوسائل المتعددة (سمعية - بصرية)، الأقلام", "الاحترام، المعلمة، التقدير، الانضباط، النظام", "تعرض المعلمة صورة عنصر «أستمع وأناقش» ص48 وتسأل: من الشخصيات في الصورة؟ ماذا يفعلون؟", "1. التهيئة: تعرض المعلمة الصورة وتطرح السؤالين، والتلاميذ يجيبون: معلمة وتلميذ وتلميذة (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. أستمع وأناقش ص48: تقرأ المعلمة النص أكثر من مرة بنبرات متنوعة، والتلاميذ يستمعون وينصتون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لماذا نحترمها؟: تسأل المعلمة: كيف تعاملنا المعلمة؟ إلى ما توجهنا؟ ماذا يجب علينا؟ ثم تكتب: «يجب عليّ أن أحترم معلمتي»، والتلاميذ يجيبون ويرددون العبارة (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: الحوار والمناقشة.\n\n4. مظاهر الاحترام ص49: تعطيهم المعلمة وقتًا لقراءة الصور ثم الحديث عن مظاهر الاحترام، وتدونها على السبورة (تقويم تكويني)، والتلاميذ يذكرون: الإنصات، رفع اليد، التحية، الكلام المهذب (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. مظاهر أخرى: تطلب المعلمة مظاهر لم ترد في النشاط، والتلاميذ يقترحون: مساعدتها في حمل الكتب، الدعاء لها (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أفكر وأطبق ص50: توجه المعلمة إلى تأمل الصورتين والحديث عن السلوكيات السلبية واقتراح البديل، والتلاميذ يقترحون السلوك البديل (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. أتعاون مع زملائي ص51: توزع المعلمة نسخة النشاط وتتدرج: صِف المعلمة في الصورة الأولى، لماذا هي غاضبة؟ صِف الثانية، لماذا هي مسرورة؟ (تقويم تكويني)، وتجيب المجموعات وتختار السلوك الذي ستتبعه وتبرر (5 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n8. نشيد معلمتي ص52: تعرض المعلمة النشيد بالتسجيل وتطلب الإنشاد وتشرح معانيه، والتلاميذ ينشدون جماعيًا وزمريًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أختبر تعلمي ص53–54: توجه المعلمة حل النشاطين: الاحترام داخل المدرسة وخارجها، والتعبير بالكلمات، والتلاميذ يحلون ويلونون ويكتبون (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] لماذا نحترم المعلمة؟\n   الإجابة النموذجية: لأنها تعلمنا وترشدنا إلى الخير.\n2) [مستوى التطبيق] اذكر مظهرين لاحترام المعلمة.\n   الإجابة النموذجية: الإنصات لها ورفع اليد قبل الكلام.\n3) [مستوى الاستدلال] اقترح مظهرًا لاحترام المعلمة لم يرد في الدرس.\n   الإجابة النموذجية: مثل: الدعاء لها أو مساعدتها في ترتيب الصف.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ مواقف احترام المعلمة: الإنصات ورفع اليد قبل الكلام، ثم يعرض صورة موقف ويسأله: هل هذا احترام للمعلمة؟ ولماذا نحترمها؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة شكر لمعلمتهم، واقتراح مظهرين جديدين لاحترام المعلمة وجميع العاملين في المدرسة لم يردا في الدرس.\n\n4) [مستوى المعرفة] ماذا يحدث للدرس إذا لم يلتزم التلاميذ بالنظام؟\n   الإجابة النموذجية: تغضب المعلمة ولا نفهم الدرس.\n5) [مستوى التطبيق] ماذا أفعل إذا قابلت معلمتي خارج المدرسة؟\n   الإجابة النموذجية: أسلّم عليها بأدب واحترام.\n6) [مستوى الاستدلال] اقترح بديلًا لسلوك تلميذ يتحدث مع زميله في أثناء الشرح.\n   الإجابة النموذجية: ينصت للمعلمة ويؤجل حديثه إلى وقت الاستراحة.\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ مواقف احترام المعلمة: الإنصات ورفع اليد قبل الكلام، ثم يعرض صورة موقف ويسأله: هل هذا احترام للمعلمة؟ ولماذا نحترمها؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة شكر لمعلمتهم، واقتراح مظهرين جديدين لاحترام المعلمة وجميع العاملين في المدرسة لم يردا في الدرس.", "1) [مستوى المعرفة] أكمل: يجب عليّ أن ... معلمتي.\n   الإجابة النموذجية: أحترم.\n2) [مستوى التطبيق] ماذا أفعل إذا أردت أن أتكلم في الصف؟\n   الإجابة النموذجية: أرفع يدي وأنتظر الإذن.\n3) [مستوى الاستدلال] هل أحترم عامل النظافة في المدرسة؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأنه يخدمنا ويحافظ على نظافة مدرستنا.\n\n4) [مستوى المعرفة] أكمل: أحترم معلمتي داخل المدرسة و...\n   الإجابة النموذجية: خارجها.\n5) [مستوى التطبيق] اكتب كلمة شكر لمعلمتك.\n   الإجابة النموذجية: مثل: شكرًا معلمتي لأنك تعلمينني.\n6) [مستوى الاستدلال] لماذا شبّه النشيد المعلمة بالأم؟\n   الإجابة النموذجية: لأنها تحرص على تلاميذها وتحبهم كالأم.", "للطالب: يقرأ نص ص48 مع أسرته ويذكر مظهرين لاحترام المعلمة.\nلولي الأمر: يحدّث طفله عن فضل المعلمة واحترامها.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 48–54.\nللطالب: ينشد نشيد «معلمتي» ص52 ويكتب بطاقة شكر لمعلمته.\nلولي الأمر: يحدّث طفله عن أهمية الالتزام بالنظام في الصف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=24"]}], "weeks": [13]}, {"id": "ikhlas", "title": "سورة الإخلاص (تلاوة وفهم)", "unit": "الوحدة الرابعة", "sb": "كتاب الطالب – الجزء الثاني: ص 56–62", "tg": "دليل المعلم: ص 90–92", "n": 1, "periods": [{"k": 1, "axis": "التعريف بسورة الإخلاص وفضلها وتلاوتها ومعنى «أحد» و«الصمد» + الله لم يلد ولم يولد، والحاجة إلى الله تعالى (قصة السفينة)، وأختبر تعلمي", "week": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1. يعرّف بسورة الإخلاص وفضلها.\n2. يتلو سورة الإخلاص تلاوة صحيحة منطقًا «كُفُوًا» بضم الفاء.\n3. يكتشف معنى كلمتي «أحد» و«الصمد» من الرسومات.\n4. يستنتج أن الله تعالى لم يلد ولم يولد.\n5. يستشعر حاجته إلى الله تعالى في كل الأحوال.\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nينطق «أشهد أن لا إله إلا الله» نطقًا صحيحًا.\nيلجأ إلى الله تعالى بالدعاء مع الأخذ بالأسباب.", "المخرج 1: يعرّف بسورة الإخلاص وفضلها. ← تذكر\nالمخرج 2: يتلو سورة الإخلاص تلاوة صحيحة منطقًا «كُفُوًا» بضم الفاء. ← تطبيق\nالمخرج 3: يكتشف معنى كلمتي «أحد» و«الصمد» من الرسومات. ← فهم\nالمخرج 4: يستنتج أن الله تعالى لم يلد ولم يولد. ← تحليل\nالمخرج 5: يستشعر حاجته إلى الله تعالى في كل الأحوال. ← تقييم\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: ينطق «أشهد أن لا إله إلا الله» نطقًا صحيحًا. ← تطبيق\nالمخرج الآخر: يلجأ إلى الله تعالى بالدعاء مع الأخذ بالأسباب. ← تطبيق", "التعلم بالاكتشاف، التعلم بالنمذجة، التعلم التعاوني\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية", "الكتاب، السبورة الذكية، صورة توضيحية، الوسائل المتعددة (سمعية - بصرية)، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام", "أحد، الصمد، التوحيد، كُفُوًا، لم يلد ولم يولد، اللجوء إلى الله", "تحكي المعلمة أن الرسول ﷺ خرج على أصحابه فقال: «أقرأ عليكم ثلث القرآن»، فقرأ «قل هو الله أحد» حتى ختمها، وتسأل: ما هذه السورة العظيمة؟", "1. التهيئة: تحكي المعلمة الجانب الإثرائي وتطرح السؤال، والتلاميذ يجيبون: سورة الإخلاص (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التعريف بالسورة ص56: تعرّف المعلمة بالسورة: عدد آياتها أربع، موضعها بعد المسد وقبل الفلق، والتلاميذ يحددون موضعها في المصحف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أتلو وأفهم: تلاوة المعلمة نموذجية ثم ترديد مع التأكيد على «كُفُوًا» بضم الفاء (لا تزيد على 7 دقائق)، والتلاميذ يتلون فرديًا وزمريًا وجماعيًا (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n4. أكتشف المعنى ص57: تكتب المعلمة «أحد، الصمد» مشكولتين، وتوضح معناهما بالرسومات: أحد = واحد لا شريك له، الصمد = الذي يحتاج إليه كل الخلق (تقويم تكويني)، والتلاميذ ينطقون الكلمتين ويربطونهما بالرسومات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. كلمة التوحيد: تراجع المعلمة نطق «أشهد أن لا إله إلا الله» الموجودة في الرسمة، ويرددونها التلميذ نطقًا صحيحًا (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. أتعاون مع زملائي ص58: تطلب المعلمة تأمل الرسومات والتعبير عنها، وتستنتج معهم أن المخلوقات تلد وتولد أما الله فلم يلد ولم يولد، وتحل المجموعات النشاط وتعرضه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. قصة السفينة ص59–60: تعرض المعلمة القصة المصورة وتناقش: ماذا حدث للسفينة؟ كيف تصرف الركاب؟ ماذا قالوا عند الخوف؟ (تقويم تكويني)، والتلاميذ يجيبون: دعوا الله وحده ليُنجيهم (5 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n8. تعلمت من سورة الإخلاص: تربط المعلمة العنصر بواقعهم: نلجأ إلى الله في الامتحان والمرض والخوف، والتلاميذ يذكرون مواقف دعوا فيها الله (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أختبر تعلمي ص61–62: توجه المعلمة حل الأنشطة: حفظ السورة، وحدانية الله، اللجوء إليه، والتلاميذ يحلون الأنشطة (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "1) [مستوى المعرفة] ما معنى «أحد»؟\n   الإجابة النموذجية: واحد لا شريك له.\n2) [مستوى التطبيق] كم آية في سورة الإخلاص؟\n   الإجابة النموذجية: أربع آيات.\n3) [مستوى الاستدلال] ما معنى «الصمد»؟ اذكر مثالًا يوضح ذلك.\n   الإجابة النموذجية: الذي يحتاج إليه كل الخلق؛ مثل دعائنا الله عند المرض أو الحاجة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ رسومات توضح معنى «أحد» (واحد لا شريك له) و«الصمد» (يحتاج إليه كل الخلق)، ويتلو معه السورة، ثم يسأله: ما معنى «أحد»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بذكر ثلاثة مواقف يحتاج فيها الإنسان إلى الله تعالى فيدعوه، وربطها بمعنى «الصمد» في سورة الإخلاص.\n\n4) [مستوى المعرفة] هل لله تعالى ولد أو والد؟\n   الإجابة النموذجية: لا، الله لم يلد ولم يولد.\n5) [مستوى التطبيق] ماذا فعل ركاب السفينة عندما خافوا؟\n   الإجابة النموذجية: دعوا الله وحده.\n6) [مستوى الاستدلال] ما الفرق بين المخلوقات والخالق في قوله تعالى «لم يلد ولم يولد»؟\n   الإجابة النموذجية: المخلوقات تلد وتولد، والله تعالى منزّه عن ذلك.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ رسومات توضح معنى «أحد» (واحد لا شريك له) و«الصمد» (يحتاج إليه كل الخلق)، ويتلو معه السورة، ثم يسأله: ما معنى «أحد»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بذكر ثلاثة مواقف يحتاج فيها الإنسان إلى الله تعالى فيدعوه، وربطها بمعنى «الصمد» في سورة الإخلاص.", "1) [مستوى المعرفة] انطق كلمة «كُفُوًا» نطقًا صحيحًا.\n   الإجابة النموذجية: بضم الكاف والفاء.\n2) [مستوى التطبيق] أكمل: «الله ...».\n   الإجابة النموذجية: الصمد.\n3) [مستوى الاستدلال] لماذا قال الرسول ﷺ إن سورة الإخلاص تعدل ثلث القرآن؟ (بأسلوبك)\n   الإجابة النموذجية: لعظم فضلها؛ لأنها تتحدث عن توحيد الله وصفاته.\n\n4) [مستوى المعرفة] سمّع سورة الإخلاص.\n   الإجابة النموذجية: تسميع صحيح.\n5) [مستوى التطبيق] إلى من تلجأ عندما تخاف؟\n   الإجابة النموذجية: إلى الله تعالى.\n6) [مستوى الاستدلال] اكتب موقفًا تحتاج فيه إلى الله وماذا تقول فيه.\n   الإجابة النموذجية: مثل: عند المرض أقول: يا رب اشفني، وآخذ الدواء.", "للطالب: يتلو سورة الإخلاص ص56 ويشرح لأسرته معنى «أحد».\nلولي الأمر: يحدّث طفله عن فضل سورة الإخلاص ويقرؤها معه.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 56–62.\nللطالب: يكمل أنشطة ص58–62 ويدعو الله في حاجته.\nلولي الأمر: يعوّد طفله اللجوء إلى الله بالدعاء في كل أمر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=25"]}], "weeks": [14]}, {"id": "khaliqi", "title": "الله تعالى خالقي", "unit": "الوحدة الرابعة", "sb": "كتاب الطالب – الجزء الثاني: ص 63–67", "tg": "دليل المعلم: ص 93–95", "n": 1, "periods": [{"k": 1, "axis": "الله تعالى خالق الإنسان (حوار ولادة الطفلة) وأهمية الأعضاء + أحب الله الذي خلقني في أحسن صورة (ماذا لو؟) وأختبر تعلمي", "week": "الأسبوع الرابع عشر (6–10/12/2026م)", "f": ["1. يستنتج أن الله تعالى هو خالق الإنسان.\n2. يدرك أهمية الأعضاء التي خلقها الله تعالى للإنسان.\n3. يربط كل عضو بوظيفته.\n4. يحب الله تعالى الذي خلقه في أحسن صورة.\n5. يكمل صورة الطفل بالملصقات المناسبة.\n6. يتوقع ما يحدث لو فقد الإنسان عضوًا من أعضائه.\n\nمخرج تعليمي آخر:\nيحافظ على أعضائه وسلامتها.\nيحمد الله على نعمة الخلق قائلًا: «الحمد لله الذي خلقني في أحسن صورة».", "المخرج 1: يستنتج أن الله تعالى هو خالق الإنسان. ← تحليل\nالمخرج 2: يدرك أهمية الأعضاء التي خلقها الله تعالى للإنسان. ← فهم\nالمخرج 3: يربط كل عضو بوظيفته. ← فهم\nالمخرج 4: يحب الله تعالى الذي خلقه في أحسن صورة. ← تقييم\nالمخرج 5: يكمل صورة الطفل بالملصقات المناسبة. ← تطبيق\nالمخرج 6: يتوقع ما يحدث لو فقد الإنسان عضوًا من أعضائه. ← تحليل\nالمخرج الآخر: يحافظ على أعضائه وسلامتها. ← تقييم\nالمخرج الآخر: يحمد الله على نعمة الخلق قائلًا: «الحمد لله الذي خلقني في أحسن صورة». ← تطبيق", "التعلم بالاكتشاف، التعلم التشاركي، التعلم المبني على اللعب، التعلم المبني على حل المشكلات، التعلم التعاوني\nاستراتيجيات أخرى من دليل المعلم: تمثيل الأدوار، العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، نماذج مجسمة، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات أسماء الأعضاء ووظائفها، أخرى: صفحة الملصقات ص89 وقصاصات أعضاء", "الخالق، الأعضاء، الحواس، أحسن صورة، الشكر، نعمة الخلق", "تراجع المعلمة درس «أحب الله ربي» بسؤال: من الذي يحفظنا ويرزقنا؟ ثم تسأل: ومن الذي خلقنا؟", "1. التهيئة: تراجع المعلمة وتطرح السؤال، والتلاميذ يجيبون: الله (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الحوار ص63: تقرأ المعلمة الحوار بتمثيل الأدوار: أم مريم أنجبت طفلة، وتناقش: ماذا قالت الأم عن الطفلة؟ ماذا خلق الله لها في بطن أمها؟ والتلاميذ يمثلون الحوار ويجيبون (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أفهم وأستنتج ص64: تعرض المعلمة العبارة على بطاقة ملونة لإكمال الفراغ بكلمة «الله»، والتلاميذ يكتبون «الله» في الفراغ (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n4. أعضائي نعمة ص65: تعرض المعلمة صور الأعضاء والمجسمات وتوظف العصف الذهني، وتلصق بطاقة الوظيفة أمام كل عضو (تقويم تكويني)، والتلاميذ يرددون الأعضاء مع الإشارة إليها ويذكرون وظائفها (5 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. أحافظ على أعضائي: تسأل المعلمة: كيف نحافظ على العين والأذن؟ والتلاميذ يقترحون: لا أقترب من الشاشة كثيرًا، لا أرفع الصوت في أذن غيري (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أفكر وأطبق ص66: تنفذ المعلمة النشاط بالتعلم باللعب: اختيار الملصقات ولصقها في مكانها من جسم الطفل، والتلاميذ يلصقون الأعضاء في أماكنها (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. لعبة «ماذا لو؟»: تسأل المعلمة: ماذا يحدث لو لم تكن لنا أذن؟ لو كانت العين في أعلى الرأس؟ (تقويم تكويني)، والتلاميذ يتوقعون المشكلات ويستنتجون حكمة الخالق (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. أختبر تعلمي ص67: توجه المعلمة حل النشاطين: أهمية الأعضاء، وخلق الإنسان في أحسن صورة، والتلاميذ يحلون كتابة وقراءة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. أشكر ربي: تستثمر المعلمة صورة مريم في نهاية الدرس لقول: «الحمد لله الذي خلقني في أحسن صورة»، والتلاميذ يرددون العبارة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "1) [مستوى المعرفة] من خلق الإنسان؟\n   الإجابة النموذجية: الله تعالى.\n2) [مستوى التطبيق] صِل: العين ← ...\n   الإجابة النموذجية: النظر.\n3) [مستوى الاستدلال] كيف تحافظ على أذنيك؟\n   الإجابة النموذجية: لا أدخل فيهما أشياء حادة ولا أستمع إلى أصوات عالية جدًا.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى أعضاء الجسم (العين، الأذن، اليد، الرجل) ويذكر وظيفة كل عضو، ثم يصل معه بطاقات العضو بالوظيفة، ثم يسأله: العين للـ...؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة نصائح للمحافظة على عضوين من الأعضاء التي خلقها الله تعالى، وشرح ماذا يحدث لو فقد الإنسان أحدهما.\n\n4) [مستوى المعرفة] ماذا نقول لنشكر الله على خلقنا؟\n   الإجابة النموذجية: الحمد لله الذي خلقني في أحسن صورة.\n5) [مستوى التطبيق] ضع الملصق المناسب: ... مكان العين.\n   الإجابة النموذجية: ملصق العين.\n6) [مستوى الاستدلال] ماذا يحدث لو كانت عينا الإنسان في أعلى رأسه؟\n   الإجابة النموذجية: لن يرى ما أمامه جيدًا؛ فالله جعلها في أحسن مكان.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى أعضاء الجسم (العين، الأذن، اليد، الرجل) ويذكر وظيفة كل عضو، ثم يصل معه بطاقات العضو بالوظيفة، ثم يسأله: العين للـ...؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة نصائح للمحافظة على عضوين من الأعضاء التي خلقها الله تعالى، وشرح ماذا يحدث لو فقد الإنسان أحدهما.", "1) [مستوى المعرفة] أكمل: خلقني ... تعالى.\n   الإجابة النموذجية: الله.\n2) [مستوى التطبيق] اذكر عضوين ووظيفة كل منهما.\n   الإجابة النموذجية: اليد للإمساك، والرِّجل للمشي.\n3) [مستوى الاستدلال] لماذا نحافظ على أعضائنا؟\n   الإجابة النموذجية: لأنها نعمة من الله نحتاجها في حياتنا وعبادتنا.\n\n4) [مستوى المعرفة] من خلقك في أحسن صورة؟\n   الإجابة النموذجية: الله تعالى.\n5) [مستوى التطبيق] اذكر عضوًا وماذا يحدث لو فقده الإنسان.\n   الإجابة النموذجية: مثل: الأذن، فلا يسمع الأصوات.\n6) [مستوى الاستدلال] كيف تعبّر عن حبك لله الذي خلقك؟\n   الإجابة النموذجية: أحمده وأصلي له وأستعمل أعضائي في الخير.", "للطالب: يقرأ حوار ص63 مع أسرته ويذكر وظائف أعضائه.\nلولي الأمر: يحدّث طفله عن نعمة الأعضاء والمحافظة عليها.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 63–67.\nللطالب: يكمل ص66–67 ويقول «الحمد لله الذي خلقني في أحسن صورة».\nلولي الأمر: يحاور طفله: ماذا لو لم تكن لنا عيون؟ ويحمدان الله معًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=26"]}], "weeks": [14]}, {"id": "h_kafirun", "title": "سورة الكافرون (تلاوة وحفظ)", "unit": "مقرر التلاوة والحفظ (الجزء الثاني)", "sb": "كتاب الطالب – الجزء الثاني: ص 11–12", "tg": "دليل المعلم: ص 21، 24 (توجيهات حصص التلاوة والمحاكاة والترديد)", "n": 1, "periods": [{"k": 1, "axis": "تلاوة سورة الكافرون وحفظها", "week": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1. يتلو سورة الكافرون تلاوة صحيحة.\n2. يحفظ سورة الكافرون كاملة.\n3. يميز بين الآيات المتشابهة: «لا أعبد ما تعبدون» و«ولا أنتم عابدون ما أعبد».\nمخرج تعليمي آخر: يعتز بدينه الإسلام.", "المخرج 1: يتلو سورة الكافرون تلاوة صحيحة. ← تطبيق\nالمخرج 2: يحفظ سورة الكافرون كاملة. ← تذكر\nالمخرج 3: يميز بين الآيات المتشابهة: «لا أعبد ما تعبدون» و«ولا أنتم عابدون ما أعبد». ← تحليل\nالمخرج الآخر: يعتز بدينه الإسلام. ← تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: المحاكاة والترديد", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات ملونة للآيات المتشابهة", "الكافرون، العبادة، ديني", "تكتب المعلمة على السبورة: «لكم دينكم ولي دين» وتسأل: من يعرف من أي سورة هذه الآية؟", "1. التهيئة: تكتب المعلمة الآية وتسأل، والتلاميذ يتوقعون اسم السورة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: تُسمعهم المعلمة السورة ص12 من الجزء الثاني مرتين، والتلاميذ ينصتون ويتابعون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلقين والترديد: تلقّن المعلمة الآيات الست وتضبط «عابدون، عابدٌ، عَبَدتّم»، والتلاميذ يرددون جماعيًا وزمريًا وفرديًا (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الآيات المتشابهة: تلوّن المعلمة الآيات المتشابهة بألوان مختلفة وتدربهم على التمييز بينها (تقويم تكويني)، والتلاميذ يرتبون البطاقات الملونة ويتلونها (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n5. التسميع: تسمّع المعلمة لعدد من التلاميذ، والتلاميذ يسمّعون السورة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.", "1) [ ق ← البر ← الجنة، ثم يسأله: ما معنى «الصدق»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتأليف قصة قصيرة عن طفل قال الصدق فنجا من مشكلة، وربطها بقول الحديث إن الصدق يهدي إلى البر.", "1) [مستوى المعرفة] أكمل: «عليكم ...».\n   الإجابة النموذجية: بالصدق.\n2) [مستوى التطبيق] ما معنى «يهدي»؟\n   الإجابة النموذجية: يوصل ويدل.\n3) [مستوى الاستدلال] رتّب: الجنة – الصدق – البر.\n   الإجابة النموذجية: الصدق، البر، الجنة.\n\n4) [مستوى المعرفة] أكمل: «فإن الصدق يهدي إلى ...».\n   الإجابة النموذجية: البر.\n5) [مستوى التطبيق] هل الصدق ينجي من العقاب؟\n   الإجابة النموذجية: نعم.\n6) [مستوى الاستدلال] ماذا تعلمت من قصة أحمد لتطبقه في حياتك؟\n   الإجابة النموذجية: أن أقول الصدق دائمًا حتى لو أخطأت.", "للطالب: يقرأ الحديث ص68 مع أسرته ويرسم سلسلة الصدق.\nلولي الأمر: يقرأ الحديث مع طفله ويحدّثه عن الصدق.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 68–73.\nللطالب: يسمّع الحديث لأسرته ويحكي القصة المصورة ص69–70.\nلولي الأمر: يكافئ طفله على صدقه ولو أخطأ؛ تشجيعًا له.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=28"]}, {"k": 2, "axis": "الصدق طريق إلى الخير (المتاهة) والتزام الصدق في المواقف (أفكر وأطبق) + أختبر تعلمي في الصدق والاقتداء بالنبي ﷺ الصادق", "week": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1. يستفيد أن الصدق طريق إلى الخير.\n2. يحل المتاهة مع مجموعته ويقرأ العبارة الصحيحة في نهايتها.\n3. يلتزم قول الصدق في مواقف الحياة المختلفة.\n4. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n5. يقتدي بالنبي ﷺ الملقب بالصادق الأمين.\n6. ينفر من صفة الكذب.\n\nمخرج تعليمي آخر:\nيقترح تصرفًا صادقًا في موقف جديد.\nيصمم مع فريقه شعارًا عن الصدق.", "المخرج 1: يستفيد أن الصدق طريق إلى الخير. ← فهم\nالمخرج 2: يحل المتاهة مع مجموعته ويقرأ العبارة الصحيحة في نهايتها. ← تطبيق\nالمخرج 3: يلتزم قول الصدق في مواقف الحياة المختلفة. ← تقييم\nالمخرج 4: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج 5: يقتدي بالنبي ﷺ الملقب بالصادق الأمين. ← تطبيق\nالمخرج 6: ينفر من صفة الكذب. ← تقييم\nالمخرج الآخر: يقترح تصرفًا صادقًا في موقف جديد. ← إبداع\nالمخرج الآخر: يصمم مع فريقه شعارًا عن الصدق. ← إبداع", "التعلم التعاوني، التعلم المبني على اللعب، التعلم المبني على حل المشكلات، التعلم الذاتي، التعلم المبني على المشاريع", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: متاهة مكبرة لكل مجموعة، أخرى: ورق ملون للشعارات", "الصدق، الخير، الكذب، القدوة، الصادق الأمين", "تعرض المعلمة طريقين مرسومين: «طريق الصدق» يصل إلى بيت جميل، و«طريق الكذب» ينتهي بحفرة، وتسأل: أي الطريقين تسلك؟", "1. التهيئة: تعرض المعلمة الطريقين وتسأل، والتلاميذ يختارون طريق الصدق ويعللون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أتعاون مع زملائي: المتاهة ص71: تجعلهم المعلمة في مجموعات لحل المتاهة، وتقرأ الإجابة في بدايتها ونهايتها، وتحل المجموعات المتاهة ويقرأ بعضهم العبارة الأخيرة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أفكر وأطبق ص72: تقرأ المعلمة الأرومة: طفل كتب على جدران غرفة الجلوس فسألت الأم؟ وتحاورهم في النشاطين (تقويم تكويني)، والتلاميذ يبدون آراءهم ويختارون التصرف الصادق (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. مواقف جديدة: تطرح المعلمة مواقف: كسرت كوبًا، نسيت الواجب، والتلاميذ يقترحون الإجابة الصادقة لكل موقف (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تسميع الحديث: تسمّع المعلمة الحديث جماعيًا، والتلاميذ يسمّعون (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. أختبر تعلمي ص73: توجه المعلمة حل الأنشطة الثلاثة: الاقتداء بالنبي ﷺ، والصدق طريق الجنة، والكتابة، والتلاميذ يحلون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. تصحيح ومناقشة: تصحح المعلمة الإجابات وتناقش أسبابها (تقويم تكويني)، والتلاميذ يعللون إجاباتهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n8. شعار الصدق: تطلب المعلمة من كل فريق تصميم شعار قصير عن الصدق، ويصمم كل فريق شعارًا ويعرضه (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n9. تسميع الحديث: تسمّع المعلمة لمن لم يتقن الحديث، والتلاميذ يسمّعون (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] إلى أين يوصل طريق الصدق في المتاهة؟\n   الإجابة النموذجية: إلى الخير والجنة.\n2) [مستوى التطبيق] كتب طفل على الجدار فسألته أمه، فماذا يقول؟\n   الإجابة النموذجية: يقول الصدق: أنا كتبت يا أمي، وأعتذر.\n3) [مستوى الاستدلال] نسيت واجبك المنزلي، فماذا تقول لمعلمتك؟ ولماذا؟\n   الإجابة النموذجية: أقول الصدق: نسيته وسأحضره غدًا؛ لأن الصدق طريق الخير.\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ حديث الصدق جملةً جملة ويضبط معه نطق «البِرّ»، ثم يرسم معه سهمًا: الصدق ← البر ← الجنة، ثم يسأله: ما معنى «الصدق»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتأليف قصة قصيرة عن طفل قال الصدق فنجا من مشكلة، وربطها بقول الحديث إن الصدق يهدي إلى البر.\n\n4) [مستوى المعرفة] بماذا لُقّب الرسول ﷺ؟\n   الإجابة النموذجية: الصادق الأمين.\n5) [مستوى التطبيق] سمّع الحديث الشريف.\n   الإجابة النموذجية: تسميع صحيح.\n6) [مستوى الاستدلال] كيف تقتدي بالرسول ﷺ في الصدق؟\n   الإجابة النموذجية: أقول الحق دائمًا ولا أكذب حتى في المزاح واللعب.\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ حديث الصدق جملةً جملة ويضبط معه نطق «البِرّ»، ثم يرسم معه سهمًا: الصدق ← البر ← الجنة، ثم يسأله: ما معنى «الصدق»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتأليف قصة قصيرة عن طفل قال الصدق فنجا من مشكلة، وربطها بقول الحديث إن الصدق يهدي إلى البر.", "1) [مستوى المعرفة] هل الكذب طريق إلى الخير؟\n   الإجابة النموذجية: لا.\n2) [مستوى التطبيق] اذكر موقفًا تقول فيه الصدق.\n   الإجابة النموذجية: مثل: عندما أكسر شيئًا أخبر والديّ.\n3) [مستوى الاستدلال] لماذا نحب الصادقين؟\n   الإجابة النموذجية: لأننا نثق بهم ولأن الله يحبهم.\n\n4) [مستوى المعرفة] أكمل: «وإن البر يهدي إلى ...».\n   الإجابة النموذجية: الجنة.\n5) [مستوى التطبيق] ضع ✓ أمام الصفة التي يحبها الله: الصدق / الكذب.\n   الإجابة النموذجية: ✓ الصدق.\n6) [مستوى الاستدلال] اكتب شعارًا قصيرًا يدعو إلى الصدق.\n   الإجابة النموذجية: مثل: «صدقي طريقي إلى الجنة».", "للطالب: يحل متاهة ص71 ويطبق الصدق في مواقفه اليومية.\nلولي الأمر: يحاور طفله في مواقف الصدق ويثني على صدقه.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 68–73.\nللطالب: يراجع الدرس ص68–73 ويعلّق شعار الصدق في غرفته.\nلولي الأمر: يكون قدوة لطفله في الصدق ويثني عليه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=28"]}], "weeks": [15]}, {"id": "h_kawthar", "title": "سورة الكوثر (تلاوة وحفظ)", "unit": "مقرر التلاوة والحفظ (الجزء الثاني)", "sb": "كتاب الطالب – الجزء الثاني: ص 11–12", "tg": "دليل المعلم: ص 21، 24 (توجيهات حصص التلاوة والمحاكاة والترديد)", "n": 1, "periods": [{"k": 1, "axis": "تلاوة سورة الكوثر وحفظها + تسميع سور الجزء الثاني: الكوثر والكافرون والنصر والمسد", "week": "الأسبوع السادس عشر (20–24/12/2026م)", "f": ["1. يتلو سورة الكوثر تلاوة صحيحة.\n2. يحفظ سورة الكوثر كاملة.\n3. يضبط نطق: «أعطيناك، الكوثر، وانحرْ، شانئك، الأبتر».\n4. يسمّع سورة الكوثر حفظًا متقنًا.\n5. يسمّع سور الكافرون والنصر والمسد مراجعةً.\n6. يرتب السور الأربع بحسب ترتيبها في المصحف.\n\nمخرج تعليمي آخر:\nيتعرّف أن الكوثر نهر في الجنة أعطاه الله للرسول ﷺ.\nيقيّم مستوى حفظه ذاتيًا في بطاقة الإنجاز.", "المخرج 1: يتلو سورة الكوثر تلاوة صحيحة. ← تطبيق\nالمخرج 2: يحفظ سورة الكوثر كاملة. ← تذكر\nالمخرج 3: يضبط نطق: «أعطيناك، الكوثر، وانحرْ، شانئك، الأبتر». ← تطبيق\nالمخرج 4: يسمّع سورة الكوثر حفظًا متقنًا. ← تذكر\nالمخرج 5: يسمّع سور الكافرون والنصر والمسد مراجعةً. ← تذكر\nالمخرج 6: يرتب السور الأربع بحسب ترتيبها في المصحف. ← فهم\nالمخرج الآخر: يتعرّف أن الكوثر نهر في الجنة أعطاه الله للرسول ﷺ. ← تذكر\nالمخرج الآخر: يقيّم مستوى حفظه ذاتيًا في بطاقة الإنجاز. ← تقييم", "التعلم بالنمذجة، التعلم التعاوني، التعلم الذاتي، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: المحاكاة والترديد", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقة إنجاز الحفظ ولوحة نجوم الحفّاظ", "الكوثر، الصلاة، النحر، التسميع، المراجعة، ترتيب السور", "تسأل المعلمة: ما أقصر سورة في القرآن الكريم؟ وتقول: إنها سورة من ثلاث آيات، فيها اسم نهر في الجنة.", "1. التهيئة: تطرح المعلمة اللغز، والتلاميذ يخمنون: سورة الكوثر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التلاوة النموذجية: تُسمعهم المعلمة السورة ص12 من الجزء الثاني مرتين، والتلاميذ ينصتون ويتابعون (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلقين والترديد: تلقّن المعلمة الآيات الثلاث وتضبط «وانحرْ، شانئَك، الأبتر»، والتلاميذ يرددون جماعيًا وزمريًا وفرديًا (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n4. ما الكوثر؟: تبيّن المعلمة أن الكوثر نهر في الجنة أعطاه الله لنبينا ﷺ (تقويم تكويني)، والتلاميذ يذكرون معنى الكوثر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تسميع ثنائي: تطلب المعلمة تبادل التسميع بين الأزواج، ويسمّع كل تلميذ لزميله (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تلاوة جماعية متتابعة: تقود المعلمة تلاوة السور الأربع بالترتيب، والتلاميذ يتلون جماعيًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. التسميع الفردي والثنائي: تسمّع المعلمة لعدد من التلاميذ، والبقية أزواج ببطاقة الإنجاز، والتلاميذ يسمّعون ويقيّمون (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. ترتيب السور: تعرض المعلمة بطاقات السور مبعثرة (تقويم تكويني)، ويرتبونها التلميذ: الكوثر، الكافرون، النصر، المسد (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n9. بطاقة الإنجاز: توزّع المعلمة البطاقة ليقيّم كل تلميذ حفظه بالنجوم، والتلاميذ يلونون النجوم بحسب إتقانهم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] كم آية في سورة الكوثر؟\n   الإجابة النموذجية: ثلاث آيات.\n2) [مستوى التطبيق] أكمل: «إنا أعطيناك ...».\n   الإجابة النموذجية: الكوثر.\n3) [مستوى الاستدلال] ما الكوثر؟\n   الإجابة النموذجية: نهر في الجنة أعطاه الله للرسول ﷺ.\n\n• نشاط علاجي (لمن لم يتقن): يتلو المعلم سورة الكوثر آيةً آيةً ويرددها التلميذ مع ضبط «أعطيناك، الكوثر، وانحرْ، شانئك، الأبتر»، ثم يطلب منه إكمال: «إنا أعطيناك ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتسميع سورة الكوثر غيبًا وبيان معنى «الكوثر»، ثم المقارنة بين عدد آياتها وعدد آيات سورة النصر.\n\n4) [مستوى المعرفة] سمّع سورة الكوثر.\n   الإجابة النموذجية: تسميع صحيح.\n5) [مستوى التطبيق] ما السورة التي تأتي بعد الكوثر؟\n   الإجابة النموذجية: سورة الكافرون.\n6) [مستوى الاستدلال] رتّب: النصر، الكوثر، المسد، الكافرون.\n   الإجابة النموذجية: الكوثر، الكافرون، النصر، المسد.\n\n• نشاط علاجي (لمن لم يتقن): يتلو المعلم سورة الكوثر آيةً آيةً ويرددها التلميذ مع ضبط «أعطيناك، الكوثر، وانحرْ، شانئك، الأبتر»، ثم يطلب منه إكمال: «إنا أعطيناك ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتسميع سورة الكوثر غيبًا وبيان معنى «الكوثر»، ثم المقارنة بين عدد آياتها وعدد آيات سورة النصر.", "1) [مستوى المعرفة] ما الآية الثانية في سورة الكوثر؟\n   الإجابة النموذجية: «فصلِّ لربك وانحر».\n2) [مستوى التطبيق] ما آخر كلمة في سورة الكوثر؟\n   الإجابة النموذجية: «الأبتر».\n3) [مستوى الاستدلال] سمّع سورة الكوثر كاملة.\n   الإجابة النموذجية: تسميع صحيح.\n\n4) [مستوى المعرفة] سمّع سورة النصر.\n   الإجابة النموذجية: تسميع صحيح.\n5) [مستوى التطبيق] أي السور الأربع أقصر؟\n   الإجابة النموذجية: سورة الكوثر.\n6) [مستوى الاستدلال] سمّع سورتين من الأربع تختارهما.\n   الإجابة النموذجية: تسميع صحيح للسورتين.", "للطالب: يسمّع سورة الكوثر ص12 لأسرته.\nلولي الأمر: يستمع إلى طفله ويضبط نطق «شانئك».\nالمرجع: كتاب الطالب (الجزء الثاني) ص 11–12.\nللطالب: يراجع السور الأربع ص12–13 في الإجازة القصيرة ويسمّعها لأسرته.\nلولي الأمر: يستمع إلى تسميع طفله للسور الأربع ويوقّع على بطاقة الإنجاز.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=29"]}], "weeks": [16, 17]}, {"id": "istinja", "title": "الاستنجاء", "unit": "الوحدة الرابعة", "sb": "كتاب الطالب – الجزء الثاني: ص 74–77", "tg": "دليل المعلم: ص 99–100", "n": 2, "periods": [{"k": 1, "axis": "المقصود بالاستنجاء (الحوار المصوّر) وأهمية الماء في الطهارة + آداب التطهر من النجاسة: اليد اليسرى والماء ثم غسل اليدين (أفكر وأطبق)", "week": "الأسبوع السادس عشر (20–24/12/2026م)", "f": ["1. يفهم المقصود بالاستنجاء.\n2. يجيب عن أسئلة الحوار المصوّر.\n3. يدرك أهمية استخدام الماء عند الطهارة من النجاسة.\n4. يطبق بعض الآداب عند التطهر من النجاسة.\n5. يعلل استخدام اليد اليسرى في الاستنجاء.\n6. يجيب عن نشاط «أفكر وأطبق» فرديًا.\n\nمخرج تعليمي آخر:\nيربط الاستنجاء بدرسي النجاسات وآداب قضاء الحاجة.\nيتعرّف آدابًا إضافية: التجفيف بالمحارم وعدم الاستعجال.", "المخرج 1: يفهم المقصود بالاستنجاء. ← فهم\nالمخرج 2: يجيب عن أسئلة الحوار المصوّر. ← فهم\nالمخرج 3: يدرك أهمية استخدام الماء عند الطهارة من النجاسة. ← فهم\nالمخرج 4: يطبق بعض الآداب عند التطهر من النجاسة. ← تطبيق\nالمخرج 5: يعلل استخدام اليد اليسرى في الاستنجاء. ← فهم\nالمخرج 6: يجيب عن نشاط «أفكر وأطبق» فرديًا. ← تطبيق\nالمخرج الآخر: يربط الاستنجاء بدرسي النجاسات وآداب قضاء الحاجة. ← تحليل\nالمخرج الآخر: يتعرّف آدابًا إضافية: التجفيف بالمحارم وعدم الاستعجال. ← تذكر", "التعلم التشاركي، التعلم بالاكتشاف، التعلم بالنمذجة، التعلم الذاتي، التعلم المبني على حل المشكلات\nاستراتيجيات أخرى من دليل المعلم: الحوار والمناقشة", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: لوحات النشاط", "الاستنجاء، الصنبور، الطهارة، اليد اليسرى، الصابون، التجفيف", "تراجع المعلمة ذكري دخول الحمام والخروج منه، ثم تسأل: ماذا نفعل بعد قضاء الحاجة لنكون طاهرين؟", "1. التهيئة: تراجع المعلمة الذكرين وتطرح السؤال، والتلاميذ يسمّعون الذكرين ويجيبون (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الحوار المصوّر ص74: تعرض المعلمة الحوار وتقرؤه بأسلوب جذاب، وتوجّه إلى الإنصات الجيد، والتلاميذ ينصتون ويتابعون الصور (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. مناقشة الحوار: تسأل المعلمة: من أين يخرج أحمد؟ من صادف؟ عن أي شيء سألته أمه؟ (تقويم تكويني)، والتلاميذ يجيبون عن الأسئلة (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: الحوار والمناقشة.\n\n4. ما الاستنجاء؟: تعرّف المعلمة الاستنجاء: تطهير مكان خروج البول والغائط بالماء، والتلاميذ يرددون التعريف (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. أربط الدروس: تربط المعلمة بين النجاسات وقضاء الحاجة والاستنجاء، والتلاميذ يذكرون الصلة بينها (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أي يد؟ ولماذا؟: تؤكد المعلمة استخدام اليد اليسرى وتعلل: نُبقي اليمنى للطعام والسلام، والتلاميذ يعللون ويرددون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. أفكر وأطبق ص75–76: تعرض المعلمة النشاط بجهاز العرض وتطلب الإجابة فرديًا وتصحح للمخفق (تقويم تكويني)، ويجيب كل تلميذ عن النشاط بمفرده (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n8. آداب إضافية: تذكر المعلمة آدابًا تناسب عمرهم: التجفيف بالمحارم، عدم الاستعجال، غسل اليدين بالصابون، والتلاميذ يرتبون خطوات الاستنجاء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أرتب الخطوات: تعرض المعلمة بطاقات الخطوات مبعثرة، ويرتبونها التلميذ ترتيبًا صحيحًا (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "1) [مستوى المعرفة] ما الاستنجاء؟\n   الإجابة النموذجية: تطهير مكان خروج البول والغائط بالماء.\n2) [مستوى التطبيق] بماذا نستنجي؟\n   الإجابة النموذجية: بالماء.\n3) [مستوى الاستدلال] لماذا نستنجي بعد قضاء الحاجة؟\n   الإجابة النموذجية: لنزيل النجاسة ونكون طاهرين للصلاة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الحوار المصوّر عن الاستنجاء بالصور، ويوضح أنه تطهير مكان خروج البول والغائط بالماء، ثم يسأله: بماذا نستنجي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالربط بين دروس النجاسات وآداب قضاء الحاجة والاستنجاء في مخطط بسيط، وتوضيح لماذا نستنجي قبل الصلاة.\n\n4) [مستوى المعرفة] بأي يد نستنجي؟\n   الإجابة النموذجية: باليد اليسرى.\n5) [مستوى التطبيق] ماذا أفعل بعد الاستنجاء؟\n   الإجابة النموذجية: أغسل يديّ بالماء والصابون.\n6) [مستوى الاستدلال] لماذا نستخدم اليد اليسرى في الاستنجاء؟\n   الإجابة النموذجية: لنُبقي اليد اليمنى للطعام والأعمال الطيبة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الحوار المصوّر عن الاستنجاء بالصور، ويوضح أنه تطهير مكان خروج البول والغائط بالماء، ثم يسأله: بماذا نستنجي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالربط بين دروس النجاسات وآداب قضاء الحاجة والاستنجاء في مخطط بسيط، وتوضيح لماذا نستنجي قبل الصلاة.", "1) [مستوى المعرفة] عن أي شيء سألت الأم أحمد؟\n   الإجابة النموذجية: هل استنجى بعد قضاء حاجته.\n2) [مستوى التطبيق] أكمل: الاستنجاء يكون بـ...\n   الإجابة النموذجية: الماء.\n3) [مستوى الاستدلال] ما الصلة بين الاستنجاء ودرس النجاسات؟\n   الإجابة النموذجية: البول والغائط نجاسات نزيلها بالاستنجاء.\n\n4) [مستوى المعرفة] هل أستعجل في الخروج من دورة المياه قبل ا
