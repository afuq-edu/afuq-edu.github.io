:root{--ink:#26343B;--muted:#5E7F70;--sage:#2F5F4F;--sage-50:#EEF5F1;--sage-100:#DCE7E1;--sage-300:#A9CDB9;
--sand-50:#FBF4E2;--sand-200:#EEDDB3;--sky-50:#EEF4FA;--sky-600:#35566E;--bg:#F7FAF8;--ok:#2E7D5B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Naskh,"Noto Naskh Arabic",serif;font-size:17px;line-height:1.8;
padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:920px;margin:0 auto;padding:14px 14px 60px}
header.top{background:#fff;border:1.3px solid #C9DFD3;border-radius:14px;padding:12px 16px}
.subj{font-family:Plex,sans-serif;font-size:13px;color:var(--muted)}
h1{font-family:Plex,sans-serif;font-size:22px;color:var(--sage);margin:2px 0 8px;line-height:1.4}
.mode{display:flex;background:var(--sage-50);border:1px solid var(--sage-100);border-radius:999px;padding:4px;gap:4px;width:max-content;max-width:100%}
.mode button{font-family:Plex,sans-serif;font-size:15px;border:0;background:transparent;color:var(--sage);padding:7px 18px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:#fff;box-shadow:0 0 0 1.5px var(--sage-300) inset;color:var(--ink)}
.mode button:focus-visible,.tabs button:focus-visible,select:focus-visible,.copy:focus-visible{outline:3px solid #7DB3E0;outline-offset:2px}
.explain{margin:8px 0 0;font-size:15px;color:#41525A}
.explain p{margin:0}
.status{margin-top:8px;background:var(--sand-50);border:1px solid var(--sand-200);border-radius:10px;padding:6px 12px;font-family:Plex,sans-serif;font-size:15px;color:#6B5523}
.pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.pick label{font-family:Plex,sans-serif;font-size:14px;color:var(--muted)}
select{font-family:Naskh,serif;font-size:16px;padding:7px 10px;border-radius:10px;border:1.3px solid var(--sage-300);background:#fff;color:var(--ink);max-width:100%;flex:1 1 320px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tabs button{font-family:Plex,sans-serif;font-size:14px;border:1.3px solid var(--sage-100);background:#fff;color:var(--sage);padding:5px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sage-50);border-color:var(--sage-300);color:var(--ink)}
.info{margin-top:14px;background:#fff;border:1px solid var(--sage-100);border-radius:12px;padding:9px 14px;font-size:15px}
.info .row{display:flex;flex-wrap:wrap;gap:4px 18px}
.info b{font-family:Plex,sans-serif;color:#3F6E5D;font-weight:600}
.axis{margin-top:6px;background:var(--sand-50);border:1px solid var(--sand-200);border-radius:8px;padding:3px 10px}
.card{margin-top:12px;background:#fff;border:1px solid var(--sage-100);border-radius:12px;overflow:hidden}
.card h2{display:flex;align-items:center;gap:10px;margin:0;padding:7px 12px;background:var(--sage-50);border-bottom:1px solid var(--sage-100);font-family:Plex,sans-serif;font-size:16px;color:var(--sage);font-weight:600}

) أكتشف المعنى ص17 (7 د: من الدقيقة 18 إلى 25)\n   المعلمة: تقرأ كل جملة وتطلب وضع الإصبع على الصورة المعبّرة عنها (تقويم تكويني).\n   التلميذ: يضعون رقم الكلمة في الصورة المناسبة.\n5) أعبّر بلغتي (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تسأل: ماذا نقصد عندما نقول «الحمد لله»؟\n   التلميذ: يعبّرون عن المعنى بلغتهم: نشكر الله ونثني عليه.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما رقم آية البسملة في سورة الفاتحة؟\n   الإجابة النموذجية: رقم (1).\n2) [المستوى المتوقع] ما معنى «الحمد لله»؟\n   الإجابة النموذجية: الشكر والثناء لله تعالى.\n3) [المستوى المتقدم] لماذا نعدّ البسملة آية من الفاتحة ولا نعدّها آية في السور الأخرى؟\n   الإجابة النموذجية: لأن لها رقمًا في الفاتحة، وفي السور الأخرى تأتي قبل الآية الأولى بلا رقم.", "1) [مستوى الدعم] أكمل: «الحمد لله رب ...».\n   الإجابة النموذجية: العالمين.\n2) [المستوى المتوقع] صِل الكلمة «الرحمن الرحيم» بالصورة المعبرة عنها واذكر المعنى.\n   الإجابة النموذجية: صورة تدل على رحمة الله الواسعة بعباده.\n3) [المستوى المتقدم] اتلُ سورة الفاتحة تلاوة صحيحة مبتدئًا بالبسملة.\n   الإجابة النموذجية: تلاوة صحيحة كاملة.", "للطالب: يحل نشاط «أكتشف المعنى» ص17 ويتلو السورة على أسرته.\nلولي الأمر: يذكّر طفله بقول «بسم الله» قبل الأعمال، ويسأله عن معنى «الحمد لله».\nالمرجع: كتاب الطالب (الجزء الأول) ص 16–22."]}, {"k": 3, "axis": "مفهوما يوم الدين والصراط المستقيم والله أرحم الراحمين", "week": "الأسبوع الأول (6–10/9/2026م)", "f": ["1. يوضح مفهومي «يوم الدين» و«الصراط المستقيم».\n2. يستنتج أن الله تعالى أرحم الراحمين من خلال القصة.\n3. يذكر أعمالًا صالحة توصل إلى الجنة.\nمخرج تعليمي آخر: يكتب استنتاجه في المكان المخصص «أدوّن استنتاجي».", "المخرج 1: يوضح مفهومي «يوم الدين» و«الصراط المستقيم». ← فهم\nالمخرج 2: يستنتج أن الله تعالى أرحم الراحمين من خلال القصة. ← تحليل\nالمخرج 3: يذكر أعمالًا صالحة توصل إلى الجنة. ← تطبيق\nالمخرج الآخر: يكتب استنتاجه في المكان المخصص «أدوّن استنتاجي». ← تطبيق", "التعلم بالاكتشاف، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية، الحوار والمناقشة", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "يوم الدين، الصراط المستقيم، الرحمة، أرحم الراحمين", "تعرض المعلمة صورة طريقين: أحدهما مستقيم واضح والآخر متعرّج، وتسأل: أي الطريقين تختار لتصل إلى بيتك بسلام؟ ولماذا؟", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تعرض صورة الطريقين وتدير حوارًا قصيرًا.\n   التلميذ: يختارون الطريق المستقيم ويعلّلون.\n2) هل تعلم؟ يوم الدين (7 د: من الدقيقة 4 إلى 11)\n   المعلمة: تتلو «مالك يوم الدين» وتوضح أنه يوم القيامة وأن الله وحده مالكه.\n   التلميذ: يرددون الآية ويذكرون اسمًا آخر ليوم الدين.\n3) الصراط المستقيم (6 د: من الدقيقة 11 إلى 17)\n   المعلمة: تتلو «اهدنا الصراط المستقيم» وتناقش صورة الكتاب ص18 لتصل إلى أنه طريق الإسلام الموصل إلى الجنة.\n   التلميذ: يذكرون أعمالًا صالحة: الصلاة، الصدق، بر الوالدين (تقويم تكويني).\n4) أستمع وأستنتج ص19 (8 د: من الدقيقة 17 إلى 25)\n   المعلمة: تقرأ قصة المرأة التي ضمّت طفلها بأسلوب مؤثر، وتناقش الأسئلة بعدها.\n   التلميذ: يستنتجون أن الله أرحم بعباده من الأم بولدها، ويكتبون «الرحيم».\n5) أدوّن استنتاجي (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تتابع كتابة الكلمات المنقطة.\n   التلميذ: يكتبون استنتاجهم في الكتاب.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما المقصود بـ«يوم الدين»؟\n   الإجابة النموذجية: يوم القيامة.\n2) [المستوى المتوقع] ما الصراط المستقيم؟\n   الإجابة النموذجية: طريق الإسلام الحق الموصل إلى الجنة.\n3) [المستوى المتقدم] ماذا نستنتج من قصة الأم التي ضمّت طفلها؟\n   الإجابة النموذجية: أن الله تعالى أرحم بعباده من الأم بولدها، فهو أرحم الراحمين.", "1) [مستوى الدعم] من مالك يوم الدين؟\n   الإجابة النموذجية: الله تعالى.\n2) [المستوى المتوقع] اذكر عملين صالحين يسير بهما المسلم على الصراط المستقيم.\n   الإجابة النموذجية: مثل: الصلاة، والصدق، وبر الوالدين.\n3) [المستوى المتقدم] إذا كانت الأم رحيمة بأبنائها، فماذا نقول عن رحمة الله تعالى؟ ولماذا؟\n   الإجابة النموذجية: رحمة الله أعظم من رحمة جميع الأمهات؛ لأنه الخالق أرحم الراحمين.", "للطالب: يقرأ قصة «أستمع وأستنتج» ص19 مع أسرته ويحكيها بأسلوبه.\nلولي الأمر: يحاور طفله في أعمال الخير التي يفعلها يوميًا ليسير على الصراط المستقيم.\nالمرجع: كتاب الطالب (الجزء الأول) ص 16–22."]}, {"k": 4, "axis": "تعلمت من سورة الفاتحة: الحمد والاستعانة بالله وتقويم الدرس", "week": "الأسبوع الأول (6–10/9/2026م)", "f": ["1. يحمد الله تعالى ويستعين به في جميع أحواله.\n2. يذكر مواقف يبدأ فيها بالبسملة ويختمها بالحمد.\n3. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\nمخرج تعليمي آخر: يعبّر عن حبه لله تعالى بأسلوبه الخاص.", "المخرج 1: يحمد الله تعالى ويستعين به في جميع أحواله. ← تطبيق\nالمخرج 2: يذكر مواقف يبدأ فيها بالبسملة ويختمها بالحمد. ← تطبيق\nالمخرج 3: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يعبّر عن حبه لله تعالى دم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ضع دائرة حول نجاسة في المشهد.\n   الإجابة النموذجية: تحديد نجاسة صحيحة في الصورة.\n2) [المستوى المتوقع] ماذا نفعل إذا أصابت النجاسة حذاءنا؟\n   الإجابة النموذجية: نغسله بالماء.\n3) [المستوى المتقدم] لماذا ننتبه لموضع أقدامنا في الحديقة والشارع؟\n   الإجابة النموذجية: حتى لا تصيبنا نجاسة فنضطر إلى غسلها.", "1) [مستوى الدعم] أكمل: إذا أصابت النجاسة يدي أغسلها بـ...\n   الإجابة النموذجية: الماء.\n2) [المستوى المتوقع] اذكر احتياطًا واحدًا للتعامل مع النجاسة.\n   الإجابة النموذجية: مثل: لبس الحذاء والانتباه لموضع القدمين.\n3) [المستوى المتقدم] وجدت نجاسة في ممر المدرسة، فكيف تتصرف؟\n   الإجابة النموذجية: أتجنبها وأخبر المعلمة أو العامل لإزالتها.", "للطالب: يكمل نشاط ص40 ويذكر لأسرته الاحتياطات التي تعلّمها.\nلولي الأمر: يتابع غسل طفله يديه وحذاءه عند العودة من الخارج.\nالمرجع: كتاب الطالب (الجزء الأول) ص 38–42."]}, {"k": 4, "axis": "أتعلم وأطبق: تجنب النجاسات والتصرف السليم عند الإصابة بها", "week": "الأسبوع الخامس (4–8/10/2026م)", "f": ["1. يطبق التصرف السليم عند إصابة ثوبه أو بدنه بنجاسة.\n2. يحرص على تجنب النجاسات.\n3. يرتب خطوات إزالة النجاسة.\nمخرج تعليمي آخر: يحافظ على نظافته الشخصية في الجسم والثوب.", "المخرج 1: يطبق التصرف السليم عند إصابة ثوبه أو بدنه بنجاسة. ← تطبيق\nالمخرج 2: يحرص على تجنب النجاسات. ← تقييم\nالمخرج 3: يرتب خطوات إزالة النجاسة. ← فهم\nالمخرج الآخر: يحافظ على نظافته الشخصية في الجسم والثوب. ← تطبيق", "التعلم بالنمذجة، التعلم المبن اس على المعروف.", "المخرج 1: يتعرّف مفهوم شكر الله تعالى. ← فهم\nالمخرج 2: يميز بين شكر الناس وشكر الله تعالى. ← تحليل\nالمخرج 3: يعبّر عن شكره لله تعالى بعبارة مناسبة. ← تطبيق\nالمخرج الآخر: يشكر الناس على المعروف. ← تطبيق", "التعلم بالاكتشاف، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: الحوار والمناقشة", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الشكر، النعمة، المعروف", "تسرد المعلمة موقفًا: ساعدها زميل في حمل كتبها فقالت له «شكرًا»، ثم تسأل: ماذا نقول لمن قدّم لنا معروفًا؟ وما رأيكم في من لا يشكر الآخرين؟", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تسرد الموقف وتطرح السؤالين.\n   التلميذ: يجيبون ويذكرون مواقفهم.\n2) من شكر الناس إلى شكر الله (5 د: من الدقيقة 4 إلى 9)\n   المعلمة: تسأل: كيف يكون شكر الله تعالى؟ ولماذا نشكره؟\n   التلميذ: يقدمون أفكارًا أولية.\n3) أستمع وأستنتج ص44 (8 د: من الدقيقة 9 إلى 17)\n   المعلمة: تعرض الصورة وتقرأ الحوار بين أحمد وأبيه.\n   التلميذ: يتابعون الحوار ويحددون من شكر أحمد.\n4) مناقشة الحوار (7 د: من الدقيقة 17 إلى 24)\n   المعلمة: تسأل: لماذا شكر أحمد أباه؟ لماذا طلب الأب توجيه الشكر لله؟ ما معنى «نعم الله لا تُحصى»؟ (تقويم تكويني)\n   التلميذ: يجيبون ويعدّون نعمًا كثيرة.\n5) أكتب على النقاط (5 د: من الدقيقة 24 إلى 29)\n   المعلمة: توجّه حل النشاط بالكتابة.\n   التلميذ: يكتبون الكلمة المطلوبة في الكتاب.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ماذا نقول لمن قدّم لنا معروفًا؟\n   الإجابة النموذجية: شكرًا، جزاك الله خيرًا.\n2) [المستوى المتوقع] لماذا نشكر الله تعالى؟\n   الإجابة النموذجية: لأنه أنعم علينا بنعم كثيرة.\n3) [المستوى المتقدم] ما معنى «نعم الله لا تُحصى»؟\n   الإجابة النموذجية: أن نعم الله كثيرة جدًا لا نستطيع عدّها.", "1) [مستوى الدعم] من الذي أعطانا النعم؟\n   الإجابة النموذجية: الله تعالى.\n2) [المستوى المتوقع] اذكر ثلاث نعم أنعم الله بها عليك.\n   الإجابة النموذجية: مثل: العينان، والطعام، والأسرة.\n3) [المستوى المتقدم] لماذا وجّه الأب أحمد إلى شكر الله مع أنه هو من اشترى له الهدية؟\n   الإجابة النموذجية: لأن الله هو الذي رزق الأب المال، فكل النعم من الله.", "للطالب: يقرأ حوار أحمد وأبيه ص44 ويعدّ مع أسرته خمس نعم.\nلولي الأمر: يعوّد طفله قول «الحمد لله» و«شكرًا» في المواقف اليومية.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50."]}, {"k": 2, "axis": "مظاهر شكر الله تعالى على نعمه (بالقول والفعل)", "week": "الأسبوع السادس (11–15/10/2026م)", "f": ["1. يحدد مظاهر شكر الله تعالى على نعمه المختلفة.\n2. يربط كل نعمة بمظهر الشكر المناسب لها.\n3. يوضح أن الشكر يكون بالقول والفعل.\nمخرج تعليمي آخر: يقترح مظهر شكر لنعمة جديدة.", "المخرج 1: يحدد مظاهر شكر الله تعالى على نعمه المختلفة. ← فهم\nالمخرج 2: يربط كل نعمة بمظهر الشكر المناسب لها. ← تطبيق\nالمخرج 3: يوضح أن الشكر يكون بالقول والفعل. ← فهم\nالمخرج الآخر: يقترح مظهر شكر لنعمة جديدة. ← إبداع", "التعلم بالاكتشاف، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مظاهر الشكر، الشكر بالقول، الشكر بالفعل", "تسأل المعلمة: إذا أهداك صديقك قلمًا، هل يكفي أن تقول «شكرًا» ثم تكسره؟ وتستمع للإجابات.", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تطرح السؤال وتناقش.\n   التلميذ: يستنتجون أن الشكر يكون بالمحافظة على الهدية أيضًا.\n2) الشكر قول وفعل (6 د: من الدقيقة 4 إلى 10)\n   المعلمة: توضح أن شكر الله لا يكون بالقول فقط بل بالأفعال أيضًا.\n   التلميذ: يذكرون أمثلة: الحمد لله، والصلاة، والمحافظة على النعم.\n3) أتعلم وأطبق ص45–46 (9 د: من الدقيقة 10 إلى 19)\n   المعلمة: تطلب تأمل الصور وربط كل نعمة يمينًا بمظهر شكرها يسارًا (تقويم تكويني).\n   التلميذ: يصلون كل نعمة بمظهر شكرها.\n4) نعم أخرى (6 د: من الدقيقة 19 إلى 25)\n   المعلمة: تطلب تسمية نعم أخرى وتوضيح مظاهر شكرها.\n   التلميذ: يقترحون: نعمة الماء ← لا أسرف فيه.\n5) أعبّر (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تختم بعبارة: «أشكر ربي بلساني وأفعالي».\n   التلميذ: يرددونها.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] هل يكون شكر الله بالقول فقط؟\n   الإجابة النموذجية: لا، بالقول والفعل.\n2) [المستوى المتوقع] صِل: نعمة العينين ← ...\n   الإجابة النموذجية: أنظر بهما إلى ما يرضي الله وأقرأ القرآن.\n3) [المستوى المتقدم] كيف تشكر الله على نعمة الماء؟\n   الإجابة النموذجية: أحمد الله وأحافظ على الماء ولا أسرف فيه.", "1) [مستوى الدعم] اذكر عبارة نشكر بها الله بألسنتنا.\n   الإجابة النموذجية: الحمد لله.\n2) [المستوى المتوقع] كيف أشكر الله على نعمة الطعام بفعلي؟\n   الإجابة النموذجية: آكل منه ما يكفيني ولا أرمي الباقي.\n3) [المستوى المتقدم] اختر نعمة لم تُذكر في الدرس واقترح طريقة لشكرها.\n   الإجابة النموذجية: مثل: نعمة المدرسة ← أحافظ على كتبي وأتعلم بجد.", "للطالب: يحل نشاط ص45–46 ويطبق مظهر شكر واحدًا في البيت.\nلولي الأمر: يلاحظ تطبيق طفله للشكر بالفعل ويثني عليه.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50."]}, {"k": 3, "axis": "أتعاون مع زملائي: أستشعر نعم الله وأحافظ عليها", "week": "الأسبوع السادس (11–15/10/2026م)", "f": ["1. يستشعر نعم الله تعالى التي تستوجب شكره.\n2. يتحدث مع مجموعته عن نعمة وكيفية المحافظة عليها.\n3. يحترم دوره في الحديث داخل المجموعة.\nمخرج تعليمي آخر: يقدّم مظهر شكر عملي للنعمة التي تحدث عنها.", "المخرج 1: يستشعر نعم الله تعالى التي تستوجب شكره. ← تقييم\nالمخرج 2: يتحدث مع مجموعته عن نعمة وكيفية المحافظة عليها. ← تطبيق\nالمخرج 3: يحترم دوره في الحديث داخل المجموعة. ← تطبيق\nالمخرج الآخر: يقدّم مظهر شكر عملي للنعمة التي تحدث عنها. ← إبداع", "التعلم التعاوني، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: صور النعم الست مكبرة", "النعمة، المحافظة على النعم، الشكر", "تغمض المعلمة عينيها لحظة وتطلب من التلاميذ تقليدها، ثم تسأل: كيف كان شعوركم عندما لم تروا شيئًا؟ ماذا نقول لله على نعمة البصر؟", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: نشاط إغماض العينين والسؤال.\n   التلميذ: يعبّرون عن شعورهم ويحمدون الله.\n2) تقسيم المجموعات (4 د: من الدقيقة 4 إلى 8)\n   المعلمة: تقسم الصف إلى ست مجموعات وتعطي كل مجموعة صورة نعمة من النشاط ص47.\n   التلميذ: تتسلم كل مجموعة صورتها.\n3) عصف ذهني داخل المجموعات (8 د: من الدقيقة 8 إلى 16)\n   المعلمة: تطلب الحوار حول النعمة: ما فائدتها؟ كيف نحافظ عليها؟\n   التلميذ: يتحاورون ويجهزون جملتين.\n4) عرض المجموعات (9 د: من الدقيقة 16 إلى 25)\n   المعلمة: تعرض الصور على السبورة وتنظم الأدوار وتعطي كل تلميذ فرصة (تقويم تكويني).\n   التلميذ: يتحدث أفراد المجموعة عن النعمة والمحافظة عليها.\n5) تعزيز (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تعزز المجموعات وتلخص على السبورة.\n   التلميذ: يرددون: نعم الله كثيرة فلنشكره.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] سمِّ النعمة التي تحدثت عنها مجموعتك.\n   الإجابة النموذجية: ذكر النعمة الصحيحة.\n2) [المستوى المتوقع] كيف نحافظ على نعمة الصحة؟\n   الإجابة النموذجية: بالأكل الصحي والنظافة والنوم مبكرًا.\n3) [المستوى المتقدم] ماذا يحدث لو فقد الإنسان نعمة السمع؟ وماذا نتعلم من ذلك؟\n   الإجابة النموذجية: لن يسمع الأصوات؛ فنتعلم أن نشكر الله على نعمة السمع.", "1) [مستوى الدعم] أكمل: نعم الله كثيرة فـ... الله عليها.\n   الإجابة النموذجية: نشكر.\n2) [المستوى المتوقع] اذكر نعمة وطريقة للمحافظة عليها.\n   الإجابة النموذجية: مثل: نعمة الماء ← لا أسرف فيه.\n3) [المستوى المتقدم] لماذا يجب أن نحافظ على النعم؟\n   الإجابة النموذجية: لأن المحافظة عليها من شكر الله تعالى، ولكي تبقى لنا.", "للطالب: يتحدث مع أسرته عن نعمة ويتفقون على طريقة للمحافظة عليها.\nلولي الأمر: يناقش طفله في نعم البيت ويشجعه على المحافظة عليها.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50."]}, {"k": 4, "axis": "أذكاري: ذكر الاستيقاظ من النوم، وأختبر تعلمي", "week": "الأسبوع السادس (11–15/10/2026م)", "f": ["1. يحفظ ذكر الاستيقاظ من النوم: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور».\n2. يطبق ذكر الاستيقاظ في حياته.\n3. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\nمخرج تعليمي آخر: يربط ذكر الاستيقاظ بشكر الله على نعمة الحياة.", "المخرج 1: يحفظ ذكر الاستيقاظ من النوم: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور». ← تذكر\nالمخرج 2: يطبق ذكر الاستيقاظ في حياته. ← تطبيق\nالمخرج 3: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يربط ذكر الاستيقاظ بشكر الله على نعمة الحياة. ← فهم", "التعلم بالنمذجة، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: تمثيل الأدوار", "الكتا n   المعلمة: توجّه إلى توصيل الرسمة وقراءة العبارة كاملة على شكل تنافس (تقويم تكويني).\n   التلميذ: يوصلون الرسمة ويقرؤون العبارة.\n5) أختبر تعلمي ص61 (7 د: من الدقيقة 22 إلى 29)\n   المعلمة: توجّه حل الأنشطة: التلوين والكتابة والتواصل الشفوي.\n   التلميذ: يحلون الأنشطة.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ماذا نقول إذا وسوس لنا الشيطان بالشر؟\n   الإجابة النموذجية: أعوذ بالله من الشيطان الرجيم.\n2) [المستوى المتوقع] اختر السلوك الصحيح: أطيع الوسوسة / أستعيذ بالله وأترك الشر.\n   الإجابة النموذجية: أستعيذ بالله وأترك الشر.\n3) [المستوى المتقدم] لماذا نقول: الشيطان ضعيف؟\n   الإجابة النموذجية: لأنه يهرب ويختفي عند ذكر الله.", "1) [مستوى الدعم] لوّن العبارة: أعوذ بالله من الشيطان الرجيم.\n   الإجابة النموذجية: تلوين صحيح.\n2) [المستوى المتوقع] اذكر موقفًا قد يوسوس فيه الشيطان لطفل.\n   الإجابة النموذجية: مثل: الكذب على أمه أو الغش.\n3) [المستوى المتقدم] ماذا تعلمت من سورة الناس لتطبقه في حياتك؟\n   الإجابة النموذجية: أن أستعيذ بالله من الشيطان وأترك ما يدعوني إليه من الشر.", "للطالب: يراجع درس سورة الناس ص56–61 ويستعيذ بالله عند الغضب.\nلولي الأمر: يذكّر طفله بالاستعاذة عند الغضب أو التفكير في الخطأ.\nالمرجع: كتاب الطالب (الجزء الأول) ص 56–61."]}], "weeks": [8]}, {"id": "ahaq", "title": "أحق الناس (حديث شريف)", "unit": "الوحدة الثانية", "sb": "كتاب الطالب – الجزء الأول  د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] من أحق الناس بحسن صحبتك؟\n   الإجابة النموذجية: أمي.\n2) [المستوى المتوقع] ما معنى «صحابتي»؟\n   الإجابة النموذجية: مرافقتي ومعاملتي.\n3) [المستوى المتقدم] كم مرة قال الرسول ﷺ «أمك»؟ ثم من ذكر؟\n   الإجابة النموذجية: ثلاث مرات، ثم ذكر الأب.", "1) [مستوى الدعم] أكمل: قال: ثم من؟ قال: «ثم ...».\n   الإجابة النموذجية: أبوك.\n2) [المستوى المتوقع] سمّع الحديث الشريف.\n   الإجابة النموذجية: تسميع صحيح.\n3) [المستوى المتقدم] ما معنى «أحقّ الناس»؟\n   الإجابة النموذجية: أولى الناس وأجدرهم.", "للطالب: يحفظ الحديث ص62 ويسمّعه لوالديه.\nلولي الأمر: يستمع إلى طفله وهو يسمّع الحديث ويحدّثه عن مكانة الأم.\nالمرجع: كتاب الطالب (الجزء الأول) ص 62–67."]}, {"k": 2, "axis": "سبب تأكيد الرسول ﷺ حسن صحبة الأم وأعمال البر بالوالدين", "week": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1. يستنتج سبب تأكيد الرسول ﷺ لحسن صحبة الأم.\n2. يطبق بعض أعمال البر بوالديه.\n3. يكتب مع مجموعته بطاقة يهديها إلى والديه.\nمخرج تعليمي آخر: يدعو لوالديه رد الجميل لهما.", "المخرج 1: يستنتج سبب تأكيد الرسول ﷺ لحسن صحبة الأم. ← تحليل\nالمخرج 2: يطبق بعض أعمال البر بوالديه. ← تطبيق\nالمخرج 3: يكتب مع مجموعته بطاقة يهديها إلى والديه. ← إبداع\nالمخرج الآخر: يدعو لوالديه رد الجميل لهما. ← تطبيق", "التعلم التعاوني، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات ملونة للإهداء", "البر، التضحية، الدعاء للوالدين", "تسمّع المعلمة الحديث مع التلاميذ جماعيًا، ثم تسأل: لماذا كرر الرسول ﷺ ذكر الأم ثلاث مرات؟", "1) التهيئة (4  المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] من مرضعة الرسول ﷺ؟\n   الإجابة النموذجية: حليمة السعدية.\n2) [المستوى المتوقع] لماذا رفضت المرضعات أخذ الرسول ﷺ؟\n   الإجابة النموذجية: لأنه كان يتيم الأب فخفن من قلة المال.\n3) [المستوى المتقدم] اذكر مظهرين لبركة الرسول ﷺ على حليمة.\n   الإجابة النموذجية: أخصبت المراعي وسمنت الأغنام.", "1) [مستوى الدعم] أين عاش الرسول ﷺ مع حليمة؟\n   الإجابة النموذجية: في بادية بني سعد.\n2) [المستوى المتوقع] ما معنى «أخصبت المراعي»؟\n   الإجابة النموذجية: اخضرّت الأرض وكثر فيها العشب.\n3) [المستوى المتقدم] كيف تغيرت حياة حليمة بعد أن أخذت الرسول ﷺ؟\n   الإجابة النموذجية: حلّت البركة في بيتها وصحتها وأغنامها وكثر عندها الخير.", "للطالب: يحكي قصة حليمة السعدية ص43 لأسرته.\nلولي الأمر: يحدّث طفله عن بركة الرسول ﷺ ويصليان عليه.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 43–47."]}, {"k": 2, "axis": "موقف حليمة السعدية النبيل ومحبة الرسول ﷺ، وأختبر تعلمي", "week": "الأسبوع الثالث عشر (29/11–3/12/2026م (يوم الأنشطة التربوية))", "f": ["1. يقدّر موقف حليمة السعدية في رضاع الرسول ﷺ.\n2. يضيف إلى الصورة ما يدل على بركة الرسول ﷺ مع مجموعته.\n3. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\nمخرج تعليمي آخر: يعبّر عن محبته للرسول ﷺ.", "المخرج 1: يقدّر موقف حليمة السعدية في رضاع الرسول ﷺ. ← تقييم\nالمخرج 2: يضيف إلى الصورة ما يدل على بركة الرسول ﷺ مع مجموعته. ← إبداع\nالمخرج 3: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يعبّر عن محبته للرسول ﷺ. ← تطبيق", "التعلم التعاوني، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: العصف الذهني", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ألوان", "الرضا بالقليل، المروءة، البركة، المحبة", "تسأل المعلمة: ما شعورنا تجاه ضيف يزورنا فيأتي معه الخير؟ وتستمع للإجابات.", "1) التهيئة (4 د: من الدقيقة 0 خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] ما معنى «الصدق»؟\n   الإجابة النموذجية: قول الحق وعدم الكذب.\n2) [المستوى المتوقع] انطق كلمة «البِرّ» نطقًا صحيحًا.\n   الإجابة النموذجية: بكسر الباء وتشديد الراء.\n3) [المستوى المتقدم] إلى أين يوصل الصدق كما في الحديث؟\n   الإجابة النموذجية: إلى البر، والبر يوصل إلى الجنة.", "1) [مستوى الدعم] أكمل: «عليكم ...».\n   الإجابة النموذجية: بالصدق.\n2) [المستوى المتوقع] ما معنى «يهدي»؟\n   الإجابة النموذجية: يوصل ويدل.\n3) [المستوى المتقدم] رتّب: الجنة – الصدق – البر.\n   الإجابة النموذجية: الصدق، البر، الجنة.", "للطالب: يقرأ الحديث ص68 مع أسرته ويرسم سلسلة الصدق.\nلولي الأمر: يقرأ الحديث مع طفله ويحدّثه عن الصدق.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 68–73."]}, {"k": 2, "axis": "حفظ الحديث، والقصة المصورة: الصدق منجاة من العقاب", "week": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1. يحفظ الحديث النبوي الشريف حفظًا متقنًا.\n2. يدرك أن قول الصدق منجاة من العقاب.\n3. يستفيد من القصة المصورة درسًا لحياته.\nمخرج تعليمي آخر: يعبّر عن موقف صدق مرّ به.", "المخرج 1: يحفظ الحديث النبوي الشريف حفظًا متقنًا. ← تذكر\nالمخرج 2: يدرك أن قول الصدق منجاة من العقاب. ← فهم\nالمخرج 3: يستفيد من القصة المصورة درسًا لحياته. ← تطبيق\nالمخرج الآخر: يعبّر عن موقف صدق مرّ به. ← تطبيق", "التعلم التشاركي، التعلم المبني على حل المشكلات\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "الصدق، النجاة، العقاب", "تسمّع المعلمة الحديث جماعيًا، ثم تعرض الرسمة الأولى من القصة المصورة دون كلام وتسأل: ماذا تتوقعون أن يحدث؟", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تسميع وعرض الرسمة الأولى.\n   التلميذ: يسمّعون ويتوقعون.\n2) حفظ الحديث (8 د: من الدقيقة 4 إلى 12)\n   المعلمة: تحفّظهم بمحو الكلمات تدريجيًا وتسمّع فرديًا.\n   التلميذ: يسمّعون الحديث حتى يتقنوه.\n3) القصة المصورة ص69–70 (8 د: من الدقيقة 12 إلى 20)\n   المعلمة: تعرض الرسومات وتناقش: ماذا تشاهدون؟ ماذا فعل أحمد؟ (تقويم تكويني)\n   التلميذ: يصفون الأحداث ويستنتجون أن صدق أحمد أنجاه من العقاب.\n4) ماذا استفدت؟ (5 د: من الدقيقة 20 إلى 25)\n   المعلمة: تسأل: ماذا استفدتم من القصة؟\n   التلميذ: يذكرون: الصدق ينجّي، والكذب يزيد المشكلة.\n5) موقف صدق (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تطلب من بعضهم ذكر موقف قالوا فيه الصدق.\n   التلميذ: يحكون مواقفهم.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] سمّع الحديث الشريف.\n   الإجابة النموذجية: تسميع صحيح.\n2) [المستوى المتوقع] ماذا حدث لأحمد عندما قال الصدق؟\n   الإجابة النموذجية: نجا من العقاب.\n3) [المستوى المتقدم] لو كذب أحمد، ماذا كان سيحدث في رأيك؟\n   الإجابة النموذجية: سيُكتشف كذبه ويعاقَب ويفقد ثقة والديه.", "1) [مستوى الدعم] أكمل: «فإن الصدق يهدي إلى ...».\n   الإجابة النموذجية: البر.\n2) [المستوى المتوقع] هل الصدق ينجي من العقاب؟\n   الإجابة النموذجية: نعم.\n3) [المستوى المتقدم] ماذا تعلمت من قصة أحمد لتطبقه في حياتك؟\n   الإجابة النموذجية: أن أقول الصدق دائمًا حتى لو أخطأت.", "للطالب: يسمّع الحديث لأسرته ويحكي القصة المصورة ص69–70.\nلولي الأمر: يكافئ طفله على صدقه ولو أخطأ؛ تشجيعًا له.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 68–73."]}, {"k": 3, "axis": "الصدق طريق إلى الخير (المتاهة) والتزام الصدق في المواقف (أفكر وأطبق)", "week": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1. يستفيد أن الصدق طريق إلى الخير.\n2. يحل المتاهة مع مجموعته ويقرأ العبارة الصحيحة في نهايتها.\n3. يلتزم قول الصدق في مواقف الحياة المختلفة.\nمخرج تعليمي آخر: يقترح تصرفًا صادقًا في موقف جديد.", "المخرج 1: يستفيد أن الصدق طريق إلى الخير. ← فهم\nالمخرج 2: يحل المتاهة مع مجموعته ويقرأ العبارة الصحيحة في نهايتها. ← تطبيق\nالمخرج 3: يلتزم قول الصدق في مواقف الحياة المختلفة. ← تقييم\nالمخرج الآخر: يقترح تصرفًا صادقًا في موقف جديد. ← إبداع", "التعلم التعاوني، التعلم المبني على اللعب، التعلم المبني على حل المشكلات", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: متاهة مكبرة لكل مجموعة", "الصدق، الخير، الكذب", "تعرض المعلمة طريقين مرسومين: «طريق الصدق» يصل إلى بيت جميل، و«طريق الكذب» ينتهي بحفرة، وتسأل: أي الطريقين تسلك؟", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تعرض الطريقين وتسأل.\n   التلميذ: يختارون طريق الصدق ويعللون.\n2) أتعاون مع زملائي: المتاهة ص71 (8 د: من الدقيقة 4 إلى 12)\n   المعلمة: تجعلهم في مجموعات لحل المتاهة، وتقرأ الإجابة في بدايتها ونهايتها.\n   التلميذ: تحل المجموعات المتاهة ويقرأ بعضهم العبارة الأخيرة.\n3) أفكر وأطبق ص72 (8 د: من الدقيقة 12 إلى 20)\n   المعلمة: تقرأ الأرومة: طفل كتب على جدران غرفة الجلوس فسألت الأم؟ وتحاورهم في النشاطين (تقويم تكويني).\n   التلميذ: يبدون آراءهم ويختارون التصرف الصادق.\n4) مواقف جديدة (5 د: من الدقيقة 20 إلى 25)\n   المعلمة: تطرح مواقف: كسرت كوبًا، نسيت الواجب.\n   التلميذ: يقترحون الإجابة الصادقة لكل موقف.\n5) تسميع الحديث (4 د: من الدقيقة 25 إلى 29)\n   المعلمة: تسمّع الحديث جماعيًا.\n   التلميذ: يسمّعون.\n6) التقويم الختامي (4 د: من الدقيقة 29 إلى 33)\n   المعلمة: تطرح أسئلة التقويم الختامي الثلاثة بالتدرج (دعم ← متوقع ← متقدم) وتوجّه كل سؤال إلى المستوى المناسب.\n   التلميذ: يجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب.\n7) مسابقة المجموعات (5 د: من الدقيقة 33 إلى 38)\n   المعلمة: تفتح ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات.\n   التلميذ: تجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط.\n8) الغلق وخطة الأسبوع (2 د: من الدقيقة 38 إلى 40)\n   المعلمة: تلخّص أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية.\n   التلميذ: يردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة.\nالمجموع: 40 دقيقة", "1) [مستوى الدعم] إلى أين يوصل طريق الصدق في المتاهة؟\n   الإجابة النموذجية: إلى الخير والجنة.\n2) [المستوى المتوقع] كتب طفل على الجدار فسألته أمه، فماذا يقول؟\n   الإجابة النموذجية: يقول الصدق: أنا كتبت يا أمي، وأعتذر.\n3) [المستوى المتقدم] نسيت واجبك المنزلي، فماذا تقول لمعلمتك؟ ولماذا؟\n   الإجابة النموذجية: أقول الصدق: نسيته وسأحضره غدًا؛ لأن الصدق طريق الخير.", "1) [مستوى الدعم] هل الكذب طريق إلى الخير؟\n   الإجابة النموذجية: لا.\n2) [المستوى المتوقع] اذكر موقفًا تقول فيه الصدق.\n   الإجابة النموذجية: مثل: عندما أكسر شيئًا أخبر والديّ.\n3) [المستوى المتقدم] لماذا نحب الصادقين؟\n   الإجابة النموذجية: لأننا نثق بهم ولأن الله يحبهم.", "للطالب: يحل متاهة ص71 ويطبق الصدق في مواقفه اليومية.\nلولي الأمر: يحاور طفله في مواقف الصدق ويثني على صدقه.\nالمرجع: كتاب الطالب (الجزء الثاني) ص 68–73."]}, {"k": 4, "axis": "أختبر تعلمي في الصدق والاقتداء بالنبي ﷺ الصادق", "week": "الأسبوع الخامس عشر (13–17/12/2026م)", "f": ["1. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n2. يقتدي بالنبي ﷺ الملقب بالصادق الأمين.\n3. ينفر من صفة الكذب.\nمخرج تعليمي آخر: يصمم مع فريقه شعارًا عن الصدق.", "المخرج 1: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج 2: يقتدي بالنبي ﷺ الملقب بالصادق الأمين. ← تطبيق\nالمخرج 3: ينفر من صفة الكذب. ← تقييم\nالمخرج الآخر: يصمم مع فريقه شعارًا عن الصدق. ← إبداع", "التعلم الذاتي، التعلم التعاوني، التعلم المبني على المشاريع", "الكتاب، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ورق ملون للشعارات", "القدوة، الصادق الأمين، الصدق", "تسأل المعلمة: ما اللقب الذي عُرف به الرسول ﷺ قبل البعثة؟ وتربطه بدرس «مولد الصادق الأمين».", "1) التهيئة (4 د: من الدقيقة 0 إلى 4)\n   المعلمة: تطرح السؤال و function flash(btn) {

function legacyCopy(t) {

  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);

}
