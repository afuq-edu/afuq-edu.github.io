, Padlet, Kahoot، أخرى: رسمة متاهة مكبرة لكل مجموعة", "الخير، ذكرى المولد، الكعبة المشرفة، البيت", "تكتب المعلمة كلمة «خير» على السبورة وتقرأ الجملة الأخيرة من عنصر «أستمع وأناقش»: «كان مولد الرسول ﷺ خيرًا لجميع الخلق»، ثم تسأل: كيف كان مولده خيرًا؟", "1. التهيئة: تكتب المعلمة الكلمة وتقرأ الجملة وتطرح السؤال، والتلاميذ يقدمون أفكارًا أولية (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عصف ذهني: خير لجميع الخلق: تستمع المعلمة للإجابات ثم توضح أنه أُرسل رحمة للعالمين يهدي الناس إلى الخير، والتلاميذ يذكرون صورًا من الخير: الهداية، الأخلاق، تعليم الصلاة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أعتز بذكرى المولد: تناقش المعلمة كيف نحتفي بالذكرى: الصلاة عليه، قراءة سيرته، الاقتداء بأخلاقه، والتلاميذ يعبّرون عن مشاعرهم تجاه الرسول ﷺ (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n4. أتعاون مع زملائي: المتاهة ص36: تعطي كل مجموعة رسمة المتاهة وتنبّه إلى أن الرسول ﷺ وُلد في بيت قريب من الكعبة (تقويم تكويني)، وتحل المجموعة المتاهة وتعرض الحل وتدوّنه في الكتاب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أعظّم الكعبة: تربط المعلمة بين حماية الله للكعبة ومكانتها عند المسلمين، والتلاميذ يذكرون ما يعرفونه عن الكعبة (قبلة المسلمين) (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n7. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مس 3) [مستوى الاستدلال] ما معنى «نعم الله لا تُحصى»؟\n   الإجابة النموذجية: أن نعم الله كثيرة جدًا لا نستطيع عدّها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا لنعم الله (الماء، الطعام، العينين)، ويردد معه «الحمد لله» عند كل صورة، ثم يسأله: ماذا نقول لمن قدّم لنا معروفًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة شكر لله تعالى على ثلاث نعم يختارونها، وبطاقة شكر لشخص قدّم لهم معروفًا، مع بيان الفرق بين الشكرين.", "1) [مستوى المعرفة] من الذي أعطانا النعم؟\n   الإجابة النموذجية: الله تعالى.\n2) [مستوى التطبيق] اذكر ثلاث نعم أنعم الله بها عليك.\n   الإجابة النموذجية: مثل: العينان، والطعام، والأسرة.\n3) [مستوى الاستدلال] لماذا وجّه الأب أحمد إلى شكر الله مع أنه هو من اشترى له الهدية؟\n   الإجابة النموذجية: لأن الله هو الذي رزق الأب المال، فكل النعم من الله.", "للطالب: يقرأ حوار أحمد وأبيه ص44 ويعدّ مع أسرته خمس نعم.\nلولي الأمر: يعوّد طفله قول «الحمد لله» و«شكرًا» في المواقف اليومية.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=8"]}, {"k": 2, "axis": "مظاهر شكر الله تعالى على نعمه (بالقول والفعل)", "week": "الأسبوع السادس (11–15/10/2026م)", "f": ["1. يحدد مظاهر شكر الله تعالى على نعمه المختلفة.\n2. يربط كل نعمة بمظهر الشكر المناسب لها.\n3. يوضح أن الشكر يكون بالقول والفعل.\nمخرج تعليمي آخر: يقترح مظهر شكر لنعمة جديدة.", "المخرج 1: يحدد مظاهر شكر الله تعالى على نعمه المختلفة. ← فهم\nالمخرج 2: يربط كل نعمة بمظهر الشكر المناسب لها. ← تطبيق\nالمخرج 3: يوضح أن الشكر يكون بالقول والفعل. ← فهم\nالمخرج الآخر: يقترح مظهر شكر لنعمة جديدة. ← إبداع", "التعلم بالاكتشاف، التعلم الذاتي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "مظاهر الشكر، الشكر بالقول، الشكر بالفعل", "تسأل المعلمة: إذا أهداك صديقك قلمًا، هل يكفي أن تقول «شكرًا» ثم تكسره؟ وتستمع للإجابات.", "1. التهيئة: تطرح المعلمة السؤال وتناقش، والتلاميذ يستنتجون أن الشكر يكون بالمحافظة على الهدية أيضًا (4 دقائق)\nالاستراتيجيات: ال فظ الآيات (1–4) من سورة الفاتحة حفظًا صحيحًا. ← تذكر\nالمخرج 3: يبدأ تلاوته بالاستعاذة والبسملة. ← تطبيق\nالمخرج 4: يتلو الآيات (5–7) من سورة الفاتحة تلاوة صحيحة. ← تطبيق\nالمخرج 5: يحفظ الآيات (5–7) من سورة الفاتحة ويربطها بما قبلها. ← تذكر\nالمخرج 6: يضبط نطق الكلمات: «نعبدُ، نستعينُ، اهدنا، الضالّين». ← تطبيق\nالمخرج الآخر: يتعرّف أن القرآن الكريم ثلاثون جزءًا وأن الفاتحة في الجزء الأول. ← تذكر\nالمخرج الآخر: يعدّ آيات سورة الفاتحة مستعينًا بأرقامها في المصحف. ← فهم", "التعلم بالنمذجة، التعلم التعاوني، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: المحاكاة والترديد", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: المصحف الشريف، أخرى: بطاقات الآيات المرقمة", "التلاوة، الحفظ، الاستعاذة، البسملة، الآية، الجزء، التلاوة الصحيحة، رقم الآية، الصراط المستقيم", "تعرض المعلمة المصحف الشريف وتسأل: ماذا نقول قبل أن نبدأ التلاوة؟ ثم تردد مع التلاميذ الاستعاذة والبسملة، وتشوّقهم لحفظ أول سورة في المصحف الشريف.", "1. التهيئة: تعرض المعلمة المصحف وتسأل عن آداب التلاوة، وتردد الاستعاذة والبسملة، والتلاميذ يجيبون ويرددون الاستعاذة والبسملة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الاستماع للتلاوة النموذجية: تُسمعهم المعلمة السورة كاملة بصوتها أو بتسجيل مجوّد مرتين، مع فتح الكتاب ص12، والتلاميذ ينصتون ويتابعون بأصابعهم في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التلقين والترديد (الآيات 1–4): تقرأ المعلمة الآية فيرددها التلاميذ جماعيًا ثم زمريًا ثم فرديًا، وتضبط نطق: «الحمدُ، الرحمن، مالكِ»، والتلاميذ يرددون الآيات بصوت واضح ويصحح بعضهم لبعض (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n4. لعبة «أكمل الآية»: تبدأ المعلمة الآية وتشير إلى مجموعة لتكملها (تقويم تكويني)، وتكمل كل مجموعة الآية المطلوبة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. أتعرّف مصحفي: تبيّن المعلمة أن المصحف ثلاثون جزءًا وأن الفاتحة في أوله، وتريهم رقم الآية في نهايتها، والتلاميذ يضعون أصابعهم على أرقام الآيات ويعدّونها (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. الاستماع للتلاوة النموذجية: تُسمعهم المعلمة الآيات (5–7) من مقرئ مجيد مع عرضها على السبورة، والتلاميذ ينصتون ويتابعون في الكتاب ص12 (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. التلقين والترديد (الآيات 5–7): تقطّع المعلمة الآية السابعة إلى مقاطع قصيرة، وتصحح «نعبدُ، نستعينُ، اهدنا، الضالّين»، والتلاميذ يرددون جماعيًا وزمريًا وفرديًا (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. ترتيب بطاقات الآيات: توزّع المعلمة بطاقات الآيات السبع مبعثرة على المجموعات (تقويم تكويني)، وترتّب كل مجموعة البطاقات وتقرؤها كاملة (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n9. أعدّ آيات السورة: تطلب المعلمة وضع الإصبع على أرقام الآيات وعدّها، والتلاميذ يعدّون الآيات ويصلون إلى أنها سبع (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.", "1) [مستوى المعرفة] ماذا نقول قبل أن نبدأ تلاوة القرآن الكريم؟\n   الإجابة النموذجية: أعوذ بالله من الشيطان الرجيم، ثم بسم الله الرحمن الرحيم.\n2) [مستوى التطبيق] أكمل: «الحمد لله رب ...».\n   الإجابة النموذجية: العالمين.\n3) [مستوى الاستدلال] اتلُ الآيات الأربع الأولى من سورة الفاتحة بالترتيب.\n   الإجابة النموذجية: تلاوة الآيات (1–4) تلاوة صحيحة مرتبة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الاستعاذة والبسملة ثم الآيات (1–4) من سورة الفاتحة آيةً آيةً بالتلقين والترديد مستعينًا ببطاقة لكل آية، ثم يطلب منه إكمال: «الحمد لله رب ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب بطاقات الآيات (1–4) من سورة الفاتحة مخلوطةً ثم تلاوتها مرتبة أمام زملائهم، وبيان ما نقوله قبل التلاوة ولماذا نبدأ به.\n\n4) [مستوى المعرفة] كم عدد آيات سورة الفاتحة؟\n   الإجابة النموذجية: سبع آيات.\n5) [مستوى التطبيق] أكمل: «إياك نعبد وإياك ...».\n   الإجابة النموذجية: نستعين.\n6) [مستوى الاستدلال] اتلُ الآيات (5–7) من سورة الفاتحة تلاوة صحيحة.\n   الإجابة النموذجية: تلاوة صحيحة مضبوطة للآيات (5–7).\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الاستعاذة والبسملة ثم الآيات (1–4) من سورة الفاتحة آيةً آيةً بالتلقين والترديد مستعينًا ببطاقة لكل آية، ثم يطلب منه إكمال: «الحمد لله رب ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب بطاقات الآيات (1–4) من سورة الفاتحة مخلوطةً ثم تلاوتها مرتبة أمام زملائهم، وبيان ما نقوله قبل التلاوة ولماذا نبدأ به.", "1) [مستوى المعرفة] في أي جزء من القرآن الكريم توجد سورة الفاتحة؟\n   الإجابة النموذجية: في الجزء الأول.\n2) [مستوى التطبيق] ما الآية التي تأتي بعد «الرحمن الرحيم»؟\n   الإجابة النموذجية: «مالك يوم الدين».\n3) [مستوى الاستدلال] كم جزءًا في القرآن الكريم؟ وما الذي يدل على نهاية الآية؟\n   الإجابة النموذجية: ثلاثون جزءًا، ورقم الآية في نهايتها.\n\n4) [مستوى المعرفة] ما الآية التي تبدأ بـ«اهدنا»؟\n   الإجابة النموذجية: «اهدنا الصراط المستقيم».\n5) [مستوى التطبيق] ما الكلمة التي تُختم بها سورة الفاتحة؟\n   الإجابة النموذجية: «الضالّين».\n6) [مستوى الاستدلال] سمّع سورة الفاتحة كاملة من حفظك.\n   الإجابة النموذجية: تسميع السورة كاملة مرتبة دون خطأ.", "للطالب: يردد الآيات (1–4) من سورة الفاتحة ص12 خمس مرات يوميًا.\nلولي الأمر: يستمع إلى تلاوة طفله ويصحح نطقه، ويعوّده البدء بالاستعاذة والبسملة.\nالمرجع: كتاب الطالب (الجزء الأول) ص 11–12.\nللطالب: يسمّع سورة الفاتحة كاملة ص12 ويضع إصبعه على رقم كل آية.\nلولي الأمر: يستمع إلى تسميع طفله للسورة كاملة ويتابع نطق «نستعين، اهدنا، الضالّين».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=1"]}, {"k": 2, "axis": "تسميع سورة الفاتحة كاملة وإتقان تلاوتها", "week": "الأسبوع الثالث (20–24/9/2026م)", "f": ["1. يسمّع سورة الفاتحة كاملة حفظًا متقنًا.\n2. يتلو السورة تلاوة صحيحة مع الوقوف عند رؤوس الآيات.\n3. يقيّم تلاوة زميله مستعينًا بقائمة نطق بسيطة.\n\nمخرج تعليمي آخر: يكتب كلمات قرآنية من سورة الفاتحة نقلًا صحيحًا.", "المخرج 1: يسمّع سورة الفاتحة كاملة حفظًا متقنًا. ← تذكر\nالمخرج 2: يتلو السورة تلاوة صحيحة مع الوقوف عند رؤوس الآيات. ← تطبيق\nالمخرج 3: يقيّم تلاوة زميله مستعينًا بقائمة نطق بسيطة. ← تقييم\nالمخرج الآخر: يكتب كلمات قرآنية من سورة الفاتحة نقلًا صحيحًا. ← تطبيق", "التعلم التعاوني، التعلم التشاركي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقة تقييم التلاوة", "التسميع، رؤوس الآيات، الوقف", "تعرض المعلمة لوحة «نجوم الحُفّاظ» وتعلن أن حصة اليوم حصة تسميع، فمن يتقن السورة يضع نجمته في اللوحة.", "1. التهيئة: تعرض المعلمة لوحة نجوم الحفّاظ وتشرح طريقة التسميع، والتلاميذ يستعدون ويرددون السورة همسًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تلاوة جماعية مضبوطة: تقود المعلمة تلاوة جماعية مع الوقوف عند كل رقم آية، والتلاميذ يتلون جماعيًا ويقفون عند رؤوس الآيات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التسميع الفردي والثنائي: تسمّع المعلمة لعدد من التلاميذ، وتوزّع البقية أزواجًا يسمّع كل منهما لصاحبه ببطاقة تقييم، ويسمّع كل تلميذ لزميله ويضع علامة ✓ على الكلمات الصحيحة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. معالجة الأخطاء الشائعة: تكتب المعلمة على السبورة الكلمات التي كثر الخطأ فيها وتعيد تلقينها (تقويم تكويني)، والتلاميذ يكررون نطق الكلمات حتى يتقنوها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أكتب كلمات قرآنية: تملي كلمتين من السورة: «الحمد، الصراط»، والتلاميذ ينقلون الكلمتين في الكتاب أو الدفتر (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] ما اسم أول سورة في المصحف الشريف؟\n   الإجابة النموذجية: سورة الفاتحة.\n2) [مستوى التطبيق] سمّع الآيات الثلاث الأولى من سورة الفاتحة.\n   الإجابة النموذجية: تسميع صحيح للآيات (1–3).\n3) [مستوى الاستدلال] استمع إلى تلاوة زميلك وأخبره بكلمة يحتاج إلى ضبطها.\n   الإجابة النموذجية: تحديد كلمة صحيحة تحتاج إلى ضبط مع ذكر صوابها.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ الاستعاذة والبسملة ثم الآيات (1–4) من سورة الفاتحة آيةً آيةً بالتلقين والترديد مستعينًا ببطاقة لكل آية، ثم يطلب منه إكمال: «الحمد لله رب ...».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بترتيب بطاقات الآيات (1–4) من سورة الفاتحة مخلوطةً ثم تلاوتها مرتبة أمام زملائهم، وبيان ما نقوله قبل التلاوة ولماذا نبدأ به.", "1) [مستوى المعرفة] أكمل: «صراط الذين أنعمت ...».\n   الإجابة النموذجية: عليهم.\n2) [مستوى التطبيق] اتلُ سورة الفاتحة كاملة مع الوقوف عند رؤوس الآيات.\n   الإجابة النموذجية: تلاوة صحيحة مع الوقف عند كل آية.\n3) [مستوى الاستدلال] لماذا نقف عند رقم الآية في أثناء التلاوة؟\n   الإجابة النموذجية: لأن الرقم يدل على نهاية الآية فنقف عنده ثم نبدأ الآية التالية.", "للطالب: يقرأ سورة الفاتحة في صلاته مع أسرته ويكتب كلمة «الحمد» ثلاث مرات.\nلولي الأمر: يشجّع طفله على قراءة الفاتحة يوميًا ويثني على إتقانه.\nالمرجع: كتاب الطالب (الجزء الأول) ص 11–12.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=1"]}], "weeks": [1, 2, 3]}, {"id": "fatiha", "title": "سورة الفاتحة (تلاوة وفهم)", "unit": "الوحدة الأولى", "sb": "كتاب الطالب – الجزء الأول: ص 16–22", "tg": "دليل المعلم: ص 28–32", "n": 3, "periods": [{"k": 1, "axis": "التعريف بسورة الفاتحة (من أنا؟) وسبب تسميتها + تلاوة سورة الفاتحة وأن البسملة آية منها ومعاني مفرداتها", "week": "الأسبوع الأول (6–10/9/2026م)", "f": ["1. يتعرّف سبب تسمية سورة الفاتحة بهذا الاسم.\n2. يحدّد موضع سورة الفاتحة في المصحف الشريف.\n3. يعبّر عن محبته لسورة الفاتحة لفضلها.\n4. يتلو سورة الفاتحة تلاوة صحيحة.\n5. يتعرّف أن البسملة آية من سورة الفاتحة.\n6. يكتشف معاني بعض كلمات السورة بربطها بالرسومات.\n\nمخرج تعليمي آخر:\nيعدّ آيات السورة ويذكر أنها سبع آيات.\nيقارن بين موضع البسملة في الفاتحة وموضعها في السور الأخرى.", "المخرج 1: يتعرّف سبب تسمية سورة الفاتحة بهذا الاسم. ← تذكر\nالمخرج 2: يحدّد موضع سورة الفاتحة في المصحف الشريف. ← تطبيق\nالمخرج 3: يعبّر عن محبته لسورة الفاتحة لفضلها. ← تقييم\nالمخرج 4: يتلو سورة الفاتحة تلاوة صحيحة. ← تطبيق\nالمخرج 5: يتعرّف أن البسملة آية من سورة الفاتحة. ← فهم\nالمخرج 6: يكتشف معاني بعض كلمات السورة بربطها بالرسومات. ← فهم\nالمخرج الآخر: يعدّ آيات السورة ويذكر أنها سبع آيات. ← تذكر\nالمخرج الآخر: يقارن بين موضع البسملة في الفاتحة وموضعها في السور الأخرى. ← تحليل", "التعلم بالاكتشاف، التعلم التعاوني، التعلم المبني على اللعب، التعلم بالنمذجة، التعلم الذاتي\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية", "الكتاب، السبورة الذكية، الوسائل المتعددة (سمعية - بصرية)، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: المصحف الشريف، صورة توضيحية، الأقلام", "سورة الفاتحة، الجزء الأول، أم القرآن، البسملة، الحمد، رب العالمين، الرحمة", "تروي المعلمة بأسلوب مشوّق أن هناك سورة لم ينزل مثلها في التوراة ولا في الإنجيل ولا في الزبور، يقرؤها المسلم في كل ركعة من صلاته، ثم تسأل: من يعرف اسمها؟", "1. التهيئة: تسرد المعلمة فضل السورة من الجانب الإثرائي وتطرح سؤال التشويق، والتلاميذ يخمّنون اسم السورة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. لغز «من أنا؟»: تقرأ المعلمة عنصر «من أنا؟» ص16 بنبرات متنوعة وكأن السورة تتحدث عن نفسها، والتلاميذ يستمعون ويجيبون عن اللغز: عدد آياتي، وجزئي، واسمي (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أين أجدها في المصحف؟: توزّع المعلمة مصاحف على المجموعات وتطلب فتح الصفحة الأولى، وتحدد كل مجموعة موضع السورة وتعدّ آياتها (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. لماذا سُمّيت الفاتحة؟: توضح المعلمة أن القرآن الكريم يُفتتح بها، وتسأل عن معنى «فاتحة» (تقويم تكويني)، والتلاميذ يربطون الاسم بأنها أول المصحف (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n5. تلاوة نموذجية قصيرة: تتلو المعلمة السورة تلاوة نموذجية، ويرددها التلاميذ (لا يزيد على 7 دقائق كما في الدليل)، والتلاميذ يرددون السورة جماعيًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أتلو وأفهم: تتلو المعلمة السورة تلاوة نموذجية وتضبط «الحمد، الرحمن، نعبد، اهدنا»، والتلاميذ يرددون جماعيًا وزمريًا وفرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. معلومات تهمّني: البسملة: تفتح المعلمة معهم سورتي الفاتحة والإخلاص في المصحف وتقارن موضع البسملة ورقمها، والتلاميذ يكتشفون أن البسملة في الفاتحة تحمل الرقم (1) (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. أكتشف المعنى ص17: تقرأ كل جملة وتطلب وضع الإصبع على الصورة المعبّرة عنها (تقويم تكويني)، والتلاميذ يضعون رقم الكلمة في الصورة المناسبة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أعبّر بلغتي: تسأل المعلمة: ماذا نقصد عندما نقول «الحمد لله»؟ والتلاميذ يعبّرون عن المعنى بلغتهم: نشكر الله ونثني عليه (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.", "1) [مستوى المعرفة] ما اسم السورة التي يُفتتح بها القرآن الكريم؟\n   الإجابة النموذجية: سورة الفاتحة.\n2) [مستوى التطبيق] كم عدد آيات سورة الفاتحة؟\n   الإجابة النموذجية: سبع آيات.\n3) [مستوى الاستدلال] لماذا سُمّيت سورة الفاتحة بهذا الاسم؟\n   الإجابة النموذجية: لأن القرآن الكريم يُفتتح بها.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم المصحف أمام التلميذ على أول صفحة ويريه سورة الفاتحة، ثم يعدّ معه آياتها السبع بوضع الإصبع على أرقامها، ثم يسأله: كم آية في سورة الفاتحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بشرح سبب تسمية سورة الفاتحة لزميل بكلماتهم مستعينين بالمصحف، ثم يبحثون عن مواقف يومية نقرأ فيها الفاتحة مثل الصلاة.\n\n4) [مستوى المعرفة] ما رقم آية البسملة في سورة الفاتحة؟\n   الإجابة النموذجية: رقم (1).\n5) [مستوى التطبيق] ما معنى «الحمد لله»؟\n   الإجابة النموذجية: الشكر والثناء لله تعالى.\n6) [مستوى الاستدلال] لماذا نعدّ البسملة آية من الفاتحة ولا نعدّها آية في السور الأخرى؟\n   الإجابة النموذجية: لأن لها رقمًا في الفاتحة، وفي السور الأخرى تأتي قبل الآية الأولى بلا رقم.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم المصحف أمام التلميذ على أول صفحة ويريه سورة الفاتحة، ثم يعدّ معه آياتها السبع بوضع الإصبع على أرقامها، ثم يسأله: كم آية في سورة الفاتحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بشرح سبب تسمية سورة الفاتحة لزميل بكلماتهم مستعينين بالمصحف، ثم يبحثون عن مواقف يومية نقرأ فيها الفاتحة مثل الصلاة.", "1) [مستوى المعرفة] في أي جزء نجد سورة الفاتحة؟\n   الإجابة النموذجية: في الجزء الأول.\n2) [مستوى التطبيق] افتح المصحف وضع إصبعك على سورة الفاتحة.\n   الإجابة النموذجية: تحديد موضعها في أول المصحف.\n3) [مستوى الاستدلال] لماذا نحب سورة الفاتحة؟ اذكر سببًا واحدًا.\n   الإجابة النموذجية: لأنها أفضل سورة في القرآن، ونقرؤها في كل ركعة من الصلاة.\n\n4) [مستوى المعرفة] أكمل: «الحمد لله رب ...».\n   الإجابة النموذجية: العالمين.\n5) [مستوى التطبيق] صِل الكلمة «الرحمن الرحيم» بالصورة المعبرة عنها واذكر المعنى.\n   الإجابة النموذجية: صورة تدل على رحمة الله الواسعة بعباده.\n6) [مستوى الاستدلال] اتلُ سورة الفاتحة تلاوة صحيحة مبتدئًا بالبسملة.\n   الإجابة النموذجية: تلاوة صحيحة كاملة.", "للطالب: يقرأ عنصر «من أنا؟» ص16 مع أسرته ويحكي لغز السورة.\nلولي الأمر: يحاور طفله حول فضل سورة الفاتحة ويريه موضعها في المصحف.\nالمرجع: كتاب الطالب (الجزء الأول) ص 16–22.\nللطالب: يحل نشاط «أكتشف المعنى» ص17 ويتلو السورة على أسرته.\nلولي الأمر: يذكّر طفله بقول «بسم الله» قبل الأعمال، ويسأله عن معنى «الحمد لله».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=2"]}, {"k": 2, "axis": "مفهوما يوم الدين والصراط المستقيم والله أرحم الراحمين", "week": "الأسبوع الأول (6–10/9/2026م)", "f": ["1. يوضح مفهومي «يوم الدين» و«الصراط المستقيم».\n2. يستنتج أن الله تعالى أرحم الراحمين من خلال القصة.\n3. يذكر أعمالًا صالحة توصل إلى الجنة.\n\nمخرج تعليمي آخر: يكتب استنتاجه في المكان المخصص «أدوّن استنتاجي».", "المخرج 1: يوضح مفهومي «يوم الدين» و«الصراط المستقيم». ← فهم\nالمخرج 2: يستنتج أن الله تعالى أرحم الراحمين من خلال القصة. ← تحليل\nالمخرج 3: يذكر أعمالًا صالحة توصل إلى الجنة. ← تطبيق\nالمخرج الآخر: يكتب استنتاجه في المكان المخصص «أدوّن استنتاجي». ← تطبيق", "التعلم بالاكتشاف، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية، الحوار والمناقشة", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "يوم الدين، الصراط المستقيم، الرحمة، أرحم الراحمين", "تعرض المعلمة صورة طريقين: أحدهما مستقيم واضح والآخر متعرّج، وتسأل: أي الطريقين تختار لتصل إلى بيتك بسلام؟ ولماذا؟", "1. التهيئة: تعرض المعلمة صورة الطريقين وتدير حوارًا قصيرًا، والتلاميذ يختارون الطريق المستقيم ويعلّلون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. هل تعلم؟ يوم الدين: تتلو المعلمة «مالك يوم الدين» وتوضح أنه يوم القيامة وأن الله وحده مالكه، والتلاميذ يرددون الآية ويذكرون اسمًا آخر ليوم الدين (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. الصراط المستقيم: تتلو المعلمة «اهدنا الصراط المستقيم» وتناقش صورة الكتاب ص18 لتصل إلى أنه طريق الإسلام الموصل إلى الجنة، والتلاميذ يذكرون أعمالًا صالحة: الصلاة، الصدق، بر الوالدين (تقويم تكويني) (6 دقائق)\nالاست ة النموذجية: مثل: الصلاة، والصدق، وبر الوالدين.\n3) [مستوى الاستدلال] إذا كانت الأم رحيمة بأبنائها، فماذا نقول عن رحمة الله تعالى؟ ولماذا؟\n   الإجابة النموذجية: رحمة الله أعظم من رحمة جميع الأمهات؛ لأنه الخالق أرحم الراحمين.", "للطالب: يقرأ قصة «أستمع وأستنتج» ص19 مع أسرته ويحكيها بأسلوبه.\nلولي الأمر: يحاور طفله في أعمال الخير التي يفعلها يوميًا ليسير على الصراط المستقيم.\nالمرجع: كتاب الطالب (الجزء الأول) ص 16–22.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=2"]}, {"k": 3, "axis": "تعلمت من سورة الفاتحة: الحمد والاستعانة بالله وتقويم الدرس", "week": "الأسبوع الأول (6–10/9/2026م)", "f": ["1. يحمد الله تعالى ويستعين به في جميع أحواله.\n2. يذكر مواقف يبدأ فيها بالبسملة ويختمها بالحمد.\n3. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر: يعبّر عن حبه لله تعالى بأسلوبه الخاص.", "المخرج 1: يحمد الله تعالى ويستعين به في جميع أحواله. ← تطبيق\nالمخرج 2: يذكر مواقف يبدأ فيها بالبسملة ويختمها بالحمد. ← تطبيق\nالمخرج 3: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يعبّر عن حبه لله تعالى بأسلوبه الخاص. ← إبداع", "التعلم التعاوني، التعلم المبني على اللعب، التعلم الذاتي", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ألوان وبطاقات عبارات", "الحمد، الاستعانة، العبادة، البسملة", "تقلّد المعلمة موقفًا: تبدأ بشرب الماء فتقول «بسم الله» وتنتهي فتقول «الحمد لله»، وتسأل: ماذا لاحظتم؟", "1. التهيئة: تمثل المعلمة موقف الشرب وتسأل عن البداية والنهاية، والتلاميذ يلاحظون البسملة والحمد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تعلّمت من سورة الفاتحة ص20: تناقش المعلمة الرسومات وتقرأ العبارات المقابلة لها، وتربط «إياك نعبد وإياك نستعين» بحياتهم، والتلاميذ يذكرون أمثلة لحمد الله وعبادته والاستعانة به (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. لعبة «أبدأ وأختم»: تعرض المعلمة مواقف (الأكل، المذاكرة، النوم) وتطلب من المجموعات ما يُقال في بدايتها ونهايتها (تقويم تكويني)، وتجيب كل مجموعة بالبسملة في البداية والحمد في النهاية (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\  التهيئة: تعرض المعلمة الصورة وتطرح السؤالين، والتلاميذ يصفون الصورة ويتوقعون (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أفهم قول رسولي ﷺ: تعرض المعلمة الحديث «استاكوا وتنظفوا» وتقرؤه قراءة صحيحة مرات عدة، والتلاميذ يستمعون ثم يرددون الحديث جماعيًا وزمريًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. ما السواك؟: تعرض المعلمة سواكًا حقيقيًا وفرشاة أسنان، وتوضح معنى «استاكوا»: نظّفوا أسنانكم بالسواك، والتلاميذ يلمسون السواك ويقارنونه بالفرشاة ويذكرون فائدتهما (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. كيف نتنظف؟: تسأل المعلمة: كيف ننفذ قول الرسول ﷺ «وتنظفوا»؟ (تقويم تكويني)، والتلاميذ يذكرون: الاستحمام، غسل اليدين، قص الأظافر، لبس الثياب النظيفة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. قراءة فردية: تستمع المعلمة لقراءات فردية للحديث وتصحح، ويقرأ التلميذ عدد منهم الحديث فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. حفظ الحديث: تحفّظهم المعلمة الحديث بالترديد ومحو الكلمات تدريجيًا من السبورة، والتلاميذ يسمّعون الحديث مع كل محو حتى يتقنوه (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. أستمع وأستنتج ص24: تعرض المعلمة صور القصة وتقرأ النص من الدليل، والتلاميذ يتابعون الصور ويصفون تصرف سعد (5 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n8. أجيب شفويًا ص25: تناقش المعلمة: لماذا ابتعد سعد؟ بماذا تنصح أحمد؟ (تقويم تكويني)، والتلاميذ يجيبون ويقترحون حلولًا: النوم مبكرًا، تنظيف الأسنان قبل الخروج (4 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n9. تمثيل قصير: تختار تلميذين لتمثيل الموقف بنهاية صحيحة، ويمثلان التلميذ أحمد وقد نظّف أسنانه، ويعلّق الزملاء (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: تمثيل الأدوار.", "1) [مستوى المعرفة] ماذا قال الرسول ﷺ في الحديث؟\n   الإجابة النموذجية: «استاكوا وتنظفوا».\n2) [مستوى التطبيق] ما معنى «استاكوا»؟\n   الإجابة النموذجية: نظّفوا أسنانكم بالسواك.\n3) [مستوى الاستدلال] اذكر ثلاثة أعمال تطبّق بها قول الرسول ﷺ «وتنظفوا».\n   الإجابة النموذجية: الاستحمام، وغسل اليدين، وقص الأظافر.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم سواكًا وفرشاة أسنان أمام التلميذ، ويردد معه الحديث «استاكوا وتنظفوا» ويمثّل استعمال السواك، ثم يسأله: ما معنى «استاكوا»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم جدول صور ليوم كامل يطبقون فيه قول الرسول ﷺ «وتنظفوا» (السواك، غسل اليدين، قص الأظافر)، وشرحه لزملائهم.\n\n4) [مستوى المعرفة] سمّع الحديث الشريف الذي حفظته.\n   الإجابة النموذجية: «استاكوا وتنظفوا».\n5) [مستوى التطبيق] لماذا ابتعد سعد عن صديقه أحمد؟\n   الإجابة النموذجية: بسبب الرائحة الكريهة لأن أحمد لم ينظف أسنانه.\n6) [مستوى الاستدلال] بماذا تنصح أحمد حتى لا يتكرر الموقف؟\n   الإجابة النموذجية: أن ينام مبكرًا وينظف أسنانه ويستحم قبل الخروج.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم سواكًا وفرشاة أسنان أمام التلميذ، ويردد معه الحديث «استاكوا وتنظفوا» ويمثّل استعمال السواك، ثم يسأله: ما معنى «استاكوا»؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم جدول صور ليوم كامل يطبقون فيه قول الرسول ﷺ «وتنظفوا» (السواك، غسل اليدين، قص الأظافر)، وشرحه لزملائهم.", "1) [مستوى المعرفة] بماذا ينظّف المسلم أسنانه؟\n   الإجابة النموذجية: بالسواك أو الفرشاة.\n2) [مستوى التطبيق] أكمل الحديث: «استاكوا ...».\n   الإجابة النموذجية: وتنظفوا.\n3) [مستوى الاستدلال] لماذا أوصانا الرسول ﷺ بالسواك؟\n   الإجابة النموذجية: لنظافة الفم وطيب رائحته ووقاية الأسنان من المرض.\n\n4) [مستوى المعرفة] هل إهمال النظافة يؤذي الآخرين؟\n وذُ، مَلِكِ، إلهِ»، والتلاميذ يرددون جماعيًا وزمريًا وفرديًا (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n4. لعبة «الكلمة الناقصة»: تكتب المعلمة الآيات وتحذف كلمة في كل مرة (تقويم تكويني)، والتلاميذ يكملون الكلمة الناقصة شفويًا (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. آخر المصحف: توضح المعلمة أن الناس آخر سورة وأن رقمها 114، والتلاميذ يضعون أصابعهم على السورة في المصحف (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. التلاوة النموذجية (4–6): تتلو المعلمة الآيات بتأنٍّ مع العرض على السبورة، والتلاميذ ينصتون ويتابعون (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. التلقين وضبط النطق: تلقّن المعلمة وتركز على الشدّة في «الخنّاس» و«الجِنّة» وتكرار «يوسوس»، والتلاميذ يرددون حتى يتقنوا النطق (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n8. سلسلة الآيات: كل مجموعة تتلو آية بالتتابع حتى نهاية السورة (تقويم تكويني)، وتتلو المجموعات بالتتابع دون توقف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. أعدّ الآيات: تطلب المعلمة عدّ الآيات بأرقامها، والتلاميذ يعدّون: ست آيات (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ما آخر سورة في المصحف الشريف؟\n   الإجابة النموذجية: سورة الناس.\n2) [مستوى التطبيق] أكمل: «قل أعوذ لصلاة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أعتز بذكرى المولد: تناقش المعلمة كيف نحتفي بالذكرى: الصلاة عليه، قراءة سيرته، الاقتداء بأخلاقه، والتلاميذ يعبّرون عن مشاعرهم تجاه الرسول ﷺ (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n8. أتعاون مع زملائي: المتاهة ص36: تعطي كل مجموعة رسمة المتاهة وتنبّه إلى أن الرسول ﷺ وُلد في بيت قريب من الكعبة (تقويم تكويني)، وتحل المجموعة المتاهة وتعرض الحل وتدوّنه في الكتاب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أعظّم الكعبة: تربط المعلمة بين حماية الله للكعبة ومكانتها عند المسلمين، والتلاميذ يذكرون ما يعرفونه عن الكعبة (قبلة المسلمين) (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] في أي مدينة وُلد الرسول ﷺ؟\n   الإجابة النموذجية: في مكة المكرمة.\n2) [مستوى التطبيق] ما اسم العام الذي وُلد فيه الرسول ﷺ؟\n   الإجابة النموذجية: عام الفيل.\n3) [مستوى الاستدلال] لماذا سُمّي ذلك العام بعام الفيل؟\n   الإجابة النموذجية: لأن أبرهة جاء بالأفيال ليهدم الكعبة فأهلكه الله تعالى في ذلك العام.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة أصحاب الفيل بثلاث بطاقات مصورة (مجيء أبرهة بالأفيال، إرسال الطير، حماية الكعبة)، ثم يسأله: ما اسم العام الذي وُلد فيه الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة تعريفية لمولد الرسول ﷺ تتضمن المدينة (مكة المكرمة) والعام (عام الفيل) وسبب التسمية، ويعرضونها على زملائهم.\n\n4) [مستوى المعرفة] هل وُلد الرسول ﷺ داخل الكعبة؟\n   الإجابة النموذجية: لا، وُلد في بيت قريب منها في مكة.\n5) [مستوى التطبيق] كيف نحتفي بذكرى مولد الرسول ﷺ؟\n   الإجابة النموذجية: بالصلاة عليه، وقراءة سيرته، والاقتداء بأخلاقه.\n6) [مستوى الاستدلال] اذكر مثالًا يبيّن أن مولد الرسول ﷺ كان خيرًا للناس.\n   الإجابة النموذجية: هدى الناس إلى الإسلام وعلّمهم الأخلاق الحسنة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة أصحاب الفيل بثلاث بطاقات مصورة (مجيء أبرهة بالأفيال، إرسال الطير، حماية الكعبة)، ثم يسأله: ما اسم العام الذي وُلد فيه الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة تعريفية لمولد الرسول ﷺ تتضمن المدينة (مكة المكرمة) والعام (عام الفيل) وسبب التسمية، ويعرضونها على زملائهم.", "1) [مستوى المعرفة] من الذي حمى الكعبة من جيش أبرهة؟\n   الإجابة النموذجية: الله تعالى.\n2) [مستوى التطبيق] ماذا كانت تحمل الطيور التي أرسلها الله؟\n   الإجابة النموذجية: حجارة.\n3) [مستوى الاستدلال] رتّب: وُلد الرسول ﷺ – جاء أبرهة بالأفيال – هزم الله الجيش.\n   الإجابة النموذجية: جاء أبرهة بالأفيال، هزم الله الجيش، وُلد الرسول ﷺ.\n\n4) [مستوى المعرفة] أين وُلد الرسول ﷺ؟\n   الإجابة النموذجية: في مكة المكرمة في بيت قريب من الكعبة.\n5) [مستوى التطبيق] أكمل: كان مولد الرسول ﷺ ... لجميع الخلق.\n   الإجابة النموذجية: خيرًا.\n6) [مستوى الاستدلال] لماذا نعتز بذكرى مولد الرسول ﷺ؟\n   الإجابة النموذجية: لأنه رسول الله الذي هدانا إلى الإسلام ونحبه.", "للطالب: يحكي قصة عام الفيل لأسرته مستعينًا بصور ص34.\nلولي الأمر: يستمع إلى قصة طفله ويثني عليه، ويذكر له لقب «الصادق الأمين».\nالمرجع: كتاب الطالب (الجزء الأول) ص 34–37.\nللطالب: يحل متاهة ص36 ويسأل أسرته عن ذكرى المولد النبوي.\nلولي الأمر: يحدّث طفله عن الاحتفاء بذكرى المولد بالصلاة على النبي ﷺ وقراءة سيرته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=6"]}, {"k": 2, "axis": "سبب محبتنا للرسول ﷺ: رحمة للعالمين، وأختبر تعلمي", "week": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1. يتعرّف سبب محبتنا للرسول ﷺ من قوله تعالى: «وما أرسلناك إلا رحمة للعالمين».\n2. يصلي على الرسول ﷺ كلما ذُكر.\n3. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر: يعبّر عن محبته للرسول ﷺ بعبارة أو رسمة.", "المخرج 1: يتعرّف سبب محبتنا للرسول ﷺ من قوله تعالى: «وما أرسلناك إلا رحمة للعالمين». ← فهم\nالمخرج 2: يصلي على الرسول ﷺ كلما ذُكر. ← تطبيق\nالمخرج 3: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يعبّر عن محبته للرسول ﷺ بعبارة أو رسمة. ← إبداع", "التعلم الذاتي، التعلم التشاركي، التعلم المبني على اللعب", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: ألوان", "الرحمة، العالمين، المحبة، الصلاة على النبي ﷺ", "تعرض المعلمة الآية الكريمة: «وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ» (الأنبياء: 107) وتقرؤها مع التركيز على كلمة «رحمة».", "1. التهيئة: تعرض المعلمة الآية وتقرؤها قراءة صحيحة، والتلاميذ يرددون الآية (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ألوّن ص37: توجّه المعلمة تلوين الكلمة التي تحتها خط وتترك حرية اختيار اللون، والتلاميذ يلونون كلمة «رحمة» (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. كيف كان رحمة؟: تسأل المعلمة: كيف كان مبعث الرسول ﷺ رحمة للعالمين؟ ثم توضح أنه أخرج الناس من الظلمات إلى النور (تقويم تكويني)، والتلاميذ يجيبون بأمثلة من رحمته بالأطفال والحيوان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. أختبر تعلمي: توجّه المعلمة حل الأنشطة: مكان المولد وعامه، والصلاة على الرسول ﷺ، والتلاميذ يحلون الأنشطة ويقرأ بعضهم إجاباته (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. العبارة الختامية: تقرأ المعلمة عبارة مريم: «أحب الرسول ﷺ فأعتز بتاريخ مولده»، ويرددونها التلميذ ويصلّون على النبي ﷺ (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n8. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] أكمل: «وما أرسلناك إلا ... للعالمين».\n   الإجابة النموذجية: رحمة.\n2) [مستوى التطبيق] ماذا نقول عندما نسمع اسم الرسول ﷺ؟\n   الإجابة النموذجية: صلى الله عليه وسلم.\n3) [مستوى الاستدلال] لماذا نحب الرسول ﷺ؟\n   الإجابة النموذجية: لأن الله أرسله رحمة للعالمين يهدينا إلى الخير.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ قصة أصحاب الفيل بثلاث بطاقات مصورة (مجيء أبرهة بالأفيال، إرسال الطير، حماية الكعبة)، ثم يسأله: ما اسم العام الذي وُلد فيه الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة تعريفية لمولد الرسول ﷺ تتضمن المدينة (مكة المكرمة) والعام (عام الفيل) وسبب التسمية، ويعرضونها على زملائهم.", "1) [مستوى المعرفة] في أي عام وُلد الرسول ﷺ؟\n   الإجابة النموذجية: عام الفيل.\n2) [مستوى التطبيق] اكتب: صلى الله عليه وسلم.\n   الإجابة النموذجية: كتابة العبارة صحيحة.\n3) [مستوى الاستدلال] عبّر بجملة من إنشائك عن محبتك للرسول ﷺ.\n   الإجابة النموذجية: مثل: أحب رسولي محمدًا ﷺ وأقتدي بأخلاقه.", "للطالب: يراجع درس المولد ص34–37 ويكتب عبارة محبة للرسول ﷺ.\nلولي الأمر: يشجع طفله على الصلاة على النبي ﷺ كلما ذُكر اسمه.\nالمرجع: كتاب الطالب (الجزء الأول) ص 34–37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=6"]}], "weeks": [4]}, {"id": "najasat", "title": "النجاسات", "unit": "الوحدة الأولى", "sb": "كتاب الطالب – الجزء الأول: ص 38–42", "tg": "دليل المعلم: ص 42–43", "n": 3, "periods": [{"k": 1, "axis": "معنى النجاسة (قصة الجرح والدم) + أنواع النجاسات (أفهم وأناقش)", "week": "الأسبوع الرابع (27/9–1/10/2026م)", "f": ["1. يبيّن معنى النجاسة بأسلوب مبسّط.\n2. يستنتج أن الدم الذي أصاب الثوب نجاسة يجب إزالتها.\n3. يقترح تصرفًا سليمًا عند إصابة ثوبه بنجاسة.\n4. يعدّد بعض أنواع النجاسات.\n5. يسمّي محتويات الصور الدالة على النجاسات.\n6. يميز بين الأشياء الطاهرة والأشياء النجسة.\n\nمخرج تعليمي آخر:\nيحرص على طهارة ثوبه وبدنه.\nيدرك أن المسلم قد يتعرض للنجاسة في أماكن مختلفة.", "المخرج 1: يبيّن معنى النجاسة بأسلوب مبسّط. ← فهم\nالمخرج 2: يستنتج أن الدم الذي أصاب الثوب نجاسة يجب إزالتها. ← تحليل\nالمخرج 3: يقترح تصرفًا سليمًا عند إصابة ثوبه بنجاسة. ← تطبيق\nالمخرج 4: يعدّد بعض أنواع النجاسات. ← تذكر\nالمخرج 5: يسمّي محتويات الصور الدالة على النجاسات. ← فهم\nالمخرج 6: يميز بين الأشياء الطاهرة والأشياء النجسة. ← تحليل\nالمخرج الآخر: يحرص على طهارة ثوبه وبدنه. ← تقييم\nالمخرج الآخر: يدرك أن المسلم قد يتعرض للنجاسة في أماكن مختلفة. ← فهم", "التعلم المبني على حل المشكلات، التعلم التشاركي، التعلم بالاكتشاف، التعلم المبني على اللعب، التعلم التعاوني\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية، الحوار والمناقشة", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات صور (طاهر/نجس)", "النجاسة، الطهارة، الدم، أنواع النجاسات، البول، الغائط، القيء، الميتة، الخنزير", "تسرد المعلمة قصة قصيرة عن طالب جُرح إصبعه في أثناء اللعب فسال الدم وأصاب ثوبه، وتتوقف لتسأل: ماذا يسمى السائل الأحمر الذي خرج من الجرح؟", "1. التهيئة: تسرد المعلمة القصة وتطرح السؤال الأول، والتلاميذ يجيبون: الدم (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. حوار حول القصة: تطرح المعلمة أسئلة الدليل: ماذا كان يفعل؟ ما الذي جرحه؟ هل تعرضت لمثل ذلك؟ كيف تصرفت؟ والتلاميذ يجيبون ويحكون مواقفهم (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. ما النجاسة؟: توضح المعلمة أن النجاسة قذارة يجب على المسلم تجنبها وإزالتها من ثوبه وبدنه ليكون طاهرًا (تقويم تكويني)، والتلاميذ يرددون التعريف المبسّط (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n4. ماذا يفعل الطالب؟: تسأل المعلمة: ماذا يفعل الطالب بثوبه قبل الصلاة؟ والتلاميذ يقترحون: يغسل مكان الدم بالماء (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. أربط بالصلاة: تبيّن المعلمة أن المسلم يصلي بثوب وبدن طاهرين، والتلاميذ يذكرون أهمية الطهارة للصلاة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. أفهم وأناقش ص39: تطلب المعلمة تسمية محتويات الصورة، وتوضح أنها أمثلة للنجاسات، والتلاميذ يسمّون: البول، الدم، القيء، الميتة، الخنزير (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أين نجد النجاسة؟: تنبّه المعلمة إلى أنها قد تكون في البيت والمدرسة والشارع والحديقة، والتلاميذ يذكرون أمثلة لأماكن قد يرون فيها نجاسة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. لعبة «طاهر أم نجس؟»: تعرض المعلمة بطاقات (ماء، دم، تراب نظيف، قيء، ثوب نظيف، ميتة) (تقويم تكويني)، وتصنف المجموعات البطاقات في عمودين (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. أتأكد: تؤكد المعلمة أن الخنزير من النجاسات وأن المسلم يتجنبه، والتلاميذ يرددون أنواع النجاسات (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] هل الدم الذي أصاب الثوب نجاسة؟\n   الإجابة النموذجية: نعم.\n2) [مستوى التطبيق] ما النجاسة؟\n   الإجابة النموذجية: قذارة يجب على المسلم تجنبها وإزالتها من ثوبه وبدنه.\n3) [مستوى الاستدلال] ماذا يفعل الطالب إذا أراد أن يصلي وعلى ثوبه دم؟\n   الإجابة النموذجية: يغسل مكان الدم بالماء حتى يطهر ثم يصلي.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ قطعة قماش عليها بقعة حمراء تمثل الدم، ويمثّل غسل مكانها بالماء حتى تطهر، ثم يسأله: هل يصلي بثوب عليه دم قبل أن يغسله؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصنيف صور مواقف إلى «ثوب طاهر» و«ثوب فيه نجاسة»، واقتراح التصرف السليم في كل موقف نجاسة قبل الصلاة.\n\n4) [مستوى المعرفة] اذكر نوعين من النجاسات.\n   الإجابة النموذجية: مثل: البول والدم.\n5) [مستوى التطبيق] هل الماء النظيف نجس؟\n   الإجابة النموذجية: لا، الماء النظيف طاهر.\n6) [مستوى الاستدلال] صنّف: (قيء، تراب نظيف، ميتة) إلى طاهر ونجس.\n   الإجابة النموذجية: نجس: القيء والميتة، طاهر: التراب النظيف.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ قطعة قماش عليها بقعة حمراء تمثل الدم، ويمثّل غسل مكانها بالماء حتى تطهر، ثم يسأله: هل يصلي بثوب عليه دم قبل أن يغسله؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصنيف صور مواقف إلى «ثوب طاهر» و«ثوب فيه نجاسة»، واقتراح التصرف السليم في كل موقف نجاسة قبل الصلاة.", "1) [مستوى المعرفة] أكمل: يجب على المسلم أن يزيل ... من ثوبه.\n   الإجابة النموذجية: النجاسة.\n2) [مستوى التطبيق] بماذا نزيل النجاسة؟\n   الإجابة النموذجية: بالماء.\n3) [مستوى الاستدلال] لماذا يحرص المسلم على إزالة النجاسة قبل الصلاة؟\n   الإجابة النموذجية: لأن الصلاة لا تصح إلا بثوب وبدن طاهرين.\n\n4) [مستوى المعرفة] ضع دائرة حول النجاسة: (ماء – دم – ثوب نظيف).\n   الإجابة النموذجية: الدم.\n5) [مستوى التطبيق] هل الخنزير من النجاسات؟\n   الإجابة النموذجية: نعم.\n6) [مستوى الاستدلال] اذكر ثلاثة أماكن قد يتعرض فيها المسلم للنجاسة وكيف يحذر منها.\n   الإجابة النموذجية: البيت والشارع والحديقة؛ بالانتباه لموضع قدميه وغسل ما يصيبه.", "للطالب: يحكي قصة الطالب المجروح لأسرته ويذكر معنى النجاسة.\nلولي الأمر: يوضح لطفله كيف يغسل ثوبه إذا أصابته نجاسة.\nالمرجع: كتاب الطالب (الجزء الأول) ص 38–42.\nللطالب: يراجع صورة «أفهم وأناقش» ص39 ويعدّد أنواع النجاسات لأسرته.\nلولي الأمر: يوجّه طفله إلى تجنب النجاسات في الطريق والحديقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=7"]}, {"k": 2, "axis": "أتعاون مع زملائي: تحديد النجاسات في المشهد والاحتياطات + أتعلم وأطبق: تجنب النجاسات والتصرف السليم عند الإصابة بها" لتلميذ صورًا لنعم الله (الماء، الطعام، العينين)، ويردد معه «الحمد لله» عند كل صورة، ثم يسأله: ماذا نقول لمن قدّم لنا معروفًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة شكر لله تعالى على ثلاث نعم يختارونها، وبطاقة شكر لشخص قدّم لهم معروفًا، مع بيان الفرق بين الشكرين.", "1) [مستوى المعرفة] من الذي أعطانا النعم؟\n   الإجابة النموذجية: الله تعالى.\n2) [مستوى التطبيق] اذكر ثلاث نعم أنعم الله بها عليك.\n   الإجابة النموذجية: مثل: العينان، والطعام، والأسرة.\n3) [مستوى الاستدلال] لماذا وجّه الأب أحمد إلى شكر الله مع أنه هو من اشترى له الهدية؟\n   الإجابة النموذجية: لأن الله هو الذي رزق الأب المال، فكل النعم من الله.\n\n4) [مستوى المعرفة] اذكر عبارة نشكر بها الله بألسنتنا.\n   الإجابة النموذجية: الحمد لله.\n5) [مستوى التطبيق] كيف أشكر الله على نعمة الطعام بفعلي؟\n   الإجابة النموذجية: آكل منه ما يكفيني ولا أرمي الباقي.\n6) [مستوى الاستدلال] اختر نعمة لم تُذكر في الدرس واقترح طريقة لشكرها.\n   الإجابة النموذجية: مثل: نعمة المدرسة ← أحافظ على كتبي وأتعلم بجد.", "للطالب: يقرأ حوار أحمد وأبيه ص44 ويعدّ مع أسرته خمس نعم.\nلولي الأمر: يعوّد طفله قول «الحمد لله» و«شكرًا» في المواقف اليومية.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50.\nللطالب: يحل نشاط ص45–46 ويطبق مظهر شكر واحدًا في البيت.\nلولي الأمر: يلاحظ تطبيق طفله للشكر بالفعل ويثني عليه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=8"]}, {"k": 2, "axis": "أتعاون مع زملائي: أستشعر نعم الله وأحافظ عليها", "week": "الأسبوع السادس (11–15/10/2026م)", "f": ["1. يستشعر نعم الله تعالى التي تستوجب شكره.\n2. يتحدث مع مجموعته عن نعمة وكيفية المحافظة عليها.\n3. يحترم دوره في الحديث داخل المجموعة.\n\nمخرج تعليمي آخر: يقدّم مظهر شكر عملي للنعمة التي تحدث عنها.", "المخرج 1: يستشعر نعم الله تعالى التي تستوجب شكره. ← تقييم\nالمخرج 2: يتحدث مع مجموعته عن نعمة وكيفية المحافظة عليها. ← تطبيق\nالمخرج 3: يحترم دوره في الحديث داخل المجموعة. ← تطبيق\nالمخرج الآخر: يقدّم مظهر شكر عملي للنعمة التي تحدث عنها. ← إبداع", "التعلم التعاوني، التعلم التشاركي\nاستراتيجيات أخرى من دليل المعلم: الع ة الصحة؟\n   الإجابة النموذجية: بالأكل الصحي والنظافة والنوم مبكرًا.\n3) [مستوى الاستدلال] ماذا يحدث لو فقد الإنسان نعمة السمع؟ وماذا نتعلم من ذلك؟\n   الإجابة النموذجية: لن يسمع الأصوات؛ فنتعلم أن نشكر الله على نعمة السمع.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا لنعم الله (الماء، الطعام، العينين)، ويردد معه «الحمد لله» عند كل صورة، ثم يسأله: ماذا نقول لمن قدّم لنا معروفًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة شكر لله تعالى على ثلاث نعم يختارونها، وبطاقة شكر لشخص قدّم لهم معروفًا، مع بيان الفرق بين الشكرين.", "1) [مستوى المعرفة] أكمل: نعم الله كثيرة فـ... الله عليها.\n   الإجابة النموذجية: نشكر.\n2) [مستوى التطبيق] اذكر نعمة وطريقة للمحافظة عليها.\n   الإجابة النموذجية: مثل: نعمة الماء ← لا أسرف فيه.\n3) [مستوى الاستدلال] لماذا يجب أن نحافظ على النعم؟\n   الإجابة النموذجية: لأن المحافظة عليها من شكر الله تعالى، ولكي تبقى لنا.", "للطالب: يتحدث مع أسرته عن نعمة ويتفقون على طريقة للمحافظة عليها.\nلولي الأمر: يناقش طفله في نعم البيت ويشجعه على المحافظة عليها.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=8"]}, {"k": 3, "axis": "أذكاري: ذكر الاستيقاظ من النوم، وأختبر تعلمي", "week": "الأسبوع السادس (11–15/10/2026م)", "f": ["1. يحفظ ذكر الاستيقاظ من النوم: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور».\n2. يطبق ذكر الاستيقاظ في حياته.\n3. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر: يربط ذكر الاستيقاظ بشكر الله على نعمة الحياة.", "المخرج 1: يحفظ ذكر الاستيقاظ من النوم: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور». ← تذكر\nالمخرج 2: يطبق ذكر الاستيقاظ في حياته. ← تطبيق\nالمخرج 3: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يربط ذكر الاستيقاظ بشكر الله على نعمة الحياة. ← فهم", "التعلم بالنمذجة، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: تمثيل الأدوار", "الكتاب، السبورة الذكية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقة الذكر", "الذكر، الاستيقاظ، النشور", "تضع المعلمة رأسها على الطاولة وتغمض عينيها لبرهة، ثم تفتحهما وتنظر إلى النافذة وتقول: «لقد طلع الفجر»، وترفع يديها بالذكر.", "1. التهيئة: تمثل المعلمة مشهد الاستيقاظ وتقول الذكر، والتلاميذ يلاحظون ويسألون عن الذكر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أذكاري ص49: تعرض المعلمة بطاقة الذكر وتقرؤه وتوضح معنى «أحيانا بعد ما أماتنا» بأسلوب مبسّط (النوم والاستيقاظ)، والتلاميذ يرددون الذكر جماعيًا وزمريًا (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تمثيل جماعي: تطلب المعلمة مشهدًا تمثيليًا جماعيًا كالذي قدّمته (تقويم تكويني)، والتلاميذ يمثلون الاستيقاظ ويرددون الذكر (6 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n4. أختبر تعلمي ص50: توجّه المعلمة حل الأنشطة: تطبيق مفهوم الشكر وشكر الناس، والتلاميذ يحلون الأنشطة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تسميع الذكر: تسمّع المعلمة الذكر فرديًا، والتلاميذ يسمّعون الذكر (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n7. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ماذا نقول عندما نستيقظ من النوم؟\n   الإجابة النموذجية: الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور.\n2) [مستوى التطبيق] أكمل: «الحمد لله الذي أحيانا بعد ما ...».\n   الإجابة النموذجية: أماتنا وإليه النشور.\n3) [مستوى الاستدلال] لماذا نحمد الله عند الاستيقاظ؟\n   الإجابة النموذجية: لأنه ردّ إلينا أرواحنا وأعطانا يومًا جديدًا.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا لنعم الله (الماء، الطعام، العينين)، ويردد معه «الحمد لله» عند كل صورة، ثم يسأله: ماذا نقول لمن قدّم لنا معروفًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة شكر لله تعالى على ثلاث نعم يختارونها، وبطاقة شكر لشخص قدّم لهم معروفًا، مع بيان الفرق بين الشكرين.", "1) [مستوى المعرفة] سمّع ذكر الاستيقاظ.\n   الإجابة النموذجية: تسميع صحيح للذكر.\n2) [مستوى التطبيق] هل أشكر من يساعدني من الناس؟\n   الإجابة النموذجية: نعم، أقول له شكرًا وجزاك الله خيرًا.\n3) [مستوى الاستدلال] اكتب موقفين تشكر فيهما الله وموقفًا تشكر فيه الناس.\n   الإجابة النموذجية: مثل: أحمد الله بعد الطعام وبعد الاستيقاظ، وأشكر أمي على إعداد الإفطار.", "للطالب: يقول ذكر الاستيقاظ كل صباح ويراجع ص49–50.\nلولي الأمر: يذكّر طفله بذكر الاستيقاظ صباحًا ويرده معه.\nالمرجع: كتاب الطالب (الجزء الأول) ص 43–50.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=8"]}], "weeks": [6]}, {"id": "rabbi", "title": "أحب الله ربي", "unit": "الوحدة الثانية", "sb": "كتاب الطالب – الجزء الأول: ص 52–55", "tg": "دليل المعلم: ص 48–50", "n": 2, "periods": [{"k": 1, "axis": "من مظاهر ربوبية الله للإنسان: حفظه في مراحل حياته + تيسير أسباب الحياة (الماء والغذاء والهواء) والشفاء", "week": "الأسبوع السابع (18–22/10/2026م)", "f": ["1. يتعرّف أن الله تعالى رب الإنسان الذي يحفظه.\n2. يذكر صورًا من حفظ الله تعالى للإنسان في مراحل حياته.\n3. يربط العبارات بالصور المعبّرة عنها في عنصر «أستمع وأفهم».\n4. يتعرّف أن الله تعالى يسّر للإنسان الماء والغذاء والهواء.\n5. يوضح أن الشفاء بيد الله تعالى مع الأخذ بالتداوي.\n6. يشارك مجموعته في نشاط «أتعاون مع زملائي».\n\nمخرج تعليمي آخر:\nيعبّر عن شكره لله تعالى على حفظه له.\nيستنتج أن الذي يسّر هذه الأشياء هو الله تعالى رب الإنسان.", "المخرج 1: يتعرّف أن الله تعالى رب الإنسان الذي يحفظه. ← فهم\nالمخرج 2: يذكر صورًا من حفظ الله تعالى للإنسان في مراحل حياته. ← تذكر\nالمخرج 3: يربط العبارات بالصور المعبّرة عنها في عنصر «أستمع وأفهم». ← فهم\nالمخرج 4: يتعرّف أن  الشافي هو الله؟\n   الإجابة النموذجية: لأن الله أمرنا بالأخذ بالأسباب، والشفاء بيده وحده.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا لمراحل حياة الإنسان (رضيع، طفل، كبير)، ويذكر معه كيف حفظ الله الإنسان في كل مرحلة، ثم يسأله: من الذي يحفظ الإنسان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم مرحلة من حياتهم حفظهم الله فيها، وكتابة جملة يشكرون فيها الله تعالى، وشرح معنى أن الله «رب» الإنسان لزملائهم.", "1) [مستوى المعرفة] أكمل: الله ... يحفظني.\n   الإجابة النموذجية: ربي.\n2) [مستوى التطبيق] صِل العبارة «الله يحفظ الطفل» بالصورة المناسبة.\n   الإجابة النموذجية: صورة الطفل الرضيع مع أمه.\n3) [مستوى الاستدلال] كيف تشكر الله الذي يحفظك كل يوم؟\n   الإجابة النموذجية: أحمده وأصلي له وأدعوه.\n\n4) [مستوى المعرفة] أكمل: إذا مرضت فالذي يشفيني هو ...\n   الإجابة النموذجية: الله تعالى.\n5) [مستوى التطبيق] من الذي يسّر لنا الهواء؟\n   الإجابة النموذجية: الله تعالى.\n6) [مستوى الاستدلال] علام يدل تيسير الماء والغذاء والهواء للإنسان؟\n   الإجابة النموذجية: على أن الله تعالى رب الإنسان الذي يرعاه ويرزقه.", "للطالب: يقرأ عنصر «أستمع وأفهم» ص52 مع أسرته.\nلولي الأمر: يحدّث طفله عن حفظ الله له منذ ولادته.\nالمرجع: كتاب الطالب (الجزء الأول) ص 52–55.\nللطالب: يكمل نشاط ص54 ويعدّ مع أسرته نعم الطعام في وجبة الغداء.\nلولي الأمر: يذكّر طفله بالدعاء بالشفاء عند المرض مع أخذ الدواء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=9"]}, {"k": 2, "axis": "آيات من سورة الشعراء (78–80): «الذي خلقني فهو يهدين» + أعبّر عن حبي لله ربي (الدعاء بلفظ الرب) وأختبر تعلمي", "week": "الأسبوع السابع (18–22/10/2026م)", "f": ["1. يستمع إلى الآيات (78–80) من سورة الشعراء تلاوة مجوّدة.\n2. يحدد الكلمات الدالة على ربوبية الله: خلقني، يهدين، يطعمني، يسقين، يشفين.\n3. يستنتج أن الله وحده خلق الإنسان وتكفّل برزقه ورعايته.\n4. يعبّر عن حبه لله تعالى ربه.\n5. يدعو الله بلفظ الربوبية: «ربّ اغفر وارحم وأنت خير الراحمين».\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nيعبّر بلغته عن المعنى الإجمالي للآيات.\nيذكر طرقًا يصل بها إلى محبة ن يوسوس له بفعل الشر. ← تطبيق\nالمخرج 5: يختار الرسمة المعبّرة عن السلوك الصحيح. ← تقييم\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يكتب استنتاجه في المكان المخصص في الكتاب. ← تطبيق\nالمخرج الآخر: يدرك أن الشيطان ضعيف يهرب عند ذكر الله. ← فهم", "التعلم بالاكتشاف، التعلم التشاركي، التعلم الذاتي، التعلم المبني على اللعب، التعلم المبني على حل المشكلات، التعلم التعاوني", "الكتاب، السبورة الذكية، صورة توضيحية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "رب الناس، ملك الناس، إله الناس، الوسوسة، الاستعاذة، أعوذ بالله من الشيطان الرجيم", "تعرض المعلمة صورة أطفال من بلاد مختلفة بملابس متنوعة، وتسأل: هل يختلف هؤلاء الأطفال؟ ومن خلقهم جميعًا؟", "1. التهيئة: تعرض المعلمة الصورة وتطرح السؤال، والتلاميذ يصفون الاختلاف ويجيبون: الله (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أفهم وأستنتج ص58: تطلب المعلمة وصف الرسمة: تنوع الأشخاص وجنسياتهم ولباسهم، والتلاميذ يصفون ما يرونه (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أسئلة الاستنتاج: تسأل المعلمة: من خلق هؤلاء؟ من إلههم المستحق للعبادة؟ من ملكهم؟ (تقويم تكويني)، والتلاميذ يجيبون: الله ربهم وملكهم وإلههم (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. أكمل وأكتب: توجّه المعلمة إلى إكمال الكلمة المناسبة وتدوين الاستنتاج على السبورة، والتلاميذ يكملون ويكتبون الاستنتاج في الكتاب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. أردد الآيات: تقرأ المعلمة الآيات (1–3) وتربطها بالاستنتاج، والتلاميذ يرددون الآيات (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. فكر وأطبق ص59: تعرض المعلمة الرسمتين وتقرأ عبارتي تفكير الولد وتطلب المقارنة، والتلاميذ يختارون الرسمة الصحيحة ويعللون (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. همسة: تستثمر المعلمة عبارة «همسة» في عدم الاستجابة لمن يدعو إلى الشر، والتلاميذ يرددون: أعوذ بالله من الشيطان الرجيم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. ألعب وأتعلم ص60: توجّه المعلمة إلى توصيل الرسمة وقراءة العبارة كاملة على شكل تنافس (تقويم تكويني)، والتلاميذ يوصلون الرسمة ويقرؤون العبارة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللع دين وأهمية الدعاء لهما، وتذكر قوله تعالى: «وبالوالدين إحسانًا»، والتلاميذ يذكرون تضحيات أمهاتهم وآبائهم (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n8. أفكر وأطبق ص65: تقرأ المعلمة العبارات وتطلب الإجابة شفويًا (تقويم تكويني)، والتلاميذ يجيبون ويقترحون أعمال بر (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أتعاون مع زملائي ص66–67: توزّعهم المعلمة في مجموعات لكتابة عبارات في البطاقات المصممة وتشجعهم على إهدائها، وتكتب كل مجموعة عبارات حب ودعاء للوالدين (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.", "1) [مستوى المعرفة] من أحق الناس بحسن صحبتك؟\n   الإجابة النموذجية: أمي.\n2) [مستوى التطبيق] ما معنى «صحابتي»؟\n   الإجابة النموذجية: مرافقتي ومعاملتي.\n3) [مستوى الاستدلال] كم مرة قال الرسول ﷺ «أمك»؟ ثم من ذكر؟\n   الإجابة النموذجية: ثلاث مرات، ثم ذكر الأب.\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ حديث «أحق الناس بحسن صحابتي» جملةً جملة مستعينًا بصور (أم، أم، أم، أب)، ثم يسأله: من أحق الناس بحسن صحبتك؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة ثلاثة أعمال يحسنون بها صحبة أمهاتهم، وتفسير لماذا كرر الرسول ﷺ «أمك» ثلاث مرات قبل ذكر الأب.\n\n4) [مستوى المعرفة] لماذا أوصى الرسول ﷺ بالأم ثلاث مرات؟\n   الإجابة النموذجية: لأنها تتعب كثيرًا في الحمل والرضاعة والتربية.\n5) [مستوى التطبيق] اذكر عملًا من أعمال البر بالأم.\n   الإجابة النموذجية: مثل: مساعدتها وطاعتها والدعاء لها.\n6) [مستوى الاستدلال] اكتب دعاءً قصيرًا لوالديك.\n   الإجابة النموذجية: مثل: ربِّ ارحمهما كما ربياني صغيرًا.\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ حديث «أحق الناس بحسن صحابتي» جملةً جملة مستعينًا بصور (أم، أم، أم، أب)، ثم يسأله: من أحق الناس بحسن صحبتك؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة ثلاثة أعمال يحسنون بها صحبة أمهاتهم، وتفسير لماذا كرر الرسول ﷺ «أمك» ثلاث مرات قبل ذكر الأب.", "1) [مستوى المعرفة] أكمل: قال: ثم من؟ قال: «ثم ...».\n   الإجابة النموذجية: أبوك.\n2) [مستوى التطبيق] سمّع الحديث الشريف.\n   الإجابة النموذجية: تسميع صحيح.\n3) [مستوى الاستدلال] ما معنى «أحقّ الناس»؟\n   الإجابة النموذجية: أولى الناس وأجدرهم.\n\n4) [مستوى المعرفة] أكمل: من أحق الناس بحسن صحابتي؟ قال: «...».\n   الإجابة النموذجية: أمك.\n5) [مستوى التطبيق] اذكر عملين تبرّ بهما والدك.\n   الإجابة النموذجية: أساعده وأطيعه وأدعو له.\n6) [مستوى الاستدلال] كيف تعبّر لوالديك عن شكرك لتضحياتهما؟\n   الإجابة النموذجية: أهديهما بطاقة وأقبّل يديهما وأطيعهما وأدعو لهما.", "للطالب: يحفظ الحديث ص62 ويسمّعه لوالديه.\nلولي الأمر: يستمع إلى طفله وهو يسمّع الحديث ويحدّثه عن مكانة الأم.\nالمرجع: كتاب الطالب (الجزء الأول) ص 62–67.\nللطالب: يهدي البطاقة لوالديه ويراجع الدرس ص62–67.\nلولي الأمر: يستقبل بطاقة طفله ويحدّثه عن أثر البر في الأسرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=12"]}], "weeks": [9]}, {"id": "atiu", "title": "أطيع أمي وأبي", "unit": "الوحدة الثانية", "sb": "كتاب الطالب – الجزء الأول: ص 68–72", "tg": "دليل المعلم: ص 57–58", "n": 1, "periods": [{"k": 1, "axis": "أهمية طاعة الوالدين (الحوار المصوّر) وأعمال الطاعة + تمييز سلوكيات الطاعة (أفكر وأطبق) والالتزام بها، وأختبر تعلمي", "week": "الأسبوع التاسع (1–5/11/2026م)", "f": ["1. يتعرّف أهمية طاعة الوالدين.\n2. يذكر بعض الأعمال التي يستطيع القيام بها طاعةً لوالديه.\n3. يستنتج أن طاعة الوالدين من طاعة الله.\n4. يميّز السلوكيات التي تندرج تحت طاعة الوالدين.\n5. يلتزم طاعة والديه في المواقف اليومية.\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nيعتذر لوالديه إذا أخطأ في حقهما.\nينقد السلوكيات السلبية ويقترح البديل الصحيح.", "المخرج 1: يتعرّف أهمية طاعة الوالدين. ← فهم\nالمخرج 2: يذكر بعض الأعمال التي يستطيع القيام بها طاعةً لوالديه. ← تذكر\nالمخرج 3: يستنتج أن طاعة الوالدين من طاعة الله. ← تحليل\nالمخرج 4: يميّز السلوكيات التي تندرج تحت طاعة الوالدين. ← تحليل\nالمخرج 5: يلتزم طاعة والديه في المواقف اليومية. ← تطبيق\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يعتذر لوالديه إذا أخطأ في حقهما. ← تطبيق\nالمخرج الآخر: ينقد السلوكيات السلبية ويقترح البديل الصحيح. ← تقييم", "التعلم التعاوني، التعلم التشاركي، التعلم المبني على حل المشكلات، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: القصة التربوية\nاستراتيجيات أخرى من دليل المعلم: تمثيل الأدوار", "الكتاب، السبورة الذكية، صورة توضيحية، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، الأقلام", "الطاعة، النصيحة، الاعتذار، طاعة الوالدين، السلوك الإيجابي، السلوك السلبي", "تحكي المعلمة قصة قصيرة واقعية عن طفل أطاع أمه فلم يلعب قرب الطريق فسلم من الخطر، وتسأل: ما فائدة طاعة الوالدين؟", "1. التهيئة: تحكي المعلمة القصة وتسأل، والتلاميذ يذكرون فوائد الطاعة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أستمع وألاحظ ص68–69: تقرأ المعلمة الحوار المصوّر بأسلوب شائق وتركز على العبارات: «لقد أغضبت أمك بعدم طاعتها»، «طاعة الوالدين من طاعة الله»، «أنا متأسف يا أمي»، والتلاميذ يتابعون ويرددون العبارات (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. أناقش: تسأل المعلمة: لماذا غضبت الأم؟ ماذا قال الطفل في النهاية؟ (تقويم تكويني)، والتلاميذ يجيبون ويستنتجون أهمية الاعتذار (3 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: القصة التربوية.\n\n4. أتعاون مع زملائي ص70: تعطي كل مجموعة صورة من صورتي النشاط لاقتراح أعمال الطاعة، وتقترح المجموعة أعمالًا: ترتيب الغرفة، النوم مبكرًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أعرض: تستمع المعلمة لعرض المجموعات، والتلاميذ يعرضون مقترحاتهم (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. أفكر وأطبق ص71: توضح المعلمة المشاهد في الصور وتطلب تحديد المواقف الإيجابية والسلبية، والتلاميذ يحددون المواقف ويقترحون البديل للسلبي (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تختار تلميذين لتمثيل موقف: الأم تطلب إطفاء التلفاز للنوم (تقويم تكويني)، والتلاميذ يمثلون الاستجابة الصحيحة (4 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n8. أختبر تعلمي ص72: توجّه المعلمة حل الأنشطة: الرسم، والكتابة، والتلوين، والتلاميذ يحلون الأنشطة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n9. وعدي: تطلب المعلمة كتابة وعد قصير: «أعد أن أطيع أمي وأبي»، والتلاميذ يكتبون الوعد ويقرؤونه (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "1) [مستوى المعرفة] ماذا قال الطفل لأمه بعد أن أخطأ؟\n   الإجابة النموذجية: أنا متأسف يا أمي.\n2) [مستوى التطبيق] اذكر عملًا تطيع فيه والديك.\n   الإجابة النموذجية: مثل: ترتيب غرفتي عندما تطلب أمي.\n3) [مستوى الاستدلال] لماذا تكون طاعة الوالدين من طاعة الله؟\n   الإجابة النموذجية: لأن الله أمرنا بطاعتهما والإحسان إليهما.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتين لطفل يطيع والديه وآخر يعصيهما، ويناقشه في الفرق، ثم يمثّل معه الاعتذار: «أنا متأسف يا أمي»، ثم يسأله: اذكر عملًا تطيع فيه والديك.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لأعمال يطيعون فيها والديهم في البيت، وبيان لماذا تكون طاعة الوالدين من طاعة الله تعالى.\n\n4) [مستوى المعرفة] هل ترك الألعاب مبعثرة بعد طلب الأم طاعة؟\n   الإجابة النموذجية: لا.\n5) [مستوى التطبيق] صحّح السلوك: طلب الأب من سالم خفض صوت التلفاز فلم يستجب.\n   الإجابة النموذجية: يخفض سالم الصوت فورًا ويقول: حاضر يا أبي.\n6) [مستوى الاستدلال] لماذا تُعدّ طاعة الوالدين من أسباب دخول الجنة؟\n   الإجابة النموذجية: لأن الله يحب من يطيع والديه ويجزيه بالجنة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورتين لطفل يطيع والديه وآخر يعصيهما، ويناقشه في الفرق، ثم يمثّل معه الاعتذار: «أنا متأسف يا أمي»، ثم يسأله: اذكر عملًا تطيع فيه والديك.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول أسبوعي لأعمال يطيعون فيها والديهم في البيت، وبيان لماذا تكون طاعة الوالدين من طاعة الله تعالى.", "1) [مستوى المعرفة] أكمل: طاعة الوالدين من طاعة ...\n   الإجابة النموذجية: الله.\n2) [مستوى التطبيق] هل أعتذر لأمي إذا أغضبتها؟\n   الإجابة النموذجية: نعم.\n3) [مستوى الاستدلال] اقترح ثلاثة أعمال تطيع فيها والديك هذا الأسبوع.\n   الإجابة النموذجية: مثل: النوم مبكرًا، وترتيب الحقيبة، ومساعدة أمي.\n\n4) [مستوى المعرفة] لوّن العبارة: أطيع أمي وأبي.\n   الإجابة النموذجية: تلوين صحيح.\n5) [مستوى التطبيق] اذكر سلوكًا يغضب الوالدين.\n   الإجابة النموذجية: مثل: العناد أو رفع الصوت.\n6) [مستوى الاستدلال] اكتب وعدًا تلتزم فيه بطاعة والديك.\n   الإجابة النموذجية: مثل: أعد أن أنام مبكرًا عندما تطلب أمي.", "للطالب: يقرأ الحوار المصوّر ص68–69 ويطبق عملًا من أعمال الطاعة.\nلولي الأمر: يلاحظ أعمال الطاعة التي يقوم بها طفله ويشكره عليها.\nالمرجع: كتاب الطالب (الجزء الأول) ص 68–72.\nللطالب: يراجع ص68–72 ويلتزم بوعده طوال الأسبوع.\nلولي الأمر: يتابع وعد طفله ويكتب له ملاحظة شكر في نهاية الأسبوع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=13"]}], "weeks": [9]}, {"id": "tahara", "title": "طهارتي عنواني", "unit": "الوحدة الثانية", "sb": "كتاب الطالب – الجزء الأول: ص 73–80", "tg": "دليل المعلم: ص 59–62", "n": 1, "periods": [{"k": 1, "axis": "معنى الطهارة وصورها في ا اتيجيات: استراتيجيات أخرى من دليل المعلم: تمثيل الأدوار.\n\n4. ما الطهارة؟: تكتب المعلمة تعريفًا مبسّطًا: الطهارة أن يكون جسمي وثوبي ومكاني نظيفًا خاليًا من النجاسة (تقويم تكويني)، والتلاميذ يرددون التعريف ويذكرون أمثلة (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. طهارة صفنا: توظف المعلمة بيئة الصف للحديث عن طهارة المكان، والتلاميذ يقترحون طرقًا لإبقاء الصف نظيفًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أتأمل وأعبّر / أردد وأستنتج ص75–76: تقسم المعلمة الصف أربع مجموعات: مجموعتان للصورة، ومجموعتان لبطاقة «وثيابك فطهّر» (المدثر: 4)، وتعرض كل مجموعة استنتاجها (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. أتأمل وأطبق ص77: تعرض المعلمة صور السلوك واحدة واحدة ويصل كل تلميذ الصورة بالوجه المعبّر عن موقفه (تقويم تكويني)، والتلاميذ يصلون الصورة بالوجه المناسب (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n8. أتعاون مع زملائي ص78–79: توزّع المعلمة الملصقات ص87 وتتابع وضعها في المكان المناسب، والتلاميذ يقصّون الملصق ويلصقونه (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. أنشد وأتعلم ص80: تعرض المعلمة نشيد الطهارة وتناقش مضمونه، والتلاميذ ينشدون جماعيًا وزمريًا (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n10. أختبر تعلمي: توجه المعلمة حل نشاطي أهمية الطهارة للصلاة ونقد السلوكيات، والتلاميذ يحلون الأنشطة (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.\n\n11. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n12. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: العصف الذهني.", "1) [مستوى المعرفة] ما الطهارة؟\n   الإجابة النموذجية: أن يكون الجسم والثوب والمكان نظيفًا خاليًا من النجاسة.\n2) [مستوى التطبيق] لماذا سأل أحمد والده عن طهارة ثوبه؟\n   الإجابة النموذجية: ليصلي بثوب طاهر.\n3) [مستوى الاستدلال] اذكر صورة للطهارة في كل من: الجسم، الثوب، المكان.\n   الإجابة النموذجية: الجسم: الاغتسال، الثوب: غسله من النجاسة، المكان: تنظيف الغرفة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ ثلاث صور: جسم نظيف، وثوب مغسول، وغرفة مرتبة، ويربط كل صورة بكلمة «طهارة»، ثم يسأله: اذكر صورة واحدة للطهارة في الجسم.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل حوار أحمد ووالده عن طهارة الثوب مع زميل، ثم إضافة صورة جديدة للطهارة في المكان لم ترد في الدرس.\n\n4) [مستوى المعرفة] أكمل: «وثيابك ...».\n   الإجابة النموذجية: فطهّر.\n5) [مستوى التطبيق] لماذا يجب أن تكون ثيابي طاهرة؟\n   الإجابة النموذجية: لأن الصلاة لا تصح إلا بالطهارة.\n6) [مستوى الاستدلال] انقد سلوك طفل صلى في مكان متسخ، واقترح الصحيح.\n   الإجابة النموذجية: سلوك خاطئ؛ والصحيح أن يصلي في مكان طاهر نظيف.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ ثلاث صور: جسم نظيف، وثوب مغسول، وغرفة مرتبة، ويربط كل صورة بكلمة «طهارة»، ثم يسأله: اذكر صورة واحدة للطهارة في الجسم.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتمثيل حوار أحمد ووالده عن طهارة الثوب مع زميل، ثم إضافة صورة جديدة للطهارة في المكان لم ترد في الدرس.", "1) [مستوى المعرفة] أكمل: تكون الطهارة في الجسم و... والمكان.\n   الإجابة النموذجية: الثوب.\n2) [مستوى التطبيق] كيف أحافظ على طهارة مكاني؟\n   الإجابة النموذجية: أنظفه ولا أترك فيه نجاسة.\n3) [مستوى الاستدلال] ما الفرق بين النظافة والطهارة؟ (بأسلوبك)\n   الإجابة النموذجية: الطهارة نظافة من النجاسة حتى تصح العبادة، والنظافة إزالة الأوساخ.\n\n4) [مستوى المعرفة] بماذا نتطهر من النجاسات؟\n   الإجابة النموذجية: بالماء.\n5) [مستوى التطبيق] اذكر أدبًا من آداب الطهارة تلتزمه.\n   الإجابة النموذجية: مثل: أغسل ثوبي إذا أصابته نجاسة.\n6) [مستوى الاستدلال] لماذا جعل الدرس عنوانه «طهارتي عنواني»؟\n   الإجابة النموذجية: لأن الطهارة تدل على المسلم وتعبّر عن شخصيته.", "للطالب: يقرأ الحوارين ص73–74 ويساعد في ترتيب غرفته وتنظيفها.\nلولي الأمر: يحدّث طفله عن طهارة ملابسه ومكان صلاته.\nالمرجع: كتاب الطالب (الجزء الأول) ص 73–80.\nللطالب: ينشد نشيد الطهارة ص80 مع أسرته ويكمل ص78–79.\nلولي الأمر: يتأكد مع طفله من طهارة ثيابه ومكان صلاته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/islamic/?l=14"]}], "weeks": [10]}, {"id": "rasuli", "title": "رسولي محمد ﷺ", "unit": "الوحدة الثانية", "sb": "كتاب الطالب – الجزء الأول: ص 81–86", "tg": "دليل المعلم: ص 63–65", "n": 1, "periods": [{"k": 1, "axis": "نسب الرسول ﷺ (أتعرّف نسب رسولي) والبطاقة التعريفية + الصلاة على الرسول ﷺ كلما ذُكر، والنشيد، وأختبر تعلمي", "week": "الأسبوع العاشر (8–12/11/2026م)", "f": ["1. يتعرّف نسب الرسول ﷺ: محمد بن عبد الله بن عبد المطلب القرشي.\n2. يذكر اسم والد الرسول ﷺ واسم والدته.\n3. يرتب نسب الرسول ﷺ في بطاقة تعريفية مع مجموعته.\n4. يصلي على الرسول ﷺ كلما ذُكر.\n5. يتعرّف أن الصلاة على النبي ﷺ أمر من الله تعالى للمؤمنين.\n6. يحل أنشطة «أختبر تعلمي» حلًا صحيحًا.\n\nمخرج تعليمي آخر:\nيعتز بالانتماء إلى أسرته.\nينشد نشيد الدرس ويربط أبياته بمعارفه.", "المخرج 1: يتعرّف نسب الرسول ﷺ: محمد بن عبد الله بن عبد المطلب القرشي. ← تذكر\nالمخرج 2: يذكر اسم والد الرسول ﷺ واسم والدته. ← تذكر\nالمخرج 3: يرتب نسب الرسول ﷺ في بطاقة تعريفية مع مجموعته. ← تطبيق\nالمخرج 4: يصلي على الرسول ﷺ كلما ذُكر. ← تطبيق\nالمخرج 5: يتعرّف أن الصلاة على النبي ﷺ أمر من الله تعالى للمؤمنين. ← فهم\nالمخرج 6: يحل أنشطة «أختبر تعلمي» حلًا صحيحًا. ← تقييم\nالمخرج الآخر: يعتز بالانتماء إلى أسرته. ← تقييم\nالمخرج الآخر: ينشد نشيد الدرس ويربط أبياته بمعارفه. ← تطبيق", "التعلم التعاوني، التعلم بالاكتشاف، التعلم المبني على اللعب\nاستراتيجيات أخرى من دليل المعلم: المحاكاة والترديد", "الكتاب، السبورة الذكية، السبورة التقليدية، الأقلام، برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot، أخرى: بطاقات أسماء النسب، الوسائل المتعددة (سمعية - بصرية)، أخرى: بطاقة «ﷺ»", "النسب، القبيلة، قريش، الصلاة على النبي ﷺ، المحبة", "تراجع المعلمة درس المولد بأسئلة: أين وُلد الرسول ﷺ؟ متى وُلد؟ لماذا سُمي العام عام الفيل؟", "1. التهيئة: تطرح المعلمة أسئلة المراجعة، والتلاميذ يجيبون مستحضرين درس المولد (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أتعرّف نسب رسولي ص81: ترسم المعلمة المخطط على السبورة فارغًا وتسأل: ما اسم الرسول ﷺ؟ ما اسم أبيه؟ جده؟ قبيلته؟ وتكتب الإجابات، والتلاميذ يجيبون ويكتب بعضهم على السبورة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. أمه ﷺ: تذكر المعلمة أن أمه آمنة بنت وهب، والتلاميذ يرددون اسم الأم والأب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. أتعاون مع زملائي ص82: توزّع المعلمة بطاقات (محمد ﷺ – عبد الله – عبد المطلب – القرشي) غير مرتبة لتصميم بطاقة تعريفية (تقويم تكويني)، وترتب كل مجموعة البطاقات وتلصقها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أنا ونسبي: تطلب المعلمة من كل تلميذ ذكر اسمه واسم أبيه وجده، والتلاميذ يذكرون أسماءهم الثلاثية (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. أفكر وأطبق ص83: تعرض المعلمة بطاقة «ﷺ» وتطلب ملاحظتها في الكتاب، ثم تقرأ النشاط والبدائل، والتلاميذ يختارون الجواب الصحيح ويضعون حوله دائرة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. أمر من الله: تتلو المعلمة: «إن الله وملائكته يصلون على النبي يا أيها الذين آمنوا صلوا عليه وسلموا تسليمًا» (الأحزاب: 56)، والتلاميذ يرددون الصلاة على النبي ﷺ زمريًا (4 دقائق)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n8. النشيد ص84: تعرض المعلمة النشيد وتطلب الإنشاد وتربط أبياته بنسب الرسول ﷺ (تقويم تكويني)، والتلاميذ ينشدون ويذكرون البيت الذي فيه النسب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. أختبر تعلمي ص85–86: توجه المعلمة حل الأنشطة: والدا الرسول ﷺ وأهمية النسب، والتلاميذ يلونون ويكتبون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. التقويم الختامي: تطرح المعلمة أسئلة التقويم الختامي الثلاثة بالتدرج (معرفة ← تطبيق ← استدلال) وتوجّه كل سؤال إلى المستوى المناسب، ويجيب كل تلميذ عن السؤال الموجّه إليه شفويًا أو كتابيًا في الكتاب (2 دقيقتان)\nالاستراتيجيات: استراتيجيات أخرى من دليل المعلم: المحاكاة والترديد.\n\n11. مسابقة المجموعات: تفتح المعلمة ملف المسابقة على السبورة الذكية، وتختار الدرس وعنوان الحصة وعدد الأسئلة المناسب للوقت، وتدير الأدوار بين المجموعات، وتجيب المجموعة صاحبة الدور خلال الوقت، وتتابع المجموعات مخطط النقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n12. الغلق وخطة الأسبوع: تلخّص المعلمة أبرز ما تعلّموه في جملة، وتوضح المطلوب في خطة الدراسة الأسبوعية، ويردد التلاميذ الخلاصة ويدوّنون المطلوب في دفتر المتابعة (1 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "1) [مستوى المعرفة] ما اسم والد الرسول ﷺ؟\n   الإجابة النموذجية: عبد الله.\n2) [مستوى التطبيق] ما اسم جد الرسول ﷺ؟\n   الإجابة النموذجية: عبد المطلب.\n3) [مستوى الاستدلال] رتّب نسب الرسول ﷺ: (عبد المطلب – محمد – عبد الله).\n   الإجابة النموذجية: محمد بن عبد الله بن عبد المطلب.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم أسماء «محمد، عبد الله، عبد المطلب» على ثلاث بطاقات، ويرتبها مع التلميذ مرددًا «محمد بن عبد الله بن عبد المطلب»، ثم يسأله: ما اسم والد الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة تعريفية للرسول ﷺ تتضمن اسمه واسم أبيه وجده وأمه وقبيلته (قريش)، ثم يقارنونها ببطاقة يعدونها عن أنفسهم.\n\n4) [مستوى المعرفة] ماذا نقول عند ذكر اسم الرسول محمد؟\n   الإجابة النموذجية: صلى الله عليه وسلم.\n5) [مستوى التطبيق] من أمر المؤمنين بالصلاة على النبي ﷺ؟\n   الإجابة النموذجية: الله تعالى.\n6) [مستوى الاستدلال] ذكّر زميلك بالصلاة على النبي ﷺ بعبارة لطيفة.\n   الإجابة النموذجية: مثل: صلِّ على النبي ﷺ يا صديقي.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم أسماء «محمد، عبد الله، عبد المطلب» على ثلاث بطاقات، ويرتبها مع التلميذ مرددًا «محمد بن عبد الله بن عبد المطلب»، ثم يسأله: ما اسم والد الرسول ﷺ؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة تعريفية للرسول ﷺ تتضمن اسمه واسم أبيه وجده وأمه وقبيلته (قريش)، ثم يقارنونها ببطاقة يعدونها عن أنفسهم.", "1) [مستوى المعرفة] ما اسم أم الرسول ﷺ؟\n   الإجابة النموذجية: آمنة بنت وهب.\n2) [مستوى التطبيق] إلى أي قبيلة ينتمي الرسول ﷺ؟\n   الإجابة النموذجية: قريش.\n3) [مستوى الاستدلال] اكتب نسبك بالطريقة نفسها: اس
