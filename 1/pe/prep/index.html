بلطف.\nس3 (مستوى الاستدلال): لماذا تصل الكرة أبعد عندما نمرجح الرجل أكثر؟\nالإجابة: لأن المرجحة الأكبر تعطي الركلة قوة أكبر.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الهدف من محطة التصويب بين القمعين؟\nالإجابة: ركل الكرة بدقة لتمر بين القمعين.\nس2 (مستوى التطبيق): ماذا نستخدم لإيقاف الكرة في المباراة؟\nالإجابة: باطن القدم.\nس3 (مستوى الاستدلال): لماذا لا نستخدم اليدين في مباراة اليوم؟\nالإجابة: لأن المهارة التي نتعلمها هي الركل والإيقاف بالقدم كما في كرة القدم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم كرة ثابتة أمام التلميذ، ويركلانها معًا بمقدمة القدم نحو هدف قريب، ثم يوقفان كرة قادمة ببطء بباطن القدم، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بركل الكرة بدقة نحو مرمى صغير بين قمعين، ثم بقوة نحو هدف بعيد، والتمييز بين الركلتين ودور مرجحة الرجل.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اركل الكرة الثابتة لتصل إلى القمع.\nالإجابة: يركل بمقدمة القدم في اتجاه القمع.\nس2 (مستوى التطبيق): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة وثابتة.\nس3 (مستوى الاستدلال): متى نستخدم ركلة خفيفة ومتى نستخدم ركلة قوية؟\nالإجابة: خفيفة للتمرير القريب والدقة، وقوية للهدف البعيد.\n\nالحصة 2:\nس1 (مستوى المعرفة): اركل الكرة لتدخل في الصندوق المقسم.\nالإجابة: يصوب بدقة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة القمعين ومحطة الصندوق المقسم (أو الإيقاف، الركل لأبعد مسافة).\nس3 (مستوى الاستدلال): كيف شعرت عندما مررت الكرة لزميلك وسجل هدفًا؟\nالإجابة: يعبر عن سعادته بالتعاون مع زميله.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على ركل كرة خفيفة نحو هدف وإيقافها بباطن القدم في مكان آمن (دليل المعلم ص 107-109).\n\nالحصة 2:\nإرشاد لولي الأمر: شارك طفلك مباراة مصغرة بالركل والإيقاف فقط دون استخدام اليدين، وراجعا النقاط الفنية في دليل المعلم ص 107-111.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=14"}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 60-112 (مهارات الوحدتين الثانية والثالثة)", "n": 2, "periods": [{"focus": "قياس أداء الحركات الأساسية (المشي والجري، الوثب والحجل، الثني والمد والمرجحة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي المشي والجري في مسار محدد بالطريقة الصحيحة.\n2. يؤدي الوثب والحجل بهبوط آمن ضمن محطة القياس.\n3. يؤدي حركات الثني والمد والمرجحة عند النداء.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مراتب\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الهبوط الآمن", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم أن حصة اليوم لقياس ما تعلمناه من حركات، ويعرض محطات القياس ويطمئن التلاميذ: نؤدي بهدوء وكل تلميذ يأخذ دوره.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الحركات الأساسية التي ستقاس، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات بينما تتدرب بقية المجموعات ذاتيًا في المحطات الأخرى: محطة 1 مشي على الخط ثم جري بين الأقماع، محطة 2 وثب فوق الحبل وحجل إلى الطوق، محطة 3 أداء ثني ومد ومرجحة بالنداء؛ ويرصد المعلم الأداء في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا في انتظار الدور (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية سريعة (شمس وشمع) لتفريغ التوتر، ويلعب التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتعزيز جميع التلاميذ، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة الصحيحة فوق الحبل؟\nالإجابة: الوثب بالقدمين معًا.\nس2 (مستوى التطبيق): كيف تهبط بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): ما الفرق بين المشي والجري في محطة القياس؟\nالإجابة: في الجري ترتفع القدمان عن الأرض وتزيد السرعة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ محطة واحدة لم يتقنها (الوثب فوق الحبل بالقدمين معًا أو الجري في المسار) ببطء مع عرض نموذج، ثم يطلب منه أداء الوثب مع الهبوط على المشطين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ محطات القياس بتسلسل متصل (جري، ثم وثب، ثم حجل، ثم دحرجة الكرة) في أقل وقت، مع المحافظة على النقاط الفنية لكل حركة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الحجل من القمع إلى الطوق بقدم واحدة.\nالإجابة: يحجل بالقدم نفسها دون لمس الأرض بالأخرى.\nس2 (مستوى التطبيق): عند نداء (مرجحة) ماذا تفعل؟\nالإجابة: أمرجح الذراع أو الرجل أمامًا وخلفًا.\nس3 (مستوى الاستدلال): لماذا نتدرب في المحطات الأخرى بهدوء أثناء القياس؟\nالإجابة: حتى يؤدي كل تلميذ قياسه بتركيز ولا نضيع الوقت.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية (المشي، الجري، الوثب، الحجل) قبل حصة القياس الثانية (دليل المعلم ص 60-84).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=15"}}, {"focus": "قياس أداء مهارات المعالجة والتناول (الدحرجة والالتقاط، الرمي والاستلام، الركل والإيقاف)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي دحرجة الكرة والتقاطها بالطريقة الصحيحة.\n2. يؤدي رمي الكرة بكلتا اليدين واستلامها من زميل.\n3. يؤدي ركل الكرة وإيقافها بباطن القدم.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الدحرجة\n- الرمي والاستلام\n- الركل والإيقاف", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم محطات القياس الثلاث بنموذج سريع ويذكّر بالنقاط الفنية لكل مهارة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة بنموذج المعلم، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 دحرجة الكرة نحو الطوق والتقاط كرة قادمة، محطة 2 رمي الكرة لزميل من أمام الصدر واستلامها (5 مرات)، محطة 3 ركل الكرة بين قمعين وإيقاف كرة قادمة بباطن القدم؛ ويرصد المعلم في الاستمارة، ويؤدي
