 طوق إلى طوق.\nالإجابة: يثب بالقدمين معًا ويهبط داخل الطوق بثني الركبتين.\nس2 (مستوى التطبيق): ما الفرق بين الوثب لأعلى والوثب لأمام؟\nالإجابة: في الوثب لأعلى نرتفع ونهبط في المكان نفسه، وفي الوثب لأمام ننتقل إلى مكان أبعد.\nس3 (مستوى الاستدلال): زميلك يهبط بركبتين مفرودتين، بماذا تنصحه؟\nالإجابة: أنصحه بثني الركبتين عند الهبوط حتى لا يتأذى.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الوثب بالقدمين داخل مربعات مرسومة بالطباشير مع الهبوط الهادئ (دليل المعلم ص 69-72).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}, {"focus": "الحجل والوثب بقدم واحدة في مسارات", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الحجل والفرق بينها وبين الوثب.\n2. يؤدي الحجل بالقدم اليمنى ثم اليسرى في مسار.\n3. يحافظ على اتزانه أثناء الحجل.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال", "المفاهيم": "- الحجل\n- الوثب بقدم واحدة\n- الاتزان\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم مراحل الوثب، ثم يسأل: هل تستطيع القفز على قدم واحدة مثل طائر الفلامنجو؟ ويقدم اسم الحركة (الحجل).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، وثب خفيف، الوقوف على قدم واحدة لثوانٍ بالتبادل، ويقلد التلميذ ويحافظ على توازنه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الحجل: الارتقاء والهبوط على القدم نفسها، الركبة الأخرى مرفوعة، الذراعان للاتزان، ثم تطبيق موجه في المكان ثم لأمام (ص 70-71)، ويحجل التلميذ في المكان ثم لأمام بالقدم اليمنى ثم اليسرى (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 ص 73: مسارات بأطواق مرتبة؛ يجرب التلميذ الحجل في المسار المستقيم ثم المتعرج ويكتشف أي القدمين أقوى لديه، ويستنتج مع المعلم لماذا نحتاج إلى تدريب القدمين معًا، ويجرب التلميذ بالقدمين ويعبر عن اكتشافه (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الفلامنجو): عند النداء يحجل الجميع، وعند الصافرة يثبت كل تلميذ على قدم واحدة، ومن يحافظ على ثباته أطول يفوز، ويلعب التلميذ ويحافظ على اتزانه (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة الساقين والكاحلين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا، والحجل بقدم واحدة.\nس2 (مستوى التطبيق): أين تكون الذراعان أثناء الحجل؟\nالإجابة: جانبًا للمحافظة على الاتزان.\nس3 (مستوى الاستدلال): لماذا نتدرب على الحجل بالقدمين؟\nالإجابة: لتقوية القدمين معًا وعدم الاعتماد على قدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "س1 (مستوى المعرفة): احجل ثلاث مرات بالقدم اليسرى.\nالإجابة: يحجل بالقدم اليسرى دون لمس الأرض بالأخرى.\nس2 (مستوى التطبيق): أي قدميك كانت أقوى في الحجل؟ وكيف عرفت؟\nالإجابة: يذكر القدم ويعلل بأنه حجل بها مسافة أطول دون سقوط.\nس3 (مستوى الاستدلال): أرفع صورة طفل يقفز بقدم واحدة، ما اسم الحركة؟\nالإجابة: الحجل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الحجل بكل قدم 5 مرات مع المحافظة على التوازن (دليل المعلم ص 70-73).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}, {"focus": "محطات الوثب والحجل", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي الوثب والحجل فوق أدوات مختلفة (حبال، حواجز منخفضة، أطواق).\n2. يميز متى يستخدم الوثب ومتى يستخدم الحجل في المحطة.\n3. يتعاون مع مجموعته في محطات الوثب والحجل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- الوثب\n- الحجل\n- المحطات\n- المدى (قريب، بعيد)", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يذكرني بالفرق بين الوثب والحجل؟ ثم يعرض أدوات المحطات ويسأل: كيف نتخطى الحبل؟ وكيف نتخطى الطوق؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ووثب في المكان وحجل بالتبادل، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل محطة مرة واحدة موضحًا الحركة المناسبة: الوثب فوق الحبل، الحجل بين الأقماع، الوثب من المقعد السويدي والهبوط على المرتبة، الوثب بالقدمين داخل الأطواق المتباعدة، ويشاهد التلميذ ويذكر الحركة المناسبة لكل محطة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الوثب والحجل) ص 74: أربع مجموعات بقائد، تؤدي كل مجموعة محطتها دقائق ثم تنتقل بالإشارة، ويسجل القائد من أدى الهبوط الآمن، ويؤدي التلميذ الحركة الصحيحة لكل محطة ويساعد زملاءه (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مسابقة: تؤدي كل مجموعة المسار كاملًا متتابعة، ونقطة للمجموعة التي تنهي دون إسقاط الأدوات، ويتسابق التلميذ بدقة وأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الساقين، ونقاش: أي محطة احتاجت إلى الحجل؟ ويؤدي التلميذ التهدئة ويجيب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة المناسبة لتخطي الحبل؟\nالإجابة: الوثب بالقدمين.\nس2 (مستوى التطبيق): ما الحركة التي أديناها بين الأقماع؟\nالإجابة: الحجل.\nس3 (مستوى الاستدلال): لماذا نهبط على المرتبة بعد الوثب من المقعد؟\nالإجابة: لأن المرتبة تمتص الصدمة وتحمي الركبتين والكاحلين.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة المناسبة لكل منهما.\nالإجابة: الحبل: وثب، الأقماع: حجل (أو المقعد: وثب والهبوط على المرتبة).\nس2 (مستوى التطبيق): كيف نثب داخل أطواق متباعدة؟\nالإجابة: نثني الركبتين ونمرجح الذراعين بقوة لنصل إلى الطوق البعيد.\nس3 (مستوى الاستدلال): قائد المجموعة لاحظ هبوطًا خاطئًا، ماذا يقول لزميله؟\nالإجابة: اثنِ ركبتيك واهبط على المشطين بهدوء.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك محطة بسيطة في المنزل (وسادة للوثب فوقها، خط للحجل) ومارساها بأمان (دليل المعلم ص 74).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}, {"focus": "الوثب والحجل في الألعاب والمسابقات الرياضية", "num": 4, "fields": {"المخرجات التعليمية": "1. يوظف الوثب والحجل في الألعاب والمسابقات.\n2. يطبق قواعد اللعبة والهبوط الآمن أثناء المنافسة.\n3. يعبر عن سعادته عند أداء أنشطة الوثب والحجل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: شريط لاصق", "المفاهيم": "- الوثب\n- الحجل\n- المسابقة\n- الإيقاع\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم محطات الحصة السابقة، ثم يسأل: في أي الألعاب نرى الوثب؟ (كرة السلة، الوثب الطويل) ويعلن مسابقات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: وثب بالحبل، حجل مع تزايد السرعة وتناقصها بالصافرة، ويقلد التلميذ ويغير سرعته بالإشارة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 4 (ألعاب الوثب والحجل) ص 75: لعبة (الكنغر والحجلة): يثب التلاميذ بالقدمين عند نداء (كنغر) ويحجلون عند (حجلة)، ثم لعبة الوثب داخل المربعات المرقمة بالترتيب، ويلعب التلميذ مستجيبًا للنداء بالحركة الصحيحة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. نشاط 5 ص 76: مسابقة تتابع في قطارات: وثب فوق الحبل، حجل حول القمع، وثب داخل الطوق والعودة لتسليم الكرة للزميل، ويتسابق التلميذ مع مجموعته ويسلم الكرة بدقة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: لماذا فازت المجموعة الفائزة؟ ليستنتج التلاميذ أهمية السرعة مع الدقة والهبوط الآمن، ويستنتج التلميذ ويذكر سببًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وإطالة الساقين، وتعبير التلاميذ عن شعورهم، ويؤدي التلميذ التهدئة ويعبر عن شعوره (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ماذا تفعل عند نداء (كنغر)؟\nالإجابة: أثب بالقدمين معًا.\nس2 (مستوى التطبيق): ما الحركة التي أديتها حول القمع في التتابع؟\nالإجابة: الحجل.\nس3 (مستوى الاستدلال): لماذا تخسر المجموعة التي تسقط الحبل؟\nالإجابة: لأنها لم تؤدِّ الوثب بالطريقة الصحيحة فتخالف قواعد المسابقة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر لعبة رياضية يظهر فيها الوثب.\nالإجابة: كرة السلة أو الوثب الطويل أو الكرة الطائرة.\nس2 (مستوى التطبيق): أدِّ وثبًا فوق الحبل ثم حجلًا إلى القمع.\nالإجابة: يؤدي الحركتين بالتتابع الصحيح.\nس3 (مستوى الاستدلال): كيف شعرت في مسابقة اليوم ولماذا؟\nالإجابة: يعبر عن سعادته لأنه تعاون مع مجموعته وأدى الحركات بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على لعبة (الحجلة) التقليدية في المنزل أو الحي، وراجعا مراحل الوثب الثلاث (دليل المعلم ص 75-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة الوثب ومراحلها (الارتقاء، الطيران، الهبوط).\n2. يؤدي الوثب بالقدمين لأعلى ولأمام بهبوط آمن.\n3. يميز بين الوثب لأعلى والوثب لأمام.\n\nالحصة 2:\n1. يتعرف حركة الحجل والفرق بينها وبين الوثب.\n2. يؤدي الحجل بالقدم اليمنى ثم اليسرى في مسار.\n3. يحافظ على اتزانه أثناء الحجل.\n\nالحصة 3:\n1. يؤدي الوثب والحجل فوق أدوات مختلفة (حبال، حواجز منخفضة، أطواق).\n2. يميز متى يستخدم الوثب ومتى يستخدم الحجل في المحطة.\n3. يتعاون مع مجموعته في محطات الوثب والحجل.\n\nالحصة 4:\n1. يوظف الوثب والحجل في الألعاب والمسابقات.\n2. يطبق قواعد اللعبة والهبوط الآمن أثناء المنافسة.\n3. يعبر عن سعادته عند أداء أنشطة الوثب والحجل.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n\nالحصة 3:\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الوثب\n- الارتقاء\n- الطيران\n- الهبوط\n- الفراغ الخاص\n\nالحصة 2:\n- الحجل\n- الوثب بقدم واحدة\n- الاتزان\n- المسار\n\nالحصة 3:\n- الوثب\n- الحجل\n- المحطات\n- المدى (قريب، بعيد)\n\nالحصة 4:\n- الوثب\n- الحجل\n- المسابقة\n- الإيقاع\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة أرنب يقفز ويسأل: كيف يقفز الأرنب؟ ثم يؤدي وثبة ويسأل: على كم قدم ارتقيت وهبطت؟\n\nالحصة 2:\nيراجع المعلم مراحل الوثب، ثم يسأل: هل تستطيع القفز على قدم واحدة مثل طائر الفلامنجو؟ ويقدم اسم الحركة (الحجل).\n\nالحصة 3:\nيسأل المعلم: من يذكرني بالفرق بين الوثب والحجل؟ ثم يعرض أدوات المحطات ويسأل: كيف نتخطى الحبل؟ وكيف نتخطى الطوق؟\n\nالحصة 4:\nيراجع المعلم محطات الحصة السابقة، ثم يسأل: في أي الألعاب نرى الوثب؟ (كرة السلة، الوثب الطويل) ويعلن مسابقات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف، وثب في المكان بالقدمين، ثني ومد الركبتين، ويقلد التلميذ حركات الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الوثب بالعد: (1) ثني الركبتين ومرجحة الذراعين خلفًا، (2) الدفع بالقدمين والذراعان أمامًا عاليًا، (3) الهبوط على المشطين بثني الركبتين، ثم الأداء الكامل (ص 69-70)، ويؤدي التلميذ الوثب بالعد ثم بشكل كامل داخل طوقه (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 72: الوثب لأعلى بأوضاع مختلفة (الذراعان عاليًا، جانبًا)، ثم الوثب لأمام من طوق إلى طوق كالأرنب، ومن يصل آخر طوق بهبوط آمن يرفع يده، ويؤدي التلميذ الوثب بالأوضاع المختلفة ويهبط بثني الركبتين (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يراقب تلميذ وثب زميله ويخبره: هل هبط بهدوء بثني الركبتين؟ ثم يتبادلان، ويراقب التلميذ ويعطي تغذية راجعة لزميله ثم يؤدي (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بإطالة عضلات الساقين مع نموذج المعلم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، وثب خفيف، الوقوف على قدم واحدة لثوانٍ بالتبادل، ويقلد التلميذ ويحافظ على توازنه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الحجل: الارتقاء والهبوط على القدم نفسها، الركبة الأخرى مرفوعة، الذراعان للاتزان، ثم تطبيق موجه في المكان ثم لأمام (ص 70-71)، ويحجل التلميذ في المكان ثم لأمام بالقدم اليمنى ثم اليسرى (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 ص 73: مسارات بأطواق مرتبة؛ يجرب التلميذ الحجل في المسار المستقيم ثم المتعرج ويكتشف أي القدمين أقوى لديه، ويستنتج مع المعلم لماذا نحتاج إلى تدريب القدمين معًا، ويجرب التلميذ بالقدمين ويعبر عن اكتشافه (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (الفلامنجو): عند النداء يحجل الجميع، وعند الصافرة يثبت كل تلميذ على قدم واحدة، ومن يحافظ على ثباته أطول يفوز، ويلعب التلميذ ويحافظ على اتزانه (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة الساقين والكاحلين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري ووثب في المكان وحجل بالتبادل، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل محطة مرة واحدة موضحًا الحركة المناسبة: الوثب فوق الحبل، الحجل بين الأقماع، الوثب من المقعد السويدي والهبوط على المرتبة، الوثب بالقدمين داخل الأطواق المتباعدة، ويشاهد التلميذ ويذكر الحركة المناسبة لكل محطة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الوثب والحجل) ص 74: أربع مجموعات بقائد، تؤدي كل مجموعة محطتها دقائق ثم تنتقل بالإشارة، ويسجل القائد من أدى الهبوط الآمن، ويؤدي التلميذ الحركة الصحيحة لكل محطة ويساعد زملاءه (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مسابقة: تؤدي كل مجموعة المسار كاملًا متتابعة، ونقطة للمجموعة التي تنهي دون إسقاط الأدوات، ويتسابق التلميذ بدقة وأمان (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الساقين، ونقاش: أي محطة احتاجت إلى الحجل؟ ويؤدي التلميذ التهدئة ويجيب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: وثب بالحبل، حجل مع تزايد السرعة وتناقصها بالصافرة، ويقلد التلميذ ويغير سرعته بالإشارة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 4 (ألعاب الوثب والحجل) ص 75: لعبة (الكنغر والحجلة): يثب التلاميذ بالقدمين عند نداء (كنغر) ويحجلون عند (حجلة)، ثم لعبة الوثب داخل المربعات المرقمة بالترتيب، ويلعب التلميذ مستجيبًا للنداء بالحركة الصحيحة (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. نشاط 5 ص 76: مسابقة تتابع في قطارات: وثب فوق الحبل، حجل حول القمع، وثب داخل الطوق والعودة لتسليم الكرة للزميل، ويتسابق التلميذ مع مجموعته ويسلم الكرة بدقة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: لماذا فازت المجموعة الفائزة؟ ليستنتج التلاميذ أهمية السرعة مع الدقة والهبوط الآمن، ويستنتج التلميذ ويذكر سببًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وإطالة الساقين، وتعبير التلاميذ عن شعورهم، ويؤدي التلميذ التهدئة ويعبر عن شعوره (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما مراحل الوثب الثلاث؟\nالإجابة: الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): كيف نهبط بأمان بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): لماذا نمرجح الذراعين قبل الوثب؟\nالإجابة: لتساعدنا على الارتفاع والوصول أبعد.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا، والحجل بقدم واحدة.\nس2 (مستوى التطبيق): أين تكون الذراعان أثناء الحجل؟\nالإجابة: جانبًا للمحافظة على الاتزان.\nس3 (مستوى الاستدلال): لماذا نتدرب على الحجل بالقدمين؟\nالإجابة: لتقوية القدمين معًا وعدم الاعتماد على قدم واحدة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما الحركة المناسبة لتخطي الحبل؟\nالإجابة: الوثب بالقدمين.\nس2 (مستوى التطبيق): ما الحركة التي أديناها بين الأقماع؟\nالإجابة: الحجل.\nس3 (مستوى الاستدلال): لماذا نهبط على المرتبة بعد الوثب من المقعد؟\nالإجابة: لأن المرتبة تمتص الصدمة وتحمي الركبتين والكاحلين.\n\nالحصة 4:\nس1 (مستوى المعرفة): ماذا تفعل عند نداء (كنغر)؟\nالإجابة: أثب بالقدمين معًا.\nس2 (مستوى التطبيق): ما الحركة التي أديتها حول القمع في التتابع؟\nالإجابة: الحجل.\nس3 (مستوى الاستدلال): لماذا تخسر المجموعة التي تسقط الحبل؟\nالإجابة: لأنها لم تؤدِّ الوثب بالطريقة الصحيحة فتخالف قواعد المسابقة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ وثبة لأمام من طوق إلى طوق.\nالإجابة: يثب بالقدمين معًا ويهبط داخل الطوق بثني الركبتين.\nس2 (مستوى التطبيق): ما الفرق بين الوثب لأعلى والوثب لأمام؟\nالإجابة: في الوثب لأعلى نرتفع ونهبط في المكان نفسه، وفي الوثب لأمام ننتقل إلى مكان أبعد.\nس3 (مستوى الاستدلال): زميلك يهبط بركبتين مفرودتين، بماذا تنصحه؟\nالإجابة: أنصحه بثني الركبتين عند الهبوط حتى لا يتأذى.\n\nالحصة 2:\nس1 (مستوى المعرفة): احجل ثلاث مرات بالقدم اليسرى.\nالإجابة: يحجل بالقدم اليسرى دون لمس الأرض بالأخرى.\nس2 (مستوى التطبيق): أي قدميك كانت أقوى في الحجل؟ وكيف عرفت؟\nالإجابة: يذكر القدم ويعلل بأنه حجل بها مسافة أطول دون سقوط.\nس3 (مستوى الاستدلال): أرفع صورة طفل يقفز بقدم واحدة، ما اسم الحركة؟\nالإجابة: الحجل.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة المناسبة لكل منهما.\nالإجابة: الحبل: وثب، الأقماع: حجل (أو المقعد: وثب والهبوط على المرتبة).\nس2 (مستوى التطبيق): كيف نثب داخل أطواق متباعدة؟\nالإجابة: نثني الركبتين ونمرجح الذراعين بقوة لنصل إلى الطوق البعيد.\nس3 (مستوى الاستدلال): قائد المجموعة لاحظ هبوطًا خاطئًا، ماذا يقول لزميله؟\nالإجابة: اثنِ ركبتيك واهبط على المشطين بهدوء.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر لعبة رياضية يظهر فيها الوثب.\nالإجابة: كرة السلة أو الوثب الطويل أو الكرة الطائرة.\nس2 (مستوى التطبيق): أدِّ وثبًا فوق الحبل ثم حجلًا إلى القمع.\nالإجابة: يؤدي الحركتين بالتتابع الصحيح.\nس3 (مستوى الاستدلال): كيف شعرت في مسابقة اليوم ولماذا؟\nالإجابة: يعبر عن سعادته لأنه تعاون مع مجموعته وأدى الحركات بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الوثب بالقدمين داخل مربعات مرسومة بالطباشير مع الهبوط الهادئ (دليل المعلم ص 69-72).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طفلك على الحجل بكل قدم 5 مرات مع المحافظة على التوازن (دليل المعلم ص 70-73).\n\nالحصة 3:\nإرشاد لولي الأمر: ابنِ مع طفلك محطة بسيطة في المنزل (وسادة للوثب فوقها، خط للحجل) ومارساها بأمان (دليل المعلم ص 74).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طفلك على لعبة (الحجلة) التقليدية في المنزل أو الحي، وراجعا مراحل الوثب الثلاث (دليل المعلم ص 75-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 20-23، 36", "n": 2, "periods": [{"focus": "الممارسات الصحية: القوام السليم عند الجلوس والوقوف وحمل الحقيبة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القوام السليم عند الوقوف والجلوس وحمل الحقيبة.\n2. يميز بين الوضع الصحيح والخاطئ من الصور.\n3. يطبق الوقوف والجلوس بقوام سليم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور القوام الصحيح والخاطئ\n- أخرى: حقيبة مدرسية\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- القوام السليم\n- الوقوف المعتدل\n- الجلوس الصحيح\n- حمل الحقيبة على الكتفين", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورتين لطفل يجلس معتدلًا وآخر منحنيًا ويسأل: أيهما يجلس بطريقة صحيحة؟ ولماذا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع التركيز على استقامة الظهر: مشي بكتاب على الرأس، جري خفيف ورأس مرفوع، ويؤدي التلميذ الإحماء محافظًا على الاعتدال (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الوقوف المعتدل والجلوس الصحيح وحمل الحقيبة على الكتفين، ويعرض الصور مع التفكير بصوت عالٍ عن أضرار الوضع الخاطئ (ص 36)، ويقلد التلميذ الأوضاع الصحيحة ويصحح الأوضاع الخاطئة في الصور (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلاميذ المشي بالكتاب على الرأس بظهر منحنٍ ثم بظهر مستقيم ويكتشفون متى يثبت الكتاب، فيستنتجون علاقة القوام بالاتزان، ويجرب التلميذ ويستنتج أن الظهر المستقيم يحفظ الاتزان (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال القوام): يجري التلاميذ وعند الصافرة يثبت كل تلميذ في وضع (وقوف معتدل) أو (جلوس صحيح) حسب النداء، ويفوز الأدق، ويستجيب التلميذ بالوضع الصحيح (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من الرقود مع إطالة الظهر، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نحمل الحقيبة بطريقة صحيحة؟\nالإجابة: على الكتفين معًا وقريبة من الظهر.\nس2 (مستوى التطبيق): ما شكل الظهر عند الجلوس الصحيح؟\nالإجابة: مستقيم ومسنود على ظهر الكرسي.\nس3 (مستوى الاستدلال): ماذا حدث للكتاب عندما انحنى ظهرك؟\nالإجابة: سقط، لأن الاتزان يحتاج إلى قوام مستقيم.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ أمام مرآة أو صورة للقوام السليم، ويصحح وقوفه وجلوسه وحمل الحقيبة على الكتفين معًا، ثم يسأله: كيف نحمل الحقيبة بطريقة صحيحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالمشي حاملين كتابًا على الرأس بقوام مستقيم في مسار قصير، ثم تمييز الوضع الصحيح والخاطئ في صور ينفذها زملاؤهم.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة طفل يحمل الحقيبة على كتف واحد، ما الخطأ؟\nالإجابة: حملها على كتف واحد يميل الجسم، والصحيح على الكتفين.\nس2 (مستوى التطبيق): قف بقوام سليم.\nالإجابة: يقف معتدلًا، الرأس مرفوع، الكتفان للخلف.\nس3 (مستوى الاستدلال): لماذا نهتم بالقوام السليم منذ الصغر؟\nالإجابة: لأن العادات الخاطئة تسبب تقوس الظهر وآلامه مستقبلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تابع جلوس طفلك عند أداء الواجب وحمل الحقيبة على الكتفين، واستعن بصور القوام في دليل المعلم ص 36 (برنامج صحتي ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=9"}}, {"focus": "المهرجان الرياضي التعليمي للحركات الأساسية (المشي والجري والوثب والحجل)", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف المشي والجري والوثب والحجل في أقسام المهرجان.\n2. يطبق الهبوط الآمن وقواعد المحطات أثناء المنافسة.\n3. يشارك بروح الفريق ويتقبل نتيجة مجموعته.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- التتابع\n- الحركات الأساسية\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتحرك بنشاط) ويقسم التلاميذ أربع مجموعات بقادة، ويعرض أقسام المهرجان بالصور ويذكر قواعد الأمان.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء جماعي بنموذج المعلم: مشي، جري، وثب، حجل، ويؤدي التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم المشي (مسار المقعد السويدي والحواجز)، قسم الجري (جري متعرج بين الأقماع ذهابًا وإيابًا)، قسم الوثب (وثب فوق الحبال وداخل الأطواق والهبوط على المرتبة)، قسم الحجل (حجل بالقدمين بالتبادل بين الأقماع)، مع تسجيل نقاط الأداء والنظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم وينتقل بإشارة القائد (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مسابقة ختامية: تتابع مجمع (مشي، جري، وثب، حجل) بين المجموعات، ويتسابق التلميذ بدقة وسرعة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وإعلان النتائج وتكريم المشاركين، ويؤدي التلميذ التهدئة ويهنئ الفائزين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركات الأربع التي أديناها في المهرجان؟\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (مستوى التطبيق): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم الوثب.\nس3 (مستوى الاستدلال): ما القاعدة الأهم عند الوثب على المرتبة؟\nالإجابة: الهبوط بثني الركبتين على المشطين.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ أمام مرآة أو صورة للقوام السليم، ويصحح وقوفه وجلوسه وحمل الحقيبة على الكتفين معًا، ثم يسأله: كيف نحمل الحقيبة بطريقة صحيحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالمشي حاملين كتابًا على الرأس بقوام مستقيم في مسار قصير، ثم تمييز الوضع الصحيح والخاطئ في صور ينفذها زملاؤهم.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر الحركة التي أديتها في قسم الحجل.\nالإجابة: الحجل بالقدم اليمنى ثم اليسرى بين الأقماع.\nس2 (مستوى التطبيق): كيف ساعدك قائد المجموعة اليوم؟\nالإجابة: نظم انتقالنا بين الأقسام وشجعنا.\nس3 (مستوى الاستدلال): مجموعتك لم تفز، ماذا تقول لزملائك؟\nالإجابة: لقد أدينا جيدًا وسنتدرب أكثر، والمهم أننا شاركنا وتعاونّا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا معًا الحجل والوثب في مكان آمن (دليل المعلم ص 60-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القوام ال تقيم يحفظ الاتزان (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال القوام): يجري التلاميذ وعند الصافرة يثبت كل تلميذ في وضع (وقوف معتدل) أو (جلوس صحيح) حسب النداء، ويفوز الأدق، ويستجيب التلميذ بالوضع الصحيح (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من الرقود مع إطالة الظهر، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء جماعي بنموذج المعلم: مشي، جري، وثب، حجل، ويؤدي التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم المشي (مسار المقعد السويدي والحواجز)، قسم الجري (جري متعرج بين الأقماع ذهابًا وإيابًا)، قسم الوثب (وثب فوق الحبال وداخل الأطواق والهبوط على المرتبة)، قسم الحجل (حجل بالقدمين بالتبادل بين الأقماع)، مع تسجيل نقاط الأداء والنظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم وينتقل بإشارة القائد (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مسابقة ختامية: تتابع مجمع (مشي، جري، وثب، حجل) بين المجموعات، ويتسابق التلميذ بدقة وسرعة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وإعلان النتائج وتكريم المشاركين، ويؤدي التلميذ التهدئة ويهنئ الفائزين (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كيف نحمل الحقيبة بطريقة صحيحة؟\nالإجابة: على الكتفين معًا وقريبة من الظهر.\nس2 (مستوى التطبيق): ما شكل الظهر عند الجلوس الصحيح؟\nالإجابة: مستقيم ومسنود على ظهر الكرسي.\nس3 (مستوى الاستدلال): ماذا حدث للكتاب عندما انحنى ظهرك؟\nالإجابة: سقط، لأن الاتزان يحتاج إلى قوام مستقيم.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الحركات الأربع التي أديناها في المهرجان؟\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (مستوى التطبيق): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم الوثب.\nس3 (مستوى الاستدلال): ما القاعدة الأهم عند الوثب على المرتبة؟\nالإجابة: الهبوط بثني الركبتين على المشطين.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ أمام مرآة أو صورة للقوام السليم، ويصحح وقوفه وجلوسه وحمل الحقيبة على الكتفين معًا، ثم يسأله: كيف نحمل الحقيبة بطريقة صحيحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالمشي حاملين كتابًا على الرأس بقوام مستقيم في مسار قصير، ثم تمييز الوضع الصحيح والخاطئ في صور ينفذها زملاؤهم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة طفل يحمل الحقيبة على كتف واحد، ما الخطأ؟\nالإجابة: حملها على كتف واحد يميل الجسم، والصحيح على الكتفين.\nس2 (مستوى التطبيق): قف بقوام سليم.\nالإجابة: يقف معتدلًا، الرأس مرفوع، الكتفان للخلف.\nس3 (مستوى الاستدلال): لماذا نهتم بالقوام السليم منذ الصغر؟\nالإجابة: لأن العادات الخاطئة تسبب تقوس الظهر وآلامه مستقبلًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر الحركة التي أديتها في قسم الحجل.\nالإجابة: الحجل بالقدم اليمنى ثم اليسرى بين الأقماع.\nس2 (مستوى التطبيق): كيف ساعدك قائد المجموعة اليوم؟\nالإجابة: نظم انتقالنا بين الأقسام وشجعنا.\nس3 (مستوى الاستدلال): مجموعتك لم تفز، ماذا تقول لزملائك؟\nالإجابة: لقد أدينا جيدًا وسنتدرب أكثر، والمهم أننا شاركنا وتعاونّا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تابع جلوس طفلك عند أداء الواجب وحمل الحقيبة على الكتفين، واستعن بصور القوام في دليل المعلم ص 36 (برنامج صحتي ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا معًا الحجل والوثب في مكان آمن (دليل المعلم ص 60-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=9"}}, {"title": "المرجحة والمد والثني", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الحادي عشر", "date": "15-19/11/2026", "pages": "دليل المعلم ص 78-84", "n": 2, "periods": [{"focus": "حركات الثني والمد والمرجحة في التمرينات", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركات الثني والمد والمرجحة.\n2. يحدد أجزاء الجسم التي يمكن ثنيها ومدها ومرجحتها.\n3. يؤدي تمرينات للثني والمد والمرجحة من أوضاع مختلفة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- صورة توضيحية", "المفاهيم": "- الثني\n- المد\n- المرجحة\n- الحركات غير الانتقالية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كم جزءًا من جسمك تستطيع ثنيه؟ ومده؟ ومرجحته؟ ويدع التلاميذ يجربون (ص 79)، ثم يعرض صور أرجوحة وذراع تمتد.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم ثني ومد الذراعين والركبتين بالعد، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 80: يطلب المعلم من التلاميذ أن يثنوا ويمدوا ويمرجحوا أجزاء مختلفة من أوضاع (وقوف، جلوس، رقود) ويكتشفوا أي الأجزاء تتحرك أكثر، ثم يصوغ معهم تعريف كل حركة، ويجرب التلميذ الحركات ويعبر عن اكتشافه ثم يكرر التعريف (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يعرض المعلم نماذج: ثني الجذع أمامًا ومده، مرجحة الذراعين أمامًا وخلفًا، مرجحة الرجل جانبًا من الوقوف بمسك الطوق، مع التطبيق الموجه ثم المستقل، ويؤدي التلميذ النماذج بعد المعلم ثم مستقلًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. لعبة (الآلة): يرفع المعلم بطاقة (ثني) أو (مد) أو (مرجحة) ويؤدي التلميذ الحركة بالجزء الذي يناديه، ومن يخطئ يصبح مساعدًا للمعلم، ويستجيب التلميذ بالحركة الصحيحة والجزء الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة بطيئة (مد) مع التنفس، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة التي تقرب الساعد من العضد؟\nالإجابة: الثني.\nس2 (مستوى التطبيق): اذكر جزءًا من الجسم يمكن مرجحته.\nالإجابة: الذراع أو الرجل.\nس3 (مستوى الاستدلال): ما الفرق بين الثني والمد؟\nالإجابة: الثني تقريب جزأين من الجسم، والمد إبعادهما واستقامتهما.\n\n• نشاط علاجي (لمن لم يتقن): يثني المعلم مع التلميذ الذراع ويمدها ببطء أمام مرآة، ثم يمرجحان الذراع والرجل مع العد، ثم يطلب منه أداء حركة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مرجحة للذراعين أمامًا وخلفًا.\nالإجابة: يمرجح الذراعين بانتظام.\nس2 (مستوى التطبيق): من وضع الجلوس، ما الحركة التي تحرك فيها الجذع للأمام نحو القدمين؟\nالإجابة: ثني الجذع.\nس3 (مستوى الاستدلال): هل نستطيع مرجحة الجذع؟ وكيف؟\nالإجابة: نعم، بتبادل ميل الجذع للجانبين من الوقوف والذراعان عاليًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاث حركات (ثني ومد الذراعين، مرجحة الرجل) أمام المرآة (دليل المعلم ص 79-80).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=10"}}, {"focus": "محطات وألعاب الثني والمد والمرجحة", "num": 2, "fields": {"المخرجات التعليمية": "1. يشارك زملاءه أداء حركات الثني والمد والمرجحة في المحطات.\n2. يوظف المرجحة في مهارات بسيطة (مرجحة الذراع لرمي الكرة).\n3. يستمتع بمشاركة زملائه أنشطة الثني والمد والمرجحة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أقماع", "المفاهيم": "- الثني\n- المد\n- المرجحة\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "يرفع المعلم بطاقات الحركات الثلاث للمراجعة السريعة، ثم يسأل: عندما نرمي الكرة، أي حركة نؤديها بالذراع؟ (مرجحة ثم مد).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ثم مرجحات للذراعين والرجلين، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 (محطات الثني والمد والمرجحة) ص 82: محطة الجلوس على المقعد وثني ومد الرجلين، محطة الرقود ومد الذراعين فوق الرأس وثنيهما، محطة مرجحة الذراع لرمي الكرة في الطوق، محطة مرجحة الرجل فوق القمع، مع التبديل، ويؤدي التلميذ حركة المحطة بدقة ويعاون مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 3 (ألعاب) ص 83: لعبة (المرآة) في أزواج: يؤدي تلميذ حركة ثني أو مد أو مرجحة ويقلدها زميله كالمرآة، ثم لعبة النداء على الحركة والجزء، ويلعب التلميذ ويقلد بدقة ويتبادل الأدوار (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كانت الكرة تصل أبعد عند مرجحة الذراع للخلف أكثر؟ ليستنتج التلاميذ علاقة المرجحة بالقوة، ويستنتج التلميذ ويذكر مثالًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بإطالة الظهر والذراعين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة التي نؤديها بالذراع قبل رمي الكرة؟\nالإجابة: المرجحة.\nس2 (مستوى التطبيق): في محطة المقعد، ما الحركتان اللتان أديناهما بالرجلين؟\nالإجابة: الثني والمد.\nس3 (مستوى الاستدلال): كيف تساعدنا المرجحة على رمي الكرة أبعد؟\nالإجابة: تعطي الذراع قوة وسرعة أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يثني المعلم مع التلميذ الذراع ويمدها ببطء أمام مرآة، ثم يمرجحان الذراع والرجل مع العد، ثم يطلب منه أداء حركة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة فيهما.\nالإجابة: محطة الكرة: مرجحة الذراع، محطة المقعد: ثني ومد الرجلين.\nس2 (مستوى التطبيق): في لعبة المرآة، زميلك ثنى جذعه للأمام، ماذا تفعل؟\nالإجابة: أثني جذعي للأمام مثله تمامًا.\nس3 (مستوى الاستدلال): اذكر مهارة رياضية فيها مرجحة.\nالإجابة: رمي الكرة، أو ركل الكرة (مرجحة الرجل)، أو التأرجح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك لعبة (المرآة) بحركات الثني والمد والمرجحة، وراجعا صور المحطات في دليل المعلم ص 82-83.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركات الثني والمد والمرجحة.\n2. يحدد أجزاء الجسم التي يمكن ثنيها ومدها ومرجحتها.\n3. يؤدي تمرينات للثني والمد والمرجحة من أوضاع مختلفة.\n\nالحصة 2:\n1. يشارك زملاءه أداء حركات الثني والمد والمرجحة في المحطات.\n2. يوظف المرجحة في مهارات بسيطة (مرجحة الذراع لرمي الكرة).\n3. يستمتع بمشاركة زملائه أنشطة الثني والمد والمرجحة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الثني\n- المد\n- المرجحة\n- الحركات غير الانتقالية\n\nالحصة 2:\n- الثني\n- المد\n- المرجحة\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كم جزءًا من جسمك تستطيع ثنيه؟ ومده؟ ومرجحته؟ ويدع التلاميذ يجربون (ص 79)، ثم يعرض صور أرجوحة وذراع تمتد.\n\nالحصة 2:\nيرفع المعلم بطاقات الحركات الثلاث للمراجعة السريعة، ثم يسأل: عندما نرمي الكرة، أي حركة نؤديها بالذراع؟ (مرجحة ثم مد).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف ثم ثني ومد الذراعين والركبتين بالعد، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 80: يطلب المعلم من التلاميذ أن يثنوا ويمدوا ويمرجحوا أجزاء مختلفة من أوضاع (وقوف، جلوس، رقود) ويكتشفوا أي الأجزاء تتحرك أكثر، ثم يصوغ معهم تعريف كل حركة، ويجرب التلميذ الحركات ويعبر عن اكتشافه ثم يكرر التعريف (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يعرض المعلم نماذج: ثني الجذع أمامًا ومده، مرجحة الذراعين أمامًا وخلفًا، مرجحة الرجل جانبًا من الوقوف بمسك الطوق، مع التطبيق الموجه ثم المستقل، ويؤدي التلميذ النماذج بعد المعلم ثم مستقلًا (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. لعبة (الآلة): يرفع المعلم بطاقة (ثني) أو (مد) أو (مرجحة) ويؤدي التلميذ الحركة بالجزء الذي يناديه، ومن يخطئ يصبح مساعدًا للمعلم، ويستجيب التلميذ بالحركة الصحيحة والجزء الصحيح (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بإطالة بطيئة (مد) مع التنفس، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري ثم مرجحات للذراعين والرجلين، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 (محطات الثني والمد والمرجحة) ص 82: محطة الجلوس على المقعد وثني ومد الرجلين، محطة الرقود ومد الذراعين فوق الرأس وثنيهما، محطة مرجحة الذراع لرمي الكرة في الطوق، محطة مرجحة الرجل فوق القمع، مع التبديل، ويؤدي التلميذ حركة المحطة بدقة ويعاون مجموعته (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 3 (ألعاب) ص 83: لعبة (المرآة) في أزواج: يؤدي تلميذ حركة ثني أو مد أو مرجحة ويقلدها زميله كالمرآة، ثم لعبة النداء على الحركة والجزء، ويلعب التلميذ ويقلد بدقة ويتبادل الأدوار (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كانت الكرة تصل أبعد عند مرجحة الذراع للخلف أكثر؟ ليستنتج التلاميذ علاقة المرجحة بالقوة، ويستنتج التلميذ ويذكر مثالًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بإطالة الظهر والذراعين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الحركة التي تقرب الساعد من العضد؟\nالإجابة: الثني.\nس2 (مستوى التطبيق): اذكر جزءًا من الجسم يمكن مرجحته.\nالإجابة: الذراع أو الرجل.\nس3 (مستوى الاستدلال): ما الفرق بين الثني والمد؟\nالإجابة: الثني تقريب جزأين من الجسم، والمد إبعادهما واستقامتهما.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الحركة التي نؤديها بالذراع قبل رمي الكرة؟\nالإجابة: المرجحة.\nس2 (مستوى التطبيق): في محطة المقعد، ما الحركتان اللتان أديناهما بالرجلين؟\nالإجابة: الثني والمد.\nس3 (مستوى الاستدلال): كيف تساعدنا المرجحة على رمي الكرة أبعد؟\nالإجابة: تعطي الذراع قوة وسرعة أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يثني المعلم مع التلميذ الذراع ويمدها ببطء أمام مرآة، ثم يمرجحان الذراع والرجل مع العد، ثم يطلب منه أداء حركة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ مرجحة للذراعين أمامًا وخلفًا.\nالإجابة: يمرجح الذراعين بانتظام.\nس2 (مستوى التطبيق): من وضع الجلوس، ما الحركة التي تحرك فيها الجذع للأمام نحو القدمين؟\nالإجابة: ثني الجذع.\nس3 (مستوى الاستدلال): هل نستطيع مرجحة الجذع؟ وكيف؟\nالإجابة: نعم، بتبادل ميل الجذع للجانبين من الوقوف والذراعان عاليًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة فيهما.\nالإجابة: محطة الكرة: مرجحة الذراع، محطة المقعد: ثني ومد الرجلين.\nس2 (مستوى التطبيق): في لعبة المرآة، زميلك ثنى جذعه للأمام، ماذا تفعل؟\nالإجابة: أثني جذعي للأمام مثله تمامًا.\nس3 (مستوى الاستدلال): اذكر مهارة رياضية فيها مرجحة.\nالإجابة: رمي الكرة، أو ركل الكرة (مرجحة الرجل)، أو التأرجح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاث حركات (ثني ومد الذراعين، مرجحة الرجل) أمام المرآة (دليل المعلم ص 79-80).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك لعبة (المرآة) بحركات الثني والمد والمرجحة، وراجعا صور المحطات في دليل المعلم ص 82-83.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=10"}}, {"title": "دحرجة الكرة والتقاطها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 88-95", "n": 2, "periods": [{"focus": "دحرجة الكرة بكلتا اليدين وبيد واحدة والتقاطها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي دحرجة الكرة والتقاطها ونقاطهما الفنية.\n2. يؤدي دحرجة الكرة بكلتا اليدين وبيد واحدة في مسار.\n3. يلتقط الكرة المتدحرجة بثني الركبتين وانتشار الأصابع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صولجانات\n- صورة توضيحية", "المفاهيم": "- الدحرجة\n- الالتقاط\n- التوافق\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يدحرج المعلم كرة نحو تلميذ ويسأل: كيف تتحرك الكرة؟ وكيف أمسكتها؟ ثم يعرض صور الدحرجة والالتقاط في البولينج وكرة القدم.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف مع كرة في اليد، ثني ومد الركبتين حاملًا الكرة، ويقلد التلميذ الإحماء بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الدحرجة: ثني الركبتين وميل الجذع، مرجحة الذراع خلفًا ثم أمامًا ودفع الكرة على الأرض بأطراف الأصابع؛ ثم الالتقاط: القدمان متباعدتان، ثني الركبتين، مد الذراعين أسفل والكفان متواجهتان وسحب الكرة للصدر (ص 89-90)، ويؤدي التلميذ الدحرجة بكلتا اليدين ثم بيد واحدة، ويلتقط الكرة بالطريقة الصحيحة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 91: دحرجة الكرة في مسارات مستقيمة ومتعرجة بين الأقماع نحو هدف (طوق)؛ يجرب التلميذ قوة الدفع ويكتشف متى تخرج الكرة عن المسار ومتى تصل الهدف، ويجرب التلميذ ويستنتج أن الدفع المعتدل وتصويب اليد نحو الهدف يبقيان الكرة في المسار (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 92: في أزواج متقابلين على مسافة 3 أمتار، تبادل الدحرجة والالتقاط مع العد، وزيادة المسافة تدريجيًا، ويتبادل التلميذ مع زميله ويزيد المسافة بعد 5 التقاطات ناجحة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالجلوس والتنفس مع دحرجة الكرة ببطء حول الجسم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف ندحرج الكرة على الأرض؟\nالإجابة: نثني الركبتين ونمرجح الذراع ثم ندفع الكرة بالأصابع على الأرض.\nس2 (مستوى التطبيق): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين أمام الجسم والأصابع منتشرة.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين عند الالتقاط؟\nالإجابة: لننزل إلى مستوى الكرة فنلتقطها بأمان.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.", "التقويم الختامي": "س1 (مستوى المعرفة): دحرج الكرة بيد واحدة لتصل إلى الطوق.\nالإجابة: يدحرج الكرة في اتجاه الطوق بدفع معتدل.\nس2 (مستوى التطبيق): ماذا يحدث لو دفعت الكرة بقوة كبيرة في المسار المتعرج؟\nالإجابة: تخرج عن المسار وتصطدم بالأقماع.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها دحرجة الكرة.\nالإجابة: البولينج أو كرة القدم (تمرير أرضي).", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طفلك دحرجة كرة والتقاطها في المنزل من مسافة 3 أمتار مع ثني الركبتين (دليل المعلم ص 89-92).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=11"}}, {"focus": "منافسات وألعاب دحرجة الكرة والتقاطها", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف دحرجة الكرة والتقاطها في منافسات وألعاب.\n2. يصوّب الكرة المتدحرجة نحو هدف بدقة.\n3. يشعر بالسعادة عند مشاركة زملائه أداء دحرجة الكرة والتقاطها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "- الدحرجة\n- الالتقاط\n- الدقة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم نقاط الدحرجة والالتقاط بسؤال تلميذين لأداء النموذج، ثم يعرض الصولجانات ويسأل: كيف نسقطها بالكرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ودحرجة الكرة أمام الجسم أثناء المشي، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (منافسات دحرجة الكرة) ص 93: في مجموعات متقابلة، كل مجموعة تدحرج الكرة لإسقاط صولجانات المجموعة الأخرى من مسافة 4 أمتار وتلتقط الكرات القادمة، وتحسب النقاط، ويدحرج التلميذ نحو الهدف ويلتقط الكرات القادمة ويعد نقاط مجموعته (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 4 (ألعاب) ص 94: لعبة (الكرة النارية): تلاميذ الدائرة يدحرجون الكرة لمحاولة لمس قدمي من في المنتصف، ومن تلمسه يستبدل، ثم لعبة تمرير الكرة بالدحرجة بين رجلي الزملاء في القطار، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض دون رفع الكرة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا أصابت بعض الكرات الصولجان وأخطأت أخرى؟ ليستنتج التلاميذ أهمية النظر إلى الهدف وتوجيه اليد نحوه، ويستنتج التلميذ ويذكر نصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة والتعبير عن الشعور بعد المنافسة، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نصيب الصولجان بالكرة المتدحرجة؟\nالإجابة: ننظر إلى الهدف ونوجه اليد نحوه عند الدفع.\nس2 (مستوى التطبيق): ما القاعدة في لعبة الكرة النارية؟\nالإجابة: تبقى الكرة على الأرض بالدحرجة ولا ترفع.\nس3 (مستوى الاستدلال): كيف تساعد مجموعتك في المنافسة؟\nالإجابة: أدحرج بدقة وألتقط الكرات القادمة بسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم استخدمنا فيها الدحرجة.\nالإجابة: الكرة النارية أو تمرير الكرة بين الرجلين في القطار.\nس2 (مستوى التطبيق): دحرج الكرة لتسقط الصولجان من مسافة 3 أمتار.\nالإجابة: يدحرج بدقة نحو الصولجان.\nس3 (مستوى الاستدلال): كيف شعرت عندما التقطت كرة صعبة؟\nالإجابة: يعبر عن سعادته وثقته بنفسه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك لعبة إسقاط زجاجات بلاستيكية فارغة بدحرجة الكرة، وشجعه على الالتقاط الصحيح (دليل المعلم ص 93-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=11"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي دحرجة الكرة والتقاطها ونقاطهما الفنية.\n2. يؤدي دحرجة الكرة بكلتا اليدين وبيد واحدة في مسار.\n3. يلتقط الكرة المتدحرجة بثني الركبتين وانتشار الأصابع.\n\nالحصة 2:\n1. يوظف دحرجة الكرة والتقاطها في منافسات وألعاب.\n2. يصوّب الكرة المتدحرجة نحو هدف بدقة.\n3. يشعر بالسعادة عند مشاركة زملائه أداء دحرجة الكرة والتقاطها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صولجانات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الدحرجة\n- الالتقاط\n- التوافق\n- المسار\n\nالحصة 2:\n- الدحرجة\n- الالتقاط\n- الدقة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيدحرج المعلم كرة نحو تلميذ ويسأل: كيف تتحرك الكرة؟ وكيف أمسكتها؟ ثم يعرض صور الدحرجة والالتقاط في البولينج وكرة القدم.\n\nالحصة 2:\nيراجع المعلم نقاط الدحرجة والالتقاط بسؤال تلميذين لأداء النموذج، ثم يعرض الصولجانات ويسأل: كيف نسقطها بالكرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف مع كرة في اليد، ثني ومد الركبتين حاملًا الكرة، ويقلد التلميذ الإحماء بالكرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الدحرجة: ثني الركبتين وميل الجذع، مرجحة الذراع خلفًا ثم أمامًا ودفع الكرة على الأرض بأطراف الأصابع؛ ثم الالتقاط: القدمان متباعدتان، ثني الركبتين، مد الذراعين أسفل والكفان متواجهتان وسحب الكرة للصدر (ص 89-90)، ويؤدي التلميذ الدحرجة بكلتا اليدين ثم بيد واحدة، ويلتقط الكرة بالطريقة الصحيحة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 91: دحرجة الكرة في مسارات مستقيمة ومتعرجة بين الأقماع نحو هدف (طوق)؛ يجرب التلميذ قوة الدفع ويكتشف متى تخرج الكرة عن المسار ومتى تصل الهدف، ويجرب التلميذ ويستنتج أن الدفع المعتدل وتصويب اليد نحو الهدف يبقيان الكرة في المسار (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 92: في أزواج متقابلين على مسافة 3 أمتار، تبادل الدحرجة والالتقاط مع العد، وزيادة المسافة تدريجيًا، ويتبادل التلميذ مع زميله ويزيد المسافة بعد 5 التقاطات ناجحة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالجلوس والتنفس مع دحرجة الكرة ببطء حول الجسم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري ودحرجة الكرة أمام الجسم أثناء المشي، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (منافسات دحرجة الكرة) ص 93: في مجموعات متقابلة، كل مجموعة تدحرج الكرة لإسقاط صولجانات المجموعة الأخرى من مسافة 4 أمتار وتلتقط الكرات القادمة، وتحسب النقاط، ويدحرج التلميذ نحو الهدف ويلتقط الكرات القادمة ويعد نقاط مجموعته (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 4 (ألعاب) ص 94: لعبة (الكرة النارية): تلاميذ الدائرة يدحرجون الكرة لمحاولة لمس قدمي من في المنتصف، ومن تلمسه يستبدل، ثم لعبة تمرير الكرة بالدحرجة بين رجلي الزملاء في القطار، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض دون رفع الكرة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا أصابت بعض الكرات الصولجان وأخطأت أخرى؟ ليستنتج التلاميذ أهمية النظر إلى الهدف وتوجيه اليد نحوه، ويستنتج التلميذ ويذكر نصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة والتعبير عن الشعور بعد المنافسة، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كيف ندحرج الكرة على الأرض؟\nالإجابة: نثني الركبتين ونمرجح الذراع ثم ندفع الكرة بالأصابع على الأرض.\nس2 (مستوى التطبيق): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين أمام الجسم والأصابع منتشرة.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين عند الالتقاط؟\nالإجابة: لننزل إلى مستوى الكرة فنلتقطها بأمان.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف نصيب الصولجان بالكرة المتدحرجة؟\nالإجابة: ننظر إلى الهدف ونوجه اليد نحوه عند الدفع.\nس2 (مستوى التطبيق): ما القاعدة في لعبة الكرة النارية؟\nالإجابة: تبقى الكرة على الأرض بالدحرجة ولا ترفع.\nس3 (مستوى الاستدلال): كيف تساعد مجموعتك في المنافسة؟\nالإجابة: أدحرج بدقة وألتقط الكرات القادمة بسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): دحرج الكرة بيد واحدة لتصل إلى الطوق.\nالإجابة: يدحرج الكرة في اتجاه الطوق بدفع معتدل.\nس2 (مستوى التطبيق): ماذا يحدث لو دفعت الكرة بقوة كبيرة في المسار المتعرج؟\nالإجابة: تخرج عن المسار وتصطدم بالأقماع.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها دحرجة الكرة.\nالإجابة: البولينج أو كرة القدم (تمرير أرضي).\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم استخدمنا فيها الدحرجة.\nالإجابة: الكرة النارية أو تمرير الكرة بين الرجلين في القطار.\nس2 (مستوى التطبيق): دحرج الكرة لتسقط الصولجان من مسافة 3 أمتار.\nالإجابة: يدحرج بدقة نحو الصولجان.\nس3 (مستوى الاستدلال): كيف شعرت عندما التقطت كرة صعبة؟\nالإجابة: يعبر عن سعادته وثقته بنفسه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طفلك دحرجة كرة والتقاطها في المنزل من مسافة 3 أمتار مع ثني الركبتين (دليل المعلم ص 89-92).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك لعبة إسقاط زجاجات بلاستيكية فارغة بدحرجة الكرة، وشجعه على الالتقاط الصحيح (دليل المعلم ص 93-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=11"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 20-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: شرب الماء والغذاء الصحي قبل النشاط وبعده", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية شرب الماء قبل النشاط وبعده.\n2. يميز بين الأطعمة الصحية وغير الصحية للرياضي الصغير.\n3. يقدر أثر الغذاء الصحي في نشاط الجسم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: زجاجات ماء\n- أخرى: بطاقات صور أطعمة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- الماء\n- الغذاء الصحي\n- العرق\n- الطاقة", "التهيئة / التمهيد / التعلم القبلي": "بعد جري قصير يسأل المعلم: بماذا تشعرون؟ (عطش، عرق) ويعرض زجاجة ماء وصور فواكه وحلويات ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم ثم وقفة لشرب الماء بطريقة صحيحة (رشفات صغيرة)، ويؤدي التلميذ الإحماء ويشرب الماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الصور ويفكر بصوت عالٍ: الجسم يفقد الماء بالعرق فنعوضه بالماء لا المشروبات الغازية؛ الفواكه والخضار والحليب تعطي طاقة، والحلويات الكثيرة تضر، ويذكر برنامج (صحتي) ص 23، ويستمع التلميذ ويصنف الصور إلى صحي وغير صحي (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (سلة الصحة): طوقان (صحي، غير صحي)، يجري كل تلميذ ويسحب بطاقة طعام ويضعها في الطوق المناسب، ونقطة لكل تصنيف صحيح، ويجري التلميذ ويصنف البطاقة بسرعة ودقة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة (وجبة رياضي صغير) من البطاقات الصحية وتعرضها، والتلاميذ يتعاون في اختيار البطاقات ويعرض الوجبة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وشرب الماء، ونصيحة اليوم: احمل زجاجة ماء في يوم الحصة، ويؤدي التلميذ التهدئة ويكرر النصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس2 (مستوى التطبيق): اذكر طعامين صحيين.\nالإجابة: التفاح والحليب (أو أي فاكهة أو خضار).\nس3 (مستوى الاستدلال): هل المشروبات الغازية تعوض الماء؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير ولا تروي الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.", "التقويم الختامي": "س1 (مستوى المعرفة): متى نشرب الماء في يوم الرياضة؟\nالإجابة: قبل الحصة وبعدها، وبرشفات صغيرة أثناءها.\nس2 (مستوى التطبيق): أرفع صورة قطعة حلوى كبيرة، في أي طوق نضعها؟\nالإجابة: طوق غير صحي.\nس3 (مستوى الاستدلال): كوّن وجبة فطور صحية للرياضي الصغير.\nالإجابة: مثل: حليب، خبز، بيض أو فاكهة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ًا للنظام والتعاون؟\nالإجابة: لأن المهرجان يعلمنا النظام والتعاون مع المهارة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم الدحرجة وقسم الالتقاط (أو الوثب بالكرة، الجري المتعرج).\nس2 (مستوى التطبيق): ما دور قائد المجموعة؟\nالإجابة: ينظم الدور ويشجع زملاءه وينقلهم بين الأقسام.\nس3 (مستوى الاستدلال): ماذا تقول لزميل غضب لأن مجموعته خسرت؟\nالإجابة: المشاركة أهم من الفوز، وسنتدرب ونفوز في المرة القادمة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وراجعا دحرجة الكرة والتقاطها (دليل المعلم ص 88-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=12"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية شرب الماء قبل النشاط وبعده.\n2. يميز بين الأطعمة الصحية وغير الصحية للرياضي الصغير.\n3. يقدر أثر الغذاء الصحي في نشاط الجسم.\n\nالحصة 2:\n1. يوظف دحرجة الكرة والتقاطها والحركات الأساسية في أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: زجاجات ماء\n- أخرى: بطاقات صور أطعمة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الماء\n- الغذاء الصحي\n- العرق\n- الطاقة\n\nالحصة 2:\n- المهرجان الرياضي ريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس2 (مستوى التطبيق): اذكر طعامين صحيين.\nالإجابة: التفاح والحليب (أو أي فاكهة أو خضار).\nس3 (مستوى الاستدلال): هل المشروبات الغازية تعوض الماء؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير ولا تروي الجسم.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما القسم الذي استخدمنا فيه الصولجانات؟\nالإجابة: قسم الدحرجة.\nس2 (مستوى التطبيق): كيف نلتقط الكرة المتدحرجة في قسم الالتقاط؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس3 (مستوى الاستدلال): لماذا نسجل نقاطًا للنظام والتعاون؟\nالإجابة: لأن المهرجان يعلمنا النظام والتعاون مع المهارة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): متى نشرب الماء في يوم الرياضة؟\nالإجابة: قبل الحصة وبعدها، وبرشفات صغيرة أثناءها.\nس2 (مستوى التطبيق): أرفع صورة قطعة حلوى كبيرة، في أي طوق نضعها؟\nالإجابة: طوق غير صحي.\nس3 (مستوى الاستدلال): كوّن وجبة فطور صحية للرياضي الصغير.\nالإجابة: مثل: حليب، خبز، بيض أو فاكهة.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم الدحرجة وقسم الالتقاط (أو الوثب بالكرة، الجري المتعرج).\nس2 (مستوى التطبيق): ما دور قائد المجموعة؟\nالإجابة: ينظم الدور ويشجع زملاءه وينقلهم بين الأقسام.\nس3 (مستوى الاستدلال): ماذا تقول لزميل غضب لأن مجموعته خسرت؟\nالإجابة: المشاركة أهم من الفوز، وسنتدرب ونفوز في المرة القادمة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز لطفلك زجاجة ماء وفاكهة في يوم الحصة، وناقشا معًا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وراجعا دحرجة الكرة والتقاطها (دليل المعلم ص 88-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=12"}}, {"title": "رمي الكرة واستلامها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 96-105", "n": 2, "periods": [{"focus": "رمي الكرة بكلتا اليدين واستلامها من مستويات مختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة رمي الكرة واستلامها وبعض أنواعها.\n2. يؤدي رمي الكرة بكلتا اليدين من أمام الصدر واستلامها.\n3. يميز مستويات استلام الكرة (عالية، متوسطة، منخفضة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- الرمي\n- الاستلام\n- اللقف\n- المستوى\n- الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الكرة لتلميذ من مستوى الصدر ثم عاليًا ثم منخفضًا ويسأل: كيف تغيرت طريقة استلامك؟ ويعرض صور الرمي في كرة اليد والسلة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري بالكرة، رمي الكرة عاليًا واستلامها في المكان، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بكلتا اليدين من أمام الصدر (قدم متقدمة، ثني الذراعين ثم مدهما نحو الهدف) والاستلام (مد الذراعين نحو الكرة، الأصابع منتشرة، سحب الكرة للصدر، وثني الركبتين للكرات المنخفضة) من دليل المعلم ص 97-100، ويؤدي التلميذ الرمي والاستلام بعد النموذج أمام الحائط ثم مع زميل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 101: رمي الكرة واستلامها من مستويات مختلفة؛ يجرب التلميذ استلام الكرة العالية والمتوسطة والمنخفضة ويكتشف وضع الكفين المناسب لكل مستوى (الإبهامان متقابلان للعالية، الخنصران متقاربان للمنخفضة)، ويجرب التلميذ ويستنتج وضع الكفين لكل مستوى (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 102: في أزواج تبادل الرمي والاستلام من مسافة 3 أمتار مع العد المتواصل، ومن يصل 10 يرفع يده، ويتبادل التلميذ ويعد مع زميله (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالجلوس وتمرير الكرة حول الجسم ببطء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر بمد الذراعين نحو الهدف.\nس2 (مستوى التطبيق): كيف تكون الأصابع عند الاستلام؟\nالإجابة: منتشرة والكفان نحو الكرة.\nس3 (مستوى الاستدلال): ماذا نفعل لاستلام الكرة المنخفضة؟\nالإجابة: نثني الركبتين وننزل الذراعين للأسفل.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (مستوى التطبيق): ما وضع الإبهامين عند استلام الكرة العالية؟\nالإجابة: متقابلان خلف الكرة.\nس3 (مستوى الاستدلال): سمِّ لعبتين فيهما رمي الكرة واستلامها.\nالإجابة: كرة اليد وكرة السلة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طفلك رمي كرة خفيفة واستلامها من مستويات مختلفة لمدة 10 دقائق (دليل المعلم ص 97-102).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=13"}}, {"focus": "محطات ومنافسات رمي الكرة واستلامها", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف رمي الكرة واستلامها في أداء بعض مهارات الألعاب الرياضية.\n2. يرمي الكرة بدقة نحو هدف (طوق، مربع مرقم).\n3. يشارك زملاءه أداء أنشطة متنوعة لرمي الكرة واستلامها بسعادة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: مربعات الأعداد\n- أخرى: سلال بلاستيكية\n- أخرى: حواجز منخفضة\n- أخرى: أقماع", "المفاهيم": "- الرمي\n- الاستلام\n- الدقة\n- التصويب\n- التتابع", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الرمي والاستلام بنموذج تلميذين، ثم يعرض السلال والمربعات المرقمة ويسأل: كيف نصيب الهدف برميتنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: رمي الكرة عاليًا واستلامها مع تصفيقة، ومشي وجري بالكرة، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (محطات رمي الكرة واستلامها) ص 103: محطة الرمي داخل السلة من 3 أمتار، محطة الرمي فوق الحاجز المنخفض واستلام الزميل، محطة الرمي على مربعات الأعداد بالترتيب، محطة الرمي على الحائط والاستلام، مع التبديل وتسجيل النقاط، ويؤدي التلميذ مهمة المحطة بدقة ويعاون مجموعته (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 4 (منافسات) ص 104: مسابقة التتابع في قطارات بالرمي والاستلام مع القائد المقابل، والمجموعة التي تنهي أولًا دون سقوط الكرة تفوز، ويتسابق التلميذ ويستلم ويرمي بسرعة ودقة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا سقطت الكرة من بعض الزملاء؟ ليستنتج التلاميذ أهمية النظر إلى الكرة ومد الذراعين نحوها، ويستنتج التلميذ ويذكر نصيحة لزميله (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نصيب السلة برميتنا؟\nالإجابة: ننظر إلى السلة ونمد الذراعين نحوها عند الرمي.\nس2 (مستوى التطبيق): في أي محطة رمينا الكرة فوق الحاجز؟\nالإجابة: محطة الرمي فوق الحاجز المنخفض واستلام الزميل.\nس3 (مستوى الاستدلال): ماذا نفعل لنستلم الكرة دون أن تسقط؟\nالإجابة: ننظر إلى الكرة ونمد الذراعين نحوها ونسحبها للصدر.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة لتصيب المربع رقم 3.\nالإجابة: يرمي بدقة نحو المربع المحدد.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة السلة ومحطة مربعات الأعداد (أو الحاجز، الحائط).\nس3 (مستوى الاستدلال): كيف تساعد زميلك الذي تسقط منه الكرة كثيرًا؟\nالإجابة: أرمي له الكرة بلطف وأذكره بالنظر إليها ومد ذراعيه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك رمي الكرة في سلة أو طوق من مسافات مختلفة، وشجعه على الاستلام الصحيح (دليل المعلم ص 103-105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة رمي الكرة واستلامها وبعض أنواعها.\n2. يؤدي رمي الكرة بكلتا اليدين من أمام الصدر واستلامها.\n3. يميز مستويات استلام الكرة (عالية، متوسطة، منخفضة).\n\nالحصة 2:\n1. يوظف رمي الكرة واستلامها في أداء بعض مهارات الألعاب الرياضية.\n2. يرمي الكرة بدقة نحو هدف (طوق، مربع مرقم).\n3. يشارك زملاءه أداء أنشطة متنوعة لرمي الكرة واستلامها بسعادة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: مربعات الأعداد\n- أخرى: سلال بلاستيكية\n- أخرى: حواجز منخفضة\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الرمي\n- الاستلام\n- اللقف\n- المستوى\n- الاتجاه\n\nالحصة 2:\n- الرمي\n- الاستلام\n- الدقة\n- التصويب\n- التتابع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم الكرة لتلميذ من مستوى الصدر ثم عاليًا ثم منخفضًا ويسأل: كيف تغيرت طريقة استلامك؟ ويعرض صور الرمي في كرة اليد والسلة.\n\nالحصة 2:\nيراجع المعلم الرمي والاستلام بنموذج تلميذين، ثم يعرض السلال والمربعات المرقمة ويسأل: كيف نصيب الهدف برميتنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري بالكرة، رمي الكرة عاليًا واستلامها في المكان، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بكلتا اليدين من أمام الصدر (قدم متقدمة، ثني الذراعين ثم مدهما نحو الهدف) والاستلام (مد الذراعين نحو الكرة، الأصابع منتشرة، سحب الكرة للصدر، وثني الركبتين للكرات المنخفضة) من دليل المعلم ص 97-100، ويؤدي التلميذ الرمي والاستلام بعد النموذج أمام الحائط ثم مع زميل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 101: رمي الكرة واستلامها من مستويات مختلفة؛ يجرب التلميذ استلام الكرة العالية والمتوسطة والمنخفضة ويكتشف وضع الكفين المناسب لكل مستوى (الإبهامان متقابلان للعالية، الخنصران متقاربان للمنخفضة)، ويجرب التلميذ ويستنتج وضع الكفين لكل مستوى (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 102: في أزواج تبادل الرمي والاستلام من مسافة 3 أمتار مع العد المتواصل، ومن يصل 10 يرفع يده، ويتبادل التلميذ ويعد مع زميله (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالجلوس وتمرير الكرة حول الجسم ببطء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: رمي الكرة عاليًا واستلامها مع تصفيقة، ومشي وجري بالكرة، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3 (محطات رمي الكرة واستلامها) ص 103: محطة الرمي داخل السلة من 3 أمتار، محطة الرمي فوق الحاجز المنخفض واستلام الزميل، محطة الرمي على مربعات الأعداد بالترتيب، محطة الرمي على الحائط والاستلام، مع التبديل وتسجيل النقاط، ويؤدي التلميذ مهمة المحطة بدقة ويعاون مجموعته (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 4 (منافسات) ص 104: مسابقة التتابع في قطارات بالرمي والاستلام مع القائد المقابل، والمجموعة التي تنهي أولًا دون سقوط الكرة تفوز، ويتسابق التلميذ ويستلم ويرمي بسرعة ودقة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا سقطت الكرة من بعض الزملاء؟ ليستنتج التلاميذ أهمية النظر إلى الكرة ومد الذراعين نحوها، ويستنتج التلميذ ويذكر نصيحة لزميله (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر بمد الذراعين نحو الهدف.\nس2 (مستوى التطبيق): كيف تكون الأصابع عند الاستلام؟\nالإجابة: منتشرة والكفان نحو الكرة.\nس3 (مستوى الاستدلال): ماذا نفعل لاستلام الكرة المنخفضة؟\nالإجابة: نثني الركبتين وننزل الذراعين للأسفل.\n\nالحصة 2:\nس1 (مستوى المعرفة): كيف نصيب السلة برميتنا؟\nالإجابة: ننظر إلى السلة ونمد الذراعين نحوها عند الرمي.\nس2 (مستوى التطبيق): في أي محطة رمينا الكرة فوق الحاجز؟\nالإجابة: محطة الرمي فوق الحاجز المنخفض واستلام الزميل.\nس3 (مستوى الاستدلال): ماذا نفعل لنستلم الكرة دون أن تسقط؟\nالإجابة: ننظر إلى الكرة ونمد الذراعين نحوها ونسحبها للصدر.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (مستوى التطبيق): ما وضع الإبهامين عند استلام الكرة العالية؟\nالإجابة: متقابلان خلف الكرة.\nس3 (مستوى الاستدلال): سمِّ لعبتين فيهما رمي الكرة واستلامها.\nالإجابة: كرة اليد وكرة السلة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ارمِ الكرة لتصيب المربع رقم 3.\nالإجابة: يرمي بدقة نحو المربع المحدد.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة السلة ومحطة مربعات الأعداد (أو الحاجز، الحائط).\nس3 (مستوى الاستدلال): كيف تساعد زميلك الذي تسقط منه الكرة كثيرًا؟\nالإجابة: أرمي له الكرة بلطف وأذكره بالنظر إليها ومد ذراعيه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طفلك رمي كرة خفيفة واستلامها من مستويات مختلفة لمدة 10 دقائق (دليل المعلم ص 97-102).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك رمي الكرة في سلة أو طوق من مسافات مختلفة، وشجعه على الاستلام الصحيح (دليل المعلم ص 103-105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=13"}}, {"title": "ركل الكرة وإيقافها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 106-112", "n": 2, "periods": [{"focus": "ركل الكرة بمقدمة القدم وإيقافها بباطن القدم", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ركل الكرة وإيقافها ونقاطهما الفنية.\n2. يؤدي ركل الكرة الثابتة بمقدمة القدم وإيقاف الكرة القادمة بباطن القدم.\n3. يميز بين الركل بقوة والركل بدقة حسب الهدف.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- صورة توضيحية", "المفاهيم": "- الركل\n- الإيقاف\n- مقدمة القدم\n- باطن القدم\n- الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب كرة قدم يركل الكرة ويسأل: بأي جزء من القدم ركل؟ ويترك التلاميذ يجربون ركل كرة ثابتة بلطف.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري حول الكرة، مرجحة الرجلين أمامًا وخلفًا، لمس الكرة بالقدمين بالتبادل، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الركل بالعد: الوقوف بجانب الكرة، مرجحة الرجل الراكلة خلفًا، ركل الكرة بمقدمة القدم مع ثبات القدم المرتكزة بجانبها، ثم نموذج الإيقاف بوضع باطن القدم على الكرة القادمة (ص 107-108)، فتطبيق موجه بكرات مختلفة، ويؤدي التلميذ الركل بالعد ثم كاملًا، ويوقف الكرة القادمة من المعلم بباطن القدم (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 108: ركل الكرة في اتجاهات ومسارات نحو أهداف قريبة وبعيدة؛ يجرب التلميذ قوة الركل ويكتشف أن الهدف القريب يحتاج إلى ركلة خفيفة والبعيد إلى مرجحة أكبر، ويجرب التلميذ ويستنتج علاقة قوة الركل بالمسافة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 109: في أزواج متقابلين على مسافة 4 أمتار، تبادل ركل الكرة وإيقافها بباطن القدم مع العد، ويتبادل التلميذ مع زميله الركل والإيقاف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بإطالة عضلات الفخذين والساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس2 (مستوى التطبيق): كيف نوقف الكرة القادمة؟\nالإجابة: نضع باطن القدم فوق الكرة بلطف.\nس3 (مستوى الاستدلال): لماذا تصل الكرة أبعد عندما نمرجح الرجل أكثر؟\nالإجابة: لأن المرجحة الأكبر تعطي الركلة قوة أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم كرة ثابتة أمام التلميذ، ويركلانها معًا بمقدمة القدم نحو هدف قريب، ثم يوقفان كرة قادمة ببطء بباطن القدم، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بركل الكرة بدقة نحو مرمى صغير بين قمعين، ثم بقوة نحو هدف بعيد، والتمييز بين الركلتين ودور مرجحة الرجل.", "التقويم الختامي": "س1 (مستوى المعرفة): اركل الكرة الثابتة لتصل إلى القمع.\nالإجابة: يركل بمقدمة القدم في اتجاه القمع.\nس2 (مستوى التطبيق): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة وثابتة.\nس3 (مستوى الاستدلال): متى نستخدم ركلة خفيفة ومتى نستخدم ركلة قوية؟\nالإجابة: خفيفة للتمرير القريب والدقة، وقوية للهدف البعيد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على ركل كرة خفيفة نحو هدف وإيقافها بباطن القدم في مكان آمن (دليل المعلم ص 107-109).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=14"}}, {"focus": "محطات ومنافسات ركل الكرة وإيقافها", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف ركل الكرة وإيقافها في أداء بعض مهارات كرة القدم.\n2. يصوّب الكرة بالركل نحو هدف (الصندوق المقسم، بين قمعين).\n3. يشعر بالسعادة عند أداء حركة ركل الكرة وإيقافها مع زملائه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- أخرى: أطواق", "المفاهيم": "- الركل\n- الإيقاف\n- التصويب\n- الدقة\n- ا فة).\nس3 (مستوى الاستدلال): كيف شعرت عندما مررت الكرة لزميلك وسجل هدفًا؟\nالإجابة: يعبر عن سعادته بالتعاون مع زميله.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شارك طفلك مباراة مصغرة بالركل والإيقاف فقط دون استخدام اليدين، وراجعا النقاط الفنية في دليل المعلم ص 107-111.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=14"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة ركل الكرة وإيقافها ونقاطهما الفنية.\n2. يؤدي ركل الكرة الثابتة بمقدمة القدم وإيقاف الكرة القادمة بباطن القدم.\n3. يميز بين الركل بقوة والركل بدقة حسب الهدف.\n\nالحصة 2:\n1. يوظف ركل الكرة وإيقافها في أداء بعض مهارات كرة القدم.\n2. يصوّب الكرة بالركل نحو هدف (الصندوق المقسم، بين قمعين).\n3. يشعر بالسعادة عند أداء حركة ركل الكرة وإيقافها مع زملائه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الركل\n- الإيقاف\n- مقدمة القدم\n- باطن القدم\n- الاتجاه\n\nالحصة 2:\n- الركل\n- الإيقاف\n- التصويب\n- الدقة\n- التمرير", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب كرة قدم يركل الكرة ويسأل: بأي جزء من القدم ركل؟ ويترك التلاميذ يجربون ركل كرة ثابتة بلطف.\n\nالحصة 2:\nيراجع المعلم الركل والإيقاف بنموذج تلميذ، ثم يضع هدفين من الأقماع ويسأل: كيف نسجل هدفًا بالركل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري حول الكرة، مرجحة الرجلين أمامًا وخلفًا، لمس الكرة بالقدمين بالتبادل، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الركل بالعد: الوقوف
