ة": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. ينفذ المعلم نموذج الإحماء أمام التلاميذ: مشي حول الساحة، جري خفيف، تحريك الذراعين والرجلين، مع التفكير بصوت عالٍ عن سبب الإحماء قبل اللعب، ويقلد التلميذ حركات المعلم في الإحماء ويكرر سبب أهميته (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات مصورة لقواعد الحصة (الاصطفاف، الاستماع للصافرة، عدم الدفع، الحذاء الرياضي) ويؤدي نموذج الاستجابة للصافرة، ويستجيب التلميذ للصافرة بالتوقف والنظر للمعلم، ويرتب البطاقات مع زميله (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. ينظم المعلم لعبة (الأرانب في المزرعة) من نماذج التهيئة في دليل المعلم ص 13: الأرانب تجري عند النداء وتعود لبيوتها (الأطواق) بإشارة الصافرة، ويلعب التلميذ ملتزمًا بالقواعد ويعود للطوق عند الصافرة دون تدافع (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقسم التلاميذ مجموعات صغيرة لجمع الأقماع والأطواق وإعادتها لمكانها بالتعاون، والتلاميذ يتعاون أفراد المجموعة في جمع الأدوات وترتيبها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. ينفذ المعلم تمرينات التهدئة (تنفس عميق، إطالة بسيطة) ويلخص قواعد الحصة، ويؤدي التلميذ التهدئة ويعيد ذكر قاعدتين من قواعد الحصة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. يؤدي المعلم الإحماء بنموذج (مشي، جري خفيف، دوران الذراعين) ويطلب تكرار كل حركة بعد مشاهدتها، ويشاهد التلميذ ويقلد ويكرر الحركة ثلاث مرات (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يرفع المعلم بطاقة خضراء فيجري التلاميذ، وصفراء فيمشون، وحمراء فيتوقفون، دون شرح مسبق، ثم يسألهم: ماذا تعني كل بطاقة؟ ويكتشف التلميذ معنى كل لون من خلال التجربة ويصوغه بكلماته (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة (شمس وشمع) من دليل المعلم ص 14: عند النداء (شمس) ينتشر التلاميذ بالجري، وعند (شمع) يتجمدون في وضع ثابت، ويلعب التلميذ ويحافظ على الثبات عند كلمة (شمع) دون سقوط (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. محطات صغيرة بثلاث مجموعات: مجموعة تدحرج الكرة، ومجموعة تمر داخل الطوق، ومجموعة تجري بين الأقماع، ثم التبديل، ويؤدي التلميذ مهمة المحطة ويعاون زميله في إعادة الأداة لمكانها (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس العميق مع نموذج المعلم، ومراجعة أسماء الأدوات بالإشارة إليها، ويؤدي التلميذ التهدئة ويسمي الأداة التي يشير إليها المعلم (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اسم المادة التي ندرسها اليوم؟\nالإجابة: التربية البدنية والصحية.\nس2 (مستوى التطبيق): ماذا نفعل عندما نسمع الصافرة؟\nالإجابة: نتوقف وننظر إلى المعلم ونستمع.\nس3 (مستوى الاستدلال): لماذا نرتدي الحذاء الرياضي في الحصة؟\nالإجابة: ليحمي القدم من الإصابة ويساعدنا على الجري والوثب بأمان.\n\nالحصة 2:\nس1 (مستوى المعرفة): ماذا تفعل عندما أرفع البطاقة الحمراء؟\nالإجابة: أتوقف في مكاني.\nس2 (مستوى التطبيق): ما الفرق بين المشي والجري؟\nالإجابة: الجري أسرع من المشي، وفي الجري ترتفع القدمان عن الأرض لحظة.\nس3 (مستوى الاستدلال): لماذا نتوقف عند كلمة (شمع) دون أن نسقط؟\nالإجابة: لأن ذلك يدربنا على الثبات والانتباه والاستجابة للإشارة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ لعبة «الصافرة» بإشارات بطيئة: يمشي حتى يسمع الصافرة فيتوقف وينظر إلى المعلم، مع زميل يساعده، ثم يسأله: ماذا نفعل عندما نسمع الصافرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة لعبة صغيرة يختار فيها أحدهم أداة (كرة أو طوق أو قمع) ويسميها، ويذكّر زملاءه بقاعدة أمن وسلامة قبل بدئها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أين تمارس حصة التربية البدنية؟\nالإجابة: في ساحة اللعب أو الصالة الرياضية.\nس2 (مستوى التطبيق): اذكر قاعدة واحدة من قواعد الأمن والسلامة في الحصة.\nالإجابة: عدم الدفع أو الجري نحو الزملاء، أو الالتزام بالصافرة.\nس3 (مستوى الاستدلال): ماذا تفعل الأرانب في اللعبة عند سماع الصافرة؟\nالإجابة: تعود مسرعة إلى بيوتها (الأطواق) دون تدافع.\n\nالحصة 2:\nس1 (مستوى المعرفة): سمِّ أداتين رياضيتين استخدمناهما اليوم.\nالإجابة: الكرة والطوق (أو القمع).\nس2 (مستوى التطبيق): ما الحركة المناسبة للبطاقة الصفراء؟\nالإجابة: المشي.\nس3 (مستوى الاستدلال): كيف تساعد مجموعتك في المحطة؟\nالإجابة: أؤدي دوري بسرعة ثم أعيد الأداة لمكانها لزميلي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من إحضار الزي الرياضي والحذاء الرياضي وزجاجة ماء في يوم الحصة، وتصفح معه صفحة قواعد السلامة في الحصة (دليل المعلم ص 12).\n\nالحصة 2:\nإرشاد للتلميذ وولي الأمر: العب لعبة (شمس وشمع) مع أفراد الأسرة في المنزل، وتعرف إلى الأدوات الرياضية من صور دليل المعلم ص 13-14.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=1"}}, {"title": "التشكيلات الرياضية", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 26-34", "n": 2, "periods": [{"focus": "أنواع التشكيلات الرياضية (الانتشار الحر، الصف، القطار)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء تشكيلات الانتشار الحر والصف والقطار.\n2. يميز بين تشكيلي الصف والقطار من الصورة.\n3. يشارك زملاءه في تكوين التشكيل الذي يناديه المعلم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات صور التشكيلات", "المفاهيم": "- التشكيلات الرياضية\n- الانتشار الحر\n- الصف\n- القطار\n- التلميذ الدليل", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نقف في طابور الصباح؟ وكيف يقف الناس في السوق؟ ويربط الإجابات بصور الصف والانتشار الحر في دليل المعلم ص 27-28.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم مشي مع رفع الركبتين، وتحريك الذراعين أمامًا وجانبًا، ويقلد التلميذ الحركات مع المحافظة على المسافة بينه وبين زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم التشكيلات الثلاثة ويؤدي نموذجًا بمساعدة تلميذ (دليل): يمشي الدليل ويقف وسط الخط فيصطف الباقون يمينه ويساره، ثم القطار خلف الدليل، ويراقب التلميذ النموذج ثم يؤدي التشكيل الموجه مع المجموعة باتباع التلميذ الدليل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (اسمع ونفذ): ينتشر التلاميذ بالجري، وعند نداء (صف) أو (قطار) أو (انتشار) تكوّن كل مجموعة التشكيل بأسرع وقت، وتمنح نقطة للأسرع والأدق، ويستمع التلميذ للنداء ويتجمع مع مجموعته في التشكيل الصحيح دون تدافع (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 1 من دليل المعلم ص 30: تشكيل صفين من صف واحد بثبات تلميذ ورجوع التالي خطوتين للخلف بالعد (1، 2)، ويعد التلميذ مع زملائه وينفذ الرجوع للخلف في الموعد الصحيح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالمشي البطيء في القطار ثم الجلوس في دائرة والتنفس العميق مع مراجعة أسماء التشكيلات بالبطاقات، ويؤدي التلميذ التهدئة ويسمي التشكيل الذي في البطاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): كيف يقف التلاميذ في تشكيل الصف؟\nالإجابة: بجانب بعضهم على خط واحد مع مسافة بينهم.\nس3 (مستوى الاستدلال): لماذا نحتاج التلميذ الدليل عند تكوين التشكيل؟\nالإجابة: لأن الجميع يصطفون بالنسبة له فيكون التشكيل منتظمًا وسريعًا.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة فيها أطفال منتشرون بلا نظام، ما اسم هذا التشكيل؟\nالإجابة: الانتشار الحر.\nس2 (مستوى التطبيق): متى نستخدم تشكيل القطار في حياتنا اليومية؟\nالإجابة: عند ركوب الحافلة أو طابور الصباح أو الشراء من الجمعية التعاونية.\nس3 (مستوى الاستدلال): كيف نكوّن تشكيل الصف بسرعة ونظام؟\nالإجابة: يقف الدليل في منتصف الخط ويصطف الباقون يمينه ويساره بهدوء ومسافة متساوية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شاهد مع طفلك صور التشكيلات في دليل المعلم ص 27-29، واطلب منه أن يذكر مثالًا من الحياة اليومية لكل تشكيل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=2"}}, {"focus": "تشكيلا المربع الناقص ضلعًا والدائرة والانتقال بين التشكيلات", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف تشكيلي المربع الناقص ضلعًا والدائرة.\n2. ينتقل مع زملائه من تشكيل إلى آخر بانسيابية.\n3. يقدر أهمية التشكيلات في الالتزام بالنظام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: مقاعد سويدية\n- أخرى: سلة بها صور التشكيلات", "المفاهيم": "- المربع الناقص ضلعًا\n- الدائرة\n- الانتقال بين التشكيلات\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تشكيلات الحصة السابقة بالنداء السريع، ثم يسأل: كيف يقف المصلون حول الكعبة؟ وكيف تسير السيارات حول الدوار؟ ليقدم تشكيل الدائرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم داخل تشكيل الدائرة: مشي ثم جري في محيط الدائرة مع حركات للذراعين، ويؤدي التلميذ الإحماء داخل الدائرة محافظًا على شكلها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الانتقال: من قطارين إلى مربع ناقص ضلعًا بدوران التلميذين الدليلين، ثم تشبيك الأيدي لإغلاق الضلع وتكوين الدائرة (دليل المعلم ص 29-30)، ويشاهد التلميذ ثم ينفذ الانتقال بالتوجيه خطوة خطوة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 (محطات التشكيلات) ص 31: أربع مجموعات، كل محطة بتشكيل ومهارة: قطار يمشي على المقعد السويدي، صفان يتبادلان تمرير الكرة، انتشار حر يثب داخل الأطواق، دائرة تجري متعرجًا بين الأقماع، ثم التبديل، وتؤدي كل مجموعة مهارة محطتها بالتشكيل المحدد وتنتقل عند الإشارة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 (المنافسة مع الزملاء) ص 33: يجري الأول من كل قطار نحو السلة ويرفع صورة التشكيل الذي ناداه المعلم، فتؤديه مجموعته، ونقطة للأدق، ويختار التلميذ الصورة الصحيحة بسرعة وتكوّن مجموعته التشكيل (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة في تشكيل الدائرة بالتنفس والإطالة، ونقاش قصير: أين نستخدم التشكيلات في المدرسة؟ ويؤدي التلميذ التهدئة ويذكر موقفًا يحتاج فيه إلى الوقوف بنظام (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\nس2 (مستوى التطبيق): كيف ننتقل من المربع الناقص ضلعًا إلى الدائرة؟\nالإجابة: يشبك كل تلميذ يده مع زميله لإغلاق الضلع الناقص فتتكون الدائرة.\nس3 (مستوى الاستدلال): لماذا تساعدنا التشكيلات على التعلم بسرعة؟\nالإجابة: لأن كل تلميذ يرى المعلم ويجد مكانًا كافيًا للحركة دون تصادم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة الدائرة، ما اسم التشكيل؟\nالإجابة: الدائرة.\nس2 (مستوى التطبيق): اذكر مهارة أديناها في محطة القطار اليوم.\nالإجابة: المشي على المقعد السويدي والعودة لخلف القطار.\nس3 (مستوى الاستدلال): ماذا يحدث لو لم نلتزم بالتشكيل عند تمرير الكرة؟\nالإجابة: تضيع الكرات ويتصادم التلاميذ ولا يصل التمرير للزميل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك أسماء التشكيلات الخمسة بالصور (دليل المعلم ص 27-30) واطلب منه ترتيب أفراد الأسرة في تشكيل دائرة أو قطار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء تشكيلات الانتشار الحر والصف والقطار.\n2. يميز بين تشكيلي الصف والقطار من الصورة.\n3. يشارك زملاءه في تكوين التشكيل الذي يناديه المعلم.\n\nالحصة 2:\n1. يتعرف تشكيلي المربع الناقص ضلعًا والدائرة.\n2. ينتقل مع زملائه من تشكيل إلى آخر بانسيابية.\n3. يقدر أهمية التشكيلات في الالتزام بالنظام.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات صور التشكيلات\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: مقاعد سويدية\n- أخرى: سلة بها صور التشكيلات", "المفاهيم": "الحصة 1:\n- التشكيلات الرياضية\n- الانتشار الحر\n- الصف\n- القطار\n- التلميذ الدليل\n\nالحصة 2:\n- المربع الناقص ضلعًا\n- الدائرة\n- الانتقال بين التشكيلات\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كيف نقف في طابور الصباح؟ وكيف يقف الناس في السوق؟ ويربط الإجابات بصور الصف والانتشار الحر في دليل المعلم ص 27-28.\n\nالحصة 2:\nيراجع المعلم تشكيلات الحصة السابقة بالنداء السريع، ثم يسأل: كيف يقف المصلون حول الكعبة؟ وكيف تسير السيارات حول الدوار؟ ليقدم تشكيل الدائرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف ثم مشي مع رفع الركبتين، وتحريك الذراعين أمامًا وجانبًا، ويقلد التلميذ الحركات مع المحافظة على المسافة بينه وبين زميله (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم التشكيلات الثلاثة ويؤدي نموذجًا بمساعدة تلميذ (دليل): يمشي الدليل ويقف وسط الخط فيصطف الباقون يمينه ويساره، ثم القطار خلف الدليل، ويراقب التلميذ النموذج ثم يؤدي التشكيل الموجه مع المجموعة باتباع التلميذ الدليل (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (اسمع ونفذ): ينتشر التلاميذ بالجري، وعند نداء (صف) أو (قطار) أو (انتشار) تكوّن كل مجموعة التشكيل بأسرع وقت، وتمنح نقطة للأسرع والأدق، ويستمع التلميذ للنداء ويتجمع مع مجموعته في التشكيل الصحيح دون تدافع (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 1 من دليل المعلم ص 30: تشكيل صفين من صف واحد بثبات تلميذ ورجوع التالي خطوتين للخلف بالعد (1، 2)، ويعد التلميذ مع زملائه وينفذ الرجوع للخلف في الموعد الصحيح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالمشي البطيء في القطار ثم الجلوس في دائرة والتنفس العميق مع مراجعة أسماء التشكيلات بالبطاقات، ويؤدي التلميذ التهدئة ويسمي التشكيل الذي في البطاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم داخل تشكيل الدائرة: مشي ثم جري في محيط الدائرة مع حركات للذراعين، ويؤدي التلميذ الإحماء داخل الدائرة محافظًا على شكلها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الانتقال: من قطارين إلى مربع ناقص ضلعًا بدوران التلميذين الدليلين، ثم تشبيك الأيدي لإغلاق الضلع وتكوين الدائرة (دليل المعلم ص 29-30)، ويشاهد التلميذ ثم ينفذ الانتقال بالتوجيه خطوة خطوة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 (محطات التشكيلات) ص 31: أربع مجموعات، كل محطة بتشكيل ومهارة: قطار يمشي على المقعد السويدي، صفان يتبادلان تمرير الكرة، انتشار حر يثب داخل الأطواق، دائرة تجري متعرجًا بين الأقماع، ثم التبديل، وتؤدي كل مجموعة مهارة محطتها بالتشكيل المحدد وتنتقل عند الإشارة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 (المنافسة مع الزملاء) ص 33: يجري الأول من كل قطار نحو السلة ويرفع صورة التشكيل الذي ناداه المعلم، فتؤديه مجموعته، ونقطة للأدق، ويختار التلميذ الصورة الصحيحة بسرعة وتكوّن مجموعته التشكيل (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة في تشكيل الدائرة بالتنفس والإطالة، ونقاش قصير: أين نستخدم التشكيلات في المدرسة؟ ويؤدي التلميذ التهدئة ويذكر موقفًا يحتاج فيه إلى الوقوف بنظام (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اسم التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): كيف يقف التلاميذ في تشكيل الصف؟\nالإجابة: بجانب بعضهم على خط واحد مع مسافة بينهم.\nس3 (مستوى الاستدلال): لماذا نحتاج التلميذ الدليل عند تكوين التشكيل؟\nالإجابة: لأن الجميع يصطفون بالنسبة له فيكون التشكيل منتظمًا وسريعًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\nس2 (مستوى التطبيق): كيف ننتقل من المربع الناقص ضلعًا إلى الدائرة؟\nالإجابة: يشبك كل تلميذ يده مع زميله لإغلاق الضلع الناقص فتتكون الدائرة.\nس3 (مستوى الاستدلال): لماذا تساعدنا التشكيلات على التعلم بسرعة؟\nالإجابة: لأن كل تلميذ يرى المعلم ويجد مكانًا كافيًا للحركة دون تصادم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة فيها أطفال منتشرون بلا نظام، ما اسم هذا التشكيل؟\nالإجابة: الانتشار الحر.\nس2 (مستوى التطبيق): متى نستخدم تشكيل القطار في حياتنا اليومية؟\nالإجابة: عند ركوب الحافلة أو طابور الصباح أو الشراء من الجمعية التعاونية.\nس3 (مستوى الاستدلال): كيف نكوّن تشكيل الصف بسرعة ونظام؟\nالإجابة: يقف الدليل في منتصف الخط ويصطف الباقون يمينه ويساره بهدوء ومسافة متساوية.\n\nالحصة 2:\nس1 (مستوى المعرفة): أرفع صورة الدائرة، ما اسم التشكيل؟\nالإجابة: الدائرة.\nس2 (مستوى التطبيق): اذكر مهارة أديناها في محطة القطار اليوم.\nالإجابة: المشي على المقعد السويدي والعودة لخلف القطار.\nس3 (مستوى الاستدلال): ماذا يحدث لو لم نلتزم بالتشكيل عند تمرير الكرة؟\nالإجابة: تضيع الكرات ويتصادم التلاميذ ولا يصل التمرير للزميل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شاهد مع طفلك صور التشكيلات في دليل المعلم ص 27-29، واطلب منه أن يذكر مثالًا من الحياة اليومية لكل تشكيل.\n\nالحصة 2:\nإرشاد لولي الأمر: راجع مع طفلك أسماء التشكيلات الخمسة بالصور (دليل المعلم ص 27-30) واطلب منه ترتيب أفراد الأسرة في تشكيل دائرة أو قطار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=2"}}, {"title": "أجزاء الجسم", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 35-42", "n": 2, "periods": [{"focus": "التعرف إلى أجزاء الجسم ومفاصله واستخداماتها", "num": 1, "fields": {"المخرجات التعليمية": "1. يسمي أجزاء الجسم الرئيسة (الرأس، الجذع، الذراعان، الرجلان) ومفاصلها.\n2. يربط كل جزء من الجسم بحركة رياضية يؤديها.\n3. يوظف أجزاء جسمه في أداء حركات بسيطة عند النداء.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: بطاقات صور وأسماء أجزاء الجسم\n- أخرى: كرات\n- أخرى: سلال بلاستيكية\n- صورة توضيحية", "المفاهيم": "- أجزاء الجسم\n- المفاصل\n- الحركة\n- الجانب الأيمن والأيسر", "التهيئة / التمهيد / التعلم القبلي": "يغني المعلم مع التلاميذ أنشودة (رأس، كتف، ركبة، قدم) مع لمس الأجزاء، ثم يسأل: بأي جزء نركل الكرة؟ وبأي جزء نرميها؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: تحريك كل جزء من الجسم على حدة (دوران الرأس ببطء، الكتفين، الذراعين، الركبتين، الكاحلين) مع تسمية الجزء، ويقلد التلميذ ويسمي الجزء الذي يحركه بصوت مسموع (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 37: يجري التلاميذ دقيقة ثم يضع المعلم يده على صدره ويسأل: ماذا تغيّر في جسمك؟ ليكتشفوا سرعة نبض القلب والتنفس وارتفاع الحرارة، ويلاحظ التلميذ التغيرات في جسمه ويعبر عنها (قلبي يدق بسرعة، أتنفس أسرع) (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. نشاط 2 (لمس أجزاء الجسم من الحركة) ص 38: ينتشر التلاميذ بالجري وعند نداء جزء (مرفق، كاحل، كتف) يلمسه التلميذ ويثبت، ومن يخطئ يؤدي حركة بسيطة، ويستجيب التلميذ للنداء بلمس الجزء الصحيح بسرعة ودقة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 4 (محطات أجزاء الجسم) ص 40: محطة الرأس (تنطيط كرة بالرأس عاليًا)، محطة الذراعين (رمي الكرة في السلة)، محطة الرجلين (ركل الكرة للزميل)، مع التبديل، ويؤدي التلميذ مهارة المحطة بالجزء المحدد ويبدل مع مجموعته عند الإشارة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالإطالة لكل جزء مع نموذج المعلم، ومراجعة سريعة ببطاقات الأجزاء، ويؤدي التلميذ الإطالة ويسمي الجزء في البطاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): سمِّ ثلاثة أجزاء من جسمك.\nالإجابة: الرأس، الذراعان، الرجلان (أو الجذع).\nس2 (مستوى التطبيق): ما الجزء الذي نستخدمه لركل الكرة؟\nالإجابة: الرجل (القدم).\nس3 (مستوى الاستدلال): لماذا دق قلبك بسرعة بعد الجري؟\nالإجابة: لأن الجسم يحتاج إلى دم وهواء أكثر عند الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.", "التقويم الختامي": "س1 (مستوى المعرفة): ارفع يدك اليمنى، وأشر إلى مرفقك.\nالإجابة: يرفع اليد اليمنى ويشير إلى المرفق الصحيح.\nس2 (مستوى التطبيق): اذكر مهارة رياضية تؤدى بالرأس.\nالإجابة: ضرب الكرة بالرأس في كرة القدم.\nس3 (مستوى الاستدلال): كيف نحافظ على سلامة أجزاء الجسم أثناء اللعب؟\nالإجابة: بالإحماء قبل اللعب، ولبس الحذاء الرياضي، وعدم الدفع أو التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرّب مع طفلك على تسمية أجزاء الجسم ومفاصله ومعرفة الجانب الأيمن والأيسر مستعينًا بصور دليل المعلم ص 36-37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=3"}}, {"focus": "توظيف أجزاء الجسم في الحركات والمهارات الرياضية والمحافظة على القوام", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز الزي الرياضي والواقي المناسب لكل جزء من الجسم.\n2. يؤدي حركات مركبة توظف أكثر من جزء في الجسم.\n3. يقدر أهمية المحافظة على سلامة الجسم والقوام السليم.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بطاقات صور أجزاء الجسم مقطعة\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حقيبة مدرسية\n- صورة توضيحية", "المفاهيم": "- القوام السليم\n- حمل الحقيبة\n- الجلوس الصحيح\n- الزي الرياضي\n- الواقي", "التهيئة / التمهيد / التعلم القبلي": "يحمل المعلم حقيبة على كتف واحد منحنيًا ويسأل: هل هذه طريقة صحيحة؟ ثم يعرض صورة الطريقة الصحيحة لحمل الحقيبة والجلوس (دليل المعلم ص 36).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع التركيز على القوام: مشي معتدل، جري مع رفع الرأس والنظر للأمام، ثم إطالة للظهر، ويؤدي التلميذ الإحماء محافظًا على استقامة الظهر ورفع الرأس (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم نموذجًا للجلوس الصحيح وحمل الحقيبة على الكتفين، ثم يشرح الزي والواقيات بالصور (واقي الرأس، واقي الصدر، القميص الرياضي)، ويؤدي التلميذ الجلوس وحمل الحقيبة بالطريقة الصحيحة ويطابق الواقي مع الجزء المناسب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (مشاركة الزملاء في أداء الحركات) ص 39: في أزواج، يؤدي تلميذ حركة بجزء معين ويقلدها زميله ثم يبتكران حركة توظف الذراعين والرجلين معًا، ويؤدي التلميذ الحركة مع زميله ويبتكر حركة جديدة بجزأين (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 5 (التنافس مع الزملاء) ص 41: تجمع كل مجموعة قطع صورة الجزء الذي يناديه المعلم وتشكلها بأسرع وقت ثم تؤدي حركته، والتلاميذ يتعاون مع مجموعته في تجميع الصورة وأداء الحركة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة مع نموذج المعلم، ونصيحة اليوم: اجلس معتدلًا واحمل حقيبتك على الكتفين، ويؤدي التلميذ التهدئة ويكرر النصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): على أي كتف نحمل الحقيبة؟\nالإجابة: على الكتفين معًا.\nس2 (مستوى التطبيق): ما الواقي الذي يحمي الرأس في بعض الألعاب؟\nالإجابة: واقي الرأس (الخوذة).\nس3 (مستوى الاستدلال): ما ضرر الجلوس المنحني لفترة طويلة؟\nالإجابة: يسبب تقوس الظهر وألمه ويؤثر في القوام.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر جزأين من الجسم استخدمتهما معًا في حركة اليوم.\nالإجابة: الذراعان والرجلان (مثل الوثب مع رفع الذراعين).\nس2 (مستوى التطبيق): ما الزي المناسب لحصة التربية البدنية؟\nالإجابة: القميص والبنطال الرياضي والحذاء الرياضي.\nس3 (مستوى الاستدلال): كيف تنصح زميلك الذي يجلس منحنيًا؟\nالإجابة: أقول له: اجلس معتدل الظهر وارفع رأسك لتحافظ على قوامك.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راقب طريقة جلوس طفلك وحمله للحقيبة على الكتفين، وناقش معه صور الزي الرياضي والواقيات في دليل المعلم ص 37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يسمي أجزاء الجسم الرئيسة (الرأس، الجذع، الذراعان، الرجلان) ومفاصلها.\n2. يربط كل جزء من الجسم بحركة رياضية يؤديها.\n3. يوظف أجزاء جسمه في أداء حركات بسيطة عند النداء.\n\nالحصة 2:\n1. يميز الزي الرياضي والواقي المناسب لكل جزء من الجسم.\n2. يؤدي حركات مركبة توظف أكثر من جزء في الجسم.\n3. يقدر أهمية المحافظة على سلامة الجسم والقوام السليم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: بطاقات صور وأسماء أجزاء الجسم\n- أخرى: كرات\n- أخرى: سلال بلاستيكية\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: بطاقات صور أجزاء الجسم مقطعة\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حقيبة مدرسية\n- صورة توضيحية", "المفاهيم": "الحصة 1:\n- أجزاء الجسم\n- المفاصل\n- الحركة\n- الجانب الأيمن والأيسر\n\nالحصة 2:\n- القوام السليم\n- حمل الحقيبة\n- الجلوس الصحيح\n- الزي الرياضي\n- الواقي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيغني المعلم مع التلاميذ أنشودة (رأس، كتف، ركبة، قدم) مع لمس الأجزاء، ثم يسأل: بأي جزء نركل الكرة؟ وبأي جزء نرميها؟\n\nالحصة 2:\nيحمل المعلم حقيبة على كتف واحد منحنيًا ويسأل: هل هذه طريقة صحيحة؟ ثم يعرض صورة الطريقة الصحيحة لحمل الحقيبة والجلوس (دليل المعلم ص 36).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: تحريك كل جزء من الجسم على حدة (دوران الرأس ببطء، الكتفين، الذراعين، الركبتين، الكاحلين) مع تسمية الجزء، ويقلد التلميذ ويسمي الجزء الذي يحركه بصوت مسموع (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 37: يجري التلاميذ دقيقة ثم يضع المعلم يده على صدره ويسأل: ماذا تغيّر في جسمك؟ ليكتشفوا سرعة نبض القلب والتنفس وارتفاع الحرارة، ويلاحظ التلميذ التغيرات في جسمه ويعبر عنها (قلبي يدق بسرعة، أتنفس أسرع) (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. نشاط 2 (لمس أجزاء الجسم من الحركة) ص 38: ينتشر التلاميذ بالجري وعند نداء جزء (مرفق، كاحل، كتف) يلمسه التلميذ ويثبت، ومن يخطئ يؤدي حركة بسيطة، ويستجيب التلميذ للنداء بلمس الجزء الصحيح بسرعة ودقة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 4 (محطات أجزاء الجسم) ص 40: محطة الرأس (تنطيط كرة بالرأس عاليًا)، محطة الذراعين (رمي الكرة في السلة)، محطة الرجلين (ركل الكرة للزميل)، مع التبديل، ويؤدي التلميذ مهارة المحطة بالجزء المحدد ويبدل مع مجموعته عند الإشارة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالإطالة لكل جزء مع نموذج المعلم، ومراجعة سريعة ببطاقات الأجزاء، ويؤدي التلميذ الإطالة ويسمي الجزء في البطاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم مع التركيز على القوام: مشي معتدل، جري مع رفع الرأس والنظر للأمام، ثم إطالة للظهر، ويؤدي التلميذ الإحماء محافظًا على استقامة الظهر ورفع الرأس (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم نموذجًا للجلوس الصحيح وحمل الحقيبة على الكتفين، ثم يشرح الزي والواقيات بالصور (واقي الرأس، واقي الصدر، القميص الرياضي)، ويؤدي التلميذ الجلوس وحمل الحقيبة بالطريقة الصحيحة ويطابق الواقي مع الجزء المناسب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (مشاركة الزملاء في أداء الحركات) ص 39: في أزواج، يؤدي تلميذ حركة بجزء معين ويقلدها زميله ثم يبتكران حركة توظف الذراعين والرجلين معًا، ويؤدي التلميذ الحركة مع زميله ويبتكر حركة جديدة بجزأين (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 5 (التنافس مع الزملاء) ص 41: تجمع كل مجموعة قطع صورة الجزء الذي يناديه المعلم وتشكلها بأسرع وقت ثم تؤدي حركته، والتلاميذ يتعاون مع مجموعته في تجميع الصورة وأداء الحركة (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة مع نموذج المعلم، ونصيحة اليوم: اجلس معتدلًا واحمل حقيبتك على الكتفين، ويؤدي التلميذ التهدئة ويكرر النصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): سمِّ ثلاثة أجزاء من جسمك.\nالإجابة: الرأس، الذراعان، الرجلان (أو الجذع).\nس2 (مستوى التطبيق): ما الجزء الذي نستخدمه لركل الكرة؟\nالإجابة: الرجل (القدم).\nس3 (مستوى الاستدلال): لماذا دق قلبك بسرعة بعد الجري؟\nالإجابة: لأن الجسم يحتاج إلى دم وهواء أكثر عند الحركة.\n\nالحصة 2:\nس1 (مستوى المعرفة): على أي كتف نحمل الحقيبة؟\nالإجابة: على الكتفين معًا.\nس2 (مستوى التطبيق): ما الواقي الذي يحمي الرأس في بعض الألعاب؟\nالإجابة: واقي الرأس (الخوذة).\nس3 (مستوى الاستدلال): ما ضرر الجلوس المنحني لفترة طويلة؟\nالإجابة: يسبب تقوس الظهر وألمه ويؤثر في القوام.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارفع يدك اليمنى، وأشر إلى مرفقك.\nالإجابة: يرفع اليد اليمنى ويشير إلى المرفق الصحيح.\nس2 (مستوى التطبيق): اذكر مهارة رياضية تؤدى بالرأس.\nالإجابة: ضرب الكرة بالرأس في كرة القدم.\nس3 (مستوى الاستدلال): كيف نحافظ على سلامة أجزاء الجسم أثناء اللعب؟\nالإجابة: بالإحماء قبل اللعب، ولبس الحذاء الرياضي، وعدم الدفع أو التصادم.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر جزأين من الجسم استخدمتهما معًا في حركة اليوم.\nالإجابة: الذراعان والرجلان (مثل الوثب مع رفع الذراعين).\nس2 (مستوى التطبيق): ما الزي المناسب لحصة التربية البدنية؟\nالإجابة: القميص والبنطال الرياضي والحذاء الرياضي.\nس3 (مستوى الاستدلال): كيف تنصح زميلك الذي يجلس منحنيًا؟\nالإجابة: أقول له: اجلس معتدل الظهر وارفع رأسك لتحافظ على قوامك.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرّب مع طفلك على تسمية أجزاء الجسم ومفاصله ومعرفة الجانب الأيمن والأيسر مستعينًا بصور دليل المعلم ص 36-37.\n\nالحصة 2:\nإرشاد لولي الأمر: راقب طريقة جلوس طفلك وحمله للحقيبة على الكتفين، وناقش معه صور الزي الرياضي والواقيات في دليل المعلم ص 37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=3"}}, {"title": "الأوضاع الأساسية في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 43-51", "n": 2, "periods": [{"focus": "وضعا الوقوف والجثو", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف وضعي الوقوف والجثو ونقاطهما الفنية.\n2. يؤدي وضعي الوقوف والجثو بطريقة صحيحة.\n3. يميز بين الوضعين من الصورة أو النداء.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات صور الأوضاع الأساسية\n- صورة توضيحية", "المفاهيم": "- التمرين\n- الوضع الأساسي\n- الوقوف\n- الجثو\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نقف في طابور الصباح؟ وكيف نجلس على ركبنا عند اللعب على السجاد؟ ثم يعرض صورتي الوقوف والجثو ويذكر أنهما وضعان أساسيان نبدأ منهما التمرينات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم في تشكيل الصف: مشي، جري خفيف، تمرينات للذراعين والرجلين، ويؤدي التلميذ الإحماء في الصف محافظًا على النظام (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وضع الوقوف (العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم) ثم الجثو (الركبتان على المرتبة، الجذع مستقيم) مع التفكير بصوت عالٍ عن النقاط الفنية (ص 44-45)، ويقلد التلميذ الوضع ويصحح زميله من البطاقة المصورة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (حركة، حركة، وضع) ص 47: يجري التلاميذ وعند نداء (وقوف) أو (جثو) يثبت كل تلميذ في الوضع الصحيح داخل أقرب طوق، ويستجيب التلميذ للنداء بالوضع الصحيح ويحافظ على ثباته (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 2 ص 48: في مجموعات، تؤدي كل مجموعة تمرينين بسيطين من الوقوف (رفع الذراعين عاليًا) ومن الجثو (مد الذراعين جانبًا) بالعد الجماعي، ويعد التلميذ مع مجموعته ويؤدي التمرين من الوضع المحدد (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة من وضع الجثو بالتنفس العميق، ومراجعة الوضعين بالبطاقات، ويؤدي التلميذ التهدئة ويسمي الوضع في البطاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الركبتان على الأرض؟\nالإجابة: الجثو.\nس2 (مستوى التطبيق): أين تكون الذراعان في وضع الوقوف الأساسي؟\nالإجابة: بجانب الجسم.\nس3 (مستوى الاستدلال): لماذا نبدأ التمرين من وضع صحيح؟\nالإجابة: ليكون التمرين مفيدًا وآمنًا ويحافظ على القوام.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وضع الوقوف الصحيح.\nالإجابة: يقف معتدلًا، العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم.\nس2 (مستوى التطبيق): ما الفرق بين الوقوف والجثو؟\nالإجابة: في الوقوف نرتكز على القدمين، وفي الجثو نرتكز على الركبتين.\nس3 (مستوى الاستدلال): أرفع صورة طفل يجثو منحني الظهر، ما الخطأ؟\nالإجابة: الظهر منحنٍ، والصحيح أن يكون الجذع مستقيمًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شاهد مع طفلك صور الأوضاع الأساسية في دليل المعلم ص 44-46 واطلب منه أداء وضعي الوقوف والجثو أمامك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=4"}}, {"focus": "وضعا الجلوس التربيع والرقود والتمرين من الأوضاع الأساسية", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف وضعي الجلوس التربيع والرقود.\n2. يؤدي تمرينات بسيطة من الأوضاع الأساسية الأربعة.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات صور الأوضاع الأساسية\n- أخرى: سلال بلاستيكية", "المفاهيم": "- الجلوس التربيع\n- الرقود\n- التمرين\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم وضعي الوقوف والجثو بالنداء، ثم يسأل: كيف نجلس عند قراءة قصة على السجاد؟ وكيف نرقد عند النوم؟ ليقدم الجلوس التربيع والرقود.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف بين الأقماع ثم تمرينات إطالة للرجلين والظهر، ويؤدي التلميذ الإحماء محافظًا على المسافات (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الجلوس التربيع (الرجلان متقاطعتان، الظهر مستقيم) والرقود (الظهر ملاصق للمرتبة، الذراعان بجانب الجسم) ويوضح النقاط الفنية (ص 45-46)، ويقلد التلميذ الوضعين على المرتبة ويتحقق من استقامة ظهره (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الأوضاع الأساسية) ص 49: أربع محطات، في كل محطة بطاقة وضع وتمرين بسيط منه (من الرقود: رفع الرجلين؛ من الجلوس التربيع: لف الجذع)، والتبديل بالإشارة، وتؤدي المجموعة تمرين المحطة بالوضع الصحيح وتنتقل بنظام (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 (المنافسة مع الزملاء) ص 50: يجري الأول من كل قطار ويسحب بطاقة وضع من السلة فتؤديه مجموعته، ونقطة للمجموعة الأدق، ويسحب التلميذ البطاقة ويعود مسرعًا وتؤدي مجموعته الوضع (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من وضع الرقود بالتنفس العميق، وحوار: لماذا نمارس التمرينات يوميًا؟ ويرقد التلميذ ويتنفس بعمق ويذكر فائدة للتمرينات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الرجلان متقاطعتين؟\nالإجابة: الجلوس التربيع.\nس2 (مستوى التطبيق): كيف يكون الظهر في وضع الرقود؟\nالإجابة: ملاصقًا للمرتبة (الأرض).\nس3 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين لأعلى.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.", "التقويم الختامي": "س1 (مستوى المعرفة): سمِّ الأوضاع الأساسية الأربعة التي تعلمتها.\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس2 (مستوى التطبيق): أرفع بطاقة الرقود، أدِّ الوضع الصحيح.\nالإجابة: يرقد على الظهر مستقيمًا والذراعان بجانب الجسم.\nس3 (مستوى الاستدلال): لماذا تحافظ التمرينات على قوامنا؟\nالإجابة: لأنها تقوي عضلات الظهر والبطن فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الأوضاع الأساسية الأربعة (دليل المعلم ص 44-46) ومارسوا معًا تمرينًا بسيطًا من كل وضع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف وضعي الوقوف والجثو ونقاطهما الفنية.\n2. يؤدي وضعي الوقوف والجثو بطريقة صحيحة.\n3. يميز بين الوضعين من الصورة أو النداء.\n\nالحصة 2:\n1. يتعرف وضعي الجلوس التربيع والرقود.\n2. يؤدي تمرينات بسيطة من الأوضاع الأساسية الأربعة.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات صور الأوضاع الأساسية\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات صور الأوضاع الأساسية\n- أخرى: سلال بلاستيكية", "المفاهيم": "الحصة 1:\n- التمرين\n- الوضع الأساسي\n- الوقوف\n- الجثو\n- القوام السليم\n\nالحصة 2:\n- الجلوس التربيع\n- الرقود\n- التمرين\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كيف نقف في طابور الصباح؟ وكيف نجلس على ركبنا عند اللعب على السجاد؟ ثم يعرض صورتي الوقوف والجثو ويذكر أنهما وضعان أساسيان نبدأ منهما التمرينات.\n\nالحصة 2:\nيراجع المعلم وضعي الوقوف والجثو بالنداء، ثم يسأل: كيف نجلس عند قراءة قصة على السجاد؟ وكيف نرقد عند النوم؟ ليقدم الجلوس التربيع والرقود.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم في تشكيل الصف: مشي، جري خفيف، تمرينات للذراعين والرجلين، ويؤدي التلميذ الإحماء في الصف محافظًا على النظام (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وضع الوقوف (العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم) ثم الجثو (الركبتان على المرتبة، الجذع مستقيم) مع التفكير بصوت عالٍ عن النقاط الفنية (ص 44-45)، ويقلد التلميذ الوضع ويصحح زميله من البطاقة المصورة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (حركة، حركة، وضع) ص 47: يجري التلاميذ وعند نداء (وقوف) أو (جثو) يثبت كل تلميذ في الوضع الصحيح داخل أقرب طوق، ويستجيب التلميذ للنداء بالوضع الصحيح ويحافظ على ثباته (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 2 ص 48: في مجموعات، تؤدي كل مجموعة تمرينين بسيطين من الوقوف (رفع الذراعين عاليًا) ومن الجثو (مد الذراعين جانبًا) بالعد الجماعي، ويعد التلميذ مع مجموعته ويؤدي التمرين من الوضع المحدد (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة من وضع الجثو بالتنفس العميق، ومراجعة الوضعين بالبطاقات، ويؤدي التلميذ التهدئة ويسمي الوضع في البطاقة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف بين الأقماع ثم تمرينات إطالة للرجلين والظهر، ويؤدي التلميذ الإحماء محافظًا على المسافات (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الجلوس التربيع (الرجلان متقاطعتان، الظهر مستقيم) والرقود (الظهر ملاصق للمرتبة، الذراعان بجانب الجسم) ويوضح النقاط الفنية (ص 45-46)، ويقلد التلميذ الوضعين على المرتبة ويتحقق من استقامة ظهره (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الأوضاع الأساسية) ص 49: أربع محطات، في كل محطة بطاقة وضع وتمرين بسيط منه (من الرقود: رفع الرجلين؛ من الجلوس التربيع: لف الجذع)، والتبديل بالإشارة، وتؤدي المجموعة تمرين المحطة بالوضع الصحيح وتنتقل بنظام (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 (المنافسة مع الزملاء) ص 50: يجري الأول من كل قطار ويسحب بطاقة وضع من السلة فتؤديه مجموعته، ونقطة للمجموعة الأدق، ويسحب التلميذ البطاقة ويعود مسرعًا وتؤدي مجموعته الوضع (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة من وضع الرقود بالتنفس العميق، وحوار: لماذا نمارس التمرينات يوميًا؟ ويرقد التلميذ ويتنفس بعمق ويذكر فائدة للتمرينات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الركبتان على الأرض؟\nالإجابة: الجثو.\nس2 (مستوى التطبيق): أين تكون الذراعان في وضع الوقوف الأساسي؟\nالإجابة: بجانب الجسم.\nس3 (مستوى الاستدلال): لماذا نبدأ التمرين من وضع صحيح؟\nالإجابة: ليكون التمرين مفيدًا وآمنًا ويحافظ على القوام.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الرجلان متقاطعتين؟\nالإجابة: الجلوس التربيع.\nس2 (مستوى التطبيق): كيف يكون الظهر في وضع الرقود؟\nالإجابة: ملاصقًا للمرتبة (الأرض).\nس3 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين لأعلى.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ وضع الوقوف الصحيح.\nالإجابة: يقف معتدلًا، العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم.\nس2 (مستوى التطبيق): ما الفرق بين الوقوف والجثو؟\nالإجابة: في الوقوف نرتكز على القدمين، وفي الجثو نرتكز على الركبتين.\nس3 (مستوى الاستدلال): أرفع صورة طفل يجثو منحني الظهر، ما الخطأ؟\nالإجابة: الظهر منحنٍ، والصحيح أن يكون الجذع مستقيمًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): سمِّ الأوضاع الأساسية الأربعة التي تعلمتها.\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس2 (مستوى التطبيق): أرفع بطاقة الرقود، أدِّ الوضع الصحيح.\nالإجابة: يرقد على الظهر مستقيمًا والذراعان بجانب الجسم.\nس3 (مستوى الاستدلال): لماذا تحافظ التمرينات على قوامنا؟\nالإجابة: لأنها تقوي عضلات الظهر والبطن فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شاهد مع طفلك صور الأوضاع الأساسية في دليل المعلم ص 44-46 واطلب منه أداء وضعي الوقوف والجثو أمامك.\n\nالحصة 2:\nإرشاد لولي الأمر: راجع مع طفلك الأوضاع الأساسية الأربعة (دليل المعلم ص 44-46) ومارسوا معًا تمرينًا بسيطًا من كل وضع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=4"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 20-23 (المهرجانات، صحتي)", "n": 2, "periods": [{"focus": "الممارسات الصحية: النظافة الشخصية والزي الرياضي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر ممارسات النظافة الشخصية قبل الحصة وبعدها (غسل اليدين، تغيير الملابس).\n2. يطبق خطوات غسل اليدين الصحيحة.\n3. يقدر أهمية النظافة في الوقاية من الأمراض.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: صابون وماء\n- أخرى: بطاقات مصورة لخطوات غسل اليدين\n- أخرى: أطواق", "المفاهيم": "- النظافة الشخصية\n- غسل اليدين\n- الزي الرياضي\n- الوقاية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ليدين متسختين بعد اللعب ويسأل: ماذا نفعل بعد اللعب في الساحة؟ ولماذا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء خفيف بنموذج المعلم: مشي وجري بين الأطواق وتحريك الذراعين، ويؤدي التلميذ الإحماء بنشاط (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات خطوات غسل اليدين (بلل، صابون، فرك 20 ثانية، شطف، تجفيف) ويؤدي النموذج بالتفكير بصوت عالٍ، ثم يناقش الزي الرياضي النظيف وتغييره بعد الحصة، ويقلد التلميذ خطوات غسل اليدين بالتمثيل ويرتب البطاقات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الجرثومة والصابون): تلميذ جرثومة يطارد الزملاء، ومن يُلمس يثبت حتى يلمسه تلميذ (الصابون) فيعود للعب، ويلعب التلميذ ويعبر عن دور الصابون في التخلص من الجراثيم (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات صغيرة، ترتب كل مجموعة بطاقات خطوات غسل اليدين بالترتيب الصحيح وتعرضها، ويرتب التلميذ البطاقات مع مجموعته ويشرح خطوة واحدة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس، ثم الذهاب بنظام لغسل اليدين تطبيقًا عمليًا، ويغسل التلميذ يديه بالخطوات الصحيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى نغسل أيدينا في يوم الحصة؟\nالإجابة: بعد اللعب وقبل الأكل.\nس2 (مستوى التطبيق): كم ثانية نفرك أيدينا بالصابون؟\nالإجابة: نحو 20 ثانية.\nس3 (مستوى الاستدلال): لماذا نغير ملابس الرياضة بعد الحصة؟\nالإجابة: لأنها تمتلئ بالعرق وقد تسبب الأمراض والرائحة غير المحببة.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر خطوتين من خطوات غسل اليدين.\nالإجابة: البلل بالماء ثم الفرك بالصابون (أو الشطف والتجفيف).\nس2 (مستوى التطبيق): ما دور الصابون في لعبة اليوم؟\nالإجابة: يحرر الزملاء الذين لمستهم الجرثومة، أي يقضي على الجراثيم.\nس3 (مستوى الاستدلال): كيف تحافظ على نظافة زيّك الرياضي؟\nالإجابة: أغسله بعد كل حصة وأحتفظ به في كيس نظيف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تابع غسل يدي طفلك بعد اللعب وقبل الطعام بالخطوات الخمس، وجهزا الزي الرياضي النظيف للحصة القادمة (برنامج صحتي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=5"}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (التشكيلات، أجزاء الجسم، الأوضاع الأساسية)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي التشكيلات والأوضاع الأساسية ضمن أقسام المهرجان.\n2. يوظف أجزاء جسمه في تمرينات المحطات.\n3. يشارك مجموعته بروح الفريق والنظام في المهرجان.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات والأوضاع\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- المحطات\n- قائد المجموعة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم عن مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء محافظات عمانية مع قائد لكل مجموعة، ويشرح أقسام المهرجان بالصور.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء جماعي في تشكيل الدائرة بنموذج المعلم، ويؤدي التلميذ الإحماء في الدائرة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. المهرجان بأربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم التشكيلات (تكوين التشكيل بالنداء)، قسم أجزاء الجسم (محطات الرأس والذراعين والرجلين بالكرة)، قسم الأوضاع الأساسية (تمرين من كل وضع بالبطاقة)، قسم جمباز الموانع المبسط (وثب داخل الأطواق ودحرجة على المرتبة)، مع تسجيل نقاط النظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم بقيادة القائد وينتقل بنظام عند الإشارة (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مسابقة ختامية سريعة: أسرع مجموعة تكوّن تشكيل الدائرة ثم تؤدي وضع الجثو، ويتسابق التلميذ مع مجموعته بدقة ونظام (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم جميع المشاركين وإعلان الترتيب بروح رياضية، ويؤدي التلميذ التهدئة ويصفق لجميع المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم مجموعتك وما اسم قائدها؟\nالإجابة: يذكر اسم المحافظة والقائد.\nس2 (مستوى التطبيق): ما الأوضاع التي أديتها في قسم الأوضاع؟\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس3 (مستوى الاستدلال): لماذا تحصل المجموعة على نقاط للنظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان مثل الأداء.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم التشكيلات وقسم أجزاء الجسم (أو الأوضاع، الموانع).\nس2 (مستوى التطبيق): ما الجزء الذي استخدمته في تنطيط الكرة بالرأس؟\nالإجابة: الرأس.\nس3 (مستوى الاستدلال): كيف تشعر عندما تفوز مجموعة أخرى؟\nالإجابة: أصفق لها وأهنئها لأن المشاركة أهم من الفوز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان ومجموعته، وشجعه على أداء تمرينين من الأوضاع الأساسية في المنزل (دليل المعلم ص 47-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر ممارسات النظافة الشخصية قبل الحصة وبعدها (غسل اليدين، تغيير الملابس).\n2. يطبق خطوات غسل اليدين الصحيحة.\n3. يقدر أهمية النظافة في الوقاية من الأمراض.\n\nالحصة 2:\n1. يؤدي التشكيلات والأوضاع الأساسية ضمن أقسام المهرجان.\n2. يوظف أجزاء جسمه في تمرينات المحطات.\n3. يشارك مجموعته بروح الفريق والنظام في المهرجان.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: صابون وماء\n- أخرى: بطاقات مصورة لخطوات غسل اليدين\n- أخرى: أطواق\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات والأوضاع\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- النظافة الشخصية\n- غسل اليدين\n- الزي الرياضي\n- الوقاية\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- المحطات\n- قائد المجموعة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة ليدين متسختين بعد اللعب ويسأل: ماذا نفعل بعد اللعب في الساحة؟ ولماذا؟\n\nالحصة 2:\nيعلن المعلم عن مهرجان التمرينات ويقسم التلاميذ أربع مجموعات بأسماء محافظات عمانية مع قائد لكل مجموعة، ويشرح أقسام المهرجان بالصور.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء خفيف بنموذج المعلم: مشي وجري بين الأطواق وتحريك الذراعين، ويؤدي التلميذ الإحماء بنشاط (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات خطوات غسل اليدين (بلل، صابون، فرك 20 ثانية، شطف، تجفيف) ويؤدي النموذج بالتفكير بصوت عالٍ، ثم يناقش الزي الرياضي النظيف وتغييره بعد الحصة، ويقلد التلميذ خطوات غسل اليدين بالتمثيل ويرتب البطاقات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الجرثومة والصابون): تلميذ جرثومة يطارد الزملاء، ومن يُلمس يثبت حتى يلمسه تلميذ (الصابون) فيعود للعب، ويلعب التلميذ ويعبر عن دور الصابون في التخلص من الجراثيم (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات صغيرة، ترتب كل مجموعة بطاقات خطوات غسل اليدين بالترتيب الصحيح وتعرضها، ويرتب التلميذ البطاقات مع مجموعته ويشرح خطوة واحدة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس، ثم الذهاب بنظام لغسل اليدين تطبيقًا عمليًا، ويغسل التلميذ يديه بالخطوات الصحيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء جماعي في تشكيل الدائرة بنموذج المعلم، ويؤدي التلميذ الإحماء في الدائرة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. المهرجان بأربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم التشكيلات (تكوين التشكيل بالنداء)، قسم أجزاء الجسم (محطات الرأس والذراعين والرجلين بالكرة)، قسم الأوضاع الأساسية (تمرين من كل وضع بالبطاقة)، قسم جمباز الموانع المبسط (وثب داخل الأطواق ودحرجة على المرتبة)، مع تسجيل نقاط النظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم بقيادة القائد وينتقل بنظام عند الإشارة (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مسابقة ختامية سريعة: أسرع مجموعة تكوّن تشكيل الدائرة ثم تؤدي وضع الجثو، ويتسابق التلميذ مع مجموعته بدقة ونظام (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتكريم جميع المشاركين وإعلان الترتيب بروح رياضية، ويؤدي التلميذ التهدئة ويصفق لجميع المجموعات (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): متى نغسل أيدينا في يوم الحصة؟\nالإجابة: بعد اللعب وقبل الأكل.\nس2 (مستوى التطبيق): كم ثانية نفرك أيدينا بالصابون؟\nالإجابة: نحو 20 ثانية.\nس3 (مستوى الاستدلال): لماذا نغير ملابس الرياضة بعد الحصة؟\nالإجابة: لأنها تمتلئ بالعرق وقد تسبب الأمراض والرائحة غير المحببة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما اسم مجموعتك وما اسم قائدها؟\nالإجابة: يذكر اسم المحافظة والقائد.\nس2 (مستوى التطبيق): ما الأوضاع التي أديتها في قسم الأوضاع؟\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس3 (مستوى الاستدلال): لماذا تحصل المجموعة على نقاط للنظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان مثل الأداء.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر خطوتين من خطوات غسل اليدين.\nالإجابة: البلل بالماء ثم الفرك بالصابون (أو الشطف والتجفيف).\nس2 (مستوى التطبيق): ما دور الصابون في لعبة اليوم؟\nالإجابة: يحرر الزملاء الذين لمستهم الجرثومة، أي يقضي على الجراثيم.\nس3 (مستوى الاستدلال): كيف تحافظ على نظافة زيّك الرياضي؟\nالإجابة: أغسله بعد كل حصة وأحتفظ به في كيس نظيف.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم التشكيلات وقسم أجزاء الجسم (أو الأوضاع، الموانع).\nس2 (مستوى التطبيق): ما الجزء الذي استخدمته في تنطيط الكرة بالرأس؟\nالإجابة: الرأس.\nس3 (مستوى الاستدلال): كيف تشعر عندما تفوز مجموعة أخرى؟\nالإجابة: أصفق لها وأهنئها لأن المشاركة أهم من الفوز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تابع غسل يدي طفلك بعد اللعب وقبل الطعام بالخطوات الخمس، وجهزا الزي الرياضي النظيف للحصة القادمة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان ومجموعته، وشجعه على أداء تمرينين من الأوضاع الأساسية في المنزل (دليل المعلم ص 47-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=5"}}, {"title": "التمثيل الحركي", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 52-56", "n": 2, "periods": [{"focus": "التمرينات التمثيلية (تقليد حركات الطبيعة والحيوانات)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات التمثيلية وأمثلة عليها.\n2. يؤدي تمرينات تمثيلية لحركات الطبيعة والحيوانات مع صوت المعلم.\n3. يبتكر حركة تمثيلية جديدة بأجزاء جسمه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور حيوانات وظواهر طبيعية\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- التمرين التمثيلي\n- التقليد\n- تمايل الأشجار\n- طيران العصافير", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أشجار تتمايل بالريح وصورة عصفور يطير ويسأل: كيف نقلد هذه الحركة بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء تمثيلي بنموذج المعلم: المشي كالجندي، الجري كالحصان، القفز كالضفدع، ويقلد التلميذ حركات الإحماء التمثيلية (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ثم يؤدي نموذج الحركة (تمايل الأشجار: وقوف، الذراعان عاليًا، تبادل ميل الجذع للجانبين؛ طيران العصافير: الجري مع تحريك الذراعين جانبًا) من دليل المعلم ص 53، ويؤدي التلاميذ مع صوته، ويؤدي التلميذ التمرين التمثيلي مع إيقاع صوت المعلم (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (ماذا أمثل؟): يرفع المعلم بطاقة حيوان أو ظاهرة فتؤديها المجموعة، ومن يخمن حركة زميله يحصل على نقطة، ويؤدي التلميذ الحركة ويخمن حركات الزملاء (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر كل زوج تمرينًا تمثيليًا جديدًا (مثل تجديف القارب) ويعرضه للزملاء، ويبتكر التلميذ الحركة مع زميله ويعرضها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة تمثيلية: نمو الزهرة ببطء من الجثو إلى الوقوف مع التنفس العميق، ويؤدي التلميذ التهدئة التمثيلية (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة التي تمثل تمايل الأشجار؟\nالإجابة: تبادل ميل الجذع للجانبين والذراعان عاليًا.\nس2 (مستوى التطبيق): كيف نمثل طيران العصافير؟\nالإجابة: نجري ونحرك الذراعين لأعلى ولأسفل كالأجنحة.\nس3 (مستوى الاستدلال): ما الفائدة من التمرينات التمثيلية؟\nالإجابة: تحرك أجزاء الجسم بطريقة ممتعة وتنمي الخيال.\n\n• نشاط علاجي (لمن لم يتقن): يقلّد المعلم أمام التلميذ حركة تمايل الأشجار وطيران العصافير ببطء، ويؤديها التلميذ معه مع صوت المعلم، ثم يطلب منه تمثيل طيران العصفور وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.", "التقويم الختامي": "س1 (مستوى المعرفة): مثّل حركة الضفدع.\nالإجابة: يقفز بالقدمين معًا من وضع القرفصاء.\nس2 (مستوى التطبيق): اذكر تمرينًا تمثيليًا ابتكرته أنت وزميلك.\nالإجابة: يذكر الحركة المبتكرة (مثل التجديف).\nس3 (مستوى الاستدلال): أي جزء من الجسم تحركه أكثر عند تمثيل الطيران؟\nالإجابة: الذراعان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاث حركات تمثيلية (الأشجار، العصافير، الضفدع) من دليل المعلم ص 53، ودعه يبتكر حركة لحيوان يحبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=6"}}, {"focus": "القصة الحركية (قصة اجتماعية عن السلامة المرورية والتعاون)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الحركات الأساسية (مشي، جري، وثب) ضمن قصة حركية.\n2. يستنتج القيم والسلوكيات الواردة في القصة.\n3. يشعر بالسعادة أثناء مشاركة زملائه أداء القصة الحركية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بطاقات إشارات المرور\n- صورة توضيحية", "المفاهيم": "- القصة الحركية\n- السلامة المرورية\n- التعاون\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الحصة السابقة بسرعة، ثم يقول: اليوم سنذهب في رحلة إلى الحديقة بأجسامنا! ويعرض بطاقات إشارات المرور.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء على شكل بداية القصة: نستيقظ (تمطي)، نغسل الوجه، نمشي إلى الحافلة، نجري حتى لا تفوتنا، ويقلد التلميذ حركات بداية القصة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يسرد المعلم القصة ويؤدي نموذج كل حركة: نعبر الشارع عند الإشارة الخضراء (مشي)، نركض في الحديقة (جري)، نقفز فوق الجدول (وثب داخل الأطواق)، نساعد صديقًا سقط (دحرجة على المرتبة ومد اليد)، نعود في قطار الحافلة (دليل المعلم ص 54-55)، ويؤدي التلميذ حركات القصة مع السرد ويلتزم بالإشارات (18 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الإشارة): بطاقة حمراء توقف، خضراء مشي، صفراء استعداد، ومن يخالف يعيد المحاولة، ويستجيب التلميذ للبطاقات بالحركة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. حوار في مجموعات: ماذا تعلمنا من القصة؟ وماذا فعلنا عندما سقط صديقنا؟ وتعرض كل مجموعة قيمة واحدة، ويناقش التلميذ مع مجموعته ويذكر قيمة من القصة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس كأننا نشم زهور الحديقة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الشارع؟\nالإجابة: المشي بهدوء عند الإشارة الخضراء.\nس2 (مستوى التطبيق): كيف ساعدنا الصديق الذي سقط؟\nالإجابة: مددنا له اليد وساعدناه على الوقوف.\nس3 (مستوى الاستدلال): لماذا لا نركض عند عبور الشارع؟\nالإجابة: لأن الركض قد يسبب حادثًا أو السقوط.\n\n• نشاط علاجي (لمن لم يتقن): يقلّد المعلم أمام التلميذ حركة تمايل الأشجار وطيران العصافير ببطء، ويؤديها التلميذ معه مع صوت المعلم، ثم يطلب منه تمثيل طيران العصفور وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاث حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب.\nس2 (مستوى التطبيق): ما القيمة التي تعلمتها من القصة؟\nالإجابة: التعاون ومساعدة الآخرين والالتزام بإشارات المرور.\nس3 (مستوى الاستدلال): ماذا تعني الإشارة الحمراء للمشاة؟\nالإجابة: التوقف وعدم العبور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طفلك قصة اليوم ومعاني إشارات المرور، وتدربا على عبور الشارع بأمان (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات التمثيلية وأمثلة عليها.\n2. يؤدي تمرينات تمثيلية لحركات الطبيعة والحيوانات مع صوت المعلم.\n3. يبتكر حركة تمثيلية جديدة بأجزاء جسمه.\n\nالحصة 2:\n1. يؤدي الحركات الأساسية (مشي، جري، وثب) ضمن قصة حركية.\n2. يستنتج القيم والسلوكيات الواردة في القصة.\n3. يشعر بالسعادة أثناء مشاركة زملائه أداء القصة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور حيوانات وظواهر طبيعية\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بطاقات إشارات المرور\n- صورة توضيحية", "المفاهيم": "الحصة 1:\n- التمرين التمثيلي\n- التقليد\n- تمايل الأشجار\n- طيران العصافير\n\nالحصة 2:\n- القصة الحركية\n- السلامة المرورية\n- التعاون\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة أشجار تتمايل بالريح وصورة عصفور يطير ويسأل: كيف نقلد هذه الحركة بأجسامنا؟\n\nالحصة 2:\nيراجع المعلم تمرينات الحصة السابقة بسرعة، ثم يقول: اليوم سنذهب في رحلة إلى الحديقة بأجسامنا! ويعرض بطاقات إشارات المرور.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء تمثيلي بنموذج المعلم: المشي كالجندي، الجري كالحصان، القفز كالضفدع، ويقلد التلميذ حركات الإحماء التمثيلية (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ثم يؤدي نموذج الحركة (تمايل الأشجار: وقوف، الذراعان عاليًا، تبادل ميل الجذع للجانبين؛ طيران العصافير: الجري مع تحريك الذراعين جانبًا) من دليل المعلم ص 53، ويؤدي التلاميذ مع صوته، ويؤدي التلميذ التمرين التمثيلي مع إيقاع صوت المعلم (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (ماذا أمثل؟): يرفع المعلم بطاقة حيوان أو ظاهرة فتؤديها المجموعة، ومن يخمن حركة زميله يحصل على نقطة، ويؤدي التلميذ الحركة ويخمن حركات الزملاء (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر كل زوج تمرينًا تمثيليًا جديدًا (مثل تجديف القارب) ويعرضه للزملاء، ويبتكر التلميذ الحركة مع زميله ويعرضها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة تمثيلية: نمو الزهرة ببطء من الجثو إلى الوقوف مع التنفس العميق، ويؤدي التلميذ التهدئة التمثيلية (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء على شكل بداية القصة: نستيقظ (تمطي)، نغسل الوجه، نمشي إلى الحافلة، نجري حتى لا تفوتنا، ويقلد التلميذ حركات بداية القصة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يسرد المعلم القصة ويؤدي نموذج كل حركة: نعبر الشارع عند الإشارة الخضراء (مشي)، نركض في الحديقة (جري)، نقفز فوق الجدول (وثب داخل الأطواق)، نساعد صديقًا سقط (دحرجة على المرتبة ومد اليد)، نعود في قطار الحافلة (دليل المعلم ص 54-55)، ويؤدي التلميذ حركات القصة مع السرد ويلتزم بالإشارات (18 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الإشارة): بطاقة حمراء توقف، خضراء مشي، صفراء استعداد، ومن يخالف يعيد المحاولة، ويستجيب التلميذ للبطاقات بالحركة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. حوار في مجموعات: ماذا تعلمنا من القصة؟ وماذا فعلنا عندما سقط صديقنا؟ وتعرض كل مجموعة قيمة واحدة، ويناقش التلميذ مع مجموعته ويذكر قيمة من القصة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس كأننا نشم زهور الحديقة، ويؤدي التلميذ التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الحركة التي تمثل تمايل الأشجار؟\nالإجابة: تبادل ميل الجذع للجانبين والذراعان عاليًا.\nس2 (مستوى التطبيق): كيف نمثل طيران العصافير؟\nالإجابة: نجري ونحرك الذراعين لأعلى ولأسفل كالأجنحة.\nس3 (مستوى الاستدلال): ما الفائدة من التمرينات التمثيلية؟\nالإجابة: تحرك أجزاء الجسم بطريقة ممتعة وتنمي الخيال.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الشارع؟\nالإجابة: المشي بهدوء عند الإشارة الخضراء.\nس2 (مستوى التطبيق): كيف ساعدنا الصديق الذي سقط؟\nالإجابة: مددنا له اليد وساعدناه على الوقوف.\nس3 (مستوى الاستدلال): لماذا لا نركض عند عبور الشارع؟\nالإجابة: لأن الركض قد يسبب حادثًا أو السقوط.\n\n• نشاط علاجي (لمن لم يتقن): يقلّد المعلم أمام التلميذ حركة تمايل الأشجار وطيران العصافير ببطء، ويؤديها التلميذ معه مع صوت المعلم، ثم يطلب منه تمثيل طيران العصفور وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): مثّل حركة الضفدع.\nالإجابة: يقفز بالقدمين معًا من وضع القرفصاء.\nس2 (مستوى التطبيق): اذكر تمرينًا تمثيليًا ابتكرته أنت وزميلك.\nالإجابة: يذكر الحركة المبتكرة (مثل التجديف).\nس3 (مستوى الاستدلال): أي جزء من الجسم تحركه أكثر عند تمثيل الطيران؟\nالإجابة: الذراعان.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر ثلاث حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب.\nس2 (مستوى التطبيق): ما القيمة التي تعلمتها من القصة؟\nالإجابة: التعاون ومساعدة الآخرين والالتزام بإشارات المرور.\nس3 (مستوى الاستدلال): ماذا تعني الإشارة الحمراء للمشاة؟\nالإجابة: التوقف وعدم العبور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاث حركات تمثيلية (الأشجار، العصافير، الضفدع) من دليل المعلم ص 53، ودعه يبتكر حركة لحيوان يحبه.\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طفلك قصة اليوم ومعاني إشارات المرور، وتدربا على عبور الشارع بأمان (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=6"}}, {"title": "المشي والجري", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 60-67", "n": 2, "periods": [{"focus": "المشي والجري في مسارات واتجاهات مختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي المشي والجري والفرق بينهما.\n2. يؤدي المشي والجري في مسارات مستقيمة ومتعرجة ومنحنية.\n3. يتبع الاتجاهات (أمام، خلف، يمين، يسار) أثناء الحركة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- المشي\n- الجري\n- المسار المستقيم والمتعرج والمنحني\n- الاتجاهات\n- السريع والبطيء", "التهيئة / التمهيد / التعلم القبلي": "يمشي المعلم ببطء ثم يجري ويسأل: ما الفرق بين الحركتين؟ ثم يعرض خطوطًا مرسومة على الأرض بأشكال هندسية مختلفة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: مشي على أطراف الأصابع، مشي على الكعبين، جري خفيف في المكان، ويقلد التلميذ أنواع المشي والجري (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم الفرق (في الجري ترتفع القدمان عن الأرض لحظة) ويؤدي نموذج المشي ثم الجري على خط مستقيم، مع مرجحة الذراعين عكس الرجلين (ص 61-63)، ويؤدي التلميذ المشي ثم الجري على الخط بعد النموذج (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: مسارات مرسومة (دائرة، مربع، مثلث، متعرج)؛ يجرب التلميذ المشي والجري فيها ويكتشف أي المسارات أسهل وأيها أبطأ، ثم يستنتج مع المعلم السبب، ويجرب التلميذ المسارات ويستنتج أن المسار المتعرج يحتاج إلى تغيير الاتجاه فيكون أبطأ (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (اتبع القائد): يقود تلميذ قطار مجموعته في اتجاهات يناديها المعلم (أمام، خلف، يمين، يسار) بالمشي ثم الجري، ويتبع التلميذ القائد بالاتجاه الصحيح ويتبادل القيادة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بالمشي البطيء ثم الإطالة للساقين مع نموذج المعلم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الفرق بين المشي والجري؟\nالإجابة: في الجري ترتفع القدمان عن الأرض لحظة والسرعة أكبر.\nس2 (مستوى التطبيق): أي المسارات كان أصعب في الجري ولماذا؟\nالإجابة: المسار المتعرج لأننا نغير الاتجاه كثيرًا.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الجري؟\nالإجابة: تتحركان بالتبادل عكس حركة الرجلين.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.", "التقويم الختامي": "س1 (مستوى المعرفة): امشِ على خط مستقيم ثم اجرِ عليه.\nالإجابة: يؤدي المشي ثم الجري دون الخروج عن الخط.\nس2 (مستوى التطبيق): سمِّ ثلاثة مسارات مشيت فيها اليوم.\nالإجابة: مستقيم، متعرج، منحنٍ (دائرة).\nس3 (مستوى الاستدلال): إذا قلت لك (يمين) أثناء الجري فماذا تفعل؟\nالإجابة: أغير اتجاهي إلى اليمين وأستمر في الجري.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: امشِ مع طفلك في الحي وتناوبا بين المشي السريع والجري الخفيف، وراجعا الاتجاهات الأربعة (دليل المعلم ص 61-63).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=7"}}, {"focus": "المشي والجري في المحطات والمسابقات والألعاب", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف المشي والجري في أداء مهارات المسابقات والألعاب.\n2. يغير سرعة الجري (سريع، بطيء) حسب الإشارة.\n3. يستمتع بمشاركة زملائه أنشطة المشي والجري.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أطواق", "المفاهيم": "- المحطات\n- التتابع\n- السريع والبطيء\n- الفراغ", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يتذكر الفرق بين المشي والجري؟ ثم يعلن: اليوم نجري في محطات ومسابقات!", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري بطيء ثم سريع بإشارة الصافرة، مع تمرينات للساقين، ويغير التلميذ سرعة الجري حسب الصافرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 (محطات المشي والجري) ص 64: محطة المشي على المقعد السويدي، محطة الجري بين الأقماع، محطة المشي فوق الحواجز المنخفضة، محطة الجري حاملًا الكرة ووضعها في الطوق، مع التبديل بالإشارة، ويؤدي التلميذ مهمة المحطة ويشجع مجموعته وينتقل بنظام (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 3 و4 ص 65-66: مسابقة التتابع بالجري في قطارات حول القمع والعودة، ثم لعبة (الصياد والصقور) بالجري في الفراغ دون تصادم، ويتسابق التلميذ مع قطاره ويلعب ملتزمًا بالفراغ الخاص (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى يفضل المشي ومتى يفضل الجري في المسابقة؟ ليستنتج التلاميذ أن الجري للسرعة والمشي للتوازن على المقعد، ويستنتج التلميذ ويذكر مثالًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): في أي محطة استخدمنا المشي بدل الجري ولماذا؟\nالإجابة: المشي على المقعد السويدي للحفاظ على التوازن.\nس2 (مستوى التطبيق): كيف نفوز في مسابقة التتابع؟\nالإجابة: بالجري السريع ولمس يد الزميل التالي بسرعة دون أخطاء.\nس3 (مستوى الاستدلال): ما معنى الفراغ الخاص أثناء اللعب؟\nالإجابة: المساحة حولي التي أتحرك فيها دون أن أصطدم بزميلي.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المشي على المقعد والجري بين الأقماع.\nس2 (مستوى التطبيق): اجرِ حول القمع والعودة بأسرع ما يمكن.\nالإجابة: يؤدي الجري السريع ذهابًا وإيابًا.\nس3 (مستوى الاستدلال): ماذا تفعل إذا صادفك زميل أثناء الجري في اللعبة؟\nالإجابة: أغير اتجاهي وأتجنب التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الجري في مكان آمن 10 دقائق يوميًا، واستعرض معه صور محطات المشي والجري في دليل المعلم ص 64-66.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي المشي والجري والفرق بينهما.\n2. يؤدي المشي والجري في مسارات مستقيمة ومتعرجة ومنحنية.\n3. يتبع الاتجاهات (أمام، خلف، يمين، يسار) أثناء الحركة.\n\nالحصة 2:\n1. يوظف المشي والجري في أداء مهارات المسابقات والألعاب.\n2. يغير سرعة الجري (سريع، بطيء) حسب الإشارة.\n3. يستمتع بمشاركة زملائه أنشطة المشي والجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- المشي\n- الجري\n- المسار المستقيم والمتعرج والمنحني\n- الاتجاهات\n- السريع والبطيء\n\nالحصة 2:\n- المحطات\n- التتابع\n- السريع والبطيء\n- الفراغ", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيمشي المعلم ببطء ثم يجري ويسأل: ما الفرق بين الحركتين؟ ثم يعرض خطوطًا مرسومة على الأرض بأشكال هندسية مختلفة.\n\nالحصة 2:\nيسأل المعلم: من يتذكر الفرق بين المشي والجري؟ ثم يعلن: اليوم نجري في محطات ومسابقات!", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: مشي على أطراف الأصابع، مشي على الكعبين، جري خفيف في المكان، ويقلد التلميذ أنواع المشي والجري (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم الفرق (في الجري ترتفع القدمان عن الأرض لحظة) ويؤدي نموذج المشي ثم الجري على خط مستقيم، مع مرجحة الذراعين عكس الرجلين (ص 61-63)، ويؤدي التلميذ المشي ثم الجري على الخط بعد النموذج (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: مسارات مرسومة (دائرة، مربع، مثلث، متعرج)؛ يجرب التلميذ المشي والجري فيها ويكتشف أي المسارات أسهل وأيها أبطأ، ثم يستنتج مع المعلم السبب، ويجرب التلميذ المسارات ويستنتج أن المسار المتعرج يحتاج إلى تغيير الاتجاه فيكون أبطأ (12 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (اتبع القائد): يقود تلميذ قطار مجموعته في اتجاهات يناديها المعلم (أمام، خلف، يمين، يسار) بالمشي ثم الجري، ويتبع التلميذ القائد بالاتجاه الصحيح ويتبادل القيادة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بالمشي البطيء ثم الإطالة للساقين مع نموذج المعلم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري بطيء ثم سريع بإشارة الصافرة، مع تمرينات للساقين، ويغير التلميذ سرعة الجري حسب الصافرة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 (محطات المشي والجري) ص 64: محطة المشي على المقعد السويدي، محطة الجري بين الأقماع، محطة المشي فوق الحواجز المنخفضة، محطة الجري حاملًا الكرة ووضعها في الطوق، مع التبديل بالإشارة، ويؤدي التلميذ مهمة المحطة ويشجع مجموعته وينتقل بنظام (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 3 و4 ص 65-66: مسابقة التتابع بالجري في قطارات حول القمع والعودة، ثم لعبة (الصياد والصقور) بالجري في الفراغ دون تصادم، ويتسابق التلميذ مع قطاره ويلعب ملتزمًا بالفراغ الخاص (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى يفضل المشي ومتى يفضل الجري في المسابقة؟ ليستنتج التلاميذ أن الجري للسرعة والمشي للتوازن على المقعد، ويستنتج التلميذ ويذكر مثالًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة بالمشي وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الفرق بين المشي والجري؟\nالإجابة: في الجري ترتفع القدمان عن الأرض لحظة والسرعة أكبر.\nس2 (مستوى التطبيق): أي المسارات كان أصعب في الجري ولماذا؟\nالإجابة: المسار المتعرج لأننا نغير الاتجاه كثيرًا.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الجري؟\nالإجابة: تتحركان بالتبادل عكس حركة الرجلين.\n\nالحصة 2:\nس1 (مستوى المعرفة): في أي محطة استخدمنا المشي بدل الجري ولماذا؟\nالإجابة: المشي على المقعد السويدي للحفاظ على التوازن.\nس2 (مستوى التطبيق): كيف نفوز في مسابقة التتابع؟\nالإجابة: بالجري السريع ولمس يد الزميل التالي بسرعة دون أخطاء.\nس3 (مستوى الاستدلال): ما معنى الفراغ الخاص أثناء اللعب؟\nالإجابة: المساحة حولي التي أتحرك فيها دون أن أصطدم بزميلي.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): امشِ على خط مستقيم ثم اجرِ عليه.\nالإجابة: يؤدي المشي ثم الجري دون الخروج عن الخط.\nس2 (مستوى التطبيق): سمِّ ثلاثة مسارات مشيت فيها اليوم.\nالإجابة: مستقيم، متعرج، منحنٍ (دائرة).\nس3 (مستوى الاستدلال): إذا قلت لك (يمين) أثناء الجري فماذا تفعل؟\nالإجابة: أغير اتجاهي إلى اليمين وأستمر في الجري.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المشي على المقعد والجري بين الأقماع.\nس2 (مستوى التطبيق): اجرِ حول القمع والعودة بأسرع ما يمكن.\nالإجابة: يؤدي الجري السريع ذهابًا وإيابًا.\nس3 (مستوى الاستدلال): ماذا تفعل إذا صادفك زميل أثناء الجري في اللعبة؟\nالإجابة: أغير اتجاهي وأتجنب التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: امشِ مع طفلك في الحي وتناوبا بين المشي السريع والجري الخفيف، وراجعا الاتجاهات الأربعة (دليل المعلم ص 61-63).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على الجري في مكان آمن 10 دقائق يوميًا، واستعرض معه صور محطات المشي والجري في دليل المعلم ص 64-66.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=7"}}, {"title": "الوثب والحجل", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الثامن – التاسع", "date": "25-29/10/2026 إلى 1-5/11/2026", "pages": "دليل المعلم ص 68-77", "n": 4, "periods": [{"focus": "الوثب لأعلى ولأمام بأوضاع الجسم المختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الوثب ومراحلها (الارتقاء، الطيران، الهبوط).\n2. يؤدي الوثب بالقدمين لأعلى ولأمام بهبوط آمن.\n3. يميز بين الوثب لأعلى والوثب لأمام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- الوثب\n- الارتقاء\n- الطيران\n- الهبوط\n- الفراغ الخاص", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أرنب يقفز ويسأل: كيف يقفز الأرنب؟ ثم يؤدي وثبة ويسأل: على كم قدم ارتقيت وهبطت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف، وثب في المكان بالقدمين، ثني ومد الركبتين، ويقلد التلميذ حركات الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الوثب بالعد: (1) ثني الركبتين ومرجحة الذراعين خلفًا، (2) الدفع بالقدمين والذراعان أمامًا عاليًا، (3) الهبوط على المشطين بثني الركبتين، ثم الأداء الكامل (ص 69-70)، ويؤدي التلميذ الوثب بالعد ثم بشكل كامل داخل طوقه (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 72: الوثب لأعلى بأوضاع مختلفة (الذراعان عاليًا، جانبًا)، ثم الوثب لأمام من طوق إلى طوق كالأرنب، ومن يصل آخر طوق بهبوط آمن يرفع يده، ويؤدي التلميذ الوثب بالأوضاع المختلفة ويهبط بثني الركبتين (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يراقب تلميذ وثب زميله ويخبره: هل هبط بهدوء بثني الركبتين؟ ثم يتبادلان، ويراقب التلميذ ويعطي تغذية راجعة لزميله ثم يؤدي (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بإطالة عضلات الساقين مع نموذج المعلم، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما مراحل الوثب الثلاث؟\nالإجابة: الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): كيف نهبط بأمان بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): لماذا نمرجح الذراعين قبل الوثب؟\nالإجابة: لتساعدنا على الارتفاع والوصول أبعد.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وثبة لأمام من
