نين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.\n\nس4 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الشارع؟\nالإجابة: المشي بهدوء عند الإشارة الخضراء.\nس5 (مستوى التطبيق): كيف ساعدنا الصديق الذي سقط؟\nالإجابة: مددنا له اليد وساعدناه على الوقوف.\nس6 (مستوى الاستدلال): لماذا لا نركض عند عبور الشارع؟\nالإجابة: لأن الركض قد يسبب حادثًا أو السقوط.\n\n• نشاط علاجي (لمن لم يتقن): يقلّد المعلم أمام التلميذ حركة تمايل الأشجار وطيران العصافير ببطء، ويؤديها التلميذ معه مع صوت المعلم، ثم يطلب منه تمثيل طيران العصفور وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): مثّل حركة الضفدع.\nالإجابة: يقفز بالقدمين معًا من وضع القرفصاء.\nس2 (مستوى التطبيق): اذكر تمرينًا تمثيليًا ابتكرته أنت وزميلك.\nالإجابة: يذكر الحركة المبتكرة (مثل التجديف).\nس3 (مستوى الاستدلال): أي جزء من الجسم تحركه أكثر عند تمثيل الطيران؟\nالإجابة: الذراعان.\n\nس4 (مستوى المعرفة): اذكر ثلاث حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب.\nس5 (مستوى التطبيق): ما القيمة التي تعلمتها من القصة؟\nالإجابة: التعاون ومساعدة الآخرين والالتزام بإشارات المرور.\nس6 (مستوى الاستدلال): ماذا تعني الإشارة الحمراء للمشاة؟\nالإجابة: التوقف وعدم العبور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاث حركات تمثيلية (الأشجار، العصافير، الضفدع) من دليل المعلم ص 53، ودعه يبتكر حركة لحيوان يحبه.\nإرشاد لولي الأمر: ناقش مع طفلك قصة اليوم ومعاني إشارات المرور، وتدربا على عبور الشارع بأمان (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=6"}}, {"title": "المشي والجري", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 60-67", "n": 1, "periods": [{"focus": "المشي والجري في مسارات واتجاهات مختلفة + المشي والجري في المحطات والمسابقات والألعاب", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي المشي والجري والفرق بينهما.\n2. يؤدي المشي والجري في مسارات مستقيمة ومتعرجة ومنحنية.\n3. يتبع الاتجاهات (أمام، خلف، يمين، يسار) أثناء الحركة.\n4. يوظف المشي والجري في أداء مهارات المسابقات والألعاب.\n5. يغير سرعة الجري (سريع، بطيء) حسب الإشارة.\n6. يستمتع بمشاركة زملائه أنشطة المشي والجري.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة", "المفاهيم": "- المشي\n- الجري\n- المسار المستقيم والمتعرج والمنحني\n- الاتجاهات\n- السريع والبطيء\n- المحطات\n- التتابع\n- الفراغ", "التهيئة / التمهيد / التعلم القبلي": "يمشي المعلم ببطء ثم يجري ويسأل: ما الفرق بين الحركتين؟ ثم يعرض خطوطًا مرسومة على الأرض بأشكال هندسية مختلفة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: مشي على أطراف الأصابع، مشي على الكعبين، جري خفيف في المكان، ويقلد التلميذ أنواع المشي والجري (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم الفرق (في الجري ترتفع القدمان عن الأرض لحظة) ويؤدي نموذج المشي ثم الجري على خط مستقيم، مع مرجحة الذراعين عكس الرجلين (ص 61-63)، ويؤدي التلميذ المشي ثم الجري على الخط بعد النموذج (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 63: مسارات مرسومة (دائرة، مربع، مثلث، متعرج)؛ يجرب التلميذ المشي والجري فيها ويكتشف أي المسارات أسهل وأيها أبطأ، ثم يستنتج مع المعلم السبب، ويجرب التلميذ المسارات ويستنتج أن المسار المتعرج يحتاج إلى تغيير الاتجاه فيكون أبطأ (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (اتبع القائد): يقود تلميذ قطار مجموعته في اتجاهات يناديها المعلم (أمام، خلف، يمين، يسار) بالمشي ثم الجري، ويتبع التلميذ القائد بالاتجاه الصحيح ويتبادل القيادة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 2 (محطات المشي والجري) ص 64: محطة المشي على المقعد السويدي، محطة الجري بين الأقماع، محطة المشي فوق الحواجز المنخفضة، محطة الجري حاملًا الكرة ووضعها في الطوق، مع التبديل بالإشارة، ويؤدي التلميذ مهمة المحطة ويشجع مجموعته وينتقل بنظام (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 3 و4 ص 65-66: مسابقة التتابع بالجري في قطارات حول القمع والعودة، ثم لعبة (الصياد والصقور) بالجري في الفراغ دون تصادم، ويتسابق التلميذ مع قطاره ويلعب ملتزمًا بالفراغ الخاص (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى يفضل المشي ومتى يفضل الجري في المسابقة؟ ليستنتج التلاميذ أن الجري للسرعة والمشي للتوازن على المقعد، ويستنتج التلميذ ويذكر مثالًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة بالمشي وإطالة الساقين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الفرق بين المشي والجري؟\nالإجابة: في الجري ترتفع القدمان عن الأرض لحظة والسرعة أكبر.\nس2 (مستوى التطبيق): أي المسارات كان أصعب في الجري ولماذا؟\nالإجابة: المسار المتعرج لأننا نغير الاتجاه كثيرًا.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الجري؟\nالإجابة: تتحركان بالتبادل عكس حركة الرجلين.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.\n\nس4 (مستوى المعرفة): في أي محطة استخدمنا المشي بدل الجري ولماذا؟\nالإجابة: المشي على المقعد السويدي للحفاظ على التوازن.\nس5 (مستوى التطبيق): كيف نفوز في مسابقة التتابع؟\nالإجابة: بالجري السريع ولمس يد الزميل التالي بسرعة دون أخطاء.\nس6 (مستوى الاستدلال): ما معنى الفراغ الخاص أثناء اللعب؟\nالإجابة: المساحة حولي التي أتحرك فيها دون أن أصطدم بزميلي.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.", "التقويم الختامي": "س1 (مستوى المعرفة): امشِ على خط مستقيم ثم اجرِ عليه.\nالإجابة: يؤدي المشي ثم الجري دون الخروج عن الخط.\nس2 (مستوى التطبيق): سمِّ ثلاثة مسارات مشيت فيها اليوم.\nالإجابة: مستقيم، متعرج، منحنٍ (دائرة).\nس3 (مستوى الاستدلال): إذا قلت لك (يمين) أثناء الجري فماذا تفعل؟\nالإجابة: أغير اتجاهي إلى اليمين وأستمر في الجري.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المشي على المقعد والجري بين الأقماع.\nس5 (مستوى التطبيق): اجرِ حول القمع والعودة بأسرع ما يمكن.\nالإجابة: يؤدي الجري السريع ذهابًا وإيابًا.\nس6 (مستوى الاستدلال): ماذا تفعل إذا صادفك زميل أثناء الجري في اللعبة؟\nالإجابة: أغير اتجاهي وأتجنب التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: امشِ مع طفلك في الحي وتناوبا بين المشي السريع والجري الخفيف، وراجعا الاتجاهات الأربعة (دليل المعلم ص 61-63).\nإرشاد لولي الأمر: شجع طفلك على الجري في مكان آمن 10 دقائق يوميًا، واستعرض معه صور محطات المشي والجري في دليل المعلم ص 64-66.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=7"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي المشي والجري والفرق بينهما.\n2. يؤدي المشي والجري في مسارات مستقيمة ومتعرجة ومنحنية.\n3. يتبع الاتجاهات (أمام، خلف، يمين، يسار) أثناء الحركة.\n4. يوظف المشي والجري في أداء مهارات المسابقات والألعاب.\n5. يغير سرعة الجري (سريع، بطيء) حسب الإشارة.\n6. يستمتع بمشاركة زملائه أنشطة المشي والجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n- أخرى: أطواق\n- صورة توضيحية\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: كرا اف.\n\n8. تهدئة بالمشي وإطالة الساقين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الفرق بين المشي والجري؟\nالإجابة: في الجري ترتفع القدمان عن الأرض لحظة والسرعة أكبر.\nس2 (مستوى التطبيق): أي المسارات كان أصعب في الجري ولماذا؟\nالإجابة: المسار المتعرج لأننا نغير الاتجاه كثيرًا.\nس3 (مستوى الاستدلال): كيف تتحرك الذراعان أثناء الجري؟\nالإجابة: تتحركان بالتبادل عكس حركة الرجلين.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.\n\nس4 (مستوى المعرفة): في أي محطة استخدمنا المشي بدل الجري ولماذا؟\nالإجابة: المشي على المقعد السويدي للحفاظ على التوازن.\nس5 (مستوى التطبيق): كيف نفوز في مسابقة التتابع؟\nالإجابة: بالجري السريع ولمس يد الزميل التالي بسرعة دون أخطاء.\nس6 (مستوى الاستدلال): ما معنى الفراغ الخاص أثناء اللعب؟\nالإجابة: المساحة حولي التي أتحرك فيها دون أن أصطدم بزميلي.\n\n• نشاط علاجي (لمن لم يتقن): يمشي المعلم مع التلميذ ثم يجريان ببطء على خط مستقيم مرسوم، ويلاحظان ارتفاع القدمين في الجري وحركة الذراعين، ثم يسأله: ما الفرق بين المشي والجري؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالجري في مسار متعرج بين أقماع مع تغيير الاتجاه (أمام، وخلف، ويمين، ويسار) عند النداء، وتعليل صعوبة المسار المتعرج.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): امشِ على خط مستقيم ثم اجرِ عليه.\nالإجابة: يؤدي المشي ثم الجري دون الخروج عن الخط.\nس2 (مستوى التطبيق): سمِّ ثلاثة مسارات مشيت فيها اليوم.\nالإجابة: مستقيم، متعرج، منحنٍ (دائرة).\nس3 (مستوى الاستدلال): إذا قلت لك (يمين) أثناء الجري فماذا تفعل؟\nالإجابة: أغير اتجاهي إلى اليمين وأستمر في الجري.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المشي على المقعد والجري بين الأقماع.\nس5 (مستوى التطبيق): اجرِ حول القمع والعودة بأسرع ما يمكن.\nالإجابة: يؤدي الجري السريع ذهابًا وإيابًا.\nس6 (مستوى الاستدلال): ماذا تفعل إذا صادفك زميل أثناء الجري في اللعبة؟\nالإجابة: أغير اتجاهي وأتجنب التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: امشِ مع طفلك في الحي وتناوبا بين المشي السريع والجري الخفيف، وراجعا الاتجاهات الأربعة (دليل المعلم ص 61-63).\nإرشاد لولي الأمر: شجع طفلك على الجري في مكان آمن 10 دقائق يوميًا، واستعرض معه صور محطات المشي والجري في دليل المعلم ص 64-66.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=7"}}, {"title": "الوثب والحجل", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الثامن – التاسع", "date": "25-29/10/2026 إلى 1-5/11/2026", "pages": "دليل المعلم ص 68-77", "n": 2, "periods": [{"focus": "الوثب لأعلى ولأمام بأوضاع الجسم المختلفة + الحجل والوثب بقدم واحدة في مسارات", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الوثب ومراحلها (الارتقاء، الطيران، الهبوط).\n2. يؤدي الوثب بالقدمين لأعلى ولأمام بهبوط آمن.\n3. يميز بين الوثب لأعلى والوثب لأمام.\n4. يتعرف حركة الحجل والفرق بينها وبين الوثب.\n5. يؤدي الحجل بالقدم اليمنى ثم اليسرى في مسار.\n6. يحافظ على اتزانه أثناء الحجل.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: حبال", "المفاهيم": "- الوثب\n- الارتقاء\n- الطيران\n- الهبوط\n- الفراغ الخاص\n- الحجل\n- الوثب بقدم واحدة\n- الاتزان\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أرنب يقفز ويسأل: كيف يقفز الأرنب؟ ثم يؤدي وثبة ويسأل: على كم قدم ارتقيت وهبطت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف، وثب في المكان بالقدمين، ثني ومد الركبتين، ويقلد التلميذ حركات الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الوثب بالعد: (1) ثني الركبتين ومرجحة الذراعين خلفًا، (2) الدفع بالقدمين والذراعان أمامًا عاليًا، (3) الهبوط على المشطين بثني الركبتين، ثم الأداء الكامل (ص 69-70)، ويؤدي التلميذ الوثب بالعد ثم بشكل كامل داخل طوقه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 72: الوثب لأعلى بأوضاع مختلفة (الذراعان عاليًا، جانبًا)، ثم الوثب لأمام من طوق إلى طوق كالأرنب، ومن يصل آخر طوق بهبوط آمن يرفع يده، ويؤدي التلميذ الوثب بالأوضاع المختلفة ويهبط بثني الركبتين (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يراقب تلميذ وثب زميله ويخبره: هل هبط بهدوء بثني الركبتين؟ ثم يتبادلان، ويراقب التلميذ ويعطي تغذية راجعة لزميله ثم يؤدي (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يؤدي المعلم نموذج الحجل: الارتقاء والهبوط على القدم نفسها، الركبة الأخرى مرفوعة، الذراعان للاتزان، ثم تطبيق موجه في المكان ثم لأمام (ص 70-71)، ويحجل التلميذ في المكان ثم لأمام بالقدم اليمنى ثم اليسرى (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 ص 73: مسارات بأطواق مرتبة؛ يجرب التلميذ الحجل في المسار المستقيم ثم المتعرج ويكتشف أي القدمين أقوى لديه، ويستنتج مع المعلم لماذا نحتاج إلى تدريب القدمين معًا، ويجرب التلميذ بالقدمين ويعبر عن اكتشافه (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. لعبة (الفلامنجو): عند النداء يحجل الجميع، وعند الصافرة يثبت كل تلميذ على قدم واحدة، ومن يحافظ على ثباته أطول يفوز، ويلعب التلميذ ويحافظ على اتزانه (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة بإطالة الساقين والكاحلين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما مراحل الوثب الثلاث؟\nالإجابة: الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): كيف نهبط بأمان بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): لماذا نمرجح الذراعين قبل الوثب؟\nالإجابة: لتساعدنا على الارتفاع والوصول أبعد.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.\n\nس4 (مستوى المعرفة): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا، والحجل بقدم واحدة.\nس5 (مستوى التطبيق): أين تكون الذراعان أثناء الحجل؟\nالإجابة: جانبًا للمحافظة على الاتزان.\nس6 (مستوى الاستدلال): لماذا نتدرب على الحجل بالقدمين؟\nالإجابة: لتقوية القدمين معًا وعدم الاعتماد على قدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وثبة لأمام من طوق إلى طوق.\nالإجابة: يثب بالقدمين معًا ويهبط داخل الطوق بثني الركبتين.\nس2 (مستوى التطبيق): ما الفرق بين الوثب لأعلى والوثب لأمام؟\nالإجابة: في الوثب لأعلى نرتفع ونهبط في المكان نفسه، وفي الوثب لأمام ننتقل إلى مكان أبعد.\nس3 (مستوى الاستدلال): زميلك يهبط بركبتين مفرودتين، بماذا تنصحه؟\nالإجابة: أنصحه بثني الركبتين عند الهبوط حتى لا يتأذى.\n\nس4 (مستوى المعرفة): احجل ثلاث مرات بالقدم اليسرى.\nالإجابة: يحجل بالقدم اليسرى دون لمس الأرض بالأخرى.\nس5 (مستوى التطبيق): أي قدميك كانت أقوى في الحجل؟ وكيف عرفت؟\nالإجابة: يذكر القدم ويعلل بأنه حجل بها مسافة أطول دون سقوط.\nس6 (مستوى الاستدلال): أرفع صورة طفل يقفز بقدم واحدة، ما اسم الحركة؟\nالإجابة: الحجل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الوثب بالقدمين داخل مربعات مرسومة بالطباشير مع الهبوط الهادئ (دليل المعلم ص 69-72).\nإرشاد لولي الأمر: تدرب مع طفلك على الحجل بكل قدم 5 مرات مع المحافظة على التوازن (دليل المعلم ص 70-73).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}, {"focus": "محطات الوثب والحجل + الوثب والحجل في الألعاب والمسابقات الرياضية", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الوثب والحجل فوق أدوات مختلفة (حبال، حواجز منخفضة، أطواق).\n2. يميز متى يستخدم الوثب ومتى يستخدم الحجل في المحطة.\n3. يتعاون مع مجموعته في محطات الوثب والحجل.\n4. يوظف الوثب والحجل في الألعاب والمسابقات.\n5. يطبق قواعد اللعبة والهبوط الآمن أثناء المنافسة.\n6. يعبر عن سعادته عند أداء أنشطة الوثب والحجل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: شريط لاصق", "المفاهيم": "- الوثب\n- الحجل\n- المحطات\n- المدى (قريب، بعيد)\n- المسابقة\n- الإيقاع\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يذكرني بالفرق بين الوثب والحجل؟ ثم يعرض أدوات المحطات ويسأل: كيف نتخطى الحبل؟ وكيف نتخطى الطوق؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري ووثب في المكان وحجل بالتبادل، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل محطة مرة واحدة موضحًا الحركة المناسبة: الوثب فوق الحبل، الحجل بين الأقماع، الوثب من المقعد السويدي والهبوط على المرتبة، الوثب بالقدمين داخل الأطواق المتباعدة، ويشاهد التلميذ ويذكر الحركة المناسبة لكل محطة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الوثب والحجل) ص 74: أربع مجموعات بقائد، تؤدي كل مجموعة محطتها دقائق ثم تنتقل بالإشارة، ويسجل القائد من أدى الهبوط الآمن، ويؤدي التلميذ الحركة الصحيحة لكل محطة ويساعد زملاءه (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مسابقة: تؤدي كل مجموعة المسار كاملًا متتابعة، ونقطة للمجموعة التي تنهي دون إسقاط الأدوات، ويتسابق التلميذ بدقة وأمان (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 4 (ألعاب الوثب والحجل) ص 75: لعبة (الكنغر والحجلة): يثب التلاميذ بالقدمين عند نداء (كنغر) ويحجلون عند (حجلة)، ثم لعبة الوثب داخل المربعات المرقمة بالترتيب، ويلعب التلميذ مستجيبًا للنداء بالحركة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. نشاط 5 ص 76: مسابقة تتابع في قطارات: وثب فوق الحبل، حجل حول القمع، وثب داخل الطوق والعودة لتسليم الكرة للزميل، ويتسابق التلميذ مع مجموعته ويسلم الكرة بدقة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يسأل المعلم: لماذا فازت المجموعة الفائزة؟ ليستنتج التلاميذ أهمية السرعة مع الدقة والهبوط الآمن، ويستنتج التلميذ ويذكر سببًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وإطالة الساقين، وتعبير التلاميذ عن شعورهم، ويؤدي التلميذ التهدئة ويعبر عن شعوره (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة المناسبة لتخطي الحبل؟\nالإجابة: الوثب بالقدمين.\nس2 (مستوى التطبيق): ما الحركة التي أديناها بين الأقماع؟\nالإجابة: الحجل.\nس3 (مستوى الاستدلال): لماذا نهبط على المرتبة بعد الوثب من المقعد؟\nالإجابة: لأن المرتبة تمتص الصدمة وتحمي الركبتين والكاحلين.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.\n\nس4 (مستوى المعرفة): ماذا تفعل عند نداء (كنغر)؟\nالإجابة: أثب بالقدمين معًا.\nس5 (مستوى التطبيق): ما الحركة التي أديتها حول القمع في التتابع؟\nالإجابة: الحجل.\nس6 (مستوى الاستدلال): لماذا تخسر المجموعة التي تسقط الحبل؟\nالإجابة: لأنها لم تؤدِّ الوثب بالطريقة الصحيحة فتخالف قواعد المسابقة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة المناسبة لكل منهما.\nالإجابة: الحبل: وثب، الأقماع: حجل (أو المقعد: وثب والهبوط على المرتبة).\nس2 (مستوى التطبيق): كيف نثب داخل أطواق متباعدة؟\nالإجابة: نثني الركبتين ونمرجح الذراعين بقوة لنصل إلى الطوق البعيد.\nس3 (مستوى الاستدلال): قائد المجموعة لاحظ هبوطًا خاطئًا، ماذا يقول لزميله؟\nالإجابة: اثنِ ركبتيك واهبط على المشطين بهدوء.\n\nس4 (مستوى المعرفة): اذكر لعبة رياضية يظهر فيها الوثب.\nالإجابة: كرة السلة أو الوثب الطويل أو الكرة الطائرة.\nس5 (مستوى التطبيق): أدِّ وثبًا فوق الحبل ثم حجلًا إلى القمع.\nالإجابة: يؤدي الحركتين بالتتابع الصحيح.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقة اليوم ولماذا؟\nالإجابة: يعبر عن سعادته لأنه تعاون مع مجموعته وأدى الحركات بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك محطة بسيطة في المنزل (وسادة للوثب فوقها، خط للحجل) ومارساها بأمان (دليل المعلم ص 74).\nإرشاد لولي الأمر: شجع طفلك على لعبة (الحجلة) التقليدية في المنزل أو الحي، وراجعا مراحل الوثب الثلاث (دليل المعلم ص 75-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة الوثب ومراحلها (الارتقاء، الطيران، الهبوط).\n2. يؤدي الوثب بالقدمين لأعلى ولأمام بهبوط آمن.\n3. يميز بين الوثب لأعلى والوثب لأمام.\n4. يتعرف حركة الحجل والفرق بينها وبين الوثب.\n5. يؤدي الحجل بالقدم اليمنى ثم اليسرى في مسار.\n6. يحافظ على اتزانه أثناء الحجل.\n\nالحصة 2:\n1. يؤدي الوثب والحجل فوق أدوات مختلفة (حبال، حواجز منخفضة، أطواق).\n2. يميز متى يستخدم الوثب ومتى يستخدم الحجل في المحطة.\n3. يتعاون مع مجموعته في محطات الوثب والحجل.\n4. يوظف الوثب والحجل في الألعاب والمسابقات.\n5. يطبق قواعد اللعبة والهبوط الآمن أثناء المنافسة.\n6. يعبر عن سعادته عند أداء أنشطة الوثب والحجل.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: حبال\n\nالحصة 2:\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الوثب\n- الارتقاء\n- الطيران\n- الهبوط\n- الفراغ الخاص\n- الحجل\n- الوثب بقدم واحدة\n- الاتزان\n- المسار\n\nالحصة 2:\n- الوثب\n- الحجل\n- المحطات\n- المدى (قريب، بعيد)\n- المسابقة\n- الإيقاع\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة أرنب يقفز ويسأل: كيف يقفز الأرنب؟ ثم يؤدي وثبة ويسأل: على كم قدم ارتقيت وهبطت؟\n\nالحصة 2:\nيسأل المعلم: من يذكرني بالفرق بين الوثب والحجل؟ ثم يعرض أدوات المحطات ويسأل: كيف نتخطى الحبل؟ وكيف نتخطى الطوق؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف، وثب في المكان بالقدمين، ثني ومد الركبتين، ويقلد التلميذ حركات الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الوثب بالعد: (1) ثني الركبتين ومرجحة الذراعين خلفًا، (2) الدفع بالقدمين والذراعان أمامًا عاليًا، (3) الهبوط على المشطين بثني الركبتين، ثم الأداء الكامل (ص 69-70)، ويؤدي التلميذ الوثب بالعد ثم بشكل كامل داخل طوقه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 72: الوثب لأعلى بأوضاع مختلفة (الذراعان عاليًا، جانبًا)، ثم الوثب لأمام من طوق إلى طوق كالأرنب، ومن يصل آخر طوق بهبوط آمن يرفع يده، ويؤدي التلميذ الوثب بالأوضاع المختلفة ويهبط بثني الركبتين (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يراقب تلميذ وثب زميله ويخبره: هل هبط بهدوء بثني الركبتين؟ ثم يتبادلان، ويراقب التلميذ ويعطي تغذية راجعة لزميله ثم يؤدي (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يؤدي المعلم نموذج الحجل: الارتقاء والهبوط على القدم نفسها، الركبة الأخرى مرفوعة، الذراعان للاتزان، ثم تطبيق موجه في المكان ثم لأمام (ص 70-71)، ويحجل التلميذ في المكان ثم لأمام بالقدم اليمنى ثم اليسرى (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 ص 73: مسارات بأطواق مرتبة؛ يجرب التلميذ الحجل في المسار المستقيم ثم المتعرج ويكتشف أي القدمين أقوى لديه، ويستنتج مع المعلم لماذا نحتاج إلى تدريب القدمين معًا، ويجرب التلميذ بالقدمين ويعبر عن اكتشافه (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. لعبة (الفلامنجو): عند النداء يحجل الجميع، وعند الصافرة يثبت كل تلميذ على قدم واحدة، ومن يحافظ على ثباته أطول يفوز، ويلعب التلميذ ويحافظ على اتزانه (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة بإطالة الساقين والكاحلين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري ووثب في المكان وحجل بالتبادل، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج كل محطة مرة واحدة موضحًا الحركة المناسبة: الوثب فوق الحبل، الحجل بين الأقماع، الوثب من المقعد السويدي والهبوط على المرتبة، الوثب بالقدمين داخل الأطواق المتباعدة، ويشاهد التلميذ ويذكر الحركة المناسبة لكل محطة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 3 (محطات الوثب والحجل) ص 74: أربع مجموعات بقائد، تؤدي كل مجموعة محطتها دقائق ثم تنتقل بالإشارة، ويسجل القائد من أدى الهبوط الآمن، ويؤدي التلميذ الحركة الصحيحة لكل محطة ويساعد زملاءه (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. مسابقة: تؤدي كل مجموعة المسار كاملًا متتابعة، ونقطة للمجموعة التي تنهي دون إسقاط الأدوات، ويتسابق التلميذ بدقة وأمان (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 4 (ألعاب الوثب والحجل) ص 75: لعبة (الكنغر والحجلة): يثب التلاميذ بالقدمين عند نداء (كنغر) ويحجلون عند (حجلة)، ثم لعبة الوثب داخل المربعات المرقمة بالترتيب، ويلعب التلميذ مستجيبًا للنداء بالحركة الصحيحة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. نشاط 5 ص 76: مسابقة تتابع في قطارات: وثب فوق الحبل، حجل حول القمع، وثب داخل الطوق والعودة لتسليم الكرة للزميل، ويتسابق التلميذ مع مجموعته ويسلم الكرة بدقة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يسأل المعلم: لماذا فازت المجموعة الفائزة؟ ليستنتج التلاميذ أهمية السرعة مع الدقة والهبوط الآمن، ويستنتج التلميذ ويذكر سببًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وإطالة الساقين، وتعبير التلاميذ عن شعورهم، ويؤدي التلميذ التهدئة ويعبر عن شعوره (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما مراحل الوثب الثلاث؟\nالإجابة: الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): كيف نهبط بأمان بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): لماذا نمرجح الذراعين قبل الوثب؟\nالإجابة: لتساعدنا على الارتفاع والوصول أبعد.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.\n\nس4 (مستوى المعرفة): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا، والحجل بقدم واحدة.\nس5 (مستوى التطبيق): أين تكون الذراعان أثناء الحجل؟\nالإجابة: جانبًا للمحافظة على الاتزان.\nس6 (مستوى الاستدلال): لماذا نتدرب على الحجل بالقدمين؟\nالإجابة: لتقوية القدمين معًا وعدم الاعتماد على قدم واحدة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما الحركة المناسبة لتخطي الحبل؟\nالإجابة: الوثب بالقدمين.\nس2 (مستوى التطبيق): ما الحركة التي أديناها بين الأقماع؟\nالإجابة: الحجل.\nس3 (مستوى الاستدلال): لماذا نهبط على المرتبة بعد الوثب من المقعد؟\nالإجابة: لأن المرتبة تمتص الصدمة وتحمي الركبتين والكاحلين.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.\n\nس4 (مستوى المعرفة): ماذا تفعل عند نداء (كنغر)؟\nالإجابة: أثب بالقدمين معًا.\nس5 (مستوى التطبيق): ما الحركة التي أديتها حول القمع في التتابع؟\nالإجابة: الحجل.\nس6 (مستوى الاستدلال): لماذا تخسر المجموعة التي تسقط الحبل؟\nالإجابة: لأنها لم تؤدِّ الوثب بالطريقة الصحيحة فتخالف قواعد المسابقة.\n\n• نشاط علاجي (لمن لم يتقن): يوثب المعلم مع التلميذ بالقدمين من فوق خط على الأرض مع العد للمراحل (ارتقاء، وطيران، وهبوط) والهبوط على المشطين بثني الركبتين، ثم يسأله: كيف نهبط بأمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالوثب لأمام فوق حبال منخفضة متتالية، ثم الحجل بالقدم اليمنى ثم اليسرى، والمقارنة بين الوثب والحجل ودور مرجحة الذراعين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ وثبة لأمام من طوق إلى طوق.\nالإجابة: يثب بالقدمين معًا ويهبط داخل الطوق بثني الركبتين.\nس2 (مستوى التطبيق): ما الفرق بين الوثب لأعلى والوثب لأمام؟\nالإجابة: في الوثب لأعلى نرتفع ونهبط في المكان نفسه، وفي الوثب لأمام ننتقل إلى مكان أبعد.\nس3 (مستوى الاستدلال): زميلك يهبط بركبتين مفرودتين، بماذا تنصحه؟\nالإجابة: أنصحه بثني الركبتين عند الهبوط حتى لا يتأذى.\n\nس4 (مستوى المعرفة): احجل ثلاث مرات بالقدم اليسرى.\nالإجابة: يحجل بالقدم اليسرى دون لمس الأرض بالأخرى.\nس5 (مستوى التطبيق): أي قدميك كانت أقوى في الحجل؟ وكيف عرفت؟\nالإجابة: يذكر القدم ويعلل بأنه حجل بها مسافة أطول دون سقوط.\nس6 (مستوى الاستدلال): أرفع صورة طفل يقفز بقدم واحدة، ما اسم الحركة؟\nالإجابة: الحجل.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة المناسبة لكل منهما.\nالإجابة: الحبل: وثب، الأقماع: حجل (أو المقعد: وثب والهبوط على المرتبة).\nس2 (مستوى التطبيق): كيف نثب داخل أطواق متباعدة؟\nالإجابة: نثني الركبتين ونمرجح الذراعين بقوة لنصل إلى الطوق البعيد.\nس3 (مستوى الاستدلال): قائد المجموعة لاحظ هبوطًا خاطئًا، ماذا يقول لزميله؟\nالإجابة: اثنِ ركبتيك واهبط على المشطين بهدوء.\n\nس4 (مستوى المعرفة): اذكر لعبة رياضية يظهر فيها الوثب.\nالإجابة: كرة السلة أو الوثب الطويل أو الكرة الطائرة.\nس5 (مستوى التطبيق): أدِّ وثبًا فوق الحبل ثم حجلًا إلى القمع.\nالإجابة: يؤدي الحركتين بالتتابع الصحيح.\nس6 (مستوى الاستدلال): كيف شعرت في مسابقة اليوم ولماذا؟\nالإجابة: يعبر عن سعادته لأنه تعاون مع مجموعته وأدى الحركات بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الوثب بالقدمين داخل مربعات مرسومة بالطباشير مع الهبوط الهادئ (دليل المعلم ص 69-72).\nإرشاد لولي الأمر: تدرب مع طفلك على الحجل بكل قدم 5 مرات مع المحافظة على التوازن (دليل المعلم ص 70-73).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8\n\nالحصة 2:\nإرشاد لولي الأمر: ابنِ مع طفلك محطة بسيطة في المنزل (وسادة للوثب فوقها، خط للحجل) ومارساها بأمان (دليل المعلم ص 74).\nإرشاد لولي الأمر: شجع طفلك على لعبة (الحجلة) التقليدية في المنزل أو الحي، وراجعا مراحل الوثب الثلاث (دليل المعلم ص 75-77).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=8"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "العاشر", "date": "8-12/11/2026", "pages": "دليل المعلم ص 20-23، 36", "n": 1, "periods": [{"focus": "الممارسات الصحية: القوام السليم عند الجلوس والوقوف وحمل الحقيبة + المهرجان الرياضي التعليمي للحركات الأساسية (المشي والجري والوثب والحجل)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القوام السليم عند الوقوف والجلوس وحمل الحقيبة.\n2. يميز بين الوضع الصحيح والخاطئ من الصور.\n3. يطبق الوقوف والجلوس بقوام سليم.\n4. يوظف المشي والجري والوثب والحجل في أقسام المهرجان.\n5. يطبق الهبوط الآمن وقواعد المحطات أثناء المنافسة.\n6. يشارك بروح الفريق ويتقبل نتيجة مجموعته.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور القوام الصحيح والخاطئ\n- أخرى: حقيبة مدرسية\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: لوحة نقاط", "المفاهيم": "- القوام السليم\n- الوقوف المعتدل\n- الجلوس الصحيح\n- حمل الحقيبة على الكتفين\n- المهرجان الرياضي التعليمي\n- التتابع\n- الحركات الأساسية\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورتين لطفل يجلس معتدلًا وآخر منحنيًا ويسأل: أيهما يجلس بطريقة صحيحة؟ ولماذا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع التركيز على استقامة الظهر: مشي بكتاب على الرأس، جري خفيف ورأس مرفوع، ويؤدي التلميذ الإحماء محافظًا على الاعتدال (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الوقوف المعتدل والجلوس الصحيح وحمل الحقيبة على الكتفين، ويعرض الصور مع التفكير بصوت عالٍ عن أضرار الوضع الخاطئ (ص 36)، ويقلد التلميذ الأوضاع الصحيحة ويصحح الأوضاع الخاطئة في الصور (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلاميذ المشي بالكتاب على الرأس بظهر منحنٍ ثم بظهر مستقيم ويكتشفون متى يثبت الكتاب، فيستنتجون علاقة القوام بالاتزان، ويجرب التلميذ ويستنتج أن الظهر المستقيم يحفظ الاتزان (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال القوام): يجري التلاميذ وعند الصافرة يثبت كل تلميذ في وضع (وقوف معتدل) أو (جلوس صحيح) حسب النداء، ويفوز الأدق، ويستجيب التلميذ بالوضع الصحيح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم المشي (مسار المقعد السويدي والحواجز)، قسم الجري (جري متعرج بين الأقماع ذهابًا وإيابًا)، قسم الوثب (وثب فوق الحبال وداخل الأطواق والهبوط على المرتبة)، قسم الحجل (حجل بالقدمين بالتبادل بين الأقماع)، مع تسجيل نقاط الأداء والنظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم وينتقل بإشارة القائد (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مسابقة ختامية: تتابع مجمع (مشي، جري، وثب، حجل) بين المجموعات، ويتسابق التلميذ بدقة وسرعة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وإعلان النتائج وتكريم المشاركين، ويؤدي التلميذ التهدئة ويهنئ الفائزين (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف نحمل الحقيبة بطريقة صحيحة؟\nالإجابة: على الكتفين معًا وقريبة من الظهر.\nس2 (مستوى التطبيق): ما شكل الظهر عند الجلوس الصحيح؟\nالإجابة: مستقيم ومسنود على ظهر الكرسي.\nس3 (مستوى الاستدلال): ماذا حدث للكتاب عندما انحنى ظهرك؟\nالإجابة: سقط، لأن الاتزان يحتاج إلى قوام مستقيم.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ أمام مرآة أو صورة للقوام السليم، ويصحح وقوفه وجلوسه وحمل الحقيبة على الكتفين معًا، ثم يسأله: كيف نحمل الحقيبة بطريقة صحيحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالمشي حاملين كتابًا على الرأس بقوام مستقيم في مسار قصير، ثم تمييز الوضع الصحيح والخاطئ في صور ينفذها زملاؤهم.\n\nس4 (مستوى المعرفة): ما الحركات الأربع التي أديناها في المهرجان؟\nالإجابة: المشي، الجري، الوثب، الحجل.\nس5 (مستوى التطبيق): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم الوثب.\nس6 (مستوى الاستدلال): ما القاعدة الأهم عند الوثب على المرتبة؟\nالإجابة: الهبوط بثني الركبتين على المشطين.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ أمام مرآة أو صورة للقوام السليم، ويصحح وقوفه وجلوسه وحمل الحقيبة على الكتفين معًا، ثم يسأله: كيف نحمل الحقيبة بطريقة صحيحة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالمشي حاملين كتابًا على الرأس بقوام مستقيم في مسار قصير، ثم تمييز الوضع الصحيح والخاطئ في صور ينفذها زملاؤهم.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة طفل يحمل الحقيبة على كتف واحد، ما الخطأ؟\nالإجابة: حملها على كتف واحد يميل الجسم، والصحيح على الكتفين.\nس2 (مستوى التطبيق): قف بقوام سليم.\nالإجابة: يقف معتدلًا، الرأس مرفوع، الكتفان للخلف.\nس3 (مستوى الاستدلال): لماذا نهتم بالقوام السليم منذ الصغر؟\nالإجابة: لأن العادات الخاطئة تسبب تقوس الظهر وآلامه مستقبلًا.\n\nس4 (مستوى المعرفة): اذكر الحركة التي أديتها في قسم الحجل.\nالإجابة: الحجل بالقدم اليمنى ثم اليسرى بين الأقماع.\nس5 (مستوى التطبيق): كيف ساعدك قائد المجموعة اليوم؟\nالإجابة: نظم انتقالنا بين الأقسام وشجعنا.\nس6 (مستوى الاستدلال): مجموعتك لم تفز، ماذا تقول لزملائك؟\nالإجابة: لقد أدينا جيدًا وسنتدرب أكثر، جحة من أوضاع مختلفة.\n4. يشارك زملاءه أداء حركات الثني والمد والمرجحة في المحطات.\n5. يوظف المرجحة في مهارات بسيطة (مرجحة الذراع لرمي الكرة).\n6. يستمتع بمشاركة زملائه أنشطة الثني والمد والمرجحة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- صورة توضيحية\n- أخرى: مقاعد سويدية\n- أخرى: أقماع", "المفاهيم": "- الثني\n- المد\n- المرجحة\n- الحركات غير الانتقالية\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كم جزءًا من جسمك تستطيع ثنيه؟ ومده؟ ومرجحته؟ ويدع التلاميذ يجربون (ص 79)، ثم يعرض صور أرجوحة وذراع تمتد.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم ثني ومد الذراعين والركبتين بالعد، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 80: يطلب المعلم من التلاميذ أن يثنوا ويمدوا ويمرجحوا أجزاء مختلفة من أوضاع (وقوف، جلوس، رقود) ويكتشفوا أي الأجزاء تتحرك أكثر، ثم يصوغ معهم تعريف كل حركة، ويجرب التلميذ الحركات ويعبر عن اكتشافه ثم يكرر التعريف (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. يعرض المعلم نماذج: ثني الجذع أمامًا ومده، مرجحة الذراعين أمامًا وخلفًا، مرجحة الرجل جانبًا من الوقوف بمسك الطوق، مع التطبيق الموجه ثم المستقل، ويؤدي التلميذ النماذج بعد المعلم ثم مستقلًا (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. لعبة (الآلة): يرفع المعلم بطاقة (ثني) أو (مد) أو (مرجحة) ويؤدي التلميذ الحركة بالجزء الذي يناديه، ومن يخطئ يصبح مساعدًا للمعلم، ويستجيب التلميذ بالحركة الصحيحة والجزء الصحيح (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نشاط 2 (محطات الثني والمد والمرجحة) ص 82: محطة الجلوس على المقعد وثني ومد الرجلين، محطة الرقود ومد الذراعين فوق الرأس وثنيهما، محطة مرجحة الذراع لرمي الكرة في الطوق، محطة مرجحة الرجل فوق القمع، مع التبديل، ويؤدي التلميذ حركة المحطة بدقة ويعاون مجموعته (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 3 (ألعاب) ص 83: لعبة (المرآة) في أزواج: يؤدي تلميذ حركة ثني أو مد أو مرجحة ويقلدها زميله كالمرآة، ثم لعبة النداء على الحركة والجزء، ويلعب التلميذ ويقلد بدقة ويتبادل الأدوار (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا كانت الكرة تصل أبعد عند مرجحة الذراع للخلف أكثر؟ ليستنتج التلاميذ علاقة المرجحة بالقوة، ويستنتج التلميذ ويذكر مثالًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة بإطالة الظهر والذراعين، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة التي تقرب الساعد من العضد؟\nالإجابة: الثني.\nس2 (مستوى التطبيق): اذكر جزءًا من الجسم يمكن مرجحته.\nالإجابة: الذراع أو الرجل.\nس3 (مستوى الاستدلال): ما الفرق بين الثني والمد؟\nالإجابة: الثني تقريب جزأين من الجسم، والمد إبعادهما واستقامتهما.\n\n• نشاط علاجي (لمن لم يتقن): يثني المعلم مع التلميذ الذراع ويمدها ببطء أمام مرآة، ثم يمرجحان الذراع والرجل مع العد، ثم يطلب منه أداء حركة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.\n\nس4 (مستوى المعرفة): ما الحركة التي نؤديها بالذراع قبل رمي الكرة؟\nالإجابة: المرجحة.\nس5 (مستوى التطبيق): في محطة المقعد، ما الحركتان اللتان أديناهما بالرجلين؟\nالإجابة: الثني والمد.\nس6 (مستوى الاستدلال): كيف تساعدنا المرجحة على رمي الكرة أبعد؟\nالإجابة: تعطي الذراع قوة وسرعة أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يثني المعلم مع التلميذ الذراع ويمدها ببطء أمام مرآة، ثم يمرجحان الذراع والرجل مع العد، ثم يطلب منه أداء حركة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مرجحة للذراعين أمامًا وخلفًا.\nالإجابة: يمرجح الذراعين بانتظام.\nس2 (مستوى التطبيق): من وضع الجلوس، ما الحركة التي تحرك فيها الجذع للأمام نحو القدمين؟\nالإجابة: ثني الجذع.\nس3 (مستوى الاستدلال): هل نستطيع مرجحة الجذع؟ وكيف؟\nالإجابة: نعم، بتبادل ميل الجذع للجانبين من الوقوف والذراعان عاليًا.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة فيهما.\nالإجابة: محطة الكرة: مرجحة الذراع، محطة المقعد: ثني ومد الرجلين.\nس5 (مستوى التطبيق): في لعبة المرآة، زميلك ثنى جذعه للأمام، ماذا تفعل؟\nالإجابة: أثني جذعي للأمام مثله تمامًا.\nس6 (مستوى الاستدلال): اذكر مهارة رياضية فيها مرجحة.\nالإجابة: رمي الكرة، أو ركل الكرة (مرجحة الرجل)، أو التأرجح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاث حركات (ثني ومد الذراعين، مرجحة الرجل) أمام المرآة (دليل المعلم ص 79-80).\nإرشاد لولي الأمر: العب مع طفلك لعبة (المرآة) بحركات الثني والمد والمرجحة، وراجعا صور المحطات في دليل المعلم ص 82-83.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركات الثني والمد والمرجحة.\n2. يحدد أجزاء الجسم التي يمكن ثنيها ومدها ومرجحتها.\n3. يؤدي تمرينات للثني والمد والمرجحة من أوضاع مختلفة.\n4. يشارك زملاءه أداء حركات الثني والمد والمرجحة في المحطات.\n5. يوظف المرجحة في مهارات بسيطة (مرجحة الذراع لرمي الكرة).\n6. يستمتع بمشاركة زملائه أنشطة الثني والمد والمرجحة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- صورة توضيحية\n- أخرى: مقاعد سويدية\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الثني\n- المد\n- المرجحة\n- الحركات غير الانتقالية\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كم جزءًا من جسمك تستطيع ثنيه؟ ومده؟ ومرجحته؟ ويدع التلاميذ يجربون (ص 79)، ثم يعرض صور أرجوحة وذراع تمتد.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف ثم ثني ومد الذراعين والركبتين بالعد، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n
