ة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.\n\nس4 (مستوى المعرفة): ما الحركة التي نؤديها بالذراع قبل رمي الكرة؟\nالإجابة: المرجحة.\nس5 (مستوى التطبيق): في محطة المقعد، ما الحركتان اللتان أديناهما بالرجلين؟\nالإجابة: الثني والمد.\nس6 (مستوى الاستدلال): كيف تساعدنا المرجحة على رمي الكرة أبعد؟\nالإجابة: تعطي الذراع قوة وسرعة أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يثني المعلم مع التلميذ الذراع ويمدها ببطء أمام مرآة، ثم يمرجحان الذراع والرجل مع العد، ثم يطلب منه أداء حركة الثني عند النداء.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأداء محطة ثلاثية (ثني، ومد، ومرجحة) لأجزاء مختلفة من الجسم وتسميتها، وتوضيح الفرق بين الثني والمد بمثال.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ مرجحة للذراعين أمامًا وخلفًا.\nالإجابة: يمرجح الذراعين بانتظام.\nس2 (مستوى التطبيق): من وضع الجلوس، ما الحركة التي تحرك فيها الجذع للأمام نحو القدمين؟\nالإجابة: ثني الجذع.\nس3 (مستوى الاستدلال): هل نستطيع مرجحة الجذع؟ وكيف؟\nالإجابة: نعم، بتبادل ميل الجذع للجانبين من الوقوف والذراعان عاليًا.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم والحركة فيهما.\nالإجابة: محطة الكرة: مرجحة الذراع، محطة المقعد: ثني ومد الرجلين.\nس5 (مستوى التطبيق): في لعبة المرآة، زميلك ثنى جذعه للأمام، ماذا تفعل؟\nالإجابة: أثني جذعي للأمام مثله تمامًا.\nس6 (مستوى الاستدلال): اذكر مهارة رياضية فيها مرجحة.\nالإجابة: رمي الكرة، أو ركل الكرة (مرجحة الرجل)، أو التأرجح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاث حركات (ثني ومد الذراعين، مرجحة الرجل) أمام المرآة (دليل المعلم ص 79-80).\nإرشاد لولي الأمر: العب مع طفلك لعبة (المرآة) بحركات الثني والمد والمرجحة، وراجعا صور المحطات في دليل المعلم ص 82-83.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=10"}}, {"title": "دحرجة الكرة والتقاطها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 88-95", "n": 1, "periods": [{"focus": "دحرجة الكرة بكلتا اليدين وبيد واحدة والتقاطها + منافسات وألعاب دحرجة الكرة والتقاطها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي دحرجة الكرة والتقاطها ونقاطهما الفنية.\n2. يؤدي دحرجة الكرة بكلتا اليدين وبيد واحدة في مسار.\n3. يلتقط الكرة المتدحرجة بثني الركبتين وانتشار الأصابع.\n4. يوظف دحرجة الكرة والتقاطها في منافسات وألعاب.\n5. يصوّب الكرة المتدحرجة نحو هدف بدقة.\n6. يشعر بالسعادة عند مشاركة زملائه أداء دحرجة الكرة والتقاطها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صولجانات\n- صورة توضيحية", "المفاهيم": "- الدحرجة\n- الالتقاط\n- التوافق\n- المسار\n- الدقة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يدحرج المعلم كرة نحو تلميذ ويسأل: كيف تتحرك الكرة؟ وكيف أمسكتها؟ ثم يعرض صور الدحرجة والالتقاط في البولينج وكرة القدم.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف مع كرة في اليد، ثني ومد الركبتين حاملًا الكرة، ويقلد التلميذ الإحماء بالكرة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الدحرجة: ثني الركبتين وميل الجذع، مرجحة الذراع خلفًا ثم أمامًا ودفع الكرة على الأرض بأطراف الأصابع؛ ثم الالتقاط: القدمان متباعدتان، ثني الركبتين، مد الذراعين أسفل والكفان متواجهتان وسحب الكرة للصدر (ص 89-90)، ويؤدي التلميذ الدحرجة بكلتا اليدين ثم بيد واحدة، ويلتقط الكرة بالطريقة الصحيحة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 91: دحرجة الكرة في مسارات مستقيمة ومتعرجة بين الأقماع نحو هدف (طوق)؛ يجرب التلميذ قوة الدفع ويكتشف متى تخرج الكرة عن المسار ومتى تصل الهدف، ويجرب التلميذ ويستنتج أن الدفع المعتدل وتصويب اليد نحو الهدف يبقيان الكرة في المسار (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 92: في أزواج متقابلين على مسافة 3 أمتار، تبادل الدحرجة والالتقاط مع العد، وزيادة المسافة تدريجيًا، ويتبادل التلميذ مع زميله ويزيد المسافة بعد 5 التقاطات ناجحة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (منافسات دحرجة الكرة) ص 93: في مجموعات متقابلة، كل مجموعة تدحرج الكرة لإسقاط صولجانات المجموعة الأخرى من مسافة 4 أمتار وتلتقط الكرات القادمة، وتحسب النقاط، ويدحرج التلميذ نحو الهدف ويلتقط الكرات القادمة ويعد نقاط مجموعته (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 (ألعاب) ص 94: لعبة (الكرة النارية): تلاميذ الدائرة يدحرجون الكرة لمحاولة لمس قدمي من في المنتصف، ومن تلمسه يستبدل، ثم لعبة تمرير الكرة بالدحرجة بين رجلي الزملاء في القطار، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض دون رفع الكرة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا أصابت بعض الكرات الصولجان وأخطأت أخرى؟ ليستنتج التلاميذ أهمية النظر إلى الهدف وتوجيه اليد نحوه، ويستنتج التلميذ ويذكر نصيحة (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة والتعبير عن الشعور بعد المنافسة، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): كيف ندحرج الكرة على الأرض؟\nالإجابة: نثني الركبتين ونمرجح الذراع ثم ندفع الكرة بالأصابع على الأرض.\nس2 (مستوى التطبيق): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين أمام الجسم والأصابع منتشرة.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين عند الالتقاط؟\nالإجابة: لننزل إلى مستوى الكرة فنلتقطها بأمان.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.\n\nس4 (مستوى المعرفة): كيف نصيب الصولجان بالكرة المتدحرجة؟\nالإجابة: ننظر إلى الهدف ونوجه اليد نحوه عند الدفع.\nس5 (مستوى التطبيق): ما القاعدة في لعبة الكرة النارية؟\nالإجابة: تبقى الكرة على الأرض بالدحرجة ولا ترفع.\nس6 (مستوى الاستدلال): كيف تساعد مجموعتك في المنافسة؟\nالإجابة: أدحرج بدقة وألتقط الكرات القادمة بسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.", "التقويم الختامي": "س1 (مستوى المعرفة): دحرج الكرة بيد واحدة لتصل إلى الطوق.\nالإجابة: يدحرج الكرة في اتجاه الطوق بدفع معتدل.\nس2 (مستوى التطبيق): ماذا يحدث لو دفعت الكرة بقوة كبيرة في المسار المتعرج؟\nالإجابة: تخرج عن المسار وتصطدم بالأقماع.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها دحرجة الكرة.\nالإجابة: البولينج أو كرة القدم (تمرير أرضي).\n\nس4 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم استخدمنا فيها الدحرجة.\nالإجابة: الكرة النارية أو تمرير الكرة بين الرجلين في القطار.\nس5 (مستوى التطبيق): دحرج الكرة لتسقط الصولجان من مسافة 3 أمتار.\nالإجابة: يدحرج بدقة نحو الصولجان.\nس6 (مستوى الاستدلال): كيف شعرت عندما التقطت كرة صعبة؟\nالإجابة: يعبر عن سعادته وثقته بنفسه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طفلك دحرجة كرة والتقاطها في المنزل من مسافة 3 أمتار مع ثني الركبتين (دليل المعلم ص 89-92).\nإرشاد لولي الأمر: العب مع طفلك لعبة إسقاط زجاجات بلاستيكية فارغة بدحرجة الكرة، وشجعه على الالتقاط الصحيح (دليل المعلم ص 93-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=11"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي دحرجة الكرة والتقاطها ونقاطهما الفنية.\n2. يؤدي دحرجة الكرة بكلتا اليدين وبيد واحدة في مسار.\n3. يلتقط الكرة المتدحرجة بثني الركبتين وانتشار الأصابع.\n4. يوظف دحرجة الكرة والتقاطها في منافسات وألعاب.\n5. يصوّب الكرة المتدحرجة نحو هدف بدقة.\n6. يشعر بالسعادة عند مشاركة زملائه أداء دحرجة الكرة والتقاطها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صولجانات\n- صورة توضيحية", "المفاهيم": "الحصة 1:\n- الدحرجة\n- الالتقاط\n- التوافق\n- المسار\n- الدقة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيدحرج المعلم كرة نحو تلميذ ويسأل: كيف تتحرك الكرة؟ وكيف أمسكتها؟ ثم يعرض صور الدحرجة والالتقاط في البولينج وكرة القدم.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف مع كرة في اليد، ثني ومد الركبتين حاملًا الكرة، ويقلد التلميذ الإحماء بالكرة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الدحرجة: ثني الركبتين وميل الجذع، مرجحة الذراع خلفًا ثم أمامًا ودفع الكرة على الأرض بأطراف الأصابع؛ ثم الالتقاط: القدمان متباعدتان، ثني الركبتين، مد الذراعين أسفل والكفان متواجهتان وسحب الكرة للصدر (ص 89-90)، ويؤدي التلميذ الدحرجة بكلتا اليدين ثم بيد واحدة، ويلتقط الكرة بالطريقة الصحيحة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 91: دحرجة الكرة في مسارات مستقيمة ومتعرجة بين الأقماع نحو هدف (طوق)؛ يجرب التلميذ قوة الدفع ويكتشف متى تخرج الكرة عن المسار ومتى تصل الهدف، ويجرب التلميذ ويستنتج أن الدفع المعتدل وتصويب اليد نحو الهدف يبقيان الكرة في المسار (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 92: في أزواج متقابلين على مسافة 3 أمتار، تبادل الدحرجة والالتقاط مع العد، وزيادة المسافة تدريجيًا، ويتبادل التلميذ مع زميله ويزيد المسافة بعد 5 التقاطات ناجحة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (منافسات دحرجة الكرة) ص 93: في مجموعات متقابلة، كل مجموعة تدحرج الكرة لإسقاط صولجانات المجموعة الأخرى من مسافة 4 أمتار وتلتقط الكرات القادمة، وتحسب النقاط، ويدحرج التلميذ نحو الهدف ويلتقط الكرات القادمة ويعد نقاط مجموعته (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 (ألعاب) ص 94: لعبة (الكرة النارية): تلاميذ الدائرة يدحرجون الكرة لمحاولة لمس قدمي من في المنتصف، ومن تلمسه يستبدل، ثم لعبة تمرير الكرة بالدحرجة بين رجلي الزملاء في القطار، ويلعب التلميذ ملتزمًا بالدحرجة على الأرض دون رفع الكرة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا أصابت بعض الكرات الصولجان وأخطأت أخرى؟ ليستنتج التلاميذ أهمية النظر إلى الهدف وتوجيه اليد نحوه، ويستنتج التلميذ ويذكر نصيحة (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة والتعبير عن الشعور بعد المنافسة، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): كيف ندحرج الكرة على الأرض؟\nالإجابة: نثني الركبتين ونمرجح الذراع ثم ندفع الكرة بالأصابع على الأرض.\nس2 (مستوى التطبيق): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين أمام الجسم والأصابع منتشرة.\nس3 (مستوى الاستدلال): لماذا نثني الركبتين عند الالتقاط؟\nالإجابة: لننزل إلى مستوى الكرة فنلتقطها بأمان.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.\n\nس4 (مستوى المعرفة): كيف نصيب الصولجان بالكرة المتدحرجة؟\nالإجابة: ننظر إلى الهدف ونوجه اليد نحوه عند الدفع.\nس5 (مستوى التطبيق): ما القاعدة في لعبة الكرة النارية؟\nالإجابة: تبقى الكرة على الأرض بالدحرجة ولا ترفع.\nس6 (مستوى الاستدلال): كيف تساعد مجموعتك في المنافسة؟\nالإجابة: أدحرج بدقة وألتقط الكرات القادمة بسرعة.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ على مسافة قصيرة، ويدحرجان كرة كبيرة بكلتا اليدين ويلتقطانها بثني الركبتين وانتشار الأصابع، ثم يسأله: لماذا نثني الركبتين عند الالتقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بدحرجة الكرة بيد واحدة لتمر بين قمعين على مسافة أبعد، والتقاطها من زميل يدحرجها بسرعة أكبر، وتسجيل عدد المحاولات الناجحة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): دحرج الكرة بيد واحدة لتصل إلى الطوق.\nالإجابة: يدحرج الكرة في اتجاه الطوق بدفع معتدل.\nس2 (مستوى التطبيق): ماذا يحدث لو دفعت الكرة بقوة كبيرة في المسار المتعرج؟\nالإجابة: تخرج عن المسار وتصطدم بالأقماع.\nس3 (مستوى الاستدلال): سمِّ لعبة رياضية فيها دحرجة الكرة.\nالإجابة: البولينج أو كرة القدم (تمرير أرضي).\n\nس4 (مستوى المعرفة): اذكر لعبة من ألعاب اليوم استخدمنا فيها الدحرجة.\nالإجابة: الكرة النارية أو تمرير الكرة بين الرجلين في القطار.\nس5 (مستوى التطبيق): دحرج الكرة لتسقط الصولجان من مسافة 3 أمتار.\nالإجابة: يدحرج بدقة نحو الصولجان.\nس6 (مستوى الاستدلال): كيف شعرت عندما التقطت كرة صعبة؟\nالإجابة: يعبر عن سعادته وثقته بنفسه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طفلك دحرجة كرة والتقاطها في المنزل من مسافة 3 أمتار مع ثني الركبتين (دليل المعلم ص 89-92).\nإرشاد لولي الأمر: العب مع طفلك لعبة إسقاط زجاجات بلاستيكية فارغة بدحرجة الكرة، وشجعه على الالتقاط الصحيح (دليل المعلم ص 93-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=11"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 20-23", "n": 1, "periods": [{"focus": "الممارسات الصحية: شرب الماء والغذاء الصحي قبل النشاط وبعده + المهرجان الرياضي التعليمي للمعالجة والتناول (الدحرجة والالتقاط) والحركات الأساسية", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية شرب الماء قبل النشاط وبعده.\n2. يميز بين الأطعمة الصحية وغير الصحية للرياضي الصغير.\n3. يقدر أثر الغذاء الصحي في نشاط الجسم.\n4. يوظف دحرجة الكرة والتقاطها والحركات الأساسية في أقسام المهرجان.\n5. يطبق قواعد الأقسام والالتزام بالدور.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: زجاجات ماء\n- أخرى: بطاقات صور أطعمة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- الماء\n- الغذاء الصحي\n- العرق\n- الطاقة\n- المهرجان الرياضي التعليمي\n- الدحرجة\n- الالتقاط\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "بعد جري قصير يسأل المعلم: بماذا تشعرون؟ (عطش، عرق) ويعرض زجاجة ماء وصور فواكه وحلويات ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم ثم وقفة لشرب الماء بطريقة صحيحة (رشفات صغيرة)، ويؤدي التلميذ الإحماء ويشرب الماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الصور ويفكر بصوت عالٍ: الجسم يفقد الماء بالعرق فنعوضه بالماء لا المشروبات الغازية؛ الفواكه والخضار والحليب تعطي طاقة، والحلويات الكثيرة تضر، ويذكر برنامج (صحتي) ص 23، ويستمع التلميذ ويصنف الصور إلى صحي وغير صحي (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (سلة الصحة): طوقان (صحي، غير صحي)، يجري كل تلميذ ويسحب بطاقة طعام ويضعها في الطوق المناسب، ونقطة لكل تصنيف صحيح، ويجري التلميذ ويصنف البطاقة بسرعة ودقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة (وجبة رياضي صغير) من البطاقات الصحية وتعرضها، والتلاميذ يتعاون في اختيار البطاقات ويعرض الوجبة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم الدحرجة نحو الصولجانات، قسم الالتقاط (تبادل الدحرجة والالتقاط في أزواج)، قسم الوثب والحجل بالكرة بين اليدين داخل الأطواق، قسم الجري المتعرج بالكرة حول الأقماع، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته بقيادة القائد (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مسابقة ختامية: تتابع دحرجة الكرة والالتقاط بين المجموعات، ويتسابق التلميذ بدقة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس2 (مستوى التطبيق): اذكر طعامين صحيين.\nالإجابة: التفاح والحليب (أو أي فاكهة أو خضار).\nس3 (مستوى الاستدلال): هل المشروبات الغازية تعوض الماء؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير ولا تروي الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه الصولجانات؟\nالإجابة: قسم الدحرجة.\nس5 (مستوى التطبيق): كيف نلتقط الكرة المتدحرجة في قسم الالتقاط؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس6 (مستوى الاستدلال): لماذا نسجل نقاطًا للنظام والتعاون؟\nالإجابة: لأن المهرجان يعلمنا النظام والتعاون مع المهارة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.", "التقويم الختامي": "س1 (مستوى المعرفة): متى نشرب الماء في يوم الرياضة؟\nالإجابة: قبل الحصة وبعدها، وبرشفات صغيرة أثناءها.\nس2 (مستوى التطبيق): أرفع صورة قطعة حلوى كبيرة، في أي طوق نضعها؟\nالإجابة: طوق غير صحي.\nس3 (مستوى الاستدلال): كوّن وجبة فطور صحية للرياضي الصغير.\nالإجابة: مثل: حليب، خبز، بيض أو فاكهة.\n\nس4 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم الدحرجة وقسم الالتقاط (أو الوثب بالكرة، الجري المتعرج).\nس5 (مستوى التطبيق): ما دور قائد المجموعة؟\nالإجابة: ينظم الدور ويشجع زملاءه وينقلهم بين الأقسام.\nس6 (مستوى الاستدلال): ماذا تقول لزميل غضب لأن مجموعته خسرت؟\nالإجابة: المشاركة أهم من الفوز، وسنتدرب ونفوز في المرة القادمة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز لطفلك زجاجة ماء وفاكهة في يوم الحصة، وناقشا معًا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وراجعا دحرجة الكرة والتقاطها (دليل المعلم ص 88-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=12"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية شرب الماء قبل النشاط وبعده.\n2. يميز بين الأطعمة الصحية وغير الصحية للرياضي الصغير.\n3. يقدر أثر الغذاء الصحي في نشاط الجسم.\n4. يوظف دحرجة الكرة والتقاطها والحركات الأساسية في أقسام المهرجان.\n5. يطبق قواعد الأقسام والالتزام بالدور.\n6. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: زجاجات ماء\n- أخرى: بطاقات صور أطعمة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- الماء\n- الغذاء الصحي\n- العرق\n- الطاقة\n- المهرجان الرياضي التعليمي\n- الدحرجة\n- الالتقاط\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nبعد جري قصير يسأل المعلم: بماذا تشعرون؟ (عطش، عرق) ويعرض زجاجة ماء وصور فواكه وحلويات ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم ثم وقفة لشرب الماء بطريقة صحيحة (رشفات صغيرة)، ويؤدي التلميذ الإحماء ويشرب الماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الصور ويفكر بصوت عالٍ: الجسم يفقد الماء بالعرق فنعوضه بالماء لا المشروبات الغازية؛ الفواكه والخضار والحليب تعطي طاقة، والحلويات الكثيرة تضر، ويذكر برنامج (صحتي) ص 23، ويستمع التلميذ ويصنف الصور إلى صحي وغير صحي (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (سلة الصحة): طوقان (صحي، غير صحي)، يجري كل تلميذ ويسحب بطاقة طعام ويضعها في الطوق المناسب، ونقطة لكل تصنيف صحيح، ويجري التلميذ ويصنف البطاقة بسرعة ودقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تكوّن كل مجموعة (وجبة رياضي صغير) من البطاقات الصحية وتعرضها، والتلاميذ يتعاون في اختيار البطاقات ويعرض الوجبة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم الدحرجة نحو الصولجانات، قسم الالتقاط (تبادل الدحرجة والالتقاط في أزواج)، قسم الوثب والحجل بالكرة بين اليدين داخل الأطواق، قسم الجري المتعرج بالكرة حول الأقماع، مع تسجيل النقاط، ويؤدي التلميذ مهام الأقسام مع مجموعته بقيادة القائد (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مسابقة ختامية: تتابع دحرجة الكرة والالتقاط بين المجموعات، ويتسابق التلميذ بدقة (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تهدئة وتكريم جميع المشاركين، ويؤدي التلميذ التهدئة ويهنئ (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس2 (مستوى التطبيق): اذكر طعامين صحيين.\nالإجابة: التفاح والحليب (أو أي فاكهة أو خضار).\nس3 (مستوى الاستدلال): هل المشروبات الغازية تعوض الماء؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير ولا تروي الجسم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.\n\nس4 (مستوى المعرفة): ما القسم الذي استخدمنا فيه الصولجانات؟\nالإجابة: قسم الدحرجة.\nس5 (مستوى التطبيق): كيف نلتقط الكرة المتدحرجة في قسم الالتقاط؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس6 (مستوى الاستدلال): لماذا نسجل نقاطًا للنظام والتعاون؟\nالإجابة: لأن المهرجان يعلمنا النظام والتعاون مع المهارة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أطعمة ومشروبات، ويفرزها مع التلميذ إلى صحية وغير صحية، ويشربان الماء معًا بعد اللعب، ثم يسأله: اذكر طعامين صحيين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد وجبة صحية مرسومة للرياضي الصغير مع مشروبها المناسب، وتفسير لماذا لا تعوض المشروبات الغازية الماء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): متى نشرب الماء في يوم الرياضة؟\nالإجابة: قبل الحصة وبعدها، وبرشفات صغيرة أثناءها.\nس2 (مستوى التطبيق): أرفع صورة قطعة حلوى كبيرة، في أي طوق نضعها؟\nالإجابة: طوق غير صحي.\nس3 (مستوى الاستدلال): كوّن وجبة فطور صحية للرياضي الصغير.\nالإجابة: مثل: حليب، خبز، بيض أو فاكهة.\n\nس4 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم الدحرجة وقسم الالتقاط (أو الوثب بالكرة، الجري المتعرج).\nس5 (مستوى التطبيق): ما دور قائد المجموعة؟\nالإجابة: ينظم الدور ويشجع زملاءه وينقلهم بين الأقسام.\nس6 (مستوى الاستدلال): ماذا تقول لزميل غضب لأن مجموعته خسرت؟\nالإجابة: المشاركة أهم من الفوز، وسنتدرب ونفوز في المرة القادمة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز لطفلك زجاجة ماء وفاكهة في يوم الحصة، وناقشا معًا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وراجعا دحرجة الكرة والتقاطها (دليل المعلم ص 88-95).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=12"}}, {"title": "رمي الكرة واستلامها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 96-105", "n": 1, "periods": [{"focus": "رمي الكرة بكلتا اليدين واستلامها من مستويات مختلفة + محطات ومنافسات رمي الكرة واستلامها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة رمي الكرة واستلامها وبعض أنواعها.\n2. يؤدي رمي الكرة بكلتا اليدين من أمام الصدر واستلامها.\n3. يميز مستويات استلام الكرة (عالية، متوسطة، منخفضة).\n4. يوظف رمي الكرة واستلامها في أداء بعض مهارات الألعاب الرياضية.\n5. يرمي الكرة بدقة نحو هدف (طوق، مربع مرقم).\n6. يشارك زملاءه أداء أنشطة متنوعة لرمي الكرة واستلامها بسعادة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: مربعات الأعداد\n- أخرى: سلال بلاستيكية\n- أخرى: حواجز منخفضة", "المفاهيم": "- الرمي\n- الاستلام\n- اللقف\n- المستوى\n- الاتجاه\n- الدقة\n- التصويب\n- التتابع", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الكرة لتلميذ من مستوى الصدر ثم عاليًا ثم منخفضًا ويسأل: كيف تغيرت طريقة استلامك؟ ويعرض صور الرمي في كرة اليد والسلة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري بالكرة، رمي الكرة عاليًا واستلامها في المكان، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بكلتا اليدين من أمام الصدر (قدم متقدمة، ثني الذراعين ثم مدهما نحو الهدف) والاستلام (مد الذراعين نحو الكرة، الأصابع منتشرة، سحب الكرة للصدر، وثني الركبتين للكرات المنخفضة) من دليل المعلم ص 97-100، ويؤدي التلميذ الرمي والاستلام بعد النموذج أمام الحائط ثم مع زميل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 101: رمي الكرة واستلامها من مستويات مختلفة؛ يجرب التلميذ استلام الكرة العالية والمتوسطة والمنخفضة ويكتشف وضع الكفين المناسب لكل مستوى (الإبهامان متقابلان للعالية، الخنصران متقاربان للمنخفضة)، ويجرب التلميذ ويستنتج وضع الكفين لكل مستوى (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 102: في أزواج تبادل الرمي والاستلام من مسافة 3 أمتار مع العد المتواصل، ومن يصل 10 يرفع يده، ويتبادل التلميذ ويعد مع زميله (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (محطات رمي الكرة واستلامها) ص 103: محطة الرمي داخل السلة من 3 أمتار، محطة الرمي فوق الحاجز المنخفض واستلام الزميل، محطة الرمي على مربعات الأعداد بالترتيب، محطة الرمي على الحائط والاستلام، مع التبديل وتسجيل النقاط، ويؤدي التلميذ مهمة المحطة بدقة ويعاون مجموعته (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 (منافسات) ص 104: مسابقة التتابع في قطارات بالرمي والاستلام مع القائد المقابل، والمجموعة التي تنهي أولًا دون سقوط الكرة تفوز، ويتسابق التلميذ ويستلم ويرمي بسرعة ودقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا سقطت الكرة من بعض الزملاء؟ ليستنتج التلاميذ أهمية النظر إلى الكرة ومد الذراعين نحوها، ويستنتج التلميذ ويذكر نصيحة لزميله (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر بمد الذراعين نحو الهدف.\nس2 (مستوى التطبيق): كيف تكون الأصابع عند الاستلام؟\nالإجابة: منتشرة والكفان نحو الكرة.\nس3 (مستوى الاستدلال): ماذا نفعل لاستلام الكرة المنخفضة؟\nالإجابة: نثني الركبتين وننزل الذراعين للأسفل.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.\n\nس4 (مستوى المعرفة): كيف نصيب السلة برميتنا؟\nالإجابة: ننظر إلى السلة ونمد الذراعين نحوها عند الرمي.\nس5 (مستوى التطبيق): في أي محطة رمينا الكرة فوق الحاجز؟\nالإجابة: محطة الرمي فوق الحاجز المنخفض واستلام الزميل.\nس6 (مستوى الاستدلال): ماذا نفعل لنستلم الكرة دون أن تسقط؟\nالإجابة: ننظر إلى الكرة ونمد الذراعين نحوها ونسحبها للصدر.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (مستوى التطبيق): ما وضع الإبهامين عند استلام الكرة العالية؟\nالإجابة: متقابلان خلف الكرة.\nس3 (مستوى الاستدلال): سمِّ لعبتين فيهما رمي الكرة واستلامها.\nالإجابة: كرة اليد وكرة السلة.\n\nس4 (مستوى المعرفة): ارمِ الكرة لتصيب المربع رقم 3.\nالإجابة: يرمي بدقة نحو المربع المحدد.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة السلة ومحطة مربعات الأعداد (أو الحاجز، الحائط).\nس6 (مستوى الاستدلال): كيف تساعد زميلك الذي تسقط منه الكرة كثيرًا؟\nالإجابة: أرمي له الكرة بلطف وأذكره بالنظر إليها ومد ذراعيه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طفلك رمي كرة خفيفة واستلامها من مستويات مختلفة لمدة 10 دقائق (دليل المعلم ص 97-102).\nإرشاد لولي الأمر: العب مع طفلك رمي الكرة في سلة أو طوق من مسافات مختلفة، وشجعه على الاستلام الصحيح (دليل المعلم ص 103-105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة رمي الكرة واستلامها وبعض أنواعها.\n2. يؤدي رمي الكرة بكلتا اليدين من أمام الصدر واستلامها.\n3. يميز مستويات استلام الكرة (عالية، متوسطة، منخفضة).\n4. يوظف رمي الكرة واستلامها في أداء بعض مهارات الألعاب الرياضية.\n5. يرمي الكرة بدقة نحو هدف (طوق، مربع مرقم).\n6. يشارك زملاءه أداء أنشطة متنوعة لرمي الكرة واستلامها بسعادة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n- أخرى: مربعات الأعداد\n- أخرى: سلال بلاستيكية\n- أخرى: حواجز منخفضة", "المفاهيم": "الحصة 1:\n- الرمي\n- الاستلام\n- اللقف\n- المستوى\n- الاتجاه\n- الدقة\n- التصويب\n- التتابع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم الكرة لتلميذ من مستوى الصدر ثم عاليًا ثم منخفضًا ويسأل: كيف تغيرت طريقة استلامك؟ ويعرض صور الرمي في كرة اليد والسلة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري بالكرة، رمي الكرة عاليًا واستلامها في المكان، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بكلتا اليدين من أمام الصدر (قدم متقدمة، ثني الذراعين ثم مدهما نحو الهدف) والاستلام (مد الذراعين نحو الكرة، الأصابع منتشرة، سحب الكرة للصدر، وثني الركبتين للكرات المنخفضة) من دليل المعلم ص 97-100، ويؤدي التلميذ الرمي والاستلام بعد النموذج أمام الحائط ثم مع زميل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 101: رمي الكرة واستلامها من مستويات مختلفة؛ يجرب التلميذ استلام الكرة العالية والمتوسطة والمنخفضة ويكتشف وضع الكفين المناسب لكل مستوى (الإبهامان متقابلان للعالية، الخنصران متقاربان للمنخفضة)، ويجرب التلميذ ويستنتج وضع الكفين لكل مستوى (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 102: في أزواج تبادل الرمي والاستلام من مسافة 3 أمتار مع العد المتواصل، ومن يصل 10 يرفع يده، ويتبادل التلميذ ويعد مع زميله (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (محطات رمي الكرة واستلامها) ص 103: محطة الرمي داخل السلة من 3 أمتار، محطة الرمي فوق الحاجز المنخفض واستلام الزميل، محطة الرمي على مربعات الأعداد بالترتيب، محطة الرمي على الحائط والاستلام، مع التبديل وتسجيل النقاط، ويؤدي التلميذ مهمة المحطة بدقة ويعاون مجموعته (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 (منافسات) ص 104: مسابقة التتابع في قطارات بالرمي والاستلام مع القائد المقابل، والمجموعة التي تنهي أولًا دون سقوط الكرة تفوز، ويتسابق التلميذ ويستلم ويرمي بسرعة ودقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا سقطت الكرة من بعض الزملاء؟ ليستنتج التلاميذ أهمية النظر إلى الكرة ومد الذراعين نحوها، ويستنتج التلميذ ويذكر نصيحة لزميله (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر بمد الذراعين نحو الهدف.\nس2 (مستوى التطبيق): كيف تكون الأصابع عند الاستلام؟\nالإجابة: منتشرة والكفان نحو الكرة.\nس3 (مستوى الاستدلال): ماذا نفعل لاستلام الكرة المنخفضة؟\nالإجابة: نثني الركبتين وننزل الذراعين للأسفل.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.\n\nس4 (مستوى المعرفة): كيف نصيب السلة برميتنا؟\nالإجابة: ننظر إلى السلة ونمد الذراعين نحوها عند الرمي.\nس5 (مستوى التطبيق): في أي محطة رمينا الكرة فوق الحاجز؟\nالإجابة: محطة الرمي فوق الحاجز المنخفض واستلام الزميل.\nس6 (مستوى الاستدلال): ماذا نفعل لنستلم الكرة دون أن تسقط؟\nالإجابة: ننظر إلى الكرة ونمد الذراعين نحوها ونسحبها للصدر.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ على مسافة قصيرة، ويرميان كرة كبيرة من أمام الصدر بكلتا اليدين ويستلمانها بأصابع منتشرة، ثم يطلب منه استلام كرة منخفضة بثني الركبتين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برمي الكرة إلى زميل على مسافة أبعد بمستويات استلام مختلفة (عالية، ومتوسطة، ومنخفضة)، وتسمية المستوى الذي يناديه المعلم قبل الرمي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (مستوى التطبيق): ما وضع الإبهامين عند استلام الكرة العالية؟\nالإجابة: متقابلان خلف الكرة.\nس3 (مستوى الاستدلال): سمِّ لعبتين فيهما رمي الكرة واستلامها.\nالإجابة: كرة اليد وكرة السلة.\n\nس4 (مستوى المعرفة): ارمِ الكرة لتصيب المربع رقم 3.\nالإجابة: يرمي بدقة نحو المربع المحدد.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة السلة ومحطة مربعات الأعداد (أو الحاجز، الحائط).\nس6 (مستوى الاستدلال): كيف تساعد زميلك الذي تسقط منه الكرة كثيرًا؟\nالإجابة: أرمي له الكرة بلطف وأذكره بالنظر إليها ومد ذراعيه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طفلك رمي كرة خفيفة واستلامها من مستويات مختلفة لمدة 10 دقائق (دليل المعلم ص 97-102).\nإرشاد لولي الأمر: العب مع طفلك رمي الكرة في سلة أو طوق من مسافات مختلفة، وشجعه على الاستلام الصحيح (دليل المعلم ص 103-105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=13"}}, {"title": "ركل الكرة وإيقافها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 106-112", "n": 1, "periods": [{"focus": "ركل الكرة بمقدمة القدم وإيقافها بباطن القدم + محطات ومنافسات ركل الكرة وإيقافها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ركل الكرة وإيقافها ونقاطهما الفنية.\n2. يؤدي ركل الكرة الثابتة بمقدمة القدم وإيقاف الكرة القادمة بباطن القدم.\n3. يميز بين الركل بقوة والركل بدقة حسب الهدف.\n4. يوظف ركل الكرة وإيقافها في أداء بعض مهارات كرة القدم.\n5. يصوّب الكرة بالركل نحو هدف (الصندوق المقسم، بين قمعين).\n6. يشعر بالسعادة عند أداء حركة ركل الكرة وإيقافها مع زملائه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- صورة توضيحية\n- أخرى: أطواق", "المفاهيم": "- الركل\n- الإيقاف\n- مقدمة القدم\n- باطن القدم\n- الاتجاه\n- التصويب\n- الدقة\n- التمرير", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب كرة قدم يركل الكرة ويسأل: بأي جزء من القدم ركل؟ ويترك التلاميذ يجربون ركل كرة ثابتة بلطف.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري حول الكرة، مرجحة الرجلين أمامًا وخلفًا، لمس الكرة بالقدمين بالتبادل، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يجزئ المعلم الركل بالعد: الوقوف بجانب الكرة، مرجحة الرجل الراكلة خلفًا، ركل الكرة بمقدمة القدم مع ثبات القدم المرتكزة بجانبها، ثم نموذج الإيقاف بوضع باطن القدم على الكرة القادمة (ص 107-108)، فتطبيق موجه بكرات مختلفة، ويؤدي التلميذ الركل بالعد ثم كاملًا، ويوقف الكرة القادمة من المعلم بباطن القدم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 108: ركل الكرة في اتجاهات ومسارات نحو أهداف قريبة وبعيدة؛ يجرب التلميذ قوة الركل ويكتشف أن الهدف القريب يحتاج إلى ركلة خفيفة والبعيد إلى مرجحة أكبر، ويجرب التلميذ ويستنتج علاقة قوة الركل بالمسافة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط 2 ص 109: في أزواج متقابلين على مسافة 4 أمتار، تبادل ركل الكرة وإيقافها بباطن القدم مع العد، ويتبادل التلميذ مع زميله الركل والإيقاف (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3 (محطات ركل الكرة) ص 110: محطة التصويب بين قمعين، محطة الركل لإدخال الكرة في الصندوق المقسم، محطة الإيقاف بباطن القدم لكرة زميل، محطة الركل لأبعد مسافة، مع التبديل والتسجيل، ويؤدي التلميذ مهمة المحطة ويعاون مجموعته (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. نشاط 4 (منافسات) ص 111: مباراة مصغرة بين مجموعتين بالتمرير بالركل والإيقاف، والتسجيل في هدف من الأقماع دون استخدام اليدين، ويلعب التلميذ ملتزمًا بالركل والإيقاف وقواعد المباراة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: لماذا نوقف الكرة قبل الركل في المباراة؟ ليستنتج التلاميذ أن الإيقاف يجعل التصويب أدق، ويستنتج التلميذ ويذكر مثالًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير عن الشعور، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس2 (مستوى التطبيق): كيف نوقف الكرة القادمة؟\nالإجابة: نضع باطن القدم فوق الكرة بلطف.\nس3 (مستوى الاستدلال): لماذا تصل الكرة أبعد عندما نمرجح الرجل أكثر؟\nالإجابة: لأن المرجحة الأكبر تعطي الركلة قوة أكبر.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم كرة ثابتة أمام التلميذ، ويركلانها معًا بمقدمة القدم نحو هدف قريب، ثم يوقفان كرة قادمة ببطء بباطن القدم، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بركل الكرة بدقة نحو مرمى صغير بين قمعين، ثم بقوة نحو هدف بعيد، والتمييز بين الركلتين ودور مرجحة الرجل.\n\nس4 (مستوى المعرفة): ما الهدف من محطة التصويب بين القمعين؟\nالإجابة: ركل الكرة بدقة لتمر بين القمعين.\nس5 (مستوى التطبيق): ماذا نستخدم لإيقاف الكرة في المباراة؟\nالإجابة: باطن القدم.\nس6 (مستوى الاستدلال): لماذا لا نستخدم اليدين في مباراة اليوم؟\nالإجابة: لأن المهارة التي نتعلمها هي الركل والإيقاف بالقدم كما في كرة القدم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم كرة ثابتة أمام التلميذ، ويركلانها معًا بمقدمة القدم نحو هدف قريب، ثم يوقفان كرة قادمة ببطء بباطن القدم، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بركل الكرة بدقة نحو مرمى صغير بين قمعين، ثم بقوة نحو هدف بعيد، والتمييز بين الركلتين ودور مرجحة الرجل.", "التقويم الختامي": "س1 (مستوى المعرفة): اركل الكرة الثابتة لتصل إلى القمع.\nالإجابة: يركل بمقدمة القدم في اتجاه القمع.\nس2 (مستوى التطبيق): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة وثابتة.\nس3 (مستوى الاستدلال): متى نستخدم ركلة خفيفة ومتى نستخدم ركلة قوية؟\nالإجابة: خفيفة للتمرير القريب والدقة، وقوية للهدف البعيد.\n\nس4 (مستوى المعرفة): اركل الكرة لتدخل في الصندوق المقسم.\nالإجابة: يصوب بدقة.\nس5 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة القمعين ومحطة الصندوق المقسم (أو الإيقاف، الركل لأبعد مسافة).\nس6 (مستوى الاستدلال): كيف شعرت عندما مررت الكرة لزميلك وسجل هدفًا؟\nالإجابة: يعبر عن سعادته بالتعاون مع زميله.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على ركل كرة خفيفة نحو هدف وإيقافها بباطن القدم في مكان آمن (دليل المعلم ص 107-109).\nإرشاد لولي الأمر: شارك طفلك مباراة مصغرة بالركل والإيقاف فقط دون استخدام اليدين، وراجعا النقاط الفنية في دليل المعلم ص 107-111.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=14"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة ركل الكرة وإيقافها ونقاطهما الفنية.\n2. يؤدي ركل الكرة الثابتة بمقدمة القدم وإيقاف الكرة القادمة بباطن القدم.\n3. يميز بين الركل بقوة والركل بدقة حسب الهدف.\n4. يوظف ركل الكرة وإيقافها في أداء بعض مهارات كرة القدم.\n5. يصوّب الكرة بالركل نحو هدف (الصندوق المقسم، بين قمعين).\n6. يشعر بالسعادة عند أداء حركة ركل الكرة وإيقافها مع زملائه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- صورة توضيحية\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الركل\n- الإيقاف\n- مقدمة القدم\n- باطن القدم\n- الاتجاه\n- التصويب\n- الدقة\n- التمرير", "التهيئة / التمهيد / ا حو هدف وإيقافها بباطن القدم في مكان آمن (دليل المعلم ص 107-109).\nإرشاد لولي الأمر: شارك طفلك مباراة مصغرة بالركل والإيقاف فقط دون استخدام اليدين، وراجعا النقاط الفنية في دليل المعلم ص 107-111.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=14"}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 60-112 (مهارات الوحدتين الثانية والثالثة)", "n": 1, "periods": [{"focus": "قياس أداء الحركات الأساسية (المشي والجري، الوثب والحجل، الثني والمد والمرجحة) + قياس أداء مهارات المعالجة والتناول (الدحرجة والالتقاط، الرمي والاستلام، الركل والإيقاف)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي المشي والجري في مسار محدد بالطريقة الصحيحة.\n2. يؤدي الوثب والحجل بهبوط آمن ضمن محطة القياس.\n3. يؤدي حركات الثني والمد والمرجحة عند النداء.\n4. يؤدي دحرجة الكرة والتقاطها بالطريقة الصحيحة.\n5. يؤدي رمي الكرة بكلتا اليدين واستلامها من زميل.\n6. يؤدي ركل الكرة وإيقافها بباطن القدم.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مراتب\n- أخرى: استمارة تقويم الأداء\n- أخرى: كرات متوسطة\n- أخرى: كرات قدم خفيفة", "المفاهيم": "- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الهبوط الآمن\n- الدحرجة\n- الرمي والاستلام\n- الركل والإيقاف", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم أن حصة اليوم لقياس ما تعلمناه من حركات، ويعرض محطات القياس ويطمئن التلاميذ: نؤدي بهدوء وكل تلميذ يأخذ دوره.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الحركات الأساسية التي ستقاس، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات بينما تتدرب بقية المجموعات ذاتيًا في المحطات الأخرى: محطة 1 مشي على الخط ثم جري بين الأقماع، محطة 2 وثب فوق الحبل وحجل إلى الطوق، محطة 3 أداء ثني ومد ومرجحة بالنداء؛ ويرصد المعلم الأداء في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا في انتظار الدور (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية سريعة (شمس وشمع) لتفريغ التوتر، ويلعب التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 دحرجة الكرة نحو الطوق والتقاط كرة قادمة، محطة 2 رمي الكرة لزميل من أمام الصدر واستلامها (5 مرات)، محطة 3 ركل الكرة بين قمعين وإيقاف كرة قادمة بباطن القدم؛ ويرصد المعلم في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. لعبة ختامية (الكرة النارية)، ويلعب التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تهدئة وتعزيز جميع التلاميذ وإعلان الإجازة القادمة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة الصحيحة فوق الحبل؟\nالإجابة: الوثب بالقدمين معًا.\nس2 (مستوى التطبيق): كيف تهبط بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): ما الفرق بين المشي والجري في محطة القياس؟\nالإجابة: في الجري ترتفع القدمان عن الأرض وتزيد السرعة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ محطة واحدة لم يتقنها (الوثب فوق الحبل بالقدمين معًا أو الجري في المسار) ببطء مع عرض نموذج، ثم يطلب منه أداء الوثب مع الهبوط على المشطين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ محطات القياس بتسلسل متصل (جري، ثم وثب، ثم حجل، ثم دحرجة الكرة) في أقل وقت، مع المحافظة على النقاط الفنية لكل حركة.\n\nس4 (مستوى المعرفة): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين والأصابع منتشرة.\nس5 (مستوى التطبيق): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر.\nس6 (مستوى الاستدلال): بأي جزء نوقف الكرة القادمة؟\nالإجابة: بباطن القدم.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ محطة واحدة لم يتقنها (الوثب فوق الحبل بالقدمين معًا أو الجري في المسار) ببطء مع عرض نموذج، ثم يطلب منه أداء الوثب مع الهبوط على المشطين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ محطات القياس بتسلسل متصل (جري، ثم وثب، ثم حجل، ثم دحرجة الكرة) في أقل وقت، مع المحافظة على النقاط الفنية لكل حركة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الحجل من القمع إلى الطوق بقدم واحدة.\nالإجابة: يحجل بالقدم نفسها دون لمس الأرض بالأخرى.\nس2 (مستوى التطبيق): عند نداء (مرجحة) ماذا تفعل؟\nالإجابة: أمرجح الذراع أو الرجل أمامًا وخلفًا.\nس3 (مستوى الاستدلال): لماذا نتدرب في المحطات الأخرى بهدوء أثناء القياس؟\nالإجابة: حتى يؤدي كل تلميذ قياسه بتركيز ولا نضيع الوقت.\n\nس4 (مستوى المعرفة): دحرج الكرة لتدخل الطوق.\nالإجابة: يدحرج بدقة.\nس5 (مستوى التطبيق): ارمِ الكرة لزميلك 5 مرات واستلمها دون سقوط.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس6 (مستوى الاستدلال): ما المهارة التي أتقنتها أكثر اليوم ولماذا؟\nالإجابة: يذكر المهارة ويعلل بأنه تدرب عليها كثيرًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية (المشي، الجري، الوثب، الحجل) قبل حصة القياس الثانية (دليل المعلم ص 60-84).\nإرشاد لولي الأمر: شجع طفلك على ممارسة الدحرجة والرمي والركل في العطلة في مكان آمن (دليل المعلم ص 88-112).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=15"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يؤدي المشي والجري في مسار محدد بالطريقة الصحيحة.\n2. يؤدي الوثب والحجل بهبوط آمن ضمن محطة القياس.\n3. يؤدي حركات الثني والمد والمرجحة عند النداء.\n4. يؤدي دحرجة الكرة والتقاطها بالطريقة الصحيحة.\n5. يؤدي رمي الكرة بكلتا اليدين واستلامها من زميل.\n6. يؤدي ركل الكرة وإيقافها بباطن القدم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مراتب\n- أخرى: استمارة تقويم الأداء\n- أخرى: كرات متوسطة\n- أخرى: كرات قدم خفيفة", "المفاهيم": "الحصة 1:\n- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الهبوط الآمن\n- الدحرجة\n- الرمي والاستلام\n- الركل والإيقاف", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيوضح المعلم أن حصة اليوم لقياس ما تعلمناه من حركات، ويعرض محطات القياس ويطمئن التلاميذ: نؤدي بهدوء وكل تلميذ يأخذ دوره.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم يشمل الحركات الأساسية التي ستقاس، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات بينما تتدرب بقية المجموعات ذاتيًا في المحطات الأخرى: محطة 1 مشي على الخط ثم جري بين الأقماع، محطة 2 وثب فوق الحبل وحجل إلى الطوق، محطة 3 أداء ثني ومد ومرجحة بالنداء؛ ويرصد المعلم الأداء في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا في انتظار الدور (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية سريعة (شمس وشمع) لتفريغ التوتر، ويلعب التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 دحرجة الكرة نحو الطوق والتقاط كرة قادمة، محطة 2 رمي الكرة لزميل من أمام الصدر واستلامها (5 مرات)، محطة 3 ركل الكرة بين قمعين وإيقاف كرة قادمة بباطن القدم؛ ويرصد المعلم في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. لعبة ختامية (الكرة النارية)، ويلعب التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تهدئة وتعزيز جميع التلاميذ وإعلان الإجازة القادمة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الحركة الصحيحة فوق الحبل؟\nالإجابة: الوثب بالقدمين معًا.\nس2 (مستوى التطبيق): كيف تهبط بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): ما الفرق بين المشي والجري في محطة القياس؟\nالإجابة: في الجري ترتفع القدمان عن الأرض وتزيد السرعة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ محطة واحدة لم يتقنها (الوثب فوق الحبل بالقدمين معًا أو الجري في المسار) ببطء مع عرض نموذج، ثم يطلب منه أداء الوثب مع الهبوط على المشطين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ محطات القياس بتسلسل متصل (جري، ثم وثب، ثم حجل، ثم دحرجة الكرة) في أقل وقت، مع المحافظة على النقاط الفنية لكل حركة.\n\nس4 (مستوى المعرفة): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين والأصابع منتشرة.\nس5 (مستوى التطبيق): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر.\nس6 (مستوى الاستدلال): بأي جزء نوقف الكرة القادمة؟\nالإجابة: بباطن القدم.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ محطة واحدة لم يتقنها (الوثب فوق الحبل بالقدمين معًا أو الجري في المسار) ببطء مع عرض نموذج، ثم يطلب منه أداء الوثب مع الهبوط على المشطين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ محطات القياس بتسلسل متصل (جري، ثم وثب، ثم حجل، ثم دحرجة الكرة) في أقل وقت، مع المحافظة على النقاط الفنية لكل حركة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الحجل من القمع إلى الطوق بقدم واحدة.\nالإجابة: يحجل بالقدم نفسها دون لمس الأرض بالأخرى.\nس2 (مستوى التطبيق): عند نداء (مرجحة) ماذا تفعل؟\nالإجابة: أمرجح الذراع أو الرجل أمامًا وخلفًا.\nس3 (مستوى الاستدلال): لماذا نتدرب في المحطات الأخرى بهدوء أثناء القياس؟\nالإجابة: حتى يؤدي كل تلميذ قياسه بتركيز ولا نضيع الوقت.\n\nس4 (مستوى المعرفة): دحرج الكرة لتدخل الطوق.\nالإجابة: يدحرج بدقة.\nس5 (مستوى التطبيق): ارمِ الكرة لزميلك 5 مرات واستلمها دون سقوط.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس6 (مستوى الاستدلال): ما المهارة التي أتقنتها أكثر اليوم ولماذا؟\nالإجابة: يذكر المهارة ويعلل بأنه تدرب عليها كثيرًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية (المشي، الجري، الوثب، الحجل) قبل حصة القياس الثانية (دليل المعلم ص 60-84).\nإرشاد لولي الأمر: شجع طفلك على ممارسة الدحرجة والرمي والركل في العطلة في مكان آمن (دليل المعلم ص 88-112).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=15"}}, {"title": "الممارسات الصحية والنشاط الحر", "unit": "ختام الفصل الدراسي الأول", "week": "السابع عشر", "date": "27-30/12/2026", "pages": "دليل المعلم ص 19، 23", "n": 1, "periods": [{"focus": "الممارسات الصحية: النوم والراحة والنشاط البدني اليومي + النشاط الحر: ألعاب من اختيار التلاميذ", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية النوم المبكر والراحة للجسم.\n2. يميز العادات اليومية الصحية من غير الصحية (النوم المبكر، اللعب في الهواء، الجلوس الطويل أمام الشاشة).\n3. يقدر أهمية ممارسة النشاط البدني يوميًا.\n4. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله من الأنشطة المقترحة.\n5. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n6. يتعاون مع أفراد مجموعته بقيادة القائد.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور العادات اليومية\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: صولجانات", "المفاهيم": "- النوم المبكر\n- الراحة\n- النشاط البدني اليومي\n- وقت الشاشة\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من نام مبكرًا البارحة؟ وكيف تشعر صباحًا عندما تسهر؟ ويعرض صور طفل يلعب في الهواء وآخر أمام الشاشة لوقت طويل.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ الإحماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم البطاقات ويفكر بصوت عالٍ: النوم المبكر يريح الجسم وينمّيه، واللعب في الهواء ساعة يوميًا يقوي العضلات، والجلوس الطويل أمام الشاشة يضر العين والقوام، ويذكر برنامج (صحتي) ص 23، ويستمع التلميذ ويصنف البطاقات إلى عادات صحية وغير صحية (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (ساعة اليوم): يناديها المعلم (صباح: نستيقظ ونتمطى ونجري، ظهر: نمشي للمنزل، عصر: نلعب في الحديقة بالوثب، ليل: نهدأ وننام) ويؤدي التلاميذ الحركة المناسبة، ويستجيب التلميذ لكل وقت بالحركة المناسبة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تختار كل مجموعة ثلاث عادات صحية يومية وتعرضها بالحركة، والتلاميذ يتعاون ويعرض العادات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تقسيم المجموعات (لا تقل عن أربعة) وتحديد قائد لكل مجموعة، وتحاور كل مجموعة لاختيار لعبة من الأنشطة المقترحة (ألعاب شعبية بسيطة، منافسات صغيرة، عروض تمرينات)، ويحاور مجموعته ويتفقون على اللعبة ويعدون الأدوات مع المعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تنفذ كل مجموعة لعبتها المختارة بإشراف المعلم مع تبديل القائد في منتصف الوقت، وتعزيز التعاون والالتزام بالسلامة، ويلعب التلميذ مع مجموعته ويلتزم بالقواعد ويتبادل القيادة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. تعرض كل مجموعة لعبتها على الزملاء في دقيقة، ويعرض التلميذ ويشرح (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة وتعبير عن أجمل لحظة في الفصل الدراسي، ويؤدي التلميذ التهدئة ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا ننام مبكرًا؟\nالإجابة: ليرتاح الجسم وينمو ونستيقظ نشيطين.\nس2 (مستوى التطبيق): كم من الوقت نلعب في الهواء يوميًا؟\nالإجابة: نحو ساعة.\nس3 (مستوى الاستدلال): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: يتعب العين ويضعف القوام ويقلل الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات مصورة لعادات يومية (النوم المبكر، واللعب في الهواء، والجلوس الطويل أمام الشاشة) ويفرزها مع التلميذ إلى صحية وغير صحية، ثم يسأله: لماذا ننام مبكرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم جدول يومي مرسوم يتضمن وقت النوم ونحو ساعة من النشاط البدني، واختيار نشاط حر مع مجموعتهم وقيادته بأمان.\n\nس4 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر اللعبة وسبب الاختيار.\nس5 (مستوى التطبيق): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس6 (مستوى الاستدلال): لماذا نبدل القائد أثناء الحصة؟\nالإجابة: ليجرب الجميع القيادة والتنظيم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات مصورة لعادات يومية (النوم المبكر، واللعب في الهواء، والجلوس الطويل أمام الشاشة) ويفرزها مع التلميذ إلى صحية وغير صحية، ثم يسأله: لماذا ننام مبكرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم جدول يومي مرسوم يتضمن وقت النوم ونحو ساعة من النشاط البدني، واختيار نشاط حر مع مجموعتهم وقيادته بأمان.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة طفل يلعب في الحديقة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم، لأن اللعب في الهواء يقوي الجسم.\nس2 (مستوى التطبيق): اذكر عادة صحية تفعلها قبل النوم.\nالإجابة: غسل الأسنان أو النوم مبكرًا أو تجنب الشاشة.\nس3 (مستوى الاستدلال): ماذا تفعل في وقت العصر في لعبة اليوم؟\nالإجابة: نلعب في الحديقة بالوثب.\n\nس4 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها في لعبتكم.\nالإجابة: عدم الدفع، أو المحافظة على المسافة، أو استخدام الأدوات بحذر.\nس5 (مستوى التطبيق): ما المهارة التي استخدمتها في لعبة اليوم؟\nالإجابة: يذكر مهارة مثل الجري أو الرمي أو الوثب.\nس6 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر الحصة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ساعد طفلك على النوم المبكر وتحديد وقت الشاشة وتخصيص وقت للعب الحركي يوميًا في العطلة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية مع إخوته وأصدقائه في العطلة، ومراجعة مهارات الفصل الأول في دليل المعلم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=16"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية النوم المبكر والراحة للجسم.\n2. يميز العادات اليومية الصحية من غير الصحية (النوم المبكر، اللعب في الهواء، الجلوس الطويل أمام الشاشة).\n3. يقدر أهمية ممارسة النشاط البدني يوميًا.\n4. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله من الأنشطة المقترحة.\n5. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n6. يتعاون مع أفراد مجموعته بقيادة القائد.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور العادات اليومية\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: صولجانات", "المفاهيم": "الحصة 1:\n- النوم المبكر\n- الراحة\n- النشاط البدني اليومي\n- وقت الشاشة\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: من نام مبكرًا البارحة؟ const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ المرجع: دليل المعلم للصف الأول.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
