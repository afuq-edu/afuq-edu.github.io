ت": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مراتب\n- أخرى: استمارة تقويم الأداء\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "الحصة 1:\n- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الهبوط الآمن\n\nالحصة 2:\n- قياس الأداء\n- الدحرجة\n- الرمي والاستلام\n- الركل والإيقاف", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيوضح المعلم أن حصة اليوم لقياس ما تعلمناه من حركات، ويعرض محطات القياس ويطمئن التلاميذ: نؤدي بهدوء وكل تلميذ يأخذ دوره.\n\nالحصة 2:\nيراجع المعلم محطات القياس الثلاث بنموذج سريع ويذكّر بالنقاط الفنية لكل مهارة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم يشمل الحركات الأساسية التي ستقاس، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات بينما تتدرب بقية المجموعات ذاتيًا في المحطات الأخرى: محطة 1 مشي على الخط ثم جري بين الأقماع، محطة 2 وثب فوق الحبل وحجل إلى الطوق، محطة 3 أداء ثني ومد ومرجحة بالنداء؛ ويرصد المعلم الأداء في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا في انتظار الدور (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية سريعة (شمس وشمع) لتفريغ التوتر، ويلعب التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتعزيز جميع التلاميذ، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة بنموذج المعلم، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 دحرجة الكرة نحو الطوق والتقاط كرة قادمة، محطة 2 رمي الكرة لزميل من أمام الصدر واستلامها (5 مرات)، محطة 3 ركل الكرة بين قمعين وإيقاف كرة قادمة بباطن القدم؛ ويرصد المعلم في الاستمارة، ويؤدي التلميذ المهارة عند دوره ويتدرب مستقلًا (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية (الكرة النارية)، ويلعب التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة وتعزيز جميع التلاميذ وإعلان الإجازة القادمة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الحركة الصحيحة فوق الحبل؟\nالإجابة: الوثب بالقدمين معًا.\nس2 (مستوى التطبيق): كيف تهبط بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (مستوى الاستدلال): ما الفرق بين المشي والجري في محطة القياس؟\nالإجابة: في الجري ترتفع القدمان عن الأرض وتزيد السرعة.\n\nالحصة 2:\nس1 (مستوى المعرفة): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين والأصابع منتشرة.\nس2 (مستوى التطبيق): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر.\nس3 (مستوى الاستدلال): بأي جزء نوقف الكرة القادمة؟\nالإجابة: بباطن القدم.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ محطة واحدة لم يتقنها (الوثب فوق الحبل بالقدمين معًا أو الجري في المسار) ببطء مع عرض نموذج، ثم يطلب منه أداء الوثب مع الهبوط على المشطين.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ محطات القياس بتسلسل متصل (جري، ثم وثب، ثم حجل، ثم دحرجة الكرة) في أقل وقت، مع المحافظة على النقاط الفنية لكل حركة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الحجل من القمع إلى الطوق بقدم واحدة.\nالإجابة: يحجل بالقدم نفسها دون لمس الأرض بالأخرى.\nس2 (مستوى التطبيق): عند نداء (مرجحة) ماذا تفعل؟\nالإجابة: أمرجح الذراع أو الرجل أمامًا وخلفًا.\nس3 (مستوى الاستدلال): لماذا نتدرب في المحطات الأخرى بهدوء أثناء القياس؟\nالإجابة: حتى يؤدي كل تلميذ قياسه بتركيز ولا نضيع الوقت.\n\nالحصة 2:\nس1 (مستوى المعرفة): دحرج الكرة لتدخل الطوق.\nالإجابة: يدحرج بدقة.\nس2 (مستوى التطبيق): ارمِ الكرة لزميلك 5 مرات واستلمها دون سقوط.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس3 (مستوى الاستدلال): ما المهارة التي أتقنتها أكثر اليوم ولماذا؟\nالإجابة: يذكر المهارة ويعلل بأنه تدرب عليها كثيرًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية (المشي، الجري، الوثب، الحجل) قبل حصة القياس الثانية (دليل المعلم ص 60-84).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على ممارسة الدحرجة والرمي والركل في العطلة في مكان آمن (دليل المعلم ص 88-112).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=15"}}, {"title": "الممارسات الصحية والنشاط الحر", "unit": "ختام الفصل الدراسي الأول", "week": "السابع عشر", "date": "27-30/12/2026", "pages": "دليل المعلم ص 19، 23", "n": 2, "periods": [{"focus": "الممارسات الصحية: النوم والراحة والنشاط البدني اليومي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية النوم المبكر والراحة للجسم.\n2. يميز العادات اليومية الصحية من غير الصحية (النوم المبكر، اللعب في الهواء، الجلوس الطويل أمام الشاشة).\n3. يقدر أهمية ممارسة النشاط البدني يوميًا.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور العادات اليومية\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- النوم المبكر\n- الراحة\n- النشاط البدني اليومي\n- وقت الشاشة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من نام مبكرًا البارحة؟ وكيف تشعر صباحًا عندما تسهر؟ ويعرض صور طفل يلعب في الهواء وآخر أمام الشاشة لوقت طويل.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم البطاقات ويفكر بصوت عالٍ: النوم المبكر يريح الجسم وينمّيه، واللعب في الهواء ساعة يوميًا يقوي العضلات، والجلوس الطويل أمام الشاشة يضر العين والقوام، ويذكر برنامج (صحتي) ص 23، ويستمع التلميذ ويصنف البطاقات إلى عادات صحية وغير صحية (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (ساعة اليوم): يناديها المعلم (صباح: نستيقظ ونتمطى ونجري، ظهر: نمشي للمنزل، عصر: نلعب في الحديقة بالوثب، ليل: نهدأ وننام) ويؤدي التلاميذ الحركة المناسبة، ويستجيب التلميذ لكل وقت بالحركة المناسبة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تختار كل مجموعة ثلاث عادات صحية يومية وتعرضها بالحركة، والتلاميذ يتعاون ويعرض العادات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة ونصيحة اليوم: نم مبكرًا والعب في الهواء الطلق، ويؤدي التلميذ التهدئة ويكرر النصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا ننام مبكرًا؟\nالإجابة: ليرتاح الجسم وينمو ونستيقظ نشيطين.\nس2 (مستوى التطبيق): كم من الوقت نلعب في الهواء يوميًا؟\nالإجابة: نحو ساعة.\nس3 (مستوى الاستدلال): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: يتعب العين ويضعف القوام ويقلل الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات مصورة لعادات يومية (النوم المبكر، واللعب في الهواء، والجلوس الطويل أمام الشاشة) ويفرزها مع التلميذ إلى صحية وغير صحية، ثم يسأله: لماذا ننام مبكرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم جدول يومي مرسوم يتضمن وقت النوم ونحو ساعة من النشاط البدني، واختيار نشاط حر مع مجموعتهم وقيادته بأمان.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة طفل يلعب في الحديقة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم، لأن اللعب في الهواء يقوي الجسم.\nس2 (مستوى التطبيق): اذكر عادة صحية تفعلها قبل النوم.\nالإجابة: غسل الأسنان أو النوم مبكرًا أو تجنب الشاشة.\nس3 (مستوى الاستدلال): ماذا تفعل في وقت العصر في لعبة اليوم؟\nالإجابة: نلعب في الحديقة بالوثب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ساعد طفلك على النوم المبكر وتحديد وقت الشاشة وتخصيص وقت للعب الحركي يوميًا في العطلة (برنامج صحتي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=16"}}, {"focus": "النشاط الحر: ألعاب من اختيار التلاميذ", "num": 2, "fields": {"المخرجات التعليمية": "1. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله من الأنشطة المقترحة.\n2. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n3. يتعاون مع أفراد مجموعته بقيادة القائد.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: صولجانات", "المفاهيم": "- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يذكّر المعلم بما تعلمناه في الفصل كله ويعرض الأدوات المتاحة ويقول: اليوم تختار كل مجموعة لعبتها المفضلة (دليل المعلم ص 19).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تقسيم المجموعات (لا تقل عن أربعة) وتحديد قائد لكل مجموعة، وتحاور كل مجموعة لاختيار لعبة من الأنشطة المقترحة (ألعاب شعبية بسيطة، منافسات صغيرة، عروض تمرينات)، ويحاور مجموعته ويتفقون على اللعبة ويعدون الأدوات مع المعلم (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تنفذ كل مجموعة لعبتها المختارة بإشراف المعلم مع تبديل القائد في منتصف الوقت، وتعزيز التعاون والالتزام بالسلامة، ويلعب التلميذ مع مجموعته ويلتزم بالقواعد ويتبادل القيادة (20 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تعرض كل مجموعة لعبتها على الزملاء في دقيقة، ويعرض التلميذ ويشرح (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وتعبير عن أجمل لحظة في الفصل الدراسي، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر اللعبة وسبب الاختيار.\nس2 (مستوى التطبيق): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس3 (مستوى الاستدلال): لماذا نبدل القائد أثناء الحصة؟\nالإجابة: ليجرب الجميع القيادة والتنظيم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات مصورة لعادات يومية (النوم المبكر، واللعب في الهواء، والجلوس الطويل أمام الشاشة) ويفرزها مع التلميذ إلى صحية وغير صحية، ثم يسأله: لماذا ننام مبكرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم جدول يومي مرسوم يتضمن وقت النوم ونحو ساعة من النشاط البدني، واختيار نشاط حر مع مجموعتهم وقيادته بأمان.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها في لعبتكم.\nالإجابة: عدم الدفع، أو المحافظة على المسافة، أو استخدام الأدوات بحذر.\nس2 (مستوى التطبيق): ما المهارة التي استخدمتها في لعبة اليوم؟\nالإجابة: يذكر مهارة مثل الجري أو الرمي أو الوثب.\nس3 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر الحصة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية مع إخوته وأصدقائه في العطلة، ومراجعة مهارات الفصل الأول في دليل المعلم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=16"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية النوم المبكر والراحة للجسم.\n2. يميز العادات اليومية الصحية من غير الصحية (النوم المبكر، اللعب في الهواء، الجلوس الطويل أمام الشاشة).\n3. يقدر أهمية ممارسة النشاط البدني يوميًا.\n\nالحصة 2:\n1. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله من الأنشطة المقترحة.\n2. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n3. يتعاون مع أفراد مجموعته بقيادة القائد.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور العادات اليومية\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: صولجانات", "المفاهيم": "الحصة 1:\n- النوم المبكر\n- الراحة\n- النشاط البدني اليومي\n- وقت الشاشة\n\nالحصة 2:\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: من نام مبكرًا البارحة؟ وكيف تشعر صباحًا عندما تسهر؟ ويعرض صور طفل يلعب في الهواء وآخر أمام الشاشة لوقت طويل.\n\nالحصة 2:\nيذكّر المعلم بما تعلمناه في الفصل كله ويعرض الأدوات المتاحة ويقول: اليوم تختار كل مجموعة لعبتها المفضلة (دليل المعلم ص 19).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ الإحماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم البطاقات ويفكر بصوت عالٍ: النوم المبكر يريح الجسم وينمّيه، واللعب في الهواء ساعة يوميًا يقوي العضلات، والجلوس الطويل أمام الشاشة يضر العين والقوام، ويذكر برنامج (صحتي) ص 23، ويستمع التلميذ ويصنف البطاقات إلى عادات صحية وغير صحية (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (ساعة اليوم): يناديها المعلم (صباح: نستيقظ ونتمطى ونجري، ظهر: نمشي للمنزل، عصر: نلعب في الحديقة بالوثب، ليل: نهدأ وننام) ويؤدي التلاميذ الحركة المناسبة، ويستجيب التلميذ لكل وقت بالحركة المناسبة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تختار كل مجموعة ثلاث عادات صحية يومية وتعرضها بالحركة، والتلاميذ يتعاون ويعرض العادات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة ونصيحة اليوم: نم مبكرًا والعب في الهواء الطلق، ويؤدي التلميذ التهدئة ويكرر النصيحة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تقسيم المجموعات (لا تقل عن أربعة) وتحديد قائد لكل مجموعة، وتحاور كل مجموعة لاختيار لعبة من الأنشطة المقترحة (ألعاب شعبية بسيطة، منافسات صغيرة، عروض تمرينات)، ويحاور مجموعته ويتفقون على اللعبة ويعدون الأدوات مع المعلم (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تنفذ كل مجموعة لعبتها المختارة بإشراف المعلم مع تبديل القائد في منتصف الوقت، وتعزيز التعاون والالتزام بالسلامة، ويلعب التلميذ مع مجموعته ويلتزم بالقواعد ويتبادل القيادة (20 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تعرض كل مجموعة لعبتها على الزملاء في دقيقة، ويعرض التلميذ ويشرح (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وتعبير عن أجمل لحظة في الفصل الدراسي، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): لماذا ننام مبكرًا؟\nالإجابة: ليرتاح الجسم وينمو ونستيقظ نشيطين.\nس2 (مستوى التطبيق): كم من الوقت نلعب في الهواء يوميًا؟\nالإجابة: نحو ساعة.\nس3 (مستوى الاستدلال): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: يتعب العين ويضعف القوام ويقلل الحركة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر اللعبة وسبب الاختيار.\nس2 (مستوى التطبيق): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس3 (مستوى الاستدلال): لماذا نبدل القائد أثناء الحصة؟\nالإجابة: ليجرب الجميع القيادة والتنظيم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات مصورة لعادات يومية (النوم المبكر، واللعب في الهواء، والجلوس الطويل أمام الشاشة) ويفرزها مع التلميذ إلى صحية وغير صحية، ثم يسأله: لماذا ننام مبكرًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم جدول يومي مرسوم يتضمن وقت النوم ونحو ساعة من النشاط البدني، واختيار نشاط حر مع مجموعتهم وقيادته بأمان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة طفل يلعب في الحديقة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم، لأن اللعب في الهواء يقوي الجسم.\nس2 (مستوى التطبيق): اذكر عادة صحية تفعلها قبل النوم.\nالإجابة: غسل الأسنان أو النوم مبكرًا أو تجنب الشاشة.\nس3 (مستوى الاستدلال): ماذا تفعل في وقت العصر في لعبة اليوم؟\nالإجابة: نلعب في الحديقة بالوثب.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها في لعبتكم.\nالإجابة: عدم الدفع، أو المحافظة على المسافة، أو استخدام الأدوات بحذر.\nس2 (مستوى التطبيق): ما المهارة التي استخدمتها في لعبة اليوم؟\nالإجابة: يذكر مهارة مثل الجري أو الرمي أو الوثب.\nس3 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر الحصة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ساعد طفلك على النوم المبكر وتحديد وقت الشاشة وتخصيص وقت للعب الحركي يوميًا في العطلة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية مع إخوته وأصدقائه في العطلة، ومراجعة مهارات الفصل الأول في دليل المعلم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=16"}}],[{"title": "تهيئة الطلبة للمادة", "unit": "تمهيدية", "week": "الأول", "date": "6-10/9/2026", "pages": "دليل المعلم ص 12-19 (نماذج التهيئة والنشاط الحر)", "n": 1, "periods": [{"focus": "التعارف وقواعد حصة التربية البدنية والصحية + الاستجابة للإشارات والتعرف إلى الأدوات الرياضية", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر اسم المادة وبعض الأنشطة التي تمارس فيها.\n2. يطبق قواعد الأمن والسلامة في ساحة اللعب.\n3. يشارك زملاءه في لعبة صغيرة بروح الفريق.\n4. يسمي الأدوات الرياضية المستخدمة في الحصة (كرة، طوق، قمع).\n5. يستجيب لإشارات المعلم (صافرة، يد، بطاقة) بالحركة المناسبة.\n6. يميز بين المشي والجري عند الاستجابة للإشارة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: كرات متوسطة\n- صورة توضيحية\n- أخرى: بطاقات مصورة لقواعد الحصة\n- أخرى: أطواق\n- أخرى: بطاقات ملونة", "المفاهيم": "- حصة التربية البدنية\n- ساحة اللعب\n- الأمن والسلامة\n- الزي الرياضي\n- الإشارة\n- الأدوات الرياضية\n- المشي\n- الجري\n- التوقف", "التهيئة / التمهيد / التعلم القبلي": "يرحب المعلم بالتلاميذ ويسألهم: ماذا تحبون أن تلعبوا في الفسحة؟ ثم يعرض صورًا لأطفال يمارسون الجري والوثب واللعب بالكرة ويربطها باسم المادة.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. ينفذ المعلم نموذج الإحماء أمام التلاميذ: مشي حول الساحة، جري خفيف، تحريك الذراعين والرجلين، مع التفكير بصوت عالٍ عن سبب الإحماء قبل اللعب، ويقلد التلميذ حركات المعلم في الإحماء ويكرر سبب أهميته (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات مصورة لقواعد الحصة (الاصطفاف، الاستماع للصافرة، عدم الدفع، الحذاء الرياضي) ويؤدي نموذج الاستجابة للصافرة، ويستجيب التلميذ للصافرة بالتوقف والنظر للمعلم، ويرتب البطاقات مع زميله (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. ينظم المعلم لعبة (الأرانب في المزرعة) من نماذج التهيئة في دليل المعلم ص 13: الأرانب تجري عند النداء وتعود لبيوتها (الأطواق) بإشارة الصافرة، ويلعب التلميذ ملتزمًا بالقواعد ويعود للطوق عند الصافرة دون تدافع (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقسم التلاميذ مجموعات صغيرة لجمع الأقماع والأطواق وإعادتها لمكانها بالتعاون، والتلاميذ يتعاون أفراد المجموعة في جمع الأدوات وترتيبها (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يرفع المعلم بطاقة خضراء فيجري التلاميذ، وصفراء فيمشون، وحمراء فيتوقفون، دون شرح مسبق، ثم يسألهم: ماذا تعني كل بطاقة؟ ويكتشف التلميذ معنى كل لون من خلال التجربة ويصوغه بكلماته (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. لعبة (شمس وشمع) من دليل المعلم ص 14: عند النداء (شمس) ينتشر التلاميذ بالجري، وعند (شمع) يتجمدون في وضع ثابت، ويلعب التلميذ ويحافظ على الثبات عند كلمة (شمع) دون سقوط (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. محطات صغيرة بثلاث مجموعات: مجموعة تدحرج الكرة، ومجموعة تمر داخل الطوق، ومجموعة تجري بين الأقماع، ثم التبديل، ويؤدي التلميذ مهمة المحطة ويعاون زميله في إعادة الأداة لمكانها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة بالتنفس العميق مع نموذج المعلم، ومراجعة أسماء الأدوات بالإشارة إليها، ويؤدي التلميذ التهدئة ويسمي الأداة التي يشير إليها المعلم (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم المادة التي ندرسها اليوم؟\nالإجابة: التربية البدنية والصحية.\nس2 (مستوى التطبيق): ماذا نفعل عندما نسمع الصافرة؟\nالإجابة: نتوقف وننظر إلى المعلم ونستمع.\nس3 (مستوى الاستدلال): لماذا نرتدي الحذاء الرياضي في الحصة؟\nالإجابة: ليحمي القدم من الإصابة ويساعدنا على الجري والوثب بأمان.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ لعبة «الصافرة» بإشارات بطيئة: يمشي حتى يسمع الصافرة فيتوقف وينظر إلى المعلم، مع زميل يساعده، ثم يسأله: ماذا نفعل عندما نسمع الصافرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة لعبة صغيرة يختار فيها أحدهم أداة (كرة أو طوق أو قمع) ويسميها، ويذكّر زملاءه بقاعدة أمن وسلامة قبل بدئها.\n\nس4 (مستوى المعرفة): ماذا تفعل عندما أرفع البطاقة الحمراء؟\nالإجابة: أتوقف في مكاني.\nس5 (مستوى التطبيق): ما الفرق بين المشي والجري؟\nالإجابة: الجري أسرع من المشي، وفي الجري ترتفع القدمان عن الأرض لحظة.\nس6 (مستوى الاستدلال): لماذا نتوقف عند كلمة (شمع) دون أن نسقط؟\nالإجابة: لأن ذلك يدربنا على الثبات والانتباه والاستجابة للإشارة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ لعبة «الصافرة» بإشارات بطيئة: يمشي حتى يسمع الصافرة فيتوقف وينظر إلى المعلم، مع زميل يساعده، ثم يسأله: ماذا نفعل عندما نسمع الصافرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة لعبة صغيرة يختار فيها أحدهم أداة (كرة أو طوق أو قمع) ويسميها، ويذكّر زملاءه بقاعدة أمن وسلامة قبل بدئها.", "التقويم الختامي": "س1 (مستوى المعرفة): أين تمارس حصة التربية البدنية؟\nالإجابة: في ساحة اللعب أو الصالة الرياضية.\nس2 (مستوى التطبيق): اذكر قاعدة واحدة من قواعد الأمن والسلامة في الحصة.\nالإجابة: عدم الدفع أو الجري نحو الزملاء، أو الالتزام بالصافرة.\nس3 (مستوى الاستدلال): ماذا تفعل الأرانب في اللعبة عند سماع الصافرة؟\nالإجابة: تعود مسرعة إلى بيوتها (الأطواق) دون تدافع.\n\nس4 (مستوى المعرفة): سمِّ أداتين رياضيتين استخدمناهما اليوم.\nالإجابة: الكرة والطوق (أو القمع).\nس5 (مستوى التطبيق): ما الحركة المناسبة للبطاقة الصفراء؟\nالإجابة: المشي.\nس6 (مستوى الاستدلال): كيف تساعد مجموعتك في المحطة؟\nالإجابة: أؤدي دوري بسرعة ثم أعيد الأداة لمكانها لزميلي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من إحضار الزي الرياضي والحذاء الرياضي وزجاجة ماء في يوم الحصة، وتصفح معه صفحة قواعد السلامة في الحصة (دليل المعلم ص 12).\nإرشاد للتلميذ وولي الأمر: العب لعبة (شمس وشمع) مع أفراد الأسرة في المنزل، وتعرف إلى الأدوات الرياضية من صور دليل المعلم ص 13-14.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=1"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر اسم المادة وبعض الأنشطة التي تمارس فيها.\n2. يطبق قواعد الأمن والسلامة في ساحة اللعب.\n3. يشارك زملاءه في لعبة صغيرة بروح الفريق.\n4. يسمي الأدوات الرياضية المستخدمة في الحصة (كرة، طوق، قمع).\n5. يستجيب لإشارات المعلم (صافرة، يد، بطاقة) بالحركة المناسبة.\n6. يميز بين المشي والجري عند الاستجابة للإشارة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: فهم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- صورة توضيحية\n- أخرى: بطاقات مصورة لقواعد الحصة\n- أخرى: أطواق\n- أخرى: بطاقات ملونة", "المفاهيم": "الحصة 1:\n- حصة التربية البدنية\n- ساحة اللعب\n- الأمن والسلامة\n- الزي الرياضي\n- الإشارة\n- الأدوات الرياضية\n- المشي\n- الجري\n- التوقف", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرحب المعلم بالتلاميذ ويسألهم: ماذا تحبون أن تلعبوا في الفسحة؟ ثم يعرض صورًا لأطفال يمارسون الجري والوثب واللعب بالكرة ويربطها باسم المادة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. ينفذ المعلم نموذج الإحماء أمام التلاميذ: مشي حول الساحة، جري خفيف، تحريك الذراعين والرجلين، مع التفكير بصوت عالٍ عن سبب الإحماء قبل اللعب، ويقلد التلميذ حركات المعلم في الإحماء ويكرر سبب أهميته (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات مصورة لقواعد الحصة (الاصطفاف، الاستماع للصافرة، عدم الدفع، الحذاء الرياضي) ويؤدي نموذج الاستجابة للصافرة، ويستجيب التلميذ للصافرة بالتوقف والنظر للمعلم، ويرتب البطاقات مع زميله (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. ينظم المعلم لعبة (الأرانب في المزرعة) من نماذج التهيئة في دليل المعلم ص 13: الأرانب تجري عند النداء وتعود لبيوتها (الأطواق) بإشارة الصافرة، ويلعب التلميذ ملتزمًا بالقواعد ويعود للطوق عند الصافرة دون تدافع (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يقسم التلاميذ مجموعات صغيرة لجمع الأقماع والأطواق وإعادتها لمكانها بالتعاون، والتلاميذ يتعاون أفراد المجموعة في جمع الأدوات وترتيبها (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يرفع المعلم بطاقة خضراء فيجري التلاميذ، وصفراء فيمشون، وحمراء فيتوقفون، دون شرح مسبق، ثم يسألهم: ماذا تعني كل بطاقة؟ ويكتشف التلميذ معنى كل لون من خلال التجربة ويصوغه بكلماته (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. لعبة (شمس وشمع) من دليل المعلم ص 14: عند النداء (شمس) ينتشر التلاميذ بالجري، وعند (شمع) يتجمدون في وضع ثابت، ويلعب التلميذ ويحافظ على الثبات عند كلمة (شمع) دون سقوط (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. محطات صغيرة بثلاث مجموعات: مجموعة تدحرج الكرة، ومجموعة تمر داخل الطوق، ومجموعة تجري بين الأقماع، ثم التبديل، ويؤدي التلميذ مهمة المحطة ويعاون زميله في إعادة الأداة لمكانها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة بالتنفس العميق مع نموذج المعلم، ومراجعة أسماء الأدوات بالإشارة إليها، ويؤدي التلميذ التهدئة ويسمي الأداة التي يشير إليها المعلم (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اسم المادة التي ندرسها اليوم؟\nالإجابة: التربية البدنية والصحية.\nس2 (مستوى التطبيق): ماذا نفعل عندما نسمع الصافرة؟\nالإجابة: نتوقف وننظر إلى المعلم ونستمع.\nس3 (مستوى الاستدلال): لماذا نرتدي الحذاء الرياضي في الحصة؟\nالإجابة: ليحمي القدم من الإصابة ويساعدنا على الجري والوثب بأمان.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ لعبة «الصافرة» بإشارات بطيئة: يمشي حتى يسمع الصافرة فيتوقف وينظر إلى المعلم، مع زميل يساعده، ثم يسأله: ماذا نفعل عندما نسمع الصافرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة لعبة صغيرة يختار فيها أحدهم أداة (كرة أو طوق أو قمع) ويسميها، ويذكّر زملاءه بقاعدة أمن وسلامة قبل بدئها.\n\nس4 (مستوى المعرفة): ماذا تفعل عندما أرفع البطاقة الحمراء؟\nالإجابة: أتوقف في مكاني.\nس5 (مستوى التطبيق): ما الفرق بين المشي والجري؟\nالإجابة: الجري أسرع من المشي، وفي الجري ترتفع القدمان عن الأرض لحظة.\nس6 (مستوى الاستدلال): لماذا نتوقف عند كلمة (شمع) دون أن نسقط؟\nالإجابة: لأن ذلك يدربنا على الثبات والانتباه والاستجابة للإشارة.\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مع التلميذ لعبة «الصافرة» بإشارات بطيئة: يمشي حتى يسمع الصافرة فيتوقف وينظر إلى المعلم، مع زميل يساعده، ثم يسأله: ماذا نفعل عندما نسمع الصافرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة لعبة صغيرة يختار فيها أحدهم أداة (كرة أو طوق أو قمع) ويسميها، ويذكّر زملاءه بقاعدة أمن وسلامة قبل بدئها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أين تمارس حصة التربية البدنية؟\nالإجابة: في ساحة اللعب أو الصالة الرياضية.\nس2 (مستوى التطبيق): اذكر قاعدة واحدة من قواعد الأمن والسلامة في الحصة.\nالإجابة: عدم الدفع أو الجري نحو الزملاء، أو الالتزام بالصافرة.\nس3 (مستوى الاستدلال): ماذا تفعل الأرانب في اللعبة عند سماع الصافرة؟\nالإجابة: تعود مسرعة إلى بيوتها (الأطواق) دون تدافع.\n\nس4 (مستوى المعرفة): سمِّ أداتين رياضيتين استخدمناهما اليوم.\nالإجابة: الكرة والطوق (أو القمع).\nس5 (مستوى التطبيق): ما الحركة المناسبة للبطاقة الصفراء؟\nالإجابة: المشي.\nس6 (مستوى الاستدلال): كيف تساعد مجموعتك في المحطة؟\nالإجابة: أؤدي دوري بسرعة ثم أعيد الأداة لمكانها لزميلي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من إحضار الزي الرياضي والحذاء الرياضي وزجاجة ماء في يوم الحصة، وتصفح معه صفحة قواعد السلامة في الحصة (دليل المعلم ص 12).\nإرشاد للتلميذ وولي الأمر: العب لعبة (شمس وشمع) مع أفراد الأسرة في المنزل، وتعرف إلى الأدوات الرياضية من صور دليل المعلم ص 13-14.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=1"}}, {"title": "التشكيلات الرياضية", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 26-34", "n": 1, "periods": [{"focus": "أنواع التشكيلات الرياضية (الانتشار الحر، الصف، القطار) + تشكيلا المربع الناقص ضلعًا والدائرة والانتقال بين التشكيلات", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء تشكيلات الانتشار الحر والصف والقطار.\n2. يميز بين تشكيلي الصف والقطار من الصورة.\n3. يشارك زملاءه في تكوين التشكيل الذي يناديه المعلم.\n4. يتعرف تشكيلي المربع الناقص ضلعًا والدائرة.\n5. ينتقل مع زملائه من تشكيل إلى آخر بانسيابية.\n6. يقدر أهمية التشكيلات في الالتزام بالنظام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات صور التشكيلات\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: مقاعد سويدية\n- أخرى: سلة بها صور التشكيلات", "المفاهيم": "- التشكيلات الرياضية\n- الانتشار الحر\n- الصف\n- القطار\n- التلميذ الدليل\n- المربع الناقص ضلعًا\n- الدائرة\n- الانتقال بين التشكيلات\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نقف في طابور الصباح؟ وكيف يقف الناس في السوق؟ ويربط الإجابات بصور الصف والانتشار الحر في دليل المعلم ص 27-28.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف ثم مشي مع رفع الركبتين، وتحريك الذراعين أمامًا وجانبًا، ويقلد التلميذ الحركات مع المحافظة على المسافة بينه وبين زميله (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم التشكيلات الثلاثة ويؤدي نموذجًا بمساعدة تلميذ (دليل): يمشي الدليل ويقف وسط الخط فيصطف الباقون يمينه ويساره، ثم القطار خلف الدليل، ويراقب التلميذ النموذج ثم يؤدي التشكيل الموجه مع المجموعة باتباع التلميذ الدليل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (اسمع ونفذ): ينتشر التلاميذ بالجري، وعند نداء (صف) أو (قطار) أو (انتشار) تكوّن كل مجموعة التشكيل بأسرع وقت، وتمنح نقطة للأسرع والأدق، ويستمع التلميذ للنداء ويتجمع مع مجموعته في التشكيل الصحيح دون تدافع (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 1 من دليل المعلم ص 30: تشكيل صفين من صف واحد بثبات تلميذ ورجوع التالي خطوتين للخلف بالعد (1، 2)، ويعد التلميذ مع زملائه وينفذ الرجوع للخلف في الموعد الصحيح (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يؤدي المعلم نموذج الانتقال: من قطارين إلى مربع ناقص ضلعًا بدوران التلميذين الدليلين، ثم تشبيك الأيدي لإغلاق الضلع وتكوين الدائرة (دليل المعلم ص 29-30)، ويشاهد التلميذ ثم ينفذ الانتقال بالتوجيه خطوة خطوة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 (محطات التشكيلات) ص 31: أربع مجموعات، كل محطة بتشكيل ومهارة: قطار يمشي على المقعد السويدي، صفان يتبادلان تمرير الكرة، انتشار حر يثب داخل الأطواق، دائرة تجري متعرجًا بين الأقماع، ثم التبديل، وتؤدي كل مجموعة مهارة محطتها بالتشكيل المحدد وتنتقل عند الإشارة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 (المنافسة مع الزملاء) ص 33: يجري الأول من كل قطار نحو السلة ويرفع صورة التشكيل الذي ناداه المعلم، فتؤديه مجموعته، ونقطة للأدق، ويختار التلميذ الصورة الصحيحة بسرعة وتكوّن مجموعته التشكيل (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة في تشكيل الدائرة بالتنفس والإطالة، ونقاش قصير: أين نستخدم التشكيلات في المدرسة؟ ويؤدي التلميذ التهدئة ويذكر موقفًا يحتاج فيه إلى الوقوف بنظام (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): كيف يقف التلاميذ في تشكيل الصف؟\nالإجابة: بجانب بعضهم على خط واحد مع مسافة بينهم.\nس3 (مستوى الاستدلال): لماذا نحتاج التلميذ الدليل عند تكوين التشكيل؟\nالإجابة: لأن الجميع يصطفون بالنسبة له فيكون التشكيل منتظمًا وسريعًا.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.\n\nس4 (مستوى المعرفة): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\nس5 (مستوى التطبيق): كيف ننتقل من المربع الناقص ضلعًا إلى الدائرة؟\nالإجابة: يشبك كل تلميذ يده مع زميله لإغلاق الضلع الناقص فتتكون الدائرة.\nس6 (مستوى الاستدلال): لماذا تساعدنا التشكيلات على التعلم بسرعة؟\nالإجابة: لأن كل تلميذ يرى المعلم ويجد مكانًا كافيًا للحركة دون تصادم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.", "التقويم الختامي": "س1 (مستوى المعرفة): أرفع صورة فيها أطفال منتشرون بلا نظام، ما اسم هذا التشكيل؟\nالإجابة: الانتشار الحر.\nس2 (مستوى التطبيق): متى نستخدم تشكيل القطار في حياتنا اليومية؟\nالإجابة: عند ركوب الحافلة أو طابور الصباح أو الشراء من الجمعية التعاونية.\nس3 (مستوى الاستدلال): كيف نكوّن تشكيل الصف بسرعة ونظام؟\nالإجابة: يقف الدليل في منتصف الخط ويصطف الباقون يمينه ويساره بهدوء ومسافة متساوية.\n\nس4 (مستوى المعرفة): أرفع صورة الدائرة، ما اسم التشكيل؟\nالإجابة: الدائرة.\nس5 (مستوى التطبيق): اذكر مهارة أديناها في محطة القطار اليوم.\nالإجابة: المشي على المقعد السويدي والعودة لخلف القطار.\nس6 (مستوى الاستدلال): ماذا يحدث لو لم نلتزم بالتشكيل عند تمرير الكرة؟\nالإجابة: تضيع الكرات ويتصادم التلاميذ ولا يصل التمرير للزميل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شاهد مع طفلك صور التشكيلات في دليل المعلم ص 27-29، واطلب منه أن يذكر مثالًا من الحياة اليومية لكل تشكيل.\nإرشاد لولي الأمر: راجع مع طفلك أسماء التشكيلات الخمسة بالصور (دليل المعلم ص 27-30) واطلب منه ترتيب أفراد الأسرة في تشكيل دائرة أو قطار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء تشكيلات الانتشار الحر والصف والقطار.\n2. يميز بين تشكيلي الصف والقطار من الصورة.\n3. يشارك زملاءه في تكوين التشكيل الذي يناديه المعلم.\n4. يتعرف تشكيلي المربع الناقص ضلعًا والدائرة.\n5. ينتقل مع زملائه من تشكيل إلى آخر بانسيابية.\n6. يقدر أهمية التشكيلات في الالتزام بالنظام.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات صور التشكيلات\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: مقاعد سويدية\n- أخرى: سلة بها صور التشكيلات", "المفاهيم": "الحصة 1:\n- التشكيلات الرياضية\n- الانتشار الحر\n- الصف\n- القطار\n- التلميذ الدليل\n- المربع الناقص ضلعًا\n- الدائرة\n- الانتقال بين التشكيلات\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كيف نقف في طابور الصباح؟ وكيف يقف الناس في السوق؟ ويربط الإجابات بصور الصف والانتشار الحر في دليل المعلم ص 27-28.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: جري خفيف ثم مشي مع رفع الركبتين، وتحريك الذراعين أمامًا وجانبًا، ويقلد التلميذ الحركات مع المحافظة على المسافة بينه وبين زميله (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم التشكيلات الثلاثة ويؤدي نموذجًا بمساعدة تلميذ (دليل): يمشي الدليل ويقف وسط الخط فيصطف الباقون يمينه ويساره، ثم القطار خلف الدليل، ويراقب التلميذ النموذج ثم يؤدي التشكيل الموجه مع المجموعة باتباع التلميذ الدليل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (اسمع ونفذ): ينتشر التلاميذ بالجري، وعند نداء (صف) أو (قطار) أو (انتشار) تكوّن كل مجموعة التشكيل بأسرع وقت، وتمنح نقطة للأسرع والأدق، ويستمع التلميذ للنداء ويتجمع مع مجموعته في التشكيل الصحيح دون تدافع (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 1 من دليل المعلم ص 30: تشكيل صفين من صف واحد بثبات تلميذ ورجوع التالي خطوتين للخلف بالعد (1، 2)، ويعد التلميذ مع زملائه وينفذ الرجوع للخلف في الموعد الصحيح (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يؤدي المعلم نموذج الانتقال: من قطارين إلى مربع ناقص ضلعًا بدوران التلميذين الدليلين، ثم تشبيك الأيدي لإغلاق الضلع وتكوين الدائرة (دليل المعلم ص 29-30)، ويشاهد التلميذ ثم ينفذ الانتقال بالتوجيه خطوة خطوة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 2 (محطات التشكيلات) ص 31: أربع مجموعات، كل محطة بتشكيل ومهارة: قطار يمشي على المقعد السويدي، صفان يتبادلان تمرير الكرة، انتشار حر يثب داخل الأطواق، دائرة تجري متعرجًا بين الأقماع، ثم التبديل، وتؤدي كل مجموعة مهارة محطتها بالتشكيل المحدد وتنتقل عند الإشارة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 (المنافسة مع الزملاء) ص 33: يجري الأول من كل قطار نحو السلة ويرفع صورة التشكيل الذي ناداه المعلم، فتؤديه مجموعته، ونقطة للأدق، ويختار التلميذ الصورة الصحيحة بسرعة وتكوّن مجموعته التشكيل (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة في تشكيل الدائرة بالتنفس والإطالة، ونقاش قصير: أين نستخدم التشكيلات في المدرسة؟ ويؤدي التلميذ التهدئة ويذكر موقفًا يحتاج فيه إلى الوقوف بنظام (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اسم التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (مستوى التطبيق): كيف يقف التلاميذ في تشكيل الصف؟\nالإجابة: بجانب بعضهم على خط واحد مع مسافة بينهم.\nس3 (مستوى الاستدلال): لماذا نحتاج التلميذ الدليل عند تكوين التشكيل؟\nالإجابة: لأن الجميع يصطفون بالنسبة له فيكون التشكيل منتظمًا وسريعًا.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.\n\nس4 (مستوى المعرفة): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\nس5 (مستوى التطبيق): كيف ننتقل من المربع الناقص ضلعًا إلى الدائرة؟\nالإجابة: يشبك كل تلميذ يده مع زميله لإغلاق الضلع الناقص فتتكون الدائرة.\nس6 (مستوى الاستدلال): لماذا تساعدنا التشكيلات على التعلم بسرعة؟\nالإجابة: لأن كل تلميذ يرى المعلم ويجد مكانًا كافيًا للحركة دون تصادم.\n\n• نشاط علاجي (لمن لم يتقن): يضع المعلم علامات على الأرض، ويكوّن مع التلميذ وزميل دليل تشكيل القطار ثم الصف خطوة خطوة، ثم ينادي «صف!» ويطلب منه أن يأخذ مكانه بجانب الدليل.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بأن يكون كل منهم تلميذًا دليلًا، ينادي تشكيلًا (الصف أو القطار أو الدائرة) وينظم زملاءه فيه بسرعة، ويقارن بين الصف والقطار.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أرفع صورة فيها أطفال منتشرون بلا نظام، ما اسم هذا التشكيل؟\nالإجابة: الانتشار الحر.\nس2 (مستوى التطبيق): متى نستخدم تشكيل القطار في حياتنا اليومية؟\nالإجابة: عند ركوب الحافلة أو طابور الصباح أو الشراء من الجمعية التعاونية.\nس3 (مستوى الاستدلال): كيف نكوّن تشكيل الصف بسرعة ونظام؟\nالإجابة: يقف الدليل في منتصف الخط ويصطف الباقون يمينه ويساره بهدوء ومسافة متساوية.\n\nس4 (مستوى المعرفة): أرفع صورة الدائرة، ما اسم التشكيل؟\nالإجابة: الدائرة.\nس5 (مستوى التطبيق): اذكر مهارة أديناها في محطة القطار اليوم.\nالإجابة: المشي على المقعد السويدي والعودة لخلف القطار.\nس6 (مستوى الاستدلال): ماذا يحدث لو لم نلتزم بالتشكيل عند تمرير الكرة؟\nالإجابة: تضيع الكرات ويتصادم التلاميذ ولا يصل التمرير للزميل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شاهد مع طفلك صور التشكيلات في دليل المعلم ص 27-29، واطلب منه أن يذكر مثالًا من الحياة اليومية لكل تشكيل.\nإرشاد لولي الأمر: راجع مع طفلك أسماء التشكيلات الخمسة بالصور (دليل المعلم ص 27-30) واطلب منه ترتيب أفراد الأسرة في تشكيل دائرة أو قطار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=2"}}, {"title": "أجزاء الجسم", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 35-42", "n": 1, "periods": [{"focus": "التعرف إلى أجزاء الجسم ومفاصله واستخداماتها + توظيف أجزاء الجسم في الحركات والمهارات الرياضية والمحافظة على القوام", "num": 1, "fields": {"المخرجات التعليمية": "1. يسمي أجزاء الجسم الرئيسة (الرأس، الجذع، الذراعان، الرجلان) ومفاصلها.\n2. يربط كل جزء من الجسم بحركة رياضية يؤديها.\n3. يوظف أجزاء جسمه في أداء حركات بسيطة عند النداء.\n4. يميز الزي الرياضي والواقي المناسب لكل جزء من الجسم.\n5. يؤدي حركات مركبة توظف أكثر من جزء في الجسم.\n6. يقدر أهمية المحافظة على سلامة الجسم والقوام السليم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: بطاقات صور وأسماء أجزاء الجسم\n- أخرى: كرات\n- أخرى: سلال بلاستيكية\n- صورة توضيحية\n- أخرى: بطاقات صور أجزاء الجسم مقطعة\n- أخرى: أطواق\n- أخرى: حقيبة مدرسية", "المفاهيم": "- أجزاء الجسم\n- المفاصل\n- الحركة\n- الجانب الأيمن والأيسر\n- القوام السليم\n- حمل الحقيبة\n- الجلوس الصحيح\n- الزي الرياضي\n- الواقي", "التهيئة / التمهيد / التعلم القبلي": "يغني المعلم مع التلاميذ أنشودة (رأس، كتف، ركبة، قدم) مع لمس الأجزاء، ثم يسأل: بأي جزء نركل الكرة؟ وبأي جزء نرميها؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: تحريك كل جزء من الجسم على حدة (دوران الرأس ببطء، الكتفين، الذراعين، الركبتين، الكاحلين) مع تسمية الجزء، ويقلد التلميذ ويسمي الجزء الذي يحركه بصوت مسموع (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 37: يجري التلاميذ دقيقة ثم يضع المعلم يده على صدره ويسأل: ماذا تغيّر في جسمك؟ ليكتشفوا سرعة نبض القلب والتنفس وارتفاع الحرارة، ويلاحظ التلميذ التغيرات في جسمه ويعبر عنها (قلبي يدق بسرعة، أتنفس أسرع) (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. نشاط 2 (لمس أجزاء الجسم من الحركة) ص 38: ينتشر التلاميذ بالجري وعند نداء جزء (مرفق، كاحل، كتف) يلمسه التلميذ ويثبت، ومن يخطئ يؤدي حركة بسيطة، ويستجيب التلميذ للنداء بلمس الجزء الصحيح بسرعة ودقة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 4 (محطات أجزاء الجسم) ص 40: محطة الرأس (تنطيط كرة بالرأس عاليًا)، محطة الذراعين (رمي الكرة في السلة)، محطة الرجلين (ركل الكرة للزميل)، مع التبديل، ويؤدي التلميذ مهارة المحطة بالجزء المحدد ويبدل مع مجموعته عند الإشارة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالإطالة لكل جزء مع نموذج المعلم، ومراجعة سريعة ببطاقات الأجزاء، ويؤدي التلميذ الإطالة ويسمي الجزء في البطاقة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. يعرض المعلم نموذجًا للجلوس الصحيح وحمل الحقيبة على الكتفين، ثم يشرح الزي والواقيات بالصور (واقي الرأس، واقي الصدر، القميص الرياضي)، ويؤدي التلميذ الجلوس وحمل الحقيبة بالطريقة الصحيحة ويطابق الواقي مع الجزء المناسب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. نشاط 3 (مشاركة الزملاء في أداء الحركات) ص 39: في أزواج، يؤدي تلميذ حركة بجزء معين ويقلدها زميله ثم يبتكران حركة توظف الذراعين والرجلين معًا، ويؤدي التلميذ الحركة مع زميله ويبتكر حركة جديدة بجزأين (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. نشاط 5 (التنافس مع الزملاء) ص 41: تجمع كل مجموعة قطع صورة الجزء الذي يناديه المعلم وتشكلها بأسرع وقت ثم تؤدي حركته، والتلاميذ يتعاون مع مجموعته في تجميع الصورة وأداء الحركة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. تهدئة وإطالة مع نموذج المعلم، ونصيحة اليوم: اجلس معتدلًا واحمل حقيبتك على الكتفين، ويؤدي التلميذ التهدئة ويكرر النصيحة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): سمِّ ثلاثة أجزاء من جسمك.\nالإجابة: الرأس، الذراعان، الرجلان (أو الجذع).\nس2 (مستوى التطبيق): ما الجزء الذي نستخدمه لركل الكرة؟\nالإجابة: الرجل (القدم).\nس3 (مستوى الاستدلال): لماذا دق قلبك بسرعة بعد الجري؟\nالإجابة: لأن الجسم يحتاج إلى دم وهواء أكثر عند الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.\n\nس4 (مستوى المعرفة): على أي كتف نحمل الحقيبة؟\nالإجابة: على الكتفين معًا.\nس5 (مستوى التطبيق): ما الواقي الذي يحمي الرأس في بعض الألعاب؟\nالإجابة: واقي الرأس (الخوذة).\nس6 (مستوى الاستدلال): ما ضرر الجلوس المنحني لفترة طويلة؟\nالإجابة: يسبب تقوس الظهر وألمه ويؤثر في القوام.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.", "التقويم الختامي": "س1 (مستوى المعرفة): ارفع يدك اليمنى، وأشر إلى مرفقك.\nالإجابة: يرفع اليد اليمنى ويشير إلى المرفق الصحيح.\nس2 (مستوى التطبيق): اذكر مهارة رياضية تؤدى بالرأس.\nالإجابة: ضرب الكرة بالرأس في كرة القدم.\nس3 (مستوى الاستدلال): كيف نحافظ على سلامة أجزاء الجسم أثناء اللعب؟\nالإجابة: بالإحماء قبل اللعب، ولبس الحذاء الرياضي، وعدم الدفع أو التصادم.\n\nس4 (مستوى المعرفة): اذكر جزأين من الجسم استخدمتهما معًا في حركة اليوم.\nالإجابة: الذراعان والرجلان (مثل الوثب مع رفع الذراعين).\nس5 (مستوى التطبيق): ما الزي المناسب لحصة التربية البدنية؟\nالإجابة: القميص والبنطال الرياضي والحذاء الرياضي.\nس6 (مستوى الاستدلال): كيف تنصح زميلك الذي يجلس منحنيًا؟\nالإجابة: أقول له: اجلس معتدل الظهر وارفع رأسك لتحافظ على قوامك.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرّب مع طفلك على تسمية أجزاء الجسم ومفاصله ومعرفة الجانب الأيمن والأيسر مستعينًا بصور دليل المعلم ص 36-37.\nإرشاد لولي الأمر: راقب طريقة جلوس طفلك وحمله للحقيبة على الكتفين، وناقش معه صور الزي الرياضي والواقيات في دليل المعلم ص 37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يسمي أجزاء الجسم الرئيسة (الرأس، الجذع، الذراعان، الرجلان) ومفاصلها.\n2. يربط كل جزء من الجسم بحركة رياضية يؤديها.\n3. يوظف أجزاء جسمه في أداء حركات بسيطة عند النداء.\n4. يميز الزي الرياضي والواقي المناسب لكل جزء من الجسم.\n5. يؤدي حركات مركبة توظف أكثر من جزء في الجسم.\n6. يقدر أهمية المحافظة على سلامة الجسم والقوام السليم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: بطاقات صور وأسماء أجزاء الجسم\n- أخرى: كرات\n- أخرى: سلال بلاستيكية\n- صورة توضيحية\n- أخرى: بطاقات صور أجزاء الجسم مقطعة\n- أخرى: أطواق\n- أخرى: حقيبة مدرسية", "المفاهيم": "الحصة 1:\n- أجزاء الجسم\n- المفاصل\n- الحركة\n- الجانب الأيمن والأيسر\n- القوام السليم\n- حمل الحقيبة\n- الجلوس الصحيح\n- الزي الرياضي\n- الواقي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيغني المعلم مع التلاميذ أنشودة (رأس، كتف، ركبة، قدم) مع لمس الأجزاء، ثم يسأل: بأي جزء نركل الكرة؟ وبأي جزء نرميها؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم: تحريك كل جزء من الجسم على حدة (دوران الرأس ببطء، الكتفين، الذراعين، الركبتين، الكاحلين) مع تسمية الجزء، ويقلد التلميذ ويسمي الجزء الذي يحركه بصوت مسموع (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 1 ص 37: يجري التلاميذ دقيقة ثم يضع المعلم يده على صدره ويسأل: ماذا تغيّر في جسمك؟ ليكتشفوا سرعة نبض القلب والتنفس وارتفاع الحرارة، ويلاحظ التلميذ التغيرات في جسمه ويعبر عنها (قلبي يدق بسرعة، أتنفس أسرع) (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. نشاط 2 (لمس أجزاء الجسم من الحركة) ص 38: ينتشر التلاميذ بالجري وعند نداء جزء (مرفق، كاحل، كتف) يلمسه التلميذ ويثبت، ومن يخطئ يؤدي حركة بسيطة، ويستجيب التلميذ للنداء بلمس الجزء الصحيح بسرعة ودقة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 4 (محطات أجزاء الجسم) ص 40: محطة الرأس (تنطيط كرة بالرأس عاليًا)، محطة الذراعين (رمي الكرة في السلة)، محطة الرجلين (ركل الكرة للزميل)، مع التبديل، ويؤدي التلميذ مهارة المحطة بالجزء المحدد ويبدل مع مجموعته عند الإشارة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالإطالة لكل جزء مع نموذج المعلم، ومراجعة سريعة ببطاقات الأجزاء، ويؤدي التلميذ الإطالة ويسمي الجزء في البطاقة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. يعرض المعلم نموذجًا للجلوس الصحيح وحمل الحقيبة على الكتفين، ثم يشرح الزي والواقيات بالصور (واقي الرأس، واقي الصدر، القميص الرياضي)، ويؤدي التلميذ الجلوس وحمل الحقيبة بالطريقة الصحيحة ويطابق الواقي مع الجزء المناسب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. نشاط 3 (مشاركة الزملاء في أداء الحركات) ص 39: في أزواج، يؤدي تلميذ حركة بجزء معين ويقلدها زميله ثم يبتكران حركة توظف الذراعين والرجلين معًا، ويؤدي التلميذ الحركة مع زميله ويبتكر حركة جديدة بجزأين (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n8. نشاط 5 (التنافس مع الزملاء) ص 41: تجمع كل مجموعة قطع صورة الجزء الذي يناديه المعلم وتشكلها بأسرع وقت ثم تؤدي حركته، والتلاميذ يتعاون مع مجموعته في تجميع الصورة وأداء الحركة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. تهدئة وإطالة مع نموذج المعلم، ونصيحة اليوم: اجلس معتدلًا واحمل حقيبتك على الكتفين، ويؤدي التلميذ التهدئة ويكرر النصيحة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): سمِّ ثلاثة أجزاء من جسمك.\nالإجابة: الرأس، الذراعان، الرجلان (أو الجذع).\nس2 (مستوى التطبيق): ما الجزء الذي نستخدمه لركل الكرة؟\nالإجابة: الرجل (القدم).\nس3 (مستوى الاستدلال): لماذا دق قلبك بسرعة بعد الجري؟\nالإجابة: لأن الجسم يحتاج إلى دم وهواء أكثر عند الحركة.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.\n\nس4 (مستوى المعرفة): على أي كتف نحمل الحقيبة؟\nالإجابة: على الكتفين معًا.\nس5 (مستوى التطبيق): ما الواقي الذي يحمي الرأس في بعض الألعاب؟\nالإجابة: واقي الرأس (الخوذة).\nس6 (مستوى الاستدلال): ما ضرر الجلوس المنحني لفترة طويلة؟\nالإجابة: يسبب تقوس الظهر وألمه ويؤثر في القوام.\n\n• نشاط علاجي (لمن لم يتقن): يلمس المعلم مع التلميذ أجزاء جسمه (الرأس، والجذع، والذراعين، والرجلين) مع أغنية بطيئة، ثم يربط كل جزء بحركة (ركل الكرة بالرجل)، ثم يسأله: بأي جزء نركل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «نداء الأجزاء»: ينادي أحدهم جزءًا من الجسم ويؤدي الآخرون حركة به، ثم يفسرون لماذا يدق القلب بسرعة بعد الجري.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارفع يدك اليمنى، وأشر إلى مرفقك.\nالإجابة: يرفع اليد اليمنى ويشير إلى المرفق الصحيح.\nس2 (مستوى التطبيق): اذكر مهارة رياضية تؤدى بالرأس.\nالإجابة: ضرب الكرة بالرأس في كرة القدم.\nس3 (مستوى الاستدلال): كيف نحافظ على سلامة أجزاء الجسم أثناء اللعب؟\nالإجابة: بالإحماء قبل اللعب، ولبس الحذاء الرياضي، وعدم الدفع أو التصادم.\n\nس4 (مستوى المعرفة): اذكر جزأين من الجسم استخدمتهما معًا في حركة اليوم.\nالإجابة: الذراعان والرجلان (مثل الوثب مع رفع الذراعين).\nس5 (مستوى التطبيق): ما الزي المناسب لحصة التربية البدنية؟\nالإجابة: القميص والبنطال الرياضي والحذاء الرياضي.\nس6 (مستوى الاستدلال): كيف تنصح زميلك الذي يجلس منحنيًا؟\nالإجابة: أقول له: اجلس معتدل الظهر وارفع رأسك لتحافظ على قوامك.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرّب مع طفلك على تسمية أجزاء الجسم ومفاصله ومعرفة الجانب الأيمن والأيسر مستعينًا بصور دليل المعلم ص 36-37.\nإرشاد لولي الأمر: راقب طريقة جلوس طفلك وحمله للحقيبة على الكتفين، وناقش معه صور الزي الرياضي والواقيات في دليل المعلم ص 37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=3"}}, {"title": "الأوضاع الأساسية في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 43-51", "n": 1, "periods": [{"focus": "وضعا الوقوف والجثو + وضعا الجلوس التربيع والرقود والتمرين من الأوضاع الأساسية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف وضعي الوقوف والجثو ونقاطهما الفنية.\n2. يؤدي وضعي الوقوف والجثو بطريقة صحيحة.\n3. يميز بين الوضعين من الصورة أو النداء.\n4. يتعرف وضعي الجلوس التربيع والرقود.\n5. يؤدي تمرينات بسيطة من الأوضاع الأساسية الأربعة.\n6. يقدر أهمية التمرينات في المحافظة على الصحة والقوام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات صور الأوضاع الأساسية\n- صورة توضيحية\n- أخرى: أقماع\n- أخرى: سلال بلاستيكية", "المفاهيم": "- التمرين\n- الوضع الأساسي\n- الوقوف\n- الجثو\n- القوام السليم\n- الجلوس التربيع\n- الرقود", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نقف في طابور الصباح؟ وكيف نجلس على ركبنا عند اللعب على السجاد؟ ثم يعرض صورتي الوقوف والجثو ويذكر أنهما وضعان أساسيان نبدأ منهما التمرينات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم في تشكيل الصف: مشي، جري خفيف، تمرينات للذراعين والرجلين، ويؤدي التلميذ الإحماء في الصف محافظًا على النظام (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وضع الوقوف (العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم) ثم الجثو (الركبتان على المرتبة، الجذع مستقيم) مع التفكير بصوت عالٍ عن النقاط الفنية (ص 44-45)، ويقلد التلميذ الوضع ويصحح زميله من البطاقة المصورة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (حركة، حركة، وضع) ص 47: يجري التلاميذ وعند نداء (وقوف) أو (جثو) يثبت كل تلميذ في الوضع الصحيح داخل أقرب طوق، ويستجيب التلميذ للنداء بالوضع الصحيح ويحافظ على ثباته (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 2 ص 48: في مجموعات، تؤدي كل مجموعة تمرينين بسيطين من الوقوف (رفع الذراعين عاليًا) ومن الجثو (مد الذراعين جانبًا) بالعد الجماعي، ويعد التلميذ مع مجموعته ويؤدي التمرين من الوضع المحدد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يؤدي المعلم نموذج الجلوس التربيع (الرجلان متقاطعتان، الظهر مستقيم) والرقود (الظهر ملاصق للمرتبة، الذراعان بجانب الجسم) ويوضح النقاط الفنية (ص 45-46)، ويقلد التلميذ الوضعين على المرتبة ويتحقق من استقامة ظهره (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 3 (محطات الأوضاع الأساسية) ص 49: أربع محطات، في كل محطة بطاقة وضع وتمرين بسيط منه (من الرقود: رفع الرجلين؛ من الجلوس التربيع: لف الجذع)، والتبديل بالإشارة، وتؤدي المجموعة تمرين المحطة بالوضع الصحيح وتنتقل بنظام (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 (المنافسة مع الزملاء) ص 50: يجري الأول من كل قطار ويسحب بطاقة وضع من السلة فتؤديه مجموعته، ونقطة للمجموعة الأدق، ويسحب التلميذ البطاقة ويعود مسرعًا وتؤدي مجموعته الوضع (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة من وضع الرقود بالتنفس العميق، وحوار: لماذا نمارس التمرينات يوميًا؟ ويرقد التلميذ ويتنفس بعمق ويذكر فائدة للتمرينات (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الركبتان على الأرض؟\nالإجابة: الجثو.\nس2 (مستوى التطبيق): أين تكون الذراعان في وضع الوقوف الأساسي؟\nالإجابة: بجانب الجسم.\nس3 (مستوى الاستدلال): لماذا نبدأ التمرين من وضع صحيح؟\nالإجابة: ليكون التمرين مفيدًا وآمنًا ويحافظ على القوام.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.\n\nس4 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الرجلان متقاطعتين؟\nالإجابة: الجلوس التربيع.\nس5 (مستوى التطبيق): كيف يكون الظهر في وضع الرقود؟\nالإجابة: ملاصقًا للمرتبة (الأرض).\nس6 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين لأعلى.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وضع الوقوف الصحيح.\nالإجابة: يقف معتدلًا، العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم.\nس2 (مستوى التطبيق): ما الفرق بين الوقوف والجثو؟\nالإجابة: في الوقوف نرتكز على القدمين، وفي الجثو نرتكز على الركبتين.\nس3 (مستوى الاستدلال): أرفع صورة طفل يجثو منحني الظهر، ما الخطأ؟\nالإجابة: الظهر منحنٍ، والصحيح أن يكون الجذع مستقيمًا.\n\nس4 (مستوى المعرفة): سمِّ الأوضاع الأساسية الأربعة التي تعلمتها.\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس5 (مستوى التطبيق): أرفع بطاقة الرقود، أدِّ الوضع الصحيح.\nالإجابة: يرقد على الظهر مستقيمًا والذراعان بجانب الجسم.\nس6 (مستوى الاستدلال): لماذا تحافظ التمرينات على قوامنا؟\nالإجابة: لأنها تقوي عضلات الظهر والبطن فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شاهد مع طفلك صور الأوضاع الأساسية في دليل المعلم ص 44-46 واطلب منه أداء وضعي الوقوف والجثو أمامك.\nإرشاد لولي الأمر: راجع مع طفلك الأوضاع الأساسية الأربعة (دليل المعلم ص 44-46) ومارسوا معًا تمرينًا بسيطًا من كل وضع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف وضعي الوقوف والجثو ونقاطهما الفنية.\n2. يؤدي وضعي الوقوف والجثو بطريقة صحيحة.\n3. يميز بين الوضعين من الصورة أو النداء.\n4. يتعرف وضعي الجلوس التربيع والرقود.\n5. يؤدي تمرينات بسيطة من الأوضاع الأساسية الأربعة.\n6. يقدر أهمية التمرينات في المحافظة على الصحة والقوام.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات صور الأوضاع الأساسية\n- صورة توضيحية\n- أخرى: أقماع\n- أخرى: سلال بلاستيكية", "المفاهيم": "الحصة 1:\n- التمرين\n- الوضع الأساسي\n- الوقوف\n- الجثو\n- القوام السليم\n- الجلوس التربيع\n- الرقود", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كيف نقف في طابور الصباح؟ وكيف نجلس على ركبنا عند اللعب على السجاد؟ ثم يعرض صورتي الوقوف والجثو ويذكر أنهما وضعان أساسيان نبدأ منهما التمرينات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم في تشكيل الصف: مشي، جري خفيف، تمرينات للذراعين والرجلين، ويؤدي التلميذ الإحماء في الصف محافظًا على النظام (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وضع الوقوف (العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم) ثم الجثو (الركبتان على المرتبة، الجذع مستقيم) مع التفكير بصوت عالٍ عن النقاط الفنية (ص 44-45)، ويقلد التلميذ الوضع ويصحح زميله من البطاقة المصورة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (حركة، حركة، وضع) ص 47: يجري التلاميذ وعند نداء (وقوف) أو (جثو) يثبت كل تلميذ في الوضع الصحيح داخل أقرب طوق، ويستجيب التلميذ للنداء بالوضع الصحيح ويحافظ على ثباته (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط 2 ص 48: في مجموعات، تؤدي كل مجموعة تمرينين بسيطين من الوقوف (رفع الذراعين عاليًا) ومن الجثو (مد الذراعين جانبًا) بالعد الجماعي، ويعد التلميذ مع مجموعته ويؤدي التمرين من الوضع المحدد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يؤدي المعلم نموذج الجلوس التربيع (الرجلان متقاطعتان، الظهر مستقيم) والرقود (الظهر ملاصق للمرتبة، الذراعان بجانب الجسم) ويوضح النقاط الفنية (ص 45-46)، ويقلد التلميذ الوضعين على المرتبة ويتحقق من استقامة ظهره (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. نشاط 3 (محطات الأوضاع الأساسية) ص 49: أربع محطات، في كل محطة بطاقة وضع وتمرين بسيط منه (من الرقود: رفع الرجلين؛ من الجلوس التربيع: لف الجذع)، والتبديل بالإشارة، وتؤدي المجموعة تمرين المحطة بالوضع الصحيح وتنتقل بنظام (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 4 (المنافسة مع الزملاء) ص 50: يجري الأول من كل قطار ويسحب بطاقة وضع من السلة فتؤديه مجموعته، ونقطة للمجموعة الأدق، ويسحب التلميذ البطاقة ويعود مسرعًا وتؤدي مجموعته الوضع (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة من وضع الرقود بالتنفس العميق، وحوار: لماذا نمارس التمرينات يوميًا؟ ويرقد التلميذ ويتنفس بعمق ويذكر فائدة للتمرينات (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الركبتان على الأرض؟\nالإجابة: الجثو.\nس2 (مستوى التطبيق): أين تكون الذراعان في وضع الوقوف الأساسي؟\nالإجابة: بجانب الجسم.\nس3 (مستوى الاستدلال): لماذا نبدأ التمرين من وضع صحيح؟\nالإجابة: ليكون التمرين مفيدًا وآمنًا ويحافظ على القوام.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.\n\nس4 (مستوى المعرفة): ما اسم الوضع الذي تكون فيه الرجلان متقاطعتين؟\nالإجابة: الجلوس التربيع.\nس5 (مستوى التطبيق): كيف يكون الظهر في وضع الرقود؟\nالإجابة: ملاصقًا للمرتبة (الأرض).\nس6 (مستوى الاستدلال): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين لأعلى.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ وضعي الوقوف والجثو ببطء مع صور مساعدة، ثم يؤديهما التلميذ معه بالعد، ثم ينادي «جثو!» ليؤدي الوضع وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين الأوضاع الأساسية الأربعة (الوقوف، والجثو، والجلوس التربيع، والرقود)، وتصحيح وضع زميل وتعليل أهمية الوضع الصحيح.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ وضع الوقوف الصحيح.\nالإجابة: يقف معتدلًا، العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم.\nس2 (مستوى التطبيق): ما الفرق بين الوقوف والجثو؟\nالإجابة: في الوقوف نرتكز على القدمين، وفي الجثو نرتكز على الركبتين.\nس3 (مستوى الاستدلال): أرفع صورة طفل يجثو منحني الظهر، ما الخطأ؟\nالإجابة: الظهر منحنٍ، والصحيح أن يكون الجذع مستقيمًا.\n\nس4 (مستوى المعرفة): سمِّ الأوضاع الأساسية الأربعة التي تعلمتها.\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس5 (مستوى التطبيق): أرفع بطاقة الرقود، أدِّ الوضع الصحيح.\nالإجابة: يرقد على الظهر مستقيمًا والذراعان بجانب الجسم.\nس6 (مستوى الاستدلال): لماذا تحافظ التمرينات على قوامنا؟\nالإجابة: لأنها تقوي عضلات الظهر والبطن فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شاهد مع طفلك صور الأوضاع الأساسية في دليل المعلم ص 44-46 واطلب منه أداء وضعي الوقوف والجثو أمامك.\nإرشاد لولي الأمر: راجع مع طفلك الأوضاع الأساسية الأربعة (دليل المعلم ص 44-46) ومارسوا معًا تمرينًا بسيطًا من كل وضع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=4"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 20-23 (المهرجانات، صحتي)", "n": 1, "periods": [{"focus": "الممارسات الصحية: النظافة الشخصية والزي الرياضي + المهرجان الرياضي التعليمي للتمرينات (التشكيلات، أجزاء الجسم، الأوضاع الأساسية)", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر ممارسات النظافة الشخصية قبل الحصة وبعدها (غسل اليدين، تغيير الملابس).\n2. يطبق خطوات غسل اليدين الصحيحة.\n3. يقدر أهمية النظافة في الوقاية من الأمراض.\n4. يؤدي التشكيلات والأوضاع الأساسية ضمن أقسام المهرجان.\n5. يوظف أجزاء جسمه في تمرينات المحطات.\n6. يشارك مجموعته بروح الفريق والنظام في المهرجان.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: صابون وماء\n- أخرى: بطاقات مصورة لخطوات غسل اليدين\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات والأوضاع\n- أخرى: لوحة نقاط", "المفاهيم": "- النظافة الشخصية\n- غسل اليدين\n- الزي الرياضي\n- الوقاية\n- المهرجان الرياضي التعليمي\n- المحطات\n- قائد المجموعة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ليدين متسختين بعد اللعب ويسأل: ماذا نفعل بعد اللعب في الساحة؟ ولماذا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء خفيف بنموذج المعلم: مشي وجري بين الأطواق وتحريك الذراعين، ويؤدي التلميذ الإحماء بنشاط (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات خطوات غسل اليدين (بلل، صابون، فرك 20 ثانية، شطف، تجفيف) ويؤدي النموذج بالتفكير بصوت عالٍ، ثم يناقش الزي الرياضي النظيف وتغييره بعد الحصة، ويقلد التلميذ خطوات غسل اليدين بالتمثيل ويرتب البطاقات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الجرثومة والصابون): تلميذ جرثومة يطارد الزملاء، ومن يُلمس يثبت حتى يلمسه تلميذ (الصابون) فيعود للعب، ويلعب التلميذ ويعبر عن دور الصابون في التخلص من الجراثيم (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات صغيرة، ترتب كل مجموعة بطاقات خطوات غسل اليدين بالترتيب الصحيح وتعرضها، ويرتب التلميذ البطاقات مع مجموعته ويشرح خطوة واحدة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس، ثم الذهاب بنظام لغسل اليدين تطبيقًا عمليًا، ويغسل التلميذ يديه بالخطوات الصحيحة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. المهرجان بأربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم التشكيلات (تكوين التشكيل بالنداء)، قسم أجزاء الجسم (محطات الرأس والذراعين والرجلين بالكرة)، قسم الأوضاع الأساسية (تمرين من كل وضع بالبطاقة)، قسم جمباز الموانع المبسط (وثب داخل الأطواق ودحرجة على المرتبة)، مع تسجيل نقاط النظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم بقيادة القائد وينتقل بنظام عند الإشارة (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n7. مسابقة ختامية سريعة: أسرع مجموعة تكوّن تشكيل الدائرة ثم تؤدي وضع الجثو، ويتسابق التلميذ مع مجموعته بدقة ونظام (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتكريم جميع المشاركين وإعلان الترتيب بروح رياضية، ويؤدي التلميذ التهدئة ويصفق لجميع المجموعات (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى نغسل أيدينا في يوم الحصة؟\nالإجابة: بعد اللعب وقبل الأكل.\nس2 (مستوى التطبيق): كم ثانية نفرك أيدينا بالصابون؟\nالإجابة: نحو 20 ثانية.\nس3 (مستوى الاستدلال): لماذا نغير ملابس الرياضة بعد الحصة؟\nالإجابة: لأنها تمتلئ بالعرق وقد تسبب الأمراض والرائحة غير المحببة.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.\n\nس4 (مستوى المعرفة): ما اسم مجموعتك وما اسم قائدها؟\nالإجابة: يذكر اسم المحافظة والقائد.\nس5 (مستوى التطبيق): ما الأوضاع التي أديتها في قسم الأوضاع؟\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس6 (مستوى الاستدلال): لماذا تحصل المجموعة على نقاط للنظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان مثل الأداء.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر خطوتين من خطوات غسل اليدين.\nالإجابة: البلل بالماء ثم الفرك بالصابون (أو الشطف والتجفيف).\nس2 (مستوى التطبيق): ما دور الصابون في لعبة اليوم؟\nالإجابة: يحرر الزملاء الذين لمستهم الجرثومة، أي يقضي على الجراثيم.\nس3 (مستوى الاستدلال): كيف تحافظ على نظافة زيّك الرياضي؟\nالإجابة: أغسله بعد كل حصة وأحتفظ به في كيس نظيف.\n\nس4 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم التشكيلات وقسم أجزاء الجسم (أو الأوضاع، الموانع).\nس5 (مستوى التطبيق): ما الجزء الذي استخدمته في تنطيط الكرة بالرأس؟\nالإجابة: الرأس.\nس6 (مستوى الاستدلال): كيف تشعر عندما تفوز مجموعة أخرى؟\nالإجابة: أصفق لها وأهنئها لأن المشاركة أهم من الفوز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تابع غسل يدي طفلك بعد اللعب وقبل الطعام بالخطوات الخمس، وجهزا الزي الرياضي النظيف للحصة القادمة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان ومجموعته، وشجعه على أداء تمرينين من الأوضاع الأساسية في المنزل (دليل المعلم ص 47-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر ممارسات النظافة الشخصية قبل الحصة وبعدها (غسل اليدين، تغيير الملابس).\n2. يطبق خطوات غسل اليدين الصحيحة.\n3. يقدر أهمية النظافة في الوقاية من الأمراض.\n4. يؤدي التشكيلات والأوضاع الأساسية ضمن أقسام المهرجان.\n5. يوظف أجزاء جسمه في تمرينات المحطات.\n6. يشارك مجموعته بروح الفريق والنظام في المهرجان.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: صابون وماء\n- أخرى: بطاقات مصورة لخطوات غسل اليدين\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: كرات متوسطة\n- أخرى: بطاقات التشكيلات والأوضاع\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- النظافة الشخصية\n- غسل اليدين\n- الزي الرياضي\n- الوقاية\n- المهرجان الرياضي التعليمي\n- المحطات\n- قائد المجموعة\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة ليدين متسختين بعد اللعب ويسأل: ماذا نفعل بعد اللعب في الساحة؟ ولماذا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء خفيف بنموذج المعلم: مشي وجري بين الأطواق وتحريك الذراعين، ويؤدي التلميذ الإحماء بنشاط (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم بطاقات خطوات غسل اليدين (بلل، صابون، فرك 20 ثانية، شطف، تجفيف) ويؤدي النموذج بالتفكير بصوت عالٍ، ثم يناقش الزي الرياضي النظيف وتغييره بعد الحصة، ويقلد التلميذ خطوات غسل اليدين بالتمثيل ويرتب البطاقات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (الجرثومة والصابون): تلميذ جرثومة يطارد الزملاء، ومن يُلمس يثبت حتى يلمسه تلميذ (الصابون) فيعود للعب، ويلعب التلميذ ويعبر عن دور الصابون في التخلص من الجراثيم (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات صغيرة، ترتب كل مجموعة بطاقات خطوات غسل اليدين بالترتيب الصحيح وتعرضها، ويرتب التلميذ البطاقات مع مجموعته ويشرح خطوة واحدة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة بالتنفس، ثم الذهاب بنظام لغسل اليدين تطبيقًا عمليًا، ويغسل التلميذ يديه بالخطوات الصحيحة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. المهرجان بأربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم التشكيلات (تكوين التشكيل بالنداء)، قسم أجزاء الجسم (محطات الرأس والذراعين والرجلين بالكرة)، قسم الأوضاع الأساسية (تمرين من كل وضع بالبطاقة)، قسم جمباز الموانع المبسط (وثب داخل الأطواق ودحرجة على المرتبة)، مع تسجيل نقاط النظام والتعاون، ويؤدي التلميذ مع مجموعته مهام كل قسم بقيادة القائد وينتقل بنظام عند الإشارة (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n7. مسابقة ختامية سريعة: أسرع مجموعة تكوّن تشكيل الدائرة ثم تؤدي وضع الجثو، ويتسابق التلميذ مع مجموعته بدقة ونظام (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتكريم جميع المشاركين وإعلان الترتيب بروح رياضية، ويؤدي التلميذ التهدئة ويصفق لجميع المجموعات (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): متى نغسل أيدينا في يوم الحصة؟\nالإجابة: بعد اللعب وقبل الأكل.\nس2 (مستوى التطبيق): كم ثانية نفرك أيدينا بالصابون؟\nالإجابة: نحو 20 ثانية.\nس3 (مستوى الاستدلال): لماذا نغير ملابس الرياضة بعد الحصة؟\nالإجابة: لأنها تمتلئ بالعرق وقد تسبب الأمراض والرائحة غير المحببة.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.\n\nس4 (مستوى المعرفة): ما اسم مجموعتك وما اسم قائدها؟\nالإجابة: يذكر اسم المحافظة والقائد.\nس5 (مستوى التطبيق): ما الأوضاع التي أديتها في قسم الأوضاع؟\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس6 (مستوى الاستدلال): لماذا تحصل المجموعة على نقاط للنظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان مثل الأداء.\n\n• نشاط علاجي (لمن لم يتقن): يطبق المعلم مع التلميذ خطوات غسل اليدين أمام المغسلة خطوة خطوة بالعد حتى 20، مع صورة الخطوات، ثم يسأله: متى نغسل أيدينا في يوم الحصة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم ملصق مرسوم لخطوات غسل اليدين وتغيير ملابس الرياضة بعد الحصة، وشرحه لزملائهم في المهرجان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر خطوتين من خطوات غسل اليدين.\nالإجابة: البلل بالماء ثم الفرك بالصابون (أو الشطف والتجفيف).\nس2 (مستوى التطبيق): ما دور الصابون في لعبة اليوم؟\nالإجابة: يحرر الزملاء الذين لمستهم الجرثومة، أي يقضي على الجراثيم.\nس3 (مستوى الاستدلال): كيف تحافظ على نظافة زيّك الرياضي؟\nالإجابة: أغسله بعد كل حصة وأحتفظ به في كيس نظيف.\n\nس4 (مستوى المعرفة): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم التشكيلات وقسم أجزاء الجسم (أو الأوضاع، الموانع).\nس5 (مستوى التطبيق): ما الجزء الذي استخدمته في تنطيط الكرة بالرأس؟\nالإجابة: الرأس.\nس6 (مستوى الاستدلال): كيف تشعر عندما تفوز مجموعة أخرى؟\nالإجابة: أصفق لها وأهنئها لأن المشاركة أهم من الفوز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تابع غسل يدي طفلك بعد اللعب وقبل الطعام بالخطوات الخمس، وجهزا الزي الرياضي النظيف للحصة القادمة (برنامج صحتي، دليل المعلم ص 23).\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان ومجموعته، وشجعه على أداء تمرينين من الأوضاع الأساسية في المنزل (دليل المعلم ص 47-50).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=5"}}, {"title": "التمثيل الحركي", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 52-56", "n": 1, "periods": [{"focus": "التمرينات التمثيلية (تقليد حركات الطبيعة والحيوانات) + القصة الحركية (قصة اجتماعية عن السلامة المرورية والتعاون)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات التمثيلية وأمثلة عليها.\n2. يؤدي تمرينات تمثيلية لحركات الطبيعة والحيوانات مع صوت المعلم.\n3. يبتكر حركة تمثيلية جديدة بأجزاء جسمه.\n4. يؤدي الحركات الأساسية (مشي، جري، وثب) ضمن قصة حركية.\n5. يستنتج القيم والسلوكيات الواردة في القصة.\n6. يشعر بالسعادة أثناء مشاركة زملائه أداء القصة الحركية.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور حيوانات وظواهر طبيعية\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: بطاقات إشارات المرور", "المفاهيم": "- التمرين التمثيلي\n- التقليد\n- تمايل الأشجار\n- طيران العصافير\n- القصة الحركية\n- السلامة المرورية\n- التعاون\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أشجار تتمايل بالريح وصورة عصفور يطير ويسأل: كيف نقلد هذه الحركة بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء تمثيلي بنموذج المعلم: المشي كالجندي، الجري كالحصان، القفز كالضفدع، ويقلد التلميذ حركات الإحماء التمثيلية (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ثم يؤدي نموذج الحركة (تمايل الأشجار: وقوف، الذراعان عاليًا، تبادل ميل الجذع للجانبين؛ طيران العصافير: الجري مع تحريك الذراعين جانبًا) من دليل المعلم ص 53، ويؤدي التلاميذ مع صوته، ويؤدي التلميذ التمرين التمثيلي مع إيقاع صوت المعلم (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (ماذا أمثل؟): يرفع المعلم بطاقة حيوان أو ظاهرة فتؤديها المجموعة، ومن يخمن حركة زميله يحصل على نقطة، ويؤدي التلميذ الحركة ويخمن حركات الزملاء (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في أزواج، يبتكر كل زوج تمرينًا تمثيليًا جديدًا (مثل تجديف القارب) ويعرضه للزملاء، ويبتكر التلميذ الحركة مع زميله ويعرضها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. يسرد المعلم القصة ويؤدي نموذج كل حركة: نعبر الشارع عند الإشارة الخضراء (مشي)، نركض في الحديقة (جري)، نقفز فوق الجدول (وثب داخل الأطواق)، نساعد صديقًا سقط (دحرجة على المرتبة ومد اليد)، نعود في قطار الحافلة (دليل المعلم ص 54-55)، ويؤدي التلميذ حركات القصة مع السرد ويلتزم بالإشارات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. لعبة (الإشارة): بطاقة حمراء توقف، خضراء مشي، صفراء استعداد، ومن يخالف يعيد المحاولة، ويستجيب التلميذ للبطاقات بالحركة الصحيحة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. حوار في مجموعات: ماذا تعلمنا من القصة؟ وماذا فعلنا عندما سقط صديقنا؟ وتعرض كل مجموعة قيمة واحدة، ويناقش التلميذ مع مجموعته ويذكر قيمة من القصة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تهدئة بالتنفس كأننا نشم زهور الحديقة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الحركة التي تمثل تمايل الأشجار؟\nالإجابة: تبادل ميل الجذع للجانبين والذراعان عاليًا.\nس2 (مستوى التطبيق): كيف نمثل طيران العصافير؟\nالإجابة: نجري ونحرك الذراعين لأعلى ولأسفل كالأجنحة.\nس3 (مستوى الاستدلال): ما الفائدة من التمرينات التمثيلية؟\nالإجابة: تحرك أجزاء الجسم بطريقة ممتعة وتنمي الخيال.\n\n• نشاط علاجي (لمن لم يتقن): يقلّد المعلم أمام التلميذ حركة تمايل الأشجار وطيران العصافير ببطء، ويؤديها التلميذ معه مع صوت المعلم، ثم يطلب منه تمثيل طيران العصفور وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.\n\nس4 (مستوى المعرفة): ما الحركة التي أديناها عند عبور الشارع؟\nالإجابة: المشي بهدوء عند الإشارة الخضراء.\nس5 (مستوى التطبيق): كيف ساعدنا الصديق الذي سقط؟\nالإجابة: مددنا له اليد وساعدناه على الوقوف.\nس6 (مستوى الاستدلال): لماذا لا نركض عند عبور الشارع؟\nالإجابة: لأن الركض قد يسبب حادثًا أو السقوط.\n\n• نشاط علاجي (لمن لم يتقن): يقلّد المعلم أمام التلميذ حركة تمايل الأشجار وطيران العصافير ببطء، ويؤديها التلميذ معه مع صوت المعلم، ثم يطلب منه تمثيل طيران العصفور وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بابتكار حركة تمثيلية جديدة لحيوان أو ظاهرة طبيعية (كالموج أو المطر) وتعليمها لزملائهم، وذكر أجزاء الجسم التي استخدموها.", "التقويم الختامي": "س1 (مستوى المعرفة): مثّل حركة الضفدع.\nالإجابة: يقفز بالقدمين معًا من وضع القرفصاء.\nس2 (مستوى التطبيق): اذكر تمرينًا تمثيليًا ابتكرته أنت وزميلك.\nالإجابة: يذكر الحركة المبتكرة (مثل التجديف).\nس3 (مستوى الاستدلال): أي جزء من الجسم تحركه أكثر عند تمثيل الطيران؟\nالإجابة: الذراعان.\n\nس4 (مستوى المعرفة): اذكر ثلاث حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب.\nس5 (مستوى التطبيق): ما القيمة التي تعلمتها من القصة؟\nالإجابة: التعاون ومساعدة الآخرين والالتزام بإشارات المرور.\nس6 (مستوى الاستدلال): ماذا تعني الإشارة الحمراء للمشاة؟\nالإجابة: التوقف وعدم العبور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاث حركات تمثيلية (الأشجار، العصافير، الضفدع) من دليل المعلم ص 53، ودعه يبتكر حركة لحيوان يحبه.\nإرشاد لولي الأمر: ناقش مع طفلك قصة اليوم ومعاني إشارات المرور، وتدربا على عبور الشارع بأمان (دليل المعلم ص 54-56).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف التمرينات التمثيلية وأمثلة عليها.\n2. يؤدي تمرينات تمثيلية لحركات الطبيعة والحيوانات مع صوت المعلم.\n3. يبتكر حركة تمثيلية جديدة بأجزاء جسمه.\n4. يؤدي الحركات الأساسية (مشي، جري، وثب) ضمن قصة حركية.\n5. يستنتج القيم والسلوكيات الواردة في القصة.\n6. يشعر بالسعادة أثناء مشاركة زملائه أداء القصة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور حيوانات وظواهر طبيعية\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: بطاقات إشارات المرور", "المفاهيم": "الحصة 1:\n- التمرين التمثيلي\n- التقليد\n- تمايل الأشجار\n- طيران العصافير\n- القصة الحركية\n- السلامة المرورية\n- التعاون\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة أشجار تتمايل بالريح وصورة عصفور يطير ويسأل: كيف نقلد هذه الحركة بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء تمثيلي بنموذج المعلم: المشي كالجندي، الجري كالحصان، القفز كالضفدع، ويقلد التلميذ حركات الإحماء التمثيلية (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يعرض المعلم الموقف ثم يؤدي نموذج الحركة (تمايل الأ
