لماذا نرتدي الحذاء الرياضي في الحصة؟\nالإجابة: ليحمي القدم من الإصابة ويساعدنا على الجري والوثب بأمان.\n\nالحصة 2:\nس1 (مستوى الدعم): ماذا تفعل عندما أرفع البطاقة الحمراء؟\nالإجابة: أتوقف في مكاني.\nس2 (المستوى المتوقع): ما الفرق بين المشي والجري؟\nالإجابة: الجري أسرع من المشي، وفي الجري ترتفع القدمان عن الأرض لحظة.\nس3 (المستوى المتقدم): لماذا نتوقف عند كلمة (شمع) دون أن نسقط؟\nالإجابة: لأن ذلك يدربنا على الثبات والانتباه والاستجابة للإشارة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أين تمارس حصة التربية البدنية؟\nالإجابة: في ساحة اللعب أو الصالة الرياضية.\nس2 (المستوى المتوقع): اذكر قاعدة واحدة من قواعد الأمن والسلامة في الحصة.\nالإجابة: عدم الدفع أو الجري نحو الزملاء، أو الالتزام بالصافرة.\nس3 (المستوى المتقدم): ماذا تفعل الأرانب في اللعبة عند سماع الصافرة؟\nالإجابة: تعود مسرعة إلى بيوتها (الأطواق) دون تدافع.\n\nالحصة 2:\nس1 (مستوى الدعم): سمِّ أداتين رياضيتين استخدمناهما اليوم.\nالإجابة: الكرة والطوق (أو القمع).\nس2 (المستوى المتوقع): ما الحركة المناسبة للبطاقة الصفراء؟\nالإجابة: المشي.\nس3 (المستوى المتقدم): كيف تساعد مجموعتك في المحطة؟\nالإجابة: أؤدي دوري بسرعة ثم أعيد الأداة لمكانها لزميلي.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من إحضار الزي الرياضي والحذاء الرياضي وزجاجة ماء في يوم الحصة، وتصفح معه صفحة قواعد السلامة في الحصة (دليل المعلم ص 12).\n\nالحصة 2:\nإرشاد للتلميذ وولي الأمر: العب لعبة (شمس وشمع) مع أفراد الأسرة في المنزل، وتعرف إلى الأدوات الرياضية من صور دليل المعلم ص 13-14."}}, {"title": "التشكيلات الرياضية", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 26-34", "n": 2, "periods": [{"focus": "أنواع التشكيلات الرياضية (الانتشار الحر، الصف، القطار)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء تشكيلات الانتشار الحر والصف والقطار.\n2. يميز بين تشكيلي الصف والقطار من الصورة.\n3. يشارك زملاءه في تكوين التشكيل الذي يناديه المعلم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات صور التشكيلات", "المفاهيم": "- التشكيلات الرياضية\n- الانتشار الحر\n- الصف\n- القطار\n- التلميذ الدليل", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نقف في طابور الصباح؟ وكيف يقف الناس في السوق؟ ويربط الإجابات بصور الصف والانتشار الحر في دليل المعلم ص 27-28.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم مشي مع رفع الركبتين، وتحريك الذراعين أمامًا وجانبًا.\n- الطالب: يقلد التلميذ الحركات مع المحافظة على المسافة بينه وبين زميله.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم التشكيلات الثلاثة ويؤدي نموذجًا بمساعدة تلميذ (دليل): يمشي الدليل ويقف وسط الخط فيصطف الباقون يمينه ويساره، ثم القطار خلف الدليل.\n- الطالب: يراقب النموذج ثم يؤدي التشكيل الموجه مع المجموعة باتباع التلميذ الدليل.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (اسمع ونفذ): ينتشر التلاميذ بالجري، وعند نداء (صف) أو (قطار) أو (انتشار) تكوّن كل مجموعة التشكيل بأسرع وقت، وتمنح نقطة للأسرع والأدق.\n- الطالب: يستمع للنداء ويتجمع مع مجموعته في التشكيل الصحيح دون تدافع.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 من دليل المعلم ص 30: تشكيل صفين من صف واحد بثبات تلميذ ورجوع التالي خطوتين للخلف بالعد (1، 2).\n- الطالب: يعد مع زملائه وينفذ الرجوع للخلف في الموعد الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي البطيء في القطار ثم الجلوس في دائرة والتنفس العميق مع مراجعة أسماء التشكيلات بالبطاقات.\n- الطالب: يؤدي التهدئة ويسمي التشكيل الذي في البطاقة.", "التقويم التكويني": "س1 (مستوى الدعم): ما اسم التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (المستوى المتوقع): كيف يقف التلاميذ في تشكيل الصف؟\nالإجابة: بجانب بعضهم على خط واحد مع مسافة بينهم.\nس3 (المستوى المتقدم): لماذا نحتاج التلميذ الدليل عند تكوين التشكيل؟\nالإجابة: لأن الجميع يصطفون بالنسبة له فيكون التشكيل منتظمًا وسريعًا.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة فيها أطفال منتشرون بلا نظام، ما اسم هذا التشكيل؟\nالإجابة: الانتشار الحر.\nس2 (المستوى المتوقع): متى نستخدم تشكيل القطار في حياتنا اليومية؟\nالإجابة: عند ركوب الحافلة أو طابور الصباح أو الشراء من الجمعية التعاونية.\nس3 (المستوى المتقدم): كيف نكوّن تشكيل الصف بسرعة ونظام؟\nالإجابة: يقف الدليل في منتصف الخط ويصطف الباقون يمينه ويساره بهدوء ومسافة متساوية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شاهد مع طفلك صور التشكيلات في دليل المعلم ص 27-29، واطلب منه أن يذكر مثالًا من الحياة اليومية لكل تشكيل."}}, {"focus": "تشكيلا المربع الناقص ضلعًا والدائرة والانتقال بين التشكيلات", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف تشكيلي المربع الناقص ضلعًا والدائرة.\n2. ينتقل مع زملائه من تشكيل إلى آخر بانسيابية.\n3. يقدر أهمية التشكيلات في الالتزام بالنظام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: مقاعد سويدية\n- أخرى: سلة بها صور التشكيلات", "المفاهيم": "- المربع الناقص ضلعًا\n- الدائرة\n- الانتقال بين التشكيلات\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تشكيلات الحصة السابقة بالنداء السريع، ثم يسأل: كيف يقف المصلون حول الكعبة؟ وكيف تسير السيارات حول الدوار؟ ليقدم تشكيل الدائرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم داخل تشكيل الدائرة: مشي ثم جري في محيط الدائرة مع حركات للذراعين.\n- الطالب: يؤدي الإحماء داخل الدائرة محافظًا على شكلها.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الانتقال: من قطارين إلى مربع ناقص ضلعًا بدوران التلميذين الدليلين، ثم تشبيك الأيدي لإغلاق الضلع وتكوين الدائرة (دليل المعلم ص 29-30).\n- الطالب: يشاهد ثم ينفذ الانتقال بالتوجيه خطوة خطوة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (محطات التشكيلات) ص 31: أربع مجموعات، كل محطة بتشكيل ومهارة: قطار يمشي على المقعد السويدي، صفان يتبادلان تمرير الكرة، انتشار حر يثب داخل الأطواق، دائرة تجري متعرجًا بين الأقماع، ثم التبديل.\n- الطالب: تؤدي كل مجموعة مهارة محطتها بالتشكيل المحدد وتنتقل عند الإشارة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المنافسة مع الزملاء) ص 33: يجري الأول من كل قطار نحو السلة ويرفع صورة التشكيل الذي ناداه المعلم، فتؤديه مجموعته، ونقطة للأدق.\n- الطالب: يختار الصورة الصحيحة بسرعة وتكوّن مجموعته التشكيل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة في تشكيل الدائرة بالتنفس والإطالة، ونقاش قصير: أين نستخدم التشكيلات في المدرسة؟\n- الطالب: يؤدي التهدئة ويذكر موقفًا يحتاج فيه إلى الوقوف بنظام.", "التقويم التكويني": "س1 (مستوى الدعم): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\nس2 (المستوى المتوقع): كيف ننتقل من المربع الناقص ضلعًا إلى الدائرة؟\nالإجابة: يشبك كل تلميذ يده مع زميله لإغلاق الضلع الناقص فتتكون الدائرة.\nس3 (المستوى المتقدم): لماذا تساعدنا التشكيلات على التعلم بسرعة؟\nالإجابة: لأن كل تلميذ يرى المعلم ويجد مكانًا كافيًا للحركة دون تصادم.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة الدائرة، ما اسم التشكيل؟\nالإجابة: الدائرة.\nس2 (المستوى المتوقع): اذكر مهارة أديناها في محطة القطار اليوم.\nالإجابة: المشي على المقعد السويدي والعودة لخلف القطار.\nس3 (المستوى المتقدم): ماذا يحدث لو لم نلتزم بالتشكيل عند تمرير الكرة؟\nالإجابة: تضيع الكرات ويتصادم التلاميذ ولا يصل التمرير للزميل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك أسماء التشكيلات الخمسة بالصور (دليل المعلم ص 27-30) واطلب منه ترتيب أفراد الأسرة في تشكيل دائرة أو قطار."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء تشكيلات الانتشار الحر والصف والقطار.\n2. يميز بين تشكيلي الصف والقطار من الصورة.\n3. يشارك زملاءه في تكوين التشكيل الذي يناديه المعلم.\n\nالحصة 2:\n1. يتعرف تشكيلي المربع الناقص ضلعًا والدائرة.\n2. ينتقل مع زملائه من تشكيل إلى آخر بانسيابية.\n3. يقدر أهمية التشكيلات في الالتزام بالنظام.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- أخرى: بطاقات صور التشكيلات\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: مقاعد سويدية\n- أخرى: سلة بها صور التشكيلات", "المفاهيم": "الحصة 1:\n- التشكيلات الرياضية\n- الانتشار الحر\n- الصف\n- القطار\n- التلميذ الدليل\n\nالحصة 2:\n- المربع الناقص ضلعًا\n- الدائرة\n- الانتقال بين التشكيلات\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: كيف نقف في طابور الصباح؟ وكيف يقف الناس في السوق؟ ويربط الإجابات بصور الصف والانتشار الحر في دليل المعلم ص 27-28.\n\nالحصة 2:\nيراجع المعلم تشكيلات الحصة السابقة بالنداء السريع، ثم يسأل: كيف يقف المصلون حول الكعبة؟ وكيف تسير السيارات حول الدوار؟ ليقدم تشكيل الدائرة.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم مشي مع رفع الركبتين، وتحريك الذراعين أمامًا وجانبًا.\n- الطالب: يقلد التلميذ الحركات مع المحافظة على المسافة بينه وبين زميله.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم التشكيلات الثلاثة ويؤدي نموذجًا بمساعدة تلميذ (دليل): يمشي الدليل ويقف وسط الخط فيصطف الباقون يمينه ويساره، ثم القطار خلف الدليل.\n- الطالب: يراقب النموذج ثم يؤدي التشكيل الموجه مع المجموعة باتباع التلميذ الدليل.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (اسمع ونفذ): ينتشر التلاميذ بالجري، وعند نداء (صف) أو (قطار) أو (انتشار) تكوّن كل مجموعة التشكيل بأسرع وقت، وتمنح نقطة للأسرع والأدق.\n- الطالب: يستمع للنداء ويتجمع مع مجموعته في التشكيل الصحيح دون تدافع.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 1 من دليل المعلم ص 30: تشكيل صفين من صف واحد بثبات تلميذ ورجوع التالي خطوتين للخلف بالعد (1، 2).\n- الطالب: يعد مع زملائه وينفذ الرجوع للخلف في الموعد الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي البطيء في القطار ثم الجلوس في دائرة والتنفس العميق مع مراجعة أسماء التشكيلات بالبطاقات.\n- الطالب: يؤدي التهدئة ويسمي التشكيل الذي في البطاقة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم داخل تشكيل الدائرة: مشي ثم جري في محيط الدائرة مع حركات للذراعين.\n- الطالب: يؤدي الإحماء داخل الدائرة محافظًا على شكلها.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الانتقال: من قطارين إلى مربع ناقص ضلعًا بدوران التلميذين الدليلين، ثم تشبيك الأيدي لإغلاق الضلع وتكوين الدائرة (دليل المعلم ص 29-30).\n- الطالب: يشاهد ثم ينفذ الانتقال بالتوجيه خطوة خطوة.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (محطات التشكيلات) ص 31: أربع مجموعات، كل محطة بتشكيل ومهارة: قطار يمشي على المقعد السويدي، صفان يتبادلان تمرير الكرة، انتشار حر يثب داخل الأطواق، دائرة تجري متعرجًا بين الأقماع، ثم التبديل.\n- الطالب: تؤدي كل مجموعة مهارة محطتها بالتشكيل المحدد وتنتقل عند الإشارة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المنافسة مع الزملاء) ص 33: يجري الأول من كل قطار نحو السلة ويرفع صورة التشكيل الذي ناداه المعلم، فتؤديه مجموعته، ونقطة للأدق.\n- الطالب: يختار الصورة الصحيحة بسرعة وتكوّن مجموعته التشكيل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة في تشكيل الدائرة بالتنفس والإطالة، ونقاش قصير: أين نستخدم التشكيلات في المدرسة؟\n- الطالب: يؤدي التهدئة ويذكر موقفًا يحتاج فيه إلى الوقوف بنظام.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما اسم التشكيل الذي يقف فيه التلاميذ خلف بعضهم؟\nالإجابة: القطار.\nس2 (المستوى المتوقع): كيف يقف التلاميذ في تشكيل الصف؟\nالإجابة: بجانب بعضهم على خط واحد مع مسافة بينهم.\nس3 (المستوى المتقدم): لماذا نحتاج التلميذ الدليل عند تكوين التشكيل؟\nالإجابة: لأن الجميع يصطفون بالنسبة له فيكون التشكيل منتظمًا وسريعًا.\n\nالحصة 2:\nس1 (مستوى الدعم): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\nس2 (المستوى المتوقع): كيف ننتقل من المربع الناقص ضلعًا إلى الدائرة؟\nالإجابة: يشبك كل تلميذ يده مع زميله لإغلاق الضلع الناقص فتتكون الدائرة.\nس3 (المستوى المتقدم): لماذا تساعدنا التشكيلات على التعلم بسرعة؟\nالإجابة: لأن كل تلميذ يرى المعلم ويجد مكانًا كافيًا للحركة دون تصادم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أرفع صورة فيها أطفال منتشرون بلا نظام، ما اسم هذا التشكيل؟\nالإجابة: الانتشار الحر.\nس2 (المستوى المتوقع): متى نستخدم تشكيل القطار في حياتنا اليومية؟\nالإجابة: عند ركوب الحافلة أو طابور الصباح أو الشراء من الجمعية التعاونية.\nس3 (المستوى المتقدم): كيف نكوّن تشكيل الصف بسرعة ونظام؟\nالإجابة: يقف الدليل في منتصف الخط ويصطف الباقون يمينه ويساره بهدوء ومسافة متساوية.\n\nالحصة 2:\nس1 (مستوى الدعم): أرفع صورة الدائرة، ما اسم التشكيل؟\nالإجابة: الدائرة.\nس2 (المستوى المتوقع): اذكر مهارة أديناها في محطة القطار اليوم.\nالإجابة: المشي على المقعد السويدي والعودة لخلف القطار.\nس3 (المستوى المتقدم): ماذا يحدث لو لم نلتزم بالتشكيل عند تمرير الكرة؟\nالإجابة: تضيع الكرات ويتصادم التلاميذ ولا يصل التمرير للزميل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شاهد مع طفلك صور التشكيلات في دليل المعلم ص 27-29، واطلب منه أن يذكر مثالًا من الحياة اليومية لكل تشكيل.\n\nالحصة 2:\nإرشاد لولي الأمر: راجع مع طفلك أسماء التشكيلات الخمسة بالصور (دليل المعلم ص 27-30) واطلب منه ترتيب أفراد الأسرة في تشكيل دائرة أو قطار."}}, {"title": "أجزاء الجسم", "unit": "التمرينات (أتمرن بنظام)", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 35-42", "n": 2, "periods": [{"focus": "التعرف إلى أجزاء الجسم ومفاصله واستخداماتها", "num": 1, "fields": {"المخرجات التعليمية": "1. يسمي أجزاء الجسم الرئيسة (الرأس، الجذع، الذراعان، الرجلان) ومفاصلها.\n2. يربط كل جزء من الجسم بحركة رياضية يؤديها.\n3. يوظف أجزاء جسمه في أداء حركات بسيطة عند النداء.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: بطاقات صور وأسماء أجزاء الجسم\n- أخرى: كرات\n- أخرى: سلال بلاستيكية\n- صورة توضيحية", "المفاهيم": "- أجزاء الجسم\n- المفاصل\n- الحركة\n- الجانب الأيمن والأيسر", "التهيئة / التمهيد / التعلم القبلي": "يغني المعلم مع التلاميذ أنشودة (رأس، كتف، ركبة، قدم) مع لمس الأجزاء، ثم يسأل: بأي جزء نركل الكرة؟ وبأي جزء نرميها؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: تحريك كل جزء من الجسم على حدة (دوران الرأس ببطء، الكتفين، الذراعين، الركبتين، الكاحلين) مع تسمية الجزء.\n- الطالب: يقلد ويسمي الجزء الذي يحركه بصوت مسموع.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 37: يجري التلاميذ دقيقة ثم يضع المعلم يده على صدره ويسأل: ماذا تغيّر في جسمك؟ ليكتشفوا سرعة نبض القلب والتنفس وارتفاع الحرارة.\n- الطالب: يلاحظ التغيرات في جسمه ويعبر عنها (قلبي يدق بسرعة، أتنفس أسرع).\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 2 (لمس أجزاء الجسم من الحركة) ص 38: ينتشر التلاميذ بالجري وعند نداء جزء (مرفق، كاحل، كتف) يلمسه التلميذ ويثبت، ومن يخطئ يؤدي حركة بسيطة.\n- الطالب: يستجيب للنداء بلمس الجزء الصحيح بسرعة ودقة.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 4 (محطات أجزاء الجسم) ص 40: محطة الرأس (تنطيط كرة بالرأس عاليًا)، محطة الذراعين (رمي الكرة في السلة)، محطة الرجلين (ركل الكرة للزميل)، مع التبديل.\n- الطالب: يؤدي مهارة المحطة بالجزء المحدد ويبدل مع مجموعته عند الإشارة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالإطالة لكل جزء مع نموذج المعلم، ومراجعة سريعة ببطاقات الأجزاء.\n- الطالب: يؤدي الإطالة ويسمي الجزء في البطاقة.", "التقويم التكويني": "س1 (مستوى الدعم): سمِّ ثلاثة أجزاء من جسمك.\nالإجابة: الرأس، الذراعان، الرجلان (أو الجذع).\nس2 (المستوى المتوقع): ما الجزء الذي نستخدمه لركل الكرة؟\nالإجابة: الرجل (القدم).\nس3 (المستوى المتقدم): لماذا دق قلبك بسرعة بعد الجري؟\nالإجابة: لأن الجسم يحتاج إلى دم وهواء أكثر عند الحركة.", "التقويم الختامي": "س1 (مستوى الدعم): ارفع يدك اليمنى، وأشر إلى مرفقك.\nالإجابة: يرفع اليد اليمنى ويشير إلى المرفق الصحيح.\nس2 (المستوى المتوقع): اذكر مهارة رياضية تؤدى بالرأس.\nالإجابة: ضرب الكرة بالرأس في كرة القدم.\nس3 (المستوى المتقدم): كيف نحافظ على سلامة أجزاء الجسم أثناء اللعب؟\nالإجابة: بالإحماء قبل اللعب، ولبس الحذاء الرياضي، وعدم الدفع أو التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرّب مع طفلك على تسمية أجزاء الجسم ومفاصله ومعرفة الجانب الأيمن والأيسر مستعينًا بصور دليل المعلم ص 36-37."}}, {"focus": "توظيف أجزاء الجسم في الحركات والمهارات الرياضية والمحافظة على القوام", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز الزي الرياضي والواقي المناسب لكل جزء من الجسم.\n2. يؤدي حركات مركبة توظف أكثر من جزء في الجسم.\n3. يقدر أهمية المحافظة على سلامة الجسم والقوام السليم.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: بطاقات صور أجزاء الجسم مقطعة\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حقيبة مدرسية\n- صورة توضيحية", "المفاهيم": "- القوام السليم\n- حمل الحقيبة\n- الجلوس الصحيح\n- الزي الرياضي\n- الواقي", "التهيئة / التمهيد / التعلم القبلي": "يحمل المعلم حقيبة على كتف واحد منحنيًا ويسأل: هل هذه طريقة صحيحة؟ ثم يعرض صورة الطريقة الصحيحة لحمل الحقيبة والجلوس (دليل المعلم ص 36).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع التركيز على القوام: مشي معتدل، جري مع رفع الرأس والنظر للأمام، ثم إطالة للظهر.\n- الطالب: يؤدي الإحماء محافظًا على استقامة الظهر ورفع الرأس.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم نموذجًا للجلوس الصحيح وحمل الحقيبة على الكتفين، ثم يشرح الزي والواقيات بالصور (واقي الرأس، واقي الصدر، القميص الرياضي).\n- الطالب: يؤدي الجلوس وحمل الحقيبة بالطريقة الصحيحة ويطابق الواقي مع الجزء المناسب.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (مشاركة الزملاء في أداء الحركات) ص 39: في أزواج، يؤدي تلميذ حركة بجزء معين ويقلدها زميله ثم يبتكران حركة توظف الذراعين والرجلين معًا.\n- الطالب: يؤدي الحركة مع زميله ويبتكر حركة جديدة بجزأين.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (التنافس مع الزملاء) ص 41: تجمع كل مجموعة قطع صورة الجزء الذي يناديه المعلم وتشكلها بأسرع وقت ثم تؤدي حركته.\n- الطالب: يتعاون مع مجموعته في تجميع الصورة وأداء الحركة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة مع نموذج المعلم، ونصيحة اليوم: اجلس معتدلًا واحمل حقيبتك على الكتفين.\n- الطالب: يؤدي التهدئة ويكرر النصيحة.", "التقويم التكويني": "س1 (مستوى الدعم): على أي كتف نحمل الحقيبة؟\nالإجابة: على الكتفين معًا.\nس2 (المستوى المتوقع): ما الواقي الذي يحمي الرأس في بعض الألعاب؟\nالإجابة: واقي الرأس (الخوذة).\nس3 (المستوى المتقدم): ما ضرر الجلوس المنحني لفترة طويلة؟\nالإجابة: يسبب تقوس الظهر وألمه ويؤثر في القوام.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر جزأين من الجسم استخدمتهما معًا في حركة اليوم.\nالإجابة: الذراعان والرجلان (مثل الوثب مع رفع الذراعين).\nس2 (المستوى المتوقع): ما الزي المناسب لحصة التربية البدنية؟\nالإجابة: القميص والبنطال الرياضي والحذاء الرياضي.\nس3 (المستوى المتقدم): كيف تنصح زميلك الذي يجلس منحنيًا؟\nالإجابة: أقول له: اجلس معتدل الظهر وارفع رأسك لتحافظ على قوامك.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راقب طريقة جلوس طفلك وحمله للحقيبة على الكتفين، وناقش معه صور الزي الرياضي والواقيات في دليل المعلم ص 37."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يسمي أجزاء الجسم الرئيسة (الرأس، الجذع، الذراعان، الرجلان) ومفاصلها.\n2. يربط كل جزء من الجسم بحركة رياضية يؤديها.\n3. يوظف أجزاء جسمه في أداء حركات بسيطة عند النداء.\n\nالحصة 2:\n1. يميز الزي الرياضي والواقي المناسب لكل جزء من الجسم.\n2. يؤدي حركات مركبة توظف أكثر من جزء في الجسم.\n3. يقدر أهمية المحافظة على سلامة الجسم والقوام السليم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: بطاقات صور وأسماء أجزاء الجسم\n- أخرى: كرات\n- أخرى: سلال بلاستيكية\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: بطاقات صور أجزاء الجسم مقطعة\n- أخرى: كرات\n- أخرى: أطواق\n- أخرى: حقيبة مدرسية\n- صورة توضيحية", "المفاهيم": "الحصة 1:\n- أجزاء الجسم\n- المفاصل\n- الحركة\n- الجانب الأيمن والأيسر\n\nالحصة 2:\n- القوام السليم\n- حمل الحقيبة\n- الجلوس الصحيح\n- الزي الرياضي\n- الواقي", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيغني المعلم مع التلاميذ أنشودة (رأس، كتف، ركبة، قدم) مع لمس الأجزاء، ثم يسأل: بأي جزء نركل الكرة؟ وبأي جزء نرميها؟\n\nالحصة 2:\nيحمل المعلم حقيبة على كتف واحد منحنيًا ويسأل: هل هذه طريقة صحيحة؟ ثم يعرض صورة الطريقة الصحيحة لحمل الحقيبة والجلوس (دليل المعلم ص 36).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: تحريك كل جزء من الجسم على حدة (دوران الرأس ببطء، الكتفين، الذراعين، الركبتين، الكاحلين) مع تسمية الجزء.\n- الطالب: يقلد ويسمي الجزء الذي يحركه بصوت مسموع.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 37: يجري التلاميذ دقيقة ثم يضع المعلم يده على صدره ويسأل: ماذا تغيّر في جسمك؟ ليكتشفوا سرعة نبض القلب والتنفس وارتفاع الحرارة.\n- الطالب: يلاحظ التغيرات في جسمه ويعبر عنها (قلبي يدق بسرعة، أتنفس أسرع).\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 2 (لمس أجزاء الجسم من الحركة) ص 38: ينتشر التلاميذ بالجري وعند نداء جزء (مرفق، كاحل، كتف) يلمسه التلميذ ويثبت، ومن يخطئ يؤدي حركة بسيطة.\n- الطالب: يستجيب للنداء بلمس الجزء الصحيح بسرعة ودقة.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 4 (محطات أجزاء الجسم) ص 40: محطة الرأس (تنطيط كرة بالرأس عاليًا)، محطة الذراعين (رمي الكرة في السلة)، محطة الرجلين (ركل الكرة للزميل)، مع التبديل.\n- الطالب: يؤدي مهارة المحطة بالجزء المحدد ويبدل مع مجموعته عند الإشارة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالإطالة لكل جزء مع نموذج المعلم، ومراجعة سريعة ببطاقات الأجزاء.\n- الطالب: يؤدي الإطالة ويسمي الجزء في البطاقة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع التركيز على القوام: مشي معتدل، جري مع رفع الرأس والنظر للأمام، ثم إطالة للظهر.\n- الطالب: يؤدي الإحماء محافظًا على استقامة الظهر ورفع الرأس.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم نموذجًا للجلوس الصحيح وحمل الحقيبة على الكتفين، ثم يشرح الزي والواقيات بالصور (واقي الرأس، واقي الصدر، القميص الرياضي).\n- الطالب: يؤدي الجلوس وحمل الحقيبة بالطريقة الصحيحة ويطابق الواقي مع الجزء المناسب.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (مشاركة الزملاء في أداء الحركات) ص 39: في أزواج، يؤدي تلميذ حركة بجزء معين ويقلدها زميله ثم يبتكران حركة توظف الذراعين والرجلين معًا.\n- الطالب: يؤدي الحركة مع زميله ويبتكر حركة جديدة بجزأين.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 5 (التنافس مع الزملاء) ص 41: تجمع كل مجموعة قطع صورة الجزء الذي يناديه المعلم وتشكلها بأسرع وقت ثم تؤدي حركته.\n- الطالب: يتعاون مع مجموعته في تجميع الصورة وأداء الحركة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة مع نموذج المعلم، ونصيحة اليوم: اجلس معتدلًا واحمل حقيبتك على الكتفين.\n- الطالب: يؤدي التهدئة ويكرر النصيحة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): سمِّ ثلاثة أجزاء من جسمك.\nالإجابة: الرأس، الذراعان، الرجلان (أو الجذع).\nس2 (المستوى المتوقع): ما الجزء الذي نستخدمه لركل الكرة؟\nالإجابة: الرجل (القدم).\nس3 (المستوى المتقدم): لماذا دق قلبك بسرعة بعد الجري؟\nالإجابة: لأن الجسم يحتاج إلى دم وهواء أكثر عند الحركة.\n\nالحصة 2:\nس1 (مستوى الدعم): على أي كتف نحمل الحقيبة؟\nالإجابة: على الكتفين معًا.\nس2 (المستوى المتوقع): ما الواقي الذي يحمي الرأس في بعض الألعاب؟\nالإجابة: واقي الرأس (الخوذة).\nس3 (المستوى المتقدم): ما ضرر الجلوس المنحني لفترة طويلة؟\nالإجابة: يسبب تقوس الظهر وألمه ويؤثر في القوام.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ارفع يدك اليمنى، وأشر إلى مرفقك.\nالإجابة: يرفع اليد اليمنى ويشير إلى المرفق الصحيح.\nس2 (المستوى المتوقع): اذكر مهارة رياضية تؤدى بالرأس.\nالإجابة: ضرب الكرة بالرأس في كرة القدم.\nس3 (المستوى المتقدم): كيف نحافظ على سلامة أجزاء الجسم أثناء اللعب؟\nالإجابة: بالإحماء قبل اللعب، ولبس الحذاء الرياضي، وعدم الدفع أو التصادم.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر جزأين من الجسم استخدمتهما معًا في حركة اليوم.\nالإجابة: الذراعان والرجلان (مثل الوثب مع رفع الذراعين).\nس2 (المستوى المتوقع): ما الزي المناسب لحصة التربية البدنية؟\nالإجابة: القميص والبنطال الرياضي والحذاء الرياضي.\nس3 (المستوى المتقدم): كيف تنصح زميلك الذي يجلس منحنيًا؟\nالإجابة: أقول له: اجلس معتدل الظهر وارفع رأسك لتحافظ على قوامك.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرّب مع طفلك على تسمية أجزاء الجسم ومفاصله ومعرفة الجانب الأيمن والأيسر مستعينًا بصور دليل المعلم ص 36-37.\n\nالحصة 2:\nإرشاد لولي الأمر: راقب طريقة جلوس طفلك وحمله للحقيبة على الكتفين، وناقش معه صور الزي الرياضي والواقيات في دليل المعلم ص 37."}}, {"title": "الأوضاع الأساسية في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 43-51", "n": 2, "periods": [{"focus": "وضعا الوقوف والجثو", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف وضعي الوقوف والجثو ونقاطهما الفنية.\n2. يؤدي وضعي الوقوف والجثو بطريقة صحيحة.\n3. يميز بين الوضعين من الصورة أو النداء.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات صور الأوضاع الأساسية\n- صورة توضيحية", "المفاهيم": "- التمرين\n- الوضع الأساسي\n- الوقوف\n- الجثو\n- القوام السليم", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كيف نقف في طابور الصباح؟ وكيف نجلس على ركبنا عند اللعب على السجاد؟ ثم يعرض صورتي الوقوف والجثو ويذكر أنهما وضعان أساسيان نبدأ منهما التمرينات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم في تشكيل الصف: مشي، جري خفيف، تمرينات للذراعين والرجلين.\n- الطالب: يؤدي الإحماء في الصف محافظًا على النظام.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج وضع الوقوف (العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم) ثم الجثو (الركبتان على المرتبة، الجذع مستقيم) مع التفكير بصوت عالٍ عن النقاط الفنية (ص 44-45).\n- الطالب: يقلد الوضع ويصحح زميله من البطاقة المصورة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 1 (حركة، حركة، وضع) ص 47: يجري التلاميذ وعند نداء (وقوف) أو (جثو) يثبت كل تلميذ في الوضع الصحيح داخل أقرب طوق.\n- الطالب: يستجيب للنداء بالوضع الصحيح ويحافظ على ثباته.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 48: في مجموعات، تؤدي كل مجموعة تمرينين بسيطين من الوقوف (رفع الذراعين عاليًا) ومن الجثو (مد الذراعين جانبًا) بالعد الجماعي.\n- الطالب: يعد مع مجموعته ويؤدي التمرين من الوضع المحدد.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من وضع الجثو بالتنفس العميق، ومراجعة الوضعين بالبطاقات.\n- الطالب: يؤدي التهدئة ويسمي الوضع في البطاقة.", "التقويم التكويني": "س1 (مستوى الدعم): ما اسم الوضع الذي تكون فيه الركبتان على الأرض؟\nالإجابة: الجثو.\nس2 (المستوى المتوقع): أين تكون الذراعان في وضع الوقوف الأساسي؟\nالإجابة: بجانب الجسم.\nس3 (المستوى المتقدم): لماذا نبدأ التمرين من وضع صحيح؟\nالإجابة: ليكون التمرين مفيدًا وآمنًا ويحافظ على القوام.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ وضع الوقوف الصحيح.\nالإجابة: يقف معتدلًا، العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم.\nس2 (المستوى المتوقع): ما الفرق بين الوقوف والجثو؟\nالإجابة: في الوقوف نرتكز على القدمين، وفي الجثو نرتكز على الركبتين.\nس3  من السلة فتؤديه مجموعته، ونقطة للمجموعة الأدق.\n- الطالب: يسحب البطاقة ويعود مسرعًا وتؤدي مجموعته الوضع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من وضع الرقود بالتنفس العميق، وحوار: لماذا نمارس التمرينات يوميًا؟\n- الطالب: يرقد ويتنفس بعمق ويذكر فائدة للتمرينات.", "التقويم التكويني": "س1 (مستوى الدعم): ما اسم الوضع الذي تكون فيه الرجلان متقاطعتين؟\nالإجابة: الجلوس التربيع.\nس2 (المستوى المتوقع): كيف يكون الظهر في وضع الرقود؟\nالإجابة: ملاصقًا للمرتبة (الأرض).\nس3 (المستوى المتقدم): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين لأعلى.", "التقويم الختامي": "س1 (مستوى الدعم): سمِّ الأوضاع الأساسية الأربعة التي تعلمتها.\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس2 (المستوى المتوقع): أرفع بطاقة الرقود، أدِّ الوضع الصحيح.\nالإجابة: يرقد على الظهر مستقيمًا والذراعان بجانب الجسم.\nس3 (المستوى المتقدم): لماذا تحافظ التمرينات على قوامنا؟\nالإجابة: لأنها تقوي عضلات الظهر والبطن فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الأوضاع الأساسية الأربعة (دليل المعلم ص 44-46) ومارسوا معًا تمرينًا بسيطًا من كل وضع."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف وضعي الوقوف والجثو ونقاطهما الفنية.\n2. يؤدي وضعي الوقوف والجثو بطريقة صحيحة.\n3. يميز بين الوضعين من الصورة أو النداء.\n\nالحصة 2:\n1. يتعرف وضعي الجلوس التربيع والرقود.\n2. يؤدي تمرينات بسيطة من الأوضاع الأساسية الأربعة.\n3. يقدر أهمية التمرينات في المحافظة على الصحة والقوام.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: بطاقات صور الأوضاع الأساسية\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: مراتب\n- أخرى: أقماع\n- أخرى: بطاقات صور الأوضاع الأساسية\n- أخرى: سلال بلاستيكية", "المفاهيم": "ا لم نموذج الجلوس التربيع (الرجلان متقاطعتان، الظهر مستقيم) والرقود (الظهر ملاصق للمرتبة، الذراعان بجانب الجسم) ويوضح النقاط الفنية (ص 45-46).\n- الطالب: يقلد الوضعين على المرتبة ويتحقق من استقامة ظهره.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات الأوضاع الأساسية) ص 49: أربع محطات، في كل محطة بطاقة وضع وتمرين بسيط منه (من الرقود: رفع الرجلين؛ من الجلوس التربيع: لف الجذع)، والتبديل بالإشارة.\n- الطالب: تؤدي المجموعة تمرين المحطة بالوضع الصحيح وتنتقل بنظام.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (المنافسة مع الزملاء) ص 50: يجري الأول من كل قطار ويسحب بطاقة وضع من السلة فتؤديه مجموعته، ونقطة للمجموعة الأدق.\n- الطالب: يسحب البطاقة ويعود مسرعًا وتؤدي مجموعته الوضع.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من وضع الرقود بالتنفس العميق، وحوار: لماذا نمارس التمرينات يوميًا؟\n- الطالب: يرقد ويتنفس بعمق ويذكر فائدة للتمرينات.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما اسم الوضع الذي تكون فيه الركبتان على الأرض؟\nالإجابة: الجثو.\nس2 (المستوى المتوقع): أين تكون الذراعان في وضع الوقوف الأساسي؟\nالإجابة: بجانب الجسم.\nس3 (المستوى المتقدم): لماذا نبدأ التمرين من وضع صحيح؟\nالإجابة: ليكون التمرين مفيدًا وآمنًا ويحافظ على القوام.\n\nالحصة 2:\nس1 (مستوى الدعم): ما اسم الوضع الذي تكون فيه الرجلان متقاطعتين؟\nالإجابة: الجلوس التربيع.\nس2 (المستوى المتوقع): كيف يكون الظهر في وضع الرقود؟\nالإجابة: ملاصقًا للمرتبة (الأرض).\nس3 (المستوى المتقدم): ما التمرين الذي أديناه من وضع الرقود؟\nالإجابة: رفع الرجلين لأعلى.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ وضع الوقوف الصحيح.\nالإجابة: يقف معتدلًا، العقبان متلاصقان، الرأس مرفوع، الذراعان بجانب الجسم.\nس2 (المستوى المتوقع): ما الفرق بين الوقوف والجثو؟\nالإجابة: في الوقوف نرتكز على القدمين، وفي الجثو نرتكز على الركبتين.\nس3 (المستوى المتقدم): أرفع صورة طفل يجثو منحني الظهر، ما الخطأ؟\nالإجابة: الظهر منحنٍ، والصحيح أن يكون الجذع مستقيمًا.\n\nالحصة 2:\nس1 (مستوى الدعم): سمِّ الأوضاع الأساسية الأربعة التي تعلمتها.\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس2 (المستوى المتوقع): أرفع بطاقة الرقود، أدِّ الوضع الصحيح.\nالإجابة: يرقد على الظهر مستقيمًا والذراعان بجانب الجسم.\nس3 (المستوى المتقدم): لماذا تحافظ التمرينات على قوامنا؟\nالإجابة: لأنها تقوي عضلات الظهر والبطن فيبقى الجسم معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شاهد مع طفلك صور الأوضاع الأساسية في دليل المعلم ص 44-46 واطلب منه أداء وضعي الوقوف والجثو أمامك.\n\nالحصة 2:\nإرشاد لولي الأمر: راجع مع طفلك الأوضاع الأساسية الأربعة (دليل المعلم ص 44-46) ومارسوا معًا تمرينًا بسيطًا من كل وضع."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "التمرينات (أتمرن بنظام)", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 20-23 (المهرجانات، صحتي)", "n": 2, "periods": [{"focus": "الممارسات الصحية: النظافة الشخصية والزي الرياضي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر ممارسات النظافة الشخصية قبل الحصة وبعدها (غسل اليدين، تغيير الملابس).\n2. يطبق خطوات غسل اليدين الصحيحة.\n3. يقدر أهمية النظافة في الوقاية من الأمراض.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: صابون وماء\n- أخرى: بطاقات مصورة لخطوات غسل اليدين\n- أخرى: أطواق", "المفاهيم": "- النظافة الشخصية\n- غسل اليدين\n- الزي الرياضي\n- الوقاية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة ليدين متسختين بعد اللعب ويسأل: ماذا نفعل بعد اللعب في الساحة؟ ولماذا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خفيف بنموذج المعلم: مشي وجري بين الأطواق وتحريك الذراعين.\n- الطالب: يؤدي الإحماء بنشاط.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم بطاقات خطوات غسل اليدين (بلل، صابون، فرك 20 ثانية، شطف، تجفيف) ويؤدي النموذج بالتفكير بصوت عالٍ، ثم يناقش الزي الرياضي النظيف وتغييره بعد الحصة.\n- الطالب: يقلد خطوات غسل اليدين بالتمثيل ويرتب البطاقات.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الجرثومة والصابون): تلميذ جرثومة يطارد الزملاء، ومن يُلمس يثبت حتى يلمسه تلميذ (الصابون) فيعود للعب.\n- الطالب: يلعب ويعبر عن دور الصابون في التخلص من الجراثيم.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات صغيرة، ترتب كل مجموعة بطاقات خطوات غسل اليدين بالترتيب الصحيح وتعرضها.\n- الطالب: يرتب البطاقات مع مجموعته ويشرح خطوة واحدة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالتنفس، ثم الذهاب بنظام لغسل اليدين تطبيقًا عمليًا.\n- الطالب: يغسل يديه بالخطوات الصحيحة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نغسل أيدينا في يوم الحصة؟\nالإجابة: بعد اللعب وقبل الأكل.\nس2 (المستوى المتوقع): كم ثانية نفرك أيدينا بالصابون؟\nالإجابة: نحو 20 ثانية.\nس3 (المستوى المتقدم): لماذا نغير ملابس الرياضة بعد الحصة؟\nالإجابة: لأنها تمتلئ بالعرق وقد تسبب الأمراض والرائحة غير المحببة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر خطوتين من خطوات غسل اليدين.\nالإجابة: البلل بالماء ثم الفرك بالصابون (أو الشطف والتجفيف).\nس2 (المستوى المتوقع): ما دور الصابون في لعبة اليوم؟\nالإجابة: يحرر الزملاء الذين لمستهم الجرثومة، أي يقضي على الجراثيم.\nس3 (المستوى المتقدم): كيف تحافظ على نظافة زيّك الرياضي؟\nالإجابة: أغسله بعد كل حصة وأحتفظ به في كيس نظيف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تابع غسل يدي طفلك بعد اللعب وقبل الطعام بالخطوات الخمس، وجهزا الزي الرياضي النظيف للحصة القادمة (برنامج صحتي، دليل المعلم ص 23)."}}, {"focus": "المهرجان الرياضي التعليمي للتمرينات (التشكيلات، أجزاء الجسم، الأوضاع الأساسية)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي التشكيلات والأوضاع الأساسية ضمن أقسام المهرجان.\n2. يوظف أجزاء جسمه في تمرينات المحطات.\n3. يشارك مجموعته بروح الفريق والنظام في المهرجان.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى ما اسم قائدها؟\nالإجابة: يذكر اسم المحافظة والقائد.\nس2 (المستوى المتوقع): ما الأوضاع التي أديتها في قسم الأوضاع؟\nالإجابة: الوقوف، الجثو، الجلوس التربيع، الرقود.\nس3 (المستوى المتقدم): لماذا تحصل المجموعة على نقاط للنظام؟\nالإجابة: لأن النظام والتعاون من أهداف المهرجان مثل الأداء.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر خطوتين من خطوات غسل اليدين.\nالإجابة: البلل بالماء ثم الفرك بالصابون (أو الشطف والتجفيف).\nس2 (المستوى المتوقع): ما دور الصابون في لعبة اليوم؟\nالإجابة: يحرر الزملاء الذين لمستهم الجرثومة، أي يقضي على الجراثيم.\nس3 (المستوى المتقدم): كيف تحافظ على نظافة زيّك الرياضي؟\nالإجابة: أغسله بعد كل حصة وأحتفظ به في كيس نظيف.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم التشكيلات وقسم أجزاء الجسم (أو الأوضاع، الموانع).\nس2 (المستوى المتوقع): ما الجزء الذي استخدمته في تنطيط الكرة بالرأس؟\nالإجابة: الرأس.\nس3 (المستوى المتقدم): كيف تشعر عندما تفوز مجموعة أخرى؟\nالإجابة: أصفق لها وأهنئها لأن المشاركة أهم من الفوز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تابع غسل يدي طفلك بعد اللعب وقبل الطعام بالخطوات الخمس، وجهزا الزي الرياضي النظيف للحصة القادمة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان ومجموعته، وشجعه على أداء تمرينين من الأوضاع الأساسية في المنزل (دليل المعلم ص 47-50)."}}, {"title": "التمثيل الحركي", "unit": "التمرينات (أتمرن بنظام)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 52-56", "n": 2, "periods": [{"focus": "التمرينات التمثيلية (تقليد حركات الطبيعة والحيوانات)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التمرينات التمثيلية وأمثلة عليها.\n2. يؤدي تمرينات تمثيلية لحركات الطبيعة والحيوانات مع صوت المعلم.\n3. يبتكر حركة تمثيلية جديدة بأجزاء جسمه.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور حيوانات وظواهر طبيعية\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- التمرين التمثيلي\n- التقليد\n- تمايل الأشجار\n- طيران العصافير", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أشجار تتمايل بالريح وصورة عصفور يطير ويسأل: كيف نقلد هذه الحركة بأجسامنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء تمثيلي بنموذج المعلم: المشي كالجندي، الجري كالحصان، القفز كالضفدع.\n- الطالب: يقلد حركات الإحماء التمثيلية.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم الموقف ثم يؤدي نموذج الحركة (تمايل الأشجار: وقوف، الذراعان عاليًا، تبادل ميل الجذع للجانبين؛ طيران العصافير: الجري مع تحريك الذراعين جانبًا) من دليل المعلم ص 53، ويؤدي التلاميذ مع صوته.\n- الطالب: يؤدي التمرين التمثيلي مع إيقاع صوت المعلم.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (ماذا أمثل؟): يرفع المعلم بطاقة حيوان أو ظاهرة فتؤديها المجموعة، ومن يخمن حركة زميله يحصل على نقطة.\n- الطالب: يؤدي الحركة ويخمن حركات الزملاء.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج، يبتكر كل زوج تمرينًا تمثيليًا جديدًا (مثل تجديف القارب) ويعرضه للزملاء.\n- الطالب: يبتكر الحركة مع زميله ويعرضها.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة تمثيلية: نمو الزهرة ببطء من الجثو إلى الوقوف مع التنفس العميق.\n- الطالب: يؤدي التهدئة التمثيلية.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة التي تمثل تمايل الأشجار؟\nالإجابة: تبادل ميل الجذع للجانبين والذراعان عاليًا.\nس2 (المستوى المتوقع): كيف نمثل طيران العصافير؟\nالإجابة: نجري ونحرك الذراعين لأعلى ولأسفل كالأجنحة.\nس3 (المستوى المتقدم): ما الفائدة من التمرينات التمثيلية؟\nالإجابة: تحرك أجزاء الجسم بطريقة ممتعة وتنمي الخيال.", "التقويم الختامي": "س1 (مستوى الدعم): مثّل حركة الضفدع.\nالإجابة: يقفز بالقدمين معًا من وضع القرفصاء.\nس2 (المستوى المتوقع): اذكر تمرينًا تمثيليًا ابتكرته أنت وزميلك.\nالإجابة: يذكر الحركة المبتكرة (مثل التجديف).\nس3 (المستوى المتقدم): أي جزء من الجسم تحركه أكثر عند تمثيل الطيران؟\nالإجابة: الذراعان.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاث حركات تمثيلية (الأشجار، العصافير، الضفدع) من دليل المعلم ص 53، ودعه يبتكر حركة لحيوان يحبه."}}, {"focus": "القصة الحركية (قصة اجتماعية عن السلامة المرورية والتعاون)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الحركات الأساسية (مشي، جري، وثب) ضمن قصة حركية.\n2. يستنتج القيم والسلوكيات الواردة في القصة.\n3. يشعر بالسعادة أثناء مشاركة زملائه أداء القصة الحركية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: مراتب\n- أخرى: بطاقات إشارات المرور\n- صورة توضيحية", "المفاهيم": "- القصة الحركية\n- السلامة المرورية\n- التعاون\n- النظام", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تمرينات الحصة السابقة بسرعة، ثم يقول: اليوم سنذهب في رحلة إلى الحديقة بأجسامنا! ويعرض بطاقات إشارات المرور.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء على شكل بداية القصة: نستيقظ (تمطي)، نغسل الوجه، نمشي إلى الحافلة، نجري حتى لا تفوتنا.\n- الطالب: يقلد حركات بداية القصة.\n\nالنشاط 2 (18 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يسرد المعلم القصة ويؤدي نموذج كل حركة: نعبر الشارع عند الإشارة الخضراء (مشي)، نركض في الحديقة (جري)، نقفز فوق الجدول (وثب داخل الأطواق)، نساعد صديقًا سقط (دحرجة على المرتبة ومد اليد)، نعود في قطار الحافلة (دليل المعلم ص 54-55).\n- الطالب: يؤدي حركات القصة مع السرد ويلتزم بالإشارات.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الإشارة): بطاقة حمراء توقف، خضراء مشي، صفراء استعداد، ومن يخالف يعيد المحاولة.\n- الطالب: يستجيب للبطاقات بالحركة الصحيحة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: حوار في مجموعات: ماذا تعلمنا من القصة؟ وماذا فعلنا عندما سقط صديقنا؟ وتعرض كل مجموعة قيمة واحدة.\n- الطالب: يناقش مع مجموعته ويذكر قيمة من القصة.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم با لم صورة أشجار تتمايل بالريح وصورة عصفور يطير ويسأل: كيف نقلد هذه الحركة بأجسامنا؟\n\nالحصة 2:\nيراجع المعلم تمرينات الحصة السابقة بسرعة، ثم يقول: اليوم سنذهب في رحلة إلى الحديقة بأجسامنا! ويعرض بطاقات إشارات المرور.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء تمثيلي بنموذج المعلم: المشي كالجندي، الجري كالحصان، القفز كالضفدع.\n- الطالب: يقلد حركات الإحماء التمثيلية.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم الموقف ثم يؤدي نموذج الحركة (تمايل الأشجار: وقوف، الذراعان عاليًا، تبادل ميل الجذع للجانبين؛ طيران العصافير: الجري مع تحريك الذراعين جانبًا) من دليل المعلم ص 53، ويؤدي التلاميذ مع صوته.\n- الطالب: يؤدي التمرين التمثيلي مع إيقاع صوت المعلم.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (ماذا أمثل؟): يرفع المعلم بطاقة حيوان أو ظاهرة فتؤديها المجموعة، ومن يخمن حركة زميله يحصل على نقطة.\n- الطالب: يؤدي الحركة ويخمن حركات الزملاء.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج، يبتكر كل زوج تمرينًا تمثيليًا جديدًا (مثل تجديف القارب) ويعرضه للزملاء.\n- الطالب: يبتكر الحركة مع زميله ويعرضها.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة تمثيلية: نمو الزهرة ببطء من الجثو إلى الوقوف مع التنفس العميق.\n- الطالب: يؤدي التهدئة التمثيلية.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء على شكل بداية القصة: نستيقظ (تمطي)، نغسل الوجه، نمشي إلى الحافلة، نجري حتى لا تفوتنا.\n- الطالب: يقلد حركات بداية القصة.\n\nالنشاط 2 (18 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يسرد المعلم القصة ويؤدي نموذج كل حركة: نعبر الشارع عند الإشارة الخضراء (مشي)، نركض في الحديقة (جري)، نقفز فوق الجدول (وثب داخل الأطواق)، نساعد صديقًا سقط (دحرجة على المرتبة ومد اليد)، نعود في قطار الحافلة (دليل المعلم ص 54-55).\n- الطالب: يؤدي حركات القصة مع السرد ويلتزم بالإشارات.\n\nالنشاط 3 (8 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الإشارة): بطاقة حمراء توقف، خضراء مشي، صفراء استعداد، ومن يخالف يعيد المحاولة.\n- الطالب: يستجيب للبطاقات بالحركة الصحيحة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: حوار في مجموعات: ماذا تعلمنا من القصة؟ وماذا فعلنا عندما سقط صديقنا؟ وتعرض كل مجموعة قيمة واحدة.\n- الطالب: يناقش مع مجموعته ويذكر قيمة من القصة.\n\nالنشاط 5 (3 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالتنفس كأننا نشم زهور الحديقة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الحركة التي تمثل تمايل الأشجار؟\nالإجابة: تبادل ميل الجذع للجانبين والذراعان عاليًا.\nس2 (المستوى المتوقع): كيف نمثل طيران العصافير؟\nالإجابة: نجري ونحرك الذراعين لأعلى ولأسفل كالأجنحة.\nس3 (المستوى المتقدم): ما الفائدة من التمرينات التمثيلية؟\nالإجابة: تحرك أجزاء الجسم بطريقة ممتعة وتنمي الخيال.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الحركة التي أديناها عند عبور الشارع؟\nالإجابة: المشي بهدوء عند الإشارة الخضراء.\nس2 (المستوى المتوقع): كيف ساعدنا الصديق الذي سقط؟\nالإجابة: مددنا له اليد وساعدناه على الوقوف.\nس3 (المستوى المتقدم): لماذا لا نركض عند عبور الشارع؟\nالإجابة: لأن الركض قد يسبب حادثًا أو السقوط.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): مثّل حركة الضفدع.\nالإجابة: يقفز بالقدمين معًا من وضع القرفصاء.\nس2 (المستوى المتوقع): اذكر تمرينًا تمثيليًا ابتكرته أنت وزميلك.\nالإجابة: يذكر الحركة المبتكرة (مثل التجديف).\nس3 (المستوى المتقدم): أي جزء من الجسم تحركه أكثر عند تمثيل الطيران؟\nالإجابة: الذراعان.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر ثلاث حركات أساسية في قصة اليوم.\nالإجابة: المشي، الجري، الوثب.\nس2 (المستوى المتوقع): ما القيمة التي تعلمتها من القصة؟\nالإجابة: التعاون ومساعدة الآخرين والالتزام بإشارات المرور.\nس3 (المستوى المتقدم): ماذا تعني الإشارة الحمراء للمشاة؟\nالإجابة: التوقف وعدم العبور.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاث حركات تمثيلية (الأشجار، العصافير، الضفدع) من دليل المعلم ص 53، ودعه يبتكر حركة لحيوان يحبه.\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طفلك قصة اليوم ومعاني إشارات المرور، وتدربا على عبور الشارع بأمان (دليل المعلم ص 54-56)."}}, {"title": "المشي والجري", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 60-67", "n": 2, "periods": [{"focus": "المشي والجري في مسارات واتجاهات مختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي المشي والجري والفرق بينهما.\n2. يؤدي المشي والجري في مسارات مستقيمة ومتعرجة ومنحنية.\n3. يتبع الاتجاهات (أمام، خلف، يمين، يسار) أثناء الحركة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- المشي\n- الجري\n- المسار المستقيم والمتعرج والمنحني\n- الاتجاهات\n- السريع والبطيء", "التهيئة / التمهيد / التعلم القبلي": "يمشي المعلم ببطء ثم يجري ويسأل: ما الفرق بين الحركتين؟ ثم يعرض خطوطًا مرسومة على الأرض بأشكال هندسية مختلفة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: مشي على أطراف الأصابع، مشي على الكعبين، جري خفيف في المكان.\n- الطالب: يقلد أنواع المشي والجري.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم الفرق (في الجري ترتفع القدمان عن الأرض لحظة) ويؤدي نموذج المشي ثم الجري على خط مستقيم، مع مرجحة الذراعين عكس الرجلين (ص 61-63).\n- الطالب: يؤدي المشي ثم الجري على الخط بعد النموذج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 63: مسارات مرسومة (دائرة، مربع، مثلث، متعرج)؛ يجرب التلميذ المشي والجري فيها ويكتشف أي المسارات أسهل وأيها أبطأ، ثم يستنتج مع المعلم السبب.\n- الطالب: يجرب المسارات ويستنتج أن المسار المتعرج يحتاج إلى تغيير الاتجاه فيكون أبطأ.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (اتبع القائد): يقود تلميذ قطار مجموعته في اتجاهات يناديها المعلم (أمام، خلف، يمين، يسار) بالمشي ثم الجري.\n- الطالب: يتبع القائد بالاتجاه الصحيح ويتبادل القيادة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي البطيء ثم الإطالة للساقين مع نموذج المعلم.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الفرق بين المشي والجري؟\nالإجابة: في الجري ترتفع القدمان عن الأرض لحظة والسرعة أكبر.\nس2 (المستوى المتوقع): أي المسارات كان أصعب في الجري ولماذا؟\nالإجابة: المسار المتعرج لأننا نغير الاتجاه كثيرًا.\nس3 (المستوى المتقدم): كيف تتحرك الذراعان أثناء الجري؟\nالإجابة: تتحركان بالتبادل عكس حركة الرجلين.", "التقويم الختامي": "س1 (مستوى الدعم): امشِ على خط مستقيم ثم اجرِ عليه.\nالإجابة: يؤدي المشي ثم الجري دون الخروج عن الخط.\nس2 (المستوى المتوقع): سمِّ ثلاثة مسارات مشيت فيها اليوم.\nالإجابة: مستقيم، متعرج، منحنٍ (دائرة).\nس3 (المستوى المتقدم): إذا قلت لك (يمين) أثناء الجري فماذا تفعل؟\nالإجابة: أغير اتجاهي إلى اليمين وأستمر في الجري.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: امشِ مع طفلك في الحي وتناوبا بين المشي السريع والجري الخفيف، وراجعا الاتجاهات الأربعة (دليل المعلم ص 61-63)."}}, {"focus": "المشي والجري في المحطات والمسابقات والألعاب", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف المشي والجري في أداء مهارات المسابقات والألعاب.\n2. يغير سرعة الجري (سريع، بطيء) حسب الإشارة.\n3. يستمتع بمشاركة زملائه أنشطة المشي والجري.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أطواق", "المفاهيم": "- المحطات\n- التتابع\n- السريع والبطيء\n- الفراغ", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يتذكر الفرق بين المشي والجري؟ ثم يعلن: اليوم نجري في محطات ومسابقات!", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري بطيء ثم سريع بإشارة الصافرة، مع تمرينات للساقين.\n- الطالب: يغير سرعة الجري حسب الصافرة.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (محطات المشي والجري) ص 64: محطة المشي على المقعد السويدي، محطة الجري بين الأقماع، محطة المشي فوق الحواجز المنخفضة، محطة الجري حاملًا الكرة ووضعها في الطوق، مع التبديل بالإشارة.\n- الطالب: يؤدي مهمة المحطة ويشجع مجموعته وينتقل بنظام.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 و4 ص 65-66: مسابقة التتابع بالجري في قطارات حول القمع والعودة، ثم لعبة (الصياد والصقور) بالجري في الفراغ دون تصادم.\n- الطالب: يتسابق مع قطاره ويلعب ملتزمًا بالفراغ الخاص.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى يفضل المشي ومتى يفضل الجري في المسابقة؟ ليستنتج التلاميذ أن الجري للسرعة والمشي للتوازن على المقعد.\n- الطالب: يستنتج ويذكر مثالًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): في أي محطة استخدمنا المشي بدل الجري ولماذا؟\nالإجابة: المشي على المقعد السويدي للحفاظ على التوازن.\nس2 (المستوى المتوقع): كيف نفوز في مسابقة التتابع؟\nالإجابة: بالجري السريع ولمس يد الزميل التالي بسرعة دون أخطاء.\nس3 (المستوى المتقدم): ما معنى الفراغ الخاص أثناء اللعب؟\nالإجابة: المساحة حولي التي أتحرك فيها دون أن أصطدم بزميلي.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المشي على المقعد والجري بين الأقماع.\nس2 (المستوى المتوقع): اجرِ حول القمع والعودة بأسرع ما يمكن.\nالإجابة: يؤدي الجري السريع ذهابًا وإيابًا.\nس3 (المستوى المتقدم): ماذا تفعل إذا صادفك زميل أثناء الجري في اللعبة؟\nالإجابة: أغير اتجاهي وأتجنب التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على الجري في مكان آمن 10 دقائق يوميًا، واستعرض معه صور محطات المشي والجري في دليل المعلم ص 64-66."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي المشي والجري والفرق بينهما.\n2. يؤدي المشي والجري في مسارات مستقيمة ومتعرجة ومنحنية.\n3. يتبع الاتجاهات (أمام، خلف، يمين، يسار) أثناء الحركة.\n\nالحصة 2:\n1. يوظف المشي والجري في أداء مهارات المسابقات والألعاب.\n2. يغير سرعة الجري (سريع، بطيء) حسب الإشارة.\n3. يستمتع بمشاركة زملائه أنشطة المشي والجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- المشي\n- الجري\n- المسار المستقيم والمتعرج والمنحني\n- الاتجاهات\n- السريع والبطيء\n\nالحصة 2:\n- المحطات\n- التتابع\n- السريع والبطيء\n- الفراغ", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيمشي المعلم ببطء ثم يجري ويسأل: ما الفرق بين الحركتين؟ ثم يعرض خطوطًا مرسومة على الأرض بأشكال هندسية مختلفة.\n\nالحصة 2:\nيسأل المعلم: من يتذكر الفرق بين المشي والجري؟ ثم يعلن: اليوم نجري في محطات ومسابقات!", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: مشي على أطراف الأصابع، مشي على الكعبين، جري خفيف في المكان.\n- الطالب: يقلد أنواع المشي والجري.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم الفرق (في الجري ترتفع القدمان عن الأرض لحظة) ويؤدي نموذج المشي ثم الجري على خط مستقيم، مع مرجحة الذراعين عكس الرجلين (ص 61-63).\n- الطالب: يؤدي المشي ثم الجري على الخط بعد النموذج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 63: مسارات مرسومة (دائرة، مربع، مثلث، متعرج)؛ يجرب التلميذ المشي والجري فيها ويكتشف أي المسارات أسهل وأيها أبطأ، ثم يستنتج مع المعلم السبب.\n- الطالب: يجرب المسارات ويستنتج أن المسار المتعرج يحتاج إلى تغيير الاتجاه فيكون أبطأ.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (اتبع القائد): يقود تلميذ قطار مجموعته في اتجاهات يناديها المعلم (أمام، خلف، يمين، يسار) بالمشي ثم الجري.\n- الطالب: يتبع القائد بالاتجاه الصحيح ويتبادل القيادة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي البطيء ثم الإطالة للساقين مع نموذج المعلم.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري بطيء ثم سريع بإشارة الصافرة، مع تمرينات للساقين.\n- الطالب: يغير سرعة الجري حسب الصافرة.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (محطات المشي والجري) ص 64: محطة المشي على المقعد السويدي، محطة الجري بين الأقماع، محطة المشي فوق الحواجز المنخفضة، محطة الجري حاملًا الكرة ووضعها في الطوق، مع التبديل بالإشارة.\n- الطالب: يؤدي مهمة المحطة ويشجع مجموعته وينتقل بنظام.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 و4 ص 65-66: مسابقة التتابع بالجري في قطارات حول القمع والعودة، ثم لعبة (الصياد والصقور) بالجري في الفراغ دون تصادم.\n- الطالب: يتسابق مع قطاره ويلعب ملتزمًا بالفراغ الخاص.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى يفضل المشي ومتى يفضل الجري في المسابقة؟ ليستنتج التلاميذ أن الجري للسرعة والمشي للتوازن على المقعد.\n- الطالب: يستنتج ويذكر مثالًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالمشي وإطالة الساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الفرق بين المشي والجري؟\nالإجابة: في الجري ترتفع القدمان عن الأرض لحظة والسرعة أكبر.\nس2 (المستوى المتوقع): أي المسارات كان أصعب في الجري ولماذا؟\nالإجابة: المسار المتعرج لأننا نغير الاتجاه كثيرًا.\nس3 (المستوى المتقدم): كيف تتحرك الذراعان أثناء الجري؟\nالإجابة: تتحركان بالتبادل عكس حركة الرجلين.\n\nالحصة 2:\nس1 (مستوى الدعم): في أي محطة استخدمنا المشي بدل الجري ولماذا؟\nالإجابة: المشي على المقعد السويدي للحفاظ على التوازن.\nس2 (المستوى المتوقع): كيف نفوز في مسابقة التتابع؟\nالإجابة: بالجري السريع ولمس يد الزميل التالي بسرعة دون أخطاء.\nس3 (المستوى المتقدم): ما معنى الفراغ الخاص أثناء اللعب؟\nالإجابة: المساحة حولي التي أتحرك فيها دون أن أصطدم بزميلي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): امشِ على خط مستقيم ثم اجرِ عليه.\nالإجابة: يؤدي المشي ثم الجري دون الخروج عن الخط.\nس2 (المستوى المتوقع): سمِّ ثلاثة مسارات مشيت فيها اليوم.\nالإجابة: مستقيم، متعرج، منحنٍ (دائرة).\nس3 (المستوى المتقدم): إذا قلت لك (يمين) أثناء الجري فماذا تفعل؟\nالإجابة: أغير اتجاهي إلى اليمين وأستمر في الجري.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المشي على المقعد والجري بين الأقماع.\nس2 (المستوى المتوقع): اجرِ حول القمع والعودة بأسرع ما يمكن.\nالإجابة: يؤدي الجري السريع ذهابًا وإيابًا.\nس3 (المستوى المتقدم): ماذا تفعل إذا صادفك زميل أثناء الجري في اللعبة؟\nالإجابة: أغير اتجاهي وأتجنب التصادم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: امشِ مع طفلك في الحي وتناوبا بين المشي السريع والجري الخفيف، وراجعا الاتجاهات الأربعة (دليل المعلم ص 61-63).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على الجري في مكان آمن 10 دقائق يوميًا، واستعرض معه صور محطات المشي والجري في دليل المعلم ص 64-66."}}, {"title": "الوثب والحجل", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الثامن – التاسع", "date": "25-29/10/2026 إلى 1-5/11/2026", "pages": "دليل المعلم ص 68-77", "n": 4, "periods": [{"focus": "الوثب لأعلى ولأمام بأوضاع الجسم المختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الوثب ومراحلها (الارتقاء، الطيران، الهبوط).\n2. يؤدي الوثب بالقدمين لأعلى ولأمام بهبوط آمن.\n3. يميز بين الوثب لأعلى والوثب لأمام.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- الوثب\n- الارتقاء\n- الطيران\n- الهبوط\n- الفراغ الخاص", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة أرنب يقفز ويسأل: كيف يقفز الأرنب؟ ثم يؤدي وثبة ويسأل: على كم قدم ارتقيت وهبطت؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف، وثب في المكان بالقدمين، ثني ومد الركبتين.\n- الطالب: يقلد حركات الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يجزئ المعلم الوثب بالعد: (1) ثني الركبتين ومرجحة الذراعين خلفًا، (2) الدفع بالقدمين والذراعان أمامًا عاليًا، (3) الهبوط على المشطين بثني الركبتين، ثم الأداء الكامل (ص 69-70).\n- الطالب: يؤدي الوثب بالعد ثم بشكل كامل داخل طوقه.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 1 ص 72: الوثب لأعلى بأوضاع مختلفة (الذراعان عاليًا، جانبًا)، ثم الوثب لأمام من طوق إلى طوق كالأرنب، ومن يصل آخر طوق بهبوط آمن يرفع يده.\n- الطالب: يؤدي الوثب بالأوضاع المختلفة ويهبط بثني الركبتين.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج، يراقب تلميذ وثب زميله ويخبره: هل هبط بهدوء بثني الركبتين؟ ثم يتبادلان.\n- الطالب: يراقب ويعطي تغذية راجعة لزميله ثم يؤدي.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة عضلات الساقين مع نموذج المعلم.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مراحل الوثب الثلاث؟\nالإجابة: الارتقاء، الطيران، الهبوط.\nس2 (المستوى المتوقع): كيف نهبط بأمان بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (المستوى المتقدم): لماذا نمرجح الذراعين قبل الوثب؟\nالإجابة: لتساعدنا على الارتفاع والوصول أبعد.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ وثبة لأمام من طوق إلى طوق.\nالإجابة: يثب بالقدمين معًا ويهبط داخل الطوق بثني الركبتين.\nس2 (المستوى المتوقع): ما الفرق بين الوثب لأعلى والوثب لأمام؟\nالإجابة: في الوثب لأعلى نرتفع ونهبط في المكان نفسه، وفي الوثب لأمام ننتقل إلى مكان أبعد.\nس3 (المستوى المتقدم): زميلك يهبط بركبتين مفرودتين، بماذا تنصحه؟\nالإجابة: أنصحه بثني الركبتين عند الهبوط حتى لا يتأذى.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الوثب بالقدمين داخل مربعات مرسومة بالطباشير مع الهبوط الهادئ (دليل المعلم ص 69-72)."}}, {"focus": "الحجل والوثب بقدم واحدة في مسارات", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركة الحجل والفرق بينها وبين الوثب.\n2. يؤدي الحجل بالقدم اليمنى ثم اليسرى في مسار.\n3. يحافظ على اتزانه أثناء الحجل.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال", "المفاهيم": "- الحجل\n- الوثب بقدم واحدة\n- الاتزان\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم مراحل الوثب، ثم يسأل: هل تستطيع القفز على قدم واحدة مثل طائر الفلامنجو؟ ويقدم اسم الحركة (الحجل).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب خفيف، الوقوف على قدم واحدة لثوانٍ بالتبادل.\n- الطالب: يقلد ويحافظ على توازنه.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الحجل: الارتقاء والهبوط على القدم نفسها، الركبة الأخرى مرفوعة، الذراعان للاتزان، ثم تطبيق موجه في المكان ثم لأمام (ص 70-71).\n- الطالب: يحجل في المكان ثم لأمام بالقدم اليمنى ثم اليسرى.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 2 ص 73: مسارات بأطواق مرتبة؛ يجرب التلميذ الحجل في المسار المستقيم ثم المتعرج ويكتشف أي القدمين أقوى لديه، ويستنتج مع المعلم لماذا نحتاج إلى تدريب القدمين معًا.\n- الطالب: يجرب بالقدمين ويعبر عن اكتشافه.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الفلامنجو): عند النداء يحجل الجميع، وعند الصافرة يثبت كل تلميذ على قدم واحدة، ومن يحافظ على ثباته أطول يفوز.\n- الطالب: يلعب ويحافظ على اتزانه.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الساقين والكاحلين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا، والحجل بقدم واحدة.\nس2 (المستوى المتوقع): أين تكون الذراعان أثناء الحجل؟\nالإجابة: جانبًا للمحافظة على الاتزان.\nس3 (المستوى المتقدم): لماذا نتدرب على الحجل بالقدمين؟\nالإجابة: لتقوية القدمين معًا وعدم الاعتماد على قدم واحدة.", "التقويم الختامي": "س1 (مستوى الدعم): احجل ثلاث مرات بالقدم اليسرى.\nالإجابة: يحجل بالقدم اليسرى دون لمس الأرض بالأخرى.\nس2 (المستوى المتوقع): أي قدميك كانت أقوى في الحجل؟ وكيف عرفت؟\nالإجابة: يذكر القدم ويعلل بأنه حجل بها مسافة أطول دون سقوط.\nس3 (المستوى المتقدم): أرفع صورة طفل يقفز بقدم واحدة، ما اسم الحركة؟\nالإجابة: الحجل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على الحجل بكل قدم 5 مرات مع المحافظة على التوازن (دليل المعلم ص 70-73)."}}, {"focus": "محطات الوثب والحجل", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي الوثب والحجل فوق أدوات مختلفة (حبال، حواجز منخفضة، أطواق).\n2. يميز متى يستخدم الوثب ومتى يستخدم الحجل في المحطة.\n3. يتعاون مع مجموعته في محطات الوثب والحجل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- الوثب\n- الحجل\n- المحطات\n- المدى (قريب، بعيد)", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من يذكرني بالفرق بين الوثب والحجل؟ ثم يعرض أدوات المحطات ويسأل: كيف نتخطى الحبل؟ وكيف نتخطى الطوق؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ووثب في المكان وحجل بالتبادل.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج كل محطة مرة واحدة موضحًا الحركة المناسبة: الوثب فوق الحبل، الحجل بين الأقماع، الوثب من المقعد السويدي والهبوط على المرتبة، الوثب بالقدمين داخل الأطواق المتباعدة.\n- الطالب: يشاهد ويذكر الحركة المناسبة لكل محطة.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات الوثب والحجل) ص 74: أربع مجموعات بقائد، تؤدي كل مجموعة محطتها دقائق ثم تنتقل بالإشارة، ويسجل القائد من أدى الهبوط الآمن.\n- الطالب: يؤدي الحركة الصحيحة لكل محطة ويساعد زملاءه.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: تؤدي كل مجموعة المسار كاملًا متتابعة، ونقطة للمجموعة التي تنهي دون إسقاط الأدوات.\n- الطالب: يتسابق بدقة وأمان.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين، ونقاش: أي محطة احتاجت إلى الحجل؟\n- الطالب: يؤدي التهدئة ويجيب.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة المناسبة لتخطي الحبل؟\nالإجابة: الوثب بالقدمين.\nس2 (المستوى المتوقع): ما الحركة التي أديناها بين الأقماع؟\nالإجابة: الحجل.\nس3 (المستوى المتقدم): لماذا نهبط على المرتبة بعد الوثب من المقعد؟\nالإجابة: لأن المرتبة تمتص الصدمة وتحمي الركبتين والكاحلين.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم والحركة المناسبة لكل منهما.\nالإجابة: الحبل: وثب، الأقماع: حجل (أو المقعد: وثب والهبوط على المرتبة).\nس2 (المستوى المتوقع): كيف نثب داخل أطواق متباعدة؟\nالإجابة: نثني الركبتين ونمرجح الذراعين بقوة لنصل إلى الطوق البعيد.\nس3 (المستوى المتقدم): قائد المجموعة لاحظ هبوطًا خاطئًا، ماذا يقول لزميله؟\nالإجابة: اثنِ ركبتيك واهبط على المشطين بهدوء.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ابنِ مع طفلك محطة بسيطة في المنزل (وسادة للوثب فوقها، خط للحجل) ومارساها بأمان (دليل المعلم ص 74)."}}, {"focus": "الوثب والحجل في الألعاب والمسابقات الرياضية", "num": 4, "fields": {"المخرجات التعليمية": "1. يوظف الوثب والحجل في الألعاب والمسابقات.\n2. يطبق قواعد اللعبة والهبوط الآمن أثناء المنافسة.\n3. يعبر عن سعادته عند أداء أنشطة الوثب والحجل.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: شريط لاصق", "المفاهيم": "- الوثب\n- الحجل\n- المسابقة\n- الإيقاع\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم محطات الحصة السابقة، ثم يسأل: في أي الألعاب نرى الوثب؟ (كرة السلة، الوثب الطويل) ويعلن مسابقات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: وثب بالحبل، حجل مع تزايد السرعة وتناقصها بالصافرة.\n- الطالب: يقلد ويغير سرعته بالإشارة.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (ألعاب الوثب والحجل) ص 75: لعبة (الكنغر والحجلة): يثب التلاميذ بالقدمين عند نداء (كنغر) ويحجلون عند (حجلة)، ثم لعبة الوثب داخل المربعات المرقمة بالترتيب.\n- الطالب: يلعب مستجيبًا للنداء بالحركة الصحيحة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 5 ص 76: مسابقة تتابع في قطارات: وثب فوق الحبل، حجل حول القمع، وثب داخل الطوق والعودة لتسليم الكرة للزميل.\n- الطالب: يتسابق مع مجموعته ويسلم الكرة بدقة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا فازت المجموعة الفائزة؟ ليستنتج التلاميذ أهمية السرعة مع الدقة والهبوط الآمن.\n- الطالب: يستنتج ويذكر سببًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين، وتعبير التلاميذ عن شعورهم.\n- الطالب: يؤدي التهدئة ويعبر عن شعوره.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا تفعل عند نداء (كنغر)؟\nالإجابة: أثب بالقدمين معًا.\nس2 (المستوى المتوقع): ما الحركة التي أديتها حول القمع في التتابع؟\nالإجابة: الحجل.\nس3 (المستوى المتقدم): لماذا تخسر المجموعة التي تسقط الحبل؟\nالإجابة: لأنها لم تؤدِّ الوثب بالطريقة الصحيحة فتخالف قواعد المسابقة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر لعبة رياضية يظهر فيها الوثب.\nالإجابة: كرة السلة أو الوثب الطويل أو الكرة الطائرة.\nس2 (المستوى المتوقع): أدِّ وثبًا فوق الحبل ثم حجلًا إلى القمع.\nالإجابة: يؤدي الحركتين بالتتابع الصحيح.\nس3 (المستوى المتقدم): كيف شعرت في مسابقة اليوم ولماذا؟\nالإجابة: يعبر عن سعادته لأنه تعاون مع مجموعته وأدى الحركات بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على لعبة (الحجلة) التقليدية في المنزل أو الحي، وراجعا مراحل الوثب الثلاث (دليل المعلم ص 75-77)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة الوثب ومراحلها (الارتقاء، الطيران، الهبوط).\n2. يؤدي الوثب بالقدمين لأعلى ولأمام بهبوط آمن.\n3. يميز بين الوثب لأعلى والوثب لأمام.\n\nالحصة 2:\n1. يتعرف حركة الحجل والفرق بينها وبين الوثب.\n2. يؤدي الحجل بالقدم اليمنى ثم اليسرى في مسار.\n3. يحافظ على اتزانه أثناء الحجل.\n\nالحصة 3:\n1. يؤدي الوثب والحجل فوق أدوات مختلفة (حبال، حواجز منخفضة، أطواق).\n2. يميز متى يستخدم الوثب ومتى يستخدم الحجل في المحطة.\n3. يتعاون مع مجموعته في محطات الوثب والحجل.\n\nالحصة 4:\n1. يوظف الوثب والحجل في الألعاب والمسابقات.\n2. يطبق قواعد اللعبة والهبوط الآمن أثناء المنافسة.\n3. يعبر عن سعادته عند أداء أنشطة الوثب والحجل.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: مراتب\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: حبال\n\nالحصة 3:\n- أخرى: أطواق\n- أخرى: حواجز منخفضة\n- أخرى: حبال\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الوثب\n- الارتقاء\n- الطيران\n- الهبوط\n- الفراغ الخاص\n\nالحصة 2:\n- الحجل\n- الوثب بقدم واحدة\n- الاتزان\n- المسار\n\nالحصة 3:\n- الوثب\n- الحجل\n- المحطات\n- المدى (قريب، بعيد)\n\nالحصة 4:\n- الوثب\n- الحجل\n- المسابقة\n- الإيقاع\n- تزايد السرعة وتناقصها", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة أرنب يقفز ويسأل: كيف يقفز الأرنب؟ ثم يؤدي وثبة ويسأل: على كم قدم ارتقيت وهبطت؟\n\nالحصة 2:\nيراجع المعلم مراحل الوثب، ثم يسأل: هل تستطيع القفز على قدم واحدة مثل طائر الفلامنجو؟ ويقدم اسم الحركة (الحجل).\n\nالحصة 3:\nيسأل المعلم: من يذكرني بالفرق بين الوثب والحجل؟ ثم يعرض أدوات المحطات ويسأل: كيف نتخطى الحبل؟ وكيف نتخطى الطوق؟\n\nالحصة 4:\nيراجع المعلم محطات الحصة السابقة، ثم يسأل: في أي الألعاب نرى الوثب؟ (كرة السلة، الوثب الطويل) ويعلن مسابقات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف، وثب في المكان بالقدمين، ثني ومد الركبتين.\n- الطالب: يقلد حركات الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يجزئ المعلم الوثب بالعد: (1) ثني الركبتين ومرجحة الذراعين خلفًا، (2) الدفع بالقدمين والذراعان أمامًا عاليًا، (3) الهبوط على المشطين بثني الركبتين، ثم الأداء الكامل (ص 69-70).\n- الطالب: يؤدي الوثب بالعد ثم بشكل كامل داخل طوقه.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 1 ص 72: الوثب لأعلى بأوضاع مختلفة (الذراعان عاليًا، جانبًا)، ثم الوثب لأمام من طوق إلى طوق كالأرنب، ومن يصل آخر طوق بهبوط آمن يرفع يده.\n- الطالب: يؤدي الوثب بالأوضاع المختلفة ويهبط بثني الركبتين.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في أزواج، يراقب تلميذ وثب زميله ويخبره: هل هبط بهدوء بثني الركبتين؟ ثم يتبادلان.\n- الطالب: يراقب ويعطي تغذية راجعة لزميله ثم يؤدي.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة عضلات الساقين مع نموذج المعلم.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري، وثب خفيف، الوقوف على قدم واحدة لثوانٍ بالتبادل.\n- الطالب: يقلد ويحافظ على توازنه.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الحجل: الارتقاء والهبوط على القدم نفسها، الركبة الأخرى مرفوعة، الذراعان للاتزان، ثم تطبيق موجه في المكان ثم لأمام (ص 70-71).\n- الطالب: يحجل في المكان ثم لأمام بالقدم اليمنى ثم اليسرى.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 2 ص 73: مسارات بأطواق مرتبة؛ يجرب التلميذ الحجل في المسار المستقيم ثم المتعرج ويكتشف أي القدمين أقوى لديه، ويستنتج مع المعلم لماذا نحتاج إلى تدريب القدمين معًا.\n- الطالب: يجرب بالقدمين ويعبر عن اكتشافه.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الفلامنجو): عند النداء يحجل الجميع، وعند الصافرة يثبت كل تلميذ على قدم واحدة، ومن يحافظ على ثباته أطول يفوز.\n- الطالب: يلعب ويحافظ على اتزانه.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الساقين والكاحلين.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ووثب في المكان وحجل بالتبادل.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج كل محطة مرة واحدة موضحًا الحركة المناسبة: الوثب فوق الحبل، الحجل بين الأقماع، الوثب من المقعد السويدي والهبوط على المرتبة، الوثب بالقدمين داخل الأطواق المتباعدة.\n- الطالب: يشاهد ويذكر الحركة المناسبة لكل محطة.\n\nالنشاط 3 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات الوثب والحجل) ص 74: أربع مجموعات بقائد، تؤدي كل مجموعة محطتها دقائق ثم تنتقل بالإشارة، ويسجل القائد من أدى الهبوط الآمن.\n- الطالب: يؤدي الحركة الصحيحة لكل محطة ويساعد زملاءه.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة: تؤدي كل مجموعة المسار كاملًا متتابعة، ونقطة للمجموعة التي تنهي دون إسقاط الأدوات.\n- الطالب: يتسابق بدقة وأمان.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين، ونقاش: أي محطة احتاجت إلى الحجل؟\n- الطالب: يؤدي التهدئة ويجيب.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: وثب بالحبل، حجل مع تزايد السرعة وتناقصها بالصافرة.\n- الطالب: يقلد ويغير سرعته بالإشارة.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (ألعاب الوثب والحجل) ص 75: لعبة (الكنغر والحجلة): يثب التلاميذ بالقدمين عند نداء (كنغر) ويحجلون عند (حجلة)، ثم لعبة الوثب داخل المربعات المرقمة بالترتيب.\n- الطالب: يلعب مستجيبًا للنداء بالحركة الصحيحة.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 5 ص 76: مسابقة تتابع في قطارات: وثب فوق الحبل، حجل حول القمع، وثب داخل الطوق والعودة لتسليم الكرة للزميل.\n- الطالب: يتسابق مع مجموعته ويسلم الكرة بدقة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا فازت المجموعة الفائزة؟ ليستنتج التلاميذ أهمية السرعة مع الدقة والهبوط الآمن.\n- الطالب: يستنتج ويذكر سببًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإطالة الساقين، وتعبير التلاميذ عن شعورهم.\n- الطالب: يؤدي التهدئة ويعبر عن شعوره.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما مراحل الوثب الثلاث؟\nالإجابة: الارتقاء، الطيران، الهبوط.\nس2 (المستوى المتوقع): كيف نهبط بأمان بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (المستوى المتقدم): لماذا نمرجح الذراعين قبل الوثب؟\nالإجابة: لتساعدنا على الارتفاع والوصول أبعد.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الفرق بين الوثب والحجل؟\nالإجابة: الوثب بالقدمين معًا، والحجل بقدم واحدة.\nس2 (المستوى المتوقع): أين تكون الذراعان أثناء الحجل؟\nالإجابة: جانبًا للمحافظة على الاتزان.\nس3 (المستوى المتقدم): لماذا نتدرب على الحجل بالقدمين؟\nالإجابة: لتقوية القدمين معًا وعدم الاعتماد على قدم واحدة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما الحركة المناسبة لتخطي الحبل؟\nالإجابة: الوثب بالقدمين.\nس2 (المستوى المتوقع): ما الحركة التي أديناها بين الأقماع؟\nالإجابة: الحجل.\nس3 (المستوى المتقدم): لماذا نهبط على المرتبة بعد الوثب من المقعد؟\nالإجابة: لأن المرتبة تمتص الصدمة وتحمي الركبتين والكاحلين.\n\nالحصة 4:\nس1 (مستوى الدعم): ماذا تفعل عند نداء (كنغر)؟\nالإجابة: أثب بالقدمين معًا.\nس2 (المستوى المتوقع): ما الحركة التي أديتها حول القمع في التتابع؟\nالإجابة: الحجل.\nس3 (المستوى المتقدم): لماذا تخسر المجموعة التي تسقط الحبل؟\nالإجابة: لأنها لم تؤدِّ الوثب بالطريقة الصحيحة فتخالف قواعد المسابقة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ وثبة لأمام من طوق إلى طوق.\nالإجابة: يثب بالقدمين معًا ويهبط داخل الطوق بثني الركبتين.\nس2 (المستوى المتوقع): ما الفرق بين الوثب لأعلى والوثب لأمام؟\nالإجابة: في الوثب لأعلى نرتفع ونهبط في المكان نفسه، وفي الوثب لأمام ننتقل إلى مكان أبعد.\nس3 (المستوى المتقدم): زميلك يهبط بركبتين مفرودتين، بماذا تنصحه؟\nالإجابة: أنصحه بثني الركبتين عند الهبوط حتى لا يتأذى.\n\nالحصة 2:\nس1 (مستوى الدعم): احجل ثلاث مرات بالقدم اليسرى.\nالإجابة: يحجل بالقدم اليسرى دون لمس الأرض بالأخرى.\nس2 (المستوى المتوقع): أي قدميك كانت أقوى في الحجل؟ وكيف عرفت؟\nالإجابة: يذكر القدم ويعلل بأنه حجل بها مسافة أطول دون سقوط.\nس3 (المستوى المتقدم): أرفع صورة طفل يقفز بقدم واحدة، ما اسم الحركة؟\nالإجابة: الحجل.\n\nالحصة 3:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم والحركة المناسبة لكل منهما.\nالإجابة: الحبل: وثب، الأقماع: حجل (أو المقعد: وثب والهبوط على المرتبة).\nس2 (المستوى المتوقع): كيف نثب داخل أطواق متباعدة؟\nالإجابة: نثني الركبتين ونمرجح الذراعين بقوة لنصل إلى الطوق البعيد.\nس3 (المستوى المتقدم): قائد المجموعة لاحظ هبوطًا خاطئًا، ماذا يقول لزميله؟\nالإجابة: اثنِ ركبتيك واهبط على المشطين بهدوء.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر لعبة رياضية يظهر فيها الوثب.\nالإجابة: كرة السلة أو الوثب الطويل أو الكرة الطائرة.\nس2 (المستوى المتوقع): أدِّ وثبًا فوق الحبل ثم حجلًا إلى القمع.\nالإجابة: يؤدي الحركتين بالتتابع الصحيح.\nس3 (المستوى المتقدم): كيف شعرت في مسابقة اليوم ولماذا؟\nالإجابة: يعبر عن سعادته لأنه تعاون مع مجموعته وأدى الحركات بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على الوثب بالقدمين داخل مربعات مرسومة بالطباشير مع الهبوط الهادئ (دليل المعلم ص 69-72).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طفلك على الحجل بكل قدم 5 مرات مع المحافظة على التوازن (دليل المعلم ص 70-73).\n\nالحصة 3:\nإرشاد لولي الأمر: ابنِ مع طفلك محطة بسيطة في المنزل (وسادة للوثب فوقها، خط للحجل) ومارساها بأمان (دليل المعلم ص 74).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طفلك على لعبة (الحجلة) التقليدية في المنزل أو الحي، وراجعا مراحل الوثب الثلاث (دليل ال لصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من الرقود مع إطالة الظهر.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نحمل الحقيبة بطريقة صحيحة؟\nالإجابة: على الكتفين معًا وقريبة من الظهر.\nس2 (المستوى المتوقع): ما شكل الظهر عند الجلوس الصحيح؟\nالإجابة: مستقيم ومسنود على ظهر الكرسي.\nس3 (المستوى المتقدم): ماذا حدث للكتاب عندما انحنى ظهرك؟\nالإجابة: سقط، لأن الاتزان يحتاج إلى قوام مستقيم.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة طفل يحمل الحقيبة على كتف واحد، ما الخطأ؟\nالإجابة: حملها على كتف واحد يميل الجسم، والصحيح على الكتفين.\nس2 (المستوى المتوقع): قف بقوام سليم.\nالإجابة: يقف معتدلًا، الرأس مرفوع، الكتفان للخلف.\nس3 (المستوى المتقدم): لماذا نهتم بالقوام السليم منذ الصغر؟\nالإجابة: لأن العادات الخاطئة تسبب تقوس الظهر وآلامه مستقبلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تابع جلوس طفلك عند أداء الواجب وحمل الحقيبة على الكتفين، واستعن بصور القوام في دليل المعلم ص 36 (برنامج صحتي ص 23)."}}, {"focus": "المهرجان الرياضي التعليمي للحركات الأساسية (المشي والجري والوثب والحجل)", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف المشي والجري والوثب والحجل في أقسام المهرجان.\n2. يطبق الهبوط الآمن وقواعد المحطات أثناء المنافسة.\n3. يشارك بروح الفريق ويتقبل نتيجة مجموعته.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- التتابع\n- الحركات الأساسية\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أتحرك بنشاط) ويقسم التلاميذ أربع مجموعات بقادة، ويعرض أقسام المهرجان بالصور ويذكر قواعد الأمان.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم: مشي، جري، وثب، حجل.\n- الطالب: يؤدي الإحماء.\n\n
