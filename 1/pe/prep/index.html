تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور القوام الصحيح والخاطئ\n- أخرى: حقيبة مدرسية\n- أخرى: مراتب\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: حواجز منخفضة\n- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: لوحة نقاط", "المفاهيم": "الحصة 1:\n- القوام السليم\n- الوقوف المعتدل\n- الجلوس الصحيح\n- حمل الحقيبة على الكتفين\n\nالحصة 2:\n- المهرجان الرياضي التعليمي\n- التتابع\n- الحركات الأساسية\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورتين لطفل يجلس معتدلًا وآخر منحنيًا ويسأل: أيهما يجلس بطريقة صحيحة؟ ولماذا؟\n\nالحصة 2:\nيعلن المعلم مهرجان (أتحرك بنشاط) ويقسم التلاميذ أربع مجموعات بقادة، ويعرض أقسام المهرجان بالصور ويذكر قواعد الأمان.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم مع التركيز على استقامة الظهر: مشي بكتاب على الرأس، جري خفيف ورأس مرفوع.\n- الطالب: يؤدي الإحماء محافظًا على الاعتدال.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الوقوف المعتدل والجلوس الصحيح وحمل الحقيبة على الكتفين، ويعرض الصور مع التفكير بصوت عالٍ عن أضرار الوضع الخاطئ (ص 36).\n- الطالب: يقلد الأوضاع الصحيحة ويصحح الأوضاع الخاطئة في الصور.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يجرب التلاميذ المشي بالكتاب على الرأس بظهر منحنٍ ثم بظهر مستقيم ويكتشفون متى يثبت الكتاب، فيستنتجون علاقة القوام بالاتزان.\n- الطالب: يجرب ويستنتج أن الظهر المستقيم يحفظ الاتزان.\n\nالنشاط 4 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (تمثال القوام): يجري التلاميذ وعند الصافرة يثبت كل تلميذ في وضع (وقوف معتدل) أو (جلوس صحيح) حسب النداء، ويفوز الأدق.\n- الطالب: يستجيب بالوضع الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة من الرقود مع إطالة الظهر.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بنموذج المعلم: مشي، جري، وثب، حجل.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم المشي (مسار المقعد السويدي والحواجز)، قسم الجري (جري متعرج بين الأقماع ذهابًا وإيابًا)، قسم الوثب (وثب فوق الحبال وداخل الأطواق والهبوط على المرتبة)، قسم الحجل (حجل بالقدمين بالتبادل بين الأقماع)، مع تسجيل نقاط الأداء والنظام والتعاون.\n- الطالب: يؤدي مع مجموعته مهام كل قسم وينتقل بإشارة القائد.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع مجمع (مشي، جري، وثب، حجل) بين المجموعات.\n- الطالب: يتسابق بدقة وسرعة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وإعلان النتائج وتكريم المشاركين.\n- الطالب: يؤدي التهدئة ويهنئ الفائزين.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كيف نحمل الحقيبة بطريقة صحيحة؟\nالإجابة: على الكتفين معًا وقريبة من الظهر.\nس2 (المستوى المتوقع): ما شكل الظهر عند الجلوس الصحيح؟\nالإجابة: مستقيم ومسنود على ظهر الكرسي.\nس3 (المستوى المتقدم): ماذا حدث للكتاب عندما انحنى ظهرك؟\nالإجابة: سقط، لأن الاتزان يحتاج إلى قوام مستقيم.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الحركات الأربع التي أديناها في المهرجان؟\nالإجابة: المشي، الجري، الوثب، الحجل.\nس2 (المستوى المتوقع): في أي قسم استخدمنا الحبال؟\nالإجابة: قسم الوثب.\nس3 (المستوى المتقدم): ما القاعدة الأهم عند الوثب على المرتبة؟\nالإجابة: الهبوط بثني الركبتين على المشطين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أرفع صورة طفل يحمل الحقيبة على كتف واحد، ما الخطأ؟\nالإجابة: حملها على كتف واحد يميل الجسم، والصحيح على الكتفين.\nس2 (المستوى المتوقع): قف بقوام سليم.\nالإجابة: يقف معتدلًا، الرأس مرفوع، الكتفان للخلف.\nس3 (المستوى المتقدم): لماذا نهتم بالقوام السليم منذ الصغر؟\nالإجابة: لأن العادات الخاطئة تسبب تقوس الظهر وآلامه مستقبلًا.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر الحركة التي أديتها في قسم الحجل.\nالإجابة: الحجل بالقدم اليمنى ثم اليسرى بين الأقماع.\nس2 (المستوى المتوقع): كيف ساعدك قائد المجموعة اليوم؟\nالإجابة: نظم انتقالنا بين الأقسام وشجعنا.\nس3 (المستوى المتقدم): مجموعتك لم تفز، ماذا تقول لزملائك؟\nالإجابة: لقد أدينا جيدًا وسنتدرب أكثر، والمهم أننا شاركنا وتعاونّا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تابع جلوس طفلك عند أداء الواجب وحمل الحقيبة على الكتفين، واستعن بصور القوام في دليل المعلم ص 36 (برنامج صحتي ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان الأربعة، ومارسا معًا الحجل والوثب في مكان آمن (دليل المعلم ص 60-77)."}}, {"title": "المرجحة والمد والثني", "unit": "الحركات الأساسية الانتقالية وغير الانتقالية (أتحرك بنشاط)", "week": "الحادي عشر", "date": "15-19/11/2026", "pages": "دليل المعلم ص 78-84", "n": 2, "periods": [{"focus": "حركات الثني والمد والمرجحة في التمرينات", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركات الثني والمد والمرجحة.\n2. يحدد أجزاء الجسم التي يمكن ثنيها ومدها ومرجحتها.\n3. يؤدي تمرينات للثني والمد والمرجحة من أوضاع مختلفة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- صورة توضيحية", "المفاهيم": "- الثني\n- المد\n- المرجحة\n- الحركات غير الانتقالية", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: كم جزءًا من جسمك تستطيع ثنيه؟ ومده؟ ومرجحته؟ ويدع التلاميذ يجربون (ص 79)، ثم يعرض صور أرجوحة وذراع تمتد.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف ثم ثني ومد الذراعين والركبتين بالعد.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 80: يطلب المعلم من التلاميذ أن يثنوا ويمدوا ويمرجحوا أجزاء مختلفة من أوضاع (وقوف، جلوس، رقود) ويكتشفوا أي الأجزاء تتحرك أكثر، ثم يصوغ معهم تعريف كل حركة.\n- الطالب: يجرب الحركات ويعبر عن اكتشافه ثم يكرر التعريف.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم نماذج: ثني الجذع أمامًا ومده، مرجحة الذراعين أمامًا وخلفًا، مرجحة الرجل جانبًا من الوقوف بمسك الطوق، مع التطبيق الموجه ثم المستقل.\n- الطالب: يؤدي النماذج بعد المعلم ثم مستقلًا.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الآلة): يرفع المعلم بطاقة (ثني) أو (مد) أو (مرجحة) ويؤدي التلميذ الحركة بالجزء الذي يناديه، ومن يخطئ يصبح مساعدًا للمعلم.\n- الطالب: يستجيب بالحركة الصحيحة والجزء الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة بطيئة (مد) مع التنفس.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة التي تقرب الساعد من العضد؟\nالإجابة: الثني.\nس2 (المستوى المتوقع): اذكر جزءًا من الجسم يمكن مرجحته.\nالإجابة: الذراع أو الرجل.\nس3 (المستوى المتقدم): ما الفرق بين الثني والمد؟\nالإجابة: الثني تقريب جزأين من الجسم، والمد إبعادهما واستقامتهما.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ مرجحة للذراعين أمامًا وخلفًا.\nالإجابة: يمرجح الذراعين بانتظام.\nس2 (المستوى المتوقع): من وضع الجلوس، ما الحركة التي تحرك فيها الجذع للأمام نحو القدمين؟\nالإجابة: ثني الجذع.\nس3 (المستوى المتقدم): هل نستطيع مرجحة الجذع؟ وكيف؟\nالإجابة: نعم، بتبادل ميل الجذع للجانبين من الوقوف والذراعان عاليًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: مارس مع طفلك ثلاث حركات (ثني ومد الذراعين، مرجحة الرجل) أمام المرآة (دليل المعلم ص 79-80)."}}, {"focus": "محطات وألعاب الثني والمد والمرجحة", "num": 2, "fields": {"المخرجات التعليمية": "1. يشارك زملاءه أداء حركات الثني والمد والمرجحة في المحطات.\n2. يوظف المرجحة في مهارات بسيطة (مرجحة الذراع لرمي الكرة).\n3. يستمتع بمشاركة زملائه أنشطة الثني والمد والمرجحة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: أطواق\n- أخرى: مقاعد سويدية\n- أخرى: كرات متوسطة\n- أخرى: أقماع", "المفاهيم": "- الثني\n- المد\n- المرجحة\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "يرفع المعلم بطاقات الحركات الثلاث للمراجعة السريعة، ثم يسأل: عندما نرمي الكرة، أي حركة نؤديها بالذراع؟ (مرجحة ثم مد).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ثم مرجحات للذراعين والرجلين.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (15 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (محطات الثني والمد والمرجحة) ص 82: محطة الجلوس على المقعد وثني ومد الرجلين، محطة الرقود ومد الذراعين فوق الرأس وثنيهما، محطة مرجحة الذراع لرمي الكرة في الطوق، محطة مرجحة الرجل فوق القمع، مع التبديل.\n- الطالب: يؤدي حركة المحطة بدقة ويعاون مجموعته.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 (ألعاب) ص 83: لعبة (المرآة) في أزواج: يؤدي تلميذ حركة ثني أو مد أو مرجحة ويقلدها زميله كالمرآة، ثم لعبة النداء على الحركة والجزء.\n- الطالب: يلعب ويقلد بدقة ويتبادل الأدوار.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كانت الكرة تصل أبعد عند مرجحة الذراع للخلف أكثر؟ ليستنتج التلاميذ علاقة المرجحة بالقوة.\n- الطالب: يستنتج ويذكر مثالًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الظهر والذراعين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة التي نؤديها بالذراع قبل رمي الكرة؟\nالإجابة: المرجحة.\nس2 (المستوى المتوقع): في محطة المقعد، ما الحركتان اللتان أديناهما بالرجلين؟\nالإجابة: الثني والمد.\nس3 (المستوى المتقدم): كيف تساعدنا المرجحة على رمي الكرة أبعد؟\nالإجابة: تعطي الذراع قوة وسرعة أكبر.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم والحركة فيهما.\nالإجابة: محطة الكرة: مرجحة الذراع، محطة المقعد: ثني ومد الرجلين.\nس2 (المستوى المتوقع): في لعبة المرآة، زميلك ثنى جذعه للأمام، ماذا تفعل؟\nالإجابة: أثني جذعي للأمام مثله تمامًا.\nس3 (المستوى المتقدم): اذكر مهارة رياضية فيها مرجحة.\nالإجابة: رمي الكرة، أو ركل الكرة (مرجحة الرجل)، أو التأرجح.", "ملاحظات ضمن 10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم نماذج: ثني الجذع أمامًا ومده، مرجحة الذراعين أمامًا وخلفًا، مرجحة الرجل جانبًا من الوقوف بمسك الطوق، مع التطبيق الموجه ثم المستقل.\n- الطالب: يؤدي النماذج بعد المعلم ثم مستقلًا.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الآلة): يرفع المعلم بطاقة (ثني) أو (مد) أو (مرجحة) ويؤدي التلميذ الحركة بالجزء الذي يناديه، ومن يخطئ يصبح مساعدًا للمعلم.\n- الطالب: يستجيب بالحركة الصحيحة والجزء الصحيح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة بطيئة (مد) مع التنفس.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ثم مرجحات للذراعين والرجلين.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (15 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 (محطات الثني والمد والمرجحة) ص 82: محطة الجلوس على المقعد وثني ومد الرجلين، محطة الرقود ومد الذراعين فوق الرأس وثنيهما، محطة مرجحة الذراع لرمي الكرة في الطوق، محطة مرجحة الرجل فوق القمع، مع التبديل.\n- الطالب: يؤدي حركة المحطة بدقة ويعاون مجموعته.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 3 (ألعاب) ص 83: لعبة (المرآة) في أزواج: يؤدي تلميذ حركة ثني أو مد أو مرجحة ويقلدها زميله كالمرآة، ثم لعبة النداء على الحركة والجزء.\n- الطالب: يلعب ويقلد بدقة ويتبادل الأدوار.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا كانت الكرة تصل أبعد عند مرجحة الذراع للخلف أكثر؟ ليستنتج التلاميذ علاقة المرجحة بالقوة.\n- الطالب: يستنتج ويذكر مثالًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة الظهر والذراعين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما الحركة التي تقرب الساعد من العضد؟\nالإجابة: الثني.\nس2 (المستوى المتوقع): اذكر جزءًا من الجسم يمكن مرجحته.\nالإجابة: الذراع أو الرجل.\nس3 (المستوى المتقدم): ما الفرق بين الثني والمد؟\nالإجابة: الثني تقريب جزأين من الجسم، والمد إبعادهما واستقامتهما.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الحركة التي نؤديها بالذراع قبل رمي الكرة؟\nالإجابة: المرجحة.\nس2 (المستوى المتوقع): في محطة المقعد، ما الحركتان اللتان أديناهما بالرجلين؟\nالإجابة: الثني والمد.\nس3 (المستوى المتقدم): كيف تساعدنا المرجحة على رمي الكرة أبعد؟\nالإجابة: تعطي الذراع قوة وسرعة أكبر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ مرجحة للذراعين أمامًا وخلفًا.\nالإجابة: يمرجح الذراعين بانتظام.\nس2 (المستوى المتوقع): من وضع الجلوس، ما الحركة التي تحرك فيها الجذع للأمام نحو القدمين؟\nالإجابة: ثني الجذع.\nس3 (المستوى المتقدم): هل نستطيع مرجحة الجذع؟ وكيف؟\nالإجابة: نعم، بتبادل ميل الجذع للجانبين من الوقوف والذراعان عاليًا.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم والحركة فيهما.\nالإجابة: محطة الكرة: مرجحة الذراع، محطة المقعد: ثني ومد الرجلين.\nس2 (المستوى المتوقع): في لعبة المرآة، زميلك ثنى جذعه للأمام، ماذا تفعل؟\nالإجابة: أثني جذعي للأمام مثله تمامًا.\nس3 (المستوى المتقدم): اذكر مهارة رياضية فيها مرجحة.\nالإجابة: رمي الكرة، أو ركل الكرة (مرجحة الرجل)، أو التأرجح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: مارس مع طفلك ثلاث حركات (ثني ومد الذراعين، مرجحة الرجل) أمام المرآة (دليل المعلم ص 79-80).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك لعبة (المرآة) بحركات الثني والمد والمرجحة، وراجعا صور المحطات في دليل المعلم ص 82-83."}}, {"title": "دحرجة الكرة والتقاطها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 88-95", "n": 2, "periods": [{"focus": "دحرجة الكرة بكلتا اليدين وبيد واحدة والتقاطها", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركتي دحرجة الكرة والتقاطها ونقاطهما الفنية.\n2. يؤدي دحرجة الكرة بكلتا اليدين وبيد واحدة في مسار.\n3. يلتقط الكرة المتدحرجة بثني الركبتين وانتشار الأصابع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صولجانات\n- صورة توضيحية", "المفاهيم": "- الدحرجة\n- الالتقاط\n- التوافق\n- المسار", "التهيئة / التمهيد / التعلم القبلي": "يدحرج المعلم كرة نحو تلميذ ويسأل: كيف تتحرك الكرة؟ وكيف أمسكتها؟ ثم يعرض صور الدحرجة والالتقاط في البولينج وكرة القدم.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف مع كرة في اليد، ثني ومد الركبتين حاملًا الكرة.\n- الطالب: يقلد الإحماء بالكرة.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الدحرجة: ثني الركبتين وميل الجذع، مرجحة الذراع خلفًا ثم أمامًا ودفع الكرة على الأرض بأطراف الأصابع؛ ثم الالتقاط: القدمان متباعدتان، ثني الركبتين، مد الذراعين أسفل والكفان متواجهتان وسحب الكرة للصدر (ص 89-90).\n- الطالب: يؤدي الدحرجة بكلتا اليدين ثم بيد واحدة، ويلتقط الكرة بالطريقة الصحيحة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 91: دحرجة الكرة في مسارات مستقيمة ومتعرجة بين الأقماع نحو هدف (طوق)؛ يجرب التلميذ قوة الدفع ويكتشف متى تخرج الكرة عن المسار ومتى تصل الهدف.\n- الطالب: يجرب ويستنتج أن الدفع المعتدل وتصويب اليد نحو الهدف يبقيان الكرة في المسار.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 92: في أزواج متقابلين على مسافة 3 أمتار، تبادل الدحرجة والالتقاط مع العد، وزيادة المسافة تدريجيًا.\n- الطالب: يتبادل مع زميله ويزيد المسافة بعد 5 التقاطات ناجحة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالجلوس والتنفس مع دحرجة الكرة ببطء حول الجسم.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف ندحرج الكرة على الأرض؟\nالإجابة: نثني الركبتين ونمرجح الذراع ثم ندفع الكرة بالأصابع على الأرض.\nس2 (المستوى المتوقع): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين أمام الجسم والأصابع منتشرة.\nس3 (المستوى المتقدم): لماذا نثني الركبتين عند الالتقاط؟\nالإجابة: لننزل إلى مستوى الكرة فنلتقطها بأمان.", "التقويم الختامي": "س1 (مستوى الدعم): دحرج الكرة بيد واحدة لتصل إلى الطوق.\nالإجابة: يدحرج الكرة في اتجاه الطوق بدفع معتدل.\nس2 (المستوى المتوقع): ماذا يحدث لو دفعت الكرة بقوة كبيرة في المسار المتعرج؟\nالإجابة: تخرج عن المسار وتصطدم بالأقماع.\nس3 (المستوى المتقدم): سمِّ لعبة رياضية فيها دحرجة الكرة.\nالإجابة: البولينج أو كرة القدم (تمرير أرضي).", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طفلك دحرجة كرة والتقاطها في المنزل من مسافة 3 أمتار مع ثني الركبتين (دليل المعلم ص 89-92)."}}, {"focus": "منافسات وألعاب دحرجة الكرة والتقاطها", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف دحرجة الكرة والتقاطها في منافسات وألعاب.\n2. يصوّب الكرة المتدحرجة نحو هدف بدقة.\n3. يشعر بالسعادة عند مشاركة زملائه أداء دحرجة الكرة والتقاطها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "- الدحرجة\n- الالتقاط\n- الدقة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم نقاط الدحرجة والالتقاط بسؤال تلميذين لأداء النموذج، ثم يعرض الصولجانات ويسأل: كيف نسقطها بالكرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ودحرجة الكرة أمام الجسم أثناء المشي.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (منافسات دحرجة الكرة) ص 93: في مجموعات متقابلة، كل مجموعة تدحرج الكرة لإسقاط صولجانات المجموعة الأخرى من مسافة 4 أمتار وتلتقط الكرات القادمة، وتحسب النقاط.\n- الطالب: يدحرج نحو الهدف ويلتقط الكرات القادمة ويعد نقاط مجموعته.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (ألعاب) ص 94: لعبة (الكرة النارية): تلاميذ الدائرة يدحرجون الكرة لمحاولة لمس قدمي من في المنتصف، ومن تلمسه يستبدل، ثم لعبة تمرير الكرة بالدحرجة بين رجلي الزملاء في القطار.\n- الطالب: يلعب ملتزمًا بالدحرجة على الأرض دون رفع الكرة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا أصابت بعض الكرات الصولجان وأخطأت أخرى؟ ليستنتج التلاميذ أهمية النظر إلى الهدف وتوجيه اليد نحوه.\n- الطالب: يستنتج ويذكر نصيحة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة والتعبير عن الشعور بعد المنافسة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نصيب الصولجان بالكرة المتدحرجة؟\nالإجابة: ننظر إلى الهدف ونوجه اليد نحوه عند الدفع.\nس2 (المستوى المتوقع): ما القاعدة في لعبة الكرة النارية؟\nالإجابة: تبقى الكرة على الأرض بالدحرجة ولا ترفع.\nس3 (المستوى المتقدم): كيف تساعد مجموعتك في المنافسة؟\nالإجابة: أدحرج بدقة وألتقط الكرات القادمة بسرعة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر لعبة من ألعاب اليوم استخدمنا فيها الدحرجة.\nالإجابة: الكرة النارية أو تمرير الكرة بين الرجلين في القطار.\nس2 (المستوى المتوقع): دحرج الكرة لتسقط الصولجان من مسافة 3 أمتار.\nالإجابة: يدحرج بدقة نحو الصولجان.\nس3 (المستوى المتقدم): كيف شعرت عندما التقطت كرة صعبة؟\nالإجابة: يعبر عن سعادته وثقته بنفسه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك لعبة إسقاط زجاجات بلاستيكية فارغة بدحرجة الكرة، وشجعه على الالتقاط الصحيح (دليل المعلم ص 93-95)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركتي دحرجة الكرة والتقاطها ونقاطهما الفنية.\n2. يؤدي دحرجة الكرة بكلتا اليدين وبيد واحدة في مسار.\n3. يلتقط الكرة المتدحرجة بثني الركبتين وانتشار الأصابع.\n\nالحصة 2:\n1. يوظف دحرجة الكرة والتقاطها في منافسات وألعاب.\n2. يصوّب الكرة المتدحرجة نحو هدف بدقة.\n3. يشعر بالسعادة عند مشاركة زملائه أداء دحرجة الكرة والتقاطها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صولجانات\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الدحرجة\n- الالتقاط\n- التوافق\n- المسار\n\nالحصة 2:\n- الدحرجة\n- الالتقاط\n- الدقة\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيدحرج المعلم كرة نحو تلميذ ويسأل: كيف تتحرك الكرة؟ وكيف أمسكتها؟ ثم يعرض صور الدحرجة والالتقاط في البولينج وكرة القدم.\n\nالحصة 2:\nيراجع المعلم نقاط الدحرجة والالتقاط بسؤال تلميذين لأداء النموذج، ثم يعرض الصولجانات ويسأل: كيف نسقطها بالكرة؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري خفيف مع كرة في اليد، ثني ومد الركبتين حاملًا الكرة.\n- الطالب: يقلد الإحماء بالكرة.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الدحرجة: ثني الركبتين وميل الجذع، مرجحة الذراع خلفًا ثم أمامًا ودفع الكرة على الأرض بأطراف الأصابع؛ ثم الالتقاط: القدمان متباعدتان، ثني الركبتين، مد الذراعين أسفل والكفان متواجهتان وسحب الكرة للصدر (ص 89-90).\n- الطالب: يؤدي الدحرجة بكلتا اليدين ثم بيد واحدة، ويلتقط الكرة بالطريقة الصحيحة.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 91: دحرجة الكرة في مسارات مستقيمة ومتعرجة بين الأقماع نحو هدف (طوق)؛ يجرب التلميذ قوة الدفع ويكتشف متى تخرج الكرة عن المسار ومتى تصل الهدف.\n- الطالب: يجرب ويستنتج أن الدفع المعتدل وتصويب اليد نحو الهدف يبقيان الكرة في المسار.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 92: في أزواج متقابلين على مسافة 3 أمتار، تبادل الدحرجة والالتقاط مع العد، وزيادة المسافة تدريجيًا.\n- الطالب: يتبادل مع زميله ويزيد المسافة بعد 5 التقاطات ناجحة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالجلوس والتنفس مع دحرجة الكرة ببطء حول الجسم.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ودحرجة الكرة أمام الجسم أثناء المشي.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (منافسات دحرجة الكرة) ص 93: في مجموعات متقابلة، كل مجموعة تدحرج الكرة لإسقاط صولجانات المجموعة الأخرى من مسافة 4 أمتار وتلتقط الكرات القادمة، وتحسب النقاط.\n- الطالب: يدحرج نحو الهدف ويلتقط الكرات القادمة ويعد نقاط مجموعته.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (ألعاب) ص 94: لعبة (الكرة النارية): تلاميذ الدائرة يدحرجون الكرة لمحاولة لمس قدمي من في المنتصف، ومن تلمسه يستبدل، ثم لعبة تمرير الكرة بالدحرجة بين رجلي الزملاء في القطار.\n- الطالب: يلعب ملتزمًا بالدحرجة على الأرض دون رفع الكرة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا أصابت بعض الكرات الصولجان وأخطأت أخرى؟ ليستنتج التلاميذ أهمية النظر إلى الهدف وتوجيه اليد نحوه.\n- الطالب: يستنتج ويذكر نصيحة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة والتعبير عن الشعور بعد المنافسة.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كيف ندحرج الكرة على الأرض؟\nالإجابة: نثني الركبتين ونمرجح الذراع ثم ندفع الكرة بالأصابع على الأرض.\nس2 (المستوى المتوقع): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين أمام الجسم والأصابع منتشرة.\nس3 (المستوى المتقدم): لماذا نثني الركبتين عند الالتقاط؟\nالإجابة: لننزل إلى مستوى الكرة فنلتقطها بأمان.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نصيب الصولجان بالكرة المتدحرجة؟\nالإجابة: ننظر إلى الهدف ونوجه اليد نحوه عند الدفع.\nس2 (المستوى المتوقع): ما القاعدة في لعبة الكرة النارية؟\nالإجابة: تبقى الكرة على الأرض بالدحرجة ولا ترفع.\nس3 (المستوى المتقدم): كيف تساعد مجموعتك في المنافسة؟\nالإجابة: أدحرج بدقة وألتقط الكرات القادمة بسرعة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): دحرج الكرة بيد واحدة لتصل إلى الطوق.\nالإجابة: يدحرج الكرة في اتجاه الطوق بدفع معتدل.\nس2 (المستوى المتوقع): ماذا يحدث لو دفعت الكرة بقوة كبيرة في المسار المتعرج؟\nالإجابة: تخرج عن المسار وتصطدم بالأقماع.\nس3 (المستوى المتقدم): سمِّ لعبة رياضية فيها دحرجة الكرة.\nالإجابة: البولينج أو كرة القدم (تمرير أرضي).\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر لعبة من ألعاب اليوم استخدمنا فيها الدحرجة.\nالإجابة: الكرة النارية أو تمرير الكرة بين الرجلين في القطار.\nس2 (المستوى المتوقع): دحرج الكرة لتسقط الصولجان من مسافة 3 أمتار.\nالإجابة: يدحرج بدقة نحو الصولجان.\nس3 (المستوى المتقدم): كيف شعرت عندما التقطت كرة صعبة؟\nالإجابة: يعبر عن سعادته وثقته بنفسه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طفلك دحرجة كرة والتقاطها في المنزل من مسافة 3 أمتار مع ثني الركبتين (دليل المعلم ص 89-92).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك لعبة إسقاط زجاجات بلاستيكية فارغة بدحرجة الكرة، وشجعه على الالتقاط الصحيح (دليل المعلم ص 93-95)."}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 20-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: شرب الماء والغذاء الصحي قبل النشاط وبعده", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية شرب الماء قبل النشاط وبعده.\n2. يميز بين الأطعمة الصحية وغير الصحية للرياضي الصغير.\n3. يقدر أثر الغذاء الصحي في نشاط الجسم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: زجاجات ماء\n- أخرى: بطاقات صور أطعمة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- الماء\n- الغذاء الصحي\n- العرق\n- الطاقة", "التهيئة / التمهيد / التعلم القبلي": "بعد جري قصير يسأل المعلم: بماذا تشعرون؟ (عطش، عرق) ويعرض زجاجة ماء وصور فواكه وحلويات ويسأل: أيها يعطينا طاقة للعب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم ثم وقفة لشرب الماء بطريقة صحيحة (رشفات صغيرة).\n- الطالب: يؤدي الإحماء ويشرب الماء.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم الصور ويفكر بصوت عالٍ: الجسم يفقد الماء بالعرق فنعوضه بالماء لا المشروبات الغازية؛ الفواكه والخضار والحليب تعطي طاقة، والحلويات الكثيرة تضر، ويذكر برنامج (صحتي) ص 23.\n- الطالب: يستمع ويصنف الصور إلى صحي وغير صحي.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (سلة الصحة): طوقان (صحي، غير صحي)، يجري كل تلميذ ويسحب بطاقة طعام ويضعها في الطوق المناسب، ونقطة لكل تصنيف صحيح.\n- الطالب: يجري ويصنف البطاقة بسرعة ودقة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تكوّن كل مجموعة (وجبة رياضي صغير) من البطاقات الصحية وتعرضها.\n- الطالب: يتعاون في اختيار البطاقات ويعرض الوجبة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وشرب الماء، ونصيحة اليوم: احمل زجاجة ماء في يوم الحصة.\n- الطالب: يؤدي التهدئة ويكرر النصيحة.", "التقويم التكويني": "س1 (مستوى الدعم): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس2 (المستوى المتوقع): اذكر طعامين صحيين.\nالإجابة: التفاح والحليب (أو أي فاكهة أو خضار).\nس3 (المستوى المتقدم): هل المشروبات الغازية تعوض الماء؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير ولا تروي الجسم.", "التقويم الختامي": "س1 (مستوى الدعم): متى نشرب الماء في يوم الرياضة؟\nالإجابة: قبل الحصة وبعدها، وبرشفات صغيرة أثناءها.\nس2 (المستوى المتوقع): أرفع صورة قطعة حلوى كبيرة، في أي طوق نضعها؟\nالإجابة: طوق غير صحي.\nس3 (المستوى المتقدم): كوّن وجبة فطور صحية للرياضي الصغير.\nالإجابة: مثل: حليب، خبز، بيض أو فاكهة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: جهّز لطفلك زجاجة ماء وفاكهة في يوم الحصة، وناقشا معًا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 23)."}}, {"focus": "المهرجان الرياضي التعليمي للمعالجة والتناول (الدحرجة والالتقاط) والحركات الأساسية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف دحرجة الكرة والتقاطها والحركات الأساسية في أقسام المهرجان.\n2. يطبق قواعد الأقسام والالتزام بالدور.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: صولجانات\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- الدحرجة\n- الالتقاط\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (ألعب بالكرة) ويقسم التلاميذ أربع مجموعات بقادة، ويعرض أقسام المهرجان ويذكر قواعد الأمان بالكرات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بالكرة بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم الدحرجة نحو الصولجانات، قسم الالتقاط (تبادل الدحرجة والالتقاط في أزواج)، قسم الوثب والحجل بالكرة بين اليدين داخل الأطواق، قسم الجري المتعرج بالكرة حول الأقماع، مع تسجيل النقاط.\n- الطالب: يؤدي مهام الأقسام مع مجموعته بقيادة القائد.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع دحرجة الكرة والالتقاط بين المجموعات.\n- الطالب: يتسابق بدقة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم جميع المشاركين.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "س1 (مستوى الدعم): ما القسم الذي استخدمنا فيه الصولجانات؟\nالإجابة: قسم الدحرجة.\nس2 (المستوى المتوقع): كيف نلتقط الكرة المتدحرجة في قسم الالتقاط؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس3 (المستوى المتقدم): لماذا نسجل نقاطًا للنظام والتعاون؟\nالإجابة: لأن المهرجان يعلمنا النظام والتعاون مع المهارة.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم الدحرجة وقسم الالتقاط (أو الوثب بالكرة، الجري المتعرج).\nس2 (المستوى المتوقع): ما دور قائد المجموعة؟\nالإجابة: ينظم الدور ويشجع زملاءه وينقلهم بين الأقسام.\nس3 (المستوى المتقدم): ماذا تقول لزميل غضب لأن مجموعته خسرت؟\nالإجابة: المشاركة أهم من الفوز، وسنتدرب ونفوز في المرة القادمة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وراجعا دحرجة الكرة والتقاطها (دليل المعلم ص 88-95)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية شرب الماء قبل ي ويصنف البطاقة بسرعة ودقة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تكوّن كل مجموعة (وجبة رياضي صغير) من البطاقات الصحية وتعرضها.\n- الطالب: يتعاون في اختيار البطاقات ويعرض الوجبة.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وشرب الماء، ونصيحة اليوم: احمل زجاجة ماء في يوم الحصة.\n- الطالب: يؤدي التهدئة ويكرر النصيحة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء جماعي بالكرة بنموذج المعلم.\n- الطالب: يؤدي الإحماء.\n\nالنشاط 2 (26 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أربعة أقسام (6-7 دقائق لكل قسم) وفق دليل المعلم ص 20-22: قسم الدحرجة نحو الصولجانات، قسم الالتقاط (تبادل الدحرجة والالتقاط في أزواج)، قسم الوثب والحجل بالكرة بين اليدين داخل الأطواق، قسم الجري المتعرج بالكرة حول الأقماع، مع تسجيل النقاط.\n- الطالب: يؤدي مهام الأقسام مع مجموعته بقيادة القائد.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة ختامية: تتابع دحرجة الكرة والالتقاط بين المجموعات.\n- الطالب: يتسابق بدقة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتكريم جميع المشاركين.\n- الطالب: يؤدي التهدئة ويهنئ.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا نشرب الماء بعد اللعب؟\nالإجابة: لتعويض ما فقدناه بالعرق.\nس2 (المستوى المتوقع): اذكر طعامين صحيين.\nالإجابة: التفاح والحليب (أو أي فاكهة أو خضار).\nس3 (المستوى المتقدم): هل المشروبات الغازية تعوض الماء؟ ولماذا؟\nالإجابة: لا، لأنها تحتوي على سكر كثير ولا تروي الجسم.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القسم الذي استخدمنا فيه الصولجانات؟\nالإجابة: قسم الدحرجة.\nس2 (المستوى المتوقع): كيف نلتقط الكرة المتدحرجة في قسم الالتقاط؟\nالإجابة: بثني الركبتين ومد الذراعين والكفان متواجهتان.\nس3 (المستوى المتقدم): لماذا نسجل نقاطًا للنظام والتعاون؟\nالإجابة: لأن المهرجان يعلمنا النظام والتعاون مع المهارة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): متى نشرب الماء في يوم الرياضة؟\nالإجابة: قبل الحصة وبعدها، وبرشفات صغيرة أثناءها.\nس2 (المستوى المتوقع): أرفع صورة قطعة حلوى كبيرة، في أي طوق نضعها؟\nالإجابة: طوق غير صحي.\nس3 (المستوى المتقدم): كوّن وجبة فطور صحية للرياضي الصغير.\nالإجابة: مثل: حليب، خبز، بيض أو فاكهة.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر قسمين من أقسام مهرجان اليوم.\nالإجابة: قسم الدحرجة وقسم الالتقاط (أو الوثب بالكرة، الجري المتعرج).\nس2 (المستوى المتوقع): ما دور قائد المجموعة؟\nالإجابة: ينظم الدور ويشجع زملاءه وينقلهم بين الأقسام.\nس3 (المستوى المتقدم): ماذا تقول لزميل غضب لأن مجموعته خسرت؟\nالإجابة: المشاركة أهم من الفوز، وسنتدرب ونفوز في المرة القادمة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: جهّز لطفلك زجاجة ماء وفاكهة في يوم الحصة، وناقشا معًا الأطعمة الصحية (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: اسأل طفلك عن أقسام المهرجان وراجعا دحرجة الكرة والتقاطها (دليل المعلم ص 88-95)."}}, {"title": "رمي الكرة واستلامها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الرابع عشر", "date": "6-10/12/2026", "pages": "دليل المعلم ص 96-105", "n": 2, "periods": [{"focus": "رمي الكرة بكلتا اليدين واستلامها من مستويات مختلفة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة رمي الكرة واستلامها وبعض أنواعها.\n2. يؤدي رمي الكرة بكلتا اليدين من أمام الصدر واستلامها.\n3. يميز مستويات استلام الكرة (عالية، متوسطة، منخفضة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- الرمي\n- الاستلام\n- اللقف\n- المستوى\n- الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الكرة لتلميذ من مستوى الصدر ثم عاليًا ثم منخفضًا ويسأل: كيف تغيرت طريقة استلامك؟ ويعرض صور الرمي في كرة اليد والسلة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري بالكرة، رمي الكرة عاليًا واستلامها في المكان.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم نموذج الرمي بكلتا اليدين من أمام الصدر (قدم متقدمة، ثني الذراعين ثم مدهما نحو الهدف) والاستلام (مد الذراعين نحو الكرة، الأصابع منتشرة، سحب الكرة للصدر، وثني الركبتين للكرات المنخفضة) من دليل المعلم ص 97-100.\n- الطالب: يؤدي الرمي والاستلام بعد النموذج أمام الحائط ثم مع زميل.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 101: رمي الكرة واستلامها من مستويات مختلفة؛ يجرب التلميذ استلام الكرة العالية والمتوسطة والمنخفضة ويكتشف وضع الكفين المناسب لكل مستوى (الإبهامان متقابلان للعالية، الخنصران متقاربان للمنخفضة).\n- الطالب: يجرب ويستنتج وضع الكفين لكل مستوى.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 102: في أزواج تبادل الرمي والاستلام من مسافة 3 أمتار مع العد المتواصل، ومن يصل 10 يرفع يده.\n- الطالب: يتبادل ويعد مع زميله.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بالجلوس وتمرير الكرة حول الجسم ببطء.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر بمد الذراعين نحو الهدف.\nس2 (المستوى المتوقع): كيف تكون الأصابع عند الاستلام؟\nالإجابة: منتشرة والكفان نحو الكرة.\nس3 (المستوى المتقدم): ماذا نفعل لاستلام الكرة المنخفضة؟\nالإجابة: نثني الركبتين وننزل الذراعين للأسفل.", "التقويم الختامي": "س1 (مستوى الدعم): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (المستوى المتوقع): ما وضع الإبهامين عند استلام الكرة العالية؟\nالإجابة: متقابلان خلف الكرة.\nس3 (المستوى المتقدم): سمِّ لعبتين فيهما رمي الكرة واستلامها.\nالإجابة: كرة اليد وكرة السلة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طفلك رمي كرة خفيفة واستلامها من مستويات مختلفة لمدة 10 دقائق (دليل المعلم ص 97-102)."}}, {"focus": "محطات ومنافسات رمي الكرة واستلامها", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف رمي الكرة واستلامها في أداء بعض مهارات الألعاب الرياضية.\n2. يرمي الكرة بدقة نحو هدف (طوق، مربع مرقم).\n3. يشارك زملاءه أداء أنشطة متنوعة لرمي الكرة واستلامها بسعادة.", "المستوى المعرفي": "المخرج 1: ت لختامي": "س1 (مستوى الدعم): ارمِ الكرة لتصيب المربع رقم 3.\nالإجابة: يرمي بدقة نحو المربع المحدد.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: محطة السلة ومحطة مربعات الأعداد (أو الحاجز، الحائط).\nس3 (المستوى المتقدم): كيف تساعد زميلك الذي تسقط منه الكرة كثيرًا؟\nالإجابة: أرمي له الكرة بلطف وأذكره بالنظر إليها ومد ذراعيه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك رمي الكرة في سلة أو طوق من مسافات مختلفة، وشجعه على الاستلام الصحيح (دليل المعلم ص 103-105)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف حركة رمي الكرة واستلامها وبعض أنواعها.\n2. يؤدي رمي الكرة بكلتا اليدين من أمام الصدر واستلامها.\n3. يميز مستويات استلام الكرة (عالية، متوسطة، منخفضة).\n\nالحصة 2:\n1. يوظف رمي الكرة واستلامها في أداء بعض مهارات الألعاب الرياضية.\n2. يرمي الكرة بدقة نحو هدف (طوق، مربع مرقم).\n3. يشارك زملاءه أداء أنشطة متنوعة لرمي الكرة واستلامها بسعادة.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات متوسطة\n- أخرى: أطواق\n- أخرى: مربعات الأعداد\n- أخرى: سلال بلاستيكية\n- أخرى: حواجز منخفضة\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الرمي\n- الاستلام\n- اللقف\n- المستوى\n- الاتجاه\n\nالحصة 2:\n- الرمي\n- الاستلام\n- الدقة\n- التصويب\n- التتابع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم الكرة لتلميذ من مستوى الصدر ثم عاليًا ثم منخفضًا ويسأل: كيف تغيرت طريقة استلامك؟ ويعرض صور الرمي في كرة اليد والسلة.\n\nالحصة 2:\nيراجع المعلم الرمي والاستلام بنموذج تلميذين، ثم يعرض السلال والمربعات المرقمة ويسأل: كيف نصيب الهدف برميتنا؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم زملاء؟ ليستنتج التلاميذ أهمية النظر إلى الكرة ومد الذراعين نحوها.\n- الطالب: يستنتج ويذكر نصيحة لزميله.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر بمد الذراعين نحو الهدف.\nس2 (المستوى المتوقع): كيف تكون الأصابع عند الاستلام؟\nالإجابة: منتشرة والكفان نحو الكرة.\nس3 (المستوى المتقدم): ماذا نفعل لاستلام الكرة المنخفضة؟\nالإجابة: نثني الركبتين وننزل الذراعين للأسفل.\n\nالحصة 2:\nس1 (مستوى الدعم): كيف نصيب السلة برميتنا؟\nالإجابة: ننظر إلى السلة ونمد الذراعين نحوها عند الرمي.\nس2 (المستوى المتوقع): في أي محطة رمينا الكرة فوق الحاجز؟\nالإجابة: محطة الرمي فوق الحاجز المنخفض واستلام الزميل.\nس3 (المستوى المتقدم): ماذا نفعل لنستلم الكرة دون أن تسقط؟\nالإجابة: ننظر إلى الكرة ونمد الذراعين نحوها ونسحبها للصدر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): ارمِ الكرة لزميلك من أمام الصدر واستلم كرته.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس2 (المستوى المتوقع): ما وضع الإبهامين عند استلام الكرة العالية؟\nالإجابة: متقابلان خلف الكرة.\nس3 (المستوى المتقدم): سمِّ لعبتين فيهما رمي الكرة واستلامها.\nالإجابة: كرة اليد وكرة السلة.\n\nالحصة 2:\nس1 (مستوى الدعم): ارمِ الكرة لتصيب المربع رقم 3.\nالإجابة: يرمي بدقة نحو المربع المحدد.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: محطة السلة ومحطة مربعات الأعداد (أو الحاجز، الحائط).\nس3 (المستوى المتقدم): كيف تساعد زميلك الذي تسقط منه الكرة كثيرًا؟\nالإجابة: أرمي له الكرة بلطف وأذكره بالنظر إليها ومد ذراعيه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تبادل مع طفلك رمي كرة خفيفة واستلامها من مستويات مختلفة لمدة 10 دقائق (دليل المعلم ص 97-102).\n\nالحصة 2:\nإرشاد لولي الأمر: العب مع طفلك رمي الكرة في سلة أو طوق من مسافات مختلفة، وشجعه على الاستلام الصحيح (دليل المعلم ص 103-105)."}}, {"title": "ركل الكرة وإيقافها", "unit": "المعالجة والتناول (ألعب بالكرة)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 106-112", "n": 2, "periods": [{"focus": "ركل الكرة بمقدمة القدم وإيقافها بباطن القدم", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف حركة ركل الكرة وإيقافها ونقاطهما الفنية.\n2. يؤدي ركل الكرة الثابتة بمقدمة القدم وإيقاف الكرة القادمة بباطن القدم.\n3. يميز بين الركل بقوة والركل بدقة حسب الهدف.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- صورة توضيحية", "المفاهيم": "- الركل\n- الإيقاف\n- مقدمة القدم\n- باطن القدم\n- الاتجاه", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة لاعب كرة قدم يركل الكرة ويسأل: بأي جزء من القدم ركل؟ ويترك التلاميذ يجربون ركل كرة ثابتة بلطف.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري حول الكرة، مرجحة الرجلين أمامًا وخلفًا، لمس الكرة بالقدمين بالتبادل.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يجزئ المعلم الركل بالعد: الوقوف بجانب الكرة، مرجحة الرجل الراكلة خلفًا، ركل الكرة بمقدمة القدم مع ثبات القدم المرتكزة بجانبها، ثم نموذج الإيقاف بوضع باطن القدم على الكرة القادمة (ص 107-108)، فتطبيق موجه بكرات مختلفة.\n- الطالب: يؤدي الركل بالعد ثم كاملًا، ويوقف الكرة القادمة من المعلم بباطن القدم.\n\nالنشاط 3 (10 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط 1 ص 108: ركل الكرة في اتجاهات ومسارات نحو أهداف قريبة وبعيدة؛ يجرب التلميذ قوة الركل ويكتشف أن الهدف القريب يحتاج إلى ركلة خفيفة والبعيد إلى مرجحة أكبر.\n- الطالب: يجرب ويستنتج علاقة قوة الركل بالمسافة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 2 ص 109: في أزواج متقابلين على مسافة 4 أمتار، تبادل ركل الكرة وإيقافها بباطن القدم مع العد.\n- الطالب: يتبادل مع زميله الركل والإيقاف.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة بإطالة عضلات الفخذين والساقين.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس2 (المستوى المتوقع): كيف نوقف الكرة القادمة؟\nالإجابة: نضع باطن القدم فوق الكرة بلطف.\nس3 (المستوى المتقدم): لماذا تصل الكرة أبعد عندما نمرجح الرجل أكثر؟\nالإجابة: لأن المرجحة الأكبر تعطي الركلة قوة أكبر.", "التقويم الختامي": "س1 (مستوى الدعم): اركل الكرة الثابتة لتصل إلى القمع.\nالإجابة: يركل بمقدمة القدم في اتجاه القمع.\nس2 (المستوى المتوقع): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة وثابتة.\nس3 (المستوى المتقدم): متى نستخدم ركلة خفيفة ومتى نستخدم ركلة قوية؟\nالإجابة: خفيفة للتمرير القريب والدقة، وقوية للهدف البعيد.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على ركل كرة خفيفة نحو هدف وإيقافها بباطن القدم في مكان آمن (دليل المعلم ص 107-109)."}}, {"focus": "محطات ومنافسات ركل الكرة وإيقافها", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف ركل الكرة وإيقافها في أداء بعض مهارات كرة القدم.\n2. يصوّب الكرة بالركل نحو هدف (الصندوق المقسم، بين قمعين).\n3. يشعر بالسعادة عند أداء حركة ركل الكرة وإيقافها مع زملائه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: صندوق مقسم\n- أخرى: أطواق", "المفاهيم": "- الركل\n- الإيقاف\n- التصويب\n- الدقة\n- التمرير", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الركل والإيقاف بنموذج تلميذ، ثم يضع هدفين من الأقماع ويسأل: كيف نسجل هدفًا بالركل؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ولمس الكرة بالقدمين وتمريرها بين القدمين.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات ركل الكرة) ص 110: محطة التصويب بين قمعين، محطة الركل لإدخال الكرة في الصندوق المقسم، محطة الإيقاف بباطن القدم لكرة زميل، محطة الركل لأبعد مسافة، مع التبديل والتسجيل.\n- الطالب: يؤدي مهمة الم ب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم: جري ولمس الكرة بالقدمين وتمريرها بين القدمين.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: نشاط 3 (محطات ركل الكرة) ص 110: محطة التصويب بين قمعين، محطة الركل لإدخال الكرة في الصندوق المقسم، محطة الإيقاف بباطن القدم لكرة زميل، محطة الركل لأبعد مسافة، مع التبديل والتسجيل.\n- الطالب: يؤدي مهمة المحطة ويعاون مجموعته.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: نشاط 4 (منافسات) ص 111: مباراة مصغرة بين مجموعتين بالتمرير بالركل والإيقاف، والتسجيل في هدف من الأقماع دون استخدام اليدين.\n- الطالب: يلعب ملتزمًا بالركل والإيقاف وقواعد المباراة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا نوقف الكرة قبل الركل في المباراة؟ ليستنتج التلاميذ أن الإيقاف يجعل التصويب أدق.\n- الطالب: يستنتج ويذكر مثالًا.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن الشعور.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): بأي جزء من القدم نركل الكرة؟\nالإجابة: بمقدمة القدم.\nس2 (المستوى المتوقع): كيف نوقف الكرة القادمة؟\nالإجابة: نضع باطن القدم فوق الكرة بلطف.\nس3 (المستوى المتقدم): لماذا تصل الكرة أبعد عندما نمرجح الرجل أكثر؟\nالإجابة: لأن المرجحة الأكبر تعطي الركلة قوة أكبر.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الهدف من محطة التصويب بين القمعين؟\nالإجابة: ركل الكرة بدقة لتمر بين القمعين.\nس2 (المستوى المتوقع): ماذا نستخدم لإيقاف الكرة في المباراة؟\nالإجابة: باطن القدم.\nس3 (المستوى المتقدم): لماذا لا نستخدم اليدين في مباراة اليوم؟\nالإجابة: لأن المهارة التي نتعلمها هي الركل والإيقاف بالقدم كما في كرة القدم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اركل الكرة الثابتة لتصل إلى القمع.\nالإجابة: يركل بمقدمة القدم في اتجاه القمع.\nس2 (المستوى المتوقع): أين تكون القدم المرتكزة عند الركل؟\nالإجابة: بجانب الكرة وثابتة.\nس3 (المستوى المتقدم): متى نستخدم ركلة خفيفة ومتى نستخدم ركلة قوية؟\nالإجابة: خفيفة للتمرير القريب والدقة، وقوية للهدف البعيد.\n\nالحصة 2:\nس1 (مستوى الدعم): اركل الكرة لتدخل في الصندوق المقسم.\nالإجابة: يصوب بدقة.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: محطة القمعين ومحطة الصندوق المقسم (أو الإيقاف، الركل لأبعد مسافة).\nس3 (المستوى المتقدم): كيف شعرت عندما مررت الكرة لزميلك وسجل هدفًا؟\nالإجابة: يعبر عن سعادته بالتعاون مع زميله.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على ركل كرة خفيفة نحو هدف وإيقافها بباطن القدم في مكان آمن (دليل المعلم ص 107-109).\n\nالحصة 2:\nإرشاد لولي الأمر: شارك طفلك مباراة مصغرة بالركل والإيقاف فقط دون استخدام اليدين، وراجعا النقاط الفنية في دليل المعلم ص 107-111."}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 60-112 (مهارات الوحدتين الثانية والثالثة)", "n": 2, "periods": [{"focus": "قياس أداء الحركات الأساسية (المشي والجري، الوثب والحجل، الثني والمد والمرجحة)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي المشي والجري في مسار محدد بالطريقة الصحيحة.\n2. يؤدي الوثب والحجل بهبوط آمن ضمن محطة القياس.\n3. يؤدي حركات الثني والمد والمرجحة عند النداء.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: حبال\n- أخرى: مراتب\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الحركات الأساسية\n- المحطة\n- الهبوط الآمن", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم أن حصة اليوم لقياس ما تعلمناه من حركات، ويعرض محطات القياس ويطمئن التلاميذ: نؤدي بهدوء وكل تلميذ يأخذ دوره.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم يشمل الحركات الأساسية التي ستقاس.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: قياس فردي في ثلاث محطات بينما تتدرب بقية المجموعات ذاتيًا في المحطات الأخرى: محطة 1 مشي على الخط ثم جري بين الأقماع، محطة 2 وثب فوق الحبل وحجل إلى الطوق، محطة 3 أداء ثني ومد ومرجحة بالنداء؛ ويرصد المعلم الأداء في الاستمارة.\n- الطالب: يؤدي المهارة عند دوره ويتدرب مستقلًا في انتظار الدور.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة ختامية سريعة (شمس وشمع) لتفريغ التوتر.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعزيز جميع التلاميذ.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما الحركة الصحيحة فوق الحبل؟\nالإجابة: الوثب بالقدمين معًا.\nس2 (المستوى المتوقع): كيف تهبط بعد الوثب؟\nالإجابة: على المشطين مع ثني الركبتين.\nس3 (المستوى المتقدم): ما الفرق بين المشي والجري في محطة القياس؟\nالإجابة: في الجري ترتفع القدمان عن الأرض وتزيد السرعة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الحجل من القمع إلى الطوق بقدم واحدة.\nالإجابة: يحجل بالقدم نفسها دون لمس الأرض بالأخرى.\nس2 (المستوى المتوقع): عند نداء (مرجحة) ماذا تفعل؟\nالإجابة: أمرجح الذراع أو الرجل أمامًا وخلفًا.\nس3 (المستوى المتقدم): لماذا نتدرب في المحطات الأخرى بهدوء أثناء القياس؟\nالإجابة: حتى يؤدي كل تلميذ قياسه بتركيز ولا نضيع الوقت.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك الحركات الأساسية (المشي، الجري، الوثب، الحجل) قبل حصة القياس الثانية (دليل المعلم ص 60-84)."}}, {"focus": "قياس أداء مهارات المعالجة والتناول (الدحرجة والالتقاط، الرمي والاستلام، الركل والإيقاف)", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي دحرجة الكرة والتقاطها بالطريقة الصحيحة.\n2. يؤدي رمي الكرة بكلتا اليدين واستلامها من زميل.\n3. يؤدي ركل الكرة وإيقافها بباطن القدم.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات متوسطة\n- أخرى: كرات قدم خفيفة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الدحرجة\n- الرمي والاستلام\n- الركل والإيقاف", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم محطات القياس الثلاث بنموذج سريع ويذكّر بالنقاط الفنية لكل مهارة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة بنموذج المعلم.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 دحرجة الكرة نحو الطوق والتقاط كرة قادمة، محطة 2 رمي الكرة لزميل من أمام الصدر واستلامها (5 مرات)، محطة 3 ركل الكرة بين قمعين وإيقاف كرة قادمة بباطن القدم؛ ويرصد المعلم في الاستمارة.\n- الطالب: يؤدي المهارة عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة ختامية (الكرة النارية).\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعزيز جميع التلاميذ وإعلان الإجازة القادمة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أين تكون الكفان عند التقاط الكرة المتدحرجة؟\nالإجابة: متواجهتين والأصابع منتشرة.\nس2 (المستوى المتوقع): من أين نرمي الكرة بكلتا اليدين؟\nالإجابة: من أمام الصدر.\nس3 (المستوى المتقدم): بأي جزء نوقف الكرة القادمة؟\nالإجابة: بباطن القدم.", "التقويم الختامي": "س1 (مستوى الدعم): دحرج الكرة لتدخل الطوق.\nالإجابة: يدحرج بدقة.\nس2 (المستوى المتوقع): ارمِ الكرة لزميلك 5 مرات واستلمها دون سقوط.\nالإجابة: يرمي ويستلم بالطريقة الصحيحة.\nس3 (المستوى المتقدم): ما المهارة التي أتقنتها أكثر اليوم ولماذا؟\nالإجابة: يذكر المهارة ويعلل بأنه تدرب عليها كثيرًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة الدحرجة والرمي والركل في العطلة في مكان آمن (دليل المعلم ص 88-112)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يؤدي المشي والجري في مسار محدد بالطريقة الصحيحة.\n2. يؤدي الوثب والحجل بهبوط آمن ضمن محطة القياس.\n3. يؤدي حركات الثني والمد والمرجحة عند النداء.\n\nالحصة 2:\n1. يؤدي دحرجة الكرة والتقاطها بالطريقة الصحيحة.\n2. يؤدي رمي الكرة بكلتا اليدين واستلامها من زميل.\n3. يؤدي ركل الكرة وإيقافها بباطن القدم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق علم ص 88-112)."}}, {"title": "الممارسات الصحية والنشاط الحر", "unit": "ختام الفصل الدراسي الأول", "week": "السابع عشر", "date": "27-30/12/2026", "pages": "دليل المعلم ص 19، 23", "n": 2, "periods": [{"focus": "الممارسات الصحية: النوم والراحة والنشاط البدني اليومي", "num": 1, "fields": {"المخرجات التعليمية": "1. يذكر أهمية النوم المبكر والراحة للجسم.\n2. يميز العادات اليومية الصحية من غير الصحية (النوم المبكر، اللعب في الهواء، الجلوس الطويل أمام الشاشة).\n3. يقدر أهمية ممارسة النشاط البدني يوميًا.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات صور العادات اليومية\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- النوم المبكر\n- الراحة\n- النشاط البدني اليومي\n- وقت الشاشة", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: من نام مبكرًا البارحة؟ وكيف تشعر صباحًا عندما تسهر؟ ويعرض صور طفل يلعب في الهواء وآخر أمام الشاشة لوقت طويل.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم البطاقات ويفكر بصوت عالٍ: النوم المبكر يريح الجسم وينمّيه، واللعب في الهواء ساعة يوميًا يقوي العضلات، والجلوس الطويل أمام الشاشة يضر العين والقوام، ويذكر برنامج (صحتي) ص 23.\n- الطالب: يستمع ويصنف البطاقات إلى عادات صحية وغير صحية.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (ساعة اليوم): يناديها المعلم (صباح: نستيقظ ونتمطى ونجري، ظهر: نمشي للمنزل، عصر: نلعب في الحديقة بالوثب، ليل: نهدأ وننام) ويؤدي التلاميذ الحركة المناسبة.\n- الطالب: يستجيب لكل وقت بالحركة المناسبة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تختار كل مجموعة ثلاث عادات صحية يومية وتعرضها بالحركة.\n- الطالب: يتعاون ويعرض العادات.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة اليوم: نم مبكرًا والعب في الهواء الطلق.\n- الطالب: يؤدي التهدئة ويكرر النصيحة.", "التقويم التكويني": "س1 (مستوى الدعم): لماذا ننام مبكرًا؟\nالإجابة: ليرتاح الجسم وينمو ونستيقظ نشيطين.\nس2 (المستوى المتوقع): كم من الوقت نلعب في الهواء يوميًا؟\nالإجابة: نحو ساعة.\nس3 (المستوى المتقدم): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: يتعب العين ويضعف القوام ويقلل الحركة.", "التقويم الختامي": "س1 (مستوى الدعم): أرفع صورة طفل يلعب في الحديقة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم، لأن اللعب في الهواء يقوي الجسم.\nس2 (المستوى المتوقع): اذكر عادة صحية تفعلها قبل النوم.\nالإجابة: غسل الأسنان أو النوم مبكرًا أو تجنب الشاشة.\nس3 (المستوى المتقدم): ماذا تفعل في وقت العصر في لعبة اليوم؟\nالإجابة: نلعب في الحديقة بالوثب.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ساعد طفلك على النوم المبكر وتحديد وقت الشاشة وتخصيص وقت للعب الحركي يوميًا في العطلة (برنامج صحتي، دليل المعلم ص 23)."}}, {"focus": "النشاط الحر: ألعاب من اختيار التلاميذ", "num": 2, "fields": {"المخرجات التعليمية": "1. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله من الأنشطة المقترحة.\n2. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n3. يتعاون مع أفراد مجموعته بقيادة القائد.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: صولجانات", "المفاهيم": "- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "يذكّر المعلم بما تعلمناه في الفصل كله ويعرض الأدوات المتاحة ويقول: اليوم تختار كل مجموعة لعبتها المفضلة (دليل المعلم ص 19).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تقسيم المجموعات (لا تقل عن أربعة) وتحديد قائد لكل مجموعة، وتحاور كل مجموعة لاختيار لعبة من الأنشطة المقترحة (ألعاب شعبية بسيطة، منافسات صغيرة، عروض تمرينات).\n- الطالب: يحاور مجموعته ويتفقون على اللعبة ويعدون الأدوات مع المعلم.\n\nالنشاط 3 (20 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تنفذ كل مجموعة لعبتها المختارة بإشراف المعلم مع تبديل القائد في منتصف الوقت، وتعزيز التعاون والالتزام بالسلامة.\n- الطالب: يلعب مع مجموعته ويلتزم بالقواعد ويتبادل القيادة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تعرض كل مجموعة لعبتها على الزملاء في دقيقة.\n- الطالب: يعرض ويشرح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن أجمل لحظة في الفصل الدراسي.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر اللعبة وسبب الاختيار.\nس2 (المستوى المتوقع): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس3 (المستوى المتقدم): لماذا نبدل القائد أثناء الحصة؟\nالإجابة: ليجرب الجميع القيادة والتنظيم.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة سلامة التزمتم بها في لعبتكم.\nالإجابة: عدم الدفع، أو المحافظة على المسافة، أو استخدام الأدوات بحذر.\nس2 (المستوى المتوقع): ما المهارة التي استخدمتها في لعبة اليوم؟\nالإجابة: يذكر مهارة مثل الجري أو الرمي أو الوثب.\nس3 (المستوى المتقدم): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر الحصة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية مع إخوته وأصدقائه في العطلة، ومراجعة مهارات الفصل الأول في دليل المعلم."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يذكر أهمية النوم المبكر والراحة للجسم.\n2. يميز العادات اليومية الصحية من غير الصحية (النوم المبكر، اللعب في الهواء، الجلوس الطويل أمام الشاشة).\n3. يقدر أهمية ممارسة النشاط البدني يوميًا.\n\nالحصة 2:\n1. يختار مع مجموعته نشاطًا حركيًا يناسب ميوله من الأنشطة المقترحة.\n2. يطبق قواعد الأمن والسلامة أثناء النشاط الحر.\n3. يتعاون مع أفراد مجموعته بقيادة القائد.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات صور العادات اليومية\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات متوسطة\n- أخرى: حبال\n- أخرى: صولجانات", "المفاهيم": "الحصة 1:\n- النوم المبكر\n- الراحة\n- النشاط البدني اليومي\n- وقت الشاشة\n\nالحصة 2:\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيسأل المعلم: من نام مبكرًا البارحة؟ وكيف تشعر صباحًا عندما تسهر؟ ويعرض صور طفل يلعب في الهواء وآخر أمام الشاشة لوقت طويل.\n\nالحصة 2:\nيذكّر المعلم بما تعلمناه في الفصل كله ويعرض الأدوات المتاحة ويقول: اليوم تختار كل مجموعة لعبتها المفضلة (دليل المعلم ص 19).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يعرض المعلم البطاقات ويفكر بصوت عالٍ: النوم المبكر يريح الجسم وينمّيه، واللعب في الهواء ساعة يوميًا يقوي العضلات، والجلوس الطويل أمام الشاشة يضر العين والقوام، ويذكر برنامج (صحتي) ص 23.\n- الطالب: يستمع ويصنف البطاقات إلى عادات صحية وغير صحية.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (ساعة اليوم): يناديها المعلم (صباح: نستيقظ ونتمطى ونجري، ظهر: نمشي للمنزل، عصر: نلعب في الحديقة بالوثب، ليل: نهدأ وننام) ويؤدي التلاميذ الحركة المناسبة.\n- الطالب: يستجيب لكل وقت بالحركة المناسبة.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: في مجموعات، تختار كل مجموعة ثلاث عادات صحية يومية وتعرضها بالحركة.\n- الطالب: يتعاون ويعرض العادات.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ونصيحة اليوم: نم مبكرًا والعب في الهواء الطلق.\n- الطالب: يؤدي التهدئة ويكرر النصيحة.\n\nالحصة 2:\nالنشاط 1 (6 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بنموذج المعلم.\n- الطالب: يقلد الإحماء.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تقسيم المجموعات (لا تقل عن أربعة) وتحديد قائد لكل مجموعة، وتحاور كل مجموعة لاختيار لعبة من الأنشطة المقترحة (ألعاب شعبية بسيطة، منافسات صغيرة، عروض تمرينات).\n- الطالب: يحاور مجموعته ويتفقون على اللعبة ويعدون الأدوات مع المعلم.\n\nالنشاط 3 (20 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: تنفذ كل مجموعة لعبتها المختارة بإشراف المعلم مع تبديل القائد في منتصف الوقت، وتعزيز التعاون والالتزام بالسلامة.\n- الطالب: يلعب مع مجموعته ويلتزم بالقواعد ويتبادل القيادة.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تعرض كل مجموعة لعبتها على الزملاء في دقيقة.\n- الطالب: يعرض ويشرح.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير عن أجمل لحظة في الفصل الدراسي.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): لماذا ننام مبكرًا؟\nالإجابة: ليرتاح الجسم وينمو ونستيقظ نشيطين.\nس2 (المستوى المتوقع): كم من الوقت نلعب في الهواء يوميًا؟\nالإجابة: نحو ساعة.\nس3 (المستوى المتقدم): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: يتعب العين ويضعف القوام ويقلل الحركة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر اللعبة وسبب الاختيار.\nس2 (المستوى المتوقع): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم اللعب ويوزع الأدوار ويحرص على السلامة.\nس3 (المستوى المتقدم): لماذا نبدل القائد أثناء الحصة؟\nالإجابة: ليجرب الجميع القيادة والتنظيم.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أرفع صورة طفل يلعب في الحديقة، أهي عادة صحية؟ ولماذا؟\nالإجابة: نعم، لأن اللعب في الهواء يقوي الجسم.\nس2 (المستوى المتوقع): اذكر عادة صحية تفعلها قبل النوم.\nالإجابة: غسل الأسنان أو النوم مبكرًا أو تجنب الشاشة.\nس3 (المستوى المتقدم): ماذا تفعل في وقت العصر في لعبة اليوم؟\nالإجابة: نلعب في الحديقة بالوثب.\n\nالحصة 2:\nس1 (مستوى الدعم): اذكر قاعدة سلامة التزمتم بها في لعبتكم.\nالإجابة: عدم الدفع، أو المحافظة على المسافة، أو استخدام الأدوات بحذر.\nس2 (المستوى المتوقع): ما المهارة التي استخدمتها في لعبة اليوم؟\nالإجابة: يذكر مهارة مثل الجري أو الرمي أو الوثب.\nس3 (المستوى المتقدم): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر الحصة ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ساعد طفلك على النوم المبكر وتحديد وقت الشاشة وتخصيص وقت للعب الحركي يوميًا في العطلة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على ممارسة الألعاب الشعبية والحركية مع إخوته وأصدقائه في العطلة، ومراجعة مهارات الفصل الأول في دليل المعلم."}}];
const FIELDS = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ المرجع: دليل المعلم للصف الأول.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
