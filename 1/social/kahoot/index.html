<meta charset="utf-8"><script src="/assets/pkgmode.js" data-role="page"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقات كاهوت - الهوية والمواطنة - الصف الأول</title>
<style>
@font-face{font-family:Baloo;src:url(/assets/f/424412b330ac36ae.woff2) format("woff2");font-weight:400 800}
:root{
 --bg:#F3F7FA;--surface:#fff;--ink:#23364A;--mute:#6A7B8C;--line:#DCE5EC;
 --teal:#5FA8A0;--amber:#E3A857;--good:#3E9B6E;--goodbg:#E3F4EA;--bad:#C46A5A;--badbg:#F8E6E2;
 --u1:#EAF3FB;--u1i:#2C5F8A;--u2:#FFF5DA;--u2i:#7A5C08;--u3:#F1ECF8;--u3i:#5A4589;
 --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:Baloo,"Segoe UI",Tahoma,sans-serif;color:var(--ink);font-size:18px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #8FB9D9;outline-offset:2px}
.screen{display:none;min-height:100vh;padding:18px clamp(12px,3vw,40px) 28px}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* setup */
.brand{display:flex;align-items:center;gap:14px;margin:0 auto 14px;max-width:1100px}
.brand .mark{width:54px;height:54px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:30px}
.brand h1{margin:0;font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800;line-height:1.2}
.brand p{margin:0;color:var(--mute)}
.steps{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.step h2{margin:0 0 10px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.step h2 .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#EEF4F8;border:1px solid var(--line);font-size:.95rem}
.step.locked{opacity:.45;pointer-events:none}
.units{display:grid;gap:10px}
.unit{border-radius:14px;padding:8px 10px;background:var(--ut)}
.unit .un{font-weight:700;color:var(--ui);font-size:.95rem;margin:0 4px 6px}
.lgrid{display:flex;flex-wrap:wrap;gap:8px}
.lbtn{background:#fff;border:1.5px solid transparent;border-radius:12px;padding:8px 16px;font-weight:700;color:var(--ui);box-shadow:0 0 0 1px rgba(35,54,74,.08)}
.lbtn[aria-pressed="true"]{border-color:var(--ui);background:#fff;box-shadow:0 0 0 3px rgba(35,54,74,.06)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#F5F8FB;border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600}
.chip[aria-pressed="true"]{background:#E6F2F1;border-color:var(--teal);color:#23564F}
.gcount{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.gcount button{width:48px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#F5F8FB;font-weight:800;font-size:1.1rem}
.gcount button[aria-pressed="true"]{background:#E6F2F1;border-color:var(--teal)}
.gnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.gname{display:flex;align-items:center;gap:8px;background:var(--gc);border-radius:12px;padding:6px 10px}
.gname span{font-size:1.4rem}
.gname input{flex:1;min-width:0;font:inherit;font-weight:700;border:0;background:rgba(255,255,255,.75);border-radius:8px;padding:5px 8px;color:var(--gi)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.lab{color:var(--mute);font-weight:600}
.counter{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.counter button{width:44px;height:42px;border:0;background:#F5F8FB;font-size:1.3rem;font-weight:800}
.counter output{min-width:56px;text-align:center;font-weight:800;font-size:1.25rem}
.start{display:block;margin:6px auto 0;max-width:1100px;width:100%;border:0;border-radius:16px;padding:14px;font-size:1.3rem;font-weight:800;background:#5FA8A0;color:#fff;transition:transform .15s,opacity .2s}
.start:disabled{opacity:.4;cursor:not-allowed}
.start:not(:disabled):hover{transform:translateY(-1px)}

/* play */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:0 auto 10px}
.top .meta{font-weight:700;color:var(--mute)}
.top .meta b{color:var(--ink)}
.tools{display:flex;gap:8px}
.icon{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:700}
.prog{max-width:1200px;margin:0 auto 12px;height:8px;background:#E3EBF1;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:9px;transition:width .5s ease}
.turn{max-width:1200px;margin:0 auto 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.turn .who{font-weight:800;font-size:1.15rem;padding:6px 16px;border-radius:999px;background:var(--gc);color:var(--gi)}
.turn .hint{color:var(--mute);font-weight:600}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{border:1.5px solid transparent;border-radius:999px;padding:4px 12px;background:var(--gc);color:var(--gi);font-weight:700;opacity:.55}
.gpick button[aria-pressed="true"]{opacity:1;border-color:var(--gi)}
.stage{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(170px,230px) 1fr;gap:16px;align-items:start}
.clock{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.ring{width:100%;max-width:180px;aspect-ratio:1;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:#E8EFF4;stroke-width:12}
.ring .fg{fill:none;stroke:var(--teal);stroke-width:12;stroke-linecap:round;transition:stroke .4s}
.ring.over .fg{stroke:var(--amber)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2.8rem;font-weight:800}
.ring .num small{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin-top:-14px}
.pts{margin-top:8px;font-weight:700;color:var(--mute)}
.pts b{display:block;font-size:1.8rem;color:var(--ink)}
.over-note{margin-top:4px;font-size:.9rem;color:#9A6B1E;font-weight:700;min-height:1.4em}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px clamp(14px,2.4vw,28px)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.badge{font-size:.9rem;font-weight:700;padding:3px 12px;border-radius:999px;background:#EEF4F8;color:#3D5870}
.say{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 14px;font-weight:700}
.qe{font-size:clamp(3rem,7vw,5rem);line-height:1.1;text-align:center;margin:4px 0}
.qt{font-size:clamp(1.5rem,3.1vw,2.5rem);font-weight:800;line-height:1.55;text-align:center;margin:6px 0 14px}
.blank{display:inline-block;min-width:4.2em;border-bottom:4px dashed #9DB6C9;margin:0 .2em;padding:0 .3em;color:#2D5D86;transition:all .3s}
.blank.filled{border-bottom-style:solid}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--ob);background:var(--oc);border-radius:16px;padding:14px 16px;font-weight:700;font-size:clamp(1.15rem,2.1vw,1.6rem);min-height:76px;transition:transform .15s,opacity .3s,background .3s,border-color .3s}
.ans:hover:not(:disabled){transform:translateY(-2px)}
.ans:disabled{cursor:default}
.ans .sh{flex:none;width:34px;height:34px}
.ans.dim{opacity:.38}
.ans.right{background:var(--goodbg);border-color:var(--good)}
.ans.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.answers.tf .ans{justify-content:center;font-size:clamp(1.4rem,2.6vw,2rem);min-height:96px}
.answers.fill{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.answers.fill .ans{justify-content:center}
.foot{max-width:1200px;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.skip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-weight:700;color:var(--mute)}
.verdict{font-weight:800;font-size:1.3rem;min-height:1.6em}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.next{border:0;border-radius:14px;padding:10px 22px;font-weight:800;font-size:1.1rem;background:#5FA8A0;color:#fff}
.float{direction:ltr;position:fixed;font-weight:800;font-size:2.4rem;color:var(--good);pointer-events:none;animation:up 1.2s ease forwards;z-index:5}
@keyframes up{from{opacity:0;transform:translateY(10px) scale(.9)}20%{opacity:1}to{opacity:0;transform:translateY(-70px) scale(1.05)}}
.wait{position:absolute;inset:0;background:rgba(255,255,255,.86);display:grid;place-items:center;border-radius:var(--r);font-weight:800;font-size:1.4rem;color:#3D5870;text-align:center;padding:10px}
.qwrap{position:relative}

/* board */
.btitle{max-width:1100px;margin:0 auto 4px;text-align:center}
.btitle h2{margin:0;font-size:clamp(1.4rem,2.6vw,2rem)}
.btitle p{margin:2px 0 0;color:var(--mute);font-weight:600;min-height:1.5em}
.towers{max-width:1100px;margin:16px auto 0;height:min(52vh,420px);display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2.4vw,28px);position:relative;border-bottom:3px solid #D5E0E8;padding:0 8px}
.tw{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.tw .sc{font-weight:800;font-size:clamp(1.1rem,2vw,1.5rem);margin-bottom:4px}
.tw .gain{font-weight:800;color:var(--good);font-size:1rem;min-height:1.4em}
.tw .col{width:100%;height:4%;background:var(--gc);border:2px solid var(--gb);border-bottom:0;border-radius:6px 6px 0 0;position:relative;transition:height 1s cubic-bezier(.22,.9,.3,1)}
.tw .col::before{content:"";position:absolute;left:-2px;right:-2px;top:-14px;height:14px;background:linear-gradient(90deg,var(--gb) 0 2px,var(--gc) 2px calc(100% - 2px),var(--gb) calc(100% - 2px));-webkit-mask:repeating-linear-gradient(90deg,#000 0 18px,transparent 18px 30px);mask:repeating-linear-gradient(90deg,#000 0 18px,transparent 18px 30px)}
.tw .rk{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--gb);display:grid;place-items:center;font-weight:800;color:var(--gi)}
.tw.win .col{box-shadow:0 0 0 4px rgba(95,168,160,.25),0 0 26px rgba(95,168,160,.45)}
.tw.win .star{opacity:1;transform:none}
.tw .star{position:absolute;top:-34px;font-size:1.6rem;opacity:0;transform:scale(.4);transition:all .5s .9s}
.names{max-width:1100px;margin:8px auto 0;display:flex;justify-content:center;gap:clamp(8px,2.4vw,28px);padding:0 8px}
.names div{flex:1;max-width:150px;text-align:center;font-weight:800;color:var(--gi);line-height:1.3}
.names div span{display:block;font-size:1.6rem}
.bnext{display:flex;justify-content:center;margin-top:18px}

/* final */
.podium{max-width:900px;margin:10px auto 0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,30px);height:min(50vh,400px)}
.pd{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pd .medal{font-size:3rem;line-height:1}
.pd .nm{font-weight:800;font-size:clamp(1.1rem,2vw,1.5rem);color:var(--gi);text-align:center}
.pd .ps{font-weight:700;color:var(--mute);margin-bottom:6px}
.pd .blk{width:100%;background:var(--gc);border:2px solid var(--gb);border-bottom:0;border-radius:8px 8px 0 0;height:0;transition:height 1.2s cubic-bezier(.22,.9,.3,1);position:relative;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:var(--gi)}
.pd .blk::before{content:"";position:absolute;left:-2px;right:-2px;top:-16px;height:16px;background:var(--gb);-webkit-mask:repeating-linear-gradient(90deg,#000 0 22px,transparent 22px 36px);mask:repeating-linear-gradient(90deg,#000 0 22px,transparent 22px 36px)}
.rest{max-width:700px;margin:16px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.rest div{background:var(--gc);color:var(--gi);border-radius:999px;padding:5px 14px;font-weight:700}
.factions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:4}

@media (max-width:760px){
 body{font-size:16px}
 .stage{grid-template-columns:1fr}
 .clock{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;text-align:right}
 .ring{max-width:110px}
 .ring .num{font-size:2rem}
 .answers{grid-template-columns:1fr}
 .towers{height:44vh}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== SETUP ===== -->
<section id="setup" class="screen on" aria-label="إعداد المسابقة">
 <div class="brand">
  <div class="mark" aria-hidden="true">🏰</div>
  <div><h1>مسابقات كاهوت</h1><p>الهوية والمواطنة - الصف الأول - الفصل الدراسي الأول</p></div>
 </div>
 <div class="steps">
  <div class="step" id="s1"><h2><span class="k">1</span>اختر الدرس</h2><div class="units" id="units"></div></div>
  <div class="step locked" id="s2"><h2><span class="k">2</span>اختر عنوان الحصة</h2><div class="chips" id="periods"></div></div>
  <div class="step locked" id="s3"><h2><span class="k">3</span>المجموعات</h2>
   <div class="gcount" id="gcount" role="group" aria-label="عدد المجموعات"></div>
   <div class="gnames" id="gnames"></div>
   <div class="row"><span class="lab">من يجيب؟</span>
    <div class="chips" role="group" aria-label="طريقة اختيار المجموعة">
     <button class="chip" id="mRot" aria-pressed="true">بالتناوب</button>
     <button class="chip" id="mTch" aria-pressed="false">يختارها المعلم</button>
    </div></div>
  </div>
  <div class="step locked" id="s4"><h2><span class="k">4</span>عدد الأسئلة</h2>
   <div class="row" style="margin-top:0">
    <div class="chips" id="quick"></div>
    <div class="counter"><button id="cMinus" aria-label="إنقاص">−</button><output id="cOut">10</output><button id="cPlus" aria-label="زيادة">+</button></div>
    <span class="lab" id="cNote"></span>
   </div>
  </div>
  <button class="start" id="startBtn" disabled>ابدأ المسابقة</button>
 </div>
</section>

<!-- ===== PLAY ===== -->
<section id="play" class="screen" aria-label="السؤال">
 <div class="top">
  <div class="meta" id="pMeta"></div>
  <div class="tools"><button class="icon" id="muteBtn" aria-label="كتم الصوت">🔈 الصوت</button><button class="icon" id="endBtn">إنهاء</button></div>
 </div>
 <div class="prog"><i id="progBar"></i></div>
 <div class="turn"><span class="who" id="who"></span><span class="hint" id="whoHint"></span><div class="gpick" id="gpick"></div></div>
 <div class="stage">
  <div class="clock">
   <div class="ring" id="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52"/></svg><div class="num"><div><span id="tNum">30</span><small>ثانية</small></div></div></div>
   <div><div class="pts">نقاط الإجابة الصحيحة الآن<b id="ptsNow">1000</b></div><div class="over-note" id="overNote"></div></div>
  </div>
  <div class="qwrap">
   <div class="qcard">
    <div class="qhead"><span class="badge" id="qType"></span><button class="say hidden" id="sayBtn">🔊 استمع</button></div>
    <div class="qe" id="qEmoji"></div>
    <div class="qt" id="qText"></div>
    <div class="answers" id="answers"></div>
   </div>
   <div class="wait hidden" id="waitPick">اختر المجموعة التي ستجيب ليبدأ المؤقت</div>
  </div>
 </div>
 <div class="foot"><button class="skip" id="skipBtn">لم تُجب المجموعة</button><div class="verdict" id="verdict" aria-live="polite"></div><button class="next hidden" id="toBoard">عرض الترتيب</button></div>
</section>

<!-- ===== BOARD ===== -->
<section id="board" class="screen" aria-label="الترتيب">
 <div class="btitle"><h2 id="bTitle"></h2><p id="bSub"></p></div>
 <div class="towers" id="towers"></div>
 <div class="names" id="names"></div>
 <div class="bnext"><button class="next" id="nextBtn">السؤال التالي</button></div>
</section>

<!-- ===== FINAL ===== -->
<section id="final" class="screen" aria-label="النتيجة النهائية">
 <div class="btitle"><h2>منصة التتويج</h2><p id="fSub"></p></div>
 <div class="podium" id="podium"></div>
 <div class="rest" id="rest"></div>
 <div class="factions"><button class="next" id="againBtn">إعادة الدرس نفسه</button><button class="icon" id="newBtn">مسابقة جديدة</button></div>
</section>

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function balanced(arr, k){
  const buckets = [1, 2, 3].map(d => shuffle(arr.filter(q => q.d === d)));
  const out = []; let i = 0;
  while (out.length < k && buckets.some(b => b.length)){ const b = buckets[i % 3]; if (b.length) out.push(b.shift()); i++; }
  return out;
}
function pickQuestions(){
  const all = BANK[S.lesson.id].map((q, i) => Object.assign({id:i}, q));
  const prim = all.filter(q => q.p === S.period), sec = all.filter(q => q.p !== S.period);
  let sel = S.count <= prim.length ? balanced(prim, S.count) : prim.concat(balanced(sec, S.count - prim.length));
  sel.sort((a, b) => a.d - b.d || ((a.p === S.period ? 0 : 1) - (b.p === S.period ? 0 : 1)));
  return sel;
}

function startGame(){
  ac(); readNames();
  S.groups = Array.from({length:S.gN}, (_, i) => ({name:S.names[i], e:GROUPS[i].e, c:GROUPS[i].c, b:GROUPS[i].b, i:GROUPS[i].i, score:0, gain:0}));
  S.qs = pickQuestions(); S.idx = 0; S.turn = 0;
  show('play'); loadQ();
}
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
function setWho(gi){
  S.turn = gi; const g = S.groups[gi], w = $('#who');
  w.textContent = 'تجيب الآن: مجموعة ' + g.name + ' ' + g.e; w.style.setProperty('--gc', g.c); w.style.setProperty('--gi', g.i);
  document.querySelectorAll('#gpick button').forEach((b, k) => b.setAttribute('aria-pressed', k === gi));
}
function loadQ(){
  const q = S.qs[S.idx]; S.cur = q; S.answered = false; S.lastTick = -1;
  q.shuffled = q.t === 'tf' ? null : shuffle(q.o);
  $('#pMeta').innerHTML = esc(S.lesson.title) + ' - الحصة ' + S.period + ' &nbsp;|&nbsp; <b>السؤال ' + (S.idx + 1) + ' من ' + S.qs.length + '</b>';
  $('#progBar').style.width = (S.idx / S.qs.length * 100) + '%';
  $('#qType').textContent = TYPE_NAME[q.t];
  $('#qEmoji').textContent = q.e || ''; $('#qEmoji').classList.toggle('hidden', !q.e);
  const qt = $('#qText');
  if (q.t === 'fill'){ const [a, b] = q.q.split('____'); qt.innerHTML = esc(a) + '<span class="blank" id="blank">&nbsp;</span>' + esc(b); }
  else qt.textContent = q.q;
  const box = $('#answers'); box.innerHTML = ''; box.className = 'answers ' + q.t;
  if (q.t === 'tf'){
    [['صواب ✓', true], ['خطأ ✗', false]].forEach(([lab, val], k) => {
      const b = el('button', 'ans', esc(lab)); const o = OPT[k === 0 ? 3 : 0]; b.style.setProperty('--oc', o.c); b.style.setProperty('--ob', o.b);
      b.dataset.val = val; b.onclick = () => answer(b, val === q.a); box.appendChild(b);
    });
  } else {
    q.shuffled.forEach((txt, k) => {
      const o = OPT[k % 4], b = el('button', 'ans', (q.t === 'mcq' ? o.sh : '') + '<span>' + esc(txt) + '</span>');
      b.style.setProperty('--oc', o.c); b.style.setProperty('--ob', o.b); b.dataset.val = txt;
      b.onclick = () => { if (q.t === 'fill'){ const bl = $('#blank'); bl.textContent = txt; bl.classList.add('filled'); } answer(b, txt === q.o[0]); };
      box.appendChild(b);
    });
  }
  // group selection
  const gp = $('#gpick'); gp.innerHTML = '';
  S.groups.forEach((g, k) => { const b = el('button', null, g.e + ' ' + esc(g.name)); b.style.setProperty('--gc', g.c); b.style.setProperty('--gi', g.i);
    b.onclick = () => { if (S.answered) return; SND.click(); setWho(k); if (!S.running) beginTimer(); }; gp.appendChild(b); });
  $('#verdict').textContent = ''; $('#verdict').className = 'verdict'; $('#toBoard').classList.add('hidden'); $('#skipBtn').disabled = false;
  resetClock();
  if (S.mode === 'rot'){ setWho(S.idx % S.groups.length); $('#whoHint').textContent = 'بالتناوب، ويمكن تغيير المجموعة بالضغط على اسمها'; $('#waitPick').classList.add('hidden'); beginTimer(); }
  else { $('#who').textContent = 'من سيجيب؟'; $('#who').style.setProperty('--gc', '#EEF4F8'); $('#who').style.setProperty('--gi', '#3D5870'); $('#whoHint').textContent = '';
    document.querySelectorAll('#gpick button').forEach(b => b.setAttribute('aria-pressed', false)); $('#waitPick').classList.remove('hidden'); $('#skipBtn').disabled = true; S.running = false; }
}
function pointsAt(t){
  let p;
  if (t <= T) p = MAXP - (MAXP - MIDP) * (t / T);
  else p = Math.max(MINP, MIDP - (MIDP - MINP) * ((t - T) / OVER));
  return Math.round(p / 10) * 10;
}
const CIRC = 2 * Math.PI * 52;
function resetClock(){ cancelAnimationFrame(S.raf); S.running = false; $('#ringFg').style.strokeDasharray = CIRC; $('#ringFg').style.strokeDashoffset = 0; $('#tNum').textContent = T; $('#ptsNow').textContent = MAXP; $('#ring').classList.remove('over'); $('#overNote').textContent = ''; }
function beginTimer(){ $('#waitPick').classList.add('hidden'); $('#skipBtn').disabled = false; S.t0 = performance.now(); S.running = true; cancelAnimationFrame(S.raf); S.raf = requestAnimationFrame(frame); }
function frame(now){
  if (!S.running) return;
  const t = (now - S.t0) / 1000;
  if (t <= T){
    const left = Math.ceil(T - t); $('#tNum').textContent = left;
    $('#ringFg').style.strokeDashoffset = CIRC * (t / T);
    if (left <= 5 && left !== S.lastTick && left > 0){ S.lastTick = left; SND.tick(); }
  } else {
    if (!$('#ring').classList.contains('over')){ $('#ring').classList.add('over'); SND.over(); $('#overNote').textContent = 'وقت إضافي: النقاط تتناقص تدريجيًا'; }
    const o = t - T; $('#tNum').textContent = '+' + Math.floor(o);
    $('#ringFg').style.strokeDashoffset = CIRC * Math.min(1, o / OVER);
  }
  $('#ptsNow').textContent = pointsAt(t);
  S.raf = requestAnimationFrame(frame);
}
function answer(btn, ok){
  if (S.answered || !S.running) return;
  S.answered = true; S.running = false; cancelAnimationFrame(S.raf);
  const t = (performance.now() - S.t0) / 1000, pts = ok ? pointsAt(t) : 0;
  S.prevScores = S.groups.map(g => g.score); S.groups.forEach(g => g.gain = 0);
  const g = S.groups[S.turn]; g.score += pts; g.gain = pts; S.winner = ok ? S.turn : -1;
  document.querySelectorAll('#answers .ans').forEach(b => {
    b.disabled = true;
    const isRight = S.cur.t === 'tf' ? (String(S.cur.a) === b.dataset.val) : (b.dataset.val === S.cur.o[0]);
    if (isRight) b.classList.add('right'); else if (b !== btn) b.classList.add('dim');
  });
  if (!ok && btn) btn.classList.add('wrong');
  if (!ok && S.cur.t === 'fill' && btn){ const bl = $('#blank'); setTimeout(() => { bl.textContent = S.cur.o[0]; }, 700); }
  const v = $('#verdict');
  if (ok){ v.textContent = 'إجابة صحيحة! +' + pts + ' لمجموعة ' + g.name; v.className = 'verdict ok'; SND.good(); floatPts(btn, '+' + pts); }
  else { v.textContent = btn ? 'ليست الإجابة الصحيحة، والصحيح مظلل بالأخضر' : 'لم تُجب المجموعة، والصحيح مظلل بالأخضر'; v.className = 'verdict no'; SND.bad(); }
  $('#skipBtn').disabled = true; $('#toBoard').classList.remove('hidden');
  $('#progBar').style.width = ((S.idx + 1) / S.qs.length * 100) + '%';
  clearTimeout(S.autoT); S.autoT = setTimeout(() => { if ($('#play').classList.contains('on') && S.answered) showBoard(); }, 2600);
}
function floatPts(anchor, txt){
  const r = (anchor || $('#qText')).getBoundingClientRect(), f = el('div', 'float', txt);
  f.style.left = (r.left + r.width / 2 - 50) + 'px'; f.style.top = (r.top - 10) + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1300);
}
$('#skipBtn').onclick = () => { if (!S.running || S.answered) return; answer(null, false); };
$('#toBoard').onclick = () => { clearTimeout(S.autoT); showBoard(); };

/* ---------- board ---------- */
function rankOf(scores, k){ return 1 + scores.filter(v => v > scores[k]).length; }
function ranked(scores){ return S.groups.map((g, k) => k).sort((a, b) => scores[b] - scores[a] || a - b); }
function showBoard(){
  clearTimeout(S.autoT); show('board'); SND.board();
  const last = S.idx === S.qs.length - 1;
  $('#bTitle').textContent = 'الترتيب بعد السؤال ' + (S.idx + 1) + ' من ' + S.qs.length;
  $('#bSub').textContent = S.winner >= 0 ? ('فائز السؤال: مجموعة ' + S.groups[S.winner].name + ' (+' + S.groups[S.winner].gain + ')') : 'لم تُحتسب نقاط في هذا السؤال';
  $('#nextBtn').textContent = last ? 'النتيجة النهائية' : 'السؤال التالي';
  const tw = $('#towers'), nm = $('#names'); tw.innerHTML = ''; nm.innerHTML = '';
  const before = ranked(S.prevScores), after = ranked(S.groups.map(g => g.score));
  const max = Math.max(1, ...S.groups.map(g => g.score));
  const nodes = {};
  before.forEach((k, pos) => {
    const g = S.groups[k], d = el('div', 'tw'); d.style.setProperty('--gc', g.c); d.style.setProperty('--gb', g.b); d.style.setProperty('--gi', g.i);
    d.innerHTML = '<div class="star" aria-hidden="true">⭐</div><div class="gain">' + (g.gain ? '+' + g.gain : '') + '</div><div class="sc">' + S.prevScores[k] + '</div><div class="col" style="height:' + Math.max(12, S.prevScores[k] / max * 82) + '%"><div class="rk">' + rankOf(S.prevScores, k) + '</div></div>';
    tw.appendChild(d); nodes[k] = d;
    const n = el('div', null, '<span>' + g.e + '</span>' + esc(g.name)); n.style.setProperty('--gi', g.i); nm.appendChild(n); n.dataset.k = k;
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    S.groups.forEach((g, k) => { const d = nodes[k]; d.querySelector('.col').style.height = Math.max(12, g.score / max * 82) + '%'; countUp(d.querySelector('.sc'), S.prevScores[k], g.score); if (k === S.winner) d.classList.add('win'); });
    setTimeout(() => reorder(tw, nm, nodes, after), 1100);
  }));
}
function countUp(elm, a, b){ const t0 = performance.now(), d = 900; (function st(now){ const p = Math.min(1, (now - t0) / d); elm.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(st); })(t0); }
function reorder(tw, nm, nodes, order){
  const first = {}; order.forEach(k => first[k] = nodes[k].getBoundingClientRect().left);
  const nmap = {}; nm.querySelectorAll('div').forEach(n => nmap[n.dataset.k] = n);
  const nfirst = {}; order.forEach(k => nfirst[k] = nmap[k].getBoundingClientRect().left);
  const sc = S.groups.map(g => g.score); order.forEach(k => { tw.appendChild(nodes[k]); nm.appendChild(nmap[k]); nodes[k].querySelector('.rk').textContent = rankOf(sc, k); });
  order.forEach(k => {
    [[nodes[k], first[k]], [nmap[k], nfirst[k]]].forEach(([n, f]) => {
      const dx = f - n.getBoundingClientRect().left; if (!dx) return;
      n.style.transition = 'none'; n.style.transform = 'translateX(' + dx + 'px)';
      requestAnimationFrame(() => { n.style.transition = 'transform .7s cubic-bezier(.22,.9,.3,1)'; n.style.transform = ''; });
    });
  });
}
$('#nextBtn').onclick = () => { SND.click(); if (S.idx < S.qs.length - 1){ S.idx++; show('play'); loadQ(); } else showFinal(); };
document.addEventListener('keydown', e => {
  if ($('#board').classList.contains('on') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); $('#nextBtn').click(); }
  if ($('#play').classList.contains('on') && !S.answered && /^[1-4]$/.test(e.key)){ const b = document.querySelectorAll('#answers .ans')[+e.key - 1]; if (b) b.click(); }
});

/* ---------- final ---------- */
function showFinal(){
  S.running = false; cancelAnimationFrame(S.raf); clearTimeout(S.autoT); show('final'); SND.final();
  const order = ranked(S.groups.map(g => g.score)), max = Math.max(1, S.groups[order[0]].score);
  $('#fSub').textContent = S.lesson.title + ' - ' + qWord(S.qs.length);
  const pod = $('#podium'); pod.innerHTML = '';
  const slots = [[1, 72], [0, 100], [2, 52]], MED = ['🥇', '🥈', '🥉'], fs = S.groups.map(g => g.score);
  slots.forEach(([r, h]) => {
    const k = order[r]; if (k === undefined) return; const g = S.groups[k], rk = rankOf(fs, k), m = MED[Math.min(rk, 3) - 1];
    const d = el('div', 'pd'); d.style.setProperty('--gc', g.c); d.style.setProperty('--gb', g.b); d.style.setProperty('--gi', g.i);
    d.innerHTML = '<div class="medal">' + m + '</div><div class="nm">' + g.e + ' ' + esc(g.name) + '</div><div class="ps">' + g.score + ' نقطة</div><div class="blk">' + rk + '</div>';
    pod.appendChild(d); setTimeout(() => { d.querySelector('.blk').style.height = (h * 0.62) + '%'; }, 150 + r * 250);
  });
  const rest = $('#rest'); rest.innerHTML = '';
  order.slice(3).forEach((k, i) => { const g = S.groups[k], d = el('div', null, 'المركز ' + rankOf(fs, k) + ': ' + g.e + ' ' + esc(g.name) + ' (' + g.score + ')'); d.style.setProperty('--gc', g.c); d.style.setProperty('--gi', g.i); rest.appendChild(d); });
  confetti();
}
$('#endBtn').onclick = () => { if (confirm('إنهاء المسابقة وعرض النتيجة النهائية؟')) showFinal(); };
$('#againBtn').onclick = () => { stopConf(); startGame(); };
$('#newBtn').onclick = () => { stopConf(); show('setup'); };
$('#muteBtn').onclick = () => { S.muted = !S.muted; $('#muteBtn').textContent = S.muted ? '🔇 مكتوم' : '🔈 الصوت'; $('#muteBtn').setAttribute('aria-label', S.muted ? 'تشغيل الصوت' : 'كتم الصوت'); if (S.muted && 'speechSynthesis' in window) speechSynthesis.cancel(); };
$('#sayBtn').onclick = speak;

/* ---------- calm confetti ---------- */
let confRaf = 0;
function stopConf(){ cancelAnimationFrame(confRaf); const c = $('#conf'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
function confetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#conf'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#8CC6A4', '#DDB879', '#DDA392', '#8FB7DC', '#D7A0BF', '#B3A5DB'];
  const P = Array.from({length:70}, () => ({x:Math.random() * c.width, y:-20 - Math.random() * c.height * .6, r:4 + Math.random() * 5, v:.6 + Math.random() * 1.1, s:Math.random() * 6, w:.02 + Math.random() * .03, c:cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
  (function st(now){
    x.clearRect(0, 0, c.width, c.height); const age = (now - t0) / 1000, fade = Math.max(0, 1 - Math.max(0, age - 6) / 2);
    P.forEach(p => { p.y += p.v; p.s += p.w; p.x += Math.sin(p.s) * .6; x.globalAlpha = .8 * fade; x.fillStyle = p.c; x.beginPath(); x.ellipse(p.x, p.y, p.r, p.r * .6, p.s, 0, Math.PI * 2); x.fill(); if (p.y > c.height + 10) p.y = -10; });
    if (fade > 0) confRaf = requestAnimationFrame(st); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}

buildSetup();
</script>
