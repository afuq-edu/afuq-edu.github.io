<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap">
<style>/* Layout: fixed 1280×720 classroom stage scaled to the screen; top bar = lesson + phase, bottom bar = navigation & tools */
:root{
  --sand:#FBF3E4; --sand2:#F4E6CC; --paper:#FFFDF8; --ink:#2B2340; --ink2:#5B5270;
  --red:#D3202F; --green:#0E8A4B; --sea:#1E88C8; --saffron:#F5B400; --plum:#8E4FA0; --orange:#EF6A2B;
  --ok:#1FA45B; --bad:#E0473A; --line:#E7D7B8;
  --u:#D3202F; --u2:#0E8A4B; /* unit colors, set per lesson */
  --f-display:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;
  --f-read:"Noto Naskh Arabic","Amiri",Tahoma,serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#1d1830;overflow:hidden}
body{font-family:var(--f-display);color:var(--ink);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--saffron);outline-offset:2px}
#app{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--sand);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0007;
  background-image:radial-gradient(circle at 1px 1px,#e9d9bb 1.2px,transparent 1.4px);background-size:26px 26px}
/* ---------- top bar ---------- */
.topbar{position:absolute;inset:0 0 auto 0;height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--u);color:#fff;z-index:5}
.topbar .lt{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.topbar .ut{font-size:15px;opacity:.85;white-space:nowrap}
.phase{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:30px;padding:4px 14px 4px 6px;font-weight:800;font-size:17px}
.phase i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:17px;color:#fff}
.teams{display:flex;gap:6px}
.team{display:flex;align-items:center;gap:4px;background:#ffffff26;border-radius:20px;padding:3px 10px 3px 6px;font-size:15px;font-weight:700;color:#fff;transition:transform .2s}
.team b{background:#fff;color:var(--ink);border-radius:12px;min-width:28px;text-align:center;padding:0 6px}
.team.pop{transform:scale(1.25)}
/* ---------- bottom bar ---------- */
.botbar{position:absolute;inset:auto 0 0 0;height:62px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--paper);border-top:3px solid var(--line);z-index:5}
.nb{height:44px;min-width:44px;padding:0 14px;border-radius:14px;background:var(--sand2);font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;transition:transform .1s}
.nb:hover{background:#efdcb6}.nb:active{transform:scale(.94)}
.nb.main{background:var(--u);color:#fff;font-size:19px;padding:0 22px}
.nb.on{background:var(--ink);color:#fff}
.prog{flex:1;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.prog span{height:10px;flex:1;max-width:34px;border-radius:6px;background:#e9dcc3;cursor:pointer}
.prog span.done{background:color-mix(in srgb,var(--u) 45%,#fff)}
.prog span.cur{background:var(--u);height:14px}
.count{font-size:16px;color:var(--ink2);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
/* ---------- slide body ---------- */
.slide{position:absolute;inset:58px 0 62px 0;padding:22px 40px;display:flex;flex-direction:column;gap:14px;animation:slin .45s ease}
@keyframes slin{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.st{font-size:40px;font-weight:800;margin:0;line-height:1.25;text-wrap:balance;display:flex;align-items:center;gap:14px}
.st small{font-size:20px;font-weight:700;color:var(--ink2)}
.lead{font-size:24px;margin:0;color:var(--ink2);font-weight:600}
.grow{flex:1;min-height:0;display:flex;gap:22px;align-items:stretch}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;gap:12px}
.em{display:inline-block;line-height:1}
.scene-row{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:12px 20px;font-size:24px;font-weight:700;position:relative;max-width:420px;font-family:var(--f-read)}
.bubble::after{content:"";position:absolute;bottom:-14px;right:40px;border:12px solid transparent;border-top-color:var(--ink);border-bottom:0}
.read{font-family:var(--f-read);font-size:30px;line-height:2;font-weight:500}
.read b,.k{color:var(--u);font-weight:700}
.card{background:var(--paper);border-radius:22px;border:3px solid var(--line);padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:4px 14px;font-weight:700;font-size:18px;background:var(--sand2)}
.btn{background:var(--u);color:#fff;font-size:22px;font-weight:800;border-radius:18px;padding:10px 26px;box-shadow:0 5px 0 #0003;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
.btn.alt{background:var(--paper);color:var(--ink);border:3px solid var(--line)}
.btn.small{font-size:18px;padding:6px 16px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.bounce{animation:bounce .5s}
@keyframes bounce{40%{transform:scale(1.15)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.wave{animation:wave 2.4s ease-in-out infinite;transform-origin:left center}
@keyframes wave{50%{transform:skewY(-3deg) scaleX(.97)}}
/* ---------- cover ---------- */
.cover{align-items:center;justify-content:center;text-align:center;gap:10px}
.cover .chip{background:var(--u);color:#fff;border-radius:30px;padding:6px 22px;font-size:22px;font-weight:800}
.cover h1{font-size:76px;margin:0;line-height:1.15;color:var(--ink);text-wrap:balance}
.cover .sub{font-size:26px;color:var(--ink2);font-weight:600}
.cover .art{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:4px}
.asks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.asks span{background:#fff;border:3px dashed var(--u);border-radius:18px;padding:6px 16px;font-size:22px;font-weight:700;font-family:var(--f-read)}
/* ---------- goals ---------- */
.goals{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;flex:1;min-height:0}
.goals .center svg{max-height:150px;width:auto}
.goals>.col{min-height:0;overflow:hidden}
.goals ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.goals li{display:flex;gap:12px;align-items:flex-start;font-size:24px;font-weight:600;font-family:var(--f-read);line-height:1.5}
.goals li i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;font-family:var(--f-display);margin-top:4px}
.gbox h3{margin:0 0 8px;font-size:24px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{border-radius:14px;padding:4px 14px;font-size:20px;font-weight:700}
/* ---------- story ---------- */
.story{display:grid;grid-template-columns:1fr 1.15fr;gap:26px;flex:1;min-height:0;align-items:center}
.story .scene{height:100%;max-height:520px;border-radius:26px;background:linear-gradient(#DDF0FB,#FFF6E3);display:flex;align-items:flex-end;justify-content:center;padding:14px;position:relative;overflow:hidden;border:3px solid var(--line)}
.story .txt{background:var(--paper);border-radius:26px;padding:20px 28px;border:3px solid var(--line);position:relative}
.speak{position:absolute;top:-22px;left:22px;background:var(--saffron);color:var(--ink);border-radius:30px;padding:6px 16px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #0002}
.speak.on{background:var(--ink);color:#fff}
.ask{margin-top:10px;padding:10px 16px;border-radius:16px;background:#fff4d6;font-size:22px;font-weight:700}
.ask summary{cursor:pointer}
/* ---------- concept cards ---------- */
.cards{display:grid;gap:16px;flex:1;min-height:0;align-content:center}
.ccard{background:var(--paper);border-radius:24px;border:3px solid var(--line);padding:16px 14px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:230px;position:relative;perspective:800px;transition:transform .2s}
.ccard .t{font-size:34px;font-weight:800;line-height:1.3}
.ccard .d{font-size:25px;font-weight:600;color:var(--ink2);font-family:var(--f-read);line-height:1.6}
.ccard.flip .d{display:none}.ccard.flip.open .d{display:block;animation:slin .3s}
.ccard.flip:not(.open)::after{content:"اضغط لتكتشف";position:absolute;bottom:8px;font-size:14px;color:var(--ink2);opacity:.7}
.ccard.flip{cursor:pointer}.ccard.flip:hover{transform:translateY(-4px)}
.ccard.open{border-color:var(--u)}
/* ---------- quiz ---------- */
.quiz{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.qhead{display:flex;align-items:center;gap:14px}
.qnum{background:var(--u);color:#fff;border-radius:14px;padding:4px 14px;font-size:18px;font-weight:800;white-space:nowrap}
.qq{font-size:32px;font-weight:800;font-family:var(--f-read);line-height:1.5}
.qscene{display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:0}
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:12px;font-size:26px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:120px;justify-content:center;transition:transform .12s, border-color .2s}
.opt:hover{transform:translateY(-3px);border-color:var(--u)}
.opt .oi{font-size:60px;line-height:1}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.qbody .qscene{align-self:center}
.qbody .opts{grid-template-columns:repeat(2,1fr)}
.opt.ok{background:#E3F7EA;border-color:var(--ok)}
.opt.no{background:#FDE7E4;border-color:var(--bad);opacity:.7}
.why{font-size:22px;font-weight:700;background:#E3F7EA;border-radius:16px;padding:10px 16px;font-family:var(--f-read);display:flex;gap:12px;align-items:center}
.qend{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.qend .stars{font-size:64px;letter-spacing:6px}
/* ---------- true/false ---------- */
.tf{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.tfrow{display:flex;align-items:center;gap:16px;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 16px}
.tfrow .t{flex:1;font-size:26px;font-weight:700;font-family:var(--f-read)}
.tfrow .e{font-size:40px}
.tfb{width:64px;height:56px;border-radius:16px;font-size:30px;font-weight:900;background:var(--sand2)}
.tfrow.ok{border-color:var(--ok);background:#E3F7EA}.tfrow.ok .tfb{opacity:.35}.tfrow.ok .tfb.sel{opacity:1;background:var(--ok);color:#fff}
/* ---------- match ---------- */
.match{display:grid;grid-template-columns:1fr 120px 1fr;flex:1;min-height:0;align-items:center}
.mcol{display:flex;flex-direction:column;gap:12px}
.mi{background:var(--paper);border:4px solid var(--line);border-radius:20px;padding:10px 14px;font-size:24px;font-weight:800;display:flex;align-items:center;gap:12px;min-height:72px;transition:transform .12s}
.mi .e{font-size:40px;line-height:1}
.mi:hover{transform:scale(1.03)}
.mi.sel{border-color:var(--saffron);background:#FFF5D1;transform:scale(1.04)}
.mi.done{color:#fff;border-color:transparent}
.mi.done .n{background:#fff;color:var(--ink);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:18px;margin-inline-start:auto}
.mid{display:flex;align-items:center;justify-content:center;font-size:56px;opacity:.5}
/* ---------- sort ---------- */
.sort{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;padding:8px;border-radius:20px;background:#ffffff80;border:3px dashed var(--line)}
.chip{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:8px 14px;font-size:22px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:transform .12s;font-family:var(--f-display)}
.chip .e{font-size:30px;line-height:1}
.chip.sel{border-color:var(--saffron);background:#FFF5D1;transform:scale(1.08) rotate(-2deg)}
.bins{display:grid;gap:16px;flex:1;min-height:0}
.bin{border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px;border:4px solid;min-height:0;overflow:auto;cursor:pointer;transition:transform .12s}
.bin:hover{transform:translateY(-2px)}
.bin h4{margin:0;font-size:26px;display:flex;align-items:center;gap:8px;justify-content:center}
.bin .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bin .chip{font-size:19px;padding:5px 10px;cursor:default}
.hint{font-size:18px;color:var(--ink2);text-align:center;font-weight:600}
/* ---------- wheel ---------- */
.wheelwrap{display:grid;grid-template-columns:auto 1fr;gap:30px;flex:1;align-items:center}
.wheel{position:relative;width:470px;height:470px}
.wheel canvas{width:100%;height:100%}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border:22px solid transparent;border-top:40px solid var(--ink);z-index:2}
.wheel .hub{position:absolute;inset:0;margin:auto;width:92px;height:92px;border-radius:50%;background:var(--paper);border:5px solid var(--ink);display:grid;place-items:center;font-size:20px;font-weight:900}
.wres{background:var(--paper);border-radius:26px;border:4px solid var(--u);padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.wres .big{font-size:46px;font-weight:900;color:var(--u);font-family:var(--f-read)}
.wres .pr{font-size:26px;font-weight:700;font-family:var(--f-read)}
/* ---------- memory ---------- */
.mem{display:grid;gap:14px;flex:1;min-height:0;align-content:center}
.mc{height:130px;border-radius:20px;position:relative;perspective:700px}
.mc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mc.open .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:24px;font-weight:800;text-align:center;padding:6px}
.mc .f{background:var(--u);color:#fff;font-size:44px;background-image:radial-gradient(circle at 1px 1px,#fff4 2px,transparent 2px);background-size:16px 16px}
.mc .b{background:var(--paper);border:4px solid var(--line);transform:rotateY(180deg)}
.mc .b .e{font-size:46px;line-height:1.1}
.mc.got .b{border-color:var(--ok);background:#E3F7EA}
/* ---------- reveal tiles ---------- */
.reveal{position:relative;flex:1;border-radius:26px;overflow:hidden;border:4px solid var(--line);background:linear-gradient(#DDF0FB,#FFF6E3)}
.reveal .under{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:14px}
.reveal .tiles{position:absolute;inset:0;display:grid}
.tile{background:var(--u);border:2px solid #fff6;color:#fff;font-size:40px;font-weight:900;transition:opacity .4s, transform .4s}
.tile:nth-child(odd){background:color-mix(in srgb,var(--u) 80%,#000)}
.tile.gone{opacity:0;transform:scale(.4) rotate(20deg);pointer-events:none}
/* ---------- odd one ---------- */
.odd{flex:1;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center}
.oddrow{display:flex;gap:18px}
.oddrow button{width:150px;height:150px;border-radius:26px;background:var(--paper);border:4px solid var(--line);font-size:84px;line-height:1;transition:transform .12s}
.oddrow button:hover{transform:scale(1.06)}
.oddrow button.ok{border-color:var(--ok);background:#E3F7EA}
/* ---------- breath ---------- */
.breath{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.ball{width:300px;height:300px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),var(--sea);display:grid;place-items:center;color:#fff;font-size:44px;font-weight:900;transition:transform 3s ease-in-out;transform:scale(.55)}
.ball.in{transform:scale(1)}
.fingers{display:flex;gap:10px;justify-content:center}
.fingers span{width:64px;height:64px;border-radius:18px;background:var(--sand2);display:grid;place-items:center;font-size:30px;font-weight:900;transition:all .3s}
.fingers span.on{background:var(--saffron);transform:scale(1.15)}
/* ---------- draw ---------- */
.draw{flex:1;display:flex;gap:14px;min-height:0}
.pads{flex:1;display:grid;gap:14px;min-height:0}
.pad{position:relative;background:#fff;border-radius:22px;border:4px solid var(--line);overflow:hidden;min-height:0}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad .tpl{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:.9}
.pad .lbl{position:absolute;top:8px;right:12px;background:var(--u);color:#fff;border-radius:14px;padding:2px 14px;font-size:20px;font-weight:800;pointer-events:none}
.tools{display:flex;flex-direction:column;gap:8px;align-items:center}
.sw{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 4px var(--ink)}
/* ---------- id card ---------- */
.idwrap{display:grid;grid-template-columns:1fr 1.05fr;gap:24px;flex:1;min-height:0}
.form{display:flex;flex-direction:column;gap:10px;overflow:auto}
.form label{font-size:20px;font-weight:800}
.form input{font-family:var(--f-read);font-size:24px;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{font-size:19px;padding:5px 10px}
.chips .chip.on{background:var(--u);color:#fff;border-color:var(--u)}
.idcard{border-radius:28px;background:linear-gradient(135deg,#E6F4FD,#FFFFFF 60%);border:5px solid var(--sea);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;align-self:center}
.idcard .hd{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900;color:var(--sea)}
.idcard .bd{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.idcard .ph{background:#fff;border-radius:20px;border:3px dashed var(--sea);height:190px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.idcard .rw{font-size:23px;font-weight:700;font-family:var(--f-read);border-bottom:2px dotted #bcd;padding:2px 0}
.idcard .rw span{color:var(--ink2);font-family:var(--f-display);font-size:18px;margin-inline-end:8px}
.stamp{position:absolute;left:18px;bottom:16px;transform:rotate(-12deg);border:4px solid var(--red);color:var(--red);border-radius:14px;padding:2px 12px;font-size:24px;font-weight:900;background:#fff8}
/* ---------- colorlike ---------- */
.likes{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;flex:1;align-content:center}
.likes button{background:var(--paper);border:4px solid var(--line);border-radius:24px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:20px;font-weight:800}
.likes button .e{font-size:66px;line-height:1;filter:grayscale(1) contrast(.5) brightness(1.4);transition:filter .3s}
.likes button.on{border-color:var(--u);background:#fff}
.likes button.on .e{filter:none;animation:bounce .5s}
/* ---------- deck ---------- */
.deck{flex:1;display:flex;align-items:center;justify-content:center;gap:40px}
.bigcard{width:520px;height:340px;border-radius:30px;background:var(--paper);border:5px solid var(--u);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;box-shadow:12px 12px 0 color-mix(in srgb,var(--u) 30%,transparent)}
.bigcard .e{font-size:110px;line-height:1}
.bigcard .t{font-size:34px;font-weight:800;font-family:var(--f-read);line-height:1.5}

<script>
/* ============ ART: original SVG characters, faces, buildings, flag ============ */
const SKIN = ['#F3CDA4', '#E9B98E', '#D9A274', '#C68B5E'];
let _uid = 0;
const uid = p => (p || 'u') + (++_uid);

function mouth(mood, cx, cy, s) {
  s = s || 1;
  const w = 9 * s;
  switch (mood) {
    case 'sad': return `<path d="M${cx - w} ${cy + 4} Q${cx} ${cy - 5} ${cx + w} ${cy + 4}" stroke="#5a2a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    case 'angry': return `<rect x="${cx - w}" y="${cy - 3}" width="${2 * w}" height="8" rx="3" fill="#fff" stroke="#5a2a1a" stroke-width="2.2"/><path d="M${cx - w + 2} ${cy + 1}H${cx + w - 2}" stroke="#bbb" stroke-width="1.2"/>`;
    case 'scared': return `<ellipse cx="${cx}" cy="${cy + 1}" rx="${5 * s}" ry="${6.5 * s}" fill="#7a2b23" stroke="#5a2a1a" stroke-width="2"/>`;
    case 'think': return `<path d="M${cx - 6} ${cy + 1} Q${cx + 2} ${cy + 4} ${cx + 8} ${cy - 1}" stroke="#5a2a1a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    case 'wow': return `<ellipse cx="${cx}" cy="${cy + 1}" rx="${4.5 * s}" ry="${5 * s}" fill="#7a2b23"/>`;
    default: return `<path d="M${cx - w} ${cy - 2} Q${cx} ${cy + 10} ${cx + w} ${cy - 2} Z" fill="#8c2b25" stroke="#5a2a1a" stroke-width="2" stroke-linejoin="round"/><path d="M${cx - w + 3} ${cy + 1} Q${cx} ${cy + 4} ${cx + w - 3} ${cy + 1}" fill="#fff"/>`;
  }
}
function eyes(mood, cx, cy, gap) {
  gap = gap || 11;
  const L = cx - gap, R = cx + gap;
  let brow = '';
  if (mood === 'angry') brow = `<path d="M${L - 7} ${cy - 11} L${L + 5} ${cy - 6}M${R + 7} ${cy - 11} L${R - 5} ${cy - 6}" stroke="#3b2214" stroke-width="3" stroke-linecap="round"/>`;
  else if (mood === 'sad' || mood === 'scared') brow = `<path d="M${L - 6} ${cy - 7} L${L + 5} ${cy - 11}M${R + 6} ${cy - 7} L${R - 5} ${cy - 11}" stroke="#3b2214" stroke-width="2.6" stroke-linecap="round"/>`;
  else brow = `<path d="M${L - 6} ${cy - 10} Q${L} ${cy - 13} ${L + 6} ${cy - 10}M${R - 6} ${cy - 10} Q${R} ${cy - 13} ${R + 6} ${cy - 10}" stroke="#3b2214" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const r = mood === 'scared' || mood === 'wow' ? 5.2 : 4.4;
  const white = mood === 'scared' ? `<circle cx="${L}" cy="${cy}" r="7.5" fill="#fff" stroke="#3b2214" stroke-width="1.4"/><circle cx="${R}" cy="${cy}" r="7.5" fill="#fff" stroke="#3b2214" stroke-width="1.4"/>` : '';
  return white + `<circle cx="${L}" cy="${cy}" r="${r}" fill="#3b2214"/><circle cx="${R}" cy="${cy}" r="${r}" fill="#3b2214"/><circle cx="${L + 1.5}" cy="${cy - 1.6}" r="1.5" fill="#fff"/><circle cx="${R + 1.5}" cy="${cy - 1.6}" r="1.5" fill="#fff"/>` + brow;
}

/* person: kind = boy | girl | man | woman | grandpa | grandma | baby
   opts: mood, cap (kumma color), dress, scarf, h (height px), skin, extra (svg inside) */
function person(kind, o) {
  o = o || {};
  const mood = o.mood || 'happy';
  const skin = o.skin || SKIN[kind === 'man' || kind === 'grandpa' ? 1 : 0];
  const id = uid('p');
  const adult = /man|woman|grandpa|grandma/.test(kind);
  const H = adult ? 230 : 200;
  const h = o.h || (adult ? 230 : 190);
  const hx = 60, hy = adult ? 58 : 62, hr = adult ? 27 : 30;
  let body = '', back = '', front = '', top = '';
  const cap = o.cap || '#2E86C1';
  if (kind === 'boy' || kind === 'man' || kind === 'grandpa' || kind === 'baby') {
    const dd = o.dress || '#FFFFFF';
    const bTop = hy + hr - 2, bBot = H - 14;
    body = `<path d="M${hx - 26} ${bTop + 8} Q${hx} ${bTop - 4} ${hx + 26} ${bTop + 8} L${hx + 33} ${bBot} Q${hx} ${bBot + 6} ${hx - 33} ${bBot} Z" fill="${dd}" stroke="#c9c2b8" stroke-width="2"/>
      <path d="M${hx - 26} ${bTop + 10} L${hx - 38} ${bTop + 60}" stroke="${dd}" stroke-width="13" stroke-linecap="round"/><path d="M${hx + 26} ${bTop + 10} L${hx + 38} ${bTop + 60}" stroke="${dd}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${hx - 38}" cy="${bTop + 64}" r="6.5" fill="${skin}"/><circle cx="${hx + 38}" cy="${bTop + 64}" r="6.5" fill="${skin}"/>
      <path d="M${hx} ${bTop + 4} V${bTop + 34}" stroke="#d6cfc4" stroke-width="2"/>
      <path d="M${hx - 1} ${bTop + 6} q-4 18 0 34 q4 4 0 8" stroke="#b9a78f" stroke-width="2" fill="none"/>
      <ellipse cx="${hx - 13}" cy="${bBot + 3}" rx="10" ry="5" fill="#7b4a2b"/><ellipse cx="${hx + 13}" cy="${bBot + 3}" rx="10" ry="5" fill="#7b4a2b"/>`;
    if (kind === 'man' || kind === 'grandpa') {
      body += `<path d="M${hx - 8} ${bTop + 40} h16 l-3 22 l-5 6 l-5-6 z" fill="#c9a24a" stroke="#8c6a1f" stroke-width="1.5" opacity="${o.khanjar ? 1 : 0}"/>`;
    }
    if (kind === 'grandpa') body += `<path d="M${hx + 40} ${bTop + 60} V${bBot + 4}" stroke="#7b4a2b" stroke-width="5" stroke-linecap="round"/>`;
  } else {
    const dr = o.dress || '#E8A13A', sc = o.scarf || '#D3202F', trim = o.trim || '#7a1f2b';
    const bTop = hy + hr - 4, bBot = H - 34;
    back = `<path d="M${hx - hr - 9} ${hy + 4} Q${hx - hr - 12} ${hy - hr - 12} ${hx} ${hy - hr - 10} Q${hx + hr + 12} ${hy - hr - 12} ${hx + hr + 9} ${hy + 4} L${hx + hr + 16} ${hy + hr + 30} Q${hx} ${hy + hr + 40} ${hx - hr - 16} ${hy + hr + 30} Z" fill="${sc}"/>`;
    body = `<path d="M${hx - 27} ${bTop + 12} Q${hx} ${bTop} ${hx + 27} ${bTop + 12} L${hx + 34} ${bBot} H${hx - 34} Z" fill="${dr}"/>
      <path d="M${hx - 27} ${bTop + 14} L${hx - 38} ${bTop + 62}" stroke="${dr}" stroke-width="13" stroke-linecap="round"/><path d="M${hx + 27} ${bTop + 14} L${hx + 38} ${bTop + 62}" stroke="${dr}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${hx - 38}" cy="${bTop + 66}" r="6.5" fill="${skin}"/><circle cx="${hx + 38}" cy="${bTop + 66}" r="6.5" fill="${skin}"/>
      <path d="M${hx - 34} ${bBot - 8} H${hx + 34}" stroke="${trim}" stroke-width="7"/><path d="M${hx - 34} ${bBot - 8} H${hx + 34}" stroke="#F5C542" stroke-width="2" stroke-dasharray="3 4"/>

/* ---------- speech ---------- */
function speak(text, btn) {
  try {
    if (!('speechSynthesis' in window)) throw 0;
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); btn && btn.classList.remove('on'); return; }
    const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, ''));
    const v = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang));
    if (!v) { toast('لا يوجد صوت عربي في هذا الجهاز — اقرأ النص للطلاب'); return; }
    u.voice = v; u.lang = v.lang; u.rate = .82;
    u.onend = () => btn && btn.classList.remove('on');
    btn && btn.classList.add('on');
    speechSynthesis.speak(u);
  } catch (e) { toast('القراءة الصوتية غير متاحة هنا'); }
}

/* ---------- confetti ---------- */
const CF = { parts: [], run: false };
function confetti(n) {
  const cv = $('#confetti'), x = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#D3202F', '#0E8A4B', '#F5B400', '#1E88C8', '#8E4FA0', '#EF6A2B', '#fff'];
  for (let i = 0; i < (n || 90); i++) CF.parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 300, y: innerHeight * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4, r: Math.random() * 8 + 4, c: cols[i % cols.length], a: Math.random() * 6, life: 120 });
  if (CF.run) return; CF.run = true;
  (function loop() {
    x.clearRect(0, 0, cv.width, cv.height);
    CF.parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .99; p.a += .2; p.life--; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    CF.parts = CF.parts.filter(p => p.life > 0 && p.y < cv.height + 40);
    if (CF.parts.length) requestAnimationFrame(loop); else { CF.run = false; x.clearRect(0, 0, cv.width, cv.height); }
  })();
}

function fitText(body) {

}

addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'n' || e.key === 'N' || e.key === 'ى') { toggleNotes(); return; }
  if (e.key === 'f' || e.key === 'F' || e.key === 'ب') { fs(); return; }
