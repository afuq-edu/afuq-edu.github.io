<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة أفق التعليمية – علوم الصف الأول</title>
<style>
:root{
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#16213A; --muted:#5B6782; --line:#DCE3EE;
  --brand:#2F6FB3; --brand-ink:#FFFFFF; --ok:#1F9D55; --bad:#D64545;
  --c1:#0E8C8C; --c2:#D98A0B; --c3:#C2367A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --card:#18223A; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2B3756;
    --brand:#6EA8FF; --brand-ink:#0F1626; --ok:#3DD47F; --bad:#FF6B6B;
    --c1:#2EC4C4; --c2:#F2B035; --c3:#F062A4;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --card:#18223A; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2B3756;
  --brand:#6EA8FF; --brand-ink:#0F1626; --ok:#3DD47F; --bad:#FF6B6B;
  --c1:#2EC4C4; --c2:#F2B035; --c3:#F062A4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

header{background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:22px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.title h1{margin:0;font-size:clamp(22px,4.5vw,30px);line-height:1.25}
.title p{margin:2px 0 0;color:var(--muted);font-size:15px}
.contact{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;text-decoration:none;font-weight:700;white-space:nowrap}
.contact span{color:var(--muted);font-weight:600}
.contact b{direction:ltr;unicode-bidi:isolate;letter-spacing:.5px;color:var(--brand)}

main{max-width:960px;margin:0 auto;padding:28px 16px 64px}
h2{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{position:relative;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;text-align:start;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:20px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0000001a}

.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.tag{align-self:flex-start;font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}

.note{margin-top:28px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:15px}
.note b{color:var(--ink)}
.note a{color:var(--brand);font-weight:700;direction:ltr;unicode-bidi:isolate}

dialog{border:0;border-radius:18px;padding:0;width:min(420px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px #00000055}
dialog::backdrop{background:#0b1220aa}
.dlg{padding:22px}
.dlg h3{margin:0 0 4px;font-size:20px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.dlg input{width:100%;font-size:22px;text-align:center;letter-spacing:4px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.dlg input.err{border-color:var(--bad)}
.msg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--bad);text-align:center}
.get{margin:6px 0 0;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.get a{color:var(--brand);font-weight:800;direction:ltr;unicode-bidi:isolate;text-decoration:none}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;border-radius:12px;padding:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.row .go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 28px}
.card .hd{display:flex;align-items:center;gap:12px}
.ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font-size:20px;font-weight:800;line-height:1}
.ic svg{width:19px;height:19px}
.tag{display:inline-flex;align-items:center;gap:5px}
.contact svg{color:var(--brand)}
.card .go{font-size:14px;font-weight:700;color:var(--c)}
.back{color:var(--brand);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="logo" href="../../" title="جميع الصفوف" aria-label="العودة إلى جميع الصفوف" style="text-decoration:none">أ</a>
    <div class="title">
      <h1>منصة أفق التعليمية</h1>
      <p><a class="back" href="../">→ الصف الأول</a> · العلوم · اختر القسم</p>
    </div>
    <a class="contact" href="tel:76506037"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg> رقم التواصل:</span> <b>76506037</b></a>
  </div>
</header>

<main>
  <h2>الأقسام</h2>
  <div class="grid">
    <button class="card" style="--c:var(--c1)" data-id="prep">
      <div class="hd"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span><h3>ملف التحضير</h3></div>
      <p>نسخ حقول نور – العلوم – الصف الأول</p>
    </button>
    <button class="card" style="--c:var(--c2)" data-id="explorer">
      <div class="hd"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M8 15h8"/></svg></span><h3>مُستكشِف العلوم</h3></div>
      <p>علوم الصف الأول – أنشطة تفاعلية</p>
      <span class="tag"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> للمشتركين</span>
    </button>
    <button class="card" style="--c:var(--c3)" data-id="kahoot">
      <div class="hd"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span><h3>مسابقات كاهوت</h3></div>
      <p>مسابقة المجموعات – الصف الأول</p>
      <span class="tag"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> للمشتركين</span>
    </button>
  </div>

  <div class="note">
    <b>لغير المشتركين:</b> للحصول على رمز الدخول تواصل معنا على الرقم
    <a href="tel:76506037">76506037</a>
  </div>
</main>

<footer>© منصة أفق التعليمية</footer>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="form">
    <h3 id="dlgTitle">أدخل الرمز</h3>
    <p>هذا القسم للمشتركين. أدخل رمز الدخول للمتابعة.</p>
    <input id="code" inputmode="numeric" autocomplete="off" aria-label="رمز الدخول" required>
    <div class="msg" id="msg" role="alert"></div>
    <div class="get">ليس لديك رمز؟ تواصل على <a href="tel:76506037">76506037</a></div>
    <div class="row">
      <button type="button" id="cancel">إلغاء</button>
      <button type="submit" class="go">دخول</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var SECTIONS={
    prep:{title:'ملف التحضير',hash:null},
    explorer:{title:'مُستكشِف العلوم',hash:'40e90363321b9ee3a4cff4991e38124ffd1d71864beb9da28937efcb45776ba8'},
    kahoot:{title:'مسابقات كاهوت',hash:'fcd647aca9ee1134a1db2eb2bfff2fe2969739c6ea742c11e6cfa032371a2071'}
  };
  var dlg=document.getElementById('dlg'), form=document.getElementById('form'),
      input=document.getElementById('code'), msg=document.getElementById('msg'), current=null;

  function key(id){return 'ofuq-g1s-unlock-'+id}
  function isUnlocked(id){
    try{if(localStorage.getItem(key(id))==='1')return true}catch(e){}
    try{if(sessionStorage.getItem(key(id))==='1')return true}catch(e){}
    return false;
  }
  function unlock(id){
    try{localStorage.setItem(key(id),'1')}catch(e){}
    try{sessionStorage.setItem(key(id),'1')}catch(e){}
  }
  function go(id){location.href=id+'/'}
  function sha256(text){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
    });
  }
  function toLatinDigits(s){
    return s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).trim();
  }
  function open(id){
    var s=SECTIONS[id]; if(!s)return;
    if(!s.hash||isUnlocked(id)){go(id);return}
    current=id;
    document.getElementById('dlgTitle').textContent=s.title+' – أدخل الرمز';
    input.value='';input.classList.remove('err');msg.textContent='';
    dlg.showModal();input.focus();
  }

  document.querySelectorAll('.card').forEach(function(b){
    b.addEventListener('click',function(){open(b.dataset.id)});
  });
  document.getElementById('cancel').addEventListener('click',function(){dlg.close()});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var id=current;
    sha256('ofuq:'+toLatinDigits(input.value)).then(function(h){
      if(h===SECTIONS[id].hash){unlock(id);dlg.close();go(id)}
      else{input.classList.add('err');msg.textContent='الرمز غير صحيح، حاول مرة أخرى';input.select()}
    });
  });

  var lock=new URLSearchParams(location.search).get('lock');
  if(lock&&SECTIONS[lock]){history.replaceState(null,'',location.pathname);open(lock)}
})();
</script>
</body>
</html>
