<!doctype html>
<html lang="ar" dir="rtl">
<head><script>(function(){var k='ofuq-g1s-unlock-slides';function g(n,x){try{return window[n].getItem(x)==='1'}catch(e){return false}}if(g('localStorage',k)||g('sessionStorage',k)||g('localStorage','afuq-all')||g('sessionStorage','afuq-all'))return;document.documentElement.style.display='none';location.replace('../?lock=slides')})()</script>
<meta charset="utf-8"><script src="/assets/pkgmode.js" data-role="page"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>علوم الصف الأول التفاعلية</title>
<meta name="description" content="عروض تفاعلية لدروس العلوم للصف الأول – الفصل الدراسي الأول">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Color+Emoji&display=swap">
<style>/* Layout: fixed 1280×720 lesson stage scaled to the screen, framed by a slim tool bar and a nav bar. Look: a child's science notebook — squared paper, ink-navy text, sun/leaf/sky phase colours. */
:root{
  --paper:#fbfaf3; --grid:#e6ecdf; --ink:#1d2b4a; --ink-2:#4a5878; --line:#d7dccb;
  --sun:#ffc533; --sun-d:#e09a00; --leaf:#3bb273; --leaf-d:#23864f; --sky:#3d8fe0; --sky-d:#2463a8;
  --coral:#ff6b5b; --coral-d:#d4402f; --plum:#8a5cd6; --plum-d:#623aa8; --orange:#ff9433;
  --card:#ffffff; --shade:rgba(29,43,74,.12);
  --f-display:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;
  --f-read:"Noto Naskh Arabic","Baloo Bhaijaan 2",Tahoma,serif;
  --f-emo:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-display);direction:rtl;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.emo{font-family:var(--f-emo);line-height:1;font-style:normal}
.read{font-family:var(--f-read);line-height:1.9}
[hidden]{display:none!important}

/* ===== HOME ===== */
#home{position:absolute;inset:0;overflow:auto;padding-block:24px 60px;padding-inline:max(16px,4vw)}
.h-top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto 20px}
.brand{display:flex;gap:14px;align-items:center}
.brand .badge{width:64px;height:64px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:34px;box-shadow:0 4px 0 var(--sun-d)}
.brand h1{margin:0;font-size:clamp(24px,3.4vw,38px);line-height:1.15}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.h-tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.pill:hover{background:var(--sun)}
.units{max-width:1200px;margin:0 auto;display:grid;gap:22px}
.unit{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--shade)}
.unit-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.unit-n{width:46px;height:46px;border-radius:14px;color:#fff;font-size:26px;font-weight:800;display:grid;place-items:center}
.unit-h h2{margin:0;font-size:26px}
.unit-h span{color:var(--ink-2);font-size:15px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ls{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;text-align:right;display:grid;gap:4px;min-width:0;transition:transform .15s,border-color .15s}
.ls:hover{transform:translateY(-3px);border-color:var(--ink)}
.ls .code{font-weight:800;font-size:14px;color:var(--ink-2)}
.ls .ic{font-size:34px}
.ls b{font-size:18px;line-height:1.3}
.ls small{color:var(--ink-2);font-size:13px}
.ls.review{background:#fff6dc}
.h-foot{max-width:1200px;margin:22px auto 0;color:var(--ink-2);font-size:14px;line-height:1.8}
.kbd{display:inline-block;border:1.5px solid var(--ink-2);border-radius:6px;padding:0 6px;font-size:12px;margin:0 2px}

/* ===== PLAYER ===== */
#player{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:#fff;min-width:0}
.topbar .t-home{background:var(--sun);color:var(--ink);border:0;border-radius:10px;padding:6px 12px;font-weight:800}
.t-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:16px}
.teams{display:flex;gap:6px;flex-wrap:nowrap}
.team{display:flex;align-items:center;gap:4px;border-radius:999px;padding:2px 4px 2px 10px;font-weight:800;color:#fff;font-size:14px;border:2px solid rgba(255,255,255,.5)}
.team .sc{background:#fff;color:var(--ink);border-radius:999px;min-width:30px;text-align:center;padding:0 6px;font-size:15px}
.team button{border:0;background:rgba(255,255,255,.25);border-radius:50%;width:24px;height:24px;font-weight:900;color:#fff;line-height:1}
.tbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;color:#fff;padding:6px 9px;font-size:15px;font-weight:700}
.tbtn:hover,.tbtn.on{background:rgba(255,255,255,.3)}
.viewport{position:relative;overflow:hidden}
#stage{position:absolute;width:1280px;height:720px;top:0;left:0;transform-origin:0 0;background:var(--paper);border-radius:18px;box-shadow:0 10px 30px rgba(29,43,74,.18);overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.navbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-top:2px solid var(--line)}
.nbtn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:6px 16px;font-weight:800;font-size:16px}
.nbtn.primary{background:var(--leaf);border-color:var(--leaf-d);color:#fff}
.dots{flex:1;display:flex;gap:4px;align-items:center;overflow-x:auto;padding:4px 0;min-width:0}
.dot{flex:0 0 auto;height:12px;min-width:12px;border-radius:6px;border:0;opacity:.35;padding:0}
.dot.cur{opacity:1;min-width:30px}
.dot.seen{opacity:.7}
.counter{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== SLIDE FRAME ===== */
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;padding:22px 34px 24px;animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.s-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.phase{color:#fff;font-weight:800;font-size:20px;padding:4px 16px 6px;border-radius:12px;white-space:nowrap}
.s-head h2{margin:0;font-size:38px;line-height:1.2;flex:1}
.speak{border:2px solid var(--ink);background:var(--card);border-radius:50%;width:48px;height:48px;font-size:22px;flex:0 0 auto}
.speak:hover{background:var(--sun)}
.s-body{min-height:0;position:relative}
.note-panel{position:absolute;inset:auto 20px 20px 20px;background:#fffbe6;border:2px dashed var(--sun-d);border-radius:16px;padding:14px 18px;font-family:var(--f-read);font-size:19px;line-height:1.8;z-index:30;box-shadow:0 8px 20px var(--shade);max-height:60%;overflow:auto}
.note-panel b{font-family:var(--f-display);color:var(--sun-d)}

.ph-ahdaf{background:var(--ink)} .ph-tahia{background:var(--sun-d)} .ph-ard{background:var(--sky)} .ph-nashat{background:var(--leaf)}
.ph-taqweem{background:var(--plum)} .ph-ghalq{background:var(--orange)} .ph-wajib{background:var(--coral)} .ph-murajaa{background:var(--plum)}

/* ===== shared widgets ===== */
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--shade)}
.btn{border:2.5px solid var(--ink);background:var(--sun);border-radius:14px;padding:8px 20px;font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:var(--leaf);color:#fff} .btn.b{background:var(--sky);color:#fff} .btn.w{background:var(--card)} .btn.p{background:var(--plum);color:#fff}
.row{display:flex;gap:14px;align-items:center}
.center{display:grid;place-items:center}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.ok{background:#dff6e8!important;border-color:var(--leaf-d)!important}
.bad{background:#ffe2de!important;border-color:var(--coral-d)!important}
.hint{font-family:var(--f-read);font-size:20px;color:var(--ink-2)}

/* cover */
.cover{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;height:100%}
.cv-l{display:grid;align-content:center;gap:10px;position:relative}
.cv-code{font-size:26px;font-weight:800;color:var(--ink-2)}
.cv-title{font-size:58px;line-height:1.15;margin:0}
.cv-unit{font-size:24px;color:var(--ink-2)}
.cv-ic{font-size:150px;position:absolute;left:0;bottom:-6px;opacity:.95}
.cv-r{display:grid;gap:14px;align-content:center}
.cv-box{padding:16px 20px}
.cv-box h3{margin:0 0 6px;font-size:24px}
.cv-box ul{margin:0;padding-inline-start:26px;font-family:var(--f-read);font-size:21px;line-height:1.75}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span.ph{color:#fff;border-radius:10px;padding:2px 12px 4px;font-size:17px;font-weight:800}
.flow i{font-style:normal;color:var(--ink-2);font-weight:800}

/* vocab */
.vgrid{display:grid;gap:18px;height:100%;align-content:center}
.vcard{perspective:900px;height:200px;border:0;background:none;padding:0}
.vin{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.vcard.flip .vin{transform:rotateY(180deg)}
.vf,.vb{position:absolute;inset:0;backface-visibility:hidden;border:2.5px solid var(--ink);border-radius:22px;display:grid;place-items:center;background:var(--card);box-shadow:5px 5px 0 var(--shade)}
.vf .emo{font-size:96px}
.vf small{position:absolute;bottom:8px;font-size:15px;color:var(--ink-2)}
.vb{transform:rotateY(180deg);background:#fff7d6;gap:0;padding:8px}
.vb .w{font-family:var(--f-read);font-size:46px;font-weight:700;line-height:1.5}
.vb .emo{font-size:46px}

/* reveal */
.rv{display:grid;grid-template-columns:1fr 1.15fr;gap:30px;height:100%;align-items:center}
.rv.wide{grid-template-columns:1fr}
.rv-vis{display:grid;place-items:center;height:100%;min-height:0}
.rv-vis .big{font-size:150px}
.rv-pts{display:grid;gap:14px;align-content:center}
.pt{display:flex;gap:14px;align-items:flex-start;padding:12px 18px;font-family:var(--f-read);font-size:27px;line-height:1.7;opacity:0;transform:translateX(-20px);transition:.4s}
.pt.show{opacity:1;transform:none}
.pt .emo{font-size:40px;flex:0 0 auto}
.pt.q{background:#eaf3ff;border:2px solid var(--sky);border-radius:16px}
.pt .ans{display:block;color:var(--leaf-d);font-weight:700;font-size:24px}
.pt .abtn{font-family:var(--f-display);font-size:16px;border:2px solid var(--sky);background:#fff;border-radius:10px;padding:0 10px;margin-inline-start:8px}
.pt.key{background:#fff4cc;border:2px solid var(--sun-d);border-radius:16px;font-weight:700}

/* scene */
.scene{display:grid;grid-template-columns:1fr 330px;gap:18px;height:100%}
.sc-box{position:relative;border:2.5px solid var(--ink);border-radius:22px;overflow:hidden}
.sc-box svg.bg{position:absolute;inset:0;width:100%;height:100%}
.si{position:absolute;transform:translate(50%,-50%);border:0;background:none;padding:0;line-height:1;transition:transform .2s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.si:hover{transform:translate(50%,-50%) scale(1.15)}
.si.found::after{content:"✓";position:absolute;top:-6px;left:-6px;background:var(--leaf);color:#fff;border-radius:50%;width:24px;height:24px;font:800 16px/24px var(--f-display);text-align:center}
.si.found.no::after{content:"✗";background:var(--coral)}
.bubble{position:absolute;z-index:5;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px;font-family:var(--f-read);font-size:21px;line-height:1.6;max-width:300px;box-shadow:4px 4px 0 var(--shade);transform:translate(50%,calc(-100% - 40px));pointer-events:none}
.bubble b{font-family:var(--f-display);font-size:24px;display:block}
.sc-side{display:grid;align-content:start;gap:12px}
.sc-side .card{padding:12px 16px}
.qlist{margin:0;padding-inline-start:22px;font-family:var(--f-read);font-size:21px;line-height:1.7}
.meter{font-size:26px;font-weight:800;text-align:center}

/* sort */
.sort{display:grid;grid-template-rows:1fr auto;gap:16px;height:100%}
.pool{display:flex;flex-wrap:wrap;gap:12px;align-content:center;justify-content:center;padding:10px;border:2.5px dashed var(--line);border-radius:20px}
.chip{border:2.5px solid var(--ink);background:var(--card);border-radius:16px;padding:6px 12px;display:grid;justify-items:center;gap:2px;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--shade);touch-action:none;user-select:none}
.chip .emo{font-size:50px}
.chip.sel{background:var(--sun);transform:translateY(-4px)}
.chip.sm .emo{font-size:36px}
.chip.word{font-family:var(--f-read);font-size:26px;padding:6px 18px}
.bins{display:grid;gap:16px}
.bin{border:3px solid var(--ink);border-radius:20px;min-height:150px;padding:8px;display:grid;grid-template-rows:auto 1fr;background:var(--card)}
.bin-h{display:flex;gap:8px;align-items:center;justify-content:center;font-size:26px;font-weight:800;border-bottom:2px dashed var(--line);padding-bottom:4px}
.bin-h .emo{font-size:34px}
.bin-in{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center;padding-top:6px}
.bin-in .chip{padding:2px 6px;box-shadow:none}
.bin-in .chip .emo{font-size:30px}
.bin-in .chip span{font-size:13px}
.bin.hot{background:#fff4cc}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);opacity:.9}

/* pick / mcq */
.pick{display:grid;grid-template-rows:auto 1fr;gap:12px;height:100%}
.pgrid{display:grid;gap:14px;align-content:center}
.pcell{border:2.5px solid var(--ink);background:var(--card);border-radius:18px;padding:10px;display:grid;justify-items:center;gap:4px;font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--shade)}
.pcell .emo{font-size:62px}
.bar-top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.prompt{font-family:var(--f-read);font-size:28px;font-weight:700}
.timerbox{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px;text-align:center;background:var(--ink);color:#fff;border-radius:12px;padding:0 12px}
.mcq{display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;height:100%}
.mq{font-family:var(--f-read);font-size:34px;font-weight:700;line-height:1.6;text-align:center}
.mq .emo{font-size:60px;display:block}
.mopts{display:grid;gap:18px;align-content:center}
.mopt{border:3px solid var(--ink);background:var(--card);border-radius:22px;padding:14px;display:grid;justify-items:center;gap:6px;font-size:28px;font-weight:800;box-shadow:0 6px 0 var(--shade)}
.mopt .emo{font-size:84px}
.mopt.txt{font-family:var(--f-read);font-size:28px}
.explain{font-family:var(--f-read);font-size:24px;text-align:center;color:var(--leaf-d);font-weight:700;min-height:44px}
.qnav{display:flex;justify-content:center;gap:10px;align-items:center;font-weight:800;color:var(--ink-2);font-size:18px}

/* tf */
.tf{display:grid;grid-template-rows:1fr auto auto;gap:18px;height:100%;justify-items:center}
.tf-card{width:100%;max-width:1000px;align-self:center;padding:24px 30px;text-align:center}
.tf-card .emo{font-size:96px;display:block;margin-bottom:6px}
.tf-card p{margin:0;font-family:var(--f-read);font-size:38px;font-weight:700;line-height:1.6}
.tf-btns{display:flex;gap:40px}
.tfb{width:170px;height:110px;border-radius:24px;border:3px solid var(--ink);font-size:60px;font-weight:900;color:#fff;box-shadow:0 6px 0 var(--ink)}
.tfb.y{background:var(--leaf)} .tfb.n{background:var(--coral)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:80px;height:100%;align-content:center;position:relative;padding:0 40px}
.mcol{display:grid;gap:12px}
.mi{width:100%;border:2.5px solid var(--ink);background:var(--card);border-radius:16px;padding:6px 14px;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;min-height:76px;box-shadow:0 4px 0 var(--shade)}
.mi .emo{font-size:46px}
.mi.sel{background:var(--sun)}
.mi.done{opacity:.95}
.mi .tag{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:18px}
svg.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* order */
.order{display:grid;grid-template-rows:auto auto 1fr;gap:16px;height:100%}
.slots{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.slot{width:170px;height:150px;border:3px dashed var(--ink-2);border-radius:20px;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.6)}
.slot .n{position:absolute;top:-14px;right:-10px;background:var(--ink);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:800}
.slot .chip{box-shadow:none;border:0;background:none}
.slot.arrow::after{content:"⬅";position:absolute;left:-26px;font-size:24px;color:var(--ink-2)}
.opool{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:flex-start;align-content:flex-start}

/* activity */
.act{display:grid;grid-template-columns:340px 1fr;gap:22px;height:100%}
.act-side{display:grid;gap:14px;align-content:start}
.mat{padding:14px 16px}
.mat h3,.steps h3{margin:0 0 8px;font-size:24px}
.mat ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mat li{display:flex;gap:10px;align-items:center;font-family:var(--f-read);font-size:21px}
.mat li .emo{font-size:32px}
.steps{padding:16px 22px;overflow:auto}
.steps ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-family:var(--f-read);font-size:24px;line-height:1.65}
.steps li::before{content:counter(s);flex:0 0 38px;height:38px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font:800 20px/1 var(--f-display);margin-top:4px}
.steps .ask{margin-top:12px;background:#eaf3ff;border-radius:14px;padding:10px 14px;font-family:var(--f-read);font-size:21px;line-height:1.7}
.code-b{display:inline-block;background:var(--leaf);color:#fff;border-radius:10px;padding:2px 12px;font-weight:800;font-size:18px}
.tbig{display:grid;gap:8px;justify-items:center;padding:12px}
.tbig .tm{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
.tbig .row button{font-size:16px;padding:4px 10px}

/* experiment */
.exp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 300px;gap:18px;height:100%}
.pot{display:grid;grid-template-rows:auto 1fr;padding:10px;text-align:center}
.pot h3{margin:0;font-size:24px}
.pot>div{min-height:0}
.pot svg{width:100%;height:100%}
.exp-side{display:grid;gap:12px;align-content:start}
.exp-side .card{padding:12px 14px}
input[type=range]{width:100%;accent-color:var(--leaf);height:30px}
.day{font-size:30px;font-weight:800;text-align:center}
.popts{display:grid;gap:8px}

<script>/* ====== محرك العرض التفاعلي ====== */
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LESSONS=window.LESSONS, UNITS=window.UNITS;
const PH={ahdaf:'الأهداف',tahia:'تهيئة',ard:'عرض وشرح',nashat:'نشاط',taqweem:'تقويم تكويني',ghalq:'غلق ختامي',wajib:'واجب',murajaa:'مراجعة'};
const store={get(k,d){try{const v=localStorage.getItem('sci1-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('sci1-'+k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const P=s=>{const p=String(s).split('|');return {e:p[0]||'',l:p[1]||'',x:p[2]}};
const E=(e,c='')=>e?`<span class="emo ${c}">${e}</span>`:'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
let teams=store.get('teams',[{n:'الشمس',c:'#e09a00',s:0},{n:'الأوراق',c:'#23864f',s:0},{n:'السماء',c:'#2463a8',s:0}]);
let settings=store.get('settings',{students:25,sound:true});
let curL=null, curI=0, api=null, notesOn=false, seen=new Set();

/* ---------- sound ---------- */
let AC=null;
function tone(seq){ if(!settings.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  seq.forEach(([f,d,type='sine',v=.18])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8;}); }catch(e){} }
const sfx={ok:()=>tone([[660,.12],[880,.12],[1175,.22]]),bad:()=>tone([[220,.25,'square',.08],[180,.3,'square',.08]]),tap:()=>tone([[520,.06,'triangle',.12]]),
  win:()=>tone([[523,.12],[659,.12],[784,.12],[1046,.35],[784,.12],[1046,.5]]),flip:()=>tone([[400,.07,'triangle',.1],[600,.07,'triangle',.1]]),tick:()=>tone([[900,.04,'square',.05]]),end:()=>tone([[880,.3],[660,.3],[880,.3],[660,.5]])};

/* ---------- speech ---------- */
function speak(t){ t=String(t||'').replace(/<[^>]+>/g,' ');
  if(!('speechSynthesis' in window)){toast('القراءة الصوتية غير متاحة في هذا المتصفح');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.82;
   const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)); if(v)u.voice=v; else if(!speak.warned){speak.warned=1;toast('لا يوجد صوت عربي مثبت في هذا الجهاز؛ قد تكون القراءة غير واضحة')}
   speechSynthesis.speak(u);}catch(e){}
}

/* ---------- fx ---------- */
const fx=$('#fx'), fctx=fx.getContext('2d'); let parts=[], fxOn=false;
function confetti(n=140){ fx.width=innerWidth; fx.height=innerHeight; const cols=['#ffc533','#3bb273','#3d8fe0','#ff6b5b','#8a5cd6','#ff9433'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*8+4,c:cols[i%6],a:Math.random()*6,life:90+Math.random()*50});
  if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)} }
function fxLoop(){ fctx.clearRect(0,0,fx.width,fx.height); parts=parts.filter(p=>p.life-->0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.a+=.2;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);fctx.restore()});
  if(parts.length)requestAnimationFrame(fxLoop); else {fxOn=false;fctx.clearRect(0,0,fx.width,fx.height)} }
let toastT;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='award';document.body.appendChild(t)}t.innerHTML=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function win(msg='أحسنتم! 🌟'){ sfx.win(); confetti(); award(msg); }
function award(msg){ let a=$('#award'); if(!a){a=document.createElement('div');a.id='award';a.className='award';document.body.appendChild(a)}
  a.innerHTML=`<span>${msg}</span><span style="color:var(--ink-2)">امنح نقطة لـ:</span>`+teams.map((t,i)=>`<button data-t="${i}" style="background:${t.c}">${esc(t.n)} +1</button>`).join('')+`<button data-x style="background:#888">✕</button>`;
  a.hidden=false; a.onclick=e=>{const b=e.target.closest('button');if(!b)return; if(b.dataset.t!=null){teams[+b.dataset.t].s++;saveTeams();sfx.tap()} a.hidden=true};
  clearTimeout(a._t); a._t=setTimeout(()=>a.hidden=true,9000); }
function good(el){sfx.ok();if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}
function bad(el){sfx.bad();if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}

/* ---------- drag & tap ---------- */
let scale=1;
function dnd(root,onPlace){ let sel=null, drag=null;
  const clear=()=>{if(sel)sel.classList.remove('sel');sel=null};
  root.addEventListener('pointerdown',e=>{const c=e.target.closest('.chip[data-drag]');if(!c||c.dataset.done)return;
    e.preventDefault(); drag={c,x:e.clientX,y:e.clientY,g:null};
    const mv=ev=>{ if(!drag)return; const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
      if(!drag.g&&Math.hypot(dx,dy)>8){const g=c.cloneNode(true);g.classList.add('ghost');const r=c.getBoundingClientRect();g.style.width=r.width/scale+'px';g.style.transform=`translate(-50%,-50%) scale(${scale*1.05})`;g.style.transformOrigin='center';document.body.appendChild(g);drag.g=g;c.style.opacity=.35}
      if(drag.g){drag.g.style.left=ev.clientX+'px';drag.g.style.top=ev.clientY+'px';$$('[data-drop]',root).forEach(z=>z.classList.remove('hot'));const z=document.elementFromPoint(ev.clientX,ev.clientY);const zz=z&&z.closest('[data-drop]');if(zz&&root.contains(zz))zz.classList.add('hot')}};
    const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(!drag)return;
      $$('[data-drop]',root).forEach(z=>z.classList.remove('hot'));
      if(drag.g){drag.g.remove();c.style.opacity='';const z=document.elementFromPoint(ev.clientX,ev.clientY);const zz=z&&z.closest('[data-drop]');if(zz&&root.contains(zz)){clear();onPlace(c,zz)}}
      else{ if(sel===c)clear(); else {clear();sel=c;c.classList.add('sel');sfx.tap()} }
      drag=null};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  root.addEventListener('click',e=>{const z=e.target.closest('[data-drop]');if(z&&sel&&root.contains(z)){const c=sel;clear();onPlace(c,z)}});
}

R.reveal=(b,s)=>{ const pts=(s.pts||[]).map(x=>{if(typeof x!=='string')return x;let key=false;if(x[0]==='!'){key=true;x=x.slice(1)}const p=x.split('|');return {e:p[0],t:p[1],a:p[2],key}});

  const draw=()=>{const rd=s.rounds[r];let k=0;
    b.innerHTML=`<div class="guess"><div class="gchars">${s.chars.map((c,i)=>{const p=P(c);return `<button class="gch" data-i="${i}">${E(p.e)}<span>${p.l}</span></button>`}).join('')}</div>
    <div class="card" style="padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px"><b style="font-size:24px">🕵️ من أنا؟ (الجولة ${r+1} من ${s.rounds.length})</b><div class="clues"></div><div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn b cl" style="font-size:18px">دليل 🔍</button><button class="btn g an" style="font-size:18px">الإجابة</button><button class="btn w nr" style="font-size:18px">جولة ←</button></div></div></div>`;
    const add=(q)=>{if(k>=rd.clues.length)return false;$('.clues',b).insertAdjacentHTML('beforeend',`<div class="clue pop">${rd.clues[k]}</div>`);if(q!==1)speak(rd.clues[k]);k++;sfx.tap();return true};
    $('.cl',b).onclick=()=>{if(!add())toast('انتهت الأدلة!')};
    $('.an',b).onclick=()=>{$$('.gch',b).forEach((x,i)=>{x.classList.toggle('out',i!==rd.ans);x.classList.toggle('win',i===rd.ans)});win('عرفتموه! 🎯')};
    $('.nr',b).onclick=()=>{r=(r+1)%s.rounds.length;draw()};
    $$('.gch',b).forEach(x=>x.onclick=()=>{x.classList.toggle('out');sfx.tap()});
    add(1); stepper=add };
  let stepper=()=>false; draw(); return {step:()=>stepper()} };

R.diff=(b,s)=>{ const n=s.a.length, cols=Math.sqrt(n)|0; const diffs=s.a.map((x,i)=>x!==s.b[i]?i:-1).filter(i=>i>=0); let got=0;
  b.innerHTML=`<div style="display:grid;grid-template-rows:auto 1fr;height:100%;gap:8px"><div class="prompt" style="text-align:center">${s.prompt} <span class="meter">🔎 <span class="g">0</span>/${diffs.length}</span></div><div class="diff"><div class="dgrid" style="grid-template-columns:repeat(${cols},1fr)">${s.a.map(x=>`<div>${x}</div>`).join('')}</div><div class="dgrid gb" style="grid-template-columns:repeat(${cols},1fr)">${s.b.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div></div></div>`;
  $$('.gb button',b).forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(el.classList.contains('hit'))return;if(diffs.includes(i)){el.classList.add('hit');good(el);got++;$('.g',b).textContent=got;if(got===diffs.length)setTimeout(()=>win(s.win||'وجدتم كل الاختلافات! 👀'),300)}else bad(el)}); };

R.plate=(b,s)=>{ const foods=s.foods.map(f=>{const p=f.split('|');return {e:p[0],l:p[1],h:+p[2]}}); let on=[];
  b.innerHTML=`<div class="plate"><div style="display:grid;grid-template-rows:auto 1fr;gap:10px"><div class="prompt">${s.prompt}</div><div class="pgrid" style="grid-template-columns:repeat(4,1fr)">${foods.map((f,i)=>`<button class="pcell" data-i="${i}" style="padding:6px">${E(f.e)}<span style="font-size:17px">${f.l}</span></button>`).join('')}</div></div>
  <div class="plate-dish" style="grid-template-rows:1fr auto auto;gap:10px"><div class="dish"></div><div class="hmeter"><i style="width:0"></i></div><div class="explain msg">اختر أطعمة لطبقك</div></div></div>`;
  const dish=$('.dish',b);
  const upd=()=>{dish.innerHTML=on.map((i,k)=>`<span class="emo pop" data-k="${k}" title="إزالة">${foods[i].e}</span>`).join('');const hs=on.filter(i=>foods[i].h).length,us=on.length-hs;const sc=on.length?Math.round(hs/on.length*100):0;const bar=$('.hmeter i',b);bar.style.width=sc+'%';bar.style.background=sc>=75?'var(--leaf)':sc>=45?'var(--sun)':'var(--coral)';
    $('.msg',b).style.color=sc>=75?'var(--leaf-d)':'var(--coral-d)';$('.msg',b).textContent=!on.length?'اختر أطعمة لطبقك':sc>=75&&on.length>=4?'طبق صحي رائع! 🥗':us>hs?'أطعمة كثيرة فيها دهون أو سكريات أو ملح ⚠️':'أضف المزيد من الفواكه والخضراوات 🥕';
    if(sc>=75&&on.length>=5&&!b.dataset.w){b.dataset.w=1;win('طبق صحي متوازن! 🥗')}};
  $$('.pcell',b).forEach(el=>el.onclick=()=>{if(on.length>=10){toast('الطبق ممتلئ! اضغط على طعام في الطبق لإزالته');return}on.push(+el.dataset.i);sfx.tap();upd()});
  dish.onclick=e=>{const x=e.target.closest('[data-k]');if(!x)return;on.splice(+x.dataset.k,1);upd()};
};

R.blocks=(b,s)=>{ let d=0; const fin=s.fin, cols=['#ff6b5b','#ffc533','#3d8fe0','#3bb273'];
  b.innerHTML=`<div style="display:grid;grid-template-columns:1fr 360px;gap:18px;height:100%"><div class="card blocks" style="padding:20px">${s.names.map((n,i)=>`<div class="bcol"><div class="tower" data-i="${i}"></div><span class="emo pl">🪴</span><b>النبتة (${n})</b></div>`).join('')}</div>
  <div style="display:grid;gap:12px;align-content:start"><div class="card" style="padding:12px;text-align:center"><div class="day">اليوم 0</div><button class="btn g dd" style="font-size:20px">يوم جديد ☀️</button></div><div class="tq"></div></div></div>`;
  const draw=()=>{$$('.tower',b).forEach((t,i)=>{const h=Math.round(fin[i]*d/6);t.innerHTML=Array.from({length:h},(_,j)=>`<i style="background:${cols[j%4]}"></i>`).join('')});$('.day',b).textContent='اليوم '+d};
  $('.dd',b).onclick=()=>{if(d<6){d++;draw();sfx.tap();if(d===6)toast('اليوم السادس: قارنوا الأبراج! 📊')}};
  R.mcq($('.tq',b),{qs:s.qs}); $$('.tq .mopts',b).forEach(m=>m.style.gridTemplateColumns='1fr'); draw();
  return {step:()=>{if(d<6){$('.dd',b).click();return true}return false}} };

R.learned=(b,s)=>{ b.innerHTML=`<div class="learn"><div class="star"><span class="emo bob">🌟</span></div><div class="rv-pts">${s.pts.map(p=>`<div class="pt key"><span class="emo">✅</span><div>${p}</div></div>`).join('')}</div></div>`;
  const els=$$('.pt',b);let k=0;const next=()=>{if(k>=els.length)return false;els[k++].classList.add('show');sfx.tap();if(k===els.length)confetti(60);return true};next();return {step:next} };

R.exit=(b,s)=>{ const lv={'داعم':'var(--sky)','متوقع':'var(--leaf)','متقدم':'var(--plum)'};
  b.innerHTML=`<div class="exit">${s.qs.map(q=>`<div class="card ex"><span class="lv" style="background:${lv[q[0]]}">${q[0]==='داعم'?'⭐':q[0]==='متوقع'?'⭐⭐':'⭐⭐⭐'} ${q[0]}</span>${E(q[1])}<p>${q[2]}</p><button class="btn w sh" style="font-size:18px">الإجابة النموذجية</button><div class="a" hidden>${q[3]}</div></div>`).join('')}</div>`;
  $$('.sh',b).forEach(x=>x.onclick=()=>{x.nextElementSibling.hidden=false;x.remove();sfx.ok()}); };

R.hw=(b,s)=>{ const c={'كتاب النشاط':'var(--leaf)','ورقة عمل':'var(--sky)','في البيت':'var(--orange)','كتاب التلميذ':'var(--plum)'};
  b.innerHTML=`<div class="hw">${s.items.map(i=>`<div class="card hwi"><span class="src" style="background:${c[i[0]]||'var(--ink)'}">${i[0]}</span><b>${i[1]}</b><p>${i[2]}</p></div>`).join('')}</div>`; };

/* ---------- player ---------- */
const stage=$('#stage'), vp=$('.viewport');
function fit(){ if(!curL)return; const r=vp.getBoundingClientRect(); const pad=12; scale=Math.min((r.width-pad*2)/1280,(r.height-pad*2)/720); const x=(r.width-1280*scale)/2, y=(r.height-720*scale)/2; stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`; }
addEventListener('resize',fit);

function openLesson(id,i=0){ curL=LESSONS.find(l=>l.id===id); if(!curL)return; if(curL.slides[0].type!=='cover')curL.slides.unshift({type:'cover',ph:'ahdaf',noHead:1,title:'الأهداف'});
  $('#home').hidden=true; $('#player').hidden=false; $('.t-title').textContent=`${curL.code||curL.id} · ${curL.title}`; seen=new Set(); go(i); requestAnimationFrame(fit); store.set('last',{id,i}); }
function go(i){ if(api&&api.destroy)api.destroy(); api=null; const aw=$('#award'); if(aw)aw.hidden=true; try{speechSynthesis.cancel()}catch(e){}
  const n=curL.slides.length; curI=Math.max(0,Math.min(n-1,i)); seen.add(curI); const s=curL.slides[curI];
  stage.innerHTML=''; const el=document.createElement('section'); el.className='slide';
  el.innerHTML=s.noHead?`<div></div><div class="s-body"></div>`:`<header class="s-head"><span class="phase ph-${s.ph}">${PH[s.ph]}</span><h2>${s.title||''}</h2><button class="speak" title="اقرأ بصوت مسموع" aria-label="اقرأ العنوان">🔊</button></header><div class="s-body"></div>`;
  stage.appendChild(el); const body=$('.s-body',el);
  if(!s.noHead)$('.speak',el).onclick=()=>speak(s.say||s.title);
  try{ api=(R[s.type]||(()=>{body.textContent='نوع غير معروف: '+s.type}))(body,s,curL)||null }catch(err){ body.innerHTML=`<p style="color:red">خطأ في عرض الشريحة: ${esc(err.message)}</p>`; console.error(err) }
  const note=document.createElement('div'); note.className='note-panel'; note.hidden=!notesOn; note.innerHTML=`<b>📝 إرشاد المعلّم:</b> ${s.note||autoNote(s)}`; el.appendChild(note);
  $('.counter').textContent=`${curI+1} / ${n}`;
  $('.dots').innerHTML=curL.slides.map((x,j)=>`<button class="dot ph-${x.ph} ${j===curI?'cur':''} ${seen.has(j)?'seen':''}" data-j="${j}" title="${PH[x.ph]}: ${esc(x.title||'')}"></button>`).join('');
  const cd=$('.dot.cur'); if(cd)cd.scrollIntoView({block:'nearest',inline:'center'});
  store.set('last',{id:curL.id,i:curI}); }
function autoNote(s){ return {cover:'اعرض الأهداف بلغة بسيطة واقرأها مع التلاميذ، ثم وضّح مسار الحصة.',vocab:'اقلب البطاقات واحدة تلو الأخرى، ردّد الكلمة مع التلاميذ جماعيًا ثم فرديًا.',learned:'اطلب من التلاميذ قراءة كل عبارة جماعيًا، ثم اسأل: ماذا تعلّمنا اليوم؟',exit:'وزّع الأسئلة الثلاثة حسب مستويات التلاميذ واستمع للإجابات شفهيًا أو كتابيًا.',hw:'وضّح الواجب وصفحاته، واطلب من التلاميذ كتابته في دفتر المتابعة.'}[s.type]||'—'; }
function next(){ if(api&&api.step&&api.step())return; if(curI<curL.slides.length-1)go(curI+1); else toast('نهاية الدرس 🎉 — ارجع للرئيسية لاختيار درس آخر'); }
function prev(){ if(curI>0)go(curI-1); }

/* ---------- toolbar ---------- */
function saveTeams(){ store.set('teams',teams); drawTeams(); }
function drawTeams(){ $('.teams').innerHTML=teams.map((t,i)=>`<div class="team" style="background:${t.c}"><span>${esc(t.n)}</span><span class="sc">${t.s}</span><button data-t="${i}" data-d="1" aria-label="زد">+</button><button data-t="${i}" data-d="-1" aria-label="أنقص">−</button></div>`).join(''); }
$('.teams').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const t=teams[+b.dataset.t];t.s=Math.max(0,t.s+ +b.dataset.d);sfx.tap();saveTeams()};

function modal(html,onMount){ const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o||e.target.closest('[data-close]')){o._d&&o._d();o.remove()}};onMount&&onMount(o);return o }
let gT={sec:180,left:180,iv:null};
function timerModal(){ modal(`<h3>⏱ المؤقت</h3><div class="big tmv">${fmt(gT.left)}</div><div class="row" style="justify-content:center;flex-wrap:wrap;margin:10px 0">${[1,2,3,5,10].map(m=>`<button class="btn w" data-m="${m}" style="font-size:18px">${m} د</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn g ss">${gT.iv?'إيقاف':'ابدأ'}</button><button class="btn w rr">إعادة</button><button class="btn w" data-close>إغلاق</button></div>`,o=>{
  const v=$('.tmv',o), up=()=>{v.textContent=fmt(gT.left)}; o._u=up; gT.view=up;
  $$('[data-m]',o).forEach(b=>b.onclick=()=>{stopT();gT.sec=gT.left=+b.dataset.m*60;up();$('.ss',o).textContent='ابدأ'});
  $('.ss',o).onclick=e=>{if(gT.iv){stopT();e.target.textContent='ابدأ'}else{startT();e.target.textContent='إيقاف'}};
  $('.rr',o).onclick=()=>{stopT();gT.left=gT.sec;up();$('.ss',o).textContent='ابدأ'}; o._d=()=>{gT.view=null}}); }
function startT(){ gT.iv=setInterval(()=>{gT.left--;gT.view&&gT.view();$('#tTimer').textContent=gT.left>0?'⏱ '+fmt(gT.left):'⏱';$('#tTimer').classList.add('on');if(gT.left<=5&&gT.left>0)sfx.tick();if(gT.left<=0){stopT();sfx.end();toast('⏰ انتهى الوقت!');gT.left=gT.sec}},1000) }
function stopT(){ clearInterval(gT.iv);gT.iv=null;$('#tTimer').textContent='⏱';$('#tTimer').classList.remove('on') }
let picked=[];
function pickModal(){ modal(`<h3>🎲 اختيار تلميذ عشوائي</h3><div class="big pv">؟</div><p class="hint">رقم التلميذ من 1 إلى ${settings.students} · اختير سابقًا: <span class="pl">${picked.join('، ')||'—'}</span></p><div class="row" style="justify-content:center"><button class="btn g pk">اختر 🎲</button><button class="btn w cl">مسح القائمة</button><button class="btn w" data-close>إغلاق</button></div>`,o=>{
  $('.pk',o).onclick=()=>{let pool=[];for(let i=1;i<=settings.students;i++)if(!picked.includes(i))pool.push(i);if(!pool.length){picked=[];pool=Array.from({length:settings.students},(_,i)=>i+1)}let n=0;const iv=setInterval(()=>{$('.pv',o).textContent=pool[Math.random()*pool.length|0];sfx.tick();if(++n>14){clearInterval(iv);const v=pool[Math.random()*pool.length|0];picked.push(v);$('.pv',o).textContent=v;$('.pl',o).textContent=picked.join('، ');sfx.ok();confetti(40)}},80)};
  $('.cl',o).onclick=()=>{picked=[];$('.pl',o).textContent='—'}}); }
function settingsModal(){ modal(`<h3>⚙️ الإعدادات</h3>${teams.map((t,i)=>`<label>اسم الفريق ${i+1}<input id="tn${i}" value="${esc(t.n)}"></label>`).join('')}
  <label>عدد الفرق<span><button class="btn w tc" data-v="-1" style="font-size:16px">−</button> <b class="tcv">${teams.length}</b> <button class="btn w tc" data-v="1" style="font-size:16px">+</button></span></label>
  <label>عدد التلاميذ في الصف<input id="stn" type="number" min="2" max="45" value="${settings.students}"></label>
  <label>المؤثرات الصوتية<input id="snd" type="checkbox" ${settings.sound?'checked':''} style="width:auto"></label>
  <div class="row" style="justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn g sv">حفظ</button><button class="btn w zr">تصفير النقاط</button><button class="btn w" data-close>إغلاق</button></div>`,o=>{
  const C=['#e09a00','#23864f','#2463a8','#c2185b'],N=['الشمس','الأوراق','السماء','الزهور'];
  $$('.tc',o).forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(v>0&&teams.length<4)teams.push({n:N[teams.length],c:C[teams.length],s:0});if(v<0&&teams.length>2)teams.pop();o.remove();saveTeams();settingsModal()});
  $('.sv',o).onclick=()=>{teams.forEach((t,i)=>{const v=$('#tn'+i,o).value.trim();if(v)t.n=v});settings.students=Math.max(2,Math.min(45,+$('#stn',o).value||25));settings.sound=$('#snd',o).checked;store.set('settings',settings);saveTeams();o.remove();toast('تم الحفظ ✔')};
  $('.zr',o).onclick=()=>{teams.forEach(t=>t.s=0);saveTeams();toast('تم تصفير النقاط')}}); }
function helpModal(){ modal(`<h3>⌨️ طريقة الاستخدام</h3><div class="read" style="text-align:right;font-size:18px">
  <p><span class="kbd">←</span> أو <span class="kbd">مسافة</span>: الخطوة التالية (تكشف العناصر واحدًا تلو الآخر ثم تنتقل للشريحة التالية)</p><p><span class="kbd">→</span>: الشريحة السابقة</p>
  <p><span class="kbd">N</span>: إظهار/إخفاء إرشاد المعلّم · <span class="kbd">T</span>: المؤقت · <span class="kbd">R</span>: اختيار تلميذ · <span class="kbd">F</span>: ملء الشاشة · <span class="kbd">H</span>: الرئيسية</p>
  <p>في ألعاب السحب: اسحب البطاقة إلى مكانها، أو اضغط عليها ثم اضغط على المكان (مناسب للسبورة التفاعلية).</p><p>بعد كل إجابة صحيحة تظهر لوحة لمنح نقطة للفريق.</p></div><button class="btn w" data-close>فهمت</button>`); }
function fs(){ try{ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast('ملء الشاشة غير متاح هنا')) }catch(e){toast('ملء الشاشة غير متاح هنا')} }
function toggleNotes(){ notesOn=!notesOn; $$('.note-panel').forEach(n=>n.hidden=!notesOn); $('#tNotes').classList.toggle('on',notesOn); }

$('#tHome').onclick=goHome; $('#tTimer').onclick=timerModal; $('#tPick').onclick=pickModal; $('#tNotes').onclick=toggleNotes; $('#tFs').onclick=fs; $('#tSet').onclick=settingsModal;
$('#nNext').onclick=next; $('#nPrev').onclick=prev; $('.dots').onclick=e=>{const d=e.target.closest('[data-j]');if(d)go(+d.dataset.j)};
addEventListener('keydown',e=>{ if($('#player').hidden||e.target.closest('input')||$('.overlay'))return; const k=e.key;
  if(k==='ArrowLeft'||k===' '||k==='PageDown'){e.preventDefault();next()} else if(k==='ArrowRight'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='n'||k==='N'||k==='ى')toggleNotes(); else if(k==='t'||k==='T'||k==='ف')timerModal(); else if(k==='r'||k==='R'||k==='ق')pickModal(); else if(k==='f'||k==='F'||k==='ب')fs(); else if(k==='h'||k==='H'||k==='ا')goHome(); });

/* ---------- home ---------- */
function goHome(){ if(api&&api.destroy)api.destroy(); api=null; curL=null; $('#player').hidden=true; $('#home').hidden=false; drawHome(); }
function drawHome(){ const last=store.get('last',null); const ll=last&&LESSONS.find(l=>l.id===last.id);
  $('#home').innerHTML=`<div class="h-top"><div class="brand"><div class="badge"><span class="emo">🔬</span></div><div><h1>العلوم · الصف الأول</h1><p>الفصل الدراسي الأول · عروض تفاعلية لكل دروس كتاب التلميذ وكتاب النشاط</p></div></div>
  <div class="h-tools">${ll?`<button class="pill" id="hRes">▶ متابعة: ${ll.id} ${ll.title}</button>`:''}<button class="pill" id="hSet">⚙️ الفرق والإعدادات</button><button class="pill" id="hHelp">⌨️ طريقة الاستخدام</button></div></div>
  <div class="units">${Object.entries(UNITS).map(([u,U])=>`<section class="unit"><div class="unit-h"><div class="unit-n" style="background:${U.c}">${U.n}</div><div><h2>${U.name.replace(/^الوحدة \S+: /,'')}</h2><span>${U.sub}</span></div></div>
  <div class="lessons">${LESSONS.filter(l=>String(l.unit)===u).map(l=>`<button class="ls ${l.kind==='review'?'review':''}" data-id="${l.id}"><span class="emo ic">${l.icon}</span><span class="code">${l.code||((l.kind==='review'?'مراجعة الوحدة':'الدرس')+' '+l.id)} · ص ${l.pages}</span><b>${l.title}</b><small>${l.slides.length+(l.slides[0].type==='cover'?0:1)} شريحة · ${[...new Set(l.slides.map(s=>s.ph).filter(p=>p&&p!=='ahdaf'))].map(p=>PH[p]).slice(0,5).join(' · ')}</small></button>`).join('')}</div></section>`).join('')}</div>
  <p class="h-foot">💡 استخدم الأسهم <span class="kbd">←</span> <span class="kbd">→</span> للتنقل، و<span class="kbd">N</span> لإظهار إرشاد المعلّم في كل شريحة. لوحة نقاط الفرق والمؤقت واختيار التلميذ العشوائي في الشريط العلوي أثناء العرض.</p>`;
  $$('.ls').forEach(b=>b.onclick=()=>openLesson(b.dataset.id)); const r=$('#hRes'); if(r)r.onclick=()=>openLesson(last.id,last.i); $('#hSet').onclick=settingsModal; $('#hHelp').onclick=helpModal; }

drawTeams(); drawHome();
if(location.hash){ const id=location.hash.slice(1).replace('L','').replace('_','-'); if(LESSONS.find(l=>l.id===id))openLesson(id); }
window.__deck={openLesson,go,next,R};
})();
</script>

</html>
