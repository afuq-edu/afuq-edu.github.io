<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1828" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المجال الأول">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>منصة المجال الأول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a morning-sky app shell. Right-hand sidebar (RTL) on wide screens, drawer + bottom bar on phones;
   school navy for text, school gold for the one accent, sage/rose only for done / needs-attention. */
:root{
  --sky:#F3F7FB; --sky-2:#E7F0F8; --paper:#FFFFFF; --ink:#1B2E4F; --ink-2:#506482; --ink-3:#7F90A8;
  --gold:#B48529; --gold-soft:#F7EEDA; --sea:#2D6A8C; --sea-soft:#E1EEF6;
  --sage:#3F7F5E; --sage-soft:#E2F1E8; --rose:#B9483D; --rose-soft:#F9E6E3; --amber:#A86E12; --amber-soft:#FBEFD9;
  --line:#DAE4EE; --shadow:0 1px 2px rgba(27,46,79,.06),0 6px 20px rgba(27,46,79,.06);
  --f-display:"El Messiri","Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0E1828; --sky-2:#132238; --paper:#15233A; --ink:#E7EDF6; --ink-2:#AFC0D6; --ink-3:#7F92AD;
  --gold:#DDB563; --gold-soft:#2E2718; --sea:#86BCDB; --sea-soft:#17304A;
  --sage:#82C6A1; --sage-soft:#16302A; --rose:#EE978C; --rose-soft:#3A1F22; --amber:#E9B65C; --amber-soft:#35290F;
  --line:#253750; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0E1828; --sky-2:#132238; --paper:#15233A; --ink:#E7EDF6; --ink-2:#AFC0D6; --ink-3:#7F92AD;
  --gold:#DDB563; --gold-soft:#2E2718; --sea:#86BCDB; --sea-soft:#17304A;
  --sage:#82C6A1; --sage-soft:#16302A; --rose:#EE978C; --rose-soft:#3A1F22; --amber:#E9B65C; --amber-soft:#35290F;
  --line:#253750; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--sky)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.35;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num,table{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain;border:1px solid var(--line)}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.layout{display:grid;grid-template-columns:1fr;max-width:1320px;margin-inline:auto}
.side{display:none}
main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:980px){
  .layout{grid-template-columns:260px 1fr}
  .side{display:block;position:sticky;top:calc(61px + env(safe-area-inset-top,0px));height:calc(100vh - 61px);overflow:auto;padding:18px 14px 18px 0;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .bottom,#menuBtn{display:none!important}
  main{padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;color:var(--ink-3)}
.nav a:hover{background:var(--sky-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.nav a[aria-current="page"] svg{color:var(--gold)}
.nav .sep{height:1px;background:var(--line);margin:8px 12px}
.nav .cap{font-size:12px;letter-spacing:.02em;color:var(--ink-3);padding:6px 12px 2px}
.drawer{position:fixed;inset:0;z-index:50;display:flex}
.drawer .scrim{position:absolute;inset:0;background:rgba(10,20,35,.35)}
.drawer .panel{position:relative;margin-inline-start:0;width:min(320px,86vw);height:100%;background:var(--sky);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:4px 0;border-radius:10px}
.bottom a svg{width:22px;height:22px}
.bottom a[aria-current="page"]{color:var(--gold)}

/* ---------- page parts ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:clamp(24px,4vw,32px)}
.ph p{color:var(--ink-2);max-width:62ch}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:4px}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:21px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
:root[data-theme="dark"] .btn.gold{color:#1b1406}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.gold{color:#1b1406}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--sky-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--sage-soft);color:var(--sage)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--rose-soft);color:var(--rose)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.sea{background:var(--sea-soft);color:var(--sea)}
.seg{display:inline-flex;background:var(--sky-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;min-width:0}
textarea.input{min-height:92px;resize:vertical}
textarea.note-in{min-width:170px;min-height:64px}
.input:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);border-color:var(--gold)}
.bar{height:8px;background:var(--sky-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar.gold>i{background:var(--gold)}
.bar.sea>i{background:var(--sea)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);background:var(--sky-2);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.diamond{display:inline-block;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin-inline:6px;vertical-align:middle}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px;background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--gold) 22%,transparent) 0%, transparent 46%),
  linear-gradient(180deg,var(--sea-soft),var(--paper));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(-45deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.35}
.hero-in{position:relative;display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:720px){.hero-in{grid-template-columns:auto 1fr;align-items:center}}
.hero img{width:112px;height:112px;object-fit:contain;background:#fff;border-radius:24px;padding:6px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(24px,4.4vw,36px)}
.hero .who{color:var(--ink-2);margin-top:4px}
.hero .date{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.motto{font-family:var(--f-display);color:var(--gold);font-size:18px;margin-top:6px}
.vision{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:820px){.vision{grid-template-columns:1.25fr 1fr}}
.vision .v{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;position:relative}
.vision .v h3{font-size:15px;color:var(--gold);font-family:var(--f-body);font-weight:600;letter-spacing:.02em;margin-bottom:6px}
.vision .big{font-family:var(--f-display);font-size:clamp(20px,2.6vw,25px);line-height:1.6;color:var(--ink)}
.values{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.values span{border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:13.5px;background:var(--sky)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:96px}
.tile:hover{border-color:var(--gold)}
.tile svg{width:24px;height:24px;color:var(--gold)}
.tile b{font-weight:600;font-size:14px;line-height:1.4}
.todo{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo span{flex:1;min-width:0}
.todo.done span{text-decoration:line-through;color:var(--ink-3)}
.check{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:6px;display:inline-grid;place-items:center;flex:none;margin-top:3px;background:var(--paper)}
.check:checked{background:var(--sage);border-color:var(--sage)}
.check:checked::after{content:"";width:6px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ---------- people ---------- */
.person{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.person:hover{border-color:var(--ink-3)}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;flex:none;background:var(--sea-soft);color:var(--sea)}
.person .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.person .meta b{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* ---------- plan ---------- */
.goal{display:flex;flex-direction:column;gap:12px}
.goal .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{font-size:17px;font-family:var(--f-body);font-weight:600;line-height:1.6}
.acts{display:flex;flex-direction:column}
.act{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line)}
.act label{flex:1;min-width:0}
.act.done label{color:var(--ink-3)}

/* ---------- prep matrix ---------- */
.prep th.t,.prep td.t{position:sticky;right:0;background:var(--paper);z-index:1;min-width:210px;max-width:320px;white-space:normal}
.prep th.t{background:var(--sky-2)}
.prep td.wk{background:var(--sky);font-weight:600;color:var(--ink-2);font-size:13px}
.pnote{display:inline-flex;align-items:center;gap:3px;border:1px dashed var(--line);background:var(--paper);border-radius:8px;padding:3px 6px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.pnote.has{border-style:solid;color:var(--ink)} .pnote.ok{background:var(--sage-soft);border-color:transparent} .pnote.warn{background:var(--amber-soft);border-color:transparent} .pnote.sea{background:var(--sky);border-color:transparent}
.task{align-items:center;flex-wrap:wrap;gap:8px}.task.done .ttext{text-decoration:line-through;opacity:.65}
.tstate{display:flex;gap:4px}.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 9px;font-size:12.5px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;color:var(--ink-2)}
.tbtn svg{width:13px;height:13px}.tbtn.done[aria-pressed=true]{background:var(--sage-soft);border-color:transparent;color:var(--sage);font-weight:600}.tbtn.no[aria-pressed=true]{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-weight:600}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}.wday{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-2);cursor:pointer}
.wday b{font-size:15px;color:var(--ink)}.wday i{width:6px;height:6px;border-radius:50%;background:transparent}.wday i.ok{background:var(--sage)}.wday i.part{background:var(--gold)}.wday[aria-pressed=true]{background:var(--sky);border-color:var(--sea)}
.prep td.c{text-align:center;padding:6px}
.prep th.c{text-align:center;white-space:normal;min-width:78px;font-size:12.5px}
.cell{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);display:inline-grid;place-items:center}
.cell[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--paper)}
.cell svg{width:16px;height:16px}
.tri{min-width:62px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);font-size:12.5px;padding:0 8px}
.tri[data-v="1"]{background:var(--sage-soft);color:var(--sage);border-color:color-mix(in srgb,var(--sage) 45%,transparent)}
.tri[data-v="0"]{background:var(--rose-soft);color:var(--rose);border-color:color-mix(in srgb,var(--rose) 45%,transparent)}

.follow th.grp,.follow td.grp{border-inline-start:2px solid var(--line)}
.num-in{width:58px;height:32px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);text-align:center;font-variant-numeric:tabular-nums}
.num-in:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);border-color:var(--gold)}
.note-in{min-height:0;min-width:180px;font-size:13.5px;padding:6px 9px;resize:vertical}
.follow tr.tot td{background:var(--sky)}
.linkt{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.linkt b{font-size:16px}
.lic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.lic svg{width:19px;height:19px}
.pdbox{border-top:1px dashed var(--line);padding-top:8px}
.doclink{display:inline-flex;align-items:center;gap:6px;color:var(--sea);text-decoration:none;font-size:14px;min-width:0;overflow-wrap:anywhere}
.doclink:hover{text-decoration:underline}
/* ---------- charts ---------- */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:54px 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.hb .track{height:14px;background:var(--sky-2);border-radius:7px;overflow:hidden;position:relative}
.hb .track i{position:absolute;inset:0 0 0 auto;border-radius:7px;background:var(--sea)}
.hb .track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3)}
.stacked{display:flex;height:16px;border-radius:7px;overflow:hidden;background:var(--sky-2)}
.stacked i{display:block;height:100%}
.lv-a{background:var(--sage)} .lv-b{background:color-mix(in srgb,var(--sage) 55%,var(--sea))} .lv-c{background:var(--gold)} .lv-d{background:color-mix(in srgb,var(--rose) 65%,var(--gold))} .lv-e{background:var(--rose)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.poster{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;max-width:100%;background:var(--sky-2)}
.poster-ph{width:100%;aspect-ratio:4/5;border-radius:12px;display:grid;place-items:center;text-align:center;padding:20px;font-family:var(--f-display);font-size:26px;color:var(--ink);
  background:radial-gradient(90% 70% at 70% 20%,var(--gold-soft),transparent 60%),linear-gradient(160deg,var(--sea-soft),var(--sky-2))}

/* ---------- modal + toast ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(620px,calc(100vw - 24px));width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,20,35,.42)}
.sheet{background:var(--paper);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);max-height:min(86vh,820px);display:flex;flex-direction:column}
.sheet header{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet header h3{font-size:19px}
.sheet .body{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet footer{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (min-width:980px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:rise .35s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

const KEY='muzn-field1-v1', KEY_STU='muzn-field1-students', KEY_THEME='muzn-theme';
function fresh(){ const s=clone(SEED.state); s.updatedAt=0; return s; }
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); return Object.assign(fresh(), s); } }catch(e){} return fresh(); }
function migrate(s){
  const seed=SEED.state;
  if(!s.ver || s.ver<2){
    const keep=(s.pd||[]).filter(p=>Object.values(p.att||{}).some(Boolean) || (p.docs||[]).length || p.impact);
    s.pd=clone(seed.pd).concat(keep.filter(k=>!seed.pd.some(n=>n.title===k.title)));
    const vids=new Set((s.visits||[]).map(v=>v.id)); s.visits=(s.visits||[]).concat(clone(seed.visits).filter(v=>!vids.has(v.id)));
    if(!s.teachers.some(t=>t.short===SEED.newTeacher.short)) s.teachers.push(clone(SEED.newTeacher));
    (s.inits||[]).forEach(n=>{ const m=seed.inits.find(x=>x.name===n.name); if(m && !n.img && m.img) n.img=m.img; });
    s.ver=2;
  }
  if(s.ver<3){
    s.supv=s.supv&&s.supv.length? s.supv : clone(seed.supv||[]);
    (SEED.newTeachers||[]).forEach(nt=>{ if(!s.teachers.some(t=>t.short===nt.short)) s.teachers.push(clone(nt)); });
    s.daily=s.daily||{};
    if((s.todos||[]).length){ const d=todayISO(); s.daily[d]=(s.daily[d]||[]).concat(s.todos.map(t=>({id:uid(),text:t.text,st:t.done?'done':''}))); s.todos=[]; }
    s.ver=3;
  }
  s.daily=s.daily||{}; s.supv=s.supv||[]; s.prepNotes=s.prepNotes||{};
  s.links=s.links||[]; s.linksRemoved=s.linksRemoved||[]; s.prepTeachers=s.prepTeachers||{};
  const have=new Set(s.links.map(l=>l.id)); seed.links.forEach(l=>{ if(!have.has(l.id) && !s.linksRemoved.includes(l.id)) s.links.push(clone(l)); });
  return s;
}

let remote = null, remoteTimer;
function save(msg){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(remote){ clearTimeout(remoteTimer); remoteTimer=setTimeout(pushRemote, 900); }
  if(msg) toast(msg);
}
function pushRemote(){ if(!remote) return; remote.set({json:JSON.stringify(S), updatedAt:S.updatedAt}).then(()=>{syncState='on'; },()=>{ syncState='err'; }); }
let syncState='local';
async function initRemote(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc('data/users/'+id+'/state');
    const snap = await ref.get();
    remote = ref; syncState='on';
    if(snap.exists){
      const d = snap.data()||{};
      if((d.updatedAt||0) > (S.updatedAt||0) && d.json){ try{ S = migrate(Object.assign(fresh(), JSON.parse(d.json))); localStorage.setItem(KEY, JSON.stringify(S)); render(); toast('تم تحميل بياناتك المحفوظة'); }catch(e){} }
      else if((S.updatedAt||0) > (d.updatedAt||0)) pushRemote();
    } else if(S.updatedAt) pushRemote();
    if(route==='backup') render();
  }catch(e){ syncState='local'; }
}

  const avg = S.teachers.length? (S.teachers.reduce((a,t)=>a+(+t.exp||0),0)/S.teachers.length).toFixed(1):0;
  const periods = S.teachers.reduce((a,t)=>a+(+t.periods||0),0);
  return pageHead('القسم الأول','بيانات المعلمات','معلمات المجال الأول في مدرسة مزن المعرفة، مع التخصص والخبرة والنصاب وبيانات التواصل.',`<button class="btn gold" data-act="addTeacher">${ic('plus')} إضافة معلمة</button>`)+
  `<div class="grid s" style="margin-bottom:14px">
    <div class="card stat"><span class="k">عدد المعلمات</span><span class="v num">${AR(S.teachers.length)}</span></div>
    <div class="card stat"><span class="k">متوسط سنوات الخبرة</span><span class="v num">${avg}</span></div>
    <div class="card stat"><span class="k">مجموع الحصص الأسبوعية</span><span class="v num">${AR(periods)}</span></div>
    <div class="card stat"><span class="k">عدد الصفوف</span><span class="v num">٤ صفوف · ٢٠ شعبة</span></div></div>
  <div class="row" style="margin-bottom:12px"><div style="position:relative;flex:1;min-width:0;max-width:420px"><input class="input" id="tq" placeholder="ابحثي باسم المعلمة أو المادة" value="${esc(tq)}" data-inp="tq" style="padding-right:38px"><span style="position:absolute;right:11px;top:10px;color:var(--ink-3)">${ic('search','style="width:18px;height:18px"')}</span></div></div>
  <div class="grid">${list.map(t=>`<button class="person" data-act="viewTeacher" data-id="${t.id}">
    <span class="avatar">${esc((t.short||t.name).trim()[0]||'م')}</span>
    <span class="meta"><b>${esc(t.name)}</b><span class="small muted">${esc(t.subjects||'')} · ${esc(t.grades||'')}</span>
    <span class="row" style="gap:6px">${t.exp!==''?`<span class="chip">${AR(t.exp)} سنة خبرة</span>`:''}${t.periods?`<span class="chip sea">${AR(t.periods)} حصة</span>`:''}${t.activities?`<span class="chip gold">${esc(t.activities)}</span>`:''}</span></span></button>`).join('')||'<div class="empty">لا نتائج مطابقة.</div>'}</div>`;
};
V.teachers_after=v=>{ const i=$('#tq',v); if(i && tq){ i.focus(); i.setSelectionRange(tq.length,tq.length);} };
ACT.tq=(d,el)=>{ tq=el.value.trim(); render(); };
ACT.addTeacher=()=>formRecord('إضافة معلمة',T_FIELDS,{qual:'بكالوريوس تربية'},o=>{ o.id=uid(); if(!o.short) o.short=o.name.split(' ').slice(0,1).concat(o.name.split(' ').slice(-1)).join(' '); S.teachers.push(o); save('أُضيفت المعلمة'); render(); });
ACT.viewTeacher=d=>{
  const t=S.teachers.find(x=>x.id===d.id); if(!t) return;
  const asg=S.assign.filter(a=>a.teacher===t.short);
  modal({title:t.name, body:`<dl class="kv">${T_FIELDS.slice(2).map(f=> t[f.k]!==''&&t[f.k]!=null?`<dt>${f.label}</dt><dd>${esc(t[f.k])}${(f.k==='phone'||f.k==='email')?` <button type="button" class="btn sm ghost" data-copy="${esc(t[f.k])}" aria-label="نسخ">${ic('copy','style="width:15px;height:15px"')}</button>`:''}</dd>`:'').join('')}</dl>
   ${asg.length?`<div><h4 style="font-size:15px;margin:6px 0">الشعب المسندة</h4><div class="row">${asg.map(a=>`<span class="chip sea">${esc(a.grade)} / ${esc(a.sec)} · ${esc(a.subject)}</span>`).join('')}</div></div>`:''}`,
   onSave:()=>{ setTimeout(()=>formRecord('تعديل بيانات '+t.short,T_FIELDS,t,o=>{ const old=t.short; Object.assign(t,o); if(o.short && o.short!==old) renameTeacher(old,o.short); save('تم الحفظ'); render(); },()=>{ S.teachers=S.teachers.filter(x=>x!==t); save('حُذفت المعلمة'); render(); }),0); }, saveText:'تعديل'});
  dlg.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{ const txt=b.dataset.copy; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('نُسخ: '+txt),()=>toast(txt)); });
};

/* ---------- ORG ---------- */
let orgTab='assign', dutyDay='الثلاثاء';
const GRADES=['أول','ثاني','ثالث','رابع'], SECS=['أول','ثاني','ثالث','رابع','خامس'], SUBJ=['أحب لغتي','ديني حياتي'];
V.org=()=>{
  let body='';
  if(orgTab==='assign'){
    body=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><p class="muted">من تدرّس كل شعبة في مادتي المجال.</p><button class="btn gold" data-act="addAssign">${ic('plus')} إسناد شعبة</button></div>
    <div class="tablewrap"><table><thead><tr><th>الصف / الشعبة</th>${SUBJ.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>
    ${GRADES.map(g=>SECS.map(s=>`<tr><td><b>${g}</b> / ${s}</td>${SUBJ.map(sj=>{ const a=S.assign.filter(x=>x.grade===g&&x.sec===s&&x.subject===sj); return `<td>${a.map(x=>`<button class="btn sm ghost" data-act="editAssign" data-id="${x.id}">${esc(x.teacher)}</button>`).join('')||'<span class="faint">—</span>'}</td>`; }).join('')}</tr>`).join('')).join('')}
    </tbody></table></div>`;
  } else if(orgTab==='duty'){
    const days=[...new Set(S.duty.map(d=>d.day))]; if(!days.includes(dutyDay)) dutyDay=days[0]||'الثلاثاء';
    const rows=S.duty.filter(d=>d.day===dutyDay);
    body=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="seg">${days.map(d=>`<button data-act="dutyDay" data-d="${d}" aria-pressed="${d===dutyDay}">${d}</button>`).join('')}</div><button class="btn gold" data-act="addDuty">${ic('plus')} دور مناوبة</button></div>
    ${['قبل الطابور وبين الحصص','الفسحة'].map(k=>{ const r=rows.filter(x=>x.kind===k); return r.length?`<h3 style="font-size:17px;margin:14px 0 8px">${k}</h3><div class="tablewrap"><table><thead><tr><th>القسم / الموقع</th><th>المعلمة المناوبة</th><th>المهمة</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${esc(x.area)}</b></td><td>${esc(x.teachers)}</td><td class="muted">${esc(x.task||'—')}</td><td><button class="btn sm ghost" data-act="editDuty" data-id="${x.id}">${ic('edit')}</button></td></tr>`).join('')}</tbody></table></div>`:''; }).join('')}
    ${rows.filter(x=>!['قبل الطابور وبين الحصص','الفسحة'].includes(x.kind)).map(x=>`<p>${esc(x.kind)}: ${esc(x.area)} — ${esc(x.teachers)}</p>`).join('')}
    <p class="faint small" style="margin-top:10px">معًا .. لبيئة مدرسية آمنة ومنظمة</p>`;
  } else {
    const t=todayISO(); const list=[...S.radio].sort((a,b)=>a.date.localeCompare(b.date)); const nx=list.find(r=>r.date>=t);
    body=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><p class="muted">دوري إذاعة المجال الأول يوم الثلاثاء من كل أسبوع.</p><button class="btn gold" data-act="addRadio">${ic('plus')} موعد إذاعة</button></div>
    <div class="tablewrap"><table><thead><tr><th>اليوم</th><th>التاريخ</th><th>المعلمة</th><th>الحالة</th><th>التوثيق</th><th></th></tr></thead><tbody>
    ${list.map(r=>`<tr ${r===nx?'style="background:var(--gold-soft)"':''}><td>${esc(new Date(r.date+'T00:00:00').toLocaleDateString('ar-OM',{weekday:'long'}))}</td><td class="num">${fmtDate(r.date)}</td><td><b>${esc(r.teacher)}</b></td><td>${r===nx?'<span class="chip gold">القادمة</span>':r.date<t?'<span class="chip ok">نُفّذت</span>':'<span class="chip">مجدولة</span>'}</td><td><div class="row" style="gap:4px;flex-wrap:wrap">${(r.docs||[]).map(x=>`<a class="doclink small"${localAttr(x)} href="${esc(docHref(x))}" target="_blank" rel="noopener">${ic(x.asset||x.local?'upload':'link','style="width:14px;height:14px"')}<span>${esc(x.title||'توثيق')}</span></a>`).join('')}<button class="btn sm" style="white-space:nowrap" data-act="radioDocs" data-id="${r.id}" aria-label="إضافة توثيق">${ic('plus')}${(r.docs||[]).length?'':' توثيق'}</button></div></td><td><button class="btn sm ghost" data-act="editRadio" data-id="${r.id}">${ic('edit')}</button></td></tr>`).join('')}
    </tbody></table></div>`;
  }
  return pageHead('القسم الثاني','جداول تنظيم المعلمات','توزيع المعلمات على الشعب، وأدوار المناوبة، ودوري الإذاعة المدرسية.')+
   `<div class="seg" style="margin-bottom:16px">${[['assign','الشعب الدراسية'],['duty','المناوبة'],['radio','الإذاعة']].map(([k,t])=>`<button data-act="orgTab" data-t="${k}" aria-pressed="${k===orgTab}">${t}</button>`).join('')}</div>`+body;
};
ACT.orgTab=d=>{ orgTab=d.t; render(); };
ACT.dutyDay=d=>{ dutyDay=d.d; render(); };
const A_FIELDS=()=>[{k:'teacher',label:'المعلمة',type:'select',options:teacherNames()},{k:'grade',label:'الصف',type:'select',options:GRADES},{k:'sec',label:'الشعبة',type:'select',options:SECS},{k:'subject',label:'المادة',type:'select',options:SUBJ}];
ACT.addAssign=()=>formRecord('إسناد شعبة',A_FIELDS(),{},o=>{ o.id=uid(); S.assign.push(o); save('تم الإسناد'); render(); });
ACT.editAssign=d=>{ const a=S.assign.find(x=>x.id===d.id); formRecord('تعديل الإسناد',A_FIELDS(),a,o=>{Object.assign(a,o); save('تم الحفظ'); render();},()=>{ S.assign=S.assign.filter(x=>x!==a); save('حُذف الإسناد'); render(); }); };
const D_FIELDS=[{k:'day',label:'اليوم',type:'select',options:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس']},{k:'kind',label:'الفترة',type:'select',options:['قبل الطابور وبين الحصص','الفسحة']},{k:'area',label:'القسم / الموقع'},{k:'teachers',label:'المعلمة المناوبة'},{k:'task',label:'المهمة'}];
ACT.addDuty=()=>formRecord('دور مناوبة',D_FIELDS,{day:dutyDay},o=>{ o.id=uid(); S.duty.push(o); dutyDay=o.day; save('أُضيف الدور'); render(); });
ACT.editDuty=d=>{ const a=S.duty.find(x=>x.id===d.id); formRecord('تعديل دور المناوبة',D_FIELDS,a,o=>{Object.assign(a,o); save('تم الحفظ'); render();},()=>{ S.duty=S.duty.filter(x=>x!==a); save('حُذف الدور'); render(); }); };
const R_FIELDS=()=>[{k:'teacher',label:'المعلمة',type:'select',options:teacherNames()},{k:'date',label:'التاريخ',type:'date'},{k:'topic',label:'موضوع الإذاعة (اختياري)'}];
ACT.addRadio=()=>formRecord('موعد إذاعة',R_FIELDS(),{date:todayISO()},o=>{ o.id=uid(); S.radio.push(o); save('أُضيف الموعد'); render(); });
ACT.editRadio=d=>{ const a=S.radio.find(x=>x.id===d.id); formRecord('تعديل موعد الإذاعة',R_FIELDS(),a,o=>{Object.assign(a,o); save('تم الحفظ'); render();},()=>{ S.radio=S.radio.filter(x=>x!==a); save('حُذف الموعد'); render(); }); };

/* ---------- PLAN ---------- */
V.plan=()=>{
  const [d,t]=planProgress();
  const domains=[...new Set(S.plan.map(g=>g.domain))];
  return pageHead('القسم الثالث','خطة المعلم الأول','خطة مادة / مجال للعام الدراسي 2026 / 2027م. علّمي الفعالية عند تنفيذها، وأضيفي ملاحظاتك وملاحظات المشرف.',`<button class="btn gold" data-act="addGoal">${ic('plus')} هدف جديد</button>`)+
  `<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b>الإنجاز الكلي</b><span class="num">${AR(d)} / ${AR(t)} فعالية</span></div><div class="bar gold" style="margin-top:8px;height:10px"><i style="width:${pct(d,t)}%"></i></div></div>`+
  domains.map(dm=>`<div class="section-title"><h2>${esc(dm)}</h2><span class="chip">${AR(S.plan.filter(g=>g.domain===dm).length)} هدف</span></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))">${S.plan.filter(g=>g.domain===dm).map(g=>{ const gd=g.acts.filter(a=>a.done).length; return `<div class="card goal">
     <div class="head"><h3>${esc(g.goal)}</h3><button class="btn sm ghost" data-act="editGoal" data-id="${g.id}" aria-label="تعديل">${ic('edit')}</button></div>
     <div class="row small"><span class="chip">${fmtDate(g.from,{day:'numeric',month:'short',year:'numeric'})} ← ${fmtDate(g.to,{day:'numeric',month:'short',year:'numeric'})}</span><span class="chip ${gd===g.acts.length&&gd?'ok':'warn'}">${gd===g.acts.length&&gd?'مكتمل':esc(g.status||'جارٍ التنفيذ')}</span></div>
     <div class="bar"><i style="width:${pct(gd,g.acts.length)}%"></i></div>
     <div class="acts">${g.acts.map((a,i)=>`<div class="act ${a.done?'done':''}"><input type="checkbox" class="check" id="a_${g.id}_${i}" ${a.done?'checked':''} data-chg="toggleAct" data-id="${g.id}" data-i="${i}"><label for="a_${g.id}_${i}">${esc(a.t)}</label></div>`).join('')}</div>
     ${g.notes?`<p class="small muted"><b>ملاحظات:</b> ${esc(g.notes)}</p>`:''}${g.supNotes?`<p class="small muted"><b>ملاحظات المشرف:</b> ${esc(g.supNotes)}</p>`:''}
     <div><button class="btn sm" data-act="addAct" data-id="${g.id}">${ic('plus')} فعالية</button></div></div>`; }).join('')}</div>`).join('');
};
const G_FIELDS=[{k:'domain',label:'المجال الإشرافي',list:['الإنجاز الدراسي','التدريس والتقويم','القيادة والإدارة والحوكمة','النمو الشخصي','مناخ المدرسة وبيئة التعلم']},{k:'from',label:'من',type:'date'},{k:'to',label:'إلى',type:'date'},{k:'status',label:'آلية التنفيذ',type:'select',options:['جارٍ التنفيذ','نُفّذ','لم يُنفّذ','مؤجل']},{k:'goal',label:'الهدف',type:'textarea'},{k:'acts',label:'الأساليب والأنشطة (كل فعالية في سطر)',type:'textarea'},{k:'notes',label:'ملاحظات',type:'textarea'},{k:'supNotes',label:'ملاحظات المشرف',type:'textarea'}];
function goalForm(g,isNew){
  const rec={...g, acts:g.acts.map(a=>a.t).join('\n')};
  const f=[...G_FIELDS]; f.unshift(f.splice(4,1)[0]); // goal first for validation
  formRecord(isNew?'هدف جديد':'تعديل الهدف', f, rec, o=>{
    const lines=String(o.acts).split('\n').map(s=>s.trim()).filter(Boolean);
    const old=g.acts; o.acts=lines.map(t=>({t, done:(old.find(a=>a.t===t)||{}).done||false}));
    if(isNew){ o.id=uid(); S.plan.push(o);} else Object.assign(g,o);
    save('تم حفظ الهدف'); render();
  }, isNew?null:()=>{ S.plan=S.plan.filter(x=>x!==g); save('حُذف الهدف'); render(); });
}
ACT.addGoal=()=>goalForm({domain:'الإنجاز الدراسي',goal:'',acts:[],from:todayISO(),to:'',status:'جارٍ التنفيذ'},true);
ACT.editGoal=d=>goalForm(S.plan.find(g=>g.id===d.id),false);
ACT.toggleAct=(d,el)=>{ const g=S.plan.find(x=>x.id===d.id); g.acts[d.i].done=el.checked; save(el.checked?'أُحسنتِ! سُجّل التنفيذ':''); render(); };
ACT.addAct=d=>{ const g=S.plan.find(x=>x.id===d.id); formRecord('فعالية جديدة',[{k:'t',label:'الفعالية'}],{},o=>{ g.acts.push({t:o.t,done:false}); save('أُضيفت الفعالية'); render(); }); };

/* ---------- FOLLOW ---------- */
const MONTHS=['سبتمبر','أكتوبر','نوفمبر','ديسمبر','يناير','فبراير','مارس','أبريل','مايو'];
const CRIT=[['prep','التحضير في المنصة'],['grades','تفعيل سجل الدرجات'],['correct','التصحيح والتغذية الراجعة'],['forms','تفعيل الاستمارات']];
const INITS_F=[['curious','كن فضوليًا'],['can','أنا أستطيع'],['dict','تحدي الإملاء'],['reader','قراء المزن']];
let fPeriod=(()=>{ const m=new Date().getMonth(); const map={8:0,9:1,10:2,11:3,0:4,1:5,2:6,3:7,4:8}; return map[m]??0; })();
function fKey(tid){ return tid+'|m'+fPeriod; }
function fRec(tid){ const k=fKey(tid); const r=S.follow[k]||(S.follow[k]={c:{},i:{},rec:'',impact:''}); if(r.rec==null) r.rec=r.note||''; return r; }
V.follow=()=>{
  const recs=S.teachers.map(t=>({t, r:S.follow[fKey(t.id)]||{c:{},i:{},rec:'',impact:''}}));
  let done=0,tot=0; recs.forEach(({r})=>CRIT.forEach(([k])=>{ if(r.c[k]!=null){tot++; if(r.c[k]===1) done++;} }));
  const iTot={}; INITS_F.forEach(([k])=>iTot[k]=recs.reduce((a,{r})=>a+(+r.i[k]||0),0));
  const label=v=> v===1?'نفّذ':v===0?'لم ينفّذ':'—';
  return pageHead('القسم الرابع','خطة المتابعة للمعلمات','استمارة متابعة الأعمال لكل معلمة في كل شهر. اضغطي خانة المعيار لتتبدل بين: نفّذ، لم ينفّذ، فارغة، واكتبي عدد مرات تفعيل كل مبادرة.')+
  `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="seg">${MONTHS.map((p,i)=>`<button data-act="fPeriod" data-i="${i}" aria-pressed="${i===fPeriod}">${p}</button>`).join('')}</div><span class="chip ${tot&&done===tot?'ok':'sea'}">${AR(done)} منفّذ من ${AR(tot)} مُتابَع</span></div>
  <div class="tablewrap prep follow"><table><thead>
   <tr><th class="t" rowspan="2">المعلمة</th>${CRIT.map(c=>`<th class="c" rowspan="2">${c[1]}</th>`).join('')}<th class="c grp" colspan="${INITS_F.length}">تفعيل المبادرات (العدد)</th><th rowspan="2" class="grp">التوصيات</th><th rowspan="2">متابعة الأثر</th></tr>
   <tr>${INITS_F.map(([k,n],i)=>`<th class="c ${i===0?'grp':''}">${n}</th>`).join('')}</tr></thead><tbody>
  ${recs.map(({t,r})=>`<tr><td class="t"><b>${esc(t.short)}</b></td>${CRIT.map(([k])=>`<td class="c"><button class="tri" data-act="tri" data-id="${t.id}" data-k="${k}" data-v="${r.c[k]??''}">${label(r.c[k])}</button></td>`).join('')}
   ${INITS_F.map(([k,n],i)=>`<td class="c ${i===0?'grp':''}"><input class="num-in" type="number" min="0" inputmode="numeric" aria-label="${n} — ${esc(t.short)}" value="${r.i[k]===true?1:(r.i[k]||'')}" placeholder="0" data-inp="fInit" data-id="${t.id}" data-k="${k}"></td>`).join('')}
   <td class="grp"><textarea class="input note-in" rows="2" aria-label="التوصيات — ${esc(t.short)}" placeholder="توصية" data-inp="fText" data-id="${t.id}" data-k="rec">${esc(r.rec??r.note??'')}</textarea></td>
   <td><textarea class="input note-in" rows="2" aria-label="متابعة الأثر — ${esc(t.short)}" placeholder="ما الأثر الملاحظ؟" data-inp="fText" data-id="${t.id}" data-k="impact">${esc(r.impact||'')}</textarea></td></tr>`).join('')}
  <tr class="tot"><td class="t"><b>المجموع</b></td>${CRIT.map(()=>'<td></td>').join('')}${INITS_F.map(([k],i)=>`<td class="c num ${i===0?'grp':''}" id="itot_${k}"><b>${AR(iTot[k])}</b></td>`).join('')}<td class="grp"></td><td></td></tr>
  </tbody></table></div>
  <p class="small faint" style="margin-top:8px">التوصيات ومتابعة الأثر والأعداد تُحفظ تلقائيًا أثناء الكتابة.</p>
  <div class="section-title"><h2>ملاحظات وتوصيات شهر ${MONTHS[fPeriod]}</h2></div>
  <div class="card"><textarea class="input" id="frec" data-inp="fRecNote" placeholder="اكتبي ملاحظاتك وتوصياتك العامة لشهر ${MONTHS[fPeriod]}">${esc(S.followNotes['m'+fPeriod]||'')}</textarea><p class="small faint" style="margin-top:6px">تُحفظ تلقائيًا.</p></div>`;
};
ACT.fPeriod=d=>{ fPeriod=+d.i; render(); };
ACT.tri=d=>{ const r=fRec(d.id); const v=r.c[d.k]; r.c[d.k]= v==null?1: v===1?0: null; if(r.c[d.k]==null) delete r.c[d.k]; save(); const y=scrollY; render(); scrollTo(0,y); };
let fsT; function saveSoon(){ clearTimeout(fsT); fsT=setTimeout(()=>save(),500); }

/* ---------- daily tasks ---------- */
let dDay=null;
const ST_TXT={done:'نُفّذت',no:'لم تُنفّذ','':'لم تُحدَّد'};
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function dayName(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('ar-OM',{weekday:'long'}); }
function taskRows(L,day){ return L.map(t=>`<div class="todo task ${t.st==='done'?'done':''}">

  const day=dDay||todayISO(); const L=S.daily[day]||[];

     <div style="text-align:center"><b style="font-size:18px">${dayName(day)}</b><div class="small muted num">${fmtDate(day)}${day===todayISO()?' · اليوم':''}</div></div>

   <div class="row" style="justify-content:center;margin-top:10px;gap:8px"><input class="input" type="date" value="${day}" data-chg="dPick" aria-label="اختيار اليوم" style="max-width:190px">${day!==todayISO()?`<button class="btn sm" data-act="dToday">اليوم</button>`:''}</div>
   <div class="weekstrip">${week.map(w=>{ const l=S.daily[w]||[]; const dn=l.filter(t=>t.st==='done').length; return `<button class="wday" aria-pressed="${w===day}" data-act="dGo" data-d="${w}"><span>${dayName(w).replace('ال','').slice(0,6)}</span><b class="num">${w.slice(8)}</b><i class="${l.length?(dn===l.length?'ok':'part'):''}"></i></button>`; }).join('')}</div></div>
  ${L.length?`<div class="row" style="gap:8px;margin-bottom:10px"><span class="chip ok">${AR(done)} نُفّذت</span><span class="chip warn">${AR(no)} لم تُنفّذ</span><span class="chip">${AR(L.length-done-no)} بانتظار التحديد</span></div>`:''}
  <div class="card">${L.length?taskRows(L,day):`<p class="muted">لا مهام لهذا اليوم. اضغطي «مهمة» لإضافة أعمالك.</p>`}
   <form class="row" data-quick="${day}" style="margin-top:12px;gap:8px" onsubmit="return false"><input class="input" name="q" placeholder="مهمة سريعة ثم Enter" style="flex:1"><button class="btn sm" type="submit">${ic('plus')} إضافة</button></form></div>

};
document.addEventListener('submit',e=>{ const f=e.target.closest('form[data-quick]'); if(!f) return; e.preventDefault(); const v=f.elements.q.value.trim(); if(!v) return; const d=f.dataset.quick; (S.daily[d]=S.daily[d]||[]).push({id:uid(),text:v,st:''}); save('أُضيفت المهمة'); render(); setTimeout(()=>{ const q=document.querySelector('form[data-quick] input'); q&&q.focus(); },30); });

const stOut=v=>v==='نُفّذت'?'done':v==='لم تُنفّذ'?'no':'';
ACT.tAdd=()=>{ const day=dDay||todayISO(); formRecord('مهمة ليوم '+dayName(day),TK_FIELDS,{st:'لم تُحدَّد'},o=>{ (S.daily[day]=S.daily[day]||[]).push({id:uid(),text:o.text,note:o.note,st:stOut(o.st)}); save('أُضيفت المهمة'); render(); }); };
ACT.tEdit=d=>{ const L=S.daily[d.day]; const t=L.find(x=>x.id===d.id); formRecord('تعديل المهمة',TK_FIELDS,{...t,st:ST_TXT[t.st||'']},o=>{ t.text=o.text; t.note=o.note; t.st=stOut(o.st); save('تم الحفظ'); render(); },()=>{ S.daily[d.day]=L.filter(x=>x!==t); save('حُذفت المهمة'); render(); }); };
ACT.tSt=d=>{ const t=(S.daily[d.day]||[]).find(x=>x.id===d.id); if(!t) return; t.st= t.st===d.st? '' : d.st; save(); const y=scrollY; render(); scrollTo(0,y); };
ACT.dMove=d=>{ dDay=addDays(dDay||todayISO(),+d.n); render(); };
ACT.dGo=d=>{ dDay=d.d; render(); };
ACT.dToday=()=>{ dDay=null; render(); };
ACT.dPick=(d,el)=>{ if(el.value){ dDay=el.value; render(); } };
ACT.dCarry=d=>{ const day=dDay||todayISO(); const from=S.daily[d.from]||[]; const mv=from.filter(t=>t.st!=='done'); mv.forEach(t=>{ t.st='no'; (S.daily[day]=S.daily[day]||[]).push({id:uid(),text:t.text,note:t.note,st:''}); }); save('نُقلت المهام'); render(); };

    <div class="card stat"><span class="k">الزيارات المخططة</span><span class="v num">${AR(all.length)}</span></div>

    <div class="card stat"><span class="k">مضى موعدها ولم تُعلَّم</span><span class="v num">${AR(due)}</span><span class="s">راجعيها وحدّثي حالتها</span></div></div>
  <div class="row" style="margin-bottom:12px;gap:8px"><div class="seg">${[['all','الكل'],['todo','المتبقية'],['done','المنفّذة']].map(([k,l])=>`<button data-act="svF" data-f="${k}" aria-pressed="${svFilter===k}">${l}</button>`).join('')}</div>
   <select class="input" data-chg="svT" aria-label="تصفية حسب المعلمة" style="max-width:220px"><option value="">كل المعلمات</option>${teacherNames().map(n=>`<option ${svFilter===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
  ${Object.keys(byM).length? Object.keys(byM).sort().map(k=>`<h3 style="font-size:17px;margin:16px 0 8px">${k==='—'?'بلا تاريخ':MONTHS_ALL[+k.slice(5,7)-1]+' '+k.slice(0,4)}</h3>
   <div class="tablewrap"><table><thead><tr><th>المعلمة</th><th>الأسبوع / التاريخ</th><th>نوع الزيارة</th><th>الحالة</th><th>ملاحظات</th><th></th></tr></thead><tbody>

    <td><button class="btn sm ${v.status==='تمت'?'':'ghost'}" data-act="svDone" data-id="${v.id}" aria-pressed="${v.status==='تمت'}">${v.status==='تمت'?ic('tick')+' تمت':'<span class="chip '+svChip(v.status)+'">'+esc(v.status||'مخطط لها')+'</span>'}</button></td>
    <td class="small muted" style="max-width:260px">${esc(v.notes||'')}${(v.docs||[]).length?` <span class="chip">${AR(v.docs.length)} توثيق</span>`:''}</td>
    <td><button class="btn sm ghost" data-act="svEdit" data-id="${v.id}" aria-label="تعديل">${ic('edit')}</button></td></tr>`).join('')}</tbody></table></div>`).join('') : '<div class="empty">لا زيارات في هذا العرض.</div>'}
  <div class="section-title"><h2>عدد الزيارات لكل معلمة</h2></div>

};

/* ---------- PD ---------- */
let assetsNS=null;
async function getAssets(){ if(assetsNS!==null) return assetsNS; try{ assetsNS = (window.claude&&window.claude.use)? (await window.claude.use('assets')) : null; }catch(e){ assetsNS=null; } return assetsNS; }
function docHref(x){ return x.asset? '/_blob/'+x.asset : x.local? '#' : x.url; }
/* files saved on this device (installed app): IndexedDB */
const MEDIA={db:null,
  open(){ if(this.db) return this.db; this.db=new Promise((ok,no)=>{ const r=indexedDB.open('muzn-media',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); return this.db; },
  async tx(mode,fn){ const db=await this.open(); return new Promise((ok,no)=>{ const t=db.transaction('files',mode); const q=fn(t.objectStore('files')); t.oncomplete=()=>ok(q&&q.result); t.onerror=()=>no(t.error); t.onabort=()=>no(t.error); }); },
  put(id,blob){ try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){} return this.tx('readwrite',st=>st.put(blob,id)); },
  get(id){ return this.tx('readonly',st=>st.get(id)); },
  del(id){ return this.tx('readwrite',st=>st.delete(id)); }};
document.addEventListener('click',async e=>{ const a=e.target.closest('a[data-local]'); if(!a) return; e.preventDefault();
  try{ const b=await MEDIA.get(a.dataset.local); if(!b){ toast('الملف غير موجود على هذا الجهاز'); return; } const u=URL.createObjectURL(b); window.open(u,'_blank')||(location.href=u); setTimeout(()=>URL.revokeObjectURL(u),60000); }catch(err){ toast('تعذّر فتح الملف'); } });
const localAttr=x=>x.local?` data-local="${esc(x.local)}"`:'';

};

ACT.pdImpact=d=>{ const p=S.pd.find(x=>x.id===d.id); formRecord('متابعة الأثر — '+p.title,[{k:'impactLevel',label:'مستوى الأثر',type:'select',options:IMPACT},{k:'impactDate',label:'تاريخ آخر متابعة',type:'date'},{k:'impact',label:'متابعة الأثر: ماذا لاحظتِ في الصفوف بعد البرنامج؟ (الزيارات، الممارسات، الشواهد)',type:'textarea'}],
  {impactLevel:p.impactLevel||IMPACT[1], impactDate:p.impactDate||todayISO(), impact:p.impact||''}, o=>{ Object.assign(p,o); save('تم حفظ متابعة الأثر'); render(); }); };
ACT.pdDocs=d=>docsModal(S.pd.find(x=>x.id===d.id),p=>'توثيق: '+p.title);
ACT.radioDocs=d=>docsModal(S.radio.find(x=>x.id===d.id),r=>'توثيق إذاعة '+r.teacher+(r.date?' · '+fmtDate(r.date):''));
async function docsModal(p,titleOf){
  p.docs=p.docs||[];
  const A=await getAssets();
  const list=()=>p.docs.length? p.docs.map((x,i)=>`<div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 10px"><a class="doclink"${localAttr(x)} href="${esc(docHref(x))}" target="_blank" rel="noopener"><span>${esc(x.title||x.url||'ملف مرفق')}</span></a><button type="button" class="btn sm ghost" data-rm="${i}">حذف</button></div>`).join('') : '<p class="small faint">لا توثيق بعد.</p>';
  const f=modal({title:titleOf(p), body:`
    <div class="field"><label for="dT">العنوان</label><input class="input" id="dT" name="dT" placeholder="مثال: تسجيل الورشة، صور التطبيق في الصف"></div>
    <div class="field"><label for="dU">الرابط (يوتيوب، Google Drive، OneDrive…)</label><input class="input" id="dU" name="dU" type="url" inputmode="url" placeholder="https://" dir="ltr"></div>
    ${A?`<div class="field"><label for="dF">أو ارفعي ملفًا من جهازك (فيديو أو صورة أو PDF، حتى 20 ميغابايت)</label><input class="input" id="dF" name="dF" type="file" accept="video/*,image/*,application/pdf"></div>`:(window.indexedDB?`<div class="field"><label for="dF">أو ارفعي فيديو أو صورة أو PDF من جهازك</label><input class="input" id="dF" name="dF" type="file" accept="video/*,image/*,application/pdf"><p class="small faint" style="margin-top:4px">يُحفظ الملف داخل المنصة على هذا الجهاز. انسخي ملف النسخة الاحتياطية دوريًا، ولا تمسحي بيانات المتصفح.</p></div>`:'')}
    <div id="dList" class="stack" style="gap:6px">${list()}</div>`, saveText:'إضافة التوثيق',
    onSave:f=>{
      const title=f.elements.dT.value.trim(), url=f.elements.dU.value.trim(), file=f.elements.dF&&f.elements.dF.files[0];
      if(!url && !file){ toast('أضيفي رابطًا أو اختاري ملفًا'); return false; }
      if(url && !/^https?:\/\//i.test(url)){ toast('الرابط يجب أن يبدأ بـ https://'); return false; }
      if(url){ p.docs.push({title:title||url,url,date:todayISO()}); save('أُضيف الرابط'); render(); }
      if(file && !A){
        const id='m'+uid(); toast('جارٍ حفظ الملف…');
        MEDIA.put(id,file).then(()=>{ p.docs.push({title:title||file.name,local:id,type:file.type,date:todayISO()}); save('تم حفظ الملف في المنصة'); render(); },
          ()=>toast('تعذّر حفظ الملف، قد تكون مساحة الجهاز غير كافية. أضيفي رابطًا بدلًا منه'));
      }
      else if(file){
        toast('جارٍ رفع الملف…');
        A.upload(file).then(r=>{ p.docs.push({title:title||file.name,asset:r.id,type:r.contentType,date:todayISO()}); save('تم رفع الملف'); render(); },
          e=>toast(e&&e.code==='too_large'?'الملف أكبر من 20 ميغابايت. ارفعيه على Drive وأضيفي رابطه':e&&e.code==='unsupported_type'?'هذا النوع من الملفات غير مدعوم':'تعذّر رفع الملف. أضيفي رابطًا بدلًا منه'));
      }
    }});
  $('#dList',f).addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(!b) return; if(!b.dataset.armed){ b.dataset.armed=1; b.textContent='تأكيد الحذف'; return; } const gone=p.docs.splice(+b.dataset.rm,1)[0]; if(gone&&gone.local) MEDIA.del(gone.local).catch(()=>{}); save('حُذف التوثيق'); $('#dList',f).innerHTML=list(); render(); });
};
ACT.att=d=>{ const p=S.pd.find(x=>x.id===d.id); p.att=p.att||{};
  const f=modal({title:'حضور: '+p.title, body:`<div class="row" style="justify-content:space-between"><span class="muted small">اختاري الحاضرات</span><button type="button" class="btn sm" id="allAtt">تحديد الجميع</button></div><div class="grid s" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:6px">${S.teachers.map(t=>`<label class="row" style="gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px"><input type="checkbox" class="check" name="t_${t.id}" ${p.att[t.id]?'checked':''} style="margin:0"> ${esc(t.short)}</label>`).join('')}</div>`,
   onSave:f=>{ S.teachers.forEach(t=>{ p.att[t.id]=f.elements['t_'+t.id].checked; }); save('تم حفظ الحضور'); render(); }});
  $('#allAtt',f).onclick=()=>S.teachers.forEach(t=>f.elements['t_'+t.id].checked=true);
};

/* ---------- PREP ---------- */
let pSubj='أحب لغتي', pGrade=1;
function sheetTeachers(sh){ return S.prepTeachers[sh.id]||sh.teachers; }
function sheetTopics(sh){ const out=[]; sh.weeks.forEach((w,wi)=>w.topics.forEach((t,ti)=>out.push({key:sh.id+'|'+wi+'|'+ti,t,w,wi}))); (S.prepExtra[sh.id]||[]).forEach((x,xi)=>out.push({key:sh.id+'|x'+xi,t:x.t,w:{period:x.period,week:x.week,unit:x.unit},extra:xi})); return out; }
V.prep=()=>{
  const sh=SEED.prep.find(s=>s.subject===pSubj&&s.grade===pGrade);
  let body='';
  if(!sh) body=`<div class="empty">لا توجد خطة لهذا الصف في الملفات بعد.</div>`;
  else{
    const tops=sheetTopics(sh); const TS=sheetTeachers(sh);
    const per=TS.map(tn=>tops.filter(tp=>S.prepChecks[tp.key+'|'+tn]).length);
    let lastW=null; const seenU=new Set();
    body=`<div class="grid" style="margin-bottom:14px;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))">${TS.map((tn,i)=>`<div class="card stat" style="padding:10px 12px;gap:4px"><span class="k">${esc(tn)}</span><span class="v num" style="font-size:20px">${pct(per[i],tops.length)}%</span><div class="bar"><i style="width:${pct(per[i],tops.length)}%"></i></div><span class="s">${AR(per[i])} من ${AR(tops.length)} درسًا</span></div>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="small muted">${esc(sh.title)}</p><div class="row"><button class="btn sm" data-act="prepT" data-id="${sh.id}">${ic('users')} تعديل المعلمات</button><button class="btn sm" data-act="addTopic" data-id="${sh.id}">${ic('plus')} إضافة درس</button></div></div>
    <div class="tablewrap prep"><table><thead><tr><th class="t">الموضوع (اسم الدرس)</th>${TS.map(tn=>`<th class="c">${esc(tn)}</th>`).join('')}</tr></thead><tbody>
    ${tops.map(tp=>{ const wk=tp.w.period+'|'+tp.w.week+'|'+tp.w.unit; let head=''; if(wk!==lastW){ lastW=wk; head=`<tr><td class="wk t">${esc(tp.w.week||'')} · ${esc(tp.w.period||'')}${tp.w.unit?` · <span style="color:var(--gold)">${esc(tp.w.unit)}</span>`:''}</td>${(()=>{ const uk=tp.w.unit||tp.w.week||''; const first=!seenU.has(uk); seenU.add(uk); return TS.map(tn=>{ if(!first) return '<td class="wk"></td>'; const nk=sh.id+'|'+uk+'|'+tn; const n=S.prepNotes[nk]; return `<td class="wk c"><button class="pnote ${n?'has '+pnCls(n.lvl):''}" data-act="pNote" data-k="${esc(nk)}" data-u="${esc(tp.w.unit||tp.w.week||'')}" data-t="${esc(tn)}" title="${esc(n?(n.lvl?n.lvl+': ':'')+(n.text||''):'ملاحظة على تحضير '+tn)}" aria-label="ملاحظة ${esc(tn)}">${ic('note','style="width:15px;height:15px"')}${n&&n.lvl?`<span>${esc(PN_SHORT[n.lvl]||'')}</span>`:''}</button></td>`; }).join(''); })()}</tr>`; }
      return head+`<tr><td class="t">${esc(tp.t)}${tp.extra!=null?` <button class="btn sm ghost" data-act="delTopic" data-id="${sh.id}" data-x="${tp.extra}" aria-label="حذف">${ic('x','style="width:14px;height:14px"')}</button>`:''}</td>${TS.map(tn=>{ const on=!!S.prepChecks[tp.key+'|'+tn]; return `<td class="c"><button class="cell" aria-label="${esc(tn)}: ${esc(tp.t)}" aria-pressed="${on}" data-act="pc" data-k="${esc(tp.key+'|'+tn)}">${on?ic('tick'):''}</button></td>`; }).join('')}</tr>`; }).join('')}
    </tbody></table></div><p class="small faint" style="margin-top:8px">${esc(sh.motto||'')}</p>
    <div class="section-title"><h2>ملاحظات التحضير لكل معلمة</h2></div>
    <p class="small muted" style="margin:-4px 0 10px">اضغطي أيقونة الملاحظة ${ic('note','style="width:14px;height:14px;vertical-align:-2px"')} في سطر الوحدة تحت اسم المعلمة لتكتبي تقييم تحضيرها في تلك الوحدة.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px">${TS.map(tn=>{ const ns=Object.keys(S.prepNotes).filter(k=>k.startsWith(sh.id+'|')&&k.endsWith('|'+tn)).map(k=>[k.slice(sh.id.length+1,-tn.length-1),S.prepNotes[k]]); return `<div class="card stack" style="gap:6px"><b>${esc(tn)}</b>${ns.length?ns.map(([u,n])=>`<div class="small"><span class="faint">${esc(u)}</span> ${n.lvl?`<span class="chip ${pnCls(n.lvl)}">${esc(n.lvl)}</span>`:''}<div style="white-space:pre-wrap">${esc(n.text||'')}</div></div>`).join(''):'<p class="small faint">لا ملاحظات بعد.</p>'}</div>`; }).join('')}</div>`;
  }
  return pageHead('القسم السادس','سجل متابعة التحضير على منصة نور','الخطة الفصلية للفصل الدراسي الأول. علّمي الدرس عند تأكدك من تحضير المعلمة له على المنصة.')+
  `<div class="row" style="margin-bottom:14px"><div class="seg">${SUBJ.map(s=>`<button data-act="pSubj" data-s="${s}" aria-pressed="${s===pSubj}">${s}</button>`).join('')}</div>
   <div class="seg">${[1,2,3,4].map(g=>`<button data-act="pGrade" data-g="${g}" aria-pressed="${g===pGrade}">الصف ${['','الأول','الثاني','الثالث','الرابع'][g]}</button>`).join('')}</div></div>`+body;
};
const GNAME=['','أول','ثاني','ثالث','رابع'];
const PN_LVL=['مكتمل وصحيح','مكتمل مع ملاحظات بسيطة','ناقص','لا يراعي التفريد','يحتاج متابعة'];
const PN_SHORT={'مكتمل وصحيح':'مكتمل','مكتمل مع ملاحظات بسيطة':'ملاحظات','ناقص':'ناقص','لا يراعي التفريد':'بلا تفريد','يحتاج متابعة':'متابعة'};
const pnCls=l=>l==='مكتمل وصحيح'?'ok':l==='مكتمل مع ملاحظات بسيطة'?'sea':l?'warn':'';
ACT.pNote=d=>{ const n=S.prepNotes[d.k]||{}; formRecord('تحضير '+d.t+' · '+d.u,[{k:'lvl',label:'التقييم العام',type:'select',options:['',...PN_LVL]},{k:'text',label:'الملاحظات (مثلًا: التحضير مكتمل وصحيح، أو ناقص ولا يراعي التفريد)',type:'textarea'}],{lvl:n.lvl||'',text:n.text||''},o=>{ if(!o.lvl&&!o.text) delete S.prepNotes[d.k]; else S.prepNotes[d.k]={lvl:o.lvl,text:o.text,date:todayISO()}; save('حُفظت الملاحظة'); const y=scrollY; render(); scrollTo(0,y); },n.lvl||n.text?()=>{ delete S.prepNotes[d.k]; save('حُذفت الملاحظة'); render(); }:undefined); };
ACT.prepT=d=>{
  const sh=SEED.prep.find(s=>s.id===d.id); const cur=sheetTeachers(sh);
  const all=[...cur, ...teacherNames().filter(n=>!cur.includes(n))];
  const fromAssign=[...new Set(S.assign.filter(a=>a.subject===sh.subject && a.grade===GNAME[sh.grade]).map(a=>a.teacher))];
  const f=modal({title:'معلمات '+sh.subject+' — الصف '+['','الأول','الثاني','الثالث','الرابع'][sh.grade], body:`<p class="small muted">اختاري المعلمات اللواتي يظهرن في جدول التحضير لهذا الصف. علامات التحضير السابقة تبقى محفوظة.</p>
    ${fromAssign.length?`<div class="row"><button type="button" class="btn sm" id="fromA">${ic('grid')} حسب توزيع الشعب الحالي: ${fromAssign.map(esc).join('، ')}</button></div>`:''}
    <div class="grid s" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:6px">${all.map((n,i)=>`<label class="row" style="gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px"><input type="checkbox" class="check" name="pt${i}" ${cur.includes(n)?'checked':''} style="margin:0"> ${esc(n)}</label>`).join('')}</div>
    <p class="small faint">لتغيير توزيع الشعب نفسه: «جداول تنظيم المعلمات» ثم «الشعب الدراسية»، ثم اضغطي زر «حسب توزيع الشعب» هنا.</p>`,
    onSave:f=>{ const sel=all.filter((n,i)=>f.elements['pt'+i].checked); if(!sel.length){ toast('اختاري معلمة واحدة على الأقل'); return false; } S.prepTeachers[sh.id]=sel; save('تم تحديث المعلمات'); render(); }});
  const fa=$('#fromA',f); if(fa) fa.onclick=()=>all.forEach((n,i)=>f.elements['pt'+i].checked=fromAssign.includes(n));
};
ACT.pSubj=d=>{ pSubj=d.s; render(); };
ACT.pGrade=d=>{ pGrade=+d.g; render(); };
ACT.pc=(d,el)=>{ const k=d.k; if(S.prepChecks[k]) delete S.prepChecks[k]; else S.prepChecks[k]=1; save(); const on=!!S.prepChecks[k]; el.setAttribute('aria-pressed',on); el.innerHTML=on?ic('tick'):''; const y=scrollY; render(); scrollTo(0,y); };
ACT.addTopic=d=>{ const sh=SEED.prep.find(s=>s.id===d.id); const last=sh.weeks[sh.weeks.length-1]||{};
  formRecord('إضافة درس',[{k:'t',label:'اسم الدرس'},{k:'week',label:'الأسبوع'},{k:'period',label:'الفترة الزمنية'},{k:'unit',label:'الوحدة / المحور'}],{unit:last.unit},o=>{ (S.prepExtra[sh.id]=S.prepExtra[sh.id]||[]).push(o); save('أُضيف الدرس'); render(); }); };
ACT.delTopic=d=>{ const arr=S.prepExtra[d.id]; arr.splice(+d.x,1); Object.keys(S.prepChecks).forEach(k=>{ if(k.startsWith(d.id+'|x')) delete S.prepChecks[k]; }); save('حُذف الدرس'); render(); };

/* ---------- ACHIEVEMENT ---------- */
let aGrade=0;
V.ach=()=>{
  const D=SEED.diag; const rows=D.filter(r=>!aGrade||r.g===aGrade);
  const tot=rows.reduce((a,r)=>a+r.n,0), pass=rows.reduce((a,r)=>a+r.n*r.pass/100,0);
  const lv=[0,0,0,0,0]; rows.forEach(r=>r.lv.forEach((x,i)=>lv[i]+=x));
  const LV=['أ','ب','ج','د','هـ'];
  const skills={}; rows.forEach(r=>(r.skills||[]).forEach(s=>{ (skills[s.skill]=skills[s.skill]||[]).push({cls:r.g+'/'+r.s,m:s.mastery}); }));
  const ex=S.excel.filter(e=>!aGrade||e.cls.startsWith(aGrade+'/'));
  return pageHead('القسم السابع','سجل التحصيل الدراسي','نتائج الاختبارات التشخيصية في اللغة العربية (الصفوف ٢-٤)، وحصر المجيدين ومن هم دون المستوى، والخطة الإجرائية والمبادرات.')+
  `<div class="seg" style="margin-bottom:14px">${[0,2,3,4].map(g=>`<button data-act="aGrade" data-g="${g}" aria-pressed="${g===aGrade}">${g?'الصف '+['','','الثاني','الثالث','الرابع'][g]:'كل الصفوف'}</button>`).join('')}</div>
  <div class="grid s">
    <div class="card stat"><span class="k">طلبة اكتمل تقييمهم</span><span class="v num">${AR(tot)}</span><span class="s">في ${AR(rows.length)} شعبة</span></div>
    <div class="card stat"><span class="k">نسبة النجاح (حد ٥٠%)</span><span class="v num">${tot?Math.round(pass*100/tot):0}%</span><div class="bar"><i style="width:${tot?Math.round(pass*100/tot):0}%"></i></div></div>
    <div class="card stat"><span class="k">مستوى (أ) و(ب)</span><span class="v num">${pct(lv[0]+lv[1],tot)}%</span><span class="s">${AR(lv[0]+lv[1])} طالبًا وطالبة</span></div>
    <div class="card stat"><span class="k">مستوى (د) و(هـ)</span><span class="v num" style="color:var(--rose)">${pct(lv[3]+lv[4],tot)}%</span><span class="s">${AR(lv[3]+lv[4])} يحتاجون خطة علاجية</span></div>
  </div>

  <div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))">
   <div class="card"><h3 style="font-size:17px;margin-bottom:4px">نسبة النجاح حسب الشعبة</h3><p class="small faint" style="margin-bottom:12px">الخط الرأسي = حد النجاح ٥٠%</p>
    <div class="hbars">${rows.map(r=>`<div class="hb"><span>${r.g} / ${r.s}</span><div class="track"><i style="width:${r.pass}%;background:${r.pass<50?'var(--rose)':r.pass<70?'var(--gold)':'var(--sage)'}"></i><span class="mark" style="right:50%"></span></div><b class="num">${Math.round(r.pass)}%</b></div>`).join('')}</div></div>
   <div class="card"><h3 style="font-size:17px;margin-bottom:4px">توزيع المستويات</h3><p class="small faint" style="margin-bottom:12px">أ: 17–20 · ب: 13–16 · ج: 9–12 · د: 5–8 · هـ: 0–4 (من 20)</p>
    <div class="hbars">${rows.map(r=>`<div class="hb" style="grid-template-columns:54px 1fr"><span>${r.g} / ${r.s}</span><div class="stacked">${r.lv.map((x,i)=>`<i class="lv-${'abcde'[i]}" style="width:${pct(x,r.n)}%" title="${LV[i]}: ${x}"></i>`).join('')}</div></div>`).join('')}</div>
    <div class="legend" style="margin-top:12px">${LV.map((l,i)=>`<span><i class="lv-${'abcde'[i]}"></i>${l} (${AR(lv[i])})</span>`).join('')}</div></div>
  </div>

  <div class="section-title"><h2>إتقان المهارات</h2></div>
  <div class="tablewrap"><table><thead><tr><th>الشعبة</th>${Object.keys(skills).map(k=>`<th>${esc(k)}</th>`).join('')}<th>متوسط الدرجة /20</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b>${r.g} / ${r.s}</b></td>${Object.keys(skills).map(k=>{ const s=(r.skills||[]).find(x=>x.skill===k); if(!s) return '<td class="faint">—</td>'; const c=s.mastery<50?'bad':s.mastery<65?'warn':'ok'; return `<td><span class="chip ${c}">${s.mastery}%</span></td>`; }).join('')}<td class="num">${r.avg.toFixed(1)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="card" style="margin-top:14px"><h3 style="font-size:17px;margin-bottom:6px">التوصيات العامة</h3>
   <ul style="margin:0;padding-inline-start:20px">${S.recs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <button class="btn sm ghost" data-act="editRecs" style="margin-top:6px">${ic('edit')} تعديل التوصيات</button></div>

  <div class="section-title"><h2>المجيدون ومن هم دون المستوى</h2><button class="btn sm" data-act="editExcel">${ic('edit')} تحديث الأعداد</button></div>
  <div class="card"><div class="legend" style="margin-bottom:10px"><span><i style="background:var(--sage)"></i>المجيدون</span><span><i style="background:var(--rose)"></i>دون المستوى</span></div>

function loadScript(src){ return new Promise((res,rej)=>{ if(window.XLSX) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
$('#fileXlsx').onchange=async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  toast('جارٍ قراءة الملف…');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const classes={};
    wb.SheetNames.filter(n=>/^\d-\d$/.test(n.trim())).forEach(n=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});
      const hi=rows.findIndex(r=>r.some(c=>String(c).includes('اسم التلميذ'))); if(hi<0) return;
      const h=rows[hi].map(c=>String(c));
      const ci=k=>h.findIndex(c=>c.includes(k));
      const iN=ci('اسم'), iT=ci('الإجمالي'), iL=ci('المستوى'), iS=ci('الحالة');
      const list=[];
      for(let r=hi+1;r<rows.length;r++){ const row=rows[r]; const name=String(row[iN]||'').trim(); if(!name){ if(list.length) break; else continue; } if(name==='المهارة') break; list.push({name, total:row[iT]===''?null:row[iT], level:row[iL]||'', status:row[iS]||''}); }
      if(list.length) classes[n.trim()]=list;
    });
    if(!Object.keys(classes).length){ toast('لم أجد صفحات شعب بأسماء مثل 2-1 في هذا الملف'); return; }
    STU={file:file.name, at:Date.now(), classes}; try{ localStorage.setItem(KEY_STU,JSON.stringify(STU)); }catch(err){}
    toast('تمت قراءة '+Object.keys(classes).length+' شعبة'); render();
  }catch(err){ toast('تعذّرت قراءة الملف. تأكدي أنه ملف Excel بصيغة xlsx'); }
};

  (S.custom.length? `<div class="grid s">${S.custom.map(c=>`<button class="tile" style="text-align:right" data-act="openCS" data-id="${c.id}">${ic('folder')}<b>${esc(c.title)}</b><span class="small faint">${AR(c.entries.length)} سجل</span></button>`).join('')}</div>`
   : `<div class="empty">${ic('folder','style="width:34px;height:34px;color:var(--gold)"')}<b>لا أقسام مضافة بعد</b><span class="small">مثال: «سجل اجتماعات المجال» أو «لقاءات أولياء الأمور».</span><button class="btn gold" data-act="addCS">${ic('plus')} إنشاء قسم</button></div>`)+
  `<div class="section-title"><h2>كل أقسام المنصة</h2></div><div class="tiles">${ROUTES.filter(r=>r.id&&r.id!=='more').map(r=>`<a class="tile" href="#${r.id}">${ic(r.i)}<b>${r.t}</b></a>`).join('')}</div>`;
};
const CS_FIELDS=[{k:'title',label:'اسم القسم'},{k:'desc',label:'وصف قصير (اختياري)',type:'textarea'}];
const E_FIELDS=[{k:'title',label:'العنوان'},{k:'date',label:'التاريخ',type:'date'},{k:'tag',label:'تصنيف (اختياري)'},{k:'url',label:'رابط (اختياري)',type:'url'},{k:'details',label:'التفاصيل',type:'textarea'}];
ACT.addCS=()=>formRecord('قسم جديد',CS_FIELDS,{},o=>{ o.id=uid(); o.entries=[]; S.custom.push(o); sub=o.id; save('أُنشئ القسم'); render(); });
ACT.openCS=d=>{ sub=d.id; render(); scrollTo(0,0); };
ACT.backCS=(d,el,e)=>{ e.preventDefault(); sub=null; render(); };
ACT.editCS=d=>{ const c=S.custom.find(x=>x.id===d.id); formRecord('تعديل القسم',CS_FIELDS,c,o=>{ Object.assign(c,o); save('تم الحفظ'); render(); },()=>{ S.custom=S.custom.filter(x=>x!==c); sub=null; save('حُذف القسم'); render(); }); };
ACT.addEntry=d=>{ const c=S.custom.find(x=>x.id===d.id); formRecord('سجل جديد — '+c.title,E_FIELDS,{date:todayISO()},o=>{ o.id=uid(); c.entries.push(o); save('أُضيف السجل'); render(); }); };
ACT.editEntry=d=>{ const c=S.custom.find(x=>x.id===d.id); const e=c.entries.find(x=>x.id===d.e); formRecord('تعديل السجل',E_FIELDS,e,o=>{ Object.assign(e,o); save('تم الحفظ'); render(); },()=>{ c.entries=c.entries.filter(x=>x!==e); save('حُذف السجل'); render(); }); };

/* ---------- BACKUP / INSTALL ---------- */
V.backup=()=>pageHead('إضافاتي','الحفظ والتثبيت','كل ما تضيفينه يُحفظ تلقائيًا. احتفظي بنسخة احتياطية من حين لآخر، وثبّتي المنصة على هاتفك كأي تطبيق.')+
 `<div class="grid">
  <div class="card stack"><h3 style="font-size:18px">حالة الحفظ</h3>
   <p>${syncState==='on'?'<span class="chip ok">محفوظ في حسابك</span> تُحفظ التعديلات على هذا الجهاز وفي حسابك على Claude، فتظهر لكِ على أي جهاز تفتحين منه الرابط.':'<span class="chip sea">محفوظ على هذا الجهاز</span> تُحفظ التعديلات في متصفح هذا الجهاز. انقلي نسخة احتياطية لفتحها على جهاز آخر.'}</p>
   <p class="small faint">آخر تعديل: ${S.updatedAt?new Date(S.updatedAt).toLocaleString('ar-OM-u-nu-latn'):'لم تُعدَّل البيانات بعد'}</p></div>
  <div class="card stack"><h3 style="font-size:18px">النسخة الاحتياطية</h3>
   <p class="muted">ملف واحد يحوي كل بياناتك وإضافاتك، يمكن استرجاعه على أي جهاز.</p>
   <div class="row"><button class="btn primary" data-act="exportJson">${ic('save')} حفظ نسخة احتياطية</button><button class="btn" data-act="importJson">${ic('upload')} استرجاع نسخة</button></div></div>
  <div class="card stack"><h3 style="font-size:18px">التثبيت على الهاتف</h3>
   <p><b>أندرويد (Chrome):</b> افتحي القائمة ⋮ ثم «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق».</p>
   <p><b>آيفون وآيباد (Safari):</b> اضغطي زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p>
   <p class="small faint">تعمل المنصة بعد التثبيت دون إنترنت، وتتكيف مع شاشة الهاتف واللوحي والحاسوب.</p></div>
  <div class="card stack"><h3 style="font-size:18px">البدء من جديد</h3>
   <p class="muted">إعادة البيانات إلى ما كانت عليه في ملفات المجال، مع حذف كل الإضافات والعلامات.</p>
   <div><button class="btn danger" data-act="resetAll">إعادة الضبط</button></div></div>
 </div>`;
ACT.exportJson=async()=>{
  const name='نسخة-منصة-المجال-الأول-'+todayISO()+'.json'; const data=JSON.stringify({app:'muzn-field1',v:1,state:S},null,1);
  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name,data}); toast('تم حفظ النسخة'); return; } } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('تم حفظ النسخة'); }catch(e){ toast('تعذّر الحفظ في هذا العرض'); }
};
ACT.importJson=()=>$('#fileJson').click();
$('#fileJson').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const o=JSON.parse(await f.text()); if(!o||o.app!=='muzn-field1'||!o.state) throw 0; S=migrate(Object.assign(fresh(),o.state)); save('تم استرجاع النسخة'); render(); }catch(err){ toast('هذا الملف ليس نسخة احتياطية من المنصة'); } };
ACT.resetAll=(d,el)=>{ if(el.dataset.armed){ S=fresh(); save('أُعيدت البيانات الأصلية'); render(); } else { el.dataset.armed=1; el.textContent='اضغطي مرة أخرى للتأكيد'; } };

/* ============ boot ============ */
onHash();
setTimeout(initRemote,0);
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
