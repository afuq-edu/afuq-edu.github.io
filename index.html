<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة أفق التعليمية</title>
<style>
:root{
  --bg:#F3F6FB; --card:#FFFFFF; --ink:#16213A; --muted:#5B6782; --line:#DCE3EE;
  --brand:#2F6FB3; --brand-ink:#FFFFFF; --ok:#1F9D55; --bad:#D64545;
  --c1:#0E8C8C; --c2:#D98A0B; --c3:#C2367A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --card:#18223A; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2B3756;
    --brand:#6EA8FF; --brand-ink:#0F1626; --ok:#3DD47F; --bad:#FF6B6B;
    --c1:#2EC4C4; --c2:#F2B035; --c3:#F062A4;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --card:#18223A; --ink:#E8EDF7; --muted:#9AA6C2; --line:#2B3756;
  --brand:#6EA8FF; --brand-ink:#0F1626; --ok:#3DD47F; --bad:#FF6B6B;
  --c1:#2EC4C4; --c2:#F2B035; --c3:#F062A4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

header{background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:960px;margin:0 auto;padding:22px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.title h1{margin:0;font-size:clamp(22px,4.5vw,30px);line-height:1.25}
.title p{margin:2px 0 0;color:var(--muted);font-size:15px}
.contact{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;text-decoration:none;font-weight:700;white-space:nowrap}
.contact span{color:var(--muted);font-weight:600}
.contact b{direction:ltr;unicode-bidi:isolate;letter-spacing:.5px;color:var(--brand)}

main{max-width:960px;margin:0 auto;padding:28px 16px 64px}
h2{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{position:relative;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;text-align:start;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:20px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0000001a}

.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.tag{align-self:flex-start;font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}

.note{margin-top:28px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:15px}
.note b{color:var(--ink)}
.note a{color:var(--brand);font-weight:700;direction:ltr;unicode-bidi:isolate}

dialog{border:0;border-radius:18px;padding:0;width:min(420px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px #00000055}
dialog::backdrop{background:#0b1220aa}
.dlg{padding:22px}
.dlg h3{margin:0 0 4px;font-size:20px}
.dlg p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.dlg input{width:100%;font-size:22px;text-align:center;letter-spacing:4px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.dlg input.err{border-color:var(--bad)}
.msg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--bad);text-align:center}
.get{margin:6px 0 0;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;text-align:center}
.get a{color:var(--brand);font-weight:800;direction:ltr;unicode-bidi:isolate;text-decoration:none}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;border-radius:12px;padding:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.row .go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 28px}
.card .hd{display:flex;align-items:center;gap:12px}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font-size:20px;font-weight:800;line-height:1}
.ic svg{width:22px;height:22px}
.tag{display:inline-flex;align-items:center;gap:5px}
.contact svg{color:var(--brand)}
.card .go{font-size:14px;font-weight:700;color:var(--c)}
.back{color:var(--brand);font-weight:700;text-decoration:none}

/* grade picker: small spaced circles; subjects appear under the picked grade */
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;justify-items:center;margin:4px 0 8px}
@media (min-width:640px){.picker{grid-template-columns:repeat(6,1fr);gap:26px 16px;max-width:640px}}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:4px;cursor:pointer;color:var(--ink);border-radius:14px}
.gbtn .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;line-height:1;color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent);transition:transform .15s,background .15s,color .15s}
.gbtn .lbl{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.gbtn:hover .dot{transform:translateY(-2px)}
.gbtn[aria-pressed="true"] .dot{background:var(--c);color:var(--card);border-color:var(--c)}
.gbtn[aria-pressed="true"] .lbl{color:var(--ink)}
.gbtn.empty .dot{opacity:.55}
@media (prefers-reduced-motion:reduce){.gbtn .dot{transition:none}}
.subjects{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px}
.subjects h2{font-size:18px;margin:0 0 6px}
.subjects .hint{margin:0 0 6px;color:var(--muted);font-size:14px}
.subj{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.subj:first-of-type{border-top:0}
.subj .sic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.subj .sic svg{width:19px;height:19px}
.subj b{display:block;font-size:16px}
.subj small{display:block;color:var(--muted);font-size:13.5px}
.subj .arr{margin-inline-start:auto;color:var(--c);font-weight:700;font-size:14px;white-space:nowrap}
.subj:hover b{color:var(--c)}
.soon{padding:14px 4px 16px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="logo" href="./" aria-label="منصة أفق التعليمية" style="text-decoration:none">أ</a>
    <div class="title">
      <h1>منصة أفق التعليمية</h1>
      <p>اختر الصف ثم المادة</p>
    </div>
    <a class="contact" href="tel:76506037"><span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg> رقم التواصل:</span> <b>76506037</b></a>
  </div>
</header>

<main>
  <h2>اختر الصف</h2>
  <div class="picker" id="picker" role="group" aria-label="الصفوف"></div>
  <section class="subjects" id="subjects" aria-live="polite">
    <h2 id="sTitle">المواد</h2>
    <p class="hint" id="sHint">اختر صفًا من الأعلى لتظهر مواده هنا.</p>
    <div id="sList"></div>
  </section>

  <div class="note">
    <b>لغير المشتركين:</b> للحصول على رمز الدخول تواصل معنا على الرقم
    <a href="tel:76506037">76506037</a>
  </div>
</main>

<footer>© منصة أفق التعليمية</footer>
<script>
(function(){
  var ARAB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/><path d="M8.5 13l2.5-6 2.5 6M9.3 11h3.4"/></svg>', ISL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 4v3M15.5 5.5h3"/></svg>', BIO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4c-9 0-15 4-15 10 0 3 2 5 5 5 6 0 10-6 10-15z"/><path d="M4 21c2-6 6-9 11-11"/></svg>', CHEM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6.5" r="2.6"/><circle cx="18" cy="8" r="2.6"/><circle cx="10.5" cy="18" r="2.6"/><path d="M8.4 7l7.2.6M7.4 8.6l2 6.9M16.8 10.4l-4.4 5.6"/></svg>', PHY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1.6"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></svg>', SCI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M8 15h8"/></svg>', MATH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h6M7.5 4v6M13.5 7h6M4.5 15.5l5 5M9.5 15.5l-5 5M13.5 16h6M13.5 20h6"/></svg>', ENG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/><path d="M8.5 13l2.5-6 2.5 6M9.3 11h3.4"/></svg>';
  var G=[[1,'الأول','#0E8C8C'],[2,'الثاني','#D98A0B'],[3,'الثالث','#C2367A'],[4,'الرابع','#3B5BDB'],[5,'الخامس','#1F9D55'],[6,'السادس','#B8322F'],
         [7,'السابع','#0B7285'],[8,'الثامن','#9C36B5'],[9,'التاسع','#E8590C'],[10,'العاشر','#2B8A3E'],[11,'الحادي عشر','#7048E8'],[12,'الثاني عشر','#495057']];
  var AR='٠١٢٣٤٥٦٧٨٩';
  function ar(n){return String(n).replace(/[0-9]/g,function(d){return AR[d]})}
  var SUBJ={
    1:[['math/','الرياضيات',MATH,'ملف التحضير · أرقام وأشكال · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مُستكشِف العلوم · مسابقات كاهوت']],
    2:[['math/','الرياضيات',MATH,'ملف التحضير · عالم الأرقام · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · العلوم مع روبو · مسابقات كاهوت'],['islamic/','التربية الإسلامية',ISL,'ملف التحضير · ديني حياتي · مسابقات كاهوت'],['arabic/','اللغة العربية',ARAB,'ملف التحضير · رياض لغتي · مسابقات كاهوت']],
    3:[['math/','الرياضيات',MATH,'ملف التحضير · مدينة الأرقام · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مستكشف العلوم ٣ · مسابقات كاهوت'],['arabic/','اللغة العربية',ARAB,'ملف التحضير · واحة لغتي · مسابقات كاهوت'],['islamic/','التربية الإسلامية',ISL,'ملف التحضير · ديني حياتي · مسابقات كاهوت']],
    4:[['math/','الرياضيات',MATH,'ملف التحضير · مرسى الأرقام · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مسابقات كاهوت']],
    5:[['math/','الرياضيات',MATH,'ملف التحضير · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مختبر العلوم التفاعلي · مسابقات كاهوت']],
    6:[['math/','الرياضيات',MATH,'ملف التحضير · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مسابقات كاهوت'],['arabic/','اللغة العربية',ARAB,'ملف التحضير · مسابقات كاهوت'],['islamic/','التربية الإسلامية',ISL,'ملف التحضير · مسابقات كاهوت']],
    7:[['math/','الرياضيات',MATH,'ملف التحضير · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مختبر العلوم · مسابقات كاهوت']],
    8:[['math/','الرياضيات',MATH,'ملف التحضير · مسابقات كاهوت'],['science/','العلوم',SCI,'ملف التحضير · مسابقات كاهوت']],
    9:[['math/','الرياضيات',MATH,'ملف التحضير · مسابقات كاهوت'],['physics/','الفيزياء',PHY,'ملف التحضير · ميزان الفيزياء ٩ · مسابقات كاهوت'],['chemistry/','الكيمياء',CHEM,'ملف التحضير · الكيمياء التفاعلية · مسابقات كاهوت'],['biology/','الأحياء',BIO,'ملف التحضير · مختبر الأحياء التفاعلي · مسابقات كاهوت']],
    10:[['math/','الرياضيات',MATH,'ملف التحضير · مسابقات كاهوت'],['physics/','الفيزياء',PHY,'ملف التحضير · مختبر الفيزياء التفاعلي · مسابقات كاهوت'],['chemistry/','الكيمياء',CHEM,'ملف التحضير · الكيمياء التفاعلية · مسابقات كاهوت'],['biology/','الأحياء',BIO,'ملف التحضير · مختبر الأحياء التفاعلي · مسابقات كاهوت']],
    12:[['advmath/','الرياضيات المتقدمة',MATH,'ملف التحضير · مسابقات كاهوت'],['basicmath/','الرياضيات الأساسية',MATH,'ملف التحضير · مسابقات كاهوت'],['biology/','الأحياء',BIO,'ملف التحضير · مختبر الأحياء التفاعلي · مسابقات كاهوت'],['chemistry/','الكيمياء',CHEM,'ملف التحضير · الكيمياء التفاعلية · مسابقات كاهوت'],['physics/','الفيزياء',PHY,'ملف التحضير · مختبر الفيزياء التفاعلي · مسابقات كاهوت']],
    11:[['advmath/','الرياضيات المتقدمة',MATH,'ملف التحضير · مسابقات كاهوت'],['basicmath/','الرياضيات الأساسية',MATH,'ملف التحضير · مسابقات كاهوت'],['english/','اللغة الإنجليزية',ENG,'My English Passport – Semester A'],['physics/','الفيزياء',PHY,'ملف التحضير · مختبر الفيزياء التفاعلي · مسابقات كاهوت'],['chemistry/','الكيمياء',CHEM,'ملف التحضير · الكيمياء التفاعلية · مسابقات كاهوت'],['biology/','الأحياء',BIO,'ملف التحضير · مختبر الأحياء التفاعلي · مسابقات كاهوت']]
  };
  var picker=document.getElementById('picker'), list=document.getElementById('sList'), cur=null;
  G.forEach(function(g){
    var b=document.createElement('button'); b.type='button'; b.className='gbtn'+(SUBJ[g[0]]?'':' empty');
    b.style.setProperty('--c',g[2]); b.setAttribute('aria-pressed','false'); b.dataset.g=g[0];
    b.setAttribute('aria-label','الصف '+g[1]);
    var d=document.createElement('span'); d.className='dot'; d.textContent=ar(g[0]);
    var l=document.createElement('span'); l.className='lbl'; l.textContent=g[1];
    b.append(d,l); b.addEventListener('click',function(){select(g[0],true)}); picker.appendChild(b);
  });
  function select(n,scroll){
    var g=G.filter(function(x){return x[0]===n})[0]; if(!g) return; cur=n;
    picker.querySelectorAll('.gbtn').forEach(function(b){b.setAttribute('aria-pressed',String(Number(b.dataset.g)===n))});
    var box=document.getElementById('subjects'); box.style.setProperty('--c',g[2]);
    document.getElementById('sTitle').textContent='مواد الصف '+g[1];
    var subs=SUBJ[n]||[]; list.replaceChildren();
    document.getElementById('sHint').hidden=true;
    if(!subs.length){ var p=document.createElement('p'); p.className='soon'; p.textContent='لا توجد مواد لهذا الصف بعد، وستُضاف قريبًا.'; list.appendChild(p); }
    subs.forEach(function(s){
      var a=document.createElement('a'); a.className='subj'; a.href=n+'/'+s[0];
      a.innerHTML='<span class="sic">'+s[2]+'</span>';

      a.append(t,ar_); list.appendChild(a);
    });
    try{history.replaceState(null,'','#g'+n)}catch(e){}
    if(scroll && window.matchMedia('(max-width:640px)').matches) box.scrollIntoView({behavior:'smooth',block:'start'});
  }
  var m=(location.hash.match(/^#g(\d+)$/)||[])[1]||new URLSearchParams(location.search).get('g');
  if(m) select(Number(m),false);
})();
</script>

</html>
