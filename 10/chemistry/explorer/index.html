<style>
:root{
  --bg1:#0b1026;--bg2:#141b3d;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);
  --txt:#f4f6ff;--muted:#aab3d6;--acc:#22d3ee;--acc2:#a78bfa;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--gold:#fbbf24;
  --r:22px;--sh:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Cairo','Tajawal',system-ui,sans-serif;background:radial-gradient(1200px 800px at 80% -10%,#2a2f6b 0%,transparent 60%),radial-gradient(900px 700px at -10% 110%,#0f4c5c 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--txt);overflow-x:hidden;direction:rtl}
#bgc{position:fixed;inset:0;z-index:0;opacity:.55;pointer-events:none}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 14px 60px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);position:sticky;top:8px;z-index:50;box-shadow:var(--sh)}
.hdr .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;flex:1;min-width:0}
.hdr .logo .ic{font-size:1.6rem;filter:drop-shadow(0 0 10px var(--acc))}
.hdr .logo small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.ib{width:42px;height:42px;border-radius:12px;background:var(--card2);font-size:1.2rem;display:grid;place-items:center;transition:.2s;border:1px solid var(--line)}
.ib:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.ib.off{opacity:.45;text-decoration:line-through}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 4px 6px;color:var(--muted);font-size:.9rem}
.crumbs span{cursor:pointer}.crumbs span:hover{color:var(--acc)}
.hero{position:relative;padding:36px 26px;border-radius:var(--r);background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.18));border:1px solid var(--line);margin:16px 0 22px;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900}
.hero p{margin:0;color:var(--muted);font-size:1.05rem}
.hero .flask{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:5rem;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(34,211,238,.6))}
@keyframes float{0%,100%{transform:translateY(-50%) rotate(-6deg)}50%{transform:translateY(-62%) rotate(6deg)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ucard{position:relative;padding:22px 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.25s;overflow:hidden;min-height:170px;display:flex;flex-direction:column;gap:8px}
.ucard:hover{transform:translateY(-6px) scale(1.01);background:var(--card2);box-shadow:var(--sh)}
.ucard::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 160px at 90% 0%,var(--uc) 0%,transparent 70%);opacity:.35}
.ucard .ic{font-size:2.6rem;filter:drop-shadow(0 0 12px var(--uc))}
.ucard .num{font-size:.8rem;color:var(--muted);font-weight:700}
.ucard h3{margin:0;font-size:1.25rem;font-weight:900}
.ucard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:conic-gradient(var(--uc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#171d44}
.ring b{position:relative;z-index:1}
.lcard{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.2s;margin-bottom:12px}
.lcard:hover{background:var(--card2);transform:translateX(-4px)}
.lcard .ic{font-size:2rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.lcard .t{flex:1;min-width:0}.lcard .t b{font-size:1.1rem;display:block}.lcard .t small{color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid var(--line)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stars{color:var(--gold);letter-spacing:2px;font-size:1rem}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:1.3rem;font-weight:900}
.sec-title .ln{flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:1rem;background:linear-gradient(135deg,var(--acc),#0ea5e9);color:#06202a;transition:.2s;box-shadow:0 6px 20px rgba(34,211,238,.3)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.sec{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.pur{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.35)}
.btn.grn{background:linear-gradient(135deg,#34d399,#16a34a);color:#03230f;box-shadow:0 6px 20px rgba(22,163,74,.35)}
.btn.org{background:linear-gradient(135deg,#fbbf24,#f97316);color:#2a1200;box-shadow:0 6px 20px rgba(249,115,22,.35)}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:800;transition:.2s;display:flex;align-items:center;gap:6px}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b1026}
.tab .ok{font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.lhead{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:var(--r);background:linear-gradient(135deg,var(--uc),transparent 70%),var(--card);border:1px solid var(--line);margin-top:10px}
.lhead .ic{font-size:3rem}.lhead h2{margin:0;font-size:1.5rem;font-weight:900}.lhead small{color:var(--muted);display:block;margin-top:4px}
.obj{display:grid;gap:10px}
.obj li{list-style:none;background:rgba(0,0,0,.2);padding:12px 16px;border-radius:14px;border-right:4px solid var(--acc);animation:slideIn .4s ease both}
.obj li:nth-child(2){animation-delay:.08s}.obj li:nth-child(3){animation-delay:.16s}.obj li:nth-child(4){animation-delay:.24s}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.term{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.2s;position:relative;min-height:90px}
.term:hover{background:var(--card2);transform:translateY(-3px)}
.term b{font-size:1.1rem;color:var(--acc)}.term i{color:var(--muted);font-size:.8rem;display:block;font-style:normal;direction:ltr;text-align:right}
.term p{margin:8px 0 0;font-size:.92rem;line-height:1.6}
.term .sp{position:absolute;left:10px;top:10px;font-size:1rem;opacity:.7}
.summary li{list-style:none;padding:12px 16px;margin-bottom:8px;background:rgba(0,0,0,.2);border-radius:14px;border-right:4px solid var(--ok);line-height:1.7}
/* slides */
.slidebox{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--line);min-height:460px;display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.slidebox .txt{padding:28px 28px 80px;display:flex;flex-direction:column;gap:14px;animation:pop .4s ease}
.slidebox .txt h3{margin:0;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.slidebox .txt p{margin:0;font-size:1.12rem;line-height:1.95;white-space:pre-line}
.slidebox .note{background:rgba(251,191,36,.12);border:1px dashed var(--gold);border-radius:14px;padding:10px 14px;font-size:.98rem;color:#fde68a}
.slidebox .vis{display:grid;place-items:center;padding:22px 22px 80px;background:rgba(0,0,0,.2);border-right:1px solid var(--line);min-height:300px;animation:pop .5s ease}
.slidenav{position:absolute;bottom:0;right:0;left:0;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.slidenav .cnt{flex:1;text-align:center;font-weight:800;color:var(--muted);direction:ltr}
.pbar{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:10px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:.4s}
.slidesdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.slidesdots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer}
.slidesdots span.on{background:var(--acc);transform:scale(1.3)}
.slidesdots span.seen{background:rgba(34,211,238,.5)}
/* games */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ghead h3{margin:0;flex:1;font-size:1.3rem;font-weight:900}
.score{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;color:var(--gold);direction:ltr}
.timer{background:rgba(239,68,68,.15);border:1px solid var(--bad);border-radius:999px;padding:6px 14px;font-weight:900;color:#fca5a5;min-width:70px;text-align:center}
.intro{color:var(--muted);margin:0 0 14px;font-size:1rem}
.q{font-size:1.25rem;font-weight:800;line-height:1.8;margin:8px 0 16px;background:rgba(0,0,0,.22);padding:16px 60px 16px 18px;border-radius:16px;border-right:5px solid var(--acc);position:relative}
.q>.ib{position:absolute;right:10px;top:10px;width:36px;height:36px;font-size:1rem}
.q{padding-right:60px}
bdi{unicode-bidi:isolate}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{padding:16px 18px;border-radius:16px;background:var(--card2);border:2px solid transparent;font-size:1.08rem;font-weight:700;text-align:right;transition:.2s;display:flex;gap:10px;align-items:center;line-height:1.5}
.opt .k{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.3);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.opt:hover{border-color:var(--acc);transform:translateY(-2px)}
.opt.ok{background:rgba(34,197,94,.25);border-color:var(--ok);animation:bounce .5s}
.opt.bad{background:rgba(239,68,68,.25);border-color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default;transform:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-weight:700;line-height:1.7;animation:pop .3s}
.fb.ok{background:rgba(34,197,94,.15);border:1px solid var(--ok)}.fb.bad{background:rgba(239,68,68,.15);border:1px solid var(--bad)}
.gfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.result{text-align:center;padding:30px 16px;animation:pop .5s}
.result .big{font-size:4rem;animation:bounce 1s infinite alternate}
.result h3{font-size:1.8rem;margin:8px 0}.result .stars{font-size:2.2rem}
.result p{color:var(--muted)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.tf .opt{justify-content:center;font-size:1.4rem;padding:24px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col{display:grid;gap:10px;align-content:start}
.tile{padding:14px 16px;border-radius:14px;background:var(--card2);border:2px solid transparent;font-weight:700;cursor:pointer;transition:.2s;text-align:center;line-height:1.5;font-size:1rem}
.tile:hover{border-color:var(--acc)}
.tile.sel{border-color:var(--gold);background:rgba(251,191,36,.18);transform:scale(1.03)}
.tile.done{background:rgba(34,197,94,.22);border-color:var(--ok);cursor:default;opacity:.85}
.tile.bad{animation:shake .4s;border-color:var(--bad)}
.tile.drag{opacity:.5}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.bin{min-height:120px;border:2px dashed var(--line);border-radius:16px;padding:10px;background:rgba(0,0,0,.2);transition:.2s}
.bin.over{border-color:var(--acc);background:rgba(34,211,238,.1)}
.bin h4{margin:0 0 8px;text-align:center;font-size:1.05rem;color:var(--acc)}
.bin .items{display:flex;flex-wrap:wrap;gap:6px}
.bin .items .tile{padding:8px 12px;font-size:.9rem}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;border-radius:16px;background:rgba(0,0,0,.15);min-height:60px}
.orderlist{display:grid;gap:10px}
.oitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--card2);border:2px solid transparent;font-weight:700;cursor:pointer}
.oitem .n{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.oitem .mv{margin-right:auto;display:flex;gap:4px}
.oitem .mv button{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.3)}
.oitem.sel{border-color:var(--gold)}.oitem.ok{border-color:var(--ok);background:rgba(34,197,94,.2)}.oitem.bad{border-color:var(--bad)}
.blank{display:inline-block;min-width:110px;padding:2px 12px;border-bottom:3px solid var(--acc);color:var(--gold);font-weight:900;margin:0 4px;text-align:center}
.blank.ok{color:#86efac;border-color:var(--ok)}.blank.bad{color:#fca5a5;border-color:var(--bad)}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.memgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1/1;perspective:800px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;font-weight:800;padding:8px;text-align:center;font-size:.95rem;line-height:1.4}
.mcard .f{background:linear-gradient(135deg,#312e81,#4c1d95);font-size:2rem}
.mcard .b{background:var(--card2);transform:rotateY(180deg);border:2px solid var(--acc)}
.mcard.done .b{background:rgba(34,197,94,.25);border-color:var(--ok)}
.wheelwrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}

(function bg(){ const c = $('#bgc'), x = c.getContext('2d'); let w, h, pts = []; const rs = () => { w = c.width = innerWidth; h = c.height = innerHeight; }; addEventListener('resize', rs); rs(); for (let i=0;i<45;i++) pts.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:2+Math.random()*3}); (function loop(){ x.clearRect(0,0,w,h); for (const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1; } x.strokeStyle='rgba(34,211,238,.12)'; for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++){ const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y); if(d<140){ x.globalAlpha=1-d/140; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } } x.globalAlpha=1; for (const p of pts){ x.fillStyle='rgba(167,139,250,.5)'; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); } requestAnimationFrame(loop); })(); })();

function confetti(n=120){ const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; const ps = []; const cols = ['#22d3ee','#a78bfa','#fbbf24','#22c55e','#f472b6','#f97316']; for (let i=0;i<n;i++) ps.push({x:Math.random()*c.width, y:-20-Math.random()*200, vy:2+Math.random()*4, vx:(Math.random()-.5)*3, s:6+Math.random()*8, c:cols[i%cols.length], r:Math.random()*6.28, vr:(Math.random()-.5)*.3}); let t = 0; (function loop(){ x.clearRect(0,0,c.width,c.height); t++; for (const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); } if (t<220) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })(); }

/* ---------- game runner ---------- */
function runGame(panel, g, onScore, onNext){
  if (!g) { panel.appendChild(el('p','intro','لا يوجد نشاط.')); return; }
  const wrap = el('div',''); panel.appendChild(wrap);
  const head = el('div','ghead'); head.innerHTML = `<span style="font-size:1.8rem">${GAME_ICON[g.type]||'🎮'}</span><h3>${TX(g.title)}</h3>`; const sc = el('span','score','⭐ 0'); head.appendChild(sc); const sp = spkBtn(g.title+'. '+(g.intro||'')); head.appendChild(sp); wrap.appendChild(head);
  if (g.intro) wrap.appendChild(el('p','intro',TX(g.intro)));
  const body = el('div',''); wrap.appendChild(body);
  let score = 0, total = 0;
  const setScore = (s,t) => { score = s; total = t; sc.textContent = '⭐ ' + s + (t?' / '+t:''); };
  const finish = (s, t, extra) => {
    const pct = pctOf(s,t); onScore && onScore(pct); body.innerHTML = '';
    const r = el('div','result',`<div class="big">${pct>=90?'🏆':pct>=60?'🎉':pct>=30?'👍':'💪'}</div><h3>${pct>=90?'ممتاز! أداء رائع':pct>=60?'أحسنت!':pct>=30?'جيد، يمكنك التحسّن':'حاول مرة أخرى'}</h3><div class="stars">${stars(pct)}</div><p>النتيجة: ${s} من ${t} (${pct}%)</p>${extra||''}`);
    const f = el('div','gfoot'); f.style.justifyContent='center'; const again = el('button','btn sec','🔄 إعادة'); again.onclick=()=>{ body.innerHTML=''; setScore(0,0); start(); }; f.appendChild(again); if (onNext){ const n = el('button','btn','التالي ←'); n.onclick=onNext; f.appendChild(n); } r.appendChild(f); body.appendChild(r);
    if (pct>=60) { SFX.win(); confetti(pct>=90?200:100); speak(pct>=90?'ممتاز! أداء رائع':'أحسنت'); } else { SFX.bad(); }
  };
  const ctx = {body, setScore, finish, g};
  const start = () => { body.innerHTML=''; (GAMES[g.type]||GAMES.quiz)(ctx); };
  start();
}

  const pool = shuffle(poolQuestions(u.lessons)).slice(0,15);
  runGame(panel, {type:'speed', title:'⚡ تحدي الوحدة '+toAr(u.num)+': '+u.title, intro:'15 سؤالًا من كل دروس الوحدة – 3 دقائق', seconds:180, items:pool}, sc=>{ const p = lp('U'+u.num); p.best = Math.max(p.best||0, sc); save(); }, ()=>go('#u'+u.num));
}
/* ---------- teams competition ---------- */
function teamsView(scope){
  const u = scope==='all'?null:B.units.find(x=>String(x.num)===scope); const lessons = u?u.lessons:allLessons;
  app.appendChild(crumbs([['الرئيسية','#home'], u?['الوحدة '+toAr(u.num),'#u'+u.num]:['كل الكتاب'], ['مسابقة الفرق']]));
  const panel = el('div','panel'); app.appendChild(panel);
  panel.appendChild(el('div','ghead','<span style="font-size:1.8rem">🏆</span><h3>مسابقة الفرق'+(u?' – الوحدة '+toAr(u.num)+': '+TX(u.title):' – كل الكتاب')+'</h3>'));
  const setup = el('div',''); panel.appendChild(setup);
  setup.appendChild(el('p','intro','اختر عدد الفرق وعدد الأسئلة ثم ابدأ. تتناوب الفرق على الإجابة، وكل إجابة صحيحة = 10 نقاط.'));
  const row = el('div','numin'); row.innerHTML = `<label>عدد الفرق: <select id="nt" style="font-family:inherit;font-size:1.1rem;padding:8px;border-radius:10px"><option>2</option><option>3</option><option>4</option></select></label> <label>عدد الأسئلة: <select id="nq" style="font-family:inherit;font-size:1.1rem;padding:8px;border-radius:10px"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></label>`; setup.appendChild(row);
  const names = el('div','teams'); setup.appendChild(names);
  const TN = ['الصقور 🦅','النمور 🐯','الأسود 🦁','الدلافين 🐬']; const upd = ()=>{ names.innerHTML=''; for (let i=0;i<+$('#nt').value;i++){ const t = el('div','team'); t.innerHTML = `<input value="${TN[i]}" style="font-family:inherit;font-weight:800;text-align:center;background:rgba(0,0,0,.3);border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px;width:100%">`; names.appendChild(t); } }; upd(); $('#nt').onchange=upd;
  const sb = el('button','btn org','🚀 ابدأ المسابقة'); setup.appendChild(sb);
  sb.onclick = () => { const teams = [...names.querySelectorAll('input')].map(x=>({name:x.value||'فريق', score:0})); const nq = +$('#nq').value; const qs = shuffle(poolQuestions(lessons)).slice(0,nq); setup.remove(); let i = 0, turn = 0; const board = el('div','teams'); panel.appendChild(board); const area = el('div',''); panel.appendChild(area);
    const drawBoard = () => { board.innerHTML=''; teams.forEach((t,k)=>{ board.appendChild(el('div','team'+(k===turn?' on':''),`<b>${TX(t.name)}</b><span class="sc">${t.score}</span>`)); }); };
    const show = () => { drawBoard(); area.innerHTML=''; if (i>=qs.length){ const mx = Math.max(...teams.map(t=>t.score)); const winners = teams.filter(t=>t.score===mx).map(t=>t.name).join(' و '); area.appendChild(el('div','result',`<div class="big">🏆</div><h3>الفائز: ${TX(winners)}</h3><p>بمجموع ${mx} نقطة</p>`)); confetti(250); SFX.win(); speak('الفائز '+winners); const b = el('button','btn','🔄 مسابقة جديدة'); b.onclick=()=>route(); area.appendChild(b); return; } const it = qs[i]; area.appendChild(el('div','help',`السؤال ${i+1} من ${qs.length} · دور فريق: <b style="color:var(--gold)">${TX(teams[turn].name)}</b> · من الدرس ${TX(it.from)}`)); const q = el('div','q',TX(it.q)); q.appendChild(spkBtn(it.q+'. '+it.options.join('. '))); area.appendChild(q); const opts = el('div','opts'); shuffle(it.options.map((o,k)=>k)).forEach((k,pos)=>{ const b = el('button','opt',`<span class="k">${['أ','ب','ج','د'][pos]}</span><span>${TX(it.options[k])}</span>`); b.onclick=()=>{ [...opts.children].forEach(x=>x.disabled=true); if(k===it.answer){ b.classList.add('ok'); teams[turn].score+=10; SFX.ok(); confetti(40); } else { b.classList.add('bad'); SFX.bad(); [...opts.children].find(x=>+x.dataset.k===it.answer)?.classList.add('ok'); } drawBoard(); area.appendChild(el('div','fb '+(k===it.answer?'ok':'bad'), (k===it.answer?'✅ +10 نقاط! ':'❌ ')+TX(it.explain))); nextBtn(area,'السؤال التالي ←',()=>{ i++; turn=(turn+1)%teams.length; show(); }); }; b.dataset.k=k; opts.appendChild(b); }); area.appendChild(opts); };
    show(); };
}

document.addEventListener('click', ()=>ac(), {once:true});
route();
})();
