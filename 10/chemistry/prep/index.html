:root{--ac:#8A4566;--tint:#F7EDF2;--line:#EAD5DF;--soft:#FCF7FA;--ink:#25313C;--mut:#5E6E7B;--ok:#2E7D5B;--okt:#E7F5EE}
*{box-sizing:border-box}
body{margin:0;font-family:Tj,system-ui,sans-serif;background:#F5F8FA;color:var(--ink);line-height:1.75;font-size:16px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:14px;padding-bottom:14px}
h1{margin:0;font-size:1.3rem;color:var(--ac)}
.sub{color:var(--mut);font-size:.92rem}
.modebox{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;color:var(--mut);padding:8px 18px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(40,70,100,.14)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint{margin:8px 0 0;font-size:.9rem;color:var(--mut)}
.hint b{color:var(--ink)}
.state{margin-top:10px;display:inline-block;background:var(--okt);color:var(--ok);font-weight:700;border-radius:10px;padding:4px 12px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:16px 0 8px}
.ctl label{font-weight:700;color:var(--mut)}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%;flex:1;min-width:240px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.tab{font:inherit;text-align:start;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;cursor:pointer;color:var(--ink);line-height:1.45;max-width:100%}
.tab b{display:block;color:var(--ac)}
.tab small{color:var(--mut)}
.tab.on{background:var(--tint);border-color:var(--ac)}
.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 18px;font-size:.92rem}
.info b{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.card h3{margin:0;font-size:1.02rem;color:var(--ac);display:flex;align-items:center;gap:8px}
.no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tint);border:1px solid var(--line);font-size:.85rem;flex:none}
.copy{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ac);border-radius:10px;padding:5px 16px;min-width:118px;cursor:pointer;transition:background .2s,color .2s}
.copy:hover{background:var(--tint)}
.copy.done{background:var(--okt);color:var(--ok);border-color:#BFE3D1}
.bd{padding:10px 16px}
.bd p{margin:0}
ol.ol{margin:0;padding-inline-start:20px}
.extra{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.extra b{color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:1px 10px;font-size:.93rem}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th{background:var(--tint);color:var(--ac);border:1px solid var(--line);padding:4px 8px}
table.t td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
td.tm{white-space:nowrap;text-align:center;font-weight:700;color:var(--ac)}
td.st{font-weight:700}
td.lv,td.ev{white-space:nowrap;font-weight:700;color:var(--ac);text-align:center}
tr.sum td{background:var(--soft);font-weight:700}
.tot{font-size:.88rem;color:var(--mut);margin:0 0 4px}
bdi{unicode-bidi:isolate;direction:ltr}
.psub{font-weight:700;color:var(--ac);margin:12px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
.psub:first-child{margin-top:0;padding-top:0;border-top:0}
.man{padding:0 16px 12px}
.man p{margin:0 0 6px;color:#8A5A12;font-size:.9rem}
.man textarea{width:100%;min-height:150px;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:8px}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:20px}
@media (max-width:600px){body{font-size:15px}.card .hd{flex-wrap:wrap}.copy{min-width:96px}table.t{font-size:.84rem}.seg button{padding:8px 12px}}
</style></head><body>

<script>const D={"ft":["المخرجات التعليمية","المستوى المعرفي","الاستراتيجيات","المصادر التعليمية","المفاهيم","التهيئة / التمهيد / التعلم القبلي","إجراءات سير الدرس / الأنشطة التدريسية","التقويم التكويني","التقويم الختامي","ملاحظات ضمن خطة الدراسة الأسبوعية"],"lessons":[{"label":"1-1 الترابط وخصائص الفلزات","unit":"الوحدة الأولى: الفلزات وخصائصها","periods":[{"n":1,"focus":"الخصائص الفيزيائية العامة للفلزات","info":"<div><b>الدرس:<\/b> 1-1 الترابط وخصائص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 19<\/div><div><b>محور الحصة:<\/b> الخصائص الفيزيائية العامة للفلزات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء.<\/li><li>يميز الفلزات من اللافلزات بخصائصها الفيزيائية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط استخدامات فلزات شائعة بخصائصها.<\/div>","t":"1. يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء.\n2. يميز الفلزات من اللافلزات بخصائصها الفيزيائية.\nمخرج تعليمي آخر: يربط استخدامات فلزات شائعة بخصائصها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يميز الفلزات من اللافلزات بخصائصها الفيزيائية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يربط استخدامات فلزات شائعة بخصائصها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء. ← فهم\n• يميز الفلزات من اللافلزات بخصائصها الفيزيائية. ← تحليل\n• يربط استخدامات فلزات شائعة بخصائصها. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: عينات فلزات (نحاس، ألومنيوم، حديد، خارصين)، مطرقة، دائرة اختبار التوصيل<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: عينات فلزات (نحاس، ألومنيوم، حديد، خارصين)، مطرقة، دائرة اختبار التوصيل"},{"h":"<div class=\"pills\"><span>الفلزات<\/span><span>اللافلزات<\/span><span>قابلية الطرق<\/span><span>قابلية السحب<\/span><span>التوصيل الكهربائي<\/span><span>التوصيل الحراري<\/span><span>اللمعان<\/span><\/div>","t":"الفلزات، اللافلزات، قابلية الطرق، قابلية السحب، التوصيل الكهربائي، التوصيل الحراري، اللمعان"},{"h":"<p>يعرض صورًا لأسلاك نحاسية وأوانٍ من الألومنيوم وجسر فولاذي ويسأل: لماذا اختيرت الفلزات لهذه الاستخدامات؟<\/p>","t":"يعرض صورًا لأسلاك نحاسية وأوانٍ من الألومنيوم وجسر فولاذي ويسأل: لماذا اختيرت الفلزات لهذه الاستخدامات؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصور على السبورة الذكية ويطرح السؤال.<\/td><td>يقترحون خصائص الفلزات التي يعرفونها.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">محطات الخصائص<\/td><td>يجهز محطات: اختبار التوصيل الكهربائي، والطرق بالمطرقة، واللمعان، والتوصيل الحراري.<\/td><td>تتنقل المجموعات وتسجل ملاحظاتها في جدول.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المقارنة بين الفلزات واللافلزات (كتاب الطالب ص 15)<\/td><td>يعرض بيانات درجات انصهار فلزات ولافلزات ويناقش الاستثناءات مثل الزئبق.<\/td><td>يستخلصون الخصائص العامة ويحددون الاستثناءات.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">الربط بالاستخدامات<\/td><td>يطرح استخدامات شائعة للفلزات.<\/td><td>يربطون كل استخدام بالخاصية المناسبة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية ويطرح السؤال.\nدور الطالب: يقترحون خصائص الفلزات التي يعرفونها.\n\n(13 دقيقة) محطات الخصائص\nدور المعلم: يجهز محطات: اختبار التوصيل الكهربائي، والطرق بالمطرقة، واللمعان، والتوصيل الحراري.\nدور الطالب: تتنقل المجموعات وتسجل ملاحظاتها في جدول.\n\n(10 دقائق) المقارنة بين الفلزات واللافلزات (كتاب الطالب ص 15)\nدور المعلم: يعرض بيانات درجات انصهار فلزات ولافلزات ويناقش الاستثناءات مثل الزئبق.\nدور الطالب: يستخلصون الخصائص العامة ويحددون الاستثناءات.\n\n(7 دقائق) الربط بالاستخدامات\nدور المعلم: يطرح استخدامات شائعة للفلزات.\nدور الطالب: يربطون كل استخدام بالخاصية المناسبة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاث خصائص فيزيائية عامة للفلزات.<\/td><td>صلبة غالبًا عند درجة حرارة الغرفة، ومرتفعة درجة الانصهار، وجيدة التوصيل للحرارة والكهرباء، وقابلة للطرق والسحب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُصنع أواني الطبخ من الألومنيوم أو الفولاذ؟<\/td><td>لأنها جيدة التوصيل للحرارة ومرتفعة درجة الانصهار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فلز سائل عند درجة حرارة الغرفة يُعد استثناءً. ما هو؟ وأي خاصية فلزية تبقى فيه؟<\/td><td>الزئبق؛ ويبقى موصلًا جيدًا للكهرباء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ثلاث خصائص فيزيائية عامة للفلزات.\nالإجابة النموذجية: صلبة غالبًا عند درجة حرارة الغرفة، ومرتفعة درجة الانصهار، وجيدة التوصيل للحرارة والكهرباء، وقابلة للطرق والسحب.\n\n2) [المستوى المتوقع] لماذا تُصنع أواني الطبخ من الألومنيوم أو الفولاذ؟\nالإجابة النموذجية: لأنها جيدة التوصيل للحرارة ومرتفعة درجة الانصهار.\n\n3) [المستوى المتقدم] فلز سائل عند درجة حرارة الغرفة يُعد استثناءً. ما هو؟ وأي خاصية فلزية تبقى فيه؟\nالإجابة النموذجية: الزئبق؛ ويبقى موصلًا جيدًا للكهرباء."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: قابلية الفلز للتشكيل بالطرق إلى صفائح تسمى .........<\/td><td>قابلية الطرق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الخاصيتان اللتان تجعلان النحاس مناسبًا لأسلاك الكهرباء؟<\/td><td>جودة توصيله للكهرباء وقابليته للسحب إلى أسلاك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مادة صلبة لامعة تتكسر عند طرقها ولا توصل الكهرباء. هل هي فلز؟ برر.<\/td><td>لا؛ لأن الفلزات قابلة للطرق وموصلة للكهرباء، واللمعان وحده لا يكفي للحكم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: قابلية الفلز للتشكيل بالطرق إلى صفائح تسمى .........\nالإجابة النموذجية: قابلية الطرق.\n\n2) [المستوى المتوقع] ما الخاصيتان اللتان تجعلان النحاس مناسبًا لأسلاك الكهرباء؟\nالإجابة النموذجية: جودة توصيله للكهرباء وقابليته للسحب إلى أسلاك.\n\n3) [المستوى المتقدم] مادة صلبة لامعة تتكسر عند طرقها ولا توصل الكهرباء. هل هي فلز؟ برر.\nالإجابة النموذجية: لا؛ لأن الفلزات قابلة للطرق وموصلة للكهرباء، واللمعان وحده لا يكفي للحكم."},{"h":"<p>مراجعة كتاب الطالب ص 15 والإجابة عن السؤال 1-1، وجمع ثلاث أدوات منزلية فلزية مع ذكر الخاصية المستفاد منها في كل أداة.<\/p>","t":"مراجعة كتاب الطالب ص 15 والإجابة عن السؤال 1-1، وجمع ثلاث أدوات منزلية فلزية مع ذكر الخاصية المستفاد منها في كل أداة."}]},{"n":2,"focus":"الرابطة الفلزية وتفسير خصائص الفلزات","info":"<div><b>الدرس:<\/b> 1-1 الترابط وخصائص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 19<\/div><div><b>محور الحصة:<\/b> الرابطة الفلزية وتفسير خصائص الفلزات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز.<\/li><li>يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يمثل البنية الشبكية للفلز برسم أو نموذج.<\/div>","t":"1. يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز.\n2. يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء.\nمخرج تعليمي آخر: يمثل البنية الشبكية للفلز برسم أو نموذج."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يمثل البنية الشبكية للفلز برسم أو نموذج.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز. ← فهم\n• يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء. ← تطبيق\n• يمثل البنية الشبكية للفلز برسم أو نموذج. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot"},{"h":"<div class=\"pills\"><span>الرابطة الفلزية<\/span><span>الأيونات الموجبة<\/span><span>الإلكترونات الحرة<\/span><span>البنية الشبكية<\/span><span>طبقات الأيونات<\/span><\/div>","t":"الرابطة الفلزية، الأيونات الموجبة، الإلكترونات الحرة، البنية الشبكية، طبقات الأيونات"},{"h":"<p>سؤال: إذا كانت ذرات الفلز متماثلة، فما الذي يربطها بقوة تجعل درجة انصهاره مرتفعة؟<\/p>","t":"سؤال: إذا كانت ذرات الفلز متماثلة، فما الذي يربطها بقوة تجعل درجة انصهاره مرتفعة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون فرضيات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">نموذج الرابطة الفلزية (كتاب الطالب ص 16)<\/td><td>يرسم على السبورة الذكية أيونات موجبة مرتبة في طبقات تحيط بها إلكترونات حرة.<\/td><td>يرسمون النموذج ويحددون الأيونات والإلكترونات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">نمذجة بالطلبة<\/td><td>يصطف بعض الطلبة أيونات في صفوف ويتحرك آخرون بينهم إلكترونات حرة، ثم يحرك المعلم صفًا كاملًا.<\/td><td>يستنتجون أن انزلاق الطبقات لا يكسر الرابطة، وأن الإلكترونات الحرة تحمل التيار.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من مسابقة المجموعات على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤال 2-1<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون فرضيات.\n\n(12 دقيقة) نموذج الرابطة الفلزية (كتاب الطالب ص 16)\nدور المعلم: يرسم على السبورة الذكية أيونات موجبة مرتبة في طبقات تحيط بها إلكترونات حرة.\nدور الطالب: يرسمون النموذج ويحددون الأيونات والإلكترونات.\n\n(10 دقائق) نمذجة بالطلبة\nدور المعلم: يصطف بعض الطلبة أيونات في صفوف ويتحرك آخرون بينهم إلكترونات حرة، ثم يحرك المعلم صفًا كاملًا.\nدور الطالب: يستنتجون أن انزلاق الطبقات لا يكسر الرابطة، وأن الإلكترونات الحرة تحمل التيار.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من مسابقة المجموعات على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤال 2-1\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>مم تتكون البنية الشبكية للفلز؟<\/td><td>أيونات موجبة مرتبة في طبقات، وإلكترونات حرة تتحرك بينها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>فسّر جودة توصيل الفلزات للكهرباء.<\/td><td>لوجود إلكترونات حرة تتحرك خلال البنية عند تطبيق فرق جهد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر قابلية الفلزات للطرق دون أن تنكسر.<\/td><td>تنزلق طبقات الأيونات بعضها فوق بعض، وتبقى الإلكترونات الحرة تربطها فلا تنكسر الرابطة الفلزية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] مم تتكون البنية الشبكية للفلز؟\nالإجابة النموذجية: أيونات موجبة مرتبة في طبقات، وإلكترونات حرة تتحرك بينها.\n\n2) [المستوى المتوقع] فسّر جودة توصيل الفلزات للكهرباء.\nالإجابة النموذجية: لوجود إلكترونات حرة تتحرك خلال البنية عند تطبيق فرق جهد.\n\n3) [المستوى المتقدم] فسّر قابلية الفلزات للطرق دون أن تنكسر.\nالإجابة النموذجية: تنزلق طبقات الأيونات بعضها فوق بعض، وتبقى الإلكترونات الحرة تربطها فلا تنكسر الرابطة الفلزية."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الرابطة الفلزية قوى تجاذب بين ......... و.........<\/td><td>الأيونات الموجبة – الإلكترونات الحرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تكون درجات انصهار معظم الفلزات مرتفعة؟<\/td><td>لأن قوى التجاذب بين الأيونات الموجبة والإلكترونات الحرة قوية وتحتاج إلى طاقة كبيرة للتغلب عليها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قارن بين سلوك بلورة ملح أيونية وقطعة نحاس عند طرقهما مع التفسير.<\/td><td>الملح يتكسر لأن إزاحة الطبقات تقرّب أيونات متشابهة الشحنة فتتنافر؛ والنحاس يتشكل لأن الإلكترونات الحرة تبقي الطبقات مترابطة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الرابطة الفلزية قوى تجاذب بين ......... و.........\nالإجابة النموذجية: الأيونات الموجبة – الإلكترونات الحرة.\n\n2) [المستوى المتوقع] لماذا تكون درجات انصهار معظم الفلزات مرتفعة؟\nالإجابة النموذجية: لأن قوى التجاذب بين الأيونات الموجبة والإلكترونات الحرة قوية وتحتاج إلى طاقة كبيرة للتغلب عليها.\n\n3) [المستوى المتقدم] قارن بين سلوك بلورة ملح أيونية وقطعة نحاس عند طرقهما مع التفسير.\nالإجابة النموذجية: الملح يتكسر لأن إزاحة الطبقات تقرّب أيونات متشابهة الشحنة فتتنافر؛ والنحاس يتشكل لأن الإلكترونات الحرة تبقي الطبقات مترابطة."},{"h":"<p>مراجعة كتاب الطالب ص 16 والإجابة عن السؤال 2-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى.<\/p>","t":"مراجعة كتاب الطالب ص 16 والإجابة عن السؤال 2-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-1 الترابط وخصائص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 19<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><ol class=\"ol\"><li>يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء.<\/li><li>يميز الفلزات من اللافلزات بخصائصها الفيزيائية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط استخدامات فلزات شائعة بخصائصها.<\/div><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><ol class=\"ol\"><li>يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز.<\/li><li>يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يمثل البنية الشبكية للفلز برسم أو نموذج.<\/div>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\n1. يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء.\n2. يميز الفلزات من اللافلزات بخصائصها الفيزيائية.\nمخرج تعليمي آخر: يربط استخدامات فلزات شائعة بخصائصها.\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\n1. يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز.\n2. يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء.\nمخرج تعليمي آخر: يمثل البنية الشبكية للفلز برسم أو نموذج."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يميز الفلزات من اللافلزات بخصائصها الفيزيائية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يربط استخدامات فلزات شائعة بخصائصها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يمثل البنية الشبكية للفلز برسم أو نموذج.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\n• يصف الخصائص الفيزيائية العامة للفلزات: صلبة، مرتفعة درجتي الانصهار والغليان، قابلة للطرق والسحب، جيدة التوصيل للحرارة والكهرباء. ← فهم\n• يميز الفلزات من اللافلزات بخصائصها الفيزيائية. ← تحليل\n• يربط استخدامات فلزات شائعة بخصائصها. ← تطبيق\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\n• يصف الرابطة الفلزية بأنها قوى تجاذب بين الأيونات الموجبة والإلكترونات الحرة في البنية الشبكية للفلز. ← فهم\n• يستخدم الرابطة الفلزية لتفسير قابلية الفلزات للطرق وجودة توصيلها للكهرباء. ← تطبيق\n• يمثل البنية الشبكية للفلز برسم أو نمو ائية العامة للفلزات\nالفلزات، اللافلزات، قابلية الطرق، قابلية السحب، التوصيل الكهربائي، التوصيل الحراري، اللمعان\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\nالرابطة الفلزية، الأيونات الموجبة، الإلكترونات الحرة، البنية الشبكية، طبقات الأيونات"},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><p>يعرض صورًا لأسلاك نحاسية وأوانٍ من الألومنيوم وجسر فولاذي ويسأل: لماذا اختيرت الفلزات لهذه الاستخدامات؟<\/p><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><p>سؤال: إذا كانت ذرات الفلز متماثلة، فما الذي يربطها بقوة تجعل درجة انصهاره مرتفعة؟<\/p>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\nيعرض صورًا لأسلاك نحاسية وأوانٍ من الألومنيوم وجسر فولاذي ويسأل: لماذا اختيرت الفلزات لهذه الاستخدامات؟\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\nسؤال: إذا كانت ذرات الفلز متماثلة، فما الذي يربطها بقوة تجعل درجة انصهاره مرتفعة؟"},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصور على السبورة الذكية ويطرح السؤال.<\/td><td>يقترحون خصائص الفلزات التي يعرفونها.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">محطات الخصائص<\/td><td>يجهز محطات: اختبار التوصيل الكهربائي، والطرق بالمطرقة، واللمعان، والتوصيل الحراري.<\/td><td>تتنقل المجموعات وتسجل ملاحظاتها في جدول.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المقارنة بين الفلزات واللافلزات (كتاب الطالب ص 15)<\/td><td>يعرض بيانات درجات انصهار فلزات ولافلزات ويناقش الاستثناءات مثل الزئبق.<\/td><td>يستخلصون الخصائص العامة ويحددون الاستثناءات.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">الربط بالاستخدامات<\/td><td>يطرح استخدامات شائعة للفلزات.<\/td><td>يربطون كل استخدام بالخاصية المناسبة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون فرضيات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">نموذج الرابطة الفلزية (كتاب الطالب ص 16)<\/td><td>يرسم على السبورة الذكية أيونات موجبة مرتبة في طبقات تحيط بها إلكترونات حرة.<\/td><td>يرسمون النموذج ويحددون الأيونات والإلكترونات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">نمذجة بالطلبة<\/td><td>يصطف بعض الطلبة أيونات في صفوف ويتحرك آخرون بينهم إلكترونات حرة، ثم يحرك المعلم صفًا كاملًا.<\/td><td>يستنتجون أن انزلاق الطبقات لا يكسر الرابطة، وأن الإلكترونات الحرة تحمل التيار.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من مسابقة المجموعات على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤال 2-1<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية ويطرح السؤال.\nدور الطالب: يقترحون خصائص الفلزات التي يعرفونها.\n\n(13 دقيقة) محطات الخصائص\nدور المعلم: يجهز محطات: اختبار التوصيل الكهربائي، والطرق بالمطرقة، واللمعان، والتوصيل الحراري.\nدور الطالب: تتنقل المجموعات وتسجل ملاحظاتها في جدول.\n\n(10 دقائق) المقارنة بين الفلزات واللافلزات (كتاب الطالب ص 15)\nدور المعلم: يعرض بيانات درجات انصهار فلزات ولافلزات ويناقش الاستثناءات مثل الزئبق.\nدور الطالب: يستخلصون الخصائص العامة ويحددون الاستثناءات.\n\n(7 دقائق) الربط بالاستخدامات\nدور المعلم: يطرح استخدامات شائعة للفلزات.\nدور الطالب: يربطون كل استخدام بالخاصية المناسبة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون فرضيات.\n\n(12 دقيقة) نموذج الرابطة الفلزية (كتاب الطالب ص 16)\nدور المعلم: يرسم على السبورة الذكية أيونات موجبة مرتبة في طبقات تحيط بها إلكترونات حرة.\nدور الطالب: يرسمون النموذج ويحددون الأيونات والإلكترونات.\n\n(10 دقائق) نمذجة بالطلبة\nدور المعلم: يصطف بعض الطلبة أيونات في صفوف ويتحرك آخرون بينهم إلكترونات حرة، ثم يحرك المعلم صفًا كاملًا.\nدور الطالب: يستنتجون أن انزلاق الطبقات لا يكسر الرابطة، وأن الإلكترونات الحرة تحمل التيار.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من مسابقة المجموعات على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤال 2-1\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاث خصائص فيزيائية عامة للفلزات.<\/td><td>صلبة غالبًا عند درجة حرارة الغرفة، ومرتفعة درجة الانصهار، وجيدة التوصيل للحرارة والكهرباء، وقابلة للطرق والسحب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُصنع أواني الطبخ من الألومنيوم أو الفولاذ؟<\/td><td>لأنها جيدة التوصيل للحرارة ومرتفعة درجة الانصهار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فلز سائل عند درجة حرارة الغرفة يُعد استثناءً. ما هو؟ وأي خاصية فلزية تبقى فيه؟<\/td><td>الزئبق؛ ويبقى موصلًا جيدًا للكهرباء.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>مم تتكون البنية الشبكية للفلز؟<\/td><td>أيونات موجبة مرتبة في طبقات، وإلكترونات حرة تتحرك بينها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>فسّر جودة توصيل الفلزات للكهرباء.<\/td><td>لوجود إلكترونات حرة تتحرك خلال البنية عند تطبيق فرق جهد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر قابلية الفلزات للطرق دون أن تنكسر.<\/td><td>تنزلق طبقات الأيونات بعضها فوق بعض، وتبقى الإلكترونات الحرة تربطها فلا تنكسر الرابطة الفلزية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\n1) [مستوى الدعم] اذكر ثلاث خصائص فيزيائية عامة للفلزات.\nالإجابة النموذجية: صلبة غالبًا عند درجة حرارة الغرفة، ومرتفعة درجة الانصهار، وجيدة التوصيل للحرارة والكهرباء، وقابلة للطرق والسحب.\n\n2) [المستوى المتوقع] لماذا تُصنع أواني الطبخ من الألومنيوم أو الفولاذ؟\nالإجابة النموذجية: لأنها جيدة التوصيل للحرارة ومرتفعة درجة الانصهار.\n\n3) [المستوى المتقدم] فلز سائل عند درجة حرارة الغرفة يُعد استثناءً. ما هو؟ وأي خاصية فلزية تبقى فيه؟\nالإجابة النموذجية: الزئبق؛ ويبقى موصلًا جيدًا للكهرباء.\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\n1) [مستوى الدعم] مم تتكون البنية الشبكية للفلز؟\nالإجابة النموذجية: أيونات موجبة مرتبة في طبقات، وإلكترونات حرة تتحرك بينها.\n\n2) [المستوى المتوقع] فسّر جودة توصيل الفلزات للكهرباء.\nالإجابة النموذجية: لوجود إلكترونات حرة تتحرك خلال البنية عند تطبيق فرق جهد.\n\n3) [المستوى المتقدم] فسّر قابلية الفلزات للطرق دون أن تنكسر.\nالإجابة النموذجية: تنزلق طبقات الأيونات بعضها فوق بعض، وتبقى الإلكترونات الحرة تربطها فلا تنكسر الرابطة الفلزية."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: قابلية الفلز للتشكيل بالطرق إلى صفائح تسمى .........<\/td><td>قابلية الطرق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الخاصيتان اللتان تجعلان النحاس مناسبًا لأسلاك الكهرباء؟<\/td><td>جودة توصيله للكهرباء وقابليته للسحب إلى أسلاك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مادة صلبة لامعة تتكسر عند طرقها ولا توصل الكهرباء. هل هي فلز؟ برر.<\/td><td>لا؛ لأن الفلزات قابلة للطرق وموصلة للكهرباء، واللمعان وحده لا يكفي للحكم.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الرابطة الفلزية قوى تجاذب بين ......... و.........<\/td><td>الأيونات الموجبة – الإلكترونات الحرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تكون درجات انصهار معظم الفلزات مرتفعة؟<\/td><td>لأن قوى التجاذب بين الأيونات الموجبة والإلكترونات الحرة قوية وتحتاج إلى طاقة كبيرة للتغلب عليها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قارن بين سلوك بلورة ملح أيونية وقطعة نحاس عند طرقهما مع التفسير.<\/td><td>الملح يتكسر لأن إزاحة الطبقات تقرّب أيونات متشابهة الشحنة فتتنافر؛ والنحاس يتشكل لأن الإلكترونات الحرة تبقي الطبقات مترابطة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\n1) [مستوى الدعم] أكمل: قابلية الفلز للتشكيل بالطرق إلى صفائح تسمى .........\nالإجابة النموذجية: قابلية الطرق.\n\n2) [المستوى المتوقع] ما الخاصيتان اللتان تجعلان النحاس مناسبًا لأسلاك الكهرباء؟\nالإجابة النموذجية: جودة توصيله للكهرباء وقابليته للسحب إلى أسلاك.\n\n3) [المستوى المتقدم] مادة صلبة لامعة تتكسر عند طرقها ولا توصل الكهرباء. هل هي فلز؟ برر.\nالإجابة النموذجية: لا؛ لأن الفلزات قابلة للطرق وموصلة للكهرباء، واللمعان وحده لا يكفي للحكم.\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\n1) [مستوى الدعم] أكمل: الرابطة الفلزية قوى تجاذب بين ......... و.........\nالإجابة النموذجية: الأيونات الموجبة – الإلكترونات الحرة.\n\n2) [المستوى المتوقع] لماذا تكون درجات انصهار معظم الفلزات مرتفعة؟\nالإجابة النموذجية: لأن قوى التجاذب بين الأيونات الموجبة والإلكترونات الحرة قوية وتحتاج إلى طاقة كبيرة للتغلب عليها.\n\n3) [المستوى المتقدم] قارن بين سلوك بلورة ملح أيونية وقطعة نحاس عند طرقهما مع التفسير.\nالإجابة النموذجية: الملح يتكسر لأن إزاحة الطبقات تقرّب أيونات متشابهة الشحنة فتتنافر؛ والنحاس يتشكل لأن الإلكترونات الحرة تبقي الطبقات مترابطة."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية العامة للفلزات<\/div><p>مراجعة كتاب الطالب ص 15 والإجابة عن السؤال 1-1، وجمع ثلاث أدوات منزلية فلزية مع ذكر الخاصية المستفاد منها في كل أداة.<\/p><div class=\"psub\">الحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات<\/div><p>مراجعة كتاب الطالب ص 16 والإجابة عن السؤال 2-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى.<\/p>","t":"الحصة 1: الخصائص الفيزيائية العامة للفلزات\nمراجعة كتاب الطالب ص 15 والإجابة عن السؤال 1-1، وجمع ثلاث أدوات منزلية فلزية مع ذكر الخاصية المستفاد منها في كل أداة.\n\nالحصة 2: الرابطة الفلزية وتفسير خصائص الفلزات\nمراجعة كتاب الطالب ص 16 والإجابة عن السؤال 2-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى."}]}},{"label":"2-1 العناصر الانتقالية","unit":"الوحدة الأولى: الفلزات وخصائصها","periods":[{"n":1,"focus":"خصائص العناصر الانتقالية ومركباتها","info":"<div><b>الدرس:<\/b> 2-1 العناصر الانتقالية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 17–18 | كتاب النشاط: ورقة العمل 1-1 ص 21<\/div><div><b>دليل المعلم:<\/b> ص 20<\/div><div><b>محور الحصة:<\/b> خصائص العناصر الانتقالية ومركباتها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف العناصر الانتقالية بأنها فلزات عالية الكثافة مرتفعة درجات الانصهار.<\/li><li>يذكر أن العناصر الانتقالية تكوّن مركبات ملونة، وأن عناصرها ومركباتها تستخدم غالبًا عوامل حفازة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين العناصر الانتقالية والفلزات القلوية في الكثافة ودرجة الانصهار.<\/div>","t":"1. يصف العناصر الانتقالية بأنها فلزات عالية الكثافة مرتفعة درجات الانصهار.\n2. يذكر أن العناصر الانتقالية تكوّن مركبات ملونة، وأن عناصرها ومركباتها تستخدم غالبًا عوامل حفازة.\nمخرج تعليمي آخر: يقارن بين العناصر الانتقالية والفلزات القلوية في الكثافة ودرجة الانصهار."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف العناصر الانتقالية بأنها فلزات عالية الكثافة مرتفعة درجات الانصهار.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر أن العناصر الانتقالية تكوّن مركبات ملونة، وأن عناصرها ومركباتها \/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الخصائص (كتاب الطالب ص 17–18)<\/td><td>يعرض بيانات الكثافة ودرجات الانصهار ويطلب مقارنتها بالصوديوم.<\/td><td>يستخلصون الخصائص الأربع ويحلون الأسئلة 3-1 إلى 6-1.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">ورقة العمل 1-1 العناصر الانتقالية (كتاب النشاط ص 21)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم وتكليف الملصق<\/td><td>يطرح التقويم ويكلف بإعداد ملصق بحثي عن عنصر انتقالي.<\/td><td>يختارون العنصر.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض العينات.\nدور الطالب: يتوقعون.\n\n(10 دقائق) موقع العناصر الانتقالية\nدور المعلم: يحدد على الجدول الدوري موقعها بين المجموعتين II وIII.\nدور الطالب: يحددون أمثلة: الحديد، والنحاس، والنيكل، والخارصين.\n\n(12 دقيقة) الخصائص (كتاب الطالب ص 17–18)\nدور المعلم: يعرض بيانات الكثافة ودرجات الانصهار ويطلب مقارنتها بالصوديوم.\nدور الطالب: يستخلصون الخصائص الأربع ويحلون الأسئلة 3-1 إلى 6-1.\n\n(8 دقائق) ورقة العمل 1-1 العناصر الانتقالية (كتاب النشاط ص 21)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم وتكليف الملصق\nدور المعلم: يطرح التقويم ويكلف بإعداد ملصق بحثي عن عنصر انتقالي.\nدور الطالب: يختارون العنصر."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر خاصيتين فيزيائيتين للعناصر الانتقالية.<\/td><td>عالية الكثافة ومرتفعة درجة الانصهار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الدليل على أن كبريتات النحاس II من مركبات العناصر الانتقالية؟<\/td><td>لونها الأزرق؛ فالعناصر الانتقالية تكوّن مركبات ملونة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر مثالًا على استخدام عنصر انتقالي عاملًا حفازًا.<\/td><td>النيكل في إضافة الهيدروجين إلى الألكينات، أو الحديد في صناعة الأمونيا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر خاصيتين فيزيائيتين للعناصر الانتقالية.\nالإجابة النموذجية: عالية الكثافة ومرتفعة درجة الانصهار.\n\n2) [المستوى المتوقع] ما الدليل على أن كبريتات النحاس II من مركبات العناصر الانتقالية؟\nالإجابة النموذجية: لونها الأزرق؛ فالعناصر الانتقالية تكوّن مركبات ملونة.\n\n3) [المستوى المتقدم] اذكر مثالًا على استخدام عنصر انتقالي عاملًا حفازًا.\nالإجابة النموذجية: النيكل في إضافة الهيدروجين إلى الألكينات، أو الحديد في صناعة الأمونيا."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: العناصر الانتقالية منخفضة الكثافة مثل الفلزات القلوية.<\/td><td>خطأ؛ هي عالية الكثافة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المقصود بالعامل الحفاز؟<\/td><td>مادة تزيد سرعة التفاعل الكيميائي ولا تُستهلك فيه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عنصر كثافته 7.9 g/cm³ ودرجة انصهاره 1538 °C ويكوّن مركبات خضراء وبنية. صنّفه وبرر.<\/td><td>عنصر انتقالي (الحديد)؛ لارتفاع كثافته ودرجة انصهاره وتكوينه مركبات ملونة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: العناصر الانتقالية منخفضة الكثافة مثل الفلزات القلوية.\nالإجابة النموذجية: خطأ؛ هي عالية الكثافة.\n\n2) [المستوى المتوقع] ما المقصود بالعامل الحفاز؟\nالإجابة النموذجية: مادة تزيد سرعة التفاعل الكيميائي ولا تُستهلك فيه.\n\n3) [المستوى المتقدم] عنصر كثافته 7.9 g/cm³ ودرجة انصهاره 1538 °C ويكوّن مركبات خضراء وبنية. صنّفه وبرر.\nالإجابة النموذجية: عنصر انتقالي (الحديد)؛ لارتفاع كثافته ودرجة انصهاره وتكوينه مركبات ملونة."},{"h":"<p>حل ورقة العمل 1-1 العناصر الانتقالية في كتاب النشاط ص 21، والإجابة عن الأسئلة 3-1 إلى 6-1 والسؤال 4 من أسئلة نهاية الوحدة، وإعداد ملصق عن عنصر انتقالي.<\/p>","t":"حل ورقة العمل 1-1 العناصر الانتقالية في كتاب النشاط ص 21، والإجابة عن الأسئلة 3-1 إلى 6-1 والسؤال 4 من أسئلة نهاية الوحدة، وإعداد ملصق عن عنصر انتقالي."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-1 العناصر الانتقالية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة  على أن كبريتات النحاس II من مركبات العناصر الانتقالية؟\nالإجابة النموذجية: لونها الأزرق؛ فالعناصر الانتقالية تكوّن مركبات ملونة.\n\n3) [المستوى المتقدم] اذكر مثالًا على استخدام عنصر انتقالي عاملًا حفازًا.\nالإجابة النموذجية: النيكل في إضافة الهيدروجين إلى الألكينات، أو الحديد في صناعة الأمونيا."},{"h":"<div class=\"psub\">الحصة 1: خصائص العناصر الانتقالية ومركباتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: العناصر الانتقالية منخفضة الكثافة مثل الفلزات القلوية.<\/td><td>خطأ؛ هي عالية الكثافة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المقصود بالعامل الحفاز؟<\/td><td>مادة تزيد سرعة التفاعل الكيميائي ولا تُستهلك فيه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عنصر كثافته 7.9 g/cm³ ودرجة انصهاره 1538 °C ويكوّن مركبات خضراء وبنية. صنّفه وبرر.<\/td><td>عنصر انتقالي (الحديد)؛ لارتفاع كثافته ودرجة انصهاره وتكوينه مركبات ملونة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: خصائص العناصر الانتقالية ومركباتها\n1) [مستوى الدعم] صواب أم خطأ: العناصر الانتقالية منخفضة الكثافة مثل الفلزات القلوية.\nالإجابة النموذجية: خطأ؛ هي عالية الكثافة.\n\n2) [المستوى المتوقع] ما المقصود بالعامل الحفاز؟\nالإجابة النموذجية: مادة تزيد سرعة التفاعل الكيميائي ولا تُستهلك فيه.\n\n3) [المستوى المتقدم] عنصر كثافته 7.9 g/cm³ ودرجة انصهاره 1538 °C ويكوّن مركبات خضراء وبنية. صنّفه وبرر.\nالإجابة النموذجية: عنصر انتقالي (الحديد)؛ لارتفاع كثافته ودرجة انصهاره وتكوينه مركبات ملونة."},{"h":"<div class=\"psub\">الحصة 1: خصائص العناصر الانتقالية ومركباتها<\/div><p>حل ورقة العمل 1-1 العناصر الانتقالية في كتاب النشاط ص 21، والإجابة عن الأسئلة 3-1 إلى 6-1 والسؤال 4 من أسئلة نهاية الوحدة، وإعداد ملصق عن عنصر انتقالي.<\/p>","t":"الحصة 1: خصائص العناصر الانتقالية ومركباتها\nحل ورقة العمل 1-1 العناصر الانتقالية في كتاب النشاط ص 21، والإجابة عن الأسئلة 3-1 إلى 6-1 والسؤال 4 من أسئلة نهاية الوحدة، وإعداد ملصق عن عنصر انتقالي."}]}},{"label":"3-1 الفلزات القلوية","unit":"الوحدة الأولى: الفلزات وخصائصها","periods":[{"n":1,"focus":"الخصائص الفيزيائية للفلزات القلوية وتدرجها","info":"<div><b>الدرس:<\/b> 3-1 الفلزات القلوية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19–22 | كتاب النشاط: تمرين 1-1 ص 15، ورقة العمل 2-1 ص 22<\/div><div><b>دليل المعلم:<\/b> ص 21–22<\/div><div><b>محور الحصة:<\/b> الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات لينة نسبيًا.<\/li><li>يصف التدرج في درجات الانصهار والكثافة في المجموعة الأولى.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر حفظ الفلزات القلوية تحت الزيت.<\/div>","t":"1. يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات لينة نسبيًا.\n2. يصف التدرج في درجات الانصهار والكثافة في المجموعة الأولى.\nمخرج تعليمي آخر: يفسر حفظ الفلزات القلوية تحت الزيت."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات لينة نسبيًا.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف التدرج في درجات الانصهار والكثافة في المجموعة الأولى.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يفسر حفظ الفلزات القلوية تحت الزيت.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات لينة نسبيًا. ← فهم\n• يصف التدرج في درجات الانصهار والكثافة في المجموعة الأولى. ← تحليل\n• يفسر حفظ الفلزات القلوية تحت الزيت. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: الجدول الدوري، جدول بيانات المجموعة الأولى<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: الجدول الدوري، جدول بيانات المجموعة الأولى"},{"h":"<div class=\"pills\"><span>الفلزات القلوية<\/span><span>المجموعة الأولى<\/span><span>الليونة<\/span><span>درجة الانصهار<\/span><span>الكثافة<\/span><span>التدرج في المجموعة<\/span><\/div>","t":"الفلزات القلوية، المجموعة الأولى، الليونة، درجة الانصهار، الكثافة، التدرج في المجموعة"},{"h":"<p>مقطع قصير لقطع الصوديوم بسكين ولمعان سطحه ثم بهتانه بسرعة؛ سؤال: ماذا حدث للسطح؟ ولماذا؟<\/p>","t":"مقطع قصير لقطع الصوديوم بسكين ولمعان سطحه ثم بهتانه بسرعة؛ سؤال: ماذا حدث للسطح؟ ولماذا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يلاحظون ويتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحليل بيانات المجموعة الأولى (كتاب الطالب ص 19–20)<\/td><td>يعرض جدول درجات الانصهار والكثافة لـ Li وNa وK.<\/td><td>يرسمون أعمدة لدرجات الانصهار ويستنتجون تناقصها بالنزول في المجموعة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الليونة والتخزين<\/td><td>يوضح أنها تُقطع بالسكين وتتفاعل مع الهواء والماء فتُحفظ تحت الزيت.<\/td><td>يفسرون بهتان السطح.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-1 المجموعة I (كتاب النشاط ص 15)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يلاحظون ويتوقعون.\n\n(12 دقيقة) تحليل بيانات المجموعة الأولى (كتاب الطالب ص 19–20)\nدور المعلم: يعرض جدول درجات الانصهار والكثافة لـ Li وNa وK.\nدور الطالب: يرسمون أعمدة لدرجات الانصهار ويستنتجون تناقصها بالنزول في المجموعة.\n\n(10 دقائق) الليونة والتخزين\nدور المعلم: يوضح أنها تُقطع بالسكين وتتفاعل مع الهواء والماء فتُحفظ تحت الزيت.\nدور الطالب: يفسرون بهتان السطح.\n\n(8 دقائق) تمرين 1-1 المجموعة I (كتاب النشاط ص 15)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا تُحفظ الفلزات القلوية تحت الزيت؟<\/td><td>لمنع تفاعلها مع الأكسجين وبخار الماء في الهواء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف تتغير درجة الانصهار من الليثيوم إلى البوتاسيوم؟<\/td><td>تتناقص.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يطفو الليثيوم والصوديوم والبوتاسيوم على سطح الماء؟<\/td><td>لأن كثافتها أقل من كثافة الماء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا تُحفظ الفلزات القلوية تحت الزيت؟\nالإجابة النموذجية: لمنع تفاعلها مع الأكسجين وبخار الماء في الهواء.\n\n2) [المستوى المتوقع] كيف تتغير درجة الانصهار من الليثيوم إلى البوتاسيوم؟\nالإجابة النموذجية: تتناقص.\n\n3) [المستوى المتقدم] لماذا يطفو الليثيوم والصوديوم والبوتاسيوم على سطح الماء؟\nالإجابة النموذجية: لأن كثافتها أقل من كثافة الماء."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلزات القلوية تقع في المجموعة .........<\/td><td>الأولى (I).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يفقد الصوديوم لمعانه بسرعة بعد قطعه؟<\/td><td>لتفاعله مع الأكسجين في الهواء مكونًا طبقة أكسيد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>درجة انصهار الليثيوم 181 °C والصوديوم 98 °C. توقع درجة انصهار البوتاسيوم: 63 °C أم 120 °C؟ برر.<\/td><td>63 °C؛ لأن درجة الانصهار تتناقص بالنزول في المجموعة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الفلزات القلوية تقع في المجموعة .........\nالإجابة النموذجية: الأولى (I).\n\n2) [المستوى المتوقع] لماذا يفقد الصوديوم لمعانه بسرعة بعد قطعه؟\nالإجابة النموذجية: لتفاعله مع الأكسجين في الهواء مكونًا طبقة أكسيد.\n\n3) [المستوى المتقدم] درجة انصهار الليثيوم 181 °C والصوديوم 98 °C. توقع درجة انصهار البوتاسيوم: 63 °C أم 120 °C؟ برر.\nالإجابة النموذجية: 63 °C؛ لأن درجة الانصهار تتناقص بالنزول في المجموعة."},{"h":"<p>حل تمرين 1-1 المجموعة I (الفلزات القلوية) في كتاب النشاط ص 15، ومراجعة كتاب الطالب ص 19–20.<\/p>","t":"حل تمرين 1-1 المجموعة I (الفلزات القلوية) في كتاب النشاط ص 15، ومراجعة كتاب الطالب ص 19–20."}]},{"n":2,"focus":"تفاعل الفلزات القلوية مع الماء","info":"<div><b>الدرس:<\/b> 3-1 الفلزات القلوية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19–22 | كتاب النشاط: تمرين 1-1 ص 15، ورقة العمل 2-1 ص 22<\/div><div><b>دليل المعلم:<\/b> ص 21–22<\/div><div><b>محور الحصة:<\/b> تفاعل الفلزات القلوية مع الماء<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف تفاعل الليثيوم والصوديوم والبوتاسيوم مع الماء ونواتجه.<\/li><li>يكتب معادلات لفظية ورمزية موزونة لتفاعل الفلز القلوي مع الماء.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرتب الفلزات القلوية حسب شدة تفاعلها مع الماء من الملاحظات.<\/div>","t":"1. يصف تفاعل الليثيوم والصوديوم والبوتاسيوم مع الماء ونواتجه.\n2. يكتب معادلات لفظية ورمزية موزونة لتفاعل الفلز القلوي مع الماء.\nمخرج تعليمي آخر: يرتب الفلزات القلوية حسب شدة تفاعلها مع الماء من الملاحظات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تفاعل الليثيوم والصوديوم والبوتاسيوم مع الماء ونواتجه.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلات لفظية ورمزية موزونة لتفاعل الفلز القلوي مع الماء.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يرتب الفلزات القلوية حسب شدة تفاعلها مع الماء من الملاحظات.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف تفاعل الليثيوم والصوديوم والبوتاسيوم مع الماء ونواتجه. ← فهم\n• يكتب معادلات لفظية ورمزية موزونة لتفاعل الفلز القلوي مع الماء. ← تطبيق\n• يرتب الفلزات القلوية حسب شدة تفاعلها مع الماء من الملاحظات. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: عرض المعلم: قطع صغيرة من الليثيوم والصوديوم، حوض ماء، كاشف عام، شاشة أمان، نظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: عرض المعلم: قطع صغيرة من الليثيوم والصوديوم، حوض ماء، كاشف عام، شاشة أمان، نظارات واقية"},{"h":"<div class=\"pills\"><span>هيدروكسيد الفلز<\/span><span>غاز الهيدروجين<\/span><span>المحلول القلوي<\/span><span>شدة التفاعل<\/span><\/div>","t":"هيدروكسيد الفلز، غاز الهيدروجين، المحلول القلوي، شدة التفاعل"},{"h":"<p>سؤال: لماذا سُميت هذه الفلزات «قلوية»؟<\/p>","t":"سؤال: لماذا سُميت هذه الفلزات «قلوية»؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-1 تفاعل بعض الفلزات القلوية مع الماء (عرض المعلم)<\/td><td>يضع قطعة صغيرة من الليثيوم ثم الصوديوم في حوض ماء فيه كاشف عام خلف شاشة أمان، ويعرض مقطعًا لتفاعل البوتاسيوم.<\/td><td>يسجلون: الطفو، والفوران، والحركة، والانصهار، واللهب، وتحول لون الكاشف إلى البنفسجي.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المعادلات<\/td><td>يكتب: الصوديوم + الماء ← هيدروكسيد الصوديوم + الهيدروجين، و <bdi>2Na + 2H₂O → 2NaOH + H₂<\/bdi>.<\/td><td>يكتبون معادلتي الليثيوم والبوتاسيوم ويزنونهما.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ترتيب النشاط<\/td><td>يناقش ازدياد شدة التفاعل بالنزول في المجموعة.<\/td><td>يرتبون: K ثم Na ثم Li.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 1-1 تفاعل بعض الفلزات القلوية مع الماء (عرض المعلم)\nدور المعلم: يضع قطعة صغيرة من الليثيوم ثم الصوديوم في حوض ماء فيه كاشف عام خلف شاشة أمان، ويعرض مقطعًا لتفاعل البوتاسيوم.\nدور الطالب: يسجلون: الطفو، والفوران، والحركة، والانصهار، واللهب، وتحول لون الكاشف إلى البنفسجي.\n\n(10 دقائق) المعادلات\nدور المعلم: يكتب: الصوديوم + الماء ← هيدروكسيد الصوديوم + الهيدروجين، و 2Na + 2H₂O → 2NaOH + H₂.\nدور الطالب: يكتبون معادلتي الليثيوم والبوتاسيوم ويزنونهما.\n\n(5 دقائق) ترتيب النشاط\nدور المعلم: يناقش ازدياد شدة التفاعل بالنزول في المجموعة.\nدور الطالب: يرتبون: K ثم Na ثم Li.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نواتج تفاعل الصوديوم مع الماء؟<\/td><td>هيدروكسيد الصوديوم وغاز الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية الموزونة لتفاعل الليثيوم مع الماء.<\/td><td><bdi>2Li + 2H₂O → 2LiOH + H₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتحول لون الكاشف العام في الحوض إلى البنفسجي؟<\/td><td>لأن هيدروكسيد الفلز الناتج يذوب مكونًا محلولًا قلويًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما نواتج تفاعل الصوديوم مع الماء؟\nالإجابة النموذجية: هيدروكسيد الصوديوم وغاز الهيدروجين.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية الموزونة لتفاعل الليثيوم مع الماء.\nالإجابة النموذجية: 2Li + 2H₂O → 2LiOH + H₂\n\n3) [المستوى المتقدم] لماذا يتحول لون الكاشف العام في الحوض إلى البنفسجي؟\nالإجابة النموذجية: لأن هيدروكسيد الفلز الناتج يذوب مكونًا محلولًا قلويًا."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>رتب Li وNa وK تنازليًا حسب شدة التفاعل مع الماء.<\/td><td>K ثم Na ثم Li.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الدليل على تكون غاز في التفاعل؟<\/td><td>الفوران وتصاعد الفقاعات، واشتعال الغاز في حالة البوتاسيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا ينصهر الصوديوم ويتحول إلى كرة أثناء تفاعله مع الماء؟<\/td><td>لأن التفاعل طارد للحرارة ودرجة انصهار الصوديوم منخفضة (98 °C).<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] رتب Li وNa وK تنازليًا حسب شدة التفاعل مع الماء.\nالإجابة النموذجية: K ثم Na ثم Li.\n\n2) [المستوى المتوقع] ما الدليل على تكون غاز في التفاعل؟\nالإجابة النموذجية: الفوران وتصاعد الفقاعات، واشتعال الغاز في حالة البوتاسيوم.\n\n3) [المستوى المتقدم] لماذا ينصهر الصوديوم ويتحول إلى كرة أثناء تفاعله مع الماء؟\nالإجابة النموذجية: لأن التفاعل طارد للحرارة ودرجة انصهار الصوديوم منخفضة (98 °C)."},{"h":"<p>مراجعة كتاب الطالب ص 20–21 والإجابة عن الأسئلة 7-1 إلى 10-1، وكتابة معادلات تفاعل الفلزات القلوية الثلاثة مع الماء.<\/p>","t":"مراجعة كتاب الطالب ص 20–21 والإجابة عن الأسئلة 7-1 إلى 10-1، وكتابة معادلات تفاعل الفلزات القلوية الثلاثة مع الماء."}]},{"n":3,"focus":"التنبؤ بخصائص عناصر المجموعة الأولى","info":"<div><b>الدرس:<\/b> 3-1 الفلزات القلوية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19–22 | كتاب النشاط: تمرين 1-1 ص 15، ورقة العمل 2-1 ص 22<\/div><div><b>دليل المعلم:<\/b> ص 21–22<\/div><div><b>محور الحصة:<\/b> التنبؤ بخصائص عناصر المجموعة الأولى<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يتنبأ بخصائص عناصر أخرى في المجموعة الأولى (الروبيديوم والسيزيوم) في ضوء البيانات.<\/li><li>يطبق نمط التدرج في المجموعة لحل مسائل ورقة العمل 2-1.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تنبؤات زملائه ويصحح غير المنطقي منها.<\/div>","t":"1. يتنبأ بخصائص عناصر أخرى في المجموعة الأولى (الروبيديوم والسيزيوم) في ضوء البيانات.\n2. يطبق نمط التدرج في المجموعة لحل مسائل ورقة العمل 2-1.\nمخرج تعليمي آخر: يقيّم تنبؤات زملائه ويصحح غير المنطقي منها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتنبأ بخصائص عناصر أخرى في المجموعة الأولى (الروبيديوم والسيزيوم) في ضوء البيانات.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يطبق نمط التدرج في المجموعة لحل مسائل ورقة العمل 2-1.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقيّم تنبؤات زملائه ويصحح غير المنطقي منها.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يتنبأ بخصائص عناصر أخرى في المجموعة الأولى (الروبيديوم والسيزيوم) في ضوء البيانات. ← تحليل\n• يطبق نمط التدرج في المجموعة لحل مسائل ورقة العمل 2-1. ← تطبيق\n• يقيّم تنبؤات زملائه ويصحح غير المنطقي منها. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"pills\"><span>التنبؤ<\/span><span>التدرج في المجموعة<\/span><span>الروبيديوم<\/span><span>السيزيوم<\/span><span>النشاط الكيميائي<\/span><\/div>","t":"التنبؤ، التدرج في المجموعة، الروبيديوم، السيزيوم، النشاط الكيميائي"},{"h":"<p>لعبة «من أنا؟»: ثلاث بطاقات لفلزات قلوية بخصائص مختلفة، والمطلوب تحديد كل فلز.<\/p>","t":"لعبة «من أنا؟»: ثلاث بطاقات لفلزات قلوية بخصائص مختلفة، والمطلوب تحديد كل فلز."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض البطاقات.<\/td><td>يحددون الفلزات ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">التنبؤ بالروبيديوم والسيزيوم<\/td><td>يعرض على السبورة الذكية جدولًا ناقصًا للبيانات.<\/td><td>تتنبأ المجموعات بدرجة الانصهار والكثافة وشدة التفاعل مع الماء وتبرر.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 2-1 الفلزات القلوية (كتاب النشاط ص 22)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص التدرج في المجموعة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(6 دقائق) التهيئة\nدور المعلم: يعرض البطاقات.\nدور الطالب: يحددون الفلزات ويبررون.\n\n(12 دقيقة) التنبؤ بالروبيديوم والسيزيوم\nدور المعلم: يعرض على السبورة الذكية جدولًا ناقصًا للبيانات.\nدور الطالب: تتنبأ المجموعات بدرجة الانصهار والكثافة وشدة التفاعل مع الماء وتبرر.\n\n(10 دقائق) ورقة العمل 2-1 الفلزات القلوية (كتاب النشاط ص 22)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص التدرج في المجموعة.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف تتوقع تفاعل الروبيديوم مع الماء مقارنة بالبوتاسيوم؟<\/td><td>أشد عنفًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>توقع نواتج تفاعل السيزيوم مع الماء.<\/td><td>هيدروكسيد السيزيوم وغاز الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع طالب أن درجة انصهار السيزيوم 200 °C. قيّم توقعه.<\/td><td>غير منطقي؛ لأن درجات الانصهار تتناقص بالنزول في المجموعة فيجب أن تكون أقل من البوتاسيوم (63 °C)، وهي فعلًا نحو 29 °C.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] كيف تتوقع تفاعل الروبيديوم مع الماء مقارنة بالبوتاسيوم؟\nالإجابة النموذجية: أشد عنفًا.\n\n2) [المستوى المتوقع] توقع نواتج تفاعل السيزيوم مع الماء.\nالإجابة النموذجية: هيدروكسيد السيزيوم وغاز الهيدروجين.\n\n3) [المستوى المتقدم] توقع طالب أن درجة انصهار السيزيوم 200 °C. قيّم توقعه.\nالإجابة النموذجية: غير منطقي؛ لأن درجات الانصهار تتناقص بالنزول في المجموعة فيجب أن تكون أقل من البوتاسيوم (63 °C)، وهي فعلًا نحو 29 °C."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يزداد النشاط الكيميائي للفلزات القلوية بالنزول في المجموعة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة اللفظية لتفاعل الروبيديوم مع الماء.<\/td><td>الروبيديوم + الماء ← هيدروكسيد الروبيديوم + الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اكتب المعادلة الرمزية الموزونة لتفاعل البوتاسيوم مع الماء، وما لون اللهب الملاحظ؟<\/td><td><bdi>2K + 2H₂O → 2KOH + H₂<\/bdi>؛ ويظهر لهب بنفسجي فاتح (ليلكي).<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يزداد النشاط الكيميائي للفلزات القلوية بالنزول في المجموعة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] اكتب المعادلة اللفظية لتفاعل الروبيديوم مع الماء.\nالإجابة النموذجية: الروبيديوم + الماء ← هيدروكسيد الروبيديوم + الهيدروجين.\n\n3) [المستوى المتقدم] اكتب المعادلة الرمزية الموزونة لتفاعل البوتاسيوم مع الماء، وما لون اللهب الملاحظ؟\nالإجابة النموذجية: 2K + 2H₂O → 2KOH + H₂؛ ويظهر لهب بنفسجي فاتح (ليلكي)."},{"h":"<p>إكمال ورقة العمل 2-1 الفلزات القلوية في كتاب النشاط ص 22، والإجابة عن الأسئلة 11-1 إلى 13-1 والسؤال 3 من أسئلة نهاية الوحدة.<\/p>","t":"إكمال ورقة العمل 2-1 الفلزات القلوية في كتاب النشاط ص 22، والإجابة عن الأسئلة 11-1 إلى 13-1 والسؤال 3 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-1 الفلزات القلوية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19–22 | كتاب النشاط: تمرين 1-1 ص 15، ورقة العمل 2-1 ص 22<\/div><div><b>دليل المعلم:<\/b> ص 21–22<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><ol class=\"ol\"><li>يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات لينة نسبيًا.<\/li><li>يصف التدرج في درجات الانصهار والكثافة في المجموعة الأولى.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر حفظ الفلزات القلوية تحت الزيت.<\/div><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><ol class=\"ol\"><li>يصف تفاعل الليثيوم والصوديوم والبوتاسيوم مع الماء ونواتجه.<\/li><li>يكتب معادلات لفظية ورمزية موزونة لتفاعل الفلز القلوي مع الماء.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرتب الفلزات القلوية حسب شدة تفاعلها مع الماء من الملاحظات.<\/div><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><ol class=\"ol\"><li>يتنبأ بخصائص عناصر أخرى في المجموعة الأولى (الروبيديوم والسيزيوم) في ضوء البيانات.<\/li><li>يطبق نمط التدرج في المجموعة لحل مسائل ورقة العمل 2-1.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تنبؤات زملائه ويصحح غير المنطقي منها.<\/div>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\n1. يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات لينة نسبيًا.\n2. يصف التدرج في درجات الانصهار والكثافة في المجموعة الأولى.\nمخرج تعليمي آخر: يفسر حفظ الفلزات القلوية تحت الزيت.\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\n1. يصف تفاعل الليثيوم والصوديوم والبوتاسيوم مع الماء ونواتجه.\n2. يكتب معادلات لفظية ورمزية موزونة لتفاعل الفلز القلوي مع الماء.\nمخرج تعليمي آخر: يرتب الفلزات القلوية حسب شدة تفاعلها مع الماء من الملاحظات.\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\n1. يتنبأ بخصائص عناصر أخرى في المجموعة الأولى (الروبيديوم والسيزيوم) في ضوء البيانات.\n2. يطبق نمط التدرج في المجموعة لحل مسائل ورقة العمل 2-1.\nمخرج تعليمي آخر: يقيّم تنبؤات زملائه ويصحح غير المنطقي منها."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الليثيوم والصوديوم والبوتاسيوم بأنها فلزات
