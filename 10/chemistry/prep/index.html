، الخارصين"},{"h":"<div class=\"psub\">الحصة 1: شروط صدأ الحديد<\/div><p>يعرض صورة سفينة صدئة وأخرى مطلية حديثًا ويسأل: ما الذي سبب الصدأ؟<\/p><div class=\"psub\">الحصة 2: طرق منع الصدأ والحماية بالتضحية<\/div><p>يعرض نتائج أنابيب النشاط 3-2 بعد عدة أيام ويطلب تفسيرها.<\/p>","t":"الحصة 1: شروط صدأ الحديد\nيعرض صورة سفينة صدئة وأخرى مطلية حديثًا ويسأل: ما الذي سبب الصدأ؟\n\nالحصة 2: طرق منع الصدأ والحماية بالتضحية\nيعرض نتائج أنابيب النشاط 3-2 بعد عدة أيام ويطلب تفسيرها."},{"h":"<div class=\"psub\">الحصة 1: شروط صدأ الحديد<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 3-2 منع الصدأ – إعداد الأنابيب (كتاب الطالب ص 47)<\/td><td>يوجه إلى إعداد أنابيب: ماء وهواء، وماء مغلي تعلوه طبقة زيت، وهواء جاف مع كلوريد الكالسيوم، وماء مالح وهواء.<\/td><td>يعدون الأنابيب ويتوقعون النتائج ويسجلونها في جدول متابعة لعدة أيام.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلة<\/td><td>يكتب: الحديد + الأكسجين + الماء ← أكسيد الحديد III المائي (الصدأ).<\/td><td>يدونون ويحددون الشرطين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 20-2 و21-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق منع الصدأ والحماية بالتضحية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة: نتائج النشاط<\/td><td>يعرض الأنابيب.<\/td><td>يفسرون النتائج.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">العزل والجلفنة (كتاب الطالب ص 48–49)<\/td><td>يشرح منع وصول الماء والأكسجين، ثم الجلفنة: الخارصين يحمي الحديد حتى لو خُدش لأنه أنشط فيتأكسد بدلًا منه.<\/td><td>يدونون الطرق ويرسمون مخطط الحماية بالتضحية.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الحماية بالتضحية<\/td><td>يعرض على السبورة الذكية صورة كتل الماغنيسيوم على هيكل سفينة وأنابيب النفط.<\/td><td>يفسرون اختيار فلز أنشط من الحديد.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">ورقة العمل 2-2 الصدأ (كتاب النشاط ص 34–35)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: شروط صدأ الحديد\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يقترحون أسبابًا.\n\n(17 دقيقة) النشاط 3-2 منع الصدأ – إعداد الأنابيب (كتاب الطالب ص 47)\nدور المعلم: يوجه إلى إعداد أنابيب: ماء وهواء، وماء مغلي تعلوه طبقة زيت، وهواء جاف مع كلوريد الكالسيوم، وماء مالح وهواء.\nدور الطالب: يعدون الأنابيب ويتوقعون النتائج ويسجلونها في جدول متابعة لعدة أيام.\n\n(8 دقائق) المعادلة\nدور المعلم: يكتب: الحديد + الأكسجين + الماء ← أكسيد الحديد III المائي (الصدأ).\nدور الطالب: يدونون ويحددون الشرطين.\n\n(5 دقائق) السؤالان 20-2 و21-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: طرق منع الصدأ والحماية بالتضحية\n(6 دقائق) التهيئة: نتائج النشاط\nدور المعلم: يعرض الأنابيب.\nدور الطالب: يفسرون النتائج.\n\n(12 دقيقة) العزل والجلفنة (كتاب الطالب ص 48–49)\nدور المعلم: يشرح منع وصول الماء والأكسجين، ثم الجلفنة: الخارصين يحمي الحديد حتى لو خُدش لأنه أنشط فيتأكسد بدلًا منه.\nدور الطالب: يدونون الطرق ويرسمون مخطط الحماية بالتضحية.\n\n(10 دقائق) الحماية بالتضحية\nدور المعلم: يعرض على السبورة الذكية صورة كتل الماغنيسيوم على هيكل سفينة وأنابيب النفط.\nدور الطالب: يفسرون اختيار فلز أنشط من الحديد.\n\n(7 دقائق) ورقة العمل 2-2 الصدأ (كتاب النشاط ص 34–35)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: شروط صدأ الحديد<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الشرطان اللازمان لصدأ الحديد؟<\/td><td>وجود الماء والأكسجين معًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُغلى الماء ويغطى بطبقة زيت في أحد الأنابيب؟<\/td><td>الغليان يطرد الهواء الذائب، والزيت يمنع ذوبانه من جديد، فيبقى الماء بلا أكسجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع: في أي أنبوب يصدأ المسمار أسرع؟ ولماذا؟<\/td><td>في أنبوب الماء المالح مع الهواء؛ لأن الملح يسرّع الصدأ.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق منع الصدأ والحماية بالتضحية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر طريقتين لمنع الصدأ بالعزل.<\/td><td>الطلاء، أو التشحيم بالزيت، أو التغطية بالبلاستيك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يبقى الحديد المجلفن محميًا حتى لو خُدشت طبقة الخارصين؟<\/td><td>لأن الخارصين أنشط من الحديد فيتأكسد بدلًا منه (حماية بالتضحية).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يصلح النحاس لحماية هيكل سفينة فولاذية بالتضحية؟<\/td><td>لأن النحاس أقل نشاطًا من الحديد، فيتآكل الحديد بدلًا منه.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: شروط صدأ الحديد\n1) [مستوى الدعم] ما الشرطان اللازمان لصدأ الحديد؟\nالإجابة النموذجية: وجود الماء والأكسجين معًا.\n\n2) [المستوى المتوقع] لماذا يُغلى الماء ويغطى بطبقة زيت في أحد الأنابيب؟\nالإجابة النموذجية: الغليان يطرد الهواء الذائب، والزيت يمنع ذوبانه من جديد، فيبقى الماء بلا أكسجين.\n\n3) [المستوى المتقدم] توقع: في أي أنبوب يصدأ المسمار أسرع؟ ولماذا؟\nالإجابة النموذجية: في أنبوب الماء المالح مع الهواء؛ لأن الملح يسرّع الصدأ.\n\nالحصة 2: طرق منع الصدأ والحماية بالتضحية\n1) [مستوى الدعم] اذكر طريقتين لمنع الصدأ بالعزل.\nالإجابة النموذجية: الطلاء، أو التشحيم بالزيت، أو التغطية بالبلاستيك.\n\n2) [المستوى المتوقع] لماذا يبقى الحديد المجلفن محميًا حتى لو خُدشت طبقة الخارصين؟\nالإجابة النموذجية: لأن الخارصين أنشط من الحديد فيتأكسد بدلًا منه (حماية بالتضحية).\n\n3) [المستوى المتقدم] لماذا لا يصلح النحاس لحماية هيكل سفينة فولاذية بالتضحية؟\nالإجابة النموذجية: لأن النحاس أقل نشاطًا من الحديد، فيتآكل الحديد بدلًا منه."},{"h":"<div class=\"psub\">الحصة 1: شروط صدأ الحديد<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الحديد + الأكسجين + الماء ← .........<\/td><td>أكسيد الحديد III المائي (الصدأ).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة كلوريد الكالسيوم اللامائي في الأنبوب؟<\/td><td>امتصاص بخار الماء لجعل الهواء جافًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تصدأ السيارات في المدن الساحلية أسرع؟<\/td><td>لارتفاع الرطوبة ووجود الأملاح في الهواء التي تسرّع الصدأ.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق منع الصدأ والحماية بالتضحية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تُثبت كتل الماغنيسيوم على السفن لأنه أقل نشاطًا من الحديد.<\/td><td>خطأ؛ لأنه أنشط من الحديد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي طرق الحماية يناسب سلسلة دراجة؟ ولماذا؟<\/td><td>التشحيم بالزيت؛ لأنه يعزل السلسلة ولا يعيق حركتها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يتآكل الألومنيوم بسرعة مع أنه أنشط من الحديد؟<\/td><td>لأن طبقة أكسيد الألومنيوم الرقيقة المتماسكة تحمي الفلز تحتها.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: شروط صدأ الحديد\n1) [مستوى الدعم] أكمل: الحديد + الأكسجين + الماء ← .........\nالإجابة النموذجية: أكسيد الحديد III المائي (الصدأ).\n\n2) [المستوى المتوقع] ما وظيفة كلوريد الكالسيوم اللامائي في الأنبوب؟\nالإجابة النموذجية: امتصاص بخار الماء لجعل الهواء جافًا.\n\n3) [المستوى المتقدم] لماذا تصدأ السيارات في المدن الساحلية أسرع؟\nالإجابة النموذجية: لارتفاع الرطوبة ووجود الأملاح في الهواء التي تسرّع الصدأ.\n\nالحصة 2: طرق منع الصدأ والحماية بالتضحية\n1) [مستوى الدعم] صواب أم خطأ: تُثبت كتل الماغنيسيوم على السفن لأنه أقل نشاطًا من الحديد.\nالإجابة النموذجية: خطأ؛ لأنه أنشط من الحديد.\n\n2) [المستوى المتوقع] أي طرق الحماية يناسب سلسلة دراجة؟ ولماذا؟\nالإجابة النموذجية: التشحيم بالزيت؛ لأنه يعزل السلسلة ولا يعيق حركتها.\n\n3) [المستوى المتقدم] لماذا لا يتآكل الألومنيوم بسرعة مع أنه أنشط من الحديد؟\nالإجابة النموذجية: لأن طبقة أكسيد الألومنيوم الرقيقة المتماسكة تحمي الفلز تحتها."},{"h":"<div class=\"psub\">الحصة 1: شروط صدأ الحديد<\/div><p>متابعة أنابيب النشاط 3-2 يوميًا وتسجيل الملاحظات، ومراجعة كتاب الطالب ص 45–47 والإجابة عن السؤالين 20-2 و21-2.<\/p><div class=\"psub\">الحصة 2: طرق منع الصدأ والحماية بالتضحية<\/div><p>إكمال ورقة العمل 2-2 الصدأ في كتاب النشاط ص 34–35، والإجابة عن الأسئلة 22-2 إلى 24-2 والسؤال 5 من أسئلة نهاية الوحدة الثانية.<\/p>","t":"الحصة 1: شروط صدأ الحديد\nمتابعة أنابيب النشاط 3-2 يوميًا وتسجيل الملاحظات، ومراجعة كتاب الطالب ص 45–47 والإجابة عن السؤالين 20-2 و21-2.\n\nالحصة 2: طرق منع الصدأ والحماية بالتضحية\nإكمال ورقة العمل 2-2 الصدأ في كتاب النشاط ص 34–35، والإجابة عن الأسئلة 22-2 إلى 24-2 والسؤال 5 من أسئلة نهاية الوحدة الثانية."}]}},{"label":"مراجعة الوحدة الثانية وأسئلة نهاية الوحدة","unit":"الوحدة الثانية: استخلاص الفلزات واستخداماتها","periods":[{"n":1,"focus":"حل أسئلة نهاية الوحدة الثانية","info":"<div><b>الدرس:<\/b> مراجعة الوحدة الثانية وأسئلة نهاية الوحدة<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 50–51 | كتاب النشاط: مراجعة تمرين 1-2 وورقتي العمل 1-2 و2-2 ص 29–35<\/div><div><b>دليل المعلم:<\/b> ص 51<\/div><div><b>محور الحصة:<\/b> حل أسئلة نهاية الوحدة الثانية<\/div>","fields":[{"h":"<ol class=\"ol\"><li> h>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصور على السبورة الذكية.<\/td><td>يرتبونها.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المنظم التخطيطي (ملخص كتاب الطالب ص 50)<\/td><td>يوجه إلى تلخيص الوحدة.<\/td><td>يرسمون المنظم.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الثانية (كتاب الطالب ص 50–51)<\/td><td>يوزع الأسئلة على المجموعات.<\/td><td>يحلون ويعرضون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية.\nدور الطالب: يرتبونها.\n\n(8 دقائق) المنظم التخطيطي (ملخص كتاب الطالب ص 50)\nدور المعلم: يوجه إلى تلخيص الوحدة.\nدور الطالب: يرسمون المنظم.\n\n(15 دقيقة) أسئلة نهاية الوحدة الثانية (كتاب الطالب ص 50–51)\nدور المعلم: يوزع الأسئلة على المجموعات.\nدور الطالب: يحلون ويعرضون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يُستخلص الحديد بالكربون بينما يُستخلص الألومنيوم بالتحليل الكهربائي؟<\/td><td>لأن الحديد أدنى من الكربون في سلسلة النشاط، والألومنيوم أعلى منه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة اختزال أكسيد الحديد III بأول أكسيد الكربون.<\/td><td><bdi>Fe₂O₃ + 3CO → 2Fe + 3CO₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>شركة تريد حماية أنبوب فولاذي مدفون. اقترح طريقتين وقارن بينهما.<\/td><td>التغليف البلاستيكي يعزل لكنه يفشل إذا خُدش، والحماية بالتضحية بكتل ماغنيسيوم تستمر رغم الخدوش لكنها تتطلب استبدال الكتل دوريًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا يُستخلص الحديد بالكربون بينما يُستخلص الألومنيوم بالتحليل الكهربائي؟\nالإجابة النموذجية: لأن الحديد أدنى من الكربون في سلسلة النشاط، والألومنيوم أعلى منه.\n\n2) [المستوى المتوقع] اكتب معادلة اختزال أكسيد الحديد III بأول أكسيد الكربون.\nالإجابة النموذجية: Fe₂O₃ + 3CO → 2Fe + 3CO₂\n\n3) [المستوى المتقدم] شركة تريد حماية أنبوب فولاذي مدفون. اقترح طريقتين وقارن بينهما.\nالإجابة النموذجية: التغليف البلاستيكي يعزل لكنه يفشل إذا خُدش، والحماية بالتضحية بكتل ماغنيسيوم تستمر رغم الخدوش لكنها تتطلب استبدال الكتل دوريًا."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الخبث هو .........<\/td><td>سيليكات الكالسيوم CaSiO₃.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر استخدامًا لكل من الفولاذ المقاوم للصدأ والنحاس الأصفر.<\/td><td>أدوات المائدة أو مصانع الكيماويات؛ والصنابير أو المفاتيح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر: إضافة الكربون إلى الحديد تزيد صلابته.<\/td><td>ذرات الكربون مختلفة الحجم تعيق انزلاق طبقات ذرات الحديد فتزداد الصلابة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الخبث هو .........\nالإجابة النموذجية: سيليكات الكالسيوم CaSiO₃.\n\n2) [المستوى المتوقع] اذكر استخدامًا لكل من الفولاذ المقاوم للصدأ والنحاس الأصفر.\nالإجابة النموذجية: أدوات المائدة أو مصانع الكيماويات؛ والصنابير أو المفاتيح.\n\n3) [المستوى المتقدم] فسّر: إضافة الكربون إلى الحديد تزيد صلابته.\nالإجابة النموذجية: ذرات الكربون مختلفة الحجم تعيق انزلاق طبقات ذرات الحديد فتزداد الصلابة."},{"h":"<p>إكمال أسئلة نهاية الوحدة الثانية في كتاب الطالب ص 50–51، ومراجعة تمرين 1-2 وورقتي العمل 1-2 و2-2 في كتاب النشاط، والاستعداد للوحدة الثالثة: الكيمياء الكمية (ص 52).<\/p>","t":"إكمال أسئلة نهاية الوحدة الثانية في كتاب الطالب ص 50–51، ومراجعة تمرين 1-2 وورقتي العمل 1-2 و2-2 في كتاب النشاط، والاستعداد للوحدة الثالثة: الكيمياء الكمية (ص 52)."}]}],"comb":{"info":"<div><b>الدرس:< نة أكياس حبوب بكيس مرجعي).<\/p>","t":"سؤال: الذرة أصغر من أن توزن بالميزان. كيف نقارن كتل الذرات؟ (نمذجة بمقارنة أكياس حبوب بكيس مرجعي)."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الأكياس ويطرح السؤال.<\/td><td>يقترحون المقارنة بمرجع.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تعريف Ar (كتاب الطالب ص 52–53)<\/td><td>يعرّف Ar ويوضح المرجع C-12.<\/td><td>يدونون التعريف ويستخرجون Ar لـ H وO وNa وCl من الجدول.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">لماذا الكلور 35.5؟<\/td><td>يعرض على السبورة الذكية نظيري الكلور 35 و37 بنسبة 3 : 1 تقريبًا.<\/td><td>يحسبون: <bdi>(3 × 35 + 1 × 37) ÷ 4 = 35.5<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-3 حساب كتل الصيغ الكيميائية (البدء – كتاب النشاط ص 36)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الأكياس ويطرح السؤال.\nدور الطالب: يقترحون المقارنة بمرجع.\n\n(12 دقيقة) تعريف Ar (كتاب الطالب ص 52–53)\nدور المعلم: يعرّف Ar ويوضح المرجع C-12.\nدور الطالب: يدونون التعريف ويستخرجون Ar لـ H وO وNa وCl من الجدول.\n\n(10 دقائق) لماذا الكلور 35.5؟\nدور المعلم: يعرض على السبورة الذكية نظيري الكلور 35 و37 بنسبة 3 : 1 تقريبًا.\nدور الطالب: يحسبون: (3 × 35 + 1 × 37) ÷ 4 = 35.5.\n\n(8 دقائق) تمرين 1-3 حساب كتل الصيغ الكيميائية (البدء – كتاب النشاط ص 36)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المرجع المستخدم لقياس الكتل الذرية النسبية؟<\/td><td>ذرة الكربون-12 وكتلتها 12 وحدة تمامًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>استخرج Ar للصوديوم والأكسجين.<\/td><td><bdi>Na = 23<\/bdi>، <bdi>O = 16<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا Ar للكلور 35.5 وليس عددًا صحيحًا؟<\/td><td>لأنه متوسط كتل نظيريه 35 و37 مع مراعاة نسبة وجود كل منهما في الطبيعة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المرجع المستخدم لقياس الكتل الذرية النسبية؟\nالإجابة النموذجية: ذرة الكربون-12 وكتلتها 12 وحدة تمامًا.\n\n2) [المستوى المتوقع] استخرج Ar للصوديوم والأكسجين.\nالإجابة النموذجية: Na = 23، O = 16.\n\n3) [المستوى المتقدم] لماذا Ar للكلور 35.5 وليس عددًا صحيحًا؟\nالإجابة النموذجية: لأنه متوسط كتل نظيريه 35 و37 مع مراعاة نسبة وجود كل منهما في الطبيعة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: للكتلة الذرية النسبية وحدة قياس هي الغرام.<\/td><td>خطأ؛ هي قيمة نسبية بلا وحدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي الذرتين أثقل: <bdi>Mg (Ar = 24)<\/bdi> أم <bdi>C (Ar = 12)<\/bdi>؟ وكم مرة؟<\/td><td>Mg أثقل بمرتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عنصر له نظيران 10 و11 بنسبتي 20% و80%. احسب Ar.<\/td><td><bdi>(0.2 × 10) + (0.8 × 11) = 10.8<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: للكتلة الذرية النسبية وحدة قياس هي الغرام.\nالإجابة النموذجية: خطأ؛ هي قيمة نسبية بلا وحدة.\n\n2) [المستوى المتوقع] أي الذرتين أثقل: Mg (Ar = 24) أم C (Ar = 12)؟ وكم مرة؟\nالإجابة النموذجية: Mg أثقل بمرتين.\n\n3) [المستوى المتقدم] عنصر له نظيران 10 و11 بنسبتي 20% و80%. احسب Ar.\nالإجابة النموذجية: (0.2 × 10) + (0.8 × 11) = 10.8."},{"h":"<p>مراجعة كتاب الطالب ص 52–53 والإجابة عن السؤال 1-3.<\/p>","t":"مراجعة كتاب الطالب ص 52–53 والإجابة عن السؤال 1-3."}]},{"n":2,"focus":"الكتلة الجزيئية النسبية Mr واستنتاج الصيغ","info":"<div><b>الدرس:<\/b> 1-3 الكتل النسبية<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/ ass=\"ev\">مستوى الدعم<\/td><td>احسب Mr للماء <bdi>H₂O (H = 1<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>18.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب Mr لكربونات الكالسيوم <bdi>CaCO₃ (Ca = 40<\/bdi>، <bdi>C = 12<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>100.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نموذج فيه ذرة نيتروجين مرتبطة بثلاث ذرات هيدروجين. اكتب الصيغة واحسب <bdi>Mr (N = 14)<\/bdi>.<\/td><td>NH₃؛ <bdi>Mr = 17<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] احسب Mr للماء H₂O (H = 1، O = 16).\nالإجابة النموذجية: 18.\n\n2) [المستوى المتوقع] احسب Mr لكربونات الكالسيوم CaCO₃ (Ca = 40، C = 12، O = 16).\nالإجابة النموذجية: 100.\n\n3) [المستوى المتقدم] نموذج فيه ذرة نيتروجين مرتبطة بثلاث ذرات هيدروجين. اكتب الصيغة واحسب Mr (N = 14).\nالإجابة النموذجية: NH₃؛ Mr = 17."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: Mr لـ CO₂ = .........<\/td><td>44.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب كتلة الصيغة النسبية لـ <bdi>NaCl (Na = 23<\/bdi>، <bdi>Cl = 35.5)<\/bdi>.<\/td><td>58.5.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>احسب Mr لكبريتات النحاس <bdi>CuSO₄ (Cu = 64<\/bdi>، <bdi>S = 32<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>160.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: Mr لـ CO₂ = .........\nالإجابة النموذجية: 44.\n\n2) [المستوى المتوقع] احسب كتلة الصيغة النسبية لـ NaCl (Na = 23، Cl = 35.5).\nالإجابة النموذجية: 58.5.\n\n3) [المستوى المتقدم] احسب Mr لكبريتات النحاس CuSO₄ (Cu = 64، S = 32، O = 16).\nالإجابة النموذجية: 160."},{"h":"<p>إكمال تمرين 1-3 حساب كتل الصيغ الكيميائية في كتاب النشاط ص 36، والإجابة عن السؤالين 2-3 و3-3.<\/p>","t":"إكمال تمرين 1-3 حساب كتل الصيغ الكيميائية في كتاب النشاط ص 36، والإجابة عن السؤالين 2-3 و3-3."}]},{"n":3,"focus":"النسب الكتلية والتناسب في الحسابات الكيميائية","info":"<div><b>الدرس:<\/b> 1-3 الكتل النسبية<\/div><div><b>الوحدة:<\/b <\/span><span>التناسب<\/span><span>التركيب الكتلي<\/span><span>أكسيد الماغنيسيوم<\/span><\/div>","t":"النسبة المئوية الكتلية، التناسب، التركيب الكتلي، أكسيد الماغنيسيوم"},{"h":"<p>سؤال: كم غرامًا من الحديد يمكن الحصول عليه من 160 g من Fe₂O₃؟ <bdi>(Fe = 56<\/bdi>، <bdi>O = 16)<\/bdi><\/p>","t":"سؤال: كم غرامًا من الحديد يمكن الحصول عليه من 160 g من Fe₂O₃؟ (Fe = 56، O = 16)"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يحاولون الحل.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">النسبة المئوية الكتلية<\/td><td>يحل: نسبة الحديد في <bdi>Fe₂O₃ = 112 ÷ 160 × 100 = 70<\/bdi>%.<\/td><td>يحسبون نسبة الأكسجين في الماء ونسبة الكالسيوم في CaCO₃.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تحليل بيانات النشاط 1-3 (إثرائي – كتاب الطالب)<\/td><td>يعرض على السبورة الذكية بيانات تسخين شريط ماغنيسيوم في جفنة: كتلة <bdi>Mg = 0.24 g<\/bdi>، وكتلة الأكسيد = 0.40 g.<\/td><td>يحسبون كتلة الأكسجين 0.16 g والنسبة الكتلية <bdi>Mg : O = 3 : 2<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يحاولون الحل.\n\n(12 دقيقة) النسبة المئوية الكتلية\nدور المعلم: يحل: نسبة الحديد في Fe₂O₃ = 112 ÷ 160 × 100 = 70%.\nدور الطالب: يحسبون نسبة الأكسجين في الماء ونسبة الكالسيوم في CaCO₃.\n\n(10 دقائق) تحليل بيانات النشاط 1-3 (إثرائي – كتاب الطالب)\nدور المعلم: يعرض على السبورة الذكية بيانات تسخين شريط ماغنيسيوم في جفنة: كتلة Mg = 0.24 g، وكتلة الأكسيد = 0.40 g.\nدور الطالب: يحسبون كتلة الأكسجين 0.16 g والنسبة الكتلية Mg : O = 3 : 2.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب النسبة المئوية الكتلية للأكسجين في الماء.<\/td><td><bdi>16 ÷ 18 × 100<\/bdi> ≈ 88.9%.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما كتلة الحديد في 320 g من Fe₂O₃؟<\/td><td>70% × <bdi>320 = 224 g<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سُخن 0.24 g من الماغنيسيوم فتكون 0.40 g من أكسيده. احسب كتلة الأكسجين المتحد ونسبة Mg إلى O.<\/td><td>0.16 g؛ والنسبة 3 : 2.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] احسب النسبة المئوية الكتلية للأكسجين في الماء.\nالإجابة النموذجية: 16 ÷ 18 × 100 ≈ 88.9%.\n\n2) [المستوى المتوقع] ما كتلة الحديد في 320 g من Fe₂O₃؟\nالإجابة النموذجية: 70% × 320 = 224 g.\n\n3) [المستوى المتقدم] سُخن 0.24 g من الماغنيسيوم فتكون 0.40 g من أكسيده. احسب كتلة الأكسجين المتحد ونسبة Mg إلى O.\nالإجابة النموذجية: 0.16 g؛ والنسبة 3 : 2."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب النسبة المئوية الكتلية للكالسيوم في CaCO₃.<\/td><td>40%.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُرفع غطاء الجفنة قليلًا أثناء تسخين الماغنيسيوم؟<\/td><td>للسماح بدخول الأكسجين مع منع خروج دخان الأكسيد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أي المركبين أغنى بالنيتروجين: NH₃ أم NH₄NO₃؟ <bdi>(N = 14<\/bdi>، <bdi>H = 1<\/bdi>، <bdi>O = 16)<\/bdi><\/td><td>NH₃ نحو 82% مقابل 35% في NH₄NO₃؛ فالأمونيا أغنى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] احسب النسبة المئوية الكتلية للكالسيوم في CaCO₃.\nالإجابة النموذجية: 40%.\n\n2) [المستوى المتوقع] لماذا يُرفع غطاء الجفنة قليلًا أثناء تسخين الماغنيسيوم؟\nالإجابة النموذجية: للسماح بدخول الأكسجين مع منع خروج دخان الأكسيد.\n\n3) [المستوى المتقدم] أي المركبين أغنى بالنيتروجين: NH₃ أم NH₄NO₃؟ (N = 14، H = 1، O = 16)\nالإجابة النموذجية: NH₃ نحو 82% مقابل 35% في NH₄NO₃؛ فالأمونيا أغنى."},{"h":"<p>حل تمرين 2-3 التناسب في الحسابات الكيميائية وورقة العمل 1-3 النسب الكيميائية في كتاب النشاط ص 37 و46، والإجابة عن السؤال 4-3 والسؤال 1 من أسئلة نهاية الوحدة الثالثة.<\/p>","t":"حل تمرين 2-3 التناسب في الحسابات الكيميائية وورقة العمل 1-3 النسب الكيميائية في كتاب النشاط ص 37 و46، والإجابة عن السؤال 4-3 والسؤال 1 من أسئلة نهاية الوحدة الثالثة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-3 الكتل النسبية<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع التاسع (1–5/11/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 52–58 | كتاب النشاط: تمرين 1-3 ص 36، تمرين 2-3 ص 37، ورقة العمل 1-3 ص 46<\/div><div><b>دليل المعلم:<\/b> ص 54<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><ol class=\"ol\"><li>يعرّف الكتلة الذرية النسبية Ar بأنها متوسط كتل ذرات العنصر وفق مقياس تكون فيه كتلة ذرة الكربون-12 مساوية تمامًا 12 وحدة.<\/li><li>يستخرج قيم Ar من الجدول الدوري.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب كون Ar لبعض العناصر غير عدد صحيح مثل الكلور 35.5.<\/div><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><ol class=\"ol\"><li>يعرّف الكتلة الجزيئية النسبية Mr بأنها مجموع الكتل الذرية النسبية ويحسبها.<\/li><li>يستنتج صيغة مركب بسيط من نموذج أو تمثيل تخطيطي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستخدم كتلة الصيغة النسبية للمركبات الأيونية.<\/div><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><ol class=\"ol\"><li>يستخدم Mr لحساب النسبة المئوية الكتلية لعنصر في مركب.<\/li><li>يطبق التناسب في الحسابات الكيميائية البسيطة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج التركيب الكتلي لأكسيد الماغنيسيوم من بيانات تجريبية.<\/div>","t":"الحصة 1: الكتلة الذرية النسبية Ar\n1. يعرّف الكتلة الذرية النسبية Ar بأنها متوسط كتل ذرات العنصر وفق مقياس تكون فيه كتلة ذرة الكربون-12 مساوية تمامًا 12 وحدة.\n2. يستخرج قيم Ar من الجدول الدوري.\nمخرج تعليمي آخر: يفسر سبب كون Ar لبعض العناصر غير عدد صحيح مثل الكلور 35.5.\n\nالحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ\n1. يعرّف الكتلة الجزيئية النسبية Mr بأنها مجموع الكتل الذرية النسبية ويحسبها.\n2. يستنتج صيغة مركب بسيط من نموذج أو تمثيل تخطيطي.\nمخرج تعليمي آخر: يستخدم كتلة الصيغة النسبية للمركبات الأيونية.\n\nالحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية\n1. يستخدم Mr لحساب النسبة المئوية الكتلية لعنصر في مركب.\n2. يطبق التناسب في الحسابات الكيميائية البسيطة.\nمخرج تعليمي آخر: يستنتج التركيب الكتلي لأكسيد الماغنيسيوم من بيانات تجريبية."},{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف الكتلة الذرية النسبية Ar بأنها متوسط كتل ذرات العنصر وفق مقياس تكون فيه كتلة ذرة الكربون-12 مساوية تمامًا 12 وحدة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخرج قيم Ar من الجدول الدوري.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر سبب كون Ar لبعض العناصر غير عدد صحيح مثل الكلور 35.5.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف الكتلة الجزيئية النسبية Mr بأنها مجموع الكتل الذرية النسبية ويحسبها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يستنتج صيغة مركب بسيط من نموذج أو تمثيل تخطيطي.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يستخدم كتلة الصيغة النسبية للمركبات الأيونية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم Mr لحساب النسبة المئوية الكتلية لعنصر في مركب.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق التناسب ف },{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><p>سؤال: الذرة أصغر من أن توزن بالميزان. كيف نقارن كتل الذرات؟ (نمذجة بمقارنة أكياس حبوب بكيس مرجعي).<\/p><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><p>يعرض نموذجين مجسمين لجزيئي الماء وثاني أكسيد الكربون ويسأل: ما صيغة كل منهما؟ وكيف نحسب «كتلته» النسبية؟<\/p><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><p>سؤال: كم غرامًا من الحديد يمكن الحصول عليه من 160 g من Fe₂O₃؟ <bdi>(Fe = 56<\/bdi>، <bdi>O = 16)<\/bdi><\/p>","t":"الحصة 1: الكتلة الذرية النسبية Ar\nسؤال: الذرة أصغر من أن توزن بالميزان. كيف نقارن كتل الذرات؟ (نمذجة بمقارنة أكياس حبوب بكيس مرجعي).\n\nالحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ\nيعرض نموذجين مجسمين لجزيئي الماء وثاني أكسيد الكربون ويسأل: ما صيغة كل منهما؟ وكيف نحسب «كتلته» النسبية؟\n\nالحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية\nسؤال: كم غرامًا من الحديد يمكن الحصول عليه من 160 g من Fe₂O₃؟ (Fe = 56، O = 16)"},{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الأكياس ويطرح السؤال.<\/td><td>يقترحون المقارنة بمرجع.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تعريف Ar (كتاب الطالب ص 52–53)<\/td><td>يعرّف Ar ويوضح المرجع C-12.<\/td><td>يدونون التعريف ويستخرجون Ar لـ H وO وNa وCl من الجدول.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">لماذا الكلور 35.5؟<\/td><td>يعرض على السبورة الذكية نظيري الكلور 35 و37 بنسبة 3 : 1 تقريبًا.<\/td><td>يحسبون: <bdi>(3 × 35 + 1 × 37) ÷ 4 = 35.5<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-3 حساب كتل الصيغ الكيميائية (البدء – كتاب النشاط ص 36)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض النموذجين.<\/td><td>يكتبون الصيغتين.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">حساب Mr (كتاب الطالب ص 54–55)<\/td><td>يحل: <bdi>Mr(H₂O) = 18<\/bdi>، <bdi>Mr(CO₂) = 44<\/bdi>، <bdi>Mr(CaCO₃) = 100<\/bdi>.<\/td><td>يحسبون Mr لـ NaCl وH₂SO₄ وMgO.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">من النموذج إلى الصيغة<\/td><td>يعرض نماذج ومخططات لـ CH₄ وNH₃ وشبكة أيونية لـ MgO.<\/td><td>يستنتجون الصيغ ويحسبون Mr.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-3 حساب كتل الصيغ الكيميائية (كتاب النشاط ص 36)<\/td><td>يتابع.<\/td><td>يكملون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يحاولون الحل.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">النسبة المئوية الكتلية<\/td><td>يحل: نسبة الحديد في <bdi>Fe₂O₃ = 112 ÷ 160 × 100 = 70<\/bdi>%.<\/td><td>يحسبون نسبة الأكسجين في الماء ونسبة الكالسيوم في CaCO₃.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تحليل بيانات النشاط 1-3 (إثرائي – كتاب الطالب)<\/td><td>يعرض على السبورة الذكية بيانات تسخين شريط ماغنيسيوم في جفنة: كتلة <bdi>Mg = 0.24 g<\/bdi>، وكتلة الأكسيد = 0.40 g.<\/td><td>يحسبون كتلة الأكسجين 0.16 g والنسبة الكتلية <bdi>Mg : O = 3 : 2<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الكتلة الذرية النسبية Ar\n(5 دقائق) التهيئة\nدور المعلم: يعرض الأكياس ويطرح السؤال.\nدور الطالب: يقترحون المقارنة بمرجع.\n\n(12 دقيقة) تعريف Ar (كتاب الطالب ص 52–53)\nدور المعلم: يعرّف Ar ويوضح المرجع C-12.\nدور الطالب: يدونون التعريف ويستخرجون Ar لـ H وO وNa وCl من الجدول.\n\n(10 دقائق) لماذا الكلور 35.5؟\nدور المعلم: يعرض على السبورة الذكية نظيري الكلور 35 و37 بنسبة 3 : 1 تقريبًا.\nدور الطالب: يحسبون: (3 × 35 + 1 × 37) ÷ 4 = 35.5.\n\n(8 دقائق) تمرين 1-3 حساب كتل الصيغ الكيميائية (البدء – كتاب النشاط ص 36)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ\n(5 دقائق) التهيئة\nدور المعلم: يعرض النموذجين.\nدور الطالب: يكتبون الصيغتين.\n\n(12 دقيقة) حساب Mr (كتاب الطالب ص 54–55)\nدور المعلم: يحل: Mr(H₂O) = 18، Mr(CO₂) = 44، Mr(CaCO₃) = 100.\nدور الطالب: يحسبون Mr لـ NaCl وH₂SO₄ وMgO.\n\n(10 دقائق) من النموذج إلى الصيغة\nدور المعلم: يعرض نماذج ومخططات لـ CH₄ وNH₃ وشبكة أيونية لـ MgO.\nدور الطالب: يستنتجون الصيغ ويحسبون Mr.\n\n(8 دقائق) تمرين 1-3 حساب كتل الصيغ الكيميائية (كتاب النشاط ص 36)\nدور المعلم: يتابع.\nدور الطالب: يكملون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يحاولون الحل.\n\n(12 دقيقة) النسبة المئوية الكتلية\nدور المعلم: يحل: نسبة الحديد في Fe₂O₃ = 112 ÷ 160 × 100 = 70%.\nدور الطالب: يحسبون نسبة الأكسجين في الماء ونسبة الكالسيوم في CaCO₃.\n\n(10 دقائق) تحليل بيانات النشاط 1-3 (إثرائي – كتاب الطالب)\nدور المعلم: يعرض على السبورة الذكية بيانات تسخين شريط ماغنيسيوم في جفنة: كتلة Mg = 0.24 g، وكتلة الأكسيد = 0.40 g.\nدور الطالب: يحسبون كتلة الأكسجين 0.16 g والنسبة الكتلية Mg : O = 3 : 2.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المرجع المستخدم لقياس الكتل الذرية النسبية؟<\/td><td>ذرة الكربون-12 وكتلتها 12 وحدة تمامًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>استخرج Ar للصوديوم والأكسجين.<\/td><td><bdi>Na = 23<\/bdi>، <bdi>O = 16<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا Ar للكلور 35.5 وليس عددًا صحيحًا؟<\/td><td>لأنه متوسط كتل نظيريه 35 و37 مع مراعاة نسبة وجود كل منهما في الطبيعة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب Mr للماء <bdi>H₂O (H = 1<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>18.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب Mr لكربونات الكالسيوم <bdi>CaCO₃ (Ca = 40<\/bdi>، <bdi>C = 12<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>100.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نموذج فيه ذرة نيتروجين مرتبطة بثلاث ذرات هيدروجين. اكتب الصيغة واحسب <bdi>Mr (N = 14)<\/bdi>.<\/td><td>NH₃؛ <bdi>Mr = 17<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب النسبة المئوية الكتلية للأكسجين في الماء.<\/td><td><bdi>16 ÷ 18 × 100<\/bdi> ≈ 88.9%.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما كتلة الحديد في 320 g من Fe₂O₃؟<\/td><td>70% × <bdi>320 = 224 g<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سُخن 0.24 g من الماغنيسيوم فتكون 0.40 g من أكسيده. احسب كتلة الأكسجين المتحد ونسبة Mg إلى O.<\/td><td>0.16 g؛ والنسبة 3 : 2.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الكتلة الذرية النسبية Ar\n1) [مستوى الدعم] ما المرجع المستخدم لقياس الكتل الذرية النسبية؟\nالإجابة النموذجية: ذرة الكربون-12 وكتلتها 12 وحدة تمامًا.\n\n2) [المستوى المتوقع] استخرج Ar للصوديوم والأكسجين.\nالإجابة النموذجية: Na = 23، O = 16.\n\n3) [المستوى المتقدم] لماذا Ar للكلور 35.5 وليس عددًا صحيحًا؟\nالإجابة النموذجية: لأنه متوسط كتل نظيريه 35 و37 مع مراعاة نسبة وجود كل منهما في الطبيعة.\n\nالحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ\n1) [مستوى الدعم] احسب Mr للماء H₂O (H = 1، O = 16).\nالإجابة النموذجية: 18.\n\n2) [المستوى المتوقع] احسب Mr لكربونات الكالسيوم CaCO₃ (Ca = 40، C = 12، O = 16).\nالإجابة النموذجية: 100.\n\n3) [المستوى المتقدم] نموذج فيه ذرة نيتروجين مرتبطة بثلاث ذرات هيدروجين. اكتب الصيغة واحسب Mr (N = 14).\nالإجابة النموذجية: NH₃؛ Mr = 17.\n\nالحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية\n1) [مستوى الدعم] احسب النسبة المئوية الكتلية للأكسجين في الماء.\nالإجابة النموذجية: 16 ÷ 18 × 100 ≈ 88.9%.\n\n2) [المستوى المتوقع] ما كتلة الحديد في 320 g من Fe₂O₃؟\nالإجابة النموذجية: 70% × 320 = 224 g.\n\n3) [المستوى المتقدم] سُخن 0.24 g من الماغنيسيوم فتكون 0.40 g من أكسيده. احسب كتلة الأكسجين المتحد ونسبة Mg إلى O.\nالإجابة النموذجية: 0.16 g؛ والنسبة 3 : 2."},{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: للكتلة الذرية النسبية وحدة قياس هي الغرام.<\/td><td>خطأ؛ هي قيمة نسبية بلا وحدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي الذرتين أثقل: <bdi>Mg (Ar = 24)<\/bdi> أم <bdi>C (Ar = 12)<\/bdi>؟ وكم مرة؟<\/td><td>Mg أثقل بمرتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عنصر له نظيران 10 و11 بنسبتي 20% و80%. احسب Ar.<\/td><td><bdi>(0.2 × 10) + (0.8 × 11) = 10.8<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: Mr لـ CO₂ = .........<\/td><td>44.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب كتلة الصيغة النسبية لـ <bdi>NaCl (Na = 23<\/bdi>، <bdi>Cl = 35.5)<\/bdi>.<\/td><td>58.5.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>احسب Mr لكبريتات النحاس <bdi>CuSO₄ (Cu = 64<\/bdi>، <bdi>S = 32<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>160.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب النسبة المئوية الكتلية للكالسيوم في CaCO₃.<\/td><td>40%.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُرفع غطاء الجفنة قليلًا أثناء تسخين الماغنيسيوم؟<\/td><td>للسماح بدخول الأكسجين مع منع خروج دخان الأكسيد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أي المركبين أغنى بالنيتروجين: NH₃ أم NH₄NO₃؟ <bdi>(N = 14<\/bdi>، <bdi>H = 1<\/bdi>، <bdi>O = 16)<\/bdi><\/td><td>NH₃ نحو 82% مقابل 35% في NH₄NO₃؛ فالأمونيا أغنى.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الكتلة الذرية النسبية Ar\n1) [مستوى الدعم] صواب أم خطأ: للكتلة الذرية النسبية وحدة قياس هي الغرام.\nالإجابة النموذجية: خطأ؛ هي قيمة نسبية بلا وحدة.\n\n2) [المستوى المتوقع] أي الذرتين أثقل: Mg (Ar = 24) أم C (Ar = 12)؟ وكم مرة؟\nالإجابة النموذجية: Mg أثقل بمرتين.\n\n3) [المستوى المتقدم] عنصر له نظيران 10 و11 بنسبتي 20% و80%. احسب Ar.\nالإجابة النموذجية: (0.2 × 10) + (0.8 × 11) = 10.8.\n\nالحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ\n1) [مستوى الدعم] أكمل: Mr لـ CO₂ = .........\nالإجابة النموذجية: 44.\n\n2) [المستوى المتوقع] احسب كتلة الصيغة النسبية لـ NaCl (Na = 23، Cl = 35.5).\nالإجابة النموذجية: 58.5.\n\n3) [المستوى المتقدم] احسب Mr لكبريتات النحاس CuSO₄ (Cu = 64، S = 32، O = 16).\nالإجابة النموذجية: 160.\n\nالحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية\n1) [مستوى الدعم] احسب النسبة المئوية الكتلية للكالسيوم في CaCO₃.\nالإجابة النموذجية: 40%.\n\n2) [المستوى المتوقع] لماذا يُرفع غطاء الجفنة قليلًا أثناء تسخين الماغنيسيوم؟\nالإجابة النموذجية: للسماح بدخول الأكسجين مع منع خروج دخان الأكسيد.\n\n3) [المستوى المتقدم] أي المركبين أغنى بالنيتروجين: NH₃ أم NH₄NO₃؟ (N = 14، H = 1، O = 16)\nالإجابة النموذجية: NH₃ نحو 82% مقابل 35% في NH₄NO₃؛ فالأمونيا أغنى."},{"h":"<div class=\"psub\">الحصة 1: الكتلة الذرية النسبية Ar<\/div><p>مراجعة كتاب الطالب ص 52–53 والإجابة عن السؤال 1-3.<\/p><div class=\"psub\">الحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ<\/div><p>إكمال تمرين 1-3 حساب كتل الصيغ الكيميائية في كتاب النشاط ص 36، والإجابة عن السؤالين 2-3 و3-3.<\/p><div class=\"psub\">الحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية<\/div><p>حل تمرين 2-3 التناسب في الحسابات الكيميائية وورقة العمل 1-3 النسب الكيميائية في كتاب النشاط ص 37 و46، والإجابة عن السؤال 4-3 والسؤال 1 من أسئلة نهاية الوحدة الثالثة.<\/p>","t":"الحصة 1: الكتلة الذرية النسبية Ar\nمراجعة كتاب الطالب ص 52–53 والإجابة عن السؤال 1-3.\n\nالحصة 2: الكتلة الجزيئية النسبية Mr واستنتاج الصيغ\nإكمال تمرين 1-3 حساب كتل الصيغ الكيميائية في كتاب النشاط ص 36، والإجابة عن السؤالين 2-3 و3-3.\n\nالحصة 3: النسب الكتلية والتناسب في الحسابات الكيميائية\nحل تمرين 2-3 التناسب في الحسابات الكيميائية وورقة العمل 1-3 النسب الكيميائية في كتاب النشاط ص 37 و46، والإجابة عن السؤال 4-3 والسؤال 1 من أسئلة نهاية الوحدة الثالثة."}]}},{"label":"2-3 المول","unit":"الوحدة الثالثة: الكيمياء الكمية","periods":[{"n":1,"focus":"المول وثابت أفوجادرو والكتلة المولية","info":"<div><b>الدرس:<\/b> 2-3 المول<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>رقم الحصة: بًا لصنع 25 كعكة؟ ثم يربط المعلم المعادلة الكيميائية بالوصفة.<\/p>","t":"سؤال: لصنع 10 كعكات نحتاج إلى كوبين من الطحين؛ كم كوبًا لصنع 25 كعكة؟ ثم يربط المعلم المعادلة الكيميائية بالوصفة."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح سؤال الوصفة.<\/td><td>يحسبون 5 أكواب ويستنتجون فكرة التناسب.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الخطوات الأربع (كتاب الطالب ص 61–62)<\/td><td>يعرض على السبورة الذكية: كتلة ← مولات ← نسبة المعادلة ← مولات الناتج ← كتلة، ويحل: <bdi>2Mg + O₂ → 2MgO<\/bdi>؛ <bdi>4.8 g Mg = 0.2 mol<\/bdi> ← <bdi>0.2 mol MgO = 8.0 g<\/bdi>.<\/td><td>يدونون الخطوات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">تطبيق موجه<\/td><td>يعرض مسألة <bdi>CaCO₃ → CaO + CO₂<\/bdi>: كتلة CaO من 50 g CaCO₃.<\/td><td>يحلون: 0.5 mol ← 0.5 mol CaO ← 28 g.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 8-3 و9-3<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح سؤال الوصفة.\nدور الطالب: يحسبون 5 أكواب ويستنتجون فكرة التناسب.\n\n(12 دقيقة) الخطوات الأربع (كتاب الطالب ص 61–62)\nدور المعلم: يعرض على السبورة الذكية: كتلة ← مولات ← نسبة المعادلة ← مولات الناتج ← كتلة، ويحل: 2Mg + O₂ → 2MgO؛ 4.8 g Mg = 0.2 mol ← 0.2 mol MgO = 8.0 g.\nدور الطالب: يدونون الخطوات.\n\n(13 دقيقة) تطبيق موجه\nدور المعلم: يعرض مسألة CaCO₃ → CaO + CO₂: كتلة CaO من 50 g CaCO₃.\nدور الطالب: يحلون: 0.5 mol ← 0.5 mol CaO ← 28 g.\n\n(5 دقائق) السؤالان 8-3 و9-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><t ":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: كربونات النحاس، ميزان، جفنة، موقد بنزن، نظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: كربونات النحاس، ميزان، جفنة، موقد بنزن، نظارات واقية"},{"h":"<div class=\"pills\"><span>الكتلة المحسوبة<\/span><span>الكتلة الفعلية<\/span><span>التفكك الحراري<\/span><span>ثبات الكتلة<\/span><\/div>","t":"الكتلة المحسوبة، الكتلة الفعلية، التفكك الحراري، ثبات الكتلة"},{"h":"<p>سؤال: إذا سخنا 12.4 g من كربونات النحاس، فكم نتوقع أن نحصل على أكسيد النحاس؟ ثم نقارن بالتجربة.<\/p>","t":"سؤال: إذا سخنا 12.4 g من كربونات النحاس، فكم نتوقع أن نحصل على أكسيد النحاس؟ ثم نقارن بالتجربة."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-3 استقصاء العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة (إثرائي – كتاب الطالب)<\/td><td>يوجه إلى تسخين كتل مختلفة من كربونات النحاس حتى ثبات الكتلة: <bdi>CuCO₃ → CuO + CO₂<\/bdi>.<\/td><td>يسجلون الكتل ويرسمون كتلة الناتج بدلالة كتلة المتفاعل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المقارنة بالحساب<\/td><td>يحل على السبورة الذكية: <bdi>12.4 g CuCO₃ = 0.1 mol<\/bdi> ← 8.0 g CuO.<\/td><td>يقارنون نتائجهم بالقيمة المحسوبة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 2-3 استقصاء العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة (إثرائي – كتاب الطالب)\nدور المعلم: يوجه إلى تسخين كتل مختلفة من كربونات النحاس حتى ثبات الكتلة: CuCO₃ → CuO + CO₂.\nدور الطالب: يسجلون الكتل ويرسمون كتلة الناتج بدلالة كتلة المتفاعل.\n\n(8 دقائق) المقارنة بالحساب\nدور المعلم: يحل على السبورة الذكية: 12.4 g CuCO₃ = 0.1 mol ← 8.0 g CuO.\nدور الطالب: يقارنون نتائجهم بالقيمة المحسوبة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الغاز المتصاعد عند تسخين كربونات النحاس؟<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب كتلة CuO الناتجة من <bdi>24.8 g CuCO₃ (CuCO₃ = 124<\/bdi>، <bdi>CuO = 80)<\/bdi>.<\/td><td>0.2 mol ← 16.0 g.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>حصل طالب على 7.5 g من CuO بدل 8.0 g المحسوبة. اقترح سببين.<\/td><td>فقد جزء من المسحوق بالتطاير أو أثناء النقل، أو خطأ في قراءة الميزان.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الغاز المتصاعد عند تسخين كربونات النحاس؟\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n2) [المستوى المتوقع] احسب كتلة CuO الناتجة من 24.8 g CuCO₃ (CuCO₃ = 124، CuO = 80).\nالإجابة النموذجية: 0.2 mol ← 16.0 g.\n\n3) [المستوى المتقدم] حصل طالب على 7.5 g من CuO بدل 8.0 g المحسوبة. اقترح سببين.\nالإجابة النموذجية: فقد جزء من المسحوق بالتطاير أو أثناء النقل، أو خطأ في قراءة الميزان."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تُسخن المادة حتى ثبات الكتلة للتأكد من اكتمال التفاعل.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم غرامًا من CuCO₃ تلزم لإنتاج 4.0 g من CuO؟<\/td><td>0.05 mol ← 6.2 g.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تقل كتلة الجفنة ومحتواها أثناء تسخين كربونات النحاس؟<\/td><td>لأن ثاني أكسيد الكربون الناتج غاز يغادر الجفنة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تُسخن المادة حتى ثبات الكتلة للتأكد من اكتمال التفاعل.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] كم غرامًا من CuCO₃ تلزم لإنتاج 4.0 g من CuO؟\nالإجابة النموذجية: 0.05 mol ← 6.2 g.\n\n3) [المستوى المتقدم] لماذا تقل كتلة الجفنة ومحتواها أثناء تسخين كربونات النحاس؟\nالإجابة النموذجية: لأن ثاني أكسيد الكربون الناتج غاز يغادر الجفنة."},{"h":"<p>حل الجزء الخاص بالكتل من ورقة العمل 3-3 الكتل المتفاعلة وحجوم الغازات في كتاب النشاط ص 48–49، والإجابة عن السؤال 10-3.<\/p>","t":"حل الجزء الخاص بالكتل من ورقة العمل 3-3 الكتل المتفاعلة وحجوم الغازات في كتاب النشاط ص 48–49، والإجابة عن السؤال 10-3."}]},{"n":3,"focus":"ماء التبلور وتحديد الصيغة من بيانات التسخين","info":"<div><b>الدرس:<\/b> 3-3 حسابات تتضمن كتلًا متفاعلة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 61–64 | كتاب النشاط: تمرين 3-3 (ب، ج) ص 38–39، ورقة العمل 3-3 ص 48–49، ورقة العمل 4-3 ص 50–51<\/div><div><b>دليل المعلم:<\/b> ص 55<\/div><div><b>محور الحصة:<\/b> ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية.<\/li><li>يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة.<\/div>","t":"1. يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية.\n2. يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة.\nمخرج تعليمي آخر: يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية. ← تطبيق\n• يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة. ← تحليل\n• يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: بلورات كبريتات النحاس المائية، أنبوب اختبار، موقد بنزن<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: بلورات كبريتات النحاس المائية، أنبوب اختبار، موقد بنزن"},{"h":"<div class=\"pills\"><span>ماء التبلور<\/span><span>الملح المائي<\/span><span>الملح اللامائي<\/span><span>ثبات الكتلة<\/span><\/div>","t":"ماء التبلور، الملح المائي، الملح اللامائي، ثبات الكتلة"},{"h":"<p>يسخن المعلم بلورات كبريتات النحاس الزرقاء أمام الطلبة فتتحول إلى مسحوق أبيض؛ سؤال: أين ذهب اللون؟<\/p>","t":"يسخن المعلم بلورات كبريتات النحاس الزرقاء أمام الطلبة فتتحول إلى مسحوق أبيض؛ سؤال: أين ذهب اللون؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يلاحظون تكثف قطرات ماء في أعلى الأنبوب.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ماء التبلور<\/td><td>يوضح أن بعض الأملاح تحتوي على جزيئات ماء في بلوراتها مثل CuSO₄·5H₂O وBaCl₂·2H₂O.<\/td><td>يحسبون Mr لـ CuSO₄·<bdi>5H₂O = 250<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">ورقة العمل 4-3 تجفيف بلورات كلوريد الباريوم (كتاب النشاط ص 50–51)<\/td><td>يعرض بيانات: 2.44 g بلورات أصبحت 2.08 g بعد التسخين.<\/td><td>يحسبون: كتلة الماء <bdi>0.36 g = 0.02 mol<\/bdi>، و<bdi>BaCl₂ = 0.01 mol<\/bdi>، فالنسبة 1 : 2.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤال 11-3<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يلاحظون تكثف قطرات ماء في أعلى الأنبوب.\n\n(10 دقائق) ماء التبلور\nدور المعلم: يوضح أن بعض الأملاح تحتوي على جزيئات ماء في بلوراتها مثل CuSO₄·5H₂O وBaCl₂·2H₂O.\nدور الطالب: يحسبون Mr لـ CuSO₄·5H₂O = 250.\n\n(15 دقيقة) ورقة العمل 4-3 تجفيف بلورات كلوريد الباريوم (كتاب النشاط ص 50–51)\nدور المعلم: يعرض بيانات: 2.44 g بلورات أصبحت 2.08 g بعد التسخين.\nدور الطالب: يحسبون: كتلة الماء 0.36 g = 0.02 mol، وBaCl₂ = 0.01 mol، فالنسبة 1 : 2.\n\n(5 دقائق) السؤال 11-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بماء التبلور؟<\/td><td>جزيئات ماء مرتبطة داخل بلورات بعض الأملاح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب Mr لـ CuSO₄·<bdi>5H₂O (CuSO₄ = 160<\/bdi>، <bdi>H₂O = 18)<\/bdi>.<\/td><td>250.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سُخن 2.44 g من كلوريد الباريوم المائي حتى ثبات الكتلة فبقي 2.08 g. احسب x في BaCl₂·<bdi>xH₂O (BaCl₂ = 208)<\/bdi>.<\/td><td>الماء <bdi>0.36 g = 0.02 mol<\/bdi>، و<bdi>BaCl₂ = 0.01 mol<\/bdi>، فـ <bdi>x = 2<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بماء التبلور؟\nالإجابة النموذجية: جزيئات ماء مرتبطة داخل بلورات بعض الأملاح.\n\n2) [المستوى المتوقع] احسب Mr لـ CuSO₄·5H₂O (CuSO₄ = 160، H₂O = 18).\nالإجابة النموذجية: 250.\n\n3) [المستوى المتقدم] سُخن 2.44 g من كلوريد الباريوم المائي حتى ثبات الكتلة فبقي 2.08 g. احسب x في BaCl₂·xH₂O (BaCl₂ = 208).\nالإجابة النموذجية: الماء 0.36 g = 0.02 mol، وBaCl₂ = 0.01 mol، فـ x = 2."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تتحول بلورات كبريتات النحاس الزرقاء إلى مسحوق أبيض بالتسخين بسبب فقد .........<\/td><td>ماء التبلور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُكرر التسخين والوزن حتى ثبات الكتلة؟<\/td><td>للتأكد من إزالة ماء التبلور كله.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما أثر التسخين غير الكافي في قيمة x المحسوبة؟ فسّر.<\/td><td>تصبح x أصغر من الحقيقية؛ لأن كتلة الماء المفقود المقيسة أقل من الفعلية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تتحول بلورات كبريتات النحاس الزرقاء إلى مسحوق أبيض بالتسخين بسبب فقد .........\nالإجابة النموذجية: ماء التبلور.\n\n2) [المستوى المتوقع] لماذا يُكرر التسخين والوزن حتى ثبات الكتلة؟\nالإجابة النموذجية: للتأكد من إزالة ماء التبلور كله.\n\n3) [المستوى المتقدم] ما أثر التسخين غير الكافي في قيمة x المحسوبة؟ فسّر.\nالإجابة النموذجية: تصبح x أصغر من الحقيقية؛ لأن كتلة الماء المفقود المقيسة أقل من الفعلية."},{"h":"<p>إكمال ورقة العمل 4-3 في كتاب النشاط ص 50–51، والإجابة عن السؤال 11-3 والسؤال 3 من أسئلة نهاية الوحدة الثالثة.<\/p>","t":"إكمال ورقة العمل 4-3 في كتاب النشاط ص 50–51، والإجابة عن السؤال 11-3 والسؤال 3 من أسئلة نهاية الوحدة الثالثة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-3 حسابات تتضمن كتلًا متفاعلة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)، الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 61–64 | كتاب النشاط: تمرين 3-3 (ب، ج) ص 38–39، ورقة العمل 3-3 ص 48–49، ورقة العمل 4-3 ص 50–51<\/div><div><b>دليل المعلم:<\/b> ص 55<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><ol class=\"ol\"><li>يستخدم المعادلة الموزونة لتحديد نسب المولات بين المتفاعلات والنواتج.<\/li><li>يحسب كتلة ناتج من كتلة متفاعل معلومة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتحقق من قانون حفظ الكتلة في تفاعل بسيط.<\/div><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><ol class=\"ol\"><li>يحسب كتلة متفاعل لازم لإنتاج كتلة محددة من ناتج.<\/li><li>يستقصي العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر الفرق بين الكتلة المقيسة للناتج والكتلة المحسوبة.<\/div><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><ol class=\"ol\"><li>يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية.<\/li><li>يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة.<\/div>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\n1. يستخدم المعادلة الموزونة لتحديد نسب المولات بين المتفاعلات والنواتج.\n2. يحسب كتلة ناتج من كتلة متفاعل معلومة.\nمخرج تعليمي آخر: يتحقق من قانون حفظ الكتلة في تفاعل بسيط.\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\n1. يحسب كتلة متفاعل لازم لإنتاج كتلة محددة من ناتج.\n2. يستقصي العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة.\nمخرج تعليمي آخر: يفسر الفرق بين الكتلة المقيسة للناتج والكتلة المحسوبة.\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\n1. يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية.\n2. يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة.\nمخرج تعليمي آخر: يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة."},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم المعادلة الموزونة لتحديد نسب المولات بين المتفاعلات والنواتج.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحسب كتلة ناتج من كتلة متفاعل معلومة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يتحقق من قانون حفظ الكتلة في تفاعل بسيط.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب كتلة متفاعل لازم لإنتاج كتلة محددة من ناتج.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يستقصي العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يفسر الفرق بين الكتلة المقيسة للناتج والكتلة المحسوبة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\n• يستخدم المعادلة الموزونة لتحديد نسب المولات بين المتفاعلات والنواتج. ← فهم\n• يحسب كتلة ناتج من كتلة متفاعل معلومة. ← تطبيق\n• يتحقق من قانون حفظ الكتلة في تفاعل بسيط. ← تحليل\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\n• يحسب كتلة متفاعل لازم لإنتاج كتلة محددة من ناتج. ← تطبيق\n• يستقصي العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة. ← تحليل\n• يفسر الفرق بين الكتلة المقيسة للناتج والكتلة المحسوبة. ← تقييم\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\n• يحسب عدد جزيئات ماء التبلور في ملح متبلور من بيانات تجريبية. ← تطبيق\n• يطبق حسابات المولات على بيانات التسخين حتى ثبات الكتلة. ← تحليل\n• يقيّم أثر مصادر الخطأ في تجربة إزالة ماء التبلور على النتيجة. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: خطوات حس
