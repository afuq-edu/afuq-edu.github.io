,{"h":"<div class=\"pills\"><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: بطاقات المشتقات واستخداماتها<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بطاقات المشتقات واستخداماتها"},{"h":"<div class=\"pills\"><span>غاز التكرير<\/span><span>الجازولين<\/span><span>النفثا<\/span><span>الديزل<\/span><span>الأسفلت<\/span><span>التطاير<\/span><span>اللزوجة<\/span><\/div>","t":"غاز التكرير، الجازولين، النفثا، الديزل، الأسفلت، التطاير، اللزوجة"},{"h":"<p>لعبة «من أنا؟»: «أُستخدم في رصف الطرق ولزوجتي عالية جدًا» – من أنا؟<\/p>","t":"لعبة «من أنا؟»: «أُستخدم في رصف الطرق ولزوجتي عالية جدًا» – من أنا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح بطاقات «من أنا؟».<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تدرج الخصائص (كتاب الطالب ص 93–96)<\/td><td>يعرض على السبورة الذكية جدولًا: كلما طالت السلسلة ارتفعت درجة الغليان وزادت اللزوجة وقل التطاير.<\/td><td>يرسمون أسهم التدرج على مخطط البرج.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المشتقات واستخداماتها<\/td><td>يوزع بطاقات المشتقات والاستخدامات.<\/td><td>يطابقون: غاز التكرير للطبخ والتدفئة، والجازولين وقودًا للسيارات، والنفثا مادة أولية للكيماويات، والديزل لمحركات الديزل، والأسفلت للطرق.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم وتمرين 4-4 (البدء)<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح بطاقات «من أنا؟».\nدور الطالب: يجيبون.\n\n(12 دقيقة) تدرج الخصائص (كتاب الطالب ص 93–96)\nدور المعلم: يعرض على السبورة الذكية جدولًا: كلما طالت السلسلة ارتفعت درجة الغليان وزادت اللزوجة وقل التطاير.\nدور الطالب: يرسمون أسهم التدرج على مخطط البرج.\n\n(10 دقائق) المشتقات واستخداماتها\nدور المعلم: يوزع بطاقات المشتقات والاستخدامات.\nدور الطالب: يطابقون: غاز التكرير للطبخ والتدفئة، والجازولين وقودًا للسيارات، والنفثا مادة أولية للكيماويات، والديزل لمحركات الديزل، والأسفلت للطرق.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم وتمرين 4-4 (البدء)\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما استخدام مشتق الجازولين؟<\/td><td>وقود للسيارات (البنزين).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العلاقة بين طول السلسلة واللزوجة؟<\/td><td>كلما طالت السلسلة زادت اللزوجة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رتب تصاعديًا حسب درجة الغليان: الأسفلت، غاز التكرير، الديزل، الجازولين.<\/td><td>غاز التكرير ثم الجازولين ثم الديزل ثم الأسفلت.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما استخدام مشتق الجازولين؟\nالإجابة النموذجية: وقود للسيارات (البنزين).\n\n2) [المستوى المتوقع] ما العلاقة بين طول السلسلة واللزوجة؟\nالإجابة النموذجية: كلما طالت السلسلة زادت اللزوجة.\n\n3) [المستوى المتقدم] رتب تصاعديًا حسب درجة الغليان: الأسفلت، غاز التكرير، الديزل، الجازولين.\nالإجابة النموذجية: غاز التكرير ثم الجازولين ثم الديزل ثم الأسفلت."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُستخدم مشتق النفثا ......... لصناعة المواد الكيميائية.<\/td><td>مادةً أولية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أيهما أكثر تطايرًا: الجازولين أم الديزل؟<\/td><td>الجازولين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يُستخدم الأسفلت وقودًا للسيارات؟<\/td><td>لأن لزوجته عالية جدًا ودرجة غليانه مرتفعة فلا يتبخر ولا يشتعل بسهولة في المحرك.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يُستخدم مشتق النفثا ......... لصناعة المواد الكيميائية.\nالإجابة النموذجية: مادةً أولية.\n\n2) [المستوى المتوقع] أيهما أكثر تطايرًا: الجازولين أم الديزل؟\nالإجابة النموذجية: الجازولين.\n\n3) [المستوى المتقدم] لماذا لا يُستخدم الأسفلت وقودًا للسيارات؟\nالإجابة النموذجية: لأن لزوجته عالية جدًا ودرجة غليانه مرتفعة فلا يتبخر ولا يشتعل بسهولة في المحرك."},{"h":"<p>حل تمرين 4-4 العمليات الأساسية في الصناعة البتروكيميائية في كتاب النشاط ص 63–66، والإجابة عن السؤال 23-4.<\/p>","t":"حل تمرين 4-4 العمليات الأساسية في الصناعة البتروكيميائية في كتاب النشاط ص 63–66، والإجابة عن السؤال 23-4."}]},{"n":3,"focus":"التكسير الحراري ومراجعة الوحدة الرابعة","info":"<div><b>الدرس:<\/b> 3-4 البترول (النفط الخام) وأنواع أخرى من الوقود الأحفوري<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 90–100 | كتاب النشاط: تمرين 4-4 ص 63–66، ورقة العمل 3-4 ص 71<\/div><div><b>دليل المعلم:<\/b> ص 81<\/div><div><b>محور الحصة:<\/b> التكسير الحراري ومراجعة الوحدة الرابعة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر.<\/li><li>يكتب معادلة تكسير موزونة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات.<\/div>","t":"1. يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر.\n2. يكتب معادلة تكسير موزونة.\nمخرج تعليمي آخر: يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلة تكسير موزونة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر. ← فهم\n• يكتب معادلة تكسير موزونة. ← تطبيق\n• يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الوسائل المتعددة (سمعية - بصرية)"},{"h":"<div class=\"pills\"><span>التكسير الحراري<\/span><span>العامل الحفاز<\/span><span>الألكانات الكبيرة<\/span><span>الألكينات<\/span><span>العرض والطلب<\/span><\/div>","t":"التكسير الحراري، العامل الحفاز، الألكانات الكبيرة، الألكينات، العرض والطلب"},{"h":"<p>يعرض مخطط العرض والطلب على مشتقات النفط ويسأل: كيف نعالج فائض المشتقات الثقيلة ونقص الجازولين؟<\/p>","t":"يعرض مخطط العرض والطلب على مشتقات النفط ويسأل: كيف نعالج فائض المشتقات الثقيلة ونقص الجازولين؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المخطط على السبورة الذكية.<\/td><td>يقترحون حلولًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">النشاط 3-4 التكسير الحراري للهيدروكربونات (عرض المعلم أو مقطع – كتاب الطالب)<\/td><td>يسخن البارافين السائل فوق عامل حفاز ويجمع الغاز الناتج ويختبره بماء البروم.<\/td><td>يلاحظون أن الغاز الناتج يزيل لون ماء البروم فيستنتجون تكوّن ألكين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلة<\/td><td>يكتب: <bdi>C₁₀H₂₂ → C₈H₁₈ + C₂H₄<\/bdi> ويتحقق من تساوي الذرات.<\/td><td>يكتبون معادلة تكسير <bdi>C₆H₁₄ → C₄H₁₀ + C₂H₄<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الرابعة ومسابقة المجموعات (كتاب الطالب ص 99–100)<\/td><td>يوجه إلى حل أسئلة مختارة ثم يدير جولة من المسابقة.<\/td><td>يحلون ويتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المخطط على السبورة الذكية.\nدور الطالب: يقترحون حلولًا.\n\n(12 دقيقة) النشاط 3-4 التكسير الحراري للهيدروكربونات (عرض المعلم أو مقطع – كتاب الطالب)\nدور المعلم: يسخن البارافين السائل فوق عامل حفاز ويجمع الغاز الناتج ويختبره بماء البروم.\nدور الطالب: يلاحظون أن الغاز الناتج يزيل لون ماء البروم فيستنتجون تكوّن ألكين.\n\n(8 دقائق) المعادلة\nدور المعلم: يكتب: C₁₀H₂₂ → C₈H₁₈ + C₂H₄ ويتحقق من تساوي الذرات.\nدور الطالب: يكتبون معادلة تكسير C₆H₁₄ → C₄H₁₀ + C₂H₄.\n\n(10 دقائق) أسئلة نهاية الوحدة الرابعة ومسابقة المجموعات (كتاب الطالب ص 99–100)\nدور المعلم: يوجه إلى حل أسئلة مختارة ثم يدير جولة من المسابقة.\nدور الطالب: يحلون ويتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نواتج تكسير الألكانات الكبيرة؟<\/td><td>ألكانات أصغر وألكينات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل المعادلة: <bdi>C₁₀H₂₂ → C₈H₁₈<\/bdi> + .........<\/td><td>C₂H₄.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُجرى التكسير في مصافي النفط؟<\/td><td>لأن الطلب على المشتقات الخفيفة كالجازولين أكبر من المنتج منها، فتُحول المشتقات الثقيلة الفائضة إلى خفيفة، وتُنتج الألكينات لصناعة البلاستيك.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما نواتج تكسير الألكانات الكبيرة؟\nالإجابة النموذجية: ألكانات أصغر وألكينات.\n\n2) [المستوى المتوقع] أكمل المعادلة: C₁₀H₂₂ → C₈H₁₈ + .........\nالإجابة النموذجية: C₂H₄.\n\n3) [المستوى المتقدم] لماذا يُجرى التكسير في مصافي النفط؟\nالإجابة النموذجية: لأن الطلب على المشتقات الخفيفة كالجازولين أكبر من المنتج منها، فتُحول المشتقات الثقيلة الفائضة إلى خفيفة، وتُنتج الألكينات لصناعة البلاستيك."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يحتاج التكسير الحراري إلى حرارة عالية وعامل حفاز.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف تثبت أن غاز ناتج التكسير يحتوي على ألكين؟<\/td><td>يزيل لون ماء البروم البرتقالي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أكمل وزن معادلة التكسير: <bdi>C₁₂H₂₆ → C₈H₁₈<\/bdi> + .........<\/td><td>2C₂H₄.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يحتاج التكسير الحراري إلى حرارة عالية وعامل حفاز.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] كيف تثبت أن غاز ناتج التكسير يحتوي على ألكين؟\nالإجابة النموذجية: يزيل لون ماء البروم البرتقالي.\n\n3) [المستوى المتقدم] أكمل وزن معادلة التكسير: C₁₂H₂₆ → C₈H₁₈ + .........\nالإجابة النموذجية: 2C₂H₄."},{"h":"<p>حل ورقة العمل 3-4 التقطير التجزيئي للبترول والتكسير الحراري في كتاب النشاط ص 71، والإجابة عن السؤال 24-4 والسؤال 4 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي.<\/p>","t":"حل ورقة العمل 3-4 التقطير التجزيئي للبترول والتكسير الحراري في كتاب النشاط ص 71، والإجابة عن السؤال 24-4 والسؤال 4 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-4 البترول (النفط الخام) وأنواع أخرى من الوقود الأحفوري<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 90–100 | كتاب النشاط: تمرين 4-4 ص 63–66، ورقة العمل 3-4 ص 71<\/div><div><b>دليل المعلم:<\/b> ص 81<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><ol class=\"ol\"><li>يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق.<\/li><li>يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها.<\/div><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><ol class=\"ol\"><li>يصف كيف تتغير خصائص الجزيئات بتغير المشتق: طول السلسلة ودرجة الغليان والتطاير واللزوجة.<\/li><li>يسمي استخدامات المشتقات: غاز التكرير، والجازولين، والنفثا، والديزل، والأسفلت.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط كل استخدام بخاصية المشتق المناسبة.<\/div><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><ol class=\"ol\"><li>يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر.<\/li><li>يكتب معادلة تكسير موزونة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات.<\/div>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n1. يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق.\n2. يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي.\nمخرج تعليمي آخر: يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها.\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n1. يصف كيف تتغير خصائص الجزيئات بتغير المشتق: طول السلسلة ودرجة الغليان والتطاير واللزوجة.\n2. يسمي استخدامات المشتقات: غاز التكرير، والجازولين، والنفثا، والديزل، والأسفلت.\nمخرج تعليمي آخر: يربط كل استخدام بخاصية المشتق المناسبة.\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n1. يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر.\n2. يكتب معادلة تكسير موزونة.\nمخرج تعليمي آخر: يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات."},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف كيف تتغير خصائص الجزيئات بتغير المشتق: طول السلسلة ودرجة الغليان والتطاير واللزوجة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يسمي استخدامات المشتقات: غاز التكرير، والجازولين، والنفثا، والديزل، والأسفلت.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يربط كل استخدام بخاصية المشتق المناسبة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلة تكسير موزونة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n• يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق. ← تذكر\n• يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي. ← فهم\n• يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها. ← تحليل\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n• يصف كيف تتغير خصائص الجزيئات بتغير المشتق: طول السلسلة ودرجة الغليان والتطاير واللزوجة. ← تحليل\n• يسمي استخدامات المشتقات: غاز التكرير، والجازولين، والنفثا، والديزل، والأسفلت. ← تذكر\n• يربط كل استخدام بخاصية المشتق المناسبة. ← تطبيق\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n• يصف التكسير الحراري لجزيئات ألكانات كبيرة لتكوين ألكينات وألكانات أصغر. ← فهم\n• يكتب معادلة تكسير موزونة. ← تطبيق\n• يبرر الحاجة الاقتصادية إلى التكسير في ضوء العرض والطلب على المشتقات. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><div class=\"pills\"><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><span>التعلم الذاتي<\/span><\/div><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n• التعلم التعاوني\n• التعلم المبني على اللعب\n• التعلم الذاتي\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n• التعلم بالاكتشاف\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>صورة توضيحية<\/span><\/div><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: بطاقات المشتقات واستخداماتها<\/span><\/div><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• صورة توضيحية\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بطاقات المشتقات واستخداماتها\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الوسائل المتعددة (سمعية - بصرية)"},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><div class=\"pills\"><span>الوقود الأحفوري<\/span><span>النفط الخام<\/span><span>التقطير التجزيئي<\/span><span>برج التجزئة<\/span><span>المشتق<\/span><span>درجة الغليان<\/span><\/div><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><div class=\"pills\"><span>غاز التكرير<\/span><span>الجازولين<\/span><span>النفثا<\/span><span>الديزل<\/span><span>الأسفلت<\/span><span>التطاير<\/span><span>اللزوجة<\/span><\/div><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><div class=\"pills\"><span>التكسير الحراري<\/span><span>العامل الحفاز<\/span><span>الألكانات الكبيرة<\/span><span>الألكينات<\/span><span>العرض والطلب<\/span><\/div>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\nالوقود الأحفوري، النفط الخام، التقطير التجزيئي، برج التجزئة، المشتق، درجة الغليان\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\nغاز التكرير، الجازولين، النفثا، الديزل، الأسفلت، التطاير، اللزوجة\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\nالتكسير الحراري، العامل الحفاز، الألكانات الكبيرة، الألكينات، العرض والطلب"},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><p>يعرض صورة مصفاة نفط في سلطنة عُمان ويسأل: النفط الخام سائل أسود كثيف، فكيف نحصل منه على غاز الطبخ والبنزين؟<\/p><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><p>لعبة «من أنا؟»: «أُستخدم في رصف الطرق ولزوجتي عالية جدًا» – من أنا؟<\/p><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><p>يعرض مخطط العرض والطلب على مشتقات النفط ويسأل: كيف نعالج فائض المشتقات الثقيلة ونقص الجازولين؟<\/p>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\nيعرض صورة مصفاة نفط في سلطنة عُمان ويسأل: النفط الخام سائل أسود كثيف، فكيف نحصل منه على غاز الطبخ والبنزين؟\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\nلعبة «من أنا؟»: «أُستخدم في رصف الطرق ولزوجتي عالية جدًا» – من أنا؟\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\nيعرض مخطط العرض والطلب على مشتقات النفط ويسأل: كيف نعالج فائض المشتقات الثقيلة ونقص الجازولين؟"},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الوقود الأحفوري (كتاب الطالب ص 90–92)<\/td><td>يعرض تكوّن النفط والغاز والفحم من بقايا كائنات قديمة.<\/td><td>يكملون جدولًا للأنواع الثلاثة.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">برج التجزئة – النشاط 2-4 تقطير تجزيئي للبترول (عرض أو مقطع)<\/td><td>يعرض مخطط البرج ويوضح أن البخار يصعد ويبرد فتتكثف المشتقات عند مستويات مختلفة.<\/td><td>يرتبون المشتقات على المخطط من الأعلى إلى الأسفل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">النفط في سلطنة عُمان (كتاب الطالب ص 95)<\/td><td>يناقش أهمية النفط للاقتصاد العماني.<\/td><td>يذكرون حقائق من الكتاب.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح بطاقات «من أنا؟».<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تدرج الخصائص (كتاب الطالب ص 93–96)<\/td><td>يعرض على السبورة الذكية جدولًا: كلما طالت السلسلة ارتفعت درجة الغليان وزادت اللزوجة وقل التطاير.<\/td><td>يرسمون أسهم التدرج على مخطط البرج.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المشتقات واستخداماتها<\/td><td>يوزع بطاقات المشتقات والاستخدامات.<\/td><td>يطابقون: غاز التكرير للطبخ والتدفئة، والجازولين وقودًا للسيارات، والنفثا مادة أولية للكيماويات، والديزل لمحركات الديزل، والأسفلت للطرق.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم وتمرين 4-4 (البدء)<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المخطط على السبورة الذكية.<\/td><td>يقترحون حلولًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">النشاط 3-4 التكسير الحراري للهيدروكربونات (عرض المعلم أو مقطع – كتاب الطالب)<\/td><td>يسخن البارافين السائل فوق عامل حفاز ويجمع الغاز الناتج ويختبره بماء البروم.<\/td><td>يلاحظون أن الغاز الناتج يزيل لون ماء البروم فيستنتجون تكوّن ألكين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلة<\/td><td>يكتب: <bdi>C₁₀H₂₂ → C₈H₁₈ + C₂H₄<\/bdi> ويتحقق من تساوي الذرات.<\/td><td>يكتبون معادلة تكسير <bdi>C₆H₁₄ → C₄H₁₀ + C₂H₄<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الرابعة ومسابقة المجموعات (كتاب الطالب ص 99–100)<\/td><td>يوجه إلى حل أسئلة مختارة ثم يدير جولة من المسابقة.<\/td><td>يحلون ويتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الوقود الأحفوري (كتاب الطالب ص 90–92)\nدور المعلم: يعرض تكوّن النفط والغاز والفحم من بقايا كائنات قديمة.\nدور الطالب: يكملون جدولًا للأنواع الثلاثة.\n\n(15 دقيقة) برج التجزئة – النشاط 2-4 تقطير تجزيئي للبترول (عرض أو مقطع)\nدور المعلم: يعرض مخطط البرج ويوضح أن البخار يصعد ويبرد فتتكثف المشتقات عند مستويات مختلفة.\nدور الطالب: يرتبون المشتقات على المخطط من الأعلى إلى الأسفل.\n\n(5 دقائق) النفط في سلطنة عُمان (كتاب الطالب ص 95)\nدور المعلم: يناقش أهمية النفط للاقتصاد العماني.\nدور الطالب: يذكرون حقائق من الكتاب.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n(5 دقائق) التهيئة\nدور المعلم: يطرح بطاقات «من أنا؟».\nدور الطالب: يجيبون.\n\n(12 دقيقة) تدرج الخصائص (كتاب الطالب ص 93–96)\nدور المعلم: يعرض على السبورة الذكية جدولًا: كلما طالت السلسلة ارتفعت درجة الغليان وزادت اللزوجة وقل التطاير.\nدور الطالب: يرسمون أسهم التدرج على مخطط البرج.\n\n(10 دقائق) المشتقات واستخداماتها\nدور المعلم: يوزع بطاقات المشتقات والاستخدامات.\nدور الطالب: يطابقون: غاز التكرير للطبخ والتدفئة، والجازولين وقودًا للسيارات، والنفثا مادة أولية للكيماويات، والديزل لمحركات الديزل، والأسفلت للطرق.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم وتمرين 4-4 (البدء)\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n(5 دقائق) التهيئة\nدور المعلم: يعرض المخطط على السبورة الذكية.\nدور الطالب: يقترحون حلولًا.\n\n(12 دقيقة) النشاط 3-4 التكسير الحراري للهيدروكربونات (عرض المعلم أو مقطع – كتاب الطالب)\nدور المعلم: يسخن البارافين السائل فوق عامل حفاز ويجمع الغاز الناتج ويختبره بماء البروم.\nدور الطالب: يلاحظون أن الغاز الناتج يزيل لون ماء البروم فيستنتجون تكوّن ألكين.\n\n(8 دقائق) المعادلة\nدور المعلم: يكتب: C₁₀H₂₂ → C₈H₁₈ + C₂H₄ ويتحقق من تساوي الذرات.\nدور الطالب: يكتبون معادلة تكسير C₆H₁₄ → C₄H₁₀ + C₂H₄.\n\n(10 دقائق) أسئلة نهاية الوحدة الرابعة ومسابقة المجموعات (كتاب الطالب ص 99–100)\nدور المعلم: يوجه إلى حل أسئلة مختارة ثم يدير جولة من المسابقة.\nدور الطالب: يحلون ويتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة أنواع من الوقود الأحفوري.<\/td><td>الفحم، والغاز الطبيعي، والنفط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>على أي خاصية يعتمد فصل مشتقات النفط في التقطير التجزيئي؟<\/td><td>اختلاف درجات غليانها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تخرج المشتقات ذات الجزيئات الصغيرة من أعلى البرج؟<\/td><td>لأن درجات غليانها منخفضة فتبقى بخارًا حتى تصل إلى أعلى البرج الأبرد.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما استخدام مشتق الجازولين؟<\/td><td>وقود للسيارات (البنزين).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العلاقة بين طول السلسلة واللزوجة؟<\/td><td>كلما طالت السلسلة زادت اللزوجة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رتب تصاعديًا حسب درجة الغليان: الأسفلت، غاز التكرير، الديزل، الجازولين.<\/td><td>غاز التكرير ثم الجازولين ثم الديزل ثم الأسفلت.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نواتج تكسير الألكانات الكبيرة؟<\/td><td>ألكانات أصغر وألكينات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل المعادلة: <bdi>C₁₀H₂₂ → C₈H₁₈<\/bdi> + .........<\/td><td>C₂H₄.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُجرى التكسير في مصافي النفط؟<\/td><td>لأن الطلب على المشتقات الخفيفة كالجازولين أكبر من المنتج منها، فتُحول المشتقات الثقيلة الفائضة إلى خفيفة، وتُنتج الألكينات لصناعة البلاستيك.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n1) [مستوى الدعم] اذكر ثلاثة أنواع من الوقود الأحفوري.\nالإجابة النموذجية: الفحم، والغاز الطبيعي، والنفط.\n\n2) [المستوى المتوقع] على أي خاصية يعتمد فصل مشتقات النفط في التقطير التجزيئي؟\nالإجابة النموذجية: اختلاف درجات غليانها.\n\n3) [المستوى المتقدم] لماذا تخرج المشتقات ذات الجزيئات الصغيرة من أعلى البرج؟\nالإجابة النموذجية: لأن درجات غليانها منخفضة فتبقى بخارًا حتى تصل إلى أعلى البرج الأبرد.\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n1) [مستوى الدعم] ما استخدام مشتق الجازولين؟\nالإجابة النموذجية: وقود للسيارات (البنزين).\n\n2) [المستوى المتوقع] ما العلاقة بين طول السلسلة واللزوجة؟\nالإجابة النموذجية: كلما طالت السلسلة زادت اللزوجة.\n\n3) [المستوى المتقدم] رتب تصاعديًا حسب درجة الغليان: الأسفلت، غاز التكرير، الديزل، الجازولين.\nالإجابة النموذجية: غاز التكرير ثم الجازولين ثم الديزل ثم الأسفلت.\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n1) [مستوى الدعم] ما نواتج تكسير الألكانات الكبيرة؟\nالإجابة النموذجية: ألكانات أصغر وألكينات.\n\n2) [المستوى المتوقع] أكمل المعادلة: C₁₀H₂₂ → C₈H₁₈ + .........\nالإجابة النموذجية: C₂H₄.\n\n3) [المستوى المتقدم] لماذا يُجرى التكسير في مصافي النفط؟\nالإجابة النموذجية: لأن الطلب على المشتقات الخفيفة كالجازولين أكبر من المنتج منها، فتُحول المشتقات الثقيلة الفائضة إلى خفيفة، وتُنتج الألكينات لصناعة البلاستيك."},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُنتج احتراق الوقود الأحفوري غاز .........<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يكون أسفل برج التجزئة أسخن من أعلاه؟<\/td><td>لأن النفط يُسخن ويدخل من الأسفل، ويبرد البخار تدريجيًا كلما صعد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا تُفصل مشتقات النفط بالتقطير البسيط؟<\/td><td>لأنها مزيج من مواد كثيرة متقاربة في درجات الغليان، فنحتاج إلى برج يفصلها إلى مجموعات حسب مدى الغليان.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُستخدم مشتق النفثا ......... لصناعة المواد الكيميائية.<\/td><td>مادةً أولية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أيهما أكثر تطايرًا: الجازولين أم الديزل؟<\/td><td>الجازولين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يُستخدم الأسفلت وقودًا للسيارات؟<\/td><td>لأن لزوجته عالية جدًا ودرجة غليانه مرتفعة فلا يتبخر ولا يشتعل بسهولة في المحرك.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يحتاج التكسير الحراري إلى حرارة عالية وعامل حفاز.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف تثبت أن غاز ناتج التكسير يحتوي على ألكين؟<\/td><td>يزيل لون ماء البروم البرتقالي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أكمل وزن معادلة التكسير: <bdi>C₁₂H₂₆ → C₈H₁₈<\/bdi> + .........<\/td><td>2C₂H₄.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\n1) [مستوى الدعم] أكمل: يُنتج احتراق الوقود الأحفوري غاز .........\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n2) [المستوى المتوقع] لماذا يكون أسفل برج التجزئة أسخن من أعلاه؟\nالإجابة النموذجية: لأن النفط يُسخن ويدخل من الأسفل، ويبرد البخار تدريجيًا كلما صعد.\n\n3) [المستوى المتقدم] لماذا لا تُفصل مشتقات النفط بالتقطير البسيط؟\nالإجابة النموذجية: لأنها مزيج من مواد كثيرة متقاربة في درجات الغليان، فنحتاج إلى برج يفصلها إلى مجموعات حسب مدى الغليان.\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\n1) [مستوى الدعم] أكمل: يُستخدم مشتق النفثا ......... لصناعة المواد الكيميائية.\nالإجابة النموذجية: مادةً أولية.\n\n2) [المستوى المتوقع] أيهما أكثر تطايرًا: الجازولين أم الديزل؟\nالإجابة النموذجية: الجازولين.\n\n3) [المستوى المتقدم] لماذا لا يُستخدم الأسفلت وقودًا للسيارات؟\nالإجابة النموذجية: لأن لزوجته عالية جدًا ودرجة غليانه مرتفعة فلا يتبخر ولا يشتعل بسهولة في المحرك.\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\n1) [مستوى الدعم] صواب أم خطأ: يحتاج التكسير الحراري إلى حرارة عالية وعامل حفاز.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] كيف تثبت أن غاز ناتج التكسير يحتوي على ألكين؟\nالإجابة النموذجية: يزيل لون ماء البروم البرتقالي.\n\n3) [المستوى المتقدم] أكمل وزن معادلة التكسير: C₁₂H₂₆ → C₈H₁₈ + .........\nالإجابة النموذجية: 2C₂H₄."},{"h":"<div class=\"psub\">الحصة 1: الوقود الأحفوري والتقطير التجزيئي<\/div><p>مراجعة كتاب الطالب ص 90–95 والإجابة عن السؤالين 21-4 و22-4، والبحث عن حقول النفط والغاز في سلطنة عُمان.<\/p><div class=\"psub\">الحصة 2: خصائص مشتقات النفط واستخداماتها<\/div><p>حل تمرين 4-4 العمليات الأساسية في الصناعة البتروكيميائية في كتاب النشاط ص 63–66، والإجابة عن السؤال 23-4.<\/p><div class=\"psub\">الحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة<\/div><p>حل ورقة العمل 3-4 التقطير التجزيئي للبترول والتكسير الحراري في كتاب النشاط ص 71، والإجابة عن السؤال 24-4 والسؤال 4 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي.<\/p>","t":"الحصة 1: الوقود الأحفوري والتقطير التجزيئي\nمراجعة كتاب الطالب ص 90–95 والإجابة عن السؤالين 21-4 و22-4، والبحث عن حقول النفط والغاز في سلطنة عُمان.\n\nالحصة 2: خصائص مشتقات النفط واستخداماتها\nحل تمرين 4-4 العمليات الأساسية في الصناعة البتروكيميائية في كتاب النشاط ص 63–66، والإجابة عن السؤال 23-4.\n\nالحصة 3: التكسير الحراري ومراجعة الوحدة الرابعة\nحل ورقة العمل 3-4 التقطير التجزيئي للبترول والتكسير الحراري في كتاب النشاط ص 71، والإجابة عن السؤال 24-4 والسؤال 4 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي."}]}}]};</script>
<script>
(function(){
'use strict';
var mode='sep', li=0, pi=0;
function $(s){return document.querySelector(s)}
function nP(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function copy(text,btn,card){
  function ok(){btn.textContent='تم النسخ ✓';btn.classList.add('done');clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent='نسخ';btn.classList.remove('done')},2000)}
  function manual(){var m=card.querySelector('.man'),ta=m.querySelector('textarea');ta.value=text;m.hidden=false;ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}}
  function legacy(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}var s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(s)ok();else manual()}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,legacy)}else{legacy()}
}
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.classList.toggle('on',b.dataset.m===mode)});
  $('#state').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
  var L=D.lessons[li], tabs=$('#tabs'); tabs.innerHTML=''; tabs.hidden=(mode!=='sep');
  if(mode==='sep'){L.periods.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.className='tab'+(i===pi?' on':'');b.innerHTML='<b>الحصة '+p.n+' من '+L.periods.length+'</b><small>'+esc(p.focus)+'</small>';b.onclick=function(){pi=i;render()};tabs.appendChild(b)})}
  var src=mode==='sep'?L.periods[pi]:L.comb;
  $('#info').innerHTML=src.info;
  var box=$('#fields'); box.innerHTML='';
  src.fields.forEach(function(f,k){
    var c=document.createElement('article'); c.className='card';
    c.innerHTML='<div class="hd"><h3><span class="no">'+(k+1)+'</span>'+D.ft[k]+'</h3><button class="copy" type="button">نسخ</button></div><div class="bd">'+f.h+'</div><div class="man" hidden><p>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، انسخه يدويًا.</p><textarea readonly></textarea></div>';
    c.querySelector('.copy').onclick=function(e){copy(f.t,e.currentTarget,c)};
    box.appendChild(c);
  });
}
function init(){
  var sel=$('#lesson'), lastU=null, og=null;
  D.lessons.forEach(function(L,i){if(L.unit!==lastU){og=document.createElement('optgroup');og.label=L.unit;sel.appendChild(og);lastU=L.unit}var o=document.createElement('option');o.value=i;o.textContent=L.label+' ('+nP(L.periods.length)+')';og.appendChild(o)});
  sel.onchange=function(){li=+sel.value;pi=0;render()};
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){mode=b.dataset.m;render()}});
  render();
}
init();
})();
</script></body></html>
