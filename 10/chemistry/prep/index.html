lass=\"st\">السؤالان 9-2 و10-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) أجزاء الفرن\nدور المعلم: يعرض مخطط الفرن العالي ويحدد مداخل المواد الخام ومخارج الحديد والخبث والغازات.\nدور الطالب: يرسمون المخطط ويسمون أجزاءه.\n\n(15 دقيقة) التفاعلات خطوة بخطوة (كتاب الطالب ص 39–40)\nدور المعلم: يكتب: C + O₂ → CO₂ ثم C + CO₂ → 2CO ثم Fe₂O₃ + 3CO → 2Fe + 3CO₂.\nدور الطالب: يضعون المعادلات في مواضعها على المخطط ويحددون العامل المختزل.\n\n(5 دقائق) السؤالان 9-2 و10-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المواد الخام الأربع في الفرن العالي؟<\/td><td>الهيماتيت، وفحم الكوك، والحجر الجيري، والهواء الساخن.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العامل المختزل الرئيس لأكسيد الحديد III في الفرن؟<\/td><td>أول أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اكتب المعادلات الثلاث لإنتاج الحديد بالترتيب.<\/td><td><bdi>C + O₂ → CO₂<\/bdi>؛ <bdi>C + CO₂ → 2CO<\/bdi>؛ <bdi>Fe₂O₃ + 3CO → 2Fe + 3CO₂<\/bdi><\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المواد الخام الأربع في الفرن العالي؟\nالإجابة النموذجية: الهيماتيت، وفحم الكوك، والحجر الجيري، والهواء الساخن.\n\n2) [المستوى المتوقع] ما العامل المختزل الرئيس لأكسيد الحديد III في الفرن؟\nالإجابة النموذجية: أول أكسيد الكربون.\n\n3) [المستوى المتقدم] اكتب المعادلات الثلاث لإنتاج الحديد بالترتيب.\nالإجابة النموذجية: C + O₂ → CO₂؛ C + CO₂ → 2CO؛ Fe₂O₃ + 3CO → 2Fe + 3CO₂"},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>Fe₂O₃ + 3CO<\/bdi> → ......... + .........<\/td><td><bdi>2Fe + 3CO₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُضخ الهواء الساخن في أسفل الفرن؟<\/td><td>ليحترق فحم الكوك ويطلق حرارة عالية تلزم للتفاعلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التفاعل <bdi>C + O₂ → CO₂<\/bdi> مهمًا مع أنه لا ينتج الحديد مباشرة؟<\/td><td>لأنه طارد للحرارة فيرفع درجة الحرارة، وينتج CO₂ الذي يتحول إلى CO المختزل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: Fe₂O₃ + 3CO → ......... + .........\nالإجابة النموذجية: 2Fe + 3CO₂\n\n2) [المستوى المتوقع] لماذا يُضخ الهواء الساخن في أسفل الفرن؟\nالإجابة النموذجية: ليحترق فحم الكوك ويطلق حرارة عالية تلزم للتفاعلات.\n\n3) [المستوى المتقدم] لماذا يُعد التفاعل C + O₂ → CO₂ مهمًا مع أنه لا ينتج الحديد مباشرة؟\nالإجابة النموذجية: لأنه طارد للحرارة فيرفع درجة الحرارة، وينتج CO₂ الذي يتحول إلى CO المختزل."},{"h":"<p>مراجعة كتاب الطالب ص 39–40 والإجابة عن السؤالين 9-2 و10-2، والبدء في ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33.<\/p>","t":"مراجعة كتاب الطالب ص 39–40 والإجابة عن السؤالين 9-2 و10-2، والبدء في ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33."}]},{"n":2,"focus":"إزالة الشوائب الحمضية وتكوين الخبث","info":"<div><b>الدرس:<\/b> 2-2 إنتاج الحديد والفولاذ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–41 | كتاب النشاط: ورقة العمل 1-2 ص 32–33<\/div><div><b>دليل المعلم:<\/b> ص 40–41<\/div><div><b>محور الحصة:<\/b> إزالة الشوائب الحمضية وتكوين الخبث<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث.<\/li><li>يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن.<\/div>","t":"1. يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث.\n2. يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم.\nمخرج تعليمي آخر: يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث. ← فهم\n• يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم. ← تطبيق\n• يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الأقلام"},{"h":"<div class=\"pills\"><span>الحجر الجيري<\/span><span>أكسيد الكالسيوم<\/span><span>ثاني أكسيد السيليكون<\/span><span>الخبث (سيليكات الكالسيوم)<\/span><span>الشوائب الحمضية<\/span><\/div>","t":"الحجر الجيري، أكسيد الكالسيوم، ثاني أكسيد السيليكون، الخبث (سيليكات الكالسيوم)، الشوائب الحمضية"},{"h":"<p>سؤال: الهيماتيت يحتوي على رمل. ماذا سيحدث لجودة الحديد لو لم يُزل الرمل؟<\/p>","t":"سؤال: الهيماتيت يحتوي على رمل. ماذا سيحدث لجودة الحديد لو لم يُزل الرمل؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">دور الحجر الجيري (كتاب الطالب ص 40)<\/td><td>يكتب على السبورة الذكية: <bdi>CaCO₃ → CaO + CO₂<\/bdi> ثم <bdi>CaO + SiO₂ → CaSiO₃<\/bdi>، ويوضح أن أكسيد الكالسيوم قاعدي يتفاعل مع الشوائب الحمضية.<\/td><td>يدونون المعادلتين ويحددون المادة الحمضية والمادة القاعدية.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">الخبث والحديد<\/td><td>يوضح أن الخبث أقل كثافة فيطفو فوق الحديد المنصهر ويُسحب كل منهما من فتحة مستقلة.<\/td><td>يفسرون الفصل بالكثافة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 1-2 الفرن العالي (كتاب النشاط ص 32–33)<\/td><td>يتابع.<\/td><td>يكملون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) دور الحجر الجيري (كتاب الطالب ص 40)\nدور المعلم: يكتب على السبورة الذكية: CaCO₃ → CaO + CO₂ ثم CaO + SiO₂ → CaSiO₃، ويوضح أن أكسيد الكالسيوم قاعدي يتفاعل مع الشوائب الحمضية.\nدور الطالب: يدونون المعادلتين ويحددون المادة الحمضية والمادة القاعدية.\n\n(8 دقائق) الخبث والحديد\nدور المعلم: يوضح أن الخبث أقل كثافة فيطفو فوق الحديد المنصهر ويُسحب كل منهما من فتحة مستقلة.\nدور الطالب: يفسرون الفصل بالكثافة.\n\n(10 دقائق) ورقة العمل 1-2 الفرن العالي (كتاب النشاط ص 32–33)\nدور المعلم: يتابع.\nدور الطالب: يكملون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الغرض من إضافة الحجر الجيري إلى الفرن العالي؟<\/td><td>إزالة الشوائب الحمضية مثل الرمل بتحويلها إلى خبث.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة تكوّن الخبث.<\/td><td><bdi>CaO + SiO₂ → CaSiO₃<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتجمع الخبث فوق الحديد المنصهر؟<\/td><td>لأن كثافته أقل من كثافة الحديد المنصهر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الغرض من إضافة الحجر الجيري إلى الفرن العالي؟\nالإجابة النموذجية: إزالة الشوائب الحمضية مثل الرمل بتحويلها إلى خبث.\n\n2) [المستوى المتوقع] اكتب معادلة تكوّن الخبث.\nالإجابة النموذجية: CaO + SiO₂ → CaSiO₃\n\n3) [المستوى المتقدم] لماذا يتجمع الخبث فوق الحديد المنصهر؟\nالإجابة النموذجية: لأن كثافته أقل من كثافة الحديد المنصهر."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يتفكك الحجر الجيري بالحرارة إلى ......... و.........<\/td><td>أكسيد الكالسيوم – ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صنّف: ثاني أكسيد السيليكون وأكسيد الكالسيوم إلى حمضي وقاعدي.<\/td><td>ثاني أكسيد السيليكون حمضي، وأكسيد الكالسيوم قاعدي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح استخدامًا للخبث بعد سحبه من الفرن.<\/td><td>رصف الطرق أو صناعة الإسمنت.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يتفكك الحجر الجيري بالحرارة إلى ......... و.........\nالإجابة النموذجية: أكسيد الكالسيوم – ثاني أكسيد الكربون.\n\n2) [المستوى المتوقع] صنّف: ثاني أكسيد السيليكون وأكسيد الكالسيوم إلى حمضي وقاعدي.\nالإجابة النموذجية: ثاني أكسيد السيليكون حمضي، وأكسيد الكالسيوم قاعدي.\n\n3) [المستوى المتقدم] اقترح استخدامًا للخبث بعد سحبه من الفرن.\nالإجابة النموذجية: رصف الطرق أو صناعة الإسمنت."},{"h":"<p>إكمال ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33، والإجابة عن السؤالين 11-2 و12-2.<\/p>","t":"إكمال ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33، والإجابة عن السؤالين 11-2 و12-2."}]},{"n":3,"focus":"تحويل الحديد إلى فولاذ وأنواع الفولاذ","info":"<div><b>الدرس:<\/b> 2-2 إنتاج الحديد والفولاذ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–41 | كتاب النشاط: ورقة العمل 1-2 ص 32–33<\/div><div><b>دليل المعلم:<\/b> ص 40–41<\/div><div><b>محور الحصة:<\/b> تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ.<\/li><li>يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يختار نوع الفولاذ المناسب لاستخدام معين ويبرر.<\/div>","t":"1. يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ.\n2. يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة).\nمخرج تعليمي آخر: يختار نوع الفولاذ المناسب لاستخدام معين ويبرر."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يختار نوع الفولاذ المناسب لاستخدام معين ويبرر.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ. ← فهم\n• يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة). ← تذكر\n• يختار نوع الفولاذ المناسب لاستخدام معين ويبرر. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم التشاركي<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم التشاركي\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>حديد الزهر<\/span><span>الفولاذ العادي<\/span><span>الفولاذ المقاوم للصدأ<\/span><span>الكروم والنيكل<\/span><span>نسبة الكربون<\/span><\/div>","t":"حديد الزهر، الفولاذ العادي، الفولاذ المقاوم للصدأ، الكروم والنيكل، نسبة الكربون"},{"h":"<p>يعرض ملعقة من الفولاذ المقاوم للصدأ ومسمارًا صدئًا ويسأل: كلاهما حديد في أساسه، فلماذا لم تصدأ الملعقة؟<\/p>","t":"يعرض ملعقة من الفولاذ المقاوم للصدأ ومسمارًا صدئًا ويسأل: كلاهما حديد في أساسه، فلماذا لم تصدأ الملعقة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العينتين.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">من حديد الزهر إلى الفولاذ (كتاب الطالب ص 41)<\/td><td>يوضح أن حديد الفرن هش لكثرة الكربون، فيُنفخ فيه الأكسجين لإزالة الكربون ثم تُضاف عناصر بنسب محسوبة.<\/td><td>يستخرجون الفرق بين حديد الزهر والفولاذ.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">أنواع الفولاذ واستخداماتها<\/td><td>يعرض بطاقات استخدامات على السبورة الذكية.<\/td><td>يصنفون الاستخدامات إلى فولاذ عادي أو مقاوم للصدأ ويبررون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 13-2 و14-2<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض العينتين.\nدور الطالب: يتوقعون.\n\n(10 دقائق) من حديد الزهر إلى الفولاذ (كتاب الطالب ص 41)\nدور المعلم: يوضح أن حديد الفرن هش لكثرة الكربون، فيُنفخ فيه الأكسجين لإزالة الكربون ثم تُضاف عناصر بنسب محسوبة.\nدور الطالب: يستخرجون الفرق بين حديد الزهر والفولاذ.\n\n(12 دقيقة) أنواع الفولاذ واستخداماتها\nدور المعلم: يعرض بطاقات استخدامات على السبورة الذكية.\nدور الطالب: يصنفون الاستخدامات إلى فولاذ عادي أو مقاوم للصدأ ويبررون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 13-2 و14-2\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يُحول حديد الزهر إلى فولاذ؟<\/td><td>لأن حديد الزهر هش بسبب ارتفاع نسبة الكربون فيه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر استخدامين للفولاذ العادي.<\/td><td>هياكل السيارات والآلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُفضل الفولاذ المقاوم للصدأ في مصانع الكيماويات رغم ارتفاع سعره؟<\/td><td>لأنه يقاوم التآكل بسبب الكروم والنيكل، فيدوم طويلًا ولا يلوث المواد.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا يُحول حديد الزهر إلى فولاذ؟\nالإجابة النموذجية: لأن حديد الزهر هش بسبب ارتفاع نسبة الكربون فيه.\n\n2) [المستوى المتوقع] اذكر استخدامين للفولاذ العادي.\nالإجابة النموذجية: هياكل السيارات والآلات.\n\n3) [المستوى المتقدم] لماذا يُفضل الفولاذ المقاوم للصدأ في مصانع الكيماويات رغم ارتفاع سعره؟\nالإجابة النموذجية: لأنه يقاوم التآكل بسبب الكروم والنيكل، فيدوم طويلًا ولا يلوث المواد."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الفولاذ المقاوم للصدأ سبيكة من الحديد مع الكروم والنيكل.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي أنواع الفولاذ يناسب أدوات المائدة؟<\/td><td>الفولاذ المقاوم للصدأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يمكن التحكم في خصائص الفولاذ؟ اذكر مثالين.<\/td><td>بالتحكم في نسبة الكربون والعناصر المضافة؛ فخفض الكربون يجعله أقل هشاشة وأسهل تشكيلًا، وإضافة الكروم والنيكل تجعله مقاومًا للصدأ.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: الفولاذ المقاوم للصدأ سبيكة من الحديد مع الكروم والنيكل.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أي أنواع الفولاذ يناسب أدوات المائدة؟\nالإجابة النموذجية: الفولاذ المقاوم للصدأ.\n\n3) [المستوى المتقدم] كيف يمكن التحكم في خصائص الفولاذ؟ اذكر مثالين.\nالإجابة النموذجية: بالتحكم في نسبة الكربون والعناصر المضافة؛ فخفض الكربون يجعله أقل هشاشة وأسهل تشكيلًا، وإضافة الكروم والنيكل تجعله مقاومًا للصدأ."},{"h":"<p>الإجابة عن السؤالين 13-2 و14-2 والأسئلة 2 (أ، ج) و3 و6 من أسئلة نهاية الوحدة الثانية، وتصنيف خمس أدوات منزلية فولاذية حسب نوع الفولاذ.<\/p>","t":"الإجابة عن السؤالين 13-2 و14-2 والأسئلة 2 (أ، ج) و3 و6 من أسئلة نهاية الوحدة الثانية، وتصنيف خمس أدوات منزلية فولاذية حسب نوع الفولاذ."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-2 إنتاج الحديد والفولاذ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–41 | كتاب النشاط: ورقة العمل 1-2 ص 32–33<\/div><div><b>دليل المعلم:<\/b> ص 40–41<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><ol class=\"ol\"><li>يذكر المواد الخام في الفرن العالي: الهيماتيت وفحم الكوك والحجر الجيري والهواء الساخن.<\/li><li>يصف ويشرح تفاعلات استخراج الحديد من الهيماتيت في الفرن العالي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد العامل المختزل الرئيس في الفرن العالي.<\/div><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><ol class=\"ol\"><li>يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث.<\/li><li>يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن.<\/div><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><ol class=\"ol\"><li>يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ.<\/li><li>يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يختار نوع الفولاذ المناسب لاستخدام معين ويبرر.<\/div>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\n1. يذكر المواد الخام في الفرن العالي: الهيماتيت وفحم الكوك والحجر الجيري والهواء الساخن.\n2. يصف ويشرح تفاعلات استخراج الحديد من الهيماتيت في الفرن العالي.\nمخرج تعليمي آخر: يحدد العامل المختزل الرئيس في الفرن العالي.\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\n1. يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث.\n2. يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم.\nمخرج تعليمي آخر: يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن.\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\n1. يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ.\n2. يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة).\nمخرج تعليمي آخر: يختار نوع الفولاذ المناسب لاستخدام معين ويبرر."},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر المواد الخام في الفرن العالي: الهيماتيت وفحم الكوك والحجر الجيري والهواء الساخن.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف ويشرح تفاعلات استخراج الحديد من الهيماتيت في الفرن العالي.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد العامل المختزل الرئيس في الفرن العالي.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يختار نوع الفولاذ المناسب لاستخدام معين ويبرر.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\n• يذكر المواد الخام في الفرن العالي: الهيماتيت وفحم الكوك والحجر الجيري والهواء الساخن. ← تذكر\n• يصف ويشرح تفاعلات استخراج الحديد من الهيماتيت في الفرن العالي. ← فهم\n• يحدد العامل المختزل الرئيس في الفرن العالي. ← تحليل\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\n• يشرح دور الحجر الجيري في إزالة الشوائب الحمضية (الرمل) وتكوين الخبث. ← فهم\n• يكتب معادلتي تفكك الحجر الجيري وتكوين سيليكات الكالسيوم. ← تطبيق\n• يفسر انفصال الخبث عن الحديد المنصهر في قاع الفرن. ← تحليل\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\n• يصف كيف تتغير خصائص الحديد بالتحكم في المواد المضافة لتكوين سبائك الفولاذ. ← فهم\n• يذكر استخدامات الفولاذ العادي (هياكل السيارات والآلات) والفولاذ المقاوم للصدأ (مصانع الكيماويات وأدوات المائدة). ← تذكر\n• يختار نوع الفولاذ المناسب لاستخدام معين ويبرر. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم بالاكتشاف<\/span><\/div><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><div class=\"pills\"><span>التعلم التشاركي<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\ ات إنتاج الحديد\nالفرن العالي، الهيماتيت، فحم الكوك، أول أكسيد الكربون، الحديد المنصهر\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\nالحجر الجيري، أكسيد الكالسيوم، ثاني أكسيد السيليكون، الخبث (سيليكات الكالسيوم)، الشوائب الحمضية\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\nحديد الزهر، الفولاذ العادي، الفولاذ المقاوم للصدأ، الكروم والنيكل، نسبة الكربون"},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><p>مقطع لفرن عالٍ يعمل ليلًا ونهارًا؛ سؤال: لماذا يعمل الفرن العالي بصورة مستمرة؟<\/p><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><p>سؤال: الهيماتيت يحتوي على رمل. ماذا سيحدث لجودة الحديد لو لم يُزل الرمل؟<\/p><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><p>يعرض ملعقة من الفولاذ المقاوم للصدأ ومسمارًا صدئًا ويسأل: كلاهما حديد في أساسه، فلماذا لم تصدأ الملعقة؟<\/p>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\nمقطع لفرن عالٍ يعمل ليلًا ونهارًا؛ سؤال: لماذا يعمل الفرن العالي بصورة مستمرة؟\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\nسؤال: الهيماتيت يحتوي على رمل. ماذا سيحدث لجودة الحديد لو لم يُزل الرمل؟\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\nيعرض ملعقة من الفولاذ المقاوم للصدأ ومسمارًا صدئًا ويسأل: كلاهما حديد في أساسه، فلماذا لم تصدأ الملعقة؟"},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">أجزاء الفرن<\/td><td>يعرض مخطط الفرن العالي ويحدد مداخل المواد الخام ومخارج الحديد والخبث والغازات.<\/td><td>يرسمون المخطط ويسمون أجزاءه.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">التفاعلات خطوة بخطوة (كتاب الطالب ص 39–40)<\/td><td>يكتب: <bdi>C + O₂ → CO₂<\/bdi> ثم <bdi>C + CO₂ → 2CO<\/bdi> ثم <bdi>Fe₂O₃ + 3CO → 2Fe + 3CO₂<\/bdi>.<\/td><td>يضعون المعادلات في مواضعها على المخطط ويحددون العامل المختزل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 9-2 و10-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">دور الحجر الجيري (كتاب الطالب ص 40)<\/td><td>يكتب على السبورة الذكية: <bdi>CaCO₃ → CaO + CO₂<\/bdi> ثم <bdi>CaO + SiO₂ → CaSiO₃<\/bdi>، ويوضح أن أكسيد الكالسيوم قاعدي يتفاعل مع الشوائب الحمضية.<\/td><td>يدونون المعادلتين ويحددون المادة الحمضية والمادة القاعدية.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">الخبث والحديد<\/td><td>يوضح أن الخبث أقل كثافة فيطفو فوق الحديد المنصهر ويُسحب كل منهما من فتحة مستقلة.<\/td><td>يفسرون الفصل بالكثافة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 1-2 الفرن العالي (كتاب النشاط ص 32–33)<\/td><td>يتابع.<\/td><td>يكملون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العينتين.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">من حديد الزهر إلى الفولاذ (كتاب الطالب ص 41)<\/td><td>يوضح أن حديد الفرن هش لكثرة الكربون، فيُنفخ فيه الأكسجين لإزالة الكربون ثم تُضاف عناصر بنسب محسوبة.<\/td><td>يستخرجون الفرق بين حديد الزهر والفولاذ.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">أنواع الفولاذ واستخداماتها<\/td><td>يعرض بطاقات استخدامات على السبورة الذكية.<\/td><td>يصنفون الاستخدامات إلى فولاذ عادي أو مقاوم للصدأ ويبررون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 13-2 و14-2<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\n(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) أجزاء الفرن\nدور المعلم: يعرض مخطط الفرن العالي ويحدد مداخل المواد الخام ومخارج الحديد والخبث والغازات.\nدور الطالب: يرسمون المخطط ويسمون أجزاءه.\n\n(15 دقيقة) التفاعلات خطوة بخطوة (كتاب الطالب ص 39–40)\nدور المعلم: يكتب: C + O₂ → CO₂ ثم C + CO₂ → 2CO ثم Fe₂O₃ + 3CO → 2Fe + 3CO₂.\nدور الطالب: يضعون المعادلات في مواضعها على المخطط ويحددون العامل المختزل.\n\n(5 دقائق) السؤالان 9-2 و10-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) دور الحجر الجيري (كتاب الطالب ص 40)\nدور المعلم: يكتب على السبورة الذكية: CaCO₃ → CaO + CO₂ ثم CaO + SiO₂ → CaSiO₃، ويوضح أن أكسيد الكالسيوم قاعدي يتفاعل مع الشوائب الحمضية.\nدور الطالب: يدونون المعادلتين ويحددون المادة الحمضية والمادة القاعدية.\n\n(8 دقائق) الخبث والحديد\nدور المعلم: يوضح أن الخبث أقل كثافة فيطفو فوق الحديد المنصهر ويُسحب كل منهما من فتحة مستقلة.\nدور الطالب: يفسرون الفصل بالكثافة.\n\n(10 دقائق) ورقة العمل 1-2 الفرن العالي (كتاب النشاط ص 32–33)\nدور المعلم: يتابع.\nدور الطالب: يكملون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\n(5 دقائق) التهيئة\nدور المعلم: يعرض العينتين.\nدور الطالب: يتوقعون.\n\n(10 دقائق) من حديد الزهر إلى الفولاذ (كتاب الطالب ص 41)\nدور المعلم: يوضح أن حديد الفرن هش لكثرة الكربون، فيُنفخ فيه الأكسجين لإزالة الكربون ثم تُضاف عناصر بنسب محسوبة.\nدور الطالب: يستخرجون الفرق بين حديد الزهر والفولاذ.\n\n(12 دقيقة) أنواع الفولاذ واستخداماتها\nدور المعلم: يعرض بطاقات استخدامات على السبورة الذكية.\nدور الطالب: يصنفون الاستخدامات إلى فولاذ عادي أو مقاوم للصدأ ويبررون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 13-2 و14-2\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المواد الخام الأربع في الفرن العالي؟<\/td><td>الهيماتيت، وفحم الكوك، والحجر الجيري، والهواء الساخن.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العامل المختزل الرئيس لأكسيد الحديد III في الفرن؟<\/td><td>أول أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اكتب المعادلات الثلاث لإنتاج الحديد بالترتيب.<\/td><td><bdi>C + O₂ → CO₂<\/bdi>؛ <bdi>C + CO₂ → 2CO<\/bdi>؛ <bdi>Fe₂O₃ + 3CO → 2Fe + 3CO₂<\/bdi><\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الغرض من إضافة الحجر الجيري إلى الفرن العالي؟<\/td><td>إزالة الشوائب الحمضية مثل الرمل بتحويلها إلى خبث.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة تكوّن الخبث.<\/td><td><bdi>CaO + SiO₂ → CaSiO₃<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتجمع الخبث فوق الحديد المنصهر؟<\/td><td>لأن كثافته أقل من كثافة الحديد المنصهر.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يُحول حديد الزهر إلى فولاذ؟<\/td><td>لأن حديد الزهر هش بسبب ارتفاع نسبة الكربون فيه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر استخدامين للفولاذ العادي.<\/td><td>هياكل السيارات والآلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُفضل الفولاذ المقاوم للصدأ في مصانع الكيماويات رغم ارتفاع سعره؟<\/td><td>لأنه يقاوم التآكل بسبب الكروم والنيكل، فيدوم طويلًا ولا يلوث المواد.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\n1) [مستوى الدعم] ما المواد الخام الأربع في الفرن العالي؟\nالإجابة النموذجية: الهيماتيت، وفحم الكوك، والحجر الجيري، والهواء الساخن.\n\n2) [المستوى المتوقع] ما العامل المختزل الرئيس لأكسيد الحديد III في الفرن؟\nالإجابة النموذجية: أول أكسيد الكربون.\n\n3) [المستوى المتقدم] اكتب المعادلات الثلاث لإنتاج الحديد بالترتيب.\nالإجابة النموذجية: C + O₂ → CO₂؛ C + CO₂ → 2CO؛ Fe₂O₃ + 3CO → 2Fe + 3CO₂\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\n1) [مستوى الدعم] ما الغرض من إضافة الحجر الجيري إلى الفرن العالي؟\nالإجابة النموذجية: إزالة الشوائب الحمضية مثل الرمل بتحويلها إلى خبث.\n\n2) [المستوى المتوقع] اكتب معادلة تكوّن الخبث.\nالإجابة النموذجية: CaO + SiO₂ → CaSiO₃\n\n3) [المستوى المتقدم] لماذا يتجمع الخبث فوق الحديد المنصهر؟\nالإجابة النموذجية: لأن كثافته أقل من كثافة الحديد المنصهر.\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\n1) [مستوى الدعم] لماذا يُحول حديد الزهر إلى فولاذ؟\nالإجابة النموذجية: لأن حديد الزهر هش بسبب ارتفاع نسبة الكربون فيه.\n\n2) [المستوى المتوقع] اذكر استخدامين للفولاذ العادي.\nالإجابة النموذجية: هياكل السيارات والآلات.\n\n3) [المستوى المتقدم] لماذا يُفضل الفولاذ المقاوم للصدأ في مصانع الكيماويات رغم ارتفاع سعره؟\nالإجابة النموذجية: لأنه يقاوم التآكل بسبب الكروم والنيكل، فيدوم طويلًا ولا يلوث المواد."},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>Fe₂O₃ + 3CO<\/bdi> → ......... + .........<\/td><td><bdi>2Fe + 3CO₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُضخ الهواء الساخن في أسفل الفرن؟<\/td><td>ليحترق فحم الكوك ويطلق حرارة عالية تلزم للتفاعلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التفاعل <bdi>C + O₂ → CO₂<\/bdi> مهمًا مع أنه لا ينتج الحديد مباشرة؟<\/td><td>لأنه طارد للحرارة فيرفع درجة الحرارة، وينتج CO₂ الذي يتحول إلى CO المختزل.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يتفكك الحجر الجيري بالحرارة إلى ......... و.........<\/td><td>أكسيد الكالسيوم – ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صنّف: ثاني أكسيد السيليكون وأكسيد الكالسيوم إلى حمضي وقاعدي.<\/td><td>ثاني أكسيد السيليكون حمضي، وأكسيد الكالسيوم قاعدي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح استخدامًا للخبث بعد سحبه من الفرن.<\/td><td>رصف الطرق أو صناعة الإسمنت.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الفولاذ المقاوم للصدأ سبيكة من الحديد مع الكروم والنيكل.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي أنواع الفولاذ يناسب أدوات المائدة؟<\/td><td>الفولاذ المقاوم للصدأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يمكن التحكم في خصائص الفولاذ؟ اذكر مثالين.<\/td><td>بالتحكم في نسبة الكربون والعناصر المضافة؛ فخفض الكربون يجعله أقل هشاشة وأسهل تشكيلًا، وإضافة الكروم والنيكل تجعله مقاومًا للصدأ.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\n1) [مستوى الدعم] أكمل: Fe₂O₃ + 3CO → ......... + .........\nالإجابة النموذجية: 2Fe + 3CO₂\n\n2) [المستوى المتوقع] لماذا يُضخ الهواء الساخن في أسفل الفرن؟\nالإجابة النموذجية: ليحترق فحم الكوك ويطلق حرارة عالية تلزم للتفاعلات.\n\n3) [المستوى المتقدم] لماذا يُعد التفاعل C + O₂ → CO₂ مهمًا مع أنه لا ينتج الحديد مباشرة؟\nالإجابة النموذجية: لأنه طارد للحرارة فيرفع درجة الحرارة، وينتج CO₂ الذي يتحول إلى CO المختزل.\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\n1) [مستوى الدعم] أكمل: يتفكك الحجر الجيري بالحرارة إلى ......... و.........\nالإجابة النموذجية: أكسيد الكالسيوم – ثاني أكسيد الكربون.\n\n2) [المستوى المتوقع] صنّف: ثاني أكسيد السيليكون وأكسيد الكالسيوم إلى حمضي وقاعدي.\nالإجابة النموذجية: ثاني أكسيد السيليكون حمضي، وأكسيد الكالسيوم قاعدي.\n\n3) [المستوى المتقدم] اقترح استخدامًا للخبث بعد سحبه من الفرن.\nالإجابة النموذجية: رصف الطرق أو صناعة الإسمنت.\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\n1) [مستوى الدعم] صواب أم خطأ: الفولاذ المقاوم للصدأ سبيكة من الحديد مع الكروم والنيكل.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أي أنواع الفولاذ يناسب أدوات المائدة؟\nالإجابة النموذجية: الفولاذ المقاوم للصدأ.\n\n3) [المستوى المتقدم] كيف يمكن التحكم في خصائص الفولاذ؟ اذكر مثالين.\nالإجابة النموذجية: بالتحكم في نسبة الكربون والعناصر المضافة؛ فخفض الكربون يجعله أقل هشاشة وأسهل تشكيلًا، وإضافة الكروم والنيكل تجعله مقاومًا للصدأ."},{"h":"<div class=\"psub\">الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد<\/div><p>مراجعة كتاب الطالب ص 39–40 والإجابة عن السؤالين 9-2 و10-2، والبدء في ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33.<\/p><div class=\"psub\">الحصة 2: إزالة الشوائب الحمضية وتكوين الخبث<\/div><p>إكمال ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33، والإجابة عن السؤالين 11-2 و12-2.<\/p><div class=\"psub\">الحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ<\/div><p>الإجابة عن السؤالين 13-2 و14-2 والأسئلة 2 (أ، ج) و3 و6 من أسئلة نهاية الوحدة الثانية، وتصنيف خمس أدوات منزلية فولاذية حسب نوع الفولاذ.<\/p>","t":"الحصة 1: الفرن العالي وتفاعلات إنتاج الحديد\nمراجعة كتاب الطالب ص 39–40 والإجابة عن السؤالين 9-2 و10-2، والبدء في ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33.\n\nالحصة 2: إزالة الشوائب الحمضية وتكوين الخبث\nإكمال ورقة العمل 1-2 الفرن العالي في كتاب النشاط ص 32–33، والإجابة عن السؤالين 11-2 و12-2.\n\nالحصة 3: تحويل الحديد إلى فولاذ وأنواع الفولاذ\nالإجابة عن السؤالين 13-2 و14-2 والأسئلة 2 (أ، ج) و3 و6 من أسئلة نهاية الوحدة الثانية، وتصنيف خمس أدوات منزلية فولاذية حسب نوع الفولاذ."}]}},{"label":"3-2 السبائك","unit":"الوحدة الثانية: استخلاص الفلزات واستخداماتها","periods":[{"n":1,"focus":"مفهوم السبيكة وتمثيل تركيبها","info":"<div><b>الدرس:<\/b> 3-2 السبائك<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–44 | كتاب النشاط: تمرين 1-2 ص 29–31<\/div><div><b>دليل المعلم:<\/b> ص 41<\/div><div><b>محور الحصة:<\/b> مفهوم السبيكة وتمثيل تركيبها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى.<\/li><li>يحدد تمثيل السبائك وفقًا لمخططات تركيبها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين مخطط فلز نقي ومخطط سبيكة.<\/div>","t":"1. يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى.\n2. يحدد تمثيل السبائك وفقًا لمخططات تركيبها.\nمخرج تعليمي آخر: يميز بين مخطط فلز نقي ومخطط سبيكة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد تمثيل السبائك وفقًا لمخططات تركيبها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يميز بين مخطط فلز نقي ومخطط سبيكة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى. ← فهم\n• يحدد تمثيل السبائك وفقًا لمخططات تركيبها. ← تطبيق\n• يميز بين مخطط فلز نقي ومخطط سبيكة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>أخرى: كرات بلاستيكية بحجمين لنمذجة الطبقات<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• أخرى: كرات بلاستيكية بحجمين لنمذجة الطبقات"},{"h":"<div class=\"pills\"><span>السبيكة<\/span><span>النحاس الأصفر<\/span><span>المخلوط<\/span><span>البنية الشبكية<\/span><span>الذرات المختلفة الحجم<\/span><\/div>","t":"السبيكة، النحاس الأصفر، المخلوط، البنية الشبكية، الذرات المختلفة الحجم"},{"h":"<p>يعرض مفتاحًا من النحاس الأصفر وسلكًا من النحاس النقي ويسأل: لماذا لا يُصنع المفتاح من النحاس النقي؟<\/p>","t":"يعرض مفتاحًا من النحاس الأصفر وسلكًا من النحاس النقي ويسأل: لماذا لا يُصنع المفتاح من النحاس النقي؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العينتين.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تعريف السبيكة وأمثلتها (كتاب الطالب ص 42)<\/td><td>يعرّف السبيكة ويعرض: النحاس الأصفر (نحاس + خارصين)، والفولاذ (حديد + كربون).<\/td><td>يكملون جدولًا: السبيكة ومكوناتها.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">نمذجة الطبقات<\/td><td>يوزع كرات بحجم واحد لبناء طبقات منتظمة، ثم يدخل كرات أكبر بينها.<\/td><td>يدفعون الطبقات ويلاحظون صعوبة انزلاقها في نموذج السبيكة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مخططات التركيب<\/td><td>يعرض على السبورة الذكية مخططات ذرية ويطلب تحديد الفلز النقي والسبيكة.<\/td><td>يحددون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض العينتين.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) تعريف السبيكة وأمثلتها (كتاب الطالب ص 42)\nدور المعلم: يعرّف السبيكة ويعرض: النحاس الأصفر (نحاس + خارصين)، والفولاذ (حديد + كربون).\nدور الطالب: يكملون جدولًا: السبيكة ومكوناتها.\n\n(13 دقيقة) نمذجة الطبقات\nدور المعلم: يوزع كرات بحجم واحد لبناء طبقات منتظمة، ثم يدخل كرات أكبر بينها.\nدور الطالب: يدفعون الطبقات ويلاحظون صعوبة انزلاقها في نموذج السبيكة.\n\n(5 دقائق) مخططات التركيب\nدور المعلم: يعرض على السبورة الذكية مخططات ذرية ويطلب تحديد الفلز النقي والسبيكة.\nدور الطالب: يحددون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالسبيكة؟<\/td><td>مخلوط من فلز مع عنصر أو عناصر أخرى.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما مكونات النحاس الأصفر؟<\/td><td>النحاس والخارصين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مخطط فيه ذرات متماثلة منتظمة وآخر فيه ذرات أكبر متناثرة بينها. أيهما سبيكة؟ ولماذا؟<\/td><td>الثاني؛ لأن وجود ذرات عنصر آخر مختلفة الحجم يدل على مخلوط.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بالسبيكة؟\nالإجابة النموذجية: مخلوط من فلز مع عنصر أو عناصر أخرى.\n\n2) [المستوى المتوقع] ما مكونات النحاس الأصفر؟\nالإجابة النموذجية: النحاس والخارصين.\n\n3) [المستوى المتقدم] مخطط فيه ذرات متماثلة منتظمة وآخر فيه ذرات أكبر متناثرة بينها. أيهما سبيكة؟ ولماذا؟\nالإجابة النموذجية: الثاني؛ لأن وجود ذرات عنصر آخر مختلفة الحجم يدل على مخلوط."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: السبيكة مركب كيميائي.<\/td><td>خطأ؛ السبيكة مخلوط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: الفولاذ سبيكة من ......... و.........<\/td><td>الحديد – الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا تنزلق الطبقات بسهولة في السبيكة؟<\/td><td>لأن الذرات المختلفة الحجم تشوه انتظام الطبقات فتعيق انزلاقها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: السبيكة مركب كيميائي.\nالإجابة النموذجية: خطأ؛ السبيكة مخلوط.\n\n2) [المستوى المتوقع] أكمل: الفولاذ سبيكة من ......... و.........\nالإجابة النموذجية: الحديد – الكربون.\n\n3) [المستوى المتقدم] لماذا لا تنزلق الطبقات بسهولة في السبيكة؟\nالإجابة النموذجية: لأن الذرات المختلفة الحجم تشوه انتظام الطبقات فتعيق انزلاقها."},{"h":"<p>مراجعة كتاب الطالب ص 42–43 والإجابة عن السؤالين 15-2 و16-2، والبدء في تمرين 1-2 الفلزات والسبائك في كتاب النشاط ص 29–31.<\/p>","t":"مراجعة كتاب الطالب ص 42–43 والإجابة عن السؤالين 15-2 و16-2، والبدء في تمرين 1-2 الفلزات والسبائك في كتاب النشاط ص 29–31."}]},{"n":2,"focus":"أسباب استخدام السبائك بدل الفلزات النقية","info":"<div><b>الدرس:<\/b> 3-2 السبائك<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–44 | كتاب النشاط: تمرين 1-2 ص 29–31<\/div><div><b>دليل المعلم:<\/b> ص 41<\/div><div><b>محور الحصة:<\/b> أسباب استخدام السبائك بدل الفلزات النقية<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها.<\/li><li>يقارن خصائص سبيكة بخصائص الفلز النقي المكون لها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستقصي سبائك مثيرة للاهتمام ويعرض سبب استخدامها.<\/div>","t":"1. يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها.\n2. يقارن خصائص سبيكة بخصائص الفلز النقي المكون لها.\nمخرج تعليمي آخر: يستقصي سبائك مثيرة للاهتمام ويعرض سبب استخدامها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقارن خصائص سبيكة بخصائص الفل =\"st\">تمرين 1-2 (كتاب النشاط ص 29–31)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) خصائص السبائك\nدور المعلم: يعرض بعرض تقديمي جدولًا يقارن صلابة الفلزات النقية بسبائكها.\nدور الطالب: يستنتجون أن السبائك أصلب وأقوى وبعضها أكثر مقاومة للتآكل.\n\n(13 دقيقة) النشاط 2-2 سبائك مثيرة للاهتمام (إثرائي – كتاب الطالب)\nدور المعلم: يوزع بطاقات: سبيكة اللحام، والذهب عيار 18، وسبيكة ذاكرة الشكل.\nدور الطالب: تبحث كل مجموعة في سبب استخدام سبيكتها وتعرضه.\n\n(5 دقائق) تمرين 1-2 (كتاب النشاط ص 29–31)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر سببين لاستخدام السبائك بدل الفلزات النقية.<\/td><td>السبائك أصلب وأقوى، وبعضها أكثر مقاومة للتآكل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُخلط الذهب بفلزات أخرى في صناعة الحلي؟<\/td><td>لأن الذهب النقي لين جدًا فيتشوه بسهولة، والسبيكة أصلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر صلابة السبيكة مقارنة بالفلز النقي باستخدام نموذج الطبقات.<\/td><td>ذرات العنصر المضاف مختلفة الحجم فتعيق انزلاق طبقات الذرات بعضها فوق بعض.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر سببين لاستخدام السبائك بدل الفلزات النقية.\nالإجابة النموذجية: السبائك أصلب وأقوى، وبعضها أكثر مقاومة للتآكل.\n\n2) [المستوى المتوقع] لماذا يُخلط الذهب بفلزات أخرى في صناعة الحلي؟\nالإجابة النموذجية: لأن الذهب النقي لين جدًا فيتشوه بسهولة، والسبيكة أصلب.\n\n3) [المستوى المتقدم] فسّر صلابة السبيكة مقارنة بالفلز النقي باستخدام نموذج الطبقات.\nالإجابة النموذجية: ذرات العنصر المضاف مختلفة الحجم فتعيق انزلاق طبقات الذرات بعضها فوق بعض."},{"h":"<table class=\"t\"><thead><tr><th>المستوى وم (كتاب الطالب ص 43–44)<\/td><td>يعرض الاستخدامات ويربطها بالخصائص.<\/td><td>يكملون جدولًا: الفلز، الاستخدام، الخاصية.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">لعبة الربط<\/td><td>يوزع بطاقات استخدامات وخصائص.<\/td><td>تتسابق المجموعات في المطابقة الصحيحة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤال 19-2<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية.\nدور الطالب: يجيبون.\n\n(12 دقيقة) استخدامات الخارصين والألومنيوم (كتاب الطالب ص 43–44)\nدور المعلم: يعرض الاستخدامات ويربطها بالخصائص.\nدور الطالب: يكملون جدولًا: الفلز، الاستخدام، الخاصية.\n\n(10 دقائق) لعبة الربط\nدور المعلم: يوزع بطاقات استخدامات وخصائص.\nدور الطالب: تتسابق المجموعات في المطابقة الصحيحة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤال 19-2\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يُستخدم الألومنيوم في أجزاء الطائرات؟<\/td><td>لقوته وانخفاض كثافته.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المقصود بالجلفنة؟<\/td><td>تغطية الفولاذ أو الحديد بطبقة من الخارصين لحمايته من الصدأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُستخدم الألومنيوم في علب الطعام مع أنه فلز نشط نسبيًا؟<\/td><td>لأن طبقة أكسيد الألومنيوم الرقيقة على سطحه تمنع استمرار التآكل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا يُستخدم الألومنيوم في أجزاء الطائرات؟\nالإجابة النموذجية: لقوته وانخفاض كثافته.\n\n2) [المستوى المتوقع] ما المقصود بالجلفنة؟\nالإجابة النموذجية: تغطية الفولاذ أو الحديد بطبقة من الخارصين لحمايته من الصدأ.\n\n3) [المستوى المتقدم] لماذا يُستخدم الألومنيوم في علب الطعام مع أنه فلز نشط نسبيًا؟\nالإجابة النموذجية: لأن طبقة أكسيد الألومنيوم الرقيقة على سطحه تمنع استمرار التآكل."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يدخل الخارصين في صناعة سبيكة .........<\/td><td>النحاس الأصفر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر خاصيتين للألومنيوم مع استخدام لكل منهما.<\/td><td>انخفاض الكثافة مع القوة لأجزاء الطائرات، ومقاومة التآكل لحاويات الغذاء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قارن بين الألومنيوم والفولاذ في صناعة جسم طائرة.<\/td><td>سبائك الألومنيوم أخف بكثير مع قوة مناسبة فتقلل وزن الطائرة واستهلاك الوقود، أما الفولاذ فقوي لكنه ثقيل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يدخل الخارصين في صناعة سبيكة .........\nالإجابة النموذجية: النحاس الأصفر.\n\n2) [المستوى المتوقع] اذكر خاصيتين للألومنيوم مع استخدام لكل منهما.\nالإجابة النموذجية: انخفاض الكثافة مع القوة لأجزاء الطائرات، ومقاومة التآكل لحاويات الغذاء.\n\n3) [المستوى المتقدم] قارن بين الألومنيوم والفولاذ في صناعة جسم طائرة.\nالإجابة النموذجية: سبائك الألومنيوم أخف بكثير مع قوة مناسبة فتقلل وزن الطائرة واستهلاك الوقود، أما الفولاذ فقوي لكنه ثقيل."},{"h":"<p>الإجابة عن السؤال 19-2 والسؤال 4 من أسئلة نهاية الوحدة الثانية، والبحث عن ثلاث أدوات منزلية مصنوعة من الألومنيوم.<\/p>","t":"الإجابة عن السؤال 19-2 والسؤال 4 من أسئلة نهاية الوحدة الثانية، والبحث عن ثلاث أدوات منزلية مصنوعة من الألومنيوم."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-2 السبائك<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–44 | كتاب النشاط: تمرين 1-2 ص 29–31<\/div><div><b>دليل المعلم:<\/b> ص 41<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><ol class=\"ol\"><li>يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى.<\/li><li>يحدد تمثيل السبائك وفقًا لمخططات تركيبها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين مخطط فلز نقي ومخطط سبيكة.<\/div><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><ol class=\"ol\"><li>يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها.<\/li><li>يقارن خصائص سبيكة بخصائص الفلز النقي المكون لها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستقصي سبائك مثيرة للاهتمام ويعرض سبب استخدامها.<\/div><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><ol class=\"ol\"><li>يشرح استخدامات الخارصين في جلفنة الفولاذ وفي صناعة النحاس الأصفر.<\/li><li>يصف استخدام الألومنيوم في أجزاء الطائرات لقوته وانخفاض كثافته، وفي حاويات الغذاء لمقاومته للتآكل.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط كل استخدام بالخاصية المناسبة له.<\/div>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\n1. يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى.\n2. يحدد تمثيل السبائك وفقًا لمخططات تركيبها.\nمخرج تعليمي آخر: يميز بين مخطط فلز نقي ومخطط سبيكة.\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\n1. يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها.\n2. يقارن خصائص سبيكة بخصائص الفلز النقي المكون لها.\nمخرج تعليمي آخر: يستقصي سبائك مثيرة للاهتمام ويعرض سبب استخدامها.\n\nالحصة 3: استخدامات الخارصين والألومنيوم\n1. يشرح استخدامات الخارصين في جلفنة الفولاذ وفي صناعة النحاس الأصفر.\n2. يصف استخدام الألومنيوم في أجزاء الطائرات لقوته وانخفاض كثافته، وفي حاويات الغذاء لمقاومته للتآكل.\nمخرج تعليمي آخر: يربط كل استخدام بالخاصية المناسبة له."},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد تمثيل السبائك وفقًا لمخططات تركيبها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يميز بين مخطط فلز نقي ومخطط سبيكة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقارن خصائص سبيكة بخصائص الفلز النقي المكون لها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يستقصي سبائك مثيرة للاهتمام ويعرض سبب استخدامها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح استخدامات الخارصين في جلفنة الفولاذ وفي صناعة النحاس الأصفر.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف استخدام الألومنيوم في أجزاء الطائرات لقوته وانخفاض كثافته، وفي حاويات الغذاء لمقاومته للتآكل.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يربط كل استخدام بالخاصية المناسبة له.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\n• يصف السبائك كالنحاس الأصفر بأنها مخاليط من فلز مع عناصر أخرى. ← فهم\n• يحدد تمثيل السبائك وفقًا لمخططات تركيبها. ← تطبيق\n• يميز بين مخطط فلز نقي ومخطط سبيكة. ← تحليل\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\n• يشرح أسباب استخدام السبائك بدل الفلزات النقية في ضوء خصائصها. ← فهم\n• يقارن خصائص سبيكة بخصائص الفلز النقي المكون لها. ← تحليل\n• يستقصي سبائك مثيرة للاهتمام ويعرض سبب استخدامها. ← تطبيق\n\nالحصة 3: استخدامات الخارصين والألومنيوم\n• يشرح استخدامات الخارصين في جلفنة الفولاذ وفي صناعة النحاس الأصفر. ← فهم\n• يصف استخدام الألومنيوم في أجزاء الطائرات لقوته وانخفاض كثافته، وفي حاويات الغذاء لمقاومته للتآكل. ← فهم\n• يربط كل استخدام بالخاصية المناسبة له. ← تطبيق"},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل ا ذرات المختلفة الحجم<\/span><\/div><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><div class=\"pills\"><span>الصلابة<\/span><span>القوة<\/span><span>مقاومة التآكل<\/span><span>البرونز<\/span><span>سبيكة اللحام<\/span><\/div><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><div class=\"pills\"><span>الجلفنة<\/span><span>الخارصين<\/span><span>الألومنيوم<\/span><span>انخفاض الكثافة<\/span><span>مقاومة التآكل<\/span><\/div>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\nالسبيكة، النحاس الأصفر، المخلوط، البنية الشبكية، الذرات المختلفة الحجم\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\nالصلابة، القوة، مقاومة التآكل، البرونز، سبيكة اللحام\n\nالحصة 3: استخدامات الخارصين والألومنيوم\nالجلفنة، الخارصين، الألومنيوم، انخفاض الكثافة، مقاومة التآكل"},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><p>يعرض مفتاحًا من النحاس الأصفر وسلكًا من النحاس النقي ويسأل: لماذا لا يُصنع المفتاح من النحاس النقي؟<\/p><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><p>سؤال: لماذا تُصنع الميداليات من البرونز لا من النحاس النقي؟<\/p><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><p>يعرض صور طائرة ودلو مجلفن وعلبة مشروب ويسأل: ما الفلز المستخدم في كل منها؟ ولماذا اختير؟<\/p>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\nيعرض مفتاحًا من النحاس الأصفر وسلكًا من النحاس النقي ويسأل: لماذا لا يُصنع المفتاح من النحاس النقي؟\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\nسؤال: لماذا تُصنع الميداليات من البرونز لا من النحاس النقي؟\n\nالحصة 3: استخدامات الخارصين والألومنيوم\nيعرض صور طائرة ودلو مجلفن وعلبة مشروب ويسأل: ما الفلز المستخدم في كل منها؟ ولماذا اختير؟"},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العينتين.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تعريف السبيكة وأمثلتها (كتاب الطالب ص 42)<\/td><td>يعرّف السبيكة ويعرض: النحاس الأصفر (نحاس + خارصين)، والفولاذ (حديد + كربون).<\/td><td>يكملون جدولًا: السبيكة ومكوناتها.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">نمذجة الطبقات<\/td><td>يوزع كرات بحجم واحد لبناء طبقات منتظمة، ثم يدخل كرات أكبر بينها.<\/td><td>يدفعون الطبقات ويلاحظون صعوبة انزلاقها في نموذج السبيكة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مخططات التركيب<\/td><td>يعرض على السبورة الذكية مخططات ذرية ويطلب تحديد الفلز النقي والسبيكة.<\/td><td>يحددون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">خصائص السبائك<\/td><td>يعرض بعرض تقديمي جدولًا يقارن صلابة الفلزات النقية بسبائكها.<\/td><td>يستنتجون أن السبائك أصلب وأقوى وبعضها أكثر مقاومة للتآكل.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">النشاط 2-2 سبائك مثيرة للاهتمام (إثرائي – كتاب الطالب)<\/td><td>يوزع بطاقات: سبيكة اللحام، والذهب عيار 18، وسبيكة ذاكرة الشكل.<\/td><td>تبحث كل مجموعة في سبب استخدام سبيكتها وتعرضه.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 1-2 (كتاب النشاط ص 29–31)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصور على السبورة الذكية.<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استخدامات الخارصين والألومنيوم (كتاب الطالب ص 43–44)<\/td><td>يعرض الاستخدامات ويربطها بالخصائص.<\/td><td>يكملون جدولًا: الفلز، الاستخدام، الخاصية.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">لعبة الربط<\/td><td>يوزع بطاقات استخدامات وخصائص.<\/td><td>تتسابق المجموعات في المطابقة الصحيحة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤال 19-2<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\n(5 دقائق) التهيئة\nدور المعلم: يعرض العينتين.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) تعريف السبيكة وأمثلتها (كتاب الطالب ص 42)\nدور المعلم: يعرّف السبيكة ويعرض: النحاس الأصفر (نحاس + خارصين)، والفولاذ (حديد + كربون).\nدور الطالب: يكملون جدولًا: السبيكة ومكوناتها.\n\n(13 دقيقة) نمذجة الطبقات\nدور المعلم: يوزع كرات بحجم واحد لبناء طبقات منتظمة، ثم يدخل كرات أكبر بينها.\nدور الطالب: يدفعون الطبقات ويلاحظون صعوبة انزلاقها في نموذج السبيكة.\n\n(5 دقائق) مخططات التركيب\nدور المعلم: يعرض على السبورة الذكية مخططات ذرية ويطلب تحديد الفلز النقي والسبيكة.\nدور الطالب: يحددون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) خصائص السبائك\nدور المعلم: يعرض بعرض تقديمي جدولًا يقارن صلابة الفلزات النقية بسبائكها.\nدور الطالب: يستنتجون أن السبائك أصلب وأقوى وبعضها أكثر مقاومة للتآكل.\n\n(13 دقيقة) النشاط 2-2 سبائك مثيرة للاهتمام (إثرائي – كتاب الطالب)\nدور المعلم: يوزع بطاقات: سبيكة اللحام، والذهب عيار 18، وسبيكة ذاكرة الشكل.\nدور الطالب: تبحث كل مجموعة في سبب استخدام سبيكتها وتعرضه.\n\n(5 دقائق) تمرين 1-2 (كتاب النشاط ص 29–31)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: استخدامات الخارصين والألومنيوم\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية.\nدور الطالب: يجيبون.\n\n(12 دقيقة) استخدامات الخارصين والألومنيوم (كتاب الطالب ص 43–44)\nدور المعلم: يعرض الاستخدامات ويربطها بالخصائص.\nدور الطالب: يكملون جدولًا: الفلز، الاستخدام، الخاصية.\n\n(10 دقائق) لعبة الربط\nدور المعلم: يوزع بطاقات استخدامات وخصائص.\nدور الطالب: تتسابق المجموعات في المطابقة الصحيحة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤال 19-2\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالسبيكة؟<\/td><td>مخلوط من فلز مع عنصر أو عناصر أخرى.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما مكونات النحاس الأصفر؟<\/td><td>النحاس والخارصين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مخطط فيه ذرات متماثلة منتظمة وآخر فيه ذرات أكبر متناثرة بينها. أيهما سبيكة؟ ولماذا؟<\/td><td>الثاني؛ لأن وجود ذرات عنصر آخر مختلفة الحجم يدل على مخلوط.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر سببين لاستخدام السبائك بدل الفلزات النقية.<\/td><td>السبائك أصلب وأقوى، وبعضها أكثر مقاومة للتآكل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُخلط الذهب بفلزات أخرى في صناعة الحلي؟<\/td><td>لأن الذهب النقي لين جدًا فيتشوه بسهولة، والسبيكة أصلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر صلابة السبيكة مقارنة بالفلز النقي باستخدام نموذج الطبقات.<\/td><td>ذرات العنصر المضاف مختلفة الحجم فتعيق انزلاق طبقات الذرات بعضها فوق بعض.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يُستخدم الألومنيوم في أجزاء الطائرات؟<\/td><td>لقوته وانخفاض كثافته.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المقصود بالجلفنة؟<\/td><td>تغطية الفولاذ أو الحديد بطبقة من الخارصين لحمايته من الصدأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُستخدم الألومنيوم في علب الطعام مع أنه فلز نشط نسبيًا؟<\/td><td>لأن طبقة أكسيد الألومنيوم الرقيقة على سطحه تمنع استمرار التآكل.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\n1) [مستوى الدعم] ما المقصود بالسبيكة؟\nالإجابة النموذجية: مخلوط من فلز مع عنصر أو عناصر أخرى.\n\n2) [المستوى المتوقع] ما مكونات النحاس الأصفر؟\nالإجابة النموذجية: النحاس والخارصين.\n\n3) [المستوى المتقدم] مخطط فيه ذرات متماثلة منتظمة وآخر فيه ذرات أكبر متناثرة بينها. أيهما سبيكة؟ ولماذا؟\nالإجابة النموذجية: الثاني؛ لأن وجود ذرات عنصر آخر مختلفة الحجم يدل على مخلوط.\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\n1) [مستوى الدعم] اذكر سببين لاستخدام السبائك بدل الفلزات النقية.\nالإجابة النموذجية: السبائك أصلب وأقوى، وبعضها أكثر مقاومة للتآكل.\n\n2) [المستوى المتوقع] لماذا يُخلط الذهب بفلزات أخرى في صناعة الحلي؟\nالإجابة النموذجية: لأن الذهب النقي لين جدًا فيتشوه بسهولة، والسبيكة أصلب.\n\n3) [المستوى المتقدم] فسّر صلابة السبيكة مقارنة بالفلز النقي باستخدام نموذج الطبقات.\nالإجابة النموذجية: ذرات العنصر المضاف مختلفة الحجم فتعيق انزلاق طبقات الذرات بعضها فوق بعض.\n\nالحصة 3: استخدامات الخارصين والألومنيوم\n1) [مستوى الدعم] لماذا يُستخدم الألومنيوم في أجزاء الطائرات؟\nالإجابة النموذجية: لقوته وانخفاض كثافته.\n\n2) [المستوى المتوقع] ما المقصود بالجلفنة؟\nالإجابة النموذجية: تغطية الفولاذ أو الحديد بطبقة من الخارصين لحمايته من الصدأ.\n\n3) [المستوى المتقدم] لماذا يُستخدم الألومنيوم في علب الطعام مع أنه فلز نشط نسبيًا؟\nالإجابة النموذجية: لأن طبقة أكسيد الألومنيوم الرقيقة على سطحه تمنع استمرار التآكل."},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: السبيكة مركب كيميائي.<\/td><td>خطأ؛ السبيكة مخلوط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: الفولاذ سبيكة من ......... و.........<\/td><td>الحديد – الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا تنزلق الطبقات بسهولة في السبيكة؟<\/td><td>لأن الذرات المختلفة الحجم تشوه انتظام الطبقات فتعيق انزلاقها.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: البرونز سبيكة من النحاس و.........<\/td><td>القصدير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الخاصية المطلوبة في سبيكة اللحام؟<\/td><td>درجة انصهار منخفضة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح سبيكة مناسبة لصنع صنابير الماء وبرر.<\/td><td>النحاس الأصفر؛ لأنه صلب ومقاوم للتآكل وسهل التشكيل.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يدخل الخارصين في صناعة سبيكة .........<\/td><td>النحاس الأصفر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر خاصيتين للألومنيوم مع استخدام لكل منهما.<\/td><td>انخفاض الكثافة مع القوة لأجزاء الطائرات، ومقاومة التآكل لحاويات الغذاء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قارن بين الألومنيوم والفولاذ في صناعة جسم طائرة.<\/td><td>سبائك الألومنيوم أخف بكثير مع قوة مناسبة فتقلل وزن الطائرة واستهلاك الوقود، أما الفولاذ فقوي لكنه ثقيل.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\n1) [مستوى الدعم] صواب أم خطأ: السبيكة مركب كيميائي.\nالإجابة النموذجية: خطأ؛ السبيكة مخلوط.\n\n2) [المستوى المتوقع] أكمل: الفولاذ سبيكة من ......... و.........\nالإجابة النموذجية: الحديد – الكربون.\n\n3) [المستوى المتقدم] لماذا لا تنزلق الطبقات بسهولة في السبيكة؟\nالإجابة النموذجية: لأن الذرات المختلفة الحجم تشوه انتظام الطبقات فتعيق انزلاقها.\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\n1) [مستوى الدعم] أكمل: البرونز سبيكة من النحاس و.........\nالإجابة النموذجية: القصدير.\n\n2) [المستوى المتوقع] ما الخاصية المطلوبة في سبيكة اللحام؟\nالإجابة النموذجية: درجة انصهار منخفضة.\n\n3) [المستوى المتقدم] اقترح سبيكة مناسبة لصنع صنابير الماء وبرر.\nالإجابة النموذجية: النحاس الأصفر؛ لأنه صلب ومقاوم للتآكل وسهل التشكيل.\n\nالحصة 3: استخدامات الخارصين والألومنيوم\n1) [مستوى الدعم] أكمل: يدخل الخارصين في صناعة سبيكة .........\nالإجابة النموذجية: النحاس الأصفر.\n\n2) [المستوى المتوقع] اذكر خاصيتين للألومنيوم مع استخدام لكل منهما.\nالإجابة النموذجية: انخفاض الكثافة مع القوة لأجزاء الطائرات، ومقاومة التآكل لحاويات الغذاء.\n\n3) [المستوى المتقدم] قارن بين الألومنيوم والفولاذ في صناعة جسم طائرة.\nالإجابة النموذجية: سبائك الألومنيوم أخف بكثير مع قوة مناسبة فتقلل وزن الطائرة واستهلاك الوقود، أما الفولاذ فقوي لكنه ثقيل."},{"h":"<div class=\"psub\">الحصة 1: مفهوم السبيكة وتمثيل تركيبها<\/div><p>مراجعة كتاب الطالب ص 42–43 والإجابة عن السؤالين 15-2 و16-2، والبدء في تمرين 1-2 الفلزات والسبائك في كتاب النشاط ص 29–31.<\/p><div class=\"psub\">الحصة 2: أسباب استخدام السبائك بدل الفلزات النقية<\/div><p>إكمال تمرين 1-2 الفلزات والسبائك في كتاب النشاط ص 29–31، والإجابة عن السؤالين 17-2 و18-2.<\/p><div class=\"psub\">الحصة 3: استخدامات الخارصين والألومنيوم<\/div><p>الإجابة عن السؤال 19-2 والسؤال 4 من أسئلة نهاية الوحدة الثانية، والبحث عن ثلاث أدوات منزلية مصنوعة من الألومنيوم.<\/p>","t":"الحصة 1: مفهوم السبيكة وتمثيل تركيبها\nمراجعة كتاب الطالب ص 42–43 والإجابة عن السؤالين 15-2 و16-2، والبدء في تمرين 1-2 الفلزات والسبائك في كتاب النشاط ص 29–31.\n\nالحصة 2: أسباب استخدام السبائك بدل الفلزات النقية\nإكمال تمرين 1-2 الفلزات والسبائك في كتاب النشاط ص 29–31، والإجابة عن السؤالين 17-2 و18-2.\n\nالحصة 3: استخدامات الخارصين والألومنيوم\nالإجابة عن السؤال 19-2 والسؤال 4 من أسئلة نهاية الوحدة الثانية، والبحث عن ثلاث أدوات منزلية مصنوعة من الألومنيوم."}]}},{"label":"4-2 تآكل الفلزات وحمايتها","unit":"الوحدة الثانية: استخلاص الفلزات واستخداماتها","periods":[{"n":1,"focus":"شروط صدأ الحديد","info":"<div><b>الدرس:<\/b> 4-2 تآكل الفلزات وحمايتها<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 45–49 | كتاب النشاط: ورقة العمل 2-2 ص 34–35<\/div><div><b>دليل المعلم:<\/b> ص 42<\/div><div><b>محور الحصة:<\/b> شروط صدأ الحديد<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد أن صدأ الحديد يحتاج إلى الماء والأكسجين معًا.<\/li><li>يصمم تجربة لاستقصاء شروط الصدأ ويفسر نتائجها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يكتب المعادلة اللفظية لتكوّن الصدأ.<\/div>","t":"1. يحدد أن صدأ الحديد يحتاج إلى الماء والأكسجين معًا.\n2. يصمم تجربة لاستقصاء شروط الصدأ ويفسر نتائجها.\nمخرج تعليمي آخر: يكتب المعادلة اللفظية لتكوّن الصدأ."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد أن صدأ الحديد يحتاج إلى الماء والأكسجين معًا.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصمم تجربة لاستقصاء شروط الصدأ ويفسر نتائجها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يكتب المعادلة اللفظية لتكوّن الصدأ.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يحدد أن صدأ الحديد يحتاج إلى الماء والأكسجين معًا. ← تذكر\n• يصمم تجربة لاستقصاء شروط الصدأ ويفسر نتائجها. ← تحليل\n• يكتب المعادلة اللفظية لتكوّن الصدأ. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: مسامير حديد، أنابيب اختبار، ماء مغلي، زيت، كلوريد الكالسيوم اللامائي، ماء مالح، سدادات<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: مسامير حديد، أنابيب اختبار، ماء مغلي، زيت، كلوريد الكالسيوم اللامائي، ماء مالح، سدادات"},{"h":"<div class=\"pills\"><span>الصدأ<\/span><span>التآكل<\/span><span>أكسيد الحديد III المائي<\/span><span>الأكسجين<\/span><span>الماء<\/span><\/div>","t":"الصدأ، التآكل، أكسيد الحديد III المائي، الأكسجين، الماء"},{"h":"<p>يعرض صورة سفينة صدئة وأخرى مطلية حديثًا ويسأل: ما الذي سبب الصدأ؟<\/p>","t":"يعرض صورة سفينة صدئة وأخرى مطلية حديثًا ويسأل: ما الذي سبب الصدأ؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 3-2 منع الصدأ – إعداد الأنابيب (كتاب الطالب ص 47)<\/td><td>يوجه إلى إعداد أنابيب: ماء وهواء، وماء مغلي تعلوه طبقة زيت، وهواء جاف مع كلوريد الكالسيوم، وماء مالح وهواء.<\/td><td>يعدون الأنابيب ويتوقعون النتائج ويسجلونها في جدول متابعة لعدة أيام.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلة<\/td><td>يكتب: الحديد + الأكسجين + الماء ← أكسيد الحديد III المائي (الصدأ).<\/td><td>يدونون ويحددون الشرطين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 20-2 و21-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يقترحون أسبابًا.\n\n(17 دقيقة) النشاط 3-2 منع الصدأ – إعداد الأنابيب (كتاب الطالب ص 47)\nدور المعلم: يوجه إلى إعداد أنابيب: ماء وهواء، وماء مغلي تعلوه طبقة زيت، وهواء جاف مع كلوريد الكالسيوم، وماء مالح وهواء.\nدور الطالب: يعدون الأنابيب ويتوقعون النتائج ويسجلونها في جدول متابعة لعدة أيام.\n\n(8 دقائق) المعادلة\nدور المعلم: يكتب: الحديد + الأكسجين + الماء ← أكسيد الحديد III المائي (الصدأ).\nدور الطالب: يدونون ويحددون الشرطين.\n\n(5 دقائق) السؤالان 20-2 و21-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الشرطان اللازمان لصدأ الحديد؟<\/td><td>وجود الماء والأكسجين معًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُغلى الماء ويغطى بطبقة زيت في أحد الأنابيب؟<\/td><td>الغليان يطرد الهواء الذائب، والزيت يمنع ذوبانه من جديد، فيبقى الماء بلا أكسجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع: في أي أنبوب يصدأ المسمار أسرع؟ ولماذا؟<\/td><td>في أنبوب الماء المالح مع الهواء؛ لأن الملح يسرّع الصدأ.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الشرطان اللازمان لصدأ الحديد؟\nالإجابة النموذجية: وجود الماء والأكسجين معًا.\n\n2) [المستوى المتوقع] لماذا يُغلى الماء ويغطى بطبقة زيت في أحد الأنابيب؟\nالإجابة النموذجية: الغليان يطرد الهواء الذائب، والزيت يمنع ذوبانه من جديد، فيبقى الماء بلا أكسجين.\n\n3) [المستوى المتقدم] توقع: في أي أنبوب يصدأ المسمار أسرع؟ ولماذا؟\nالإجابة النموذجية: في أنبوب الماء المالح مع الهواء؛ لأن الملح يسرّع الصدأ."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الحديد + الأكسجين + الماء ← .........<\/td><td>أكسيد الحديد III المائي (الصدأ).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة كلوريد الكالسيوم اللامائي في الأنبوب؟<\/td><td>امتصاص بخار الماء لجعل الهواء جافًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تصدأ السيارات في المدن الساحلية أسرع؟<\/td><td>لارتفاع الرطوبة ووجود الأملاح في الهواء التي تسرّع الصدأ.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الحديد + الأكسجين + الماء ← .........\nالإجابة النموذجية: أكسيد الحديد III المائي (الصدأ).\n\n2) [المستوى المتوقع] ما وظيفة كلوريد الكالسيوم اللامائي في الأنبوب؟\nالإجابة النموذجية: امتصاص بخار الماء لجعل الهواء جافًا.\n\n3) [المستوى المتقدم] لماذا تصدأ السيارات في المدن الساحلية أسرع؟\nالإجابة النموذجية: لارتفاع الرطوبة ووجود الأملاح في الهواء التي تسرّع الصدأ."},{"h":"<p>متابعة أنابيب النشاط 3-2 يوميًا وتسجيل الملاحظات، ومراجعة كتاب الطالب ص 45–47 والإجابة عن السؤالين 20-2 و21-2.<\/p>","t":"متابعة أنابيب النشاط 3-2 يوميًا وتسجيل الملاحظات، ومراجعة كتاب الطالب ص 45–47 والإجابة عن السؤالين 20-2 و21-2."}]},{"n":2,"focus":"طرق منع الصدأ والحماية بالتضحية","info":"<div><b>الدرس:<\/b> 4-2 تآكل الفلزات وحمايتها<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 45–49 | كتاب النشاط: ورقة العمل 2-2 ص 34–35<\/div><div><b>دليل المعلم:<\/b> ص 42<\/div><div><b>محور الحصة:<\/b> طرق منع الصدأ والحماية بالتضحية<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف طرق منع الصدأ بالعزل: الطلاء والتشحيم والتغطية بالبلاستيك.<\/li><li>يشرح الجلفنة والحماية بالتضحية في ضوء سلسلة النشاط.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يختار طريقة الحماية الأنسب لأجسام مختلفة ويبرر.<\/div>","t":"1. يصف طرق منع الصدأ بالعزل: الطلاء والتشحيم والتغطية بالبلاستيك.\n2. يشرح الجلفنة والحماية بالتضحية في ضوء سلسلة النشاط.\nمخرج تعليمي آخر: يختار طريقة الحماية الأنسب لأجسام مختلفة ويبرر."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف طرق منع الصدأ بالعزل: الطلاء والتشحيم والتغطية بالبلاستيك.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يشرح الجل ة العمل 2-2 الصدأ (كتاب النشاط ص 34–35)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(6 دقائق) التهيئة: نتائج النشاط\nدور المعلم: يعرض الأنابيب.\nدور الطالب: يفسرون النتائج.\n\n(12 دقيقة) العزل والجلفنة (كتاب الطالب ص 48–49)\nدور المعلم: يشرح منع وصول الماء والأكسجين، ثم الجلفنة: الخارصين يحمي الحديد حتى لو خُدش لأنه أنشط فيتأكسد بدلًا منه.\nدور الطالب: يدونون الطرق ويرسمون مخطط الحماية بالتضحية.\n\n(10 دقائق) الحماية بالتضحية\nدور المعلم: يعرض على السبورة الذكية صورة كتل الماغنيسيوم على هيكل سفينة وأنابيب النفط.\nدور الطالب: يفسرون اختيار فلز أنشط من الحديد.\n\n(7 دقائق) ورقة العمل 2-2 الصدأ (كتاب النشاط ص 34–35)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر طريقتين لمنع الصدأ بالعزل.<\/td><td>الطلاء، أو التشحيم بالزيت، أو التغطية بالبلاستيك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يبقى الحديد المجلفن محميًا حتى لو خُدشت طبقة الخارصين؟<\/td><td>لأن الخارصين أنشط من الحديد فيتأكسد بدلًا منه (حماية بالتضحية).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يصلح النحاس لحماية هيكل سفينة فولاذية بالتضحية؟<\/td><td>لأن النحاس أقل نشاطًا من الحديد، فيتآكل الحديد بدلًا منه.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر طريقتين لمنع الصدأ بالعزل.\nالإجابة النموذجية: الطلاء، أو التشحيم بالزيت، أو التغطية بالبلاستيك.\n\n2) [المستوى المتوقع] لماذا يبقى الحديد المجلفن محميًا حتى لو خُدشت طبقة الخارصين؟\nالإجابة النموذجية: لأن الخارصين أنشط من الحديد فيتأكسد بدلًا منه (حماية بالتضحية).\n\n3) [المستوى المتقدم] لماذا لا يصلح النحاس لحماية هيكل سفينة فولاذية بالتضحية؟\nالإجابة النموذجية: لأن النحاس أقل نشاطًا من الحديد، فيتآكل الحديد بدلًا منه."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تُثبت كتل الماغنيسيوم على السفن لأنه أقل نشاطًا من الحديد.<\/td><td>خطأ؛ لأنه أنشط من الحديد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي طرق الحماية يناسب سلسلة دراجة؟ ولماذا؟<\/td><td>التشحيم بالزيت؛ لأنه يعزل السلسلة ولا يعيق حركتها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يتآكل الألومنيوم بسرعة مع أنه أنشط من الحديد؟<\/td><td>لأن طبقة أكسيد الألومنيوم الرقيقة المتماسكة تحمي الفلز تحتها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تُثبت كتل الماغنيسيوم على السفن لأنه أقل نشاطًا من الحديد.\nالإجابة النموذجية: خطأ؛ لأنه أنشط من الحديد.\n\n2) [المستوى المتوقع] أي طرق الحماية يناسب سلسلة دراجة؟ ولماذا؟\nالإجابة النموذجية: التشحيم بالزيت؛ لأنه يعزل السلسلة ولا يعيق حركتها.\n\n3) [المستوى المتقدم] لماذا لا يتآكل الألومنيوم بسرعة مع أنه أنشط من الحديد؟\nالإجابة النموذجية: لأن طبقة أكسيد الألومنيوم الرقيقة المتماسكة تحمي الفلز تحتها."},{"h":"<p>إكمال ورقة العمل 2-2 الصدأ في كتاب النشاط ص 34–35، والإجابة عن الأسئلة 22-2 إلى 24-2 والسؤال 5 من أسئلة نهاية الوحدة الثانية.<\/p>","t":"إكمال ورقة العمل 2-2 الصدأ في كتاب النشاط ص 34–35، والإجابة عن الأسئلة 22-2 إلى 24-2 والسؤال 5 من أسئلة نهاية الوحدة الثانية."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-2 تآكل الفلزات وحمايتها<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 45–49 | كتاب النشاط: ورقة العمل 2-2 ص 34–35<\/div><div><b>دليل المعلم:<\/b> ص 42<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: شروط صدأ الحديد<\/div><ol class=\"ol\"><li>يحدد أن صدأ الحديد يحتاج إلى الماء والأكسجين معًا.<\/li><li>يصمم تجربة لاستقصاء شروط الصدأ ويفسر نتائجها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يكتب المعادلة اللفظية لتكوّن الصدأ.<
