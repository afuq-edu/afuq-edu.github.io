<tr><td class=\"tm\">8 د<\/td><td class=\"st\">المشبع والنشاط<\/td><td>يعرّف الهيدروكربون المشبع، ويذكر أن الألكانات غير نشطة كيميائيًا بصورة عامة ما عدا الاحتراق.<\/td><td>يفسرون معنى «مشبع».<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">ورقة العمل 1-4 الألكانات (كتاب النشاط ص 67–68)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(8 دقائق) التهيئة: ابنِ وسمِّ\nدور المعلم: يدير اللعبة.\nدور الطالب: يبنون النماذج ويسمونها.\n\n(12 دقيقة) الصيغ البنائية (كتاب الطالب ص 82–84)\nدور المعلم: يوضح على السبورة الذكية رسم الصيغ البنائية للميثان والإيثان والبروبان والبيوتان.\nدور الطالب: يرسمونها ويتحققون من أن لكل كربون أربع روابط.\n\n(8 دقائق) المشبع والنشاط\nدور المعلم: يعرّف الهيدروكربون المشبع، ويذكر أن الألكانات غير نشطة كيميائيًا بصورة عامة ما عدا الاحتراق.\nدور الطالب: يفسرون معنى «مشبع».\n\n(7 دقائق) ورقة العمل 1-4 الألكانات (كتاب النشاط ص 67–68)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الصيغة الجزيئية للبروبان؟<\/td><td>C₃H₈.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُعد الألكانات مشبعة؟<\/td><td>لأن جميع الروابط بين ذرات الكربون أحادية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما المكون الرئيس للغاز الطبيعي؟ وما صيغته؟<\/td><td>الميثان CH₄.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الصيغة الجزيئية للبروبان؟\nالإجابة النموذجية: C₃H₈.\n\n2) [المستوى المتوقع] لماذا تُعد الألكانات مشبعة؟\nالإجابة النموذجية: لأن جميع الروابط بين ذرات الكربون أحادية.\n\n3) [المستوى المتقدم] ما المكون الرئيس للغاز الطبيعي؟ وما صيغته؟\nالإجابة النموذجية: الميثان CH₄."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يحتوي جزيء البيوتان على ......... ذرات كربون و......... ذرات هيدروجين.<\/td><td>4 – 10.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الألكانات نشطة جدًا وتتفاعل مع معظم المواد.<\/td><td>خطأ؛ هي غير نشطة بصورة عامة ما عدا الاحتراق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كم رابطة C–H وكم رابطة C–C في جزيء الإيثان؟<\/td><td>6 روابط C–H ورابطة C–C واحدة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يحتوي جزيء البيوتان على ......... ذرات كربون و......... ذرات هيدروجين.\nالإجابة النموذجية: 4 – 10.\n\n2) [المستوى المتوقع] صواب أم خطأ: الألكانات نشطة جدًا وتتفاعل مع معظم المواد.\nالإجابة النموذجية: خطأ؛ هي غير نشطة بصورة عامة ما عدا الاحتراق.\n\n3) [المستوى المتقدم] كم رابطة C–H وكم رابطة C–C في جزيء الإيثان؟\nالإجابة النموذجية: 6 روابط C–H ورابطة C–C واحدة."},{"h":"<p>إكمال ورقة العمل 1-4 الألكانات في كتاب النشاط ص 67–68، والإجابة عن الأسئلة 5-4 إلى 7-4.<\/p>","t":"إكمال ورقة العمل 1-4 الألكانات في كتاب النشاط ص 67–68، والإجابة عن الأسئلة 5-4 إلى 7-4."}]},{"n":3,"focus":"الاحتراق الكامل للهيدروكربونات","info":"<div><b>الدرس:<\/b> 1-4 الألكانات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 80–85 | كتاب النشاط: تمرين 1-4 ص 58، ورقة العمل 1-4 ص 67–68، ورقة العمل 2-4 ص 69–70<\/div><div><b>دليل المعلم:<\/b> ص 78–79<\/div><div><b>محور الحصة:<\/b> الاحتراق الكامل للهيدروكربونات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الاحتراق الكامل للهيدروكربونات الذي ينتج ثاني أكسيد الكربون والماء.<\/li><li>يكتب معادلات موزونة لاحتراق الألكانات احتراقًا كاملًا.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما.<\/div>","t":"1. يصف الاحتراق الكامل للهيدروكربونات الذي ينتج ثاني أكسيد الكربون والماء.\n2. يكتب معادلات موزونة لاحتراق الألكانات احتراقًا كاملًا.\nمخرج تعليمي آخر: يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الاحتراق الكامل للهيدروكربونات الذي ينتج ثاني أكسيد الكربون والماء.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلات موزونة لاحتراق الألكانات احتراقًا كاملًا.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف الاحتراق الكامل للهيدروكربونات الذي ينتج ثاني أكسيد الكربون والماء. ← فهم\n• يكتب معادلات موزونة لاحتراق الألكانات احتراقًا كاملًا. ← تطبيق\n• يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: شمعة، كأس زجاجية باردة، ماء الجير، كبريتات النحاس اللامائية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: شمعة، كأس زجاجية باردة، ماء الجير، كبريتات النحاس اللامائية"},{"h":"<div class=\"pills\"><span>الاحتراق الكامل<\/span><span>الاحتراق غير الكامل<\/span><span>ثاني أكسيد الكربون<\/span><span>الماء<\/span><span>أول أكسيد الكربون<\/span><\/div>","t":"الاحتراق الكامل، الاحتراق غير الكامل، ثاني أكسيد الكربون، الماء، أول أكسيد الكربون"},{"h":"<p>يقلب المعلم كأسًا باردة فوق شمعة مشتعلة ويسأل: ما القطرات التي تكونت على جدار الكأس؟<\/p>","t":"يقلب المعلم كأسًا باردة فوق شمعة مشتعلة ويسأل: ما القطرات التي تكونت على جدار الكأس؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يتوقعون أنها ماء.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">نواتج الاحتراق<\/td><td>يعرض اختبار CO₂ بماء الجير (يتعكر) واختبار الماء بكبريتات النحاس اللامائية (تزرق).<\/td><td>يسجلون النواتج.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المعادلات (كتاب الطالب ص 84–85)<\/td><td>يكتب على السبورة الذكية: <bdi>CH₄ + 2O₂ → CO₂ + 2H₂O<\/bdi>.<\/td><td>يزنون معادلتي احتراق الإيثان والبروبان.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 2-4 حرق الهيدروكربونات ومسابقة المجموعات<\/td><td>يوجه إلى الورقة ثم يدير جولة من مسابقة المجموعات.<\/td><td>يحلون ويتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يتوقعون أنها ماء.\n\n(10 دقائق) نواتج الاحتراق\nدور المعلم: يعرض اختبار CO₂ بماء الجير (يتعكر) واختبار الماء بكبريتات النحاس اللامائية (تزرق).\nدور الطالب: يسجلون النواتج.\n\n(10 دقائق) المعادلات (كتاب الطالب ص 84–85)\nدور المعلم: يكتب على السبورة الذكية: CH₄ + 2O₂ → CO₂ + 2H₂O.\nدور الطالب: يزنون معادلتي احتراق الإيثان والبروبان.\n\n(10 دقائق) ورقة العمل 2-4 حرق الهيدروكربونات ومسابقة المجموعات\nدور المعلم: يوجه إلى الورقة ثم يدير جولة من مسابقة المجموعات.\nدور الطالب: يحلون ويتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نواتج الاحتراق الكامل للميثان؟<\/td><td>ثاني أكسيد الكربون والماء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>زن المعادلة: <bdi>C₃H₈ + O₂ → CO₂ + H₂O<\/bdi><\/td><td><bdi>C₃H₈ + 5O₂ → 3CO₂ + 4H₂O<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد الاحتراق غير الكامل خطرًا في الأماكن المغلقة؟<\/td><td>لأنه ينتج أول أكسيد الكربون السام عديم اللون والرائحة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما نواتج الاحتراق الكامل للميثان؟\nالإجابة النموذجية: ثاني أكسيد الكربون والماء.\n\n2) [المستوى المتوقع] زن المعادلة: C₃H₈ + O₂ → CO₂ + H₂O\nالإجابة النموذجية: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O\n\n3) [المستوى المتقدم] لماذا يُعد الاحتراق غير الكامل خطرًا في الأماكن المغلقة؟\nالإجابة النموذجية: لأنه ينتج أول أكسيد الكربون السام عديم اللون والرائحة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الاختبار الذي يكشف ثاني أكسيد الكربون؟<\/td><td>ماء الجير؛ يتعكر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يحتاج الاحتراق الكامل إلى كمية كافية من الأكسجين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زن معادلة احتراق الإيثان: <bdi>C₂H₆ + O₂ → CO₂ + H₂O<\/bdi><\/td><td><bdi>2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O<\/bdi><\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الاختبار الذي يكشف ثاني أكسيد الكربون؟\nالإجابة النموذجية: ماء الجير؛ يتعكر.\n\n2) [المستوى المتوقع] صواب أم خطأ: يحتاج الاحتراق الكامل إلى كمية كافية من الأكسجين.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] زن معادلة احتراق الإيثان: C₂H₆ + O₂ → CO₂ + H₂O\nالإجابة النموذجية: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O"},{"h":"<p>إكمال ورقة العمل 2-4 حرق الهيدروكربونات في كتاب النشاط ص 69–70، والإجابة عن الأسئلة 8-4 إلى 10-4 والسؤالين 1 و2 من أسئلة نهاية الوحدة الرابعة.<\/p>","t":"إكمال ورقة العمل 2-4 حرق الهيدروكربونات في كتاب النشاط ص 69–70، والإجابة عن الأسئلة 8-4 إلى 10-4 والسؤالين 1 و2 من أسئلة نهاية الوحدة الرابعة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-4 الألكانات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 80–85 | كتاب النشاط: تمرين 1-4 ص 58، ورقة العمل 1-4 ص 67–68، ورقة العمل 2-4 ص 69–70<\/div><div><b>دليل المعلم:<\/b> ص 78–79<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><ol class=\"ol\"><li>يصف السلاسل المتجانسة بأنها عائلات من المركبات لها الصيغة العامة نفسها وخصائص كيميائية متشابهة.<\/li><li>يذكر نوع المركب من نهاية اسمه (-ان، -ين، -ول).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج الصيغة العامة للألكانات CₙH₂ₙ₊₂ من أمثلة.<\/div><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><ol class=\"ol\"><li>يسمي الألكانات غير المتفرعة حتى أربع ذرات كربون ويرسمها.<\/li><li>يصف الألكانات بأنها هيدروكربونات مشبعة تحتوي على روابط تساهمية أحادية فقط.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يذكر أن الميثان هو المكون الرئيس للغاز الطبيعي.<\/div><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><ol class=\"ol\"><li>يصف الاحتراق الكامل للهيدروكربونات الذي ينتج ثاني أكسيد الكربون والماء.<\/li><li>يكتب معادلات موزونة لاحتراق الألكانات احتراقًا كاملًا.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما.<\/div>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\n1. يصف السلاسل المتجانسة بأنها عائلات من المركبات لها الصيغة العامة نفسها وخصائص كيميائية متشابهة.\n2. يذكر نوع المركب من نهاية اسمه (-ان، -ين، -ول).\nمخرج تعليمي آخر: يستنتج الصيغة العامة للألكانات CₙH₂ₙ₊₂ من أمثلة.\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\n1. يسمي الألكانات غير المتفرعة حتى أربع ذرات كربون ويرسمها.\n2. يصف الألكانات بأنها هيدروكربونات مشبعة تحتوي على روابط تساهمية أحادية فقط.\nمخرج تعليمي آخر: يذكر أن الميثان هو المكون الرئيس للغاز الطبيعي.\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\n1. يصف الاحتراق الكامل للهيدروكربونات الذي ينتج ثاني أكسيد الكربون والماء.\n2. يكتب معادلات موزونة لاحتراق الألكانات احتراقًا كاملًا.\nمخرج تعليمي آخر: يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما."},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف السلاسل المتجا . ← تطبيق\n• يقارن بين الاحتراق الكامل وغير الكامل ونواتجهما. ← تحليل"},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم الذاتي<\/span><span>التعلم المبني على اللعب<\/span><\/div><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\n• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\n• التعلم بالنمذجة\n• التعلم الذاتي\n• التعلم المبني على اللعب\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><\/div><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>الأقلام<\/span><\/div><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: شمعة، كأس زجاجية باردة، ماء الجير، كبريتات النحاس اللامائية<\/span><\/div>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\n• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\n• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• الأقلام\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: شمعة، كأس زجاجية باردة، ماء الجير، كبريتات النحاس اللامائية"},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><div class=\"pills\"><span>الهيدروكربون<\/span><span>السلسلة المتجانسة<\/span><span>الصيغة العامة<\/span><span>الألكانات<\/span><\/div><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><div class=\"pills\"><span>الميثان<\/span><span>الإيثان<\/span><span>البروبان<\/span><span>البيوتان<\/span><span>الهيدروكربون المشبع<\/span><span>الرابطة الأحادية<\/span><span>الغاز الطبيعي<\/span><\/div><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><div class=\"pills\"><span>الاحتراق الكامل<\/span><span>الاحتراق غير الكامل<\/span><span>ثاني أكسيد الكربون<\/span><span>الماء<\/span><span>أول أكسيد الكربون<\/span><\/div>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\nالهيدروكربون، السلسلة المتجانسة، الصيغة العامة، الألكانات\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\nالميثان، الإيثان، البروبان، البيوتان، الهيدروكربون المشبع، الرابطة الأحادية، الغاز الطبيعي\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\nالاحتراق الكامل، الاحتراق غير الكامل، ثاني أكسيد الكربون، الماء، أول أكسيد الكربون"},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><p>سؤال: ما المشترك بين غاز الطبخ والبنزين وشمع الشموع؟<\/p><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><p>لعبة «ابنِ وسمِّ»: يرفع المعلم بطاقة صيغة جزيئية، والمجموعة الأسرع تبني النموذج وتسميه.<\/p><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><p>يقلب المعلم كأسًا باردة فوق شمعة مشتعلة ويسأل: ما القطرات التي تكونت على جدار الكأس؟<\/p>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\nسؤال: ما المشترك بين غاز الطبخ والبنزين وشمع الشموع؟\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\nلعبة «ابنِ وسمِّ»: يرفع المعلم بطاقة صيغة جزيئية، والمجموعة الأسرع تبني النموذج وتسميه.\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\nيقلب المعلم كأسًا باردة فوق شمعة مشتعلة ويسأل: ما القطرات التي تكونت على جدار الكأس؟"},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الهيدروكربونات (كتاب الطالب ص 80–81)<\/td><td>يعرّف الهيدروكربون: مركب من الكربون والهيدروجين فقط، ويوضح قدرة الكربون على تكوين أربع روابط وسلاسل.<\/td><td>يصنفون مركبات معطاة إلى هيدروكربونات وغير هيدروكربونات.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">بناء النماذج<\/td><td>يوجه إلى بناء نماذج الميثان والإيثان والبروبان والبيوتان بالكرات والعصي.<\/td><td>يرسمون الصيغ البنائية ويستنتجون الصيغة العامة CₙH₂ₙ₊₂.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تسمية العائلات<\/td><td>يوضح نهايات الأسماء: -ان للألكانات، -ين للألكينات، -ول للكحولات.<\/td><td>يصنفون أسماء معطاة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التهيئة: ابنِ وسمِّ<\/td><td>يدير اللعبة.<\/td><td>يبنون النماذج ويسمونها.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الصيغ البنائية (كتاب الطالب ص 82–84)<\/td><td>يوضح على السبورة الذكية رسم الصيغ البنائية للميثان والإيثان والبروبان والبيوتان.<\/td><td>يرسمونها ويتحققون من أن لكل كربون أربع روابط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المشبع والنشاط<\/td><td>يعرّف الهيدروكربون المشبع، ويذكر أن الألكانات غير نشطة كيميائيًا بصورة عامة ما عدا الاحتراق.<\/td><td>يفسرون معنى «مشبع».<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">ورقة العمل 1-4 الألكانات (كتاب النشاط ص 67–68)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يتوقعون أنها ماء.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">نواتج الاحتراق<\/td><td>يعرض اختبار CO₂ بماء الجير (يتعكر) واختبار الماء بكبريتات النحاس اللامائية (تزرق).<\/td><td>يسجلون النواتج.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المعادلات (كتاب الطالب ص 84–85)<\/td><td>يكتب على السبورة الذكية: <bdi>CH₄ + 2O₂ → CO₂ + 2H₂O<\/bdi>.<\/td><td>يزنون معادلتي احتراق الإيثان والبروبان.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 2-4 حرق الهيدروكربونات ومسابقة المجموعات<\/td><td>يوجه إلى الورقة ثم يدير جولة من مسابقة المجموعات.<\/td><td>يحلون ويتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الهيدروكربونات (كتاب الطالب ص 80–81)\nدور المعلم: يعرّف الهيدروكربون: مركب من الكربون والهيدروجين فقط، ويوضح قدرة الكربون على تكوين أربع روابط وسلاسل.\nدور الطالب: يصنفون مركبات معطاة إلى هيدروكربونات وغير هيدروكربونات.\n\n(15 دقيقة) بناء النماذج\nدور المعلم: يوجه إلى بناء نماذج الميثان والإيثان والبروبان والبيوتان بالكرات والعصي.\nدور الطالب: يرسمون الصيغ البنائية ويستنتجون الصيغة العامة CₙH₂ₙ₊₂.\n\n(5 دقائق) تسمية العائلات\nدور المعلم: يوضح نهايات الأسماء: -ان للألكانات، -ين للألكينات، -ول للكحولات.\nدور الطالب: يصنفون أسماء معطاة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\n(8 دقائق) التهيئة: ابنِ وسمِّ\nدور المعلم: يدير اللعبة.\nدور الطالب: يبنون النماذج ويسمونها.\n\n(12 دقيقة) الصيغ البنائية (كتاب الطالب ص 82–84)\nدور المعلم: يوضح على السبورة الذكية رسم الصيغ البنائية للميثان والإيثان والبروبان والبيوتان.\nدور الطالب: يرسمونها ويتحققون من أن لكل كربون أربع روابط.\n\n(8 دقائق) المشبع والنشاط\nدور المعلم: يعرّف الهيدروكربون المشبع، ويذكر أن الألكانات غير نشطة كيميائيًا بصورة عامة ما عدا الاحتراق.\nدور الطالب: يفسرون معنى «مشبع».\n\n(7 دقائق) ورقة العمل 1-4 الألكانات (كتاب النشاط ص 67–68)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\n(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يتوقعون أنها ماء.\n\n(10 دقائق) نواتج الاحتراق\nدور المعلم: يعرض اختبار CO₂ بماء الجير (يتعكر) واختبار الماء بكبريتات النحاس اللامائية (تزرق).\nدور الطالب: يسجلون النواتج.\n\n(10 دقائق) المعادلات (كتاب الطالب ص 84–85)\nدور المعلم: يكتب على السبورة الذكية: CH₄ + 2O₂ → CO₂ + 2H₂O.\nدور الطالب: يزنون معادلتي احتراق الإيثان والبروبان.\n\n(10 دقائق) ورقة العمل 2-4 حرق الهيدروكربونات ومسابقة المجموعات\nدور المعلم: يوجه إلى الورقة ثم يدير جولة من مسابقة المجموعات.\nدور الطالب: يحلون ويتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الهيدروكربون؟<\/td><td>مركب يتكون من الكربون والهيدروجين فقط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>إلى أي عائلة ينتمي البروبان؟ وكيف عرفت؟<\/td><td>الألكانات؛ لأن اسمه ينتهي بـ (-ان).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>استخدم الصيغة العامة لتكتب صيغة ألكان فيه 5 ذرات كربون.<\/td><td>C₅H₁₂.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الصيغة الجزيئية للبروبان؟<\/td><td>C₃H₈.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُعد الألكانات مشبعة؟<\/td><td>لأن جميع الروابط بين ذرات الكربون أحادية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما المكون الرئيس للغاز الطبيعي؟ وما صيغته؟<\/td><td>الميثان CH₄.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نواتج الاحتراق الكامل للميثان؟<\/td><td>ثاني أكسيد الكربون والماء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>زن المعادلة: <bdi>C₃H₈ + O₂ → CO₂ + H₂O<\/bdi><\/td><td><bdi>C₃H₈ + 5O₂ → 3CO₂ + 4H₂O<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد الاحتراق غير الكامل خطرًا في الأماكن المغلقة؟<\/td><td>لأنه ينتج أول أكسيد الكربون السام عديم اللون والرائحة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\n1) [مستوى الدعم] ما الهيدروكربون؟\nالإجابة النموذجية: مركب يتكون من الكربون والهيدروجين فقط.\n\n2) [المستوى المتوقع] إلى أي عائلة ينتمي البروبان؟ وكيف عرفت؟\nالإجابة النموذجية: الألكانات؛ لأن اسمه ينتهي بـ (-ان).\n\n3) [المستوى المتقدم] استخدم الصيغة العامة لتكتب صيغة ألكان فيه 5 ذرات كربون.\nالإجابة النموذجية: C₅H₁₂.\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\n1) [مستوى الدعم] ما الصيغة الجزيئية للبروبان؟\nالإجابة النموذجية: C₃H₈.\n\n2) [المستوى المتوقع] لماذا تُعد الألكانات مشبعة؟\nالإجابة النموذجية: لأن جميع الروابط بين ذرات الكربون أحادية.\n\n3) [المستوى المتقدم] ما المكون الرئيس للغاز الطبيعي؟ وما صيغته؟\nالإجابة النموذجية: الميثان CH₄.\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\n1) [مستوى الدعم] ما نواتج الاحتراق الكامل للميثان؟\nالإجابة النموذجية: ثاني أكسيد الكربون والماء.\n\n2) [المستوى المتوقع] زن المعادلة: C₃H₈ + O₂ → CO₂ + H₂O\nالإجابة النموذجية: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O\n\n3) [المستوى المتقدم] لماذا يُعد الاحتراق غير الكامل خطرًا في الأماكن المغلقة؟\nالإجابة النموذجية: لأنه ينتج أول أكسيد الكربون السام عديم اللون والرائحة."},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الصيغة العامة للألكانات .........<\/td><td>CₙH₂ₙ₊₂.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر خاصيتين مشتركتين لأفراد السلسلة المتجانسة.<\/td><td>الصيغة العامة نفسها، وخصائص كيميائية متشابهة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صنّف: الإيثانول، الإيثين، الإيثان، وحدد ما يدل على العائلة في كل اسم.<\/td><td>الإيثانول كحول (-ول)، والإيثين ألكين (-ين)، والإيثان ألكان (-ان).<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يحتوي جزيء البيوتان على ......... ذرات كربون و......... ذرات هيدروجين.<\/td><td>4 – 10.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الألكانات نشطة جدًا وتتفاعل مع معظم المواد.<\/td><td>خطأ؛ هي غير نشطة بصورة عامة ما عدا الاحتراق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كم رابطة C–H وكم رابطة C–C في جزيء الإيثان؟<\/td><td>6 روابط C–H ورابطة C–C واحدة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الاختبار الذي يكشف ثاني أكسيد الكربون؟<\/td><td>ماء الجير؛ يتعكر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يحتاج الاحتراق الكامل إلى كمية كافية من الأكسجين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زن معادلة احتراق الإيثان: <bdi>C₂H₆ + O₂ → CO₂ + H₂O<\/bdi><\/td><td><bdi>2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O<\/bdi><\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\n1) [مستوى الدعم] أكمل: الصيغة العامة للألكانات .........\nالإجابة النموذجية: CₙH₂ₙ₊₂.\n\n2) [المستوى المتوقع] اذكر خاصيتين مشتركتين لأفراد السلسلة المتجانسة.\nالإجابة النموذجية: الصيغة العامة نفسها، وخصائص كيميائية متشابهة.\n\n3) [المستوى المتقدم] صنّف: الإيثانول، الإيثين، الإيثان، وحدد ما يدل على العائلة في كل اسم.\nالإجابة النموذجية: الإيثانول كحول (-ول)، والإيثين ألكين (-ين)، والإيثان ألكان (-ان).\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\n1) [مستوى الدعم] أكمل: يحتوي جزيء البيوتان على ......... ذرات كربون و......... ذرات هيدروجين.\nالإجابة النموذجية: 4 – 10.\n\n2) [المستوى المتوقع] صواب أم خطأ: الألكانات نشطة جدًا وتتفاعل مع معظم المواد.\nالإجابة النموذجية: خطأ؛ هي غير نشطة بصورة عامة ما عدا الاحتراق.\n\n3) [المستوى المتقدم] كم رابطة C–H وكم رابطة C–C في جزيء الإيثان؟\nالإجابة النموذجية: 6 روابط C–H ورابطة C–C واحدة.\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\n1) [مستوى الدعم] ما الاختبار الذي يكشف ثاني أكسيد الكربون؟\nالإجابة النموذجية: ماء الجير؛ يتعكر.\n\n2) [المستوى المتوقع] صواب أم خطأ: يحتاج الاحتراق الكامل إلى كمية كافية من الأكسجين.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] زن معادلة احتراق الإيثان: C₂H₆ + O₂ → CO₂ + H₂O\nالإجابة النموذجية: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O"},{"h":"<div class=\"psub\">الحصة 1: الهيدروكربونات والسلاسل المتجانسة<\/div><p>مراجعة كتاب الطالب ص 80–82 والإجابة عن الأسئلة 1-4 إلى 4-4، وحل تمرين 1-4 عائلات الهيدروكربونات في كتاب النشاط ص 58.<\/p><div class=\"psub\">الحصة 2: تسمية الألكانات ورسمها وخصائصها<\/div><p>إكمال ورقة العمل 1-4 الألكانات في كتاب النشاط ص 67–68، والإجابة عن الأسئلة 5-4 إلى 7-4.<\/p><div class=\"psub\">الحصة 3: الاحتراق الكامل للهيدروكربونات<\/div><p>إكمال ورقة العمل 2-4 حرق الهيدروكربونات في كتاب النشاط ص 69–70، والإجابة عن الأسئلة 8-4 إلى 10-4 والسؤالين 1 و2 من أسئلة نهاية الوحدة الرابعة.<\/p>","t":"الحصة 1: الهيدروكربونات والسلاسل المتجانسة\nمراجعة كتاب الطالب ص 80–82 والإجابة عن الأسئلة 1-4 إلى 4-4، وحل تمرين 1-4 عائلات الهيدروكربونات في كتاب النشاط ص 58.\n\nالحصة 2: تسمية الألكانات ورسمها وخصائصها\nإكمال ورقة العمل 1-4 الألكانات في كتاب النشاط ص 67–68، والإجابة عن الأسئلة 5-4 إلى 7-4.\n\nالحصة 3: الاحتراق الكامل للهيدروكربونات\nإكمال ورقة العمل 2-4 حرق الهيدروكربونات في كتاب النشاط ص 69–70، والإجابة عن الأسئلة 8-4 إلى 10-4 والسؤالين 1 و2 من أسئلة نهاية الوحدة الرابعة."}]}},{"label":"2-4 الألكينات","unit":"الوحدة الرابعة: مدخل إلى الكيمياء العضوية","periods":[{"n":1,"focus":"تركيب الألكينات وتسميتها","info":"<div><b>الدرس:<\/b> 2-4 الألكينات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 86–89 | كتاب النشاط: تمرين 2-4 ص 59–60، تمرين 3-4 ص 61–62<\/div><div><b>دليل المعلم:<\/b> ص 80<\/div><div><b>محور الحصة:<\/b> تركيب الألكينات وتسميتها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الألكينات بأنها هيدروكربونات غير مشبعة تحتوي على رابطة تساهمية ثنائية واحدة على الأقل بين ذرتي كربون.<\/li><li>يسمي الألكينات غير المتفرعة حتى أربع ذرات كربون ويرسمها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج الصيغة العامة للألكينات CₙH₂ₙ.<\/div>","t":"1. يصف الألكينات بأنها هيدروكربونات غير مشبعة تحتوي على رابطة تساهمية ثنائية واحدة على الأقل بين ذرتي كربون.\n2. يسمي الألكينات غير المتفرعة حتى أربع ذرات كربون ويرسمها.\nمخرج تعليمي آخر: يستنتج الصيغة العامة للألكينات CₙH₂ₙ."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الألكينات بأنها هيدروكربونات غير مشبعة تحتوي على رابطة تساهمية ثنائية واحدة على الأقل بين ذرتي كربون.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يسمي الألكينات غير المتفرعة حتى أربع ذرات كربون ويرسمها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يستنتج الصيغة العامة للألكينات CₙH₂ₙ.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف الألكينات بأنها هيدروكربونات غير مشبعة تحتوي على رابطة تساهمية ثنائية واحدة على الأقل بين ذرتي كربون. ← فهم\n• يسمي الألكينات غير المتفرعة حتى أربع ذرات كربون ويرسمها. ← تطبيق\n• يستنتج الصيغة العامة للألكينات CₙH₂ₙ. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم بالاكتشاف<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• الأقلام"},{"h":"<div class=\"pills\"><span>الألكينات<\/span><span>الرابطة الثنائية<\/span><span>غير المشبع<\/span><span>الإيثين<\/span><span>البروبين<\/span><span>البيوتين<\/span><\/div>","t":"الألكينات، الرابطة الثنائية، غير المشبع، الإيثين، البروبين، البيوتين"},{"h":"<p>يعرض نموذج الإيثان ثم ينزع ذرتي هيدروجين ويسأل: كيف تحافظ ذرتا الكربون على أربع روابط لكل منهما؟<\/p>","t":"يعرض نموذج الإيثان ثم ينزع ذرتي هيدروجين ويسأل: كيف تحافظ ذرتا الكربون على أربع روابط لكل منهما؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض النموذج.<\/td><td>يقترحون الرابطة الثنائية.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الرابطة الثنائية (كتاب الطالب ص 86–87)<\/td><td>يبني نموذج الإيثين ويوضح الرابطة <bdi>C=C<\/bdi>.<\/td><td>يرسمون الصيغة البنائية للإيثين.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">بناء البروبين والبيوتين<\/td><td>يوجه إلى البناء والرسم.<\/td><td>يستنتجون الصيغة العامة CₙH₂ₙ.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 2-4 هيدروكربونات غير مشبعة (كتاب النشاط ص 59–60)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض النموذج.\nدور الطالب: يقترحون الرابطة الثنائية.\n\n(12 دقيقة) الرابطة الثنائية (كتاب الطالب ص 86–87)\nدور المعلم: يبني نموذج الإيثين ويوضح الرابطة C=C.\nدور الطالب: يرسمون الصيغة البنائية للإيثين.\n\n(10 دقائق) بناء البروبين والبيوتين\nدور المعلم: يوجه إلى البناء والرسم.\nدور الطالب: يستنتجون الصيغة العامة CₙH₂ₙ.\n\n(8 دقائق) تمرين 2-4 هيدروكربونات غير مشبعة (كتاب النشاط ص 59–60)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الذي يميز الألكينات عن الألكانات تركيبيًا؟<\/td><td>وجود رابطة ثنائية واحدة على الأقل بين ذرتي كربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب الصيغة الجزيئية للبروبين.<\/td><td>C₃H₆.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يوجد ألكين يحتوي على ذرة كربون واحدة؟<\/td><td>لأن الرابطة الثنائية تحتاج إلى ذرتي كربون على الأقل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الذي يميز الألكينات عن الألكانات تركيبيًا؟\nالإجابة النموذجية: وجود رابطة ثنائية واحدة على الأقل بين ذرتي كربون.\n\n2) [المستوى المتوقع] اكتب الصيغة الجزيئية للبروبين.\nالإجابة النموذجية: C₃H₆.\n\n3) [المستوى المتقدم] لماذا لا يوجد ألكين يحتوي على ذرة كربون واحدة؟\nالإجابة النموذجية: لأن الرابطة الثنائية تحتاج إلى ذرتي كربون على الأقل."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الصيغة العامة للألكينات .........<\/td><td>CₙH₂ₙ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل الإيثين مشبع أم غير مشبع؟ ولماذا؟<\/td><td>غير مشبع؛ لاحتوائه على رابطة ثنائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>هيدروكربون غير حلقي صيغته C₄H₈. إلى أي عائلة ينتمي؟ وكم رابطة ثنائية فيه؟<\/td><td>الألكينات (البيوتين)؛ وفيه رابطة ثنائية واحدة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الصيغة العامة للألكينات .........\nالإجابة النموذجية: CₙH₂ₙ.\n\n2) [المستوى المتوقع] هل الإيثين مشبع أم غير مشبع؟ ولماذا؟\nالإجابة النموذجية: غير مشبع؛ لاحتوائه على رابطة ثنائية.\n\n3) [المستوى المتقدم] هيدروكربون غير حلقي صيغته C₄H₈. إلى أي عائلة ينتمي؟ وكم رابطة ثنائية فيه؟\nالإجابة النموذجية: الألكينات (البيوتين)؛ وفيه رابطة ثنائية واحدة."},{"h":"<p>مراجعة كتاب الطالب ص 86–87 والإجابة عن الأسئلة 11-4 إلى 14-4، وحل تمرين 2-4 في كتاب النشاط ص 59–60.<\/p>","t":"مراجعة كتاب الطالب ص 86–87 والإجابة عن الأسئلة 11-4 إلى 14-4، وحل تمرين 2-4 في كتاب النشاط ص 59–60."}]},{"n":2,"focus":"التمييز بين المشبع وغير المشبع بماء البروم","info":"<div><b>الدرس:<\/b> 2-4 الألكينات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 86–89 | كتاب النشاط: تمرين 2-4 ص 59–60، تمرين 3-4 ص 61–62<\/div><div><b>دليل المعلم:<\/b> ص 80<\/div><div><b>محور الحصة:<\/b> التمييز بين المشبع وغير المشبع بماء البروم<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يميز الهيدروكربونات المشبعة من غير المشبعة بتفاعلها مع محلول البروم.<\/li><li>يصف تفاعل إضافة البروم إلى الإيثين.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يكتب معادلة تفاعل الإيثين مع البروم.<\/div>","t":"1. يميز الهيدروكربونات المشبعة من غير المشبعة بتفاعلها مع محلول البروم.\n2. يصف تفاعل إضافة البروم إلى الإيثين.\nمخرج تعليمي آخر: يكتب معادلة تفاعل الإيثين مع البروم."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يميز الهيدروكربونات المشبعة من غير المشبعة بتفاعلها مع محلول البروم.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصف تفاعل إضافة البروم إلى الإيثين.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلة تفاعل الإيثين مع البروم.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يميز الهيدروكربونات المشبعة من غير المشبعة بتفاعلها مع محلول البروم. ← تطبيق\n• يصف تفاعل إضافة البروم إلى الإيثين. ← فهم\n• يكتب معادلة تفاعل الإيثين مع البروم. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: ماء البروم المخفف، أنابيب اختبار، عينتا هكسان وهكسين أو مقطع مرئي، قفازات ونظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: ماء البروم المخفف، أنابيب اختبار، عينتا هكسان وهكسين أو مقطع مرئي، قفازات ونظارات واقية"},{"h":"<div class=\"pills\"><span>تفاعل الإضافة<\/span><span>ماء البروم<\/span><span>إزالة اللون<\/span><span>الهيدروكربون غير المشبع<\/span><\/div>","t":"تفاعل الإضافة، ماء البروم، إزالة اللون، الهيدروكربون غير المشبع"},{"h":"<p>يعرض أنبوبين فيهما ماء بروم برتقالي ويسأل: كيف يمكن لهذا المحلول أن يكشف الرابطة الثنائية؟<\/p>","t":"يعرض أنبوبين فيهما ماء بروم برتقالي ويسأل: كيف يمكن لهذا المحلول أن يكشف الرابطة الثنائية؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الأنبوبين.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-4 اختبار تحديد الهيدروكربونات غير المشبعة (كتاب الطالب)<\/td><td>يوجه إلى إضافة قطرات من ماء البروم إلى الألكان وإلى الألكين ورج الأنبوبين في خزانة الغازات، أو يعرض مقطعًا مرئيًا.<\/td><td>يلاحظون زوال اللون البرتقالي مع الألكين وبقاءه مع الألكان.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تفسير الإضافة<\/td><td>يكتب على السبورة الذكية: <bdi>C₂H₄ + Br₂ → C₂H₄Br₂<\/bdi>، ويوضح إضافة ذرتي البروم عند الرابطة الثنائية.<\/td><td>يرسمون ناتج الإضافة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 3-4 (البدء – كتاب النشاط ص 61)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الأنبوبين.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 1-4 اختبار تحديد الهيدروكربونات غير المشبعة (كتاب الطالب)\nدور المعلم: يوجه إلى إضافة قطرات من ماء البروم إلى الألكان وإلى الألكين ورج الأنبوبين في خزانة الغازات، أو يعرض مقطعًا مرئيًا.\nدور الطالب: يلاحظون زوال اللون البرتقالي مع الألكين وبقاءه مع الألكان.\n\n(10 دقائق) تفسير الإضافة\nدور المعلم: يكتب على السبورة الذكية: C₂H₄ + Br₂ → C₂H₄Br₂، ويوضح إضافة ذرتي البروم عند الرابطة الثنائية.\nدور الطالب: يرسمون ناتج الإضافة.\n\n(5 دقائق) تمرين 3-4 (البدء – كتاب النشاط ص 61)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما لون ماء البروم؟ وماذا يحدث له مع الألكين؟<\/td><td>برتقالي، ويزول لونه مع الألكين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا يزول لون ماء البروم مع الألكان؟<\/td><td>لأن الألكان مشبع لا يحتوي على رابطة ثنائية تحدث عندها الإضافة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اكتب معادلة تفاعل الإيثين مع البروم وسمِّ نوع التفاعل.<\/td><td><bdi>C₂H₄ + Br₂ → C₂H₄Br₂<\/bdi>؛ تفاعل إضافة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما لون ماء البروم؟ وماذا يحدث له مع الألكين؟\nالإجابة النموذجية: برتقالي، ويزول لونه مع الألكين.\n\n2) [المستوى المتوقع] لماذا لا يزول لون ماء البروم مع الألكان؟\nالإجابة النموذجية: لأن الألكان مشبع لا يحتوي على رابطة ثنائية تحدث عندها الإضافة.\n\n3) [المستوى المتقدم] اكتب معادلة تفاعل الإيثين مع البروم وسمِّ نوع التفاعل.\nالإجابة النموذجية: C₂H₄ + Br₂ → C₂H₄Br₂؛ تفاعل إضافة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يُستخدم ماء البروم للتمييز بين الإيثان والإيثين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نوع التفاعل بين الألكين والبروم؟<\/td><td>تفاعل إضافة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مادتان A وB صيغتاهما C₆H₁₂ وC₆H₁₄. توقع أيهما يزيل لون ماء البروم وبرر.<\/td><td>A؛ لأن صيغتها تطابق CₙH₂ₙ فهي ألكين غير مشبع، أما B فألكان مشبع.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يُستخدم ماء البروم للتمييز بين الإيثان والإيثين.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما نوع التفاعل بين الألكين والبروم؟\nالإجابة النموذجية: تفاعل إضافة.\n\n3) [المستوى المتقدم] مادتان A وB صيغتاهما C₆H₁₂ وC₆H₁₄. توقع أيهما يزيل لون ماء البروم وبرر.\nالإجابة النموذجية: A؛ لأن صيغتها تطابق CₙH₂ₙ فهي ألكين غير مشبع، أما B فألكان مشبع."},{"h":"<p>مراجعة كتاب الطالب ص 87–88 والإجابة عن السؤالين 15-4 و16-4، والبدء في تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62.<\/p>","t":"مراجعة كتاب الطالب ص 87–88 والإجابة عن السؤالين 15-4 و16-4، والبدء في تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62."}]},{"n":3,"focus":"إضافة الهيدروجين وبخار الماء إلى الألكينات","info":"<div><b>الدرس:<\/b> 2-4 الألكينات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 86–89 | كتاب النشاط: تمرين 2-4 ص 59–60، تمرين 3-4 ص 61–62<\/div><div><b>دليل المعلم:<\/b> ص 80<\/div><div><b>محور الحصة:<\/b> إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف تفاعل الإيثين مع الهيدروجين لإنتاج الإيثان، ومع بخار الماء لإنتاج الإيثانول.<\/li><li>يسمي الإيثانول ويرسمه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين تفاعلات الإضافة الثلاثة من حيث المادة المضافة والناتج.<\/div>","t":"1. يصف تفاعل الإيثين مع الهيدروجين لإنتاج الإيثان، ومع بخار الماء لإنتاج الإيثانول.\n2. يسمي الإيثانول ويرسمه.\nمخرج تعليمي آخر: يقارن بين تفاعلات الإضافة الثلاثة من حيث المادة المضافة والناتج."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تفاعل الإيثين مع الهيدروجين لإنتاج الإيثان، ومع بخار الماء لإنتاج الإيثانول.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يسمي الإيثانول ويرسمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن بين تفاعلات الإضافة الثلاثة من حيث المادة المضافة والناتج.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف تفاعل الإيثين مع الهيدروجين لإنتاج الإيثان، ومع بخار الماء لإنتاج الإيثانول. ← فهم\n• يسمي الإيثانول ويرسمه. ← تطبيق\n• يقارن بين تفاعلات الإضافة الثلاثة من حيث المادة المضافة والناتج. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>نماذج مجسمة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• نماذج مجسمة"},{"h":"<div class=\"pills\"><span>الهدرجة<\/span><span>الإيثانول<\/span><span>بخار الماء<\/span><span>العامل الحفاز<\/span><span>تفاعل الإضافة<\/span><\/div>","t":"الهدرجة، الإيثانول، بخار الماء، العامل الحفاز، تفاعل الإضافة"},{"h":"<p>سؤال: كيف تتحول الزيوت النباتية السائلة إلى سمن صلب؟ (الربط بإضافة الهيدروجين)<\/p>","t":"سؤال: كيف تتحول الزيوت النباتية السائلة إلى سمن صلب؟ (الربط بإضافة الهيدروجين)"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">إضافة الهيدروجين وبخار الماء (كتاب الطالب ص 88–89)<\/td><td>يكتب على السبورة الذكية: <bdi>C₂H₄ + H₂ → C₂H₆<\/bdi> بوجود النيكل عاملًا حفازًا، و <bdi>C₂H₄ + H₂O → C₂H₅OH<\/bdi> بالحرارة والضغط وعامل حفاز.<\/td><td>يبنون نموذج الإيثانول ويرسمونه.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">جدول المقارنة<\/td><td>يوجه إلى مقارنة التفاعلات الثلاثة.<\/td><td>يكملون جدولًا: المادة المضافة، والناتج، والظروف.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم وإكمال تمرين 3-4<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) إضافة الهيدروجين وبخار الماء (كتاب الطالب ص 88–89)\nدور المعلم: يكتب على السبورة الذكية: C₂H₄ + H₂ → C₂H₆ بوجود النيكل عاملًا حفازًا، و C₂H₄ + H₂O → C₂H₅OH بالحرارة والضغط وعامل حفاز.\nدور الطالب: يبنون نموذج الإيثانول ويرسمونه.\n\n(10 دقائق) جدول المقارنة\nدور المعلم: يوجه إلى مقارنة التفاعلات الثلاثة.\nدور الطالب: يكملون جدولًا: المادة المضافة، والناتج، والظروف.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم وإكمال تمرين 3-4\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما ناتج إضافة الهيدروجين إلى الإيثين؟<\/td><td>الإيثان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة إنتاج الإيثانول من الإيثين.<\/td><td><bdi>C₂H₄ + H₂O → C₂H₅OH<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُسمى تفاعلات الألكينات مع H₂ وBr₂ وH₂O تفاعلات إضافة؟<\/td><td>لأن جزيئين يتحدان لتكوين ناتج واحد عند الرابطة الثنائية دون نواتج أخرى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما ناتج إضافة الهيدروجين إلى الإيثين؟\nالإجابة النموذجية: الإيثان.\n\n2) [المستوى المتوقع] اكتب معادلة إنتاج الإيثانول من الإيثين.\nالإجابة النموذجية: C₂H₄ + H₂O → C₂H₅OH\n\n3) [المستوى المتقدم] لماذا تُسمى تفاعلات الألكينات مع H₂ وBr₂ وH₂O تفاعلات إضافة؟\nالإجابة النموذجية: لأن جزيئين يتحدان لتكوين ناتج واحد عند الرابطة الثنائية دون نواتج أخرى."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُستخدم ......... عاملًا حفازًا في إضافة الهيدروجين إلى الألكينات.<\/td><td>النيكل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المجموعة التي تدل عليها النهاية (-ول) في الإيثانول؟<\/td><td>مجموعة الهيدروكسيل OH.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>هل يزيل ناتج إضافة الهيدروجين إلى الإيثين لون ماء البروم؟ فسّر.<\/td><td>لا؛ لأن الناتج إيثان مشبع لا يحتوي على رابطة ثنائية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يُستخدم ......... عاملًا حفازًا في إضافة الهيدروجين إلى الألكينات.\nالإجابة النموذجية: النيكل.\n\n2) [المستوى المتوقع] ما المجموعة التي تدل عليها النهاية (-ول) في الإيثانول؟\nالإجابة النموذجية: مجموعة الهيدروكسيل OH.\n\n3) [المستوى المتقدم] هل يزيل ناتج إضافة الهيدروجين إلى الإيثين لون ماء البروم؟ فسّر.\nالإجابة النموذجية: لا؛ لأن الناتج إيثان مشبع لا يحتوي على رابطة ثنائية."},{"h":"<p>إكمال تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62، والإجابة عن الأسئلة 17-4 إلى 20-4 والسؤال 3 من أسئلة نهاية الوحدة.<\/p>","t":"إكمال تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62، والإجابة عن الأسئلة 17-4 إلى 20-4 والسؤال 3 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-4 الألكينات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 86–89 | كتاب النشاط: تمرين 2-4 ص 59–60، تمرين 3-4 ص 61–62<\/div><div><b>دليل المعلم:<\/b> ص 80<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><ol class=\"ol\"><li>يصف الألكينات بأنها هيدروكربونات غير مشبعة تحتوي على رابطة تساهمية ثنائية واحدة على الأقل بين ذرتي كربون.<\/li><li>يسمي الألكينات غير المتفرعة حتى أربع ذرات كربون ويرسمها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج الصيغة العامة للألكينات CₙH₂ₙ.<\/div><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><ol class=\"ol\"><li>يميز الهيدروكربونات المشبعة من غير المشبعة بتفاعلها مع محلول البروم.<\/li><li>يصف تفاعل إضافة البروم إلى الإيثين.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يكتب معادلة تفاعل الإيثين مع البروم.<\/div><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><ol class=\"ol\"><li>يصف تفاعل الإيثين مع الهيدروجين لإنتاج الإيثان، ومع بخار الماء لإنتاج الإيثانول.<\/li><li>يسمي الإيثانول ويرسمه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين تفاعلات الإضافة الثلاثة من حيث المادة المضافة والناتج.<\/div>","t":"الحصة 1: تركيب الألكينات وتسميتها\n1. يصف الألكينات بأنها هيدروكربونات غير مشبعة تحتوي على رابطة تساهمية ثنائية واحدة على الأقل بين ذرتي كربون.\n2. يسمي الألكينات غير المتفرعة حتى أربع ذرات كربون ويرسمها.\nمخرج تعليمي آخر: يستنتج الصيغة العامة للألكينات CₙH₂ₙ.\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\n1. يميز الهيدروكربونات المشبعة من غير المشبعة بتفاعلها مع محلول البروم.\n2. يصف تفاعل إضافة البروم إلى الإيثين.\nمخرج تعليمي آخر: يكتب معادلة تفاعل الإيثين مع البروم.\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\n1. يصف تفاعل الإيثين مع الهيدروجين لإنتاج الإيثان، ومع بخار الماء لإنتاج الإيثانول.\n2. يسمي الإيثانول ويرسمه.\nمخرج تعليمي آخر: يقارن بين تفاعلات الإضافة الثلاثة من حيث المادة المضافة والناتج."},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><table class=\"t\"><thead><tr> - بصرية)\n• أخرى: ماء البروم المخفف، أنابيب اختبار، عينتا هكسان وهكسين أو مقطع مرئي، قفازات ونظارات واقية\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• نماذج مجسمة"},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><div class=\"pills\"><span>الألكينات<\/span><span>الرابطة الثنائية<\/span><span>غير المشبع<\/span><span>الإيثين<\/span><span>البروبين<\/span><span>البيوتين<\/span><\/div><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><div class=\"pills\"><span>تفاعل الإضافة<\/span><span>ماء البروم<\/span><span>إزالة اللون<\/span><span>الهيدروكربون غير المشبع<\/span><\/div><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><div class=\"pills\"><span>الهدرجة<\/span><span>الإيثانول<\/span><span>بخار الماء<\/span><span>العامل الحفاز<\/span><span>تفاعل الإضافة<\/span><\/div>","t":"الحصة 1: تركيب الألكينات وتسميتها\nالألكينات، الرابطة الثنائية، غير المشبع، الإيثين، البروبين، البيوتين\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\nتفاعل الإضافة، ماء البروم، إزالة اللون، الهيدروكربون غير المشبع\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\nالهدرجة، الإيثانول، بخار الماء، العامل الحفاز، تفاعل الإضافة"},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><p>يعرض نموذج الإيثان ثم ينزع ذرتي هيدروجين ويسأل: كيف تحافظ ذرتا الكربون على أربع روابط لكل منهما؟<\/p><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><p>يعرض أنبوبين فيهما ماء بروم برتقالي ويسأل: كيف يمكن لهذا المحلول أن يكشف الرابطة الثنائية؟<\/p><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><p>سؤال: كيف تتحول الزيوت النباتية السائلة إلى سمن صلب؟ (الربط بإضافة الهيدروجين)<\/p>","t":"الحصة 1: تركيب الألكينات وتسميتها\nيعرض نموذج الإيثان ثم ينزع ذرتي هيدروجين ويسأل: كيف تحافظ ذرتا الكربون على أربع روابط لكل منهما؟\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\nيعرض أنبوبين فيهما ماء بروم برتقالي ويسأل: كيف يمكن لهذا المحلول أن يكشف الرابطة الثنائية؟\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\nسؤال: كيف تتحول الزيوت النباتية السائلة إلى سمن صلب؟ (الربط بإضافة الهيدروجين)"},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض النموذج.<\/td><td>يقترحون الرابطة الثنائية.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الرابطة الثنائية (كتاب الطالب ص 86–87)<\/td><td>يبني نموذج الإيثين ويوضح الرابطة <bdi>C=C<\/bdi>.<\/td><td>يرسمون الصيغة البنائية للإيثين.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">بناء البروبين والبيوتين<\/td><td>يوجه إلى البناء والرسم.<\/td><td>يستنتجون الصيغة العامة CₙH₂ₙ.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 2-4 هيدروكربونات غير مشبعة (كتاب النشاط ص 59–60)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الأنبوبين.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-4 اختبار تحديد الهيدروكربونات غير المشبعة (كتاب الطالب)<\/td><td>يوجه إلى إضافة قطرات من ماء البروم إلى الألكان وإلى الألكين ورج الأنبوبين في خزانة الغازات، أو يعرض مقطعًا مرئيًا.<\/td><td>يلاحظون زوال اللون البرتقالي مع الألكين وبقاءه مع الألكان.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تفسير الإضافة<\/td><td>يكتب على السبورة الذكية: <bdi>C₂H₄ + Br₂ → C₂H₄Br₂<\/bdi>، ويوضح إضافة ذرتي البروم عند الرابطة الثنائية.<\/td><td>يرسمون ناتج الإضافة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 3-4 (البدء – كتاب النشاط ص 61)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">إضافة الهيدروجين وبخار الماء (كتاب الطالب ص 88–89)<\/td><td>يكتب على السبورة الذكية: <bdi>C₂H₄ + H₂ → C₂H₆<\/bdi> بوجود النيكل عاملًا حفازًا، و <bdi>C₂H₄ + H₂O → C₂H₅OH<\/bdi> بالحرارة والضغط وعامل حفاز.<\/td><td>يبنون نموذج الإيثانول ويرسمونه.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">جدول المقارنة<\/td><td>يوجه إلى مقارنة التفاعلات الثلاثة.<\/td><td>يكملون جدولًا: المادة المضافة، والناتج، والظروف.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم وإكمال تمرين 3-4<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الألكينات وتسميتها\n(5 دقائق) التهيئة\nدور المعلم: يعرض النموذج.\nدور الطالب: يقترحون الرابطة الثنائية.\n\n(12 دقيقة) الرابطة الثنائية (كتاب الطالب ص 86–87)\nدور المعلم: يبني نموذج الإيثين ويوضح الرابطة C=C.\nدور الطالب: يرسمون الصيغة البنائية للإيثين.\n\n(10 دقائق) بناء البروبين والبيوتين\nدور المعلم: يوجه إلى البناء والرسم.\nدور الطالب: يستنتجون الصيغة العامة CₙH₂ₙ.\n\n(8 دقائق) تمرين 2-4 هيدروكربونات غير مشبعة (كتاب النشاط ص 59–60)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\n(5 دقائق) التهيئة\nدور المعلم: يعرض الأنبوبين.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 1-4 اختبار تحديد الهيدروكربونات غير المشبعة (كتاب الطالب)\nدور المعلم: يوجه إلى إضافة قطرات من ماء البروم إلى الألكان وإلى الألكين ورج الأنبوبين في خزانة الغازات، أو يعرض مقطعًا مرئيًا.\nدور الطالب: يلاحظون زوال اللون البرتقالي مع الألكين وبقاءه مع الألكان.\n\n(10 دقائق) تفسير الإضافة\nدور المعلم: يكتب على السبورة الذكية: C₂H₄ + Br₂ → C₂H₄Br₂، ويوضح إضافة ذرتي البروم عند الرابطة الثنائية.\nدور الطالب: يرسمون ناتج الإضافة.\n\n(5 دقائق) تمرين 3-4 (البدء – كتاب النشاط ص 61)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) إضافة الهيدروجين وبخار الماء (كتاب الطالب ص 88–89)\nدور المعلم: يكتب على السبورة الذكية: C₂H₄ + H₂ → C₂H₆ بوجود النيكل عاملًا حفازًا، و C₂H₄ + H₂O → C₂H₅OH بالحرارة والضغط وعامل حفاز.\nدور الطالب: يبنون نموذج الإيثانول ويرسمونه.\n\n(10 دقائق) جدول المقارنة\nدور المعلم: يوجه إلى مقارنة التفاعلات الثلاثة.\nدور الطالب: يكملون جدولًا: المادة المضافة، والناتج، والظروف.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم وإكمال تمرين 3-4\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الذي يميز الألكينات عن الألكانات تركيبيًا؟<\/td><td>وجود رابطة ثنائية واحدة على الأقل بين ذرتي كربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب الصيغة الجزيئية للبروبين.<\/td><td>C₃H₆.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يوجد ألكين يحتوي على ذرة كربون واحدة؟<\/td><td>لأن الرابطة الثنائية تحتاج إلى ذرتي كربون على الأقل.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما لون ماء البروم؟ وماذا يحدث له مع الألكين؟<\/td><td>برتقالي، ويزول لونه مع الألكين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا يزول لون ماء البروم مع الألكان؟<\/td><td>لأن الألكان مشبع لا يحتوي على رابطة ثنائية تحدث عندها الإضافة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اكتب معادلة تفاعل الإيثين مع البروم وسمِّ نوع التفاعل.<\/td><td><bdi>C₂H₄ + Br₂ → C₂H₄Br₂<\/bdi>؛ تفاعل إضافة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما ناتج إضافة الهيدروجين إلى الإيثين؟<\/td><td>الإيثان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة إنتاج الإيثانول من الإيثين.<\/td><td><bdi>C₂H₄ + H₂O → C₂H₅OH<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُسمى تفاعلات الألكينات مع H₂ وBr₂ وH₂O تفاعلات إضافة؟<\/td><td>لأن جزيئين يتحدان لتكوين ناتج واحد عند الرابطة الثنائية دون نواتج أخرى.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الألكينات وتسميتها\n1) [مستوى الدعم] ما الذي يميز الألكينات عن الألكانات تركيبيًا؟\nالإجابة النموذجية: وجود رابطة ثنائية واحدة على الأقل بين ذرتي كربون.\n\n2) [المستوى المتوقع] اكتب الصيغة الجزيئية للبروبين.\nالإجابة النموذجية: C₃H₆.\n\n3) [المستوى المتقدم] لماذا لا يوجد ألكين يحتوي على ذرة كربون واحدة؟\nالإجابة النموذجية: لأن الرابطة الثنائية تحتاج إلى ذرتي كربون على الأقل.\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\n1) [مستوى الدعم] ما لون ماء البروم؟ وماذا يحدث له مع الألكين؟\nالإجابة النموذجية: برتقالي، ويزول لونه مع الألكين.\n\n2) [المستوى المتوقع] لماذا لا يزول لون ماء البروم مع الألكان؟\nالإجابة النموذجية: لأن الألكان مشبع لا يحتوي على رابطة ثنائية تحدث عندها الإضافة.\n\n3) [المستوى المتقدم] اكتب معادلة تفاعل الإيثين مع البروم وسمِّ نوع التفاعل.\nالإجابة النموذجية: C₂H₄ + Br₂ → C₂H₄Br₂؛ تفاعل إضافة.\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\n1) [مستوى الدعم] ما ناتج إضافة الهيدروجين إلى الإيثين؟\nالإجابة النموذجية: الإيثان.\n\n2) [المستوى المتوقع] اكتب معادلة إنتاج الإيثانول من الإيثين.\nالإجابة النموذجية: C₂H₄ + H₂O → C₂H₅OH\n\n3) [المستوى المتقدم] لماذا تُسمى تفاعلات الألكينات مع H₂ وBr₂ وH₂O تفاعلات إضافة؟\nالإجابة النموذجية: لأن جزيئين يتحدان لتكوين ناتج واحد عند الرابطة الثنائية دون نواتج أخرى."},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الصيغة العامة للألكينات .........<\/td><td>CₙH₂ₙ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل الإيثين مشبع أم غير مشبع؟ ولماذا؟<\/td><td>غير مشبع؛ لاحتوائه على رابطة ثنائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>هيدروكربون غير حلقي صيغته C₄H₈. إلى أي عائلة ينتمي؟ وكم رابطة ثنائية فيه؟<\/td><td>الألكينات (البيوتين)؛ وفيه رابطة ثنائية واحدة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يُستخدم ماء البروم للتمييز بين الإيثان والإيثين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نوع التفاعل بين الألكين والبروم؟<\/td><td>تفاعل إضافة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مادتان A وB صيغتاهما C₆H₁₂ وC₆H₁₄. توقع أيهما يزيل لون ماء البروم وبرر.<\/td><td>A؛ لأن صيغتها تطابق CₙH₂ₙ فهي ألكين غير مشبع، أما B فألكان مشبع.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُستخدم ......... عاملًا حفازًا في إضافة الهيدروجين إلى الألكينات.<\/td><td>النيكل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المجموعة التي تدل عليها النهاية (-ول) في الإيثانول؟<\/td><td>مجموعة الهيدروكسيل OH.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>هل يزيل ناتج إضافة الهيدروجين إلى الإيثين لون ماء البروم؟ فسّر.<\/td><td>لا؛ لأن الناتج إيثان مشبع لا يحتوي على رابطة ثنائية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الألكينات وتسميتها\n1) [مستوى الدعم] أكمل: الصيغة العامة للألكينات .........\nالإجابة النموذجية: CₙH₂ₙ.\n\n2) [المستوى المتوقع] هل الإيثين مشبع أم غير مشبع؟ ولماذا؟\nالإجابة النموذجية: غير مشبع؛ لاحتوائه على رابطة ثنائية.\n\n3) [المستوى المتقدم] هيدروكربون غير حلقي صيغته C₄H₈. إلى أي عائلة ينتمي؟ وكم رابطة ثنائية فيه؟\nالإجابة النموذجية: الألكينات (البيوتين)؛ وفيه رابطة ثنائية واحدة.\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\n1) [مستوى الدعم] صواب أم خطأ: يُستخدم ماء البروم للتمييز بين الإيثان والإيثين.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما نوع التفاعل بين الألكين والبروم؟\nالإجابة النموذجية: تفاعل إضافة.\n\n3) [المستوى المتقدم] مادتان A وB صيغتاهما C₆H₁₂ وC₆H₁₄. توقع أيهما يزيل لون ماء البروم وبرر.\nالإجابة النموذجية: A؛ لأن صيغتها تطابق CₙH₂ₙ فهي ألكين غير مشبع، أما B فألكان مشبع.\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\n1) [مستوى الدعم] أكمل: يُستخدم ......... عاملًا حفازًا في إضافة الهيدروجين إلى الألكينات.\nالإجابة النموذجية: النيكل.\n\n2) [المستوى المتوقع] ما المجموعة التي تدل عليها النهاية (-ول) في الإيثانول؟\nالإجابة النموذجية: مجموعة الهيدروكسيل OH.\n\n3) [المستوى المتقدم] هل يزيل ناتج إضافة الهيدروجين إلى الإيثين لون ماء البروم؟ فسّر.\nالإجابة النموذجية: لا؛ لأن الناتج إيثان مشبع لا يحتوي على رابطة ثنائية."},{"h":"<div class=\"psub\">الحصة 1: تركيب الألكينات وتسميتها<\/div><p>مراجعة كتاب الطالب ص 86–87 والإجابة عن الأسئلة 11-4 إلى 14-4، وحل تمرين 2-4 في كتاب النشاط ص 59–60.<\/p><div class=\"psub\">الحصة 2: التمييز بين المشبع وغير المشبع بماء البروم<\/div><p>مراجعة كتاب الطالب ص 87–88 والإجابة عن السؤالين 15-4 و16-4، والبدء في تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62.<\/p><div class=\"psub\">الحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات<\/div><p>إكمال تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62، والإجابة عن الأسئلة 17-4 إلى 20-4 والسؤال 3 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: تركيب الألكينات وتسميتها\nمراجعة كتاب الطالب ص 86–87 والإجابة عن الأسئلة 11-4 إلى 14-4، وحل تمرين 2-4 في كتاب النشاط ص 59–60.\n\nالحصة 2: التمييز بين المشبع وغير المشبع بماء البروم\nمراجعة كتاب الطالب ص 87–88 والإجابة عن السؤالين 15-4 و16-4، والبدء في تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62.\n\nالحصة 3: إضافة الهيدروجين وبخار الماء إلى الألكينات\nإكمال تمرين 3-4 الهيدروكربونات وتفاعلاتها في كتاب النشاط ص 61–62، والإجابة عن الأسئلة 17-4 إلى 20-4 والسؤال 3 من أسئلة نهاية الوحدة."}]}},{"label":"3-4 البترول (النفط الخام) وأنواع أخرى من الوقود الأحفوري","unit":"الوحدة الرابعة: مدخل إلى الكيمياء العضوية","periods":[{"n":1,"focus":"الوقود الأحفوري والتقطير التجزيئي","info":"<div><b>الدرس:<\/b> 3-4 البترول (النفط الخام) وأنواع أخرى من الوقود الأحفوري<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 90–100 | كتاب النشاط: تمرين 4-4 ص 63–66، ورقة العمل 3-4 ص 71<\/div><div><b>دليل المعلم:<\/b> ص 81<\/div><div><b>محور الحصة:<\/b> الوقود الأحفوري والتقطير التجزيئي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق.<\/li><li>يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها.<\/div>","t":"1. يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق.\n2. يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي.\nمخرج تعليمي آخر: يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يذكر أن الفحم والغاز الطبيعي والنفط أنواع من الوقود الأحفوري تنتج ثاني أكسيد الكربون عند الاحتراق. ← تذكر\n• يصف النفط بأنه مزيج من الهيدروكربونات يمكن فصل مشتقاته بالتقطير التجزيئي. ← فهم\n• يفسر فصل المشتقات في برج التجزئة باختلاف درجات غليانها. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>الوقود الأحفوري<\/span><span>النفط الخام<\/span><span>التقطير التجزيئي<\/span><span>برج التجزئة<\/span><span>المشتق<\/span><span>درجة الغليان<\/span><\/div>","t":"الوقود الأحفوري، النفط الخام، التقطير التجزيئي، برج التجزئة، المشتق، درجة الغليان"},{"h":"<p>يعرض صورة مصفاة نفط في سلطنة عُمان ويسأل: النفط الخام سائل أسود كثيف، فكيف نحصل منه على غاز الطبخ والبنزين؟<\/p>","t":"يعرض صورة مصفاة نفط في سلطنة عُمان ويسأل: النفط الخام سائل أسود كثيف، فكيف نحصل منه على غاز الطبخ والبنزين؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الوقود الأحفوري (كتاب الطالب ص 90–92)<\/td><td>يعرض تكوّن النفط والغاز والفحم من بقايا كائنات قديمة.<\/td><td>يكملون جدولًا للأنواع الثلاثة.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">برج التجزئة – النشاط 2-4 تقطير تجزيئي للبترول (عرض أو مقطع)<\/td><td>يعرض مخطط البرج ويوضح أن البخار يصعد ويبرد فتتكثف المشتقات عند مستويات مختلفة.<\/td><td>يرتبون المشتقات على المخطط من الأعلى إلى الأسفل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">النفط في سلطنة عُمان (كتاب الطالب ص 95)<\/td><td>يناقش أهمية النفط للاقتصاد العماني.<\/td><td>يذكرون حقائق من الكتاب.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الوقود الأحفوري (كتاب الطالب ص 90–92)\nدور المعلم: يعرض تكوّن النفط والغاز والفحم من بقايا كائنات قديمة.\nدور الطالب: يكملون جدولًا للأنواع الثلاثة.\n\n(15 دقيقة) برج التجزئة – النشاط 2-4 تقطير تجزيئي للبترول (عرض أو مقطع)\nدور المعلم: يعرض مخطط البرج ويوضح أن البخار يصعد ويبرد فتتكثف المشتقات عند مستويات مختلفة.\nدور الطالب: يرتبون المشتقات على المخطط من الأعلى إلى الأسفل.\n\n(5 دقائق) النفط في سلطنة عُمان (كتاب الطالب ص 95)\nدور المعلم: يناقش أهمية النفط للاقتصاد العماني.\nدور الطالب: يذكرون حقائق من الكتاب.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة أنواع من الوقود الأحفوري.<\/td><td>الفحم، والغاز الطبيعي، والنفط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>على أي خاصية يعتمد فصل مشتقات النفط في التقطير التجزيئي؟<\/td><td>اختلاف درجات غليانها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تخرج المشتقات ذات الجزيئات الصغيرة من أعلى البرج؟<\/td><td>لأن درجات غليانها منخفضة فتبقى بخارًا حتى تصل إلى أعلى البرج الأبرد.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ثلاثة أنواع من الوقود الأحفوري.\nالإجابة النموذجية: الفحم، والغاز الطبيعي، والنفط.\n\n2) [المستوى المتوقع] على أي خاصية يعتمد فصل مشتقات النفط في التقطير التجزيئي؟\nالإجابة النموذجية: اختلاف درجات غليانها.\n\n3) [المستوى المتقدم] لماذا تخرج المشتقات ذات الجزيئات الصغيرة من أعلى البرج؟\nالإجابة النموذجية: لأن درجات غليانها منخفضة فتبقى بخارًا حتى تصل إلى أعلى البرج الأبرد."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُنتج احتراق الوقود الأحفوري غاز .........<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يكون أسفل برج التجزئة أسخن من أعلاه؟<\/td><td>لأن النفط يُسخن ويدخل من الأسفل، ويبرد البخار تدريجيًا كلما صعد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا تُفصل مشتقات النفط بالتقطير البسيط؟<\/td><td>لأنها مزيج من مواد كثيرة متقاربة في درجات الغليان، فنحتاج إلى برج يفصلها إلى مجموعات حسب مدى الغليان.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يُنتج احتراق الوقود الأحفوري غاز .........\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n2) [المستوى المتوقع] لماذا يكون أسفل برج التجزئة أسخن من أعلاه؟\nالإجابة النموذجية: لأن النفط يُسخن ويدخل من الأسفل، ويبرد البخار تدريجيًا كلما صعد.\n\n3) [المستوى المتقدم] لماذا لا تُفصل مشتقات النفط بالتقطير البسيط؟\nالإجابة النموذجية: لأنها مزيج من مواد كثيرة متقاربة في درجات الغليان، فنحتاج إلى برج يفصلها إلى مجموعات حسب مدى الغليان."},{"h":"<p>مراجعة كتاب
