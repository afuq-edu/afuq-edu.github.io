ية - بصرية)\n• أخرى: عرض المعلم: قطع صغيرة من الليثيوم والصوديوم، حوض ماء، كاشف عام، شاشة أمان، نظارات واقية\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><div class=\"pills\"><span>الفلزات القلوية<\/span><span>المجموعة الأولى<\/span><span>الليونة<\/span><span>درجة الانصهار<\/span><span>الكثافة<\/span><span>التدرج في المجموعة<\/span><\/div><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><div class=\"pills\"><span>هيدروكسيد الفلز<\/span><span>غاز الهيدروجين<\/span><span>المحلول القلوي<\/span><span>شدة التفاعل<\/span><\/div><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><div class=\"pills\"><span>التنبؤ<\/span><span>التدرج في المجموعة<\/span><span>الروبيديوم<\/span><span>السيزيوم<\/span><span>النشاط الكيميائي<\/span><\/div>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\nالفلزات القلوية، المجموعة الأولى، الليونة، درجة الانصهار، الكثافة، التدرج في المجموعة\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\nهيدروكسيد الفلز، غاز الهيدروجين، المحلول القلوي، شدة التفاعل\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\nالتنبؤ، التدرج في المجموعة، الروبيديوم، السيزيوم، النشاط الكيميائي"},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><p>مقطع قصير لقطع الصوديوم بسكين ولمعان سطحه ثم بهتانه بسرعة؛ سؤال: ماذا حدث للسطح؟ ولماذا؟<\/p><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><p>سؤال: لماذا سُميت هذه الفلزات «قلوية»؟<\/p><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><p>لعبة «من أنا؟»: ثلاث بطاقات لفلزات قلوية بخصائص مختلفة، والمطلوب تحديد كل فلز.<\/p>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\nمقطع قصير لقطع الصوديوم بسكين ولمعان سطحه ثم بهتانه بسرعة؛ سؤال: ماذا حدث للسطح؟ ولماذا؟\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\nسؤال: لماذا سُميت هذه الفلزات «قلوية»؟\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\nلعبة «من أنا؟»: ثلاث بطاقات لفلزات قلوية بخصائص مختلفة، والمطلوب تحديد كل فلز."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يلاحظون ويتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحليل بيانات المجموعة الأولى (كتاب الطالب ص 19–20)<\/td><td>يعرض جدول درجات الانصهار والكثافة لـ Li وNa وK.<\/td><td>يرسمون أعمدة لدرجات الانصهار ويستنتجون تناقصها بالنزول في المجموعة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الليونة والتخزين<\/td><td>يوضح أنها تُقطع بالسكين وتتفاعل مع الهواء والماء فتُحفظ تحت الزيت.<\/td><td>يفسرون بهتان السطح.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-1 المجموعة I (كتاب النشاط ص 15)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-1 تفاعل بعض الفلزات القلوية مع الماء (عرض المعلم)<\/td><td>يضع قطعة صغيرة من الليثيوم ثم الصوديوم في حوض ماء فيه كاشف عام خلف شاشة أمان، ويعرض مقطعًا لتفاعل البوتاسيوم.<\/td><td>يسجلون: الطفو، والفوران، والحركة، والانصهار، واللهب، وتحول لون الكاشف إلى البنفسجي.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المعادلات<\/td><td>يكتب: الصوديوم + الماء ← هيدروكسيد الصوديوم + الهيدروجين، و <bdi>2Na + 2H₂O → 2NaOH + H₂<\/bdi>.<\/td><td>يكتبون معادلتي الليثيوم والبوتاسيوم ويزنونهما.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ترتيب النشاط<\/td><td>يناقش ازدياد شدة التفاعل بالنزول في المجموعة.<\/td><td>يرتبون: K ثم Na ثم Li.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض البطاقات.<\/td><td>يحددون الفلزات ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">التنبؤ بالروبيديوم والسيزيوم<\/td><td>يعرض على السبورة الذكية جدولًا ناقصًا للبيانات.<\/td><td>تتنبأ المجموعات بدرجة الانصهار والكثافة وشدة التفاعل مع الماء وتبرر.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 2-1 الفلزات القلوية (كتاب النشاط ص 22)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص التدرج في المجموعة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\n(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يلاحظون ويتوقعون.\n\n(12 دقيقة) تحليل بيانات المجموعة الأولى (كتاب الطالب ص 19–20)\nدور المعلم: يعرض جدول درجات الانصهار والكثافة لـ Li وNa وK.\nدور الطالب: يرسمون أعمدة لدرجات الانصهار ويستنتجون تناقصها بالنزول في المجموعة.\n\n(10 دقائق) الليونة والتخزين\nدور المعلم: يوضح أنها تُقطع بالسكين وتتفاعل مع الهواء والماء فتُحفظ تحت الزيت.\nدور الطالب: يفسرون بهتان السطح.\n\n(8 دقائق) تمرين 1-1 المجموعة I (كتاب النشاط ص 15)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 1-1 تفاعل بعض الفلزات القلوية مع الماء (عرض المعلم)\nدور المعلم: يضع قطعة صغيرة من الليثيوم ثم الصوديوم في حوض ماء فيه كاشف عام خلف شاشة أمان، ويعرض مقطعًا لتفاعل البوتاسيوم.\nدور الطالب: يسجلون: الطفو، والفوران، والحركة، والانصهار، واللهب، وتحول لون الكاشف إلى البنفسجي.\n\n(10 دقائق) المعادلات\nدور المعلم: يكتب: الصوديوم + الماء ← هيدروكسيد الصوديوم + الهيدروجين، و 2Na + 2H₂O → 2NaOH + H₂.\nدور الطالب: يكتبون معادلتي الليثيوم والبوتاسيوم ويزنونهما.\n\n(5 دقائق) ترتيب النشاط\nدور المعلم: يناقش ازدياد شدة التفاعل بالنزول في المجموعة.\nدور الطالب: يرتبون: K ثم Na ثم Li.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\n(6 دقائق) التهيئة\nدور المعلم: يعرض البطاقات.\nدور الطالب: يحددون الفلزات ويبررون.\n\n(12 دقيقة) التنبؤ بالروبيديوم والسيزيوم\nدور المعلم: يعرض على السبورة الذكية جدولًا ناقصًا للبيانات.\nدور الطالب: تتنبأ المجموعات بدرجة الانصهار والكثافة وشدة التفاعل مع الماء وتبرر.\n\n(10 دقائق) ورقة العمل 2-1 الفلزات القلوية (كتاب النشاط ص 22)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص التدرج في المجموعة.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا تُحفظ الفلزات القلوية تحت الزيت؟<\/td><td>لمنع تفاعلها مع الأكسجين وبخار الماء في الهواء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف تتغير درجة الانصهار من الليثيوم إلى البوتاسيوم؟<\/td><td>تتناقص.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يطفو الليثيوم والصوديوم والبوتاسيوم على سطح الماء؟<\/td><td>لأن كثافتها أقل من كثافة الماء.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نواتج تفاعل الصوديوم مع الماء؟<\/td><td>هيدروكسيد الصوديوم وغاز الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية الموزونة لتفاعل الليثيوم مع الماء.<\/td><td><bdi>2Li + 2H₂O → 2LiOH + H₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتحول لون الكاشف العام في الحوض إلى البنفسجي؟<\/td><td>لأن هيدروكسيد الفلز الناتج يذوب مكونًا محلولًا قلويًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف تتوقع تفاعل الروبيديوم مع الماء مقارنة بالبوتاسيوم؟<\/td><td>أشد عنفًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>توقع نواتج تفاعل السيزيوم مع الماء.<\/td><td>هيدروكسيد السيزيوم وغاز الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع طالب أن درجة انصهار السيزيوم 200 °C. قيّم توقعه.<\/td><td>غير منطقي؛ لأن درجات الانصهار تتناقص بالنزول في المجموعة فيجب أن تكون أقل من البوتاسيوم (63 °C)، وهي فعلًا نحو 29 °C.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\n1) [مستوى الدعم] لماذا تُحفظ الفلزات القلوية تحت الزيت؟\nالإجابة النموذجية: لمنع تفاعلها مع الأكسجين وبخار الماء في الهواء.\n\n2) [المستوى المتوقع] كيف تتغير درجة الانصهار من الليثيوم إلى البوتاسيوم؟\nالإجابة النموذجية: تتناقص.\n\n3) [المستوى المتقدم] لماذا يطفو الليثيوم والصوديوم والبوتاسيوم على سطح الماء؟\nالإجابة النموذجية: لأن كثافتها أقل من كثافة الماء.\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\n1) [مستوى الدعم] ما نواتج تفاعل الصوديوم مع الماء؟\nالإجابة النموذجية: هيدروكسيد الصوديوم وغاز الهيدروجين.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية الموزونة لتفاعل الليثيوم مع الماء.\nالإجابة النموذجية: 2Li + 2H₂O → 2LiOH + H₂\n\n3) [المستوى المتقدم] لماذا يتحول لون الكاشف العام في الحوض إلى البنفسجي؟\nالإجابة النموذجية: لأن هيدروكسيد الفلز الناتج يذوب مكونًا محلولًا قلويًا.\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\n1) [مستوى الدعم] كيف تتوقع تفاعل الروبيديوم مع الماء مقارنة بالبوتاسيوم؟\nالإجابة النموذجية: أشد عنفًا.\n\n2) [المستوى المتوقع] توقع نواتج تفاعل السيزيوم مع الماء.\nالإجابة النموذجية: هيدروكسيد السيزيوم وغاز الهيدروجين.\n\n3) [المستوى المتقدم] توقع طالب أن درجة انصهار السيزيوم 200 °C. قيّم توقعه.\nالإجابة النموذجية: غير منطقي؛ لأن درجات الانصهار تتناقص بالنزول في المجموعة فيجب أن تكون أقل من البوتاسيوم (63 °C)، وهي فعلًا نحو 29 °C."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلزات القلوية تقع في المجموعة .........<\/td><td>الأولى (I).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يفقد الصوديوم لمعانه بسرعة بعد قطعه؟<\/td><td>لتفاعله مع الأكسجين في الهواء مكونًا طبقة أكسيد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>درجة انصهار الليثيوم 181 °C والصوديوم 98 °C. توقع درجة انصهار البوتاسيوم: 63 °C أم 120 °C؟ برر.<\/td><td>63 °C؛ لأن درجة الانصهار تتناقص بالنزول في المجموعة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>رتب Li وNa وK تنازليًا حسب شدة التفاعل مع الماء.<\/td><td>K ثم Na ثم Li.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الدليل على تكون غاز في التفاعل؟<\/td><td>الفوران وتصاعد الفقاعات، واشتعال الغاز في حالة البوتاسيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا ينصهر الصوديوم ويتحول إلى كرة أثناء تفاعله مع الماء؟<\/td><td>لأن التفاعل طارد للحرارة ودرجة انصهار الصوديوم منخفضة (98 °C).<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يزداد النشاط الكيميائي للفلزات القلوية بالنزول في المجموعة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة اللفظية لتفاعل الروبيديوم مع الماء.<\/td><td>الروبيديوم + الماء ← هيدروكسيد الروبيديوم + الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اكتب المعادلة الرمزية الموزونة لتفاعل البوتاسيوم مع الماء، وما لون اللهب الملاحظ؟<\/td><td><bdi>2K + 2H₂O → 2KOH + H₂<\/bdi>؛ ويظهر لهب بنفسجي فاتح (ليلكي).<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\n1) [مستوى الدعم] أكمل: الفلزات القلوية تقع في المجموعة .........\nالإجابة النموذجية: الأولى (I).\n\n2) [المستوى المتوقع] لماذا يفقد الصوديوم لمعانه بسرعة بعد قطعه؟\nالإجابة النموذجية: لتفاعله مع الأكسجين في الهواء مكونًا طبقة أكسيد.\n\n3) [المستوى المتقدم] درجة انصهار الليثيوم 181 °C والصوديوم 98 °C. توقع درجة انصهار البوتاسيوم: 63 °C أم 120 °C؟ برر.\nالإجابة النموذجية: 63 °C؛ لأن درجة الانصهار تتناقص بالنزول في المجموعة.\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\n1) [مستوى الدعم] رتب Li وNa وK تنازليًا حسب شدة التفاعل مع الماء.\nالإجابة النموذجية: K ثم Na ثم Li.\n\n2) [المستوى المتوقع] ما الدليل على تكون غاز في التفاعل؟\nالإجابة النموذجية: الفوران وتصاعد الفقاعات، واشتعال الغاز في حالة البوتاسيوم.\n\n3) [المستوى المتقدم] لماذا ينصهر الصوديوم ويتحول إلى كرة أثناء تفاعله مع الماء؟\nالإجابة النموذجية: لأن التفاعل طارد للحرارة ودرجة انصهار الصوديوم منخفضة (98 °C).\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\n1) [مستوى الدعم] صواب أم خطأ: يزداد النشاط الكيميائي للفلزات القلوية بالنزول في المجموعة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] اكتب المعادلة اللفظية لتفاعل الروبيديوم مع الماء.\nالإجابة النموذجية: الروبيديوم + الماء ← هيدروكسيد الروبيديوم + الهيدروجين.\n\n3) [المستوى المتقدم] اكتب المعادلة الرمزية الموزونة لتفاعل البوتاسيوم مع الماء، وما لون اللهب الملاحظ؟\nالإجابة النموذجية: 2K + 2H₂O → 2KOH + H₂؛ ويظهر لهب بنفسجي فاتح (ليلكي)."},{"h":"<div class=\"psub\">الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها<\/div><p>حل تمرين 1-1 المجموعة I (الفلزات القلوية) في كتاب النشاط ص 15، ومراجعة كتاب الطالب ص 19–20.<\/p><div class=\"psub\">الحصة 2: تفاعل الفلزات القلوية مع الماء<\/div><p>مراجعة كتاب الطالب ص 20–21 والإجابة عن الأسئلة 7-1 إلى 10-1، وكتابة معادلات تفاعل الفلزات القلوية الثلاثة مع الماء.<\/p><div class=\"psub\">الحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى<\/div><p>إكمال ورقة العمل 2-1 الفلزات القلوية في كتاب النشاط ص 22، والإجابة عن الأسئلة 11-1 إلى 13-1 والسؤال 3 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: الخصائص الفيزيائية للفلزات القلوية وتدرجها\nحل تمرين 1-1 المجموعة I (الفلزات القلوية) في كتاب النشاط ص 15، ومراجعة كتاب الطالب ص 19–20.\n\nالحصة 2: تفاعل الفلزات القلوية مع الماء\nمراجعة كتاب الطالب ص 20–21 والإجابة عن الأسئلة 7-1 إلى 10-1، وكتابة معادلات تفاعل الفلزات القلوية الثلاثة مع الماء.\n\nالحصة 3: التنبؤ بخصائص عناصر المجموعة الأولى\nإكمال ورقة العمل 2-1 الفلزات القلوية في كتاب النشاط ص 22، والإجابة عن الأسئلة 11-1 إلى 13-1 والسؤال 3 من أسئلة نهاية الوحدة."}]}},{"label":"4-1 نشاط الفلزات","unit":"الوحدة الأولى: الفلزات وخصائصها","periods":[{"n":1,"focus":"تفاعل الفلزات مع الماء وبخار الماء","info":"<div><b>الدرس:<\/b> 4-1 نشاط الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 5<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–32 | كتاب النشاط: تمرين 2-1 ص 16–17، تمرين 3-1 ص 18–20، ورقة العمل 3-1 ص 23–25، ورقة العمل 4-1 ص 26–28<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> تفاعل الفلزات مع الماء وبخار الماء<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء.<\/li><li>يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره.<\/div>","t":"1. يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء.\n2. يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه.\nمخرج تعليمي آخر: يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء. ← تحليل\n• يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه. ← فهم\n• يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: عرض المعلم: كالسيوم، شريط ماغنيسيوم، أنبوب مقاوم للحرارة، صوف حديدي، صوف معدني مبلل، موقد بنزن، حوض ماء، شظية مشتعلة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: عرض المعلم: كالسيوم، شريط ماغنيسيوم، أنبوب مقاوم للحرارة، صوف حديدي، صوف معدني مبلل، موقد بنزن، حوض ماء، شظية مشتعلة"},{"h":"<div class=\"pills\"><span>سلسلة النشاط الكيميائي<\/span><span>بخار الماء<\/span><span>أكسيد الفلز<\/span><span>الهيدروجين<\/span><span>الكالسيوم<\/span><span>الماغنيسيوم<\/span><\/div>","t":"سلسلة النشاط الكيميائي، بخار الماء، أكسيد الفلز، الهيدروجين، الكالسيوم، الماغنيسيوم"},{"h":"<p>يعرض صورتين: قارب صيد من الألومنيوم في البحر، وقطعة صوديوم تتفاعل بعنف مع الماء؛ سؤال: لماذا لا تتفاعل كل الفلزات مع الماء بالشدة نفسها؟<\/p>","t":"يعرض صورتين: قارب صيد من الألومنيوم في البحر، وقطعة صوديوم تتفاعل بعنف مع الماء؛ سؤال: لماذا لا تتفاعل كل الفلزات مع الماء بالشدة نفسها؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تفاعل الكالسيوم والماغنيسيوم مع الماء<\/td><td>يضع قطعة كالسيوم في ماء وشريط ماغنيسيوم في ماء بارد ويقارن.<\/td><td>يلاحظون فورانًا واضحًا مع الكالسيوم وبطئًا شديدًا مع الماغنيسيوم.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">النشاط 2-1 تفاعل الصوف الحديدي مع بخار الماء (عرض المعلم)<\/td><td>يسخن الصوف الحديدي مع بخار ناتج من صوف معدني مبلل، ويجمع الغاز فوق الماء ويختبره بالشظية المشتعلة، مع الحذر من ارتداد الماء.<\/td><td>يسجلون الملاحظات ويكتبون: الحديد + بخار الماء ← أكسيد الحديد + الهيدروجين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ترتيب مبدئي<\/td><td>يطلب ترتيب K وNa وCa وMg وFe وCu حسب تفاعلها مع الماء أو البخار.<\/td><td>يرتبون ويبررون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يقترحون أسبابًا.\n\n(12 دقيقة) تفاعل الكالسيوم والماغنيسيوم مع الماء\nدور المعلم: يضع قطعة كالسيوم في ماء وشريط ماغنيسيوم في ماء بارد ويقارن.\nدور الطالب: يلاحظون فورانًا واضحًا مع الكالسيوم وبطئًا شديدًا مع الماغنيسيوم.\n\n(13 دقيقة) النشاط 2-1 تفاعل الصوف الحديدي مع بخار الماء (عرض المعلم)\nدور المعلم: يسخن الصوف الحديدي مع بخار ناتج من صوف معدني مبلل، ويجمع الغاز فوق الماء ويختبره بالشظية المشتعلة، مع الحذر من ارتداد الماء.\nدور الطالب: يسجلون الملاحظات ويكتبون: الحديد + بخار الماء ← أكسيد الحديد + الهيدروجين.\n\n(5 دقائق) ترتيب مبدئي\nدور المعلم: يطلب ترتيب K وNa وCa وMg وFe وCu حسب تفاعلها مع الماء أو البخار.\nدور الطالب: يرتبون ويبررون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي الفلزين يتفاعل مع الماء البارد: الكالسيوم أم النحاس؟<\/td><td>الكالسيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نواتج تفاعل الحديد الساخن مع بخار الماء؟<\/td><td>أكسيد الحديد وغاز الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتاج الماغنيسيوم إلى بخار الماء ليتفاعل بسرعة، بينما يتفاعل الصوديوم مع الماء البارد؟<\/td><td>لأن الماغنيسيوم أقل نشاطًا من الصوديوم، فيحتاج إلى طاقة أكبر ليتفاعل بسرعة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أي الفلزين يتفاعل مع الماء البارد: الكالسيوم أم النحاس؟\nالإجابة النموذجية: الكالسيوم.\n\n2) [المستوى المتوقع] ما نواتج تفاعل الحديد الساخن مع بخار الماء؟\nالإجابة النموذجية: أكسيد الحديد وغاز الهيدروجين.\n\n3) [المستوى المتقدم] لماذا يحتاج الماغنيسيوم إلى بخار الماء ليتفاعل بسرعة، بينما يتفاعل الصوديوم مع الماء البارد؟\nالإجابة النموذجية: لأن الماغنيسيوم أقل نشاطًا من الصوديوم، فيحتاج إلى طاقة أكبر ليتفاعل بسرعة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُختبر غاز الهيدروجين بـ ......... فيحترق بفرقعة.<\/td><td>الشظية المشتعلة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب تصاعديًا حسب النشاط: Fe، Na، Cu، Mg.<\/td><td>Cu ثم Fe ثم Mg ثم Na.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُرفع أنبوب التوصيل من الماء قبل إطفاء اللهب في نشاط البخار؟<\/td><td>لمنع ارتداد الماء البارد إلى الأنبوب الساخن فيتكسر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يُختبر غاز الهيدروجين بـ ......... فيحترق بفرقعة.\nالإجابة النموذجية: الشظية المشتعلة.\n\n2) [المستوى المتوقع] رتب تصاعديًا حسب النشاط: Fe، Na، Cu، Mg.\nالإجابة النموذجية: Cu ثم Fe ثم Mg ثم Na.\n\n3) [المستوى المتقدم] لماذا يُرفع أنبوب التوصيل من الماء قبل إطفاء اللهب في نشاط البخار؟\nالإجابة النموذجية: لمنع ارتداد الماء البارد إلى الأنبوب الساخن فيتكسر."},{"h":"<p>مراجعة كتاب الطالب ص 23–26 والإجابة عن السؤال 14-1، والبدء في تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17.<\/p>","t":"مراجعة كتاب الطالب ص 23–26 والإجابة عن السؤال 14-1، والبدء في تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17."}]},{"n":2,"focus":"تفاعل الفلزات مع حمض الهيدروكلوريك المخفف","info":"<div><b>الدرس:<\/b> 4-1 نشاط الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 5<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–32 | كتاب النشاط: تمرين 2-1 ص 16–17، تمرين 3-1 ص 18–20، ورقة العمل 3-1 ص 23–25، ورقة العمل 4-1 ص 26–28<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف.<\/li><li>يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة.<\/div>","t":"1. يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف.\n2. يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية.\nمخرج تعليمي آخر: يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف. ← تحليل\n• يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية. ← تحليل\n• يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: أنابيب اختبار، حمض هيدروكلوريك مخفف، قطع متساوية من Mg وZn وFe وCu، مقياس حرارة، نظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: أنابيب اختبار، حمض هيدروكلوريك مخفف، قطع متساوية من Mg وZn وFe وCu، مقياس حرارة، نظارات واقية"},{"h":"<div class=\"pills\"><span>الحمض المخفف<\/span><span>الفوران<\/span><span>المقارنة العادلة<\/span><span>ترتيب النشاط<\/span><\/div>","t":"الحمض المخفف، الفوران، المقارنة العادلة، ترتيب النشاط"},{"h":"<p>سؤال: كيف نصمم «سباقًا عادلًا» بين أربعة فلزات لمعرفة الأنشط؟<\/p>","t":"سؤال: كيف نصمم «سباقًا عادلًا» بين أربعة فلزات لمعرفة الأنشط؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون شروط المقارنة.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 3-1 تحديد ترتيب النشاط الكيميائي لبعض الفلزات (كتاب الطالب)<\/td><td>يوجه إلى وضع قطع متساوية من Mg وZn وFe وCu في كميات متساوية من الحمض نفسه وقياس ارتفاع الحرارة.<\/td><td>يسجلون شدة الفوران وارتفاع الحرارة ويرتبون الفلزات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلات<\/td><td>يكتب على السبورة الذكية: الماغنيسيوم + حمض الهيدروكلوريك ← كلوريد الماغنيسيوم + الهيدروجين، و <bdi>Mg + 2HCl → MgCl₂ + H₂<\/bdi>.<\/td><td>يكتبون معادلة الخارصين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">المقارنة العادلة<\/td><td>يناقش المتغيرات الثابتة.<\/td><td>يحددونها.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون شروط المقارنة.\n\n(17 دقيقة) النشاط 3-1 تحديد ترتيب النشاط الكيميائي لبعض الفلزات (كتاب الطالب)\nدور المعلم: يوجه إلى وضع قطع متساوية من Mg وZn وFe وCu في كميات متساوية من الحمض نفسه وقياس ارتفاع الحرارة.\nدور الطالب: يسجلون شدة الفوران وارتفاع الحرارة ويرتبون الفلزات.\n\n(8 دقائق) المعادلات\nدور المعلم: يكتب على السبورة الذكية: الماغنيسيوم + حمض الهيدروكلوريك ← كلوريد الماغنيسيوم + الهيدروجين، و Mg + 2HCl → MgCl₂ + H₂.\nدور الطالب: يكتبون معادلة الخارصين.\n\n(5 دقائق) المقارنة العادلة\nدور المعلم: يناقش المتغيرات الثابتة.\nدور الطالب: يحددونها.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الغاز المتصاعد عند تفاعل الماغنيسيوم مع الحمض المخفف؟<\/td><td>الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب Mg وZn وFe وCu تنازليًا حسب شدة تفاعلها مع الحمض.<\/td><td>Mg ثم Zn ثم Fe ثم Cu (لا يتفاعل).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر ثلاثة متغيرات تُضبط في النشاط لجعل المقارنة عادلة.<\/td><td>حجم الحمض وتركيزه، وكتلة الفلز ومساحة سطحه، ودرجة الحرارة الابتدائية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الغاز المتصاعد عند تفاعل الماغنيسيوم مع الحمض المخفف؟\nالإجابة النموذجية: الهيدروجين.\n\n2) [المستوى المتوقع] رتب Mg وZn وFe وCu تنازليًا حسب شدة تفاعلها مع الحمض.\nالإجابة النموذجية: Mg ثم Zn ثم Fe ثم Cu (لا يتفاعل).\n\n3) [المستوى المتقدم] اذكر ثلاثة متغيرات تُضبط في النشاط لجعل المقارنة عادلة.\nالإجابة النموذجية: حجم الحمض وتركيزه، وكتلة الفلز ومساحة سطحه، ودرجة الحرارة الابتدائية."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يتفاعل النحاس مع حمض الهيدروكلوريك المخفف مطلقًا الهيدروجين.<\/td><td>خطأ؛ النحاس لا يتفاعل معه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية لتفاعل الخارصين مع حمض الهيدروكلوريك.<\/td><td><bdi>Zn + 2HCl → ZnCl₂ + H₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد قياس ارتفاع درجة الحرارة طريقة جيدة لمقارنة النشاط؟<\/td><td>لأن الفلز الأنشط يتفاعل أسرع وينتج طاقة حرارية أكبر في الزمن نفسه، فيمكن مقارنة النتائج كميًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يتفاعل النحاس مع حمض الهيدروكلوريك المخفف مطلقًا الهيدروجين.\nالإجابة النموذجية: خطأ؛ النحاس لا يتفاعل معه.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية لتفاعل الخارصين مع حمض الهيدروكلوريك.\nالإجابة النموذجية: Zn + 2HCl → ZnCl₂ + H₂\n\n3) [المستوى المتقدم] لماذا يُعد قياس ارتفاع درجة الحرارة طريقة جيدة لمقارنة النشاط؟\nالإجابة النموذجية: لأن الفلز الأنشط يتفاعل أسرع وينتج طاقة حرارية أكبر في الزمن نفسه، فيمكن مقارنة النتائج كميًا."},{"h":"<p>إكمال تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17، والإجابة عن السؤالين 15-1 و16-1.<\/p>","t":"إكمال تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17، والإجابة عن السؤالين 15-1 و16-1."}]},{"n":3,"focus":"سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين","info":"<div><b>الدرس:<\/b> 4-1 نشاط الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 5<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–32 | كتاب النشاط: تمرين 2-1 ص 16–17، تمرين 3-1 ص 18–20، ورقة العمل 3-1 ص 23–25، ورقة العمل 4-1 ص 26–28<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط.<\/li><li>يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون.<\/div>","t":"1. يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط.\n2. يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة.\nمخرج تعليمي آخر: يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط. ← تذكر\n• يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة. ← فهم\n• يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على اللعب<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم المبني على اللعب\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: بطاقات أسماء العناصر<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بطاقات أسماء العناصر"},{"h":"<div class=\"pills\"><span>سلسلة النشاط الكيميائي<\/span><span>الأيون الموجب<\/span><span>الاختزال بالكربون<\/span><span>موقع الهيدروجين<\/span><\/div>","t":"سلسلة النشاط الكيميائي، الأيون الموجب، الاختزال بالكربون، موقع الهيدروجين"},{"h":"<p>يوزع بطاقات أسماء العناصر العشرة على طلبة ويطلب منهم الاصطفاف حسب النشاط.<\/p>","t":"يوزع بطاقات أسماء العناصر العشرة على طلبة ويطلب منهم الاصطفاف حسب النشاط."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة: الاصطفاف<\/td><td>يوزع البطاقات ويتابع الاصطفاف.<\/td><td>يصطفون ويناقشون مواضعهم.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">بناء السلسلة (كتاب الطالب ص 27–28)<\/td><td>يعرض السلسلة ويضيف الكربون والهيدروجين مرجعين للمقارنة.<\/td><td>يكتبون السلسلة بعبارة تذكر من ابتكارهم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تكوين الأيونات الموجبة<\/td><td>يوضح أن الفلز الأنشط يفقد إلكتروناته بسهولة أكبر ليكوّن أيونًا موجبًا.<\/td><td>يكتبون K⁺ وMg²⁺ وAl³⁺ ويقارنون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من المسابقة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(6 دقائق) التهيئة: الاصطفاف\nدور المعلم: يوزع البطاقات ويتابع الاصطفاف.\nدور الطالب: يصطفون ويناقشون مواضعهم.\n\n(12 دقيقة) بناء السلسلة (كتاب الطالب ص 27–28)\nدور المعلم: يعرض السلسلة ويضيف الكربون والهيدروجين مرجعين للمقارنة.\nدور الطالب: يكتبون السلسلة بعبارة تذكر من ابتكارهم.\n\n(10 دقائق) تكوين الأيونات الموجبة\nدور المعلم: يوضح أن الفلز الأنشط يفقد إلكتروناته بسهولة أكبر ليكوّن أيونًا موجبًا.\nدور الطالب: يكتبون K⁺ وMg²⁺ وAl³⁺ ويقارنون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من المسابقة.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أيهما أنشط: الألومنيوم أم الخارصين؟<\/td><td>الألومنيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يعني أن الفلز أعلى في سلسلة النشاط؟<\/td><td>أنه أكثر ميلًا لفقد الإلكترونات وتكوين أيونات موجبة، فيتفاعل بشدة أكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أي الأكسيدين يمكن اختزاله بالكربون: أكسيد الماغنيسيوم أم أكسيد الخارصين؟ برر.<\/td><td>أكسيد الخارصين؛ لأن الخارصين أدنى من الكربون في السلسلة، أما الماغنيسيوم فأعلى منه.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أيهما أنشط: الألومنيوم أم الخارصين؟\nالإجابة النموذجية: الألومنيوم.\n\n2) [المستوى المتوقع] ماذا يعني أن الفلز أعلى في سلسلة النشاط؟\nالإجابة النموذجية: أنه أكثر ميلًا لفقد الإلكترونات وتكوين أيونات موجبة، فيتفاعل بشدة أكبر.\n\n3) [المستوى المتقدم] أي الأكسيدين يمكن اختزاله بالكربون: أكسيد الماغنيسيوم أم أكسيد الخارصين؟ برر.\nالإجابة النموذجية: أكسيد الخارصين؛ لأن الخارصين أدنى من الكربون في السلسلة، أما الماغنيسيوم فأعلى منه."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل الترتيب: K، Na، .........، Mg، Al، C، Zn، .........، H، Cu.<\/td><td>Ca – Fe.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الفلزات التي تتفاعل مع الأحماض المخففة مطلقة الهيدروجين؟<\/td><td>الفلزات التي تقع فوق الهيدروجين في سلسلة النشاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فلز X يتفاعل مع البخار لا مع الماء البارد، ولا يُختزل أكسيده بالكربون. أين موقعه؟<\/td><td>بين الكالسيوم والكربون، مثل الماغنيسيوم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل الترتيب: K، Na، .........، Mg، Al، C، Zn، .........، H، Cu.\nالإجابة النموذجية: Ca – Fe.\n\n2) [المستوى المتوقع] ما الفلزات التي تتفاعل مع الأحماض المخففة مطلقة الهيدروجين؟\nالإجابة النموذجية: الفلزات التي تقع فوق الهيدروجين في سلسلة النشاط.\n\n3) [المستوى المتقدم] فلز X يتفاعل مع البخار لا مع الماء البارد، ولا يُختزل أكسيده بالكربون. أين موقعه؟\nالإجابة النموذجية: بين الكالسيوم والكربون، مثل الماغنيسيوم."},{"h":"<p>حفظ سلسلة النشاط من كتاب الطالب ص 27–28 والإجابة عن السؤالين 17-1 و18-1، وحل ورقة العمل 3-1 الفلزات والنشاط الكيميائي في كتاب النشاط ص 23–25.<\/p>","t":"حفظ سلسلة النشاط من كتاب الطالب ص 27–28 والإجابة عن السؤالين 17-1 و18-1، وحل ورقة العمل 3-1 الفلزات والنشاط الكيميائي في كتاب النشاط ص 23–25."}]},{"n":4,"focus":"تفاعلات الإزاحة (الإحلال) في المحاليل","info":"<div><b>الدرس:<\/b> 4-1 نشاط الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 4 من 5<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–32 | كتاب النشاط: تمرين 2-1 ص 16–17، تمرين 3-1 ص 18–20، ورقة العمل 3-1 ص 23–25، ورقة العمل 4-1 ص 26–28<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> تفاعلات الإزاحة (الإحلال) في المحاليل<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة).<\/li><li>يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة.<\/div>","t":"1. يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة).\n2. يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط.\nمخرج تعليمي آخر: يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة).<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة). ← فهم\n• يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط. ← تطبيق\n• يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: لوحة بقع أو أنابيب، محاليل كبريتات النحاس II والخارصين والماغنيسيوم والحديد II، قطع Mg وZn وFe وCu، مسمار حديدي<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: لوحة بقع أو أنابيب، محاليل كبريتات النحاس II والخارصين والماغنيسيوم والحديد II، قطع Mg وZn وFe وCu، مسمار حديدي"},{"h":"<div class=\"pills\"><span>تفاعل الإزاحة (الإحلال)<\/span><span>المحلول الأيوني<\/span><span>الفلز الأنشط<\/span><span>ترسب الفلز<\/span><\/div>","t":"تفاعل الإزاحة (الإحلال)، المحلول الأيوني، الفلز الأنشط، ترسب الفلز"},{"h":"<p>يغمس مسمارًا حديديًا في محلول كبريتات النحاس II الأزرق ويسأل: ما الطبقة البنية التي تكونت على المسمار؟<\/p>","t":"يغمس مسمارًا حديديًا في محلول كبريتات النحاس II الأزرق ويسأل: ما الطبقة البنية التي تكونت على المسمار؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 4-1 تفاعلات إزاحة الفلزات – المحاليل (كتاب الطالب ص 29–31)<\/td><td>يوجه إلى وضع قطع الفلزات في محاليل أملاح الفلزات الأخرى في جدول شبكي.<\/td><td>يسجلون ظهور طبقة فلز أو تغير لون المحلول ويضعون علامة حدوث التفاعل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلات<\/td><td>يكتب على السبورة الذكية: <bdi>Zn + CuSO₄ → ZnSO₄ + Cu<\/bdi>.<\/td><td>يكتبون معادلة الحديد مع كبريتات النحاس II.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الاستنتاج<\/td><td>يربط عدد التفاعلات لكل فلز بنشاطه.<\/td><td>يرتبون الفلزات من جدولهم.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 4-1 تفاعلات إزاحة الفلزات – المحاليل (كتاب الطالب ص 29–31)\nدور المعلم: يوجه إلى وضع قطع الفلزات في محاليل أملاح الفلزات الأخرى في جدول شبكي.\nدور الطالب: يسجلون ظهور طبقة فلز أو تغير لون المحلول ويضعون علامة حدوث التفاعل.\n\n(8 دقائق) المعادلات\nدور المعلم: يكتب على السبورة الذكية: Zn + CuSO₄ → ZnSO₄ + Cu.\nدور الطالب: يكتبون معادلة الحديد مع كبريتات النحاس II.\n\n(5 دقائق) الاستنتاج\nدور المعلم: يربط عدد التفاعلات لكل فلز بنشاطه.\nدور الطالب: يرتبون الفلزات من جدولهم.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث عند وضع شريط ماغنيسيوم في محلول كبريتات النحاس II؟<\/td><td>يترسب النحاس البني ويبهت لون المحلول الأزرق، لأن الماغنيسيوم أنشط من النحاس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل يحدث تفاعل عند وضع النحاس في محلول كبريتات الخارصين؟ برر.<\/td><td>لا؛ لأن النحاس أقل نشاطًا من الخارصين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في جدول نتائج: الفلز A أزاح فلزين، وB أزاح فلزًا واحدًا، وC لم يُزح أيًا منها. رتب الفلزات.<\/td><td>A أنشطها ثم B ثم C.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث عند وضع شريط ماغنيسيوم في محلول كبريتات النحاس II؟\nالإجابة النموذجية: يترسب النحاس البني ويبهت لون المحلول الأزرق، لأن الماغنيسيوم أنشط من النحاس.\n\n2) [المستوى المتوقع] هل يحدث تفاعل عند وضع النحاس في محلول كبريتات الخارصين؟ برر.\nالإجابة النموذجية: لا؛ لأن النحاس أقل نشاطًا من الخارصين.\n\n3) [المستوى المتقدم] في جدول نتائج: الفلز A أزاح فلزين، وB أزاح فلزًا واحدًا، وC لم يُزح أيًا منها. رتب الفلزات.\nالإجابة النموذجية: A أنشطها ثم B ثم C."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلز الأنشط ......... الفلز الأقل نشاطًا من محلول مركبه.<\/td><td>يزيح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية لتفاعل الحديد مع كبريتات النحاس II.<\/td><td><bdi>Fe + CuSO₄ → FeSO₄ + Cu<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يبهت اللون الأزرق لمحلول كبريتات النحاس II بعد إضافة الخارصين؟<\/td><td>لأن أيونات النحاس الزرقاء تتحول إلى ذرات نحاس، وتحل محلها أيونات الخارصين عديمة اللون.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الفلز الأنشط ......... الفلز الأقل نشاطًا من محلول مركبه.\nالإجابة النموذجية: يزيح.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية لتفاعل الحديد مع كبريتات النحاس II.\nالإجابة النموذجية: Fe + CuSO₄ → FeSO₄ + Cu\n\n3) [المستوى المتقدم] لماذا يبهت اللون الأزرق لمحلول كبريتات النحاس II بعد إضافة الخارصين؟\nالإجابة النموذجية: لأن أيونات النحاس الزرقاء تتحول إلى ذرات نحاس، وتحل محلها أيونات الخارصين عديمة اللون."},{"h":"<p>حل تمرين 3-1 إنتاج الطاقة من تفاعلات الإزاحة في كتاب النشاط ص 18–20، والإجابة عن السؤال 19-1.<\/p>","t":"حل تمرين 3-1 إنتاج الطاقة من تفاعلات الإزاحة في كتاب النشاط ص 18–20، والإجابة عن السؤال 19-1."}]},{"n":5,"focus":"الإزاحة مع أكاسيد الفلزات وتحليل النتائج","info":"<div><b>الدرس:<\/b> 4-1 نشاط الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 5 من 5<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–32 | كتاب النشاط: تمرين 2-1 ص 16–17، تمرين 3-1 ص 18–20، ورقة العمل 3-1 ص 23–25، ورقة العمل 4-1 ص 26–28<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا.<\/li><li>يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين.<\/div>","t":"1. يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا.\n2. يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة.\nمخرج تعليمي آخر: يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا. ← فهم\n• يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة. ← تحليل\n• يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot"},{"h":"<div class=\"pills\"><span>أكاسيد الفلزات<\/span><span>التفاعل الطارد للحرارة<\/span><span>تفاعل الثرميت<\/span><span>الإزاحة<\/span><\/div>","t":"أكاسيد الفلزات، التفاعل الطارد للحرارة، تفاعل الثرميت، الإزاحة"},{"h":"<p>مقطع لتفاعل الثرميت (الألومنيوم مع أكسيد الحديد III) في لحام قضبان السكك الحديدية؛ سؤال: لماذا يتكون حديد منصهر؟<\/p>","t":"مقطع لتفاعل الثرميت (الألومنيوم مع أكسيد الحديد III) في لحام قضبان السكك الحديدية؛ سؤال: لماذا يتكون حديد منصهر؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الإزاحة مع الأكاسيد<\/td><td>يكتب: الماغنيسيوم + أكسيد النحاس II ← أكسيد الماغنيسيوم + النحاس، و <bdi>2Al + Fe₂O₃ → Al₂O₃ + 2Fe<\/bdi>.<\/td><td>يحددون الفلز الذي فقد الأكسجين والذي اكتسبه.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">ورقة العمل 4-1 تفاعل فلزات مسحوقة مع أكاسيد فلزات مختلفة (كتاب النشاط ص 26–28)<\/td><td>يوجه إلى تحليل جدول النتائج وارتفاع درجة الحرارة.<\/td><td>يستنتجون أن ارتفاع الحرارة أكبر كلما زاد الفرق في النشاط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الإزاحة مع الأكاسيد\nدور المعلم: يكتب: الماغنيسيوم + أكسيد النحاس II ← أكسيد الماغنيسيوم + النحاس، و 2Al + Fe₂O₃ → Al₂O₃ + 2Fe.\nدور الطالب: يحددون الفلز الذي فقد الأكسجين والذي اكتسبه.\n\n(12 دقيقة) ورقة العمل 4-1 تفاعل فلزات مسحوقة مع أكاسيد فلزات مختلفة (كتاب النشاط ص 26–28)\nدور المعلم: يوجه إلى تحليل جدول النتائج وارتفاع درجة الحرارة.\nدور الطالب: يستنتجون أن ارتفاع الحرارة أكبر كلما زاد الفرق في النشاط.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>هل يتفاعل النحاس مع أكسيد الماغنيسيوم؟ لماذا؟<\/td><td>لا؛ لأن النحاس أقل نشاطًا من الماغنيسيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة اللفظية لتفاعل الألومنيوم مع أكسيد الحديد III.<\/td><td>الألومنيوم + أكسيد الحديد III ← أكسيد الألومنيوم + الحديد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون ارتفاع الحرارة عند تسخين الماغنيسيوم مع أكسيد النحاس أكبر منه مع أكسيد الحديد؟<\/td><td>لأن الفرق في النشاط بين الماغنيسيوم والنحاس أكبر، فتنطلق طاقة أكبر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] هل يتفاعل النحاس مع أكسيد الماغنيسيوم؟ لماذا؟\nالإجابة النموذجية: لا؛ لأن النحاس أقل نشاطًا من الماغنيسيوم.\n\n2) [المستوى المتوقع] اكتب المعادلة اللفظية لتفاعل الألومنيوم مع أكسيد الحديد III.\nالإجابة النموذجية: الألومنيوم + أكسيد الحديد III ← أكسيد الألومنيوم + الحديد.\n\n3) [المستوى المتقدم] لماذا يكون ارتفاع الحرارة عند تسخين الماغنيسيوم مع أكسيد النحاس أكبر منه مع أكسيد الحديد؟\nالإجابة النموذجية: لأن الفرق في النشاط بين الماغنيسيوم والنحاس أكبر، فتنطلق طاقة أكبر."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تفاعلات الإزاحة بين الفلزات وأكاسيد الفلزات طاردة للحرارة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: <bdi>Mg + CuO<\/bdi> → ......... + .........<\/td><td><bdi>MgO + Cu<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح فلزًا يمكنه إزاحة الخارصين من أكسيده واكتب المعادلة الرمزية.<\/td><td>الماغنيسيوم: <bdi>Mg + ZnO → MgO + Zn<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تفاعلات الإزاحة بين الفلزات وأكاسيد الفلزات طاردة للحرارة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أكمل: Mg + CuO → ......... + .........\nالإجابة النموذجية: MgO + Cu\n\n3) [المستوى المتقدم] اقترح فلزًا يمكنه إزاحة الخارصين من أكسيده واكتب المعادلة الرمزية.\nالإجابة النموذجية: الماغنيسيوم: Mg + ZnO → MgO + Zn."},{"h":"<p>إكمال ورقة العمل 4-1 في كتاب النشاط ص 26–28، والإجابة عن السؤال 20-1 والسؤالين 2 و5 من أسئلة نهاية الوحدة الأولى.<\/p>","t":"إكمال ورقة العمل 4-1 في كتاب النشاط ص 26–28، والإجابة عن السؤال 20-1 والسؤالين 2 و5 من أسئلة نهاية الوحدة الأولى."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-1 نشاط الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)، الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>عدد الحصص:<\/b> 5 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–32 | كتاب النشاط: تمرين 2-1 ص 16–17، تمرين 3-1 ص 18–20، ورقة العمل 3-1 ص 23–25، ورقة العمل 4-1 ص 26–28<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><ol class=\"ol\"><li>يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء.<\/li><li>يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره.<\/div><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><ol class=\"ol\"><li>يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف.<\/li><li>يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة.<\/div><div class=\"psub\">الحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div><ol class=\"ol\"><li>يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط.<\/li><li>يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون.<\/div><div class=\"psub\">الحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل<\/div><ol class=\"ol\"><li>يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة).<\/li><li>يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة.<\/div><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><ol class=\"ol\"><li>يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا.<\/li><li>يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين.<\/div>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\n1. يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء.\n2. يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه.\nمخرج تعليمي آخر: يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره.\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\n1. يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف.\n2. يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية.\nمخرج تعليمي آخر: يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة.\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\n1. يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط.\n2. يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة.\nمخرج تعليمي آخر: يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون.\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\n1. يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة).\n2. يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط.\nمخرج تعليمي آخر: يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة.\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\n1. يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا.\n2. يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة.\nمخرج تعليمي آخر: يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين."},{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة).<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\n• يرتب فلزات من حيث نشاطها بالإشارة إلى تفاعلها مع الماء أو بخار الماء. ← تحليل\n• يصف تفاعل الحديد (الصوف الحديدي) مع بخار الماء ونواتجه. ← فهم\n• يستنتج سبب عدم تفاعل النحاس مع الماء أو بخاره. ← تحليل\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\n• يرتب فلزات حسب نشاطها من خلال تفاعلها مع حمض الهيدروكلوريك المخفف. ← تحليل\n• يستنتج ترتيبًا للنشاط الكيميائي بناءً على نتائج تجريبية. ← تحليل\n• يحدد المتغيرات التي تُضبط لعقد مقارنة عادلة. ← تطبيق\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\n• يرتب البوتاسيوم والصوديوم والكالسيوم والماغنيسيوم والألومنيوم والكربون والخارصين والحديد والهيدروجين والنحاس في سلسلة النشاط. ← تذكر\n• يصف سلسلة النشاط في ضوء ميل الفلزات إلى تكوين أيونات موجبة. ← فهم\n• يستخدم موقع الكربون في السلسلة لتحديد الأكاسيد التي يمكن اختزالها بالكربون. ← تطبيق\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\n• يصف تفاعل الفلز مع المحلول الأيوني لمركب فلز آخر أقل نشاطًا (الإزاحة). ← فهم\n• يتنبأ بحدوث الإزاحة من موقع الفلزين في سلسلة النشاط. ← تطبيق\n• يستنتج ترتيب نشاط فلزات من جدول نتائج الإزاحة. ← تحليل\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\n• يصف تفاعل الفلز مع أكسيد فلز آخر أقل نشاطًا. ← فهم\n• يحلل نتائج تجريبية لتفاعل فلزات مسحوقة مع أكاسيد مختلفة. ← تحليل\n• يربط الطاقة الحرارية المنطلقة في تفاعلات الإزاحة بالفرق في النشاط بين الفلزين. ← تحليل"},{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><div class=\"pills\"><span>ال
