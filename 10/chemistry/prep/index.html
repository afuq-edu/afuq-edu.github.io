الإزاحة (الإحلال) في المحاليل<\/div><p>يغمس مسمارًا حديديًا في محلول كبريتات النحاس II الأزرق ويسأل: ما الطبقة البنية التي تكونت على المسمار؟<\/p><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><p>مقطع لتفاعل الثرميت (الألومنيوم مع أكسيد الحديد III) في لحام قضبان السكك الحديدية؛ سؤال: لماذا يتكون حديد منصهر؟<\/p>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\nيعرض صورتين: قارب صيد من الألومنيوم في البحر، وقطعة صوديوم تتفاعل بعنف مع الماء؛ سؤال: لماذا لا تتفاعل كل الفلزات مع الماء بالشدة نفسها؟\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\nسؤال: كيف نصمم «سباقًا عادلًا» بين أربعة فلزات لمعرفة الأنشط؟\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\nيوزع بطاقات أسماء العناصر العشرة على طلبة ويطلب منهم الاصطفاف حسب النشاط.\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\nيغمس مسمارًا حديديًا في محلول كبريتات النحاس II الأزرق ويسأل: ما الطبقة البنية التي تكونت على المسمار؟\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\nمقطع لتفاعل الثرميت (الألومنيوم مع أكسيد الحديد III) في لحام قضبان السكك الحديدية؛ سؤال: لماذا يتكون حديد منصهر؟"},{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تفاعل الكالسيوم والماغنيسيوم مع الماء<\/td><td>يضع قطعة كالسيوم في ماء وشريط ماغنيسيوم في ماء بارد ويقارن.<\/td><td>يلاحظون فورانًا واضحًا مع الكالسيوم وبطئًا شديدًا مع الماغنيسيوم.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">النشاط 2-1 تفاعل الصوف الحديدي مع بخار الماء (عرض المعلم)<\/td><td>يسخن الصوف الحديدي مع بخار ناتج من صوف معدني مبلل، ويجمع الغاز فوق الماء ويختبره بالشظية المشتعلة، مع الحذر من ارتداد الماء.<\/td><td>يسجلون الملاحظات ويكتبون: الحديد + بخار الماء ← أكسيد الحديد + الهيدروجين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ترتيب مبدئي<\/td><td>يطلب ترتيب K وNa وCa وMg وFe وCu حسب تفاعلها مع الماء أو البخار.<\/td><td>يرتبون ويبررون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون شروط المقارنة.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 3-1 تحديد ترتيب النشاط الكيميائي لبعض الفلزات (كتاب الطالب)<\/td><td>يوجه إلى وضع قطع متساوية من Mg وZn وFe وCu في كميات متساوية من الحمض نفسه وقياس ارتفاع الحرارة.<\/td><td>يسجلون شدة الفوران وارتفاع الحرارة ويرتبون الفلزات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلات<\/td><td>يكتب على السبورة الذكية: الماغنيسيوم + حمض الهيدروكلوريك ← كلوريد الماغنيسيوم + الهيدروجين، و <bdi>Mg + 2HCl → MgCl₂ + H₂<\/bdi>.<\/td><td>يكتبون معادلة الخارصين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">المقارنة العادلة<\/td><td>يناقش المتغيرات الثابتة.<\/td><td>يحددونها.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة: الاصطفاف<\/td><td>يوزع البطاقات ويتابع الاصطفاف.<\/td><td>يصطفون ويناقشون مواضعهم.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">بناء السلسلة (كتاب الطالب ص 27–28)<\/td><td>يعرض السلسلة ويضيف الكربون والهيدروجين مرجعين للمقارنة.<\/td><td>يكتبون السلسلة بعبارة تذكر من ابتكارهم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تكوين الأيونات الموجبة<\/td><td>يوضح أن الفلز الأنشط يفقد إلكتروناته بسهولة أكبر ليكوّن أيونًا موجبًا.<\/td><td>يكتبون K⁺ وMg²⁺ وAl³⁺ ويقارنون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من المسابقة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 4-1 تفاعلات إزاحة الفلزات – المحاليل (كتاب الطالب ص 29–31)<\/td><td>يوجه إلى وضع قطع الفلزات في محاليل أملاح الفلزات الأخرى في جدول شبكي.<\/td><td>يسجلون ظهور طبقة فلز أو تغير لون المحلول ويضعون علامة حدوث التفاعل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلات<\/td><td>يكتب على السبورة الذكية: <bdi>Zn + CuSO₄ → ZnSO₄ + Cu<\/bdi>.<\/td><td>يكتبون معادلة الحديد مع كبريتات النحاس II.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الاستنتاج<\/td><td>يربط عدد التفاعلات لكل فلز بنشاطه.<\/td><td>يرتبون الفلزات من جدولهم.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الإزاحة مع الأكاسيد<\/td><td>يكتب: الماغنيسيوم + أكسيد النحاس II ← أكسيد الماغنيسيوم + النحاس، و <bdi>2Al + Fe₂O₃ → Al₂O₃ + 2Fe<\/bdi>.<\/td><td>يحددون الفلز الذي فقد الأكسجين والذي اكتسبه.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">ورقة العمل 4-1 تفاعل فلزات مسحوقة مع أكاسيد فلزات مختلفة (كتاب النشاط ص 26–28)<\/td><td>يوجه إلى تحليل جدول النتائج وارتفاع درجة الحرارة.<\/td><td>يستنتجون أن ارتفاع الحرارة أكبر كلما زاد الفرق في النشاط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يقترحون أسبابًا.\n\n(12 دقيقة) تفاعل الكالسيوم والماغنيسيوم مع الماء\nدور المعلم: يضع قطعة كالسيوم في ماء وشريط ماغنيسيوم في ماء بارد ويقارن.\nدور الطالب: يلاحظون فورانًا واضحًا مع الكالسيوم وبطئًا شديدًا مع الماغنيسيوم.\n\n(13 دقيقة) النشاط 2-1 تفاعل الصوف الحديدي مع بخار الماء (عرض المعلم)\nدور المعلم: يسخن الصوف الحديدي مع بخار ناتج من صوف معدني مبلل، ويجمع الغاز فوق الماء ويختبره بالشظية المشتعلة، مع الحذر من ارتداد الماء.\nدور الطالب: يسجلون الملاحظات ويكتبون: الحديد + بخار الماء ← أكسيد الحديد + الهيدروجين.\n\n(5 دقائق) ترتيب مبدئي\nدور المعلم: يطلب ترتيب K وNa وCa وMg وFe وCu حسب تفاعلها مع الماء أو البخار.\nدور الطالب: يرتبون ويبررون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون شروط المقارنة.\n\n(17 دقيقة) النشاط 3-1 تحديد ترتيب النشاط الكيميائي لبعض الفلزات (كتاب الطالب)\nدور المعلم: يوجه إلى وضع قطع متساوية من Mg وZn وFe وCu في كميات متساوية من الحمض نفسه وقياس ارتفاع الحرارة.\nدور الطالب: يسجلون شدة الفوران وارتفاع الحرارة ويرتبون الفلزات.\n\n(8 دقائق) المعادلات\nدور المعلم: يكتب على السبورة الذكية: الماغنيسيوم + حمض الهيدروكلوريك ← كلوريد الماغنيسيوم + الهيدروجين، و Mg + 2HCl → MgCl₂ + H₂.\nدور الطالب: يكتبون معادلة الخارصين.\n\n(5 دقائق) المقارنة العادلة\nدور المعلم: يناقش المتغيرات الثابتة.\nدور الطالب: يحددونها.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\n(6 دقائق) التهيئة: الاصطفاف\nدور المعلم: يوزع البطاقات ويتابع الاصطفاف.\nدور الطالب: يصطفون ويناقشون مواضعهم.\n\n(12 دقيقة) بناء السلسلة (كتاب الطالب ص 27–28)\nدور المعلم: يعرض السلسلة ويضيف الكربون والهيدروجين مرجعين للمقارنة.\nدور الطالب: يكتبون السلسلة بعبارة تذكر من ابتكارهم.\n\n(10 دقائق) تكوين الأيونات الموجبة\nدور المعلم: يوضح أن الفلز الأنشط يفقد إلكتروناته بسهولة أكبر ليكوّن أيونًا موجبًا.\nدور الطالب: يكتبون K⁺ وMg²⁺ وAl³⁺ ويقارنون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من المسابقة.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون.\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\n(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 4-1 تفاعلات إزاحة الفلزات – المحاليل (كتاب الطالب ص 29–31)\nدور المعلم: يوجه إلى وضع قطع الفلزات في محاليل أملاح الفلزات الأخرى في جدول شبكي.\nدور الطالب: يسجلون ظهور طبقة فلز أو تغير لون المحلول ويضعون علامة حدوث التفاعل.\n\n(8 دقائق) المعادلات\nدور المعلم: يكتب على السبورة الذكية: Zn + CuSO₄ → ZnSO₄ + Cu.\nدور الطالب: يكتبون معادلة الحديد مع كبريتات النحاس II.\n\n(5 دقائق) الاستنتاج\nدور المعلم: يربط عدد التفاعلات لكل فلز بنشاطه.\nدور الطالب: يرتبون الفلزات من جدولهم.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\n(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الإزاحة مع الأكاسيد\nدور المعلم: يكتب: الماغنيسيوم + أكسيد النحاس II ← أكسيد الماغنيسيوم + النحاس، و 2Al + Fe₂O₃ → Al₂O₃ + 2Fe.\nدور الطالب: يحددون الفلز الذي فقد الأكسجين والذي اكتسبه.\n\n(12 دقيقة) ورقة العمل 4-1 تفاعل فلزات مسحوقة مع أكاسيد فلزات مختلفة (كتاب النشاط ص 26–28)\nدور المعلم: يوجه إلى تحليل جدول النتائج وارتفاع درجة الحرارة.\nدور الطالب: يستنتجون أن ارتفاع الحرارة أكبر كلما زاد الفرق في النشاط.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي الفلزين يتفاعل مع الماء البارد: الكالسيوم أم النحاس؟<\/td><td>الكالسيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نواتج تفاعل الحديد الساخن مع بخار الماء؟<\/td><td>أكسيد الحديد وغاز الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتاج الماغنيسيوم إلى بخار الماء ليتفاعل بسرعة، بينما يتفاعل الصوديوم مع الماء البارد؟<\/td><td>لأن الماغنيسيوم أقل نشاطًا من الصوديوم، فيحتاج إلى طاقة أكبر ليتفاعل بسرعة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الغاز المتصاعد عند تفاعل الماغنيسيوم مع الحمض المخفف؟<\/td><td>الهيدروجين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب Mg وZn وFe وCu تنازليًا حسب شدة تفاعلها مع الحمض.<\/td><td>Mg ثم Zn ثم Fe ثم Cu (لا يتفاعل).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر ثلاثة متغيرات تُضبط في النشاط لجعل المقارنة عادلة.<\/td><td>حجم الحمض وتركيزه، وكتلة الفلز ومساحة سطحه، ودرجة الحرارة الابتدائية.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أيهما أنشط: الألومنيوم أم الخارصين؟<\/td><td>الألومنيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يعني أن الفلز أعلى في سلسلة النشاط؟<\/td><td>أنه أكثر ميلًا لفقد الإلكترونات وتكوين أيونات موجبة، فيتفاعل بشدة أكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أي الأكسيدين يمكن اختزاله بالكربون: أكسيد الماغنيسيوم أم أكسيد الخارصين؟ برر.<\/td><td>أكسيد الخارصين؛ لأن الخارصين أدنى من الكربون في السلسلة، أما الماغنيسيوم فأعلى منه.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث عند وضع شريط ماغنيسيوم في محلول كبريتات النحاس II؟<\/td><td>يترسب النحاس البني ويبهت لون المحلول الأزرق، لأن الماغنيسيوم أنشط من النحاس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل يحدث تفاعل عند وضع النحاس في محلول كبريتات الخارصين؟ برر.<\/td><td>لا؛ لأن النحاس أقل نشاطًا من الخارصين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في جدول نتائج: الفلز A أزاح فلزين، وB أزاح فلزًا واحدًا، وC لم يُزح أيًا منها. رتب الفلزات.<\/td><td>A أنشطها ثم B ثم C.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>هل يتفاعل النحاس مع أكسيد الماغنيسيوم؟ لماذا؟<\/td><td>لا؛ لأن النحاس أقل نشاطًا من الماغنيسيوم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة اللفظية لتفاعل الألومنيوم مع أكسيد الحديد III.<\/td><td>الألومنيوم + أكسيد الحديد III ← أكسيد الألومنيوم + الحديد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون ارتفاع الحرارة عند تسخين الماغنيسيوم مع أكسيد النحاس أكبر منه مع أكسيد الحديد؟<\/td><td>لأن الفرق في النشاط بين الماغنيسيوم والنحاس أكبر، فتنطلق طاقة أكبر.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\n1) [مستوى الدعم] أي الفلزين يتفاعل مع الماء البارد: الكالسيوم أم النحاس؟\nالإجابة النموذجية: الكالسيوم.\n\n2) [المستوى المتوقع] ما نواتج تفاعل الحديد الساخن مع بخار الماء؟\nالإجابة النموذجية: أكسيد الحديد وغاز الهيدروجين.\n\n3) [المستوى المتقدم] لماذا يحتاج الماغنيسيوم إلى بخار الماء ليتفاعل بسرعة، بينما يتفاعل الصوديوم مع الماء البارد؟\nالإجابة النموذجية: لأن الماغنيسيوم أقل نشاطًا من الصوديوم، فيحتاج إلى طاقة أكبر ليتفاعل بسرعة.\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\n1) [مستوى الدعم] ما الغاز المتصاعد عند تفاعل الماغنيسيوم مع الحمض المخفف؟\nالإجابة النموذجية: الهيدروجين.\n\n2) [المستوى المتوقع] رتب Mg وZn وFe وCu تنازليًا حسب شدة تفاعلها مع الحمض.\nالإجابة النموذجية: Mg ثم Zn ثم Fe ثم Cu (لا يتفاعل).\n\n3) [المستوى المتقدم] اذكر ثلاثة متغيرات تُضبط في النشاط لجعل المقارنة عادلة.\nالإجابة النموذجية: حجم الحمض وتركيزه، وكتلة الفلز ومساحة سطحه، ودرجة الحرارة الابتدائية.\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\n1) [مستوى الدعم] أيهما أنشط: الألومنيوم أم الخارصين؟\nالإجابة النموذجية: الألومنيوم.\n\n2) [المستوى المتوقع] ماذا يعني أن الفلز أعلى في سلسلة النشاط؟\nالإجابة النموذجية: أنه أكثر ميلًا لفقد الإلكترونات وتكوين أيونات موجبة، فيتفاعل بشدة أكبر.\n\n3) [المستوى المتقدم] أي الأكسيدين يمكن اختزاله بالكربون: أكسيد الماغنيسيوم أم أكسيد الخارصين؟ برر.\nالإجابة النموذجية: أكسيد الخارصين؛ لأن الخارصين أدنى من الكربون في السلسلة، أما الماغنيسيوم فأعلى منه.\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\n1) [مستوى الدعم] ماذا يحدث عند وضع شريط ماغنيسيوم في محلول كبريتات النحاس II؟\nالإجابة النموذجية: يترسب النحاس البني ويبهت لون المحلول الأزرق، لأن الماغنيسيوم أنشط من النحاس.\n\n2) [المستوى المتوقع] هل يحدث تفاعل عند وضع النحاس في محلول كبريتات الخارصين؟ برر.\nالإجابة النموذجية: لا؛ لأن النحاس أقل نشاطًا من الخارصين.\n\n3) [المستوى المتقدم] في جدول نتائج: الفلز A أزاح فلزين، وB أزاح فلزًا واحدًا، وC لم يُزح أيًا منها. رتب الفلزات.\nالإجابة النموذجية: A أنشطها ثم B ثم C.\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\n1) [مستوى الدعم] هل يتفاعل النحاس مع أكسيد الماغنيسيوم؟ لماذا؟\nالإجابة النموذجية: لا؛ لأن النحاس أقل نشاطًا من الماغنيسيوم.\n\n2) [المستوى المتوقع] اكتب المعادلة اللفظية لتفاعل الألومنيوم مع أكسيد الحديد III.\nالإجابة النموذجية: الألومنيوم + أكسيد الحديد III ← أكسيد الألومنيوم + الحديد.\n\n3) [المستوى المتقدم] لماذا يكون ارتفاع الحرارة عند تسخين الماغنيسيوم مع أكسيد النحاس أكبر منه مع أكسيد الحديد؟\nالإجابة النموذجية: لأن الفرق في النشاط بين الماغنيسيوم والنحاس أكبر، فتنطلق طاقة أكبر."},{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُختبر غاز الهيدروجين بـ ......... فيحترق بفرقعة.<\/td><td>الشظية المشتعلة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب تصاعديًا حسب النشاط: Fe، Na، Cu، Mg.<\/td><td>Cu ثم Fe ثم Mg ثم Na.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُرفع أنبوب التوصيل من الماء قبل إطفاء اللهب في نشاط البخار؟<\/td><td>لمنع ارتداد الماء البارد إلى الأنبوب الساخن فيتكسر.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يتفاعل النحاس مع حمض الهيدروكلوريك المخفف مطلقًا الهيدروجين.<\/td><td>خطأ؛ النحاس لا يتفاعل معه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية لتفاعل الخارصين مع حمض الهيدروكلوريك.<\/td><td><bdi>Zn + 2HCl → ZnCl₂ + H₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد قياس ارتفاع درجة الحرارة طريقة جيدة لمقارنة النشاط؟<\/td><td>لأن الفلز الأنشط يتفاعل أسرع وينتج طاقة حرارية أكبر في الزمن نفسه، فيمكن مقارنة النتائج كميًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل الترتيب: K، Na، .........، Mg، Al، C، Zn، .........، H، Cu.<\/td><td>Ca – Fe.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الفلزات التي تتفاعل مع الأحماض المخففة مطلقة الهيدروجين؟<\/td><td>الفلزات التي تقع فوق الهيدروجين في سلسلة النشاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فلز X يتفاعل مع البخار لا مع الماء البارد، ولا يُختزل أكسيده بالكربون. أين موقعه؟<\/td><td>بين الكالسيوم والكربون، مثل الماغنيسيوم.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلز الأنشط ......... الفلز الأقل نشاطًا من محلول مركبه.<\/td><td>يزيح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية لتفاعل الحديد مع كبريتات النحاس II.<\/td><td><bdi>Fe + CuSO₄ → FeSO₄ + Cu<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يبهت اللون الأزرق لمحلول كبريتات النحاس II بعد إضافة الخارصين؟<\/td><td>لأن أيونات النحاس الزرقاء تتحول إلى ذرات نحاس، وتحل محلها أيونات الخارصين عديمة اللون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تفاعلات الإزاحة بين الفلزات وأكاسيد الفلزات طاردة للحرارة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: <bdi>Mg + CuO<\/bdi> → ......... + .........<\/td><td><bdi>MgO + Cu<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح فلزًا يمكنه إزاحة الخارصين من أكسيده واكتب المعادلة الرمزية.<\/td><td>الماغنيسيوم: <bdi>Mg + ZnO → MgO + Zn<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\n1) [مستوى الدعم] أكمل: يُختبر غاز الهيدروجين بـ ......... فيحترق بفرقعة.\nالإجابة النموذجية: الشظية المشتعلة.\n\n2) [المستوى المتوقع] رتب تصاعديًا حسب النشاط: Fe، Na، Cu، Mg.\nالإجابة النموذجية: Cu ثم Fe ثم Mg ثم Na.\n\n3) [المستوى المتقدم] لماذا يُرفع أنبوب التوصيل من الماء قبل إطفاء اللهب في نشاط البخار؟\nالإجابة النموذجية: لمنع ارتداد الماء البارد إلى الأنبوب الساخن فيتكسر.\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\n1) [مستوى الدعم] صواب أم خطأ: يتفاعل النحاس مع حمض الهيدروكلوريك المخفف مطلقًا الهيدروجين.\nالإجابة النموذجية: خطأ؛ النحاس لا يتفاعل معه.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية لتفاعل الخارصين مع حمض الهيدروكلوريك.\nالإجابة النموذجية: Zn + 2HCl → ZnCl₂ + H₂\n\n3) [المستوى المتقدم] لماذا يُعد قياس ارتفاع درجة الحرارة طريقة جيدة لمقارنة النشاط؟\nالإجابة النموذجية: لأن الفلز الأنشط يتفاعل أسرع وينتج طاقة حرارية أكبر في الزمن نفسه، فيمكن مقارنة النتائج كميًا.\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\n1) [مستوى الدعم] أكمل الترتيب: K، Na، .........، Mg، Al، C، Zn، .........، H، Cu.\nالإجابة النموذجية: Ca – Fe.\n\n2) [المستوى المتوقع] ما الفلزات التي تتفاعل مع الأحماض المخففة مطلقة الهيدروجين؟\nالإجابة النموذجية: الفلزات التي تقع فوق الهيدروجين في سلسلة النشاط.\n\n3) [المستوى المتقدم] فلز X يتفاعل مع البخار لا مع الماء البارد، ولا يُختزل أكسيده بالكربون. أين موقعه؟\nالإجابة النموذجية: بين الكالسيوم والكربون، مثل الماغنيسيوم.\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\n1) [مستوى الدعم] أكمل: الفلز الأنشط ......... الفلز الأقل نشاطًا من محلول مركبه.\nالإجابة النموذجية: يزيح.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية لتفاعل الحديد مع كبريتات النحاس II.\nالإجابة النموذجية: Fe + CuSO₄ → FeSO₄ + Cu\n\n3) [المستوى المتقدم] لماذا يبهت اللون الأزرق لمحلول كبريتات النحاس II بعد إضافة الخارصين؟\nالإجابة النموذجية: لأن أيونات النحاس الزرقاء تتحول إلى ذرات نحاس، وتحل محلها أيونات الخارصين عديمة اللون.\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\n1) [مستوى الدعم] صواب أم خطأ: تفاعلات الإزاحة بين الفلزات وأكاسيد الفلزات طاردة للحرارة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أكمل: Mg + CuO → ......... + .........\nالإجابة النموذجية: MgO + Cu\n\n3) [المستوى المتقدم] اقترح فلزًا يمكنه إزاحة الخارصين من أكسيده واكتب المعادلة الرمزية.\nالإجابة النموذجية: الماغنيسيوم: Mg + ZnO → MgO + Zn."},{"h":"<div class=\"psub\">الحصة 1: تفاعل الفلزات مع الماء وبخار الماء<\/div><p>مراجعة كتاب الطالب ص 23–26 والإجابة عن السؤال 14-1، والبدء في تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17.<\/p><div class=\"psub\">الحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف<\/div><p>إكمال تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17، والإجابة عن السؤالين 15-1 و16-1.<\/p><div class=\"psub\">الحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين<\/div><p>حفظ سلسلة النشاط من كتاب الطالب ص 27–28 والإجابة عن السؤالين 17-1 و18-1، وحل ورقة العمل 3-1 الفلزات والنشاط الكيميائي في كتاب النشاط ص 23–25.<\/p><div class=\"psub\">الحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل<\/div><p>حل تمرين 3-1 إنتاج الطاقة من تفاعلات الإزاحة في كتاب النشاط ص 18–20، والإجابة عن السؤال 19-1.<\/p><div class=\"psub\">الحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج<\/div><p>إكمال ورقة العمل 4-1 في كتاب النشاط ص 26–28، والإجابة عن السؤال 20-1 والسؤالين 2 و5 من أسئلة نهاية الوحدة الأولى.<\/p>","t":"الحصة 1: تفاعل الفلزات مع الماء وبخار الماء\nمراجعة كتاب الطالب ص 23–26 والإجابة عن السؤال 14-1، والبدء في تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17.\n\nالحصة 2: تفاعل الفلزات مع حمض الهيدروكلوريك المخفف\nإكمال تمرين 2-1 سلسلة النشاط الكيميائي للفلزات في كتاب النشاط ص 16–17، والإجابة عن السؤالين 15-1 و16-1.\n\nالحصة 3: سلسلة النشاط الكيميائي وموقعا الكربون والهيدروجين\nحفظ سلسلة النشاط من كتاب الطالب ص 27–28 والإجابة عن السؤالين 17-1 و18-1، وحل ورقة العمل 3-1 الفلزات والنشاط الكيميائي في كتاب النشاط ص 23–25.\n\nالحصة 4: تفاعلات الإزاحة (الإحلال) في المحاليل\nحل تمرين 3-1 إنتاج الطاقة من تفاعلات الإزاحة في كتاب النشاط ص 18–20، والإجابة عن السؤال 19-1.\n\nالحصة 5: الإزاحة مع أكاسيد الفلزات وتحليل النتائج\nإكمال ورقة العمل 4-1 في كتاب النشاط ص 26–28، والإجابة عن السؤال 20-1 والسؤالين 2 و5 من أسئلة نهاية الوحدة الأولى."}]}},{"label":"مراجعة الوحدة الأولى وأسئلة نهاية الوحدة","unit":"الوحدة الأولى: الفلزات وخصائصها","periods":[{"n":1,"focus":"حل أسئلة نهاية الوحدة الأولى","info":"<div><b>الدرس:<\/b> مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 33–34 | كتاب النشاط: مراجعة تمارين الوحدة وأوراق عملها ص 15–28<\/div><div><b>دليل المعلم:<\/b> ص 37<\/div><div><b>محور الحصة:<\/b> حل أسئلة نهاية الوحدة الأولى<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يطبق مفاهيم الرابطة الفلزية والعناصر الانتقالية والفلزات القلوية وسلسلة النشاط في حل أسئلة نهاية الوحدة.<\/li><li>ينظم مفاهيم الوحدة الأولى في خريطة مفاهيم.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم إجابات زملائه وفق معايير دقة المصطلح والمعادلة.<\/div>","t":"1. يطبق مفاهيم الرابطة الفلزية والعناصر الانتقالية والفلزات القلوية وسلسلة النشاط في حل أسئلة نهاية الوحدة.\n2. ينظم مفاهيم الوحدة الأولى في خريطة مفاهيم.\nمخرج تعليمي آخر: يقيّم إجابات زملائه وفق معايير دقة المصطلح والمعادلة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يطبق مفاهيم الرابطة الفلزية والعناصر الانتقالية والفلزات القلوية وسلسلة النشاط في حل أسئلة نهاية الوحدة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>ينظم مفاهيم الوحدة الأولى في خريطة مفاهيم.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقيّم إجابات زملائه وفق معايير دقة المصطلح والمعادلة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يطبق مفاهيم الرابطة الفلزية والعناصر الانتقالية والفلزات القلوية وسلسلة النشاط في حل أسئلة نهاية الوحدة. ← تطبيق\n• ينظم مفاهيم الوحدة الأولى في خريطة مفاهيم. ← فهم\n• يقيّم إجابات زملائه وفق معايير دقة المصطلح والمعادلة. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم الذاتي<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم الذاتي\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"pills\"><span>الرابطة الفلزية<\/span><span>العناصر الانتقالية<\/span><span>الفلزات القلوية<\/span><span>سلسلة النشاط<\/span><span>تفاعلات الإزاحة<\/span><\/div>","t":"الرابطة الفلزية، العناصر الانتقالية، الفلزات القلوية، سلسلة النشاط، تفاعلات الإزاحة"},{"h":"<p>يعرض سلسلة النشاط بفراغات ويطلب إكمالها خلال دقيقتين.<\/p>","t":"يعرض سلسلة النشاط بفراغات ويطلب إكمالها خلال دقيقتين."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض السلسلة الناقصة على السبورة الذكية.<\/td><td>يكملونها.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">خريطة المفاهيم<\/td><td>يوجه إلى ربط مفاهيم الوحدة في خريطة.<\/td><td>يبنون الخريطة في مجموعات.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الأولى (كتاب الطالب ص 33–34)<\/td><td>يوزع الأسئلة على المجموعات ويتابع.<\/td><td>يحلون ويعرض ممثل كل مجموعة الحل.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض السلسلة الناقصة على السبورة الذكية.\nدور الطالب: يكملونها.\n\n(8 دقائق) خريطة المفاهيم\nدور المعلم: يوجه إلى ربط مفاهيم الوحدة في خريطة.\nدور الطالب: يبنون الخريطة في مجموعات.\n\n(15 دقيقة) أسئلة نهاية الوحدة الأولى (كتاب الطالب ص 33–34)\nدور المعلم: يوزع الأسئلة على المجموعات ويتابع.\nدور الطالب: يحلون ويعرض ممثل كل مجموعة الحل.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر خاصيتين تميزان العناصر الانتقالية عن الفلزات القلوية.<\/td><td>الكثافة العالية ودرجة الانصهار المرتفعة، وتكوين مركبات ملونة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة رمزية موزونة لتفاعل البوتاسيوم مع الماء.<\/td><td><bdi>2K + 2H₂O → 2KOH + H₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر بالرابطة الفلزية توصيل الحديد للكهرباء في الحالتين الصلبة والسائلة.<\/td><td>لأن الإلكترونات الحرة موجودة في الحالتين وتتحرك حاملة التيار.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر خاصيتين تميزان العناصر الانتقالية عن الفلزات القلوية.\nالإجابة النموذجية: الكثافة العالية ودرجة الانصهار المرتفعة، وتكوين مركبات ملونة.\n\n2) [المستوى المتوقع] اكتب معادلة رمزية موزونة لتفاعل البوتاسيوم مع الماء.\nالإجابة النموذجية: 2K + 2H₂O → 2KOH + H₂\n\n3) [المستوى المتقدم] فسّر بالرابطة الفلزية توصيل الحديد للكهرباء في الحالتين الصلبة والسائلة.\nالإجابة النموذجية: لأن الإلكترونات الحرة موجودة في الحالتين وتتحرك حاملة التيار."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلز الذي يقع أسفل الهيدروجين في السلسلة ......... مع الحمض المخفف.<\/td><td>لا يتفاعل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب تنازليًا حسب النشاط: Zn، K، Cu، Mg.<\/td><td>K ثم Mg ثم Zn ثم Cu.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فلز X يزيح النحاس من محلول كبريتات النحاس، ولا يزيح الخارصين من محلول كبريتات الخارصين، ويتفاعل ببطء مع الحمض. حدد موقعه واقترح اسمه.<\/td><td>بين الخارصين والنحاس وفوق الهيدروجين؛ وهو الحديد على الأرجح.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الفلز الذي يقع أسفل الهيدروجين في السلسلة ......... مع الحمض المخفف.\nالإجابة النموذجية: لا يتفاعل.\n\n2) [المستوى المتوقع] رتب تنازليًا حسب النشاط: Zn، K، Cu، Mg.\nالإجابة النموذجية: K ثم Mg ثم Zn ثم Cu.\n\n3) [المستوى المتقدم] فلز X يزيح النحاس من محلول كبريتات النحاس، ولا يزيح الخارصين من محلول كبريتات الخارصين، ويتفاعل ببطء مع الحمض. حدد موقعه واقترح اسمه.\nالإجابة النموذجية: بين الخارصين والنحاس وفوق الهيدروجين؛ وهو الحديد على الأرجح."},{"h":"<p>إكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب ص 33–34، ومراجعة تمارين الوحدة وأوراق عملها في كتاب النشاط، والاستعداد للوحدة الثانية: استخلاص الفلزات (ص 35).<\/p>","t":"إكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب ص 33–34، ومراجعة تمارين الوحدة وأوراق عملها في كتاب النشاط، والاستعداد للوحدة الثانية: استخلاص الفلزات (ص 35)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الفلزات وخصائصها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 33–34 | كتاب النشاط: مراجعة تمارين الوحدة وأوراق عملها ص 15–28<\/div><div><b>دليل المعلم:<\/b> ص 37<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: حل أسئلة نهاية الوحدة الأولى<\/div><ol class=\"ol\"><li>يطبق مفاهيم الرابطة الفلزية والعناصر الانتقالية والفلزات القلوية وسلسلة النشاط في حل أسئلة نهاية الوحدة.<\/li><li>ينظم مفاهيم الوحدة الأولى في خريطة مفاهيم.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم إجابات زملائه وفق معايير دقة المصطلح والمعادلة.<\/div>","t":"الحصة 1: حل أسئلة نهاية الوحدة الأولى\n1. يطبق مفاهيم الرابطة الفلزية والعن  class=\"ev\">مستوى الدعم<\/td><td>اذكر خاصيتين تميزان العناصر الانتقالية عن الفلزات القلوية.<\/td><td>الكثافة العالية ودرجة الانصهار المرتفعة، وتكوين مركبات ملونة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب معادلة رمزية موزونة لتفاعل البوتاسيوم مع الماء.<\/td><td><bdi>2K + 2H₂O → 2KOH + H₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر بالرابطة الفلزية توصيل الحديد للكهرباء في الحالتين الصلبة والسائلة.<\/td><td>لأن الإلكترونات الحرة موجودة في الحالتين وتتحرك حاملة التيار.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حل أسئلة نهاية الوحدة الأولى\n1) [مستوى الدعم] اذكر خاصيتين تميزان العناصر الانتقالية عن الفلزات القلوية.\nالإجابة النموذجية: الكثافة العالية ودرجة الانصهار المرتفعة، وتكوين مركبات ملونة.\n\n2) [المستوى المتوقع] اكتب معادلة رمزية موزونة لتفاعل البوتاسيوم مع الماء.\nالإجابة النموذجية: 2K + 2H₂O → 2KOH + H₂\n\n3) [المستوى المتقدم] فسّر بالرابطة الفلزية توصيل الحديد للكهرباء في الحالتين الصلبة والسائلة.\nالإجابة النموذجية: لأن الإلكترونات الحرة موجودة في الحالتين وتتحرك حاملة التيار."},{"h":"<div class=\"psub\">الحصة 1: حل أسئلة نهاية الوحدة الأولى<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلز الذي يقع أسفل الهيدروجين في السلسلة ......... مع الحمض المخفف.<\/td><td>لا يتفاعل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب تنازليًا حسب النشاط: Zn، K، Cu، Mg.<\/td><td>K ثم Mg ثم Zn ثم Cu.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فلز X يزيح النحاس من محلول كبريتات النحاس، ولا يزيح الخارصين من محلول كبريتات الخارصين، ويتفاعل ببطء مع الحمض. حدد موقعه واقترح اسمه.<\/td><td>بين الخارصين والنحاس وفوق الهيدروجين؛ وهو الحديد على الأرجح.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حل أسئلة نهاية الوحدة الأولى\n1) [مستوى الدعم] أكمل: الفلز الذي يقع أسفل الهيدروجين في السلسلة ......... مع الحمض المخفف.\nالإجابة النموذجية: لا يتفاعل.\n\n2) [المستوى المتوقع] رتب تنازليًا حسب النشاط: Zn، K، Cu، Mg.\nالإجابة النموذجية: K ثم Mg ثم Zn ثم Cu.\n\n3) [المستوى المتقدم] فلز X يزيح النحاس من محلول كبريتات النحاس، ولا يزيح الخارصين من محلول كبريتات الخارصين، ويتفاعل ببطء مع الحمض. حدد موقعه واقترح اسمه.\nالإجابة النموذجية: بين الخارصين والنحاس وفوق الهيدروجين؛ وهو الحديد على الأرجح."},{"h":"<div class=\"psub\">الحصة 1: حل أسئلة نهاية الوحدة الأولى<\/div><p>إكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب ص 33–34، ومراجعة تمارين الوحدة وأوراق عملها في كتاب النشاط، والاستعداد للوحدة الثانية: استخلاص الفلزات (ص 35).<\/p>","t":"الحصة 1: حل أسئلة نهاية الوحدة الأولى\nإكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب ص 33–34، ومراجعة تمارين الوحدة وأوراق عملها في كتاب النشاط، والاستعداد للوحدة الثانية: استخلاص الفلزات (ص 35)."}]}},{"label":"1-2 استخلاص الفلزات","unit":"الوحدة الثانية: استخلاص الفلزات واستخداماتها","periods":[{"n":1,"focus":"الخامات وطرائق الاستخلاص وسلسلة النشاط","info":"<div><b>الدرس:<\/b> 1-2 استخلاص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 35–38 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 39–40<\/div><div><b>محور الحصة:<\/b> الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا.<\/li><li>يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر وجود الذهب حرًا غير متحد في الطبيعة.<\/div>","t":"1. يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا.\n2. يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط.\nمخرج تعليمي آخر: يفسر وجود الذهب حرًا غير متحد في الطبيعة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يفسر وجود الذهب حرًا غير متحد في الطبيعة.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا. ← فهم\n• يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط. ← تحليل\n• يفسر وجود الذهب حرًا غير متحد في الطبيعة. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التشاركي<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التشاركي\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: عينات خامات أو صورها (هيماتيت، بوكسيت، مالاكيت)<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: عينات خامات أو صورها (هيماتيت، بوكسيت، مالاكيت)"},{"h":"<div class=\"pills\"><span>الخام<\/span><span>الاستخلاص<\/span><span>الاختزال بالكربون<\/span><span>التحليل الكهربائي<\/span><span>الفلزات الحرة<\/span><\/div>","t":"الخام، الاستخلاص، الاختزال بالكربون، التحليل الكهربائي، الفلزات الحرة"},{"h":"<p>يعرض عينة هيماتيت ومسمارًا حديديًا ويسأل: كيف تحول هذا الصخر الأحمر إلى هذا المسمار؟<\/p>","t":"يعرض عينة هيماتيت ومسمارًا حديديًا ويسأل: كيف تحول هذا الصخر الأحمر إلى هذا المسمار؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العينة والمسمار.<\/td><td>يقترحون خطوات التحويل.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الخامات<\/td><td>يعرّف الخام ويعرض أمثلة: الهيماتيت للحديد، والبوكسيت للألومنيوم.<\/td><td>يكملون جدولًا: الفلز، اسم الخام.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">السلسلة وطريقة الاستخلاص (كتاب الطالب ص 35–37)<\/td><td>يقسم السلسلة على السبورة الذكية: فوق الكربون (التحليل الكهربائي)، وتحت الكربون (الاختزال بالكربون)، والفلزات غير النشطة (توجد حرة).<\/td><td>يصنفون K وNa وCa وMg وAl وZn وFe وCu وAu حسب طريقة الاستخلاص.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">الأسئلة 1-2 إلى 3-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض العينة والمسمار.\nدور الطالب: يقترحون خطوات التحويل.\n\n(10 دقائق) الخامات\nدور المعلم: يعرّف الخام ويعرض أمثلة: الهيماتيت للحديد، والبوكسيت للألومنيوم.\nدور الطالب: يكملون جدولًا: الفلز، اسم الخام.\n\n(13 دقيقة) السلسلة وطريقة الاستخلاص (كتاب الطالب ص 35–37)\nدور المعلم: يقسم السلسلة على السبورة الذكية: فوق الكربون (التحليل الكهربائي)، وتحت الكربون (الاختزال بالكربون)، والفلزات غير النشطة (توجد حرة).\nدور الطالب: يصنفون K وNa وCa وMg وAl وZn وFe وCu وAu حسب طريقة الاستخلاص.\n\n(7 دقائق) الأسئلة 1-2 إلى 3-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالخام؟<\/td><td>صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا اقتصاديًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما طريقة استخلاص الألومنيوم؟ ولماذا؟<\/td><td>التحليل الكهربائي؛ لأنه أنشط من الكربون فلا يُختزل أكسيده به.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يوجد الذهب في الطبيعة حرًا غير متحد؟<\/td><td>لأنه غير نشط تقريبًا فلا يتفاعل مع الأكسجين أو الماء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بالخام؟\nالإجابة النموذجية: صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا اقتصاديًا.\n\n2) [المستوى المتوقع] ما طريقة استخلاص الألومنيوم؟ ولماذا؟\nالإجابة النموذجية: التحليل الكهربائي؛ لأنه أنشط من الكربون فلا يُختزل أكسيده به.\n\n3) [المستوى المتقدم] لماذا يوجد الذهب في الطبيعة حرًا غير متحد؟\nالإجابة النموذجية: لأنه غير نشط تقريبًا فلا يتفاعل مع الأكسجين أو الماء."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلزات الأدنى من الكربون في السلسلة تُستخلص بـ .........<\/td><td>الاختزال بالكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صنّف حسب طريقة الاستخلاص: الصوديوم، الحديد، الذهب.<\/td><td>الصوديوم بالتحليل الكهربائي، والحديد بالاختزال بالكربون، والذهب يوجد حرًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا استُخدم النحاس والحديد قبل الألومنيوم بآلاف السنين مع أن الألومنيوم أوفر في القشرة الأرضية؟<\/td><td>لأن النحاس والحديد يُستخلصان بالتسخين مع الكربون، بينما يحتاج الألومنيوم إلى التحليل الكهربائي الذي لم يكن متاحًا قديمًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الفلزات الأدنى من الكربون في السلسلة تُستخلص بـ .........\nالإجابة النموذجية: الاختزال بالكربون.\n\n2) [المستوى المتوقع] صنّف حسب طريقة الاستخلاص: الصوديوم، الحديد، الذهب.\nالإجابة النموذجية: الصوديوم بالتحليل الكهربائي، والحديد بالاختزال بالكربون، والذهب يوجد حرًا.\n\n3) [المستوى المتقدم] لماذا استُخدم النحاس والحديد قبل الألومنيوم بآلاف السنين مع أن الألومنيوم أوفر في القشرة الأرضية؟\nالإجابة النموذجية: لأن النحاس والحديد يُستخلصان بالتسخين مع الكربون، بينما يحتاج الألومنيوم إلى التحليل الكهربائي الذي لم يكن متاحًا قديمًا."},{"h":"<p>مراجعة كتاب الطالب ص 35–37 والإجابة عن الأسئلة 1-2 إلى 3-2، والبحث عن مواقع تعدين النحاس قديمًا في سلطنة عُمان.<\/p>","t":"مراجعة كتاب الطالب ص 35–37 والإجابة عن الأسئلة 1-2 إلى 3-2، والبحث عن مواقع تعدين النحاس قديمًا في سلطنة عُمان."}]},{"n":2,"focus":"استخلاص فلز من أكسيده باستخدام الفحم","info":"<div><b>الدرس:<\/b> 1-2 استخلاص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 35–38 | كتاب النشاط: لا يوجد تمرين ينتزع» الأكسجين من أكسيد النحاس، فماذا يبقى في الأنبوب؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 1-2 استخلاص فلز من الأكسيد باستخدام الفحم (كتاب الطالب)<\/td><td>يوجه إلى خلط أكسيد النحاس II بمسحوق الفحم وتسخينه بقوة ثم تفريغه في كأس ماء.<\/td><td>يلاحظون تحول المسحوق الأسود إلى حبيبات بنية محمرة من النحاس.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلة<\/td><td>يكتب على السبورة الذكية: <bdi>2CuO + C → 2Cu + CO₂<\/bdi> ويوضح فقد الأكسجين (اختزال) واكتسابه (أكسدة).<\/td><td>يحددون المادة المختزلة والمادة المؤكسدة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الأسئلة 4-2 إلى 6-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 1-2 استخلاص فلز من الأكسيد باستخدام الفحم (كتاب الطالب)\nدور المعلم: يوجه إلى خلط أكسيد النحاس II بمسحوق الفحم وتسخينه بقوة ثم تفريغه في كأس ماء.\nدور الطالب: يلاحظون تحول المسحوق الأسود إلى حبيبات بنية محمرة من النحاس.\n\n(8 دقائق) المعادلة\nدور المعلم: يكتب على السبورة الذكية: 2CuO + C → 2Cu + CO₂ ويوضح فقد الأكسجين (اختزال) واكتسابه (أكسدة).\nدور الطالب: يحددون المادة المختزلة والمادة المؤكسدة.\n\n(5 دقائق) الأسئلة 4-2 إلى 6-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما لون النحاس الناتج في النشاط؟<\/td><td>بني محمر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية لاختزال أكسيد النحاس II بالكربون.<\/td><td><bdi>2CuO + C → 2Cu + CO₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أي المادتين اختُزلت وأيهما تأكسدت في التفاعل؟ فسّر.<\/td><td>اختُزل أكسيد النحاس لأنه فقد الأكسجين، وتأكسد الكربون لأنه اكتسب الأكسجين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما لون النحاس الناتج في النشاط؟\nالإجابة النموذجية: بني محمر.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية لاختزال أكسيد النحاس II بالكربون.\nالإجابة النموذجية: 2CuO + C → 2Cu + CO₂\n\n3) [المستوى المتقدم] أي المادتين اختُزلت وأيهما تأكسدت في التفاعل؟ فسّر.\nالإجابة النموذجية: اختُزل أكسيد النحاس لأنه فقد الأكسجين، وتأكسد الكربون لأنه اكتسب الأكسجين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن استخلاص الماغنيسيوم من أكسيده بالتسخين مع الكربون.<\/td><td>خطأ؛ الماغنيسيوم أنشط من الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الغاز الناتج عن تسخين أكسيد فلز مع الكربون؟<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُفرغ ناتج التسخين في كأس ماء لرؤية النحاس؟<\/td><td>لأن الفحم الزائد خفيف فيطفو، بينما تترسب حبيبات النحاس الأثقل فتظهر بوضوح.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يمكن استخلاص الماغنيسيوم من أكسيده بالتسخين مع الكربون.\nالإجابة النموذجية: خطأ؛ الماغنيسيوم أنشط من الكربون.\n\n2) [المستوى المتوقع] ما الغاز الناتج عن تسخين أكسيد فلز مع الكربون؟\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n3) [المستوى المتقدم] لماذا يُفرغ ناتج التسخين في كأس ماء لرؤية النحاس؟\nالإجابة النموذجية: لأن الفحم الزائد خفيف فيطفو، بينما تترسب حبيبات النحاس الأثقل فتظهر بوضوح."},{"h":"<p>كتابة تقرير النشاط 1-2، والإجابة عن الأسئلة 4-2 إلى 6-2 في كتاب الطالب ص 36–37.<\/p>","t":"كتابة تقرير النشاط 1-2، والإجابة عن الأسئلة 4-2 إلى 6-2 في كتاب الطالب ص 36–37."}]},{"n":3,"focus":"الخامات موارد محدودة وإعادة تدوير الفلزات","info":"<div><b>الدرس:<\/b> 1-2 استخلاص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 35–38 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 39–40<\/div><div><b>محور الحصة:<\/b> الخامات موارد محدودة وإعادة تدوير الفلزات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف خامات الفلزات بأنها موارد محدودة.<\/li><li>يبرر الحاجة إلى إعادة تدوير الفلزات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها.<\/div>","t":"1. يصف خامات الفلزات بأنها موارد محدودة.\n2. يبرر الحاجة إلى إعادة تدوير الفلزات.\nمخرج تعليمي آخر: يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف خامات الفلزات بأنها موارد محدودة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يبرر الحاجة إلى إعادة تدوير الفلزات.<\/td><td class=\"lv\">تقييم<\/td><\/tr><tr><td>يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"• يصف خامات الفلزات بأنها موارد محدودة. ← فهم\n• يبرر الحاجة إلى إعادة تدوير الفلزات. ← تقييم\n• يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها. ← إبداع"},{"h":"<div class=\"pills\"><span>التعلم المبني على المشاريع<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على المشاريع\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot"},{"h":"<div class=\"pills\"><span>الموارد المحدودة<\/span><span>إعادة التدوير<\/span><span>الاستدامة<\/span><span>استهلاك الطاقة<\/span><\/div>","t":"الموارد المحدودة، إعادة التدوير، الاستدامة، استهلاك الطاقة"},{"h":"<p>يعرض علبة ألومنيوم فارغة ويسأل: ماذا يحدث لها بعد رميها؟ وما الذي نوفره لو أعدنا تدويرها؟<\/p>","t":"يعرض علبة ألومنيوم فارغة ويسأل: ماذا يحدث لها بعد رميها؟ وما الذي نوفره لو أعدنا تدويرها؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العلبة.<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">محدودية الخامات (كتاب الطالب ص 38)<\/td><td>يعرض مقطعًا عن التعدين وأثره البيئي.<\/td><td>يستخرجون فوائد التدوير: حفظ الخامات، وتوفير الطاقة، وتقليل النفايات والتلوث.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مشروع مصغر: حملة تدوير<\/td><td>يكلف المجموعات بتصميم خطة حملة مدرسية لجمع العلب.<\/td><td>يعرضون خططهم بإيجاز.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 7-2 و8-2<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض العلبة.\nدور الطالب: يجيبون.\n\n(10 دقائق) محدودية الخامات (كتاب الطالب ص 38)\nدور المعلم: يعرض مقطعًا عن التعدين وأثره البيئي.\nدور الطالب: يستخرجون فوائد التدوير: حفظ الخامات، وتوفير الطاقة، وتقليل النفايات والتلوث.\n\n(12 دقيقة) مشروع مصغر: حملة تدوير\nدور المعلم: يكلف المجموعات بتصميم خطة حملة مدرسية لجمع العلب.\nدور الطالب: يعرضون خططهم بإيجاز.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 7-2 و8-2\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا تُعد خامات الفلزات موارد محدودة؟<\/td><td>لأنها تكونت عبر ملايين السنين ولا تتجدد، وتنفد باستمرار التعدين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر فائدتين لإعادة تدوير الألومنيوم.<\/td><td>توفير الطاقة الكبيرة اللازمة للتحليل الكهربائي، والمحافظة على خام البوكسيت، وتقليل النفايات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قيّم القول: «لا داعي لإعادة التدوير ما دامت الخامات متوفرة اليوم».<\/td><td>قول خاطئ؛ فالخامات ستنفد، والتعدين يستهلك طاقة ويضر البيئة، وإعادة التدوير أقل كلفة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا تُعد خامات الفلزات موارد محدودة؟\nالإجابة النموذجية: لأنها تكونت عبر ملايين السنين ولا تتجدد، وتنفد باستمرار التعدين.\n\n2) [المستوى المتوقع] اذكر فائدتين لإعادة تدوير الألومنيوم.\nالإجابة النموذجية: توفير الطاقة الكبيرة اللازمة للتحليل الكهربائي، والمحافظة على خام البوكسيت، وتقليل النفايات.\n\n3) [المستوى المتقدم] قيّم القول: «لا داعي لإعادة التدوير ما دامت الخامات متوفرة اليوم».\nالإجابة النموذجية: قول خاطئ؛ فالخامات ستنفد، والتعدين يستهلك طاقة ويضر البيئة، وإعادة التدوير أقل كلفة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: إعادة تدوير الفلزات تحافظ على ......... وتوفر .........<\/td><td>الخامات – الطاقة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مشكلة بيئية يسببها تعدين الخامات.<\/td><td>تدمير الموائل، أو تلوث الهواء والماء، أو تراكم النفايات الصخرية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يوفر تدوير الألومنيوم طاقة كبيرة مقارنة باستخلاصه من خامه؟<\/td><td>لأن استخلاص الألومنيوم يتم بالتحليل الكهربائي الذي يستهلك كمية كبيرة جدًا من الكهرباء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: إعادة تدوير الفلزات تحافظ على ......... وتوفر .........\nالإجابة النموذجية: الخامات – الطاقة.\n\n2) [المستوى المتوقع] اذكر مشكلة بيئية يسببها تعدين الخامات.\nالإجابة النموذجية: تدمير الموائل، أو تلوث الهواء والماء، أو تراكم النفايات الصخرية.\n\n3) [المستوى المتقدم] لماذا يوفر تدوير الألومنيوم طاقة كبيرة مقارنة باستخلاصه من خامه؟\nالإجابة النموذجية: لأن استخلاص الألومنيوم يتم بالتحليل الكهربائي الذي يستهلك كمية كبيرة جدًا من الكهرباء."},{"h":"<p>الإجابة عن السؤالين 7-2 و8-2 والسؤالين 1 و2 (ب) من أسئلة نهاية الوحدة الثانية، ومشاركة ولي الأمر في فرز العلب الفلزية في المنزل.<\/p>","t":"الإجابة عن السؤالين 7-2 و8-2 والسؤالين 1 و2 (ب) من أسئلة نهاية الوحدة الثانية، ومشاركة ولي الأمر في فرز العلب الفلزية في المنزل."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-2 استخلاص الفلزات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: استخلاص الفلزات واستخداماتها<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 35–38 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 39–40<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div><ol class=\"ol\"><li>يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا.<\/li><li>يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر وجود الذهب حرًا غير متحد في الطبيعة.<\/div><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><ol class=\"ol\"><li>يصف استخدام الكربون في استخراج بعض الفلزات من أكاسيدها.<\/li><li>يكتب معادلة اختزال أكسيد فلز بالكربون.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد المادة التي اختُزلت والمادة التي تأكسدت في التفاعل.<\/div><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><ol class=\"ol\"><li>يصف خامات الفلزات بأنها موارد محدودة.<\/li><li>يبرر الحاجة إلى إعادة تدوير الفلزات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها.<\/div>","t":"الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط\n1. يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا.\n2. يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط.\nمخرج تعليمي آخر: يفسر وجود الذهب حرًا غير متحد في الطبيعة.\n\nالحصة 2: استخلاص فلز من أكسيده باستخدام الفحم\n1. يصف استخدام الكربون في استخراج بعض الفلزات من أكاسيدها.\n2. يكتب معادلة اختزال أكسيد فلز بالكربون.\nمخرج تعليمي آخر: يحدد المادة التي اختُزلت والمادة التي تأكسدت في التفاعل.\n\nالحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات\n1. يصف خامات الفلزات بأنها موارد محدودة.\n2. يبرر الحاجة إلى إعادة تدوير الفلزات.\nمخرج تعليمي آخر: يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها."},{"h":"<div class=\"psub\">الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الخام بأنه صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يربط طريقة استخلاص الفلز من خامه بموقعه في سلسلة النشاط.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يفسر وجود الذهب حرًا غير متحد في الطبيعة.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف استخدام الكربون في استخراج بعض الفلزات من أكاسيدها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يكتب معادلة اختزال أكسيد فلز بالكربون.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحدد المادة التي اختُزلت والمادة التي تأكسدت في التفاعل.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف خامات الفلزات بأنها موارد محدودة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يبرر الحاجة إلى إعادة تدوير الفلزات.<\/td><td class=\"lv\">تقييم<\/td><\/tr><tr><td>يصمم خطة مدرسية لجمع العلب الفلزية وإعادة تدويرها.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط\n• يصف الخام بأنه صخر يحت <\/p><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><p>سؤال: إذا كان الكربون «ينتزع» الأكسجين من أكسيد النحاس، فماذا يبقى في الأنبوب؟<\/p><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><p>يعرض علبة ألومنيوم فارغة ويسأل: ماذا يحدث لها بعد رميها؟ وما الذي نوفره لو أعدنا تدويرها؟<\/p>","t":"الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط\nيعرض عينة هيماتيت ومسمارًا حديديًا ويسأل: كيف تحول هذا الصخر الأحمر إلى هذا المسمار؟\n\nالحصة 2: استخلاص فلز من أكسيده باستخدام الفحم\nسؤال: إذا كان الكربون «ينتزع» الأكسجين من أكسيد النحاس، فماذا يبقى في الأنبوب؟\n\nالحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات\nيعرض علبة ألومنيوم فارغة ويسأل: ماذا يحدث لها بعد رميها؟ وما الذي نوفره لو أعدنا تدويرها؟"},{"h":"<div class=\"psub\">الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العينة والمسمار.<\/td><td>يقترحون خطوات التحويل.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الخامات<\/td><td>يعرّف الخام ويعرض أمثلة: الهيماتيت للحديد، والبوكسيت للألومنيوم.<\/td><td>يكملون جدولًا: الفلز، اسم الخام.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">السلسلة وطريقة الاستخلاص (كتاب الطالب ص 35–37)<\/td><td>يقسم السلسلة على السبورة الذكية: فوق الكربون (التحليل الكهربائي)، وتحت الكربون (الاختزال بالكربون)، والفلزات غير النشطة (توجد حرة).<\/td><td>يصنفون K وNa وCa وMg وAl وZn وFe وCu وAu حسب طريقة الاستخلاص.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">الأسئلة 1-2 إلى 3-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 1-2 استخلاص فلز من الأكسيد باستخدام الفحم (كتاب الطالب)<\/td><td>يوجه إلى خلط أكسيد النحاس II بمسحوق الفحم وتسخينه بقوة ثم تفريغه في كأس ماء.<\/td><td>يلاحظون تحول المسحوق الأسود إلى حبيبات بنية محمرة من النحاس.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المعادلة<\/td><td>يكتب على السبورة الذكية: <bdi>2CuO + C → 2Cu + CO₂<\/bdi> ويوضح فقد الأكسجين (اختزال) واكتسابه (أكسدة).<\/td><td>يحددون المادة المختزلة والمادة المؤكسدة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الأسئلة 4-2 إلى 6-2<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض العلبة.<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">محدودية الخامات (كتاب الطالب ص 38)<\/td><td>يعرض مقطعًا عن التعدين وأثره البيئي.<\/td><td>يستخرجون فوائد التدوير: حفظ الخامات، وتوفير الطاقة، وتقليل النفايات والتلوث.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مشروع مصغر: حملة تدوير<\/td><td>يكلف المجموعات بتصميم خطة حملة مدرسية لجمع العلب.<\/td><td>يعرضون خططهم بإيجاز.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 7-2 و8-2<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط\n(5 دقائق) التهيئة\nدور المعلم: يعرض العينة والمسمار.\nدور الطالب: يقترحون خطوات التحويل.\n\n(10 دقائق) الخامات\nدور المعلم: يعرّف الخام ويعرض أمثلة: الهيماتيت للحديد، والبوكسيت للألومنيوم.\nدور الطالب: يكملون جدولًا: الفلز، اسم الخام.\n\n(13 دقيقة) السلسلة وطريقة الاستخلاص (كتاب الطالب ص 35–37)\nدور المعلم: يقسم السلسلة على السبورة الذكية: فوق الكربون (التحليل الكهربائي)، وتحت الكربون (الاختزال بالكربون)، والفلزات غير النشطة (توجد حرة).\nدور الطالب: يصنفون K وNa وCa وMg وAl وZn وFe وCu وAu حسب طريقة الاستخلاص.\n\n(7 دقائق) الأسئلة 1-2 إلى 3-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: استخلاص فلز من أكسيده باستخدام الفحم\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 1-2 استخلاص فلز من الأكسيد باستخدام الفحم (كتاب الطالب)\nدور المعلم: يوجه إلى خلط أكسيد النحاس II بمسحوق الفحم وتسخينه بقوة ثم تفريغه في كأس ماء.\nدور الطالب: يلاحظون تحول المسحوق الأسود إلى حبيبات بنية محمرة من النحاس.\n\n(8 دقائق) المعادلة\nدور المعلم: يكتب على السبورة الذكية: 2CuO + C → 2Cu + CO₂ ويوضح فقد الأكسجين (اختزال) واكتسابه (أكسدة).\nدور الطالب: يحددون المادة المختزلة والمادة المؤكسدة.\n\n(5 دقائق) الأسئلة 4-2 إلى 6-2\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات\n(5 دقائق) التهيئة\nدور المعلم: يعرض العلبة.\nدور الطالب: يجيبون.\n\n(10 دقائق) محدودية الخامات (كتاب الطالب ص 38)\nدور المعلم: يعرض مقطعًا عن التعدين وأثره البيئي.\nدور الطالب: يستخرجون فوائد التدوير: حفظ الخامات، وتوفير الطاقة، وتقليل النفايات والتلوث.\n\n(12 دقيقة) مشروع مصغر: حملة تدوير\nدور المعلم: يكلف المجموعات بتصميم خطة حملة مدرسية لجمع العلب.\nدور الطالب: يعرضون خططهم بإيجاز.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 7-2 و8-2\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالخام؟<\/td><td>صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا اقتصاديًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما طريقة استخلاص الألومنيوم؟ ولماذا؟<\/td><td>التحليل الكهربائي؛ لأنه أنشط من الكربون فلا يُختزل أكسيده به.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يوجد الذهب في الطبيعة حرًا غير متحد؟<\/td><td>لأنه غير نشط تقريبًا فلا يتفاعل مع الأكسجين أو الماء.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما لون النحاس الناتج في النشاط؟<\/td><td>بني محمر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب المعادلة الرمزية لاختزال أكسيد النحاس II بالكربون.<\/td><td><bdi>2CuO + C → 2Cu + CO₂<\/bdi><\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أي المادتين اختُزلت وأيهما تأكسدت في التفاعل؟ فسّر.<\/td><td>اختُزل أكسيد النحاس لأنه فقد الأكسجين، وتأكسد الكربون لأنه اكتسب الأكسجين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا تُعد خامات الفلزات موارد محدودة؟<\/td><td>لأنها تكونت عبر ملايين السنين ولا تتجدد، وتنفد باستمرار التعدين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر فائدتين لإعادة تدوير الألومنيوم.<\/td><td>توفير الطاقة الكبيرة اللازمة للتحليل الكهربائي، والمحافظة على خام البوكسيت، وتقليل النفايات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قيّم القول: «لا داعي لإعادة التدوير ما دامت الخامات متوفرة اليوم».<\/td><td>قول خاطئ؛ فالخامات ستنفد، والتعدين يستهلك طاقة ويضر البيئة، وإعادة التدوير أقل كلفة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط\n1) [مستوى الدعم] ما المقصود بالخام؟\nالإجابة النموذجية: صخر يحتوي على مركب فلز بكمية تجعل استخلاصه مجديًا اقتصاديًا.\n\n2) [المستوى المتوقع] ما طريقة استخلاص الألومنيوم؟ ولماذا؟\nالإجابة النموذجية: التحليل الكهربائي؛ لأنه أنشط من الكربون فلا يُختزل أكسيده به.\n\n3) [المستوى المتقدم] لماذا يوجد الذهب في الطبيعة حرًا غير متحد؟\nالإجابة النموذجية: لأنه غير نشط تقريبًا فلا يتفاعل مع الأكسجين أو الماء.\n\nالحصة 2: استخلاص فلز من أكسيده باستخدام الفحم\n1) [مستوى الدعم] ما لون النحاس الناتج في النشاط؟\nالإجابة النموذجية: بني محمر.\n\n2) [المستوى المتوقع] اكتب المعادلة الرمزية لاختزال أكسيد النحاس II بالكربون.\nالإجابة النموذجية: 2CuO + C → 2Cu + CO₂\n\n3) [المستوى المتقدم] أي المادتين اختُزلت وأيهما تأكسدت في التفاعل؟ فسّر.\nالإجابة النموذجية: اختُزل أكسيد النحاس لأنه فقد الأكسجين، وتأكسد الكربون لأنه اكتسب الأكسجين.\n\nالحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات\n1) [مستوى الدعم] لماذا تُعد خامات الفلزات موارد محدودة؟\nالإجابة النموذجية: لأنها تكونت عبر ملايين السنين ولا تتجدد، وتنفد باستمرار التعدين.\n\n2) [المستوى المتوقع] اذكر فائدتين لإعادة تدوير الألومنيوم.\nالإجابة النموذجية: توفير الطاقة الكبيرة اللازمة للتحليل الكهربائي، والمحافظة على خام البوكسيت، وتقليل النفايات.\n\n3) [المستوى المتقدم] قيّم القول: «لا داعي لإعادة التدوير ما دامت الخامات متوفرة اليوم».\nالإجابة النموذجية: قول خاطئ؛ فالخامات ستنفد، والتعدين يستهلك طاقة ويضر البيئة، وإعادة التدوير أقل كلفة."},{"h":"<div class=\"psub\">الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الفلزات الأدنى من الكربون في السلسلة تُستخلص بـ .........<\/td><td>الاختزال بالكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صنّف حسب طريقة الاستخلاص: الصوديوم، الحديد، الذهب.<\/td><td>الصوديوم بالتحليل الكهربائي، والحديد بالاختزال بالكربون، والذهب يوجد حرًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا استُخدم النحاس والحديد قبل الألومنيوم بآلاف السنين مع أن الألومنيوم أوفر في القشرة الأرضية؟<\/td><td>لأن النحاس والحديد يُستخلصان بالتسخين مع الكربون، بينما يحتاج الألومنيوم إلى التحليل الكهربائي الذي لم يكن متاحًا قديمًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن استخلاص الماغنيسيوم من أكسيده بالتسخين مع الكربون.<\/td><td>خطأ؛ الماغنيسيوم أنشط من الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الغاز الناتج عن تسخين أكسيد فلز مع الكربون؟<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُفرغ ناتج التسخين في كأس ماء لرؤية النحاس؟<\/td><td>لأن الفحم الزائد خفيف فيطفو، بينما تترسب حبيبات النحاس الأثقل فتظهر بوضوح.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: إعادة تدوير الفلزات تحافظ على ......... وتوفر .........<\/td><td>الخامات – الطاقة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مشكلة بيئية يسببها تعدين الخامات.<\/td><td>تدمير الموائل، أو تلوث الهواء والماء، أو تراكم النفايات الصخرية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يوفر تدوير الألومنيوم طاقة كبيرة مقارنة باستخلاصه من خامه؟<\/td><td>لأن استخلاص الألومنيوم يتم بالتحليل الكهربائي الذي يستهلك كمية كبيرة جدًا من الكهرباء.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط\n1) [مستوى الدعم] أكمل: الفلزات الأدنى من الكربون في السلسلة تُستخلص بـ .........\nالإجابة النموذجية: الاختزال بالكربون.\n\n2) [المستوى المتوقع] صنّف حسب طريقة الاستخلاص: الصوديوم، الحديد، الذهب.\nالإجابة النموذجية: الصوديوم بالتحليل الكهربائي، والحديد بالاختزال بالكربون، والذهب يوجد حرًا.\n\n3) [المستوى المتقدم] لماذا استُخدم النحاس والحديد قبل الألومنيوم بآلاف السنين مع أن الألومنيوم أوفر في القشرة الأرضية؟\nالإجابة النموذجية: لأن النحاس والحديد يُستخلصان بالتسخين مع الكربون، بينما يحتاج الألومنيوم إلى التحليل الكهربائي الذي لم يكن متاحًا قديمًا.\n\nالحصة 2: استخلاص فلز من أكسيده باستخدام الفحم\n1) [مستوى الدعم] صواب أم خطأ: يمكن استخلاص الماغنيسيوم من أكسيده بالتسخين مع الكربون.\nالإجابة النموذجية: خطأ؛ الماغنيسيوم أنشط من الكربون.\n\n2) [المستوى المتوقع] ما الغاز الناتج عن تسخين أكسيد فلز مع الكربون؟\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n3) [المستوى المتقدم] لماذا يُفرغ ناتج التسخين في كأس ماء لرؤية النحاس؟\nالإجابة النموذجية: لأن الفحم الزائد خفيف فيطفو، بينما تترسب حبيبات النحاس الأثقل فتظهر بوضوح.\n\nالحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات\n1) [مستوى الدعم] أكمل: إعادة تدوير الفلزات تحافظ على ......... وتوفر .........\nالإجابة النموذجية: الخامات – الطاقة.\n\n2) [المستوى المتوقع] اذكر مشكلة بيئية يسببها تعدين الخامات.\nالإجابة النموذجية: تدمير الموائل، أو تلوث الهواء والماء، أو تراكم النفايات الصخرية.\n\n3) [المستوى المتقدم] لماذا يوفر تدوير الألومنيوم طاقة كبيرة مقارنة باستخلاصه من خامه؟\nالإجابة النموذجية: لأن استخلاص الألومنيوم يتم بالتحليل الكهربائي الذي يستهلك كمية كبيرة جدًا من الكهرباء."},{"h":"<div class=\"psub\">الحصة 1: الخامات وطرائق الاستخلاص وسلسلة النشاط<\/div><p>مراجعة كتاب الطالب ص 35–37 والإجابة عن الأسئلة 1-2 إلى 3-2، والبحث عن مواقع تعدين النحاس قديمًا في سلطنة عُمان.<\/p><div class=\"psub\">الحصة 2: استخلاص فلز من أكسيده باستخدام الفحم<\/div><p>كتابة تقرير النشاط 1-2، والإجابة عن الأسئلة 4-2 إلى 6-2 في كتاب الطالب ص 36–37.<\/p><div class=\"psub\">الحصة 3: الخامات موارد محدودة وإعادة تدوير الفلزات<\/div><p>الإجابة عن السؤالين 7-2 و8-2 والسؤالين 1 و2 (ب) من أسئلة نهاية الوحدة الثانية، ومشاركة ولي
