تبلور وتحديد الصيغة من بيانات التسخين\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: بلورات كبريتات النحاس المائية، أنبوب اختبار، موقد بنزن"},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><div class=\"pills\"><span>المعادلة الموزونة<\/span><span>نسبة المولات<\/span><span>الكتلة المتفاعلة<\/span><span>الكتلة الناتجة<\/span><span>حفظ الكتلة<\/span><\/div><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><div class=\"pills\"><span>الكتلة المحسوبة<\/span><span>الكتلة الفعلية<\/span><span>التفكك الحراري<\/span><span>ثبات الكتلة<\/span><\/div><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><div class=\"pills\"><span>ماء التبلور<\/span><span>الملح المائي<\/span><span>الملح اللامائي<\/span><span>ثبات الكتلة<\/span><\/div>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\nالمعادلة الموزونة، نسبة المولات، الكتلة المتفاعلة، الكتلة الناتجة، حفظ الكتلة\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\nالكتلة المحسوبة، الكتلة الفعلية، التفكك الحراري، ثبات الكتلة\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\nماء التبلور، الملح المائي، الملح اللامائي، ثبات الكتلة"},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><p>سؤال: لصنع 10 كعكات نحتاج إلى كوبين من الطحين؛ كم كوبًا لصنع 25 كعكة؟ ثم يربط المعلم المعادلة الكيميائية بالوصفة.<\/p><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><p>سؤال: إذا سخنا 12.4 g من كربونات النحاس، فكم نتوقع أن نحصل على أكسيد النحاس؟ ثم نقارن بالتجربة.<\/p><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><p>يسخن المعلم بلورات كبريتات النحاس الزرقاء أمام الطلبة فتتحول إلى مسحوق أبيض؛ سؤال: أين ذهب اللون؟<\/p>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\nسؤال: لصنع 10 كعكات نحتاج إلى كوبين من الطحين؛ كم كوبًا لصنع 25 كعكة؟ ثم يربط المعلم المعادلة الكيميائية بالوصفة.\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\nسؤال: إذا سخنا 12.4 g من كربونات النحاس، فكم نتوقع أن نحصل على أكسيد النحاس؟ ثم نقارن بالتجربة.\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\nيسخن المعلم بلورات كبريتات النحاس الزرقاء أمام الطلبة فتتحول إلى مسحوق أبيض؛ سؤال: أين ذهب اللون؟"},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح سؤال الوصفة.<\/td><td>يحسبون 5 أكواب ويستنتجون فكرة التناسب.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الخطوات الأربع (كتاب الطالب ص 61–62)<\/td><td>يعرض على السبورة الذكية: كتلة ← مولات ← نسبة المعادلة ← مولات الناتج ← كتلة، ويحل: <bdi>2Mg + O₂ → 2MgO<\/bdi>؛ <bdi>4.8 g Mg = 0.2 mol<\/bdi> ← <bdi>0.2 mol MgO = 8.0 g<\/bdi>.<\/td><td>يدونون الخطوات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">تطبيق موجه<\/td><td>يعرض مسألة <bdi>CaCO₃ → CaO + CO₂<\/bdi>: كتلة CaO من 50 g CaCO₃.<\/td><td>يحلون: 0.5 mol ← 0.5 mol CaO ← 28 g.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 8-3 و9-3<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-3 استقصاء العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة (إثرائي – كتاب الطالب)<\/td><td>يوجه إلى تسخين كتل مختلفة من كربونات النحاس حتى ثبات الكتلة: <bdi>CuCO₃ → CuO + CO₂<\/bdi>.<\/td><td>يسجلون الكتل ويرسمون كتلة الناتج بدلالة كتلة المتفاعل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المقارنة بالحساب<\/td><td>يحل على السبورة الذكية: <bdi>12.4 g CuCO₃ = 0.1 mol<\/bdi> ← 8.0 g CuO.<\/td><td>يقارنون نتائجهم بالقيمة المحسوبة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يلاحظون تكثف قطرات ماء في أعلى الأنبوب.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ماء التبلور<\/td><td>يوضح أن بعض الأملاح تحتوي على جزيئات ماء في بلوراتها مثل CuSO₄·5H₂O وBaCl₂·2H₂O.<\/td><td>يحسبون Mr لـ CuSO₄·<bdi>5H₂O = 250<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">ورقة العمل 4-3 تجفيف بلورات كلوريد الباريوم (كتاب النشاط ص 50–51)<\/td><td>يعرض بيانات: 2.44 g بلورات أصبحت 2.08 g بعد التسخين.<\/td><td>يحسبون: كتلة الماء <bdi>0.36 g = 0.02 mol<\/bdi>، و<bdi>BaCl₂ = 0.01 mol<\/bdi>، فالنسبة 1 : 2.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤال 11-3<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\n(5 دقائق) التهيئة\nدور المعلم: يطرح سؤال الوصفة.\nدور الطالب: يحسبون 5 أكواب ويستنتجون فكرة التناسب.\n\n(12 دقيقة) الخطوات الأربع (كتاب الطالب ص 61–62)\nدور المعلم: يعرض على السبورة الذكية: كتلة ← مولات ← نسبة المعادلة ← مولات الناتج ← كتلة، ويحل: 2Mg + O₂ → 2MgO؛ 4.8 g Mg = 0.2 mol ← 0.2 mol MgO = 8.0 g.\nدور الطالب: يدونون الخطوات.\n\n(13 دقيقة) تطبيق موجه\nدور المعلم: يعرض مسألة CaCO₃ → CaO + CO₂: كتلة CaO من 50 g CaCO₃.\nدور الطالب: يحلون: 0.5 mol ← 0.5 mol CaO ← 28 g.\n\n(5 دقائق) السؤالان 8-3 و9-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 2-3 استقصاء العلاقة بين كتلتي المادة المتفاعلة والمادة الناتجة (إثرائي – كتاب الطالب)\nدور المعلم: يوجه إلى تسخين كتل مختلفة من كربونات النحاس حتى ثبات الكتلة: CuCO₃ → CuO + CO₂.\nدور الطالب: يسجلون الكتل ويرسمون كتلة الناتج بدلالة كتلة المتفاعل.\n\n(8 دقائق) المقارنة بالحساب\nدور المعلم: يحل على السبورة الذكية: 12.4 g CuCO₃ = 0.1 mol ← 8.0 g CuO.\nدور الطالب: يقارنون نتائجهم بالقيمة المحسوبة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون.\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\n(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يلاحظون تكثف قطرات ماء في أعلى الأنبوب.\n\n(10 دقائق) ماء التبلور\nدور المعلم: يوضح أن بعض الأملاح تحتوي على جزيئات ماء في بلوراتها مثل CuSO₄·5H₂O وBaCl₂·2H₂O.\nدور الطالب: يحسبون Mr لـ CuSO₄·5H₂O = 250.\n\n(15 دقيقة) ورقة العمل 4-3 تجفيف بلورات كلوريد الباريوم (كتاب النشاط ص 50–51)\nدور المعلم: يعرض بيانات: 2.44 g بلورات أصبحت 2.08 g بعد التسخين.\nدور الطالب: يحسبون: كتلة الماء 0.36 g = 0.02 mol، وBaCl₂ = 0.01 mol، فالنسبة 1 : 2.\n\n(5 دقائق) السؤال 11-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>في المعادلة <bdi>2Mg + O₂ → 2MgO<\/bdi>، ما نسبة مولات Mg إلى MgO؟<\/td><td>1 : 1.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب كتلة MgO الناتجة من <bdi>2.4 g Mg (Mg = 24<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>0.1 mol ← <bdi>0.1 mol MgO = 4.0 g<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما كتلة CaO الناتجة من تسخين 200 g من CaCO₃؟ <bdi>(CaCO₃ = 100<\/bdi>، <bdi>CaO = 56)<\/bdi><\/td><td>2 mol ← <bdi>2 mol CaO = 112 g<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الغاز المتصاعد عند تسخين كربونات النحاس؟<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب كتلة CuO الناتجة من <bdi>24.8 g CuCO₃ (CuCO₃ = 124<\/bdi>، <bdi>CuO = 80)<\/bdi>.<\/td><td>0.2 mol ← 16.0 g.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>حصل طالب على 7.5 g من CuO بدل 8.0 g المحسوبة. اقترح سببين.<\/td><td>فقد جزء من المسحوق بالتطاير أو أثناء النقل، أو خطأ في قراءة الميزان.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بماء التبلور؟<\/td><td>جزيئات ماء مرتبطة داخل بلورات بعض الأملاح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب Mr لـ CuSO₄·<bdi>5H₂O (CuSO₄ = 160<\/bdi>، <bdi>H₂O = 18)<\/bdi>.<\/td><td>250.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سُخن 2.44 g من كلوريد الباريوم المائي حتى ثبات الكتلة فبقي 2.08 g. احسب x في BaCl₂·<bdi>xH₂O (BaCl₂ = 208)<\/bdi>.<\/td><td>الماء <bdi>0.36 g = 0.02 mol<\/bdi>، و<bdi>BaCl₂ = 0.01 mol<\/bdi>، فـ <bdi>x = 2<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\n1) [مستوى الدعم] في المعادلة 2Mg + O₂ → 2MgO، ما نسبة مولات Mg إلى MgO؟\nالإجابة النموذجية: 1 : 1.\n\n2) [المستوى المتوقع] احسب كتلة MgO الناتجة من 2.4 g Mg (Mg = 24، O = 16).\nالإجابة النموذجية: 0.1 mol ← 0.1 mol MgO = 4.0 g.\n\n3) [المستوى المتقدم] ما كتلة CaO الناتجة من تسخين 200 g من CaCO₃؟ (CaCO₃ = 100، CaO = 56)\nالإجابة النموذجية: 2 mol ← 2 mol CaO = 112 g.\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\n1) [مستوى الدعم] ما الغاز المتصاعد عند تسخين كربونات النحاس؟\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n2) [المستوى المتوقع] احسب كتلة CuO الناتجة من 24.8 g CuCO₃ (CuCO₃ = 124، CuO = 80).\nالإجابة النموذجية: 0.2 mol ← 16.0 g.\n\n3) [المستوى المتقدم] حصل طالب على 7.5 g من CuO بدل 8.0 g المحسوبة. اقترح سببين.\nالإجابة النموذجية: فقد جزء من المسحوق بالتطاير أو أثناء النقل، أو خطأ في قراءة الميزان.\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\n1) [مستوى الدعم] ما المقصود بماء التبلور؟\nالإجابة النموذجية: جزيئات ماء مرتبطة داخل بلورات بعض الأملاح.\n\n2) [المستوى المتوقع] احسب Mr لـ CuSO₄·5H₂O (CuSO₄ = 160، H₂O = 18).\nالإجابة النموذجية: 250.\n\n3) [المستوى المتقدم] سُخن 2.44 g من كلوريد الباريوم المائي حتى ثبات الكتلة فبقي 2.08 g. احسب x في BaCl₂·xH₂O (BaCl₂ = 208).\nالإجابة النموذجية: الماء 0.36 g = 0.02 mol، وBaCl₂ = 0.01 mol، فـ x = 2."},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: عدد المولات = الكتلة ÷ .........<\/td><td>الكتلة المولية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>في التفاعل <bdi>CaCO₃ → CaO + CO₂<\/bdi> تكوّن 56 g من CaO من 100 g CaCO₃. ما كتلة CO₂ الناتجة؟<\/td><td>44 g (حفظ الكتلة).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كم غرامًا من الهيدروجين يلزم لإنتاج 36 g من الماء؟ <bdi>2H₂ + O₂ → 2H₂O<\/bdi><\/td><td>36 g ماء = 2 mol ← <bdi>2 mol H₂ = 4 g<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تُسخن المادة حتى ثبات الكتلة للتأكد من اكتمال التفاعل.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم غرامًا من CuCO₃ تلزم لإنتاج 4.0 g من CuO؟<\/td><td>0.05 mol ← 6.2 g.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تقل كتلة الجفنة ومحتواها أثناء تسخين كربونات النحاس؟<\/td><td>لأن ثاني أكسيد الكربون الناتج غاز يغادر الجفنة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تتحول بلورات كبريتات النحاس الزرقاء إلى مسحوق أبيض بالتسخين بسبب فقد .........<\/td><td>ماء التبلور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُكرر التسخين والوزن حتى ثبات الكتلة؟<\/td><td>للتأكد من إزالة ماء التبلور كله.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما أثر التسخين غير الكافي في قيمة x المحسوبة؟ فسّر.<\/td><td>تصبح x أصغر من الحقيقية؛ لأن كتلة الماء المفقود المقيسة أقل من الفعلية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\n1) [مستوى الدعم] أكمل: عدد المولات = الكتلة ÷ .........\nالإجابة النموذجية: الكتلة المولية.\n\n2) [المستوى المتوقع] في التفاعل CaCO₃ → CaO + CO₂ تكوّن 56 g من CaO من 100 g CaCO₃. ما كتلة CO₂ الناتجة؟\nالإجابة النموذجية: 44 g (حفظ الكتلة).\n\n3) [المستوى المتقدم] كم غرامًا من الهيدروجين يلزم لإنتاج 36 g من الماء؟ 2H₂ + O₂ → 2H₂O\nالإجابة النموذجية: 36 g ماء = 2 mol ← 2 mol H₂ = 4 g.\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\n1) [مستوى الدعم] صواب أم خطأ: تُسخن المادة حتى ثبات الكتلة للتأكد من اكتمال التفاعل.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] كم غرامًا من CuCO₃ تلزم لإنتاج 4.0 g من CuO؟\nالإجابة النموذجية: 0.05 mol ← 6.2 g.\n\n3) [المستوى المتقدم] لماذا تقل كتلة الجفنة ومحتواها أثناء تسخين كربونات النحاس؟\nالإجابة النموذجية: لأن ثاني أكسيد الكربون الناتج غاز يغادر الجفنة.\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\n1) [مستوى الدعم] أكمل: تتحول بلورات كبريتات النحاس الزرقاء إلى مسحوق أبيض بالتسخين بسبب فقد .........\nالإجابة النموذجية: ماء التبلور.\n\n2) [المستوى المتوقع] لماذا يُكرر التسخين والوزن حتى ثبات الكتلة؟\nالإجابة النموذجية: للتأكد من إزالة ماء التبلور كله.\n\n3) [المستوى المتقدم] ما أثر التسخين غير الكافي في قيمة x المحسوبة؟ فسّر.\nالإجابة النموذجية: تصبح x أصغر من الحقيقية؛ لأن كتلة الماء المفقود المقيسة أقل من الفعلية."},{"h":"<div class=\"psub\">الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة<\/div><p>مراجعة الأمثلة في كتاب الطالب ص 61–62 والإجابة عن السؤالين 8-3 و9-3، وحل الجزئيتين (ب، ج) من تمرين 3-3 في كتاب النشاط ص 38–39.<\/p><div class=\"psub\">الحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة<\/div><p>حل الجزء الخاص بالكتل من ورقة العمل 3-3 الكتل المتفاعلة وحجوم الغازات في كتاب النشاط ص 48–49، والإجابة عن السؤال 10-3.<\/p><div class=\"psub\">الحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين<\/div><p>إكمال ورقة العمل 4-3 في كتاب النشاط ص 50–51، والإجابة عن السؤال 11-3 والسؤال 3 من أسئلة نهاية الوحدة الثالثة.<\/p>","t":"الحصة 1: خطوات حساب الكتل المتفاعلة والناتجة\nمراجعة الأمثلة في كتاب الطالب ص 61–62 والإجابة عن السؤالين 8-3 و9-3، وحل الجزئيتين (ب، ج) من تمرين 3-3 في كتاب النشاط ص 38–39.\n\nالحصة 2: العلاقة التجريبية بين كتلتي المادة المتفاعلة والناتجة\nحل الجزء الخاص بالكتل من ورقة العمل 3-3 الكتل المتفاعلة وحجوم الغازات في كتاب النشاط ص 48–49، والإجابة عن السؤال 10-3.\n\nالحصة 3: ماء التبلور وتحديد الصيغة من بيانات التسخين\nإكمال ورقة العمل 4-3 في كتاب النشاط ص 50–51، والإجابة عن السؤال 11-3 والسؤال 3 من أسئلة نهاية الوحدة الثالثة."}]}},{"label":"4-3 حسابات تتضمن حجوم الغازات","unit":"الوحدة الثالثة: الكيمياء الكمية","periods":[{"n":1,"focus":"الحجم المولي للغاز","info":"<div><b>الدرس:<\/b> 4-3 حسابات تتضمن حجوم الغازات<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 65–68 | كتاب النشاط: تمرين 4-3 ص 40–41، تمرين 5-3 ص 42–43، ورقة العمل 5-3 (السؤال 1) ص 52<\/div><div><b>دليل المعلم:<\/b> ص 56<\/div><div><b>محور الحصة:<\/b> الحجم المولي للغاز<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين.<\/li><li>يحول بين عدد مولات الغاز وحجمه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها.<\/div>","t":"1. يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين.\n2. يحول بين عدد مولات الغاز وحجمه.\nمخرج تعليمي آخر: يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحول بين عدد مولات الغاز وحجمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين. ← تطبيق\n• يحول بين عدد مولات الغاز وحجمه. ← تطبيق\n• يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم بالاكتشاف<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الأقلام"},{"h":"<div class=\"pills\"><span>الحجم المولي<\/span><span>24 L<\/span><span>السنتيمتر المكعب<\/span><span>الظروف القياسية<\/span><\/div>","t":"الحجم المولي، 24 L، السنتيمتر المكعب، الظروف القياسية"},{"h":"<p>سؤال: بالونان متماثلان مملوءان بالهيدروجين وثاني أكسيد الكربون في الظروف نفسها؛ أيهما يحتوي جزيئات أكثر؟<\/p>","t":"سؤال: بالونان متماثلان مملوءان بالهيدروجين وثاني أكسيد الكربون في الظروف نفسها؛ أيهما يحتوي جزيئات أكثر؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الحجم المولي (كتاب الطالب ص 65–66)<\/td><td>يوضح أن مول أي غاز يشغل 24 L في الظروف القياسية، وأن <bdi>1 L = 1000 cm³<\/bdi>.<\/td><td>يدونون: الحجم = عدد المولات × 24.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحويلات<\/td><td>يحل على السبورة الذكية: <bdi>0.5 mol O₂ = 12 L<\/bdi>؛ <bdi>480 cm³ CO₂ = 0.02 mol<\/bdi>؛ كتلة 6 L من <bdi>CO₂ = 11 g<\/bdi>.<\/td><td>يحلون أمثلة متدرجة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 5-3 حجوم الغازات المتفاعلة (البدء – كتاب النشاط ص 42)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الحجم المولي (كتاب الطالب ص 65–66)\nدور المعلم: يوضح أن مول أي غاز يشغل 24 L في الظروف القياسية، وأن 1 L = 1000 cm³.\nدور الطالب: يدونون: الحجم = عدد المولات × 24.\n\n(12 دقيقة) تحويلات\nدور المعلم: يحل على السبورة الذكية: 0.5 mol O₂ = 12 L؛ 480 cm³ CO₂ = 0.02 mol؛ كتلة 6 L من CO₂ = 11 g.\nدور الطالب: يحلون أمثلة متدرجة.\n\n(8 دقائق) تمرين 5-3 حجوم الغازات المتفاعلة (البدء – كتاب النشاط ص 42)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما حجم مول واحد من أي غاز في الظروف القياسية؟<\/td><td>24 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم 0.25 mol من غاز النيتروجين.<\/td><td>6 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما كتلة 12 L من غاز الأكسجين <bdi>O₂ (O = 16)<\/bdi>؟<\/td><td><bdi>0.5 mol × 32 = 16 g<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما حجم مول واحد من أي غاز في الظروف القياسية؟\nالإجابة النموذجية: 24 L.\n\n2) [المستوى المتوقع] احسب حجم 0.25 mol من غاز النيتروجين.\nالإجابة النموذجية: 6 L.\n\n3) [المستوى المتقدم] ما كتلة 12 L من غاز الأكسجين O₂ (O = 16)؟\nالإجابة النموذجية: 0.5 mol × 32 = 16 g."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>1 L = ......... cm³<\/bdi>.<\/td><td>1000.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم مولًا في 240 cm³ من الهيدروجين؟<\/td><td>0.01 mol.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>بالونان متساويان في الحجم، أحدهما هيدروجين والآخر ثاني أكسيد الكربون في الظروف نفسها. قارن عدد الجزيئات والكتلة.<\/td><td>عدد الجزيئات متساوٍ، لكن كتلة CO₂ أكبر لأن Mr له 44 مقابل 2.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: 1 L = ......... cm³.\nالإجابة النموذجية: 1000.\n\n2) [المستوى المتوقع] كم مولًا في 240 cm³ من الهيدروجين؟\nالإجابة النموذجية: 0.01 mol.\n\n3) [المستوى المتقدم] بالونان متساويان في الحجم، أحدهما هيدروجين والآخر ثاني أكسيد الكربون في الظروف نفسها. قارن عدد الجزيئات والكتلة.\nالإجابة النموذجية: عدد الجزيئات متساوٍ، لكن كتلة CO₂ أكبر لأن Mr له 44 مقابل 2."},{"h":"<p>مراجعة كتاب الطالب ص 65–66 والإجابة عن السؤالين 12-3 و13-3، والبدء في تمرين 5-3 في كتاب النشاط ص 42–43.<\/p>","t":"مراجعة كتاب الطالب ص 65–66 والإجابة عن السؤالين 12-3 و13-3، والبدء في تمرين 5-3 في كتاب النشاط ص 42–43."}]},{"n":2,"focus":"حجم الغاز الناتج من تفاعل","info":"<div><b>الدرس:<\/b> 4-3 حسابات ت mol H₂ = 120 cm³.\nدور الطالب: يقارنون بقياساتهم.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يكلف بتمرين 4-3.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نسبة مولات Mg إلى H₂ في التفاعل <bdi>Mg + 2HCl → MgCl₂ + H₂<\/bdi>؟<\/td><td>1 : 1.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم الهيدروجين الناتج من 0.24 g من الماغنيسيوم.<\/td><td>0.01 mol ← 240 cm³.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نتج 96 cm³ من الهيدروجين. ما كتلة الماغنيسيوم المتفاعل؟<\/td><td><bdi>0.004 mol × 24 = 0.096 g<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما نسبة مولات Mg إلى H₂ في التفاعل Mg + 2HCl → MgCl₂ + H₂؟\nالإجابة النموذجية: 1 : 1.\n\n2) [المستوى المتوقع] احسب حجم الهيدروجين الناتج من 0.24 g من الماغنيسيوم.\nالإجابة النموذجية: 0.01 mol ← 240 cm³.\n\n3) [المستوى المتقدم] نتج 96 cm³ من الهيدروجين. ما كتلة الماغنيسيوم المتفاعل؟\nالإجابة النموذجية: 0.004 mol × 24 = 0.096 g."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يجب أن يكون الحمض زائدًا حتى يتفاعل الماغنيسيوم كله.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم CO₂ الناتج من تسخين 10 g من <bdi>CaCO₃ (Mr = 100)<\/bdi>.<\/td><td>0.1 mol ← 2.4 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا قد يكون الحجم المقيس أقل من المحسوب؟<\/td><td>تسرب الغاز قبل إغلاق الجهاز، أو وجود طبقة أكسيد على سطح الماغنيسيوم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يجب أن يكون الحمض زائدًا حتى يتفاعل الماغنيسيوم كله.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] احسب حجم CO₂ الناتج من تسخين 10 g من CaCO₃ (Mr = 100).\nالإجابة النموذجية: 0.1 mol ← 2.4 L.\n\n3) [المستوى المتقدم] لماذا قد يكون الحجم المقيس أقل من المحسوب؟\nالإجابة النموذجية: تسرب الغاز قبل إغلاق الجهاز، أو وجود طبقة أكسيد على سطح الماغنيسيوم."},{"h":"<p>حل تمرين 4-3 تحديد كتلة شريط من الماغنيسيوم وإكمال تمرين 5-3 والسؤال 1 من ورقة العمل 5-3 في كتاب النشاط ص 40–43 و52، والإجابة عن السؤالين 14-3 و15-3 والسؤال 4 من أسئلة نهاية الوحدة.<\/p>","t":"حل تمرين 4-3 تحديد كتلة شريط من الماغنيسيوم وإكمال تمرين 5-3 والسؤال 1 من ورقة العمل 5-3 في كتاب النشاط ص 40–43 و52، والإجابة عن السؤالين 14-3 و15-3 والسؤال 4 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-3 حسابات تتضمن حجوم الغازات<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 65–68 | كتاب النشاط: تمرين 4-3 ص 40–41، تمرين 5-3 ص 42–43، ورقة العمل 5-3 (السؤال 1) ص 52<\/div><div><b>دليل المعلم:<\/b> ص 56<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><ol class=\"ol\"><li>يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين.<\/li><li>يحول بين عدد مولات الغاز وحجمه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها.<\/div><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><ol class=\"ol\"><li>يحسب حجم غاز ناتج من كتلة متفاعل معلومة باستخدام المعادلة الموزونة.<\/li><li>يحدد كتلة شريط ماغنيسيوم من حجم الهيدروجين الناتج.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن الحجم المقيس بالمحسوب ويقترح أسباب الفرق.<\/div>","t":"الحصة 1: الحجم المولي للغاز\n1. يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين.\n2. يحول بين عدد مولات الغاز وحجمه.\nمخرج تعليمي آخر: يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها.\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n1. يحسب حجم غاز ناتج من كتلة متفاعل معلومة باستخدام المعادلة الموزونة.\n2. يحدد كتلة شريط ماغنيسيوم من حجم الهيدروجين الناتج.\nمخرج تعليمي آخر: يقارن الحجم المقيس بالمحسوب ويقترح أسباب الفرق."},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحول بين عدد مولات الغاز وحجمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب حجم غاز ناتج من كتلة متفاعل معلومة باستخدام المعادلة الموزونة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحدد كتلة شريط ماغنيسيوم من حجم الهيدروجين الناتج.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقارن الحجم المقيس بالمحسوب ويقترح أسباب الفرق.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الحجم المولي للغاز\n• يستخدم الحجم المولي للغاز 24 L عند درجة الحرارة والضغط القياسيين. ← تطبيق\n• يحول بين عدد مولات الغاز وحجمه. ← تطبيق\n• يفسر تساوي الحجم المولي لجميع الغازات في الظروف نفسها. ← فهم\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n• يحسب حجم غاز ناتج من كتلة متفاعل معلومة باستخدام المعادلة الموزونة. ← تطبيق\n• يحدد كتلة شريط ماغنيسيوم من حجم الهيدروجين الناتج. ← تحليل\n• يقارن الحجم المقيس بالمحسوب ويقترح أسباب الفرق. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم بالاكتشاف<\/span><\/div><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الحجم المولي للغاز\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n• التعلم بالاكتشاف\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><\/div><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: شريط ماغنيسيوم، حمض هيدروكلوريك، محقنة غاز، ميزان، نظارات واقية<\/span><\/div>","t":"الحصة 1: الحجم المولي للغاز\n• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الأقلام\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: شريط ماغنيسيوم، حمض هيدروكلوريك، محقنة غاز، ميزان، نظارات واقية"},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><div class=\"pills\"><span>الحجم المولي<\/span><span>24 L<\/span><span>السنتيمتر المكعب<\/span><span>الظروف القياسية<\/span><\/div><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><div class=\"pills\"><span>حجم الغاز الناتج<\/span><span>نسبة المولات<\/span><span>المحقنة الغازية<\/span><span>الحمض الزائد<\/span><\/div>","t":"الحصة 1: الحجم المولي للغاز\nالحجم المولي، 24 L، السنتيمتر المكعب، الظروف القياسية\n\nالحصة 2: حجم الغاز الناتج من تفاعل\nحجم الغاز الناتج، نسبة المولات، المحقنة الغازية، الحمض الزائد"},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><p>سؤال: بالونان متماثلان مملوءان بالهيدروجين وثاني أكسيد الكربون في الظروف نفسها؛ أيهما يحتوي جزيئات أكثر؟<\/p><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><p>سؤال: كم سنتيمترًا مكعبًا من الهيدروجين نتوقع من 0.12 g من الماغنيسيوم؟<\/p>","t":"الحصة 1: الحجم المولي للغاز\nسؤال: بالونان متماثلان مملوءان بالهيدروجين وثاني أكسيد الكربون في الظروف نفسها؛ أيهما يحتوي جزيئات أكثر؟\n\nالحصة 2: حجم الغاز الناتج من تفاعل\nسؤال: كم سنتيمترًا مكعبًا من الهيدروجين نتوقع من 0.12 g من الماغنيسيوم؟"},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الحجم المولي (كتاب الطالب ص 65–66)<\/td><td>يوضح أن مول أي غاز يشغل 24 L في الظروف القياسية، وأن <bdi>1 L = 1000 cm³<\/bdi>.<\/td><td>يدونون: الحجم = عدد المولات × 24.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحويلات<\/td><td>يحل على السبورة الذكية: <bdi>0.5 mol O₂ = 12 L<\/bdi>؛ <bdi>480 cm³ CO₂ = 0.02 mol<\/bdi>؛ كتلة 6 L من <bdi>CO₂ = 11 g<\/bdi>.<\/td><td>يحلون أمثلة متدرجة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 5-3 حجوم الغازات المتفاعلة (البدء – كتاب النشاط ص 42)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 3-3 استقصاء العلاقة بين كتلة مادة متفاعلة وحجم غاز ناتج (إثرائي – كتاب الطالب)<\/td><td>يوجه إلى تفاعل أطوال مختلفة من شريط Mg مع حمض زائد وجمع الغاز في محقنة.<\/td><td>يقيسون الحجم ويرسمون الحجم بدلالة الكتلة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">الحساب<\/td><td>يحل على السبورة الذكية: <bdi>Mg + 2HCl → MgCl₂ + H₂<\/bdi>؛ <bdi>0.12 g = 0.005 mol<\/bdi> ← <bdi>0.005 mol H₂ = 120 cm³<\/bdi>.<\/td><td>يقارنون بقياساتهم.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يكلف بتمرين 4-3.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الحجم المولي للغاز\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الحجم المولي (كتاب الطالب ص 65–66)\nدور المعلم: يوضح أن مول أي غاز يشغل 24 L في الظروف القياسية، وأن 1 L = 1000 cm³.\nدور الطالب: يدونون: الحجم = عدد المولات × 24.\n\n(12 دقيقة) تحويلات\nدور المعلم: يحل على السبورة الذكية: 0.5 mol O₂ = 12 L؛ 480 cm³ CO₂ = 0.02 mol؛ كتلة 6 L من CO₂ = 11 g.\nدور الطالب: يحلون أمثلة متدرجة.\n\n(8 دقائق) تمرين 5-3 حجوم الغازات المتفاعلة (البدء – كتاب النشاط ص 42)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 3-3 استقصاء العلاقة بين كتلة مادة متفاعلة وحجم غاز ناتج (إثرائي – كتاب الطالب)\nدور المعلم: يوجه إلى تفاعل أطوال مختلفة من شريط Mg مع حمض زائد وجمع الغاز في محقنة.\nدور الطالب: يقيسون الحجم ويرسمون الحجم بدلالة الكتلة.\n\n(8 دقائق) الحساب\nدور المعلم: يحل على السبورة الذكية: Mg + 2HCl → MgCl₂ + H₂؛ 0.12 g = 0.005 mol ← 0.005 mol H₂ = 120 cm³.\nدور الطالب: يقارنون بقياساتهم.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يكلف بتمرين 4-3.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما حجم مول واحد من أي غاز في الظروف القياسية؟<\/td><td>24 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم 0.25 mol من غاز النيتروجين.<\/td><td>6 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما كتلة 12 L من غاز الأكسجين <bdi>O₂ (O = 16)<\/bdi>؟<\/td><td><bdi>0.5 mol × 32 = 16 g<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نسبة مولات Mg إلى H₂ في التفاعل <bdi>Mg + 2HCl → MgCl₂ + H₂<\/bdi>؟<\/td><td>1 : 1.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم الهيدروجين الناتج من 0.24 g من الماغنيسيوم.<\/td><td>0.01 mol ← 240 cm³.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نتج 96 cm³ من الهيدروجين. ما كتلة الماغنيسيوم المتفاعل؟<\/td><td><bdi>0.004 mol × 24 = 0.096 g<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الحجم المولي للغاز\n1) [مستوى الدعم] ما حجم مول واحد من أي غاز في الظروف القياسية؟\nالإجابة النموذجية: 24 L.\n\n2) [المستوى المتوقع] احسب حجم 0.25 mol من غاز النيتروجين.\nالإجابة النموذجية: 6 L.\n\n3) [المستوى المتقدم] ما كتلة 12 L من غاز الأكسجين O₂ (O = 16)؟\nالإجابة النموذجية: 0.5 mol × 32 = 16 g.\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n1) [مستوى الدعم] ما نسبة مولات Mg إلى H₂ في التفاعل Mg + 2HCl → MgCl₂ + H₂؟\nالإجابة النموذجية: 1 : 1.\n\n2) [المستوى المتوقع] احسب حجم الهيدروجين الناتج من 0.24 g من الماغنيسيوم.\nالإجابة النموذجية: 0.01 mol ← 240 cm³.\n\n3) [المستوى المتقدم] نتج 96 cm³ من الهيدروجين. ما كتلة الماغنيسيوم المتفاعل؟\nالإجابة النموذجية: 0.004 mol × 24 = 0.096 g."},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>1 L = ......... cm³<\/bdi>.<\/td><td>1000.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم مولًا في 240 cm³ من الهيدروجين؟<\/td><td>0.01 mol.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>بالونان متساويان في الحجم، أحدهما هيدروجين والآخر ثاني أكسيد الكربون في الظروف نفسها. قارن عدد الجزيئات والكتلة.<\/td><td>عدد الجزيئات متساوٍ، لكن كتلة CO₂ أكبر لأن Mr له 44 مقابل 2.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يجب أن يكون الحمض زائدًا حتى يتفاعل الماغنيسيوم كله.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم CO₂ الناتج من تسخين 10 g من <bdi>CaCO₃ (Mr = 100)<\/bdi>.<\/td><td>0.1 mol ← 2.4 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا قد يكون الحجم المقيس أقل من المحسوب؟<\/td><td>تسرب الغاز قبل إغلاق الجهاز، أو وجود طبقة أكسيد على سطح الماغنيسيوم.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الحجم المولي للغاز\n1) [مستوى الدعم] أكمل: 1 L = ......... cm³.\nالإجابة النموذجية: 1000.\n\n2) [المستوى المتوقع] كم مولًا في 240 cm³ من الهيدروجين؟\nالإجابة النموذجية: 0.01 mol.\n\n3) [المستوى المتقدم] بالونان متساويان في الحجم، أحدهما هيدروجين والآخر ثاني أكسيد الكربون في الظروف نفسها. قارن عدد الجزيئات والكتلة.\nالإجابة النموذجية: عدد الجزيئات متساوٍ، لكن كتلة CO₂ أكبر لأن Mr له 44 مقابل 2.\n\nالحصة 2: حجم الغاز الناتج من تفاعل\n1) [مستوى الدعم] صواب أم خطأ: يجب أن يكون الحمض زائدًا حتى يتفاعل الماغنيسيوم كله.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] احسب حجم CO₂ الناتج من تسخين 10 g من CaCO₃ (Mr = 100).\nالإجابة النموذجية: 0.1 mol ← 2.4 L.\n\n3) [المستوى المتقدم] لماذا قد يكون الحجم المقيس أقل من المحسوب؟\nالإجابة النموذجية: تسرب الغاز قبل إغلاق الجهاز، أو وجود طبقة أكسيد على سطح الماغنيسيوم."},{"h":"<div class=\"psub\">الحصة 1: الحجم المولي للغاز<\/div><p>مراجعة كتاب الطالب ص 65–66 والإجابة عن السؤالين 12-3 و13-3، والبدء في تمرين 5-3 في كتاب النشاط ص 42–43.<\/p><div class=\"psub\">الحصة 2: حجم الغاز الناتج من تفاعل<\/div><p>حل تمرين 4-3 تحديد كتلة شريط من الماغنيسيوم وإكمال تمرين 5-3 والسؤال 1 من ورقة العمل 5-3 في كتاب النشاط ص 40–43 و52، والإجابة عن السؤالين 14-3 و15-3 والسؤال 4 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: الحجم المولي للغاز\nمراجعة كتاب الطالب ص 65–66 والإجابة عن السؤالين 12-3 و13-3، والبدء في تمرين 5-3 في كتاب النشاط ص 42–43.\n\nالحصة 2: حجم الغاز الناتج من تفاعل\nحل تمرين 4-3 تحديد كتلة شريط من الماغنيسيوم وإكمال تمرين 5-3 والسؤال 1 من ورقة العمل 5-3 في كتاب النشاط ص 40–43 و52، والإجابة عن السؤالين 14-3 و15-3 والسؤال 4 من أسئلة نهاية الوحدة."}]}},{"label":"5-3 حسابات تتضمن محاليل متفاعلة","unit":"الوحدة الثالثة: الكيمياء الكمية","periods":[{"n":1,"focus":"التركيز بوحدتي mol/L وg/L","info":"<div><b>الدرس:<\/b> 5-3 حسابات تتضمن محاليل متفاعلة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 69–77 | كتاب النشاط: تمرين 6-3 ص 44–45، ورقة العمل 5-3 ص 52–53، ورقة العمل 6-3 ص 54–57<\/div><div><b>دليل المعلم:<\/b> ص 57<\/div><div><b>محور الحصة:<\/b> التركيز بوحدتي mol/L وg/L<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحسب تركيز المحلول بوحدتي mol/L وg/L.<\/li><li>يحسب عدد مولات المذاب من الحجم والتركيز.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحول بين التركيز بوحدة mol/L والتركيز بوحدة g/L.<\/div>","t":"1. يحسب تركيز المحلول بوحدتي mol/L وg/L.\n2. يحسب عدد مولات المذاب من الحجم والتركيز.\nمخرج تعليمي آخر: يحول بين التركيز بوحدة mol/L والتركيز بوحدة g/L."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب تركيز المحلول بوحدتي mol/L وg/L.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب عدد مولات المذاب من الحجم والتركيز.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحول بين التركيز بوحدة mol/L والتركيز بوحدة g/L.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يحسب تركيز المحلول بوحدتي mol/L وg/L. ← تطبيق\n• يحسب عدد مولات المذاب من الحجم والتركيز. ← تطبيق\n• يحول بين التركيز بوحدة mol/L والتركيز بوحدة g/L. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: دورق حجمي، ميزان، هيدروكسيد الصوديوم لعرض تحضير محلول، نظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: دورق حجمي، ميزان، هيدروكسيد الصوديوم لعرض تحضير محلول، نظارات واقية"},{"h":"<div class=\"pills\"><span>التركيز<\/span><span>المذاب<\/span><span>المذيب<\/span><span>mol/L<\/span><span>g/L<\/span><span>الدورق الحجمي<\/span><\/div>","t":"التركيز، المذاب، المذيب، mol/L، g/L، الدورق الحجمي"},{"h":"<p>يعرض كوبين من العصير بتركيزين مختلفين ويسأل: كيف نعبر عن «قوة» المحلول بالأرقام؟<\/p>","t":"يعرض كوبين من العصير بتركيزين مختلفين ويسأل: كيف نعبر عن «قوة» المحلول بالأرقام؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الكوبين.<\/td><td>يقترحون طرقًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التركيز (كتاب الطالب ص 69–71)<\/td><td>يعرّف: التركيز (mol/L) = عدد المولات ÷ الحجم باللتر، والتركيز (g/L) = الكتلة ÷ الحجم باللتر.<\/td><td>يدونون ويحولون الحجوم من mL إلى L.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحضير محلول (عرض)<\/td><td>يحضر 250 mL من محلول NaOH تركيزه <bdi>0.2 mol/L: 0.05 mol × 40 = 2.0 g<\/bdi>.<\/td><td>يحسبون كتلة المذاب لمحاليل أخرى.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 6-3 حسابات تتضمن محاليل (البدء – كتاب النشاط ص 44)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الكوبين.\nدور الطالب: يقترحون طرقًا.\n\n(10 دقائق) التركيز (كتاب الطالب ص 69–71)\nدور المعلم: يعرّف: التركيز (mol/L) = عدد المولات ÷ الحجم باللتر، والتركيز (g/L) = الكتلة ÷ الحجم باللتر.\nدور الطالب: يدونون ويحولون الحجوم من mL إلى L.\n\n(12 دقيقة) تحضير محلول (عرض)\nدور المعلم: يحضر 250 mL من محلول NaOH تركيزه 0.2 mol/L: 0.05 mol × 40 = 2.0 g.\nدور الطالب: يحسبون كتلة المذاب لمحاليل أخرى.\n\n(8 دقائق) تمرين 6-3 حسابات تتضمن محاليل (البدء – كتاب النشاط ص 44)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب علاقة التركيز بوحدة mol/L.<\/td><td>التركيز = عدد المولات ÷ الحجم باللتر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ذُوب 0.5 mol من مادة في 2 L. ما التركيز؟<\/td><td>0.25 mol/L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>محلول NaOH تركيزه 0.5 mol/L. احسب تركيزه بوحدة <bdi>g/L (NaOH = 40)<\/bdi>.<\/td><td>20 g/L.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اكتب علاقة التركيز بوحدة mol/L.\nالإجابة النموذجية: التركيز = عدد المولات ÷ الحجم باللتر.\n\n2) [المستوى المتوقع] ذُوب 0.5 mol من مادة في 2 L. ما التركيز؟\nالإجابة النموذجية: 0.25 mol/L.\n\n3) [المستوى المتقدم] محلول NaOH تركيزه 0.5 mol/L. احسب تركيزه بوحدة g/L (NaOH = 40).\nالإجابة النموذجية: 20 g/L."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>250 mL = ......... L<\/bdi>.<\/td><td>0.25.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم مولًا في 50 mL من محلول تركيزه 2 mol/L؟<\/td><td>0.1 mol.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>احسب كتلة NaCl اللازمة لتحضير 500 mL من محلول تركيزه <bdi>0.1 mol/L (NaCl = 58.5)<\/bdi>.<\/td><td><bdi>0.05 mol × 58.5 = 2.925 g<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: 250 mL = ......... L.\nالإجابة النموذجية: 0.25.\n\n2) [المستوى المتوقع] كم مولًا في 50 mL من محلول تركيزه 2 mol/L؟\nالإجابة النموذجية: 0.1 mol.\n\n3) [المستوى المتقدم] احسب كتلة NaCl اللازمة لتحضير 500 mL من محلول تركيزه 0.1 mol/L (NaCl = 58.5).\nالإجابة النموذجية: 0.05 mol × 58.5 = 2.925 g."},{"h":"<p>مراجعة كتاب الطالب ص 69–72 والإجابة عن الأسئلة 16-3 إلى 18-3، وحل الجزء الأول من تمرين 6-3 في كتاب النشاط ص 44–45.<\/p>","t":"مراجعة كتاب الطالب ص 69–72 والإجابة عن الأسئلة 16-3 إلى 18-3، وحل الجزء الأول من تمرين 6-3 في كتاب النشاط ص 44–45."}]},{"n":2,"focus":"المعايرة وحساب التركيز المجهول","info":"<div><b>الدرس:<\/b> 5-3 حسابات تتضمن محاليل متفاعلة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 69–77 | كتاب النشاط: تمرين 6-3 ص 44–45، ورقة العمل 5-3 ص 52–53، ورقة العمل 6-3 ص 54–57<\/div><div><b>دليل المعلم:<\/b> ص 57<\/div><div><b>محور الحصة:<\/b> المعايرة وحساب التركيز المجهول<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحسب تركيز حمض مجهول من نتائج معايرة.<\/li><li>يصف خطوات المعايرة باستخدام السحاحة والماصة والكاشف.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم دقة نتائج المعايرة ويقترح طرقًا لتحسينها.<\/div>","t":"1. يحسب تركيز حمض مجهول من نتائج معايرة.\n2. يصف خطوات المعايرة باستخدام السحاحة والماصة والكاشف.\nمخرج تعليمي آخر: يقيّم دقة نتائج المعايرة ويقترح طرقًا لتحسينها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب تركيز حمض مجهول من نتائج معايرة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصف خطوات المعايرة باستخدام السحاحة والماصة والكاشف.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقيّم دقة نتائج المعايرة ويقترح طرقًا لتحسينها.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يحسب تركيز حمض مجهول من نتائج معايرة. ← تطبيق\n• يصف خطوات المعايرة باستخدام السحاحة والماصة والكاشف. ← فهم\n• يقيّم دقة نتائج المعايرة ويقترح طرقًا لتحسينها. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: سحاحة، ماصة 25 mL، دورق مخروطي، محلول NaOH معلوم التركيز، حمض الهيدروكلوريك، كاشف الفينولفثالين، نظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: سحاحة، ماصة 25 mL، دورق مخروطي، محلول NaOH معلوم التركيز، حمض الهيدروكلوريك، كاشف الفينولفثالين، نظارات واقية"},{"h":"<div class=\"pills\"><span>المعايرة<\/span><span>السحاحة<\/span><span>الماصة<\/span><span>الكاشف<\/span><span>نقطة التعادل<\/span><\/div>","t":"المعايرة، السحاحة، الماصة، الكاشف، نقطة التعادل"},{"h":"<p>سؤال: لديك حمض مجهول التركيز وقلوي معلوم التركيز؛ كيف تكشف تركيز الحمض؟<\/p>","t":"سؤال: لديك حمض مجهول التركيز وقلوي معلوم التركيز؛ كيف تكشف تركيز الحمض؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون طرقًا.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 4-3 تحديد تركيز محلول من حمض الهيدروكلوريك (كتاب الطالب ص 76–77)<\/td><td>يوضح غسل السحاحة بالحمض، وسحب 25.0 mL من NaOH بالماصة، وإضافة الكاشف، والمعايرة حتى تغير اللون.<\/td><td>يجرون المعايرة ويسجلون الحجوم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الحساب<\/td><td>يحل على السبورة الذكية: 25.0 mL NaOH تركيزه <bdi>0.100 mol/L = 0.0025 mol<\/bdi>، احتاجت 20.0 mL من HCl، فالتركيز = <bdi>0.0025 ÷ 0.020 = 0.125 mol/L<\/bdi>.<\/td><td>يحسبون تركيز حمضهم من نتائجهم.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون طرقًا.\n\n(15 دقيقة) النشاط 4-3 تحديد تركيز محلول من حمض الهيدروكلوريك (كتاب الطالب ص 76–77)\nدور المعلم: يوضح غسل السحاحة بالحمض، وسحب 25.0 mL من NaOH بالماصة، وإضافة الكاشف، والمعايرة حتى تغير اللون.\nدور الطالب: يجرون المعايرة ويسجلون الحجوم.\n\n(10 دقائق) الحساب\nدور المعلم: يحل على السبورة الذكية: 25.0 mL NaOH تركيزه 0.100 mol/L = 0.0025 mol، احتاجت 20.0 mL من HCl، فالتركيز = 0.0025 ÷ 0.020 = 0.125 mol/L.\nدور الطالب: يحسبون تركيز حمضهم من نتائجهم.\n\n(6 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الكاشف في المعايرة؟<\/td><td>تحديد نقطة التعادل بتغير اللون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب مولات NaOH في 25.0 mL من محلول تركيزه 0.100 mol/L.<\/td><td>0.0025 mol.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>25.0 mL من NaOH تركيزه 0.200 mol/L عادلت 25.0 mL من HCl. احسب تركيز الحمض <bdi>(NaOH + HCl → NaCl + H₂O)<\/bdi>.<\/td><td>0.005 mol ← <bdi>0.005 mol HCl ÷ 0.025 L = 0.200 mol/L<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وظيفة الكاشف في المعايرة؟\nالإجابة النموذجية: تحديد نقطة التعادل بتغير اللون.\n\n2) [المستوى المتوقع] احسب مولات NaOH في 25.0 mL من محلول تركيزه 0.100 mol/L.\nالإجابة النموذجية: 0.0025 mol.\n\n3) [المستوى المتقدم] 25.0 mL من NaOH تركيزه 0.200 mol/L عادلت 25.0 mL من HCl. احسب تركيز الحمض (NaOH + HCl → NaCl + H₂O).\nالإجابة النموذجية: 0.005 mol ← 0.005 mol HCl ÷ 0.025 L = 0.200 mol/L."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تُغسل السحاحة بالمحلول الذي ستُملأ به قبل المعايرة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الأداة التي تقيس حجمًا ثابتًا دقيقًا مثل 25.0 mL؟<\/td><td>الماصة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُكرر المعايرة حتى الحصول على قراءتين متقاربتين؟<\/td><td>لزيادة موثوقية النتائج واستبعاد القراءات الشاذة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تُغسل السحاحة بالمحلول الذي ستُملأ به قبل المعايرة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الأداة التي تقيس حجمًا ثابتًا دقيقًا مثل 25.0 mL؟\nالإجابة النموذجية: الماصة.\n\n3) [المستوى المتقدم] لماذا تُكرر المعايرة حتى الحصول على قراءتين متقاربتين؟\nالإجابة النموذجية: لزيادة موثوقية النتائج واستبعاد القراءات الشاذة."},{"h":"<p>إكمال تمرين 6-3 وورقتي العمل 5-3 (الأسئلة 2–4) و6-3 في كتاب النشاط ص 44–45 و52–57، والإجابة عن السؤالين 19-3 و20-3 والسؤال 5 من أسئلة نهاية الوحدة.<\/p>","t":"إكمال تمرين 6-3 وورقتي العمل 5-3 (الأسئلة 2–4) و6-3 في كتاب النشاط ص 44–45 و52–57، والإجابة عن السؤالين 19-3 و20-3 والسؤال 5 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 5-3 حسابات تتضمن محاليل متفاعلة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 69–77 | كتاب النشاط: تمرين 6-3 ص 44–45، ورقة العمل 5-3 ص 52–53، ورقة العمل 6-3 ص 54–57<\/div><div><b>دليل المعلم:<\/b> ص 57<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: التركيز بوحدتي mol/L وg/L<\/div><ol class=\"ol\"><li>يحسب تركيز المحلول بوحدتي mol/L وg/L.<\/li><li>يحسب عدد مولات المذاب من الحجم والتركيز.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحول بين التركيز بوحدة mol/L والتركيز بوحدة g/L.<\/div><div class=\"psub\">الحصة 2: المعايرة وحساب التركيز المجهول<\/div><ol class=\"ol\"><li>يحسب تركيز حمض مجهول من نتائج معايرة.<\/li><li>يصف خطوات المعايرة باستخدام السحاحة والماصة والكاشف.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم دقة نتائج المعايرة ويقترح طرقًا لتحسينها.<\/div>","t":"الحصة 1: التركيز بوحدتي mol/L وg/L\n1. يحسب تركيز المح 2: المعايرة وحساب التركيز المجهول<\/div><p>سؤال: لديك حمض مجهول التركيز وقلوي معلوم التركيز؛ كيف تكشف تركيز الحمض؟<\/p>","t":"الحصة 1: التركيز بوحدتي mol/L وg/L\nيعرض كوبين من العصير بتركيزين مختلفين ويسأل: كيف نعبر عن «قوة» المحلول بالأرقام؟\n\nالحصة 2: المعايرة وحساب التركيز المجهول\nسؤال: لديك حمض مجهول التركيز وقلوي معلوم التركيز؛ كيف تكشف تركيز الحمض؟"},{"h":"<div class=\"psub\">الحصة 1: التركيز بوحدتي mol/L وg/L<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الكوبين.<\/td><td>يقترحون طرقًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التركيز (كتاب الطالب ص 69–71)<\/td><td>يعرّف: التركيز (mol/L) = عدد المولات ÷ الحجم باللتر، والتركيز (g/L) = الكتلة ÷ الحجم باللتر.<\/td><td>يدونون ويحولون الحجوم من mL إلى L.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحضير محلول (عرض)<\/td><td>يحضر 250 mL من محلول NaOH تركيزه <bdi>0.2 mol/L: 0.05 mol × 40 = 2.0 g<\/bdi>.<\/td><td>يحسبون كتلة المذاب لمحاليل أخرى.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 6-3 حسابات تتضمن محاليل (البدء – كتاب النشاط ص 44)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المعايرة وحساب التركيز المجهول<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون طرقًا.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 4-3 تحديد تركيز محلول من حمض الهيدروكلوريك (كتاب الطالب ص 76–77)<\/td><td>يوضح غسل السحاحة بالحمض، وسحب 25.0 mL من NaOH بالماصة، وإضافة الكاشف، والمعايرة حتى تغير اللون.<\/td><td>يجرون المعايرة ويسجلون الحجوم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الحساب<\/td><td>يحل على السبورة الذكية: 25.0 mL NaOH تركيزه <bdi>0.100 mol/L = 0.0025 mol<\/bdi>، احتاجت 20.0 mL من HCl، فالتركيز = <bdi>0.0025 ÷ 0.020 = 0.125 mol/L<\/bdi>.<\/td><td>يحسبون تركيز حمضهم من نتائجهم.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التركيز بوحدتي mol/L وg/L\n(5 دقائق) التهيئة\nدور المعلم: يعرض الكوبين.\nدور الطالب: يقترحون طرقًا.\n\n(10 دقائق) التركيز (كتاب الطالب ص 69–71)\nدور المعلم: يعرّف: التركيز (mol/L) = عدد المولات ÷ الحجم باللتر، والتركيز (g/L) = الكتلة ÷ الحجم باللتر.\nدور الطالب: يدونون ويحولون الحجوم من mL إلى L.\n\n(12 دقيقة) تحضير محلول (عرض)\nدور المعلم: يحضر 250 mL من محلول NaOH تركيزه 0.2 mol/L: 0.05 mol × 40 = 2.0 g.\nدور الطالب: يحسبون كتلة المذاب لمحاليل أخرى.\n\n(8 دقائق) تمرين 6-3 حسابات تتضمن محاليل (البدء – كتاب النشاط ص 44)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: المعايرة وحساب التركيز المجهول\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون طرقًا.\n\n(15 دقيقة) النشاط 4-3 تحديد تركيز محلول من حمض الهيدروكلوريك (كتاب الطالب ص 76–77)\nدور المعلم: يوضح غسل السحاحة بالحمض، وسحب 25.0 mL من NaOH بالماصة، وإضافة الكاشف، والمعايرة حتى تغير اللون.\nدور الطالب: يجرون المعايرة ويسجلون الحجوم.\n\n(10 دقائق) الحساب\nدور المعلم: يحل على السبورة الذكية: 25.0 mL NaOH تركيزه 0.100 mol/L = 0.0025 mol، احتاجت 20.0 mL من HCl، فالتركيز = 0.0025 ÷ 0.020 = 0.125 mol/L.\nدور الطالب: يحسبون تركيز حمضهم من نتائجهم.\n\n(6 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: التركيز بوحدتي mol/L وg/L<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب علاقة التركيز بوحدة mol/L.<\/td><td>التركيز = عدد المولات ÷ الحجم باللتر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ذُوب 0.5 mol من مادة في 2 L. ما التركيز؟<\/td><td>0.25 mol/L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>محلول NaOH تركيزه 0.5 mol/L. احسب تركيزه بوحدة <bdi>g/L (NaOH = 40)<\/bdi>.<\/td><td>20 g/L.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المعايرة وحساب التركيز المجهول<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الكاشف في المعايرة؟<\/td><td>تحديد نقطة التعادل بتغير اللون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب مولات NaOH في 25.0 mL من محلول تركيزه 0.100 mol/L.<\/td><td>0.0025 mol.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>25.0 mL من NaOH تركيزه 0.200 mol/L عادلت 25.0 mL من HCl. احسب تركيز الحمض <bdi>(NaOH + HCl → NaCl + H₂O)<\/bdi>.<\/td><td>0.005 mol ← <bdi>0.005 mol HCl ÷ 0.025 L = 0.200 mol/L<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التركيز بوحدتي mol/L وg/L\n1) [مستوى الدعم] اكتب علاقة التركيز بوحدة mol/L.\nالإجابة النموذجية: التركيز = عدد المولات ÷ الحجم باللتر.\n\n2) [المستوى المتوقع] ذُوب 0.5 mol من مادة في 2 L. ما التركيز؟\nالإجابة النموذجية: 0.25 mol/L.\n\n3) [المستوى المتقدم] محلول NaOH تركيزه 0.5 mol/L. احسب تركيزه بوحدة g/L (NaOH = 40).\nالإجابة النموذجية: 20 g/L.\n\nالحصة 2: المعايرة وحساب التركيز المجهول\n1) [مستوى الدعم] ما وظيفة الكاشف في المعايرة؟\nالإجابة النموذجية: تحديد نقطة التعادل بتغير اللون.\n\n2) [المستوى المتوقع] احسب مولات NaOH في 25.0 mL من محلول تركيزه 0.100 mol/L.\nالإجابة النموذجية: 0.0025 mol.\n\n3) [المستوى المتقدم] 25.0 mL من NaOH تركيزه 0.200 mol/L عادلت 25.0 mL من HCl. احسب تركيز الحمض (NaOH + HCl → NaCl + H₂O).\nالإجابة النموذجية: 0.005 mol ← 0.005 mol HCl ÷ 0.025 L = 0.200 mol/L."},{"h":"<div class=\"psub\">الحصة 1: التركيز بوحدتي mol/L وg/L<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>250 mL = ......... L<\/bdi>.<\/td><td>0.25.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم مولًا في 50 mL من محلول تركيزه 2 mol/L؟<\/td><td>0.1 mol.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>احسب كتلة NaCl اللازمة لتحضير 500 mL من محلول تركيزه <bdi>0.1 mol/L (NaCl = 58.5)<\/bdi>.<\/td><td><bdi>0.05 mol × 58.5 = 2.925 g<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المعايرة وحساب التركيز المجهول<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تُغسل السحاحة بالمحلول الذي ستُملأ به قبل المعايرة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الأداة التي تقيس حجمًا ثابتًا دقيقًا مثل 25.0 mL؟<\/td><td>الماصة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُكرر المعايرة حتى الحصول على قراءتين متقاربتين؟<\/td><td>لزيادة موثوقية النتائج واستبعاد القراءات الشاذة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التركيز بوحدتي mol/L وg/L\n1) [مستوى الدعم] أكمل: 250 mL = ......... L.\nالإجابة النموذجية: 0.25.\n\n2) [المستوى المتوقع] كم مولًا في 50 mL من محلول تركيزه 2 mol/L؟\nالإجابة النموذجية: 0.1 mol.\n\n3) [المستوى المتقدم] احسب كتلة NaCl اللازمة لتحضير 500 mL من محلول تركيزه 0.1 mol/L (NaCl = 58.5).\nالإجابة النموذجية: 0.05 mol × 58.5 = 2.925 g.\n\nالحصة 2: المعايرة وحساب التركيز المجهول\n1) [مستوى الدعم] صواب أم خطأ: تُغسل السحاحة بالمحلول الذي ستُملأ به قبل المعايرة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الأداة التي تقيس حجمًا ثابتًا دقيقًا مثل 25.0 mL؟\nالإجابة النموذجية: الماصة.\n\n3) [المستوى المتقدم] لماذا تُكرر المعايرة حتى الحصول على قراءتين متقاربتين؟\nالإجابة النموذجية: لزيادة موثوقية النتائج واستبعاد القراءات الشاذة."},{"h":"<div class=\"psub\">الحصة 1: التركيز بوحدتي mol/L وg/L<\/div><p>مراجعة كتاب الطالب ص 69–72 والإجابة عن الأسئلة 16-3 إلى 18-3، وحل الجزء الأول من تمرين 6-3 في كتاب النشاط ص 44–45.<\/p><div class=\"psub\">الحصة 2: المعايرة وحساب التركيز المجهول<\/div><p>إكمال تمرين 6-3 وورقتي العمل 5-3 (الأسئلة 2–4) و6-3 في كتاب النشاط ص 44–45 و52–57، والإجابة عن السؤالين 19-3 و20-3 والسؤال 5 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: التركيز بوحدتي mol/L وg/L\nمراجعة كتاب الطالب ص 69–72 والإجابة عن الأسئلة 16-3 إلى 18-3، وحل الجزء الأول من تمرين 6-3 في كتاب النشاط ص 44–45.\n\nالحصة 2: المعايرة وحساب التركيز المجهول\nإكمال تمرين 6-3 وورقتي العمل 5-3 (الأسئلة 2–4) و6-3 في كتاب النشاط ص 44–45 و52–57، والإجابة عن السؤالين 19-3 و20-3 والسؤال 5 من أسئلة نهاية الوحدة."}]}},{"label":"مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة","unit":"الوحدة الثالثة: الكيمياء الكمية","periods":[{"n":1,"focus":"حل أسئلة نهاية الوحدة الثالثة","info":"<div><b>الدرس:<\/b> مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 78–79 | كتاب النشاط: مراجعة تمارين الوحدة وأوراق عملها ص 36–57<\/div><div><b>دليل المعلم:<\/b> ص 75<\/div><div><b>محور الحصة:<\/b> حل أسئلة نهاية الوحدة الثالثة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يطبق حسابات الكتل النسبية والمول والكتل والحجوم والتراكيز في حل أسئلة نهاية الوحدة.<\/li><li>يختار العلاقة المناسبة لكل نوع من المسائل الكمية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم خريطة تدفق لحل المسائل الكمية.<\/div>","t":"1. يطبق حسابات الكتل النسبية والمول والكتل والحجوم والتراكيز في حل أسئلة نهاية الوحدة.\n2. يختار العلاقة المناسبة لكل نوع من المسائل الكمية.\nمخرج تعليمي آخر: يصمم خريطة تدفق لحل المسائل الكمية."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th نموذجية: 0.01 mol HCl ← 0.01 mol NaOH = 0.4 g."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الحجم المولي للغاز = ......... L.<\/td><td>24.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب Mr لـ <bdi>H₂SO₄ (H = 1<\/bdi>، <bdi>S = 32<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>98.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أيهما يحتوي جزيئات أكثر: 16 g من O₂ أم 22 g من CO₂؟<\/td><td>متساويان؛ كلاهما 0.5 mol.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الحجم المولي للغاز = ......... L.\nالإجابة النموذجية: 24.\n\n2) [المستوى المتوقع] احسب Mr لـ H₂SO₄ (H = 1، S = 32، O = 16).\nالإجابة النموذجية: 98.\n\n3) [المستوى المتقدم] أيهما يحتوي جزيئات أكثر: 16 g من O₂ أم 22 g من CO₂؟\nالإجابة النموذجية: متساويان؛ كلاهما 0.5 mol."},{"h":"<p>إكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 78–79، ومراجعة أوراق العمل 1-3 إلى 6-3 في كتاب النشاط، والاستعداد للوحدة الرابعة: مدخل إلى الكيمياء العضوية (ص 80).<\/p>","t":"إكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 78–79، ومراجعة أوراق العمل 1-3 إلى 6-3 في كتاب النشاط، والاستعداد للوحدة الرابعة: مدخل إلى الكيمياء العضوية (ص 80)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: الكيمياء الكمية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 78–79 | كتاب النشاط: مراجعة تمارين الوحدة وأوراق عملها ص 36–57<\/div><div><b>دليل المعلم:<\/b> ص 75<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: حل أسئلة نهاية الوحدة الثالثة<\/div><ol class=\"ol\"><li>يطبق حسابات الكتل النسبية والمول والكتل والحجوم والتراكيز في حل أسئلة نهاية الوحدة.<\/li><li>يختار العلاقة المناسبة لكل نوع من المسائل الكمية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم خريطة تدفق لحل المسائل الكمية.<\/div>","t":"الح ><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب ثلاث علاقات لحساب عدد المولات.<\/td><td>المولات = الكتلة ÷ الكتلة المولية؛ مولات الغاز = الحجم <bdi>(L) ÷ 24<\/bdi>؛ مولات المذاب = التركيز × الحجم (L).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب حجم CO₂ الناتج من احتراق 6 g من الكربون: <bdi>C + O₂ → CO₂<\/bdi>.<\/td><td>0.5 mol ← 12 L.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما كتلة هيدروكسيد الصوديوم اللازمة لمعادلة 50 mL من HCl تركيزه 0.2 mol/L؟<\/td><td>0.01 mol HCl ← <bdi>0.01 mol NaOH = 0.4 g<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حل أسئلة نهاية الوحدة الثالثة\n1) [مستوى الدعم] اكتب ثلاث علاقات لحساب عدد المولات.\nالإجابة النموذجية: المولات = الكتلة ÷ الكتلة المولية؛ مولات الغاز = الحجم (L) ÷ 24؛ مولات المذاب = التركيز × الحجم (L).\n\n2) [المستوى المتوقع] احسب حجم CO₂ الناتج من احتراق 6 g من الكربون: C + O₂ → CO₂.\nالإجابة النموذجية: 0.5 mol ← 12 L.\n\n3) [المستوى المتقدم] ما كتلة هيدروكسيد الصوديوم اللازمة لمعادلة 50 mL من HCl تركيزه 0.2 mol/L؟\nالإجابة النموذجية: 0.01 mol HCl ← 0.01 mol NaOH = 0.4 g."},{"h":"<div class=\"psub\">الحصة 1: حل أسئلة نهاية الوحدة الثالثة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الحجم المولي للغاز = ......... L.<\/td><td>24.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب Mr لـ <bdi>H₂SO₄ (H = 1<\/bdi>، <bdi>S = 32<\/bdi>، <bdi>O = 16)<\/bdi>.<\/td><td>98.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أيهما يحتوي جزيئات أكثر: 16 g من O₂ أم 22 g من CO₂؟<\/td><td>متساويان؛ كلاهما 0.5 mol.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حل أسئلة نهاية الوحدة الثالثة\n1) [مستوى الدعم] أكمل: الحجم المولي للغاز = ......... L.\nالإجابة النموذجية: 24.\n\n2) [المستوى المتوقع] احسب Mr لـ H₂SO₄ (H = 1، S = 32، O = 16).\nالإجابة النموذجية: 98.\n\n3) [المستوى المتقدم] أيهما يحتوي جزيئات أكثر: 16 g من O₂ أم 22 g من CO₂؟\nالإجابة النموذجية: متساويان؛ كلاهما 0.5 mol."},{"h":"<div class=\"psub\">الحصة 1: حل أسئلة نهاية الوحدة الثالثة<\/div><p>إكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 78–79، ومراجعة أوراق العمل 1-3 إلى 6-3 في كتاب النشاط، والاستعداد للوحدة الرابعة: مدخل إلى الكيمياء العضوية (ص 80).<\/p>","t":"الحصة 1: حل أسئلة نهاية الوحدة الثالثة\nإكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 78–79، ومراجعة أوراق العمل 1-3 إلى 6-3 في كتاب النشاط، والاستعداد للوحدة الرابعة: مدخل إلى الكيمياء العضوية (ص 80)."}]}},{"label":"1-4 الألكانات","unit":"الوحدة الرابعة: مدخل إلى الكيمياء العضوية","periods":[{"n":1,"focus":"الهيدروكربونات والسلاسل المتجانسة","info":"<div><b>الدرس:<\/b> 1-4 الألكانات<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: مدخل إلى الكيمياء العضوية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 80–85 | كتاب النشاط: تمرين 1-4 ص 58، ورقة العمل 1-4 ص 67–68، ورقة العمل 2-4 ص 69–70<\/div><div><b>دليل المعلم:<\/b> ص 78–79<\/div><div><b>محور الحصة:<\/b> الهيدروكربونات والسلاسل المتجانسة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف السلاسل المتجانسة بأنها عائلات من المركبات لها الصيغة العامة نفسها وخصائص كيميائية متشابهة.<\/li><li>يذكر نوع المركب من نهاية اسمه (-ان، -ين، -ول).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج الصيغة العامة للألكانات CₙH₂ₙ₊₂ من أمثلة.<\/div>","t":"1. يصف السلاسل المتجانسة بأنها عائلات من المركبات لها الصيغة العامة نفسها وخصائص كيميائية متشابهة.\n2. يذكر نوع المركب من نهاية اسمه (-ان، -ين، -ول).\nمخرج تعليمي آخر: يستنتج الصيغة العامة للألكانات CₙH₂ₙ₊₂ من أمثلة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف السلاسل المتجانسة بأنها عائلات من المركبات لها الصيغة العامة نفسها وخصائص كيميائية متشابهة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر نوع المركب من نهاية اسمه (-ان، -ين، -ول).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يستنتج الصيغة العامة للألكانات CₙH₂ₙ₊₂ من أمثلة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف السلاسل المتجانسة بأنها عائلات من المركبات لها الصيغة العامة نفسها وخصائص كيميائية متشابهة. ← فهم\n• يذكر نوع المركب من نهاية اسمه (-ان، -ين، -ول). ← تذكر\n• يستنتج الصيغة العامة للألكانات CₙH₂ₙ₊₂ من أمثلة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة"},{"h":"<div class=\"pills\"><span>الهيدروكربون<\/span><span>السلسلة المتجانسة<\/span><span>الصيغة العامة<\/span><span>الألكانات<\/span><\/div>","t":"الهيدروكربون، السلسلة المتجانسة، الصيغة العامة، الألكانات"},{"h":"<p>سؤال: ما المشترك بين غاز الطبخ والبنزين وشمع الشموع؟<\/p>","t":"سؤال: ما المشترك بين غاز الطبخ والبنزين وشمع الشموع؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الهيدروكربونات (كتاب الطالب ص 80–81)<\/td><td>يعرّف الهيدروكربون: مركب من الكربون والهيدروجين فقط، ويوضح قدرة الكربون على تكوين أربع روابط وسلاسل.<\/td><td>يصنفون مركبات معطاة إلى هيدروكربونات وغير هيدروكربونات.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">بناء النماذج<\/td><td>يوجه إلى بناء نماذج الميثان والإيثان والبروبان والبيوتان بالكرات والعصي.<\/td><td>يرسمون الصيغ البنائية ويستنتجون الصيغة العامة CₙH₂ₙ₊₂.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تسمية العائلات<\/td><td>يوضح نهايات الأسماء: -ان للألكانات، -ين للألكينات، -ول للكحولات.<\/td><td>يصنفون أسماء معطاة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الهيدروكربونات (كتاب الطالب ص 80–81)\nدور المعلم: يعرّف الهيدروكربون: مركب من الكربون والهيدروجين فقط، ويوضح قدرة الكربون على تكوين أربع روابط وسلاسل.\nدور الطالب: يصنفون مركبات معطاة إلى هيدروكربونات وغير هيدروكربونات.\n\n(15 دقيقة) بناء النماذج\nدور المعلم: يوجه إلى بناء نماذج الميثان والإيثان والبروبان والبيوتان بالكرات والعصي.\nدور الطالب: يرسمون الصيغ البنائية ويستنتجون الصيغة العامة CₙH₂ₙ₊₂.\n\n(5 دقائق) تسمية العائلات\nدور المعلم: يوضح نهايات الأسماء: -ان للألكانات، -ين للألكينات، -ول للكحولات.\nدور الطالب: يصنفون أسماء معطاة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الهيدروكربون؟<\/td><td>مركب يتكون من الكربون والهيدروجين فقط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>إلى أي عائلة ينتمي البروبان؟ وكيف عرفت؟<\/td><td>الألكانات؛ لأن اسمه ينتهي بـ (-ان).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>استخدم الصيغة العامة لتكتب صيغة ألكان فيه 5 ذرات كربون.<\/td><td>C₅H₁₂.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الهيدروكربون؟\nالإجابة النموذجية: مركب يتكون من الكربون والهيدروجين فقط.\n\n2) [المستوى المتوقع] إلى أي عائلة ينتمي البروبان؟ وكيف عرفت؟\nالإجابة النموذجية: الألكانات؛ لأن اسمه ينتهي بـ (-ان).\n\n3) [المستوى المتقدم] استخدم الصيغة العامة لتكتب صيغة ألكان فيه 5 ذرات كربون.\nالإجابة النموذجية: C₅H₁₂."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الصيغة العامة للألكانات .........<\/td><td>CₙH₂ₙ₊₂.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر خاصيتين مشتركتين لأفراد السلسلة المتجانسة.<\/td><td>الصيغة العامة نفسها، وخصائص كيميائية متشابهة.<\/td><\/tr><tr><td
