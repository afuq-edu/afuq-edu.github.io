:root{--ac:#8A4566;--acs:#B9708F;--tint:#F7EDF2;--line:#EAD5DF;--soft:#FCF7FA;--ink:#26323D;--mut:#6A7986;--bg:#F3F7FA;--ok:#3C9A72;--okt:#E5F5EC;--no:#C4675F;--not:#FBEDEB;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Tj,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 560px at 85% -10%,var(--tint),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acs);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;padding:12px 22px;max-width:1180px;margin:0 auto}
.brand{font-weight:700;color:var(--ac);line-height:1.3}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:.8rem}
.sp{flex:1}
.ib{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:12px;padding:6px 12px;color:var(--mut);font-size:.9rem}
.ib:hover{background:#fff}
.screen{display:none;max-width:1180px;margin:0 auto;padding:6px 22px 30px}
.screen.on{display:block;animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;box-shadow:0 6px 24px rgba(40,70,100,.06)}
h2.tt{margin:4px 0 12px;font-size:1.6rem;color:var(--ac)}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.step:last-of-type{border-bottom:0}
.sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--ac);font-weight:700}
.lab{font-weight:700;margin-bottom:6px}
select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;transition:background .2s,border-color .2s}
.chip.on{background:var(--tint);border-color:var(--acs);color:var(--ac);font-weight:700}
.chip.num{min-width:50px}
.pchip{border-radius:14px;text-align:start;line-height:1.45}
.pchip b{color:var(--ac)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.nm{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:4px 10px;background:#fff}
.nm input{border:0;outline:0;flex:1;min-width:0;padding:6px 0;background:transparent}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
input[type=range]{width:100%;accent-color:var(--acs)}
.note{color:var(--mut);font-size:.88rem;margin-top:6px}
.primary{border:0;background:var(--acs);color:#fff;font-weight:700;border-radius:14px;padding:12px 30px;font-size:1.05rem;box-shadow:0 6px 18px rgba(60,90,120,.18);transition:transform .15s}
.primary:hover{transform:translateY(-1px)}
.ghost{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 22px;font-weight:700;color:var(--ac)}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.center{text-align:center;padding:34px 16px}
.qnum{font-size:2.3rem;font-weight:700;color:var(--ac)}
.lv{display:inline-flex;gap:5px;align-items:center;color:var(--mut);font-size:.95rem}
.lv i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.lv i.f{background:var(--acs)}
.big .chip{font-size:1.12rem;padding:10px 18px;display:inline-flex;align-items:center;gap:8px}
.prog{height:6px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--acs);width:0;transition:width .6s ease}
.qhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.who{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;font-size:1.1rem}
.tags{display:flex;gap:8px;color:var(--mut);font-size:.9rem;align-items:center;flex-wrap:wrap}
.tags>span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.ring{position:relative;width:118px;height:118px;flex:none;margin-inline-start:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .rb{stroke:var(--tint)}
.ring .rf{stroke:var(--acs);stroke-linecap:round;transition:stroke .4s}
.ring.over .rf{stroke:#E0A458}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.ring .rt b{font-size:2rem}
.ring .rt small{color:var(--mut);font-size:.78rem}
.qtext{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;font-size:clamp(1.25rem,2.6vw,1.9rem);font-weight:700;line-height:1.75;box-shadow:0 6px 24px rgba(40,70,100,.05)}
.blank{display:inline-block;min-width:120px;border-bottom:3px solid var(--acs);color:transparent;margin:0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;font-size:clamp(1.05rem,2vw,1.35rem);transition:background .25s,border-color .25s,transform .15s,opacity .25s}
.opt:hover:not(:disabled){border-color:var(--acs);transform:translateY(-1px)}
.opt .k{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.opt.right{background:var(--okt);border-color:#9ED3B8}
.opt.right .k{background:#CDEBDC;color:var(--ok)}
.opt.wrong{background:var(--not);border-color:#EBB9B3}
.opt.wrong .k{background:#F4D3CF;color:var(--no)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.fb{margin-top:14px;text-align:center;font-size:1.2rem;min-height:1.8em;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.fb.show{opacity:1;transform:none}
.fb.ok b{color:var(--ok)}
.fb.no b{color:var(--no)}
.plus{display:inline-block;background:var(--okt);color:var(--ok);font-weight:700;border-radius:999px;padding:0 12px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.chart{position:relative;height:min(54vh,430px);margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.col{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;transition:right .8s cubic-bezier(.2,.8,.2,1)}
.col .val{font-weight:700;font-size:1.3rem;margin-top:10px}
.col .tag{font-size:.78rem;background:var(--okt);color:var(--ok);border-radius:999px;padding:1px 10px;opacity:0;transform:translateY(6px);transition:opacity .4s .7s,transform .4s .7s;white-space:nowrap}
.col.win .tag{opacity:1;transform:none}
.col .bw{flex:1;width:100%;position:relative;margin:6px 0 0}
.col .bar{position:absolute;bottom:0;left:14%;right:14%;height:2%;border-radius:14px 14px 6px 6px;transition:height 1s cubic-bezier(.2,.8,.2,1),box-shadow .4s}

function final(){show('final');var r=order(),pod=$('#podium');pod.innerHTML='';var seq=r.length>=3?[1,0,2]:[1,0];seq.forEach(function(k){var gi=r[k];if(gi===undefined)return;var g=S.groups[gi],d=document.createElement('div');d.className='pl r'+(k+1);d.innerHTML='<div class="medal">'+(k+1)+'</div><div class="pn">'+esc(g.n)+'</div><div class="ps">'+g.s+' نقطة</div><div class="stp" style="background:'+g.c+'"></div>';pod.appendChild(d)});var rest=$('#rest');rest.innerHTML='';r.slice(3).forEach(function(gi,k){var s=document.createElement('span');s.textContent=(k+4)+'. '+S.groups[gi].n+' — '+S.groups[gi].s+' نقطة';rest.appendChild(s)});SND.win();confetti()}
function confetti(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;var cv=$('#conf'),cx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,P=[];for(var i=0;i<90;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.6,r:4+Math.random()*5,c:GC[i%GC.length],vy:.6+Math.random()*1.2,vx:-.4+Math.random()*.8,a:Math.random()*6,va:-.03+Math.random()*.06});var t0=performance.now();(function f(now){var el=(now-t0)/1000,al=el<4.5?1:Math.max(0,1-(el-4.5)/1.5);cx.clearRect(0,0,W,H);cx.globalAlpha=al;P.forEach(function(p){p.y+=p.vy;p.x+=p.vx+Math.sin(p.a)*.3;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});if(al>0)requestAnimationFrame(f);else cx.clearRect(0,0,W,H)})(t0)}
$('#start').onclick=startGame;$('#show').onclick=ask;$('#toBoard').onclick=board;$('#next').onclick=next;
$('#again').onclick=function(){startGame()};$('#newg').onclick=function(){show('setup')};
$('#home').onclick=function(){if(confirm('إنهاء المسابقة والعودة إلى الإعدادات؟')){S.done=true;cancelAnimationFrame(S.raf);show('setup')}};
$('#mute').onclick=function(){S.muted=!S.muted;this.textContent=S.muted?'الصوت: مكتوم':'الصوت: يعمل'};
if(!document.documentElement.requestFullscreen){$('#fs').hidden=true}else{$('#fs').onclick=function(){if(!document.fullscreenElement){document.documentElement.requestFullscreen()}else{document.exitFullscreen()}}}
document.addEventListener('keydown',function(e){if($('#quiz').classList.contains('on')&&!S.done){var k=parseInt(e.key,10);if(k>=1&&k<=$('#opts').children.length)answer(k-1)}});
initSetup();
