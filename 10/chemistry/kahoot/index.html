function saveNames(){var ins=document.querySelectorAll('#gnames input');for(var i=0;i<ins.length;i++){S.names[i]=ins[i].value.trim()||('المجموعة '+ORD[i])}}
function drawGroups(){var c=$('#gcount');c.innerHTML='';for(var n=2;n<=6;n++){(function(n){var b=document.createElement('button');b.type='button';b.className='chip num'+(n===S.ng?' on':'');b.textContent=n;b.onclick=function(){saveNames();S.ng=n;drawGroups()};c.appendChild(b)})(n)}var w=$('#gnames');w.innerHTML='';for(var i=0;i<S.ng;i++){var l=document.createElement('label');l.className='nm';l.innerHTML='<span class="dot" style="background:'+GC[i]+'"></span><input maxlength="22" aria-label="اسم المجموعة '+(i+1)+'" value="'+esc(S.names[i]||('المجموعة '+ORD[i]))+'">';w.appendChild(l)}}
function drawCount(){var r=$('#qc'),c=$('#qquick');r.value=S.count;r.oninput=function(){S.count=+r.value;mark()};c.innerHTML='';[5,10,15,20].forEach(function(n){var b=document.createElement('button');b.type='button';b.className='chip num';b.textContent=n;b.dataset.n=n;b.onclick=function(){S.count=n;r.value=n;mark()};c.appendChild(b)});function mark(){$('#qcv').textContent=S.count;Array.prototype.forEach.call(c.children,function(b){b.classList.toggle('on',+b.dataset.n===S.count)})}mark()}
function build(){var L=DATA.lessons[S.li],own=shuf(L.q.filter(function(q){return q.p===S.p})),rest=shuf(L.q.filter(function(q){return q.p!==S.p})),pick=own.slice(0,S.count);if(pick.length<S.count)pick=pick.concat(rest.slice(0,S.count-pick.length));pick=pick.map(function(q){var opts=q.o.map(function(t,i){return {t:t,ok:i===q.a}});return {q:q.q,t:q.t,d:q.d,own:q.p===S.p?0:1,opts:q.t==='tf'?opts:shuf(opts)}});pick.sort(function(a,b){return a.d-b.d||a.own-b.own});S.qs=pick}
function startGame(){actx();saveNames();S.groups=[];for(var i=0;i<S.ng;i++)S.groups.push({n:S.names[i],c:GC[i],s:0,prev:0});build();S.qi=0;S.turn=0;makeChart();pre()}
function pre(){var q=S.qs[S.qi];$('#preNum').textContent='السؤال '+(S.qi+1)+' من '+S.qs.length;$('#preLvl').innerHTML=lvl(q.d);var c=$('#preG');c.innerHTML='';S.groups.forEach(function(g,i){var b=document.createElement('button');b.type='button';b.className='chip'+(i===S.turn?' on':'');b.innerHTML='<span class="dot" style="background:'+g.c+'"></span>'+esc(g.n);b.onclick=function(){S.turn=i;pre()};c.appendChild(b)});show('pre')}
function ptsAt(t){if(t<=30)return Math.round((1000-500*t/30)/10)*10;return Math.max(100,Math.round((500-400*(t-30)/30)/10)*10)}
function ask(){var q=S.qs[S.qi],g=S.groups[S.turn];S.done=false;$('#progI').style.width=(S.qi/S.qs.length*100)+'%';$('#whoDot').style.background=g.c;$('#whoName').textContent=g.n;$('#qType').textContent=TYPES[q.t];$('#qLvl').innerHTML=lvl(q.d);var qt=esc(q.q);if(q.t==='fill')qt=qt.replace(/_{3,}|\.{4,}|…+/g,'<span class="blank">—</span>');$('#qText').innerHTML=qt;var o=$('#opts');o.className='opts '+q.t;o.innerHTML='';q.opts.forEach(function(op,i){var b=document.createElement('button');b.type='button';b.className='opt';var k=q.t==='tf'?(op.t==='صحيح'?'✓':'✗'):'أبجدهو'.charAt(i);b.innerHTML='<span class="k">'+k+'</span><span>'+esc(op.t)+'</span>';b.onclick=function(){answer(i)};o.appendChild(b)});var fb=$('#fb');fb.className='fb';fb.innerHTML='';$('#toBoard').hidden=true;var rf=$('#rf');rf.style.strokeDasharray=CIRC;rf.style.strokeDashoffset=0;$('#ring').classList.remove('over');show('quiz');S.t0=performance.now();S.ticked=false;cancelAnimationFrame(S.raf);loop()}
function loop(){if(S.done)return;var t=(performance.now()-S.t0)/1000,left=Math.max(0,30-t);$('#rf').style.strokeDashoffset=CIRC*(1-left/30);$('#sec').textContent=t<=30?Math.ceil(left):'+'+Math.floor(t-30);$('#pts').textContent=ptsAt(t)+' نقطة';var over=t>30;$('#ring').classList.toggle('over',over);if(over&&!S.ticked){S.ticked=true;SND.over()}S.raf=requestAnimationFrame(loop)}
function answer(i){if(S.done)return;S.done=true;cancelAnimationFrame(S.raf);var t=(performance.now()-S.t0)/1000,q=S.qs[S.qi],g=S.groups[S.turn],ok=q.opts[i].ok,pts=ok?ptsAt(t):0;g.s+=pts;S.lastPts=pts;S.lastWin=ok?S.turn:-1;Array.prototype.forEach.call($('#opts').children,function(b,k){b.disabled=true;if(q.opts[k].ok)b.classList.add('right');else if(k===i)b.classList.add('wrong');else b.classList.add('dim')});var fb=$('#fb');if(ok){fb.innerHTML='<b>إجابة صحيحة</b> <span class="plus">+'+pts+'</span> '+esc(g.n)+' <small>('+t.toFixed(1)+' ث)</small>';fb.className='fb ok show';SND.ok()}else{var c=q.opts.filter(function(x){return x.ok})[0].t;fb.innerHTML='<b>إجابة غير صحيحة</b> — الإجابة الصحيحة: '+esc(c);fb.className='fb no show';SND.no()}$('#toBoard').hidden=false;$('#progI').style.width=((S.qi+1)/S.qs.length*100)+'%'}
function makeChart(){var ch=$('#chart');ch.innerHTML='';S.cols=S.groups.map(function(g){var c=document.createElement('div');c.className='col';c.innerHTML='<div class="val">0</div><div class="tag">فازت بالسؤال</div><div class="bw"><div class="bar" style="background:'+g.c+'"><span class="rk"></span></div></div><div class="nm2">'+esc(g.n)+'</div>';ch.appendChild(c);return c});layout(false)}
function order(){return S.groups.map(function(g,i){return i}).sort(function(a,b){return S.groups[b].s-S.groups[a].s||a-b})}
function layout(anim){var n=S.groups.length,w=100/n,max=Math.max.apply(null,S.groups.map(function(g){return g.s}).concat([1]));order().forEach(function(gi,r){var c=S.cols[gi],g=S.groups[gi];c.style.width='calc('+w+'% - 4px)';c.style.right='calc('+(r*w)+'% + 2px)';c.querySelector('.bar').style.height=(g.s>0?Math.max(6,g.s/max*92):2)+'%';c.querySelector('.rk').textContent=r+1;c.classList.toggle('win',!!anim&&gi===S.lastWin)})}
function countUp(el,a,b){var t0=performance.now(),d=1000;function f(){var k=Math.min(1,(performance.now()-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(a+(b-a)*e);if(k<1)requestAnimationFrame(f)}f()}
function board(){show('board');$('#bTitle').textContent=S.lastWin>=0?('فوز بالسؤال: '+S.groups[S.lastWin].n+' (+'+S.lastPts+')'):'ترتيب المجموعات بعد السؤال '+(S.qi+1);$('#next').textContent=S.qi+1<S.qs.length?'السؤال التالي':'إعلان النتيجة النهائية';requestAnimationFrame(function(){requestAnimationFrame(function(){layout(true);S.groups.forEach(function(g,i){countUp(S.cols[i].querySelector('.val'),g.prev,g.s);g.prev=g.s})})});SND.board()}
function next(){S.qi++;if(S.qi>=S.qs.length){final();return}S.turn=(S.turn+1)%S.groups.length;pre()}
function final(){show('final');var r=order(),pod=$('#podium');pod.innerHTML='';var seq=r.length>=3?[1,0,2]:[1,0];seq.forEach(function(k){var gi=r[k];if(gi===undefined)return;var g=S.groups[gi],d=document.createElement('div');d.className='pl r'+(k+1);d.innerHTML='<div class="medal">'+(k+1)+'</div><div class="pn">'+esc(g.n)+'</div><div class="ps">'+g.s+' نقطة</div><div class="stp" style="background:'+g.c+'"></div>';pod.appendChild(d)});var rest=$('#rest');rest.innerHTML='';r.slice(3).forEach(function(gi,k){var s=document.createElement('span');s.textContent=(k+4)+'. '+S.groups[gi].n+' — '+S.groups[gi].s+' نقطة';rest.appendChild(s)});SND.win();confetti()}
function confetti(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;var cv=$('#conf'),cx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,P=[];for(var i=0;i<90;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.6,r:4+Math.random()*5,c:GC[i%GC.length],vy:.6+Math.random()*1.2,vx:-.4+Math.random()*.8,a:Math.random()*6,va:-.03+Math.random()*.06});var t0=performance.now();(function f(now){var el=(now-t0)/1000,al=el<4.5?1:Math.max(0,1-(el-4.5)/1.5);cx.clearRect(0,0,W,H);cx.globalAlpha=al;P.forEach(function(p){p.y+=p.vy;p.x+=p.vx+Math.sin(p.a)*.3;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});if(al>0)requestAnimationFrame(f);else cx.clearRect(0,0,W,H)})(t0)}
$('#start').onclick=startGame;$('#show').onclick=ask;$('#toBoard').onclick=board;$('#next').onclick=next;
$('#again').onclick=function(){startGame()};$('#newg').onclick=function(){show('setup')};
$('#home').onclick=function(){if(confirm('إنهاء المسابقة والعودة إلى الإعدادات؟')){S.done=true;cancelAnimationFrame(S.raf);show('setup')}};
$('#mute').onclick=function(){S.muted=!S.muted;this.textContent=S.muted?'الصوت: مكتوم':'الصوت: يعمل'};
if(!document.documentElement.requestFullscreen){$('#fs').hidden=true}else{$('#fs').onclick=function(){if(!document.fullscreenElement){document.documentElement.requestFullscreen()}else{document.exitFullscreen()}}}
document.addEventListener('keydown',function(e){if($('#quiz').classList.contains('on')&&!S.done){var k=parseInt(e.key,10);if(k>=1&&k<=$('#opts').children.length)answer(k-1)}});
initSetup();
})();
</script></body></html>
