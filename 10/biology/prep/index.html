ass=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><span>التعلم الذاتي<\/span><\/div><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\n• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\n• التعلم بالنمذجة\n• التعلم التشاركي\n• التعلم الذاتي\n\nالحصة 3: المشيمة والحبل السري\n• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><\/div><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>صورة توضيحية<\/span><\/div><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>صورة توضيحية<\/span><\/div>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\n• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\n• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• صورة توضيحية\n\nالحصة 3: المشيمة والحبل السري\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• صورة توضيحية"},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><div class=\"pills\"><span>الإخصاب<\/span><span>الحيوان المنوي<\/span><span>البويضة<\/span><span>السوط<\/span><span>الإنزيمات<\/span><span>الغلاف الهلامي<\/span><\/div><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><div class=\"pills\"><span>الزيجوت<\/span><span>الانقسام<\/span><span>كرة الخلايا<\/span><span>الانغراس<\/span><span>الكيس الأمنيوني<\/span><span>السائل الأمنيوني<\/span><\/div><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><div class=\"pills\"><span>المشيمة<\/span><span>الحبل السري<\/span><span>تبادل المواد<\/span><span>نواتج الإخراج<\/span><span>حاجز السموم<\/span><\/div>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\nالإخصاب، الحيوان المنوي، البويضة، السوط، الإنزيمات، الغلاف الهلامي\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\nالزيجوت، الانقسام، كرة الخلايا، الانغراس، الكيس الأمنيوني، السائل الأمنيوني\n\nالحصة 3: المشيمة والحبل السري\nالمشيمة، الحبل السري، تبادل المواد، نواتج الإخراج، حاجز السموم"},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><p>يعرض صورة مجهرية لبويضة يحيط بها عدد من الحيوانات المنوية ويسأل: لماذا يُخصب البويضة حيوان منوي واحد فقط؟<\/p><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><p>سؤال: كيف يتحول الزيجوت، وهو خلية واحدة، إلى جنين؟<\/p><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><p>سؤال: كيف يحصل الجنين على الأكسجين والغذاء وهو لا يتنفس ولا يأكل؟<\/p>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\nيعرض صورة مجهرية لبويضة يحيط بها عدد من الحيوانات المنوية ويسأل: لماذا يُخصب البويضة حيوان منوي واحد فقط؟\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\nسؤال: كيف يتحول الزيجوت، وهو خلية واحدة، إلى جنين؟\n\nالحصة 3: المشيمة والحبل السري\nسؤال: كيف يحصل الجنين على الأكسجين والغذاء وهو لا يتنفس ولا يأكل؟"},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الإخصاب (كتاب الطالب ص 71)<\/td><td>يعرض مقطعًا تعليميًا مبسطًا لاندماج النواتين.<\/td><td>يكتبون تعريف الإخصاب.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">تكيفات الأمشاج<\/td><td>يعرض مخططي الحيوان المنوي والبويضة.<\/td><td>يكملون جدولًا: التكيف ووظيفته لكل مشيج.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 5-4 و6-4<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">من الزيجوت إلى الانغراس (كتاب الطالب ص 71–72)<\/td><td>يعرض مقطعًا مبسطًا لانقسام الزيجوت وتحركه في قناة البيض حتى انغراسه في جدار الرحم.<\/td><td>يرتبون بطاقات المراحل.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الكيس والسائل الأمنيوني<\/td><td>يوضح على السبورة الذكية حماية السائل الأمنيوني للجنين من الصدمات.<\/td><td>يشبهون السائل بوسادة مائية ويكتبون وظيفته.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الأسئلة 8-4 إلى 9-4<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">المشيمة والحبل السري (كتاب الطالب ص 72–73)<\/td><td>يعرض على السبورة الذكية مخطط المشيمة ويحدد اتجاه انتقال المواد.<\/td><td>يرسمون أسهمًا لانتقال الأكسجين والغذاء إلى الجنين، وثاني أكسيد الكربون واليوريا إلى الأم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 2-4 تبادل الغازات في المشيمة والرئتين (كتاب النشاط ص 39–40)<\/td><td>يتابع.<\/td><td>يحلون ويقارنون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والأسئلة 10-4 و11-4<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) الإخصاب (كتاب الطالب ص 71)\nدور المعلم: يعرض مقطعًا تعليميًا مبسطًا لاندماج النواتين.\nدور الطالب: يكتبون تعريف الإخصاب.\n\n(13 دقيقة) تكيفات الأمشاج\nدور المعلم: يعرض مخططي الحيوان المنوي والبويضة.\nدور الطالب: يكملون جدولًا: التكيف ووظيفته لكل مشيج.\n\n(5 دقائق) السؤالان 5-4 و6-4\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) من الزيجوت إلى الانغراس (كتاب الطالب ص 71–72)\nدور المعلم: يعرض مقطعًا مبسطًا لانقسام الزيجوت وتحركه في قناة البيض حتى انغراسه في جدار الرحم.\nدور الطالب: يرتبون بطاقات المراحل.\n\n(12 دقيقة) الكيس والسائل الأمنيوني\nدور المعلم: يوضح على السبورة الذكية حماية السائل الأمنيوني للجنين من الصدمات.\nدور الطالب: يشبهون السائل بوسادة مائية ويكتبون وظيفته.\n\n(5 دقائق) الأسئلة 8-4 إلى 9-4\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: المشيمة والحبل السري\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المشيمة والحبل السري (كتاب الطالب ص 72–73)\nدور المعلم: يعرض على السبورة الذكية مخطط المشيمة ويحدد اتجاه انتقال المواد.\nدور الطالب: يرسمون أسهمًا لانتقال الأكسجين والغذاء إلى الجنين، وثاني أكسيد الكربون واليوريا إلى الأم.\n\n(10 دقائق) تمرين 2-4 تبادل الغازات في المشيمة والرئتين (كتاب النشاط ص 39–40)\nدور المعلم: يتابع.\nدور الطالب: يحلون ويقارنون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والأسئلة 10-4 و11-4\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف الإخصاب.<\/td><td>اندماج نواة المشيج الذكري مع نواة المشيج الأنثوي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما فائدة السوط في الحيوان المنوي؟<\/td><td>تمكينه من السباحة نحو البويضة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما فائدة تغير الغلاف الهلامي للبويضة بعد الإخصاب؟<\/td><td>منع دخول أكثر من حيوان منوي واحد.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أين ينغرس الجنين؟<\/td><td>في جدار الرحم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة السائل الأمنيوني؟<\/td><td>حماية الجنين من الصدمات الميكانيكية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رتب: الانغراس، الإخصاب، انقسام الزيجوت.<\/td><td>الإخصاب ← انقسام الزيجوت ← الانغراس.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المواد التي تنتقل من الأم إلى الجنين عبر المشيمة؟<\/td><td>الأكسجين والمواد الغذائية الذائبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المواد التي تنتقل من الجنين إلى الأم؟<\/td><td>ثاني أكسيد الكربون ونواتج الإخراج مثل اليوريا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُنصح الحامل بتجنب التدخين والأدوية غير الموصوفة رغم أن المشيمة حاجز؟<\/td><td>لأن المشيمة لا تمنع كل المواد؛ فبعض المواد كالنيكوتين وبعض الأدوية تعبرها وتضر الجنين.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\n1) [مستوى الدعم] عرّف الإخصاب.\nالإجابة النموذجية: اندماج نواة المشيج الذكري مع نواة المشيج الأنثوي.\n\n2) [المستوى المتوقع] ما فائدة السوط في الحيوان المنوي؟\nالإجابة النموذجية: تمكينه من السباحة نحو البويضة.\n\n3) [المستوى المتقدم] ما فائدة تغير الغلاف الهلامي للبويضة بعد الإخصاب؟\nالإجابة النموذجية: منع دخول أكثر من حيوان منوي واحد.\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\n1) [مستوى الدعم] أين ينغرس الجنين؟\nالإجابة النموذجية: في جدار الرحم.\n\n2) [المستوى المتوقع] ما وظيفة السائل الأمنيوني؟\nالإجابة النموذجية: حماية الجنين من الصدمات الميكانيكية.\n\n3) [المستوى المتقدم] رتب: الانغراس، الإخصاب، انقسام الزيجوت.\nالإجابة النموذجية: الإخصاب ← انقسام الزيجوت ← الانغراس.\n\nالحصة 3: المشيمة والحبل السري\n1) [مستوى الدعم] ما المواد التي تنتقل من الأم إلى الجنين عبر المشيمة؟\nالإجابة النموذجية: الأكسجين والمواد الغذائية الذائبة.\n\n2) [المستوى المتوقع] ما المواد التي تنتقل من الجنين إلى الأم؟\nالإجابة النموذجية: ثاني أكسيد الكربون ونواتج الإخراج مثل اليوريا.\n\n3) [المستوى المتقدم] لماذا يُنصح الحامل بتجنب التدخين والأدوية غير الموصوفة رغم أن المشيمة حاجز؟\nالإجابة النموذجية: لأن المشيمة لا تمنع كل المواد؛ فبعض المواد كالنيكوتين وبعض الأدوية تعبرها وتضر الجنين."},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحتوي البويضة على ......... تزود الجنين بالطاقة في مراحله الأولى.<\/td><td>مخازن الطاقة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الإنزيمات في رأس الحيوان المنوي؟<\/td><td>هضم غلاف البويضة ليتمكن من الدخول إليها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُنتج أعداد هائلة من الحيوانات المنوية مقابل بويضة واحدة؟<\/td><td>لأن معظمها لا يصل إلى البويضة، فالعدد الكبير يزيد فرصة حدوث الإخصاب.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يحيط بالجنين كيس يسمى الكيس .........<\/td><td>الأمنيوني.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: ينغرس الجنين في قناة البيض.<\/td><td>خطأ؛ ينغرس في جدار الرحم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد السائل الأمنيوني مهمًا عندما تتحرك الأم أو تتعرض لاصطدام خفيف؟<\/td><td>لأنه يمتص الصدمات ويقلل أثرها على الجنين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يربط ......... الجنين بالمشيمة.<\/td><td>الحبل السري.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يختلط دم الأم بدم الجنين مباشرة في المشيمة.<\/td><td>خطأ؛ تتبادل المواد عبر أغشية دون اختلاط الدم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قارن بين المشيمة والرئتين من حيث تبادل الغازات.<\/td><td>كلاهما سطح تبادل رقيق كبير المساحة غني بالدم؛ لكن الجنين يأخذ الأكسجين من دم الأم في المشيمة، بينما تأخذه الرئتان من الهواء.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\n1) [مستوى الدعم] أكمل: تحتوي البويضة على ......... تزود الجنين بالطاقة في مراحله الأولى.\nالإجابة النموذجية: مخازن الطاقة.\n\n2) [المستوى المتوقع] ما وظيفة الإنزيمات في رأس الحيوان المنوي؟\nالإجابة النموذجية: هضم غلاف البويضة ليتمكن من الدخول إليها.\n\n3) [المستوى المتقدم] لماذا تُنتج أعداد هائلة من الحيوانات المنوية مقابل بويضة واحدة؟\nالإجابة النموذجية: لأن معظمها لا يصل إلى البويضة، فالعدد الكبير يزيد فرصة حدوث الإخصاب.\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\n1) [مستوى الدعم] أكمل: يحيط بالجنين كيس يسمى الكيس .........\nالإجابة النموذجية: الأمنيوني.\n\n2) [المستوى المتوقع] صواب أم خطأ: ينغرس الجنين في قناة البيض.\nالإجابة النموذجية: خطأ؛ ينغرس في جدار الرحم.\n\n3) [المستوى المتقدم] لماذا يُعد السائل الأمنيوني مهمًا عندما تتحرك الأم أو تتعرض لاصطدام خفيف؟\nالإجابة النموذجية: لأنه يمتص الصدمات ويقلل أثرها على الجنين.\n\nالحصة 3: المشيمة والحبل السري\n1) [مستوى الدعم] أكمل: يربط ......... الجنين بالمشيمة.\nالإجابة النموذجية: الحبل السري.\n\n2) [المستوى المتوقع] صواب أم خطأ: يختلط دم الأم بدم الجنين مباشرة في المشيمة.\nالإجابة النموذجية: خطأ؛ تتبادل المواد عبر أغشية دون اختلاط الدم.\n\n3) [المستوى المتقدم] قارن بين المشيمة والرئتين من حيث تبادل الغازات.\nالإجابة النموذجية: كلاهما سطح تبادل رقيق كبير المساحة غني بالدم؛ لكن الجنين يأخذ الأكسجين من دم الأم في المشيمة، بينما تأخذه الرئتان من الهواء."},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><p>مراجعة كتاب الطالب ص 71 والإجابة عن السؤالين 5-4 و6-4.<\/p><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><p>مراجعة كتاب الطالب ص 71–72 والإجابة عن السؤالين 8-4 و9-4.<\/p><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><p>إكمال تمرين 2-4 في كتاب النشاط ص 39–40، والإجابة عن السؤالين 10-4 و11-4 والسؤالين 3 و6 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\nمراجعة كتاب الطالب ص 71 والإجابة عن السؤالين 5-4 و6-4.\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\nمراجعة كتاب الطالب ص 71–72 والإجابة عن السؤالين 8-4 و9-4.\n\nالحصة 3: المشيمة والحبل السري\nإكمال تمرين 2-4 في كتاب النشاط ص 39–40، والإجابة عن السؤالين 10-4 و11-4 والسؤالين 3 و6 من أسئلة نهاية الوحدة."}]}},{"label":"3-4 دورة الطمث (دورة الحيض)","unit":"الوحدة الرابعة: التكاثر في الإنسان","periods":[{"n":1,"focus":"التغيرات في الم إباضة، المبيض، مدة الدورة"},{"h":"<p>يمهد المعلم بأن دورة الطمث عملية طبيعية تهيئ الجسم للحمل، ويعرض مخططًا زمنيًا دائريًا فارغًا لمدة 28 يومًا.<\/p>","t":"يمهد المعلم بأن دورة الطمث عملية طبيعية تهيئ الجسم للحمل، ويعرض مخططًا زمنيًا دائريًا فارغًا لمدة 28 يومًا."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يمهد بلغة علمية هادئة ويعرض المخطط على السبورة الذكية.<\/td><td>يستمعون ويطرحون الأسئلة بأدب.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">التغيرات في المبيض (كتاب الطالب ص 74)<\/td><td>يشرح نضج البويضة في المبيض وإطلاقها (الإباضة) نحو اليوم 14.<\/td><td>يحددون الإباضة على المخطط الدائري.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المخطط الزمني<\/td><td>يوجه إلى تقسيم المخطط إلى مراحل.<\/td><td>يكملون المخطط ويضعون الأيام التقريبية.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مراجعة سريعة<\/td><td>يطرح أسئلة شفهية.<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يمهد بلغة علمية هادئة ويعرض المخطط على السبورة الذكية.\nدور الطالب: يستمعون ويطرحون الأسئلة بأدب.\n\n(15 دقيقة) التغيرات في المبيض (كتاب الطالب ص 74)\nدور المعلم: يشرح نضج البويضة في المبيض وإطلاقها (الإباضة) نحو اليوم 14.\nدور الطالب: يحددون الإباضة على المخطط الدائري.\n\n(10 دقائق) المخطط الزمني\nدور المعلم: يوجه إلى تقسيم المخطط إلى مراحل.\nدور الطالب: يكملون المخطط ويضعون الأيام التقريبية.\n\n(5 دقائق) مراجعة سريعة\nدور المعلم: يطرح أسئلة شفهية.\nدور الطالب: يجيبون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المدة التقريبي ؟<\/p>","t":"سؤال: لماذا تزداد سماكة بطانة الرحم قبل الإباضة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">التغيرات في الرحم (كتاب الطالب ص 74)<\/td><td>يشرح على السبورة الذكية: الأيام 1–5 تنفصل البطانة (الطمث)، ثم تزداد سماكتها، وتبقى بعد الإباضة استعدادًا للانغراس، وتنفصل إذا لم يحدث إخصاب.<\/td><td>يرسمون منحنى سماكة البطانة عبر الأيام.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الربط بين المبيض والرحم<\/td><td>يوجه إلى دمج المخططين.<\/td><td>يكملون مخططًا يجمع أحداث المبيض والرحم.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) التغيرات في الرحم (كتاب الطالب ص 74)\nدور المعلم: يشرح على السبورة الذكية: الأيام 1–5 تنفصل البطانة (الطمث)، ثم تزداد سماكتها، وتبقى بعد الإباضة استعدادًا للانغراس، وتنفصل إذا لم يحدث إخصاب.\nدور الطالب: يرسمون منحنى سماكة البطانة عبر الأيام.\n\n(12 دقيقة) الربط بين المبيض والرحم\nدور المعلم: يوجه إلى دمج المخططين.\nدور الطالب: يكملون مخططًا يجمع أحداث المبيض والرحم.\n\n(6 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لبطانة الرحم في الأيام الأولى من الدورة؟<\/td><td>تنفصل وتخرج من الجسم (الطمث).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تزداد سماكة بطانة الرحم؟<\/td><td>لتهيئة الرحم لاستقبال الجنين وانغراسه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث للبطانة إذا لم يحدث إخصاب؟ وإذا حدث؟<\/td><td>إذا لم يحدث تنفصل وتبدأ دورة جديدة، وإذا حدث وانغرس الجنين تبقى ولا يحدث الطمث.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث لبطانة الرحم في الأيام الأولى من الدورة؟\nالإجابة النموذجية: تنفصل وتخرج من الجسم (الطمث).\n\n2) [المستوى المتوقع] لماذا تزداد سماكة بطانة الرحم؟\nالإجابة النموذجية: لتهيئة الرحم لاستقبال الجنين وانغراسه.\n\n3) [المستوى المتقدم] ماذا يحدث للبطانة إذا لم يحدث إخصاب؟ وإذا حدث؟\nالإجابة النموذجية: إذا لم يحدث تنفصل وتبدأ دورة جديدة، وإذا حدث وانغرس الجنين تبقى ولا يحدث الطمث."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: انفصال بطانة الرحم وخروجها يسمى .........<\/td><td>الطمث (الحيض).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تبقى بطانة الرحم سميكة إذا حدث الحمل.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتوقف الطمث أثناء الحمل؟<\/td><td>لأن بطانة الرحم تبقى لتغذية الجنين المنغرس وحمايته فلا تنفصل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: انفصال بطانة الرحم وخروجها يسمى .........\nالإجابة النموذجية: الطمث (الحيض).\n\n2) [المستوى المتوقع] صواب أم خطأ: تبقى بطانة الرحم سميكة إذا حدث الحمل.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] لماذا يتوقف الطمث أثناء الحمل؟\nالإجابة النموذجية: لأن بطانة الرحم تبقى لتغذية الجنين المنغرس وحمايته فلا تنفصل."},{"h":"<p>مراجعة كتاب الطالب ص 74، وإكمال مخطط الدورة الذي يجمع أحداث المبيض والرحم.<\/p>","t":"مراجعة كتاب الطالب ص 74، وإكمال مخطط الدورة الذي يجمع أحداث المبيض والرحم."}]},{"n":3,"focus":"تحليل مخططات دورة الطمث","info":"<div><b>الدرس:<\/b> 3-4 دورة الطمث (دورة الحيض)<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>رقم الحصة:< ئمًا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المخطط على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">تحليل مخططات<\/td><td>يعرض مخططات مختلفة للدورة.<\/td><td>يحددون أيام الطمث والإباضة وسماكة البطانة في كل مخطط.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">السؤالان 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة (كتاب الطالب)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تصحيح جماعي<\/td><td>يناقش الإجابات.<\/td><td>يصححون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المخطط على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) تحليل مخططات\nدور المعلم: يعرض مخططات مختلفة للدورة.\nدور الطالب: يحددون أيام الطمث والإباضة وسماكة البطانة في كل مخطط.\n\n(10 دقائق) السؤالان 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة (كتاب الطالب)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) تصحيح جماعي\nدور المعلم: يناقش الإجابات.\nدور الطالب: يصححون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>في مخطط الدورة، متى تكون بطانة الرحم في أرق حالاتها؟<\/td><td>في نهاية الطمث تقريبًا (الأيام الأولى).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الحدث الذي يقع في المبيض في منتصف الدورة؟<\/td><td>الإباضة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>دورة مدتها 32 يومًا. متى تتوقع الإباضة تقريبًا إذا كانت تحدث قبل نهاية الدورة بنحو 14 يومًا؟<\/td><td>نحو اليوم 18.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] في مخطط الدورة، متى تكون بطانة الرحم في أرق حالاتها؟\nالإجابة النموذجية: في نهاية الطمث تقريبًا (الأيام الأولى).\n\n2) [المستوى المتوقع] ما الحدث الذي يقع في المبيض في منتصف الدورة؟\nالإجابة النموذجية: الإباضة.\n\n3) [المستوى المتقدم] دورة مدتها 32 يومًا. متى تتوقع الإباضة تقريبًا إذا كانت تحدث قبل نهاية الدورة بنحو 14 يومًا؟\nالإجابة النموذجية: نحو اليوم 18."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تتكرر دورة الطمث بانتظام تقريبًا.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يبدأ دورة جديدة؟<\/td><td>بدء الطمث بانفصال بطانة الرحم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد فهم دورة الطمث مهمًا صحيًا؟<\/td><td>لمعرفة ما هو طبيعي وملاحظة أي تغير غير معتاد يستدعي استشارة طبية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تتكرر دورة الطمث بانتظام تقريبًا.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الذي يبدأ دورة جديدة؟\nالإجابة النموذجية: بدء الطمث بانفصال بطانة الرحم.\n\n3) [المستوى المتقدم] لماذا يُعد فهم دورة الطمث مهمًا صحيًا؟\nالإجابة النموذجية: لمعرفة ما هو طبيعي وملاحظة أي تغير غير معتاد يستدعي استشارة طبية."},{"h":"<p>الإجابة عن السؤالين 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة الرابعة في كتاب الطالب.<\/p>","t":"الإجابة عن السؤالين 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة الرابعة في كتاب الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-4 دورة الطمث (دورة الحيض)<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 74 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 66<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: التغيرات في المبيض خلال دورة الطمث<\/div><ol class=\"ol\"><li>يصف دورة الطمث من حيث التغيرات التي تحدث في المبيض.<\/li><li>يحدد موعد الإباضة التقريبي في دورة مدتها 28 يومًا.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يمثل مراحل الدورة على مخطط زمني دائري.<\/div><div class=\"psub\">الحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث<\/div><ol class=\"ol\"><li>يصف التغيرات التي تحدث في الرحم خلال دورة الطمث.<\/li><li>يربط تغيرات بطانة الرحم بحدوث الإخصاب أو عدم حدوثه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يمثل سماكة بطانة الرحم بيانيًا عبر أيام الدورة.<\/div><div class=\"psub\">الحصة 3: تحليل مخططات دورة الطمث<\/div><ol class=\"ol\"><li>يحلل مخططات تمثل التغيرات في المبيض والرحم خلال الدورة.<\/li><li>يجيب عن أسئلة الكتاب المتعلقة بدورة الطمث.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج اليوم التقريبي للإباضة في دورة مختلفة المدة.<\/div>","t":"الحصة 1: التغيرات في المبيض خلال دورة الطمث\n1. يصف دورة الطمث من حيث التغيرات التي تحدث في المبيض.\n2. يحدد موعد الإباضة التقريبي في دورة مدتها 28 يومًا.\nمخرج تعليمي آخر: يمثل مراحل الدورة على مخطط زمني دائري.\n\nالحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث\n1. يصف التغيرات التي تحدث في الرحم خلال دورة الطمث.\n2. يربط تغيرات بطانة الرحم بحدوث الإخصاب أو عدم حدوثه.\nمخرج تعليمي آخر: يمثل سماكة بطانة الرحم بيانيًا عبر أيام الدورة.\n\nالحصة 3: تحليل مخططات دورة الطمث\n1. يحلل مخططات تمثل التغيرات في المبيض والرحم خلال الدورة.\n2. يجيب عن أسئلة الكتاب المتعلقة بدورة الطمث.\nمخرج تعليمي آخر: يستنتج اليوم التقريبي للإباضة في دورة مختلفة المدة."},{"h":"<div class=\"psub\">الحصة 1: التغيرات في المبيض خلال دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف دورة الطمث من حيث التغيرات التي تحدث في المبيض.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد موعد الإباضة التقريبي في دورة مدتها 28 يومًا.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يمثل مراحل الدورة على مخطط زمني دائري.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى< /td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">التغيرات في الرحم (كتاب الطالب ص 74)<\/td><td>يشرح على السبورة الذكية: الأيام 1–5 تنفصل البطانة (الطمث)، ثم تزداد سماكتها، وتبقى بعد الإباضة استعدادًا للانغراس، وتنفصل إذا لم يحدث إخصاب.<\/td><td>يرسمون منحنى سماكة البطانة عبر الأيام.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الربط بين المبيض والرحم<\/td><td>يوجه إلى دمج المخططين.<\/td><td>يكملون مخططًا يجمع أحداث المبيض والرحم.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحليل مخططات دورة الطمث<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المخطط على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">تحليل مخططات<\/td><td>يعرض مخططات مختلفة للدورة.<\/td><td>يحددون أيام الطمث والإباضة وسماكة البطانة في كل مخطط.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">السؤالان 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة (كتاب الطالب)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تصحيح جماعي<\/td><td>يناقش الإجابات.<\/td><td>يصححون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التغيرات في المبيض خلال دورة الطمث\n(5 دقائق) التهيئة\nدور المعلم: يمهد بلغة علمية هادئة ويعرض المخطط على السبورة الذكية.\nدور الطالب: يستمعون ويطرحون الأسئلة بأدب.\n\n(15 دقيقة) التغيرات في المبيض (كتاب الطالب ص 74)\nدور المعلم: يشرح نضج البويضة في المبيض وإطلاقها (الإباضة) نحو اليوم 14.\nدور الطالب: يحددون الإباضة على المخطط الدائري.\n\n(10 دقائق) المخطط الزمني\nدور المعلم: يوجه إلى تقسيم المخطط إلى مراحل.\nدور الطالب: يكملون المخطط ويضعون الأيام التقريبية.\n\n(5 دقائق) مراجعة سريعة\nدور المعلم: يطرح أسئلة شفهية.\nدور الطالب: يجيبون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) التغيرات في الرحم (كتاب الطالب ص 74)\nدور المعلم: يشرح على السبورة الذكية: الأيام 1–5 تنفصل البطانة (الطمث)، ثم تزداد سماكتها، وتبقى بعد الإباضة استعدادًا للانغراس، وتنفصل إذا لم يحدث إخصاب.\nدور الطالب: يرسمون منحنى سماكة البطانة عبر الأيام.\n\n(12 دقيقة) الربط بين المبيض والرحم\nدور المعلم: يوجه إلى دمج المخططين.\nدور الطالب: يكملون مخططًا يجمع أحداث المبيض والرحم.\n\n(6 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون.\n\nالحصة 3: تحليل مخططات دورة الطمث\n(5 دقائق) التهيئة\nدور المعلم: يعرض المخطط على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) تحليل مخططات\nدور المعلم: يعرض مخططات مختلفة للدورة.\nدور الطالب: يحددون أيام الطمث والإباضة وسماكة البطانة في كل مخطط.\n\n(10 دقائق) السؤالان 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة (كتاب الطالب)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) تصحيح جماعي\nدور المعلم: يناقش الإجابات.\nدور الطالب: يصححون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: التغيرات في المبيض خلال دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المدة التقريبية لدورة الطمث؟<\/td><td>نحو 28 يومًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المقصود بالإباضة؟<\/td><td>إطلاق بويضة ناضجة من المبيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في أي يوم تقريبًا تحدث الإباضة في دورة مدتها 28 يومًا؟<\/td><td>نحو اليوم 14.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لبطانة الرحم في الأيام الأولى من الدورة؟<\/td><td>تنفصل وتخرج من الجسم (الطمث).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تزداد سماكة بطانة الرحم؟<\/td><td>لتهيئة الرحم لاستقبال الجنين وانغراسه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث للبطانة إذا لم يحدث إخصاب؟ وإذا حدث؟<\/td><td>إذا لم يحدث تنفصل وتبدأ دورة جديدة، وإذا حدث وانغرس الجنين تبقى ولا يحدث الطمث.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحليل مخططات دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>في مخطط الدورة، متى تكون بطانة الرحم في أرق حالاتها؟<\/td><td>في نهاية الطمث تقريبًا (الأيام الأولى).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الحدث الذي يقع في المبيض في منتصف الدورة؟<\/td><td>الإباضة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>دورة مدتها 32 يومًا. متى تتوقع الإباضة تقريبًا إذا كانت تحدث قبل نهاية الدورة بنحو 14 يومًا؟<\/td><td>نحو اليوم 18.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التغيرات في المبيض خلال دورة الطمث\n1) [مستوى الدعم] ما المدة التقريبية لدورة الطمث؟\nالإجابة النموذجية: نحو 28 يومًا.\n\n2) [المستوى المتوقع] ما المقصود بالإباضة؟\nالإجابة النموذجية: إطلاق بويضة ناضجة من المبيض.\n\n3) [المستوى المتقدم] في أي يوم تقريبًا تحدث الإباضة في دورة مدتها 28 يومًا؟\nالإجابة النموذجية: نحو اليوم 14.\n\nالحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث\n1) [مستوى الدعم] ماذا يحدث لبطانة الرحم في الأيام الأولى من الدورة؟\nالإجابة النموذجية: تنفصل وتخرج من الجسم (الطمث).\n\n2) [المستوى المتوقع] لماذا تزداد سماكة بطانة الرحم؟\nالإجابة النموذجية: لتهيئة الرحم لاستقبال الجنين وانغراسه.\n\n3) [المستوى المتقدم] ماذا يحدث للبطانة إذا لم يحدث إخصاب؟ وإذا حدث؟\nالإجابة النموذجية: إذا لم يحدث تنفصل وتبدأ دورة جديدة، وإذا حدث وانغرس الجنين تبقى ولا يحدث الطمث.\n\nالحصة 3: تحليل مخططات دورة الطمث\n1) [مستوى الدعم] في مخطط الدورة، متى تكون بطانة الرحم في أرق حالاتها؟\nالإجابة النموذجية: في نهاية الطمث تقريبًا (الأيام الأولى).\n\n2) [المستوى المتوقع] ما الحدث الذي يقع في المبيض في منتصف الدورة؟\nالإجابة النموذجية: الإباضة.\n\n3) [المستوى المتقدم] دورة مدتها 32 يومًا. متى تتوقع الإباضة تقريبًا إذا كانت تحدث قبل نهاية الدورة بنحو 14 يومًا؟\nالإجابة النموذجية: نحو اليوم 18."},{"h":"<div class=\"psub\">الحصة 1: التغيرات في المبيض خلال دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تنضج البويضة داخل .........<\/td><td>المبيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تحدث الإباضة في اليوم الأول من الدورة.<\/td><td>خطأ؛ نحو منتصف الدورة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تختلف مدة الدورة قليلًا من شخص إلى آخر؟<\/td><td>لأن الدورة عملية طبيعية تتأثر بعوامل فردية، فقد تكون أقصر أو أطول قليلًا من 28 يومًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: انفصال بطانة الرحم وخروجها يسمى .........<\/td><td>الطمث (الحيض).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تبقى بطانة الرحم سميكة إذا حدث الحمل.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتوقف الطمث أثناء الحمل؟<\/td><td>لأن بطانة الرحم تبقى لتغذية الجنين المنغرس وحمايته فلا تنفصل.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تحليل مخططات دورة الطمث<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تتكرر دورة الطمث بانتظام تقريبًا.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يبدأ دورة جديدة؟<\/td><td>بدء الطمث بانفصال بطانة الرحم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد فهم دورة الطمث مهمًا صحيًا؟<\/td><td>لمعرفة ما هو طبيعي وملاحظة أي تغير غير معتاد يستدعي استشارة طبية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التغيرات في المبيض خلال دورة الطمث\n1) [مستوى الدعم] أكمل: تنضج البويضة داخل .........\nالإجابة النموذجية: المبيض.\n\n2) [المستوى المتوقع] صواب أم خطأ: تحدث الإباضة في اليوم الأول من الدورة.\nالإجابة النموذجية: خطأ؛ نحو منتصف الدورة.\n\n3) [المستوى المتقدم] لماذا تختلف مدة الدورة قليلًا من شخص إلى آخر؟\nالإجابة النموذجية: لأن الدورة عملية طبيعية تتأثر بعوامل فردية، فقد تكون أقصر أو أطول قليلًا من 28 يومًا.\n\nالحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث\n1) [مستوى الدعم] أكمل: انفصال بطانة الرحم وخروجها يسمى .........\nالإجابة النموذجية: الطمث (الحيض).\n\n2) [المستوى المتوقع] صواب أم خطأ: تبقى بطانة الرحم سميكة إذا حدث الحمل.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] لماذا يتوقف الطمث أثناء الحمل؟\nالإجابة النموذجية: لأن بطانة الرحم تبقى لتغذية الجنين المنغرس وحمايته فلا تنفصل.\n\nالحصة 3: تحليل مخططات دورة الطمث\n1) [مستوى الدعم] صواب أم خطأ: تتكرر دورة الطمث بانتظام تقريبًا.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الذي يبدأ دورة جديدة؟\nالإجابة النموذجية: بدء الطمث بانفصال بطانة الرحم.\n\n3) [المستوى المتقدم] لماذا يُعد فهم دورة الطمث مهمًا صحيًا؟\nالإجابة النموذجية: لمعرفة ما هو طبيعي وملاحظة أي تغير غير معتاد يستدعي استشارة طبية."},{"h":"<div class=\"psub\">الحصة 1: التغيرات في المبيض خلال دورة الطمث<\/div><p>مراجعة كتاب الطالب ص 74، ورسم المخطط الدائري لدورة الطمث.<\/p><div class=\"psub\">الحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث<\/div><p>مراجعة كتاب الطالب ص 74، وإكمال مخطط الدورة الذي يجمع أحداث المبيض والرحم.<\/p><div class=\"psub\">الحصة 3: تحليل مخططات دورة الطمث<\/div><p>الإجابة عن السؤالين 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة الرابعة في كتاب الطالب.<\/p>","t":"الحصة 1: التغيرات في المبيض خلال دورة الطمث\nمراجعة كتاب الطالب ص 74، ورسم المخطط الدائري لدورة الطمث.\n\nالحصة 2: التغيرات في بطانة الرحم خلال دورة الطمث\nمراجعة كتاب الطالب ص 74، وإكمال مخطط الدورة الذي يجمع أحداث المبيض والرحم.\n\nالحصة 3: تحليل مخططات دورة الطمث\nالإجابة عن السؤالين 12-4 و13-4 والسؤال 5 من أسئلة نهاية الوحدة الرابعة في كتاب الطالب."}]}},{"label":"4-4 فيروس نقص المناعة عند الإنسان HIV ومرض الإيدز AIDS","unit":"الوحدة الرابعة: التكاثر في الإنسان","periods":[{"n":1,"focus":"فيروس HIV وأثره في الجهاز المناعي","info":"<div><b>الدرس:<\/b> 4-4 فيروس نقص المناعة عند الإنسان HIV ومرض الإيدز AIDS<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 75–80 | كتاب النشاط: ورقة العمل 2-4 ص 42<\/div><div><b>دليل المعلم:<\/b> ص 66<\/div><div><b>محور الحصة:<\/b> فيروس HIV وأثره في الجهاز المناعي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز).<\/li><li>يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة.<\/div>","t":"1. يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز).\n2. يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض.\nمخرج تعليمي آخر: يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز). ← تذكر\n• يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض. ← فهم\n• يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التشاركي<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التشاركي\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>فيروس HIV<\/span><span>الإيدز AIDS<\/span><span>الجهاز المناعي<\/span><span>الخلايا الليمفاوية<\/span><span>العدوى الانتهازية<\/span><\/div>","t":"فيروس HIV، الإيدز AIDS، الجهاز المناعي، الخلايا الليمفاوية، العدوى الانتهازية"},{"h":"<p>سؤال: ماذا يحدث لجسم الإنسان إذا ضعف «جيش الدفاع» فيه؟<\/p>","t":"سؤال: ماذا يحدث لجسم الإنسان إذا ضعف «جيش الدفاع» فيه؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويربطه بخلايا الدم البيضاء.<\/td><td>يستدعون وظائف خلايا الدم البيضاء.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">الفيروس والمناعة (كتاب الطالب ص 75–77)<\/td><td>يعرض على السبورة الذكية مقطعًا مبسطًا لمهاجمة الفيروس للخلايا الليمفاوية.<\/td><td>يرسمون سلسلة: العدوى ← نقص الخلايا الليمفاوية ← ضعف المناعة ← الإيدز.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">العدوى الانتهازية<\/td><td>يوضح أن ضعف المناعة يجعل الجسم عرضة لأمراض كالسل والالتهاب الرئوي.<\/td><td>يفسرون سبب خطورة الأمراض البسيطة على المصاب.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مراجعة<\/td><td>يطرح أسئلة شفهية.<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويربطه بخلايا الدم البيضاء.\nدور الطالب: يستدعون وظائف خلايا الدم البيضاء.\n\n(13 دقيقة) الفيروس والمناعة (كتاب الطالب ص 75–77)\nدور المعلم: يعرض على السبورة الذكية مقطعًا مبسطًا لمهاجمة الفيروس للخلايا الليمفاوية.\nدور الطالب: يرسمون سلسلة: العدوى ← نقص الخلايا الليمفاوية ← ضعف المناعة ← الإيدز.\n\n(12 دقيقة) العدوى الانتهازية\nدور المعلم: يوضح أن ضعف المناعة يجعل الجسم عرضة لأمراض كالسل والالتهاب الرئوي.\nدور الطالب: يفسرون سبب خطورة الأمراض البسيطة على المصاب.\n\n(5 دقائق) مراجعة\nدور المعلم: يطرح أسئلة شفهية.\nدور الطالب: يجيبون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يعني الاختصار AIDS؟<\/td><td>متلازمة نقص المناعة المكتسبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الخلايا التي يهاجمها فيروس HIV؟<\/td><td>الخلايا الليمفاوية (من خلايا الدم البيضاء).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يصاب مريض الإيدز بأمراض لا تصيب الأصحاء عادة؟<\/td><td>لضعف جهازه المناعي فلا يستطيع مقاومة مسببات الأمراض.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يعني الاختصار AIDS؟\nالإجابة النموذجية: متلازمة نقص المناعة المكتسبة.\n\n2) [المستوى المتوقع] ما الخلايا التي يهاجمها فيروس HIV؟\nالإجابة النموذجية: الخلايا الليمفاوية (من خلايا الدم البيضاء).\n\n3) [المستوى المتقدم] لماذا يصاب مريض الإيدز بأمراض لا تصيب الأصحاء عادة؟\nالإجابة النموذجية: لضعف جهازه المناعي فلا يستطيع مقاومة مسببات الأمراض."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الإصابة بفيروس HIV تعني الإصابة بالإيدز فورًا.<\/td><td>خطأ؛ قد تؤدي العدوى إلى الإيدز بعد مدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: يسبب الفيروس ضعف الجهاز .........<\/td><td>المناعي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا توجد مضادات حيوية تقضي على فيروس HIV؟<\/td><td>لأن المضادات الحيوية تؤثر في البكتيريا لا في الفيروسات.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: الإصابة بفيروس HIV تعني الإصابة بالإيدز فورًا.\nالإجابة النموذجية: خطأ؛ قد تؤدي العدوى إلى الإيدز بعد مدة.\n\n2) [المستوى المتوقع] أكمل: يسبب الفيروس ضعف الجهاز .........\nالإجابة النموذجية: المناعي.\n\n3) [المستوى المتقدم] لماذا لا توجد مضادات حيوية تقضي على فيروس HIV؟\nالإجابة النموذجية: لأن المضادات الحيوية تؤثر في البكتيريا لا في الفيروسات."},{"h":"<p>مراجعة كتاب الطالب ص 75–77، وكتابة فقرة عن دور الجهاز المناعي في حماية الجسم.<\/p>","t":"مراجعة كتاب الطالب ص 75–77، وكتابة فقرة عن دور الجهاز المناعي في حماية الجسم."}]},{"n":2,"focus":"طرق انتقال فيروس HIV والوقاية منه","info":"<div><b>الدرس:<\/b> 4-4 فيروس نقص المناعة عند الإنسان HIV ومرض الإيدز AIDS<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 75–80 | كتاب النشاط: ورقة العمل 2-4 ص 42<\/div><div><b>دليل المعلم:<\/b> ص 66<\/div><div><b>محور الحصة:<\/b> طرق انتقال فيروس HIV والوقاية منه<\/di ><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التهيئة: اللعبة<\/td><td>يعرض البطاقات على السبورة الذكية.<\/td><td>يصنفون المواقف ويبررون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">طرق الانتقال (كتاب الطالب ص 77–78)<\/td><td>يوضح: الاتصال الجنسي مع مصاب، والدم الملوث (نقل دم غير مفحوص، ومشاركة الإبر والأدوات الحادة)، ومن الأم المصابة إلى طفلها.<\/td><td>يكملون جدولًا: طريقة الانتقال، الإجراء الوقائي.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مواقف لا تنقل العدوى<\/td><td>يصحح التصورات الخاطئة: المصافحة واستخدام الأدوات العامة ولدغ البعوض لا تنقل الفيروس.<\/td><td>يعدلون تصنيفهم الأول.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(7 دقائق) التهيئة: اللعبة\nدور المعلم: يعرض البطاقات على السبورة الذكية.\nدور الطالب: يصنفون المواقف ويبررون.\n\n(13 دقيقة) طرق الانتقال (كتاب الطالب ص 77–78)\nدور المعلم: يوضح: الاتصال الجنسي مع مصاب، والدم الملوث (نقل دم غير مفحوص، ومشاركة الإبر والأدوات الحادة)، ومن الأم المصابة إلى طفلها.\nدور الطالب: يكملون جدولًا: طريقة الانتقال، الإجراء الوقائي.\n\n(7 دقائق) مواقف لا تنقل العدوى\nدور المعلم: يصحح التصورات الخاطئة: المصافحة واستخدام الأدوات العامة ولدغ البعوض لا تنقل الفيروس.\nدور الطالب: يعدلون تصنيفهم الأول.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر طريقتين لانتقال فيروس HIV.<\/td><td>الدم الملوث (كمشاركة الإبر)، والاتصال الجنسي مع شخص مصاب، ومن الأم المصابة إلى طفلها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل تنقل المصافحة فيروس HIV؟<\/td><td>لا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُفحص وحدات الدم قبل نقلها إلى المرضى؟<\/td><td>للتأكد من خلوها من الفيروسات مثل HIV ومنع انتقال العدوى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر طريقتين لانتقال فيروس HIV.\nالإجابة النموذجية: الدم الملوث (كمشاركة الإبر)، والاتصال الجنسي مع شخص مصاب، ومن الأم المصابة إلى طفلها.\n\n2) [المستوى المتوقع] هل تنقل المصافحة فيروس HIV؟\nالإجابة النموذجية: لا.\n\n3) [المستوى المتقدم] لماذا تُفحص وحدات الدم قبل نقلها إلى المرضى؟\nالإجابة النموذجية: للتأكد من خلوها من الفيروسات مثل HIV ومنع انتقال العدوى."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: مشاركة أدوات الحلاقة قد تنقل العدوى إذا تلوثت بالدم.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الإجراء الذي يمنع انتقال الفيروس بالإبر؟<\/td><td>استخدام الإبر المعقمة مرة واحدة وعدم مشاركتها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التعامل الطبيعي مع المصاب في المدرسة آمنًا؟<\/td><td>لأن الفيروس لا ينتقل بالتعامل اليومي العادي كالمصافحة ومشاركة المكان.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: مشاركة أدوات الحلاقة قد تنقل العدوى إذا تلوثت بالدم.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الإجراء الذي يمنع انتقال الفيروس بالإبر؟\nالإجابة النموذجية: استخدام الإبر المعقمة مرة واحدة وعدم مشاركتها.\n\n3) [المستوى المتقدم] لماذا يُعد التعامل الطبيعي مع المصاب في المدرسة آمنًا؟\nالإجابة النموذجية: لأن الفيروس لا ينتقل بالتعامل اليومي العادي كالمصافحة ومشاركة المكان."},{"h":"<p>مراجعة كتاب الطالب ص 77–78، ومناقشة إجراءات السلامة الصحية مع ولي الأمر.<\/p>","t":"مراجعة كتاب الطالب ص 77–78، ومناقشة إجراءات السلامة الصحية مع ولي الأمر."}]},{"n":3,"focus":"التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة","info":"<div><b>الدرس:<\/b> 4-4 فيروس نقص المناعة عند الإنسان HI ذكية\n• الأقلام\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>الأمراض المنقولة جنسيًا<\/span><span>الوقاية<\/span><span>الفحص الطبي<\/span><span>التوعية الصحية<\/span><span>الانتشار<\/span><\/div>","t":"الأمراض المنقولة جنسيًا، الوقاية، الفحص الطبي، التوعية الصحية، الانتشار"},{"h":"<p>يعرض رسمًا بيانيًا لأعداد الإصابات عبر السنوات ويسأل: ما الذي يمكن أن يخفض أعداد الإصابات؟<\/p>","t":"يعرض رسمًا بيانيًا لأعداد الإصابات عبر السنوات ويسأل: ما الذي يمكن أن يخفض أعداد الإصابات؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الرسم على السبورة الذكية.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التحكم في الانتشار (كتاب الطالب ص 78–79)<\/td><td>يناقش الإجراءات: الالتزام بالعلاقة الزوجية المشروعة، وفحص الدم المتبرع به، وعدم مشاركة الأدوات الحادة، والفحص المبكر والعلاج، والتوعية.<\/td><td>يدونون الإجراءات ويربط كل منها بطريقة الانتقال التي يمنعها.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">ورقة العمل 2-4 فيروس HIV ومرض الإيدز في منطقة البحر الكاريبي (كتاب النشاط ص 42)<\/td><td>يوجه إلى تحليل البيانات.<\/td><td>يصفون الاتجاهات ويقترحون تفسيرات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الرابعة (السؤال 7 – كتاب الطالب ص 80)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الرسم على السبورة الذكية.\nدور الطالب: يقترحون أسبابًا.\n\n(10 دقائق) التحكم في الانتشار (كتاب الطالب ص 78–79)\nدور المعلم: يناقش الإجراءات: الالتزام بالعلاقة الزوجية المشروعة، وفحص الدم المتبرع به، وعدم مشاركة الأدوات الحادة، والفحص المبكر والعلاج، والتوعية.\nدور الطالب: يدونون الإجراءات ويربط كل منها بطريقة الانتقال التي يمنعها.\n\n(12 دقيقة) ورقة العمل 2-4 فيروس HIV ومرض الإيدز في منطقة البحر الكاريبي (كتاب النشاط ص 42)\nدور المعلم: يوجه إلى تحليل البيانات.\nدور الطالب: يصفون الاتجاهات ويقترحون تفسيرات.\n\n(8 دقائق) أسئلة نهاية الوحدة الرابعة (السؤال 7 – كتاب الطالب ص 80)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر إجراءين للتحكم في انتشار الأمراض المنقولة جنسيًا.<\/td><td>الالتزام بالعلاقة الزوجية المشروعة، والفحص الطبي المبكر والعلاج، والتوعية الصحية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف يساعد الفحص المبكر على الحد من انتشار المرض؟<\/td><td>يكشف الإصابة مبكرًا فيبدأ العلاج وتُتخذ الاحتياطات لمنع نقل العدوى.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>إذا انخفضت الإصابات الجديدة بعد حملة توعية، فهل يمكن الجزم بأن الحملة هي السبب الوحيد؟ فسّر.<\/td><td>لا؛ قد تسهم عوامل أخرى كتحسن الفحص والعلاج، فالارتباط لا يعني بالضرورة سببية وحيدة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر إجراءين للتحكم في انتشار الأمراض المنقولة جنسيًا.\nالإجابة النموذجية: الالتزام بالعلاقة الزوجية المشروعة، والفحص الطبي المبكر والعلاج، والتوعية الصحية.\n\n2) [المستوى المتوقع] كيف يساعد الفحص المبكر على الحد من انتشار المرض؟\nالإجابة النموذجية: يكشف الإصابة مبكرًا فيبدأ العلاج وتُتخذ الاحتياطات لمنع نقل العدوى.\n\n3) [المستوى المتقدم] إذا انخفضت الإصابات الجديدة بعد حملة توعية، فهل يمكن الجزم بأن الحملة هي السبب الوحيد؟ فسّر.\nالإجابة النموذجية: لا؛ قد تسهم عوامل أخرى كتحسن الفحص والعلاج، فالارتباط لا يعني بالضرورة سببية وحيدة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: التوعية الصحية من وسائل الحد من انتشار المرض.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الإجراء الذي يمنع انتقال العدوى بنقل الدم؟<\/td><td>فحص الدم المتبرع به قبل نقله.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح ثلاثة عناصر لحملة توعية مدرسية عن الوقاية من HIV.<\/td><td>معلومات علمية عن طرق الانتقال، وتصحيح المفاهيم الخاطئة عن التعامل اليومي، والتأكيد على السلوكيات الوقائية وقيم المجتمع.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: التوعية الصحية من وسائل الحد من انتشار المرض.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الإجراء الذي يمنع انتقال العدوى بنقل الدم؟\nالإجابة النموذجية: فحص الدم المتبرع به قبل نقله.\n\n3) [المستوى المتقدم] اقترح ثلاثة عناصر لحملة توعية مدرسية عن الوقاية من HIV.\nالإجابة النموذجية: معلومات علمية عن طرق الانتقال، وتصحيح المفاهيم الخاطئة عن التعامل اليومي، والتأكيد على السلوكيات الوقائية وقيم المجتمع."},{"h":"<p>إكمال ورقة العمل 2-4 في كتاب النشاط ص 42، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي.<\/p>","t":"إكمال ورقة العمل 2-4 في كتاب النشاط ص 42، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-4 فيروس نقص المناعة عند الإنسان HIV ومرض الإيدز AIDS<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 75–80 | كتاب النشاط: ورقة العمل 2-4 ص 42<\/div><div><b>دليل المعلم:<\/b> ص 66<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><ol class=\"ol\"><li>يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز).<\/li><li>يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة.<\/div><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><ol class=\"ol\"><li>يصف طرق انتقال فيروس HIV.<\/li><li>يحدد إجراءات الوقاية من العدوى.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين المواقف التي تنقل العدوى والمواقف الآمنة في الحياة اليومية.<\/div><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><ol class=\"ol\"><li>يشرح كيفية التحكم في انتشار الأمراض المنقولة جنسيًا.<\/li><li>يحلل بيانات انتشار المرض في منطقة البحر الكاريبي (ورقة العمل 2-4).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح خطة توعوية مجتمعية للوقاية مستندة إلى القيم والمعلومات العلمية.<\/div>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\n1. يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز).\n2. يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض.\nمخرج تعليمي آخر: يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة.\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\n1. يصف طرق انتقال فيروس HIV.\n2. يحدد إجراءات الوقاية من العدوى.\nمخرج تعليمي آخر: يميز بين المواقف التي تنقل العدوى والمواقف الآمنة في الحياة اليومية.\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\n1. يشرح كيفية التحكم في انتشار الأمراض المنقولة جنسيًا.\n2. يحلل بيانات انتشار المرض في منطقة البحر الكاريبي (ورقة العمل 2-4).\nمخرج تعليمي آخر: يقترح خطة توعوية مجتمعية للوقاية مستندة إلى القيم والمعلومات العلمية."},{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن العدوى بفيروس نقص المناعة عند الإنسان HIV قد تؤدي إلى متلازمة نقص المناعة المكتسبة (الإيدز).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف أثر الفيروس في الخلايا الليمفاوية وقدرة الجسم على مقاومة الأمراض.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر إصابة مرضى الإيدز بأمراض لا تصيب الأصحاء عادة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف طرق انتقال فيروس HIV.<\ pan><span>نقل الدم<\/span><span>الأدوات الحادة الملوثة<\/span><span>انتقال العدوى من الأم إلى الطفل<\/span><span>الوقاية<\/span><\/div><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><div class=\"pills\"><span>الأمراض المنقولة جنسيًا<\/span><span>الوقاية<\/span><span>الفحص الطبي<\/span><span>التوعية الصحية<\/span><span>الانتشار<\/span><\/div>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\nفيروس HIV، الإيدز AIDS، الجهاز المناعي، الخلايا الليمفاوية، العدوى الانتهازية\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\nطرق الانتقال، نقل الدم، الأدوات الحادة الملوثة، انتقال العدوى من الأم إلى الطفل، الوقاية\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\nالأمراض المنقولة جنسيًا، الوقاية، الفحص الطبي، التوعية الصحية، الانتشار"},{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><p>سؤال: ماذا يحدث لجسم الإنسان إذا ضعف «جيش الدفاع» فيه؟<\/p><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><p>لعبة «تنقل أم لا تنقل؟»: بطاقات لمواقف يومية مثل المصافحة واستخدام أداة حادة ملوثة.<\/p><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><p>يعرض رسمًا بيانيًا لأعداد الإصابات عبر السنوات ويسأل: ما الذي يمكن أن يخفض أعداد الإصابات؟<\/p>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\nسؤال: ماذا يحدث لجسم الإنسان إذا ضعف «جيش الدفاع» فيه؟\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\nلعبة «تنقل أم لا تنقل؟»: بطاقات لمواقف يومية مثل المصافحة واستخدام أداة حادة ملوثة.\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\nيعرض رسمًا بيانيًا لأعداد الإصابات عبر السنوات ويسأل: ما الذي يمكن أن يخفض أعداد الإصابات؟"},{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويربطه بخلايا الدم البيضاء.<\/td><td>يستدعون وظائف خلايا الدم البيضاء.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">الفيروس والمناعة (كتاب الطالب ص 75–77)<\/td><td>يعرض على السبورة الذكية مقطعًا مبسطًا لمهاجمة الفيروس للخلايا الليمفاوية.<\/td><td>يرسمون سلسلة: العدوى ← نقص الخلايا الليمفاوية ← ضعف المناعة ← الإيدز.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">العدوى الانتهازية<\/td><td>يوضح أن ضعف المناعة يجعل الجسم عرضة لأمراض كالسل والالتهاب الرئوي.<\/td><td>يفسرون سبب خطورة الأمراض البسيطة على المصاب.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مراجعة<\/td><td>يطرح أسئلة شفهية.<\/td><td>يجيبون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التهيئة: اللعبة<\/td><td>يعرض البطاقات على السبورة الذكية.<\/td><td>يصنفون المواقف ويبررون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">طرق الانتقال (كتاب الطالب ص 77–78)<\/td><td>يوضح: الاتصال الجنسي مع مصاب، والدم الملوث (نقل دم غير مفحوص، ومشاركة الإبر والأدوات الحادة)، ومن الأم المصابة إلى طفلها.<\/td><td>يكملون جدولًا: طريقة الانتقال، الإجراء الوقائي.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مواقف لا تنقل العدوى<\/td><td>يصحح التصورات الخاطئة: المصافحة واستخدام الأدوات العامة ولدغ البعوض لا تنقل الفيروس.<\/td><td>يعدلون تصنيفهم الأول.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الرسم على السبورة الذكية.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التحكم في الانتشار (كتاب الطالب ص 78–79)<\/td><td>يناقش الإجراءات: الالتزام بالعلاقة الزوجية المشروعة، وفحص الدم المتبرع به، وعدم مشاركة الأدوات الحادة، والفحص المبكر والعلاج، والتوعية.<\/td><td>يدونون الإجراءات ويربط كل منها بطريقة الانتقال التي يمنعها.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">ورقة العمل 2-4 فيروس HIV ومرض الإيدز في منطقة البحر الكاريبي (كتاب النشاط ص 42)<\/td><td>يوجه إلى تحليل البيانات.<\/td><td>يصفون الاتجاهات ويقترحون تفسيرات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الرابعة (السؤال 7 – كتاب الطالب ص 80)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويربطه بخلايا الدم البيضاء.\nدور الطالب: يستدعون وظائف خلايا الدم البيضاء.\n\n(13 دقيقة) الفيروس والمناعة (كتاب الطالب ص 75–77)\nدور المعلم: يعرض على السبورة الذكية مقطعًا مبسطًا لمهاجمة الفيروس للخلايا الليمفاوية.\nدور الطالب: يرسمون سلسلة: العدوى ← نقص الخلايا الليمفاوية ← ضعف المناعة ← الإيدز.\n\n(12 دقيقة) العدوى الانتهازية\nدور المعلم: يوضح أن ضعف المناعة يجعل الجسم عرضة لأمراض كالسل والالتهاب الرئوي.\nدور الطالب: يفسرون سبب خطورة الأمراض البسيطة على المصاب.\n\n(5 دقائق) مراجعة\nدور المعلم: يطرح أسئلة شفهية.\nدور الطالب: يجيبون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\n(7 دقائق) التهيئة: اللعبة\nدور المعلم: يعرض البطاقات على السبورة الذكية.\nدور الطالب: يصنفون المواقف ويبررون.\n\n(13 دقيقة) طرق الانتقال (كتاب الطالب ص 77–78)\nدور المعلم: يوضح: الاتصال الجنسي مع مصاب، والدم الملوث (نقل دم غير مفحوص، ومشاركة الإبر والأدوات الحادة)، ومن الأم المصابة إلى طفلها.\nدور الطالب: يكملون جدولًا: طريقة الانتقال، الإجراء الوقائي.\n\n(7 دقائق) مواقف لا تنقل العدوى\nدور المعلم: يصحح التصورات الخاطئة: المصافحة واستخدام الأدوات العامة ولدغ البعوض لا تنقل الفيروس.\nدور الطالب: يعدلون تصنيفهم الأول.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الرسم على السبورة الذكية.\nدور الطالب: يقترحون أسبابًا.\n\n(10 دقائق) التحكم في الانتشار (كتاب الطالب ص 78–79)\nدور المعلم: يناقش الإجراءات: الالتزام بالعلاقة الزوجية المشروعة، وفحص الدم المتبرع به، وعدم مشاركة الأدوات الحادة، والفحص المبكر والعلاج، والتوعية.\nدور الطالب: يدونون الإجراءات ويربط كل منها بطريقة الانتقال التي يمنعها.\n\n(12 دقيقة) ورقة العمل 2-4 فيروس HIV ومرض الإيدز في منطقة البحر الكاريبي (كتاب النشاط ص 42)\nدور المعلم: يوجه إلى تحليل البيانات.\nدور الطالب: يصفون الاتجاهات ويقترحون تفسيرات.\n\n(8 دقائق) أسئلة نهاية الوحدة الرابعة (السؤال 7 – كتاب الطالب ص 80)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يعني الاختصار AIDS؟<\/td><td>متلازمة نقص المناعة المكتسبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الخلايا التي يهاجمها فيروس HIV؟<\/td><td>الخلايا الليمفاوية (من خلايا الدم البيضاء).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يصاب مريض الإيدز بأمراض لا تصيب الأصحاء عادة؟<\/td><td>لضعف جهازه المناعي فلا يستطيع مقاومة مسببات الأمراض.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر طريقتين لانتقال فيروس HIV.<\/td><td>الدم الملوث (كمشاركة الإبر)، والاتصال الجنسي مع شخص مصاب، ومن الأم المصابة إلى طفلها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل تنقل المصافحة فيروس HIV؟<\/td><td>لا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُفحص وحدات الدم قبل نقلها إلى المرضى؟<\/td><td>للتأكد من خلوها من الفيروسات مثل HIV ومنع انتقال العدوى.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر إجراءين للتحكم في انتشار الأمراض المنقولة جنسيًا.<\/td><td>الالتزام بالعلاقة الزوجية المشروعة، والفحص الطبي المبكر والعلاج، والتوعية الصحية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف يساعد الفحص المبكر على الحد من انتشار المرض؟<\/td><td>يكشف الإصابة مبكرًا فيبدأ العلاج وتُتخذ الاحتياطات لمنع نقل العدوى.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>إذا انخفضت الإصابات الجديدة بعد حملة توعية، فهل يمكن الجزم بأن الحملة هي السبب الوحيد؟ فسّر.<\/td><td>لا؛ قد تسهم عوامل أخرى كتحسن الفحص والعلاج، فالارتباط لا يعني بالضرورة سببية وحيدة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\n1) [مستوى الدعم] ماذا يعني الاختصار AIDS؟\nالإجابة النموذجية: متلازمة نقص المناعة المكتسبة.\n\n2) [المستوى المتوقع] ما الخلايا التي يهاجمها فيروس HIV؟\nالإجابة النموذجية: الخلايا الليمفاوية (من خلايا الدم البيضاء).\n\n3) [المستوى المتقدم] لماذا يصاب مريض الإيدز بأمراض لا تصيب الأصحاء عادة؟\nالإجابة النموذجية: لضعف جهازه المناعي فلا يستطيع مقاومة مسببات الأمراض.\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\n1) [مستوى الدعم] اذكر طريقتين لانتقال فيروس HIV.\nالإجابة النموذجية: الدم الملوث (كمشاركة الإبر)، والاتصال الجنسي مع شخص مصاب، ومن الأم المصابة إلى طفلها.\n\n2) [المستوى المتوقع] هل تنقل المصافحة فيروس HIV؟\nالإجابة النموذجية: لا.\n\n3) [المستوى المتقدم] لماذا تُفحص وحدات الدم قبل نقلها إلى المرضى؟\nالإجابة النموذجية: للتأكد من خلوها من الفيروسات مثل HIV ومنع انتقال العدوى.\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\n1) [مستوى الدعم] اذكر إجراءين للتحكم في انتشار الأمراض المنقولة جنسيًا.\nالإجابة النموذجية: الالتزام بالعلاقة الزوجية المشروعة، والفحص الطبي المبكر والعلاج، والتوعية الصحية.\n\n2) [المستوى المتوقع] كيف يساعد الفحص المبكر على الحد من انتشار المرض؟\nالإجابة النموذجية: يكشف الإصابة مبكرًا فيبدأ العلاج وتُتخذ الاحتياطات لمنع نقل العدوى.\n\n3) [المستوى المتقدم] إذا انخفضت الإصابات الجديدة بعد حملة توعية، فهل يمكن الجزم بأن الحملة هي السبب الوحيد؟ فسّر.\nالإجابة النموذجية: لا؛ قد تسهم عوامل أخرى كتحسن الفحص والعلاج، فالارتباط لا يعني بالضرورة سببية وحيدة."},{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الإصابة بفيروس HIV تعني الإصابة بالإيدز فورًا.<\/td><td>خطأ؛ قد تؤدي العدوى إلى الإيدز بعد مدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: يسبب الفيروس ضعف الجهاز .........<\/td><td>المناعي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا توجد مضادات حيوية تقضي على فيروس HIV؟<\/td><td>لأن المضادات الحيوية تؤثر في البكتيريا لا في الفيروسات.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: مشاركة أدوات الحلاقة قد تنقل العدوى إذا تلوثت بالدم.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الإجراء الذي يمنع انتقال الفيروس بالإبر؟<\/td><td>استخدام الإبر المعقمة مرة واحدة وعدم مشاركتها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التعامل الطبيعي مع المصاب في المدرسة آمنًا؟<\/td><td>لأن الفيروس لا ينتقل بالتعامل اليومي العادي كالمصافحة ومشاركة المكان.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: التوعية الصحية من وسائل الحد من انتشار المرض.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الإجراء الذي يمنع انتقال العدوى بنقل الدم؟<\/td><td>فحص الدم المتبرع به قبل نقله.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح ثلاثة عناصر لحملة توعية مدرسية عن الوقاية من HIV.<\/td><td>معلومات علمية عن طرق الانتقال، وتصحيح المفاهيم الخاطئة عن التعامل اليومي، والتأكيد على السلوكيات الوقائية وقيم المجتمع.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\n1) [مستوى الدعم] صواب أم خطأ: الإصابة بفيروس HIV تعني الإصابة بالإيدز فورًا.\nالإجابة النموذجية: خطأ؛ قد تؤدي العدوى إلى الإيدز بعد مدة.\n\n2) [المستوى المتوقع] أكمل: يسبب الفيروس ضعف الجهاز .........\nالإجابة النموذجية: المناعي.\n\n3) [المستوى المتقدم] لماذا لا توجد مضادات حيوية تقضي على فيروس HIV؟\nالإجابة النموذجية: لأن المضادات الحيوية تؤثر في البكتيريا لا في الفيروسات.\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\n1) [مستوى الدعم] صواب أم خطأ: مشاركة أدوات الحلاقة قد تنقل العدوى إذا تلوثت بالدم.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الإجراء الذي يمنع انتقال الفيروس بالإبر؟\nالإجابة النموذجية: استخدام الإبر المعقمة مرة واحدة وعدم مشاركتها.\n\n3) [المستوى المتقدم] لماذا يُعد التعامل الطبيعي مع المصاب في المدرسة آمنًا؟\nالإجابة النموذجية: لأن الفيروس لا ينتقل بالتعامل اليومي العادي كالمصافحة ومشاركة المكان.\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\n1) [مستوى الدعم] صواب أم خطأ: التوعية الصحية من وسائل الحد من انتشار المرض.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الإجراء الذي يمنع انتقال العدوى بنقل الدم؟\nالإجابة النموذجية: فحص الدم المتبرع به قبل نقله.\n\n3) [المستوى المتقدم] اقترح ثلاثة عناصر لحملة توعية مدرسية عن الوقاية من HIV.\nالإجابة النموذجية: معلومات علمية عن طرق الانتقال، وتصحيح المفاهيم الخاطئة عن التعامل اليومي، والتأكيد على السلوكيات الوقائية وقيم المجتمع."},{"h":"<div class=\"psub\">الحصة 1: فيروس HIV وأثره في الجهاز المناعي<\/div><p>مراجعة كتاب الطالب ص 75–77، وكتابة فقرة عن دور الجهاز المناعي في حماية الجسم.<\/p><div class=\"psub\">الحصة 2: طرق انتقال فيروس HIV والوقاية منه<\/div><p>مراجعة كتاب الطالب ص 77–78، ومناقشة إجراءات السلامة الصحية مع ولي الأمر.<\/p><div class=\"psub\">الحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة<\/div><p>إكمال ورقة العمل 2-4 في كتاب النشاط ص 42، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي.<\/p>","t":"الحصة 1: فيروس HIV وأثره في الجهاز المناعي\nمراجعة كتاب الطالب ص 75–77، وكتابة فقرة عن دور الجهاز المناعي في حماية الجسم.\n\nالحصة 2: طرق انتقال فيروس HIV والوقاية منه\nمراجعة كتاب الطالب ص 77–78، ومناقشة إجراءات السلامة الصحية مع ولي الأمر.\n\nالحصة 3: التحكم في انتشار الأمراض المنقولة جنسيًا ومراجعة الوحدة\nإكمال ورقة العمل 2-4 في كتاب النشاط ص 42، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الرابعة، ومراجعة الفصل الدراسي."}]}}]};</script>
<script>
(function(){
'use strict';
var mode='sep', li=0, pi=0;
function $(s){return document.querySelector(s)}
function nP(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function copy(text,btn,card){
  function ok(){btn.textContent='تم النسخ ✓';btn.classList.add('done');clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent='نسخ';btn.classList.remove('done')},2000)}
  function manual(){var m=card.querySelector('.man'),ta=m.querySelector('textarea');ta.value=text;m.hidden=false;ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}}
  function legacy(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}var s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(s)ok();else manual()}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,legacy)}else{legacy()}
}
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.classList.toggle('on',b.dataset.m===mode)});
  $('#state').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
  var L=D.lessons[li], tabs=$('#tabs'); tabs.innerHTML=''; tabs.hidden=(mode!=='sep');
  if(mode==='sep'){L.periods.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.className='tab'+(i===pi?' on':'');b.innerHTML='<b>الحصة '+p.n+' من '+L.periods.length+'</b><small>'+esc(p.focus)+'</small>';b.onclick=function(){pi=i;render()};tabs.appendChild(b)})}
  var src=mode==='sep'?L.periods[pi]:L.comb;
  $('#info').innerHTML=src.info;
  var box=$('#fields'); box.innerHTML='';
  src.fields.forEach(function(f,k){
    var c=document.createElement('article'); c.className='card';
    c.innerHTML='<div class="hd"><h3><span class="no">'+(k+1)+'</span>'+D.ft[k]+'</h3><button class="copy" type="button">نسخ</button></div><div class="bd">'+f.h+'</div><div class="man" hidden><p>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، انسخه يدويًا.</p><textarea readonly></textarea></div>';
    c.querySelector('.copy').onclick=function(e){copy(f.t,e.currentTarget,c)};
    box.appendChild(c);
  });
}
function init(){
  var sel=$('#lesson'), lastU=null, og=null;
  D.lessons.forEach(function(L,i){if(L.unit!==lastU){og=document.createElement('optgroup');og.label=L.unit;sel.appendChild(og);lastU=L.unit}var o=document.createElement('option');o.value=i;o.textContent=L.label+' ('+nP(L.periods.length)+')';og.appendChild(o)});
  sel.onchange=function(){li=+sel.value;pi=0;render()};
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){mode=b.dataset.m;render()}});
  render();
}
init();
})();
</script></body></html>
