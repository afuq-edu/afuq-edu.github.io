<\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الخصائص الأربع<\/td><td>يربط كل خاصية بسرعة الانتشار وفرق التركيز.<\/td><td>يكملون جدولًا: الخاصية، أثرها في الانتشار.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان (كتاب النشاط ص 22)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح المعلومة والسؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) الحويصلة الهوائية (كتاب الطالب ص 36–37)\nدور المعلم: يعرض على السبورة الذكية مخطط حويصلة مع شعيرة ويوضح انتشار الأكسجين وثاني أكسيد الكربون.\nدور الطالب: يرسمون اتجاه انتشار الغازين.\n\n(10 دقائق) الخصائص الأربع\nدور المعلم: يربط كل خاصية بسرعة الانتشار وفرق التركيز.\nدور الطالب: يكملون جدولًا: الخاصية، أثرها في الانتشار.\n\n(8 دقائق) تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان (كتاب النشاط ص 22)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر خاصيتين لأسطح تبادل الغازات.<\/td><td>مساحة سطحية كبيرة وسطح رقيق (وإمداد جيد بالدم وتهوية جيدة).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>في أي اتجاه ينتشر الأكسجين بين الحويصلة والشعيرة؟<\/td><td>من الحويصلة إلى الدم في الشعيرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يحافظ الإمداد الجيد بالدم على فرق تركيز الأكسجين؟<\/td><td>ينقل الدم الأكسجين بعيدًا باستمرار فيبقى تركيزه في الدم أقل منه في الحويصلة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر خاصيتين لأسطح تبادل الغازات.\nالإجابة النموذجية: مساحة سطحية كبيرة وسطح رقيق (وإمداد جيد بالدم وتهوية جيدة).\n\n2) [المستوى المتوقع] في أي اتجاه ينتشر الأكسجين بين الحويصلة والشعيرة؟\nالإجابة النموذجية: من الحويصلة إلى الدم في الشعيرة.\n\n3) [المستوى المتقدم] كيف يحافظ الإمداد الجيد بالدم على فرق تركيز الأكسجين؟\nالإجابة النموذجية: ينقل الدم الأكسجين بعيدًا باستمرار فيبقى تركيزه في الدم أقل منه في الحويصلة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ينتقل الأكسجين من الحويصلة إلى الدم بعملية .........<\/td><td>الانتشار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: جدار الحويصلة الهوائية سميك لحمايتها.<\/td><td>خطأ؛ رقيق لتقصير مسافة الانتشار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لكفاءة تبادل الغازات إذا تهدمت جدران كثير من الحويصلات؟ ولماذا؟<\/td><td>تقل؛ لأن المساحة السطحية للتبادل تنقص.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: ينتقل الأكسجين من الحويصلة إلى الدم بعملية .........\nالإجابة النموذجية: الانتشار.\n\n2) [المستوى المتوقع] صواب أم خطأ: جدار الحويصلة الهوائية سميك لحمايتها.\nالإجابة النموذجية: خطأ؛ رقيق لتقصير مسافة الانتشار.\n\n3) [المستوى المتقدم] ماذا يحدث لكفاءة تبادل الغازات إذا تهدمت جدران كثير من الحويصلات؟ ولماذا؟\nالإجابة النموذجية: تقل؛ لأن المساحة السطحية للتبادل تنقص."},{"h":"<p>حل تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان في كتاب النشاط ص 22، والإجابة عن السؤال 1-2.<\/p>","t":"حل تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان في كتاب النشاط ص 22، والإجابة عن السؤال 1-2."}]},{"n":3,"focus":"الاختلاف بين هواء الشهيق وهواء الزفير","info":"<div><b>الدرس:<\/b> 1-2 تبادل الغازات في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 34–41 | كتاب النشاط: تمرين 1-2 ص 22، تمرين 2-2 ص 23–26<\/div><div><b>دليل المعلم:<\/b> ص 37–38<\/div><div><b>محور الحصة:<\/b> الاختلاف بين هواء الشهيق وهواء الزفير<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر الاختلافات بين مكونات هواء الشهيق والزفير من حيث الأكسجين وثاني أكسيد الكربون وبخار الماء.<\/li> tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يلاحظون تكثف بخار الماء.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">جدول المقارنة (كتاب الطالب ص 37–38)<\/td><td>يعرض على السبورة الذكية جدول النسب: الأكسجين 21% و16%، وثاني أكسيد الكربون 0.04% و4%، وبخار الماء.<\/td><td>يحسبون الفروق ويصفونها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التفسير<\/td><td>يربط التغيرات بالتنفس الخلوي في الخلايا.<\/td><td>يكتبون تفسيرًا لكل تغير.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من المسابقة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يلاحظون تكثف بخار الماء.\n\n(12 دقيقة) جدول المقارنة (كتاب الطالب ص 37–38)\nدور المعلم: يعرض على السبورة الذكية جدول النسب: الأكسجين 21% و16%، وثاني أكسيد الكربون 0.04% و4%، وبخار الماء.\nدور الطالب: يحسبون الفروق ويصفونها.\n\n(10 دقائق) التفسير\nدور المعلم: يربط التغيرات بالتنفس الخلوي في الخلايا.\nدور الطالب: يكتبون تفسيرًا لكل تغير.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من المسابقة.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي الغازين يزداد في هواء الزفير؟<\/td><td>ثاني أكسيد الكربون (وبخار الماء).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نسبة الأكسجين تقريبًا في هواء الشهيق وفي هواء الزفير؟<\/td><td>نحو 21% في الشهيق ونحو 16% في الزفير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتوي هواء الزفير على أكسجين رغم استهلاك الجسم له؟<\/td><td>لأن الجسم لا يمتص كل الأكسجين الداخل، فجزء منه يخرج م دم فيستجيب الدماغ بزيادة معدل التنفس وعمقه.\nدور الطالب: يكتبون سلسلة السبب والنتيجة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لمعدل التنفس وعمقه أثناء التمرين؟<\/td><td>يزداد كلاهما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المادة التي يؤدي ارتفاع تركيزها في الدم إلى زيادة معدل التنفس؟<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر استمرار التنفس السريع بعض الوقت بعد التوقف عن التمرين.<\/td><td>لأن تركيز ثاني أكسيد الكربون في الدم يبقى مرتفعًا حتى يُتخلص منه، فيستمر الدماغ في تحفيز التنفس السريع.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث لمعدل التنفس وعمقه أثناء التمرين؟\nالإجابة النموذجية: يزداد كلاهما.\n\n2) [المستوى المتوقع] ما المادة التي يؤدي ارتفاع تركيزها في الدم إلى زيادة معدل التنفس؟\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n3) [المستوى المتقدم] فسّر استمرار التنفس السريع بعض الوقت بعد التوقف عن التمرين.\nالإجابة النموذجية: لأن تركيز ثاني أكسيد الكربون في الدم يبقى مرتفعًا حتى يُتخلص منه، فيستمر الدماغ في تحفيز التنفس السريع."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يزداد عمق التنفس أثناء التمرين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما فائدة زيادة معدل التنفس أثناء التمرين؟<\/td><td>إدخال مزيد من الأكسجين والتخلص من ثاني أكسيد الكربون بسرعة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح سببًا لكون معدل تنفس الرياضي المتدرب في الراحة أقل من غيره.<\/td><td>رئتاه وعضلاته التنفسية أكفأ، فيحصل على الأكسجين اللازم بعدد أقل من مرات التنفس.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يزداد عمق التنفس أثناء التمرين.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما فائدة زيادة معدل التنفس أثناء التمرين؟\nالإجابة النموذجية: إدخال مزيد من الأكسجين والتخلص من ثاني أكسيد الكربون بسرعة.\n\n3) [المستوى المتقدم] اقترح سببًا لكون معدل تنفس الرياضي المتدرب في الراحة أقل من غيره.\nالإجابة النموذجية: رئتاه وعضلاته التنفسية أكفأ، فيحصل على الأكسجين اللازم بعدد أقل من مرات التنفس."},{"h":"<p>مراجعة كتاب الطالب ص 39–40 والإجابة عن السؤال 3-2، وتسجيل معدل التنفس قبل نشاط رياضي منزلي آمن وبعده.<\/p>","t":"مراجعة كتاب الطالب ص 39–40 والإجابة عن السؤال 3-2، وتسجيل معدل التنفس قبل نشاط رياضي منزلي آمن وبعده."}]},{"n":6,"focus":"حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب","info":"<div><b>الدرس:<\/b> 1-2 تبادل الغازات في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 6 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 34–41 | كتاب النشاط: تمرين 1-2 ص 22، تمرين 2-2 ص 23–26<\/div><div><b>دليل المعلم:<\/b> ص 37–38<\/div><div><b>محور الحصة:<\/b> حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يشرح دور الخلايا الكأسية والمخاط والخلايا الهدبية في حماية جهاز تبادل الغازات من مسببات الأمراض والجسيمات.<\/li><li>يطبق مفاهيم الدرس في تحليل أسطح تبادل الغازات في جسم الجرذ.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر تلف الأهداب على صحة الجهاز التنفسي.<\/div>","t":"1. يشرح دور الخلايا الكأسية والمخاط والخلايا الهدبية في حماية جهاز تبادل الغازات من مسببات الأمراض والجسيمات.\n2. يطبق مفاهيم الدرس في تحليل أسطح تبادل الغازات في جسم الجرذ.\nمخرج تعليمي آخر: يتنبأ بأثر تلف الأهداب على صحة الجهاز التنفسي."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح دور الخلايا الكأسية والمخاط والخلايا الهدبية في حماية جهاز تبادل الغازات من مسببات الأمراض والجسيمات.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يطبق مفاهيم الدرس في تحليل أسطح تبادل الغازات في جسم الجرذ.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يتنبأ بأثر تلف الأهداب على صحة الجهاز التنفسي.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يشرح دور الخلايا الكأسية والمخاط والخلايا الهدبية في حماية جهاز تبادل الغازات من مسببات الأمراض والجسيمات. ← فهم\n• يطبق مفاهيم الدرس في تحليل أسطح تبادل الغازات في جسم الجرذ. ← تطبيق\n• يتنبأ بأثر تلف الأهداب على صحة الجهاز التنفسي. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الأقلام"},{"h":"<div class=\"pills\"><span>الخلايا الكأسية<\/span><span>المخاط<\/span><span>الخلايا الهدبية<\/span><span>الأهداب<\/span><span>مسببات الأمراض<\/span><span>الجسيمات الغبارية<\/span><\/div>","t":"الخلايا الكأسية، المخاط، الخلايا الهدبية، الأهداب، مسببات الأمراض، الجسيمات الغبارية"},{"h":"<p>سؤال: نتنفس يوميًا هواءً فيه غبار وبكتيريا، فلماذا لا تمتلئ رئاتنا بها؟<\/p>","t":"سؤال: نتنفس يوميًا هواءً فيه غبار وبكتيريا، فلماذا لا تمتلئ رئاتنا بها؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون آليات حماية.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الخلايا الكأسية والهدبية (كتاب الطالب ص 40–41)<\/td><td>يعرض على السبورة الذكية صورة مجهرية لبطانة القصبة الهوائية.<\/td><td>يحددون الخلايا الكأسية والهدبية ويصفون عمل كل منها.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">نمذجة السلم المتحرك<\/td><td>يمثل حركة المخاط نحو الحلق بشريط ورقي تحركه أصابع الطلبة.<\/td><td>يفسرون كيف يُنقل المخاط والجسيمات بعيدًا عن الرئتين.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 2-2 أسطح تبادل الغازات في جسم الجرذ (كتاب النشاط ص 23–26)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون آليات حماية.\n\n(12 دقيقة) الخلايا الكأسية والهدبية (كتاب الطالب ص 40–41)\nدور المعلم: يعرض على السبورة الذكية صورة مجهرية لبطانة القصبة الهوائية.\nدور الطالب: يحددون الخلايا الكأسية والهدبية ويصفون عمل كل منها.\n\n(8 دقائق) نمذجة السلم المتحرك\nدور المعلم: يمثل حركة المخاط نحو الحلق بشريط ورقي تحركه أصابع الطلبة.\nدور الطالب: يفسرون كيف يُنقل المخاط والجسيمات بعيدًا عن الرئتين.\n\n(10 دقائق) تمرين 2-2 أسطح تبادل الغازات في جسم الجرذ (كتاب النشاط ص 23–26)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الخلايا الكأسية؟<\/td><td>إفراز المخاط الذي يحتجز الغبار ومسببات الأمراض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الأهداب في القصبة الهوائية؟<\/td><td>تتحرك بانتظام لدفع المخاط وما علق به نحو الحلق بعيدًا عن الرئتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع ما يحدث إذا تلفت الأهداب.<\/td><td>يتراكم المخاط في المجاري التنفسية فيزداد السعال وخطر العدوى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وظيفة الخلايا الكأسية؟\nالإجابة النموذجية: إفراز المخاط الذي يحتجز الغبار ومسببات الأمراض.\n\n2) [المستوى المتوقع] ما وظيفة الأهداب في القصبة الهوائية؟\nالإجابة النموذجية: تتحرك بانتظام لدفع المخاط وما علق به نحو الحلق بعيدًا عن الرئتين.\n\n3) [المستوى المتقدم] توقع ما يحدث إذا تلفت الأهداب.\nالإجابة النموذجية: يتراكم المخاط في المجاري التنفسية فيزداد السعال وخطر العدوى."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المادة اللزجة التي تحتجز الجسيمات في المجاري التنفسية هي .........<\/td><td>المخاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تتحرك الأهداب لدفع المخاط نحو الرئتين.<\/td><td>خطأ؛ تدفعه نحو الحلق بعيدًا عن الرئتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتعاون نوعا الخلايا الكأسية والهدبية في الحماية؟<\/td><td>الكأسية تحتجز الجسيمات بالمخاط، والهدبية تزيل هذا المخاط؛ فلا تكتمل الحماية بأحدهما دون الآخر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: المادة اللزجة التي تحتجز الجسيمات في المجاري التنفسية هي .........\nالإجابة النموذجية: المخاط.\n\n2) [المستوى المتوقع] صواب أم خطأ: تتحرك الأهداب لدفع المخاط نحو الرئتين.\nالإجابة النموذجية: خطأ؛ تدفعه نحو الحلق بعيدًا عن الرئتين.\n\n3) [المستوى المتقدم] لماذا يتعاون نوعا الخلايا الكأسية والهدبية في الحماية؟\nالإجابة النموذجية: الكأسية تحتجز الجسيمات بالمخاط، والهدبية تزيل هذا المخاط؛ فلا تكتمل الحماية بأحدهما دون الآخر."},{"h":"<p>إكمال تمرين 2-2 في كتاب النشاط ص 23–26، والإجابة عن السؤال 4-2 والأسئلة 1 إلى 6 من أسئلة نهاية الوحدة الثانية.<\/p>","t":"إكمال تمرين 2-2 في كتاب النشاط ص 23–26، والإجابة عن السؤال 4-2 والأسئلة 1 إلى 6 من أسئلة نهاية الوحدة الثانية."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-2 تبادل الغازات في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)، الأسبوع السادس (11–15/10/2026)<\/div><div><b>عدد الحصص:<\/b> 6 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 34–41 | كتاب النشاط: تمرين 1-2 ص 22، تمرين 2-2 ص 23–26<\/div><div><b>دليل المعلم:<\/b> ص 37–38<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تركيب جهاز تبادل الغازات<\/div><ol class=\"ol\"><li>يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها.<\/li><li>يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد التراكيب على نموذج أو رئة حقيقية.<\/div><div class=\"psub\">الحصة 2: خصائص أسطح تبادل الغازات<\/div><ol class=\"ol\"><li>يعدد خصائص أسطح تبادل الغازات في الحويصلات: مساحة سطحية كبيرة، وسطح رقيق، وإمداد جيد بالدم، وتهوية جيدة.<\/li><li>يفسر كيف تزيد كل خاصية سرعة الانتشار.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن أسطح تبادل الغازات في الإنسان بغيره من الكائنات.<\/div><div class=\"psub\">الحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير<\/div><ol class=\"ol\"><li>يذكر الاختلافات بين مكونات هواء الشهيق والزفير من حيث الأكسجين وثاني أكسيد الكربون وبخار الماء.<\/li><li>يفسر سبب هذه الاختلافات بالتنفس الخلوي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقرأ بيانات جدول نسب الغازات ويحسب الفرق بينها.<\/div><div class=\"psub\">الحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير<\/div><ol class=\"ol\"><li>يستخدم ماء الجير للكشف عن ثاني أكسيد الكربون لاستقصاء الاختلاف بين هواء الشهيق والزفير.<\/li><li>يحلل نتائج التجربة ويستنتج منها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد المتغيرات المضبوطة في التجربة.<\/div><div class=\"psub\">الحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه<\/div><ol class=\"ol\"><li>يستقصي تأثيرات النشاط البدني على معدل التنفس وعمقه.<\/li><li>يشرح تلك التأثيرات بزيادة تركيز ثاني أكسيد الكربون في الدم.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين استجابة معدل التنفس ومعدل النبض للتمرين.<\/div><div class=\"psub\">الحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب<\/div><ol class=\"ol\"><li>يشرح دور الخلايا الكأسية والمخاط والخلايا الهدبية في حماية جهاز تبادل الغازات من مسببات الأمراض والجسيمات.<\/li><li>يطبق مفاهيم الدرس في تحليل أسطح تبادل الغازات في جسم الجرذ.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بأثر تلف الأهداب على صحة الجهاز التنفسي.<\/div>","t":"الحصة 1: تركيب جهاز تبادل الغازات\n1. يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها.\n2. يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائية.\nمخرج تعليمي آخر: يحدد التراكيب على نموذج أو رئة حقيقية.\n\nالحصة 2: خصائص أسطح تبادل الغازات\n1. يعدد خصائص أسطح تبادل الغازات في الحويصلات: مساحة سطحية كبيرة، وسطح رقيق، وإمداد جيد بالدم، وتهوية جيدة.\n2. يفسر كيف تزيد كل خاصية سرعة الانتشار.\nمخرج تعليمي آخر: يقارن أسطح تبادل الغازات في الإنسان بغيره من الكائنات.\n\nالحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير\n1. يذكر الاختلافات بين مكونات هواء الشهيق والزفير من حيث الأكسجين وثاني أكسيد الكربون وبخار الماء.\n2. يفسر سبب هذه الاختلافات بالتنفس الخلوي.\nمخرج تعليمي آخر: يقرأ بيانات جدول نسب الغازات ويحسب الفرق بينها.\n\nالحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير\n1. يستخدم ماء الجير للكشف عن ثاني أكسيد الكربون لاستقصاء الاختلاف بين هواء الشهيق والزفير.\n2. يحلل نتائج التجربة ويستنتج منها.\nمخرج تعليمي آخر: يحدد المتغيرات المضبوطة في التجربة.\n\nالحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه\n1. يستقصي تأثيرات النشاط البدني على معدل التنفس وعمقه.\n2. يشرح تلك التأثيرات بزيادة تركيز ثاني أكسيد الكربون في الدم.\nمخرج تعليمي آخر: يقارن بين استجابة معدل التنفس ومعدل النبض للتمرين.\n\nالحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب\n1. يشرح دور الخلايا الكأسية والمخاط والخلايا الهدبية في حماية جهاز تبادل الغازات من مسببات الأمراض والجسيمات.\n2. يطبق مفاهيم الدرس في تحليل أسطح تبادل الغازات في جسم الجرذ.\nمخرج تعليمي آخر: يتنبأ بأثر تلف الأهداب على صحة الجهاز التنفسي."},{"h":"<div class=\"psub\">الحصة 1: تركيب جهاز تبادل الغازات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائي /td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 2-2 مقارنة محتوى ثاني أكسيد الكربون في هواء الشهيق والزفير (كتاب الطالب)<\/td><td>يوجه إلى استخدام جهاز الأنبوبين بحيث يمر هواء الشهيق في أنبوب والزفير في الآخر، مع التنبيه إلى عدم سحب ماء الجير.<\/td><td>يسجلون زمن تعكر ماء الجير في كل أنبوب.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تحليل النتائج<\/td><td>يناقش على السبورة الذكية الفرق في زمن التعكر.<\/td><td>يستنتجون أن الزفير يحتوي ثاني أكسيد كربون أكثر.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">المتغيرات<\/td><td>يناقش ضبط حجم ماء الجير ومدة التنفس.<\/td><td>يحددون المتغيرات.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 3-2 تأثير ممارسة التمارين الرياضية المنتظمة على معدل التنفس وعمقه (كتاب الطالب)<\/td><td>يوجه إلى عد مرات التنفس في الدقيقة في الراحة ثم بعد تمرين خفيف آمن، وملاحظة عمق التنفس.<\/td><td>يسجلون النتائج ويرسمونها بيانيًا.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التفسير (كتاب الطالب ص 39–40)<\/td><td>يوضح على السبورة الذكية أن زيادة التنفس الخلوي ترفع تركيز ثاني أكسيد الكربون في الدم فيستجيب الدماغ بزيادة معدل التنفس وعمقه.<\/td><td>يكتبون سلسلة السبب والنتيجة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون آليات حماية.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الخلايا الكأسية والهدبية (كتاب الطالب ص 40–41)<\/td><td>يعرض على السبورة الذكية صورة مجهرية لبطانة القصبة الهوائية.<\/td><td>يحددون الخلايا الكأسية والهدبية ويصفون عمل كل منها.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">نمذجة السلم المتحرك<\/td><td>يمثل حركة المخاط نحو الحلق بشريط ورقي تحركه أصابع الطلبة.<\/td><td>يفسرون كيف يُنقل المخاط والجسيمات بعيدًا عن الرئتين.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 2-2 أسطح تبادل الغازات في جسم الجرذ (كتاب النشاط ص 23–26)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب جهاز تبادل الغازات\n(5 دقائق) التهيئة\nدور المعلم: يوجه إلى التنفس العميق.\nدور الطالب: يلاحظون ارتفاع القفص الصدري.\n\n(12 دقيقة) أجزاء الجهاز (كتاب الطالب ص 34–35)\nدور المعلم: يعرض على السبورة الذكية مخطط جهاز تبادل الغازات ونموذجًا مجسمًا.\nدور الطالب: يرسمون المخطط ويسمون أجزاءه.\n\n(13 دقيقة) النشاط 1-2 فحص الرئتين (إثرائي)\nدور المعلم: يعرض رئة خروف أو صورها ويوضح الغضاريف الحلقية في القصبة والنسيج الإسفنجي.\nدور الطالب: يحددون التراكيب ويسجلون ملاحظاتهم.\n\n(5 دقائق) مسار الهواء\nدور المعلم: يطلب ترتيب بطاقات المسار.\nدور الطالب: يرتبون: الأنف، الحنجرة، القصبة، الشعب، الشعيبات، الحويصلات.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: خصائص أسطح تبادل الغازات\n(5 دقائق) التهيئة\nدور المعلم: يطرح المعلومة والسؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) الحويصلة الهوائية (كتاب الطالب ص 36–37)\nدور المعلم: يعرض على السبورة الذكية مخطط حويصلة مع شعيرة ويوضح انتشار الأكسجين وثاني أكسيد الكربون.\nدور الطالب: يرسمون اتجاه انتشار الغازين.\n\n(10 دقائق) الخصائص الأربع\nدور المعلم: يربط كل خاصية بسرعة الانتشار وفرق التركيز.\nدور الطالب: يكملون جدولًا: الخاصية، أثرها في الانتشار.\n\n(8 دقائق) تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان (كتاب النشاط ص 22)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير\n(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يلاحظون تكثف بخار الماء.\n\n(12 دقيقة) جدول المقارنة (كتاب الطالب ص 37–38)\nدور المعلم: يعرض على السبورة الذكية جدول النسب: الأكسجين 21% و16%، وثاني أكسيد الكربون 0.04% و4%، وبخار الماء.\nدور الطالب: يحسبون الفروق ويصفونها.\n\n(10 دقائق) التفسير\nدور المعلم: يربط التغيرات بالتنفس الخلوي في الخلايا.\nدور الطالب: يكتبون تفسيرًا لكل تغير.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من المسابقة.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون تجارب.\n\n(17 دقيقة) النشاط 2-2 مقارنة محتوى ثاني أكسيد الكربون في هواء الشهيق والزفير (كتاب الطالب)\nدور المعلم: يوجه إلى استخدام جهاز الأنبوبين بحيث يمر هواء الشهيق في أنبوب والزفير في الآخر، مع التنبيه إلى عدم سحب ماء الجير.\nدور الطالب: يسجلون زمن تعكر ماء الجير في كل أنبوب.\n\n(8 دقائق) تحليل النتائج\nدور المعلم: يناقش على السبورة الذكية الفرق في زمن التعكر.\nدور الطالب: يستنتجون أن الزفير يحتوي ثاني أكسيد كربون أكثر.\n\n(5 دقائق) المتغيرات\nدور المعلم: يناقش ضبط حجم ماء الجير ومدة التنفس.\nدور الطالب: يحددون المتغيرات.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 3-2 تأثير ممارسة التمارين الرياضية المنتظمة على معدل التنفس وعمقه (كتاب الطالب)\nدور المعلم: يوجه إلى عد مرات التنفس في الدقيقة في الراحة ثم بعد تمرين خفيف آمن، وملاحظة عمق التنفس.\nدور الطالب: يسجلون النتائج ويرسمونها بيانيًا.\n\n(8 دقائق) التفسير (كتاب الطالب ص 39–40)\nدور المعلم: يوضح على السبورة الذكية أن زيادة التنفس الخلوي ترفع تركيز ثاني أكسيد الكربون في الدم فيستجيب الدماغ بزيادة معدل التنفس وعمقه.\nدور الطالب: يكتبون سلسلة السبب والنتيجة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص.\nدور الطالب: يدونون.\n\nالحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون آليات حماية.\n\n(12 دقيقة) الخلايا الكأسية والهدبية (كتاب الطالب ص 40–41)\nدور المعلم: يعرض على السبورة الذكية صورة مجهرية لبطانة القصبة الهوائية.\nدور الطالب: يحددون الخلايا الكأسية والهدبية ويصفون عمل كل منها.\n\n(8 دقائق) نمذجة السلم المتحرك\nدور المعلم: يمثل حركة المخاط نحو الحلق بشريط ورقي تحركه أصابع الطلبة.\nدور الطالب: يفسرون كيف يُنقل المخاط والجسيمات بعيدًا عن الرئتين.\n\n(10 دقائق) تمرين 2-2 أسطح تبادل الغازات في جسم الجرذ (كتاب النشاط ص 23–26)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تركيب جهاز تبادل الغازات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أين يحدث تبادل الغازات في الرئتين؟<\/td><td>في الحويصلات الهوائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب مسار الهواء: الشعيبات، القصبة الهوائية، الحويصلات، الشعب.<\/td><td>القصبة الهوائية ← الشعب ← الشعيبات ← الحويصلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تحتوي القصبة الهوائية على حلقات غضروفية؟<\/td><td>لتبقى مفتوحة ولا تنطبق أثناء التنفس.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: خصائص أسطح تبادل الغازات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر خاصيتين لأسطح تبادل الغازات.<\/td><td>مساحة سطحية كبيرة وسطح رقيق (وإمداد جيد بالدم وتهوية جيدة).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>في أي اتجاه ينتشر الأكسجين بين الحويصلة والشعيرة؟<\/td><td>من الحويصلة إلى الدم في الشعيرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يحافظ الإمداد الجيد بالدم على فرق تركيز الأكسجين؟<\/td><td>ينقل الدم الأكسجين بعيدًا باستمرار فيبقى تركيزه في الدم أقل منه في الحويصلة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي الغازين يزداد في هواء الزفير؟<\/td><td>ثاني أكسيد الكربون (وبخار الماء).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نسبة الأكسجين تقريبًا في هواء الشهيق وفي هواء الزفير؟<\/td><td>نحو 21% في الشهيق ونحو 16% في الزفير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتوي هواء الزفير على أكسجين رغم استهلاك الجسم له؟<\/td><td>لأن الجسم لا يمتص كل الأكسجين الداخل، فجزء منه يخرج مع الزفير.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لماء الجير عند مرور ثاني أكسيد الكربون فيه؟<\/td><td>يتعكر (يصبح حليبيًا).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>في أي أنبوب يتعكر ماء الجير أسرع؟<\/td><td>الأنبوب الذي يمر فيه هواء الزفير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر متغيرين يجب ضبطهما في النشاط.<\/td><td>حجم ماء الجير وتركيزه في الأنبوبين، وعدد مرات التنفس أو مدته.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لمعدل التنفس وعمقه أثناء التمرين؟<\/td><td>يزداد كلاهما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المادة التي يؤدي ارتفاع تركيزها في الدم إلى زيادة معدل التنفس؟<\/td><td>ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر استمرار التنفس السريع بعض الوقت بعد التوقف عن التمرين.<\/td><td>لأن تركيز ثاني أكسيد الكربون في الدم يبقى مرتفعًا حتى يُتخلص منه، فيستمر الدماغ في تحفيز التنفس السريع.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الخلايا الكأسية؟<\/td><td>إفراز المخاط الذي يحتجز الغبار ومسببات الأمراض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الأهداب في القصبة الهوائية؟<\/td><td>تتحرك بانتظام لدفع المخاط وما علق به نحو الحلق بعيدًا عن الرئتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع ما يحدث إذا تلفت الأهداب.<\/td><td>يتراكم المخاط في المجاري التنفسية فيزداد السعال وخطر العدوى.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب جهاز تبادل الغازات\n1) [مستوى الدعم] أين يحدث تبادل الغازات في الرئتين؟\nالإجابة النموذجية: في الحويصلات الهوائية.\n\n2) [المستوى المتوقع] رتب مسار الهواء: الشعيبات، القصبة الهوائية، الحويصلات، الشعب.\nالإجابة النموذجية: القصبة الهوائية ← الشعب ← الشعيبات ← الحويصلات.\n\n3) [المستوى المتقدم] لماذا تحتوي القصبة الهوائية على حلقات غضروفية؟\nالإجابة النموذجية: لتبقى مفتوحة ولا تنطبق أثناء التنفس.\n\nالحصة 2: خصائص أسطح تبادل الغازات\n1) [مستوى الدعم] اذكر خاصيتين لأسطح تبادل الغازات.\nالإجابة النموذجية: مساحة سطحية كبيرة وسطح رقيق (وإمداد جيد بالدم وتهوية جيدة).\n\n2) [المستوى المتوقع] في أي اتجاه ينتشر الأكسجين بين الحويصلة والشعيرة؟\nالإجابة النموذجية: من الحويصلة إلى الدم في الشعيرة.\n\n3) [المستوى المتقدم] كيف يحافظ الإمداد الجيد بالدم على فرق تركيز الأكسجين؟\nالإجابة النموذجية: ينقل الدم الأكسجين بعيدًا باستمرار فيبقى تركيزه في الدم أقل منه في الحويصلة.\n\nالحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير\n1) [مستوى الدعم] أي الغازين يزداد في هواء الزفير؟\nالإجابة النموذجية: ثاني أكسيد الكربون (وبخار الماء).\n\n2) [المستوى المتوقع] ما نسبة الأكسجين تقريبًا في هواء الشهيق وفي هواء الزفير؟\nالإجابة النموذجية: نحو 21% في الشهيق ونحو 16% في الزفير.\n\n3) [المستوى المتقدم] لماذا يحتوي هواء الزفير على أكسجين رغم استهلاك الجسم له؟\nالإجابة النموذجية: لأن الجسم لا يمتص كل الأكسجين الداخل، فجزء منه يخرج مع الزفير.\n\nالحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير\n1) [مستوى الدعم] ماذا يحدث لماء الجير عند مرور ثاني أكسيد الكربون فيه؟\nالإجابة النموذجية: يتعكر (يصبح حليبيًا).\n\n2) [المستوى المتوقع] في أي أنبوب يتعكر ماء الجير أسرع؟\nالإجابة النموذجية: الأنبوب الذي يمر فيه هواء الزفير.\n\n3) [المستوى المتقدم] اذكر متغيرين يجب ضبطهما في النشاط.\nالإجابة النموذجية: حجم ماء الجير وتركيزه في الأنبوبين، وعدد مرات التنفس أو مدته.\n\nالحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه\n1) [مستوى الدعم] ماذا يحدث لمعدل التنفس وعمقه أثناء التمرين؟\nالإجابة النموذجية: يزداد كلاهما.\n\n2) [المستوى المتوقع] ما المادة التي يؤدي ارتفاع تركيزها في الدم إلى زيادة معدل التنفس؟\nالإجابة النموذجية: ثاني أكسيد الكربون.\n\n3) [المستوى المتقدم] فسّر استمرار التنفس السريع بعض الوقت بعد التوقف عن التمرين.\nالإجابة النموذجية: لأن تركيز ثاني أكسيد الكربون في الدم يبقى مرتفعًا حتى يُتخلص منه، فيستمر الدماغ في تحفيز التنفس السريع.\n\nالحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب\n1) [مستوى الدعم] ما وظيفة الخلايا الكأسية؟\nالإجابة النموذجية: إفراز المخاط الذي يحتجز الغبار ومسببات الأمراض.\n\n2) [المستوى المتوقع] ما وظيفة الأهداب في القصبة الهوائية؟\nالإجابة النموذجية: تتحرك بانتظام لدفع المخاط وما علق به نحو الحلق بعيدًا عن الرئتين.\n\n3) [المستوى المتقدم] توقع ما يحدث إذا تلفت الأهداب.\nالإجابة النموذجية: يتراكم المخاط في المجاري التنفسية فيزداد السعال وخطر العدوى."},{"h":"<div class=\"psub\">الحصة 1: تركيب جهاز تبادل الغازات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: العضلة التي تفصل التجويف الصدري عن البطني هي .........<\/td><td>الحجاب الحاجز.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العضلات الموجودة بين الضلوع؟<\/td><td>العضلات الوربية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يبدو نسيج الرئة إسفنجيًا؟<\/td><td>لاحتوائه على أعداد هائلة من الحويصلات الهوائية المملوءة بالهواء.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: خصائص أسطح تبادل الغازات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ينتقل الأكسجين من الحويصلة إلى الدم بعملية .........<\/td><td>الانتشار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: جدار الحويصلة الهوائية سميك لحمايتها.<\/td><td>خطأ؛ رقيق لتقصير مسافة الانتشار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لكفاءة تبادل الغازات إذا تهدمت جدران كثير من الحويصلات؟ ولماذا؟<\/td><td>تقل؛ لأن المساحة السطحية للتبادل تنقص.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: نسبة النيتروجين تتغير كثيرًا بين الشهيق والزفير.<\/td><td>خطأ؛ تبقى تقريبًا ثابتة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما مصدر ثاني أكسيد الكربون الزائد في هواء الزفير؟<\/td><td>التنفس الخلوي في خلايا الجسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نسبة ثاني أكسيد الكربون في الشهيق 0.04% وفي الزفير 4%. كم مرة تضاعفت؟<\/td><td>نحو 100 مرة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يُستخدم ......... للكشف عن ثاني أكسيد الكربون.<\/td><td>ماء الجير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يتعكر ماء الجير في أنبوب الشهيق أيضًا ولكن ببطء؟<\/td><td>لأن هواء الشهيق يحتوي كمية قليلة من ثاني أكسيد الكربون (0.04%).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يجب الانتباه عند التنفس في الجهاز؟<\/td><td>حتى لا يسحب الطالب ماء الجير إلى فمه؛ فيجب التنفس بهدوء ومن الأنبوب الصحيح.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يزداد عمق التنفس أثناء التمرين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما فائدة زيادة معدل التنفس أثناء التمرين؟<\/td><td>إدخال مزيد من الأكسجين والتخلص من ثاني أكسيد الكربون بسرعة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح سببًا لكون معدل تنفس الرياضي المتدرب في الراحة أقل من غيره.<\/td><td>رئتاه وعضلاته التنفسية أكفأ، فيحصل على الأكسجين اللازم بعدد أقل من مرات التنفس.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المادة اللزجة التي تحتجز الجسيمات في المجاري التنفسية هي .........<\/td><td>المخاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تتحرك الأهداب لدفع المخاط نحو الرئتين.<\/td><td>خطأ؛ تدفعه نحو الحلق بعيدًا عن الرئتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يتعاون نوعا الخلايا الكأسية والهدبية في الحماية؟<\/td><td>الكأسية تحتجز الجسيمات بالمخاط، والهدبية تزيل هذا المخاط؛ فلا تكتمل الحماية بأحدهما دون الآخر.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب جهاز تبادل الغازات\n1) [مستوى الدعم] أكمل: العضلة التي تفصل التجويف الصدري عن البطني هي .........\nالإجابة النموذجية: الحجاب الحاجز.\n\n2) [المستوى المتوقع] ما العضلات الموجودة بين الضلوع؟\nالإجابة النموذجية: العضلات الوربية.\n\n3) [المستوى المتقدم] لماذا يبدو نسيج الرئة إسفنجيًا؟\nالإجابة النموذجية: لاحتوائه على أعداد هائلة من الحويصلات الهوائية المملوءة بالهواء.\n\nالحصة 2: خصائص أسطح تبادل الغازات\n1) [مستوى الدعم] أكمل: ينتقل الأكسجين من الحويصلة إلى الدم بعملية .........\nالإجابة النموذجية: الانتشار.\n\n2) [المستوى المتوقع] صواب أم خطأ: جدار الحويصلة الهوائية سميك لحمايتها.\nالإجابة النموذجية: خطأ؛ رقيق لتقصير مسافة الانتشار.\n\n3) [المستوى المتقدم] ماذا يحدث لكفاءة تبادل الغازات إذا تهدمت جدران كثير من الحويصلات؟ ولماذا؟\nالإجابة النموذجية: تقل؛ لأن المساحة السطحية للتبادل تنقص.\n\nالحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير\n1) [مستوى الدعم] صواب أم خطأ: نسبة النيتروجين تتغير كثيرًا بين الشهيق والزفير.\nالإجابة النموذجية: خطأ؛ تبقى تقريبًا ثابتة.\n\n2) [المستوى المتوقع] ما مصدر ثاني أكسيد الكربون الزائد في هواء الزفير؟\nالإجابة النموذجية: التنفس الخلوي في خلايا الجسم.\n\n3) [المستوى المتقدم] نسبة ثاني أكسيد الكربون في الشهيق 0.04% وفي الزفير 4%. كم مرة تضاعفت؟\nالإجابة النموذجية: نحو 100 مرة.\n\nالحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير\n1) [مستوى الدعم] أكمل: يُستخدم ......... للكشف عن ثاني أكسيد الكربون.\nالإجابة النموذجية: ماء الجير.\n\n2) [المستوى المتوقع] لماذا يتعكر ماء الجير في أنبوب الشهيق أيضًا ولكن ببطء؟\nالإجابة النموذجية: لأن هواء الشهيق يحتوي كمية قليلة من ثاني أكسيد الكربون (0.04%).\n\n3) [المستوى المتقدم] لماذا يجب الانتباه عند التنفس في الجهاز؟\nالإجابة النموذجية: حتى لا يسحب الطالب ماء الجير إلى فمه؛ فيجب التنفس بهدوء ومن الأنبوب الصحيح.\n\nالحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه\n1) [مستوى الدعم] صواب أم خطأ: يزداد عمق التنفس أثناء التمرين.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما فائدة زيادة معدل التنفس أثناء التمرين؟\nالإجابة النموذجية: إدخال مزيد من الأكسجين والتخلص من ثاني أكسيد الكربون بسرعة.\n\n3) [المستوى المتقدم] اقترح سببًا لكون معدل تنفس الرياضي المتدرب في الراحة أقل من غيره.\nالإجابة النموذجية: رئتاه وعضلاته التنفسية أكفأ، فيحصل على الأكسجين اللازم بعدد أقل من مرات التنفس.\n\nالحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب\n1) [مستوى الدعم] أكمل: المادة اللزجة التي تحتجز الجسيمات في المجاري التنفسية هي .........\nالإجابة النموذجية: المخاط.\n\n2) [المستوى المتوقع] صواب أم خطأ: تتحرك الأهداب لدفع المخاط نحو الرئتين.\nالإجابة النموذجية: خطأ؛ تدفعه نحو الحلق بعيدًا عن الرئتين.\n\n3) [المستوى المتقدم] لماذا يتعاون نوعا الخلايا الكأسية والهدبية في الحماية؟\nالإجابة النموذجية: الكأسية تحتجز الجسيمات بالمخاط، والهدبية تزيل هذا المخاط؛ فلا تكتمل الحماية بأحدهما دون الآخر."},{"h":"<div class=\"psub\">الحصة 1: تركيب جهاز تبادل الغازات<\/div><p>مراجعة كتاب الطالب ص 34–35 ورسم مخطط جهاز تبادل الغازات مع تسمية أجزائه.<\/p><div class=\"psub\">الحصة 2: خصائص أسطح تبادل الغازات<\/div><p>حل تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان في كتاب النشاط ص 22، والإجابة عن السؤال 1-2.<\/p><div class=\"psub\">الحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير<\/div><p>مراجعة كتاب الطالب ص 37–38 والإجابة عن السؤال 2-2، وإعداد جدول مقارنة بين هواء الشهيق والزفير.<\/p><div class=\"psub\">الحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير<\/div><p>كتابة تقرير النشاط 2-2، ومراجعة كتاب الطالب ص 38–39.<\/p><div class=\"psub\">الحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه<\/div><p>مراجعة كتاب الطالب ص 39–40 والإجابة عن السؤال 3-2، وتسجيل معدل التنفس قبل نشاط رياضي منزلي آمن وبعده.<\/p><div class=\"psub\">الحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب<\/div><p>إكمال تمرين 2-2 في كتاب النشاط ص 23–26، والإجابة عن السؤال 4-2 والأسئلة 1 إلى 6 من أسئلة نهاية الوحدة الثانية.<\/p>","t":"الحصة 1: تركيب جهاز تبادل الغازات\nمراجعة كتاب الطالب ص 34–35 ورسم مخطط جهاز تبادل الغازات مع تسمية أجزائه.\n\nالحصة 2: خصائص أسطح تبادل الغازات\nحل تمرين 1-2 أسطح تبادل الغازات في جسم الإنسان في كتاب النشاط ص 22، والإجابة عن السؤال 1-2.\n\nالحصة 3: الاختلاف بين هواء الشهيق وهواء الزفير\nمراجعة كتاب الطالب ص 37–38 والإجابة عن السؤال 2-2، وإعداد جدول مقارنة بين هواء الشهيق والزفير.\n\nالحصة 4: استقصاء ثاني أكسيد الكربون في الشهيق والزفير بماء الجير\nكتابة تقرير النشاط 2-2، ومراجعة كتاب الطالب ص 38–39.\n\nالحصة 5: تأثير النشاط البدني على معدل التنفس وعمقه\nمراجعة كتاب الطالب ص 39–40 والإجابة عن السؤال 3-2، وتسجيل معدل التنفس قبل نشاط رياضي منزلي آمن وبعده.\n\nالحصة 6: حماية جهاز تبادل الغازات: الخلايا الكأسية والأهداب\nإكمال تمرين 2-2 في كتاب النشاط ص 23–26، والإجابة عن السؤال 4-2 والأسئلة 1 إلى 6 من أسئلة نهاية الوحدة الثانية."}]}},{"label":"2-2 تدخين التبغ","unit":"الوحدة الثانية: تبادل الغازات","periods":[{"n":1,"focus":"مكونات دخان التبغ السامة","info":"<div><b>الدرس:<\/b> 2-2 تدخين التبغ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–51 | كتاب النشاط: ورقة العمل 1-2 ص 27، ورقة العمل 2-2 ص 28–29<\/div><div><b>دليل المعلم:<\/b> ص 39<\/div><div><b>محور الحصة:<\/b> مكونات دخان التبغ السامة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد المكونات السامة الرئيسة في دخان التبغ: أول أكسيد الكربون والنيكوتين والقطران.<\/li><li>يصف خصائص كل مكون منها بإيجاز.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصنف المكونات حسب الجهاز أو العضو الذي تؤثر فيه.<\/div>","t":"1. يحدد المكونات السامة الرئيسة في دخان التبغ: أول أكسيد الكربون والنيكوتين والقطران.\n2. يصف خصائص كل مكون منها بإيجاز.\nمخرج تعليمي آخر: يصنف المكونات حسب الجهاز أو العضو الذي تؤثر فيه."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد المكونات السامة الرئيسة في دخان التبغ: أول أكسيد الكربون والنيكوتين والقطران.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف خصائص كل مكون منها بإيجاز.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصنف المكونات حسب الجهاز أو العضو الذي تؤثر فيه.<\/td><td class=  التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) مكونات الدخان (كتاب الطالب ص 42–44)\nدور المعلم: يعرض مقطعًا تعليميًا عن تجربة «الآلة المدخنة» وتراكم القطران على القطن.\nدور الطالب: يدونون المكونات الثلاثة وخصائصها.\n\n(13 دقيقة) بطاقات الخبراء\nدور المعلم: يقسم الطلبة إلى ثلاث مجموعات: أول أكسيد الكربون، والنيكوتين، والقطران.\nدور الطالب: تعد كل مجموعة بطاقة: المادة، طبيعتها، أين تؤثر.\n\n(5 دقائق) عرض البطاقات\nدور المعلم: يدير العرض.\nدور الطالب: يعرضون بطاقاتهم.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاث مواد سامة في دخان التبغ.<\/td><td>أول أكسيد الكربون، والنيكوتين، والقطران.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي مكونات الدخان يسبب الإدمان؟<\/td><td>النيكوتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تبدو رئة المدخن داكنة اللون؟<\/td><td>بسبب تراكم القطران في أنسجة الرئتين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ثلاث مواد سامة في دخان التبغ.\nالإجابة النموذجية: أول أكسيد الكربون، والنيكوتين، والقطران.\n\n2) [المستوى المتوقع] أي مكونات الدخان يسبب الإدمان؟\nالإجابة النموذجية: النيكوتين.\n\n3) [المستوى المتقدم] لماذا تبدو رئة المدخن داكنة اللون؟\nالإجابة النموذجية: بسبب تراكم القطران في أنسجة الرئتين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المادة اللزجة السوداء في دخان التبغ هي .........<\/td><td>القطران.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: أول أكسيد الكربون غاز له لون ورائحة واضحان.<\/td><td>خطأ؛ عديم اللون والرائحة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يصعب على المدخن الإقلاع عن التدخين؟<\/td><td>لأن النيكوتين مادة تسبب الإدمان.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: المادة اللزجة السوداء في دخان التبغ هي .........\nالإجابة النموذجية: القطران.\n\n2) [المستوى المتوقع] صواب أم خطأ: أول أكسيد الكربون غاز له لون ورائحة واضحان.\nالإجابة النموذجية: خطأ؛ عديم اللون والرائحة.\n\n3) [المستوى المتقدم] لماذا يصعب على المدخن الإقلاع عن التدخين؟\nالإجابة النموذجية: لأن النيكوتين مادة تسبب الإدمان."},{"h":"<p>مراجعة كتاب الطالب ص 42–44، والبحث عن مخاطر التدخين السلبي ومناقشتها مع ولي الأمر.<\/p>","t":"مراجعة كتاب الطالب ص 42–44، والبحث عن مخاطر التدخين السلبي ومناقشتها مع ولي الأمر."}]},{"n":2,"focus":"أثر أول أكسيد الكربون والنيكوتين في الدم والقلب","info":"<div><b>الدرس:<\/b> 2-2 تدخين التبغ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–51 | كتاب النشاط: ورقة العمل 1-2 ص 27، ورقة العمل 2-2 ص 28–29<\/div><div><b>دليل المعلم:<\/b> ص 39<\/div><div><b>محور الحصة:<\/b> أثر أول أكسيد الكربون والنيكوتين في الدم والقلب<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف أثر أول أكسيد الكربون في قدرة الدم على نقل الأكسجين.<\/li><li>يصف أثر النيكوتين في القلب والأوعية الدموية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط أثر هذين المكونين بزيادة خطر مرض القلب التاجي.<\/div>","t":"1. يصف أثر أول أكسيد الكربون في قدرة الدم على نقل الأكسجين.\n2. يصف أثر النيكوتين في القلب والأوعية الدموية.\nمخرج تعليمي آخر: يربط أثر هذين المكونين بزيادة خطر مرض القلب التاجي."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف أثر أول أكسيد الكربون في قدرة الدم على نقل الأكسجين.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف أثر النيكوتين في القلب والأوعية الدموية.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يربط أثر هذين المكونين بزيادة خطر مرض القلب التاجي.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف أثر أول أكسيد الكربون في قدرة الدم على نقل الأكسجين. ← فهم\n• يصف أثر النيكوتين في القلب والأوعية الدموية. ← فهم\n• يربط أثر هذين المكونين بزيادة خطر مرض القلب التاجي. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الأقلام"},{"h":"<div class=\"pills\"><span>الهيموجلوبين<\/span><span>أول أكسيد الكربون<\/span><span>النيكوتين<\/span><span>ضغط الدم<\/span><span>معدل ضربات القلب<\/span><\/div>","t":"الهيموجلوبين، أول أكسيد الكربون، النيكوتين، ضغط الدم، معدل ضربات القلب"},{"h":"<p>سؤال: لماذا يشعر المدخن بضيق النفس عند صعود الدرج أسرع من غيره؟<\/p>","t":"سؤال: لماذا يشعر المدخن بضيق النفس عند صعود الدرج أسرع من غيره؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">أول أكسيد الكربون (كتاب الطالب ص 44–45)<\/td><td>يوضح على السبورة الذكية ارتباط أول أكسيد الكربون بالهيموجلوبين بقوة فيقل ما يُنقل من الأكسجين.<\/td><td>يرسمون مخططًا لخلية دم حمراء مع الأكسجين وأول أكسيد الكربون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">النيكوتين<\/td><td>يشرح أن النيكوتين يرفع معدل ضربات القلب وضغط الدم ويضيق الأوعية.<\/td><td>يربطون ذلك بإجهاد القلب.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">ورقة العمل 1-2 تدخين السجائر (كتاب النشاط ص 27)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) أول أكسيد الكربون (كتاب الطالب ص 44–45)\nدور المعلم: يوضح على السبورة الذكية ارتباط أول أكسيد الكربون بالهيموجلوبين بقوة فيقل ما يُنقل من الأكسجين.\nدور الطالب: يرسمون مخططًا لخلية دم حمراء مع الأكسجين وأول أكسيد الكربون.\n\n(10 دقائق) النيكوتين\nدور المعلم: يشرح أن النيكوتين يرفع معدل ضربات القلب وضغط الدم ويضيق الأوعية.\nدور الطالب: يربطون ذلك بإجهاد القلب.\n\n(7 دقائق) ورقة العمل 1-2 تدخين السجائر (كتاب النشاط ص 27)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف يؤثر أول أكسيد الكربون في نقل الأكسجين؟<\/td><td>يرتبط بالهيموجلوبين فيقلل كمية الأكسجين التي ينقلها الدم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما أثر النيكوتين في معدل ضربات القلب؟<\/td><td>يزيده.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر ارتباط التدخين بزيادة خطر مرض القلب التاجي.<\/td><td>النيكوتين يرفع ضغط الدم ويضيق الأوعية، وأول أكسيد الكربون يقلل الأكسجين، فيُجهد القلب وتتضرر الشرايين التاجية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] كيف يؤثر أول أكسيد الكربون في نقل الأكسجين؟\nالإجابة النموذجية: يرتبط بالهيموجلوبين فيقلل كمية الأكسجين التي ينقلها الدم.\n\n2) [المستوى المتوقع] ما أثر النيكوتين في معدل ضربات القلب؟\nالإجابة النموذجية: يزيده.\n\n3) [المستوى المتقدم] فسّر ارتباط التدخين بزيادة خطر مرض القلب التاجي.\nالإجابة النموذجية: النيكوتين يرفع ضغط الدم ويضيق الأوعية، وأول أكسيد الكربون يقلل الأكسجين، فيُجهد القلب وتتضرر الشرايين التاجية."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يرتبط أول أكسيد الكربون بـ ......... في خلايا الدم الحمراء.<\/td><td>الهيموجلوبين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يتعب المدخن بسرعة عند ممارسة الرياضة؟<\/td><td>لأن دمه ينقل أكسجينًا أقل إلى العضلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد تدخين الحامل خطرًا على الجنين؟<\/td><td>لأن أول أكسيد الكربون يقلل الأكسجين الواصل إلى الجنين، ويمكن أن تعبر بعض المواد كالنيكوتين المشيمة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يرتبط أول أكسيد الكربون بـ ......... في خلايا الدم الحمراء.\nالإجابة النموذجية: الهيموجلوبين.\n\n2) [المستوى المتوقع] لماذا يتعب المدخن بسرعة عند ممارسة الرياضة؟\nالإجابة النموذجية: لأن دمه ينقل أكسجينًا أقل إلى العضلات.\n\n3) [المستوى المتقدم] لماذا يُعد تدخين الحامل خطرًا على الجنين؟\nالإجابة النموذجية: لأن أول أكسيد الكربون يقلل الأكسجين الواصل إلى الجنين، ويمكن أن تعبر بعض المواد كالنيكوتين المشيمة."},{"h":"<p>إكمال ورقة العمل 1-2 تدخين السجائر في كتاب النشاط ص 27، ومراجعة كتاب الطالب ص 44–45.<\/p>","t":"إكمال ورقة العمل 1-2 تدخين السجائر في كتاب النشاط ص 27، ومراجعة كتاب الطالب ص 44–45."}]},{"n":3,"focus":"القطران وأثره في الأهداب والإصابة بالسرطان","info":"<div><b>الدرس:<\/b> 2-2 تدخين التبغ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–51 | كتاب النشاط: ورقة العمل 1-2 ص 27، ورقة العمل 2-2 ص 28–29<\/div><div><b>دليل المعلم:<\/b> ص 39<\/div><div><b>محور الحصة:<\/b> القطران وأثره في الأهداب والإصابة بالسرطان<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف أثر القطران في الأهداب والمجاري التنفسية.<\/li><li>يحدد أن تدخين التبغ قد يسبب سرطان الرئة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سعال المدخن الصباحي.<\/div>","t":"1. يصف أثر القطران في الأهداب والمجاري التنفسية.\n2. يحدد أن تدخين التبغ قد يسبب سرطان الرئة.\nمخرج تعليمي آخر: يفسر سعال المدخن الصباحي."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف أثر القطران في الأهداب والمجاري التنفسية.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><t \/td><td>يعرض حالة مريض مدخن يعاني ضيق تنفس مزمنًا.<\/td><td>يحللون الأعراض ويقترحون نصائح.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض النموذج.\nدور الطالب: يستنتجون أن البالونات الصغيرة الكثيرة أكبر مساحة.\n\n(12 دقيقة) المرض وأثره (كتاب الطالب ص 46–48)\nدور المعلم: يعرض على السبورة الذكية صورتين لنسيج رئة سليم وآخر مصاب.\nدور الطالب: يصفون تهدم الجدران وتكوّن فراغات كبيرة.\n\n(10 دقائق) الربط بتبادل الغازات\nدور المعلم: يوجه إلى الربط بخصائص أسطح التبادل.\nدور الطالب: يستنتجون نقص الأكسجين وضيق التنفس.\n\n(8 دقائق) دراسة حالة\nدور المعلم: يعرض حالة مريض مدخن يعاني ضيق تنفس مزمنًا.\nدور الطالب: يحللون الأعراض ويقترحون نصائح.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المرض الذي يسبب تهدم جدران الحويصلات لدى المدخنين؟<\/td><td>مرض الانسداد الرئوي المزمن.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يحدث للمساحة السطحية لتبادل الغازات عند تهدم جدران الحويصلات؟<\/td><td>تقل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يعاني مريض الانسداد الرئوي المزمن ضيق التنفس حتى عند المجهود البسيط؟<\/td><td>لأن نقص المساحة السطحية وانسداد المجاري يقللان الأكسجين الواصل إلى الدم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المرض الذي يسبب تهدم جدران الحويصلات لدى المدخنين؟\nالإجابة النموذجية: مرض الانسداد الرئوي المزمن.\n\n2) [المستوى المتوقع] ماذا يحدث للمساحة السطحية لتبادل الغازات عند تهدم جدران الحويصلات؟\nالإجابة النموذجية: تقل.\n\n3) [المستوى المتقدم] لماذا يعاني مريض الانسداد الرئوي المزمن ضيق التنفس حتى عند المجهود البسيط؟\nالإجابة النموذجية: لأن نقص المساحة السطحية وانسداد المجاري يقللان الأكسجين الواصل إلى الدم."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة يانات وتحليلها.<\/td><td>يرسمون البيانات ويصفون العلاقة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الارتباط والسببية<\/td><td>يناقش الأدلة العلمية التي أثبتت أن التدخين سبب لا مجرد ارتباط.<\/td><td>يقيّمون عبارات مقترحة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤال 7 من أسئلة نهاية الوحدة<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الرسم على السبورة الذكية.\nدور الطالب: يصفون الاتجاه.\n\n(15 دقيقة) ورقة العمل 2-2 تدخين السجائر وسرطان الرئة (كتاب النشاط ص 28–29)\nدور المعلم: يوجه إلى تمثيل البيانات وتحليلها.\nدور الطالب: يرسمون البيانات ويصفون العلاقة.\n\n(10 دقائق) الارتباط والسببية\nدور المعلم: يناقش الأدلة العلمية التي أثبتت أن التدخين سبب لا مجرد ارتباط.\nدور الطالب: يقيّمون عبارات مقترحة.\n\n(5 دقائق) السؤال 7 من أسئلة نهاية الوحدة\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما العلاقة بين عدد السجائر اليومية وخطر سرطان الرئة؟<\/td><td>كلما زاد عدد السجائر زاد خطر الإصابة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الفرق بين الارتباط والسببية؟<\/td><td>الارتباط تغير متغيرين معًا، والسببية أن تغير أحدهما يسبب تغير الآخر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُصاب بعض غير المدخنين بسرطان الرئة؟<\/td><td>لوجود عوامل أخرى مثل التدخين السلبي والتلوث والعوامل الوراثية؛ فالتدخين يزيد الخطر ولا يفسر كل الحالات.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما العلاقة بين عدد السجائر اليومية وخطر سرطان الرئة؟\nالإجابة النموذجية: كلما زاد عدد السجائر زاد خطر الإصابة.\n\n2) [المستوى المتوقع] ما الفرق بين الارتباط والسببية؟\nالإجابة النموذجية: الارتباط تغير متغيرين معًا، والسببية أن تغير أحدهما يسبب تغير الآخر.\n\n3) [المستوى المتقدم] لماذا يُصاب بعض غير المدخنين بسرطان الرئة؟\nالإجابة النموذجية: لوجود عوامل أخرى مثل التدخين السلبي والتلوث والعوامل الوراثية؛ فالتدخين يزيد الخطر ولا يفسر كل الحالات."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يقل خطر الإصابة بسرطان الرئة بعد الإقلاع عن التدخين مع مرور السنين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نوع الرسم الأنسب لتمثيل عدد السجائر مقابل نسبة الإصابة؟<\/td><td>رسم بياني خطي أو أعمدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قيّم العبارة: «جدي دخن طوال حياته ولم يصب بالسرطان، إذن التدخين غير ضار».<\/td><td>عبارة خاطئة؛ الحالة الفردية لا تنفي النتائج الإحصائية التي تثبت زيادة الخطر لدى المدخنين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يقل خطر الإصابة بسرطان الرئة بعد الإقلاع عن التدخين مع مرور السنين.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما نوع الرسم الأنسب لتمثيل عدد السجائر مقابل نسبة الإصابة؟\nالإجابة النموذجية: رسم بياني خطي أو أعمدة.\n\n3) [المستوى المتقدم] قيّم العبارة: «جدي دخن طوال حياته ولم يصب بالسرطان، إذن التدخين غير ضار».\nالإجابة النموذجية: عبارة خاطئة؛ الحالة الفردية لا تنفي النتائج الإحصائية التي تثبت زيادة الخطر لدى المدخنين."},{"h":"<p>إكمال ورقة العمل 2-2 في كتاب النشاط ص 28–29، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الثانية.<\/p>","t":"إكمال ورقة العمل 2-2 في كتاب النشاط ص 28–29، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الثانية."}]},{"n":6,"focus":"حملة توعية ومراجعة الوحدة الثانية","info":"<div><b>الدرس:<\/b> 2-2 تدخين التبغ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 6 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–51 | كتاب النشاط: ورقة العمل 1-2 ص 27، ورقة العمل 2-2 ص 28–29<\/div><div><b>دليل المعلم:<\/b> ص 39<\/div><div><b>محور الحصة  توعويًا ضد التدخين ويسأل: ما الذي يجعل الرسالة مؤثرة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الإعلان على السبورة الذكية.<\/td><td>يحددون عناصر التأثير.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">مشروع مصغر: ملصق توعوي<\/td><td>يكلف كل مجموعة بملصق يربط مكونًا من مكونات الدخان بمرض.<\/td><td>يصممون الملصق بمعلومات علمية دقيقة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الثانية (السؤال 8 – كتاب الطالب ص 51)<\/td><td>يتابع الحل.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الإعلان على السبورة الذكية.\nدور الطالب: يحددون عناصر التأثير.\n\n(13 دقيقة) مشروع مصغر: ملصق توعوي\nدور المعلم: يكلف كل مجموعة بملصق يربط مكونًا من مكونات الدخان بمرض.\nدور الطالب: يصممون الملصق بمعلومات علمية دقيقة.\n\n(10 دقائق) أسئلة نهاية الوحدة الثانية (السؤال 8 – كتاب الطالب ص 51)\nدور المعلم: يتابع الحل.\nدور الطالب: يحلون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة أمراض يسببها التدخين.<\/td><td>سرطان الرئة، ومرض الانسداد الرئوي المزمن، ومرض القلب التاجي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اربط كل مكون بأثره: أول أكسيد الكربون، النيكوتين، القطران.<\/td><td>أول أكسيد الكربون يقلل نقل الأكسجين، والنيكوتين يسبب الإدمان ويرفع ضغط الدم، والقطران يتلف الأهداب ويسبب السرطان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم عبارة توعوية قصيرة دقيقة علميًا عن التدخين.<\/td><td>مثال: «القطران يشل أهداب رئتيك فيبقى الغبار والميكروبات فيها».<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ثلاثة أمراض يسببها التدخين.\nالإجابة النموذجية: سرطان الرئة، ومرض الانسداد الرئوي المزمن، ومرض القلب التاجي.\n\n2) [المستوى المتوقع] اربط كل مكون بأثره: أول أكسيد الكربون، النيكوتين، القطران.\nالإجابة النموذجية: أول أكسيد الكربون يقلل نقل الأكسجين، والنيكوتين يسبب الإدمان ويرفع ضغط الدم، والقطران يتلف الأهداب ويسبب السرطان.\n\n3) [المستوى المتقدم] صمم عبارة توعوية قصيرة دقيقة علميًا عن التدخين.\nالإجابة النموذجية: مثال: «القطران يشل أهداب رئتيك فيبقى الغبار والميكروبات فيها»."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحدث عملية تبادل الغازات في .........<\/td><td>الحويصلات الهوائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يحمي المجاري التنفسية من الغبار؟<\/td><td>المخاط الذي تفرزه الخلايا الكأسية والأهداب التي تدفعه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التدخين ضارًا بجهاز تبادل الغازات وجهاز النقل معًا؟<\/td><td>لأنه يتلف الحويصلات والأهداب ويقلل كفاءة تبادل الغازات، ويقلل نقل الأكسجين بالدم ويضر القلب والشرايين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تحدث عملية تبادل الغازات في .........\nالإجابة النموذجية: الحويصلات الهوائية.\n\n2) [المستوى المتوقع] ما الذي يحمي المجاري التنفسية من الغبار؟\nالإجابة النموذجية: المخاط الذي تفرزه الخلايا الكأسية والأهداب التي تدفعه.\n\n3) [المستوى المتقدم] لماذا يُعد التدخين ضارًا بجهاز تبادل الغازات وجهاز النقل معًا؟\nالإجابة النموذجية: لأنه يتلف الحويصلات والأهداب ويقلل كفاءة تبادل الغازات، ويقلل نقل الأكسجين بالدم ويضر القلب والشرايين."},{"h":"<p>إكمال الملصق التوعوي وعرضه في المدرسة، والإجابة عن السؤال 8 من أسئلة نهاية الوحدة الثانية، والاستعداد للوحدة الثالثة: التكاثر في النبات (ص 52).<\/p>","t":"إكمال الملصق التوعوي وعرضه في المدرسة، والإجابة عن السؤال 8 من أسئلة نهاية الوحدة الثانية، والاستعداد للوحدة الثالثة: التكاثر في النبات (ص 52)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-2 تدخين التبغ<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)، الأسبوع الثامن (25–29/10/2026)<\/div><div><b>عدد الحصص:<\/b> 6 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 42–51 | كتاب النشاط: ورقة العمل 1-2 ص 27، ورقة العمل 2-2 ص 28–29<\/div><div><b>دليل المعلم:<\/b> ص 39<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><ol class=\"ol\"><li>يحدد المكونات السامة الرئيسة في دخان التبغ: أول أكسيد الكربون والنيكوتين والقطران.<\/li><li>يصف خصائص كل مكون منها بإيجاز.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصنف المكونات حسب الجهاز أو العضو الذي تؤثر فيه.<\/div><div class=\"psub\">الحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب<\/div><ol class=\"ol\"><li>يصف أثر أول أكسيد الكربون في قدرة الدم على نقل الأكسجين.<\/li><li>يصف أثر النيكوتين في القلب والأوعية الدموية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط أثر هذين المكونين بزيادة خطر مرض القلب التاجي.<\/div><div class=\"psub\">الحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان<\/div><ol class=\"ol\"><li>يصف أثر القطران في الأهداب والمجاري التنفسية.<\/li><li>يحدد أن تدخين التبغ قد يسبب سرطان الرئة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سعال المدخن الصباحي.<\/div><div class=\"psub\">الحصة 4: مرض الانسداد الرئوي المزمن<\/div><ol class=\"ol\"><li>يحدد أن تدخين التبغ قد يسبب مرض الانسداد الرئوي المزمن.<\/li><li>يصف أثر المرض في الحويصلات والمجاري الهوائية وتبادل الغازات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط تهدم جدران الحويصلات بنقص المساحة السطحية.<\/div><div class=\"psub\">الحصة 5: تحليل بيانات التدخين وسرطان الرئة<\/div><ol class=\"ol\"><li>يحلل بيانات العلاقة بين عدد السجائر والإصابة بسرطان الرئة.<\/li><li>يميز بين الارتباط والسببية في بيانات صحية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يمثل البيانات بيانيًا ويستخلص منها استنتاجًا.<\/div><div class=\"psub\">الحصة 6: حملة توعية ومراجعة الوحدة الثانية<\/div><ol class=\"ol\"><li>يطبق مفاهيم تبادل الغازات وأضرار التدخين في حل أسئلة نهاية الوحدة.<\/li><li>يصمم رسالة توعوية علمية عن أضرار التدخين.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم الرسائل التوعوية لزملائه من حيث الدقة العلمية والتأثير.<\/div>","t":"الحصة 1: مكونات دخان التبغ السامة\n1. يحدد المكونات السامة الرئيسة في دخان التبغ: أول أكسيد الكربون والنيكوتين والقطران.\n2. يصف خصائص كل مكون منها بإيجاز.\nمخرج تعليمي آخر: يصنف المكونات حسب الجهاز أو العضو الذي تؤثر فيه.\n\nالحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب\n1. يصف أثر أول أكسيد الكربون في قدرة الدم على نقل الأكسجين.\n2. يصف أثر النيكوتين في القلب والأوعية الدموية.\nمخرج تعليمي آخر: يربط أثر هذين المكونين بزيادة خطر مرض القلب التاجي.\n\nالحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان\n1. يصف أثر القطران في الأهداب والمجاري التنفسية.\n2. يحدد أن تدخين التبغ قد يسبب سرطان الرئة.\nمخرج تعليمي آخر: يفسر سعال المدخن الصباحي.\n\nالحصة 4: مرض الانسداد الرئوي المزمن\n1. يحدد أن تدخين التبغ قد يسبب مرض الانسداد الرئوي المزمن.\n2. يصف أثر المرض في الحويصلات والمجاري الهوائية وتبادل الغازات.\nمخرج تعليمي آخر: يربط تهدم جدران الحويصلات بنقص المساحة السطحية.\n\nالحصة 5: تحليل بيانات التدخين وسرطان الرئة\n1. يحلل بيانات العلاقة بين عدد السجائر والإصابة بسرطان الرئة.\n2. يميز بين الارتباط والسببية في بيانات صحية.\nمخرج تعليمي آخر: يمثل البيانات بيانيًا ويستخلص منها استنتاجًا.\n\nالحصة 6: حملة توعية ومراجعة الوحدة الثانية\n1. يطبق مفاهيم تبادل الغازات وأضرار التدخين في حل أسئلة نهاية الوحدة.\n2. يصمم رسالة توعوية علمية عن أضرار التدخين.\nمخرج تعليمي آخر: يقيّم الرسائل التوعوية لزملائه من حيث الدقة العلمية والتأثير."},{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد المكونا ل الغازات، الأمراض المرتبطة بالتدخين"},{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><p>يعرض صورة رئة سليمة وأخرى لمدخن ويسأل: ما الذي سبب هذا اللون الداكن؟<\/p><div class=\"psub\">الحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب<\/div><p>سؤال: لماذا يشعر المدخن بضيق النفس عند صعود الدرج أسرع من غيره؟<\/p><div class=\"psub\">الحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان<\/div><p>سؤال: لماذا يسعل كثير من المدخنين بشدة في الصباح؟<\/p><div class=\"psub\">الحصة 4: مرض الانسداد الرئوي المزمن<\/div><p>يعرض المعلم مجموعة بالونات صغيرة كثيرة مقابل بالون كبير واحد ويسأل: أيهما يوفر مساحة سطح أكبر؟<\/p><div class=\"psub\">الحصة 5: تحليل بيانات التدخين وسرطان الرئة<\/div><p>يعرض رسمًا بيانيًا لعدد السجائر يوميًا ونسبة الوفيات بسرطان الرئة ويسأل: ماذا يخبرنا الرسم؟<\/p><div class=\"psub\">الحصة 6: حملة توعية ومراجعة الوحدة الثانية<\/div><p>يعرض المعلم إعلانًا توعويًا ضد التدخين ويسأل: ما الذي يجعل الرسالة مؤثرة؟<\/p>","t":"الحصة 1: مكونات دخان التبغ السامة\nيعرض صورة رئة سليمة وأخرى لمدخن ويسأل: ما الذي سبب هذا اللون الداكن؟\n\nالحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب\nسؤال: لماذا يشعر المدخن بضيق النفس عند صعود الدرج أسرع من غيره؟\n\nالحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان\nسؤال: لماذا يسعل كثير من المدخنين بشدة في الصباح؟\n\nالحصة 4: مرض الانسداد الرئوي المزمن\nيعرض المعلم مجموعة بالونات صغيرة كثيرة مقابل بالون كبير واحد ويسأل: أيهما يوفر مساحة سطح أكبر؟\n\nالحصة 5: تحليل بيانات التدخين وسرطان الرئة\nيعرض رسمًا بيانيًا لعدد السجائر يوميًا ونسبة الوفيات بسرطان الرئة ويسأل: ماذا يخبرنا الرسم؟\n\nالحصة 6: حملة توعية ومراجعة الوحدة الثانية\nيعرض المعلم إعلانًا توعويًا ضد التدخين ويسأل: ما الذي يجعل الرسالة مؤثرة؟"},{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض
