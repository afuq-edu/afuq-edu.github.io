:root{--ac:#2F7D5B;--tint:#EAF5EF;--line:#D0E6D9;--soft:#F5FBF7;--ink:#25313C;--mut:#5E6E7B;--ok:#2E7D5B;--okt:#E7F5EE}
*{box-sizing:border-box}
body{margin:0;font-family:Tj,system-ui,sans-serif;background:#F5F8FA;color:var(--ink);line-height:1.75;font-size:16px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:14px;padding-bottom:14px}
h1{margin:0;font-size:1.3rem;color:var(--ac)}
.sub{color:var(--mut);font-size:.92rem}
.modebox{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;color:var(--mut);padding:8px 18px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(40,70,100,.14)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint{margin:8px 0 0;font-size:.9rem;color:var(--mut)}
.hint b{color:var(--ink)}
.state{margin-top:10px;display:inline-block;background:var(--okt);color:var(--ok);font-weight:700;border-radius:10px;padding:4px 12px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:16px 0 8px}
.ctl label{font-weight:700;color:var(--mut)}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%;flex:1;min-width:240px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.tab{font:inherit;text-align:start;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;cursor:pointer;color:var(--ink);line-height:1.45;max-width:100%}
.tab b{display:block;color:var(--ac)}
.tab small{color:var(--mut)}
.tab.on{background:var(--tint);border-color:var(--ac)}
.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 18px;font-size:.92rem}
.info b{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.card h3{margin:0;font-size:1.02rem;color:var(--ac);display:flex;align-items:center;gap:8px}
.no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tint);border:1px solid var(--line);font-size:.85rem;flex:none}
.copy{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ac);border-radius:10px;padding:5px 16px;min-width:118px;cursor:pointer;transition:background .2s,color .2s}
.copy:hover{background:var(--tint)}
.copy.done{background:var(--okt);color:var(--ok);border-color:#BFE3D1}
.bd{padding:10px 16px}
.bd p{margin:0}
ol.ol{margin:0;padding-inline-start:20px}
.extra{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.extra b{color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:1px 10px;font-size:.93rem}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th{background:var(--tint);color:var(--ac);border:1px solid var(--line);padding:4px 8px}
table.t td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
td.tm{white-space:nowrap;text-align:center;font-weight:700;color:var(--ac)}
td.st{font-weight:700}
td.lv,td.ev{white-space:nowrap;font-weight:700;color:var(--ac);text-align:center}
tr.sum td{background:var(--soft);font-weight:700}
.tot{font-size:.88rem;color:var(--mut);margin:0 0 4px}
bdi{unicode-bidi:isolate;direction:ltr}
.psub{font-weight:700;color:var(--ac);margin:12px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
.psub:first-child{margin-top:0;padding-top:0;border-top:0}
.man{padding:0 16px 12px}
.man p{margin:0 0 6px;color:#8A5A12;font-size:.9rem}
.man textarea{width:100%;min-height:150px;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:8px}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:20px}
@media (max-width:600px){body{font-size:15px}.card .hd{flex-wrap:wrap}.copy{min-width:96px}table.t{font-size:.84rem}.seg button{padding:8px 12px}}
</style></head><body>

<div class="seg"><button type="button" data-m="sep" class="on">تحضير منفصل</button><button type="button" data-m="comb">تحضير مدمج</button></div>

</div></div></header>
<main class="wrap">

<script>const D={"ft":["المخرجات التعليمية","المستوى المعرفي","الاستراتيجيات","المصادر التعليمية","المفاهيم","التهيئة / التمهيد / التعلم القبلي","إجراءات سير الدرس / الأنشطة التدريسية","التقويم التكويني","التقويم الختامي","ملاحظات ضمن خطة الدراسة الأسبوعية"],"lessons":[{"label":"1-1 الجهاز الدوري","unit":"الوحدة الأولى: النقل في الثدييات","periods":[{"n":1,"focus":"مكونات الجهاز الدوري ووظيفته","info":"<div><b>الدرس:<\/b> 1-1 الجهاز الدوري<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: تمرين 1-1 ص 13<\/div><div><b>دليل المعلم:<\/b> ص 21<\/div><div><b>محور الحصة:<\/b> مكونات الجهاز الدوري ووظيفته<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد.<\/li><li>يحدد وظيفة كل من القلب والأوعية الدموية والصمامات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر حاجة الثدييات الكبيرة إلى جهاز نقل.<\/div>","t":"1. يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد.\n2. يحدد وظيفة كل من القلب والأوعية الدموية والصمامات.\nمخرج تعليمي آخر: يفسر حاجة الثدييات الكبيرة إلى جهاز نقل."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد وظيفة كل من القلب والأوعية الدموية والصمامات.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر حاجة الثدييات الكبيرة إلى جهاز نقل.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد. ← فهم\n• يحدد وظيفة كل من القلب والأوعية الدموية والصمامات. ← تذكر\n• يفسر حاجة الثدييات الكبيرة إلى جهاز نقل. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>نماذج مجسمة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• نماذج مجسمة"},{"h":"<div class=\"pills\"><span>الجهاز الدوري<\/span><span>القلب<\/span><span>الأوعية الدموية<\/span><span>الصمامات<\/span><span>التدفق في اتجاه واحد<\/span><\/div>","t":"الجهاز الدوري، القلب، الأوعية الدموية، الصمامات، التدفق في اتجاه واحد"},{"h":"<p>يطلب المعلم من الطلبة تحسس نبضهم عند الرسغ ويسأل: ما الذي يسبب هذا النبض؟ وإلى أين يذهب الدم؟<\/p>","t":"يطلب المعلم من الطلبة تحسس نبضهم عند الرسغ ويسأل: ما الذي يسبب هذا النبض؟ وإلى أين يذهب الدم؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يوجه إلى تحسس النبض.<\/td><td>يتحسسون النبض ويقترحون تفسيرًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مكونات الجهاز الدوري (كتاب الطالب ص 15)<\/td><td>يعرض على السبورة الذكية مخططًا للجهاز الدوري ونموذجًا مجسمًا للقلب.<\/td><td>يحددون القلب والأوعية والصمامات ووظيفة كل منها.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">نمذجة: شبكة التوصيل<\/td><td>يشبه الجهاز الدوري بشبكة توصيل مياه فيها مضخة وأنابيب وصمامات، ويعرض مقطعًا قصيرًا عن جريان الدم.<\/td><td>يربطون أجزاء النموذج بأجزاء الجهاز الدوري ويحددون دور الصمامات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">لماذا نحتاج إلى جهاز نقل؟<\/td><td>يقارن بين كائن وحيد الخلية والإنسان من حيث نقل المواد.<\/td><td>يستنتجون أن الانتشار وحده لا يكفي في الكائنات الكبيرة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يوجه إلى تحسس النبض.\nدور الطالب: يتحسسون النبض ويقترحون تفسيرًا.\n\n(10 دقائق) مكونات الجهاز الدوري (كتاب الطالب ص 15)\nدور المعلم: يعرض على السبورة الذكية مخططًا للجهاز الدوري ونموذجًا مجسمًا للقلب.\nدور الطالب: يحددون القلب والأوعية والصمامات ووظيفة كل منها.\n\n(12 دقيقة) نمذجة: شبكة التوصيل\nدور المعلم: يشبه الجهاز الدوري بشبكة توصيل مياه فيها مضخة وأنابيب وصمامات، ويعرض مقطعًا قصيرًا عن جريان الدم.\nدور الطالب: يربطون أجزاء النموذج بأجزاء الجهاز الدوري ويحددون دور الصمامات.\n\n(8 دقائق) لماذا نحتاج إلى جهاز نقل؟\nدور المعلم: يقارن بين كائن وحيد الخلية والإنسان من حيث نقل المواد.\nدور الطالب: يستنتجون أن الانتشار وحده لا يكفي في الكائنات الكبيرة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المكونات الرئيسة للجهاز الدوري؟<\/td><td>القلب (مضخة)، والأوعية الدموية، والصمامات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الصمامات في الجهاز الدوري؟<\/td><td>ضمان تدفق الدم في اتجاه واحد ومنع رجوعه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتاج الإنسان إلى جهاز نقل بينما لا يحتاجه كائن وحيد الخلية؟<\/td><td>لأن جسم الإنسان كبير والمسافات طويلة فلا يكفي الانتشار لإيصال المواد، أما الكائن وحيد الخلية فمساحته السطحية كبيرة نسبة إلى حجمه.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المكونات الرئيسة للجهاز الدوري؟\nالإجابة النموذجية: القلب (مضخة)، والأوعية الدموية، والصمامات.\n\n2) [المستوى المتوقع] ما وظيفة الصمامات في الجهاز الدوري؟\nالإجابة النموذجية: ضمان تدفق الدم في اتجاه واحد ومنع رجوعه.\n\n3) [المستوى المتقدم] لماذا يحتاج الإنسان إلى جهاز نقل بينما لا يحتاجه كائن وحيد الخلية؟\nالإجابة النموذجية: لأن جسم الإنسان كبير والمسافات طويلة فلا يكفي الانتشار لإيصال المواد، أما الكائن وحيد الخلية فمساحته السطحية كبيرة نسبة إلى حجمه."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المضخة في الجهاز الدوري هي .........<\/td><td>القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يتدفق الدم في الأوعية في الاتجاهين بحرية.<\/td><td>خطأ؛ الصمامات تجعله يتدفق في اتجاه واحد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لو تعطلت الصمامات في الجهاز الدوري؟<\/td><td>يرجع الدم في الاتجاه المعاكس فيقل ما يُضخ إلى الجسم ويضطر القلب إلى بذل جهد أكبر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: المضخة في الجهاز الدوري هي .........\nالإجابة النموذجية: القلب.\n\n2) [المستوى المتوقع] صواب أم خطأ: يتدفق الدم في الأوعية في الاتجاهين بحرية.\nالإجابة النموذجية: خطأ؛ الصمامات تجعله يتدفق في اتجاه واحد.\n\n3) [المستوى المتقدم] ماذا يحدث لو تعطلت الصمامات في الجهاز الدوري؟\nالإجابة النموذجية: يرجع الدم في الاتجاه المعاكس فيقل ما يُضخ إلى الجسم ويضطر القلب إلى بذل جهد أكبر."},{"h":"<p>مراجعة كتاب الطالب ص 15 والإجابة عن السؤالين 1-1 و2-1، وقياس النبض في المنزل وتسجيله.<\/p>","t":"مراجعة كتاب الطالب ص 15 والإجابة عن السؤالين 1-1 و2-1، وقياس النبض في المنزل وتسجيله."}]},{"n":2,"focus":"الدورة الدموية المزدوجة: الرئوية والجهازية","info":"<div><b>الدرس:<\/b> 1-1 الجهاز الدوري<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: تمرين 1-1 ص 13<\/div><div><b>دليل المعلم:<\/b> ص 21<\/div><div><b>محور الحصة:<\/b> الدورة الدموية المزدوجة: الرئوية والجهازية<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم.<\/li><li>يتتبع مسار الدم في الدورتين الرئوية والجهازية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة.<\/div>","t":"1. يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم.\n2. يتتبع مسار الدم في الدورتين الرئوية والجهازية.\nمخرج تعليمي آخر: يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يتتبع مسار الدم في الدورتين الرئوية والجهازية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم. ← فهم\n• يتتبع مسار الدم في الدورتين الرئوية والجهازية. ← تطبيق\n• يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: بطاقات أسهم حمراء وزرقاء ومخطط كبير للجسم<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: بطاقات أسهم حمراء وزرقاء ومخطط كبير للجسم"},{"h":"<div class=\"pills\"><span>الدورة الدموية المزدوجة<\/span><span>الدورة الرئوية<\/span><span>الدورة الجهازية<\/span><span>الدم المؤكسج<\/span><span>الدم غير المؤكسج<\/span><\/div>","t":"الدورة الدموية المزدوجة، الدورة الرئوية، الدورة الجهازية، الدم المؤكسج، الدم غير المؤكسج"},{"h":"<p>سؤال: كم مرة يمر الدم بالقلب في رحلة كاملة واحدة حول الجسم؟<\/p>","t":"سؤال: كم مرة يمر الدم بالقلب في رحلة كاملة واحدة حول الجسم؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الدورتان (كتاب الطالب ص 16)<\/td><td>يرسم على السبورة الذكية مخطط الدورة المزدوجة ويلون الدم المؤكسج بالأحمر وغير المؤكسج بالأزرق.<\/td><td>يرسمون المخطط ويتتبعون المسار: قلب ← رئتان ← قلب ← جسم ← قلب.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">لعبة «رحلة كرية دم»<\/td><td>يضع مخططًا كبيرًا على الأرض ويوزع بطاقات أسهم.<\/td><td>يتحرك طالب في دور كرية الدم بينما ترتب المجموعة الأسهم بالترتيب الصحيح.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">تمرين 1-1 الدورة الرئوية والدورة الجهازية (كتاب النشاط ص 13)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) الدورتان (كتاب الطالب ص 16)\nدور المعلم: يرسم على السبورة الذكية مخطط الدورة المزدوجة ويلون الدم المؤكسج بالأحمر وغير المؤكسج بالأزرق.\nدور الطالب: يرسمون المخطط ويتتبعون المسار: قلب ← رئتان ← قلب ← جسم ← قلب.\n\n(12 دقيقة) لعبة «رحلة كرية دم»\nدور المعلم: يضع مخططًا كبيرًا على الأرض ويوزع بطاقات أسهم.\nدور الطالب: يتحرك طالب في دور كرية الدم بينما ترتب المجموعة الأسهم بالترتيب الصحيح.\n\n(6 دقائق) تمرين 1-1 الدورة الرئوية والدورة الجهازية (كتاب النشاط ص 13)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>إلى أين يذهب الدم في الدورة الرئوية؟<\/td><td>من القلب إلى الرئتين ثم يعود إلى القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تسمى الدورة الدموية في الثدييات مزدوجة؟<\/td><td>لأن الدم يمر بالقلب مرتين في كل دورة كاملة حول الجسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أين يكون الدم مؤكسجًا: في الوعاء العائد من الرئتين أم في الوعاء الذاهب إليهما؟ فسّر.<\/td><td>في العائد من الرئتين؛ لأنه اكتسب الأكسجين فيهما.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] إلى أين يذهب الدم في الدورة الرئوية؟\nالإجابة النموذجية: من القلب إلى الرئتين ثم يعود إلى القلب.\n\n2) [المستوى المتوقع] لماذا تسمى الدورة الدموية في الثدييات مزدوجة؟\nالإجابة النموذجية: لأن الدم يمر بالقلب مرتين في كل دورة كاملة حول الجسم.\n\n3) [المستوى المتقدم] أين يكون الدم مؤكسجًا: في الوعاء العائد من الرئتين أم في الوعاء الذاهب إليهما؟ فسّر.\nالإجابة النموذجية: في العائد من الرئتين؛ لأنه اكتسب الأكسجين فيهما."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الدورة التي تنقل الدم من القلب إلى أنسجة الجسم ثم تعيده تسمى الدورة .........<\/td><td>الجهازية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب: الرئتان، الجسم، القلب (مرتين) في مسار دورة كاملة.<\/td><td>القلب ← الرئتان ← القلب ← الجسم ← القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف ما يحدث لتركيز الأكسجين في الدم أثناء مروره بأنسجة الجسم ولماذا.<\/td><td>يقل؛ لأن الخلايا تأخذ الأكسجين لاستخدامه في التنفس الخلوي.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الدورة التي تنقل الدم من القلب إلى أنسجة الجسم ثم تعيده تسمى الدورة .........\nالإجابة النموذجية: الجهازية.\n\n2) [المستوى المتوقع] رتب: الرئتان، الجسم، القلب (مرتين) في مسار دورة كاملة.\nالإجابة النموذجية: القلب ← الرئتان ← القلب ← الجسم ← القلب.\n\n3) [المستوى المتقدم] صف ما يحدث لتركيز الأكسجين في الدم أثناء مروره بأنسجة الجسم ولماذا.\nالإجابة النموذجية: يقل؛ لأن الخلايا تأخذ الأكسجين لاستخدامه في التنفس الخلوي."},{"h":"<p>حل تمرين 1-1 الدورة الرئوية والدورة الجهازية في كتاب النشاط ص 13، والإجابة عن السؤالين 3-1 و4-1.<\/p>","t":"حل تمرين 1-1 الدورة الرئوية والدورة الجهازية في كتاب النشاط ص 13، والإجابة عن السؤالين 3-1 و4-1."}]},{"n":3,"focus":"مزايا الدورة الدموية المزدوجة","info":"<div><b>الدرس:<\/b> 1-1 الجهاز الدوري<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: تمرين 1-1 ص 13<\/div><div><b>دليل المعلم:<\/b> ص 21<\/div><div><b>محور الحصة:<\/b> مزايا الدورة الدموية المزدوجة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات.<\/li><li>يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين.<\/div>","t":"1. يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات.\n2. يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك.\nمخرج تعليمي آخر: يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات. ← فهم\n• يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك. ← تحليل\n• يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>الضغط المرتفع<\/span><span>الدورة المفردة<\/span><span>فصل الدم المؤكسج عن غير المؤكسج<\/span><span>سرعة إيصال الأكسجين<\/span><\/div>","t":"الضغط المرتفع، الدورة المفردة، فصل الدم المؤكسج عن غير المؤكسج، سرعة إيصال الأكسجين"},{"h":"<p>يعرض صورة سمكة وصورة غزال يركض ويسأل: أيهما يحتاج إلى إيصال الأكسجين لعضلاته بسرعة أكبر؟ ولماذا؟<\/p>","t":"يعرض صورة سمكة وصورة غزال يركض ويسأل: أيهما يحتاج إلى إيصال الأكسجين لعضلاته بسرعة أكبر؟ ولماذا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">المقارنة مع الأسماك<\/td><td>يعرض مخطط الدورة المفردة في السمكة.<\/td><td>يقارنون عدد مرات مرور الدم بالقلب وضغط الدم المتجه إلى الجسم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مزايا الدورة المزدوجة (كتاب الطالب ص 16)<\/td><td>يقود نقاشًا حول ضغط الدم بعد الرئتين وأهمية إعادة ضخه.<\/td><td>يستخرجون المزايا ويحلون الأسئلة 5-1 و6-1.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المقارنة مع الأسماك\nدور المعلم: يعرض مخطط الدورة المفردة في السمكة.\nدور الطالب: يقارنون عدد مرات مرور الدم بالقلب وضغط الدم المتجه إلى الجسم.\n\n(10 دقائق) مزايا الدورة المزدوجة (كتاب الطالب ص 16)\nدور المعلم: يقود نقاشًا حول ضغط الدم بعد الرئتين وأهمية إعادة ضخه.\nدور الطالب: يستخرجون المزايا ويحلون الأسئلة 5-1 و6-1.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ميزة للدورة الدموية المزدوجة.<\/td><td>يُضخ الدم إلى الجسم بضغط مرتفع بعد عودته من الرئتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم مرة يمر الدم بالقلب في دورة كاملة لدى السمكة؟<\/td><td>مرة واحدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يقل ضغط الدم بعد مروره في شعيرات الرئتين؟ وكيف تعالج الدورة المزدوجة ذلك؟<\/td><td>بسبب مقاومة الشعيرات الدقيقة؛ فيعود الدم إلى القلب ليضخ مرة ثانية بضغط مرتفع إلى الجسم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ميزة للدورة الدموية المزدوجة.\nالإجابة النموذجية: يُضخ الدم إلى الجسم بضغط مرتفع بعد عودته من الرئتين.\n\n2) [المستوى المتوقع] كم مرة يمر الدم بالقلب في دورة كاملة لدى السمكة؟\nالإجابة النموذجية: مرة واحدة.\n\n3) [المستوى المتقدم] لماذا يقل ضغط الدم بعد مروره في شعيرات الرئتين؟ وكيف تعالج الدورة المزدوجة ذلك؟\nالإجابة النموذجية: بسبب مقاومة الشعيرات الدقيقة؛ فيعود الدم إلى القلب ليضخ مرة ثانية بضغط مرتفع إلى الجسم."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تحافظ الدورة المزدوجة على فصل الدم المؤكسج عن غير المؤكسج.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تناسب الدورة المزدوجة الثدييات النشطة؟<\/td><td>لأنها توصل الأكسجين والغذاء إلى الخلايا بسرعة لتلبية حاجتها العالية من الطاقة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع أثر اختلاط الدم المؤكسج بغير المؤكسج على نشاط الكائن.<\/td><td>يقل تركيز الأكسجين الواصل إلى الخلايا فيقل التنفس الخلوي والطاقة فيضعف النشاط.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تحافظ الدورة المزدوجة على فصل الدم المؤكسج عن غير المؤكسج.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا تناسب الدورة المزدوجة الثدييات النشطة؟\nالإجابة النموذجية: لأنها توصل الأكسجين والغذاء إلى الخلايا بسرعة لتلبية حاجتها العالية من الطاقة.\n\n3) [المستوى المتقدم] توقع أثر اختلاط الدم المؤكسج بغير المؤكسج على نشاط الكائن.\nالإجابة النموذجية: يقل تركيز الأكسجين الواصل إلى الخلايا فيقل التنفس الخلوي والطاقة فيضعف النشاط."},{"h":"<p>الإجابة عن السؤالين 5-1 و6-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى، ومراجعة كتاب الطالب ص 15–16.<\/p>","t":"الإجابة عن السؤالين 5-1 و6-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى، ومراجعة كتاب الطالب ص 15–16."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-1 الجهاز الدوري<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–16 | كتاب النشاط: تمرين 1-1 ص 13<\/div><div><b>دليل المعلم:<\/b> ص 21<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><ol class=\"ol\"><li>يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد.<\/li><li>يحدد وظيفة كل من القلب والأوعية الدموية والصمامات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر حاجة الثدييات الكبيرة إلى جهاز نقل.<\/div><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><ol class=\"ol\"><li>يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم.<\/li><li>يتتبع مسار الدم في الدورتين الرئوية والجهازية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة.<\/div><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><ol class=\"ol\"><li>يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات.<\/li><li>يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين.<\/div>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\n1. يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد.\n2. يحدد وظيفة كل من القلب والأوعية الدموية والصمامات.\nمخرج تعليمي آخر: يفسر حاجة الثدييات الكبيرة إلى جهاز نقل.\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\n1. يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم.\n2. يتتبع مسار الدم في الدورتين الرئوية والجهازية.\nمخرج تعليمي آخر: يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة.\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\n1. يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات.\n2. يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك.\nمخرج تعليمي آخر: يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين."},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد وظيفة كل من القلب والأوعية الدموية والصمامات.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر حاجة الثدييات الكبيرة إلى جهاز نقل.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يتتبع مسار الدم في الدورتين الرئوية والجهازية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\n• يصف الجهاز الدوري بأنه جهاز مكون من أوعية دموية ومزود بمضخة وصمامات لضمان تدفق الدم في اتجاه واحد. ← فهم\n• يحدد وظيفة كل من القلب والأوعية الدموية والصمامات. ← تذكر\n• يفسر حاجة الثدييات الكبيرة إلى جهاز نقل. ← تحليل\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\n• يصف الدورة الدموية في الثدييات من حيث دوران الدم إلى الرئتين ودورانه إلى أنسجة الجسم. ← فهم\n• يتتبع مسار الدم في الدورتين الرئوية والجهازية. ← تطبيق\n• يميز بين الدم المؤكسج وغير المؤكسج في مخطط الدورة. ← تحليل\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\n• يشرح مزايا الدورة الرئوية والدورة الجهازية لدى الثدييات. ← فهم\n• يقارن بين الدورة المزدوجة والدورة المفردة في الأسماك. ← تحليل\n• يقيّم أهمية ضخ الدم مرة ثانية بعد عودته من الرئتين. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\n• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\n• التعلم المبني على حل المشكلات\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>نماذج مجسمة<\/span><\/div><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><div cl م عند الرسغ ويسأل: ما الذي يسبب هذا النبض؟ وإلى أين يذهب الدم؟<\/p><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><p>سؤال: كم مرة يمر الدم بالقلب في رحلة كاملة واحدة حول الجسم؟<\/p><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><p>يعرض صورة سمكة وصورة غزال يركض ويسأل: أيهما يحتاج إلى إيصال الأكسجين لعضلاته بسرعة أكبر؟ ولماذا؟<\/p>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\nيطلب المعلم من الطلبة تحسس نبضهم عند الرسغ ويسأل: ما الذي يسبب هذا النبض؟ وإلى أين يذهب الدم؟\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\nسؤال: كم مرة يمر الدم بالقلب في رحلة كاملة واحدة حول الجسم؟\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\nيعرض صورة سمكة وصورة غزال يركض ويسأل: أيهما يحتاج إلى إيصال الأكسجين لعضلاته بسرعة أكبر؟ ولماذا؟"},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يوجه إلى تحسس النبض.<\/td><td>يتحسسون النبض ويقترحون تفسيرًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مكونات الجهاز الدوري (كتاب الطالب ص 15)<\/td><td>يعرض على السبورة الذكية مخططًا للجهاز الدوري ونموذجًا مجسمًا للقلب.<\/td><td>يحددون القلب والأوعية والصمامات ووظيفة كل منها.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">نمذجة: شبكة التوصيل<\/td><td>يشبه الجهاز الدوري بشبكة توصيل مياه فيها مضخة وأنابيب وصمامات، ويعرض مقطعًا قصيرًا عن جريان الدم.<\/td><td>يربطون أجزاء النموذج بأجزاء الجهاز الدوري ويحددون دور الصمامات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">لماذا نحتاج إلى جهاز نقل؟<\/td><td>يقارن بين كائن وحيد الخلية والإنسان من حيث نقل المواد.<\/td><td>يستنتجون أن الانتشار وحده لا يكفي في الكائنات الكبيرة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الدورتان (كتاب الطالب ص 16)<\/td><td>يرسم على السبورة الذكية مخطط الدورة المزدوجة ويلون الدم المؤكسج بالأحمر وغير المؤكسج بالأزرق.<\/td><td>يرسمون المخطط ويتتبعون المسار: قلب ← رئتان ← قلب ← جسم ← قلب.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">لعبة «رحلة كرية دم»<\/td><td>يضع مخططًا كبيرًا على الأرض ويوزع بطاقات أسهم.<\/td><td>يتحرك طالب في دور كرية الدم بينما ترتب المجموعة الأسهم بالترتيب الصحيح.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">تمرين 1-1 الدورة الرئوية والدورة الجهازية (كتاب النشاط ص 13)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">المقارنة مع الأسماك<\/td><td>يعرض مخطط الدورة المفردة في السمكة.<\/td><td>يقارنون عدد مرات مرور الدم بالقلب وضغط الدم المتجه إلى الجسم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مزايا الدورة المزدوجة (كتاب الطالب ص 16)<\/td><td>يقود نقاشًا حول ضغط الدم بعد الرئتين وأهمية إعادة ضخه.<\/td><td>يستخرجون المزايا ويحلون الأسئلة 5-1 و6-1.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\n(5 دقائق) التهيئة\nدور المعلم: يوجه إلى تحسس النبض.\nدور الطالب: يتحسسون النبض ويقترحون تفسيرًا.\n\n(10 دقائق) مكونات الجهاز الدوري (كتاب الطالب ص 15)\nدور المعلم: يعرض على السبورة الذكية مخططًا للجهاز الدوري ونموذجًا مجسمًا للقلب.\nدور الطالب: يحددون القلب والأوعية والصمامات ووظيفة كل منها.\n\n(12 دقيقة) نمذجة: شبكة التوصيل\nدور المعلم: يشبه الجهاز الدوري بشبكة توصيل مياه فيها مضخة وأنابيب وصمامات، ويعرض مقطعًا قصيرًا عن جريان الدم.\nدور الطالب: يربطون أجزاء النموذج بأجزاء الجهاز الدوري ويحددون دور الصمامات.\n\n(8 دقائق) لماذا نحتاج إلى جهاز نقل؟\nدور المعلم: يقارن بين كائن وحيد الخلية والإنسان من حيث نقل المواد.\nدور الطالب: يستنتجون أن الانتشار وحده لا يكفي في الكائنات الكبيرة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) الدورتان (كتاب الطالب ص 16)\nدور المعلم: يرسم على السبورة الذكية مخطط الدورة المزدوجة ويلون الدم المؤكسج بالأحمر وغير المؤكسج بالأزرق.\nدور الطالب: يرسمون المخطط ويتتبعون المسار: قلب ← رئتان ← قلب ← جسم ← قلب.\n\n(12 دقيقة) لعبة «رحلة كرية دم»\nدور المعلم: يضع مخططًا كبيرًا على الأرض ويوزع بطاقات أسهم.\nدور الطالب: يتحرك طالب في دور كرية الدم بينما ترتب المجموعة الأسهم بالترتيب الصحيح.\n\n(6 دقائق) تمرين 1-1 الدورة الرئوية والدورة الجهازية (كتاب النشاط ص 13)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المقارنة مع الأسماك\nدور المعلم: يعرض مخطط الدورة المفردة في السمكة.\nدور الطالب: يقارنون عدد مرات مرور الدم بالقلب وضغط الدم المتجه إلى الجسم.\n\n(10 دقائق) مزايا الدورة المزدوجة (كتاب الطالب ص 16)\nدور المعلم: يقود نقاشًا حول ضغط الدم بعد الرئتين وأهمية إعادة ضخه.\nدور الطالب: يستخرجون المزايا ويحلون الأسئلة 5-1 و6-1.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المكونات الرئيسة للجهاز الدوري؟<\/td><td>القلب (مضخة)، والأوعية الدموية، والصمامات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الصمامات في الجهاز الدوري؟<\/td><td>ضمان تدفق الدم في اتجاه واحد ومنع رجوعه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتاج الإنسان إلى جهاز نقل بينما لا يحتاجه كائن وحيد الخلية؟<\/td><td>لأن جسم الإنسان كبير والمسافات طويلة فلا يكفي الانتشار لإيصال المواد، أما الكائن وحيد الخلية فمساحته السطحية كبيرة نسبة إلى حجمه.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>إلى أين يذهب الدم في الدورة الرئوية؟<\/td><td>من القلب إلى الرئتين ثم يعود إلى القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تسمى الدورة الدموية في الثدييات مزدوجة؟<\/td><td>لأن الدم يمر بالقلب مرتين في كل دورة كاملة حول الجسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أين يكون الدم مؤكسجًا: في الوعاء العائد من الرئتين أم في الوعاء الذاهب إليهما؟ فسّر.<\/td><td>في العائد من الرئتين؛ لأنه اكتسب الأكسجين فيهما.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ميزة للدورة الدموية المزدوجة.<\/td><td>يُضخ الدم إلى الجسم بضغط مرتفع بعد عودته من الرئتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كم مرة يمر الدم بالقلب في دورة كاملة لدى السمكة؟<\/td><td>مرة واحدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يقل ضغط الدم بعد مروره في شعيرات الرئتين؟ وكيف تعالج الدورة المزدوجة ذلك؟<\/td><td>بسبب مقاومة الشعيرات الدقيقة؛ فيعود الدم إلى القلب ليضخ مرة ثانية بضغط مرتفع إلى الجسم.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\n1) [مستوى الدعم] ما المكونات الرئيسة للجهاز الدوري؟\nالإجابة النموذجية: القلب (مضخة)، والأوعية الدموية، والصمامات.\n\n2) [المستوى المتوقع] ما وظيفة الصمامات في الجهاز الدوري؟\nالإجابة النموذجية: ضمان تدفق الدم في اتجاه واحد ومنع رجوعه.\n\n3) [المستوى المتقدم] لماذا يحتاج الإنسان إلى جهاز نقل بينما لا يحتاجه كائن وحيد الخلية؟\nالإجابة النموذجية: لأن جسم الإنسان كبير والمسافات طويلة فلا يكفي الانتشار لإيصال المواد، أما الكائن وحيد الخلية فمساحته السطحية كبيرة نسبة إلى حجمه.\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\n1) [مستوى الدعم] إلى أين يذهب الدم في الدورة الرئوية؟\nالإجابة النموذجية: من القلب إلى الرئتين ثم يعود إلى القلب.\n\n2) [المستوى المتوقع] لماذا تسمى الدورة الدموية في الثدييات مزدوجة؟\nالإجابة النموذجية: لأن الدم يمر بالقلب مرتين في كل دورة كاملة حول الجسم.\n\n3) [المستوى المتقدم] أين يكون الدم مؤكسجًا: في الوعاء العائد من الرئتين أم في الوعاء الذاهب إليهما؟ فسّر.\nالإجابة النموذجية: في العائد من الرئتين؛ لأنه اكتسب الأكسجين فيهما.\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\n1) [مستوى الدعم] اذكر ميزة للدورة الدموية المزدوجة.\nالإجابة النموذجية: يُضخ الدم إلى الجسم بضغط مرتفع بعد عودته من الرئتين.\n\n2) [المستوى المتوقع] كم مرة يمر الدم بالقلب في دورة كاملة لدى السمكة؟\nالإجابة النموذجية: مرة واحدة.\n\n3) [المستوى المتقدم] لماذا يقل ضغط الدم بعد مروره في شعيرات الرئتين؟ وكيف تعالج الدورة المزدوجة ذلك؟\nالإجابة النموذجية: بسبب مقاومة الشعيرات الدقيقة؛ فيعود الدم إلى القلب ليضخ مرة ثانية بضغط مرتفع إلى الجسم."},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المضخة في الجهاز الدوري هي .........<\/td><td>القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يتدفق الدم في الأوعية في الاتجاهين بحرية.<\/td><td>خطأ؛ الصمامات تجعله يتدفق في اتجاه واحد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لو تعطلت الصمامات في الجهاز الدوري؟<\/td><td>يرجع الدم في الاتجاه المعاكس فيقل ما يُضخ إلى الجسم ويضطر القلب إلى بذل جهد أكبر.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الدورة التي تنقل الدم من القلب إلى أنسجة الجسم ثم تعيده تسمى الدورة .........<\/td><td>الجهازية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب: الرئتان، الجسم، القلب (مرتين) في مسار دورة كاملة.<\/td><td>القلب ← الرئتان ← القلب ← الجسم ← القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف ما يحدث لتركيز الأكسجين في الدم أثناء مروره بأنسجة الجسم ولماذا.<\/td><td>يقل؛ لأن الخلايا تأخذ الأكسجين لاستخدامه في التنفس الخلوي.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تحافظ الدورة المزدوجة على فصل الدم المؤكسج عن غير المؤكسج.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تناسب الدورة المزدوجة الثدييات النشطة؟<\/td><td>لأنها توصل الأكسجين والغذاء إلى الخلايا بسرعة لتلبية حاجتها العالية من الطاقة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>توقع أثر اختلاط الدم المؤكسج بغير المؤكسج على نشاط الكائن.<\/td><td>يقل تركيز الأكسجين الواصل إلى الخلايا فيقل التنفس الخلوي والطاقة فيضعف النشاط.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\n1) [مستوى الدعم] أكمل: المضخة في الجهاز الدوري هي .........\nالإجابة النموذجية: القلب.\n\n2) [المستوى المتوقع] صواب أم خطأ: يتدفق الدم في الأوعية في الاتجاهين بحرية.\nالإجابة النموذجية: خطأ؛ الصمامات تجعله يتدفق في اتجاه واحد.\n\n3) [المستوى المتقدم] ماذا يحدث لو تعطلت الصمامات في الجهاز الدوري؟\nالإجابة النموذجية: يرجع الدم في الاتجاه المعاكس فيقل ما يُضخ إلى الجسم ويضطر القلب إلى بذل جهد أكبر.\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\n1) [مستوى الدعم] أكمل: الدورة التي تنقل الدم من القلب إلى أنسجة الجسم ثم تعيده تسمى الدورة .........\nالإجابة النموذجية: الجهازية.\n\n2) [المستوى المتوقع] رتب: الرئتان، الجسم، القلب (مرتين) في مسار دورة كاملة.\nالإجابة النموذجية: القلب ← الرئتان ← القلب ← الجسم ← القلب.\n\n3) [المستوى المتقدم] صف ما يحدث لتركيز الأكسجين في الدم أثناء مروره بأنسجة الجسم ولماذا.\nالإجابة النموذجية: يقل؛ لأن الخلايا تأخذ الأكسجين لاستخدامه في التنفس الخلوي.\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\n1) [مستوى الدعم] صواب أم خطأ: تحافظ الدورة المزدوجة على فصل الدم المؤكسج عن غير المؤكسج.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا تناسب الدورة المزدوجة الثدييات النشطة؟\nالإجابة النموذجية: لأنها توصل الأكسجين والغذاء إلى الخلايا بسرعة لتلبية حاجتها العالية من الطاقة.\n\n3) [المستوى المتقدم] توقع أثر اختلاط الدم المؤكسج بغير المؤكسج على نشاط الكائن.\nالإجابة النموذجية: يقل تركيز الأكسجين الواصل إلى الخلايا فيقل التنفس الخلوي والطاقة فيضعف النشاط."},{"h":"<div class=\"psub\">الحصة 1: مكونات الجهاز الدوري ووظيفته<\/div><p>مراجعة كتاب الطالب ص 15 والإجابة عن السؤالين 1-1 و2-1، وقياس النبض في المنزل وتسجيله.<\/p><div class=\"psub\">الحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية<\/div><p>حل تمرين 1-1 الدورة الرئوية والدورة الجهازية في كتاب النشاط ص 13، والإجابة عن السؤالين 3-1 و4-1.<\/p><div class=\"psub\">الحصة 3: مزايا الدورة الدموية المزدوجة<\/div><p>الإجابة عن السؤالين 5-1 و6-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى، ومراجعة كتاب الطالب ص 15–16.<\/p>","t":"الحصة 1: مكونات الجهاز الدوري ووظيفته\nمراجعة كتاب الطالب ص 15 والإجابة عن السؤالين 1-1 و2-1، وقياس النبض في المنزل وتسجيله.\n\nالحصة 2: الدورة الدموية المزدوجة: الرئوية والجهازية\nحل تمرين 1-1 الدورة الرئوية والدورة الجهازية في كتاب النشاط ص 13، والإجابة عن السؤالين 3-1 و4-1.\n\nالحصة 3: مزايا الدورة الدموية المزدوجة\nالإجابة عن السؤالين 5-1 و6-1 والسؤال 1 من أسئلة نهاية الوحدة الأولى، ومراجعة كتاب الطالب ص 15–16."}]}},{"label":"2-1 القلب","unit":"الوحدة الأولى: النقل في الثدييات","periods":[{"n":1,"focus":"تركيب القلب","info":"<div><b>الدرس:<\/b> 2-1 القلب<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 17–21 | كتاب النشاط: تمرين 2-1 ص 14، تمرين 3-1 ص 15، ورقة العمل 1-1 ص 18–19<\/div><div><b>دليل المعلم:<\/b> ص 22<\/div><div><b>محور الحصة:<\/b> تركيب القلب<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية.<\/li><li>يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد أجزاء القلب على قلب حقيقي أو نموذج.<\/div>","t":"1. يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية.\n2. يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن.\nمخرج تعليمي آخر: يحدد أجزاء القلب على قلب حقيقي أو نموذج."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد أجزاء القلب على قلب حقيقي أو نموذج.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية. ← تذكر\n• يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن. ← فهم\n• يحدد أجزاء القلب على قلب حقيقي أو نموذج. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>أخرى: قلب خروف للتشريح (إثرائي)، أدوات تشريح، قفازات، صينية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• أخرى: قلب خروف للتشريح (إثرائي)، أدوات تشريح، قفازات، صينية"},{"h":"<div class=\"pills\"><span>الأذين<\/span><span>البطين<\/span><span>الحاجز<\/span><span>الصمامات<\/span><span>الشرايين التاجية<\/span><span>الجدار العضلي<\/span><\/div>","t":"الأذين، البطين، الحاجز، الصمامات، الشرايين التاجية، الجدار العضلي"},{"h":"<p>يعرض المعلم نموذجًا مجسمًا للقلب ويسأل: كم حجرة في قلب الإنسان؟ ولماذا يكون جانبه الأيسر أسمك؟<\/p>","t":"يعرض المعلم نموذجًا مجسمًا للقلب ويسأل: كم حجرة في قلب الإنسان؟ ولماذا يكون جانبه الأيسر أسمك؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض النموذج.<\/td><td>يتوقعون عدد الحجرات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">أجزاء القلب (كتاب الطالب ص 17–18)<\/td><td>يعرض على السبورة الذكية مقطعًا طوليًا في القلب ويسمي أجزاءه.<\/td><td>يرسمون المقطع ويسمون الأجزاء.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">النشاط 1-1 تشريح القلب (إثرائي)<\/td><td>ينفذ تشريحًا توضيحيًا لقلب خروف مع مراعاة قواعد السلامة والنظافة.<\/td><td>يحددون الحجرات والصمامات والشرايين التاجية ويقارنون سماكة جداري البطينين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">سماكة البطين الأيسر<\/td><td>يناقش ارتباط السماكة بالمسافة التي يُضخ إليها الدم.<\/td><td>يفسرون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض النموذج.\nدور الطالب: يتوقعون عدد الحجرات.\n\n(12 دقيقة) أجزاء القلب (كتاب الطالب ص 17–18)\nدور المعلم: يعرض على السبورة الذكية مقطعًا طوليًا في القلب ويسمي أجزاءه.\nدور الطالب: يرسمون المقطع ويسمون الأجزاء.\n\n(13 دقيقة) النشاط 1-1 تشريح القلب (إثرائي)\nدور المعلم: ينفذ تشريحًا توضيحيًا لقلب خروف مع مراعاة قواعد السلامة والنظافة.\nدور الطالب: يحددون الحجرات والصمامات والشرايين التاجية ويقارنون سماكة جداري البطينين.\n\n(5 دقائق) سماكة البطين الأيسر\nدور المعلم: يناقش ارتباط السماكة بالمسافة التي يُضخ إليها الدم.\nدور الطالب: يفسرون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كم حجرة في قلب الإنسان؟ وما أسماؤها؟<\/td><td>أربع: أذين أيمن وأذين أيسر وبطين أيمن وبطين أيسر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الحاجز في القلب؟<\/td><td>فصل الجانب الأيمن عن الأيسر لمنع اختلاط الدم المؤكسج بغير المؤكسج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون جدار البطين الأيسر أسمك من الأيمن؟<\/td><td>لأنه يضخ الدم إلى الجسم كله بضغط مرتفع، بينما يضخ الأيمن إلى الرئتين القريبتين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] كم حجرة في قلب الإنسان؟ وما أسماؤها؟\nالإجابة النموذجية: أربع: أذين أيمن وأذين أيسر وبطين أيمن وبطين أيسر.\n\n2) [المستوى المتوقع] ما وظيفة الحاجز في القلب؟\nالإجابة النموذجية: فصل الجانب الأيمن عن الأيسر لمنع اختلاط الدم المؤكسج بغير المؤكسج.\n\n3) [المستوى المتقدم] لماذا يكون جدار البطين الأيسر أسمك من الأيمن؟\nالإجابة النموذجية: لأنه يضخ الدم إلى الجسم كله بضغط مرتفع، بينما يضخ الأيمن إلى الرئتين القريبتين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الأوعية التي تغذي عضلة القلب نفسها هي .........<\/td><td>الشرايين التاجية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الأذينان يقعان في الجزء العلوي من القلب.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لعضلة القلب إذا انسد أحد الشرايين التاجية؟<\/td><td>لا يصلها الأكسجين والغذاء الكافيان فتتضرر أو تموت خلاياها (نوبة قلبية).<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الأوعية التي تغذي عضلة القلب نفسها هي .........\nالإجابة النموذجية: الشرايين التاجية.\n\n2) [المستوى المتوقع] صواب أم خطأ: الأذينان يقعان في الجزء العلوي من القلب.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] ماذا يحدث لعضلة القلب إذا انسد أحد الشرايين التاجية؟\nالإجابة النموذجية: لا يصلها الأكسجين والغذاء الكافيان فتتضرر أو تموت خلاياها (نوبة قلبية)."},{"h":"<p>مراجعة كتاب الطالب ص 17–18 والإجابة عن الأسئلة 7-1 إلى 9-1، ورسم مقطع طولي في القلب مع تسمية أجزائه.<\/p>","t":"مراجعة كتاب الطالب ص 17–18 والإجابة عن الأسئلة 7-1 إلى 9-1، ورسم مقطع طولي في القلب مع تسمية أجزائه."}]},{"n":2,"focus":"آلية عمل القلب ومرض القلب التاجي","info":"<div><b>الدرس:<\/b> 2-1 القلب<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 17–21 | كتاب النشاط: تمرين 2-1 ص 14، تمرين 3-1 ص 15، ورقة العمل 1-1 ص 18–19<\/div><div><b>دليل المعلم:<\/b> ص 22<\/div><div><b>محور الحصة:<\/b> آلية عمل القلب ومرض القلب التاجي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف آلية عمل القلب من خلال انقباض عضلات الأذينين والبطينين وعمل الصمامات.<\/li><li>يصف مرض القلب التاجي بانسداد الشرايين التاجية ويذكر عوامل خطره: النظام الغذائي والإجهاد والتدخين والاستعداد الوراثي والسن والجنس.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يذكر أن ا رين خفيف آمن لمدة دقيقتين ثم كل دقيقة حتى العودة إلى الراحة.\nدور الطالب: يسجلون النتائج ويرسمون منحنى النبض مع الزمن.\n\n(8 دقائق) التفسير وورقة العمل 1-1 نبض القلب (كتاب النشاط ص 18)\nدور المعلم: يربط ارتفاع النبض بحاجة العضلات إلى مزيد من الأكسجين والغلوكوز والتخلص من ثاني أكسيد الكربون.\nدور الطالب: يحللون بيانات ورقة العمل.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لمعدل النبض أثناء التمرين؟<\/td><td>يزداد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يزداد معدل ضربات القلب أثناء التمرين؟<\/td><td>لنقل مزيد من الأكسجين والغلوكوز إلى العضلات للتنفس الخلوي، والتخلص من ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>طالبان: الأول يعود نبضه للراحة بعد 3 دقائق والثاني بعد 7 دقائق. ماذا تستنتج؟<\/td><td>الأول أكثر لياقة؛ لأن قلبه يستعيد معدله الطبيعي أسرع.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث لمعدل النبض أثناء التمرين؟\nالإجابة النموذجية: يزداد.\n\n2) [المستوى المتوقع] لماذا يزداد معدل ضربات القلب أثناء التمرين؟\nالإجابة النموذجية: لنقل مزيد من الأكسجين والغلوكوز إلى العضلات للتنفس الخلوي، والتخلص من ثاني أكسيد الكربون.\n\n3) [المستوى المتقدم] طالبان: الأول يعود نبضه للراحة بعد 3 دقائق والثاني بعد 7 دقائق. ماذا تستنتج؟\nالإجابة النموذجية: الأول أكثر لياقة؛ لأن قلبه يستعيد معدله الطبيعي أسرع."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يعود معدل النبض إلى معدل الراحة فور توقف التمرين.<\/td><td>خطأ؛ يعود تدريجيًا خلال دقائق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المتغير المستقل في النشاط 2-1؟<\/td><td>شدة النشاط البدني أو مدته.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لجعل نتائج النشاط أكثر موثوقية.<\/td><td>تكرار القياس عدة مرات وأخذ المتوسط، وقياس النبض لمدة دقيقة كاملة، وتوحيد نوع التمرين ومدته.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يعود معدل النبض إلى معدل الراحة فور توقف التمرين.\nالإجابة النموذجية: خطأ؛ يعود تدريجيًا خلال دقائق.\n\n2) [المستوى المتوقع] ما المتغير المستقل في النشاط 2-1؟\nالإجابة النموذجية: شدة النشاط البدني أو مدته.\n\n3) [المستوى المتقدم] اقترح طريقة لجعل نتائج النشاط أكثر موثوقية.\nالإجابة النموذجية: تكرار القياس عدة مرات وأخذ المتوسط، وقياس النبض لمدة دقيقة كاملة، وتوحيد نوع التمرين ومدته."},{"h":"<p>إكمال ورقة العمل 1-1 نبض القلب في كتاب النشاط ص 18–19 وتمرين 2-1 قلب الجنين ص 14، والإجابة عن الأسئلة 14-1 إلى 16-1 والأسئلة 2 و4 و5 و6 من أسئلة نهاية الوحدة.<\/p>","t":"إكمال ورقة العمل 1-1 نبض القلب في كتاب النشاط ص 18–19 وتمرين 2-1 قلب الجنين ص 14، والإجابة عن الأسئلة 14-1 إلى 16-1 والأسئلة 2 و4 و5 و6 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-1 القلب<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 17–21 | كتاب النشاط: تمرين 2-1 ص 14، تمرين 3-1 ص 15، ورقة العمل 1-1 ص 18–19<\/div><div><b>دليل المعلم:<\/b> ص 22<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><ol class=\"ol\"><li>يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية.<\/li><li>يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد أجزاء القلب على قلب حقيقي أو نموذج.<\/div><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><ol class=\"ol\"><li>يصف آلية عمل القلب من خلال انقباض عضلات الأذينين والبطينين وعمل الصمامات.<\/li><li>يصف مرض القلب التاجي بانسداد الشرايين التاجية ويذكر عوامل خطره: النظام الغذائي والإجهاد والتدخين والاستعداد الوراثي والسن والجنس.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يذكر أن الدم يُضخ من القلب في الشرايين ويعود إليه عبر الأوردة.<\/div><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><ol class=\"ol\"><li>يستقصي ويحدد تأثير النشاط البدني على معدل النبض.<\/li><li>يشرح تأثير النشاط البدني على معدل ضربات القلب.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يمثل نتائج قياس النبض بيانيًا ويستخلص منها استنتاجًا.<\/div>","t":"الحصة 1: تركيب القلب\n1. يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية.\n2. يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن.\nمخرج تعليمي آخر: يحدد أجزاء القلب على قلب حقيقي أو نموذج.\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\n1. يصف آلية عمل القلب من خلال انقباض عضلات الأذينين والبطينين وعمل الصمامات.\n2. يصف مرض القلب التاجي بانسداد الشرايين التاجية ويذكر عوامل خطره: النظام الغذائي والإجهاد والتدخين والاستعداد الوراثي والسن والجنس.\nمخرج تعليمي آخر: يذكر أن الدم يُضخ من القلب في الشرايين ويعود إليه عبر الأوردة.\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\n1. يستقصي ويحدد تأثير النشاط البدني على معدل النبض.\n2. يشرح تأثير النشاط البدني على معدل ضربات القلب.\nمخرج تعليمي آخر: يمثل نتائج قياس النبض بيانيًا ويستخلص منها استنتاجًا."},{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يسمي أجزاء القلب في الثدييات ويحددها: الجدار العضلي والحاجز والأذينين والبطينين والصمامات أحادية الاتجاه والشرايين التاجية.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر سماكة جدار البطين الأيسر مقارنة بالأيمن.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد أجزاء القلب على قلب حقيقي أو نموذج.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف آلية عمل القلب من خلال انقباض عضلات
