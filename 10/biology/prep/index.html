 الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الرسم على السبورة الذكية.<\/td><td>يصفون الاتجاه.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">ورقة العمل 2-2 تدخين السجائر وسرطان الرئة (كتاب النشاط ص 28–29)<\/td><td>يوجه إلى تمثيل البيانات وتحليلها.<\/td><td>يرسمون البيانات ويصفون العلاقة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الارتباط والسببية<\/td><td>يناقش الأدلة العلمية التي أثبتت أن التدخين سبب لا مجرد ارتباط.<\/td><td>يقيّمون عبارات مقترحة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤال 7 من أسئلة نهاية الوحدة<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 6: حملة توعية ومراجعة الوحدة الثانية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الإعلان على السبورة الذكية.<\/td><td>يحددون عناصر التأثير.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">مشروع مصغر: ملصق توعوي<\/td><td>يكلف كل مجموعة بملصق يربط مكونًا من مكونات الدخان بمرض.<\/td><td>يصممون الملصق بمعلومات علمية دقيقة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الثانية (السؤال 8 – كتاب الطالب ص 51)<\/td><td>يتابع الحل.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات دخان التبغ السامة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) مكونات الدخان (كتاب الطالب ص 42–44)\nدور المعلم: يعرض مقطعًا تعليميًا عن تجربة «الآلة المدخنة» وتراكم القطران على القطن.\nدور الطالب: يدونون المكونات الثلاثة وخصائصها.\n\n(13 دقيقة) بطاقات الخبراء\nدور المعلم: يقسم الطلبة إلى ثلاث مجموعات: أول أكسيد الكربون، والنيكوتين، والقطران.\nدور الطالب: تعد كل مجموعة بطاقة: المادة، طبيعتها، أين تؤثر.\n\n(5 دقائق) عرض البطاقات\nدور المعلم: يدير العرض.\nدور الطالب: يعرضون بطاقاتهم.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) أول أكسيد الكربون (كتاب الطالب ص 44–45)\nدور المعلم: يوضح على السبورة الذكية ارتباط أول أكسيد الكربون بالهيموجلوبين بقوة فيقل ما يُنقل من الأكسجين.\nدور الطالب: يرسمون مخططًا لخلية دم حمراء مع الأكسجين وأول أكسيد الكربون.\n\n(10 دقائق) النيكوتين\nدور المعلم: يشرح أن النيكوتين يرفع معدل ضربات القلب وضغط الدم ويضيق الأوعية.\nدور الطالب: يربطون ذلك بإجهاد القلب.\n\n(7 دقائق) ورقة العمل 1-2 تدخين السجائر (كتاب النشاط ص 27)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) القطران والأهداب (كتاب الطالب ص 45–46)\nدور المعلم: يعرض مقطعًا عن تلف الأهداب وتراكم المخاط.\nدور الطالب: يربطون تلف الأهداب بتراكم المخاط والسعال والالتهابات.\n\n(10 دقائق) سرطان الرئة\nدور المعلم: يوضح أن القطران يحتوي مواد مسرطنة تسبب انقسامًا غير منضبط للخلايا.\nدور الطالب: يرسمون سلسلة السبب والنتيجة من القطران حتى الورم.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 4: مرض الانسداد الرئوي المزمن\n(5 دقائق) التهيئة\nدور المعلم: يعرض النموذج.\nدور الطالب: يستنتجون أن البالونات الصغيرة الكثيرة أكبر مساحة.\n\n(12 دقيقة) المرض وأثره (كتاب الطالب ص 46–48)\nدور المعلم: يعرض على السبورة الذكية صورتين لنسيج رئة سليم وآخر مصاب.\nدور الطالب: يصفون تهدم الجدران وتكوّن فراغات كبيرة.\n\n(10 دقائق) الربط بتبادل الغازات\nدور المعلم: يوجه إلى الربط بخصائص أسطح التبادل.\nدور الطالب: يستنتجون نقص الأكسجين وضيق التنفس.\n\n(8 دقائق) دراسة حالة\nدور المعلم: يعرض حالة مريض مدخن يعاني ضيق تنفس مزمنًا.\nدور الطالب: يحللون الأعراض ويقترحون نصائح.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 5: تحليل بيانات التدخين وسرطان الرئة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الرسم على السبورة الذكية.\nدور الطالب: يصفون الاتجاه.\n\n(15 دقيقة) ورقة العمل 2-2 تدخين السجائر وسرطان الرئة (كتاب النشاط ص 28–29)\nدور المعلم: يوجه إلى تمثيل البيانات وتحليلها.\nدور الطالب: يرسمون البيانات ويصفون العلاقة.\n\n(10 دقائق) الارتباط والسببية\nدور المعلم: يناقش الأدلة العلمية التي أثبتت أن التدخين سبب لا مجرد ارتباط.\nدور الطالب: يقيّمون عبارات مقترحة.\n\n(5 دقائق) السؤال 7 من أسئلة نهاية الوحدة\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 6: حملة توعية ومراجعة الوحدة الثانية\n(5 دقائق) التهيئة\nدور المعلم: يعرض الإعلان على السبورة الذكية.\nدور الطالب: يحددون عناصر التأثير.\n\n(13 دقيقة) مشروع مصغر: ملصق توعوي\nدور المعلم: يكلف كل مجموعة بملصق يربط مكونًا من مكونات الدخان بمرض.\nدور الطالب: يصممون الملصق بمعلومات علمية دقيقة.\n\n(10 دقائق) أسئلة نهاية الوحدة الثانية (السؤال 8 – كتاب الطالب ص 51)\nدور المعلم: يتابع الحل.\nدور الطالب: يحلون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاث مواد سامة في دخان التبغ.<\/td><td>أول أكسيد الكربون، والنيكوتين، والقطران.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي مكونات الدخان يسبب الإدمان؟<\/td><td>النيكوتين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تبدو رئة المدخن داكنة اللون؟<\/td><td>بسبب تراكم القطران في أنسجة الرئتين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف يؤثر أول أكسيد الكربون في نقل الأكسجين؟<\/td><td>يرتبط بالهيموجلوبين فيقلل كمية الأكسجين التي ينقلها الدم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما أثر النيكوتين في معدل ضربات القلب؟<\/td><td>يزيده.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر ارتباط التدخين بزيادة خطر مرض القلب التاجي.<\/td><td>النيكوتين يرفع ضغط الدم ويضيق الأوعية، وأول أكسيد الكربون يقلل الأكسجين، فيُجهد القلب وتتضرر الشرايين التاجية.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما أثر القطران في الأهداب؟<\/td><td>يشلها ويتلفها فتتوقف عن إزالة المخاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المرض الذي تسببه المواد المسرطنة في القطران؟<\/td><td>سرطان الرئة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر سعال المدخن الصباحي.<\/td><td>تتلف الأهداب فيتراكم المخاط ليلًا، فيسعل المدخن صباحًا لإخراجه.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: مرض الانسداد الرئوي المزمن<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المرض الذي يسبب تهدم جدران الحويصلات لدى المدخنين؟<\/td><td>مرض الانسداد الرئوي المزمن.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يحدث للمساحة السطحية لتبادل الغازات عند تهدم جدران الحويصلات؟<\/td><td>تقل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يعاني مريض الانسداد الرئوي المزمن ضيق التنفس حتى عند المجهود البسيط؟<\/td><td>لأن نقص المساحة السطحية وانسداد المجاري يقللان الأكسجين الواصل إلى الدم.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: تحليل بيانات التدخين وسرطان الرئة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما العلاقة بين عدد السجائر اليومية وخطر سرطان الرئة؟<\/td><td>كلما زاد عدد السجائر زاد خطر الإصابة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الفرق بين الارتباط والسببية؟<\/td><td>الارتباط تغير متغيرين معًا، والسببية أن تغير أحدهما يسبب تغير الآخر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُصاب بعض غير المدخنين بسرطان الرئة؟<\/td><td>لوجود عوامل أخرى مثل التدخين السلبي والتلوث والعوامل الوراثية؛ فالتدخين يزيد الخطر ولا يفسر كل الحالات.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 6: حملة توعية ومراجعة الوحدة الثانية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة أمراض يسببها التدخين.<\/td><td>سرطان الرئة، ومرض الانسداد الرئوي المزمن، ومرض القلب التاجي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اربط كل مكون بأثره: أول أكسيد الكربون، النيكوتين، القطران.<\/td><td>أول أكسيد الكربون يقلل نقل الأكسجين، والنيكوتين يسبب الإدمان ويرفع ضغط الدم، والقطران يتلف الأهداب ويسبب السرطان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم عبارة توعوية قصيرة دقيقة علميًا عن التدخين.<\/td><td>مثال: «القطران يشل أهداب رئتيك فيبقى الغبار والميكروبات فيها».<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات دخان التبغ السامة\n1) [مستوى الدعم] اذكر ثلاث مواد سامة في دخان التبغ.\nالإجابة النموذجية: أول أكسيد الكربون، والنيكوتين، والقطران.\n\n2) [المستوى المتوقع] أي مكونات الدخان يسبب الإدمان؟\nالإجابة النموذجية: النيكوتين.\n\n3) [المستوى المتقدم] لماذا تبدو رئة المدخن داكنة اللون؟\nالإجابة النموذجية: بسبب تراكم القطران في أنسجة الرئتين.\n\nالحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب\n1) [مستوى الدعم] كيف يؤثر أول أكسيد الكربون في نقل الأكسجين؟\nالإجابة النموذجية: يرتبط بالهيموجلوبين فيقلل كمية الأكسجين التي ينقلها الدم.\n\n2) [المستوى المتوقع] ما أثر النيكوتين في معدل ضربات القلب؟\nالإجابة النموذجية: يزيده.\n\n3) [المستوى المتقدم] فسّر ارتباط التدخين بزيادة خطر مرض القلب التاجي.\nالإجابة النموذجية: النيكوتين يرفع ضغط الدم ويضيق الأوعية، وأول أكسيد الكربون يقلل الأكسجين، فيُجهد القلب وتتضرر الشرايين التاجية.\n\nالحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان\n1) [مستوى الدعم] ما أثر القطران في الأهداب؟\nالإجابة النموذجية: يشلها ويتلفها فتتوقف عن إزالة المخاط.\n\n2) [المستوى المتوقع] ما المرض الذي تسببه المواد المسرطنة في القطران؟\nالإجابة النموذجية: سرطان الرئة.\n\n3) [المستوى المتقدم] فسّر سعال المدخن الصباحي.\nالإجابة النموذجية: تتلف الأهداب فيتراكم المخاط ليلًا، فيسعل المدخن صباحًا لإخراجه.\n\nالحصة 4: مرض الانسداد الرئوي المزمن\n1) [مستوى الدعم] ما المرض الذي يسبب تهدم جدران الحويصلات لدى المدخنين؟\nالإجابة النموذجية: مرض الانسداد الرئوي المزمن.\n\n2) [المستوى المتوقع] ماذا يحدث للمساحة السطحية لتبادل الغازات عند تهدم جدران الحويصلات؟\nالإجابة النموذجية: تقل.\n\n3) [المستوى المتقدم] لماذا يعاني مريض الانسداد الرئوي المزمن ضيق التنفس حتى عند المجهود البسيط؟\nالإجابة النموذجية: لأن نقص المساحة السطحية وانسداد المجاري يقللان الأكسجين الواصل إلى الدم.\n\nالحصة 5: تحليل بيانات التدخين وسرطان الرئة\n1) [مستوى الدعم] ما العلاقة بين عدد السجائر اليومية وخطر سرطان الرئة؟\nالإجابة النموذجية: كلما زاد عدد السجائر زاد خطر الإصابة.\n\n2) [المستوى المتوقع] ما الفرق بين الارتباط والسببية؟\nالإجابة النموذجية: الارتباط تغير متغيرين معًا، والسببية أن تغير أحدهما يسبب تغير الآخر.\n\n3) [المستوى المتقدم] لماذا يُصاب بعض غير المدخنين بسرطان الرئة؟\nالإجابة النموذجية: لوجود عوامل أخرى مثل التدخين السلبي والتلوث والعوامل الوراثية؛ فالتدخين يزيد الخطر ولا يفسر كل الحالات.\n\nالحصة 6: حملة توعية ومراجعة الوحدة الثانية\n1) [مستوى الدعم] اذكر ثلاثة أمراض يسببها التدخين.\nالإجابة النموذجية: سرطان الرئة، ومرض الانسداد الرئوي المزمن، ومرض القلب التاجي.\n\n2) [المستوى المتوقع] اربط كل مكون بأثره: أول أكسيد الكربون، النيكوتين، القطران.\nالإجابة النموذجية: أول أكسيد الكربون يقلل نقل الأكسجين، والنيكوتين يسبب الإدمان ويرفع ضغط الدم، والقطران يتلف الأهداب ويسبب السرطان.\n\n3) [المستوى المتقدم] صمم عبارة توعوية قصيرة دقيقة علميًا عن التدخين.\nالإجابة النموذجية: مثال: «القطران يشل أهداب رئتيك فيبقى الغبار والميكروبات فيها»."},{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المادة اللزجة السوداء في دخان التبغ هي .........<\/td><td>القطران.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: أول أكسيد الكربون غاز له لون ورائحة واضحان.<\/td><td>خطأ؛ عديم اللون والرائحة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يصعب على المدخن الإقلاع عن التدخين؟<\/td><td>لأن النيكوتين مادة تسبب الإدمان.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يرتبط أول أكسيد الكربون بـ ......... في خلايا الدم الحمراء.<\/td><td>الهيموجلوبين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يتعب المدخن بسرعة عند ممارسة الرياضة؟<\/td><td>لأن دمه ينقل أكسجينًا أقل إلى العضلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد تدخين الحامل خطرًا على الجنين؟<\/td><td>لأن أول أكسيد الكربون يقلل الأكسجين الواصل إلى الجنين، ويمكن أن تعبر بعض المواد كالنيكوتين المشيمة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يحتوي القطران على مواد مسرطنة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: ينتج السرطان عن انقسام ......... للخلايا.<\/td><td>غير منضبط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يزداد خطر الالتهابات الصدرية لدى المدخنين؟<\/td><td>لأن المخاط المحمل بالبكتيريا يتراكم ولا تزيله الأهداب التالفة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 4: مرض الانسداد الرئوي المزمن<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: أحد الأمراض التي يسببها التدخين ويؤثر في الحويصلات هو .........<\/td><td>مرض الانسداد الرئوي المزمن.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يمكن أن تعود الحويصلات المتهدمة إلى حالتها الطبيعية تمامًا.<\/td><td>خطأ؛ التلف دائم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُنصح المدخن بالإقلاع مبكرًا حتى لو لم تظهر عليه أعراض؟<\/td><td>لأن التلف تراكمي ودائم، والإقلاع المبكر يوقف تفاقمه ويقلل خطر الأمراض.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 5: تحليل بيانات التدخين وسرطان الرئة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يقل خطر الإصابة بسرطان الرئة بعد الإقلاع عن التدخين مع مرور السنين.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما نوع الرسم الأنسب لتمثيل عدد السجائر مقابل نسبة الإصابة؟<\/td><td>رسم بياني خطي أو أعمدة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قيّم العبارة: «جدي دخن طوال حياته ولم يصب بالسرطان، إذن التدخين غير ضار».<\/td><td>عبارة خاطئة؛ الحالة الفردية لا تنفي النتائج الإحصائية التي تثبت زيادة الخطر لدى المدخنين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 6: حملة توعية ومراجعة الوحدة الثانية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحدث عملية تبادل الغازات في .........<\/td><td>الحويصلات الهوائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يحمي المجاري التنفسية من الغبار؟<\/td><td>المخاط الذي تفرزه الخلايا الكأسية والأهداب التي تدفعه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التدخين ضارًا بجهاز تبادل الغازات وجهاز النقل معًا؟<\/td><td>لأنه يتلف الحويصلات والأهداب ويقلل كفاءة تبادل الغازات، ويقلل نقل الأكسجين بالدم ويضر القلب والشرايين.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات دخان التبغ السامة\n1) [مستوى الدعم] أكمل: المادة اللزجة السوداء في دخان التبغ هي .........\nالإجابة النموذجية: القطران.\n\n2) [المستوى المتوقع] صواب أم خطأ: أول أكسيد الكربون غاز له لون ورائحة واضحان.\nالإجابة النموذجية: خطأ؛ عديم اللون والرائحة.\n\n3) [المستوى المتقدم] لماذا يصعب على المدخن الإقلاع عن التدخين؟\nالإجابة النموذجية: لأن النيكوتين مادة تسبب الإدمان.\n\nالحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب\n1) [مستوى الدعم] أكمل: يرتبط أول أكسيد الكربون بـ ......... في خلايا الدم الحمراء.\nالإجابة النموذجية: الهيموجلوبين.\n\n2) [المستوى المتوقع] لماذا يتعب المدخن بسرعة عند ممارسة الرياضة؟\nالإجابة النموذجية: لأن دمه ينقل أكسجينًا أقل إلى العضلات.\n\n3) [المستوى المتقدم] لماذا يُعد تدخين الحامل خطرًا على الجنين؟\nالإجابة النموذجية: لأن أول أكسيد الكربون يقلل الأكسجين الواصل إلى الجنين، ويمكن أن تعبر بعض المواد كالنيكوتين المشيمة.\n\nالحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان\n1) [مستوى الدعم] صواب أم خطأ: يحتوي القطران على مواد مسرطنة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أكمل: ينتج السرطان عن انقسام ......... للخلايا.\nالإجابة النموذجية: غير منضبط.\n\n3) [المستوى المتقدم] لماذا يزداد خطر الالتهابات الصدرية لدى المدخنين؟\nالإجابة النموذجية: لأن المخاط المحمل بالبكتيريا يتراكم ولا تزيله الأهداب التالفة.\n\nالحصة 4: مرض الانسداد الرئوي المزمن\n1) [مستوى الدعم] أكمل: أحد الأمراض التي يسببها التدخين ويؤثر في الحويصلات هو .........\nالإجابة النموذجية: مرض الانسداد الرئوي المزمن.\n\n2) [المستوى المتوقع] صواب أم خطأ: يمكن أن تعود الحويصلات المتهدمة إلى حالتها الطبيعية تمامًا.\nالإجابة النموذجية: خطأ؛ التلف دائم.\n\n3) [المستوى المتقدم] لماذا يُنصح المدخن بالإقلاع مبكرًا حتى لو لم تظهر عليه أعراض؟\nالإجابة النموذجية: لأن التلف تراكمي ودائم، والإقلاع المبكر يوقف تفاقمه ويقلل خطر الأمراض.\n\nالحصة 5: تحليل بيانات التدخين وسرطان الرئة\n1) [مستوى الدعم] صواب أم خطأ: يقل خطر الإصابة بسرطان الرئة بعد الإقلاع عن التدخين مع مرور السنين.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما نوع الرسم الأنسب لتمثيل عدد السجائر مقابل نسبة الإصابة؟\nالإجابة النموذجية: رسم بياني خطي أو أعمدة.\n\n3) [المستوى المتقدم] قيّم العبارة: «جدي دخن طوال حياته ولم يصب بالسرطان، إذن التدخين غير ضار».\nالإجابة النموذجية: عبارة خاطئة؛ الحالة الفردية لا تنفي النتائج الإحصائية التي تثبت زيادة الخطر لدى المدخنين.\n\nالحصة 6: حملة توعية ومراجعة الوحدة الثانية\n1) [مستوى الدعم] أكمل: تحدث عملية تبادل الغازات في .........\nالإجابة النموذجية: الحويصلات الهوائية.\n\n2) [المستوى المتوقع] ما الذي يحمي المجاري التنفسية من الغبار؟\nالإجابة النموذجية: المخاط الذي تفرزه الخلايا الكأسية والأهداب التي تدفعه.\n\n3) [المستوى المتقدم] لماذا يُعد التدخين ضارًا بجهاز تبادل الغازات وجهاز النقل معًا؟\nالإجابة النموذجية: لأنه يتلف الحويصلات والأهداب ويقلل كفاءة تبادل الغازات، ويقلل نقل الأكسجين بالدم ويضر القلب والشرايين."},{"h":"<div class=\"psub\">الحصة 1: مكونات دخان التبغ السامة<\/div><p>مراجعة كتاب الطالب ص 42–44، والبحث عن مخاطر التدخين السلبي ومناقشتها مع ولي الأمر.<\/p><div class=\"psub\">الحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب<\/div><p>إكمال ورقة العمل 1-2 تدخين السجائر في كتاب النشاط ص 27، ومراجعة كتاب الطالب ص 44–45.<\/p><div class=\"psub\">الحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان<\/div><p>مراجعة كتاب الطالب ص 45–46، وإعداد رسم يوضح أثر القطران في بطانة القصبة الهوائية.<\/p><div class=\"psub\">الحصة 4: مرض الانسداد الرئوي المزمن<\/div><p>مراجعة كتاب الطالب ص 46–48، والبحث عن خدمات الإقلاع عن التدخين المتاحة في سلطنة عُمان.<\/p><div class=\"psub\">الحصة 5: تحليل بيانات التدخين وسرطان الرئة<\/div><p>إكمال ورقة العمل 2-2 في كتاب النشاط ص 28–29، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الثانية.<\/p><div class=\"psub\">الحصة 6: حملة توعية ومراجعة الوحدة الثانية<\/div><p>إكمال الملصق التوعوي وعرضه في المدرسة، والإجابة عن السؤال 8 من أسئلة نهاية الوحدة الثانية، والاستعداد للوحدة الثالثة: التكاثر في النبات (ص 52).<\/p>","t":"الحصة 1: مكونات دخان التبغ السامة\nمراجعة كتاب الطالب ص 42–44، والبحث عن مخاطر التدخين السلبي ومناقشتها مع ولي الأمر.\n\nالحصة 2: أثر أول أكسيد الكربون والنيكوتين في الدم والقلب\nإكمال ورقة العمل 1-2 تدخين السجائر في كتاب النشاط ص 27، ومراجعة كتاب الطالب ص 44–45.\n\nالحصة 3: القطران وأثره في الأهداب والإصابة بالسرطان\nمراجعة كتاب الطالب ص 45–46، وإعداد رسم يوضح أثر القطران في بطانة القصبة الهوائية.\n\nالحصة 4: مرض الانسداد الرئوي المزمن\nمراجعة كتاب الطالب ص 46–48، والبحث عن خدمات الإقلاع عن التدخين المتاحة في سلطنة عُمان.\n\nالحصة 5: تحليل بيانات التدخين وسرطان الرئة\nإكمال ورقة العمل 2-2 في كتاب النشاط ص 28–29، والإجابة عن السؤال 7 من أسئلة نهاية الوحدة الثانية.\n\nالحصة 6: حملة توعية ومراجعة الوحدة الثانية\nإكمال الملصق التوعوي وعرضه في المدرسة، والإجابة عن السؤال 8 من أسئلة نهاية الوحدة الثانية، والاستعداد للوحدة الثالثة: التكاثر في النبات (ص 52)."}]}},{"label":"1-3 التكاثر اللاجنسي والتكاثر الجنسي","unit":"الوحدة الثالثة: التكاثر في النبات","periods":[{"n":1,"focus":"التكاثر اللاجنسي وأمثلته","info":"<div><b>الدرس:<\/b> 1-3 التكاثر اللاجنسي والتكاثر الجنسي<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع التاسع (1–5/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 52–54 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 50<\/div><div><b>محور الحصة:<\/b> التكاثر اللاجنسي وأمثلته<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد.<\/li><li>يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر تماثل النسل الناتج جينيًا مع الأب.<\/div>","t":"1. يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد.\n2. يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة.\nمخرج تعليمي آخر: يفسر تماثل النسل الناتج جينيًا مع الأب."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر تماثل النسل الناتج جينيًا مع الأب.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد. ← فهم\n• يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة. ← فهم\n• يفسر تماثل النسل الناتج جينيًا مع الأب. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: درنة بطاطس مبرعمة، نبات فراولة بمداد، فصوص ثوم<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: درنة بطاطس مبرعمة، نبات فراولة بمداد، فصوص ثوم"},{"h":"<div class=\"pills\"><span>التكاثر اللاجنسي<\/span><span>النسل المتماثل جينيًا<\/span><span>الدرنات<\/span><span>المدادات<\/span><span>الانشطار الثنائي<\/span><\/div>","t":"التكاثر اللاجنسي، النسل المتماثل جينيًا، الدرنات، المدادات، الانشطار الثنائي"},{"h":"<p>يعرض درنة بطاطس نبتت منها براعم ويسأل: هل يحتاج هذا النبات الجديد إلى زهرة وبذرة؟<\/p>","t":"يعرض درنة بطاطس نبتت منها براعم ويسأل: هل يحتاج هذا النبات الجديد إلى زهرة وبذرة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الدرنة.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تعريف التكاثر اللاجنسي (كتاب الطالب ص 52–53)<\/td><td>يعرّف التكاثر اللاجنسي ويعرض على السبورة الذكية أمثلة: الانشطار الثنائي في البكتيريا، والتبرعم في الخميرة، والدرنات والمدادات.<\/td><td>يدونون التعريف ويصنفون الأمثلة.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">محطات العينات<\/td><td>يوزع عينات البطاطس والفراولة والثوم.<\/td><td>تفحص المجموعات العينات وتحدد الجزء الذي ينتج النبات الجديد.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التماثل الجيني<\/td><td>يناقش لماذا يكون النسل نسخًا جينية من الأب.<\/td><td>يفسرون بأن النسل ينتج من انقسام خلايا فرد واحد.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الدرنة.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) تعريف التكاثر اللاجنسي (كتاب الطالب ص 52–53)\nدور المعلم: يعرّف التكاثر اللاجنسي ويعرض على السبورة الذكية أمثلة: الانشطار الثنائي في البكتيريا، والتبرعم في الخميرة، والدرنات والمدادات.\nدور الطالب: يدونون التعريف ويصنفون الأمثلة.\n\n(13 دقيقة) محطات العينات\nدور المعلم: يوزع عينات البطاطس والفراولة والثوم.\nدور الطالب: تفحص المجموعات العينات وتحدد الجزء الذي ينتج النبات الجديد.\n\n(5 دقائق) التماثل الجيني\nدور المعلم: يناقش لماذا يكون النسل نسخًا جينية من الأب.\nدور الطالب: يفسرون بأن النسل ينتج من انقسام خلايا فرد واحد.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف التكاثر اللاجنسي.<\/td><td>إنتاج نسل متماثل جينيًا من فرد واحد دون اندماج أمشاج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مثالين على التكاثر اللاجنسي في النباتات.<\/td><td>الدرنات في البطاطس، والمدادات في الفراولة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون نسل التكاثر اللاجنسي متماثلًا جينيًا مع الأب؟<\/td><td>لأنه ينتج من خلايا فرد واحد دون اندماج مادة وراثية من فرد آخر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عرّف التكاثر اللاجنسي.\nالإجابة النموذجية: إنتاج نسل متماثل جينيًا من فرد واحد دون اندماج أمشاج.\n\n2) [المستوى المتوقع] اذكر مثالين على التكاثر اللاجنسي في النباتات.\nالإجابة النموذجية: الدرنات في البطاطس، والمدادات في الفراولة.\n\n3) [المستوى المتقدم] لماذا يكون نسل التكاثر اللاجنسي متماثلًا جينيًا مع الأب؟\nالإجابة النموذجية: لأنه ينتج من خلايا فرد واحد دون اندماج مادة وراثية من فرد آخر."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يحتاج التكاثر اللاجنسي إلى ......... فقط.<\/td><td>فرد واحد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تتكاثر البكتيريا لاجنسيًا بالانشطار الثنائي.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مزارع زرع قطعًا من درنة بطاطس واحدة. ماذا تتوقع عن صفات النباتات الناتجة؟<\/td><td>متماثلة في صفاتها الوراثية مع النبات الأصلي.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يحتاج التكاثر اللاجنسي إلى ......... فقط.\nالإجابة النموذجية: فرد واحد.\n\n2) [المستوى المتوقع] صواب أم خطأ: تتكاثر البكتيريا لاجنسيًا بالانشطار الثنائي.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] مزارع زرع قطعًا من درنة بطاطس واحدة. ماذا تتوقع عن صفات النباتات الناتجة؟\nالإجابة النموذجية: متماثلة في صفاتها الوراثية مع النبات الأصلي."},{"h":"<p>مراجعة كتاب الطالب ص 52–53 والإجابة عن السؤالين 1-3 و2-3، وزراعة فص ثوم في كوب ماء بالمنزل ومتابعته.<\/p>","t":"مراجعة كتاب الطالب ص 52–53 والإجابة عن السؤالين 1-3 و2-3، وزراعة فص ثوم في كوب ماء بالمنزل ومتابعته."}]},{"n":2,"focus":"التكاثر الجنسي والأمشاج والزيج سئلة 3-3 إلى 5-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالزيجوت؟<\/td><td>الخلية الناتجة عن اندماج نواتي مشيجين (البويضة المخصبة).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل نواة المشيج أحادية أم ثنائية المجموعة الكروموسومية؟<\/td><td>أحادية المجموعة الكروموسومية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لعدد الكروموسومات في الأجيال لو كانت الأمشاج ثنائية المجموعة الكروموسومية؟<\/td><td>يتضاعف العدد في كل جيل؛ لذلك يجب أن تكون الأمشاج أحادية ليبقى العدد ثابتًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بالزيجوت؟\nالإجابة النموذجية: الخلية الناتجة عن اندماج نواتي مشيجين (البويضة المخصبة).\n\n2) [المستوى المتوقع] هل نواة المشيج أحادية أم ثنائية المجموعة الكروموسومية؟\nالإجابة النموذجية: أحادية المجموعة الكروموسومية.\n\n3) [المستوى المتقدم] ماذا يحدث لعدد الكروموسومات في الأجيال لو كانت الأمشاج ثنائية المجموعة الكروموسومية؟\nالإجابة النموذجية: يتضاعف العدد في كل جيل؛ لذلك يجب أن تكون الأمشاج أحادية ليبقى العدد ثابتًا."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: اندماج نواتي المشيجين يسمى .........<\/td><td>الإخصاب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: نسل التكاثر الجنسي متماثل جينيًا.<\/td><td>خطأ؛ مختلف جينيًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون نسل التكاثر الجنسي مختلفًا جينيًا؟<\/td><td>لأنه يحمل خليطًا من المادة الوراثية لأبوين مختلفين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: اندماج نواتي المشيجين يسمى .........\nالإجابة النموذجية: الإخصاب.\n\n2) [المستوى المتوقع] صواب أم خطأ: نسل التكاثر الجنسي متماثل جينيًا.\nالإجابة النموذجية: خطأ؛ مختلف جينيًا.\n\ الأسئلة 6-3 إلى 8-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر فرقًا بين التكاثر الجنسي واللاجنسي.<\/td><td>الجنسي يحتاج إلى أبوين وينتج نسلًا مختلفًا جينيًا، واللاجنسي يحتاج إلى فرد واحد وينتج نسلًا متماثلًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>نبات الفراولة يكوّن أزهارًا ومدادات. ما طريقة تكاثره؟<\/td><td>يتكاثر بالطريقتين: جنسيًا بالأزهار ولاجنسيًا بالمدادات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كائن ينتج نسلًا متطابقًا معه من خلية واحدة دون أمشاج. صنّف تكاثره وبرر.<\/td><td>لاجنسي؛ لوجود أب واحد وغياب الأمشاج والإخصاب وتماثل النسل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر فرقًا بين التكاثر الجنسي واللاجنسي.\nالإجابة النموذجية: الجنسي يحتاج إلى أبوين وينتج نسلًا مختلفًا جينيًا، واللاجنسي يحتاج إلى فرد واحد وينتج نسلًا متماثلًا.\n\n2) [المستوى المتوقع] نبات الفراولة يكوّن أزهارًا ومدادات. ما طريقة تكاثره؟\nالإجابة النموذجية: يتكاثر بالطريقتين: جنسيًا بالأزهار ولاجنسيًا بالمدادات.\n\n3) [المستوى المتقدم] كائن ينتج نسلًا متطابقًا معه من خلية واحدة دون أمشاج. صنّف تكاثره وبرر.\nالإجابة النموذجية: لاجنسي؛ لوجود أب واحد وغياب الأمشاج والإخصاب وتماثل النسل."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن لبعض النباتات أن تتكاثر جنسيًا ولاجنسيًا.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي التكاثرين يحتاج إلى إخصاب؟<\/td><td>التكاثر الجنسي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التكاثر الجنسي مصدرًا للتنوع بين أفراد النوع؟<\/td><td>لأن اندماج أمشاج من أبوين مختلفين ينتج تراكيب وراثية جديدة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يمكن لبعض النباتات أن تتكاثر جنسيًا ولاجنسيًا.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أي التكاثرين يحتاج إلى إخصاب؟\nالإجابة النموذجية: التكاثر الجنسي.\n\n3) [المستوى المتقدم] لماذا يُعد التكاثر الجنسي مصدرًا للتنوع بين أفراد النوع؟\nالإجابة النموذجية: لأن اندماج أمشاج من أبوين مختلفين ينتج تراكيب وراثية جديدة."},{"h":"<p>الإجابة عن الأسئلة 6-3 إلى 8-3 والسؤالين 1 و2 من أسئلة نهاية الوحدة الثالثة.<\/p>","t":"الإجابة عن الأسئلة 6-3 إلى 8-3 والسؤالين 1 و2 من أسئلة نهاية الوحدة الثالثة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-3 التكاثر اللاجنسي والتكاثر الجنسي<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع التاسع (1–5/11/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 52–54 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 50<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><ol class=\"ol\"><li>يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد.<\/li><li>يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر تماثل النسل الناتج جينيًا مع الأب.<\/div><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><ol class=\"ol\"><li>يعرّف التكاثر الجنسي بأنه إنتاج نسل مختلف جينيًا عن طريق دمج نواتي مشيجين من أبوين لتكوين الزيجوت.<\/li><li>يذكر أن نواة المشيج أحادية المجموعة الكروموسومية ونواة الزيجوت ثنائيتها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب كون الأمشاج أحادية المجموعة الكروموسومية.<\/div><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><ol class=\"ol\"><li>يفسر المعلومات لتحديد الكائنات الحية التي تتكاثر جنسيًا أو لاجنسيًا أو بالطريقتين.<\/li><li>يقارن بين التكاثرين من حيث عدد الأبوين والتماثل الجيني.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصنف أمثلة جديدة لم ترد في الكتاب.<\/div>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\n1. يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد.\n2. يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة.\nمخرج تعليمي آخر: يفسر تماثل النسل الناتج جينيًا مع الأب.\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\n1. يعرّف التكاثر الجنسي بأنه إنتاج نسل مختلف جينيًا عن طريق دمج نواتي مشيجين من أبوين لتكوين الزيجوت.\n2. يذكر أن نواة المشيج أحادية المجموعة الكروموسومية ونواة الزيجوت ثنائيتها.\nمخرج تعليمي آخر: يفسر سبب كون الأمشاج أحادية المجموعة الكروموسومية.\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\n1. يفسر المعلومات لتحديد الكائنات الحية التي تتكاثر جنسيًا أو لاجنسيًا أو بالطريقتين.\n2. يقارن بين التكاثرين من حيث عدد الأبوين والتماثل الجيني.\nمخرج تعليمي آخر: يصنف أمثلة جديدة لم ترد في الكتاب."},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر تماثل النسل الناتج جينيًا مع الأب.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف التكاثر الجنسي بأنه إنتاج نسل مختلف جينيًا عن طريق دمج نواتي مشيجين من أبوين لتكوين الزيجوت.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر أن نواة المشيج أحادية المجموعة الكروموسومية ونواة الزيجوت ثنائيتها.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر سبب كون الأمشاج أحادية المجموعة الكروموسومية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يفسر المعلومات لتحديد الكائنات الحية التي تتكاثر جنسيًا أو لاجنسيًا أو بالطريقتين.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقارن بين التكاثرين من حيث عدد الأبوين والتماثل الجيني.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصنف أمثلة جديدة لم ترد في الكتاب.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\n• يعرّف التكاثر اللاجنسي بأنه عملية إنتاج نسل متماثل جينيًا يقوم بها فرد واحد. ← فهم\n• يقدم أمثلة على التكاثر اللاجنسي في النباتات والكائنات الدقيقة. ← فهم\n• يفسر تماثل النسل الناتج جينيًا مع الأب. ← تحليل\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\n• يعرّف التكاثر الجنسي بأنه إنتاج نسل مختلف جينيًا عن طريق دمج نواتي مشيجين من أبوين لتكوين الزيجوت. ← فهم\n• يذكر أن نواة المشيج أحادية المجموعة الكروموسومية ونواة الزيجوت ثنائيتها. ← تذكر\n• يفسر سبب كون الأمشاج أحادية المجموعة الكروموسومية. ← تحليل\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\n• يفسر المعلومات لتحديد الكائنات الحية التي تتكاثر جنسيًا أو لاجنسيًا أو بالطريقتين. ← تحليل\n• يقارن بين التكاثرين من حيث عدد الأبوين والتماثل الجيني. ← تحليل\n• يصنف أمثلة جديدة لم ترد في الكتاب. ← تطبيق"},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><\/div><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم التشاركي\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\n• التعلم المبني على حل كاثر الجنسي والأمشاج والزيجوت\nالتكاثر الجنسي، المشيج، الزيجوت (اللاقحة)، الإخصاب، أحادي المجموعة الكروموسومية، ثنائي المجموعة الكروموسومية\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\nالتكاثر الجنسي، التكاثر اللاجنسي، التنوع الجيني، التصنيف"},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><p>يعرض درنة بطاطس نبتت منها براعم ويسأل: هل يحتاج هذا النبات الجديد إلى زهرة وبذرة؟<\/p><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><p>سؤال: لماذا لا يشبه الأبناء آباءهم تمامًا رغم التشابه الكبير؟<\/p><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><p>لعبة «جنسي أم لاجنسي؟»: بطاقات لكائنات مع وصف مختصر لطريقة تكاثرها.<\/p>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\nيعرض درنة بطاطس نبتت منها براعم ويسأل: هل يحتاج هذا النبات الجديد إلى زهرة وبذرة؟\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\nسؤال: لماذا لا يشبه الأبناء آباءهم تمامًا رغم التشابه الكبير؟\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\nلعبة «جنسي أم لاجنسي؟»: بطاقات لكائنات مع وصف مختصر لطريقة تكاثرها."},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الدرنة.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تعريف التكاثر اللاجنسي (كتاب الطالب ص 52–53)<\/td><td>يعرّف التكاثر اللاجنسي ويعرض على السبورة الذكية أمثلة: الانشطار الثنائي في البكتيريا، والتبرعم في الخميرة، والدرنات والمدادات.<\/td><td>يدونون التعريف ويصنفون الأمثلة.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">محطات العينات<\/td><td>يوزع عينات البطاطس والفراولة والثوم.<\/td><td>تفحص المجموعات العينات وتحدد الجزء الذي ينتج النبات الجديد.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التماثل الجيني<\/td><td>يناقش لماذا يكون النسل نسخًا جينية من الأب.<\/td><td>يفسرون بأن النسل ينتج من انقسام خلايا فرد واحد.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون أسبابًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">التكاثر الجنسي (كتاب الطالب ص 53–54)<\/td><td>يعرّف الأمشاج والإخصاب والزيجوت.<\/td><td>يدونون التعريفات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">نمذجة بالبطاقات<\/td><td>يوزع بطاقات كروموسومات: مجموعة من كل أب في كل مشيج.<\/td><td>يمثلون اندماج مشيجين ويستنتجون أن الزيجوت يعود ثنائي المجموعة الكروموسومية.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الأسئلة 3-3 إلى 5-3<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التهيئة: اللعبة<\/td><td>يعرض البطاقات على السبورة الذكية.<\/td><td>يصنفون بسرعة ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحليل حالات (كتاب الطالب ص 54)<\/td><td>يعرض حالات: نبات الفراولة الذي يكوّن أزهارًا ومدادات، والخميرة، والقمح.<\/td><td>يحددون طريقة التكاثر ويبررون من المعطيات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">الأسئلة 6-3 إلى 8-3<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\n(5 دقائق) التهيئة\nدور المعلم: يعرض الدرنة.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) تعريف التكاثر اللاجنسي (كتاب الطالب ص 52–53)\nدور المعلم: يعرّف التكاثر اللاجنسي ويعرض على السبورة الذكية أمثلة: الانشطار الثنائي في البكتيريا، والتبرعم في الخميرة، والدرنات والمدادات.\nدور الطالب: يدونون التعريف ويصنفون الأمثلة.\n\n(13 دقيقة) محطات العينات\nدور المعلم: يوزع عينات البطاطس والفراولة والثوم.\nدور الطالب: تفحص المجموعات العينات وتحدد الجزء الذي ينتج النبات الجديد.\n\n(5 دقائق) التماثل الجيني\nدور المعلم: يناقش لماذا يكون النسل نسخًا جينية من الأب.\nدور الطالب: يفسرون بأن النسل ينتج من انقسام خلايا فرد واحد.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون أسبابًا.\n\n(12 دقيقة) التكاثر الجنسي (كتاب الطالب ص 53–54)\nدور المعلم: يعرّف الأمشاج والإخصاب والزيجوت.\nدور الطالب: يدونون التعريفات.\n\n(13 دقيقة) نمذجة بالبطاقات\nدور المعلم: يوزع بطاقات كروموسومات: مجموعة من كل أب في كل مشيج.\nدور الطالب: يمثلون اندماج مشيجين ويستنتجون أن الزيجوت يعود ثنائي المجموعة الكروموسومية.\n\n(5 دقائق) الأسئلة 3-3 إلى 5-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\n(7 دقائق) التهيئة: اللعبة\nدور المعلم: يعرض البطاقات على السبورة الذكية.\nدور الطالب: يصنفون بسرعة ويبررون.\n\n(12 دقيقة) تحليل حالات (كتاب الطالب ص 54)\nدور المعلم: يعرض حالات: نبات الفراولة الذي يكوّن أزهارًا ومدادات، والخميرة، والقمح.\nدور الطالب: يحددون طريقة التكاثر ويبررون من المعطيات.\n\n(8 دقائق) الأسئلة 6-3 إلى 8-3\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف التكاثر اللاجنسي.<\/td><td>إنتاج نسل متماثل جينيًا من فرد واحد دون اندماج أمشاج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مثالين على التكاثر اللاجنسي في النباتات.<\/td><td>الدرنات في البطاطس، والمدادات في الفراولة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون نسل التكاثر اللاجنسي متماثلًا جينيًا مع الأب؟<\/td><td>لأنه ينتج من خلايا فرد واحد دون اندماج مادة وراثية من فرد آخر.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالزيجوت؟<\/td><td>الخلية الناتجة عن اندماج نواتي مشيجين (البويضة المخصبة).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل نواة المشيج أحادية أم ثنائية المجموعة الكروموسومية؟<\/td><td>أحادية المجموعة الكروموسومية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لعدد الكروموسومات في الأجيال لو كانت الأمشاج ثنائية المجموعة الكروموسومية؟<\/td><td>يتضاعف العدد في كل جيل؛ لذلك يجب أن تكون الأمشاج أحادية ليبقى العدد ثابتًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر فرقًا بين التكاثر الجنسي واللاجنسي.<\/td><td>الجنسي يحتاج إلى أبوين وينتج نسلًا مختلفًا جينيًا، واللاجنسي يحتاج إلى فرد واحد وينتج نسلًا متماثلًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>نبات الفراولة يكوّن أزهارًا ومدادات. ما طريقة تكاثره؟<\/td><td>يتكاثر بالطريقتين: جنسيًا بالأزهار ولاجنسيًا بالمدادات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كائن ينتج نسلًا متطابقًا معه من خلية واحدة دون أمشاج. صنّف تكاثره وبرر.<\/td><td>لاجنسي؛ لوجود أب واحد وغياب الأمشاج والإخصاب وتماثل النسل.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\n1) [مستوى الدعم] عرّف التكاثر اللاجنسي.\nالإجابة النموذجية: إنتاج نسل متماثل جينيًا من فرد واحد دون اندماج أمشاج.\n\n2) [المستوى المتوقع] اذكر مثالين على التكاثر اللاجنسي في النباتات.\nالإجابة النموذجية: الدرنات في البطاطس، والمدادات في الفراولة.\n\n3) [المستوى المتقدم] لماذا يكون نسل التكاثر اللاجنسي متماثلًا جينيًا مع الأب؟\nالإجابة النموذجية: لأنه ينتج من خلايا فرد واحد دون اندماج مادة وراثية من فرد آخر.\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\n1) [مستوى الدعم] ما المقصود بالزيجوت؟\nالإجابة النموذجية: الخلية الناتجة عن اندماج نواتي مشيجين (البويضة المخصبة).\n\n2) [المستوى المتوقع] هل نواة المشيج أحادية أم ثنائية المجموعة الكروموسومية؟\nالإجابة النموذجية: أحادية المجموعة الكروموسومية.\n\n3) [المستوى المتقدم] ماذا يحدث لعدد الكروموسومات في الأجيال لو كانت الأمشاج ثنائية المجموعة الكروموسومية؟\nالإجابة النموذجية: يتضاعف العدد في كل جيل؛ لذلك يجب أن تكون الأمشاج أحادية ليبقى العدد ثابتًا.\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\n1) [مستوى الدعم] اذكر فرقًا بين التكاثر الجنسي واللاجنسي.\nالإجابة النموذجية: الجنسي يحتاج إلى أبوين وينتج نسلًا مختلفًا جينيًا، واللاجنسي يحتاج إلى فرد واحد وينتج نسلًا متماثلًا.\n\n2) [المستوى المتوقع] نبات الفراولة يكوّن أزهارًا ومدادات. ما طريقة تكاثره؟\nالإجابة النموذجية: يتكاثر بالطريقتين: جنسيًا بالأزهار ولاجنسيًا بالمدادات.\n\n3) [المستوى المتقدم] كائن ينتج نسلًا متطابقًا معه من خلية واحدة دون أمشاج. صنّف تكاثره وبرر.\nالإجابة النموذجية: لاجنسي؛ لوجود أب واحد وغياب الأمشاج والإخصاب وتماثل النسل."},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يحتاج التكاثر اللاجنسي إلى ......... فقط.<\/td><td>فرد واحد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تتكاثر البكتيريا لاجنسيًا بالانشطار الثنائي.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مزارع زرع قطعًا من درنة بطاطس واحدة. ماذا تتوقع عن صفات النباتات الناتجة؟<\/td><td>متماثلة في صفاتها الوراثية مع النبات الأصلي.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: اندماج نواتي المشيجين يسمى .........<\/td><td>الإخصاب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: نسل التكاثر الجنسي متماثل جينيًا.<\/td><td>خطأ؛ مختلف جينيًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون نسل التكاثر الجنسي مختلفًا جينيًا؟<\/td><td>لأنه يحمل خليطًا من المادة الوراثية لأبوين مختلفين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن لبعض النباتات أن تتكاثر جنسيًا ولاجنسيًا.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي التكاثرين يحتاج إلى إخصاب؟<\/td><td>التكاثر الجنسي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التكاثر الجنسي مصدرًا للتنوع بين أفراد النوع؟<\/td><td>لأن اندماج أمشاج من أبوين مختلفين ينتج تراكيب وراثية جديدة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\n1) [مستوى الدعم] أكمل: يحتاج التكاثر اللاجنسي إلى ......... فقط.\nالإجابة النموذجية: فرد واحد.\n\n2) [المستوى المتوقع] صواب أم خطأ: تتكاثر البكتيريا لاجنسيًا بالانشطار الثنائي.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] مزارع زرع قطعًا من درنة بطاطس واحدة. ماذا تتوقع عن صفات النباتات الناتجة؟\nالإجابة النموذجية: متماثلة في صفاتها الوراثية مع النبات الأصلي.\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\n1) [مستوى الدعم] أكمل: اندماج نواتي المشيجين يسمى .........\nالإجابة النموذجية: الإخصاب.\n\n2) [المستوى المتوقع] صواب أم خطأ: نسل التكاثر الجنسي متماثل جينيًا.\nالإجابة النموذجية: خطأ؛ مختلف جينيًا.\n\n3) [المستوى المتقدم] لماذا يكون نسل التكاثر الجنسي مختلفًا جينيًا؟\nالإجابة النموذجية: لأنه يحمل خليطًا من المادة الوراثية لأبوين مختلفين.\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\n1) [مستوى الدعم] صواب أم خطأ: يمكن لبعض النباتات أن تتكاثر جنسيًا ولاجنسيًا.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] أي التكاثرين يحتاج إلى إخصاب؟\nالإجابة النموذجية: التكاثر الجنسي.\n\n3) [المستوى المتقدم] لماذا يُعد التكاثر الجنسي مصدرًا للتنوع بين أفراد النوع؟\nالإجابة النموذجية: لأن اندماج أمشاج من أبوين مختلفين ينتج تراكيب وراثية جديدة."},{"h":"<div class=\"psub\">الحصة 1: التكاثر اللاجنسي وأمثلته<\/div><p>مراجعة كتاب الطالب ص 52–53 والإجابة عن السؤالين 1-3 و2-3، وزراعة فص ثوم في كوب ماء بالمنزل ومتابعته.<\/p><div class=\"psub\">الحصة 2: التكاثر الجنسي والأمشاج والزيجوت<\/div><p>مراجعة كتاب الطالب ص 53–54 والإجابة عن الأسئلة 3-3 إلى 5-3.<\/p><div class=\"psub\">الحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات<\/div><p>الإجابة عن الأسئلة 6-3 إلى 8-3 والسؤالين 1 و2 من أسئلة نهاية الوحدة الثالثة.<\/p>","t":"الحصة 1: التكاثر اللاجنسي وأمثلته\nمراجعة كتاب الطالب ص 52–53 والإجابة عن السؤالين 1-3 و2-3، وزراعة فص ثوم في كوب ماء بالمنزل ومتابعته.\n\nالحصة 2: التكاثر الجنسي والأمشاج والزيجوت\nمراجعة كتاب الطالب ص 53–54 والإجابة عن الأسئلة 3-3 إلى 5-3.\n\nالحصة 3: تفسير المعلومات لتحديد طرق تكاثر الكائنات\nالإجابة عن الأسئلة 6-3 إلى 8-3 والسؤالين 1 و2 من أسئلة نهاية الوحدة الثالثة."}]}},{"label":"2-3 الأزهار","unit":"الوحدة الثالثة: التكاثر في النبات","periods":[{"n":1,"focus":"تركيب الزهرة الحشرية ووظائف أجزائها","info":"<div><b>الدرس:<\/b> 2-3 الأزهار<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>رقم الحصة:<\/b> الح ط لاصق<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• أخرى: أزهار حقيقية (مثل الكركديه)، عدسات مكبرة، ملاقط، مشارط، شريط لاصق"},{"h":"<div class=\"pills\"><span>السبلات<\/span><span>البتلات<\/span><span>الأسدية<\/span><span>المتك<\/span><span>الكربلة<\/span><span>الميسم<\/span><span>القلم<\/span><span>المبيض<\/span><span>البويضات<\/span><\/div>","t":"السبلات، البتلات، الأسدية، المتك، الكربلة، الميسم، القلم، المبيض، البويضات"},{"h":"<p>يعرض زهرة كركديه ويسأل: لماذا تكون بعض الأزهار ملونة وذات رائحة؟<\/p>","t":"يعرض زهرة كركديه ويسأل: لماذا تكون بعض الأزهار ملونة وذات رائحة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الزهرة.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 1-3 استقصاء تركيب الزهرة (كتاب الطالب)<\/td><td>يوجه إلى تشريح الزهرة من الخارج إلى الداخل ولصق الأجزاء في ورقة، مع الحذر عند استخدام المشرط.<\/td><td>يفصلون الأجزاء ويلصقونها ويسمونها ويفحصون المتك والميسم بالعدسة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">وظائف الأجزاء (كتاب الطالب ص 55–57)<\/td><td>يعرض على السبورة الذكية جدول الوظائف.<\/td><td>يكتبون وظيفة كل جزء بجانب العينة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 1-3 (البدء – كتاب النشاط ص 30)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الزهرة.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 1-3 استقصاء تركيب الزهرة (كتاب الطالب)\nدور المعلم: يوجه إلى تشريح الزهرة من الخارج إلى الداخل ولصق الأجزاء في ورقة، مع الحذر عند استخدام المشرط.\nدور الطالب: يفصلون الأجزاء ويلصقونها ويسمونها ويفحصون المتك والميسم بالعدسة.\n\n(8 دقائق) وظائف الأجزاء (كتاب الطالب ص 55–57)\nدور المعلم: يعرض على السبورة الذكية جدول الوظائف.\nدور الطالب: يكتبون وظيفة كل جزء بجانب العينة.\n\n(5 دقائق) تمرين 1-3 (البدء – كتاب النشاط ص 30)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة المتك؟<\/td><td>إنتاج حبوب اللقاح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الجزء الذي يستقبل حبوب اللقاح؟<\/td><td>الميسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما الذي يتكون داخل المبيض؟ وما الذي يتحول إليه بعد الإخصاب؟<\/td><td>البويضات، وتتحول إلى بذور، ويتحول المبيض إلى ثمرة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وظيفة المتك؟\nالإجابة النموذجية: إنتاج حبوب اللقاح.\n\n2) [المستوى المتوقع] ما الجزء الذي يستقبل حبوب اللقاح؟\nالإجابة النموذجية: الميسم.\n\n3) [المستوى المتقدم] ما الذي يتكون داخل المبيض؟ وما الذي يتحول إليه بعد الإخصاب؟\nالإجابة النموذجية: البويضات، وتتحول إلى بذور، ويتحول المبيض إلى ثمرة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحمي ......... الزهرة وهي برعم.<\/td><td>السبلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الأسدية هي الأعضاء الأنثوية في الزهرة.<\/td><td>خطأ؛ هي الأعضاء الذكرية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تكون البتلات في الأزهار الحشرية كبيرة وملونة؟<\/td><td>لجذب الحشرات التي تنقل حبوب اللقاح.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تحمي ......... الزهرة وهي برعم.\nالإجابة النموذجية: السبلات.\n\n2) [المستوى المتوقع] صواب أم خطأ: الأسدية هي الأعضاء الأنثوية في الزهرة.\nالإجابة النموذجية: خطأ؛ هي الأعضاء الذكرية.\n\n3) [المستوى المتقدم] لماذا تكون البتلات في الأزهار الحشرية كبيرة وملونة؟\nالإجابة النموذجية: لجذب الحشرات التي تنقل حبوب اللقاح."},{"h":"<p>مراجعة كت s\"><span>التعلم بالاكتشاف<\/span><span>التعلم التشاركي<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التشاركي\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: زهرة حشرية وأخرى ريحية (مثل الأعشاب)، عدسات مكبرة، صور مجهرية لحبوب اللقاح<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: زهرة حشرية وأخرى ريحية (مثل الأعشاب)، عدسات مكبرة، صور مجهرية لحبوب اللقاح"},{"h":"<div class=\"pills\"><span>التلقيح<\/span><span>الأزهار الحشرية<\/span><span>الأزهار الريحية<\/span><span>حبوب اللقاح<\/span><span>الميسم الريشي<\/span><span>الرحيق<\/span><\/div>","t":"التلقيح، الأزهار الحشرية، الأزهار الريحية، حبوب اللقاح، الميسم الريشي، الرحيق"},{"h":"<p>سؤال: الأعشاب في الحدائق أزهارها صغيرة باهتة بلا رائحة، فكيف تنتقل حبوب لقاحها؟<\/p>","t":"سؤال: الأعشاب في الحدائق أزهارها صغيرة باهتة بلا رائحة، فكيف تنتقل حبوب لقاحها؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-3 التلقيح (كتاب الطالب)<\/td><td>يوجه إلى مقارنة زهرة حشرية وزهرة ريحية بالعدسة وصور حبوب اللقاح.<\/td><td>يكملون جدول مقارنة: البتلات، الرائحة والرحيق، موضع المتوك والمياسم، شكل الميسم، حبوب اللقاح.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ربط التركيب بالتكيف (كتاب الطالب ص 58–59)<\/td><td>يناقش على السبورة الذكية سبب كل تكيف.<\/td><td>يفسرون التكيفات.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ورقة العمل 2-3 تكيفات التلقيح (كتاب النشاط ص 36)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 2-3 التلقيح (كتاب الطالب)\nدور المعلم: يوجه إلى مقارنة زهرة حشرية وزهرة ريحية بالعدسة وصور حبوب اللقاح.\nدور الطالب: يكملون جدول مقارنة: البتلات، الرائحة والرحيق، موضع المتوك والمياسم، شكل الميسم، حبوب اللقاح.\n\n(10 دقائق) ربط التركيب بالتكيف (كتاب الطالب ص 58–59)\nدور المعلم: يناقش على السبورة الذكية سبب كل تكيف.\nدور الطالب: يفسرون التكيفات.\n\n(5 دقائق) ورقة العمل 2-3 تكيفات التلقيح (كتاب النشاط ص 36)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف التلقيح.<\/td><td>انتقال حبوب اللقاح من المتك إلى الميسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر تكيفين في الأزهار الملقحة بالرياح.<\/td><td>مياسم ريشية متدلية خارج الزهرة، ومتوك متدلية، وحبوب لقاح خفيفة كثيرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تنتج الأزهار الريحية حبوب لقاح كثيرة جدًا؟<\/td><td>لأن معظمها يضيع في الهواء ولا يصل إلى المياسم، فالكثرة تزيد فرصة التلقيح.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عرّف التلقيح.\nالإجابة النموذجية: انتقال حبوب اللقاح من المتك إلى الميسم.\n\n2) [المستوى المتوقع] اذكر تكيفين في الأزهار الملقحة بالرياح.\nالإجابة النموذجية: مياسم ريشية متدلية خارج الزهرة، ومتوك متدلية، وحبوب لقاح خفيفة كثيرة.\n\n3) [المستوى المتقدم] لماذا تنتج الأزهار الريحية حبوب لقاح كثيرة جدًا؟\nالإجابة النموذجية: لأن معظمها يضيع في الهواء ولا يصل إلى المياسم، فالكثرة تزيد فرصة التلقيح."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: حبوب لقاح الأزهار الحشرية غالبًا ......... أو شائكة لتلتصق بالحشرات.<\/td><td>لزجة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الأزهار الريحية تنتج رحيقًا لجذب الحشرات.<\/td><td>خطأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زهرة صغيرة خضراء ميسمها ريشي ومتوكها خارج الزهرة. صنّفها وبرر.<\/td><td>ريحية التلقيح؛ لصغر بتلاتها وباهت لونها وشكل الميسم وموضع المتوك.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: حبوب لقاح الأزهار الحشرية غالبًا ......... أو شائكة لتلتصق بالحشرات.\nالإجابة النموذجية: لزجة.\n\n2) [المستوى المتوقع] صواب أم خطأ: الأزهار الريحية تنتج رحيقًا لجذب الحشرات.\nالإجابة النموذجية: خطأ.\n\n3) [المستوى المتقدم] زهرة صغيرة خضراء ميسمها ريشي ومتوكها خارج الزهرة. صنّفها وبرر.\nالإجابة النموذجية: ريحية التلقيح؛ لصغر بتلاتها وباهت لونها وشكل الميسم وموضع المتوك."},{"h":"<p>إكمال ورقة العمل 2-3 تكيفات التلقيح في كتاب النشاط ص 36 وتمرين 1-3 التلقيح في غابات مختلفة الأشكال والحجوم ص 30–33، والإجابة عن السؤالين 11-3 و12-3.<\/p>","t":"إكمال ورقة العمل 2-3 تكيفات التلقيح في كتاب النشاط ص 36 وتمرين 1-3 التلقيح في غابات مختلفة الأشكال والحجوم ص 30–33، والإجابة عن السؤالين 11-3 و12-3."}]},{"n":3,"focus":"الإخصاب في النبات وظروف إنبات البذور","info":"<div><b>الدرس:<\/b> 2-3 الأزهار<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 55–62 | كتاب النشاط: تمرين 1-3 ص 30–33، ورقة العمل 1-3 ص 35، ورقة العمل 2-3 ص 36<\/div><div><b>دليل المعلم:<\/b> ص 51–52<\/div><div><b>محور الحصة:<\/b> الإخصاب في النبات وظروف إنبات البذور<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة.<\/li><li>يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم تجربة لاختبار عامل واحد من عوامل الإنبات.<\/div>","t":"1. يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة.\n2. يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة.\nمخرج تعليمي آخر: يصمم تجربة لاختبار عامل واحد من عوامل الإنبات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصمم تجربة لاختبار عامل واحد من عوامل الإنبات.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"• يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة. ← تذكر\n• يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة. ← تحليل\n• يصمم تجربة لاختبار عامل واحد من عوامل الإنبات. ← إبداع"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: بذور طماطم أو فاصوليا، أطباق بتري، قطن، ماء مغلي مبرد، زيت، ثلاجة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بذور طماطم أو فاصوليا، أطباق بتري، قطن، ماء مغلي مبرد، زيت، ثلاجة"},{"h":"<div class=\"pills\"><span>الإخصاب<\/span><span>أنبوب اللقاح<\/span><span>الإنبات<\/span><span>الماء<\/span><span>الأكسجين<\/span><span>درجة الحرارة المناسبة<\/span><\/div>","t":"الإخصاب، أنبوب اللقاح، الإنبات، الماء، الأكسجين، درجة الحرارة المناسبة"},{"h":"<p>سؤال: لماذا لا تنبت البذور المحفوظة في علبتها الجافة في المطبخ؟<\/p>","t":"سؤال: لماذا لا تنبت البذور المحفوظة في علبتها الجافة في المطبخ؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">الإخصاب ونمو أنبوب اللقاح (كتاب الطالب ص 59–60)<\/td><td>يعرض على السبورة الذكية مخطط نمو أنبوب اللقاح عبر القلم حتى البويضة، ويشير إلى النشاط 3-3.<\/td><td>يرسمون المسار ويحددون موضع الإخصاب.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 4-3 التعرف على الظروف اللازمة لإنبات بذور الطماطم (كتاب الطالب)<\/td><td>يوجه المجموعات إلى إعداد أطباق: ماء ودفء، بلا ماء، ماء مغلي تحت الزيت، ثلاجة.<\/td><td>يعدون الأطباق ويكتبون توقعاتهم ويخططون للمتابعة.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(8 دقائق) الإخصاب ونمو أنبوب اللقاح (كتاب الطالب ص 59–60)\nدور المعلم: يعرض على السبورة الذكية مخطط نمو أنبوب اللقاح عبر القلم حتى البويضة، ويشير إلى النشاط 3-3.\nدور الطالب: يرسمون المسار ويحددون موضع الإخصاب.\n\n(15 دقيقة) النشاط 4-3 التعرف على الظروف اللازمة لإنبات بذور الطماطم (كتاب الطالب)\nدور المعلم: يوجه المجموعات إلى إعداد أطباق: ماء ودفء، بلا ماء، ماء مغلي تحت الزيت، ثلاجة.\nدور الطالب: يعدون الأطباق ويكتبون توقعاتهم ويخططون للمتابعة.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أين يحدث الإخصاب في الزهرة؟<\/td><td>داخل البويضة في المبيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الظروف الثلاثة اللازمة لإنبات البذور؟<\/td><td>الماء، والأكسجين، ودرجة الحرارة المناسبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا تنبت البذور في الماء المغلي المغطى بالزيت؟<\/td><td>لعدم وجود الأكسجين اللازم للتنفس الخلوي.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أين يحدث الإخصاب في الزهرة؟\nالإجابة النموذجية: داخل البويضة في المبيض.\n\n2) [المستوى المتوقع] ما الظروف الثلاثة اللازمة لإنبات البذور؟\nالإجابة النموذجية: الماء، والأكسجين، ودرجة الحرارة المناسبة.\n\n3) [المستوى المتقدم] لماذا لا تنبت البذور في الماء المغلي المغطى بالزيت؟\nالإجابة النموذجية: لعدم وجود الأكسجين اللازم للتنفس الخلوي."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ينمو ......... من حبة اللقاح عبر القلم حتى يصل إلى البويضة.<\/td><td>أنبوب اللقاح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الضوء ضروري لإنبات معظم البذور.<\/td><td>خطأ؛ ليس من الظروف الأساسية للإنبات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم تجربة لاختبار أثر درجة الحرارة في الإنبات مع تحديد المتغيرات.<\/td><td>المستقل: درجة الحرارة (ثلاجة، غرفة، حاضنة دافئة)؛ التابع: عدد البذور النابتة؛ الثوابت: نوع البذور وعددها وكمية الماء وتوفر الهواء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: ينمو ......... من حبة اللقاح عبر القلم حتى يصل إلى البويضة.\nالإجابة النموذجية: أنبوب اللقاح.\n\n2) [المستوى المتوقع] صواب أم خطأ: الضوء ضروري لإنبات معظم البذور.\nالإجابة النموذجية: خطأ؛ ليس من الظروف الأساسية للإنبات.\n\n3) [المستوى المتقدم] صمم تجربة لاختبار أثر درجة الحرارة في الإنبات مع تحديد المتغيرات.\nالإجابة النموذجية: المستقل: درجة الحرارة (ثلاجة، غرفة، حاضنة دافئة)؛ التابع: عدد البذور النابتة؛ الثوابت: نوع البذور وعددها وكمية الماء وتوفر الهواء."},{"h":"<p>متابعة أطباق النشاط 4-3 يوميًا وتسجيل النتائج، وحل ورقة العمل 1-3 التكاثر في النبات في كتاب النشاط ص 35، والإجابة عن السؤالين 13-3 و14-3 والأسئلة 4 و5 و6 من أسئلة نهاية الوحدة.<\/p>","t":"متابعة أطباق النشاط 4-3 يوميًا وتسجيل النتائج، وحل ورقة العمل 1-3 التكاثر في النبات في كتاب النشاط ص 35، والإجابة عن السؤالين 13-3 و14-3 والأسئلة 4 و5 و6 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-3 الأزهار<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 55–62 | كتاب النشاط: تمرين 1-3 ص 30–33، ورقة العمل 1-3 ص 35، ورقة العمل 2-3 ص 36<\/div><div><b>دليل المعلم:<\/b> ص 51–52<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><ol class=\"ol\"><li>يحدد السبلات والبتلات والأسدية (الخيوط والمتوك) والكرابل (الميسم والقلم والمبيض والبويضات) في الزهرة الملقحة بالحشرات ويرسمها.<\/li><li>يذكر وظائف السبلات والبتلات والمتوك والمياسم والمبايض.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستخدم العدسة المكبرة لتحديد التراكيب الدقيقة في الزهرة.<\/div><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><ol class=\"ol\"><li>يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم.<\/li><li>يصف التراكيب التكيفية في الأزهار الملقحة بالحشرات والملقحة بالرياح، ويميز بين حبوب لقاحهما.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد المتك والميسم في زهرة ملقحة بالرياح باستخدام العدسة المكبرة.<\/div><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><ol class=\"ol\"><li>يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة.<\/li><li>يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم تجربة لاختبار عامل واحد من عوامل الإنبات.<\/div>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\n1. يحدد السبلات والبتلات والأسدية (الخيوط والمتوك) والكرابل (الميسم والقلم والمبيض والبويضات) في الزهرة الملقحة بالحشرات ويرسمها.\n2. يذكر وظائف السبلات والبتلات والمتوك والمياسم والمبايض.\nمخرج تعليمي آخر: يستخدم العدسة المكبرة لتحديد التراكيب الدقيقة في الزهرة.\n\nالحصة 2: التلقيح بالحشرات وبالرياح\n1. يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم.\n2. يصف التراكيب التكيفية في الأزهار الملقحة بالحشرات والملقحة بالرياح، ويميز بين حبوب لقاحهما.\nمخرج تعليمي آخر: يحدد المتك والميسم في زهرة ملقحة بالرياح باستخدام العدسة المكبرة.\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\n1. يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة.\n2. يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة.\nمخرج تعليمي آخر: يصمم تجربة لاختبار عامل واحد من عوامل الإنبات."},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد السبلات والبتلات والأسدية (الخيوط والمتوك) والكرابل (الميسم والقلم والمبيض والبويضات) في الزهرة الملقحة بالحشرات ويرسمها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذكر وظائف السبلات والبتلات والمتوك والمياسم والمبايض.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يستخدم العدسة المكبرة لتحديد التراكيب الدقيقة في الزهرة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف التراكيب التكيفية في الأزهار الملقحة بالحشرات والملقحة بالرياح، ويميز بين حبوب لقاحهما.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يحدد المتك والميسم في زهرة ملقحة بالرياح باستخدام العدسة المكبرة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصمم تجربة لاختبار عامل واحد من عوامل الإنبات.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\n• يحدد السبلات والبتلات والأسدية (الخيوط والمتوك) والكرابل (الميسم والقلم والمبيض والبويضات) في الزهرة الملقحة بالحشرات ويرسمها. ← تطبيق\n• يذكر وظائف السبلات والبتلات والمتوك والمياسم والمبايض. ← تذكر\n• يستخدم العدسة المكبرة لتحديد التراكيب الدقيقة في الزهرة. ← تطبيق\n\nالحصة 2: التلقيح بالحشرات وبالرياح\n• يعرّف التلقيح بأنه انتقال حبوب اللقاح من المتك إلى الميسم. ← فهم\n• يصف التراكيب التكيفية في الأزهار الملقحة بالحشرات والملقحة بالرياح، ويميز بين حبوب لقاحهما. ← تحليل\n• يحدد المتك والميسم في زهرة ملقحة بالرياح باستخدام العدسة المكبرة. ← تطبيق\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\n• يحدد أن الإخصاب يحدث عندما تندمج نواة حبة اللقاح مع نواة البويضة. ← تذكر\n• يستقصي الظروف البيئية التي تؤثر في إنبات البذور ويذكرها: الماء والأكسجين ودرجة الحرارة المناسبة. ← تحليل\n• يصمم تجربة لاختبار عامل واحد من عوامل الإنبات. ← إبداع"},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التشاركي<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة\n\nالحصة 2: التلقيح بالحشرات وبالرياح\n• التعلم بالاكتشاف\n• التعلم التشاركي\n• التعلم التعاوني\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\n• التعلم بالاكتشاف\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><s
