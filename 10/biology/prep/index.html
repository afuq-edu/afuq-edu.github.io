=\"pills\"><span>انقباض الأذينين<\/span><span>انقباض البطينين<\/span><span>الصمامات أحادية الاتجاه<\/span><span>مرض القلب التاجي<\/span><span>عوامل الخطر<\/span><\/div><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><div class=\"pills\"><span>معدل النبض<\/span><span>النشاط البدني<\/span><span>التنفس الخلوي<\/span><span>زمن الاستشفاء<\/span><\/div>","t":"الحصة 1: تركيب القلب\nالأذين، البطين، الحاجز، الصمامات، الشرايين التاجية، الجدار العضلي\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\nانقباض الأذينين، انقباض البطينين، الصمامات أحادية الاتجاه، مرض القلب التاجي، عوامل الخطر\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\nمعدل النبض، النشاط البدني، التنفس الخلوي، زمن الاستشفاء"},{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><p>يعرض المعلم نموذجًا مجسمًا للقلب ويسأل: كم حجرة في قلب الإنسان؟ ولماذا يكون جانبه الأيسر أسمك؟<\/p><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><p>يستمع الطلبة إلى تسجيل لصوت ضربات القلب «لب – دب» ويسأل المعلم: ما مصدر هذين الصوتين؟<\/p><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><p>سؤال: لماذا يتسارع خفقان قلبك بعد صعود الدرج بسرعة؟<\/p>","t":"الحصة 1: تركيب القلب\nيعرض المعلم نموذجًا مجسمًا للقلب ويسأل: كم حجرة في قلب الإنسان؟ ولماذا يكون جانبه الأيسر أسمك؟\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\nيستمع الطلبة إلى تسجيل لصوت ضربات القلب «لب – دب» ويسأل المعلم: ما مصدر هذين الصوتين؟\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\nسؤال: لماذا يتسارع خفقان قلبك بعد صعود الدرج بسرعة؟"},{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض النموذج.<\/td><td>يتوقعون عدد الحجرات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">أجزاء القلب (كتاب الطالب ص 17–18)<\/td><td>يعرض على السبورة الذكية مقطعًا طوليًا في القلب ويسمي أجزاءه.<\/td><td>يرسمون المقطع ويسمون الأجزاء.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">النشاط 1-1 تشريح القلب (إثرائي)<\/td><td>ينفذ تشريحًا توضيحيًا لقلب خروف مع مراعاة قواعد السلامة والنظافة.<\/td><td>يحددون الحجرات والصمامات والشرايين التاجية ويقارنون سماكة جداري البطينين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">سماكة البطين الأيسر<\/td><td>يناقش ارتباط السماكة بالمسافة التي يُضخ إليها الدم.<\/td><td>يفسرون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يشغل التسجيل.<\/td><td>يتوقعون مصدر الصوت.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">دورة عمل القلب (كتاب الطالب ص 18–19)<\/td><td>يعرض مقطعًا يوضح انقباض الأذينين ثم البطينين وانغلاق الصمامات.<\/td><td>يرتبون مراحل ضخ الدم ويربطون الصوتين بانغلاق الصمامات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مرض القلب التاجي (كتاب الطالب ص 20)<\/td><td>يعرض صورة شريان تاجي مسدود ويناقش عوامل الخطر.<\/td><td>يصنفون عوامل الخطر إلى ما يمكن التحكم فيه وما لا يمكن.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 3-1 خطر الإصابة بنوبة قلبية (كتاب النشاط ص 15)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-1 تأثير ممارسة التمارين الرياضية على معدل ضربات القلب (كتاب الطالب)<\/td><td>يوجه إلى قياس النبض في الراحة ثم بعد تمرين خفيف آمن لمدة دقيقتين ثم كل دقيقة حتى العودة إلى الراحة.<\/td><td>يسجلون النتائج ويرسمون منحنى النبض مع الزمن.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التفسير وورقة العمل 1-1 نبض القلب (كتاب النشاط ص 18)<\/td><td>يربط ارتفاع النبض بحاجة العضلات إلى مزيد من الأكسجين والغلوكوز والتخلص من ثاني أكسيد الكربون.<\/td><td>يحللون بيانات ورقة العمل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص ويكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب القلب\n(5 دقائق) التهيئة\nدور المعلم: يعرض النموذج.\nدور الطالب: يتوقعون عدد الحجرات.\n\n(12 دقيقة) أجزاء القلب (كتاب الطالب ص 17–18)\nدور المعلم: يعرض على السبورة الذكية مقطعًا طوليًا في القلب ويسمي أجزاءه.\nدور الطالب: يرسمون المقطع ويسمون الأجزاء.\n\n(13 دقيقة) النشاط 1-1 تشريح القلب (إثرائي)\nدور المعلم: ينفذ تشريحًا توضيحيًا لقلب خروف مع مراعاة قواعد السلامة والنظافة.\nدور الطالب: يحددون الحجرات والصمامات والشرايين التاجية ويقارنون سماكة جداري البطينين.\n\n(5 دقائق) سماكة البطين الأيسر\nدور المعلم: يناقش ارتباط السماكة بالمسافة التي يُضخ إليها الدم.\nدور الطالب: يفسرون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\n(5 دقائق) التهيئة\nدور المعلم: يشغل التسجيل.\nدور الطالب: يتوقعون مصدر الصوت.\n\n(13 دقيقة) دورة عمل القلب (كتاب الطالب ص 18–19)\nدور المعلم: يعرض مقطعًا يوضح انقباض الأذينين ثم البطينين وانغلاق الصمامات.\nدور الطالب: يرتبون مراحل ضخ الدم ويربطون الصوتين بانغلاق الصمامات.\n\n(12 دقيقة) مرض القلب التاجي (كتاب الطالب ص 20)\nدور المعلم: يعرض صورة شريان تاجي مسدود ويناقش عوامل الخطر.\nدور الطالب: يصنفون عوامل الخطر إلى ما يمكن التحكم فيه وما لا يمكن.\n\n(5 دقائق) تمرين 3-1 خطر الإصابة بنوبة قلبية (كتاب النشاط ص 15)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 2-1 تأثير ممارسة التمارين الرياضية على معدل ضربات القلب (كتاب الطالب)\nدور المعلم: يوجه إلى قياس النبض في الراحة ثم بعد تمرين خفيف آمن لمدة دقيقتين ثم كل دقيقة حتى العودة إلى الراحة.\nدور الطالب: يسجلون النتائج ويرسمون منحنى النبض مع الزمن.\n\n(8 دقائق) التفسير وورقة العمل 1-1 نبض القلب (كتاب النشاط ص 18)\nدور المعلم: يربط ارتفاع النبض بحاجة العضلات إلى مزيد من الأكسجين والغلوكوز والتخلص من ثاني أكسيد الكربون.\nدور الطالب: يحللون بيانات ورقة العمل.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كم حجرة في قلب الإنسان؟ وما أسماؤها؟<\/td><td>أربع: أذين أيمن وأذين أيسر وبطين أيمن وبطين أيسر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الحاجز في القلب؟<\/td><td>فصل الجانب الأيمن عن الأيسر لمنع اختلاط الدم المؤكسج بغير المؤكسج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكون جدار البطين الأيسر أسمك من الأيمن؟<\/td><td>لأنه يضخ الدم إلى الجسم كله بضغط مرتفع، بينما يضخ الأيمن إلى الرئتين القريبتين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث عند انقباض البطينين؟<\/td><td>يُدفع الدم إلى الشرايين وتنغلق الصمامات بين الأذينين والبطينين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما سبب مرض القلب التاجي؟<\/td><td>انسداد الشرايين التاجية بترسبات دهنية فيقل وصول الدم إلى عضلة القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صنّف عوامل خطر مرض القلب التاجي إلى عوامل يمكن التحكم فيها وأخرى لا يمكن.<\/td><td>يمكن التحكم: النظام الغذائي والتدخين والإجهاد وقلة الحركة. لا يمكن: الاستعداد الوراثي والسن والجنس.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لمعدل النبض أثناء التمرين؟<\/td><td>يزداد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يزداد معدل ضربات القلب أثناء التمرين؟<\/td><td>لنقل مزيد من الأكسجين والغلوكوز إلى العضلات للتنفس الخلوي، والتخلص من ثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>طالبان: الأول يعود نبضه للراحة بعد 3 دقائق والثاني بعد 7 دقائق. ماذا تستنتج؟<\/td><td>الأول أكثر لياقة؛ لأن قلبه يستعيد معدله الطبيعي أسرع.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب القلب\n1) [مستوى الدعم] كم حجرة في قلب الإنسان؟ وما أسماؤها؟\nالإجابة النموذجية: أربع: أذين أيمن وأذين أيسر وبطين أيمن وبطين أيسر.\n\n2) [المستوى المتوقع] ما وظيفة الحاجز في القلب؟\nالإجابة النموذجية: فصل الجانب الأيمن عن الأيسر لمنع اختلاط الدم المؤكسج بغير المؤكسج.\n\n3) [المستوى المتقدم] لماذا يكون جدار البطين الأيسر أسمك من الأيمن؟\nالإجابة النموذجية: لأنه يضخ الدم إلى الجسم كله بضغط مرتفع، بينما يضخ الأيمن إلى الرئتين القريبتين.\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\n1) [مستوى الدعم] ماذا يحدث عند انقباض البطينين؟\nالإجابة النموذجية: يُدفع الدم إلى الشرايين وتنغلق الصمامات بين الأذينين والبطينين.\n\n2) [المستوى المتوقع] ما سبب مرض القلب التاجي؟\nالإجابة النموذجية: انسداد الشرايين التاجية بترسبات دهنية فيقل وصول الدم إلى عضلة القلب.\n\n3) [المستوى المتقدم] صنّف عوامل خطر مرض القلب التاجي إلى عوامل يمكن التحكم فيها وأخرى لا يمكن.\nالإجابة النموذجية: يمكن التحكم: النظام الغذائي والتدخين والإجهاد وقلة الحركة. لا يمكن: الاستعداد الوراثي والسن والجنس.\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\n1) [مستوى الدعم] ماذا يحدث لمعدل النبض أثناء التمرين؟\nالإجابة النموذجية: يزداد.\n\n2) [المستوى المتوقع] لماذا يزداد معدل ضربات القلب أثناء التمرين؟\nالإجابة النموذجية: لنقل مزيد من الأكسجين والغلوكوز إلى العضلات للتنفس الخلوي، والتخلص من ثاني أكسيد الكربون.\n\n3) [المستوى المتقدم] طالبان: الأول يعود نبضه للراحة بعد 3 دقائق والثاني بعد 7 دقائق. ماذا تستنتج؟\nالإجابة النموذجية: الأول أكثر لياقة؛ لأن قلبه يستعيد معدله الطبيعي أسرع."},{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الأوعية التي تغذي عضلة القلب نفسها هي .........<\/td><td>الشرايين التاجية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الأذينان يقعان في الجزء العلوي من القلب.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا يحدث لعضلة القلب إذا انسد أحد الشرايين التاجية؟<\/td><td>لا يصلها الأكسجين والغذاء الكافيان فتتضرر أو تموت خلاياها (نوبة قلبية).<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يعود الدم إلى القلب عبر .........<\/td><td>الأوردة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الصمامات بين الأذينين والبطينين؟<\/td><td>منع رجوع الدم من البطينين إلى الأذينين عند انقباضهما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح ثلاث نصائح لتقليل خطر الإصابة بمرض القلب التاجي مع التعليل.<\/td><td>تقليل الدهون المشبعة (يقلل الترسبات)، وترك التدخين (يحمي جدران الشرايين)، وممارسة الرياضة (تقوي القلب وتقلل الوزن).<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يعود معدل النبض إلى معدل الراحة فور توقف التمرين.<\/td><td>خطأ؛ يعود تدريجيًا خلال دقائق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المتغير المستقل في النشاط 2-1؟<\/td><td>شدة النشاط البدني أو مدته.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لجعل نتائج النشاط أكثر موثوقية.<\/td><td>تكرار القياس عدة مرات وأخذ المتوسط، وقياس النبض لمدة دقيقة كاملة، وتوحيد نوع التمرين ومدته.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب القلب\n1) [مستوى الدعم] أكمل: الأوعية التي تغذي عضلة القلب نفسها هي .........\nالإجابة النموذجية: الشرايين التاجية.\n\n2) [المستوى المتوقع] صواب أم خطأ: الأذينان يقعان في الجزء العلوي من القلب.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] ماذا يحدث لعضلة القلب إذا انسد أحد الشرايين التاجية؟\nالإجابة النموذجية: لا يصلها الأكسجين والغذاء الكافيان فتتضرر أو تموت خلاياها (نوبة قلبية).\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\n1) [مستوى الدعم] أكمل: يعود الدم إلى القلب عبر .........\nالإجابة النموذجية: الأوردة.\n\n2) [المستوى المتوقع] ما وظيفة الصمامات بين الأذينين والبطينين؟\nالإجابة النموذجية: منع رجوع الدم من البطينين إلى الأذينين عند انقباضهما.\n\n3) [المستوى المتقدم] اقترح ثلاث نصائح لتقليل خطر الإصابة بمرض القلب التاجي مع التعليل.\nالإجابة النموذجية: تقليل الدهون المشبعة (يقلل الترسبات)، وترك التدخين (يحمي جدران الشرايين)، وممارسة الرياضة (تقوي القلب وتقلل الوزن).\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\n1) [مستوى الدعم] صواب أم خطأ: يعود معدل النبض إلى معدل الراحة فور توقف التمرين.\nالإجابة النموذجية: خطأ؛ يعود تدريجيًا خلال دقائق.\n\n2) [المستوى المتوقع] ما المتغير المستقل في النشاط 2-1؟\nالإجابة النموذجية: شدة النشاط البدني أو مدته.\n\n3) [المستوى المتقدم] اقترح طريقة لجعل نتائج النشاط أكثر موثوقية.\nالإجابة النموذجية: تكرار القياس عدة مرات وأخذ المتوسط، وقياس النبض لمدة دقيقة كاملة، وتوحيد نوع التمرين ومدته."},{"h":"<div class=\"psub\">الحصة 1: تركيب القلب<\/div><p>مراجعة كتاب الطالب ص 17–18 والإجابة عن الأسئلة 7-1 إلى 9-1، ورسم مقطع طولي في القلب مع تسمية أجزائه.<\/p><div class=\"psub\">الحصة 2: آلية عمل القلب ومرض القلب التاجي<\/div><p>حل تمرين 3-1 خطر الإصابة بنوبة قلبية في كتاب النشاط ص 15، والإجابة عن الأسئلة 10-1 إلى 13-1 في كتاب الطالب.<\/p><div class=\"psub\">الحصة 3: تأثير النشاط البدني على معدل ضربات القلب<\/div><p>إكمال ورقة العمل 1-1 نبض القلب في كتاب النشاط ص 18–19 وتمرين 2-1 قلب الجنين ص 14، والإجابة عن الأسئلة 14-1 إلى 16-1 والأسئلة 2 و4 و5 و6 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: تركيب القلب\nمراجعة كتاب الطالب ص 17–18 والإجابة عن الأسئلة 7-1 إلى 9-1، ورسم مقطع طولي في القلب مع تسمية أجزائه.\n\nالحصة 2: آلية عمل القلب ومرض القلب التاجي\nحل تمرين 3-1 خطر الإصابة بنوبة قلبية في كتاب النشاط ص 15، والإجابة عن الأسئلة 10-1 إلى 13-1 في كتاب الطالب.\n\nالحصة 3: تأثير النشاط البدني على معدل ضربات القلب\nإكمال ورقة العمل 1-1 نبض القلب في كتاب النشاط ص 18–19 وتمرين 2-1 قلب الجنين ص 14، والإجابة عن الأسئلة 14-1 إلى 16-1 والأسئلة 2 و4 و5 و6 من أسئلة نهاية الوحدة."}]}},{"label":"3-1 الأوعية الدموية","unit":"الوحدة الأولى: النقل في الثدييات","periods":[{"n":1,"focus":"تركيب الشرايين والأوردة والشعيرات الدموية","info":"<div><b>الدرس:<\/b> 3-1 الأوعية الدموية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 22–24 | كتاب النشاط: ورقة العمل 2-1 ص 20–21<\/div><div><b>دليل المعلم:<\/b> ص 23<\/div><div><b>محور الحصة:<\/b> تركيب الشرايين والأوردة والشعيرات الدموية<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف تركيب الشرايين والأوردة والشعيرات الدموية.<\/li><li>يميز بين أنواع الأوعية الدموية من صور مقاطعها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرسم مقطعًا عرضيًا في شريان ووريد ويسمي أجزاءه.<\/div>","t":"1. يصف تركيب الشرايين والأوردة والشعيرات الدموية.\n2. يميز بين أنواع الأوعية الدموية من صور مقاطعها.\nمخرج تعليمي آخر: يرسم مقطعًا عرضيًا في شريان ووريد ويسمي أجزاءه."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف تركيب الشرايين والأوردة والشعيرات الدموية.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يميز بين أنواع الأوعية الدموية من صور مقاطعها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يرسم مقطعًا عرضيًا في شريان ووريد ويسمي أجزاءه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يصف تركيب الشرايين والأوردة والشعيرات الدموية. ← فهم\n• يميز بين أنواع الأوعية الدموية من صور مقاطعها. ← تحليل\n• يرسم مقطعًا عرضيًا في شريان ووريد ويسمي أجزاءه. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: شرائح مجهرية أو صور لمقاطع الأوعية، مجهر ضوئي<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: شرائح مجهرية أو صور لمقاطع الأوعية، مجهر ضوئي"},{"h":"<div class=\"pills\"><span>الشريان<\/span><span>الوريد<\/span><span>الشعيرة الدموية<\/span><span>التجويف<\/span><span>الجدار العضلي المرن<\/span><span>الصمامات<\/span><\/div>","t":"الشريان، الوريد، الشعيرة الدموية، التجويف، الجدار العضلي المرن، الصمامات"},{"h":"<p>يعرض صورتي مقطعين عرضيين لوعاءين دمويين ويسأل: أيهما يتحمل ضغطًا أعلى؟ ولماذا؟<\/p>","t":"يعرض صورتي مقطعين عرضيين لوعاءين دمويين ويسأل: أيهما يتحمل ضغطًا أعلى؟ ولماذا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تركيب الأوعية (كتاب الطالب ص 22–23)<\/td><td>يشرح الفروق في سماكة الجدار وقطر التجويف ووجود الصمامات.<\/td><td>يكملون جدول مقارنة.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">فحص مقاطع الأوعية<\/td><td>يوجه إلى فحص الشرائح أو الصور.<\/td><td>يرسمون مقطعي الشريان والوريد ويسمون الأجزاء.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الشعيرات الدموية<\/td><td>يوضح أن جدارها بسماكة خلية واحدة.<\/td><td>يربطون ذلك بتبادل المواد.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) تركيب الأوعية (كتاب الطالب ص 22–23)\nدور المعلم: يشرح الفروق في سماكة الجدار وقطر التجويف ووجود الصمامات.\nدور الطالب: يكملون جدول مقارنة.\n\n(13 دقيقة) فحص مقاطع الأوعية\nدور المعلم: يوجه إلى فحص الشرائح أو الصور.\nدور الطالب: يرسمون مقطعي الشريان والوريد ويسمون الأجزاء.\n\n(5 دقائق) الشعيرات الدموية\nدور المعلم: يوضح أن جدارها بسماكة خلية واحدة.\nدور الطالب: يربطون ذلك بتبادل المواد.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي الأوعية جدارها بسماكة خلية واحدة؟<\/td><td>الشعيرات الدموية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر فرقين بين الشريان والوريد في التركيب.<\/td><td>الشريان جداره سميك عضلي مرن وتجويفه ضيق، والوريد جداره رقيق وتجويفه واسع وفيه صمامات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في صورة مقطع: وعاء جداره رقيق وتجويفه واسع وغير منتظم الشكل. ما نوعه؟ برر.<\/td><td>وريد؛ لرقة جداره واتساع تجويفه.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أي الأوعية جدارها بسماكة خلية واحدة؟\nالإجابة النموذجية: الشعيرات الدموية.\n\n2) [المستوى المتوقع] اذكر فرقين بين الشريان والوريد في التركيب.\nالإجابة النموذجية: الشريان جداره سميك عضلي مرن وتجويفه ضيق، والوريد جداره رقيق وتجويفه واسع وفيه صمامات.\n\n3) [المستوى المتقدم] في صورة مقطع: وعاء جداره رقيق وتجويفه واسع وغير منتظم الشكل. ما نوعه؟ برر.\nالإجابة النموذجية: وريد؛ لرقة جداره واتساع تجويفه."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحتوي ......... على صمامات تمنع رجوع الدم.<\/td><td>الأوردة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: للشرايين جدران رقيقة.<\/td><td>خطأ؛ جدرانها سميكة عضلية مرنة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد قطر الشعيرة الدموية صغيرًا جدًا بحيث تمر خلايا الدم الحمراء فيها واحدة تلو الأخرى؟<\/td><td>لتكون المسافة بين الدم والخلايا أقصر ما يمكن فيسرع تبادل المواد.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تحتوي ......... على صمامات تمنع رجوع الدم.\nالإجابة النموذجية: الأوردة.\n\n2) [المستوى المتوقع] صواب أم خطأ: للشرايين جدران رقيقة.\nالإجابة النموذجية: خطأ؛ جدرانها سميكة عضلية مرنة.\n\n3) [المستوى المتقدم] لماذا يُعد قطر الشعيرة الدموية صغيرًا جدًا بحيث تمر خلايا الدم الحمراء فيها واحدة تلو الأخرى؟\nالإجابة النموذجية: لتكون المسافة بين الدم والخلايا أقصر ما يمكن فيسرع تبادل المواد."},{"h":"<p>مراجعة كتاب الطالب ص 22–23 والإجابة عن السؤالين 17-1 و18-1، ورسم مقطعي الشريان والوريد.<\/p>","t":"مراجعة كتاب الطالب ص 22–23 والإجابة عن السؤالين 17-1 و18-1، ورسم مقطعي الشريان والوريد."}]},{"n":2,"focus":"تكيف الأوعية الدموية لأداء وظائفها","info":"<div><b>الدرس:<\/b> 3-1 الأوعية الدموية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 22–24 | كتاب النشاط: ورقة العمل 2-1 ص 20–21<\/div><div><b>دليل المعلم:<\/b> ص 23<\/div><div><b>محور الحصة:<\/b> تكيف الأوعية الدموية لأداء وظائفها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يشرح كيف تتكيف الشرايين والأوردة والشعيرات الدموية لأداء وظائفها.<\/li><li>يربط تركيب كل وعا =\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون أفكارًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">التركيب والوظيفة<\/td><td>يعرض على السبورة الذكية جدولًا: الوعاء، التركيب، الوظيفة، التكيف.<\/td><td>يكملون الجدول ويبررون كل تكيف.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الأوردة والعضلات<\/td><td>يوضح دور الصمامات وانقباض عضلات الساق في دفع الدم.<\/td><td>يفسرون أهمية الحركة في الرحلات الطويلة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 19-1 و20-1<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون أفكارًا.\n\n(12 دقيقة) التركيب والوظيفة\nدور المعلم: يعرض على السبورة الذكية جدولًا: الوعاء، التركيب، الوظيفة، التكيف.\nدور الطالب: يكملون الجدول ويبررون كل تكيف.\n\n(10 دقائق) الأوردة والعضلات\nدور المعلم: يوضح دور الصمامات وانقباض عضلات الساق في دفع الدم.\nدور الطالب: يفسرون أهمية الحركة في الرحلات الطويلة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 19-1 و20-1\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا تكون جدران الشرايين سميكة ومرنة؟<\/td><td>لتتحمل ضغط الدم المرتفع وتتمدد وترتد مع كل نبضة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف يساعد تركيب الشعيرات الدموية على تبادل المواد؟<\/td><td>جدارها رقيق بسماكة خلية واحدة وأعدادها كبيرة فتقصر المسافة وتكبر مساحة التبادل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُنصح المسافر في رحلة طويلة بتحريك ساقيه؟<\/td><td>لأن انقباض عضلات الساقين يضغط الأوردة فيدفع الدم نحو القلب، والصمامات تمنع رجوعه، فيقل تجمع الدم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا تكون جدران الشرايين سميكة ومرنة؟\nالإجابة النموذجية: لتتحمل ضغط الدم المرتفع وتتمدد وترتد مع كل نبضة.\n\n2) [المستوى المتوقع] كيف يساعد تركيب الشعيرات الدموية على تبادل المواد؟\nالإجابة النموذجية: جدارها رقيق بسماكة خلية واحدة وأعدادها كبيرة فتقصر المسافة وتكبر مساحة التبادل.\n\n3) [المستوى المتقدم] لماذا يُنصح المسافر في رحلة طويلة بتحريك ساقيه؟\nالإجابة النموذجية: لأن انقباض عضلات الساقين يضغط الأوردة فيدفع الدم نحو القلب، والصمامات تمنع رجوعه، فيقل تجمع الدم."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ضغط الدم في الشرايين ......... منه في الأوردة.<\/td><td>أعلى.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة صمامات الأوردة؟<\/td><td>منع رجوع الدم وضمان تدفقه نحو القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر: الوريد لا يحتاج إلى جدار سميك كالشريان.<\/td><td>لأن ضغط الدم في الأوردة منخفض.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: ضغط الدم في الشرايين ......... منه في الأوردة.\nالإجابة النموذجية: أعلى.\n\n2) [المستوى المتوقع] ما وظيفة صمامات الأوردة؟\nالإجابة النموذجية: منع رجوع الدم وضمان تدفقه نحو القلب.\n\n3) [المستوى المتقدم] فسّر: الوريد لا يحتاج إلى جدار سميك كالشريان.\nالإجابة النموذجية: لأن ضغط الدم في الأوردة منخفض."},{"h":"<p>الإجابة عن السؤالين 19-1 و20-1، والبدء في ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21.<\/p>","t":"الإجابة عن السؤالين 19-1 و20-1، والبدء في ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21."}]},{"n":3,"focus":"الأوعية الدموية الرئيسة من القلب وإليه","info":"<div><b>الدرس:<\/b> 3-1 الأوعية الدموية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 22–24 | كتاب النشاط: ورقة العمل 2-1 ص 20–21<\/div><div><b>دليل المعلم:<\/b> ص 23<\/div><div><b>محور الحصة:<\/b> الأوعية الدموية الرئيسة من القلب وإليه<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يسمي الأوعية الرئيسة من القلب وإليه: الوريد الأجوف والشريان الأبهر والشريان الرئوي والوريد الرئوي.<\/li><li>يسمي الأوعية من الرئتين وإليهما ومن الكليتين وإليهما.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد نوع الدم (مؤكسج أو غير مؤكسج) في كل وعاء رئيس.<\/div>","t":"1. يسمي الأوعية الرئيسة من القلب وإليه: الوريد الأجوف والشريان الأبهر والشريان الرئوي والوريد الرئوي.\n2. يسمي الأوعية من الرئتين وإليهما ومن الكليتين وإليهما.\nمخرج تعليمي آخر: يحدد نوع الدم (مؤكسج أو غير مؤكسج) في كل وعاء رئيس."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يسمي الأوعية الرئيسة من القلب وإليه: الوريد الأجوف والشريان الأبهر والشريان الرئوي والوريد الرئوي.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يسمي الأوعية من الرئتين وإليهما ومن الكليتين وإليهما.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يحدد نوع الدم (مؤكسج أو غير مؤكسج) في كل وعاء رئيس.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يسمي الأوعية الرئيسة من القلب وإليه: الوريد الأجوف والشريان الأبهر والشريان الرئوي والوريد الرئوي. ← تذكر\n• يسمي الأوعية من الرئتين وإليهما ومن الكليتين وإليهما. ← تذكر\n• يحدد نوع الدم (مؤكسج أو غير مؤكسج) في كل وعاء رئيس. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• الأقلام"},{"h":"<div class=\"pills\"><span>الوريد الأجوف<\/span><span>الشريان الأبهر<\/span><span>الشريان الرئوي<\/span><span>الوريد الرئوي<\/span><span>الشريان الكلوي<\/span><span>الوريد الكلوي<\/span><\/div>","t":"الوريد الأجوف، الشريان الأبهر، الشريان الرئوي، الوريد الرئوي، الشريان الكلوي، الوريد الكلوي"},{"h":"<p>سؤال تحدٍّ: «كل الشرايين تحمل دمًا مؤكسجًا». هل العبارة صحيحة دائمًا؟<\/p>","t":"سؤال تحدٍّ: «كل الشرايين تحمل دمًا مؤكسجًا». هل العبارة صحيحة دائمًا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح العبارة.<\/td><td>يصوتون ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الأوعية الرئيسة (كتاب الطالب ص 24)<\/td><td>يحدد الأوعية على نموذج القلب ومخطط الجسم.<\/td><td>يرسمون مخططًا يوضح الأوعية الستة واتجاه الدم فيها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المؤكسج وغير المؤكسج<\/td><td>يوضح الاستثناء: الشريان الرئوي يحمل دمًا غير مؤكسج والوريد الرئوي يحمل دمًا مؤكسجًا.<\/td><td>يلونون الأوعية في مخططهم.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">ورقة العمل 2-1 الأوعية الدموية (كتاب النشاط ص 20–21)<\/td><td>يتابع.<\/td><td>يكملون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح العبارة.\nدور الطالب: يصوتون ويبررون.\n\n(12 دقيقة) الأوعية الرئيسة (كتاب الطالب ص 24)\nدور المعلم: يحدد الأوعية على نموذج القلب ومخطط الجسم.\nدور الطالب: يرسمون مخططًا يوضح الأوعية الستة واتجاه الدم فيها.\n\n(10 دقائق) المؤكسج وغير المؤكسج\nدور المعلم: يوضح الاستثناء: الشريان الرئوي يحمل دمًا غير مؤكسج والوريد الرئوي يحمل دمًا مؤكسجًا.\nدور الطالب: يلونون الأوعية في مخططهم.\n\n(8 دقائق) ورقة العمل 2-1 الأوعية الدموية (كتاب النشاط ص 20–21)\nدور المعلم: يتابع.\nدور الطالب: يكملون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الوعاء الذي ينقل الدم من القلب إلى الجسم؟<\/td><td>الشريان الأبهر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي الأوعية يحمل الدم من الرئتين إلى القلب؟ وهل الدم فيه مؤكسج؟<\/td><td>الوريد الرئوي؛ ودمه مؤكسج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُسمى الشريان الرئوي شريانًا مع أنه يحمل دمًا غير مؤكسج؟<\/td><td>لأن تسمية الشريان تعتمد على اتجاه الدم من القلب لا على محتواه من الأكسجين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الوعاء الذي ينقل الدم من القلب إلى الجسم؟\nالإجابة النموذجية: الشريان الأبهر.\n\n2) [المستوى المتوقع] أي الأوعية يحمل الدم من الرئتين إلى القلب؟ وهل الدم فيه مؤكسج؟\nالإجابة النموذجية: الوريد الرئوي؛ ودمه مؤكسج.\n\n3) [المستوى المتقدم] لماذا يُسمى الشريان الرئوي شريانًا مع أنه يحمل دمًا غير مؤكسج؟\nالإجابة النموذجية: لأن تسمية الشريان تعتمد على اتجاه الدم من القلب لا على محتواه من الأكسجين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يدخل الدم إلى الكلية عبر الشريان .........<\/td><td>الكلوي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الوعاء الذي يعيد الدم من الجسم إلى الأذين الأيمن؟<\/td><td>الوريد الأجوف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>تتبع مسار جزيء أكسجين من الرئة حتى خلية في الكلية مرورًا بالأوعية الرئيسة.<\/td><td>الرئة ← الوريد الرئوي ← الأذين الأيسر ← البطين الأيسر ← الشريان الأبهر ← الشريان الكلوي ← شعيرات الكلية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يدخل الدم إلى الكلية عبر الشريان .........\nالإجابة النموذجية: الكلوي.\n\n2) [المستوى المتوقع] ما الوعاء الذي يعيد الدم من الجسم إلى الأذين الأيمن؟\nالإجابة النموذجية: الوريد الأجوف.\n\n3) [المستوى المتقدم] تتبع مسار جزيء أكسجين من الرئة حتى خلية في الكلية مرورًا بالأوعية الرئيسة.\nالإجابة النموذجية: الرئة ← الوريد الرئوي ← الأذين الأيسر ← البطين الأيسر ← الشريان الأبهر ← الشريان الكلوي ← شعيرات الكلية."},{"h":"<p>إكمال ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21، والإجابة عن السؤالين 21-1 و22-1 والسؤالين 3 و7 من أسئلة نهاية الوحدة.<\/p>","t":"إكمال ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21، والإجابة عن السؤالين 21-1 و22-1 والسؤالين 3 و7 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-1 الأوعية الدموية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 22–24 | كتاب النشاط: ورقة العمل 2-1 ص 20–21<\/div><div><b>دليل المعلم:<\/b> ص 23<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية<\/div><ol class=\"ol\"><li>يصف تركيب الشرايين والأوردة والشعيرات الدموية.<\/li><li>يميز بين أنواع الأوعية الدموية من صور مقاطعها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يرسم مقطعًا عرضيًا في شريان ووريد ويسمي أجزاءه.<\/div><div class=\"psub\">الحصة 2: تكيف الأوعية الدموية لأداء وظائفها<\/div><ol class=\"ol\"><li>يشرح كيف تتكيف الشرايين والأوردة والشعيرات الدموية لأداء وظائفها.<\/li><li>يربط تركيب كل وعاء بضغط الدم فيه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر دور العضلات الهيكلية في إعادة الدم عبر أوردة الساقين.<\/div><div class=\"psub\">الحصة 3: الأوعية الدموية الرئيسة من القلب وإليه<\/div><ol class=\"ol\"><li>يسمي الأوعية الرئيسة من القلب وإليه: الوريد الأجوف والشريان الأبهر والشريان الرئوي والوريد الرئوي.<\/li><li>يسمي الأوعية من الرئتين وإليهما ومن الكليتين وإليهما.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد نوع الدم (مؤكسج أو غير مؤكسج) في كل وعاء رئيس.<\/div>","t":"الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية\n1. يصف تركيب الشرايين والأوردة والشعيرات الدموية.\n2. يميز بين أنواع الأوعية الدموية من صور مقاطعها.\nمخرج تعليمي آخر: يرسم مقطعًا عرضيًا في شريان ووريد ويسمي أجزاءه.\n\nالحصة 2: تكيف الأوعية الدموية لأداء وظائفها\n1. يشرح كيف تتكيف الشرايين والأوردة والشعيرات الدموية لأداء وظائفها.\n2. يربط تركيب كل وعاء بضغط الدم فيه.\nمخرج تعليمي آخر: يفسر دور العضلات الهيكلية في إعادة الدم عبر أوردة الساقين.\n\nالحصة 3:  وإليه<\/div><p>سؤال تحدٍّ: «كل الشرايين تحمل دمًا مؤكسجًا». هل العبارة صحيحة دائمًا؟<\/p>","t":"الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية\nيعرض صورتي مقطعين عرضيين لوعاءين دمويين ويسأل: أيهما يتحمل ضغطًا أعلى؟ ولماذا؟\n\nالحصة 2: تكيف الأوعية الدموية لأداء وظائفها\nسؤال: الدم في أوردة القدم يجب أن يصعد إلى القلب ضد الجاذبية؛ كيف يحدث ذلك؟\n\nالحصة 3: الأوعية الدموية الرئيسة من القلب وإليه\nسؤال تحدٍّ: «كل الشرايين تحمل دمًا مؤكسجًا». هل العبارة صحيحة دائمًا؟"},{"h":"<div class=\"psub\">الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تركيب الأوعية (كتاب الطالب ص 22–23)<\/td><td>يشرح الفروق في سماكة الجدار وقطر التجويف ووجود الصمامات.<\/td><td>يكملون جدول مقارنة.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">فحص مقاطع الأوعية<\/td><td>يوجه إلى فحص الشرائح أو الصور.<\/td><td>يرسمون مقطعي الشريان والوريد ويسمون الأجزاء.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الشعيرات الدموية<\/td><td>يوضح أن جدارها بسماكة خلية واحدة.<\/td><td>يربطون ذلك بتبادل المواد.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تكيف الأوعية الدموية لأداء وظائفها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون أفكارًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">التركيب والوظيفة<\/td><td>يعرض على السبورة الذكية جدولًا: الوعاء، التركيب، الوظيفة، التكيف.<\/td><td>يكملون الجدول ويبررون كل تكيف.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الأوردة والعضلات<\/td><td>يوضح دور الصمامات وانقباض عضلات الساق في دفع الدم.<\/td><td>يفسرون أهمية الحركة في الرحلات الطويلة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 19-1 و20-1<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الأوعية الدموية الرئيسة من القلب وإليه<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح العبارة.<\/td><td>يصوتون ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">الأوعية الرئيسة (كتاب الطالب ص 24)<\/td><td>يحدد الأوعية على نموذج القلب ومخطط الجسم.<\/td><td>يرسمون مخططًا يوضح الأوعية الستة واتجاه الدم فيها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المؤكسج وغير المؤكسج<\/td><td>يوضح الاستثناء: الشريان الرئوي يحمل دمًا غير مؤكسج والوريد الرئوي يحمل دمًا مؤكسجًا.<\/td><td>يلونون الأوعية في مخططهم.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">ورقة العمل 2-1 الأوعية الدموية (كتاب النشاط ص 20–21)<\/td><td>يتابع.<\/td><td>يكملون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) تركيب الأوعية (كتاب الطالب ص 22–23)\nدور المعلم: يشرح الفروق في سماكة الجدار وقطر التجويف ووجود الصمامات.\nدور الطالب: يكملون جدول مقارنة.\n\n(13 دقيقة) فحص مقاطع الأوعية\nدور المعلم: يوجه إلى فحص الشرائح أو الصور.\nدور الطالب: يرسمون مقطعي الشريان والوريد ويسمون الأجزاء.\n\n(5 دقائق) الشعيرات الدموية\nدور المعلم: يوضح أن جدارها بسماكة خلية واحدة.\nدور الطالب: يربطون ذلك بتبادل المواد.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: تكيف الأوعية الدموية لأداء وظائفها\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون أفكارًا.\n\n(12 دقيقة) التركيب والوظيفة\nدور المعلم: يعرض على السبورة الذكية جدولًا: الوعاء، التركيب، الوظيفة، التكيف.\nدور الطالب: يكملون الجدول ويبررون كل تكيف.\n\n(10 دقائق) الأوردة والعضلات\nدور المعلم: يوضح دور الصمامات وانقباض عضلات الساق في دفع الدم.\nدور الطالب: يفسرون أهمية الحركة في الرحلات الطويلة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 19-1 و20-1\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: الأوعية الدموية الرئيسة من القلب وإليه\n(5 دقائق) التهيئة\nدور المعلم: يطرح العبارة.\nدور الطالب: يصوتون ويبررون.\n\n(12 دقيقة) الأوعية الرئيسة (كتاب الطالب ص 24)\nدور المعلم: يحدد الأوعية على نموذج القلب ومخطط الجسم.\nدور الطالب: يرسمون مخططًا يوضح الأوعية الستة واتجاه الدم فيها.\n\n(10 دقائق) المؤكسج وغير المؤكسج\nدور المعلم: يوضح الاستثناء: الشريان الرئوي يحمل دمًا غير مؤكسج والوريد الرئوي يحمل دمًا مؤكسجًا.\nدور الطالب: يلونون الأوعية في مخططهم.\n\n(8 دقائق) ورقة العمل 2-1 الأوعية الدموية (كتاب النشاط ص 20–21)\nدور المعلم: يتابع.\nدور الطالب: يكملون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي الأوعية جدارها بسماكة خلية واحدة؟<\/td><td>الشعيرات الدموية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر فرقين بين الشريان والوريد في التركيب.<\/td><td>الشريان جداره سميك عضلي مرن وتجويفه ضيق، والوريد جداره رقيق وتجويفه واسع وفيه صمامات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في صورة مقطع: وعاء جداره رقيق وتجويفه واسع وغير منتظم الشكل. ما نوعه؟ برر.<\/td><td>وريد؛ لرقة جداره واتساع تجويفه.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تكيف الأوعية الدموية لأداء وظائفها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا تكون جدران الشرايين سميكة ومرنة؟<\/td><td>لتتحمل ضغط الدم المرتفع وتتمدد وترتد مع كل نبضة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف يساعد تركيب الشعيرات الدموية على تبادل المواد؟<\/td><td>جدارها رقيق بسماكة خلية واحدة وأعدادها كبيرة فتقصر المسافة وتكبر مساحة التبادل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُنصح المسافر في رحلة طويلة بتحريك ساقيه؟<\/td><td>لأن انقباض عضلات الساقين يضغط الأوردة فيدفع الدم نحو القلب، والصمامات تمنع رجوعه، فيقل تجمع الدم.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الأوعية الدموية الرئيسة من القلب وإليه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الوعاء الذي ينقل الدم من القلب إلى الجسم؟<\/td><td>الشريان الأبهر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أي الأوعية يحمل الدم من الرئتين إلى القلب؟ وهل الدم فيه مؤكسج؟<\/td><td>الوريد الرئوي؛ ودمه مؤكسج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُسمى الشريان الرئوي شريانًا مع أنه يحمل دمًا غير مؤكسج؟<\/td><td>لأن تسمية الشريان تعتمد على اتجاه الدم من القلب لا على محتواه من الأكسجين.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية\n1) [مستوى الدعم] أي الأوعية جدارها بسماكة خلية واحدة؟\nالإجابة النموذجية: الشعيرات الدموية.\n\n2) [المستوى المتوقع] اذكر فرقين بين الشريان والوريد في التركيب.\nالإجابة النموذجية: الشريان جداره سميك عضلي مرن وتجويفه ضيق، والوريد جداره رقيق وتجويفه واسع وفيه صمامات.\n\n3) [المستوى المتقدم] في صورة مقطع: وعاء جداره رقيق وتجويفه واسع وغير منتظم الشكل. ما نوعه؟ برر.\nالإجابة النموذجية: وريد؛ لرقة جداره واتساع تجويفه.\n\nالحصة 2: تكيف الأوعية الدموية لأداء وظائفها\n1) [مستوى الدعم] لماذا تكون جدران الشرايين سميكة ومرنة؟\nالإجابة النموذجية: لتتحمل ضغط الدم المرتفع وتتمدد وترتد مع كل نبضة.\n\n2) [المستوى المتوقع] كيف يساعد تركيب الشعيرات الدموية على تبادل المواد؟\nالإجابة النموذجية: جدارها رقيق بسماكة خلية واحدة وأعدادها كبيرة فتقصر المسافة وتكبر مساحة التبادل.\n\n3) [المستوى المتقدم] لماذا يُنصح المسافر في رحلة طويلة بتحريك ساقيه؟\nالإجابة النموذجية: لأن انقباض عضلات الساقين يضغط الأوردة فيدفع الدم نحو القلب، والصمامات تمنع رجوعه، فيقل تجمع الدم.\n\nالحصة 3: الأوعية الدموية الرئيسة من القلب وإليه\n1) [مستوى الدعم] ما الوعاء الذي ينقل الدم من القلب إلى الجسم؟\nالإجابة النموذجية: الشريان الأبهر.\n\n2) [المستوى المتوقع] أي الأوعية يحمل الدم من الرئتين إلى القلب؟ وهل الدم فيه مؤكسج؟\nالإجابة النموذجية: الوريد الرئوي؛ ودمه مؤكسج.\n\n3) [المستوى المتقدم] لماذا يُسمى الشريان الرئوي شريانًا مع أنه يحمل دمًا غير مؤكسج؟\nالإجابة النموذجية: لأن تسمية الشريان تعتمد على اتجاه الدم من القلب لا على محتواه من الأكسجين."},{"h":"<div class=\"psub\">الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحتوي ......... على صمامات تمنع رجوع الدم.<\/td><td>الأوردة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: للشرايين جدران رقيقة.<\/td><td>خطأ؛ جدرانها سميكة عضلية مرنة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد قطر الشعيرة الدموية صغيرًا جدًا بحيث تمر خلايا الدم الحمراء فيها واحدة تلو الأخرى؟<\/td><td>لتكون المسافة بين الدم والخلايا أقصر ما يمكن فيسرع تبادل المواد.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: تكيف الأوعية الدموية لأداء وظائفها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ضغط الدم في الشرايين ......... منه في الأوردة.<\/td><td>أعلى.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة صمامات الأوردة؟<\/td><td>منع رجوع الدم وضمان تدفقه نحو القلب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر: الوريد لا يحتاج إلى جدار سميك كالشريان.<\/td><td>لأن ضغط الدم في الأوردة منخفض.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الأوعية الدموية الرئيسة من القلب وإليه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يدخل الدم إلى الكلية عبر الشريان .........<\/td><td>الكلوي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الوعاء الذي يعيد الدم من الجسم إلى الأذين الأيمن؟<\/td><td>الوريد الأجوف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>تتبع مسار جزيء أكسجين من الرئة حتى خلية في الكلية مرورًا بالأوعية الرئيسة.<\/td><td>الرئة ← الوريد الرئوي ← الأذين الأيسر ← البطين الأيسر ← الشريان الأبهر ← الشريان الكلوي ← شعيرات الكلية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية\n1) [مستوى الدعم] أكمل: تحتوي ......... على صمامات تمنع رجوع الدم.\nالإجابة النموذجية: الأوردة.\n\n2) [المستوى المتوقع] صواب أم خطأ: للشرايين جدران رقيقة.\nالإجابة النموذجية: خطأ؛ جدرانها سميكة عضلية مرنة.\n\n3) [المستوى المتقدم] لماذا يُعد قطر الشعيرة الدموية صغيرًا جدًا بحيث تمر خلايا الدم الحمراء فيها واحدة تلو الأخرى؟\nالإجابة النموذجية: لتكون المسافة بين الدم والخلايا أقصر ما يمكن فيسرع تبادل المواد.\n\nالحصة 2: تكيف الأوعية الدموية لأداء وظائفها\n1) [مستوى الدعم] أكمل: ضغط الدم في الشرايين ......... منه في الأوردة.\nالإجابة النموذجية: أعلى.\n\n2) [المستوى المتوقع] ما وظيفة صمامات الأوردة؟\nالإجابة النموذجية: منع رجوع الدم وضمان تدفقه نحو القلب.\n\n3) [المستوى المتقدم] فسّر: الوريد لا يحتاج إلى جدار سميك كالشريان.\nالإجابة النموذجية: لأن ضغط الدم في الأوردة منخفض.\n\nالحصة 3: الأوعية الدموية الرئيسة من القلب وإليه\n1) [مستوى الدعم] أكمل: يدخل الدم إلى الكلية عبر الشريان .........\nالإجابة النموذجية: الكلوي.\n\n2) [المستوى المتوقع] ما الوعاء الذي يعيد الدم من الجسم إلى الأذين الأيمن؟\nالإجابة النموذجية: الوريد الأجوف.\n\n3) [المستوى المتقدم] تتبع مسار جزيء أكسجين من الرئة حتى خلية في الكلية مرورًا بالأوعية الرئيسة.\nالإجابة النموذجية: الرئة ← الوريد الرئوي ← الأذين الأيسر ← البطين الأيسر ← الشريان الأبهر ← الشريان الكلوي ← شعيرات الكلية."},{"h":"<div class=\"psub\">الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية<\/div><p>مراجعة كتاب الطالب ص 22–23 والإجابة عن السؤالين 17-1 و18-1، ورسم مقطعي الشريان والوريد.<\/p><div class=\"psub\">الحصة 2: تكيف الأوعية الدموية لأداء وظائفها<\/div><p>الإجابة عن السؤالين 19-1 و20-1، والبدء في ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21.<\/p><div class=\"psub\">الحصة 3: الأوعية الدموية الرئيسة من القلب وإليه<\/div><p>إكمال ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21، والإجابة عن السؤالين 21-1 و22-1 والسؤالين 3 و7 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: تركيب الشرايين والأوردة والشعيرات الدموية\nمراجعة كتاب الطالب ص 22–23 والإجابة عن السؤالين 17-1 و18-1، ورسم مقطعي الشريان والوريد.\n\nالحصة 2: تكيف الأوعية الدموية لأداء وظائفها\nالإجابة عن السؤالين 19-1 و20-1، والبدء في ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21.\n\nالحصة 3: الأوعية الدموية الرئيسة من القلب وإليه\nإكمال ورقة العمل 2-1 الأوعية الدموية في كتاب النشاط ص 20–21، والإجابة عن السؤالين 21-1 و22-1 والسؤالين 3 و7 من أسئلة نهاية الوحدة."}]}},{"label":"4-1 الدم","unit":"الوحدة الأولى: النقل في الثدييات","periods":[{"n":1,"focus":"مكونات الدم","info":"<div><b>الدرس:<\/b> 4-1 الدم<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 25–33 | كتاب النشاط: تمرين 4-1 ص 16–17<\/div><div><b>دليل المعلم:<\/b> ص 24<\/div><div><b>محور الحصة:<\/b> مكونات الدم<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر مكونات الدم: خلايا الدم الحمراء وخلايا الدم ال head><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مكونات الدم (كتاب الطالب ص 25–27)<\/td><td>يشرح المكونات الأربعة ونسبها التقريبية.<\/td><td>يرسمون الأنبوب ويسمون طبقاته.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">خلية الدم الحمراء<\/td><td>يعرض مقطعًا عن شكلها المقعر الوجهين وخلوها من النواة واحتوائها على الهيموجلوبين.<\/td><td>يربطون كل خاصية بوظيفة نقل الأكسجين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">السؤالان 23-1 و24-1<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) مكونات الدم (كتاب الطالب ص 25–27)\nدور المعلم: يشرح المكونات الأربعة ونسبها التقريبية.\nدور الطالب: يرسمون الأنبوب ويسمون طبقاته.\n\n(13 دقيقة) خلية الدم الحمراء\nدور المعلم: يعرض مقطعًا عن شكلها المقعر الوجهين وخلوها من النواة واحتوائها على الهيموجلوبين.\nدور الطالب: يربطون كل خاصية بوظيفة نقل الأكسجين.\n\n(5 دقائق) السؤالان 23-1 و24-1\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر مكونات الدم الأربعة.<\/td><td>البلازما، وخلايا الدم الحمراء، وخلايا الدم البيضاء، والصفائح الدموية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الصبغة التي تحمل الأكسجين في خلايا الدم الحمراء؟<\/td><td>الهيموجلوبين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يساعد خلو خلية الدم الحمراء من النواة على أداء وظيفتها؟<\/td><td>يوفر حيزًا أكبر للهيموجلوبين فتحمل كمية أكبر من الأكسجين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر مكونات الدم الأربعة.\nالإجابة النموذجية: البلازما، وخلايا الدم الحمراء، وخلايا الدم البيضاء، والصفائح الدموية.\n\n2) [المستوى المتوقع] ما الصبغة التي تحمل الأكسجين في خلايا الدم الحمراء؟\nالإجابة النموذجية: الهيموجلوبين.\n\n3) [المستوى المتقدم] كيف يساعد خلو خلية الدم الحمراء من النواة على أداء وظيفتها؟\nالإجابة النموذجية: يوفر حيزًا أكبر للهيموجلوبين فتحمل كمية أكبر من الأكسجين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الجزء السائل من الدم يسمى .........<\/td><td>البلازما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تحتوي خلايا الدم الحمراء الناضجة على نواة كبيرة.<\/td><td>خطأ؛ ليس لها نواة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يزيد الشكل المقعر الوجهين كفاءة خلية الدم الحمراء؟<\/td><td>لأنه يزيد مساحة السطح نسبة إلى الحجم فيسرع انتشار الأكسجين داخلها وخارجها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الجزء السائل من الدم يسمى .........\nالإجابة النموذجية: البلازما.\n\n2) [المستوى المتوقع] صواب أم خطأ: تحتوي خلايا الدم الحمراء الناضجة على نواة كبيرة.\nالإجابة النموذجية: خطأ؛ ليس لها نواة.\n\n3) [المستوى المتقدم] لماذا يزيد الشكل المقعر الوجهين كفاءة خلية الدم الحمراء؟\nالإجابة النموذجية: لأنه يزيد مساحة السطح نسبة إلى الحجم فيسرع انتشار الأكسجين داخلها وخارجها."},{"h":"<p>مراجعة كتاب الطالب ص 25–27 والإجابة عن السؤالين 23-1 و24-1.<\/p>","t":"مراجعة كتاب الطالب ص 25–27 والإجابة عن السؤالين 23-1 و24-1."}]},{"n":2,"focus":"مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء","info":"<div><b>الدرس:<\/b> 4-1 الدم<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 25–33 | كتاب النشاط: تمرين 4-1 ص 16–17<\/div><div><b>دليل المعلم:<\/b> ص 24<\/div><div><b> زما<\/span><span>المرتفعات<\/span><span>عدد خلايا الدم الحمراء<\/span><\/div>","t":"تخثر الدم، الصفائح الدموية، نقل المواد في البلازما، المرتفعات، عدد خلايا الدم الحمراء"},{"h":"<p>صورة متسلقين في جبل شاهق وسؤال: لماذا يتدرب الرياضيون أحيانًا في المرتفعات قبل المنافسات؟<\/p>","t":"صورة متسلقين في جبل شاهق وسؤال: لماذا يتدرب الرياضيون أحيانًا في المرتفعات قبل المنافسات؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الصفائح والبلازما (كتاب الطالب ص 30–31)<\/td><td>يشرح دور الصفائح في تكوين الجلطة ومنع النزف ودخول الميكروبات، والمواد المنقولة في البلازما.<\/td><td>يعددون مواد تنقلها البلازما: الغلوكوز والأحماض الأمينية والأملاح واليوريا والهرمونات وثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تمرين 4-1 التغيرات التي تطرأ على الدم في المرتفعات (كتاب النشاط ص 16–17)<\/td><td>يوجه إلى تحليل البيانات.<\/td><td>يستنتجون زيادة عدد خلايا الدم الحمراء تعويضًا عن قلة الأكسجين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 26-1 و27-1<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الصفائح والبلازما (كتاب الطالب ص 30–31)\nدور المعلم: يشرح دور الصفائح في تكوين الجلطة ومنع النزف ودخول الميكروبات، والمواد المنقولة في البلازما.\nدور الطالب: يعددون مواد تنقلها البلازما: الغلوكوز والأحماض الأمينية والأملاح واليوريا والهرمونات وثاني أكسيد الكربون.\n\n(12 دقيقة) تمرين 4-1 التغيرات التي تطرأ على الدم في المرتفعات (كتاب النشاط ص 16–17)\nدور المعلم: يوجه إلى تحليل البيانات.\nدور الطالب: يستنتجون زيادة عدد خلايا الدم الحمراء تعويضًا عن قلة الأكسجين.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 26-1 و27-1\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الصفائح الدموية؟<\/td><td>المساعدة في تخثر الدم عند الجروح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر ثلاث مواد تنقلها البلازما.<\/td><td>الغلوكوز، واليوريا، وثاني أكسيد الكربون (والهرمونات والأملاح).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يزداد عدد خلايا الدم الحمراء لدى من يعيشون في المرتفعات؟<\/td><td>لأن الأكسجين في الهواء أقل، فيزيد الجسم خلايا الدم الحمراء لنقل كمية كافية منه.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وظيفة الصفائح الدموية؟\nالإجابة النموذجية: المساعدة في تخثر الدم عند الجروح.\n\n2) [المستوى المتوقع] اذكر ثلاث مواد تنقلها البلازما.\nالإجابة النموذجية: الغلوكوز، واليوريا، وثاني أكسيد الكربون (والهرمونات والأملاح).\n\n3) [المستوى المتقدم] لماذا يزداد عدد خلايا الدم الحمراء لدى من يعيشون في المرتفعات؟\nالإجابة النموذجية: لأن الأكسجين في الهواء أقل، فيزيد الجسم خلايا الدم الحمراء لنقل كمية كافية منه."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تمنع الجلطة الدموية النزف ودخول .........<\/td><td>مسببات الأمراض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي ينقل ثاني أكسيد الكربون أساسًا من الخلايا إلى الرئتين؟<\/td><td>البلازما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رياضي تدرب في المرتفعات شهرًا ثم نافس عند مستوى البحر. فسّر تحسن أدائه.<\/td><td>زاد عدد خلايا دمه الحمراء في المرتفعات، فتنقل أكسجينًا أكثر إلى عضلاته عند مستوى البحر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تمنع الجلطة الدموية النزف ودخول .........\nالإجابة النموذجية: مسببات الأمراض.\n\n2) [المستوى المتوقع] ما الذي ينقل ثاني أكسيد الكربون أساسًا من الخلايا إلى الرئتين؟\nالإجابة النموذجية: البلازما.\n\n3) [المستوى المتقدم] رياضي تدرب في المرتفعات شهرًا ثم نافس عند مستوى البحر. فسّر تحسن أدائه.\nالإجابة النموذجية: زاد عدد خلايا دمه الحمراء في المرتفعات، فتنقل أكسجينًا أكثر إلى عضلاته عند مستوى البحر."},{"h":"<p>إكمال تمرين 4-1 في كتاب النشاط ص 16–17، والإجابة عن السؤالين 26-1 و27-1 والسؤال 8 من أسئلة نهاية الوحدة الأولى.<\/p>","t":"إكمال تمرين 4-1 في كتاب النشاط ص 16–17، والإجابة عن السؤالين 26-1 و27-1 والسؤال 8 من أسئلة نهاية الوحدة الأولى."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-1 الدم<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: النقل في الثدييات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 25–33 | كتاب النشاط: تمرين 4-1 ص 16–17<\/div><div><b>دليل المعلم:<\/b> ص 24<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مكونات الدم<\/div><ol class=\"ol\"><li>يذكر مكونات الدم: خلايا الدم الحمراء وخلايا الدم البيضاء والصفائح الدموية والبلازما.<\/li><li>يصف تركيب خلية الدم الحمراء وارتباطه بوظيفتها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقدر نسب مكونات الدم من صورة عينة دم مفصولة.<\/div><div class=\"psub\">الحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء<\/div><ol class=\"ol\"><li>يتعرف خلايا الدم الحمراء والبيضاء في صور مجهرية أو شرائح.<\/li><li>يذكر وظائف خلايا الدم البيضاء: البلعمة وإنتاج الأجسام المضادة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين الخلايا البلعمية والخلايا الليمفاوية من شكل النواة.<\/div><div class=\"psub\">الحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات<\/div><ol class=\"ol\"><li>يذكر وظيفة الصفائح الدموية في تخثر الدم ووظيفة البلازما في نقل المواد.<\/li><li>يفسر التغيرات التي تطرأ على الدم عند العيش في المرتفعات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يطبق مفاهيم الوحدة في حل أسئلة نهاية الوحدة.<\/div>","t":"الحصة 1: مكونات الدم\n1. يذكر مكونات الدم: خلايا الدم الحمراء وخلايا الدم البيضاء والصفائح الدموية والبلازما.\n2. يصف تركيب خلية الدم الحمراء وارتباطه بوظيفتها.\nمخرج تعليمي آخر: يقدر نسب مكونات الدم من صورة عينة دم مفصولة.\n\nالحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء\n1. يتعرف خلايا الدم الحمراء والبيضاء في صور مجهرية أو شرائح.\n2. يذكر وظائف خلايا الدم البيضاء: البلعمة وإنتاج الأجسام المضادة.\nمخرج تعليمي آخر: يميز بين الخلايا البلعمية والخلايا الليمفاوية من شكل النواة.\n\nالحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات\n1. يذكر وظيفة الصفائح الدموية في تخثر الدم ووظيفة البلازما في نقل المواد.\n2. يفسر التغيرات التي تطرأ على الدم عند العيش في المرتفعات.\nمخرج تعليمي آخر: يطبق مفاهيم الوحدة في حل أسئلة نهاية الوحدة."},{"h":"<div class=\"psub\">الحصة 1: مكونات الدم<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر مكونات الدم: خلايا الدم الحمراء وخلايا الدم البيضاء والصفائح الدموية والبلازما.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف تركيب خلية الدم الحمراء وارتباطه بوظيفتها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقدر نسب مكونات الدم من صورة عينة دم مفصولة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتعرف خلايا الدم الحمراء والبيضاء في صور مجهرية أو شرائح.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذكر وظائف خلايا الدم البيضاء: البلعمة وإنتاج الأجسام المضادة.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يميز بين الخلايا البلعمية والخلايا الليمفاوية من شكل النواة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر وظيفة الصفائح الدموية في تخثر الدم ووظيفة td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 3-1 استخدام المجهر الضوئي لمشاهدة خلايا الدم (كتاب الطالب)<\/td><td>يوجه إلى ضبط المجهر وفحص الشرائح بقوة تكبير مناسبة.<\/td><td>يرسمون خلية حمراء وخليتين بيضاوين ويقارنون الأعداد والأحجام.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">وظائف خلايا الدم البيضاء (كتاب الطالب ص 28–30)<\/td><td>يعرض على السبورة الذكية مقطعًا للبلعمة ويشرح إنتاج الأجسام المضادة.<\/td><td>يكملون جدولًا: نوع الخلية، شكل النواة، الوظيفة.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">السؤال 25-1<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الصفائح والبلازما (كتاب الطالب ص 30–31)<\/td><td>يشرح دور الصفائح في تكوين الجلطة ومنع النزف ودخول الميكروبات، والمواد المنقولة في البلازما.<\/td><td>يعددون مواد تنقلها البلازما: الغلوكوز والأحماض الأمينية والأملاح واليوريا والهرمونات وثاني أكسيد الكربون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تمرين 4-1 التغيرات التي تطرأ على الدم في المرتفعات (كتاب النشاط ص 16–17)<\/td><td>يوجه إلى تحليل البيانات.<\/td><td>يستنتجون زيادة عدد خلايا الدم الحمراء تعويضًا عن قلة الأكسجين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم والسؤالان 26-1 و27-1<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الدم\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) مكونات الدم (كتاب الطالب ص 25–27)\nدور المعلم: يشرح المكونات الأربعة ونسبها التقريبية.\nدور الطالب: يرسمون الأنبوب ويسمون طبقاته.\n\n(13 دقيقة) خلية الدم الحمراء\nدور المعلم: يعرض مقطعًا عن شكلها المقعر الوجهين وخلوها من النواة واحتوائها على الهيموجلوبين.\nدور الطالب: يربطون كل خاصية بوظيفة نقل الأكسجين.\n\n(5 دقائق) السؤالان 23-1 و24-1\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 3-1 استخدام المجهر الضوئي لمشاهدة خلايا الدم (كتاب الطالب)\nدور المعلم: يوجه إلى ضبط المجهر وفحص الشرائح بقوة تكبير مناسبة.\nدور الطالب: يرسمون خلية حمراء وخليتين بيضاوين ويقارنون الأعداد والأحجام.\n\n(10 دقائق) وظائف خلايا الدم البيضاء (كتاب الطالب ص 28–30)\nدور المعلم: يعرض على السبورة الذكية مقطعًا للبلعمة ويشرح إنتاج الأجسام المضادة.\nدور الطالب: يكملون جدولًا: نوع الخلية، شكل النواة، الوظيفة.\n\n(3 دقائق) السؤال 25-1\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) الصفائح والبلازما (كتاب الطالب ص 30–31)\nدور المعلم: يشرح دور الصفائح في تكوين الجلطة ومنع النزف ودخول الميكروبات، والمواد المنقولة في البلازما.\nدور الطالب: يعددون مواد تنقلها البلازما: الغلوكوز والأحماض الأمينية والأملاح واليوريا والهرمونات وثاني أكسيد الكربون.\n\n(12 دقيقة) تمرين 4-1 التغيرات التي تطرأ على الدم في المرتفعات (كتاب النشاط ص 16–17)\nدور المعلم: يوجه إلى تحليل البيانات.\nدور الطالب: يستنتجون زيادة عدد خلايا الدم الحمراء تعويضًا عن قلة الأكسجين.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والسؤالان 26-1 و27-1\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: مكونات الدم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر مكونات الدم الأربعة.<\/td><td>البلازما، وخلايا الدم الحمراء، وخلايا الدم البيضاء، والصفائح الدموية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الصبغة التي تحمل الأكسجين في خلايا الدم الحمراء؟<\/td><td>الهيموجلوبين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يساعد خلو خلية الدم الحمراء من النواة على أداء وظيفتها؟<\/td><td>يوفر حيزًا أكبر للهيموجلوبين فتحمل كمية أكبر من الأكسجين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أيهما أكثر عددًا في الشريحة: خلايا الدم الحمراء أم البيضاء؟<\/td><td>خلايا الدم الحمراء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الخلايا الليمفاوية؟<\/td><td>إنتاج الأجسام المضادة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف عملية البلعمة.<\/td><td>تحيط الخلية البلعمية بالجسم الغريب (كالبكتيريا) وتبتلعه ثم تهضمه بالإنزيمات.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الصفائح الدموية؟<\/td><td>المساعدة في تخثر الدم عند الجروح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر ثلاث مواد تنقلها البلازما.<\/td><td>الغلوكوز، واليوريا، وثاني أكسيد الكربون (والهرمونات والأملاح).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يزداد عدد خلايا الدم الحمراء لدى من يعيشون في المرتفعات؟<\/td><td>لأن الأكسجين في الهواء أقل، فيزيد الجسم خلايا الدم الحمراء لنقل كمية كافية منه.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الدم\n1) [مستوى الدعم] اذكر مكونات الدم الأربعة.\nالإجابة النموذجية: البلازما، وخلايا الدم الحمراء، وخلايا الدم البيضاء، والصفائح الدموية.\n\n2) [المستوى المتوقع] ما الصبغة التي تحمل الأكسجين في خلايا الدم الحمراء؟\nالإجابة النموذجية: الهيموجلوبين.\n\n3) [المستوى المتقدم] كيف يساعد خلو خلية الدم الحمراء من النواة على أداء وظيفتها؟\nالإجابة النموذجية: يوفر حيزًا أكبر للهيموجلوبين فتحمل كمية أكبر من الأكسجين.\n\nالحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء\n1) [مستوى الدعم] أيهما أكثر عددًا في الشريحة: خلايا الدم الحمراء أم البيضاء؟\nالإجابة النموذجية: خلايا الدم الحمراء.\n\n2) [المستوى المتوقع] ما وظيفة الخلايا الليمفاوية؟\nالإجابة النموذجية: إنتاج الأجسام المضادة.\n\n3) [المستوى المتقدم] صف عملية البلعمة.\nالإجابة النموذجية: تحيط الخلية البلعمية بالجسم الغريب (كالبكتيريا) وتبتلعه ثم تهضمه بالإنزيمات.\n\nالحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات\n1) [مستوى الدعم] ما وظيفة الصفائح الدموية؟\nالإجابة النموذجية: المساعدة في تخثر الدم عند الجروح.\n\n2) [المستوى المتوقع] اذكر ثلاث مواد تنقلها البلازما.\nالإجابة النموذجية: الغلوكوز، واليوريا، وثاني أكسيد الكربون (والهرمونات والأملاح).\n\n3) [المستوى المتقدم] لماذا يزداد عدد خلايا الدم الحمراء لدى من يعيشون في المرتفعات؟\nالإجابة النموذجية: لأن الأكسجين في الهواء أقل، فيزيد الجسم خلايا الدم الحمراء لنقل كمية كافية منه."},{"h":"<div class=\"psub\">الحصة 1: مكونات الدم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الجزء السائل من الدم يسمى .........<\/td><td>البلازما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: تحتوي خلايا الدم الحمراء الناضجة على نواة كبيرة.<\/td><td>خطأ؛ ليس لها نواة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يزيد الشكل المقعر الوجهين كفاءة خلية الدم الحمراء؟<\/td><td>لأنه يزيد مساحة السطح نسبة إلى الحجم فيسرع انتشار الأكسجين داخلها وخارجها.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تبتلع الخلايا ......... مسببات الأمراض.<\/td><td>البلعمية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يميز الخلية الليمفاوية في الصورة المجهرية؟<\/td><td>نواة كبيرة كروية تكاد تملأ الخلية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يزداد عدد خلايا الدم البيضاء عند الإصابة بعدوى؟<\/td><td>لزيادة قدرة الجسم على بلعمة مسببات المرض وإنتاج الأجسام المضادة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تمنع الجلطة الدموية النزف ودخول .........<\/td><td>مسببات الأمراض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي ينقل ثاني أكسيد الكربون أساسًا من الخلايا إلى الرئتين؟<\/td><td>البلازما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رياضي تدرب في المرتفعات شهرًا ثم نافس عند مستوى البحر. فسّر تحسن أدائه.<\/td><td>زاد عدد خلايا دمه الحمراء في المرتفعات، فتنقل أكسجينًا أكثر إلى عضلاته عند مستوى البحر.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مكونات الدم\n1) [مستوى الدعم] أكمل: الجزء السائل من الدم يسمى .........\nالإجابة النموذجية: البلازما.\n\n2) [المستوى المتوقع] صواب أم خطأ: تحتوي خلايا الدم الحمراء الناضجة على نواة كبيرة.\nالإجابة النموذجية: خطأ؛ ليس لها نواة.\n\n3) [المستوى المتقدم] لماذا يزيد الشكل المقعر الوجهين كفاءة خلية الدم الحمراء؟\nالإجابة النموذجية: لأنه يزيد مساحة السطح نسبة إلى الحجم فيسرع انتشار الأكسجين داخلها وخارجها.\n\nالحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء\n1) [مستوى الدعم] أكمل: تبتلع الخلايا ......... مسببات الأمراض.\nالإجابة النموذجية: البلعمية.\n\n2) [المستوى المتوقع] ما الذي يميز الخلية الليمفاوية في الصورة المجهرية؟\nالإجابة النموذجية: نواة كبيرة كروية تكاد تملأ الخلية.\n\n3) [المستوى المتقدم] لماذا يزداد عدد خلايا الدم البيضاء عند الإصابة بعدوى؟\nالإجابة النموذجية: لزيادة قدرة الجسم على بلعمة مسببات المرض وإنتاج الأجسام المضادة.\n\nالحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات\n1) [مستوى الدعم] أكمل: تمنع الجلطة الدموية النزف ودخول .........\nالإجابة النموذجية: مسببات الأمراض.\n\n2) [المستوى المتوقع] ما الذي ينقل ثاني أكسيد الكربون أساسًا من الخلايا إلى الرئتين؟\nالإجابة النموذجية: البلازما.\n\n3) [المستوى المتقدم] رياضي تدرب في المرتفعات شهرًا ثم نافس عند مستوى البحر. فسّر تحسن أدائه.\nالإجابة النموذجية: زاد عدد خلايا دمه الحمراء في المرتفعات، فتنقل أكسجينًا أكثر إلى عضلاته عند مستوى البحر."},{"h":"<div class=\"psub\">الحصة 1: مكونات الدم<\/div><p>مراجعة كتاب الطالب ص 25–27 والإجابة عن السؤالين 23-1 و24-1.<\/p><div class=\"psub\">الحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء<\/div><p>كتابة تقرير النشاط 3-1 مع الرسوم، والإجابة عن السؤال 25-1 في كتاب الطالب.<\/p><div class=\"psub\">الحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات<\/div><p>إكمال تمرين 4-1 في كتاب النشاط ص 16–17، والإجابة عن السؤالين 26-1 و27-1 والسؤال 8 من أسئلة نهاية الوحدة الأولى.<\/p>","t":"الحصة 1: مكونات الدم\nمراجعة كتاب الطالب ص 25–27 والإجابة عن السؤالين 23-1 و24-1.\n\nالحصة 2: مشاهدة خلايا الدم بالمجهر ووظائف خلايا الدم البيضاء\nكتابة تقرير النشاط 3-1 مع الرسوم، والإجابة عن السؤال 25-1 في كتاب الطالب.\n\nالحصة 3: وظائف الصفائح والبلازما وتغيرات الدم في المرتفعات\nإكمال تمرين 4-1 في كتاب النشاط ص 16–17، والإجابة عن السؤالين 26-1 و27-1 والسؤال 8 من أسئلة نهاية الوحدة الأولى."}]}},{"label":"1-2 تبادل الغازات في الإنسان","unit":"الوحدة الثانية: تبادل الغازات","periods":[{"n":1,"focus":"تركيب جهاز تبادل الغازات","info":"<div><b>الدرس:<\/b> 1-2 تبادل الغازات في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 34–41 | كتاب النشاط: تمرين 1-2 ص 22، تمرين 2-2 ص 23–26<\/div><div><b>دليل المعلم:<\/b> ص 37–38<\/div><div><b>محور الحصة:<\/b> تركيب جهاز تبادل الغازات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها.<\/li><li>يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد التراكيب على نموذج أو رئة حقيقية.<\/div>","t":"1. يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها.\n2. يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائية.\nمخرج تعليمي آخر: يحدد التراكيب على نموذج أو رئة حقيقية."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائية.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد التراكيب على نموذج أو رئة حقيقية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يسمي تراكيب جهاز تبادل الغازات ويحددها: الرئتان والحجاب الحاجز والضلوع والعضلات الوربية والحنجرة والقصبة الهوائية والشعب والشعيبات والحويصلات الهوائية والشعيرات المرتبطة بها. ← تذكر\n• يتتبع مسار الهواء من الأنف حتى الحويصلات الهوائية. ← فهم\n• يحدد التراكيب على نموذج أو رئة حقيقية. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>أخرى: رئة خروف للفحص (إثرائي) أو صور، قفازات<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• أخرى: رئة خروف للفحص (إثرائي) أو صور، قفازات"},{"h":"<div class=\"pills\"><span>القصبة الهوائية<\/span><span>الشعب الهوائية<\/span><span>الشعيبات<\/span><span>الحويصلات الهوائية<\/span><span>الحجاب الحاجز<\/span><span>العضلات الوربية<\/span><\/div>","t":"القصبة الهوائية، الشعب الهوائية، الشعيبات، الحويصلات الهوائية، الحجاب الحاجز، العضلات الوربية"},{"h":"<p>يطلب المعلم من الطلبة وضع أيديهم على صدورهم وأخذ نفس عميق ويسأل: ماذا تلاحظ؟ وإلى أين يذهب الهواء؟<\/p>","t":"يطلب المعلم من الطلبة وضع أيديهم على صدورهم وأخذ نفس عميق ويسأل: ماذا تلاحظ؟ وإلى أين يذهب الهواء؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يوجه إلى التنفس العميق.<\/td><td>يلاحظون ارتفاع القفص الصدري.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">أجزاء الجهاز (كتاب الطالب ص 34–35)<\/td><td>يعرض على السبورة الذكية مخطط جهاز تبادل الغازات ونموذجًا مجسمًا.<\/td><td>يرسمون المخطط ويسمون أجزاءه.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">النشاط 1-2 فحص الرئتين (إثرائي)<\/td><td>يعرض رئة خروف أو صورها ويوضح الغضاريف الحلقية في القصبة والنسيج الإسفنجي.<\/td><td>يحددون التراكيب ويسجلون ملاحظاتهم.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مسار الهواء<\/td><td>يطلب ترتيب بطاقات المسار.<\/td><td>يرتبون: الأنف، الحنجرة، القصبة، الشعب، الشعيبات، الحويصلات.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يوجه إلى التنفس العميق.\nدور الطالب: يلاحظون ارتفاع القفص الصدري.\n\n(12 دقيقة) أجزاء الجهاز (كتاب الطالب ص 34–35)\nدور المعلم: يعرض على السبورة الذكية مخطط جهاز تبادل الغازات ونموذجًا مجسمًا.\nدور الطالب: يرسمون المخطط ويسمون أجزاءه.\n\n(13 دقيقة) النشاط 1-2 فحص الرئتين (إثرائي)\nدور المعلم: يعرض رئة خروف أو صورها ويوضح الغضاريف الحلقية في القصبة والنسيج الإسفنجي.\nدور الطالب: يحددون التراكيب ويسجلون ملاحظاتهم.\n\n(5 دقائق) مسار الهواء\nدور المعلم: يطلب ترتيب بطاقات المسار.\nدور الطالب: يرتبون: الأنف، الحنجرة، القصبة، الشعب، الشعيبات، الحويصلات.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أين يحدث تبادل الغازات في الرئتين؟<\/td><td>في الحويصلات الهوائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب مسار الهواء: الشعيبات، القصبة الهوائية، الحويصلات، الشعب.<\/td><td>القصبة الهوائية ← الشعب ← الشعيبات ← الحويصلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تحتوي القصبة الهوائية على حلقات غضروفية؟<\/td><td>لتبقى مفتوحة ولا تنطبق أثناء التنفس.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أين يحدث تبادل الغازات في الرئتين؟\nالإجابة النموذجية: في الحويصلات الهوائية.\n\n2) [المستوى المتوقع] رتب مسار الهواء: الشعيبات، القصبة الهوائية، الحويصلات، الشعب.\nالإجابة النموذجية: القصبة الهوائية ← الشعب ← الشعيبات ← الحويصلات.\n\n3) [المستوى المتقدم] لماذا تحتوي القصبة الهوائية على حلقات غضروفية؟\nالإجابة النموذجية: لتبقى مفتوحة ولا تنطبق أثناء التنفس."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: العضلة التي تفصل التجويف الصدري عن البطني هي .........<\/td><td>الحجاب الحاجز.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العضلات الموجودة بين الضلوع؟<\/td><td>العضلات الوربية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يبدو نسيج الرئة إسفنجيًا؟<\/td><td>لاحتوائه على أعداد هائلة من الحويصلات الهوائية المملوءة بالهواء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: العضلة التي تفصل التجويف الصدري عن البطني هي .........\nالإجابة النموذجية: الحجاب الحاجز.\n\n2) [المستوى المتوقع] ما العضلات الموجودة بين الضلوع؟\nالإجابة النموذجية: العضلات الوربية.\n\n3) [المستوى المتقدم] لماذا يبدو نسيج الرئة إسفنجيًا؟\nالإجابة النموذجية: لاحتوائه على أعداد هائلة من الحويصلات الهوائية المملوءة بالهواء."},{"h":"<p>مراجعة كتاب الطالب ص 34–35 ورسم مخطط جهاز تبادل الغازات مع تسمية أجزائه.<\/p>","t":"مراجعة كتاب الطالب ص 34–35 ورسم مخطط جهاز تبادل الغازات مع تسمية أجزائه."}]},{"n":2,"focus":"خصائص أسطح تبادل الغازات","info":"<div><b>الدرس:<\/b> 1-2 تبادل الغازات في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: تبادل الغازات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 6<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 34–41 | كتاب النشاط: تمرين 1-2 ص 22، تمرين 2-2 ص 23–26<\/div><div><b>دليل المعلم:<\/b> ص 37–38<\/div><div><b>محور الحصة:<\/b> خصائص أسطح تبادل الغازات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يعدد خصائص أسطح تبادل الغازات في الحويصلات: مساحة سطحية كبيرة، وسطح رقيق، وإمداد جيد بالدم، وتهوية جيدة.<\/li><li>يفسر كيف تزيد كل خاصية سرعة الانتشار.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن أسطح تبادل الغازات في الإنسان بغيره من الكائنات.<\/div>","t":"1. يعدد خصائص أسطح تبادل الغازات في الحويصلات: مساحة سطحية كبيرة، وسطح رقيق، وإمداد جيد بالدم، وتهوية جيدة.\n2. يفسر كيف تزيد كل خاصية سرعة الانتشار.\nمخرج تعليمي آخر: يقارن أسطح تبادل الغازات في الإنسان بغيره من الكائنات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعدد خصائص أ
