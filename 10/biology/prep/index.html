الزهرة الحشرية ووظائف أجزائها\nالسبلات، البتلات، الأسدية، المتك، الكربلة، الميسم، القلم، المبيض، البويضات\n\nالحصة 2: التلقيح بالحشرات وبالرياح\nالتلقيح، الأزهار الحشرية، الأزهار الريحية، حبوب اللقاح، الميسم الريشي، الرحيق\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\nالإخصاب، أنبوب اللقاح، الإنبات، الماء، الأكسجين، درجة الحرارة المناسبة"},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><p>يعرض زهرة كركديه ويسأل: لماذا تكون بعض الأزهار ملونة وذات رائحة؟<\/p><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><p>سؤال: الأعشاب في الحدائق أزهارها صغيرة باهتة بلا رائحة، فكيف تنتقل حبوب لقاحها؟<\/p><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><p>سؤال: لماذا لا تنبت البذور المحفوظة في علبتها الجافة في المطبخ؟<\/p>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\nيعرض زهرة كركديه ويسأل: لماذا تكون بعض الأزهار ملونة وذات رائحة؟\n\nالحصة 2: التلقيح بالحشرات وبالرياح\nسؤال: الأعشاب في الحدائق أزهارها صغيرة باهتة بلا رائحة، فكيف تنتقل حبوب لقاحها؟\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\nسؤال: لماذا لا تنبت البذور المحفوظة في علبتها الجافة في المطبخ؟"},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الزهرة.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 1-3 استقصاء تركيب الزهرة (كتاب الطالب)<\/td><td>يوجه إلى تشريح الزهرة من الخارج إلى الداخل ولصق الأجزاء في ورقة، مع الحذر عند استخدام المشرط.<\/td><td>يفصلون الأجزاء ويلصقونها ويسمونها ويفحصون المتك والميسم بالعدسة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">وظائف الأجزاء (كتاب الطالب ص 55–57)<\/td><td>يعرض على السبورة الذكية جدول الوظائف.<\/td><td>يكتبون وظيفة كل جزء بجانب العينة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 1-3 (البدء – كتاب النشاط ص 30)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-3 التلقيح (كتاب الطالب)<\/td><td>يوجه إلى مقارنة زهرة حشرية وزهرة ريحية بالعدسة وصور حبوب اللقاح.<\/td><td>يكملون جدول مقارنة: البتلات، الرائحة والرحيق، موضع المتوك والمياسم، شكل الميسم، حبوب اللقاح.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ربط التركيب بالتكيف (كتاب الطالب ص 58–59)<\/td><td>يناقش على السبورة الذكية سبب كل تكيف.<\/td><td>يفسرون التكيفات.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ورقة العمل 2-3 تكيفات التلقيح (كتاب النشاط ص 36)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">الإخصاب ونمو أنبوب اللقاح (كتاب الطالب ص 59–60)<\/td><td>يعرض على السبورة الذكية مخطط نمو أنبوب اللقاح عبر القلم حتى البويضة، ويشير إلى النشاط 3-3.<\/td><td>يرسمون المسار ويحددون موضع الإخصاب.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 4-3 التعرف على الظروف اللازمة لإنبات بذور الطماطم (كتاب الطالب)<\/td><td>يوجه المجموعات إلى إعداد أطباق: ماء ودفء، بلا ماء، ماء مغلي تحت الزيت، ثلاجة.<\/td><td>يعدون الأطباق ويكتبون توقعاتهم ويخططون للمتابعة.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\n(5 دقائق) التهيئة\nدور المعلم: يعرض الزهرة.\nدور الطالب: يتوقعون.\n\n(17 دقيقة) النشاط 1-3 استقصاء تركيب الزهرة (كتاب الطالب)\nدور المعلم: يوجه إلى تشريح الزهرة من الخارج إلى الداخل ولصق الأجزاء في ورقة، مع الحذر عند استخدام المشرط.\nدور الطالب: يفصلون الأجزاء ويلصقونها ويسمونها ويفحصون المتك والميسم بالعدسة.\n\n(8 دقائق) وظائف الأجزاء (كتاب الطالب ص 55–57)\nدور المعلم: يعرض على السبورة الذكية جدول الوظائف.\nدور الطالب: يكتبون وظيفة كل جزء بجانب العينة.\n\n(5 دقائق) تمرين 1-3 (البدء – كتاب النشاط ص 30)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: التلقيح بالحشرات وبالرياح\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(15 دقيقة) النشاط 2-3 التلقيح (كتاب الطالب)\nدور المعلم: يوجه إلى مقارنة زهرة حشرية وزهرة ريحية بالعدسة وصور حبوب اللقاح.\nدور الطالب: يكملون جدول مقارنة: البتلات، الرائحة والرحيق، موضع المتوك والمياسم، شكل الميسم، حبوب اللقاح.\n\n(10 دقائق) ربط التركيب بالتكيف (كتاب الطالب ص 58–59)\nدور المعلم: يناقش على السبورة الذكية سبب كل تكيف.\nدور الطالب: يفسرون التكيفات.\n\n(5 دقائق) ورقة العمل 2-3 تكيفات التلقيح (كتاب النشاط ص 36)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(8 دقائق) الإخصاب ونمو أنبوب اللقاح (كتاب الطالب ص 59–60)\nدور المعلم: يعرض على السبورة الذكية مخطط نمو أنبوب اللقاح عبر القلم حتى البويضة، ويشير إلى النشاط 3-3.\nدور الطالب: يرسمون المسار ويحددون موضع الإخصاب.\n\n(15 دقيقة) النشاط 4-3 التعرف على الظروف اللازمة لإنبات بذور الطماطم (كتاب الطالب)\nدور المعلم: يوجه المجموعات إلى إعداد أطباق: ماء ودفء، بلا ماء، ماء مغلي تحت الزيت، ثلاجة.\nدور الطالب: يعدون الأطباق ويكتبون توقعاتهم ويخططون للمتابعة.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة المتك؟<\/td><td>إنتاج حبوب اللقاح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الجزء الذي يستقبل حبوب اللقاح؟<\/td><td>الميسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما الذي يتكون داخل المبيض؟ وما الذي يتحول إليه بعد الإخصاب؟<\/td><td>البويضات، وتتحول إلى بذور، ويتحول المبيض إلى ثمرة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف التلقيح.<\/td><td>انتقال حبوب اللقاح من المتك إلى الميسم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر تكيفين في الأزهار الملقحة بالرياح.<\/td><td>مياسم ريشية متدلية خارج الزهرة، ومتوك متدلية، وحبوب لقاح خفيفة كثيرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تنتج الأزهار الريحية حبوب لقاح كثيرة جدًا؟<\/td><td>لأن معظمها يضيع في الهواء ولا يصل إلى المياسم، فالكثرة تزيد فرصة التلقيح.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أين يحدث الإخصاب في الزهرة؟<\/td><td>داخل البويضة في المبيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الظروف الثلاثة اللازمة لإنبات البذور؟<\/td><td>الماء، والأكسجين، ودرجة الحرارة المناسبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا تنبت البذور في الماء المغلي المغطى بالزيت؟<\/td><td>لعدم وجود الأكسجين اللازم للتنفس الخلوي.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\n1) [مستوى الدعم] ما وظيفة المتك؟\nالإجابة النموذجية: إنتاج حبوب اللقاح.\n\n2) [المستوى المتوقع] ما الجزء الذي يستقبل حبوب اللقاح؟\nالإجابة النموذجية: الميسم.\n\n3) [المستوى المتقدم] ما الذي يتكون داخل المبيض؟ وما الذي يتحول إليه بعد الإخصاب؟\nالإجابة النموذجية: البويضات، وتتحول إلى بذور، ويتحول المبيض إلى ثمرة.\n\nالحصة 2: التلقيح بالحشرات وبالرياح\n1) [مستوى الدعم] عرّف التلقيح.\nالإجابة النموذجية: انتقال حبوب اللقاح من المتك إلى الميسم.\n\n2) [المستوى المتوقع] اذكر تكيفين في الأزهار الملقحة بالرياح.\nالإجابة النموذجية: مياسم ريشية متدلية خارج الزهرة، ومتوك متدلية، وحبوب لقاح خفيفة كثيرة.\n\n3) [المستوى المتقدم] لماذا تنتج الأزهار الريحية حبوب لقاح كثيرة جدًا؟\nالإجابة النموذجية: لأن معظمها يضيع في الهواء ولا يصل إلى المياسم، فالكثرة تزيد فرصة التلقيح.\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\n1) [مستوى الدعم] أين يحدث الإخصاب في الزهرة؟\nالإجابة النموذجية: داخل البويضة في المبيض.\n\n2) [المستوى المتوقع] ما الظروف الثلاثة اللازمة لإنبات البذور؟\nالإجابة النموذجية: الماء، والأكسجين، ودرجة الحرارة المناسبة.\n\n3) [المستوى المتقدم] لماذا لا تنبت البذور في الماء المغلي المغطى بالزيت؟\nالإجابة النموذجية: لعدم وجود الأكسجين اللازم للتنفس الخلوي."},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تحمي ......... الزهرة وهي برعم.<\/td><td>السبلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الأسدية هي الأعضاء الأنثوية في الزهرة.<\/td><td>خطأ؛ هي الأعضاء الذكرية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تكون البتلات في الأزهار الحشرية كبيرة وملونة؟<\/td><td>لجذب الحشرات التي تنقل حبوب اللقاح.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: حبوب لقاح الأزهار الحشرية غالبًا ......... أو شائكة لتلتصق بالحشرات.<\/td><td>لزجة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الأزهار الريحية تنتج رحيقًا لجذب الحشرات.<\/td><td>خطأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زهرة صغيرة خضراء ميسمها ريشي ومتوكها خارج الزهرة. صنّفها وبرر.<\/td><td>ريحية التلقيح؛ لصغر بتلاتها وباهت لونها وشكل الميسم وموضع المتوك.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ينمو ......... من حبة اللقاح عبر القلم حتى يصل إلى البويضة.<\/td><td>أنبوب اللقاح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: الضوء ضروري لإنبات معظم البذور.<\/td><td>خطأ؛ ليس من الظروف الأساسية للإنبات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم تجربة لاختبار أثر درجة الحرارة في الإنبات مع تحديد المتغيرات.<\/td><td>المستقل: درجة الحرارة (ثلاجة، غرفة، حاضنة دافئة)؛ التابع: عدد البذور النابتة؛ الثوابت: نوع البذور وعددها وكمية الماء وتوفر الهواء.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\n1) [مستوى الدعم] أكمل: تحمي ......... الزهرة وهي برعم.\nالإجابة النموذجية: السبلات.\n\n2) [المستوى المتوقع] صواب أم خطأ: الأسدية هي الأعضاء الأنثوية في الزهرة.\nالإجابة النموذجية: خطأ؛ هي الأعضاء الذكرية.\n\n3) [المستوى المتقدم] لماذا تكون البتلات في الأزهار الحشرية كبيرة وملونة؟\nالإجابة النموذجية: لجذب الحشرات التي تنقل حبوب اللقاح.\n\nالحصة 2: التلقيح بالحشرات وبالرياح\n1) [مستوى الدعم] أكمل: حبوب لقاح الأزهار الحشرية غالبًا ......... أو شائكة لتلتصق بالحشرات.\nالإجابة النموذجية: لزجة.\n\n2) [المستوى المتوقع] صواب أم خطأ: الأزهار الريحية تنتج رحيقًا لجذب الحشرات.\nالإجابة النموذجية: خطأ.\n\n3) [المستوى المتقدم] زهرة صغيرة خضراء ميسمها ريشي ومتوكها خارج الزهرة. صنّفها وبرر.\nالإجابة النموذجية: ريحية التلقيح؛ لصغر بتلاتها وباهت لونها وشكل الميسم وموضع المتوك.\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\n1) [مستوى الدعم] أكمل: ينمو ......... من حبة اللقاح عبر القلم حتى يصل إلى البويضة.\nالإجابة النموذجية: أنبوب اللقاح.\n\n2) [المستوى المتوقع] صواب أم خطأ: الضوء ضروري لإنبات معظم البذور.\nالإجابة النموذجية: خطأ؛ ليس من الظروف الأساسية للإنبات.\n\n3) [المستوى المتقدم] صمم تجربة لاختبار أثر درجة الحرارة في الإنبات مع تحديد المتغيرات.\nالإجابة النموذجية: المستقل: درجة الحرارة (ثلاجة، غرفة، حاضنة دافئة)؛ التابع: عدد البذور النابتة؛ الثوابت: نوع البذور وعددها وكمية الماء وتوفر الهواء."},{"h":"<div class=\"psub\">الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها<\/div><p>مراجعة كتاب الطالب ص 55–57 والإجابة عن السؤالين 9-3 و10-3، ورسم زهرة حشرية مع تسمية أجزائها.<\/p><div class=\"psub\">الحصة 2: التلقيح بالحشرات وبالرياح<\/div><p>إكمال ورقة العمل 2-3 تكيفات التلقيح في كتاب النشاط ص 36 وتمرين 1-3 التلقيح في غابات مختلفة الأشكال والحجوم ص 30–33، والإجابة عن السؤالين 11-3 و12-3.<\/p><div class=\"psub\">الحصة 3: الإخصاب في النبات وظروف إنبات البذور<\/div><p>متابعة أطباق النشاط 4-3 يوميًا وتسجيل النتائج، وحل ورقة العمل 1-3 التكاثر في النبات في كتاب النشاط ص 35، والإجابة عن السؤالين 13-3 و14-3 والأسئلة 4 و5 و6 من أسئلة نهاية الوحدة.<\/p>","t":"الحصة 1: تركيب الزهرة الحشرية ووظائف أجزائها\nمراجعة كتاب الطالب ص 55–57 والإجابة عن السؤالين 9-3 و10-3، ورسم زهرة حشرية مع تسمية أجزائها.\n\nالحصة 2: التلقيح بالحشرات وبالرياح\nإكمال ورقة العمل 2-3 تكيفات التلقيح في كتاب النشاط ص 36 وتمرين 1-3 التلقيح في غابات مختلفة الأشكال والحجوم ص 30–33، والإجابة عن السؤالين 11-3 و12-3.\n\nالحصة 3: الإخصاب في النبات وظروف إنبات البذور\nمتابعة أطباق النشاط 4-3 يوميًا وتسجيل النتائج، وحل ورقة العمل 1-3 التكاثر في النبات في كتاب النشاط ص 35، والإجابة عن السؤالين 13-3 و14-3 والأسئلة 4 و5 و6 من أسئلة نهاية الوحدة."}]}},{"label":"3-3 مقارنة التكاثر الجنسي بالتكاثر اللاجنسي","unit":"الوحدة الثالثة: التكاثر في النبات","periods":[{"n":1,"focus":"مزايا التكاثر اللاجنسي وعيوبه","info":"<div><b>الدرس:<\/b> 3-3 مقارنة التكاثر الجنسي بالتكاثر اللاجنسي<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 63–67 | كتاب النشاط: تمرين 2-3 ص 34<\/div><div><b>دليل المعلم:<\/b> ص 53<\/div><div><b>محور الحصة:<\/b> مزايا التكاثر اللاجنسي وعيوبه<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية.<\/li><li>يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات.<\/div>","t":"1. يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية.\n2. يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة.\nمخرج تعليمي آخر: يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية. ← تحليل\n• يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة. ← تحليل\n• يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><spa مقابل غياب التنوع والتزاحم.\nدور الطالب: يكملون جدولًا: المزايا، العيوب.\n\n(13 دقيقة) دراسة حالة: المزارع العماني\nدور المعلم: يعرض حالة إكثار النخيل بالفسائل للحفاظ على الصنف المرغوب.\nدور الطالب: يقيّمون قرار المزارع ومخاطره.\n\n(5 دقائق) نقاش ختامي\nدور المعلم: يلخص على السبورة الذكية.\nدور الطالب: يدونون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ميزة للتكاثر اللاجنسي.<\/td><td>سريع ولا يحتاج إلى شريك، وينقل الصفات المرغوبة كما هي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر عيبًا للتكاثر اللاجنسي.<\/td><td>غياب التنوع الجيني فقد يقضي مرض واحد على جميع الأفراد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكثّر المزارعون النخيل بالفسائل لا بالبذور؟<\/td><td>لأن الفسائل تعطي نخيلًا مماثلًا للصنف الأصلي في جودة التمر، أما البذور فتعطي صفات مختلفة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ميزة للتكاثر اللاجنسي.\nالإجابة النموذجية: سريع ولا يحتاج إلى شريك، وينقل الصفات المرغوبة كما هي.\n\n2) [المستوى المتوقع] اذكر عيبًا للتكاثر اللاجنسي.\nالإجابة النموذجية: غياب التنوع الجيني فقد يقضي مرض واحد على جميع الأفراد.\n\n3) [المستوى المتقدم] لماذا يكثّر المزارعون النخيل بالفسائل لا بالبذور؟\nالإجابة النموذجية: لأن الفسائل تعطي نخيلًا مماثلًا للصنف الأصلي في جودة التمر، أما البذور فتعطي صفات مختلفة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: نسل التكاثر اللاجنسي ينمو غالبًا قريبًا من الأب فيتنافس على الموارد.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>متى يكون التكاثر اللاجنسي مفيدًا للنوع؟<\/td><td>في البيئات المستقرة التي يناسبها الأب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التكاثر اللاجنسي خطرًا إذا تغير المناخ فجأة؟<\/td><td>لأن جميع ><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المزايا والعيوب (كتاب الطالب ص 64–65)\nدور المعلم: يناقش التنوع وانتشار البذور بعيدًا، مقابل الحاجة إلى التلقيح والطاقة والزمن الأطول.\nدور الطالب: يكملون جدولًا: المزايا، العيوب.\n\n(10 دقائق) محاكاة: المرض والتنوع\nدور المعلم: يوزع بطاقات نباتات بألوان مختلفة تمثل صفات متنوعة، ثم يعلن «مرضًا» يصيب لونًا واحدًا.\nدور الطالب: يلاحظون بقاء بعض الأفراد في المجموعة المتنوعة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ميزة للتكاثر الجنسي.<\/td><td>ينتج نسلًا متنوعًا جينيًا يزيد قدرة النوع على التكيف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر عيبًا للتكاثر الجنسي.<\/td><td>يحتاج إلى أبوين أو تلقيح، وهو أبطأ ويستهلك طاقة أكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يساعد التنوع الجيني على بقاء النوع عند ظهور مرض جديد؟<\/td><td>قد يمتلك بعض الأفراد صفات تقاوم المرض فيبقون ويتكاثرون.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ميزة للتكاثر الجنسي.\nالإجابة النموذجية: ينتج نسلًا متنوعًا جينيًا يزيد قدرة النوع على التكيف.\n\n2) [المستوى المتوقع] اذكر عيبًا للتكاثر الجنسي.\nالإجابة النموذجية: يحتاج إلى أبوين أو تلقيح، وهو أبطأ ويستهلك طاقة أكبر.\n\n3) [المستوى المتقدم] كيف يساعد التنوع الجيني على بقاء النوع عند ظهور مرض جديد؟\nالإجابة النموذجية: قد يمتلك بعض الأفراد صفات تقاوم المرض فيبقون ويتكاثرون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: انتشار البذور بعيدًا عن النبات الأم يقلل .........<\/td><td>التنافس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: التكاثر الجنسي أسرع من اللاجنسي.<\/td><td>خطأ؛ هو أبطأ عادة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التكاثر الجنسي مهمًا في برامج تحسين المحاصيل؟<\/td><td>لأنه ينتج تراكيب وراثية جديدة يمكن انتقاء أفضلها، مثل مقاومة الجفاف أو الأمراض.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: انتشار البذور بعيدًا عن النبات الأم يقلل .........\nالإجابة النموذجية: التنافس.\n\n2) [المستوى المتوقع] صواب أم خطأ: التكاثر الجنسي أسرع من اللاجنسي.\nالإجابة النموذجية: خطأ؛ هو أبطأ عادة.\n\n3) [المستوى المتقدم] لماذا يُعد التكاثر الجنسي مهمًا في برامج تحسين المحاصيل؟\nالإجابة النموذجية: لأنه ينتج تراكيب وراثية جديدة يمكن انتقاء أفضلها، مثل مقاومة الجفاف أو الأمراض."},{"h":"<p>مراجعة كتاب الطالب ص 64–65، والبدء في تمرين 2-3 التكاثر الجنسي والتكاثر اللاجنسي في كتاب النشاط ص 34.<\/p>","t":"مراجعة كتاب الطالب ص 64–65، والبدء في تمرين 2-3 التكاثر الجنسي والتكاثر اللاجنسي في كتاب النشاط ص 34."}]},{"n":3,"focus":"المقارنة الشاملة ومراجعة الوحدة الثالثة","info":"<div><b>الدرس:<\/b> 3-3 مقارنة التكاثر الجنسي بالتكاثر اللاجنسي<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 63–67 | كتاب النشاط: تمرين 2-3 ص 34<\/div><div><b>دليل المعلم:<\/b> ص 53<\/div><div><b>محور الحصة:<\/b> المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يقارن بين التكاثر الجنسي واللاجنسي في جدول شامل.<\/li><li>يطبق مفاهيم الوحدة في حل أسئلة نهاية الوحدة الثالثة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم الطريقة الأنسب لإكثار نبات في موقف معين.<\/div>","t":"1. يقارن بين التكاثر الجنسي واللاجنسي في جدول شامل.\n2. يطبق مفاهيم الوحدة في حل أسئلة نهاية الوحدة الثالثة.\nمخرج تعليمي آخر: يقيّم الطريقة الأنسب لإكثار نبات في موقف معين."},{"h":"<table class=\"t\"><t  34 وكتاب الطالب ص 66–67)<\/td><td>يوزع الأسئلة على المجموعات.<\/td><td>يحلون ويعرضون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة: نتائج الإنبات\nدور المعلم: يعرض النتائج على السبورة الذكية.\nدور الطالب: يفسرونها.\n\n(10 دقائق) جدول المقارنة الشامل\nدور المعلم: يوجه إلى إكمال جدول: عدد الأبوين، الأمشاج، التماثل الجيني، السرعة، التكيف.\nدور الطالب: يكملون الجدول.\n\n(13 دقيقة) تمرين 2-3 وأسئلة نهاية الوحدة الثالثة (كتاب النشاط ص 34 وكتاب الطالب ص 66–67)\nدور المعلم: يوزع الأسئلة على المجموعات.\nدور الطالب: يحلون ويعرضون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي التكاثرين يحتاج إلى أمشاج؟<\/td><td>التكاثر الجنسي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قارن بين التكاثرين من حيث التماثل الجيني للنسل.<\/td><td>اللاجنسي ينتج نسلًا متماثلًا، والجنسي ينتج نسلًا مختلفًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مزارع يريد إنتاج آلاف الشتلات من صنف فراولة ممتاز بسرعة. أي طريقة يختار؟ وما الخطر؟<\/td><td>التكاثر اللاجنسي بالمدادات؛ والخطر أن مرضًا واحدًا قد يصيب جميع الشتلات لتماثلها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أي التكاثرين يحتاج إلى أمشاج؟\nالإجابة النموذجية: التكاثر الجنسي.\n\n2) [المستوى المتوقع] قارن بين التكاثرين من حيث التماثل الجيني للنسل.\nالإجابة النموذجية: اللاجنسي ينتج نسلًا متماثلًا، والجنسي ينتج نسلًا مختلفًا.\n\n3) [المستوى المتقدم] مزارع يريد إنتاج آلاف الشتلات من صنف فراولة ممتاز بسرعة. أي طريقة يختار؟ وما الخطر؟\nالإجابة النموذجية: التكاثر اللاجنسي بالمدادات؛ والخطر أن مرضًا واحدًا قد يصيب جميع الشتلات لتماثلها."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يحتاج التكاثر الجنسي في النبات إلى التلقيح.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الظرف الذي لا يلزم لإنبات معظم البذور: الماء أم الضوء؟<\/td><td>الضوء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تتكاثر بعض النباتات بالطريقتين معًا؟<\/td><td>لتجمع بين سرعة الانتشار المحلي بالتكاثر اللاجنسي والتنوع والانتشار البعيد بالتكاثر الجنسي.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يحتاج التكاثر الجنسي في النبات إلى التلقيح.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الظرف الذي لا يلزم لإنبات معظم البذور: الماء أم الضوء؟\nالإجابة النموذجية: الضوء.\n\n3) [المستوى المتقدم] لماذا تتكاثر بعض النباتات بالطريقتين معًا؟\nالإجابة النموذجية: لتجمع بين سرعة الانتشار المحلي بالتكاثر اللاجنسي والتنوع والانتشار البعيد بالتكاثر الجنسي."},{"h":"<p>إكمال تمرين 2-3 في كتاب النشاط ص 34 وأسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 66–67، والاستعداد للوحدة الرابعة: التكاثر في الإنسان (ص 68).<\/p>","t":"إكمال تمرين 2-3 في كتاب النشاط ص 34 وأسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 66–67، والاستعداد للوحدة الرابعة: التكاثر في الإنسان (ص 68)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-3 مقارنة التكاثر الجنسي بالتكاثر اللاجنسي<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: التكاثر في النبات<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 63–67 | كتاب النشاط: تمرين 2-3 ص 34<\/div><div><b>دليل المعلم:<\/b> ص 53<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><ol class=\"ol\"><li>يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية.<\/li><li>يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات.<\/div><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><ol class=\"ol\"><li>يناقش مزايا التكاثر الجنسي لأفراد النوع الواحد التي تعيش في البرية.<\/li><li>يناقش عيوب التكاثر الجنسي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يربط التنوع الجيني بقدرة النوع على التكيف مع التغيرات.<\/div><div class=\"psub\">الحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div><ol class=\"ol\"><li>يقارن بين التكاثر الجنسي واللاجنسي في جدول شامل.<\/li><li>يطبق مفاهيم الوحدة في حل أسئلة نهاية الوحدة الثالثة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم الطريقة الأنسب لإكثار نبات في موقف معين.<\/div>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\n1. يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية.\n2. يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة.\nمخرج تعليمي آخر: يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات.\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\n1. يناقش مزايا التكاثر الجنسي لأفراد النوع الواحد التي تعيش في البرية.\n2. يناقش عيوب التكاثر الجنسي.\nمخرج تعليمي آخر: يربط التنوع الجيني بقدرة النوع على التكيف مع التغيرات.\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\n1. يقارن بين التكاثر الجنسي واللاجنسي في جدول شامل.\n2. يطبق مفاهيم الوحدة في حل أسئلة نهاية الوحدة الثالثة.\nمخرج تعليمي آخر: يقيّم الطريقة الأنسب لإكثار نبات في موقف معين."},{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يناقش مزايا التكاثر اللاجنسي لأفراد النوع الواحد التي تعيش في البرية.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يناقش عيوب التكاثر اللاجنسي في البيئات المتغيرة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يفسر استخدام المزارعين للتكاثر اللاجنسي في إكثار النباتات.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr> lass=\"pills\"><span>المقارنة<\/span><span>التكاثر الجنسي<\/span><span>التكاثر اللاجنسي<\/span><span>الأزهار<\/span><span>الإنبات<\/span><\/div>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\nالمزايا، العيوب، التماثل الجيني، الأمراض، التنافس بين النسل، البيئة المتغيرة\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\nالتنوع الجيني، التكيف، الانتشار بالبذور، التلقيح، الطاقة\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\nالمقارنة، التكاثر الجنسي، التكاثر اللاجنسي، الأزهار، الإنبات"},{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><p>يعرض صورة حقل موز تضرر كله بمرض واحد ويسأل: لماذا أصاب المرض كل النباتات تقريبًا؟<\/p><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><p>سؤال: إذا ظهر مرض جديد يصيب نوعًا من النبات، فأي المجموعتين أكثر فرصة للبقاء: نباتات متماثلة أم نباتات متنوعة؟<\/p><div class=\"psub\">الحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div><p>يعرض نتائج أطباق إنبات البذور من الدرس السابق ويطلب تفسيرها.<\/p>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\nيعرض صورة حقل موز تضرر كله بمرض واحد ويسأل: لماذا أصاب المرض كل النباتات تقريبًا؟\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\nسؤال: إذا ظهر مرض جديد يصيب نوعًا من النبات، فأي المجموعتين أكثر فرصة للبقاء: نباتات متماثلة أم نباتات متنوعة؟\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\nيعرض نتائج أطباق إنبات البذور من الدرس السابق ويطلب تفسيرها."},{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">المزايا والعيوب (كتاب الطالب ص 63–64)<\/td><td>يقود نقاشًا حول السرعة وعدم الحاجة إلى شريك ونقل الصفات المرغوبة، مقابل غياب التنوع والتزاحم.<\/td><td>يكملون جدولًا: المزايا، العيوب.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">دراسة حالة: المزارع العماني<\/td><td>يعرض حالة إكثار النخيل بالفسائل للحفاظ على الصنف المرغوب.<\/td><td>يقيّمون قرار المزارع ومخاطره.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">نقاش ختامي<\/td><td>يلخص على السبورة الذكية.<\/td><td>يدونون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">المزايا والعيوب (كتاب الطالب ص 64–65)<\/td><td>يناقش التنوع وانتشار البذور بعيدًا، مقابل الحاجة إلى التلقيح والطاقة والزمن الأطول.<\/td><td>يكملون جدولًا: المزايا، العيوب.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">محاكاة: المرض والتنوع<\/td><td>يوزع بطاقات نباتات بألوان مختلفة تمثل صفات متنوعة، ثم يعلن «مرضًا» يصيب لونًا واحدًا.<\/td><td>يلاحظون بقاء بعض الأفراد في المجموعة المتنوعة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة: نتائج الإنبات<\/td><td>يعرض النتائج على السبورة الذكية.<\/td><td>يفسرونها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">جدول المقارنة الشامل<\/td><td>يوجه إلى إكمال جدول: عدد الأبوين، الأمشاج، التماثل الجيني، السرعة، التكيف.<\/td><td>يكملون الجدول.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">تمرين 2-3 وأسئلة نهاية الوحدة الثالثة (كتاب النشاط ص 34 وكتاب الطالب ص 66–67)<\/td><td>يوزع الأسئلة على المجموعات.<\/td><td>يحلون ويعرضون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الوحدة.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المزايا والعيوب (كتاب الطالب ص 63–64)\nدور المعلم: يقود نقاشًا حول السرعة وعدم الحاجة إلى شريك ونقل الصفات المرغوبة، مقابل غياب التنوع والتزاحم.\nدور الطالب: يكملون جدولًا: المزايا، العيوب.\n\n(13 دقيقة) دراسة حالة: المزارع العماني\nدور المعلم: يعرض حالة إكثار النخيل بالفسائل للحفاظ على الصنف المرغوب.\nدور الطالب: يقيّمون قرار المزارع ومخاطره.\n\n(5 دقائق) نقاش ختامي\nدور المعلم: يلخص على السبورة الذكية.\nدور الطالب: يدونون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المزايا والعيوب (كتاب الطالب ص 64–65)\nدور المعلم: يناقش التنوع وانتشار البذور بعيدًا، مقابل الحاجة إلى التلقيح والطاقة والزمن الأطول.\nدور الطالب: يكملون جدولًا: المزايا، العيوب.\n\n(10 دقائق) محاكاة: المرض والتنوع\nدور المعلم: يوزع بطاقات نباتات بألوان مختلفة تمثل صفات متنوعة، ثم يعلن «مرضًا» يصيب لونًا واحدًا.\nدور الطالب: يلاحظون بقاء بعض الأفراد في المجموعة المتنوعة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\n(5 دقائق) التهيئة: نتائج الإنبات\nدور المعلم: يعرض النتائج على السبورة الذكية.\nدور الطالب: يفسرونها.\n\n(10 دقائق) جدول المقارنة الشامل\nدور المعلم: يوجه إلى إكمال جدول: عدد الأبوين، الأمشاج، التماثل الجيني، السرعة، التكيف.\nدور الطالب: يكملون الجدول.\n\n(13 دقيقة) تمرين 2-3 وأسئلة نهاية الوحدة الثالثة (كتاب النشاط ص 34 وكتاب الطالب ص 66–67)\nدور المعلم: يوزع الأسئلة على المجموعات.\nدور الطالب: يحلون ويعرضون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الوحدة.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ميزة للتكاثر اللاجنسي.<\/td><td>سريع ولا يحتاج إلى شريك، وينقل الصفات المرغوبة كما هي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر عيبًا للتكاثر اللاجنسي.<\/td><td>غياب التنوع الجيني فقد يقضي مرض واحد على جميع الأفراد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يكثّر المزارعون النخيل بالفسائل لا بالبذور؟<\/td><td>لأن الفسائل تعطي نخيلًا مماثلًا للصنف الأصلي في جودة التمر، أما البذور فتعطي صفات مختلفة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ميزة للتكاثر الجنسي.<\/td><td>ينتج نسلًا متنوعًا جينيًا يزيد قدرة النوع على التكيف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر عيبًا للتكاثر الجنسي.<\/td><td>يحتاج إلى أبوين أو تلقيح، وهو أبطأ ويستهلك طاقة أكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>كيف يساعد التنوع الجيني على بقاء النوع عند ظهور مرض جديد؟<\/td><td>قد يمتلك بعض الأفراد صفات تقاوم المرض فيبقون ويتكاثرون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أي التكاثرين يحتاج إلى أمشاج؟<\/td><td>التكاثر الجنسي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قارن بين التكاثرين من حيث التماثل الجيني للنسل.<\/td><td>اللاجنسي ينتج نسلًا متماثلًا، والجنسي ينتج نسلًا مختلفًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مزارع يريد إنتاج آلاف الشتلات من صنف فراولة ممتاز بسرعة. أي طريقة يختار؟ وما الخطر؟<\/td><td>التكاثر اللاجنسي بالمدادات؛ والخطر أن مرضًا واحدًا قد يصيب جميع الشتلات لتماثلها.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\n1) [مستوى الدعم] اذكر ميزة للتكاثر اللاجنسي.\nالإجابة النموذجية: سريع ولا يحتاج إلى شريك، وينقل الصفات المرغوبة كما هي.\n\n2) [المستوى المتوقع] اذكر عيبًا للتكاثر اللاجنسي.\nالإجابة النموذجية: غياب التنوع الجيني فقد يقضي مرض واحد على جميع الأفراد.\n\n3) [المستوى المتقدم] لماذا يكثّر المزارعون النخيل بالفسائل لا بالبذور؟\nالإجابة النموذجية: لأن الفسائل تعطي نخيلًا مماثلًا للصنف الأصلي في جودة التمر، أما البذور فتعطي صفات مختلفة.\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\n1) [مستوى الدعم] اذكر ميزة للتكاثر الجنسي.\nالإجابة النموذجية: ينتج نسلًا متنوعًا جينيًا يزيد قدرة النوع على التكيف.\n\n2) [المستوى المتوقع] اذكر عيبًا للتكاثر الجنسي.\nالإجابة النموذجية: يحتاج إلى أبوين أو تلقيح، وهو أبطأ ويستهلك طاقة أكبر.\n\n3) [المستوى المتقدم] كيف يساعد التنوع الجيني على بقاء النوع عند ظهور مرض جديد؟\nالإجابة النموذجية: قد يمتلك بعض الأفراد صفات تقاوم المرض فيبقون ويتكاثرون.\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\n1) [مستوى الدعم] أي التكاثرين يحتاج إلى أمشاج؟\nالإجابة النموذجية: التكاثر الجنسي.\n\n2) [المستوى المتوقع] قارن بين التكاثرين من حيث التماثل الجيني للنسل.\nالإجابة النموذجية: اللاجنسي ينتج نسلًا متماثلًا، والجنسي ينتج نسلًا مختلفًا.\n\n3) [المستوى المتقدم] مزارع يريد إنتاج آلاف الشتلات من صنف فراولة ممتاز بسرعة. أي طريقة يختار؟ وما الخطر؟\nالإجابة النموذجية: التكاثر اللاجنسي بالمدادات؛ والخطر أن مرضًا واحدًا قد يصيب جميع الشتلات لتماثلها."},{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: نسل التكاثر اللاجنسي ينمو غالبًا قريبًا من الأب فيتنافس على الموارد.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>متى يكون التكاثر اللاجنسي مفيدًا للنوع؟<\/td><td>في البيئات المستقرة التي يناسبها الأب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التكاثر اللاجنسي خطرًا إذا تغير المناخ فجأة؟<\/td><td>لأن جميع الأفراد متماثلون جينيًا فإذا لم يتحمل أحدهم التغير لم يتحمله الجميع.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: انتشار البذور بعيدًا عن النبات الأم يقلل .........<\/td><td>التنافس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: التكاثر الجنسي أسرع من اللاجنسي.<\/td><td>خطأ؛ هو أبطأ عادة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد التكاثر الجنسي مهمًا في برامج تحسين المحاصيل؟<\/td><td>لأنه ينتج تراكيب وراثية جديدة يمكن انتقاء أفضلها، مثل مقاومة الجفاف أو الأمراض.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يحتاج التكاثر الجنسي في النبات إلى التلقيح.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الظرف الذي لا يلزم لإنبات معظم البذور: الماء أم الضوء؟<\/td><td>الضوء.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تتكاثر بعض النباتات بالطريقتين معًا؟<\/td><td>لتجمع بين سرعة الانتشار المحلي بالتكاثر اللاجنسي والتنوع والانتشار البعيد بالتكاثر الجنسي.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\n1) [مستوى الدعم] صواب أم خطأ: نسل التكاثر اللاجنسي ينمو غالبًا قريبًا من الأب فيتنافس على الموارد.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] متى يكون التكاثر اللاجنسي مفيدًا للنوع؟\nالإجابة النموذجية: في البيئات المستقرة التي يناسبها الأب.\n\n3) [المستوى المتقدم] لماذا يُعد التكاثر اللاجنسي خطرًا إذا تغير المناخ فجأة؟\nالإجابة النموذجية: لأن جميع الأفراد متماثلون جينيًا فإذا لم يتحمل أحدهم التغير لم يتحمله الجميع.\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\n1) [مستوى الدعم] أكمل: انتشار البذور بعيدًا عن النبات الأم يقلل .........\nالإجابة النموذجية: التنافس.\n\n2) [المستوى المتوقع] صواب أم خطأ: التكاثر الجنسي أسرع من اللاجنسي.\nالإجابة النموذجية: خطأ؛ هو أبطأ عادة.\n\n3) [المستوى المتقدم] لماذا يُعد التكاثر الجنسي مهمًا في برامج تحسين المحاصيل؟\nالإجابة النموذجية: لأنه ينتج تراكيب وراثية جديدة يمكن انتقاء أفضلها، مثل مقاومة الجفاف أو الأمراض.\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\n1) [مستوى الدعم] صواب أم خطأ: يحتاج التكاثر الجنسي في النبات إلى التلقيح.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] ما الظرف الذي لا يلزم لإنبات معظم البذور: الماء أم الضوء؟\nالإجابة النموذجية: الضوء.\n\n3) [المستوى المتقدم] لماذا تتكاثر بعض النباتات بالطريقتين معًا؟\nالإجابة النموذجية: لتجمع بين سرعة الانتشار المحلي بالتكاثر اللاجنسي والتنوع والانتشار البعيد بالتكاثر الجنسي."},{"h":"<div class=\"psub\">الحصة 1: مزايا التكاثر اللاجنسي وعيوبه<\/div><p>مراجعة كتاب الطالب ص 63–64، والبحث عن طرق إكثار النخيل في سلطنة عُمان.<\/p><div class=\"psub\">الحصة 2: مزايا التكاثر الجنسي وعيوبه<\/div><p>مراجعة كتاب الطالب ص 64–65، والبدء في تمرين 2-3 التكاثر الجنسي والتكاثر اللاجنسي في كتاب النشاط ص 34.<\/p><div class=\"psub\">الحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة<\/div><p>إكمال تمرين 2-3 في كتاب النشاط ص 34 وأسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 66–67، والاستعداد للوحدة الرابعة: التكاثر في الإنسان (ص 68).<\/p>","t":"الحصة 1: مزايا التكاثر اللاجنسي وعيوبه\nمراجعة كتاب الطالب ص 63–64، والبحث عن طرق إكثار النخيل في سلطنة عُمان.\n\nالحصة 2: مزايا التكاثر الجنسي وعيوبه\nمراجعة كتاب الطالب ص 64–65، والبدء في تمرين 2-3 التكاثر الجنسي والتكاثر اللاجنسي في كتاب النشاط ص 34.\n\nالحصة 3: المقارنة الشاملة ومراجعة الوحدة الثالثة\nإكمال تمرين 2-3 في كتاب النشاط ص 34 وأسئلة نهاية الوحدة الثالثة في كتاب الطالب ص 66–67، والاستعداد للوحدة الرابعة: التكاثر في الإنسان (ص 68)."}]}},{"label":"1-4 أعضاء الجهاز التناسلي في الإنسان","unit":"الوحدة الرابعة: التكاثر في الإنسان","periods":[{"n":1,"focus":"الجهاز التناسلي الذكري","info":"<div><b>الدرس:<\/b> 1-4 أعضاء الجهاز التناسلي في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 68–70 | كتاب النشاط: تمرين 1-4 ص 37–38، ورقة العمل 1-4 ص 41<\/div><div><b>دليل المعلم:<\/b> ص 64<\/div><div><b>محور الحصة:<\/b> الجهاز التناسلي الذكري<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب.<\/li><li>يذكر وظائف أعضاء الجهاز التناسلي الذكري.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر وجود الخصيتين في كيس الصفن خارج الجسم.<\/div>","t":"1. يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب.\n2. يذكر وظائف أعضاء الجهاز التناسلي الذكري.\nمخرج تعليمي آخر: يفسر وجود الخصيتين في كيس الصفن خارج الجسم."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يذكر وظائف أعضاء الجهاز التناسلي الذكري.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر وجود الخصيتين في كيس الصفن خارج الجسم.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب. ← تذكر\n• يذكر وظائف أعضاء الجهاز التناسلي الذكري. ← تذكر\n• يفسر وجود الخصيتين في كيس الصفن خارج الجسم. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم الذاتي<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم الذاتي\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>الخصيتان<\/span><span>كيس الصفن<\/span><span>الوعاء الناقل<\/span><span>غدة البروستات<\/span><span>الإحليل<\/span><span>الحيوانات المنوية<\/span><\/div>","t":"الخصيتان، كيس الصفن، الوعاء الناقل، غدة البروستات، الإحليل، الحيوانات المنوية"},{"h":"<p>يمهد المعلم بأن التكاثر يضمن استمرار النوع، ويذكر بأدب علمي أن الدرس يتناول تراكيب الجسم ووظائفها كما في الكتاب.<\/p>","t":"يمهد المعلم بأن التكاثر يضمن استمرار النوع، ويذكر بأدب علمي أن الدرس يتناول تراكيب الجسم ووظائفها كما في الكتاب."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يمهد للدرس بلغة علمية هادئة ويضع قواعد الحوار المحترم.<\/td><td>يستمعون ويطرحون الأسئلة بأدب.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أعضاء الجهاز الذكري (كتاب الطالب ص 68–69)<\/td><td>يعرض على السبورة الذكية مخططًا تخطيطيًا ويسمي الأعضاء.<\/td><td>يسمون الأعضاء على مخطط صامت.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الوظائف<\/td><td>يعرض جدول الوظائف ويوضح سبب وجود الخصيتين خارج الجسم.<\/td><td>يكملون جدول العضو ووظيفته.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 1-4 الأمشاج التناسلية في الإنسان (البدء – كتاب النشاط ص 37)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يمهد للدرس بلغة علمية هادئة ويضع قواعد الحوار المحترم.\nدور الطالب: يستمعون ويطرحون الأسئلة بأدب.\n\n(15 دقيقة) أعضاء الجهاز الذكري (كتاب الطالب ص 68–69)\nدور المعلم: يعرض على السبورة الذكية مخططًا تخطيطيًا ويسمي الأعضاء.\nدور الطالب: يسمون الأعضاء على مخطط صامت.\n\n(10 دقائق) الوظائف\nدور المعلم: يعرض جدول الوظائف ويوضح سبب وجود الخصيتين خارج الجسم.\nدور الطالب: يكملون جدول العضو ووظيفته.\n\n(5 دقائق) تمرين 1-4 الأمشاج التناسلية في الإنسان (البدء – كتاب النشاط ص 37)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الخصيتين؟<\/td><td>إنتاج الأمشاج الذكرية (الحيوانات المنوية).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الوعاءين الناقلين؟<\/td><td>نقل الحيوانات المنوية من الخصيتين إلى الإحليل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا توجد الخصيتان في كيس الصفن خارج الجسم؟<\/td><td>لأن إنتاج الحيوانات المنوية يحتاج إلى درجة حرارة أقل قليلًا من درجة حرارة الجسم الداخلية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وظيفة الخصيتين؟\nالإجابة النموذجية: إنتاج الأمشاج الذكرية (الحيوانات المنوية).\n\n2) [المستوى المتوقع] ما وظيفة الوعاءين الناقلين؟\nالإجابة النموذجية: نقل الحيوانات المنوية من الخصيتين إلى الإحليل.\n\n3) [المستوى المتقدم] لماذا توجد الخصيتان في كيس الصفن خارج الجسم؟\nالإجابة النموذجية: لأن إنتاج الحيوانات المنوية يحتاج إلى درجة حرارة أقل قليلًا من درجة حرارة الجسم الداخلية."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تفرز غدة ......... السوائل التي تسبح فيها الح بة النموذجية: خطأ؛ ينتجان البويضات.\n\n2) [المستوى المتوقع] سمِّ الأمشاج الذكرية والأنثوية.\nالإجابة النموذجية: الحيوانات المنوية والبويضات.\n\n3) [المستوى المتقدم] لماذا يحتاج الجهاز الذكري إلى غدد تفرز سوائل؟\nالإجابة النموذجية: لتكوين وسط سائل تسبح فيه الحيوانات المنوية ويزودها بالمواد اللازمة."},{"h":"<p>إكمال ورقة العمل 1-4 في كتاب النشاط ص 41، والإجابة عن السؤال 7-4 والأسئلة 1 و2 و4 من أسئلة نهاية الوحدة الرابعة.<\/p>","t":"إكمال ورقة العمل 1-4 في كتاب النشاط ص 41، والإجابة عن السؤال 7-4 والأسئلة 1 و2 و4 من أسئلة نهاية الوحدة الرابعة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-4 أعضاء الجهاز التناسلي في الإنسان<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 68–70 | كتاب النشاط: تمرين 1-4 ص 37–38، ورقة العمل 1-4 ص 41<\/div><div><b>دليل المعلم:<\/b> ص 64<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><ol class=\"ol\"><li>يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب.<\/li><li>يذكر وظائف أعضاء الجهاز التناسلي الذكري.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر وجود الخصيتين في كيس الصفن خارج الجسم.<\/div><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><ol class=\"ol\"><li>يحدد أعضاء الجهاز التناسلي الأنثوي في الأشكال التخطيطية ويسميها: المبيضان، وقناتا البيض، والرحم، وعنق الرحم، والمهبل.<\/li><li>يذكر وظائف أعضاء الجهاز التناسلي الأنثوي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد موقع حدوث الإخصاب وموقع تطور الجنين.<\/div><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><ol class=\"ol\"><li>يقارن بين أعضاء الجهازين الذكري والأنثوي من حيث إنتاج الأمشاج ونقلها.<\/li><li>يطبق معرفته بالأعضاء ووظائفها في حل ورقة العمل 1-4.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصحح أخطاء في مخططات معطاة.<\/div>","t":"الحصة 1: الجهاز التناسلي الذكري\n1. يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب.\n2. يذكر وظائف أعضاء الجهاز التناسلي الذكري.\nمخرج تعليمي آخر: يفسر وجود الخصيتين في كيس الصفن خارج الجسم.\n\nالحصة 2: الجهاز التناسلي الأنثوي\n1. يحدد أعضاء الجهاز التناسلي الأنثوي في الأشكال التخطيطية ويسميها: المبيضان، وقناتا البيض، والرحم، وعنق الرحم، والمهبل.\n2. يذكر وظائف أعضاء الجهاز التناسلي الأنثوي.\nمخرج تعليمي آخر: يحدد موقع حدوث الإخصاب وموقع تطور الجنين.\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\n1. يقارن بين أعضاء الجهازين الذكري والأنثوي من حيث إنتاج الأمشاج ونقلها.\n2. يطبق معرفته بالأعضاء ووظائفها في حل ورقة العمل 1-4.\nمخرج تعليمي آخر: يصحح أخطاء في مخططات معطاة."},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يذكر وظائف أعضاء الجهاز التناسلي الذكري.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر وجود الخصيتين في كيس الصفن خارج الجسم.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد أعضاء الجهاز التناسلي الأنثوي في الأشكال التخطيطية ويسميها: المبيضان، وقناتا البيض، والرحم، وعنق الرحم، والمهبل.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يذكر وظائف أعضاء الجهاز التناسلي الأنثوي.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يحدد موقع حدوث الإخصاب وموقع تطور الجنين.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يقارن بين أعضاء الجهازين الذكري والأنثوي من حيث إنتاج الأمشاج ونقلها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يطبق معرفته بالأعضاء ووظائفها في حل ورقة العمل 1-4.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصحح أخطاء في مخططات معطاة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الجهاز التناسلي الذكري\n• يحدد أعضاء الجهاز التناسلي الذكري في الأشكال التخطيطية ويسميها: الخصيتان، وكيس الصفن، والوعاءان الناقلان، وغدة البروستات، والإحليل، والقضيب. ← تذكر\n• يذكر وظائف أعضاء الجهاز التناسلي الذكري. ← تذكر\n• يفسر وجود الخصيتين في كيس الصفن خارج الجسم. ← فهم\n\nالحصة 2: الجهاز التناسلي الأنثوي\n• يحدد أعضاء الجهاز التناسلي الأنثوي في الأشكال التخطيطية ويسميها: المبيضان، وقناتا البيض، والرحم، وعنق الرحم، والمهبل. ← تذكر\n• يذكر وظائف أعضاء الجهاز التناسلي الأنثوي. ← تذكر\n• يحدد موقع حدوث الإخصاب وموقع تطور الجنين. ← فهم\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\n• يقارن بين أعضاء الجهازين الذكري والأنثوي من حيث إنتاج الأمشاج ونقلها. ← تحليل\n• يطبق معرفته بالأعضاء ووظائفها في حل ورقة العمل 1-4. ← تطبيق\n• يصحح أخطاء في مخططات معطاة. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم الذاتي<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم الذاتي<\/span><span>التعلم التشاركي<\/span><\/div><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><div class=\"pills\"><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الجهاز التناسلي الذكري\n• التعلم بالنمذجة\n• التعلم الذاتي\n• التعلم التعاوني\n\nالحصة 2: الجهاز التناسلي الأنثوي\n• التعلم بالنمذجة\n• التعلم الذاتي\n• التعلم التشاركي\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\n• التعلم التعاوني\n• التعلم الذاتي\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><div class=\"pills\"><span>الكتاب<\/span>< lass=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><p>سؤال مراجعة: ما الأمشاج الأنثوية؟ وأين تُنتج؟<\/p><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><p>يعرض المعلم مخططين فيهما تسميات خاطئة ويطلب اكتشافها.<\/p>","t":"الحصة 1: الجهاز التناسلي الذكري\nيمهد المعلم بأن التكاثر يضمن استمرار النوع، ويذكر بأدب علمي أن الدرس يتناول تراكيب الجسم ووظائفها كما في الكتاب.\n\nالحصة 2: الجهاز التناسلي الأنثوي\nسؤال مراجعة: ما الأمشاج الأنثوية؟ وأين تُنتج؟\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\nيعرض المعلم مخططين فيهما تسميات خاطئة ويطلب اكتشافها."},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يمهد للدرس بلغة علمية هادئة ويضع قواعد الحوار المحترم.<\/td><td>يستمعون ويطرحون الأسئلة بأدب.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أعضاء الجهاز الذكري (كتاب الطالب ص 68–69)<\/td><td>يعرض على السبورة الذكية مخططًا تخطيطيًا ويسمي الأعضاء.<\/td><td>يسمون الأعضاء على مخطط صامت.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الوظائف<\/td><td>يعرض جدول الوظائف ويوضح سبب وجود الخصيتين خارج الجسم.<\/td><td>يكملون جدول العضو ووظيفته.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 1-4 الأمشاج التناسلية في الإنسان (البدء – كتاب النشاط ص 37)<\/td><td>يتابع.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يجيبون من معارفهم السابقة.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أعضاء الجهاز الأنثوي (كتاب الطالب ص 69–70)<\/td><td>يعرض على السبورة الذكية مخططًا تخطيطيًا ويسمي الأعضاء.<\/td><td>يسمون الأعضاء على مخطط صامت.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الوظائف<\/td><td>يعرض جدول الوظائف ويحدد موقع الإخصاب في قناة البيض وموقع تطور الجنين في الرحم.<\/td><td>يكملون جدول العضو ووظيفته.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">إكمال تمرين 1-4 (كتاب النشاط ص 37–38)<\/td><td>يتابع.<\/td><td>يكملون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المخططين على السبورة الذكية.<\/td><td>يكتشفون الأخطاء.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">جدول المقارنة<\/td><td>يوجه إلى مقارنة: العضو المنتج للأمشاج، والقناة الناقلة، والغدد.<\/td><td>يكملون الجدول.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 1-4 الأعضاء التناسلية في الإنسان (كتاب النشاط ص 41)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">الختام<\/td><td>يلخص ويكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الجهاز التناسلي الذكري\n(5 دقائق) التهيئة\nدور المعلم: يمهد للدرس بلغة علمية هادئة ويضع قواعد الحوار المحترم.\nدور الطالب: يستمعون ويطرحون الأسئلة بأدب.\n\n(15 دقيقة) أعضاء الجهاز الذكري (كتاب الطالب ص 68–69)\nدور المعلم: يعرض على السبورة الذكية مخططًا تخطيطيًا ويسمي الأعضاء.\nدور الطالب: يسمون الأعضاء على مخطط صامت.\n\n(10 دقائق) الوظائف\nدور المعلم: يعرض جدول الوظائف ويوضح سبب وجود الخصيتين خارج الجسم.\nدور الطالب: يكملون جدول العضو ووظيفته.\n\n(5 دقائق) تمرين 1-4 الأمشاج التناسلية في الإنسان (البدء – كتاب النشاط ص 37)\nدور المعلم: يتابع.\nدور الطالب: يبدؤون الحل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: الجهاز التناسلي الأنثوي\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يجيبون من معارفهم السابقة.\n\n(15 دقيقة) أعضاء الجهاز الأنثوي (كتاب الطالب ص 69–70)\nدور المعلم: يعرض على السبورة الذكية مخططًا تخطيطيًا ويسمي الأعضاء.\nدور الطالب: يسمون الأعضاء على مخطط صامت.\n\n(10 دقائق) الوظائف\nدور المعلم: يعرض جدول الوظائف ويحدد موقع الإخصاب في قناة البيض وموقع تطور الجنين في الرحم.\nدور الطالب: يكملون جدول العضو ووظيفته.\n\n(5 دقائق) إكمال تمرين 1-4 (كتاب النشاط ص 37–38)\nدور المعلم: يتابع.\nدور الطالب: يكملون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\n(6 دقائق) التهيئة\nدور المعلم: يعرض المخططين على السبورة الذكية.\nدور الطالب: يكتشفون الأخطاء.\n\n(12 دقيقة) جدول المقارنة\nدور المعلم: يوجه إلى مقارنة: العضو المنتج للأمشاج، والقناة الناقلة، والغدد.\nدور الطالب: يكملون الجدول.\n\n(10 دقائق) ورقة العمل 1-4 الأعضاء التناسلية في الإنسان (كتاب النشاط ص 41)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(4 دقائق) الختام\nدور المعلم: يلخص ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة الخصيتين؟<\/td><td>إنتاج الأمشاج الذكرية (الحيوانات المنوية).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة الوعاءين الناقلين؟<\/td><td>نقل الحيوانات المنوية من الخصيتين إلى الإحليل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا توجد الخصيتان في كيس الصفن خارج الجسم؟<\/td><td>لأن إنتاج الحيوانات المنوية يحتاج إلى درجة حرارة أقل قليلًا من درجة حرارة الجسم الداخلية.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة المبيضين؟<\/td><td>إطلاق الأمشاج الأنثوية (البويضات).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أين يحدث الإخصاب؟<\/td><td>في قناة البيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ما وظيفة الرحم؟<\/td><td>المكان الذي يتطور فيه الجنين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما العضو المقابل للخصية في الجهاز الأنثوي من حيث إنتاج الأمشاج؟<\/td><td>المبيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يقابل الوعاء الناقل في الجهاز الأنثوي من حيث نقل الأمشاج؟<\/td><td>قناة البيض.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مخطط كُتب فيه «الرحم ينتج البويضات». صحح العبارة.<\/td><td>المبيض هو الذي ينتج البويضات ويطلقها، أما الرحم فمكان تطور الجنين.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الجهاز التناسلي الذكري\n1) [مستوى الدعم] ما وظيفة الخصيتين؟\nالإجابة النموذجية: إنتاج الأمشاج الذكرية (الحيوانات المنوية).\n\n2) [المستوى المتوقع] ما وظيفة الوعاءين الناقلين؟\nالإجابة النموذجية: نقل الحيوانات المنوية من الخصيتين إلى الإحليل.\n\n3) [المستوى المتقدم] لماذا توجد الخصيتان في كيس الصفن خارج الجسم؟\nالإجابة النموذجية: لأن إنتاج الحيوانات المنوية يحتاج إلى درجة حرارة أقل قليلًا من درجة حرارة الجسم الداخلية.\n\nالحصة 2: الجهاز التناسلي الأنثوي\n1) [مستوى الدعم] ما وظيفة المبيضين؟\nالإجابة النموذجية: إطلاق الأمشاج الأنثوية (البويضات).\n\n2) [المستوى المتوقع] أين يحدث الإخصاب؟\nالإجابة النموذجية: في قناة البيض.\n\n3) [المستوى المتقدم] ما وظيفة الرحم؟\nالإجابة النموذجية: المكان الذي يتطور فيه الجنين.\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\n1) [مستوى الدعم] ما العضو المقابل للخصية في الجهاز الأنثوي من حيث إنتاج الأمشاج؟\nالإجابة النموذجية: المبيض.\n\n2) [المستوى المتوقع] ما الذي يقابل الوعاء الناقل في الجهاز الأنثوي من حيث نقل الأمشاج؟\nالإجابة النموذجية: قناة البيض.\n\n3) [المستوى المتقدم] مخطط كُتب فيه «الرحم ينتج البويضات». صحح العبارة.\nالإجابة النموذجية: المبيض هو الذي ينتج البويضات ويطلقها، أما الرحم فمكان تطور الجنين."},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تفرز غدة ......... السوائل التي تسبح فيها الحيوانات المنوية.<\/td><td>البروستات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما العضو الذي ينقل البول والمني إلى خارج الجسم؟<\/td><td>الإحليل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رتب مسار الحيوانات المنوية من مكان إنتاجها إلى خارج الجسم.<\/td><td>الخصية ← الوعاء الناقل ← الإحليل.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: حلقة العضلات عند فتحة الرحم تسمى .........<\/td><td>عنق الرحم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة قناتي البيض؟<\/td><td>نقل البويضة إلى الرحم، وفيهما يحدث الإخصاب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>تتبع مسار البويضة من مكان إطلاقها حتى موقع تطور الجنين.<\/td><td>المبيض ← قناة البيض ← الرحم.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: ينتج المبيضان الحيوانات المنوية.<\/td><td>خطأ؛ ينتجان البويضات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>سمِّ الأمشاج الذكرية والأنثوية.<\/td><td>الحيوانات المنوية والبويضات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يحتاج الجهاز الذكري إلى غدد تفرز سوائل؟<\/td><td>لتكوين وسط سائل تسبح فيه الحيوانات المنوية ويزودها بالمواد اللازمة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الجهاز التناسلي الذكري\n1) [مستوى الدعم] أكمل: تفرز غدة ......... السوائل التي تسبح فيها الحيوانات المنوية.\nالإجابة النموذجية: البروستات.\n\n2) [المستوى المتوقع] ما العضو الذي ينقل البول والمني إلى خارج الجسم؟\nالإجابة النموذجية: الإحليل.\n\n3) [المستوى المتقدم] رتب مسار الحيوانات المنوية من مكان إنتاجها إلى خارج الجسم.\nالإجابة النموذجية: الخصية ← الوعاء الناقل ← الإحليل.\n\nالحصة 2: الجهاز التناسلي الأنثوي\n1) [مستوى الدعم] أكمل: حلقة العضلات عند فتحة الرحم تسمى .........\nالإجابة النموذجية: عنق الرحم.\n\n2) [المستوى المتوقع] ما وظيفة قناتي البيض؟\nالإجابة النموذجية: نقل البويضة إلى الرحم، وفيهما يحدث الإخصاب.\n\n3) [المستوى المتقدم] تتبع مسار البويضة من مكان إطلاقها حتى موقع تطور الجنين.\nالإجابة النموذجية: المبيض ← قناة البيض ← الرحم.\n\nالحصة 3: مقارنة الجهازين وتطبيق المخططات\n1) [مستوى الدعم] صواب أم خطأ: ينتج المبيضان الحيوانات المنوية.\nالإجابة النموذجية: خطأ؛ ينتجان البويضات.\n\n2) [المستوى المتوقع] سمِّ الأمشاج الذكرية والأنثوية.\nالإجابة النموذجية: الحيوانات المنوية والبويضات.\n\n3) [المستوى المتقدم] لماذا يحتاج الجهاز الذكري إلى غدد تفرز سوائل؟\nالإجابة النموذجية: لتكوين وسط سائل تسبح فيه الحيوانات المنوية ويزودها بالمواد اللازمة."},{"h":"<div class=\"psub\">الحصة 1: الجهاز التناسلي الذكري<\/div><p>مراجعة كتاب الطالب ص 68–69 والإجابة عن السؤالين 1-4 و2-4.<\/p><div class=\"psub\">الحصة 2: الجهاز التناسلي الأنثوي<\/div><p>مراجعة كتاب الطالب ص 69–70 والإجابة عن السؤالين 3-4 و4-4.<\/p><div class=\"psub\">الحصة 3: مقارنة الجهازين وتطبيق المخططات<\/div><p>إكمال ورقة العمل 1-4 في كتاب النشاط ص 41، والإجابة عن السؤال 7-4 والأسئلة 1 و2 و4 من أسئلة نهاية الوحدة الرابعة.<\/p>","t":"الحصة 1: الجهاز التناسلي الذكري\nمراجعة كتاب الطالب ص 68–69 والإجابة عن السؤالين 1-4 و د<\/td><td class=\"st\">التقويم والأسئلة 10-4 و11-4<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) المشيمة والحبل السري (كتاب الطالب ص 72–73)\nدور المعلم: يعرض على السبورة الذكية مخطط المشيمة ويحدد اتجاه انتقال المواد.\nدور الطالب: يرسمون أسهمًا لانتقال الأكسجين والغذاء إلى الجنين، وثاني أكسيد الكربون واليوريا إلى الأم.\n\n(10 دقائق) تمرين 2-4 تبادل الغازات في المشيمة والرئتين (كتاب النشاط ص 39–40)\nدور المعلم: يتابع.\nدور الطالب: يحلون ويقارنون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم والأسئلة 10-4 و11-4\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المواد التي تنتقل من الأم إلى الجنين عبر المشيمة؟<\/td><td>الأكسجين والمواد الغذائية الذائبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المواد التي تنتقل من الجنين إلى الأم؟<\/td><td>ثاني أكسيد الكربون ونواتج الإخراج مثل اليوريا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُنصح الحامل بتجنب التدخين والأدوية غير الموصوفة رغم أن المشيمة حاجز؟<\/td><td>لأن المشيمة لا تمنع كل المواد؛ فبعض المواد كالنيكوتين وبعض الأدوية تعبرها وتضر الجنين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المواد التي تنتقل من الأم إلى الجنين عبر المشيمة؟\nالإجابة النموذجية: الأكسجين والمواد الغذائية الذائبة.\n\n2) [المستوى المتوقع] ما المواد التي تنتقل من الجنين إلى الأم؟\nالإجابة النموذجية: ثاني أكسيد الكربون ونواتج الإخراج مثل اليوريا.\n\n3) [المستوى المتقدم] لماذا يُنصح الحامل بتجنب التدخين والأدوية غير الموصوفة رغم أن المشيمة حاجز؟\nالإجابة النموذجية: لأن المشيمة لا تمنع كل المواد؛ فبعض المواد كالنيكوتين وبعض الأدوية تعبرها وتضر الجنين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يربط ......... الجنين بالمشيمة.<\/td><td>الحبل السري.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: يختلط دم الأم بدم الجنين مباشرة في المشيمة.<\/td><td>خطأ؛ تتبادل المواد عبر أغشية دون اختلاط الدم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قارن بين المشيمة والرئتين من حيث تبادل الغازات.<\/td><td>كلاهما سطح تبادل رقيق كبير المساحة غني بالدم؛ لكن الجنين يأخذ الأكسجين من دم الأم في المشيمة، بينما تأخذه الرئتان من الهواء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يربط ......... الجنين بالمشيمة.\nالإجابة النموذجية: الحبل السري.\n\n2) [المستوى المتوقع] صواب أم خطأ: يختلط دم الأم بدم الجنين مباشرة في المشيمة.\nالإجابة النموذجية: خطأ؛ تتبادل المواد عبر أغشية دون اختلاط الدم.\n\n3) [المستوى المتقدم] قارن بين المشيمة والرئتين من حيث تبادل الغازات.\nالإجابة النموذجية: كلاهما سطح تبادل رقيق كبير المساحة غني بالدم؛ لكن الجنين يأخذ الأكسجين من دم الأم في المشيمة، بينما تأخذه الرئتان من الهواء."},{"h":"<p>إكمال تمرين 2-4 في كتاب النشاط ص 39–40، والإجابة عن السؤالين 10-4 و11-4 والسؤالين 3 و6 من أسئلة نهاية الوحدة.<\/p>","t":"إكمال تمرين 2-4 في كتاب النشاط ص 39–40، والإجابة عن السؤالين 10-4 و11-4 والسؤالين 3 و6 من أسئلة نهاية الوحدة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-4 الإخصاب وتطور الجنين<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: التكاثر في الإنسان<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 71–73 | كتاب النشاط: تمرين 2-4 ص 39–40<\/div><div><b>دليل المعلم:<\/b> ص 65<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><ol class=\"ol\"><li>يصف الإخصاب بأنه اندماج نواة المشيج الذكري مع نواة المشيج الأنثوي.<\/li><li>يذكر الخصائص التكيفية للحيوانات المنوية (السوط والإنزيمات) وللبويضات (مخازن الطاقة والغلاف الهلامي الذي يتغير لمنع دخول أكثر من حيوان منوي).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين الحيوان المنوي والبويضة في الحجم والعدد والحركة.<\/div><div class=\"psub\">الحصة 2: المراحل الأولى لتطور الجنين والانغراس<\/div><ol class=\"ol\"><li>يذكر أنه في المراحل المبكرة يكوّن الزيجوت جنينًا هو كرة من الخلايا تنغرس في جدار الرحم.<\/li><li>يذكر وظائف الكيس الأمنيوني والسائل الأمنيوني.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتتبع مراحل التطور من الزيجوت حتى الانغراس.<\/div><div class=\"psub\">الحصة 3: المشيمة والحبل السري<\/div><ol class=\"ol\"><li>يذكر وظائف الحبل السري والمشيمة.<\/li><li>يصف وظائف المشيمة والحبل السري في تبادل المواد الغذائية الذائبة والغازات ونواتج الإخراج، وكونها حاجزًا للسموم.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين تبادل الغازات في المشيمة وفي الرئتين.<\/div>","t":"الحصة 1: الإخصاب وتكيفات الأمشاج\n1. يصف الإخصاب بأنه اندماج نواة المشيج الذكري مع نواة المشيج الأنثوي.\n2. يذكر الخصائص التكيفية للحيوانات المنوية (السوط والإنزيمات) وللبويضات (مخازن الطاقة والغلاف الهلامي الذي يتغير لمنع دخول أكثر من حيوان منوي).\nمخرج تعليمي آخر: يقارن بين الحيوان المنوي والبويضة في الحجم والعدد والحركة.\n\nالحصة 2: المراحل الأولى لتطور الجنين والانغراس\n1. يذكر أنه في المراحل المبكرة يكوّن الزيجوت جنينًا هو كرة من الخلايا تنغرس في جدار الرحم.\n2. يذكر وظائف الكيس الأمنيوني والسائل الأمنيوني.\nمخرج تعليمي آخر: يتتبع مراحل التطور من الزيجوت حتى الانغراس.\n\nالحصة 3: المشيمة والحبل السري\n1. يذكر وظائف الحبل السري والمشيمة.\n2. يصف وظائف المشيمة والحبل السري في تبادل المواد الغذائية الذائبة والغازات ونواتج الإخراج، وكونها حاجزًا للسموم.\nمخرج تعليمي آخر: يقارن بين تبادل الغازات في المشيمة وفي الرئتين."},{"h":"<div class=\"psub\">الحصة 1: الإخصاب وتكيفات الأمشاج<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف الإخصاب بأنه اندماج نواة المشيج الذكري مع نواة المشيج الأنثوي.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر الخصائص التكيفية للحيوانات المنوية (السوط والإنزيمات) وللبويضات (مخازن الطاقة والغلاف الهلامي الذي يتغير لمنع دخول أكثر من حيوان منوي).<\/td><
