ف الأيمن).\nس2 (المستوى المتوقع): ماذا تفعل الذراع اليسرى لحظة التخلص؟\nالإجابة: تفرمل دوران الكتف.\nس3 (المستوى المتقدم): متى تحتسب المحاولة خاطئة؟\nالإجابة: عند الخروج من الدائرة أو سقوط القرص خارج المقطع.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ قذف القرص من الحركة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين القذف من الثبات ومن الحركة؟\nالإجابة: من الحركة يسبق التخلص دوران وانتقال لزيادة السرعة.\nس3 (المستوى المتقدم): كيف نحافظ على الاتزان بعد التخلص؟\nالإجابة: بتبديل الرجلين وعدم الخروج من الدائرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة قذف القرص وتحديد مراحلها (دليل المعلم ص 20-24)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف المراحل الفنية لقذف القرص (المسك والاستعداد، المرجحة التمهيدية، الدوران، الانتقال، التخلص).\n2. يؤدي مسك القرص والمرجحة التمهيدية والقذف من الثبات (الوقوف مواجهًا بالجانب).\n3. يميز ترتيب اشتراك أجزاء الجسم في التخلص (القدم، الركبة، الحوض، الكتف، الذراع).\n\nالحصة 2:\n1. يؤدي الدوران (دورة ونصف) والانتقال داخل الدائرة ثم التخلص.\n2. يطبق القواعد القانونية (الدائرة، المقطع، عدم الخروج، 3 محاولات).\n3. يحلل أخطاء القذف من الحركة (التخلص المبكر، فقد الاتزان) ويصححها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقراص\n- أخرى: أقراص مطاطية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: أقراص\n- أخرى: أقراص مطاطية\n- أخرى: دائرة قذف\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- قذف القرص\n- المسك\n- المرجحة التمهيدية\n- التخلص\n- مقطع الرمي\n\nالحصة 2:\n- الدوران\n- الانتقال\n- دائرة القذف\n- المحاولة\n- الاتزان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم فيديو قذف القرص ويسأل: الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كيف يمسك القرص؟\nالإجابة: بانتشار الأصابع على حافته والسلاميات الأخيرة تمسك الحافة.\nس2 (المستوى المتوقع): أين يقف القاذف في الاستعداد؟\nالإجابة: عند الحافة الخلفية للدائرة والظهر مواجه لمقطع الرمي.\nس3 (المستوى المتقدم): ما ترتيب حركة التخلص؟\nالإجابة: القدم ثم الركبة ثم الحوض ثم الكتف ثم الذراع.\n\nالحصة 2:\nس1 (مستوى الدعم): على أي قدم يبدأ الدوران؟\nالإجابة: على مشط القدم اليسرى (للقاذف الأيمن).\nس2 (المستوى المتوقع): ماذا تفعل الذراع اليسرى لحظة التخلص؟\nالإجابة: تفرمل دوران الكتف.\nس3 (المستوى المتقدم): متى تحتسب المحاولة خاطئة؟\nالإجابة: عند الخروج من الدائرة أو سقوط القرص خارج المقطع.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ القذف من الثبات بالقرص المطاطي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر المراحل الفنية لقذف القرص.\nالإجابة: المسك والاستعداد، المرجحة التمهيدية، الدوران، الانتقال، التخلص.\nس3 (المستوى المتقدم): لماذا يبقى الجذع ملتفًا لأطول فترة قبل التخلص؟\nالإجابة: لزيادة مسار سرعة القرص.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ قذف القرص من الحركة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين القذف من الثبات ومن الحركة؟\nالإجابة: من الحركة يسبق التخلص دوران وانتقال لزيادة السرعة.\nس3 (المستوى المتقدم): كيف نحافظ على الاتزان بعد التخلص؟\nالإجابة: بتبديل الرجلين وعدم الخروج من الدائرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ناقش مع طالبك قواعد الأمان في القذف (دليل المعلم ص 18-21).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مسابقة قذف القرص وتحديد مراحلها (دليل المعلم ص 20-24)."}}, {"title": "رمي الرمح من الحركة", "unit": "ألعاب القوى (مسابقات الميدان)", "week": "الرابع – الخامس", "date": "27/9-1/10/2026 إلى 4-8/10/2026", "pages": "دليل المعلم ص 25-33", "n": 2, "periods": [{"focus": "حمل الرمح والاقتراب (مرحلتا تزايد السرعة والإيقاع) والخطوات الخمس", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف المراحل الفنية لرمي الرمح من ): أدِّ الاقتراب بالرمح حتى وضع الرمي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا لا نمرجح الذراع الحاملة أثناء الجري؟\nالإجابة: حتى لا يضطرب الإيقاع الحركي.\nس3 (المستوى المتقدم): ما الفرق بين رمي الرمح من الوقوف ومن الحركة؟\nالإجابة: من الحركة يسبقه اقتراب لزيادة سرعة الأداة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب خطوات الإيقاع الخمس بعصا خفيفة في مكان آمن (دليل المعلم ص 25-27)."}}, {"focus": "مرحلة التخلص وأجزاؤها الأربعة والرمي الكامل والقواعد", "num": 2, "fields": {"المخرجات التعليمية": "1. يرتب أجزاء مرحلة التخلص (وضع القدم اليمنى في الخطوة الخامسة، وضع اليسرى والتقوس، الرمي الكرباجي، استعادة الاتزان).\n2. يؤدي رمي الرمح من الحركة كاملًا داخل المقطع.\n3. يطبق القواعد القانونية ويحلل الأخطاء الشائعة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: رماح\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "- التخلص\n- التقوس\n- الحركة الكرباجية\n- استعادة الاتزان\n- القوس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاقتراب ويسأل: كيف ننقل سرعة الجري إلى الرمح لحظة التخلص؟ ويعرض أجزاء التخلص (ص 28-30).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الجزء الأول (القدم اليمنى في الخطوة الخامسة وكبح الحوض)، الثاني (اليسرى على الأرض وتثبيت الركبة والتقوس)، الثالث (الرمي الكرباجي بتقديم المرفق ومد الذراع فوق الكتف)، الرابع (تبديل الرجلين لاستعادة الاتزان دون تجاوز القوس)، ثم الرمي الكامل.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بأدوار (حكم، قائس، مسجل): 3 محاولات لكل طالب من اقتراب قصير مع القياس وتطبيق القواعد.\n- الطالب: يرمي ويحكم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض المعلم أخطاء ش حكم، قائس، مسجل): 3 محاولات لكل طالب من اقتراب قصير مع القياس وتطبيق القواعد.\n- الطالب: يرمي ويحكم.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يعرض المعلم أخطاء شائعة (الرمي من الجانب، تجاوز القوس) ويقترح الطلبة التصحيح.\n- الطالب: يحلل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كم خطوة في مرحلة تزايد السرعة؟\nالإجابة: 8-12 خطوة.\nس2 (المستوى المتوقع): ماذا يحدث للرمح في خطوات الإيقاع؟\nالإجابة: يسحب للخلف مع لف الكتف.\nس3 (المستوى المتقدم): بماذا تتميز الخطوة الخامسة؟\nالإجابة: بالقصر ومد القدم في اتجاه الرمي.\n\nالحصة 2:\nس1 (مستوى الدعم): ما وظيفة الجزء الأول من التخلص؟\nالإجابة: زيادة السرعة وكبح الحوض ونقل السرعة إلى الجذع.\nس2 (المستوى المتوقع): متى يبدأ التقوس؟\nالإجابة: عند وضع القدم اليسرى بعد الخطوة الأخيرة.\nس3 (المستوى المتقدم): ما القاعدة بشأن القوس؟\nالإجابة: عدم تجاوزه بعد الرمي.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الاقتراب بالرمح حتى وضع الرمي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا لا نمرجح الذراع الحاملة أثناء الجري؟\nالإجابة: حتى لا يضطرب الإيقاع الحركي.\nس3 (المستوى المتقدم): ما الفرق بين رمي الرمح من الوقوف ومن الحركة؟\nالإجابة: من الحركة يسبقه اقتراب لزيادة سرعة الأداة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ رمي الرمح من الحركة كاملًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): رتب أجزاء مرحلة التخلص.\nالإجابة: القدم اليمنى، القدم اليسرى والتقوس، الرمي الكرباجي، استعادة الاتزان.\nس3 (المستوى المتقدم): زميلك يرمي الرمح من الجانب لا من فوق الكتف، ما الخطأ وكيف يصحح؟\nالإجابة: يجب تقديم المرفق والرمي من فوق الكتف بحركة كرباجية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريب خطوات الإيقاع الخمس بعصا خفيفة في مكان آمن (دليل المعلم ص 25-27).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على المحاورة في كرة القدم (دليل المعلم ص 35-37)."}}, {"title": "المحاورة من الجانب والخلف", "unit": "كرة القدم (ذكور)", "week": "السادس", "date": "11-15/10/2026", "pages": "دليل المعلم ص 35-37", "n": 1, "periods": [{"focus": "شروط المحاور الممتاز وطرق المحاورة من الجانب والخلف والتدرج التعليمي", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف شروط نجاح المحاورة (المفاجأة، السيطرة، السرعة، التوقيت، التنويع، الثقة).\n2. يؤدي المحاورة من الجانب والخلف دون كرة ثم بالكرة من الوقوف والمشي والجري ثم مع منافس.\n3. يختار طريقة المحاورة حسب موقع المنافس.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- الوسائل المتعددة (سمعية - بصرية)", "المفاهيم": "- المحاورة\n- التمويه\n- التوقيت\n- المنافس السلبي والإيجابي", "التهيئة / التمهيد / التعلم القبلي": "يسأل المعلم: ما الذي يجعل لاعبًا محاورًا ممتازًا؟ ويعرض الشروط الستة (ص 35) ويقدم المحاورة من الجانب والخلف.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالكرة مع تغيير الاتجاه.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 36-37: المحاورة من الجانب (تغيير السرعة والاتجاه بعيدًا عن المنافس المجاور بوجه القدم البعيدة) ومن الخلف (استلام الكرة وحمايتها بالجسم ثم التمويه والمرور)، بالتدرج: دون كرة من الوقوف والمشي والجري، ثم بالكرة دون منافس، ثم مع منافس سلبي فإيجابي.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 37: أزواج (مهاجم ومنافس من الجانب ثم من الخلف) مع التبادل، ثم ثلاثيات بممرر.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (1 ضد 1) من وضعيات جانبية وخلفية.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر ثلاثة من شروط المحاور الممتاز.\nالإجابة: المفاجأة، السيطرة على الكرة، التوقيت السليم.\nس2 (المستوى المتوقع): ما التدرج في تعليم المحاورة؟\nالإجابة: د م: لعبة (الاحتفاظ بالكرة) 4 ضد 2 ونقاط للمهاجمة الناجحة.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى كان التمرير أفضل من المحاورة؟ ليستنتج الطلبة اتخاذ القرار.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نفضل التمرير على المحاورة؟\nالإجابة: عندما يكون الزميل حرًا والمدافع قريبًا.\nس2 (المستوى المتوقع): ما مهمة المدافع في 2 ضد 1؟\nالإجابة: مهاجمة حامل الكرة أو قطع التمرير.\nس3 (المستوى المتقدم): ما قاعدة السلامة في المهاجمة؟\nالإجابة: عدم الدفع أو العرقلة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تدريب 2 ضد 1 وقرر المحاورة أو التمرير.\nالإجابة: يؤديه ويبرر.\nس2 (المستوى المتوقع): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت زميلك في الاحتفاظ بالكرة؟\nالإجابة: بالتحرك لمساحة خالية لاستلام التمريرة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على المحاورة والمهاجمة مع الأصدقاء بأمان."}}, {"focus": "منافسات ومباراة تطبيقية والقياس المهاري", "num": 2, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية في مباراة مع توظيف المحاورة والمهاجمة.\n2. يؤدي الاختبار المهاري للمحاورة والمهاجمة.\n3. يقيم أداءه وأداء زملائه بموضوعية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: أقماع\n- أخرى: مرامٍ\n- أخرى: صدريات ملونة\n- أخرى: ساعة إيقاف\n- أخرى: استمارات تسجيل", "المفاهيم": "- المباراة\n- الاختبار المهاري\n- التحكيم\n- التقييم", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات ويعرض الاختبار المهاري (ص 44) وتنظيم المباراة.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار مهاري: المحاورة بين أقماع بالزمن، ثم مهاجمة 5 كرات من منافس سلبي، ويسجل القائد بينما تتدرب بقية المجموعات ذاتيًا.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 3 (13 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباراة تطبيقية بحكام من الطلبة (ص 45).\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يناقش الطلبة: متى نجحت المهاجمة في المباراة؟\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): ما الذي يقيسه اختبار المحاورة بين الأقماع؟\nالإجابة: سرعة المحاورة مع السيطرة على الكرة.\nس2 (المستوى المتوقع): كم كرة في اختبار المهاجمة؟\nالإجابة: خمس كرات.\nس3 (المستوى المتقدم): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب المخالفات والأهداف.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الاختبار المهاري.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف تقيّم مهاجمة زميلك بموضوعية؟\nالإجابة: بالتوقيت وقطع الكرة دون مخالفة.\nس3 (المستوى المتقدم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: عدم العرقلة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الاطلاع على الضرب الساحق في الكرة الطائرة (دليل المعلم ص 57-58)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يوظف المحاورة من الجانب والخلف والمهاجمة في تدريبات مركبة.\n2. يختار بين المحاورة والتمرير حسب موقف المدافع.\n3. يتعاون مع زملائه ويلتزم بقواعد السلامة في المهاجمة.\n\nالحصة 2:\n1. يطبق القواعد القانونية في مباراة مع توظيف المحاورة والمهاجمة.\n2. يؤدي الاختبار المهاري للمحاورة والمهاجمة.\n3. يقيم أداءه وأداء زملائه بموضوعية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم\n- أخرى: أ  يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): متى نفضل التمرير على المحاورة؟\nالإجابة: عندما يكون الزميل حرًا والمدافع قريبًا.\nس2 (المستوى المتوقع): ما مهمة المدافع في 2 ضد 1؟\nالإجابة: مهاجمة حامل الكرة أو قطع التمرير.\nس3 (المستوى المتقدم): ما قاعدة السلامة في المهاجمة؟\nالإجابة: عدم الدفع أو العرقلة.\n\nالحصة 2:\nس1 (مستوى الدعم): ما الذي يقيسه اختبار المحاورة بين الأقماع؟\nالإجابة: سرعة المحاورة مع السيطرة على الكرة.\nس2 (المستوى المتوقع): كم كرة في اختبار المهاجمة؟\nالإجابة: خمس كرات.\nس3 (المستوى المتقدم): ما دور الحكم؟\nالإجابة: تطبيق القواعد واحتساب المخالفات والأهداف.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ تدريب 2 ضد 1 وقرر المحاورة أو التمرير.\nالإجابة: يؤديه ويبرر.\nس2 (المستوى المتوقع): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت زميلك في الاحتفاظ بالكرة؟\nالإجابة: بالتحرك لمساحة خالية لاستلام التمريرة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الاختبار المهاري.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف تقيّم مهاجمة زميلك بموضوعية؟\nالإجابة: بالتوقيت وقطع الكرة دون مخالفة.\nس3 (المستوى المتقدم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: عدم العرقلة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المحاورة والمهاجمة مع الأصدقاء بأمان.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على الاطلاع على الضرب الساحق في الكرة الطائرة (دليل المعلم ص 57-58)."}}, {"title": "الضرب الساحق المواجه", "unit": "الكرة الطائرة", "week": "العاشر – الحادي عشر", "date": "8-12/11/2026 إلى 15-19/11/2026", "pages": "دليل المعلم ص 57-61", "n": 2, "periods": [{"focus": "المراحل الفنية للضرب الساحق (الاقتراب، الارتقاء) والتدريبات التمهيدية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف المراحل الفنية للضرب الساحق (الاقتراب، الارتقاء، الضرب، الهبوط).\n2. يؤدي خطوتي الاقتراب (اليسرى ثم اليمنى السريعة العميقة) والارتقاء بالقدمين مع مرجحة الذراعين.\n3. يميز دور كل خطوة من خطوتي الاقتراب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- الضرب الساحق\n- الاقتراب\n- الارتقاء\n- مرجحة الذراعين\n- الشبكة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم فيديو ضربة ساحقة ويسأل: كم خطوة قبل الوثب؟ ويقدم المراحل (ص 57).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص: وثب، مرجحة الذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاقتراب خطوتان (اليسرى لتحديد الاتجاه، اليمنى سريعة وعميقة وواسعة والثقل خلف العقبين) مع امتداد الذراعين للخلف، ثم الارتقاء بالقدمين مع مرجحة الذراعين عاليًا، دون كرة ثم أمام الشبكة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات تمهيدية ص 59: الاقتراب والارتقاء على علامات، ثم لمس كرة معلقة بأعلى نقطة، ثم رمي الكرة فوق الشبكة من الوثب.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: من يلمس أعلى نقطة على الحائط بعد الاقتراب والارتقاء.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما المراحل الفنية للضرب الساحق؟\nالإجابة: الاقتراب، الارتقاء، الضرب، الهبوط.\nس2 (المستوى المتوقع): بأي رجل تبدأ الخطوة الأولى للضارب الأيمن؟\nالإجابة: باليسرى.\nس3 (المستوى المتقدم): بماذا تتميز الخطوة الثانية؟\nالإجابة: سريعة وعميقة وواسعة والثقل خلف العقبين.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الاقتراب والارتقاء دون كرة أمام الشبكة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا تمتد الذراعان للخلف أثناء الاقتراب؟\nالإجابة: لمرجحتهما عاليًا عند الارتقاء لزيادة الارتفاع.\nس3 (المستوى المتقدم): كم مسافة الاقتراب؟\nالإجابة: 2.5 إلى 5 أمتار.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب خطوتي الاقتراب والوثب في المنزل (دليل المعلم ص 57-59)."}}, {"focus": "مرحلتا الضرب والهبوط والضرب الساحق الكامل والقياس المهاري", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي الضرب الساحق المواجه كاملًا من إعداد المعلم (مقابلة الكرة في أعلى نقطة والذراع ممدودة وتغطية الكرة باليد).\n2. يطبق النقاط الفنية للضرب والهبوط (المرفق أعلى الكتف، الذراع الحرة للاتزان، الهبوط بالقدمين بثني الركبتين).\n3. يحلل أخطاء الضرب (الضرب أسفل الكرة، لمس الشبكة) ويصححها.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "المصادر التعليمية": "- أخرى: كرات طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق لتقسيم الملعب\n- أخرى: استمارات تسجيل", "المفاهيم": "- الضرب\n- الهبوط\n- تغطية الكرة\n- المعد\n- المربعات", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الاقتراب والارتقاء ويسأل: كيف نوجه الكرة بقوة للأسفل؟ ويعرض مرحلة الضرب (ص 58).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: أثناء الوثب تتحرك الذراع للأمام وللأعلى والمرفق أعلى الكتف والرقبة للخلف قليلًا، الذراع الحرة للأمام للاتزان، مقابلة الكرة في أعلى نقطة ومد الذراع وتغطية الكرة باليد، ثم الهبوط بالقدمين بثني الركبتين دون لمس الشبكة؛ ثم الضرب الكامل من إعداد المعلم.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 60: الضرب على كرة ممسوكة، ثم من رمية الزميل، ثم من إعداد المعلم نحو مربعات الملعب، ويسجل القائد.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: القياس المهاري ص 67: 3 محاولات لكل طالب من إعداد المعلم ونقاط حسب المربع وتكنيك الأداء.\n- الطالب: يؤدي ويسجل.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أين يكون المرفق لحظة الضرب؟\nالإجابة: أعلى من مستوى الكتف.\nس2 (المستوى المتوقع): أين نقابل الكرة؟\nالإجابة: في أعلى نقطة والذراع ممدودة.\nس3 (المستوى المتقدم): كيف نهبط بعد الضرب؟\nالإجابة: بالقدمين بثني الركبتين دون لمس الشبكة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الضرب الساحق المواجه من إعداد المعلم.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كم محاولة في القياس المهاري وكيف تحتسب الدرجات؟\nالإجابة: ثلاث محاولات، والدرجات حسب المربع الذي تسقط فيه الكرة مع تكنيك الأداء.\nس3 (المستوى المتقدم): ما سبب خروج الكرة خارج الملعب عند الضرب؟\nالإجابة: عدم تغطية الكرة باليد أو الضرب أسفلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على ضرب الكرة على الحائط من الوثب بتغطية اليد (دليل المعلم ص 58-61)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف المراحل الفنية للضرب الساحق (الاقتراب، الارتقاء، الضرب، الهبوط).\n2. يؤدي خطوتي الاقتراب (اليسرى ثم اليمنى السريعة العميقة) والارتقاء بالقدمين مع مرجحة الذراعين.\n3. يميز دور كل خطوة من خطوتي الاقتراب.\n\nالحصة 2:\n1. يؤدي الضرب الساحق المواجه كاملًا من إعداد المعلم (مقابلة الكرة في أعلى نقطة والذراع ممدودة وتغطية الكرة باليد).\n2. يطبق النقاط الفنية للضرب والهبوط (المرفق أعلى الكتف، الذراع الحرة للاتزان، الهبوط بالقدمين بثني الركبتين).\n3. يحلل أخطاء الضرب (الضرب أسفل الكرة، لمس الشبكة) ويصححها.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم الذاتي", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: مراتب\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق لتقسيم الملعب\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- الضرب الساحق\n- الاقتراب\n- الارتقاء\n- مرجحة الذراعين\n- الشبكة\n\nالحصة 2:\n- الضرب\n- الهبوط\n- تغطية الكرة\n- المعد\n- المربعات", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعر علم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما المراحل الفنية للضرب الساحق؟\nالإجابة: الاقتراب، الارتقاء، الضرب، الهبوط.\nس2 (المستوى المتوقع): بأي رجل تبدأ الخطوة الأولى للضارب الأيمن؟\nالإجابة: باليسرى.\nس3 (المستوى المتقدم): بماذا تتميز الخطوة الثانية؟\nالإجابة: سريعة وعميقة وواسعة والثقل خلف العقبين.\n\nالحصة 2:\nس1 (مستوى الدعم): أين يكون المرفق لحظة الضرب؟\nالإجابة: أعلى من مستوى الكتف.\nس2 (المستوى المتوقع): أين نقابل الكرة؟\nالإجابة: في أعلى نقطة والذراع ممدودة.\nس3 (المستوى المتقدم): كيف نهبط بعد الضرب؟\nالإجابة: بالقدمين بثني الركبتين دون لمس الشبكة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الاقتراب والارتقاء دون كرة أمام الشبكة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا تمتد الذراعان للخلف أثناء الاقتراب؟\nالإجابة: لمرجحتهما عاليًا عند الارتقاء لزيادة الارتفاع.\nس3 (المستوى المتقدم): كم مسافة الاقتراب؟\nالإجابة: 2.5 إلى 5 أمتار.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الضرب الساحق المواجه من إعداد المعلم.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كم محاولة في القياس المهاري وكيف تحتسب الدرجات؟\nالإجابة: ثلاث محاولات، والدرجات حسب المربع الذي تسقط فيه الكرة مع تكنيك الأداء.\nس3 (المستوى المتقدم): ما سبب خروج الكرة خارج الملعب عند الضرب؟\nالإجابة: عدم تغطية الكرة باليد أو الضرب أسفلها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تدريب خطوتي الاقتراب والوثب في المنزل (دليل المعلم ص 57-59).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على ضرب الكرة على الحائط من الوثب بتغطية اليد (دليل المعلم ص 58-61)."}}, {"title": "الدفاع بيد واحدة من الوقوف", "unit": "الكرة الطائرة", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 62-66", "n": 1, "periods": [{"focus": "الدفاع بيد واحدة من الوقوف: المرحلة التمهيدية ووقفة الدفاع والأداء", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف استخدامات الدفاع بيد واحدة من الوقوف (الدفاع عن الجزء الخلفي، تغطية حائط الصد، تغطية الهجوم).\n2. يؤدي الدفاع بيد واحدة من وقفة الاستعداد العميقة وتوجيه الكرة إلى العلامات.\n3. يقدر الصفات البدنية والنفسية اللازمة للدفاع (القوة، الرشاقة، سرعة رد الفعل، الشجاعة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: علامات على الملعب\n- الوسائل المتعددة (سمعية - بصرية)", "المفاهيم": "- الدفاع عن الملعب\n- وقفة الاستعداد العميقة\n- تغطية حائط الصد\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الدفاع باليدين من أسفل ويسأل: ماذا لو جاءت الكرة بعيدة إلى الجانب ولا نصل إليها باليدين؟ ويقدم الدفاع بيد واحدة (ص 62-63).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص مع تمرينات قوة الرجلين والذراعين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: التحرك من وقفة الاستعداد العميقة في منطقة التغطية، الطعن باتجاه الكرة ومد الذراع واستقبالها بالساعد أو الكف وتوجيهها عاليًا، ثم تطبيق موجه بضربات خفيفة من المعلم وتوجيه الكرة إلى العلامات.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 64: ثلاثيات (مدافع وقاذفان على التوالي) بكرات على الجانبين، بتكرار قصير (5-10 دقائق) وتبادل الأدوار.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الإنقاذ): نقطة لكل كرة جانبية يُنقذها المدافع بيد واحدة وتصل للزميل.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم الدفاع بيد واحدة؟\nالإجابة: للكرات البعيدة إلى الجانب في الجزء الخلفي أو لتغطية حائط الصد.\nس2 (المستوى المتوقع): من أي وقفة نبدأ؟\nالإجابة: وقفة الاستعداد العميقة.\nس3 (المستوى المتقدم): لماذا يكون التكرار في التمرين لمدة قصيرة؟\nالإجابة: لأن الوقفة العميقة تتطلب قوة كبيرة في الرجلين.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الدفاع بيد واحدة let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});

function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
</script>
</body>
</html>
