:root{--bg:#f3f6fa;--card:#ffffff;--ink:#2d3b45;--muted:#6f7f8a;--line:#dde5ec;--acc:#4f7fb3;--soft:#eef4fb;
--o0:#7fb5d9;--o1:#e7a98c;--o2:#8fc7a6;--o3:#b9a6dc;--good:#4aa77a;--bad:#d9827a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Tajawal',sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 85% -10%,#e7f0f8 0,transparent 60%),radial-gradient(900px 500px at 0% 110%,#f2ece4 0,transparent 55%),var(--bg);min-height:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 30px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-size:13px;color:var(--muted)}
.ttl{font-weight:700;font-size:20px}
.ib{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:8px 13px;cursor:pointer;font-size:15px}
.ib:hover{background:var(--soft)}
.screen{display:none;flex:1;animation:fade .45s ease}
.screen.on{display:flex;flex-direction:column}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px -18px rgba(60,90,120,.35)}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.setup h3{margin:0 0 10px;font-size:17px;color:var(--acc)}
.step{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:var(--soft);color:var(--acc);font-size:14px;margin-left:6px;border:1px solid var(--line)}
select,input[type=text],input[type=number]{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;color:var(--ink)}
.axes{display:flex;flex-direction:column;gap:7px;max-height:250px;overflow:auto;padding:2px}
.axes label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;font-size:15px;line-height:1.5}
.axes label.on{border-color:var(--acc);background:var(--soft)}
.axes input{margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:15px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.gnames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gnames div{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.go{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:16px;padding:14px 34px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 10px 20px -12px var(--acc)}
.go:disabled{opacity:.5;cursor:default}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
/* game */
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.turn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;padding:7px 16px;border-radius:999px;color:#fff}
.qgrid{display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:stretch}
.qcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 26px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.qtype{font-size:14px;color:var(--muted);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.lv i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-left:3px}
.lv i.f{background:var(--acc)}
.qtext{font-family:'Naskh','Tajawal',serif;font-size:clamp(22px,2.7vw,34px);line-height:1.75;font-weight:700}
.blank{display:inline-block;min-width:110px;border-bottom:3px dashed var(--acc);margin:0 6px;text-align:center;color:var(--acc)}
.timer{background:#fff;border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:700}
.ring .num small{font-size:12px;color:var(--muted);font-weight:400}
.pts{margin-top:6px;font-size:15px;color:var(--muted)}
.pts b{color:var(--ink);font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.opt{font:inherit;font-family:'Naskh','Tajawal',serif;font-size:clamp(19px,2.2vw,28px);font-weight:700;border:0;border-radius:20px;padding:18px 18px;min-height:86px;color:#24333c;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:right;transition:transform .15s,opacity .3s,box-shadow .3s}
.opt:hover{transform:translateY(-2px)}
.opt .sh{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;font-family:'DejaVu Sans',sans-serif}
.opt.c0{background:color-mix(in srgb,var(--o0) 45%,#fff)}.opt.c1{background:color-mix(in srgb,var(--o1) 45%,#fff)}
.opt.c2{background:color-mix(in srgb,var(--o2) 45%,#fff)}.opt.c3{background:color-mix(in srgb,var(--o3) 45%,#fff)}
.opt.dim{opacity:.35}
.opt.right{box-shadow:0 0 0 4px var(--good);opacity:1}
.opt.wrong{box-shadow:0 0 0 4px var(--bad)}
.opt:disabled{cursor:default;transform:none}
.gfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.feedback{font-size:20px;font-weight:700;min-height:30px}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* results */
.res{display:grid;grid-template-columns:1fr;gap:14px}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px);height:340px;padding:20px 10px 0;border-bottom:2px solid var(--line)}
.bar{width:clamp(56px,9vw,110px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .b{width:100%;border-radius:16px 16px 6px 6px;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bar .v{font-weight:700;font-size:20px;margin-bottom:6px;opacity:0;transition:opacity .6s .6s}
.bar.show .v{opacity:1}
.bar .rk{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:18px}
.bar.win .b{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--good),0 12px 24px -10px var(--good)}
.bar .plus{font-size:15px;color:var(--good);font-weight:700;height:20px}
.names{display:flex;justify-content:center;gap:clamp(10px,3vw,40px)}
.names div{width:clamp(56px,9vw,110px);text-align:center;font-weight:700;font-size:15px;line-height:1.3}
/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:320px;margin-top:10px}
.pod{width:min(200px,28vw);text-align:center}
.pod .blk{border-radius:18px 18px 8px 8px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:40px;font-weight:700;color:#fff;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.pod .nm{font-weight:700;font-size:20px;margin-bottom:4px}
.pod .sc{color:var(--muted);margin-bottom:8px}
.rest{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:820px){.setup{grid-template-columns:1fr}.qgrid{grid-template-columns:1fr}.timer{flex-direction:row;gap:16px}.ring{width:110px;height:110px}.ring svg{width:110px;height:110px}.ring .num{font-size:30px}.opts{grid-template-columns:1fr}}

 $('qno').textContent='السؤال '+(G.k+1)+' من '+G.qs.length;$('lname').textContent=LS[S.li].t;
 $('qtype').textContent=TYPES[q.t];$('qlv').innerHTML=[1,2,3].map(i=>'<i class="'+(i<=q.l?'f':'')+'"></i>').join('');
 $('qtext').innerHTML=esc(q.q).replace('___','<span class="blank" id="blank">؟</span>');
 $('fb').textContent='';$('next').style.display='none';$('skip').style.display='inline-block';
 if(S.mode==='rot'){$('picker').style.display='none';setTurn(G.k%S.g);}
 else{const pk=$('picker');pk.style.display='flex';pk.innerHTML='<span class="hint" style="margin:0">اختر المجموعة المجيبة:</span>';
  for(let i=0;i<S.g;i++){const b=document.createElement('button');b.className='chip';b.textContent=S.names[i];b.style.borderColor=GC[i];b.onclick=()=>{setTurn(i);[...pk.querySelectorAll('.chip')].forEach(x=>x.classList.toggle('on',x===b));};pk.appendChild(b);if(i===G.k%S.g)b.click();}}
 const o=$('opts');o.innerHTML='';o.style.gridTemplateColumns=q.t==='t'?'1fr 1fr':'';
 q.ord.forEach((oi,pos)=>{const b=document.createElement('button');b.className='opt c'+(q.t==='t'?(oi===0?2:1):pos);b.innerHTML='<span class="sh">'+(q.t==='t'?(oi===0?'✓':'✗'):SH[pos])+'</span><span>'+esc(q.o[oi])+'</span>';
  b.onclick=()=>answer(oi,b);o.appendChild(b);});
 run();}
function run(){clearInterval(timer);const st=Date.now()-(G.el||0)*1000;G.el=G.el||0;
 timer=setInterval(()=>{G.el=(Date.now()-st)/1000;const t=G.el;const arc=$('arc');
  if(t<=30){$('tnum').textContent=Math.ceil(30-t);$('tlab').textContent='ثانية';arc.style.stroke='var(--acc)';arc.style.strokeDashoffset=402.1*(t/30);
   if(30-t<=5&&Math.floor(t*10)%10===0)snd('tick');}
  else{const o=Math.min(30,t-30);$('tnum').textContent='+'+Math.floor(t-30);$('tlab').textContent='وقت إضافي';arc.style.stroke='#d9b26b';arc.style.strokeDashoffset=402.1*(1-o/30);}
  $('pnow').textContent=ptsAt(t);},100);}
function answer(oi,btn){if(G.locked)return;G.locked=true;clearInterval(timer);const q=G.qs[G.k];const ok=oi===q.a;const pts=ok?ptsAt(G.el):0;
 G.sc[G.turn]+=pts;G.last={g:G.turn,pts:pts,ok:ok};
 [...$('opts').children].forEach((b,pos)=>{b.disabled=true;const id=q.ord[pos];if(id===q.a)b.classList.add('right');else if(b===btn)b.classList.add('wrong');else b.classList.add('dim');});
 if(q.t==='f'&&$('blank'))$('blank').textContent=q.o[q.a];
 $('fb').innerHTML=ok?'<span style="color:var(--good)">إجابة صحيحة! +'+pts+' نقطة لـ '+esc(S.names[G.turn])+'</span>':'<span style="color:var(--bad)">إجابة غير صحيحة، الصواب: '+esc(q.o[q.a])+'</span>';
 snd(ok?'ok':'no');$('skip').style.display='none';$('next').style.display='inline-block';}
$('skip').onclick=()=>{if(G.locked)return;G.locked=true;clearInterval(timer);const q=G.qs[G.k];G.last={g:G.turn,pts:0,ok:false};
 [...$('opts').children].forEach((b,pos)=>{b.disabled=true;if(q.ord[pos]===q.a)b.classList.add('right');else b.classList.add('dim');});
 if(q.t==='f'&&$('blank'))$('blank').textContent=q.o[q.a];
 $('fb').innerHTML='<span style="color:var(--muted)">لم تُجب المجموعة، الصواب: '+esc(q.o[q.a])+'</span>';snd('no');$('skip').style.display='none';$('next').style.display='inline-block';};
$('next').onclick=()=>{G.el=0;results();};
function results(){show('sRes');const n=S.g;const max=Math.max(1000,...G.sc);
 const order=[...Array(n).keys()].sort((a,b)=>G.sc[b]-G.sc[a]);const rank={};order.forEach((g,i)=>{rank[g]=(i>0&&G.sc[g]===G.sc[order[i-1]])?rank[order[i-1]]:i+1;});
 $('rttl').textContent='الترتيب بعد السؤال '+(G.k+1)+' من '+G.qs.length;
 const ch=$('chart'),nm=$('cnames');ch.innerHTML='';nm.innerHTML='';
 for(let i=0;i<n;i++){const d=document.createElement('div');d.className='bar'+(G.last&&G.last.g===i&&G.last.ok?' win':'');
  d.innerHTML='<div class="plus">'+(G.last&&G.last.g===i&&G.last.pts?'+'+G.last.pts:'')+'</div><div class="v">'+G.sc[i]+'</div><div class="b" style="background:linear-gradient(180deg,'+GC[i]+','+GC[i]+'cc)"><span class="rk">'+rank[i]+'</span></div>';
  ch.appendChild(d);const t=document.createElement('div');t.textContent=S.names[i];nm.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.classList.add('show');d.querySelector('.b').style.height=Math.max(6,Math.round(260*G.sc[i]/max))+'px';}));}
 if(G.last&&G.last.ok)setTimeout(()=>snd('ok'),500);
 $('cont').textContent=G.k+1<G.qs.length?'السؤال التالي':'منصة التتويج';}
$('cont').onclick=()=>{G.k++;if(G.k<G.qs.length){show('sGame');ask();}else end();};
function end(){G.done=true;show('sEnd');const n=S.g;const order=[...Array(n).keys()].sort((a,b)=>G.sc[b]-G.sc[a]);
 const pod=$('podium');pod.innerHTML='';const slots=[1,0,2].filter(i=>i<n);const H={0:230,1:170,2:120};
 const rk=[];order.forEach((g,i)=>{rk[i]=(i>0&&G.sc[g]===G.sc[order[i-1]])?rk[i-1]:i+1;});
 slots.forEach(r=>{const g=order[r];const d=document.createElement('div');d.className='pod';
  d.innerHTML='<div class="nm">'+esc(S.names[g])+'</div><div class="sc">'+G.sc[g]+' نقطة</div><div class="blk" style="background:'+GC[g]+'">'+rk[r]+'</div>';pod.appendChild(d);
  setTimeout(()=>{d.querySelector('.blk').style.height=H[r]+'px';},150+r*250);});
 const rest=$('rest');rest.innerHTML='';order.slice(3).forEach((g,i)=>{const s=document.createElement('span');s.className='pill';s.textContent=rk[i+3]+'. '+S.names[g]+' - '+G.sc[g]+' نقطة';rest.appendChild(s);});
 snd('win');confetti();}
$('again').onclick=()=>show('sSetup');
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vy:1+Math.random()*1.6,vx:-.6+Math.random()*1.2,a:Math.random()*6,c:GC[Math.floor(Math.random()*6)]}));
 let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((f+p.a*10)/30)*.4;p.a+=.04;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=.75;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
 f++;if(f<420)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();}
</script></body></html>
