سب\nيعرض المعلم منحنى استطالة يبدأ مستقيمًا ثم ينحني، ويسأل: ماذا حدث للزنبرك بعد النقطة التي ينحني عندها المنحنى؟"},{"h":"<div class=\"psub\">الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المنحنى على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">قانون هوك<\/td><td>يصوغ: الاستطالة تتناسب طرديًا مع القوة حتى حد التناسب، <bdi>F = kx<\/bdi>، ويشرح وحدة k.<\/td><td>يدونون القانون والوحدات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">حد التناسب<\/td><td>يحدد على المنحنى نقطة حد التناسب ويوضح أن الزنبرك بعدها لا يخضع لقانون هوك.<\/td><td>يحددون حد التناسب في منحنيات مختلفة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسائل (الأسئلة 10-4 إلى 12-4 في كتاب الطالب)<\/td><td>يتابع حل المسائل.<\/td><td>يحسبون k وF وx.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب\n(5 دقائق) التهيئة\nدور المعلم: يعرض المنحنى على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) قانون هوك\nدور المعلم: يصوغ: الاستطالة تتناسب طرديًا مع القوة حتى حد التناسب، F = kx، ويشرح وحدة k.\nدور الطالب: يدونون القانون والوحدات.\n\n(10 دقائق) حد التناسب\nدور المعلم: يحدد على المنحنى نقطة حد التناسب ويوضح أن الزنبرك بعدها لا يخضع لقانون هوك.\nدور الطالب: يحددون حد التناسب في منحنيات مختلفة.\n\n(8 دقائق) مسائل (الأسئلة 10-4 إلى 12-4 في كتاب الطالب)\nدور المعلم: يتابع حل المسائل.\nدور الطالب: يحسبون k وF وx.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون."},{"h":"<div class=\"psub\">الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب علاقة قانون هوك وحدد معنى كل رمز.<\/td><td><bdi>F = kx<\/bdi>؛ F القوة (N)، k ثابت الزنبرك (N/m)، x الاستطالة (m).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>زنبرك ثابته 50 N/m. احسب القوة اللازمة لإطالته 0.04 m.<\/td><td><bdi>F = 50 × 0.04 = 2 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زنبرك استطال 3 cm بقوة 6 N. احسب ثابته بوحدة N/cm ثم N/m.<\/td><td><bdi>k = 2 N/cm = 200 N/m<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب\n1) [مستوى الدعم] اكتب علاقة قانون هوك وحدد معنى كل رمز.\nالإجابة النموذجية: F = kx؛ F القوة (N)، k ثابت الزنبرك (N/m)، x الاستطالة (m).\n\n2) [المستوى المتوقع] زنبرك ثابته 50 N/m. احسب القوة اللازمة لإطالته 0.04 m.\nالإجابة النموذجية: F = 50 × 0.04 = 2 N.\n\n3) [المستوى المتقدم] زنبرك استطال 3 cm بقوة 6 N. احسب ثابته بوحدة N/cm ثم N/m.\nالإجابة النموذجية: k = 2 N/cm = 200 N/m."},{"h":"<div class=\"psub\">الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: النقطة التي لا يعود الجسم عندها خاضعًا لقانون هوك تسمى .........<\/td><td>حد التناسب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>زنبرك ثابته 25 N/m عُلقت به قوة 5 N. احسب الاستطالة.<\/td><td><bdi>x = 5 ÷ 25 = 0.2 m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زنبركان <bdi>A (k = 40 N/m)<\/bdi> و<bdi>B (k = 80 N/m)<\/bdi>. أيهما أصلب؟ وأيهما يستطيل أكثر بالقوة نفسها؟<\/td><td>B أصلب لأن ثابته أكبر، وA يستطيل أكثر (ضعف استطالة B).<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب\n1) [مستوى الدعم] أكمل: النقطة التي لا يعود الجسم عندها خاضعًا لقانون هوك تسمى .........\nالإجابة النموذجية: حد التناسب.\n\n2) [المستوى المتوقع] زنبرك ثابته 25 N/m عُلقت به قوة 5 N. احسب الاستطالة.\nالإجابة النموذجية: x = 5 ÷ 25 = 0.2 m.\n\n3) [المستوى المتقدم] زنبركان A (k = 40 N/m) وB (k = 80 N/m). أيهما أصلب؟ وأيهما يستطيل أكثر بالقوة نفسها؟\nالإجابة النموذجية: B أصلب لأن ثابته أكبر، وA يستطيل أكثر (ضعف استطالة B)."},{"h":"<div class=\"psub\">الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب<\/div><p>حل الأسئلة 10-4 إلى 12-4 وأسئلة نهاية الوحدة الرابعة في كتاب الطالب ص 54–57، وإكمال تمرين 5-4 استطالة زنبرك في كتاب النشاط ص 37–40.<\/p>","t":"الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب\nحل الأسئلة 10-4 إلى 12-4 وأسئلة نهاية الوحدة الرابعة في كتاب الطالب ص 54–57، وإكمال تمرين 5-4 استطالة زنبرك في كتاب النشاط ص 37–40."}]}},{"label":"1-5 عزم القوة","unit":"الوحدة الخامسة: عزم القوة ومركز الكتلة","periods":[{"n":1,"focus":"التأثير الدوراني للقوة","info":"<div><b>الدرس:<\/b> 1-5 عزم القوة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع التاسع (1–5/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 58–60 | كتاب النشاط: تمرين 1-5 ص 43<\/div><div><b>دليل المعلم:<\/b> ص 62<\/div><div><b>محور الحصة:<\/b> التأثير الدوراني للقوة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف عزم القوة بأنه مقياس لتأثيرها الدوراني.<\/li><li>يقدم أمثلة على عزم القوة من الحياة اليومية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر وضع مقبض الباب بعيدًا عن المفصلات.<\/div>","t":"1. يصف عزم القوة بأنه مقياس لتأثيرها الدوراني.\n2. يقدم أمثلة على عزم القوة من الحياة اليومية.\nمخرج تعليمي آخر: يفسر وضع مقبض الباب بعيدًا عن المفصلات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف عزم القوة بأنه مقياس لتأثيرها الدوراني.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقدم أمثلة على عزم القوة من الحياة اليومية.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر وضع مقبض الباب بعيدًا عن المفصلات.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف عزم القوة بأنه مقياس لتأثيرها الدوراني. ← فهم\n• يقدم أمثلة على عزم القوة من الحياة اليومية. ← فهم\n• يفسر وضع مقبض الباب بعيدًا عن المفصلات. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: باب الفصل، مفتاح ربط، مسطرة مثبتة بمحور، أثقال صغيرة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: باب الفصل، مفتاح ربط، مسطرة مثبتة بمحور، أثقال صغيرة"},{"h":"<div class=\"pills\"><span>عزم القوة<\/span><span>محور الدوران<\/span><span>التأثير الدوراني<\/span><span>البعد عن المحور<\/span><\/div>","t":"عزم القوة، محور الدوران، التأثير الدوراني، البعد عن المحور"},{"h":"<p>تحدٍّ: يحاول طالب فتح باب الفصل بالدفع قرب المفصلات ثم عند المقبض. أيهما أسهل؟ ولماذا؟<\/p>","t":"تحدٍّ: يحاول طالب فتح باب الفصل بالدفع قرب المفصلات ثم عند المقبض. أيهما أسهل؟ ولماذا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ التحدي.<\/td><td>يقارنون السهولة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مفهوم العزم<\/td><td>يعرّف العزم والمحور ويعرض أمثلة: الباب، ومفتاح الربط، والمقص، والأرجوحة.<\/td><td>يحددون المحور ونقطة تأثير القوة في كل مثال.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استكشاف عملي<\/td><td>يوزع مسطرة مثبتة بمحور وأثقالًا صغيرة.<\/td><td>يجربون أثر تغيير القوة والمسافة في الدوران ويسجلون الملاحظات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">السؤالان 1-5 و2-5 (كتاب الطالب ص 59)<\/td><td>يتابع الحل.<\/td><td>يحلون في أزواج.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ التحدي.\nدور الطالب: يقارنون السهولة.\n\n(10 دقائق) مفهوم العزم\nدور المعلم: يعرّف العزم والمحور ويعرض أمثلة: الباب، ومفتاح الربط، والمقص، والأرجوحة.\nدور الطالب: يحددون المحور ونقطة تأثير القوة في كل مثال.\n\n(12 دقيقة) استكشاف عملي\nدور المعلم: يوزع مسطرة مثبتة بمحور وأثقالًا صغيرة.\nدور الطالب: يجربون أثر تغيير القوة والمسافة في الدوران ويسجلون الملاحظات.\n\n(8 دقائق) السؤالان 1-5 و2-5 (كتاب الطالب ص 59)\nدور المعلم: يتابع الحل.\nدور الطالب: يحلون في أزواج.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بعزم القوة؟<\/td><td>مقياس للتأثير الدوراني للقوة حول محور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يسهل فك صامولة بمفتاح ربط طويل؟<\/td><td>لأن زيادة البعد عن المحور تزيد العزم للقوة نفسها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر طريقتين لزيادة عزم قوة تؤثر في باب.<\/td><td>زيادة مقدار القوة، أو التأثير بها في نقطة أبعد عن المفصلات وبشكل عمودي على الباب.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بعزم القوة؟\nالإجابة النموذجية: مقياس للتأثير الدوراني للقوة حول محور.\n\n2) [المستوى المتوقع] لماذا يسهل فك صامولة بمفتاح ربط طويل؟\nالإجابة النموذجية: لأن زيادة البعد عن المحور تزيد العزم للقوة نفسها.\n\n3) [المستوى المتقدم] اذكر طريقتين لزيادة عزم قوة تؤثر في باب.\nالإجابة النموذجية: زيادة مقدار القوة، أو التأثير بها في نقطة أبعد عن المفصلات وبشكل عمودي على الباب."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: النقطة التي يدور حولها الجسم تسمى .........<\/td><td>محور الدوران.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مثالين من الحياة اليومية على عزم القوة.<\/td><td>فتح الباب، وفك الصامولة بالمفتاح، والأرجوحة، والمقص.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يصعب فتح الباب إذا دفعته بقوة td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يستقصي عمليًا شروط اتزان مسطرة على محور. ← تحليل\n• يستنتج أن العزم يعتمد على مقدار القوة وبعدها عن المحور. ← فهم\n• يتنبأ بموضع ثقل يحقق التوازن قبل تجربته. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: مسطرة مترية، محور (حد سكين)، أثقال مختلفة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: مسطرة مترية، محور (حد سكين)، أثقال مختلفة"},{"h":"<div class=\"pills\"><span>التوازن<\/span><span>العزم<\/span><span>اتجاه الدوران<\/span><span>المسافة من المحور<\/span><\/div>","t":"التوازن، العزم، اتجاه الدوران، المسافة من المحور"},{"h":"<p>سؤال الأرجوحة: طالبان مختلفان في الوزن؛ أين يجلس الأثقل ليتوازن مع الأخف؟<\/p>","t":"سؤال الأرجوحة: طالبان مختلفان في الوزن؛ أين يجلس الأثقل ليتوازن مع الأخف؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح سؤال الأرجوحة.<\/td><td>يتوقعون أن الأثقل يقترب من المحور.<\/td><\/tr><tr><td class=\"tm\">18 د<\/td><td class=\"st\">النشاط 1-5 التوازن (كتاب الطالب)<\/td><td>يوجه إلى وضع ثقل ثابت على جانب ومحاولة الموازنة بأثقال مختلفة في الجانب الآخر.<\/td><td>يسجلون القوة والمسافة لكل جانب ويلاحظون تقارب حاصل الضرب عند التوازن.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">استنتاج<\/td><td>يقود المناقشة نحو العزم في اتجاه دوران عقارب الساعة وعكسها.<\/td><td>يكتبون استنتاجهم.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يمهد لحساب العزم.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح سؤال الأرجوحة.\nدور الطالب: يتوقعون أن الأثقل يقترب من المحور.\n\n(18 دقيقة) النشاط 1-5 التوازن (كتاب الطالب)\nدور المعلم: يوجه إلى وضع ثقل ثابت على جانب ومحاولة الموازنة بأثقال مختلفة في الجانب الآخر.\nدور الطالب: يسجلون القوة والمسافة لكل جانب ويلاحظون تقارب حاصل الضرب عند التوازن.\n\n(7 دقائق) استنتاج\nدور المعلم: يقود المناقشة نحو العزم في اتجاه دوران عقارب الساعة وعكسها.\nدور الطالب: يكتبون استنتاجهم.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يمهد لحساب العزم.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>في الأرجوحة المتزنة، أين يجلس الشخص الأثقل؟<\/td><td>أقرب إلى المحور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ثقل 2 N على بعد 30 cm يمين المحور. أين نضع ثقلًا 3 N يسار المحور ليتوازن؟<\/td><td>على بعد 20 cm؛ لأن <bdi>2 × 30 = 3 × 20<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر توازن ثقلين مختلفين على مسطرة.<\/td><td>لأن عزميهما متساويان؛ فالثقل الأصغر يعوضه بعد أكبر عن المحور.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] في الأرجوحة المتزنة، أين يجلس الشخص الأثقل؟\nالإجابة النموذجية: أقرب إلى المحور.\n\n2) [المستوى المتوقع] ثقل 2 N على بعد 30 cm يمين المحور. أين نضع ثقلًا 3 N يسار المحور ليتوازن؟\nالإجابة النموذجية: على بعد 20 cm؛ لأن 2 × 30 = 3 × 20.\n\n3) [المستوى المتقدم] فسّر توازن ثقلين مختلفين على مسطرة.\nالإجابة النموذجية: لأن عزميهما متساويان؛ فالثقل الأصغر يعوضه بعد أكبر عن المحور."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يتوازن ثقلان مختلفان إذا وُضعا على البعد نفسه من المحور.<\/td><td>خطأ؛ يدور الجانب ذو الثقل الأكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الكميتان اللتان يعتمد عليهما العزم؟<\/td><td>مقدار القوة، والمسافة العمودية بين خط عملها والمحور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم تجربة تثبت أن العزم يعتمد على المسافة من المحور مع ثبات القوة.<\/td><td>نضع ثقلًا ثابتًا على مسافات مختلفة، ونقيس القوة اللازمة للموازنة على مسافة ثابتة في الجانب الآخر؛ فتزداد كلما ابتعد الثقل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يتوازن ثقلان مختلفان إذا وُضعا على البعد نفسه من المحور.\nالإجابة النموذجية: خطأ؛ يدور الجانب ذو الثقل الأكبر.\n\n2) [المستوى المتوقع] ما الكميتان اللتان يعتمد عليهما العزم؟\nالإجابة النموذجية: مقدار القوة، والمسافة العمودية بين خط عملها والمحور.\n\n3) [المستوى المتقدم] صمم تجربة تثبت أن العزم يعتمد على المسافة من المحور مع ثبات القوة.\nالإجابة النموذجية: نضع ثقلًا ثابتًا على مسافات مختلفة، ونقيس القوة اللازمة للموازنة على مسافة ثابتة في الجانب الآخر؛ فتزداد كلما ابتعد الثقل."},{"h":"<p>مراجعة كتاب الطالب ص 59–60، وكتابة تقرير قصير عن النشاط 1-5، والاستعداد لحساب العزم (ص 61).<\/p>","t":"مراجعة كتاب الطالب ص 59–60، وكتابة تقرير قصير عن النشاط 1-5، والاستعداد لحساب العزم (ص 61)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-5 عزم القوة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع التاسع (1–5/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 58–60 | كتاب النشاط: تمرين 1-5 ص 43<\/div><div><b>دليل المعلم:<\/b> ص 62<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><ol class=\"ol\"><li>يصف عزم القوة بأنه مقياس لتأثيرها الدوراني.<\/li><li>يقدم أمثلة على عزم القوة من الحياة اليومية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر وضع مقبض الباب بعيدًا عن المفصلات.<\/div><div class=\"psub\">الحصة 2: استقصاء التوازن على محور<\/div><ol class=\"ol\"><li>يستقصي عمليًا شروط اتزان مسطرة على محور.<\/li><li>يستنتج أن العزم يعتمد على مقدار القوة وبعدها عن المحور.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بموضع ثقل يحقق التوازن قبل تجربته.<\/div>","t":"الحصة 1: التأثير الدوراني للقوة\n1. يصف عزم القوة بأنه مقياس لتأثيرها الدوراني.\n2. يقدم أمثلة على عزم القوة من الحياة اليومية.\nمخرج تعليمي آخر: يفسر وضع مقبض الباب بعيدًا عن المفصلات.\n\nالحصة 2: استقصاء التوازن على محور\n1. يستقصي عمليًا شروط اتزان مسطرة على محور.\n2. يستنتج أن العزم يعتمد على مقدار القوة وبعدها عن المحور.\nمخرج تعليمي آخر: يتنبأ بموضع ثقل يحقق التوازن قبل تجربته."},{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف عزم القوة بأنه مقياس لتأثيرها الدوراني.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقدم أمثلة على عزم القوة من الحياة اليومية.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر وضع مقبض الباب بعيدًا عن المفصلات.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء التوازن على محور<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستقصي عمليًا شروط اتزان مسطرة على محور.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يستنتج أن العزم يعتمد على مقدار القوة وبعدها عن المحور.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يتنبأ بموضع ثقل يحقق التوازن قبل تجربته.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التأثير الدوراني للقوة\n• يصف عزم القوة بأنه مقياس لتأثيرها الدوراني. ← فهم\n• يقدم أمثلة على عزم القوة من الحياة اليومية. ← فهم\n• يفسر وضع مقبض الباب بعيدًا عن المفصلات. ← تحليل\n\nالحصة 2: استقصاء التوازن على محور\n• يستقصي عمليًا شروط اتزان مسطرة على محور. ← تحليل\n• يستنتج أن العزم يعتمد على مقدار القوة وبعدها عن المحور. ← فهم\n• يتنبأ بموضع ثقل يحقق التوازن قبل تجربته. ← تطبيق"},{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><\/div><div cla ان مختلفان في الوزن؛ أين يجلس الأثقل ليتوازن مع الأخف؟<\/p>","t":"الحصة 1: التأثير الدوراني للقوة\nتحدٍّ: يحاول طالب فتح باب الفصل بالدفع قرب المفصلات ثم عند المقبض. أيهما أسهل؟ ولماذا؟\n\nالحصة 2: استقصاء التوازن على محور\nسؤال الأرجوحة: طالبان مختلفان في الوزن؛ أين يجلس الأثقل ليتوازن مع الأخف؟"},{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ التحدي.<\/td><td>يقارنون السهولة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مفهوم العزم<\/td><td>يعرّف العزم والمحور ويعرض أمثلة: الباب، ومفتاح الربط، والمقص، والأرجوحة.<\/td><td>يحددون المحور ونقطة تأثير القوة في كل مثال.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استكشاف عملي<\/td><td>يوزع مسطرة مثبتة بمحور وأثقالًا صغيرة.<\/td><td>يجربون أثر تغيير القوة والمسافة في الدوران ويسجلون الملاحظات.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">السؤالان 1-5 و2-5 (كتاب الطالب ص 59)<\/td><td>يتابع الحل.<\/td><td>يحلون في أزواج.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء التوازن على محور<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح سؤال الأرجوحة.<\/td><td>يتوقعون أن الأثقل يقترب من المحور.<\/td><\/tr><tr><td class=\"tm\">18 د<\/td><td class=\"st\">النشاط 1-5 التوازن (كتاب الطالب)<\/td><td>يوجه إلى وضع ثقل ثابت على جانب ومحاولة الموازنة بأثقال مختلفة في الجانب الآخر.<\/td><td>يسجلون القوة والمسافة لكل جانب ويلاحظون تقارب حاصل الضرب عند التوازن.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">استنتاج<\/td><td>يقود المناقشة نحو العزم في اتجاه دوران عقارب الساعة وعكسها.<\/td><td>يكتبون استنتاجهم.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يمهد لحساب العزم.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التأثير الدوراني للقوة\n(5 دقائق) التهيئة\nدور المعلم: ينفذ التحدي.\nدور الطالب: يقارنون السهولة.\n\n(10 دقائق) مفهوم العزم\nدور المعلم: يعرّف العزم والمحور ويعرض أمثلة: الباب، ومفتاح الربط، والمقص، والأرجوحة.\nدور الطالب: يحددون المحور ونقطة تأثير القوة في كل مثال.\n\n(12 دقيقة) استكشاف عملي\nدور المعلم: يوزع مسطرة مثبتة بمحور وأثقالًا صغيرة.\nدور الطالب: يجربون أثر تغيير القوة والمسافة في الدوران ويسجلون الملاحظات.\n\n(8 دقائق) السؤالان 1-5 و2-5 (كتاب الطالب ص 59)\nدور المعلم: يتابع الحل.\nدور الطالب: يحلون في أزواج.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: استقصاء التوازن على محور\n(5 دقائق) التهيئة\nدور المعلم: يطرح سؤال الأرجوحة.\nدور الطالب: يتوقعون أن الأثقل يقترب من المحور.\n\n(18 دقيقة) النشاط 1-5 التوازن (كتاب الطالب)\nدور المعلم: يوجه إلى وضع ثقل ثابت على جانب ومحاولة الموازنة بأثقال مختلفة في الجانب الآخر.\nدور الطالب: يسجلون القوة والمسافة لكل جانب ويلاحظون تقارب حاصل الضرب عند التوازن.\n\n(7 دقائق) استنتاج\nدور المعلم: يقود المناقشة نحو العزم في اتجاه دوران عقارب الساعة وعكسها.\nدور الطالب: يكتبون استنتاجهم.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يمهد لحساب العزم.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بعزم القوة؟<\/td><td>مقياس للتأثير الدوراني للقوة حول محور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يسهل فك صامولة بمفتاح ربط طويل؟<\/td><td>لأن زيادة البعد عن المحور تزيد العزم للقوة نفسها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر طريقتين لزيادة عزم قوة تؤثر في باب.<\/td><td>زيادة مقدار القوة، أو التأثير بها في نقطة أبعد عن المفصلات وبشكل عمودي على الباب.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء التوازن على محور<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>في الأرجوحة المتزنة، أين يجلس الشخص الأثقل؟<\/td><td>أقرب إلى المحور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ثقل 2 N على بعد 30 cm يمين المحور. أين نضع ثقلًا 3 N يسار المحور ليتوازن؟<\/td><td>على بعد 20 cm؛ لأن <bdi>2 × 30 = 3 × 20<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>فسّر توازن ثقلين مختلفين على مسطرة.<\/td><td>لأن عزميهما متساويان؛ فالثقل الأصغر يعوضه بعد أكبر عن المحور.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التأثير الدوراني للقوة\n1) [مستوى الدعم] ما المقصود بعزم القوة؟\nالإجابة النموذجية: مقياس للتأثير الدوراني للقوة حول محور.\n\n2) [المستوى المتوقع] لماذا يسهل فك صامولة بمفتاح ربط طويل؟\nالإجابة النموذجية: لأن زيادة البعد عن المحور تزيد العزم للقوة نفسها.\n\n3) [المستوى المتقدم] اذكر طريقتين لزيادة عزم قوة تؤثر في باب.\nالإجابة النموذجية: زيادة مقدار القوة، أو التأثير بها في نقطة أبعد عن المفصلات وبشكل عمودي على الباب.\n\nالحصة 2: استقصاء التوازن على محور\n1) [مستوى الدعم] في الأرجوحة المتزنة، أين يجلس الشخص الأثقل؟\nالإجابة النموذجية: أقرب إلى المحور.\n\n2) [المستوى المتوقع] ثقل 2 N على بعد 30 cm يمين المحور. أين نضع ثقلًا 3 N يسار المحور ليتوازن؟\nالإجابة النموذجية: على بعد 20 cm؛ لأن 2 × 30 = 3 × 20.\n\n3) [المستوى المتقدم] فسّر توازن ثقلين مختلفين على مسطرة.\nالإجابة النموذجية: لأن عزميهما متساويان؛ فالثقل الأصغر يعوضه بعد أكبر عن المحور."},{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: النقطة التي يدور حولها الجسم تسمى .........<\/td><td>محور الدوران.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مثالين من الحياة اليومية على عزم القوة.<\/td><td>فتح الباب، وفك الصامولة بالمفتاح، والأرجوحة، والمقص.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يصعب فتح الباب إذا دفعته بقوة يمر خط عملها بالمفصلات؟<\/td><td>لأن المسافة العمودية بين خط عمل القوة والمحور صفر، فيكون العزم صفرًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء التوازن على محور<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يتوازن ثقلان مختلفان إذا وُضعا على البعد نفسه من المحور.<\/td><td>خطأ؛ يدور الجانب ذو الثقل الأكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الكميتان اللتان يعتمد عليهما العزم؟<\/td><td>مقدار القوة، والمسافة العمودية بين خط عملها والمحور.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم تجربة تثبت أن العزم يعتمد على المسافة من المحور مع ثبات القوة.<\/td><td>نضع ثقلًا ثابتًا على مسافات مختلفة، ونقيس القوة اللازمة للموازنة على مسافة ثابتة في الجانب الآخر؛ فتزداد كلما ابتعد الثقل.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التأثير الدوراني للقوة\n1) [مستوى الدعم] أكمل: النقطة التي يدور حولها الجسم تسمى .........\nالإجابة النموذجية: محور الدوران.\n\n2) [المستوى المتوقع] اذكر مثالين من الحياة اليومية على عزم القوة.\nالإجابة النموذجية: فتح الباب، وفك الصامولة بالمفتاح، والأرجوحة، والمقص.\n\n3) [المستوى المتقدم] لماذا يصعب فتح الباب إذا دفعته بقوة يمر خط عملها بالمفصلات؟\nالإجابة النموذجية: لأن المسافة العمودية بين خط عمل القوة والمحور صفر، فيكون العزم صفرًا.\n\nالحصة 2: استقصاء التوازن على محور\n1) [مستوى الدعم] صواب أم خطأ: يتوازن ثقلان مختلفان إذا وُضعا على البعد نفسه من المحور.\nالإجابة النموذجية: خطأ؛ يدور الجانب ذو الثقل الأكبر.\n\n2) [المستوى المتوقع] ما الكميتان اللتان يعتمد عليهما العزم؟\nالإجابة النموذجية: مقدار القوة، والمسافة العمودية بين خط عملها والمحور.\n\n3) [المستوى المتقدم] صمم تجربة تثبت أن العزم يعتمد على المسافة من المحور مع ثبات القوة.\nالإجابة النموذجية: نضع ثقلًا ثابتًا على مسافات مختلفة، ونقيس القوة اللازمة للموازنة على مسافة ثابتة في الجانب الآخر؛ فتزداد كلما ابتعد الثقل."},{"h":"<div class=\"psub\">الحصة 1: التأثير الدوراني للقوة<\/div><p>مراجعة كتاب الطالب ص 58–59 والإجابة عن السؤالين 1-5 و2-5، وحل تمرين 1-5 تأثير دوران قوة ما في كتاب النشاط ص 43.<\/p><div class=\"psub\">الحصة 2: استقصاء التوازن على محور<\/div><p>مراجعة كتاب الطالب ص 59–60، وكتابة تقرير قصير عن النشاط 1-5، والاستعداد لحساب العزم (ص 61).<\/p>","t":"الحصة 1: التأثير الدوراني للقوة\nمراجعة كتاب الطالب ص 58–59 والإجابة عن السؤالين 1-5 و2-5، وحل تمرين 1-5 تأثير دوران قوة ما في كتاب النشاط ص 43.\n\nالحصة 2: استقصاء التوازن على محور\nمراجعة كتاب الطالب ص 59–60، وكتابة تقرير قصير عن النشاط 1-5، والاستعداد لحساب العزم (ص 61)."}]}},{"label":"2-5 حساب عزم القوة","unit":"الوحدة الخامسة: عزم القوة ومركز الكتلة","periods":[{"n":1,"focus":"حساب العزم ومبدأ العزوم","info":"<div><b>الدرس:<\/b> 2-5 حساب عزم القوة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 61–63 | كتاب النشاط: تمرين 2-5 ص 44، ورقة العمل 1-5 ص 48–51<\/div><div><b>دليل المعلم:<\/b> ص 63<\/div><div><b>محور الحصة:<\/b> حساب العزم ومبدأ العزوم<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m.<\/li><li>يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان.<\/div>","t":"1. يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m.\n2. يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران.\nمخرج تعليمي آخر: يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m. ← تطبيق\n• يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران. ← تطبيق\n• يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: مسطرة مترية، محور، أثقال، ميزان نابض<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: مسطرة مترية، محور، أثقال، ميزان نابض"},{"h":"<div class=\"pills\"><span>عزم القوة<\/span><span>نيوتن متر (N m)<\/span><span>مبدأ العزوم<\/span><span>الاتزان<\/span><span>المسافة العمودية<\/span><\/div>","t":"عزم القوة، نيوتن متر (N m)، مبدأ العزوم، الاتزان، المسافة العمودية"},{"h":"<p>يعرض المعلم جدول قيم من النشاط 1-5 ويطلب حساب القوة × المسافة لكل جانب.<\/p>","t":"يعرض المعلم جدول قيم من النشاط 1-5 ويطلب حساب القوة × المسافة لكل جانب."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الجدول.<\/td><td>يحسبون ويلاحظون التساوي.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">قانون العزم<\/td><td>يقدم: العزم = القوة × المسافة العمودية من المحور، الوحدة N m، ويحل مثالًا: 20 N على بعد 0.5 m يعطي 10 N m.<\/td><td>يحلون أمثلة قصيرة.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مبدأ العزوم<\/td><td>يصوغ: عند الاتزان مجموع العزوم مع عقارب الساعة = مجموعها عكسها، ويحل مثالًا على السبورة الذكية.<\/td><td>يطبقون المبدأ لإيجاد قوة أو مسافة مجهولة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">شرطا الاتزان<\/td><td>يوضح أن الاتزان يتطلب انعدام محصلة القوة ومحصلة العزوم معًا.<\/td><td>يحددون القوة التي يؤثر بها المحور في العارضة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الجدول.\nدور الطالب: يحسبون ويلاحظون التساوي.\n\n(10 دقائق) قانون العزم\nدور المعلم: يقدم: العزم = القوة × المسافة العمودية من المحور، الوحدة N m، ويحل مثالًا: 20 N على بعد 0.5 m يعطي 10 N m.\nدور الطالب: يحلون أمثلة قصيرة.\n\n(12 دقيقة) مبدأ العزوم\nدور المعلم: يصوغ: عند الاتزان مجموع العزوم مع عقارب الساعة = مجموعها عكسها، ويحل مثالًا على السبورة الذكية.\nدور الطالب: يطبقون المبدأ لإيجاد قوة أو مسافة مجهولة.\n\n(8 دقائق) شرطا الاتزان\nدور المعلم: يوضح أن الاتزان يتطلب انعدام محصلة القوة ومحصلة العزوم معًا.\nدور الطالب: يحددون القوة التي يؤثر بها المحور في العارضة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب عزم قوة 40 N تؤثر عموديًا على بعد 0.25 m من المحور.<\/td><td><bdi>40 × 0.25 = 10 N m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عارضة متزنة: 30 N على بعد 0.4 m يسار المحور. أين توضع قوة 20 N يمين المحور؟<\/td><td><bdi>30 × 0.4 = 12 N m<\/bdi>، فالمسافة = <bdi>12 ÷ 20 = 0.6 m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عارضة خفيفة متزنة تؤثر فيها قوتان إلى الأسفل 30 N و 20 N على جانبي المحور. ما القوة التي يؤثر بها المحور؟ ولماذا؟<\/td><td>50 N إلى الأعلى؛ لأن محصلة القوى يجب أن تكون صفرًا عند الاتزان.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] احسب عزم قوة 40 N تؤثر عموديًا على بعد 0.25 m من المحور.\nالإجابة النموذجية: 40 × 0.25 = 10 N m.\n\n2) [المستوى المتوقع] عارضة متزنة: 30 N على بعد 0.4 m يسار المحور. أين توضع قوة 20 N يمين المحور؟\nالإجابة النموذجية: 30 × 0.4 = 12 N m، فالمسافة = 12 ÷ 20 = 0.6 m.\n\n3) [المستوى المتقدم] عارضة خفيفة متزنة تؤثر فيها قوتان إلى الأسفل 30 N و 20 N على جانبي المحور. ما القوة التي يؤثر بها المحور؟ ولماذا؟\nالإجابة النموذجية: 50 N إلى الأعلى؛ لأن محصلة القوى يجب أن تكون صفرًا عند الاتزان."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس عزم القوة؟<\/td><td>نيوتن متر (N m).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: إذا تساوت العزوم في الاتجاهين فالجسم في حالة اتزان دوراني.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أرجوحة متزنة: طفل وزنه 300 N على بعد 2 m من المحور، وآخر وزنه 400 N. احسب بُعد الثاني.<\/td><td><bdi>300 × 2 = 400 × d<\/bdi>، <bdi>d = 1.5 m<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وحدة قياس عزم القوة؟\nالإجابة النموذجية: نيوتن متر (N m).\n\n2) [المستوى المتوقع] صواب أم خطأ: إذا تساوت العزوم في الاتجاهين فالجسم في حالة اتزان دوراني.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] أرجوحة متزنة: طفل وزنه 300 N على بعد 2 m من المحور، وآخر وزنه 400 N. احسب بُعد الثاني.\nالإجابة النموذجية: 300 × 2 = 400 × d، d = 1.5 m."},{"h":"<p>مراجعة الأمثلة في كتاب الطالب ص 61–62 والإجابة عن السؤالين 3-5 و4-5، وحل تمرين 2-5 حساب العزم في كتاب النشاط ص 44.<\/p>","t":"مراجعة الأمثلة في كتاب الطالب ص 61–62 والإجابة عن السؤالين 3-5 و4-5، وحل تمرين 2-5 حساب العزم في كتاب النشاط ص 44."}]},{"n":2,"focus":"استقصاء الاتزان وتطبيقات العزوم","info":"<div><b>الدرس:<\/b> 2-5 حساب عزم القوة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 61–63 | كتاب النشاط: تمرين 2-5 ص 44، ورقة العمل 1-5 ص 48–51<\/div><div><b>دليل المعلم:<\/b> ص 63<\/div><div><b>محور الحصة:<\/b> استقصاء الاتزان وتطبيقات العزوم<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يتحقق تجريبيًا من مبدأ العزوم.<\/li><li>يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم دقة نتائجه ويقترح تحسينات للتجربة.<\/div>","t":"1. يتحقق تجريبيًا من مبدأ العزوم.\n2. يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة.\nمخرج تعليمي آخر: يقيّم دقة نتائجه ويقترح تحسينات للتجربة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتحقق تجريبيًا من مبدأ العزوم.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقيّم دقة نتائجه ويقترح تحسينات للتجربة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يتحقق تجريبيًا من مبدأ العزوم. ← تطبيق\n• يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة. ← تطبيق\n• يقيّم دقة نتائجه ويقترح تحسينات للتجربة. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: مسطرة مترية، حد سكين، أثقال 1 N و 2 N، خيوط<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: مسطرة مترية، حد سكين، أثقال 1 N و 2 N، خيوط"},{"h":"<div class=\"pills\"><span>مبدأ العزوم<\/span><span>الرافعة<\/span><span>نقطة الارتكاز<\/span><span>الاتزان<\/span><\/div>","t":"مبدأ العزوم، الرافعة، نقطة الارتكاز، الاتزان"},{"h":"<p>صورة عامل يرفع حجرًا ثقيلًا بعتلة طويلة؛ سؤال: كيف يرفع حجرًا وزنه أكبر بكثير من قوته؟<\/p>","t":"صورة عامل يرفع حجرًا ثقيلًا بعتلة طويلة؛ سؤال: كيف يرفع حجرًا وزنه أكبر بكثير من قوته؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يربطون طول العتلة بالعزم.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 2-5 استقصاء الاتزان (كتاب الطالب)<\/td><td>يوجه المجموعات إلى موازنة المسطرة بثلاثة أثقال على الأقل وتسجيل القوى والمسافات.<\/td><td>يحسبون مجموع العزوم في الاتجاهين ويقارنونها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تطبيق الرافعة<\/td><td>يحل مثالًا: حجر 600 N على بعد 0.2 m من نقطة الارتكاز، واليد على بعد 1.2 m.<\/td><td>يحسبون القوة اللازمة: <bdi>600 × 0.2 ÷ 1.2 = 100 N<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">ورقة العمل 1-5 الاتزان (كتاب النشاط ص 48)<\/td><td>يوجه إلى البدء.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يربطون طول العتلة بالعزم.\n\n(17 دقيقة) النشاط 2-5 استقصاء الاتزان (كتاب الطالب)\nدور المعلم: يوجه المجموعات إلى موازنة المسطرة بثلاثة أثقال على الأقل وتسجيل القوى والمسافات.\nدور الطالب: يحسبون مجموع العزوم في الاتجاهين ويقارنونها.\n\n(10 دقائق) تطبيق الرافعة\nدور المعلم: يحل مثالًا: حجر 600 N على بعد 0.2 m من نقطة الارتكاز، واليد على بعد 1.2 m.\nدور الطالب: يحسبون القوة اللازمة: 600 × 0.2 ÷ 1.2 = 100 N.\n\n(4 دقائق) ورقة العمل 1-5 الاتزان (كتاب النشاط ص 48)\nدور المعلم: يوجه إلى البدء.\nدور الطالب: يبدؤون الحل.\n\n(4 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا تتوقع عند مقارنة مجموع العزوم في الاتجاهين لمسطرة متزنة؟<\/td><td>أن يكونا متساويين تقريبًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عتلة يرفع بها حجر 900 N على بعد 0.3 m من نقطة الارتكاز. ما القوة اللازمة على بعد 1.5 m؟<\/td><td><bdi>900 × 0.3 = 270 N m<\/bdi>، القوة = <bdi>270 ÷ 1.5 = 180 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر مصدرين للخطأ في النشاط واقترح تحسينًا.<\/td><td>عدم دقة تحديد مواضع الأثقال، وعدم اتزان المسطرة وحدها؛ نستخدم خيوطًا رفيعة ونضع المحور عند مركز كتلة المسطرة تمامًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا تتوقع عند مقارنة مجموع العزوم في الاتجاهين لمسطرة متزنة؟\nالإجابة النموذجية: أن يكونا متساويين تقريبًا.\n\n2) [المستوى المتوقع] عتلة يرفع بها حجر 900 N على بعد 0.3 m من نقطة الارتكاز. ما القوة اللازمة على بعد 1.5 m؟\nالإجابة النموذجية: 900 × 0.3 = 270 N m، القوة = 270 ÷ 1.5 = 180 N.\n\n3) [المستوى المتقدم] اذكر مصدرين للخطأ في النشاط واقترح تحسينًا.\nالإجابة النموذجية: عدم دقة تحديد مواضع الأثقال، وعدم اتزان المسطرة وحدها؛ نستخدم خيوطًا رفيعة ونضع المحور عند مركز كتلة المسطرة تمامًا."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: لرفع جسم ثقيل بقوة صغيرة نجعل ذراع القوة .........<\/td><td>طويلة (بعيدة عن نقطة الارتكاز).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>مسطرة متزنة: 2 N على بعد 20 cm و 1 N على بعد 10 cm يسار المحور، وثقل 2.5 N يمين المحور. أين يوضع؟<\/td><td>العزوم يسارًا = <bdi>40 + 10 = 50 N cm<\/bdi>، البعد = <bdi>50 ÷ 2.5 = 20 cm<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُصنع مقبض المفك الكبير عريضًا؟<\/td><td>لأن زيادة نصف قطر المقبض تزيد المسافة عن المحور فيزداد العزم الناتج عن قوة اليد نفسها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: لرفع جسم ثقيل بقوة صغيرة نجعل ذراع القوة .........\nالإجابة النموذجية: طويلة (بعيدة عن نقطة الارتكاز).\n\n2) [المستوى المتوقع] مسطرة متزنة: 2 N على بعد 20 cm و 1 N على بعد 10 cm يسار المحور، وثقل 2.5 N يمين المحور. أين يوضع؟\nالإجابة النموذجية: العزوم يسارًا = 40 + 10 = 50 N cm، البعد = 50 ÷ 2.5 = 20 cm.\n\n3) [المستوى المتقدم] لماذا يُصنع مقبض المفك الكبير عريضًا؟\nالإجابة النموذجية: لأن زيادة نصف قطر المقبض تزيد المسافة عن المحور فيزداد العزم الناتج عن قوة اليد نفسها."},{"h":"<p>إكمال ورقة العمل 1-5 الاتزان في كتاب النشاط ص 48–51، وكتابة نتائج النشاط 2-5.<\/p>","t":"إكمال ورقة العمل 1-5 الاتزان في كتاب النشاط ص 48–51، وكتابة نتائج النشاط 2-5."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-5 حساب عزم القوة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 61–63 | كتاب النشاط: تمرين 2-5 ص 44، ورقة العمل 1-5 ص 48–51<\/div><div><b>دليل المعلم:<\/b> ص 63<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><ol class=\"ol\"><li>يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m.<\/li><li>يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان.<\/div><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><ol class=\"ol\"><li>يتحقق تجريبيًا من مبدأ العزوم.<\/li><li>يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم دقة نتائجه ويقترح تحسينات للتجربة.<\/div>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n1. يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m.\n2. يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران.\nمخرج تعليمي آخر: يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان.\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n1. يتحقق تجريبيًا من مبدأ العزوم.\n2. يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة.\nمخرج تعليمي آخر: يقيّم دقة نتائجه ويقترح تحسينات للتجربة."},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتحقق تجريبيًا من مبدأ العزوم.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقيّم دقة نتائجه ويقترح تحسينات للتجربة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n• يحسب عزم القوة بحاصل ضرب القوة في المسافة العمودية من المحور، ويذكر أن وحدته N m. ← تطبيق\n• يطبق مبدأ العزوم على موازنة عارضة عند محور الدوران. ← تطبيق\n• يتعرف أنه في حالة عدم وجود محصلة قوة ومحصلة عزوم يكون النظام في حالة اتزان. ← فهم\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n• يتحقق تجريبيًا من مبدأ العزوم. ← تطبيق\n• يطبق مبدأ العزوم على فتح الباب وأرجوحة التوازن ورفع الأحمال بالرافعة. ← تطبيق\n• يقيّم دقة نتائجه ويقترح تحسينات للتجربة. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><\/div><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: مسطرة مترية، محور، أثقال، ميزان نابض<\/span><\/div><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: مسطرة مترية، حد سكين، أثقال 1 N و 2 N، خيوط<\/span><\/div>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n• الكتاب\n• السبورة الذكية\n• أخرى: مسطرة مترية، محور، أثقال، ميزان نابض\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: مسطرة مترية، حد سكين، أثقال 1 N و 2 N، خيوط"},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><div class=\"pills\"><span>عزم القوة<\/span><span>نيوتن متر (N m)<\/span><span>مبدأ العزوم<\/span><span>الاتزان<\/span><span>المسافة العمودية<\/span><\/div><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><div class=\"pills\"><span>مبدأ العزوم<\/span><span>الرافعة<\/span><span>نقطة الارتكاز<\/span><span>الاتزان<\/span><\/div>","t":"الحصة 1: حساب العزم ومبدأ العزوم\nعزم القوة، نيوتن متر (N m)، مبدأ العزوم، الاتزان، المسافة العمودية\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\nمبدأ العزوم، الرافعة، نقطة الارتكاز، الاتزان"},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><p>يعرض المعلم جدول قيم من النشاط 1-5 ويطلب حساب القوة × المسافة لكل جانب.<\/p><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><p>صورة عامل يرفع حجرًا ثقيلًا بعتلة طويلة؛ سؤال: كيف يرفع حجرًا وزنه أكبر بكثير من قوته؟<\/p>","t":"الحصة 1: حساب العزم ومبدأ العزوم\nيعرض المعلم جدول قيم من النشاط 1-5 ويطلب حساب القوة × المسافة لكل جانب.\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\nصورة عامل يرفع حجرًا ثقيلًا بعتلة طويلة؛ سؤال: كيف يرفع حجرًا وزنه أكبر بكثير من قوته؟"},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الجدول.<\/td><td>يحسبون ويلاحظون التساوي.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">قانون العزم<\/td><td>يقدم: العزم = القوة × المسافة العمودية من المحور، الوحدة N m، ويحل مثالًا: 20 N على بعد 0.5 m يعطي 10 N m.<\/td><td>يحلون أمثلة قصيرة.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مبدأ العزوم<\/td><td>يصوغ: عند الاتزان مجموع العزوم مع عقارب الساعة = مجموعها عكسها، ويحل مثالًا على السبورة الذكية.<\/td><td>يطبقون المبدأ لإيجاد قوة أو مسافة مجهولة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">شرطا الاتزان<\/td><td>يوضح أن الاتزان يتطلب انعدام محصلة القوة ومحصلة العزوم معًا.<\/td><td>يحددون القوة التي يؤثر بها المحور في العارضة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية.<\/td><td>يربطون طول العتلة بالعزم.<\/td><\/tr><tr><td class=\"tm\">17 د<\/td><td class=\"st\">النشاط 2-5 استقصاء الاتزان (كتاب الطالب)<\/td><td>يوجه المجموعات إلى موازنة المسطرة بثلاثة أثقال على الأقل وتسجيل القوى والمسافات.<\/td><td>يحسبون مجموع العزوم في الاتجاهين ويقارنونها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تطبيق الرافعة<\/td><td>يحل مثالًا: حجر 600 N على بعد 0.2 m من نقطة الارتكاز، واليد على بعد 1.2 m.<\/td><td>يحسبون القوة اللازمة: <bdi>600 × 0.2 ÷ 1.2 = 100 N<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">ورقة العمل 1-5 الاتزان (كتاب النشاط ص 48)<\/td><td>يوجه إلى البدء.<\/td><td>يبدؤون الحل.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n(5 دقائق) التهيئة\nدور المعلم: يعرض الجدول.\nدور الطالب: يحسبون ويلاحظون التساوي.\n\n(10 دقائق) قانون العزم\nدور المعلم: يقدم: العزم = القوة × المسافة العمودية من المحور، الوحدة N m، ويحل مثالًا: 20 N على بعد 0.5 m يعطي 10 N m.\nدور الطالب: يحلون أمثلة قصيرة.\n\n(12 دقيقة) مبدأ العزوم\nدور المعلم: يصوغ: عند الاتزان مجموع العزوم مع عقارب الساعة = مجموعها عكسها، ويحل مثالًا على السبورة الذكية.\nدور الطالب: يطبقون المبدأ لإيجاد قوة أو مسافة مجهولة.\n\n(8 دقائق) شرطا الاتزان\nدور المعلم: يوضح أن الاتزان يتطلب انعدام محصلة القوة ومحصلة العزوم معًا.\nدور الطالب: يحددون القوة التي يؤثر بها المحور في العارضة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية.\nدور الطالب: يربطون طول العتلة بالعزم.\n\n(17 دقيقة) النشاط 2-5 استقصاء الاتزان (كتاب الطالب)\nدور المعلم: يوجه المجموعات إلى موازنة المسطرة بثلاثة أثقال على الأقل وتسجيل القوى والمسافات.\nدور الطالب: يحسبون مجموع العزوم في الاتجاهين ويقارنونها.\n\n(10 دقائق) تطبيق الرافعة\nدور المعلم: يحل مثالًا: حجر 600 N على بعد 0.2 m من نقطة الارتكاز، واليد على بعد 1.2 m.\nدور الطالب: يحسبون القوة اللازمة: 600 × 0.2 ÷ 1.2 = 100 N.\n\n(4 دقائق) ورقة العمل 1-5 الاتزان (كتاب النشاط ص 48)\nدور المعلم: يوجه إلى البدء.\nدور الطالب: يبدؤون الحل.\n\n(4 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب عزم قوة 40 N تؤثر عموديًا على بعد 0.25 m من المحور.<\/td><td><bdi>40 × 0.25 = 10 N m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عارضة متزنة: 30 N على بعد 0.4 m يسار المحور. أين توضع قوة 20 N يمين المحور؟<\/td><td><bdi>30 × 0.4 = 12 N m<\/bdi>، فالمسافة = <bdi>12 ÷ 20 = 0.6 m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عارضة خفيفة متزنة تؤثر فيها قوتان إلى الأسفل 30 N و 20 N على جانبي المحور. ما القوة التي يؤثر بها المحور؟ ولماذا؟<\/td><td>50 N إلى الأعلى؛ لأن محصلة القوى يجب أن تكون صفرًا عند الاتزان.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا تتوقع عند مقارنة مجموع العزوم في الاتجاهين لمسطرة متزنة؟<\/td><td>أن يكونا متساويين تقريبًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عتلة يرفع بها حجر 900 N على بعد 0.3 m من نقطة الارتكاز. ما القوة اللازمة على بعد 1.5 m؟<\/td><td><bdi>900 × 0.3 = 270 N m<\/bdi>، القوة = <bdi>270 ÷ 1.5 = 180 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر مصدرين للخطأ في النشاط واقترح تحسينًا.<\/td><td>عدم دقة تحديد مواضع الأثقال، وعدم اتزان المسطرة وحدها؛ نستخدم خيوطًا رفيعة ونضع المحور عند مركز كتلة المسطرة تمامًا.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n1) [مستوى الدعم] احسب عزم قوة 40 N تؤثر عموديًا على بعد 0.25 m من المحور.\nالإجابة النموذجية: 40 × 0.25 = 10 N m.\n\n2) [المستوى المتوقع] عارضة متزنة: 30 N على بعد 0.4 m يسار المحور. أين توضع قوة 20 N يمين المحور؟\nالإجابة النموذجية: 30 × 0.4 = 12 N m، فالمسافة = 12 ÷ 20 = 0.6 m.\n\n3) [المستوى المتقدم] عارضة خفيفة متزنة تؤثر فيها قوتان إلى الأسفل 30 N و 20 N على جانبي المحور. ما القوة التي يؤثر بها المحور؟ ولماذا؟\nالإجابة النموذجية: 50 N إلى الأعلى؛ لأن محصلة القوى يجب أن تكون صفرًا عند الاتزان.\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n1) [مستوى الدعم] ماذا تتوقع عند مقارنة مجموع العزوم في الاتجاهين لمسطرة متزنة؟\nالإجابة النموذجية: أن يكونا متساويين تقريبًا.\n\n2) [المستوى المتوقع] عتلة يرفع بها حجر 900 N على بعد 0.3 m من نقطة الارتكاز. ما القوة اللازمة على بعد 1.5 m؟\nالإجابة النموذجية: 900 × 0.3 = 270 N m، القوة = 270 ÷ 1.5 = 180 N.\n\n3) [المستوى المتقدم] اذكر مصدرين للخطأ في النشاط واقترح تحسينًا.\nالإجابة النموذجية: عدم دقة تحديد مواضع الأثقال، وعدم اتزان المسطرة وحدها؛ نستخدم خيوطًا رفيعة ونضع المحور عند مركز كتلة المسطرة تمامًا."},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس عزم القوة؟<\/td><td>نيوتن متر (N m).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: إذا تساوت العزوم في الاتجاهين فالجسم في حالة اتزان دوراني.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أرجوحة متزنة: طفل وزنه 300 N على بعد 2 m من المحور، وآخر وزنه 400 N. احسب بُعد الثاني.<\/td><td><bdi>300 × 2 = 400 × d<\/bdi>، <bdi>d = 1.5 m<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: لرفع جسم ثقيل بقوة صغيرة نجعل ذراع القوة .........<\/td><td>طويلة (بعيدة عن نقطة الارتكاز).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>مسطرة متزنة: 2 N على بعد 20 cm و 1 N على بعد 10 cm يسار المحور، وثقل 2.5 N يمين المحور. أين يوضع؟<\/td><td>العزوم يسارًا = <bdi>40 + 10 = 50 N cm<\/bdi>، البعد = <bdi>50 ÷ 2.5 = 20 cm<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُصنع مقبض المفك الكبير عريضًا؟<\/td><td>لأن زيادة نصف قطر المقبض تزيد المسافة عن المحور فيزداد العزم الناتج عن قوة اليد نفسها.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: حساب العزم ومبدأ العزوم\n1) [مستوى الدعم] ما وحدة قياس عزم القوة؟\nالإجابة النموذجية: نيوتن متر (N m).\n\n2) [المستوى المتوقع] صواب أم خطأ: إذا تساوت العزوم في الاتجاهين فالجسم في حالة اتزان دوراني.\nالإجابة النموذجية: صواب.\n\n3) [المستوى المتقدم] أرجوحة متزنة: طفل وزنه 300 N على بعد 2 m من المحور، وآخر وزنه 400 N. احسب بُعد الثاني.\nالإجابة النموذجية: 300 × 2 = 400 × d، d = 1.5 m.\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\n1) [مستوى الدعم] أكمل: لرفع جسم ثقيل بقوة صغيرة نجعل ذراع القوة .........\nالإجابة النموذجية: طويلة (بعيدة عن نقطة الارتكاز).\n\n2) [المستوى المتوقع] مسطرة متزنة: 2 N على بعد 20 cm و 1 N على بعد 10 cm يسار المحور، وثقل 2.5 N يمين المحور. أين يوضع؟\nالإجابة النموذجية: العزوم يسارًا = 40 + 10 = 50 N cm، البعد = 50 ÷ 2.5 = 20 cm.\n\n3) [المستوى المتقدم] لماذا يُصنع مقبض المفك الكبير عريضًا؟\nالإجابة النموذجية: لأن زيادة نصف قطر المقبض تزيد المسافة عن المحور فيزداد العزم الناتج عن قوة اليد نفسها."},{"h":"<div class=\"psub\">الحصة 1: حساب العزم ومبدأ العزوم<\/div><p>مراجعة الأمثلة في كتاب الطالب ص 61–62 والإجابة عن السؤالين 3-5 و4-5، وحل تمرين 2-5 حساب العزم في كتاب النشاط ص 44.<\/p><div class=\"psub\">الحصة 2: استقصاء الاتزان وتطبيقات العزوم<\/div><p>إكمال ورقة العمل 1-5 الاتزان في كتاب النشاط ص 48–51، وكتابة نتائج النشاط 2-5.<\/p>","t":"الحصة 1: حساب العزم ومبدأ العزوم\nمراجعة الأمثلة في كتاب الطالب ص 61–62 والإجابة عن السؤالين 3-5 و4-5، وحل تمرين 2-5 حساب العزم في كتاب النشاط ص 44.\n\nالحصة 2: استقصاء الاتزان وتطبيقات العزوم\nإكمال ورقة العمل 1-5 الاتزان في كتاب النشاط ص 48–51، وكتابة نتائج النشاط 2-5."}]}},{"label":"3-5 الاستقرار ومركز الكتلة","unit":"الوحدة الخامسة: عزم القوة ومركز الكتلة","periods":[{"n":1,"focus":"مركز كتلة صفيحة مستوية والاستقرار","info":"<div><b>الدرس:<\/b> 3-5 الاستقرار ومركز الكتلة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 64–70 | كتاب النشاط: تمرين 3-5 ص 45، تمرين 4-5 ص 46–47<\/div><div><b>دليل المعلم:<\/b> ص 64<\/div><div><b>محور الحصة:<\/b> مركز كتلة صفيحة مستوية والاستقرار<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها.<\/li><li>يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح تعديلات تزيد استقرار جسم ما.<\/div>","t":"1. يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها.\n2. يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام.\nمخرج تعليمي آخر: يقترح تعديلات تزيد استقرار جسم ما."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح تعديلات تزيد استقرار جسم ما.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"• يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها. ← تطبيق\n• يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام. ← فهم\n• يقترح تعديلات تزيد استقرار جسم ما. ← إبداع"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: صفائح كرتون غير منتظمة، خيط شاقول، دبوس وحامل، قلم<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: صفائح كرتون غير منتظمة، خيط شاقول، دبوس وحامل، قلم"},{"h":"<div class=\"pills\"><span>مركز الكتلة<\/span><span>الاستقرار<\/span><span>قاعدة الارتكاز<\/span><span>خيط الشاقول<\/span><\/div>","t":"مركز الكتلة، الاستقرار، قاعدة الارتكاز، خيط الشاقول"},{"h":"<p>يوازن المعلم مسطرة على إصبعه ثم قطعة كرتون غير منتظمة، ويسأل: أين نقطة الاتزان؟ وكيف نجدها بدقة؟<\/p>","t":"يوازن المعلم مسطرة على إصبعه ثم قطعة كرتون غير منتظمة، ويسأل: أين نقطة الاتزان؟ وكيف نجدها بدقة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">16 د<\/td><td class=\"st\">النشاط 3-5 مركز كتلة صفيحة مستوية (كتاب الطالب)<\/td><td>يوجه إلى تعليق الصفيحة من ثقب ورسم خط الشاقول، ثم التكرار من ثقب آخر.<\/td><td>يحددون تقاطع الخطين مركزًا للكتلة ويتحققون بموازنة الصفيحة على رأس قلم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الاستقرار<\/td><td>يعرض صورًا (حافلة، كأس عريض القاعدة، سيارة سباق) ويوضح أثر انخفاض مركز الكتلة واتساع القاعدة.<\/td><td>يصنفون الأجسام إلى أكثر استقرارًا وأقل استقرارًا مع التبرير.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">تمرين 3-5 الاستقرار ومركز الكتلة (كتاب النشاط ص 45)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(4 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يتوقعون.\n\n(16 دقيقة) النشاط 3-5 مركز كتلة صفيحة مستوية (كتاب الطالب)\nدور المعلم: يوجه إلى تعليق الصفيحة من ثقب ورسم خط الشاقول، ثم التكرار من ثقب آخر.\nدور الطالب: يحددون تقاطع الخطين مركزًا للكتلة ويتحققون بموازنة الصفيحة على رأس قلم.\n\n(10 دقائق) الاستقرار\nدور المعلم: يعرض صورًا (حافلة، كأس عريض القاعدة، سيارة سباق) ويوضح أثر انخفاض مركز الكتلة واتساع القاعدة.\nدور الطالب: يصنفون الأجسام إلى أكثر استقرارًا وأقل استقرارًا مع التبرير.\n\n(6 دقائق) تمرين 3-5 الاستقرار ومركز الكتلة (كتاب النشاط ص 45)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(4 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف مركز الكتلة.<\/td><td>النقطة التي يمكن اعتبار كتلة الجسم كلها مركزة فيها ويؤثر فيها وزنه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا نعلق الصفيحة من نقطتين مختلفتين؟<\/td><td>لأن مركز الكتلة يقع على خط الشاقول في كل مرة، فتقاطع الخطين يحدد موضعه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُصمم سيارات السباق منخفضة وعريضة؟<\/td><td>لخفض مركز الكتلة وتوسيع القاعدة فتزداد استقرارًا ولا تنقلب بسهولة عند المنعطفات.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عرّف مركز الكتلة.\nالإجابة النموذجية: النقطة التي يمكن اعتبار كتلة الجسم كلها مركزة فيها ويؤثر فيها وزنه.\n\n2) [المستوى المتوقع] لماذا نعلق الصفيحة من نقطتين مختلفتين؟\nالإجابة النموذجية: لأن مركز الكتلة يقع على خط الشاقول في كل مرة، فتقاطع الخطين يحدد موضعه.\n\n3) [المستوى المتقدم] لماذا تُصمم سيارات السباق منخفضة وعريضة؟\nالإجابة النموذجية: لخفض مركز الكتلة وتوسيع القاعدة فتزداد استقرارًا ولا تنقلب بسهولة عند المنعطفات."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يزداد استقرار الجسم كلما ......... مركز كتلته و......... قاعدته.<\/td><td>انخفض – اتسعت.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا توضع الأحمال الثقيلة في أسفل الحافلة؟<\/td><td>لخفض مركز الكتلة فتزداد استقرارًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف متى ينقلب جسم مائل مستخدمًا مفهوم مركز الكتلة.<\/td><td>ينقلب عندما يقع الخط الرأسي المار بمركز كتلته خارج قاعدة ارتكازه، فيُحدث وزنه عزمًا يديره بعيدًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يزداد استقرار الجسم كلما ......... مركز كتلته و......... قاعدته.\nالإجابة النموذجية: انخفض – اتسعت.\n\n2) [المستوى المتوقع] لماذا توضع الأحمال الثقيلة في أسفل الحافلة؟\nالإجابة النموذجية: لخفض مركز الكتلة فتزداد استقرارًا.\n\n3) [المستوى المتقدم] صف متى ينقلب جسم مائل مستخدمًا مفهوم مركز الكتلة.\nالإجابة النموذجية: ينقلب عندما يقع الخط الرأسي المار بمركز كتلته خارج قاعدة ارتكازه، فيُحدث وزنه عزمًا يديره بعيدًا."},{"h":"<p>مراجعة كتاب الطالب ص 64–70 والإجابة عن السؤالين 5-5 و6-5، وحل تمرين 4-5 بناء مجسم محمول في كتاب النشاط ص 46–47 وأسئلة نهاية الوحدة الخامسة.<\/p>","t":"مراجعة كتاب الطالب ص 64–70 والإجابة عن السؤالين 5-5 و6-5، وحل تمرين 4-5 بناء مجسم محمول في كتاب النشاط ص 46–47 وأسئلة نهاية الوحدة الخامسة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-5 الاستقرار ومركز الكتلة<\/div><div><b>الوحدة:<\/b> الوحدة الخامسة: عزم القوة ومركز الكتلة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع العاشر (8–12/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 64–70 | كتاب النشاط: تمرين 3-5 ص 45، تمرين 4-5 ص 46–47<\/div><div><b>دليل المعلم:<\/b> ص 64<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مركز كتلة صفيحة مستوية والاستقرار<\/div><ol class=\"ol\"><li>يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها.<\/li><li>يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح تعديلات تزيد استقرار جسم ما.<\/div>","t":"الحصة 1: مركز كتلة صفيحة مستوية والاستقرار\n1. يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها.\n2. يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام.\nمخرج تعليمي آخر: يقترح تعديلات تزيد استقرار جسم ما."},{"h":"<div class=\"psub\">الحصة 1: مركز كتلة صفيحة مستوية والاستقرار<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح تعديلات تزيد استقرار جسم ما.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مركز كتلة صفيحة مستوية والاستقرار\n• يؤدي تجربة لتحديد موضع مركز الكتلة لصفيحة مستوية ويصفها. ← تطبيق\n• يصف نوعيًا تأثير موضع مركز الكتلة في استقرار الأجسام. ← فهم\n• يقترح تعديلات تزيد استقرار جسم ما. ← إبداع"},{"h":"<div class=\"psub\">الحصة 1: مركز كتلة صفيحة مستوية والاستقرار<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/
