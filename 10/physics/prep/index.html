ى أكثر استقرارًا وأقل استقرارًا مع التبرير.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">تمرين 3-5 الاستقرار ومركز الكتلة (كتاب النشاط ص 45)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مركز كتلة صفيحة مستوية والاستقرار\n(4 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يتوقعون.\n\n(16 دقيقة) النشاط 3-5 مركز كتلة صفيحة مستوية (كتاب الطالب)\nدور المعلم: يوجه إلى تعليق الصفيحة من ثقب ورسم خط الشاقول، ثم التكرار من ثقب آخر.\nدور الطالب: يحددون تقاطع الخطين مركزًا للكتلة ويتحققون بموازنة الصفيحة على رأس قلم.\n\n(10 دقائق) الاستقرار\nدور المعلم: يعرض صورًا (حافلة، كأس عريض القاعدة، سيارة سباق) ويوضح أثر انخفاض مركز الكتلة واتساع القاعدة.\nدور الطالب: يصنفون الأجسام إلى أكثر استقرارًا وأقل استقرارًا مع التبرير.\n\n(6 دقائق) تمرين 3-5 الاستقرار ومركز الكتلة (كتاب النشاط ص 45)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(4 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: مركز كتلة صفيحة مستوية والاستقرار<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف مركز الكتلة.<\/td><td>النقطة التي يمكن اعتبار كتلة الجسم كلها مركزة فيها ويؤثر فيها وزنه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا نعلق الصفيحة من نقطتين مختلفتين؟<\/td><td>لأن مركز الكتلة يقع على خط الشاقول في كل مرة، فتقاطع الخطين يحدد موضعه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُصمم سيارات السباق منخفضة وعريضة؟<\/td><td>لخفض مركز الكتلة وتوسيع القاعدة فتزداد استقرارًا ولا تنقلب بسهولة عند المنعطفات.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مركز كتلة صفيحة مستوية والاستقرار\n1) [مستوى الدعم] عرّف مركز الكتلة.\nالإجابة النموذجية: النقطة التي يمكن اعتبار كتلة الجسم كلها مركزة فيها ويؤثر فيها وزنه.\n\n2) [المستوى المتوقع] لماذا نعلق الصفيحة من نقطتين مختلفتين؟\nالإجابة النموذجية: لأن مركز الكتلة يقع على خط الشاقول في كل مرة، فتقاطع الخطين يحدد موضعه.\n\n3) [المستوى المتقدم] لماذا تُصمم سيارات السباق منخفضة وعريضة؟\nالإجابة النموذجية: لخفض مركز الكتلة وتوسيع القاعدة فتزداد استقرارًا ولا تنقلب بسهولة عند المنعطفات."},{"h":"<div class=\"psub\">الحصة 1: مركز كتلة صفيحة مستوية والاستقرار<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يزداد استقرار الجسم كلما ......... مركز كتلته و......... قاعدته.<\/td><td>انخفض – اتسعت.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا توضع الأحمال الثقيلة في أسفل الحافلة؟<\/td><td>لخفض مركز الكتلة فتزداد استقرارًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف متى ينقلب جسم مائل مستخدمًا مفهوم مركز الكتلة.<\/td><td>ينقلب عندما يقع الخط الرأسي المار بمركز كتلته خارج قاعدة ارتكازه، فيُحدث وزنه عزمًا يديره بعيدًا.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مركز كتلة صفيحة مستوية والاستقرار\n1) [مستوى الدعم] أكمل: يزداد استقرار الجسم كلما ......... مركز كتلته و......... قاعدته.\nالإجابة النموذجية: انخفض – اتسعت.\n\n2) [المستوى المتوقع] لماذا توضع الأحمال الثقيلة في أسفل الحافلة؟\nالإجابة النموذجية: لخفض مركز الكتلة فتزداد استقرارًا.\n\n3) [المستوى المتقدم] صف متى ينقلب جسم مائل مستخدمًا مفهوم مركز الكتلة.\nالإجابة النموذجية: ينقلب عندما يقع الخط الرأسي المار بمركز كتلته خارج قاعدة ارتكازه، فيُحدث وزنه عزمًا يديره بعيدًا."},{"h":"<div class=\"psub\">الحصة 1: مركز كتلة صفيحة مستوية والاستقرار<\/div><p>مراجعة كتاب الطالب ص 64–70 والإجابة عن السؤالين 5-5 و6-5، وحل تمرين 4-5 بناء مجسم محمول في كتاب النشاط ص 46–47 وأسئلة نهاية الوحدة الخامسة.<\/p>","t":"الحصة 1: مركز كتلة صفيحة مستوية والاستقرار\nمراجعة كتاب الطالب ص 64–70 والإجابة عن السؤالين 5-5 و6-5، وحل تمرين 4-5 بناء مجسم محمول في كتاب النشاط ص 46–47 وأسئلة نهاية الوحدة الخامسة."}]}},{"label":"1-6 الشغل المبذول","unit":"الوحدة السادسة: الشغل والقدرة","periods":[{"n":1,"focus":"مفهوم الشغل والطاقة المنقولة","info":"<div><b>الدرس:<\/b> 1-6 الشغل المبذول<\/div><div><b>الوحدة:<\/b> الوحدة السادسة: الشغل والقدرة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 71–72 | كتاب النشاط: تمرين 1-6 ص 52–53<\/div><div><b>دليل المعلم:<\/b> ص 76<\/div><div><b>محور الحصة:<\/b> مفهوم الشغل والطاقة المنقولة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها.<\/li><li>يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها.<\/div>","t":"1. يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها.\n2. يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول.\nمخرج تعليمي آخر: يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها. ← فهم\n• يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول. ← فهم\n• يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>عروض تقديمية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• عروض تقديمية"},{"h":"<div class=\"pills\"><span>الشغل<\/span><span>الطاقة المنقولة<\/span><span>الجول<\/span><span>الحركة في اتجاه القوة<\/span><\/div>","t":"الشغل، الطاقة المنقولة، الجول، الحركة في اتجاه القوة"},{"h":"<p>سؤال محفز: طالب يحمل حقيبة ثقيلة واقفًا عشر دقائق ويشعر بالتعب. هل بذل شغلًا بالمفهوم الفيزيائي؟<\/p>","t":"سؤال محفز: طالب يحمل حقيبة ثقيلة واقفًا عشر دقائق ويشعر بالتعب. هل بذل شغلًا بالمفهوم الفيزيائي؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتناقشون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مفهوم الشغل<\/td><td>يعرّف الشغل بعرض تقديمي ويحدد شرطيه: قوة، وحركة في اتجاهها، ويربطه بنقل الطاقة.<\/td><td>يدونون التعريف ويذكرون أمثلة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">نشاط «شغل أم لا شغل؟»<\/td><td>يعرض بطاقات مواقف: دفع جدار ثابت، رفع حقيبة، حمل كتاب أثناء المشي أفقيًا، دفع عربة.<\/td><td>يصنفون المواقف ويبررون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-6 قوى تبذل شغلًا وتنقل طاقة (كتاب النشاط ص 52–53)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتناقشون.\n\n(12 دقيقة) مفهوم الشغل\nدور المعلم: يعرّف الشغل بعرض تقديمي ويحدد شرطيه: قوة، وحركة في اتجاهها، ويربطه بنقل الطاقة.\nدور الطالب: يدونون التعريف ويذكرون أمثلة.\n\n(10 دقائق) نشاط «شغل أم لا شغل؟»\nدور المعلم: يعرض بطاقات مواقف: دفع جدار ثابت، رفع حقيبة، حمل كتاب أثناء المشي أفقيًا، دفع عربة.\nدور الطالب: يصنفون المواقف ويبررون.\n\n(8 دقائق) تمرين 1-6 قوى تبذل شغلًا وتنقل طاقة (كتاب النشاط ص 52–53)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس الشغل؟<\/td><td>الجول (J).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل يبذل شخص يدفع جدارًا ثابتًا شغلًا؟ فسّر.<\/td><td>لا؛ لأن الجدار لم يتحرك في اتجاه القوة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رافعة ترفع حمولة إلى سطح مبنى. وضح العلاقة بين الشغل الذي تبذله والطاقة المنقولة.<\/td><td>الشغل المبذول يساوي الطاقة المنقولة؛ إذ تنتقل الطاقة من الرافعة إلى الحمولة وتُخزن طاقة وضع.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وحدة قياس الشغل؟\nالإجابة النموذجية: الجول (J).\n\n2) [المستوى المتوقع] هل يبذل شخص يدفع جدارًا ثابتًا شغلًا؟ فسّر.\nالإجابة النموذجية: لا؛ لأن الجدار لم يتحرك في اتجاه القوة.\n\n3) [المستوى المتقدم] رافعة ترفع حمولة إلى سطح مبنى. وضح العلاقة بين الشغل الذي تبذله والطاقة المنقولة.\nالإجابة النموذجية: الشغل المبذول يساوي الطاقة المنقولة؛ إذ تنتقل الطاقة من الرافعة إلى الحمولة وتُخزن طاقة وضع."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الشغل المبذول يساوي .........<\/td><td>الطاقة المنقولة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر شرطي بذل الشغل.<\/td><td>تأثير قوة في الجسم، وتحرك الجسم مسافة في اتجاه القوة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>طالب يحمل حقيبة ويمشي أفقيًا بسرعة ثابتة. هل تبذل القوة الرأسية التي يحمل بها الحقيبة شغلًا؟ فسّر.<\/td><td>لا؛ لأن القوة رأسية والحركة أفقية، فلا حركة في اتجاه القوة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الشغل المبذول يساوي .........\nالإجابة النموذجية: الطاقة المنقولة.\n\n2) [المستوى المتوقع] اذكر شرطي بذل الشغل.\nالإجابة النموذجية: تأثير قوة في الجسم، وتحرك الجسم مسافة في اتجاه القوة.\n\n3) [المستوى المتقدم] طالب يحمل حقيبة ويمشي أفقيًا بسرعة ثابتة. هل تبذل القوة الرأسية التي يحمل بها الحقيبة شغلًا؟ فسّر.\nالإجابة النموذجية: لا؛ لأن القوة رأسية والحركة أفقية، فلا حركة في اتجاه القوة."},{"h":"<p>مراجعة كتاب الطالب ص 71–72 والإجابة عن السؤالين 1-6 و2-6، وكتابة وصف لثلاثة أنشطة يومية مع تحديد القوى والشغل والطاقة المنقولة.<\/p>","t":"مراجعة كتاب الطالب ص 71–72 والإجابة عن السؤالين 1-6 و2-6، وكتابة وصف لثلاثة أنشطة يومية مع تحديد القوى والشغل والطاقة المنقولة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-6 الشغل المبذول<\/div><div><b>الوحدة:<\/b> الوحدة السادسة: الشغل والقدرة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 71–72 | كتاب النشاط: تمرين 1-6 ص 52–53<\/div><div><b>دليل المعلم:<\/b> ص 76<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><ol class=\"ol\"><li>يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها.<\/li><li>يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها.<\/div>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n1. يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها.\n2. يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول.\nمخرج تعليمي آخر: يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها."},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n• يعرّف الشغل المبذول بأنه ناتج تأثير قوة في جسم يتحرك مسافة في اتجاهها. ← فهم\n• يبرهن فهمه أن الشغل المبذول = الطاقة المنقولة، وأن الشغل يقاس بالجول. ← فهم\n• يميز المواقف التي يُبذل فيها شغل من التي لا يُبذل فيها. ← تحليل"},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n• التعلم بالاكتشاف\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>عروض تقديمية<\/span><\/div>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• عروض تقديمية"},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><div class=\"pills\"><span>الشغل<\/span><span>الطاقة المنقولة<\/span><span>الجول<\/span><span>الحركة في اتجاه القوة<\/span><\/div>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\nالشغل، الطاقة المنقولة، الجول، الحركة في اتجاه القوة"},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><p>سؤال محفز: طالب يحمل حقيبة ثقيلة واقفًا عشر دقائق ويشعر بالتعب. هل بذل شغلًا بالمفهوم الفيزيائي؟<\/p>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\nسؤال محفز: طالب يحمل حقيبة ثقيلة واقفًا عشر دقائق ويشعر بالتعب. هل بذل شغلًا بالمفهوم الفيزيائي؟"},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتناقشون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مفهوم الشغل<\/td><td>يعرّف الشغل بعرض تقديمي ويحدد شرطيه: قوة، وحركة في اتجاهها، ويربطه بنقل الطاقة.<\/td><td>يدونون التعريف ويذكرون أمثلة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">نشاط «شغل أم لا شغل؟»<\/td><td>يعرض بطاقات مواقف: دفع جدار ثابت، رفع حقيبة، حمل كتاب أثناء المشي أفقيًا، دفع عربة.<\/td><td>يصنفون المواقف ويبررون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-6 قوى تبذل شغلًا وتنقل طاقة (كتاب النشاط ص 52–53)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتناقشون.\n\n(12 دقيقة) مفهوم الشغل\nدور المعلم: يعرّف الشغل بعرض تقديمي ويحدد شرطيه: قوة، وحركة في اتجاهها، ويربطه بنقل الطاقة.\nدور الطالب: يدونون التعريف ويذكرون أمثلة.\n\n(10 دقائق) نشاط «شغل أم لا شغل؟»\nدور المعلم: يعرض بطاقات مواقف: دفع جدار ثابت، رفع حقيبة، حمل كتاب أثناء المشي أفقيًا، دفع عربة.\nدور الطالب: يصنفون المواقف ويبررون.\n\n(8 دقائق) تمرين 1-6 قوى تبذل شغلًا وتنقل طاقة (كتاب النشاط ص 52–53)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس الشغل؟<\/td><td>الجول (J).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل يبذل شخص يدفع جدارًا ثابتًا شغلًا؟ فسّر.<\/td><td>لا؛ لأن الجدار لم يتحرك في اتجاه القوة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رافعة ترفع حمولة إلى سطح مبنى. وضح العلاقة بين الشغل الذي تبذله والطاقة المنقولة.<\/td><td>الشغل المبذول يساوي الطاقة المنقولة؛ إذ تنتقل الطاقة من الرافعة إلى الحمولة وتُخزن طاقة وضع.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n1) [مستوى الدعم] ما وحدة قياس الشغل؟\nالإجابة النموذجية: الجول (J).\n\n2) [المستوى المتوقع] هل يبذل شخص يدفع جدارًا ثابتًا شغلًا؟ فسّر.\nالإجابة النموذجية: لا؛ لأن الجدار لم يتحرك في اتجاه القوة.\n\n3) [المستوى المتقدم] رافعة ترفع حمولة إلى سطح مبنى. وضح العلاقة بين الشغل الذي تبذله والطاقة المنقولة.\nالإجابة النموذجية: الشغل المبذول يساوي الطاقة المنقولة؛ إذ تنتقل الطاقة من الرافعة إلى الحمولة وتُخزن طاقة وضع."},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الشغل المبذول يساوي .........<\/td><td>الطاقة المنقولة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر شرطي بذل الشغل.<\/td><td>تأثير قوة في الجسم، وتحرك الجسم مسافة في اتجاه القوة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>طالب يحمل حقيبة ويمشي أفقيًا بسرعة ثابتة. هل تبذل القوة الرأسية التي يحمل بها الحقيبة شغلًا؟ فسّر.<\/td><td>لا؛ لأن القوة رأسية والحركة أفقية، فلا حركة في اتجاه القوة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\n1) [مستوى الدعم] أكمل: الشغل المبذول يساوي .........\nالإجابة النموذجية: الطاقة المنقولة.\n\n2) [المستوى المتوقع] اذكر شرطي بذل الشغل.\nالإجابة النموذجية: تأثير قوة في الجسم، وتحرك الجسم مسافة في اتجاه القوة.\n\n3) [المستوى المتقدم] طالب يحمل حقيبة ويمشي أفقيًا بسرعة ثابتة. هل تبذل القوة الرأسية التي يحمل بها الحقيبة شغلًا؟ فسّر.\nالإجابة النموذجية: لا؛ لأن القوة رأسية والحركة أفقية، فلا حركة في اتجاه القوة."},{"h":"<div class=\"psub\">الحصة 1: مفهوم الشغل والطاقة المنقولة<\/div><p>مراجعة كتاب الطالب ص 71–72 والإجابة عن السؤالين 1-6 و2-6، وكتابة وصف لثلاثة أنشطة يومية مع تحديد القوى والشغل والطاقة المنقولة.<\/p>","t":"الحصة 1: مفهوم الشغل والطاقة المنقولة\nمراجعة كتاب الطالب ص 71–72 والإجابة عن السؤالين 1-6 و2-6، وكتابة وصف لثلاثة أنشطة يومية مع تحديد القوى والشغل والطاقة المنقولة."}]}},{"label":"2-6 حساب الشغل المبذول","unit":"الوحدة السادسة: الشغل والقدرة","periods":[{"n":1,"focus":"العلاقة W = Fd ووحداتها","info":"<div><b>الدرس:<\/b> 2-6 حساب الشغل المبذول<\/div><div><b>الوحدة:<\/b> الوحدة السادسة: الشغل والقدرة<\/div><div><b>الأسبوع والتاري 50 N مسافة 3 m؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون ثم يحسبون لاحقًا.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">العلاقة والوحدات<\/td><td>يقدم <bdi>W = F × d<\/bdi> ويوضح أن <bdi>1 J = 1 N × 1 m<\/bdi>، ويحل مثالًا من كتاب الطالب ص 73.<\/td><td>يحلون سؤال التهيئة: 100 J مقابل 150 J.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">مسائل متدرجة (الأسئلة 3-6 إلى 5-6)<\/td><td>يعرض مسائل لحساب W ثم F ثم d مع تحويل cm إلى m.<\/td><td>يحلون فرديًا ثم يقارنون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">أخطاء شائعة<\/td><td>يناقش على السبورة الذكية نسيان تحويل الوحدات واستخدام مسافة ليست في اتجاه القوة.<\/td><td>يصححون أمثلة خاطئة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون ثم يحسبون لاحقًا.\n\n(12 دقيقة) العلاقة والوحدات\nدور المعلم: يقدم W = F × d ويوضح أن 1 J = 1 N × 1 m، ويحل مثالًا من كتاب الطالب ص 73.\nدور الطالب: يحلون سؤال التهيئة: 100 J مقابل 150 J.\n\n(13 دقيقة) مسائل متدرجة (الأسئلة 3-6 إلى 5-6)\nدور المعلم: يعرض مسائل لحساب W ثم F ثم d مع تحويل cm إلى m.\nدور الطالب: يحلون فرديًا ثم يقارنون.\n\n(5 دقائق) أخطاء شائعة\nدور المعلم: يناقش على السبورة الذكية نسيان تحويل الوحدات واستخدام مسافة ليست في اتجاه القوة.\nدور الطالب: يصححون أمثلة خاطئة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب الشغل المبذول لدفع صندوق بقوة 25 N مسافة 4 m.<\/td><td><bdi>W = 25 × 4 = 100 J<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>بُذل شغل 600 J لرفع جسم مسافة 3 m. احسب القوة.<\/td><td><bdi>F = 600 ÷ 3 = 200 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سُحبت عربة بقوة 50 N مسافة 80 cm. احسب الشغل بالجول.<\/td><td><bdi>d = 0.8 m<\/bdi>، <bdi>W = 50 × 0.8 = 40 J<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] احسب الشغل المبذول لدفع صندوق بقوة 25 N مسافة 4 m.\nالإجابة النموذجية: W = 25 × 4 = 100 J.\n\n2) [المستوى المتوقع] بُذل شغل 600 J لرفع جسم مسافة 3 m. احسب القوة.\nالإجابة النموذجية: F = 600 ÷ 3 = 200 N.\n\n3) [المستوى المتقدم] سُحبت عربة بقوة 50 N مسافة 80 cm. احسب الشغل بالجول.\nالإجابة النموذجية: d = 0.8 m، W = 50 × 0.8 = 40 J."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: <bdi>1 J = 1 N × 1 m<\/bdi>.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رافعة بذلت 2000 J لرفع حمولة 500 N. ما الارتفاع؟<\/td><td><bdi>d = 2000 ÷ 500 = 4 m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رفع عامل 20 صندوقًا وزن كل منها 150 N إلى رف ارتفاعه 1.2 m. احسب الشغل الكلي والطاقة المنقولة.<\/td><td>لكل صندوق 180 J، والكلي 3600 J، والطاقة المنقولة 3600 J.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: 1 J = 1 N × 1 m.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] رافعة بذلت 2000 J لرفع حمولة 500 N. ما الارتفاع؟\nالإجابة النموذجية: d = 2000 ÷ 500 = 4 m.\n\n3) [المستوى المتقدم] رفع عامل 20 صندوقًا وزن كل منها 150 N إلى رف ارتفاعه 1.2 m. احسب الشغل الكلي والطاقة المنقولة.\nالإجابة النموذجية: لكل صندوق 180 J، والكلي 3600 J، والطاقة المنقولة 3600 J."},{"h":"<p>مراجعة كتاب الطالب ص 73–74 والإجابة عن الأسئلة 3-6 إلى 5-6، وحل تمرين 2-6 حساب شغل مبذول في كتاب النشاط ص 54–55.<\/p>","t":"مراجعة كتاب الطالب ص 73–74 والإجابة عن الأسئلة 3-6 إلى 5-6، وحل تمرين 2-6 حساب شغل مبذول في كتاب النشاط ص 54–55."}]},{"n":2,"focus":"قياس الشغل المبذول عمليًا","info":"<div><b>الدرس:<\/b> 2-6 حساب الشغل المبذ ابض، أثقال، مسطرة مترية، لوح مائل، كتب"},{"h":"<div class=\"pills\"><span>قياس الشغل<\/span><span>الطاقة المنقولة<\/span><span>السطح المائل<\/span><span>الاحتكاك<\/span><\/div>","t":"قياس الشغل، الطاقة المنقولة، السطح المائل، الاحتكاك"},{"h":"<p>يسأل المعلم: لماذا تُستخدم المنحدرات لرفع البضائع إلى الشاحنات مع أن المسافة أطول؟<\/p>","t":"يسأل المعلم: لماذا تُستخدم المنحدرات لرفع البضائع إلى الشاحنات مع أن المسافة أطول؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون أن القوة اللازمة أقل.<\/td><\/tr><tr><td class=\"tm\">16 د<\/td><td class=\"st\">النشاط 1-6 بذل شغل (كتاب الطالب)<\/td><td>يوجه إلى رفع ثقل رأسيًا مسافة محددة بالميزان، ثم سحبه على لوح مائل إلى الارتفاع نفسه.<\/td><td>يقيسون القوة والمسافة في الحالتين ويحسبون الشغل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 3-6 قياس الشغل المبذول (كتاب النشاط ص 56)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يربط النتائج بفكرة المنحدر.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(4 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون أن القوة اللازمة أقل.\n\n(16 دقيقة) النشاط 1-6 بذل شغل (كتاب الطالب)\nدور المعلم: يوجه إلى رفع ثقل رأسيًا مسافة محددة بالميزان، ثم سحبه على لوح مائل إلى الارتفاع نفسه.\nدور الطالب: يقيسون القوة والمسافة في الحالتين ويحسبون الشغل.\n\n(8 دقائق) تمرين 3-6 قياس الشغل المبذول (كتاب النشاط ص 56)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يربط النتائج بفكرة المنحدر.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الكميتان اللتان يجب قياسهما لحساب الشغل في النشاط؟<\/td><td>القوة بالميزان النابض، والمسافة المقطوعة في اتجاهها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رُفع ثقل 5 N رأسيًا 0.3 m، ثم سُحب على لوح مائل بقوة 2 N مسافة 0.9 m. احسب الشغل في الحالتين.<\/td><td>رأسيًا 1.5 J، وعلى اللوح 1.8 J.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا كان الشغل على اللوح المائل أكبر قليلًا مع أن القوة أقل؟<\/td><td>بسبب الاحتكاك بين الجسم واللوح؛ فجزء من الطاقة يتحول إلى حرارة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الكميتان اللتان يجب قياسهما لحساب الشغل في النشاط؟\nالإجابة النموذجية: القوة بالميزان النابض، والمسافة المقطوعة في اتجاهها.\n\n2) [المستوى المتوقع] رُفع ثقل 5 N رأسيًا 0.3 m، ثم سُحب على لوح مائل بقوة 2 N مسافة 0.9 m. احسب الشغل في الحالتين.\nالإجابة النموذجية: رأسيًا 1.5 J، وعلى اللوح 1.8 J.\n\n3) [المستوى المتقدم] لماذا كان الشغل على اللوح المائل أكبر قليلًا مع أن القوة أقل؟\nالإجابة النموذجية: بسبب الاحتكاك بين الجسم واللوح؛ فجزء من الطاقة يتحول إلى حرارة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: على المنحدر تقل ......... اللازمة لكن تزداد المسافة.<\/td><td>القوة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رفع طالب ثقلًا 10 N إلى ارتفاع 0.5 m. احسب الطاقة المنقولة.<\/td><td>5 J.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لجعل الشغل على اللوح المائل أقرب إلى الشغل الرأسي.<\/td><td>تقليل الاحتكاك بصقل السطح أو استخدام عربة بعجلات.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: على المنحدر تقل ......... اللازمة لكن تزداد المسافة.\nالإجابة النموذجية: القوة.\n\n2) [المستوى المتوقع] رفع طالب ثقلًا 10 N إلى ارتفاع 0.5 m. احسب الطاقة المنقولة.\nالإجابة النموذجية: 5 J.\n\n3) [المستوى المتقدم] اقترح طريقة لجعل الشغل على اللوح المائل أقرب إلى الشغل الرأسي.\nالإجابة النموذجية: تقليل الاحتكاك بصقل السطح أو استخدام عربة بعجلات."},{"h":"<p>إكمال تمرين 3-6 قياس الشغل المبذول في كتاب النشاط ص 56، والإجابة عن السؤالين 6-6 و7-6 في كتاب الطالب ص 75.<\/p>","t":"إكمال تمرين 3-6 قياس الشغل المبذول في كتاب النشاط ص 56، والإجابة عن السؤالين 6-6 و7-6 في كتاب الطالب ص 75."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-6 حساب الشغل المبذول<\/div><div><b>الوحدة:<\/b> الوحدة السادسة: الشغل والقدرة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الحادي عشر (15–19/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 73–75 | كتاب النشاط: تمرين 2-6 ص 54–55، تمرين 3-6 ص 56<\/div><div><b>دليل المعلم:<\/b> ص 77<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><ol class=\"ol\"><li>يستخدم العلاقة <bdi>W = Fd = ΔE<\/bdi> لحساب الشغل المبذول.<\/li><li>يعيد ترتيب العلاقة لحساب القوة أو المسافة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحول وحدات المسافة إلى المتر قبل الحساب.<\/div><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><ol class=\"ol\"><li>يقيس عمليًا الشغل المبذول في رفع جسم أو سحبه.<\/li><li>يحسب الطاقة المنقولة من قياسات القوة والمسافة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن الشغل المبذول في رفع جسم رأسيًا وسحبه على سطح مائل إلى الارتفاع نفسه.<\/div>","t":"الحصة 1: العلاقة W = Fd ووحداتها\n1. يستخدم العلاقة W = Fd = ΔE لحساب الشغل المبذول.\n2. يعيد ترتيب العلاقة لحساب القوة أو المسافة.\nمخرج تعليمي آخر: يحول وحدات المسافة إلى المتر قبل الحساب.\n\nالحصة 2: قياس الشغل المبذول عمليًا\n1. يقيس عمليًا الشغل المبذول في رفع جسم أو سحبه.\n2. يحسب الطاقة المنقولة من قياسات القوة والمسافة.\nمخرج تعليمي آخر: يقارن الشغل المبذول في رفع جسم رأسيًا وسحبه على سطح مائل إلى الارتفاع نفسه."},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم العلاقة <bdi>W = Fd = ΔE<\/bdi> لحساب الشغل المبذول.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يعيد ترتيب العلاقة لحساب القوة أو المسافة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحول وحدات المسافة إلى المتر قبل الحساب.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يقيس عمليًا الشغل المبذول في رفع جسم أو سحبه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب الطاقة المنقولة من قياسات القوة والمسافة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن الشغل المبذول في رفع جسم رأسيًا وسحبه على سطح مائل إلى الارتفاع نفسه.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة W = Fd ووحداتها\n• يستخدم العلاقة W = Fd = ΔE لحساب الشغل المبذول. ← تطبيق\n• يعيد ترتيب العلاقة لحساب القوة أو المسافة. ← تطبيق\n• يحول وحدات المسافة إلى المتر قبل الحساب. ← تطبيق\n\nالحصة 2: قياس الشغل المبذول عمليًا\n• يقيس عمليًا الشغل المبذول في رفع جسم أو سحبه. ← تطبيق\n• يحسب الطاقة المنقولة من قياسات القوة والمسافة. ← تطبيق\n• يقارن الشغل المبذول في رفع جسم رأسيًا وسحبه على سطح مائل إلى الارتفاع نفسه. ← تحليل"},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم الذاتي<\/span><\/div><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: العلاقة W = Fd ووحداتها\n• التعلم بالنمذجة\n• التعلم المبني على حل المشكلات\n• التعلم الذاتي\n\nالحصة 2: قياس الشغل المبذول عمليًا\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><\/div><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا ><td class=\"st\">العلاقة والوحدات<\/td><td>يقدم <bdi>W = F × d<\/bdi> ويوضح أن <bdi>1 J = 1 N × 1 m<\/bdi>، ويحل مثالًا من كتاب الطالب ص 73.<\/td><td>يحلون سؤال التهيئة: 100 J مقابل 150 J.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">مسائل متدرجة (الأسئلة 3-6 إلى 5-6)<\/td><td>يعرض مسائل لحساب W ثم F ثم d مع تحويل cm إلى m.<\/td><td>يحلون فرديًا ثم يقارنون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">أخطاء شائعة<\/td><td>يناقش على السبورة الذكية نسيان تحويل الوحدات واستخدام مسافة ليست في اتجاه القوة.<\/td><td>يصححون أمثلة خاطئة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يقترحون أن القوة اللازمة أقل.<\/td><\/tr><tr><td class=\"tm\">16 د<\/td><td class=\"st\">النشاط 1-6 بذل شغل (كتاب الطالب)<\/td><td>يوجه إلى رفع ثقل رأسيًا مسافة محددة بالميزان، ثم سحبه على لوح مائل إلى الارتفاع نفسه.<\/td><td>يقيسون القوة والمسافة في الحالتين ويحسبون الشغل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 3-6 قياس الشغل المبذول (كتاب النشاط ص 56)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يربط النتائج بفكرة المنحدر.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة W = Fd ووحداتها\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون ثم يحسبون لاحقًا.\n\n(12 دقيقة) العلاقة والوحدات\nدور المعلم: يقدم W = F × d ويوضح أن 1 J = 1 N × 1 m، ويحل مثالًا من كتاب الطالب ص 73.\nدور الطالب: يحلون سؤال التهيئة: 100 J مقابل 150 J.\n\n(13 دقيقة) مسائل متدرجة (الأسئلة 3-6 إلى 5-6)\nدور المعلم: يعرض مسائل لحساب W ثم F ثم d مع تحويل cm إلى m.\nدور الطالب: يحلون فرديًا ثم يقارنون.\n\n(5 دقائق) أخطاء شائعة\nدور المعلم: يناقش على السبورة الذكية نسيان تحويل الوحدات واستخدام مسافة ليست في اتجاه القوة.\nدور الطالب: يصححون أمثلة خاطئة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: قياس الشغل المبذول عمليًا\n(4 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يقترحون أن القوة اللازمة أقل.\n\n(16 دقيقة) النشاط 1-6 بذل شغل (كتاب الطالب)\nدور المعلم: يوجه إلى رفع ثقل رأسيًا مسافة محددة بالميزان، ثم سحبه على لوح مائل إلى الارتفاع نفسه.\nدور الطالب: يقيسون القوة والمسافة في الحالتين ويحسبون الشغل.\n\n(8 دقائق) تمرين 3-6 قياس الشغل المبذول (كتاب النشاط ص 56)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يربط النتائج بفكرة المنحدر.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>احسب الشغل المبذول لدفع صندوق بقوة 25 N مسافة 4 m.<\/td><td><bdi>W = 25 × 4 = 100 J<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>بُذل شغل 600 J لرفع جسم مسافة 3 m. احسب القوة.<\/td><td><bdi>F = 600 ÷ 3 = 200 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سُحبت عربة بقوة 50 N مسافة 80 cm. احسب الشغل بالجول.<\/td><td><bdi>d = 0.8 m<\/bdi>، <bdi>W = 50 × 0.8 = 40 J<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الكميتان اللتان يجب قياسهما لحساب الشغل في النشاط؟<\/td><td>القوة بالميزان النابض، والمسافة المقطوعة في اتجاهها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رُفع ثقل 5 N رأسيًا 0.3 m، ثم سُحب على لوح مائل بقوة 2 N مسافة 0.9 m. احسب الشغل في الحالتين.<\/td><td>رأسيًا 1.5 J، وعلى اللوح 1.8 J.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا كان الشغل على اللوح المائل أكبر قليلًا مع أن القوة أقل؟<\/td><td>بسبب الاحتكاك بين الجسم واللوح؛ فجزء من الطاقة يتحول إلى حرارة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة W = Fd ووحداتها\n1) [مستوى الدعم] احسب الشغل المبذول لدفع صندوق بقوة 25 N مسافة 4 m.\nالإجابة النموذجية: W = 25 × 4 = 100 J.\n\n2) [المستوى المتوقع] بُذل شغل 600 J لرفع جسم مسافة 3 m. احسب القوة.\nالإجابة النموذجية: F = 600 ÷ 3 = 200 N.\n\n3) [المستوى المتقدم] سُحبت عربة بقوة 50 N مسافة 80 cm. احسب الشغل بالجول.\nالإجابة النموذجية: d = 0.8 m، W = 50 × 0.8 = 40 J.\n\nالحصة 2: قياس الشغل المبذول عمليًا\n1) [مستوى الدعم] ما الكميتان اللتان يجب قياسهما لحساب الشغل في النشاط؟\nالإجابة النموذجية: القوة بالميزان النابض، والمسافة المقطوعة في اتجاهها.\n\n2) [المستوى المتوقع] رُفع ثقل 5 N رأسيًا 0.3 m، ثم سُحب على لوح مائل بقوة 2 N مسافة 0.9 m. احسب الشغل في الحالتين.\nالإجابة النموذجية: رأسيًا 1.5 J، وعلى اللوح 1.8 J.\n\n3) [المستوى المتقدم] لماذا كان الشغل على اللوح المائل أكبر قليلًا مع أن القوة أقل؟\nالإجابة النموذجية: بسبب الاحتكاك بين الجسم واللوح؛ فجزء من الطاقة يتحول إلى حرارة."},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: <bdi>1 J = 1 N × 1 m<\/bdi>.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رافعة بذلت 2000 J لرفع حمولة 500 N. ما الارتفاع؟<\/td><td><bdi>d = 2000 ÷ 500 = 4 m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رفع عامل 20 صندوقًا وزن كل منها 150 N إلى رف ارتفاعه 1.2 m. احسب الشغل الكلي والطاقة المنقولة.<\/td><td>لكل صندوق 180 J، والكلي 3600 J، والطاقة المنقولة 3600 J.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: على المنحدر تقل ......... اللازمة لكن تزداد المسافة.<\/td><td>القوة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رفع طالب ثقلًا 10 N إلى ارتفاع 0.5 m. احسب الطاقة المنقولة.<\/td><td>5 J.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لجعل الشغل على اللوح المائل أقرب إلى الشغل الرأسي.<\/td><td>تقليل الاحتكاك بصقل السطح أو استخدام عربة بعجلات.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة W = Fd ووحداتها\n1) [مستوى الدعم] صواب أم خطأ: 1 J = 1 N × 1 m.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] رافعة بذلت 2000 J لرفع حمولة 500 N. ما الارتفاع؟\nالإجابة النموذجية: d = 2000 ÷ 500 = 4 m.\n\n3) [المستوى المتقدم] رفع عامل 20 صندوقًا وزن كل منها 150 N إلى رف ارتفاعه 1.2 m. احسب الشغل الكلي والطاقة المنقولة.\nالإجابة النموذجية: لكل صندوق 180 J، والكلي 3600 J، والطاقة المنقولة 3600 J.\n\nالحصة 2: قياس الشغل المبذول عمليًا\n1) [مستوى الدعم] أكمل: على المنحدر تقل ......... اللازمة لكن تزداد المسافة.\nالإجابة النموذجية: القوة.\n\n2) [المستوى المتوقع] رفع طالب ثقلًا 10 N إلى ارتفاع 0.5 m. احسب الطاقة المنقولة.\nالإجابة النموذجية: 5 J.\n\n3) [المستوى المتقدم] اقترح طريقة لجعل الشغل على اللوح المائل أقرب إلى الشغل الرأسي.\nالإجابة النموذجية: تقليل الاحتكاك بصقل السطح أو استخدام عربة بعجلات."},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>W = Fd<\/bdi> ووحداتها<\/div><p>مراجعة كتاب الطالب ص 73–74 والإجابة عن الأسئلة 3-6 إلى 5-6، وحل تمرين 2-6 حساب شغل مبذول في كتاب النشاط ص 54–55.<\/p><div class=\"psub\">الحصة 2: قياس الشغل المبذول عمليًا<\/div><p>إكمال تمرين 3-6 قياس الشغل المبذول في كتاب النشاط ص 56، والإجابة عن السؤالين 6-6 و7-6 في كتاب الطالب ص 75.<\/p>","t":"الحصة 1: العلاقة W = Fd ووحداتها\nمراجعة كتاب الطالب ص 73–74 والإجابة عن الأسئلة 3-6 إلى 5-6، وحل تمرين 2-6 حساب شغل مبذول في كتاب النشاط ص 54–55.\n\nالحصة 2: قياس الشغل المبذول عمليًا\nإكمال تمرين 3-6 قياس الشغل المبذول في كتاب النشاط ص 56، والإجابة عن السؤالين 6-6 و7-6 في كتاب الطالب ص 75."}]}},{"label":"3-6 القدرة","unit":"الوحدة السادسة: الشغل والقدرة","periods":[{"n":1,"focus":"القدرة وحسابها","info":"<div><b>الدرس:<\/b> 3-6 القدرة<\/div><div><b>الوحدة:<\/b> الوحدة السادسة: الشغل والقدرة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 76–78 | كتاب النشاط: تمرين 4-6 ص 57–58، ورقة العمل 1-6 ص 59–60<\/div><div><b>دليل المعلم:<\/b> ص 78<\/div><div><b>محور الحصة:<\/b> القدرة وحسابها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن.<\/li><li>يستخدم العلاقة <bdi>P = W/t = ΔE/t<\/bdi> في أنظمة بسيطة بما فيها الدوائر الكهربائية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن قدرات أشخاص أو أجهزة تنجز الشغل نفسه في أزمنة مختلفة.<\/div>","t":"1. يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن.\n2. يستخدم العلاقة P = W/t = ΔE/t في أنظمة بسيطة بما فيها الدوائر الكهربائية.\nمخرج تعليمي آخر: يقارن قدرات أشخاص أو أجهزة تنجز الشغل نفسه في أزمنة مختلفة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخدم العلاقة <bdi>P = W/t = ΔE/t<\/bdi> في أنظمة بسيطة بما فيها الدوائر الكهربائية.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن قدرات أشخاص أو أجهزة تنجز الشغل نفسه في أزمنة مختلفة.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن. ← فهم\n• يستخدم العلاقة P = W/t = ΔE/t في أنظمة بسيطة بما فيها الدوائر الكهربائية. ← تطبيق\n• يقارن قدرات أشخاص أو أجهزة تنجز الشغل نفسه في أزمنة مختلفة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: ساعة إيقاف، شريط قياس، ميزان لقياس الوزن<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: ساعة إيقاف، شريط قياس، ميزان لقياس الوزن"},{"h":"<div class=\"pills\"><span>القدرة<\/span><span>الواط<\/span><span>الشغل<\/span><span>الزمن<\/span><span><bdi>P = W/t<\/bdi><\/span><\/div>","t":"القدرة، الواط، الشغل، الزمن، P = W/t"},{"h":"<p>طالبان بالوزن نفسه يصعدان الدرج نفسه، أحدهما بسرعة والآخر ببطء. هل بذلا الشغل نفسه؟ ما الذي اختلف؟<\/p>","t":"طالبان بالوزن نفسه يصعدان الدرج نفسه، أحدهما بسرعة والآخر ببطء. هل بذلا الشغل نفسه؟ ما الذي اختلف؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يستنتجون اختلاف سرعة إنجاز الشغل.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">مفهوم القدرة<\/td><td>يقدم <bdi>P = W ÷ t<\/bdi> ووحدة الواط <bdi>(1 W = 1 J/s)<\/bdi>، ويربطها بالقدرة الكهربائية <bdi>P = IV<\/bdi>.<\/td><td>يدونون العلاقات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">قدرة صعود الدرج<\/td><td>يقيس زمن صعود متطوعين لدرج معلوم الارتفاع مشيًا سريعًا آمنًا دون تدافع.<\/td><td>يحسبون الشغل = الوزن × الارتفاع، والقدرة = الشغل ÷ الزمن، ويقارنون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يستنتجون اختلاف سرعة إنجاز الشغل.\n\n(10 دقائق) مفهوم القدرة\nدور المعلم: يقدم P = W ÷ t ووحدة الواط (1 W = 1 J/s)، ويربطها بالقدرة الكهربائية P = IV.\nدور الطالب: يدونون العلاقات.\n\n(12 دقيقة) قدرة صعود الدرج\nدور المعلم: يقيس زمن صعود متطوعين لدرج معلوم الارتفاع مشيًا سريعًا آمنًا دون تدافع.\nدور الطالب: يحسبون الشغل = الوزن × الارتفاع، والقدرة = الشغل ÷ الزمن، ويقارنون.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس القدرة؟<\/td><td>الواط (W) ويساوي جولًا في الثانية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>محرك بذل 3000 J في 15 s. احسب قدرته.<\/td><td><bdi>P = 3000 ÷ 15 = 200 W<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>طالب وزنه 500 N صعد درجًا ارتفاعه 4 m في 8 s. احسب قدرته.<\/td><td><bdi>W = 2000 J<\/bdi>، <bdi>P = 2000 ÷ 8 = 250 W<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وحدة قياس القدرة؟\nالإجابة النموذجية: الواط (W) ويساوي جولًا في الثانية.\n\n2) [المستوى المتوقع] محرك بذل 3000 J في 15 s. احسب قدرته.\nالإجابة النموذجية: P = 3000 ÷ 15 = 200 W.\n\n3) [المستوى المتقدم] طالب وزنه 500 N صعد درجًا ارتفاعه 4 m في 8 s. احسب قدرته.\nالإجابة النموذجية: W = 2000 J، P = 2000 ÷ 8 = 250 W."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: القدرة هي ......... في وحدة الزمن.<\/td><td>الشغل المبذول (الطاقة المنقولة).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>مصباح قدرته 60 W. كم جولًا ينقل في دقيقة؟<\/td><td><bdi>60 × 60 = 3600 J<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>رافعتان رفعتا الحمل نفسه إلى الارتفاع نفسه، الأولى في 20 s والثانية في 30 s. قارن شغليهما وقدرتيهما.<\/td><td>الشغل متساوٍ، وقدرة الأولى أكبر (1.5 مرة) لأنها أنجزت الشغل في زمن أقل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: القدرة هي ......... في وحدة الزمن.\nالإجابة النموذجية: الشغل المبذول (الطاقة المنقولة).\n\n2) [المستوى المتوقع] مصباح قدرته 60 W. كم جولًا ينقل في دقيقة؟\nالإجابة النموذجية: 60 × 60 = 3600 J.\n\n3) [المستوى المتقدم] رافعتان رفعتا الحمل نفسه إلى الارتفاع نفسه، الأولى في 20 s والثانية في 30 s. قارن شغليهما وقدرتيهما.\nالإجابة النموذجية: الشغل متساوٍ، وقدرة الأولى أكبر (1.5 مرة) لأنها أنجزت الشغل في زمن أقل."},{"h":"<p>حل تمرين 4-6 القدرة وورقة العمل 1-6 حساب الشغل والقدرة في كتاب النشاط ص 57–60، والإجابة عن الأسئلة 8-6 إلى 11-6 وأسئلة نهاية الوحدة السادسة في كتاب الطالب.<\/p>","t":"حل تمرين 4-6 القدرة وورقة العمل 1-6 حساب الشغل والقدرة في كتاب النشاط ص 57–60، والإجابة عن الأسئلة 8-6 إلى 11-6 وأسئلة نهاية الوحدة السادسة في كتاب الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-6 القدرة<\/div><div><b>الوحدة:<\/b> الوحدة السادسة: الشغل والقدرة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 76–78 | كتاب النشاط: تمرين 4-6 ص 57–58، ورقة العمل 1-6 ص 59–60<\/div><div><b>دليل المعلم:<\/b> ص 78<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: القدرة وحسابها<\/div><ol class=\"ol\"><li>يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن.<\/li><li>يستخدم العلاقة <bdi>P = W/t = ΔE/t<\/bdi> في أنظمة بسيطة بما فيها الدوائر الكهربائية.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن قدرات أشخاص أو أجهزة تنجز الشغل نفسه في أزمنة مختلفة.<\/div>","t":"الحصة 1: القدرة وحسابها\n1. يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن.\n2. يستخدم العلاقة P = W/t = ΔE/t في أنظمة بسيطة بما فيها الدوائر الكهربائية.\nمخرج تعليمي آخر: يقارن قدرات أشخاص أو أجهزة تنجز الشغل نفسه في أزمنة مختلفة."},{"h":"<div class=\"psub\">الحصة 1: القدرة وحسابها<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعرّف القدرة بأنها الشغل المبذول في وحدة الزمن.<\/td><td class=\"lv\">فهم<\/td><\/t ":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: إسفنج أو صلصال، كتاب، مسامير بأطراف مختلفة، صندوق رمل"},{"h":"<div class=\"pills\"><span>الضغط<\/span><span>القوة العمودية<\/span><span>المساحة<\/span><span>توزيع القوة<\/span><\/div>","t":"الضغط، القوة العمودية، المساحة، توزيع القوة"},{"h":"<p>سؤال: لماذا يغوص الكعب الرفيع في الرمل بينما لا يغوص الحذاء الرياضي العريض؟<\/p>","t":"سؤال: لماذا يغوص الكعب الرفيع في الرمل بينما لا يغوص الحذاء الرياضي العريض؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويعرض صورًا على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">استكشاف عملي<\/td><td>يوجه إلى وضع كتاب على الإسفنج مرة على وجهه العريض ومرة على حافته.<\/td><td>يقيسون عمق الانغماس ويستنتجون أثر المساحة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تطبيقات (كتاب الطالب ص 79)<\/td><td>يناقش أمثلة: حذاء الثلج، والسكين الحادة، والإبرة، وإطارات الجرارات، وأساسات المباني.<\/td><td>يصنفونها إلى «زيادة الضغط» و«تقليل الضغط».<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تمرين 1-7 الضغط – الجزء الأول (كتاب النشاط ص 61)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويعرض صورًا على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) استكشاف عملي\nدور المعلم: يوجه إلى وضع كتاب على الإسفنج مرة على وجهه العريض ومرة على حافته.\nدور الطالب: يقيسون عمق الانغماس ويستنتجون أثر المساحة.\n\n(10 دقائق) تطبيقات (كتاب الطالب ص 79)\nدور المعلم: يناقش أمثلة: حذاء الثلج، والسكين الحادة، والإبرة، وإطارات الجرارات، وأساسات المباني.\nدور الطالب: يصنفونها إلى «زيادة الضغط» و«تقليل الضغط».\n\n(7 دقائق) تمرين 1-7 الضغط – الجزء الأول (كتاب النشاط ص 61)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>على ماذا يعتمد الضغط؟<\/td><td>على مقدار القوة العمودية ومساحة السطح الذي تؤثر فيه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُصنع حواف السكاكين رفيعة؟<\/td><td>لتقليل المساحة فيزداد الضغط فتقطع بسهولة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تكون إطارات الجرارات الزراعية عريضة؟<\/td><td>لزيادة مساحة التلامس مع التربة فيقل الضغط فلا تغوص في التربة الطرية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] على ماذا يعتمد الضغط؟\nالإجابة النموذجية: على مقدار القوة العمودية ومساحة السطح الذي تؤثر فيه.\n\n2) [المستوى المتوقع] لماذا تُصنع حواف السكاكين رفيعة؟\nالإجابة النموذجية: لتقليل المساحة فيزداد الضغط فتقطع بسهولة.\n\n3) [المستوى المتقدم] لماذا تكون إطارات الجرارات الزراعية عريضة؟\nالإجابة النموذجية: لزيادة مساحة التلامس مع التربة فيقل الضغط فلا تغوص في التربة الطرية."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: زيادة المساحة مع ثبات القوة تزيد الضغط.<\/td><td>خطأ؛ تقلل الضغط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مثالًا نحتاج فيه إلى ضغط كبير ومثالًا نحتاج فيه إلى ضغط صغير.<\/td><td>كبير: رأس المسمار أو الإبرة. صغير: حذاء الثلج أو أساسات المباني.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح تصميمًا لحمالة حقيبة ظهر يقلل الألم على الكتفين وفسّره.<\/td><td>أحزمة عريضة مبطنة؛ تزيد المساحة فيقل الضغط على الكتفين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: زيادة المساحة مع ثبات القوة تزيد الضغط.\nالإجابة النموذجية: خطأ؛ تقلل الضغط.\n\n2) [المستوى المتوقع] اذكر مثالًا نحتاج فيه إلى ضغط كبير ومثالًا نحتاج فيه إلى ضغط صغير.\nالإجابة النموذجية: كبير: رأس المسمار أو الإبرة. صغير: حذاء الثلج أو أساسات المباني.\n\n3) [المستوى المتقدم] اقترح تصميمًا لحمالة حقيبة ظهر يقلل الألم على الكتفين وفسّره.\nالإجابة النموذجية: أحزمة عريضة مبطنة؛ تزيد المساحة فيقل الضغط على الكتفين."},{"h":"<p>مراجعة كتاب الطالب ص 79 والإجابة عن السؤالين 1-7 و2-7، وملاحظة ثلاثة أمثلة منزلية على زيادة الضغط أو تقليله.<\/p>","t":"مراجعة كتاب الطالب ص 79 والإجابة عن السؤالين 1-7 و2-7، وملاحظة ثلاثة أمثلة منزلية على زيادة الضغط أو تقليله."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-7 الضغط على سطح<\/div><div><b>الوحدة:<\/b> الوحدة السابعة: الضغط<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني عشر (22–26/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 79 | كتاب النشاط: تمرين 1-7 ص 61–62<\/div><div><b>دليل المعلم:<\/b> ص 88<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة<\/div><ol class=\"ol\"><li>يربط الضغط بالقوة والمساحة باستخدام أمثلة مناسبة.<\/li><li>يفسر لماذا يقل الضغط بزيادة المساحة ويزداد بنقصانها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح تصميمات تزيد الضغط أو تقلله بحسب الحاجة.<\/div>","t":"الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة\n1. يربط الضغط بالقوة والمساحة باستخدام أمثلة مناسبة.\n2. يفسر لماذا يقل الضغط بزيادة المساحة ويزداد بنقصانها.\nمخرج تعليمي آخر: يقترح تصميمات تزيد الضغط أو تقلله بحسب الحاجة."},{"h":"<div class=\"psub\">الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يربط الضغط بالقوة والمساحة باستخدام أمثلة مناسبة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر لماذا يقل الضغط بزيادة المساحة ويزداد بنقصانها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح تصميمات تزيد الضغط أو تقلله بحسب الحاجة.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة\n• يربط الضغط بالقوة والمساحة باستخدام أمثلة مناسبة. ← فهم\n• يفسر لماذا يقل الضغط بزيادة المساحة تنتجون أثر المساحة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تطبيقات (كتاب الطالب ص 79)<\/td><td>يناقش أمثلة: حذاء الثلج، والسكين الحادة، والإبرة، وإطارات الجرارات، وأساسات المباني.<\/td><td>يصنفونها إلى «زيادة الضغط» و«تقليل الضغط».<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تمرين 1-7 الضغط – الجزء الأول (كتاب النشاط ص 61)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويعرض صورًا على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(13 دقيقة) استكشاف عملي\nدور المعلم: يوجه إلى وضع كتاب على الإسفنج مرة على وجهه العريض ومرة على حافته.\nدور الطالب: يقيسون عمق الانغماس ويستنتجون أثر المساحة.\n\n(10 دقائق) تطبيقات (كتاب الطالب ص 79)\nدور المعلم: يناقش أمثلة: حذاء الثلج، والسكين الحادة، والإبرة، وإطارات الجرارات، وأساسات المباني.\nدور الطالب: يصنفونها إلى «زيادة الضغط» و«تقليل الضغط».\n\n(7 دقائق) تمرين 1-7 الضغط – الجزء الأول (كتاب النشاط ص 61)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>على ماذا يعتمد الضغط؟<\/td><td>على مقدار القوة العمودية ومساحة السطح الذي تؤثر فيه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُصنع حواف السكاكين رفيعة؟<\/td><td>لتقليل المساحة فيزداد الضغط فتقطع بسهولة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تكون إطارات الجرارات الزراعية عريضة؟<\/td><td>لزيادة مساحة التلامس مع التربة فيقل الضغط فلا تغوص في التربة الطرية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة\n1) [مستوى الدعم] على ماذا يعتمد الضغط؟\nالإجابة النموذجية: على مقدار القوة العمودية ومساحة السطح الذي تؤثر فيه.\n\n2) [المستوى المتوقع] لماذا تُصنع حواف السكاكين رفيعة؟\nالإجابة النموذجية: لتقليل المساحة فيزداد الضغط فتقطع بسهولة.\n\n3) [المستوى المتقدم] لماذا تكون إطارات الجرارات الزراعية عريضة؟\nالإجابة النموذجية: لزيادة مساحة التلامس مع التربة فيقل الضغط فلا تغوص في التربة الطرية."},{"h":"<div class=\"psub\">الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: زيادة المساحة مع ثبات القوة تزيد الضغط.<\/td><td>خطأ؛ تقلل الضغط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر مثالًا نحتاج فيه إلى ضغط كبير ومثالًا نحتاج فيه إلى ضغط صغير.<\/td><td>كبير: رأس المسمار أو الإبرة. صغير: حذاء الثلج أو أساسات المباني.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح تصميمًا لحمالة حقيبة ظهر يقلل الألم على الكتفين وفسّره.<\/td><td>أحزمة عريضة مبطنة؛ تزيد المساحة فيقل الضغط على الكتفين.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة\n1) [مستوى الدعم] صواب أم خطأ: زيادة المساحة مع ثبات القوة تزيد الضغط.\nالإجابة النموذجية: خطأ؛ تقلل الضغط.\n\n2) [المستوى المتوقع] اذكر مثالًا نحتاج فيه إلى ضغط كبير ومثالًا نحتاج فيه إلى ضغط صغير.\nالإجابة النموذجية: كبير: رأس المسمار أو الإبرة. صغير: حذاء الثلج أو أساسات المباني.\n\n3) [المستوى المتقدم] اقترح تصميمًا لحمالة حقيبة ظهر يقلل الألم على الكتفين وفسّره.\nالإجابة النموذجية: أحزمة عريضة مبطنة؛ تزيد المساحة فيقل الضغط على الكتفين."},{"h":"<div class=\"psub\">الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة<\/div><p>مراجعة كتاب الطالب ص 79 والإجابة عن السؤالين 1-7 و2-7، وملاحظة ثلاثة أمثلة منزلية على زيادة الضغط أو تقليله.<\/p>","t":"الحصة 1: العلاقة النوعية بين الضغط والقوة والمساحة\nمراجعة كتاب الطالب ص 79 والإجابة عن السؤالين 1-7 و2-7، وملاحظة ثلاثة أمثلة منزلية على زيادة الضغط أو تقليله."}]}},{"label":"2-7 حساب الضغط","unit":"الوحدة السابعة: الضغ ills\"><span>الضغط<\/span><span>الباسكال<\/span><span>N/m²<\/span><span>المساحة<\/span><span>الكيلوباسكال<\/span><\/div>","t":"الضغط، الباسكال، N/m²، المساحة، الكيلوباسكال"},{"h":"<p>يعرض المعلم قطعة على شكل متوازي مستطيلات وزنها 60 N ويسأل: على أي وجه نضعها لتحدث أكبر ضغط؟<\/p>","t":"يعرض المعلم قطعة على شكل متوازي مستطيلات وزنها 60 N ويسأل: على أي وجه نضعها لتحدث أكبر ضغط؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون الوجه الأصغر.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">العلاقة والوحدة<\/td><td>يقدم <bdi>P = F ÷ A<\/bdi> و <bdi>1 Pa = 1 N/m²<\/bdi>، ويحل مثالًا: 60 N على 0.02 m² يعطي 3000 Pa.<\/td><td>يدونون ويحسبون الضغط على الوجوه الأخرى.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مسائل (الأسئلة 3-7 إلى 6-7 في كتاب الطالب)<\/td><td>يعرض مسائل لإيجاد P وF وA مع تحويل cm² إلى <bdi>m² (1 m² = 10 000 cm²)<\/bdi>.<\/td><td>يحلون فرديًا.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على درسي الضغط.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون الوجه الأصغر.\n\n(10 دقائق) العلاقة والوحدة\nدور المعلم: يقدم P = F ÷ A و 1 Pa = 1 N/m²، ويحل مثالًا: 60 N على 0.02 m² يعطي 3000 Pa.\nدور الطالب: يدونون ويحسبون الضغط على الوجوه الأخرى.\n\n(12 دقيقة) مسائل (الأسئلة 3-7 إلى 6-7 في كتاب الطالب)\nدور المعلم: يعرض مسائل لإيجاد P وF وA مع تحويل cm² إلى m² (1 m² = 10 000 cm²).\nدور الطالب: يحلون فرديًا.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على درسي الضغط.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس الضغط؟<\/td><td>الباسكال (Pa) ويساوي N/m².<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قوة 200 N تؤثر على مساحة 0.4 m². احسب الضغط.<\/td><td><bdi>P = 200 ÷ 0.4 = 500 Pa<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>الضغط داخل إطار 250 kPa ومساحة التلامس 0.02 m². احسب القوة.<\/td><td><bdi>F = 250 000 × 0.02 = 5000 N<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وحدة قياس الضغط؟\nالإجابة النموذجية: الباسكال (Pa) ويساوي N/m².\n\n2) [المستوى المتوقع] قوة 200 N تؤثر على مساحة 0.4 m². احسب الضغط.\nالإجابة النموذجية: P = 200 ÷ 0.4 = 500 Pa.\n\n3) [المستوى المتقدم] الضغط داخل إطار 250 kPa ومساحة التلامس 0.02 m². احسب القوة.\nالإجابة النموذجية: F = 250 000 × 0.02 = 5000 N."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>1 Pa = 1<\/bdi> .........<\/td><td>N/m².<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>طالب وزنه 600 N يقف على مساحة 0.03 m². احسب ضغطه على الأرض.<\/td><td><bdi>P = 600 ÷ 0.03 = 20 000 Pa<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صندوق وزنه 120 N قاعدته <bdi>20 cm × 30 cm<\/bdi>. احسب الضغط بالباسكال.<\/td><td><bdi>A = 0.2 × 0.3 = 0.06 m²<\/bdi>، <bdi>P = 120 ÷ 0.06 = 2000 Pa<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: 1 Pa = 1 .........\nالإجابة النموذجية: N/m².\n\n2) [المستوى المتوقع] طالب وزنه 600 N يقف على مساحة 0.03 m². احسب ضغطه على الأرض.\nالإجابة النموذجية: P = 600 ÷ 0.03 = 20 000 Pa.\n\n3) [المستوى المتقدم] صندوق وزنه 120 N قاعدته 20 cm × 30 cm. احسب الضغط بالباسكال.\nالإجابة النموذجية: A = 0.2 × 0.3 = 0.06 m²، P = 120 ÷ 0.06 = 2000 Pa."},{"h":"<p>حل الأسئلة 3-7 إلى 6-7 وأسئلة نهاية الوحدة السابعة في كتاب الطالب ص 80–82، وإكمال تمرين 1-7 الضغط في كتاب النشاط ص 61–62.<\/ موذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: <bdi>1 Pa = 1<\/bdi> .........<\/td><td>N/m².<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>طالب وزنه 600 N يقف على مساحة 0.03 m². احسب ضغطه على الأرض.<\/td><td><bdi>P = 600 ÷ 0.03 = 20 000 Pa<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صندوق وزنه 120 N قاعدته <bdi>20 cm × 30 cm<\/bdi>. احسب الضغط بالباسكال.<\/td><td><bdi>A = 0.2 × 0.3 = 0.06 m²<\/bdi>، <bdi>P = 120 ÷ 0.06 = 2000 Pa<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة P = F/A ووحدة الباسكال\n1) [مستوى الدعم] أكمل: 1 Pa = 1 .........\nالإجابة النموذجية: N/m².\n\n2) [المستوى المتوقع] طالب وزنه 600 N يقف على مساحة 0.03 m². احسب ضغطه على الأرض.\nالإجابة النموذجية: P = 600 ÷ 0.03 = 20 000 Pa.\n\n3) [المستوى المتقدم] صندوق وزنه 120 N قاعدته 20 cm × 30 cm. احسب الضغط بالباسكال.\nالإجابة النموذجية: A = 0.2 × 0.3 = 0.06 m²، P = 120 ÷ 0.06 = 2000 Pa."},{"h":"<div class=\"psub\">الحصة 1: العلاقة <bdi>P = F/A<\/bdi> ووحدة الباسكال<\/div><p>حل الأسئلة 3-7 إلى 6-7 وأسئلة نهاية الوحدة السابعة في كتاب الطالب ص 80–82، وإكمال تمرين 1-7 الضغط في كتاب النشاط ص 61–62.<\/p>","t":"الحصة 1: العلاقة P = F/A ووحدة الباسكال\nحل الأسئلة 3-7 إلى 6-7 وأسئلة نهاية الوحدة السابعة في كتاب الطالب ص 80–82، وإكمال تمرين 1-7 الضغط في كتاب النشاط ص 61–62."}]}},{"label":"1-8 بنية النواة","unit":"الوحدة الثامنة: فيزياء النواة","periods":[{"n":1,"focus":"مكونات النواة والعدد الذري والكتلي والنظائر","info":"<div><b>الدرس:<\/b> 1-8 بنية النواة<\/div><div><b>الوحدة:<\/b> الوحدة الثامنة: فيزياء النواة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 83–87 | كتاب النشاط: تمرين 1-8 ص 63–64، تمرين 2-8 ص 65، ورقة العمل 1-8 ص 66–68<\/div><div><b>دليل المعلم:<\/b> ص 92<\/div><div><b>محور الحصة:<\/b> مكونات النواة والعدد الذري والكتلي والنظائر<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف مكونات النواة من بروتونات ونيوترونات.<\/li><li>يستخدم مصطلحي العدد الذري Z والعدد الكتلي A وصيغة النويدة.<\/li><li>يشرح مصطلح النظائر ويستخدمه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب عدد النيوترونات في نويدة من A وZ.<\/div>","t":"1. يصف مكونات النواة من بروتونات ونيوترونات.\n2. يستخدم مصطلحي العدد الذري Z والعدد الكتلي A وصيغة النويدة.\n3. يشرح مصطلح النظائر ويستخدمه.\nمخرج تعليمي آخر: يحسب عدد النيوترونات في نويدة من A وZ."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف مكونات النواة من بروتونات ونيوترونات.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستخدم مصطلحي العدد الذري Z والعدد الكتلي A وصيغة النويدة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يشرح مصطلح النظائر ويستخدمه.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحسب عدد النيوترونات في نويدة من A وZ.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يصف مكونات النواة من بروتونات ونيوترونات. ← فهم\n• يستخدم مصطلحي العدد الذري Z والعدد الكتلي A وصيغة النويدة. ← تطبيق\n• يشرح مصطلح النظائر ويستخدمه. ← فهم\n• يحسب عدد النيوترونات في نويدة من A وZ. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم بالاكتشاف<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم بالاكتشاف"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>نماذج مجسمة<\/span><span>عروض تقديمية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• نماذج مجسمة\n• عروض تقديمية"},{"h":"<div class=\"pills\"><span>النواة<\/span><span>البروتون<\/span><span>النيوترون<\/span><span>العدد الذري Z<\/span><span>العدد الكتلي A<\/span><span>النظائر<\/span><span>النويدة<\/span><\/div>","t":"النواة، البروتون، النيوترون، العدد الذري Z، العدد الكتلي A، النظائر، النويدة"},{"h":"<p>يعرض نموذجًا مجسمًا للذرة ويسأل: ما مكونات النواة؟ وما الذي يميز ذرة الكربون عن ذرة الأكسجين؟<\/p>","t":"يعرض نموذجًا مجسمًا للذرة ويسأل: ما مكونات النواة؟ وما الذي يميز ذرة الكربون عن ذرة الأكسجين؟"},{"h":"<div cla ة ²³₁₁Na: كم بروتونًا ونيوترونًا فيها؟<\/td><td>11 بروتونًا و 12 نيوترونًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>¹²₆C و¹⁴₆C نظيران. ما وجه الشبه والاختلاف بينهما؟<\/td><td>لهما العدد الذري نفسه (6 بروتونات) ويختلفان في عدد النيوترونات (6 و 8) والعدد الكتلي.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الجسيمات الموجودة في النواة؟\nالإجابة النموذجية: البروتونات والنيوترونات.\n\n2) [المستوى المتوقع] النويدة ²³₁₁Na: كم بروتونًا ونيوترونًا فيها؟\nالإجابة النموذجية: 11 بروتونًا و 12 نيوترونًا.\n\n3) [المستوى المتقدم] ¹²₆C و¹⁴₆C نظيران. ما وجه الشبه والاختلاف بينهما؟\nالإجابة النموذجية: لهما العدد الذري نفسه (6 بروتونات) ويختلفان في عدد النيوترونات (6 و 8) والعدد الكتلي."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: العدد الكتلي A هو عدد ......... في النواة.<\/td><td>البروتونات والنيوترونات معًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عرّف النظائر.<\/td><td>ذرات للعنصر نفسه لها العدد الذري نفسه وتختلف في العدد الكتلي (عدد النيوترونات).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة فيها 92 بروتونًا و146 نيوترونًا ورمز عنصرها U. اكتب صيغتها، وحدد العدد الكتلي لنظير فيه 143 نيوترونًا.<\/td><td>²³⁸₉₂U؛ والنظير <bdi>²³⁵₉₂U (A = 235)<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: العدد الكتلي A هو عدد ......... في النواة.\nالإجابة النموذجية: البروتونات والنيوترونات معًا.\n\n2) [المستوى المتوقع] عرّف النظائر.\nالإجابة النموذجية: ذرات للعنصر نفسه لها العدد الذري نفسه وتختلف في العدد الكتلي (عدد النيوترونات).\n\n3) [المستوى المتقدم] نواة فيها 92 بروتونًا و146 نيوترونًا ورمز عنصرها U. اكتب صيغتها، وحدد العدد الكتلي لنظير فيه 143 نيوترونًا.\nالإجابة النموذجية: ²³⁸₉₂U؛ والنظير ²³⁵₉₂U (A = 235)."},{"h":"<p>مراجعة كتاب الطالب ص 83–87 والإجابة عن الأسئلة 1-8 إلى 6-8، وحل تمريني 1-8 و2-8 وورقة العمل 1-8 بنية النواة في كتاب النشاط ص 63–68.<\/p>","t":"مراجعة كتاب الطالب ص 83–87 والإجابة ئي<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: مكعبات نرد لمحاكاة الاضمحلال العشوائي"},{"h":"<div class=\"pills\"><span>النشاط الإشعاعي<\/span><span>الاضمحلال العشوائي<\/span><span>إشعاع الخلفية<\/span><span>غاز الرادون<\/span><span>الأشعة الكونية<\/span><span>عداد جايجر<\/span><\/div>","t":"النشاط الإشعاعي، الاضمحلال العشوائي، إشعاع الخلفية، غاز الرادون، الأشعة الكونية، عداد جايجر"},{"h":"<p>لعبة النرد: يرمي كل طالب نردًا، ومن يحصل على 6 «تضمحل نواته» ويجلس. هل يمكن معرفة من سيجلس في الجولة القادمة؟<\/p>","t":"لعبة النرد: يرمي كل طالب نردًا، ومن يحصل على 6 «تضمحل نواته» ويجلس. هل يمكن معرفة من سيجلس في الجولة القادمة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التهيئة: محاكاة العشوائية<\/td><td>يدير لعبة النرد لعدة جولات ويسجل عدد «النوى» المتبقية.<\/td><td>يلاحظون أنه لا يمكن التنبؤ بالنواة التي ستضمحل، لكن العدد يتناقص بنمط.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">العشوائية<\/td><td>يربط اللعبة بالاضمحلال: لا يمكن التنبؤ بموعد اضمحلال نواة بعينها، ولا يتأثر بالحرارة أو التفاعلات الكيميائية.<\/td><td>يكتبون تعريفًا للعشوائية بلغتهم.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">إشعاع الخلفية (كتاب الطالب ص 88–92)<\/td><td>يعرض مصادره: الرادون من الصخور والتربة، والأشعة الكونية، والغذاء، والمصادر الطبية، ومقطعًا لعداد جايجر يسجل قراءات دون مصدر.<\/td><td>يرسمون مخططًا تقريبيًا للمصادر ويميزون الطبيعي من الصناعي.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الأسئلة 1-9 إلى 3-9<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(8 دقائق) التهيئة: محاكاة العشوائية\nدور المعلم: يدير لعبة النرد لعدة جولات ويسجل عدد «النوى» المتبقية.\nدور الطالب: يلاحظون أنه لا يمكن التنبؤ بالنواة التي ستضمحل، لكن العدد يتناقص بنمط.\n\n(10 دقائق) العشوائية\nدور المعلم: يربط اللعبة بالاضمحلال: لا يمكن التنبؤ بموعد اضمحلال نواة بعينها، ولا يتأثر بالحرارة أو التفاعلات الكيميائية.\nدور الطالب: يكتبون تعريفًا للعشوائية بلغتهم.\n\n(12 دقيقة) إشعاع الخلفية (كتاب الطالب ص 88–92)\nدور المعلم: يعرض مصادره: الرادون من الصخور والتربة، والأشعة الكونية، والغذاء، والمصادر الطبية، ومقطعًا لعداد جايجر يسجل قراءات دون مصدر.\nدور الطالب: يرسمون مخططًا تقريبيًا للمصادر ويميزون الطبيعي من الصناعي.\n\n(5 دقائق) الأسئلة 1-9 إلى 3-9\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بإشعاع الخلفية؟<\/td><td>الإشعاع الموجود حولنا دائمًا من مصادر طبيعية وصناعية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر ثلاثة مصادر لإشعاع الخلفية.<\/td><td>غاز الرادون، والأشعة الكونية، والصخور والتربة، والغذاء، والفحوص الطبية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سجل عداد 20 عدة/دقيقة دون مصدر و180 عدة/دقيقة قرب مصدر. ما القراءة الحقيقية للمصدر؟ ولماذا؟<\/td><td>160 عدة/دقيقة؛ لأننا نطرح إشعاع الخلفية الموجود دائمًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بإشعاع الخلفية؟\nالإجابة النموذجية: الإشعاع الموجود حولنا دائمًا من مصادر طبيعية وصناعية.\n\n2) [المستوى المتوقع] اذكر ثلاثة مصادر لإشعاع الخلفية.\nالإجابة النموذجية: غاز الرادون، والأشعة الكونية، والصخور والتربة، والغذاء، والفحوص الطبية.\n\n3) [المستوى المتقدم] سجل عداد 20 عدة/دقيقة دون مصدر و180 عدة/دقيقة قرب مصدر. ما القراءة الحقيقية للمصدر؟ ولماذا؟\nالإجابة النموذجية: 160 عدة/دقيقة؛ لأننا نطرح إشعاع الخلفية الموجود دائمًا."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن تسريع الاضمحلال الإشعاعي بتسخين المادة.<\/td><td>خطأ؛ الاضمحلال عشوائي ولا يتأثر بالظروف الفيزيائية أو الكيميائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما المصدر الطبيعي الأكبر لإشعاع الخلفية غالبًا؟<\/td><td>غاز الرادون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تختلف قراءات العداد قليلًا عند تكرار القياس للمصدر نفسه في المدة نفسها؟<\/td><td>بسبب الطبيعة العشوائية للاضمحلال؛ فعدد النوى التي تضمحل في كل فترة يتغير عشوائيًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يمكن تسريع الاضمحلال الإشعاعي بتسخين المادة.\nالإجابة النموذجية: خطأ؛ الاضمحلال عشوائي ولا يتأثر بالظروف الفيزيائية أو الكيميائية.\n\n2) [المستوى المتوقع] ما المصدر الطبيعي الأكبر لإشعاع الخلفية غالبًا؟\nالإجابة النموذجية: غاز الرادون.\n\n3) [المستوى المتقدم] لماذا تختلف قراءات العداد قليلًا عند تكرار القياس للمصدر نفسه في المدة نفسها؟\nالإجابة النموذجية: بسبب الطبيعة العشوائية للاضمحلال؛ فعدد النوى التي تضمحل في كل فترة يتغير عشوائيًا."},{"h":"<p>مراجعة كتاب الطالب ص 88–92 والإجابة عن الأسئلة 1-9 إلى 5-9، وكتابة تقرير مبسط عن اختلاف إشعاع الخلفية من مكان إلى آخر.<\/p>","t":"مراجعة كتاب الطالب ص 88–92 والإجابة عن الأسئلة 1-9 إلى 5-9، وكتابة تقرير مبسط عن اختلاف إشعاع الخلفية من مكان إلى آخر."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-9 النشاط الإشعاعي في كل مكان<\/div><div><b>الوحدة:<\/b> الوحدة التاسعة: النشاط الإشعاعي<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 88–92 | كتاب النشاط: لا يوجد تمرين مخصص<\/div><div><b>دليل المعلم:<\/b> ص 97<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الطبيعة العشوائية للاضمحلال وإشعاع الخلفية<\/div><ol class=\"ol\"><li>يصف الطبيعة العشوائية للانبعاثات الإشعاعية.<\/li><li>يفهم مصطلح إشعاع الخلفية ويذكر مصادره.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر سبب طرح قراءة إشعاع الخلفية من قراءات العداد عند قياس نشاط مصدر.<\/div>","t":"الحصة 1: الطبيعة العشوائية للاضمحلال وإشعاع الخلفية\n1. يصف الطبيعة العشوائية ل اط: تمرين 1-9 ص 69–70، تمرين 2-9 ص 71<\/div><div><b>دليل المعلم:<\/b> ص 98–99<\/div><div><b>محور الحصة:<\/b> إشعاعات ألفا وبيتا وجاما وخصائصها واستخداماتها<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد انبعاثات ألفا وبيتا وجاما من حيث تكوينها وقدرتها المؤينة وقدرتها على الاختراق.<\/li><li>يصف انحراف α وβ وγ في المجالين الكهربائي والمغناطيسي وطرق الكشف عنها.<\/li><li>يصف أمثلة على التطبيقات العملية لانبعاثات α وβ وγ ويشرحها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يذكر أن التأين هو فقد الذرة المتعادلة إلكترونات أو اكتسابها.<\/div>","t":"1. يحدد انبعاثات ألفا وبيتا وجاما من حيث تكوينها وقدرتها المؤينة وقدرتها على الاختراق.\n2. يصف انحراف α وβ وγ في المجالين الكهربائي والمغناطيسي وطرق الكشف عنها.\n3. يصف أمثلة على التطبيقات العملية لانبعاثات α وβ وγ ويشرحها.\nمخرج تعليمي آخر: يذكر أن التأين هو فقد الذرة المتعادلة إلكترونات أو اكتسابها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد انبعاثات ألفا وبيتا وجاما من حيث تكوينها وقدرتها المؤينة وقدرتها على الاختراق.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف انحراف α وβ وγ في المجالين الكهربائي والمغناطيسي وطرق الكشف عنها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف أمثلة على التطبيقات العملية لانبعاثات α وβ وγ ويشرحها.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر أن التأين هو فقد الذرة المتعادلة إلكترونات أو اكتسابها.<\/td><td class=\"lv\">تذكر<\/td><\/tr><\/tbody><\/table>","t":"• يحدد انبعاثات ألفا وبيتا وجاما من حيث تكوينها وقدرتها المؤينة وقدرتها على الاختراق. ← تذكر\n• يصف انحراف α وβ وγ في المجالين الكهربائي والمغناطيسي وطرق الكشف عنها. ← فهم\n• يصف أمثلة على التطبيقات العملية لانبعاثات α وβ وγ ويشرحها. ← فهم\n• يذكر أن التأين هو فقد الذرة المتعادلة إلكترونات أو اكتسابها. ← تذكر"},{"h":"<div class=\"pills\"><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم التعاوني\n• التعلم التشاركي\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>عروض تقديمية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• الوسائل المتعددة (سمعية - بصرية)"},{"h":"<div class=\"pills\"><span>التأين<\/span><span>الإشعاع المؤين<\/span><span>جسيمات ألفا<\/span><span>جسيمات بيتا<\/span><span>أشعة جاما<\/span><span>القدرة على الاختراق<\/span><span>التتبع الإشعاعي<\/span><span>التعقيم<\/span><\/div>","t":"التأين، الإشعاع المؤين، جسيمات ألفا، جسيمات بيتا، أشعة جاما، القدرة على الاختراق، التتبع الإشعاعي، التعقيم"},{"h":"<p>يعرض المعلم شكل اختراق الإشعاعات للورق والألومنيوم والرصاص ويسأل: لماذا يتوقف بعضها بورقة بينما يحتاج آخر إلى رصاص سميك؟<\/p>","t":"يعرض المعلم شكل اختراق الإشعاعات للورق والألومنيوم والرصاص ويسأل: لماذا يتوقف بعضها بورقة بينما يحتاج آخر إلى رصاص سميك؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الشكل على السبورة الذكية.<\/td><td>يتوقعون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مجموعات الخبراء (كتاب الطالب ص 93–96)<\/td><td>يقسم الطلبة إلى ثلاث مجموعات خبراء: ألفا، بيتا، جاما.<\/td><td>تملأ كل مجموعة صف إشعاعها في جدول: التكوين، الشحنة، القدرة المؤينة، الاختراق، الانحراف.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التأين والانحراف<\/td><td>يوضح التأين ولماذا تكون ألفا أشد تأيينًا، ويعرض انحراف ألفا وبيتا في اتجاهين متعاكسين وعدم انحراف جاما.<\/td><td>يكملون الجدول ويعللون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الاستخدامات (كتاب الطالب ص 97–101)<\/td><td>يعرض بعرض تقديمي كاشف الدخان (ألفا)، والتحكم في سمك الورق (بيتا)، وتعقيم الأدوات وعلاج السرطان والتتبع (جاما).<\/td><td>يربطون كل استخدام بخاصية الإشعاع المناسبة.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(4 دقائق) التهيئة\nدور المعلم: يعرض الشكل على السبورة الذكية.\nدور الطالب: يتوقعون.\n\n(12 دقيقة) مجموعات الخبراء (كتاب الطالب ص 93–96)\nدور المعلم: يقسم الطلبة إلى ثلاث مجموعات خبراء: ألفا، بيتا، جاما.\nدور الطالب: تملأ كل مجموعة صف إشعاعها في جدول: التكوين، الشحنة، القدرة المؤينة، الاختراق، الانحراف.\n\n(8 دقائق) التأين والانحراف\nدور المعلم: يوضح التأين ولماذا تكون ألفا أشد تأيينًا، ويعرض انحراف ألفا وبيتا في اتجاهين متعاكسين وعدم انحراف جاما.\nدور الطالب: يكملون الجدول ويعللون.\n\n(10 دقائق) الاستخدامات (كتاب الطالب ص 97–101)\nدور المعلم: يعرض بعرض تقديمي كاشف الدخان (ألفا)، والتحكم في سمك الورق (بيتا)، وتعقيم الأدوات وعلاج السرطان والتتبع (جاما).\nدور الطالب: يربطون كل استخدام بخاصية الإشعاع المناسبة.\n\n(6 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الإشعاع الذي لا يوقفه إلا الرصاص السميك أو الخرسانة؟<\/td><td>أشعة جاما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تنحرف جسيمات ألفا وبيتا في اتجاهين متعاكسين في المجال الكهربائي؟<\/td><td>لأن ألفا موجبة الشحنة وبيتا سالبة الشحنة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تُستخدم أشعة بيتا لا ألفا ولا جاما في التحكم في سمك الورق؟<\/td><td>ألفا لا تخترق الورق، وجاما تخترقه كله دون تغير ملحوظ، أما بيتا فيخترق جزء منها يتغير بتغير السمك فيمكن قياسه.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الإشعاع الذي لا يوقفه إلا الرصاص السميك أو الخرسانة؟\nالإجابة النموذجية: أشعة جاما.\n\n2) [المستوى المتوقع] لماذا تنحرف جسيمات ألفا وبيتا في اتجاهين متعاكسين في المجال الكهربائي؟\nالإجابة النموذجية: لأن ألفا موجبة الشحنة وبيتا سالبة الشحنة.\n\n3) [المستوى المتقدم] لماذا تُستخدم أشعة بيتا لا ألفا ولا جاما في التحكم في سمك الورق؟\nالإجابة النموذجية: ألفا لا تخترق الورق، وجاما تخترقه كله دون تغير ملحوظ، أما بيتا فيخترق جزء منها يتغير بتغير السمك فيمكن قياسه."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: جسيم ألفا يتكون من ......... بروتون و......... نيوترون.<\/td><td>2 – 2.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>رتب ألفا وبيتا وجاما تنازليًا حسب القدرة المؤينة.<\/td><td>ألفا ثم بيتا ثم جاما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُستخدم مصدر ألفا في كاشف الدخان؟ ولماذا لا يشكل خطرًا كبيرًا داخل المنزل؟<\/td><td>لأن ألفا شديدة التأين فتؤين الهواء في الكاشف ويمر تيار صغير يتغير عند دخول الدخان؛ ومداها قصير في الهواء ويوقفها غلاف الجهاز.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: جسيم ألفا يتكون من ......... بروتون و......... نيوترون.\nالإجابة النموذجية: 2 – 2.\n\n2) [المستوى المتوقع] رتب ألفا وبيتا وجاما تنازليًا حسب القدرة المؤينة.\nالإجابة النموذجية: ألفا ثم بيتا ثم جاما.\n\n3) [المستوى المتقدم] لماذا يُستخدم مصدر ألفا في كاشف الدخان؟ ولماذا لا يشكل خطرًا كبيرًا داخل المنزل؟\nالإجابة النموذجية: لأن ألفا شديدة التأين فتؤين الهواء في الكاشف ويمر تيار صغير يتغير عند دخول الدخان؛ ومداها قصير في الهواء ويوقفها غلاف الجهاز."},{"h":"<p>مراجعة كتاب الطالب ص 93–101 والإجابة عن الأسئلة 6-9 إلى 13-9، وحل تمريني 1-9 طبيعة الإشعاع و2-9 استخدام المواد المشعة في كتاب النشاط ص 69–71.<\/p>","t":"مراجعة كتاب الطالب ص 93–101 والإجابة عن الأسئلة 6-9 إلى 13-9، وحل تمريني 1-9 طبيعة الإشعاع و2-9 استخدام المواد المشعة في كتاب النشاط ص 69–71."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-9 و 3-9 فهم النشاط الإشعاعي واستخدام النظائر المشعة<\/div><div><b>الوحدة:<\/b> الوحدة التاسعة: النشاط الإشعاعي<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث عشر (29/11–3/12/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 93–101 | كتاب النشاط: تمرين 1-9 ص 69–70، تمرين 2-9 ص 71<\/div><div><b>دليل المعلم:<\/b> ص 98–99<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: إشعاعات ألفا وبيتا وجاما وخصائصها واستخداماتها<\/div><ol class=\"ol\"><li>يحدد انبعاثات ألفا وبيتا وجاما من حيث تكوينها وق
