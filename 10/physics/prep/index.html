:root{--ac:#2F6E9C;--tint:#EAF2F9;--line:#D2E1ED;--soft:#F5F9FC;--ink:#25313C;--mut:#5E6E7B;--ok:#2E7D5B;--okt:#E7F5EE}
*{box-sizing:border-box}
body{margin:0;font-family:Tj,system-ui,sans-serif;background:#F5F8FA;color:var(--ink);line-height:1.75;font-size:16px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:14px;padding-bottom:14px}
h1{margin:0;font-size:1.3rem;color:var(--ac)}
.sub{color:var(--mut);font-size:.92rem}
.modebox{margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.seg{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;color:var(--mut);padding:8px 18px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(40,70,100,.14)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint{margin:8px 0 0;font-size:.9rem;color:var(--mut)}
.hint b{color:var(--ink)}
.state{margin-top:10px;display:inline-block;background:var(--okt);color:var(--ok);font-weight:700;border-radius:10px;padding:4px 12px;font-size:.95rem}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:16px 0 8px}
.ctl label{font-weight:700;color:var(--mut)}
select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%;flex:1;min-width:240px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.tab{font:inherit;text-align:start;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;cursor:pointer;color:var(--ink);line-height:1.45;max-width:100%}
.tab b{display:block;color:var(--ac)}
.tab small{color:var(--mut)}
.tab.on{background:var(--tint);border-color:var(--ac)}
.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 18px;font-size:.92rem}
.info b{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.card h3{margin:0;font-size:1.02rem;color:var(--ac);display:flex;align-items:center;gap:8px}
.no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--tint);border:1px solid var(--line);font-size:.85rem;flex:none}
.copy{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ac);border-radius:10px;padding:5px 16px;min-width:118px;cursor:pointer;transition:background .2s,color .2s}
.copy:hover{background:var(--tint)}
.copy.done{background:var(--okt);color:var(--ok);border-color:#BFE3D1}
.bd{padding:10px 16px}
.bd p{margin:0}
ol.ol{margin:0;padding-inline-start:20px}
.extra{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.extra b{color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:1px 10px;font-size:.93rem}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th{background:var(--tint);color:var(--ac);border:1px solid var(--line);padding:4px 8px}
table.t td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
td.tm{white-space:nowrap;text-align:center;font-weight:700;color:var(--ac)}
td.st{font-weight:700}
td.lv,td.ev{white-space:nowrap;font-weight:700;color:var(--ac);text-align:center}
tr.sum td{background:var(--soft);font-weight:700}
.tot{font-size:.88rem;color:var(--mut);margin:0 0 4px}
bdi{unicode-bidi:isolate;direction:ltr}
.psub{font-weight:700;color:var(--ac);margin:12px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
.psub:first-child{margin-top:0;padding-top:0;border-top:0}
.man{padding:0 16px 12px}
.man p{margin:0 0 6px;color:#8A5A12;font-size:.9rem}
.man textarea{width:100%;min-height:150px;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:10px;padding:8px}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:20px}
@media (max-width:600px){body{font-size:15px}.card .hd{flex-wrap:wrap}.copy{min-width:96px}table.t{font-size:.84rem}.seg button{padding:8px 12px}}
</style></head><body>

</div></div></header>

","t":"• يذكر أن هناك نوعين من الشحنات الكهربائية: موجبة وسالبة. ← تذكر\n• يذكر أن الشحنات المختلفة تتجاذب والمتشابهة تتنافر. ← تذكر\n• يصف تجربة بسيطة لإنتاج الشحنات الساكنة بالدلك والكشف عنها ويفسر نتائجها. ← فهم\n• يستنتج نوع شحنة بالون مدلوك بمقارنته بقضيب معلوم الشحنة. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: قضيبا أبونايت وزجاج، قطعتا صوف وحرير، بالونات، خيط، حامل فلزي<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: قضيبا أبونايت وزجاج، قطعتا صوف وحرير، بالونات، خيط، حامل فلزي"},{"h":"<div class=\"pills\"><span>الكهرباء الساكنة<\/span><span>الشحنة الموجبة<\/span><span>الشحنة السالبة<\/span><span>التجاذب<\/span><span>التنافر<\/span><span>الدلك<\/span><\/div>","t":"الكهرباء الساكنة، الشحنة الموجبة، الشحنة السالبة، التجاذب، التنافر، الدلك"},{"h":"<p>يسأل المعلم: هل شعرت بوخزة خفيفة عند لمس مقبض باب السيارة، أو سمعت طقطقة عند خلع ملابس صوفية؟ ثم يدلك بالونًا بشعره ويقربه من قصاصات ورق صغيرة ويطلب تفسيرًا مبدئيًا.<\/p>","t":"يسأل المعلم: هل شعرت بوخزة خفيفة عند لمس مقبض باب السيارة، أو سمعت طقطقة عند خلع ملابس صوفية؟ ثم يدلك بالونًا بشعره ويقربه من قصاصات ورق صغيرة ويطلب تفسيرًا مبدئيًا."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض موقف الوخزة الكهربائية وتجربة البالون والقصاصات، ويدوّن تفسيرات الطلبة على السبورة الذكية.<\/td><td>يشاركون خبراتهم ويقترحون تفسيرًا لانجذاب القصاصات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">النشاط 1-1 الكهرباء الساكنة (كتاب الطالب ص 16)<\/td><td>يوزع الأدوات على المجموعات ويوجه إلى دلك قضيب الأبونايت بالصوف وقضيب الزجاج بالحرير، وتعليق أحدهما بخيط ثم تقريب الآخر منه.<\/td><td>يجرون النشاط ويسجلون في جدول: أبونايت مع أبونايت تنافر، زجاج مع زجاج تنافر، أبونايت مع زجاج تجاذب.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">استنتاج القاعدة<\/td><td>يقود نقاشًا للوصول إلى وجود نوعين من الشحنات، ويوضح أن تسميتي «موجبة» و«سالبة» اصطلاحيتان، ويعرض الشكل 1-1.<\/td><td>يصوغون القاعدة: المتشابهة تتنافر والمختلفة تتجاذب، ويدونونها.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تحدي البالون<\/td><td>يطرح تحديًا: كيف نعرف نوع شحنة البالون المدلوك؟ ويذكّر بأن الأبونايت المدلوك بالصوف يكتسب شحنة سالبة.<\/td><td>يقربون البالون من القضيبين المشحونين ويستنتجون نوع شحنته من التنافر.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التقويم والختام<\/td><td>يطرح أسئلة التقويم التكويني، ويكلف بالأسئلة 1-1 إلى 3-1.<\/td><td>يجيبون شفهيًا ويلخصون الحصة في جملتين.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض موقف الوخزة الكهربائية وتجربة البالون والقصاصات، ويدوّن تفسيرات الطلبة على السبورة الذكية.\nدور الطالب: يشاركون خبراتهم ويقترحون تفسيرًا لانجذاب القصاصات.\n\n(12 دقيقة) النشاط 1-1 الكهرباء الساكنة (كتاب الطالب ص 16)\nدور المعلم: يوزع الأدوات على المجموعات ويوجه إلى دلك قضيب الأبونايت بالصوف وقضيب الزجاج بالحرير، وتعليق أحدهما بخيط ثم تقريب الآخر منه.\nدور الطالب: يجرون النشاط ويسجلون في جدول: أبونايت مع أبونايت تنافر، زجاج مع زجاج تنافر، أبونايت مع زجاج تجاذب.\n\n(8 دقائق) استنتاج القاعدة\nدور المعلم: يقود نقاشًا للوصول إلى وجود نوعين من الشحنات، ويوضح أن تسميتي «موجبة» و«سالبة» اصطلاحيتان، ويعرض الشكل 1-1.\nدور الطالب: يصوغون القاعدة: المتشابهة تتنافر والمختلفة تتجاذب، ويدونونها.\n\n(7 دقائق) تحدي البالون\nدور المعلم: يطرح تحديًا: كيف نعرف نوع شحنة البالون المدلوك؟ ويذكّر بأن الأبونايت المدلوك بالصوف يكتسب شحنة سالبة.\nدور الطالب: يقربون البالون من القضيبين المشحونين ويستنتجون نوع شحنته من التنافر.\n\n(8 دقائق) التقويم والختام\nدور المعلم: يطرح أسئلة التقويم التكويني، ويكلف بالأسئلة 1-1 إلى 3-1.\nدور الطالب: يجيبون شفهيًا ويلخصون الحصة في جملتين."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نوعا الشحنة الكهربائية؟<\/td><td>شحنة موجبة وشحنة سالبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>دُلك قضيبان من الأبونايت بالصوف ثم قُرّب أحدهما من الآخر. ماذا يحدث؟ ولماذا؟<\/td><td>يتنافران؛ لأن لهما شحنتين متشابهتين (سالبتين).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>بالون مدلوك يتنافر مع قضيب زجاج مدلوك بالحرير. ما نوع شحنة البالون؟ فسّر.<\/td><td>موجبة؛ لأن الزجاج المدلوك بالحرير موجب الشحنة، والشحنات المتشابهة تتنافر.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما نوعا الشحنة الكهربائية؟\nالإجابة النموذجية: شحنة موجبة وشحنة سالبة.\n\n2) [المستوى المتوقع] دُلك قضيبان من الأبونايت بالصوف ثم قُرّب أحدهما من الآخر. ماذا يحدث؟ ولماذا؟\nالإجابة النموذجية: يتنافران؛ لأن لهما شحنتين متشابهتين (سالبتين).\n\n3) [المستوى المتقدم] بالون مدلوك يتنافر مع قضيب زجاج مدلوك بالحرير. ما نوع شحنة البالون؟ فسّر.\nالإجابة النموذجية: موجبة؛ لأن الزجاج المدلوك بالحرير موجب الشحنة، والشحنات المتشابهة تتنافر."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الشحنات ......... تتجاذب، والشحنات ......... تتنافر.<\/td><td>المختلفة – المتشابهة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُنصح بإجراء تجارب الكهرباء الساكنة في يوم جاف؟<\/td><td>لأن الرطوبة تساعد على تسرب الشحنات من الأجسام فتضعف النتائج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لديك قضيب أبونايت مدلوك بالصوف وقضيب زجاج مدلوك بالحرير. كيف تحدد بثقة نوع شحنة مشط مدلوك؟<\/td><td>التنافر هو الدليل الأكيد: إن تنافر المشط مع الأبونايت فشحنته سالبة، وإن تنافر مع الزجاج فشحنته موجبة؛ أما التجاذب وحده فلا يكفي لأنه قد يحدث مع جسم متعادل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الشحنات ......... تتجاذب، والشحنات ......... تتنافر.\nالإجابة النموذجية: المختلفة – المتشابهة.\n\n2) [المستوى المتوقع] لماذا يُنصح بإجراء تجارب الكهرباء الساكنة في يوم جاف؟\nالإجابة النموذجية: لأن الرطوبة تساعد على تسرب الشحنات من الأجسام فتضعف النتائج.\n\n3) [المستوى المتقدم] لديك قضيب أبونايت مدلوك بالصوف وقضيب زجاج مدلوك بالحرير. كيف تحدد بثقة نوع شحنة مشط مدلوك؟\nالإجابة النموذجية: التنافر هو الدليل الأكيد: إن تنافر المشط مع الأبونايت فشحنته سالبة، وإن تنافر مع الزجاج فشحنته موجبة؛ أما التجاذب وحده فلا يكفي لأنه قد يحدث مع جسم متعادل."},{"h":"<p>مراجعة كتاب الطالب ص 15–17 وحل الأسئلة 1-1 إلى 3-1، وحل تمرين 1-1 التجاذب والتنافر (الجزئيتان أ، ب) في كتاب النشاط ص 15–16، ويمكن لولي الأمر متابعة تجربة البالون والقصاصات في المنزل.<\/p>","t":"مراجعة كتاب الطالب ص 15–17 وحل الأسئلة 1-1 إلى 3-1، وحل تمرين 1-1 التجاذب والتنافر (الجزئيتان أ، ب) في كتاب النشاط ص 15–16، ويمكن لولي الأمر متابعة تجربة البالون والقصاصات في المنزل."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-1 الكهرباء الساكنة<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 15–17 | كتاب النشاط: تمرين 1-1 ص 15–16<\/div><div><b>دليل المعلم:<\/b> ص 21–22<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر<\/div><ol class=\"ol\"><li>يذكر أن هناك نوعين من الشحنات الكهربائية: موجبة وسالبة.<\/li><li>يذكر أن الشحنات المختلفة تتجاذب والمتشابهة تتنافر.<\/li><li>يصف تجربة بسيطة لإنتاج الشحنات الساكنة بالدلك والكشف عنها ويفسر نتائجها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج نوع شحنة بالون مدلوك بمقارنته بقضيب معلوم الشحنة.<\/div>","t":"الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر\n1. يذكر أن هناك نوعين من الشحنات الكهربائية: موجبة وسالبة.\n2. يذكر أن الشحنات المختلفة تتجاذب والمتشابهة تتنافر.\n3. يصف تجربة بسيطة لإنتاج الشحنات الساكنة بالدلك والكشف عنها ويفسر نتائجها.\nمخرج تعليمي آخر: يستنتج نوع شحنة بالون مدلوك بمقارنته بقضيب معلوم الشحنة."},{"h":"<div class=\"psub\">الحصة 1: ء الساكنة، الشحنة الموجبة، الشحنة السالبة، التجاذب، التنافر، الدلك"},{"h":"<div class=\"psub\">الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر<\/div><p>يسأل المعلم: هل شعرت بوخزة خفيفة عند لمس مقبض باب السيارة، أو سمعت طقطقة عند خلع ملابس صوفية؟ ثم يدلك بالونًا بشعره ويقربه من قصاصات ورق صغيرة ويطلب تفسيرًا مبدئيًا.<\/p>","t":"الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر\nيسأل المعلم: هل شعرت بوخزة خفيفة عند لمس مقبض باب السيارة، أو سمعت طقطقة عند خلع ملابس صوفية؟ ثم يدلك بالونًا بشعره ويقربه من قصاصات ورق صغيرة ويطلب تفسيرًا مبدئيًا."},{"h":"<div class=\"psub\">الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض موقف الوخزة الكهربائية وتجربة البالون والقصاصات، ويدوّن تفسيرات الطلبة على السبورة الذكية.<\/td><td>يشاركون خبراتهم ويقترحون تفسيرًا لانجذاب القصاصات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">النشاط 1-1 الكهرباء الساكنة (كتاب الطالب ص 16)<\/td><td>يوزع الأدوات على المجموعات ويوجه إلى دلك قضيب الأبونايت بالصوف وقضيب الزجاج بالحرير، وتعليق أحدهما بخيط ثم تقريب الآخر منه.<\/td><td>يجرون النشاط ويسجلون في جدول: أبونايت مع أبونايت تنافر، زجاج مع زجاج تنافر، أبونايت مع زجاج تجاذب.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">استنتاج القاعدة<\/td><td>يقود نقاشًا للوصول إلى وجود نوعين من الشحنات، ويوضح أن تسميتي «موجبة» و«سالبة» اصطلاحيتان، ويعرض الشكل 1-1.<\/td><td>يصوغون القاعدة: المتشابهة تتنافر والمختلفة تتجاذب، ويدونونها.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تحدي البالون<\/td><td>يطرح تحديًا: كيف نعرف نوع شحنة البالون المدلوك؟ ويذكّر بأن الأبونايت المدلوك بالصوف يكتسب شحنة سالبة.<\/td><td>يقربون البالون من القضيبين المشحونين ويستنتجون نوع شحنته من التنافر.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">التقويم والختام<\/td><td>يطرح أسئلة التقويم التكويني، ويكلف بالأسئلة 1-1 إلى 3-1.<\/td><td>يجيبون شفهيًا ويلخصون الحصة في جملتين.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر\n(5 دقائق) التهيئة\nدور المعلم: يعرض موقف الوخزة الكهربائية وتجربة البالون والقصاصات، ويدوّن تفسيرات الطلبة على السبورة الذكية.\nدور الطالب: يشاركون خبراتهم ويقترحون تفسيرًا لانجذاب القصاصات.\n\n(12 دقيقة) النشاط 1-1 الكهرباء الساكنة (كتاب الطالب ص 16)\nدور المعلم: يوزع الأدوات على المجموعات ويوجه إلى دلك قضيب الأبونايت بالصوف وقضيب الزجاج بالحرير، وتعليق أحدهما بخيط ثم تقريب الآخر منه.\nدور الطالب: يجرون النشاط ويسجلون في جدول: أبونايت مع أبونايت تنافر، زجاج مع زجاج تنافر، أبونايت مع زجاج تجاذب.\n\n(8 دقائق) استنتاج القاعدة\nدور المعلم: يقود نقاشًا للوصول إلى وجود نوعين من الشحنات، ويوضح أن تسميتي «موجبة» و«سالبة» اصطلاحيتان، ويعرض الشكل 1-1.\nدور الطالب: يصوغون القاعدة: المتشابهة تتنافر والمختلفة تتجاذب، ويدونونها.\n\n(7 دقائق) تحدي البالون\nدور المعلم: يطرح تحديًا: كيف نعرف نوع شحنة البالون المدلوك؟ ويذكّر بأن الأبونايت المدلوك بالصوف يكتسب شحنة سالبة.\nدور الطالب: يقربون البالون من القضيبين المشحونين ويستنتجون نوع شحنته من التنافر.\n\n(8 دقائق) التقويم والختام\nدور المعلم: يطرح أسئلة التقويم التكويني، ويكلف بالأسئلة 1-1 إلى 3-1.\nدور الطالب: يجيبون شفهيًا ويلخصون الحصة في جملتين."},{"h":"<div class=\"psub\">الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما نوعا الشحنة الكهربائية؟<\/td><td>شحنة موجبة وشحنة سالبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>دُلك قضيبان من الأبونايت بالصوف ثم قُرّب أحدهما من الآخر. ماذا يحدث؟ ولماذا؟<\/td><td>يتنافران؛ لأن لهما شحنتين متشابهتين (سالبتين).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>بالون مدلوك يتنافر مع قضيب زجاج مدلوك بالحرير. ما نوع شحنة البالون؟ فسّر.<\/td><td>موجبة؛ لأن الزجاج المدلوك بالحرير موجب الشحنة، والشحنات المتشابهة تتنافر.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر\n1) [مستوى الدعم] ما نوعا الشحنة الكهربائية؟\nالإجابة النموذجية: شحنة موجبة وشحنة سالبة.\n\n2) [المستوى المتوقع] دُلك قضيبان من الأبونايت بالصوف ثم قُرّب أحدهما من الآخر. ماذا يحدث؟ ولماذا؟\nالإجابة النموذجية: يتنافران؛ لأن لهما شحنتين متشابهتين (سالبتين).\n\n3) [المستوى المتقدم] بالون مدلوك يتنافر مع قضيب زجاج مدلوك بالحرير. ما نوع شحنة البالون؟ فسّر.\nالإجابة النموذجية: موجبة؛ لأن الزجاج المدلوك بالحرير موجب الشحنة، والشحنات المتشابهة تتنافر."},{"h":"<div class=\"psub\">الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الشحنات ......... تتجاذب، والشحنات ......... تتنافر.<\/td><td>المختلفة – المتشابهة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُنصح بإجراء تجارب الكهرباء الساكنة في يوم جاف؟<\/td><td>لأن الرطوبة تساعد على تسرب الشحنات من الأجسام فتضعف النتائج.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لديك قضيب أبونايت مدلوك بالصوف وقضيب زجاج مدلوك بالحرير. كيف تحدد بثقة نوع شحنة مشط مدلوك؟<\/td><td>التنافر هو الدليل الأكيد: إن تنافر المشط مع الأبونايت فشحنته سالبة، وإن تنافر مع الزجاج فشحنته موجبة؛ أما التجاذب وحده فلا يكفي لأنه قد يحدث مع جسم متعادل.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر\n1) [مستوى الدعم] أكمل: الشحنات ......... تتجاذب، والشحنات ......... تتنافر.\nالإجابة النموذجية: المختلفة – المتشابهة.\n\n2) [المستوى المتوقع] لماذا يُنصح بإجراء تجارب الكهرباء الساكنة في يوم جاف؟\nالإجابة النموذجية: لأن الرطوبة تساعد على تسرب الشحنات من الأجسام فتضعف النتائج.\n\n3) [المستوى المتقدم] لديك قضيب أبونايت مدلوك بالصوف وقضيب زجاج مدلوك بالحرير. كيف تحدد بثقة نوع شحنة مشط مدلوك؟\nالإجابة النموذجية: التنافر هو الدليل الأكيد: إن تنافر المشط مع الأبونايت فشحنته سالبة، وإن تنافر مع الزجاج فشحنته موجبة؛ أما التجاذب وحده فلا يكفي لأنه قد يحدث مع جسم متعادل."},{"h":"<div class=\"psub\">الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر<\/div><p>مراجعة كتاب الطالب ص 15–17 وحل الأسئلة 1-1 إلى 3-1، وحل تمرين 1-1 التجاذب والتنافر (الجزئيتان أ، ب) في كتاب النشاط ص 15–16، ويمكن لولي الأمر متابعة تجربة البالون والقصاصات في المنزل.<\/p>","t":"الحصة 1: الشحنات الموجبة والسالبة والتجاذب والتنافر\nمراجعة كتاب الطالب ص 15–17 وحل الأسئلة 1-1 إلى 3-1، وحل تمرين 1-1 التجاذب والتنافر (الجزئيتان أ، ب) في كتاب النشاط ص 15–16، ويمكن لولي الأمر متابعة تجربة البالون والقصاصات في المنزل."}]}},{"label":"2-1 الاحتكاك والشحن الكهربائي","unit":"الوحدة الأولى: الشحنة الكهربائية","periods":[{"n":1,"focus":"انتقال الإلكترونات عند الدلك","info":"<div><b>الدرس:<\/b> 2-1 الاحتكاك والشحن الكهربائي<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 18 | كتاب النشاط: تمرين 2-1 ص 17–18<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div><div><b>محور الحصة:<\/b> انتقال الإلكترونات عند الدلك<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه.<\/li><li>يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة.<\/div>","t":"1. يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه.\n2. يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات.\nمخرج تعليمي آخر: يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه. ← تذكر\n• يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات. ← فهم\n• يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><span>التعلم بالاكتشاف<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التشاركي\n• التعلم بالاكتشاف"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>عروض تقديمية<\/span><span>نماذج مجسمة<\/span><span>أخرى: قضيب بولي إيثيلين وقطعة قماش<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• نماذج مجسمة\n• أخرى: قضيب بولي إيثيلين وقطعة قماش"},{"h":"<div class=\"pills\"><span>الإلكترون<\/span><span>الدلك<\/span><span>الجسم المتعادل<\/span><span>اكتساب الإلكترونات<\/span><span>فقد الإلكترونات<\/span><\/div>","t":"الإلكترون، الدلك، الجسم المتعادل، اكتساب الإلكترونات، فقد الإلكترونات"},{"h":"<p>يراجع المعلم بنية الذرة التي درسها الطلبة في الكيمياء (بروتونات موجبة في النواة وإلكترونات سالبة حولها)، ويسأل: إذا كانت الذرة متعادلة فمن أين جاءت الشحنة بعد الدلك؟<\/p>","t":"يراجع المعلم بنية الذرة التي درسها الطلبة في الكيمياء (بروتونات موجبة في النواة وإلكترونات سالبة حولها)، ويسأل: إذا كانت الذرة متعادلة فمن أين جاءت الشحنة بعد الدلك؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض نموذجًا مجسمًا للذرة ويطرح سؤال مصدر الشحنة.<\/td><td>يستدعون أن الذرة المتعادلة فيها عدد البروتونات يساوي عدد الإلكترونات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">النمذجة بالرسم<\/td><td>يرسم جسمين متعادلين بعدد متساوٍ من <bdi>(+)<\/bdi> و(−)، ثم يمثل انتقال بعض الإلكترونات من القماش إلى البولي إيثيلين عند الدلك.<\/td><td>يعيدون رسم النموذج ويعدّون الشحنات قبل الدلك وبعده.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">عرض عملي ومناقشة<\/td><td>يدلك قضيب البولي إيثيلين بالقماش ويبين أن القضيب صار سالبًا والقماش موجبًا، ويؤكد أن البروتونات لا تنتقل لارتباطها بالنواة.<\/td><td>يفسرون في أزواج: لماذا يصبح أحد الجسمين سالبًا والآخر موجبًا بالمقدار نفسه؟<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تطبيق (كتاب الطالب ص 18)<\/td><td>يوجه إلى قراءة الصفحة والإجابة عن السؤال 4-1.<\/td><td>يجيبون ويتبادلون الإجابات للتصحيح.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم ويلخص: الشحن انتقال للإلكترونات.<\/td><td>يجيبون ويكتبون خلاصة الحصة.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض نموذجًا مجسمًا للذرة ويطرح سؤال مصدر الشحنة.\nدور الطالب: يستدعون أن الذرة المتعادلة فيها عدد البروتونات يساوي عدد الإلكترونات.\n\n(10 دقائق) النمذجة بالرسم\nدور المعلم: يرسم جسمين متعادلين بعدد متساوٍ من (+) و(−)، ثم يمثل انتقال بعض الإلكترونات من القماش إلى البولي إيثيلين عند الدلك.\nدور الطالب: يعيدون رسم النموذج ويعدّون الشحنات قبل الدلك وبعده.\n\n(10 دقائق) عرض عملي ومناقشة\nدور المعلم: يدلك قضيب البولي إيثيلين بالقماش ويبين أن القضيب صار سالبًا والقماش موجبًا، ويؤكد أن البروتونات لا تنتقل لارتباطها بالنواة.\nدور الطالب: يفسرون في أزواج: لماذا يصبح أحد الجسمين سالبًا والآخر موجبًا بالمقدار نفسه؟\n\n(8 دقائق) تطبيق (كتاب الطالب ص 18)\nدور المعلم: يوجه إلى قراءة الصفحة والإجابة عن السؤال 4-1.\nدور الطالب: يجيبون ويتبادلون الإجابات للتصحيح.\n\n(7 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم ويلخص: الشحن انتقال للإلكترونات.\nدور الطالب: يجيبون ويكتبون خلاصة الحصة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الجسيمات التي تنتقل عند دلك جسمين؟<\/td><td>الإلكترونات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قضيب أصبح سالب الشحنة بعد دلكه. هل اكتسب إلكترونات أم فقدها؟<\/td><td>اكتسب إلكترونات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تكون شحنة القماش مساوية في المقدار لشحنة القضيب ومعاكسة لها في النوع؟<\/td><td>لأن عدد الإلكترونات التي فقدها القماش يساوي عدد الإلكترونات التي اكتسبها القضيب؛ فالشحنة تنتقل ولا تُستحدث.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الجسيمات التي تنتقل عند دلك جسمين؟\nالإجابة النموذجية: الإلكترونات.\n\n2) [المستوى المتوقع] قضيب أصبح سالب الشحنة بعد دلكه. هل اكتسب إلكترونات أم فقدها؟\nالإجابة النموذجية: اكتسب إلكترونات.\n\n3) [المستوى المتقدم] لماذا تكون شحنة القماش مساوية في المقدار لشحنة القضيب ومعاكسة لها في النوع؟\nالإجابة النموذجية: لأن عدد الإلكترونات التي فقدها القماش يساوي عدد الإلكترونات التي اكتسبها القضيب؛ فالشحنة تنتقل ولا تُستحدث."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يصبح الجسم موجب الشحنة عندما ......... إلكترونات.<\/td><td>يفقد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا تنتقل البروتونات عند الدلك؟<\/td><td>لأنها داخل النواة ومرتبطة بها بقوة، بينما الإلكترونات في الجزء الخارجي من الذرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>دُلك قضيب زجاجي بالحرير فأصبح موجبًا. صف بنموذج مبسط توزيع الشحنات على الجسمين قبل الدلك وبعده.<\/td><td>قبل الدلك: لكل جسم عدد متساوٍ من <bdi>(+)<\/bdi> و(−). بعده: تنتقل إلكترونات من الزجاج إلى الحرير، فيزيد عدد <bdi>(+)<\/bdi> في الزجاج فيصبح موجبًا، ويزيد عدد (−) في الحرير فيصبح سالبًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يصبح الجسم موجب الشحنة عندما ......... إلكترونات.\nالإجابة النموذجية: يفقد.\n\n2) [المستوى المتوقع] لماذا لا تنتقل البروتونات عند الدلك؟\nالإجابة النموذجية: لأنها داخل النواة ومرتبطة بها بقوة، بينما الإلكترونات في الجزء الخارجي من الذرة.\n\n3) [المستوى المتقدم] دُلك قضيب زجاجي بالحرير فأصبح موجبًا. صف بنموذج مبسط توزيع الشحنات على الجسمين قبل الدلك وبعده.\nالإجابة النموذجية: قبل الدلك: لكل جسم عدد متساوٍ من (+) و(−). بعده: تنتقل إلكترونات من الزجاج إلى الحرير، فيزيد عدد (+) في الزجاج فيصبح موجبًا، ويزيد عدد (−) في الحرير فيصبح سالبًا."},{"h":"<p>مراجعة كتاب الطالب ص 18 وحل السؤال 4-1، والاطلاع على تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18.<\/p>","t":"مراجعة كتاب الطالب ص 18 وحل السؤال 4-1، والاطلاع على تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18."}]},{"n":2,"focus":"الكهرباء الساكنة في الحياة اليومية","info":"<div><b>الدرس:<\/b> 2-1 الاحتكاك والشحن الكهربائي<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 18 | كتاب النشاط: تمرين 2-1 ص 17–18<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div><div><b>محور الحصة:<\/b> الكهرباء الساكنة في الحياة اليومية<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة.<\/li><li>يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم تجربة منزلية آمنة تظهر الشحن بالدلك.<\/div>","t":"1. يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة.\n2. يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء.\nمخرج تعليمي آخر: يصمم تجربة منزلية آمنة تظهر الشحن بالدلك."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصمم تجربة منزلية آمنة تظهر الشحن بالدلك.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"• يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة. ← تطبيق\n• يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء. ← فهم\n• يصمم تجربة منزلية آمنة تظهر الشحن بالدلك. ← إبداع"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: بالونات، قصاصات ورق، مشط بلاستيكي، صنبور ماء<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بالونات، قصاصات ورق، مشط بلاستيكي، صنبور ماء"},{"h":"<div class=\"pills\"><span>الشحن بالدلك<\/span><span>الجسم المتعادل<\/span><span>إعادة توزيع الشحنات<\/span><span>الوخزة الكهربائية<\/span><\/div>","t":"الشحن بالدلك، الجسم المتعادل، إعادة توزيع الشحنات، الوخزة الكهربائية"},{"h":"<p>عرض: مشط بلاستيكي مدلوك يحرف تيار ماء رفيعًا من الصنبور؛ يسأل المعلم: لماذا ينحرف الماء مع أنه غير مشحون؟<\/p>","t":"عرض: مشط بلاستيكي مدلوك يحرف تيار ماء رفيعًا من الصنبور؛ يسأل المعلم: لماذا ينحرف الماء مع أنه غير مشحون؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ عرض انحراف تيار الماء ويستقبل الفرضيات.<\/td><td>يلاحظون ويقترحون تفسيرات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">جذب الجسم المتعادل<\/td><td>يوضح بالرسم على السبورة الذكية أن المشط السالب يدفع الإلكترونات في الجسم المتعادل بعيدًا فيصبح الجانب القريب موجبًا فيحدث تجاذب.<\/td><td>يرسمون توزيع الشحنات على قصاصة ورق قريبة من مشط سالب.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تمرين 2-1 الكهرباء الساكنة في المنزل (كتاب النشاط ص 17–18)<\/td><td>يوزع على المجموعات مواقف منزلية: الملابس في المجفف، الشعر والمشط، المشي على السجاد، الشاشة.<\/td><td>تفسر كل مجموعة موقفها بانتقال الإلكترونات وتقترح تجربة منزلية آمنة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من مسابقة المجموعات على أسئلة الدرس.<\/td><td>تتنافس المجموعات في الإجابة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الختام<\/td><td>يجمع الأفكار الرئيسة ويكلف بالواجب.<\/td><td>يدونون الواجب.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ عرض انحراف تيار الماء ويستقبل الفرضيات.\nدور الطالب: يلاحظون ويقترحون تفسيرات.\n\n(10 دقائق) جذب الجسم المتعادل\nدور المعلم: يوضح بالرسم على السبورة الذكية أن المشط السالب يدفع الإلكترونات في الجسم المتعادل بعيدًا فيصبح الجانب القريب موجبًا فيحدث تجاذب.\nدور الطالب: يرسمون توزيع الشحنات على قصاصة ورق قريبة من مشط سالب.\n\n(12 دقيقة) تمرين 2-1 الكهرباء الساكنة في المنزل (كتاب النشاط ص 17–18)\nدور المعلم: يوزع على المجموعات مواقف منزلية: الملابس في المجفف، الشعر والمشط، المشي على السجاد، الشاشة.\nدور الطالب: تفسر كل مجموعة موقفها بانتقال الإلكترونات وتقترح تجربة منزلية آمنة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من مسابقة المجموعات على أسئلة الدرس.\nدور الطالب: تتنافس المجموعات في الإجابة.\n\n(5 دقائق) الختام\nدور المعلم: يجمع الأفكار الرئيسة ويكلف بالواجب.\nدور الطالب: يدونون الواجب."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر موقفًا يوميًا تظهر فيه الكهرباء الساكنة.<\/td><td>تطاير الشعر عند تمشيطه، أو وخزة مقبض السيارة، أو التصاق الملابس بعد المجفف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تنجذب قصاصات الورق المتعادلة إلى مشط مشحون؟<\/td><td>لأن شحنة المشط تعيد توزيع الإلكترونات في القصاصة فيصبح جانبها القريب بشحنة مخالفة فيحدث تجاذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح تجربة منزلية آمنة تثبت أن البالون المدلوك اكتسب شحنة، مع ذكر ما تضبطه.<\/td><td>ندلك بالونين بالشعر بالطريقة نفسها ونعلقهما متجاورين فيتنافران؛ نضبط عدد مرات الدلك ونوع المادة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر موقفًا يوميًا تظهر فيه الكهرباء الساكنة.\nالإجابة النموذجية: تطاير الشعر عند تمشيطه، أو وخزة مقبض السيارة، أو التصاق الملابس بعد المجفف.\n\n2) [المستوى المتوقع] لماذا تنجذب قصاصات الورق المتعادلة إلى مشط مشحون؟\nالإجابة النموذجية: لأن شحنة المشط تعيد توزيع الإلكترونات في القصاصة فيصبح جانبها القريب بشحنة مخالفة فيحدث تجاذب.\n\n3) [المستوى المتقدم] اقترح تجربة منزلية آمنة تثبت أن البالون المدلوك اكتسب شحنة، مع ذكر ما تضبطه.\nالإجابة النموذجية: ندلك بالونين بالشعر بالطريقة نفسها ونعلقهما متجاورين فيتنافران؛ نضبط عدد مرات الدلك ونوع المادة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الجسم المتعادل لا يحتوي على أي شحنات.<\/td><td>خطأ؛ يحتوي على شحنات موجبة وسالبة متساوية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>فسّر التصاق الملابس ببعضها بعد خروجها من المجفف.<\/td><td>تحتك الملابس فتنتقل الإلكترونات بينها فتكتسب شحنات مختلفة فتتجاذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يقل التصاق الملابس في الجو الرطب؟<\/td><td>لأن بخار الماء في الهواء يساعد على تسرب الشحنات من الملابس فلا تتراكم.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: الجسم المتعادل لا يحتوي على أي شحنات.\nالإجابة النموذجية: خطأ؛ يحتوي على شحنات موجبة وسالبة متساوية.\n\n2) [المستوى المتوقع] فسّر التصاق الملابس ببعضها بعد خروجها من المجفف.\nالإجابة النموذجية: تحتك الملابس فتنتقل الإلكترونات بينها فتكتسب شحنات مختلفة فتتجاذب.\n\n3) [المستوى المتقدم] لماذا يقل التصاق الملابس في الجو الرطب؟\nالإجابة النموذجية: لأن بخار الماء في الهواء يساعد على تسرب الشحنات من الملابس فلا تتراكم."},{"h":"<p>إكمال تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18، وتنفيذ تجربة البالونين في المنزل بإشراف ولي الأمر وتسجيل الملاحظات.<\/p>","t":"إكمال تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18، وتنفيذ تجربة البالونين في المنزل بإشراف ولي الأمر وتسجيل الملاحظات."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-1 الاحتكاك والشحن الكهربائي<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الأول (6–10/9/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 18 | كتاب النشاط: تمرين 2-1 ص 17–18<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><ol class=\"ol\"><li>يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه.<\/li><li>يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة.<\/div><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><ol class=\"ol\"><li>يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة.<\/li><li>يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصمم تجربة منزلية آمنة تظهر الشحن بالدلك.<\/div>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n1. يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه.\n2. يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات.\nمخرج تعليمي آخر: يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة.\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n1. يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة.\n2. يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء.\nمخرج تعليمي آخر: يصمم تجربة منزلية آمنة تظهر الشحن بالدلك."},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصمم تجربة منزلية آمنة تظهر الشحن بالدلك.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n• يذكر أن شحن الجسم يتضمن إضافة إلكترونات إليه أو إزالتها منه. ← تذكر\n• يفسر اكتساب جسمين عازلين شحنتين مختلفتين عند دلكهما بانتقال الإلكترونات. ← فهم\n• يحدد الجسم الذي اكتسب إلكترونات والجسم الذي فقدها من نوع الشحنة الناتجة. ← تطبيق\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n• يطبق مفهوم انتقال الإلكترونات لتفسير مواقف يومية للكهرباء الساكنة. ← تطبيق\n• يفسر انجذاب جسم مشحون لجسم متعادل كقصاصات الورق وتيار الماء. ← فهم\n• يصمم تجربة منزلية آمنة تظهر الشحن بالدلك. ← إبداع"},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><span>التعلم بالاكتشاف<\/span><\/div><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n• التعلم بالنمذجة\n• التعلم التشاركي\n• التعلم بالاكتشاف\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>عروض تقديمية<\/span><span>نماذج مجسمة<\/span><span>أخرى: قضيب بولي إيثيلين وقطعة قماش<\/span><\/div><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: بالونات، قصاصات ورق، مشط بلاستيكي، صنبور ماء<\/span><\/div>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• نماذج مجسمة\n• أخرى: قضيب بولي إيثيلين وقطعة قماش\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: بالونات، قصاصات ورق، مشط بلاستيكي، صنبور ماء"},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><div class=\"pills\"><span>الإلكترون<\/span><span>الدلك<\/span><span>الجسم المتعادل<\/span><span>اكتساب الإلكترونات<\/span><span>فقد الإلكترونات<\/span><\/div><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><div class=\"pills\"><span>الشحن بالدلك<\/span><span>الجسم المتعادل<\/span><span>إعادة توزيع الشحنات<\/span><span>الوخزة الكهربائية<\/span><\/div>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\nالإلكترون، الدلك، الجسم المتعادل، اكتساب الإلكترونات، فقد الإلكترونات\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\nالشحن بالدلك، الجسم المتعادل، إعادة توزيع الشحنات، الوخزة الكهربائية"},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><p>يراجع المعلم بنية الذرة التي درسها الطلبة في الكيمياء (بروتونات موجبة في النواة وإلكترونات سالبة حولها)، ويسأل: إذا كانت الذرة متعادلة فمن أين جاءت الشحنة بعد الدلك؟<\/p><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><p>عرض: مشط بلاستيكي مدلوك يحرف تيار ماء رفيعًا من الصنبور؛ يسأل المعلم: لماذا ينحرف الماء مع أنه غير مشحون؟<\/p>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\nيراجع المعلم بنية الذرة التي درسها الطلبة في الكيمياء (بروتونات موجبة في النواة وإلكترونات سالبة حولها)، ويسأل: إذا كانت الذرة متعادلة فمن أين جاءت الشحنة بعد الدلك؟\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\nعرض: مشط بلاستيكي مدلوك يحرف تيار ماء رفيعًا من الصنبور؛ يسأل المعلم: لماذا ينحرف الماء مع أنه غير مشحون؟"},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض نموذجًا مجسمًا للذرة ويطرح سؤال مصدر الشحنة.<\/td><td>يستدعون أن الذرة المتعادلة فيها عدد البروتونات يساوي عدد الإلكترونات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">النمذجة بالرسم<\/td><td>يرسم جسمين متعادلين بعدد متساوٍ من <bdi>(+)<\/bdi> و(−)، ثم يمثل انتقال بعض الإلكترونات من القماش إلى البولي إيثيلين عند الدلك.<\/td><td>يعيدون رسم النموذج ويعدّون الشحنات قبل الدلك وبعده.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">عرض عملي ومناقشة<\/td><td>يدلك قضيب البولي إيثيلين بالقماش ويبين أن القضيب صار سالبًا والقماش موجبًا، ويؤكد أن البروتونات لا تنتقل لارتباطها بالنواة.<\/td><td>يفسرون في أزواج: لماذا يصبح أحد الجسمين سالبًا والآخر موجبًا بالمقدار نفسه؟<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تطبيق (كتاب الطالب ص 18)<\/td><td>يوجه إلى قراءة الصفحة والإجابة عن السؤال 4-1.<\/td><td>يجيبون ويتبادلون الإجابات للتصحيح.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم ويلخص: الشحن انتقال للإلكترونات.<\/td><td>يجيبون ويكتبون خلاصة الحصة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ عرض انحراف تيار الماء ويستقبل الفرضيات.<\/td><td>يلاحظون ويقترحون تفسيرات.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">جذب الجسم المتعادل<\/td><td>يوضح بالرسم على السبورة الذكية أن المشط السالب يدفع الإلكترونات في الجسم المتعادل بعيدًا فيصبح الجانب القريب موجبًا فيحدث تجاذب.<\/td><td>يرسمون توزيع الشحنات على قصاصة ورق قريبة من مشط سالب.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تمرين 2-1 الكهرباء الساكنة في المنزل (كتاب النشاط ص 17–18)<\/td><td>يوزع على المجموعات مواقف منزلية: الملابس في المجفف، الشعر والمشط، المشي على السجاد، الشاشة.<\/td><td>تفسر كل مجموعة موقفها بانتقال الإلكترونات وتقترح تجربة منزلية آمنة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير جولة من مسابقة المجموعات على أسئلة الدرس.<\/td><td>تتنافس المجموعات في الإجابة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">الختام<\/td><td>يجمع الأفكار الرئيسة ويكلف بالواجب.<\/td><td>يدونون الواجب.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n(5 دقائق) التهيئة\nدور المعلم: يعرض نموذجًا مجسمًا للذرة ويطرح سؤال مصدر الشحنة.\nدور الطالب: يستدعون أن الذرة المتعادلة فيها عدد البروتونات يساوي عدد الإلكترونات.\n\n(10 دقائق) النمذجة بالرسم\nدور المعلم: يرسم جسمين متعادلين بعدد متساوٍ من (+) و(−)، ثم يمثل انتقال بعض الإلكترونات من القماش إلى البولي إيثيلين عند الدلك.\nدور الطالب: يعيدون رسم النموذج ويعدّون الشحنات قبل الدلك وبعده.\n\n(10 دقائق) عرض عملي ومناقشة\nدور المعلم: يدلك قضيب البولي إيثيلين بالقماش ويبين أن القضيب صار سالبًا والقماش موجبًا، ويؤكد أن البروتونات لا تنتقل لارتباطها بالنواة.\nدور الطالب: يفسرون في أزواج: لماذا يصبح أحد الجسمين سالبًا والآخر موجبًا بالمقدار نفسه؟\n\n(8 دقائق) تطبيق (كتاب الطالب ص 18)\nدور المعلم: يوجه إلى قراءة الصفحة والإجابة عن السؤال 4-1.\nدور الطالب: يجيبون ويتبادلون الإجابات للتصحيح.\n\n(7 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم ويلخص: الشحن انتقال للإلكترونات.\nدور الطالب: يجيبون ويكتبون خلاصة الحصة.\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n(5 دقائق) التهيئة\nدور المعلم: ينفذ عرض انحراف تيار الماء ويستقبل الفرضيات.\nدور الطالب: يلاحظون ويقترحون تفسيرات.\n\n(10 دقائق) جذب الجسم المتعادل\nدور المعلم: يوضح بالرسم على السبورة الذكية أن المشط السالب يدفع الإلكترونات في الجسم المتعادل بعيدًا فيصبح الجانب القريب موجبًا فيحدث تجاذب.\nدور الطالب: يرسمون توزيع الشحنات على قصاصة ورق قريبة من مشط سالب.\n\n(12 دقيقة) تمرين 2-1 الكهرباء الساكنة في المنزل (كتاب النشاط ص 17–18)\nدور المعلم: يوزع على المجموعات مواقف منزلية: الملابس في المجفف، الشعر والمشط، المشي على السجاد، الشاشة.\nدور الطالب: تفسر كل مجموعة موقفها بانتقال الإلكترونات وتقترح تجربة منزلية آمنة.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير جولة من مسابقة المجموعات على أسئلة الدرس.\nدور الطالب: تتنافس المجموعات في الإجابة.\n\n(5 دقائق) الختام\nدور المعلم: يجمع الأفكار الرئيسة ويكلف بالواجب.\nدور الطالب: يدونون الواجب."},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الجسيمات التي تنتقل عند دلك جسمين؟<\/td><td>الإلكترونات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قضيب أصبح سالب الشحنة بعد دلكه. هل اكتسب إلكترونات أم فقدها؟<\/td><td>اكتسب إلكترونات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا تكون شحنة القماش مساوية في المقدار لشحنة القضيب ومعاكسة لها في النوع؟<\/td><td>لأن عدد الإلكترونات التي فقدها القماش يساوي عدد الإلكترونات التي اكتسبها القضيب؛ فالشحنة تنتقل ولا تُستحدث.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر موقفًا يوميًا تظهر فيه الكهرباء الساكنة.<\/td><td>تطاير الشعر عند تمشيطه، أو وخزة مقبض السيارة، أو التصاق الملابس بعد المجفف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تنجذب قصاصات الورق المتعادلة إلى مشط مشحون؟<\/td><td>لأن شحنة المشط تعيد توزيع الإلكترونات في القصاصة فيصبح جانبها القريب بشحنة مخالفة فيحدث تجاذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح تجربة منزلية آمنة تثبت أن البالون المدلوك اكتسب شحنة، مع ذكر ما تضبطه.<\/td><td>ندلك بالونين بالشعر بالطريقة نفسها ونعلقهما متجاورين فيتنافران؛ نضبط عدد مرات الدلك ونوع المادة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n1) [مستوى الدعم] ما الجسيمات التي تنتقل عند دلك جسمين؟\nالإجابة النموذجية: الإلكترونات.\n\n2) [المستوى المتوقع] قضيب أصبح سالب الشحنة بعد دلكه. هل اكتسب إلكترونات أم فقدها؟\nالإجابة النموذجية: اكتسب إلكترونات.\n\n3) [المستوى المتقدم] لماذا تكون شحنة القماش مساوية في المقدار لشحنة القضيب ومعاكسة لها في النوع؟\nالإجابة النموذجية: لأن عدد الإلكترونات التي فقدها القماش يساوي عدد الإلكترونات التي اكتسبها القضيب؛ فالشحنة تنتقل ولا تُستحدث.\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n1) [مستوى الدعم] اذكر موقفًا يوميًا تظهر فيه الكهرباء الساكنة.\nالإجابة النموذجية: تطاير الشعر عند تمشيطه، أو وخزة مقبض السيارة، أو التصاق الملابس بعد المجفف.\n\n2) [المستوى المتوقع] لماذا تنجذب قصاصات الورق المتعادلة إلى مشط مشحون؟\nالإجابة النموذجية: لأن شحنة المشط تعيد توزيع الإلكترونات في القصاصة فيصبح جانبها القريب بشحنة مخالفة فيحدث تجاذب.\n\n3) [المستوى المتقدم] اقترح تجربة منزلية آمنة تثبت أن البالون المدلوك اكتسب شحنة، مع ذكر ما تضبطه.\nالإجابة النموذجية: ندلك بالونين بالشعر بالطريقة نفسها ونعلقهما متجاورين فيتنافران؛ نضبط عدد مرات الدلك ونوع المادة."},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يصبح الجسم موجب الشحنة عندما ......... إلكترونات.<\/td><td>يفقد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا تنتقل البروتونات عند الدلك؟<\/td><td>لأنها داخل النواة ومرتبطة بها بقوة، بينما الإلكترونات في الجزء الخارجي من الذرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>دُلك قضيب زجاجي بالحرير فأصبح موجبًا. صف بنموذج مبسط توزيع الشحنات على الجسمين قبل الدلك وبعده.<\/td><td>قبل الدلك: لكل جسم عدد متساوٍ من <bdi>(+)<\/bdi> و(−). بعده: تنتقل إلكترونات من الزجاج إلى الحرير، فيزيد عدد <bdi>(+)<\/bdi> في الزجاج فيصبح موجبًا، ويزيد عدد (−) في الحرير فيصبح سالبًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الجسم المتعادل لا يحتوي على أي شحنات.<\/td><td>خطأ؛ يحتوي على شحنات موجبة وسالبة متساوية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>فسّر التصاق الملابس ببعضها بعد خروجها من المجفف.<\/td><td>تحتك الملابس فتنتقل الإلكترونات بينها فتكتسب شحنات مختلفة فتتجاذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يقل التصاق الملابس في الجو الرطب؟<\/td><td>لأن بخار الماء في الهواء يساعد على تسرب الشحنات من الملابس فلا تتراكم.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\n1) [مستوى الدعم] أكمل: يصبح الجسم موجب الشحنة عندما ......... إلكترونات.\nالإجابة النموذجية: يفقد.\n\n2) [المستوى المتوقع] لماذا لا تنتقل البروتونات عند الدلك؟\nالإجابة النموذجية: لأنها داخل النواة ومرتبطة بها بقوة، بينما الإلكترونات في الجزء الخارجي من الذرة.\n\n3) [المستوى المتقدم] دُلك قضيب زجاجي بالحرير فأصبح موجبًا. صف بنموذج مبسط توزيع الشحنات على الجسمين قبل الدلك وبعده.\nالإجابة النموذجية: قبل الدلك: لكل جسم عدد متساوٍ من (+) و(−). بعده: تنتقل إلكترونات من الزجاج إلى الحرير، فيزيد عدد (+) في الزجاج فيصبح موجبًا، ويزيد عدد (−) في الحرير فيصبح سالبًا.\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\n1) [مستوى الدعم] صواب أم خطأ: الجسم المتعادل لا يحتوي على أي شحنات.\nالإجابة النموذجية: خطأ؛ يحتوي على شحنات موجبة وسالبة متساوية.\n\n2) [المستوى المتوقع] فسّر التصاق الملابس ببعضها بعد خروجها من المجفف.\nالإجابة النموذجية: تحتك الملابس فتنتقل الإلكترونات بينها فتكتسب شحنات مختلفة فتتجاذب.\n\n3) [المستوى المتقدم] لماذا يقل التصاق الملابس في الجو الرطب؟\nالإجابة النموذجية: لأن بخار الماء في الهواء يساعد على تسرب الشحنات من الملابس فلا تتراكم."},{"h":"<div class=\"psub\">الحصة 1: انتقال الإلكترونات عند الدلك<\/div><p>مراجعة كتاب الطالب ص 18 وحل السؤال 4-1، والاطلاع على تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18.<\/p><div class=\"psub\">الحصة 2: الكهرباء الساكنة في الحياة اليومية<\/div><p>إكمال تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18، وتنفيذ تجربة البالونين في المنزل بإشراف ولي الأمر وتسجيل الملاحظات.<\/p>","t":"الحصة 1: انتقال الإلكترونات عند الدلك\nمراجعة كتاب الطالب ص 18 وحل السؤال 4-1، والاطلاع على تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18.\n\nالحصة 2: الكهرباء الساكنة في الحياة اليومية\nإكمال تمرين 2-1 الكهرباء الساكنة في المنزل في كتاب النشاط ص 17–18، وتنفيذ تجربة البالونين في المنزل بإشراف ولي الأمر وتسجيل الملاحظات."}]}},{"label":"3-1 المجالات الكهربائية والشحنة الكهربائية","unit":"الوحدة الأولى: الشحنة الكهربائية","periods":[{"n":1,"focus":"مفهوم المجال الكهربائي","info":"<div><b>الدرس:<\/b> 3-1 المجالات الكهربائية والشحنة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19 | كتاب النشاط: ورقة العمل 1-1 ص 20، ورقة العمل 2-1 ص 21<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div><div><b>محور الحصة:<\/b> مفهوم المجال الكهربائي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف المجال الكهربائي بأنه منطقة تتعرض فيها الشحنات الكهربائية لقوة.<\/li><li>يحدد منطقة المجال حول جسم مشحون وبين جسمين مشحونين.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين المجال الكهربائي والمجال المغناطيسي من حيث ما يتأثر بكل منهما.<\/div>","t":"1. يصف المجال الكهربائي بأنه منطقة تتعرض فيها الشحنات الكهربائية لقوة.\n2. يحدد منطقة المجال حول جسم مشحون وبين جسمين مشحونين.\nمخرج تعليمي آخر: يميز بين المجال الكهربائي والمجال المغناطيسي من حيث ما يتأثر بكل منهما."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف المجال الكهربائي بأنه منطقة تتعرض فيها الشحنات الكهربائية لقوة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد منطقة المجال حول جسم مشحون وبين جسمين مشحونين.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يميز بين المجال الكهربائي والمجال المغناطيسي من حيث ما يتأثر بكل منهما.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يصف المجال الكهربائي بأنه منطقة تتعرض فيها الشحنات الكهربائية لقوة. ← فهم\n• يحدد منطقة المجال حول جسم مشحون وبين جسمين مشحونين. ← تطبيق\n• يميز بين المجال الكهربائي والمجال المغناطيسي من حيث ما يتأثر بكل منهما. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: بالون مشحون، قصاصات ورق، شريط بلاستيكي خفيف، مسطرة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: بالون مشحون، قصاصات ورق، شريط بلاستيكي خفيف، مسطرة"},{"h":"<div class=\"pills\"><span>المجال الكهربائي<\/span><span>القوة الكهربائية<\/span><span>الجسم المشحون<\/span><span>التأثير عن بعد<\/span><\/div>","t":"المجال الكهربائي، القوة الكهربائية، الجسم المشحون، التأثير عن بعد"},{"h":"<p>يقرب المعلم بالونًا مشحونًا تدريجيًا من شريط بلاستيكي خفيف معلق ويسأل: متى بدأ الشريط يتحرك؟ هل لمسه البالون؟<\/p>","t":"يقرب المعلم بالونًا مشحونًا تدريجيًا من شريط بلاستيكي خفيف معلق ويسأل: متى بدأ الشريط يتحرك؟ هل لمسه البالون؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض ويطرح السؤال.<\/td><td>يلاحظون أن التأثير يبدأ قبل التلامس.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">بناء المفهوم<\/td><td>يعرّف المجال الكهربائي ويعرض الشكل في كتاب الطالب ص 19 ومقطعًا قصيرًا عن المجال حول الأجسام المشحونة.<\/td><td>يكتبون التعريف بلغتهم ويحددون المنطقة المحيطة بالجسم.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استكشاف حدود المجال<\/td><td>يوزع بالونات وقصاصات ويطلب قياس أكبر مسافة يبدأ عندها الجذب.<\/td><td>يقيسون المسافة ويستنتجون أن تأثير المجال يضعف بالابتعاد.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمييز المجالين<\/td><td>ينبه إلى الخلط الشائع بين المجالين الكهربائي والمغناطيسي ويطرح أمثلة.<\/td><td>يصنفون أمثلة: قصاصات قرب مشط مشحون، ودبابيس حديد قرب مغناطيس.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون في بطاقات خروج.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض ويطرح السؤال.\nدور الطالب: يلاحظون أن التأثير يبدأ قبل التلامس.\n\n(10 دقائق) بناء المفهوم\nدور المعلم: يعرّف المجال الكهربائي ويعرض الشكل في كتاب الطالب ص 19 ومقطعًا قصيرًا عن المجال حول الأجسام المشحونة.\nدور الطالب: يكتبون التعريف بلغتهم ويحددون المنطقة المحيطة بالجسم.\n\n(12 دقيقة) استكشاف حدود المجال\nدور المعلم: يوزع بالونات وقصاصات ويطلب قياس أكبر مسافة يبدأ عندها الجذب.\nدور الطالب: يقيسون المسافة ويستنتجون أن تأثير المجال يضعف بالابتعاد.\n\n(8 دقائق) تمييز المجالين\nدور المعلم: ينبه إلى الخلط الشائع بين المجالين الكهربائي والمغناطيسي ويطرح أمثلة.\nدور الطالب: يصنفون أمثلة: قصاصات قرب مشط مشحون، ودبابيس حديد قرب مغناطيس.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون في بطاقات خروج."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف المجال الكهربائي.<\/td><td>منطقة تتعرض فيها الشحنات الكهربائية لقوة كهربائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أين يوجد المجال الكهربائي في حالة جسمين مشحونين متقابلين؟<\/td><td>في المنطقة المحيطة بكل منهما وفي الحيز بينهما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قصاصة تتحرك نحو بالون مشحون من مسافة 3 cm ولا تتحرك من مسافة 20 cm. ماذا تستنتج؟<\/td><td>أن المجال الكهربائي أقوى قرب الجسم المشحون ويضعف بالابتعاد حتى يصبح تأثيره غير ملحوظ.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عرّف المجال الكهربائي.\nالإجابة النموذجية: منطقة تتعرض فيها الشحنات الكهربائية لقوة كهربائية.\n\n2) [المستوى المتوقع] أين يوجد المجال الكهربائي في حالة جسمين مشحونين متقابلين؟\nالإجابة النموذجية: في المنطقة المحيطة بكل منهما وفي الحيز بينهما.\n\n3) [المستوى المتقدم] قصاصة تتحرك نحو بالون مشحون من مسافة 3 cm ولا تتحرك من مسافة 20 cm. ماذا تستنتج؟\nالإجابة النموذجية: أن المجال الكهربائي أقوى قرب الجسم المشحون ويضعف بالابتعاد حتى يصبح تأثيره غير ملحوظ."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المنطقة التي تتعرض فيها الشحنات لقوة كهربائية تسمى .........<\/td><td>المجال الكهربائي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل يلزم التلامس حتى يؤثر جسم مشحون في جسم آخر؟ فسّر.<\/td><td>لا؛ فالجسم الموجود داخل المجال الكهربائي للجسم المشحون يتعرض لقوة دون تلامس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لمقارنة قوة المجال الكهربائي لبالونين مشحونين.<\/td><td>نقيس لكل بالون أكبر مسافة تبدأ عندها قصاصة ورق بالانجذاب؛ البالون الذي يجذبها من مسافة أكبر مجاله أقوى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: المنطقة التي تتعرض فيها الشحنات لقوة كهربائية تسمى .........\nالإجابة النموذجية: المجال الكهربائي.\n\n2) [المستوى المتوقع] هل يلزم التلامس حتى يؤثر جسم مشحون في جسم آخر؟ فسّر.\nالإجابة النموذجية: لا؛ فالجسم الموجود داخل المجال الكهربائي للجسم المشحون يتعرض لقوة دون تلامس.\n\n3) [المستوى المتقدم] اقترح طريقة لمقارنة قوة المجال الكهربائي لبالونين مشحونين.\nالإجابة النموذجية: نقيس لكل بالون أكبر مسافة تبدأ عندها قصاصة ورق بالانجذاب؛ البالون الذي يجذبها من مسافة أكبر مجاله أقوى."},{"h":"<p>مراجعة كتاب الطالب ص 19 والإجابة عن السؤال 5-1، والبحث عن أجهزة تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر.<\/p>","t":"مراجعة كتاب الطالب ص 19 والإجابة عن السؤال 5-1، والبحث عن أجهزة تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر."}]},{"n":2,"focus":"سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة","info":"<div><b>الدرس:<\/b> 3-1 المجالات الكهربائية والشحنة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19 | كتاب النشاط: ورقة العمل 1-1 ص 20، ورقة العمل 2-1 ص 21<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div><div><b>محور الحصة:<\/b> سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يفسر سلوك الأجسام المشحونة عند تقريبها من أجسام مشحونة أو متعادلة.<\/li><li>يصف تطبيقات تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر والطلاء بالرذاذ.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحلل سلسلة من التجاذب والتنافر لتحديد شحنات عدة أجسام.<\/div>","t":"1. يفسر سلوك الأجسام المشحونة عند تقريبها من أجسام مشحونة أو متعادلة.\n2. يصف تطبيقات تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر والطلاء بالرذاذ.\nمخرج تعليمي آخر: يحلل سلسلة من التجاذب والتنافر لتحديد شحنات عدة أجسام."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يفسر سلوك الأجسام المشحونة عند تقريبها من أجسام مشحونة أو متعادلة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف تطبيقات تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر والطلاء بالرذاذ.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحلل سلسلة من التجاذب والتنافر لتحديد شحنات عدة أجسام.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يفسر سلوك الأجسام المشحونة عند تقريبها من أجسام مشحونة أو متعادلة. ← فهم\n• يصف تطبيقات تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر والطلاء بالرذاذ. ← فهم\n• يحلل سلسلة من التجاذب والتنافر لتحديد شحنات عدة أجسام. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"• التعلم التعاوني\n• التعلم الذاتي\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>عروض تقديمية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• صورة توضيحية\n• الأقلام"},{"h":"<div class=\"pills\"><span>آلة التصوير<\/span><span>طابعة الليزر<\/span><span>الطلاء بالرذاذ<\/span><span>التجاذب الكهربائي<\/span><\/div>","t":"آلة التصوير، طابعة الليزر، الطلاء بالرذاذ، التجاذب الكهربائي"},{"h":"<p>يعرض صورة طابعة ليزر ويسأل: كيف يلتصق مسحوق الحبر بالمواضع الصحيحة من الورقة؟<\/p>","t":"يعرض صورة طابعة ليزر ويسأل: كيف يلتصق مسحوق الحبر بالمواضع الصحيحة من الورقة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة ويطرح السؤال.<\/td><td>يتوقعون دور الشحنات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">ورقة العمل 1-1 الشحنات الكهربائية (كتاب النشاط ص 20)<\/td><td>يوزع الأسئلة على المجموعات ويتابع.<\/td><td>يحلون بالتعاون ويحددون الشحنات والقوى في كل حالة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تطبيقات الكهرباء الساكنة<\/td><td>يشرح بعرض تقديمي مبدأ آلة التصوير وطابعة الليزر وطلاء السيارات بالرذاذ.<\/td><td>تشرح كل مجموعة تطبيقًا بمخطط بسيط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تصحيح جماعي<\/td><td>يناقش إجابات ورقة العمل ويصحح الأخطاء الشائعة.<\/td><td>يصححون إجاباتهم بالأقلام الملونة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة ويطرح السؤال.\nدور الطالب: يتوقعون دور الشحنات.\n\n(12 دقيقة) ورقة العمل 1-1 الشحنات الكهربائية (كتاب النشاط ص 20)\nدور المعلم: يوزع الأسئلة على المجموعات ويتابع.\nدور الطالب: يحلون بالتعاون ويحددون الشحنات والقوى في كل حالة.\n\n(10 دقائق) تطبيقات الكهرباء الساكنة\nدور المعلم: يشرح بعرض تقديمي مبدأ آلة التصوير وطابعة الليزر وطلاء السيارات بالرذاذ.\nدور الطالب: تشرح كل مجموعة تطبيقًا بمخطط بسيط.\n\n(8 دقائق) تصحيح جماعي\nدور المعلم: يناقش إجابات ورقة العمل ويصحح الأخطاء الشائعة.\nدور الطالب: يصححون إجاباتهم بالأقلام الملونة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر تطبيقًا يستفيد من الكهرباء الساكنة.<\/td><td>آلة التصوير، أو طابعة الليزر، أو الطلاء بالرذاذ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>A يجذب B، وB يتنافر مع C، وC موجب. ما شحنة A إذا كان مشحونًا؟<\/td><td>B يتنافر مع C فهو موجب، وA يجذب B فشحنته سالبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في الطلاء بالرذاذ تُشحن قطرات الطلاء بشحنة واحدة. لماذا تنتج طبقة متجانسة؟<\/td><td>لأن القطرات المتشابهة الشحنة تتنافر فتنتشر بانتظام، وتنجذب إلى الجسم المشحون بشحنة مخالفة فتغطيه حتى أجزاءه الخلفية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر تطبيقًا يستفيد من الكهرباء الساكنة.\nالإجابة النموذجية: آلة التصوير، أو طابعة الليزر، أو الطلاء بالرذاذ.\n\n2) [المستوى المتوقع] A يجذب B، وB يتنافر مع C، وC موجب. ما شحنة A إذا كان مشحونًا؟\nالإجابة النموذجية: B يتنافر مع C فهو موجب، وA يجذب B فشحنته سالبة.\n\n3) [المستوى المتقدم] في الطلاء بالرذاذ تُشحن قطرات الطلاء بشحنة واحدة. لماذا تنتج طبقة متجانسة؟\nالإجابة النموذجية: لأن القطرات المتشابهة الشحنة تتنافر فتنتشر بانتظام، وتنجذب إلى الجسم المشحون بشحنة مخالفة فتغطيه حتى أجزاءه الخلفية."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تعتمد طابعة الليزر على التجاذب بين الشحنات المختلفة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا تتجمع قطرات الطلاء المشحونة بشحنة واحدة؟<\/td><td>لأنها متشابهة الشحنة فتتنافر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ثلاثة أجسام مشحونة: P يتنافر مع Q، وQ يجذب R، وR سالب. حدد شحنة P وQ.<\/td><td>Q يجذب R السالب فهو موجب، وP يتنافر مع Q فهو موجب.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: تعتمد طابعة الليزر على التجاذب بين الشحنات المختلفة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا لا تتجمع قطرات الطلاء المشحونة بشحنة واحدة؟\nالإجابة النموذجية: لأنها متشابهة الشحنة فتتنافر.\n\n3) [المستوى المتقدم] ثلاثة أجسام مشحونة: P يتنافر مع Q، وQ يجذب R، وR سالب. حدد شحنة P وQ.\nالإجابة النموذجية: Q يجذب R السالب فهو موجب، وP يتنافر مع Q فهو موجب."},{"h":"<p>حل ورقة العمل 1-1 الشحنات الكهربائية في كتاب النشاط ص 20 كاملة، وإعداد بطاقة عن تطبيق واحد للكهرباء الساكنة.<\/p>","t":"حل ورقة العمل 1-1 الشحنات الكهربائية في كتاب النشاط ص 20 كاملة، وإعداد بطاقة عن تطبيق واحد للكهرباء الساكنة."}]},{"n":3,"focus":"القوة على الشحنات داخل المجال الكهربائي","info":"<div><b>الدرس:<\/b> 3-1 المجالات الكهربائية والشحنة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19 | كتاب النشاط: ورقة العمل 1-1 ص 20، ورقة العمل 2-1 ص 21<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div><div><b>محور الحصة:<\/b> القوة على الشحنات داخل المجال الكهربائي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يطبق مفهوم المجال الكهربائي في حل أسئلة ورقة العمل 2-1.<\/li><li>يقارن اتجاه القوة على شحنات مختلفة داخل المجال نفسه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تفسيرات مقترحة لمواقف الكهرباء الساكنة ويصحح الخاطئ منها.<\/div>","t":"1. يطبق مفهوم المجال الكهربائي في حل أسئلة ورقة العمل 2-1.\n2. يقارن اتجاه القوة على شحنات مختلفة داخل المجال نفسه.\nمخرج تعليمي آخر: يقيّم تفسيرات مقترحة لمواقف الكهرباء الساكنة ويصحح الخاطئ منها."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يطبق مفهوم المجال الكهربائي في حل أسئلة ورقة العمل 2-1.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن اتجاه القوة على شحنات مختلفة داخل المجال نفسه.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم تفسيرات مقترحة لمواقف الكهرباء الساكنة ويصحح الخاطئ منها.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يطبق مفهوم المجال الكهربائي في حل أسئلة ورقة العمل 2-1. ← تطبيق\n• يقارن اتجاه القوة على شحنات مختلفة داخل المجال نفسه. ← تحليل\n• يقيّم تفسيرات مقترحة لمواقف الكهرباء الساكنة ويصحح الخاطئ منها. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم الذاتي<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم الذاتي\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"pills\"><span>المجال الكهربائي<\/span><span>اتجاه القوة الكهربائية<\/span><span>شحنة اختبار<\/span><span>قوة الجذب والتنافر<\/span><\/div>","t":"المجال الكهربائي، اتجاه القوة الكهربائية، شحنة اختبار، قوة الجذب والتنافر"},{"h":"<p>لعبة «صح أم خطأ» سريعة ببطاقات على خمس عبارات من الحصتين السابقتين.<\/p>","t":"لعبة «صح أم خطأ» سريعة ببطاقات على خمس عبارات من الحصتين السابقتين."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض خمس عبارات سريعة.<\/td><td>يرفعون بطاقة صح أو خطأ ويبررون.<\/td><\/tr><tr><td class=\"tm\">14 د<\/td><td class=\"st\">ورقة العمل 2-1 المجالات الكهربائية (كتاب النشاط ص 21)<\/td><td>يوجه إلى الحل الفردي أولًا ثم المقارنة.<\/td><td>يحلون فرديًا ثم يقارنون مع الزميل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تحليل مواقف<\/td><td>يعرض حالة شحنة موجبة صغيرة وأخرى سالبة داخل مجال جسم موجب كبير، ويسأل عن اتجاه القوة على كل منهما.<\/td><td>يستنتجون أن الموجبة تُدفع بعيدًا والسالبة تنجذب نحو الجسم.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير مسابقة الدرس للحصص الثلاث.<\/td><td>يتنافسون ويناقشون الأخطاء.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص ويكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(6 دقائق) التهيئة\nدور المعلم: يعرض خمس عبارات سريعة.\nدور الطالب: يرفعون بطاقة صح أو خطأ ويبررون.\n\n(14 دقيقة) ورقة العمل 2-1 المجالات الكهربائية (كتاب النشاط ص 21)\nدور المعلم: يوجه إلى الحل الفردي أولًا ثم المقارنة.\nدور الطالب: يحلون فرديًا ثم يقارنون مع الزميل.\n\n(8 دقائق) تحليل مواقف\nدور المعلم: يعرض حالة شحنة موجبة صغيرة وأخرى سالبة داخل مجال جسم موجب كبير، ويسأل عن اتجاه القوة على كل منهما.\nدور الطالب: يستنتجون أن الموجبة تُدفع بعيدًا والسالبة تنجذب نحو الجسم.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير مسابقة الدرس للحصص الثلاث.\nدور الطالب: يتنافسون ويناقشون الأخطاء.\n\n(3 دقائق) الختام\nدور المعلم: يلخص ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لشحنة سالبة صغيرة توضع في مجال جسم موجب؟<\/td><td>تنجذب نحو الجسم الموجب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>شحنتان صغيرتان موجبة وسالبة داخل مجال جسم سالب. قارن اتجاه القوة عليهما.<\/td><td>الموجبة تنجذب نحو الجسم السالب والسالبة تُدفع بعيدًا عنه؛ أي في اتجاهين متعاكسين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قال طالب: «القوة الكهربائية تحتاج إلى تلامس مثل الدفع باليد». قيّم العبارة.<\/td><td>خاطئة؛ فالقوة الكهربائية تؤثر في أي شحنة داخل المجال الكهربائي دون تلامس.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث لشحنة سالبة صغيرة توضع في مجال جسم موجب؟\nالإجابة النموذجية: تنجذب نحو الجسم الموجب.\n\n2) [المستوى المتوقع] شحنتان صغيرتان موجبة وسالبة داخل مجال جسم سالب. قارن اتجاه القوة عليهما.\nالإجابة النموذجية: الموجبة تنجذب نحو الجسم السالب والسالبة تُدفع بعيدًا عنه؛ أي في اتجاهين متعاكسين.\n\n3) [المستوى المتقدم] قال طالب: «القوة الكهربائية تحتاج إلى تلامس مثل الدفع باليد». قيّم العبارة.\nالإجابة النموذجية: خاطئة؛ فالقوة الكهربائية تؤثر في أي شحنة داخل المجال الكهربائي دون تلامس."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تؤثر القوة الكهربائية في الشحنات الموجودة داخل .........<\/td><td>المجال الكهربائي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تتحرك قصاصة ورق نحو مشط مشحون قبل أن يلمسها؟<\/td><td>لأنها داخل المجال الكهربائي للمشط فتتعرض لقوة جذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نُقلت شحنة اختبار موجبة من نقطة قريبة من جسم مشحون إلى نقطة أبعد. كيف تتغير القوة عليها؟ وعلام يدل ذلك؟<\/td><td>تقل القوة؛ وهذا يدل على أن المجال الكهربائي يضعف بالابتعاد عن الجسم المشحون.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تؤثر القوة الكهربائية في الشحنات الموجودة داخل .........\nالإجابة النموذجية: المجال الكهربائي.\n\n2) [المستوى المتوقع] لماذا تتحرك قصاصة ورق نحو مشط مشحون قبل أن يلمسها؟\nالإجابة النموذجية: لأنها داخل المجال الكهربائي للمشط فتتعرض لقوة جذب.\n\n3) [المستوى المتقدم] نُقلت شحنة اختبار موجبة من نقطة قريبة من جسم مشحون إلى نقطة أبعد. كيف تتغير القوة عليها؟ وعلام يدل ذلك؟\nالإجابة النموذجية: تقل القوة؛ وهذا يدل على أن المجال الكهربائي يضعف بالابتعاد عن الجسم المشحون."},{"h":"<p>إكمال ورقة العمل 2-1 المجالات الكهربائية في كتاب النشاط ص 21، ومراجعة كتاب الطالب ص 18–19 استعدادًا لموضوع الموصلات والعوازل.<\/p>","t":"إكمال ورقة العمل 2-1 المجالات الكهربائية في كتاب النشاط ص 21، ومراجعة كتاب الطالب ص 18–19 استعدادًا لموضوع الموصلات والعوازل."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-1 المجالات الكهربائية والشحنة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثاني (13–17/9/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 19 | كتاب النشاط: ورقة العمل 1-1 ص 20، ورقة العمل 2-1 ص 21<\/div><div><b>دليل المعلم:<\/b> ص 22–23<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><ol class=\"ol\"><li>يصف المجال الكهربائي بأنه منطقة تتعرض فيها الشحنات الكهربائية لقوة.<\/li><li>يحدد منطقة المجال حول جسم مشحون وبين جسمين مشحونين.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يميز بين المجال الكهربائي والمجال المغناطيسي من حيث ما يتأثر بكل منهما.<\/div><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><ol class=\"ol\"><li>يفسر سلوك الأجسام المشحونة عند تقريبها من أجسام مشحونة أو متعادلة.<\/li><li>يصف تطبيقات تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر والطلاء بالرذاذ.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحلل سلسلة من التجاذب والتنافر لتحديد شحنات عدة أجسام.<\/div><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><ol class=\"ol\"><li>يطبق مفهوم المجال الكهربائي في حل أسئلة ورقة العمل 2-1.<\/li><li>يقارن اتجاه القوة على شحنات مختلفة داخل المجال نفسه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تفسيرات مقترحة لمواقف الكهرباء الساكنة ويصحح الخاطئ منها.<\/div>","t":"الحصة 1: مفهوم المجال الكهربائي\n1. يصف المجال الكهربائي بأنه منطقة تتعرض فيها الشحنات الكهربائية لقوة.\n2. يحدد منطقة المجال حول جسم مشحون وبين جسمين مشحونين.\nمخرج تعليمي آخر: يميز بين المجال الكهربائي والمجال المغناطيسي من حيث ما يتأثر بكل منهما.\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\n1. يفسر سلوك الأجسام المشحونة عند تقريبها من أجسام مشحونة أو متعادلة.\n2. يصف تطبيقات تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر والطلاء بالرذاذ.\nمخرج تعليمي آخر: يحلل سلسلة من التجاذب والتنافر لتحديد شحنات عدة أجسام.\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\n1. يطبق مفهوم المجال الكهربائي في حل أسئلة ورقة العمل 2-1.\n2. يقارن اتجاه القوة على شحنات مختلفة داخل المجال نفسه.\nمخرج تعليمي آخر: يقيّم تفسيرات مقترحة لمواقف الكهرباء الساكنة ويصحح الخاطئ منها."},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/
