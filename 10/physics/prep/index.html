يكي خفيف، مسطرة\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\n• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• صورة توضيحية\n• الأقلام\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><div class=\"pills\"><span>المجال الكهربائي<\/span><span>القوة الكهربائية<\/span><span>الجسم المشحون<\/span><span>التأثير عن بعد<\/span><\/div><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><div class=\"pills\"><span>آلة التصوير<\/span><span>طابعة الليزر<\/span><span>الطلاء بالرذاذ<\/span><span>التجاذب الكهربائي<\/span><\/div><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><div class=\"pills\"><span>المجال الكهربائي<\/span><span>اتجاه القوة الكهربائية<\/span><span>شحنة اختبار<\/span><span>قوة الجذب والتنافر<\/span><\/div>","t":"الحصة 1: مفهوم المجال الكهربائي\nالمجال الكهربائي، القوة الكهربائية، الجسم المشحون، التأثير عن بعد\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\nآلة التصوير، طابعة الليزر، الطلاء بالرذاذ، التجاذب الكهربائي\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\nالمجال الكهربائي، اتجاه القوة الكهربائية، شحنة اختبار، قوة الجذب والتنافر"},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><p>يقرب المعلم بالونًا مشحونًا تدريجيًا من شريط بلاستيكي خفيف معلق ويسأل: متى بدأ الشريط يتحرك؟ هل لمسه البالون؟<\/p><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><p>يعرض صورة طابعة ليزر ويسأل: كيف يلتصق مسحوق الحبر بالمواضع الصحيحة من الورقة؟<\/p><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><p>لعبة «صح أم خطأ» سريعة ببطاقات على خمس عبارات من الحصتين السابقتين.<\/p>","t":"الحصة 1: مفهوم المجال الكهربائي\nيقرب المعلم بالونًا مشحونًا تدريجيًا من شريط بلاستيكي خفيف معلق ويسأل: متى بدأ الشريط يتحرك؟ هل لمسه البالون؟\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\nيعرض صورة طابعة ليزر ويسأل: كيف يلتصق مسحوق الحبر بالمواضع الصحيحة من الورقة؟\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\nلعبة «صح أم خطأ» سريعة ببطاقات على خمس عبارات من الحصتين السابقتين."},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض ويطرح السؤال.<\/td><td>يلاحظون أن التأثير يبدأ قبل التلامس.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">بناء المفهوم<\/td><td>يعرّف المجال الكهربائي ويعرض الشكل في كتاب الطالب ص 19 ومقطعًا قصيرًا عن المجال حول الأجسام المشحونة.<\/td><td>يكتبون التعريف بلغتهم ويحددون المنطقة المحيطة بالجسم.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استكشاف حدود المجال<\/td><td>يوزع بالونات وقصاصات ويطلب قياس أكبر مسافة يبدأ عندها الجذب.<\/td><td>يقيسون المسافة ويستنتجون أن تأثير المجال يضعف بالابتعاد.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمييز المجالين<\/td><td>ينبه إلى الخلط الشائع بين المجالين الكهربائي والمغناطيسي ويطرح أمثلة.<\/td><td>يصنفون أمثلة: قصاصات قرب مشط مشحون، ودبابيس حديد قرب مغناطيس.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون في بطاقات خروج.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة ويطرح السؤال.<\/td><td>يتوقعون دور الشحنات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">ورقة العمل 1-1 الشحنات الكهربائية (كتاب النشاط ص 20)<\/td><td>يوزع الأسئلة على المجموعات ويتابع.<\/td><td>يحلون بالتعاون ويحددون الشحنات والقوى في كل حالة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تطبيقات الكهرباء الساكنة<\/td><td>يشرح بعرض تقديمي مبدأ آلة التصوير وطابعة الليزر وطلاء السيارات بالرذاذ.<\/td><td>تشرح كل مجموعة تطبيقًا بمخطط بسيط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تصحيح جماعي<\/td><td>يناقش إجابات ورقة العمل ويصحح الأخطاء الشائعة.<\/td><td>يصححون إجاباتهم بالأقلام الملونة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض خمس عبارات سريعة.<\/td><td>يرفعون بطاقة صح أو خطأ ويبررون.<\/td><\/tr><tr><td class=\"tm\">14 د<\/td><td class=\"st\">ورقة العمل 2-1 المجالات الكهربائية (كتاب النشاط ص 21)<\/td><td>يوجه إلى الحل الفردي أولًا ثم المقارنة.<\/td><td>يحلون فرديًا ثم يقارنون مع الزميل.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تحليل مواقف<\/td><td>يعرض حالة شحنة موجبة صغيرة وأخرى سالبة داخل مجال جسم موجب كبير، ويسأل عن اتجاه القوة على كل منهما.<\/td><td>يستنتجون أن الموجبة تُدفع بعيدًا والسالبة تنجذب نحو الجسم.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير مسابقة الدرس للحصص الثلاث.<\/td><td>يتنافسون ويناقشون الأخطاء.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص ويكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم المجال الكهربائي\n(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض ويطرح السؤال.\nدور الطالب: يلاحظون أن التأثير يبدأ قبل التلامس.\n\n(10 دقائق) بناء المفهوم\nدور المعلم: يعرّف المجال الكهربائي ويعرض الشكل في كتاب الطالب ص 19 ومقطعًا قصيرًا عن المجال حول الأجسام المشحونة.\nدور الطالب: يكتبون التعريف بلغتهم ويحددون المنطقة المحيطة بالجسم.\n\n(12 دقيقة) استكشاف حدود المجال\nدور المعلم: يوزع بالونات وقصاصات ويطلب قياس أكبر مسافة يبدأ عندها الجذب.\nدور الطالب: يقيسون المسافة ويستنتجون أن تأثير المجال يضعف بالابتعاد.\n\n(8 دقائق) تمييز المجالين\nدور المعلم: ينبه إلى الخلط الشائع بين المجالين الكهربائي والمغناطيسي ويطرح أمثلة.\nدور الطالب: يصنفون أمثلة: قصاصات قرب مشط مشحون، ودبابيس حديد قرب مغناطيس.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون في بطاقات خروج.\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة ويطرح السؤال.\nدور الطالب: يتوقعون دور الشحنات.\n\n(12 دقيقة) ورقة العمل 1-1 الشحنات الكهربائية (كتاب النشاط ص 20)\nدور المعلم: يوزع الأسئلة على المجموعات ويتابع.\nدور الطالب: يحلون بالتعاون ويحددون الشحنات والقوى في كل حالة.\n\n(10 دقائق) تطبيقات الكهرباء الساكنة\nدور المعلم: يشرح بعرض تقديمي مبدأ آلة التصوير وطابعة الليزر وطلاء السيارات بالرذاذ.\nدور الطالب: تشرح كل مجموعة تطبيقًا بمخطط بسيط.\n\n(8 دقائق) تصحيح جماعي\nدور المعلم: يناقش إجابات ورقة العمل ويصحح الأخطاء الشائعة.\nدور الطالب: يصححون إجاباتهم بالأقلام الملونة.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\n(6 دقائق) التهيئة\nدور المعلم: يعرض خمس عبارات سريعة.\nدور الطالب: يرفعون بطاقة صح أو خطأ ويبررون.\n\n(14 دقيقة) ورقة العمل 2-1 المجالات الكهربائية (كتاب النشاط ص 21)\nدور المعلم: يوجه إلى الحل الفردي أولًا ثم المقارنة.\nدور الطالب: يحلون فرديًا ثم يقارنون مع الزميل.\n\n(8 دقائق) تحليل مواقف\nدور المعلم: يعرض حالة شحنة موجبة صغيرة وأخرى سالبة داخل مجال جسم موجب كبير، ويسأل عن اتجاه القوة على كل منهما.\nدور الطالب: يستنتجون أن الموجبة تُدفع بعيدًا والسالبة تنجذب نحو الجسم.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير مسابقة الدرس للحصص الثلاث.\nدور الطالب: يتنافسون ويناقشون الأخطاء.\n\n(3 دقائق) الختام\nدور المعلم: يلخص ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف المجال الكهربائي.<\/td><td>منطقة تتعرض فيها الشحنات الكهربائية لقوة كهربائية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أين يوجد المجال الكهربائي في حالة جسمين مشحونين متقابلين؟<\/td><td>في المنطقة المحيطة بكل منهما وفي الحيز بينهما.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قصاصة تتحرك نحو بالون مشحون من مسافة 3 cm ولا تتحرك من مسافة 20 cm. ماذا تستنتج؟<\/td><td>أن المجال الكهربائي أقوى قرب الجسم المشحون ويضعف بالابتعاد حتى يصبح تأثيره غير ملحوظ.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر تطبيقًا يستفيد من الكهرباء الساكنة.<\/td><td>آلة التصوير، أو طابعة الليزر، أو الطلاء بالرذاذ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>A يجذب B، وB يتنافر مع C، وC موجب. ما شحنة A إذا كان مشحونًا؟<\/td><td>B يتنافر مع C فهو موجب، وA يجذب B فشحنته سالبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في الطلاء بالرذاذ تُشحن قطرات الطلاء بشحنة واحدة. لماذا تنتج طبقة متجانسة؟<\/td><td>لأن القطرات المتشابهة الشحنة تتنافر فتنتشر بانتظام، وتنجذب إلى الجسم المشحون بشحنة مخالفة فتغطيه حتى أجزاءه الخلفية.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لشحنة سالبة صغيرة توضع في مجال جسم موجب؟<\/td><td>تنجذب نحو الجسم الموجب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>شحنتان صغيرتان موجبة وسالبة داخل مجال جسم سالب. قارن اتجاه القوة عليهما.<\/td><td>الموجبة تنجذب نحو الجسم السالب والسالبة تُدفع بعيدًا عنه؛ أي في اتجاهين متعاكسين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قال طالب: «القوة الكهربائية تحتاج إلى تلامس مثل الدفع باليد». قيّم العبارة.<\/td><td>خاطئة؛ فالقوة الكهربائية تؤثر في أي شحنة داخل المجال الكهربائي دون تلامس.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم المجال الكهربائي\n1) [مستوى الدعم] عرّف المجال الكهربائي.\nالإجابة النموذجية: منطقة تتعرض فيها الشحنات الكهربائية لقوة كهربائية.\n\n2) [المستوى المتوقع] أين يوجد المجال الكهربائي في حالة جسمين مشحونين متقابلين؟\nالإجابة النموذجية: في المنطقة المحيطة بكل منهما وفي الحيز بينهما.\n\n3) [المستوى المتقدم] قصاصة تتحرك نحو بالون مشحون من مسافة 3 cm ولا تتحرك من مسافة 20 cm. ماذا تستنتج؟\nالإجابة النموذجية: أن المجال الكهربائي أقوى قرب الجسم المشحون ويضعف بالابتعاد حتى يصبح تأثيره غير ملحوظ.\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\n1) [مستوى الدعم] اذكر تطبيقًا يستفيد من الكهرباء الساكنة.\nالإجابة النموذجية: آلة التصوير، أو طابعة الليزر، أو الطلاء بالرذاذ.\n\n2) [المستوى المتوقع] A يجذب B، وB يتنافر مع C، وC موجب. ما شحنة A إذا كان مشحونًا؟\nالإجابة النموذجية: B يتنافر مع C فهو موجب، وA يجذب B فشحنته سالبة.\n\n3) [المستوى المتقدم] في الطلاء بالرذاذ تُشحن قطرات الطلاء بشحنة واحدة. لماذا تنتج طبقة متجانسة؟\nالإجابة النموذجية: لأن القطرات المتشابهة الشحنة تتنافر فتنتشر بانتظام، وتنجذب إلى الجسم المشحون بشحنة مخالفة فتغطيه حتى أجزاءه الخلفية.\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\n1) [مستوى الدعم] ماذا يحدث لشحنة سالبة صغيرة توضع في مجال جسم موجب؟\nالإجابة النموذجية: تنجذب نحو الجسم الموجب.\n\n2) [المستوى المتوقع] شحنتان صغيرتان موجبة وسالبة داخل مجال جسم سالب. قارن اتجاه القوة عليهما.\nالإجابة النموذجية: الموجبة تنجذب نحو الجسم السالب والسالبة تُدفع بعيدًا عنه؛ أي في اتجاهين متعاكسين.\n\n3) [المستوى المتقدم] قال طالب: «القوة الكهربائية تحتاج إلى تلامس مثل الدفع باليد». قيّم العبارة.\nالإجابة النموذجية: خاطئة؛ فالقوة الكهربائية تؤثر في أي شحنة داخل المجال الكهربائي دون تلامس."},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المنطقة التي تتعرض فيها الشحنات لقوة كهربائية تسمى .........<\/td><td>المجال الكهربائي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>هل يلزم التلامس حتى يؤثر جسم مشحون في جسم آخر؟ فسّر.<\/td><td>لا؛ فالجسم الموجود داخل المجال الكهربائي للجسم المشحون يتعرض لقوة دون تلامس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لمقارنة قوة المجال الكهربائي لبالونين مشحونين.<\/td><td>نقيس لكل بالون أكبر مسافة تبدأ عندها قصاصة ورق بالانجذاب؛ البالون الذي يجذبها من مسافة أكبر مجاله أقوى.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: تعتمد طابعة الليزر على التجاذب بين الشحنات المختلفة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا تتجمع قطرات الطلاء المشحونة بشحنة واحدة؟<\/td><td>لأنها متشابهة الشحنة فتتنافر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ثلاثة أجسام مشحونة: P يتنافر مع Q، وQ يجذب R، وR سالب. حدد شحنة P وQ.<\/td><td>Q يجذب R السالب فهو موجب، وP يتنافر مع Q فهو موجب.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تؤثر القوة الكهربائية في الشحنات الموجودة داخل .........<\/td><td>المجال الكهربائي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تتحرك قصاصة ورق نحو مشط مشحون قبل أن يلمسها؟<\/td><td>لأنها داخل المجال الكهربائي للمشط فتتعرض لقوة جذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نُقلت شحنة اختبار موجبة من نقطة قريبة من جسم مشحون إلى نقطة أبعد. كيف تتغير القوة عليها؟ وعلام يدل ذلك؟<\/td><td>تقل القوة؛ وهذا يدل على أن المجال الكهربائي يضعف بالابتعاد عن الجسم المشحون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم المجال الكهربائي\n1) [مستوى الدعم] أكمل: المنطقة التي تتعرض فيها الشحنات لقوة كهربائية تسمى .........\nالإجابة النموذجية: المجال الكهربائي.\n\n2) [المستوى المتوقع] هل يلزم التلامس حتى يؤثر جسم مشحون في جسم آخر؟ فسّر.\nالإجابة النموذجية: لا؛ فالجسم الموجود داخل المجال الكهربائي للجسم المشحون يتعرض لقوة دون تلامس.\n\n3) [المستوى المتقدم] اقترح طريقة لمقارنة قوة المجال الكهربائي لبالونين مشحونين.\nالإجابة النموذجية: نقيس لكل بالون أكبر مسافة تبدأ عندها قصاصة ورق بالانجذاب؛ البالون الذي يجذبها من مسافة أكبر مجاله أقوى.\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\n1) [مستوى الدعم] صواب أم خطأ: تعتمد طابعة الليزر على التجاذب بين الشحنات المختلفة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا لا تتجمع قطرات الطلاء المشحونة بشحنة واحدة؟\nالإجابة النموذجية: لأنها متشابهة الشحنة فتتنافر.\n\n3) [المستوى المتقدم] ثلاثة أجسام مشحونة: P يتنافر مع Q، وQ يجذب R، وR سالب. حدد شحنة P وQ.\nالإجابة النموذجية: Q يجذب R السالب فهو موجب، وP يتنافر مع Q فهو موجب.\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\n1) [مستوى الدعم] أكمل: تؤثر القوة الكهربائية في الشحنات الموجودة داخل .........\nالإجابة النموذجية: المجال الكهربائي.\n\n2) [المستوى المتوقع] لماذا تتحرك قصاصة ورق نحو مشط مشحون قبل أن يلمسها؟\nالإجابة النموذجية: لأنها داخل المجال الكهربائي للمشط فتتعرض لقوة جذب.\n\n3) [المستوى المتقدم] نُقلت شحنة اختبار موجبة من نقطة قريبة من جسم مشحون إلى نقطة أبعد. كيف تتغير القوة عليها؟ وعلام يدل ذلك؟\nالإجابة النموذجية: تقل القوة؛ وهذا يدل على أن المجال الكهربائي يضعف بالابتعاد عن الجسم المشحون."},{"h":"<div class=\"psub\">الحصة 1: مفهوم المجال الكهربائي<\/div><p>مراجعة كتاب الطالب ص 19 والإجابة عن السؤال 5-1، والبحث عن أجهزة تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر.<\/p><div class=\"psub\">الحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة<\/div><p>حل ورقة العمل 1-1 الشحنات الكهربائية في كتاب النشاط ص 20 كاملة، وإعداد بطاقة عن تطبيق واحد للكهرباء الساكنة.<\/p><div class=\"psub\">الحصة 3: القوة على الشحنات داخل المجال الكهربائي<\/div><p>إكمال ورقة العمل 2-1 المجالات الكهربائية في كتاب النشاط ص 21، ومراجعة كتاب الطالب ص 18–19 استعدادًا لموضوع الموصلات والعوازل.<\/p>","t":"الحصة 1: مفهوم المجال الكهربائي\nمراجعة كتاب الطالب ص 19 والإجابة عن السؤال 5-1، والبحث عن أجهزة تعتمد على الكهرباء الساكنة مثل آلة التصوير وطابعة الليزر.\n\nالحصة 2: سلوك الأجسام المشحونة وتطبيقات الكهرباء الساكنة\nحل ورقة العمل 1-1 الشحنات الكهربائية في كتاب النشاط ص 20 كاملة، وإعداد بطاقة عن تطبيق واحد للكهرباء الساكنة.\n\nالحصة 3: القوة على الشحنات داخل المجال الكهربائي\nإكمال ورقة العمل 2-1 المجالات الكهربائية في كتاب النشاط ص 21، ومراجعة كتاب الطالب ص 18–19 استعدادًا لموضوع الموصلات والعوازل."}]}},{"label":"4-1 الموصلات الكهربائية والعوازل","unit":"الوحدة الأولى: الشحنة الكهربائية","periods":[{"n":1,"focus":"الإلكترونات الحرة والتمييز بين الموصلات والعوازل","info":"<div><b>الدرس:<\/b> 4-1 الموصلات الكهربائية والعوازل<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 20–22 | كتاب النشاط: تمرين 3-1 ص 19<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يميز بين الموصلات الكهربائية والعوازل ويقدم أمثلة عليهما.<\/li><li>يفسر الفرق بينهما بوجود الإلكترونات الحرة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصنف مواد شائعة إلى موصلة وعازلة باختبار عملي.<\/div>","t":"1. يميز بين الموصلات الكهربائية والعوازل ويقدم أمثلة عليهما.\n2. يفسر الفرق بينهما بوجود الإلكترونات الحرة.\nمخرج تعليمي آخر: يصنف مواد شائعة إلى موصلة وعازلة باختبار عملي."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يميز بين الموصلات الكهربائية والعوازل ويقدم أمثلة عليهما.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر الفرق بينهما بوجود الإلكترونات الحرة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصنف مواد شائعة إلى موصلة وعازلة باختبار عملي.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يميز بين الموصلات الكهربائية والعوازل ويقدم أمثلة عليهما. ← فهم\n• يفسر الفرق بينهما بوجود الإلكترونات الحرة. ← فهم\n• يصنف مواد شائعة إلى موصلة وعازلة باختبار عملي. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: خلية، مصباح، أسلاك توصيل، عينات (مسمار، ممحاة، قلم رصاص، ملعقة، مسطرة بلاستيكية، ورق)<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: خلية، مصباح، أسلاك توصيل، عينات (مسمار، ممحاة، قلم رصاص، ملعقة، مسطرة بلاستيكية، ورق)"},{"h":"<div class=\"pills\"><span>الموصل الكهربائي<\/span><span>العازل الكهربائي<\/span><span>الإلكترونات الحرة<\/span><span>التيار الكهربائي<\/span><\/div>","t":"الموصل الكهربائي، العازل الكهربائي، الإلكترونات الحرة، التيار الكهربائي"},{"h":"<p>يعرض سلكًا كهربائيًا مقشورًا جزئيًا ويسأل: لماذا تُصنع الأسلاك من النحاس وتُغلف بالبلاستيك؟<\/p>","t":"يعرض سلكًا كهربائيًا مقشورًا جزئيًا ويسأل: لماذا تُصنع الأسلاك من النحاس وتُغلف بالبلاستيك؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض السلك ويطرح السؤال.<\/td><td>يقترحون إجابات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">اختبار التوصيل<\/td><td>يوجه المجموعات إلى بناء دائرة بسيطة فيها فجوة لاختبار المواد.<\/td><td>يختبرون العينات ويصنفونها في جدول: موصلة أو عازلة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التفسير بالإلكترونات الحرة<\/td><td>يشرح بنموذج على السبورة الذكية أن الفلزات فيها إلكترونات حرة الحركة، أما إلكترونات العوازل فمرتبطة بذراتها.<\/td><td>يربطون نتائجهم بالنموذج ويلاحظون أن الجرافيت موصل مع أنه ليس فلزًا.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">قراءة موجهة (كتاب الطالب ص 20–21)<\/td><td>يوجه إلى القراءة واستخراج الأمثلة.<\/td><td>يستخرجون أمثلة الموصلات والعوازل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض السلك ويطرح السؤال.\nدور الطالب: يقترحون إجابات.\n\n(13 دقيقة) اختبار التوصيل\nدور المعلم: يوجه المجموعات إلى بناء دائرة بسيطة فيها فجوة لاختبار المواد.\nدور الطالب: يختبرون العينات ويصنفونها في جدول: موصلة أو عازلة.\n\n(10 دقائق) التفسير بالإلكترونات الحرة\nدور المعلم: يشرح بنموذج على السبورة الذكية أن الفلزات فيها إلكترونات حرة الحركة، أما إلكترونات العوازل فمرتبطة بذراتها.\nدور الطالب: يربطون نتائجهم بالنموذج ويلاحظون أن الجرافيت موصل مع أنه ليس فلزًا.\n\n(7 دقائق) قراءة موجهة (كتاب الطالب ص 20–21)\nدور المعلم: يوجه إلى القراءة واستخراج الأمثلة.\nدور الطالب: يستخرجون أمثلة الموصلات والعوازل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر مثالين على موصلات ومثالين على عوازل.<\/td><td>موصلات: النحاس والألومنيوم. عوازل: البلاستيك والمطاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُعد الفلزات موصلات جيدة للكهرباء؟<\/td><td>لاحتوائها على إلكترونات حرة تتحرك خلالها حاملة التيار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُصنع مقبض مفك الكهربائي من البلاستيك ورأسه من الفلز؟<\/td><td>الرأس الفلزي موصل يلامس الأجزاء المراد إصلاحها، والمقبض البلاستيكي عازل يمنع وصول التيار إلى يد العامل.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر مثالين على موصلات ومثالين على عوازل.\nالإجابة النموذجية: موصلات: النحاس والألومنيوم. عوازل: البلاستيك والمطاط.\n\n2) [المستوى المتوقع] لماذا تُعد الفلزات موصلات جيدة للكهرباء؟\nالإجابة النموذجية: لاحتوائها على إلكترونات حرة تتحرك خلالها حاملة التيار.\n\n3) [المستوى المتقدم] لماذا يُصنع مقبض مفك الكهربائي من البلاستيك ورأسه من الفلز؟\nالإجابة النموذجية: الرأس الفلزي موصل يلامس الأجزاء المراد إصلاحها، والمقبض البلاستيكي عازل يمنع وصول التيار إلى يد العامل."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الإلكترونات التي تتحرك بحرية داخل المادة تسمى .........<\/td><td>الإلكترونات الحرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صنّف: النحاس، المطاط، الألومنيوم، الخشب الجاف.<\/td><td>موصلات: النحاس والألومنيوم. عوازل: المطاط والخشب الجاف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أضاء المصباح عند وضع قلم رصاص في الفجوة. هل يعني ذلك أن كل الموصلات فلزات؟ فسّر.<\/td><td>لا؛ الجرافيت لافلز لكنه موصل لاحتوائه على إلكترونات حرة، فالتوصيل يعتمد على وجود الإلكترونات الحرة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الإلكترونات التي تتحرك بحرية داخل المادة تسمى .........\nالإجابة النموذجية: الإلكترونات الحرة.\n\n2) [المستوى المتوقع] صنّف: النحاس، المطاط، الألومنيوم، الخشب الجاف.\nالإجابة النموذجية: موصلات: النحاس والألومنيوم. عوازل: المطاط والخشب الجاف.\n\n3) [المستوى المتقدم] أضاء المصباح عند وضع قلم رصاص في الفجوة. هل يعني ذلك أن كل الموصلات فلزات؟ فسّر.\nالإجابة النموذجية: لا؛ الجرافيت لافلز لكنه موصل لاحتوائه على إلكترونات حرة، فالتوصيل يعتمد على وجود الإلكترونات الحرة."},{"h":"<p>مراجعة كتاب الطالب ص 20–21 وحل السؤال 7-1، وحل تمرين 3-1 الموصلات الكهربائية والعوازل في كتاب النشاط ص 19.<\/p>","t":"مراجعة كتاب الطالب ص 20–21 وحل السؤال 7-1، وحل تمرين 3-1 الموصلات الكهربائية والعوازل في كتاب النشاط ص 19."}]},{"n":2,"focus":"الاحتفاظ بالشحنة الساكنة وتفريغها بأمان","info":"<div><b>الدرس:<\/b> 4-1 الموصلات الكهربائية والعوازل<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 20–22 | كتاب النشاط: تمرين 3-1 ص 19<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يفسر احتفاظ العوازل بالشحنة الساكنة وصعوبة شحن الموصل الممسوك باليد.<\/li><li>يوضح أن الموصل يحتفظ بشحنته إذا حُمل على مادة عازلة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح إجراءات لتفريغ الشحنات المتراكمة بأمان في مواقف مثل تعبئة الوقود.<\/div>","t":"1. يفسر احتفاظ العوازل بالشحنة الساكنة وصعوبة شحن الموصل الممسوك باليد.\n2. يوضح أن الموصل يحتفظ بشحنته إذا حُمل على مادة عازلة.\nمخرج تعليمي آخر: يقترح إجراءات لتفريغ الشحنات المتراكمة بأمان في مواقف مثل تعبئة الوقود."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يفسر احتفاظ العوازل بالشحنة الساكنة وصعوبة شحن الموصل الممسوك باليد.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يوضح أن الموصل يحتفظ بشحنته إذا حُمل على مادة عازلة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح إجراءات لتفريغ الشحنات المتراكمة بأمان في مواقف مثل تعبئة الوقود.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يفسر احتفاظ العوازل بالشحنة الساكنة وصعوبة شحن الموصل الممسوك باليد. ← فهم\n• يوضح أن الموصل يحتفظ بشحنته إذا حُمل على مادة عازلة. ← فهم\n• يقترح إجراءات لتفريغ الشحنات المتراكمة بأمان في مواقف مثل تعبئة الوقود. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم بالاكتشاف<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التشاركي\n• التعلم بالاكتشاف"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: قضيب فلزي بمقبض بلاستيكي، قضيب أبونايت، قطعة صوف، ملعقة فلزية، قصاصات ورق<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: قضيب فلزي بمقبض بلاستيكي، قضيب أبونايت، قطعة صوف، ملعقة فلزية، قصاصات ورق"},{"h":"<div class=\"pills\"><span>الاحتفاظ بالشحنة<\/span><span>تسرب الشحنة<\/span><span>الموصل المعزول<\/span><span>تفريغ الشحنة<\/span><\/div>","t":"الاحتفاظ بالشحنة، تسرب الشحنة، الموصل المعزول، تفريغ الشحنة"},{"h":"<p>تحدٍّ: حاول شحن ملعقة فلزية بدلكها بالصوف وأنت تمسكها بيدك. لماذا لا تجذب القصاصات؟<\/p>","t":"تحدٍّ: حاول شحن ملعقة فلزية بدلكها بالصوف وأنت تمسكها بيدك. لماذا لا تجذب القصاصات؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ التحدي مع متطوع.<\/td><td>يلاحظون فشل شحن الملعقة.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مقارنة عملية<\/td><td>يدلك قضيبًا فلزيًا بمقبض بلاستيكي ويقارنه بالملعقة وبقضيب الأبونايت.<\/td><td>يلاحظون أن الفلز المعزول يحتفظ بالشحنة، ويفسرون تسرب الشحنة من الملعقة عبر اليد والجسم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">حل مشكلة: محطة الوقود<\/td><td>يعرض صورة تعبئة وقود ويطرح مشكلة تراكم الشحنات وخطر الشرارة.<\/td><td>يقترحون حلولًا: توصيل الخرطوم والخزان بسلك فلزي يفرغ الشحنة، ولمس جسم فلزي قبل التعبئة.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">السؤال 8-1 (كتاب الطالب ص 22)<\/td><td>يوجه إلى الإجابة.<\/td><td>يجيبون ويقارنون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(6 دقائق) التهيئة\nدور المعلم: ينفذ التحدي مع متطوع.\nدور الطالب: يلاحظون فشل شحن الملعقة.\n\n(12 دقيقة) مقارنة عملية\nدور المعلم: يدلك قضيبًا فلزيًا بمقبض بلاستيكي ويقارنه بالملعقة وبقضيب الأبونايت.\nدور الطالب: يلاحظون أن الفلز المعزول يحتفظ بالشحنة، ويفسرون تسرب الشحنة من الملعقة عبر اليد والجسم.\n\n(10 دقائق) حل مشكلة: محطة الوقود\nدور المعلم: يعرض صورة تعبئة وقود ويطرح مشكلة تراكم الشحنات وخطر الشرارة.\nدور الطالب: يقترحون حلولًا: توصيل الخرطوم والخزان بسلك فلزي يفرغ الشحنة، ولمس جسم فلزي قبل التعبئة.\n\n(7 دقائق) السؤال 8-1 (كتاب الطالب ص 22)\nدور المعلم: يوجه إلى الإجابة.\nدور الطالب: يجيبون ويقارنون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يسهل شحن العوازل بالدلك؟<\/td><td>لأن إلكتروناتها مرتبطة بذراتها فلا تتسرب الشحنة المكتسبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا تحتفظ ملعقة فلزية ممسوكة باليد بالشحنة بعد دلكها؟<\/td><td>لأنها موصلة فتتسرب الإلكترونات عبرها وعبر جسم الإنسان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لتقليل خطر الشرارة عند تعبئة الوقود وفسّرها.<\/td><td>توصيل الخرطوم والخزان بموصل فلزي إلى الأرض، فتتسرب الشحنات أولًا بأول ولا تتراكم لتحدث شرارة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] لماذا يسهل شحن العوازل بالدلك؟\nالإجابة النموذجية: لأن إلكتروناتها مرتبطة بذراتها فلا تتسرب الشحنة المكتسبة.\n\n2) [المستوى المتوقع] لماذا لا تحتفظ ملعقة فلزية ممسوكة باليد بالشحنة بعد دلكها؟\nالإجابة النموذجية: لأنها موصلة فتتسرب الإلكترونات عبرها وعبر جسم الإنسان.\n\n3) [المستوى المتقدم] اقترح طريقة لتقليل خطر الشرارة عند تعبئة الوقود وفسّرها.\nالإجابة النموذجية: توصيل الخرطوم والخزان بموصل فلزي إلى الأرض، فتتسرب الشحنات أولًا بأول ولا تتراكم لتحدث شرارة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن لموصل أن يحتفظ بشحنة ساكنة إذا حُمل على مادة عازلة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُصنع مقبض القضيب الفلزي في التجربة من البلاستيك؟<\/td><td>ليعزل القضيب عن اليد فلا تتسرب الشحنة منه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>تتراكم شحنة على جسم الطائرة أثناء طيرانها. لماذا يوصل جسمها بموصل قبل التزود بالوقود؟<\/td><td>لتفريغ الشحنة المتراكمة بأمان ومنع حدوث شرارة قد تشعل الوقود.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يمكن لموصل أن يحتفظ بشحنة ساكنة إذا حُمل على مادة عازلة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا يُصنع مقبض القضيب الفلزي في التجربة من البلاستيك؟\nالإجابة النموذجية: ليعزل القضيب عن اليد فلا تتسرب الشحنة منه.\n\n3) [المستوى المتقدم] تتراكم شحنة على جسم الطائرة أثناء طيرانها. لماذا يوصل جسمها بموصل قبل التزود بالوقود؟\nالإجابة النموذجية: لتفريغ الشحنة المتراكمة بأمان ومنع حدوث شرارة قد تشعل الوقود."},{"h":"<p>مراجعة كتاب الطالب ص 20–22 وحل السؤال 8-1، والبحث في سبب ارتداء العاملين في مصانع الإلكترونيات أساور موصلة بالأرض.<\/p>","t":"مراجعة كتاب الطالب ص 20–22 وحل السؤال 8-1، والبحث في سبب ارتداء العاملين في مصانع الإلكترونيات أساور موصلة بالأرض."}]},{"n":3,"focus":"مراجعة الوحدة الأولى وأسئلة نهاية الوحدة","info":"<div><b>الدرس:<\/b> 4-1 الموصلات الكهربائية والعوازل<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 20–22 | كتاب النشاط: تمرين 3-1 ص 19<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div><div><b>محور الحصة:<\/b> مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يلخص المفاهيم الرئيسة للوحدة الأولى في خريطة مفاهيم.<\/li><li>يطبق مفاهيم الشحن والمجال والتوصيل في حل أسئلة نهاية الوحدة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقوّم إجابات زملائه وفق معايير دقة المصطلح وصحة التفسير.<\/div>","t":"1. يلخص المفاهيم الرئيسة للوحدة الأولى في خريطة مفاهيم.\n2. يطبق مفاهيم الشحن والمجال والتوصيل في حل أسئلة نهاية الوحدة.\nمخرج تعليمي آخر: يقوّم إجابات زملائه وفق معايير دقة المصطلح وصحة التفسير."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يلخص المفاهيم الرئيسة للوحدة الأولى في خريطة مفاهيم.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يطبق مفاهيم الشحن والمجال والتوصيل في حل أسئلة نهاية الوحدة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقوّم إجابات زملائه وفق معايير دقة المصطلح وصحة التفسير.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يلخص المفاهيم الرئيسة للوحدة الأولى في خريطة مفاهيم. ← فهم\n• يطبق مفاهيم الشحن والمجال والتوصيل في حل أسئلة نهاية الوحدة. ← تطبيق\n• يقوّم إجابات زملائه وفق معايير دقة المصطلح وصحة التفسير. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم الذاتي<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم الذاتي\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"pills\"><span>الشحنة الكهربائية<\/span><span>المجال الكهربائي<\/span><span>الموصل<\/span><span>العازل<\/span><span>الإلكترونات الحرة<\/span><\/div>","t":"الشحنة الكهربائية، المجال الكهربائي، الموصل، العازل، الإلكترونات الحرة"},{"h":"<p>يعرض المعلم كلمات مفتاحية مبعثرة للوحدة ويطلب ترتيبها في خريطة مفاهيم.<\/p>","t":"يعرض المعلم كلمات مفتاحية مبعثرة للوحدة ويطلب ترتيبها في خريطة مفاهيم."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">7 د<\/td><td class=\"st\">خريطة المفاهيم<\/td><td>يعرض الكلمات المفتاحية على السبورة الذكية ويوجه البناء.<\/td><td>يبنون خريطة مفاهيم في مجموعات.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الأولى (كتاب الطالب)<\/td><td>يوزع الأسئلة على المجموعات ويتابع.<\/td><td>يحلون الأسئلة ويعرض ممثل كل مجموعة حلًا.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التقييم المتبادل<\/td><td>يقدم معايير التصحيح: دقة المصطلح وصحة التفسير.<\/td><td>يقيّمون إجابات المجموعات الأخرى.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير مسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة ويكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(7 دقائق) خريطة المفاهيم\nدور المعلم: يعرض الكلمات المفتاحية على السبورة الذكية ويوجه البناء.\nدور الطالب: يبنون خريطة مفاهيم في مجموعات.\n\n(15 دقيقة) أسئلة نهاية الوحدة الأولى (كتاب الطالب)\nدور المعلم: يوزع الأسئلة على المجموعات ويتابع.\nدور الطالب: يحلون الأسئلة ويعرض ممثل كل مجموعة حلًا.\n\n(6 دقائق) التقييم المتبادل\nدور المعلم: يقدم معايير التصحيح: دقة المصطلح وصحة التفسير.\nدور الطالب: يقيّمون إجابات المجموعات الأخرى.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير مسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الجسيم المسؤول عن الشحن بالدلك وعن التوصيل الكهربائي؟<\/td><td>الإلكترون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>فسّر: البالون المدلوك يلتصق بالجدار.<\/td><td>يكتسب البالون شحنة بالدلك فيعيد توزيع الشحنات في سطح الجدار القريب فيصبح بشحنة مخالفة فيتجاذبان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اربط بين وجود الإلكترونات الحرة وكل من: الاحتفاظ بالشحنة بعد الدلك، والتوصيل الكهربائي.<\/td><td>العوازل بلا إلكترونات حرة فتحتفظ بالشحنة ولا توصل الكهرباء، والموصلات فيها إلكترونات حرة فتوصل الكهرباء ولا تحتفظ بالشحنة إلا إذا عُزلت.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما الجسيم المسؤول عن الشحن بالدلك وعن التوصيل الكهربائي؟\nالإجابة النموذجية: الإلكترون.\n\n2) [المستوى المتوقع] فسّر: البالون المدلوك يلتصق بالجدار.\nالإجابة النموذجية: يكتسب البالون شحنة بالدلك فيعيد توزيع الشحنات في سطح الجدار القريب فيصبح بشحنة مخالفة فيتجاذبان.\n\n3) [المستوى المتقدم] اربط بين وجود الإلكترونات الحرة وكل من: الاحتفاظ بالشحنة بعد الدلك، والتوصيل الكهربائي.\nالإجابة النموذجية: العوازل بلا إلكترونات حرة فتحتفظ بالشحنة ولا توصل الكهرباء، والموصلات فيها إلكترونات حرة فتوصل الكهرباء ولا تحتفظ بالشحنة إلا إذا عُزلت."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الشحنات المتشابهة ........، والمختلفة ........<\/td><td>تتنافر – تتجاذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُغلف أسلاك التوصيل بالبلاستيك؟<\/td><td>لأن البلاستيك عازل يمنع مرور التيار إلى من يلمس السلك ويمنع تلامس الأسلاك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>جسمان A وB متعادلان، دُلك أحدهما بالآخر فأصبح A سالبًا. صف ما حدث، وحدد شحنة B، وتنبأ بما يحدث عند تقريبهما.<\/td><td>انتقلت إلكترونات من B إلى A؛ فأصبح B موجبًا بمقدار شحنة A نفسه، ويتجاذبان عند تقريبهما.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: الشحنات المتشابهة ........، والمختلفة ........\nالإجابة النموذجية: تتنافر – تتجاذب.\n\n2) [المستوى المتوقع] لماذا تُغلف أسلاك التوصيل بالبلاستيك؟\nالإجابة النموذجية: لأن البلاستيك عازل يمنع مرور التيار إلى من يلمس السلك ويمنع تلامس الأسلاك.\n\n3) [المستوى المتقدم] جسمان A وB متعادلان، دُلك أحدهما بالآخر فأصبح A سالبًا. صف ما حدث، وحدد شحنة B، وتنبأ بما يحدث عند تقريبهما.\nالإجابة النموذجية: انتقلت إلكترونات من B إلى A؛ فأصبح B موجبًا بمقدار شحنة A نفسه، ويتجاذبان عند تقريبهما."},{"h":"<p>إكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب، ومراجعة تمارين كتاب النشاط ص 15–21، والاستعداد للوحدة الثانية (مكونات الدائرة الكهربائية ص 23).<\/p>","t":"إكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب، ومراجعة تمارين كتاب النشاط ص 15–21، والاستعداد للوحدة الثانية (مكونات الدائرة الكهربائية ص 23)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-1 الموصلات الكهربائية والعوازل<\/div><div><b>الوحدة:<\/b> الوحدة الأولى: الشحنة الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثالث (20–24/9/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 20–22 | كتاب النشاط: تمرين 3-1 ص 19<\/div><div><b>دليل المعلم:<\/b> ص 23–24<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><ol class=\"ol\"><li>يميز بين الموصلات الكهربائية والعوازل ويقدم أمثلة عليهما.<\/li><li>يفسر الفرق بينهما بوجود الإلكترونات الحرة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصنف مواد شائعة إلى موصلة وعازلة باختبار عملي.<\/div><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><ol class=\"ol\"><li>يفسر احتفاظ العوازل بالشحنة الساكنة وصعوبة شحن الموصل الممسوك باليد.<\/li><li>يوضح أن الموصل يحتفظ بشحنته إذا حُمل على مادة عازلة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح إجراءات لتفريغ الشحنات المتراكمة بأمان في مواقف مثل تعبئة الوقود.<\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><ol class=\"ol\"><li>يلخص المفاهيم الرئيسة للوحدة الأولى في خريطة مفاهيم.<\/li><li>يطبق مفاهيم الشحن والمجال والتوصيل في حل أسئلة نهاية الوحدة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقوّم إجابات زملائه وفق معايير دقة المصطلح وصحة التفسير.<\/div>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\n1. يميز بين الموصلات الكهربائية والعوازل ويقدم أمثلة عليهما.\n2. يفسر الفرق بينهما بوجود الإلكترونات الحرة.\nمخرج تعليمي آخر: يصنف مواد شائعة إلى موصلة وعازلة باختبار عملي.\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\n1. يفسر احتفاظ العوازل بالشحنة الساكنة وصعوبة شحن الموصل الممسوك باليد.\n2. يوضح أن الموصل يحتفظ بشحنته إذا حُمل على مادة عازلة.\nمخرج تعليمي آخر: يقترح إجراءات لتفريغ الشحنات المتراكمة بأمان في مواقف مثل تعبئة الوقود.\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\n1. يلخص المفاهيم الرئيسة للوحدة الأولى في خريطة مفاهيم.\n2. يطبق مفاهيم الشحن والمجال والتوصيل في حل أسئلة نهاية الوحدة.\nمخرج تعليمي آخر: يقوّم إجابات زملائه وفق معايير دقة المصطلح وصحة التفسير."},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يميز بين الموصلات الكهربائية والعوازل
