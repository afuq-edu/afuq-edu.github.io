مصطلح وصحة التفسير. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم بالاكتشاف<\/span><\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><div class=\"pills\"><span>التعلم الذاتي<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\n• التعلم المبني على حل المشكلات\n• التعلم التشاركي\n• التعلم بالاكتشاف\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\n• التعلم الذاتي\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: خلية، مصباح، أسلاك توصيل، عينات (مسمار، ممحاة، قلم رصاص، ملعقة، مسطرة بلاستيكية، ورق)<\/span><\/div><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: قضيب فلزي بمقبض بلاستيكي، قضيب أبونايت، قطعة صوف، ملعقة فلزية، قصاصات ورق<\/span><\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\n• الكتاب\n• السبورة الذكية\n• أخرى: خلية، مصباح، أسلاك توصيل، عينات (مسمار، ممحاة، قلم رصاص، ملعقة، مسطرة بلاستيكية، ورق)\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\n• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: قضيب فلزي بمقبض بلاستيكي، قضيب أبونايت، قطعة صوف، ملعقة فلزية، قصاصات ورق\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><div class=\"pills\"><span>الموصل الكهربائي<\/span><span>العازل الكهربائي<\/span><span>الإلكترونات الحرة<\/span><span>التيار الكهربائي<\/span><\/div><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><div class=\"pills\"><span>الاحتفاظ بالشحنة<\/span><span>تسرب الشحنة<\/span><span>الموصل المعزول<\/span><span>تفريغ الشحنة<\/span><\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><div class=\"pills\"><span>الشحنة الكهربائية<\/span><span>المجال الكهربائي<\/span><span>الموصل<\/span><span>العازل<\/span><span>الإلكترونات الحرة<\/span><\/div>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\nالموصل الكهربائي، العازل الكهربائي، الإلكترونات الحرة، التيار الكهربائي\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\nالاحتفاظ بالشحنة، تسرب الشحنة، الموصل المعزول، تفريغ الشحنة\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\nالشحنة الكهربائية، المجال الكهربائي، الموصل، العازل، الإلكترونات الحرة"},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><p>يعرض سلكًا كهربائيًا مقشورًا جزئيًا ويسأل: لماذا تُصنع الأسلاك من النحاس وتُغلف بالبلاستيك؟<\/p><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><p>تحدٍّ: حاول شحن ملعقة فلزية بدلكها بالصوف وأنت تمسكها بيدك. لماذا لا تجذب القصاصات؟<\/p><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><p>يعرض المعلم كلمات مفتاحية مبعثرة للوحدة ويطلب ترتيبها في خريطة مفاهيم.<\/p>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\nيعرض سلكًا كهربائيًا مقشورًا جزئيًا ويسأل: لماذا تُصنع الأسلاك من النحاس وتُغلف بالبلاستيك؟\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\nتحدٍّ: حاول شحن ملعقة فلزية بدلكها بالصوف وأنت تمسكها بيدك. لماذا لا تجذب القصاصات؟\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\nيعرض المعلم كلمات مفتاحية مبعثرة للوحدة ويطلب ترتيبها في خريطة مفاهيم."},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض السلك ويطرح السؤال.<\/td><td>يقترحون إجابات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">اختبار التوصيل<\/td><td>يوجه المجموعات إلى بناء دائرة بسيطة فيها فجوة لاختبار المواد.<\/td><td>يختبرون العينات ويصنفونها في جدول: موصلة أو عازلة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التفسير بالإلكترونات الحرة<\/td><td>يشرح بنموذج على السبورة الذكية أن الفلزات فيها إلكترونات حرة الحركة، أما إلكترونات العوازل فمرتبطة بذراتها.<\/td><td>يربطون نتائجهم بالنموذج ويلاحظون أن الجرافيت موصل مع أنه ليس فلزًا.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">قراءة موجهة (كتاب الطالب ص 20–21)<\/td><td>يوجه إلى القراءة واستخراج الأمثلة.<\/td><td>يستخرجون أمثلة الموصلات والعوازل.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ التحدي مع متطوع.<\/td><td>يلاحظون فشل شحن الملعقة.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مقارنة عملية<\/td><td>يدلك قضيبًا فلزيًا بمقبض بلاستيكي ويقارنه بالملعقة وبقضيب الأبونايت.<\/td><td>يلاحظون أن الفلز المعزول يحتفظ بالشحنة، ويفسرون تسرب الشحنة من الملعقة عبر اليد والجسم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">حل مشكلة: محطة الوقود<\/td><td>يعرض صورة تعبئة وقود ويطرح مشكلة تراكم الشحنات وخطر الشرارة.<\/td><td>يقترحون حلولًا: توصيل الخرطوم والخزان بسلك فلزي يفرغ الشحنة، ولمس جسم فلزي قبل التعبئة.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">السؤال 8-1 (كتاب الطالب ص 22)<\/td><td>يوجه إلى الإجابة.<\/td><td>يجيبون ويقارنون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">7 د<\/td><td class=\"st\">خريطة المفاهيم<\/td><td>يعرض الكلمات المفتاحية على السبورة الذكية ويوجه البناء.<\/td><td>يبنون خريطة مفاهيم في مجموعات.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الأولى (كتاب الطالب)<\/td><td>يوزع الأسئلة على المجموعات ويتابع.<\/td><td>يحلون الأسئلة ويعرض ممثل كل مجموعة حلًا.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">التقييم المتبادل<\/td><td>يقدم معايير التصحيح: دقة المصطلح وصحة التفسير.<\/td><td>يقيّمون إجابات المجموعات الأخرى.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير مسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص الوحدة ويكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\n(5 دقائق) التهيئة\nدور المعلم: يعرض السلك ويطرح السؤال.\nدور الطالب: يقترحون إجابات.\n\n(13 دقيقة) اختبار التوصيل\nدور المعلم: يوجه المجموعات إلى بناء دائرة بسيطة فيها فجوة لاختبار المواد.\nدور الطالب: يختبرون العينات ويصنفونها في جدول: موصلة أو عازلة.\n\n(10 دقائق) التفسير بالإلكترونات الحرة\nدور المعلم: يشرح بنموذج على السبورة الذكية أن الفلزات فيها إلكترونات حرة الحركة، أما إلكترونات العوازل فمرتبطة بذراتها.\nدور الطالب: يربطون نتائجهم بالنموذج ويلاحظون أن الجرافيت موصل مع أنه ليس فلزًا.\n\n(7 دقائق) قراءة موجهة (كتاب الطالب ص 20–21)\nدور المعلم: يوجه إلى القراءة واستخراج الأمثلة.\nدور الطالب: يستخرجون أمثلة الموصلات والعوازل.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\n(6 دقائق) التهيئة\nدور المعلم: ينفذ التحدي مع متطوع.\nدور الطالب: يلاحظون فشل شحن الملعقة.\n\n(12 دقيقة) مقارنة عملية\nدور المعلم: يدلك قضيبًا فلزيًا بمقبض بلاستيكي ويقارنه بالملعقة وبقضيب الأبونايت.\nدور الطالب: يلاحظون أن الفلز المعزول يحتفظ بالشحنة، ويفسرون تسرب الشحنة من الملعقة عبر اليد والجسم.\n\n(10 دقائق) حل مشكلة: محطة الوقود\nدور المعلم: يعرض صورة تعبئة وقود ويطرح مشكلة تراكم الشحنات وخطر الشرارة.\nدور الطالب: يقترحون حلولًا: توصيل الخرطوم والخزان بسلك فلزي يفرغ الشحنة، ولمس جسم فلزي قبل التعبئة.\n\n(7 دقائق) السؤال 8-1 (كتاب الطالب ص 22)\nدور المعلم: يوجه إلى الإجابة.\nدور الطالب: يجيبون ويقارنون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\n(7 دقائق) خريطة المفاهيم\nدور المعلم: يعرض الكلمات المفتاحية على السبورة الذكية ويوجه البناء.\nدور الطالب: يبنون خريطة مفاهيم في مجموعات.\n\n(15 دقيقة) أسئلة نهاية الوحدة الأولى (كتاب الطالب)\nدور المعلم: يوزع الأسئلة على المجموعات ويتابع.\nدور الطالب: يحلون الأسئلة ويعرض ممثل كل مجموعة حلًا.\n\n(6 دقائق) التقييم المتبادل\nدور المعلم: يقدم معايير التصحيح: دقة المصطلح وصحة التفسير.\nدور الطالب: يقيّمون إجابات المجموعات الأخرى.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير مسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص الوحدة ويكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر مثالين على موصلات ومثالين على عوازل.<\/td><td>موصلات: النحاس والألومنيوم. عوازل: البلاستيك والمطاط.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُعد الفلزات موصلات جيدة للكهرباء؟<\/td><td>لاحتوائها على إلكترونات حرة تتحرك خلالها حاملة التيار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُصنع مقبض مفك الكهربائي من البلاستيك ورأسه من الفلز؟<\/td><td>الرأس الفلزي موصل يلامس الأجزاء المراد إصلاحها، والمقبض البلاستيكي عازل يمنع وصول التيار إلى يد العامل.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>لماذا يسهل شحن العوازل بالدلك؟<\/td><td>لأن إلكتروناتها مرتبطة بذراتها فلا تتسرب الشحنة المكتسبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا تحتفظ ملعقة فلزية ممسوكة باليد بالشحنة بعد دلكها؟<\/td><td>لأنها موصلة فتتسرب الإلكترونات عبرها وعبر جسم الإنسان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح طريقة لتقليل خطر الشرارة عند تعبئة الوقود وفسّرها.<\/td><td>توصيل الخرطوم والخزان بموصل فلزي إلى الأرض، فتتسرب الشحنات أولًا بأول ولا تتراكم لتحدث شرارة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما الجسيم المسؤول عن الشحن بالدلك وعن التوصيل الكهربائي؟<\/td><td>الإلكترون.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>فسّر: البالون المدلوك يلتصق بالجدار.<\/td><td>يكتسب البالون شحنة بالدلك فيعيد توزيع الشحنات في سطح الجدار القريب فيصبح بشحنة مخالفة فيتجاذبان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اربط بين وجود الإلكترونات الحرة وكل من: الاحتفاظ بالشحنة بعد الدلك، والتوصيل الكهربائي.<\/td><td>العوازل بلا إلكترونات حرة فتحتفظ بالشحنة ولا توصل الكهرباء، والموصلات فيها إلكترونات حرة فتوصل الكهرباء ولا تحتفظ بالشحنة إلا إذا عُزلت.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\n1) [مستوى الدعم] اذكر مثالين على موصلات ومثالين على عوازل.\nالإجابة النموذجية: موصلات: النحاس والألومنيوم. عوازل: البلاستيك والمطاط.\n\n2) [المستوى المتوقع] لماذا تُعد الفلزات موصلات جيدة للكهرباء؟\nالإجابة النموذجية: لاحتوائها على إلكترونات حرة تتحرك خلالها حاملة التيار.\n\n3) [المستوى المتقدم] لماذا يُصنع مقبض مفك الكهربائي من البلاستيك ورأسه من الفلز؟\nالإجابة النموذجية: الرأس الفلزي موصل يلامس الأجزاء المراد إصلاحها، والمقبض البلاستيكي عازل يمنع وصول التيار إلى يد العامل.\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\n1) [مستوى الدعم] لماذا يسهل شحن العوازل بالدلك؟\nالإجابة النموذجية: لأن إلكتروناتها مرتبطة بذراتها فلا تتسرب الشحنة المكتسبة.\n\n2) [المستوى المتوقع] لماذا لا تحتفظ ملعقة فلزية ممسوكة باليد بالشحنة بعد دلكها؟\nالإجابة النموذجية: لأنها موصلة فتتسرب الإلكترونات عبرها وعبر جسم الإنسان.\n\n3) [المستوى المتقدم] اقترح طريقة لتقليل خطر الشرارة عند تعبئة الوقود وفسّرها.\nالإجابة النموذجية: توصيل الخرطوم والخزان بموصل فلزي إلى الأرض، فتتسرب الشحنات أولًا بأول ولا تتراكم لتحدث شرارة.\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\n1) [مستوى الدعم] ما الجسيم المسؤول عن الشحن بالدلك وعن التوصيل الكهربائي؟\nالإجابة النموذجية: الإلكترون.\n\n2) [المستوى المتوقع] فسّر: البالون المدلوك يلتصق بالجدار.\nالإجابة النموذجية: يكتسب البالون شحنة بالدلك فيعيد توزيع الشحنات في سطح الجدار القريب فيصبح بشحنة مخالفة فيتجاذبان.\n\n3) [المستوى المتقدم] اربط بين وجود الإلكترونات الحرة وكل من: الاحتفاظ بالشحنة بعد الدلك، والتوصيل الكهربائي.\nالإجابة النموذجية: العوازل بلا إلكترونات حرة فتحتفظ بالشحنة ولا توصل الكهرباء، والموصلات فيها إلكترونات حرة فتوصل الكهرباء ولا تحتفظ بالشحنة إلا إذا عُزلت."},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الإلكترونات التي تتحرك بحرية داخل المادة تسمى .........<\/td><td>الإلكترونات الحرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صنّف: النحاس، المطاط، الألومنيوم، الخشب الجاف.<\/td><td>موصلات: النحاس والألومنيوم. عوازل: المطاط والخشب الجاف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أضاء المصباح عند وضع قلم رصاص في الفجوة. هل يعني ذلك أن كل الموصلات فلزات؟ فسّر.<\/td><td>لا؛ الجرافيت لافلز لكنه موصل لاحتوائه على إلكترونات حرة، فالتوصيل يعتمد على وجود الإلكترونات الحرة.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يمكن لموصل أن يحتفظ بشحنة ساكنة إذا حُمل على مادة عازلة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُصنع مقبض القضيب الفلزي في التجربة من البلاستيك؟<\/td><td>ليعزل القضيب عن اليد فلا تتسرب الشحنة منه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>تتراكم شحنة على جسم الطائرة أثناء طيرانها. لماذا يوصل جسمها بموصل قبل التزود بالوقود؟<\/td><td>لتفريغ الشحنة المتراكمة بأمان ومنع حدوث شرارة قد تشعل الوقود.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: الشحنات المتشابهة ........، والمختلفة ........<\/td><td>تتنافر – تتجاذب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُغلف أسلاك التوصيل بالبلاستيك؟<\/td><td>لأن البلاستيك عازل يمنع مرور التيار إلى من يلمس السلك ويمنع تلامس الأسلاك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>جسمان A وB متعادلان، دُلك أحدهما بالآخر فأصبح A سالبًا. صف ما حدث، وحدد شحنة B، وتنبأ بما يحدث عند تقريبهما.<\/td><td>انتقلت إلكترونات من B إلى A؛ فأصبح B موجبًا بمقدار شحنة A نفسه، ويتجاذبان عند تقريبهما.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\n1) [مستوى الدعم] أكمل: الإلكترونات التي تتحرك بحرية داخل المادة تسمى .........\nالإجابة النموذجية: الإلكترونات الحرة.\n\n2) [المستوى المتوقع] صنّف: النحاس، المطاط، الألومنيوم، الخشب الجاف.\nالإجابة النموذجية: موصلات: النحاس والألومنيوم. عوازل: المطاط والخشب الجاف.\n\n3) [المستوى المتقدم] أضاء المصباح عند وضع قلم رصاص في الفجوة. هل يعني ذلك أن كل الموصلات فلزات؟ فسّر.\nالإجابة النموذجية: لا؛ الجرافيت لافلز لكنه موصل لاحتوائه على إلكترونات حرة، فالتوصيل يعتمد على وجود الإلكترونات الحرة.\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\n1) [مستوى الدعم] صواب أم خطأ: يمكن لموصل أن يحتفظ بشحنة ساكنة إذا حُمل على مادة عازلة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا يُصنع مقبض القضيب الفلزي في التجربة من البلاستيك؟\nالإجابة النموذجية: ليعزل القضيب عن اليد فلا تتسرب الشحنة منه.\n\n3) [المستوى المتقدم] تتراكم شحنة على جسم الطائرة أثناء طيرانها. لماذا يوصل جسمها بموصل قبل التزود بالوقود؟\nالإجابة النموذجية: لتفريغ الشحنة المتراكمة بأمان ومنع حدوث شرارة قد تشعل الوقود.\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\n1) [مستوى الدعم] أكمل: الشحنات المتشابهة ........، والمختلفة ........\nالإجابة النموذجية: تتنافر – تتجاذب.\n\n2) [المستوى المتوقع] لماذا تُغلف أسلاك التوصيل بالبلاستيك؟\nالإجابة النموذجية: لأن البلاستيك عازل يمنع مرور التيار إلى من يلمس السلك ويمنع تلامس الأسلاك.\n\n3) [المستوى المتقدم] جسمان A وB متعادلان، دُلك أحدهما بالآخر فأصبح A سالبًا. صف ما حدث، وحدد شحنة B، وتنبأ بما يحدث عند تقريبهما.\nالإجابة النموذجية: انتقلت إلكترونات من B إلى A؛ فأصبح B موجبًا بمقدار شحنة A نفسه، ويتجاذبان عند تقريبهما."},{"h":"<div class=\"psub\">الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل<\/div><p>مراجعة كتاب الطالب ص 20–21 وحل السؤال 7-1، وحل تمرين 3-1 الموصلات الكهربائية والعوازل في كتاب النشاط ص 19.<\/p><div class=\"psub\">الحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان<\/div><p>مراجعة كتاب الطالب ص 20–22 وحل السؤال 8-1، والبحث في سبب ارتداء العاملين في مصانع الإلكترونيات أساور موصلة بالأرض.<\/p><div class=\"psub\">الحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة<\/div><p>إكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب، ومراجعة تمارين كتاب النشاط ص 15–21، والاستعداد للوحدة الثانية (مكونات الدائرة الكهربائية ص 23).<\/p>","t":"الحصة 1: الإلكترونات الحرة والتمييز بين الموصلات والعوازل\nمراجعة كتاب الطالب ص 20–21 وحل السؤال 7-1، وحل تمرين 3-1 الموصلات الكهربائية والعوازل في كتاب النشاط ص 19.\n\nالحصة 2: الاحتفاظ بالشحنة الساكنة وتفريغها بأمان\nمراجعة كتاب الطالب ص 20–22 وحل السؤال 8-1، والبحث في سبب ارتداء العاملين في مصانع الإلكترونيات أساور موصلة بالأرض.\n\nالحصة 3: مراجعة الوحدة الأولى وأسئلة نهاية الوحدة\nإكمال أسئلة نهاية الوحدة الأولى في كتاب الطالب، ومراجعة تمارين كتاب النشاط ص 15–21، والاستعداد للوحدة الثانية (مكونات الدائرة الكهربائية ص 23)."}]}},{"label":"1-2 مكونات الدائرة الكهربائية","unit":"الوحدة الثانية: مخططات الدوائر الكهربائية","periods":[{"n":1,"focus":"رموز مكونات الدائرة ورسم المخططات","info":"<div><b>الدرس:<\/b> 1-2 مكونات الدائرة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–28 | كتاب النشاط: تمرين 1-2 ص 22–23، تمرين 2-2 ص 24<\/div><div><b>دليل المعلم:<\/b> ص 29–30<\/div><div><b>محور الحصة:<\/b> رموز مكونات الدائرة ورسم المخططات<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها.<\/li><li>يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة.<\/div>","t":"1. يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها.\n2. يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي).\nمخرج تعليمي آخر: يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي).<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها. ← تطبيق\n• يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي). ← فهم\n• يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: بطاقات رموز الدائرة، خلية، مصباح، مفتاح، مقاومة متغيرة، أميتر، فولتميتر<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: بطاقات رموز الدائرة، خلية، مصباح، مفتاح، مقاومة متغيرة، أميتر، فولتميتر"},{"h":"<div class=\"pills\"><span>مخطط الدائرة<\/span><span>الخلية والبطارية<\/span><span>المقاومة الثابتة<\/span><span>المقاومة المتغيرة<\/span><span>الأميتر<\/span><span>الفولتميتر<\/span><span>المنصهر<\/span><\/div>","t":"مخطط الدائرة، الخلية والبطارية، المقاومة الثابتة، المقاومة المتغيرة، الأميتر، الفولتميتر، المنصهر"},{"h":"<p>يعرض صورة دائرة حقيقية متشابكة الأسلاك وأخرى بمخطط رموز، ويسأل: أيهما أسهل للفهم والنقل؟<\/p>","t":"يعرض صورة دائرة حقيقية متشابكة الأسلاك وأخرى بمخطط رموز، ويسأل: أيهما أسهل للفهم والنقل؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين ويطرح السؤال.<\/td><td>يقارنون ويستنتجون أهمية الرموز الموحدة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الرموز<\/td><td>يعرض جدول الرموز في كتاب الطالب ويرسم كل رمز على السبورة الذكية.<\/td><td>يرسمون الرموز ويكتبون اسم كل مكون ووظيفته.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">لعبة مطابقة الرموز<\/td><td>يوزع بطاقات رموز وبطاقات أسماء ووظائف.<\/td><td>تتسابق المجموعات في المطابقة الصحيحة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">من الدائرة إلى المخطط<\/td><td>يبني دائرة فيها خلية ومصباح ومفتاح ومقاومة متغيرة، مع أميتر على التوالي وفولتميتر على التوازي مع المصباح.<\/td><td>يرسمون مخطط الدائرة بالرموز ويتبادلون التصحيح.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين ويطرح السؤال.\nدور الطالب: يقارنون ويستنتجون أهمية الرموز الموحدة.\n\n(10 دقائق) الرموز\nدور المعلم: يعرض جدول الرموز في كتاب الطالب ويرسم كل رمز على السبورة الذكية.\nدور الطالب: يرسمون الرموز ويكتبون اسم كل مكون ووظيفته.\n\n(10 دقائق) لعبة مطابقة الرموز\nدور المعلم: يوزع بطاقات رموز وبطاقات أسماء ووظائف.\nدور الطالب: تتسابق المجموعات في المطابقة الصحيحة.\n\n(10 دقائق) من الدائرة إلى المخطط\nدور المعلم: يبني دائرة فيها خلية ومصباح ومفتاح ومقاومة متغيرة، مع أميتر على التوالي وفولتميتر على التوازي مع المصباح.\nدور الطالب: يرسمون مخطط الدائرة بالرموز ويتبادلون التصحيح.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف تميز رمز الخلية في مخطط الدائرة؟<\/td><td>خطان متوازيان: طويل رفيع يمثل القطب الموجب، وقصير أعرض يمثل القطب السالب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف يوصل الأميتر والفولتميتر في الدائرة؟<\/td><td>الأميتر على التوالي مع المكون، والفولتميتر على التوازي معه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صحح الخطأ: «وُصل الفولتميتر على التوالي مع المصباح لقياس التيار المار فيه».<\/td><td>الفولتميتر يقيس فرق الجهد ويوصل على التوازي، أما قياس التيار فيكون بالأميتر الموصول على التوالي.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] كيف تميز رمز الخلية في مخطط الدائرة؟\nالإجابة النموذجية: خطان متوازيان: طويل رفيع يمثل القطب الموجب، وقصير أعرض يمثل القطب السالب.\n\n2) [المستوى المتوقع] كيف يوصل الأميتر والفولتميتر في الدائرة؟\nالإجابة النموذجية: الأميتر على التوالي مع المكون، والفولتميتر على التوازي معه.\n\n3) [المستوى المتقدم] صحح الخطأ: «وُصل الفولتميتر على التوالي مع المصباح لقياس التيار المار فيه».\nالإجابة النموذجية: الفولتميتر يقيس فرق الجهد ويوصل على التوازي، أما قياس التيار فيكون بالأميتر الموصول على التوالي."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يقيس الأميتر ......... ويقيس الفولتميتر .........<\/td><td>شدة التيار الكهربائي – فرق الجهد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة المقاومة المتغيرة في دائرة مصباح؟<\/td><td>التحكم في شدة التيار فتتغير شدة إضاءة المصباح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف مخطط دائرة فيها بطارية من خليتين ومفتاح ومصباحان على التوالي وأميتر يقيس التيار الكلي.<\/td><td>حلقة واحدة تضم البطارية (خليتين متصلتين) والمفتاح والمصباحين متتاليين، والأميتر في المسار نفسه بين أي مكونين.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يقيس الأميتر ......... ويقيس الفولتميتر .........\nالإجابة النموذجية: شدة التيار الكهربائي – فرق الجهد.\n\n2) [المستوى المتوقع] ما وظيفة المقاومة المتغيرة في دائرة مصباح؟\nالإجابة النموذجية: التحكم في شدة التيار فتتغير شدة إضاءة المصباح.\n\n3) [المستوى المتقدم] صف مخطط دائرة فيها بطارية من خليتين ومفتاح ومصباحان على التوالي وأميتر يقيس التيار الكلي.\nالإجابة النموذجية: حلقة واحدة تضم البطارية (خليتين متصلتين) والمفتاح والمصباحين متتاليين، والأميتر في المسار نفسه بين أي مكونين."},{"h":"<p>حل تمرين 1-2 مكونات الدائرة الكهربائية ورموزها في كتاب النشاط ص 22–23، ومراجعة جدول الرموز في كتاب الطالب ص 23–28 والإجابة عن السؤالين 1-2 و2-2.<\/p>","t":"حل تمرين 1-2 مكونات الدائرة الكهربائية ورموزها في كتاب النشاط ص 22–23، ومراجعة جدول الرموز في كتاب الطالب ص 23–28 والإجابة عن السؤالين 1-2 و2-2."}]},{"n":2,"focus":"المقاومة الحرارية والمقاومة الضوئية محولات إدخال","info":"<div><b>الدرس:<\/b> 1-2 مكونات الدائرة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–28 | كتاب النشاط: تمرين 1-2 ص 22–23، تمرين 2-2 ص 24<\/div><div><b>دليل المعلم:<\/b> ص 29–30<\/div><div><b>محور الحصة:<\/b> المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها.<\/li><li>يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال.<\/div>","t":"1. يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها.\n2. يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء).\nمخرج تعليمي آخر: يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء).<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها. ← تطبيق\n• يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء). ← فهم\n• يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: مقاومة حرارية NTC، مقاومة ضوئية LDR، أميتر وفولتميتر، كأس وماء بدرجات حرارة مختلفة، كيس بلاستيكي، مصباح منضدة<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: مقاومة حرارية NTC، مقاومة ضوئية LDR، أميتر وفولتميتر، كأس وماء بدرجات حرارة مختلفة، كيس بلاستيكي، مصباح منضدة"},{"h":"<div class=\"pills\"><span>المقاومة الحرارية NTC<\/span><span>المقاومة الضوئية LDR<\/span><span>محول الإدخال<\/span><span>شدة الضوء<\/span><span>درجة الحرارة<\/span><\/div>","t":"المقاومة الحرارية NTC، المقاومة الضوئية LDR، محول الإدخال، شدة الضوء، درجة الحرارة"},{"h":"<p>سؤال: كيف تعرف إنارة الشارع أن الليل قد حل فتضيء تلقائيًا؟<\/p>","t":"سؤال: كيف تعرف إنارة الشارع أن الليل قد حل فتضيء تلقائيًا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويعرض صورة مستشعر إنارة.<\/td><td>يتوقعون وجود مكون يتأثر بالضوء.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-2 استقصاء المقاومات الحرارية والضوئية (كتاب الطالب)<\/td><td>يوجه نصف المجموعات لاستقصاء NTC داخل كيس مانع لتسرب الماء في ماء بدرجات مختلفة، والنصف الآخر لـ LDR مع تغيير بعد المصباح، ويحذر من الماء الأعلى من 50 °C.<\/td><td>يقيسون التيار والجهد ويحسبون المقاومة ويسجلون النتائج.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">عرض النتائج<\/td><td>يطلب من كل مجموعة عرض استنتاجها.<\/td><td>يستنتجون: مقاومة NTC تقل بارتفاع الحرارة، ومقاومة LDR تقل بزيادة شدة الضوء.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التطبيقات<\/td><td>يناقش استخداماتهما: منظم حرارة، إنذار حريق، إنارة تلقائية.<\/td><td>يرسمون مخطط دائرة إنارة تلقائية برمز LDR.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويعرض صورة مستشعر إنارة.\nدور الطالب: يتوقعون وجود مكون يتأثر بالضوء.\n\n(15 دقيقة) النشاط 1-2 استقصاء المقاومات الحرارية والضوئية (كتاب الطالب)\nدور المعلم: يوجه نصف المجموعات لاستقصاء NTC داخل كيس مانع لتسرب الماء في ماء بدرجات مختلفة، والنصف الآخر لـ LDR مع تغيير بعد المصباح، ويحذر من الماء الأعلى من 50 °C.\nدور الطالب: يقيسون التيار والجهد ويحسبون المقاومة ويسجلون النتائج.\n\n(8 دقائق) عرض النتائج\nدور المعلم: يطلب من كل مجموعة عرض استنتاجها.\nدور الطالب: يستنتجون: مقاومة NTC تقل بارتفاع الحرارة، ومقاومة LDR تقل بزيادة شدة الضوء.\n\n(7 دقائق) التطبيقات\nدور المعلم: يناقش استخداماتهما: منظم حرارة، إنذار حريق، إنارة تلقائية.\nدور الطالب: يرسمون مخطط دائرة إنارة تلقائية برمز LDR.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لمقاومة LDR عند زيادة شدة الضوء؟<\/td><td>تقل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>وُضعت مقاومة NTC في ماء ساخن ثم في ماء بارد. متى يكون التيار أكبر؟ ولماذا؟<\/td><td>في الماء الساخن؛ لأن مقاومتها تقل بارتفاع درجة الحرارة فيزداد التيار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح استخدامًا للمقاومة الحرارية محولَ إدخال ووضح كيف يعمل.<\/td><td>إنذار حرارة: عند ارتفاع الحرارة تقل مقاومتها فيزداد التيار فيعمل الجرس.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث لمقاومة LDR عند زيادة شدة الضوء؟\nالإجابة النموذجية: تقل.\n\n2) [المستوى المتوقع] وُضعت مقاومة NTC في ماء ساخن ثم في ماء بارد. متى يكون التيار أكبر؟ ولماذا؟\nالإجابة النموذجية: في الماء الساخن؛ لأن مقاومتها تقل بارتفاع درجة الحرارة فيزداد التيار.\n\n3) [المستوى المتقدم] اقترح استخدامًا للمقاومة الحرارية محولَ إدخال ووضح كيف يعمل.\nالإجابة النموذجية: إنذار حرارة: عند ارتفاع الحرارة تقل مقاومتها فيزداد التيار فيعمل الجرس."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المقاومة الحرارية NTC تقل مقاومتها عند ......... درجة الحرارة.<\/td><td>ارتفاع.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا توضع المقاومة الحرارية في كيس بلاستيكي مانع لتسرب الماء؟<\/td><td>حتى لا تتلامس وصلاتها مع الماء فيتأثر القياس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في دائرة إنارة شارع تلقائية، فسّر دور المقاومة الضوئية في إضاءة المصباح ليلًا.<\/td><td>في الظلام تزداد مقاومة LDR كثيرًا فيتغير التيار في دائرة التحكم فيعمل المصباح، وفي النهار تقل مقاومتها فيبقى مطفأً.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: المقاومة الحرارية NTC تقل مقاومتها عند ......... درجة الحرارة.\nالإجابة النموذجية: ارتفاع.\n\n2) [المستوى المتوقع] لماذا توضع المقاومة الحرارية في كيس بلاستيكي مانع لتسرب الماء؟\nالإجابة النموذجية: حتى لا تتلامس وصلاتها مع الماء فيتأثر القياس.\n\n3) [المستوى المتقدم] في دائرة إنارة شارع تلقائية، فسّر دور المقاومة الضوئية في إضاءة المصباح ليلًا.\nالإجابة النموذجية: في الظلام تزداد مقاومة LDR كثيرًا فيتغير التيار في دائرة التحكم فيعمل المصباح، وفي النهار تقل مقاومتها فيبقى مطفأً."},{"h":"<p>حل تمرين 2-2 محولات إدخال الطاقة في كتاب النشاط ص 24، والإجابة عن السؤالين 3-2 و4-2 في كتاب الطالب.<\/p>","t":"حل تمرين 2-2 محولات إدخال الطاقة في كتاب النشاط ص 24، والإجابة عن السؤالين 3-2 و4-2 في كتاب الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-2 مكونات الدائرة الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 23–28 | كتاب النشاط: تمرين 1-2 ص 22–23، تمرين 2-2 ص 24<\/div><div><b>دليل المعلم:<\/b> ص 29–30<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><ol class=\"ol\"><li>يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها.<\/li><li>يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة.<\/div><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><ol class=\"ol\"><li>يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها.<\/li><li>يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال.<\/div>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n1. يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها.\n2. يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي).\nمخرج تعليمي آخر: يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة.\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n1. يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها.\n2. يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء).\nمخرج تعليمي آخر: يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال."},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي).<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء).<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n• يرسم مخططات دوائر تحتوي على خلية أو بطارية ومفاتيح ومقاومات ثابتة ومتغيرة ومصابيح وأجهزة قياس ومنصهرات ويفسرها. ← تطبيق\n• يحدد طريقة توصيل الأميتر (على التوالي) والفولتميتر (على التوازي). ← فهم\n• يحول دائرة حقيقية مبنية على الطاولة إلى مخطط برموز صحيحة. ← تطبيق\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n• يرسم مخططات دوائر تحتوي على مقاومة حرارية NTC ومقاومة ضوئية LDR ويفسرها. ← تطبيق\n• يصف عمل المقاومة الحرارية (تقل مقاومتها بارتفاع الحرارة) والضوئية (تقل مقاومتها بزيادة شدة الضوء). ← فهم\n• يقترح استخدامًا عمليًا لكل منهما بوصفهما محولي إدخال. ← تطبيق"},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><\/div>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم المبني على حل المشكلات"},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: بطاقات رموز الدائرة، خلية، مصباح، مفتاح، مقاومة متغيرة، أميتر، فولتميتر<\/span><\/div><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: مقاومة حرارية NTC، مقاومة ضوئية LDR، أميتر وفولتميتر، كأس وماء بدرجات حرارة مختلفة، كيس بلاستيكي، مصباح منضدة<\/span><\/div>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: بطاقات رموز الدائرة، خلية، مصباح، مفتاح، مقاومة متغيرة، أميتر، فولتميتر\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n• الكتاب\n• السبورة الذكية\n• أخرى: مقاومة حرارية NTC، مقاومة ضوئية LDR، أميتر وفولتميتر، كأس وماء بدرجات حرارة مختلفة، كيس بلاستيكي، مصباح منضدة"},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><div class=\"pills\"><span>مخطط الدائرة<\/span><span>الخلية والبطارية<\/span><span>المقاومة الثابتة<\/span><span>المقاومة المتغيرة<\/span><span>الأميتر<\/span><span>الفولتميتر<\/span><span>المنصهر<\/span><\/div><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><div class=\"pills\"><span>المقاومة الحرارية NTC<\/span><span>المقاومة الضوئية LDR<\/span><span>محول الإدخال<\/span><span>شدة الضوء<\/span><span>درجة الحرارة<\/span><\/div>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\nمخطط الدائرة، الخلية والبطارية، المقاومة الثابتة، المقاومة المتغيرة، الأميتر، الفولتميتر، المنصهر\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\nالمقاومة الحرارية NTC، المقاومة الضوئية LDR، محول الإدخال، شدة الضوء، درجة الحرارة"},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><p>يعرض صورة دائرة حقيقية متشابكة الأسلاك وأخرى بمخطط رموز، ويسأل: أيهما أسهل للفهم والنقل؟<\/p><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><p>سؤال: كيف تعرف إنارة الشارع أن الليل قد حل فتضيء تلقائيًا؟<\/p>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\nيعرض صورة دائرة حقيقية متشابكة الأسلاك وأخرى بمخطط رموز، ويسأل: أيهما أسهل للفهم والنقل؟\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\nسؤال: كيف تعرف إنارة الشارع أن الليل قد حل فتضيء تلقائيًا؟"},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورتين ويطرح السؤال.<\/td><td>يقارنون ويستنتجون أهمية الرموز الموحدة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">الرموز<\/td><td>يعرض جدول الرموز في كتاب الطالب ويرسم كل رمز على السبورة الذكية.<\/td><td>يرسمون الرموز ويكتبون اسم كل مكون ووظيفته.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">لعبة مطابقة الرموز<\/td><td>يوزع بطاقات رموز وبطاقات أسماء ووظائف.<\/td><td>تتسابق المجموعات في المطابقة الصحيحة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">من الدائرة إلى المخطط<\/td><td>يبني دائرة فيها خلية ومصباح ومفتاح ومقاومة متغيرة، مع أميتر على التوالي وفولتميتر على التوازي مع المصباح.<\/td><td>يرسمون مخطط الدائرة بالرموز ويتبادلون التصحيح.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويعرض صورة مستشعر إنارة.<\/td><td>يتوقعون وجود مكون يتأثر بالضوء.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-2 استقصاء المقاومات الحرارية والضوئية (كتاب الطالب)<\/td><td>يوجه نصف المجموعات لاستقصاء NTC داخل كيس مانع لتسرب الماء في ماء بدرجات مختلفة، والنصف الآخر لـ LDR مع تغيير بعد المصباح، ويحذر من الماء الأعلى من 50 °C.<\/td><td>يقيسون التيار والجهد ويحسبون المقاومة ويسجلون النتائج.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">عرض النتائج<\/td><td>يطلب من كل مجموعة عرض استنتاجها.<\/td><td>يستنتجون: مقاومة NTC تقل بارتفاع الحرارة، ومقاومة LDR تقل بزيادة شدة الضوء.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">التطبيقات<\/td><td>يناقش استخداماتهما: منظم حرارة، إنذار حريق، إنارة تلقائية.<\/td><td>يرسمون مخطط دائرة إنارة تلقائية برمز LDR.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورتين ويطرح السؤال.\nدور الطالب: يقارنون ويستنتجون أهمية الرموز الموحدة.\n\n(10 دقائق) الرموز\nدور المعلم: يعرض جدول الرموز في كتاب الطالب ويرسم كل رمز على السبورة الذكية.\nدور الطالب: يرسمون الرموز ويكتبون اسم كل مكون ووظيفته.\n\n(10 دقائق) لعبة مطابقة الرموز\nدور المعلم: يوزع بطاقات رموز وبطاقات أسماء ووظائف.\nدور الطالب: تتسابق المجموعات في المطابقة الصحيحة.\n\n(10 دقائق) من الدائرة إلى المخطط\nدور المعلم: يبني دائرة فيها خلية ومصباح ومفتاح ومقاومة متغيرة، مع أميتر على التوالي وفولتميتر على التوازي مع المصباح.\nدور الطالب: يرسمون مخطط الدائرة بالرموز ويتبادلون التصحيح.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويعرض صورة مستشعر إنارة.\nدور الطالب: يتوقعون وجود مكون يتأثر بالضوء.\n\n(15 دقيقة) النشاط 1-2 استقصاء المقاومات الحرارية والضوئية (كتاب الطالب)\nدور المعلم: يوجه نصف المجموعات لاستقصاء NTC داخل كيس مانع لتسرب الماء في ماء بدرجات مختلفة، والنصف الآخر لـ LDR مع تغيير بعد المصباح، ويحذر من الماء الأعلى من 50 °C.\nدور الطالب: يقيسون التيار والجهد ويحسبون المقاومة ويسجلون النتائج.\n\n(8 دقائق) عرض النتائج\nدور المعلم: يطلب من كل مجموعة عرض استنتاجها.\nدور الطالب: يستنتجون: مقاومة NTC تقل بارتفاع الحرارة، ومقاومة LDR تقل بزيادة شدة الضوء.\n\n(7 دقائق) التطبيقات\nدور المعلم: يناقش استخداماتهما: منظم حرارة، إنذار حريق، إنارة تلقائية.\nدور الطالب: يرسمون مخطط دائرة إنارة تلقائية برمز LDR.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف تميز رمز الخلية في مخطط الدائرة؟<\/td><td>خطان متوازيان: طويل رفيع يمثل القطب الموجب، وقصير أعرض يمثل القطب السالب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>كيف يوصل الأميتر والفولتميتر في الدائرة؟<\/td><td>الأميتر على التوالي مع المكون، والفولتميتر على التوازي معه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صحح الخطأ: «وُصل الفولتميتر على التوالي مع المصباح لقياس التيار المار فيه».<\/td><td>الفولتميتر يقيس فرق الجهد ويوصل على التوازي، أما قياس التيار فيكون بالأميتر الموصول على التوالي.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث لمقاومة LDR عند زيادة شدة الضوء؟<\/td><td>تقل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>وُضعت مقاومة NTC في ماء ساخن ثم في ماء بارد. متى يكون التيار أكبر؟ ولماذا؟<\/td><td>في الماء الساخن؛ لأن مقاومتها تقل بارتفاع درجة الحرارة فيزداد التيار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح استخدامًا للمقاومة الحرارية محولَ إدخال ووضح كيف يعمل.<\/td><td>إنذار حرارة: عند ارتفاع الحرارة تقل مقاومتها فيزداد التيار فيعمل الجرس.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n1) [مستوى الدعم] كيف تميز رمز الخلية في مخطط الدائرة؟\nالإجابة النموذجية: خطان متوازيان: طويل رفيع يمثل القطب الموجب، وقصير أعرض يمثل القطب السالب.\n\n2) [المستوى المتوقع] كيف يوصل الأميتر والفولتميتر في الدائرة؟\nالإجابة النموذجية: الأميتر على التوالي مع المكون، والفولتميتر على التوازي معه.\n\n3) [المستوى المتقدم] صحح الخطأ: «وُصل الفولتميتر على التوالي مع المصباح لقياس التيار المار فيه».\nالإجابة النموذجية: الفولتميتر يقيس فرق الجهد ويوصل على التوازي، أما قياس التيار فيكون بالأميتر الموصول على التوالي.\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n1) [مستوى الدعم] ماذا يحدث لمقاومة LDR عند زيادة شدة الضوء؟\nالإجابة النموذجية: تقل.\n\n2) [المستوى المتوقع] وُضعت مقاومة NTC في ماء ساخن ثم في ماء بارد. متى يكون التيار أكبر؟ ولماذا؟\nالإجابة النموذجية: في الماء الساخن؛ لأن مقاومتها تقل بارتفاع درجة الحرارة فيزداد التيار.\n\n3) [المستوى المتقدم] اقترح استخدامًا للمقاومة الحرارية محولَ إدخال ووضح كيف يعمل.\nالإجابة النموذجية: إنذار حرارة: عند ارتفاع الحرارة تقل مقاومتها فيزداد التيار فيعمل الجرس."},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يقيس الأميتر ......... ويقيس الفولتميتر .........<\/td><td>شدة التيار الكهربائي – فرق الجهد.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما وظيفة المقاومة المتغيرة في دائرة مصباح؟<\/td><td>التحكم في شدة التيار فتتغير شدة إضاءة المصباح.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف مخطط دائرة فيها بطارية من خليتين ومفتاح ومصباحان على التوالي وأميتر يقيس التيار الكلي.<\/td><td>حلقة واحدة تضم البطارية (خليتين متصلتين) والمفتاح والمصباحين متتاليين، والأميتر في المسار نفسه بين أي مكونين.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المقاومة الحرارية NTC تقل مقاومتها عند ......... درجة الحرارة.<\/td><td>ارتفاع.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا توضع المقاومة الحرارية في كيس بلاستيكي مانع لتسرب الماء؟<\/td><td>حتى لا تتلامس وصلاتها مع الماء فيتأثر القياس.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>في دائرة إنارة شارع تلقائية، فسّر دور المقاومة الضوئية في إضاءة المصباح ليلًا.<\/td><td>في الظلام تزداد مقاومة LDR كثيرًا فيتغير التيار في دائرة التحكم فيعمل المصباح، وفي النهار تقل مقاومتها فيبقى مطفأً.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\n1) [مستوى الدعم] أكمل: يقيس الأميتر ......... ويقيس الفولتميتر .........\nالإجابة النموذجية: شدة التيار الكهربائي – فرق الجهد.\n\n2) [المستوى المتوقع] ما وظيفة المقاومة المتغيرة في دائرة مصباح؟\nالإجابة النموذجية: التحكم في شدة التيار فتتغير شدة إضاءة المصباح.\n\n3) [المستوى المتقدم] صف مخطط دائرة فيها بطارية من خليتين ومفتاح ومصباحان على التوالي وأميتر يقيس التيار الكلي.\nالإجابة النموذجية: حلقة واحدة تضم البطارية (خليتين متصلتين) والمفتاح والمصباحين متتاليين، والأميتر في المسار نفسه بين أي مكونين.\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\n1) [مستوى الدعم] أكمل: المقاومة الحرارية NTC تقل مقاومتها عند ......... درجة الحرارة.\nالإجابة النموذجية: ارتفاع.\n\n2) [المستوى المتوقع] لماذا توضع المقاومة الحرارية في كيس بلاستيكي مانع لتسرب الماء؟\nالإجابة النموذجية: حتى لا تتلامس وصلاتها مع الماء فيتأثر القياس.\n\n3) [المستوى المتقدم] في دائرة إنارة شارع تلقائية، فسّر دور المقاومة الضوئية في إضاءة المصباح ليلًا.\nالإجابة النموذجية: في الظلام تزداد مقاومة LDR كثيرًا فيتغير التيار في دائرة التحكم فيعمل المصباح، وفي النهار تقل مقاومتها فيبقى مطفأً."},{"h":"<div class=\"psub\">الحصة 1: رموز مكونات الدائرة ورسم المخططات<\/div><p>حل تمرين 1-2 مكونات الدائرة الكهربائية ورموزها في كتاب النشاط ص 22–23، ومراجعة جدول الرموز في كتاب الطالب ص 23–28 والإجابة عن السؤالين 1-2 و2-2.<\/p><div class=\"psub\">الحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال<\/div><p>حل تمرين 2-2 محولات إدخال الطاقة في كتاب النشاط ص 24، والإجابة عن السؤالين 3-2 و4-2 في كتاب الطالب.<\/p>","t":"الحصة 1: رموز مكونات الدائرة ورسم المخططات\nحل تمرين 1-2 مكونات الدائرة الكهربائية ورموزها في كتاب النشاط ص 22–23، ومراجعة جدول الرموز في كتاب الطالب ص 23–28 والإجابة عن السؤالين 1-2 و2-2.\n\nالحصة 2: المقاومة الحرارية والمقاومة الضوئية محولات إدخال\nحل تمرين 2-2 محولات إدخال الطاقة في كتاب النشاط ص 24، والإجابة عن السؤالين 3-2 و4-2 في كتاب الطالب."}]}},{"label":"2-2 توصيل المقاومات","unit":"الوحدة الثانية: مخططات الدوائر الكهربائية","periods":[{"n":1,"focus":"التوصيل على التوالي","info":"<div><b>الدرس:<\/b> 2-2 توصيل المقاومات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 29–37 | كتاب النشاط: تمرين 3-2 ص 25–26، تمرين 4-2 ص 27<\/div><div><b>دليل المعلم:<\/b> ص 30–34<\/div><div><b>محور الحصة:<\/b> التوصيل على التوالي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي.<\/li><li>يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه.<\/li><li>يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات.<\/div>","t":"1. يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي.\n2. يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه.\n3. يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي.\nمخرج تعليمي آخر: يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي. ← فهم\n• يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه. ← تطبيق\n• يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي. ← تطبيق\n• يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: بطارية، مقاومتان ثابتتان، ثلاثة أجهزة أميتر، فولتميتر، أسلاك توصيل<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: بطارية، مقاومتان ثابتتان، ثلاثة أجهزة أميتر، فولتميتر، أسلاك توصيل"},{"h":"<div class=\"pills\"><span>التوصيل على التوالي<\/span><span>شدة التيار<\/span><span>فرق الجهد<\/span><span>المقاومة المكافئة<\/span><span>قانون أوم<\/span><\/div>","t":"التوصيل على التوالي، شدة التيار، فرق الجهد، المقاومة المكافئة، قانون أوم"},{"h":"<p>سؤال تشخيصي: في دائرة فيها مصباحان على التوالي، هل يكون التيار في المصباح الثاني أقل لأن الأول «استهلك» جزءًا منه؟<\/p>","t":"سؤال تشخيصي: في دائرة فيها مصباحان على التوالي، هل يكون التيار في المصباح الثاني أقل لأن الأول «استهلك» جزءًا منه؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويسجل الآراء.<\/td><td>يصوتون ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">قياس التيار والجهد<\/td><td>يبني دائرة توالي بمقاومتين ويضع أجهزة أميتر قبلهما وبينهما وبعدهما، ثم يقيس الجهد على كل مقاومة وعلى المصدر.<\/td><td>يسجلون القراءات ويلاحظون تساوي التيار وأن جهد المصدر يساوي مجموع الجهدين.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المقاومة المكافئة<\/td><td>يقدم <bdi>R = R₁ + R₂<\/bdi> ويحل مثالًا: 6 Ω و12 Ω مع بطارية 9 V.<\/td><td>يحسبون <bdi>R = 18 Ω<\/bdi> و <bdi>I = 0.5 A<\/bdi> ثم <bdi>V₁ = 3 V<\/bdi> و <bdi>V₂ = 6 V<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تطبيق (كتاب الطالب ص 29–32)<\/td><td>يوجه إلى حل أسئلة التوالي من مجموعة الأسئلة 5-2 إلى 13-2.<\/td><td>يحلون في أزواج.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يعالج تصور «استهلاك التيار» ويطرح التقويم.<\/td><td>يجيبون ويصححون تصوراتهم.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويسجل الآراء.\nدور الطالب: يصوتون ويبررون.\n\n(12 دقيقة) قياس التيار والجهد\nدور المعلم: يبني دائرة توالي بمقاومتين ويضع أجهزة أميتر قبلهما وبينهما وبعدهما، ثم يقيس الجهد على كل مقاومة وعلى المصدر.\nدور الطالب: يسجلون القراءات ويلاحظون تساوي التيار وأن جهد المصدر يساوي مجموع الجهدين.\n\n(10 دقائق) المقاومة المكافئة\nدور المعلم: يقدم R = R₁ + R₂ ويحل مثالًا: 6 Ω و12 Ω مع بطارية 9 V.\nدور الطالب: يحسبون R = 18 Ω و I = 0.5 A ثم V₁ = 3 V و V₂ = 6 V.\n\n(8 دقائق) تطبيق (كتاب الطالب ص 29–32)\nدور المعلم: يوجه إلى حل أسئلة التوالي من مجموعة الأسئلة 5-2 إلى 13-2.\nدور الطالب: يحلون في أزواج.\n\n(5 دقائق) التقويم\nدور المعلم: يعالج تصور «استهلاك التيار» ويطرح التقويم.\nدور الطالب: يجيبون ويصححون تصوراتهم."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>مقاومتان 4 Ω و 8 Ω على التوالي. احسب المقاومة المكافئة.<\/td><td><bdi>R = 4 + 8 = 12 Ω<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>بطارية 12 V وُصلت بمقاومتين على التوالي، فرق الجهد على الأولى 5 V. ما فرق الجهد على الثانية؟<\/td><td><bdi>12 − 5 = 7 V<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مقاومتان 10 Ω و 20 Ω على التوالي مع مصدر 6 V. احسب التيار وفرق الجهد على كل مقاومة.<\/td><td><bdi>R = 30 Ω<\/bdi>، <bdi>I = 6 ÷ 30 = 0.2 A<\/bdi>، <bdi>V₁ = 2 V<\/bdi>، <bdi>V₂ = 4 V<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] مقاومتان 4 Ω و 8 Ω على التوالي. احسب المقاومة المكافئة.\nالإجابة النموذجية: R = 4 + 8 = 12 Ω.\n\n2) [المستوى المتوقع] بطارية 12 V وُصلت بمقاومتين على التوالي، فرق الجهد على الأولى 5 V. ما فرق الجهد على الثانية؟\nالإجابة النموذجية: 12 − 5 = 7 V.\n\n3) [المستوى المتقدم] مقاومتان 10 Ω و 20 Ω على التوالي مع مصدر 6 V. احسب التيار وفرق الجهد على كل مقاومة.\nالإجابة النموذجية: R = 30 Ω، I = 6 ÷ 30 = 0.2 A، V₁ = 2 V، V₂ = 4 V."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: في دائرة التوالي تكون شدة التيار متساوية في جميع أجزائها.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا يقل التيار بعد مروره في المصباح الأول في دائرة التوالي؟<\/td><td>لأن الإلكترونات لا تُستهلك؛ ما يقل هو الطاقة التي تحملها، فعدد الإلكترونات المارة بكل نقطة في الثانية ثابت.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ثلاث مقاومات متماثلة على التوالي مع مصدر 9 V والتيار 0.5 A. احسب قيمة كل مقاومة.<\/td><td>R الكلية = <bdi>9 ÷ 0.5 = 18 Ω<\/bdi>، فكل مقاومة = 6 Ω.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: في دائرة التوالي تكون شدة التيار متساوية في جميع أجزائها.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا لا يقل التيار بعد مروره في المصباح الأول في دائرة التوالي؟\nالإجابة النموذجية: لأن الإلكترونات لا تُستهلك؛ ما يقل هو الطاقة التي تحملها، فعدد الإلكترونات المارة بكل نقطة في الثانية ثابت.\n\n3) [المستوى المتقدم] ثلاث مقاومات متماثلة على التوالي مع مصدر 9 V والتيار 0.5 A. احسب قيمة كل مقاومة.\nالإجابة النموذجية: R الكلية = 9 ÷ 0.5 = 18 Ω، فكل مقاومة = 6 Ω."},{"h":"<p>مراجعة كتاب الطالب ص 29–32 والمثال 1-2، وحل الجزء الخاص بالتوالي من تمرين 3-2 توصيل المقاومات في كتاب النشاط ص 25–26.<\/p>","t":"مراجعة كتاب الطالب ص 29–32 والمثال 1-2، وحل الجزء الخاص بالتوالي من تمرين 3-2 توصيل المقاومات في كتاب النشاط ص 25–26."}]},{"n":2,"focus":"التوصيل على التوازي","info":"<div><b>الدرس:<\/b> 2-2 توصيل المقاومات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 29–37 | كتاب النشاط: تمرين 3-2 ص 25–26، تمرين 4-2 ص 27<\/div><div><b>دليل المعلم:<\/b> ص 30–34<\/div><div><b>محور الحصة:<\/b> التوصيل على التوازي<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه.<\/li><li>يذكر أن المقاومة المكافئة لمقاومتين على التوازي أقل من أي منهما ويحسبها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يذكر مزايا توصيل المصابيح على التوازي في الدائرة الكهربائية.<\/div>","t":"1. يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه.\n2. يذكر أن المقاومة المكافئة لمقاومتين على التوازي أقل من أي منهما ويحسبها.\nمخرج تعليمي آخر: يذكر مزايا توصيل المصابيح على التوازي في الدائرة الكهربائية."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذكر أن المقاومة المكافئة لمقاومتين على التوازي أقل من أي منهما ويحسبها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذكر مزايا توصيل المصابيح على التوازي في الدائرة الكهربائية.<\/td><td class=\"lv\">تذكر<\/td><\/tr><\/tbody><\/table>","t":"• يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه. ← تطبيق\n• يذكر أن المقاومة المكافئة لمقاومتين على التوازي أقل من أي منهما ويحسبها. ← تطبيق\n• يذكر مزايا توصيل المصابيح على التوازي في الدائرة الكهربائية. ← تذكر"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>أخرى: مصدر جهد، مقاومتان، ثلاثة أجهزة أميتر، فولتميتر، مصباحان<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• أخرى: مصدر جهد، مقاومتان، ثلاثة أجهزة أميتر، فولتميتر، مصباحان"},{"h":"<div class=\"pills\"><span>التوصيل على التوازي<\/span><span>تيار الفرع<\/span><span>التيار الكلي<\/span><span>المقاومة المكافئة<\/span><span>تساوي الجهد على الفروع<\/span><\/div>","t":"التوصيل على التوازي، تيار الفرع، التيار الكلي، المقاومة المكافئة، تساوي الجهد على الفروع"},{"h":"<p>عرض: مصباحان على التوازي؛ يفك المعلم أحدهما ويسأل: لماذا بقي الآخر مضيئًا؟ وماذا لو كانا على التوالي؟<\/p>","t":"عرض: مصباحان على التوازي؛ يفك المعلم أحدهما ويسأل: لماذا بقي الآخر مضيئًا؟ وماذا لو كانا على التوالي؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يقارنون بين التوصيلين.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">قياسات التوازي<\/td><td>يقيس التيار الكلي وتيار كل فرع والجهد على كل فرع.<\/td><td>يستنتجون <bdi>I = I₁ + I₂<\/bdi> وأن الجهد على الفرعين متساوٍ ويساوي جهد المصدر.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">حساب المقاومة المكافئة<\/td><td>يعرض مقاومة 6 Ω على بطارية 12 V (2 A)، ثم إضافة 6 Ω أخرى على التوازي (4 A) فتصبح المكافئة 3 Ω، ويقدم <bdi>1/R = 1/R₁ + 1/R₂<\/bdi>.<\/td><td>يحسبون المكافئة لـ 4 Ω و <bdi>12 Ω: R = 48 ÷ 16 = 3 Ω<\/bdi>، ويتحققون أنها أقل من 4 Ω.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">مزايا التوازي<\/td><td>يناقش مزايا التوازي في إنارة المنازل.<\/td><td>يعددون: كل مصباح يأخذ جهد المصدر كاملًا، ويمكن تشغيله منفردًا، ولا تنطفئ البقية إذا تلف أحدها.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يقارنون بين التوصيلين.\n\n(12 دقيقة) قياسات التوازي\nدور المعلم: يقيس التيار الكلي وتيار كل فرع والجهد على كل فرع.\nدور الطالب: يستنتجون I = I₁ + I₂ وأن الجهد على الفرعين متساوٍ ويساوي جهد المصدر.\n\n(12 دقيقة) حساب المقاومة المكافئة\nدور المعلم: يعرض مقاومة 6 Ω على بطارية 12 V (2 A)، ثم إضافة 6 Ω أخرى على التوازي (4 A) فتصبح المكافئة 3 Ω، ويقدم 1/R = 1/R₁ + 1/R₂.\nدور الطالب: يحسبون المكافئة لـ 4 Ω و 12 Ω: R = 48 ÷ 16 = 3 Ω، ويتحققون أنها أقل من 4 Ω.\n\n(6 دقائق) مزايا التوازي\nدور المعلم: يناقش مزايا التوازي في إنارة المنازل.\nدور الطالب: يعددون: كل مصباح يأخذ جهد المصدر كاملًا، ويمكن تشغيله منفردًا، ولا تنطفئ البقية إذا تلف أحدها.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>تيار فرعين 0.4 A و 0.6 A. ما التيار الخارج من المصدر؟<\/td><td>1.0 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب المقاومة المكافئة لمقاومتين 10 Ω و 10 Ω على التوازي.<\/td><td><bdi>R = (10 × 10) ÷ 20 = 5 Ω<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مقاومتان 3 Ω و 6 Ω على التوازي مع بطارية 6 V. احسب تيار كل فرع والتيار الكلي، وتحقق بالمقاومة المكافئة.<\/td><td><bdi>I₁ = 2 A<\/bdi>، <bdi>I₂ = 1 A<\/bdi>، <bdi>I = 3 A<\/bdi>؛ <bdi>R = 18 ÷ 9 = 2 Ω<\/bdi> و <bdi>6 ÷ 2 = 3 A<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] تيار فرعين 0.4 A و 0.6 A. ما التيار الخارج من المصدر؟\nالإجابة النموذجية: 1.0 A.\n\n2) [المستوى المتوقع] احسب المقاومة المكافئة لمقاومتين 10 Ω و 10 Ω على التوازي.\nالإجابة النموذجية: R = (10 × 10) ÷ 20 = 5 Ω.\n\n3) [المستوى المتقدم] مقاومتان 3 Ω و 6 Ω على التوازي مع بطارية 6 V. احسب تيار كل فرع والتيار الكلي، وتحقق بالمقاومة المكافئة.\nالإجابة النموذجية: I₁ = 2 A، I₂ = 1 A، I = 3 A؛ R = 18 ÷ 9 = 2 Ω و 6 ÷ 2 = 3 A."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المقاومة المكافئة لمقاومتين على التوازي ......... من أصغرهما.<\/td><td>أقل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر ميزتين لتوصيل مصابيح المنزل على التوازي.<\/td><td>يحصل كل مصباح على جهد المصدر كاملًا، ويمكن التحكم في كل مصباح بمفتاح مستقل، ولا تنطفئ البقية إذا تلف أحدها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أضيفت مقاومة ثالثة على التوازي مع مقاومتين. ماذا يحدث للمقاومة المكافئة وللتيار الكلي؟ فسّر.<\/td><td>تقل المقاومة المكافئة ويزداد التيار الكلي؛ لأن الفرع الجديد مسار إضافي لمرور التيار.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: المقاومة المكافئة لمقاومتين على التوازي ......... من أصغرهما.\nالإجابة النموذجية: أقل.\n\n2) [المستوى المتوقع] اذكر ميزتين لتوصيل مصابيح المنزل على التوازي.\nالإجابة النموذجية: يحصل كل مصباح على جهد المصدر كاملًا، ويمكن التحكم في كل مصباح بمفتاح مستقل، ولا تنطفئ البقية إذا تلف أحدها.\n\n3) [المستوى المتقدم] أضيفت مقاومة ثالثة على التوازي مع مقاومتين. ماذا يحدث للمقاومة المكافئة وللتيار الكلي؟ فسّر.\nالإجابة النموذجية: تقل المقاومة المكافئة ويزداد التيار الكلي؛ لأن الفرع الجديد مسار إضافي لمرور التيار."},{"h":"<p>مراجعة كتاب الطالب ص 32–35 والمثال 2-2، وحل الجزء الخاص بالتوازي من تمرين 3-2 في كتاب النشاط ص 25–26.<\/p>","t":"مراجعة كتاب الطالب ص 32–35 والمثال 2-2، وحل الجزء الخاص بالتوازي من تمرين 3-2 في كتاب النشاط ص 25–26."}]},{"n":3,"focus":"التحقق العملي من المقاومة المكافئة ومسائل مختلطة","info":"<div><b>الدرس:<\/b> 2-2 توصيل المقاومات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 29–37 | كتاب النشاط: تمرين 3-2 ص 25–26، تمرين 4-2 ص 27<\/div><div><b>دليل المعلم:<\/b> ص 30–34<\/div><div><b>محور الحصة:<\/b> التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يتحقق عمليًا من قيم المقاومة المكافئة المحسوبة للتوصيلين.<\/li><li>يحل مسائل على التوصيل على التوالي والتوازي ويقارن بينهما.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبرر الاختلاف بين القيم المقيسة والمحسوبة بمصادر الخطأ في التجربة.<\/div>","t":"1. يتحقق عمليًا من قيم المقاومة المكافئة المحسوبة للتوصيلين.\n2. يحل مسائل على التوصيل على التوالي والتوازي ويقارن بينهما.\nمخرج تعليمي آخر: يبرر الاختلاف بين القيم المقيسة والمحسوبة بمصادر الخطأ في التجربة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتحقق عمليًا من قيم المقاومة المكافئة المحسوبة للتوصيلين.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحل مسائل على التوصيل على التوالي والتوازي ويقارن بينهما.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يبرر الاختلاف بين القيم المقيسة والمحسوبة بمصادر الخطأ في التجربة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يتحقق عمليًا من قيم المقاومة المكافئة المحسوبة للتوصيلين. ← تطبيق\n• يحل مسائل على التوصيل على التوالي والتوازي ويقارن بينهما. ← تحليل\n• يبرر الاختلاف بين القيم المقيسة والمحسوبة بمصادر الخطأ في التجربة. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم التعاوني<\/span><span>التعلم المبني على حل المشكلات<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم التعاوني\n• التعلم المبني على حل المشكلات\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>أخرى: مصدر جهد، مقاومات ثابتة 22 Ω و 47 Ω، أجهزة أميتر وفولتميتر، أسلاك، ملصقات<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• أخرى: مصدر جهد، مقاومات ثابتة 22 Ω و 47 Ω، أجهزة أميتر وفولتميتر، أسلاك، ملصقات"},{"h":"<div class=\"pills\"><span>المقاومة المكافئة<\/span><span>القيمة المقيسة<\/span><span>القيمة المحسوبة<\/span><span>مصادر الخطأ<\/span><\/div>","t":"المقاومة المكافئة، القيمة المقيسة، القيمة المحسوبة، مصادر الخطأ"},{"h":"<p>يعرض المعلم قيمتين لمقاومة مكافئة: محسوبة 15.0 Ω ومقيسة 15.6 Ω، ويسأل: هل أخطأ الطالب؟<\/p>","t":"يعرض المعلم قيمتين لمقاومة مكافئة: محسوبة 15.0 Ω ومقيسة 15.6 Ω، ويسأل: هل أخطأ الطالب؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض القيمتين.<\/td><td>يناقشون أسباب الفرق.<\/td><\/tr><tr><td class=\"tm\">16 د<\/td><td class=\"st\">النشاط 2-2 توصيل المقاومات (كتاب الطالب)<\/td><td>يوزع مقاومتين 22 Ω و 47 Ω مع أجهزة القياس ويطلب قياس المكافئة على التوالي والتوازي باستخدام <bdi>R = V ÷ I<\/bdi>.<\/td><td>يقيسون ويقارنون بالقيم المحسوبة (69 Ω و 15.0 Ω تقريبًا) ويعرضون نتائجهم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 4-2 المزيد عن توصيل المقاومات (كتاب النشاط ص 27)<\/td><td>يتابع الحل ويقدم تغذية راجعة.<\/td><td>يحلون مسائل مختلطة.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(4 دقائق) التهيئة\nدور المعلم: يعرض القيمتين.\nدور الطالب: يناقشون أسباب الفرق.\n\n(16 دقيقة) النشاط 2-2 توصيل المقاومات (كتاب الطالب)\nدور المعلم: يوزع مقاومتين 22 Ω و 47 Ω مع أجهزة القياس ويطلب قياس المكافئة على التوالي والتوازي باستخدام R = V ÷ I.\nدور الطالب: يقيسون ويقارنون بالقيم المحسوبة (69 Ω و 15.0 Ω تقريبًا) ويعرضون نتائجهم.\n\n(10 دقائق) تمرين 4-2 المزيد عن توصيل المقاومات (كتاب النشاط ص 27)\nدور المعلم: يتابع الحل ويقدم تغذية راجعة.\nدور الطالب: يحلون مسائل مختلطة.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقاومة المكافئة لمقاومتين 22 Ω و 47 Ω على التوالي؟<\/td><td>69 Ω.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب المكافئة للمقاومتين نفسيهما على التوازي.<\/td><td><bdi>R = (22 × 47) ÷ 69<\/bdi> ≈ 15.0 Ω.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر سببين للفرق بين القيمة المقيسة والمحسوبة للمقاومة المكافئة.<\/td><td>تفاوت القيم الحقيقية للمقاومات عن المكتوب عليها، ومقاومة أسلاك التوصيل، وعدم دقة القراءة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقاومة المكافئة لمقاومتين 22 Ω و 47 Ω على التوالي؟\nالإجابة النموذجية: 69 Ω.\n\n2) [المستوى المتوقع] احسب المكافئة للمقاومتين نفسيهما على التوازي.\nالإجابة النموذجية: R = (22 × 47) ÷ 69 ≈ 15.0 Ω.\n\n3) [المستوى المتقدم] اذكر سببين للفرق بين القيمة المقيسة والمحسوبة للمقاومة المكافئة.\nالإجابة النموذجية: تفاوت القيم الحقيقية للمقاومات عن المكتوب عليها، ومقاومة أسلاك التوصيل، وعدم دقة القراءة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: المقاومة المكافئة على التوالي أكبر من أكبر المقاومات.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>مقاومتان كل منهما 12 Ω. احسب المكافئة على التوالي ثم على التوازي.<\/td><td>على التوالي 24 Ω، وعلى التوازي 6 Ω.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لديك ثلاث مقاومات كل منها 6 Ω. كيف توصلها لتحصل على مقاومة مكافئة 9 Ω؟<\/td><td>نوصل اثنتين على التوازي (3 Ω) ثم الثالثة معهما على التوالي: <bdi>3 + 6 = 9 Ω<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: المقاومة المكافئة على التوالي أكبر من أكبر المقاومات.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] مقاومتان كل منهما 12 Ω. احسب المكافئة على التوالي ثم على التوازي.\nالإجابة النموذجية: على التوالي 24 Ω، وعلى التوازي 6 Ω.\n\n3) [المستوى المتقدم] لديك ثلاث مقاومات كل منها 6 Ω. كيف توصلها لتحصل على مقاومة مكافئة 9 Ω؟\nالإجابة النموذجية: نوصل اثنتين على التوازي (3 Ω) ثم الثالثة معهما على التوالي: 3 + 6 = 9 Ω."},{"h":"<p>إكمال تمرين 4-2 المزيد عن توصيل المقاومات في كتاب النشاط ص 27، وحل الأسئلة 5-2 إلى 13-2 وأسئلة نهاية الوحدة الثانية في كتاب الطالب.<\/p>","t":"إكمال تمرين 4-2 المزيد عن توصيل المقاومات في كتاب النشاط ص 27، وحل الأسئلة 5-2 إلى 13-2 وأسئلة نهاية الوحدة الثانية في كتاب الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-2 توصيل المقاومات<\/div><div><b>الوحدة:<\/b> الوحدة الثانية: مخططات الدوائر الكهربائية<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع (27/9–1/10/2026)، الأسبوع الخامس (4–8/10/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 29–37 | كتاب النشاط: تمرين 3-2 ص 25–26، تمرين 4-2 ص 27<\/div><div><b>دليل المعلم:<\/b> ص 30–34<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><ol class=\"ol\"><li>يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي.<\/li><li>يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه.<\/li><li>يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات.<\/div><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><ol class=\"ol\"><li>يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه.<\/li><li>يذكر أن المقاومة المكافئة لمقاومتين على التوازي أقل من أي منهما ويحسبها.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يذكر مزايا توصيل المصابيح على التوازي في الدائرة الكهربائية.<\/div><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><ol class=\"ol\"><li>يتحقق عمليًا من قيم المقاومة المكافئة المحسوبة للتوصيلين.<\/li><li>يحل مسائل على التوصيل على التوالي والتوازي ويقارن بينهما.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبرر الاختلاف بين القيم المقيسة والمحسوبة بمصادر الخطأ في التجربة.<\/div>","t":"الحصة 1: التوصيل على التوالي\n1. يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي.\n2. يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه.\n3. يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي.\nمخرج تعليمي آخر: يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات.\n\nالحصة 2: التوصيل على التوازي\n1. يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه.\n2. يذكر أن المقاومة المكافئة لمقاومتين على التوازي أقل من أي منهما ويحسبها.\nمخرج تعليمي آخر: يذكر مزايا توصيل المصابيح على التوازي في الدائرة الكهربائية.\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\n1. يتحقق عمليًا من قيم المقاومة المكافئة المحسوبة للتوصيلين.\n2. يحل مسائل على التوصيل على التوالي والتوازي ويقارن بينهما.\nمخرج تعليمي آخر: يبرر الاختلاف بين القيم المقيسة والمحسوبة بمصادر الخطأ في التجربة."},{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يفهم أن شدة التيار هي نفسها عند كل نقطة في الدائرة المتصلة على التوالي.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يذكر أن مجموع فروق الجهد عبر مكونات دائرة التوالي يساوي فرق جهد المصدر ويستخدمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب المقاومة المكافئة لمقاومتين أو أكثر على التوالي.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفسر ثبات التيار في دائرة التوالي بعدم استهلاك الإلكترونات.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتذكر أن التيار الخارج من المصدر يساوي مجموع التيارات في الفروع المتوازية ويستخدمه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذك
