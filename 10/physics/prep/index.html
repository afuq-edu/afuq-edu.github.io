<div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><div class=\"pills\"><span>التوصيل على التوازي<\/span><span>تيار الفرع<\/span><span>التيار الكلي<\/span><span>المقاومة المكافئة<\/span><span>تساوي الجهد على الفروع<\/span><\/div><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><div class=\"pills\"><span>المقاومة المكافئة<\/span><span>القيمة المقيسة<\/span><span>القيمة المحسوبة<\/span><span>مصادر الخطأ<\/span><\/div>","t":"الحصة 1: التوصيل على التوالي\nالتوصيل على التوالي، شدة التيار، فرق الجهد، المقاومة المكافئة، قانون أوم\n\nالحصة 2: التوصيل على التوازي\nالتوصيل على التوازي، تيار الفرع، التيار الكلي، المقاومة المكافئة، تساوي الجهد على الفروع\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\nالمقاومة المكافئة، القيمة المقيسة، القيمة المحسوبة، مصادر الخطأ"},{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><p>سؤال تشخيصي: في دائرة فيها مصباحان على التوالي، هل يكون التيار في المصباح الثاني أقل لأن الأول «استهلك» جزءًا منه؟<\/p><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><p>عرض: مصباحان على التوازي؛ يفك المعلم أحدهما ويسأل: لماذا بقي الآخر مضيئًا؟ وماذا لو كانا على التوالي؟<\/p><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><p>يعرض المعلم قيمتين لمقاومة مكافئة: محسوبة 15.0 Ω ومقيسة 15.6 Ω، ويسأل: هل أخطأ الطالب؟<\/p>","t":"الحصة 1: التوصيل على التوالي\nسؤال تشخيصي: في دائرة فيها مصباحان على التوالي، هل يكون التيار في المصباح الثاني أقل لأن الأول «استهلك» جزءًا منه؟\n\nالحصة 2: التوصيل على التوازي\nعرض: مصباحان على التوازي؛ يفك المعلم أحدهما ويسأل: لماذا بقي الآخر مضيئًا؟ وماذا لو كانا على التوالي؟\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\nيعرض المعلم قيمتين لمقاومة مكافئة: محسوبة 15.0 Ω ومقيسة 15.6 Ω، ويسأل: هل أخطأ الطالب؟"},{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال ويسجل الآراء.<\/td><td>يصوتون ويبررون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">قياس التيار والجهد<\/td><td>يبني دائرة توالي بمقاومتين ويضع أجهزة أميتر قبلهما وبينهما وبعدهما، ثم يقيس الجهد على كل مقاومة وعلى المصدر.<\/td><td>يسجلون القراءات ويلاحظون تساوي التيار وأن جهد المصدر يساوي مجموع الجهدين.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المقاومة المكافئة<\/td><td>يقدم <bdi>R = R₁ + R₂<\/bdi> ويحل مثالًا: 6 Ω و12 Ω مع بطارية 9 V.<\/td><td>يحسبون <bdi>R = 18 Ω<\/bdi> و <bdi>I = 0.5 A<\/bdi> ثم <bdi>V₁ = 3 V<\/bdi> و <bdi>V₂ = 6 V<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تطبيق (كتاب الطالب ص 29–32)<\/td><td>يوجه إلى حل أسئلة التوالي من مجموعة الأسئلة 5-2 إلى 13-2.<\/td><td>يحلون في أزواج.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يعالج تصور «استهلاك التيار» ويطرح التقويم.<\/td><td>يجيبون ويصححون تصوراتهم.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ العرض.<\/td><td>يقارنون بين التوصيلين.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">قياسات التوازي<\/td><td>يقيس التيار الكلي وتيار كل فرع والجهد على كل فرع.<\/td><td>يستنتجون <bdi>I = I₁ + I₂<\/bdi> وأن الجهد على الفرعين متساوٍ ويساوي جهد المصدر.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">حساب المقاومة المكافئة<\/td><td>يعرض مقاومة 6 Ω على بطارية 12 V (2 A)، ثم إضافة 6 Ω أخرى على التوازي (4 A) فتصبح المكافئة 3 Ω، ويقدم <bdi>1/R = 1/R₁ + 1/R₂<\/bdi>.<\/td><td>يحسبون المكافئة لـ 4 Ω و <bdi>12 Ω: R = 48 ÷ 16 = 3 Ω<\/bdi>، ويتحققون أنها أقل من 4 Ω.<\/td><\/tr><tr><td class=\"tm\">6 د<\/td><td class=\"st\">مزايا التوازي<\/td><td>يناقش مزايا التوازي في إنارة المنازل.<\/td><td>يعددون: كل مصباح يأخذ جهد المصدر كاملًا، ويمكن تشغيله منفردًا، ولا تنطفئ البقية إذا تلف أحدها.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض القيمتين.<\/td><td>يناقشون أسباب الفرق.<\/td><\/tr><tr><td class=\"tm\">16 د<\/td><td class=\"st\">النشاط 2-2 توصيل المقاومات (كتاب الطالب)<\/td><td>يوزع مقاومتين 22 Ω و 47 Ω مع أجهزة القياس ويطلب قياس المكافئة على التوالي والتوازي باستخدام <bdi>R = V ÷ I<\/bdi>.<\/td><td>يقيسون ويقارنون بالقيم المحسوبة (69 Ω و 15.0 Ω تقريبًا) ويعرضون نتائجهم.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 4-2 المزيد عن توصيل المقاومات (كتاب النشاط ص 27)<\/td><td>يتابع الحل ويقدم تغذية راجعة.<\/td><td>يحلون مسائل مختلطة.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يكلف بالواجب.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التوصيل على التوالي\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال ويسجل الآراء.\nدور الطالب: يصوتون ويبررون.\n\n(12 دقيقة) قياس التيار والجهد\nدور المعلم: يبني دائرة توالي بمقاومتين ويضع أجهزة أميتر قبلهما وبينهما وبعدهما، ثم يقيس الجهد على كل مقاومة وعلى المصدر.\nدور الطالب: يسجلون القراءات ويلاحظون تساوي التيار وأن جهد المصدر يساوي مجموع الجهدين.\n\n(10 دقائق) المقاومة المكافئة\nدور المعلم: يقدم R = R₁ + R₂ ويحل مثالًا: 6 Ω و12 Ω مع بطارية 9 V.\nدور الطالب: يحسبون R = 18 Ω و I = 0.5 A ثم V₁ = 3 V و V₂ = 6 V.\n\n(8 دقائق) تطبيق (كتاب الطالب ص 29–32)\nدور المعلم: يوجه إلى حل أسئلة التوالي من مجموعة الأسئلة 5-2 إلى 13-2.\nدور الطالب: يحلون في أزواج.\n\n(5 دقائق) التقويم\nدور المعلم: يعالج تصور «استهلاك التيار» ويطرح التقويم.\nدور الطالب: يجيبون ويصححون تصوراتهم.\n\nالحصة 2: التوصيل على التوازي\n(5 دقائق) التهيئة\nدور المعلم: ينفذ العرض.\nدور الطالب: يقارنون بين التوصيلين.\n\n(12 دقيقة) قياسات التوازي\nدور المعلم: يقيس التيار الكلي وتيار كل فرع والجهد على كل فرع.\nدور الطالب: يستنتجون I = I₁ + I₂ وأن الجهد على الفرعين متساوٍ ويساوي جهد المصدر.\n\n(12 دقيقة) حساب المقاومة المكافئة\nدور المعلم: يعرض مقاومة 6 Ω على بطارية 12 V (2 A)، ثم إضافة 6 Ω أخرى على التوازي (4 A) فتصبح المكافئة 3 Ω، ويقدم 1/R = 1/R₁ + 1/R₂.\nدور الطالب: يحسبون المكافئة لـ 4 Ω و 12 Ω: R = 48 ÷ 16 = 3 Ω، ويتحققون أنها أقل من 4 Ω.\n\n(6 دقائق) مزايا التوازي\nدور المعلم: يناقش مزايا التوازي في إنارة المنازل.\nدور الطالب: يعددون: كل مصباح يأخذ جهد المصدر كاملًا، ويمكن تشغيله منفردًا، ولا تنطفئ البقية إذا تلف أحدها.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\n(4 دقائق) التهيئة\nدور المعلم: يعرض القيمتين.\nدور الطالب: يناقشون أسباب الفرق.\n\n(16 دقيقة) النشاط 2-2 توصيل المقاومات (كتاب الطالب)\nدور المعلم: يوزع مقاومتين 22 Ω و 47 Ω مع أجهزة القياس ويطلب قياس المكافئة على التوالي والتوازي باستخدام R = V ÷ I.\nدور الطالب: يقيسون ويقارنون بالقيم المحسوبة (69 Ω و 15.0 Ω تقريبًا) ويعرضون نتائجهم.\n\n(10 دقائق) تمرين 4-2 المزيد عن توصيل المقاومات (كتاب النشاط ص 27)\nدور المعلم: يتابع الحل ويقدم تغذية راجعة.\nدور الطالب: يحلون مسائل مختلطة.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يكلف بالواجب.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>مقاومتان 4 Ω و 8 Ω على التوالي. احسب المقاومة المكافئة.<\/td><td><bdi>R = 4 + 8 = 12 Ω<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>بطارية 12 V وُصلت بمقاومتين على التوالي، فرق الجهد على الأولى 5 V. ما فرق الجهد على الثانية؟<\/td><td><bdi>12 − 5 = 7 V<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مقاومتان 10 Ω و 20 Ω على التوالي مع مصدر 6 V. احسب التيار وفرق الجهد على كل مقاومة.<\/td><td><bdi>R = 30 Ω<\/bdi>، <bdi>I = 6 ÷ 30 = 0.2 A<\/bdi>، <bdi>V₁ = 2 V<\/bdi>، <bdi>V₂ = 4 V<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>تيار فرعين 0.4 A و 0.6 A. ما التيار الخارج من المصدر؟<\/td><td>1.0 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب المقاومة المكافئة لمقاومتين 10 Ω و 10 Ω على التوازي.<\/td><td><bdi>R = (10 × 10) ÷ 20 = 5 Ω<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مقاومتان 3 Ω و 6 Ω على التوازي مع بطارية 6 V. احسب تيار كل فرع والتيار الكلي، وتحقق بالمقاومة المكافئة.<\/td><td><bdi>I₁ = 2 A<\/bdi>، <bdi>I₂ = 1 A<\/bdi>، <bdi>I = 3 A<\/bdi>؛ <bdi>R = 18 ÷ 9 = 2 Ω<\/bdi> و <bdi>6 ÷ 2 = 3 A<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقاومة المكافئة لمقاومتين 22 Ω و 47 Ω على التوالي؟<\/td><td>69 Ω.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب المكافئة للمقاومتين نفسيهما على التوازي.<\/td><td><bdi>R = (22 × 47) ÷ 69<\/bdi> ≈ 15.0 Ω.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر سببين للفرق بين القيمة المقيسة والمحسوبة للمقاومة المكافئة.<\/td><td>تفاوت القيم الحقيقية للمقاومات عن المكتوب عليها، ومقاومة أسلاك التوصيل، وعدم دقة القراءة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التوصيل على التوالي\n1) [مستوى الدعم] مقاومتان 4 Ω و 8 Ω على التوالي. احسب المقاومة المكافئة.\nالإجابة النموذجية: R = 4 + 8 = 12 Ω.\n\n2) [المستوى المتوقع] بطارية 12 V وُصلت بمقاومتين على التوالي، فرق الجهد على الأولى 5 V. ما فرق الجهد على الثانية؟\nالإجابة النموذجية: 12 − 5 = 7 V.\n\n3) [المستوى المتقدم] مقاومتان 10 Ω و 20 Ω على التوالي مع مصدر 6 V. احسب التيار وفرق الجهد على كل مقاومة.\nالإجابة النموذجية: R = 30 Ω، I = 6 ÷ 30 = 0.2 A، V₁ = 2 V، V₂ = 4 V.\n\nالحصة 2: التوصيل على التوازي\n1) [مستوى الدعم] تيار فرعين 0.4 A و 0.6 A. ما التيار الخارج من المصدر؟\nالإجابة النموذجية: 1.0 A.\n\n2) [المستوى المتوقع] احسب المقاومة المكافئة لمقاومتين 10 Ω و 10 Ω على التوازي.\nالإجابة النموذجية: R = (10 × 10) ÷ 20 = 5 Ω.\n\n3) [المستوى المتقدم] مقاومتان 3 Ω و 6 Ω على التوازي مع بطارية 6 V. احسب تيار كل فرع والتيار الكلي، وتحقق بالمقاومة المكافئة.\nالإجابة النموذجية: I₁ = 2 A، I₂ = 1 A، I = 3 A؛ R = 18 ÷ 9 = 2 Ω و 6 ÷ 2 = 3 A.\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\n1) [مستوى الدعم] ما المقاومة المكافئة لمقاومتين 22 Ω و 47 Ω على التوالي؟\nالإجابة النموذجية: 69 Ω.\n\n2) [المستوى المتوقع] احسب المكافئة للمقاومتين نفسيهما على التوازي.\nالإجابة النموذجية: R = (22 × 47) ÷ 69 ≈ 15.0 Ω.\n\n3) [المستوى المتقدم] اذكر سببين للفرق بين القيمة المقيسة والمحسوبة للمقاومة المكافئة.\nالإجابة النموذجية: تفاوت القيم الحقيقية للمقاومات عن المكتوب عليها، ومقاومة أسلاك التوصيل، وعدم دقة القراءة."},{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: في دائرة التوالي تكون شدة التيار متساوية في جميع أجزائها.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا لا يقل التيار بعد مروره في المصباح الأول في دائرة التوالي؟<\/td><td>لأن الإلكترونات لا تُستهلك؛ ما يقل هو الطاقة التي تحملها، فعدد الإلكترونات المارة بكل نقطة في الثانية ثابت.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ثلاث مقاومات متماثلة على التوالي مع مصدر 9 V والتيار 0.5 A. احسب قيمة كل مقاومة.<\/td><td>R الكلية = <bdi>9 ÷ 0.5 = 18 Ω<\/bdi>، فكل مقاومة = 6 Ω.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: المقاومة المكافئة لمقاومتين على التوازي ......... من أصغرهما.<\/td><td>أقل.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اذكر ميزتين لتوصيل مصابيح المنزل على التوازي.<\/td><td>يحصل كل مصباح على جهد المصدر كاملًا، ويمكن التحكم في كل مصباح بمفتاح مستقل، ولا تنطفئ البقية إذا تلف أحدها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>أضيفت مقاومة ثالثة على التوازي مع مقاومتين. ماذا يحدث للمقاومة المكافئة وللتيار الكلي؟ فسّر.<\/td><td>تقل المقاومة المكافئة ويزداد التيار الكلي؛ لأن الفرع الجديد مسار إضافي لمرور التيار.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: المقاومة المكافئة على التوالي أكبر من أكبر المقاومات.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>مقاومتان كل منهما 12 Ω. احسب المكافئة على التوالي ثم على التوازي.<\/td><td>على التوالي 24 Ω، وعلى التوازي 6 Ω.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لديك ثلاث مقاومات كل منها 6 Ω. كيف توصلها لتحصل على مقاومة مكافئة 9 Ω؟<\/td><td>نوصل اثنتين على التوازي (3 Ω) ثم الثالثة معهما على التوالي: <bdi>3 + 6 = 9 Ω<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: التوصيل على التوالي\n1) [مستوى الدعم] صواب أم خطأ: في دائرة التوالي تكون شدة التيار متساوية في جميع أجزائها.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا لا يقل التيار بعد مروره في المصباح الأول في دائرة التوالي؟\nالإجابة النموذجية: لأن الإلكترونات لا تُستهلك؛ ما يقل هو الطاقة التي تحملها، فعدد الإلكترونات المارة بكل نقطة في الثانية ثابت.\n\n3) [المستوى المتقدم] ثلاث مقاومات متماثلة على التوالي مع مصدر 9 V والتيار 0.5 A. احسب قيمة كل مقاومة.\nالإجابة النموذجية: R الكلية = 9 ÷ 0.5 = 18 Ω، فكل مقاومة = 6 Ω.\n\nالحصة 2: التوصيل على التوازي\n1) [مستوى الدعم] أكمل: المقاومة المكافئة لمقاومتين على التوازي ......... من أصغرهما.\nالإجابة النموذجية: أقل.\n\n2) [المستوى المتوقع] اذكر ميزتين لتوصيل مصابيح المنزل على التوازي.\nالإجابة النموذجية: يحصل كل مصباح على جهد المصدر كاملًا، ويمكن التحكم في كل مصباح بمفتاح مستقل، ولا تنطفئ البقية إذا تلف أحدها.\n\n3) [المستوى المتقدم] أضيفت مقاومة ثالثة على التوازي مع مقاومتين. ماذا يحدث للمقاومة المكافئة وللتيار الكلي؟ فسّر.\nالإجابة النموذجية: تقل المقاومة المكافئة ويزداد التيار الكلي؛ لأن الفرع الجديد مسار إضافي لمرور التيار.\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\n1) [مستوى الدعم] صواب أم خطأ: المقاومة المكافئة على التوالي أكبر من أكبر المقاومات.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] مقاومتان كل منهما 12 Ω. احسب المكافئة على التوالي ثم على التوازي.\nالإجابة النموذجية: على التوالي 24 Ω، وعلى التوازي 6 Ω.\n\n3) [المستوى المتقدم] لديك ثلاث مقاومات كل منها 6 Ω. كيف توصلها لتحصل على مقاومة مكافئة 9 Ω؟\nالإجابة النموذجية: نوصل اثنتين على التوازي (3 Ω) ثم الثالثة معهما على التوالي: 3 + 6 = 9 Ω."},{"h":"<div class=\"psub\">الحصة 1: التوصيل على التوالي<\/div><p>مراجعة كتاب الطالب ص 29–32 والمثال 1-2، وحل الجزء الخاص بالتوالي من تمرين 3-2 توصيل المقاومات في كتاب النشاط ص 25–26.<\/p><div class=\"psub\">الحصة 2: التوصيل على التوازي<\/div><p>مراجعة كتاب الطالب ص 32–35 والمثال 2-2، وحل الجزء الخاص بالتوازي من تمرين 3-2 في كتاب النشاط ص 25–26.<\/p><div class=\"psub\">الحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة<\/div><p>إكمال تمرين 4-2 المزيد عن توصيل المقاومات في كتاب النشاط ص 27، وحل الأسئلة 5-2 إلى 13-2 وأسئلة نهاية الوحدة الثانية في كتاب الطالب.<\/p>","t":"الحصة 1: التوصيل على التوالي\nمراجعة كتاب الطالب ص 29–32 والمثال 1-2، وحل الجزء الخاص بالتوالي من تمرين 3-2 توصيل المقاومات في كتاب النشاط ص 25–26.\n\nالحصة 2: التوصيل على التوازي\nمراجعة كتاب الطالب ص 32–35 والمثال 2-2، وحل الجزء الخاص بالتوازي من تمرين 3-2 في كتاب النشاط ص 25–26.\n\nالحصة 3: التحقق العملي من المقاومة المكافئة ومسائل مختلطة\nإكمال تمرين 4-2 المزيد عن توصيل المقاومات في كتاب النشاط ص 27، وحل الأسئلة 5-2 إلى 13-2 وأسئلة نهاية الوحدة الثانية في كتاب الطالب."}]}},{"label":"1-3 المخاطر الكهربائية","unit":"الوحدة الثالثة: مخاطر الكهرباء","periods":[{"n":1,"focus":"تلف العزل وسخونة الكابلات والرطوبة","info":"<div><b>الدرس:<\/b> 1-3 المخاطر الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: مخاطر الكهرباء<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 38 | كتاب النشاط: تمرين 2-3 ص 29<\/div><div><b>دليل المعلم:<\/b> ص 41–42<\/div><div><b>محور الحصة:<\/b> تلف العزل وسخونة الكابلات والرطوبة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد المخاطر الكهربائية: تلف نظام العزل، وزيادة سخونة الكابلات، والرطوبة.<\/li><li>يفسر كيف يؤدي كل خطر إلى صدمة كهربائية أو حريق.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح إجراءات وقائية للحد من كل خطر في المنزل والمدرسة.<\/div>","t":"1. يحدد المخاطر الكهربائية: تلف نظام العزل، وزيادة سخونة الكابلات، والرطوبة.\n2. يفسر كيف يؤدي كل خطر إلى صدمة كهربائية أو حريق.\nمخرج تعليمي آخر: يقترح إجراءات وقائية للحد من كل خطر في المنزل والمدرسة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد المخاطر الكهربائية: تلف نظام العزل، وزيادة سخونة الكابلات، والرطوبة.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يفسر كيف يؤدي كل خطر إلى صدمة كهربائية أو حريق.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقترح إجراءات وقائية للحد من كل خطر في المنزل والمدرسة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يحدد المخاطر الكهربائية: تلف نظام العزل، وزيادة سخونة الكابلات، والرطوبة. ← تذكر\n• يفسر كيف يؤدي كل خطر إلى صدمة كهربائية أو حريق. ← فهم\n• يقترح إجراءات وقائية للحد من كل خطر في المنزل والمدرسة. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الوسائل المتعددة (سمعية - بصرية)"},{"h":"<div class=\"pills\"><span>المخاطر الكهربائية<\/span><span>تلف العزل<\/span><span>سخونة الكابلات<\/span><span>الرطوبة<\/span><span>الصدمة الكهربائية<\/span><\/div>","t":"المخاطر الكهربائية، تلف العزل، سخونة الكابلات، الرطوبة، الصدمة الكهربائية"},{"h":"<p>يعرض صورًا لمقبس مثقل بوصلات كثيرة، وسلك متشقق العزل، وجهاز كهربائي قرب حوض ماء، ويسأل: ما الخطر في كل صورة؟<\/p>","t":"يعرض صورًا لمقبس مثقل بوصلات كثيرة، وسلك متشقق العزل، وجهاز كهربائي قرب حوض ماء، ويسأل: ما الخطر في كل صورة؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصور على السبورة الذكية.<\/td><td>يحددون الخطر مبدئيًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">قراءة ونقاش (كتاب الطالب ص 38)<\/td><td>يوجه إلى القراءة ويوضح العلاقة بين التيار الكبير والسخونة، وبين الماء والتوصيل.<\/td><td>يستخرجون المخاطر الثلاثة وأسبابها.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">بطاقة تقييم مخاطر<\/td><td>يكلف كل مجموعة بموقف (مطبخ، حمام، فصل، مختبر).<\/td><td>يحددون الخطر وسببه والإجراء الوقائي ويعرضون بطاقتهم.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 2-3 المخاطر الكهربائية (كتاب النشاط ص 29)<\/td><td>يوجه إلى بدء الحل.<\/td><td>يحلون الأسئلة الأولى.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية.\nدور الطالب: يحددون الخطر مبدئيًا.\n\n(10 دقائق) قراءة ونقاش (كتاب الطالب ص 38)\nدور المعلم: يوجه إلى القراءة ويوضح العلاقة بين التيار الكبير والسخونة، وبين الماء والتوصيل.\nدور الطالب: يستخرجون المخاطر الثلاثة وأسبابها.\n\n(15 دقيقة) بطاقة تقييم مخاطر\nدور المعلم: يكلف كل مجموعة بموقف (مطبخ، حمام، فصل، مختبر).\nدور الطالب: يحددون الخطر وسببه والإجراء الوقائي ويعرضون بطاقتهم.\n\n(5 دقائق) تمرين 2-3 المخاطر الكهربائية (كتاب النشاط ص 29)\nدور المعلم: يوجه إلى بدء الحل.\nدور الطالب: يحلون الأسئلة الأولى.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة مخاطر كهربائية.<\/td><td>تلف العزل، وزيادة سخونة الكابلات، والرطوبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُعد تشقق عزل السلك خطرًا؟<\/td><td>لأنه قد يكشف الموصل فيلمسه الشخص فيصاب بصدمة، أو تتلامس الأسلاك فيحدث قصر وحريق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد توصيل أجهزة كثيرة في مقبس واحد خطرًا؟<\/td><td>لأن التيار الكلي في الكابل يزداد فترتفع حرارته وقد يذوب العزل ويحدث حريق.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ثلاثة مخاطر كهربائية.\nالإجابة النموذجية: تلف العزل، وزيادة سخونة الكابلات، والرطوبة.\n\n2) [المستوى المتوقع] لماذا يُعد تشقق عزل السلك خطرًا؟\nالإجابة النموذجية: لأنه قد يكشف الموصل فيلمسه الشخص فيصاب بصدمة، أو تتلامس الأسلاك فيحدث قصر وحريق.\n\n3) [المستوى المتقدم] لماذا يُعد توصيل أجهزة كثيرة في مقبس واحد خطرًا؟\nالإجابة النموذجية: لأن التيار الكلي في الكابل يزداد فترتفع حرارته وقد يذوب العزل ويحدث حريق."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: استخدام المجفف الكهربائي بيد مبللة آمن إذا كان الجهاز جديدًا.<\/td><td>خطأ؛ الماء يوصل الكهرباء فيزيد خطر الصدمة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يسبب زيادة سخونة الكابلات؟<\/td><td>مرور تيار أكبر مما صممت له الكابلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم ثلاث قواعد للوقاية من المخاطر الكهربائية في المنزل مع تبرير كل منها.<\/td><td>استبدال الأسلاك التالفة فورًا لمنع الصدمة، وعدم إثقال المقابس لمنع السخونة، وإبعاد الأجهزة عن الماء وتجفيف اليدين لأن الماء يوصل الكهرباء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: استخدام المجفف الكهربائي بيد مبللة آمن إذا كان الجهاز جديدًا.\nالإجابة النموذجية: خطأ؛ الماء يوصل الكهرباء فيزيد خطر الصدمة.\n\n2) [المستوى المتوقع] ما الذي يسبب زيادة سخونة الكابلات؟\nالإجابة النموذجية: مرور تيار أكبر مما صممت له الكابلات.\n\n3) [المستوى المتقدم] صمم ثلاث قواعد للوقاية من المخاطر الكهربائية في المنزل مع تبرير كل منها.\nالإجابة النموذجية: استبدال الأسلاك التالفة فورًا لمنع الصدمة، وعدم إثقال المقابس لمنع السخونة، وإبعاد الأجهزة عن الماء وتجفيف اليدين لأن الماء يوصل الكهرباء."},{"h":"<p>مراجعة كتاب الطالب ص 38، وحل تمرين 2-3 المخاطر الكهربائية في كتاب النشاط ص 29، ومناقشة قواعد السلامة الكهربائية مع ولي الأمر.<\/p>","t":"مراجعة كتاب الطالب ص 38، وحل تمرين 2-3 المخاطر الكهربائية في كتاب النشاط ص 29، ومناقشة قواعد السلامة الكهربائية مع ولي الأمر."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-3 المخاطر الكهربائية<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: مخاطر الكهرباء<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس (4–8/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 38 | كتاب النشاط: تمرين 2-3 ص 29<\/div><div><b>دليل المعلم:<\/b> ص 41–42<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تلف العزل وسخونة الكابلات والرطوبة<\/div><ol class=\"ol\"><li>يحدد المخاطر الكهربائية: تلف نظام العزل، وزيادة سخونة الكابلات، والرطوبة.<\/li><li>يفسر كيف يؤدي كل خطر إلى صدمة كهربائية أو حريق.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقترح إجراءات وقائية للحد من كل خطر في المنزل والمدرسة.<\/div>","t":"الحصة 1: تلف  سخونة الكابلات، الرطوبة، الصدمة الكهربائية"},{"h":"<div class=\"psub\">الحصة 1: تلف العزل وسخونة الكابلات والرطوبة<\/div><p>يعرض صورًا لمقبس مثقل بوصلات كثيرة، وسلك متشقق العزل، وجهاز كهربائي قرب حوض ماء، ويسأل: ما الخطر في كل صورة؟<\/p>","t":"الحصة 1: تلف العزل وسخونة الكابلات والرطوبة\nيعرض صورًا لمقبس مثقل بوصلات كثيرة، وسلك متشقق العزل، وجهاز كهربائي قرب حوض ماء، ويسأل: ما الخطر في كل صورة؟"},{"h":"<div class=\"psub\">الحصة 1: تلف العزل وسخونة الكابلات والرطوبة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصور على السبورة الذكية.<\/td><td>يحددون الخطر مبدئيًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">قراءة ونقاش (كتاب الطالب ص 38)<\/td><td>يوجه إلى القراءة ويوضح العلاقة بين التيار الكبير والسخونة، وبين الماء والتوصيل.<\/td><td>يستخرجون المخاطر الثلاثة وأسبابها.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">بطاقة تقييم مخاطر<\/td><td>يكلف كل مجموعة بموقف (مطبخ، حمام، فصل، مختبر).<\/td><td>يحددون الخطر وسببه والإجراء الوقائي ويعرضون بطاقتهم.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تمرين 2-3 المخاطر الكهربائية (كتاب النشاط ص 29)<\/td><td>يوجه إلى بدء الحل.<\/td><td>يحلون الأسئلة الأولى.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تلف العزل وسخونة الكابلات والرطوبة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصور على السبورة الذكية.\nدور الطالب: يحددون الخطر مبدئيًا.\n\n(10 دقائق) قراءة ونقاش (كتاب الطالب ص 38)\nدور المعلم: يوجه إلى القراءة ويوضح العلاقة بين التيار الكبير والسخونة، وبين الماء والتوصيل.\nدور الطالب: يستخرجون المخاطر الثلاثة وأسبابها.\n\n(15 دقيقة) بطاقة تقييم مخاطر\nدور المعلم: يكلف كل مجموعة بموقف (مطبخ، حمام، فصل، مختبر).\nدور الطالب: يحددون الخطر وسببه والإجراء الوقائي ويعرضون بطاقتهم.\n\n(5 دقائق) تمرين 2-3 المخاطر الكهربائية (كتاب النشاط ص 29)\nدور المعلم: يوجه إلى بدء الحل.\nدور الطالب: يحلون الأسئلة الأولى.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تلف العزل وسخونة الكابلات والرطوبة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة مخاطر كهربائية.<\/td><td>تلف العزل، وزيادة سخونة الكابلات، والرطوبة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يُعد تشقق عزل السلك خطرًا؟<\/td><td>لأنه قد يكشف الموصل فيلمسه الشخص فيصاب بصدمة، أو تتلامس الأسلاك فيحدث قصر وحريق.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُعد توصيل أجهزة كثيرة في مقبس واحد خطرًا؟<\/td><td>لأن التيار الكلي في الكابل يزداد فترتفع حرارته وقد يذوب العزل ويحدث حريق.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تلف العزل وسخونة الكابلات والرطوبة\n1) [مستوى الدعم] اذكر ثلاثة مخاطر كهربائية.\nالإجابة النموذجية: تلف العزل، وزيادة سخونة الكابلات، والرطوبة.\n\n2) [المستوى المتوقع] لماذا يُعد تشقق عزل السلك خطرًا؟\nالإجابة النموذجية: لأنه قد يكشف الموصل فيلمسه الشخص فيصاب بصدمة، أو تتلامس الأسلاك فيحدث قصر وحريق.\n\n3) [المستوى المتقدم] لماذا يُعد توصيل أجهزة كثيرة في مقبس واحد خطرًا؟\nالإجابة النموذجية: لأن التيار الكلي في الكابل يزداد فترتفع حرارته وقد يذوب العزل ويحدث حريق."},{"h":"<div class=\"psub\">الحصة 1: تلف العزل وسخونة الكابلات والرطوبة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: استخدام المجفف الكهربائي بيد مبللة آمن إذا كان الجهاز جديدًا.<\/td><td>خطأ؛ الماء يوصل الكهرباء فيزيد خطر الصدمة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ما الذي يسبب زيادة سخونة الكابلات؟<\/td><td>مرور تيار أكبر مما صممت له الكابلات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم ثلاث قواعد للوقاية من المخاطر الكهربائية في المنزل مع تبرير كل منها.<\/td><td>استبدال الأسلاك التالفة فورًا لمنع الصدمة، وعدم إثقال المقابس لمنع السخونة، وإبعاد الأجهزة عن الماء وتجفيف اليدين لأن الماء يوصل الكهرباء.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تلف العزل وسخونة الكابلات والرطوبة\n1) [مستوى الدعم] صواب أم خطأ: استخدام المجفف الكهربائي بيد مبللة آمن إذا كان الجهاز جديدًا.\nالإجابة النموذجية: خطأ؛ الماء يوصل الكهرباء فيزيد خطر الصدمة.\n\n2) [المستوى المتوقع] ما الذي يسبب زيادة سخونة الكابلات؟\nالإجابة النموذجية: مرور تيار أكبر مما صممت له الكابلات.\n\n3) [المستوى المتقدم] صمم ثلاث قواعد للوقاية من المخاطر الكهربائية في المنزل مع تبرير كل منها.\nالإجابة النموذجية: استبدال الأسلاك التالفة فورًا لمنع الصدمة، وعدم إثقال المقابس لمنع السخونة، وإبعاد الأجهزة عن الماء وتجفيف اليدين لأن الماء يوصل الكهرباء."},{"h":"<div class=\"psub\">الحصة 1: تلف العزل وسخونة الكابلات والرطوبة<\/div><p>مراجعة كتاب الطالب ص 38، وحل تمرين 2-3 المخاطر الكهربائية في كتاب النشاط ص 29، ومناقشة قواعد السلامة الكهربائية مع ولي الأمر.<\/p>","t":"الحصة 1: تلف العزل وسخونة الكابلات والرطوبة\nمراجعة كتاب الطالب ص 38، وحل تمرين 2-3 المخاطر الكهربائية في كتاب النشاط ص 29، ومناقشة قواعد السلامة الكهربائية مع ولي الأمر."}]}},{"label":"2-3 المنصهرات","unit":"الوحدة الثالثة: مخاطر الكهرباء","periods":[{"n":1,"focus":"كيف يحمي المنصهر الدائرة","info":"<div><b>الدرس:<\/b> 2-3 المنصهرات<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: مخاطر الكهرباء<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–42 | كتاب النشاط: تمرين 1-3 ص 28<\/div><div><b>دليل المعلم:<\/b> ص 41–42<\/div><div><b>محور الحصة:<\/b> كيف يحمي المنصهر الدائرة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر أن المنصهر يحمي الدائرة الكهربائية.<\/li><li>يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام.<\/div>","t":"1. يذكر أن المنصهر يحمي الدائرة الكهربائية.\n2. يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة.\nمخرج تعليمي آخر: يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن المنصهر يحمي الدائرة الكهربائية.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يذكر أن المنصهر يحمي الدائرة الكهربائية. ← تذكر\n• يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة. ← فهم\n• يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: منصهرات بقيم 3 A و 5 A و 13 A، قابس مفتوح، صوف فولاذي، مصدر جهد منخفض، قماش مقاوم للحرارة، نظارات واقية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: منصهرات بقيم 3 A و 5 A و 13 A، قابس مفتوح، صوف فولاذي، مصدر جهد منخفض، قماش مقاوم للحرارة، نظارات واقية"},{"h":"<div class=\"pills\"><span>المنصهر<\/span><span>القيمة المقننة<\/span><span>القاطع الكهربائي<\/span><span>التيار الزائد<\/span><span>قصر الدائرة<\/span><\/div>","t":"المنصهر، القيمة المقننة، القاطع الكهربائي، التيار الزائد، قصر الدائرة"},{"h":"<p>يعرض قابسًا مفتوحًا ويشير إلى المنصهر داخله ويسأل: لماذا يوجد هنا جزء صغير صُمم لينقطع؟<\/p>","t":"يعرض قابسًا مفتوحًا ويشير إلى المنصهر داخله ويسأل: لماذا يوجد هنا جزء صغير صُمم لينقطع؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض القابس والمنصهرات.<\/td><td>يلاحظون القيم المكتوبة على المنصهرات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">عرض عملي من النشاط 1-3 (إثرائي)<\/td><td>يمرر تيارًا في شعيرات رفيعة من الصوف الفولاذي على قماش مقاوم للحرارة، مع النظارات الواقية وإبقاء الطلبة على مسافة آمنة.<\/td><td>يلاحظون توهج الشعيرات ثم انقطاعها ويربطون ذلك بعمل المنصهر.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">شرح المبدأ<\/td><td>يشرح أن المنصهر سلك رفيع يوصل على التوالي مع الجهاز في السلك الحي، ينصهر عند تجاوز التيار قيمته فيفتح الدائرة.<\/td><td>يرسمون مخطط دائرة فيها منصهر على التوالي مع الجهاز.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المنصهر أم القاطع؟<\/td><td>يذكّر بالقواطع التي درسوها في الصف التاسع ويقارن.<\/td><td>يكملون جدول مقارنة: سرعة القطع والحاجة إلى الاستبدال.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض القابس والمنصهرات.\nدور الطالب: يلاحظون القيم المكتوبة على المنصهرات.\n\n(12 دقيقة) عرض عملي من النشاط 1-3 (إثرائي)\nدور المعلم: يمرر تيارًا في شعيرات رفيعة من الصوف الفولاذي على قماش مقاوم للحرارة، مع النظارات الواقية وإبقاء الطلبة على مسافة آمنة.\nدور الطالب: يلاحظون توهج الشعيرات ثم انقطاعها ويربطون ذلك بعمل المنصهر.\n\n(10 دقائق) شرح المبدأ\nدور المعلم: يشرح أن المنصهر سلك رفيع يوصل على التوالي مع الجهاز في السلك الحي، ينصهر عند تجاوز التيار قيمته فيفتح الدائرة.\nدور الطالب: يرسمون مخطط دائرة فيها منصهر على التوالي مع الجهاز.\n\n(8 دقائق) المنصهر أم القاطع؟\nدور المعلم: يذكّر بالقواطع التي درسوها في الصف التاسع ويقارن.\nدور الطالب: يكملون جدول مقارنة: سرعة القطع والحاجة إلى الاستبدال.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة المنصهر؟<\/td><td>حماية الدائرة والأسلاك والأجهزة من التيار الزائد بقطع الدائرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يوصل المنصهر على التوالي مع الجهاز؟<\/td><td>ليمر فيه التيار نفسه المار في الجهاز، فإذا انصهر انقطع التيار عن الجهاز كله.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر ميزتين للقاطع الكهربائي مقارنة بالمنصهر.<\/td><td>يقطع الدائرة بسرعة أكبر، ويمكن إعادة ضبطه بعد إصلاح العطل دون استبداله.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وظيفة المنصهر؟\nالإجابة النموذجية: حماية الدائرة والأسلاك والأجهزة من التيار الزائد بقطع الدائرة.\n\n2) [المستوى المتوقع] لماذا يوصل المنصهر على التوالي مع الجهاز؟\nالإجابة النموذجية: ليمر فيه التيار نفسه المار في الجهاز، فإذا انصهر انقطع التيار عن الجهاز كله.\n\n3) [المستوى المتقدم] اذكر ميزتين للقاطع الكهربائي مقارنة بالمنصهر.\nالإجابة النموذجية: يقطع الدائرة بسرعة أكبر، ويمكن إعادة ضبطه بعد إصلاح العطل دون استبداله."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ينصهر سلك المنصهر عندما يتجاوز التيار .........<\/td><td>القيمة المقننة للمنصهر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يحدث للدائرة عند انصهار المنصهر؟<\/td><td>تنفتح فيتوقف مرور التيار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يُستبدل منصهر محترق بسلك نحاسي سميك؟<\/td><td>لأن السلك السميك لا ينصهر عند التيار الزائد فلا يحمي الدائرة، فتسخن الأسلاك وقد يحدث حريق أو يتلف الجهاز.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: ينصهر سلك المنصهر عندما يتجاوز التيار .........\nالإجابة النموذجية: القيمة المقننة للمنصهر.\n\n2) [المستوى المتوقع] ماذا يحدث للدائرة عند انصهار المنصهر؟\nالإجابة النموذجية: تنفتح فيتوقف مرور التيار.\n\n3) [المستوى المتقدم] لماذا لا يُستبدل منصهر محترق بسلك نحاسي سميك؟\nالإجابة النموذجية: لأن السلك السميك لا ينصهر عند التيار الزائد فلا يحمي الدائرة، فتسخن الأسلاك وقد يحدث حريق أو يتلف الجهاز."},{"h":"<p>مراجعة كتاب الطالب ص 39–40، والتعرف على قيم المنصهرات المكتوبة على قوابس الأجهزة المنزلية بإشراف ولي الأمر ودون فتح أي جهاز موصول.<\/p>","t":"مراجعة كتاب الطالب ص 39–40، والتعرف على قيم المنصهرات المكتوبة على قوابس الأجهزة المنزلية بإشراف ولي الأمر ودون فتح أي جهاز موصول."}]},{"n":2,"focus":"اختيار قيمة المنصهر المناسبة","info":"<div><b>الدرس:<\/b> 2-3 المنصهرات<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: مخاطر الكهرباء<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–42 | كتاب النشاط: تمرين 1-3 ص 28<\/div><div><b>دليل المعلم:<\/b> ص 41–42<\/div><div><b>محور الحصة:<\/b> اختيار قيمة المنصهر المناسبة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام <bdi>I = P ÷ V<\/bdi>.<\/li><li>يختار قيمة المنصهر المناسبة لجهاز كهربائي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز.<\/div>","t":"1. يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام I = P ÷ V.\n2. يختار قيمة المنصهر المناسبة لجهاز كهربائي.\nمخرج تعليمي آخر: يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام <bdi>I = P ÷ V<\/bdi>.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يختار قيمة المنصهر المناسبة لجهاز كهربائي.<\/td><td class=\"lv\">تقييم<\/td><\/tr><tr><td>يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام I = P ÷ V. ← تطبيق\n• يختار قيمة المنصهر المناسبة لجهاز كهربائي. ← تقييم\n• يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: بطاقات بيانات أجهزة منزلية (القدرة والجهد)<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: بطاقات بيانات أجهزة منزلية (القدرة والجهد)"},{"h":"<div class=\"pills\"><span>القدرة الكهربائية<\/span><span>الجهد<\/span><span>التيار التشغيلي<\/span><span>القيمة المقننة للمنصهر<\/span><\/div>","t":"القدرة الكهربائية، الجهد، التيار التشغيلي، القيمة المقننة للمنصهر"},{"h":"<p>يعرض بطاقة جهاز مكتوب عليها «2400 W – 240 V» ويسأل: أي منصهر نختار: 3 A أم 5 A أم 13 A؟<\/p>","t":"يعرض بطاقة جهاز مكتوب عليها «2400 W – 240 V» ويسأل: أي منصهر نختار: 3 A أم 5 A أم 13 A؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون الإجابة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المثال 1-3 (كتاب الطالب)<\/td><td>يراجع <bdi>P = IV<\/bdi> ويحل: <bdi>I = 2400 ÷ 240 = 10 A<\/bdi>، فالمنصهر المناسب 13 A.<\/td><td>يدونون الحل ويبررون رفض 3 A و 5 A.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">محطات الأجهزة<\/td><td>يوزع بطاقات أجهزة على جهد 240 V: مكواة 1200 W، مصباح 60 W، مدفأة 2000 W، شاحن 24 W.<\/td><td>يحسبون التيار ويختارون المنصهر لكل جهاز من 3 A و 5 A و 13 A.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تصحيح جماعي<\/td><td>يعرض الحلول على السبورة الذكية ويناقش الحالات القريبة من الحدود.<\/td><td>يصححون ويبررون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون الإجابة.\n\n(10 دقائق) المثال 1-3 (كتاب الطالب)\nدور المعلم: يراجع P = IV ويحل: I = 2400 ÷ 240 = 10 A، فالمنصهر المناسب 13 A.\nدور الطالب: يدونون الحل ويبررون رفض 3 A و 5 A.\n\n(13 دقيقة) محطات الأجهزة\nدور المعلم: يوزع بطاقات أجهزة على جهد 240 V: مكواة 1200 W، مصباح 60 W، مدفأة 2000 W، شاحن 24 W.\nدور الطالب: يحسبون التيار ويختارون المنصهر لكل جهاز من 3 A و 5 A و 13 A.\n\n(7 دقائق) تصحيح جماعي\nدور المعلم: يعرض الحلول على السبورة الذكية ويناقش الحالات القريبة من الحدود.\nدور الطالب: يصححون ويبررون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب العلاقة بين القدرة والتيار والجهد.<\/td><td><bdi>P = I × V<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>غلاية قدرتها 2400 W تعمل على 240 V. احسب التيار واختر المنصهر من (3 A، 5 A، 13 A).<\/td><td><bdi>I = 10 A<\/bdi>، فالمنصهر 13 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مكواة قدرتها 1200 W على 240 V. لماذا لا يناسبها منصهر 5 A مع أن تيارها 5 A؟<\/td><td>لأن المنصهر يجب أن يكون أكبر قليلًا من التيار العادي، ومنصهر 5 A قد ينصهر في التشغيل العادي؛ لذا يُختار 13 A.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اكتب العلاقة بين القدرة والتيار والجهد.\nالإجابة النموذجية: P = I × V.\n\n2) [المستوى المتوقع] غلاية قدرتها 2400 W تعمل على 240 V. احسب التيار واختر المنصهر من (3 A، 5 A، 13 A).\nالإجابة النموذجية: I = 10 A، فالمنصهر 13 A.\n\n3) [المستوى المتقدم] مكواة قدرتها 1200 W على 240 V. لماذا لا يناسبها منصهر 5 A مع أن تيارها 5 A؟\nالإجابة النموذجية: لأن المنصهر يجب أن يكون أكبر قليلًا من التيار العادي، ومنصهر 5 A قد ينصهر في التشغيل العادي؛ لذا يُختار 13 A."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>مصباح قدرته 60 W يعمل على 240 V. احسب التيار.<\/td><td><bdi>I = 60 ÷ 240 = 0.25 A<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اختر منصهرًا للمصباح السابق من (3 A، 5 A، 13 A) وبرر.<\/td><td>3 A؛ لأنها أصغر قيمة أكبر من 0.25 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مدفأة 2000 W ومجفف شعر 1000 W يعملان معًا على وصلة واحدة 240 V. احسب التيار الكلي وقرر هل يكفي منصهر 13 A.<\/td><td><bdi>I = 3000 ÷ 240 = 12.5 A<\/bdi>؛ يكفي بالكاد، لكنه قريب جدًا من الحد فيُفضل عدم تشغيلهما معًا على الوصلة نفسها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] مصباح قدرته 60 W يعمل على 240 V. احسب التيار.\nالإجابة النموذجية: I = 60 ÷ 240 = 0.25 A.\n\n2) [المستوى المتوقع] اختر منصهرًا للمصباح السابق من (3 A، 5 A، 13 A) وبرر.\nالإجابة النموذجية: 3 A؛ لأنها أصغر قيمة أكبر من 0.25 A.\n\n3) [المستوى المتقدم] مدفأة 2000 W ومجفف شعر 1000 W يعملان معًا على وصلة واحدة 240 V. احسب التيار الكلي وقرر هل يكفي منصهر 13 A.\nالإجابة النموذجية: I = 3000 ÷ 240 = 12.5 A؛ يكفي بالكاد، لكنه قريب جدًا من الحد فيُفضل عدم تشغيلهما معًا على الوصلة نفسها."},{"h":"<p>حل تمرين 1-3 السلامة الكهربائية: الأسلاك والمنصهرات في كتاب النشاط ص 28، والإجابة عن الأسئلة 1-3 إلى 3-3 في كتاب الطالب.<\/p>","t":"حل تمرين 1-3 السلامة الكهربائية: الأسلاك والمنصهرات في كتاب النشاط ص 28، والإجابة عن الأسئلة 1-3 إلى 3-3 في كتاب الطالب."}]},{"n":3,"focus":"مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة","info":"<div><b>الدرس:<\/b> 2-3 المنصهرات<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: مخاطر الكهرباء<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 3 من 3<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–42 | كتاب النشاط: تمرين 1-3 ص 28<\/div><div><b>دليل المعلم:<\/b> ص 41–42<\/div><div><b>محور الحصة:<\/b> مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة.<\/li><li>يحلل مواقف كهربائية خطرة ويقترح لها حلولًا.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تصميم دائرة منزلية من حيث السلامة.<\/div>","t":"1. يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة.\n2. يحلل مواقف كهربائية خطرة ويقترح لها حلولًا.\nمخرج تعليمي آخر: يقيّم تصميم دائرة منزلية من حيث السلامة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحلل مواقف كهربائية خطرة ويقترح لها حلولًا.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم تصميم دائرة منزلية من حيث السلامة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"• يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة. ← تطبيق\n• يحلل مواقف كهربائية خطرة ويقترح لها حلولًا. ← تحليل\n• يقيّم تصميم دائرة منزلية من حيث السلامة. ← تقييم"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>المنصهر<\/span><span>العزل<\/span><span>السلامة الكهربائية<\/span><span>القيمة المقننة<\/span><span>السلك الحي<\/span><\/div>","t":"المنصهر، العزل، السلامة الكهربائية، القيمة المقننة، السلك الحي"},{"h":"<p>يعرض «مشهد الأخطاء»: صورة غرفة فيها خمسة أخطاء كهربائية، والمطلوب اكتشافها خلال دقيقتين.<\/p>","t":"يعرض «مشهد الأخطاء»: صورة غرفة فيها خمسة أخطاء كهربائية، والمطلوب اكتشافها خلال دقيقتين."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية ويحدد الزمن.<\/td><td>يكتشفون الأخطاء.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الثالثة (كتاب الطالب ص 42)<\/td><td>يتابع الحل في مجموعات ويقدم تلميحات.<\/td><td>يحلون ويعرضون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">إكمال تمرين 2-3 (كتاب النشاط ص 29)<\/td><td>يوجه إلى إكمال الأسئلة المتبقية.<\/td><td>يكملون الحل.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص قواعد السلامة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية ويحدد الزمن.\nدور الطالب: يكتشفون الأخطاء.\n\n(15 دقيقة) أسئلة نهاية الوحدة الثالثة (كتاب الطالب ص 42)\nدور المعلم: يتابع الحل في مجموعات ويقدم تلميحات.\nدور الطالب: يحلون ويعرضون.\n\n(8 دقائق) إكمال تمرين 2-3 (كتاب النشاط ص 29)\nدور المعلم: يوجه إلى إكمال الأسئلة المتبقية.\nدور الطالب: يكملون الحل.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص قواعد السلامة.\nدور الطالب: يدونون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر خطرين ينتجان عن الرطوبة قرب الأجهزة الكهربائية.<\/td><td>الصدمة الكهربائية لأن الماء يوصل الكهرباء، وحدوث قصر في الدائرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>سخان 3000 W على 240 V. أي منصهر يناسبه: 5 A أم 13 A؟<\/td><td><bdi>I = 12.5 A<\/bdi>، فيناسبه 13 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>دائرة منزلية فيها منصهر 30 A لأسلاك صُممت لتحمل 15 A. قيّم هذا التصميم.<\/td><td>غير آمن؛ قد يمر تيار يزيد على 15 A فتسخن الأسلاك دون أن ينصهر المنصهر، ويجب أن تكون قيمة المنصهر أقل من قدرة تحمل الأسلاك.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر خطرين ينتجان عن الرطوبة قرب الأجهزة الكهربائية.\nالإجابة النموذجية: الصدمة الكهربائية لأن الماء يوصل الكهرباء، وحدوث قصر في الدائرة.\n\n2) [المستوى المتوقع] سخان 3000 W على 240 V. أي منصهر يناسبه: 5 A أم 13 A؟\nالإجابة النموذجية: I = 12.5 A، فيناسبه 13 A.\n\n3) [المستوى المتقدم] دائرة منزلية فيها منصهر 30 A لأسلاك صُممت لتحمل 15 A. قيّم هذا التصميم.\nالإجابة النموذجية: غير آمن؛ قد يمر تيار يزيد على 15 A فتسخن الأسلاك دون أن ينصهر المنصهر، ويجب أن تكون قيمة المنصهر أقل من قدرة تحمل الأسلاك."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يجب أن تكون قيمة المنصهر أقل من التيار العادي للجهاز.<\/td><td>خطأ؛ يجب أن تكون أكبر منه قليلًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يوضع المنصهر في السلك الحي؟<\/td><td>حتى ينفصل الجهد العالي عن الجهاز عند انصهاره فيصبح آمنًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح سببين لانصهار منصهر جهاز مرة بعد أخرى، وماذا يجب فعله؟<\/td><td>وجود عطل أو قصر في الجهاز أو سلكه، أو أن قيمة المنصهر أقل من المطلوب؛ يُفحص الجهاز لدى فني ويُتأكد من قيمة المنصهر الصحيحة دون رفعها عشوائيًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يجب أن تكون قيمة المنصهر أقل من التيار العادي للجهاز.\nالإجابة النموذجية: خطأ؛ يجب أن تكون أكبر منه قليلًا.\n\n2) [المستوى المتوقع] لماذا يوضع المنصهر في السلك الحي؟\nالإجابة النموذجية: حتى ينفصل الجهد العالي عن الجهاز عند انصهاره فيصبح آمنًا.\n\n3) [المستوى المتقدم] اقترح سببين لانصهار منصهر جهاز مرة بعد أخرى، وماذا يجب فعله؟\nالإجابة النموذجية: وجود عطل أو قصر في الجهاز أو سلكه، أو أن قيمة المنصهر أقل من المطلوب؛ يُفحص الجهاز لدى فني ويُتأكد من قيمة المنصهر الصحيحة دون رفعها عشوائيًا."},{"h":"<p>إكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب، ومراجعة تمريني 1-3 و2-3 في كتاب النشاط ص 28–29، والاستعداد للوحدة الرابعة: تأثيرات القوى (ص 43).<\/p>","t":"إكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب، ومراجعة تمريني 1-3 و2-3 في كتاب النشاط ص 28–29، والاستعداد للوحدة الرابعة: تأثيرات القوى (ص 43)."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-3 المنصهرات<\/div><div><b>الوحدة:<\/b> الوحدة الثالثة: مخاطر الكهرباء<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السادس (11–15/10/2026)<\/div><div><b>عدد الحصص:<\/b> 3 حصص<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 39–42 | كتاب النشاط: تمرين 1-3 ص 28<\/div><div><b>دليل المعلم:<\/b> ص 41–42<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><ol class=\"ol\"><li>يذكر أن المنصهر يحمي الدائرة الكهربائية.<\/li><li>يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام.<\/div><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><ol class=\"ol\"><li>يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام <bdi>I = P ÷ V<\/bdi>.<\/li><li>يختار قيمة المنصهر المناسبة لجهاز كهربائي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز.<\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><ol class=\"ol\"><li>يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة.<\/li><li>يحلل مواقف كهربائية خطرة ويقترح لها حلولًا.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم تصميم دائرة منزلية من حيث السلامة.<\/div>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n1. يذكر أن المنصهر يحمي الدائرة الكهربائية.\n2. يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة.\nمخرج تعليمي آخر: يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام.\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n1. يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام I = P ÷ V.\n2. يختار قيمة المنصهر المناسبة لجهاز كهربائي.\nمخرج تعليمي آخر: يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز.\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n1. يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة.\n2. يحلل مواقف كهربائية خطرة ويقترح لها حلولًا.\nمخرج تعليمي آخر: يقيّم تصميم دائرة منزلية من حيث السلامة."},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر أن المنصهر يحمي الدائرة الكهربائية.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام <bdi>I = P ÷ V<\/bdi>.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يختار قيمة المنصهر المناسبة لجهاز كهربائي.<\/td><td class=\"lv\">تقييم<\/td><\/tr><tr><td>يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحلل مواقف كهربائية خطرة ويقترح لها حلولًا.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يقيّم تصميم دائرة منزلية من حيث السلامة.<\/td><td class=\"lv\">تقييم<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n• يذكر أن المنصهر يحمي الدائرة الكهربائية. ← تذكر\n• يشرح مبدأ عمل المنصهر بانصهار سلكه عند تجاوز التيار قيمته المقننة. ← فهم\n• يقارن بين المنصهر والقاطع الكهربائي من حيث طريقة العمل وإعادة الاستخدام. ← تحليل\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n• يحسب التيار المار في جهاز بمعلومية قدرته وجهد تشغيله باستخدام I = P ÷ V. ← تطبيق\n• يختار قيمة المنصهر المناسبة لجهاز كهربائي. ← تقييم\n• يبرر اختيار منصهر أكبر قليلًا من التيار العادي للجهاز. ← تقييم\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n• يطبق قواعد السلامة الكهربائية واختيار المنصهر في حل أسئلة نهاية الوحدة. ← تطبيق\n• يحلل مواقف كهربائية خطرة ويقترح لها حلولًا. ← تحليل\n• يقيّم تصميم دائرة منزلية من حيث السلامة. ← تقييم"},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التشاركي<\/span><\/div><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التشاركي\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم الذاتي\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: منصهرات بقيم 3 A و 5 A و 13 A، قابس مفتوح، صوف فولاذي، مصدر جهد منخفض، قماش مقاوم للحرارة، نظارات واقية<\/span><\/div><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: بطاقات بيانات أجهزة منزلية (القدرة والجهد)<\/span><\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>صورة توضيحية<\/span><\/div>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: منصهرات بقيم 3 A و 5 A و 13 A، قابس مفتوح، صوف فولاذي، مصدر جهد منخفض، قماش مقاوم للحرارة، نظارات واقية\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: بطاقات بيانات أجهزة منزلية (القدرة والجهد)\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• صورة توضيحية"},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><div class=\"pills\"><span>المنصهر<\/span><span>القيمة المقننة<\/span><span>القاطع الكهربائي<\/span><span>التيار الزائد<\/span><span>قصر الدائرة<\/span><\/div><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><div class=\"pills\"><span>القدرة الكهربائية<\/span><span>الجهد<\/span><span>التيار التشغيلي<\/span><span>القيمة المقننة للمنصهر<\/span><\/div><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><div class=\"pills\"><span>المنصهر<\/span><span>العزل<\/span><span>السلامة الكهربائية<\/span><span>القيمة المقننة<\/span><span>السلك الحي<\/span><\/div>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\nالمنصهر، القيمة المقننة، القاطع الكهربائي، التيار الزائد، قصر الدائرة\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\nالقدرة الكهربائية، الجهد، التيار التشغيلي، القيمة المقننة للمنصهر\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\nالمنصهر، العزل، السلامة الكهربائية، القيمة المقننة، السلك الحي"},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><p>يعرض قابسًا مفتوحًا ويشير إلى المنصهر داخله ويسأل: لماذا يوجد هنا جزء صغير صُمم لينقطع؟<\/p><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><p>يعرض بطاقة جهاز مكتوب عليها «2400 W – 240 V» ويسأل: أي منصهر نختار: 3 A أم 5 A أم 13 A؟<\/p><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><p>يعرض «مشهد الأخطاء»: صورة غرفة فيها خمسة أخطاء كهربائية، والمطلوب اكتشافها خلال دقيقتين.<\/p>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\nيعرض قابسًا مفتوحًا ويشير إلى المنصهر داخله ويسأل: لماذا يوجد هنا جزء صغير صُمم لينقطع؟\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\nيعرض بطاقة جهاز مكتوب عليها «2400 W – 240 V» ويسأل: أي منصهر نختار: 3 A أم 5 A أم 13 A؟\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\nيعرض «مشهد الأخطاء»: صورة غرفة فيها خمسة أخطاء كهربائية، والمطلوب اكتشافها خلال دقيقتين."},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض القابس والمنصهرات.<\/td><td>يلاحظون القيم المكتوبة على المنصهرات.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">عرض عملي من النشاط 1-3 (إثرائي)<\/td><td>يمرر تيارًا في شعيرات رفيعة من الصوف الفولاذي على قماش مقاوم للحرارة، مع النظارات الواقية وإبقاء الطلبة على مسافة آمنة.<\/td><td>يلاحظون توهج الشعيرات ثم انقطاعها ويربطون ذلك بعمل المنصهر.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">شرح المبدأ<\/td><td>يشرح أن المنصهر سلك رفيع يوصل على التوالي مع الجهاز في السلك الحي، ينصهر عند تجاوز التيار قيمته فيفتح الدائرة.<\/td><td>يرسمون مخطط دائرة فيها منصهر على التوالي مع الجهاز.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">المنصهر أم القاطع؟<\/td><td>يذكّر بالقواطع التي درسوها في الصف التاسع ويقارن.<\/td><td>يكملون جدول مقارنة: سرعة القطع والحاجة إلى الاستبدال.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يتوقعون الإجابة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">المثال 1-3 (كتاب الطالب)<\/td><td>يراجع <bdi>P = IV<\/bdi> ويحل: <bdi>I = 2400 ÷ 240 = 10 A<\/bdi>، فالمنصهر المناسب 13 A.<\/td><td>يدونون الحل ويبررون رفض 3 A و 5 A.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">محطات الأجهزة<\/td><td>يوزع بطاقات أجهزة على جهد 240 V: مكواة 1200 W، مصباح 60 W، مدفأة 2000 W، شاحن 24 W.<\/td><td>يحسبون التيار ويختارون المنصهر لكل جهاز من 3 A و 5 A و 13 A.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تصحيح جماعي<\/td><td>يعرض الحلول على السبورة الذكية ويناقش الحالات القريبة من الحدود.<\/td><td>يصححون ويبررون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصورة على السبورة الذكية ويحدد الزمن.<\/td><td>يكتشفون الأخطاء.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">أسئلة نهاية الوحدة الثالثة (كتاب الطالب ص 42)<\/td><td>يتابع الحل في مجموعات ويقدم تلميحات.<\/td><td>يحلون ويعرضون.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">إكمال تمرين 2-3 (كتاب النشاط ص 29)<\/td><td>يوجه إلى إكمال الأسئلة المتبقية.<\/td><td>يكملون الحل.<\/td><\/tr><tr><td class=\"tm\">9 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">3 د<\/td><td class=\"st\">الختام<\/td><td>يلخص قواعد السلامة.<\/td><td>يدونون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n(5 دقائق) التهيئة\nدور المعلم: يعرض القابس والمنصهرات.\nدور الطالب: يلاحظون القيم المكتوبة على المنصهرات.\n\n(12 دقيقة) عرض عملي من النشاط 1-3 (إثرائي)\nدور المعلم: يمرر تيارًا في شعيرات رفيعة من الصوف الفولاذي على قماش مقاوم للحرارة، مع النظارات الواقية وإبقاء الطلبة على مسافة آمنة.\nدور الطالب: يلاحظون توهج الشعيرات ثم انقطاعها ويربطون ذلك بعمل المنصهر.\n\n(10 دقائق) شرح المبدأ\nدور المعلم: يشرح أن المنصهر سلك رفيع يوصل على التوالي مع الجهاز في السلك الحي، ينصهر عند تجاوز التيار قيمته فيفتح الدائرة.\nدور الطالب: يرسمون مخطط دائرة فيها منصهر على التوالي مع الجهاز.\n\n(8 دقائق) المنصهر أم القاطع؟\nدور المعلم: يذكّر بالقواطع التي درسوها في الصف التاسع ويقارن.\nدور الطالب: يكملون جدول مقارنة: سرعة القطع والحاجة إلى الاستبدال.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يتوقعون الإجابة.\n\n(10 دقائق) المثال 1-3 (كتاب الطالب)\nدور المعلم: يراجع P = IV ويحل: I = 2400 ÷ 240 = 10 A، فالمنصهر المناسب 13 A.\nدور الطالب: يدونون الحل ويبررون رفض 3 A و 5 A.\n\n(13 دقيقة) محطات الأجهزة\nدور المعلم: يوزع بطاقات أجهزة على جهد 240 V: مكواة 1200 W، مصباح 60 W، مدفأة 2000 W، شاحن 24 W.\nدور الطالب: يحسبون التيار ويختارون المنصهر لكل جهاز من 3 A و 5 A و 13 A.\n\n(7 دقائق) تصحيح جماعي\nدور المعلم: يعرض الحلول على السبورة الذكية ويناقش الحالات القريبة من الحدود.\nدور الطالب: يصححون ويبررون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n(5 دقائق) التهيئة\nدور المعلم: يعرض الصورة على السبورة الذكية ويحدد الزمن.\nدور الطالب: يكتشفون الأخطاء.\n\n(15 دقيقة) أسئلة نهاية الوحدة الثالثة (كتاب الطالب ص 42)\nدور المعلم: يتابع الحل في مجموعات ويقدم تلميحات.\nدور الطالب: يحلون ويعرضون.\n\n(8 دقائق) إكمال تمرين 2-3 (كتاب النشاط ص 29)\nدور المعلم: يوجه إلى إكمال الأسئلة المتبقية.\nدور الطالب: يكملون الحل.\n\n(9 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(3 دقائق) الختام\nدور المعلم: يلخص قواعد السلامة.\nدور الطالب: يدونون."},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وظيفة المنصهر؟<\/td><td>حماية الدائرة والأسلاك والأجهزة من التيار الزائد بقطع الدائرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يوصل المنصهر على التوالي مع الجهاز؟<\/td><td>ليمر فيه التيار نفسه المار في الجهاز، فإذا انصهر انقطع التيار عن الجهاز كله.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اذكر ميزتين للقاطع الكهربائي مقارنة بالمنصهر.<\/td><td>يقطع الدائرة بسرعة أكبر، ويمكن إعادة ضبطه بعد إصلاح العطل دون استبداله.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب العلاقة بين القدرة والتيار والجهد.<\/td><td><bdi>P = I × V<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>غلاية قدرتها 2400 W تعمل على 240 V. احسب التيار واختر المنصهر من (3 A، 5 A، 13 A).<\/td><td><bdi>I = 10 A<\/bdi>، فالمنصهر 13 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مكواة قدرتها 1200 W على 240 V. لماذا لا يناسبها منصهر 5 A مع أن تيارها 5 A؟<\/td><td>لأن المنصهر يجب أن يكون أكبر قليلًا من التيار العادي، ومنصهر 5 A قد ينصهر في التشغيل العادي؛ لذا يُختار 13 A.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر خطرين ينتجان عن الرطوبة قرب الأجهزة الكهربائية.<\/td><td>الصدمة الكهربائية لأن الماء يوصل الكهرباء، وحدوث قصر في الدائرة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>سخان 3000 W على 240 V. أي منصهر يناسبه: 5 A أم 13 A؟<\/td><td><bdi>I = 12.5 A<\/bdi>، فيناسبه 13 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>دائرة منزلية فيها منصهر 30 A لأسلاك صُممت لتحمل 15 A. قيّم هذا التصميم.<\/td><td>غير آمن؛ قد يمر تيار يزيد على 15 A فتسخن الأسلاك دون أن ينصهر المنصهر، ويجب أن تكون قيمة المنصهر أقل من قدرة تحمل الأسلاك.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n1) [مستوى الدعم] ما وظيفة المنصهر؟\nالإجابة النموذجية: حماية الدائرة والأسلاك والأجهزة من التيار الزائد بقطع الدائرة.\n\n2) [المستوى المتوقع] لماذا يوصل المنصهر على التوالي مع الجهاز؟\nالإجابة النموذجية: ليمر فيه التيار نفسه المار في الجهاز، فإذا انصهر انقطع التيار عن الجهاز كله.\n\n3) [المستوى المتقدم] اذكر ميزتين للقاطع الكهربائي مقارنة بالمنصهر.\nالإجابة النموذجية: يقطع الدائرة بسرعة أكبر، ويمكن إعادة ضبطه بعد إصلاح العطل دون استبداله.\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n1) [مستوى الدعم] اكتب العلاقة بين القدرة والتيار والجهد.\nالإجابة النموذجية: P = I × V.\n\n2) [المستوى المتوقع] غلاية قدرتها 2400 W تعمل على 240 V. احسب التيار واختر المنصهر من (3 A، 5 A، 13 A).\nالإجابة النموذجية: I = 10 A، فالمنصهر 13 A.\n\n3) [المستوى المتقدم] مكواة قدرتها 1200 W على 240 V. لماذا لا يناسبها منصهر 5 A مع أن تيارها 5 A؟\nالإجابة النموذجية: لأن المنصهر يجب أن يكون أكبر قليلًا من التيار العادي، ومنصهر 5 A قد ينصهر في التشغيل العادي؛ لذا يُختار 13 A.\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n1) [مستوى الدعم] اذكر خطرين ينتجان عن الرطوبة قرب الأجهزة الكهربائية.\nالإجابة النموذجية: الصدمة الكهربائية لأن الماء يوصل الكهرباء، وحدوث قصر في الدائرة.\n\n2) [المستوى المتوقع] سخان 3000 W على 240 V. أي منصهر يناسبه: 5 A أم 13 A؟\nالإجابة النموذجية: I = 12.5 A، فيناسبه 13 A.\n\n3) [المستوى المتقدم] دائرة منزلية فيها منصهر 30 A لأسلاك صُممت لتحمل 15 A. قيّم هذا التصميم.\nالإجابة النموذجية: غير آمن؛ قد يمر تيار يزيد على 15 A فتسخن الأسلاك دون أن ينصهر المنصهر، ويجب أن تكون قيمة المنصهر أقل من قدرة تحمل الأسلاك."},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: ينصهر سلك المنصهر عندما يتجاوز التيار .........<\/td><td>القيمة المقننة للمنصهر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يحدث للدائرة عند انصهار المنصهر؟<\/td><td>تنفتح فيتوقف مرور التيار.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا لا يُستبدل منصهر محترق بسلك نحاسي سميك؟<\/td><td>لأن السلك السميك لا ينصهر عند التيار الزائد فلا يحمي الدائرة، فتسخن الأسلاك وقد يحدث حريق أو يتلف الجهاز.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>مصباح قدرته 60 W يعمل على 240 V. احسب التيار.<\/td><td><bdi>I = 60 ÷ 240 = 0.25 A<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اختر منصهرًا للمصباح السابق من (3 A، 5 A، 13 A) وبرر.<\/td><td>3 A؛ لأنها أصغر قيمة أكبر من 0.25 A.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مدفأة 2000 W ومجفف شعر 1000 W يعملان معًا على وصلة واحدة 240 V. احسب التيار الكلي وقرر هل يكفي منصهر 13 A.<\/td><td><bdi>I = 3000 ÷ 240 = 12.5 A<\/bdi>؛ يكفي بالكاد، لكنه قريب جدًا من الحد فيُفضل عدم تشغيلهما معًا على الوصلة نفسها.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يجب أن تكون قيمة المنصهر أقل من التيار العادي للجهاز.<\/td><td>خطأ؛ يجب أن تكون أكبر منه قليلًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يوضع المنصهر في السلك الحي؟<\/td><td>حتى ينفصل الجهد العالي عن الجهاز عند انصهاره فيصبح آمنًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح سببين لانصهار منصهر جهاز مرة بعد أخرى، وماذا يجب فعله؟<\/td><td>وجود عطل أو قصر في الجهاز أو سلكه، أو أن قيمة المنصهر أقل من المطلوب؛ يُفحص الجهاز لدى فني ويُتأكد من قيمة المنصهر الصحيحة دون رفعها عشوائيًا.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\n1) [مستوى الدعم] أكمل: ينصهر سلك المنصهر عندما يتجاوز التيار .........\nالإجابة النموذجية: القيمة المقننة للمنصهر.\n\n2) [المستوى المتوقع] ماذا يحدث للدائرة عند انصهار المنصهر؟\nالإجابة النموذجية: تنفتح فيتوقف مرور التيار.\n\n3) [المستوى المتقدم] لماذا لا يُستبدل منصهر محترق بسلك نحاسي سميك؟\nالإجابة النموذجية: لأن السلك السميك لا ينصهر عند التيار الزائد فلا يحمي الدائرة، فتسخن الأسلاك وقد يحدث حريق أو يتلف الجهاز.\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\n1) [مستوى الدعم] مصباح قدرته 60 W يعمل على 240 V. احسب التيار.\nالإجابة النموذجية: I = 60 ÷ 240 = 0.25 A.\n\n2) [المستوى المتوقع] اختر منصهرًا للمصباح السابق من (3 A، 5 A، 13 A) وبرر.\nالإجابة النموذجية: 3 A؛ لأنها أصغر قيمة أكبر من 0.25 A.\n\n3) [المستوى المتقدم] مدفأة 2000 W ومجفف شعر 1000 W يعملان معًا على وصلة واحدة 240 V. احسب التيار الكلي وقرر هل يكفي منصهر 13 A.\nالإجابة النموذجية: I = 3000 ÷ 240 = 12.5 A؛ يكفي بالكاد، لكنه قريب جدًا من الحد فيُفضل عدم تشغيلهما معًا على الوصلة نفسها.\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\n1) [مستوى الدعم] صواب أم خطأ: يجب أن تكون قيمة المنصهر أقل من التيار العادي للجهاز.\nالإجابة النموذجية: خطأ؛ يجب أن تكون أكبر منه قليلًا.\n\n2) [المستوى المتوقع] لماذا يوضع المنصهر في السلك الحي؟\nالإجابة النموذجية: حتى ينفصل الجهد العالي عن الجهاز عند انصهاره فيصبح آمنًا.\n\n3) [المستوى المتقدم] اقترح سببين لانصهار منصهر جهاز مرة بعد أخرى، وماذا يجب فعله؟\nالإجابة النموذجية: وجود عطل أو قصر في الجهاز أو سلكه، أو أن قيمة المنصهر أقل من المطلوب؛ يُفحص الجهاز لدى فني ويُتأكد من قيمة المنصهر الصحيحة دون رفعها عشوائيًا."},{"h":"<div class=\"psub\">الحصة 1: كيف يحمي المنصهر الدائرة<\/div><p>مراجعة كتاب الطالب ص 39–40، والتعرف على قيم المنصهرات المكتوبة على قوابس الأجهزة المنزلية بإشراف ولي الأمر ودون فتح أي جهاز موصول.<\/p><div class=\"psub\">الحصة 2: اختيار قيمة المنصهر المناسبة<\/div><p>حل تمرين 1-3 السلامة الكهربائية: الأسلاك والمنصهرات في كتاب النشاط ص 28، والإجابة عن الأسئلة 1-3 إلى 3-3 في كتاب الطالب.<\/p><div class=\"psub\">الحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة<\/div><p>إكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب، ومراجعة تمريني 1-3 و2-3 في كتاب النشاط ص 28–29، والاستعداد للوحدة الرابعة: تأثيرات القوى (ص 43).<\/p>","t":"الحصة 1: كيف يحمي المنصهر الدائرة\nمراجعة كتاب الطالب ص 39–40، والتعرف على قيم المنصهرات المكتوبة على قوابس الأجهزة المنزلية بإشراف ولي الأمر ودون فتح أي جهاز موصول.\n\nالحصة 2: اختيار قيمة المنصهر المناسبة\nحل تمرين 1-3 السلامة الكهربائية: الأسلاك والمنصهرات في كتاب النشاط ص 28، والإجابة عن الأسئلة 1-3 إلى 3-3 في كتاب الطالب.\n\nالحصة 3: مراجعة الوحدة الثالثة وأسئلة نهاية الوحدة\nإكمال أسئلة نهاية الوحدة الثالثة في كتاب الطالب، ومراجعة تمريني 1-3 و2-3 في كتاب النشاط ص 28–29، والاستعداد للوحدة الرابعة: تأثيرات القوى (ص 43)."}]}},{"label":"1-4 القوى المؤثرة على قطار الملاهي","unit":"الوحدة الرابعة: تأثيرات القوى","periods":[{"n":1,"focus":"أنواع القوى وتمثيلها بالأسهم","info":"<div><b>الدرس:<\/b> 1-4 القوى المؤثرة على قطار الملاهي<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 43 | كتاب النشاط: تمرين 1-4 ص 30–31<\/div><div><b>دليل المعلم:<\/b> ص 45–46<\/div><div><b>محور الحصة:<\/b> أنواع القوى وتمثيلها بالأسهم<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد القوى المؤثرة في جسم متحرك: الوزن، ورد الفعل، والاحتكاك، ومقاومة الهواء، والدفع، والشد.<\/li><li>يمثل القوى بأسهم تبين الاتجاه والمقدار النسبي.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفهم أن مقاومة الهواء شكل من أشكال الاحتكاك.<\/div>","t":"1. يحدد القوى المؤثرة في جسم متحرك: الوزن، ورد الفعل، والاحتكاك، ومقاومة الهواء، والدفع، والشد.\n2. يمثل القوى بأسهم تبين الاتجاه والمقدار النسبي.\nمخرج تعليمي آخر: يفهم أن مقاومة الهواء شكل من أشكال الاحتكاك."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد القوى المؤثرة في جسم متحرك: الوزن، ورد الفعل، والاحتكاك، ومقاومة الهواء، والدفع، والشد.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يمثل القوى بأسهم تبين الاتجاه والمقدار النسبي.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يفهم أن مقاومة الهواء شكل من أشكال الاحتكاك.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يحدد القوى المؤثرة في جسم متحرك: الوزن، ورد الفعل، والاحتكاك، ومقاومة الهواء، والدفع، والشد. ← فهم\n• يمثل القوى بأسهم تبين الاتجاه والمقدار النسبي. ← تطبيق\n• يفهم أن مقاومة الهواء شكل من أشكال الاحتكاك. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>صورة توضيحية<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• صورة توضيحية"},{"h":"<div class=\"pills\"><span>القوة<\/span><span>النيوتن<\/span><span>الوزن<\/span><span>الاحتكاك<\/span><span>مقاومة الهواء<\/span><span>قوة رد الفعل<\/span><span>مخطط القوى<\/span><\/div>","t":"القوة، النيوتن، الوزن، الاحتكاك، مقاومة الهواء، قوة رد الفعل، مخطط القوى"},{"h":"<p>مقطع قصير لقطار ملاهٍ يصعد وينزل، وسؤال: ما القوى التي تجعل القطار يتباطأ ويتسارع؟<\/p>","t":"مقطع قصير لقطار ملاهٍ يصعد وينزل، وسؤال: ما القوى التي تجعل القطار يتباطأ ويتسارع؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يسمّون القوى التي يعرفونها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">القوة وتمثيلها<\/td><td>يعرّف القوة بأنها دفع أو سحب تقاس بالنيوتن، ويمثلها بأسهم تبين المقدار والاتجاه.<\/td><td>يرسمون أسهمًا لقوى مختلفة المقدار والاتجاه.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحليل قطار الملاهي (كتاب الطالب ص 43)<\/td><td>يعرض الشكل ويطلب تحديد القوى في مواضع مختلفة من المسار.<\/td><td>يرسمون مخطط قوى لعربة القطار وهي تصعد وهي تهبط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-4 تحديد القوى (كتاب النشاط ص 30–31)<\/td><td>يتابع الحل.<\/td><td>يحلون جزءًا من التمرين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يسمّون القوى التي يعرفونها.\n\n(10 دقائق) القوة وتمثيلها\nدور المعلم: يعرّف القوة بأنها دفع أو سحب تقاس بالنيوتن، ويمثلها بأسهم تبين المقدار والاتجاه.\nدور الطالب: يرسمون أسهمًا لقوى مختلفة المقدار والاتجاه.\n\n(12 دقيقة) تحليل قطار الملاهي (كتاب الطالب ص 43)\nدور المعلم: يعرض الشكل ويطلب تحديد القوى في مواضع مختلفة من المسار.\nدور الطالب: يرسمون مخطط قوى لعربة القطار وهي تصعد وهي تهبط.\n\n(8 دقائق) تمرين 1-4 تحديد القوى (كتاب النشاط ص 30–31)\nدور المعلم: يتابع الحل.\nدور الطالب: يحلون جزءًا من التمرين.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس القوة؟<\/td><td>النيوتن (N).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ارسم مخطط القوى لصندوق ساكن على أرض أفقية.<\/td><td>سهم الوزن إلى الأسفل وسهم رد فعل الأرض إلى الأعلى بالطول نفسه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عربة قطار ملاهٍ تتحرك أفقيًا وتتباطأ دون محرك. حدد القوى الأفقية المؤثرة فيها واتجاهها.<\/td><td>الاحتكاك ومقاومة الهواء في عكس اتجاه الحركة، ولا توجد قوة دافعة تعاكسهما، لذلك تتباطأ.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وحدة قياس القوة؟\nالإجابة النموذجية: النيوتن (N).\n\n2) [المستوى المتوقع] ارسم مخطط القوى لصندوق ساكن على أرض أفقية.\nالإجابة النموذجية: سهم الوزن إلى الأسفل وسهم رد فعل الأرض إلى الأعلى بالطول نفسه.\n\n3) [المستوى المتقدم] عربة قطار ملاهٍ تتحرك أفقيًا وتتباطأ دون محرك. حدد القوى الأفقية المؤثرة فيها واتجاهها.\nالإجابة النموذجية: الاحتكاك ومقاومة الهواء في عكس اتجاه الحركة، ولا توجد قوة دافعة تعاكسهما، لذلك تتباطأ."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: مقاومة الهواء شكل من أشكال .........<\/td><td>الاحتكاك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُمثل القوة بسهم؟<\/td><td>لأن للقوة مقدارًا واتجاهًا؛ طول السهم يدل على المقدار، واتجاهه على الاتجاه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف كيف تتغير القوى المؤثرة في عربة القطار من لحظة سحبها إلى القمة إلى لحظة هبوطها.<\/td><td>عند الصعود تسحبها قوة شد إلى الأعلى ويعاكسها الوزن والاحتكاك؛ وعند الهبوط يسرّعها الوزن ويعاكس حركتها الاحتكاك ومقاومة الهواء.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: مقاومة الهواء شكل من أشكال .........\nالإجابة النموذجية: الاحتكاك.\n\n2) [المستوى المتوقع] لماذا تُمثل القوة بسهم؟\nالإجابة النموذجية: لأن للقوة مقدارًا واتجاهًا؛ طول السهم يدل على المقدار، واتجاهه على الاتجاه.\n\n3) [المستوى المتقدم] صف كيف تتغير القوى المؤثرة في عربة القطار من لحظة سحبها إلى القمة إلى لحظة هبوطها.\nالإجابة النموذجية: عند الصعود تسحبها قوة شد إلى الأعلى ويعاكسها الوزن والاحتكاك؛ وعند الهبوط يسرّعها الوزن ويعاكس حركتها الاحتكاك ومقاومة الهواء."},{"h":"<p>مراجعة كتاب الطالب ص 43 والإجابة عن السؤال 1-4، وإكمال تمرين 1-4 تحديد القوى في كتاب النشاط ص 30–31.<\/p>","t":"مراجعة كتاب الطالب ص 43 والإجابة عن السؤال 1-4، وإكمال تمرين 1-4 تحديد القوى في كتاب النشاط ص 30–31."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-4 القوى المؤثرة على قطار الملاهي<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 43 | كتاب النشاط: تمرين 1-4 ص 30–31<\/div><div><b>دليل المعلم:<\/b> ص 45–46<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: أنواع القوى وتمثيلها بالأسهم<\/div><ol class=\"ol\
