الهواء ويوقفها غلاف الجهاز."},{"h":"<div class=\"psub\">الحصة 1: إشعاعات ألفا وبيتا وجاما وخصائصها واستخداماتها<\/div><p>مراجعة كتاب الطالب ص 93–101 والإجابة عن الأسئلة 6-9 إلى 13-9، وحل تمريني 1-9 طبيعة الإشعاع و2-9 استخدام المواد المشعة في كتاب النشاط ص 69–71.<\/p>","t":"الحصة 1: إشعاعات ألفا وبيتا وجاما وخصائصها واستخداماتها\nمراجعة كتاب الطالب ص 93–101 والإجابة عن الأسئلة 6-9 إلى 13-9، وحل تمريني 1-9 طبيعة الإشعاع و2-9 استخدام المواد المشعة في كتاب النشاط ص 69–71."}]}},{"label":"1-10 تناقص النشاط الإشعاعي مع مرور الزمن","unit":"الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف","periods":[{"n":1,"focus":"معنى الاضمحلال وتناقص النشاط","info":"<div><b>الدرس:<\/b> 1-10 تناقص النشاط الإشعاعي مع مرور الزمن<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 102 | كتاب النشاط: تمرين 1-10 ص 72–73<\/div><div><b>دليل المعلم:<\/b> ص 104<\/div><div><b>محور الحصة:<\/b> معنى الاضمحلال وتناقص النشاط<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر معنى الاضمحلال الإشعاعي.<\/li><li>يصف تناقص النشاط الإشعاعي لعينة مع مرور الزمن.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يفسر تناقص النشاط بتناقص عدد النوى غير المضمحلة.<\/div>","t":"1. يذكر معنى الاضمحلال الإشعاعي.\n2. يصف تناقص النشاط الإشعاعي لعينة مع مرور الزمن.\nمخرج تعليمي آخر: يفسر تناقص النشاط بتناقص عدد النوى غير المضمحلة."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر معنى الاضمحلال الإشعاعي.<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يصف تناقص النشاط الإشعاعي لعينة مع مرور الزمن.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يفسر تناقص النشاط بتناقص عدد النوى غير المضمحلة.<\/td><td class=\"lv\">فهم<\/td><\/tr><\/tbody><\/table>","t":"• يذكر معنى الاضمحلال الإشعاعي. ← تذكر\n• يصف تناقص النشاط الإشعاعي لعينة مع مرور الزمن. ← فهم\n• يفسر تناقص النشاط بتناقص عدد النوى غير المضمحلة. ← فهم"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم بالنمذجة<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم بالنمذجة\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: 100 قطعة نقدية لكل مجموعة، ورق رسم بياني<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: 100 قطعة نقدية لكل مجموعة، ورق رسم بياني"},{"h":"<div class=\"pills\"><span>الاضمحلال الإشعاعي<\/span><span>النواة غير المستقرة<\/span><span>النشاط الإشعاعي<\/span><span>البيكريل<\/span><span>منحنى الاضمحلال<\/span><\/div>","t":"الاضمحلال الإشعاعي، النواة غير المستقرة، النشاط الإشعاعي، البيكريل، منحنى الاضمحلال"},{"h":"<p>مقطع قصير يوضح اضمحلال مادة مشعة ذات عمر نصف قصير وتناقص قراءة العداد مع الزمن.<\/p>","t":"مقطع قصير يوضح اضمحلال مادة مشعة ذات عمر نصف قصير وتناقص قراءة العداد مع الزمن."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يلاحظون تناقص القراءة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">معنى الاضمحلال<\/td><td>يعرّف الاضمحلال: نواة غير مستقرة تبعث إشعاعًا لتصبح أكثر استقرارًا، والنشاط عدد الاضمحلالات في الثانية (Bq).<\/td><td>يدونون التعريفات.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">محاكاة بالقطع النقدية<\/td><td>يوزع 100 قطعة نقدية على كل مجموعة؛ في كل رمية تُزال القطع التي تظهر «كتابة».<\/td><td>يسجلون العدد المتبقي بعد كل رمية ويرسمون المنحنى.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تفسير المنحنى (كتاب الطالب ص 102)<\/td><td>يناقش شكل المنحنى المتناقص، وأن مقدار التناقص يقل كلما قل العدد المتبقي.<\/td><td>يفسرون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يلاحظون تناقص القراءة.\n\n(10 دقائق) معنى الاضمحلال\nدور المعلم: يعرّف الاضمحلال: نواة غير مستقرة تبعث إشعاعًا لتصبح أكثر استقرارًا، والنشاط عدد الاضمحلالات في الثانية (Bq).\nدور الطالب: يدونون التعريفات.\n\n(15 دقيقة) محاكاة بالقطع النقدية\nدور المعلم: يوزع 100 قطعة نقدية على كل مجموعة؛ في كل رمية تُزال القطع التي تظهر «كتابة».\nدور الطالب: يسجلون العدد المتبقي بعد كل رمية ويرسمون المنحنى.\n\n(5 دقائق) تفسير المنحنى (كتاب الطالب ص 102)\nدور المعلم: يناقش شكل المنحنى المتناقص، وأن مقدار التناقص يقل كلما قل العدد المتبقي.\nدور الطالب: يفسرون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما المقصود بالاضمحلال الإشعاعي؟<\/td><td>تحلل نواة غير مستقرة تلقائيًا مع انبعاث إشعاع (ألفا أو بيتا أو جاما).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يتناقص نشاط العينة مع الزمن؟<\/td><td>لأن عدد النوى غير المضمحلة يتناقص فيقل عدد الاضمحلالات في الثانية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>بدأنا المحاكاة بـ 100 قطعة. لماذا لا نحصل على 50 بالضبط بعد الرمية الأولى دائمًا؟<\/td><td>لأن العملية عشوائية؛ فنحصل على عدد قريب من النصف يتغير من تجربة لأخرى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما المقصود بالاضمحلال الإشعاعي؟\nالإجابة النموذجية: تحلل نواة غير مستقرة تلقائيًا مع انبعاث إشعاع (ألفا أو بيتا أو جاما).\n\n2) [المستوى المتوقع] لماذا يتناقص نشاط العينة مع الزمن؟\nالإجابة النموذجية: لأن عدد النوى غير المضمحلة يتناقص فيقل عدد الاضمحلالات في الثانية.\n\n3) [المستوى المتقدم] بدأنا المحاكاة بـ 100 قطعة. لماذا لا نحصل على 50 بالضبط بعد الرمية الأولى دائمًا؟\nالإجابة النموذجية: لأن العملية عشوائية؛ فنحصل على عدد قريب من النصف يتغير من تجربة لأخرى."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس النشاط الإشعاعي؟<\/td><td>البيكريل (Bq) = اضمحلال واحد في الثانية.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>صواب أم خطأ: في المحاكاة يقل عدد القطع المزالة في كل رمية لاحقة.<\/td><td>صواب؛ لأن العدد المتبقي يتناقص فيقل ما يُزال (نصفه تقريبًا).<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ماذا تمثل الرمية الواحدة في المحاكاة؟ وماذا يمثل احتمال ظهور «كتابة»؟<\/td><td>الرمية تمثل فترة زمنية ثابتة، واحتمال الكتابة يمثل احتمال اضمحلال النواة خلال تلك الفترة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ما وحدة قياس النشاط الإشعاعي؟\nالإجابة النموذجية: البيكريل (Bq) = اضمحلال واحد في الثانية.\n\n2) [المستوى المتوقع] صواب أم خطأ: في المحاكاة يقل عدد القطع المزالة في كل رمية لاحقة.\nالإجابة النموذجية: صواب؛ لأن العدد المتبقي يتناقص فيقل ما يُزال (نصفه تقريبًا).\n\n3) [المستوى المتقدم] ماذا تمثل الرمية الواحدة في المحاكاة؟ وماذا يمثل احتمال ظهور «كتابة»؟\nالإجابة النموذجية: الرمية تمثل فترة زمنية ثابتة، واحتمال الكتابة يمثل احتمال اضمحلال النواة خلال تلك الفترة."},{"h":"<p>مراجعة كتاب الطالب ص 102 والإجابة عن السؤال 1-10، والاحتفاظ بمنحنى المحاكاة لاستخدامه في درس عمر النصف.<\/p>","t":"مراجعة كتاب الطالب ص 102 والإجابة عن السؤال 1-10، والاحتفاظ بمنحنى المحاكاة لاستخدامه في درس عمر النصف."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-10 تناقص النشاط الإشعاعي مع مرور الزمن<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 102 | كتاب النشاط: تمرين 1-10 ص 72–73<\/div><div><b>دليل المعلم:<\/b> ص 104<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: معنى الاضمحلال وتناقص النشاط<\/div><ol class=\"ol\"><li>يذكر معنى الاضمحلال الإشعاعي.<\/li><li>يصف تناقص النشاط الإشعاعي لعينة مع مرور الزمن.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/ فا (كتاب الطالب ص 103)<\/td><td>يكتب <bdi>²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He<\/bdi> ويوضح أن A يقل 4 وZ يقل 2.<\/td><td>يتحققون من تساوي مجموع الأعداد في الطرفين.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">تطبيق بالبطاقات<\/td><td>يوزع بطاقات نويدات أم: ²³⁸₉₂U و²¹⁰₈₄Po و²⁴¹₉₅Am.<\/td><td>يكتبون معادلات ألفا ويحددون النواة الناتجة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تصحيح<\/td><td>يعرض الحلول على السبورة الذكية.<\/td><td>يصححون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يستنتجون تغير العنصر لتغير Z.\n\n(12 دقيقة) معادلة ألفا (كتاب الطالب ص 103)\nدور المعلم: يكتب ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He ويوضح أن A يقل 4 وZ يقل 2.\nدور الطالب: يتحققون من تساوي مجموع الأعداد في الطرفين.\n\n(13 دقيقة) تطبيق بالبطاقات\nدور المعلم: يوزع بطاقات نويدات أم: ²³⁸₉₂U و²¹⁰₈₄Po و²⁴¹₉₅Am.\nدور الطالب: يكتبون معادلات ألفا ويحددون النواة الناتجة.\n\n(5 دقائق) تصحيح\nدور المعلم: يعرض الحلول على السبورة الذكية.\nدور الطالب: يصححون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كم ينقص العدد الكتلي والعدد الذري عند انبعاث جسيم ألفا؟<\/td><td>ينقص العدد الكتلي 4 والعدد الذري 2.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: ²³⁸₉₂U → ؟ + ⁴₂He<\/td><td>²³⁴₉₀Th.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة ²¹⁰₈₄Po تبعث جسيم ألفا. اكتب المعادلة وتحقق من حفظ A وZ.<\/td><td>²¹<bdi>⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He<\/bdi>؛ <bdi>210 = 206 + 4<\/bdi> و <bdi>84 = 82 + 2<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] كم ينقص العدد الكتلي والعدد الذري عند انبعاث جسيم ألفا؟\nالإجابة النموذجية: ينقص العدد الكتلي 4 والعدد الذري 2.\n\n2) [المستوى المتوقع] أكمل: ²³⁸₉₂U → ؟ + ⁴₂He\nالإجابة النموذجية: ²³⁴₉₀Th.\n\n3) [المستوى المتقدم] نواة ²¹⁰₈₄Po تبعث جسيم ألفا. اكتب المعادلة وتحقق من حفظ A وZ.\nالإجابة النموذجية: ²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He؛ 210 = 206 + 4 و 84 = 82 + 2."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: بعد اضمحلال ألفا تتحول النواة إلى عنصر مختلف.<\/td><td>صواب؛ لأن عددها الذري تغير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب رمز جسيم ألفا بصيغة النويدة.<\/td><td>⁴₂He.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة عددها الكتلي 222 والذري 86 نتجت من اضمحلال ألفا. ما العددان للنواة الأم؟<\/td><td><bdi>A = 226<\/bdi> و <bdi>Z = 88<\/bdi> (الراديوم).<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: بعد اضمحلال ألفا تتحول النواة إلى عنصر مختلف.\nالإجابة النموذجية: صواب؛ لأن عددها الذري تغير.\n\n2) [المستوى المتوقع] اكتب رمز جسيم ألفا بصيغة النويدة.\nالإجابة النموذجية: ⁴₂He.\n\n3) [المستوى المتقدم] نواة عددها الكتلي 222 والذري 86 نتجت من اضمحلال ألفا. ما العددان للنواة الأم؟\nالإجابة النموذجية: A = 226 و Z = 88 (الراديوم)."},{"h":"<p>مراجعة كتاب الطالب ص 103، وحل الجزء الخاص باضمحلال ألفا من تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73.<\/p>","t":"مراجعة كتاب الطالب ص 103، وحل الجزء الخاص باضمحلال ألفا من تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73."}]},{"n":2,"focus":"معادلات اضمحلال بيتا وانبعاث جاما","info":"<div><b>الدرس:<\/b> 2-10 معادلات الاضمحلال الإشعاعي<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 103 | كتاب النشاط: تمرين 1-10 ص 72–73<\/div><div><b>دليل المعلم:<\/b> ص 104<\/div><div><b>محور الحصة:<\/b> معادلات اضمحلال بيتا وانبعاث جاما<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يستخدم صيغة النويدة لتمثيل اضمحلال بيتا.<\/li><li>يميز بين تغيرات النواة في اضمحلال اقة النواة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] ماذا يحدث للعدد الكتلي والذري في اضمحلال بيتا؟\nالإجابة النموذجية: يبقى العدد الكتلي ثابتًا ويزداد العدد الذري بمقدار 1.\n\n2) [المستوى المتوقع] أكمل: ¹⁴₆C → ؟ + ⁰₋₁e\nالإجابة النموذجية: ¹⁴₇N.\n\n3) [المستوى المتقدم] نواة ⁶⁰₂₇Co تبعث بيتا ثم جاما. ما النواة الناتجة؟ وما أثر جاما؟\nالإجابة النموذجية: ⁶⁰₂₈Ni؛ وانبعاث جاما لا يغير A ولا Z بل يقلل طاقة النواة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: انبعاث أشعة جاما يغير العدد الذري للنواة.<\/td><td>خطأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب رمز جسيم بيتا بصيغة النويدة.<\/td><td>⁰₋₁e.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة ²³⁸₉₂U تبعث ألفا ثم بيتا ثم بيتا. ما النواة الناتجة؟<\/td><td>بعد ألفا ²³⁴₉₀Th، ثم بيتا ²³⁴₉₁Pa، ثم بيتا ²³⁴₉₂U.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: انبعاث أشعة جاما يغير العدد الذري للنواة.\nالإجابة النموذجية: خطأ.\n\n2) [المستوى المتوقع] اكتب رمز جسيم بيتا بصيغة النويدة.\nالإجابة النموذجية: ⁰₋₁e.\n\n3) [المستوى المتقدم] نواة ²³⁸₉₂U تبعث ألفا ثم بيتا ثم بيتا. ما النواة الناتجة؟\nالإجابة النموذجية: بعد ألفا ²³⁴₉₀Th، ثم بيتا ²³⁴₉₁Pa، ثم بيتا ²³⁴₉₂U."},{"h":"<p>إكمال تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73، وكتابة معادلتين لاضمحلال ألفا وبيتا من اختيار الطالب.<\/p>","t":"إكمال تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73، وكتابة معادلتين لاضمحلال ألفا وبيتا من اختيار الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-10 معادلات الاضمحلال الإشعاعي<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الرابع عشر (6–10/12/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 103 | كتاب النشاط: تمرين 1-10 ص 72–73<\/div><div><b>دليل المعلم:<\/b> ص 104<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: "psub\">الحصة 2: معادلات اضمحلال بيتا وانبعاث جاما<\/div><div class=\"pills\"><span>اضمحلال بيتا<\/span><span>جسيم بيتا<\/span><span>انبعاث جاما<\/span><span>تحول النيوترون<\/span><\/div>","t":"الحصة 1: معادلات اضمحلال ألفا\nاضمحلال ألفا، النواة الأم، النواة الناتجة، حفظ العدد الكتلي، حفظ العدد الذري\n\nالحصة 2: معادلات اضمحلال بيتا وانبعاث جاما\nاضمحلال بيتا، جسيم بيتا، انبعاث جاما، تحول النيوترون"},{"h":"<div class=\"psub\">الحصة 1: معادلات اضمحلال ألفا<\/div><p>سؤال: إذا فقدت النواة جسيم ألفا (2 بروتون و2 نيوترون)، فهل تبقى العنصر نفسه؟<\/p><div class=\"psub\">الحصة 2: معادلات اضمحلال بيتا وانبعاث جاما<\/div><p>يعرض المعلم معادلة: ¹⁴₆C → ¹⁴₇N + ؟ ويسأل: ما الجسيم الذي لم يغير العدد الكتلي لكنه رفع العدد الذري؟<\/p>","t":"الحصة 1: معادلات اضمحلال ألفا\nسؤال: إذا فقدت النواة جسيم ألفا (2 بروتون و2 نيوترون)، فهل تبقى العنصر نفسه؟\n\nالحصة 2: معادلات اضمحلال بيتا وانبعاث جاما\nيعرض المعلم معادلة: ¹⁴₆C → ¹⁴₇N + ؟ ويسأل: ما الجسيم الذي لم يغير العدد الكتلي لكنه رفع العدد الذري؟"},{"h":"<div class=\"psub\">الحصة 1: معادلات اضمحلال ألفا<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يستنتجون تغير العنصر لتغير Z.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">معادلة ألفا (كتاب الطالب ص 103)<\/td><td>يكتب <bdi>²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He<\/bdi> ويوضح أن A يقل 4 وZ يقل 2.<\/td><td>يتحققون من تساوي مجموع الأعداد في الطرفين.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">تطبيق بالبطاقات<\/td><td>يوزع بطاقات نويدات أم: ²³⁸₉₂U و²¹⁰₈₄Po و²⁴¹₉₅Am.<\/td><td>يكتبون معادلات ألفا ويحددون النواة الناتجة.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">تصحيح<\/td><td>يعرض الحلول على السبورة الذكية.<\/td><td>يصححون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: معادلات اضمحلال بيتا وانبعاث جاما<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يستنتجون أنه إلكترون.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">معادلة بيتا<\/td><td>يوضح أن نيوترونًا يتحول إلى بروتون وإلكترون ينبعث بسرعة، فيبقى A ويزداد Z بواحد، ويكتب رمز بيتا ⁰₋₁e.<\/td><td>يكتبون معادلة <bdi>⁹⁰₃₈Sr → ⁹⁰₃₉Y + ⁰₋₁e<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">جاما<\/td><td>يوضح أن جاما موجة كهرومغناطيسية لا تغير A ولا Z وتنبعث غالبًا بعد ألفا أو بيتا.<\/td><td>يقارنون في جدول بين الأنواع الثلاثة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">إكمال تمرين 1-10 (كتاب النشاط ص 72–73)<\/td><td>يتابع.<\/td><td>يكملون التمرين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: معادلات اضمحلال ألفا\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يستنتجون تغير العنصر لتغير Z.\n\n(12 دقيقة) معادلة ألفا (كتاب الطالب ص 103)\nدور المعلم: يكتب ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He ويوضح أن A يقل 4 وZ يقل 2.\nدور الطالب: يتحققون من تساوي مجموع الأعداد في الطرفين.\n\n(13 دقيقة) تطبيق بالبطاقات\nدور المعلم: يوزع بطاقات نويدات أم: ²³⁸₉₂U و²¹⁰₈₄Po و²⁴¹₉₅Am.\nدور الطالب: يكتبون معادلات ألفا ويحددون النواة الناتجة.\n\n(5 دقائق) تصحيح\nدور المعلم: يعرض الحلول على السبورة الذكية.\nدور الطالب: يصححون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: معادلات اضمحلال بيتا وانبعاث جاما\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يستنتجون أنه إلكترون.\n\n(10 دقائق) معادلة بيتا\nدور المعلم: يوضح أن نيوترونًا يتحول إلى بروتون وإلكترون ينبعث بسرعة، فيبقى A ويزداد Z بواحد، ويكتب رمز بيتا ⁰₋₁e.\nدور الطالب: يكتبون معادلة ⁹⁰₃₈Sr → ⁹⁰₃₉Y + ⁰₋₁e.\n\n(7 دقائق) جاما\nدور المعلم: يوضح أن جاما موجة كهرومغناطيسية لا تغير A ولا Z وتنبعث غالبًا بعد ألفا أو بيتا.\nدور الطالب: يقارنون في جدول بين الأنواع الثلاثة.\n\n(10 دقائق) إكمال تمرين 1-10 (كتاب النشاط ص 72–73)\nدور المعلم: يتابع.\nدور الطالب: يكملون التمرين.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون."},{"h":"<div class=\"psub\">الحصة 1: معادلات اضمحلال ألفا<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كم ينقص العدد الكتلي والعدد الذري عند انبعاث جسيم ألفا؟<\/td><td>ينقص العدد الكتلي 4 والعدد الذري 2.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: ²³⁸₉₂U → ؟ + ⁴₂He<\/td><td>²³⁴₉₀Th.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة ²¹⁰₈₄Po تبعث جسيم ألفا. اكتب المعادلة وتحقق من حفظ A وZ.<\/td><td>²¹<bdi>⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He<\/bdi>؛ <bdi>210 = 206 + 4<\/bdi> و <bdi>84 = 82 + 2<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: معادلات اضمحلال بيتا وانبعاث جاما<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ماذا يحدث للعدد الكتلي والذري في اضمحلال بيتا؟<\/td><td>يبقى العدد الكتلي ثابتًا ويزداد العدد الذري بمقدار 1.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>أكمل: ¹⁴₆C → ؟ + ⁰₋₁e<\/td><td>¹⁴₇N.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة ⁶⁰₂₇Co تبعث بيتا ثم جاما. ما النواة الناتجة؟ وما أثر جاما؟<\/td><td>⁶⁰₂₈Ni؛ وانبعاث جاما لا يغير A ولا Z بل يقلل طاقة النواة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: معادلات اضمحلال ألفا\n1) [مستوى الدعم] كم ينقص العدد الكتلي والعدد الذري عند انبعاث جسيم ألفا؟\nالإجابة النموذجية: ينقص العدد الكتلي 4 والعدد الذري 2.\n\n2) [المستوى المتوقع] أكمل: ²³⁸₉₂U → ؟ + ⁴₂He\nالإجابة النموذجية: ²³⁴₉₀Th.\n\n3) [المستوى المتقدم] نواة ²¹⁰₈₄Po تبعث جسيم ألفا. اكتب المعادلة وتحقق من حفظ A وZ.\nالإجابة النموذجية: ²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He؛ 210 = 206 + 4 و 84 = 82 + 2.\n\nالحصة 2: معادلات اضمحلال بيتا وانبعاث جاما\n1) [مستوى الدعم] ماذا يحدث للعدد الكتلي والذري في اضمحلال بيتا؟\nالإجابة النموذجية: يبقى العدد الكتلي ثابتًا ويزداد العدد الذري بمقدار 1.\n\n2) [المستوى المتوقع] أكمل: ¹⁴₆C → ؟ + ⁰₋₁e\nالإجابة النموذجية: ¹⁴₇N.\n\n3) [المستوى المتقدم] نواة ⁶⁰₂₇Co تبعث بيتا ثم جاما. ما النواة الناتجة؟ وما أثر جاما؟\nالإجابة النموذجية: ⁶⁰₂₈Ni؛ وانبعاث جاما لا يغير A ولا Z بل يقلل طاقة النواة."},{"h":"<div class=\"psub\">الحصة 1: معادلات اضمحلال ألفا<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: بعد اضمحلال ألفا تتحول النواة إلى عنصر مختلف.<\/td><td>صواب؛ لأن عددها الذري تغير.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب رمز جسيم ألفا بصيغة النويدة.<\/td><td>⁴₂He.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة عددها الكتلي 222 والذري 86 نتجت من اضمحلال ألفا. ما العددان للنواة الأم؟<\/td><td><bdi>A = 226<\/bdi> و <bdi>Z = 88<\/bdi> (الراديوم).<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: معادلات اضمحلال بيتا وانبعاث جاما<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: انبعاث أشعة جاما يغير العدد الذري للنواة.<\/td><td>خطأ.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>اكتب رمز جسيم بيتا بصيغة النويدة.<\/td><td>⁰₋₁e.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>نواة ²³⁸₉₂U تبعث ألفا ثم بيتا ثم بيتا. ما النواة الناتجة؟<\/td><td>بعد ألفا ²³⁴₉₀Th، ثم بيتا ²³⁴₉₁Pa، ثم بيتا ²³⁴₉₂U.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: معادلات اضمحلال ألفا\n1) [مستوى الدعم] صواب أم خطأ: بعد اضمحلال ألفا تتحول النواة إلى عنصر مختلف.\nالإجابة النموذجية: صواب؛ لأن عددها الذري تغير.\n\n2) [المستوى المتوقع] اكتب رمز جسيم ألفا بصيغة النويدة.\nالإجابة النموذجية: ⁴₂He.\n\n3) [المستوى المتقدم] نواة عددها الكتلي 222 والذري 86 نتجت من اضمحلال ألفا. ما العددان للنواة الأم؟\nالإجابة النموذجية: A = 226 و Z = 88 (الراديوم).\n\nالحصة 2: معادلات اضمحلال بيتا وانبعاث جاما\n1) [مستوى الدعم] صواب أم خطأ: انبعاث أشعة جاما يغير العدد الذري للنواة.\nالإجابة النموذجية: خطأ.\n\n2) [المستوى المتوقع] اكتب رمز جسيم بيتا بصيغة النويدة.\nالإجابة النموذجية: ⁰₋₁e.\n\n3) [المستوى المتقدم] نواة ²³⁸₉₂U تبعث ألفا ثم بيتا ثم بيتا. ما النواة الناتجة؟\nالإجابة النموذجية: بعد ألفا ²³⁴₉₀Th، ثم بيتا ²³⁴₉₁Pa، ثم بيتا ²³⁴₉₂U."},{"h":"<div class=\"psub\">الحصة 1: معادلات اضمحلال ألفا<\/div><p>مراجعة كتاب الطالب ص 103، وحل الجزء الخاص باضمحلال ألفا من تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73.<\/p><div class=\"psub\">الحصة 2: معادلات اضمحلال بيتا وانبعاث جاما<\/div><p>إكمال تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73، وكتابة معادلتين لاضمحلال ألفا وبيتا من اختيار الطالب.<\/p>","t":"الحصة 1: معادلات اضمحلال ألفا\nمراجعة كتاب الطالب ص 103، وحل الجزء الخاص باضمحلال ألفا من تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73.\n\nالحصة 2: معادلات اضمحلال بيتا وانبعاث جاما\nإكمال تمرين 1-10 معادلات الاضمحلال الإشعاعي في كتاب النشاط ص 72–73، وكتابة معادلتين لاضمحلال ألفا وبيتا من اختيار الطالب."}]}},{"label":"3-10 عمر النصف للمادة المشعة","unit":"الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف","periods":[{"n":1,"focus":"مفهوم عمر النصف وتحديده من منحنى الاضمحلال","info":"<div><b>الدرس:<\/b> 3-10 عمر النصف للمادة المشعة<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 103–108 | كتاب النشاط: تمرين 2-10 ص 74–76، ورقة العمل 1-10 ص 77–79<\/div><div><b>دليل المعلم:<\/b> ص 105<\/div><div><b>محور الحصة:<\/b> مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يستخدم مصطلح عمر النصف ويعرّفه.<\/li><li>يحدد عمر النصف من منحنى اضمحلال.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف.<\/div>","t":"1. يستخدم مصطلح عمر النصف ويعرّفه.\n2. يحدد عمر النصف من منحنى اضمحلال.\nمخرج تعليمي آخر: يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم مصطلح عمر النصف ويعرّفه.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد عمر النصف من منحنى اضمحلال.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يستخدم مصطلح عمر النصف ويعرّفه. ← فهم\n• يحدد عمر النصف من منحنى اضمحلال. ← تطبيق\n• يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><\/div>","t":"• التعلم بالنمذجة\n• التعلم بالاكتشاف\n• التعلم التعاوني"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>الأقلام<\/span><span>أخرى: ورق رسم بياني<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• الأقلام\n• أخرى: ورق رسم بياني"},{"h":"<div class=\"pills\"><span>عمر النصف<\/span><span>منحنى الاضمحلال<\/span><span>النشاط الإشعاعي<\/span><span>النوى غير المضمحلة<\/span><\/div>","t":"عمر النصف، منحنى الاضمحلال، النشاط الإشعاعي، النوى غير المضمحلة"},{"h":"<p>يعرض المعلم منحنى المحاكاة الذي رسمه الطلبة ويسأل: كم رمية احتجنا ليصبح العدد 50 ثم 25؟<\/p>","t":"يعرض المعلم منحنى المحاكاة الذي رسمه الطلبة ويسأل: كم رمية احتجنا ليصبح العدد 50 ثم 25؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المنحنى.<\/td><td>يلاحظون ثبات عدد الرميات اللازم للتنصيف.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التعريف (كتاب الطالب ص 103–104)<\/td><td>يعرّف عمر النصف: الزمن اللازم لاضمحلال نصف النوى في عينة، أو لانخفاض النشاط إلى النصف.<\/td><td>يدونون التعريف.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">القراءة من المنحنى<\/td><td>يعرض على السبورة الذكية منحنى نشاط يبدأ بـ 800 Bq ويوضح القراءة من 800 إلى 400 ومن 400 إلى 200.<\/td><td>يحددون عمر النصف من منحنيات مختلفة ويتحققون من ثباته.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مقارنة نظائر<\/td><td>يعرض أعمار نصف تقريبية: التكنيشيوم-99m نحو 6 ساعات، واليود-131 نحو 8 أيام، والكربون-14 نحو 5700 سنة.<\/td><td>يقارنون ويستنتجون الأنسب للتشخيص الطبي.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المنحنى.\nدور الطالب: يلاحظون ثبات عدد الرميات اللازم للتنصيف.\n\n(10 دقائق) التعريف (كتاب الطالب ص 103–104)\nدور المعلم: يعرّف عمر النصف: الزمن اللازم لاضمحلال نصف النوى في عينة، أو لانخفاض النشاط إلى النصف.\nدور الطالب: يدونون التعريف.\n\n(13 دقيقة) القراءة من المنحنى\nدور المعلم: يعرض على السبورة الذكية منحنى نشاط يبدأ بـ 800 Bq ويوضح القراءة من 800 إلى 400 ومن 400 إلى 200.\nدور الطالب: يحددون عمر النصف من منحنيات مختلفة ويتحققون من ثباته.\n\n(7 دقائق) مقارنة نظائر\nدور المعلم: يعرض أعمار نصف تقريبية: التكنيشيوم-99m نحو 6 ساعات، واليود-131 نحو 8 أيام، والكربون-14 نحو 5700 سنة.\nدور الطالب: يقارنون ويستنتجون الأنسب للتشخيص الطبي.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف عمر النصف.<\/td><td>الزمن اللازم لاضمحلال نصف عدد النوى المشعة في العينة، أو لانخفاض نشاطها إلى النصف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>نشاط عينة 600 Bq وأصبح 300 Bq بعد 4 ساعات. ما عمر النصف؟<\/td><td>4 ساعات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُستخدم التكنيشيوم-99m (عمر نصفه نحو 6 ساعات) في التشخيص الطبي بدل مادة عمر نصفها آلاف السنين؟<\/td><td>لأن نشاطه يتناقص سريعًا فلا يبقى في جسم المريض فترة طويلة، ويكفي وقتًا لإجراء الفحص.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عرّف عمر النصف.\nالإجابة النموذجية: الزمن اللازم لاضمحلال نصف عدد النوى المشعة في العينة، أو لانخفاض نشاطها إلى النصف.\n\n2) [المستوى المتوقع] نشاط عينة 600 Bq وأصبح 300 Bq بعد 4 ساعات. ما عمر النصف؟\nالإجابة النموذجية: 4 ساعات.\n\n3) [المستوى المتقدم] لماذا يُستخدم التكنيشيوم-99m (عمر نصفه نحو 6 ساعات) في التشخيص الطبي بدل مادة عمر نصفها آلاف السنين؟\nالإجابة النموذجية: لأن نشاطه يتناقص سريعًا فلا يبقى في جسم المريض فترة طويلة، ويكفي وقتًا لإجراء الفحص."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: عمر النصف لمادة مشعة ......... مهما كانت كمية العينة.<\/td><td>ثابت.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>النشاط 1000 Bq عند <bdi>t = 0<\/bdi> و 500 Bq عند <bdi>t = 20 min<\/bdi>. ما النشاط عند <bdi>t = 40 min<\/bdi>؟<\/td><td>250 Bq.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مادتان A (عمر نصفها يومان) وB (عمر نصفها 10 أيام) بالنشاط الابتدائي نفسه. أيهما أكثر نشاطًا بعد 10 أيام؟ ولماذا؟<\/td><td>B؛ لأن A مرت بخمسة أعمار نصف (يبقى 1/32 من نشاطها) بينما B مرت بعمر نصف واحد (يبقى 1/2).<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: عمر النصف لمادة مشعة ......... مهما كانت كمية العينة.\nالإجابة النموذجية: ثابت.\n\n2) [المستوى المتوقع] النشاط 1000 Bq عند t = 0 و 500 Bq عند t = 20 min. ما النشاط عند t = 40 min؟\nالإجابة النموذجية: 250 Bq.\n\n3) [المستوى المتقدم] مادتان A (عمر نصفها يومان) وB (عمر نصفها 10 أيام) بالنشاط الابتدائي نفسه. أيهما أكثر نشاطًا بعد 10 أيام؟ ولماذا؟\nالإجابة النموذجية: B؛ لأن A مرت بخمسة أعمار نصف (يبقى 1/32 من نشاطها) بينما B مرت بعمر نصف واحد (يبقى 1/2)."},{"h":"<p>مراجعة كتاب الطالب ص 103–106 والإجابة عن السؤالين 2-10 و3-10، وحل الجزء الأول من تمرين 2-10 الاضمحلال الإشعاعي في كتاب النشاط ص 74–76.<\/p>","t":"مراجعة كتاب الطالب ص 103–106 والإجابة عن السؤالين 2-10 و3-10، وحل الجزء الأول من تمرين 2-10 الاضمحلال الإشعاعي في كتاب النشاط ص 74–76."}]},{"n":2,"focus":"حسابات عمر النصف","info":"<div><b>الدرس:<\/b> 3-10 عمر النصف للمادة المشعة<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 103–108 | كتاب النشاط: تمرين 2-10 ص 74–76، ورقة العمل 1-10 ص 77–79<\/div><div><b>دليل المعلم:<\/b> ص 105<\/div><div><b>محور الحصة:<\/b> حسابات عمر النصف<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال.<\/li><li>يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد.<\/div>","t":"1. يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال.\n2. يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف.\nمخرج تعليمي آخر: يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال. ← تطبيق\n• يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف. ← تطبيق\n• يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التعاوني\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"pills\"><span>عمر النصف<\/span><span>عدد أعمار النصف<\/span><span>النشاط المتبقي<\/span><span>إشعاع الخلفية<\/span><\/div>","t":"عمر النصف، عدد أعمار النصف، النشاط المتبقي، إشعاع الخلفية"},{"h":"<p>سؤال سريع: عينة نشاطها 1600 Bq وعمر نصفها ساعة. كم يصبح نشاطها بعد 3 ساعات؟<\/p>","t":"سؤال سريع: عينة نشاطها 1600 Bq وعمر نصفها ساعة. كم يصبح نشاطها بعد 3 ساعات؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يحسبون: 1600 ثم 800 ثم 400 ثم 200 Bq.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استراتيجية الحل (كتاب الطالب ص 106–107)<\/td><td>يعرض جدول التنصيف: عدد أعمار النصف = الزمن ÷ عمر النصف، ثم التنصيف المتتالي.<\/td><td>يحلون أمثلة الكتاب.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 1-10 عمر النصف (كتاب النشاط ص 77–79)<\/td><td>يوزع الأسئلة على المجموعات.<\/td><td>يحلون، بما في ذلك سؤال طرح إشعاع الخلفية.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يحسبون: 1600 ثم 800 ثم 400 ثم 200 Bq.\n\n(12 دقيقة) استراتيجية الحل (كتاب الطالب ص 106–107)\nدور المعلم: يعرض جدول التنصيف: عدد أعمار النصف = الزمن ÷ عمر النصف، ثم التنصيف المتتالي.\nدور الطالب: يحلون أمثلة الكتاب.\n\n(10 دقائق) ورقة العمل 1-10 عمر النصف (كتاب النشاط ص 77–79)\nدور المعلم: يوزع الأسئلة على المجموعات.\nدور الطالب: يحلون، بما في ذلك سؤال طرح إشعاع الخلفية.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عينة نشاطها 800 Bq وعمر نصفها 5 أيام. ما نشاطها بعد 5 أيام؟<\/td><td>400 Bq.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عمر نصف مادة 8 ساعات. كم عمر نصف يمر خلال 24 ساعة؟ وما الكسر المتبقي؟<\/td><td>3 أعمار نصف، ويتبقى 1/8.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قراءة العداد لمصدر 520 عدة/دقيقة وإشعاع الخلفية 20 عدة/دقيقة، وبعد 6 ساعات أصبحت القراءة 145 عدة/دقيقة. احسب عمر النصف.<\/td><td>القراءة المصححة 500 ثم 125؛ أي مرور عمرَي نصف في 6 ساعات، فعمر النصف 3 ساعات.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عينة نشاطها 800 Bq وعمر نصفها 5 أيام. ما نشاطها بعد 5 أيام؟\nالإجابة النموذجية: 400 Bq.\n\n2) [المستوى المتوقع] عمر نصف مادة 8 ساعات. كم عمر نصف يمر خلال 24 ساعة؟ وما الكسر المتبقي؟\nالإجابة النموذجية: 3 أعمار نصف، ويتبقى 1/8.\n\n3) [المستوى المتقدم] قراءة العداد لمصدر 520 عدة/دقيقة وإشعاع الخلفية 20 عدة/دقيقة، وبعد 6 ساعات أصبحت القراءة 145 عدة/دقيقة. احسب عمر النصف.\nالإجابة النموذجية: القراءة المصححة 500 ثم 125؛ أي مرور عمرَي نصف في 6 ساعات، فعمر النصف 3 ساعات."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عينة كتلتها 64 g من مادة مشعة. كم يتبقى منها دون اضمحلال بعد 4 أعمار نصف؟<\/td><td>4 g.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عمر نصف اليود-131 نحو 8 أيام. كم يومًا يلزم لينخفض نشاطه إلى الربع؟<\/td><td>16 يومًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>انخفض نشاط عينة من 2400 Bq إلى 300 Bq خلال 15 دقيقة. احسب عمر النصف.<\/td><td>ثلاثة أعمار نصف (2400 ثم 1200 ثم 600 ثم 300)، فعمر النصف 5 دقائق.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] عينة كتلتها 64 g من مادة مشعة. كم يتبقى منها دون اضمحلال بعد 4 أعمار نصف؟\nالإجابة النموذجية: 4 g.\n\n2) [المستوى المتوقع] عمر نصف اليود-131 نحو 8 أيام. كم يومًا يلزم لينخفض نشاطه إلى الربع؟\nالإجابة النموذجية: 16 يومًا.\n\n3) [المستوى المتقدم] انخفض نشاط عينة من 2400 Bq إلى 300 Bq خلال 15 دقيقة. احسب عمر النصف.\nالإجابة النموذجية: ثلاثة أعمار نصف (2400 ثم 1200 ثم 600 ثم 300)، فعمر النصف 5 دقائق."},{"h":"<p>إكمال تمرين 2-10 وورقة العمل 1-10 عمر النصف في كتاب النشاط ص 74–79، والإجابة عن السؤالين 4-10 و5-10 وأسئلة نهاية الوحدة العاشرة في كتاب الطالب.<\/p>","t":"إكمال تمرين 2-10 وورقة العمل 1-10 عمر النصف في كتاب النشاط ص 74–79، والإجابة عن السؤالين 4-10 و5-10 وأسئلة نهاية الوحدة العاشرة في كتاب الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-10 عمر النصف للمادة المشعة<\/div><div><b>الوحدة:<\/b> الوحدة العاشرة: الاضمحلال الإشعاعي وعمر النصف<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 103–108 | كتاب النشاط: تمرين 2-10 ص 74–76، ورقة العمل 1-10 ص 77–79<\/div><div><b>دليل المعلم:<\/b> ص 105<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><ol class=\"ol\"><li>يستخدم مصطلح عمر النصف ويعرّفه.<\/li><li>يحدد عمر النصف من منحنى اضمحلال.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف.<\/div><div class=\"psub\">الحصة 2: حسابات عمر النصف<\/div><ol class=\"ol\"><li>يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال.<\/li><li>يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد.<\/div>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\n1. يستخدم مصطلح عمر النصف ويعرّفه.\n2. يحدد عمر النصف من منحنى اضمحلال.\nمخرج تعليمي آخر: يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف.\n\nالحصة 2: حسابات عمر النصف\n1. يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال.\n2. يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف.\nمخرج تعليمي آخر: يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد."},{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يستخدم مصطلح عمر النصف ويعرّفه.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يحدد عمر النصف من منحنى اضمحلال.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حسابات عمر النصف<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\n• يستخدم مصطلح عمر النصف ويعرّفه. ← فهم\n• يحدد عمر النصف من منحنى اضمحلال. ← تطبيق\n• يقارن بين مواد مشعة من حيث سرعة الاضمحلال باستخدام عمر النصف. ← تحليل\n\nالحصة 2: حسابات عمر النصف\n• يجري حسابات بسيطة على عمر النصف من الجداول ومنحنيات الاضمحلال. ← تطبيق\n• يحسب النشاط أو الكتلة المتبقية بعد عدد من أعمار النصف. ← تطبيق\n• يأخذ إشعاع الخلفية في الحسبان عند حساب عمر النصف من قراءات العداد. ← تحليل"},{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم بالاكتشاف<\/span><spa لنصف<\/div><p>سؤال سريع: عينة نشاطها 1600 Bq وعمر نصفها ساعة. كم يصبح نشاطها بعد 3 ساعات؟<\/p>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\nيعرض المعلم منحنى المحاكاة الذي رسمه الطلبة ويسأل: كم رمية احتجنا ليصبح العدد 50 ثم 25؟\n\nالحصة 2: حسابات عمر النصف\nسؤال سريع: عينة نشاطها 1600 Bq وعمر نصفها ساعة. كم يصبح نشاطها بعد 3 ساعات؟"},{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المنحنى.<\/td><td>يلاحظون ثبات عدد الرميات اللازم للتنصيف.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">التعريف (كتاب الطالب ص 103–104)<\/td><td>يعرّف عمر النصف: الزمن اللازم لاضمحلال نصف النوى في عينة، أو لانخفاض النشاط إلى النصف.<\/td><td>يدونون التعريف.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">القراءة من المنحنى<\/td><td>يعرض على السبورة الذكية منحنى نشاط يبدأ بـ 800 Bq ويوضح القراءة من 800 إلى 400 ومن 400 إلى 200.<\/td><td>يحددون عمر النصف من منحنيات مختلفة ويتحققون من ثباته.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">مقارنة نظائر<\/td><td>يعرض أعمار نصف تقريبية: التكنيشيوم-99m نحو 6 ساعات، واليود-131 نحو 8 أيام، والكربون-14 نحو 5700 سنة.<\/td><td>يقارنون ويستنتجون الأنسب للتشخيص الطبي.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حسابات عمر النصف<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يحسبون: 1600 ثم 800 ثم 400 ثم 200 Bq.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">استراتيجية الحل (كتاب الطالب ص 106–107)<\/td><td>يعرض جدول التنصيف: عدد أعمار النصف = الزمن ÷ عمر النصف، ثم التنصيف المتتالي.<\/td><td>يحلون أمثلة الكتاب.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">ورقة العمل 1-10 عمر النصف (كتاب النشاط ص 77–79)<\/td><td>يوزع الأسئلة على المجموعات.<\/td><td>يحلون، بما في ذلك سؤال طرح إشعاع الخلفية.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">مسابقة المجموعات<\/td><td>يدير المسابقة على الدرس.<\/td><td>يتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\n(5 دقائق) التهيئة\nدور المعلم: يعرض المنحنى.\nدور الطالب: يلاحظون ثبات عدد الرميات اللازم للتنصيف.\n\n(10 دقائق) التعريف (كتاب الطالب ص 103–104)\nدور المعلم: يعرّف عمر النصف: الزمن اللازم لاضمحلال نصف النوى في عينة، أو لانخفاض النشاط إلى النصف.\nدور الطالب: يدونون التعريف.\n\n(13 دقيقة) القراءة من المنحنى\nدور المعلم: يعرض على السبورة الذكية منحنى نشاط يبدأ بـ 800 Bq ويوضح القراءة من 800 إلى 400 ومن 400 إلى 200.\nدور الطالب: يحددون عمر النصف من منحنيات مختلفة ويتحققون من ثباته.\n\n(7 دقائق) مقارنة نظائر\nدور المعلم: يعرض أعمار نصف تقريبية: التكنيشيوم-99m نحو 6 ساعات، واليود-131 نحو 8 أيام، والكربون-14 نحو 5700 سنة.\nدور الطالب: يقارنون ويستنتجون الأنسب للتشخيص الطبي.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: حسابات عمر النصف\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يحسبون: 1600 ثم 800 ثم 400 ثم 200 Bq.\n\n(12 دقيقة) استراتيجية الحل (كتاب الطالب ص 106–107)\nدور المعلم: يعرض جدول التنصيف: عدد أعمار النصف = الزمن ÷ عمر النصف، ثم التنصيف المتتالي.\nدور الطالب: يحلون أمثلة الكتاب.\n\n(10 دقائق) ورقة العمل 1-10 عمر النصف (كتاب النشاط ص 77–79)\nدور المعلم: يوزع الأسئلة على المجموعات.\nدور الطالب: يحلون، بما في ذلك سؤال طرح إشعاع الخلفية.\n\n(8 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عرّف عمر النصف.<\/td><td>الزمن اللازم لاضمحلال نصف عدد النوى المشعة في العينة، أو لانخفاض نشاطها إلى النصف.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>نشاط عينة 600 Bq وأصبح 300 Bq بعد 4 ساعات. ما عمر النصف؟<\/td><td>4 ساعات.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>لماذا يُستخدم التكنيشيوم-99m (عمر نصفه نحو 6 ساعات) في التشخيص الطبي بدل مادة عمر نصفها آلاف السنين؟<\/td><td>لأن نشاطه يتناقص سريعًا فلا يبقى في جسم المريض فترة طويلة، ويكفي وقتًا لإجراء الفحص.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حسابات عمر النصف<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عينة نشاطها 800 Bq وعمر نصفها 5 أيام. ما نشاطها بعد 5 أيام؟<\/td><td>400 Bq.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عمر نصف مادة 8 ساعات. كم عمر نصف يمر خلال 24 ساعة؟ وما الكسر المتبقي؟<\/td><td>3 أعمار نصف، ويتبقى 1/8.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قراءة العداد لمصدر 520 عدة/دقيقة وإشعاع الخلفية 20 عدة/دقيقة، وبعد 6 ساعات أصبحت القراءة 145 عدة/دقيقة. احسب عمر النصف.<\/td><td>القراءة المصححة 500 ثم 125؛ أي مرور عمرَي نصف في 6 ساعات، فعمر النصف 3 ساعات.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\n1) [مستوى الدعم] عرّف عمر النصف.\nالإجابة النموذجية: الزمن اللازم لاضمحلال نصف عدد النوى المشعة في العينة، أو لانخفاض نشاطها إلى النصف.\n\n2) [المستوى المتوقع] نشاط عينة 600 Bq وأصبح 300 Bq بعد 4 ساعات. ما عمر النصف؟\nالإجابة النموذجية: 4 ساعات.\n\n3) [المستوى المتقدم] لماذا يُستخدم التكنيشيوم-99m (عمر نصفه نحو 6 ساعات) في التشخيص الطبي بدل مادة عمر نصفها آلاف السنين؟\nالإجابة النموذجية: لأن نشاطه يتناقص سريعًا فلا يبقى في جسم المريض فترة طويلة، ويكفي وقتًا لإجراء الفحص.\n\nالحصة 2: حسابات عمر النصف\n1) [مستوى الدعم] عينة نشاطها 800 Bq وعمر نصفها 5 أيام. ما نشاطها بعد 5 أيام؟\nالإجابة النموذجية: 400 Bq.\n\n2) [المستوى المتوقع] عمر نصف مادة 8 ساعات. كم عمر نصف يمر خلال 24 ساعة؟ وما الكسر المتبقي؟\nالإجابة النموذجية: 3 أعمار نصف، ويتبقى 1/8.\n\n3) [المستوى المتقدم] قراءة العداد لمصدر 520 عدة/دقيقة وإشعاع الخلفية 20 عدة/دقيقة، وبعد 6 ساعات أصبحت القراءة 145 عدة/دقيقة. احسب عمر النصف.\nالإجابة النموذجية: القراءة المصححة 500 ثم 125؛ أي مرور عمرَي نصف في 6 ساعات، فعمر النصف 3 ساعات."},{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: عمر النصف لمادة مشعة ......... مهما كانت كمية العينة.<\/td><td>ثابت.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>النشاط 1000 Bq عند <bdi>t = 0<\/bdi> و 500 Bq عند <bdi>t = 20 min<\/bdi>. ما النشاط عند <bdi>t = 40 min<\/bdi>؟<\/td><td>250 Bq.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مادتان A (عمر نصفها يومان) وB (عمر نصفها 10 أيام) بالنشاط الابتدائي نفسه. أيهما أكثر نشاطًا بعد 10 أيام؟ ولماذا؟<\/td><td>B؛ لأن A مرت بخمسة أعمار نصف (يبقى 1/32 من نشاطها) بينما B مرت بعمر نصف واحد (يبقى 1/2).<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: حسابات عمر النصف<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>عينة كتلتها 64 g من مادة مشعة. كم يتبقى منها دون اضمحلال بعد 4 أعمار نصف؟<\/td><td>4 g.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>عمر نصف اليود-131 نحو 8 أيام. كم يومًا يلزم لينخفض نشاطه إلى الربع؟<\/td><td>16 يومًا.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>انخفض نشاط عينة من 2400 Bq إلى 300 Bq خلال 15 دقيقة. احسب عمر النصف.<\/td><td>ثلاثة أعمار نصف (2400 ثم 1200 ثم 600 ثم 300)، فعمر النصف 5 دقائق.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\n1) [مستوى الدعم] أكمل: عمر النصف لمادة مشعة ......... مهما كانت كمية العينة.\nالإجابة النموذجية: ثابت.\n\n2) [المستوى المتوقع] النشاط 1000 Bq عند t = 0 و 500 Bq عند t = 20 min. ما النشاط عند t = 40 min؟\nالإجابة النموذجية: 250 Bq.\n\n3) [المستوى المتقدم] مادتان A (عمر نصفها يومان) وB (عمر نصفها 10 أيام) بالنشاط الابتدائي نفسه. أيهما أكثر نشاطًا بعد 10 أيام؟ ولماذا؟\nالإجابة النموذجية: B؛ لأن A مرت بخمسة أعمار نصف (يبقى 1/32 من نشاطها) بينما B مرت بعمر نصف واحد (يبقى 1/2).\n\nالحصة 2: حسابات عمر النصف\n1) [مستوى الدعم] عينة كتلتها 64 g من مادة مشعة. كم يتبقى منها دون اضمحلال بعد 4 أعمار نصف؟\nالإجابة النموذجية: 4 g.\n\n2) [المستوى المتوقع] عمر نصف اليود-131 نحو 8 أيام. كم يومًا يلزم لينخفض نشاطه إلى الربع؟\nالإجابة النموذجية: 16 يومًا.\n\n3) [المستوى المتقدم] انخفض نشاط عينة من 2400 Bq إلى 300 Bq خلال 15 دقيقة. احسب عمر النصف.\nالإجابة النموذجية: ثلاثة أعمار نصف (2400 ثم 1200 ثم 600 ثم 300)، فعمر النصف 5 دقائق."},{"h":"<div class=\"psub\">الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال<\/div><p>مراجعة كتاب الطالب ص 103–106 والإجابة عن السؤالين 2-10 و3-10، وحل الجزء الأول من تمرين 2-10 الاضمحلال الإشعاعي في كتاب النشاط ص 74–76.<\/p><div class=\"psub\">الحصة 2: حسابات عمر النصف<\/div><p>إكمال تمرين 2-10 وورقة العمل 1-10 عمر النصف في كتاب النشاط ص 74–79، والإجابة عن السؤالين 4-10 و5-10 وأسئلة نهاية الوحدة العاشرة في كتاب الطالب.<\/p>","t":"الحصة 1: مفهوم عمر النصف وتحديده من منحنى الاضمحلال\nمراجعة كتاب الطالب ص 103–106 والإجابة عن السؤالين 2-10 و3-10، وحل الجزء الأول من تمرين 2-10 الاضمحلال الإشعاعي في كتاب النشاط ص 74–76.\n\nالحصة 2: حسابات عمر النصف\nإكمال تمرين 2-10 وورقة العمل 1-10 عمر النصف في كتاب النشاط ص 74–79، والإجابة عن السؤالين 4-10 و5-10 وأسئلة نهاية الوحدة العاشرة في كتاب الطالب."}]}},{"label":"1-11 التعامل الآمن","unit":"الوحدة الحادية عشرة: احتياطات السلامة","periods":[{"n":1,"focus":"تأثيرات الإشعاع المؤين وقواعد التعامل الآمن","info":"<div><b> توضيحية\n• الوسائل المتعددة (سمعية - بصرية)"},{"h":"<div class=\"pills\"><span>الإشعاع المؤين<\/span><span>تلف الخلايا<\/span><span>الطفرات<\/span><span>السرطان<\/span><span>الدروع الواقية<\/span><span>شارة قياس الجرعة<\/span><span>التخزين الآمن<\/span><\/div>","t":"الإشعاع المؤين، تلف الخلايا، الطفرات، السرطان، الدروع الواقية، شارة قياس الجرعة، التخزين الآمن"},{"h":"<p>يعرض رمز التحذير من الإشعاع ويسأل: أين رأيت هذا الرمز؟ ولماذا يوضع؟<\/p>","t":"يعرض رمز التحذير من الإشعاع ويسأل: أين رأيت هذا الرمز؟ ولماذا يوضع؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الرمز على السبورة الذكية.<\/td><td>يذكرون أماكن مثل أقسام الأشعة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تأثيرات الإشعاع (كتاب الطالب ص 109–110)<\/td><td>يشرح أن التأين قد يتلف الخلايا أو يقتلها أو يسبب طفرات في المادة الوراثية قد تؤدي إلى السرطان، وأن الجرعات الكبيرة تسبب حروقًا وأمراضًا.<\/td><td>يدونون التأثيرات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">قواعد التعامل الآمن<\/td><td>يعرض القواعد: الملاقط الطويلة، وتقليل زمن التعرض، وزيادة المسافة، والدروع الرصاصية، والتخزين في صناديق مبطنة بالرصاص، وشارات قياس الجرعة.<\/td><td>تعد كل مجموعة بطاقة سلامة لموقف عمل وتعرضها.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تمرين 1-11 (كتاب النشاط ص 80)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم ويلخص الوحدة.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض الرمز على السبورة الذكية.\nدور الطالب: يذكرون أماكن مثل أقسام الأشعة.\n\n(10 دقائق) تأثيرات الإشعاع (كتاب الطالب ص 109–110)\nدور المعلم: يشرح أن التأين قد يتلف الخلايا أو يقتلها أو يسبب طفرات في المادة الوراثية قد تؤدي إلى السرطان، وأن الجرعات الكبيرة تسبب حروقًا وأمراضًا.\nدور الطالب: يدونون التأثيرات.\n\n(13 دقيقة) قواعد التعامل الآمن\nدور المعلم: يعرض القواعد: الملاقط الطويلة، وتقليل زمن التعرض، وزيادة المسافة، والدروع الرصاصية، والتخزين في صناديق مبطنة بالرصاص، وشارات قياس الجرعة.\nدور الطالب: تعد كل مجموعة بطاقة سلامة لموقف عمل وتعرضها.\n\n(7 دقائق) تمرين 1-11 (كتاب النشاط ص 80)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم ويلخص الوحدة.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر تأثيرًا ضارًا للإشعاع المؤين على الخلايا الحية.<\/td><td>تلف الخلايا أو قتلها، أو إحداث طفرات قد تؤدي إلى السرطان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُحمل المصادر المشعة بملاقط طويلة؟<\/td><td>لزيادة المسافة بين المصدر واليد فيقل التعرض للإشعاع.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح ثلاثة إجراءات لحماية فني أشعة في مستشفى مع التعليل.<\/td><td>الوقوف خلف حاجز رصاصي يمتص الإشعاع، وتقليل زمن التعرض، وارتداء شارة قياس الجرعة لمراقبة ما يتعرض له.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر تأثيرًا ضارًا للإشعاع المؤين على الخلايا الحية.\nالإجابة النموذجية: تلف الخلايا أو قتلها، أو إحداث طفرات قد تؤدي إلى السرطان.\n\n2) [المستوى المتوقع] لماذا تُحمل المصادر المشعة بملاقط طويلة؟\nالإجابة النموذجية: لزيادة المسافة بين المصدر واليد فيقل التعرض للإشعاع.\n\n3) [المستوى المتقدم] اقترح ثلاثة إجراءات لحماية فني أشعة في مستشفى مع التعليل.\nالإجابة النموذجية: الوقوف خلف حاجز رصاصي يمتص الإشعاع، وتقليل زمن التعرض، وارتداء شارة قياس الجرعة لمراقبة ما يتعرض له."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تُخزن المصادر المشعة في صناديق مبطنة بـ .........<\/td><td>الرصاص.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يرتدي العاملون مع الإشعاع شارات خاصة؟<\/td><td>لقياس كمية الإشعاع التي يتعرضون لها ومراقبتها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قيّم تصرف طالب أمسك مصدرًا مشعًا بيده لثوانٍ قليلة بحجة أن الزمن قصير.<\/td><td>تصرف غير آمن؛ يجب استخدام الملقط دائمًا لزيادة المسافة، فالتعرض القصير من مسافة قريبة جدًا يعطي جرعة غير ضرورية.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: تُخزن المصادر المشعة في صناديق مبطنة بـ .........\nالإجابة النموذجية: الرصاص.\n\n2) [المستوى المتوقع] لماذا يرتدي العاملون مع الإشعاع شارات خاصة؟\nالإجابة النموذجية: لقياس كمية الإشعاع التي يتعرضون لها ومراقبتها.\n\n3) [المستوى المتقدم] قيّم تصرف طالب أمسك مصدرًا مشعًا بيده لثوانٍ قليلة بحجة أن الزمن قصير.\nالإجابة النموذجية: تصرف غير آمن؛ يجب استخدام الملقط دائمًا لزيادة المسافة، فالتعرض القصير من مسافة قريبة جدًا يعطي جرعة غير ضرورية."},{"h":"<p>مراجعة كتاب الطالب ص 109–112 والإجابة عن الأسئلة 1-11 إلى 3-11، وحل تمرين 1-11 احتياطات السلامة مع النشاط الإشعاعي في كتاب النشاط ص 80، والاستعداد للمراجعة العامة.<\/p>","t":"مراجعة كتاب الطالب ص 109–112 والإجابة عن الأسئلة 1-11 إلى 3-11، وحل تمرين 1-11 احتياطات السلامة مع النشاط الإشعاعي في كتاب النشاط ص 80، والاستعداد للمراجعة العامة."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 1-11 التعامل الآمن<\/div><div><b>الوحدة:<\/b> الوحدة الحادية عشرة: احتياطات السلامة<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الخامس عشر (13–17/12/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 109–112 | كتاب النشاط: تمرين 1-11 ص 80<\/div><div><b>دليل المعلم:<\/b> ص 115<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن<\/div><ol class=\"ol\"><li>يتذكر تأثيرات الإشعاعات المؤينة على الكائنات الحية.<\/li><li>يصف كيفية التعامل مع المواد المشعة واستخدامها وتخزينها بطريقة آمنة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يقيّم إجراءات السلامة في مواقف عمل مختلفة: مستشفى، ومختبر، ومصنع.<\/div>","t":"الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن\n1. يتذكر تأثيرات الإشعاعات المؤينة على الكائنات الحية.\n2. يصف كيفية التعامل مع المواد المؤين، تلف الخلايا، الطفرات، السرطان، الدروع الواقية، شارة قياس الجرعة، التخزين الآمن"},{"h":"<div class=\"psub\">الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن<\/div><p>يعرض رمز التحذير من الإشعاع ويسأل: أين رأيت هذا الرمز؟ ولماذا يوضع؟<\/p>","t":"الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن\nيعرض رمز التحذير من الإشعاع ويسأل: أين رأيت هذا الرمز؟ ولماذا يوضع؟"},{"h":"<div class=\"psub\">الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الرمز على السبورة الذكية.<\/td><td>يذكرون أماكن مثل أقسام الأشعة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تأثيرات الإشعاع (كتاب الطالب ص 109–110)<\/td><td>يشرح أن التأين قد يتلف الخلايا أو يقتلها أو يسبب طفرات في المادة الوراثية قد تؤدي إلى السرطان، وأن الجرعات الكبيرة تسبب حروقًا وأمراضًا.<\/td><td>يدونون التأثيرات.<\/td><\/tr><tr><td class=\"tm\">13 د<\/td><td class=\"st\">قواعد التعامل الآمن<\/td><td>يعرض القواعد: الملاقط الطويلة، وتقليل زمن التعرض، وزيادة المسافة، والدروع الرصاصية، والتخزين في صناديق مبطنة بالرصاص، وشارات قياس الجرعة.<\/td><td>تعد كل مجموعة بطاقة سلامة لموقف عمل وتعرضها.<\/td><\/tr><tr><td class=\"tm\">7 د<\/td><td class=\"st\">تمرين 1-11 (كتاب النشاط ص 80)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم ويلخص الوحدة.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن\n(5 دقائق) التهيئة\nدور المعلم: يعرض الرمز على السبورة الذكية.\nدور الطالب: يذكرون أماكن مثل أقسام الأشعة.\n\n(10 دقائق) تأثيرات الإشعاع (كتاب الطالب ص 109–110)\nدور المعلم: يشرح أن التأين قد يتلف الخلايا أو يقتلها أو يسبب طفرات في المادة الوراثية قد تؤدي إلى السرطان، وأن الجرعات الكبيرة تسبب حروقًا وأمراضًا.\nدور الطالب: يدونون التأثيرات.\n\n(13 دقيقة) قواعد التعامل الآمن\nدور المعلم: يعرض القواعد: الملاقط الطويلة، وتقليل زمن التعرض، وزيادة المسافة، والدروع الرصاصية، والتخزين في صناديق مبطنة بالرصاص، وشارات قياس الجرعة.\nدور الطالب: تعد كل مجموعة بطاقة سلامة لموقف عمل وتعرضها.\n\n(7 دقائق) تمرين 1-11 (كتاب النشاط ص 80)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم ويلخص الوحدة.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر تأثيرًا ضارًا للإشعاع المؤين على الخلايا الحية.<\/td><td>تلف الخلايا أو قتلها، أو إحداث طفرات قد تؤدي إلى السرطان.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُحمل المصادر المشعة بملاقط طويلة؟<\/td><td>لزيادة المسافة بين المصدر واليد فيقل التعرض للإشعاع.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>اقترح ثلاثة إجراءات لحماية فني أشعة في مستشفى مع التعليل.<\/td><td>الوقوف خلف حاجز رصاصي يمتص الإشعاع، وتقليل زمن التعرض، وارتداء شارة قياس الجرعة لمراقبة ما يتعرض له.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن\n1) [مستوى الدعم] اذكر تأثيرًا ضارًا للإشعاع المؤين على الخلايا الحية.\nالإجابة النموذجية: تلف الخلايا أو قتلها، أو إحداث طفرات قد تؤدي إلى السرطان.\n\n2) [المستوى المتوقع] لماذا تُحمل المصادر المشعة بملاقط طويلة؟\nالإجابة النموذجية: لزيادة المسافة بين المصدر واليد فيقل التعرض للإشعاع.\n\n3) [المستوى المتقدم] اقترح ثلاثة إجراءات لحماية فني أشعة في مستشفى مع التعليل.\nالإجابة النموذجية: الوقوف خلف حاجز رصاصي يمتص الإشعاع، وتقليل زمن التعرض، وارتداء شارة قياس الجرعة لمراقبة ما يتعرض له."},{"h":"<div class=\"psub\">الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: تُخزن المصادر المشعة في صناديق مبطنة بـ .........<\/td><td>الرصاص.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا يرتدي العاملون مع الإشعاع شارات خاصة؟<\/td><td>لقياس كمية الإشعاع التي يتعرضون لها ومراقبتها.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>قيّم تصرف طالب أمسك مصدرًا مشعًا بيده لثوانٍ قليلة بحجة أن الزمن قصير.<\/td><td>تصرف غير آمن؛ يجب استخدام الملقط دائمًا لزيادة المسافة، فالتعرض القصير من مسافة قريبة جدًا يعطي جرعة غير ضرورية.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن\n1) [مستوى الدعم] أكمل: تُخزن المصادر المشعة في صناديق مبطنة بـ .........\nالإجابة النموذجية: الرصاص.\n\n2) [المستوى المتوقع] لماذا يرتدي العاملون مع الإشعاع شارات خاصة؟\nالإجابة النموذجية: لقياس كمية الإشعاع التي يتعرضون لها ومراقبتها.\n\n3) [المستوى المتقدم] قيّم تصرف طالب أمسك مصدرًا مشعًا بيده لثوانٍ قليلة بحجة أن الزمن قصير.\nالإجابة النموذجية: تصرف غير آمن؛ يجب استخدام الملقط دائمًا لزيادة المسافة، فالتعرض القصير من مسافة قريبة جدًا يعطي جرعة غير ضرورية."},{"h":"<div class=\"psub\">الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن<\/div><p>مراجعة كتاب الطالب ص 109–112 والإجابة عن الأسئلة 1-11 إلى 3-11، وحل تمرين 1-11 احتياطات السلامة مع النشاط الإشعاعي في كتاب النشاط ص 80، والاستعداد للمراجعة العامة.<\/p>","t":"الحصة 1: تأثيرات الإشعاع المؤين وقواعد التعامل الآمن\nمراجعة كتاب الطالب ص 109–112 والإجابة عن الأسئلة 1-11 إلى 3-11، وحل تمرين 1-11 احتياطات السلامة مع النشاط الإشعاعي في كتاب النشاط ص 80، والاستعداد للمراجعة العامة."}]}}]};</script>
<script>
(function(){
'use strict';
var mode='sep', li=0, pi=0;
function $(s){return document.querySelector(s)}
function nP(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function copy(text,btn,card){
  function ok(){btn.textContent='تم النسخ ✓';btn.classList.add('done');clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent='نسخ';btn.classList.remove('done')},2000)}
  function manual(){var m=card.querySelector('.man'),ta=m.querySelector('textarea');ta.value=text;m.hidden=false;ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}}
  function legacy(){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}var s=false;try{s=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);if(s)ok();else manual()}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,legacy)}else{legacy()}
}
function render(){
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.classList.toggle('on',b.dataset.m===mode)});
  $('#state').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس كله';
  var L=D.lessons[li], tabs=$('#tabs'); tabs.innerHTML=''; tabs.hidden=(mode!=='sep');
  if(mode==='sep'){L.periods.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.className='tab'+(i===pi?' on':'');b.innerHTML='<b>الحصة '+p.n+' من '+L.periods.length+'</b><small>'+esc(p.focus)+'</small>';b.onclick=function(){pi=i;render()};tabs.appendChild(b)})}
  var src=mode==='sep'?L.periods[pi]:L.comb;
  $('#info').innerHTML=src.info;
  var box=$('#fields'); box.innerHTML='';
  src.fields.forEach(function(f,k){
    var c=document.createElement('article'); c.className='card';
    c.innerHTML='<div class="hd"><h3><span class="no">'+(k+1)+'</span>'+D.ft[k]+'</h3><button class="copy" type="button">نسخ</button></div><div class="bd">'+f.h+'</div><div class="man" hidden><p>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدَّد الآن، انسخه يدويًا.</p><textarea readonly></textarea></div>';
    c.querySelector('.copy').onclick=function(e){copy(f.t,e.currentTarget,c)};
    box.appendChild(c);
  });
}
function init(){
  var sel=$('#lesson'), lastU=null, og=null;
  D.lessons.forEach(function(L,i){if(L.unit!==lastU){og=document.createElement('optgroup');og.label=L.unit;sel.appendChild(og);lastU=L.unit}var o=document.createElement('option');o.value=i;o.textContent=L.label+' ('+nP(L.periods.length)+')';og.appendChild(o)});
  sel.onchange=function(){li=+sel.value;pi=0;render()};
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){b.onclick=function(){mode=b.dataset.m;render()}});
  render();
}
init();
})();
</script></body></html>
