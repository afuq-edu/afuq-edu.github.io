s\"><span>القوة<\/span><span>النيوتن<\/span><span>الوزن<\/span><span>الاحتكاك<\/span><span>مقاومة الهواء<\/span><span>قوة رد الفعل<\/span><span>مخطط القوى<\/span><\/div>","t":"الحصة 1: أنواع القوى وتمثيلها بالأسهم\nالقوة، النيوتن، الوزن، الاحتكاك، مقاومة الهواء، قوة رد الفعل، مخطط القوى"},{"h":"<div class=\"psub\">الحصة 1: أنواع القوى وتمثيلها بالأسهم<\/div><p>مقطع قصير لقطار ملاهٍ يصعد وينزل، وسؤال: ما القوى التي تجعل القطار يتباطأ ويتسارع؟<\/p>","t":"الحصة 1: أنواع القوى وتمثيلها بالأسهم\nمقطع قصير لقطار ملاهٍ يصعد وينزل، وسؤال: ما القوى التي تجعل القطار يتباطأ ويتسارع؟"},{"h":"<div class=\"psub\">الحصة 1: أنواع القوى وتمثيلها بالأسهم<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يسمّون القوى التي يعرفونها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">القوة وتمثيلها<\/td><td>يعرّف القوة بأنها دفع أو سحب تقاس بالنيوتن، ويمثلها بأسهم تبين المقدار والاتجاه.<\/td><td>يرسمون أسهمًا لقوى مختلفة المقدار والاتجاه.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">تحليل قطار الملاهي (كتاب الطالب ص 43)<\/td><td>يعرض الشكل ويطلب تحديد القوى في مواضع مختلفة من المسار.<\/td><td>يرسمون مخطط قوى لعربة القطار وهي تصعد وهي تهبط.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 1-4 تحديد القوى (كتاب النشاط ص 30–31)<\/td><td>يتابع الحل.<\/td><td>يحلون جزءًا من التمرين.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: أنواع القوى وتمثيلها بالأسهم\n(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يسمّون القوى التي يعرفونها.\n\n(10 دقائق) القوة وتمثيلها\nدور المعلم: يعرّف القوة بأنها دفع أو سحب تقاس بالنيوتن، ويمثلها بأسهم تبين المقدار والاتجاه.\nدور الطالب: يرسمون أسهمًا لقوى مختلفة المقدار والاتجاه.\n\n(12 دقيقة) تحليل قطار الملاهي (كتاب الطالب ص 43)\nدور المعلم: يعرض الشكل ويطلب تحديد القوى في مواضع مختلفة من المسار.\nدور الطالب: يرسمون مخطط قوى لعربة القطار وهي تصعد وهي تهبط.\n\n(8 دقائق) تمرين 1-4 تحديد القوى (كتاب النشاط ص 30–31)\nدور المعلم: يتابع الحل.\nدور الطالب: يحلون جزءًا من التمرين.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: أنواع القوى وتمثيلها بالأسهم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>ما وحدة قياس القوة؟<\/td><td>النيوتن (N).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ارسم مخطط القوى لصندوق ساكن على أرض أفقية.<\/td><td>سهم الوزن إلى الأسفل وسهم رد فعل الأرض إلى الأعلى بالطول نفسه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عربة قطار ملاهٍ تتحرك أفقيًا وتتباطأ دون محرك. حدد القوى الأفقية المؤثرة فيها واتجاهها.<\/td><td>الاحتكاك ومقاومة الهواء في عكس اتجاه الحركة، ولا توجد قوة دافعة تعاكسهما، لذلك تتباطأ.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: أنواع القوى وتمثيلها بالأسهم\n1) [مستوى الدعم] ما وحدة قياس القوة؟\nالإجابة النموذجية: النيوتن (N).\n\n2) [المستوى المتوقع] ارسم مخطط القوى لصندوق ساكن على أرض أفقية.\nالإجابة النموذجية: سهم الوزن إلى الأسفل وسهم رد فعل الأرض إلى الأعلى بالطول نفسه.\n\n3) [المستوى المتقدم] عربة قطار ملاهٍ تتحرك أفقيًا وتتباطأ دون محرك. حدد القوى الأفقية المؤثرة فيها واتجاهها.\nالإجابة النموذجية: الاحتكاك ومقاومة الهواء في عكس اتجاه الحركة، ولا توجد قوة دافعة تعاكسهما، لذلك تتباطأ."},{"h":"<div class=\"psub\">الحصة 1: أنواع القوى وتمثيلها بالأسهم<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: مقاومة الهواء شكل من أشكال .........<\/td><td>الاحتكاك.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُمثل القوة بسهم؟<\/td><td>لأن للقوة مقدارًا واتجاهًا؛ طول السهم يدل على المقدار، واتجاهه على الاتجاه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صف كيف تتغير القوى المؤثرة في عربة القطار من لحظة سحبها إلى القمة إلى لحظة هبوطها.<\/td><td>عند الصعود تسحبها قوة شد إلى الأعلى ويعاكسها الوزن والاحتكاك؛ وعند الهبوط يسرّعها الوزن ويعاكس حركتها الاحتكاك ومقاومة الهواء.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: أنواع القوى وتمثيلها بالأسهم\n1) [مستوى الدعم] أكمل: مقاومة الهواء شكل من أشكال .........\nالإجابة النموذجية: الاحتكاك.\n\n2) [المستوى المتوقع] لماذا تُمثل القوة بسهم؟\nالإجابة النموذجية: لأن للقوة مقدارًا واتجاهًا؛ طول السهم يدل على المقدار، واتجاهه على الاتجاه.\n\n3) [المستوى المتقدم] صف كيف تتغير القوى المؤثرة في عربة القطار من لحظة سحبها إلى القمة إلى لحظة هبوطها.\nالإجابة النموذجية: عند الصعود تسحبها قوة شد إلى الأعلى ويعاكسها الوزن والاحتكاك؛ وعند الهبوط يسرّعها الوزن ويعاكس حركتها الاحتكاك ومقاومة الهواء."},{"h":"<div class=\"psub\">الحصة 1: أنواع القوى وتمثيلها بالأسهم<\/div><p>مراجعة كتاب الطالب ص 43 والإجابة عن السؤال 1-4، وإكمال تمرين 1-4 تحديد القوى في كتاب النشاط ص 30–31.<\/p>","t":"الحصة 1: أنواع القوى وتمثيلها بالأسهم\nمراجعة كتاب الطالب ص 43 والإجابة عن السؤال 1-4، وإكمال تمرين 1-4 تحديد القوى في كتاب النشاط ص 30–31."}]}},{"label":"2-4 القوى المؤثرة على المركبة الفضائية","unit":"الوحدة الرابعة: تأثيرات القوى","periods":[{"n":1,"focus":"محصلة القوى على خط واحد","info":"<div><b>الدرس:<\/b> 2-4 القوى المؤثرة على المركبة الفضائية<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 44–48 | كتاب النشاط: تمرين 2-4 ص 32، تمرين 3-4 ص 33–34، ورقة العمل 1-4 ص 41–42<\/div><div><b>دليل المعلم:<\/b> ص 45–46<\/div><div><b>محور الحصة:<\/b> محصلة القوى على خط واحد<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يحدد محصلة قوتين أو أكثر تعمل على الخط نفسه.<\/li><li>يميز بين القوى المتزنة وغير المتزنة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر أمثلة 30 N و 20 N.<\/td><td>يحسبون المحصلة في حالات عدة ويحددون اتجاهها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">عرض بميزاني النابض<\/td><td>يشد عربة بميزانين في اتجاهين متعاكسين بقوى مختلفة.<\/td><td>يتحققون من المحصلة ومن اتجاه حركة العربة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 3-4 محصلة القوى (كتاب النشاط ص 33–34)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: ينفذ شد الحبل بأمان.\nدور الطالب: يلاحظون ويستنتجون.\n\n(12 دقيقة) حساب المحصلة\nدور المعلم: يشرح: القوتان في اتجاه واحد تجمعان، وفي اتجاهين متعاكسين تطرحان، مع أمثلة 30 N و 20 N.\nدور الطالب: يحسبون المحصلة في حالات عدة ويحددون اتجاهها.\n\n(10 دقائق) عرض بميزاني النابض\nدور المعلم: يشد عربة بميزانين في اتجاهين متعاكسين بقوى مختلفة.\nدور الطالب: يتحققون من المحصلة ومن اتجاه حركة العربة.\n\n(8 دقائق) تمرين 3-4 محصلة القوى (كتاب النشاط ص 33–34)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>قوتان 15 N و 10 N تؤثران في جسم في الاتجاه نفسه. ما المحصلة؟<\/td><td>25 N في الاتجاه نفسه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قوتان 40 N إلى اليمين و 25 N إلى اليسار. احسب المحصلة وحدد اتجاهها.<\/td><td>15 N إلى اليمين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صاروخ وزنه 2000 N وقوة دفعه 2600 N إلى الأعلى. احسب المحصلة وصف حركته عند الإطلاق.<\/td><td>المحصلة 600 N إلى الأعلى، فيتسارع إلى الأعلى.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] قوتان 15 N و 10 N تؤثران في جسم في الاتجاه نفسه. ما المحصلة؟\nالإجابة النموذجية: 25 N في الاتجاه نفسه.\n\n2) [المستوى المتوقع] قوتان 40 N إلى اليمين و 25 N إلى اليسار. احسب المحصلة وحدد اتجاهها.\nالإجابة النموذجية: 15 N إلى اليمين.\n\n3) [المستوى المتقدم] صاروخ وزنه 2000 N وقوة دفعه 2600 N إلى الأعلى. احسب المحصلة وصف حركته عند الإطلاق.\nالإجابة النموذجية: المحصلة 600 N إلى الأعلى، فيتسارع إلى الأعلى."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: إذا كانت محصلة القوى صفرًا فالقوى .........<\/td><td>متزنة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>سيارة قوة محركها 3000 N ومجموع الاحتكاك ومقاومة الهواء 3000 N. صف حركتها.<\/td><td>المحصلة صفر؛ فتستمر بسرعة ثابتة في خط مستقيم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ثلاث قوى على خط واحد: 50 N شرقًا و 20 N غربًا و 10 N غربًا. احسب المحصلة واقترح قوة رابعة تحقق الاتزان.<\/td><td>المحصلة 20 N شرقًا؛ والقوة الرابعة 20 N غربًا.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: إذا كانت محصلة القوى صفرًا فالقوى .........\nالإجابة النموذجية: متزنة.\n\n2) [المستوى المتوقع] سيارة قوة محركها 3000 N ومجموع الاحتكاك ومقاومة الهواء 3000 N. صف حركتها.\nالإجابة النموذجية: المحصلة صفر؛ فتستمر بسرعة ثابتة في خط مستقيم.\n\n3) [المستوى المتقدم] ثلاث قوى على خط واحد: 50 N شرقًا و 20 N غربًا و 10 N غربًا. احسب المحصلة واقترح قوة رابعة تحقق الاتزان.\nالإجابة النموذجية: المحصلة 20 N شرقًا؛ والقوة الرابعة 20 N غربًا."},{"h":"<p>حل تمرين 3-4 محصلة القوى في كتاب النشاط ص 33–34، ومراجعة كتاب الطالب ص 44–46 والإجابة عن السؤال 2-4.<\/p>","t":"حل تمرين 3-4 محصلة القوى في كتاب النشاط ص 33–34، ومراجعة كتاب الطالب ص 44–46 والإجابة عن السؤال 2-4."}]},{"n":2,"focus":"القوة المحصلة والحركة واستقصاء الاحتكاك","info":"<div><b>الدرس:<\/b> 2-4 القوى المؤثرة على المركبة الفضائية<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 44–48 | كتاب النشاط: تمرين 2-4 ص 32، تمرين 3-4 ص 33–34، ورقة العمل 1-4 ص 41–42<\/div><div><b>دليل المعلم:<\/b> ص 45–46 t":"القوة المحصلة، السرعة الثابتة، الاحتكاك، مقاومة الهواء، تأثيرات القوى"},{"h":"<p>مقطع لرائد فضاء يدفع جسمًا داخل محطة فضائية فيستمر في الحركة؛ سؤال: لماذا لا يتوقف؟<\/p>","t":"مقطع لرائد فضاء يدفع جسمًا داخل محطة فضائية فيستمر في الحركة؛ سؤال: لماذا لا يتوقف؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يناقشون غياب الاحتكاك.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-4 استقصاء الاحتكاك (كتاب الطالب)<\/td><td>يوجه إلى سحب القطعة الخشبية بسرعة منتظمة على أسطح مختلفة وبأثقال مختلفة وقراءة الميزان.<\/td><td>يسجلون القراءات ويستنتجون أثر نوع السطح والوزن في الاحتكاك.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تأثيرات القوى<\/td><td>يناقش تأثيرات القوة: تغيير السرعة والاتجاه والشكل، ويربط ذلك بالمركبة الفضائية في كتاب الطالب ص 44–48.<\/td><td>يصنفون أمثلة حسب التأثير.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ورقة العمل 1-4 القوى المتزنة (كتاب النشاط ص 41)<\/td><td>يوجه إلى البدء في الحل.<\/td><td>يحلون السؤال الأول.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يناقشون غياب الاحتكاك.\n\n(15 دقيقة) النشاط 1-4 استقصاء الاحتكاك (كتاب الطالب)\nدور المعلم: يوجه إلى سحب القطعة الخشبية بسرعة منتظمة على أسطح مختلفة وبأثقال مختلفة وقراءة الميزان.\nدور الطالب: يسجلون القراءات ويستنتجون أثر نوع السطح والوزن في الاحتكاك.\n\n(10 دقائق) تأثيرات القوى\nدور المعلم: يناقش تأثيرات القوة: تغيير السرعة والاتجاه والشكل، ويربط ذلك بالمركبة الفضائية في كتاب الطالب ص 44–48.\nدور الطالب: يصنفون أمثلة حسب التأثير.\n\n(5 دقائق) ورقة العمل 1-4 القوى المتزنة (كتاب النشاط ص 41)\nدور المعلم: يوجه إلى البدء في الحل.\nدور الطالب: يحلون السؤال الأول.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة تأثيرات للقوة على الجسم.<\/td><td>تغيير سرعته، أو اتجاه حركته، أو شكله وحجمه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تكون قراءة الميزان أكبر عند سحب القطعة على ورق الصنفرة؟<\/td><td>لأن الاحتكاك بين السطحين الخشنين أكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مركبة فضائية بعيدة عن أي جاذبية أُطفئ محركها. صف حركتها وفسّر.<\/td><td>تستمر بسرعة ثابتة في خط مستقيم؛ لعدم وجود قوة محصلة تؤثر فيها.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اذكر ثلاثة تأثيرات للقوة على الجسم.\nالإجابة النموذجية: تغيير سرعته، أو اتجاه حركته، أو شكله وحجمه.\n\n2) [المستوى المتوقع] لماذا تكون قراءة الميزان أكبر عند سحب القطعة على ورق الصنفرة؟\nالإجابة النموذجية: لأن الاحتكاك بين السطحين الخشنين أكبر.\n\n3) [المستوى المتقدم] مركبة فضائية بعيدة عن أي جاذبية أُطفئ محركها. صف حركتها وفسّر.\nالإجابة النموذجية: تستمر بسرعة ثابتة في خط مستقيم؛ لعدم وجود قوة محصلة تؤثر فيها."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الجسم المتحرك بسرعة ثابتة في خط مستقيم لا تؤثر فيه قوة محصلة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُصمم السيارات الحديثة بشكل انسيابي؟<\/td><td>لتقليل مقاومة الهواء فتقل القوة المعاكسة للحركة ويقل استهلاك الوقود.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم تجربة لاختبار أثر مساحة سطح التلامس في الاحتكاك محددًا المتغيرات.<\/td><td>المستقل: مساحة سطح التلامس (الوجه العريض ثم الضيق للقطعة)، التابع: قراءة الميزان، الثوابت: نوع السطح والكتلة والسحب بسرعة منتظمة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: الجسم المتحرك بسرعة ثابتة في خط مستقيم لا تؤثر فيه قوة محصلة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا تُصمم السيارات الحديثة بشكل انسيابي؟\nالإجابة النموذجية: لتقليل مقاومة الهواء فتقل القوة المعاكسة للحركة ويقل استهلاك الوقود.\n\n3) [المستوى المتقدم] صمم تجربة لاختبار أثر مساحة سطح التلامس في الاحتكاك محددًا المتغيرات.\nالإجابة النموذجية: المستقل: مساحة سطح التلامس (الوجه العريض ثم الضيق للقطعة)، التابع: قراءة الميزان، الثوابت: نوع السطح والكتلة والسحب بسرعة منتظمة."},{"h":"<p>حل تمرين 2-4 تأثيرات القوى في كتاب النشاط ص 32 وورقة العمل 1-4 القوى المتزنة ص 41–42، والإجابة عن السؤال 3-4 في كتاب الطالب.<\/p>","t":"حل تمرين 2-4 تأثيرات القوى في كتاب النشاط ص 32 وورقة العمل 1-4 القوى المتزنة ص 41–42، والإجابة عن السؤال 3-4 في كتاب الطالب."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 2-4 القوى المؤثرة على المركبة الفضائية<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع السابع (18–22/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 44–48 | كتاب النشاط: تمرين 2-4 ص 32، تمرين 3-4 ص 33–34، ورقة العمل 1-4 ص 41–42<\/div><div><b>دليل المعلم:<\/b> ص 45–46<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><ol class=\"ol\"><li>يحدد محصلة قوتين أو أكثر تعمل على الخط نفسه.<\/li><li>يميز بين القوى المتزنة وغير المتزنة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يتنبأ بحركة جسم من مخطط القوى المؤثرة فيه.<\/div><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><ol class=\"ol\"><li>يتعرف أنه في حالة عدم وجود قوة محصلة يبقى الجسم ساكنًا أو يتحرك بسرعة ثابتة في خط مستقيم.<\/li><li>يصف كيف يمكن أن تغير القوى سرعة الجسم أو اتجاه حركته أو شكله.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستقصي العوامل المؤثرة في قوة الاحتكاك.<\/div>","t":"الحصة 1: محصلة القوى على خط واحد\n1. يحدد محصلة قوتين أو أكثر تعمل على الخط نفسه.\n2. يميز بين القوى المتزنة وغير المتزنة.\nمخرج تعليمي آخر: يتنبأ بحركة جسم من مخطط القوى المؤثرة فيه.\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n1. يتعرف أنه في حالة عدم وجود قوة محصلة يبقى الجسم ساكنًا أو يتحرك بسرعة ثابتة في خط مستقيم.\n2. يصف كيف يمكن أن تغير القوى سرعة الجسم أو اتجاه حركته أو شكله.\nمخرج تعليمي آخر: يستقصي العوامل المؤثرة في قوة الاحتكاك."},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يحدد محصلة قوتين أو أكثر تعمل على الخط نفسه.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يميز بين القوى المتزنة وغير المتزنة.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يتنبأ بحركة جسم من مخطط القوى المؤثرة فيه.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يتعرف أنه في حالة عدم وجود قوة محصلة يبقى الجسم ساكنًا أو يتحرك بسرعة ثابتة في خط مستقيم.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يصف كيف يمكن أن تغير القوى سرعة الجسم أو اتجاه حركته أو شكله.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يستقصي العوامل المؤثرة في قوة الاحتكاك.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: محصلة القوى على خط واحد\n• يحدد محصلة قوتين أو أكثر تعمل على الخط نفسه. ← تطبيق\n• يميز بين القوى المتزنة وغير المتزنة. ← فهم\n• يتنبأ بحركة جسم من مخطط القوى المؤثرة فيه. ← تحليل\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n• يتعرف أنه في حالة عدم وجود قوة محصلة يبقى الجسم ساكنًا أو يتحرك بسرعة ثابتة في خط مستقيم. ← فهم\n• يصف كيف يمكن أن تغير القوى سرعة الجسم أو اتجاه حركته أو شكله. ← فهم\n• يستقصي العوامل المؤثرة في قوة الاحتكاك. ← تحليل"},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><div class=\"pills\"><span>التعلم بالنمذجة<\/span><span>التعلم التعاوني<\/span><span>التعلم المبني على اللعب<\/span><\/div><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"الحصة 1: محصلة القوى على خط واحد\n• التعلم بالنمذجة\n• التعلم التعاوني\n• التعلم المبني على اللعب\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>صورة توضيحية<\/span><span>أخرى: ميزانا نابض، عربة صغيرة، حبل<\/span><\/div><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الوسائل المتعددة (سمعية - بصرية)<\/span><span>أخرى: قطعة خشبية بخطاف، ميزان نابض، أسطح مختلفة (ورق صنفرة، زجاج، قماش)، أثقال<\/span><\/div>","t":"الحصة 1: محصلة القوى على خط واحد\n• الكتاب\n• السبورة الذكية\n• صورة توضيحية\n• أخرى: ميزانا نابض، عربة صغيرة، حبل\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n• الكتاب\n• السبورة الذكية\n• الوسائل المتعددة (سمعية - بصرية)\n• أخرى: قطعة خشبية بخطاف، ميزان نابض، أسطح مختلفة (ورق صنفرة، زجاج، قماش)، أثقال"},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><div class=\"pills\"><span>محصلة القوى<\/span><span>القوى المتزنة<\/span><span>القوى غير المتزنة<\/span><span>اتجاه المحصلة<\/span><\/div><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><div class=\"pills\"><span>القوة المحصلة<\/span><span>السرعة الثابتة<\/span><span>الاحتكاك<\/span><span>مقاومة الهواء<\/span><span>تأثيرات القوى<\/span><\/div>","t":"الحصة 1: محصلة القوى على خط واحد\nمحصلة القوى، القوى المتزنة، القوى غير المتزنة، اتجاه المحصلة\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\nالقوة المحصلة، السرعة الثابتة، الاحتكاك، مقاومة الهواء، تأثيرات القوى"},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><p>لعبة شد الحبل بين طالبين: متى يتحرك الحبل؟ ومتى يبقى ساكنًا؟<\/p><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><p>مقطع لرائد فضاء يدفع جسمًا داخل محطة فضائية فيستمر في الحركة؛ سؤال: لماذا لا يتوقف؟<\/p>","t":"الحصة 1: محصلة القوى على خط واحد\nلعبة شد الحبل بين طالبين: متى يتحرك الحبل؟ ومتى يبقى ساكنًا؟\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\nمقطع لرائد فضاء يدفع جسمًا داخل محطة فضائية فيستمر في الحركة؛ سؤال: لماذا لا يتوقف؟"},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>ينفذ شد الحبل بأمان.<\/td><td>يلاحظون ويستنتجون.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">حساب المحصلة<\/td><td>يشرح: القوتان في اتجاه واحد تجمعان، وفي اتجاهين متعاكسين تطرحان، مع أمثلة 30 N و 20 N.<\/td><td>يحسبون المحصلة في حالات عدة ويحددون اتجاهها.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">عرض بميزاني النابض<\/td><td>يشد عربة بميزانين في اتجاهين متعاكسين بقوى مختلفة.<\/td><td>يتحققون من المحصلة ومن اتجاه حركة العربة.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">تمرين 3-4 محصلة القوى (كتاب النشاط ص 33–34)<\/td><td>يتابع.<\/td><td>يحلون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض المقطع على السبورة الذكية.<\/td><td>يناقشون غياب الاحتكاك.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 1-4 استقصاء الاحتكاك (كتاب الطالب)<\/td><td>يوجه إلى سحب القطعة الخشبية بسرعة منتظمة على أسطح مختلفة وبأثقال مختلفة وقراءة الميزان.<\/td><td>يسجلون القراءات ويستنتجون أثر نوع السطح والوزن في الاحتكاك.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تأثيرات القوى<\/td><td>يناقش تأثيرات القوة: تغيير السرعة والاتجاه والشكل، ويربط ذلك بالمركبة الفضائية في كتاب الطالب ص 44–48.<\/td><td>يصنفون أمثلة حسب التأثير.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">ورقة العمل 1-4 القوى المتزنة (كتاب النشاط ص 41)<\/td><td>يوجه إلى البدء في الحل.<\/td><td>يحلون السؤال الأول.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: محصلة القوى على خط واحد\n(5 دقائق) التهيئة\nدور المعلم: ينفذ شد الحبل بأمان.\nدور الطالب: يلاحظون ويستنتجون.\n\n(12 دقيقة) حساب المحصلة\nدور المعلم: يشرح: القوتان في اتجاه واحد تجمعان، وفي اتجاهين متعاكسين تطرحان، مع أمثلة 30 N و 20 N.\nدور الطالب: يحسبون المحصلة في حالات عدة ويحددون اتجاهها.\n\n(10 دقائق) عرض بميزاني النابض\nدور المعلم: يشد عربة بميزانين في اتجاهين متعاكسين بقوى مختلفة.\nدور الطالب: يتحققون من المحصلة ومن اتجاه حركة العربة.\n\n(8 دقائق) تمرين 3-4 محصلة القوى (كتاب النشاط ص 33–34)\nدور المعلم: يتابع.\nدور الطالب: يحلون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n(5 دقائق) التهيئة\nدور المعلم: يعرض المقطع على السبورة الذكية.\nدور الطالب: يناقشون غياب الاحتكاك.\n\n(15 دقيقة) النشاط 1-4 استقصاء الاحتكاك (كتاب الطالب)\nدور المعلم: يوجه إلى سحب القطعة الخشبية بسرعة منتظمة على أسطح مختلفة وبأثقال مختلفة وقراءة الميزان.\nدور الطالب: يسجلون القراءات ويستنتجون أثر نوع السطح والوزن في الاحتكاك.\n\n(10 دقائق) تأثيرات القوى\nدور المعلم: يناقش تأثيرات القوة: تغيير السرعة والاتجاه والشكل، ويربط ذلك بالمركبة الفضائية في كتاب الطالب ص 44–48.\nدور الطالب: يصنفون أمثلة حسب التأثير.\n\n(5 دقائق) ورقة العمل 1-4 القوى المتزنة (كتاب النشاط ص 41)\nدور المعلم: يوجه إلى البدء في الحل.\nدور الطالب: يحلون السؤال الأول.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>قوتان 15 N و 10 N تؤثران في جسم في الاتجاه نفسه. ما المحصلة؟<\/td><td>25 N في الاتجاه نفسه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>قوتان 40 N إلى اليمين و 25 N إلى اليسار. احسب المحصلة وحدد اتجاهها.<\/td><td>15 N إلى اليمين.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صاروخ وزنه 2000 N وقوة دفعه 2600 N إلى الأعلى. احسب المحصلة وصف حركته عند الإطلاق.<\/td><td>المحصلة 600 N إلى الأعلى، فيتسارع إلى الأعلى.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اذكر ثلاثة تأثيرات للقوة على الجسم.<\/td><td>تغيير سرعته، أو اتجاه حركته، أو شكله وحجمه.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تكون قراءة الميزان أكبر عند سحب القطعة على ورق الصنفرة؟<\/td><td>لأن الاحتكاك بين السطحين الخشنين أكبر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>مركبة فضائية بعيدة عن أي جاذبية أُطفئ محركها. صف حركتها وفسّر.<\/td><td>تستمر بسرعة ثابتة في خط مستقيم؛ لعدم وجود قوة محصلة تؤثر فيها.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: محصلة القوى على خط واحد\n1) [مستوى الدعم] قوتان 15 N و 10 N تؤثران في جسم في الاتجاه نفسه. ما المحصلة؟\nالإجابة النموذجية: 25 N في الاتجاه نفسه.\n\n2) [المستوى المتوقع] قوتان 40 N إلى اليمين و 25 N إلى اليسار. احسب المحصلة وحدد اتجاهها.\nالإجابة النموذجية: 15 N إلى اليمين.\n\n3) [المستوى المتقدم] صاروخ وزنه 2000 N وقوة دفعه 2600 N إلى الأعلى. احسب المحصلة وصف حركته عند الإطلاق.\nالإجابة النموذجية: المحصلة 600 N إلى الأعلى، فيتسارع إلى الأعلى.\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n1) [مستوى الدعم] اذكر ثلاثة تأثيرات للقوة على الجسم.\nالإجابة النموذجية: تغيير سرعته، أو اتجاه حركته، أو شكله وحجمه.\n\n2) [المستوى المتوقع] لماذا تكون قراءة الميزان أكبر عند سحب القطعة على ورق الصنفرة؟\nالإجابة النموذجية: لأن الاحتكاك بين السطحين الخشنين أكبر.\n\n3) [المستوى المتقدم] مركبة فضائية بعيدة عن أي جاذبية أُطفئ محركها. صف حركتها وفسّر.\nالإجابة النموذجية: تستمر بسرعة ثابتة في خط مستقيم؛ لعدم وجود قوة محصلة تؤثر فيها."},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: إذا كانت محصلة القوى صفرًا فالقوى .........<\/td><td>متزنة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>سيارة قوة محركها 3000 N ومجموع الاحتكاك ومقاومة الهواء 3000 N. صف حركتها.<\/td><td>المحصلة صفر؛ فتستمر بسرعة ثابتة في خط مستقيم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ثلاث قوى على خط واحد: 50 N شرقًا و 20 N غربًا و 10 N غربًا. احسب المحصلة واقترح قوة رابعة تحقق الاتزان.<\/td><td>المحصلة 20 N شرقًا؛ والقوة الرابعة 20 N غربًا.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: الجسم المتحرك بسرعة ثابتة في خط مستقيم لا تؤثر فيه قوة محصلة.<\/td><td>صواب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُصمم السيارات الحديثة بشكل انسيابي؟<\/td><td>لتقليل مقاومة الهواء فتقل القوة المعاكسة للحركة ويقل استهلاك الوقود.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صمم تجربة لاختبار أثر مساحة سطح التلامس في الاحتكاك محددًا المتغيرات.<\/td><td>المستقل: مساحة سطح التلامس (الوجه العريض ثم الضيق للقطعة)، التابع: قراءة الميزان، الثوابت: نوع السطح والكتلة والسحب بسرعة منتظمة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: محصلة القوى على خط واحد\n1) [مستوى الدعم] أكمل: إذا كانت محصلة القوى صفرًا فالقوى .........\nالإجابة النموذجية: متزنة.\n\n2) [المستوى المتوقع] سيارة قوة محركها 3000 N ومجموع الاحتكاك ومقاومة الهواء 3000 N. صف حركتها.\nالإجابة النموذجية: المحصلة صفر؛ فتستمر بسرعة ثابتة في خط مستقيم.\n\n3) [المستوى المتقدم] ثلاث قوى على خط واحد: 50 N شرقًا و 20 N غربًا و 10 N غربًا. احسب المحصلة واقترح قوة رابعة تحقق الاتزان.\nالإجابة النموذجية: المحصلة 20 N شرقًا؛ والقوة الرابعة 20 N غربًا.\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\n1) [مستوى الدعم] صواب أم خطأ: الجسم المتحرك بسرعة ثابتة في خط مستقيم لا تؤثر فيه قوة محصلة.\nالإجابة النموذجية: صواب.\n\n2) [المستوى المتوقع] لماذا تُصمم السيارات الحديثة بشكل انسيابي؟\nالإجابة النموذجية: لتقليل مقاومة الهواء فتقل القوة المعاكسة للحركة ويقل استهلاك الوقود.\n\n3) [المستوى المتقدم] صمم تجربة لاختبار أثر مساحة سطح التلامس في الاحتكاك محددًا المتغيرات.\nالإجابة النموذجية: المستقل: مساحة سطح التلامس (الوجه العريض ثم الضيق للقطعة)، التابع: قراءة الميزان، الثوابت: نوع السطح والكتلة والسحب بسرعة منتظمة."},{"h":"<div class=\"psub\">الحصة 1: محصلة القوى على خط واحد<\/div><p>حل تمرين 3-4 محصلة القوى في كتاب النشاط ص 33–34، ومراجعة كتاب الطالب ص 44–46 والإجابة عن السؤال 2-4.<\/p><div class=\"psub\">الحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك<\/div><p>حل تمرين 2-4 تأثيرات القوى في كتاب النشاط ص 32 وورقة العمل 1-4 القوى المتزنة ص 41–42، والإجابة عن السؤال 3-4 في كتاب الطالب.<\/p>","t":"الحصة 1: محصلة القوى على خط واحد\nحل تمرين 3-4 محصلة القوى في كتاب النشاط ص 33–34، ومراجعة كتاب الطالب ص 44–46 والإجابة عن السؤال 2-4.\n\nالحصة 2: القوة المحصلة والحركة واستقصاء الاحتكاك\nحل تمرين 2-4 تأثيرات القوى في كتاب النشاط ص 32 وورقة العمل 1-4 القوى المتزنة ص 41–42، والإجابة عن السؤال 3-4 في كتاب الطالب."}]}},{"label":"3-4 القوة والكتلة والتسارع","unit":"الوحدة الرابعة: تأثيرات القوى","periods":[{"n":1,"focus":"العلاقة بين القوة والكتلة والتسارع (F = ma)","info":"<div><b>الدرس:<\/b> 3-4 القوة والكتلة والتسارع<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 49–50 | كتاب النشاط: تمرين 4-4 ص 35–36<\/div><div><b>دليل المعلم:<\/b> ص 46–47<\/div><div><b>محور الحصة:<\/b> العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div>","fields":[{"h":"<ol class=\"ol\"><li>يذكر العلاقة بين القوة المحصلة والكتلة والتسارع <bdi>(F = ma)<\/bdi> ويستخدمها.<\/li><li>يذكر أن القوة تقاس بوحدة النيوتن (N).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع.<\/div>","t":"1. يذكر العلاقة بين القوة المحصلة والكتلة والتسارع (F = ma) ويستخدمها.\n2. يذكر أن القوة تقاس بوحدة النيوتن (N).\nمخرج تعليمي آخر: يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر العلاقة بين القوة المحصلة والكتلة والتسارع <bdi>(F = ma)<\/bdi> ويستخدمها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذكر أن القوة تقاس بوحدة النيوتن (N).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table>","t":"• يذكر العلاقة بين القوة المحصلة والكتلة والتسارع (F = ma) ويستخدمها. ← تطبيق\n• يذكر أن القوة تقاس بوحدة النيوتن (N). ← تذكر\n• يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع. ← تحليل"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>عروض تقديمية<\/span><span>أخرى: عربة ديناميكية، بكرة وأثقال، مدرج، ساعة إيقاف<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• أخرى: عربة ديناميكية، بكرة وأثقال، مدرج، ساعة إيقاف"},{"h":"<div class=\"pills\"><span>التسارع<\/span><span>الكتلة<\/span><span>القوة المحصلة<\/span><span>النيوتن<\/span><span><bdi>F = ma<\/bdi><\/span><\/div>","t":"التسارع، الكتلة، القوة المحصلة، النيوتن، F = ma"},{"h":"<p>سؤال: أيهما أسهل في التحريك والإيقاف: عربة تسوق فارغة أم ممتلئة؟ ولماذا؟<\/p>","t":"سؤال: أيهما أسهل في التحريك والإيقاف: عربة تسوق فارغة أم ممتلئة؟ ولماذا؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يربطون الكتلة بصعوبة تغيير الحركة.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-4 العلاقة بين القوة والكتلة والتسارع (كتاب الطالب)<\/td><td>يوجه المجموعات إلى: (أ) زيادة القوة مع ثبات الكتلة، (ب) زيادة الكتلة مع ثبات القوة.<\/td><td>يقيسون الزمن ويستنتجون: التسارع يزداد بزيادة القوة ويقل بزيادة الكتلة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">صياغة القانون<\/td><td>يقدم <bdi>F = ma<\/bdi> بعرض تقديمي ويعرّف النيوتن: القوة التي تكسب كتلة 1 kg تسارعًا 1 m/s².<\/td><td>يدونون العلاقة ووحداتها.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مثال<\/td><td>يحل: <bdi>F = 1200 kg × 2 m/s² = 2400 N<\/bdi>.<\/td><td>يحلون مثالًا مماثلًا.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يربطون الكتلة بصعوبة تغيير الحركة.\n\n(15 دقيقة) النشاط 2-4 العلاقة بين القوة والكتلة والتسارع (كتاب الطالب)\nدور المعلم: يوجه المجموعات إلى: (أ) زيادة القوة مع ثبات الكتلة، (ب) زيادة الكتلة مع ثبات القوة.\nدور الطالب: يقيسون الزمن ويستنتجون: التسارع يزداد بزيادة القوة ويقل بزيادة الكتلة.\n\n(10 دقائق) صياغة القانون\nدور المعلم: يقدم F = ma بعرض تقديمي ويعرّف النيوتن: القوة التي تكسب كتلة 1 kg تسارعًا 1 m/s².\nدور الطالب: يدونون العلاقة ووحداتها.\n\n(5 دقائق) مثال\nدور المعلم: يحل: F = 1200 kg × 2 m/s² = 2400 N.\nدور الطالب: يحلون مثالًا مماثلًا.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب العلاقة بين القوة المحصلة والكتلة والتسارع.<\/td><td><bdi>F = m × a<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب القوة المحصلة اللازمة لإكساب جسم كتلته 5 kg تسارعًا 3 m/s².<\/td><td><bdi>F = 5 × 3 = 15 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ضوعفت القوة المحصلة المؤثرة في جسم وضوعفت كتلته في الوقت نفسه. ماذا يحدث لتسارعه؟<\/td><td>يبقى التسارع ثابتًا؛ لأن <bdi>a = F ÷ m<\/bdi> وكلاهما تضاعف.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اكتب العلاقة بين القوة المحصلة والكتلة والتسارع.\nالإجابة النموذجية: F = m × a.\n\n2) [المستوى المتوقع] احسب القوة المحصلة اللازمة لإكساب جسم كتلته 5 kg تسارعًا 3 m/s².\nالإجابة النموذجية: F = 5 × 3 = 15 N.\n\n3) [المستوى المتقدم] ضوعفت القوة المحصلة المؤثرة في جسم وضوعفت كتلته في الوقت نفسه. ماذا يحدث لتسارعه؟\nالإجابة النموذجية: يبقى التسارع ثابتًا؛ لأن a = F ÷ m وكلاهما تضاعف."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: النيوتن هو القوة التي تُكسب كتلة ......... تسارعًا مقداره .........<\/td><td>1 kg – 1 m/s².<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يحدث لتسارع عربة إذا زادت كتلتها مع بقاء القوة المحصلة ثابتة؟<\/td><td>يقل التسارع.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سيارة كتلتها 1000 kg تتسارع بمقدار 2 m/s² وتؤثر فيها مقاومة 500 N. احسب قوة المحرك.<\/td><td>المحصلة = <bdi>1000 × 2 = 2000 N<\/bdi>؛ قوة المحرك = <bdi>2000 + 500 = 2500 N<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: النيوتن هو القوة التي تُكسب كتلة ......... تسارعًا مقداره .........\nالإجابة النموذجية: 1 kg – 1 m/s².\n\n2) [المستوى المتوقع] ماذا يحدث لتسارع عربة إذا زادت كتلتها مع بقاء القوة المحصلة ثابتة؟\nالإجابة النموذجية: يقل التسارع.\n\n3) [المستوى المتقدم] سيارة كتلتها 1000 kg تتسارع بمقدار 2 m/s² وتؤثر فيها مقاومة 500 N. احسب قوة المحرك.\nالإجابة النموذجية: المحصلة = 1000 × 2 = 2000 N؛ قوة المحرك = 2000 + 500 = 2500 N."},{"h":"<p>مراجعة كتاب الطالب ص 49–50 والإجابة عن السؤالين 4-4 و5-4، وحل الجزء الأول من تمرين 4-4 في كتاب النشاط ص 35–36.<\/p>","t":"مراجعة كتاب الطالب ص 49–50 والإجابة عن السؤالين 4-4 و5-4، وحل الجزء الأول من تمرين 4-4 في كتاب النشاط ص 35–36."}]},{"n":2,"focus":"مسائل F = ma وإعادة ترتيب العلاقة","info":"<div><b>الدرس:<\/b> 3-4 القوة والكتلة والتسارع<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 2 من 2<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 49–50 | كتاب النشاط: تمرين 4-4 ص 35–36<\/div><div><b>دليل المعلم:<\/b> ص 46–47<\/div><div><b>محور الحصة:<\/b> مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يعيد ترتيب العلاقة <bdi>F = ma<\/bdi> لحساب الكتلة أو التسارع.<\/li><li>يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصوغ مسائل حول العلاقة <bdi>F = ma<\/bdi> ويحلها مع زملائه.<\/div>","t":"1. يعيد ترتيب العلاقة F = ma لحساب الكتلة أو التسارع.\n2. يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع.\nمخرج تعليمي آخر: يصوغ مسائل حول العلاقة F = ma ويحلها مع زملائه."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعيد ترتيب العلاقة <bdi>F = ma<\/bdi> لحساب الكتلة أو التسارع.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصوغ مسائل حول العلاقة <bdi>F = ma<\/bdi> ويحلها مع زملائه.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"• يعيد ترتيب العلاقة F = ma لحساب الكتلة أو التسارع. ← تطبيق\n• يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع. ← تحليل\n• يصوغ مسائل حول العلاقة F = ma ويحلها مع زملائه. ← إبداع"},{"h":"<div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"• التعلم المبني على حل المشكلات\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"pills\"><span>التسارع<\/span><span>القوة المحصلة<\/span><span>الكتلة<\/span><span>إعادة ترتيب العلاقة<\/span><\/div>","t":"التسارع، القوة المحصلة، الكتلة، إعادة ترتيب العلاقة"},{"h":"<p>يرسم المعلم مثلث العلاقة F وm وa على السبورة، ويغطي أحد الرموز ويسأل عن العلاقة الناتجة.<\/p>","t":"يرسم المعلم مثلث العلاقة F وm وa على السبورة، ويغطي أحد الرموز ويسأل عن العلاقة الناتجة."},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يستخدم مثلث العلاقة.<\/td><td>يستنتجون <bdi>a = F ÷ m<\/bdi> و <bdi>m = F ÷ a<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مسائل متدرجة<\/td><td>يعرض على السبورة الذكية ثلاث مسائل متدرجة: حساب a، ثم m، ثم المحصلة أولًا.<\/td><td>يحلونها في أزواج ويشرح كل زوج حلًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 4-4 القوة والكتلة والتسارع (كتاب النشاط ص 35–36)<\/td><td>يتابع ويقدم دعمًا للمتعثرين.<\/td><td>يكملون التمرين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">صياغة مسائل ومسابقة المجموعات<\/td><td>يطلب من كل مجموعة صياغة مسألة لمجموعة أخرى ثم يدير جولة من مسابقة المجموعات.<\/td><td>يصوغون ويحلون ويتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(5 دقائق) التهيئة\nدور المعلم: يستخدم مثلث العلاقة.\nدور الطالب: يستنتجون a = F ÷ m و m = F ÷ a.\n\n(12 دقيقة) مسائل متدرجة\nدور المعلم: يعرض على السبورة الذكية ثلاث مسائل متدرجة: حساب a، ثم m، ثم المحصلة أولًا.\nدور الطالب: يحلونها في أزواج ويشرح كل زوج حلًا.\n\n(10 دقائق) تمرين 4-4 القوة والكتلة والتسارع (كتاب النشاط ص 35–36)\nدور المعلم: يتابع ويقدم دعمًا للمتعثرين.\nدور الطالب: يكملون التمرين.\n\n(8 دقائق) صياغة مسائل ومسابقة المجموعات\nدور المعلم: يطلب من كل مجموعة صياغة مسألة لمجموعة أخرى ثم يدير جولة من مسابقة المجموعات.\nدور الطالب: يصوغون ويحلون ويتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>قوة 20 N تؤثر في جسم كتلته 4 kg. احسب تسارعه.<\/td><td><bdi>a = 20 ÷ 4 = 5 m/s²<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>جسم تسارع بمقدار 2.5 m/s² تحت تأثير قوة محصلة 50 N. احسب كتلته.<\/td><td><bdi>m = 50 ÷ 2.5 = 20 kg<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صندوق كتلته 10 kg يُسحب بقوة 60 N والاحتكاك 20 N. احسب تسارعه.<\/td><td>المحصلة = <bdi>60 − 20 = 40 N<\/bdi>، <bdi>a = 40 ÷ 10 = 4 m/s²<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] قوة 20 N تؤثر في جسم كتلته 4 kg. احسب تسارعه.\nالإجابة النموذجية: a = 20 ÷ 4 = 5 m/s².\n\n2) [المستوى المتوقع] جسم تسارع بمقدار 2.5 m/s² تحت تأثير قوة محصلة 50 N. احسب كتلته.\nالإجابة النموذجية: m = 50 ÷ 2.5 = 20 kg.\n\n3) [المستوى المتقدم] صندوق كتلته 10 kg يُسحب بقوة 60 N والاحتكاك 20 N. احسب تسارعه.\nالإجابة النموذجية: المحصلة = 60 − 20 = 40 N، a = 40 ÷ 10 = 4 m/s²."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يتناسب التسارع طرديًا مع الكتلة عند ثبات القوة.<\/td><td>خطأ؛ يتناسب عكسيًا مع الكتلة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب القوة اللازمة لإكساب دراجة مع راكبها (80 kg) تسارعًا 1.5 m/s².<\/td><td><bdi>F = 80 × 1.5 = 120 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عربة كتلتها 2 kg تسارعها 3 m/s². أضيف إليها حمل 1 kg مع بقاء القوة نفسها. احسب التسارع الجديد.<\/td><td><bdi>F = 6 N<\/bdi>، <bdi>a = 6 ÷ 3 = 2 m/s²<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] صواب أم خطأ: يتناسب التسارع طرديًا مع الكتلة عند ثبات القوة.\nالإجابة النموذجية: خطأ؛ يتناسب عكسيًا مع الكتلة.\n\n2) [المستوى المتوقع] احسب القوة اللازمة لإكساب دراجة مع راكبها (80 kg) تسارعًا 1.5 m/s².\nالإجابة النموذجية: F = 80 × 1.5 = 120 N.\n\n3) [المستوى المتقدم] عربة كتلتها 2 kg تسارعها 3 m/s². أضيف إليها حمل 1 kg مع بقاء القوة نفسها. احسب التسارع الجديد.\nالإجابة النموذجية: F = 6 N، a = 6 ÷ 3 = 2 m/s²."},{"h":"<p>إكمال تمرين 4-4 القوة والكتلة والتسارع في كتاب النشاط ص 35–36، وحل السؤالين 6-4 و7-4 في كتاب الطالب ص 50.<\/p>","t":"إكمال تمرين 4-4 القوة والكتلة والتسارع في كتاب النشاط ص 35–36، وحل السؤالين 6-4 و7-4 في كتاب الطالب ص 50."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 3-4 القوة والكتلة والتسارع<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصتان<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 49–50 | كتاب النشاط: تمرين 4-4 ص 35–36<\/div><div><b>دليل المعلم:<\/b> ص 46–47<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><ol class=\"ol\"><li>يذكر العلاقة بين القوة المحصلة والكتلة والتسارع <bdi>(F = ma)<\/bdi> ويستخدمها.<\/li><li>يذكر أن القوة تقاس بوحدة النيوتن (N).<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع.<\/div><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><ol class=\"ol\"><li>يعيد ترتيب العلاقة <bdi>F = ma<\/bdi> لحساب الكتلة أو التسارع.<\/li><li>يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يصوغ مسائل حول العلاقة <bdi>F = ma<\/bdi> ويحلها مع زملائه.<\/div>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n1. يذكر العلاقة بين القوة المحصلة والكتلة والتسارع (F = ma) ويستخدمها.\n2. يذكر أن القوة تقاس بوحدة النيوتن (N).\nمخرج تعليمي آخر: يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع.\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n1. يعيد ترتيب العلاقة F = ma لحساب الكتلة أو التسارع.\n2. يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع.\nمخرج تعليمي آخر: يصوغ مسائل حول العلاقة F = ma ويحلها مع زملائه."},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يذكر العلاقة بين القوة المحصلة والكتلة والتسارع <bdi>(F = ma)<\/bdi> ويستخدمها.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يذكر أن القوة تقاس بوحدة النيوتن (N).<\/td><td class=\"lv\">تذكر<\/td><\/tr><tr><td>يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع.<\/td><td class=\"lv\">تحليل<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يعيد ترتيب العلاقة <bdi>F = ma<\/bdi> لحساب الكتلة أو التسارع.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع.<\/td><td class=\"lv\">تحليل<\/td><\/tr><tr><td>يصوغ مسائل حول العلاقة <bdi>F = ma<\/bdi> ويحلها مع زملائه.<\/td><td class=\"lv\">إبداع<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n• يذكر العلاقة بين القوة المحصلة والكتلة والتسارع (F = ma) ويستخدمها. ← تطبيق\n• يذكر أن القوة تقاس بوحدة النيوتن (N). ← تذكر\n• يستنتج من بيانات تجريبية أثر القوة والكتلة في التسارع. ← تحليل\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n• يعيد ترتيب العلاقة F = ma لحساب الكتلة أو التسارع. ← تطبيق\n• يحسب القوة المحصلة أولًا ثم يستخدمها في حساب التسارع. ← تحليل\n• يصوغ مسائل حول العلاقة F = ma ويحلها مع زملائه. ← إبداع"},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم بالنمذجة<\/span><\/div><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><div class=\"pills\"><span>التعلم المبني على حل المشكلات<\/span><span>التعلم التشاركي<\/span><span>التعلم المبني على اللعب<\/span><\/div>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم بالنمذجة\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n• التعلم المبني على حل المشكلات\n• التعلم التشاركي\n• التعلم المبني على اللعب"},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>عروض تقديمية<\/span><span>أخرى: عربة ديناميكية، بكرة وأثقال، مدرج، ساعة إيقاف<\/span><\/div><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot<\/span><span>الأقلام<\/span><\/div>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n• الكتاب\n• السبورة الذكية\n• عروض تقديمية\n• أخرى: عربة ديناميكية، بكرة وأثقال، مدرج، ساعة إيقاف\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n• الكتاب\n• السبورة الذكية\n• برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n• الأقلام"},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><div class=\"pills\"><span>التسارع<\/span><span>الكتلة<\/span><span>القوة المحصلة<\/span><span>النيوتن<\/span><span><bdi>F = ma<\/bdi><\/span><\/div><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><div class=\"pills\"><span>التسارع<\/span><span>القوة المحصلة<\/span><span>الكتلة<\/span><span>إعادة ترتيب العلاقة<\/span><\/div>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\nالتسارع، الكتلة، القوة المحصلة، النيوتن، F = ma\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\nالتسارع، القوة المحصلة، الكتلة، إعادة ترتيب العلاقة"},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><p>سؤال: أيهما أسهل في التحريك والإيقاف: عربة تسوق فارغة أم ممتلئة؟ ولماذا؟<\/p><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><p>يرسم المعلم مثلث العلاقة F وm وa على السبورة، ويغطي أحد الرموز ويسأل عن العلاقة الناتجة.<\/p>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\nسؤال: أيهما أسهل في التحريك والإيقاف: عربة تسوق فارغة أم ممتلئة؟ ولماذا؟\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\nيرسم المعلم مثلث العلاقة F وm وa على السبورة، ويغطي أحد الرموز ويسأل عن العلاقة الناتجة."},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يطرح السؤال.<\/td><td>يربطون الكتلة بصعوبة تغيير الحركة.<\/td><\/tr><tr><td class=\"tm\">15 د<\/td><td class=\"st\">النشاط 2-4 العلاقة بين القوة والكتلة والتسارع (كتاب الطالب)<\/td><td>يوجه المجموعات إلى: (أ) زيادة القوة مع ثبات الكتلة، (ب) زيادة الكتلة مع ثبات القوة.<\/td><td>يقيسون الزمن ويستنتجون: التسارع يزداد بزيادة القوة ويقل بزيادة الكتلة.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">صياغة القانون<\/td><td>يقدم <bdi>F = ma<\/bdi> بعرض تقديمي ويعرّف النيوتن: القوة التي تكسب كتلة 1 kg تسارعًا 1 m/s².<\/td><td>يدونون العلاقة ووحداتها.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">مثال<\/td><td>يحل: <bdi>F = 1200 kg × 2 m/s² = 2400 N<\/bdi>.<\/td><td>يحلون مثالًا مماثلًا.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التهيئة<\/td><td>يستخدم مثلث العلاقة.<\/td><td>يستنتجون <bdi>a = F ÷ m<\/bdi> و <bdi>m = F ÷ a<\/bdi>.<\/td><\/tr><tr><td class=\"tm\">12 د<\/td><td class=\"st\">مسائل متدرجة<\/td><td>يعرض على السبورة الذكية ثلاث مسائل متدرجة: حساب a، ثم m، ثم المحصلة أولًا.<\/td><td>يحلونها في أزواج ويشرح كل زوج حلًا.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">تمرين 4-4 القوة والكتلة والتسارع (كتاب النشاط ص 35–36)<\/td><td>يتابع ويقدم دعمًا للمتعثرين.<\/td><td>يكملون التمرين.<\/td><\/tr><tr><td class=\"tm\">8 د<\/td><td class=\"st\">صياغة مسائل ومسابقة المجموعات<\/td><td>يطلب من كل مجموعة صياغة مسألة لمجموعة أخرى ثم يدير جولة من مسابقة المجموعات.<\/td><td>يصوغون ويحلون ويتنافسون.<\/td><\/tr><tr><td class=\"tm\">5 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n(5 دقائق) التهيئة\nدور المعلم: يطرح السؤال.\nدور الطالب: يربطون الكتلة بصعوبة تغيير الحركة.\n\n(15 دقيقة) النشاط 2-4 العلاقة بين القوة والكتلة والتسارع (كتاب الطالب)\nدور المعلم: يوجه المجموعات إلى: (أ) زيادة القوة مع ثبات الكتلة، (ب) زيادة الكتلة مع ثبات القوة.\nدور الطالب: يقيسون الزمن ويستنتجون: التسارع يزداد بزيادة القوة ويقل بزيادة الكتلة.\n\n(10 دقائق) صياغة القانون\nدور المعلم: يقدم F = ma بعرض تقديمي ويعرّف النيوتن: القوة التي تكسب كتلة 1 kg تسارعًا 1 m/s².\nدور الطالب: يدونون العلاقة ووحداتها.\n\n(5 دقائق) مثال\nدور المعلم: يحل: F = 1200 kg × 2 m/s² = 2400 N.\nدور الطالب: يحلون مثالًا مماثلًا.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون.\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n(5 دقائق) التهيئة\nدور المعلم: يستخدم مثلث العلاقة.\nدور الطالب: يستنتجون a = F ÷ m و m = F ÷ a.\n\n(12 دقيقة) مسائل متدرجة\nدور المعلم: يعرض على السبورة الذكية ثلاث مسائل متدرجة: حساب a، ثم m، ثم المحصلة أولًا.\nدور الطالب: يحلونها في أزواج ويشرح كل زوج حلًا.\n\n(10 دقائق) تمرين 4-4 القوة والكتلة والتسارع (كتاب النشاط ص 35–36)\nدور المعلم: يتابع ويقدم دعمًا للمتعثرين.\nدور الطالب: يكملون التمرين.\n\n(8 دقائق) صياغة مسائل ومسابقة المجموعات\nدور المعلم: يطلب من كل مجموعة صياغة مسألة لمجموعة أخرى ثم يدير جولة من مسابقة المجموعات.\nدور الطالب: يصوغون ويحلون ويتنافسون.\n\n(5 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب العلاقة بين القوة المحصلة والكتلة والتسارع.<\/td><td><bdi>F = m × a<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب القوة المحصلة اللازمة لإكساب جسم كتلته 5 kg تسارعًا 3 m/s².<\/td><td><bdi>F = 5 × 3 = 15 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>ضوعفت القوة المحصلة المؤثرة في جسم وضوعفت كتلته في الوقت نفسه. ماذا يحدث لتسارعه؟<\/td><td>يبقى التسارع ثابتًا؛ لأن <bdi>a = F ÷ m<\/bdi> وكلاهما تضاعف.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>قوة 20 N تؤثر في جسم كتلته 4 kg. احسب تسارعه.<\/td><td><bdi>a = 20 ÷ 4 = 5 m/s²<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>جسم تسارع بمقدار 2.5 m/s² تحت تأثير قوة محصلة 50 N. احسب كتلته.<\/td><td><bdi>m = 50 ÷ 2.5 = 20 kg<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>صندوق كتلته 10 kg يُسحب بقوة 60 N والاحتكاك 20 N. احسب تسارعه.<\/td><td>المحصلة = <bdi>60 − 20 = 40 N<\/bdi>، <bdi>a = 40 ÷ 10 = 4 m/s²<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n1) [مستوى الدعم] اكتب العلاقة بين القوة المحصلة والكتلة والتسارع.\nالإجابة النموذجية: F = m × a.\n\n2) [المستوى المتوقع] احسب القوة المحصلة اللازمة لإكساب جسم كتلته 5 kg تسارعًا 3 m/s².\nالإجابة النموذجية: F = 5 × 3 = 15 N.\n\n3) [المستوى المتقدم] ضوعفت القوة المحصلة المؤثرة في جسم وضوعفت كتلته في الوقت نفسه. ماذا يحدث لتسارعه؟\nالإجابة النموذجية: يبقى التسارع ثابتًا؛ لأن a = F ÷ m وكلاهما تضاعف.\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n1) [مستوى الدعم] قوة 20 N تؤثر في جسم كتلته 4 kg. احسب تسارعه.\nالإجابة النموذجية: a = 20 ÷ 4 = 5 m/s².\n\n2) [المستوى المتوقع] جسم تسارع بمقدار 2.5 m/s² تحت تأثير قوة محصلة 50 N. احسب كتلته.\nالإجابة النموذجية: m = 50 ÷ 2.5 = 20 kg.\n\n3) [المستوى المتقدم] صندوق كتلته 10 kg يُسحب بقوة 60 N والاحتكاك 20 N. احسب تسارعه.\nالإجابة النموذجية: المحصلة = 60 − 20 = 40 N، a = 40 ÷ 10 = 4 m/s²."},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: النيوتن هو القوة التي تُكسب كتلة ......... تسارعًا مقداره .........<\/td><td>1 kg – 1 m/s².<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>ماذا يحدث لتسارع عربة إذا زادت كتلتها مع بقاء القوة المحصلة ثابتة؟<\/td><td>يقل التسارع.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>سيارة كتلتها 1000 kg تتسارع بمقدار 2 m/s² وتؤثر فيها مقاومة 500 N. احسب قوة المحرك.<\/td><td>المحصلة = <bdi>1000 × 2 = 2000 N<\/bdi>؛ قوة المحرك = <bdi>2000 + 500 = 2500 N<\/bdi>.<\/td><\/tr><\/tbody><\/table><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>صواب أم خطأ: يتناسب التسارع طرديًا مع الكتلة عند ثبات القوة.<\/td><td>خطأ؛ يتناسب عكسيًا مع الكتلة.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>احسب القوة اللازمة لإكساب دراجة مع راكبها (80 kg) تسارعًا 1.5 m/s².<\/td><td><bdi>F = 80 × 1.5 = 120 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>عربة كتلتها 2 kg تسارعها 3 m/s². أضيف إليها حمل 1 kg مع بقاء القوة نفسها. احسب التسارع الجديد.<\/td><td><bdi>F = 6 N<\/bdi>، <bdi>a = 6 ÷ 3 = 2 m/s²<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\n1) [مستوى الدعم] أكمل: النيوتن هو القوة التي تُكسب كتلة ......... تسارعًا مقداره .........\nالإجابة النموذجية: 1 kg – 1 m/s².\n\n2) [المستوى المتوقع] ماذا يحدث لتسارع عربة إذا زادت كتلتها مع بقاء القوة المحصلة ثابتة؟\nالإجابة النموذجية: يقل التسارع.\n\n3) [المستوى المتقدم] سيارة كتلتها 1000 kg تتسارع بمقدار 2 m/s² وتؤثر فيها مقاومة 500 N. احسب قوة المحرك.\nالإجابة النموذجية: المحصلة = 1000 × 2 = 2000 N؛ قوة المحرك = 2000 + 500 = 2500 N.\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\n1) [مستوى الدعم] صواب أم خطأ: يتناسب التسارع طرديًا مع الكتلة عند ثبات القوة.\nالإجابة النموذجية: خطأ؛ يتناسب عكسيًا مع الكتلة.\n\n2) [المستوى المتوقع] احسب القوة اللازمة لإكساب دراجة مع راكبها (80 kg) تسارعًا 1.5 m/s².\nالإجابة النموذجية: F = 80 × 1.5 = 120 N.\n\n3) [المستوى المتقدم] عربة كتلتها 2 kg تسارعها 3 m/s². أضيف إليها حمل 1 kg مع بقاء القوة نفسها. احسب التسارع الجديد.\nالإجابة النموذجية: F = 6 N، a = 6 ÷ 3 = 2 m/s²."},{"h":"<div class=\"psub\">الحصة 1: العلاقة بين القوة والكتلة والتسارع <bdi>(F = ma)<\/bdi><\/div><p>مراجعة كتاب الطالب ص 49–50 والإجابة عن السؤالين 4-4 و5-4، وحل الجزء الأول من تمرين 4-4 في كتاب النشاط ص 35–36.<\/p><div class=\"psub\">الحصة 2: مسائل <bdi>F = ma<\/bdi> وإعادة ترتيب العلاقة<\/div><p>إكمال تمرين 4-4 القوة والكتلة والتسارع في كتاب النشاط ص 35–36، وحل السؤالين 6-4 و7-4 في كتاب الطالب ص 50.<\/p>","t":"الحصة 1: العلاقة بين القوة والكتلة والتسارع (F = ma)\nمراجعة كتاب الطالب ص 49–50 والإجابة عن السؤالين 4-4 و5-4، وحل الجزء الأول من تمرين 4-4 في كتاب النشاط ص 35–36.\n\nالحصة 2: مسائل F = ma وإعادة ترتيب العلاقة\nإكمال تمرين 4-4 القوة والكتلة والتسارع في كتاب النشاط ص 35–36، وحل السؤالين 6-4 و7-4 في كتاب الطالب ص 50."}]}},{"label":"4-4 استطالة الزنبرك","unit":"الوحدة الرابعة: تأثيرات القوى","periods":[{"n":1,"focus":"استقصاء استطالة الزنبرك ورسم المنحنى البياني","info":"<div><b>الدرس:<\/b> 4-4 استطالة الزنبرك<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>رقم الحصة:<\/b> الحصة 1 من 1<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 51–53 | كتاب النشاط: تمرين 5-4 ص 37–40<\/div><div><b>دليل المعلم:<\/b> ص 47–48<\/div><div><b>محور الحصة:<\/b> استقصاء استطالة الزنبرك ورسم المنحنى البياني<\/div>","fields":[{"h":"<ol class=\"ol\"><li>يصف كيف يمكن أن تغير القوى حجم الجسم وشكله.<\/li><li>يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل.<\/div>","t":"1. يصف كيف يمكن أن تغير القوى حجم الجسم وشكله.\n2. يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة.\nمخرج تعليمي آخر: يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل."},{"h":"<table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف كيف يمكن أن تغير القوى حجم الجسم وشكله.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/tbody><\/table>","t":"• يصف كيف يمكن أن تغير القوى حجم الجسم وشكله. ← فهم\n• يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة. ← تطبيق\n• يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل. ← تطبيق"},{"h":"<div class=\"pills\"><span>التعلم بالاكتشاف<\/span><span>التعلم التعاوني<\/span><span>التعلم الذاتي<\/span><\/div>","t":"• التعلم بالاكتشاف\n• التعلم التعاوني\n• التعلم الذاتي"},{"h":"<div class=\"pills\"><span>الكتاب<\/span><span>السبورة الذكية<\/span><span>الأقلام<\/span><span>أخرى: زنبرك، حامل، مسطرة مترية، أثقال 1 N، ورق رسم بياني<\/span><\/div>","t":"• الكتاب\n• السبورة الذكية\n• الأقلام\n• أخرى: زنبرك، حامل، مسطرة مترية، أثقال 1 N، ورق رسم بياني"},{"h":"<div class=\"pills\"><span>الاستطالة<\/span><span>الطول الأصلي<\/span><span>الثقل<\/span><span>المنحنى البياني<\/span><span>تغير الشكل<\/span><\/div>","t":"الاستطالة، الطول الأصلي، الثقل، المنحنى البياني، تغير الشكل"},{"h":"<p>يضغط المعلم كرة من الصلصال ويشد شريطًا مطاطيًا ويسأل: ما التأثير المشترك للقوة في الحالتين؟<\/p>","t":"يضغط المعلم كرة من الصلصال ويشد شريطًا مطاطيًا ويسأل: ما التأثير المشترك للقوة في الحالتين؟"},{"h":"<div class=\"tot\">مجموع زمن الحصة: 40 دقيقة<\/div><table class=\"t\"><thead><tr><th>الزمن<\/th><th>الخطوة<\/th><th>دور المعلم<\/th><th>دور الطالب<\/th><\/tr><\/thead><tbody><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التهيئة<\/td><td>يعرض الصلصال والشريط.<\/td><td>يستنتجون أن القوة تغير الشكل.<\/td><\/tr><tr><td class=\"tm\">18 د<\/td><td class=\"st\">النشاط 3-4 استقصاء استطالة الزنبرك (كتاب الطالب)<\/td><td>يوجه إلى قياس الطول الأصلي ثم إضافة الأثقال تدريجيًا وقراءة المسطرة بمستوى العين.<\/td><td>يسجلون الطول ويحسبون الاستطالة = الطول − الطول الأصلي لكل ثقل.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">رسم المنحنى<\/td><td>يوجه إلى رسم الاستطالة على المحور الرأسي والثقل على الأفقي.<\/td><td>يرسمون المنحنى ويلاحظون أنه خط مستقيم يمر بنقطة الأصل في بدايته.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">تفسير<\/td><td>يناقش معنى خط مستقيم يمر بنقطة الأصل.<\/td><td>يكتبون استنتاجًا.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"(4 دقائق) التهيئة\nدور المعلم: يعرض الصلصال والشريط.\nدور الطالب: يستنتجون أن القوة تغير الشكل.\n\n(18 دقيقة) النشاط 3-4 استقصاء استطالة الزنبرك (كتاب الطالب)\nدور المعلم: يوجه إلى قياس الطول الأصلي ثم إضافة الأثقال تدريجيًا وقراءة المسطرة بمستوى العين.\nدور الطالب: يسجلون الطول ويحسبون الاستطالة = الطول − الطول الأصلي لكل ثقل.\n\n(10 دقائق) رسم المنحنى\nدور المعلم: يوجه إلى رسم الاستطالة على المحور الرأسي والثقل على الأفقي.\nدور الطالب: يرسمون المنحنى ويلاحظون أنه خط مستقيم يمر بنقطة الأصل في بدايته.\n\n(4 دقائق) تفسير\nدور المعلم: يناقش معنى خط مستقيم يمر بنقطة الأصل.\nدور الطالب: يكتبون استنتاجًا.\n\n(4 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف تحسب استطالة الزنبرك؟<\/td><td>الاستطالة = الطول بعد التحميل − الطول الأصلي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>طول زنبرك 12.0 cm وأصبح 15.5 cm بعد تعليق ثقل. احسب الاستطالة.<\/td><td>3.5 cm.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>علام يدل أن منحنى الاستطالة والثقل خط مستقيم يمر بنقطة الأصل؟<\/td><td>على أن الاستطالة تتناسب طرديًا مع الثقل؛ فمضاعفة الثقل تضاعف الاستطالة.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] كيف تحسب استطالة الزنبرك؟\nالإجابة النموذجية: الاستطالة = الطول بعد التحميل − الطول الأصلي.\n\n2) [المستوى المتوقع] طول زنبرك 12.0 cm وأصبح 15.5 cm بعد تعليق ثقل. احسب الاستطالة.\nالإجابة النموذجية: 3.5 cm.\n\n3) [المستوى المتقدم] علام يدل أن منحنى الاستطالة والثقل خط مستقيم يمر بنقطة الأصل؟\nالإجابة النموذجية: على أن الاستطالة تتناسب طرديًا مع الثقل؛ فمضاعفة الثقل تضاعف الاستطالة."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يمكن للقوة أن تغير ......... الجسم و.........<\/td><td>شكل – حجم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُقرأ المسطرة بمستوى العين؟<\/td><td>لتجنب خطأ زاوية النظر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زنبرك استطال 2 cm بثقل 1 N. تنبأ باستطالته بثقل 4 N مع ذكر الشرط.<\/td><td>8 cm، بشرط ألا يتجاوز حد التناسب.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: يمكن للقوة أن تغير ......... الجسم و.........\nالإجابة النموذجية: شكل – حجم.\n\n2) [المستوى المتوقع] لماذا تُقرأ المسطرة بمستوى العين؟\nالإجابة النموذجية: لتجنب خطأ زاوية النظر.\n\n3) [المستوى المتقدم] زنبرك استطال 2 cm بثقل 1 N. تنبأ باستطالته بثقل 4 N مع ذكر الشرط.\nالإجابة النموذجية: 8 cm، بشرط ألا يتجاوز حد التناسب."},{"h":"<p>مراجعة كتاب الطالب ص 51–53 والإجابة عن السؤالين 8-4 و9-4، وحل الجزء الأول من تمرين 5-4 استطالة زنبرك في كتاب النشاط ص 37–40، وجمع أمثلة لمهن يتغير فيها شكل المواد.<\/p>","t":"مراجعة كتاب الطالب ص 51–53 والإجابة عن السؤالين 8-4 و9-4، وحل الجزء الأول من تمرين 5-4 استطالة زنبرك في كتاب النشاط ص 37–40، وجمع أمثلة لمهن يتغير فيها شكل المواد."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 4-4 استطالة الزنبرك<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع الثامن (25–29/10/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 51–53 | كتاب النشاط: تمرين 5-4 ص 37–40<\/div><div><b>دليل المعلم:<\/b> ص 47–48<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني<\/div><ol class=\"ol\"><li>يصف كيف يمكن أن تغير القوى حجم الجسم وشكله.<\/li><li>يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل.<\/div>","t":"الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني\n1. يصف كيف يمكن أن تغير القوى حجم الجسم وشكله.\n2. يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة.\nمخرج تعليمي آخر: يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل."},{"h":"<div class=\"psub\">الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني<\/div><table class=\"t\"><thead><tr><th>المخرج<\/th><th>المستوى<\/th><\/tr><\/thead><tbody><tr><td>يصف كيف يمكن أن تغير القوى حجم الجسم وشكله.<\/td><td class=\"lv\">فهم<\/td><\/tr><tr><td>يرسم المنحنى البياني للاستطالة بدلالة الثقل ويفسره من خلال تجربة.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><tr><td>يحسب الاستطالة بطرح الطول الأصلي من الطول بعد التحميل.<\/td><td class=\"lv\">تطبيق<\/td><\/tr><\/t  class=\"st\">التهيئة<\/td><td>يعرض الصلصال والشريط.<\/td><td>يستنتجون أن القوة تغير الشكل.<\/td><\/tr><tr><td class=\"tm\">18 د<\/td><td class=\"st\">النشاط 3-4 استقصاء استطالة الزنبرك (كتاب الطالب)<\/td><td>يوجه إلى قياس الطول الأصلي ثم إضافة الأثقال تدريجيًا وقراءة المسطرة بمستوى العين.<\/td><td>يسجلون الطول ويحسبون الاستطالة = الطول − الطول الأصلي لكل ثقل.<\/td><\/tr><tr><td class=\"tm\">10 د<\/td><td class=\"st\">رسم المنحنى<\/td><td>يوجه إلى رسم الاستطالة على المحور الرأسي والثقل على الأفقي.<\/td><td>يرسمون المنحنى ويلاحظون أنه خط مستقيم يمر بنقطة الأصل في بدايته.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">تفسير<\/td><td>يناقش معنى خط مستقيم يمر بنقطة الأصل.<\/td><td>يكتبون استنتاجًا.<\/td><\/tr><tr><td class=\"tm\">4 د<\/td><td class=\"st\">التقويم<\/td><td>يطرح أسئلة التقويم.<\/td><td>يجيبون.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني\n(4 دقائق) التهيئة\nدور المعلم: يعرض الصلصال والشريط.\nدور الطالب: يستنتجون أن القوة تغير الشكل.\n\n(18 دقيقة) النشاط 3-4 استقصاء استطالة الزنبرك (كتاب الطالب)\nدور المعلم: يوجه إلى قياس الطول الأصلي ثم إضافة الأثقال تدريجيًا وقراءة المسطرة بمستوى العين.\nدور الطالب: يسجلون الطول ويحسبون الاستطالة = الطول − الطول الأصلي لكل ثقل.\n\n(10 دقائق) رسم المنحنى\nدور المعلم: يوجه إلى رسم الاستطالة على المحور الرأسي والثقل على الأفقي.\nدور الطالب: يرسمون المنحنى ويلاحظون أنه خط مستقيم يمر بنقطة الأصل في بدايته.\n\n(4 دقائق) تفسير\nدور المعلم: يناقش معنى خط مستقيم يمر بنقطة الأصل.\nدور الطالب: يكتبون استنتاجًا.\n\n(4 دقائق) التقويم\nدور المعلم: يطرح أسئلة التقويم.\nدور الطالب: يجيبون."},{"h":"<div class=\"psub\">الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>كيف تحسب استطالة الزنبرك؟<\/td><td>الاستطالة = الطول بعد التحميل − الطول الأصلي.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>طول زنبرك 12.0 cm وأصبح 15.5 cm بعد تعليق ثقل. احسب الاستطالة.<\/td><td>3.5 cm.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>علام يدل أن منحنى الاستطالة والثقل خط مستقيم يمر بنقطة الأصل؟<\/td><td>على أن الاستطالة تتناسب طرديًا مع الثقل؛ فمضاعفة الثقل تضاعف الاستطالة.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني\n1) [مستوى الدعم] كيف تحسب استطالة الزنبرك؟\nالإجابة النموذجية: الاستطالة = الطول بعد التحميل − الطول الأصلي.\n\n2) [المستوى المتوقع] طول زنبرك 12.0 cm وأصبح 15.5 cm بعد تعليق ثقل. احسب الاستطالة.\nالإجابة النموذجية: 3.5 cm.\n\n3) [المستوى المتقدم] علام يدل أن منحنى الاستطالة والثقل خط مستقيم يمر بنقطة الأصل؟\nالإجابة النموذجية: على أن الاستطالة تتناسب طرديًا مع الثقل؛ فمضاعفة الثقل تضاعف الاستطالة."},{"h":"<div class=\"psub\">الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني<\/div><table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: يمكن للقوة أن تغير ......... الجسم و.........<\/td><td>شكل – حجم.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>لماذا تُقرأ المسطرة بمستوى العين؟<\/td><td>لتجنب خطأ زاوية النظر.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زنبرك استطال 2 cm بثقل 1 N. تنبأ باستطالته بثقل 4 N مع ذكر الشرط.<\/td><td>8 cm، بشرط ألا يتجاوز حد التناسب.<\/td><\/tr><\/tbody><\/table>","t":"الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني\n1) [مستوى الدعم] أكمل: يمكن للقوة أن تغير ......... الجسم و.........\nالإجابة النموذجية: شكل – حجم.\n\n2) [المستوى المتوقع] لماذا تُقرأ المسطرة بمستوى العين؟\nالإجابة النموذجية: لتجنب خطأ زاوية النظر.\n\n3) [المستوى المتقدم] زنبرك استطال 2 cm بثقل 1 N. تنبأ باستطالته بثقل 4 N مع ذكر الشرط.\nالإجابة النموذجية: 8 cm، بشرط ألا يتجاوز حد التناسب."},{"h":"<div class=\"psub\">الحصة 1: استقصاء استطالة الزنبرك ورسم المنحنى البياني<\/div><p>مراجعة كتاب الطالب ص 51–53 والإجابة عن السؤالين 8-4 و9-4، وحل الجزء الأول من تمرين 5-4 استطالة زنبرك في كتاب النشاط سبورة الذكية.\nدور الطالب: يتوقعون.\n\n(10 دقائق) قانون هوك\nدور المعلم: يصوغ: الاستطالة تتناسب طرديًا مع القوة حتى حد التناسب، F = kx، ويشرح وحدة k.\nدور الطالب: يدونون القانون والوحدات.\n\n(10 دقائق) حد التناسب\nدور المعلم: يحدد على المنحنى نقطة حد التناسب ويوضح أن الزنبرك بعدها لا يخضع لقانون هوك.\nدور الطالب: يحددون حد التناسب في منحنيات مختلفة.\n\n(8 دقائق) مسائل (الأسئلة 10-4 إلى 12-4 في كتاب الطالب)\nدور المعلم: يتابع حل المسائل.\nدور الطالب: يحسبون k وF وx.\n\n(7 دقائق) مسابقة المجموعات\nدور المعلم: يدير المسابقة على الدرس.\nدور الطالب: يتنافسون."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>اكتب علاقة قانون هوك وحدد معنى كل رمز.<\/td><td><bdi>F = kx<\/bdi>؛ F القوة (N)، k ثابت الزنبرك (N/m)، x الاستطالة (m).<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>زنبرك ثابته 50 N/m. احسب القوة اللازمة لإطالته 0.04 m.<\/td><td><bdi>F = 50 × 0.04 = 2 N<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زنبرك استطال 3 cm بقوة 6 N. احسب ثابته بوحدة N/cm ثم N/m.<\/td><td><bdi>k = 2 N/cm = 200 N/m<\/bdi>.<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] اكتب علاقة قانون هوك وحدد معنى كل رمز.\nالإجابة النموذجية: F = kx؛ F القوة (N)، k ثابت الزنبرك (N/m)، x الاستطالة (m).\n\n2) [المستوى المتوقع] زنبرك ثابته 50 N/m. احسب القوة اللازمة لإطالته 0.04 m.\nالإجابة النموذجية: F = 50 × 0.04 = 2 N.\n\n3) [المستوى المتقدم] زنبرك استطال 3 cm بقوة 6 N. احسب ثابته بوحدة N/cm ثم N/m.\nالإجابة النموذجية: k = 2 N/cm = 200 N/m."},{"h":"<table class=\"t\"><thead><tr><th>المستوى<\/th><th>السؤال<\/th><th>الإجابة النموذجية<\/th><\/tr><\/thead><tbody><tr><td class=\"ev\">مستوى الدعم<\/td><td>أكمل: النقطة التي لا يعود الجسم عندها خاضعًا لقانون هوك تسمى .........<\/td><td>حد التناسب.<\/td><\/tr><tr><td class=\"ev\">المستوى المتوقع<\/td><td>زنبرك ثابته 25 N/m عُلقت به قوة 5 N. احسب الاستطالة.<\/td><td><bdi>x = 5 ÷ 25 = 0.2 m<\/bdi>.<\/td><\/tr><tr><td class=\"ev\">المستوى المتقدم<\/td><td>زنبركان <bdi>A (k = 40 N/m)<\/bdi> و<bdi>B (k = 80 N/m)<\/bdi>. أيهما أصلب؟ وأيهما يستطيل أكثر بالقوة نفسها؟<\/td><td>B أصلب لأن ثابته أكبر، وA يستطيل أكثر (ضعف استطالة B).<\/td><\/tr><\/tbody><\/table>","t":"1) [مستوى الدعم] أكمل: النقطة التي لا يعود الجسم عندها خاضعًا لقانون هوك تسمى .........\nالإجابة النموذجية: حد التناسب.\n\n2) [المستوى المتوقع] زنبرك ثابته 25 N/m عُلقت به قوة 5 N. احسب الاستطالة.\nالإجابة النموذجية: x = 5 ÷ 25 = 0.2 m.\n\n3) [المستوى المتقدم] زنبركان A (k = 40 N/m) وB (k = 80 N/m). أيهما أصلب؟ وأيهما يستطيل أكثر بالقوة نفسها؟\nالإجابة النموذجية: B أصلب لأن ثابته أكبر، وA يستطيل أكثر (ضعف استطالة B)."},{"h":"<p>حل الأسئلة 10-4 إلى 12-4 وأسئلة نهاية الوحدة الرابعة في كتاب الطالب ص 54–57، وإكمال تمرين 5-4 استطالة زنبرك في كتاب النشاط ص 37–40.<\/p>","t":"حل الأسئلة 10-4 إلى 12-4 وأسئلة نهاية الوحدة الرابعة في كتاب الطالب ص 54–57، وإكمال تمرين 5-4 استطالة زنبرك في كتاب النشاط ص 37–40."}]}],"comb":{"info":"<div><b>الدرس:<\/b> 5-4 قانون هوك<\/div><div><b>الوحدة:<\/b> الوحدة الرابعة: تأثيرات القوى<\/div><div><b>الأسبوع والتاريخ:<\/b> الأسبوع التاسع (1–5/11/2026)<\/div><div><b>عدد الحصص:<\/b> حصة واحدة<\/div><div><b>صفحات الكتاب:<\/b> كتاب الطالب ص 54–57 | كتاب النشاط: تمرين 5-4 ص 37–40<\/div><div><b>دليل المعلم:<\/b> ص 48<\/div>","fields":[{"h":"<div class=\"psub\">الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب<\/div><ol class=\"ol\"><li>يذكر قانون هوك ويستخدم العلاقة <bdi>F = kx<\/bdi>.<\/li><li>يستخدم وحدات ثابت الزنبرك (N/m أو N/cm).<\/li><li>يذكر مصطلح حد التناسب ويستخدمه.<\/li><\/ol><div class=\"extra\"><b>مخرج تعليمي آخر:<\/b> يحدد حد التناسب من منحنى القوة والاستطالة.<\/div>","t":"الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب\n1. يذكر قانون هوك ويستخدم العلاقة F = kx.\n2. يستخدم وحدات ثابت الزنبرك (N/m أو N/cm).\n3. يذكر مصطلح حد التناسب ويستخدمه.\nمخرج تعليمي آخر: يحدد حد التناسب من منحنى القوة والاستطالة."},{"h":"<div class=\"psub\">الحصة 1: قانون هوك وثابت الزنبرك وحد التناسب<\/div><table class=\"t\"><thead><tr>
