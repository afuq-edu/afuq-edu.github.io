:root{--bg:#f6f9fc;--card:#fff;--line:#d9e5f0;--pri:#2f5f8f;--soft:#eaf2fb;--ok:#3f7a5a;--okbg:#e6f4ea;--txt:#24324a;--mut:#6b7c93}
*{box-sizing:border-box}
body{margin:0;font-family:T,Tahoma,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
header{background:var(--soft);border-bottom:1px solid #c9dcf0;padding:14px 16px}
h1{margin:0;font-size:1.15rem;color:var(--pri)}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.mode{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.mode button{font:inherit;font-weight:700;border:1.5px solid #b7cde3;background:#fff;color:var(--pri);border-radius:22px;padding:7px 18px;cursor:pointer}
.mode button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.explain{font-size:.88rem;color:var(--mut);margin:4px 0}
.now{display:inline-block;margin-top:6px;background:var(--okbg);color:var(--ok);border:1px solid #bfe0c9;border-radius:10px;padding:4px 12px;font-weight:700;font-size:.92rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:260px;max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--pri)}
.tabs button.on{background:var(--soft);border-color:#9fbedc;font-weight:700}
.meta{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;color:var(--mut);margin-bottom:12px}
.meta b{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;background:#f2f7fc;border-bottom:1px solid var(--line);padding:8px 12px}
.ch h3{margin:0;font-size:1rem;color:var(--pri)}
.ch .no{display:inline-block;width:24px;height:24px;line-height:25px;text-align:center;border-radius:50%;background:#fff;border:1px solid #b7cde3;margin-left:6px;font-size:.85rem}
.cp{font:inherit;font-weight:700;background:#fff;border:1.5px solid #9fbedc;color:var(--pri);border-radius:10px;padding:4px 16px;cursor:pointer;min-width:105px}
.cp.done{background:var(--okbg);border-color:#9fd1b0;color:var(--ok)}
pre{margin:0;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:.95rem}
.fb{display:none;padding:8px 12px;border-top:1px dashed var(--line);background:#fffdf5}
.fb textarea{width:100%;min-height:140px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.fb small{color:var(--mut)}
</style>
</head>

ؤسسة عمانية وإصدار حكم عليه\n1. الشعار\n2. الهوية البصرية\n3. التناسب الشكلي الخطي", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية\nالتعلم القبلي: رسم عناصر البيئة بأسلوب واقعي في الصفوف السابقة.\n\nالتهيئة:\n- المعلم: يعرض صورة واقعية لنخلة وبجانبها نخلة محورة إلى خطوط ومساحات ويسأل: هل ما زالت نخلة؟ ما الذي تغير؟\n- الطالب: يقارن بين الصورتين ويذكر ما حُذف وما بقي.\n\nالحصة 2: تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي\nالتعلم القبلي: مفهوم التحوير وطرقه.\n\nالتهيئة:\n- المعلم: يرسم دلة بخط خارجي فقط ويسأل: ما أقل عدد من الخطوط يكفي للتعرف عليها؟\n- الطالب: يقترح خطوطًا أساسية تحفظ هيئتها.\n\nالحصة 3: توظيف الشكل المحور هويةً أو شعارًا لمؤسسة عمانية وإصدار حكم عليه\nالتعلم القبلي: الشكل المحور من عنصر عماني.\n\nالتهيئة:\n- المعلم: يعرض شعارات مؤسسات عمانية مستوحاة من التراث ويسأل: ما العنصر المحور في كل شعار؟\n- الطالب: يتعرف العناصر المحورة ويربطها بالمؤسسة.", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورة واقعية لنخلة وبجانبها نخلة محورة إلى خطوط ومساحات ويسأل: هل ما زالت نخلة؟ ما الذي تغير؟\n- الطالب: يقارن بين الصورتين ويذكر ما حُذف وما بقي.\n\nمفهوم التحوير (10 دقائق):\n- المعلم: يوضح أن التحوير تغيير هيئة العنصر بالتبسيط أو المبالغة أو التحويل إلى خطوط ومساحات مع الإبقاء على ما يدل عليه.\n- الطالب: يصوغ تعريف التحوير بلغته.\n\nتحليل أعمال تجريدية (12 دقيقة):\n- المعلم: يعرض أعمالًا من المدرسة التجريدية ويطلب من المجموعات تحديد العنصر الأصلي وطريقة تحويره.\n- الطالب: يحلل الأعمال ويدوّن المعالجات (تبسيط، تكرار، تحويل إلى مساحات هندسية).\n\nخريطة ذهنية (8 دقائق):\n- المعلم: يبني مع الطلبة خريطة ذهنية لطرق التحوير.\n- الطالب: يكمل فروع الخريطة.\n\nالختام (5 دقائق):\n- المعلم: يوجه كل طالب لاختيار عنصر عماني سيحوره.\n- الطالب: يحدد عنصره (خنجر، فخار، نخلة، باب…).\n\nالحصة 2: تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي\nالتهيئة (5 دقائق):\n- المعلم: يرسم دلة بخط خارجي فقط ويسأل: ما أقل عدد من الخطوط يكفي للتعرف عليها؟\n- الطالب: يقترح خطوطًا أساسية تحفظ هيئتها.\n\nالنمذجة (5 دقائق):\n- المعلم: ينمذج تحوير عنصر خطوة بخطوة: الهيئة، التبسيط، التقسيم إلى مساحات، إضافة الملامس.\n- الطالب: يتابع الخطوات.\n\nرسم الهيئة (10 دقائق):\n- المعلم: يتابع رسم الهيئة الخارجية بحجم مناسب للمساحة.\n- الطالب: يرسم الهيئة الخارجية لعنصره.\n\nالتحوير (15 دقيقة):\n- المعلم: يوجه إلى تنويع السماكات والمساحات بتناسب.\n- الطالب: يحور العنصر إلى خطوط ومساحات وملامس.\n\nالختام (5 دقائق):\n- المعلم: يعرض أعمالًا ويسأل عن تحقق التناسب.\n- الطالب: يعرض عمله ويستمع للتغذية الراجعة.\n\nالحصة 3: توظيف الشكل المحور هويةً أو شعارًا لمؤسسة عمانية وإصدار حكم عليه\nالتهيئة (5 دقائق):\n- المعلم: يعرض شعارات مؤسسات عمانية مستوحاة من التراث ويسأل: ما العنصر المحور في كل شعار؟\n- الطالب: يتعرف العناصر المحورة ويربطها بالمؤسسة.\n\nتحليل الشعارات (8 دقائق):\n- المعلم: يوضح خصائص الشعار الجيد (البساطة، سهولة التذكر، الدلالة).\n- الطالب: يحدد الخصائص في الأمثلة.\n\nتصميم الشعار (17 دقيقة):\n- المعلم: يطلب اختيار مؤسسة (افتراضية أو حقيقية) وتطويع الشكل المحور ليصبح شعارًا مع اسمها؛ ويمكن الاستعانة بتطبيق Canva المرخص.\n- الطالب: يصمم شعارًا من شكله المحور ويضيف الاسم.\n\nالختام (10 دقائق):\n- المعلم: ينظم عرضًا وإصدار أحكام على التغيرات البصرية والتناسب.\n- الطالب: يعرض شعاره ويحكم على أعمال زملائه.", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية\nس1 (مستوى الدعم): ما المقصود بالتحوير؟\nالإجابة: تغيير هيئة العنصر الطبيعي بالتبسيط أو المبالغة أو التحويل إلى خطوط ومساحات مع بقاء ما يدل عليه.\n\nس2 (المستوى المتوقع): ما علاقة التحوير بالتجريد؟\nالإجابة: التجريد مرحلة متقدمة من التحوير يُختزل فيها الشكل إلى عناصره الأساسية.\n\nس3 (المستوى المتقدم): لماذا يلجأ المصمم إلى التحوير بدل الرسم الواقعي في الشعارات؟\nالإجابة: لأن الشكل المحور أبسط وأسهل تذكرًا وأكثر ملاءمة للطباعة والتكرار.\n\nالحصة 2: تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي\nس1 (مستوى الدعم): ما الخطوة الأولى في تحوير العنصر؟\nالإجابة: رسم الهيئة الخارجية له.\n\nس2 (المستوى المتوقع وينات في مشروع صغير.\n- الطالب: يقترح فكرة مشروع (طباعة على أكواب، بطاقات…).\n\nالختام (5 دقائق):\n- المعلم: يوجه للحفاظ على التكوين لتلوينه في الدرس القادم.\n- الطالب: يحفظ تكوينه.", "الحصة 1: تطبيق أسس بناء العمل الفني بالورق الملون وقصاصات الجرائد والمجلات\nس1 (مستوى الدعم): سمِّ ثلاثة من أسس بناء العمل الفني.\nالإجابة: الوحدة والاتزان والإيقاع.\n\nس2 (المستوى المتوقع): كيف يتحقق الإيقاع بالقصاصات؟\nالإجابة: بتكرار الأشكال بانتظام أو بتدرج.\n\nس3 (المستوى المتقدم): حلل كيف تحققت السيادة في عمل مجموعة أخرى.\nالإجابة: تحليل يذكر العنصر المسيطر بالحجم أو اللون أو الموقع.\n\nالحصة 2: رسم الشكل المحور معتمدًا على أحد أساسيات بناء العمل الفني\nس1 (مستوى الدعم): ما الأساس الذي اخترته لرسمك؟\nالإجابة: إجابة شخصية صحيحة.\n\nس2 (المستوى المتوقع): كيف يحقق التكرار المتدرج إحساسًا بالعمق؟\nالإجابة: بتصغير الشكل تدريجيًا فيبدو مبتعدًا.\n\nس3 (المستوى المتقدم): استنتج الأساس المطبق في عمل زميلك.\nالإجابة: إجابة صحيحة بدليل.\n\nالحصة 3: رسم تكوين من الشكل المحور قائم على أسس بناء العمل الفني وتوليد أفكار لمشروع صغير\nس1 (مستوى الدعم): ما الذي يميز التكوين عن الشكل المفرد؟\nالإجابة: تنظيم عدة وحدات مع الأرضية وفق أسس البناء.\n\nس2 (المستوى المتوقع): كيف تحقق الوحدة في التكوين؟\nالإجابة: بتكرار الشكل المحور وتوحيد الأسلوب.\n\nس3 (المستوى المتقدم): اقترح معالجة تطور تكوين زميل.\nالإجابة: مثال: تحقيق السيادة بتكبير وحدة مركزية.", "الحصة 1: تطبيق أسس بناء العمل الفني بالورق الملون وقصاصات الجرائد والمجلات\nس1 (مستوى الدعم): ما الأساس الذي طبقته مجموعتك؟\nالإجابة: إجابة صحيحة.\n\nس2 (المستوى المتوقع): اشرح الفرق بين الاتزان المتماثل وغير المتماثل.\nالإجابة: المتماثل تطابق الجانبين، وغير المتماثل تعادل الوزن البصري دون تطابق.\n\nس3 (المستوى المتقدم): اقترح أساسًا يناسب عملًا عن «الحركة» وعلل.\nالإجابة: الإيقاع؛ لأنه يوحي بالتتابع والحركة.\n\nالحصة 2: رسم الشكل المحور معتمدًا على أحد أساسيات بناء العمل الفني\nس1 (مستوى الدعم): عرّف التناسب في العمل الفني.\nالإجابة: حالة من التعادل والتوازن في توزيع الوحدات الشكلية مع الأرضية.\n\nس2 (المستوى المتوقع): قارن بين عملك وعمل زميل من حيث التن جموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\n1. الانسجام اللوني\n2. الشكل والأرضية\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\n1. التضاد اللوني\n2. الإخراج النهائي\n3. العلاقات الجمالية للألوان", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nالتعلم القبلي: دائرة الألوان والألوان الأساسية والثانوية.\n\nالتهيئة:\n- المعلم: يعرض عملين لفنانين عمانيين أحدهما بألوان حارة والآخر بباردة ويسأل: بماذا يشعرك كل عمل؟\n- الطالب: يربط الألوان بالإحساس.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nالتعلم القبلي: الوحدة الملونة بمجموعة لونية.\n\nالتهيئة:\n- المعلم: يسأل: إذا لونت الأرضية بمجموعة مختلفة تمامًا عن الشكل، فماذا يحدث؟\n- الطالب: يتوقع التنافر أو الانسجام.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nالتعلم القبلي: التكوين الملون بانسجام.\n\nالتهيئة:\n- المعلم: يعرض شكلًا أصفر على أرضية بنفسجية ويسأل: لماذا يبدو الشكل بارزًا؟\n- الطالب: يستنتج دور التضاد.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nالتهيئة (5 دقائق):\n- المعلم: يعرض عملين لفنانين عمانيين أحدهما بألوان حارة والآخر بباردة ويسأل: بماذا يشعرك كل عمل؟\n- الطالب: يربط الألوان بالإحساس.\n\nتحليل المجموعات اللونية (10 دقائق):\n- المعلم: يعرض دائرة الألوان ويحدد المجموعات (المتجانسة، المتضادة، الحارة، الباردة) في الأعمال.\n- الطالب: يحدد المجموعة اللونية لكل عمل.\n\nنمذجة (5 دقائق):\n- المعلم: ينمذج تلوين وحدة بمجموعة متجانسة وأخرى متضادة.\n- الطالب: يقارن النتيجتين.\n\nتلوين الوحدة (17 دقيقة):\n- المعلم: يتابع اختيار المجموعة وتلوين الوحدة.\n- الطالب: يلون وحدته الشكلية بالمجموعة المختارة.\n\nالختام (3 دقائق):\n- المعلم: يطلب تبرير الاختيار.\n- الطالب: يبرر اختيار مجموعته.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nالتهيئة (5 دقائق):\n- المعلم: يسأل: إذا لونت الأرضية بمجموعة مختلفة تمامًا عن الشكل، فماذا يحدث؟\n- الطالب: يتوقع التنافر أو الانسجام.\n\nالخطوات (5 دقائق):\n- المعلم: يوضح خطوات التلوين: الوحدات الرئيسة، الأرضية، الربط اللوني.\n- الطالب: يدون الخطوات.\n\nالتلوين (25 دقيقة):\n- المعلم: يتابع التلوين ويوجه إلى الانسجام بين الوحدات.\n- الطالب: يلون التكوين بالمجموعة المختارة.\n\nالختام (5 دقائق):\n- المعلم: يعرض أعمالًا تحقق الانسجام.\n- الطالب: يتأمل الأعمال.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nالتهيئة (5 دقائق):\n- المعلم: يعرض شكلًا أصفر على أرضية بنفسجية ويسأل: لماذا يبدو الشكل بارزًا؟\n- الطالب: يستنتج دور التضاد.\n\nالإخراج (18 دقيقة):\n- المعلم: يوجه إلى إبراز الشكل بالتضاد مع الأرضية مع الحفاظ على الانسجام.\n- الطالب: يُخرج عمله بلمسات التضاد النهائية.\n\nإصدار الحكم (10 دقائق):\n- المعلم: ينظم عرضًا وتقييمًا جماعيًا.\n- الطالب: يشارك في إصدار الأحكام.\n\nالختام (7 دقائق):\n- المعلم: يناقش مقترحات تلوين مرافق المدرسة (المكتبة، المقصف، الممرات).\n- الطالب: يقترح مجموعة لونية لمرفق ويعللها.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nس1 (مستوى الدعم): ما الألوان المتضادة؟\nالإجابة: الألوان المتقابلة في دائرة الألوان، مثل الأحمر والأخضر.\n\nس2 (المستوى المتوقع): بماذا توحي الألوان الحارة؟\nالإجابة: بالدفء والحيوية والحركة.\n\nس3 (المستوى المتقدم): لماذا يختار الفنان مجموعة لونية محددة لعمله؟\nالإجابة: لتحقيق الانسجام ونقل إحساس معين.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nس1 (مستوى الدعم): عرّف الانسجام اللوني.\nالإجابة: التآلف بين ألوان الوحدات الشكلية والأرضية في مساحة العمل.\n\nس2 (المستوى المتوقع): رتب خطوات تلوين التكوين.\nالإجابة: الوحدات الرئيسة، ثم الأرضية، ثم اللمسات الرابطة.\n\nس3 (المستوى المتقدم): كيف يحقق تكرار لون في أجزاء متفرقة انسجامًا؟\nالإجابة: يربط أجزاء العمل بصريًا.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nس1 (مستوى الدعم): ما وظيفة التضاد اللوني بين الشكل والأرضية؟\nالإجابة: إبراز الشكل وجذب الانتباه إليه.\n\nس2 (المستوى المتوقع): كيف تجمع بين الانسجام والتضاد في عمل واحد؟\nالإجابة: بالانسجام داخل الوحدات والتضاد بينها وبين الأرضية.\n\nس3 (المستوى المتقدم): اقترح ألوانًا لمكتبة المدرسة وعلل.\nالإجابة: ألوان باردة هادئة لأنها توحي بالسكينة وتساعد على التركيز.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nس1 (مستوى الدعم): اذكر لونين متجانسين.\nالإجابة: الأزرق والأخضر (أو الأصفر والبرتقالي).\n\nس2 (المستوى المتوقع): ما المجموعة التي لونت بها وحدتك؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس3 (المستوى المتقدم): اقترح مجموعة لونية لتكوين عن الصيف العماني وعلل.\nالإجابة: الألوان الحارة؛ لأنها توحي بالحرارة والإشراق.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nس1 (مستوى الدعم): ما الخامة المستخدمة في التلوين؟\nالإجابة: الألوان المائية.\n\nس2 (المستوى المتوقع): صف كيف حققت الانسجام في تكوينك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيم مدى انسجام ألوان عمل زميل.\nالإجابة: تقييم معلل.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nس1 (مستوى الدعم): اذكر قيمتين لونيتين حققتهما في عملك.\nالإجابة: الانسجام اللوني والتضاد اللوني.\n\nس2 (المستوى المتوقع): أصدر حكمًا على عملك بناء على القيمتين.\nالإجابة: حكم معلل.\n\nس3 (المستوى المتقدم): اقترح خطة تلوين لممر المدرسة.\nالإجابة: خطة تحدد المجموعة اللونية ومواضعها مع التعليل.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nإرشاد للطالب: يلاحظ المجموعات اللونية في الملابس والمباني.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة تناسق الألوان.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 26–27.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nإرشاد للطالب: يتأمل لوحات فنانين عمانيين.\nإرشاد لولي الأمر: يتابع مع ابنه عمله الفني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 27.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nإرشاد للطالب: يحتفظ بعمله في ملف إنجازه.\nإرشاد لولي الأمر: يحاور ابنه حول ألوان غرف المنزل وأثرها.\nالمرجع: دليل المعلم (الفنون التشكي ي المجسم وتقويمه واقتراح تسويقه\nالتعلم القبلي: القطع الكرتونية المعالجة.\n\nالتهيئة:\n- المعلم: يسأل: ما الترتيب الصحيح لتجميع أجزاء المنتج؟\n- الطالب: يقترح تسلسل التجميع.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nالتهيئة (5 دقائق):\n- المعلم: يعرض صورًا لوحدة إضاءة كرتونية مزخرفة ويسأل: كيف يتحول الكرتون المهمل إلى منتج جميل؟\n- الطالب: يقترح معالجات (تفريغ، طبقات).\n\nأنواع الزخارف (10 دقائق):\n- المعلم: يعرض نماذج ويصنف مع الطلبة: نباتية، حيوانية، كتابية، هندسية، ويوضح قواعد التكرار والتماثل والتبادل.\n- الطالب: يصنف النماذج.\n\nاختيار المنتج والوحدة (10 دقائق):\n- المعلم: يوجه كل مجموعة لاختيار منتج ووحدة زخرفية مناسبة.\n- الطالب: تختار المجموعة المنتج والوحدة.\n\nتحديد المساحات (12 دقيقة):\n- المعلم: يتابع رسم أجزاء المنتج على الكرتون بالقياس.\n- الطالب: يحدد مساحة كل جزء على الكرتون.\n\nالختام (3 دقائق):\n- المعلم: يراجع خطط المجموعات.\n- الطالب: تعرض المجموعة خطتها.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nالتهيئة (5 دقائق):\n- المعلم: يعرض قطعة كرتون أزيلت طبقتها الخارجية جزئيًا ويسأل: ما الملمس الذي ظهر؟\n- الطالب: يلاحظ الملمس المضلع (الغائر) مقابل السطح الأملس (البارز).\n\nالنقل (8 دقائق):\n- المعلم: يتابع نقل الوحدة الزخرفية بالورق الشفاف.\n- الطالب: ينقل التصميم إلى الكرتون.\n\nالنمذجة (7 دقائق):\n- المعلم: ينمذج إزالة الطبقة الخارجية والتفريغ بأمان.\n- الطالب: يتابع ويجرب على قطعة تدريبية.\n\nالمعالجة (17 دقيقة):\n- المعلم: يتابع التنفيذ ويوجه.\n- الطالب: ينفذ المعالجات على أجزاء المنتج.\n\nالختام (3 دقائق):\n- المعلم: يجمع القطع وينظف المكان.\n- الطالب: يحفظ القطع.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nالتهيئة (5 دقائق):\n- المعلم: يسأل: ما الترتيب الصحيح لتجميع أجزاء المنتج؟\n- الطالب: يقترح تسلسل التجميع.\n\nالتجميع والإخراج (18 دقيقة):\n- المعلم: يتابع التجميع ويشرف على استخدام مسدس الشمع.\n- الطالب: يجمع القطع ويخرج المنتج.\n\nالتقويم (9 دقائق):\n- المعلم: ينظم عرضًا وتقويمًا وفق التنوع الزخرفي الملمسي.\n- الطالب: يقوم المنتجات.\n\nالختام (8 دقائق):\n- المعلم: يقود نقاشًا حول تسويق منتجات الكرتون (أسعار، متاجر إلكترونية).\n- الطالب: يقترح فكرة تسويقية.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nس1 (مستوى الدعم): سمِّ أربعة أنواع من الزخارف.\nالإجابة: نباتية، حيوانية، كتابية، هندسية.\n\nس2 (المستوى المتوقع): ما قاعدة التبادل في الزخرفة؟\nالإجابة: تكرار وحدتين مختلفتين بالتناوب.\n\nس3 (المستوى المتقدم): لماذا تختلف الوحدة المناسبة لوحدة الإضاءة عن رف الكتب؟\nالإجابة: لأن وحدة الإضاءة تحتاج تفريغًا يمرر الضوء، والرف يحتاج زخرفة سطحية لا تضعف متانته.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nس1 (مستوى الدعم): ما المقصود بالغائر في الكرتون؟\nالإجابة: الأجزاء المنخفضة عن السطح الناتجة عن إزالة الطبقة.\n\nس2 (المستوى المتوقع): لماذا ننقل التصميم بالورق الشفاف؟\nالإجابة: لضمان الدقة والتناسب مع المساحة.\n\nس3 (المستوى المتقدم): كيف تحقق التنوع الملمسي بالكرتون وحده؟\nالإجابة: بالمزج بين السطح الأملس والمضلع والمفرغ.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nس1 (مستوى الدعم): ما الأداة المستخدمة في تجميع القطع؟\nالإجابة: مسدس الشمع.\n\nس2 (المستوى المتوقع): ما القيمة الفنية للدرس؟\nالإجابة: التنوع الزخرفي الملمسي.\n\nس3 (المستوى المتقدم): اقترح فكرة ابتكارية لمنتج كرتوني يباع في السوق.\nالإجابة: مثال: وحدات إضاءة مزخرفة بطابع عماني.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nس1 (مستوى الدعم): ما المنتج الذي اختارته مجموعتك؟\nالإجابة: إجابة شخصية.\n\nس2 (المستوى المتوقع): صنف الوحدة الزخرفية التي اخترتها.\nالإجابة: إجابة صحيحة.\n\nس3 (المستوى المتقدم): اقترح قاعدة زخرفية تناسب منتجك وعلل.\nالإجابة: إجابة معللة.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nس1 (مستوى الدعم): اذكر معالجتين للكرتون.\nالإجابة: إزالة الطبقة الخارجية والتفريغ.\n\nس2 (المستوى المتوقع): صف تحقق التناسب بين الشكل والأرضية في قطعتك.\nالإجابة: إجابة شخصية.\n\nس3 (المستوى المتقدم): قيم دقة تنفيذ المعالجات واقترح تحسينًا.\nالإجابة: تقييم معلل.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nس1 (مستوى الدعم): اذكر قاعدة سلامة عند استخدام مسدس الشمع.\nالإجابة: عدم لمس الطرف الساخن والشمع المذاب.\n\nس2 (المستوى المتوقع): قيم منتج مجموعتك.\nالإجابة: تقييم معلل.\n\nس3 (المستوى المتقدم): صمم خطة تسويق مختصرة لمنتجك.\nالإجابة: الفئة المستهدفة، السعر، قناة البيع.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nإرشاد للطالب: يتأمل الزخارف في المساجد والقلاع العمانية.\nإرشاد لولي الأمر: يشجع ابنه على إعادة تدوير الكرتون.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 35–36.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nإرشاد للطالب: يلاحظ طبقات الكرتون المضلع في العلب المنزلية.\nإرشاد لولي الأمر: يتابع التزام ابنه بالسلامة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 36–37.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nإرشاد للطالب: يعرض منتجه على أسرته.\nإرشاد لولي الأمر: يشجع ابنه على تحويل أفكاره إلى منتجات.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 37."]}];
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
