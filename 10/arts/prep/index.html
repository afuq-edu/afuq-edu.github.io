قصود بالتحوير؟\nالإجابة: تغيير هيئة العنصر الطبيعي بالتبسيط أو المبالغة أو التحويل إلى خطوط ومساحات مع بقاء ما يدل عليه.\n\nس2 (مستوى التطبيق): ما علاقة التحوير بالتجريد؟\nالإجابة: التجريد مرحلة متقدمة من التحوير يُختزل فيها الشكل إلى عناصره الأساسية.\n\nس3 (مستوى الاستدلال): لماذا يلجأ المصمم إلى التحوير بدل الرسم الواقعي في الشعارات؟\nالإجابة: لأن الشكل المحور أبسط وأسهل تذكرًا وأكثر ملاءمة للطباعة والتكرار.", "س1 (مستوى المعرفة): اذكر طريقتين لتحوير العنصر.\nالإجابة: التبسيط، والتحويل إلى مساحات هندسية (أو التكرار والمبالغة).\n\nس2 (مستوى التطبيق): حلل كيف حُوّرت النخلة في المثال المعروض.\nالإجابة: تحولت السعفات إلى خطوط مائلة متكررة والجذع إلى مستطيل مملوء بملمس.\n\nس3 (مستوى الاستدلال): اقترح عنصرًا عمانيًا يصلح للتحوير وعلل.\nالإجابة: مثال: الدلة؛ لأن هيئتها مميزة وتُعرف حتى بعد التبسيط.", "إرشاد للطالب: يتأمل عناصر البيئة العمانية ويختار عنصرًا مميزًا لتحويره.\nإرشاد لولي الأمر: يتحاور مع ابنه حول الرموز العمانية التراثية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 21–22.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/10/arts/?l=1"]}, {"ax": "تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي", "n": 2, "w": "الأسبوع الثاني: من 13/9/2026 إلى 17/9/2026", "pg": "23", "f": ["1. يرسم الهيئة الخارجية لعنصر من البيئة العمانية (15 دقيقة)\n2. يحور العنصر إلى خطوط أو مساحات أو ملامس محققًا قيمة التناسب الشكلي الخطي (15 دقيقة)\nمخرج آخر: يبدي حرصًا على الدقة والإتقان (10 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: إبداع\nالمخرج 3: تقييم", "1. التعلم الذاتي\n2. التعلم بالنمذجة\n3. التعلم بالممارسة العملية", "1. صورة توضيحية\n2. الأقلام\n3. أخرى: صور لعناصر عمانية، أوراق رسم", "1. الهيئة الخارجية\n2. التناسب الشكلي الخطي\n3. الخط والمساحة والملمس", "التعلم القبلي: مفهوم التحوير وطرقه.\nيرسم المعلم دلة بخط خارجي فقط ويسأل: ما أقل عدد من الخطوط يكفي للتعرف عليها؟ ويقترح الطالب خطوطًا أساسية تحفظ هيئتها.", "1. التهيئة: يرسم المعلم دلة بخط خارجي فقط ويسأل: ما أقل عدد من الخطوط يكفي للتعرف عليها؟ ويقترح الطالب  بالمؤسسة.", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورة واقعية لنخلة وبجانبها نخلة محورة إلى خطوط ومساحات ويسأل: هل ما زالت نخلة؟ ما الذي تغير؟ ويقارن الطالب بين الصورتين ويذكر ما حُذف وما بقي (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. مفهوم التحوير: يوضح المعلم أن التحوير تغيير هيئة العنصر بالتبسيط أو المبالغة أو التحويل إلى خطوط ومساحات مع الإبقاء على ما يدل عليه، ويصوغ الطالب تعريف التحوير بلغته (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحليل أعمال تجريدية: يعرض المعلم أعمالًا من المدرسة التجريدية ويطلب من المجموعات تحديد العنصر الأصلي وطريقة تحويره، ويحلل الطالب الأعمال ويدوّن المعالجات (تبسيط، تكرار، تحويل إلى مساحات هندسية) (12 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. خريطة ذهنية: يبني المعلم مع الطلبة خريطة ذهنية لطرق التحوير، ويكمل الطالب فروع الخريطة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يوجه كل طالب لاختيار عنصر عماني سيحوره، ويحدد الطالب عنصره (خنجر، فخار، نخلة، باب…) (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي — زمن الحصة 40 دقيقة\n\n1. التهيئة: يرسم المعلم دلة بخط خارجي فقط ويسأل: ما أقل عدد من الخطوط يكفي للتعرف عليها؟ ويقترح الطالب خطوطًا أساسية تحفظ هيئتها (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. النمذجة: ينمذج المعلم تحوير عنصر خطوة بخطوة: الهيئة، التبسيط، التقسيم إلى مساحات، إضافة الملامس، ويتابع الطالب الخطوات (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. رسم الهيئة: يتابع المعلم رسم الهيئة الخارجية بحجم مناسب للمساحة، ويرسم الطالب الهيئة الخارجية لعنصره (10 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. التحوير: يوجه المعلم إلى تنويع السماكات والمساحات بتناسب، ويحور الطالب العنصر إلى خطوط ومساحات وملامس (15 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n5. الختام: يعرض المعلم أعمالًا ويسأل عن تحقق التناسب، ويعرض الطالب عمله ويستمع للتغذية الراجعة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: توظيف الشكل المحور هويةً أو شعارًا لمؤسسة عمانية وإصدار حكم عليه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم شعارات مؤسسات عمانية مستوحاة من التراث ويسأل: ما العنصر المحور في كل شعار؟ ويتعرف الطالب العناصر المحورة ويربطها بالمؤسسة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تحليل الشعارات: يوضح المعلم خصائص الشعار الجيد (البساطة، سهولة التذكر، الدلالة)، ويحدد الطالب الخصائص في الأمثلة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. تصميم الشعار: يطلب المعلم اختيار مؤسسة (افتراضية أو حقيقية) وتطويع الشكل المحور ليصبح شعارًا مع اسمها؛ ويمكن الاستعانة بتطبيق Canva المرخص، ويصمم الطالب شعارًا من شكله المحور ويضيف الاسم (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: ينظم المعلم عرضًا وإصدار أحكام على التغيرات البصرية والتناسب، ويعرض الطالب شعاره ويحكم على أعمال زملائه (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – تحوير من بيئتي: تختار كل مجموعة عنصرًا من البيئة العمانية (سعفة نخيل، دلة القهوة، وردة الجبل الأخضر) وتحوّره في ثلاث خطوات سريعة نحو التجريد، ثم يشرح متحدثها المعالجة الفنية التي استخدمتها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية\nس1 (مستوى المعرفة): ما المقصود بالتحوير؟\nالإجابة: تغيير هيئة العنصر الطبيعي بالتبسيط أو المبالغة أو التحويل إلى خطوط ومساحات مع بقاء ما يدل عليه.\n\nس2 (مستوى التطبيق): ما علاقة التحوير بالتجريد؟\nالإجابة: التجريد مرحلة متقدمة من التحوير يُختزل فيها الشكل إلى عناصره الأساسية.\n\nس3 (مستوى الاستدلال): لماذا يلجأ المصمم إلى التحوير بدل الرسم الواقعي في الشعارات؟\nالإجابة: لأن الشكل المحور أبسط وأسهل تذكرًا وأكثر ملاءمة للطباعة والتكرار.\n\nالحصة 2: تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي\nس1 (مستوى المعرفة): ما الخطوة الأولى في تحوير العنصر؟\nالإجابة: رسم الهيئة الخارجية له.\n\nس2 (مستوى التطبيق): كيف تحقق التناسب الشكلي الخطي في الشكل المحور؟\nالإجابة: بتنويع سماكة الخطوط وأحجام المساحات بما يتناسب مع أجزاء الشكل.\n\nس3 (مستوى الاستدلال): اقترح تعديلًا يزيد التحوير دون أن يفقد العنصر دلالته.\nالإجابة: حذف التفاصيل الصغيرة والإبقاء على الخطوط المميزة للهيئة.\n\nالحصة 3: توظيف الشكل المحور هويةً أو شعارًا لمؤسسة عمانية وإصدار حكم عليه\nس1 (مستوى المعرفة): اذكر خاصيتين للشعار الجيد.\nالإجابة: البساطة وسهولة التذكر.\n\nس2 (مستوى التطبيق): لماذا يناسب الشكل المحور تصميم الشعارات؟\nالإجابة: لبساطته ووضوحه ودلالته على الهوية.\n\nس3 (مستوى الاستدلال): اقترح مؤسسة يناسبها شكلك المحور وعلل.\nالإجابة: إجابة معللة تربط دلالة العنصر بنشاط المؤسسة.", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية\nس1 (مستوى المعرفة): اذكر طريقتين لتحوير العنصر.\nالإجابة: التبسيط، والتحويل إلى مساحات هندسية (أو التكرار والمبالغة).\n\nس2 (مستوى التطبيق): حلل كيف حُوّرت النخلة في المثال المعروض.\nالإجابة: تحولت السعفات إلى خطوط مائلة متكررة والجذع إلى مستطيل مملوء بملمس.\n\nس3 (مستوى الاستدلال): اقترح عنصرًا عمانيًا يصلح للتحوير وعلل.\nالإجابة: مثال: الدلة؛ لأن هيئتها مميزة وتُعرف حتى بعد التبسيط.\n\nالحصة 2: تحوير عنصر من البيئة العمانية إلى خطوط ومساحات وملامس محققًا التناسب الشكلي الخطي\nس1 (مستوى المعرفة): ما العناصر الفنية التي حوّلت إليها عنصرك؟\nالإجابة: خطوط ومساحات وملامس.\n\nس2 (مستوى التطبيق): صف التغيرات البصرية التي أجريتها على عنصرك.\nالإجابة: إجابة شخصية تذكر التبسيط والتقسيم والملامس.\n\nس3 (مستوى الاستدلال): أصدر حكمًا على شكل زميل من حيث التناسب الشكلي الخطي.\nالإجابة: حكم معلل مع اقتراح.\n\nالحصة 3: توظيف الشكل المحور هويةً أو شعارًا لمؤسسة عمانية وإصدار حكم عليه\nس1 (مستوى المعرفة): ما المؤسسة التي صممت لها الشعار؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): قيم شعارك من حيث البساطة والدلالة.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): كيف يمكن تحويل مهارة التحوير إلى مشروع صغير؟\nالإجابة: بتصميم شعارات وهويات للمحلات والأسر المنتجة مقابل أجر.", "الحصة 1: مفهوم التحوير وعلاقته بالتجريد: تحليل أعمال المدرسة التجريدية\nإرشاد للطالب: يتأمل عناصر البيئة العمانية ويختار عنصرًا مميزًا لتحويره.\nإرشاد لولي الأمر: يتحاور مع ابنه حول الرموز العمانية التراثية.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 21–22.\n\ حور معتمدًا على أحد أساسيات بناء العمل الفني — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم الشكل المحور مكررًا بثلاث طرق (منتظم، متبادل، متدرج) ويسأل: أي إيقاع أكثر حيوية؟ ويقارن الطالب بين الطرق ويعلل (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. اختيار الأساس: يوجه المعلم إلى اختيار أساس واحد يبني عليه الطالب رسمه، ويختار الطالب الأساس (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. الرسم: يتابع المعلم الرسم ويقدم دعمًا فرديًا، ويرسم الطالب شكله المحور معتمدًا على الأساس المختار (22 دقيقة)\nالاستراتيجيات: التفكير الإبداعي.\n\n4. الختام: ينظم المعلم مقارنة ثنائية بين الأعمال، ويقارن الطالب عمله بعمل زميل من حيث التناسب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: رسم تكوين من الشكل المحور قائم على أسس بناء العمل الفني وتوليد أفكار لمشروع صغير — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم منتجات (أكواب، أغلفة، مفارش) عليها تكوينات تراثية ويسأل: هل يمكن أن يكون تكوينك على منتج؟ ويقترح الطالب منتجًا لتكوينه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. رسم التكوين: يتابع المعلم بناء التكوين على المساحة ويذكّر بالأسس، ويرسم الطالب التكوين ويوزع الوحدات على الأرضية (19 دقيقة)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n3. توليد الأفكار: يقود المعلم عصفًا ذهنيًا لتوظيف التكوينات في مشروع صغير، ويقترح الطالب فكرة مشروع (طباعة على أكواب، بطاقات…) (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: يوجه المعلم للحفاظ على التكوين لتلوينه في الدرس القادم، ويحفظ الطالب تكوينه (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – أسس في مشهد عماني: يحلل كل زوج مشهدًا لقلعة مطرح المطلة على البحر أو لسفينة شراعية عمانية، ويحدد فيه التوازن والإيقاع والوحدة والتباين، ثم يشارك تحليله مع الصف في جملتين (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: تطبيق أسس بناء العمل الفني بالورق الملون وقصاصات الجرائد والمجلات\nس1 (مستوى المعرفة): سمِّ ثلاثة من أسس بناء العمل الفني.\nالإجابة: الوحدة والاتزان والإيقاع.\n\nس2 (مستوى التطبيق): كيف يتحقق الإيقاع بالقصاصات؟\nالإجابة: بتكرار الأشكال بانتظام أو بتدرج.\n\nس3 (مستوى الاستدلال): حلل كيف تحققت السيادة في عمل مجموعة أخرى.\nالإجابة: تحليل يذكر العنصر المسيطر بالحجم أو اللون أو الموقع.\n\nالحصة 2: رسم الشكل المحور معتمدًا على أحد أساسيات بناء العمل الفني\nس1 (مستوى المعرفة): ما الأساس الذي اخترته لرسمك؟\nالإجابة: إجابة شخصية صحيحة.\n\nس2 (مستوى التطبيق): كيف يحقق التكرار المتدرج إحساسًا بالعمق؟\nالإجابة: بتصغير الشكل تدريجيًا فيبدو مبتعدًا.\n\nس3 (مستوى الاستدلال): استنتج الأساس المطبق في عمل زميلك.\nالإجابة: إجابة صحيحة بدليل.\n\nالحصة 3: رسم تكوين من الشكل المحور قائم على أسس بناء العمل الفني وتوليد أفكار لمشروع صغير\nس1 (مستوى المعرفة): ما الذي يميز التكوين عن الشكل المفرد؟\nالإجابة: تنظيم عدة وحدات مع الأرضية وفق أسس البناء.\n\nس2 (مستوى التطبيق): كيف تحقق الوحدة في التكوين؟\nالإجابة: بتكرار الشكل المحور وتوحيد الأسلوب.\n\nس3 (مستوى الاستدلال): اقترح معالجة تطور تكوين زميل.\nالإجابة: مثال: تحقيق السيادة بتكبير وحدة مركزية.", "الحصة 1: تطبيق أسس بناء العمل الفني بالورق الملون وقصاصات الجرائد والمجلات\nس1 (مستوى المعرفة): ما الأساس الذي طبقته مجموعتك؟\nالإجابة: إجابة صحيحة.\n\nس2 (مستوى التطبيق): اشرح الفرق بين الاتزان المتماثل وغير المتماثل.\nالإجابة: المتماثل تطابق الجانبين، وغير المتماثل تعادل الوزن البصري دون تطابق.\n\nس3 (مستوى الاستدلال): اقترح أساسًا يناسب عملًا عن «الحركة» وعلل.\nالإجابة: الإيقاع؛ لأنه يوحي بالتتابع والحركة.\n\nالحصة 2: رسم الشكل المحور معتمدًا على أحد أساسيات بناء العمل الفني\nس1 (مستوى المعرفة): عرّف التناسب في العمل الفني.\nالإجابة: حالة من التعادل والتوازن في توزيع الوحدات الشكلية مع الأرضية.\n\nس2 (مستوى التطبيق): قارن بين عملك وعمل زميل من حيث التناسب.\nالإجابة: مقارنة معللة.\n\nس3 (مستوى الاستدلال): اقترح فكرة لتطوير رسمك إلى تكوين كامل.\nالإجابة: إضافة أشكال مساندة وأرضية متناسبة.\n\nالحصة 3: رسم تكوين من الشكل المحور قائم على أسس بناء العمل الفني وتوليد أفكار لمشروع صغير\nس1 (مستوى المعرفة): اذكر أساسين طبقتهما في تكوينك.\nالإجابة: إجابة صحيحة.\n\nس2 (مستوى التطبيق): صف فكرة مشروعك الصغير.\nالإجابة: إجابة شخصية واضحة (المنتج، الفئة، طريقة البيع).\n\nس3 (مستوى الاستدلال): قيم تكوينك وفق أسس بناء العمل الفني.\nالإجابة: تقييم معلل.", "الحصة 1: تطبيق أسس بناء العمل الفني بالورق الملون وقصاصات الجرائد والمجلات\nإرشاد للطالب: يلاحظ تطبيقات الاتزان والإيقاع في الإعلانات والمباني.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة الجمال المنظم في البيئة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 24–25.\n\nالحصة 2: رسم الشكل المحور معتمدًا على أحد أساسيات بناء العمل الفني\nإرشاد للطالب: يحتفظ برسمه لبناء التكوين في الحصة القادمة.\nإرشاد لولي الأمر: يتابع تقدم ابنه ويحفزه.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 25.\n\nالحصة 3: رسم تكوين من الشكل المحور قائم على أسس بناء العمل الفني وتوليد أفكار لمشروع صغير\nإرشاد للطالب: يفكر في منتج يمكن أن يحمل تكوينه.\nإرشاد لولي الأمر: يناقش مع ابنه فكرة مشروعه الصغير.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 25.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/10/arts/?l=2"]}, {"title": "الدرس الثالث: اللون في بناء العمل الفني", "unit": "الوحدة الأولى: البيئة تلهم الفنان", "periods": [{"ax": "المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية", "n": 1, "w": "الأسبوع السابع: من 18/10/2026 إلى 22/10/2026", "pg": "26–27", "f": ["1. يعدد المجموعات اللونية المستخدمة في أعمال الفنانين العمانيين (15 دقيقة)\n2. يلون الوحدة الشكلية بعد اختيار مجموعة لونية مناسبة (15 دقيقة)\nمخرج آخر: يدرك أهمية معرفة الفنان بالعلاقات اللونية (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. الحوار والمناقشة", "1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: دائرة الألوان، ألوان مائية، فرش", "1. المجموعات اللونية\n2. الألوان المتجانسة\n3. الألوان المتضادة\n4. الألوان الحارة والباردة", "التعلم القبلي: دائرة الألوان والألوان الأساسية والثانوية.\nيعرض المعلم عملين لفنانين عمانيين أحدهما بألوان حارة والآخر بباردة ويسأل: بماذا يشعرك كل عمل؟ ويربط الطالب الألوان بالإحساس.", "1. التهيئة: يعرض المعلم عملين لفنانين عمانيين أحدهما بألوان حارة والآخر بباردة ويسأل: بماذا يشعرك كل عمل؟ ويربط الطالب الألوان بالإحساس (5 دقائق)\n جانسة، المتضادة، الحارة، الباردة) في الأعمال، ويحدد المجموعة اللونية لكل عمل (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نمذجة: ينمذج المعلم تلوين وحدة بمجموعة متجانسة وأخرى متضادة، ويقارن الطالب النتيجتين (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تلوين الوحدة: يتابع المعلم اختيار المجموعة وتلوين الوحدة، والطلبة يلون وحدته الشكلية بالمجموعة المختارة (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. الختام: يطلب المعلم تبرير الاختيار، ويبرر الطالب اختيار مجموعته (3 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: إذا لونت الأرضية بمجموعة مختلفة تمامًا عن الشكل، فماذا يحدث؟ ويتوقع الطالب التنافر أو الانسجام (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الخطوات: يوضح المعلم خطوات التلوين: الوحدات الرئيسة، الأرضية، الربط اللوني، والطلبة يدون الخطوات (5 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. التلوين: يتابع المعلم التلوين ويوجه إلى الانسجام بين الوحدات، والطلبة يلون التكوين بالمجموعة المختارة (25 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: يعرض المعلم أعمالًا تحقق الانسجام، ويتأمل الطالب الأعمال (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم شكلًا أصفر على أرضية بنفسجية ويسأل: لماذا يبدو الشكل بارزًا؟ ويستنتج الطالب دور التضاد (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الإخراج: يوجه المعلم إلى إبراز الشكل بالتضاد مع الأرضية مع الحفاظ على الانسجام، ويُخرج الطالب عمله بلمسات التضاد النهائية (16 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. إصدار الحكم: ينظم المعلم عرضًا وتقييمًا جماعيًا، ويشارك الطالب في إصدار الأحكام (9 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يناقش المعلم مقترحات تلوين مرافق المدرسة (المكتبة، المقصف، الممرات)، ويقترح مجموعة لونية لمرفق ويعللها (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – ألوان من عمان: يعلن المعلم مشهدًا عمانيًا (خريف ظفار، صحراء الربع الخالي، بحر مسندم)، فتتسابق المجموعات في اقتراح مجموعة لونية مناسبة له وتبرير اختيارها بمفاهيم الدرس (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nس1 (مستوى المعرفة): ما الألوان المتضادة؟\nالإجابة: الألوان المتقابلة في دائرة الألوان، مثل الأحمر والأخضر.\n\nس2 (مستوى التطبيق): بماذا توحي الألوان الحارة؟\nالإجابة: بالدفء والحيوية والحركة.\n\nس3 (مستوى الاستدلال): لماذا يختار الفنان مجموعة لونية محددة لعمله؟\nالإجابة: لتحقيق الانسجام ونقل إحساس معين.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nس1 (مستوى المعرفة): عرّف الانسجام اللوني.\nالإجابة: التآلف بين ألوان الوحدات الشكلية والأرضية في مساحة العمل.\n\nس2 (مستوى التطبيق): رتب خطوات تلوين التكوين.\nالإجابة: الوحدات الرئيسة، ثم الأرضية، ثم اللمسات الرابطة.\n\nس3 (مستوى الاستدلال): كيف يحقق تكرار لون في أجزاء متفرقة انسجامًا؟\nالإجابة: يربط أجزاء العمل بصريًا.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nس1 (مستوى المعرفة): ما وظيفة التضاد اللوني بين الشكل والأرضية؟\nالإجابة: إبراز الشكل وجذب الانتباه إليه.\n\nس2 (مستوى التطبيق): كيف تجمع بين الانسجام والتضاد في عمل واحد؟\nالإجابة: بالانسجام داخل الوحدات والتضاد بينها وبين الأرضية.\n\nس3 (مستوى الاستدلال): اقترح ألوانًا لمكتبة المدرسة وعلل.\nالإجابة: ألوان باردة هادئة لأنها توحي بالسكينة وتساعد على التركيز.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nس1 (مستوى المعرفة): اذكر لونين متجانسين.\nالإجابة: الأزرق والأخضر (أو الأصفر والبرتقالي).\n\nس2 (مستوى التطبيق): ما المجموعة التي لونت بها وحدتك؟ ولماذا؟\nالإجابة: إجابة معللة.\n\nس3 (مستوى الاستدلال): اقترح مجموعة لونية لتكوين عن الصيف العماني وعلل.\nالإجابة: الألوان الحارة؛ لأنها توحي بالحرارة والإشراق.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nس1 (مستوى المعرفة): ما الخامة المستخدمة في التلوين؟\nالإجابة: الألوان المائية.\n\nس2 (مستوى التطبيق): صف كيف حققت الانسجام في تكوينك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيم مدى انسجام ألوان عمل زميل.\nالإجابة: تقييم معلل.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nس1 (مستوى المعرفة): اذكر قيمتين لونيتين حققتهما في عملك.\nالإجابة: الانسجام اللوني والتضاد اللوني.\n\nس2 (مستوى التطبيق): أصدر حكمًا على عملك بناء على القيمتين.\nالإجابة: حكم معلل.\n\nس3 (مستوى الاستدلال): اقترح خطة تلوين لممر المدرسة.\nالإجابة: خطة تحدد المجموعة اللونية ومواضعها مع التعليل.", "الحصة 1: المجموعات اللونية في أعمال الفنانين العمانيين وتلوين الوحدة الشكلية\nإرشاد للطالب: يلاحظ المجموعات اللونية في الملابس والمباني.\nإرشاد لولي الأمر: يشجع ابنه على ملاحظة تناسق الألوان.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 26–27.\n\nالحصة 2: تلوين التكوين بالمجموعات اللونية وتحقيق الانسجام اللوني بين الشكل والأرضية\nإرشاد للطالب: يتأمل لوحات فنانين عمانيين.\nإرشاد لولي الأمر: يتابع مع ابنه عمله الفني.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 27.\n\nالحصة 3: تحقيق التضاد اللوني بين الشكل والأرضية وإخراج العمل واقتراح تلوين مرافق المدرسة\nإرشاد للطالب: يحتفظ بعمله في ملف إنجازه.\nإرشاد لولي الأمر: يحاور ابنه حول ألوان غرف المنزل وأثرها.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 27–28.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/10/arts/?l=3"]}, {"title": "الدرس الأول: عمل تجريدي بالخامات المختلفة", "unit": "الوحدة الثانية: تشكيلات فنية", "periods": [{"ax": "مفهوم التجريد وخصائص أعمال كاندينسكي وتصميم عمل تجريدي من مساحات هندسية", "n": 1, "w": "الأسبوع العاشر: من 8/11/2026 إلى 12/11/2026", "pg": "31–33", "f": ["1. يوضح خصائص المدرسة التجريدية من خلال أعمال الفنان كاندينسكي (15 دقيقة)\n2. يصمم عملًا تجريديًا قائمًا على المساحات الهندسية (15 دقيقة)\nمخرج آخر: يدرك العلاقات الجمالية للتشكيل بالخامات المختلفة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج 3: فهم", "1. التعلم بالاكتشاف\n2. التعلم الذاتي\n3. الحوار والمناقشة", "1. اع موسيقي بصري، ويستخلص الطالب الخصائص من الأعمال (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تصميم العمل: يتابع المعلم تصميم عمل تجريدي من مساحات هندسية متداخلة، ويصمم الطالب عملًا تجريديًا بأدوات الرسم الهندسي (20 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. الختام: يطلب المعلم التفكير في الخامات المناسبة لكل مساحة، ويحدد الطالب الخامات المقترحة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: اختيار الخامات ذات الألوان والملامس المتنوعة وقص الأشكال وتغليفها وفق التصميم — زمن الحصة 40 دقيقة\n\n1. التهيئة: يمرر المعلم خامات مختلفة الملمس ويسأل: أي خامة تناسب مساحة توحي بالخشونة؟ ويختار الطالب خامة ويعلل (5 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n2. اختيار الخامات: يوجه المعلم إلى المطابقة بين المساحة والخامة واللون، ويحدد الطالب خامة لكل مساحة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. القص والتغليف: ينمذج المعلم تغليف شكل كرتوني بالقماش أو الورق ويتابع السلامة، ويقص الطالب الأشكال ويغلفها (22 دقيقة)\nالاستراتيجيات: التقويم الذاتي.\n\n4. الختام: يوجه المعلم لحفظ القطع، ويرتب الطالب قطعه (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: ترتيب الأشكال وتركيبها وإخراج العمل التجريدي وتقويمه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: هل يتغير العمل إذا غيرنا ترتيب القطع؟ ويجرب الطالب ترتيبين سريعين ويقارن (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. التركيب والإخراج: يتابع المعلم التركيب ويوجه إلى الاتزان والتداخل، ويركب الطالب الأشكال ويخرج العمل (18 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. التقويم: ينظم المعلم تقييمًا وفق: الفكرة، العناصر، الملامس، ويقيم الطالب عمله وأعمال زملائه (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: يوجه المعلم للدرس القادم بإحضار كرتون نظيف بمقاسات محددة ونماذج زخارف، ويستعد الطالب للدرس القادم (4 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – الخنجر بلغة التجريد: تحوّل كل مجموعة الخنجر العماني أو برج قلعة إلى مساحات هندسية ملونة على طريقة كاندينسكي في رسم سريع، ثم تتحدث عن مكانة الخنجر رمزًا في الهوية الوطنية (5 دقائق)\nالاستراتيجيات: ا تقويمه واقتراح تسويقه\nالمخرج 1: إبداع\nالمخرج 2: تقييم\nالمخرج 3: إبداع", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\n1. التعلم التعاوني\n2. التعلم المبني على حل المشكلات\n3. الحوار والمناقشة\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\n1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم بالممارسة العملية\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\n1. التعلم المبني على المشاريع\n2. التعلم التشاركي\n3. التقويم الذاتي", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\n1. جهاز عرض البيانات\n2. صورة توضيحية\n3. أخرى: نماذج زخارف (نباتية، حيوانية، كتابية، هندسية)، كرتون\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\n1. أخرى: كرتون، قاطع، ورق شفاف، أقلام\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\n1. صورة توضيحية\n2. الوسائل الاجتماعية\n3. أخرى: مسدس شمع، القطع المعالجة", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\n1. الزخرفة النباتية\n2. الزخرفة الهندسية\n3. الزخرفة الكتابية\n4. قواعد الزخرفة\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\n1. التفريغ\n2. إزالة الطبقة الخارجية (البارز والغائر)\n3. التناسب بين الشكل والأرضية\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\n1. التجميع\n2. التنوع الزخرفي الملمسي\n3. سوق العمل", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nالتعلم القبلي: الوحدة الزخرفية والتكرار من الصفوف السابقة.\nيعرض المعلم صورًا لوحدة إضاءة كرتونية مزخرفة ويسأل: كيف يتحول الكرتون المهمل إلى منتج جميل؟ ويقترح الطالب معالجات (تفريغ، طبقات).\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nالتعلم القبلي: أجزاء المنتج المحددة على الكرتون.\nيعرض المعلم قطعة كرتون أزيلت طبقتها الخارجية جزئيًا ويسأل: ما الملمس الذي ظهر؟ ويلاحظ الطالب الملمس المضلع (الغائر) مقابل السطح الأملس (البارز).\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nالتعلم القبلي: القطع الكرتونية المعالجة.\nيسأل المعلم: ما الترتيب الصحيح لتجميع أجزاء المنتج؟ ويقترح الطالب تسلسل التجميع.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم صورًا لوحدة إضاءة كرتونية مزخرفة ويسأل: كيف يتحول الكرتون المهمل إلى منتج جميل؟ ويقترح الطالب معالجات (تفريغ، طبقات) (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أنواع الزخارف: يعرض المعلم نماذج ويصنف مع الطلبة: نباتية، حيوانية، كتابية، هندسية، ويوضح قواعد التكرار والتماثل والتبادل، ويصنف الطالب النماذج (10 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. اختيار المنتج والوحدة: يوجه كل مجموعة لاختيار منتج ووحدة زخرفية مناسبة، وتختار المجموعة المنتج والوحدة (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. تحديد المساحات: يتابع المعلم رسم أجزاء المنتج على الكرتون بالقياس، ويحدد الطالب مساحة كل جزء على الكرتون (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. الختام: يراجع المعلم خطط المجموعات، وتعرض المجموعة خطتها (3 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم قطعة كرتون أزيلت طبقتها الخارجية جزئيًا ويسأل: ما الملمس الذي ظهر؟ ويلاحظ الطالب الملمس المضلع (الغائر) مقابل السطح الأملس (البارز) (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. النقل: يتابع المعلم نقل الوحدة الزخرفية بالورق الشفاف، وينقل الطالب التصميم إلى الكرتون (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. النمذجة: ينمذج المعلم إزالة الطبقة الخارجية والتفريغ بأمان، ويتابع الطالب ويجرب على قطعة تدريبية (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n4. المعالجة: يتابع المعلم التنفيذ ويوجه، وينفذ الطالب المعالجات على أجزاء المنتج (17 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: يجمع المعلم القطع وينظف المكان، ويحفظ الطالب القطع (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه — زمن الحصة 40 دقيقة\n\n1. التهيئة: يسأل المعلم: ما الترتيب الصحيح لتجميع أجزاء المنتج؟ ويقترح الطالب تسلسل التجميع (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. التجميع والإخراج: يتابع المعلم التجميع ويشرف على استخدام مسدس الشمع، ويجمع الطالب القطع ويخرج المنتج (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التقويم: ينظم المعلم عرضًا وتقويمًا وفق التنوع الزخرفي الملمسي، ويقوم الطالب المنتجات (8 دقائق)\nالاستراتيجيات: التعلم بالممارسة العملية.\n\n4. الختام: يقود المعلم نقاشًا حول تسويق منتجات الكرتون (أسعار، متاجر إلكترونية)، ويقترح الطالب فكرة تسويقية (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – زخارف من بيوتنا: تتذكر المجموعات زخارف رأتها في الأبواب الخشبية العمانية والفضيات والمباخر وتصنفها (نباتية، هندسية، كتابية)، ثم تختار زخرفة منها لمنتج مجسم كوحدة إضاءة وتبرر اختيارها (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nس1 (مستوى المعرفة): سمِّ أربعة أنواع من الزخارف.\nالإجابة: نباتية، حيوانية، كتابية، هندسية.\n\nس2 (مستوى التطبيق): ما قاعدة التبادل في الزخرفة؟\nالإجابة: تكرار وحدتين مختلفتين بالتناوب.\n\nس3 (مستوى الاستدلال): لماذا تختلف الوحدة المناسبة لوحدة الإضاءة عن رف الكتب؟\nالإجابة: لأن وحدة الإضاءة تحتاج تفريغًا يمرر الضوء، والرف يحتاج زخرفة سطحية لا تضعف متانته.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nس1 (مستوى المعرفة): ما المقصود بالغائر في الكرتون؟\nالإجابة: الأجزاء المنخفضة عن السطح الناتجة عن إزالة الطبقة.\n\nس2 (مستوى التطبيق): لماذا ننقل التصميم بالورق الشفاف؟\nالإجابة: لضمان الدقة والتناسب مع المساحة.\n\nس3 (مستوى الاستدلال): كيف تحقق التنوع الملمسي بالكرتون وحده؟\nالإجابة: بالمزج بين السطح الأملس والمضلع والمفرغ.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nس1 (مستوى المعرفة): ما الأداة المستخدمة في تجميع القطع؟\nالإجابة: مسدس الشمع.\n\nس2 (مستوى التطبيق): ما القيمة الفنية للدرس؟\nالإجابة: التنوع الزخرفي الملمسي.\n\nس3 (مستوى الاستدلال): اقترح فكرة ابتكارية لمنتج كرتوني يباع في السوق.\nالإجابة: مثال: وحدات إضاءة مزخرفة بطابع عماني.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nس1 (مستوى المعرفة): ما المنتج الذي اختارته مجموعتك؟\nالإجابة: إجابة شخصية.\n\nس2 (مستوى التطبيق): صنف الوحدة الزخرفية التي اخترتها.\nالإجابة: إجابة صحيحة.\n\nس3 (مستوى الاستدلال): اقترح قاعدة زخرفية تناسب منتجك وعلل.\nالإجابة: إجابة معللة.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nس1 (مستوى المعرفة): اذكر معالجتين للكرتون.\nالإجابة: إزالة الطبقة الخارجية والتفريغ.\n\nس2 (مستوى التطبيق): صف تحقق التناسب بين الشكل والأرضية في قطعتك.\nالإجابة: إجابة شخصية.\n\nس3 (مستوى الاستدلال): قيم دقة تنفيذ المعالجات واقترح تحسينًا.\nالإجابة: تقييم معلل.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nس1 (مستوى المعرفة): اذكر قاعدة سلامة عند استخدام مسدس الشمع.\nالإجابة: عدم لمس الطرف الساخن والشمع المذاب.\n\nس2 (مستوى التطبيق): قيم منتج مجموعتك.\nالإجابة: تقييم معلل.\n\nس3 (مستوى الاستدلال): صمم خطة تسويق مختصرة لمنتجك.\nالإجابة: الفئة المستهدفة، السعر، قناة البيع.", "الحصة 1: أنواع الزخارف وقواعدها واختيار الوحدة الزخرفية المناسبة للمنتج وتحديد مساحات العمل\nإرشاد للطالب: يتأمل الزخارف في المساجد والقلاع العمانية.\nإرشاد لولي الأمر: يشجع ابنه على إعادة تدوير الكرتون.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 35–36.\n\nالحصة 2: نقل التصميم إلى الكرتون وتنفيذ المعالجات (إزالة الطبقة الخارجية والتفريغ)\nإرشاد للطالب: يلاحظ طبقات الكرتون المضلع في العلب المنزلية.\nإرشاد لولي الأمر: يتابع التزام ابنه بالسلامة.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 36–37.\n\nالحصة 3: تجميع قطع الكرتون وإخراج المنتج الزخرفي المجسم وتقويمه واقتراح تسويقه\nإرشاد للطالب: يعرض منتجه على أسرته.\nإرشاد لولي الأمر: يشجع ابنه على تحويل أفكاره إلى منتجات.\nالمرجع: دليل المعلم (الفنون التشكيلية – الصف العاشر) ص 37.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/10/arts/?l=5"]}]);
let mode='sep',L=0,P=0;
const $=id=>document.getElementById(id);
function opt(){const s=$('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.unit+' – '+l.title+' ('+l.periods.length+' حصص)';s.appendChild(o)});s.onchange=()=>{L=+s.value;P=0;render()}}
function setMode(m){mode=m;$('mSep').classList.toggle('on',m==='sep');$('mComb').classList.toggle('on',m==='comb');render()}
$('mSep').onclick=()=>setMode('sep');$('mComb').onclick=()=>setMode('comb');
function render(){
 const l=D[L];
 $('now').textContent=mode==='sep'?'أنت الآن في الوضع المنفصل: نموذج لكل حصة':'أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه ('+l.periods.length+' حصص)';
 const t=$('tabs');t.innerHTML='';
 if(mode==='sep'){l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+p.n;if(i===P)b.className='on';b.onclick=()=>{P=i;render()};t.appendChild(b)})}
 const p=l.periods[P];
 $('meta').innerHTML=mode==='sep'?('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الحصة:</b> '+p.n+' من '+l.periods.length+' &nbsp;|&nbsp; <b>المحور:</b> '+esc(p.ax)+'<br><b>الأسبوع:</b> '+esc(p.w)+' &nbsp;|&nbsp; <b>الصفحات:</b> '+esc(p.pg)):('<b>الدرس:</b> '+esc(l.title)+' &nbsp;|&nbsp; <b>الوحدة:</b> '+esc(l.unit)+' &nbsp;|&nbsp; <b>عدد الحصص:</b> '+l.periods.length);
 const c=$('cards');c.innerHTML='';
 FIELDS.forEach((f,k)=>{
  const txt=mode==='sep'?p.f[k]:l.comb[k];
  const d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="ch"><h3><span class="no">'+(k+1)+'</span>'+esc(f)+'</h3><button class="cp">نسخ</button></div><pre></pre><div class="fb"><small>لم يسمح المتصفح بالنسخ التلقائي؛ النص محدد أدناه، انسخه يدويًا (Ctrl+C أو اضغط مطولًا ثم نسخ).</small><textarea readonly></textarea></div>';
  d.querySelector('pre').textContent=txt;
  const btn=d.querySelector('.cp');btn.onclick=()=>copy(txt,btn,d);
  c.appendChild(d)});
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function ok(btn){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1600)}
function fallback(txt,btn,d){const fb=d.querySelector('.fb'),ta=fb.querySelector('textarea');ta.value=txt;fb.style.display='block';ta.focus();ta.select();ta.setSelectionRange(0,txt.length);try{if(document.execCommand('copy')){ok(btn)}}catch(e){}}
function copy(txt,btn,d){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>ok(btn)).catch(()=>fallback(txt,btn,d))}else{fallback(txt,btn,d)}}
opt();render();
</script>
