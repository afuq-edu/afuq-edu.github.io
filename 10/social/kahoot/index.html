:root{
  --bg:#eef4f2;--card:#ffffff;--ink:#21403a;--muted:#5f7c75;--line:#d4e3dd;
  --teal:#4f9786;--teal-soft:#e2f0eb;--amber:#e3a857;--rose:#e39a92;--rose-soft:#fbeceb;
  --ok:#5aa883;--ok-soft:#e5f4ec;--sand:#f6eedd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
.contours{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;min-height:100%;max-width:1180px;margin:0 auto;padding:clamp(10px,2vw,22px)}
.screen{display:none;animation:fade .45s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f0c674;outline-offset:2px}

/* ---------- setup ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 16px}
.hero h1{margin:0;font-size:clamp(28px,4.2vw,46px);font-weight:800;letter-spacing:0;line-height:1.15}
.hero p{margin:4px 0 0;color:var(--muted);font-size:clamp(15px,1.6vw,18px)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.step h2{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:10px}
.step h2 .k{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);border:1.5px solid #9ccbbd;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:#2b6a5b}
.lessons{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:right;border:1.5px solid var(--line);background:#fbfdfc;border-radius:14px;padding:9px 12px;font-size:16px;color:var(--ink);transition:border-color .2s,background .2s}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 1.5px var(--teal) inset}
.count{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.count button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;color:var(--ink)}
.count output{font-size:28px;font-weight:800;min-width:34px;text-align:center}
.gnames{display:grid;gap:8px}
.gname{display:flex;align-items:center;gap:8px}
.gname .dot{width:16px;height:16px;border-radius:50%;flex:none}
.gname input{flex:1;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fbfdfc;color:var(--ink)}
.qcount{display:flex;align-items:center;gap:12px}
.qcount input[type=range]{flex:1;accent-color:var(--teal);height:28px}
.qcount output{font-size:30px;font-weight:800;min-width:44px;text-align:center}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 16px;font-size:16px;font-weight:700;color:var(--ink)}
.quick button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.startbar{display:flex;justify-content:center;margin:18px 0 6px;position:sticky;bottom:10px;z-index:3}
.big{border:0;background:var(--teal);color:#fff;font-size:22px;font-weight:800;border-radius:18px;padding:14px 44px;box-shadow:0 6px 0 #3c7a6b;transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #3c7a6b}
.big:disabled{background:#a9c7bf;box-shadow:none;cursor:not-allowed}
.ghost{border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:700;border-radius:14px;padding:9px 18px}

/* ---------- play ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.prog{font-weight:800;font-size:18px}
.prog small{display:block;color:var(--muted);font-weight:500;font-size:13.5px}
.tools{display:flex;gap:8px}
.iconbtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;height:42px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.turns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.turn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-size:16px;font-weight:700;color:var(--ink);transition:all .25s}
.turn .dot{width:14px;height:14px;border-radius:50%}
.turn .sc{color:var(--muted);font-weight:500;font-size:14px}
.turn.on{box-shadow:0 0 0 3px var(--gc) inset;background:#fff;transform:scale(1.04)}
.turn.on::after{content:"تجيب الآن";font-size:12.5px;background:var(--gc);color:#21403a;border-radius:999px;padding:1px 8px;margin-right:4px}
.stage{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.timerbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:center;position:sticky;top:10px}
.ring{width:150px;height:150px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:46px;line-height:1;direction:ltr;unicode-bidi:isolate}
.ring .num span{font-size:13px;color:var(--muted)}
.pts{margin-top:8px;font-size:14px;color:var(--muted)}
.pts b{display:block;font-size:26px;color:var(--ink)}
.over .pts b{color:#b0665c}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2vw,24px)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:13.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--teal-soft);color:#2b6a5b}
.tag.d1{background:#e6f1fa;color:#2d5f84}.tag.d2{background:#eef6e6;color:#43692d}.tag.d3{background:#f8ece1;color:#87552d}
.qtext{font-size:clamp(22px,2.9vw,34px);font-weight:800;line-height:1.5;margin:4px 0 16px}
.blank{display:inline-block;min-width:140px;border-bottom:3px dashed #9ccbbd;margin:0 6px;text-align:center;color:#2b6a5b;transition:all .3s}
.blank.filled{border-bottom-style:solid}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#fbfdfc;border-radius:18px;padding:14px 16px;font-size:clamp(18px,2.1vw,25px);font-weight:700;color:var(--ink);min-height:74px;transition:transform .15s,border-color .2s,background .25s,opacity .25s}
.ans:hover:not(:disabled){transform:translateY(-2px);border-color:#9ccbbd}
.ans .L{flex:none;width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:#2b6a5b;display:flex;align-items:center;justify-content:center;font-weight:800}
.ans:disabled{cursor:default}
.ans.correct{background:var(--ok-soft);border-color:var(--ok)}
.ans.correct .L{background:var(--ok);color:#fff}
.ans.wrong{background:var(--rose-soft);border-color:var(--rose)}
.ans.dim{opacity:.45}
.tf{grid-template-columns:1fr 1fr}
.tf .ans{justify-content:center;font-size:clamp(24px,3vw,34px);min-height:110px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chips .ans{min-height:60px;padding:10px 22px;justify-content:center}
.feedback{margin-top:14px;border-radius:16px;padding:12px 16px;font-size:20px;font-weight:800;display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feedback.show{display:flex;animation:fade .35s ease}
.feedback.ok{background:var(--ok-soft);color:#2d6e4f}
.feedback.no{background:var(--rose-soft);color:#9a4f46}
.feedback .gain{font-size:28px}
.under{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}

/* ---------- board ---------- */
.boardcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(14px,2vw,26px)}
.boardcard h2{margin:0;font-size:clamp(22px,2.8vw,32px)}
.boardcard .sub{color:var(--muted);margin:4px 0 10px;font-size:16px}
.chart{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.4vw,34px);height:min(52vh,420px);padding:28px 8px 0;border-bottom:2px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;max-width:150px;position:relative}
.col .val{font-weight:800;font-size:clamp(16px,2vw,22px);margin-bottom:6px}
.col .bar{width:100%;border-radius:14px 14px 4px 4px;height:4px;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.col.win .bar{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--amber)}
.col .gain{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);background:var(--amber);color:#3d2a08;font-weight:800;border-radius:999px;padding:2px 10px;font-size:15px;white-space:nowrap;opacity:0;transition:opacity .4s .9s}
.col.win .gain{opacity:1}
.col .rk{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--ink);margin-bottom:6px}
.col.lead .rk{border-color:var(--amber);background:#fff7e6}
.names{display:flex;justify-content:center;gap:clamp(10px,2.4vw,34px);padding:8px 8px 0}
.names div{flex:1;max-width:150px;text-align:center;font-weight:800;font-size:clamp(14px,1.7vw,19px);overflow-wrap:anywhere}
.boardnote{margin-top:12px;font-size:18px;font-weight:700;text-align:center}
.next{display:flex;justify-content:center;margin-top:16px;gap:10px;flex-wrap:wrap}

/* ---------- final ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);height:min(56vh,440px);margin-top:10px}
.pod{width:min(26vw,210px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pod .who{font-weight:800;font-size:clamp(17px,2.2vw,24px);text-align:center;margin-bottom:6px;overflow-wrap:anywhere}
.pod .scr{color:var(--muted);font-weight:700;margin-bottom:8px}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:clamp(34px,5vw,56px);font-weight:800;color:#21403a;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.crown{width:46px;height:46px;margin-bottom:4px}
.rest{max-width:520px;margin:18px auto 0;display:grid;gap:6px}
.rest div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .timerbox{position:static;display:flex;align-items:center;justify-content:center;gap:18px}
  .ring{width:110px;height:110px;margin:0}
  .ring .num b{font-size:34px}
  .answers{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

إفادة من تجاربها.","a":false},{"p":2,"d":1,"t":"mc","q":"أول الخلفاء الراشدين:","o":["أبو بكر الصديق","عمر بن الخطاب","عثمان بن عفان","علي بن أبي طالب"]},{"p":2,"d":1,"t":"tf","q":"انتصر المسلمون على الفرس في معركة القادسية.","a":true},{"p":2,"d":2,"t":"fill","q":"بُني أول أسطول حربي إسلامي في عهد الخليفة ____ بن عفان.","o":["عثمان","عمر","علي","معاوية"]},{"p":2,"d":2,"t":"mc","q":"معركة اليرموك كانت بين المسلمين و:","o":["الروم","الفرس","المغول","الصليبيين"]},{"p":2,"d":2,"t":"mc","q":"المغرب الأدنى يقابل اليوم:","o":["تونس","الجزائر","مراكش","ليبيا"]},{"p":2,"d":3,"t":"mc","q":"امتدت خلافة عمر بن الخطاب رضي الله عنه بين:","o":["13–23هـ","11–13هـ","23–35هـ","35–40هـ"]},{"p":2,"d":3,"t":"tf","q":"انتهت أحداث الفتنة في عهد الخليفة أبي بكر الصديق.","a":false},{"p":3,"d":1,"t":"mc","q":"بدأت أحداث معركة صفين سنة:","o":["37هـ","13هـ","40هـ","23هـ"]},{"p":3,"d":1,"t":"tf","q":"مثّل أبو موسى الأشعري الخليفة علي بن أبي طالب في التحكيم.","a":true},{"p":3,"d":2,"t":"fill","q":"رفعت قوات معاوية ____ على أسنة الرماح تطالب بالتحكيم.","o":["المصاحف","الرايات","الدروع","السيوف"]},{"p":3,"d":2,"t":"mc","q":"بايعت جماعة المحكّمة إمامًا عليها هو:","o":["عبدالله بن وهب الراسبي","عمرو بن العاص","أبو موسى الأشعري","سعد بن أبي وقاص"]},{"p":3,"d":3,"t":"mc","q":"سُمي العام الذي اجتمعت فيه الأمة على خليفة واحد بعد تنازل الحسن:","o":["عام الجماعة","عام الفتح","عام الرمادة","عام الوفود"]},{"p":3,"d":3,"t":"tf","q":"قبل الخليفة علي التحكيم رغبة في توسيع الفتوحات.","a":false}]},{"title":"المدارس الفكرية في الإسلام","periods":["القرآن الكريم منطلق الفكر الإسلامي ومقومات نموه: الدعوة إلى التفكير ووسطية الإسلام","المدن الإسلامية مراكز للفكر، والنهضة الفكرية، ومدرسة الحديث في المدينة","مدرسة الرأي في الكوفة وتطور المدارس الفكرية وآداب العلماء"],"questions":[{"p":1,"d":1,"t":"mc","q":"نقطة البداية بالنسبة للفكر الإسلامي:","o":["نزول القرآن الكريم","فتح العراق","بناء الكوفة","معركة صفين"]},{"p":1,"d":1,"t":"tf","q":"يرفض الإسلام التقليد الأعمى والتبعية الفكرية.","a":true},{"p":1,"d":2,"t":"fill","q":"التفكير في نظر الإسلام يُعد ____ دينيًا وفريضة إسلامية.","o":["واجبًا","ترفًا","أمرًا ثانويًا","عادة"]},{"p":1,"d":2,"t":"mc","q":"الأساس الذي تركز عليه الأخلاق كما في النص:","o":["الحرية الواعية","القوة العسكرية","الثروة","العزلة"]},{"p":1,"d":2,"t":"mc","q":"من مظاهر وسطية الإسلام:","o":["الجمع بين الأصالة والمعاصرة","رفض كل جديد","الجمود على القديم","إهمال الاجتهاد"]},{"p":1,"d":3,"t":"mc","q":"يتميز الإسلام في مواجهة المستجدات بـ:","o":["الثبات والمرونة","الجمود والتحجر","التخلي عن الثوابت","رفض الاجتهاد"]},{"p":1,"d":3,"t":"tf","q":"تقتصر وسطية الإسلام على أمور الدين دون أمور الدنيا.","a":false},{"p":2,"d":1,"t":"mc","q":"المدينة التي عُدّت حاضنة الحضارة الإسلامية:","o":["المدينة المنورة","قرطبة","بغداد","القاهرة"]},{"p":2,"d":1,"t":"tf","q":"كانت نزوى والرستاق وصحار مراكز فكرية في عُمان.","a":true},{"p":2,"d":2,"t":"fill","q":"عُرفت مدرسة المدينة المنورة بمدرسة ____.","o":["الحديث","الرأي","النحو","الفلسفة"]},{"p":2,"d":2,"t":"mc","q":"من أبرز علماء مدرسة المدينة:","o":["سعيد بن المسيب","أبو حنيفة النعمان","سعد بن أبي وقاص","عمرو بن العاص"]},{"p":2,"d":2,"t":"mc","q":"من المدن التي مُصّرت (أُنشئت) بعد الإسلام:","o":["البصرة","مكة المكرمة","دمشق","القدس"]},{"p":2,"d":3,"t":"mc","q":"اتسع الاجتهاد لأن المصادر الأصلية:","o":["تضع القواعد العامة وتترك الجزئيات للمجتهدين","تتضمن كل التفاصيل","لم تكن معروفة","منعت الاجتهاد"]},{"p":2,"d":3,"t":"tf","q":"اقتصر تسامح المدينة الإسلامية على المسلمين دون أتباع الديانات الأخرى.","a":false},{"p":3,"d":1,"t":"mc","q":"ازدهرت مدرسة الرأي في مدينة:","o":["الكوفة","المدينة المنورة","مكة المكرمة","صحار"]},{"p":3,"d":1,"t":"tf","q":"يُعد أبو حنيفة النعمان من أعلام مدرسة الرأي.","a":true},{"p":3,"d":2,"t":"fill","q":"أسس سعد بن أبي وقاص الكوفة سنة ____ هـ.","o":["17","37","40","11"]},{"p":3,"d":2,"t":"mc","q":"اتفق المجتهدون على الالتزام بالقرآن الكريم والسنة ثم:","o":["الإجماع","التقليد","العرف وحده","آراء الحكام"]},{"p":3,"d":3,"t":"mc","q":"تبلور في البصرة منهج جديد يأخذ بـ:","o":["الحديث والرأي معًا","الرأي وحده","الحديث وحده","الفلسفة وحدها"]},{"p":3,"d":3,"t":"tf","q":"زاد الضعف السياسي وتفكك الدولة من حركة التجديد والاجتهاد.","a":false}]}]}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var COLORS = ['#8cc3de','#f3bf8c','#a5d6ad','#c9b0e3','#f2a6a6','#e6d27a'];
var DEFAULT_NAMES = ['الجبال','الأودية','الكثبان','السواحل','الواحات','الشلالات'];
var TYPE_LBL = {mc:'اختيار من متعدد', tf:'صواب أم خطأ', fill:'أكمل الفراغ'};
var DIFF_LBL = {1:'سهل', 2:'متوسط', 3:'متقدم'};
var LETTERS = ['أ','ب','ج','د'];
var T_MAIN = 30, T_OVER = 30, P_MAX = 1000, P_MID = 500, P_MIN = 100;
var $ = function(id){ return document.getElementById(id); };

var cfg = {lesson:0, period:0, groups:4, names:DEFAULT_NAMES.slice(), n:10};
var G = null; // game state

/* ---------- audio ---------- */
var AC = null, muted = false;
function ac(){ if(!AC){ var C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); } if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, dur, type, vol){
  if(muted) return; var c = ac(); if(!c) return;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  var s = c.currentTime + (t0 || 0);
  g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(vol || 0.12, s + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
  o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + dur + 0.05);
}
var SND = {
  ok: function(){ tone(523.25,0,.35,'sine',.13); tone(659.25,.09,.35,'sine',.12); tone(783.99,.18,.45,'sine',.12); tone(1046.5,.3,.6,'sine',.06); },
  no: function(){ tone(329.63,0,.32,'triangle',.08); tone(261.63,.16,.45,'triangle',.07); },
  tick: function(){ tone(880,0,.05,'sine',.025); },
  bars: function(){ tone(392,0,.25,'sine',.05); tone(493.88,.12,.3,'sine',.05); },
  fanfare: function(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,i*.16,.5,'sine',.1); }); tone(523.25,.7,1.2,'sine',.06); tone(659.25,.7,1.2,'sine',.05); tone(783.99,.7,1.2,'sine',.05); }
};
function muteIcon(){
  var b = $('muteBtn');
  b.innerHTML = muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>الصوت مكتوم'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>الصوت';
  b.setAttribute('aria-pressed', muted);
}
$('muteBtn').addEventListener('click', function(){ muted = !muted; muteIcon(); });
muteIcon();

/* ---------- helpers ---------- */
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function show(id){ ['setup','play','board','final'].forEach(function(s){ $(s).classList.toggle('active', s === id); }); window.scrollTo(0,0); }
function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function secs(n){ return n === 1 ? 'ثانية واحدة' : n === 2 ? 'ثانيتين' : (n <= 10 ? n + ' ثوانٍ' : n + ' ثانية'); }
function pointsAt(t){
  if(t <= T_MAIN) return Math.round((P_MAX - (P_MAX - P_MID) * (t / T_MAIN)) / 10) * 10;
  var o = Math.min(t - T_MAIN, T_OVER);
  return Math.max(P_MIN, Math.round((P_MID - (P_MID - P_MIN) * (o / T_OVER)) / 10) * 10);
}

/* ---------- setup ---------- */
function renderLessons(){
  var box = $('lessonList'); box.innerHTML = '';
  D.lessons.forEach(function(L, i){
    var b = el('button','opt'); b.type = 'button';
    b.appendChild(document.createTextNode('الدرس ' + (i+1) + ': ' + L.title));
    b.appendChild(el('small', null, L.periods.length + ' حصص – ' + L.questions.length + ' سؤالًا'));
    b.setAttribute('aria-pressed', i === cfg.lesson);
    b.addEventListener('click', function(){ cfg.lesson = i; cfg.period = 0; renderLessons(); renderPeriods(); renderHint(); });
    box.appendChild(b);
  });
}
function renderPeriods(){
  var box = $('periodList'); box.innerHTML = '';
  D.lessons[cfg.lesson].periods.forEach(function(f, i){
    var b = el('button','opt'); b.type = 'button';
    b.appendChild(document.createTextNode('الحصة ' + (i+1)));
    b.appendChild(el('small', null, f));
    b.setAttribute('aria-pressed', i === cfg.period);
    b.addEventListener('click', function(){ cfg.period = i; renderPeriods(); renderHint(); });
    box.appendChild(b);
  });
}
function renderGroups(){
  $('gCount').textContent = cfg.groups;
  var box = $('gNames'); box.innerHTML = '';
  for(var i = 0; i < cfg.groups; i++){
    (function(i){
      var r = el('div','gname'); var d = el('span','dot'); d.style.background = COLORS[i];
      var inp = document.createElement('input'); inp.value = cfg.names[i]; inp.maxLength = 22; inp.setAttribute('aria-label','اسم المجموعة ' + (i+1));
      inp.addEventListener('input', function(){ cfg.names[i] = inp.value; });
      r.appendChild(d); r.appendChild(inp); box.appendChild(r);
    })(i);
  }
}
$('gMinus').addEventListener('click', function(){ if(cfg.groups > 2){ cfg.groups--; renderGroups(); } });
$('gPlus').addEventListener('click', function(){ if(cfg.groups < 6){ cfg.groups++; renderGroups(); } });
function setN(n){
  cfg.n = Math.max(1, Math.min(20, n)); $('qRange').value = cfg.n; $('qOut').textContent = cfg.n;
  Array.prototype.forEach.call($('quick').children, function(b){ b.setAttribute('aria-pressed', +b.dataset.n === cfg.n); });
  renderHint();
}
$('qRange').addEventListener('input', function(){ setN(+this.value); });
Array.prototype.forEach.call($('quick').children, function(b){ b.addEventListener('click', function(){ setN(+b.dataset.n); }); });
function renderHint(){
  var L = D.lessons[cfg.lesson];
  var own = L.questions.filter(function(q){ return q.p === cfg.period + 1; }).length;
  $('qHint').textContent = 'أسئلة الحصة المختارة: ' + own + '، وأسئلة الدرس كله: ' + L.questions.length + '. ' +
    (cfg.n > own ? 'سيُكمَل ' + (cfg.n - own) + ' من حصص الدرس الأخرى.' : 'كل الأسئلة من الحصة المختارة.');
}

/* ---------- question selection ---------- */
function balancedPick(pool, n){
  var by = {1:shuffle(pool.filter(function(q){return q.d===1;})), 2:shuffle(pool.filter(function(q){return q.d===2;})), 3:shuffle(pool.filter(function(q){return q.d===3;}))};
  var out = [], k = 0;
  while(out.length < n && (by[1].length || by[2].length || by[3].length)){
    var d = (k % 3) + 1; k++;
    if(by[d].length) out.push(by[d].shift());
  }
  return out;
}
function selectQuestions(){
  var L = D.lessons[cfg.lesson], P = cfg.period + 1;
  var own = L.questions.filter(function(q){ return q.p === P; });
  var others = L.questions.filter(function(q){ return q.p !== P; });
  var pick = balancedPick(own, Math.min(cfg.n, own.length)).map(function(q){ return {q:q, own:1}; });
  if(pick.length < cfg.n){
    balancedPick(others, cfg.n - pick.length).forEach(function(q){ pick.push({q:q, own:0}); });
  }
  pick.sort(function(a, b){ return (a.q.d - b.q.d) || (b.own - a.own); });
  return pick.map(function(x){ return x.q; });
}

/* ---------- game ---------- */
function startGame(){
  ac();
  var names = [];
  for(var i = 0; i < cfg.groups; i++) names.push((cfg.names[i] || '').trim() || ('المجموعة ' + (i+1)));
  G = {qs:selectQuestions(), i:-1, groups:names.map(function(n, i){ return {name:n, color:COLORS[i], score:0, prev:0}; }),
       turn:0, answered:false, raf:0, t0:0, lastTick:-1, lastGain:null};
  show('play'); nextQuestion();
}
$('startBtn').addEventListener('click', startGame);

function renderTurns(){
  var box = $('turns'); box.innerHTML = '';
  G.groups.forEach(function(g, i){
    var b = el('button','turn' + (i === G.turn ? ' on' : '')); b.type = 'button';
    b.style.setProperty('--gc', g.color);
    var d = el('span','dot'); d.style.background = g.color;
    b.appendChild(d); b.appendChild(document.createTextNode(g.name)); b.appendChild(el('span','sc', g.score));
    b.title = 'اختر هذه المجموعة للإجابة';
    b.addEventListener('click', function(){ if(!G.answered){ G.turn = i; renderTurns(); } });
    box.appendChild(b);
  });
}

function nextQuestion(){
  G.i++;
  if(G.i >= G.qs.length){ return finish(); }
  G.answered = false; G.lastGain = null;
  if(G.i > 0) G.turn = (G.turn + 1) % G.groups.length;
  var q = G.qs[G.i], L = D.lessons[cfg.lesson];
  $('prog').innerHTML = '';
  $('prog').appendChild(document.createTextNode('السؤال ' + (G.i+1) + ' من ' + G.qs.length));
  $('prog').appendChild(el('small', null, 'الدرس: ' + L.title));
  renderTurns();
  var m = $('qmeta'); m.innerHTML = '';
  m.appendChild(el('span','tag', TYPE_LBL[q.t]));
  m.appendChild(el('span','tag d' + q.d, DIFF_LBL[q.d]));
  m.appendChild(el('span','tag', 'الحصة ' + q.p));
  var qt = $('qtext'); qt.innerHTML = '';
  var A = $('answers'); A.innerHTML = ''; A.className = '';
  if(q.t === 'fill'){
    var parts = q.q.split('____');
    qt.appendChild(document.createTextNode(parts[0]));
    var bl = el('span','blank','\u00a0'); bl.id = 'blank'; qt.appendChild(bl);
    qt.appendChild(document.createTextNode(parts[1] || ''));
    A.className = 'chips';
    shuffle(q.o).forEach(function(o){ var b = el('button','ans', o); b.type = 'button'; b.dataset.v = o; b.addEventListener('click', function(){ answer(b, o === q.o[0]); }); A.appendChild(b); });
  } else if(q.t === 'tf'){
    qt.textContent = q.q;
    A.className = 'answers tf';
    [['صواب', true], ['خطأ', false]].forEach(function(x){ var b = el('button','ans', x[0]); b.type = 'button'; b.dataset.v = String(x[1]); b.addEventListener('click', function(){ answer(b, x[1] === q.a); }); A.appendChild(b); });
  } else {
    qt.textContent = q.q;
    A.className = 'answers';
    shuffle(q.o).forEach(function(o, k){ var b = el('button','ans'); b.type = 'button'; b.dataset.v = o; b.appendChild(el('span','L', LETTERS[k])); b.appendChild(document.createTextNode(o)); b.addEventListener('click', function(){ answer(b, o === q.o[0]); }); A.appendChild(b); });
  }
  $('feedback').className = 'feedback'; $('feedback').innerHTML = '';
  $('toBoard').style.display = 'none'; $('skipBtn').style.display = '';
  $('timerbox').classList.remove('over');
  G.t0 = performance.now(); G.lastTick = -1;
  cancelAnimationFrame(G.raf); loop();
}

function elapsed(){ return (performance.now() - G.t0) / 1000; }
function loop(){
  if(G.answered) return;
  var t = elapsed(), arc = $('arc'), C = 326.73;
  if(t <= T_MAIN){
    var left = Math.ceil(T_MAIN - t);
    $('tNum').textContent = left; $('tLbl').textContent = 'ثانية';
    arc.style.strokeDashoffset = (C * (t / T_MAIN)).toFixed(1);
    arc.setAttribute('stroke', left <= 10 ? '#e3a857' : '#4f9786');
    arc.removeAttribute('stroke-dasharray'); arc.setAttribute('stroke-dasharray', '326.73');
    if(left <= 5 && left !== G.lastTick){ G.lastTick = left; SND.tick(); }
  } else {
    var o = Math.floor(t - T_MAIN);
    $('timerbox').classList.add('over');
    $('tNum').textContent = '+' + o; $('tLbl').textContent = 'وقت إضافي';
    arc.setAttribute('stroke', '#e39a92');
    arc.style.strokeDashoffset = (C * Math.min(1, (t - T_MAIN) / T_OVER)).toFixed(1);
  }
  $('ptsNow').textContent = pointsAt(t);
  G.raf = requestAnimationFrame(loop);
}

function lockAll(){ Array.prototype.forEach.call($('answers').querySelectorAll('.ans'), function(b){ b.disabled = true; }); }
function correctValue(q){ return q.t === 'tf' ? String(q.a) : q.o[0]; }
function correctText(q){ return q.t === 'tf' ? (q.a ? 'صواب' : 'خطأ') : q.o[0]; }

function answer(btn, ok){
  if(G.answered) return;
  G.answered = true; cancelAnimationFrame(G.raf);
  var t = elapsed(), q = G.qs[G.i], g = G.groups[G.turn];
  var gain = ok ? pointsAt(t) : 0;
  G.groups.forEach(function(x){ x.prev = x.score; });
  g.score += gain; G.lastGain = {idx:G.turn, gain:gain};
  lockAll();
  if(q.t === 'fill'){ var bl = $('blank'); bl.textContent = btn.dataset.v; bl.classList.add('filled'); }
  var cv = correctValue(q);
  Array.prototype.forEach.call($('answers').querySelectorAll('.ans'), function(b){
    if(b.dataset.v === cv) b.classList.add('correct'); else if(b === btn) b.classList.add('wrong'); else b.classList.add('dim');
  });
  if(q.t === 'fill' && !ok){ setTimeout(function(){ var bl = $('blank'); bl.textContent = cv; }, 900); }
  var fb = $('feedback');
  fb.innerHTML = '';
  if(ok){
    fb.className = 'feedback show ok';
    fb.appendChild(el('span', null, 'إجابة صحيحة لمجموعة ' + g.name + ' خلال ' + secs(Math.max(1, Math.round(t)))));
    fb.appendChild(el('span','gain', '+' + gain));
    SND.ok();
  } else {
    fb.className = 'feedback show no';
    fb.appendChild(el('span', null, 'إجابة غير صحيحة. الصحيحة: ' + correctText(q)));
    fb.appendChild(el('span','gain', '+0'));
    SND.no();
  }
  renderTurns();
  $('skipBtn').style.display = 'none'; $('toBoard').style.display = '';
}
$('skipBtn').addEventListener('click', function(){
  if(G.answered) return;
  G.answered = true; cancelAnimationFrame(G.raf);
  var q = G.qs[G.i]; G.groups.forEach(function(x){ x.prev = x.score; }); G.lastGain = {idx:G.turn, gain:0};
  lockAll();
  var cv = correctValue(q);
  Array.prototype.forEach.call($('answers').querySelectorAll('.ans'), function(b){ b.classList.add(b.dataset.v === cv ? 'correct' : 'dim'); });
  if(q.t === 'fill'){ $('blank').textContent = cv; $('blank').classList.add('filled'); }
  var fb = $('feedback'); fb.className = 'feedback show no'; fb.innerHTML = '';
  fb.appendChild(el('span', null, 'لم تُجب المجموعة. الإجابة الصحيحة: ' + correctText(q)));
  SND.no();
  $('skipBtn').style.display = 'none'; $('toBoard').style.display = '';
});
$('toBoard').addEventListener('click', showBoard);
$('endBtn').addEventListener('click', function(){ if(confirm('إنهاء المسابقة وعرض النتائج الآن؟')){ cancelAnimationFrame(G.raf); finish(); } });

function ranks(){
  var sorted = G.groups.map(function(g, i){ return {i:i, s:g.score}; }).sort(function(a, b){ return b.s - a.s; });
  var r = {}, last = null, rank = 0;
  sorted.forEach(function(x, k){ if(x.s !== last){ rank = k + 1; last = x.s; } r[x.i] = rank; });
  return r;
}

function showBoard(){
  show('board');
  var last = G.i === G.qs.length - 1;
  $('bTitle').textContent = 'الترتيب بعد السؤال ' + (G.i + 1) + ' من ' + G.qs.length;
  var lg = G.lastGain, gw = G.groups[lg.idx];
  $('bSub').textContent = lg.gain > 0 ? ('فازت مجموعة ' + gw.name + ' بنقاط هذا السؤال') : 'لم تُحتسب نقاط في هذا السؤال';
  var chart = $('chart'), names = $('names'); chart.innerHTML = ''; names.innerHTML = '';
  var max = Math.max.apply(null, G.groups.map(function(g){ return g.score; }).concat([1]));
  var r = ranks();
  var bars = [];
  G.groups.forEach(function(g, i){
    var col = el('div','col' + (i === lg.idx && lg.gain > 0 ? ' win' : ''));
    var val = el('div','val', g.prev);
    var bar = el('div','bar'); bar.style.background = g.color;
    bar.style.height = Math.max(3, (g.prev / max) * 78) + '%';
    var rk = el('div','rk', r[i]); if(r[i] === 1 && g.score > 0) col.classList.add('lead');
    var gn = el('div','gain', '+' + lg.gain);
    col.appendChild(gn); col.appendChild(rk); col.appendChild(val); col.appendChild(bar); chart.appendChild(col);
    names.appendChild(el('div', null, g.name));
    bars.push({bar:bar, val:val, g:g});
  });
  SND.bars();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    bars.forEach(function(x){
      x.bar.style.height = Math.max(3, (x.g.score / max) * 78) + '%';
      countUp(x.val, x.g.prev, x.g.score, 1000);
    });
  }); });
  var leader = G.groups.reduce(function(a, b){ return b.score > a.score ? b : a; });
  $('bNote').textContent = leader.score > 0 ? ('في الصدارة: ' + leader.name + ' برصيد ' + leader.score + ' نقطة') : '';
  $('nextBtn').textContent = last ? 'النتيجة النهائية' : 'السؤال التالي';
}
function countUp(node, a, b, ms){
  var s = performance.now();
  (function step(now){ var k = Math.min(1, (now - s) / ms); node.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))); if(k < 1) requestAnimationFrame(step); })(s);
}
$('nextBtn').addEventListener('click', function(){
  if(G.i >= G.qs.length - 1) finish(); else { show('play'); nextQuestion(); }
});

/* ---------- final ---------- */
var CROWN = '<svg class="crown" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 46 4 18l16 12 12-20 12 20 16-12-4 28z" fill="#f0c674" stroke="#c99a3c" stroke-width="2" stroke-linejoin="round"/><rect x="8" y="48" width="48" height="8" rx="3" fill="#e3b45c"/></svg>';
function finish(){
  show('final');
  var rk = ranks();
  var sorted = G.groups.map(function(g, i){ g._r = rk[i]; return g; }).sort(function(a, b){ return b.score - a.score; });
  $('fSub').textContent = 'أُجيب عن ' + Math.min(G.i + 1, G.qs.length) + ' من ' + G.qs.length + ' سؤالًا – الدرس: ' + D.lessons[cfg.lesson].title;
  var pod = $('podium'); pod.innerHTML = '';
  var order = sorted.length >= 3 ? [1, 0, 2] : [1, 0];
  var heights = {0:'78%', 1:'58%', 2:'42%'};
  var tints = {0:'#f6dfa6', 1:'#dfe7ea', 2:'#efd2bb'};
  var blocks = [];
  order.forEach(function(k){
    var g = sorted[k]; if(!g) return;
    var p = el('div','pod');
    if(g._r === 1) p.insertAdjacentHTML('beforeend', CROWN);
    p.appendChild(el('div','who', g.name));
    p.appendChild(el('div','scr', g.score + ' نقطة'));
    var b = el('div','blk', String(g._r)); b.style.background = 'linear-gradient(180deg,' + g.color + ',' + tints[k] + ')';
    p.appendChild(b); pod.appendChild(p); blocks.push({b:b, h:heights[k]});
  });
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ blocks.forEach(function(x){ x.b.style.height = x.h; }); }); });
  var rest = $('rest'); rest.innerHTML = '';
  sorted.forEach(function(g, k){ var d = el('div'); d.appendChild(el('span', null, 'المركز ' + g._r + ': ' + g.name)); d.appendChild(el('span', null, g.score + ' نقطة')); rest.appendChild(d); });
  SND.fanfare(); confetti();
}
$('againBtn').addEventListener('click', startGame);
$('newBtn').addEventListener('click', function(){ show('setup'); });

/* ---------- confetti (هادئ) ---------- */
function confetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = $('confetti'), cx = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.scale(devicePixelRatio, devicePixelRatio);
  var cols = ['#8cc3de','#f3bf8c','#a5d6ad','#c9b0e3','#f2a6a6','#f0d78a'];
  var P = [];
  for(var i = 0; i < 110; i++) P.push({x:Math.random() * innerWidth, y:-20 - Math.random() * innerHeight * .6, w:6 + Math.random() * 6, h:8 + Math.random() * 8,
    vy:.7 + Math.random() * 1.1, sw:Math.random() * 6.28, sp:.01 + Math.random() * .02, r:Math.random() * 6.28, vr:(Math.random() - .5) * .06, c:cols[i % cols.length]});
  var start = performance.now();
  (function frame(now){
    var el2 = (now - start) / 1000; cx.clearRect(0, 0, innerWidth, innerHeight);
    var alpha = el2 < 6 ? 1 : Math.max(0, 1 - (el2 - 6) / 2);
    P.forEach(function(p){ p.y += p.vy; p.sw += p.sp; p.x += Math.sin(p.sw) * .6; p.r += p.vr;
      cx.save(); cx.globalAlpha = alpha * .85; cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    if(alpha > 0) requestAnimationFrame(frame); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })(start);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if(!$('play').classList.contains('active') || !G || G.answered) return;
  var n = parseInt(e.key, 10); if(!n) return;
  var bs = $('answers').querySelectorAll('.ans'); if(bs[n - 1]) bs[n - 1].click();
});

renderLessons(); renderPeriods(); renderGroups(); setN(10);
window.__CONTEST__ = {D:D, cfg:cfg, get G(){ return G; }, pointsAt:pointsAt, selectQuestions:selectQuestions};
})();
</script>
