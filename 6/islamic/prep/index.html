طأ\n- التقصير في أداء الواجبات كترك صلاة الفجر بحجة السهر في العبادة: مناقشة التوازن"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخلص قيمتين من الآية (20).\nالإجابة النموذجية: التوازن بين العبادة والعمل، واليسر ورفع الحرج\n2) (تطبيق) هل يجوز أن يسهر المسلم في العبادة ثم يترك صلاة الفجر؟ ولماذا؟\nالإجابة النموذجية: لا، لأن الفرائض مقدمة والإسلام دين توازن لا يكلف فوق الطاقة\n3) (استدلال) ما المقصود بقوله: ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾؟\nالإجابة النموذجية: اقرؤوا من القرآن ما يسهل عليكم دون مشقة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: قليل دائم خير من ......\nالإجابة النموذجية: كثير منقطع\n2) (تطبيق) كيف تنظم وقتك بين الدراسة وتلاوة القرآن؟\nالإجابة النموذجية: بتخصيص ورد يومي ثابت ولو قليلًا مع أداء الواجبات الدراسية\n3) (استدلال) لماذا أمرت الآية بالاستغفار بعد الطاعات؟\nالإجابة النموذجية: لجبر التقصير فيها وطلب المغفرة من الله"], ["الغلق (3 دقائق)", "كل طالب يحدد وردًا يوميًا من القرآن يلتزم به"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=40"]]}, {"no": 67, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "هجر المسلم حرام (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 5, "pages": "154-160", "f": [["عنوان الدرس", "هجر المسلم حرام (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أبي أيوب الأنصاري رضي الله عنه\n3. يوضح حكم هجر المسلم أخاه فوق ثلاث ليال"], ["الاستراتيجيات", "القصة\nالتكرار الموجّه\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص154-157\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "تذكر الحديثين: «المؤمن للمؤمن كالبنيان يشد بعضه بعضًا» و«مثل المؤمنين في توادهم وتراحمهم...» وإكمال التشبيه"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (10 دقائق):\n- نص الحديث: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام»\n- الراوي: أبو أيوب الأنصاري خالد بن زيد، شهد العقبة الثانية وبدرًا وأحدًا والخندق، ونزل النبي 1) (معرفة) اذكر أثرًا سلبيًا للهجر.\nالإجابة النموذجية: يفرق بين الناس ويزرع البغضاء ويقطع الرحم\n2) (تطبيق) على من يبقى إثم الهجر إذا بادر أحدهما بالسلام فأعرض الآخر؟\nالإجابة النموذجية: على المعرض الذي لم يرد السلام\n3) (استدلال) ماذا قررت زهرة في نهاية الحوار؟\nالإجابة النموذجية: أن تجيب دعوة خالتها وتبادر بالسلام على عبير وتصالحها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اقترح حلين لتجنب الهجر.\nالإجابة النموذجية: المبادرة بالسلام، والتسامح والاعتذار\n2) (تطبيق) ماذا ينبغي لحمد أن يفعل بعد إعراض طارق؟\nالإجابة النموذجية: يستمر في الإحسان والسلام ويطلب من صديق مشترك الإصلاح\n3) (استدلال) ما الحكمة من إباحة الهجر ثلاثة أيام فقط؟\nالإجابة النموذجية: لتهدأ النفوس ثم يعود الصفاء دون قطيعة دائمة"], ["الغلق (3 دقائق)", "كل طالب يفكر في شخص يحتاج أن يبادره بالسلام"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=41"]]}, {"no": 69, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "القرآن الكريم معجزة خالدة", "k": 1, "n": 1, "wi": 5, "wn": 5, "pages": "161-166", "f": [["عنوان الدرس", "القرآن الكريم معجزة خالدة"], ["نواتج التعلم", "1. يبين أن القرآن الكريم معجزة النبي ﷺ الخالدة وكيف تحدى الله به العرب\n2. يعدد وجوه إعجاز القرآن (البياني، العلمي، الغيبي، التشريعي)\n3. يقارن بين معجزات الرسل السابقين ومعجزة القرآن"], ["الاستراتيجيات", "التدبر\nالتعلم التعاوني\nالجدول المقارن"], ["مصادر التعلم", "كتاب الطالب ص161-166\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "- تدبر قوله تعالى: ﴿إِنَّا نَحۡنُ نَزَّلۡنَا ٱلذِّكۡرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ﴾\n- سؤال: ما الذي يميز معجزة القرآن عن معجزات الرسل السابقين؟"], ["إجراءات التنفيذ (20 دقيقة)", "الإعجاز والتحدي (10 دقائق):\n- نزل القرآن عربيًا فصيحًا على قوم هم أرباب الفصاحة فعجزوا عن معارضته\n- التحدي: ﴿قُل لَّئِنِ ٱجۡتَمَعَتِ ٱلۡإِنسُ وَٱلۡجِنُّ عَلَىٰٓ أَن يَأۡتُواْ بِمِثۡلِ هَٰذَا ٱلۡقُرۡءَانِ لَا يَأۡتُونَ بِمِثۡلِهِۦ …﴾ ثم بعشر سور ثم بسورة\n- وجوه الإعجاز: البياني (فصاحة الألفاظ وبلاغة المعاني)، العلمي (حقائق الكون والخلق)، الغيبي (الإخبار عن الماضي والمستقبل)، التشريعي (أحكام تنظم حياة الفرد والمجتمع)\n\nالمقارنة والقصة (10 دقائق):\n- معجزات الرسل حسية مؤقتة انتهت بزمانها، والقرآن معجزة عقلية خالدة باقية إلى يوم القيامة\n- قصة أبي سفيان وأبي جهل والأخنس بن شريق يستمعون للقرآن خفية ثلاث ليال"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا يعد القرآن معجزة خالدة؟\nالإجابة النموذجية: لأنه باقٍ محفوظ إلى يوم القيامة ويتجدد إعجازه، بخلاف معجزات الرسل التي انتهت بزمانها\n2) (تطبيق) عدّد وجوه إعجاز القرآن.\nالإجابة النموذجية: البياني، والعلمي، والغيبي، والتشريعي\n3) (استدلال) ما وجه الإعجاز الذي لا تخلو منه سورة ولا آية؟\nالإجابة النموذجية: الإعجاز البياني"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) إخبار القرآن عن الأنبياء والأمم السابقة من الإعجاز ......\nالإجابة النموذجية: الغيبي\n2) (تطبيق) ما الذي تدل عليه قصة الزعماء الثلاثة الذين استمعوا للقرآن خفية؟\nالإجابة النموذجية: تأثير القرآن في القلوب حتى في قلوب أعدائه\n3) (استدلال) قارن بين معجزة موسى ومعجزة القرآن من حيث مدة البقاء.\nالإجابة النموذجية: معجزة موسى انتهت بزمانها، والقرآن باقٍ إلى يوم القيامة"], ["الغلق (3 دقائق)", "كل طالب يذكر وجهًا من الإعجاز أثار إعجابه"], ["الواجب المنزلي", "ابحث عن تفسير قوله تعالى: ﴿أَفَلَا يَتَدَبَّرُونَ ٱلۡقُرۡءَانَۚ وَلَوۡ كَانَ مِنۡ عِندِ غَيۡرِ ٱللَّهِ لَوَجَدُواْ فِيهِ ٱخۡتِلَٰفٗا كَثِيرٗا﴾ واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=42"]]}, {"no": 70, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 7, "n": 7, "wi": 1, "wn": 5, "pages": "12-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو سورتي المدثر والمزمل تلاوة مجودة\n2. يسمّع السورتين غيبًا تسميعًا متقنًا\n3. يطبق أحكام التجويد التي تعلمها (المخارج، النون الساكنة والتنوين: الإظهار والإدغام)"], ["الاستراتيجيات", "المسابقة\nالتسميع الثنائي\nالتقويم الذاتي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص12-16\nبطاقة تقويم التلاوة"], ["التهيئة (5 دقائق)", "تقسيم الطلبة أزواجًا للتسميع المتبادل وبطاقة تقويم: الحفظ، المخارج، الأحكام"], ["إجراءات التنفيذ (20 دقيقة)", "تسميع المدثر (10 دقائق):\n- تسميع ثنائي لسورة المدثر مع تسجيل الملاحظات\n- تصويب الأخطاء الشائعة\n\nتسميع المزمل (10 دقائق):\n- مسابقة تسميع لسورة المزمل بين المجموعات\n- استخراج مثال لكل حكم درسه الطالب من السورتين"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱلرُّجۡزَ فَٱهۡجُرۡ﴾.\nالإجابة النموذجية: ﴿وَلَا تَمۡنُن تَسۡتَكۡثِرُ﴾\n2) (تطبيق) اتلُ الآية التي تلي ﴿إِنَّ لَكَ فِي ٱلنَّهَارِ سَبۡحٗا طَوِيلٗا﴾.\nالإجابة النموذجية: ﴿وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا﴾\n3) (استدلال) استخرج إدغامًا بغير غنة من سورة المدثر.\nالإجابة النموذجية: (لَوَّاحَةٞ لِّلۡبَشَرِ) أو (نَذِيرٗا لِّلۡبَشَرِ)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: ﴿وَمَا يَذۡكُرُونَ إِلَّآ أَن يَشَآءَ …﴾\nالإجابة النموذجية: ﴿وَمَا يَذۡكُرُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ هُوَ أَهۡلُ ٱلتَّقۡوَىٰ وَأَهۡلُ ٱلۡمَغۡفِرَةِ﴾\n2) (تطبيق) استخرج إظهارًا حلقيًا من سورة المزمل.\nالإجابة النموذجية: (مِنۡهُ) أو (عَذَابًا أَلِيمٗا)\n3) (استدلال) سمّع سورة المزمل كاملة.\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تكريم المتقنين وتحديد مقاطع للمراجعة"], ["الواجب المنزلي", "راجع حفظ سورتي المدثر والمزمل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=43"]]}, {"no": 71, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 1, "n": 3, "wi": 2, "wn": 5, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يعرّف الاستدراك في الصلاة\n2. يستدل على مشروعية الاستدراك من الحديث النبوي\n3. يتعرف خطوات الاستدراك في الصلاة"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالعرض العملي"], ["مصادر التعلم", "كتاب الطالب ص167-169\nجهاز عرض\nمصلى المدرسة"], ["التهيئة (5 دقائق)", "- قصة عمر وعبدالله: دخلا صلاة المغرب والإمام في سجود الركعة الأولى، فسلّم عمر مع الإمام، واستمر عبدالله\n- سؤال: أيهما أصاب؟"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم والدليل (10 دقائق):\n- الاستدراك: أن يلحق المصلي بالجماعة وقد بدأت الصلاة فيدرك ما بقي مع الإمام ويقضي ما فاته بعد تسليمه\n- الدليل: «... ما أدركتم فصلوا وما فاتكم فاقضوا»\n\nالخطوات (10 دقائق):\n- يأتي بالتوجيه وتكبيرة الإحرام\n- يدخل مع الإمام على الحال التي هو عليها ويتابعه\n- لا يسلّم مع الإمام\n- يقوم بتكبير ليقضي ما فاته من ركعات\n- يسلّم بعد إتمام صلاته\n- عرض عملي في مصلى المدرسة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الاستدراك في الصلاة؟\nالإجابة النموذجية: أن يلحق المصلي بالجماعة بعد بدئها فيصلي معهم ما أدرك ويقضي ما فاته بعد تسليم الإمام\n2) (تطبيق) أكمل الحديث: «ما أدركتم فصلوا ...».\nالإجابة النموذجية: وما فاتكم فاقضوا\n3) (استدلال) أيهما أصاب في القصة: عمر أم عبدالله؟ ولماذا؟\nالإجابة النموذجية: عبدالله، لأنه فاتته ركعة فيجب أن يقضيها بعد تسليم الإمام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) بماذا يبدأ المستدرك عند دخوله الصلاة؟\nالإجابة النموذجية: بالتوجيه وتكبيرة الإحرام\n2) (تطبيق) متى يقضي المستدرك ما فاته؟\nالإجابة النموذجية: بعد تسليم الإمام\n3) (استدلال) هل يسلّم المستدرك مع الإمام؟\nالإجابة النموذجية: لا، بل يقوم بتكبير ليقضي ما فاته"], ["الغلق (3 دقائق)", "ترديد خطوات الاستدراك بالترتيب"], ["الواجب المنزلي", "اكتب خطوات الاستدراك في الصلاة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 72, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 2, "n": 3, "wi": 3, "wn": 5, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يحسب عدد الركعات التي يقضيها المستدرك في حالات مختلفة\n2. يصحح الأخطاء في مواقف الاستدراك\n3. يطبق الاستدراك تطبيقًا عمليًا"], ["الاستراتيجيات", "حل المشكلات\nالتعلم التعاوني\nالعرض العملي"], ["مصادر التعلم", "كتاب الطالب ص169-170\nأشكال أعمال الصلاة وعدد الركعات\nمصلى المدرسة"], ["التهيئة (5 دقائق)", "سؤال: إذا دخلت صلاة الظهر والإمام في التشهد الأخير، فكم ركعة تقضي؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحساب (10 دقائق):\n- حالات: أدرك العشاء في ركوع الركعة الأولى\n- أدرك الإمام في سجود الركعة الثانية من العشاء: يقضي ركعتين\n- أدرك المغرب في الركعة الثالثة: يقضي ركعتين\n- التوجيه وتكبيرة الإحرام أولًا في كل الحالات\n\nتصحيح المواقف (10 دقائق):\n- موقف: دخل متأخرًا فتابع الإمام بدون التوجيه وتكبيرة الإحرام (خطأ)\n- موقف: لم يسلّم مع الإمام وقام بتكبيرة ليقضي ما فاته (صواب)\n- تطبيق عملي في مجموعات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أدرك مصلٍّ الإمام في سجود الركعة الثانية من صلاة العشاء، فكم ركعة يقضي؟\nالإجابة النموذجية: ركعتين\n2) (تطبيق) صحح: دخل متأخرًا فتابع الإمام مباشرة دون التوجيه وتكبيرة الإحرام.\nالإجابة النموذجية: عليه أن يأتي بالتوجيه وتكبيرة الإحرام أولًا ثم يتابع الإمام\n3) (استدلال) أدرك مصلٍّ الركعة الثالثة من صلاة المغرب، فكم ركعة يقضي؟\nالإجابة النموذجية: ركعتين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أدرك مصلٍّ الإمام في التشهد الأخير من صلاة الظهر، فكم ركعة يقضي؟\nالإجابة النموذجية: أربع ركعات\n2) (تطبيق) ماذا يفعل المستدرك عند تسليم الإمام؟\nالإجابة النموذجية: لا يسلّم، بل يقوم بتكبير ويقضي ما فاته\n3) (استدلال) صحح: (يسلم المستدرك مع الإمام ثم يقضي ما فاته).\nالإجابة النموذجية: لا يسلم مع الإمام، بل يقضي ما فاته ثم يسلم"], ["الغلق (3 دقائق)", "عرض عملي لمجموعة تطبق الاستدراك"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 73, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 3, "n": 3, "wi": 4, "wn": 5, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يوضح المعنى العام لحديث «من أدرك ركعة من الصلاة فقد أدرك الصلاة»\n2. يقيّم مواقف تتعلق بالمسارعة إلى صلاة الجماعة\n3. يقوّم تعلمه في درس الاستدراك"], ["الاستراتيجيات", "الحوار والمناقشة\nالتقويم الذاتي\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص170-171 (أقيّم تعلمي)\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ما الشعور الذي ينتابك عندما تفوتك ركعات من صلاة الجماعة دون عذر؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والمواقف (10 دقائق):\n- «من أدرك ركعة من الصلاة فقد أدرك الصلاة»: الحث على إدراك الجماعة وأن فضلها يُنال بإدراك ركعة\n- تقييم الموقفين: من انشغل بالتلفاز وقت الصلاة متعللًا بأنه سيستدرك (خطأ)، ومن تأخر فذهب راكضًا خوفًا من فوات الجماعة (خطأ، والصواب المشي بسكينة ووقار)\n\nأقيّم تعلمي (10 دقائق):\n- وضع علامة الصواب والخطأ وتصويب ما تحته خط\n- إجابات شفهية\n- تلخيص الدرس"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما المعنى العام لحديث «من أدرك ركعة من الصلاة فقد أدرك الصلاة»؟\nالإجابة النموذجية: من أدرك ركعة مع الإمام نال فضل صلاة الجماعة\n2) (تطبيق) احكم على من يتأخر عن الصلاة متعللًا بأنه سيستدرك.\nالإجابة النموذجية: تصرف خاطئ، والواجب المبادرة إلى الصلاة في أول وقتها\n3) (استدلال) كيف يمشي المسلم إلى الصلاة إذا تأخر؟\nالإجابة النموذجية: بسكينة ووقار لا راكضًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صحح: (يصلي المستدرك ما فاته قبل تسليم الإمام).\nالإجابة النموذجية: يصلي ما فاته بعد تسليم الإمام\n2) (تطبيق) ما فائدة الاستدراك؟\nالإجابة النموذجية: يحفظ على المسلم فضل الجماعة ويعلمه النظام والمتابعة\n3) (استدلال) صف شعورك عندما تدرك صلاة الجماعة من أولها.\nالإجابة النموذجية: الطمأنينة والفرح بالأجر الكامل (تقبل الإجابات المعبرة)"], ["الغلق (3 دقائق)", "عهد: أبادر إلى الصلاة قبل الإقامة"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 74, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الصحابي عبدالله بن عمر رضي الله عنهما", "k": 1, "n": 1, "wi": 5, "wn": 5, "pages": "172-176", "f": [["عنوان الدرس", "الصحابي عبدالله بن عمر رضي الله عنهما"], ["نواتج التعلم", "1. يعرّف بالصحابي عبدالله بن عمر رضي الله عنهما (نسبه، إسلامه، هجرته، جهاده)\n2. يبين مكانته في العلم ورواية الحديث والفتوى\n3. يستنتج صفات يقتدي بها في حياته"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالخريطة الذهنية"], ["مصادر التعلم", "كتاب الطالب ص172-176\nبطاقة تعريف بالصحابي\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: من الصحابة الذين تعرفهم؟ ما الذي يميزهم؟"], ["إجراءات التنفيذ (20 دقيقة)", "السيرة (10 دقائق):\n- أبو عبد الرحمن عبدالله بن عمر بن الخطاب\n- أسلم صغيرًا مع أخته حفصة أم المؤمنين\n- هاجر مع أبيه ولازم النبي ﷺ\n- ردّه النبي ﷺ يوم بدر وأحد لصغر سنه، وأذن له في الخندق وعمره خمسة عشر عامًا\n- من أشهر رواة الحديث الثقات يرويه كما سمعه دون زيادة ولا نقص، وفقيه متأنٍ في الفتوى\n\nحديث النخلة والقدوة (10 دقائق):\n- قصته في سؤال النبي ﷺ عن الشجرة التي تشبه المسلم (النخلة) وسكوته أدبًا مع كبار الصحابة\n- كيف نقتدي به: اتباع الحق صغيرًا، الاجتهاد في العبادة، التأني في الفتوى، تتبع السنة، الرحمة بالمساكين"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من أخت عبدالله بن عمر؟\nالإجابة النموذجية: حفصة أم المؤمنين رضي الله عنها\n2) (تطبيق) متى أذن له النبي ﷺ بالمشاركة في الغزوات؟\nالإجابة النموذجية: في غزوة الخندق وعمره خمسة عشر عامًا\n3) (استدلال) ما الخلق الذي منعه من الإجابة في حديث النخلة؟\nالإجابة النموذجية: الأدب والحياء مع كبار الصحابة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) بمَ تميز عبدالله بن عمر في رواية الحديث؟\nالإجابة النموذجية: الدقة، فكان يرويه كما سمعه دون زيادة ولا نقص\n2) (تطبيق) ما الذي تستفيده من تأنيه في الفتوى؟\nالإجابة النموذجية: ألا أتعجل في الإجابة عما لا أعلم وأتحرى الدقة\n3) (استدلال) ما واجبنا تجاه الصحابة رضوان الله عليهم؟\nالإجابة النموذجية: محبتهم والترضي عنهم والاقتداء بهم"], ["الغلق (3 دقائق)", "خريطة ذهنية جماعية لصفات ابن عمر"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=45"]]}],[{"no": 1, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 1, "n": 6, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (1-7) من سورة المدثر تلاوة صحيحة مراعيًا مخارج الحروف\n2. يحفظ الآيات (1-7) حفظًا متقنًا\n3. يوضح معاني المفردات: المدثر، فأنذر، فكبّر، الرجز\n4. يتلو الآيات (8-17) من سورة المدثر تلاوة صحيحة\n5. يحفظ الآيات (8-17) حفظًا متقنًا\n6. يوضح معاني: الناقور، عسير، وحيدًا، ممدودًا، شهودًا، صعودًا"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتعلم التعاوني (التسميع الثنائي)\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص12\nالمكتبة الصوتية لمادة التربية الإسلامية\nالسبورة\nكتاب الطالب ص12-13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- الاستماع إلى تلاوة مجوّدة للآيات (1-7) من المكتبة الصوتية\n- سؤال: بمَ نادى الله تعالى نبيه في بداية السورة؟"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة والمحاكاة (5 دقائق):\n- تلاوة نموذجية من المعلم آية آية\n- محاكاة جماعية ثم فردية\n- تصويب النطق: الضاد والظاء، والراء في (فأنذر، فكبّر، فطهّر، فاهجر)\n\nالحفظ والمعاني (5 دقائق):\n- الحفظ بالتكرار المقطعي: الآيات (1-3) ثم (4-7)\n- معاني: المدثر (المتغطي بثيابه)، فأنذر (خوّف الناس عذاب الله)، فكبّر (عظّم ربك)، الرجز (الأوثان والمعاصي)، ولا تمنن تستكثر (لا تعطِ العطاء لتطلب أكثر منه)\n\nالتلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (8-17) ومحاكاة\n- التنبيه على مخرج العين في (عسير، عنيدًا) والخاء في (خلقت)\n\nالحفظ والمعاني (5 دقائق):\n- حفظ مقطعي (8-10) ثم (11-17)\n- معاني: الناقور (الصور)، عسير (شديد)، وحيدًا (منفردًا لا مال له ولا ولد حين خلقه)، ممدودًا (كثيرًا واسعًا)، بنين شهودًا (أبناء حاضرين معه)، سأرهقه صعودًا (سأكلفه عذابًا شاقًا)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿قُمۡ …﴾\nالإجابة النموذجية: ﴿قُمۡ فَأَنذِرۡ﴾\n2) (تطبيق) ما معنى (المدثر)؟\nالإجابة النموذجية: المتغطي بثيابه\n3) (استدلال) ما الحرف الذي يجب العناية بتفخيمه في ﴿وَثِيَابَكَ فَطَهِّرۡ﴾؟\nالإجابة النموذجية: الطاء في (فطهّر) تُنطق مفخمة لا تاءً، مع المحافظة على تشديد الهاء\n\n4) (معرفة) أكمل: ﴿فَذَٰلِكَ يَوۡمَئِذٖ …﴾\nالإجابة النموذجية: ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾\n5) (تطبيق) ما معنى (الناقور)؟\nالإجابة النموذجية: الصور الذي يُنفخ فيه يوم القيامة\n6) (استدلال) من الذي نزلت فيه الآيات (11-17)؟\nالإجابة النموذجية: الوليد بن المغيرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَرَبَّكَ فَكَبِّرۡ﴾.\nالإجابة النموذجية: ﴿وَثِيَابَكَ فَطَهِّرۡ﴾\n2) (تطبيق) ما معنى (فاهجر الرجز)؟\nالإجابة النموذجية: ابتعد عن الأوثان والمعاصي\n3) (استدلال) استنتج أمرين أمر الله بهما نبيه في الآيات.\nالإجابة النموذجية: إنذار الناس، وتعظيم الله تعالى (أو: تطهير الثياب، والصبر لله)\n\n4) (معرفة) اتلُ الآية التي تلي ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾.\nالإجابة النموذجية: ﴿وَبَنِينَ شُهُودٗا﴾\n5) (تطبيق) ما معنى (وبنين شهودًا)؟\nالإجابة النموذجية: أبناء حاضرين معه لا يغيبون عنه\n6) (استدلال) ما مخرج حرف الخاء في (خلقت)؟\nالإجابة النموذجية: أدنى الحلق"], ["الغلق (3 دقائق)", "تسميع ثنائي للآيات (8-17)"], ["الواجب المنزلي", "سمّع الآيات (1-7) لأحد أفراد أسرتك وراجعها يوميًا.\nسمّع الآيات (1-17) لأحد والديك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=3\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=1"]]}, {"no": 2, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 1, "n": 3, "wi": 2, "wn": 4, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يعرّف مخرج الحرف لغةً واصطلاحًا\n2. يعدد المخارج العامة الخمسة للحروف\n3. يطبق طريقة معرفة مخرج الحرف بنطقه ساكنًا أو مشددًا مسبوقًا بهمزة\n4. يحدد مخارج حروف الحلق الثلاثة (أقصاه، وسطه، أدناه)\n5. يحدد حروف الشفتين والخيشوم والجوف\n6. يطبق المخارج على كلمات من الآيات الكريمة"], ["الاستراتيجيات", "الحوار والمناقشة\nالعرض العملي\nخرائط المفاهيم\nالتعلم التعاوني\nالبطاقات"], ["مصادر التعلم", "كتاب الطالب ص19-21\nرسم توضيحي لمخارج الحروف\nجهاز عرض\nكتاب الطالب ص21-22\nبطاقات الحروف\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض شكل مخارج الحروف في الكتاب\n- سؤال: ماذا تلاحظ في الشكل؟ من أين تخرج الأصوات؟"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم (5 دقائق):\n- مخرج الحرف: محل خروج الحرف وتميّزه عن غيره بواسطة الصوت\n- قراءة حوار الجد وعبدالله\n- طريقة معرفة المخرج: ننطق الحرف ساكنًا أو مشددًا مسبوقًا بهمزة، فحيث ينقطع الصوت يكون مخرجه: أَخْ (الحلق)، أَرْ (اللسان)\n\nالمخارج العامة (5 دقائق):\n- الجوف، الحلق، اللسان، الشفتان، الخيشوم\n- خريطة مفاهيم للمخارج الخمسة مع مثال لكل مخرج\n- تطبيق الطريقة على حروف يختارها الطلبة\n\nالحلق (5 دقائق):\n- أقصى الحلق: الهمزة والهاء\n- وسطه: العين والحاء\n- أدناه: الغين والخاء\n- تدريب على التمييز بين الحاء والهاء، والعين والهمزة\n\nالشفتان والخيشوم والجوف (5 دقائق):\n- الشفتان: الفاء والباء والميم والواو\n- الخيشوم: الغنة في النون والميم المشددتين\n- الجوف: حروف المد الثلاثة\n- تصنيف بطاقات الحروف في مجموعات حسب المخرج"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما مخرج الحرف؟\nالإجابة النموذجية: محل خروج الحرف الذي يتميز به عن غيره\n2) (تطبيق) كيف تعرف مخرج حرف الخاء؟\nالإجابة النموذجية: أنطقه ساكنًا مسبوقًا بهمزة (أَخْ) فينقطع الصوت عند الحلق\n3) (استدلال) عدّد المخارج العامة للحروف.\nالإجابة النموذجية: الجوف، والحلق، واللسان، والشفتان، والخيشوم\n\n4) (معرفة) ما الحرفان اللذان يخرجان من أقصى الحلق؟\nالإجابة النموذجية: الهمزة والهاء\n5) (تطبيق) ما الحرفان اللذان يخرجان من وسط الحلق؟\nالإجابة النموذجية: العين والحاء\n6) (استدلال) أين تخرج الغنة؟\nالإجابة النموذجية: من الخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) طبّق الطريقة على حرف الراء وحدّد مخرجه.\nالإجابة النموذجية: أَرْ، ومخرجها اللسان\n2) (تطبيق) ما مخرج حرفي الفاء والباء؟\nالإجابة النموذجية: الشفتان\n3) (استدلال) لماذا يحرص قارئ القرآن على معرفة مخارج الحروف؟\nالإجابة النموذجية: لينطق الحروف نطقًا صحيحًا فلا يتغير المعنى ولا يلحن في كتاب الله\n\n4) (معرفة) صنّف: (غ، ب، ح، م).\nالإجابة النموذجية: الغين: أدنى الحلق، الباء: الشفتان، الحاء: وسط الحلق، الميم: الشفتان\n5) (تطبيق) ما مخرج حروف المد؟\nالإجابة النموذجية: الجوف\n6) (استدلال) استخرج من ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾ حرفًا يخرج من الحلق وآخر من الشفتين.\nالإجابة النموذجية: من الحلق: العين في (عليهم)، ومن الشفتين: الميم في (أنعمت) (تقبل الأمثلة الصحيحة)"], ["الغلق (3 دقائق)", "لعبة: المعلم يذكر مخرجًا ويرفع الطلبة بطاقة حرف منه"], ["الواجب المنزلي", "حدّد مخرج خمسة حروف من سورة الفاتحة بالطريقة التي تعلمتها.\nاكتب حروف الحلق مرتبة من الأقصى إلى الأدنى.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=2"]]}, {"no": 3, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 2, "n": 3, "wi": 3, "wn": 4, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يميز بين الحروف المتقاربة في المخرج (الضاد والظاء)\n2. يتعرف أثر اللهجة العامية في نطق بعض الحروف (القاف، الكاف، الجيم، الصاد)\n3. ينطق هذه الحروف من مخارجها الصحيحة في الآيات"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتعلم التعاوني\nتصحيح الأخطاء"], ["مصادر التعلم", "كتاب الطالب ص22-23\nالمكتبة الصوتية\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض كلمتي (الضالين) و(الظالين)\n- سؤال: هل المعنى واحد؟"], ["إجراءات التنفيذ (20 دقيقة)", "الضاد والظاء (10 دقائق):\n- (الضالين) بالضاد: المائلون عن الحق، و(الظالين) بالظاء: الدائمون والماكثون\n- تدريب على نطق الضاد في ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾\n\nأثر اللهجة (10 دقائق):\n- نماذج لأخطاء اللهجة: القاف تُنطق جيمًا أو غينًا، الكاف تُنطق شينًا، الجيم تُنطق ياءً، الصاد تُنطق سينًا\n- تلاوة آيات الكتاب ومحاكاة النطق الصحيح وكتابة مخرج كل حرف"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفرق في المعنى بين (الضالين) و(الظالين)؟\nالإجابة النموذجية: الضالين: المائلون عن الحق، الظالين: الدائمون الماكثون\n2) (تطبيق) اذكر حرفين تؤثر اللهجة العامية في نطقهما.\nالإجابة النموذجية: القاف والجيم (أو: الكاف، الصاد)\n3) (استدلال) لماذا يجب الحذر من أثر اللهجة في التلاوة؟\nالإجابة النموذجية: لأنه يؤدي إلى اللحن وقد يغيّر المعنى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما مخرج القاف؟\nالإجابة النموذجية: أقصى اللسان مع ما يحاذيه من الحنك الأعلى (اللسان)\n2) (تطبيق) انطق كلمة (قُلْ) نطقًا صحيحًا.\nالإجابة النموذجية: تُنطق القاف من مخرجها لا جيمًا ولا غينًا\n3) (استدلال) صحّح: قرأ زميلك (الصِّراط) بالسين.\nالإجابة النموذجية: الصواب الصِّراط بالصاد المفخمة"], ["الغلق (3 دقائق)", "تلاوة جماعية لسورة الفاتحة مع مراعاة المخارج"], ["الواجب المنزلي", "استمع لتلاوة سورة الفاتحة وسجّل حرفي "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 1, "n": 2, "wi": 1, "wn": 4, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (183-185) من سورة البقرة تلاوة صحيحة\n2. يوضح معاني المفردات: كُتب، معدودات، يطيقونه، فدية\n3. يبين حكم الصيام والغاية منه (التقوى)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص26-28\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- سؤال: عرّف الصيام في ضوء دراستك السابقة\n- إكمال التعريف: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس بنية"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية ومحاكاة للآيات الثلاث\n- تصويب المخارج والضبط\n\nالمعاني والفهم (10 دقائق):\n- كُتب: فُرض\n- لعلكم تتقون: الغاية من الصيام بلوغ التقوى\n- أيامًا معدودات: أيام شهر رمضان\n- الصيام عبادة خفية تحيي في النفس مراقبة الله"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى (كُتب عليكم الصيام)؟\nالإجابة النموذجية: فُرض عليكم الصيام\n2) (تطبيق) ما الغاية من الصيام كما في الآية (183)؟\nالإجابة النموذجية: التقوى\n3) (استدلال) كيف يربي الصيام التقوى في نفس المسلم؟\nالإجابة النموذجية: لأنه عبادة خفية بين العبد وربه يترك فيها شهواته طوعًا فتنمو فيه مراقبة الله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا …﴾\nالإجابة النموذجية: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ لَعَلَّكُمۡ تَتَّقُونَ﴾\n2) (تطبيق) ما المقصود بـ (أيامًا معدودات)؟\nالإجابة النموذجية: أيام شهر رمضان\n3) (استدلال) هل فُرض الصيام على المسلمين وحدهم؟ وما الدليل؟\nالإجابة النموذجية: لا، فُرض على من قبلنا، لقوله تعالى: ﴿… كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ …﴾"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (183)"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (183-185).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=4"]]}, {"no": 6, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 2, "n": 2, "wi": 2, "wn": 4, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين رخصة الفطر للمريض والمسافر ووجوب القضاء\n2. يوضح حكم العاجز عن الصيام (الفدية)\n3. يستنتج يسر الإسلام من قوله تعالى: ﴿… يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ …﴾"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص28-31\nالمصحف الشريف\nبطاقات حالات"], ["التهيئة (5 دقائق)", "- قراءة قصة آمنة وجدتها التي تناولت الدواء في نهار رمضان\n- سؤال: لماذا أفطرت الجدة؟"], ["إجراءات التنفيذ (20 دقيقة)", "الرخص (10 دقائق):\n- المريض الذي يشق عليه الصيام أو يؤخر شفاءه يفطر ويقضي\n- المسافر يفطر ويقضي: ﴿… فَعِدَّةٞ مِّنۡ أَيَّامٍ أُخَرَۚ …﴾\n- العاجز عن الصيام بسبب مشقته الدائمة كالكبير الطاعن في السن: يُطعم عن كل يوم مسكينًا\n\nاليسر وفضل رمضان (10 دقائق):\n- شهر رمضان أُنزل فيه القرآن هدى للناس\n- اليسر: الرخص رحمة من الله\n- تكميل العدة والتكبير شكرًا لله\n- حل أنشطة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما حكم المريض مرضًا يشق معه الصيام؟\nالإجابة النموذجية: يجوز له الفطر وعليه القضاء بعدد الأيام التي أفطرها\n2) (تطبيق) ما الفدية؟ ومن يخرجها؟\nالإجابة النموذجية: إطعام مسكين عن كل يوم، يخرجها العاجز عن الصيام كالكبير الطاعن في السن\n3) (استدلال) ما فضل شهر رمضان كما ورد في الآية (185)؟\nالإجابة النموذجية: أُنزل فيه القرآن هدى للناس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل كل مرض يبيح الفطر؟ علّل.\nالإجابة النموذجية: لا، المبيح هو الذي يشق معه الصيام أو يزيده أو يؤخر شفاءه\n2) (تطبيق) استخرج من الآية (185) ما يدل على يسر الإسلام.\nالإجابة النموذجية: ﴿… يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ وَلَا يُرِيدُ بِكُمُ ٱلۡعُسۡرَ …﴾\n3) (استدلال) صنّف الحالات: (مسافر، شيخ كبير عاجز، مريض شُفي).\nالإجابة النموذجية: المسافر: يفطر ويقضي، الشيخ العاجز: يفدي، المريض: يقضي ما أفطره بعد شفائه"], ["الغلق (3 دقائق)", "كل مجموعة تكتب عبارة تلخص يسر الإسلام في الصيام"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=4"]]}, {"no": 7, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "ثواب العمل الصالح (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 4, "pages": "32-36", "f": [["عنوان الدرس", "ثواب العمل الصالح (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث الشريف قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث عبدالله بن عباس رضي الله عنهما\n3. يوضح المقصود بالعينين اللتين لا تمسهما النار"], ["الاستراتيجيات", "الحوار والمناقشة\nالقصة\nالتكرار الموجّه"], ["مصادر التعلم", "كتاب الطالب ص32-34\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- قراءة حوار منار وأبيها الذي يخرج ليلًا لعمله في حفظ الأمن\n- سؤال: ما أهمية عمل أبي منار؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (10 دقائق):\n- نص الحديث: «عينان لا تمسهما النار: عين بكت من خشية الله، وعين باتت تحرس في سبيل الله» (الترمذي)\n- الراوي: عبدالله بن عباس، ابن عم النبي ﷺ، حَبر الأمة، دعا له النبي: «اللهم فقهه في الدين وعلمه التأويل»\n\nالحفظ والفهم (10 دقائق):\n- حفظ الحديث بالتكرار\n- العين الأولى: عين مؤمن بكت خوفًا من الله ورجاء رحمته\n- العين الثانية: سهرت لمصالح المسلمين كحراسة الحدود وحفظ الأمن"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما صلة قرابة ابن عباس بالنبي ﷺ؟\nالإجابة النموذجية: ابن عمه\n2) (تطبيق) ما معنى (حبر الأمة)؟\nالإجابة النموذجية: عالمها الكبير\n3) (استدلال) أكمل: «عينان لا تمسهما النار: ...».\nالإجابة النموذجية: عين بكت من خشية الله، وعين باتت تحرس في سبيل الله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مثالًا معاصرًا لعين تبيت تحرس في سبيل الله.\nالإجابة النموذجية: رجال الشرطة والجيش الذين يحرسون الوطن ليلًا\n2) (تطبيق) لماذا كان لبكاء العين من خشية الله ثواب عظيم؟\nالإجابة النموذجية: لأنه دليل على صدق الإيمان واستشعار عظمة الله في الخلوة\n3) (استدلال) سمّع الحديث غيبًا.\nالإجابة النموذجية: تسميع صحيح"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه في دفترك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=5"]]}, {"no": 8, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "ثواب العمل الصالح (حديث شريف)", "k": 2, "n": 2, "wi": 4, "wn": 4, "pages": "32-36", "f": [["عنوان الدرس", "ثواب العمل الصالح (حديث شريف)"], ["نواتج التعلم", "1. يعرّف العمل الصالح في نظر الإسلام\n2. يستنتج أن الحديث ذكر العين وأراد الجسد كله، وذكر العملين مثالًا لا حصرًا\n3. يربط بين الأعمال الصالحة وثوابها"], ["الاستراتيجيات", "الربط بين السبب والنتيجة\nالتعلم التعاوني\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص34-36\nبطاقات أعمال وثواب\nالسبورة"], ["التهيئة (5 دقائق)", "عصف ذهني: اذكر عملًا صالحًا قمت به هذا الأسبوع"], ["إجراءات التنفيذ (20 دقيقة)", "مفهوم العمل الصالح (10 دقائق):\n- كل عمل نافع خالص لوجه الله تعالى\n- ذكر العين وأريد الجسد كله (تعبير مجازي)\n- العملان مثال لا حصر: ﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾\n- البكاء من خشية الله في الخلوة دليل صدق الإيمان، وصاحبه ممن يظلهم الله في ظله\n\nالربط والتطبيق (10 دقائق):\n- نشاط الربط بين السبب والنتيجة في الكتاب\n- مجموعات: أعمال صالحة في البيت والمدرسة والمجتمع وثوابها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف العمل الصالح.\nالإجابة النموذجية: كل عمل نافع خالص لوجه الله تعالى\n2) (تطبيق) لماذا ذكر الحديث (العين) وهو يقصد الإنسان كله؟\nالإجابة النموذجية: تعبير مجازي من باب ذكر الجزء وإرادة الكل\n3) (استدلال) هل الثواب مقصور على هذين العملين؟ ولماذا؟\nالإجابة النموذجية: لا، ذُكرا على سبيل المثال، والمؤمن يثاب على كل عمل صالح ولو كان صغيرًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر ثلاثة أعمال صالحة يمكنك القيام بها.\nالإجابة النموذجية: مثل: بر الوالدين، ومساعدة زميل، والمحافظة على نظافة المسجد\n2) (تطبيق) ما جزاء من ذكر الله خاليًا ففاضت عيناه؟\nالإجابة النموذجية: من السبعة الذين يظلهم الله في ظله يوم لا ظل إلا ظله\n3) (استدلال) كيف تشكر من يسهرون على أمن وطنك؟\nالإجابة النموذجية: بالدعاء لهم واحترامهم والالتزام بالأنظمة (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "كل طالب يكتب عملًا صالحًا يعزم على فعله غدًا"], ["الواجب المنزلي", "سمّع الحديث وحل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=5"]]}, {"no": 9, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 2, "n": 6, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (18-25) تلاوة صحيحة\n2. يحفظ الآيات (18-25) حفظًا متقنًا\n3. يوضح معاني: قدّر، قُتل، عبس، بسر، يؤثر\n4. يتلو الآيات (26-30) تلاوة صحيحة\n5. يحفظ الآيات (26-30) حفظًا متقنًا\n6. يوضح معاني: سقر، لا تبقي ولا تذر، لوّاحة للبشر"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (8-17) من عدد من الطلبة"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (18-25) ومحاكاة\n- العناية بمخرج الحاء في (سحر) والهاء في (هذا)\n\nالحفظ والمعاني (5 دقائق):\n- حفظ مقطعي\n- معاني: فكّر وقدّر (هيّأ في نفسه ما يقول في القرآن)، فقُتل (لُعن)، عبس (قطّب وجهه)، بسر (اشتد عبوسه)، سحر يؤثر (سحر يُنقل ويُروى عن السابقين)\n\nالتلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (26-30) ومحاكاة\n- العناية بمخرج الصاد والقاف في (سأصليه سقر) والعين في (تسعة عشر)\n\nالحفظ والمعاني (5 دقائق):\n- حفظ مقطعي\n- معاني: سقر (من أسماء جهنم)، لا تبقي ولا تذر (لا تترك شيئًا إلا أحرقته)، لوّاحة للبشر (تغيّر الجلود وتسوّدها)، تسعة عشر (خزنتها من الملائكة)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿فَقَالَ إِنۡ هَٰذَآ …﴾\nالإجابة النموذجية: ﴿فَقَالَ إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ﴾\n2) (تطبيق) ما معنى (عبس وبسر)؟\nالإجابة النموذجية: قطّب وجهه واشتد عبوسه\n3) (استدلال) اتلُ الآية التي تلي ﴿إِنَّهُۥ فَكَّرَ وَقَدَّرَ﴾.\nالإجابة النموذجية: ﴿فَقُتِلَ كَيۡفَ قَدَّرَ﴾\n\n4) (معرفة) أكمل: ﴿لَا تُبۡقِي …﴾\nالإجابة النموذجية: ﴿لَا تُبۡقِي وَلَا تَذَرُ﴾\n5) (تطبيق) ما معنى (سقر)؟\nالإجابة النموذجية: اسم من أسماء جهنم\n6) (استدلال) كم عدد خزنة جهنم المذكورين في الآية (30)؟\nالإجابة النموذجية: تسعة عشر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي قاله الوليد في القرآن كما في الآيتين (24-25)؟\nالإجابة النموذجية: قال إنه سحر يُؤثر، وإنه قول البشر\n2) (تطبيق) ما مخرج الحاء في (سحر)؟\nالإجابة النموذجية: وسط الحلق\n3) (استدلال) سمّع الآيات (18-25).\nالإجابة النموذجية: تسميع صحيح متقن\n\n4) (معرفة) اتلُ الآية التي تلي ﴿سَأُصۡلِيهِ سَقَرَ﴾.\nالإجابة النموذجية: ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾\n5) (تطبيق) ما معنى (لوّاحة للبشر)؟\nالإجابة النموذجية: تغيّر الجلود وتسوّدها\n6) (استدلال) سمّع الآيات (26-30).\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-30)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-25).\nراجع حفظ الآيات (1-30).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=9\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=6"]]}, {"no": 10, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "من دلائل وحدانية الله تعالى", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "37-41", "f": [["عنوان الدرس", "من دلائل وحدانية الله تعالى"], ["نواتج التعلم", "1. يستنتج دلائل وحدانية الله تعالى من الكون والإنسان\n2. يتدبر الآيات الكريمة الدالة على الوحدانية\n3. يقرأ الأبيات الشعرية ويستخرج منها أدلة الوحدانية"], ["الاستراتيجيات", "التأمل والتفكر\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص37-39\nصور للكون (الشمس، القمر، الشجر، المطر)\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- إلقاء أبيات الشاعر: (انظر لتلك الشجرة ذات الغصون النضرة...)\n- سؤال: من الذي أخرج الثمرة وأوجد الشمس والقمر؟"], ["إجراءات التنفيذ (20 دقيقة)", "دلائل الكون (10 دقائق):\n- الشجرة تنمو من حبة، الشمس بضيائها وحرارتها، القمر والنجوم، المطر، البصر في الإنسان\n- كل ذلك دليل على خالق واحد ذي حكمة بالغة وقدرة مقتدرة\n\nتدبر الآيات (10 دقائق):\n- ﴿مَا ٱتَّخَذَ ٱللَّهُ مِن وَلَدٖ وَمَا كَانَ مَعَهُۥ مِنۡ إِلَٰهٍۚ إِذٗا لَّذَهَبَ كُلُّ إِلَٰهِۭ بِمَا خَلَقَ وَلَعَلَا بَعۡضُهُمۡ عَلَىٰ بَعۡضٖۚ …﴾\n- الاستنتاج: انتظام الكون دليل على وحدانية خالقه"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر دليلين من الكون على وحدانية الله.\nالإجابة النموذجية: نمو الشجرة من حبة صغيرة، وانتظام حركة الشمس والقمر\n2) (تطبيق) ماذا يحدث لو كان مع الله إله آخر كما في آية المؤمنون؟\nالإجابة النموذجية: لذهب كل إله بما خلق ولعلا بعضهم على بعض فيفسد الكون\n3) (استدلال) ما الذي نستنتجه من انتظام الكون؟\nالإجابة النموذجية: أن خالقه واحد مدبر حكيم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من الأبيات دليلًا من خلق الإنسان.\nالإجابة النموذجية: شقّ البصر في الإنسان\n2) (تطبيق) ما الحكمة التي تدل عليها الأبيات في وصف الخالق؟\nالإجابة النموذجية: ذو حكمة بالغة وقدرة مقتدرة\n3) (استدلال) اكتب جملة تتأمل فيها مخلوقًا يدل على وحدانية الله.\nالإجابة النموذجية: مثل: النحلة تصنع العسل بنظام دقيق، فسبحان من ألهمها"], ["الغلق (3 دقائق)", "كل طالب يذكر مخلوقًا يدل على عظمة الله"], ["الواجب المنزلي", "اكتب ثلاثة أدلة من بيئتك على وحدانية الله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=7"]]}, {"no": 11, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "من دلائل وحدانية الله تعالى", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "37-41", "f": [["عنوان الدرس", "من دلائل وحدانية الله تعالى"], ["نواتج التعلم", "1. يوضح دلالة الفطرة على وحدانية الله (اللجوء إليه عند الشدة)\n2. يبين آثار التوحيد في سلوك المسلم\n3. يقيم تصرفات في ضوء فهمه للدرس"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص39-41\nالمصحف الشريف\nبطاقات مواقف"], ["التهيئة (5 دقائق)", "سؤال: ماذا يفعل الإنسان إذا أصابه خطر في البحر؟"], ["إجراءات التنفيذ (20 دقيقة)", "دليل الفطرة (10 دقائق):\n- ﴿وَإِذَا مَسَّكُمُ ٱلضُّرُّ فِي ٱلۡبَحۡرِ ضَلَّ مَن تَدۡعُونَ إِلَّآ إِيَّاهُۖ …﴾\n- الإنسان بفطرته يلجأ إلى من يملك النفع والضر، وهو الله وحده\n- كتابة قصة قصيرة لرجل يسافر على سفينة ويواجه عاصفة\n\nآثار التوحيد (10 دقائق):\n- التوكل على الله، والإخلاص، والطمأنينة، وعدم الخوف من غيره، والاستقامة\n- تقييم مواقف: لجوء إلى الأحجبة والتمائم، دعاء غير الله، التوكل مع الأخذ بالأسباب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) إلى من يلجأ الإنسان بفطرته عند الشدة؟\nالإجابة النموذجية: إلى الله وحده\n2) (تطبيق) اذكر أثرين للتوحيد في سلوك المسلم.\nالإجابة النموذجية: التوكل على الله، والإخلاص في العمل\n3) (استدلال) ما رأيك في من يعلّق تميمة لتحميه من الضرر؟\nالإجابة النموذجية: تصرف خاطئ يخالف التوحيد، لأن النفع والضر بيد الله وحده"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من آية الإسراء ما يدل على الفطرة.\nالإجابة النموذجية: ﴿… ضَلَّ مَن تَدۡعُونَ إِلَّآ إِيَّاهُۖ …﴾\n2) (تطبيق) كيف يجمع المسلم بين التوكل والأخذ بالأسباب؟\nالإجابة النموذجية: يعمل ويجتهد ويأخذ بالأسباب ثم يفوض النتيجة إلى الله\n3) (استدلال) اكتب نصيحة لزميل يخاف من المستقبل في ضوء التوحيد.\nالإجابة النموذجية: نصيحة تذكّره بأن الأمر بيد الله وتدعوه إلى التوكل والعمل"], ["الغلق (3 دقائق)", "ترديد جماعي: لا إله إلا الله وحده لا شريك له"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=7"]]}, {"no": 12, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام", "k": 1, "n": 3, "wi": 4, "wn": 4, "pages": "42-46", "f": [["عنوان الدرس", "أنواع الصيام"], ["نواتج التعلم", "1. يميز بين أنواع الصيام (الواجب، المندوب، المحرم، المكروه)\n2. يذكر أمثلة لكل نوع\n3. يعرّف أيام البيض وأيام التشريق\n4. يستخرج من الأحاديث أمثلة للصيام المحرم ويعلل سبب التحريم\n5. يبين الحكمة من النهي عن صيام بعض الأيام\n6. يستنتج يسر الشريعة وسماحتها"], ["الاستراتيجيات", "الحوار والمناقشة\nالجدول التصنيفي\nالتعلم التعاوني\nالتدبر والاستنتاج"], ["مصادر التعلم", "كتاب الطالب ص42-44\nجدول التصنيف\nتقويم هجري\nكتاب الطالب ص45\nبطاقات الأحاديث\nالسبورة"], ["التهيئة (5 دقائق)", "- قراءة حوار أحمد ووالديه وهما يصومان الست من شوال\n- سؤال: هل الصيام مقصور على رمضان؟"], ["إجراءات التنفيذ (20 دقيقة)", "الواجب والمندوب (5 دقائق):\n- الواجب: يثاب فاعله ويعاقب تاركه، مثل صيام رمضان وقضائه وصيام الكفارات والنذر\n- المندوب: يثاب فاعله ولا يعاقب تاركه، مثل الاثنين والخميس وأيام البيض وست من شوال\n- أيام البيض: 13 و14 و15 من كل شهر قمري\n\nالمحرم والمكروه (5 دقائق):\n- المحرم: صيام يومي العيدين\n- المكروه: صيام أيام التشريق، وإفراد يوم الجمعة بالصيام دون سبب\n- أيام التشريق: الأيام الثلاثة التي تلي العاشر من ذي الحجة\n- تعبئة جدول الكتاب\n\nالأحاديث (5 دقائق):\n- عن أبي سعيد الخدري: نهى رسول الله ﷺ عن صيام يومين: يوم الفطر ويوم الأضحى\n- سبب التحريم: لأنهما يوما فرح وأكل وشكر لله\n- النهي عن صيام الدهر: «لا صام من صام الأبد» لما فيه من مشقة تتعارض مع يسر الشريعة\n\nالحكمة (5 دقائق):\n- الحكمة: التوازن بين حق الله وحق النفس، ومشاركة المسلمين فرحتهم\n- نقاش: الاعتدال في العبادة\n- تطبيق على حالات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الصيام الواجب؟\nالإجابة النموذجية: الصيام الذي يثاب فاعله ويعاقب تاركه، كصيام رمضان\n2) (تطبيق) اذكر مثالين للصيام المندوب.\nالإجابة النموذجية: صيام يومي الاثنين والخميس، وأيام البيض (أو ست من شوال)\n3) (استدلال) ما أيام البيض؟\nالإجابة النموذجية: الثالث عشر والرابع عشر والخامس عشر من كل شهر قمري\n\n4) (معرفة) ما اليومان اللذان نهى النبي ﷺ عن صيامهما؟\nالإجابة النموذجية: يوم الفطر ويوم الأضحى\n5) (تطبيق) علل تحريم صيامهما.\nالإجابة النموذجية: لأنهما يوما عيد وفرح وأكل وشكر لله\n6) (استدلال) لماذا نُهي عن صيام الدهر؟\nالإجابة النموذجية: لما فيه من مشقة تتعارض مع يسر الشريعة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم صيام يوم العيد؟\nالإجابة النموذجية: محرم\n2) (تطبيق) ما أيام التشريق؟\nالإجابة النموذجية: الأيام الثلاثة التي تلي العاشر من ذي الحجة\n3) (استدلال) صنّف: (صيام نذر، صيام يوم الجمعة منفردًا بلا سبب).\nالإجابة النموذجية: صيام النذر: واجب، الجمعة منفردًا: مكروه\n\n4) (معرفة) ما الحكمة من مشروعية الصيام المندوب؟\nالإجابة النموذجية: زيادة الأجر وتعويد النفس على الطاعة\n5) (تطبيق) صنّف: (صيام ست من شوال، صيام يوم الأضحى).\nالإجابة النموذجية: الأول مندوب، والثاني محرم\n6) (استدلال) ماذا تقول لصديق يريد صيام يوم العيد طلبًا للأجر؟\nالإجابة النموذجية: أنصحه بأن صيامه محرم، وأن الأجر في الفرح وشكر الله وصلة الرحم"], ["الغلق (3 دقائق)", "خريطة مفاهيم لأنواع الصيام الأربعة"], ["الواجب المنزلي", "لوّن على تقويم شهر ذي الحجة أيام الصيام المندوب والمحرم والمكروه.\nاكتب مثالًا لكل نوع من أنواع الصيام.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=8"]]}, {"no": 13, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام", "k": 2, "n": 3, "wi": 1, "wn": 4, "pages": "42-46", "f": [["عنوان الدرس", "أنواع الصيام"], ["نواتج التعلم", "1. يميز بين أنواع الصيام من خلال النصوص الشرعية\n2. يحدد أيام الصيام بأنواعه على التقويم\n3. يقوّم تعلمه في درس أنواع الصيام"], ["الاستراتيجيات", "التعلم التعاوني\nالمسابقة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص46 (أقيّم تعلمي)\nتقويم هجري ملون\nبطاقات النصوص"], ["التهيئة (5 دقائق)", "سؤال سريع: صنّف ثلاثة أيام يذكرها المعلم"], ["إجراءات التنفيذ (20 دقيقة)", "استخراج الأنواع من النصوص (10 دقائق):\n- «من صام في كل شهر ثلاثة أيام فكأنما صام الدهر» (مندوب)\n- نصوص أخرى في الكتاب\n- تحديد النوع والتعليل\n\nالتطبيق على التقويم (10 دقائق):\n- تلوين التقويم: الواجب، المندوب، المكروه بالبرتقالي، المحرم بالأحمر\n- مسابقة سريعة بين المجموعات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج نوع الصيام: «من صام في كل شهر ثلاثة أيام فكأنما صام الدهر».\nالإجابة النموذجية: صيام مندوب\n2) (تطبيق) ما حكم صيام قضاء رمضان؟\nالإجابة النموذجية: واجب\n3) (استدلال) ما حكم صيام يوم الحادي عشر من ذي الحجة؟\nالإجابة النموذجية: مكروه (من أيام التشريق)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتّب أنواع الصيام من حيث الحكم في جدول: (واجب، مندوب، مكروه، محرم) مع مثال لكل.\nالإجابة النموذجية: واجب: رمضان، مندوب: الاثنين والخميس، مكروه: أيام التشريق، محرم: يوما العيدين\n2) (تطبيق) لماذا نُهي عن إفراد الجمعة بالصيام؟\nالإجابة النموذجية: لأنه يوم عيد للمسلمين الأسبوعي فيُكره إفراده بالصيام دون سبب\n3) (استدلال) اقترح خطة لصيام مندوب تلتزم بها في شهر.\nالإجابة النموذجية: خطة واقعية مثل صيام الاثنين والخميس أو أيام البيض"], ["الغلق (3 دقائق)", "كل طالب يحدد يومًا مندوبًا سيصومه"], ["الواجب المنزلي", "حل أنشطة (أقيّم تعلمي).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=10"]]}, {"no": 14, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام", "k": 3, "n": 3, "wi": 2, "wn": 4, "pages": "42-46", "f": [["عنوان الدرس", "أنواع الصيام"], ["نواتج التعلم", "1. يربط بين أنواع الصيام وحِكَمها\n2. يطبق أحكام الصيام في مواقف حياتية\n3. يقدّر عناية الإسلام بالتوازن بين العبادة وحاجات الإنسان"], ["الاستراتيجيات", "لعب الأدوار\nحل المشكلات\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص42-46\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "- موقف: صديق قرر أن يصوم كل يوم دون انقطاع ليكسب أجرًا أكبر\n- سؤال: ما رأيك؟"], ["إجراءات التنفيذ (20 دقيقة)", "مواقف تطبيقية (10 دقائق):\n- لعب أدوار لمواقف: نذر صيام ثلاثة أيام، صيام يوم العيد، صيام الجمعة منفردًا، صيام الست من شوال\n- تحديد الحكم مع الدليل\n\nالحكمة والتوازن (10 دقائق):\n- لكل نوع حكمة: الواجب تزكية وطاعة، المندوب زيادة أجر، المحرم والمكروه رحمة ودفع مشقة\n- ربط بالاعتدال في العبادة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) نذر محمد أن يصوم يومين إن نجح، فما حكم صيامهما؟\nالإجابة النموذجية: واجب الوفاء بالنذر\n2) (تطبيق) ما الحكمة من صيام الست من شوال؟\nالإجابة النموذجية: زيادة الأجر واتباع سنة النبي ﷺ\n3) (استدلال) ما حكم صيام يوم الثاني عشر من ذي الحجة؟\nالإجابة النموذجية: مكروه لأنه من أيام التشريق"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف يدل النهي عن صيام الدهر على الاعتدال؟\nالإجابة النموذجية: لأنه يمنع المشقة ويوازن بين العبادة وحقوق النفس\n2) (تطبيق) بماذا تنصح صديقًا فاته صيام أيام من رمضان بعذر؟\nالإجابة النموذجية: أنصحه بقضائها قبل رمضان القادم\n3) (استدلال) ما الفرق بين المكروه والمحرم في الثواب والعقاب؟\nالإجابة النموذجية: المكروه يثاب تاركه ولا يعاقب فاعله، والمحرم يثاب تاركه ويعاقب فاعله"], ["الغلق (3 دقائق)", "تلخيص الدرس في خريطة ذهنية"], ["الواجب المنزلي", "اكتب موقفًا من حياتك يرتبط بأحد أنواع الصيام.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=10"]]}, {"no": 15, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "التخطيط للهجرة النبوية", "k": 1, "n": 2, "wi": 3, "wn": 4, "pages": "47-52", "f": [["عنوان الدرس", "التخطيط للهجرة النبوية"], ["نواتج التعلم", "1. يسترجع أحداث ما قبل الهجرة (تهيئة يثرب للمسلمين)\n2. يوضح سبب اجتماع قريش في دار الندوة وما اتفقوا عليه\n3. يبين كيف واجه النبي ﷺ مكيدة قريش بالتخطيط"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالخط الزمني"], ["مصادر التعلم", "كتاب الطالب ص47-49\nخريطة الطريق بين مكة ويثرب\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤالا الأب لولديه: كيف هيأ الرسول ﷺ يثرب للمسلمين قبل الهجرة؟ علل تأخره ﷺ عن أصحابه في الخروج"], ["إجراءات التنفيذ (20 دقيقة)", "مكيدة قريش (10 دقائق):\n- إحساس قريش بخطر هجرة المسلمين وبيعة أهل يثرب\n- قلقهم على مصالحهم الدينية والتجارية والاجتماعية\n- اجتماعهم في دار الندوة لحسم أمر النبي ﷺ والاتفاق على قتله\n\nبداية الخطة (10 دقائق):\n- أوحى الله إلى نبيه بمكيدتهم وأمره بالخروج\n- وضع ﷺ خطة محكمة\n- قصد بيت أبي بكر واختاره رفيقًا\n- الدرس: الأخذ بالأسباب من حسن التوكل على الله"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا قلقت قريش من هجرة المسلمين؟\nالإجابة النموذجية: خوفًا من أن تكون للإسلام قوة تهدد مصالحهم الدينية والتجارية والاجتماعية\n2) (تطبيق) أين اجتمع زعماء قريش؟\nالإجابة النموذجية: في دار الندوة\n3) (استدلال) من اختاره النبي ﷺ رفيقًا في الهجرة؟\nالإجابة النموذجية: أبو بكر الصديق رضي الله عنه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) علل تأخر النبي ﷺ عن أصحابه في الخروج.\nالإجابة النموذجية: انتظارًا لأمر الله بالهجرة وليطمئن على خروج أصحابه\n2) (تطبيق) ما الذي يعلمنا إياه تخطيط النبي ﷺ للهجرة؟\nالإجابة النموذجية: أن الأخذ بالأسباب من حسن التوكل على الله\n3) (استدلال) ما الرأي الذي أجمع عليه كفار قريش؟\nالإجابة النموذجية: التخلص من النبي ﷺ بقتله"], ["الغلق (3 دقائق)", "خط زمني مختصر لأحداث ما قبل الخروج"], ["الواجب المنزلي", "اكتب ثلاثة أمور تخطط بها لنجاحك في الاختبار، مستفيدًا من الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=11"]]}, {"no": 16, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "التخطيط للهجرة النبوية", "k": 2, "n": 2, "wi": 4, "wn": 4, "pages": "47-52", "f": [["عنوان الدرس", "التخطيط للهجرة النبوية"], ["نواتج التعلم", "1. يحدد عناصر خطة الهجرة (التوقيت، الطريق، المهام، الدليل)\n2. يزاوج بين الشخصيات والمهام التي قامت بها\n3. يستنتج دروسًا من التخطيط للهجرة"], ["الاستراتيجيات", "التعلم التعاوني\nالأدوار الموزعة\nالخرائط الذهنية"], ["مصادر التعلم", "كتاب الطالب ص49-52\nبطاقات الشخصيات والمهام\nخريطة"], ["التهيئة (5 دقائق)", "مشهدان من الكتاب: تأمّل وأجب عن الأسئلة"], ["إجراءات التنفيذ (20 دقيقة)", "عناصر الخطة (10 دقائق):\n- الخروج ليلًا متخفيين\n- اللجوء إلى غار ثور أيامًا\n- علي بن أبي طالب: أداء الأمانات إلى أهلها وفاءً بحقهم\n- أبو بكر: شراء راحلتين، وتكليف أهل بيته بنقل الزاد والأخبار ومحو الآثار\n- استئجار دليل أمين خبير يسلك طريقًا غير معتاد\n\nالمزاوجة والدروس (10 دقائق):\n- مزاوجة الشخصيات بمهامها (من الكتاب ومصادر التعلم)\n- الدروس: التخطيط، الكتمان، توزيع المهام، الأمانة، الثقة بالله"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما المهمة التي كلّف بها النبي ﷺ علي بن أبي طالب؟\nالإجابة النموذجية: أداء أمانات الناس التي كانت عند النبي ﷺ\n2) (تطبيق) لماذا لجأ النبي ﷺ وصاحبه إلى غار ثور؟\nالإجابة النموذجية: ليبقيا فيه أيامًا حتى يهدأ الطلب ويتمكنا من السير بأمان\n3) (استدلال) لماذا استأجر أبو بكر دليلًا خبيرًا؟\nالإجابة النموذجية: ليسلك بهما طريقًا غير معتاد فلا يدركهما الكفار"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مهمتين كلّف بهما أبو بكر أهل بيته.\nالإجابة النموذجية: توصيل الزاد والأخبار، ومحو آثارهما في الطريق\n2) (تطبيق) ما الذي يدل عليه رد النبي ﷺ الأمانات رغم عداوة قريش؟\nالإجابة النموذجية: عظيم أمانته ووفائه بالحقوق حتى مع أعدائه\n3) (استدلال) استخرج درسين من التخطيط للهجرة.\nالإجابة النموذجية: التخطيط وتوزيع المهام، والتوكل على الله مع الأخذ بالأسباب"], ["الغلق (3 دقائق)", "خريطة ذهنية لخطة الهجرة"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=11"]]}, {"no": 17, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 3, "n": 6, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآية (31) من سورة المدثر تلاوة صحيحة\n2. يحفظ الآية (31) حفظًا متقنًا\n3. يوضح معاني: فتنة، ليستيقن، مرض، جنود ربك"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتقسيم المقطعي\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- تسميع الآيات (26-30)\n- تنبيه: الآية (31) طويلة فنحفظها مقاطع"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآية (31) على مقاطع ومحاكاة كل مقطع\n- ملاحظة الوقف المناسب عند علامات الوقف\n\nالحفظ والمعاني (10 دقائق):\n- حفظ المقاطع ثم ربطها\n- معاني: فتنة (اختبار وابتلاء)، ليستيقن (ليتأكد ويزداد يقينًا)، في قلوبهم مرض (شك ونفاق)، جنود ربك (الملائكة وغيرهم مما لا يعلمه إلا الله)، ذكرى للبشر (موعظة)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿وَمَا جَعَلۡنَآ أَصۡحَٰبَ ٱلنَّارِ إِلَّا …﴾\nالإجابة النموذجية: مَلَٰٓئِكَةٗ\n2) (تطبيق) ما معنى (فتنة) في الآية؟\nالإجابة النموذجية: اختبار وابتلاء\n3) (استدلال) من الذين يزدادون إيمانًا بذكر عدة الملائكة؟\nالإجابة النموذجية: الذين آمنوا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (وما يعلم جنود ربك إلا هو)؟\nالإجابة النموذجية: لا يعلم عدد جنود الله وأنواعهم إلا هو سبحانه\n2) (تطبيق) ما معنى (وما هي إلا ذكرى للبشر)؟\nالإجابة النموذجية: ما هي إلا موعظة للناس\n3) (استدلال) سمّع الآية (31).\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (26-31)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-31).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=12"]]}, {"no": 18, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "من آداب الأسواق", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "53-59", "f": [["عنوان الدرس", "من آداب الأسواق"], ["نواتج التعلم", "1. يتعرف أهمية الأسواق في حياة الناس\n2. يستنتج آداب السوق من قصة زيارة سوق نزوى\n3. يميز التصرفات الصحيحة من الخاطئة في السوق"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص53-56\nصور لسوق نزوى والهبطة\nجهاز عرض"], ["التهيئة (5 دقائق)", "- تأمل مشهد الكتاب: التحية بين البائع والمشتري قبيل العيد\n- ما الهبطة؟ (سوق مفتوح لعرض السلع قبيل العيد من الإرث العماني)"], ["إجراءات التنفيذ (20 دقيقة)", "قصة سوق نزوى (10 دقائق):\n- إلقاء السلام على الباعة، والتاجر يأمر بفرز الفاسد وعدم عرضه، ومراعاة المشترين في الأسعار، وعدم تطفيف الميزان\n- التنقل بانسياب وتجنب الزحام\n- المفاوضة بلطف دون رفع الصوت\n\nآداب مستنتجة (10 دقائق):\n- عدم مدّ اليد إلى المعروضات دون استئذان، والحذر على بضائع الناس، والمسارعة إلى الصلاة بسكينة عند الأذان\n- تدوين الآداب في جدول"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا يحتاج الناس إلى الأسواق؟\nالإجابة النموذجية: لتبادل السلع وتلبية حاجاتهم من الطعام والكساء وغيرها\n2) (تطبيق) اذكر أدبين من آداب البائع في القصة.\nالإجابة النموذجية: الأمانة بفرز الفاسد وعدم عرضه، وعدم تطفيف الميزان\n3) (استدلال) ما الخطأ الذي نبّه الأب ابنه إليه؟\nالإجابة النموذجية: مدّ يده إلى المعروضات دون استئذان"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر أدبين من آداب المشتري.\nالإجابة النموذجية: إلقاء السلام، والمفاوضة بلطف دون رفع الصوت (أو تجنب الزحام)\n2) (تطبيق) ما الهبطة؟\nالإجابة النموذجية: سوق مفتوح لعرض السلع المختلفة قبيل العيد في عمان، من الإرث العماني\n3) (استدلال) ماذا فعل الناس في السوق عند سماع الأذان؟\nالإجابة النموذجية: مشوا إلى الصلاة بسكينة ووقار"], ["الغلق (3 دقائق)", "كل مجموعة تختار أهم أدب وتعلل اختيارها"], ["الواجب المنزلي", "اكتب ثلاثة آداب ستلتزم بها في زيارتك القادمة للسوق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=13"]]}, {"no": 19, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "من آداب الأسواق", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "53-59", "f": [["عنوان الدرس", "من آداب الأسواق"], ["نواتج التعلم", "1. يستخرج آداب السوق من النصوص الشرعية\n2. يتعرف الضوابط الأخلاقية والشرعية للتسوق الإلكتروني\n3. يستنتج دلالة بناء النبي ﷺ المسجد ثم السوق في المدينة"], ["الاستراتيجيات", "التدبر والاستنتاج\nالتعلم التعاوني\nحل المشكلات"], ["مصادر التعلم", "كتاب الطالب ص56-59\nبطاقات النصوص الشرعية\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: هل تسوقت عبر الإنترنت؟ ما الذي يجب أن تنتبه إليه؟"], ["إجراءات التنفيذ (20 دقيقة)", "النصوص الشرعية (10 دقائق):\n- ﴿وَيۡلٞ لِّلۡمُطَفِّفِينَ﴾ (الوفاء بالكيل والميزان)\n- «رحم الله رجلًا سمحًا إذا باع وإذا اشترى وإذا اقتضى» (السماحة)\n- تحريم الغش\n- إرجاع كل نص إلى أدبه\n\nالتسوق الإلكتروني ودلالة البناء (10 دقائق):\n- ضوابط: الصدق في وصف السلعة، الأمانة، عدم شراء المحرم، الحفاظ على البيانات، الالتزام بالسداد\n- بدأ النبي ﷺ ببناء المسجد ثم السوق: ربط المعاملات بالأخلاق والعبادة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الأدب المستفاد من قوله تعالى: ﴿وَيۡلٞ لِّلۡمُطَفِّفِينَ﴾؟\nالإجابة النموذجية: الوفاء بالكيل والميزان وعدم إنقاصهما\n2) (تطبيق) اذكر ضابطين للتسوق الإلكتروني.\nالإجابة النموذجية: الصدق في وصف السلعة، والأمانة في السداد (أو حفظ البيانات)\n3) (استدلال) ما المقصود بالسماحة في البيع والشراء؟\nالإجابة النموذجية: التيسير وحسن المعاملة وعدم التشدد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما دلالة بناء النبي ﷺ المسجد قبل السوق؟\nالإجابة النموذجية: أن تقوم المعاملات على الأخلاق والعبادة وتقوى الله\n2) (تطبيق) ما حكم الغش في البيع؟\nالإجابة النموذجية: محرم\n3) (استدلال) أشار عليك صديق بشراء سلعة إلكترونيًا بوصف كاذب ليربح، بماذا تنصحه؟\nالإجابة النموذجية: أنصحه بالصدق في الوصف لأن الغش محرم ويمحق البركة"], ["الغلق (3 دقائق)", "قائمة صفية بآداب السوق الواقعي والإلكتروني"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=13"]]}, {"no": 20, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "مقدمة في أحكام النون الساكنة والتنوين", "k": 1, "n": 2, "wi": 4, "wn": 4, "pages": "61-65", "f": [["عنوان الدرس", "مقدمة في أحكام النون الساكنة والتنوين"], ["نواتج التعلم", "1. يسترجع أحكام الميم الساكنة ويستخرجها من الآيات\n2. يعرّف النون الساكنة والتنوين\n3. يفرق بين النون الساكنة والتنوين"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتلاوة والمحاكاة\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص61-63\nالمصحف الشريف\nالسبورة"], ["التهيئة (5 دقائق)", "استخراج أحكام الميم الساكنة من آيتي الكتاب: ﴿وَلَا يُؤۡذَنُ لَهُمۡ فَيَعۡتَذِرُونَ﴾ و﴿ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ﴾"], ["إجراءات التنفيذ (20 دقيقة)", "التعريف (10 دقائق):\n- النون الساكنة: نون خالية من الحركة ثابتة لفظًا وخطًا، وصلًا ووقفًا، وتكون في الأسماء والأفعال والحروف، في وسط الكلمة وآخرها\n- التنوين: نون ساكنة زائدة تلحق آخر الاسم لفظًا وتفارقه خطًا ووقفًا\n\nالتمييز (10 دقائق):\n- أمثلة: (مِنْ، أَنْعَمْتَ، يَنْهَوْنَ) و(عليمٌ، رحيمًا، خوفٍ)\n- جدول مقارنة: النون الساكنة (في الأسماء والأفعال والحروف، تثبت خطًا ووقفًا) / التنوين (في الأسماء فقط، يُلفظ ولا يُكتب نونًا ولا يثبت وقفًا)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف النون الساكنة.\nالإجابة النموذجية: نون خالية من الحركة ثابتة لفظًا وخطًا وصلًا ووقفًا\n2) (تطبيق) عرّف التنوين.\nالإجابة النموذجية: نون ساكنة زائدة تلحق آخر الاسم لفظًا وتفارقه خطًا ووقفًا\n3) (استدلال) ما حكم الميم الساكنة في (أَطۡعَمَهُم مِّن)؟\nالإجابة النموذجية: إدغام متماثلين (إدغام شفوي)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج نونًا ساكنة وتنوينًا من: ﴿… وَءَامَنَهُم مِّنۡ خَوۡفِۭ﴾.\nالإجابة النموذجية: النون الساكنة في (مِنْ)، والتنوين في (خوفٍ)\n2) (تطبيق) اذكر فرقًا بين النون الساكنة والتنوين.\nالإجابة النموذجية: النون الساكنة تثبت خطًا ووقفًا، والتنوين لا يثبت خطًا ولا وقفًا\n3) (استدلال) هل يدخل التنوين على الأفعال؟\nالإجابة النموذجية: لا، يلحق الأسماء فقط"], ["الغلق (3 دقائق)", "كل طالب يكتب كلمة فيها نون ساكنة وأخرى فيها تنوين"], ["الواجب المنزلي", "استخرج خمس نونات ساكنة وخمسة تنوينات من سورة المدثر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=14"]]}, {"no": 21, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "مقدمة في أحكام النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 1, "wn": 4, "pages": "61-65", "f": [["عنوان الدرس", "مقدمة في أحكام النون الساكنة والتنوين"], ["نواتج التعلم", "1. يعدد أحكام النون الساكنة والتنوين الأربعة\n2. يقارن بين أحكام الميم الساكنة وأحكام النون الساكنة والتنوين\n3. يستخرج النون الساكنة والتنوين من آيات قرآنية"], ["الاستراتيجيات", "الخرائط الذهنية\nالتعلم التعاوني\nالتلاوة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص63-65\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "سؤال: كم حكمًا للميم الساكنة؟ اذكرها"], ["إجراءات التنفيذ (20 دقيقة)", "الأحكام الأربعة (10 دقائق):\n- الإظهار، والإدغام، والإقلاب، والإخفاء\n- الحكم يتحدد بالحرف الذي يلي النون الساكنة أو التنوين\n- استماع لأمثلة لكل حكم دون التفصيل\n\nالمقارنة (10 دقائق):\n- مجال المقارنة: عدد الأحكام (الميم ثلاثة، النون أربعة)، وجه الاشتراك (تتأثر بالحرف الذي يليها، وتشترك في الغنة من الخيشوم)\n- حل (أقيّم تعلمي)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عدّد أحكام النون الساكنة والتنوين.\nالإجابة النموذجية: الإظهار، والإدغام، والإقلاب، والإخفاء\n2) (تطبيق) بمَ يتحدد حكم النون الساكنة؟\nالإجابة النموذجية: بالحرف الذي يليها\n3) (استدلال) ما وجه الاشتراك بين الميم الساكنة والنون الساكنة؟\nالإجابة النموذجية: كلتاهما تتأثر بالحرف الذي يليها وفيهما غنة تخرج من الخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم حكمًا للميم الساكنة؟ وكم حكمًا للنون الساكنة؟\nالإجابة النموذجية: للميم ثلاثة، وللنون الساكنة والتنوين أربعة\n2) (تطبيق) صحح: التنوين يكتب نونًا في آخر الاسم.\nالإجابة النموذجية: التنوين يُلفظ نونًا ولا يُكتب نونًا\n3) (استدلال) استخرج من ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾ تنوينًا.\nالإجابة النموذجية: (يومئذٍ) و(يومٌ) و(عسيرٌ)"], ["الغلق (3 دقائق)", "خريطة ذهنية للأحكام الأربعة تُعلّق في الصف"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=14"]]}, {"no": 22, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 4, "n": 6, "wi": 2, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (32-40) تلاوة صحيحة مطبقًا ما تعلمه من أحكام النون الساكنة والتنوين\n2. يحفظ الآيات (32-40) حفظًا متقنًا\n3. يوضح معاني: أدبر، أسفر، لإحدى الكُبر، رهينة"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13-14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآية (31) وربطها بالآيات السابقة"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (32-40) ومحاكاة\n- ملاحظة التنوين في (نَفۡسِۭ بِمَا) وتلفّظه ميمًا مع الغنة، و(جَنَّٰتٖ يَتَسَآءَلُونَ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي (32-37) ثم (38-40)\n- معاني: إذ أدبر (ولّى وذهب)، أسفر (أضاء)، لإحدى الكبر (إحدى الدواهي العظيمة)، رهينة (محبوسة بعملها)، أصحاب اليمين (أهل الجنة)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿كُلُّ نَفۡسِۭ …﴾\nالإجابة النموذجية: ﴿كُلُّ نَفۡسِۭ بِمَا كَسَبَتۡ رَهِينَةٌ﴾\n2) (تطبيق) ما معنى (والصبح إذا أسفر)؟\nالإجابة النموذجية: أقسم الله بالصبح إذا أضاء وانكشف\n3) (استدلال) من المستثنون من الارتهان بأعمالهم في الآية (39)؟\nالإجابة النموذجية: أصحاب اليمين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱلَّيۡلِ إِذۡ أَدۡبَرَ﴾.\nالإجابة النموذجية: ﴿وَٱلصُّبۡحِ إِذَآ أَسۡفَرَ﴾\n2) (تطبيق) ما معنى (رهينة)؟\nالإجابة النموذجية: مرهونة محبوسة بعملها\n3) (استدلال) حدّد التنوين في ﴿فِي جَنَّـٰتٖ يَتَسَآءَلُونَ﴾.\nالإجابة النموذجية: (جنّاتٍ) بتنوين الكسر"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (32-40)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=15"]]}, {"no": 23, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 1, "n": 3, "wi": 3, "wn": 4, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (11-27) تلاوة صحيحة\n2. يتعرف سبب نزول الآيات في الوليد بن المغيرة\n3. يوضح النعم التي أنعم الله بها على الوليد\n4. يحلل موقف الوليد بن المغيرة من القرآن (التفكير والتقدير ثم الجحود)\n5. يصف الحالة النفسية للوليد عند تقوّله على القرآن\n6. يبين سبب إنكار الوليد أن يكون القرآن وحيًا"], ["الاستراتيجيات", "القصة\nالتلاوة النموذجية والمحاكاة\nالحوار والمناقشة\nالتحليل\nالتعلم التعاوني"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص66-68\nالمكتبة الصوتية\nكتاب الطالب ص68-69\nبطاقات أسئلة"], ["التهيئة (5 دقائق)", "سؤال: ماذا يجب على الإنسان إذا أنعم الله عليه بالمال والأبناء؟"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (11-27) ومحاكاة\n- التنبيه على الإظهار في (مَنۡ خَلَقۡتُ) والإدغام في (مَالٗا مَّمۡدُودٗا)\n\nقصة النزول (5 دقائق):\n- ذهاب الوليد إلى النبي ﷺ ليثنيه عن الدعوة، وسماعه القرآن ورقة قلبه\n- إغراء أبي جهل له ليقول سوءًا\n- النعم: مال ممدود، بنون شهود، تمهيد في الرزق والجاه\n\nالتفكير والتقدير (5 دقائق):\n- ﴿إِنَّهُۥ فَكَّرَ وَقَدَّرَ﴾: أطال التفكير ليجد ما يقوله في القرآن\n- ﴿ثُمَّ عَبَسَ وَبَسَرَ﴾: الحالة النفسية من الضيق والعبوس لما ضاقت عليه الحيل\n\nالجحود (5 دقائق):\n- ﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾\n- قوله: ﴿… إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ﴾\n- سبب الإنكار: الاستكبار والعناد وإرضاء قريش لا الجهل بالحق"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) فيمن نزلت الآيات (11-27)؟\nالإجابة النموذجية: في الوليد بن المغيرة\n2) (تطبيق) اذكر نعمتين أنعم الله بهما على الوليد.\nالإجابة النموذجية: المال الكثير، والأبناء الحاضرون معه\n3) (استدلال) ما معنى (ومهّدت له تمهيدًا)؟\nالإجابة النموذجية: بسطت له الرزق والجاه والرياسة\n\n4) (معرفة) صف الحالة النفسية للوليد كما صورتها الآيات.\nالإجابة النموذجية: ضيق وعبوس وتقطيب للوجه لما عجز عن إيجاد طعن مقنع\n5) (تطبيق) ماذا قال الوليد في القرآن بعد تفكيره؟\nالإجابة النموذجية: قال: إنه سحر يُؤثر وقول البشر\n6) (استدلال) ما سبب إنكار الوليد للقرآن رغم إعجابه به؟\nالإجابة النموذجية: الاستكبار عن قبول الحق ومجاراة قريش"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ماذا حدث للوليد عندما سمع القرآن أول مرة؟\nالإجابة النموذجية: رق قلبه وتراجع عما جاء من أجله\n2) (تطبيق) من الذي أغرى الوليد ليقول سوءًا في القرآن؟\nالإجابة النموذجية: أبو جهل\n3) (استدلال) أكمل: ﴿وَجَعَلۡتُ لَهُۥ …﴾\nالإجابة النموذجية: ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾\n\n4) (معرفة) اتلُ الآية التي تصور إعراض الوليد واستكباره.\nالإجابة النموذجية: ﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾\n5) (تطبيق) هل كان الوليد جاهلًا بقيمة القرآن؟ علل.\nالإجابة النموذجية: لا، فقد شهد بحلاوته وعلوه، لكنه استكبر وجحد\n6) (استدلال) ما الدرس المستفاد من موقف الوليد؟\nالإجابة النموذجية: أن الاستكبار يحرم صاحبه من الهداية رغم معرفته الحق"], ["الغلق (3 دقائق)", "كل مجموعة تكتب صفة سلبية للوليد وما يقابلها من صفة المؤمن"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (11-27).\nاكتب فقرة عن خطر الاستكبار على الإنسان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 24, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 2, "n": 3, "wi": 4, "wn": 4, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين عاقبة الاستكبار عن قبول الحق كما في الآيات\n2. يستخلص القيم والدروس المستفادة من الآيات\n3. يقوّم تعلمه في درس سورة المدثر (11-27)"], ["الاستراتيجيات", "التعلم التعاوني\nالمسابقة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص69-70 (أقيّم تعلمي)\nالمصحف الشريف\nبطاقات"], ["التهيئة (5 دقائق)", "سؤال: ما عاقبة من يرى الحق ويرفضه؟"], ["إجراءات التنفيذ (20 دقيقة)", "العاقبة (10 دقائق):\n- ﴿سَأُرۡهِقُهُۥ صَعُودًا﴾: عذاب شاق\n- ﴿سَأُصۡلِيهِ سَقَرَ﴾\n- ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾: تهويل لشأنها\n- نعم الله لم تزكِّ الوليد لأنه جحدها\n\nالقيم (10 دقائق):\n- شكر النعم باستعمالها في طاعة الله\n- قبول الحق والإنصاف\n- عدم الإعراض عن كتاب الله\n- حل (أقيّم تعلمي)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما عاقبة الوليد كما في الآيات؟\nالإجابة تدلال) ما الموقف الصحيح من الحق؟\nالإجابة النموذجية: قبوله والاعتراف به أيًّا كان قائله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف شعورك وأنت تتلو آيات وعيد المستكبرين.\nالإجابة النموذجية: الخوف من الله والحرص على التواضع وقبول الحق\n2) (تطبيق) اتلُ الآية التي تلي ﴿ثُمَّ نَظَرَ﴾.\nالإجابة النموذجية: ﴿ثُمَّ عَبَسَ وَبَسَرَ﴾\n3) (استدلال) استنتج دعوة الآيات للإنسان العاقل.\nالإجابة النموذجية: أن يتفكر بإنصاف ويقبل الحق ولا يستكبر عنه"], ["الغلق (3 دقائق)", "دعاء جماعي: اللهم أرنا الحق حقًا وارزقنا اتباعه"], ["الواجب المنزلي", "سمّع الآيات (11-27) لوالديك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 26, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 5, "n": 6, "wi": 2, "wn": 3, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (41-48) تلاوة صحيحة\n2. يحفظ الآيات (41-48) حفظًا متقنًا\n3. يوضح أسباب دخول المجرمين سقر كما ذكرتها الآيات"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (32-40)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (41-48) ومحاكاة\n- ملاحظة النون الساكنة في (تَنفَعُهُمۡ) والتنوين في (شَفَٰعَةُ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: ما سلككم (ما أدخلكم)، نخوض مع الخائضين (نتكلم بالباطل مع أهله)، اليقين (الموت)\n- أسباب دخول سقر: ترك الصلاة، وعدم إطعام المسكين، والخوض في الباطل، والتكذيب بيوم الدين"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿قَالُواْ لَمۡ …﴾\nالإجابة النموذجية: ﴿قَالُواْ لَمۡ نَكُ مِنَ ٱلۡمُصَلِّينَ﴾\n2) (تطبيق) ما معنى (اليقين) في الآية (47)؟\nالإجابة النموذجية: الموت\n3) (استدلال) اذكر سببين لدخول المجرمين سقر.\nالإجابة النموذجية: ترك الصلاة، وعدم إطعام المسكين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَلَمۡ نَكُ نُطۡعِمُ ٱلۡمِسۡكِينَ﴾.\nالإجابة النموذجية: ﴿وَكُنَّا نَخُوضُ مَعَ ٱلۡخَآئِضِينَ﴾\n2) (تطبيق) ما معنى (نخوض مع الخائضين)؟\nالإجابة النموذجية: نتكلم في الباطل مع أهله\n3) (استدلال) هل تنفع الشفاعة المجرمين؟\nالإجابة النموذجية: لا، ﴿فَمَا تَنفَعُهُمۡ شَفَٰعَةُ ٱلشَّـٰفِعِينَ﴾"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (41-48)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=17"]]}, {"no": 27, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 3, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أبي هريرة رضي الله عنه\n3. يوضح معنى ترك ما لا يعني وأثره في حسن الإسلام"], ["الاستراتيجيات", "الحوار والمناقشة\nالتكرار الموجّه\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص71-73\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- موقف: زميل يسأل عن أسرار غيره ويتدخل في كل شيء\n- سؤال: هل تحب هذا التصرف؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (10 دقائق):\n- نص الحديث: «من حسن إسلام المرء تركه ما لا يعنيه»\n- الراوي: أبو هريرة عبد الرحمن بن صخر الدوسي، أسلم سنة 7هـ، لزم النبي ﷺ فصار أكثر الصحابة رواية للحديث، وكُني بأبي هريرة لهرة وجدها فحملها في كمه\n\nالحفظ والمعنى (10 دقائق):\n- حفظ الحديث\n- يدع المسلم ما لا يفيده في دنياه وآخرته ويشتغل بما ينفعه\n- «احرص على ما ينفعك»\n- الأثر: تزكية النفس، حفظ الوقت، المسارعة في الخير، الجدية والعمل في المجتمع"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل الحديث: «من حسن إسلام المرء ...».\nالإجابة النموذجية: تركه ما لا يعنيه\n2) (تطبيق) من راوي الحديث؟\nالإجابة النموذجية: أبو هريرة رضي الله عنه\n3) (استدلال) لماذا كُني بأبي هريرة؟\nالإجابة النموذجية: لأنه وجد هرة فحملها في كمه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (ما لا يعنيه)؟\nالإجابة النموذجية: ما لا يفيده ولا يهمه في أمر دينه ودنياه\n2) (تطبيق) اذكر أثرين لترك ما لا يعني.\nالإجابة النموذجية: حفظ الوقت، وتزكية النفس (أو سلامة العلاقات)\n3) (استدلال) سمّع الحديث غيبًا.\nالإجابة النموذجية: تسميع صحيح"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=18"]]}, {"no": 28, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 2, "n": 2, "wi": 1, "wn": 4, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يحدد صورًا مما لا يعني المسلم (فضول النظر والكلام والاستماع)\n2. يميز بين ما يعنيه وما لا يعنيه من الأعمال\n3. يبين أن الأمر بالمعروف والنصح لا يدخلان فيما نهي عنه"], ["الاستراتيجيات", "التصنيف\nالتعلم التعاوني\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص73-75\nبطاقات أعمال\nالسبورة"], ["التهيئة (5 دقائق)", "الصندوق: عبارات (طلب العلم، مجادلة السفهاء، أداء العبادات، الجلوس في الطرقات، بر الوالدين، إتقان العمل، نشر الشائعات، عون الآخرين، تفتيش أجهزة الزملاء)"], ["إجراءات التنفيذ (20 دقيقة)", "الصور (10 دقائق):\n- فضول النظر والتطلع لما عند الآخرين، فضول الكلام، فضول الاستماع\n- ﴿وَٱلَّذِينَ هُمۡ عَنِ ٱللَّغۡوِ مُعۡرِضُونَ﴾\n- ﴿وَلَا تَقۡفُ مَا لَيۡسَ لَكَ بِهِۦ عِلۡمٌۚ …﴾\n\nالتمييز (10 دقائق):\n- تصنيف عبارات الصندوق: تعنينا (طلب العلم، العبادات، بر الوالدين، إتقان العمل، عون الآخرين) / لا تعنينا (مجادلة السفهاء، الجلوس في الطرقات، الشائعات، تفتيش أجهزة الزملاء)\n- الاستثناء: الأمر بالمعروف والنصح والإصلاح\n- الموقف في الكتاب والرد المناسب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر صورتين مما لا يعني المسلم.\nالإجابة النموذجية: فضول الكلام، والتطلع إلى ما عند الآخرين (أو فضول الاستماع)\n2) (تطبيق) صنّف: (تفتيش أجهزة الزملاء).\nالإجابة النموذجية: مما لا يعنيني فأتركه\n3) (استدلال) هل نصح الصديق إذا أخطأ مما لا يعنيني؟ ولماذا؟\nالإجابة النموذجية: لا، بل يعنيني، لأن النصح والإصلاح مستثنى مما نهى عنه الحديث"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنّف: (إتقان العمل، نشر الشائعات).\nالإجابة النموذجية: إتقان العمل يعنيني، نشر الشائعات لا يعنيني\n2) (تطبيق) ما المقصود بفضول الاستماع؟\nالإجابة النموذجية: الإصغاء إلى ما لا ينفع من أحاديث الناس وأسرارهم\n3) (استدلال) سألك زميل عن راتب والد زميل آخر، بماذا ترد؟\nالإجابة النموذجية: أذكّره بالحديث وأن هذا مما لا يعنينا"], ["الغلق (3 دقائق)", "كل طالب يكتب أمرًا سيتركه لأنه لا يعنيه"], ["الواجب المنزلي", "قارن بين مازن وخالد في نشاط الكتاب، وحل بقية الأنشطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=18"]]}, {"no": 29, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "معجزات الرسل عليهم السلام", "k": 1, "n": 1, "wi": 2, "wn": 4, "pages": "76-79", "f": [["عنوان الدرس", "معجزات الرسل عليهم السلام"], ["نواتج التعلم", "1. يعرّف المعجزة\n2. يذكر معجزات بعض الرسل (موسى وعيسى ومحمد عليهم السلام)\n3. يستنتج أن معجزات الرسل جاءت مناسبة لما برع فيه أهل زمانهم"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص76-79\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "قصة موسى عليه السلام مع فرعون والسحرة يوم الزينة"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم والقصة (10 دقائق):\n- المعجزة: أمر خارق للعادة مقرون بالتحدي سالم من المعارضة يؤيد الله به رسله\n- معجزات موسى: العصا التي صارت ثعبانًا مبينًا وتلقف ما صنع السحرة، واليد التي تخرج بيضاء للناظرين\n- إيمان السحرة\n\nالمناسبة (10 دقائق):\n- موسى: برع قومه في السحر فجاءت العصا\n- عيسى: برع قومه في الطب فأبرأ الأكمه والأبرص وأحيا الموتى بإذن الله\n- محمد ﷺ: برع العرب في الفصاحة فجاء القرآن\n- بيت السالمي في مشارق أنوار العقول عن إرسال الرسل مقرونين بالمعجزات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف المعجزة.\nالإجابة النموذجية: أمر خارق للعادة مقرون بالتحدي يعجز البشر عن الإتيان بمثله، يؤيد الله به رسله\n2) (تطبيق) اذكر معجزتين لموسى عليه السلام.\nالإجابة النموذجية: العصا التي تصير ثعبانًا، واليد البيضاء\n3) (استدلال) لماذا جاءت معجزة موسى من جنس السحر؟\nالإجابة النموذجية: لأن قومه برعوا في السحر فكانت المعجزة أبلغ في إقناعهم"], ["التقويم ال  للحروف\n\n4) (معرفة) أكمل: ﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ …﴾\nالإجابة النموذجية: ﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ أَشَدُّ وَطۡـٔٗا وَأَقۡوَمُ قِيلًا﴾\n5) (تطبيق) ما معنى (وتبتّل إليه تبتيلًا)؟\nالإجابة النموذجية: انقطع إلى عبادته انقطاعًا تامًا\n6) (استدلال) ما معنى (ناشئة الليل)؟\nالإجابة النموذجية: العبادة والقيام في الليل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿قُمِ ٱلَّيۡلَ إِلَّا قَلِيلٗا﴾.\nالإجابة النموذجية: ﴿نِّصۡفَهُۥٓ أَوِ ٱنقُصۡ مِنۡهُ قَلِيلًا﴾\n2) (تطبيق) ما المقصود بالقول الثقيل؟\nالإجابة النموذجية: القرآن الكريم بما فيه من أوامر وتكاليف عظيمة\n3) (استدلال) ما حكم النون الساكنة في (مِنۡهُ)؟\nالإجابة النموذجية: إظهار حلقي لأن بعدها الهاء\n\n4) (معرفة) اتلُ الآية التي تلي ﴿وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا﴾.\nالإجابة النموذجية: ﴿رَّبُّ ٱلۡمَشۡرِقِ وَٱلۡمَغۡرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذۡهُ وَكِيلٗا﴾\n5) (تطبيق) لماذا كانت عبادة الليل أشد وطئًا وأقوم قيلًا؟\nالإجابة النموذجية: لأن القلب يكون فارغًا من مشاغل الدنيا فيتواطأ مع اللسان\n6) (استدلال) ما معنى (فاتخذه وكيلًا)؟\nالإجابة النموذجية: اجعله كافيك وفوّض إليه أمورك"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-9)"], ["الواجب المنزلي", "احفظ الآيات (1-5).\nراجع حفظ الآيات (1-9).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=26\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=23"]]}, {"no": 36, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثانية", "title": "الاعتدال منهجي في الحياة", "k": 1, "n": 2, "wi": 1, "wn": 4, "pages": "92-96", "f": [["عنوان الدرس", "الاعتدال منهجي في الحياة"], ["نواتج التعلم", "1. يعرّف الاعتدال والغلو\n2. يستنتج من حديث «إن الدين يسر» منهج الإسلام في الاعتدال\n3. يبين صورًا من اعتدال النبي ﷺ في شخصيته وسلوكه"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص92-94\nبطاقات النصوص\nجهاز عرض"], ["التهيئة (5 دقائق)", "- صورة ميزان متوازن وآخر مائل\n- سؤال: أيهما يمثل حياة لاعتدال في الطعام؟"], ["إجراءات التنفيذ (20 دقيقة)", "المظاهر (10 دقائق):\n- المأكل والمشرب: ﴿… وَكُلُواْ وَٱشۡرَبُواْ وَلَا تُسۡرِفُوٓاْۚ …﴾\n- الإنفاق: ﴿وَٱلَّذِينَ إِذَآ أَنفَقُواْ لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ …﴾\n- الكلام: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت»\n- التوازن: ﴿وَٱبۡتَغِ فِيمَآ ءَاتَىٰكَ ٱللَّهُ ٱلدَّارَ ٱلۡأٓخِرَةَۖ وَلَا تَنسَ نَصِيبَكَ مِنَ ٱلدُّنۡيَاۖ …﴾\n\nالمواقف (10 دقائق):\n- الحكم على مواقف الكتاب: من يقضي يومه كله في الألعاب الإلكترونية، من يصوم ويقوم ويهمل دراسته، من يشتري كل ما يراه\n- اقتراح البديل المعتدل"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما مظهر الاعتدال في: ﴿… لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ …﴾؟\nالإجابة النموذجية: الاعتدال في الإنفاق\n2) (تطبيق) ما مظهر الاعتدال في حديث «فليقل خيرًا أو ليصمت»؟\nالإجابة النموذجية: الاعتدال في الكلام\n3) (استدلال) احكم: طالب يسهر على الألعاب الإلكترونية حتى الفجر.\nالإجابة النموذجية: تصرف غير معتدل يضر بصحته ودراسته وعبادته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج مظهر التوازن بين الدنيا والآخرة من آية القصص.\nالإجابة النموذجية: أن يبتغي المسلم الآخرة بما آتاه الله ولا ينسى نصيبه المباح من الدنيا\n2) (تطبيق) ضع دائرة على ما يتفق مع الاعتدال: (التبذير، الوسطية، البخل، التوازن).\nالإجابة النموذجية: الوسطية، والتوازن\n3) (استدلال) اقترح جدولًا يوميًا معتدلًا يجمع العبادة والدراسة والراحة.\nالإجابة النموذجية: جدول واقعي متوازن (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "شعار الصف: خير الأمور أوسطها في السلوك"], ["الواجب المنزلي", "حل أنشطة (أقيّم تعلمي).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=24"]]}, {"no": 38, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الإظهار الحلقي في النون الساكنة والتنوين", "k": 1, "n": 2, "wi": 3, "wn": 4, "pages": "99-103", "f": [["عنوان الدرس", "الإظهار الحلقي في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يعرّف الإظهار لغة واصطلاحًا\n2. يعدد حروف الإظهار الحلقي الستة\n3. يستخرج حروف الإظهار من بيتي تحفة الأطفال"], ["الاستراتي
