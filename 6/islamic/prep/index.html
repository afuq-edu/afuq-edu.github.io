بالمشاركة في الغزوات؟\nالإجابة النموذجية: في غزوة الخندق وعمره خمسة عشر عامًا\n3) (استدلال) ما الخلق الذي منعه من الإجابة في حديث النخلة؟\nالإجابة النموذجية: الأدب والحياء مع كبار الصحابة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) بمَ تميز عبدالله بن عمر في رواية الحديث؟\nالإجابة النموذجية: الدقة، فكان يرويه كما سمعه دون زيادة ولا نقص\n2) (تطبيق) ما الذي تستفيده من تأنيه في الفتوى؟\nالإجابة النموذجية: ألا أتعجل في الإجابة عما لا أعلم وأتحرى الدقة\n3) (استدلال) ما واجبنا تجاه الصحابة رضوان الله عليهم؟\nالإجابة النموذجية: محبتهم والترضي عنهم والاقتداء بهم"], ["الغلق (3 دقائق)", "خريطة ذهنية جماعية لصفات ابن عمر"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=45"]]}],[{"no": 1, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 1, "n": 6, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (1-7) من سورة المدثر تلاوة صحيحة مراعيًا مخارج الحروف (5 دقائق)\n2. يحفظ الآيات (1-7) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني المفردات: المدثر، فأنذر، فكبّر، الرجز (10 دقائق)\n4. يتلو الآيات (8-17) من سورة المدثر تلاوة صحيحة (5 دقائق)\n5. يحفظ الآيات (8-17) حفظًا متقنًا (5 دقائق)\n6. يوضح معاني: الناقور، عسير، وحيدًا، ممدودًا، شهودًا، صعودًا (10 دقائق)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتعلم التعاوني (التسميع الثنائي)\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص12\nالمكتبة الصوتية لمادة التربية الإسلامية\nالسبورة\nكتاب الطالب ص12-13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- الاستماع إلى تلاوة مجوّدة للآيات (1-7) من المكتبة الصوتية\n- سؤال: بمَ نادى الله تعالى نبيه في بداية السورة؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة والمحاكاة: تلاوة نموذجية من المعلم آية آية؛ محاكاة جماعية ثم فردية؛ تصويب النطق: الضاد والظاء، والراء في (فأنذر، فكبّر، فطهّر، فاهجر) (5 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: الحفظ بالتكرار المقطعي: الآيات (1-3) ثم (4-7)؛ معاني: المدثر (المتغطي بثيابه)، فأنذر (خوّف الناس عذاب الله)، فكبّر (عظّم ربك)، الرجز (الأوثان والمعاصي)، ولا تمنن تستكثر (لا تعطِ العطاء لتطلب أكثر منه) (4 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. التلاوة: تلاوة نموذجية للآيات (8-17) ومحاكاة؛ التنبيه على مخرج العين في (عسير، عنيدًا) والخاء في (خلقت) (4 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n4. الحفظ والمعاني: حفظ مقطعي (8-10) ثم (11-17)؛ معاني: الناقور (الصور)، عسير (شديد)، وحيدًا (منفردًا لا مال له ولا ولد حين خلقه)، ممدودًا (كثيرًا واسعًا)، بنين شهودًا (أبناء حاضرين معه)، سأرهقه صعودًا (سأكلفه عذابًا شاقًا) (4 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – نعم نشكرها في عمان: تذكر المجموعات النعم التي وردت في الآيات (8-17) من سورة المدثر كالمال والبنين، ثم تعدّد نعمًا ينعم بها أهل عمان وطريقة شكر كل نعمة بالمحافظة عليها (3 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿قُمۡ …﴾\nالإجابة النموذجية: ﴿قُمۡ فَأَنذِرۡ﴾\n2) (تطبيق) ما معنى (المدثر)؟\nالإجابة النموذجية: المتغطي بثيابه\n3) (استدلال) ما الحرف الذي يجب العناية بتفخيمه في ﴿وَثِيَابَكَ فَطَهِّرۡ﴾؟\nالإجابة النموذجية: الطاء في (فطهّر) تُنطق مفخمة لا تاءً، مع المحافظة على تشديد الهاء\n\n4) (معرفة) أكمل: ﴿فَذَٰلِكَ يَوۡمَئِذٖ …﴾\nالإجابة النموذجية: ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾\n5) (تطبيق) ما معنى (الناقور)؟\nالإجابة النموذجية: الصور الذي يُنفخ فيه يوم القيامة\n6) (استدلال) من الذي نزلت فيه الآيات (11-17)؟\nالإجابة النموذجية: الوليد بن المغيرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَرَبَّكَ فَكَبِّرۡ﴾.\nالإجابة النموذجية: ﴿وَثِيَابَكَ فَطَهِّرۡ﴾\n2) (تطبيق) ما معنى (فاهجر الرجز)؟\nالإجابة النموذجية: ابتعد عن الأوثان والمعاصي\n3) (استدلال) استنتج أمرين أمر الله بهما نبيه في الآيات.\nالإجابة النموذجية: إنذار الناس، وتعظيم الله تعالى (أو: تطهير الثياب، والصبر لله)\n\n4) (معرفة) اتلُ الآية التي تلي ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾.\nالإجابة النموذجية: ﴿وَبَنِينَ شُهُودٗا﴾\n5) (تطبيق) ما معنى (وبنين شهودًا)؟\nالإجابة النموذجية: أبناء حاضرين معه لا يغيبون عنه\n6) (استدلال) ما مخرج حرف الخاء في (خلقت)؟\nالإجابة النموذجية: أدنى الحلق"], ["الغلق (3 دقائق)", "تسميع ثنائي للآيات (8-17)"], ["الواجب المنزلي", "سمّع الآيات (1-7) لأحد أفراد أسرتك وراجعها يوميًا.\nسمّع الآيات (1-17) لأحد والديك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=3\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=1"]]}, {"no": 2, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 1, "n": 3, "wi": 2, "wn": 4, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يعرّف مخرج الحرف لغةً واصطلاحًا (5 دقائق)\n2. يعدد المخارج العامة الخمسة للحروف (10 دقائق)\n3. يطبق طريقة معرفة مخرج الحرف بنطقه ساكنًا أو مشددًا مسبوقًا بهمزة (5 دقائق)\n4. يحدد مخارج حروف الحلق الثلاثة (أقصاه، وسطه، أدناه) (10 دقائق)\n5. يحدد حروف الشفتين والخيشوم والجوف (5 دقائق)\n6. يطبق المخارج على كلمات من الآيات الكريمة (5 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالعرض العملي\nخرائط المفاهيم\nالتعلم التعاوني\nالبطاقات"], ["مصادر التعلم", "كتاب الطالب ص19-21\nرسم توضيحي لمخارج الحروف\nجهاز عرض\nكتاب الطالب ص21-22\nبطاقات الحروف\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض شكل مخارج الحروف في الكتاب\n- سؤال: ماذا تلاحظ في الشكل؟ من أين تخرج الأصوات؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. المفهوم: مخرج الحرف: محل خروج الحرف وتميّزه عن غيره بواسطة الصوت؛ قراءة حوار الجد وعبدالله؛ طريقة معرفة المخرج: ننطق الحرف ساكنًا أو مشددًا مسبوقًا بهمزة، فحيث ينقطع الصوت يكون مخرجه: أَخْ (الحلق)، أَرْ (اللسان) (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. المخارج العامة: الجوف، الحلق، اللسان، الشفتان، الخيشوم؛ خريطة مفاهيم للمخارج الخمسة مع مثال لكل مخرج؛ تطبيق الطريقة على حروف يختارها الطلبة (5 دقائق)\nالاستراتيجيات: العرض العملي.\n\n3. الحلق: أقصى الحلق: الهمزة والهاء؛ وسطه: العين والحاء؛ أدناه: الغين والخاء؛ تدريب على التمييز بين الحاء والهاء، والعين والهمزة (5 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الشفتان والخيشوم والجوف: الشفتان: الفاء والباء والميم والواو؛ الخيشوم: الغنة في النون والميم المشددتين؛ الجوف: حروف المد الثلاثة؛ تصنيف بطاقات الحروف في مجموعات حسب المخرج (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما مخرج الحرف؟\nالإجابة النموذجية: محل خروج الحرف الذي يتميز به عن غيره\n2) (تطبيق) كيف تعرف مخرج حرف الخاء؟\nالإجابة النموذجية: أنطقه ساكنًا مسبوقًا بهمزة (أَخْ) فينقطع الصوت عند الحلق\n3) (استدلال) عدّد المخارج العامة للحروف.\nالإجابة النموذجية: الجوف، والحلق، واللسان، والشفتان، والخيشوم\n\n4) (معرفة) ما الحرفان اللذان يخرجان من أقصى الحلق؟\nالإجابة النموذجية: الهمزة والهاء\n5) (تطبيق) ما الحرفان اللذان يخرجان من وسط الحلق؟\nالإجابة النموذجية: العين والحاء\n6) (استدلال) أين تخرج الغنة؟\nالإجابة النموذجية: من الخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) طبّق الطريقة على حرف الراء وحدّد مخرجه.\nالإجابة النموذجية: أَرْ، ومخرجها اللسان\n2) (تطبيق) ما مخرج حرفي الفاء والباء؟\nالإجابة النموذجية: الشفتان\n3) (استدلال) لماذا يحرص قارئ القرآن على معرفة مخارج الحروف؟\nالإجابة النموذجية: لينطق الحروف نطقًا صحيحًا فلا يتغير المعنى ولا يلحن في كتاب الله\n\n4) (معرفة) صنّف: (غ، ب، ح، م).\nالإجابة النموذجية: الغين: أدنى الحلق، الباء: الشفتان، الحاء: وسط الحلق، الميم: الشفتان\n5) (تطبيق) ما مخرج حروف المد؟\nالإجابة النموذجية: الجوف\n6) (استدلال) استخرج من ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾ حرفًا يخرج من الحلق وآخر من الشفتين.\nالإجابة النموذجية: من الحلق: العين في (عليهم)، ومن الشفتين: الميم في (أنعمت) (تقبل الأمثلة الصحيحة)"], ["الغلق (3 دقائق)", "لعبة: المعلم يذكر مخرجًا ويرفع الطلبة بطاقة حرف منه"], ["الواجب المنزلي", "حدّد مخرج خمسة حروف من سورة الفاتحة بالطريقة التي تعلمتها.\nاكتب حروف الحلق مرتبة من الأقصى إلى الأدنى.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=2"]]}, {"no": 3, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 2, "n": 3, "wi": 3, "wn": 4, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يميز بين الحروف المتقاربة في المخرج (الضاد والظاء) (20 دقيقة)\n2. يتعرف أثر اللهجة العامية في نطق بعض الحروف (القاف، الكاف، الجيم، الصاد) (15 دقيقة)\n3. ينطق هذه الحروف من مخارجها الصحيحة في الآيات (5 دقائق)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتعلم التعاوني\nتصحيح الأخطاء"], ["مصادر التعلم", "كتاب الطالب ص22-23\nالمكتبة الصوتية\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض كلمتي (الضالين) و(الظالين)\n- سؤال: هل المعنى واحد؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الضاد والظاء: (الضالين) بالضاد: المائلون عن الحق، و(الظالين) بالظاء: الدائمون والماكثون؛ تدريب على نطق الضاد في ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾ (10 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. أثر اللهجة: نماذج لأخطاء اللهجة: القاف تُنطق جيمًا أو غينًا، الكاف تُنطق شينًا، الجيم تُنطق ياءً، الصاد تُنطق سينًا؛ تلاوة آيات الكتاب ومحاكاة النطق الصحيح وكتابة مخرج كل حرف (10 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفرق في المعنى بين (الضالين) و(الظالين)؟\nالإجابة النموذجية: الضالين: المائلون عن الحق، الظالين: الدائمون الماكثون\n2) (تطبيق) اذكر حرفين تؤثر اللهجة العامية في نطقهما.\nالإجابة النموذجية: القاف والجيم (أو: الكاف، الصاد)\n3) (استدلال) لماذا يجب الحذر من أثر اللهجة في التلاوة؟\nالإجابة النموذجية: لأنه يؤدي إلى اللحن وقد يغيّر المعنى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما مخرج القاف؟\nالإجابة النموذجية: أقصى اللسان مع ما يحاذيه من الحنك الأعلى (اللسان)\n2) (تطبيق) انطق كلمة (قُلْ) نطقًا صحيحًا.\nالإجابة النموذجية: تُنطق القاف من مخرجها لا جيمًا ولا غينًا\n3) (استدلال) صحّح: قرأ زميلك (الصِّراط) بالسين.\nالإجابة النموذجية: الصواب الصِّراط بالصاد المفخمة"], ["الغلق (3 دقائق)", "تلاوة جماعية لسورة الفاتحة مع مراعاة المخارج"], ["الواجب المنزلي", "استمع لتلاوة سورة الفاتحة وسجّل حرفين تحتاج إلى تحسين نطقهما.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=2"]]}, {"no": 4, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 3, "n": 3, "wi": 4, "wn": 4, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يضع الحروف في مخارجها الصحيحة على المخطط (15 دقيقة)\n2. يكتشف الأخطاء التي قد يقع فيها القارئ في نطق الحروف (15 دقيقة)\n3. يقوّم تعلمه في درس مخارج الحروف (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم الذاتي\nالمسابقة"], ["مصادر التعلم", "كتاب الطالب ص24-25 (أقيّم تعلمي)\nمخطط المخارج\nبطاقات"], ["التهيئة (5 دقائق)", "سؤال سريع: عدد المخارج العامة بترتيبها من الداخل إلى الخارج"], ["إجراءات التنفيذ (20 دقيقة)", "1. أقيّم تعلمي (أولًا وثانيًا): وضع الكلمات والحروف في مكانها المناسب من المخطط: الشفتان، الغنة، النون المشددة؛ تصحيح جماعي (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أقيّم تعلمي (ثالثًا): كتابة الأخطاء المحتملة في نطق الكلمات الملونة في الآيات الكريمة (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – مخارج ولاياتنا: تنطق كل مجموعة أسماء ولايات عمانية كصحار وخصب وبهلاء وعبري ومطرح، وتحدد المخرج العام للحرف الأول من كل اسم، والفائز من يصيب أكثر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ضع الحرف في مخرجه: (و، ع، ن المشددة).\nالإجابة النموذجية: الواو: الشفتان (أو الجوف إن كانت مدية)، العين: وسط الحلق، الغنة في النون المشددة: الخيشوم\n2) (تطبيق) ما الخطأ المحتمل في نطق (الحمد)؟\nالإجابة النموذجية: نطق الحاء هاءً\n3) (استدلال) ما الخطأ المحتمل في نطق (عليهم)؟\nالإجابة النموذجية: نطق العين همزة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم مخرجًا في الحلق؟ وما حروف كل مخرج؟\nالإجابة النموذجية: ثلاثة: أقصاه (ء، هـ)، وسطه (ع، ح)، أدناه (غ، خ)\n2) (تطبيق) أي المخرجين يخرج منه حرف الميم: الشفتان أم الحلق؟\nالإجابة النموذجية: الشفتان\n3) (استدلال) صمم بطاقة تذكير بالمخارج الخمسة لتلصقها في مصحفك.\nالإجابة النموذجية: بطاقة صحيحة تضم المخارج الخمسة وأمثلتها"], ["الغلق (3 دقائق)", "كل طالب يكتب أكثر مخرج يحتاج إلى التدرب عليه"], ["الواجب المنزلي", "راجع درس مخارج الحروف وتدرب على نطق حروف الحلق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=2"]]}, {"no": 5, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 1, "n": 2, "wi": 1, "wn": 4, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (183-185) من سورة البقرة تلاوة صحيحة (20 دقيقة)\n2. يوضح معاني المفردات: كُتب، معدودات، يطيقونه، فدية (15 دقيقة)\n3. يبين حكم الصيام والغاية منه (التقوى) (5 دقائق)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص26-28\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- سؤال: عرّف الصيام في ضوء دراستك السابقة\n- إكمال التعريف: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس بنية"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية ومحاكاة للآيات الثلاث؛ تصويب المخارج والضبط (10 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. المعاني والفهم: كُتب: فُرض؛ لعلكم تتقون: الغاية من الصيام بلوغ التقوى؛ أيامًا معدودات: أيام شهر رمضان؛ الصيام عبادة خفية تحيي في النفس مراقبة الله (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى (كُتب عليكم الصيام)؟\nالإجابة النموذجية: فُرض عليكم الصيام\n2) (تطبيق) ما الغاية من الصيام كما في الآية (183)؟\nالإجابة النموذجية: التقوى\n3) (استدلال) كيف يربي الصيام التقوى في نفس المسلم؟\nالإجابة النموذجية: لأنه عبادة خفية بين العبد وربه يترك فيها شهواته طوعًا فتنمو فيه مراقبة الله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا …﴾\nالإجابة النموذجية: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ لَعَلَّكُمۡ تَتَّقُونَ﴾\n2) (تطبيق) ما المقصود بـ (أيامًا معدودات)؟\nالإجابة النموذجية: أيام شهر رمضان\n3) (استدلال) هل فُرض الصيام على المسلمين وحدهم؟ وما الدليل؟\nالإجابة النموذجية: لا، فُرض على من قبلنا، لقوله تعالى: ﴿… كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ …﴾"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (183)"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (183-185).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=4"]]}, {"no": 6, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 2, "n": 2, "wi": 2, "wn": 4, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين رخصة الفطر للمريض والمسافر ووجوب القضاء (15 دقيقة)\n2. يوضح حكم العاجز عن الصيام (الفدية) (5 دقائق)\n3. يستنتج يسر الإسلام من قوله تعالى: ﴿… يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ …﴾ (20 دقيقة)"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص28-31\nالمصحف الشريف\nبطاقات حالات"], ["التهيئة (5 دقائق)", "- قراءة قصة آمنة وجدتها التي تناولت الدواء في نهار رمضان\n- سؤال: لماذا أفطرت الجدة؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الرخص: المريض الذي يشق عليه الصيام أو يؤخر شفاءه يفطر ويقضي؛ المسافر يفطر ويقضي: ﴿… فَعِدَّةٞ مِّنۡ أَيَّامٍ أُخَرَۚ …﴾؛ العاجز عن الصيام بسبب مشقته الدائمة كالكبير الطاعن في السن: يُطعم عن كل يوم مسكينًا (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. اليسر وفضل رمضان: شهر رمضان أُنزل فيه القرآن هدى للناس؛ اليسر: الرخص رحمة من الله؛ تكميل العدة والتكبير شكرًا لله؛ حل أنشطة الكتاب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – دليل رمضان في عمان: تكتب كل مجموعة دليلًا قصيرًا لزائر يقضي رمضان في عمان، يربط حكمة الصيام (لعلكم تتقون) بعادات عمانية كالإفطار الجماعي في المساجد وصلاة التراويح (5 دقائق)\nالاستراتيجيات: الإنتاج السريع."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما حكم المريض مرضًا يشق معه الصيام؟\nالإجابة النموذجية: يجوز له الفطر وعليه القضاء بعدد الأيام التي أفطرها\n2) (تطبيق) ما الفدية؟ ومن يخرجها؟\nالإجابة النموذجية: إطعام مسكين عن كل يوم، يخرجها العاجز عن الصيام كالكبير الطاعن في السن\n3) (استدلال) ما فضل شهر رمضان كما ورد في الآية (185)؟\nالإجابة النموذجية: أُنزل فيه القرآن هدى للناس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل كل مرض يبيح الفطر؟ علّل.\nالإجابة النموذجية: لا، المبيح هو الذي يشق معه الصيام أو يزيده أو يؤخر شفاءه\n2) (تطبيق) استخرج من الآية (185) ما يدل على يسر الإسلام.\nالإجابة النموذجية: ﴿… يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ وَلَا يُرِيدُ بِكُمُ ٱلۡعُسۡرَ …﴾\n3) (استدلال) صنّف الحالات: (مسافر، شيخ كبير عاجز، مريض شُفي).\nالإجابة النموذجية: المسافر: يفطر ويقضي، الشيخ العاجز: يفدي، المريض: يقضي ما أفطره بعد شفائه"], ["الغلق (3 دقائق)", "كل مجموعة تكتب عبارة تلخص يسر الإسلام في الصيام"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=4"]]}, {"no": 7, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "ثواب العمل الصالح (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 4, "pages": "32-36", "f": [["عنوان الدرس", "ثواب العمل الصالح (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث الشريف قراءة صحيحة ويحفظه (5 دقائق)\n2. يعرّف براوي الحديث عبدالله بن عباس رضي الله عنهما (30 دقيقة)\n3. يوضح المقصود بالعينين اللتين لا تمسهما النار (5 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالقصة\nالتكرار الموجّه"], ["مصادر التعلم", "كتاب الطالب ص32-34\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- قراءة حوار منار وأبيها الذي يخرج ليلًا لعمله في حفظ الأمن\n- سؤال: ما أهمية عمل أبي منار؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الحديث والراوي: نص الحديث: «عينان لا تمسهما النار: عين بكت من خشية الله، وعين باتت تحرس في سبيل الله» (الترمذي)؛ الراوي: عبدالله بن عباس، ابن عم النبي ﷺ، حَبر الأمة، دعا له النبي: «اللهم فقهه في الدين وعلمه التأويل» (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الحفظ والفهم: حفظ الحديث بالتكرار؛ العين الأولى: عين مؤمن بكت خوفًا من الله ورجاء رحمته؛ العين الثانية: سهرت لمصالح المسلمين كحراسة الحدود وحفظ الأمن (10 دقائق)\nالاستراتيجيات: القصة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما صلة قرابة ابن عباس بالنبي ﷺ؟\nالإجابة النموذجية: ابن عمه\n2) (تطبيق) ما معنى (حبر الأمة)؟\nالإجابة النموذجية: عالمها الكبير\n3) (استدلال) أكمل: «عينان لا تمسهما النار: ...».\nالإجابة النموذجية: عين بكت من خشية الله، وعين باتت تحرس في سبيل الله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مثالًا معاصرًا لعين تبيت تحرس في سبيل الله.\nالإجابة النموذجية: رجال الشرطة والجيش الذين يحرسون الوطن ليلًا\n2) (تطبيق) لماذا كان لبكاء العين من خشية الله ثواب عظيم؟\nالإجابة النموذجية: لأنه دليل على صدق الإيمان واستشعار عظمة الله في الخلوة\n3) (استدلال) سمّع الحديث غيبًا.\nالإجابة النموذجية: تسميع صحيح"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه في دفترك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=5"]]}, {"no": 8, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "ثواب العمل الصالح (حديث شريف)", "k": 2, "n": 2, "wi": 4, "wn": 4, "pages": "32-36", "f": [["عنوان الدرس", "ثواب العمل الصالح (حديث شريف)"], ["نواتج التعلم", "1. يعرّف العمل الصالح في نظر الإسلام (5 دقائق)\n2. يستنتج أن الحديث ذكر العين وأراد الجسد كله، وذكر العملين مثالًا لا حصرًا (15 دقيقة)\n3. يربط بين الأعمال الصالحة وثوابها (20 دقيقة)"], ["الاستراتيجيات", "الربط بين السبب والنتيجة\nالتعلم التعاوني\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص34-36\nبطاقات أعمال وثواب\nالسبورة"], ["التهيئة (5 دقائق)", "عصف ذهني: اذكر عملًا صالحًا قمت به هذا الأسبوع"], ["إجراءات التنفيذ (20 دقيقة)", "1. مفهوم العمل الصالح: كل عمل نافع خالص لوجه الله تعالى؛ ذكر العين وأريد الجسد كله (تعبير مجازي)؛ العملان مثال لا حصر: ﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾؛ البكاء من خشية الله في الخلوة دليل صدق الإيمان، وصاحبه ممن يظلهم الله في ظله (8 دقائق)\nالاستراتيجيات: الربط بين السبب والنتيجة.\n\n2. الربط والتطبيق: نشاط الربط بين السبب والنتيجة في الكتاب؛ مجموعات: أعمال صالحة في البيت والمدرسة والمجتمع وثوابها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – حسنات في حارتنا: تتنافس المجموعات في تعداد أعمال صالحة يستطيع الطلبة أداءها في حارتهم العمانية، كتنظيف ساقية الفلج وغرس النخلة ومساعدة كبار السن، تطبيقًا لحديث ثواب العمل الصالح (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف العمل الصالح.\nالإجابة النموذجية: كل عمل نافع خالص لوجه الله تعالى\n2) (تطبيق) لماذا ذكر الحديث (العين) وهو يقصد الإنسان كله؟\nالإجابة النموذجية: تعبير مجازي من باب ذكر الجزء وإرادة الكل\n3) (استدلال) هل الثواب مقصور على هذين العملين؟ ولماذا؟\nالإجابة النموذجية: لا، ذُكرا على سبيل المثال، والمؤمن يثاب على كل عمل صالح ولو كان صغيرًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر ثلاثة أعمال صالحة يمكنك القيام بها.\nالإجابة النموذجية: مثل: بر الوالدين، ومساعدة زميل، والمحافظة على نظافة المسجد\n2) (تطبيق) ما جزاء من ذكر الله خاليًا ففاضت عيناه؟\nالإجابة النموذجية: من السبعة الذين يظلهم الله في ظله يوم لا ظل إلا ظله\n3) (استدلال) كيف تشكر من يسهرون على أمن وطنك؟\nالإجابة النموذجية: بالدعاء لهم واحترامهم والالتزام بالأنظمة (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "كل طالب يكتب عملًا صالحًا يعزم على فعله غدًا"], ["الواجب المنزلي", "سمّع الحديث وحل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=5"]]}, {"no": 9, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 2, "n": 6, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (18-25) تلاوة صحيحة (5 دقائق)\n2. يحفظ الآيات (18-25) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: قدّر، قُتل، عبس، بسر، يؤثر (10 دقائق)\n4. يتلو الآيات (26-30) تلاوة صحيحة (5 دقائق)\n5. يحفظ الآيات (26-30) حفظًا متقنًا (5 دقائق)\n6. يوضح معاني: سقر، لا تبقي ولا تذر، لوّاحة للبشر (10 دقائق)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (8-17) من عدد من الطلبة"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (18-25) ومحاكاة؛ العناية بمخرج الحاء في (سحر) والهاء في (هذا) (5 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: فكّر وقدّر (هيّأ في نفسه ما يقول في القرآن)، فقُتل (لُعن)، عبس (قطّب وجهه)، بسر (اشتد عبوسه)، سحر يؤثر (سحر يُنقل ويُروى عن السابقين) (4 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. التلاوة: تلاوة نموذجية للآيات (26-30) ومحاكاة؛ العناية بمخرج الصاد والقاف في (سأصليه سقر) والعين في (تسعة عشر) (4 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n4. الحفظ والمعاني: حفظ مقطعي؛ معاني: سقر (من أسماء جهنم)، لا تبقي ولا تذر (لا تترك شيئًا إلا أحرقته)، لوّاحة للبشر (تغيّر الجلود وتسوّدها)، تسعة عشر (خزنتها من الملائكة) (4 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – دوري ولايات التسميع: تحمل كل مجموعة اسم ولاية عمانية، فتسمّع الآيات (26-30) من سورة المدثر، وتسأل المجموعة المنافسة عن معنى كلمة منها، وتجمع النقاط لولايتها (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿فَقَالَ إِنۡ هَٰذَآ …﴾\nالإجابة النموذجية: ﴿فَقَالَ إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ﴾\n2) (تطبيق) ما معنى (عبس وبسر)؟\nالإجابة النموذجية: قطّب وجهه واشتد عبوسه\n3) (استدلال) اتلُ الآية التي تلي ﴿إِنَّهُۥ فَكَّرَ وَقَدَّرَ﴾.\nالإجابة النموذجية: ﴿فَقُتِلَ كَيۡفَ قَدَّرَ﴾\n\n4) (معرفة) أكمل: ﴿لَا تُبۡقِي …﴾\nالإجابة النموذجية: ﴿لَا تُبۡقِي وَلَا تَذَرُ﴾\n5) (تطبيق) ما معنى (سقر)؟\nالإجابة النموذجية: اسم من أسماء جهنم\n6) (استدلال) كم عدد خزنة جهنم المذكورين في الآية (30)؟\nالإجابة النموذجية: تسعة عشر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي قاله الوليد في القرآن كما في الآيتين (24-25)؟\nالإجابة النموذجية: قال إنه سحر يُؤثر، وإنه قول البشر\n2) (تطبيق) ما مخرج الحاء في (سحر)؟\nالإجابة النموذجية: وسط الحلق\n3) (استدلال) سمّع الآيات (18-25).\nالإجابة النموذجية: تسميع صحيح متقن\n\n4) (معرفة) اتلُ الآية التي تلي ﴿سَأُصۡلِيهِ سَقَرَ﴾.\nالإجابة النموذجية: ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾\n5) (تطبيق) ما معنى (لوّاحة للبشر)؟\nالإجابة النموذجية: تغيّر الجلود وتسوّدها\n6) (استدلال) سمّع الآيات (26-30).\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-30)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-25).\nراجع حفظ الآيات (1-30).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=9\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=6"]]}, {"no": 10, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "من دلائل وحدانية الله تعالى", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "37-41", "f": [["عنوان الدرس", "من دلائل وحدانية الله تعالى"], ["نواتج التعلم", "1. يستنتج دلائل وحدانية الله تعالى من الكون والإنسان (30 دقيقة)\n2. يتدبر الآيات الكريمة الدالة على الوحدانية (5 دقائق)\n3. يقرأ الأبيات الشعرية ويستخرج منها أدلة الوحدانية (5 دقائق)"], ["الاستراتيجيات", "التأمل والتفكر\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص37-39\nصور للكون (الشمس، القمر، الشجر، المطر)\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- إلقاء أبيات الشاعر: (انظر لتلك الشجرة ذات الغصون النضرة...)\n- سؤال: من الذي أخرج الثمرة وأوجد الشمس والقمر؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. دلائل الكون: الشجرة تنمو من حبة، الشمس بضيائها وحرارتها، القمر والنجوم، المطر، البصر في الإنسان؛ كل ذلك دليل على خالق واحد ذي حكمة بالغة وقدرة مقتدرة (10 دقائق)\nالاستراتيجيات: التأمل والتفكر.\n\n2. تدبر الآيات: ﴿مَا ٱتَّخَذَ ٱللَّهُ مِن وَلَدٖ وَمَا كَانَ مَعَهُۥ مِنۡ إِلَٰهٍۚ إِذٗا لَّذَهَبَ كُلُّ إِلَٰهِۭ بِمَا خَلَقَ وَلَعَلَا بَعۡضُهُمۡ عَلَىٰ بَعۡضٖۚ …﴾؛ الاستنتاج: انتظام الكون دليل على وحدانية خالقه (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر دليلين من الكون على وحدانية الله.\nالإجابة النموذجية: نمو الشجرة من حبة صغيرة، وانتظام حركة الشمس والقمر\n2) (تطبيق) ماذا يحدث لو كان مع الله إله آخر كما في آية المؤمنون؟\nالإجابة النموذجية: لذهب كل إله بما خلق ولعلا بعضهم على بعض فيفسد الكون\n3) (استدلال) ما الذي نستنتجه من انتظام الكون؟\nالإجابة النموذجية: أن خالقه واحد مدبر حكيم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من الأبيات دليلًا من خلق الإنسان.\nالإجابة النموذجية: شقّ البصر في الإنسان\n2) (تطبيق) ما الحكمة التي تدل عليها الأبيات في وصف الخالق؟\nالإجابة النموذجية: ذو حكمة بالغة وقدرة مقتدرة\n3) (استدلال) اكتب جملة تتأمل فيها مخلوقًا يدل على وحدانية الله.\nالإجابة النموذجية: مثل: النحلة تصنع العسل بنظام دقيق، فسبحان من ألهمها"], ["الغلق (3 دقائق)", "كل طالب يذكر مخلوقًا يدل على عظمة الله"], ["الواجب المنزلي", "اكتب ثلاثة أدلة من بيئتك على وحدانية الله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=7"]]}, {"no": 11, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "من دلائل وحدانية الله تعالى", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "37-41", "f": [["عنوان الدرس", "من دلائل وحدانية الله تعالى"], ["نواتج التعلم", "1. يوضح دلالة الفطرة على وحدانية الله (اللجوء إليه عند الشدة) (15 دقيقة)\n2. يبين آثار التوحيد في سلوك المسلم (15 دقيقة)\n3. يقيم تصرفات في ضوء فهمه للدرس (10 دقائق)"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص39-41\nالمصحف الشريف\nبطاقات مواقف"], ["التهيئة (5 دقائق)", "سؤال: ماذا يفعل الإنسان إذا أصابه خطر في البحر؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. دليل الفطرة: ﴿وَإِذَا مَسَّكُمُ ٱلضُّرُّ فِي ٱلۡبَحۡرِ ضَلَّ مَن تَدۡعُونَ إِلَّآ إِيَّاهُۖ …﴾؛ الإنسان بفطرته يلجأ إلى من يملك النفع والضر، وهو الله وحده؛ كتابة قصة قصيرة لرجل يسافر على سفينة ويواجه عاصفة (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. آثار التوحيد: التوكل على الله، والإخلاص، والطمأنينة، وعدم الخوف من غيره، والاستقامة؛ تقييم مواقف: لجوء إلى الأحجبة والتمائم، دعاء غير الله، التوكل مع الأخذ بالأسباب (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – بطاقة من خريف صلالة: تكتب كل مجموعة بطاقة بريدية قصيرة من مكان عماني كخريف صلالة أو الجبل الأخضر، تصف فيها مشهدًا يدل على وحدانية الله تعالى وإبداعه في الكون (5 دقائق)\nالاستراتيجيات: الإنتاج السريع."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) إلى من يلجأ الإنسان بفطرته عند الشدة؟\nالإجابة النموذجية: إلى الله وحده\n2) (تطبيق) اذكر أثرين للتوحيد في سلوك المسلم.\nالإجابة النموذجية: التوكل على الله، والإخلاص في العمل\n3) (استدلال) ما رأيك في من يعلّق تميمة لتحميه من الضرر؟\nالإجابة النموذجية: تصرف خاطئ يخالف التوحيد، لأن النفع والضر بيد الله وحده"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من آية الإسراء ما يدل على الفطرة.\nالإجابة النموذجية: ﴿… ضَلَّ مَن تَدۡعُونَ إِلَّآ إِيَّاهُۖ …﴾\n2) (تطبيق) كيف يجمع المسلم بين التوكل والأخذ بالأسباب؟\nالإجابة النموذجية: يعمل ويجتهد ويأخذ بالأسباب ثم يفوض النتيجة إلى الله\n3) (استدلال) اكتب نصيحة لزميل يخاف من المستقبل في ضوء التوحيد.\nالإجابة النموذجية: نصيحة تذكّره بأن الأمر بيد الله وتدعوه إلى التوكل والعمل"], ["الغلق (3 دقائق)", "ترديد جماعي: لا إله إلا الله وحده لا شريك له"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=7"]]}, {"no": 12, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام", "k": 1, "n": 3, "wi": 4, "wn": 4, "pages": "42-46", "f": [["عنوان الدرس", "أنواع الصيام"], ["نواتج التعلم", "1. يميز بين أنواع الصيام (الواجب، المندوب، المحرم، المكروه) (15 دقيقة)\n2. يذكر أمثلة لكل نوع (5 دقائق)\n3. يعرّف أيام البيض وأيام التشريق (5 دقائق)\n4. يستخرج من الأحاديث أمثلة للصيام المحرم ويعلل سبب التحريم (5 دقائق)\n5. يبين الحكمة من النهي عن صيام بعض الأيام (5 دقائق)\n6. يستنتج يسر الشريعة وسماحتها (5 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالجدول التصنيفي\nالتعلم التعاوني\nالتدبر والاستنتاج"], ["مصادر التعلم", "كتاب الطالب ص42-44\nجدول التصنيف\nتقويم هجري\nكتاب الطالب ص45\nبطاقات الأحاديث\nالسبورة"], ["التهيئة (5 دقائق)", "- قراءة حوار أحمد ووالديه وهما يصومان الست من شوال\n- سؤال: هل الصيام مقصور على رمضان؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الواجب والمندوب: الواجب: يثاب فاعله ويعاقب تاركه، مثل صيام رمضان وقضائه وصيام الكفارات والنذر؛ المندوب: يثاب فاعله ولا يعاقب تاركه، مثل الاثنين والخميس وأيام البيض وست من شوال؛ أيام البيض: 13 و14 و15 من كل شهر قمري (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. المحرم والمكروه: المحرم: صيام يومي العيدين؛ المكروه: صيام أيام التشريق، وإفراد يوم الجمعة بالصيام دون سبب؛ أيام التشريق: الأيام الثلاثة التي تلي العاشر من ذي الحجة؛ تعبئة جدول الكتاب (5 دقائق)\nالاستراتيجيات: الجدول التصنيفي.\n\n3. الأحاديث: عن أبي سعيد الخدري: نهى رسول الله ﷺ عن صيام يومين: يوم الفطر ويوم الأضحى؛ سبب التحريم: لأنهما يوما فرح وأكل وشكر لله؛ النهي عن صيام الدهر: «لا صام من صام الأبد» لما فيه من مشقة تتعارض مع يسر الشريعة (4 دقائق)\nالاستراتيجيات: التدبر والاستنتاج.\n\n4. الحكمة: التوازن بين حق الله وحق النفس، ومشاركة المسلمين فرحتهم؛ نقاش: الاعتدال في العبادة؛ تطبيق على حالات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس (نشاط ممتع مع المواطنة) – تصنيف أيام الصيام والعيد: تتسابق المجموعات في تصنيف بطاقات أيام الصيام إلى أنواعها، ثم تذكر عادة عمانية في يومي العيد اللذين يحرم صومهما، كالعرسية صباح العيد أو الشواء (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الصيام الواجب؟\nالإجابة النموذجية: الصيام الذي يثاب فاعله ويعاقب تاركه، كصيام رمضان\n2) (تطبيق) اذكر مثالين للصيام المندوب.\nالإجابة النموذجية: صيام يومي الاثنين والخميس، وأيام البيض (أو ست من شوال)\n3) (استدلال) ما أيام البيض؟\nالإجابة النموذجية: الثالث عشر والرابع عشر والخامس عشر من كل شهر قمري\n\n4) (معرفة) ما اليومان اللذان نهى النبي ﷺ عن صيامهما؟\nالإجابة النموذجية: يوم الفطر ويوم الأضحى\n5) (تطبيق) علل تحريم صيامهما.\nالإجابة النموذجية: لأنهما يوما عيد وفرح وأكل وشكر لله\n6) (استدلال) لماذا نُهي عن صيام الدهر؟\nالإجابة النموذجية: لما فيه من مشقة تتعارض مع يسر الشريعة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم صيام يوم العيد؟\nالإجابة النموذجية: محرم\n2) (تطبيق) ما أيام التشريق؟\nالإجابة النموذجية: الأيام الثلاثة التي تلي العاشر من ذي الحجة\n3) (استدلال) صنّف: (صيام نذر، صيام يوم الجمعة منفردًا بلا سبب).\nالإجابة النموذجية: صيام النذر: واجب، الجمعة منفردًا: مكروه\n\n4) (معرفة) ما الحكمة من مشروعية الصيام المندوب؟\nالإجابة النموذجية: زيادة الأجر وتعويد النفس على الطاعة\n5) (تطبيق) صنّف: (صيام ست من شوال، صيام يوم الأضحى).\nالإجابة النموذجية: الأول مندوب، والثاني محرم\n6) (استدلال) ماذا تقول لصديق يريد صيام يوم العيد طلبًا للأجر؟\nالإجابة النموذجية: أنصحه بأن صيامه محرم، وأن الأجر في الفرح وشكر الله وصلة الرحم"], ["الغلق (3 دقائق)", "خريطة مفاهيم لأنواع الصيام الأربعة"], ["الواجب المنزلي", "لوّن على تقويم شهر ذي الحجة أيام الصيام المندوب والمحرم والمكروه.\nاكتب مثالًا لكل نوع من أنواع الصيام.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=8"]]}, {"no": 13, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام", "k": 2, "n": 3, "wi": 1, "wn": 4, "pages": "42-46", "f": [["عنوان الدرس", "أنواع الصيام"], ["نواتج التعلم", "1. يميز بين أنواع الصيام من خلال النصوص الشرعية (20 دقيقة)\n2. يحدد أيام الصيام بأنواعه على التقويم (15 دقيقة)\n3. يقوّم تعلمه في درس أنواع الصيام (5 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالمسابقة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص46 (أقيّم تعلمي)\nتقويم هجري ملون\nبطاقات النصوص"], ["التهيئة (5 دقائق)", "سؤال سريع: صنّف ثلاثة أيام يذكرها المعلم"], ["إجراءات التنفيذ (20 دقيقة)", "1. استخراج الأنواع من النصوص: «من صام في كل شهر ثلاثة أيام فكأنما صام الدهر» (مندوب)؛ نصوص أخرى في الكتاب؛ تحديد النوع والتعليل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التطبيق على التقويم: تلوين التقويم: الواجب، المندوب، المكروه بالبرتقالي، المحرم بالأحمر (10 دقائق)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج نوع الصيام: «من صام في كل شهر ثلاثة أيام فكأنما صام الدهر».\nالإجابة النموذجية: صيام مندوب\n2) (تطبيق) ما حكم صيام قضاء رمضان؟\nالإجابة النموذجية: واجب\n3) (استدلال) ما حكم صيام يوم الحادي عشر من ذي الحجة؟\nالإجابة النموذجية: مكروه (من أيام التشريق)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتّب أنواع الصيام من حيث الحكم في جدول: (واجب، مندوب، مكروه، محرم) مع مثال لكل.\nالإجابة النموذجية: واجب: رمضان، مندوب: الاثنين والخميس، مكروه: أيام التشريق، محرم: يوما العيدين\n2) (تطبيق) لماذا نُهي عن إفراد الجمعة بالصيام؟\nالإجابة النموذجية: لأنه يوم عيد للمسلمين الأسبوعي فيُكره إفراده بالصيام دون سبب\n3) (استدلال) اقترح خطة لصيام مندوب تلتزم بها في شهر.\nالإجابة النموذجية: خطة واقعية مثل صيام الاثنين والخميس أو أيام البيض"], ["الغلق (3 دقائق)", "كل طالب يحدد يومًا مندوبًا سيصومه"], ["الواجب المنزلي", "حل أنشطة (أقيّم تعلمي).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=10"]]}, {"no": 14, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام", "k": 3, "n": 3, "wi": 2, "wn": 4, "pages": "42-46", "f": [["عنوان الدرس", "أنواع الصيام"], ["نواتج التعلم", "1. يربط بين أنواع الصيام وحِكَمها (15 دقيقة)\n2. يطبق أحكام الصيام في مواقف حياتية (5 دقائق)\n3. يقدّر عناية الإسلام بالتوازن بين العبادة وحاجات الإنسان (20 دقيقة)"], ["الاستراتيجيات", "لعب الأدوار\nحل المشكلات\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص42-46\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "- موقف: صديق قرر أن يصوم كل يوم دون انقطاع ليكسب أجرًا أكبر\n- سؤال: ما رأيك؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. مواقف تطبيقية: لعب أدوار لمواقف: نذر صيام ثلاثة أيام، صيام يوم العيد، صيام الجمعة منفردًا، صيام الست من شوال؛ تحديد الحكم مع الدليل (8 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n2. الحكمة والتوازن: لكل نوع حكمة: الواجب تزكية وطاعة، المندوب زيادة أجر، المحرم والمكروه رحمة ودفع مشقة؛ ربط بالاعتدال في العبادة (7 دقائق)\nالاستراتيجيات: حل المشكلات.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – تقويم أسرتي العمانية: تعدّ كل مجموعة تقويمًا هجريًا مصغرًا تحدد عليه أيام الصيام بأنواعها، وتضيف بجوار رمضان والعيدين عادة عمانية كالإفطار الجماعي أو صلاة العيد في المصلى (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) نذر محمد أن يصوم يومين إن نجح، فما حكم صيامهما؟\nالإجابة النموذجية: واجب الوفاء بالنذر\n2) (تطبيق) ما الحكمة من صيام الست من شوال؟\nالإجابة النموذجية: زيادة الأجر واتباع سنة النبي ﷺ\n3) (استدلال) ما حكم صيام يوم الثاني عشر من ذي الحجة؟\nالإجابة النموذجية: مكروه لأنه من أيام التشريق"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف يدل النهي عن صيام الدهر على الاعتدال؟\nالإجابة النموذجية: لأنه يمنع المشقة ويوازن بين العبادة وحقوق النفس\n2) (تطبيق) بماذا تنصح صديقًا فاته صيام أيام من رمضان بعذر؟\nالإجابة النموذجية: أنصحه بقضائها قبل رمضان القادم\n3) (استدلال) ما الفرق بين المكروه والمحرم في الثواب والعقاب؟\nالإجابة النموذجية: المكروه يثاب تاركه ولا يعاقب فاعله، والمحرم يثاب تاركه ويعاقب فاعله"], ["الغلق (3 دقائق)", "تلخيص الدرس في خريطة ذهنية"], ["الواجب المنزلي", "اكتب موقفًا من حياتك يرتبط بأحد أنواع الصيام.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=10"]]}, {"no": 15, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "التخطيط للهجرة النبوية", "k": 1, "n": 2, "wi": 3, "wn": 4, "pages": "47-52", "f": [["عنوان الدرس", "التخطيط للهجرة النبوية"], ["نواتج التعلم", "1. يسترجع أحداث ما قبل الهجرة (تهيئة يثرب للمسلمين) (5 دقائق)\n2. يوضح سبب اجتماع قريش في دار الندوة وما اتفقوا عليه (30 دقيقة)\n3. يبين كيف واجه النبي ﷺ مكيدة قريش بالتخطيط (5 دقائق)"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالخط الزمني"], ["مصادر التعلم", "كتاب الطالب ص47-49\nخريطة الطريق بين مكة ويثرب\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤالا الأب لولديه: كيف هيأ الرسول ﷺ يثرب للمسلمين قبل الهجرة؟ علل تأخره ﷺ عن أصحابه في الخروج"], ["إجراءات التنفيذ (20 دقيقة)", "1. مكيدة قريش: إحساس قريش بخطر هجرة المسلمين وبيعة أهل يثرب؛ قلقهم على مصالحهم الدينية والتجارية والاجتماعية؛ اجتماعهم في دار الندوة لحسم أمر النبي ﷺ والاتفاق على قتله (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. بداية الخطة: أوحى الله إلى نبيه بمكيدتهم وأمره بالخروج؛ وضع ﷺ خطة محكمة؛ قصد بيت أبي بكر واختاره رفيقًا؛ الدرس: الأخذ بالأسباب من حسن التوكل على الله (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا قلقت قريش من هجرة المسلمين؟\nالإجابة النموذجية: خوفًا من أن تكون للإسلام قوة تهدد مصالحهم الدينية والتجارية والاجتماعية\n2) (تطبيق) أين اجتمع زعماء قريش؟\nالإجابة النموذجية: في دار الندوة\n3) (استدلال) من اختاره النبي ﷺ رفيقًا في الهجرة؟\nالإجابة النموذجية: أبو بكر الصديق رضي الله عنه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) علل تأخر النبي ﷺ عن أصحابه في الخروج.\nالإجابة النموذجية: انتظارًا لأمر الله بالهجرة وليطمئن على خروج أصحابه\n2) (تطبيق) ما الذي يعلمنا إياه تخطيط النبي ﷺ للهجرة؟\nالإجابة النموذجية: أن الأخذ بالأسباب من حسن التوكل على الله\n3) (استدلال) ما الرأي الذي أجمع عليه كفار قريش؟\nالإجابة النموذجية: التخلص من النبي ﷺ بقتله"], ["الغلق (3 دقائق)", "خط زمني مختصر لأحداث ما قبل الخروج"], ["الواجب المنزلي", "اكتب ثلاثة أمور تخطط بها لنجاحك في الاختبار، مستفيدًا من الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=11"]]}, {"no": 16, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "التخطيط للهجرة النبوية", "k": 2, "n": 2, "wi": 4, "wn": 4, "pages": "47-52", "f": [["عنوان الدرس", "التخطيط للهجرة النبوية"], ["نواتج التعلم", "1. يحدد عناصر خطة الهجرة (التوقيت، الطريق، المهام، الدليل) (15 دقيقة)\n2. يزاوج بين الشخصيات والمهام التي قامت بها (15 دقيقة)\n3. يستنتج دروسًا من التخطيط للهجرة (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالأدوار الموزعة\nالخرائط الذهنية"], ["مصادر التعلم", "كتاب الطالب ص49-52\nبطاقات الشخصيات والمهام\nخريطة"], ["التهيئة (5 دقائق)", "مشهدان من الكتاب: تأمّل وأجب عن الأسئلة"], ["إجراءات التنفيذ (20 دقيقة)", "1. عناصر الخطة: الخروج ليلًا متخفيين؛ اللجوء إلى غار ثور أيامًا؛ علي بن أبي طالب: أداء الأمانات إلى أهلها وفاءً بحقهم؛ أبو بكر: شراء راحلتين، وتكليف أهل بيته بنقل الزاد والأخبار ومحو الآثار؛ استئجار دليل أمين خبير يسلك طريقًا غير معتاد (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. المزاوجة والدروس: مزاوجة الشخصيات بمهامها (من الكتاب ومصادر التعلم)؛ الدروس: التخطيط، الكتمان، توزيع المهام، الأمانة، الثقة بالله (7 دقائق)\nالاستراتيجيات: الأدوار الموزعة.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – خطتنا لرؤية 2040: تستخرج المجموعات دروس التخطيط من الهجرة النبوية كالسرية وتوزيع الأدوار، ثم تخطط بها لمشروع صغير يخدم ولايتها تماشيًا مع رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشروعات."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما المهمة التي كلّف بها النبي ﷺ علي بن أبي طالب؟\nالإجابة النموذجية: أداء أمانات الناس التي كانت عند النبي ﷺ\n2) (تطبيق) لماذا لجأ النبي ﷺ وصاحبه إلى غار ثور؟\nالإجابة النموذجية: ليبقيا فيه أيامًا حتى يهدأ الطلب ويتمكنا من السير بأمان\n3) (استدلال) لماذا استأجر أبو بكر دليلًا خبيرًا؟\nالإجابة النموذجية: ليسلك بهما طريقًا غير معتاد فلا يدركهما الكفار"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مهمتين كلّف بهما أبو بكر أهل بيته.\nالإجابة النموذجية: توصيل الزاد والأخبار، ومحو آثارهما في الطريق\n2) (تطبيق) ما الذي يدل عليه رد النبي ﷺ الأمانات رغم عداوة قريش؟\nالإجابة النموذجية: عظيم أمانته ووفائه بالحقوق حتى مع أعدائه\n3) (استدلال) استخرج درسين من التخطيط للهجرة.\nالإجابة النموذجية: التخطيط وتوزيع المهام، والتوكل على الله مع الأخذ بالأسباب"], ["الغلق (3 دقائق)", "خريطة ذهنية لخطة الهجرة"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=11"]]}, {"no": 17, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 3, "n": 6, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآية (31) من سورة المدثر تلاوة صحيحة (15 دقيقة)\n2. يحفظ الآية (31) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: فتنة، ليستيقن، مرض، جنود ربك (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتقسيم المقطعي\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- تسميع الآيات (26-30)\n- تنبيه: الآية (31) طويلة فنحفظها مقاطع"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآية (31) على مقاطع ومحاكاة كل مقطع؛ ملاحظة الوقف المناسب عند علامات الوقف (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ المقاطع ثم ربطها؛ معاني: فتنة (اختبار وابتلاء)، ليستيقن (ليتأكد ويزداد يقينًا)، في قلوبهم مرض (شك ونفاق)، جنود ربك (الملائكة وغيرهم مما لا يعلمه إلا الله)، ذكرى للبشر (موعظة) (7 دقائق)\nالاستراتيجيات: التقسيم المقطعي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – تومينة صغيرة: تسمّع المجموعات الآية (31) من سورة المدثر، ثم تحتفل بإتقان الحفظ بنشيد قصير على طريقة «التومينة» العمانية التي يُحتفى فيها بختم الطفل القرآن (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿وَمَا جَعَلۡنَآ أَصۡحَٰبَ ٱلنَّارِ إِلَّا …﴾\nالإجابة النموذجية: مَلَٰٓئِكَةٗ\n2) (تطبيق) ما معنى (فتنة) في الآية؟\nالإجابة النموذجية: اختبار وابتلاء\n3) (استدلال) من الذين يزدادون إيمانًا بذكر عدة الملائكة؟\nالإجابة النموذجية: الذين آمنوا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (وما يعلم جنود ربك إلا هو)؟\nالإجابة النموذجية: لا يعلم عدد جنود الله وأنواعهم إلا هو سبحانه\n2) (تطبيق) ما معنى (وما هي إلا ذكرى للبشر)؟\nالإجابة النموذجية: ما هي إلا موعظة للناس\n3) (استدلال) سمّع الآية (31).\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (26-31)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-31).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=12"]]}, {"no": 18, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "من آداب الأسواق", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "53-59", "f": [["عنوان الدرس", "من آداب الأسواق"], ["نواتج التعلم", "1. يتعرف أهمية الأسواق في حياة الناس (5 دقائق)\n2. يستنتج آداب السوق من قصة زيارة سوق نزوى (30 دقيقة)\n3. يميز التصرفات الصحيحة من الخاطئة في السوق (5 دقائق)"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص53-56\nصور لسوق نزوى والهبطة\nجهاز عرض"], ["التهيئة (5 دقائق)", "- تأمل مشهد الكتاب: التحية بين البائع والمشتري قبيل العيد\n- ما الهبطة؟ (سوق مفتوح لعرض السلع قبيل العيد من الإرث العماني)"], ["إجراءات التنفيذ (20 دقيقة)", "1. قصة سوق نزوى: إلقاء السلام على الباعة، والتاجر يأمر بفرز الفاسد وعدم عرضه، ومراعاة المشترين في الأسعار، وعدم تطفيف الميزان؛ التنقل بانسياب وتجنب الزحام؛ المفاوضة بلطف دون رفع الصوت (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. آداب مستنتجة: عدم مدّ اليد إلى المعروضات دون استئذان، والحذر على بضائع الناس، والمسارعة إلى الصلاة بسكينة عند الأذان؛ تدوين الآداب في جدول (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا يحتاج الناس إلى الأسواق؟\nالإجابة النموذجية: لتبادل السلع وتلبية حاجاتهم من الطعام والكساء وغيرها\n2) (تطبيق) اذكر أدبين من آداب البائع في القصة.\nالإجابة النموذجية: الأمانة بفرز الفاسد وعدم عرضه، وعدم تطفيف الميزان\n3) (استدلال) ما الخطأ الذي نبّه الأب ابنه إليه؟\nالإجابة النموذجية: مدّ يده إلى المعروضات دون استئذان"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر أدبين من آداب المشتري.\nالإجابة النموذجية: إلقاء السلام، والمفاوضة بلطف دون رفع الصوت (أو تجنب الزحام)\n2) (تطبيق) ما الهبطة؟\nالإجابة النموذجية: سوق مفتوح لعرض السلع المختلفة قبيل العيد في عمان، من الإرث العماني\n3) (استدلال) ماذا فعل الناس في السوق عند سماع الأذان؟\nالإجابة النموذجية: مشوا إلى الصلاة بسكينة ووقار"], ["الغلق (3 دقائق)", "كل مجموعة تختار أهم أدب وتعلل اختيارها"], ["الواجب المنزلي", "اكتب ثلاثة آداب ستلتزم بها في زيارتك القادمة للسوق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=13"]]}, {"no": 19, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الأولى", "title": "من آداب الأسواق", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "53-59", "f": [["عنوان الدرس", "من آداب الأسواق"], ["نواتج التعلم", "1. يستخرج آداب السوق من النصوص الشرعية (15 دقيقة)\n2. يتعرف الضوابط الأخلاقية والشرعية للتسوق الإلكتروني (5 دقائق)\n3. يستنتج دلالة بناء النبي ﷺ المسجد ثم السوق في المدينة (20 دقيقة)"], ["الاستراتيجيات", "التدبر والاستنتاج\nالتعلم التعاوني\nحل المشكلات"], ["مصادر التعلم", "كتاب الطالب ص56-59\nبطاقات النصوص الشرعية\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: هل تسوقت عبر الإنترنت؟ ما الذي يجب أن تنتبه إليه؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. النصوص الشرعية: ﴿وَيۡلٞ لِّلۡمُطَفِّفِينَ﴾ (الوفاء بالكيل والميزان)؛ «رحم الله رجلًا سمحًا إذا باع وإذا اشترى وإذا اقتضى» (السماحة)؛ تحريم الغش؛ إرجاع كل نص إلى أدبه (8 دقائق)\nالاستراتيجيات: التدبر والاستنتاج.\n\n2. التسوق الإلكتروني ودلالة البناء: ضوابط: الصدق في وصف السلعة، الأمانة، عدم شراء المحرم، الحفاظ على البيانات، الالتزام بالسداد؛ بدأ النبي ﷺ ببناء المسجد ثم السوق: ربط المعاملات بالأخلاق والعبادة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – في سوق نزوى: يمثّل الطلبة في مجموعات دور البائع والمشتري في سوق نزوى، مطبقين آداب السوق التي تعلموها كالصدق وغض البصر وعدم رفع الصوت (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الأدب المستفاد من قوله تعالى: ﴿وَيۡلٞ لِّلۡمُطَفِّفِينَ﴾؟\nالإجابة النموذجية: الوفاء بالكيل والميزان وعدم إنقاصهما\n2) (تطبيق) اذكر ضابطين للتسوق الإلكتروني.\nالإجابة النموذجية: الصدق في وصف السلعة، والأمانة في السداد (أو حفظ البيانات)\n3) (استدلال) ما المقصود بالسماحة في البيع والشراء؟\nالإجابة النموذجية: التيسير وحسن المعاملة وعدم التشدد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما دلالة بناء النبي ﷺ المسجد قبل السوق؟\nالإجابة النموذجية: أن تقوم المعاملات على الأخلاق والعبادة وتقوى الله\n2) (تطبيق) ما حكم الغش في البيع؟\nالإجابة النموذجية: محرم\n3) (استدلال) أشار عليك صديق بشراء سلعة إلكترونيًا بوصف كاذب ليربح، بماذا تنصحه؟\nالإجابة النموذجية: أنصحه بالصدق في الوصف لأن الغش محرم ويمحق البركة"], ["الغلق (3 دقائق)", "قائمة صفية بآداب السوق الواقعي والإلكتروني"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=13"]]}, {"no": 20, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "مقدمة في أحكام النون الساكنة والتنوين", "k": 1, "n": 2, "wi": 4, "wn": 4, "pages": "61-65", "f": [["عنوان الدرس", "مقدمة في أحكام النون الساكنة والتنوين"], ["نواتج التعلم", "1. يسترجع أحكام الميم الساكنة ويستخرجها من الآيات (20 دقيقة)\n2. يعرّف النون الساكنة والتنوين (15 دقيقة)\n3. يفرق بين النون الساكنة والتنوين (5 دقائق)"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتلاوة والمحاكاة\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص61-63\nالمصحف الشريف\nالسبورة"], ["التهيئة (5 دقائق)", "استخراج أحكام الميم الساكنة من آيتي الكتاب: ﴿وَلَا يُؤۡذَنُ لَهُمۡ فَيَعۡتَذِرُونَ﴾ و﴿ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ﴾"], ["إجراءات التنفيذ (20 دقيقة)", "1. التعريف: النون الساكنة: نون خالية من الحركة ثابتة لفظًا وخطًا، وصلًا ووقفًا، وتكون في الأسماء والأفعال والحروف، في وسط الكلمة وآخرها؛ التنوين: نون ساكنة زائدة تلحق آخر الاسم لفظًا وتفارقه خطًا ووقفًا (10 دقائق)\nالاستراتيجيات: الاستقصاء الموجه.\n\n2. التمييز: أمثلة: (مِنْ، أَنْعَمْتَ، يَنْهَوْنَ) و(عليمٌ، رحيمًا، خوفٍ)؛ جدول مقارنة: النون الساكنة (في الأسماء والأفعال والحروف، تثبت خطًا ووقفًا) / التنوين (في الأسماء فقط، يُلفظ ولا يُكتب نونًا ولا يثبت وقفًا) (10 دقائق)\nالاستراتيجيات: التلاوة والمحاكاة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف النون الساكنة.\nالإجابة النموذجية: نون خالية من الحركة ثابتة لفظًا وخطًا وصلًا ووقفًا\n2) (تطبيق) عرّف التنوين.\nالإجابة النموذجية: نون ساكنة زائدة تلحق آخر الاسم لفظًا وتفارقه خطًا ووقفًا\n3) (استدلال) ما حكم الميم الساكنة في (أَطۡعَمَهُم مِّن)؟\nالإجابة النموذجية: إدغام متماثلين (إدغام شفوي)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج نونًا ساكنة وتنوينًا من: ﴿… وَءَامَنَهُم مِّنۡ خَوۡفِۭ﴾.\nالإجابة النموذجية: النون الساكنة في (مِنْ)، والتنوين في (خوفٍ)\n2) (تطبيق) اذكر فرقًا بين النون الساكنة والتنوين.\nالإجابة النموذجية: النون الساكنة تثبت خطًا ووقفًا، والتنوين لا يثبت خطًا ولا وقفًا\n3) (استدلال) هل يدخل التنوين على الأفعال؟\nالإجابة النموذجية: لا، يلحق الأسماء فقط"], ["الغلق (3 دقائق)", "كل طالب يكتب كلمة فيها نون ساكنة وأخرى فيها تنوين"], ["الواجب المنزلي", "استخرج خمس نونات ساكنة وخمسة تنوينات من سورة المدثر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=14"]]}, {"no": 21, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "مقدمة في أحكام النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 1, "wn": 4, "pages": "61-65", "f": [["عنوان الدرس", "مقدمة في أحكام النون الساكنة والتنوين"], ["نواتج التعلم", "1. يعدد أحكام النون الساكنة والتنوين الأربعة (15 دقيقة)\n2. يقارن بين أحكام الميم الساكنة وأحكام النون الساكنة والتنوين (15 دقيقة)\n3. يستخرج النون الساكنة والتنوين من آيات قرآنية (10 دقائق)"], ["الاستراتيجيات", "الخرائط الذهنية\nالتعلم التعاوني\nالتلاوة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص63-65\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "سؤال: كم حكمًا للميم الساكنة؟ اذكرها"], ["إجراءات التنفيذ (20 دقيقة)", "1. الأحكام الأربعة: الإظهار، والإدغام، والإقلاب، والإخفاء؛ الحكم يتحدد بالحرف الذي يلي النون الساكنة أو التنوين؛ استماع لأمثلة لكل حكم دون التفصيل (8 دقائق)\nالاستراتيجيات: الخرائط الذهنية.\n\n2. المقارنة: مجال المقارنة: عدد الأحكام (الميم ثلاثة، النون أربعة)، وجه الاشتراك (تتأثر بالحرف الذي يليها، وتشترك في الغنة من الخيشوم)؛ حل (أقيّم تعلمي) (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – تنوين في تراثنا: تكتب كل مجموعة كلمات من التراث العماني منونة أو فيها نون ساكنة، مثل «قلعةٌ، خنجرٌ، لبانٌ، منزل»، ثم تميّز بين النون الساكنة والتنوين فيها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عدّد أحكام النون الساكنة والتنوين.\nالإجابة النموذجية: الإظهار، والإدغام، والإقلاب، والإخفاء\n2) (تطبيق) بمَ يتحدد حكم النون الساكنة؟\nالإجابة النموذجية: بالحرف الذي يليها\n3) (استدلال) ما وجه الاشتراك بين الميم الساكنة والنون الساكنة؟\nالإجابة النموذجية: كلتاهما تتأثر بالحرف الذي يليها وفيهما غنة تخرج من الخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم حكمًا للميم الساكنة؟ وكم حكمًا للنون الساكنة؟\nالإجابة النموذجية: للميم ثلاثة، وللنون الساكنة والتنوين أربعة\n2) (تطبيق) صحح: التنوين يكتب نونًا في آخر الاسم.\nالإجابة النموذجية: التنوين يُلفظ نونًا ولا يُكتب نونًا\n3) (استدلال) استخرج من ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾ تنوينًا.\nالإجابة النموذجية: (يومئذٍ) و(يومٌ) و(عسيرٌ)"], ["الغلق (3 دقائق)", "خريطة ذهنية للأحكام الأربعة تُعلّق في الصف"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=14"]]}, {"no": 22, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 4, "n": 6, "wi": 2, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (32-40) تلاوة صحيحة مطبقًا ما تعلمه من أحكام النون الساكنة والتنوين (15 دقيقة)\n2. يحفظ الآيات (32-40) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: أدبر، أسفر، لإحدى الكُبر، رهينة (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13-14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآية (31) وربطها بالآيات السابقة"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (32-40) ومحاكاة؛ ملاحظة التنوين في (نَفۡسِۭ بِمَا) وتلفّظه ميمًا مع الغنة، و(جَنَّٰتٖ يَتَسَآءَلُونَ) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي (32-37) ثم (38-40)؛ معاني: إذ أدبر (ولّى وذهب)، أسفر (أضاء)، لإحدى الكبر (إحدى الدواهي العظيمة)، رهينة (محبوسة بعملها)، أصحاب اليمين (أهل الجنة) (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – مسؤوليتي نحو وطني: تتحاور المجموعات في معنى «كل نفس بما كسبت رهينة»، ثم تذكر كل مجموعة مسؤولية فردية للطالب نحو عمان كالمحافظة على المرافق العامة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿كُلُّ نَفۡسِۭ …﴾\nالإجابة النموذجية: ﴿كُلُّ نَفۡسِۭ بِمَا كَسَبَتۡ رَهِينَةٌ﴾\n2) (تطبيق) ما معنى (والصبح إذا أسفر)؟\nالإجابة النموذجية: أقسم الله بالصبح إذا أضاء وانكشف\n3) (استدلال) من المستثنون من الارتهان بأعمالهم في الآية (39)؟\nالإجابة النموذجية: أصحاب اليمين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱلَّيۡلِ إِذۡ أَدۡبَرَ﴾.\nالإجابة النموذجية: ﴿وَٱلصُّبۡحِ إِذَآ أَسۡفَرَ﴾\n2) (تطبيق) ما معنى (رهينة)؟\nالإجابة النموذجية: مرهونة محبوسة بعملها\n3) (استدلال) حدّد التنوين في ﴿فِي جَنَّـٰتٖ يَتَسَآءَلُونَ﴾.\nالإجابة النموذجية: (جنّاتٍ) بتنوين الكسر"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (32-40)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=15"]]}, {"no": 23, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 1, "n": 3, "wi": 3, "wn": 4, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (11-27) تلاوة صحيحة (10 دقائق)\n2. يتعرف سبب نزول الآيات في الوليد بن المغيرة (5 دقائق)\n3. يوضح النعم التي أنعم الله بها على الوليد (5 دقائق)\n4. يحلل موقف الوليد بن المغيرة من القرآن (التفكير والتقدير ثم الجحود) (10 دقائق)\n5. يصف الحالة النفسية للوليد عند تقوّله على القرآن (5 دقائق)\n6. يبين سبب إنكار الوليد أن يكون القرآن وحيًا (5 دقائق)"], ["الاستراتيجيات", "القصة\nالتلاوة النموذجية والمحاكاة\nالحوار والمناقشة\nالتحليل\nالتعلم التعاوني"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص66-68\nالمكتبة الصوتية\nكتاب الطالب ص68-69\nبطاقات أسئلة"], ["التهيئة (5 دقائق)", "سؤال: ماذا يجب على الإنسان إذا أنعم الله عليه بالمال والأبناء؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (11-27) ومحاكاة؛ التنبيه على الإظهار في (مَنۡ خَلَقۡتُ) والإدغام في (مَالٗا مَّمۡدُودٗا) (5 دقائق)\nالاستراتيجيات: القصة.\n\n2. قصة النزول: ذهاب الوليد إلى النبي ﷺ ليثنيه عن الدعوة، وسماعه القرآن ورقة قلبه؛ إغراء أبي جهل له ليقول سوءًا؛ النعم: مال ممدود، بنون شهود، تمهيد في الرزق والجاه (5 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n3. التفكير والتقدير: ﴿إِنَّهُۥ فَكَّرَ وَقَدَّرَ﴾: أطال التفكير ليجد ما يقوله في القرآن؛ ﴿ثُمَّ عَبَسَ وَبَسَرَ﴾: الحالة النفسية من الضيق والعبوس لما ضاقت عليه الحيل (5 دقائق)\nالاستراتيجيات: التحليل.\n\n4. الجحود: ﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾؛ قوله: ﴿… إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ﴾؛ سبب الإنكار: الاستكبار والعناد وإرضاء قريش لا الجهل بالحق (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) فيمن نزلت الآيات (11-27)؟\nالإجابة النموذجية: في الوليد بن المغيرة\n2) (تطبيق) اذكر نعمتين أنعم الله بهما على الوليد.\nالإجابة النموذجية: المال الكثير، والأبناء الحاضرون معه\n3) (استدلال) ما معنى (ومهّدت له تمهيدًا)؟\nالإجابة النموذجية: بسطت له الرزق والجاه والرياسة\n\n4) (معرفة) صف الحالة النفسية للوليد كما صورتها الآيات.\nالإجابة النموذجية: ضيق وعبوس وتقطيب للوجه لما عجز عن إيجاد طعن مقنع\n5) (تطبيق) ماذا قال الوليد في القرآن بعد تفكيره؟\nالإجابة النموذجية: قال: إنه سحر يُؤثر وقول البشر\n6) (استدلال) ما سبب إنكار الوليد للقرآن رغم إعجابه به؟\nالإجابة النموذجية: الاستكبار عن قبول الحق ومجاراة قريش"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ماذا حدث للوليد عندما سمع القرآن أول مرة؟\nالإجابة النموذجية: رق قلبه وتراجع عما جاء من أجله\n2) (تطبيق) من الذي أغرى الوليد ليقول سوءًا في القرآن؟\nالإجابة النموذجية: أبو جهل\n3) (استدلال) أكمل: ﴿وَجَعَلۡتُ لَهُۥ …﴾\nالإجابة النموذجية: ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾\n\n4) (معرفة) اتلُ الآية التي تصور إعراض الوليد واستكباره.\nالإجابة النموذجية: ﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾\n5) (تطبيق) هل كان الوليد جاهلًا بقيمة القرآن؟ علل.\nالإجابة النموذجية: لا، فقد شهد بحلاوته وعلوه، لكنه استكبر وجحد\n6) (استدلال) ما الدرس المستفاد من موقف الوليد؟\nالإجابة النموذجية: أن الاستكبار يحرم صاحبه من الهداية رغم معرفته الحق"], ["الغلق (3 دقائق)", "كل مجموعة تكتب صفة سلبية للوليد وما يقابلها من صفة المؤمن"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (11-27).\nاكتب فقرة عن خطر الاستكبار على الإنسان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 24, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 2, "n": 3, "wi": 4, "wn": 4, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين عاقبة الاستكبار عن قبول الحق كما في الآيات (30 دقيقة)\n2. يستخلص القيم والدروس المستفادة من الآيات (5 دقائق)\n3. يقوّم تعلمه في درس سورة المدثر (11-27) (5 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالمسابقة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص69-70 (أقيّم تعلمي)\nالمصحف الشريف\nبطاقات"], ["التهيئة (5 دقائق)", "سؤال: ما عاقبة من يرى الحق ويرفضه؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. العاقبة: ﴿سَأُرۡهِقُهُۥ صَعُودًا﴾: عذاب شاق؛ ﴿سَأُصۡلِيهِ سَقَرَ﴾؛ ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾: تهويل لشأنها؛ نعم الله لم تزكِّ الوليد لأنه جحدها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. القيم: شكر النعم باستعمالها في طاعة الله؛ قبول الحق والإنصاف؛ عدم الإعراض عن كتاب الله؛ حل (أقيّم تعلمي) (10 دقائق)\nالاستراتيجيات: المسابقة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما عاقبة الوليد كما في الآيات؟\nالإجابة النموذجية: سيصليه الله سقر ويرهقه عذابًا شاقًا\n2) (تطبيق) ما الغرض من الاستفهام في ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾؟\nالإجابة النموذجية: التهويل وتعظيم شأنها\n3) (استدلال) أكمل: الإعراض عن كتاب الله سبب في ......\nالإجابة النموذجية: الشقاء والهلاك في الدنيا والآخرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف يشكر المسلم نعمة المال والأبناء؟\nالإجابة النموذجية: باستعمالها في طاعة الله وتربية الأبناء تربية صالحة\n2) (تطبيق) ما القيمة التي تتعلمها من الآيات؟\nالإجابة النموذجية: قبول الحق والتواضع له وعدم الاستكبار\n3) (استدلال) سمّع الآيات (21-27).\nالإجابة النموذجية: تسميع صحيح من الآيات المحفوظة"], ["الغلق (3 دقائق)", "تلاوة جماعية للآيات (18-27)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 25, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 3, "n": 3, "wi": 1, "wn": 3, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (11-27) تلاوة مجودة مطبقًا ما تعلمه (15 دقيقة)\n2. يربط معاني الآيات بمواقف من الواقع (15 دقيقة)\n3. يعبّر عن موقفه من الحق بعد دراسة الآيات (10 دقائق)"], ["الاستراتيجيات", "لعب الأدوار\nالتلاوة الفردية\nالحوار والمناقشة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص66-70\nبطاقات مواقف"], ["التهيئة (5 دقائق)", "تلاوة فردية لطالبين متقنين"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة المتقنة: تلاوة فردية لعدد من الطلبة مع تصويب؛ تطبيق مخارج الحروف وأحكام الميم الساكنة (8 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n2. الربط بالواقع: مواقف: طالب يعرف خطأه ويرفض الاعتراف به، شخص ينتقد عملًا ناجحًا حسدًا؛ مقارنتها بموقف الوليد؛ كيف يكون الموقف الصحيح؟ (7 دقائق)\nالاستراتيجيات: التلاوة الفردية.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – مال يُوقف للخير: تقارن المجموعات بين الوليد بن المغيرة الذي جحد نعمة المال، وأهل الخير في عمان الذين أوقفوا أموالهم على المساجد والأفلاج، وتستنتج كيف نشكر النعمة (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اتلُ ﴿فَقُتِلَ كَيۡفَ قَدَّرَ﴾ مع بيان معناها.\nالإجابة النموذجية: تلاوة صحيحة، والمعنى: لُعن كيف هيأ في نفسه ذلك القول الباطل\n2) (تطبيق) اذكر موقفًا من الواقع يشبه موقف الوليد.\nالإجابة النموذجية: من يعرف الحق ويرفضه كبرًا أو حسدًا (تقبل الأمثلة المناسبة)\n3) (استدلال) ما الموقف الصحيح من الحق؟\nالإجابة النموذجية: قبوله والاعتراف به أيًّا كان قائله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف شعورك وأنت تتلو آيات وعيد المستكبرين.\nالإجابة النموذجية: الخوف من الله والحرص على التواضع وقبول الحق\n2) (تطبيق) اتلُ الآية التي تلي ﴿ثُمَّ نَظَرَ﴾.\nالإجابة النموذجية: ﴿ثُمَّ عَبَسَ وَبَسَرَ﴾\n3) (استدلال) استنتج دعوة الآيات للإنسان العاقل.\nالإجابة النموذجية: أن يتفكر بإنصاف ويقبل الحق ولا يستكبر عنه"], ["الغلق (3 دقائق)", "دعاء جماعي: اللهم أرنا الحق حقًا وارزقنا اتباعه"], ["الواجب المنزلي", "سمّع الآيات (11-27) لوالديك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 26, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 5, "n": 6, "wi": 2, "wn": 3, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (41-48) تلاوة صحيحة (15 دقيقة)\n2. يحفظ الآيات (41-48) حفظًا متقنًا (5 دقائق)\n3. يوضح أسباب دخول المجرمين سقر كما ذكرتها الآيات (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (32-40)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (41-48) ومحاكاة؛ ملاحظة النون الساكنة في (تَنفَعُهُمۡ) والتنوين في (شَفَٰعَةُ) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: ما سلككم (ما أدخلكم)، نخوض مع الخائضين (نتكلم بالباطل مع أهله)، اليقين (الموت)؛ أسباب دخول سقر: ترك الصلاة، وعدم إطعام المسكين، والخوض في الباطل، والتكذيب بيوم الدين (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – عكس طريق سقر: تحوّل كل مجموعة أسباب دخول سقر الواردة في الآيات (41-48) إلى أضدادها الإيجابية، وتربط كل منها بعادة عمانية كصلاة الجماعة وإطعام المحتاج (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿قَالُواْ لَمۡ …﴾\nالإجابة النموذجية: ﴿قَالُواْ لَمۡ نَكُ مِنَ ٱلۡمُصَلِّينَ﴾\n2) (تطبيق) ما معنى (اليقين) في الآية (47)؟\nالإجابة النموذجية: الموت\n3) (استدلال) اذكر سببين لدخول المجرمين سقر.\nالإجابة النموذجية: ترك الصلاة، وعدم إطعام المسكين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَلَمۡ نَكُ نُطۡعِمُ ٱلۡمِسۡكِينَ﴾.\nالإجابة النموذجية: ﴿وَكُنَّا نَخُوضُ مَعَ ٱلۡخَآئِضِينَ﴾\n2) (تطبيق) ما معنى (نخوض مع الخائضين)؟\nالإجابة النموذجية: نتكلم في الباطل مع أهله\n3) (استدلال) هل تنفع الشفاعة المجرمين؟\nالإجابة النموذجية: لا، ﴿فَمَا تَنفَعُهُمۡ شَفَٰعَةُ ٱلشَّـٰفِعِينَ﴾"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (41-48)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=17"]]}, {"no": 27, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 3, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه (10 دقائق)\n2. يعرّف براوي الحديث أبي هريرة رضي الله عنه (15 دقيقة)\n3. يوضح معنى ترك ما لا يعني وأثره في حسن الإسلام (15 دقيقة)"], ["الاستراتيجيات", "الحوار والمناقشة\nالتكرار الموجّه\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص71-73\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- موقف: زميل يسأل عن أسرار غيره ويتدخل في كل شيء\n- سؤال: هل تحب هذا التصرف؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الحديث والراوي: نص الحديث: «من حسن إسلام المرء تركه ما لا يعنيه»؛ الراوي: أبو هريرة عبد الرحمن بن صخر الدوسي، أسلم سنة 7هـ، لزم النبي ﷺ فصار أكثر الصحابة رواية للحديث، وكُني بأبي هريرة لهرة وجدها فحملها في كمه (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الحفظ والمعنى: حفظ الحديث؛ يدع المسلم ما لا يفيده في دنياه وآخرته ويشتغل بما ينفعه؛ «احرص على ما ينفعك»؛ الأثر: تزكية النفس، حفظ الوقت، المسارعة في الخير، الجدية والعمل في المجتمع (10 دقائق)\nالاستراتيجيات: التكرار الموجّه."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل الحديث: «من حسن إسلام المرء ...».\nالإجابة النموذجية: تركه ما لا يعنيه\n2) (تطبيق) من راوي الحديث؟\nالإجابة النموذجية: أبو هريرة رضي الله عنه\n3) (استدلال) لماذا كُني بأبي هريرة؟\nالإجابة النموذجية: لأنه وجد هرة فحملها في كمه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (ما لا يعنيه)؟\nالإجابة النموذجية: ما لا يفيده ولا يهمه في أمر دينه ودنياه\n2) (تطبيق) اذكر أثرين لترك ما لا يعني.\nالإجابة النموذجية: حفظ الوقت، وتزكية النفس (أو سلامة العلاقات)\n3) (استدلال) سمّع الحديث غيبًا.\nالإجابة النموذجية: تسميع صحيح"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=18"]]}, {"no": 28, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 2, "n": 2, "wi": 1, "wn": 4, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يحدد صورًا مما لا يعني المسلم (فضول النظر والكلام والاستماع) (15 دقيقة)\n2. يميز بين ما يعنيه وما لا يعنيه من الأعمال (5 دقائق)\n3. يبين أن الأمر بالمعروف والنصح لا يدخلان فيما نهي عنه (20 دقيقة)"], ["الاستراتيجيات", "التصنيف\nالتعلم التعاوني\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص73-75\nبطاقات أعمال\nالسبورة"], ["التهيئة (5 دقائق)", "الصندوق: عبارات (طلب العلم، مجادلة السفهاء، أداء العبادات، الجلوس في الطرقات، بر الوالدين، إتقان العمل، نشر الشائعات، عون الآخرين، تفتيش أجهزة الزملاء)"], ["إجراءات التنفيذ (20 دقيقة)", "1. الصور: فضول النظر والتطلع لما عند الآخرين، فضول الكلام، فضول الاستماع؛ ﴿وَٱلَّذِينَ هُمۡ عَنِ ٱللَّغۡوِ مُعۡرِضُونَ﴾؛ ﴿وَلَا تَقۡفُ مَا لَيۡسَ لَكَ بِهِۦ عِلۡمٌۚ …﴾ (8 دقائق)\nالاستراتيجيات: التصنيف.\n\n2. التمييز: تصنيف عبارات الصندوق: تعنينا (طلب العلم، العبادات، بر الوالدين، إتقان العمل، عون الآخرين) / لا تعنينا (مجادلة السفهاء، الجلوس في الطرقات، الشائعات، تفتيش أجهزة الزملاء)؛ الاستثناء: الأمر بالمعروف والنصح والإصلاح؛ الموقف في الكتاب والرد المناسب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – ميثاق المغرد العماني: تعدّد المجموعات أمورًا لا تعني المسلم في وسائل التواصل، ثم تتفق على ميثاق من ثلاثة بنود لمستخدم عماني مسؤول يترك ما لا يعنيه (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر صورتين مما لا يعني المسلم.\nالإجابة النموذجية: فضول الكلام، والتطلع إلى ما عند الآخرين (أو فضول الاستماع)\n2) (تطبيق) صنّف: (تفتيش أجهزة الزملاء).\nالإجابة النموذجية: مما لا يعنيني فأتركه\n3) (استدلال) هل نصح الصديق إذا أخطأ مما لا يعنيني؟ ولماذا؟\nالإجابة النموذجية: لا، بل يعنيني، لأن النصح والإصلاح مستثنى مما نهى عنه الحديث"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنّف: (إتقان العمل، نشر الشائعات).\nالإجابة النموذجية: إتقان العمل يعنيني، نشر الشائعات لا يعنيني\n2) (تطبيق) ما المقصود بفضول الاستماع؟\nالإجابة النموذجية: الإصغاء إلى ما لا ينفع من أحاديث الناس وأسرارهم\n3) (استدلال) سألك زميل عن راتب والد زميل آخر، بماذا ترد؟\nالإجابة النموذجية: أذكّره بالحديث وأن هذا مما لا يعنينا"], ["الغلق (3 دقائق)", "كل طالب يكتب أمرًا سيتركه لأنه لا يعنيه"], ["الواجب المنزلي", "قارن بين مازن وخالد في نشاط الكتاب، وحل بقية الأنشطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=18"]]}, {"no": 29, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "معجزات الرسل عليهم السلام", "k": 1, "n": 1, "wi": 2, "wn": 4, "pages": "76-79", "f": [["عنوان الدرس", "معجزات الرسل عليهم السلام"], ["نواتج التعلم", "1. يعرّف المعجزة (5 دقائق)\n2. يذكر معجزات بعض الرسل (موسى وعيسى ومحمد عليهم السلام) (25 دقيقة)\n3. يستنتج أن معجزات الرسل جاءت مناسبة لما برع فيه أهل زمانهم (10 دقائق)"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص76-79\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "قصة موسى عليه السلام مع فرعون والسحرة يوم الزينة"], ["إجراءات التنفيذ (20 دقيقة)", "1. المفهوم والقصة: المعجزة: أمر خارق للعادة مقرون بالتحدي سالم من المعارضة يؤيد الله به رسله؛ معجزات موسى: العصا التي صارت ثعبانًا مبينًا وتلقف ما صنع السحرة، واليد التي تخرج بيضاء للناظرين؛ إيمان السحرة (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. المناسبة: موسى: برع قومه في السحر فجاءت العصا؛ عيسى: برع قومه في الطب فأبرأ الأكمه والأبرص وأحيا الموتى بإذن الله؛ محمد ﷺ: برع العرب في الفصاحة فجاء القرآن؛ بيت السالمي في مشارق أنوار العقول عن إرسال الرسل مقرونين بالمعجزات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – راوي السبلة: تختار كل مجموعة معجزة لأحد الرسل عليهم السلام، ويرويها أحد أفرادها بإيجاز ودقة كما يروي الكبار الأحاديث في السبلة العمانية، ثم تستنتج المجموعة دلالتها (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف المعجزة.\nالإجابة النموذجية: أمر خارق للعادة مقرون بالتحدي يعجز البشر عن الإتيان بمثله، يؤيد الله به رسله\n2) (تطبيق) اذكر معجزتين لموسى عليه السلام.\nالإجابة النموذجية: العصا التي تصير ثعبانًا، واليد البيضاء\n3) (استدلال) لماذا جاءت معجزة موسى من جنس السحر؟\nالإجابة النموذجية: لأن قومه برعوا في السحر فكانت المعجزة أبلغ في إقناعهم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معجزة عيسى عليه السلام المناسبة لقومه؟\nالإجابة النموذجية: إبراء الأكمه والأبرص وإحياء الموتى بإذن الله، لبراعتهم في الطب\n2) (تطبيق) ما معجزة نبينا محمد ﷺ الكبرى؟\nالإجابة النموذجية: القرآن الكريم\n3) (استدلال) ماذا حدث للسحرة عندما رأوا عصا موسى تلقف ما صنعوا؟\nالإجابة النموذجية: آمنوا برب موسى وهارون"], ["الغلق (3 دقائق)", "جدول جماعي: الرسول، معجزته، ما برع فيه قومه"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=19"]]}, {"no": 30, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 6, "n": 6, "wi": 3, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (49-56) تلاوة صحيحة (15 دقيقة)\n2. يحفظ الآيات (49-56) ويتم حفظ سورة المدثر كاملة (5 دقائق)\n3. يوضح معاني: حمر مستنفرة، قسورة، صحفًا منشرة، أهل التقوى (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالمسابقة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (41-48)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (49-56) ومحاكاة؛ ملاحظة الإدغام بغنة في (حُمُرٞ مُّسۡتَنفِرَةٞ) والإخفاء في (فَمَن شَآءَ) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: التذكرة (القرآن المذكّر)، حمر مستنفرة (حمير وحشية نافرة)، قسورة (الأسد أو الرماة)، صحفًا منشرة (كتبًا مفتوحة)، أهل التقوى (المستحق أن يُتقى)، أهل المغفرة (المستحق أن يغفر لمن تاب) (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – أصغي للنصيحة: تتحاور المجموعات في تشبيه المعرضين عن التذكرة في ختام سورة المدثر، ثم تذكر آداب الإصغاء إلى النصيحة في المجلس العماني واحترام الناصح (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿كَأَنَّهُمۡ …﴾\nالإجابة النموذجية: ﴿كَأَنَّهُمۡ حُمُرٞ مُّسۡتَنفِرَةٞ﴾\n2) (تطبيق) بمَ شبّه الله المعرضين عن التذكرة؟\nالإجابة النموذجية: بحمر وحشية نافرة فرت من أسد\n3) (استدلال) ما معنى (هو أهل التقوى)؟\nالإجابة النموذجية: هو المستحق أن يُتقى ويُخاف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿كَلَّاۖ بَل لَّا يَخَافُونَ ٱلۡأٓخِرَةَ﴾.\nالإجابة النموذجية: ﴿كَلَّآ إِنَّهُۥ تَذۡكِرَةٞ﴾\n2) (تطبيق) ما معنى (قسورة)؟\nالإجابة النموذجية: الأسد أو الرماة\n3) (استدلال) سمّع سورة المدثر من الآية (49) إلى آخرها.\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "مسابقة تسميع السورة كاملة بين المجموعات"], ["الواجب المنزلي", "راجع حفظ سورة المدثر كاملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=20"]]}, {"no": 31, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "زكاة الفطر", "k": 1, "n": 2, "wi": 4, "wn": 4, "pages": "80-85", "f": [["عنوان الدرس", "زكاة الفطر"], ["نواتج التعلم", "1. يعرّف زكاة الفطر ويذكر اسمها الآخر (زكاة الأبدان) (20 دقيقة)\n2. يبين حكمها وعلى من تجب وعمّن تُخرج (15 دقيقة)\n3. يوضح الحكمة من مشروعيتها (5 دقائق)"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص80-82\nأكياس أرز وتمر (نماذج)\nجهاز عرض"], ["التهيئة (5 دقائق)", "حوار الكتاب: الابن يسأل أباه ليلة العيد عن الأكياس التي بيده"], ["إجراءات التنفيذ (20 دقيقة)", "1. التعريف والحكم: زكاة الفطر: ما يخرجه المسلم عن نفسه وعمن تلزمه نفقته بسبب الفطر من رمضان، وتسمى زكاة الأبدان؛ حكمها: واجبة على كل مسلم قادر لديه ما يزيد على حاجته وحاجة من ينفق عليهم يوم العيد؛ يخرجها عن نفسه وعمن تلزمه نفقته كأولاده الصغار (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. من تجب عنه والحكمة: لا تقتصر على الصائمين، بل تجب عمن أدرك وقتها صائمًا أو مفطرًا لعذر؛ حديث ابن عباس: «فرض رسول الله ﷺ زكاة الفطر طهرة للصائم من اللغو والرفث وطعمة للمساكين»؛ الحكمة: تطهير الصائم والتكافل الاجتماعي (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف زكاة الفطر.\nالإجابة النموذجية: ما يخرجه المسلم عن نفسه وعمن تلزمه نفقته بسبب الفطر من رمضان\n2) (تطبيق) لماذا تسمى زكاة الأبدان؟\nالإجابة النموذجية: لأنها تجب بعدد الأنفس والأبدان\n3) (استدلال) ما حكم زكاة الفطر؟\nالإجابة النموذجية: واجبة على كل مسلم قادر لديه ما يزيد على حاجته يوم العيد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر حكمتين من مشروعية زكاة الفطر.\nالإجابة النموذجية: طهرة للصائم من اللغو والرفث، وطعمة للمساكين\n2) (تطبيق) هل تجب زكاة الفطر عن المريض الذي أفطر رمضان؟ ولماذا؟\nالإجابة النموذجية: نعم، لأن وجوبها غير مقيد بشرط الصيام\n3) (استدلال) ما معنى (اللغو والرفث)؟\nالإجابة النموذجية: اللغو: كل باطل لا نفع فيه، والرفث: فحش الكلام كالشتم والغيبة"], ["الغلق (3 دقائق)", "كل طالب يذكر شخصًا يخرج عنه أبوه زكاة الفطر"], ["الواجب المنزلي", "اسأل والدك: عمّن يخرج زكاة الفطر في أسرتكم؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=21"]]}, {"no": 32, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثانية", "title": "زكاة الفطر", "k": 2, "n": 2, "wi": 1, "wn": 4, "pages": "80-85", "f": [["عنوان الدرس", "زكاة الفطر"], ["نواتج التعلم", "1. يحدد مقدار زكاة الفطر (الصاع) والأصناف التي تخرج منها (15 دقيقة)\n2. يحدد وقت إخراج زكاة الفطر (15 دقيقة)\n3. يتعرف حكم إخراج القيمة نقدًا (10 دقائق)"], ["الاستراتيجيات", "العرض العملي\nالتعلم التعاوني\nالتقويم"], ["مصادر التعلم", "كتاب الطالب ص82-85\nصاع ومد (نماذج)\nتقويم هجري"], ["التهيئة (5 دقائق)", "- عرض مد وصاع\n- سؤال: كم مدًّا في الصاع؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. المقدار والأصناف: المقدار: صاع عن كل فرد، والصاع أربعة أمداد، والمد ملء كفي الرجل المعتدل؛ الأصناف في الحديث: التمر والشعير والزبيب والأقط (اللبن المجفف)؛ ومن السنة إخراجها من قوت الناس كالأرز؛ لا يُصار إلى القيمة نقدًا إلا إذا تعذر قبول الطعام (8 دقائق)\nالاستراتيجيات: العرض العملي.\n\n2. الوقت: الأصل: بعد طلوع فجر يوم العيد وقبل صلاة العيد؛ ويجوز إخراجها قبل العيد بيوم أو يومين؛ من أداها بعد الصلاة فهي صدقة من الصدقات؛ تحديد الأوقات على التقويم (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – تكافل ليلة العيد: تخطط كل مجموعة لأسرة عمانية تخرج زكاة الفطر، فتحدد عدد من تخرج عنهم ووقت إخراجها وكيف تصل إلى المحتاجين في الحارة قبل صلاة العيد (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما مقدار زكاة الفطر؟\nالإجابة النموذجية: صاع عن كل فرد، والصاع أربعة أمداد\n2) (تطبيق) اذكر صنفين ورد ذكرهما في الحديث.\nالإجابة النموذجية: التمر والشعير (أو الزبيب، الأقط)\n3) (استدلال) ما الوقت الأصل لإخراجها؟\nالإجابة النموذجية: بعد طلوع فجر يوم العيد وقبل صلاة العيد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم من أخرجها بعد صلاة العيد؟\nالإجابة النموذجية: تكون صدقة من الصدقات لا زكاة فطر مقبولة في وقتها\n2) (تطبيق) متى يجوز إخراج القيمة نقدًا؟\nالإجابة النموذجية: عند تعذر قبول الطعام من الفقراء\n3) (استدلال) أسرة من خمسة أفراد، كم صاعًا تخرج؟\nالإجابة النموذجية: خمسة آصع"], ["الغلق (3 دقائق)", "أقيّم تعلمي: اختيار الإجابة الصحيحة جماعيًا"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=21"]]}, {"no": 33, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثانية", "title": "الهجرة المباركة", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "86-91", "f": [["عنوان الدرس", "الهجرة المباركة"], ["نواتج التعلم", "1. يصف رد فعل قريش عند علمها بخروج النبي ﷺ (5 دقائق)\n2. يوضح أحداث بقاء النبي ﷺ وصاحبه في الغار وعناية الله بهما (30 دقيقة)\n3. يتدبر آية الغار ويستنتج دلالاتها (5 دقائق)"], ["الاستراتيجيات", "القصة\nالتدبر\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص86-88\nخريطة طريق الهجرة\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "سؤال: ماذا تتوقع أن تفعل قريش عندما عرفت بخروج النبي ﷺ؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. رد فعل قريش: إعلان حالة الطوارئ ومراقبة المداخل والمخارج؛ الاستعانة بقصاصي الأثر؛ جائزة كبرى لمن يأتي بهما؛ وصول جماعة إلى الغار ومنع عناية الله لهم من اكتشافهما (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. آية الغار: ﴿إِلَّا تَنصُرُوهُ فَقَدۡ نَصَرَهُ ٱللَّهُ إِذۡ أَخۡرَجَهُ ٱلَّذِينَ كَفَرُواْ ثَانِيَ ٱثۡنَيۡنِ إِذۡ هُمَا فِي ٱلۡغَارِ إِذۡ يَقُولُ لِصَٰحِبِهِۦ لَا تَحۡزَنۡ إِنَّ ٱللَّهَ مَعَنَاۖ …﴾؛ الدلالات: نصر الله لنبيه، الثقة بمعية الله، فضل أبي بكر (10 دقائق)\nالاستراتيجيات: التدبر."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر إجراءين اتخذتهما قريش للبحث عن النبي ﷺ.\nالإجابة النموذجية: مراقبة مداخل مكة ومخارجها، والاستعانة بقصاصي الأثر (أو الجائزة)\n2) (تطبيق) ما الذي منع المشركين من اكتشاف النبي ﷺ وصاحبه في الغار؟\nالإجابة النموذجية: عناية الله وحفظه\n3) (استدلال) ماذا قال النبي ﷺ لصاحبه في الغار؟\nالإجابة النموذجية: لا تحزن إن الله معنا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (ثاني اثنين)؟\nالإجابة النموذجية: أحد اثنين، هو وأبو بكر رضي الله عنه\n2) (تطبيق) ما الدلالة التي تستنتجها من قوله: (إن الله معنا)؟\nالإجابة النموذجية: الثقة بالله وطمأنينة القلب بمعيته ونصره\n3) (استدلال) لماذا يعد هذا الموقف دليلًا على فضل أبي بكر؟\nالإجابة النموذجية: لأن الله ذكره صاحبًا للنبي ﷺ في القرآن"], ["الغلق (3 دقائق)", "كل مجموعة تكتب عبارة تعبر عن الثقة بالله"], ["الواجب المنزلي", "ارسم خطًا زمنيًا لأحداث الهجرة حتى الخروج من الغار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=22"]]}, {"no": 34, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثانية", "title": "الهجرة المباركة", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "86-91", "f": [["عنوان الدرس", "الهجرة المباركة"], ["نواتج التعلم", "1. يصف رحلة النبي ﷺ إلى يثرب عبر طريق الساحل ومروره بخيمة أم معبد (15 دقيقة)\n2. يصف استقبال أهل يثرب للنبي ﷺ (15 دقيقة)\n3. يستخلص الدروس المستفادة من الهجرة (10 دقائق)"], ["الاستراتيجيات", "القصة\nلعب الأدوار\nالتعلم التعاوني"], ["مصادر التعلم",
