ب ص101-103\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "الاستماع لآيات فيها إظهار حلقي ومحاكاتها"], ["إجراءات التنفيذ (20 دقيقة)", "الاستخراج (10 دقائق):\n- استخراج أمثلة من سورتي المدثر والمزمل: (مَنۡ خَلَقۡتُ)، (إِنۡ هَٰذَآ)، (يَوۡمٌ عَسِيرٌ)، (مِنۡهُ)، (عَذَابًا أَلِيمٗا)\n- تحديد الحرف المظهر ونوع النون (ساكنة/تنوين)\n\nالمقارنة والتطبيق (10 دقائق):\n- جدول: الإظهار الشفوي (الميم الساكنة، حروفه كل الحروف عدا الميم والباء، مخرجه الشفتان) / الإظهار الحلقي (النون الساكنة والتنوين، حروفه ستة حلقية)\n- تلاوة فردية مع تطبيق الإظهار\n- أقيّم تعلمي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج إظهارًا حلقيًا من ﴿إِنۡ هَٰذَآ إِلَّا قَوۡلُ ٱلۡبَشَرِ﴾.\nالإجابة النموذجية: (إِنۡ هَٰذَآ): النون الساكنة قبل الهاء\n2) (تطبيق) ما الفرق بين الإظهار الشفوي والحلقي؟\nالإجابة النموذجية: الشفوي للميم الساكنة قبل غير الميم والباء، والحلقي للنون الساكنة والتنوين قبل الحروف الحلقية الستة\n3) (استدلال) ما حكم التنوين في (يَوۡمٌ عَسِيرٌ)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده العين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اختر من حروف الإظهار: (ب، ح، ل).\nالإجابة النموذجية: الحاء\n2) (تطبيق) حدد الحكم والسبب: (مِنۡ عِلۡمٍ).\nالإجابة النموذجية: إظهار حلقي لأن بعد النون الساكنة العين\n3) (استدلال) اتلُ ﴿ذَرۡنِي وَمَنۡ خَلَقۡتُ وَحِيدٗا﴾ مطبقًا الإظهار.\nالإجابة النموذجية: تلاوة تظهر النون في (مَنۡ خَلَقۡتُ) دون غنة زائدة"], ["الغلق (3 دقائق)", "مسابقة: كل مجموعة تستخرج أكبر عدد من أمثلة الإظهار من سورة المزمل"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=25"]]}, {"no": 40, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 1, "n": 2, "wi": 1, "wn": 4, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (10-13) تلاوة صحيحة\n2. يوضح معاني المفردات: إخوة، لا يسخر، لا تلمزوا، لا تنابزوا بالألقاب\n3. يبين أن الأخوة الإيمانية أساس المجتمع المسلم ووجوب الإصلاح بين المتخاصمين\n4. يحدد التصرفات الذميمة التي نهت عنها الآيات (السخرية، اللمز، التنابز بالألقاب، سوء الظن، التجسس، الغيبة)\n5. يوضح خطر كل منها على الأخوة\n6. يستخرج النواهي الخمسة المسبوقة بـ(لا)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالصور والمواقف\nالحوار والمناقشة\nالتعلم التعاوني\nالجدول\nالتدبر"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص104-107\nالمكتبة الصوتية\nكتاب الطالب ص107-109\nبطاقات النواهي"], ["التهيئة (5 دقائق)", "وصف موقفين مصورين في الكتاب: خصام بين زميلين، وصلح بينهما"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (10-13) ومحاكاة\n- ملاحظة الإدغام بغنة في (أَن يَكُونُواْ)، والإخفاء في (مِّن ذَكَرٖ)، والإظهار الحلقي في (عَلِيمٌ خَبِيرٞ)\n\nالأخوة والإصلاح (5 دقائق):\n- ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n- المؤمنون إخوة متحابون متضامنون، والوحدة هي الأصل\n- الخلاف يعالج فور وقوعه بالسعي إلى الصلح\n- التقوى سبب للرحمة\n\nالنواهي (5 دقائق):\n- لا يسخر، ولا تلمزوا أنفسكم، ولا تنابزوا بالألقاب، ولا تجسسوا، ولا يغتب بعضكم بعضًا\n- اجتناب كثير من الظن\n- معاني: تلمزوا (تعيبوا)، تنابزوا (تتداعوا بالألقاب المكروهة)، تجسسوا (تتبعوا العورات)\n\nالغيبة (5 دقائق):\n- تصوير الغيبة بأكل لحم الأخ ميتًا وتنفير النفوس منها\n- حديث: «أتدرون ما الغيبة؟ ... ذكرك أخاك بما يكره»\n- توجيه نصيحة في موقف من الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ …﴾\nالإجابة النموذجية: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n2) (تطبيق) ما الأساس الذي تقوم عليه علاقة المؤمنين ببعضهم؟\nالإجابة النموذجية: الأخوة الإيمانية\n3) (استدلال) ما واجب المسلمين إذا تخاصم أخوان؟\nالإجابة النموذجية: الإصلاح بينهما فورًا\n\n4) (معرفة) استخرج النواهي الخمسة المسبوقة بـ(لا).\nالإجابة النموذجية: لا يسخر، لا تلمزوا، لا تنابزوا، لا تجسسوا، لا يغتب\n5) (تطبيق) ما معنى (ولا تنابزوا بالألقاب)؟\nالإجابة النموذجية: لا ينادي بعضكم بعضًا بالألقاب التي يكرهها\n6) (استدلال) بمَ شبّه الله الغيبة؟\nالإجابة النموذجية: بأكل لحم الأخ وهو ميت"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما ثمرة التقوى والإصلاح كما في ختام الآية (10)؟\nالإجابة النموذجية: الرحمة ﴿… لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n2) (تطبيق) ما معنى (لا يسخر قوم من قوم)؟\nالإجابة النموذجية: لا يستهزئ بعضهم ببعض\n3) (استدلال) كيف تتصرف إذا رأيت زميلين متخاصمين؟\nالإجابة النموذجية: أسعى إلى الصلح بينهما بالكلمة الطيبة\n\n4) (معرفة) ما الغيبة؟\nالإجابة النموذجية: ذكرك أخاك في غيابه بما يكره\n5) (تطبيق) لماذا أمر الله باجتناب كثير من الظن؟\nالإجابة النموذجية: لأن بعض الظن إثم يفسد القلوب ويقطع الأخوة\n6) (استدلال) نادى زميل زميله بلقب يكرهه، بماذا تنصحه؟\nالإجابة النموذجية: أذكّره بقوله تعالى ﴿… وَلَا تَنَابَزُواْ بِٱلۡأَلۡقَٰبِۖ …﴾ وأدعوه إلى الاعتذار"], ["الغلق (3 دقائق)", "كل مجموعة تختار نهيًا وتكتب بديله الإيجابي"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (10-13).\nاكتب موقفًا تطبق فيه أحد آداب الآيات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 41, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 2, "n": 2, "wi": 2, "wn": 4, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين الغاية من خلق الناس شعوبًا وقبائل (التعارف)\n2. يستنتج أن ميزان التفاضل عند الله هو التقوى\n3. يقوّم تعلمه في درس سورة الحجرات"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص109-110 (أقيّم تعلمي)\nخريطة العالم\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض خريطة العالم: شعوب وألوان ولغات مختلفة\n- سؤال: لماذا خلقنا الله مختلفين؟"], ["إجراءات التنفيذ (20 دقيقة)", "التعارف والتقوى (10 دقائق):\n- ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ﴾\n- الغاية: التعارف والتآلف لا التنازع والشقاق\n- لا اعتبار للون ولا للجنس ولا للغة في ميزان التفاضل\n- الميزان الوحيد: التقوى\n\nأقيّم تعلمي (10 دقائق):\n- إكمال الفراغ والاختيار\n- ربط الآيات بقيم التسامح والتعايش"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الغاية من جعل الناس شعوبًا وقبائل؟\nالإجابة النموذجية: ليتعارفوا\n2) (تطبيق) ما ميزان التفاضل عند الله؟\nالإجابة النموذجية: التقوى\n3) (استدلال) أكمل: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ …﴾\nالإجابة النموذجية: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ﴾"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل يُفضَّل الإنسان عند الله بلونه أو نسبه؟\nالإجابة النموذجية: لا، بل بتقواه\n2) (تطبيق) ما القيمة التي تدعو إليها الآية (13)؟\nالإجابة النموذجية: المساواة والتعارف ونبذ التفاخر بالأنساب\n3) (استدلال) كيف تتعامل مع زميل من بلد آخر في ضوء الآية؟\nالإجابة النموذجية: أتعارف عليه وأحترمه وأتعاون معه"], ["الغلق (3 دقائق)", "تلاوة جماعية للآيات (10-13)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 42, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من فضائل الأعمال (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 4, "pages": "111-116", "f": [["عنوان الدرس", "من فضائل الأعمال (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أنس بن مالك رضي الله عنه\n3. يحدد الأعمال التي يمحو الله بها الخطايا ويرفع بها الدرجات"], ["الاستراتيجيات", "القصة\nالتكرار الموجّه\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص111-113\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "قصة الكتاب: الأب يوقظ ابنه لصلاة الفجر، والابن يتوضأ مسرعًا لبرودة الماء"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث (10 دقائق):\n- «ألا أخبركم بما يمحو الله به الخطايا ويرفع به الدرجات؟ إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة، فذلكم الرباط»\n- الراوي: أنس بن مالك، خادم رسول الله ﷺ\n\nالحفظ والمعاني (10 دقائق):\n- حفظ الحديث\n- يمحو الخطايا: يغفر المعاصي\n- إسباغ الوضوء: إتمامه وإيفاء الأعضاء حقها\n- المكاره: ما تكرهه النفس كالبرد\n- الرباط: حبس النفس على الطاعات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من راوي الحديث؟\nالإجابة النموذجية: أنس بن مالك رضي الله عنه\n2) (تطبيق) ما معنى (إسباغ الوضوء على المكاره)؟\nالإجابة النموذجية: إتمام الوضوء وإيفاء الأعضاء حقها رغم المشقة كالبرد\n3) (استدلال) أكمل: «... وانتظار الصلاة بعد الصلاة ...».\nالإجابة النموذجية: فذلكم الرباط"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر الأعمال الثلاثة الواردة في الحديث.\nالإجابة النموذجية: إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة\n2) (تطبيق) ما معنى (الرباط) في الحديث؟\nالإجابة النموذجية: حبس النفس على الطاعات وملازمتها\n3) (استدلال) ماذا قال الأب لابنه حين توضأ مسرعًا؟\nالإجابة النموذجية: أسبغ وضوءك يا بني، فمن أسبغ وضوءه على المكاره له الدرجات العلا"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=28"]]}, {"no": 43, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 2, "n": 5, "wi": 4, "wn": 4, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (10-14) تلاوة صحيحة مطبقًا الإظهار الحلقي\n2. يحفظ الآيات (10-14) حفظًا متقنًا\n3. يوضح معاني: هجرًا جميلًا، أولي النعمة، أنكالًا، ذا غصة، كثيبًا مهيلًا\n4. يتلو الآيات (15-19) تلاوة صحيحة\n5. يحفظ الآيات (15-19) حفظًا متقنًا\n6. يوضح معاني: أخذًا وبيلًا، شيبًا، منفطر به، تذكرة"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15\nالمكتبة الصوتية\nكتاب الطالب ص15-16"], ["التهيئة (5 دقائق)", "تسميع الآيات (6-9)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (10-14) ومحاكاة\n- ملاحظة الإظهار الحلقي في (عَذَابًا أَلِيمٗا) والإخفاء في (أَنكَالٗا)\n\nالحفظ والمعاني (5 دقائق):\n- حفظ مقطعي\n- معاني: هجرًا جميلًا (هجرًا لا أذى فيه)، أولي النعمة (أصحاب الترف)، أنكالًا (قيودًا ثقيلة)، ذا غصة (يعلق في الحلق)، ترجف (تضطرب)، كثيبًا مهيلًا (رملًا متناثرًا سائلًا)\n\nالتلاوة (5 دقائق):\n- تلاوة نموذجية للآيات (15-19) ومحاكاة\n- ملاحظة الإدغام بغنة في (يَوۡمٗا يَجۡعَلُ) والإخفاء في (إِن كَفَرۡتُمۡ)\n\nالحفظ والمعاني (5 دقائق):\n- حفظ مقطعي\n- معاني: أخذًا وبيلًا (شديدًا ثقيلًا)، شيبًا (شيوخًا من شدة الهول)، منفطر به (متشقق بسبب هوله)، تذكرة (موعظة)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿وَٱصۡبِرۡ عَلَىٰ مَا …﴾\nالإجابة النموذجية: ﴿وَٱصۡبِرۡ عَلَىٰ مَا يَقُولُونَ وَٱهۡجُرۡهُمۡ هَجۡرٗا جَمِيلٗا﴾\n2) (تطبيق) ما معنى (هجرًا جميلًا)؟\nالإجابة النموذجية: هجرًا لا أذى فيه ولا عتاب\n3) (استدلال) ما حكم التنوين في (عَذَابًا أَلِيمٗا)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده الهمزة\n\n4) (معرفة) أكمل: ﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ …﴾\nالإجابة النموذجية: ﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ يَوۡمٗا يَجۡعَلُ ٱلۡوِلۡدَٰنَ شِيبًا﴾\n5) (تطبيق) ما معنى (أخذًا وبيلًا)؟\nالإجابة النموذجية: أخذًا شديدًا ثقيلًا\n6) (استدلال) إلى من أُرسل الرسول المذكور في الآية (15)؟\nالإجابة النموذجية: إلى فرعون"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿إِنَّ لَدَيۡنَآ أَنكَالٗا وَجَحِيمٗا﴾.\nالإجابة النموذجية: ﴿وَطَعَامٗا ذَا غُصَّةٖ وَعَذَابًا أَلِيمٗا﴾\n2) (تطبيق) ما معنى (كثيبًا مهيلًا)؟\nالإجابة النموذجية: رملًا متناثرًا سائلًا\n3) (استدلال) ما الذي أمر الله نبيه به تجاه أذى المكذبين في الآية (10)؟\nالإجابة النموذجية: الصبر على قولهم وهجرهم هجرًا جميلًا\n\n4) (معرفة) اتلُ الآية التي تلي ﴿ٱلسَّمَآءُ مُنفَطِرُۢ بِهِۦۚ كَانَ وَعۡدُهُۥ مَفۡعُولًا﴾.\nالإجابة النموذجية: ﴿إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا﴾\n5) (تطبيق) ما معنى (يجعل الولدان شيبًا)؟\nالإجابة النموذجية: يجعل الصغار شيوخًا من شدة هوله\n6) (استدلال) ما حكم التنوين في (يَوۡمٗا يَجۡعَلُ)؟\nالإجابة النموذجية: إدغام بغنة لأن بعده الياء"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (10-19)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-14).\nراجع حفظ الآيات (1-19).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=33\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=29"]]}, {"no": 44, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من فضائل الأعمال (حديث شريف)", "k": 2, "n": 2, "wi": 1, "wn": 4, "pages": "111-116", "f": [["عنوان الدرس", "من فضائل الأعمال (حديث شريف)"], ["نواتج التعلم", "1. يوضح أثر الأعمال الواردة في الحديث في حياة المسلم\n2. يستنتج وجه الشبه بين الرباط في سبيل الله والمواظبة على الطاعات\n3. يحكم على مواقف في ضوء الحديث"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص113-116\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "- تسميع الحديث\n- تذكير بقصة يوسف الجار المعلق قلبه بالمسجد"], ["إجراءات التنفيذ (20 دقيقة)", "الأثر ووجه الشبه (10 دقائق):\n- الأعمال ترفع الدرجات وتمحو الخطايا\n- وجه الشبه بين الرباط وانتظار الصلاة: ملازمة الموضع وحبس النفس على الطاعة\n- كتابة الأعمال التي ترفع الدرجات كما في الحديث\n\nالحكم على المواقف (10 دقائق):\n- مواقف الكتاب: من يصر على الذهاب للمسجد رغم المطر، من يتوضأ مسرعًا لا يتم أعضاءه، من يجلس بعد الصلاة يذكر الله\n- أقيّم تعلمي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما وجه الشبه بين الرباط في سبيل الله وانتظار الصلاة بعد الصلاة؟\nالإجابة النموذجية: كلاهما ملازمة وحبس للنفس على طاعة الله\n2) (تطبيق) احكم: طالب يتوضأ بسرعة ولا يغسل أعضاءه كاملة لبرودة الماء.\nالإجابة النموذجية: تصرف خاطئ، والصواب إسباغ الوضوء على المكاره ليرفع الله درجته\n3) (استدلال) اذكر عملًا من الحديث يمكنك القيام به يوميًا.\nالإجابة النموذجية: كثرة الخطا إلى المساجد (أو انتظار الصلاة بعد الصلاة)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما ثواب من يكثر الخطا إلى المساجد؟\nالإجابة النموذجية: يرفع الله له بكل خطوة درجة ويحط عنه خطيئة\n2) (تطبيق) صحح: انتظار الصلاة بعد الصلاة من الأعمال المكروهة.\nالإجابة النموذجية: من الأعمال الفاضلة التي يرفع الله بها الدرجات\n3) (استدلال) خطط لثلاثة أيام تطبق فيها الحديث.\nالإجابة النموذجية: خطة واقعية تتضمن الأعمال الثلاثة"], ["الغلق (3 دقائق)", "كل طالب يكتب عملًا من الحديث سيبدأ به اليوم"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=30"]]}, {"no": 45, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الله الحليم", "k": 1, "n": 1, "wi": 2, "wn": 4, "pages": "117-121", "f": [["عنوان الدرس", "الله الحليم"], ["نواتج التعلم", "1. يتعرف معنى اسم الله (الحليم)\n2. يستدل على حلم الله تعالى من القرآن الكريم\n3. يفرق بين حلم الله وحلم المخلوق"], ["الاستراتيجيات", "التدبر\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص117-121\nالمصحف الشريف\nبطاقات أسماء الله الحسنى"], ["التهيئة (5 دقائق)", "تذكر أسماء الله الحسنى التي دُرست سابقًا ووضع دائرة حولها في نشاط الكتاب"], ["إجراءات التنفيذ (20 دقيقة)", "المعنى والدليل (10 دقائق):\n- الله متصف بصفات الكمال منزه عن كل نقص: ﴿وَلِلَّهِ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰ فَٱدۡعُوهُ بِهَاۖ …﴾\n- الحليم: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب\n- ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ وَلَٰكِن يُؤَخِّرُهُمۡ إِلَىٰٓ أَجَلٖ مُّسَمّٗىۖ …﴾\n\nحلم المخلوق والتطبيق (10 دقائق):\n- الله ليس كمثله شيء، فحلم المخلوق ليس كحلم الله، وحلم المخلوق يتغير بالأسباب\n- قول القرطبي: من عرف أن ربه حليم فأولى أن يحلم على من خالفه\n- موقف: أخ صغير أتلف مجسم مشروع أحمد، كيف يطبق الحلم؟"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى اسم الله (الحليم)؟\nالإجابة النموذجية: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب\n2) (تطبيق) استدل من القرآن على حلم الله.\nالإجابة النموذجية: ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ …﴾\n3) (استدلال) ما الفرق بين حلم الله وحلم المخلوق؟\nالإجابة النموذجية: حلم الله كامل لا يتغير، وحلم المخلوق ناقص يتغير بالأسباب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف تطبق صفة الحلم إذا أتلف أخوك الصغير مشروعك؟\nالإجابة النموذجية: أضبط غضبي وأعفو عنه وأعلّمه بهدوء، ثم أصلح المشروع\n2) (تطبيق) ما واجب من عرف أن ربه حليم؟\nالإجابة النموذجية: أن يتوب إليه ولا يغتر بإمهاله، وأن يحلم على من أساء إليه\n3) (استدلال) اذكر اسمين آخرين من أسماء الله الحسنى درستهما.\nالإجابة النموذجية: الرحمن، الرحيم (تقبل الأسماء الصحيحة)"], ["الغلق (3 دقائق)", "دعاء: يا حليم اغفر لنا وتجاوز عنا"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=31"]]}, {"no": 46, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من أحكام صلاة الجمعة", "k": 1, "n": 1, "wi": 3, "wn": 4, "pages": "122-127", "f": [["عنوان الدرس", "من أحكام صلاة الجمعة"], ["نواتج التعلم", "1. يبين فضل يوم الجمعة\n2. يوضح حكم صلاة الجمعة وعلى من تجب\n3. يصف كيفية أداء صلاة الجمعة وخطبتيها\n4. يعدد سنن يوم الجمعة وآدابها\n5. يوضح أهمية الإنصات للخطبة\n6. يحكم على مواقف في ضوء أحكام الجمعة"], ["الاستراتيجيات", "الحوار والمناقشة\nالخريطة الذهنية\nالتدبر\nالتعلم التعاوني\nالتصنيف"], ["مصادر التعلم", "كتاب الطالب ص122-124\nالمصحف الشريف\nجهاز عرض\nكتاب الطالب ص124-127\nبطاقات السنن والمواقف\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ما الذي يميز يوم الجمعة في أسرتك؟"], ["إجراءات التنفيذ (20 دقيقة)", "الفضل والحكم (5 دقائق):\n- «خير يوم طلعت عليه الشمس يوم الجمعة»\n- حكمها: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها\n- الدليل: آية الجمعة: الأمر بالسعي إلى ذكر الله وترك البيع\n- يجوز للمرأة أن تصليها في المسجد ولا تجب عليها\n- «من ترك ثلاث جمع تهاونًا بها طبع الله على قلبه»\n\nالكيفية (5 دقائق):\n- ركعتان في وقت الظهر تتقدمهما خطبتان بينهما جلسة خفيفة\n- يدخل الإمام ويصعد المنبر ويسلم على المأمومين ثم يجلس حتى يفرغ المؤذن\n- يخطب، ويدعو في الثانية لنفسه وللمسلمين\n- يقيم المؤذن وينزل الخطيب فيصلي بهم ركعتين يجهر فيهما بالقراءة\n\nالسنن والآداب (5 دقائق):\n- الاغتسال، التطيب، السواك، التزين، التبكير، عدم تخطي الرقاب، الاجتهاد في الذكر والدعاء، الإكثار من الصلاة على النبي ﷺ، تلاوة القرآن، الإنصات للخطبة\n- حديث: «لا يغتسل رجل يوم الجمعة ... ثم ينصت إذا تكلم الإمام إلا غُفر له ما بينه وبين الجمعة الأخرى»\n- الحرص على الصفوف الأولى وإكمالها أولًا بأول\n\nالمواقف (5 دقائق):\n- أقيّم تعلمي: موقف من يتحدث مع زميله أثناء الخطبة، ومن يتخطى الرقاب، ومن يتأخر بلا عذر\n- توضيح الحكم الشرعي في كل موقف"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما حكم صلاة الجمعة؟\nالإجابة النموذجية: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها\n2) (تطبيق) هل تجب صلاة الجمعة على المرأة؟\nالإجابة النموذجية: لا تجب عليها ويجوز لها أداؤها في المسجد\n3) (استدلال) كم ركعة صلاة الجمعة؟\nالإجابة النموذجية: ركعتان يجهر فيهما بالقراءة\n\n4) (معرفة) اذكر ثلاثًا من سنن يوم الجمعة.\nالإجابة النموذجية: الاغتسال، والتطيب، والتبكير إلى المسجد (أو السواك، الصلاة على النبي ﷺ)\n5) (تطبيق) ما الواجب على المصلي أثناء الخطبة؟\nالإجابة النموذجية: الاستماع والإنصات وعدم الانشغال بشيء\n6) (استدلال) ما جزاء من اغتسل وتطهر وأنصت للخطبة؟\nالإجابة النموذجية: يُغفر له ما بينه وبين الجمعة الأخرى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي يسبق صلاة الجمعة؟\nالإجابة النموذجية: خطبتان بينهما جلسة خفيفة\n2) (تطبيق) ما جزاء من ترك ثلاث جمع تهاونًا؟\nالإجابة النموذجية: يطبع الله على قلبه\n3) (استدلال) استخرج من آية الجمعة أمرين.\nالإجابة النموذجية: السعي إلى ذكر الله، وترك البيع\n\n4) (معرفة) احكم: مصلٍّ يتخطى الرقاب ليصل إلى الصف الأول.\nالإجابة النموذجية: تصرف خاطئ، والصواب أن يجلس حيث انتهى به المجلس دون أذى\n5) (تطبيق) لماذا يُستحب التبكير إلى صلاة الجمعة؟\nالإجابة النموذجية: لنيل الأجر العظيم والصف الأول والاستعداد للخطبة\n6) (استدلال) صمم بطاقة تذكير بآداب يوم الجمعة لأسرتك.\nالإجابة النموذجية: بطاقة تضم أربع سنن على الأقل"], ["الغلق (3 دقائق)", "كل طالب يذكر سنة سيحرص عليها الجمعة القادمة"], ["الواجب المنزلي", "اكتب خطوات صلاة الجمعة بالترتيب.\nطبّق سنن الجمعة واكتب ما قمت به.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=32"]]}, {"no": 47, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "بناء المسجد", "k": 1, "n": 1, "wi": 4, "wn": 4, "pages": "128-133", "f": [["عنوان الدرس", "بناء المسجد"], ["نواتج التعلم", "1. يسرد أحداث وصول النبي ﷺ إلى المدينة ونزوله بقباء\n2. يذكر أول مسجد في الإسلام\n3. يستنتج حكمة النبي ﷺ في قوله: «خلوا سبيلها فإنها مأمورة»\n4. يصف مشاركة المهاجرين والأنصار في بناء المسجد\n5. يستنتج أدوار المسجد في المجتمع الإسلامي\n6. يستخلص القيم من بناء المسجد النبوي"], ["الاستراتيجيات", "القصة\nالخط الزمني\nالحوار والمناقشة\nالتعلم التعاوني\nالاستنتاج من الصور"], ["مصادر التعلم", "كتاب الطالب ص128-130\nصور حديثة لمسجد قباء والمسجد النبوي\nخريطة المدينة\nكتاب الطالب ص130-133\nرسوم أدوار المسجد\nالسبورة"], ["التهيئة (5 دقائق)", "- صور مسجد قباء والمسجد النبوي\n- سؤال: هل تعرف قصة بنائهما؟"], ["إجراءات التنفيذ (20 دقيقة)", "الوصول (5 دقائق):\n- وصل النبي ﷺ المدينة يوم الاثنين الثاني عشر من ربيع الأول بعد ثلاثة عشر عامًا من بعثته\n- نزل في ضاحية قباء بضعة أيام ووضع أساس أول مسجد في الإسلام: مسجد قباء\n\nالناقة المأمورة (5 دقائق):\n- كلما مر بقبيلة من الأنصار سألوه النزول فيقول: «خلوا سبيلها فإنها مأمورة»\n- الحكمة: ألا تشعر عشيرة بإيثار غيرها فترضى النفوس\n- بركت في أرض لبني النجار فاشتراها وبنى فيها مسجده وحجرات نسائه، ونزل ضيفًا على أبي أيوب الأنصاري\n\nالبناء والأدوار (5 دقائق):\n- مشاركة المهاجرين والأنصار بهمة عالية مرددين الأشعار التي تخفف المشقة\n- النبي ﷺ يعمل بنفسه معهم\n- أدوار المسجد: مكان للصلاة بحرية، جامعة للعلم، منتدى لتآلف النفوس، قاعدة لإدارة شؤون الدولة\n\nالقيم (5 دقائق):\n- التعاون، والقدوة الحسنة، والمساواة، والعمل الجماعي، وحب المسجد\n- تأمل رسوم الكتاب واستنتاج أدوار المسجد قديمًا وحديثًا\n- أقيّم تعلمي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما أول مسجد بُني في الإسلام؟\nالإجابة النموذجية: مسجد قباء\n2) (تطبيق) متى وصل النبي ﷺ المدينة؟\nالإجابة النموذجية: يوم الاثنين الثاني عشر من ربيع الأول\n3) (استدلال) ما الحكمة من قوله ﷺ: «خلوا سبيلها فإنها مأمورة»؟\nالإجابة النموذجية: ألا تشعر قبيلة من الأنصار بتفضيل غيرها عليها فترضى النفوس\n\n4) (معرفة) من شارك في بناء المسجد النبوي؟\nالإجابة النموذجية: المهاجرون والأنصار مع النبي ﷺ\n5) (تطبيق) اذكر دورين للمسجد في عهد النبي ﷺ.\nالإجابة النموذجية: مكان لأداء الصلاة، وجامعة يتلقى فيها المسلمون العلم (أو منتدى للتآلف، قاعدة لإدارة الشؤون)\n6) (استدلال) استخلص قيمة من مشاركة النبي ﷺ في البناء.\nالإجابة النموذجية: التواضع والقدوة الحسنة والعمل الجماعي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أين بركت الناقة؟\nالإجابة النموذجية: في أرض لبني النجار\n2) (تطبيق) عند من نزل النبي ﷺ ضيفًا أثناء البناء؟\nالإجابة النموذجية: أبي أيوب الأنصاري\n3) (استدلال) ماذا بنى النبي ﷺ في الأرض التي اشتراها؟\nالإجابة النموذجية: مسجده وحجرات نسائه\n\n4) (معرفة) لماذا كان بناء المسجد أول عمل في المدينة؟\nالإجابة النموذجية: لأنه مركز توحيد المسلمين وعبادتهم وتعليمهم وإدارة شؤونهم\n5) (تطبيق) كيف كان المسلمون يصلون قبل بناء المسجد؟\nالإجابة النموذجية: بعيدًا عن أعين الناس في الشعاب والأودية أو خفية في البيوت\n6) (استدلال) اذكر دورًا للمسجد في حيّك اليوم.\nالإجابة النموذجية: تحفيظ القرآن أو الدروس الدينية أو تجمع أهل الحي (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "كل مجموعة تكتب واجبًا نحو المسجد"], ["الواجب المنزلي", "ابحث عن صورة حديثة للمسجد النبوي ومسجد قباء.\nحل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=34"]]}, {"no": 48, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الثالثة", "title": "ألتزم الحق", "k": 1, "n": 1, "wi": 1, "wn": 4, "pages": "134-139", "f": [["عنوان الدرس", "ألتزم الحق"], ["نواتج التعلم", "1. يعرّف الحق ويذكر معانيه في القرآن (العدل، الصدق، الحقيقة، الاستقامة)\n2. يحدد مصادر الحق\n3. يبين أن المؤمن يقبل الحق من أي مصدر\n4. يصنف السلوكيات إلى ما يقترن بالحق وما يقترن بالباطل\n5. يقترح طرقًا للالتزام بالحق في حياته اليومية\n6. يقوّم تعلمه في درس ألتزم الحق"], ["الاستراتيجيات", "القصة\nحل المشكلات\nالحوار والمناقشة\nالتصنيف\nلعب الأدوار\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص134-137\nبطاقات مواقف\nجهاز عرض\nكتاب الطالب ص137-139 (أقيّم تعلمي)\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "موقف حسن وصديقه فارس المخطئ: هل يؤيد صديقه أم يصارحه بخطئه؟"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم والمصادر (5 دقائق):\n- الحق من المبادئ العليا في الإسلام ونقيض الباطل، ومن معانيه: العدل والصدق والحقيقة والاستقامة\n- مصادره: القرآن الكريم، والأنبياء والرسل الذين لا ينطقون إلا بالحق عن طريق الوحي، والفطرة السليمة التي تقبل الحق وترفض الباطل\n\nقبول الحق (5 دقائق):\n- الحق مرتبط بكل فضيلة وخير، والباطل بكل قبيح\n- المؤمن الصادق يقبل الحق لذاته لا لقائله\n- تحليل موقف حسن: التصرف الصحيح أن يصارح صديقه بخطئه بلطف ويقف مع الحق\n\nالتصنيف (5 دقائق):\n- تصنيف الكلمات مع ما تقترن به في نشاط الكتاب\n- مناقشة آثار الالتزام بالحق على الفرد والمجتمع: الثقة، الأمن، الطمأنينة، رضا الله\n\nلعب الأدوار (5 دقائق):\n- مواقف: الشهادة بالحق في خلاف بين زميلين، الاعتراف بالخطأ أمام المعلم، رد شيء وُجد في الساحة\n- أقيّم تعلمي: تصحيح العبارات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الحق؟\nالإجابة النموذجية: ما وافق الصدق والعدل والحقيقة، وهو نقيض الباطل\n2) (تطبيق) اذكر مصدرين للحق.\nالإجابة النموذجية: القرآن الكريم، والفطرة السليمة (أو الأنبياء والرسل)\n3) (استدلال) ما التصرف الصحيح الذي ينبغي أن يقوم به حسن؟\nالإجابة النموذجية: أن يصارح صديقه بخطئه بلطف ولا يؤيده على الباطل\n\n4) (معرفة) صنّف: (الاعتراف بالخطأ).\nالإجابة النموذجية: يقترن بالحق\n5) (تطبيق) اذكر أثرين للالتزام بالحق في المجتمع.\nالإجابة النموذجية: انتشار الثقة، وتحقيق العدل والأمن\n6) (استدلال) ماذا تفعل إذا رأيت زميلًا يُتهم ظلمًا وأنت تعرف الحقيقة؟\nالإجابة النموذجية: أشهد بالحق وأبيّن الحقيقة بأدب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما سبب الحيرة التي وقع فيها حسن؟\nالإجابة النموذجية: تعارض صداقته لفارس مع معرفته أن فارسًا مخطئ\n2) (تطبيق) هل يقبل المؤمن الحق إذا جاء من شخص لا يحبه؟ ولماذا؟\nالإجابة النموذجية: نعم، لأن المقصود الحق لذاته لا لقائله\n3) (استدلال) صنّف: (الصدق، الظلم، العدل، الغش).\nالإجابة النموذجية: الحق: الصدق والعدل، الباطل: الظلم والغش\n\n4) (معرفة) صحح: الحق يُقبل حسب قائله.\nالإجابة ا  ٱللَّهِ هُوَ خَيۡرٗا وَأَعۡظَمَ أَجۡرٗاۚ …﴾\n- ختام الآية بالأمر بالاستغفار\n\nالربط بالسورة (5 دقائق):\nاستخراج الآيات التي تشير إلى معاني الكتاب: عظمة القرآن (القول الثقيل)، فضل قيام الليل، انصراف الإنسان في النهار لكسب رزقه (سبحًا طويلًا)، يسر الإسلام، مضاعفة الأجر"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى (يضربون في الأرض)؟\nالإجابة النموذجية: يسعون في البلاد للتجارة وطلب الرزق\n2) (تطبيق) اذكر الأعذار التي ذكرتها الآية.\nالإجابة النموذجية: المرض، والسفر للتجارة، والقتال في سبيل الله\n3) (استدلال) ما مظهر التخفيف في الآية؟\nالإجابة النموذجية: جعل قيام الليل تطوعًا لا فريضة وقراءة ما تيسر من القرآن\n\n4) (معرفة) اذكر الفريضتين اللتين أمرت بهما الآية.\nالإجابة النموذجية: الصلاة والزكاة\n5) (تطبيق) بمَ ختمت الآية؟\nالإجابة النموذجية: بالأمر بالاستغفار وبيان أن الله غفور رحيم\n6) (استدلال) ما جزاء من يقدم الخير كما في الآية؟\nالإجابة النموذجية: يجده عند الله خيرًا وأعظم أجرًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (وأقرضوا الله قرضًا حسنًا)؟\nالإجابة النموذجية: تصدقوا في وجوه الخير طيبة بها نفوسكم\n2) (تطبيق) استخرج من الآية ما يدل على يسر الإسلام.\nالإجابة النموذجية: ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾\n3) (استدلال) لماذا كان خير أوقات العبادة جوف الليل؟\nالإجابة النموذجية: لفراغ القلب من مشاغل الدنيا\n\n4) (معرفة) استخرج من السورة آية تدل على أن الإنسان ينصرف في النهار لكسب رزقه.\nالإجابة النموذجية: ﴿إِنَّ لَكَ فِي ٱلنَّهَارِ سَبۡحٗا طَوِيلٗا﴾\n5) (تطبيق) لماذا لم يحدد الله نوع الخير في قوله: ﴿… وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ …﴾؟\nالإجابة النموذجية: لأن للخير وجوهًا كثيرة معنوية ومادية\n6) (استدلال) اذكر وجهين من وجوه الخير يمكنك القيام بهما.\nالإجابة النموذجية: مثل: الصدقة، ومساعدة المحتاج، وتلاوة القرآن"], ["الغلق (3 دقائق)", "كل طالب يحدد وجه خير سيقدمه هذا الأسبوع"], ["الواجب المنزلي", "تدرّب على تلاوة الآية (20).\nحل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=38"]]}, {"no": 52, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "مقرر التلاو ة الرابعة", "title": "سورة المزمل الآية (20) (تلاوة وفهم)", "k": 2, "n": 2, "wi": 2, "wn": 4, "pages": "146-153", "f": [["عنوان الدرس", "سورة المزمل الآية (20) (تلاوة وفهم)"], ["نواتج التعلم", "1. يستخلص القيم والتوجيهات المستفادة من الآية (20)\n2. يقدّر عناية الإسلام بالتوازن بين العبادة والعمل\n3. يقوّم تعلمه في درس الآية (20)"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم الذاتي\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص152-153 (أقيّم تعلمي)\nالمصحف الشريف\nقول الشيخ أحمد بن حمد الخليلي في الكتاب"], ["التهيئة (5 دقائق)", "قراءة قول سماحة الشيخ أحمد بن حمد الخليلي الوارد في الكتاب ومناقشته"], ["إجراءات التنفيذ (20 دقيقة)", "القيم (10 دقائق):\nالتوازن بين العبادة وكسب الرزق، اليسر ورفع الحرج، المحافظة على الفرائض، الإنفاق في سبيل الله، الاستغفار الدائم، المداومة على تلاوة القرآن ولو قليلًا\n\nأقيّم تعلمي (10 دقائق):\n- إكمال العبارات\n- تصحيح الخطأ\n- التقصير في أداء الواجبات كترك صلاة الفجر بحجة السهر في العبادة: مناقشة التوازن"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخلص قيمتين من الآية (20).\nالإجابة النموذجية: التوازن بين العبادة والعمل، واليسر ورفع الحرج\n2) (تطبيق) هل يجوز أن يسهر المسلم في العبادة ثم يترك صلاة الفجر؟ ولماذا؟\nالإجابة النموذجية: لا، لأن الفرائض مقدمة والإسلام دين توازن لا يكلف فوق الطاقة\n3) (استدلال) ما المقصود بقوله: ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾؟\nالإجابة النموذجية: اقرؤوا من القرآن ما يسهل عليكم دون مشقة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: قليل دائم خير من ......\nالإجابة النموذجية: كثير منقطع\n2) (تطبيق) كيف تنظم وقتك بين الدراسة وتلاوة القرآن؟\nالإجابة النموذجية: بتخصيص ورد يومي ثابت ولو قليلًا مع أداء الواجبات الدراسية\n3) (استدلال) لماذا أمرت الآية بالاستغفار بعد الطاعات؟\nالإجابة النموذجية: لجبر التقصير فيها وطلب المغفرة من الله"], ["الغلق (3 دقائق)", "كل طالب يحدد وردًا يوميًا من القرآن يلتزم به"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=40"]]}, {"no": 54, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "هجر المسلم حرام (حديث شريف)", "k": 1, "n": 1, "wi": 3, "wn": 4, "pages": "154-160", "f": [["عنوان الدرس", "هجر المسلم حرام (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أبي أيوب الأنصاري رضي الله عنه\n3. يوضح حكم هجر المسلم أخاه فوق ثلاث ليال\n4. يبين أثر الهجر في العلاقات بين الناس\n5. يحدد من يبقى عليه إثم الهجر إذا بادر أحدهما بالسلام\n6. يقترح حلولًا لتجنب الهجر"], ["الاستراتيجيات", "القصة\nالتكرار الموجّه\nالحوار والمناقشة\nلعب الأدوار\nحل المشكلات"], ["مصادر التعلم", "كتاب الطالب ص154-157\nبطاقة الحديث\nجهاز عرض\nكتاب الطالب ص157-160\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "تذكر الحديثين: «المؤمن للمؤمن كالبنيان يشد بعضه بعضًا» و«مثل المؤمنين في توادهم وتراحمهم...» وإكمال التشبيه"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (5 دقائق):\n- نص الحديث: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام»\n- الراوي: أبو أيوب الأنصاري خالد بن زيد، شهد العقبة الثانية وبدرًا وأحدًا والخندق، ونزل النبي ﷺ في بيته، وشارك في فتح القسطنطينية رغم كبر سنه وتوفي فيها\n\nالحفظ والمعنى (5 دقائق):\n- حفظ الحديث\n- الهجر: ترك الكلام والإعراض عند اللقاء\n- يحرم الهجر فوق ثلاث ليال، والثلاث رخصة لتهدأ النفوس\n- أفضل المتخاصمين من يبدأ بالسلام\n\nالأثر (5 دقائق):\n- الهجر يحول الاتحاد إلى فرقة، والمحبة إلى بغضاء، ويقطع الرحم\n- حرص الشريعة على ما يمنع الهجر\n- قرار زهرة بالمبادرة بالسلام لتكون خيرًا من صاحبتها\n\nالمواقف والحلول (5 دقائق):\n- موقف طارق وحمد: بادر حمد بالسلام فأعرض طارق: على من يبقى الإثم؟\n- حلول: المبادرة بالسلام، الاعتذار، الهدية، التسامح، إصلاح الأصدقاء"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: «لا يحل لمسلم أن يهجر أخاه ...».\nالإجابة النموذجية: فوق ثلاث ليال\n2) (تطبيق) من راوي الحديث؟\nالإجابة النموذجية: أبو أيوب الأنصاري رضي الله عنه\n3) (استدلال) من خير المتخاصمين؟\nالإجابة النموذجية: الذي يبدأ بالسلام\n\n4) (معرفة) اذكر أثرًا سلبيًا للهجر.\nالإجابة النموذجية: يفرق بين الناس ويزرع البغضاء ويقطع الرحم\n5) (تطبيق) على من يبقى إثم الهجر إذا بادر أحدهما بالسلام فأعرض الآخر؟\nالإجابة النموذجية: على المعرض الذي لم يرد السلام\n6) (استدلال) ماذا قررت زهرة في نهاية الحوار؟\nالإجابة النموذجية: أن تجيب دعوة خالتها وتبادر بالسلام على عبير وتصالحها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم هجر المسلم أخاه فوق ثلاث ليال؟\nالإجابة النموذجية: حرام\n2) (تطبيق) ما المقصود بالهجر؟\nالإجابة النموذجية: ترك الكلام مع الأخ والإعراض عنه عند اللقاء\n3) (استدلال) اذكر موقفًا من سيرة أبي أيوب.\nالإجابة النموذجية: نزل النبي ﷺ في بيته عند وصوله المدينة (أو مشاركته في فتح القسطنطينية)\n\n4) (معرفة) اقترح حلين لتجنب الهجر.\nالإجابة النموذجية: المبادرة بالسلام، والتسامح والاعتذار\n5) (تطبيق) ماذا ينبغي لحمد أن يفعل بعد إعراض طارق؟\nالإجابة النموذجية: يستمر في الإحسان والسلام ويطلب من صديق مشترك الإصلاح\n6) (استدلال) ما الحكمة من إباحة الهجر ثلاثة أيام فقط؟\nالإجابة النموذجية: لتهدأ النفوس ثم يعود الصفاء دون قطيعة دائمة"], ["الغلق (3 دقائق)", "كل طالب يفكر في شخص يحتاج أن يبادره بالسلام"], ["الواجب المنزلي", "احفظ الحديث.\nحل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=41"]]}, {"no": 55, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "القرآن الكريم معجزة خالدة", "k": 1, "n": 1, "wi": 4, "wn": 4, "pages": "161-166", "f": [["عنوان الدرس", "القرآن الكريم معجزة خالدة"], ["نواتج التعلم", "1. يبين أن القرآن الكريم معجزة النبي ﷺ الخالدة وكيف تحدى الله به العرب\n2. يعدد وجوه إعجاز القرآن (البياني، العلمي، الغيبي، التشريعي)\n3. يقارن بين معجزات الرسل السابقين ومعجزة القرآن"], ["الاستراتيجيات", "التدبر\nالتعلم التعاوني\nالجدول المقارن"], ["مصادر التعلم", "كتاب الطالب ص161-166\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "- تدبر قوله تعالى: ﴿إِنَّا نَحۡنُ نَزَّلۡنَا ٱلذِّكۡرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ﴾\n- سؤال: ما الذي يميز معجزة القرآن عن معجزات الرسل السابقين؟"], ["إجراءات التنفيذ (20 دقيقة)", "الإعجاز والتحدي (10 دقائق):\n- نزل القرآن عربيًا فصيحًا على قوم هم أرباب الفصاحة فعجزوا ة يقضي؟\nالإجابة النموذجية: ركعتين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) بماذا يبدأ المستدرك عند دخوله الصلاة؟\nالإجابة النموذجية: بالتوجيه وتكبيرة الإحرام\n2) (تطبيق) متى يقضي المستدرك ما فاته؟\nالإجابة النموذجية: بعد تسليم الإمام\n3) (استدلال) هل يسلّم المستدرك مع الإمام؟\nالإجابة النموذجية: لا، بل يقوم بتكبير ليقضي ما فاته\n\n4) (معرفة) أدرك مصلٍّ الإمام في التشهد الأخير من صلاة الظهر، فكم ركعة يقضي؟\nالإجابة النموذجية: أربع ركعات\n5) (تطبيق) ماذا يفعل المستدرك عند تسليم الإمام؟\nالإجابة النموذجية: لا يسلّم، بل يقوم بتكبير ويقضي ما فاته\n6) (استدلال) صحح: (يسلم المستدرك مع الإمام ثم يقضي ما فاته).\nالإجابة النموذجية: لا يسلم مع الإمام، بل يقضي ما فاته ثم يسلم"], ["الغلق (3 دقائق)", "عرض عملي لمجموعة تطبق الاستدراك"], ["الواجب المنزلي", "اكتب خطوات الاستدراك في الصلاة.\nحل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 58, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يوضح المعنى العام لحديث «من أدرك ركعة من الصلاة فقد أدرك الصلاة»\n2. يقيّم مواقف تتعلق بالمسارعة إلى صلاة الجماعة\n3. يقوّم تعلمه في درس الاستدراك"], ["الاستراتيجيات", "الحوار والمناقشة\nالتقويم الذاتي\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص170-171 (أقيّم تعلمي)\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ما الشعور الذي ينتابك عندما تفوتك ركعات من صلاة الجماعة دون عذر؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والمواقف (10 دقائق):\n- «من أدرك ركعة من الصلاة فقد أدرك الصلاة»: الحث على إدراك الجماعة وأن فضلها يُنال بإدراك ركعة\n- تقييم الموقفين: من انشغل بالتلفاز وقت الصلاة متعللًا بأنه سيستدرك (خطأ)، ومن تأخر فذهب راكضًا خوفًا من فوات الجماعة (خطأ، والصواب المشي بسكينة ووقار)\n\nأقيّم تعلمي (10 دقائق):\n- وضع علامة الصواب والخطأ وتصويب ما تحته خط\n- إجابات شفهية\n- تلخيص الدرس"], ["التقويم التكويني (5 دقائق)", "1) (مع const $=s=>document.querySelector(s);
let mode='sep',idx=0;
try{const s=JSON.parse(localStorage.getItem('noor6_التربية الإسلامية')||'{}');if(s.mode)mode=s.mode;if(s.idx!=null)idx=s.idx;}catch(e){}
const fw=$('#fw'),fl=$('#fl');
fw.innerHTML='<option value="">كل الأسابيع</option>'+[...new Set(D.map(p=>p.w))].map(w=>{const p=D.find(x=>x.w==w);return `<option value="${w}">الأسبوع ${p.wl} (${p.date})</option>`}).join('');
function fillLessons(){const w=fw.value;const ls=[...new Set(D.filter(p=>!w||p.w==w).map(p=>p.title))];const cur=fl.value;fl.innerHTML='<option value="">كل الدروس</option>'+ls.map(l=>`<option>${esc(l)}</option>`).join('');if(ls.includes(cur))fl.value=cur;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const UTH=/[\u0600-\u06FF]*[\u0656-\u065E\u0670\u0671\u06D6-\u06ED][\u0600-\u06FF]*/g;
function fmt(s){return esc(s).split(/(﴿[^﴾]+﴾)/).map(p=>p.startsWith('﴿')?'<span class="qr">'+p+'</span>':p.replace(UTH,w=>'<span class="qr">'+w+'</span>')).join('')}
function list(){return D.filter(p=>(!fw.value||p.w==fw.value)&&(!fl.value||p.title==fl.value))}
function card(p){return `<article class="card"><div class="ch"><div><h2>${esc(p.title)}</h2><div class="m">الأسبوع ${p.wl} (${p.date}) | ${esc(p.unit)} | الصفحات ${esc(p.pages)}</div></div><span class="badge">الحصة ${p.k} من ${p.n} | رقم ${p.no}</span></div>${p.f.map((f,i)=>`<div class="fld"><div class="k">${f[0]}</div><div class="v">${fmt(f[1])}</div><button class="cp" data-n="${p.no}" data-i="${i}" aria-label="نسخ ${f[0]}">نسخ</button></div>`).join('')}</article>`}
function save(){try{localStorage.setItem('noor6_التربية الإسلامية',JSON.stringify({mode,idx}))}catch(e){}}
function render(){const L=list();const app=$('#app');$('#m1').classList.toggle('on',mode=='sep');$('#m2').classList.toggle('on',mode=='all');
 if(!L.length){app.innerHTML='<div class="empty">لا توجد حصص تطابق الاختيار. غيّر الأسبوع أو الدرس.</div>';return}
 if(mode=='all'){app.innerHTML=L.map(card).join('');}
 else{if(idx>=L.length)idx=0;const p=L[idx];app.innerHTML=`<div class="nav"><button id="pv" ${idx==0?'disabled':''}>الحصة السابقة</button><span class="pos">${idx+1} من ${L.length}</span><button id="nx" ${idx==L.length-1?'disabled':''}>الحصة التالية</button></div>`+card(p);
  $('#pv').onclick=()=>{idx--;render()};$('#nx').onclick=()=>{idx++;render()};}
 save();}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const p=D.find(x=>x.no==b.dataset.n);const ok=await copyText(p.f[b.dataset.i][1]);b.textContent=ok?'تم النسخ':'تعذّر النسخ';b.classList.toggle('ok',ok);setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1400)});
fw.onchange=()=>{fillLessons();idx=0;render()};fl.onchange=()=>{idx=0;render()};
$('#m1').onclick=()=>{mode='sep';render()};$('#m2').onclick=()=>{mode='all';render()};
document.addEventListener('keydown',e=>{if(mode!='sep'||e.target.tagName=='SELECT')return;const L=list();if(e.key=='ArrowLeft'&&idx<L.length-1){idx++;render()}if(e.key=='ArrowRight'&&idx>0){idx--;render()}});
fillLessons();render();
</script><script src="/assets/qlink.js" defer></script>
</body></html>
