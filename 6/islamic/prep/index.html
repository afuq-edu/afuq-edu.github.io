<script>
const D=[{"no": 1, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 1, "n": 8, "wi": 1, "wn": 5, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (1-7) من سورة المدثر تلاوة صحيحة مراعيًا مخارج الحروف\n2. يحفظ الآيات (1-7) حفظًا متقنًا\n3. يوضح معاني المفردات: المدثر، فأنذر، فكبّر، الرجز"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتعلم التعاوني (التسميع الثنائي)"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص12\nالمكتبة الصوتية لمادة التربية الإسلامية\nالسبورة"], ["التهيئة (5 دقائق)", "- الاستماع إلى تلاوة مجوّدة للآيات (1-7) من المكتبة الصوتية\n- سؤال: بمَ نادى الله تعالى نبيه في بداية السورة؟"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة والمحاكاة (10 دقائق):\n- تلاوة نموذجية من المعلم آية آية\n- محاكاة جماعية ثم فردية\n- تصويب النطق: الضاد والظاء، والراء في (فأنذر، فكبّر، فطهّر، فاهجر)\n\nالحفظ والمعاني (10 دقائق):\n- الحفظ بالتكرار المقطعي: الآيات (1-3) ثم (4-7)\n- معاني: المدثر (المتغطي بثيابه)، فأنذر (خوّف الناس عذاب الله)، فكبّر (عظّم ربك)، الرجز (الأوثان والمعاصي)، ولا تمنن تستكثر (لا تعطِ العطاء لتطلب أكثر منه)"], ["التقويم التكويني (5 دقائق)", "1) (دعم) أكمل: ﴿قُمۡ …﴾\nالإجابة النموذجية: ﴿قُمۡ فَأَنذِرۡ﴾\n2) (متوقع) ما معنى (المدثر)؟\nالإجابة النموذجية: المتغطي بثيابه\n3) (متقدم) ما الحرف الذي يجب العناية بتفخيمه في ﴿وَثِيَابَكَ فَطَهِّرۡ﴾؟\nالإجابة النموذجية: الطاء في (فطهّر) تُنطق مفخمة لا تاءً، مع المحافظة على تشديد الهاء"], ["التقويم الختامي (7 دقائق)", "1) (دعم) اتلُ الآية التي تلي ﴿وَرَبَّكَ فَكَبِّرۡ﴾.\nالإجابة النموذجية: ﴿وَثِيَابَكَ فَطَهِّرۡ﴾\n2) (متوقع) ما معنى (فاهجر الرجز)؟\nالإجابة النموذجية: ابتعد عن الأوثان والمعاصي\n3) (متقدم) استنتج أمرين أمر الله بهما نبيه في الآيات.\nالإجابة النموذجية: إنذار الناس، وتعظيم الله تعالى (أو: تطهير الثياب، والصبر لله)"], ["الغلق (3 دقائق)", "- تسميع جماعي للآيات (1-7)\n- إشادة بالمتقنين"], ["الواجب المنزلي", "سمّع الآيات (1-7) لأحد أفراد أسرتك وراجعها يوميًا."]]}, {"no": 2, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 1, "n": 4, "wi": 2, "wn": 5, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يعرّف مخرج الحرف لغةً واصطلاحًا\n2. يعدد المخارج العامة الخمسة للحروف\n3. يطبق طريقة معرفة مخرج الحرف بنطقه ساكنًا أو مشددًا مسبوقًا بهمزة"], ["الاستراتيجيات", "الحوار والمناقشة\nالعرض العملي\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص19-21\nرسم توضيحي لمخارج الحروف\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض شكل مخارج الحروف في الكتاب\n- سؤال: ماذا تلاحظ في الشكل؟ من أين تخرج الأصوات؟"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم (10 دقائق):\n- مخرج الحرف: محل خروج الحرف وتميّزه عن غيره بواسطة الصوت\n- قراءة حوار الجد وعبدالله\n- طريقة معرفة المخرج: ننطق الحرف ساكنًا أو مشددًا مسبوقًا بهمزة، فحيث ينقطع الصوت يكون مخرجه: أَخْ (الحلق)، أَرْ (اللسان)\n\nالمخارج العامة (10 دقائق):\n- الجوف، الحلق، اللسان، الشفتان، الخيشوم\n- خريطة مفاهيم للمخارج الخمسة مع مثال لكل مخرج\n- تطبيق الطريقة على حروف يختارها الطلبة"], ["التقويم التكويني (5 دقائق)", "1) (دعم) ما مخرج الحرف؟\nالإجابة النموذجية: محل خروج الحرف الذي يتميز به عن غيره\n2) (متوقع) كيف تعرف مخرج حرف الخاء؟\nالإجابة النموذجية: أنطقه ساكنًا مسبوقًا بهمزة (أَخْ) فينقطع الصوت عند الحلق\n3) (متقدم) عدّد المخارج العامة للحروف.\nالإجابة النموذجية: الجوف، والحلق، واللسان، والشفتان، والخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (دعم) طبّق الطريقة على حرف الراء وحدّد مخرجه.\nالإجابة النموذجية: أَرْ، ومخرجها اللسان\n2) (متوقع) ما مخرج حرفي الفاء والباء؟\nالإجابة النموذجية: الشفتان\n3) (متقدم) لماذا يحرص قارئ القرآن على معرفة مخارج الحروف؟\nالإجابة النموذجية: لينطق الحروف نطقًا صحيحًا فلا يتغير المعنى ولا يلحن في كتاب الله"], ["الغلق (3 دقائق)", "كل طالب ينطق حرفًا بالطريقة ويحدد زملاؤه مخرجه العام"], ["الواجب المنزلي", "حدّد مخرج خمسة حروف من سورة الفاتحة بالطريقة التي تعلمتها."]]}, {"no": 3, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 2, "n": 4, "wi": 3, "wn": 5, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يحدد مخارج حروف الحلق الثلاثة (أقصاه، وسطه، أدناه)\n2. يحدد حروف الشفتين والخيشوم والجوف\n3. يطبق المخارج على كلمات من الآيات الكريمة"], ["الاستراتيجيات", "العرض العملي\nالتعلم التعاوني\nالبطاقات"], ["مصادر التعلم", "كتاب الطالب ص21-22\nبطاقات الحروف\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "تمرين صوتي: نطق (أَءْ، أَهْ، أَعْ، أَحْ، أَغْ، أَخْ) ووضع اليد على الحلق لملاحظة موضع الصوت"], ["إجراءات التنفيذ (20 دقيقة)", "الحلق (10 دقائق):\n- أقصى الحلق: الهمزة والهاء\n- وسطه: العين والحاء\n- أدناه: الغين والخاء\n- تدريب على التمييز بين الحاء والهاء، والعين والهمزة\n\nالشفتان والخيشوم والجوف (10 دقائق):\n- الشفتان: الفاء والباء والميم والواو\n- الخيشوم: الغنة في النون والميم المشددتين\n- الجوف: حروف المد الثلاثة\n- تصنيف بطاقات الحروف في مجموعات حسب المخرج"], ["التقويم التكويني (5 دقائق)", "1) (دعم) ما الحرفان اللذان يخرجان من أقصى الحلق؟\nالإجابة النموذجية: الهمزة والهاء\n2) (متوقع) ما الحرفان اللذان يخرجان من وسط الحلق؟\nالإجابة النموذجية: العين والحاء\n3) (متقدم) أين تخرج الغنة؟\nالإجابة النموذجية: من الخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (دعم) صنّف: (غ، ب، ح، م).\nالإجابة النموذجية: الغين: أدنى الحلق، الباء: الشفتان، الحاء: وسط الحلق، الميم: الشفتان\n2) (متوقع) ما مخرج حروف المد؟\nالإجابة النموذجية: الجوف\n3) (متقدم) استخرج من ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾ حرفًا يخرج من الحلق وآخر من الشفتين.\nالإجابة النموذجية: من الحلق: العين في (عليهم)، ومن الشفتين: الميم في (أنعمت) (تقبل الأمثلة الصحيحة)"], ["الغلق (3 دقائق)", "لعبة: المعلم يذكر مخرجًا ويرفع الطلبة بطاقة حرف منه"], ["الواجب المنزلي", "اكتب حروف الحلق مرتبة من الأقصى إلى الأدنى."]]}, {"no": 4, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 3, "n": 4, "wi": 4, "wn": 5, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يميز بين الحروف المتقاربة في المخرج (الضاد والظاء)\n2. يتعرف أثر اللهجة العامية في نطق بعض الحروف (القاف، الكاف، الجيم، الصاد)\n3. ينطق هذه الحروف من مخارجها الصحيحة في الآيات"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتعلم التعاوني\nتصحيح الأخطاء"], ["مصادر التعلم", "كتاب الطالب ص22-23\nالمكتبة الصوتية\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض كلمتي (الضالين) و(الظالين)\n- سؤال: هل المعنى واحد؟"], ["إجراءات التنفيذ (20 دقيقة)", "الضاد والظاء (10 دقائق):\n- (الضالين) بالضاد: المائلون عن الحق، و(الظالين) بالظاء: الدائمون والماكثون\n- تدريب على نطق الضاد في ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾\n\nأثر اللهجة (10 دقائق):\n- نماذج لأخطاء اللهجة: القاف تُنطق جيمًا أو غينًا، الكاف تُنطق شينًا، الجيم تُنطق ياءً، الصاد تُنطق سينًا\n- تلاوة آيات الكتاب ومحاكاة النطق الصحيح وكتابة مخرج كل حرف"], ["التقويم التكويني (5 دقائق)", "1) (دعم) ما الفرق في المعنى بين (الضالين) و(الظالين)؟\nالإجابة النموذجية: الضالين: المائلون عن الحق، الظالين: الدائمون الماكثون\n2) (متوقع) اذكر حرفين تؤثر اللهجة العامية في نطقهما.\nالإجابة النموذجية: القاف والجيم (أو: الكاف، الصاد)\n3) (متقدم) لماذا يجب الحذر من أثر اللهجة في التلاوة؟\nالإجابة النموذجية: لأنه يؤدي إلى اللحن وقد يغيّر المعنى"], ["التقويم الختامي (7 دقائق)", "1) (دعم) ما مخرج القاف؟\nالإجابة النموذجية: أقصى اللسان مع ما يحاذيه من الحنك الأعلى (اللسان)\n2) (متوقع) انطق كلمة (قُلْ) نطقًا صحيحًا.\nالإجابة النموذجية: تُنطق القاف من مخرجها لا جيمًا ولا غينًا\n3) (متقدم) صحّح: قرأ زميلك (الصِّراط) بالسين.\nالإجابة النموذجية: الصواب الصِّراط بالصاد المفخمة"], ["الغلق (3 دقائق)", "تلاوة جماعية لسورة الفاتحة مع مراعاة المخارج"], ["الواجب المنزلي", "استمع لتلاوة سورة الفاتحة وسجّل حرفين تحتاج إلى تحسين نطقهما."]]}, {"no": 5, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 4, "n": 4, "wi": 5, "wn": 5, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يضع الحروف في مخارجها الصحيحة على المخطط\n2. يكتشف الأخطاء التي قد يقع فيها القارئ ة الصوتية"], ["التهيئة (5 دقائق)", "تسميع سريع للآيات (1-7)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (8-17) ومحاكاة\n- التنبيه على مخرج العين في (عسير، عنيدًا) والخاء في (خلقت)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي (8-10) ثم (11-17)\n- معاني: الناقور (الصور)، عسير (شديد)، وحيدًا (منفردًا لا مال له ولا ولد حين خلقه)، ممدودًا (كثيرًا واسعًا)، بنين شهودًا (أبناء حاضرين معه)، سأرهقه صعودًا (سأكلفه عذابًا شاقًا)"], ["التقويم التكويني (5 دقائق)", "1) (دعم) أكمل: ﴿فَذَٰلِكَ يَوۡمَئِذٖ …﴾\nالإجابة النموذجية: ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾\n2) (متوقع) ما معنى (الناقور)؟\nالإجابة النموذجية: الصور الذي يُنفخ فيه يوم القيامة\n3) (متقدم) من الذي نزلت فيه الآيات (11-17)؟\nالإجابة النموذجية: الوليد بن المغيرة"], ["التقويم الختامي (7 دقائق)", "1) (دعم) اتلُ الآية التي تلي ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾.\nالإجابة النموذجية: ﴿وَبَنِينَ شُهُودٗا﴾\n2) (متوقع) ما معنى (وبنين شهودًا)؟\nالإجابة النموذجية: أبناء حاضرين معه لا يغيبون عنه\n3) (متقدم) ما مخرج حرف الخاء في (خلقت)؟\nالإجابة النموذجية: أدنى الحلق"], ["الغلق (3 دقائق)", "تسميع ثنائي للآيات (8-17)"], ["الواجب المنزلي", "سمّع الآيات (1-17) لأحد والديك."]]}, {"no": 7, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (183-185) من سورة البقرة تلاوة صحيحة\n2. يوضح معاني المفردات: كُتب، معدودات، يطيقونه، فدية\n3. يبين حكم الصيام والغاية منه (التقوى)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص26-28\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- سؤال: عرّف الصيام في ضوء دراستك السابقة\n- إكمال التعريف: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس بنية"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية ومحاكاة للآيات الثلاث\n- تصويب المخارج والضبط\n\nال ب الطالب ص14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (32-40)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (41-48) ومحاكاة\n- ملاحظة النون الساكنة في (تَنفَعُهُمۡ) والتنوين في (شَفَٰعَةُ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: ما سلككم (ما أدخلكم)، نخوض مع الخائضين (نتكلم بالباطل مع أهله)، اليقين (الموت)\n- أسباب دخول سقر: ترك الصلاة، وعدم إطعام المسكين، والخوض في الباطل، والتكذيب بيوم الدين"], ["التقويم التكويني (5 دقائق)", "1) (دعم) أكمل: ﴿قَالُواْ لَمۡ …﴾\nالإجابة النموذجية: ﴿قَالُواْ لَمۡ نَكُ مِنَ ٱلۡمُصَلِّينَ﴾\n2) (متوقع) ما معنى (اليقين) في الآية (47)؟\nالإجابة النموذجية: الموت\n3) (متقدم) اذكر سببين لدخول المجرمين سقر.\nالإجابة النموذجية: ترك الصلاة، وعدم إطعام المسكين"], ["التقويم الختامي (7 دقائق)", "1) (دعم) اتلُ الآية التي تلي ﴿وَلَمۡ نَكُ نُطۡعِمُ ٱلۡمِسۡكِينَ﴾.\nالإجابة النموذجية: ﴿وَكُنَّا نَخُوضُ مَعَ ٱلۡخَآئِضِينَ﴾\n2) (متوقع) ما معنى (نخوض مع الخائضين)؟\nالإجابة النموذجية: نتكلم في الباطل مع أهله\n3) (متقدم) هل تنفع الشفاعة المجرمين؟\nالإجابة النموذجية: لا، ﴿فَمَا تَنفَعُهُمۡ شَفَٰعَةُ ٱلشَّـٰفِعِينَ﴾"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (41-48)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-48)."]]}, {"no": 32, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أبي هريرة رضي الله عنه\n3. يوضح معنى ترك ما لا يعني وأثره في حسن الإسلام"], ["الاستراتيجيات", "الحوار والمناقشة\nالتكرار الموجّه\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص71-73\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- موقف: زميل يسأل عن أسرار غيره ويتدخل في كل شيء\n- سؤال: هل تحب هذا التصرف؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (10 دقائق):\n- نص الحديث: «من حسن إسلام المرء تركه ما لا يعنيه»\n- الراوي: أبو هريرة عبد الرحمن بن صخر الدوسي، أسلم سن ", "التعلم التعاوني\nالجدول\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص107-109\nبطاقات النواهي\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "سؤال: كم مرة تكرر حرف النهي (لا) في الآيتين (11-12)؟"], ["إجراءات التنفيذ (20 دقيقة)", "النواهي (10 دقائق):\n- لا يسخر، ولا تلمزوا أنفسكم، ولا تنابزوا بالألقاب، ولا تجسسوا، ولا يغتب بعضكم بعضًا\n- اجتناب كثير من الظن\n- معاني: تلمزوا (تعيبوا)، تنابزوا (تتداعوا بالألقاب المكروهة)، تجسسوا (تتبعوا العورات)\n\nالغيبة (10 دقائق):\n- تصوير الغيبة بأكل لحم الأخ ميتًا وتنفير النفوس منها\n- حديث: «أتدرون ما الغيبة؟ ... ذكرك أخاك بما يكره»\n- توجيه نصيحة في موقف من الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (دعم) استخرج النواهي الخمسة المسبوقة بـ(لا).\nالإجابة النموذجية: لا يسخر، لا تلمزوا، لا تنابزوا، لا تجسسوا، لا يغتب\n2) (متوقع) ما معنى (ولا تنابزوا بالألقاب)؟\nالإجابة النموذجية: لا ينادي بعضكم بعضًا بالألقاب التي يكرهها\n3) (متقدم) بمَ شبّه الله الغيبة؟\nالإجابة النموذجية: بأكل لحم الأخ وهو ميت"], ["التقويم الختامي (7 دقائق)", "1) (دعم) ما الغيبة؟\nالإجابة النموذجية: ذكرك أخاك في غيابه بما يكره\n2) (متوقع) لماذا أمر الله باجتناب كثير من الظن؟\nالإجابة النموذجية: لأن بعض الظن إثم يفسد القلوب ويقطع الأخوة\n3) (متقدم) نادى زميل زميله بلقب يكرهه، بماذا تنصحه؟\nالإجابة النموذجية: أذكّره بقوله تعالى ﴿… وَلَا تَنَابَزُواْ بِٱلۡأَلۡقَٰبِۖ …﴾ وأدعوه إلى الاعتذار"], ["الغلق (3 دقائق)", "كل مجموعة تختار نهيًا وتكتب بديله الإيجابي"], ["الواجب المنزلي", "اكتب موقفًا تطبق فيه أحد آداب الآيات."]]}, {"no": 48, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 3, "n": 3, "wi": 4, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين الغاية من خلق الناس شعوبًا وقبائل (التعارف)\n2. يستنتج أن ميزان التفاضل عند الله هو التقوى\n3. يقوّم تعلمه في درس سورة الحجرات"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص109-110 (أقيّم تعلمي)\nخريطة العالم\nالمصحف الشريف"], وب\n- ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ وَلَٰكِن يُؤَخِّرُهُمۡ إِلَىٰٓ أَجَلٖ مُّسَمّٗىۖ …﴾\n\nحلم المخلوق والتطبيق (10 دقائق):\n- الله ليس كمثله شيء، فحلم المخلوق ليس كحلم الله، وحلم المخلوق يتغير بالأسباب\n- قول القرطبي: من عرف أن ربه حليم فأولى أن يحلم على من خالفه\n- موقف: أخ صغير أتلف مجسم مشروع أحمد، كيف يطبق الحلم؟"], ["التقويم التكويني (5 دقائق)", "1) (دعم) ما معنى اسم الله (الحليم)؟\nالإجابة النموذجية: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب\n2) (متوقع) استدل من القرآن على حلم الله.\nالإجابة النموذجية: ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ …﴾\n3) (متقدم) ما الفرق بين حلم الله وحلم المخلوق؟\nالإجابة النموذجية: حلم الله كامل لا يتغير، وحلم المخلوق ناقص يتغير بالأسباب"], ["التقويم الختامي (7 دقائق)", "1) (دعم) كيف تطبق صفة الحلم إذا أتلف أخوك الصغير مشروعك؟\nالإجابة النموذجية: أضبط غضبي وأعفو عنه وأعلّمه بهدوء، ثم أصلح المشروع\n2) (متوقع) ما واجب من عرف أن ربه حليم؟\nالإجابة النموذجية: أن يتوب إليه ولا يغتر بإمهاله، وأن يحلم على من أساء إليه\n3) (متقدم) اذكر اسمين آخرين من أسماء الله الحسنى درستهما.\nالإجابة النموذجية: الرحمن، الرحيم (تقبل الأسماء الصحيحة)"], ["الغلق (3 دقائق)", "دعاء: يا حليم اغفر لنا وتجاوز عنا"], ["الواجب المنزلي", "حل أنشطة الدرس."]]}, {"no": 53, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من أحكام صلاة الجمعة", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "122-127", "f": [["عنوان الدرس", "من أحكام صلاة الجمعة"], ["نواتج التعلم", "1. يبين فضل يوم الجمعة\n2. يوضح حكم صلاة الجمعة وعلى من تجب\n3. يصف كيفية أداء صلاة الجمعة وخطبتيها"], ["الاستراتيجيات", "الحوار والمناقشة\nالخريطة الذهنية\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص122-124\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: ما الذي يميز يوم الجمعة في أسرتك؟"], ["إجراءات التنفيذ (20 دقيقة)", "الفضل والحكم (10 دقائق):\n- «خير يوم طلعت عليه الشمس يوم الجمعة»\n- حكمها: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها\ const $=s=>document.querySelector(s);
let mode='sep',idx=0;
try{const s=JSON.parse(localStorage.getItem('noor6_التربية الإسلامية')||'{}');if(s.mode)mode=s.mode;if(s.idx!=null)idx=s.idx;}catch(e){}
const fw=$('#fw'),fl=$('#fl');
fw.innerHTML='<option value="">كل الأسابيع</option>'+[...new Set(D.map(p=>p.w))].map(w=>{const p=D.find(x=>x.w==w);return `<option value="${w}">الأسبوع ${p.wl} (${p.date})</option>`}).join('');
function fillLessons(){const w=fw.value;const ls=[...new Set(D.filter(p=>!w||p.w==w).map(p=>p.title))];const cur=fl.value;fl.innerHTML='<option value="">كل الدروس</option>'+ls.map(l=>`<option>${esc(l)}</option>`).join('');if(ls.includes(cur))fl.value=cur;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const UTH=/[\u0600-\u06FF]*[\u0656-\u065E\u0670\u0671\u06D6-\u06ED][\u0600-\u06FF]*/g;
function fmt(s){return esc(s).split(/(﴿[^﴾]+﴾)/).map(p=>p.startsWith('﴿')?'<span class="qr">'+p+'</span>':p.replace(UTH,w=>'<span class="qr">'+w+'</span>')).join('')}
function list(){return D.filter(p=>(!fw.value||p.w==fw.value)&&(!fl.value||p.title==fl.value))}
function card(p){return `<article class="card"><div class="ch"><div><h2>${esc(p.title)}</h2><div class="m">الأسبوع ${p.wl} (${p.date}) | ${esc(p.unit)} | الصفحات ${esc(p.pages)}</div></div><span class="badge">الحصة ${p.k} من ${p.n} | رقم ${p.no}</span></div>${p.f.map((f,i)=>`<div class="fld"><div class="k">${f[0]}</div><div class="v">${fmt(f[1])}</div><button class="cp" data-n="${p.no}" data-i="${i}" aria-label="نسخ ${f[0]}">نسخ</button></div>`).join('')}</article>`}
function save(){try{localStorage.setItem('noor6_التربية الإسلامية',JSON.stringify({mode,idx}))}catch(e){}}
function render(){const L=list();const app=$('#app');$('#m1').classList.toggle('on',mode=='sep');$('#m2').classList.toggle('on',mode=='all');
 if(!L.length){app.innerHTML='<div class="empty">لا توجد حصص تطابق الاختيار. غيّر الأسبوع أو الدرس.</div>';return}
 if(mode=='all'){app.innerHTML=L.map(card).join('');}
 else{if(idx>=L.length)idx=0;const p=L[idx];app.innerHTML=`<div class="nav"><button id="pv" ${idx==0?'disabled':''}>الحصة السابقة</button><span class="pos">${idx+1} من ${L.length}</span><button id="nx" ${idx==L.length-1?'disabled':''}>الحصة التالية</button></div>`+card(p);
  $('#pv').onclick=()=>{idx--;render()};$('#nx').onclick=()=>{idx++;render()};}
 save();}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const p=D.find(x=>x.no==b.dataset.n);const ok=await copyText(p.f[b.dataset.i][1]);b.textContent=ok?'تم النسخ':'تعذّر النسخ';b.classList.toggle('ok',ok);setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1400)});
fw.onchange=()=>{fillLessons();idx=0;render()};fl.onchange=()=>{idx=0;render()};
$('#m1').onclick=()=>{mode='sep';render()};$('#m2').onclick=()=>{mode='all';render()};
document.addEventListener('keydown',e=>{if(mode!='sep'||e.target.tagName=='SELECT')return;const L=list();if(e.key=='ArrowLeft'&&idx<L.length-1){idx++;render()}if(e.key=='ArrowRight'&&idx>0){idx--;render()}});
fillLessons();render();
</script></body></html>
