النبي ﷺ لصاحبه في الغار؟\nالإجابة النموذجية: لا تحزن إن الله معنا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (ثاني اثنين)؟\nالإجابة النموذجية: أحد اثنين، هو وأبو بكر رضي الله عنه\n2) (تطبيق) ما الدلالة التي تستنتجها من قوله: (إن الله معنا)؟\nالإجابة النموذجية: الثقة بالله وطمأنينة القلب بمعيته ونصره\n3) (استدلال) لماذا يعد هذا الموقف دليلًا على فضل أبي بكر؟\nالإجابة النموذجية: لأن الله ذكره صاحبًا للنبي ﷺ في القرآن"], ["الغلق (3 دقائق)", "كل مجموعة تكتب عبارة تعبر عن الثقة بالله"], ["الواجب المنزلي", "ارسم خطًا زمنيًا لأحداث الهجرة حتى الخروج من الغار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=22"]]}, {"no": 39, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "الهجرة المباركة", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "86-91", "f": [["عنوان الدرس", "الهجرة المباركة"], ["نواتج التعلم", "1. يصف رحلة النبي ﷺ إلى يثرب عبر طريق الساحل ومروره بخيمة أم معبد (15 دقيقة)\n2. يصف استقبال أهل يثرب للنبي ﷺ (15 دقيقة)\n3. يستخلص الدروس المستفادة من الهجرة (10 دقائق)"], ["الاستراتيجيات", "القصة\nلعب الأدوار\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص88-91\nخريطة\nجهاز عرض"], ["التهيئة (5 دقائق)", "لعب أدوار قصير: أهل يثرب يخرجون كل صباح لانتظار النبي ﷺ"], ["إجراءات التنفيذ (20 دقيقة)", "1. الرحلة: الخروج من الغار مع الدليل عبر طريق الساحل الأبعد؛ المرور بخيمة أم معبد الخزاعية والشاة الهزيلة التي حلبها النبي ﷺ فسقى منها ومن معه؛ إسلام أم معبد وزوجها بعد ذلك (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. الوصول والدروس: خروج المسلمين كل صباح لانتظاره ﷺ حتى يشتد الحر؛ وصوله واستقباله بفرح غامر؛ تسمية يثرب بالمدينة؛ الدروس: الصحبة الصالحة، الصبر، التوكل، البركة (7 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – حب الوطن من الهجرة: يتأمل الطلبة حنين النبي صلى الله عليه وسلم إلى مكة عند الهجرة، ثم يكتب كل ثنائي جملة تعبر عن حبهم لعمان وكيف يترجمونه إلى عمل (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا سلك النبي ﷺ طريق الساحل؟\nالإجابة النموذجية: لأنه أبعد من الطريق المعتاد فيأمن مطاردة قريش\n2) (تطبيق) ماذا حدث في خيمة أم معبد؟\nالإجابة النموذجية: حلب النبي ﷺ شاة هزيلة لا لبن فيها فدرّت فسقى منها ومن معه\n3) (استدلال) ماذا سمّى النبي ﷺ يثرب؟\nالإجابة النموذجية: المدينة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف استقبال أهل يثرب للنبي ﷺ.\nالإجابة النموذجية: خرجوا لاستقباله في فرحة غامرة مستبشرين بمقدمه\n2) (تطبيق) علل: حرص الرسول ﷺ على الصحبة في الهجرة.\nالإجابة النموذجية: لأن الرفيق يعين على مشاق الطريق ويؤنس ويشارك في المهام\n3) (استدلال) استخلص درسين من الهجرة المباركة.\nالإجابة النموذجية: التوكل على الله مع الأخذ بالأسباب، والتضحية في سبيل الدين"], ["الغلق (3 دقائق)", "تلخيص قصة الهجرة في خمس جمل جماعيًا"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=22"]]}, {"no": 40, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 1, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (1-5) من سورة المزمل تلاوة صحيحة (15 دقيقة)\n2. يحفظ الآيات (1-5) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: المزمل، رتّل، قولًا ثقيلًا (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص14-15\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- الاستماع لتلاوة الآيات (1-5)\n- سؤال: بمَ نادى الله نبيه هنا؟ وبمَ ناداه في سورة المدثر؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية ومحاكاة؛ ملاحظة الإخفاء في (ٱنقُصۡ) والإظهار الحلقي في (مِنۡهُ) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: المزمل (المتلفف بثيابه)، رتّل القرآن (اقرأه بتمهل وتبيين)، قولًا ثقيلًا (القرآن بما فيه من تكاليف عظيمة) (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – رتّل كقرّاء عمان: يتبادل الطلبة في ثنائيات ترتيل ال ده كرمه إلى الإسراف، حييًا لا يمنعه حياؤه من تعليم الناس؛ ﴿لَّقَدۡ كَانَ لَكُمۡ فِي رَسُولِ ٱللَّهِ أُسۡوَةٌ حَسَنَةٞ …﴾ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف الغلو.\nالإجابة النموذجية: التشدد ومجاوزة الحد\n2) (تطبيق) ما معنى (سددوا وقاربوا)؟\nالإجابة النموذجية: الزموا التوسط في الأعمال واقتربوا من الأكمل إن لم تستطيعوه\n3) (استدلال) اذكر صورة من اعتدال النبي ﷺ.\nالإجابة النموذجية: كان كريمًا دون إسراف (أو حليمًا دون ضعف)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (لن يشادّ الدين أحد إلا غلبه)؟\nالإجابة النموذجية: من يتشدد في الدين ويكلف نفسه ما لا تطيق يعجز وينقطع\n2) (تطبيق) لماذا أمرنا الله بالتأسي بالنبي ﷺ؟\nالإجابة النموذجية: لأنه القدوة الكاملة في الاعتدال وسائر الأخلاق\n3) (استدلال) أكمل: المسلم يؤدي الفرائض والنوافل من غير أن ......\nالإجابة النموذجية: يكلف نفسه فوق طاقتها"], ["الغلق (3 دقائق)", "كل طالب يذكر عملًا يعتدل فيه"], ["الواجب المنزلي", "اكتب موقفًا يظهر فيه الاعتدال في يومك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=24"]]}, {"no": 42, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثانية", "title": "الاعتدال منهجي في الحياة", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "92-96", "f": [["عنوان الدرس", "الاعتدال منهجي في الحياة"], ["نواتج التعلم", "1. يستخرج مظاهر الاعتدال من النصوص الشرعية (المأكل والمشرب، الإنفاق، الكلام، التوازن بين الدنيا والآخرة) (15 دقيقة)\n2. يحكم على مواقف في ضوء مفهوم الاعتدال (15 دقيقة)\n3. يقترح سلوكيات معتدلة في حياته اليومية (10 دقائق)"], ["الاستراتيجيات", "التصنيف\nالتعلم التعاوني\nحل المشكلات"], ["مصادر التعلم", "كتاب الطالب ص94-96\nبطاقات النصوص والمظاهر\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: كيف يكون الاعتدال في الطعام؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. المظاهر: المأكل والمشرب: ﴿… وَكُلُواْ وَٱشۡرَبُواْ وَلَا تُسۡرِفُوٓاْۚ …﴾؛ الإنفاق: ﴿وَٱلَّذِينَ إِذَآ أَنفَقُواْ لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ …﴾؛ الكلام: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت»؛ التوازن: ﴿وَٱبۡتَغِ فِيمَآ ءَاتَىٰكَ ٱللَّهُ ٱلدَّارَ ٱلۡأٓخِرَةَۖ وَلَا تَنسَ نَصِيبَكَ مِنَ ٱلدُّنۡيَاۖ …﴾ (8 دقائق)\nالاستراتيجيات: التصنيف.\n\n2. المواقف: الحكم على مواقف الكتاب: من يقضي يومه كله في الألعاب الإلكترونية، من يصوم ويقوم ويهمل دراسته، من يشتري كل ما يراه؛ اقتراح البديل المعتدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – ميزان الاعتدال العماني: تعطي كل مجموعة أمثلة للاعتدال في الحياة اليومية كالإنفاق في الأعراس والطعام في المناسبات، وتربطها بما عُرف عن أهل عمان من وسطية واتزان (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما مظهر الاعتدال في: ﴿… لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ …﴾؟\nالإجابة النموذجية: الاعتدال في الإنفاق\n2) (تطبيق) ما مظهر الاعتدال في حديث «فليقل خيرًا أو ليصمت»؟\nالإجابة النموذجية: الاعتدال في الكلام\n3) (استدلال) احكم: طالب يسهر على الألعاب الإلكترونية حتى الفجر.\nالإجابة النموذجية: تصرف غير معتدل يضر بصحته ودراسته وعبادته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج مظهر التوازن بين الدنيا والآخرة من آية القصص.\nالإجابة النموذجية: أن يبتغي المسلم الآخرة بما آتاه الله ولا ينسى نصيبه المباح من الدنيا\n2) (تطبيق) ضع دائرة على ما يتفق مع الاعتدال: (التبذير، الوسطية، البخل، التوازن).\nالإجابة النموذجية: الوسطية، والتوازن\n3) (استدلال) اقترح جدولًا يوميًا معتدلًا يجمع العبادة والدراسة والراحة.\nالإجابة النموذجية: جدول واقعي متوازن (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "شعار الصف: خير الأمور أوسطها في السلوك"], ["الواجب المنزلي", "حل أنشطة (أقيّم تعلمي).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=24"]]}, {"no": 43, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الإظهار الحلقي في النون الساكنة والتنوين", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "99-103", "f": [["عنوان الدرس", "الإظهار الحلقي في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يعرّف الإظهار لغة واصطلاحًا (10 دقائق)\n2. يعدد حروف الإظهار الحلقي الستة (15 دقيقة)\n3. يستخرج حروف الإظهار من بيتي تحفة الأطفال (15 دقيقة)"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتلاوة والمحاكاة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص99-101\nالمصحف الشريف\nرسم مخارج الحلق"], ["التهيئة (5 دقائق)", "تذكير بمخارج الحلق الثلاثة وحروفها"], ["إجراءات التنفيذ (20 دقيقة)", "1. المفهوم: الإظهار لغة: البيان والإيضاح؛ اصطلاحًا: إخراج النون الساكنة أو التنوين من مخرجه من غير غنة زائدة إذا جاء بعده حرف من حروف الإظهار؛ بيتا تحفة الأطفال: (فعند حرف الحلق أظهر ...) واستخراج الحروف (10 دقائق)\nالاستراتيجيات: الاستقصاء الموجه.\n\n2. الحروف: حروف الإظهار الحلقي ستة: الهمزة، الهاء، العين، الحاء، الغين، الخاء؛ ربطها بمخارجها: أقصى الحلق (ء هـ)، وسطه (ع ح)، أدناه (غ خ)؛ سبب التسمية: لأن حروفه تخرج من الحلق (10 دقائق)\nالاستراتيجيات: التلاوة والمحاكاة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف الإظهار لغة.\nالإجابة النموذجية: البيان والإيضاح\n2) (تطبيق) عدّد حروف الإظهار الحلقي.\nالإجابة النموذجية: الهمزة، والهاء، والعين، والحاء، والغين، والخاء\n3) (استدلال) لماذا سُمي الإظهار حلقيًا؟\nالإجابة النموذجية: لأن حروفه تخرج من الحلق"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم النون في (مَنۡ خَلَقۡتُ)؟\nالإجابة النموذجية: إظهار حلقي لأن بعدها الخاء\n2) (تطبيق) ما حكم التنوين في (عَذَابًا أَلِيمٗا)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده الهمزة\n3) (استدلال) اكتب مثالًا لإظهار حلقي في كلمة واحدة.\nالإجابة النموذجية: مثل: يَنۡهَوۡنَ (النون الساكنة قبل الهاء)"], ["الغلق (3 دقائق)", "ترديد جماعي لحروف الإظهار بترتيب مخارجها"], ["الواجب المنزلي", "احفظ بيتي تحفة الأطفال في الإظهار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=25"]]}, {"no": 44, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الإظهار الحلقي في النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "99-103", "f": [["عنوان الدرس", "الإظهار الحلقي في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يستخرج أمثلة للإظهار الحلقي من الآيات القرآنية (15 دقيقة)\n2. يقارن بين الإظهار الشفوي والإظهار الحلقي (15 دقيقة)\n3. يطبق الإظهار الحلقي في تلاوته (10 دقائق)"], ["الاستراتيجيات", "التلاوة والمحاكاة\nالجدول المقارن\nالمسابقة"], ["مصادر التعلم", "كتاب الطالب ص101-103\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "الاستماع لآيات فيها إظهار حلقي ومحاكاتها"], ["إجراءات التنفيذ (20 دقيقة)", "1. الاستخراج: استخراج أمثلة من سورتي المدثر والمزمل: (مَنۡ خَلَقۡتُ)، (إِنۡ هَٰذَآ)، (يَوۡمٌ عَسِيرٌ)، (مِنۡهُ)، (عَذَابًا أَلِيمٗا)؛ تحديد الحرف المظهر ونوع النون (ساكنة/تنوين) (8 دقائق)\nالاستراتيجيات: التلاوة والمحاكاة.\n\n2. المقارنة والتطبيق: جدول: الإظهار الشفوي (الميم الساكنة، حروفه كل الحروف عدا الميم والباء، مخرجه الشفتان) / الإظهار الحلقي (النون الساكنة والتنوين، حروفه ستة حلقية)؛ تلاوة فردية مع تطبيق الإظهار؛ أقيّم تعلمي (7 دقائق)\nالاستراتيجيات: الجدول المقارن.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – من عبري إلى خصب: تكوّن المجموعات عبارات عن عمان فيها نون ساكنة أو تنوين بعدهما حرف حلقي، مثل «من عبري، من خصب، فلجٌ عذب»، وتنطقها بالإظهار الحلقي (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج إظهارًا حلقيًا من ﴿إِنۡ هَٰذَآ إِلَّا قَوۡلُ ٱلۡبَشَرِ﴾.\nالإجابة النموذجية: (إِنۡ هَٰذَآ): النون الساكنة قبل الهاء\n2) (تطبيق) ما الفرق بين الإظهار الشفوي والحلقي؟\nالإجابة النموذجية: الشفوي للميم الساكنة قبل غير الميم والباء، والحلقي للنون الساكنة والتنوين قبل الحروف الحلقية الستة\n3) (استدلال) ما حكم التنوين في (يَوۡمٌ عَسِيرٌ)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده العين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اختر من حروف الإظهار: (ب، ح، ل).\nالإجابة النموذجية: الحاء\n2) (تطبيق) حدد الحكم والسبب: (مِنۡ عِلۡمٍ).\nالإجابة النموذجية: إظهار حلقي لأن بعد النون الساكنة العين\n3) (استدلال) اتلُ ﴿ذَرۡنِي وَمَنۡ خَلَقۡتُ وَحِيدٗا﴾ مطبقًا الإظهار.\nالإجابة النموذجية: تلاوة تظهر النون في (مَنۡ خَلَقۡتُ) دون غنة زائدة"], ["الغلق (3 دقائق)", "مسابقة: كل مجموعة تستخرج أكبر عدد من أمثلة الإظهار من سورة المزمل"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=25"]]}, {"no": 45, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 2, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (6-9) تلاوة صحيحة (15 دقيقة)\n2. يحفظ الآيات (6-9) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: ناشئة الليل، أشد وطئًا، سبحًا طويلًا، تبتّل، وكيلًا (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (1-5)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (6-9) ومحاكاة؛ ملاحظة الإدغام بغنة في (وَطۡـٔٗا وَأَقۡوَمُ) والإخفاء في (سَبۡحٗا طَوِيلٗا) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: ناشئة الليل (العبادة في الليل)، أشد وطئًا (أثبت وأشد مواطأة للقلب)، أقوم قيلًا (أصوب قراءة)، سبحًا طويلًا (تصرفًا وتقلبًا في الأعمال)، تبتّل (انقطع إلى عبادته)، وكيلًا (كافيًا تفوض إليه أمورك) (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – يوم صياد من صور: تصف كل مجموعة يومًا لصياد أو مزارع عماني يجمع بين السعي في النهار وذكر الله، مستلهمة معنى «إن لك في النهار سبحًا طويلًا» (5 دقائق)\nالاستراتيجيات: الإنتاج السريع."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ …﴾\nالإجابة النموذجية: ﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ أَشَدُّ وَطۡـٔٗا وَأَقۡوَمُ قِيلًا﴾\n2) (تطبيق) ما معنى (وتبتّل إليه تبتيلًا)؟\nالإجابة النموذجية: انقطع إلى عبادته انقطاعًا تامًا\n3) (استدلال) ما معنى (ناشئة الليل)؟\nالإجابة النموذجية: العبادة والقيام في الليل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا﴾.\nالإجابة النموذجية: ﴿رَّبُّ ٱلۡمَشۡرِقِ وَٱلۡمَغۡرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذۡهُ وَكِيلٗا﴾\n2) (تطبيق) لماذا كانت عبادة الليل أشد وطئًا وأقوم قيلًا؟\nالإجابة النموذجية: لأن القلب يكون فارغًا من مشاغل الدنيا فيتواطأ مع اللسان\n3) (استدلال) ما معنى (فاتخذه وكيلًا)؟\nالإجابة النموذجية: اجعله كافيك وفوّض إليه أمورك"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-9)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-9).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=26"]]}, {"no": 46, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 1, "n": 3, "wi": 2, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (10-13) تلاوة صحيحة (20 دقيقة)\n2. يوضح معاني المفردات: إخوة، لا يسخر، لا تلمزوا، لا تنابزوا بالألقاب (5 دقائق)\n3. يبين أن الأخوة الإيمانية أساس المجتمع المسلم ووجوب الإصلاح بين المتخاصمين (15 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالصور والمواقف\nالحوار والمناقشة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص104-107\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "وصف موقفين مصورين في الكتاب: خصام بين زميلين، وصلح بينهما"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (10-13) ومحاكاة؛ ملاحظة الإدغام بغنة في (أَن يَكُونُواْ)، والإخفاء في (مِّن ذَكَرٖ)، والإظهار الحلقي في (عَلِيمٌ خَبِيرٞ) (10 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الأخوة والإصلاح: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ﴾؛ المؤمنون إخوة متحابون متضامنون، والوحدة هي الأصل؛ الخلاف يعالج فور وقوعه بالسعي إلى الصلح؛ التقوى سبب للرحمة (10 دقائق)\nالاستراتيجيات: الصور والمواقف."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ …﴾\nالإجابة النموذجية: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n2) (تطبيق) ما الأساس الذي تقوم عليه علاقة المؤمنين ببعضهم؟\nالإجابة النموذجية: الأخوة الإيمانية\n3) (استدلال) ما واجب المسلمين إذا تخاصم أخوان؟\nالإجابة النموذجية: الإصلاح بينهما فورًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما ثمرة التقوى والإصلاح كما في ختام الآية (10)؟\nالإجابة النموذجية: الرحمة ﴿… لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n2) (تطبيق) ما معنى (لا يسخر قوم من قوم)؟\nالإجابة النموذجية: لا يستهزئ بعضهم ببعض\n3) (استدلال) كيف تتصرف إذا رأيت زميلين متخاصمين؟\nالإجابة النموذجية: أسعى إلى الصلح بينهما بالكلمة الطيبة"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (10)"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (10-13).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 47, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 2, "n": 3, "wi": 3, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يحدد التصرفات الذميمة التي نهت عنها الآيات (السخرية، اللمز، التنابز بالألقاب، سوء الظن، التجسس، الغيبة) (20 دقيقة)\n2. يوضح خطر كل منها على الأخوة (15 دقيقة)\n3. يستخرج النواهي الخمسة المسبوقة بـ(لا) (5 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالجدول\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص107-109\nبطاقات النواهي\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "سؤال: كم مرة تكرر حرف النهي (لا) في الآيتين (11-12)؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. النواهي: لا يسخر، ولا تلمزوا أنفسكم، ولا تنابزوا بالألقاب، ولا تجسسوا، ولا يغتب بعضكم بعضًا؛ اجتناب كثير من الظن؛ معاني: تلمزوا (تعيبوا)، تنابزوا (تتداعوا بالألقاب المكروهة)، تجسسوا (تتبعوا العورات) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الغيبة: تصوير الغيبة بأكل لحم الأخ ميتًا وتنفير النفوس منها؛ حديث: «أتدرون ما الغيبة؟ ... ذكرك أخاك بما يكره»؛ توجيه نصيحة في موقف من الكتاب (10 دقائق)\nالاستراتيجيات: الجدول."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج النواهي الخمسة المسبوقة بـ(لا).\nالإجابة النموذجية: لا يسخر، لا تلمزوا، لا تنابزوا، لا تجسسوا، لا يغتب\n2) (تطبيق) ما معنى (ولا تنابزوا بالألقاب)؟\nالإجابة النموذجية: لا ينادي بعضكم بعضًا بالألقاب التي يكرهها\n3) (استدلال) بمَ شبّه الله الغيبة؟\nالإجابة النموذجية: بأكل لحم الأخ وهو ميت"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الغيبة؟\nالإجابة النموذجية: ذكرك أخاك في غيابه بما يكره\n2) (تطبيق) لماذا أمر الله باجتناب كثير من الظن؟\nالإجابة النموذجية: لأن بعض الظن إثم يفسد القلوب ويقطع الأخوة\n3) (استدلال) نادى زميل زميله بلقب يكرهه، بماذا تنصحه؟\nالإجابة النموذجية: أذكّره بقوله تعالى ﴿… وَلَا تَنَابَزُواْ بِٱلۡأَلۡقَٰبِۖ …﴾ وأدعوه إلى الاعتذار"], ["الغلق (3 دقائق)", "كل مجموعة تختار نهيًا وتكتب بديله الإيجابي"], ["الواجب المنزلي", "اكتب موقفًا تطبق فيه أحد آداب الآيات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 48, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 3, "n": 3, "wi": 4, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين الغاية من خلق الناس شعوبًا وقبائل (التعارف) (15 دقيقة)\n2. يستنتج أن ميزان التفاضل عند الله هو التقوى (15 دقيقة)\n3. يقوّم تعلمه في درس سورة الحجرات (10 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص109-110 (أقيّم تعلمي)\nخريطة العالم\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض خريطة العالم: شعوب وألوان ولغات مختلفة\n- سؤال: لماذا خلقنا الله مختلفين؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. التعارف والتقوى: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ﴾؛ الغاية: التعارف والتآلف لا التنازع والشقاق؛ لا اعتبار للون ولا للجنس ولا للغة في ميزان التفاضل؛ الميزان الوحيد: التقوى (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. أقيّم تعلمي: إكمال الفراغ والاختيار؛ ربط الآيات بقيم التسامح والتعايش (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – لتعارفوا في عمان: تستخرج المجموعات ما نهت عنه الآيات (10-13) من سورة الحجرات كالسخرية واللمز، وتقترح بدائل إيجابية تعزز الأخوة والتعارف في المجتمع العماني (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الغاية من جعل الناس شعوبًا وقبائل؟\nالإجابة النموذجية: ليتعارفوا\n2) (تطبيق) ما ميزان التفاضل عند الله؟\nالإجابة النموذجية: التقوى\n3) (استدلال) أكمل: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ …﴾\nالإجابة النموذجية: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ﴾"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل يُفضَّل الإنسان عند الله بلونه أو نسبه؟\nالإجابة النموذجية: لا، بل بتقواه\n2) (تطبيق) ما القيمة التي تدعو إليها الآية (13)؟\nالإجابة النموذجية: المساواة والتعارف ونبذ التفاخر بالأنساب\n3) (استدلال) كيف تتعامل مع زميل من بلد آخر في ضوء الآية؟\nالإجابة النموذجية: أتعارف عليه وأحترمه وأتعاون معه"], ["الغلق (3 دقائق)", "تلاوة جماعية للآيات (10-13)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 49, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من فضائل الأعمال (حديث شريف)", "k": 1, "n": 2, "wi": 5, "wn": 5, "pages": "111-116", "f": [["عنوان الدرس", "من فضائل الأعمال (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه (5 دقائق)\n2. يعرّف براوي الحديث أنس بن مالك رضي الله عنه (5 دقائق)\n3. يحدد الأعمال التي يمحو الله بها الخطايا ويرفع بها الدرجات (30 دقيقة)"], ["الاستراتيجيات", "القصة\nالتكرار الموجّه\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص111-113\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "قصة الكتاب: الأب يوقظ ابنه لصلاة الفجر، والابن يتوضأ مسرعًا لبرودة الماء"], ["إجراءات التنفيذ (20 دقيقة)", "1. الحديث: «ألا أخبركم بما يمحو الله به الخطايا ويرفع به الدرجات؟ إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة، فذلكم الرباط»؛ الراوي: أنس بن مالك، خادم رسول الله ﷺ (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. الحفظ والمعاني: حفظ الحديث؛ يمحو الخطايا: يغفر المعاصي؛ إسباغ الوضوء: إتمامه وإيفاء الأعضاء حقها؛ المكاره: ما تكرهه النفس كالبرد؛ الرباط: حبس النفس على الطاعات (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – خطوات إلى مسجد الحارة: ترسم كل مجموعة طريقها إلى مسجد الحارة في قريتها، وتتحاور في فضل كثرة الخطا إلى المساجد كما في الحديث، وعادة المشي إلى المسجد في القرى العمانية (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من راوي الحديث؟\nالإجابة النموذجية: أنس بن مالك رضي الله عنه\n2) (تطبيق) ما معنى (إسباغ الوضوء على المكاره)؟\nالإجابة النموذجية: إتمام الوضوء وإيفاء الأعضاء حقها رغم المشقة كالبرد\n3) (استدلال) أكمل: «... وانتظار الصلاة بعد الصلاة ...».\nالإجابة النموذجية: فذلكم الرباط"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر الأعمال الثلاثة الواردة في الحديث.\nالإجابة النموذجية: إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة\n2) (تطبيق) ما معنى (الرباط) في الحديث؟\nالإجابة النموذجية: حبس النفس على الطاعات وملازمتها\n3) (استدلال) ماذا قال الأب لابنه حين توضأ مسرعًا؟\nالإجابة النموذجية: أسبغ وضوءك يا بني، فمن أسبغ وضوءه على المكاره له الدرجات العلا"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=28"]]}, {"no": 50, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 3, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (10-14) تلاوة صحيحة مطبقًا الإظهار الحلقي (15 دقيقة)\n2. يحفظ الآيات (10-14) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: هجرًا جميلًا، أولي النعمة، أنكالًا، ذا غصة، كثيبًا مهيلًا (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (6-9)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (10-14) ومحاكاة؛ ملاحظة الإظهار الحلقي في (عَذَابًا أَلِيمٗا) والإخفاء في (أَنكَالٗا) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: هجرًا جميلًا (هجرًا لا أذى فيه)، أولي النعمة (أصحاب الترف)، أنكالًا (قيودًا ثقيلة)، ذا غصة (يعلق في الحلق)، ترجف (تضطرب)، كثيبًا مهيلًا (رملًا متناثرًا سائلًا) (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – من الحجر إلى الكثيب: تربط المجموعات قوله تعالى «وكانت الجبال كثيبًا مهيلًا» بمشهد جبال الحجر الشامخة ورمال الشرقية، وتتأمل عظمة يوم القيامة وقيمة الصبر على الأذى (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿وَٱصۡبِرۡ عَلَىٰ مَا …﴾\nالإجابة النموذجية: ﴿وَٱصۡبِرۡ عَلَىٰ مَا يَقُولُونَ وَٱهۡجُرۡهُمۡ هَجۡرٗا جَمِيلٗا﴾\n2) (تطبيق) ما معنى (هجرًا جميلًا)؟\nالإجابة النموذجية: هجرًا لا أذى فيه ولا عتاب\n3) (استدلال) ما حكم التنوين في (عَذَابًا أَلِيمٗا)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده الهمزة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿إِنَّ لَدَيۡنَآ أَنكَالٗا وَجَحِيمٗا﴾.\nالإجابة النموذجية: ﴿وَطَعَامٗا ذَا غُصَّةٖ وَعَذَابًا أَلِيمٗا﴾\n2) (تطبيق) ما معنى (كثيبًا مهيلًا)؟\nالإجابة النموذجية: رملًا متناثرًا سائلًا\n3) (استدلال) ما الذي أمر الله نبيه به تجاه أذى المكذبين في الآية (10)؟\nالإجابة النموذجية: الصبر على قولهم وهجرهم هجرًا جميلًا"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-14)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-14).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=29"]]}, {"no": 51, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من فضائل الأعمال (حديث شريف)", "k": 2, "n": 2, "wi": 2, "wn": 5, "pages": "111-116", "f": [["عنوان الدرس", "من فضائل الأعمال (حديث شريف)"], ["نواتج التعلم", "1. يوضح أثر الأعمال الواردة في الحديث في حياة المسلم (15 دقيقة)\n2. يستنتج وجه الشبه بين الرباط في سبيل الله والمواظبة على الطاعات (15 دقيقة)\n3. يحكم على مواقف في ضوء الحديث (10 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص113-116\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "- تسميع الحديث\n- تذكير بقصة يوسف الجار المعلق قلبه بالمسجد"], ["إجراءات التنفيذ (20 دقيقة)", "1. الأثر ووجه الشبه: الأعمال ترفع الدرجات وتمحو الخطايا؛ وجه الشبه بين الرباط وانتظار الصلاة: ملازمة الموضع وحبس النفس على الطاعة؛ كتابة الأعمال التي ترفع الدرجات كما في الحديث (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الحكم على المواقف: مواقف الكتاب: من يصر على الذهاب للمسجد رغم المطر، من يتوضأ مسرعًا لا يتم أعضاءه، من يجلس بعد الصلاة يذكر الله؛ أقيّم تعلمي (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – شكرًا لحماة الوطن: تستنتج المجموعات معنى الرباط من الحديث، ثم تكتب بطاقة شكر قصيرة لحماة عمان الساهرين على أمنها من الجيش والشرطة (5 دقائق)\nالاستراتيجيات: الإنتاج السريع."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما وجه الشبه بين الرباط في سبيل الله وانتظار الصلاة بعد الصلاة؟\nالإجابة النموذجية: كلاهما ملازمة وحبس للنفس على طاعة الله\n2) (تطبيق) احكم: طالب يتوضأ بسرعة ولا يغسل أعضاءه كاملة لبرودة الماء.\nالإجابة النموذجية: تصرف خاطئ، والصواب إسباغ الوضوء على المكاره ليرفع الله درجته\n3) (استدلال) اذكر عملًا من الحديث يمكنك القيام به يوميًا.\nالإجابة النموذجية: كثرة الخطا إلى المساجد (أو انتظار الصلاة بعد الصلاة)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما ثواب من يكثر الخطا إلى المساجد؟\nالإجابة النموذجية: يرفع الله له بكل خطوة درجة ويحط عنه خطيئة\n2) (تطبيق) صحح: انتظار الصلاة بعد الصلاة من الأعمال المكروهة.\nالإجابة النموذجية: من الأعمال الفاضلة التي يرفع الله بها الدرجات\n3) (استدلال) خطط لثلاثة أيام تطبق فيها الحديث.\nالإجابة النموذجية: خطة واقعية تتضمن الأعمال الثلاثة"], ["الغلق (3 دقائق)", "كل طالب يكتب عملًا من الحديث سيبدأ به اليوم"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=30"]]}, {"no": 52, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الله الحليم", "k": 1, "n": 1, "wi": 3, "wn": 5, "pages": "117-121", "f": [["عنوان الدرس", "الله الحليم"], ["نواتج التعلم", "1. يتعرف معنى اسم الله (الحليم) (15 دقيقة)\n2. يستدل على حلم الله تعالى من القرآن الكريم (5 دقائق)\n3. يفرق بين حلم الله وحلم المخلوق (20 دقيقة)"], ["الاستراتيجيات", "التدبر\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص117-121\nالمصحف الشريف\nبطاقات أسماء الله الحسنى"], ["التهيئة (5 دقائق)", "تذكر أسماء الله الحسنى التي دُرست سابقًا ووضع دائرة حولها في نشاط الكتاب"], ["إجراءات التنفيذ (20 دقيقة)", "1. المعنى والدليل: الله متصف بصفات الكمال منزه عن كل نقص: ﴿وَلِلَّهِ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰ فَٱدۡعُوهُ بِهَاۖ …﴾؛ الحليم: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب؛ ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ وَلَٰكِن يُؤَخِّرُهُمۡ إِلَىٰٓ أَجَلٖ مُّسَمّٗىۖ …﴾ (8 دقائق)\nالاستراتيجيات: التدبر.\n\n2. حلم المخلوق والتطبيق: الله ليس كمثله شيء، فحلم المخلوق ليس كحلم الله، وحلم المخلوق يتغير بالأسباب؛ قول القرطبي: من عرف أن ربه حليم فأولى أن يحلم على من خالفه؛ موقف: أخ صغير أتلف مجسم مشروع أحمد، كيف يطبق الحلم؟ (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – حِلم الشيبة: يمثّل الطلبة موقفًا لشاب متسرع غاضب وشيخ عماني حليم يهدّئه ويحل المشكلة بهدوء، ثم يربطون الحلم البشري بحلم الله تعالى الواسع (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى اسم الله (الحليم)؟\nالإجابة النموذجية: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب\n2) (تطبيق) استدل من القرآن على حلم الله.\nالإجابة النموذجية: ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ …﴾\n3) (استدلال) ما الفرق بين حلم الله وحلم المخلوق؟\nالإجابة النموذجية: حلم الله كامل لا يتغير، وحلم المخلوق ناقص يتغير بالأسباب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف تطبق صفة الحلم إذا أتلف أخوك الصغير مشروعك؟\nالإجابة النموذجية: أضبط غضبي وأعفو عنه وأعلّمه بهدوء، ثم أصلح المشروع\n2) (تطبيق) ما واجب من عرف أن ربه حليم؟\nالإجابة النموذجية: أن يتوب إليه ولا يغتر بإمهاله، وأن يحلم على من أساء إليه\n3) (استدلال) اذكر اسمين آخرين من أسماء الله الحسنى درستهما.\nالإجابة النموذجية: الرحمن، الرحيم (تقبل الأسماء الصحيحة)"], ["الغلق (3 دقائق)", "دعاء: يا حليم اغفر لنا وتجاوز عنا"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=31"]]}, {"no": 53, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من أحكام صلاة الجمعة", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "122-127", "f": [["عنوان الدرس", "من أحكام صلاة الجمعة"], ["نواتج التعلم", "1. يبين فضل يوم الجمعة (20 دقيقة)\n2. يوضح حكم صلاة الجمعة وعلى من تجب (15 دقيقة)\n3. يصف كيفية أداء صلاة الجمعة وخطبتيها (5 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالخريطة الذهنية\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص122-124\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: ما الذي يميز يوم الجمعة في أسرتك؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الفضل والحكم: «خير يوم طلعت عليه الشمس يوم الجمعة»؛ حكمها: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها؛ الدليل: آية الجمعة: الأمر بالسعي إلى ذكر الله وترك البيع؛ يجوز للمرأة أن تصليها في المسجد ولا تجب عليها؛ «من ترك ثلاث جمع تهاونًا بها طبع الله على قلبه» (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الكيفية: ركعتان في وقت الظهر تتقدمهما خطبتان بينهما جلسة خفيفة؛ يدخل الإمام ويصعد المنبر ويسلم على المأمومين ثم يجلس حتى يفرغ المؤذن؛ يخطب، ويدعو في الثانية لنفسه وللمسلمين؛ يقيم المؤذن وينزل الخطيب فيصلي بهم ركعتين يجهر فيهما بالقراءة (10 دقائق)\nالاستراتيجيات: الخريطة الذهنية."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما حكم صلاة الجمعة؟\nالإجابة النموذجية: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها\n2) (تطبيق) هل تجب صلاة الجمعة على المرأة؟\nالإجابة النموذجية: لا تجب عليها ويجوز لها أداؤها في المسجد\n3) (استدلال) كم ركعة صلاة الجمعة؟\nالإجابة النموذجية: ركعتان يجهر فيهما بالقراءة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي يسبق صلاة الجمعة؟\nالإجابة النموذجية: خطبتان بينهما جلسة خفيفة\n2) (تطبيق) ما جزاء من ترك ثلاث جمع تهاونًا؟\nالإجابة النموذجية: يطبع الله على قلبه\n3) (استدلال) استخرج من آية الجمعة أمرين.\nالإجابة النموذجية: السعي إلى ذكر الله، وترك البيع"], ["الغلق (3 دقائق)", "خريطة ذهنية: صلاة الجمعة (الحكم، على من تجب، الكيفية)"], ["الواجب المنزلي", "اكتب خطوات صلاة الجمعة بالترتيب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=32"]]}, {"no": 54, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من أحكام صلاة الجمعة", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "122-127", "f": [["عنوان الدرس", "من أحكام صلاة الجمعة"], ["نواتج التعلم", "1. يعدد سنن يوم الجمعة وآدابها (15 دقيقة)\n2. يوضح أهمية الإنصات للخطبة (15 دقيقة)\n3. يحكم على مواقف في ضوء أحكام الجمعة (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالتصنيف\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص124-127\nبطاقات السنن والمواقف\nالسبورة"], ["التهيئة (5 دقائق)", "تأمل الشكل في الكتاب وكتابة سنن يوم الجمعة"], ["إجراءات التنفيذ (20 دقيقة)", "1. السنن والآداب: الاغتسال، التطيب، السواك، التزين، التبكير، عدم تخطي الرقاب، الاجتهاد في الذكر والدعاء، الإكثار من الصلاة على النبي ﷺ، تلاوة القرآن، الإنصات للخطبة؛ حديث: «لا يغتسل رجل يوم الجمعة ... ثم ينصت إذا تكلم الإمام إلا غُفر له ما بينه وبين الجمعة الأخرى»؛ الحرص على الصفوف الأولى وإكمالها أولًا بأول (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. المواقف: أقيّم تعلمي: موقف من يتحدث مع زميله أثناء الخطبة، ومن يتخطى الرقاب، ومن يتأخر بلا عذر؛ توضيح الحكم الشرعي في كل موقف (7 دقائق)\nالاستراتيجيات: التصنيف.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – جمعة الأسرة العمانية: تخطط كل مجموعة يوم الجمعة لأسرة عمانية بدءًا من الاغتسال والتبكير إلى المسجد والإنصات للخطبة حتى اجتماع العائلة على الغداء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر ثلاثًا من سنن يوم الجمعة.\nالإجابة النموذجية: الاغتسال، والتطيب، والتبكير إلى المسجد (أو السواك، الصلاة على النبي ﷺ)\n2) (تطبيق) ما الواجب على المصلي أثناء الخطبة؟\nالإجابة النموذجية: الاستماع والإنصات وعدم الانشغال بشيء\n3) (استدلال) ما جزاء من اغتسل وتطهر وأنصت للخطبة؟\nالإجابة النموذجية: يُغفر له ما بينه وبين الجمعة الأخرى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) احكم: مصلٍّ يتخطى الرقاب ليصل إلى الصف الأول.\nالإجابة النموذجية: تصرف خاطئ، والصواب أن يجلس حيث انتهى به المجلس دون أذى\n2) (تطبيق) لماذا يُستحب التبكير إلى صلاة الجمعة؟\nالإجابة النموذجية: لنيل الأجر العظيم والصف الأول والاستعداد للخطبة\n3) (استدلال) صمم بطاقة تذكير بآداب يوم الجمعة لأسرتك.\nالإجابة النموذجية: بطاقة تضم أربع سنن على الأقل"], ["الغلق (3 دقائق)", "كل طالب يذكر سنة سيحرص عليها الجمعة القادمة"], ["الواجب المنزلي", "طبّق سنن الجمعة واكتب ما قمت به.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=32"]]}, {"no": 55, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 4, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (15-19) تلاوة صحيحة (15 دقيقة)\n2. يحفظ الآيات (15-19) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: أخذًا وبيلًا، شيبًا، منفطر به، تذكرة (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15-16\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (10-14)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للآيات (15-19) ومحاكاة؛ ملاحظة الإدغام بغنة في (يَوۡمٗا يَجۡعَلُ) والإخفاء في (إِن كَفَرۡتُمۡ) (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ مقطعي؛ معاني: أخذًا وبيلًا (شديدًا ثقيلًا)، شيبًا (شيوخًا من شدة الهول)، منفطر به (متشقق بسبب هوله)، تذكرة (موعظة) (7 دقائق)\nالاستراتيجيات: التكرار الموجّه.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – استجابة أهل عمان: تقارن المجموعات بين عصيان فرعون للرسول في الآيات (15-19) من سورة المزمل، واستجابة أهل عمان لرسالة النبي صلى الله عليه وسلم ودخولهم الإسلام طوعًا (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ …﴾\nالإجابة النموذجية: ﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ يَوۡمٗا يَجۡعَلُ ٱلۡوِلۡدَٰنَ شِيبًا﴾\n2) (تطبيق) ما معنى (أخذًا وبيلًا)؟\nالإجابة النموذجية: أخذًا شديدًا ثقيلًا\n3) (استدلال) إلى من أُرسل الرسول المذكور في الآية (15)؟\nالإجابة النموذجية: إلى فرعون"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿ٱلسَّمَآءُ مُنفَطِرُۢ بِهِۦۚ كَانَ وَعۡدُهُۥ مَفۡعُولًا﴾.\nالإجابة النموذجية: ﴿إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا﴾\n2) (تطبيق) ما معنى (يجعل الولدان شيبًا)؟\nالإجابة النموذجية: يجعل الصغار شيوخًا من شدة هوله\n3) (استدلال) ما حكم التنوين في (يَوۡمٗا يَجۡعَلُ)؟\nالإجابة النموذجية: إدغام بغنة لأن بعده الياء"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (10-19)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-19).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=33"]]}, {"no": 56, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "بناء المسجد", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "128-133", "f": [["عنوان الدرس", "بناء المسجد"], ["نواتج التعلم", "1. يسرد أحداث وصول النبي ﷺ إلى المدينة ونزوله بقباء (10 دقائق)\n2. يذكر أول مسجد في الإسلام (15 دقيقة)\n3. يستنتج حكمة النبي ﷺ في قوله: «خلوا سبيلها فإنها مأمورة» (15 دقيقة)"], ["الاستراتيجيات", "القصة\nالخط الزمني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص128-130\nصور حديثة لمسجد قباء والمسجد النبوي\nخريطة المدينة"], ["التهيئة (5 دقائق)", "- صور مسجد قباء والمسجد النبوي\n- سؤال: هل تعرف قصة بنائهما؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الوصول: وصل النبي ﷺ المدينة يوم الاثنين الثاني عشر من ربيع الأول بعد ثلاثة عشر عامًا من بعثته؛ نزل في ضاحية قباء بضعة أيام ووضع أساس أول مسجد في الإسلام: مسجد قباء (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. الناقة المأمورة: كلما مر بقبيلة من الأنصار سألوه النزول فيقول: «خلوا سبيلها فإنها مأمورة»؛ الحكمة: ألا تشعر عشيرة بإيثار غيرها فترضى النفوس؛ بركت في أرض لبني النجار فاشتراها وبنى فيها مسجده وحجرات نسائه، ونزل ضيفًا على أبي أيوب الأنصاري (10 دقائق)\nالاستراتيجيات: الخط الزمني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما أول مسجد بُني في الإسلام؟\nالإجابة النموذجية: مسجد قباء\n2) (تطبيق) متى وصل النبي ﷺ المدينة؟\nالإجابة النموذجية: يوم الاثنين الثاني عشر من ربيع الأول\n3) (استدلال) ما الحكمة من قوله ﷺ: «خلوا سبيلها فإنها مأمورة»؟\nالإجابة النموذجية: ألا تشعر قبيلة من الأنصار بتفضيل غيرها عليها فترضى النفوس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أين بركت الناقة؟\nالإجابة النموذجية: في أرض لبني النجار\n2) (تطبيق) عند من نزل النبي ﷺ ضيفًا أثناء البناء؟\nالإجابة النموذجية: أبي أيوب الأنصاري\n3) (استدلال) ماذا بنى النبي ﷺ في الأرض التي اشتراها؟\nالإجابة النموذجية: مسجده وحجرات نسائه"], ["الغلق (3 دقائق)", "خط زمني جماعي لأحداث الوصول"], ["الواجب المنزلي", "ابحث عن صورة حديثة للمسجد النبوي ومسجد قباء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=34"]]}, {"no": 57, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "بناء المسجد", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "128-133", "f": [["عنوان الدرس", "بناء المسجد"], ["نواتج التعلم", "1. يصف مشاركة المهاجرين والأنصار في بناء المسجد (15 دقيقة)\n2. يستنتج أدوار المسجد في المجتمع الإسلامي (15 دقيقة)\n3. يستخلص القيم من بناء المسجد النبوي (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالاستنتاج من الصور\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص130-133\nرسوم أدوار المسجد\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ماذا نفعل في مسجد حيّنا غير الصلاة؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. البناء والأدوار: مشاركة المهاجرين والأنصار بهمة عالية مرددين الأشعار التي تخفف المشقة؛ النبي ﷺ يعمل بنفسه معهم؛ أدوار المسجد: مكان للصلاة بحرية، جامعة للعلم، منتدى لتآلف النفوس، قاعدة لإدارة شؤون الدولة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. القيم: التعاون، والقدوة الحسنة، والمساواة، والعمل الجماعي، وحب المسجد؛ تأمل رسوم الكتاب واستنتاج أدوار المسجد قديمًا وحديثًا؛ أقيّم تعلمي (7 دقائق)\nالاستراتيجيات: الاستنتاج من الصور.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – مسجد حارتنا: تتأمل المجموعات وظائف أول مسجد في الإسلام، ثم ترسم مخططًا سريعًا لمسجد حارة عماني يجمع الصلاة وحلقات القرآن والتكافل بين الجيران (5 دقائق)\nالاستراتيجيات: الإنتاج السريع."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من شارك في بناء المسجد النبوي؟\nالإجابة النموذجية: المهاجرون والأنصار مع النبي ﷺ\n2) (تطبيق) اذكر دورين للمسجد في عهد النبي ﷺ.\nالإجابة النموذجية: مكان لأداء الصلاة، وجامعة يتلقى فيها المسلمون العلم (أو منتدى للتآلف، قاعدة لإدارة الشؤون)\n3) (استدلال) استخلص قيمة من مشاركة النبي ﷺ في البناء.\nالإجابة النموذجية: التواضع والقدوة الحسنة والعمل الجماعي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) لماذا كان بناء المسجد أول عمل في المدينة؟\nالإجابة النموذجية: لأنه مركز توحيد المسلمين وعبادتهم وتعليمهم وإدارة شؤونهم\n2) (تطبيق) كيف كان المسلمون يصلون قبل بناء المسجد؟\nالإجابة النموذجية: بعيدًا عن أعين الناس في الشعاب والأودية أو خفية في البيوت\n3) (استدلال) اذكر دورًا للمسجد في حيّك اليوم.\nالإجابة النموذجية: تحفيظ القرآن أو الدروس الدينية أو تجمع أهل الحي (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "كل مجموعة تكتب واجبًا نحو المسجد"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=34"]]}, {"no": 58, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "ألتزم الحق", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "134-139", "f": [["عنوان الدرس", "ألتزم الحق"], ["نواتج التعلم", "1. يعرّف الحق ويذكر معانيه في القرآن (العدل، الصدق، الحقيقة، الاستقامة) (20 دقيقة)\n2. يحدد مصادر الحق (5 دقائق)\n3. يبين أن المؤمن يقبل الحق من أي مصدر (15 دقيقة)"], ["الاستراتيجيات", "القصة\nحل المشكلات\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص134-137\nبطاقات مواقف\nجهاز عرض"], ["التهيئة (5 دقائق)", "موقف حسن وصديقه فارس المخطئ: هل يؤيد صديقه أم يصارحه بخطئه؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. المفهوم والمصادر: الحق من المبادئ العليا في الإسلام ونقيض الباطل، ومن معانيه: العدل والصدق والحقيقة والاستقامة؛ مصادره: القرآن الكريم، والأنبياء والرسل الذين لا ينطقون إلا بالحق عن طريق الوحي، والفطرة السليمة التي تقبل الحق وترفض الباطل (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. قبول الحق: الحق مرتبط بكل فضيلة وخير، والباطل بكل قبيح؛ المؤمن الصادق يقبل الحق لذاته لا لقائله؛ تحليل موقف حسن: التصرف الصحيح أن يصارح صديقه بخطئه بلطف ويقف مع الحق (10 دقائق)\nالاستراتيجيات: حل المشكلات."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الحق؟\nالإجابة النموذجية: ما وافق الصدق والعدل والحقيقة، وهو نقيض الباطل\n2) (تطبيق) اذكر مصدرين للحق.\nالإجابة النموذجية: القرآن الكريم، والفطرة السليمة (أو الأنبياء والرسل)\n3) (استدلال) ما التصرف الصحيح الذي ينبغي أن يقوم به حسن؟\nالإجابة النموذجية: أن يصارح صديقه بخطئه بلطف ولا يؤيده على الباطل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما سبب الحيرة التي وقع فيها حسن؟\nالإجابة النموذجية: تعارض صداقته لفارس مع معرفته أن فارسًا مخطئ\n2) (تطبيق) هل يقبل المؤمن الحق إذا جاء من شخص لا يحبه؟ ولماذا؟\nالإجابة النموذجية: نعم، لأن المقصود الحق لذاته لا لقائله\n3) (استدلال) صنّف: (الصدق، الظلم، العدل، الغش).\nالإجابة النموذجية: الحق: الصدق والعدل، الباطل: الظلم والغش"], ["الغلق (3 دقائق)", "عبارة الدرس: الحق أحق أن يُتبع"], ["الواجب المنزلي", "اكتب موقفًا التزمت فيه بالحق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=35"]]}, {"no": 59, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "ألتزم الحق", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "134-139", "f": [["عنوان الدرس", "ألتزم الحق"], ["نواتج التعلم", "1. يصنف السلوكيات إلى ما يقترن بالحق وما يقترن بالباطل (5 دقائق)\n2. يقترح طرقًا للالتزام بالحق في حياته اليومية (25 دقيقة)\n3. يقوّم تعلمه في درس ألتزم الحق (10 دقائق)"], ["الاستراتيجيات", "التصنيف\nلعب الأدوار\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص137-139 (أقيّم تعلمي)\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "لعبة: المعلم يقرأ سلوكًا والطلبة يرفعون بطاقة (حق) أو (باطل)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التصنيف: تصنيف الكلمات مع ما تقترن به في نشاط الكتاب؛ مناقشة آثار الالتزام بالحق على الفرد والمجتمع: الثقة، الأمن، الطمأنينة، رضا الله (8 دقائق)\nالاستراتيجيات: التصنيف.\n\n2. مواقف: الشهادة بالحق في خلاف بين زميلين، الاعتراف بالخطأ أمام المعلم، رد شيء وُجد في الساحة؛ أقيّم تعلمي: تصحيح العبارات (7 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – الحق في الملعب والسوق: تأخذ كل مجموعة موقفًا من الحياة في عمان، كمباراة في الدوري المدرسي أو بيع في السوق، وتحدد التصرف الذي يلتزم الحق والعدل والصدق (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) صنّف: (الاعتراف بالخطأ).\nالإجابة النموذجية: يقترن بالحق\n2) (تطبيق) اذكر أثرين للالتزام بالحق في المجتمع.\nالإجابة النموذجية: انتشار الثقة، وتحقيق العدل والأمن\n3) (استدلال) ماذا تفعل إذا رأيت زميلًا يُتهم ظلمًا وأنت تعرف الحقيقة؟\nالإجابة النموذجية: أشهد بالحق وأبيّن الحقيقة بأدب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صحح: الحق يُقبل حسب قائله.\nالإجابة النموذجية: الحق يُقبل لذاته أيًّا كان قائله\n2) (تطبيق) اقترح طريقتين للالتزام بالحق في المدرسة.\nالإجابة النموذجية: الصدق في القول، والعدل في الحكم بين الزملاء (أو الاعتراف بالخطأ)\n3) (استدلال) لماذا ترتبط الفطرة السليمة بالحق؟\nالإجابة النموذجية: لأن الله خلق الناس على فطرة تقبل الحق وتنقاد له وتكره الباطل"], ["الغلق (3 دقائق)", "كل طالب يكتب عهدًا قصيرًا بالالتزام بالحق"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=35"]]}, {"no": 60, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 5, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الجزء الأول من الآية (20) تلاوة صحيحة (15 دقيقة)\n2. يحفظ الجزء الأول من الآية (20) حفظًا متقنًا (5 دقائق)\n3. يوضح معاني: أدنى، يقدّر الليل، لن تحصوه، فتاب عليكم (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتقسيم المقطعي\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص16\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- تسميع الآيات (15-19)\n- تنبيه: الآية (20) أطول آيات السورة فنحفظها على جزأين"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للجزء الأول: ﴿إِنَّ رَبَّكَ يَعۡلَمُ أَنَّكَ تَقُومُ أَدۡنَىٰ مِن ثُلُثَيِ ٱلَّيۡلِ وَنِصۡفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٞ مِّنَ ٱلَّذِينَ مَعَكَۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيۡلَ وَٱلنَّهَارَۚ عَلِمَ أَن لَّن تُحۡصُوهُ فَتَابَ عَلَيۡكُمۡۖ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنَ ٱلۡقُرۡءَانِۚ …﴾؛ المحاكاة على مقاطع قصيرة؛ ملاحظة الإخفاء في (مِن ثُلُثَيِ)، والإدغام بغير غنة في (أَن لَّن) لأن بعد النون اللام (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والمعاني: حفظ المقاطع ثم ربطها؛ معاني: أدنى (أقل)، طائفة (جماعة)، يقدّر الليل والنهار (يحدد مواقيتهما)، لن تحصوه (لن تستطيعوا معرفة مقدار ما صليتم فيه من الليل)، فتاب عليكم (رجع بكم إلى التخفيف) (7 دقائق)\nالاستراتيجيات: التقسيم المقطعي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – حلقة البيت بعد المغرب: تتحاور المجموعات في معنى «فاقرءوا ما تيسر من القرآن»، وتقترح حلقة قرآنية أسرية قصيرة بعد صلاة المغرب كعادة كثير من البيوت العمانية (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿إِنَّ رَبَّكَ يَعۡلَمُ أَنَّكَ تَقُومُ أَدۡنَىٰ …﴾\nالإجابة النموذجية: ﴿إِنَّ رَبَّكَ يَعۡلَمُ أَنَّكَ تَقُومُ أَدۡنَىٰ مِن ثُلُثَيِ ٱلَّيۡلِ وَنِصۡفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٞ مِّنَ ٱلَّذِينَ مَعَكَۚ …﴾\n2) (تطبيق) ما معنى (لن تحصوه)؟\nالإجابة النموذجية: لن تستطيعوا معرفة مقدار ما صليتم فيه من الليل وما بقي منه\n3) (استدلال) ما معنى (فتاب عليكم)؟\nالإجابة النموذجية: رجع بكم إلى التخفيف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (يقدّر الليل والنهار)؟\nالإجابة النموذجية: يحدد مواقيتهما\n2) (تطبيق) ما حكم النون الساكنة في (أَن لَّن)؟\nالإجابة النموذجية: إدغام بغير غنة لأن بعدها اللام\n3) (استدلال) سمّع الجزء الأول من الآية (20).\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تسميع جماعي للجزء الأول"], ["الواجب المنزلي", "راجع حفظ السورة إلى ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنَ ٱلۡقُرۡءَانِۚ …﴾.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=36"]]}, {"no": 61, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الإدغام في النون الساكنة والتنوين", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "141-145", "f": [["عنوان الدرس", "الإدغام في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يعرّف الإدغام لغة واصطلاحًا (10 دقائق)\n2. يعدد حروف الإدغام الستة (يرملون) (15 دقيقة)\n3. يميز بين الإدغام بغنة والإدغام بغير غنة (15 دقيقة)"], ["الاستراتيجيات", "الاستماع والمحاكاة\nالاستقصاء الموجه\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص141-143\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "الاستماع إلى آيات فيها نون ساكنة وتنوين وكتابة الفرق في النطق"], ["إجراءات التنفيذ (20 دقيقة)", "1. المفهوم والحروف: الإدغام لغة: إدخال الشيء في الشيء؛ اصطلاحًا: إدخال النون الساكنة أو التنوين في الحرف الذي بعده فيصيران حرفًا واحدًا مشددًا؛ حروفه ستة مجموعة في كلمة (يرملون) (10 دقائق)\nالاستراتيجيات: الاستماع والمحاكاة.\n\n2. نوعاه: الإدغام بغنة: حروفه أربعة (ينمو): الياء والنون والميم والواو؛ الإدغام بغير غنة: حرفان: اللام والراء؛ الغنة: صوت له رنين يخرج من الخيشوم مقداره حركتان؛ أمثلة: (مَن يَقُولُ)، (وَطۡـٔٗا وَأَقۡوَمُ)، (لَوَّاحَةٞ لِّلۡبَشَرِ)، (مِّن رَّبِّهِمۡ) (10 دقائق)\nالاستراتيجيات: الاستقصاء الموجه."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف الإدغام اصطلاحًا.\nالإجابة النموذجية: إدخال النون الساكنة أو التنوين في الحرف الذي بعده فيصيران حرفًا مشددًا\n2) (تطبيق) عدّد حروف الإدغام بغنة.\nالإجابة النموذجية: الياء والنون والميم والواو (ينمو)\n3) (استدلال) ما حرفا الإدغام بغير غنة؟\nالإجابة النموذجية: اللام والراء"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الغنة؟ وما مقدارها؟\nالإجابة النموذجية: صوت له رنين يخرج من الخيشوم، مقداره حركتان\n2) (تطبيق) حدد نوع الإدغام في (لَوَّاحَةٞ لِّلۡبَشَرِ).\nالإجابة النموذجية: إدغام بغير غنة لأن بعد التنوين اللام\n3) (استدلال) حدد نوع الإدغام في (حُمُرٞ مُّسۡتَنفِرَةٞ).\nالإجابة النموذجية: إدغام بغنة لأن بعد التنوين الميم"], ["الغلق (3 دقائق)", "ترديد: يرملون، ينمو، لر"], ["الواجب المنزلي", "احفظ حروف الإدغام بنوعيه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=37"]]}, {"no": 62, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الإدغام في النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "141-145", "f": [["عنوان الدرس", "الإدغام في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يبين شرط الإدغام (أن يكون في كلمتين) والإظهار المطلق في كلمة واحدة (15 دقيقة)\n2. يستخرج أمثلة للإدغام من سورتي المدثر والمزمل (5 دقائق)\n3. يقارن بين الإدغام في الميم الساكنة والإدغام في النون الساكنة والتنوين (20 دقيقة)"], ["الاستراتيجيات", "التلاوة والمحاكاة\nالجدول المقارن\nالمسابقة"], ["مصادر التعلم", "كتاب الطالب ص143-145\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- كلمات: (الدنيا، بنيان، صنوان، قنوان)\n- سؤال: النون الساكنة قبل الياء والواو فلماذا لا ندغم؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الشرط: لا يأتي الإدغام في النون الساكنة والتنوين إلا في كلمتين؛ إذا اجتمعت النون الساكنة مع الياء أو الواو في كلمة واحدة وجب الإظهار (الإظهار المطلق) كما في: الدنيا، بنيان، صنوان، قنوان؛ الميم المشددة والنون المشددة حرفا غنة (8 دقائق)\nالاستراتيجيات: التلاوة والمحاكاة.\n\n2. الاستخراج والمقارنة: استخراج أمثلة: (يَوۡمَئِذٖ يَوۡمٌ)، (مَالٗا مَّمۡدُودٗا)، (أَن يُؤۡتَىٰ)، (وَطۡـٔٗا وَأَقۡوَمُ)، (لَوَّاحَةٞ لِّلۡبَشَرِ)؛ جدول: الإدغام الشفوي (ميم ساكنة بعدها ميم) / الإدغام في النون (حروف يرملون في كلمتين) (7 دقائق)\nالاستراتيجيات: الجدول المقارن.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – من مسقط إلى لوى: تكوّن المجموعات عبارات بأسماء أماكن عمانية فيها إدغام، مثل «من مسقط، من نزوى، من ينقل، من لوى، من رأس الحد»، وتميز الإدغام بغنة من الإدغام بغير غنة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما شرط الإدغام في النون الساكنة والتنوين؟\nالإجابة النموذجية: أن يكون في كلمتين\n2) (تطبيق) لماذا لا تُدغم النون في (الدنيا)؟\nالإجابة النموذجية: لأن النون والياء في كلمة واحدة فيجب الإظهار\n3) (استدلال) استخرج إدغامًا من ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾.\nالإجابة النموذجية: (يَوۡمَئِذٖ يَوۡمٌ): إدغام بغنة لأن بعد التنوين الياء"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حدد الحكم في (أَن يُؤۡتَىٰ).\nالإجابة النموذجية: إدغام بغنة لأن بعد النون الساكنة الياء في كلمة أخرى\n2) (تطبيق) قارن: (أَطۡعَمَهُم مِّن) و(مَالٗا مَّمۡدُودٗا).\nالإجابة النموذجية: الأولى إدغام شفوي (ميم ساكنة بعدها ميم)، والثانية إدغام بغنة في التنوين\n3) (استدلال) اتلُ ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾ مطبقًا الإدغام.\nالإجابة النموذجية: تلاوة تدغم التنوين في الميم مع الغنة"], ["الغلق (3 دقائق)", "مسابقة استخراج أمثلة الإدغام من سورة المزمل"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=37"]]}, {"no": 63, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "سورة المزمل الآية (20) (تلاوة وفهم)", "k": 1, "n": 3, "wi": 4, "wn": 5, "pages": "146-153", "f": [["عنوان الدرس", "سورة المزمل الآية (20) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآية (20) من سورة المزمل تلاوة صحيحة (10 دقائق)\n2. يوضح معاني المفردات: يضربون في الأرض، أقرضوا الله قرضًا حسنًا (15 دقيقة)\n3. يبين مظاهر التخفيف والتيسير في الآية (15 دقيقة)"], ["الاستراتيجيات", "القصة\nالتلاوة النموذجية والمحاكاة\nالحوار والمناقشة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص146-149\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- قصة خالد الذي استيقظ ليلًا فرأى أباه يصلي\n- سؤال: لماذا يصلي الأب في هذا الوقت؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة والمعاني: تلاوة الآية كاملة ومحاكاتها؛ معاني: يضربون في الأرض (يسعون في البلاد للتجارة والاسترزاق)، أقرضوا الله (تصدقوا في وجوه الخير) (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. التخفيف: السورة بدأت بأمر النبي ﷺ بقيام الليل وختمت بلمسة الرفق والتيسير بجعل قيام الليل تطوعًا؛ الأعذار: المرض، والسفر للتجارة، والجهاد في سبيل الله؛ ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾ (10 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى (يضربون في الأرض)؟\nالإجابة النموذجية: يسعون في البلاد للتجارة وطلب الرزق\n2) (تطبيق) اذكر الأعذار التي ذكرتها الآية.\nالإجابة النموذجية: المرض، والسفر للتجارة، والقتال في سبيل الله\n3) (استدلال) ما مظهر التخفيف في الآية؟\nالإجابة النموذجية: جعل قيام الليل تطوعًا لا فريضة وقراءة ما تيسر من القرآن"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (وأقرضوا الله قرضًا حسنًا)؟\nالإجابة النموذجية: تصدقوا في وجوه الخير طيبة بها نفوسكم\n2) (تطبيق) استخرج من الآية ما يدل على يسر الإسلام.\nالإجابة النموذجية: ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾\n3) (استدلال) لماذا كان خير أوقات العبادة جوف الليل؟\nالإجابة النموذجية: لفراغ القلب من مشاغل الدنيا"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (20)"], ["الواجب المنزلي", "تدرّب على تلاوة الآية (20).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=38"]]}, {"no": 64, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "سورة المزمل الآية (20) (تلاوة وفهم)", "k": 2, "n": 3, "wi": 5, "wn": 5, "pages": "146-153", "f": [["عنوان الدرس", "سورة المزمل الآية (20) (تلاوة وفهم)"], ["نواتج التعلم", "1. يستخرج من الآية الأوامر التي وجهت إليها (الصلاة، الزكاة، القرض الحسن، الاستغفار) (15 دقيقة)\n2. يبين أن الله يجازي على العمل الصالح بالأجر المضاعف (15 دقيقة)\n3. يربط الآية بمعاني سورة المزمل كاملة (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالتدبر\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص149-152\nالمصحف الشريف\nبطاقات المعاني"], ["التهيئة (5 دقائق)", "سؤال: ما الفريضتان اللتان تقترن إحداهما بالأخرى في القرآن غالبًا؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الأوامر: ﴿… وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَ وَأَقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗاۚ …﴾؛ الفريضتان: الصلاة والزكاة؛ ﴿… وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيۡرٗا وَأَعۡظَمَ أَجۡرٗاۚ …﴾؛ ختام الآية بالأمر بالاستغفار (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الربط بالسورة: استخراج الآيات التي تشير إلى معاني الكتاب: عظمة القرآن (القول الثقيل)، فضل قيام الليل، انصراف الإنسان في النهار لكسب رزقه (سبحًا طويلًا)، يسر الإسلام، مضاعفة الأجر (7 دقائق)\nالاستراتيجيات: التدبر.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – رواد أعمال عمانيون: تتحاور المجموعات في معنى «يضربون في الأرض يبتغون من فضل الله»، وتقترح مشروعًا صغيرًا لشاب عماني يجمع بين العمل والعبادة، دعمًا لريادة الأعمال في رؤية 2040 (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر الفريضتين اللتين أمرت بهما الآية.\nالإجابة النموذجية: الصلاة والزكاة\n2) (تطبيق) بمَ ختمت الآية؟\nالإجابة النموذجية: بالأمر بالاستغفار وبيان أن الله غفور رحيم\n3) (استدلال) ما جزاء من يقدم الخير كما في الآية؟\nالإجابة النموذجية: يجده عند الله خيرًا وأعظم أجرًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من السورة آية تدل على أن الإنسان ينصرف في النهار لكسب رزقه.\nالإجابة النموذجية: ﴿إِنَّ لَكَ فِي ٱلنَّهَارِ سَبۡحٗا طَوِيلٗا﴾\n2) (تطبيق) لماذا لم يحدد الله نوع الخير في قوله: ﴿… وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ …﴾؟\nالإجابة النموذجية: لأن للخير وجوهًا كثيرة معنوية ومادية\n3) (استدلال) اذكر وجهين من وجوه الخير يمكنك القيام بهما.\nالإجابة النموذجية: مثل: الصدقة، ومساعدة المحتاج، وتلاوة القرآن"], ["الغلق (3 دقائق)", "كل طالب يحدد وجه خير سيقدمه هذا الأسبوع"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=38"]]}, {"no": 65, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 6, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الجزء الثاني من الآية (20) تلاوة صحيحة (15 دقيقة)\n2. يحفظ الجزء الثاني من الآية (20) ويتم حفظ السورة (5 دقائق)\n3. يطبق أحكام النون الساكنة والتنوين في تلاوته (20 دقيقة)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتقسيم المقطعي\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص16\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الجزء الأول من الآية (20)"], ["إجراءات التنفيذ (20 دقيقة)", "1. التلاوة: تلاوة نموذجية للجزء الثاني من الآية (20) بدءًا من ﴿… عَلِمَ أَن سَيَكُونُ …﴾ إلى آخرها؛ ملاحظة الإخفاء في (مِنكُم)، والإظهار الحلقي في (مِّنۡ خَيۡرٖ) لأن بعد النون الخاء (8 دقائق)\nالاستراتيجيات: التلاوة النموذجية والمحاكاة.\n\n2. الحفظ والتطبيق: حفظ المقاطع وربطها بالجزء الأول؛ تحديد أحكام النون الساكنة والتنوين في الجزء الثاني: (مِنكُم) إخفاء، (مِّنۡ خَيۡرٖ) إظهار حلقي، (قَرۡضًا حَسَنٗا) إظهار حلقي، (غَفُورٞ رَّحِيمُۢ) إدغام بغير غنة (7 دقائق)\nالاستراتيجيات: التقسيم المقطعي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – صندوق خير الفصل: تتحاور المجموعات في معنى «وأقرضوا الله قرضًا حسنًا»، ثم تقترح فكرة صندوق خير للفصل يساعد زميلًا محتاجًا، تعبيرًا عن قيمة التكافل العمانية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿… وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَ …﴾\nالإجابة النموذجية: ﴿… وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَ وَأَقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗاۚ …﴾\n2) (تطبيق) ما حكم النون الساكنة في (مِّنۡ خَيۡرٖ)؟\nالإجابة النموذجية: إظهار حلقي لأن بعدها الخاء\n3) (استدلال) ما حكم التنوين في (غَفُورٞ رَّحِيمُۢ)؟\nالإجابة النموذجية: إدغام بغير غنة لأن بعده الراء"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم التنوين في (قَرۡضًا حَسَنٗا)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده الحاء\n2) (تطبيق) سمّع الآية (20) كاملة.\nالإجابة النموذجية: تسميع صحيح متقن\n3) (استدلال) اتلُ خاتمة الآية.\nالإجابة النموذجية: ﴿… وَٱسۡتَغۡفِرُواْ ٱللَّهَۖ إِنَّ ٱللَّهَ غَفُورٞ رَّحِيمُۢ﴾"], ["الغلق (3 دقائق)", "تسميع جماعي لسورة المزمل"], ["الواجب المنزلي", "راجع حفظ سورة المزمل كاملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=39"]]}, {"no": 66, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "سورة المزمل الآية (20) (تلاوة وفهم)", "k": 3, "n": 3, "wi": 2, "wn": 5, "pages": "146-153", "f": [["عنوان الدرس", "سورة المزمل الآية (20) (تلاوة وفهم)"], ["نواتج التعلم", "1. يستخلص القيم والتوجيهات المستفادة من الآية (20) (5 دقائق)\n2. يقدّر عناية الإسلام بالتوازن بين العبادة والعمل (25 دقيقة)\n3. يقوّم تعلمه في درس الآية (20) (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم الذاتي\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص152-153 (أقيّم تعلمي)\nالمصحف الشريف\nقول الشيخ أحمد بن حمد الخليلي في الكتاب"], ["التهيئة (5 دقائق)", "قراءة قول سماحة الشيخ أحمد بن حمد الخليلي الوارد في الكتاب ومناقشته"], ["إجراءات التنفيذ (20 دقيقة)", "1. القيم: التوازن بين العبادة وكسب الرزق، اليسر ورفع الحرج، المحافظة على الفرائض، الإنفاق في سبيل الله، الاستغفار الدائم، المداومة على تلاوة القرآن ولو قليلًا (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أقيّم تعلمي: إكمال العبارات؛ تصحيح الخطأ؛ التقصير في أداء الواجبات كترك صلاة الفجر بحجة السهر في العبادة: مناقشة التوازن (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – جدول الطالب المتوازن: تصمم كل مجموعة جدولًا ليوم طالب عماني يوازن بين الدراسة والصلاة والأسرة والرياضة، مستفيدة من عناية الآية (20) من سورة المزمل بالتوازن والتيسير (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخلص قيمتين من الآية (20).\nالإجابة النموذجية: التوازن بين العبادة والعمل، واليسر ورفع الحرج\n2) (تطبيق) هل يجوز أن يسهر المسلم في العبادة ثم يترك صلاة الفجر؟ ولماذا؟\nالإجابة النموذجية: لا، لأن الفرائض مقدمة والإسلام دين توازن لا يكلف فوق الطاقة\n3) (استدلال) ما المقصود بقوله: ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾؟\nالإجابة النموذجية: اقرؤوا من القرآن ما يسهل عليكم دون مشقة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: قليل دائم خير من ......\nالإجابة النموذجية: كثير منقطع\n2) (تطبيق) كيف تنظم وقتك بين الدراسة وتلاوة القرآن؟\nالإجابة النموذجية: بتخصيص ورد يومي ثابت ولو قليلًا مع أداء الواجبات الدراسية\n3) (استدلال) لماذا أمرت الآية بالاستغفار بعد الطاعات؟\nالإجابة النموذجية: لجبر التقصير فيها وطلب المغفرة من الله"], ["الغلق (3 دقائق)", "كل طالب يحدد وردًا يوميًا من القرآن يلتزم به"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=40"]]}, {"no": 67, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "هجر المسلم حرام (حديث شريف)", "k": 1, "n": 2, "wi": 3, "wn": 5, "pages": "154-160", "f": [["عنوان الدرس", "هجر المسلم حرام (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه (5 دقائق)\n2. يعرّف براوي الحديث أبي أيوب الأنصاري رضي الله عنه (5 دقائق)\n3. يوضح حكم هجر المسلم أخاه فوق ثلاث ليال (30 دقيقة)"], ["الاستراتيجيات", "القصة\nالتكرار الموجّه\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص154-157\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "تذكر الحديثين: «المؤمن للمؤمن كالبنيان يشد بعضه بعضًا» و«مثل المؤمنين في توادهم وتراحمهم...» وإكمال التشبيه"], ["إجراءات التنفيذ (20 دقيقة)", "1. الحديث والراوي: نص الحديث: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيعرض هذا ويعرض هذا، وخيرهما الذي يبدأ بالسلام»؛ الراوي: أبو أيوب الأنصاري خالد بن زيد، شهد العقبة الثانية وبدرًا وأحدًا والخندق، ونزل النبي ﷺ في بيته، وشارك في فتح القسطنطينية رغم كبر سنه وتوفي فيها (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. الحفظ والمعنى: حفظ الحديث؛ الهجر: ترك الكلام والإعراض عند اللقاء؛ يحرم الهجر فوق ثلاث ليال، والثلاث رخصة لتهدأ النفوس؛ أفضل المتخاصمين من يبدأ بالسلام (10 دقائق)\nالاستراتيجيات: التكرار الموجّه."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: «لا يحل لمسلم أن يهجر أخاه ...».\nالإجابة النموذجية: فوق ثلاث ليال\n2) (تطبيق) من راوي الحديث؟\nالإجابة النموذجية: أبو أيوب الأنصاري رضي الله عنه\n3) (استدلال) من خير المتخاصمين؟\nالإجابة النموذجية: الذي يبدأ بالسلام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما حكم هجر المسلم أخاه فوق ثلاث ليال؟\nالإجابة النموذجية: حرام\n2) (تطبيق) ما المقصود بالهجر؟\nالإجابة النموذجية: ترك الكلام مع الأخ والإعراض عنه عند اللقاء\n3) (استدلال) اذكر موقفًا من سيرة أبي أيوب.\nالإجابة النموذجية: نزل النبي ﷺ في بيته عند وصوله المدينة (أو مشاركته في فتح القسطنطينية)"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=41"]]}, {"no": 68, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "هجر المسلم حرام (حديث شريف)", "k": 2, "n": 2, "wi": 4, "wn": 5, "pages": "154-160", "f": [["عنوان الدرس", "هجر المسلم حرام (حديث شريف)"], ["نواتج التعلم", "1. يبين أثر الهجر في العلاقات بين الناس (15 دقيقة)\n2. يحدد من يبقى عليه إثم الهجر إذا بادر أحدهما بالسلام (15 دقيقة)\n3. يقترح حلولًا لتجنب الهجر (10 دقائق)"], ["الاستراتيجيات", "القصة\nلعب الأدوار\nحل المشكلات"], ["مصادر التعلم", "كتاب الطالب ص157-160\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "حوار زهرة وأمها حول مقاطعة عبير منذ ثلاثة أسابيع"], ["إجراءات التنفيذ (20 دقيقة)", "1. الأثر: الهجر يحول الاتحاد إلى فرقة، والمحبة إلى بغضاء، ويقطع الرحم؛ حرص الشريعة على ما يمنع الهجر؛ قرار زهرة بالمبادرة بالسلام لتكون خيرًا من صاحبتها (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. المواقف والحلول: موقف طارق وحمد: بادر حمد بالسلام فأعرض طارق: على من يبقى الإثم؟؛ حلول: المبادرة بالسلام، الاعتذار، الهدية، التسامح، إصلاح الأصدقاء (7 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – قهوة الصلح: يمثّل الطلبة صديقين متخاصمين يتصالحان في زيارة العيد على فنجان القهوة العمانية قبل مضي ثلاثة أيام، تطبيقًا لحديث تحريم الهجر (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر أثرًا سلبيًا للهجر.\nالإجابة النموذجية: يفرق بين الناس ويزرع البغضاء ويقطع الرحم\n2) (تطبيق) على من يبقى إثم الهجر إذا بادر أحدهما بالسلام فأعرض الآخر؟\nالإجابة النموذجية: على المعرض الذي لم يرد السلام\n3) (استدلال) ماذا قررت زهرة في نهاية الحوار؟\nالإجابة النموذجية: أن تجيب دعوة خالتها وتبادر بالسلام على عبير وتصالحها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اقترح حلين لتجنب الهجر.\nالإجابة النموذجية: المبادرة بالسلام، والتسامح والاعتذار\n2) (تطبيق) ماذا ينبغي لحمد أن يفعل بعد إعراض طارق؟\nالإجابة النموذجية: يستمر في الإحسان والسلام ويطلب من صديق مشترك الإصلاح\n3) (استدلال) ما الحكمة من إباحة الهجر ثلاثة أيام فقط؟\nالإجابة النموذجية: لتهدأ النفوس ثم يعود الصفاء دون قطيعة دائمة"], ["الغلق (3 دقائق)", "كل طالب يفكر في شخص يحتاج أن يبادره بالسلام"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=41"]]}, {"no": 69, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "القرآن الكريم معجزة خالدة", "k": 1, "n": 1, "wi": 5, "wn": 5, "pages": "161-166", "f": [["عنوان الدرس", "القرآن الكريم معجزة خالدة"], ["نواتج التعلم", "1. يبين أن القرآن الكريم معجزة النبي ﷺ الخالدة وكيف تحدى الله به العرب (5 دقائق)\n2. يعدد وجوه إعجاز القرآن (البياني، العلمي، الغيبي، التشريعي) (25 دقيقة)\n3. يقارن بين معجزات الرسل السابقين ومعجزة القرآن (10 دقائق)"], ["الاستراتيجيات", "التدبر\nالتعلم التعاوني\nالجدول المقارن"], ["مصادر التعلم", "كتاب الطالب ص161-166\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "- تدبر قوله تعالى: ﴿إِنَّا نَحۡنُ نَزَّلۡنَا ٱلذِّكۡرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ﴾\n- سؤال: ما الذي يميز معجزة القرآن عن معجزات الرسل السابقين؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الإعجاز والتحدي: نزل القرآن عربيًا فصيحًا على قوم هم أرباب الفصاحة فعجزوا عن معارضته؛ التحدي: ﴿قُل لَّئِنِ ٱجۡتَمَعَتِ ٱلۡإِنسُ وَٱلۡجِنُّ عَلَىٰٓ أَن يَأۡتُواْ بِمِثۡلِ هَٰذَا ٱلۡقُرۡءَانِ لَا يَأۡتُونَ بِمِثۡلِهِۦ …﴾ ثم بعشر سور ثم بسورة؛ وجوه الإعجاز: البياني (فصاحة الألفاظ وبلاغة المعاني)، العلمي (حقائق الكون والخلق)، الغيبي (الإخبار عن الماضي والمستقبل)، التشريعي (أحكام تنظم حياة الفرد والمجتمع) (8 دقائق)\nالاستراتيجيات: التدبر.\n\n2. المقارنة والقصة: معجزات الرسل حسية مؤقتة انتهت بزمانها، والقرآن معجزة عقلية خالدة باقية إلى يوم القيامة؛ قصة أبي سفيان وأبي جهل والأخنس بن شريق يستمعون للقرآن خفية ثلاث ليال (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – عمان تخدم القرآن: تعدد المجموعات وجوهًا من إعجاز القرآن الكريم، ثم تذكر صورًا من عناية عمان بالقرآن كمدارس القرآن ومسابقات التلاوة والحفظ (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا يعد القرآن معجزة خالدة؟\nالإجابة النموذجية: لأنه باقٍ محفوظ إلى يوم القيامة ويتجدد إعجازه، بخلاف معجزات الرسل التي انتهت بزمانها\n2) (تطبيق) عدّد وجوه إعجاز القرآن.\nالإجابة النموذجية: البياني، والعلمي، والغيبي، والتشريعي\n3) (استدلال) ما وجه الإعجاز الذي لا تخلو منه سورة ولا آية؟\nالإجابة النموذجية: الإعجاز البياني"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) إخبار القرآن عن الأنبياء والأمم السابقة من الإعجاز ......\nالإجابة النموذجية: الغيبي\n2) (تطبيق) ما الذي تدل عليه قصة الزعماء الثلاثة الذين استمعوا للقرآن خفية؟\nالإجابة النموذجية: تأثير القرآن في القلوب حتى في قلوب أعدائه\n3) (استدلال) قارن بين معجزة موسى ومعجزة القرآن من حيث مدة البقاء.\nالإجابة النموذجية: معجزة موسى انتهت بزمانها، والقرآن باقٍ إلى يوم القيامة"], ["الغلق (3 دقائق)", "كل طالب يذكر وجهًا من الإعجاز أثار إعجابه"], ["الواجب المنزلي", "ابحث عن تفسير قوله تعالى: ﴿أَفَلَا يَتَدَبَّرُونَ ٱلۡقُرۡءَانَۚ وَلَوۡ كَانَ مِنۡ عِندِ غَيۡرِ ٱللَّهِ لَوَجَدُواْ فِيهِ ٱخۡتِلَٰفٗا كَثِيرٗا﴾ واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=42"]]}, {"no": 70, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 7, "n": 7, "wi": 1, "wn": 5, "pages": "12-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو سورتي المدثر والمزمل تلاوة مجودة (15 دقيقة)\n2. يسمّع السورتين غيبًا تسميعًا متقنًا (15 دقيقة)\n3. يطبق أحكام التجويد التي تعلمها (المخارج، النون الساكنة والتنوين: الإظهار والإدغام) (10 دقائق)"], ["الاستراتيجيات", "المسابقة\nالتسميع الثنائي\nالتقويم الذاتي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص12-16\nبطاقة تقويم التلاوة"], ["التهيئة (5 دقائق)", "تقسيم الطلبة أزواجًا للتسميع المتبادل وبطاقة تقويم: الحفظ، المخارج، الأحكام"], ["إجراءات التنفيذ (20 دقيقة)", "1. تسميع المدثر: تسميع ثنائي لسورة المدثر مع تسجيل الملاحظات؛ تصويب الأخطاء الشائعة (8 دقائق)\nالاستراتيجيات: المسابقة.\n\n2. استخراج مثال لكل حكم درسه الطالب من السورتين (7 دقائق)\nالاستراتيجيات: التسميع الثنائي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – لجنة تحكيم صغيرة: تتحول كل مجموعة إلى لجنة تحكيم كما في مسابقات القرآن الكريم في عمان، فتستمع لتسميع سورتي المدثر والمزمل من مجموعة أخرى وتقيّم أحكام التجويد (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱلرُّجۡزَ فَٱهۡجُرۡ﴾.\nالإجابة النموذجية: ﴿وَلَا تَمۡنُن تَسۡتَكۡثِرُ﴾\n2) (تطبيق) اتلُ الآية التي تلي ﴿إِنَّ لَكَ فِي ٱلنَّهَارِ سَبۡحٗا طَوِيلٗا﴾.\nالإجابة النموذجية: ﴿وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا﴾\n3) (استدلال) استخرج إدغامًا بغير غنة من سورة المدثر.\nالإجابة النموذجية: (لَوَّاحَةٞ لِّلۡبَشَرِ) أو (نَذِيرٗا لِّلۡبَشَرِ)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: ﴿وَمَا يَذۡكُرُونَ إِلَّآ أَن يَشَآءَ …﴾\nالإجابة النموذجية: ﴿وَمَا يَذۡكُرُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ هُوَ أَهۡلُ ٱلتَّقۡوَىٰ وَأَهۡلُ ٱلۡمَغۡفِرَةِ﴾\n2) (تطبيق) استخرج إظهارًا حلقيًا من سورة المزمل.\nالإجابة النموذجية: (مِنۡهُ) أو (عَذَابًا أَلِيمٗا)\n3) (استدلال) سمّع سورة المزمل كاملة.\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تكريم المتقنين وتحديد مقاطع للمراجعة"], ["الواجب المنزلي", "راجع حفظ سورتي المدثر والمزمل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=43"]]}, {"no": 71, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 1, "n": 3, "wi": 2, "wn": 5, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يعرّف الاستدراك في الصلاة (20 دقيقة)\n2. يستدل على مشروعية الاستدراك من الحديث النبوي (15 دقيقة)\n3. يتعرف خطوات الاستدراك في الصلاة (5 دقائق)"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nالعرض العملي"], ["مصادر التعلم", "كتاب الطالب ص167-169\nجهاز عرض\nمصلى المدرسة"], ["التهيئة (5 دقائق)", "- قصة عمر وعبدالله: دخلا صلاة المغرب والإمام في سجود الركعة الأولى، فسلّم عمر مع الإمام، واستمر عبدالله\n- سؤال: أيهما أصاب؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. المفهوم والدليل: الاستدراك: أن يلحق المصلي بالجماعة وقد بدأت الصلاة فيدرك ما بقي مع الإمام ويقضي ما فاته بعد تسليمه؛ الدليل: «... ما أدركتم فصلوا وما فاتكم فاقضوا» (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. الخطوات: يأتي المعلم بالتوجيه وتكبيرة الإحرام؛ يدخل مع الإمام على الحال التي هو عليها ويتابعه؛ لا يسلّم مع الإمام؛ يقوم بتكبير ليقضي ما فاته من ركعات؛ يسلّم بعد إتمام صلاته؛ عرض عملي في مصلى المدرسة (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الاستدراك في الصلاة؟\nالإجابة النموذجية: أن يلحق المصلي بالجماعة بعد بدئها فيصلي معهم ما أدرك ويقضي ما فاته بعد تسليم الإمام\n2) (تطبيق) أكمل الحديث: «ما أدركتم فصلوا ...».\nالإجابة النموذجية: وما فاتكم فاقضوا\n3) (استدلال) أيهما أصاب في القصة: عمر أم عبدالله؟ ولماذا؟\nالإجابة النموذجية: عبدالله، لأنه فاتته ركعة فيجب أن يقضيها بعد تسليم الإمام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) بماذا يبدأ المستدرك عند دخوله الصلاة؟\nالإجابة النموذجية: بالتوجيه وتكبيرة الإحرام\n2) (تطبيق) متى يقضي المستدرك ما فاته؟\nالإجابة النموذجية: بعد تسليم الإمام\n3) (استدلال) هل يسلّم المستدرك مع الإمام؟\nالإجابة النموذجية: لا، بل يقوم بتكبير ليقضي ما فاته"], ["الغلق (3 دقائق)", "ترديد خطوات الاستدراك بالترتيب"], ["الواجب المنزلي", "اكتب خطوات الاستدراك في الصلاة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 72, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 2, "n": 3, "wi": 3, "wn": 5, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يحسب عدد الركعات التي يقضيها المستدرك في حالات مختلفة (20 دقيقة)\n2. يصحح الأخطاء في مواقف الاستدراك (15 دقيقة)\n3. يطبق الاستدراك تطبيقًا عمليًا (5 دقائق)"], ["الاستراتيجيات", "حل المشكلات\nالتعلم التعاوني\nالعرض العملي"], ["مصادر التعلم", "كتاب الطالب ص169-170\nأشكال أعمال الصلاة وعدد الركعات\nمصلى المدرسة"], ["التهيئة (5 دقائق)", "سؤال: إذا دخلت صلاة الظهر والإمام في التشهد الأخير، فكم ركعة تقضي؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الحساب: حالات: أدرك العشاء في ركوع الركعة الأولى؛ أدرك الإمام في سجود الركعة الثانية من العشاء: يقضي ركعتين؛ أدرك المغرب في الركعة الثالثة: يقضي ركعتين؛ التوجيه وتكبيرة الإحرام أولًا في كل الحالات (10 دقائق)\nالاستراتيجيات: حل المشكلات.\n\n2. تصحيح المواقف: موقف: دخل متأخرًا فتابع الإمام بدون التوجيه وتكبيرة الإحرام (خطأ)؛ موقف: لم يسلّم مع الإمام وقام بتكبيرة ليقضي ما فاته (صواب)؛ تطبيق عملي في مجموعات (10 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أدرك مصلٍّ الإمام في سجود الركعة الثانية من صلاة العشاء، فكم ركعة يقضي؟\nالإجابة النموذجية: ركعتين\n2) (تطبيق) صحح: دخل متأخرًا فتابع الإمام مباشرة دون التوجيه وتكبيرة الإحرام.\nالإجابة النموذجية: عليه أن يأتي بالتوجيه وتكبيرة الإحرام أولًا ثم يتابع الإمام\n3) (استدلال) أدرك مصلٍّ الركعة الثالثة من صلاة المغرب، فكم ركعة يقضي؟\nالإجابة النموذجية: ركعتين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أدرك مصلٍّ الإمام في التشهد الأخير من صلاة الظهر، فكم ركعة يقضي؟\nالإجابة النموذجية: أربع ركعات\n2) (تطبيق) ماذا يفعل المستدرك عند تسليم الإمام؟\nالإجابة النموذجية: لا يسلّم، بل يقوم بتكبير ويقضي ما فاته\n3) (استدلال) صحح: (يسلم المستدرك مع الإمام ثم يقضي ما فاته).\nالإجابة النموذجية: لا يسلم مع الإمام، بل يقضي ما فاته ثم يسلم"], ["الغلق (3 دقائق)", "عرض عملي لمجموعة تطبق الاستدراك"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 73, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الاستدراك في الصلاة", "k": 3, "n": 3, "wi": 4, "wn": 5, "pages": "167-171", "f": [["عنوان الدرس", "الاستدراك في الصلاة"], ["نواتج التعلم", "1. يوضح المعنى العام لحديث «من أدرك ركعة من الصلاة فقد أدرك الصلاة» (15 دقيقة)\n2. يقيّم مواقف تتعلق بالمسارعة إلى صلاة الجماعة (15 دقيقة)\n3. يقوّم تعلمه في درس الاستدراك (10 دقائق)"], ["الاستراتيجيات", "الحوار والمناقشة\nالتقويم الذاتي\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص170-171 (أقيّم تعلمي)\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ما الشعور الذي ينتابك عندما تفوتك ركعات من صلاة الجماعة دون عذر؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. الحديث والمواقف: «من أدرك ركعة من الصلاة فقد أدرك الصلاة»: الحث على إدراك الجماعة وأن فضلها يُنال بإدراك ركعة؛ تقييم الموقفين: من انشغل بالتلفاز وقت الصلاة متعللًا بأنه سيستدرك (خطأ)، ومن تأخر فذهب راكضًا خوفًا من فوات الجماعة (خطأ، والصواب المشي بسكينة ووقار) (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. أقيّم تعلمي: وضع علامة الصواب والخطأ وتصويب ما تحته خط؛ إجابات شفهية؛ تلخيص الدرس (7 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – حملة الوقت الثمين: تراجع المجموعات خطوات الاستدراك في الصلاة، ثم تقترح شعارًا لحملة صفية عن الحضور المبكر للصلاة والمدرسة، اعتزازًا بقيمة احترام الوقت (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما المعنى العام لحديث «من أدرك ركعة من الصلاة فقد أدرك الصلاة»؟\nالإجابة النموذجية: من أدرك ركعة مع الإمام نال فضل صلاة الجماعة\n2) (تطبيق) احكم على من يتأخر عن الصلاة متعللًا بأنه سيستدرك.\nالإجابة النموذجية: تصرف خاطئ، والواجب المبادرة إلى الصلاة في أول وقتها\n3) (استدلال) كيف يمشي المسلم إلى الصلاة إذا تأخر؟\nالإجابة النموذجية: بسكينة ووقار لا راكضًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صحح: (يصلي المستدرك ما فاته قبل تسليم الإمام).\nالإجابة النموذجية: يصلي ما فاته بعد تسليم الإمام\n2) (تطبيق) ما فائدة الاستدراك؟\nالإجابة النموذجية: يحفظ على المسلم فضل الجماعة ويعلمه النظام والمتابعة\n3) (استدلال) صف شعورك عندما تدرك صلاة الجماعة من أولها.\nالإجابة النموذجية: الطمأنينة والفرح بالأجر الكامل (تقبل الإجابات المعبرة)"], ["الغلق (3 دقائق)", "عهد: أبادر إلى الصلاة قبل الإقامة"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=44"]]}, {"no": 74, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الصحابي عبدالله بن عمر رضي الله عنهما", "k": 1, "n": 1, "wi": 5, "wn": 5, "pages": "172-176", "f": [["عنوان الدرس", "الصحابي عبدالله بن عمر رضي الله عنهما"], ["نواتج التعلم", "1. يعرّف بالصحابي عبدالله بن عمر رضي الله عنهما (نسبه، إسلامه، هجرته، جهاده) (15 دقيقة)\n2. يبين مكانته في العلم ورواية الحديث والفتوى (15 دقيقة)\n3. يستنتج صفات يقتدي بها في حياته (10 دقائق)"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالخريطة الذهنية"], ["مصادر التعلم", "كتاب الطالب ص172-176\nبطاقة تعريف بالصحابي\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: من الصحابة الذين تعرفهم؟ ما الذي يميزهم؟"], ["إجراءات التنفيذ (20 دقيقة)", "1. السيرة: أبو عبد الرحمن عبدالله بن عمر بن الخطاب؛ أسلم صغيرًا مع أخته حفصة أم المؤمنين؛ هاجر مع أبيه ولازم النبي ﷺ؛ ردّه النبي ﷺ يوم بدر وأحد لصغر سنه، وأذن له في الخندق وعمره خمسة عشر عامًا؛ من أشهر رواة الحديث الثقات يرويه كما سمعه دون زيادة ولا نقص، وفقيه متأنٍ في الفتوى (8 دقائق)\nالاستراتيجيات: القصة.\n\n2. حديث النخلة والقدوة: قصته في سؤال النبي ﷺ عن الشجرة التي تشبه المسلم (النخلة) وسكوته أدبًا مع كبار الصحابة؛ كيف نقتدي به: اتباع الحق صغيرًا، الاجتهاد في العبادة، التأني في الفتوى، تتبع السنة، الرحمة بالمساكين (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس (نشاط ممتع مع المواطنة) – قدوة لشباب عمان: تستخرج المجموعات صفات عبدالله بن عمر رضي الله عنهما كحب العلم والاقتداء بالسنة، وتبين كيف يتحلى بها الشاب العماني في دراسته وخدمة وطنه (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من أخت عبدالله بن عمر؟\nالإجابة النموذجية: حفصة أم المؤمنين رضي الله عنها\n2) (تطبيق) متى أذن له النبي ﷺ
