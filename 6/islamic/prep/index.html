وسجّل حرفين تحتاج إلى تحسين نطقهما.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=2"]]}, {"no": 5, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "مخارج الحروف", "k": 4, "n": 4, "wi": 5, "wn": 5, "pages": "19-25", "f": [["عنوان الدرس", "مخارج الحروف"], ["نواتج التعلم", "1. يضع الحروف في مخارجها الصحيحة على المخطط\n2. يكتشف الأخطاء التي قد يقع فيها القارئ في نطق الحروف\n3. يقوّم تعلمه في درس مخارج الحروف"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم الذاتي\nالمسابقة"], ["مصادر التعلم", "كتاب الطالب ص24-25 (أقيّم تعلمي)\nمخطط المخارج\nبطاقات"], ["التهيئة (5 دقائق)", "سؤال سريع: عدد المخارج العامة بترتيبها من الداخل إلى الخارج"], ["إجراءات التنفيذ (20 دقيقة)", "أقيّم تعلمي (أولًا وثانيًا) (10 دقائق):\n- وضع الكلمات والحروف في مكانها المناسب من المخطط: الشفتان، الغنة، النون المشددة...\n- تصحيح جماعي\n\nأقيّم تعلمي (ثالثًا) (10 دقائق):\n- كتابة الأخطاء المحتملة في نطق الكلمات الملونة في الآيات الكريمة\n- مسابقة بين المجموعات في النطق الصحيح"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ضع الحرف في مخرجه: (و، ع، ن المشددة).\nالإجابة النموذجية: الواو: الشفتان (أو الجوف إن كانت مدية)، العين: وسط الحلق، الغنة في النون المشددة: الخيشوم\n2) (تطبيق) ما الخطأ المحتمل في نطق (الحمد)؟\nالإجابة النموذجية: نطق الحاء هاءً\n3) (استدلال) ما الخطأ المحتمل في نطق (عليهم)؟\nالإجابة النموذجية: نطق العين همزة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم مخرجًا في الحلق؟ وما حروف كل مخرج؟\nالإجابة النموذجية: ثلاثة: أقصاه (ء، هـ)، وسطه (ع، ح)، أدناه (غ، خ)\n2) (تطبيق) أي المخرجين يخرج منه حرف الميم: الشفتان أم الحلق؟\nالإجابة النموذجية: الشفتان\n3) (استدلال) صمم بطاقة تذكير بالمخارج الخمسة لتلصقها في مصحفك.\nالإجابة النموذجية: بطاقة صحيحة تضم المخارج الخمسة وأمثلتها"], ["الغلق (3 دقائق)", "كل طالب يكتب أكثر مخرج يحتاج إلى التدرب عليه"], ["الواجب المنزلي", "راجع درس مخارج الحروف وتدرب على نطق حروف الحلق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=2"]]}, {"no": 6, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 2, "n": 8, "wi": 1, "wn": 5, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (8-17) من سورة المدثر تلاوة صحيحة\n2. يحفظ الآيات (8-17) حفظًا متقنًا\n3. يوضح معاني: الناقور، عسير، وحيدًا، ممدودًا، شهودًا، صعودًا"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص12-13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع سريع للآيات (1-7)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (8-17) ومحاكاة\n- التنبيه على مخرج العين في (عسير، عنيدًا) والخاء في (خلقت)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي (8-10) ثم (11-17)\n- معاني: الناقور (الصور)، عسير (شديد)، وحيدًا (منفردًا لا مال له ولا ولد حين خلقه)، ممدودًا (كثيرًا واسعًا)، بنين شهودًا (أبناء حاضرين معه)، سأرهقه صعودًا (سأكلفه عذابًا شاقًا)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿فَذَٰلِكَ يَوۡمَئِذٖ …﴾\nالإجابة النموذجية: ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾\n2) (تطبيق) ما معنى (الناقور)؟\nالإجابة النموذجية: الصور الذي يُنفخ فيه يوم القيامة\n3) (استدلال) من الذي نزلت فيه الآيات (11-17)؟\nالإجابة النموذجية: الوليد بن المغيرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾.\nالإجابة النموذجية: ﴿وَبَنِينَ شُهُودٗا﴾\n2) (تطبيق) ما معنى (وبنين شهودًا)؟\nالإجابة النموذجية: أبناء حاضرين معه لا يغيبون عنه\n3) (استدلال) ما مخرج حرف الخاء في (خلقت)؟\nالإجابة النموذجية: أدنى الحلق"], ["الغلق (3 دقائق)", "تسميع ثنائي للآيات (8-17)"], ["الواجب المنزلي", "سمّع الآيات (1-17) لأحد والديك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=3"]]}, {"no": 7, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (183-185) من سورة البقرة تلاوة صحيحة\n2. يوضح معاني المفردات: كُتب، معدودات، يطيقونه، فدية\n3. يبين حكم الصيام والغاية منه (التقوى)"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص26-28\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- سؤال: عرّف الصيام في ضوء دراستك السابقة\n- إكمال التعريف: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس بنية"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية ومحاكاة للآيات الثلاث\n- تصويب المخارج والضبط\n\nالمعاني والفهم (10 دقائق):\n- كُتب: فُرض\n- لعلكم تتقون: الغاية من الصيام بلوغ التقوى\n- أيامًا معدودات: أيام شهر رمضان\n- الصيام عبادة خفية تحيي في النفس مراقبة الله"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى (كُتب عليكم الصيام)؟\nالإجابة النموذجية: فُرض عليكم الصيام\n2) (تطبيق) ما الغاية من الصيام كما في الآية (183)؟\nالإجابة النموذجية: التقوى\n3) (استدلال) كيف يربي الصيام التقوى في نفس المسلم؟\nالإجابة النموذجية: لأنه عبادة خفية بين العبد وربه يترك فيها شهواته طوعًا فتنمو فيه مراقبة الله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أكمل: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا …﴾\nالإجابة النموذجية: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ كُتِبَ عَلَيۡكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ لَعَلَّكُمۡ تَتَّقُونَ﴾\n2) (تطبيق) ما المقصود بـ (أيامًا معدودات)؟\nالإجابة النموذجية: أيام شهر رمضان\n3) (استدلال) هل فُرض الصيام على المسلمين وحدهم؟ وما الدليل؟\nالإجابة النموذجية: لا، فُرض على من قبلنا، لقوله تعالى: ﴿… كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبۡلِكُمۡ …﴾"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (183)"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (183-185).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=4"]]}, {"no": 8, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "سورة البقرة (183-185) (تلاوة وفهم)", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "26-31", "f": [["عنوان الدرس", "سورة البقرة (183-185) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين رخصة الفطر للمريض والمسافر ووجوب القضاء\n2. يوضح حكم العاجز عن الصيام (الفدية)\n3. يستنتج يسر الإسلام من قوله تعالى: ﴿… يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ …﴾"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص28-31\nالمصحف الشريف\nبطاقات حالات"], ["التهيئة (5 دقائق)", "- قراءة قصة آمنة وجدتها التي تناولت الدواء في نهار رمضان\n- سؤال: لماذا أفطرت الجدة؟"], ["إجراءات التنفيذ (20 دقيقة)", "الرخص (10 دقائق):\n- المريض الذي يشق عليه الصيام أو يؤخر شفاءه يفطر ويقضي\n- المسافر يفطر ويقضي: ﴿… فَعِدَّةٞ مِّنۡ أَيَّامٍ أُخَرَۚ …﴾\n- العاجز عن الصيام بسبب مشقته الدائمة كالكبير الطاعن في السن: يُطعم عن كل يوم مسكينًا\n\nاليسر وفضل رمضان (10 دقائق):\n- شهر رمضان أُنزل فيه القرآن هدى للناس\n- اليسر: الرخص رحمة من الله\n- تكميل العدة والتكبير شكرًا لله\n- حل أنشطة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما حكم المريض مرضًا يشق معه الصيام؟\nالإجابة النموذجية: يجوز له الفطر وعليه القضاء بعدد الأيام التي أفطرها\n2) (تطبيق) ما الفدية؟ ومن يخرجها؟\nالإجابة النموذجية: إطعام مسكين عن كل يوم، يخرجها العاجز عن الصيام كالكبير الطاعن في السن\n3) (استدلال) ما فضل شهر رمضان كما ورد في الآية (185)؟\nالإجابة النموذجية: أُنزل فيه القرآن هدى للناس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل كل مرض يبيح الفطر؟ علّل.\nالإجابة النموذجية: لا، المبيح هو الذي يشق معه الصيام أو يزيده أو يؤخر شفاءه\n2) (تطبيق) استخرج من الآية (185) ما يدل على يسر الإسلام.\nالإجابة النموذجية: ﴿… يُرِيدُ ٱللَّهُ بِكُمُ ٱلۡيُسۡرَ وَلَا يُرِيدُ بِكُمُ ٱلۡعُسۡرَ …﴾\n3) (استدلال) صنّف الحالات: (مسافر، شيخ كبير عاجز، مريض شُفي).\nالإجابة النموذجية: المسافر: يفطر ويقضي، الشيخ العاجز: يفدي، المريض: يقضي ما أفطره بعد شفائه"], ["الغلق (3 دقائق)", "كل مجموعة تكتب عبارة تلخص يسر الإسلام في الصيام"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=4"]]}, {"no": 9, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "ثواب العمل الصالح (حديث شريف)", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "32-36", "f": [["عنوان الدرس", "ثواب العمل الصالح (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث الشريف قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث عبدالله بن عباس رضي الله عنهما\n3. يوضح المقصود بالعينين اللتين لا تمسهما النار"], ["الاستراتيجيات", "الحوار والمناقشة\nالقصة\nالتكرار الموجّه"], ["مصادر التعلم", "كتاب الطالب ص32-34\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- قراءة حوار منار وأبيها الذي يخرج ليلًا لعمله في حفظ الأمن\n- سؤال: ما أهمية عمل أبي منار؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (10 دقائق):\n- نص الحديث: «عينان لا تمسهما النار: عين بكت من خشية الله، وعين باتت تحرس في سبيل الله» (الترمذي)\n- الراوي: عبدالله بن عباس، ابن عم النبي ﷺ، حَبر الأمة، دعا له النبي: «اللهم فقهه في الدين وعلمه التأويل»\n\nالحفظ والفهم (10 دقائق):\n- حفظ الحديث بالتكرار\n- العين الأولى: عين مؤمن بكت خوفًا من الله ورجاء رحمته\n- العين الثانية: سهرت لمصالح المسلمين كحراسة الحدود وحفظ الأمن"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما صلة قرابة ابن عباس بالنبي ﷺ؟\nالإجابة النموذجية: ابن عمه\n2) (تطبيق) ما معنى (حبر الأمة)؟\nالإجابة النموذجية: عالمها الكبير\n3) (استدلال) أكمل: «عينان لا تمسهما النار: ...».\nالإجابة النموذجية: عين بكت من خشية الله، وعين باتت تحرس في سبيل الله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مثالًا معاصرًا لعين تبيت تحرس في سبيل الله.\nالإجابة النموذجية: رجال الشرطة والجيش الذين يحرسون الوطن ليلًا\n2) (تطبيق) لماذا كان لبكاء العين من خشية الله ثواب عظيم؟\nالإجابة النموذجية: لأنه دليل على صدق الإيمان واستشعار عظمة الله في الخلوة\n3) (استدلال) سمّع الحديث غيبًا.\nالإجابة النموذجية: تسميع صحيح"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه في دفترك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=5"]]}, {"no": 10, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "ثواب العمل الصالح (حديث شريف)", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "32-36", "f": [["عنوان الدرس", "ثواب العمل الصالح (حديث شريف)"], ["نواتج التعلم", "1. يعرّف العمل الصالح في نظر الإسلام\n2. يستنتج أن الحديث ذكر العين وأراد الجسد كله، وذكر العملين مثالًا لا حصرًا\n3. يربط بين الأعمال الصالحة وثوابها"], ["الاستراتيجيات", "الربط بين السبب والنتيجة\nالتعلم التعاوني\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص34-36\nبطاقات أعمال وثواب\nالسبورة"], ["التهيئة (5 دقائق)", "عصف ذهني: اذكر عملًا صالحًا قمت به هذا الأسبوع"], ["إجراءات التنفيذ (20 دقيقة)", "مفهوم العمل الصالح (10 دقائق):\n- كل عمل نافع خالص لوجه الله تعالى\n- ذكر العين وأريد الجسد كله (تعبير مجازي)\n- العملان مثال لا حصر: ﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾\n- البكاء من خشية الله في الخلوة دليل صدق الإيمان، وصاحبه ممن يظلهم الله في ظله\n\nالربط والتطبيق (10 دقائق):\n- نشاط الربط بين السبب والنتيجة في الكتاب\n- مجموعات: أعمال صالحة في البيت والمدرسة والمجتمع وثوابها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف العمل الصالح.\nالإجابة النموذجية: كل عمل نافع خالص لوجه الله تعالى\n2) (تطبيق) لماذا ذكر الحديث (العين) وهو يقصد الإنسان كله؟\nالإجابة النموذجية: تعبير مجازي من باب ذكر الجزء وإرادة الكل\n3) (استدلال) هل الثواب مقصور على هذين العملين؟ ولماذا؟\nالإجابة النموذجية: لا، ذُكرا على سبيل المثال، والمؤمن يثاب على كل عمل صالح ولو كان صغيرًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر ثلاثة أعمال صالحة يمكنك القيام بها.\nالإجابة النموذجية: مثل: بر الوالدين، ومساعدة زميل، والمحافظة على نظافة المسجد\n2) (تطبيق) ما جزاء من ذكر الله خاليًا ففاضت عيناه؟\nالإجابة النموذجية: من السبعة الذين يظلهم الله في ظله يوم لا ظل إلا ظله\n3) (استدلال) كيف تشكر من يسهرون على أمن وطنك؟\nالإجابة النموذجية: بالدعاء لهم واحترامهم والالتزام بالأنظمة (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "كل طالب يكتب عملًا صالحًا يعزم على فعله غدًا"], ["الواجب المنزلي", "سمّع الحديث وحل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=5"]]}, {"no": 11, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 3, "n": 8, "wi": 1, "wn": 5, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (18-25) تلاوة صحيحة\n2. يحفظ الآيات (18-25) حفظًا متقنًا\n3. يوضح معاني: قدّر، قُتل، عبس، بسر، يؤثر"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (8-17) من عدد من الطلبة"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (18-25) ومحاكاة\n- العناية بمخرج الحاء في (سحر) والهاء في (هذا)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: فكّر وقدّر (هيّأ في نفسه ما يقول في القرآن)، فقُتل (لُعن)، عبس (قطّب وجهه)، بسر (اشتد عبوسه)، سحر يؤثر (سحر يُنقل ويُروى عن السابقين)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿فَقَالَ إِنۡ هَٰذَآ …﴾\nالإجابة النموذجية: ﴿فَقَالَ إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ﴾\n2) (تطبيق) ما معنى (عبس وبسر)؟\nالإجابة النموذجية: قطّب وجهه واشتد عبوسه\n3) (استدلال) اتلُ الآية التي تلي ﴿إِنَّهُۥ فَكَّرَ وَقَدَّرَ﴾.\nالإجابة النموذجية: ﴿فَقُتِلَ كَيۡفَ قَدَّرَ﴾"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي قاله الوليد في القرآن كما في الآيتين (24-25)؟\nالإجابة النموذجية: قال إنه سحر يُؤثر، وإنه قول البشر\n2) (تطبيق) ما مخرج الحاء في (سحر)؟\nالإجابة النموذجية: وسط الحلق\n3) (استدلال) سمّع الآيات (18-25).\nالإجابة النموذجية: تسميع صحيح متقن"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-25)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-25).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=6"]]}, {"no": 12, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "من دلائل وحدانية الله تعالى", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "37-41", "f": [["عنوان الدرس", "من دلائل وحدانية الله تعالى"], ["نواتج التعلم", "1. يستنتج دلائل وحدانية الله تعالى من الكون والإنسان\n2. يتدبر الآيات الكريمة الدالة على الوحدانية\n3. يقرأ الأبيات الشعرية ويستخرج منها أدلة الوحدانية"], ["الاستراتيجيات", "التأمل والتفكر\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص37-39\nصور للكون (الشمس، القمر، الشجر، المطر)\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- إلقاء أبيات الشاعر: (انظر لتلك الشجرة ذات الغصون النضرة...)\n- سؤال: من الذي أخرج الثمرة وأوجد الشمس والقمر؟"], ["إجراءات التنفيذ (20 دقيقة)", "دلائل الكون (10 دقائق):\n- الشجرة تنمو من حبة، الشمس بضيائها وحرارتها، القمر والنجوم، المطر، البصر في الإنسان\n- كل ذلك دليل على خالق واحد ذي حكمة بالغة وقدرة مقتدرة\n\nتدبر الآيات (10 دقائق):\n- ﴿مَا ٱتَّخَذَ ٱللَّهُ مِن وَلَدٖ وَمَا كَانَ مَعَهُۥ مِنۡ إِلَٰهٍۚ إِذٗا لَّذَهَبَ كُلُّ إِلَٰهِۭ بِمَا خَلَقَ وَلَعَلَا بَعۡضُهُمۡ عَلَىٰ بَعۡضٖۚ …﴾\n- الاستنتاج: انتظام الكون دليل على وحدانية خالقه"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر دليلين من الكون على وحدانية الله.\nالإجابة النموذجية: نمو الشجرة من حبة صغيرة، وانتظام حركة الشمس والقمر\n2) (تطبيق) ماذا يحدث لو كان مع الله إله آخر كما في آية المؤمنون؟\nالإجابة النموذجية: لذهب كل إله بما خلق ولعلا بعضهم على بعض فيفسد الكون\n3) (استدلال) ما الذي نستنتجه من انتظام الكون؟\nالإجابة النموذجية: أن خالقه واحد مدبر حكيم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من الأبيات دليلًا من خلق الإنسان.\nالإجابة النموذجية: شقّ البصر في الإنسان\n2) (تطبيق) ما الحكمة التي تدل عليها الأبيات في وصف الخالق؟\nالإجابة النموذجية: ذو حكمة بالغة وقدرة مقتدرة\n3) (استدلال) اكتب جملة تتأمل فيها مخلوقًا يدل على وحدانية الله.\nالإجابة النموذجية: مثل: النحلة تصنع العسل بنظام دقيق، فسبحان من ألهمها"], ["الغلق (3 دقائق)", "كل طالب يذكر مخلوقًا يدل على عظمة الله"], ["الواجب المنزلي", "اكتب ثلاثة أدلة من بيئتك على وحدانية الله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=7"]]}, {"no": 13, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "من دلائل وحدانية الله تعالى", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "37-41", "f": [["عنوان الدرس", "من دلائل وحدانية الله تعالى"], ["نواتج التعلم", "1. يوضح دلالة الفطرة على وحدانية الله (اللجوء إليه عند الشدة)\n2. يبين آثار التوحيد في سلوك المسلم\n3. يقيم تصرفات في ضوء فهمه للدرس"], ["الاستراتيجيات", "القصة\nالحوار والمناقشة\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص39-41\nالمصحف الشريف\nبطاقات مواقف"], ["التهيئة (5 دقائق)", "سؤال: ماذا يفعل الإنسان إذا أصابه خطر في البحر؟"], ["إجراءات التنفيذ (20 دقيقة)", "دليل الفطرة (10 دقائق):\n- ﴿وَإِذَا مَسَّكُمُ ٱلضُّرُّ فِي ٱلۡبَحۡرِ ضَلَّ مَن تَدۡعُونَ إِلَّآ إِيَّاهُۖ …﴾\n- الإنسان بفطرته يلجأ إلى من يملك النفع والضر، وهو الله وحده\n- كتابة قصة قصيرة لرجل يسافر على سفينة ويواجه عاصفة\n\nآثار التوحيد (10 دقائق):\n- التوكل على الله، والإخلاص، والطمأنينة، وعدم الخوف من غيره، والاستقامة\n- تقييم مواقف: لجوء إلى الأحجبة والتمائم، دعاء غير الله، التوكل مع الأخذ بالأسباب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) إلى من يلجأ الإنسان بفطرته عند الشدة؟\nالإجابة النموذجية: إلى الله وحده\n2) (تطبيق) اذكر أثرين للتوحيد في سلوك المسلم.\nالإجابة النموذجية: التوكل على الله، والإخلاص في العمل\n3) (استدلال) ما رأيك في من يعلّق تميمة لتحميه من الضرر؟\nالإجابة النموذجية: تصرف خاطئ يخالف التوحيد، لأن النفع والضر بيد الله وحده"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من آية الإسراء ما يدل على الفطرة.\nالإجابة النموذجية: ﴿… ضَلَّ مَن تَدۡعُونَ إِلَّآ إِيَّاهُۖ …﴾\n2) (تطبيق) كيف يجمع المسلم بين التوكل والأخذ بالأسباب؟\nالإجابة النموذجية: يعمل ويجتهد ويأخذ بالأسباب ثم يفوض النتيجة إلى الله\n3) (استدلال) اكتب نصيحة لزميل يخاف من المستقبل في ضوء التوحيد.\nالإجابة النموذجية: نصيحة تذكّره بأن الأمر بيد الله وتدعوه إلى التوكل والعمل"], ["الغلق (3 دقائق)", "ترديد جماعي: لا إله إلا الله وحده لا شريك له"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=7"]]}, {"no": 14, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "الوحدة الأولى", "title": "أنواع الصيام"  ﷺ ببناء المسجد ثم السوق: ربط المعاملات بالأخلاق والعبادة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الأدب المستفاد من قوله تعالى: ﴿وَيۡلٞ لِّلۡمُطَفِّفِينَ﴾؟\nالإجابة النموذجية: الوفاء بالكيل والميزان وعدم إنقاصهما\n2) (تطبيق) اذكر ضابطين للتسوق الإلكتروني.\nالإجابة النموذجية: الصدق في وصف السلعة، والأمانة في السداد (أو حفظ البيانات)\n3) (استدلال) ما المقصود بالسماحة في البيع والشراء؟\nالإجابة النموذجية: التيسير وحسن المعاملة وعدم التشدد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما دلالة بناء النبي ﷺ المسجد قبل السوق؟\nالإجابة النموذجية: أن تقوم المعاملات على الأخلاق والعبادة وتقوى الله\n2) (تطبيق) ما حكم الغش في البيع؟\nالإجابة النموذجية: محرم\n3) (استدلال) أشار عليك صديق بشراء سلعة إلكترونيًا بوصف كاذب ليربح، بماذا تنصحه؟\nالإجابة النموذجية: أنصحه بالصدق في الوصف لأن الغش محرم ويمحق البركة"], ["الغلق (3 دقائق)", "قائمة صفية بآداب السوق الواقعي والإلكتروني"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=13"]]}, {"no": 24, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "مقدمة في أحكام النون الساكنة والتنوين", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "61-65", "f": [["عنوان الدرس", "مقدمة في أحكام النون الساكنة والتنوين"], ["نواتج التعلم", "1. يسترجع أحكام الميم الساكنة ويستخرجها من الآيات\n2. يعرّف النون الساكنة والتنوين\n3. يفرق بين النون الساكنة والتنوين"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتلاوة والمحاكاة\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص61-63\nالمصحف الشريف\nالسبورة"], ["التهيئة (5 دقائق)", "استخراج أحكام الميم الساكنة من آيتي الكتاب: ﴿وَلَا يُؤۡذَنُ لَهُمۡ فَيَعۡتَذِرُونَ﴾ و﴿ٱلَّذِيٓ أَطۡعَمَهُم مِّن جُوعٖ وَءَامَنَهُم مِّنۡ خَوۡفِۭ﴾"], ["إجراءات التنفيذ (20 دقيقة)", "التعريف (10 دقائق):\n- النون الساكنة: نون خالية من الحركة ثابتة لفظًا وخطًا، وصلًا ووقفًا، وتكون في الأسماء والأفعال والحروف، في وسط الكلمة وآخرها\n- التنوين: نون ساكنة زائدة تلحق آخر الاسم لفظًا وتفارقه خطًا ووقفًا\n\nالتمييز (10 دقائق):\n- أمثلة: (مِنْ، أَنْعَمْتَ، يَنْهَوْنَ) و(عليمٌ، رحيمًا، خوفٍ)\n- جدول مقارنة: النون الساكنة (في الأسماء والأفعال والحروف، تثبت خطًا ووقفًا) / التنوين (في الأسماء فقط، يُلفظ ولا يُكتب نونًا ولا يثبت وقفًا)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف النون الساكنة.\nالإجابة النموذجية: نون خالية من الحركة ثابتة لفظًا وخطًا وصلًا ووقفًا\n2) (تطبيق) عرّف التنوين.\nالإجابة النموذجية: نون ساكنة زائدة تلحق آخر الاسم لفظًا وتفارقه خطًا ووقفًا\n3) (استدلال) ما حكم الميم الساكنة في (أَطۡعَمَهُم مِّن)؟\nالإجابة النموذجية: إدغام متماثلين (إدغام شفوي)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج نونًا ساكنة وتنوينًا من: ﴿… وَءَامَنَهُم مِّنۡ خَوۡفِۭ﴾.\nالإجابة النموذجية: النون الساكنة في (مِنْ)، والتنوين في (خوفٍ)\n2) (تطبيق) اذكر فرقًا بين النون الساكنة والتنوين.\nالإجابة النموذجية: النون الساكنة تثبت خطًا ووقفًا، والتنوين لا يثبت خطًا ولا وقفًا\n3) (استدلال) هل يدخل التنوين على الأفعال؟\nالإجابة النموذجية: لا، يلحق الأسماء فقط"], ["الغلق (3 دقائق)", "كل طالب يكتب كلمة فيها نون ساكنة وأخرى فيها تنوين"], ["الواجب المنزلي", "استخرج خمس نونات ساكنة وخمسة تنوينات من سورة المدثر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=14"]]}, {"no": 25, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "مقدمة في أحكام النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "61-65", "f": [["عنوان الدرس", "مقدمة في أحكام النون الساكنة والتنوين"], ["نواتج التعلم", "1. يعدد أحكام النون الساكنة والتنوين الأربعة\n2. يقارن بين أحكام الميم الساكنة وأحكام النون الساكنة والتنوين\n3. يستخرج النون الساكنة والتنوين من آيات قرآنية"], ["الاستراتيجيات", "الخرائط الذهنية\nالتعلم التعاوني\nالتلاوة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص63-65\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "سؤال: كم حكمًا للميم الساكنة؟ اذكرها"], ["إجراءات التنفيذ (20 دقيقة)", "الأحكام الأربعة (10 دقائق):\n- الإظهار، والإدغام، والإقلاب، والإخفاء\n- الحكم يتحدد بالحرف الذي يلي النون الساكنة أو التنوين\n- استماع لأمثلة لكل حكم دون التفصيل\n\nالمقارنة (10 دقائق):\n- مجال المقارنة: عدد الأحكام (الميم ثلاثة، النون أربعة)، وجه الاشتراك (تتأثر بالحرف الذي يليها، وتشترك في الغنة من الخيشوم)\n- حل (أقيّم تعلمي)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عدّد أحكام النون الساكنة والتنوين.\nالإجابة النموذجية: الإظهار، والإدغام، والإقلاب، والإخفاء\n2) (تطبيق) بمَ يتحدد حكم النون الساكنة؟\nالإجابة النموذجية: بالحرف الذي يليها\n3) (استدلال) ما وجه الاشتراك بين الميم الساكنة والنون الساكنة؟\nالإجابة النموذجية: كلتاهما تتأثر بالحرف الذي يليها وفيهما غنة تخرج من الخيشوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم حكمًا للميم الساكنة؟ وكم حكمًا للنون الساكنة؟\nالإجابة النموذجية: للميم ثلاثة، وللنون الساكنة والتنوين أربعة\n2) (تطبيق) صحح: التنوين يكتب نونًا في آخر الاسم.\nالإجابة النموذجية: التنوين يُلفظ نونًا ولا يُكتب نونًا\n3) (استدلال) استخرج من ﴿فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ﴾ تنوينًا.\nالإجابة النموذجية: (يومئذٍ) و(يومٌ) و(عسيرٌ)"], ["الغلق (3 دقائق)", "خريطة ذهنية للأحكام الأربعة تُعلّق في الصف"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=14"]]}, {"no": 26, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 6, "n": 8, "wi": 1, "wn": 5, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (32-40) تلاوة صحيحة مطبقًا ما تعلمه من أحكام النون الساكنة والتنوين\n2. يحفظ الآيات (32-40) حفظًا متقنًا\n3. يوضح معاني: أدبر، أسفر، لإحدى الكُبر، رهينة"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص13-14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآية (31) وربطها بالآيات السابقة"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (32-40) ومحاكاة\n- ملاحظة التنوين في (نَفۡسِۭ بِمَا) وتلفّظه ميمًا مع الغنة، و(جَنَّٰتٖ يَتَسَآءَلُونَ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي (32-37) ثم (38-40)\n- معاني: إذ أدبر (ولّى وذهب)، أسفر (أضاء)، لإحدى الكبر (إحدى الدواهي العظيمة)، رهينة (محبوسة بعملها)، أصحاب اليمين (أهل الجنة)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿كُلُّ نَفۡسِۭ …﴾\nالإجابة النموذجية: ﴿كُلُّ نَفۡسِۭ بِمَا كَسَبَتۡ رَهِينَةٌ﴾\n2) (تطبيق) ما معنى (والصبح إذا أسفر)؟\nالإجابة النموذجية: أقسم الله بالصبح إذا أضاء وانكشف\n3) (استدلال) من المستثنون من الارتهان بأعمالهم في الآية (39)؟\nالإجابة النموذجية: أصحاب اليمين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱلَّيۡلِ إِذۡ أَدۡبَرَ﴾.\nالإجابة النموذجية: ﴿وَٱلصُّبۡحِ إِذَآ أَسۡفَرَ﴾\n2) (تطبيق) ما معنى (رهينة)؟\nالإجابة النموذجية: مرهونة محبوسة بعملها\n3) (استدلال) حدّد التنوين في ﴿فِي جَنَّـٰتٖ يَتَسَآءَلُونَ﴾.\nالإجابة النموذجية: (جنّاتٍ) بتنوين الكسر"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (32-40)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=15"]]}, {"no": 27, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 1, "n": 4, "wi": 2, "wn": 5, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (11-27) تلاوة صحيحة\n2. يتعرف سبب نزول الآيات في الوليد بن المغيرة\n3. يوضح النعم التي أنعم الله بها على الوليد"], ["الاستراتيجيات", "القصة\nالتلاوة النموذجية والمحاكاة\nالحوار والمناقشة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص66-68\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "سؤال: ماذا يجب على الإنسان إذا أنعم الله عليه بالمال والأبناء؟"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (11-27) ومحاكاة\n- التنبيه على الإظهار في (مَنۡ خَلَقۡتُ) والإدغام في (مَالٗا مَّمۡدُودٗا)\n\nقصة النزول (10 دقائق):\n- ذهاب الوليد إلى النبي ﷺ ليثنيه عن الدعوة، وسماعه القرآن ورقة قلبه\n- إغراء أبي جهل له ليقول سوءًا\n- النعم: مال ممدود، بنون شهود، تمهيد في الرزق والجاه"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) فيمن نزلت الآيات (11-27)؟\nالإجابة النموذجية: في الوليد بن المغيرة\n2) (تطبيق) اذكر نعمتين أنعم الله بهما على الوليد.\nالإجابة النموذجية: المال الكثير، والأبناء الحاضرون معه\n3) (استدلال) ما معنى (ومهّدت له تمهيدًا)؟\nالإجابة النموذجية: بسطت له الرزق والجاه والرياسة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ماذا حدث للوليد عندما سمع القرآن أول مرة؟\nالإجابة النموذجية: رق قلبه وتراجع عما جاء من أجله\n2) (تطبيق) من الذي أغرى الوليد ليقول سوءًا في القرآن؟\nالإجابة النموذجية: أبو جهل\n3) (استدلال) أكمل: ﴿وَجَعَلۡتُ لَهُۥ …﴾\nالإجابة النموذجية: ﴿وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا﴾"], ["الغلق (3 دقائق)", "تلاوة جماعية للآيات (11-17)"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (11-27).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 28, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 2, "n": 4, "wi": 3, "wn": 5, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يحلل موقف الوليد بن المغيرة من القرآن (التفكير والتقدير ثم الجحود)\n2. يصف الحالة النفسية للوليد عند تقوّله على القرآن\n3. يبين سبب إنكار الوليد أن يكون القرآن وحيًا"], ["الاستراتيجيات", "التحليل\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص68-69\nالمصحف الشريف\nبطاقات أسئلة"], ["التهيئة (5 دقائق)", "- قراءة قول الوليد في بداية الأمر: (والله إن لقوله لحلاوة وإن عليه لطلاوة...)\n- سؤال: ما رأيك فيما قاله؟"], ["إجراءات التنفيذ (20 دقيقة)", "التفكير والتقدير (10 دقائق):\n- ﴿إِنَّهُۥ فَكَّرَ وَقَدَّرَ﴾: أطال التفكير ليجد ما يقوله في القرآن\n- ﴿ثُمَّ عَبَسَ وَبَسَرَ﴾: الحالة النفسية من الضيق والعبوس لما ضاقت عليه الحيل\n\nالجحود (10 دقائق):\n- ﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾\n- قوله: ﴿… إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ﴾\n- سبب الإنكار: الاستكبار والعناد وإرضاء قريش لا الجهل بالحق"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) صف الحالة النفسية للوليد كما صورتها الآيات.\nالإجابة النموذجية: ضيق وعبوس وتقطيب للوجه لما عجز عن إيجاد طعن مقنع\n2) (تطبيق) ماذا قال الوليد في القرآن بعد تفكيره؟\nالإجابة النموذجية: قال: إنه سحر يُؤثر وقول البشر\n3) (استدلال) ما سبب إنكار الوليد للقرآن رغم إعجابه به؟\nالإجابة النموذجية: الاستكبار عن قبول الحق ومجاراة قريش"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تصور إعراض الوليد واستكباره.\nالإجابة النموذجية: ﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾\n2) (تطبيق) هل كان الوليد جاهلًا بقيمة القرآن؟ علل.\nالإجابة النموذجية: لا، فقد شهد بحلاوته وعلوه، لكنه استكبر وجحد\n3) (استدلال) ما الدرس المستفاد من موقف الوليد؟\nالإجابة النموذجية: أن الاستكبار يحرم صاحبه من الهداية رغم معرفته الحق"], ["الغلق (3 دقائق)", "كل مجموعة تكتب صفة سلبية للوليد وما يقابلها من صفة المؤمن"], ["الواجب المنزلي", "اكتب فقرة عن خطر الاستكبار على الإنسان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 29, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 3, "n": 4, "wi": 4, "wn": 5, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين عاقبة الاستكبار عن قبول الحق كما في الآيات\n2. يستخلص القيم والدروس المستفادة من الآيات\n3. يقوّم تعلمه في درس سورة المدثر (11-27)"], ["الاستراتيجيات", "التعلم التعاوني\nالمسابقة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص69-70 (أقيّم تعلمي)\nالمصحف الشريف\nبطاقات"], ["التهيئة (5 دقائق)", "سؤال: ما عاقبة من يرى الحق ويرفضه؟"], ["إجراءات التنفيذ (20 دقيقة)", "العاقبة (10 دقائق):\n- ﴿سَأُرۡهِقُهُۥ صَعُودًا﴾: عذاب شاق\n- ﴿سَأُصۡلِيهِ سَقَرَ﴾\n- ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾: تهويل لشأنها\n- نعم الله لم تزكِّ الوليد لأنه جحدها\n\nالقيم (10 دقائق):\n- شكر النعم باستعمالها في طاعة الله\n- قبول الحق والإنصاف\n- عدم الإعراض عن كتاب الله\n- حل (أقيّم تعلمي)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما عاقبة الوليد كما في الآيات؟\nالإجابة النموذجية: سيصليه الله سقر ويرهقه عذابًا شاقًا\n2) (تطبيق) ما الغرض من الاستفهام في ﴿وَمَآ أَدۡرَىٰكَ مَا سَقَرُ﴾؟\nالإجابة النموذجية: التهويل وتعظيم شأنها\n3) (استدلال) أكمل: الإعراض عن كتاب الله سبب في ......\nالإجابة النموذجية: الشقاء والهلاك في الدنيا والآخرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف يشكر المسلم نعمة المال والأبناء؟\nالإجابة النموذجية: باستعمالها في طاعة الله وتربية الأبناء تربية صالحة\n2) (تطبيق) ما القيمة التي تتعلمها من الآيات؟\nالإجابة النموذجية: قبول الحق والتواضع له وعدم الاستكبار\n3) (استدلال) سمّع الآيات (21-27).\nالإجابة النموذجية: تسميع صحيح من الآيات المحفوظة"], ["الغلق (3 دقائق)", "تلاوة جماعية للآيات (18-27)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 30, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "سورة المدثر (11-27) (تلاوة وفهم)", "k": 4, "n": 4, "wi": 5, "wn": 5, "pages": "66-70", "f": [["عنوان الدرس", "سورة المدثر (11-27) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (11-27) تلاوة مجودة مطبقًا ما تعلمه\n2. يربط معاني الآيات بمواقف من الواقع\n3. يعبّر عن موقفه من الحق بعد دراسة الآيات"], ["الاستراتيجيات", "لعب الأدوار\nالتلاوة الفردية\nالحوار والمناقشة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص66-70\nبطاقات مواقف"], ["التهيئة (5 دقائق)", "تلاوة فردية لطالبين متقنين"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة المتقنة (10 دقائق):\n- تلاوة فردية لعدد من الطلبة مع تصويب\n- تطبيق مخارج الحروف وأحكام الميم الساكنة\n\nالربط بالواقع (10 دقائق):\n- مواقف: طالب يعرف خطأه ويرفض الاعتراف به، شخص ينتقد عملًا ناجحًا حسدًا\n- مقارنتها بموقف الوليد\n- كيف يكون الموقف الصحيح؟"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اتلُ ﴿فَقُتِلَ كَيۡفَ قَدَّرَ﴾ مع بيان معناها.\nالإجابة النموذجية: تلاوة صحيحة، والمعنى: لُعن كيف هيأ في نفسه ذلك القول الباطل\n2) (تطبيق) اذكر موقفًا من الواقع يشبه موقف الوليد.\nالإجابة النموذجية: من يعرف الحق ويرفضه كبرًا أو حسدًا (تقبل الأمثلة المناسبة)\n3) (استدلال) ما الموقف الصحيح من الحق؟\nالإجابة النموذجية: قبوله والاعتراف به أيًّا كان قائله"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف شعورك وأنت تتلو آيات وعيد المستكبرين.\nالإجابة النموذجية: الخوف من الله والحرص على التواضع وقبول الحق\n2) (تطبيق) اتلُ الآية التي تلي ﴿ثُمَّ نَظَرَ﴾.\nالإجابة النموذجية: ﴿ثُمَّ عَبَسَ وَبَسَرَ﴾\n3) (استدلال) استنتج دعوة الآيات للإنسان العاقل.\nالإجابة النموذجية: أن يتفكر بإنصاف ويقبل الحق ولا يستكبر عنه"], ["الغلق (3 دقائق)", "دعاء جماعي: اللهم أرنا الحق حقًا وارزقنا اتباعه"], ["الواجب المنزلي", "سمّع الآيات (11-27) لوالديك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=16"]]}, {"no": 31, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 7, "n": 8, "wi": 1, "wn": 4, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (41-48) تلاوة صحيحة\n2. يحفظ الآيات (41-48) حفظًا متقنًا\n3. يوضح أسباب دخول المجرمين سقر كما ذكرتها الآيات"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (32-40)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (41-48) ومحاكاة\n- ملاحظة النون الساكنة في (تَنفَعُهُمۡ) والتنوين في (شَفَٰعَةُ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: ما سلككم (ما أدخلكم)، نخوض مع الخائضين (نتكلم بالباطل مع أهله)، اليقين (الموت)\n- أسباب دخول سقر: ترك الصلاة، وعدم إطعام المسكين، والخوض في الباطل، والتكذيب بيوم الدين"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿قَالُواْ لَمۡ …﴾\nالإجابة النموذجية: ﴿قَالُواْ لَمۡ نَكُ مِنَ ٱلۡمُصَلِّينَ﴾\n2) (تطبيق) ما معنى (اليقين) في الآية (47)؟\nالإجابة النموذجية: الموت\n3) (استدلال) اذكر سببين لدخول المجرمين سقر.\nالإجابة النموذجية: ترك الصلاة، وعدم إطعام المسكين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَلَمۡ نَكُ نُطۡعِمُ ٱلۡمِسۡكِينَ﴾.\nالإجابة النموذجية: ﴿وَكُنَّا نَخُوضُ مَعَ ٱلۡخَآئِضِينَ﴾\n2) (تطبيق) ما معنى (نخوض مع الخائضين)؟\nالإجابة النموذجية: نتكلم في الباطل مع أهله\n3) (استدلال) هل تنفع الشفاعة المجرمين؟\nالإجابة النموذجية: لا، ﴿فَمَا تَنفَعُهُمۡ شَفَٰعَةُ ٱلشَّـٰفِعِينَ﴾"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (41-48)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-48).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=17"]]}, {"no": 32, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 1, "n": 2, "wi": 2, "wn": 4, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أبي هريرة رضي الله عنه\n3. يوضح معنى ترك ما لا يعني وأثره في حسن الإسلام"], ["الاستراتيجيات", "الحوار والمناقشة\nالتكرار الموجّه\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص71-73\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "- موقف: زميل يسأل عن أسرار غيره ويتدخل في كل شيء\n- سؤال: هل تحب هذا التصرف؟"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث والراوي (10 دقائق):\n- نص الحديث: «من حسن إسلام المرء تركه ما لا يعنيه»\n- الراوي: أبو هريرة عبد الرحمن بن صخر الدوسي، أسلم سنة 7هـ، لزم النبي ﷺ فصار أكثر الصحابة رواية للحديث، وكُني بأبي هريرة لهرة وجدها فحملها في كمه\n\nالحفظ والمعنى (10 دقائق):\n- حفظ الحديث\n- يدع المسلم ما لا يفيده في دنياه وآخرته ويشتغل بما ينفعه\n- «احرص على ما ينفعك»\n- الأثر: تزكية النفس، حفظ الوقت، المسارعة في الخير، الجدية والعمل في المجتمع"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل الحديث: «من حسن إسلام المرء ...».\nالإجابة النموذجية: تركه ما لا يعنيه\n2) (تطبيق) من راوي الحديث؟\nالإجابة النموذجية: أبو هريرة رضي الله عنه\n3) (استدلال) لماذا كُني بأبي هريرة؟\nالإجابة النموذجية: لأنه وجد هرة فحملها في كمه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (ما لا يعنيه)؟\nالإجابة النموذجية: ما لا يفيده ولا يهمه في أمر دينه ودنياه\n2) (تطبيق) اذكر أثرين لترك ما لا يعني.\nالإجابة النموذجية: حفظ الوقت، وتزكية النفس (أو سلامة العلاقات)\n3) (استدلال) سمّع الحديث غيبًا.\nالإجابة النموذجية: تسميع صحيح"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=18"]]}, {"no": 33, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "أترك ما لا يعنيني (حديث شريف)", "k": 2, "n": 2, "wi": 3, "wn": 4, "pages": "71-75", "f": [["عنوان الدرس", "أترك ما لا يعنيني (حديث شريف)"], ["نواتج التعلم", "1. يحدد صورًا مما لا يعني المسلم (فضول النظر والكلام والاستماع)\n2. يميز بين ما يعنيه وما لا يعنيه من الأعمال\n3. يبين أن الأمر بالمعروف والنصح لا يدخلان فيما نهي عنه"], ["الاستراتيجيات", "التصنيف\nالتعلم التعاوني\nلعب الأدوار"], ["مصادر التعلم", "كتاب الطالب ص73-75\nبطاقات أعمال\nالسبورة"], ["التهيئة (5 دقائق)", "الصندوق: عبارات (طلب العلم، مجادلة السفهاء، أداء العبادات، الجلوس في الطرقات، بر الوالدين، إتقان العمل، نشر الشائعات، عون الآخرين، تفتيش أجهزة الزملاء)"], ["إجراءات التنفيذ (20 دقيقة)", "الصور (10 دقائق):\n- فضول النظر والتطلع لما عند الآخرين، فضول الكلام، فضول الاستماع\n- ﴿وَٱلَّذِينَ هُمۡ عَنِ ٱللَّغۡوِ مُعۡرِضُونَ﴾\n- ﴿وَلَا تَقۡفُ مَا لَيۡسَ لَكَ بِهِۦ عِلۡمٌۚ …﴾\n\nالتمييز (10 دقائق):\n- تصنيف عبارات الصندوق: تعنينا (طلب العلم، العبادات، بر الوالدين، إتقان العمل، عون الآخرين) / لا تعنينا (مجادلة السفهاء، الجلوس في الطرقات، الشائعات، تفتيش أجهزة الزملاء)\n- الاستثناء: الأمر بالمعروف والنصح والإصلاح\n- الموقف في الكتاب والرد المناسب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر صورتين مما لا يعني المسلم.\nالإجابة النموذجية: فضول الكلام، والتطلع إلى ما عند الآخرين (أو فضول الاستماع)\n2) (تطبيق) صنّف: (تفتيش أجهزة الزملاء).\nالإجابة النموذجية: مما لا يعنيني فأتركه\n3) (استدلال) هل نصح الصديق إذا أخطأ مما لا يعنيني؟ ولماذا؟\nالإجابة النموذجية: لا، بل يعنيني، لأن النصح والإصلاح مستثنى مما نهى عنه الحديث"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنّف: (إتقان العمل، نشر الشائعات).\nالإجابة النموذجية: إتقان العمل يعنيني، نشر الشائعات لا يعنيني\n2) (تطبيق) ما المقصود بفضول الاستماع؟\nالإجابة النموذجية: الإصغاء إلى ما لا ينفع من أحاديث الناس وأسرارهم\n3) (استدلال) سألك زميل عن راتب والد زميل آخر، بماذا ترد؟\nالإجابة النموذجية: أذكّره بالحديث وأن هذا مما لا يعنينا"], ["الغلق (3 دقائق)", "كل طالب يكتب أمرًا سيتركه لأنه لا يعنيه"], ["الواجب المنزلي", "قارن بين مازن وخالد في نشاط الكتاب، وحل بقية الأنشطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=18"]]}, {"no": 34, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "الوحدة الثانية", "title": "معجزات الرسل عليهم السلام", "k": 1, "n": 1, "wi": 4, "wn": 4, "pages": "76-79", "f": [["عنوان الدرس", "معجزات الرسل عليهم السلام"], ["نواتج التعلم", "1. يعرّف المعجزة\n2. يذكر معجزات بعض الرسل (موسى وعيسى ومحمد عليهم السلام)\n3. يستنتج أن معجزات الرسل جاءت مناسبة لما برع فيه أهل زمانهم"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص76-79\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "قصة موسى عليه السلام مع فرعون والسحرة يوم الزينة"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم والقصة (10 دقائق):\n- المعجزة: أمر خارق للعادة مقرون بالتحدي سالم من المعارضة يؤيد الله به رسله\n- معجزات موسى: العصا التي صارت ثعبانًا مبينًا وتلقف ما صنع السحرة، واليد التي تخرج بيضاء للناظرين\n- إيمان السحرة\n\nالمناسبة (10 دقائق):\n- موسى: برع قومه في السحر فجاءت العصا\n- عيسى: برع قومه في الطب فأبرأ الأكمه والأبرص وأحيا الموتى بإذن الله\n- محمد ﷺ: برع العرب في الفصاحة فجاء القرآن\n- بيت السالمي في مشارق أنوار العقول عن إرسال الرسل مقرونين بالمعجزات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف المعجزة.\nالإجابة النموذجية: أمر خارق للعادة مقرون بالتحدي يعجز البشر عن الإتيان بمثله، يؤيد الله به رسله\n2) (تطبيق) اذكر معجزتين لموسى عليه السلام.\nالإجابة النموذجية: العصا التي تصير ثعبانًا، واليد البيضاء\n3) (استدلال) لماذا جاءت معجزة موسى من جنس السحر؟\nالإجابة النموذجية: لأن قومه برعوا في السحر فكانت المعجزة أبلغ في إقناعهم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معجزة عيسى عليه السلام المناسبة لقومه؟\nالإجابة النموذجية: إبراء الأكمه والأبرص وإحياء الموتى بإذن الله، لبراعتهم في الطب\n2) (تطبيق) ما معجزة نبينا محمد ﷺ الكبرى؟\nالإجابة النموذجية: القرآن الكريم\n3) (استدلال) ماذا حدث للسحرة عندما رأوا عصا موسى تلقف ما صنعوا؟\nالإجابة النموذجية: آمنوا برب موسى وهارون"], ["الغلق (3 دقائق)", "جدول جماعي: الرسول، معجزته، ما برع فيه قومه"], ["الواجب المنزلي", "حل أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=19"]]}, {"no": 35, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المدثر (تلاوة وحفظ)", "k": 8, "n": 8, "wi": 1, "wn": 5, "pages": "12-14", "f": [["عنوان الدرس", "سورة المدثر (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (49-56) تلاوة صحيحة\n2. يحفظ الآيات (49-56) ويتم حفظ سورة المدثر كاملة\n3. يوضح معاني: حمر مستنفرة، قسورة، صحفًا منشرة، أهل التقوى"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالمسابقة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص14\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (41-48)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (49-56) ومحاكاة\n- ملاحظة الإدغام بغنة في (حُمُرٞ مُّسۡتَنفِرَةٞ) والإخفاء في (فَمَن شَآءَ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: التذكرة (القرآن المذكّر)، حمر مستنفرة (حمير وحشية نافرة)، قسورة (الأسد أو الرماة)، صحفًا منشرة (كتبًا مفتوحة)، أهل التقوى (المستحق أن يُتقى)، أهل المغفرة (المستحق أن يغفر لمن تاب)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿كَأَنَّهُمۡ …﴾\nالإجابة النموذجية: ﴿كَأَنَّهُمۡ حُمُرٞ مُّسۡتَنفِرَةٞ﴾\n2) (تطبيق) بمَ شبّه الله المعرضين عن التذكرة؟\nالإجابة النموذجية: بحمر وحشية نافرة فرت من أسد\n3) (استدلال) ما معنى (هو أهل التقوى)؟\nالإجابة النموذجية: هو المستحق أن يُتقى ويُخاف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿كَلَّاۖ بَل لَّا يَخَافُونَ ٱلۡأٓخِرَةَ﴾.\nالإجابة النموذجية: ﴿كَلَّآ إِنَّهُۥ تَذۡكِرَةٞ﴾\n2) (تطبيق) ما معنى (قسورة)؟\nالإجابة النموذجية: الأسد أو الرماة\n3) (استدلال) سمّع سورة المدثر م ة", "title": "الاعتدال منهجي في الحياة", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "92-96", "f": [["عنوان الدرس", "الاعتدال منهجي في الحياة"], ["نواتج التعلم", "1. يعرّف الاعتدال والغلو\n2. يستنتج من حديث «إن الدين يسر» منهج الإسلام في الاعتدال\n3. يبين صورًا من اعتدال النبي ﷺ في شخصيته وسلوكه"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص92-94\nبطاقات النصوص\nجهاز عرض"], ["التهيئة (5 دقائق)", "- صورة ميزان متوازن وآخر مائل\n- سؤال: أيهما يمثل حياة المسلم؟"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم والحديث (10 دقائق):\n- الاعتدال: التوسط بين الإفراط والتفريط، والغلو: التشدد ومجاوزة الحد\n- «إن الدين يسر ولن يشادّ الدين أحد إلا غلبه، فسددوا وقاربوا وأبشروا»\n- سددوا: الزموا التوسط، قاربوا: اقتربوا من الأكمل إن لم تستطيعوه\n\nاعتدال النبي ﷺ (10 دقائق):\n- كان حليمًا لا يصل حلمه إلى الضعف، كريمًا لا يقوده كرمه إلى الإسراف، حييًا لا يمنعه حياؤه من تعليم الناس\n- ﴿لَّقَدۡ كَانَ لَكُمۡ فِي رَسُولِ ٱللَّهِ أُسۡوَةٌ حَسَنَةٞ …﴾"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عرّف الغلو.\nالإجابة النموذجية: التشدد ومجاوزة الحد\n2) (تطبيق) ما معنى (سددوا وقاربوا)؟\nالإجابة النموذجية: الزموا التوسط في الأعمال واقتربوا من الأكمل إن لم تستطيعوه\n3) (استدلال) اذكر صورة من اعتدال النبي ﷺ.\nالإجابة النموذجية: كان كريمًا دون إسراف (أو حليمًا دون ضعف)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (لن يشادّ الدين أحد إلا غلبه)؟\nالإجابة النموذجية: من يتشدد في الدين ويكلف نفسه ما لا تطيق يعجز وينقطع\n2) (تطبيق) لماذا أمرنا الله بالتأسي بالنبي ﷺ؟\nالإجابة النموذجية: لأنه القدوة الكاملة في الاعتدال وسائر الأخلاق\n3) (استدلال) أكمل: المسلم يؤدي الفرائض والنوافل من غير أن ......\nالإجابة النموذجية: يكلف نفسه فوق طاقتها"], ["الغلق (3 دقائق)", "كل طالب يذكر عملًا يعتدل فيه"], ["الواجب المنزلي", "اكتب موقفًا يظهر فيه الاعتدال في يومك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=24"]]}, {"no": 42, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثانية", "title": "الاعتدال منهجي في الحياة", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "92-96", "f": [["عنوان الدرس", "الاعتدال منهجي في الحياة"], ["نواتج التعلم", "1. يستخرج مظاهر الاعتدال من النصوص الشرعية (المأكل والمشرب، الإنفاق، الكلام، التوازن بين الدنيا والآخرة)\n2. يحكم على مواقف في ضوء مفهوم الاعتدال\n3. يقترح سلوكيات معتدلة في حياته اليومية"], ["الاستراتيجيات", "التصنيف\nالتعلم التعاوني\nحل المشكلات"], ["مصادر التعلم", "كتاب الطالب ص94-96\nبطاقات النصوص والمظاهر\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: كيف يكون الاعتدال في الطعام؟"], ["إجراءات التنفيذ (20 دقيقة)", "المظاهر (10 دقائق):\n- المأكل والمشرب: ﴿… وَكُلُواْ وَٱشۡرَبُواْ وَلَا تُسۡرِفُوٓاْۚ …﴾\n- الإنفاق: ﴿وَٱلَّذِينَ إِذَآ أَنفَقُواْ لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ …﴾\n- الكلام: «من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت»\n- التوازن: ﴿وَٱبۡتَغِ فِيمَآ ءَاتَىٰكَ ٱللَّهُ ٱلدَّارَ ٱلۡأٓخِرَةَۖ وَلَا تَنسَ نَصِيبَكَ مِنَ ٱلدُّنۡيَاۖ …﴾\n\nالمواقف (10 دقائق):\n- الحكم على مواقف الكتاب: من يقضي يومه كله في الألعاب الإلكترونية، من يصوم ويقوم ويهمل دراسته، من يشتري كل ما يراه\n- اقتراح البديل المعتدل"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما مظهر الاعتدال في: ﴿… لَمۡ يُسۡرِفُواْ وَلَمۡ يَقۡتُرُواْ …﴾؟\nالإجابة النموذجية: الاعتدال في الإنفاق\n2) (تطبيق) ما مظهر الاعتدال في حديث «فليقل خيرًا أو ليصمت»؟\nالإجابة النموذجية: الاعتدال في الكلام\n3) (استدلال) احكم: طالب يسهر على الألعاب الإلكترونية حتى الفجر.\nالإجابة النموذجية: تصرف غير معتدل يضر بصحته ودراسته وعبادته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج مظهر التوازن بين الدنيا والآخرة من آية القصص.\nالإجابة النموذجية: أن يبتغي المسلم الآخرة بما آتاه الله ولا ينسى نصيبه المباح من الدنيا\n2) (تطبيق) ضع دائرة على ما يتفق مع الاعتدال: (التبذير، الوسطية، البخل، التوازن).\nالإجابة النموذجية: الوسطية، والتوازن\n3) (استدلال) اقترح جدولًا يوميًا معتدلًا يجمع العبادة والدراسة والراحة.\nالإجابة النموذجية: جدول واقعي متوازن (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "شعار الصف: خير الأمور أوسطها في السلوك"], ["الواجب المنزلي", "حل أنشطة (أقيّم تعلمي).\n  44, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الإظهار الحلقي في النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "99-103", "f": [["عنوان الدرس", "الإظهار الحلقي في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يستخرج أمثلة للإظهار الحلقي من الآيات القرآنية\n2. يقارن بين الإظهار الشفوي والإظهار الحلقي\n3. يطبق الإظهار الحلقي في تلاوته"], ["الاستراتيجيات", "التلاوة والمحاكاة\nالجدول المقارن\nالمسابقة"], ["مصادر التعلم", "كتاب الطالب ص101-103\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "الاستماع لآيات فيها إظهار حلقي ومحاكاتها"], ["إجراءات التنفيذ (20 دقيقة)", "الاستخراج (10 دقائق):\n- استخراج أمثلة من سورتي المدثر والمزمل: (مَنۡ خَلَقۡتُ)، (إِنۡ هَٰذَآ)، (يَوۡمٌ عَسِيرٌ)، (مِنۡهُ)، (عَذَابًا أَلِيمٗا)\n- تحديد الحرف المظهر ونوع النون (ساكنة/تنوين)\n\nالمقارنة والتطبيق (10 دقائق):\n- جدول: الإظهار الشفوي (الميم الساكنة، حروفه كل الحروف عدا الميم والباء، مخرجه الشفتان) / الإظهار الحلقي (النون الساكنة والتنوين، حروفه ستة حلقية)\n- تلاوة فردية مع تطبيق الإظهار\n- أقيّم تعلمي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج إظهارًا حلقيًا من ﴿إِنۡ هَٰذَآ إِلَّا قَوۡلُ ٱلۡبَشَرِ﴾.\nالإجابة النموذجية: (إِنۡ هَٰذَآ): النون الساكنة قبل الهاء\n2) (تطبيق) ما الفرق بين الإظهار الشفوي والحلقي؟\nالإجابة النموذجية: الشفوي للميم الساكنة قبل غير الميم والباء، والحلقي للنون الساكنة والتنوين قبل الحروف الحلقية الستة\n3) (استدلال) ما حكم التنوين في (يَوۡمٌ عَسِيرٌ)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده العين"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اختر من حروف الإظهار: (ب، ح، ل).\nالإجابة النموذجية: الحاء\n2) (تطبيق) حدد الحكم والسبب: (مِنۡ عِلۡمٍ).\nالإجابة النموذجية: إظهار حلقي لأن بعد النون الساكنة العين\n3) (استدلال) اتلُ ﴿ذَرۡنِي وَمَنۡ خَلَقۡتُ وَحِيدٗا﴾ مطبقًا الإظهار.\nالإجابة النموذجية: تلاوة تظهر النون في (مَنۡ خَلَقۡتُ) دون غنة زائدة"], ["الغلق (3 دقائق)", "مسابقة: كل مجموعة تستخرج أكبر عدد من أمثلة الإظهار من سورة المزمل"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=25"]]}, {"no": 45, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 2, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (6-9) تلاوة صحيحة\n2. يحفظ الآيات (6-9) حفظًا متقنًا\n3. يوضح معاني: ناشئة الليل، أشد وطئًا، سبحًا طويلًا، تبتّل، وكيلًا"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (1-5)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (6-9) ومحاكاة\n- ملاحظة الإدغام بغنة في (وَطۡـٔٗا وَأَقۡوَمُ) والإخفاء في (سَبۡحٗا طَوِيلٗا)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: ناشئة الليل (العبادة في الليل)، أشد وطئًا (أثبت وأشد مواطأة للقلب)، أقوم قيلًا (أصوب قراءة)، سبحًا طويلًا (تصرفًا وتقلبًا في الأعمال)، تبتّل (انقطع إلى عبادته)، وكيلًا (كافيًا تفوض إليه أمورك)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ …﴾\nالإجابة النموذجية: ﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ أَشَدُّ وَطۡـٔٗا وَأَقۡوَمُ قِيلًا﴾\n2) (تطبيق) ما معنى (وتبتّل إليه تبتيلًا)؟\nالإجابة النموذجية: انقطع إلى عبادته انقطاعًا تامًا\n3) (استدلال) ما معنى (ناشئة الليل)؟\nالإجابة النموذجية: العبادة والقيام في الليل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا﴾.\nالإجابة النموذجية: ﴿رَّبُّ ٱلۡمَشۡرِقِ وَٱلۡمَغۡرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذۡهُ وَكِيلٗا﴾\n2) (تطبيق) لماذا كانت عبادة الليل أشد وطئًا وأقوم قيلًا؟\nالإجابة النموذجية: لأن القلب يكون فارغًا من مشاغل الدنيا فيتواطأ مع اللسان\n3) (استدلال) ما معنى (فاتخذه وكيلًا)؟\nالإجابة النموذجية: اجعله كافيك وفوّض إليه أمورك"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-9)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-9).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=26"]]}, {"no": 46, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 1, "n": 3, "wi": 2, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يتلو الآيات (10-13) تلاوة صحيحة\n2. يوضح معاني المفردات: إخوة، لا يسخر، لا تلمزوا، لا تنابزوا بالألقاب\n3. يبين أن الأخوة الإيمانية أساس المجتمع المسلم ووجوب الإصلاح بين المتخاصمين"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالصور والمواقف\nالحوار والمناقشة"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص104-107\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "وصف موقفين مصورين في الكتاب: خصام بين زميلين، وصلح بينهما"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (10-13) ومحاكاة\n- ملاحظة الإدغام بغنة في (أَن يَكُونُواْ)، والإخفاء في (مِّن ذَكَرٖ)، والإظهار الحلقي في (عَلِيمٌ خَبِيرٞ)\n\nالأخوة والإصلاح (10 دقائق):\n- ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n- المؤمنون إخوة متحابون متضامنون، والوحدة هي الأصل\n- الخلاف يعالج فور وقوعه بالسعي إلى الصلح\n- التقوى سبب للرحمة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ …﴾\nالإجابة النموذجية: ﴿إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n2) (تطبيق) ما الأساس الذي تقوم عليه علاقة المؤمنين ببعضهم؟\nالإجابة النموذجية: الأخوة الإيمانية\n3) (استدلال) ما واجب المسلمين إذا تخاصم أخوان؟\nالإجابة النموذجية: الإصلاح بينهما فورًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما ثمرة التقوى والإصلاح كما في ختام الآية (10)؟\nالإجابة النموذجية: الرحمة ﴿… لَعَلَّكُمۡ تُرۡحَمُونَ﴾\n2) (تطبيق) ما معنى (لا يسخر قوم من قوم)؟\nالإجابة النموذجية: لا يستهزئ بعضهم ببعض\n3) (استدلال) كيف تتصرف إذا رأيت زميلين متخاصمين؟\nالإجابة النموذجية: أسعى إلى الصلح بينهما بالكلمة الطيبة"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (10)"], ["الواجب المنزلي", "تدرّب على تلاوة الآيات (10-13).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 47, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 2, "n": 3, "wi": 3, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يحدد التصرفات الذميمة التي نهت عنها الآيات (السخرية، اللمز، التنابز بالألقاب، سوء الظن، التجسس، الغيبة)\n2. يوضح خطر كل منها على الأخوة\n3. يستخرج النواهي الخمسة المسبوقة بـ(لا)"], ["الاستراتيجيات", "التعلم التعاوني\nالجدول\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص107-109\nبطاقات النواهي\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "سؤال: كم مرة تكرر حرف النهي (لا) في الآيتين (11-12)؟"], ["إجراءات التنفيذ (20 دقيقة)", "النواهي (10 دقائق):\n- لا يسخر، ولا تلمزوا أنفسكم، ولا تنابزوا بالألقاب، ولا تجسسوا، ولا يغتب بعضكم بعضًا\n- اجتناب كثير من الظن\n- معاني: تلمزوا (تعيبوا)، تنابزوا (تتداعوا بالألقاب المكروهة)، تجسسوا (تتبعوا العورات)\n\nالغيبة (10 دقائق):\n- تصوير الغيبة بأكل لحم الأخ ميتًا وتنفير النفوس منها\n- حديث: «أتدرون ما الغيبة؟ ... ذكرك أخاك بما يكره»\n- توجيه نصيحة في موقف من الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج النواهي الخمسة المسبوقة بـ(لا).\nالإجابة النموذجية: لا يسخر، لا تلمزوا، لا تنابزوا، لا تجسسوا، لا يغتب\n2) (تطبيق) ما معنى (ولا تنابزوا بالألقاب)؟\nالإجابة النموذجية: لا ينادي بعضكم بعضًا بالألقاب التي يكرهها\n3) (استدلال) بمَ شبّه الله الغيبة؟\nالإجابة النموذجية: بأكل لحم الأخ وهو ميت"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الغيبة؟\nالإجابة النموذجية: ذكرك أخاك في غيابه بما يكره\n2) (تطبيق) لماذا أمر الله باجتناب كثير من الظن؟\nالإجابة النموذجية: لأن بعض الظن إثم يفسد القلوب ويقطع الأخوة\n3) (استدلال) نادى زميل زميله بلقب يكرهه، بماذا تنصحه؟\nالإجابة النموذجية: أذكّره بقوله تعالى ﴿… وَلَا تَنَابَزُواْ بِٱلۡأَلۡقَٰبِۖ …﴾ وأدعوه إلى الاعتذار"], ["الغلق (3 دقائق)", "كل مجموعة تختار نهيًا وتكتب بديله الإيجابي"], ["الواجب المنزلي", "اكتب موقفًا تطبق فيه أحد آداب الآيات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 48, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "سورة الحجرات (10-13) (تلاوة وفهم)", "k": 3, "n": 3, "wi": 4, "wn": 5, "pages": "104-110", "f": [["عنوان الدرس", "سورة الحجرات (10-13) (تلاوة وفهم)"], ["نواتج التعلم", "1. يبين الغاية من خلق الناس شعوبًا وقبائل (التعارف)\n2. يستنتج أن ميزان التفاضل عند الله هو التقوى\n3. يقوّم تعلمه في درس سورة الحجرات"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص109-110 (أقيّم تعلمي)\nخريطة العالم\nالمصحف الشريف"], ["التهيئة (5 دقائق)", "- عرض خريطة العالم: شعوب وألوان ولغات مختلفة\n- سؤال: لماذا خلقنا الله مختلفين؟"], ["إجراءات التنفيذ (20 دقيقة)", "التعارف والتقوى (10 دقائق):\n- ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ﴾\n- الغاية: التعارف والتآلف لا التنازع والشقاق\n- لا اعتبار للون ولا للجنس ولا للغة في ميزان التفاضل\n- الميزان الوحيد: التقوى\n\nأقيّم تعلمي (10 دقائق):\n- إكمال الفراغ والاختيار\n- ربط الآيات بقيم التسامح والتعايش"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الغاية من جعل الناس شعوبًا وقبائل؟\nالإجابة النموذجية: ليتعارفوا\n2) (تطبيق) ما ميزان التفاضل عند الله؟\nالإجابة النموذجية: التقوى\n3) (استدلال) أكمل: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ …﴾\nالإجابة النموذجية: ﴿يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ﴾"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل يُفضَّل الإنسان عند الله بلونه أو نسبه؟\nالإجابة النموذجية: لا، بل بتقواه\n2) (تطبيق) ما القيمة التي تدعو إليها الآية (13)؟\nالإجابة النموذجية: المساواة والتعارف ونبذ التفاخر بالأنساب\n3) (استدلال) كيف تتعامل مع زميل من بلد آخر في ضوء الآية؟\nالإجابة النموذجية: أتعارف عليه وأحترمه وأتعاون معه"], ["الغلق (3 دقائق)", "تلاوة جماعية للآيات (10-13)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=27"]]}, {"no": 49, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من فضائل الأعمال (حديث شريف)", "k": 1, "n": 2, "wi": 5, "wn": 5, "pages": "111-116", "f": [["عنوان الدرس", "من فضائل الأعمال (حديث شريف)"], ["نواتج التعلم", "1. يقرأ الحديث قراءة صحيحة ويحفظه\n2. يعرّف براوي الحديث أنس بن مالك رضي الله عنه\n3. يحدد الأعمال التي يمحو الله بها الخطايا ويرفع بها الدرجات"], ["الاستراتيجيات", "القصة\nالتكرار الموجّه\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص111-113\nبطاقة الحديث\nجهاز عرض"], ["التهيئة (5 دقائق)", "قصة الكتاب: الأب يوقظ ابنه لصلاة الفجر، والابن يتوضأ مسرعًا لبرودة الماء"], ["إجراءات التنفيذ (20 دقيقة)", "الحديث (10 دقائق):\n- «ألا أخبركم بما يمحو الله به الخطايا ويرفع به الدرجات؟ إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة، فذلكم الرباط»\n- الراوي: أنس بن مالك، خادم رسول الله ﷺ\n\nالحفظ والمعاني (10 دقائق):\n- حفظ الحديث\n- يمحو الخطايا: يغفر المعاصي\n- إسباغ الوضوء: إتمامه وإيفاء الأعضاء حقها\n- المكاره: ما تكرهه النفس كالبرد\n- الرباط: حبس النفس على الطاعات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من راوي الحديث؟\nالإجابة النموذجية: أنس بن مالك رضي الله عنه\n2) (تطبيق) ما معنى (إسباغ الوضوء على المكاره)؟\nالإجابة النموذجية: إتمام الوضوء وإيفاء الأعضاء حقها رغم المشقة كالبرد\n3) (استدلال) أكمل: «... وانتظار الصلاة بعد الصلاة ...».\nالإجابة النموذجية: فذلكم الرباط"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر الأعمال الثلاثة الواردة في الحديث.\nالإجابة النموذجية: إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة\n2) (تطبيق) ما معنى (الرباط) في الحديث؟\nالإجابة النموذجية: حبس النفس على الطاعات وملازمتها\n3) (استدلال) ماذا قال الأب لابنه حين توضأ مسرعًا؟\nالإجابة النموذجية: أسبغ وضوءك يا بني، فمن أسبغ وضوءه على المكاره له الدرجات العلا"], ["الغلق (3 دقائق)", "تسميع جماعي للحديث"], ["الواجب المنزلي", "احفظ الحديث واكتبه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=28"]]}, {"no": 50, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 3, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (10-14) تلاوة صحيحة مطبقًا الإظهار الحلقي\n2. يحفظ الآيات (10-14) حفظًا متقنًا\n3. يوضح معاني: هجرًا جميلًا، أولي النعمة، أنكالًا، ذا غصة، كثيبًا مهيلًا"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (6-9)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (10-14) ومحاكاة\n- ملاحظة الإظهار الحلقي في (عَذَابًا أَلِيمٗا) والإخفاء في (أَنكَالٗا)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: هجرًا جميلًا (هجرًا لا أذى فيه)، أولي النعمة (أصحاب الترف)، أنكالًا (قيودًا ثقيلة)، ذا غصة (يعلق في الحلق)، ترجف (تضطرب)، كثيبًا مهيلًا (رملًا متناثرًا سائلًا)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿وَٱصۡبِرۡ عَلَىٰ مَا …﴾\nالإجابة النموذجية: ﴿وَٱصۡبِرۡ عَلَىٰ مَا يَقُولُونَ وَٱهۡجُرۡهُمۡ هَجۡرٗا جَمِيلٗا﴾\n2) (تطبيق) ما معنى (هجرًا جميلًا)؟\nالإجابة النموذجية: هجرًا لا أذى فيه ولا عتاب\n3) (استدلال) ما حكم التنوين في (عَذَابًا أَلِيمٗا)؟\nالإجابة النموذجية: إظهار حلقي لأن بعده الهمزة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿إِنَّ لَدَيۡنَآ أَنكَالٗا وَجَحِيمٗا﴾.\nالإجابة النموذجية: ﴿وَطَعَامٗا ذَا غُصَّةٖ وَعَذَابًا أَلِيمٗا﴾\n2) (تطبيق) ما معنى (كثيبًا مهيلًا)؟\nالإجابة النموذجية: رملًا متناثرًا سائلًا\n3) (استدلال) ما الذي أمر الله نبيه به تجاه أذى المكذبين في الآية (10)؟\nالإجابة النموذجية: الصبر على قولهم وهجرهم هجرًا جميلًا"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (1-14)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-14).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=29"]]}, {"no": 51, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من فضائل الأعمال (حديث شريف)", "k": 2, "n": 2, "wi": 2, "wn": 5, "pages": "111-116", "f": [["عنوان الدرس", "من فضائل الأعمال (حديث شريف)"], ["نواتج التعلم", "1. يوضح أثر الأعمال الواردة في الحديث في حياة المسلم\n2. يستنتج وجه الشبه بين الرباط في سبيل الله والمواظبة على الطاعات\n3. يحكم على مواقف في ضوء الحديث"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص113-116\nبطاقات مواقف\nالسبورة"], ["التهيئة (5 دقائق)", "- تسميع الحديث\n- تذكير بقصة يوسف الجار المعلق قلبه بالمسجد"], ["إجراءات التنفيذ (20 دقيقة)", "الأثر ووجه الشبه (10 دقائق):\n- الأعمال ترفع الدرجات وتمحو الخطايا\n- وجه الشبه بين الرباط وانتظار الصلاة: ملازمة الموضع وحبس النفس على الطاعة\n- كتابة الأعمال التي ترفع الدرجات كما في الحديث\n\nالحكم على المواقف (10 دقائق):\n- مواقف الكتاب: من يصر على الذهاب للمسجد رغم المطر، من يتوضأ مسرعًا لا يتم أعضاءه، من يجلس بعد الصلاة يذكر الله\n- أقيّم تعلمي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما وجه الشبه بين الرباط في سبيل الله وانتظار الصلاة بعد الصلاة؟\nالإجابة النموذجية: كلاهما ملازمة وحبس للنفس على طاعة الله\n2) (تطبيق) احكم: طالب يتوضأ بسرعة ولا يغسل أعضاءه كاملة لبرودة الماء.\nالإجابة النموذجية: تصرف خاطئ، والصواب إسباغ الوضوء على المكاره ليرفع الله درجته\n3) (استدلال) اذكر عملًا من الحديث يمكنك القيام به يوميًا.\nالإجابة النموذجية: كثرة الخطا إلى المساجد (أو انتظار الصلاة بعد الصلاة)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما ثواب من يكثر الخطا إلى المساجد؟\nالإجابة النموذجية: يرفع الله له بكل خطوة درجة ويحط عنه خطيئة\n2) (تطبيق) صحح: انتظار الصلاة بعد الصلاة من الأعمال المكروهة.\nالإجابة النموذجية: من الأعمال الفاضلة التي يرفع الله بها الدرجات\n3) (استدلال) خطط لثلاثة أيام تطبق فيها الحديث.\nالإجابة النموذجية: خطة واقعية تتضمن الأعمال الثلاثة"], ["الغلق (3 دقائق)", "كل طالب يكتب عملًا من الحديث سيبدأ به اليوم"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=30"]]}, {"no": 52, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "الله الحليم", "k": 1, "n": 1, "wi": 3, "wn": 5, "pages": "117-121", "f": [["عنوان الدرس", "الله الحليم"], ["نواتج التعلم", "1. يتعرف معنى اسم الله (الحليم)\n2. يستدل على حلم الله تعالى من القرآن الكريم\n3. يفرق بين حلم الله وحلم المخلوق"], ["الاستراتيجيات", "التدبر\nالحوار والمناقشة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص117-121\nالمصحف الشريف\nبطاقات أسماء الله الحسنى"], ["التهيئة (5 دقائق)", "تذكر أسماء الله الحسنى التي دُرست سابقًا ووضع دائرة حولها في نشاط الكتاب"], ["إجراءات التنفيذ (20 دقيقة)", "المعنى والدليل (10 دقائق):\n- الله متصف بصفات الكمال منزه عن كل نقص: ﴿وَلِلَّهِ ٱلۡأَسۡمَآءُ ٱلۡحُسۡنَىٰ فَٱدۡعُوهُ بِهَاۖ …﴾\n- الحليم: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب\n- ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ وَلَٰكِن يُؤَخِّرُهُمۡ إِلَىٰٓ أَجَلٖ مُّسَمّٗىۖ …﴾\n\nحلم المخلوق والتطبيق (10 دقائق):\n- الله ليس كمثله شيء، فحلم المخلوق ليس كحلم الله، وحلم المخلوق يتغير بالأسباب\n- قول القرطبي: من عرف أن ربه حليم فأولى أن يحلم على من خالفه\n- موقف: أخ صغير أتلف مجسم مشروع أحمد، كيف يطبق الحلم؟"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما معنى اسم الله (الحليم)؟\nالإجابة النموذجية: الذي لا يعجّل بالعقوبة على من عصاه بل يمهله ليتوب\n2) (تطبيق) استدل من القرآن على حلم الله.\nالإجابة النموذجية: ﴿وَلَوۡ يُؤَاخِذُ ٱللَّهُ ٱلنَّاسَ بِظُلۡمِهِم مَّا تَرَكَ عَلَيۡهَا مِن دَآبَّةٖ …﴾\n3) (استدلال) ما الفرق بين حلم الله وحلم المخلوق؟\nالإجابة النموذجية: حلم الله كامل لا يتغير، وحلم المخلوق ناقص يتغير بالأسباب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف تطبق صفة الحلم إذا أتلف أخوك الصغير مشروعك؟\nالإجابة النموذجية: أضبط غضبي وأعفو عنه وأعلّمه بهدوء، ثم أصلح المشروع\n2) (تطبيق) ما واجب من عرف أن ربه حليم؟\nالإجابة النموذجية: أن يتوب إليه ولا يغتر بإمهاله، وأن يحلم على من أساء إليه\n3) (استدلال) اذكر اسمين آخرين من أسماء الله الحسنى درستهما.\nالإجابة النموذجية: الرحمن، الرحيم (تقبل الأسماء الصحيحة)"], ["الغلق (3 دقائق)", "دعاء: يا حليم اغفر لنا وتجاوز عنا"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=31"]]}, {"no": 53, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "من أحكام صلاة الجمعة", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "122-127", "f": [["عنوان الدرس", "من أحكام صلاة الجمعة"], ["نواتج التعلم", "1. يبين فضل يوم الجمعة\n2. يوضح حكم صلاة الجمعة وعلى من تجب\n3. يصف كيفية أداء صلاة الجمعة وخطبتيها"], ["الاستراتيجيات", "الحوار والمناقشة\nالخريطة الذهنية\nالتدبر"], ["مصادر التعلم", "كتاب الطالب ص122-124\nالمصحف الشريف\nجهاز عرض"], ["التهيئة (5 دقائق)", "سؤال: ما الذي يميز يوم الجمعة في أسرتك؟"], ["إجراءات التنفيذ (20 دقيقة)", "الفضل والحكم (10 دقائق):\n- «خير يوم طلعت عليه الشمس يوم الجمعة»\n- حكمها: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها\n- الدليل: آية الجمعة: الأمر بالسعي إلى ذكر الله وترك البيع\n- يجوز للمرأة أن تصليها في المسجد ولا تجب عليها\n- «من ترك ثلاث جمع تهاونًا بها طبع الله على قلبه»\n\nالكيفية (10 دقائق):\n- ركعتان في وقت الظهر تتقدمهما خطبتان بينهما جلسة خفيفة\n- يدخل الإمام ويصعد المنبر ويسلم على المأمومين ثم يجلس حتى يفرغ المؤذن\n- يخطب، ويدعو في الثانية لنفسه وللمسلمين\n- يقيم المؤذن وينزل الخطيب فيصلي بهم ركعتين يجهر فيهما بالقراءة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما حكم صلاة الجمعة؟\nالإجابة النموذجية: فرض عين على كل رجل مسلم بالغ عاقل مقيم قادر على السعي إليها\n2) (تطبيق) هل تجب صلاة الجمعة على المرأة؟\nالإجابة النموذجية: لا تجب عليها ويجوز لها أداؤها في المسجد\n3) (استدلال) كم ركعة صلاة الجمعة؟\nالإجابة النموذجية: رك يم الختامي (7 دقائق)", "1) (معرفة) احكم: مصلٍّ يتخطى الرقاب ليصل إلى الصف الأول.\nالإجابة النموذجية: تصرف خاطئ، والصواب أن يجلس حيث انتهى به المجلس دون أذى\n2) (تطبيق) لماذا يُستحب التبكير إلى صلاة الجمعة؟\nالإجابة النموذجية: لنيل الأجر العظيم والصف الأول والاستعداد للخطبة\n3) (استدلال) صمم بطاقة تذكير بآداب يوم الجمعة لأسرتك.\nالإجابة النموذجية: بطاقة تضم أربع سنن على الأقل"], ["الغلق (3 دقائق)", "كل طالب يذكر سنة سيحرص عليها الجمعة القادمة"], ["الواجب المنزلي", "طبّق سنن الجمعة واكتب ما قمت به.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=32"]]}, {"no": 55, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "مقرر التلاوة والحفظ", "title": "سورة المزمل (تلاوة وحفظ)", "k": 4, "n": 7, "wi": 1, "wn": 5, "pages": "14-16", "f": [["عنوان الدرس", "سورة المزمل (تلاوة وحفظ)"], ["نواتج التعلم", "1. يتلو الآيات (15-19) تلاوة صحيحة\n2. يحفظ الآيات (15-19) حفظًا متقنًا\n3. يوضح معاني: أخذًا وبيلًا، شيبًا، منفطر به، تذكرة"], ["الاستراتيجيات", "التلاوة النموذجية والمحاكاة\nالتكرار الموجّه\nالتسميع الثنائي"], ["مصادر التعلم", "المصحف الشريف\nكتاب الطالب ص15-16\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "تسميع الآيات (10-14)"], ["إجراءات التنفيذ (20 دقيقة)", "التلاوة (10 دقائق):\n- تلاوة نموذجية للآيات (15-19) ومحاكاة\n- ملاحظة الإدغام بغنة في (يَوۡمٗا يَجۡعَلُ) والإخفاء في (إِن كَفَرۡتُمۡ)\n\nالحفظ والمعاني (10 دقائق):\n- حفظ مقطعي\n- معاني: أخذًا وبيلًا (شديدًا ثقيلًا)، شيبًا (شيوخًا من شدة الهول)، منفطر به (متشقق بسبب هوله)، تذكرة (موعظة)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل: ﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ …﴾\nالإجابة النموذجية: ﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ يَوۡمٗا يَجۡعَلُ ٱلۡوِلۡدَٰنَ شِيبًا﴾\n2) (تطبيق) ما معنى (أخذًا وبيلًا)؟\nالإجابة النموذجية: أخذًا شديدًا ثقيلًا\n3) (استدلال) إلى من أُرسل الرسول المذكور في الآية (15)؟\nالإجابة النموذجية: إلى فرعون"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اتلُ الآية التي تلي ﴿ٱلسَّمَآءُ مُنفَطِرُۢ بِهِۦۚ كَانَ وَعۡدُهُۥ مَفۡعُولًا﴾.\nالإجابة النموذجية: ﴿إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا﴾\n2) (تطبيق) ما معنى (يجعل الولدان شيبًا)؟\nالإجابة النموذجية: يجعل الصغار شيوخًا من شدة هوله\n3) (استدلال) ما حكم التنوين في (يَوۡمٗا يَجۡعَلُ)؟\nالإجابة النموذجية: إدغام بغنة لأن بعده الياء"], ["الغلق (3 دقائق)", "تسميع جماعي للآيات (10-19)"], ["الواجب المنزلي", "راجع حفظ الآيات (1-19).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=33"]]}, {"no": 56, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "بناء المسجد", "k": 1, "n": 2, "wi": 2, "wn": 5, "pages": "128-133", "f": [["عنوان الدرس", "بناء المسجد"], ["نواتج التعلم", "1. يسرد أحداث وصول النبي ﷺ إلى المدينة ونزوله بقباء\n2. يذكر أول مسجد في الإسلام\n3. يستنتج حكمة النبي ﷺ في قوله: «خلوا سبيلها فإنها مأمورة»"], ["الاستراتيجيات", "القصة\nالخط الزمني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص128-130\nصور حديثة لمسجد قباء والمسجد النبوي\nخريطة المدينة"], ["التهيئة (5 دقائق)", "- صور مسجد قباء والمسجد النبوي\n- سؤال: هل تعرف قصة بنائهما؟"], ["إجراءات التنفيذ (20 دقيقة)", "الوصول (10 دقائق):\n- وصل النبي ﷺ المدينة يوم الاثنين الثاني عشر من ربيع الأول بعد ثلاثة عشر عامًا من بعثته\n- نزل في ضاحية قباء بضعة أيام ووضع أساس أول مسجد في الإسلام: مسجد قباء\n\nالناقة المأمورة (10 دقائق):\n- كلما مر بقبيلة من الأنصار سألوه النزول فيقول: «خلوا سبيلها فإنها مأمورة»\n- الحكمة: ألا تشعر عشيرة بإيثار غيرها فترضى النفوس\n- بركت في أرض لبني النجار فاشتراها وبنى فيها مسجده وحجرات نسائه، ونزل ضيفًا على أبي أيوب الأنصاري"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما أول مسجد بُني في الإسلام؟\nالإجابة النموذجية: مسجد قباء\n2) (تطبيق) متى وصل النبي ﷺ المدينة؟\nالإجابة النموذجية: يوم الاثنين الثاني عشر من ربيع الأول\n3) (استدلال) ما الحكمة من قوله ﷺ: «خلوا سبيلها فإنها مأمورة»؟\nالإجابة النموذجية: ألا تشعر قبيلة من الأنصار بتفضيل غيرها عليها فترضى النفوس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أين بركت الناقة؟\nالإجابة النموذجية: في أرض لبني النجار\n2) (تطبيق) عند من نزل النبي ﷺ ضيفًا أثناء البناء؟\nالإجابة النموذجية: أبي أيوب الأنصاري\n3) (استدلال) ماذا بنى النبي ﷺ في الأرض التي اشتراها؟\nالإجابة النموذجية: مسجده وحجرات نسائه"], ["الغلق (3 دقائق)", "خط زمني جماعي لأحداث الوصول"], ["الواجب المنزلي", "ابحث عن صورة حديثة للمسجد النبوي ومسجد قباء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=34"]]}, {"no": 57, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "بناء المسجد", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "128-133", "f": [["عنوان الدرس", "بناء المسجد"], ["نواتج التعلم", "1. يصف مشاركة المهاجرين والأنصار في بناء المسجد\n2. يستنتج أدوار المسجد في المجتمع الإسلامي\n3. يستخلص القيم من بناء المسجد النبوي"], ["الاستراتيجيات", "التعلم التعاوني\nالاستنتاج من الصور\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص130-133\nرسوم أدوار المسجد\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ماذا نفعل في مسجد حيّنا غير الصلاة؟"], ["إجراءات التنفيذ (20 دقيقة)", "البناء والأدوار (10 دقائق):\n- مشاركة المهاجرين والأنصار بهمة عالية مرددين الأشعار التي تخفف المشقة\n- النبي ﷺ يعمل بنفسه معهم\n- أدوار المسجد: مكان للصلاة بحرية، جامعة للعلم، منتدى لتآلف النفوس، قاعدة لإدارة شؤون الدولة\n\nالقيم (10 دقائق):\n- التعاون، والقدوة الحسنة، والمساواة، والعمل الجماعي، وحب المسجد\n- تأمل رسوم الكتاب واستنتاج أدوار المسجد قديمًا وحديثًا\n- أقيّم تعلمي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من شارك في بناء المسجد النبوي؟\nالإجابة النموذجية: المهاجرون والأنصار مع النبي ﷺ\n2) (تطبيق) اذكر دورين للمسجد في عهد النبي ﷺ.\nالإجابة النموذجية: مكان لأداء الصلاة، وجامعة يتلقى فيها المسلمون العلم (أو منتدى للتآلف، قاعدة لإدارة الشؤون)\n3) (استدلال) استخلص قيمة من مشاركة النبي ﷺ في البناء.\nالإجابة النموذجية: التواضع والقدوة الحسنة والعمل الجماعي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) لماذا كان بناء المسجد أول عمل في المدينة؟\nالإجابة النموذجية: لأنه مركز توحيد المسلمين وعبادتهم وتعليمهم وإدارة شؤونهم\n2) (تطبيق) كيف كان المسلمون يصلون قبل بناء المسجد؟\nالإجابة النموذجية: بعيدًا عن أعين الناس في الشعاب والأودية أو خفية في البيوت\n3) (استدلال) اذكر دورًا للمسجد في حيّك اليوم.\nالإجابة النموذجية: تحفيظ القرآن أو الدروس الدينية أو تجمع أهل الحي (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "كل مجموعة تكتب واجبًا نحو المسجد"], ["الواجب المنزلي", "حل أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=34"]]}, {"no": 58, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "ألتزم الحق", "k": 1, "n": 2, "wi": 4, "wn": 5, "pages": "134-139", "f": [["عنوان الدرس", "ألتزم الحق"], ["نواتج التعلم", "1. يعرّف الحق ويذكر معانيه في القرآن (العدل، الصدق، الحقيقة، الاستقامة)\n2. يحدد مصادر الحق\n3. يبين أن المؤمن يقبل الحق من أي مصدر"], ["الاستراتيجيات", "القصة\nحل المشكلات\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص134-137\nبطاقات مواقف\nجهاز عرض"], ["التهيئة (5 دقائق)", "موقف حسن وصديقه فارس المخطئ: هل يؤيد صديقه أم يصارحه بخطئه؟"], ["إجراءات التنفيذ (20 دقيقة)", "المفهوم والمصادر (10 دقائق):\n- الحق من المبادئ العليا في الإسلام ونقيض الباطل، ومن معانيه: العدل والصدق والحقيقة والاستقامة\n- مصادره: القرآن الكريم، والأنبياء والرسل الذين لا ينطقون إلا بالحق عن طريق الوحي، والفطرة السليمة التي تقبل الحق وترفض الباطل\n\nقبول الحق (10 دقائق):\n- الحق مرتبط بكل فضيلة وخير، والباطل بكل قبيح\n- المؤمن الصادق يقبل الحق لذاته لا لقائله\n- تحليل موقف حسن: التصرف الصحيح أن يصارح صديقه بخطئه بلطف ويقف مع الحق"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الحق؟\nالإجابة النموذجية: ما وافق الصدق والعدل والحقيقة، وهو نقيض الباطل\n2) (تطبيق) اذكر مصدرين للحق.\nالإجابة النموذجية: القرآن الكريم، والفطرة السليمة (أو الأنبياء والرسل)\n3) (استدلال) ما التصرف الصحيح الذي ينبغي أن يقوم به حسن؟\nالإجابة النموذجية: أن يصارح صديقه بخطئه بلطف ولا يؤيده على الباطل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما سبب الحيرة التي وقع فيها حسن؟\nالإجابة النموذجية: تعارض صداقته لفارس مع معرفته أن فارسًا مخطئ\n2) (تطبيق) هل يقبل المؤمن الحق إذا جاء من شخص لا يحبه؟ ولماذا؟\nالإجابة النموذجية: نعم، لأن المقصود الحق لذاته لا لقائله\n3) (استدلال) صنّف: (الصدق، الظلم، العدل، الغش).\nالإجابة النموذجية: الحق: الصدق والعدل، الباطل: الظلم والغش"], ["الغلق (3 دقائق)", "عبارة الدرس: الحق أحق أن يُتبع"], ["الواجب المنزلي", "اكتب موقفًا التزمت فيه بالحق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=35"]]}, {"no": 59, "w": 12, "wl": "الثاني عشر", "date": "22-26 نوفمبر 2026م", "unit": "الوحدة الثالثة", "title": "ألتزم الحق", "k": 2, "n": 2, "wi": 5, "wn": 5, "pages": "134-139", "f": [["عنوان الدرس", "ألتزم الحق"], ["نواتج التعلم", "1. يصنف السلوكيات إلى ما يقترن بالحق وما يقترن بالباطل\n2. يقترح طرقًا للالتزام بالحق في حياته اليومية\n3. يقوّم تعلمه في درس ألتزم الحق"], ["الاستراتيجيات", "التصنيف\nلعب الأدوار\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص137-139 (أقيّم تعلمي)\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "لعبة: المعلم يقرأ سلوكًا والطلبة يرفعون بطاقة (حق) أو (باطل)"], ["إجراءات التنفيذ (20 دقيقة)", "التصنيف (10 دقائق):\n- تصنيف الكلمات مع ما تقترن به في نشاط الكتاب\n- مناقشة آثار الالتزام بالحق على الفرد والمجتمع: الثقة، الأمن، الطمأنينة، رضا الله\n\nلعب الأدوار (10 دقائق):\n- مواقف: الشهادة بالحق في خلاف بين زميلين، الاعتراف بالخطأ أمام المعلم، رد شيء وُجد في الساحة\n- أقيّم تعلمي: تصحيح العبارات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) صنّف: (الاعتراف بالخطأ).\nالإجابة النموذجية: يقترن بالحق\n2) (تطبيق) اذكر أثرين للالتزام بالحق في المجتمع.\nالإجابة النموذجية: انتشار الثقة، وتحقيق العدل والأمن\n3) (استدلال) ماذا تفعل إذا رأيت زميلًا يُتهم ظلمًا وأنت تعرف الحقيقة؟\nالإجابة النموذجية: أشهد بالحق وأبيّن الحقيقة بأدب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صحح: الحق يُقبل حسب قائله.\nالإجابة النموذجية: الحق يُقبل لذاته أيًّا كان قائله\n2) (تطبيق) اقترح طريقتين للالتزام بالحق في المدرسة.\nالإجابة النموذجية: الصدق في القول، والعدل في الحكم بين الزملاء (أو الاعتراف بالخطأ)\n3) (استدلال) لماذا ترتبط الفطرة السليمة بالحق؟\nالإجابة النموذجية: لأن الله خلق الناس على فطرة تقب نة؟\nالإجابة النموذجية: اللام والراء"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الغنة؟ وما مقدارها؟\nالإجابة النموذجية: صوت له رنين يخرج من الخيشوم، مقداره حركتان\n2) (تطبيق) حدد نوع الإدغام في (لَوَّاحَةٞ لِّلۡبَشَرِ).\nالإجابة النموذجية: إدغام بغير غنة لأن بعد التنوين اللام\n3) (استدلال) حدد نوع الإدغام في (حُمُرٞ مُّسۡتَنفِرَةٞ).\nالإجابة النموذجية: إدغام بغنة لأن بعد التنوين الميم"], ["الغلق (3 دقائق)", "ترديد: يرملون، ينمو، لر"], ["الواجب المنزلي", "احفظ حروف الإدغام بنوعيه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=37"]]}, {"no": 62, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "الإدغام في النون الساكنة والتنوين", "k": 2, "n": 2, "wi": 3, "wn": 5, "pages": "141-145", "f": [["عنوان الدرس", "الإدغام في النون الساكنة والتنوين"], ["نواتج التعلم", "1. يبين شرط الإدغام (أن يكون في كلمتين) والإظهار المطلق في كلمة واحدة\n2. يستخرج أمثلة للإدغام من سورتي المدثر والمزمل\n3. يقارن بين الإدغام في الميم الساكنة والإدغام في النون الساكنة والتنوين"], ["الاستراتيجيات", "التلاوة والمحاكاة\nالجدول المقارن\nالمسابقة"], ["مصادر التعلم", "كتاب الطالب ص143-145\nالمصحف الشريف\nالمكتبة الصوتية"], ["التهيئة (5 دقائق)", "- كلمات: (الدنيا، بنيان، صنوان، قنوان)\n- سؤال: النون الساكنة قبل الياء والواو فلماذا لا ندغم؟"], ["إجراءات التنفيذ (20 دقيقة)", "الشرط (10 دقائق):\n- لا يأتي الإدغام في النون الساكنة والتنوين إلا في كلمتين\n- إذا اجتمعت النون الساكنة مع الياء أو الواو في كلمة واحدة وجب الإظهار (الإظهار المطلق) كما في: الدنيا، بنيان، صنوان، قنوان\n- الميم المشددة والنون المشددة حرفا غنة\n\nالاستخراج والمقارنة (10 دقائق):\n- استخراج أمثلة: (يَوۡمَئِذٖ يَوۡمٌ)، (مَالٗا مَّمۡدُودٗا)، (أَن يُؤۡتَىٰ)، (وَطۡـٔٗا وَأَقۡوَمُ)، (لَوَّاحَةٞ لِّلۡبَشَرِ)\n- جدول: الإدغام الشفوي (ميم ساكنة بعدها ميم) / الإدغام في النون (حروف يرملون في كلمتين)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما شرط الإدغام في النون الساكنة والتنوين؟\nالإجابة النموذجية: أن يكون في كلمتين\n2) (تطبيق) لماذا لا تُ ", "1) (معرفة) ما معنى (يضربون في الأرض)؟\nالإجابة النموذجية: يسعون في البلاد للتجارة وطلب الرزق\n2) (تطبيق) اذكر الأعذار التي ذكرتها الآية.\nالإجابة النموذجية: المرض، والسفر للتجارة، والقتال في سبيل الله\n3) (استدلال) ما مظهر التخفيف في الآية؟\nالإجابة النموذجية: جعل قيام الليل تطوعًا لا فريضة وقراءة ما تيسر من القرآن"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (وأقرضوا الله قرضًا حسنًا)؟\nالإجابة النموذجية: تصدقوا في وجوه الخير طيبة بها نفوسكم\n2) (تطبيق) استخرج من الآية ما يدل على يسر الإسلام.\nالإجابة النموذجية: ﴿… فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ …﴾\n3) (استدلال) لماذا كان خير أوقات العبادة جوف الليل؟\nالإجابة النموذجية: لفراغ القلب من مشاغل الدنيا"], ["الغلق (3 دقائق)", "تلاوة جماعية للآية (20)"], ["الواجب المنزلي", "تدرّب على تلاوة الآية (20).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/islamic/?l=38"]]}, {"no": 64, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "الوحدة الرابعة", "title": "سورة المزمل الآية (20) (تلاوة وفهم)", "k": 2, "n": 3, "wi": 5, "wn": 5, "pages": "146-153", "f": [["عنوان الدرس", "سورة المزمل الآية (20) (تلاوة وفهم)"], ["نواتج التعلم", "1. يستخرج من الآية الأوامر التي وجهت إليها (الصلاة، الزكاة، القرض الحسن، الاستغفار)\n2. يبين أن الله يجازي على العمل الصالح بالأجر المضاعف\n3. يربط الآية بمعاني سورة المزمل كاملة"], ["الاستراتيجيات", "التعلم التعاوني\nالتدبر\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص149-152\nالمصحف الشريف\nبطاقات المعاني"], ["التهيئة (5 دقائق)", "سؤال: ما الفريضتان اللتان تقترن إحداهما بالأخرى في القرآن غالبًا؟"], ["إجراءات التنفيذ (20 دقيقة)", "الأوامر (10 دقائق):\n- ﴿… وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَ وَأَقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗاۚ …﴾\n- الفريضتان: الصلاة والزكاة\n- ﴿… وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيۡرٗا وَأَعۡظَمَ أَجۡرٗاۚ …﴾\n- ختام الآية بالأمر بالاستغفار\n\nالربط بالسورة (10 دقائق):\nاستخراج الآيات التي تشير إلى معاني الكتاب: عظمة القرآن (القول الثقيل)، فضل قيام الليل، انصراف
