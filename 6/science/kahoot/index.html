<style>
@font-face{font-family:'Taj';src:url(/assets/f/6231d7c967bf36a7.ttf) format('truetype');font-weight:400;}
@font-face{font-family:'Taj';src:url(/assets/f/3028c3b3afa120de.ttf) format('truetype');font-weight:700;}
@font-face{font-family:'Taj';src:url(/assets/f/88694df4bd9ac5e3.ttf) format('truetype');font-weight:800;}
:root{--bg1:#f4faf8;--bg2:#eef4fb;--ink:#29363b;--muted:#6b7f7c;--teal:#3f8f84;--teal2:#2e6b62;--line:#dbe8e4;--card:#ffffffd9;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Taj',Tahoma,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 85% -10%,#e3f3ee 0,transparent 60%),radial-gradient(900px 600px at 0% 110%,#e8eefb 0,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.45;z-index:0;animation:float 18s ease-in-out infinite}
.b1{width:340px;height:340px;background:#d6efe7;top:-80px;left:-60px}
.b2{width:280px;height:280px;background:#e4e2f7;bottom:-70px;right:-50px;animation-delay:-6s}
.b3{width:200px;height:200px;background:#fbeed8;top:40%;left:55%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-24px)}}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 18px 30px;min-height:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand{font-weight:800;color:var(--teal2);font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#7cc6b8,#9fb7ea);box-shadow:0 0 0 4px #e3f3ee}
.iconbtn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;color:var(--teal2);font-weight:700}
.screen{display:none;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:0 10px 30px rgba(60,100,95,.08)}
h2{margin:0 0 4px;font-size:1.5rem;color:var(--teal2)}
.lead{color:var(--muted);margin:0 0 14px}
.step{margin:14px 0}
.step .lbl{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.step .lbl i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#e7f4f0;color:var(--teal2);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
select,input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;transition:.2s;color:#4b6b66}
.pill.on{background:#e7f4f0;border-color:#a9d6ca;color:var(--teal2);font-weight:800}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.names .nm{display:flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:50%;flex:0 0 16px}
.range{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:#5aa99c}
.cnt{min-width:46px;text-align:center;font-weight:800;font-size:1.3rem;color:var(--teal2)}
.go{font:inherit;font-weight:800;font-size:1.15rem;border:0;border-radius:16px;padding:12px 26px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6fbcae,#7f9fe0);box-shadow:0 8px 20px rgba(95,150,170,.3);transition:transform .15s}
.go:active{transform:scale(.97)}
.go.soft{background:#fff;color:var(--teal2);border:1px solid var(--line);box-shadow:none}
.note{font-size:.88rem;color:var(--muted)}
/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.prog{flex:1;min-width:200px}
.prog .tx{font-size:.9rem;color:var(--muted);margin-bottom:4px}
.track{height:8px;background:#e6efed;border-radius:99px;overflow:hidden}
.track span{display:block;height:100%;background:linear-gradient(90deg,#7cc6b8,#9fb7ea);width:0;transition:width .6s ease}
.turn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.turn .chip{font:inherit;border:2px solid transparent;border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;color:#4b5b5f;font-weight:700;opacity:.55;transition:.25s}
.turn .chip.on{opacity:1;transform:scale(1.06);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.qgrid{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:start}
.timer{position:relative;width:160px;height:160px;margin:auto}
.timer svg{transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:2.4rem;color:var(--teal2)}
.timer .num small{font-size:.8rem;color:var(--muted);font-weight:700}
.timer .pts{font-size:.9rem;color:#7a5a1e}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.qtype{display:inline-block;font-size:.8rem;font-weight:800;color:#56458a;background:#f1edfb;border-radius:99px;padding:2px 12px;margin-bottom:6px}
.qtext{font-size:1.55rem;font-weight:800;line-height:1.6;margin:4px 0 14px}
.qtext .blank{display:inline-block;min-width:90px;border-bottom:3px dashed #9fb7ea;margin:0 6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;text-align:right;font-size:1.2rem;font-weight:700;border:2px solid #e3ecea;background:#fbfdfc;border-radius:18px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .15s,background .3s,border-color .3s}
.opt:hover{transform:translateY(-2px);border-color:#bfe0d6}
.opt .k{width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;color:#fff}
.opt.right{background:#e6f6ea;border-color:#8fd0a0}
.opt.wrong{background:#fdecee;border-color:#eeb1bb}
.opt.dim{opacity:.45}
.opts.tf{grid-template-columns:1fr 1fr}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.feedback{font-weight:800;font-size:1.15rem;min-height:1.6em}
/* chart */
.chart{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:300px;padding:10px 6px 0;border-bottom:2px solid #e3ecea;margin:6px 0 8px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:110px;transition:order .3s}
.bar{width:76px;border-radius:16px 16px 6px 6px;height:4px;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative;box-shadow:inset 0 -10px 18px rgba(255,255,255,.35)}
.bar.win{box-shadow:0 0 0 4px #fff,0 0 0 7px #f3d58a,inset 0 -10px 18px rgba(255,255,255,.35)}
.val{font-weight:800;margin-bottom:4px;color:var(--teal2)}
.gname{margin-top:6px;font-weight:800;text-align:center;font-size:.95rem}
.rank{font-size:.8rem;color:var(--muted)}
.plus{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff7e3;color:#7a5a1e;border:1px solid #f0dfb5;border-radius:99px;padding:0 8px;font-weight:800;font-size:.85rem;white-space:nowrap;animation:pop .6s ease}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:330px;margin:20px 0 6px}
.pd{display:flex;flex-direction:column;align-items:center;width:150px}
.pd .blk{width:100%;border-radius:18px 18px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:2rem;font-weight:800;color:#fff;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.pd .who{font-weight:800;font-size:1.1rem;margin-bottom:4px;opacity:0;transition:opacity .6s .9s}
.pd .sc{color:var(--muted);font-weight:700;opacity:0;transition:opacity .6s 1s}
.pd.show .who,.pd.show .sc{opacity:1}
.medal{font-size:2rem;opacity:0;transform:scale(.4);transition:.6s 1.1s}
.pd.show .medal{opacity:1;transform:none}
.rest{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media(max-width:760px){.qgrid{grid-template-columns:1fr}.timer{width:130px;height:130px}.qtext{font-size:1.25rem}.opts{grid-template-columns:1fr}.opt{font-size:1.05rem}.col{width:70px}.bar{width:48px}.chart{gap:8px;height:240px}.pd{width:100px}}
</style>
</head>

<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>مسابقات كاهوت · العلوم للصف السادس</div>
    <div style="display:flex;gap:6px"><button class="iconbtn" id="muteBtn">🔊 الصوت</button><button class="iconbtn" id="homeBtn" style="display:none">↺ البداية</button></div>
  </div>

  <!-- setup -->
  <section class="screen on" id="sSetup">
    <div class="panel">
      <h2>لنختم الحصة بتحدٍّ ممتع</h2>
      <p class="lead">اختر الدرس ومحور الحصة، وحدد المجموعات وعدد الأسئلة، ثم ابدأ.</p>
      <div class="step"><div class="lbl"><i>1</i>الدرس</div><select id="selLesson"></select></div>

        <div class="pills" id="grpPills" style="margin-bottom:10px"></div>
        <div class="names" id="names"></div></div>
      <div class="step"><div class="lbl"><i>4</i>عدد الأسئلة</div>
        <div class="range"><input type="range" id="qRange" min="1" max="20" value="10"><span class="cnt" id="qCnt">10</span></div>
        <div class="pills" id="quick" style="margin-top:8px"></div>
        <div class="note" id="avail"></div></div>
      <div style="display:flex;justify-content:flex-start;margin-top:14px"><button class="go" id="startBtn">ابدأ المسابقة ←</button></div>
    </div>
  </section>

  <!-- question -->
  <section class="screen" id="sQ">
    <div class="qhead">
      <div class="prog"><div class="tx" id="progTx"></div><div class="track"><span id="progBar"></span></div></div>
      <div class="turn"><span class="note">تجيب الآن:</span><span id="turnChips" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
    </div>
    <div class="qgrid">
      <div>
        <div class="timer"><svg width="100%" height="100%" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="#e6efed" stroke-width="10" fill="none"/><circle id="ring" cx="60" cy="60" r="52" stroke="#7cc6b8" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" style="transition:stroke-dashoffset .25s linear,stroke .4s"/></svg>
          <div class="num"><span id="tNum">30</span><small id="tLbl">ثانية</small><span class="pts" id="tPts"></span></div></div>
      </div>
      <div class="qcard">
        <span class="qtype" id="qType"></span>
        <div class="qtext" id="qText"></div>
        <div class="opts" id="opts"></div>
        <div class="qfoot"><div class="feedback" id="fb"></div>
          <div style="display:flex;gap:8px"><button class="go soft" id="skipBtn">لم تُجب المجموعة</button><button class="go" id="nextBtn" style="display:none">النتائج ←</button></div></div>
      </div>
    </div>
  </section>

  <!-- scores -->
  <section class="screen" id="sScore">
    <div class="panel">
      <h2 id="scTitle">ترتيب المجموعات</h2>
      <p class="lead" id="scLead"></p>
      <div class="chart" id="chart"></div>
      <div style="display:flex;justify-content:flex-start"><button class="go" id="contBtn">السؤال التالي ←</button></div>
    </div>
  </section>

  <!-- final -->
  <section class="screen" id="sEnd">
    <div class="panel" style="text-align:center">
      <h2>منصة التتويج</h2>
      <p class="lead">أحسنتم جميعًا! هذه نتيجة المسابقة.</p>
      <div class="podium" id="podium"></div>
      <div class="rest" id="rest"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center"><button class="go" id="againBtn">مسابقة جديدة</button></div>
    </div>
  </section>
</div>

const COLORS=['#7cc6b8','#9fb7ea','#f2b8a2','#c8b6ea','#f0cf86','#9fd3a8'];
const DEFN=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'];
const TYPES={mc:'اختيار من متعدد',tf:'صواب أم خطأ',fill:'أكمل الفراغ'};
const KEYS=['أ','ب','ج','د'];
const $=id=>document.getElementById(id);
let S={lesson:0,period:0,groups:4,names:[],nq:10};
let G=null;
/* ---------- audio ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,dur,type='sine',vol=.12){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05);}
const SND={right(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.09,.35,'sine',.1));},
 wrong(){tone(330,0,.3,'triangle',.08);tone(262,.18,.4,'triangle',.07);},
 tick(){tone(880,0,.06,'sine',.03);},
 chart(){[392,494,587].forEach((f,i)=>tone(f,i*.12,.5,'sine',.06));},
 fan(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.13,.6,'sine',.09));[261.6,329.6,392].forEach((f)=>tone(f,.6,1.2,'sine',.05));}};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇 مكتوم':'🔊 الصوت';};
/* ---------- setup ---------- */
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const sel=$('selLesson');let lu='',og=null;
D.forEach((L,i)=>{if(L.unit!==lu){og=document.createElement('optgroup');og.label=L.unit;sel.appendChild(og);lu=L.unit;}const o=document.createElement('option');o.value=i;o.textContent=L.id+' '+L.title;og.appendChild(o);});
sel.onchange=()=>{S.lesson=+sel.value;S.period=0;drawPeriods();drawAvail();};
function drawPeriods(){const L=D[S.lesson];const box=$('perPills');box.innerHTML='';L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='pill'+(i===S.period?' on':'');b.textContent=`الحصة ${i+1}: ${p}`;b.onclick=()=>{S.period=i;drawPeriods();};box.appendChild(b);});}
function drawGroups(){const box=$('grpPills');box.innerHTML='';for(let n=2;n<=6;n++){const b=document.createElement('button');b.className='pill'+(n===S.groups?' on':'');b.textContent=n+' مجموعات';b.onclick=()=>{S.groups=n;drawGroups();};box.appendChild(b);}
 const nm=$('names');const old=[...nm.querySelectorAll('input')].map(x=>x.value);nm.innerHTML='';for(let i=0;i<S.groups;i++){const d=document.createElement('div');d.className='nm';d.innerHTML=`<span class="sw" style="background:${COLORS[i]}"></span><input type="text" maxlength="18">`;const inp=d.querySelector('input');inp.value=old[i]||('المجموعة '+DEFN[i]);nm.appendChild(d);}}
const qr=$('qRange');qr.oninput=()=>{S.nq=+qr.value;$('qCnt').textContent=S.nq;drawQuick();};
function drawQuick(){const box=$('quick');box.innerHTML='';[5,10,15,20].forEach(n=>{const b=document.createElement('button');b.className='pill'+(n===S.nq?' on':'');b.textContent=n;b.onclick=()=>{S.nq=n;qr.value=n;$('qCnt').textContent=n;drawQuick();};box.appendChild(b);});}
function drawAvail(){const L=D[S.lesson];$('avail').textContent=`في هذا الدرس ${L.q.length} سؤالًا؛ تُقدَّم أسئلة الحصة المختارة أولًا ثم تُكمَل من حصص الدرس الأخرى، مرتبة من الأسهل إلى الأصعب.`;}
drawPeriods();drawGroups();drawQuick();drawAvail();
/* ---------- game ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQuestions(){const L=D[S.lesson];const pnum=S.period+1;
 const mine=shuffle(L.q.filter(q=>q.p===pnum));const others=shuffle(L.q.filter(q=>q.p!==pnum));
 // prefer adjacent periods for the rest
 others.sort((a,b)=>Math.abs(a.p-pnum)-Math.abs(b.p-pnum));
 const take=[...mine,...others].slice(0,Math.min(S.nq,L.q.length));
 return take.sort((a,b)=>a.d-b.d);}
$('startBtn').onclick=()=>{ac();const names=[...$('names').querySelectorAll('input')].map((x,i)=>x.value.trim()||('المجموعة '+DEFN[i]));
 G={names,score:names.map(()=>0),qs:pickQuestions(),i:0,turn:0,last:null};show('sQ');$('homeBtn').style.display='';ask();};
$('homeBtn').onclick=()=>{stopTimer();show('sSetup');$('homeBtn').style.display='none';};
$('againBtn').onclick=()=>{show('sSetup');$('homeBtn').style.display='none';};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo({top:0,behavior:'smooth'});}
let timer=null,t0=0,answered=false;
const CIRC=326.7;
function pointsAt(sec){if(sec<=30)return Math.round(1000-500*(sec/30));const over=sec-30;return Math.max(100,Math.round(500-400*(over/30)));}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function drawTurn(){const box=$('turnChips');box.innerHTML='';G.names.forEach((n,i)=>{const b=document.createElement('button');b.className='chip'+(i===G.turn?' on':'');b.style.borderColor=COLORS[i];b.style.background=i===G.turn?COLORS[i]+'33':'#fff';b.textContent=n;b.onclick=()=>{if(answered)return;G.turn=i;drawTurn();};box.appendChild(b);});}
function ask(){const q=G.qs[G.i];answered=false;
 $('progTx').textContent=`السؤال ${G.i+1} من ${G.qs.length} · الحصة ${q.p} · ${['','سهل','متوسط','متقدم'][q.d]}`;
 $('progBar').style.width=((G.i)/G.qs.length*100)+'%';
 drawTurn();$('qType').textContent=TYPES[q.t];
 $('qText').innerHTML=esc(q.q).replace('____','<span class="blank"></span>');
 const box=$('opts');box.innerHTML='';box.className='opts'+(q.t==='tf'?' tf':'');
 q.o.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="k" style="background:${['#7cc6b8','#9fb7ea','#f2b8a2','#c8b6ea'][k%4]}">${KEYS[k]}</span><span>${esc(o)}</span>`;b.onclick=()=>choose(k);box.appendChild(b);});
 $('fb').textContent='';$('nextBtn').style.display='none';$('skipBtn').style.display='';
 t0=performance.now();stopTimer();let lastS=-1;
 timer=setInterval(()=>{const sec=(performance.now()-t0)/1000;const ring=$('ring');
  if(sec<=30){$('tNum').textContent=Math.ceil(30-sec);$('tLbl').textContent='ثانية';ring.style.strokeDashoffset=CIRC*(sec/30);ring.style.stroke=sec>20?'#f0b27a':'#7cc6b8';}
  else{$('tNum').textContent='+'+Math.floor(sec-30);$('tLbl').textContent='وقت إضافي';ring.style.strokeDashoffset=CIRC;ring.style.stroke='#e9c27a';}
  $('tPts').textContent=pointsAt(sec)+' نقطة';
  const s=Math.floor(sec);if(s!==lastS&&sec>25&&sec<=30){SND.tick();}lastS=s;},200);}
function choose(k){if(answered)return;answered=true;stopTimer();const q=G.qs[G.i];const sec=(performance.now()-t0)/1000;
 const btns=[...$('opts').children];btns.forEach((b,i)=>{if(i===q.a)b.classList.add('right');else if(i===k)b.classList.add('wrong');else b.classList.add('dim');});
 let pts=0;if(k===q.a){pts=pointsAt(sec);SND.right();$('fb').innerHTML=`<span style="color:#2f7a3d">إجابة صحيحة! +${pts} نقطة لـ${esc(G.names[G.turn])}</span>`;}
 else{SND.wrong();$('fb').innerHTML=`<span style="color:#8a3e52">إجابة غير صحيحة. الصحيح: ${esc(q.o[q.a])}</span>`;}
 G.score[G.turn]+=pts;G.last={g:G.turn,pts};$('skipBtn').style.display='none';$('nextBtn').style.display='';}
$('skipBtn').onclick=()=>{if(answered)return;answered=true;stopTimer();const q=G.qs[G.i];[...$('opts').children].forEach((b,i)=>b.classList.add(i===q.a?'right':'dim'));$('fb').innerHTML=`<span style="color:#7a5a1e">لم تُحتسب نقاط. الإجابة الصحيحة: ${esc(q.o[q.a])}</span>`;G.last={g:G.turn,pts:0};$('skipBtn').style.display='none';$('nextBtn').style.display='';};
$('nextBtn').onclick=()=>{showScores();};
function showScores(){show('sScore');const last=G.i===G.qs.length-1;$('contBtn').textContent=last?'منصة التتويج ←':'السؤال التالي ←';
 $('scLead').textContent=G.last.pts>0?`الفائزة بهذا السؤال: ${G.names[G.last.g]} (+${G.last.pts})`:'لم تُحتسب نقاط في هذا السؤال.';
 const order=G.names.map((n,i)=>i).sort((a,b)=>G.score[b]-G.score[a]);const max=Math.max(1,...G.score);
 const ch=$('chart');ch.innerHTML='';
 order.forEach((gi,r)=>{const c=document.createElement('div');c.className='col';
  c.innerHTML=`<div class="val">${G.score[gi]}</div><div class="bar${(G.last.pts>0&&gi===G.last.g)?' win':''}" style="background:linear-gradient(180deg,${COLORS[gi]},${COLORS[gi]}bb)">${(G.last.pts>0&&gi===G.last.g)?`<span class="plus">+${G.last.pts}</span>`:''}</div><div class="gname">${esc(G.names[gi])}</div><div class="rank">المركز ${r+1}</div>`;ch.appendChild(c);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{c.querySelector('.bar').style.height=Math.max(6,(G.score[gi]/max)*240)+'px';}));});
 SND.chart();}
$('contBtn').onclick=()=>{if(G.i<G.qs.length-1){G.i++;G.turn=(G.turn+1)%G.names.length;show('sQ');ask();}else{final();}};
function final(){show('sEnd');const order=G.names.map((n,i)=>i).sort((a,b)=>G.score[b]-G.score[a]);
 const pod=$('podium');pod.innerHTML='';const slots=[1,0,2];const H=[230,170,130];const M=['🥇','🥈','🥉'];
 slots.forEach(r=>{if(r>=order.length)return;const gi=order[r];const d=document.createElement('div');d.className='pd';
  d.innerHTML=`<div class="medal">${M[r]}</div><div class="who">${esc(G.names[gi])}</div><div class="sc">${G.score[gi]} نقطة</div><div class="blk" style="background:linear-gradient(180deg,${COLORS[gi]},${COLORS[gi]}aa)">${r+1}</div>`;pod.appendChild(d);
  setTimeout(()=>{d.classList.add('show');d.querySelector('.blk').style.height=H[r]+'px';},150+r*250);});
 $('rest').innerHTML=order.slice(3).map((gi,i)=>`<span>المركز ${i+4}: ${esc(G.names[gi])} (${G.score[gi]})</span>`).join(' · ');
 SND.fan();confetti();}
/* ---------- gentle confetti ---------- */
function confetti(){const cv=$('fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const P=[];for(let i=0;i<110;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,r:4+Math.random()*5,c:COLORS[i%6],vy:1+Math.random()*1.6,vx:-.6+Math.random()*1.2,a:Math.random()*6,va:-.05+Math.random()*.1});
 let t=0;function f(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin((t+p.a*40)/40)*.4;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.globalAlpha=Math.max(0,1-t/420);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore();});t++;if(t<440)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height);}f();}
