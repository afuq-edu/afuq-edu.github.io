 أم مادة نقية ويعلل. ← تقييم\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n- التعلم المبني على حل المشكلات\n- الاستقصاء العلمي\n- فكّر – زاوج – شارك\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورقة العمل 3-5أ، عصير برتقال طازج\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nيعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟ (5 دقائق)\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\nيعرض المعلم ملعقة سكر وعلبة مسحوق شراب بارد ويسأل: أيهما مادة نقية؟ وأيهما مخلوط؟ (5 دقائق)\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\nيسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟ (5 دقائق)", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة — زمن الحصة 40 دقيقة\n\n1. المذاب والمذيب: يشرح المعلم ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب، والطلبة يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3-5: تحضير محلول: يوجه المعلم وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق، والطلبة يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المحلول المتجانس: يقدم المعلم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه، والطلبة يصفون محلولهم باستخدام المصطلح (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟ — زمن الحصة 40 دقيقة\n\n1. المواد النقية والمخاليط: يشرح المعلم ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط، والطلبة يصنفون أمثلة في جدول (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الأسئلة 1–5 ص 63: خطة استقصاء: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟ والطلبة يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ورقة العمل 3-5أ وتحدّث عن: يوجه المعلم بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال، والطلبة يجيبون ويستنتجون أن العصير مخلوط (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع — زمن الحصة 40 دقيقة\n\n1. السلامة: ينبه: المعلم وحده يصب الماء الساخن، والطلبة يكررون القاعدة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ورقة العمل 3-5ب: الاستقصاء: يصب المعلم 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب، والطلبة يعدّون الملاعق ويزنون السكر ويسجلون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المحلول المشبع والتنبؤ: يعرّف المعلم المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب، والطلبة يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. غلق الدرس – محلول ماء الورد: تحدد المجموعات المادة المذابة والمذيبة في محلول من مكونات الضيافة العمانية كالماء والسكر وماء الورد، وتصف خطوات تحضيره (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n2. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n3. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n2. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n3. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nللطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\nللطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\nللطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"id": "3-6", "title": "كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 86–90", "n": 3, "per": [{"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64 | دليل المعلم ص 86–88", "num": "الحصة الأولى من 3", "focus": "التحريك يزيد سرعة الذوبان"}, "f": ["1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع (15 دقيقة)\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع (10 دقائق)\nمخرج تعليمي آخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا (15 دقيقة)", "1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم", "- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة", "- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات", "يعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟ (5 دقائق)", "1. تجربة عرض: كأسان: يصب المعلم الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط، والطلبة يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التفسير بالجزيئات: يشرح المعلم ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع، والطلبة يرسمون نموذجين: دون تحريك ومع تحريك (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. هل كان الاختبار عادلًا؟: يسأل المعلم عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة، والطلبة يكتبون الثوابت ويستنتجون (6 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.", "للطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 65 | دليل المعلم ص 87–89", "num": "الحصة الثانية من 3", "focus": "درجة الحرارة وسرعة الذوبان (نشاط 3-6)"}, "f": ["1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل (25 دقيقة)\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات (5 دقائق)\nمخرج تعليمي آخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة (10 دقائق)", "1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف، ملعقة، مخبار مدرج", "- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج", "يسأل المعلم: لماذا نصنع الشاي والقهوة بالماء الساخن؟ هل جربت صنع الشاي بماء من الثلاجة؟ (5 دقائق)", "1. السلامة والأدوات: يؤكد المعلم استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم، والطلبة يتعرفون على قراءة مقياس الحرارة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. نشاط 3-6: يوجه المعلم وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ، والطلبة يقيسون الزمن ويسجلون في جدول (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. الأسئلة 1–3 ص 65: يناقش المعلم: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات، والطلبة يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n2. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n3. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n2. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n3. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.", "للطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 88–89", "num": "الحصة الثالثة من 3", "focus": "تفسير الرسوم البيانية للذوبان والعوامل المؤثرة"}, "f": ["1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة (15 دقيقة)\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج (10 دقائق)\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب (15 دقيقة)", "1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "يعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟ (5 دقائق)", "1. أوراق العمل حسب المستوى: يوزع المعلم 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم، والطلبة يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 3-6: يوجه المعلم تمرين 3-6 (ص 42) عن العوامل والاختبار العادل لدعم المتعثرين، والطلبة يحلون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تصحيح مفهوم: يوضح المعلم الفرق بين سرعة الذوبان وكمية المادة الذائبة، ويلخص العاملين: التحريك ودرجة الحرارة، والطلبة يكملون خريطة: عوامل تسرّع الذوبان (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – تحريك الحلوى: تفسر الأزواج لماذا يحرك صانع الحلوى العمانية الخليط باستمرار، وتربطه بأثر التحريك في سرعة الذوبان (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] من التمثيل البياني: عند أي درجة حرارة استغرق السكر أقصر زمن؟\n   الإجابة النموذجية: عند أعلى درجة حرارة في التمثيل.\n2. [مستوى التطبيق] صف النمط: كلما زادت درجة الحرارة...\n   الإجابة النموذجية: قل زمن الذوبان (أي ذاب السكر أسرع).\n3. [مستوى الاستدلال] ما الفرق بين «يذوب أسرع» و«يذوب أكثر»؟\n   الإجابة النموذجية: الأول يتعلق بسرعة ذوبان الكمية نفسها، والثاني بكمية المادة التي يمكن أن تذوب.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر عاملين يجعلان المادة تذوب أسرع.\n   الإجابة النموذجية: التحريك ورفع درجة الحرارة.\n2. [مستوى التطبيق] لماذا يُفضل التمثيل الخطي عند قياس الزمن عند عدة درجات حرارة؟\n   الإجابة النموذجية: لأنه يوضح التغير المستمر ويسمح بقراءة قيم بين القياسات.\n3. [مستوى الاستدلال] لماذا لا تُغسل الملابس عادة بدرجات حرارة عالية جدًا؟\n   الإجابة النموذجية: لأن الحرارة المرتفعة قد تتلف الأقمشة أو تسبب تقلصها.", "للطالب: إكمال ورقة العمل 3-6ج (كتاب النشاط ص 82–83) واجبًا منزليًا وحل تمرين 3-6 (ص 42). لولي الأمر: يُرجى مساعدة الابن في رسم التمثيل البياني بالمسطرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}], "comb": ["الحصة 1: التحريك يزيد سرعة الذوبان\n1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع (15 دقيقة)\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع (10 دقائق)\nمخرج تعليمي آخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا (15 دقيقة)\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل (25 دقيقة)\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات (5 دقائق)\nمخرج تعليمي آخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة (10 دقائق)\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة (15 دقيقة)\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج (10 دقائق)\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب (15 دقيقة)", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "الحصة 1: التحريك يزيد سرعة الذوبان\n- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "الحصة 1: التحريك يزيد سرعة الذوبان\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف، ملعقة، مخبار مدرج\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "الحصة 1: التحريك يزيد سرعة الذوبان\n- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "الحصة 1: التحريك يزيد سرعة الذوبان\nيعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟ (5 دقائق)\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\nيسأل المعلم: لماذا نصنع الشاي والقهوة بالماء الساخن؟ هل جربت صنع الشاي بماء من الثلاجة؟ (5 دقائق)\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nيعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟ (5 دقائق)", "الحصة 1: التحريك يزيد سرعة الذوبان — زمن الحصة 40 دقيقة\n\n1. تجربة عرض: كأسان: يصب المعلم الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط، والطلبة يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التفسير بالجزيئات: يشرح المعلم ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع، والطلبة يرسمون نموذجين: دون تحريك ومع تحريك (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. هل كان الاختبار عادلًا؟: يسأل المعلم عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة، والطلبة يكتبون الثوابت ويستنتجون (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6) — زمن الحصة 40 دقيقة\n\n1. السلامة والأدوات: يؤكد المعلم استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم، والطلبة يتعرفون على قراءة مقياس الحرارة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. نشاط 3-6: يوجه المعلم وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ، والطلبة يقيسون الزمن ويسجلون في جدول (11 دقيقة)\nالاستراتيجيات: العرض العملي.\n\n3. الأسئلة 1–3 ص 65: يناقش المعلم: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات، والطلبة يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة — زمن الحصة 40 دقيقة\n\n1. أوراق العمل حسب المستوى: يوزع المعلم 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم، والطلبة يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 3-6: يوجه المعلم تمرين 3-6 (ص 42) عن العوامل والاختبار العادل لدعم المتعثرين، والطلبة يحلون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تصحيح مفهوم: يوضح المعلم الفرق بين سرعة الذوبان وكمية المادة الذائبة، ويلخص العاملين: التحريك ودرجة الحرارة، والطلبة يكملون خريطة: عوامل تسرّع الذوبان (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: العرض العملي.\n\n5. غلق الدرس – تحريك الحلوى: تفسر الأزواج لماذا يحرك صانع الحلوى العمانية الخليط باستمرار، وتربطه بأثر التحريك في سرعة الذوبان (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: التحريك يزيد سرعة الذوبان\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n2. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n3. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] من التمثيل البياني: عند أي درجة حرارة استغرق السكر أقصر زمن؟\n   الإجابة النموذجية: عند أعلى درجة حرارة في التمثيل.\n2. [مستوى التطبيق] صف النمط: كلما زادت درجة الحرارة...\n   الإجابة النموذجية: قل زمن الذوبان (أي ذاب السكر أسرع).\n3. [مستوى الاستدلال] ما الفرق بين «يذوب أسرع» و«يذوب أكثر»؟\n   الإجابة النموذجية: الأول يتعلق بسرعة ذوبان الكمية نفسها، والثاني بكمية المادة التي يمكن أن تذوب.", "الحصة 1: التحريك يزيد سرعة الذوبان\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n2. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n3. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر عاملين يجعلان المادة تذوب أسرع.\n   الإجابة النموذجية: التحريك ورفع درجة الحرارة.\n2. [مستوى التطبيق] لماذا يُفضل التمثيل الخطي عند قياس الزمن عند عدة درجات حرارة؟\n   الإجابة النموذجية: لأنه يوضح التغير المستمر ويسمح بقراءة قيم بين القياسات.\n3. [مستوى الاستدلال] لماذا لا تُغسل الملابس عادة بدرجات حرارة عالية جدًا؟\n   الإجابة النموذجية: لأن الحرارة المرتفعة قد تتلف الأقمشة أو تسبب تقلصها.", "الحصة 1: التحريك يزيد سرعة الذوبان\nللطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\nللطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nللطالب: إكمال ورقة العمل 3-6ج (كتاب النشاط ص 82–83) واجبًا منزليًا وحل تمرين 3-6 (ص 42). لولي الأمر: يُرجى مساعدة الابن في رسم التمثيل البياني بالمسطرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"id": "3-7", "title": "كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66–67 | كتاب النشاط ص 43، 84–85 | دليل المعلم ص 90–92", "n": 2, "per": [{"h": {"lesson": "3-7 كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66 | دليل المعلم ص 90–91", "num": "الحصة الأولى من 2", "focus": "حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء"}, "f": ["1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية (15 دقيقة)\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان (10 دقائق)\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة (15 دقيقة)", "1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية. ← فهم\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان. ← تطبيق\nالمخرج الآخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة. ← تحليل", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورق A4، مقص، مسطرة، قطعة سكر وحبيبات سكر ومسحوق سكر", "- حجم الحبيبات\n- مساحة السطح\n- التخطيط\n- العامل المتغير\n- العوامل الثابتة", "يعرض المعلم قطعة سكر وملعقة حبيبات سكر ومسحوق سكر، ويسأل: أيها تتوقع أن يذوب أولًا في الماء؟ ولماذا؟ (5 دقائق)", "1. نشاط الحواف (مساحة السطح): يوجه المعلم قياس محيط ورقة A4، ثم قصها إلى أربع قطع وجمع محيطاتها، ثم القص مجددًا، والطلبة يقيسون ويقارنون ويستنتجون: كلما صغرت القطع زاد طول الحواف الكلي (8 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. الربط بالذوبان: يشرح المعلم ص 67: الحبيبات الصغيرة لها مساحة سطح أكبر تتصل بالمذيب فتذوب أسرع، والطلبة يكتبون الاستنتاج ويطبقونه على السكر (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التخطيط لنشاط 3-7: يوجه المعلم التخطيط: التنبؤ، المواد والأدوات، العامل المتغير، الثوابت، طريقة الاختبار العادل، جدول النتائج، وتكتب كل مجموعة خطتها (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويراجع الخطط، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث لطول الحواف الكلي عندما قصصت الورقة إلى قطع أصغر؟\n   الإجابة النموذجية: ازداد.\n2. [مستوى التطبيق] ما العامل المتغير في استقصاء حجم الحبيبات؟\n   الإجابة النموذجية: حجم حبيبات المادة المذابة.\n3. [مستوى الاستدلال] اذكر ثلاثة عوامل يجب تثبيتها.\n   الإجابة النموذجية: كمية الماء ودرجة حرارته، وكتلة السكر، وطريقة التحريك.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أيهما يذوب أسرع: قطعة السكر أم مسحوق السكر؟\n   الإجابة النموذجية: مسحوق السكر.\n2. [مستوى التطبيق] لماذا تذوب الحبيبات الصغيرة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها الكلية أكبر فتتصل بالمذيب أكثر.\n3. [مستوى الاستدلال] ما الأداة التي تقيس بها زمن الذوبان؟\n   الإجابة النموذجية: ساعة الإيقاف.", "للطالب: مراجعة خطة الاستقصاء وإحضار أنواع مختلفة من السكر أو الملح إن أمكن. لولي الأمر: يُرجى مساعدة الابن في توفير المواد البسيطة للاستقصاء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=25"]}, {"h": {"lesson": "3-7 كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66–67 | كتاب النشاط ص 43، 84–85 | دليل المعلم ص 91–92", "num": "الحصة الثانية من 2", "focus": "تنفيذ استقصاء حجم الحبيبات وتحليل النتائج"}, "f": ["1. ينفذ استقصاءً لمقارنة زمن ذوبان حبيبات مختلفة الحجم ويمثل النتائج بالأعمدة (15 دقيقة)\n2. يستخلص استنتاجًا ويحدد ما إذا كانت الأدلة تدعم تنبؤه (10 دقائق)\nمخرج تعليمي آخر: يتنبأ بزمن ذوبان مسحوق ناعم ويفسر سبب إذابة بعض الأدوية قبل تناولها (15 دقيقة)", "1. ينفذ استقصاءً لمقارنة زمن ذوبان حبيبات مختلفة الحجم ويمثل النتائج بالأعمدة. ← تطبيق\n2. يستخ لة 1–4 ص 67: يوجه المعلم التمثيل بالأعمدة ومناقشة: هل تدعم النتائج التنبؤ؟ ما الاستنتاج؟ كيف تتأكد منه؟ تنبأ بالمسحوق الناعم، والطلبة يرسمون ويجيبون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. ورقة العمل 3-7 أو تمرين 3-7: يوزع المعلم ورقة العمل 3-7 (مقارنة مرام وشمس، ص 84–85) أو تمرين 3-7 (ص 43)، ويناقش سؤال الأقراص الفوارة، والطلبة يحلون ويربطون بالهضم في الوحدة الأولى (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – حبيبات الملح والسكر: تقارن المجموعات بين ذوبان قطعة سكر كبيرة وسكر ناعم، وتتحدث عن طحن الهيل والبن قبل إعداد القهوة العمانية (5 دقائق)\nالاستراتيجيات: التعلم بالاستقصاء.", "الحصة 1: حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث لطول الحواف الكلي عندما قصصت الورقة إلى قطع أصغر؟\n   الإجابة النموذجية: ازداد.\n2. [مستوى التطبيق] ما العامل المتغير في استقصاء حجم الحبيبات؟\n   الإجابة النموذجية: حجم حبيبات المادة المذابة.\n3. [مستوى الاستدلال] اذكر ثلاثة عوامل يجب تثبيتها.\n   الإجابة النموذجية: كمية الماء ودرجة حرارته، وكتلة السكر، وطريقة التحريك.\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أي الحبيبات استغرقت أقل زمن للذوبان؟\n   الإجابة النموذجية: الحبيبات الأصغر.\n2. [مستوى التطبيق] ما الاستنتاج من نتائج الاستقصاء؟\n   الإجابة النموذجية: كلما صغر حجم الحبيبات ذابت أسرع.\n3. [مستوى الاستدلال] كيف تتأكد من صحة استنتاجك؟\n   الإجابة النموذجية: بتكرار الاستقصاء ومقارنة النتائج مع المجموعات الأخرى.", "الحصة 1: حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أيهما يذوب أسرع: قطعة السكر أم مسحوق السكر؟\n   الإجابة النموذجية: مسحوق السكر.\n2. [مستوى التطبيق] لماذا تذوب الحبيبات الصغيرة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها الكلية أكبر فتتصل بالمذيب أكثر.\n3. [مستوى الاستدلال] ما الأداة التي تقيس بها زمن الذوبان؟\n   الإجابة النموذجية: ساعة الإيقاف.\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] تنبأ: كيف يتغير زمن الذوبان عند استخدام مسحوق ناعم؟\n   الإجابة النموذجية: يقل الزمن فيذوب أسرع.\n2. [مستوى التطبيق] لماذا تُذاب بعض الأدوية مثل الأقراص الفوارة قبل تناولها؟\n   الإجابة النموذجية: لأنها حبيبات صغيرة ذائبة يمتصها الجسم إلى الدم بسرعة أكبر.\n3. [مستوى الاستدلال] اذكر ثلاثة عوامل تزيد سرعة الذوبان.\n   الإجابة النموذجية: التحريك، رفع درجة الحرارة، تصغير حجم الحبيبات.", "الحصة 1: حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء\nللطالب: مراجعة خطة الاستقصاء وإحضار أنواع مختلفة من السكر أو الملح إن أمكن. لولي الأمر: يُرجى مساعدة الابن في توفير المواد البسيطة للاستقصاء.\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\nللطالب: إكمال ورقة العمل 3-7 (كتاب النشاط ص 84–85) وتمرين 3-7 (ص 43)، ومراجعة الوحدة الثالثة. لولي الأمر: يُرجى مراجعة عوامل سرعة الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=25"]}],[{"id": "1-1", "title": "أعضاء الجسم", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 18–19 | كتاب النشاط ص 16، 49 | دليل المعلم ص 24–26", "n": 2, "per": [{"h": {"lesson": "1-1 أعضاء الجسم", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 18–19 | دليل المعلم ص 24–26", "num": "الحصة الأولى من 2", "focus": "أعضاء الجسم الرئيسية: أسماؤها ومواقعها"}, "f": ["1. يسمّي أعضاء الجسم الرئيسية: الدماغ، القلب، الرئتين، الكليتين، المعدة، الأمعاء، الكبد (10 دقائق)\n2. يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان (20 دقيقة)\nمخرج تعليمي آخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء (10 دقائق)", "1. يسمّي أعضاء الجسم الرئيسية: الدماغ، القلب، الرئتين، الكليتين، المعدة، الأمعاء، الكبد. ← تذكر\n2. يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان. ← فهم\nالمخرج الآخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء. ← فهم", "- التعلم التعاوني\n- التعلم بالاكتشاف\n- العصف الذهني\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الأقلام\n- أخرى: ورق مقوى وورق أبيض وأقلام تلوين ومقص وغراء لنشاط 1-1", "- أعضاء الجسم\n- أجهزة الجسم\n- الدماغ\n- القلب\n- الرئتان\n- الكبد", "يطرح المعلم تشبيه الجسم بالمدينة: ماذا تحتاج المدينة لتعمل؟ (طاقة، نقل، مياه، تخلّص من الفضلات، إدارة). يعقد جلسة عصف ذهني قصيرة عن أعضاء الجسم التي تقوم بأعمال مشابهة، ويسجّل الأفكار في خريطة ذهنية على السبورة. (5 دقائق)", "1. استكشاف صورة الأعضاء: يعرض المعلم صورة أعضاء الجسم في كتاب الطالب ص 18 على السبورة الذكية، ويقدّم مصطلح «العضو» و«الجهاز»، والطلبة يقرؤون أسماء الأعضاء ويشيرون إلى موقع كل عضو على أجسامهم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 1-1 (الجزء الأول): مخطط الجسم: يوزّع المجموعات (4–5 طلاب) ويوجّه رسم محيط جسم زميل على الورق المقوى، ورسم الأعضاء بحجم تقريبي مناسب، والطلبة يرسمون محيط الجسم ثم يرسمون الأعضاء ويكتبون أسماءها ويلوّنونها (11 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n3. مناقشة المواقع: يسأل المعلم: أي الأعضاء في الرأس؟ في الصدر؟ في البطن؟ ويصحّح الأخطاء، والطلبة يجيبون مستعينين بالصورة ومخطط مجموعتهم (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n4. الختام والتقويم: يطرح المعلم أسئلة التقويم الختامي شفهيًا، والطلبة يجيبون فرديًا ويحتفظون بالمخطط لاستكماله في الحصة القادمة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أشر إلى موقع القلب والرئتين في الصورة، وسمِّ كلًّا منهما.\n   الإجابة النموذجية: القلب في الصدر بين الرئتين مائلًا لليسار، والرئتان في الصدر على جانبيه.\n2. [مستوى التطبيق] ما العضو الموجود في الرأس؟ وما الأعضاء الموجودة في البطن؟\n   الإجابة النموذجية: الرأس: الدماغ. البطن: المعدة والأمعاء والكبد والكليتان (في الجزء الخلفي).\n3. [مستوى الاستدلال] لماذا نقول إن أعضاء الجسم «تعمل معًا»؟\n   الإجابة النموذجية: لأن كل عضو يؤدي جزءًا من عمل أكبر، وتتعاون الأعضاء لتكوّن أجهزة تؤدي وظائف الحياة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة من أعضاء الجسم الرئيسية.\n   الإجابة النموذجية: مثل: الدماغ، القلب، الرئتان (أو الكليتان، المعدة، الأمعاء، الكبد).\n2. [مستوى التطبيق] صنّف الأعضاء الآتية حسب موقعها (رأس/صدر/بطن): القلب، المعدة، الدماغ، الأمعاء.\n   الإجابة النموذجية: رأس: الدماغ. صدر: القلب. بطن: المعدة والأمعاء.\n3. [مستوى الاستدلال] أيّ الأعضاء الرئيسية يوجد في الجسم على هيئة زوج؟ وما الفائدة المحتملة من ذلك؟\n   الإجابة النموذجية: الرئتان والكليتان؛ وجود عضوين يزيد كفاءة العمل ويمكن للجسم أن يعمل بعضو واحد سليم عند الضرورة.", "للطالب: قراءة كتاب الطالب ص 18 وحفظ أسماء الأعضاء ومواقعها، وإحضار المخطط غير المكتمل. لولي الأمر: يُرجى مساعدة الابن على الإشارة إلى مواقع الأعضاء على جسمه وتسميتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=1"]}, {"h": {"lesson": "1-1 أعضاء الجسم", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 18–19 | كتاب النشاط ص 16، 49 | دليل المعلم ص 24–26", "num": "الحصة الثانية من 2", "focus": "وظائف الأعضاء الرئيسية وحمايتها"}, "f": ["1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية (10 دقائق)\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة (15 دقيقة)\nمخرج تعليمي آخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية (15 دقيقة)", "1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية. ← فهم\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة. ← تطبيق\nالمخرج الآخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية. ← فهم", "- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: مخططات المجموعات وغراء ومقص", "- وظيفة العضو\n- الهضم\n- الإخراج\n- التنفس\n- الجمجمة\n- الضلوع", "يعرض المعلم بطاقات أسماء الأعضاء، ويطلب من كل طالب أن يخمّن «أفضل تنبؤ» لوظيفة عضو واحد، ثم يقارن التخمينات بعد الحصة. (5 دقائق)", "1. نشاط 1-1 (الجزء الثاني): إكمال المخطط: يتابع المجموعات أثناء قصّ الأعضاء ولصقها مستعينين بالصورة ص 18، والطلبة يلصقون الأعضاء في مواضعها ويكتبون بجانب كل عضو وظيفته (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. وظائف الأعضاء: يناقش المعلم وظيفة كل عضو: الدماغ تحكّم وتفكير، القلب ضخ الدم، الرئتان تنفس، الكليتان إخراج، المعدة والأمعاء هضم، الكبد تخزين الطاقة والتخلص من المواد السامة، والطلبة يقارنون تنبؤاتهم بالوظائف الصحيحة ويصحّحون (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أسئلة النشاط 1-1 وتمرين 1-1: يوجّه المعلم حل أسئلة النشاط ص 19 وتمرين 1-1 في كتاب النشاط ص 16 (لدعم المتعثرين)، والطلبة يجيبون فرديًا ثم يتحققون مع زميل (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. تحدّث عن: الحماية: يسأل المعلم: كيف تتم حماية أعضاء الجسم؟ ويذكّر بدراسة الصف الرابع، والطلبة يذكرون أن الجمجمة تحمي الدماغ والضلوع تحمي القلب والرئتين (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n6. غلق الدرس – أعضاء فريق الوطن: تشبّه كل مجموعة أعضاء الجسم بفريق عمل في مؤسسة عمانية: الدماغ القائد، والقلب المضخة، والرئتان، وتعرض كيف يتعاون الجميع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صِل العضو بوظيفته: القلب – الرئتان – الكليتان.\n   الإجابة النموذجية: القلب: ضخ الدم. الرئتان: التنفس. الكليتان: الإخراج (التخلص من الفضلات).\n2. [مستوى التطبيق] ما وظيفة الكبد كما وردت في كتاب الطالب؟\n   الإجابة النموذجية: تخزين الطاقة وتخليص الجسم من المواد السامة.\n3. [مستوى الاستدلال] لماذا يحتاج الدماغ إلى حماية قوية أكثر من غيره؟\n   الإجابة النموذجية: لأنه يتحكم في جميع وظائف الجسم، وإصابته قد تعطّل عمل الجسم كله، فتحميه الجمجمة الصلبة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العضو المسؤول عن الهضم؟\n   الإجابة النموذجية: المعدة والأمعاء.\n2. [مستوى التطبيق] كيف تحمي الضلوع أعضاء الصدر؟\n   الإجابة النموذجية: تشكّل قفصًا عظميًا يحيط بالقلب والرئتين فيحميهما من الصدمات.\n3. [مستوى الاستدلال] لو تعطلت الكليتان، ما المشكلة التي ستواجه الجسم؟\n   الإجابة النموذجية: تتراكم الفضلات والماء الزائد في الدم فيتضرر الجسم.", "للطالب: حل ورقة العمل 1-1 (كتاب النشاط ص 49) وتمرين 1-1 (ص  الجسم\n- أجهزة الجسم\n- الدماغ\n- القلب\n- الرئتان\n- الكبد\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- وظيفة العضو\n- الهضم\n- الإخراج\n- التنفس\n- الجمجمة\n- الضلوع", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nيطرح المعلم تشبيه الجسم بالمدينة: ماذا تحتاج المدينة لتعمل؟ (طاقة، نقل، مياه، تخلّص من الفضلات، إدارة). يعقد جلسة عصف ذهني قصيرة عن أعضاء الجسم التي تقوم بأعمال مشابهة، ويسجّل الأفكار في خريطة ذهنية على السبورة. (5 دقائق)\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nيعرض المعلم بطاقات أسماء الأعضاء، ويطلب من كل طالب أن يخمّن «أفضل تنبؤ» لوظيفة عضو واحد، ثم يقارن التخمينات بعد الحصة. (5 دقائق)", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها — زمن الحصة 40 دقيقة\n\n1. استكشاف صورة الأعضاء: يعرض المعلم صورة أعضاء الجسم في كتاب الطالب ص 18 على السبورة الذكية، ويقدّم مصطلح «العضو» و«الجهاز»، والطلبة يقرؤون أسماء الأعضاء ويشيرون إلى موقع كل عضو على أجسامهم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 1-1 (الجزء الأول): مخطط الجسم: يوزّع المجموعات (4–5 طلاب) ويوجّه رسم محيط جسم زميل على الورق المقوى، ورسم الأعضاء بحجم تقريبي مناسب، والطلبة يرسمون محيط الجسم ثم يرسمون الأعضاء ويكتبون أسماءها ويلوّنونها (11 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n3. مناقشة المواقع: يسأل المعلم: أي الأعضاء في الرأس؟ في الصدر؟ في البطن؟ ويصحّح الأخطاء، والطلبة يجيبون مستعينين بالصورة ومخطط مجموعتهم (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n4. الختام والتقويم: يطرح المعلم أسئلة التقويم الختامي شفهيًا، والطلبة يجيبون فرديًا ويحتفظون بالمخطط لاستكماله في الحصة القادمة (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها — زمن الحصة 40 دقيقة\n\n1. نشاط 1-1 (الجزء الثاني): إكمال المخطط: يتابع المجموعات أثناء قصّ الأعضاء ولصقها مستعينين بالصورة ص 18، والطلبة يلصقون الأعضاء في مواضعها ويكتبون بجانب كل عضو وظيفته (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. وظائف الأعضاء: يناقش المعلم وظيفة كل عضو: الدماغ تحكّم وتفكير، القلب ضخ الدم، الرئتان تنفس، الكليتان إخراج، المعدة والأمعاء هضم، الكبد تخزين الطاقة والتخلص من المواد السامة، والطلبة يقارنون تنبؤاتهم بالوظائف الصحيحة ويصحّحون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أسئلة النشاط 1-1 وتمرين 1-1: يوجّه المعلم حل أسئلة النشاط ص 19 وتمرين 1-1 في كتاب النشاط ص 16 (لدعم المتعثرين)، والطلبة يجيبون فرديًا ثم يتحققون مع زميل (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تحدّث عن: الحماية: يسأل المعلم: كيف تتم حماية أعضاء الجسم؟ ويذكّر بدراسة الصف الرابع، والطلبة يذكرون أن الجمجمة تحمي الدماغ والضلوع تحمي القلب والرئتين (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n6. غلق الدرس – أعضاء فريق الوطن: تشبّه كل مجموعة أعضاء الجسم بفريق عمل في مؤسسة عمانية: الدماغ القائد، والقلب المضخة، والرئتان، وتعرض كيف يتعاون الجميع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أشر إلى موقع القلب والرئتين في الصورة، وسمِّ كلًّا منهما.\n   الإجابة النموذجية: القلب في الصدر بين الرئتين مائلًا لليسار، والرئتان في الصدر على جانبيه.\n2. [مستوى التطبيق] ما العضو الموجود في الرأس؟ وما الأعضاء الموجودة في البطن؟\n   الإجابة النموذجية: الرأس: الدماغ. البطن: المعدة والأمعاء والكبد والكليتان (في الجزء الخلفي).\n3. [مستوى الاستدلال] لماذا نقول إن أعضاء الجسم «تعمل معًا»؟\n   الإجابة النموذجية: لأن كل عضو يؤدي جزءًا من عمل أكبر، وتتعاون الأعضاء لتكوّن أجهزة تؤدي وظائف الحياة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صِل العضو بوظيفته: القلب – الرئتان – الكليتان.\n   الإجابة النموذجية: القلب: ضخ الدم. الرئتان: التنفس. الكليتان: الإخراج (التخلص من الفضلات).\n2. [مستوى التطبيق] ما وظيفة الكبد كما وردت في كتاب الطالب؟\n   الإجابة النموذجية: تخزين الطاقة وتخليص الجسم من المواد السامة.\n3. [مستوى الاستدلال] لماذا يحتاج الدماغ إلى حماية قوية أكثر من غيره؟\n   الإجابة النموذجية: لأنه يتحكم في جميع وظائف الجسم، وإصابته قد تعطّل عمل الجسم كله، فتحميه الجمجمة الصلبة.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة من أعضاء الجسم الرئيسية.\n   الإجابة النموذجية: مثل: الدماغ، القلب، الرئتان (أو الكليتان، المعدة، الأمعاء، الكبد).\n2. [مستوى التطبيق] صنّف الأعضاء الآتية حسب موقعها (رأس/صدر/بطن): القلب، المعدة، الدماغ، الأمعاء.\n   الإجابة النموذجية: رأس: الدماغ. صدر: القلب. بطن: المعدة والأمعاء.\n3. [مستوى الاستدلال] أيّ الأعضاء الرئيسية يوجد في الجسم على هيئة زوج؟ وما الفائدة المحتملة من ذلك؟\n   الإجابة النموذجية: الرئتان والكليتان؛ وجود عضوين يزيد كفاءة العمل ويمكن للجسم أن يعمل بعضو واحد سليم عند الضرورة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العضو المسؤول عن الهضم؟\n   الإجابة النموذجية: المعدة والأمعاء.\n2. [مستوى التطبيق] كيف تحمي الضلوع أعضاء الصدر؟\n   الإجابة النموذجية: تشكّل قفصًا عظميًا يحيط بالقلب والرئتين فيحميهما من الصدمات.\n3. [مستوى الاستدلال] لو تعطلت الكليتان، ما المشكلة التي ستواجه الجسم؟\n   الإجابة النموذجية: تتراكم الفضلات والماء الزائد في الدم فيتضرر الجسم.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nللطالب: قراءة كتاب الطالب ص 18 وحفظ أسماء الأعضاء ومواقعها، وإحضار المخطط غير المكتمل. لولي الأمر: يُرجى مساعدة الابن على الإشارة إلى مواقع الأعضاء على جسمه وتسميتها.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nللطالب: حل ورقة العمل 1-1 (كتاب النشاط ص 49) وتمرين 1-1 (ص 16) واجبًا منزليًا، ومراجعة ص 19. لولي الأمر: يُرجى متابعة حل الواجب ومناقشة الابن في وظيفة كل عضو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=1"]}, {"id": "1-2", "title": "القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 17، 50–52 | دليل المعلم ص 26–28", "n": 2, "per": [{"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20 | دليل المعلم ص 26–28", "num": "الحصة الأولى من 3", "focus": "القلب: موقعه وحجمه وعمله كمضخة"}, "f": ["1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد (10 دقائق)\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم (5 دقائق)\n3. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية (5 دقائق)\n4. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم (10 دقائق)\n\nمخرج تعليمي آخر:\nيمثّل عمل القلب باستخدام نموذج مضخة بسيط (5 دقائق)\nيفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم (5 دقائق)", "1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد. ← تذكر\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم. ← فهم\n3. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية. ← تذكر\n4. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم. ← فهم\nالمخرج الآخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط. ← تطبيق\nالمخرج الآخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم. ← تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- فكّر – زاوج – شارك\n- لعب الأدوار والمحاكاة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: أنبوب كرتوني (بكرة مناديل) وعبوة بلاستيكية مرنة مملوءة بالماء\n- صورة توضيحية\n- أخرى: كرات حمراء وزرقاء وأوعية فارغة وطباشير لرسم مخطط الدورة على الأرض", "- القلب\n- عضلة القلب\n- الانقباض والانبساط\n- دقات القلب\n- الدم\n- الجهاز الدوري\n- الدورة الدموية\n- الأوعية الدموية\n- الأكسجين\n- ثاني أكسيد الكربون", "يطلب المعلم من الطلبة رسم القلب كما يتخيلونه، ثم يسأل: هل يشبه قلوب بطاقات المعايدة؟ وما الذي يفعله القلب حقًا؟ (5 دقائق)", "1. الاستماع إلى القلب: ينظّم الطلبة ثنائيات لاستخدام أنبوب الكرتون للاستماع إلى صدر الزميل، والطلبة يستمعون ويصفون الصوت ويتوقعون مصدره (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض بنية القلب: يعرض المعلم مقطعًا مرئيًا/صورة للقلب ص 20، ويوضح موقعه في الصدر يسارًا وحمايته بالضلوع وحجمه بحجم القبضة، والطلبة يضمّون قبضاتهم لتقدير الحجم ويحددون الموقع على أجسامهم (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. نموذج المضخة: يضغط المعلم عبوة بلاستيكية مملوءة بالماء ذات فوهة ضيقة ليحاكي انقباض القلب، والطلبة يلاحظون اندفاع الماء ويربطونه بضخ الدم عند انقباض عضلة القلب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. جانبا القلب والأوعية: يشرح المعلم بالصورة ص 20–21: الجانب الأيسر يضخ الدم المحمّل بالأكسجين للجسم، والأيمن يضخ الدم إلى الرئتين؛ والدم يحمل الغذاء والأكسجين والفضلات، والطلبة يلوّنون مخططًا بسيطًا: الأحمر للدم المؤكسج والأزرق لغير المؤكسج (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محاكاة الدورة الدموية: يرسم المعلم دائرتين على الأرض (الرئتان – القلب – بقية الجسم) ويوزّع الأدوار، والطلبة يحملون الكرات الحمراء (أكسجين) من الرئتين إلى الجسم والزرقاء (ثاني أكسيد الكربون) من الجسم إلى الرئتين مرورًا بالقلب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أسئلة الكتاب وتمرين 1-2: يناقش المعلم الأسئلة 1–3 ص 21 ويوجّه تمرين 1-2 في كتاب النشاط ص 17، والطلبة يجيبون كتابيًا ويتبادلون التصحيح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: لعب الأدوار والمحاكاة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يقع القلب؟ وما الذي يحميه؟\n   الإجابة النموذجية: في الصدر مائلًا إلى اليسار، وتحميه الضلوع.\n2. [مستوى التطبيق] ما الذي يمثّله الضغط على العبوة في النموذج؟\n   الإجابة النموذجية: انقباض عضلة القلب الذي يدفع الدم بقوة.\n3. [مستوى الاستدلال] لماذا يُعدّ القلب عضلة «فريدة»؟\n   الإجابة النموذجية: لأنه ينقبض وينبسط من تلقاء نفسه باستمرار طوال حياة الإنسان دون توقف.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما مكونات الجهاز الدوري؟\n   الإجابة النموذجية: القلب والدم والأوعية الدموية.\n5. [مستوى التطبيق] ماذا يحمل الدم إلى أجزاء الجسم؟ وماذا يحمل منها؟\n   الإجابة النموذجية: يحمل الغذاء والأكسجين إليها، ويحمل الفضلات (مثل ثاني أكسيد الكربون) منها.\n6. [مستوى الاستدلال] لماذا يضخ القلب الدم إلى الرئتين قبل ضخه إلى أنحاء الجسم؟\n   الإجابة النموذجية: ليأخذ الدم الأكسجين من الرئتين ويتخلص من ثاني أكسيد الكربون، ثم يُضخ محمّلًا بالأكسجين إلى الجسم.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما وظيفة القلب؟\n   الإجابة النموذجية: ضخ الدم إلى جميع أجزاء الجسم.\n2. [مستوى التطبيق] ما سبب الصوت الذي سمعته عبر الأنبوب؟\n   الإجابة النموذجية: دقات القلب الناتجة عن انقباض عضلته أثناء ضخ الدم.\n3. [مستوى الاستدلال] اقترح طريقة أخرى لتمثيل عمل القلب بأدوات بسيطة.\n   الإجابة النموذجية: مثل الضغط على بالون مملوء بالماء متصل بأنبوب، أو كرة مطاطية تضخ الماء.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] أي جانبي القلب يضخ الدم المحمّل بالأكسجين إلى الجسم؟\n   الإجابة النموذجية: الجانب الأيسر.\n5. [مستوى التطبيق] رتّب مسار الدم: بقية الجسم – الرئتان – القلب (مرتين).\n   الإجابة النموذجية: بقية الجسم ← القلب ← الرئتان ← القلب ← بقية الجسم.\n6. [مستوى الاستدلال] لو انسدّ وعاء دموي يغذي عضلة القلب، ماذا تتوقع أن يحدث؟\n   الإجابة النموذجية: لا تصل الأكسجين والغذاء إلى عضلة القلب فتتضرر وقد تحدث نوبة قلبية.", "للطالب: قراءة كتاب الطالب ص 20، والاستماع لدقات القلب في المنزل بأنبوب كرتوني. لولي الأمر: يُرجى مشاركة الابن في التجربة ومناقشته في أهمية القلب.\nللطالب: حل تمرين 1-2 في كتاب النشاط ص 17 واجبًا منزليًا ومراجعة ص 20–21. لولي الأمر: يُرجى مناقشة الابن في أهمية الرياضة والغذاء الصحي لسلامة القلب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}, {"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 50–52 | دليل المعلم ص 27–28", "num": "الحصة الثالثة من 3", "focus": "كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي"}, "f": ["1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى (15 دقيقة)\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة (10 دقائق)\n\nمخرج تعليمي آخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج (15 دقيقة)", "1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى. ← فهم\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة. ← تحليل\nالمخرج الآخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج. ← تقييم", "- التعلم التشاركي\n- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: ورقتا العمل 1-2أ و1-2ب في كتاب النشاط", "- الدورة الدموية الصغرى\n- الدليل العلمي\n- الملاحظة\n- التجربة\n- الأوعية الدموية", "يعرض المعلم معتقدًا قديمًا: «الكبد يصنع دمًا جديدًا كل مرة، والجسم يستهلك الدم»، ويسأل: كيف يمكن أن نتأكد أن هذه الفكرة خاطئة؟ (5 دقائق)", "1. ورقة العمل 1-2أ: ابن النفيس: يوزّع المجموعات لقراءة ورقة العمل 1-2أ (كتاب النشاط ص 50) ويطرح أسئلة موجّهة، والطلبة يقرؤون ويجيبون: ماذا كان يُعتقد؟ وما الذي اكتشفه ابن النفيس عن الرئتين؟ (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ورقة العمل 1-2ب: ويليام هارفي: يوجّه المعلم قراءة ورقة العمل 1-2ب (ص 51–52) ويبرز: ملاحظة مضخات الماء، والتجارب المتكررة، وحساب كمية الدم، والطلبة يجيبون عن أسئلة الورقة ويحددون الأدلة التي استخدمها هارفي (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مقارنة ومناقشة: يقود المعلم مقارنة بين الإسهامين في جدول على السبورة، ويطرح سؤال التحدي عن النوبة القلبية، والطلبة يكملون الجدول ويعرضون إجاباتهم (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – قلب ينبض بعمان: تحدد الأزواج موقع القلب وحجمه بقبضة اليد، وتصف عمله مضخةً، ثم تكتب عبارة: قلبي ينبض بحب عمان، مع معلومة عن صحة القلب (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا كان يُعتقد قديمًا عن مصدر الدم؟\n   الإجابة النموذجية: أن الدم يتولّد في الكبد ثم ينتقل إلى القلب فيسري في الأوعية إلى الأعضاء.\n2. [مستوى التطبيق] ما الذي يحدث للدم في الرئتين بحسب اكتشاف ابن النفيس؟\n   الإجابة النموذجية: يأخذ الأكسجين ويتخلص من ثاني أكسيد الكربون فيتحول لونه من أحمر قاتم إلى أحمر قانٍ.\n3. [مستوى الاستدلال] لماذا كرّر هارفي تجاربه؟\n   الإجابة النموذجية: للتأكد من أن ملاحظاته ونتائجه دقيقة وصحيحة وليست خطأً عابرًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الدورة التي اكتشفها ابن النفيس؟\n   الإجابة النموذجية: الدورة الدموية الصغرى (بين القلب والرئتين).\n2. [مستوى التطبيق] كيف أثبت هارفي أن الجسم لا يستهلك الدم؟\n   الإجابة النموذجية: لاحظ أن القلب يضخ في ساعة أكثر من وزن الجسم دمًا، فلا يمكن أن يُصنع ويُستهلك كل هذا، بل يدور الدم في الجسم.\n3. [مستوى الاستدلال] ما الذي تتعلمه من قصتي ابن النفيس وهارفي عن طريقة عمل العلماء؟\n   الإجابة النموذجية: العلماء يجمعون الأدلة بالملاحظة والقياس والتجربة المتكررة ويفكرون بإبداع، وقد يصححون الأفكار القديمة.", "للطالب: إكمال إجابات ورقتي العمل 1-2أ و1-2ب (كتاب النشاط ص 50–52)، والبحث عن معلومة إضافية عن ابن النفيس. لولي الأمر: يُرجى تشجيع الابن على القراءة عن علماء المسلمين وإسهاماتهم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}], "comb": ["الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد (10 دقائق)\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم (5 دقائق)\n3. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية (5 دقائق)\n4. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم (10 دقائق)\n\nمخرج تعليمي آخر:\nيمثّل عمل القلب باستخدام نموذج مضخة بسيط (5 دقائق)\nيفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم (5 دقائق)\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى (15 دقيقة)\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة (10 دقائق)\n\nمخرج تعليمي آخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج (15 دقيقة)", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد. ← تذكر\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم. ← فهم\n3. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية. ← تذكر\n4. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم. ← فهم\nالمخرج الآخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط. ← تطبيق\nالمخرج الآخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم. ← تحليل\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى. ← فهم\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة. ← تحليل\nالمخرج الآخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج. ← تقييم", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- فكّر – زاوج – شارك\n- لعب الأدوار والمحاكاة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n- التعلم التشاركي\n- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: أنبوب كرتوني (بكرة مناديل) وعبوة بلاستيكية مرنة مملوءة بالماء\n- صورة توضيحية\n- أخرى: كرات حمراء وزرقاء وأوعية فارغة وطباشير لرسم مخطط الدورة على الأرض\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: ورقتا العمل 1-2أ و1-2ب في كتاب النشاط", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n- القلب\n- عضلة القلب\n- الانقباض والانبساط\n- دقات القلب\n- الدم\n- الجهاز الدوري\n- الدورة الدموية\n- الأوعية الدموية\n- الأكسجين\n- ثاني أكسيد الكربون\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n- الدورة الدموية الصغرى\n- الدليل العلمي\n- الملاحظة\n- التجربة\n- الأوعية الدموية", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nيطلب المعلم من الطلبة رسم القلب كما يتخيلونه، ثم يسأل: هل يشبه قلوب بطاقات المعايدة؟ وما الذي يفعله القلب حقًا؟ (5 دقائق)\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nيعرض المعلم معتقدًا قديمًا: «الكبد يصنع دمًا جديدًا كل مرة، والجسم يستهلك الدم»، ويسأل: كيف يمكن أن نتأكد أن هذه الفكرة خاطئة؟ (5 دقائق)", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة — زمن الحصة 40 دقيقة\n1. الاستماع إلى القلب: ينظّم الطلبة ثنائيات لاستخدام أنبوب الكرتون للاستماع إلى صدر الزميل، والطلبة يستمعون ويصفون الصوت ويتوقعون مصدره (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض بنية القلب: يعرض المعلم مقطعًا مرئيًا/صورة للقلب ص 20، ويوضح موقعه في الصدر يسارًا وحمايته بالضلوع وحجمه بحجم القبضة، والطلبة يضمّون قبضاتهم لتقدير الحجم ويحددون الموقع على أجسامهم (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. نموذج المضخة: يضغط المعلم عبوة بلاستيكية مملوءة بالماء ذات فوهة ضيقة ليحاكي انقباض القلب، والطلبة يلاحظون اندفاع الماء ويربطونه بضخ الدم عند انقباض عضلة القلب (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. جانبا القلب والأوعية: يشرح المعلم بالصورة ص 20–21: الجانب الأيسر يضخ الدم المحمّل بالأكسجين للجسم، والأيمن يضخ الدم إلى الرئتين؛ والدم يحمل الغذاء والأكسجين والفضلات، والطلبة يلوّنون مخططًا بسيطًا: الأحمر للدم المؤكسج والأزرق لغير المؤكسج (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محاكاة الدورة الدموية: يرسم المعلم دائرتين على الأرض (الرئتان – القلب – بقية الجسم) ويوزّع الأدوار، والطلبة يحملون الكرات الحمراء (أكسجين) من الرئتين إلى الجسم والزرقاء (ثاني أكسيد الكربون) من الجسم إلى الرئتين مرورًا بالقلب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. أسئلة الكتاب وتمرين 1-2: يناقش المعلم الأسئلة 1–3 ص 21 ويوجّه تمرين 1-2 في كتاب النشاط ص 17، والطلبة يجيبون كتابيًا ويتبادلون التصحيح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي — زمن الحصة 40 دقيقة\n1. ورقة العمل 1-2أ: ابن النفيس: يوزّع المجموعات لقراءة ورقة العمل 1-2أ (كتاب النشاط ص 50) ويطرح أسئلة موجّهة، والطلبة يقرؤون ويجيبون: ماذا كان يُعتقد؟ وما الذي اكتشفه ابن النفيس عن الرئتين؟ (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ورقة العمل 1-2ب: ويليام هارفي: يوجّه المعلم قراءة ورقة العمل 1-2ب (ص 51–52) ويبرز: ملاحظة مضخات الماء، والتجارب المتكررة، وحساب كمية الدم، والطلبة يجيبون عن أسئلة الورقة ويحددون الأدلة التي استخدمها هارفي (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مقارنة ومناقشة: يقود المعلم مقارنة بين الإسهامين في جدول على السبورة، ويطرح سؤال التحدي عن النوبة القلبية، والطلبة يكملون الجدول ويعرضون إجاباتهم (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – قلب ينبض بعمان: تحدد الأزواج موقع القلب وحجمه بقبضة اليد، وتصف عمله مضخةً، ثم تكتب عبارة: قلبي ينبض بحب عمان، مع معلومة عن صحة القلب (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يقع القلب؟ وما الذي يحميه؟\n   الإجابة النموذجية: في الصدر مائلًا إلى اليسار، وتحميه الضلوع.\n2. [مستوى التطبيق] ما الذي يمثّله الضغط على العبوة في النموذج؟\n   الإجابة النموذجية: انقباض عضلة القلب الذي يدفع الدم بقوة.\n3. [مستوى الاستدلال] لماذا يُعدّ القلب عضلة «فريدة»؟\n   الإجابة النموذجية: لأنه ينقبض وينبسط من تلقاء نفسه باستمرار طوال حياة الإنسان دون توقف.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما مكونات الجهاز الدوري؟\n   الإجابة النموذجية: القلب والدم والأوعية الدموية.\n5. [مستوى التطبيق] ماذا يحمل الدم إلى أجزاء الجسم؟ وماذا يحمل منها؟\n   الإجابة النموذجية: يحمل الغذاء والأكسجين إليها، ويحمل الفضلات (مثل ثاني أكسيد الكربون) منها.\n6. [مستوى الاستدلال] لماذا يضخ القلب الدم إلى الرئتين قبل ضخه إلى أنحاء الجسم؟\n   الإجابة النموذجية: ليأخذ الدم الأكسجين من الرئتين ويتخلص من ثاني أكسيد الكربون، ثم يُضخ محمّلًا بالأكسجين إلى الجسم.\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا كان يُعتقد قديمًا عن مصدر الدم؟\n   الإجابة النموذجية: أن الدم يتولّد في الكبد ثم ينتقل إلى القلب فيسري في الأوعية إلى الأعضاء.\n2. [مستوى التطبيق] ما الذي يحدث للدم في الرئتين بحسب اكتشاف ابن النفيس؟\n   الإجابة النموذجية: يأخذ الأكسجين ويتخلص من ثاني أكسيد الكربون فيتحول لونه من أحمر قاتم إلى أحمر قانٍ.\n3. [مستوى الاستدلال] لماذا كرّر هارفي تجاربه؟\n   الإجابة النموذجية: للتأكد من أن ملاحظاته ونتائجه دقيقة وصحيحة وليست خطأً عابرًا.", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما وظيفة القلب؟\n   الإجابة النموذجية: ضخ الدم إلى جميع أجزاء الجسم.\n2. [مستوى التطبيق] ما سبب الصوت الذي سمعته عبر الأنبوب؟\n   الإجابة النموذجية: دقات القلب الناتجة عن انقباض عضلته أثناء ضخ الدم.\n3. [مستوى الاستدلال] اقترح طريقة أخرى لتمثيل عمل القلب بأدوات بسيطة.\n   الإجابة النموذجية: مثل الضغط على بالون مملوء بالماء متصل بأنبوب، أو كرة مطاطية تضخ الماء.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] أي جانبي القلب يضخ الدم المحمّل بالأكسجين إلى الجسم؟\n   الإجابة النموذجية: الجانب الأيسر.\n5. [مستوى التطبيق] رتّب مسار الدم: بقية الجسم – الرئتان – القلب (مرتين).\n   الإجابة النموذجية: بقية الجسم ← القلب ← الرئتان ← القلب ← بقية الجسم.\n6. [مستوى الاستدلال] لو انسدّ وعاء دموي يغذي عضلة القلب، ماذا تتوقع أن يحدث؟\n   الإجابة النموذجية: لا تصل الأكسجين والغذاء إلى عضلة القلب فتتضرر وقد تحدث نوبة قلبية.\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الدورة التي اكتشفها ابن النفيس؟\n   الإجابة النموذجية: الدورة الدموية الصغرى (بين القلب والرئتين).\n2. [مستوى التطبيق] كيف أثبت هارفي أن الجسم لا يستهلك الدم؟\n   الإجابة النموذجية: لاحظ أن القلب يضخ في ساعة أكثر من وزن الجسم دمًا، فلا يمكن أن يُصنع ويُستهلك كل هذا، بل يدور الدم في الجسم.\n3. [مستوى الاستدلال] ما الذي تتعلمه من قصتي ابن النفيس وهارفي عن طريقة عمل العلماء؟\n   الإجابة النموذجية: العلماء يجمعون الأدلة بالملاحظة والقياس والتجربة المتكررة ويفكرون بإبداع، وقد يصححون الأفكار القديمة.", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nللطالب: قراءة كتاب الطالب ص 20، والاستماع لدقات القلب في المنزل بأنبوب كرتوني. لولي الأمر: يُرجى مشاركة الابن في التجربة ومناقشته في أهمية القلب.\nللطالب: حل تمرين 1-2 في كتاب النشاط ص 17 واجبًا منزليًا ومراجعة ص 20–21. لولي الأمر: يُرجى مناقشة الابن في أهمية الرياضة والغذاء الصحي لسلامة القلب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2\n\nالحصة 2: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nللطالب: إكمال إجابات ورقتي العمل 1-2أ و1-2ب (كتاب النشاط ص 50–52)، والبحث عن معلومة إضافية عن ابن النفيس. لولي الأمر: يُرجى تشجيع الابن على القراءة عن علماء المسلمين وإسهاماتهم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}, {"id": "1-3", "title": "دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 22–23 | كتاب النشاط ص 18، 53–56 | دليل المعلم ص 28–32", "n": 2, "per": [{"h": {"lesson": "1-3 دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 22–23 | دليل المعلم ص 28–31", "num": "الحصة الأولى من 3", "focus": "الفرق بين دقات القلب والنبض وقياس معدل النبض"}, "f": ["1. يميّز بين دقات القلب والنبض (5 دقائق)\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول (10 دقائق)\n3. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية (5 دقائق)\n4. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة (10 دقائق)\n\nمخرج تعليمي آخر:\nيحسب متوسط معدل النبض من القياسات المتكررة (5 دقائق)\nيحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه (5 دقائق)", "1. يميّز بين دقات القلب والنبض. ← فهم\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول. ← تطبيق\n3. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية. ← تطبيق\n4. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة. ← تطبيق\nالمخرج الآخر: يحسب متوسط معدل النبض من القياسات المتكررة. ← تطبيق\nالمخرج الآخر: يحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه. ← تقييم", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ساعة إيقاف أو ساعة بعقرب ثوانٍ، وكرات ورقية، ساعة إيقاف، ورقة العمل 1-3ب، مساطر\n- الأقلام", "- دقات القلب\n- النبض\n- معدل النبض\n- المتوسط\n- تكرار القياس\n- التنبؤ\n- العامل المؤثر\n- التمثيل البياني بالأعمدة\n- الدليل\n- الاستنتاج", "يعطي المعلم كل طالب ورقة يكوّرها، ويعدّ حتى 90 في دقيقة، ويضغط الطلبة الكرة مع كل عدّة؛ ثم يسأل: هل تعبت يدك؟ القلب يفعل ذلك دون توقف! (5 دقائق)", "1. النبض ومواضعه: يشرح المعلم أن النبض موجة سببها ضغط الدم المندفع من القلب، ويبيّن مواضعه: المعصم وجانب العنق، وعدم استخدام الإبهام، والطلبة يتحسسون النبض في المعصم والعنق (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. نشاط 1-3: قياس النبض: ينظم مجموعات (4–5)، ويقيس نبضه ونبض متطوع على السبورة لتوضيح الاختلاف، والطلبة يعدّون نبضاتهم في دقيقة ثلاث مرات ويسجلون في جدول ويقارنون مع زملائهم (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حساب المتوسط ومناقشة الأسئلة: يوضح المعلم حساب المتوسط (جمع القياسات ÷ عددها) ويناقش الأسئلة 1–3 ص 23، والطلبة يحسبون متوسطهم ويفسرون اختلاف القياسات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. كتابة التنبؤ: يطرح المعلم السؤال: ماذا سيحدث لنبضك بعد الجري دقيقة؟ ويطلب تنبؤًا مكتوبًا مع تبرير، والطلبة يكتبون تنبؤاتهم ومبرراتهم (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تنفيذ الاستقصاء: يوجّه المعلم قياس النبض في الراحة ثم الجري في المكان دقيقة ثم القياس مباشرة، مع مراعاة السلامة، والطلبة يقيسون ويسجلون في جدول «قبل/بعد التمرين» (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ورقة العمل 1-3ب: التمثيل بالأعمدة: يشرح المعلم معايير رسم الأعمدة: عنوان، محاور، أعمدة بعرض واحد وارتفاع صحيح، والطلبة يمثلون بيانات المجموعة بالأعمدة باستخدام المسطرة (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الاستنتاج والتقويم: يسأل المعلم: هل تدعم نتائجك تنبؤك؟ ولماذا يزيد النبض؟ والطلبة يكتبون استنتاجًا ويجيبون عن التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يمكنك أن تشعر بنبضك بسهولة؟\n   الإجابة النموذجية: في المعصم وعلى جانبي العنق.\n2. [مستوى التطبيق] لماذا لا نستخدم الإبهام لقياس النبض؟\n   الإجابة النموذجية: لأن للإبهام نبضه الخاص فيختلط بنبض الشخص المقيس.\n3. [مستوى الاستدلال] قاس طالب نبضه: 88، 92، 90. احسب المتوسط، ولماذا اختلفت القياسات؟\n   الإجابة النموذجية: المتوسط = (88+92+90)÷3 = 90 نبضة/دقيقة؛ تختلف لتغيّر النشاط أو القلق أو أخطاء العدّ.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما العامل الذي غيّرناه في هذا الاستقصاء؟\n   الإجابة النموذجية: ممارسة الرياضة (النشاط البدني).\n5. [مستوى التطبيق] ماذا حدث لمعدل النبض بعد التمرين؟\n   الإجابة النموذجية: ازداد معدل النبض.\n6. [مستوى الاستدلال] هل تدعم بياناتك تنبؤك؟ استشهد برقمين من جدولك.\n   الإجابة النموذجية: نعم إذا كان النبض بعد التمرين أعلى من قبله (مثل 90 قبل و130 بعد)، ويُقبل التبرير بالأرقام.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين دقات القلب والنبض؟\n   الإجابة النموذجية: دقات القلب انقباض عضلة القلب لضخ الدم، والنبض هو الضغط الناتج عن اندفاع الدم في الأوعية ونشعر به في المعصم والعنق.\n2. [مستوى التطبيق] كم يبلغ تقريبًا معدل نبض طفل في حالة الراحة؟\n   الإجابة النموذجية: نحو 90 نبضة في الدقيقة.\n3. [مستوى الاستدلال] لماذا نكرر قياس النبض أكثر من مرة؟\n   الإجابة النموذجية: لنحصل على نتائج أكثر موثوقية ونكتشف الأخطاء ونحسب المتوسط.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] لماذا يزداد معدل النبض أثناء الرياضة؟\n   الإجابة النموذجية: لأن العضلات تحتاج مزيدًا من الغذاء والأكسجين فيضخ القلب الدم بسرعة أكبر.\n5. [مستوى التطبيق] اذكر معيارين لرسم تمثيل بياني بالأعمدة صحيح.\n   الإجابة النموذجية: عنوان مناسب، أعمدة متساوية العرض بارتفاعات صحيحة وتسميات واضحة.\n6. [مستوى الاستدلال] اقترح عاملًا آخر قد يغيّر معدل النبض وكيف تختبره.\n   الإجابة النموذجية: مثل القلق أو العمر أو المرض؛ نقيس النبض لأشخاص في حالتين مختلفتين مع تثبيت بقية العوامل.", "للطالب: قياس النبض في المنزل بعد الغداء وقبل النوم وتسجيل النتائج لمقارنتها في الحصة القادمة (كتاب الطالب ص 22). لولي الأمر: يُرجى مساعدة الابن في توقيت الدقيقة أثناء القياس.\nللطالب: إكمال ورقة العمل 1-3ب (كتاب النشاط ص 55) إن لم تكتمل، ومراجعة ص 23. لولي الأمر: يُرجى تشجيع الابن على ممارسة الرياضة يوميًا وقياس نبضه قبلها وبعدها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}, {"h": {"lesson": "1-3 دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 23 | كتاب النشاط ص 18، 53–54، 56 | دليل المعلم ص 30–32", "num": "الحصة الثالثة من 3", "focus": "تحليل بيانات النبض: الأنماط والنتائج غير الملائمة"}, "f": ["1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط (10 دقائق)\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه (15 دقيقة)\n\nمخرج تعليمي آخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط (15 دقيقة)", "1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط. ← تحليل\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه. ← تحليل\nالمخرج الآخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط. ← تطبيق", "- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقتا العمل 1-3أ و1-3ج", "- النمط\n- النتيجة غير الملائمة للنمط\n- التمثيل الخطي\n- معدل دقات القلب", "يعرض المعلم: «معدل نبض الفيل نحو 30 نبضة في الدقيقة، والفأر نحو 500!» ويسأل: ما الذي قد يفسر هذا الفرق الكبير؟ (5 دقائق)", "1. تمرين 1-3: تحليل بيانات مجموعة: يوجّه المعلم حل تمرين 1-3 (كتاب النشاط ص 18): حساب المتوسط وتحديد النتيجة الشاذة (نبض أحمد 110)، والطلبة يحسبون المتوسط ويفسرون سبب النتيجة الشاذة (قيس أثناء الرياضة) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 1-3أ أو 1-3ج (حسب المستوى): يوزّع المعلم 1-3أ (مقارنة دقات قلوب الحيوانات) للمستوى المرتفع و1-3ج (تمثيل خطي) للبقية مع الدعم، والطلبة يرتبون الكائنات ويستخرجون النمط، أو يرسمون التمثيل الخطي ويقرؤونه (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. عرض الاستنتاجات: يقود المعلم مناقشة: الكائنات الكبيرة دقات قلبها أبطأ؛ ولماذا نعيد القياس عند نتيجة شاذة، وتعرض المجموعات استنتاجاتها وتتنبأ بنبض الحصان وذبابة الفيل (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – نبض بعد الرزحة: يقيس الأطفال نبضهم قبل أداء حركة رقصة شعبية عمانية كالرزحة وبعدها، ويقارنون القراءات ويفسرون زيادة النبض (5 دقائق)\nالاستراتيجيات: التعلم بالاستقصاء.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في بيانات مجموعة كانت أغلب القيم قرب 90 وقيمة واحدة 110. ماذا نسمي هذه القيمة؟\n   الإجابة النموذجية: نتيجة لا تلائم النمط (نتيجة شاذة).\n2. [مستوى التطبيق] ما النمط بين حجم الحيوان وسرعة دقات قلبه؟\n   الإجابة النموذجية: كلما كان الحيوان أصغر كانت دقات قلبه أسرع.\n3. [مستوى الاستدلال] كيف نتصرف عند ظهور نتيجة لا تلائم النمط؟\n   الإجابة النموذجية: نفحص طريقة القياس ونعيده للتأكد من عدم وجود خطأ ونبحث عن سبب مختلف للظروف.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أيهما دقات قلبه أسرع: الحوت الأزرق أم طائر الطنان؟\n   الإجابة النموذجية: طائر الطنان.\n2. [مستوى التطبيق] تنبأ: هل دقات قلب الحصان أسرع أم أبطأ من دقات قلب القطة؟ ولماذا؟\n   الإجابة النموذجية: أبطأ؛ لأن الحصان أكبر حجمًا والكائنات الكبيرة دقات قلبها أبطأ.\n3. [مستوى الاستدلال] لماذا تنخفض دقات قلب الخفاش كثيرًا أثناء السبات؟\n   الإجابة النموذجية: لأن عملياته الحيوية تبطؤ ويحتاج قليلًا جدًا من الغذاء والأكسجين وهو غير نشط.", "للطالب: إكمال ورقة العمل التي بدأها (1-3أ ص 53–54 أو 1-3ج ص 56) ومراجعة ما تعلمه في ص 23. لولي الأمر: يُرجى مناقشة الابن في سبب ارتفاع النبض عند الركض أو الخوف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}], "comb": ["الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n1. يميّز بين دقات القلب والنبض (5 دقائق)\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول (10 دقائق)\n3. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية (5 دقائق)\n4. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة (10 دقائق)\n\nمخرج تعليمي آخر:\nيحسب متوسط معدل النبض من القياسات المتكررة (5 دقائق)\nيحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه (5 دقائق)\n\nالحصة 2: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\n1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط (10 دقائق)\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه (15 دقيقة)\n\nمخرج تعليمي آخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط (15 دقيقة)", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n1. يميّز بين دقات القلب والنبض. ← فهم\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول. ← تطبيق\n3. يتنبأ بأثر النشاط البدني على معدل النبض بن
