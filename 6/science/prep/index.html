رة الذكية\n- السبورة التقليدية\n- أخرى: بطاقات ملوّنة لمحاكاة أعداد المنتجات والفرائس والمفترسات\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-3 وورقة العمل 2-3 في كتاب النشاط\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: أوراق ملصقات كبيرة", "الحصة 1: المفترس والفريسة\n- المفترس\n- الفريسة\n- الكائن المستهلك\n- الحيوانات آكلة النباتات\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n- سلسلة غذائية\n- المفترس الأعلى\n- النمط\n- الكائن المنتج\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- أعداد الكائنات\n- التوازن\n- الآثار المترتبة\n- التنبؤ\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- السافانا\n- شجرة الأكاسيا\n- غزال الإمبالا\n- الحمار الوحشي\n- الضبع\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- النبات آكل الحشرات\n- المغذيات\n- التربة الفقيرة\n- المنتج والمستهلك", "الحصة 1: المفترس والفريسة\nيعرض المعلم صور حيوانات مختلطة، ويسأل: أي هذه الحيوانات يأكل حيوانًا آخر؟ وأيها يُؤكل؟ (5 دقائق)\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\nيكتب المعلم على السبورة: «نباتات ← جراد ← سحلية ← صقر» ويسأل: كم مفترسًا في هذه السلسلة؟ (5 دقائق)\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nيوزع المعلم 20 بطاقة خضراء (نباتات) و6 صفراء (آكلات نبات) وبطاقة حمراء واحدة (مفترس)، ويسأل: لماذا تتوقع هذه الأعداد؟ (5 دقائق)\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nيعرض المعلم صورة للسافانا ويسأل: ما أول كائن تراه في هذه الصورة يصنع غذاءه بنفسه؟ (5 دقائق)\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nيعرض المعلم مقطعًا قصيرًا لنبات صائد الذباب وهو يُطبق على ذبابة، ويسأل: هل هذا نبات أم حيوان مفترس؟ (5 دقائق)", "الحصة 1: المفترس والفريسة — زمن الحصة 40 دقيقة\n\n1. المصطلحات والأمثلة: يقدم المعلم المفترس والفريسة بأمثلة ص 38: البومة والفأر، الثعبان، الضفدع والحشرات، والطلبة يكتبون التعريفين ويضيفون أمثلة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. لعبة «مفترس أو فريسة؟»: يعرض المعلم بطاقات حيوانات تباعًا، ومنها ما يكون مفترسًا وفريسة معًا (السحلية)، والطلبة يرفعون بطاقة (مفترس/فريسة/كلاهما) ويبررون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. طرق الافتراس: يناقش المعلم: السم لدى بعض الثعابين، الابتلاع، الصيد ليلًا للبومة، والطلبة يرسمون حيوانًا مفترسًا ويكتبون طريقة صيده (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس — زمن الحصة 40 دقيقة\n\n1. السؤال 1 ص 39: يوجه المعلم الربط بين المفترسات الخمسة وفرائسها في الشكل، والطلبة يصلون بين كل مفترس وفريسته (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. سلاسل معلّقة: يوزع المعلم بطاقات كائنات على المجموعات لبناء سلاسل معلّقة بالخيوط تبدأ بالمنتج، والطلبة يبنون سلسلتين ويحددون المنتج والفريسة والمفترس (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. السؤالان 3 و4: النمط: يقود المعلم المقارنة بين سلاسل المجموعات، والطلبة يستنتجون النمط: منتج ← فريسة (آكل نبات) ← مفترس (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة — زمن الحصة 40 دقيقة\n\n1. محاكاة الهرم الغذائي: يدير المعلم جولات: كل آكل نبات يحتاج 3 نباتات، والمفترس يحتاج آكلي نبات ليبقى، والطلبة يجرون الجولات ويسجلون من بقي ومن هلك (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ماذا لو؟: يطرح المعلم مواقف: اختفاء المفترس؛ اختفاء العشب؛ زيادة الجراد، والطلبة يتنبؤون بالنتائج في ثنائيات ويعرضونها (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تصحيح المفاهيم الخاطئة: يوضح المعلم أن المفترس يأكل بعض الكائنات لا كلها، وأن الفرائس أكثر عددًا، والطلبة يكتبون عبارتين صحيحتين في الدفتر (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3) — زمن الحصة 40 دقيقة\n\n1. تمرين 2-3 (كتاب النشاط ص 27–28): يوجه المعلم الحل: المنتجات (الأكاسيا، الحشائش)، آكلات النبات (الإمبالا، النمل الأبيض، البابون، الحمار الوحشي)، المفترسات (الأسد، الضبع، النمر)، ورسم السلاسل، والطلبة يحلون فرديًا ثم يقارنون مع زميل (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ورقة العمل 2-3 (ص 63): يوجه المعلم إكمال الفراغات بالمصطلحات، مع دعم المتعثرين، والطلبة يكملون النص عن المنتجات والمستهلكات والمفترس والفريسة (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. التصحيح الجماعي: يعرض المعلم الإجابات ويناقش السلسلة الأطول: حشائش ← حمار وحشي ← ضبع ← أسد، والطلبة يصححون بالقلم الأخضر (تقييم ذاتي) (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة — زمن الحصة 40 دقيقة\n\n1. سؤال التحدي ص 39: يشرح المعلم: ينمو في تربة فقيرة المغذيات، يصنع السكر من ضوء الشمس كغيره، ويأخذ المغذيات من الحشرات؛ أمثلة: نبات الإبريق والدروسيرا، والطلبة يناقشون: هل هو منتج أم مستهلك؟ ولماذا لا يلائم النمط؟ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ملصق السلسلة المحلية: يحدد المعلم معايير الملصق: سلسلة من 3–4 حلقات من البيئة العُمانية، تسميات، ألوان، عنوان، وتصمم المجموعات الملصق وتحدد المنتج والفريسة والمفترس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. جولة المعرض: يدير المعلم جولة تقييم الأقران بالمعايير، والطلبة يقيّمون ملصقات زملائهم ويقدمون ملاحظة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. غلق الدرس – مفترس وفريسة في ظفار: تمثل المجموعات علاقات مفترس وفريسة في بيئة عمانية كالنمر العربي في جبال ظفار، وتتحدث عن حمايته من الانقراض (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: المفترس والفريسة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالمفترس؟\n   الإجابة النموذجية: حيوان مستهلك يصطاد الحيوانات الأخرى ويتغذى عليها.\n2. [مستوى التطبيق] في الزوج (البومة، الفأر)، من الفريسة؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] لماذا يمكن أن تكون السحلية مفترسًا وفريسة في الوقت نفسه؟\n   الإجابة النموذجية: لأنها تأكل الجراد فتكون مفترسًا، ويأكلها الصقر فتكون فريسة.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] بماذا يجب أن تبدأ أي سلسلة غذائية ترسمها؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n2. [مستوى التطبيق] في السلسلة: عشب ← جرادة ← سحلية ← صقر، ما الفريسة الأولى؟\n   الإجابة النموذجية: الجرادة.\n3. [مستوى الاستدلال] ما النمط الذي تسلكه جميع السلاسل التي رسمتموها؟\n   الإجابة النموذجية: تبدأ بمنتج يتغذى عليه مستهلك (فريسة) ثم يأكله مفترس.\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أيهما أكثر عددًا في الموطن عادة: الفرائس أم المفترسات؟\n   الإجابة النموذجية: الفرائس.\n2. [مستوى التطبيق] ماذا يحدث لأعداد الجراد إذا اختفت السحالي؟\n   الإجابة النموذجية: تزداد أعداد الجراد.\n3. [مستوى الاستدلال] ثم ماذا يحدث للنباتات بعد زيادة الجراد؟ وما أثر ذلك على الجراد نفسه لاحقًا؟\n   الإجابة النموذجية: تقل النباتات لأن الجراد يأكلها، ثم يقل الجراد لنقص الغذاء.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر كائنين منتجين في السافانا.\n   الإجابة النموذجية: شجرة الأكاسيا والحشائش.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من التمرين.\n   الإجابة النموذجية: الأسد وغزال الإمبالا (أو الحمار الوحشي).\n3. [مستوى الاستدلال] اكتب سلسلة من أربع حلقات من التمرين.\n   الإجابة النموذجية: حشائش ← حمار وحشي ← ضبع ← أسد.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يصطاد النبات آكل الحشرات الذباب؟\n   الإجابة النموذجية: ليحصل على المغذيات من أجسامها لأن تربته فقيرة بالمغذيات.\n2. [مستوى التطبيق] هل يصنع النبات آكل الحشرات السكر بنفسه؟\n   الإجابة النموذجية: نعم، يصنعه من ضوء الشمس مثل النباتات الأخرى.\n3. [مستوى الاستدلال] لماذا يُعد هذا النبات مثالًا «غير ملائم للنمط»؟\n   الإجابة النموذجية: لأن النمط المعتاد أن الحيوان يأكل النبات، أما هنا فالنبات يصطاد الحيوان.", "الحصة 1: المفترس والفريسة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفريسة؟\n   الإجابة النموذجية: الحيوان الذي تصطاده الحيوانات المفترسة وتتغذى عليه.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من بيئتك.\n   الإجابة النموذجية: مثل: القط والفأر، أو الطائر والجرادة (تقبل الأمثلة الصحيحة).\n3. [مستوى الاستدلال] هل كل المستهلكات مفترسات؟ وضح بمثال.\n   الإجابة النموذجية: لا؛ فبعضها يتغذى على النباتات فقط مثل الخروف والجمل.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ارسم سلسلة غذائية بها مفترسان.\n   الإجابة النموذجية: مثل: نبات ← جراد ← سحلية ← صقر.\n2. [مستوى التطبيق] أي كائن في سلسلتك لا يأكله غيره؟\n   الإجابة النموذجية: المفترس الأعلى (مثل الصقر).\n3. [مستوى الاستدلال] لماذا لا تكون السلاسل الغذائية طويلة جدًا عادة؟\n   الإجابة النموذجية: لأن الطاقة تقل في كل حلقة فلا تكفي حلقات كثيرة (تقبل الإجابة المبسطة).\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج الموطن إلى نباتات كثيرة؟\n   الإجابة النموذجية: لأنها غذاء لعدد كبير من آكلات النباتات التي تعتمد عليها السلسلة كلها.\n2. [مستوى التطبيق] صحح العبارة: «الأسد يأكل كل الحيوانات الموجودة أسفل منه في السلسلة».\n   الإجابة النموذجية: الأسد يأكل بعض الحيوانات فقط وليس كلها.\n3. [مستوى الاستدلال] ماذا يحدث للنباتات إذا ماتت كل المفترسات فجأة؟ وضح بالتسلسل.\n   الإجابة النموذجية: تزداد آكلات النباتات فتأكل النباتات بكثرة حتى تقل، ثم تموت كثير من الحيوانات جوعًا.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أكمل: النباتات هي الكائنات الوحيدة التي تصنع ____ بنفسها.\n   الإجابة النموذجية: الغذاء.\n2. [مستوى التطبيق] ما الغاز الناتج عندما تصنع النباتات غذاءها؟\n   الإجابة النموذجية: الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعدّ الحمار الوحشي كائنًا مستهلكًا؟\n   الإجابة النموذجية: لأنه لا يصنع غذاءه بل يتغذى على العشب.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر اسم نبات آكل للحشرات.\n   الإجابة النموذجية: نبات الإبريق أو الدروسيرا أو صائد الذباب.\n2. [مستوى التطبيق] في ملصقك، حدد المنتج والمفترس الأعلى.\n   الإجابة النموذجية: تعتمد على الملصق، مثل: عشب (منتج) وصقر (مفترس أعلى).\n3. [مستوى الاستدلال] صمم سؤالًا لزملائك عن السلاسل الغذائية مع إجابته.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها الصحيحة.", "الحصة 1: المفترس والفريسة\nللطالب: قراءة كتاب الطالب ص 38 وكتابة ثلاثة أزواج (مفترس – فريسة). لولي الأمر: يُرجى مشاهدة مقطع وثائقي قصير عن الحياة البرية مع الابن.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\nللطالب: رسم سلسلة غذائية من موطنه المحلي بها مفترس وفريسته (السؤال 2 ص 39). لولي الأمر: يُرجى مساعدة الابن في معرفة أسماء حيوانات منطقته.\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nللطالب: التفكير في سؤال: ماذا يحدث لو اختفى النحل من الحدائق؟ وكتابة الإجابة في الدفتر. لولي الأمر: يُرجى مناقشة الابن في أهمية عدم الصيد الجائر.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nللطالب: حل تمرين 2-3 في كتاب النشاط ص 27–28 واجبًا منزليًا إن لم يكتمل. لولي الأمر: يُرجى تصحيح الواجب مع الابن وتشجيعه على تقييم عمله.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nللطالب: حل ورقة العمل 2-3 (كتاب النشاط ص 63) إن لم تكتمل، ومراجعة ص 38–39. لولي الأمر: يُرجى الاطلاع على الملصق الذي صممه الابن وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"id": "2-4", "title": "السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40–41 | كتاب النشاط ص 29–30 | دليل المعلم ص 53–55", "n": 5, "per": [{"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40 | دليل المعلم ص 54", "num": "الحصة الأولى من 5", "focus": "تنوع المواطن الطبيعية على كوكب الأرض"}, "f": ["1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط (15 دقيقة)\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن (5 دقائق)\nمخرج تعليمي آخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية (20 دقيقة)", "1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط. ← تذكر\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن. ← فهم\nالمخرج الآخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية. ← تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية", "- الموطن الطبيعي\n- المناخ\n- الغابة الاستوائية\n- الصحراء\n- السافانا", "يعرض المعلم أربع صور: صحراء، تحت سطح الماء، سهول قطبية، غابة؛ ويسأل: هل تنمو النباتات نفسها في كل هذه الأماكن؟ (5 دقائق)", "1. المناخ والموطن: يشرح المعلم ص 40: المناخ الحار الرطب للغابات الاستوائية، الحار الجاف للصحراء، الحار مع أمطار صيفية للسافانا، والطلبة يملؤون جدولًا: الموطن – المناخ – نباتات – حيوانات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رحلة على الكرة الأرضية: يحدد المعلم على المجسم مواقع الغابات الاستوائية والصحاري والسافانا في إفريقيا، والطلبة يحددون موقع عُمان ونوع موطنها الغالب (7 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مواطن عُمانية: يقود المعلم مناقشة: الجبال، السواحل، الصحراء، الأفلاج، والطلبة يذكرون كائنات من كل موطن عماني (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا توجد مواطن طبيعية عديدة على الأرض؟\n   الإجابة النموذجية: بسبب تعدد المناخات مما يؤدي إلى وجود نباتات مختلفة.\n2. [مستوى التطبيق] ما مناخ الغابة الاستوائية؟\n   الإجابة النموذجية: حار رطب.\n3. [مستوى الاستدلال] لماذا تختلف حيوانات الصحراء عن حيوانات الغابة الاستوائية؟\n   الإجابة النموذجية: لأن النباتات المختلفة تجذب حيوانات مختلفة، والمناخ يحدد الكائنات القادرة على العيش.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين طبيعيين مختلفين.\n   الإجابة النموذجية: مثل: الصحراء والمحيط (أو السافانا والغابة الاستوائية).\n2. [مستوى التطبيق] ما نوع الموطن الغالب في عُمان؟\n   الإجابة النموذجية: الصحراوي، مع مواطن جبلية وساحلية.\n3. [مستوى الاستدلال] توقع: أي الموطنين فيه تنوع نباتي أكبر، الغابة الاستوائية أم الصحراء؟ ولماذا؟\n   الإجابة النموذجية: الغابة الاستوائية؛ لوفرة الماء والحرارة المناسبة لنمو نباتات كثيرة.", "للطالب: قراءة كتاب الطالب ص 40 وجمع صور لثلاثة مواطن مختلفة. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور للمواطن الطبيعية في عُمان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40–41 | دليل المعلم ص 54–55", "num": "الحصة الثانية من 5", "focus": "السلاسل الغذائية في السافانا"}, "f": ["1. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا (15 دقيقة)\n2. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة (10 دقائق)\nمخرج تعليمي آخر: يتنبأ بأثر موت المفترسات في السافانا (15 دقيقة)", "1. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا. ← فهم\n2. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة. ← تطبيق\nالمخرج الآخر: يتنبأ بأثر موت المفترسات في السافانا. ← تحليل", "- التعلم التعاوني\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- السافانا\n- آكلات الأعشاب\n- الثور البري\n- الزرافة\n- المفترس", "يُسمع المعلم الطلبة صوت زئير أسد، ويسأل: أين يعيش؟ وماذا يأكل؟ ومن يأكل الطعام الذي يأكله الأسد؟ (5 دقائق)", "1. سلاسل السافانا ص 40: يناقش المعلم الأسئلة في الكتاب: المنتجات، المستهلكات، المفترسات وفرائسها، ماذا يأكل كل حيوان، والطلبة يحددون في الصورة ويكتبون في جدول (8 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. السؤال 2 ص 41: يوجه المعلم: ثلاثة حيوانات تأكل النباتات فقط، وسلسلتان بهما مفترس وفريسة، والطلبة يكتبون: الزرافة تأكل أوراق الأشجار، الثور البري والحمار الوحشي العشب؛ ويرسمون السلاسل (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تحدّث عن: موت المفترسات: يطرح المعلم سؤال «تحدّث عن» ص 41، والطلبة يتنبؤون بالتسلسل: زيادة آكلات العشب، نقص العشب، مجاعة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الكائنات المنتجة في السافانا؟\n   الإجابة النموذجية: العشب والأشجار.\n2. [مستوى التطبيق] ماذا تأكل الزرافة؟\n   الإجابة النموذجية: أوراق الأشجار.\n3. [مستوى الاستدلال] ارسم سلسلة غذائية تنتهي بالأسد.\n   الإجابة النموذجية: العشب ← الحمار الوحشي ← الأسد (أو أوراق الأشجار ← الزرافة ← الأسد).", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مفترسين من السافانا.\n   الإجابة النموذجية: الأسد والفهد (أو النمر والضبع).\n2. [مستوى التطبيق] ما الحيوانات التي تتغذى على الحيوانات الميتة؟\n   الإجابة النموذجية: النسور.\n3. [مستوى الاستدلال] ماذا سيحدث للعشب إذا ماتت فجأة كل المفترسات؟\n   الإجابة النموذجية: سيقل كثيرًا لأن أعداد آكلات العشب ستزداد وتأكله.", "للطالب: رسم سلسلتين غذائيتين من السافانا في الدفتر ومراجعة ص 40–41. لولي الأمر: يُرجى مناقشة الابن في سبب وجود المفترسات الكبيرة في أقفاص بحدائق الحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 41 | دليل المعلم ص 54–55", "num": "الحصة الثالثة من 5", "focus": "السلاسل الغذا اء (تمرين 2-4)\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-4 في كتاب النشاط\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n- الكتاب\n- صورة توضيحية\n- الأقلام\n- جهاز الحاسب\n- أخرى: أوراق كبيرة، صور مطبوعة، صمغ", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n- الموطن الطبيعي\n- المناخ\n- الغابة الاستوائية\n- الصحراء\n- السافانا\n\nالحصة 2: السلاسل الغذائية في السافانا\n- السافانا\n- آكلات الأعشاب\n- الثور البري\n- الزرافة\n- المفترس\n\nالحصة 3: السلاسل الغذائية في المحيط\n- المحيط\n- العوالق\n- الطحالب\n- السردين\n- النورس\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n- الصحراء\n- الضباب الموسمي\n- قطرات الندى\n- القط الرملي\n- الصقر\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n- الموطن\n- المقارنة\n- السلسلة الغذائية\n- المنتج\n- المفترس الأعلى", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nيعرض المعلم أربع صور: صحراء، تحت سطح الماء، سهول قطبية، غابة؛ ويسأل: هل تنمو النباتات نفسها في كل هذه الأماكن؟ (5 دقائق)\n\nالحصة 2: السلاسل الغذائية في السافانا\nيُسمع المعلم الطلبة صوت زئير أسد، ويسأل: أين يعيش؟ وماذا يأكل؟ ومن يأكل الطعام الذي يأكله الأسد؟ (5 دقائق)\n\nالحصة 3: السلاسل الغذائية في المحيط\nيسأل المعلم: يغطي الماء نحو ثلاثة أرباع سطح الأرض. ماذا تأكل الأسماك في وسط المحيط بعيدًا عن النباتات الكبيرة؟ (5 دقائق)\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nيسأل المعلم: كيف تحصل نباتات الصحراء على الماء والأمطار قليلة؟ ويعرض صورة لضباب ظفار الموسمي. (5 دقائق)\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nيعرض المعلم «بطاقات المواطن» (سافانا، محيط، صحراء، غابة استوائية) مقلوبة، وتسحب كل مجموعة بطاقة تحدد موطن مشروعها. (5 دقائق)", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض — زمن الحصة 40 دقيقة\n\n1. المناخ والموطن: يشرح المعلم ص 40: المناخ الحار الرطب للغابات الاستوائية، الحار الجاف للصحراء، الحار مع أمطار صيفية للسافانا، والطلبة يملؤون جدولًا: الموطن – المناخ – نباتات – حيوانات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رحلة على الكرة الأرضية: يحدد المعلم على المجسم مواقع الغابات الاستوائية والصحاري والسافانا في إفريقيا، والطلبة يحددون موقع عُمان ونوع موطنها الغالب (7 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مواطن عُمانية: يقود المعلم مناقشة: الجبال، السواحل، الصحراء، الأفلاج، والطلبة يذكرون كائنات من كل موطن عماني (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: السلاسل الغذائية في السافانا — زمن الحصة 40 دقيقة\n\n1. سلاسل السافانا ص 40: يناقش المعلم الأسئلة في الكتاب: المنتجات، المستهلكات، المفترسات وفرائسها، ماذا يأكل كل حيوان، والطلبة يحددون في الصورة ويكتبون في جدول (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السؤال 2 ص 41: يوجه المعلم: ثلاثة حيوانات تأكل النباتات فقط، وسلسلتان بهما مفترس وفريسة، والطلبة يكتبون: الزرافة تأكل أوراق الأشجار، الثور البري والحمار الوحشي العشب؛ ويرسمون السلاسل (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحدّث عن: موت المفترسات: يطرح المعلم سؤال «تحدّث عن» ص 41، والطلبة يتنبؤون بالتسلسل: زيادة آكلات العشب، نقص العشب، مجاعة (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 3: السلاسل الغذائية في المحيط — زمن الحصة 40 دقيقة\n\n1. العوالق: يشرح المعلم ص 41: العوالق كائنات صغيرة جدًا، منها نباتات منتجة وطحالب؛ ويعرض صورة مجهرية، والطلبة يكتبون: العوالق والطحالب منتجات المحيط (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. السؤال 3 ص 41: يوجه المعلم رسم سلسلتين بمفترس واحد وسلسلتين بمفترسين، والطلبة يرسمون: عوالق ← أسماك صغيرة ← نورس؛ عوالق ← سردين ← سمكة كبيرة ← إنسان (8 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. السؤال 1: المقارنة: يوجه المعلم مقارنة المنتجات في السافانا والمحيط في جدول، والطلبة يكملون الجدول: السافانا: عشب وأشجار؛ المحيط: عوالق وطحالب (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4) — زمن الحصة 40 دقيقة\n\n1. تمرين 2-4 (ص 29–30): يوجه المعلم الحل: المنتجات (أعشاب ونباتات صحراوية)، مصادر الماء، آكلات النبات، المفترسات وفرائسها، والطلبة يحلون فرديًا: القط الرملي يأكل الفأر، السحلية تأكل العنكبوت، الصقر يأكل السحلية (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n2. رسم سلسلة صحراوية: يطلب المعلم سلسلة من أربع حلقات، والطلبة يرسمون: نباتات صحراوية ← خنفساء ← فأر ← بومة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التصحيح بالأقران: يعرض المعلم الإجابات النموذجية، والطلبة يتبادلون الكتب ويصححون (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية — زمن الحصة 40 دقيقة\n\n1. تصميم اللوحة: يتابع المجموعات: صورة الموطن، مناخه، سلسلة من 3–4 حلقات، تحديد المنتج والفريسة والمفترس، والطلبة يصممون اللوحة ويوزعون المهام (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. العرض والمقارنة: يدير المعلم عرضًا سريعًا (دقيقتان لكل مجموعة) ويكتب جدول مقارنة على السبورة، والطلبة يعرضون ويكملون جدول المقارنة (6 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. تقييم الأقران: يوزع المعلم بطاقة تقييم بسيطة (الدقة، الوضوح، التنظيم)، والطلبة يقيّمون لوحات زملائهم (2 دقيقتان)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس – سلاسل من مواطن عمان: تكون كل مجموعة سلسلة غذائية لموطن عماني مختلف: البحر، الصحراء، الجبل، وتقارن بين السلاسل في عرض سريع (5 دقائق)\nالاستراتيجيات: المحطات.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا توجد مواطن طبيعية عديدة على الأرض؟\n   الإجابة النموذجية: بسبب تعدد المناخات مما يؤدي إلى وجود نباتات مختلفة.\n2. [مستوى التطبيق] ما مناخ الغابة الاستوائية؟\n   الإجابة النموذجية: حار رطب.\n3. [مستوى الاستدلال] لماذا تختلف حيوانات الصحراء عن حيوانات الغابة الاستوائية؟\n   الإجابة النموذجية: لأن النباتات المختلفة تجذب حيوانات مختلفة، والمناخ يحدد الكائنات القادرة على العيش.\n\nالحصة 2: السلاسل الغذائية في السافانا\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الكائنات المنتجة في السافانا؟\n   الإجابة النموذجية: العشب والأشجار.\n2. [مستوى التطبيق] ماذا تأكل الزرافة؟\n   الإجابة النموذجية: أوراق الأشجار.\n3. [مستوى الاستدلال] ارسم سلسلة غذائية تنتهي بالأسد.\n   الإجابة النموذجية: العشب ← الحمار الوحشي ← الأسد (أو أوراق الأشجار ← الزرافة ← الأسد).\n\nالحصة 3: السلاسل الغذائية في المحيط\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالعوالق؟\n   الإجابة النموذجية: كائنات حية صغيرة جدًا يصعب رؤيتها بالعين المجردة تعيش في الماء.\n2. [مستوى التطبيق] ما المنتج في السلسلة: عوالق ← سمكة صغيرة ← نورس؟\n   الإجابة النموذجية: العوالق.\n3. [مستوى الاستدلال] قارن بين المنتجات في السافانا والمحيط.\n   الإجابة النموذجية: في السافانا العشب والأشجار، وفي المحيط العوالق والطحالب.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر مصدرين للماء في الصحراء.\n   الإجابة النموذجية: الأمطار القليلة والضباب الموسمي وقطرات الندى.\n2. [مستوى التطبيق] ما فريسة القط الرملي؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] ارسم سلسلة صحراوية تنتهي بالسحلية.\n   الإجابة النموذجية: نباتات صحراوية ← جرادة/نملة ← عنكبوت ← سحلية.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المنتج في موطن مجموعتك؟\n   الإجابة النموذجية: تعتمد على الموطن: عشب/أشجار، عوالق، نباتات صحراوية...\n2. [مستوى التطبيق] ما وجه الشبه بين جميع السلاسل المعروضة؟\n   الإجابة النموذجية: كلها تبدأ بكائن منتج.\n3. [مستوى الاستدلال] ما وجه الاختلاف الرئيسي بين سلاسل المحيط والسافانا؟\n   الإجابة النموذجية: نوع المنتجات والحيوانات المختلف تبعًا لاختلاف الموطن.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين طبيعيين مختلفين.\n   الإجابة النموذجية: مثل: الصحراء والمحيط (أو السافانا والغابة الاستوائية).\n2. [مستوى التطبيق] ما نوع الموطن الغالب في عُمان؟\n   الإجابة النموذجية: الصحراوي، مع مواطن جبلية وساحلية.\n3. [مستوى الاستدلال] توقع: أي الموطنين فيه تنوع نباتي أكبر، الغابة الاستوائية أم الصحراء؟ ولماذا؟\n   الإجابة النموذجية: الغابة الاستوائية؛ لوفرة الماء والحرارة المناسبة لنمو نباتات كثيرة.\n\nالحصة 2: السلاسل الغذائية في السافانا\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مفترسين من السافانا.\n   الإجابة النموذجية: الأسد والفهد (أو النمر والضبع).\n2. [مستوى التطبيق] ما الحيوانات التي تتغذى على الحيوانات الميتة؟\n   الإجابة النموذجية: النسور.\n3. [مستوى الاستدلال] ماذا سيحدث للعشب إذا ماتت فجأة كل المفترسات؟\n   الإجابة النموذجية: سيقل كثيرًا لأن أعداد آكلات العشب ستزداد وتأكله.\n\nالحصة 3: السلاسل الغذائية في المحيط\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ارسم سلسلة غذائية بحرية تنتهي بالإنسان.\n   الإجابة النموذجية: عوالق ← قشريات ← إنسان (أو عوالق ← سردين ← إنسان).\n2. [مستوى التطبيق] لماذا تُعد المواطن البحرية مهمة جدًا؟\n   الإجابة النموذجية: لأنها تغطي نحو ثلاثة أرباع سطح الأرض وتضم أنواعًا كثيرة من الكائنات.\n3. [مستوى الاستدلال] ماذا تتوقع أن يحدث للأسماك إذا قلّت العوالق بسبب التلوث؟\n   الإجابة النموذجية: تقل أعداد الأسماك الصغيرة ثم الأسماك الكبيرة والطيور التي تتغذى عليها.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر حيوانًا صحراويًا يتغذى على النباتات.\n   الإجابة النموذجية: الظبي أو النملة أو الخنفساء أو اليرقة.\n2. [مستوى التطبيق] ما المفترس الأعلى في السلسلة: نباتات ← خنفساء ← فأر ← بومة؟\n   الإجابة النموذجية: البومة.\n3. [مستوى الاستدلال] لماذا تكون أعداد الكائنات في الصحراء أقل منها في الغابة الاستوائية؟\n   الإجابة النموذجية: لقلة الماء والنباتات المنتجة فلا يكفي الغذاء لأعداد كبيرة.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين ومنتجًا في كل منهما.\n   الإجابة النموذجية: السافانا: العشب؛ المحيط: العوالق (أو الصحراء: النباتات الصحراوية).\n2. [مستوى التطبيق] لماذا تختلف السلاسل الغذائية من موطن لآخر؟\n   الإجابة النموذجية: لأن المواطن المختلفة تضم نباتات وحيوانات مختلفة.\n3. [مستوى الاستدلال] اقترح تحسينًا للوحة إحدى المجموعات مع التعليل.\n   الإجابة النموذجية: تقبل المقترحات المعللة مثل إضافة سهم صحيح أو مفترس أعلى أو عنوان.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nللطالب: قراءة كتاب الطالب ص 40 وجمع صور لثلاثة مواطن مختلفة. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور للمواطن الطبيعية في عُمان.\n\nالحصة 2: السلاسل الغذائية في السافانا\nللطالب: رسم سلسلتين غذائيتين من السافانا في الدفتر ومراجعة ص 40–41. لولي الأمر: يُرجى مناقشة الابن في سبب وجود المفترسات الكبيرة في أقفاص بحدائق الحيوان.\n\nالحصة 3: السلاسل الغذائية في المحيط\nللطالب: كتابة سلسلتين غذائيتين بحريتين من بحر عُمان. لولي الأمر: يُرجى توعية الابن بعدم رمي المخلفات على الشواطئ.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nللطالب: إكمال تمرين 2-4 في كتاب النشاط ص 29–30 واجبًا منزليًا. لولي الأمر: يُرجى الحديث مع الابن عن حيوانات الصحراء العُمانية مثل المها العربية.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nللطالب: مراجعة كتاب الطالب ص 40–41 والاستعداد لدرس إزالة الغابات. لولي الأمر: يُرجى مساعدة الابن على جمع معلومات عن غابات العالم وأهميتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"id": "2-5", "title": "إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 42–43 | كتاب النشاط ص 31، 64–66 | دليل المعلم ص 54–57", "n": 2, "per": [{"h": {"lesson": "2-5 إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 42–43 | دليل المعلم ص 55–56", "num": "الحصة الأولى من 2", "focus": "أسباب إزالة الغابات وآثارها السلبية"}, "f": ["1. يذكر أسباب إزالة الغابات (10 دقائق)\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء (15 دقيقة)\nمخرج تعليمي آخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري (15 دقيقة)", "1. يذكر أسباب إزالة الغابات. ← تذكر\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء. ← فهم\nالمخرج الآخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري. ← تحليل", "- التعلم بالاكتشاف\n- الخرائط الذهنية والمفاهيمية\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية", "- إزالة الغابات\n- الاحتباس الحراري\n- غازات الدفيئة\n- السماد العضوي\n- خصوبة التربة", "يعرض المعلم عبارة: «تُقطع من الغابات المطيرة مساحة ملعب كرة قدم كل ثانية!» ويسأل: لماذا يقطع الناس الأشجار؟ (5 دقائق)", "1. أين الغابات الاستوائية؟: يحدد المعلم على المجسم: الأمازون، الكونغو، إندونيسيا، والطلبة يحددون المواقع ويقارنونها بموقع عُمان (6 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n2. الأسباب والآثار: يشرح المعلم ص 42: الخشب للأثاث والوقود، إخلاء الأرض للزراعة والسكن والصناعة؛ الآثار: فقر التربة، اختفاء الأنواع، زيادة ثاني أكسيد الكربون، والطلبة يكملون خريطة مفاهيمية: أسباب ← إزالة الغابات ← آثار (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. غازات الدفيئة والاحتباس الحراري: يشرح المعلم بتشبيه البيت الزجاجي كيف تحبس الغازات الحرارة، ودور الأشجار في امتصاص ثاني أكسيد الكربون، والطلبة يجيبون عن السؤالين 1 و4 ص 43 (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أسباب لإزالة الغابات.\n   الإجابة النموذجية: جمع الخشب لصناعة الأثاث، أو لحرقه، وإخلاء الأرض للزراعة أو السكن أو الصناعة.\n2. [مستوى التطبيق] ماذا يحدث للتربة بعد إزالة الغابة؟\n   الإجابة النموذجية: تصبح غير خصبة لعدم وجود أوراق متحللة تصنع السماد العضوي.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد في الهواء ويحبس الحرارة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإزالة الغابات؟\n   الإجابة النموذجية: قطع أشجار الغابات وتدميرها بواسطة الإنسان.\n2. [مستوى التطبيق] ماذا سيحدث لثاني أكسيد الكربون والأكسجين في الهواء إذا دُمرت كل الغابات؟\n   الإجابة النموذجية: سيزداد ثاني أكسيد الكربون ويقل الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعد شراء الأثاث الخشبي المستعمل طريقة جيدة للحفاظ على الغابات؟\n   الإجابة النموذجية: لأنه إعادة استخدام للخشب فلا نحتاج إلى قطع أشجار جديدة.", "للطالب: حل تمرين 2-5 في كتاب النشاط ص 31 (آراء حول إزالة الغابات) واجبًا منزليًا. لولي الأمر: يُرجى المشاركة مع الابن في زراعة شجرة أو الاعتناء بنبتة في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}, {"h": {"lesson": "2-5 إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 43 | كتاب النشاط ص 31، 64–66 | دليل المعلم ص 56–57", "num": "الحصة الثانية من 2", "focus": "أهمية الغابات وجهود حمايتها"}, "f": ["1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن) (10 دقائق)\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة (15 دقيقة)\nمخرج تعليمي آخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا (15 دقيقة)", "1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن). ← فهم\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة. ← فهم\nالمخرج الآخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا. ← تقييم", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم الذاتي\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: أوراق العمل 2-5أ و2-5ب و2-5ج", "- رئة الأرض\n- التنوع الحيوي\n- جائزة السلطان قابوس لحماية البيئة\n- زراعة الأشجار", "يطرح المعلم سؤال «تحدّث عن» ص 43: لماذا تُسمى الغابات «رئة كوكب الأرض»؟ ويربطه بعمل الرئتين. (5 دقائق)", "1. لماذا الغابات مهمة؟: يعرض المعلم معلومات ص 43: آلاف الأنواع، أدوية من النباتات، الأكسجين، والطلبة يكتبون ثلاثة أسباب لأهمية الغابات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أوراق العمل حسب المستوى: يوزع المعلم: 2-5أ (وانجاري ماثاي) للمستوى المرتفع، 2-5ب (جائزة السلطان قابوس) للدعم، 2-5ج (خرائط مفاهيمية) للجميع، والطلبة يقرؤون ويجيبون ويكملون الخريطة المفاهيمية (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-5: مؤيد أم معارض؟: يناقش المعلم تصنيف الآراء في تمرين 2-5 (ص 31) ونشاط زراعة شجرة، والطلبة يصنفون الآراء ويبدون رأيًا معللًا (5 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – أشجار عمان أمانة: تناقش المجموعات أثر قطع الأشجار في عمان كالغاف والسمر على الحيوانات والتربة، وتقترح حملة تشجير مدرسية بشعار (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تُسمى الغابات رئة الأرض؟\n   الإجابة النموذجية: لأنها تمتص ثاني أكسيد الكربون وتنتج الأكسجين الذي تحتاجه الكائنات.\n2. [مستوى التطبيق] ما الذي قامت به وانجاري ماثاي؟\n   الإجابة النموذجية: شجعت النساء على زراعة الأشجار في كينيا فزرعن ملايين الأشجار، ونالت جائزة نوبل للسلام.\n3. [مستوى الاستدلال] صنّف: «مزارع قهوة» و«طبيبة»، من المؤيد ومن المعارض لإزالة الغابات؟ وعلل.\n   الإجابة النموذجية: مزارع القهوة مؤيد (يحتاج أرضًا للزراعة)، والطبيبة معارضة (الغابات مصدر للأدوية).", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر فائدتين للغابات.\n   الإجابة النموذجية: إنتاج الأكسجين وامتصاص ثاني أكسيد الكربون، ومواطن للكائنات، ومصدر للأدوية.\n2. [مستوى التطبيق] ما الجائزة العُمانية العالمية التي تُمنح لجهود حماية البيئة؟\n   الإجابة النموذجية: جائزة السلطان قابوس لحماية البيئة.\n3. [مستوى الاستدلال] اقترح ثلاث طرق يمكن لأسرتك المساهمة بها في حماية الغابات.\n   الإجابة النموذجية: زراعة الأشجار، شراء أثاث مستعمل، تقليل استهلاك الورق وإعادة تدويره.", "للطالب: إكمال ورقة العمل المختارة (ص 64–66) والمشاركة في زراعة شجرة (نشاط 2-5) إن أمكن. لولي الأمر: يُرجى المشاركة مع الابن في يوم الشجرة وتشجيعه على الزراعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}], "comb": ["الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1. يذكر أسباب إزالة الغابات (10 دقائق)\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء (15 دقيقة)\nمخرج تعليمي آخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري (15 دقيقة)\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن) (10 دقائق)\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة (15 دقيقة)\nمخرج تعليمي آخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا (15 دقيقة)", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1. يذكر أسباب إزالة الغابات. ← تذكر\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء. ← فهم\nالمخرج الآخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري. ← تحليل\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن). ← فهم\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة. ← فهم\nالمخرج الآخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا. ← تقييم", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n- التعلم بالاكتشاف\n- الخرائط الذهنية والمفاهيمية\n- فكّر – زاوج – شارك\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم الذاتي\n- الخرائط الذهنية والمفاهيمية", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: أوراق العمل 2-5أ و2-5ب و2-5ج", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n- إزالة الغابات\n- الاحتباس الحراري\n- غازات الدفيئة\n- السماد العضوي\n- خصوبة التربة\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n- رئة الأرض\n- التنوع الحيوي\n- جائزة السلطان قابوس لحماية البيئة\n- زراعة الأشجار", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nيعرض المعلم عبارة: «تُقطع من الغابات المطيرة مساحة ملعب كرة قدم كل ثانية!» ويسأل: لماذا يقطع الناس الأشجار؟ (5 دقائق)\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nيطرح المعلم سؤال «تحدّث عن» ص 43: لماذا تُسمى الغابات «رئة كوكب الأرض»؟ ويربطه بعمل الرئتين. (5 دقائق)", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية — زمن الحصة 40 دقيقة\n\n1. أين الغابات الاستوائية؟: يحدد المعلم على المجسم: الأمازون، الكونغو، إندونيسيا، والطلبة يحددون المواقع ويقارنونها بموقع عُمان (6 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n2. الأسباب والآثار: يشرح المعلم ص 42: الخشب للأثاث والوقود، إخلاء الأرض للزراعة والسكن والصناعة؛ الآثار: فقر التربة، اختفاء الأنواع، زيادة ثاني أكسيد الكربون، والطلبة يكملون خريطة مفاهيمية: أسباب ← إزالة الغابات ← آثار (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. غازات الدفيئة والاحتباس الحراري: يشرح المعلم بتشبيه البيت الزجاجي كيف تحبس الغازات الحرارة، ودور الأشجار في امتصاص ثاني أكسيد الكربون، والطلبة يجيبون عن السؤالين 1 و4 ص 43 (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: أهمية الغابات وجهود حمايتها — زمن الحصة 40 دقيقة\n\n1. لماذا الغابات مهمة؟: يعرض المعلم معلومات ص 43: آلاف الأنواع، أدوية من النباتات، الأكسجين، والطلبة يكتبون ثلاثة أسباب لأهمية الغابات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أوراق العمل حسب المستوى: يوزع المعلم: 2-5أ (وانجاري ماثاي) للمستوى المرتفع، 2-5ب (جائزة السلطان قابوس) للدعم، 2-5ج (خرائط مفاهيمية) للجميع، والطلبة يقرؤون ويجيبون ويكملون الخريطة المفاهيمية (8 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. تمرين 2-5: مؤيد أم معارض؟: يناقش المعلم تصنيف الآراء في تمرين 2-5 (ص 31) ونشاط زراعة شجرة، والطلبة يصنفون الآراء ويبدون رأيًا معللًا (5 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – أشجار عمان أمانة: تناقش المجموعات أثر قطع الأشجار في عمان كالغاف والسمر على الحيوانات والتربة، وتقترح حملة تشجير مدرسية بشعار (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أسباب لإزالة الغابات.\n   الإجابة النموذجية: جمع الخشب لصناعة الأثاث، أو لحرقه، وإخلاء الأرض للزراعة أو السكن أو الصناعة.\n2. [مستوى التطبيق] ماذا يحدث للتربة بعد إزالة الغابة؟\n   الإجابة النموذجية: تصبح غير خصبة لعدم وجود أوراق متحللة تصنع السماد العضوي.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد في الهواء ويحبس الحرارة.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تُسمى الغابات رئة الأرض؟\n   الإجابة النموذجية: لأنها تمتص ثاني أكسيد الكربون وتنتج الأكسجين الذي تحتاجه الكائنات.\n2. [مستوى التطبيق] ما الذي قامت به وانجاري ماثاي؟\n   الإجابة النموذجية: شجعت النساء على زراعة الأشجار في كينيا فزرعن ملايين الأشجار، ونالت جائزة نوبل للسلام.\n3. [مستوى الاستدلال] صنّف: «مزارع قهوة» و«طبيبة»، من المؤيد ومن المعارض لإزالة الغابات؟ وعلل.\n   الإجابة النموذجية: مزارع القهوة مؤيد (يحتاج أرضًا للزراعة)، والطبيبة معارضة (الغابات مصدر للأدوية).", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإزالة الغابات؟\n   الإجابة النموذجية: قطع أشجار الغابات وتدميرها بواسطة الإنسان.\n2. [مستوى التطبيق] ماذا سيحدث لثاني أكسيد الكربون والأكسجين في الهواء إذا دُمرت كل الغابات؟\n   الإجابة النموذجية: سيزداد ثاني أكسيد الكربون ويقل الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعد شراء الأثاث الخشبي المستعمل طريقة جيدة للحفاظ على الغابات؟\n   الإجابة النموذجية: لأنه إعادة استخدام للخشب فلا نحتاج إلى قطع أشجار جديدة.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر فائدتين للغابات.\n   الإجابة النموذجية: إنتاج الأكسجين وامتصاص ثاني أكسيد الكربون، ومواطن للكائنات، ومصدر للأدوية.\n2. [مستوى التطبيق] ما الجائزة العُمانية العالمية التي تُمنح لجهود حماية البيئة؟\n   الإجابة النموذجية: جائزة السلطان قابوس لحماية البيئة.\n3. [مستوى الاستدلال] اقترح ثلاث طرق يمكن لأسرتك المساهمة بها في حماية الغابات.\n   الإجابة النموذجية: زراعة الأشجار، شراء أثاث مستعمل، تقليل استهلاك الورق وإعادة تدويره.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nللطالب: حل تمرين 2-5 في كتاب النشاط ص 31 (آراء حول إزالة الغابات) واجبًا منزليًا. لولي الأمر: يُرجى المشاركة مع الابن في زراعة شجرة أو الاعتناء بنبتة في المنزل.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nللطالب: إكمال ورقة العمل المختارة (ص 64–66) والمشاركة في زراعة شجرة (نشاط 2-5) إن أمكن. لولي الأمر: يُرجى المشاركة مع الابن في يوم الشجرة وتشجيعه على الزراعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}, {"id": "2-6", "title": "تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 44–45 | كتاب النشاط ص 32، 67–68 | دليل المعلم ص 57–59", "n": 3, "per": [{"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 44 | دليل المعلم ص 57–59", "num": "الحصة الأولى من 3", "focus": "مكونات الغلاف الجوي وملوثات الهواء ومصادرها"}, "f": ["1. يذكر الغازات الأساسية المكونة للغلاف الجوي (5 دقائق)\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء (20 دقيقة)", "1. يذكر الغازات الأساسية المكونة للغلاف الجوي. ← تذكر\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة. ← فهم\nالمخرج الآخر: يقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء. ← تحليل", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- الغلاف الجوي\n- تلوث الهواء\n- أول أكسيد الكربون\n- ثاني أكسيد الكبريت\n- الالتهاب الشعبي\n- الربو", "يسأل المعلم: هل تعتقد أن الهواء في منطقتنا نقي؟ متى ترى دخانًا أو تشم رائحة عوادم؟ ويعرض صورة لضباب دخاني فوق مدينة. (5 دقائق)", "1. مكونات الهواء والملوثات: يشرح المعلم ص 44: النيتروجين والأكسجين وقليل من ثاني أكسيد الكربون وبخار الماء؛ أول أكسيد الكربون من العوادم، أكاسيد الكبريت من المصانع ومحطات الكهرباء، والطلبة يكملون جدول: الملوث – مصدره – ضرره (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. أضرار التلوث: يناقش المعلم آثاره على النباتات والحيوانات وصحة الإنسان (الالتهاب الشعبي، الربو) مع مراعاة الطلبة المصابين بالربو، والطلبة يكتبون ثلاثة أضرار ويجيبون عن «تحدّث عن» ص 45 (7 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مصادر الطاقة: يقارن المعلم: الفحم والنفط تلوث، والرياح والشمس والماء لا تلوث لكنها أكثر تكلفة لبعض الدول؛ ويذكر محطات الطاقة الشمسية في عُمان، والطلبة يصنفون مصادر الطاقة في عمودين (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان الأساسيان في الغلاف الجوي؟\n   الإجابة النموذجية: النيتروجين والأكسجين.\n2. [مستوى التطبيق] ما مصدر غاز أول أكسيد الكربون السام؟\n   الإجابة النموذجية: عوادم السيارات والدراجات النارية.\n3. [مستوى الاستدلال] لماذا تلوث السيارات الجديدة أقل من القديمة؟\n   الإجابة النموذجية: لأنها مزودة بجهاز يحول غازات العادم الضارة إلى ثاني أكسيد الكربون.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مرضين يصيبان الإنسان في المناطق الملوثة.\n   الإجابة النموذجية: الالتهاب الشعبي والربو.\n2. [مستوى التطبيق] أي مصادر الطاقة لا تلوث الهواء؟\n   الإجابة النموذجية: طاقة الرياح والطاقة الشمسية والطاقة المائية.\n3. [مستوى الاستدلال] اقترح طريقتين لتقليل تلوث الهواء في المدن.\n   الإجابة النموذجية: استخدام وسائل النقل العام، الطاقة الشمسية، زراعة الأشجار، صيانة السيارات (تقبل المقترحات المنطقية).", "للطالب: قراءة كتاب الطالب ص 44 وملاحظة مصادر تلوث الهواء في الحي. لولي الأمر: يُرجى تجنب تشغيل السيارة دون حاجة قرب المنزل والمدرسة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 45 | كتاب النشاط ص 67 | دليل المعلم ص 58–59", "num": "الحصة الثانية من 3", "focus": "التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)"}, "f": ["1. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة (15 دقيقة)\n2. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية (5 دقائق)\nمخرج تعليمي آخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا (20 دقيقة)", "1. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة. ← تطبيق\n2. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية. ← تحليل\nالمخرج الآخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا. ← تقييم", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة التقليدية\n- أخرى: شرائح زجاجية، فازلين، قلم تخطيط، شريط لاصق، عدسة مكبرة، ورقة العمل 2-6أ", "- جزيئات الغبار\n- التنبؤ\n- الاختبار العادل\n- العينة", "يمرر المعلم إصبعه على سطح نافذة مغبرة ويسأل: من أين جاء هذا الغبار؟ وهل يتساوى الغبار في كل مكان؟ (5 دقائق)", "1. تجهيز الشرائح: يوضح المعلم الخطوات ص 45: ترقيم 5 شرائح، رسم مربع 2 cm × 2 cm، دهن الفازلين، والطلبة يجهزون الشرائح بعناية في مجموعات (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. اختيار المواقع والتنبؤ: يناقش المعلم اختيار مواقع لا تتحرك فيها الشرائح (أعمدة، نوافذ، جذوع أشجار) قرب طريق وفي مكان هادئ، والطلبة يختارون 5 مواقع ويكتبون تنبؤاتهم مع الأسباب في جدول ورقة العمل 2-6أ (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. وضع الشرائح: يرافق المجموعات لتثبيت الشرائح في فناء المدرسة، والطلبة يثبتون الشرائح ويسجلون مواقعها (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا ندهن الشرائح بالفازلين؟\n   الإجابة النموذجية: لكي تلتصق بها جزيئات الغبار الموجودة في الهواء.\n2. [مستوى التطبيق] لماذا نرسم مربعًا بالمساحة نفسها على كل شريحة؟\n   الإجابة النموذجية: لنقارن عدد الجزيئات في المساحة نفسها فيكون الاختبار عادلًا.\n3. [مستوى الاستدلال] أي المواقع تتنبأ أنه سيكون أكثر تلوثًا؟ ولماذا؟\n   الإجابة النموذجية: قرب الطريق المزدحم أو مصنع؛ بسبب العوادم والغبار المتطاير.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] كم يومًا تُترك الشرائح؟\n   الإجابة النموذجية: أسبوعًا.\n2. [مستوى التطبيق] ما الأداة التي سنستخدمها لفحص الشرائح؟\n   الإجابة النموذجية: العدسة المكبرة.\n3. [مستوى الاستدلال] هل يقيس هذا النشاط كل أنواع تلوث الهواء؟ وضح.\n   الإجابة النموذجية: لا؛ يقيس جزيئات الغبار فقط، أما الغازات فجزيئاتها صغيرة جدًا لا تُرى ولا تُعد.", "للطالب: تسجيل التنبؤات في ورقة العمل 2-6أ (كتاب النشاط ص 67) والعودة إلى الشرائح بعد أسبوع. تُستخدم في الحصة القادمة شرائح جهزها المعلم مسبقًا. لولي الأمر: يُرجى تشجيع الابن على متابعة استقصائه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 45 | كتاب النشاط ص 32، 67–68 | دليل المعلم ص 58–59", "num": "الحصة الثالثة من 3", "focus": "تحليل نتائج الغبار وتمثيلها بالأعمدة"}, "f": ["1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة (15 دقيقة)\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط (5 دقائق)\nمخرج تعليمي آخر: يكتب نشرة معلومات عن تلوث الماء أو التربة (20 دقيقة)", "1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة. ← تطبيق\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط. ← تقييم\nالمخرج الآخر: يكتب نشرة معلومات عن تلوث الماء أو التربة. ← إبداع", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شرائح معدة مسبقًا، عدسات مكبرة، ورقتا العمل 2-6أ و2-6ب", "- التمثيل البياني بالأعمدة\n- النمط\n- الدليل\n- تلوث الماء\n- تلوث التربة", "يعرض المعلم شريحتين معدتين مسبقًا (إحداهما من قرب الطريق) ويسأل: أي الشريحتين من قرب الشارع؟ كيف عرفت؟ (5 دقائق)", "1. العدّ والتسجيل: يوزع المعلم الشرائح المعدة ويوضح طريقة تقدير العدد داخل المربع، والطلبة يعدون الجزيئات بالعدسة ويسجلونها في ورقة العمل 2-6أ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 2-6ب والأسئلة 1–3: يوجه المعلم التمثيل بالأعمدة ومقارنة النتائج بين المجموعات، والطلبة يرسمون الأعمدة ويحددون الموقع الأكثر تلوثًا ويقارنونه بتنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-6 والسؤال 4: يوجه المعلم تحليل بيانات تلوث المدن الكبرى (تمرين 2-6 ص 32)، ويوزع مهمة نشرة معلومات عن تلوث الماء أو التربة، والطلبة يحللون البيانات ويخططون للنشرة (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – هواء مسقط النقي: تقترح المجموعات طرقًا للحد من تلوث الهواء في المدن العمانية، كالمشاركة في السيارات واستخدام الطاقة الشمسية، وتصوغ شعارًا (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الموقع الذي ظهرت فيه أكبر كمية من الغبار؟ ولماذا؟\n   الإجابة النموذجية: غالبًا قرب الطريق المزدحم بسبب حركة السيارات وعوادمها.\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستشهاد بعدد الجزيئات في المواقع.\n3. [مستوى الاستدلال] اقترح سببًا لموقع لم يطابق النمط المتوقع.\n   الإجابة النموذجية: الرياح، أو المطر، أو لمس الشريحة، أو خطأ في العدّ.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفائدة من تمثيل النتائج بالأعمدة؟\n   الإجابة النموذجية: تسهيل المقارنة بين المواقع ورؤية النمط بسرعة.\n2. [مستوى التطبيق] لماذا نقارن نتائجنا مع نتائج المجموعات الأخرى؟\n   الإجابة النموذجية: للتأكد من النمط وزيادة موثوقية النتائج.\n3. [مستوى الاستدلال] اكتب فكرتين لنشرة توعوية عن تلوث الماء.\n   الإجابة النموذجية: عدم رمي النفايات في البحر والأودية، وعدم صب الزيوت في المصارف (تقبل الأفكار الصحيحة).", "للطالب: حل تمرين 2-6 (كتاب ال س جزيئات الغبار في الهواء (نشاط 2-6)\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على المشاريع", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n- الكتاب\n- السبورة التقليدية\n- أخرى: شرائح زجاجية، فازلين، قلم تخطيط، شريط لاصق، عدسة مكبرة، ورقة العمل 2-6أ\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شرائح معدة مسبقًا، عدسات مكبرة، ورقتا العمل 2-6أ و2-6ب", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n- الغلاف الجوي\n- تلوث الهواء\n- أول أكسيد الكربون\n- ثاني أكسيد الكبريت\n- الالتهاب الشعبي\n- الربو\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n- جزيئات الغبار\n- التنبؤ\n- الاختبار العادل\n- العينة\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n- التمثيل البياني بالأعمدة\n- النمط\n- الدليل\n- تلوث الماء\n- تلوث التربة", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nيسأل المعلم: هل تعتقد أن الهواء في منطقتنا نقي؟ متى ترى دخانًا أو تشم رائحة عوادم؟ ويعرض صورة لضباب دخاني فوق مدينة. (5 دقائق)\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\nيمرر المعلم إصبعه على سطح نافذة مغبرة ويسأل: من أين جاء هذا الغبار؟ وهل يتساوى الغبار في كل مكان؟ (5 دقائق)\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\nيعرض المعلم شريحتين معدتين مسبقًا (إحداهما من قرب الطريق) ويسأل: أي الشريحتين من قرب الشارع؟ كيف عرفت؟ (5 دقائق)", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها — زمن الحصة 40 دقيقة\n\n1. مكونات الهواء والملوثات: يشرح المعلم ص 44: النيتروجين والأكسجين وقليل من ثاني أكسيد الكربون وبخار الماء؛ أول أكسيد الكربون من العوادم، أكاسيد الكبريت من المصانع ومحطات الكهرباء، والطلبة يكملون جدول: الملوث – مصدره – ضرره (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. أضرار التلوث: يناقش المعلم آثاره على النباتات والحيوانات وصحة الإنسان (الالتهاب الشعبي، الربو) مع مراعاة الطلبة المصابين بالربو، والطلبة يكتبون ثلاثة أضرار ويجيبون عن «تحدّث عن» ص 45 (7 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مصادر الطاقة: يقارن المعلم: الفحم والنفط تلوث، والرياح والشمس والماء لا تلوث لكنها أكثر تكلفة لبعض الدول؛ ويذكر محطات الطاقة الشمسية في عُمان، والطلبة يصنفون مصادر الطاقة في عمودين (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6) — زمن الحصة 40 دقيقة\n\n1. تجهيز الشرائح: يوضح المعلم الخطوات ص 45: ترقيم 5 شرائح، رسم مربع 2 cm × 2 cm، دهن الفازلين، والطلبة يجهزون الشرائح بعناية في مجموعات (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. اختيار المواقع والتنبؤ: يناقش المعلم اختيار مواقع لا تتحرك فيها الشرائح (أعمدة، نوافذ، جذوع أشجار) قرب طريق وفي مكان هادئ، والطلبة يختارون 5 مواقع ويكتبون تنبؤاتهم مع الأسباب في جدول ورقة العمل 2-6أ (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. وضع الشرائح: يرافق المجموعات لتثبيت الشرائح في فناء المدرسة، والطلبة يثبتون الشرائح ويسجلون مواقعها (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة — زمن الحصة 40 دقيقة\n\n1. العدّ والتسجيل: يوزع المعلم الشرائح المعدة ويوضح طريقة تقدير العدد داخل المربع، والطلبة يعدون الجزيئات بالعدسة ويسجلونها في ورقة العمل 2-6أ (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. ورقة العمل 2-6ب والأسئلة 1–3: يوجه المعلم التمثيل بالأعمدة ومقارنة النتائج بين المجموعات، والطلبة يرسمون الأعمدة ويحددون الموقع الأكثر تلوثًا ويقارنونه بتنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تمرين 2-6 والسؤال 4: يوجه المعلم تحليل بيانات تلوث المدن الكبرى (تمرين 2-6 ص 32)، ويوزع مهمة نشرة معلومات عن تلوث الماء أو التربة، والطلبة يحللون البيانات ويخططون للنشرة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – هواء مسقط النقي: تقترح المجموعات طرقًا للحد من تلوث الهواء في المدن العمانية، كالمشاركة في السيارات واستخدام الطاقة الشمسية، وتصوغ شعارًا (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان الأساسيان في الغلاف الجوي؟\n   الإجابة النموذجية: النيتروجين والأكسجين.\n2. [مستوى التطبيق] ما مصدر غاز أول أكسيد الكربون السام؟\n   الإجابة النموذجية: عوادم السيارات والدراجات النارية.\n3. [مستوى الاستدلال] لماذا تلوث السيارات الجديدة أقل من القديمة؟\n   الإجابة النموذجية: لأنها مزودة بجهاز يحول غازات العادم الضارة إلى ثاني أكسيد الكربون.\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا ندهن الشرائح بالفازلين؟\n   الإجابة النموذجية: لكي تلتصق بها جزيئات الغبار الموجودة في الهواء.\n2. [مستوى التطبيق] لماذا نرسم مربعًا بالمساحة نفسها على كل شريحة؟\n   الإجابة النموذجية: لنقارن عدد الجزيئات في المساحة نفسها فيكون الاختبار عادلًا.\n3. [مستوى الاستدلال] أي المواقع تتنبأ أنه سيكون أكثر تلوثًا؟ ولماذا؟\n   الإجابة النموذجية: قرب الطريق المزدحم أو مصنع؛ بسبب العوادم والغبار المتطاير.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الموقع الذي ظهرت فيه أكبر كمية من الغبار؟ ولماذا؟\n   الإجابة النموذجية: غالبًا قرب الطريق المزدحم بسبب حركة السيارات وعوادمها.\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستشهاد بعدد الجزيئات في المواقع.\n3. [مستوى الاستدلال] اقترح سببًا لموقع لم يطابق النمط المتوقع.\n   الإجابة النموذجية: الرياح، أو المطر، أو لمس الشريحة، أو خطأ في العدّ.", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مرضين يصيبان الإنسان في المناطق الملوثة.\n   الإجابة النموذجية: الالتهاب الشعبي والربو.\n2. [مستوى التطبيق] أي مصادر الطاقة لا تلوث الهواء؟\n   الإجابة النموذجية: طاقة الرياح والطاقة الشمسية والطاقة المائية.\n3. [مستوى الاستدلال] اقترح طريقتين لتقليل تلوث الهواء في المدن.\n   الإجابة النموذجية: استخدام وسائل النقل العام، الطاقة الشمسية، زراعة الأشجار، صيانة السيارات (تقبل المقترحات المنطقية).\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] كم يومًا تُترك الشرائح؟\n   الإجابة النموذجية: أسبوعًا.\n2. [مستوى التطبيق] ما الأداة التي سنستخدمها لفحص الشرائح؟\n   الإجابة النموذجية: العدسة المكبرة.\n3. [مستوى الاستدلال] هل يقيس هذا النشاط كل أنواع تلوث الهواء؟ وضح.\n   الإجابة النموذجية: لا؛ يقيس جزيئات الغبار فقط، أما الغازات فجزيئاتها صغيرة جدًا لا تُرى ولا تُعد.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفائدة من تمثيل النتائج بالأعمدة؟\n   الإجابة النموذجية: تسهيل المقارنة بين المواقع ورؤية النمط بسرعة.\n2. [مستوى التطبيق] لماذا نقارن نتائجنا مع نتائج المجموعات الأخرى؟\n   الإجابة النموذجية: للتأكد من النمط وزيادة موثوقية النتائج.\n3. [مستوى الاستدلال] اكتب فكرتين لنشرة توعوية عن تلوث الماء.\n   الإجابة النموذجية: عدم رمي النفايات في البحر والأودية، وعدم صب الزيوت في المصارف (تقبل الأفكار الصحيحة).", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nللطالب: قراءة كتاب الطالب ص 44 وملاحظة مصادر تلوث الهواء في الحي. لولي الأمر: يُرجى تجنب تشغيل السيارة دون حاجة قرب المنزل والمدرسة.\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\nللطالب: تسجيل التنبؤات في ورقة العمل 2-6أ (كتاب النشاط ص 67) والعودة إلى الشرائح بعد أسبوع. تُستخدم في الحصة القادمة شرائح جهزها المعلم مسبقًا. لولي الأمر: يُرجى تشجيع الابن على متابعة استقصائه.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\nللطالب: حل تمرين 2-6 (كتاب النشاط ص 32)، وإكمال نشرة المعلومات عن تلوث الماء أو التربة لعرضها. لولي الأمر: يُرجى مساعدة الابن في جمع صور ومعلومات للنشرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي لل \n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويطمئن الطلبة أن الأمطار الحمضية لا تذيب الجلد، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان المسببان للأمطار الحمضية؟\n   الإجابة النموذجية: أكاسيد الكبريت وأكاسيد النيتروجين.\n2. [مستوى التطبيق] ماذا حدث للطباشير عند سكب الخل عليه؟\n   الإجابة النموذجية: ظهرت رغوة وتآكل جزء منه.\n3. [مستوى الاستدلال] لماذا استخدمنا الخل لتمثيل الأمطار الحمضية؟\n   الإجابة النموذجية: لأن الخل حمض ضعيف يشبه الأمطار الحمضية.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما مصدر الغازات المسببة للأمطار الحمضية؟\n   الإجابة النموذجية: حرق الفحم والنفط والغاز الطبيعي.\n2. [مستوى التطبيق] أي أنواع الحجارة يتضرر أكثر بالأمطار الحمضية؟\n   الإجابة النموذجية: الحجر الجيري والرخام.\n3. [مستوى الاستدلال] اقترح طريقتين لحماية المباني التاريخية من الأمطار الحمضية.\n   الإجابة النموذجية: تقليل حرق الوقود، طلاء الأسطح بمواد واقية، استخدام الطاقة النظيفة.", "للطالب: كتابة تقرير من صفحة واحدة عن أضرار الأمطار الحمضية على المباني (السؤال 4 ص 47). المعلم يُعد شتلتين للنشاط 2-7 قبل الحصة القادمة بثلاثة أيام. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور لمبانٍ تأثرت بالأمطار الحمضية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}, {"h": {"lesson": "2-7 الأمطار الحمضية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 46–47 | كتاب النشاط ص 33 | دليل المعلم ص 59–60", "num": "الحصة الثانية من 2", "focus": "أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)"}, "f": ["1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون (10 دقائق)\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية (10 دقائق)\nمخرج تعليمي آخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية (20 دقيقة)", "1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون. ← تحليل\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية. ← فهم\nالمخرج الآخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلتان: الأولى تُروى بماء الصنبور والثانية بعصير الليمون منذ ثلاثة أيام", "- المغذيات\n- التربة\n- البحيرات\n- المقارنة\n- الدليل", "يضع المعلم الشتلتين أمام الطلبة دون إخبارهم بأيهما سُقيت بالليمون، ويطلب منهم التخمين وتبريره. (5 دقائق)", "1. نشاط 2-7: المقارنة: يوجه المعلم الملاحظة الدقيقة للأوراق والسيقان والإجابة عن الأسئلة 1–3 ص 47، والطلبة يسجلون: أوراق الشتلة المسقية بالليمون ذابلة/صفراء وساقها ضعيفة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أثر الأمطار الحمضية على البيئة: يشرح المعلم ص 47: تزيل الأحماض المغذيات من التربة، تضعف النباتات وتتساقط أوراقها، وتتضرر الأشجار والبحيرات وحيواناتها، والطلبة يكملون مخطط أثر: تربة ← نبات ← حيوانات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تمرين 2-7: يوجه المعلم حل تمرين 2-7 (ص 33) عن موطن الماء العذب، والطلبة يرسمون السلاسل ويجيبون عن أسئلة الفهم (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – مطر نظيف لبلادي: تشرح الأزواج كيف تتكون الأمطار الحمضية، وتقترح طرقًا لحماية مزارع عمان وقلاعها الحجرية من أضرارها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صف أوراق الشتلة التي رُويت بعصير الليمون.\n   الإجابة النموذجية: ذابلة أو مصفرة أو بنية وقد تتساقط.\n2. [مستوى التطبيق] هل تدعم النتائج تنبؤك؟ وضح.\n   الإجابة النموذجية: نعم، توقعنا أن الحمض يضر بالنبتة وظهر عليها الضرر.\n3. [مستوى الاستدلال] كيف تضعف الأمطار الحمضية النباتات؟\n   الإجابة النموذجية: تزيل جزءًا من المغذيات من التربة فيضعف النبات ويبطؤ نموه.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يُعد هذا اختبارًا عادلًا؟\n   الإجابة النموذجية: لأن الشتلتين متشابهتان ووضعتا في الظروف نفسها، والفرق الوحيد نوع السائل.\n2. [مستوى ا
