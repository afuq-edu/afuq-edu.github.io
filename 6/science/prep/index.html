لون سلسلة من ثلاث حلقات: ذرة ← ثاقبة الذرة ← سحلية (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد موطنًا محليًا لنشاط الحصة القادمة، والطلبة يجيبون ويختارون موطنًا قرب المدرسة أو المنزل (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالموطن الطبيعي؟\n   الإجابة النموذجية: المكان الذي تعيش فيه الكائنات الحية في البيئة.\n2. [مستوى التطبيق] ماذا يعني السهم في السلسلة الغذائية: سبانخ ← يرقة؟\n   الإجابة النموذجية: أن اليرقة تتغذى على السبانخ.\n3. [مستوى الاستدلال] لماذا يفرح المزارع بوجود السحالي في مزرعته؟\n   الإجابة النموذجية: لأنها تأكل الحشرة ثاقبة الذرة فتقلل الضرر على المحصول.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اكتب سلسلة غذائية من مزرعة محمد.\n   الإجابة النموذجية: مثل: ورقة سبانخ ← يرقة ← طائر، أو ذرة ← حشرة ثاقبة الذرة ← سحلية.\n2. [مستوى التطبيق] ما الآفة؟ أعط مثالًا.\n   الإجابة النموذجية: كائن يضر بالمزروعات، مثل اليرقات أو الحشرة ثاقبة الذرة.\n3. [مستوى الاستدلال] ماذا يحدث لمحصول الذرة لو اختفت السحالي من المزرعة؟ ولماذا؟\n   الإجابة النموذجية: قد يتضرر أكثر لأن أعداد ثاقبة الذرة ستزداد دون من يأكلها.", "للطالب: قراءة كتاب الطالب ص 34، وملاحظة النباتات والحيوانات في حديقة المنزل أو الحي. لولي الأمر: يُرجى مرافقة الابن عند زيارة حديقة أو مزرعة لملاحظة الكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}, {"h": {"lesson": "2-1 السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 35 | كتاب النشاط ص 24 | دليل المعلم ص 48–49", "num": "الحصة الثانية من 2", "focus": "استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)"}, "f": ["1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي (15 دقيقة)\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها (10 دقائق)\nمخرج تعليمي آخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح) (15 دقيقة)", "1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي. ← تطبيق\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها. ← تطبيق\nالمخرج الآخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح). ← تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- أخرى: حديقة المدرسة، عدسات مكبرة، دفتر ملاحظات", "- الملاحظة\n- الموطن الطبيعي\n- السلسلة الغذائية\n- الاعتماد المتبادل", "يذكّر المعلم بقواعد السلامة والرفق بالكائنات، ويوزع المهام: مسجّل، باحث تحت الأوراق، مراقب للطيور، رسّام. (5 دقائق)", "1. نشاط 2-1 في حديقة المدرسة: يرافق المجموعات ويوجه الملاحظة تحت الأوراق والشجيرات وفي الأشجار، والطلبة يسجلون قائمة النباتات والحيوانات (حشرات، طيور) والعلاقات الغذائية الملاحظة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رسم السلاسل: يعود المعلم بالطلبة إلى الصف ويوجه حل الأسئلة 1–4 ص 35، والطلبة يرسمون ثلاث سلاسل غذائية من ملاحظاتهم وسلسلتين من مزرعة محمد (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. مشاركة واعتماد متبادل: يناقش المعلم السؤال 3: الشجرة مأوى للطيور، الأزهار توفر حبوب اللقاح للنحل، والطلبة يعرضون سلاسلهم ويقترحون أمثلة على الاعتماد المتبادل (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – موطن وادي شاب: تتخيل المجموعات موطنًا طبيعيًا في وادٍ عماني، وتكون سلسلة غذائية من كائناته الحية، وتعرضها بأسهم على اللوح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] سمِّ ثلاثة نباتات وثلاثة حيوانات لاحظتها.\n   الإجابة النموذجية: تعتمد على الموطن، مثل: عشب، شجرة نيم، مانجو؛ نملة، عصفور، فراشة.\n2. [مستوى التطبيق] ارسم سلسلة غذائية من ملاحظاتك.\n   الإجابة النموذجية: مثل: عشب ← جرادة ← طائر (أي سلسلة صحيحة تبدأ بنبات).\n3. [مستوى الاستدلال] كيف توفر شجرة المانجو أكثر من الغذاء للحيوانات؟\n   الإجابة النموذجية: توفر مكانًا للطيور لبناء أعشاشها وظلًا ومأوى للحشرات.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أين بحثت عن الحشرات؟ ولماذا هناك؟\n   الإجابة النموذجية: تحت الأوراق الميتة والشجيرات؛ لأنها أماكن رطبة ومظللة توفر الغذاء والمأوى.\n2. [مستوى التطبيق] بماذا تبدأ السلاسل الغذائية التي رسمتها؟\n   الإجابة النموذجية: بنبات.\n3. [مستوى الاستدلال] كيف تعتمد الأزهار على النحل؟\n   الإجابة النموذجية: ينقل النحل حبوب اللقاح بين الأزهار فيساعد على تكوين البذور.", "للطالب: حل تمرين 2-1 في كتاب النشاط ص 24 واجبًا منزليًا، وإكمال رسم السلاسل في الدفتر. لولي الأمر: يُرجى متابعة الواجب وتشجيع الابن على الرفق بالكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}], "comb": ["الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا (5 دقائق)\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم (20 دقيقة)\nمخرج تعليمي آخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات (15 دقيقة)\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي (15 دقيقة)\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها (10 دقائق)\nمخرج تعليمي آخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح) (15 دقيقة)", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا. ← تذكر\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم. ← فهم\nالمخرج الآخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات. ← فهم\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي. ← تطبيق\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها. ← تطبيق\nالمخرج الآخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح). ← تحليل", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- السبورة التقليدية\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- الكتاب\n- الأقلام\n- أخرى: حديقة المدرسة، عدسات مكبرة، دفتر ملاحظات", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- الموطن الطبيعي\n- العلاقة الغذائية\n- السلسلة الغذائية\n- الآفات\n- السهم «تتغذى عليه»\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- الملاحظة\n- الموطن الطبيعي\n- السلسلة الغذائية\n- الاعتماد المتبادل", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nيذكّر المعلم بما درسه الطلبة في الصف الرابع عن المواطن الطبيعية، ويسأل: أين يعيش الضب؟ وأين تعيش السمكة؟ وماذا يأكل كل منهما؟ (5 دقائق)\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nيذكّر المعلم بقواعد السلامة والرفق بالكائنات، ويوزع المهام: مسجّل، باحث تحت الأوراق، مراقب للطيور، رسّام. (5 دقائق)", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد) — زمن الحصة 40 دقيقة\n\n1. مزرعة محمد في صحار: يعرض المعلم صورة المزرعة ص 34 ويناقش: النباتات (ذرة، سبانخ، يقطين) والحيوانات والآفات (اليرقات، ثاقبة الذرة)، والطلبة يحددون الكائنات والعلاقات الغذائية بينها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. كتابة السلسلة الغذائية: يشرح المعلم معنى السهم «يتغذى عليه» بمثال: السبانخ ← اليرقة، ويصحح اتجاه السهم، والطلبة يكتبون سلسلتين من المزرعة على السبورة الصغيرة ويصفون كل واحدة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تحدّث: الآفات ومكافحتها: يناقش المعلم كيف تأكل الطيور اليرقات والسحالي ثاقبة الذرة فتحمي المحصول، والطلبة يكملون سلسلة من ثلاث حلقات: ذرة ← ثاقبة الذرة ← سحلية (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد موطنًا محليًا لنشاط الحصة القادمة، والطلبة يجيبون ويختارون موطنًا قرب المدرسة أو المنزل (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1) — زمن الحصة 40 دقيقة\n\n1. نشاط 2-1 في حديقة المدرسة: يرافق المجموعات ويوجه الملاحظة تحت الأوراق والشجيرات وفي الأشجار، والطلبة يسجلون قائمة النباتات والحيوانات (حشرات، طيور) والعلاقات الغذائية الملاحظة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. رسم السلاسل: يعود المعلم بالطلبة إلى الصف ويوجه حل الأسئلة 1–4 ص 35، والطلبة يرسمون ثلاث سلاسل غذائية من ملاحظاتهم وسلسلتين من مزرعة محمد (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. مشاركة واعتماد متبادل: يناقش المعلم السؤال 3: الشجرة مأوى للطيور، الأزهار توفر حبوب اللقاح للنحل، والطلبة يعرضون سلاسلهم ويقترحون أمثلة على الاعتماد المتبادل (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – موطن وادي شاب: تتخيل المجموعات موطنًا طبيعيًا في وادٍ عماني، وتكون سلسلة غذائية من كائناته الحية، وتعرضها بأسهم على اللوح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالموطن الطبيعي؟\n   الإجابة النموذجية: المكان الذي تعيش فيه الكائنات الحية في البيئة.\n2. [مستوى التطبيق] ماذا يعني السهم في السلسلة الغذائية: سبانخ ← يرقة؟\n   الإجابة النموذجية: أن اليرقة تتغذى على السبانخ.\n3. [مستوى الاستدلال] لماذا يفرح المزارع بوجود السحالي في مزرعته؟\n   الإجابة النموذجية: لأنها تأكل الحشرة ثاقبة الذرة فتقلل الضرر على المحصول.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] سمِّ ثلاثة نباتات وثلاثة حيوانات لاحظتها.\n   الإجابة النموذجية: تعتمد على الموطن، مثل: عشب، شجرة نيم، مانجو؛ نملة، عصفور، فراشة.\n2. [مستوى التطبيق] ارسم سلسلة غذائية من ملاحظاتك.\n   الإجابة النموذجية: مثل: عشب ← جرادة ← طائر (أي سلسلة صحيحة تبدأ بنبات).\n3. [مستوى الاستدلال] كيف توفر شجرة المانجو أكثر من الغذاء للحيوانات؟\n   الإجابة النموذجية: توفر مكانًا للطيور لبناء أعشاشها وظلًا ومأوى للحشرات.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اكتب سلسلة غذائية من مزرعة محمد.\n   الإجابة النموذجية: مثل: ورقة سبانخ ← يرقة ← طائر، أو ذرة ← حشرة ثاقبة الذرة ← سحلية.\n2. [مستوى التطبيق] ما الآفة؟ أعط مثالًا.\n   الإجابة النموذجية: كائن يضر بالمزروعات، مثل اليرقات أو الحشرة ثاقبة الذرة.\n3. [مستوى الاستدلال] ماذا يحدث لمحصول الذرة لو اختفت السحالي من المزرعة؟ ولماذا؟\n   الإجابة النموذجية: قد يتضرر أكثر لأن أعداد ثاقبة الذرة ستزداد دون من يأكلها.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أين بحثت عن الحشرات؟ ولماذا هناك؟\n   الإجابة النموذجية: تحت الأوراق الميتة والشجيرات؛ لأنها أماكن رطبة ومظللة توفر الغذاء والمأوى.\n2. [مستوى التطبيق] بماذا تبدأ السلاسل الغذائية التي رسمتها؟\n   الإجابة النموذجية: بنبات.\n3. [مستوى الاستدلال] كيف تعتمد الأزهار على النحل؟\n   الإجابة النموذجية: ينقل النحل حبوب اللقاح بين الأزهار فيساعد على تكوين البذور.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nللطالب: قراءة كتاب الطالب ص 34، وملاحظة النباتات والحيوانات في حديقة المنزل أو الحي. لولي الأمر: يُرجى مرافقة الابن عند زيارة حديقة أو مزرعة لملاحظة الكائنات الحية.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nللطالب: حل تمرين 2-1 في كتاب النشاط ص 24 واجبًا منزليًا، وإكمال رسم السلاسل في الدفتر. لولي الأمر: يُرجى متابعة الواجب وتشجيع الابن على الرفق بالكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}, {"id": "2-2", "title": "السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 36–37 | كتاب النشاط ص 25–26 | دليل المعلم ص 49–51", "n": 2, "per": [{"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 36 | دليل المعلم ص 49–50", "num": "الحصة الأولى من 3", "focus": "النباتات كائنات منتجة والحيوانات كائنات مستهلكة"}, "f": ["1. يعرّف الكائن المنتج والكائن المستهلك (10 دقائق)\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات (10 دقائق)\n3. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون (5 دقائق)\n4. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس (5 دقائق)\n\nمخرج تعليمي آخر:\nيرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة (5 دقائق)\nيتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية (5 دقائق)", "1. يعرّف الكائن المنتج والكائن المستهلك. ← تذكر\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات. ← فهم\n3. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون. ← تذكر\n4. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس. ← تطبيق\nالمخرج الآخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة. ← تطبيق\nالمخرج الآخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية. ← تطبيق", "- العصف الذهني\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- صورة توضيحية\n- أخرى: أصص زرع، شتلات فاصوليا مُعدة مسبقًا، ملصقات", "- الكائن المنتج\n- الكائن المستهلك\n- الطاقة\n- السلسلة الغذائية\n- صنع الغذاء\n- ضوء الشمس\n- ثاني أكسيد الكربون\n- الأكسجين\n- العامل المؤثر", "يسأل المعلم: ماذا أكلت خلال الـ24 ساعة الماضية؟ ويكتب قائمة على السبورة، ثم يسأل: أيها من النباتات أو مصدره نبات؟ (5 دقائق)", "1. تتبع الطعام إلى النبات: يسأل المعلم عن الأطعمة الحيوانية: الدجاجة ماذا تأكل؟ الخروف ماذا يأكل؟ ويقود إلى أن كل غذاء يعود إلى النبات، والطلبة يكملون سلاسل: ذرة ← دجاجة ← إنسان (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المنتج والمستهلك: يقدم المعلم المفهومين من ص 36 ويطرح: ماذا لو لم توجد النباتات؟ والطلبة يحددون المنتج والمستهلك في السلسلتين ص 36 (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 1 ص 36: يوجه المعلم ترتيب: سبانخ – طائر – يرقة؛ إنسان – عشب – خروف، والطلبة يرتبون ويرسمون الأسهم (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. كيف تصنع النباتات الغذاء؟: يشرح المعلم ص 37: في الأوراق، بالطاقة من الشمس، من الماء وثاني أكسيد الكربون، ينتج سكر وأكسجين يُطلق في الهواء؛ وتمتص الجذور المغذيات، والطلبة يرسمون مخططًا للورقة: مدخلات ومخرجات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التخطيط لنشاط 2-2: يوجه المجموعات للتخطيط: زوج في الضوء وآخر في الظلام، وزوج يُروى وآخر لا يُروى، مع تثبيت باقي العوامل، والطلبة يحددون العامل المتغير والثوابت ويكتبون التنبؤ ويلصقون الملصقات على الأصص (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. تحدّث: الأكسجين: يناقش المعلم: ما الغاز الذي نتنفسه؟ ومن يعيد إنتاجه؟ والطلبة يستنتجون التوازن بين النباتات والحيوانات في الأكسجين وثاني أكسيد الكربون (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد مسؤولية متابعة الأصص، والطلبة يجيبون ويتقاسمون مهام المتابعة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تسمى النباتات كائنات منتجة؟\n   الإجابة النموذجية: لأنها تصنع غذاءها بنفسها.\n2. [مستوى التطبيق] في السلسلة: بذور الذرة ← دجاجة ← إنسان، حدد المنتج والمستهلكات.\n   الإجابة النموذجية: المنتج: بذور الذرة. المستهلكات: الدجاجة والإنسان.\n3. [مستوى الاستدلال] ماذا يحدث للحيوانات لو اختفت كل النباتات؟ ولماذا؟\n   الإجابة النموذجية: تموت في النهاية؛ لأن آكلات النباتات لن تجد غذاء، ثم الحيوانات التي تأكلها.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] أين تصنع النباتات غذاءها؟\n   الإجابة النموذجية: في أوراقها.\n5. [مستوى التطبيق] ما الغاز الذي تأخذه النباتات من الهواء لصنع الغذاء؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n6. [مستوى الاستدلال] في استقصاء الضوء، ما العامل الذي سنغيّره وما العوامل التي نثبّتها؟\n   الإجابة النموذجية: نغير الضوء (ضوء/ظلام)، ونثبت كمية الماء ونوع النبات والتربة والأصيص.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: إنسان – عشب – خروف.\n   الإجابة النموذجية: عشب ← خروف ← إنسان.\n2. [مستوى التطبيق] بماذا تبدأ كل سلسلة غذائية؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n3. [مستوى الاستدلال] هل يعتمد الإنسان على النبات أم النبات على الإنسان؟ وضح.\n   الإجابة النموذجية: الإنسان يعتمد على النبات في غذائه، أما النبات فيصنع غذاءه بنفسه.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ماذا ينتج النبات عند صنع غذائه؟\n   الإجابة النموذجية: السكر والأكسجين.\n5. [مستوى التطبيق] تنبأ: ماذا سيحدث للنبتة التي لا تُروى؟\n   الإجابة النموذجية: ستذبل وقد تموت لأنها لا تستطيع صنع الغذاء دون ماء.\n6. [مستوى الاستدلال] لماذا نستخدم نبتتين متشابهتين في كل استقصاء؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فيكون الفرق ناتجًا عن العامل المتغير وحده.", "للطالب: قراءة كتاب الطالب ص 36 وكتابة سلسلتين غذائيتين من طعام العائلة. لولي الأمر: يُرجى مناقشة الابن في مصادر طعام وجبة العشاء.\nللطالب: متابعة الأصص يوميًا وتسجيل الملاحظات (الطول ولون الأوراق) في جدول. لولي الأمر: يُرجى تشجيع الابن على زراعة بذرة في المنزل ومتابعة نموها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 37 | كتاب النشاط ص 25–26 | دليل المعلم ص 50–51", "num": "الحصة الثالثة من 3", "focus": "نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية"}, "f": ["1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته (10 دقائق)\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء (10 دقائق)\n\nمخرج تعليمي آخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة (20 دقيقة)", "1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته. ← تقييم\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء. ← تحليل\nالمخرج الآخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلات الاستقصاء المعدّة مسبقًا (ضوء/ظلام، مروية/غير مروية)", "- النتائج\n- التفسير\n- الدليل\n- الكائن المنتج\n- الكائن المستهلك", "يضع المعلم أمام الطلبة أصص الاستقصاء التي أعدّها مسبقًا (منذ أسبوع)، ويطلب منهم وصف الفرق دون لمسها. (5 دقائق)", "1. تحليل النتائج (أسئلة نشاط 2-2): يوجه المعلم الإجابة عن الأسئلة 1–3: العامل المؤثر، التنبؤ، الدليل، والطلبة يقارنون: نبتة الظلام صفراء لا تنمو، والمحرومة من الماء ذابلة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التفسير العلمي: يربط المعلم النتائج بصنع الغذاء: دون ضوء أو ماء لا يصنع النبات غذاءه، والطلبة يكتبون تفسيرًا لكل نتيجة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-2 في كتاب النشاط: يوجه المعلم حل تمرين 2-2 (ص 25–26): حاجات النبات وتحديد المنتج والمستهلكات وترتيب سلسلة، والطلبة يحلون فرديًا ثم يصححون مع المعلم (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – سلسلة تبدأ بالسمر: تكوّن الأزواج سلاسل غذائية تبدأ بنباتات عمانية كالسمر والغاف ثم الحيوانات المستهلكة، وتحدد المنتج والمستهلكين (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما العامل المؤثر في الاستقصاء الأول؟ وفي الثاني؟\n   الإجابة النموذجية: الأول: الماء. الثاني: ضوء الشمس.\n2. [مستوى التطبيق] صف النبتة التي وُضعت في الظلام.\n   الإجابة النموذجية: لم تنمُ جيدًا وتحولت أوراقها إلى اللون الأصفر.\n3. [مستوى الاستدلال] هل تدعم النتائج تنبؤك؟ ووضح السبب علميًا.\n   الإجابة النموذجية: نعم؛ لأن النبات يحتاج إلى الضوء والماء لصنع غذائه، فلما حُرم أحدهما ضعف نموه.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: أسد – شجرة – حمار وحشي.\n   الإجابة النموذجية: شجرة ← حمار وحشي ← أسد.\n2. [مستوى التطبيق] لماذا ذبلت النبتة غير المروية؟\n   الإجابة النموذجية: لأنها لم تحصل على الماء الذي تحتاجه لصنع الغذاء والبقاء.\n3. [مستوى الاستدلال] اقترح استقصاءً لمعرفة هل يحتاج النبات إلى الهواء.\n   الإجابة النموذجية: نضع نبتة في وعاء محكم دون هواء وأخرى في الهواء مع تثبيت الماء والضوء ونقارن النمو.", "للطالب: إكمال تمرين 2-2 (كتاب النشاط ص 25–26) ومراجعة ص 36–37. لولي الأمر: يُرجى مناقشة الابن في أهمية النبات لحيوانات كائنات مستهلكة\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- صورة توضيحية\n- أخرى: أصص زرع، شتلات فاصوليا مُعدة مسبقًا، ملصقات\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلات الاستقصاء المعدّة مسبقًا (ضوء/ظلام، مروية/غير مروية)", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n- الكائن المنتج\n- الكائن المستهلك\n- الطاقة\n- السلسلة الغذائية\n- صنع الغذاء\n- ضوء الشمس\n- ثاني أكسيد الكربون\n- الأكسجين\n- العامل المؤثر\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- النتائج\n- التفسير\n- الدليل\n- الكائن المنتج\n- الكائن المستهلك", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nيسأل المعلم: ماذا أكلت خلال الـ24 ساعة الماضية؟ ويكتب قائمة على السبورة، ثم يسأل: أيها من النباتات أو مصدره نبات؟ (5 دقائق)\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nيضع المعلم أمام الطلبة أصص الاستقصاء التي أعدّها مسبقًا (منذ أسبوع)، ويطلب منهم وصف الفرق دون لمسها. (5 دقائق)", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة — زمن الحصة 40 دقيقة\n1. تتبع الطعام إلى النبات: يسأل المعلم عن الأطعمة الحيوانية: الدجاجة ماذا تأكل؟ الخروف ماذا يأكل؟ ويقود إلى أن كل غذاء يعود إلى النبات، والطلبة يكملون سلاسل: ذرة ← دجاجة ← إنسان (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المنتج والمستهلك: يقدم المعلم المفهومين من ص 36 ويطرح: ماذا لو لم توجد النباتات؟ والطلبة يحددون المنتج والمستهلك في السلسلتين ص 36 (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 1 ص 36: يوجه المعلم ترتيب: سبانخ – طائر – يرقة؛ إنسان – عشب – خروف، والطلبة يرتبون ويرسمون الأسهم (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. كيف تصنع النباتات الغذاء؟: يشرح المعلم ص 37: في الأوراق، بالطاقة من الشمس، من الماء وثاني أكسيد الكربون، ينتج سكر وأكسجين يُطلق في الهواء؛ وتمتص الجذور المغذيات، والطلبة يرسمون مخططًا للورقة: مدخلات ومخرجات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التخطيط لنشاط 2-2: يوجه المجموعات للتخطيط: زوج في الضوء وآخر في الظلام، وزوج يُروى وآخر لا يُروى، مع تثبيت باقي العوامل، والطلبة يحددون العامل المتغير والثوابت ويكتبون التنبؤ ويلصقون الملصقات على الأصص (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. تحدّث: الأكسجين: يناقش المعلم: ما الغاز الذي نتنفسه؟ ومن يعيد إنتاجه؟ والطلبة يستنتجون التوازن بين النباتات والحيوانات في الأكسجين وثاني أكسيد الكربون (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد مسؤولية متابعة الأصص، والطلبة يجيبون ويتقاسمون مهام المتابعة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية — زمن الحصة 40 دقيقة\n1. تحليل النتائج (أسئلة نشاط 2-2): يوجه المعلم الإجابة عن الأسئلة 1–3: العامل المؤثر، التنبؤ، الدليل، والطلبة يقارنون: نبتة الظلام صفراء لا تنمو، والمحرومة من الماء ذابلة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التفسير العلمي: يربط المعلم النتائج بصنع الغذاء: دون ضوء أو ماء لا يصنع النبات غذاءه، والطلبة يكتبون تفسيرًا لكل نتيجة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-2 في كتاب النشاط: يوجه المعلم حل تمرين 2-2 (ص 25–26): حاجات النبات وتحديد المنتج والمستهلكات وترتيب سلسلة، والطلبة يحلون فرديًا ثم يصححون مع المعلم (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – سلسلة تبدأ بالسمر: تكوّن الأزواج سلاسل غذائية تبدأ بنباتات عمانية كالسمر والغاف ثم الحيوانات المستهلكة، وتحدد المنتج والمستهلكين (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تسمى النباتات كائنات منتجة؟\n   الإجابة النموذجية: لأنها تصنع غذاءها بنفسها.\n2. [مستوى التطبيق] في السلسلة: بذور الذرة ← دجاجة ← إنسان، حدد المنتج والمستهلكات.\n   الإجابة النموذجية: المنتج: بذور الذرة. المستهلكات: الدجاجة والإنسان.\n3. [مستوى الاستدلال] ماذا يحدث للحيوانات لو اختفت كل النباتات؟ ولماذا؟\n   الإجابة النموذجية: تموت في النهاية؛ لأن آكلات النباتات لن تجد غذاء، ثم الحيوانات التي تأكلها.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] أين تصنع النباتات غذاءها؟\n   الإجابة النموذجية: في أوراقها.\n5. [مستوى التطبيق] ما الغاز الذي تأخذه النباتات من الهواء لصنع الغذاء؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n6. [مستوى الاستدلال] في استقصاء الضوء، ما العامل الذي سنغيّره وما العوامل التي نثبّتها؟\n   الإجابة النموذجية: نغير الضوء (ضوء/ظلام)، ونثبت كمية الماء ونوع النبات والتربة والأصيص.\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما العامل المؤثر في الاستقصاء الأول؟ وفي الثاني؟\n   الإجابة النموذجية: الأول: الماء. الثاني: ضوء الشمس.\n2. [مستوى التطبيق] صف النبتة التي وُضعت في الظلام.\n   الإجابة النموذجية: لم تنمُ جيدًا وتحولت أوراقها إلى اللون الأصفر.\n3. [مستوى الاستدلال] هل تدعم النتائج تنبؤك؟ ووضح السبب علميًا.\n   الإجابة النموذجية: نعم؛ لأن النبات يحتاج إلى الضوء والماء لصنع غذائه، فلما حُرم أحدهما ضعف نموه.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: إنسان – عشب – خروف.\n   الإجابة النموذجية: عشب ← خروف ← إنسان.\n2. [مستوى التطبيق] بماذا تبدأ كل سلسلة غذائية؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n3. [مستوى الاستدلال] هل يعتمد الإنسان على النبات أم النبات على الإنسان؟ وضح.\n   الإجابة النموذجية: الإنسان يعتمد على النبات في غذائه، أما النبات فيصنع غذاءه بنفسه.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ماذا ينتج النبات عند صنع غذائه؟\n   الإجابة النموذجية: السكر والأكسجين.\n5. [مستوى التطبيق] تنبأ: ماذا سيحدث للنبتة التي لا تُروى؟\n   الإجابة النموذجية: ستذبل وقد تموت لأنها لا تستطيع صنع الغذاء دون ماء.\n6. [مستوى الاستدلال] لماذا نستخدم نبتتين متشابهتين في كل استقصاء؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فيكون الفرق ناتجًا عن العامل المتغير وحده.\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: أسد – شجرة – حمار وحشي.\n   الإجابة النموذجية: شجرة ← حمار وحشي ← أسد.\n2. [مستوى التطبيق] لماذا ذبلت النبتة غير المروية؟\n   الإجابة النموذجية: لأنها لم تحصل على الماء الذي تحتاجه لصنع الغذاء والبقاء.\n3. [مستوى الاستدلال] اقترح استقصاءً لمعرفة هل يحتاج النبات إلى الهواء.\n   الإجابة النموذجية: نضع نبتة في وعاء محكم دون هواء وأخرى في الهواء مع تثبيت الماء والضوء ونقارن النمو.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nللطالب: قراءة كتاب الطالب ص 36 وكتابة سلسلتين غذائيتين من طعام العائلة. لولي الأمر: يُرجى مناقشة الابن في مصادر طعام وجبة العشاء.\nللطالب: متابعة الأصص يوميًا وتسجيل الملاحظات (الطول ولون الأوراق) في جدول. لولي الأمر: يُرجى تشجيع الابن على زراعة بذرة في المنزل ومتابعة نموها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10\n\nالحصة 2: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nللطالب: إكمال تمرين 2-2 (كتاب النشاط ص 25–26) ومراجعة ص 36–37. لولي الأمر: يُرجى مناقشة الابن في أهمية النباتات لحياة الإنسان والحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"id": "2-3", "title": "الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38–39 | كتاب النشاط ص 27–28، 63 | دليل المعلم ص 51–54", "n": 4, "per": [{"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38 | دليل المعلم ص 51–53", "num": "الحصة الأولى من 5", "focus": "المفترس والفريسة"}, "f": ["1. يعرّف المفترس والفريسة (5 دقائق)\n2. يميّز المفترس من الفريسة في أمثلة مصورة (10 دقائق)\n3. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته (10 دقائق)\n4. يحدد النمط المشترك في السلاسل الغذائية (5 دقائق)\n\nمخرج تعليمي آخر:\nيصف بعض طرق المفترسات في اصطياد فرائسها (5 دقائق)\nيحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس (5 دقائق)", "1. يعرّف المفترس والفريسة. ← تذكر\n2. يميّز المفترس من الفريسة في أمثلة مصورة. ← فهم\n3. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته. ← تطبيق\n4. يحدد النمط المشترك في السلاسل الغذائية. ← تحليل\nالمخرج الآخر: يصف بعض طرق المفترسات في اصطياد فرائسها. ← فهم\nالمخرج الآخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس. ← تحليل", "- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: بطاقات كائنات حية وخيوط لبناء سلاسل معلّقة", "- المفترس\n- الفريسة\n- الكائن المستهلك\n- الحيوانات آكلة النباتات\n- سلسلة غذائية\n- المفترس الأعلى\n- النمط\n- الكائن المنتج", "يعرض المعلم صور حيوانات مختلطة، ويسأل: أي هذه الحيوانات يأكل حيوانًا آخر؟ وأيها يُؤكل؟ (5 دقائق)", "1. المصطلحات والأمثلة: يقدم المعلم المفترس والفريسة بأمثلة ص 38: البومة والفأر، الثعبان، الضفدع والحشرات، والطلبة يكتبون التعريفين ويضيفون أمثلة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. لعبة «مفترس أو فريسة؟»: يعرض المعلم بطاقات حيوانات تباعًا، ومنها ما يكون مفترسًا وفريسة معًا (السحلية)، والطلبة يرفعون بطاقة (مفترس/فريسة/كلاهما) ويبررون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. طرق الافتراس: يناقش المعلم: السم لدى بعض الثعابين، الابتلاع، الصيد ليلًا للبومة، والطلبة يرسمون حيوانًا مفترسًا ويكتبون طريقة صيده (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. السؤال 1 ص 39: يوجه المعلم الربط بين المفترسات الخمسة وفرائسها في الشكل، والطلبة يصلون بين كل مفترس وفريسته (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. سلاسل معلّقة: يوزع المعلم بطاقات كائنات على المجموعات لبناء سلاسل معلّقة بالخيوط تبدأ بالمنتج، والطلبة يبنون سلسلتين ويحددون المنتج والفريسة والمفترس (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. السؤالان 3 و4: النمط: يقود المعلم المقارنة بين سلاسل المجموعات، والطلبة يستنتجون النمط: منتج ← فريسة (آكل نبات) ← مفترس (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالمفترس؟\n   الإجابة النموذجية: حيوان مستهلك يصطاد الحيوانات الأخرى ويتغذى عليها.\n2. [مستوى التطبيق] في الزوج (البومة، الفأر)، من الفريسة؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] لماذا يمكن أن تكون السحلية مفترسًا وفريسة في الوقت نفسه؟\n   الإجابة النموذجية: لأنها تأكل الجراد فتكون مفترسًا، ويأكلها الصقر فتكون فريسة.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] بماذا يجب أن تبدأ أي سلسلة غذائية ترسمها؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n5. [مستوى التطبيق] في السلسلة: عشب ← جرادة ← سحلية ← صقر، ما الفريسة الأولى؟\n   الإجابة النموذجية: الجرادة.\n6. [مستوى الاستدلال] ما النمط الذي تسلكه جميع السلاسل التي رسمتموها؟\n   الإجابة النموذجية: تبدأ بمنتج يتغذى عليه مستهلك (فريسة) ثم يأكله مفترس.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفريسة؟\n   الإجابة النموذجية: الحيوان الذي تصطاده الحيوانات المفترسة وتتغذى عليه.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من بيئتك.\n   الإجابة النموذجية: مثل: القط والفأر، أو الطائر والجرادة (تقبل الأمثلة الصحيحة).\n3. [مستوى الاستدلال] هل كل المستهلكات مفترسات؟ وضح بمثال.\n   الإجابة النموذجية: لا؛ فبعضها يتغذى على النباتات فقط مثل الخروف والجمل.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ارسم سلسلة غذائية بها مفترسان.\n   الإجابة النموذجية: مثل: نبات ← جراد ← سحلية ← صقر.\n5. [مستوى التطبيق] أي كائن في سلسلتك لا يأكله غيره؟\n   الإجابة النموذجية: المفترس الأعلى (مثل الصقر).\n6. [مستوى الاستدلال] لماذا لا تكون السلاسل الغذائية طويلة جدًا عادة؟\n   الإجابة النموذجية: لأن الطاقة تقل في كل حلقة فلا تكفي حلقات كثيرة (تقبل الإجابة المبسطة).", "للطالب: قراءة كتاب الطالب ص 38 وكتابة ثلاثة أزواج (مفترس – فريسة). لولي الأمر: يُرجى مشاهدة مقطع وثائقي قصير عن الحياة البرية مع الابن.\nللطالب: رسم سلسلة غذائية من موطنه المحلي بها مفترس وفريسته (السؤال 2 ص 39). لولي الأمر: يُرجى مساعدة الابن في معرفة أسماء حيوانات منطقته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | دليل المعلم ص 53", "num": "الحصة الثالثة من 5", "focus": "أعداد المفترسات والفرائس وتأثير اختلال السلسلة"}, "f": ["1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات (15 دقيقة)\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية (10 دقائق)\n\nمخرج تعليمي آخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه (15 دقيقة)", "1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات. ← تحليل\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية. ← تطبيق\nالمخرج الآخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه. ← تقييم", "- التعلم المبني على اللعب\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: بطاقات ملوّنة لمحاكاة أعداد المنتجات والفرائس والمفترسات", "- أعداد الكائنات\n- التوازن\n- الآثار المترتبة\n- التنبؤ", "يوزع المعلم 20 بطاقة خضراء (نباتات) و6 صفراء (آكلات نبات) وبطاقة حمراء واحدة (مفترس)، ويسأل: لماذا تتوقع هذه الأعداد؟ (5 دقائق)", "1. محاكاة الهرم الغذائي: يدير المعلم جولات: كل آكل نبات يحتاج 3 نباتات، والمفترس يحتاج آكلي نبات ليبقى، والطلبة يجرون الجولات ويسجلون من بقي ومن هلك (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ماذا لو؟: يطرح المعلم مواقف: اختفاء المفترس؛ اختفاء العشب؛ زيادة الجراد، والطلبة يتنبؤون بالنتائج في ثنائيات ويعرضونها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تصحيح المفاهيم الخاطئة: يوضح المعلم أن المفترس يأكل بعض الكائنات لا كلها، وأن الفرائس أكثر عددًا، والطلبة يكتبون عبارتين صحيحتين في الدفتر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أيهما أكثر عددًا في الموطن عادة: الفرائس أم المفترسات؟\n   الإجابة النموذجية: الفرائس.\n2. [مستوى التطبيق] ماذا يحدث لأعداد الجراد إذا اختفت السحالي؟\n   الإجابة النموذجية: تزداد أعداد الجراد.\n3. [مستوى الاستدلال] ثم ماذا يحدث للنباتات بعد زيادة الجراد؟ وما أثر ذلك على الجراد نفسه لاحقًا؟\n   الإجابة النموذجية: تقل النباتات لأن الجراد يأكلها، ثم يقل الجراد لنقص الغذاء.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج الموطن إلى نباتات كثيرة؟\n   الإجابة النموذجية: لأنها غذاء لعدد كبير من آكلات النباتات التي تعتمد عليها السلسلة كلها.\n2. [مستوى التطبيق] صحح العبارة: «الأسد يأكل كل الحيوانات الموجودة أسفل منه في السلسلة».\n   الإجابة النموذجية: الأسد يأكل بعض الحيوانات فقط وليس كلها.\n3. [مستوى الاستدلال] ماذا يحدث للنباتات إذا ماتت كل المفترسات فجأة؟ وضح بالتسلسل.\n   الإجابة النموذجية: تزداد آكلات النباتات فتأكل النباتات بكثرة حتى تقل، ثم تموت كثير من الحيوانات جوعًا.", "للطالب: التفكير في سؤال: ماذا يحدث لو اختفى النحل من الحدائق؟ وكتابة الإجابة في الدفتر. لولي الأمر: يُرجى مناقشة الابن في أهمية عدم الصيد الجائر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | كتاب النشاط ص 27–28، 63 | دليل المعلم ص 53–54", "num": "الحصة الرابعة من 5", "focus": "تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)"}, "f": ["1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا (15 دقيقة)\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا (15 دقيقة)\n\nمخرج تعليمي آخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة (10 دقائق)", "1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا. ← تطبيق\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا. ← تطبيق\nالمخرج الآخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة. ← فهم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Ed son": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | كتاب النشاط ص 63 | دليل المعلم ص 53–54", "num": "الحصة الخامسة من 5", "focus": "النبات آكل الحشرات ومراجعة الكائنات المستهلكة"}, "f": ["1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط (10 دقائق)\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة (15 دقيقة)\n\nمخرج تعليمي آخر: يقيّم ملصقات زملائه وفق معايير محددة (15 دقيقة)", "1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط. ← تحليل\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه وفق معايير محددة. ← تقييم", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: أوراق ملصقات كبيرة", "- النبات آكل الحشرات\n- المغذيات\n- التربة الفقيرة\n- المنتج والمستهلك", "يعرض المعلم مقطعًا قصيرًا لنبات صائد الذباب وهو يُطبق على ذبابة، ويسأل: هل هذا نبات أم حيوان مفترس؟ (5 دقائق)", "1. سؤال التحدي ص 39: يشرح المعلم: ينمو في تربة فقيرة المغذيات، يصنع السكر من ضوء الشمس كغيره، ويأخذ المغذيات من الحشرات؛ أمثلة: نبات الإبريق والدروسيرا، والطلبة يناقشون: هل هو منتج أم مستهلك؟ ولماذا لا يلائم النمط؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ملصق السلسلة المحلية: يحدد المعلم معايير الملصق: سلسلة من 3–4 حلقات من البيئة العُمانية، تسميات، ألوان، عنوان، وتصمم المجموعات الملصق وتحدد المنتج والفريسة والمفترس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. جولة المعرض: يدير المعلم جولة تقييم الأقران بالمعايير، والطلبة يقيّمون ملصقات زملائهم ويقدمون ملاحظة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. غلق الدرس – مفترس وفريسة في ظفار: تمثل المجموعات علاقات مفترس وفريسة في بيئة عمانية كالنمر العربي في جبال ظفار، وتتحدث عن حمايته من الانقراض (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يصطاد النبات آكل الحشرات الذباب؟\n   الإجابة النموذجية: ليحصل على المغذيات من أجسامها لأن تربته فقيرة بالمغذيات.\n2. [مستوى التطبيق] هل يصنع النبات آكل الحشرات السكر بنفسه؟\n   الإجابة النموذجية: نعم، يصنعه من ضوء الشمس مثل النباتات الأخرى.\n3. [مستوى الاستدلال] لماذا يُعد هذا النبات مثالًا «غير ملائم للنمط»؟\n   الإجابة النموذجية: لأن النمط المعتاد أن الحيوان يأكل النبات، أما هنا فالنبات يصطاد الحيوان.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر اسم نبات آكل للحشرات.\n   الإجابة النموذجية: نبات الإبريق أو الدروسيرا أو صائد الذباب.\n2. [مستوى التطبيق] في ملصقك، حدد المنتج والمفترس الأعلى.\n   الإجابة النموذجية: تعتمد على الملصق، مثل: عشب (منتج) وصقر (مفترس أعلى).\n3. [مستوى الاستدلال] صمم سؤالًا لزملائك عن السلاسل الغذائية مع إجابته.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها الصحيحة.", "للطالب: حل ورقة العمل 2-3 (كتاب النشاط ص 63) إن لم تكتمل، ومراجعة ص 38–39. لولي الأمر: يُرجى الاطلاع على الملصق الذي صممه الابن وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}], "comb": ["الحصة 1: المفترس والفريسة\n1. يعرّف المفترس والفريسة (5 دقائق)\n2. يميّز المفترس من الفريسة في أمثلة مصورة (10 دقائق)\n3. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته (10 دقائق)\n4. يحدد النمط المشترك في السلاسل الغذائية (5 دقائق)\n\nمخرج تعليمي آخر:\nيصف بعض طرق المفترسات في اصطياد فرائسها (5 دقائق)\nيحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس (5 دقائق)\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات (15 دقيقة)\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية (10 دقائق)\n\nمخرج تعليمي آخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه (15 دقيقة)\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا (15 دقيقة)\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا (15 دقيقة)\n\nمخرج تعليمي آخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة (10 دقائق)\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط (10 دقائق)\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة (15 دقيقة)\n\nمخرج تعليمي آخر: يقيّم ملصقات زملائه وفق معايير محددة (15 دقيقة)", "الحصة 1: المفترس والفريسة\n1. يعرّف المفترس والفريسة. ← تذكر\n2. يميّز المفترس من الفريسة في أمثلة مصورة. ← فهم\n3. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته. ← تطبيق\n4. يحدد النمط المشترك في السلاسل الغذائية. ← تحليل\nالمخرج الآخر: يصف بعض طرق المفترسات في اصطياد فرائسها. ← فهم\nالمخرج الآخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس. ← تحليل\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات. ← تحليل\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية. ← تطبيق\nالمخرج الآخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه. ← تقييم\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا. ← تطبيق\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا. ← تطبيق\nالمخرج الآخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة. ← فهم\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط. ← تحليل\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه وفق معايير محددة. ← تقييم", "الحصة 1: المفترس والفريسة\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم التشاركي\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- التعلم المبني على اللعب\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "الحصة 1: المفترس والفريسة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: بطاقات كائنات حية وخيوط لبناء سلاسل معلّقة\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: بطاقات ملوّنة لمحاكاة أعداد المنتجات والفرائس والمفترسات\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-3 وورقة العمل 2-3 في كتاب النشاط\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: أوراق ملصقات كبيرة", "الحصة 1: المفترس والفريسة\n- المفترس\n- الفريسة\n- الكائن المستهلك\n- الحيوانات آكلة النباتات\n- سلسلة غذائية\n- المفترس الأعلى\n- النمط\n- الكائن المنتج\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- أعداد الكائنات\n- التوازن\n- الآثار المترتبة\n- التنبؤ\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- السافانا\n- شجرة الأكاسيا\n- غزال الإمبالا\n- الحمار الوحشي\n- الضبع\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- النبات آكل الحشرات\n- المغذيات\n- التربة الفقيرة\n- المنتج والمستهلك", "الحصة 1: المفترس والفريسة\nيعرض المعلم صور حيوانات مختلطة، ويسأل: أي هذه الحيوانات يأكل حيوانًا آخر؟ وأيها يُؤكل؟ (5 دقائق)\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nيوزع المعلم 20 بطاقة خضراء (نباتات) و6 صفراء (آكلات نبات) وبطاقة حمراء واحدة (مفترس)، ويسأل: لماذا تتوقع هذه الأعداد؟ (5 دقائق)\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nيعرض المعلم صورة للسافانا ويسأل: ما أول كائن تراه في هذه الصورة يصنع غذاءه بنفسه؟ (5 دقائق)\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nيعرض المعلم مقطعًا قصيرًا لنبات صائد الذباب وهو يُطبق على ذبابة، ويسأل: هل هذا نبات أم حيوان مفترس؟ (5 دقائق)", "الحصة 1: المفترس والفريسة — زمن الحصة 40 دقيقة\n1. المصطلحات والأمثلة: يقدم المعلم المفترس والفريسة بأمثلة ص 38: البومة والفأر، الثعبان، الضفدع والحشرات، والطلبة يكتبون التعريفين ويضيفون أمثلة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. لعبة «مفترس أو فريسة؟»: يعرض المعلم بطاقات حيوانات تباعًا، ومنها ما يكون مفترسًا وفريسة معًا (السحلية)، والطلبة يرفعون بطاقة (مفترس/فريسة/كلاهما) ويبررون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. طرق الافتراس: يناقش المعلم: السم لدى بعض الثعابين، الابتلاع، الصيد ليلًا للبومة، والطلبة يرسمون حيوانًا مفترسًا ويكتبون طريقة صيده (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. السؤال 1 ص 39: يوجه المعلم الربط بين المفترسات الخمسة وفرائسها في الشكل، والطلبة يصلون بين كل مفترس وفريسته (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. سلاسل معلّقة: يوزع المعلم بطاقات كائنات على المجموعات لبناء سلاسل معلّقة بالخيوط تبدأ بالمنتج، والطلبة يبنون سلسلتين ويحددون المنتج والفريسة والمفترس (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. السؤالان 3 و4: النمط: يقود المعلم المقارنة بين سلاسل المجموعات، والطلبة يستنتجون النمط: منتج ← فريسة (آكل نبات) ← مفترس (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة — زمن الحصة 40 دقيقة\n1. محاكاة الهرم الغذائي: يدير المعلم جولات: كل آكل نبات يحتاج 3 نباتات، والمفترس يحتاج آكلي نبات ليبقى، والطلبة يجرون الجولات ويسجلون من بقي ومن هلك (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ماذا لو؟: يطرح المعلم مواقف: اختفاء المفترس؛ اختفاء العشب؛ زيادة الجراد، والطلبة يتنبؤون بالنتائج في ثنائيات ويعرضونها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تصحيح المفاهيم الخاطئة: يوضح المعلم أن المفترس يأكل بعض الكائنات لا كلها، وأن الفرائس أكثر عددًا، والطلبة يكتبون عبارتين صحيحتين في الدفتر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3) — زمن الحصة 40 دقيقة\n1. تمرين 2-3 (كتاب النشاط ص 27–28): يوجه المعلم الحل: المنتجات (الأكاسيا، الحشائش)، آكلات النبات (الإمبالا، النمل الأبيض، البابون، الحمار الوحشي)، المفترسات (الأسد، الضبع، النمر)، ورسم السلاسل، والطلبة يحلون فرديًا ثم يقارنون مع زميل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 2-3 (ص 63): يوجه المعلم إكمال الفراغات بالمصطلحات، مع دعم المتعثرين، والطلبة يكملون النص عن المنتجات والمستهلكات والمفترس والفريسة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. التصحيح الجماعي: يعرض المعلم الإجابات ويناقش السلسلة الأطول: حشائش ← حمار وحشي ← ضبع ← أسد، والطلبة يصححون بالقلم الأخضر (تقييم ذاتي) (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة — زمن الحصة 40 دقيقة\n1. سؤال التحدي ص 39: يشرح المعلم: ينمو في تربة فقيرة المغذيات، يصنع السكر من ضوء الشمس كغيره، ويأخذ المغذيات من الحشرات؛ أمثلة: نبات الإبريق والدروسيرا، والطلبة يناقشون: هل هو منتج أم مستهلك؟ ولماذا لا يلائم النمط؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ملصق السلسلة المحلية: يحدد المعلم معايير الملصق: سلسلة من 3–4 حلقات من البيئة العُمانية، تسميات، ألوان، عنوان، وتصمم المجموعات الملصق وتحدد المنتج والفريسة والمفترس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. جولة المعرض: يدير المعلم جولة تقييم الأقران بالمعايير، والطلبة يقيّمون ملصقات زملائهم ويقدمون ملاحظة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. غلق الدرس – مفترس وفريسة في ظفار: تمثل المجموعات علاقات مفترس وفريسة في بيئة عمانية كالنمر العربي في جبال ظفار، وتتحدث عن حمايته من الانقراض (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: المفترس والفريسة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالمفترس؟\n   الإجابة النموذجية: حيوان مستهلك يصطاد الحيوانات الأخرى ويتغذى عليها.\n2. [مستوى التطبيق] في الزوج (البومة، الفأر)، من الفريسة؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] لماذا يمكن أن تكون السحلية مفترسًا وفريسة في الوقت نفسه؟\n   الإجابة النموذجية: لأنها تأكل الجراد فتكون مفترسًا، ويأكلها الصقر فتكون فريسة.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] بماذا يجب أن تبدأ أي سلسلة غذائية ترسمها؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n5. [مستوى التطبيق] في السلسلة: عشب ← جرادة ← سحلية ← صقر، ما الفريسة الأولى؟\n   الإجابة النموذجية: الجرادة.\n6. [مستوى الاستدلال] ما النمط الذي تسلكه جميع السلاسل التي رسمتموها؟\n   الإجابة النموذجية: تبدأ بمنتج يتغذى عليه مستهلك (فريسة) ثم يأكله مفترس.\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أيهما أكثر عددًا في الموطن عادة: الفرائس أم المفترسات؟\n   الإجابة النموذجية: الفرائس.\n2. [مستوى التطبيق] ماذا يحدث لأعداد الجراد إذا اختفت السحالي؟\n   الإجابة النموذجية: تزداد أعداد الجراد.\n3. [مستوى الاستدلال] ثم ماذا يحدث للنباتات بعد زيادة الجراد؟ وما أثر ذلك على الجراد نفسه لاحقًا؟\n   الإجابة النموذجية: تقل النباتات لأن الجراد يأكلها، ثم يقل الجراد لنقص الغذاء.\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر كائنين منتجين في السافانا.\n   الإجابة النموذجية: شجرة الأكاسيا والحشائش.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من التمرين.\n   الإجابة النموذجية: الأسد وغزال الإمبالا (أو الحمار الوحشي).\n3. [مستوى الاستدلال] اكتب سلسلة من أربع حلقات من التمرين.\n   الإجابة النموذجية: حشائش ← حمار وحشي ← ضبع ← أسد.\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يصطاد النبات آكل الحشرات الذباب؟\n   الإجابة النموذجية: ليحصل على المغذيات من أجسامها لأن تربته فقيرة بالمغذيات.\n2. [مستوى التطبيق] هل يصنع النبات آكل الحشرات السكر بنفسه؟\n   الإجابة النموذجية: نعم، يصنعه من ضوء الشمس مثل النباتات الأخرى.\n3. [مستوى الاستدلال] لماذا يُعد هذا النبات مثالًا «غير ملائم للنمط»؟\n   الإجابة النموذجية: لأن النمط المعتاد أن الحيوان يأكل النبات، أما هنا فالنبات يصطاد الحيوان.", "الحصة 1: المفترس والفريسة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفريسة؟\n   الإجابة النموذجية: الحيوان الذي تصطاده الحيوانات المفترسة وتتغذى عليه.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من بيئتك.\n   الإجابة النموذجية: مثل: القط والفأر، أو الطائر والجرادة (تقبل الأمثلة الصحيحة).\n3. [مستوى الاستدلال] هل كل المستهلكات مفترسات؟ وضح بمثال.\n   الإجابة النموذجية: لا؛ فبعضها يتغذى على النباتات فقط مثل الخروف والجمل.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ارسم سلسلة غذائية بها مفترسان.\n   الإجابة النموذجية: مثل: نبات ← جراد ← سحلية ← صقر.\n5. [مستوى التطبيق] أي كائن في سلسلتك لا يأكله غيره؟\n   الإجابة النموذجية: المفترس الأعلى (مثل الصقر).\n6. [مستوى الاستدلال] لماذا لا تكون السلاسل الغذائية طويلة جدًا عادة؟\n   الإجابة النموذجية: لأن الطاقة تقل في كل حلقة فلا تكفي حلقات كثيرة (تقبل الإجابة المبسطة).\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج الموطن إلى نباتات كثيرة؟\n   الإجابة النموذجية: لأنها غذاء لعدد كبير من آكلات النباتات التي تعتمد عليها السلسلة كلها.\n2. [مستوى التطبيق] صحح العبارة: «الأسد يأكل كل الحيوانات الموجودة أسفل منه في السلسلة».\n   الإجابة النموذجية: الأسد يأكل بعض الحيوانات فقط وليس كلها.\n3. [مستوى الاستدلال] ماذا يحدث للنباتات إذا ماتت كل المفترسات فجأة؟ وضح بالتسلسل.\n   الإجابة النموذجية: تزداد آكلات النباتات فتأكل النباتات بكثرة حتى تقل، ثم تموت كثير من الحيوانات جوعًا.\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أكمل: النباتات هي الكائنات الوحيدة التي تصنع ____ بنفسها.\n   الإجابة النموذجية: الغذاء.\n2. [مستوى التطبيق] ما الغاز الناتج عندما تصنع النباتات غذاءها؟\n   الإجابة النموذجية: الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعدّ الحمار الوحشي كائنًا مستهلكًا؟\n   الإجابة النموذجية: لأنه لا يصنع غذاءه بل يتغذى على العشب.\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر اسم نبات آكل للحشرات.\n   الإجابة النموذجية: نبات الإبريق أو الدروسيرا أو صائد الذباب.\n2. [مستوى التطبيق] في ملصقك، حدد المنتج والمفترس الأعلى.\n   الإجابة النموذجية: تعتمد على الملصق، مثل: عشب (منتج) وصقر (مفترس أعلى).\n3. [مستوى الاستدلال] صمم سؤالًا لزملائك عن السلاسل الغذائية مع إجابته.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها الصحيحة.", "الحصة 1: المفترس والفريسة\nللطالب: قراءة كتاب الطالب ص 38 وكتابة ثلاثة أزواج (مفترس – فريسة). لولي الأمر: يُرجى مشاهدة مقطع وثائقي قصير عن الحياة البرية مع الابن.\nللطالب: رسم سلسلة غذائية من موطنه المحلي بها مفترس وفريسته (السؤال 2 ص 39). لولي الأمر: يُرجى مساعدة الابن في معرفة أسماء حيوانات منطقته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11\n\nالحصة 2: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nللطالب: التفكير في سؤال: ماذا يحدث لو اختفى النحل من الحدائق؟ وكتابة الإجابة في الدفتر. لولي الأمر: يُرجى مناقشة الابن في أهمية عدم الصيد الجائر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11\n\nالحصة 3: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nللطالب: حل تمرين 2-3 في كتاب النشاط ص 27–28 واجبًا منزليًا إن لم يكتمل. لولي الأمر: يُرجى تصحيح الواجب مع الابن وتشجيعه على تقييم عمله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11\n\nالحصة 4: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nللطالب: حل ورقة العمل 2-3 (كتاب النشاط ص 63) إن لم تكتمل، ومراجعة ص 38–39. لولي الأمر: يُرجى الاطلاع على الملصق الذي صممه الابن وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"id": "2-4", "title": "السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40–41 | كتاب النشاط ص 29–30 | دليل المعلم ص 53–55", "n": 4, "per": [{"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40 | دليل المعلم ص 54", "num": "الحصة الأولى من 5", "focus": "تنوع المواطن الطبيعية على كوكب الأرض"}, "f": ["1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط (10 دقائق)\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن (5 دقائق)\n3. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا (5 دقائق)\n4. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة (5 دقائق)\n\nمخرج تعليمي آخر:\nيحدد مواقع بعض المواطن على مجسم الكرة الأرضية (10 دقائق)\nيتنبأ بأثر موت المفترسات في السافانا (5 دقائق)", "1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط. ← تذكر\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن. ← فهم\n3. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا. ← فهم\n4. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة. ← تطبيق\nالمخرج الآخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية. ← تطبيق\nالمخرج الآخر: يتنبأ بأثر موت المفترسات في السافانا. ← تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الخرائط الذهنية والمفاهيمية\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية\n- الوسائل المتعددة (سمعية - بصرية)", "- الموطن الطبيعي\n- المناخ\n- الغابة الاستوائية\n- الصحراء\n- السافانا\n- آكلات الأعشاب\n- الثور البري\n- الزرافة\n- المفترس", "يعرض المعلم أربع صور: صحراء، تحت سطح الماء، سهول قطبية، غابة؛ ويسأل: هل تنمو النباتات نفسها في كل هذه الأماكن؟ (5 دقائق)", "1. المناخ والموطن: يشرح المعلم ص 40: المناخ الحار الرطب للغابات الاستوائية، الحار الجاف للصحراء، الحار مع أمطار صيفية للسافانا، والطلبة يملؤون جدولًا: الموطن – المناخ – نباتات – حيوانات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رحلة على الكرة الأرضية: يحدد المعلم على المجسم مواقع الغابات الاستوائية والصحاري والسافانا في إفريقيا، والطلبة يحددون موقع عُمان ونوع موطنها الغالب (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مواطن عُمانية: يقود المعلم مناقشة: الجبال، السواحل، الصحراء، الأفلاج، والطلبة يذكرون كائنات من كل موطن عماني (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. سلاسل السافانا ص 40: يناقش المعلم الأسئلة في الكتاب: المنتجات، المستهلكات، المفترسات وفرائسها، ماذا يأكل كل حيوان، والطلبة يحددون في الصورة ويكتبون في جدول (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. السؤال 2 ص 41: يوجه المعلم: ثلاثة حيوانات تأكل النباتات فقط، وسلسلتان بهما مفترس وفريسة، والطلبة يكتبون: الزرافة تأكل أوراق الأشجار، الثور البري والحمار الوحشي العشب؛ ويرسمون السلاسل (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تحدّث عن: موت المفترسات: يطرح المعلم سؤال «تحدّث عن» ص 41، والطلبة يتنبؤون بالتسلسل: زيادة آكلات العشب، نقص العشب، مجاعة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا توجد مواطن طبيعية عديدة على الأرض؟\n   الإجابة النموذجية: بسبب تعدد المناخات مما يؤدي إلى وجود نباتات مختلفة.\n2. [مستوى التطبيق] ما مناخ الغابة الاستوائية؟\n   الإجابة النموذجية: حار رطب.\n3. [مستوى الاستدلال] لماذا تختلف حيوانات الصحراء عن حيوانات الغابة الاستوائية؟\n   الإجابة النموذجية: لأن النباتات المختلفة تجذب حيوانات مختلفة، والمناخ يحدد الكائنات القادرة على العيش.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما الكائنات المنتجة في السافانا؟\n   الإجابة النموذجية: العشب والأشجار.\n5. [مستوى التطبيق] ماذا تأكل الزرافة؟\n   الإجابة النموذجية: أوراق الأشجار.\n6. [مستوى الاستدلال] ارسم سلسلة غذائية تنتهي بالأسد.\n   الإجابة النموذجية: العشب ← الحمار الوحشي ← الأسد (أو أوراق الأشجار ← الزرافة ← الأسد).", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين طبيعيين مختلفين.\n   الإجابة النموذجية: مثل: الصحراء والمحيط (أو السافانا والغابة الاستوائية).\n2. [مستوى التطبيق] ما نوع الموطن الغالب في عُمان؟\n   الإجابة النموذجية: الصحراوي، مع مواطن جبلية وساحلية.\n3. [مستوى الاستدلال] توقع: أي الموطنين فيه تنوع نباتي أكبر، الغابة الاستوائية أم الصحراء؟ ولماذا؟\n   الإجابة النموذجية: الغابة الاستوائية؛ لوفرة الماء والحرارة المناسبة لنمو نباتات كثيرة.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] اذكر مفترسين من السافانا.\n   الإجابة النموذجية: الأسد والفهد (أو النمر والضبع).\n5. [مستوى التطبيق] ما الحيوانات التي تتغذى على الحيوانات الميتة؟\n   الإجابة النموذجية: النسور.\n6. [مستوى الاستدلال] ماذا سيحدث للعشب إذا ماتت فجأة كل المفترسات؟\n   الإجابة النموذجية: سيقل كثيرًا لأن أعداد آكلات العشب ستزداد وتأكله.", "للطالب: قراءة كتاب الطالب ص 40 وجمع صور لثلاثة مواطن مختلفة. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور للمواطن الطبيعية في عُمان.\nللطالب: رسم سلسلتين غذائيتين من السافانا في الدفتر ومراجعة ص 40–41. لولي الأمر: يُرجى مناقشة الابن في سبب وجود المفترسات الكبيرة في أقفاص بحدائق الحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 41 | دليل المعلم ص 54–55", "num": "الحصة الثالثة من 5", "focus": "السلاسل الغذائية في المحيط"}, "f": ["1. يوضح أن العوالق والطحالب هي المنتجات في المحيط (15 دقيقة)\n2. يرسم سلاسل غذائية بحرية بها مفترس واحد وأخرى بها مفترسان (15 دقيقة)\n\nمخرج تعليمي آخر: يقارن بين الكائنات المنتجة في السافانا والمحيط (10 دقائق)", "1. يوضح أن العوالق والطحالب هي المنتجات في المحيط. ← فهم\n2. يرسم سلاسل غذائية بحرية بها مفترس واحد وأخرى بها مفترسان. ← تطبيق\nالمخرج الآخر: يقارن بين الكائنات المنتجة في السافانا والمحيط. ← تحليل", "- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- المحيط\n- العوالق\n- الطحالب\n- السردين\n- النورس", "يسأل المعلم: يغطي الماء نحو ثلاثة أرباع سطح الأرض. ماذا تأكل الأسماك في وسط المحيط بعيدًا عن النباتات الكبيرة؟ (5 دقائق)", "1. العوالق: يشرح المعلم ص 41: العوالق كائنات صغيرة جدًا، منها نباتات منتجة وطحالب؛ ويعرض صورة مجهرية، والطلبة يكتبون: العوالق والطحالب منتجات المحيط (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. السؤال 3 ص 41: يوجه المعلم رسم سلسلتين بمفترس واحد وسلسلتين بمفترسين، والطلبة يرسمون: عوالق ← أسماك صغيرة ← نورس؛ عوالق ← سردين ← سمكة كبيرة ← إنسان (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. السؤال 1: المقارنة: يوجه المعلم مقارنة المنتجات في السافانا والمحيط في جدول، والطلبة يكملون الجدول: السافانا: عشب وأشجار؛ المحيط: عوالق وطحالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالعوالق؟\n   الإجابة النموذجية: كائنات حية صغيرة جدًا يصعب رؤيتها بالعين المجردة تعيش في الماء.\n2. [مستوى التطبيق] ما المنتج في السلسلة: عوالق ← سمكة صغيرة ← نورس؟\n   الإجابة النموذجية: العوالق.\n3. [مستوى الاستدلال] قارن بين المنتجات في السافانا والمحيط.\n   الإجابة النموذجية: في السافانا العشب والأشجار، وفي المحيط العوالق والطحالب.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ارسم سلسلة غذائية بحرية تنتهي بالإنسان.\n   الإجابة النموذجية: عوالق ← قشريات ← إنسان (أو عوالق ← سردين ← إنسان).\n2. [مستوى التطبيق] لماذا تُعد المواطن البحرية مهمة جدًا؟\n   الإجابة النموذجية: لأنها تغطي نحو ثلاثة أرباع سطح الأرض وتضم أنواعًا كثيرة من الكائنات.\n3. [مستوى الاستدلال] ماذا تتوقع أن يحدث للأسماك إذا قلّت العوالق بسبب التلوث؟\n   الإجابة النموذجية: تقل أعداد الأسماك الصغيرة ثم الأسماك الكبيرة والطيور التي تتغذى عليها.", "للطالب: كتابة سلسلتين غذائيتين بحريتين من بحر عُمان. لولي الأمر: يُرجى توعية الابن بعدم رمي المخلفات على الشواطئ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 41 | كتاب النشاط ص 29–30 | دليل المعلم ص 55", "num": "الحصة الرابعة من 5", "focus": "سلاسل غذائية في موطن الصحراء (تمرين 2-4)"}, "f": ["1. يحلل السلاسل الغذائية في موطن الصحراء ويرسمها (5 دقائق)\n2. يذكر مصادر الماء للنباتات في الصحراء (20 دقيقة)\n\nمخرج تعليمي آخر: يطبق مفهومي المفترس والفريسة على حيوانات الصحراء (15 دقيقة)", "1. يحلل السلاسل الغذائية في موطن الصحراء ويرسمها. ← تحليل\n2. يذكر مصادر الماء للنباتات في الصحراء. ← تذكر\nالمخرج الآخر: يطبق مفهومي المفترس والفريسة على حيوانات الصحراء. ← تطبيق", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-4 في كتاب النشاط", "- الصحراء\n- الضباب الموسمي\n- قطرات الندى\n- القط الرملي\n- الصقر", "يسأل المعلم: كيف تحصل نباتات الصحراء على الماء والأمطار قليلة؟ ويعرض صورة لضباب ظفار الموسمي. (5 دقائق)", "1. تمرين 2-4 (ص 29–30): يوجه المعلم الحل: المنتجات (أعشاب ونباتات صحراوية)، مصادر الماء، آكلات النبات، المفترسات وفرائسها، والطلبة يحلون فرديًا: القط الرملي يأكل الفأر، السحلية تأكل العنكبوت، الصقر يأكل السحلية (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رسم سلسلة صحراوية: يطلب المعلم سلسلة من أربع حلقات، والطلبة يرسمون: نباتات صحراوية ← خنفساء ← فأر ← بومة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التصحيح بالأقران: يعرض المعلم الإجابات النموذجية، والطلبة يتبادلون الكتب ويصححون (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقا نتج\n- المفترس الأعلى", "يعرض المعلم «بطاقات المواطن» (سافانا، محيط، صحراء، غابة استوائية) مقلوبة، وتسحب كل مجموعة بطاقة تحدد موطن مشروعها. (5 دقائق)", "1. تصميم اللوحة: يتابع المجموعات: صورة الموطن، مناخه، سلسلة من 3–4 حلقات، تحديد المنتج والفريسة والمفترس، والطلبة يصممون اللوحة ويوزعون المهام (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. العرض والمقارنة: يدير المعلم عرضًا سريعًا (دقيقتان لكل مجموعة) ويكتب جدول مقارنة على السبورة، والطلبة يعرضون ويكملون جدول المقارنة (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تقييم الأقران: يوزع المعلم بطاقة تقييم بسيطة (الدقة، الوضوح، التنظيم)، والطلبة يقيّمون لوحات زملائهم (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – سلاسل من مواطن عمان: تكون كل مجموعة سلسلة غذائية لموطن عماني مختلف: البحر، الصحراء، الجبل، وتقارن بين السلاسل في عرض سريع (5 دقائق)\nالاستراتيجيات: المحطات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المنتج في موطن مجموعتك؟\n   الإجابة النموذجية: تعتمد على الموطن: عشب/أشجار، عوالق، نباتات صحراوية...\n2. [مستوى التطبيق] ما وجه الشبه بين جميع السلاسل المعروضة؟\n   الإجابة النموذجية: كلها تبدأ بكائن منتج.\n3. [مستوى الاستدلال] ما وجه الاختلاف الرئيسي بين سلاسل المحيط والسافانا؟\n   الإجابة النموذجية: نوع المنتجات والحيوانات المختلف تبعًا لاختلاف الموطن.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين ومنتجًا في كل منهما.\n   الإجابة النموذجية: السافانا: العشب؛ المحيط: العوالق (أو الصحراء: النباتات الصحراوية).\n2. [مستوى التطبيق] لماذا تختلف السلاسل الغذائية من موطن لآخر؟\n   الإجابة النموذجية: لأن المواطن المختلفة تضم نباتات وحيوانات مختلفة.\n3. [مستوى الاستدلال] اقترح تحسينًا للوحة إحدى المجموعات مع التعليل.\n   الإجابة النموذجية: تقبل المقترحات المعللة مثل إضافة سهم صحيح أو مفترس أعلى أو عنوان.", "للطالب: مراجعة كتاب الطالب ص 40–41 والاستعداد لدرس إزالة الغابات. لولي الأمر: يُرجى مساعدة الابن على جمع معلومات عن غابات العالم وأهم
