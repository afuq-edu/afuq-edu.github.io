4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تمرين 3-3 في كتاب النشاط: يوجه المعلم حل التمرين (ص 39)، والطلبة يحلون فرديًا ويتحققون مع زميل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة الكلمات: يقرأ المعلم تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج، والطلبة يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – سكر في القهوة: تصنف الأزواج مواد من الضيافة العمانية إلى ذائبة كالسكر والزعفران وغير ذائبة كالبن المطحون، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "للطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}], "comb": ["الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة (10 دقائق)\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول (5 دقائق)\n3. ينفذ استقصاءً لمعرفة و\n- الاختبار العادل\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n- المحلول\n- المخلوط المعلّق\n- الطفو\n- الاستقرار في القاع\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n- المادة الذائبة\n- التغير الفيزيائي\n- شفاف\n- ضبابي\n- مُعلّق", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nيضيف المعلم ماءً ساخنًا إلى ملعقة من حبيبات القهوة أمام الطلبة ويسأل: أين ذهبت الحبيبات؟ هل اختفت؟ (5 دقائق)\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nيعيد المعلم عرض كؤوس الاستقصاء بعد تركها، ويسأل: ماذا تغير في كأس الدقيق وكأس الرمل؟ (5 دقائق)\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nيرفع المعلم كأس فلفل مطحون في الماء ويسأل: هل ذاب الفلفل؟ لماذا بقي على السطح؟ (5 دقائق)\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nيذيب المعلم ملعقة سكر في كوب ماء نظيف ويسأل: السكر اختفى، فهل ما زال موجودًا؟ كيف نتأكد؟ (يتذوق المعلم أو متطوع بأمان لأن السكر غذاء). (5 دقائق)", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان — زمن الحصة 40 دقيقة\n1. مفهوم الذوبان: يشرح المعلم ص 58: السكر يذوب فهو قابل للذوبان، والرمل لا يذوب فهو غير قابل؛ والجزيئات الصغيرة تنتشر في الماء، والطلبة يكتبون التعريفين ويرسمون جزيئات تنتشر (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. عصف ذهني: ماذا يذوب؟: يطلب المعلم اقتراح مواد تذوب وأخرى لا تذوب ويدونها على السبورة، والطلبة يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. جدول التنبؤات: يرسم المعلم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم، والطلبة يملؤون عمود التنبؤ استعدادًا للاستقصاء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. السلامة: ينبه المعلم: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس، والطلبة يكررون قواعد السلامة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3-3: التنفيذ: يوجه المعلم وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها، والطلبة ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. التسجيل والاستنتاج: يوجه المعلم إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ، والطلبة يكملون الجدول ويحددون صحة تنبؤاتهم (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام والتقويم: يطرح المعلم التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة، والطلبة يجيبون فرديًا (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟ — زمن الحصة 40 دقيقة\n1. الأسئلة 1–4 ص 59: يوجه المعلم: ماذا حدث في المخلوط الضبابي والشفاف؟ ولماذا بعد خمس دقائق؟ ولماذا الكميات المتساوية؟ والطلبة يجيبون كتابيًا ثم يتشاركون (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. المخلوط المعلّق: يشرح المعلم: المواد غير الذائبة تبقى مرئية، وبعضها يستقر في القاع وبعضها يطفو؛ ويقارن بالمحلول، والطلبة يكملون جدول مقارنة: المحلول – المعلّق (الشفافية، الرؤية، الترسب) (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تحدّث عن: قطع السكر: يناقش المعلم لماذا تذوب قطع السكر أبطأ من الحبيبات، والطلبة يستنتجون أن الحبيبات الخارجية تذوب أولًا (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3) — زمن الحصة 40 دقيقة\n1. ورقة العمل 3-3: الملاحظة والرسم: يجهز المعلم المخاليط الخمسة (ملعقة صغيرة في 100 mL ماء) ويخبر بمكوناتها، والطلبة يحركون كل مخلوط ويلاحظونه ويرسمونه ويصفونه في الورقة (ص 75) (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التصنيف وجدول الدعم: يوجه المعلم التصنيف ويقدم جدولًا للمتعثرين: هل تذوب؟ كيف يبدو؟ هل ترى المادة؟ هل تستقر أم تطفو؟ والطلبة يصنفون: الملح والشراب محلولان؛ الفلفل والتلك يطفوان؛ الطباشير يستقر (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. مراجعة جماعية: يعرض المعلم الإجابات ويصحح، والطلبة يصححون أعمالهم (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3) — زمن الحصة 40 دقيقة\n1. الذوبان تغير فيزيائي: يشرح المعلم أن جزيئات السكر لم تتغير ولم تتفاعل مع الماء، ويمكن استعادتها بالتبخير، والطلبة يكتبون جملة: الذوبان تغير فيزيائي قابل للعكس (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تمرين 3-3 في كتاب النشاط: يوجه المعلم حل التمرين (ص 39)، والطلبة يحلون فرديًا ويتحققون مع زميل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة الكلمات: يقرأ المعلم تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج، والطلبة يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – سكر في القهوة: تصنف الأزواج مواد من الضيافة العمانية إلى ذائبة كالسكر والزعفران وغير ذائبة كالبن المطحون، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n5. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n6. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث للرمل بعد ترك المخلوط خمس دقائق؟\n   الإجابة النموذجية: استقر في قاع الكأس.\n2. [مستوى التطبيق] ما المخلوط المعلّق؟\n   الإجابة النموذجية: مخلوط من مادة صلبة غير قابلة للذوبان في سائل تبقى فيه مرئية.\n3. [مستوى الاستدلال] لماذا يجب استخدام الكمية نفسها من الماء والمادة الصلبة في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة صحيحة بين المواد.\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n5. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n6. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] هل يمكنك رؤية المادة الصلبة في المحلول؟\n   الإجابة النموذجية: لا؛ لأنها ذابت تمامًا.\n2. [مستوى التطبيق] اذكر مادة تطفو على سطح الماء دون أن تذوب.\n   الإجابة النموذجية: الفلفل المطحون أو بودرة التلك.\n3. [مستوى الاستدلال] لماذا تذوب قطعة السكر أبطأ من الحبيبات؟\n   الإجابة النموذجية: لأن الحبيبات الداخلية لا تتصل بالماء حتى تذوب الخارجية أولًا.\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nللطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\nللطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nللطالب: كتابة جدول المقارنة بين المحلول والمخلوط المعلّق في الدفتر. لولي الأمر: يُرجى ملاحظة عصير البرتقال الطازج مع الابن بعد تركه قليلًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nللطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nللطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"id": "3-4", "title": "فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60–61 | كتاب النشاط ص 40 | دليل المعلم ص 80–82", "n": 2, "per": [{"h": {"lesson": "3-4 فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60 | دليل المعلم ص 80–82", "num": "الحصة الأولى من 2", "focus": "ما الترشيح؟ المرشحات في الحياة والطبيعة"}, "f": ["1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل (5 دقائق)\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة (15 دقيقة)\nمخرج تعليمي آخر: يناقش هل الماء المرشّح بالرمل صالح للشرب (20 دقيقة)", "1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل. ← تذكر\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة. ← فهم\nالمخرج الآخر: يناقش هل الماء المرشّح بالرمل صالح للشرب. ← تقييم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: كمامة، ورقة ترشيح القهوة، نموذج مرشح رملي: حصى ورمل خشن ورمل ناعم", "- الترشيح\n- المرشح\n- ورقة الترشيح\n- المرشح الرملي\n- الأراضي الرطبة", "يعرض المعلم كمامة طبية ويسأل: لماذا يرتدي الطبيب الكمامة؟ ماذا تحجز؟ وماذا تسمح بمروره؟ (5 دقائق)", "1. المرشح مثل الغربال: يشرح المعلم ص 60: ثقوب دقيقة تسمح بم : ما الترشيح؟ المرشحات في الحياة والطبيعة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: كمامة، ورقة ترشيح القهوة، نموذج مرشح رملي: حصى ورمل خشن ورمل ناعم\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n- الكتاب\n- أخرى: ورق ترشيح، قمع، كؤوس، مخبار مدرج، طباشير مسحوق، دقيق، ملح، ماء، أكياس شاي", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\n- الترشيح\n- المرشح\n- ورقة الترشيح\n- المرشح الرملي\n- الأراضي الرطبة\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n- ورقة الترشيح\n- قمع الترشيح\n- الراشح\n- المواد الذائبة\n- التبخير", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nيعرض المعلم كمامة طبية ويسأل: لماذا يرتدي الطبيب الكمامة؟ ماذا تحجز؟ وماذا تسمح بمروره؟ (5 دقائق)\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nيرفع المعلم كيس شاي ويسأل (تحدّث عن): كيف يترك كيس الشاي لونه ونكهته في الماء بينما يحتجز أوراقه؟ (5 دقائق)", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة — زمن الحصة 40 دقيقة\n\n1. المرشح مثل الغربال: يشرح المعلم ص 60: ثقوب دقيقة تسمح بمرور السائل والجزيئات الصغيرة جدًا وتمنع الكبيرة؛ مثال القهوة، والطلبة يرسمون ورقة ترشيح بثقوب ويوضحون ما يمر وما يُحجز (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. المرشح الرملي: يعرض المعلم نموذجًا: الحصى يحجز الكبيرة، الرمل الخشن الأصغر، الرمل الناعم الدقيقة؛ ويذكر الأراضي الرطبة والفلامنجو، والطلبة يلاحظون الماء العكر يصبح أصفى (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. هل هو صالح للشرب؟: يناقش المعلم: الرمل لا يحجز الجراثيم، لذا يُغلى الماء أو يُعقم، والطلبة يكتبون خطوتين لجعل الماء آمنًا للشرب (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4) — زمن الحصة 40 دقيقة\n\n1. طي ورقة الترشيح: يعرض المعلم خطوات الطي: نصفان ثم نصفان، فتح المخروط، ترطيب الورقة ووضعها في القمع، والطلبة يطوون الورقة ويجهزون القمع (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. نشاط 3-4: الترشيح: يوجه المعلم خلط ملعقة صغيرة من الطباشير في 100 mL ماء وترشيحه، ثم الدقيق، والطلبة يرشحون ويلاحظون: يمر الماء صافيًا ويبقى الطباشير على الورقة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. الأسئلة 1–4 ص 61 وتمرين 3-4: يناقش المعلم: ماذا مر؟ ماذا بقي؟ هل يفصل الترشيح الملح عن الماء؟ ويوجه تمرين 3-4 (ص 40) عن تنقية الماء، والطلبة يجيبون ويستنتجون أن المواد الذائبة تمر عبر الورقة وتحتاج للتبخير (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مصفاة القهوة: تشرح المجموعات كيف يفصل المصفى البن عن القهوة العمانية بالترشيح، وتقارنه بفصل الرمل عن الماء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الترشيح؟\n   الإجابة النموذجية: طريقة لفصل المخاليط المكونة من مادة صلبة غير قابلة للذوبان ومادة سائلة.\n2. [مستوى التطبيق] ماذا تحجز ورقة الترشيح في وعاء القهوة؟\n   الإجابة النموذجية: حبيبات القهوة الصلبة.\n3. [مستوى الاستدلال] لماذا لا يكون الماء المرشّح بالرمل آمنًا للشرب دائمًا؟\n   الإجابة النموذجية: لأن الرمل لا يستطيع حجز الجراثيم الصغيرة جدًا.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الذي مر عبر ورقة الترشيح إلى الكأس؟\n   الإجابة النموذجية: الماء.\n2. [مستوى التطبيق] لماذا بقي الطباشير على ورقة الترشيح؟\n   الإجابة النموذجية: لأن جزيئاته أكبر من ثقوب الورقة ولا يذوب في الماء.\n3. [مستوى الاستدلال] تنبأ: هل يمكن فصل الملح عن الماء بالترشيح؟ علّل.\n   الإجابة النموذجية: لا؛ لأن الملح ذائب وجزيئاته صغيرة جدًا تمر عبر ثقوب الورقة.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الذي يمر عبر ثقوب المرشح؟\n   الإجابة النموذجية: السائل والمواد الذائبة فيه والجزيئات الصغيرة جدًا.\n2. [مستوى التطبيق] كيف يُرشح طائر الفلامنجو طعامه؟\n   الإجابة النموذجية: بمرشحات في منقاره تلتقط الطحالب والأسماك الصغيرة من الماء.\n3. [مستوى الاستدلال] كيف نجعل الماء آمنًا للشرب بعد ترشيحه؟\n   الإجابة النموذجية: بغليه أو معالجته بمادة معقمة.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نرطب ورقة الترشيح قبل وضعها في القمع؟\n   الإجابة النموذجية: لتلتصق بالقمع وتُسرّع عملية الترشيح.\n2. [مستوى التطبيق] ما الطريقة المناسبة لفصل الملح الذائب عن الماء؟\n   الإجابة النموذجية: التبخير.\n3. [مستوى الاستدلال] صف خطوات فصل مخلوط من الرمل والملح والماء.\n   الإجابة النموذجية: نرشح المخلوط ليبقى الرمل على الورقة، ثم نبخر الراشح فيبقى الملح.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nللطالب: قراءة كتاب الطالب ص 60 والبحث عن مرشح في المنزل (مصفاة الشاي، فلتر الماء). لولي الأمر: يُرجى مناقشة الابن في طرق تنقية ماء الشرب في المنزل.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nللطالب: حل تمرين 3-4 في كتاب النشاط ص 40 واجبًا منزليًا ومراجعة ص 60–61. لولي الأمر: يُرجى مساعدة الابن في تجربة ترشيح ماء مع تراب بمنديل ورقي في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=22"]}, {"id": "3-5", "title": "المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62–63 | كتاب النشاط ص 41، 76–78 | دليل المعلم ص 82–86", "n": 2, "per": [{"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62 | دليل المعلم ص 82–84", "num": "الحصة الأولى من 3", "focus": "المحلول: المادة المذابة والمادة المذيبة"}, "f": ["1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة (10 دقائق)\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا (10 دقائق)\n3. يميز بين المخلوط والمادة النقية بأمثلة (5 دقائق)\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات (5 دقائق)\n\nمخرج تعليمي آخر:\nيمثل تكوّن المحلول بنموذج الجزيئات (5 دقائق)\nيحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل (5 دقائق)", "1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة. ← فهم\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا. ← تطبيق\n3. يميز بين المخلوط والمادة النقية بأمثلة. ← فهم\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات. ← تحليل\nالمخرج الآخر: يمثل تكوّن المحلول بنموذج الجزيئات. ← تطبيق\nالمخرج الآخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل. ← تقييم", "- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف، ورقة العمل 3-5أ، عصير برتقال طازج", "- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات\n- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء", "يعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟ (5 دقائق)", "1. المذاب والمذيب: يشرح المعلم ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب، والطلبة يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3-5: تحضير محلول: يوجه المعلم وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق، والطلبة يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المحلول المتجانس: يقدم المعلم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه، والطلبة يصفون محلولهم باستخدام المصطلح (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. المواد النقية والمخاليط: يشرح المعلم ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط، والطلبة يصنفون أمثلة في جدول (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. الأسئلة 1–5 ص 63: خطة استقصاء: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟ والطلبة يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n6. ورقة العمل 3-5أ وتحدّث عن: يوجه المعلم بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال، والطلبة يجيبون ويستنتجون أن العصير مخلوط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n5. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n6. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n5. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n6. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.", "للطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\nللطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62–63 | كتاب النشاط ص 41، 78 | دليل المعلم ص 84–86", "num": "الحصة الثالثة من 3", "focus": "كم من السكر يذوب في الشاي؟ المحلول المشبع"}, "f": ["1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي (10 دقائق)\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي (15 دقيقة)\n\nمخرج تعليمي آخر: يعرّف المحلول المشبع (15 دقيقة)", "1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "يسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟ (5 دقائق)", "1. السلامة: ينبه: المعلم وحده يصب الماء الساخن، والطلبة يكررون القاعدة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ورقة العمل 3-5ب: الاستقصاء: يصب المعلم 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب، والطلبة يعدّون الملاعق ويزنون السكر ويسجلون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المحلول المشبع والتنبؤ: يعرّف المعلم المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب، والطلبة يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. غلق الدرس – محلول ماء الورد: تحدد المجموعات المادة المذابة والمذيبة في محلول من مكونات الضيافة العمانية كالماء والسكر وماء الورد، وتصف خطوات تحضيره (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "للطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}], "comb": ["الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة (10 دقائق)\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا (10 دقائق)\n3. يميز بين المخلوط والمادة النقية بأمثلة (5 دقائق)\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات (5 دقائق)\n\nمخرج تعليمي آخر:\nيمثل تكوّن المحلول بنموذج الجزيئات (5 دقائق)\nيحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل (5 دقائق)\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي (10 دقائق)\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي (15 دقيقة)\n\nمخرج تعليمي آخر: يعرّف المحلول المشبع (15 دقيقة)", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة. ← فهم\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا. ← تطبيق\n3. يميز بين المخلوط والمادة النقية بأمثلة. ← فهم\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات. ← تحليل\nالمخرج الآخر: يمثل تكوّن المحلول بنموذج الجزيئات. ← تطبيق\nالمخرج الآخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل. ← تقييم\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف، ورقة العمل 3-5أ، عصير برتقال طازج\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات\n- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nيعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟ (5 دقائق)\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\nيسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟ (5 دقائق)", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة — زمن الحصة 40 دقيقة\n1. المذاب والمذيب: يشرح المعلم ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب، والطلبة يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 3-5: تحضير محلول: يوجه المعلم وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق، والطلبة يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المحلول المتجانس: يقدم المعلم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه، والطلبة يصفون محلولهم باستخدام المصطلح (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. المواد النقية والمخاليط: يشرح المعلم ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط، والطلبة يصنفون أمثلة في جدول (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. الأسئلة 1–5 ص 63: خطة استقصاء: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟ والطلبة يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n6. ورقة العمل 3-5أ وتحدّث عن: يوجه المعلم بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال، والطلبة يجيبون ويستنتجون أن العصير مخلوط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع — زمن الحصة 40 دقيقة\n1. السلامة: ينبه: المعلم وحده يصب الماء الساخن، والطلبة يكررون القاعدة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ورقة العمل 3-5ب: الاستقصاء: يصب المعلم 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب، والطلبة يعدّون الملاعق ويزنون السكر ويسجلون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. المحلول المشبع والتنبؤ: يعرّف المعلم المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب، والطلبة يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. غلق الدرس – محلول ماء الورد: تحدد المجموعات المادة المذابة والمذيبة في محلول من مكونات الضيافة العمانية كالماء والسكر وماء الورد، وتصف خطوات تحضيره (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n5. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n6. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n5. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n6. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nللطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\nللطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\nللطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"id": "3-6", "title": "كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 86–90", "n": 2, "per": [{"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64 | دليل المعلم ص 86–88", "num": "الحصة الأولى من 3", "focus": "التحريك يزيد سرعة الذوبان"}, "f": ["1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع (10 دقائق)\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع (5 دقائق)\n3. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل (10 دقائق)\n4. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات (5 دقائق)\n\nمخرج تعليمي آخر:\nيحدد ما إذا كان اختبار التحريك اختبارًا عادلًا (5 دقائق)\nيستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة (5 دقائق)", "1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\n3. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n4. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم", "- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة، سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف\n- السبورة التقليدية", "- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات\n- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج", "يعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟ (5 دقائق)", "1. تجربة عرض: كأسان: يصب المعلم الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط، والطلبة يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التفسير بالجزيئات: يشرح المعلم ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع، والطلبة يرسمون نموذجين: دون تحريك ومع تحريك (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. هل كان الاختبار عادلًا؟: يسأل المعلم عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة، والطلبة يكتبون الثوابت ويستنتجون (3 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. السلامة والأدوات: يؤكد المعلم استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم، والطلبة يتعرفون على قراءة مقياس الحرارة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3-6: يوجه المعلم وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ، والطلبة يقيسون الزمن ويسجلون في جدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الأسئلة 1–3 ص 65: يناقش المعلم: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات، والطلبة يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n5. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n6. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n5. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n6. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.", "للطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\nللطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 88–89", "num": "الحصة الثالثة من 3", "focus": "تفسير الرسوم البيانية للذوبان والعوامل المؤثرة"}, "f": ["1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة (15 دقيقة)\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج (10 دقائق)\n\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب (15 دقيقة)", "1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "يعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟ (5 دقائق)", "1. أوراق العمل حسب المستوى: يوزع المعلم 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم، والطلبة يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\ 3. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل (10 دقائق)\n4. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات (5 دقائق)\n\nمخرج تعليمي آخر:\nيحدد ما إذا كان اختبار التحريك اختبارًا عادلًا (5 دقائق)\nيستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة (5 دقائق)\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة (15 دقيقة)\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج (10 دقائق)\n\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب (15 دقيقة)", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\n3. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n4. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "الحصة 1: التحريك يزيد سرعة الذوبان\n- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الاستقصاء العلمي\n- التعلم التعاوني\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "الحصة 1: التحريك يزيد سرعة الذوبان\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة، سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف\n- السبورة التقليدية\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "الحصة 1: التحريك يزيد سرعة الذوبان\n- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات\n- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "الحصة 1: التحريك يزيد سرعة الذوبان\nيعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟ (5 دقائق)\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nيعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟ (5 دقائق)", "الحصة 1: التحريك يزيد سرعة الذوبان — زمن الحصة 40 دقيقة\n1. تجربة عرض: كأسان: يصب المعلم الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط، والطلبة يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التفسير بالجزيئات: يشرح المعلم ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع، والطلبة يرسمون نموذجين: دون تحريك ومع تحريك (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. هل كان الاختبار عادلًا؟: يسأل المعلم عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة، والطلبة يكتبون الثوابت ويستنتجون (3 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. السلامة والأدوات: يؤكد المعلم استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم، والطلبة يتعرفون على قراءة مقياس الحرارة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3-6: يوجه المعلم وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ، والطلبة يقيسون الزمن ويسجلون في جدول (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. الأسئلة 1–3 ص 65: يناقش المعلم: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات، والطلبة يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة — زمن الحصة 40 دقيقة\n1. أوراق العمل حسب المستوى: يوزع المعلم 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم، والطلبة يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 3-6: يوجه المعلم تمرين 3-6 (ص 42) عن العوامل والاختبار العادل لدعم المتعثرين، والطلبة يحلون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تصحيح مفهوم: يوضح المعلم الفرق بين سرعة الذوبان وكمية المادة الذائبة، ويلخص العاملين: التحريك ودرجة الحرارة، والطلبة يكملون خريطة: عوامل تسرّع الذوبان (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – تحريك الحلوى: تفسر الأزواج لماذا يحرك صانع الحلوى العمانية الخليط باستمرار، وتربطه بأثر التحريك في سرعة الذوبان (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: التحريك يزيد سرعة الذوبان\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n5. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n6. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] من التمثيل البياني: عند أي درجة حرارة استغرق السكر أقصر زمن؟\n   الإجابة النموذجية: عند أعلى درجة حرارة في التمثيل.\n2. [مستوى التطبيق] صف النمط: كلما زادت درجة الحرارة...\n   الإجابة النموذجية: قل زمن الذوبان (أي ذاب السكر أسرع).\n3. [مستوى الاستدلال] ما الفرق بين «يذوب أسرع» و«يذوب أكثر»؟\n   الإجابة النموذجية: الأول يتعلق بسرعة ذوبان الكمية نفسها، والثاني بكمية المادة التي يمكن أن تذوب.", "الحصة 1: التحريك يزيد سرعة الذوبان\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n5. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n6. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر عاملين يجعلان المادة تذوب أسرع.\n   الإجابة النموذجية: التحريك ورفع درجة الحرارة.\n2. [مستوى التطبيق] لماذا يُفضل التمثيل الخطي عند قياس الزمن عند عدة درجات حرارة؟\n   الإجابة النموذجية: لأنه يوضح التغير المستمر ويسمح بقراءة قيم بين القياسات.\n3. [مستوى الاستدلال] لماذا لا تُغسل الملابس عادة بدرجات حرارة عالية جدًا؟\n   الإجابة النموذجية: لأن الحرارة المرتفعة قد تتلف الأقمشة أو تسبب تقلصها.", "الحصة 1: التحريك يزيد سرعة الذوبان\nللطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\nللطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nللطالب: إكمال ورقة العمل 3-6ج (كتاب النشاط ص 82–83) واجبًا منزليًا وحل تمرين 3-6 (ص 42). لولي الأمر: يُرجى مساعدة الابن في رسم التمثيل البياني بالمسطرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"id": "3-7", "title": "كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66–67 | كتاب النشاط ص 43، 84–85 | دليل المعلم ص 90–92", "n": 2, "per": [{"h": {"lesson": "3-7 كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66 | دليل المعلم ص 90–91", "num": "الحصة الأولى من 2", "focus": "حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء"}, "f": ["1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية (15 دقيقة)\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان (10 دقائق)\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة (15 دقيقة)", "1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية. ← فهم\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان. ← تطبيق\nالمخرج الآخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة. ← تحليل", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورق A4، مقص، مسطرة، قطعة سكر وحبيبات سكر ومسحوق سكر", "- حجم الحبيبات\n- مساحة السطح\n- التخطيط\n- العامل المتغير\n- العوامل الثابتة", "يعرض المعلم قطعة سكر وملعقة حبيبات سكر ومسحوق سكر، ويسأل: أيها تتوقع أن يذوب أولًا في الماء؟ ولماذا؟ (5 دقائق)", "1. نشاط الحواف (مساحة السطح): يوجه المعلم قياس محيط ورقة A4، ثم قصها إلى أربع قطع وجمع محيطاتها، ثم القص مجددًا، والطلبة يقيسون ويقارنون ويستنتجون: كلما صغرت القطع زاد طول الحواف الكلي (8 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. الربط بالذوبان: يشرح المعلم ص 67: الحب let mode='sep',li=0,pi=0;
const $=id=>document.getElementById(id);

D.forEach((L,i)=>{if(L.unit!==lastUnit){grp=document.createElement('optgroup');grp.label=L.unit;sel.appendChild(grp);lastUnit=L.unit;}
 const o=document.createElement('option');o.value=i;o.textContent=`${L.id} ${L.title} (${L.n} حصص)`;grp.appendChild(o);});
sel.onchange=()=>{li=+sel.value;pi=0;render();};

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){

function selectPre(card){const pre=card.querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=window.getSelection();s.removeAllRanges();s.addRange(r);card.querySelector('.hint').classList.add('on');}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok');},1800);}
function legacy(t){try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}}
function copyText(t,btn,card){
  card.querySelector('.hint').classList.remove('on');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(btn)).catch(()=>{legacy(t)?done(btn):selectPre(card);});}
  else{legacy(t)?done(btn):selectPre(card);}
}
render();
</script>
