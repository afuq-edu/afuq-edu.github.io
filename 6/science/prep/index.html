 2-9)\n1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان. ← تطبيق\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات. ← تحليل\nالمخرج الآخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة. ← إبداع", "الحصة 1: الحفاظ على الماء والطاقة\n- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "الحصة 1: الحفاظ على الماء والطاقة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: تمرين 2-9 في كتاب النشاط\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أكياس قمامة كبيرة، قفازات مطاطية، كمامات، دفتر ملاحظات", "الحصة 1: الحفاظ على الماء والطاقة\n- الماء العذب\n- ترشيد الاستهلاك\n- الطاقة\n- المصابيح الموفرة\n- الطاقة الشمسية\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- فرز القمامة\n- جدول الإحصاء\n- التمثيل بالأعمدة\n- الحملة التوعوية", "الحصة 1: الحفاظ على الماء والطاقة\nيعرض المعلم صنبورًا يقطر (أو مقطعًا) ويسأل: كم لترًا يضيع من صنبور يقطر طوال اليوم؟ هل يهمنا ذلك في بلد قليل الأمطار؟\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nيسأل المعلم: ما أكثر أنواع القمامة التي تتوقع أن تجدها في فناء المدرسة؟ ويسجل التنبؤات على السبورة.", "الحصة 1: الحفاظ على الماء والطاقة\n1) التهيئة: الصنبور المتسرب (5 دقائق: 0–5)\n   المعلم: يعرض الموقف ويطرح الأسئلة.\n   الطالب: يقدرون ويناقشون.\n2) الحفاظ على الماء (10 دقائق: 5–15)\n   المعلم: يناقش ص 50: الاستحمام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد.\n   الطالب: يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان.\n3) الحفاظ على الطاقة (10 دقائق: 15–25)\n   المعلم: يناقش: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية.\n   الطالب: يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف.\n4) تمرين 2-9: سجلي الأسبوعي (10 دقائق: 25–35)\n   المعلم: يوجه تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع.\n   الطالب: يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1) التهيئة والتنبؤ والسلامة (4 دقائق: 0–4)\n   المعلم: يسجل التنبؤات ويؤكد السلامة: قفازات وكمامات، الحذر من الزجاج المكسور وعدم لمس الإبر.\n   الطالب: يتنبؤون ويرتدون أدوات الوقاية.\n2) نشاط 2-9: الجمع والتسجيل (14 دقائق: 4–18)\n   المعلم: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل.\n   الطالب: يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام.\n3) التمثيل والمقارنة (10 دقائق: 18–28)\n   المعلم: يوجه جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2).\n   الطالب: يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا.\n4) تخطيط الحملة (السؤال 3) (7 دقائق: 28–35)\n   المعلم: يناقش «تحدّث عن» ص 51 ويطلب خطة حملة.\n   الطالب: يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-9).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: الحفاظ على الماء والطاقة\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1. [مستوى المعرفة] ما أكثر أنواع القمامة التي جمعتها مجموعتك؟\n   الإجابة النموذجية: غالبًا البلاستيك أو الورق (تعتمد على النتائج).\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستدلال بعدد العلامات.\n3. [مستوى الاستدلال] لماذا يُعد البلاستيك من أخطر أنواع القمامة؟\n   الإجابة النموذجية: لأنه لا يتحلل بسهولة ويبقى طويلًا وقد تختنق به الحيوانات.", "الحصة 1: الحفاظ على الماء والطاقة\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1. [مستوى المعرفة] لماذا نرتدي القفازات والكمامات عند جمع القمامة؟\n   الإجابة النموذجية: لحماية أنفسنا من الجراثيم والأدوات الحادة.\n2. [مستوى التطبيق] ما فائدة تمثيل نتائج الفرز بالأعمدة؟\n   الإجابة النموذجية: لمقارنة أنواع القمامة بسهولة ومعرفة النوع الأكثر شيوعًا.\n3. [مستوى الاستدلال] اقترح فكرتين لحملة منع رمي القمامة في مدرستك.\n   الإجابة النموذجية: وضع صناديق قرب المقصف، ملصقات توعوية، مسابقة الفصل الأنظف (تقبل الأفكار المنطقية).", "الحصة 1: الحفاظ على الماء والطاقة\nللطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nللطالب: إعداد ملصق للحملة التوعوية لوضعه في المدرسة، ومراجعة الوحدة الثانية. لولي الأمر: يُرجى تشجيع الابن على عدم رمي المخلفات في الأماكن العامة والقدوة في ذلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"id": "2-10", "title": "تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | كتاب النشاط ص 36 | دليل المعلم ص 64", "n": 3, "per": [{"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | دليل المعلم ص 64", "num": "الحصة الأولى خر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.", "للطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 53 | دليل المعلم ص 64", "num": "الحصة الثانية من 3", "focus": "مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة"}, "f": ["1. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح.\n2. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع.\nمخرج تعليمي آخر: يقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة.", "1. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح. ← تطبيق\n2. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع. ← فهم\nالمخرج الآخر: يقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة. ← تطبيق", "- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- ترتيب السلسلة\n- إزالة الغابات\n- الأمطار الحمضية\n- إعادة التدوير", "يكتب المعلم سلسلة مقلوبة: «صقر ← سحلية ← خنفساء ← بذور» ويسأل: ما الخطأ هنا؟", "1) التهيئة: سلسلة مقلوبة (5 دقائق: 0–5)\n   المعلم: يعرض السلسلة الخاطئة.\n   الطالب: يصححون الاتجاه ويبدؤون بالمنتج.\n2) السؤال 4: الترتيب الصحيح (10 دقائق: 5–15)\n   المعلم: يوجه ترتيب السلاسل الأربع ص 53.\n   الطالب: يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس...\n3) السؤال 5 و6 (10 دقائق: 15–25)\n   المعلم: يوجه اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع.\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n4) الس در الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته.\n4) السؤال 3: ماذا لو؟ (10 دقائق: 25–35)\n   المعلم: يدير نقاش: اختفاء الحشرات، توقف الشمس عن السطوع.\n   الطالب: يتنبؤون بالآثار ويكتبونها.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\n1) التهيئة: سلسلة مقلوبة (5 دقائق: 0–5)\n   المعلم: يعرض السلسلة الخاطئة.\n   الطالب: يصححون الاتجاه ويبدؤون بالمنتج.\n2) السؤال 4: الترتيب الصحيح (10 دقائق: 5–15)\n   المعلم: يوجه ترتيب السلاسل الأربع ص 53.\n   الطالب: يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس...\n3) السؤال 5 و6 (10 دقائق: 15–25)\n   المعلم: يوجه اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع.\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n4) السؤال 7: أعد التدوير (10 دقائق: 25–35)\n   المعلم: يعرض صور الأشياء في السؤال 7.\n   الطالب: يقترحون طرق إعادة الاستخدام والتدوير لكل منها.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n1) التهيئة: كلمة مرتبطة (5 دقائق: 0–5)\n   المعلم: يدير إضافة الكلمات حول العنوان.\n   الطالب: يضيفون مصطلحات الوحدة.\n2) المراجعة اللغوية (10 دقائق: 5–15)\n   المعلم: يوجه حل المراجعة اللغوية (كتاب النشاط ص 36) ويصحح جماعيًا.\n   الطالب: يكملون الجمل ويصححون.\n3) الخريطة المفاهيمية (13 دقائق: 15–28)\n   المعلم: يقسم الوحدة إلى فروع: السلاسل الغذائية، المواطن، آثار الإنسان، الاعتناء بالبيئة.\n   الطالب: ترسم كل مجموعة فرعًا ثم تُجمع الفروع في خريطة واحدة.\n4) سؤال من صنعي (6 دقائق: 28–34)\n   المعلم: يطلب من كل طالب كتابة سؤال وإجابته.\n   الطالب: يتبادلون الأسئلة ويجيبون.\n5) الختام: مسابقة المجموعات (6 دقائق: 34–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\n1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\n1. [مستوى المعرفة] رتب: نورس – عوالق – سمكة.\n   الإجابة النموذجية: عوالق ← سمكة ← نورس.\n2. [مستوى التطبيق] رتب: قرش – عوالق – سمك صغير – فقمة.\n   الإجابة النموذجية: عوالق ← سمك صغير ← فقمة ← قرش.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد تركيزه في الهواء ويحبس الحرارة.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n1. [مستوى المعرفة] أكمل: الحيوانات التي تتغذى عليها المفترسات تسمى ____.\n   الإجابة النموذجية: فرائس.\n2. [مستوى التطبيق] ما العلاقة بين فرعي «آثار الإنسان» و«الاعتناء بالبيئة» في الخريطة؟\n   الإجابة النموذجية: الاعتناء بالبيئة يقلل الآثار السلبية للإنسان مثل التلوث وإزالة الغابات.\n3. [مستوى الاستدلال] اربط بين إزالة الغابات والسلاسل الغذائية.\n   الإجابة النموذجية: تدمر إزالة الغابات المواطن فتختفي المنتجات وتنهار السلاسل الغذائية فيها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\n1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\n1. [مستوى المعرفة] رتب: صقر – بذور – سحلية – خنفساء.\n   الإجابة النموذجية: بذور ← خنفساء ← سحلية ← صقر.\n2. [مستوى التطبيق] كيف يمكن أن تتسبب الأمطار الحمضية في قتل الضفادع؟\n   الإجابة النموذجية: تجعل ماء البحيرات حمضيًا فيضر بالضفادع وغذائها.\n3. [مستوى الاستدلال] اقترح طريقة لإعادة استخدام الزجاجات البلاستيكية.\n   الإجابة النموذجية: كأصص للزراعة أو لتخزين الأغراض أو صنع أدوات مفيدة.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n1. [مستوى المعرفة] ما المصطلح: «التخلص من النفايات بمعالجتها لتصبح منتجًا جديدًا»؟\n   الإجابة النموذجية: إعادة التدوير.\n2. [مستوى التطبيق] اذكر أثرين سلبيين للإنسان على البيئة وطريقتين للعناية بها.\n   الإجابة النموذجية: السلبي: التلوث وإزالة الغابات؛ العناية: إعادة التدوير وترشيد الطاقة.\n3. [مستوى الاستدلال] اكتب سؤالًا عن الوحدة وأجب عنه.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nللطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\nللطالب: حل «المراجعة اللغوية» في كتاب النشاط ص 36 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى متابعة الابن في المراجعة.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nللطالب: مراجعة الوحدة الثانية كاملة باستخدام الخريطة المفاهيمية. لولي الأمر: يُرجى الاطلاع على الخريطة ومراجعة الوحدة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"id": "3-1", "title": "التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37، 72–73 | دليل المعلم ص 71–75", "n": 5, "per": [{"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54 | دليل المعلم ص 71–73", "num": "الحصة الأولى من 5", "focus": "التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء"}, "f": ["1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد.\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة.\nمخرج تعليمي آخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين.", "1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد. ← فهم\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة. ← تطبيق\nالمخرج الآخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكعبات ثلج، أطباق، ساعة إيقاف", "- حالات المادة\n- الانصهار\n- التجمد\n- التغير القابل للعكس\n- الحرارة", "يراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟", "1) التهيئة: حالات المادة (5 دقائق: 0–5)\n   المعلم: يراجع الحالات الثلاث بأمثلة من الصف الخامس.\n   الطالب: يذكرون الماء: ثلج، ماء، بخار.\n2) نشاط 3-1: ملاحظة تغيرات الثلج (12 دقائق: 5–17)\n   المعلم: يوزع مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54.\n   الطالب: يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب.\n3) هل يمكن عكسه؟ (8 دقائق: 17–25)\n   المعلم: يسأل: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس».\n   الطالب: يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء.\n4) تصحيح المفاهيم (10 دقائق: 25–35)\n   المعلم: يوضح أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر).\n   الطالب: يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير).\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).", "1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.", "للطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | دليل المعلم ص 72–73", "num": "الحصة الثانية من 5", "focus": "التغيرات غير القابلة للعكس"}, "f": ["1. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة.\n2. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل.\nمخرج تعليمي آخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة.", "1. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة. ← فهم\n2. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل. ← تطبيق\nالمخرج الآخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة. ← تحليل", "- العرض العملي\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورقة، مقص، صندوق رمل، عود ثقاب (للمعلم فقط)", "- التغير غير القابل للعكس\n- الاحتراق\n- الكربون\n- مادة جديدة", "يمزق المعلم ورقة إلى قطع ويسأل: هل يمكنني إرجاع الورقة كما كانت؟ ثم يحرق قطعة داخل صندوق الرمل ويعيد السؤال.", "1) التهيئة: ورقة ممزقة وورقة محترقة (6 دقائق: 0–6)\n   المعلم: ينفذ العرض في صندوق الرمل بأمان.\n   الطالب: يقارنون: الممزقة يمكن لصقها، المحترقة لا.\n2) مفهوم التغير غير القابل للعكس (10 دقائق: 6–16)\n   المعلم: يشرح ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب.\n   الطالب: يكتبون التعريفين في جدول مقارنة.\n3) لعبة «قابل أم غير قابل؟» (12 دقائق: 16–28)\n   المعلم: يعرض بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد.\n   الطالب: يصنفون البطاقات ويبررون في ثنائيات.\n4) الأسئلة 1–3 ص 55 (7 دقائق: 28–35)\n   المعلم: يوجه سؤال الجلي والبيض المسلوق.\n   الطالب: يجيبون ويرسمون مخططًا سهميًا للجلي.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n2. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n3. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.", "1. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n2. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n3. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.", "للطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 72 | دليل المعلم ص 73", "num": "الحصة الثالثة من 5", "focus": "احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا"}, "f": ["1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة.\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة.\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة.", "1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة. ← تطبيق\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة. ← تحليل\nالمخرج الآخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة. ← تحليل", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: شمعة، حامل أو طبق، ملعقة معدنية، أعواد ثقاب، ورقة العمل 3-1", "- انصهار الشمع\n- احتراق الفتيل\n- الدخان\n- الملاحظة العلمية", "يعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟", "1) التهيئة: الشمعة القصيرة (5 دقائق: 0–5)\n   المعلم: يعرض الشمعتين ويجمع التوقعات.\n   الطالب: يقترحون: انصهر، احترق، تبخر.\n2) ورقة العمل 3-1 (الجزء الأول): عرض الشمعة (13 دقائق: 5–18)\n   المعلم: يشعل الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد.\n   الطالب: يسجلون الملاحظات في جدول ورقة العمل (ص 72).\n3) التحليل (10 دقائق: 18–28)\n   المعلم: يناقش: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة.\n   الطالب: يصنفون كل ملاحظة ويعللون.\n4) السلامة مع اللهب (7 دقائق: 28–35)\n   المعلم: يناقش قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة.\n   الطالب: يكتبون ثلاث قواعد سلامة.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.", "1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.", "للطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 73 | دليل المعلم ص 73–74", "num": "الحصة الرابعة من 5", "focus": "تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص"}, "f": ["1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز).\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة.\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم.", "1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز). ← تحليل\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة. ← فهم\nالمخرج الآخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: بيكربونات الصوديوم، خل، كأس زجاجية، ملعقة صغيرة، جص، ماء، أكواب، ورقة العمل 3-1", "- التغير الفيزيائي\n- التغير الكيميائي\n- التفاعل\n- الفقاعات\n- الجص", "يسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم.", "1) التهيئة: من المطبخ (5 دقائق: 0–5)\n   المعلم: يعرض المادتين ويطلب تنبؤًا.\n   الطالب: يتنبؤون بما سيحدث.\n2) ورقة العمل 3-1 (الجزء الثاني) (12 دقائق: 5–17)\n   المعلم: يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس.\n   الطالب: يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟\n3) عرض الجص (8 دقائق: 17–25)\n   المعلم: يخلط الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج.\n   الطالب: يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص.\n4) فيزيائي أم كيميائي؟ (10 دقائق: 25–35)\n   المعلم: يشرح: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة).\n   الطالب: يصنفون أمثلة الدرس في جدول.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.", "1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.", "للطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37 | دليل المعلم ص 73–75", "num": "الحصة الخامسة من 5", "focus": "تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج"}, "f": ["1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر.\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي.\nمخرج تعليمي آخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها.", "1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر. ← تطبيق\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي. ← تحليل\nالمخرج الآخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها. ← تحليل", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: نموذج بركان من العجين أو الورق، بيكربونات الصوديوم، خل، ألوان طعام، تمرين 3-1", "- النموذج\n- الثوران\n- إعادة تدوير الزجاج\n- الانصهار", "يعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟", "1) التهيئة: بركان (4 دقائق: 0–4)\n   المعلم: يعرض المقطع ويطرح السؤال.\n   الطالب: يقترحون الخل والبيكربونات.\n2) نموذج البركان (تكامل مع الفنون والمهارات الحياتية) (14 دقائق: 4–18)\n   المعلم: يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام.\n   الطالب: ينفذون الثوران ويصفون التغير ويصنفونه.\n3) تمرين 3-1 في كتاب النشاط (10 دقائق: 18–28)\n   المعلم: يوجه حل التمرين (ص 37) مع دعم المتعثرين.\n   الطالب: يقارنون التغيرات ويحلون فرديًا.\n4) تحدّث عن: إعادة تدوير الزجاج (7 دقائق: 28–35)\n   المعلم: يشرح: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟\n   الطالب: يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "للطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}], "comb": ["الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد.\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة.\nمخرج تعليمي آخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين.\n\nالحصة 2: التغيرات غير القابلة للعكس\n1. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة.\n2. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل.\nمخرج تعليمي آخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة.\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة.\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز).\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة.\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتك
