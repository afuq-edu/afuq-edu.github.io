 يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان. ← فهم\nالمخرج الآخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء. ← فهم\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية. ← فهم\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة. ← تطبيق\nالمخرج الآخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية. ← فهم", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- العصف الذهني\n- الخرائط الذهنية والمفاهيمية\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- فكّر – زاوج – شارك", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الأقلام\n- أخرى: ورق مقوى وورق أبيض وأقلام تلوين ومقص وغراء لنشاط 1-1\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: مخططات المجموعات وغراء ومقص", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n- أعضاء الجسم\n- أجهزة الجسم\n- الدماغ\n- القلب\n- الرئتان\n- الكبد\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- وظيفة العضو\n- الهضم\n- الإخراج\n- التنفس\n- الجمجمة\n- الضلوع", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nيطرح المعلم تشبيه الجسم بالمدينة: ماذا تحتاج المدينة لتعمل؟ (طاقة، نقل، مياه، تخلّص من الفضلات، إدارة). يعقد جلسة عصف ذهني قصيرة عن أعضاء الجسم التي تقوم بأعمال مشابهة، ويسجّل الأفكار في خريطة ذهنية على السبورة. (5 دقائق)\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nيعرض المعلم بطاقات أسماء الأعضاء، ويطلب من كل طالب أن يخمّن «أفضل تنبؤ» لوظيفة عضو واحد، ثم يقارن التخمينات بعد الحصة. (5 دقائق)", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها — زمن الحصة 40 دقيقة\n\n1. استكشاف صورة الأعضاء: يعرض المعلم صورة أعضاء الجسم في كتاب الطالب ص 18 على السبورة الذكية، ويقدّم مصطلح «العضو» و«الجهاز»، والطلبة يقرؤون أسماء الأعضاء ويشيرون إلى موقع كل عضو على أجسامهم (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 1-1 (الجزء الأول): مخطط الجسم: يوزّع المجموعات (4–5 طلاب) ويوجّه رسم محيط جسم زميل على الورق المقوى، ورسم الأعضاء بحجم تقريبي مناسب، والطلبة يرسمون محيط الجسم ثم يرسمون الأعضاء ويكتبون أسماءها ويلوّنونها (11 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n3. مناقشة المواقع: يسأل المعلم: أي الأعضاء في الرأس؟ في الصدر؟ في البطن؟ ويصحّح الأخطاء، والطلبة يجيبون مستعينين بالصورة ومخطط مجموعتهم (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n4. الختام والتقويم: يطرح المعلم أسئلة التقويم الختامي شفهيًا، والطلبة يجيبون فرديًا ويحتفظون بالمخطط لاستكماله في الحصة القادمة (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها — زمن الحصة 40 دقيقة\n\n1. نشاط 1-1 (الجزء الثاني): إكمال المخطط: يتابع المجموعات أثناء قصّ الأعضاء ولصقها مستعينين بالصورة ص 18، والطلبة يلصقون الأعضاء في مواضعها ويكتبون بجانب كل عضو وظيفته (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. وظائف الأعضاء: يناقش المعلم وظيفة كل عضو: الدماغ تحكّم وتفكير، القلب ضخ الدم، الرئتان تنفس، الكليتان إخراج، المعدة والأمعاء هضم، الكبد تخزين الطاقة والتخلص من المواد السامة، والطلبة يقارنون تنبؤاتهم بالوظائف الصحيحة ويصحّحون (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أسئلة النشاط 1-1 وتمرين 1-1: يوجّه المعلم حل أسئلة النشاط ص 19 وتمرين 1-1 في كتاب النشاط ص 16 (لدعم المتعثرين)، والطلبة يجيبون فرديًا ثم يتحققون مع زميل (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تحدّث عن: الحماية: يسأل المعلم: كيف تتم حماية أعضاء الجسم؟ ويذكّر بدراسة الصف الرابع، والطلبة يذكرون أن الجمجمة تحمي الدماغ والضلوع تحمي القلب والرئتين (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n6. غلق الدرس – أعضاء فريق الوطن: تشبّه كل مجموعة أعضاء الجسم بفريق عمل في مؤسسة عمانية: الدماغ القائد، والقلب المضخة، والرئتان، وتعرض كيف يتعاون الجميع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أشر إلى موقع القلب والرئتين في الصورة، وسمِّ كلًّا منهما.\n   الإجابة النموذجية: القلب في الصدر بين الرئتين مائلًا لليسار، والرئتان في الصدر على جانبيه.\n2. [مستوى التطبيق] ما العضو الموجود في الرأس؟ وما الأعضاء الموجودة في البطن؟\n   الإجابة النموذجية: الرأس: الدماغ. البطن: المعدة والأمعاء والكبد والكليتان (في الجزء الخلفي).\n3. [مستوى الاستدلال] لماذا نقول إن أعضاء الجسم «تعمل معًا»؟\n   الإجابة النموذجية: لأن كل عضو يؤدي جزءًا من عمل أكبر، وتتعاون الأعضاء لتكوّن أجهزة تؤدي وظائف الحياة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صِل العضو بوظيفته: القلب – الرئتان – الكليتان.\n   الإجابة النموذجية: القلب: ضخ الدم. الرئتان: التنفس. الكليتان: الإخراج (التخلص من الفضلات).\n2. [مستوى التطبيق] ما وظيفة الكبد كما وردت في كتاب الطالب؟\n   الإجابة النموذجية: تخزين الطاقة وتخليص الجسم من المواد السامة.\n3. [مستوى الاستدلال] لماذا يحتاج الدماغ إلى حماية قوية أكثر من غيره؟\n   الإجابة النموذجية: لأنه يتحكم في جميع وظائف الجسم، وإصابته قد تعطّل عمل الجسم كله، فتحميه الجمجمة الصلبة.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة من أعضاء الجسم الرئيسية.\n   الإجابة النموذجية: مثل: الدماغ، القلب، الرئتان (أو الكليتان، المعدة، الأمعاء، الكبد).\n2. [مستوى التطبيق] صنّف الأعضاء الآتية حسب موقعها (رأس/صدر/بطن): القلب، المعدة، الدماغ، الأمعاء.\n   الإجابة النموذجية: رأس: الدماغ. صدر: القلب. بطن: المعدة والأمعاء.\n3. [مستوى الاستدلال] أيّ الأعضاء الرئيسية يوجد في الجسم على هيئة زوج؟ وما الفائدة المحتملة من ذلك؟\n   الإجابة النموذجية: الرئتان والكليتان؛ وجود عضوين يزيد كفاءة العمل ويمكن للجسم أن يعمل بعضو واحد سليم عند الضرورة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العضو المسؤول عن الهضم؟\n   الإجابة النموذجية: المعدة والأمعاء.\n2. [مستوى التطبيق] كيف تحمي الضلوع أعضاء الصدر؟\n   الإجابة النموذجية: تشكّل قفصًا عظميًا يحيط بالقلب والرئتين فيحميهما من الصدمات.\n3. [مستوى الاستدلال] لو تعطلت الكليتان، ما المشكلة التي ستواجه الجسم؟\n   الإجابة النموذجية: تتراكم الفضلات والماء الزائد في الدم فيتضرر الجسم.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nللطالب: قراءة كتاب الطالب ص 18 وحفظ أسماء الأعضاء ومواقعها، وإحضار المخطط غير المكتمل. لولي الأمر: يُرجى مساعدة الابن على الإشارة إلى مواقع الأعضاء على جسمه وتسميتها.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nللطالب: حل ورقة العمل 1-1 (كتاب النشاط ص 49) وتمرين 1-1 (ص 16) واجبًا منزليًا، ومراجعة ص 19. لولي الأمر: يُرجى متابعة حل الواجب ومناقشة الابن في وظيفة كل عضو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=1"]}, {"id": "1-2", "title": "القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 17، 50–52 | دليل المعلم ص 26–28", "n": 3, "per": [{"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20 | دليل المعلم ص 26–28", "num": "الحصة الأولى من 3", "focus": "القلب: موقعه وحجمه وعمله كمضخة"}, "f": ["1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد (20 دقيقة)\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم (15 دقيقة)\nمخرج تعليمي آخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط (5 دقائق)", "1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد. ← تذكر\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم. ← فهم\nالمخرج الآخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط. ← تطبيق", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: أنبوب كرتوني (بكرة مناديل) وعبوة بلاستيكية مرنة مملوءة بالماء", "- القلب\n- عضلة القلب\n- الانقباض والانبساط\n- دقات القلب\n- الدم", "يطلب المعلم من الطلبة رسم القلب كما يتخيلونه، ثم يسأل: هل يشبه قلوب بطاقات المعايدة؟ وما الذي يفعله القلب حقًا؟ (5 دقائق)", "1. الاستماع إلى القلب: ينظّم الطلبة ثنائيات لاستخدام أنبوب الكرتون للاستماع إلى صدر الزميل، والطلبة يستمعون ويصفون الصوت ويتوقعون مصدره (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض بنية القلب: يعرض المعلم مقطعًا مرئيًا/صورة للقلب ص 20، ويوضح موقعه في الصدر يسارًا وحمايته بالضلوع وحجمه بحجم القبضة، والطلبة يضمّون قبضاتهم لتقدير الحجم ويحددون الموقع على أجسامهم (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. نموذج المضخة: يضغط المعلم عبوة بلاستيكية مملوءة بالماء ذات فوهة ضيقة ليحاكي انقباض القلب، والطلبة يلاحظون اندفاع الماء ويربطونه بضخ الدم عند انقباض عضلة القلب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. التلخيص والتقويم: يقود المعلم تلخيص «القلب عضلة تضخ الدم» ويطرح التقويم الختامي، والطلبة يكتبون ملخصًا من جملتين ويجيبون عن الأسئلة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يقع القلب؟ وما الذي يحميه؟\n   الإجابة النموذجية: في الصدر مائلًا إلى اليسار، وتحميه الضلوع.\n2. [مستوى التطبيق] ما الذي يمثّله الضغط على العبوة في النموذج؟\n   الإجابة النموذجية: انقباض عضلة القلب الذي يدفع الدم بقوة.\n3. [مستوى الاستدلال] لماذا يُعدّ القلب عضلة «فريدة»؟\n   الإجابة النموذجية: لأنه ينقبض وينبسط من تلقاء نفسه باستمرار طوال حياة الإنسان دون توقف.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما وظيفة القلب؟\n   الإجابة النموذجية: ضخ الدم إلى جميع أجزاء الجسم.\n2. [مستوى التطبيق] ما سبب الصوت الذي سمعته عبر الأنبوب؟\n   الإجابة النموذجية: دقات القلب الناتجة عن انقباض عضلته أثناء ضخ الدم.\n3. [مستوى الاستدلال] اقترح طريقة أخرى لتمثيل عمل القلب بأدوات بسيطة.\n   الإجابة النموذجية: مثل الضغط على بالون مملوء بالماء متصل بأنبوب، أو كرة مطاطية تضخ الماء.", "للطالب: قراءة كتاب الطالب ص 20، والاستماع لدقات القلب في المنزل بأنبوب كرتوني. لولي الأمر: يُرجى مشاركة الابن في التجربة ومناقشته في أهمية القلب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}, {"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 17 | دليل المعلم ص 26–28", "num": "الحصة الثانية من 3", "focus": "الجهاز الدوري ومسار الدم في الجسم"}, "f": ["1. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية (5 دقائق)\n2. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم (20 دقيقة)\nمخرج تعليمي آخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم (15 دقيقة)", "1. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية. ← تذكر\n2. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم. ← فهم\nالمخرج الآخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم. ← تحليل", "- لعب الأدوار والمحاكاة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كرات حمراء وزرقاء وأوعية فارغة وطباشير لرسم مخطط الدورة على الأرض", "- الجهاز الدوري\n- الدورة الدموية\n- الأوعية الدموية\n- الأكسجين\n- ثاني أكسيد الكربون", "يطلب المعلم من الطلبة النظر إلى داخل معصمهم ورؤية الأوعية الدموية، ويسأل: إلى أين يذهب الدم الذي يجري فيها؟ (5 دقائق)", "1. جانبا القلب والأوعية: يشرح المعلم بالصورة ص 20–21: الجانب الأيسر يضخ الدم المحمّل بالأكسجين للجسم، والأيمن يضخ الدم إلى الرئتين؛ والدم يحمل الغذاء والأكسجين والفضلات، والطلبة يلوّنون مخططًا بسيطًا: الأحمر للدم المؤكسج والأزرق لغير المؤكسج (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. محاكاة الدورة الدموية: يرسم المعلم دائرتين على الأرض (الرئتان – القلب – بقية الجسم) ويوزّع الأدوار، والطلبة يحملون الكرات الحمراء (أكسجين) من الرئتين إلى الجسم والزرقاء (ثاني أكسيد الكربون) من الجسم إلى الرئتين مرورًا بالقلب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أسئلة الكتاب وتمرين 1-2: يناقش المعلم الأسئلة 1–3 ص 21 ويوجّه تمرين 1-2 في كتاب النشاط ص 17، والطلبة يجيبون كتابيًا ويتبادلون التصحيح (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما مكونات الجهاز الدوري؟\n   الإجابة النموذجية: القلب والدم والأوعية الدموية.\n2. [مستوى التطبيق] ماذا يحمل الدم إلى أجزاء الجسم؟ وماذا يحمل منها؟\n   الإجابة النموذجية: يحمل الغذاء والأكسجين إليها، ويحمل الفضلات (مثل ثاني أكسيد الكربون) منها.\n3. [مستوى الاستدلال] لماذا يضخ القلب الدم إلى الرئتين قبل ضخه إلى أنحاء الجسم؟\n   الإجابة النموذجية: ليأخذ الدم الأكسجين من الرئتين ويتخلص من ثاني أكسيد الكربون، ثم يُضخ محمّلًا بالأكسجين إلى الجسم.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أي جانبي القلب يضخ الدم المحمّل بالأكسجين إلى الجسم؟\n   الإجابة النموذجية: الجانب الأيسر.\n2. [مستوى التطبيق] رتّب مسار الدم: بقية الجسم – الرئتان – القلب (مرتين).\n   الإجابة النموذجية: بقية الجسم ← القلب ← الرئتان ← القلب ← بقية الجسم.\n3. [مستوى الاستدلال] لو انسدّ وعاء دموي يغذي عضلة القلب، ماذا تتوقع أن يحدث؟\n   الإجابة النموذجية: لا تصل الأكسجين والغذاء إلى عضلة القلب فتتضرر وقد تحدث نوبة قلبية.", "للطالب: حل تمرين 1-2 في كتاب النشاط ص 17 واجبًا منزليًا ومراجعة ص 20–21. لولي الأمر: يُرجى مناقشة الابن في أهمية الرياضة والغذاء الصحي لسلامة القلب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}, {"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 50–52 | دليل المعلم ص 27–28", "num": "الحصة الثالثة من 3", "focus": "كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي"}, "f": ["1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى (15 دقيقة)\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة (10 دقائق)\nمخرج تعليمي آخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج (15 دقيقة)", "1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى. ← فهم\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة. ← تحليل\nالمخرج الآخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج. ← تقييم", "- التعلم التشاركي\n- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: ورقتا العمل 1-2أ و1-2ب في كتاب النشاط", "- الدورة الدموية الصغرى\n- الدليل العلمي\n- الملاحظة\n- التجربة\n- الأوعية الدموية", "يعرض المعلم معتقدًا قديمًا: «الكبد يصنع دمًا جديدًا كل مرة، والجسم يستهلك الدم»، ويسأل: كيف يمكن أن نتأكد أن هذه الفكرة خاطئة؟ (5 دقائق)", "1. ورقة العمل 1-2أ: ابن النفيس: يوزّع المجموعات لقراءة ورقة العمل 1-2أ (كتاب النشاط ص 50) ويطرح أسئلة موجّهة، والطلبة يقرؤون ويجيبون: ماذا كان يُعتقد؟ وما الذي اكتشفه ابن النفيس عن الرئتين؟ (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. ورقة العمل 1-2ب: ويليام هارفي: يوجّه المعلم قراءة ورقة العمل 1-2ب (ص 51–52) ويبرز: ملاحظة مضخات الماء، والتجارب المتكررة، وحساب كمية الدم، والطلبة يجيبون عن أسئلة الورقة ويحددون الأدلة التي استخدمها هارفي (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مقارنة ومناقشة: يقود المعلم مقارنة بين الإسهامين في جدول على السبورة، ويطرح سؤال التحدي عن النوبة القلبية، والطلبة يكملون الجدول ويعرضون إجاباتهم (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – قلب ينبض بعمان: تحدد الأزواج موقع القلب وحجمه بقبضة اليد، وتصف عمله مضخةً، ثم تكتب عبارة: قلبي ينبض بحب عمان، مع معلومة عن صحة القلب (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا كان يُعتقد قديمًا عن مصدر الدم؟\n   الإجابة النموذجية: أن الدم يتولّد في الكبد ثم ينتقل إلى القلب فيسري في الأوعية إلى الأعضاء.\n2. [مستوى التطبيق] ما الذي يحدث للدم في الرئتين بحسب اكتشاف ابن النفيس؟\n   الإجابة النموذجية: يأخذ الأكسجين ويتخلص من ثاني أكسيد الكربون فيتحول لونه من أحمر قاتم إلى أحمر قانٍ.\n3. [مستوى الاستدلال] لماذا كرّر هارفي تجاربه؟\n   الإجابة النموذجية: للتأكد من أن ملاحظاته ونتائجه دقيقة وصحيحة وليست خطأً عابرًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الدورة التي اكتشفها ابن النفيس؟\n   الإجابة النموذجية: الدورة الدموية الصغرى (بين القلب والرئتين).\n2. [مستوى التطبيق] كيف أثبت هارفي أن الجسم لا يستهلك الدم؟\n   الإجابة النموذجية: لاحظ أن القلب يضخ في ساعة أكثر من وزن الجسم دمًا، فلا يمكن أن يُصنع ويُستهلك كل هذا، بل يدور الدم في الجسم.\n3. [مستوى الاستدلال] ما الذي تتعلمه من قصتي ابن النفيس وهارفي عن طريقة عمل العلماء؟\n   الإجابة النموذجية: العلماء يجمعون الأدلة بالملاحظة والقياس والتجربة المتكررة ويفكرون بإبداع، وقد يصححون الأفكار القديمة.", "للطالب: إكمال إجابات ورقتي العمل 1-2أ و1-2ب (كتاب النشاط ص 50–52)، والبحث عن معلومة إضافية عن ابن النفيس. لولي الأمر: يُرجى تشجيع الابن على القراءة عن علماء المسلمين وإسهاماتهم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}], "comb": ["الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد (20 دقيقة)\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم (15 دقيقة)\nمخرج تعليمي آخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط (5 دقائق)\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\n1. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية (5 دقائق)\n2. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم (20 دقيقة)\nمخرج تعليمي آخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم (15 دقيقة)\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى (15 دقيقة)\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة (10 دقائق)\nمخرج تعليمي آخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج (15 دقيقة)", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد. ← تذكر\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم. ← فهم\nالمخرج الآخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط. ← تطبيق\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\n1. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية. ← تذكر\n2. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم. ← فهم\nالمخرج الآخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم. ← تحليل\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى. ← فهم\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة. ← تحليل\nالمخرج الآخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج. ← تقييم", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- فكّر – زاوج – شارك\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\n- لعب الأدوار والمحاكاة\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالنمذجة\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n- التعلم التشاركي\n- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: أنبوب كرتوني (بكرة مناديل) وعبوة بلاستيكية مرنة مملوءة بالماء\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كرات حمراء وزرقاء وأوعية فارغة وطباشير لرسم مخطط الدورة على الأرض\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: ورقتا العمل 1-2أ و1-2ب في كتاب النشاط", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\n- القلب\n- عضلة القلب\n- الانقباض والانبساط\n- دقات القلب\n- الدم\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\n- الجهاز الدوري\n- الدورة الدموية\n- الأوعية الدموية\n- الأكسجين\n- ثاني أكسيد الكربون\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\n- الدورة الدموية الصغرى\n- الدليل العلمي\n- الملاحظة\n- التجربة\n- الأوعية الدموية", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nيطلب المعلم من الطلبة رسم القلب كما يتخيلونه، ثم يسأل: هل يشبه قلوب بطاقات المعايدة؟ وما الذي يفعله القلب حقًا؟ (5 دقائق)\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\nيطلب المعلم من الطلبة النظر إلى داخل معصمهم ورؤية الأوعية الدموية، ويسأل: إلى أين يذهب الدم الذي يجري فيها؟ (5 دقائق)\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nيعرض المعلم معتقدًا قديمًا: «الكبد يصنع دمًا جديدًا كل مرة، والجسم يستهلك الدم»، ويسأل: كيف يمكن أن نتأكد أن هذه الفكرة خاطئة؟ (5 دقائق)", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة — زمن الحصة 40 دقيقة\n\n1. الاستماع إلى القلب: ينظّم الطلبة ثنائيات لاستخدام أنبوب الكرتون للاستماع إلى صدر الزميل، والطلبة يستمعون ويصفون الصوت ويتوقعون مصدره (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. عرض بنية القلب: يعرض المعلم مقطعًا مرئيًا/صورة للقلب ص 20، ويوضح موقعه في الصدر يسارًا وحمايته بالضلوع وحجمه بحجم القبضة، والطلبة يضمّون قبضاتهم لتقدير الحجم ويحددون الموقع على أجسامهم (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. نموذج المضخة: يضغط المعلم عبوة بلاستيكية مملوءة بالماء ذات فوهة ضيقة ليحاكي انقباض القلب، والطلبة يلاحظون اندفاع الماء ويربطونه بضخ الدم عند انقباض عضلة القلب (6 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\n4. التلخيص والتقويم: يقود المعلم تلخيص «القلب عضلة تضخ الدم» ويطرح التقويم الختامي، والطلبة يكتبون ملخصًا من جملتين ويجيبون عن الأسئلة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم — زمن الحصة 40 دقيقة\n\n1. جانبا القلب والأوعية: يشرح المعلم بالصورة ص 20–21: الجانب الأيسر يضخ الدم المحمّل بالأكسجين للجسم، والأيمن يضخ الدم إلى الرئتين؛ والدم يحمل الغذاء والأكسجين والفضلات، والطلبة يلوّنون مخططًا بسيطًا: الأحمر للدم المؤكسج والأزرق لغير المؤكسج (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. محاكاة الدورة الدموية: يرسم المعلم دائرتين على الأرض (الرئتان – القلب – بقية الجسم) ويوزّع الأدوار، والطلبة يحملون الكرات الحمراء (أكسجين) من الرئتين إلى الجسم والزرقاء (ثاني أكسيد الكربون) من الجسم إلى الرئتين مرورًا بالقلب (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أسئلة الكتاب وتمرين 1-2: يناقش المعلم الأسئلة 1–3 ص 21 ويوجّه تمرين 1-2 في كتاب النشاط ص 17، والطلبة يجيبون كتابيًا ويتبادلون التصحيح (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 1-2أ: ابن النفيس: يوزّع المجموعات لقراءة ورقة العمل 1-2أ (كتاب النشاط ص 50) ويطرح أسئلة موجّهة، والطلبة يقرؤون ويجيبون: ماذا كان يُعتقد؟ وما الذي اكتشفه ابن النفيس عن الرئتين؟ (7 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\n2. ورقة العمل 1-2ب: ويليام هارفي: يوجّه المعلم قراءة ورقة العمل 1-2ب (ص 51–52) ويبرز: ملاحظة مضخات الماء، والتجارب المتكررة، وحساب كمية الدم، والطلبة يجيبون عن أسئلة الورقة ويحددون الأدلة التي استخدمها هارفي (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مقارنة ومناقشة: يقود المعلم مقارنة بين الإسهامين في جدول على السبورة، ويطرح سؤال التحدي عن النوبة القلبية، والطلبة يكملون الجدول ويعرضون إجاباتهم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – قلب ينبض بعمان: تحدد الأزواج موقع القلب وحجمه بقبضة اليد، وتصف عمله مضخةً، ثم تكتب عبارة: قلبي ينبض بحب عمان، مع معلومة عن صحة القلب (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يقع القلب؟ وما الذي يحميه؟\n   الإجابة النموذجية: في الصدر مائلًا إلى اليسار، وتحميه الضلوع.\n2. [مستوى التطبيق] ما الذي يمثّله الضغط على العبوة في النموذج؟\n   الإجابة النموذجية: انقباض عضلة القلب الذي يدفع الدم بقوة.\n3. [مستوى الاستدلال] لماذا يُعدّ القلب عضلة «فريدة»؟\n   الإجابة النموذجية: لأنه ينقبض وينبسط من تلقاء نفسه باستمرار طوال حياة الإنسان دون توقف.\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما مكونات الجهاز الدوري؟\n   الإجابة النموذجية: القلب والدم والأوعية الدموية.\n2. [مستوى التطبيق] ماذا يحمل الدم إلى أجزاء الجسم؟ وماذا يحمل منها؟\n   الإجابة النموذجية: يحمل الغذاء والأكسجين إليها، ويحمل الفضلات (مثل ثاني أكسيد الكربون) منها.\n3. [مستوى الاستدلال] لماذا يضخ القلب الدم إلى الرئتين قبل ضخه إلى أنحاء الجسم؟\n   الإجابة النموذجية: ليأخذ الدم الأكسجين من الرئتين ويتخلص من ثاني أكسيد الكربون، ثم يُضخ محمّلًا بالأكسجين إلى الجسم.\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا كان يُعتقد قديمًا عن مصدر الدم؟\n   الإجابة النموذجية: أن الدم يتولّد في الكبد ثم ينتقل إلى القلب فيسري في الأوعية إلى الأعضاء.\n2. [مستوى التطبيق] ما الذي يحدث للدم في الرئتين بحسب اكتشاف ابن النفيس؟\n   الإجابة النموذجية: يأخذ الأكسجين ويتخلص من ثاني أكسيد الكربون فيتحول لونه من أحمر قاتم إلى أحمر قانٍ.\n3. [مستوى الاستدلال] لماذا كرّر هارفي تجاربه؟\n   الإجابة النموذجية: للتأكد من أن ملاحظاته ونتائجه دقيقة وصحيحة وليست خطأً عابرًا.", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما وظيفة القلب؟\n   الإجابة النموذجية: ضخ الدم إلى جميع أجزاء الجسم.\n2. [مستوى التطبيق] ما سبب الصوت الذي سمعته عبر الأنبوب؟\n   الإجابة النموذجية: دقات القلب الناتجة عن انقباض عضلته أثناء ضخ الدم.\n3. [مستوى الاستدلال] اقترح طريقة أخرى لتمثيل عمل القلب بأدوات بسيطة.\n   الإجابة النموذجية: مثل الضغط على بالون مملوء بالماء متصل بأنبوب، أو كرة مطاطية تضخ الماء.\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أي جانبي القلب يضخ الدم المحمّل بالأكسجين إلى الجسم؟\n   الإجابة النموذجية: الجانب الأيسر.\n2. [مستوى التطبيق] رتّب مسار الدم: بقية الجسم – الرئتان – القلب (مرتين).\n   الإجابة النموذجية: بقية الجسم ← القلب ← الرئتان ← القلب ← بقية الجسم.\n3. [مستوى الاستدلال] لو انسدّ وعاء دموي يغذي عضلة القلب، ماذا تتوقع أن يحدث؟\n   الإجابة النموذجية: لا تصل الأكسجين والغذاء إلى عضلة القلب فتتضرر وقد تحدث نوبة قلبية.\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الدورة التي اكتشفها ابن النفيس؟\n   الإجابة النموذجية: الدورة الدموية الصغرى (بين القلب والرئتين).\n2. [مستوى التطبيق] كيف أثبت هارفي أن الجسم لا يستهلك الدم؟\n   الإجابة النموذجية: لاحظ أن القلب يضخ في ساعة أكثر من وزن الجسم دمًا، فلا يمكن أن يُصنع ويُستهلك كل هذا، بل يدور الدم في الجسم.\n3. [مستوى الاستدلال] ما الذي تتعلمه من قصتي ابن النفيس وهارفي عن طريقة عمل العلماء؟\n   الإجابة النموذجية: العلماء يجمعون الأدلة بالملاحظة والقياس والتجربة المتكررة ويفكرون بإبداع، وقد يصححون الأفكار القديمة.", "الحصة 1: القلب: موقعه وحجمه وعمله كمضخة\nللطالب: قراءة كتاب الطالب ص 20، والاستماع لدقات القلب في المنزل بأنبوب كرتوني. لولي الأمر: يُرجى مشاركة الابن في التجربة ومناقشته في أهمية القلب.\n\nالحصة 2: الجهاز الدوري ومسار الدم في الجسم\nللطالب: حل تمرين 1-2 في كتاب النشاط ص 17 واجبًا منزليًا ومراجعة ص 20–21. لولي الأمر: يُرجى مناقشة الابن في أهمية الرياضة والغذاء الصحي لسلامة القلب.\n\nالحصة 3: كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي\nللطالب: إكمال إجابات ورقتي العمل 1-2أ و1-2ب (كتاب النشاط ص 50–52)، والبحث عن معلومة إضافية عن ابن النفيس. لولي الأمر: يُرجى تشجيع الابن على القراءة عن علماء المسلمين وإسهاماتهم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}, {"id": "1-3", "title": "دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 22–23 | كتاب النشاط ص 18، 53–56 | دليل المعلم ص 28–32", "n": 3, "per": [{"h": {"lesson": "1-3 دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 22–23 | دليل المعلم ص 28–31", "num": "الحصة الأولى من 3", "focus": "الفرق بين دقات القلب والنبض وقياس معدل النبض"}, "f": ["1. يميّز بين دقات القلب والنبض (10 دقائق)\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول (15 دقيقة)\nمخرج تعليمي آخر: يحسب متوسط معدل النبض من القياسات المتكررة (15 دقيقة)", "1. يميّز بين دقات القلب والنبض. ← فهم\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول. ← تطبيق\nالمخرج الآخر: يحسب متوسط معدل النبض من القياسات المتكررة. ← تطبيق", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ساعة إيقاف أو ساعة بعقرب ثوانٍ، وكرات ورقية", "- دقات القلب\n- النبض\n- معدل النبض\n- المتوسط\n- تكرار القياس", "يعطي المعلم كل طالب ورقة يكوّرها، ويعدّ حتى 90 في دقيقة، ويضغط الطلبة الكرة مع كل عدّة؛ ثم يسأل: هل تعبت يدك؟ القلب يفعل ذلك دون توقف! (5 دقائق)", "1. النبض ومواضعه: يشرح المعلم أن النبض موجة سببها ضغط الدم المندفع من القلب، ويبيّن مواضعه: المعصم وجانب العنق، وعدم استخدام الإبهام، والطلبة يتحسسون النبض في المعصم والعنق (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. نشاط 1-3: قياس النبض: ينظم مجموعات (4–5)، ويقيس نبضه ونبض متطوع على السبورة لتوضيح الاختلاف، والطلبة يعدّون نبضاتهم في دقيقة ثلاث مرات ويسجلون في جدول ويقارنون مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حساب المتوسط ومناقشة الأسئلة: يوضح المعلم حساب المتوسط (جمع القياسات ÷ عددها) ويناقش الأسئلة 1–3 ص 23، والطلبة يحسبون متوسطهم ويفسرون اختلاف القياسات (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ: النبض ليس هو الدقة نفسها، والطلبة يجيبون ويكتبون الفرق في دفاترهم (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يمكنك أن تشعر بنبضك بسهولة؟\n   الإجابة النموذجية: في المعصم وعلى جانبي العنق.\n2. [مستوى التطبيق] لماذا لا نستخدم الإبهام لقياس النبض؟\n   الإجابة النموذجية: لأن للإبهام نبضه الخاص فيختلط بنبض الشخص المقيس.\n3. [مستوى الاستدلال] قاس طالب نبضه: 88، 92، 90. احسب المتوسط، ولماذا اختلفت القياسات؟\n   الإجابة النموذجية: المتوسط = (88+92+90)÷3 = 90 نبضة/دقيقة؛ تختلف لتغيّر النشاط أو القلق أو أخطاء العدّ.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين دقات القلب والنبض؟\n   الإجابة النموذجية: دقات القلب انقباض عضلة القلب لضخ الدم، والنبض هو الضغط الناتج عن اندفاع الدم في الأوعية ونشعر به في المعصم والعنق.\n2. [مستوى التطبيق] كم يبلغ تقريبًا معدل نبض طفل في حالة الراحة؟\n   الإجابة النموذجية: نحو 90 نبضة في الدقيقة.\n3. [مستوى الاستدلال] لماذا نكرر قياس النبض أكثر من مرة؟\n   الإجابة النموذجية: لنحصل على نتائج أكثر موثوقية ونكتشف الأخطاء ونحسب المتوسط.", "للطالب: قياس النبض في المنزل بعد الغداء وقبل النوم وتسجيل النتائج لمقارنتها في الحصة القادمة (كتاب الطالب ص 22). لولي الأمر: يُرجى مساعدة الابن في توقيت الدقيقة أثناء القياس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}, {"h": {"lesson": "1-3 دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 22–23 | كتاب النشاط ص 55 | دليل المعلم ص 29–31", "num": "الحصة الثانية من 3", "focus": "أثر ممارسة الرياضة على معدل النبض (استقصاء)"}, "f": ["1. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية (10 دقائق)\n2. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة (20 دقيقة)\nمخرج تعليمي آخر: يحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه (10 دقائق)", "1. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية. ← تطبيق\n2. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة. ← تطبيق\nالمخرج الآخر: يحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه. ← تقييم", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- الأقلام\n- أخرى: ساعة إيقاف، ورقة العمل 1-3ب، مساطر", "- التنبؤ\n- العامل المؤثر\n- التمثيل البياني بالأعمدة\n- الدليل\n- الاستنتاج", "يعرض المعلم نتائج قياسات الطلبة المنزلية (بعد الغداء/قبل النوم) ويسأل: متى كان النبض أعلى؟ ولماذا؟ (5 دقائق)", "1. كتابة التنبؤ: يطرح المعلم السؤال: ماذا سيحدث لنبضك بعد الجري دقيقة؟ ويطلب تنبؤًا مكتوبًا مع تبرير، والطلبة يكتبون تنبؤاتهم ومبرراتهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تنفيذ الاستقصاء: يوجّه المعلم قياس النبض في الراحة ثم الجري في المكان دقيقة ثم القياس مباشرة، مع مراعاة السلامة، والطلبة يقيسون ويسجلون في جدول «قبل/بعد التمرين» (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. ورقة العمل 1-3ب: التمثيل بالأعمدة: يشرح المعلم معايير رسم الأعمدة: عنوان، محاور، أعمدة بعرض واحد وارتفاع صحيح، والطلبة يمثلون بيانات المجموعة بالأعمدة باستخدام المسطرة (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الاستنتاج والتقويم: يسأل المعلم: هل تدعم نتائجك تنبؤك؟ ولماذا يزيد النبض؟ والطلبة يكتبون استنتاجًا ويجيبون عن التقويم الختامي (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما العامل الذي غيّرناه في هذا الاستقصاء؟\n   الإجابة النموذجية: ممارسة الرياضة (النشاط البدني).\n2. [مستوى التطبيق] ماذا حدث لمعدل النبض بعد التمرين؟\n   الإجابة النموذجية: ازداد معدل النبض.\n3. [مستوى الاستدلال] هل تدعم بياناتك تنبؤك؟ استشهد برقمين من جدولك.\n   الإجابة النموذجية: نعم إذا كان النبض بعد التمرين أعلى من قبله (مثل 90 قبل و130 بعد)، ويُقبل التبرير بالأرقام.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يزداد معدل النبض أثناء الرياضة؟\n   الإجابة النموذجية: لأن العضلات تحتاج مزيدًا من الغذاء والأكسجين فيضخ القلب الدم بسرعة أكبر.\n2. [مستوى التطبيق] اذكر معيارين لرسم تمثيل بياني بالأعمدة صحيح.\n   الإجابة النموذجية: عنوان مناسب، أعمدة متساوية العرض بارتفاعات صحيحة وتسميات واضحة.\n3. [مستوى الاستدلال] اقترح عاملًا آخر قد يغيّر معدل النبض وكيف تختبره.\n   الإجابة النموذجية: مثل القلق أو العمر أو المرض؛ نقيس النبض لأشخاص في حالتين مختلفتين مع تثبيت بقية العوامل.", "للطالب: إكمال ورقة العمل 1-3ب (كتاب النشاط ص 55) إن لم تكتمل، ومراجعة ص 23. لولي الأمر: يُرجى تشجيع الابن على ممارسة الرياضة يوميًا وقياس نبضه قبلها وبعدها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}, {"h": {"lesson": "1-3 دقات القلب والنبض", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 23 | كتاب النشاط ص 18، 53–54، 56 | دليل المعلم ص 30–32", "num": "الحصة الثالثة من 3", "focus": "تحليل بيانات النبض: الأنماط والنتائج غير الملائمة"}, "f": ["1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط (10 دقائق)\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط (15 دقيقة)", "1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط. ← تحليل\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه. ← تحليل\nالمخرج الآخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط. ← تطبيق", "- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقتا العمل 1-3أ و1-3ج", "- النمط\n- النتيجة غير الملائمة للنمط\n- التمثيل الخطي\n- معدل دقات القلب", "يعرض المعلم: «معدل نبض الفيل نحو 30 نبضة في الدقيقة، والفأر نحو 500!» ويسأل: ما الذي قد يفسر هذا الفرق الكبير؟ (5 دقائق)", "1. تمرين 1-3: تحليل بيانات مجموعة: يوجّه المعلم حل تمرين 1-3 (كتاب النشاط ص 18): حساب المتوسط وتحديد النتيجة الشاذة (نبض أحمد 110)، والطلبة يحسبون المتوسط ويفسرون سبب النتيجة الشاذة (قيس أثناء الرياضة) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 1-3أ أو 1-3ج (حسب المستوى): يوزّع المعلم 1-3أ (مقارنة دقات قلوب الحيوانات) للمستوى المرتفع و1-3ج (تمثيل خطي) للبقية مع الدعم، والطلبة يرتبون الكائنات ويستخرجون النمط، أو يرسمون التمثيل الخطي ويقرؤونه (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. عرض الاستنتاجات: يقود المعلم مناقشة: الكائنات الكبيرة دقات قلبها أبطأ؛ ولماذا نعيد القياس عند نتيجة شاذة، وتعرض المجموعات استنتاجاتها وتتنبأ بنبض الحصان وذبابة الفيل (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – نبض بعد الرزحة: يقيس الأطفال نبضهم قبل أداء حركة رقصة شعبية عمانية كالرزحة وبعدها، ويقارنون القراءات ويفسرون زيادة النبض (5 دقائق)\nالاستراتيجيات: التعلم بالاستقصاء.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في بيانات مجموعة كانت أغلب القيم قرب 90 وقيمة واحدة 110. ماذا نسمي هذه القيمة؟\n   الإجابة النموذجية: نتيجة لا تلائم النمط (نتيجة شاذة).\n2. [مستوى التطبيق] ما النمط بين حجم الحيوان وسرعة دقات قلبه؟\n   الإجابة النموذجية: كلما كان الحيوان أصغر كانت دقات قلبه أسرع.\n3. [مستوى الاستدلال] كيف نتصرف عند ظهور نتيجة لا تلائم النمط؟\n   الإجابة النموذجية: نفحص طريقة القياس ونعيده للتأكد من عدم وجود خطأ ونبحث عن سبب مختلف للظروف.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أيهما دقات قلبه أسرع: الحوت الأزرق أم طائر الطنان؟\n   الإجابة النموذجية: طائر الطنان.\n2. [مستوى التطبيق] تنبأ: هل دقات قلب الحصان أسرع أم أبطأ من دقات قلب القطة؟ ولماذا؟\n   الإجابة النموذجية: أبطأ؛ لأن الحصان أكبر حجمًا والكائنات الكبيرة دقات قلبها أبطأ.\n3. [مستوى الاستدلال] لماذا تنخفض دقات قلب الخفاش كثيرًا أثناء السبات؟\n   الإجابة النموذجية: لأن عملياته الحيوية تبطؤ ويحتاج قليلًا جدًا من الغذاء والأكسجين وهو غير نشط.", "للطالب: إكمال ورقة العمل التي بدأها (1-3أ ص 53–54 أو 1-3ج ص 56) ومراجعة ما تعلمه في ص 23. لولي الأمر: يُرجى مناقشة الابن في سبب ارتفاع النبض عند الركض أو الخوف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}], "comb": ["الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n1. يميّز بين دقات القلب والنبض (10 دقائق)\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول (15 دقيقة)\nمخرج تعليمي آخر: يحسب متوسط معدل النبض من القياسات المتكررة (15 دقيقة)\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\n1. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية (10 دقائق)\n2. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة (20 دقيقة)\nمخرج تعليمي آخر: يحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه (10 دقائق)\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\n1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط (10 دقائق)\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط (15 دقيقة)", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n1. يميّز بين دقات القلب والنبض. ← فهم\n2. يقيس معدل نبضه في دقيقة ويكرر القياس ثلاث مرات ويسجله في جدول. ← تطبيق\nالمخرج الآخر: يحسب متوسط معدل النبض من القياسات المتكررة. ← تطبيق\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\n1. يتنبأ بأثر النشاط البدني على معدل النبض بناءً على معرفته العلمية. ← تطبيق\n2. يجمع بيانات النبض قبل التمرين وبعده ويمثلها بالأعمدة. ← تطبيق\nالمخرج الآخر: يحدّد ما إذا كانت الأدلة التي جمعها تدعم تنبؤه. ← تقييم\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\n1. يحدّد أنماطًا في بيانات معدلات النبض والنتائج التي لا تلائم النمط. ← تحليل\n2. يستنتج العلاقة بين حجم الكائن الحي وسرعة دقات قلبه. ← تحليل\nالمخرج الآخر: يتنبأ بمعدل نبض كائنات أخرى اعتمادًا على النمط. ← تطبيق", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\n- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ساعة إيقاف أو ساعة بعقرب ثوانٍ، وكرات ورقية\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\n- الكتاب\n- السبورة التقليدية\n- الأقلام\n- أخرى: ساعة إيقاف، ورقة العمل 1-3ب، مساطر\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقتا العمل 1-3أ و1-3ج", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\n- دقات القلب\n- النبض\n- معدل النبض\n- المتوسط\n- تكرار القياس\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\n- التنبؤ\n- العامل المؤثر\n- التمثيل البياني بالأعمدة\n- الدليل\n- الاستنتاج\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\n- النمط\n- النتيجة غير الملائمة للنمط\n- التمثيل الخطي\n- معدل دقات القلب", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nيعطي المعلم كل طالب ورقة يكوّرها، ويعدّ حتى 90 في دقيقة، ويضغط الطلبة الكرة مع كل عدّة؛ ثم يسأل: هل تعبت يدك؟ القلب يفعل ذلك دون توقف! (5 دقائق)\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\nيعرض المعلم نتائج قياسات الطلبة المنزلية (بعد الغداء/قبل النوم) ويسأل: متى كان النبض أعلى؟ ولماذا؟ (5 دقائق)\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nيعرض المعلم: «معدل نبض الفيل نحو 30 نبضة في الدقيقة، والفأر نحو 500!» ويسأل: ما الذي قد يفسر هذا الفرق الكبير؟ (5 دقائق)", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض — زمن الحصة 40 دقيقة\n\n1. النبض ومواضعه: يشرح المعلم أن النبض موجة سببها ضغط الدم المندفع من القلب، ويبيّن مواضعه: المعصم وجانب العنق، وعدم استخدام الإبهام، والطلبة يتحسسون النبض في المعصم والعنق (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. نشاط 1-3: قياس النبض: ينظم مجموعات (4–5)، ويقيس نبضه ونبض متطوع على السبورة لتوضيح الاختلاف، والطلبة يعدّون نبضاتهم في دقيقة ثلاث مرات ويسجلون في جدول ويقارنون مع زملائهم (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حساب المتوسط ومناقشة الأسئلة: يوضح المعلم حساب المتوسط (جمع القياسات ÷ عددها) ويناقش الأسئلة 1–3 ص 23، والطلبة يحسبون متوسطهم ويفسرون اختلاف القياسات (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ: النبض ليس هو الدقة نفسها، والطلبة يجيبون ويكتبون الفرق في دفاترهم (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء) — زمن الحصة 40 دقيقة\n\n1. كتابة التنبؤ: يطرح المعلم السؤال: ماذا سيحدث لنبضك بعد الجري دقيقة؟ ويطلب تنبؤًا مكتوبًا مع تبرير، والطلبة يكتبون تنبؤاتهم ومبرراتهم (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تنفيذ الاستقصاء: يوجّه المعلم قياس النبض في الراحة ثم الجري في المكان دقيقة ثم القياس مباشرة، مع مراعاة السلامة، والطلبة يقيسون ويسجلون في جدول «قبل/بعد التمرين» (8 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. ورقة العمل 1-3ب: التمثيل بالأعمدة: يشرح المعلم معايير رسم الأعمدة: عنوان، محاور، أعمدة بعرض واحد وارتفاع صحيح، والطلبة يمثلون بيانات المجموعة بالأعمدة باستخدام المسطرة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الاستنتاج والتقويم: يسأل المعلم: هل تدعم نتائجك تنبؤك؟ ولماذا يزيد النبض؟ والطلبة يكتبون استنتاجًا ويجيبون عن التقويم الختامي (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة — زمن الحصة 40 دقيقة\n\n1. تمرين 1-3: تحليل بيانات مجموعة: يوجّه المعلم حل تمرين 1-3 (كتاب النشاط ص 18): حساب المتوسط وتحديد النتيجة الشاذة (نبض أحمد 110)، والطلبة يحسبون المتوسط ويفسرون سبب النتيجة الشاذة (قيس أثناء الرياضة) (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ورقة العمل 1-3أ أو 1-3ج (حسب المستوى): يوزّع المعلم 1-3أ (مقارنة دقات قلوب الحيوانات) للمستوى المرتفع و1-3ج (تمثيل خطي) للبقية مع الدعم، والطلبة يرتبون الكائنات ويستخرجون النمط، أو يرسمون التمثيل الخطي ويقرؤونه (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. عرض الاستنتاجات: يقود المعلم مناقشة: الكائنات الكبيرة دقات قلبها أبطأ؛ ولماذا نعيد القياس عند نتيجة شاذة، وتعرض المجموعات استنتاجاتها وتتنبأ بنبض الحصان وذبابة الفيل (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – نبض بعد الرزحة: يقيس الأطفال نبضهم قبل أداء حركة رقصة شعبية عمانية كالرزحة وبعدها، ويقارنون القراءات ويفسرون زيادة النبض (5 دقائق)\nالاستراتيجيات: التعلم بالاستقصاء.", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يمكنك أن تشعر بنبضك بسهولة؟\n   الإجابة النموذجية: في المعصم وعلى جانبي العنق.\n2. [مستوى التطبيق] لماذا لا نستخدم الإبهام لقياس النبض؟\n   الإجابة النموذجية: لأن للإبهام نبضه الخاص فيختلط بنبض الشخص المقيس.\n3. [مستوى الاستدلال] قاس طالب نبضه: 88، 92، 90. احسب المتوسط، ولماذا اختلفت القياسات؟\n   الإجابة النموذجية: المتوسط = (88+92+90)÷3 = 90 نبضة/دقيقة؛ تختلف لتغيّر النشاط أو القلق أو أخطاء العدّ.\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما العامل الذي غيّرناه في هذا الاستقصاء؟\n   الإجابة النموذجية: ممارسة الرياضة (النشاط البدني).\n2. [مستوى التطبيق] ماذا حدث لمعدل النبض بعد التمرين؟\n   الإجابة النموذجية: ازداد معدل النبض.\n3. [مستوى الاستدلال] هل تدعم بياناتك تنبؤك؟ استشهد برقمين من جدولك.\n   الإجابة النموذجية: نعم إذا كان النبض بعد التمرين أعلى من قبله (مثل 90 قبل و130 بعد)، ويُقبل التبرير بالأرقام.\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في بيانات مجموعة كانت أغلب القيم قرب 90 وقيمة واحدة 110. ماذا نسمي هذه القيمة؟\n   الإجابة النموذجية: نتيجة لا تلائم النمط (نتيجة شاذة).\n2. [مستوى التطبيق] ما النمط بين حجم الحيوان وسرعة دقات قلبه؟\n   الإجابة النموذجية: كلما كان الحيوان أصغر كانت دقات قلبه أسرع.\n3. [مستوى الاستدلال] كيف نتصرف عند ظهور نتيجة لا تلائم النمط؟\n   الإجابة النموذجية: نفحص طريقة القياس ونعيده للتأكد من عدم وجود خطأ ونبحث عن سبب مختلف للظروف.", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين دقات القلب والنبض؟\n   الإجابة النموذجية: دقات القلب انقباض عضلة القلب لضخ الدم، والنبض هو الضغط الناتج عن اندفاع الدم في الأوعية ونشعر به في المعصم والعنق.\n2. [مستوى التطبيق] كم يبلغ تقريبًا معدل نبض طفل في حالة الراحة؟\n   الإجابة النموذجية: نحو 90 نبضة في الدقيقة.\n3. [مستوى الاستدلال] لماذا نكرر قياس النبض أكثر من مرة؟\n   الإجابة النموذجية: لنحصل على نتائج أكثر موثوقية ونكتشف الأخطاء ونحسب المتوسط.\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يزداد معدل النبض أثناء الرياضة؟\n   الإجابة النموذجية: لأن العضلات تحتاج مزيدًا من الغذاء والأكسجين فيضخ القلب الدم بسرعة أكبر.\n2. [مستوى التطبيق] اذكر معيارين لرسم تمثيل بياني بالأعمدة صحيح.\n   الإجابة النموذجية: عنوان مناسب، أعمدة متساوية العرض بارتفاعات صحيحة وتسميات واضحة.\n3. [مستوى الاستدلال] اقترح عاملًا آخر قد يغيّر معدل النبض وكيف تختبره.\n   الإجابة النموذجية: مثل القلق أو العمر أو المرض؛ نقيس النبض لأشخاص في حالتين مختلفتين مع تثبيت بقية العوامل.\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أيهما دقات قلبه أسرع: الحوت الأزرق أم طائر الطنان؟\n   الإجابة النموذجية: طائر الطنان.\n2. [مستوى التطبيق] تنبأ: هل دقات قلب الحصان أسرع أم أبطأ من دقات قلب القطة؟ ولماذا؟\n   الإجابة النموذجية: أبطأ؛ لأن الحصان أكبر حجمًا والكائنات الكبيرة دقات قلبها أبطأ.\n3. [مستوى الاستدلال] لماذا تنخفض دقات قلب الخفاش كثيرًا أثناء السبات؟\n   الإجابة النموذجية: لأن عملياته الحيوية تبطؤ ويحتاج قليلًا جدًا من الغذاء والأكسجين وهو غير نشط.", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nللطالب: قياس النبض في المنزل بعد الغداء وقبل النوم وتسجيل النتائج لمقارنتها في الحصة القادمة (كتاب الطالب ص 22). لولي الأمر: يُرجى مساعدة الابن في توقيت الدقيقة أثناء القياس.\n\nالحصة 2: أثر ممارسة الرياضة على معدل النبض (استقصاء)\nللطالب: إكمال ورقة العمل 1-3ب (كتاب النشاط ص 55) إن لم تكتمل، ومراجعة ص 23. لولي الأمر: يُرجى تشجيع الابن على ممارسة الرياضة يوميًا وقياس نبضه قبلها وبعدها.\n\nالحصة 3: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nللطالب: إكمال ورقة العمل التي بدأها (1-3أ ص 53–54 أو 1-3ج ص 56) ومراجعة ما تعلمه في ص 23. لولي الأمر: يُرجى مناقشة الابن في سبب ارتفاع النبض عند الركض أو الخوف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}, {"id": "1-4", "title": "الرئتان والتنفس", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 24–25 | كتاب النشاط ص 19، 57–58 | دليل المعلم ص 32–34", "n": 2, "per": [{"h": {"lesson": "1-4 الرئتان والتنفس", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 24–25 | دليل المعلم ص 32–34", "num": "الحصة الأولى من 2", "focus": "الشهيق والزفير ومسار الهواء إلى الرئتين"}, "f": ["1. يصف ما يحدث للصدر والرئتين أثناء الشهيق والزفير (15 دقيقة)\n2. يتتبع مسار الهواء من الأنف أو الفم عبر القصبة الهوائية إلى الرئتين (10 دقائق)\nمخرج تعليمي آخر: يوضح أننا نأخذ الأكسجين في الشهيق ونتخلص من ثاني أكسيد الكربون في الزفير (15 دقيقة)", "1. يصف ما يحدث للصدر والرئتين أثناء الشهيق والزفير. ← فهم\n2. يتتبع مسار الهواء من الأنف أو الفم عبر القصبة الهوائية إلى الرئتين. ← تذكر\nالمخرج الآخر: يوضح أننا نأخذ الأكسجين في الشهيق ونتخلص من ثاني أكسيد الكربون في الزفير. ← فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: بالون لكل طالب", "- الرئتان\n- الشهيق\n- الزفير\n- القصبة الهوائية\n- الحجاب الحاجز", "يسأل المعلم: ما الشيء الذي تفعله 15–20 مرة في الدقيقة دون أن تفكر فيه؟ ويستمع للإجابات حتى يصل إلى «التنفس». (5 دقائق)", "1. نشاط 1-4: استقصاء التنفس: يوضح المعلم وضع اليدين على القفص الصدري، ويطلب شهيقًا عميقًا ثم زفيرًا، ثم نفخ بالون (بالون لكل طالب دون مشاركة)، والطلبة يصفون اتساع الصدر وانكماشه، ويلاحظون انتفاخ البالون بهواء الزفير (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مسار الهواء: يعرض المعلم نموذجًا/مقطعًا للجهاز التنفسي وشكل ص 25، ويتتبع: الأنف/الفم ← القصبة الهوائية ← الرئتان، ودور الحجاب الحاجز، والطلبة يرسمون مخططًا سهميًا لمسار الهواء ويكتبون أسماء الأجزاء (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أسئلة الكتاب 1–3: يناقش المعلم الأسئلة 1–3 ص 24 ويصحح المفهوم الخاطئ: الرئتان إسفنجيتان وليستا كيسين مجوفين، والطلبة يجيبون ويناقشون الفرق بين البالون والرئة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث لحجم الصدر عند الشهيق؟\n   الإجابة النموذجية: يكبر لأن الرئتين تمتلئان بالهواء.\n2. [مستوى التطبيق] رتب مسار الهواء: الرئتان، الأنف، القصبة الهوائية.\n   الإجابة النموذجية: الأنف ← القصبة الهوائية ← الرئتان.\n3. [مستوى الاستدلال] لماذا لا يُعدّ البالون تمثيلًا دقيقًا تمامًا للرئة؟\n   الإجابة النموذجية: لأن الرئة ليست كيسًا مجوفًا بل نسيج إسفنجي من حويصلات هوائية صغيرة كثيرة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغاز الذي نحصل عليه في الشهيق؟\n   الإجابة النموذجية: الأكسجين.\n2. [مستوى التطبيق] اشرح كيف نفخت البالون.\n   الإجابة النموذجية: أخرجت هواء الزفير من رئتيّ فدخل البالون فزاد حجمه وانتفخ.\n3. [مستوى الاستدلال] ماذا يحدث للأكسجين بعد دخوله الرئتين؟\n   الإجابة النموذجية: ينتقل إلى الدم فيحمله إلى القلب ثم إلى باقي أجزاء الجسم.", "للطالب: قراءة كتاب الطالب ص 24–25 ورسم مسار الهواء في الدفتر. لولي الأمر: يُرجى توعية الابن بأضرار التدخين على الرئتين ومراعاة من يعاني من الربو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=4"]}, {"h": {"lesson": "1-4 الرئتان والتنفس", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 24–25 | كتاب النشاط ص 19، 57–58 | دليل المعلم ص 33–34", "num": "الحصة الثانية من 2", "focus": "معدل التنفس وأثر ممارسة الرياضة عليه"}, "f": ["1. يقيس معدل التنفس قبل التمرين وبعده ويسجل النتائج (15 دقيقة)\n2. يفسر زيادة معدل التنفس عند ممارسة الرياضة (10 دقائق)\nمخرج تعليمي آخر: يقترح عاملًا آخر يؤثر في معدل التنفس مثل اللياقة البدنية (15 دقيقة)", "1. يقيس معدل التنفس قبل التمرين وبعده ويسجل النتائج. ← تطبيق\n2. يفسر زيادة معدل التنفس عند ممارسة الرياضة. ← فهم\nالمخرج الآخر: يقترح عاملًا آخر يؤثر في معدل التنفس مثل اللياقة البدنية. ← تحليل", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- الأقلام\n- السبورة التقليدية\n- أخرى: ساعة إيقاف، ورقة العمل 1-4", "- معدل التنفس\n- التمثيل الخطي\n- اللياقة البدنية\n- تبادل الغازات", "يطلب المعلم من الطلبة تذكّر ما حدث لنبضهم بعد الجري، ويسأل: هل يتغير تنفسنا أيضًا؟ كيف يمكن أن نقيس ذلك؟ (5 دقائق)", "1. ورقة العمل 1-4: استقصاء معدل التنفس: ينظم ثنائيات، ويوجه عدّ مرات التنفس في الدقيقة بمراقبة صعود الصدر وهبوطه، قبل التمرين وبعده وعلى فترات، والطلبة يقيسون ويسجلون النتائج في جدول (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التمثيل الخطي: يوجه المعلم رسم التمثيل الخطي لمعدل التنفس مع الزمن ويقدم الدعم للمتعثرين بالتعاون مع زملائهم، والطلبة يرسمون ويحددون أعلى وأدنى معدل (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 1-4 والسؤال 4: يوجه المعلم تمرين 1-4 (كتاب النشاط ص 19: رسم الرئتين ومسار الهواء) ومناقشة السؤال 4 ص 24، والطلبة يرسمون ويكتبون الأسماء ويفسرون سرعة التنفس (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – أنفاس الجبل الأخضر: تتتبع المجموعات مسار الهواء من الأنف إلى الرئتين، وتناقش لماذا يشعر الناس بانتعاش في هواء الجبل الأخضر النقي، وأهمية حماية الهواء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] كيف تعدّ أنفاس زميلك في الدقيقة؟\n   الإجابة النموذجية: بمراقبة صعود صدره وهبوطه وعدّ المرات خلال دقيقة بساعة إيقاف.\n2. [مستوى التطبيق] متى كان معدل التنفس في أعلى مستوى في جدولك؟\n   الإجابة النموذجية: بعد التمرين مباشرة (والإجابة تعتمد على بيانات الطالب).\n3. [مستوى الاستدلال] لماذا لا يزيد معدل تنفس الرياضي كثيرًا عند التمرين مقارنة بغيره؟\n   الإجابة النموذجية: لأن قلبه ورئتيه أكثر كفاءة في إيصال الأكسجين إلى العضلات فيحتاج أنفاسًا أقل.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نتنفس أسرع عند ممارسة الرياضة؟\n   الإجابة النموذجية: لأن الجسم يحتاج إلى مزيد من الأكسجين للعضلات.\n2. [مستوى التطبيق] ما الجهاز الذي يتعاون مع الجهاز التنفسي لإيصال الأكسجين؟\n   الإجابة النموذجية: الجهاز الدوري.\n3. [مستوى الاستدلال] صمّم طريقة لمقارنة معدل التنفس لدى شخصين مختلفين في اللياقة بشكل عادل.\n   الإجابة النموذجية: يمارسان التمرين نفسه للمدة نفسها، ويقاس تنفسهما بالطريقة نفسها قبل التمرين وبعده مباشرة.", "للطالب: حل تمرين 1-4 (كتاب النشاط ص 19) وإكمال ورقة العمل 1-4 (ص 57–58). لولي الأمر: يُرجى تشجيع الابن على ممارسة نشاط بدني منتظم للمحافظة على لياقة القلب والرئتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=4"]}], "comb": ["الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n1. يصف ما يحدث للصدر والرئتين أثناء الشهيق والزفير (15 دقيقة)\n2. يتتبع مسار الهواء من الأنف أو الفم عبر القصبة الهوائية إلى الرئتين (10 دقائق)\nمخرج تعليمي آخر: يوضح أننا نأخذ الأكسجين في الشهيق ونتخلص من ثاني أكسيد الكربون في الزفير (15 دقيقة)\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n1. يقيس معدل التنفس قبل التمرين وبعده ويسجل النتائج (15 دقيقة)\n2. يفسر زيادة معدل التنفس عند ممارسة الرياضة (10 دقائق)\nمخرج تعليمي آخر: يقترح عاملًا آخر يؤثر في معدل التنفس مثل اللياقة البدنية (15 دقيقة)", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n1. يصف ما يحدث للصدر والرئتين أثناء الشهيق والزفير. ← فهم\n2. يتتبع مسار الهواء من الأنف أو الفم عبر القصبة الهوائية إلى الرئتين. ← تذكر\nالمخرج الآخر: يوضح أننا نأخذ الأكسجين في الشهيق ونتخلص من ثاني أكسيد الكربون في الزفير. ← فهم\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n1. يقيس معدل التنفس قبل التمرين وبعده ويسجل النتائج. ← تطبيق\n2. يفسر زيادة معدل التنفس عند ممارسة الرياضة. ← فهم\nالمخرج الآخر: يقترح عاملًا آخر يؤثر في معدل التنفس مثل اللياقة البدنية. ← تحليل", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: بالون لكل طالب\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- الكتاب\n- الأقلام\n- السبورة التقليدية\n- أخرى: ساعة إيقاف، ورقة العمل 1-4", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- الرئتان\n- الشهيق\n- الزفير\n- القصبة الهوائية\n- الحجاب الحاجز\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- معدل التنفس\n- التمثيل الخطي\n- اللياقة البدنية\n- تبادل الغازات", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nيسأل المعلم: ما الشيء الذي تفعله 15–20 مرة في الدقيقة دون أن تفكر فيه؟ ويستمع للإجابات حتى يصل إلى «التنفس». (5 دقائق)\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nيطلب المعلم من الطلبة تذكّر ما حدث لنبضهم بعد الجري، ويسأل: هل يتغير تنفسنا أيضًا؟ كيف يمكن أن نقيس ذلك؟ (5 دقائق)", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين — زمن الحصة 40 دقيقة\n\n1. نشاط 1-4: استقصاء التنفس: يوضح المعلم وضع اليدين على القفص الصدري، ويطلب شهيقًا عميقًا ثم زفيرًا، ثم نفخ بالون (بالون لكل طالب دون مشاركة)، والطلبة يصفون اتساع الصدر وانكماشه، ويلاحظون انتفاخ البالون بهواء الزفير (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مسار الهواء: يعرض المعلم نموذجًا/مقطعًا للجهاز التنفسي وشكل ص 25، ويتتبع: الأنف/الفم ← القصبة الهوائية ← الرئتان، ودور الحجاب الحاجز، والطلبة يرسمون مخططًا سهميًا لمسار الهواء ويكتبون أسماء الأجزاء (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أسئلة الكتاب 1–3: يناقش المعلم الأسئلة 1–3 ص 24 ويصحح المفهوم الخاطئ: الرئتان إسفنجيتان وليستا كيسين مجوفين، والطلبة يجيبون ويناقشون الفرق بين البالون والرئة (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 1-4: استقصاء معدل التنفس: ينظم ثنائيات، ويوجه عدّ مرات التنفس في الدقيقة بمراقبة صعود الصدر وهبوطه، قبل التمرين وبعده وعلى فترات، والطلبة يقيسون ويسجلون النتائج في جدول (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التمثيل الخطي: يوجه المعلم رسم التمثيل الخطي لمعدل التنفس مع الزمن ويقدم الدعم للمتعثرين بالتعاون مع زملائهم، والطلبة يرسمون ويحددون أعلى وأدنى معدل (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 1-4 والسؤال 4: يوجه المعلم تمرين 1-4 (كتاب النشاط ص 19: رسم الرئتين ومسار الهواء) ومناقشة السؤال 4 ص 24، والطلبة يرسمون ويكتبون الأسماء ويفسرون سرعة التنفس (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – أنفاس الجبل الأخضر: تتتبع المجموعات مسار الهواء من الأنف إلى الرئتين، وتناقش لماذا يشعر الناس بانتعاش في هواء الجبل الأخضر النقي، وأهمية حماية الهواء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث لحجم الصدر عند الشهيق؟\n   الإجابة النموذجية: يكبر لأن الرئتين تمتلئان بالهواء.\n2. [مستوى التطبيق] رتب مسار الهواء: الرئتان، الأنف، القصبة الهوائية.\n   الإجابة النموذجية: الأنف ← القصبة الهوائية ← الرئتان.\n3. [مستوى الاستدلال] لماذا لا يُعدّ البالون تمثيلًا دقيقًا تمامًا للرئة؟\n   الإجابة النموذجية: لأن الرئة ليست كيسًا مجوفًا بل نسيج إسفنجي من حويصلات هوائية صغيرة كثيرة.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] كيف تعدّ أنفاس زميلك في الدقيقة؟\n   الإجابة النموذجية: بمراقبة صعود صدره وهبوطه وعدّ المرات خلال دقيقة بساعة إيقاف.\n2. [مستوى التطبيق] متى كان معدل التنفس في أعلى مستوى في جدولك؟\n   الإجابة النموذجية: بعد التمرين مباشرة (والإجابة تعتمد على بيانات الطالب).\n3. [مستوى الاستدلال] لماذا لا يزيد معدل تنفس الرياضي كثيرًا عند التمرين مقارنة بغيره؟\n   الإجابة النموذجية: لأن قلبه ورئتيه أكثر كفاءة في إيصال الأكسجين إلى العضلات فيحتاج أنفاسًا أقل.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغاز الذي نحصل عليه في الشهيق؟\n   الإجابة النموذجية: الأكسجين.\n2. [مستوى التطبيق] اشرح كيف نفخت البالون.\n   الإجابة النموذجية: أخرجت هواء الزفير من رئتيّ فدخل البالون فزاد حجمه وانتفخ.\n3. [مستوى الاستدلال] ماذا يحدث للأكسجين بعد دخوله الرئتين؟\n   الإجابة النموذجية: ينتقل إلى الدم فيحمله إلى القلب ثم إلى باقي أجزاء الجسم.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نتنفس أسرع عند ممارسة الرياضة؟\n   الإجابة النموذجية: لأن الجسم يحتاج إلى مزيد من الأكسجين للعضلات.\n2. [مستوى التطبيق] ما الجهاز الذي يتعاون مع الجهاز التنفسي لإيصال الأكسجين؟\n   الإجابة النموذجية: الجهاز الدوري.\n3. [مستوى الاستدلال] صمّم طريقة لمقارنة معدل التنفس لدى شخصين مختلفين في اللياقة بشكل عادل.\n   الإجابة النموذجية: يمارسان التمرين نفسه للمدة نفسها، ويقاس تنفسهما بالطريقة نفسها قبل التمرين وبعده مباشرة.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nللطالب: قراءة كتاب الطالب ص 24–25 ورسم مسار الهواء في الدفتر. لولي الأمر: يُرجى توعية الابن بأضرار التدخين على الرئتين ومراعاة من يعاني من الربو.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nللطالب: حل تمرين 1-4 (كتاب النشاط ص 19) وإكمال ورقة العمل 1-4 (ص 57–58). لولي الأمر: يُرجى تشجيع الابن على ممارسة نشاط بدني منتظم للمحافظة على لياقة القلب والرئتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=4"]}, {"id": "1-5", "title": "الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | كتاب النشاط ص 20، 47، 59 | دليل المعلم ص 34–37", "n": 3, "per": [{"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | دليل المعلم ص 34–36", "num": "الحصة الأولى من 3", "focus": "حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية"}, "f": ["1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه (5 دقائق)\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها (15 دقيقة)\nمخرج تعليمي آخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم (20 دقيقة)", "1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه. ← فهم\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها. ← تذكر\nالمخرج الآخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم. ← فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- العصف الذهني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: بكرة خيط بطول 7 أمتار", "- الهضم\n- الجهاز الهضمي\n- المريء\n- المعدة\n- الأمعاء", "يسأل المعلم: ماذا أكلت اليوم؟ ولماذا نأكل؟ ثم: هل يستطيع الجسم استخدام قطعة الخبز كما هي؟ (5 دقائق)", "1. رحلة الطعام: يعرض المعلم الشكل ص 27 ويشرح: المضغ واللعاب في الفم، المريء، المعدة والعصارة الهضمية، الأمعاء، الإخراج، والطلبة يتتبعون الرحلة بأصابعهم على الشكل ويكتبون الترتيب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. طول الأمعاء الدقيقة: يفرد المعلم خيطًا بطول 7 أمتار تقريبًا في الصف ثم يطويه، ويسأل: كيف تتسع له البطن؟ والطلبة يقيسون بخطواتهم ويستنتجون أن الأمعاء مطوية (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. ملخص مصوّر: يطلب المعلم رسم مخطط سهمي لمسار الطعام، ويقدم الاختصار المساعد للمتعثرين (فم – مريء – معدة – أمعاء)، والطلبة يرسمون المخطط ويضيفون اسمًا لكل جزء (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج جسمنا إلى الطعام؟\n   الإجابة النموذجية: للنمو والحصول على الطاقة ليعمل بصورة جيدة.\n2. [مستوى التطبيق] ما الجزء الذي يدفع الطعام من الفم إلى المعدة؟\n   الإجابة النموذجية: المريء.\n3. [مستوى الاستدلال] لماذا يجب هضم الطعام قبل أن يستفيد منه الجسم؟\n   الإجابة النموذجية: لأن الجسم لا يستطيع استخدام الطعام بحالته، فيجب تفتيته إلى جزيئات صغيرة يمكن نقلها في الدم.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتّب: الأمعاء – الفم – المعدة – المريء.\n   الإجابة النموذجية: الفم ← المريء ← المعدة ← الأمعاء.\n2. [مستوى التطبيق] ما العضوان الرئيسيان في هضم الطعام؟\n   الإجابة النموذجية: المعدة والأمعاء.\n3. [مستوى الاستدلال] لماذا تكون الأمعاء الدقيقة مطوية داخل البطن؟\n   الإجابة النموذجية: لأن طولها كبير (نحو 7 أمتار عند البالغ) فتُطوى لتتسع لها البطن.", "للطالب: قراءة كتاب الطالب ص 26–27 وكتابة ما أكله في يوم كامل. لولي الأمر: يُرجى تشجيع الابن على مضغ الطعام جيدًا وتناول وجبات متوازنة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | كتاب النشاط ص 20، 47 | دليل المعلم ص 36–37", "num": "الحصة الثانية من 3", "focus": "وظائف أجزاء الجهاز الهضمي"}, "f": ["1. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته (20 دقيقة)\n2. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة (5 دقائق)\nمخرج تعليمي آخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال (15 دقيقة)", "1. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته. ← فهم\n2. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة. ← إبداع\nالمخرج الآخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال. ← تحليل", "- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم المبني على المشاريع", "- الكتاب\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: بطاقات ورقة المصادر 1-5، أنابيب وزجاجات وأكياس بلاستيكية لصنع النموذج", "- الفم\n- المريء\n- المعدة\n- العصارة الهضمية\n- الأمعاء الدقيقة\n- الأمعاء الغليظة", "يعرض المعلم صورة طعام أطفال مهروس ويسأل: لماذا يأكل الرضّع طعامًا مهروسًا بينما نأكل التفاح والجزر؟ (5 دقائق)", "1. لعبة مطابقة البطاقات: يوزّع المعلم بطاقات ورقة المصادر 1-5 (كتاب النشاط ص 47): صور الأجزاء وأسماؤها ووظائفها مع بطاقات مضلِّلة، وتطابق المجموعات الصورة والاسم والوظيفة، ثم تتحقق مجموعة أخرى (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. بناء نموذج الجهاز الهضمي: يوجّه المجموعات لصنع نموذج من زجاجة (معدة) وأنبوب (مريء) وأنبوب طويل ملفوف (أمعاء)، والطلبة يبنون النموذج ويعلّقون بطاقة وظيفة على كل جزء (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أسئلة الكتاب وتمرين 1-5: يناقش المعلم الأسئلة 1–5 ص 26 ويوجه تمرين 1-5 (كتاب النشاط ص 20)، والطلبة يجيبون ويرتبون الوظائف ترتيبًا صحيحًا (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما وظيفة المعدة؟\n   الإجابة النموذجية: تمزج الطعام بالعصارة الهضمية فيصبح سائلًا سميكًا يشبه العصيدة.\n2. [مستوى التطبيق] ماذا يحدث للطعام داخل الأمعاء الدقيقة؟\n   الإجابة النموذجية: يُفتت إلى جزيئات أصغر تنتقل إلى الدم.\n3. [مستوى الاستدلال] بماذا يرتبط المريء؟ وبماذا ترتبط القصبة الهوائية؟\n   الإجابة النموذجية: المريء يرتبط بالمعدة، والقصبة الهوائية ترتبط بالرئتين.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما دور الأسنان في الهضم؟\n   الإجابة النموذجية: تمضغ الطعام وتفتته إلى قطع صغيرة يسهل ابتلاعها.\n2. [مستوى التطبيق] كيف يصل الطعام المهضوم إلى أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الدم.\n3. [مستوى الاستدلال] أي أجزاء نموذجك يمثل المعدة؟ وما الذي ينقص النموذج ليشبه الجهاز الحقيقي؟\n   الإجابة النموذجية: الزجاجة؛ ينقصه مثلًا العصارة الهضمية وحركة العضلات (تقبل الإجابات المنطقية).", "للطالب: حل تمرين 1-5 في كتاب النشاط ص 20 واجبًا منزليًا، ومراجعة ص 27. لولي الأمر: يُرجى تشجيع الابن على شرب الماء وتناول الأطعمة الغنية بالألياف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 27 | كتاب النشاط ص 59 | دليل المعلم ص 36–37", "num": "الحصة الثالثة من 3", "focus": "استقصاء: يبدأ هضم النشا في الفم"}, "f": ["1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان (15 دقيقة)\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم (5 دقائق)\nمخرج تعليمي آخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا (20 دقيقة)", "1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان. ← تطبيق\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم. ← تحليل\nالمخرج الآخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا. ← تقييم", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: ورقة العمل 1-5، خبز، نشا الذرة، محلول اليود، قطارة، طبقان", "- النشا\n- اختبار النشا\n- محلول اليود\n- اللعاب\n- الاستنتاج", "يعرض المعلم نشا الذرة ويضيف إليه قطرة يود فيتحول إلى أزرق داكن، ويسأل: ماذا يعني هذا اللون؟ هل يوجد نشا في الخبز؟ (5 دقائق)", "1. اختبار الخبز (ورقة العمل 1-5): يوزع المعلم على المجموعات قطعة خبز في طبق وقطارة يود، والطلبة يضيفون قطرة يود ويلاحظون اللون الأزرق الداكن: يوجد نشا (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أثر المضغ: يطلب المعلم من كل طالب مضغ قطعة خبز نظيفة غير مخصصة للاختبار نحو دقيقة، ويعرض نتيجة عينة مُعدّة مسبقًا لخبز مُعرَّض للعاب، والطلبة يلاحظون تحول الطعم إلى حلو، ويقارنون عدم تغير لون اليود في العينة المعالجة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستنتاج والعادات الصحية: يقود المعلم الاستنتاج: النشا يُهضم في الفم ويتحول إلى سكر؛ ويناقش الألياف والماء والرياضة، والطلبة يكتبون الاستنتاج في ورقة العمل ويقترحون عادات صحية (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – رحلة صحن الهريس: تتتبع المجموعات رحلة لقمة من طبق الهريس العماني في القناة الهضمية بالترتيب، ويمثل كل طفل عضوًا منها (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما لون محلول اليود عند وجود النشا؟\n   الإجابة النموذجية: أزرق داكن.\n2. [مستوى التطبيق] لماذا أصبح طعم الخبز حلوًا بعد المضغ؟\n   الإجابة النموذجية: لأن اللعاب يبدأ هضم النشا فيحوّل جزءًا منه إلى سكر.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق أي مادة في المختبر؟\n   الإجابة النموذجية: لأن بعض المواد مثل اليود ضارة، والسلامة تقتضي عدم تذوق أو ابتلاع المواد المستخدمة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نستنتج من عدم تغير لون اليود في عينة الخبز الممضوغ جيدًا؟\n   الإجابة النموذجية: أن النشا هُضم (تحول إلى سكر) في الفم.\n2. [مستوى التطبيق] ما المادة في الفم التي تساعد على بدء الهضم؟\n   الإجابة النموذجية: اللعاب (العصارة الهضمية في اللعاب).\n3. [مستوى الاستدلال] اقترح ثلاث عادات تساعد جهازك الهضمي.\n   الإجابة النموذجية: مضغ الطعام جيدًا، شرب الماء، تناول الألياف كالفواكه والخضراوات، وممارسة الرياضة.", "للطالب: إكمال إجابات ورقة العمل 1-5 (كتاب النشاط ص 59) ومراجعة الدرس كاملًا. لولي الأمر: يُرجى مساعدة الابن على اختيار أطعمة صحية والإقلال من المشروبات الغازية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}], "comb": ["الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه (5 دقائق)\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها (15 دقيقة)\nمخرج تعليمي آخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم (20 دقيقة)\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\n1. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته (20 دقيقة)\n2. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة (5 دقائق)\nمخرج تعليمي آخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال (15 دقيقة)\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\n1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان (15 دقيقة)\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم (5 دقائق)\nمخرج تعليمي آخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا (20 دقيقة)", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه. ← فهم\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها. ← تذكر\nالمخرج الآخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم. ← فهم\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\n1. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته. ← فهم\n2. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة. ← إبداع\nالمخرج الآخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال. ← تحليل\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\n1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان. ← تطبيق\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم. ← تحليل\nالمخرج الآخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا. ← تقييم", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- العصف الذهني\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم المبني على المشاريع\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: بكرة خيط بطول 7 أمتار\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\n- الكتاب\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: بطاقات ورقة المصادر 1-5، أنابيب وزجاجات وأكياس بلاستيكية لصنع النموذج\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\n- الكتاب\n- السبورة التقليدية\n- أخرى: ورقة العمل 1-5، خبز، نشا الذرة، محلول اليود، قطارة، طبقان", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- الهضم\n- الجهاز الهضمي\n- المريء\n- المعدة\n- الأمعاء\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\n- الفم\n- المريء\n- المعدة\n- العصارة الهضمية\n- الأمعاء الدقيقة\n- الأمعاء الغليظة\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\n- النشا\n- اختبار النشا\n- محلول اليود\n- اللعاب\n- الاستنتاج", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nيسأل المعلم: ماذا أكلت اليوم؟ ولماذا نأكل؟ ثم: هل يستطيع الجسم استخدام قطعة الخبز كما هي؟ (5 دقائق)\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\nيعرض المعلم صورة طعام أطفال مهروس ويسأل: لماذا يأكل الرضّع طعامًا مهروسًا بينما نأكل التفاح والجزر؟ (5 دقائق)\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\nيعرض المعلم نشا الذرة ويضيف إليه قطرة يود فيتحول إلى أزرق داكن، ويسأل: ماذا يعني هذا اللون؟ هل يوجد نشا في الخبز؟ (5 دقائق)", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية — زمن الحصة 40 دقيقة\n\n1. رحلة الطعام: يعرض المعلم الشكل ص 27 ويشرح: المضغ واللعاب في الفم، المريء، المعدة والعصارة الهضمية، الأمعاء، الإخراج، والطلبة يتتبعون الرحلة بأصابعهم على الشكل ويكتبون الترتيب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. طول الأمعاء الدقيقة: يفرد المعلم خيطًا بطول 7 أمتار تقريبًا في الصف ثم يطويه، ويسأل: كيف تتسع له البطن؟ والطلبة يقيسون بخطواتهم ويستنتجون أن الأمعاء مطوية (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. ملخص مصوّر: يطلب المعلم رسم مخطط سهمي لمسار الطعام، ويقدم الاختصار المساعد للمتعثرين (فم – مريء – معدة – أمعاء)، والطلبة يرسمون المخطط ويضيفون اسمًا لكل جزء (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي — زمن الحصة 40 دقيقة\n\n1. لعبة مطابقة البطاقات: يوزّع المعلم بطاقات ورقة المصادر 1-5 (كتاب النشاط ص 47): صور الأجزاء وأسماؤها ووظائفها مع بطاقات مضلِّلة، وتطابق المجموعات الصورة والاسم والوظيفة، ثم تتحقق مجموعة أخرى (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. بناء نموذج الجهاز الهضمي: يوجّه المجموعات لصنع نموذج من زجاجة (معدة) وأنبوب (مريء) وأنبوب طويل ملفوف (أمعاء)، والطلبة يبنون النموذج ويعلّقون بطاقة وظيفة على كل جزء (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. أسئلة الكتاب وتمرين 1-5: يناقش المعلم الأسئلة 1–5 ص 26 ويوجه تمرين 1-5 (كتاب النشاط ص 20)، والطلبة يجيبون ويرتبون الوظائف ترتيبًا صحيحًا (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم — زمن الحصة 40 دقيقة\n\n1. اختبار الخبز (ورقة العمل 1-5): يوزع المعلم على المجموعات قطعة خبز في طبق وقطارة يود، والطلبة يضيفون قطرة يود ويلاحظون اللون الأزرق الداكن: يوجد نشا (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أثر المضغ: يطلب المعلم من كل طالب مضغ قطعة خبز نظيفة غير مخصصة للاختبار نحو دقيقة، ويعرض نتيجة عينة مُعدّة مسبقًا لخبز مُعرَّض للعاب، والطلبة يلاحظون تحول الطعم إلى حلو، ويقارنون عدم تغير لون اليود في العينة المعالجة (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. الاستنتاج والعادات الصحية: يقود المعلم الاستنتاج: النشا يُهضم في الفم ويتحول إلى سكر؛ ويناقش الألياف والماء والرياضة، والطلبة يكتبون الاستنتاج في ورقة العمل ويقترحون عادات صحية (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – رحلة صحن الهريس: تتتبع المجموعات رحلة لقمة من طبق الهريس العماني في القناة الهضمية بالترتيب، ويمثل كل طفل عضوًا منها (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج جسمنا إلى الطعام؟\n   الإجابة النموذجية: للنمو والحصول على الطاقة ليعمل بصورة جيدة.\n2. [مستوى التطبيق] ما الجزء الذي يدفع الطعام من الفم إلى المعدة؟\n   الإجابة النموذجية: المريء.\n3. [مستوى الاستدلال] لماذا يجب هضم الطعام قبل أن يستفيد منه الجسم؟\n   الإجابة النموذجية: لأن الجسم لا يستطيع استخدام الطعام بحالته، فيجب تفتيته إلى جزيئات صغيرة يمكن نقلها في الدم.\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما وظيفة المعدة؟\n   الإجابة النموذجية: تمزج الطعام بالعصارة الهضمية فيصبح سائلًا سميكًا يشبه العصيدة.\n2. [مستوى التطبيق] ماذا يحدث للطعام داخل الأمعاء الدقيقة؟\n   الإجابة النموذجية: يُفتت إلى جزيئات أصغر تنتقل إلى الدم.\n3. [مستوى الاستدلال] بماذا يرتبط المريء؟ وبماذا ترتبط القصبة الهوائية؟\n   الإجابة النموذجية: المريء يرتبط بالمعدة، والقصبة الهوائية ترتبط بالرئتين.\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما لون محلول اليود عند وجود النشا؟\n   الإجابة النموذجية: أزرق داكن.\n2. [مستوى التطبيق] لماذا أصبح طعم الخبز حلوًا بعد المضغ؟\n   الإجابة النموذجية: لأن اللعاب يبدأ هضم النشا فيحوّل جزءًا منه إلى سكر.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق أي مادة في المختبر؟\n   الإجابة النموذجية: لأن بعض المواد مثل اليود ضارة، والسلامة تقتضي عدم تذوق أو ابتلاع المواد المستخدمة.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتّب: الأمعاء – الفم – المعدة – المريء.\n   الإجابة النموذجية: الفم ← المريء ← المعدة ← الأمعاء.\n2. [مستوى التطبيق] ما العضوان الرئيسيان في هضم الطعام؟\n   الإجابة النموذجية: المعدة والأمعاء.\n3. [مستوى الاستدلال] لماذا تكون الأمعاء الدقيقة مطوية داخل البطن؟\n   الإجابة النموذجية: لأن طولها كبير (نحو 7 أمتار عند البالغ) فتُطوى لتتسع لها البطن.\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما دور الأسنان في الهضم؟\n   الإجابة النموذجية: تمضغ الطعام وتفتته إلى قطع صغيرة يسهل ابتلاعها.\n2. [مستوى التطبيق] كيف يصل الطعام المهضوم إلى أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الدم.\n3. [مستوى الاستدلال] أي أجزاء نموذجك يمثل المعدة؟ وما الذي ينقص النموذج ليشبه الجهاز الحقيقي؟\n   الإجابة النموذجية: الزجاجة؛ ينقصه مثلًا العصارة الهضمية وحركة العضلات (تقبل الإجابات المنطقية).\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نستنتج من عدم تغير لون اليود في عينة الخبز الممضوغ جيدًا؟\n   الإجابة النموذجية: أن النشا هُضم (تحول إلى سكر) في الفم.\n2. [مستوى التطبيق] ما المادة في الفم التي تساعد على بدء الهضم؟\n   الإجابة النموذجية: اللعاب (العصارة الهضمية في اللعاب).\n3. [مستوى الاستدلال] اقترح ثلاث عادات تساعد جهازك الهضمي.\n   الإجابة النموذجية: مضغ الطعام جيدًا، شرب الماء، تناول الألياف كالفواكه والخضراوات، وممارسة الرياضة.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nللطالب: قراءة كتاب الطالب ص 26–27 وكتابة ما أكله في يوم كامل. لولي الأمر: يُرجى تشجيع الابن على مضغ الطعام جيدًا وتناول وجبات متوازنة.\n\nالحصة 2: وظائف أجزاء الجهاز الهضمي\nللطالب: حل تمرين 1-5 في كتاب النشاط ص 20 واجبًا منزليًا، ومراجعة ص 27. لولي الأمر: يُرجى تشجيع الابن على شرب الماء وتناول الأطعمة الغنية بالألياف.\n\nالحصة 3: استقصاء: يبدأ هضم النشا في الفم\nللطالب: إكمال إجابات ورقة العمل 1-5 (كتاب النشاط ص 59) ومراجعة الدرس كاملًا. لولي الأمر: يُرجى مساعدة الابن على اختيار أطعمة صحية والإقلال من المشروبات الغازية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"id": "1-6", "title": "ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 28–29 | كتاب النشاط ص 21، 60 | دليل المعلم ص 37–38", "n": 2, "per": [{"h": {"lesson": "1-6 ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 28–29 | دليل المعلم ص 37–38", "num": "الحصة الأولى من 2", "focus": "الكليتان: موقعهما وشكلهما ووظيفة الإخراج"}, "f": ["1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما (10 دقائق)\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول (10 دقائق)\nمخرج تعليمي آخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج (20 دقيقة)", "1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما. ← تذكر\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول. ← فهم\nالمخرج الآخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج. ← تطبيق", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: وعاء كبير، مخبار مدرج، ماء، حبة فاصوليا للتشبيه", "- الكليتان\n- الإخراج\n- البول\n- الفضلات\n- تنقية الدم", "يسأل المعلم: ماذا يحدث عندما تشرب كمية كبيرة من الماء؟ لماذا تحتاج إلى دورة المياه؟ من المسؤول عن ذلك في جسمك؟ (5 دقائق)", "1. تحديد موقع الكليتين: يوضح المعلم الطريقة ص 28: اليدان على الوركين والإبهامان على الظهر ثم التحريك للأعلى حتى الضلوع؛ ويعرض حبة فاصوليا للتشبيه، والطلبة يحددون موقع الكليتين على أجسامهم ويصفون الشكل والحجم (بحجم فأرة الحاسوب) (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. وظيفة الإخراج: يشرح المعلم: يمر الدم عبر الكليتين نحو 40 مرة يوميًا لتنقيته ويُنتج نحو لتر من البول؛ ويصحح المفهوم الخاطئ أن ماء البول يأتي مباشرة مما نشربه، والطلبة يرسمو
