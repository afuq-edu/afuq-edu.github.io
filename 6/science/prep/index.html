ن مخططًا: دم بفضلات ← الكليتان ← دم نقي + بول (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 1-6: كم يبلغ اللتر؟: يوجه المجموعات لسكب ما يقدرونه لترًا في وعاء ثم قياسه بالمخبار المدرج وجمع القياسات، والطلبة يقدّرون ويقيسون ويسجلون الفرق بين التقدير والقياس (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين توجد الكليتان؟\n   الإجابة النموذجية: في الجزء الخلفي من الجسم، أسفل الضلوع قليلًا.\n2. [مستوى التطبيق] ما اسم السائل الذي تخرج فيه الفضلات من الكليتين؟\n   الإجابة النموذجية: البول.\n3. [مستوى الاستدلال] من أين يأتي الماء الموجود في البول؟\n   الإجابة النموذجية: من الدم؛ إذ يمر الماء من الجهاز الهضمي إلى الدم ثم تأخذ الكليتان الماء الزائد منه.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العملية الرئيسية التي تقوم بها الكليتان؟\n   الإجابة النموذجية: الإخراج.\n2. [مستوى التطبيق] صف شكل الكليتين وحجمهما.\n   الإجابة النموذجية: زوج من الأعضاء على شكل حبة الفاصوليا، بحجم فأرة الحاسوب تقريبًا لدى البالغ.\n3. [مستوى الاستدلال] كيف تحققت من تقديرك لكمية لتر الماء؟\n   الإجابة النموذجية: بقياس الماء بالمخبار المدرج وجمع القياسات ومقارنتها بلتر.", "للطالب: قراءة كتاب الطالب ص 28 وحل تمرين 1-6 في كتاب النشاط ص 21 واجبًا منزليًا. لولي الأمر: يُرجى تذكير الابن بشرب كمية كافية من الماء يوميًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}, {"h": {"lesson": "1-6 ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 29 | كتاب النشاط ص 21، 60 | دليل المعلم ص 38", "num": "الحصة الثانية من 2", "focus": "صحة الكليتين وأهمية شرب الماء"}, "f": ["1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل (10 دقائق)\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد (10 دقائق)\nمخرج تعليمي آخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها (20 دقيقة)", "1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل. ← تذكر\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد. ← تحليل\nالمخرج الآخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها. ← تقييم", "- فكّر – زاوج – شارك\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقة العمل 1-6", "- غسيل الكلى\n- زراعة الكلى\n- التعرق\n- السوائل\n- المرض", "يسأل المعلم: ماذا يحدث لجسمك في يوم حار جدًا؟ ويكتب الأفكار على السبورة حتى يصل إلى «التعرق». (5 دقائق)", "1. عندما تتوقف الكليتان: يشرح المعلم ص 29: إزالة كلية والعيش بواحدة سليمة، غسيل الكلى (ساعات لعدة أيام أسبوعيًا)، زراعة الكلى، والطلبة يطرحون أسئلة ويجيبون عن السؤالين 3 و4 ص 29 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تحدّث عن: الطقس الحار: يقود المعلم نقاش «فكر – زاوج – شارك»: إذا فقدنا ماءً بالتعرق، فماذا يبقى لتكوين البول؟ والطلبة يستنتجون أن البول يقل في الطقس الحار (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. ورقة العمل 1-6: من أين تحصل على السوائل؟: يوجه المعلم إعداد قائمة بالسوائل خلال 24 ساعة وكمياتها، والأطعمة الرطبة، والطلبة يحسبون ما يشربون ويقيّمون: هل يكفي؟ (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – ماء الجحلة والكليتين: تناقش الأزواج دور الكليتين في تنقية الدم وأهمية شرب الماء الكافي في صيف عمان الحار، وتتذكر الجحلة الفخارية لتبريد الماء (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بغسيل الكلى؟\n   الإجابة النموذجية: استخدام جهاز يقوم بعمل الكليتين لتصفية الدم وتنظيفه.\n2. [مستوى التطبيق] لماذا يستطيع الإنسان العيش بكلية واحدة؟\n   الإجابة النموذجية: لأن الكلية الواحدة السليمة تستطيع القيام بعمل التنقية الكافي للجسم.\n3. [مستوى الاستدلال] اذكر أطعمة تزود الجسم بالسوائل إلى جانب المشروبات.\n   الإجابة النموذجية: الفواكه والخضراوات والأرز المطبوخ والمعكرونة واللحوم علم التعاوني\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n- فكّر – زاوج – شارك\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: وعاء كبير، مخبار مدرج، ماء، حبة فاصوليا للتشبيه\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقة العمل 1-6", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n- الكليتان\n- الإخراج\n- البول\n- الفضلات\n- تنقية الدم\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n- غسيل الكلى\n- زراعة الكلى\n- التعرق\n- السوائل\n- المرض", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nيسأل المعلم: ماذا يحدث عندما تشرب كمية كبيرة من الماء؟ لماذا تحتاج إلى دورة المياه؟ من المسؤول عن ذلك في جسمك؟ (5 دقائق)\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nيسأل المعلم: ماذا يحدث لجسمك في يوم حار جدًا؟ ويكتب الأفكار على السبورة حتى يصل إلى «التعرق». (5 دقائق)", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج — زمن الحصة 40 دقيقة\n\n1. تحديد موقع الكليتين: يوضح المعلم الطريقة ص 28: اليدان على الوركين والإبهامان على الظهر ثم التحريك للأعلى حتى الضلوع؛ ويعرض حبة فاصوليا للتشبيه، والطلبة يحددون موقع الكليتين على أجسامهم ويصفون الشكل والحجم (بحجم فأرة الحاسوب) (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. وظيفة الإخراج: يشرح المعلم: يمر الدم عبر الكليتين نحو 40 مرة يوميًا لتنقيته ويُنتج نحو لتر من البول؛ ويصحح المفهوم الخاطئ أن ماء البول يأتي مباشرة مما نشربه، والطلبة يرسمون مخططًا: دم بفضلات ← الكليتان ← دم نقي + بول (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 1-6: كم يبلغ اللتر؟: يوجه المجموعات لسكب ما يقدرونه لترًا في وعاء ثم قياسه بالمخبار المدرج وجمع القياسات، والطلبة يقدّرون ويقيسون ويسجلون الفرق بين التقدير والقياس (9 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء — زمن الحصة 40 دقيقة\n\n1. عندما تتوقف الكليتان: يشرح المعلم ص 29: إزالة كلية والعيش بواحدة سليمة، غسيل الكلى (ساعات لعدة أيام أسبوعيًا)، زراعة الكلى، والطلبة يطرحون أسئلة ويجيبون عن السؤالين 3 و4 ص 29 (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحدّث عن: الطقس الحار: يقود المعلم نقاش «فكر – زاوج – شارك»: إذا فقدنا ماءً بالتعرق، فماذا يبقى لتكوين البول؟ والطلبة يستنتجون أن البول يقل في الطقس الحار (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. ورقة العمل 1-6: من أين تحصل على السوائل؟: يوجه المعلم إعداد قائمة بالسوائل خلال 24 ساعة وكمياتها، والأطعمة الرطبة، والطلبة يحسبون ما يشربون ويقيّمون: هل يكفي؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. غلق الدرس – ماء الجحلة والكليتين: تناقش الأزواج دور الكليتين في تنقية الدم وأهمية شرب الماء الكافي في صيف عمان الحار، وتتذكر الجحلة الفخارية لتبريد الماء (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين توجد الكليتان؟\n   الإجابة النموذجية: في الجزء الخلفي من الجسم، أسفل الضلوع قليلًا.\n2. [مستوى التطبيق] ما اسم السائل الذي تخرج فيه الفضلات من الكليتين؟\n   الإجابة النموذجية: البول.\n3. [مستوى الاستدلال] من أين يأتي الماء الموجود في البول؟\n   الإجابة النموذجية: من الدم؛ إذ يمر الماء من الجهاز الهضمي إلى الدم ثم تأخذ الكليتان الماء الزائد منه.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بغسيل الكلى؟\n   الإجابة النموذجية: استخدام جهاز يقوم بعمل الكليتين لتصفية الدم وتنظيفه.\n2. [مستوى التطبيق] لماذا يستطيع الإنسان العيش بكلية واحدة؟\n   الإجابة النموذجية: لأن الكلية الواحدة السليمة تستطيع القيام بعمل التنقية الكافي للجسم.\n3. [مستوى الاستدلال] اذكر أطعمة تزود الجسم بالسوائل إلى جانب المشروبات.\n   الإجابة النموذجية: الفواكه والخضراوات والأرز المطبوخ والمعكرونة واللحوم والأسماك.", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العملية الرئيسية التي تقوم بها الكليتان؟\n   الإجابة النموذجية: الإخراج.\n2. [مستوى التطبيق] صف شكل الكليتين وحجمهما.\n   الإجابة النموذجية: زوج من الأعضاء على شكل حبة الفاصوليا، بحجم فأرة الحاسوب تقريبًا لدى البالغ.\n3. [مستوى الاستدلال] كيف تحققت من تقديرك لكمية لتر الماء؟\n   الإجابة النموذجية: بقياس الماء بالمخبار المدرج وجمع القياسات ومقارنتها بلتر.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أشياء يمكن للأطباء القيام بها عند توقف الكليتين.\n   الإجابة النموذجية: استئصال الكلية التالفة، غسيل الكلى، زراعة كلية.\n2. [مستوى التطبيق] لماذا يفرز الجسم كمية بول أقل في الطقس الحار؟\n   الإجابة النموذجية: لأنه يفقد كمية أكبر من الماء بالتعرق فيبقى ماء زائد أقل لتكوين البول.\n3. [مستوى الاستدلال] اقترح ثلاث نصائح للمحافظة على صحة الكليتين.\n   الإجابة النموذجية: شرب كمية كافية من الماء، التقليل من الملح، عدم حبس البول، والفحص عند الشعور بالألم (تقبل الإجابات المنطقية).", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nللطالب: قراءة كتاب الطالب ص 28 وحل تمرين 1-6 في كتاب النشاط ص 21 واجبًا منزليًا. لولي الأمر: يُرجى تذكير الابن بشرب كمية كافية من الماء يوميًا.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nللطالب: إكمال ورقة العمل 1-6 (كتاب النشاط ص 60) بتسجيل السوائل التي يشربها خلال يوم. لولي الأمر: يُرجى مساعدة الابن في تسجيل كميات السوائل بدقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}, {"id": "1-7", "title": "ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 22، 61 | دليل المعلم ص 38–41", "n": 3, "per": [{"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | دليل المعلم ص 38–41", "num": "الحصة الأولى من 3", "focus": "الدماغ وحمايته والجهاز العصبي"}, "f": ["1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته (10 دقائق)\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي (20 دقيقة)\nمخرج تعليمي آخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر (10 دقائق)", "1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته. ← تذكر\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي. ← فهم\nالمخرج الآخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر. ← تحليل", "- التعلم بالاكتشاف\n- لعب الأدوار والمحاكاة\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: أكياس محكمة الغلق بها عصيدة باردة، خيوط لتمثيل الأعصاب", "- الدماغ\n- الجمجمة\n- الأعصاب\n- الجهاز العصبي\n- الرسائل العصبية", "يمرر المعلم أكياس عصيدة باردة محكمة الغلق، ويطلب وصف ملمسها، ثم يسأل: أي أعضاء الجسم تعتقد أنه يشبه هذه المادة؟ (5 دقائق)", "1. الدماغ وحمايته: يشرح المعلم ص 30: الدماغ رخو رمادي مجعد داخل الجمجمة، حجمه بحجم قبضتين، وحجمه لا يحدد الذكاء، والطلبة يضمّون قبضتيهم لتقدير الحجم ويكتبون وصف الدماغ (7 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\n2. لعبة الرسالة العصبية: يكوّن المعلم سلسلة طلاب (أعصاب) بين «الدماغ» و«اليد»، ويرسل رسالة بلمس الكتف، والطلبة يمررون الرسالة بأسرع ما يمكن ويقيسون الزمن، ثم يناقشون موقف عبور الشارع (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. الأسئلة 1–2 ص 31: يناقش المعلم: كيف يُحمى الدماغ؟ لماذا حمايته مهمة؟ كيف يرسل الرسائل؟ والطلبة يجيبون كتابيًا ثم يتشاركون (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يوجد الدماغ؟ وما الذي يحميه؟\n   الإجابة النموذجية: داخل الرأس، وتحميه الجمجمة.\n2. [مستوى التطبيق] ما مكونات الجهاز العصبي؟\n   الإجابة النموذجية: الدماغ والأعصاب.\n3. [مستوى الاستدلال] لماذا يجب أن تنتقل الرسائل من الدماغ وإليه بسرعة كبيرة؟\n   الإجابة النموذجية: ليستجيب الجسم فورًا للخطر، مثل الابتعاد عن سيارة مسرعة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] كيف يتصل الدماغ ببقية أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الأعصاب.\n2. [مستوى التطبيق] لماذا تُعد إصابات الدماغ خطيرة؟\n   الإجابة النموذجية: لأنه يتحكم في كل ما نقوم به ولا يستطيع عادة إصلاح نفسه.\n3. [مستوى الاستدلال] هل الإنسان ذو الدماغ الأكبر أذكى بالضرورة؟ وضح.\n   الإجابة النموذجية: لا؛ حجم الدماغ لا يرتبط بالذكاء، فدماغ أينشتاين كان أصغر قليلًا من المتوسط.", "للطالب: قراءة كتاب الطالب ص 30–31، والتفكير في سؤال: هل يعمل الدماغ أثناء النوم؟ لولي الأمر: يُرجى التأكيد على ارتداء الخوذة عند ركوب الدراجة لحماية الرأس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 22 | دليل المعلم ص 39–41", "num": "الحصة الثانية من 3", "focus": "أجزاء الدماغ ووظائفها"}, "f": ["1. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ (15 دقيقة)\n2. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه (10 دقائق)\nمخرج تعليمي آخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية (15 دقيقة)", "1. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ. ← تذكر\n2. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه. ← فهم\nالمخرج الآخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية. ← تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- صورة توضيحية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: مطبوعات لرسم مبسط للدماغ، أقلام تلوين، صحيفة ومربع ورق صغير", "- المخ\n- المخيخ\n- جذع الدماغ\n- التوازن\n- الوظائف الحيوية", "يعطي المعلم كل مجموعة صفحة صحيفة ومربعًا صغيرًا من الورق، ويتحداهم إدخال الصفحة في المربع، ثم يربط الطي بتجاعيد الدماغ وسعة التخزين. (5 دقائق)", "1. أجزاء الدماغ الثلاثة: يعرض المعلم نموذجًا/ملصقًا ويشرح: المخ (تفكير وحواس وذاكرة ولغة)، المخيخ (حركة وتوازن)، جذع الدماغ (تنفس ودقات قلب وحرارة الجسم والهضم)، والطلبة يلوّنون الرسم: المخ أصفر، المخيخ أحمر، جذع الدماغ أزرق، ويكتبون وظيفتين لكل جزء (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 1-7: يوجه المعلم حل تمرين 1-7 (كتاب النشاط ص 22)، والطلبة يحلون فرديًا ثم يتبادلون التصحيح (تقييم الأقران) (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. السؤال 3 والتحدي: يناقش المعلم السؤال 3 ص 31 (المكالمة الهاتفية) وسؤال التحدي (ارتجاج المخ)، والطلبة يكتبون خطوات المكالمة وما يقوم به الدماغ في كل خطوة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الجزء المسؤول عن التوازن؟\n   الإجابة النموذجية: المخيخ.\n2. [مستوى التطبيق] اذكر وظيفتين لجذع الدماغ.\n   الإجابة النموذجية: التحكم في التنفس ودقات القلب (وكذلك حرارة الجسم والهضم).\n3. [مستوى الاستدلال] ما المقصود بارتجاج المخ؟\n   الإجابة النموذجية: تلف يلحق بالدماغ عادة بسبب ضربة قوية على الرأس، قد يسبب فقدان الوعي أو صداعًا شديدًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أي أجزاء الدماغ أكبرها؟ وما وظيفته؟\n   الإجابة النموذجية: المخ؛ يتحكم في التفكير والحواس والذاكرة واللغة.\n2. [مستوى التطبيق] ما الجزء الذي يعمل حتى ونحن نائمون للحفاظ على التنفس؟\n   الإجابة النموذجية: جذع الدماغ.\n3. [مستوى الاستدلال] اشرح دور الدماغ عند رنين الهاتف والرد على صديق.\n   الإجابة النموذجية: يسمعك الرنين وصوت الصديق، ويحرك يدك لالتقاط الهاتف، ويمكّنك من الرؤية والكلام والفهم.", "للطالب: حل تمرين 1-7 (كتاب النشاط ص 22) إن لم يكتمل، ومراجعة أجزاء الدماغ ووظائفها. لولي الأمر: يُرجى الحرص على نوم الابن ساعات كافية لصحة الدماغ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 61 | دليل المعلم ص 40–41", "num": "الحصة الثالثة من 3", "focus": "مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)"}, "f": ["1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات (15 دقيقة)\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط (5 دقائق)\nمخرج تعليمي آخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر (20 دقيقة)", "1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات. ← تحليل\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط. ← تحليل\nالمخرج الآخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر. ← تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورقة العمل 1-7، آلة حاسبة", "- كتلة الجسم\n- كتلة الدماغ\n- النمط\n- النتيجة غير الملائمة للنمط\n- الغرام والكيلوغرام", "يعرض المعلم صورتي فيل وإنسان ويسأل: أيهما دماغه أثقل؟ وأيهما أذكى؟ هل يعني الدماغ الأثقل ذكاءً أكبر؟ (5 دقائق)", "1. قراءة الجدول والوحدات: يقرأ المعلم جدول ورقة العمل 1-7 (كتاب النشاط ص 61) وينبّه أن كتل الدماغ بالغرام والجسم بالكيلوغرام، والطلبة يحوّلون بعض القيم بمساعدة المعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 1-7: الترتيب والنمط: يتابع المجموعات أثناء الترتيب ويطرح أسئلة موجهة، والطلبة يرتبون الكائنات حسب الكتلتين، ويصفون النمط (تزداد كتلة الدماغ بزيادة كتلة الجسم)، ويحددون البابون غير الملائم (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التحدي ومناقشة الذكاء: يطرح المعلم التحدي: أي كائن دماغه أكبر نسبة إلى كتلة جسمه؟ ويوضح طريقة القسمة، والطلبة يحسبون للمستوى الاستدلال ويستنتجون أنه الإنسان (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – دماغ الملاح: تتحدث المجموعات عن دور الدماغ في التفكير واتخاذ القرار، بمثال ملاح عماني يقود سفينته بين النجوم والأمواج، وأهمية حماية الرأس (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الكائن ذو أكبر كتلة دماغ في الجدول؟\n   الإجابة النموذجية: الفيل.\n2. [مستوى التطبيق] صف النمط بين كتلة الجسم وكتلة الدماغ.\n   الإجابة النموذجية: كلما زادت كتلة الجسم زادت كتلة الدماغ.\n3. [مستوى الاستدلال] لماذا لا يلائم البابون النمط؟\n   الإجابة النموذجية: لأن ترتيبه في كتلة الدماغ يختلف عن ترتيبه في كتلة الجسم، فدماغه أثقل من دماغ كائن أثقل منه جسمًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الوحدة التي قيست بها كتلة الدماغ في الجدول؟\n   الإجابة النموذجية: الغرام.\n2. [مستوى التطبيق] كيف نعرف الكائن الذي يملك أكبر دماغ نسبةً إلى جسمه؟\n   الإجابة النموذجية: بقسمة كتلة الدماغ على كتلة الجسم لكل كائن ومقارنة النتائج.\n3. [مستوى الاستدلال] هل تتفق مع العبارة: «الكائن ذو الدماغ الأثقل هو الأذكى»؟ علّل.\n   الإجابة النموذجية: لا؛ فالفيل دماغه أثقل من الإنسان، والإنسان أذكى، والذكاء لا يرتبط بحجم الدماغ وحده.", "للطالب: إكمال ورقة العمل 1-7 (كتاب النشاط ص 61) والاستعداد لمراجعة الوحدة الأولى. لولي الأمر: يُرجى مراجعة أعضاء الجسم ووظائفها مع الابن استعدادًا لحصص «تحقق من تقدمك».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}], "comb": ["الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته (10 دقائق)\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي (20 دقيقة)\nمخرج تعليمي آخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر (10 دقائق)\n\nالحصة 2: أجزاء الدماغ ووظائفها\n1. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ (15 دقيقة)\n2. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه (10 دقائق)\nمخرج تعليمي آخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية (15 دقيقة)\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات (15 دقيقة)\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط (5 دقائق)\nمخرج تعليمي آخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر (20 دقيقة)", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته. ← تذكر\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي. ← فهم\nالمخرج الآخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر. ← تحليل\n\nالحصة 2: أجزاء الدماغ ووظائفها\n1. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ. ← تذكر\n2. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه. ← فهم\nالمخرج الآخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية. ← تطبيق\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات. ← تحليل\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط. ← تحليل\nالمخرج الآخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر. ← تقييم", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- التعلم بالاكتشاف\n- لعب الأدوار والمحاكاة\n- فكّر – زاوج – شارك\n\nالحصة 2: أجزاء الدماغ ووظائفها\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: أكياس محكمة الغلق بها عصيدة باردة، خيوط لتمثيل الأعصاب\n\nالحصة 2: أجزاء الدماغ ووظائفها\n- الكتاب\n- صورة توضيحية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: مطبوعات لرسم مبسط للدماغ، أقلام تلوين، صحيفة ومربع ورق صغير\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورقة العمل 1-7، آلة حاسبة", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- الدماغ\n- الجمجمة\n- الأعصاب\n- الجهاز العصبي\n- الرسائل العصبية\n\nالحصة 2: أجزاء الدماغ ووظائفها\n- المخ\n- المخيخ\n- جذع الدماغ\n- التوازن\n- الوظائف الحيوية\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- كتلة الجسم\n- كتلة الدماغ\n- النمط\n- النتيجة غير الملائمة للنمط\n- الغرام والكيلوغرام", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nيمرر المعلم أكياس عصيدة باردة محكمة الغلق، ويطلب وصف ملمسها، ثم يسأل: أي أعضاء الجسم تعتقد أنه يشبه هذه المادة؟ (5 دقائق)\n\nالحصة 2: أجزاء الدماغ ووظائفها\nيعطي المعلم كل مجموعة صفحة صحيفة ومربعًا صغيرًا من الورق، ويتحداهم إدخال الصفحة في المربع، ثم يربط الطي بتجاعيد الدماغ وسعة التخزين. (5 دقائق)\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nيعرض المعلم صورتي فيل وإنسان ويسأل: أيهما دماغه أثقل؟ وأيهما أذكى؟ هل يعني الدماغ الأثقل ذكاءً أكبر؟ (5 دقائق)", "الحصة 1: الدماغ وحمايته والجهاز العصبي — زمن الحصة 40 دقيقة\n\n1. الدماغ وحمايته: يشرح المعلم ص 30: الدماغ رخو رمادي مجعد داخل الجمجمة، حجمه بحجم قبضتين، وحجمه لا يحدد الذكاء، والطلبة يضمّون قبضتيهم لتقدير الحجم ويكتبون وصف الدماغ (7 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\n2. لعبة الرسالة العصبية: يكوّن المعلم سلسلة طلاب (أعصاب) بين «الدماغ» و«اليد»، ويرسل رسالة بلمس الكتف، والطلبة يمررون الرسالة بأسرع ما يمكن ويقيسون الزمن، ثم يناقشون موقف عبور الشارع (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. الأسئلة 1–2 ص 31: يناقش المعلم: كيف يُحمى الدماغ؟ لماذا حمايته مهمة؟ كيف يرسل الرسائل؟ والطلبة يجيبون كتابيًا ثم يتشاركون (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: أجزاء الدماغ ووظائفها — زمن الحصة 40 دقيقة\n\n1. أجزاء الدماغ الثلاثة: يعرض المعلم نموذجًا/ملصقًا ويشرح: المخ (تفكير وحواس وذاكرة ولغة)، المخيخ (حركة وتوازن)، جذع الدماغ (تنفس ودقات قلب وحرارة الجسم والهضم)، والطلبة يلوّنون الرسم: المخ أصفر، المخيخ أحمر، جذع الدماغ أزرق، ويكتبون وظيفتين لكل جزء (9 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تمرين 1-7: يوجه المعلم حل تمرين 1-7 (كتاب النشاط ص 22)، والطلبة يحلون فرديًا ثم يتبادلون التصحيح (تقييم الأقران) (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. السؤال 3 والتحدي: يناقش المعلم السؤال 3 ص 31 (المكالمة الهاتفية) وسؤال التحدي (ارتجاج المخ)، والطلبة يكتبون خطوات المكالمة وما يقوم به الدماغ في كل خطوة (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات) — زمن الحصة 40 دقيقة\n\n1. قراءة الجدول والوحدات: يقرأ المعلم جدول ورقة العمل 1-7 (كتاب النشاط ص 61) وينبّه أن كتل الدماغ بالغرام والجسم بالكيلوغرام، والطلبة يحوّلون بعض القيم بمساعدة المعلم (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. ورقة العمل 1-7: الترتيب والنمط: يتابع المجموعات أثناء الترتيب ويطرح أسئلة موجهة، والطلبة يرتبون الكائنات حسب الكتلتين، ويصفون النمط (تزداد كتلة الدماغ بزيادة كتلة الجسم)، ويحددون البابون غير الملائم (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. التحدي ومناقشة الذكاء: يطرح المعلم التحدي: أي كائن دماغه أكبر نسبة إلى كتلة جسمه؟ ويوضح طريقة القسمة، والطلبة يحسبون للمستوى الاستدلال ويستنتجون أنه الإنسان (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس – دماغ الملاح: تتحدث المجموعات عن دور الدماغ في التفكير واتخاذ القرار، بمثال ملاح عماني يقود سفينته بين النجوم والأمواج، وأهمية حماية الرأس (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يوجد الدماغ؟ وما الذي يحميه؟\n   الإجابة النموذجية: داخل الرأس، وتحميه الجمجمة.\n2. [مستوى التطبيق] ما مكونات الجهاز العصبي؟\n   الإجابة النموذجية: الدماغ والأعصاب.\n3. [مستوى الاستدلال] لماذا يجب أن تنتقل الرسائل من الدماغ وإليه بسرعة كبيرة؟\n   الإجابة النموذجية: ليستجيب الجسم فورًا للخطر، مثل الابتعاد عن سيارة مسرعة.\n\nالحصة 2: أجزاء الدماغ ووظائفها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الجزء المسؤول عن التوازن؟\n   الإجابة النموذجية: المخيخ.\n2. [مستوى التطبيق] اذكر وظيفتين لجذع الدماغ.\n   الإجابة النموذجية: التحكم في التنفس ودقات القلب (وكذلك حرارة الجسم والهضم).\n3. [مستوى الاستدلال] ما المقصود بارتجاج المخ؟\n   الإجابة النموذجية: تلف يلحق بالدماغ عادة بسبب ضربة قوية على الرأس، قد يسبب فقدان الوعي أو صداعًا شديدًا.\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الكائن ذو أكبر كتلة دماغ في الجدول؟\n   الإجابة النموذجية: الفيل.\n2. [مستوى التطبيق] صف النمط بين كتلة الجسم وكتلة الدماغ.\n   الإجابة النموذجية: كلما زادت كتلة الجسم زادت كتلة الدماغ.\n3. [مستوى الاستدلال] لماذا لا يلائم البابون النمط؟\n   الإجابة النموذجية: لأن ترتيبه في كتلة الدماغ يختلف عن ترتيبه في كتلة الجسم، فدماغه أثقل من دماغ كائن أثقل منه جسمًا.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] كيف يتصل الدماغ ببقية أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الأعصاب.\n2. [مستوى التطبيق] لماذا تُعد إصابات الدماغ خطيرة؟\n   الإجابة النموذجية: لأنه يتحكم في كل ما نقوم به ولا يستطيع عادة إصلاح نفسه.\n3. [مستوى الاستدلال] هل الإنسان ذو الدماغ الأكبر أذكى بالضرورة؟ وضح.\n   الإجابة النموذجية: لا؛ حجم الدماغ لا يرتبط بالذكاء، فدماغ أينشتاين كان أصغر قليلًا من المتوسط.\n\nالحصة 2: أجزاء الدماغ ووظائفها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أي أجزاء الدماغ أكبرها؟ وما وظيفته؟\n   الإجابة النموذجية: المخ؛ يتحكم في التفكير والحواس والذاكرة واللغة.\n2. [مستوى التطبيق] ما الجزء الذي يعمل حتى ونحن نائمون للحفاظ على التنفس؟\n   الإجابة النموذجية: جذع الدماغ.\n3. [مستوى الاستدلال] اشرح دور الدماغ عند رنين الهاتف والرد على صديق.\n   الإجابة النموذجية: يسمعك الرنين وصوت الصديق، ويحرك يدك لالتقاط الهاتف، ويمكّنك من الرؤية والكلام والفهم.\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الوحدة التي قيست بها كتلة الدماغ في الجدول؟\n   الإجابة النموذجية: الغرام.\n2. [مستوى التطبيق] كيف نعرف الكائن الذي يملك أكبر دماغ نسبةً إلى جسمه؟\n   الإجابة النموذجية: بقسمة كتلة الدماغ على كتلة الجسم لكل كائن ومقارنة النتائج.\n3. [مستوى الاستدلال] هل تتفق مع العبارة: «الكائن ذو الدماغ الأثقل هو الأذكى»؟ علّل.\n   الإجابة النموذجية: لا؛ فالفيل دماغه أثقل من الإنسان، والإنسان أذكى، والذكاء لا يرتبط بحجم الدماغ وحده.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nللطالب: قراءة كتاب الطالب ص 30–31، والتفكير في سؤال: هل يعمل الدماغ أثناء النوم؟ لولي الأمر: يُرجى التأكيد على ارتداء الخوذة عند ركوب الدراجة لحماية الرأس.\n\nالحصة 2: أجزاء الدماغ ووظائفها\nللطالب: حل تمرين 1-7 (كتاب النشاط ص 22) إن لم يكتمل، ومراجعة أجزاء الدماغ ووظائفها. لولي الأمر: يُرجى الحرص على نوم الابن ساعات كافية لصحة الدماغ.\n\nالحصة 3: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nللطالب: إكمال ورقة العمل 1-7 (كتاب النشاط ص 61) والاستعداد لمراجعة الوحدة الأولى. لولي الأمر: يُرجى مراجعة أعضاء الجسم ووظائفها مع الابن استعدادًا لحصص «تحقق من تقدمك».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"id": "1-8", "title": "تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 32–33 | كتاب النشاط ص 23، 62 | دليل المعلم ص 41–43", "n": 2, "per": [{"h": {"lesson": "1-8 تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 32 | دليل المعلم ص 41–43", "num": "الحصة الأولى من 2", "focus": "مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي"}, "f": ["1. يربط كل عضو من أعضاء الجسم بوظيفته الرئيسية (10 دقائق)\n2. يصحح العبارات الخاطئة المتعلقة بالقلب والنبض والدم (15 دقيقة)\nمخرج تعليمي آخر: يرتب مراحل عملية الهضم ترتيبًا صحيحًا (15 دقيقة)", "1. يربط كل عضو من أعضاء الجسم بوظيفته الرئيسية. ← تذكر\n2. يصحح العبارات الخاطئة المتعلقة بالقلب والنبض والدم. ← فهم\nالمخرج الآخر: يرتب مراحل عملية الهضم ترتيبًا صحيحًا. ← تطبيق", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- الأقلام", "- الوظيفة\n- الدورة الدموية\n- النبض\n- الهضم\n- المريء", "يلعب المعلم «من أنا؟»: يقرأ وصفًا مثل «أنا عضلة لا تتعب، أضخ الدم» ويخمن الطلبة العضو. (5 دقائق)", "1. السؤال 1: المطابقة: يوجه المعلم حل السؤال 1 ص 32 (العضو ووظيفته)، والطلبة يصلون العضو بوظيفته ثم يصححون جماعيًا (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السؤال 2: صواب أم خطأ: يوجه المعلم السؤال 2 مع تصحيح العبارات الخاطئة، والطلبة يحددون الصواب والخطأ ويعيدون كتابة الخاطئ صحيحًا (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. السؤالان 3 و4: الهضم: يوجه المعلم إكمال جمل الهضم بالكلمات وترتيبها، والطلبة يكملون ويرتبون: الفم ← المريء ← المعدة ← الأمعاء ← الإخراج (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صوّب العبارة: «يضخ القلب الهواء إلى جميع أنحاء الجسم».\n   الإجابة النموذجية: يضخ القلب الدم إلى جميع أنحاء الجسم.\n2. [مستوى التطبيق] صوّب العبارة: «يحمل الدم ثاني أكسيد الكربون من الرئتين».\n   الإجابة النموذجية: يحمل الدم ثاني أكسيد الكربون إلى الرئتين لطرده.\n3. [مستوى الاستدلال] في أي جزء يتم مزج الطعام بالعصارة الهضمية؟\n   الإجابة النموذجية: في المعدة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العضو المسؤول عن التحكم؟\n   الإجابة النموذجية: الدماغ.\n2. [مستوى التطبيق] ماذا يوضح معدل النبض؟\n   الإجابة النموذجية: مدى سرعة دقات القلب.\n3. [مستوى الاستدلال] رتب: يُدفع الطعام إلى المعدة، يُمضغ في الفم، يُفتت في الأمعاء، يُمزج بالعصارة.\n   الإجابة النموذجية: يُمضغ في الفم ← يُدفع إلى المعدة ← يُمزج بالعصارة في المعدة ← يُفتت في الأمعاء.", "للطالب: مراجعة كتاب الطالب ص 18–31 وحل السؤالين 5 و6 ص 33 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة إجابات الابن ومناقشة الأخطاء معه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=8"]}, {"h": {"lesson": "1-8 تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 33 | كتاب النشاط ص 23، 62 | دليل المعلم ص 42–43", "num": "الحصة الثانية من 2", "focus": "مراجعة شاملة: الأعضاء والأجهزة والمصطلحات"}, "f": ["1. يطبق معرفته لتفسير مواقف تتعلق بالرئتين والكليتين والدماغ (10 دقائق)\n2. يستخدم المصطلحات العلمية للوحدة استخدامًا صحيحًا (10 دقائق)\nمخرج تعليمي آخر: ينظم مفاهيم الوحدة في خريطة مفاهيمية لأجهزة الجسم (20 دقيقة)", "1. يطبق معرفته لتفسير مواقف تتعلق بالرئتين والكليتين والدماغ. ← تطبيق\n2. يستخدم المصطلحات العلمية للوحدة استخدامًا صحيحًا. ← فهم\nالمخرج الآخر: ينظم مف  62) ثم يطلب خريطة مفاهيمية للأجهزة الخمسة وأعضائها ووظائفها، والطلبة يكملون الورقة ويرسمون الخريطة في مجموعات ويعرضونها (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – مطابقة سريعة للأعضاء: تتسابق المجموعات في مطابقة الأعضاء بوظائفها وتصحيح عبارات خاطئة، وتختم كل مجموعة بنصيحة صحية لأبناء الوطن (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صوّب العبارة: «يضخ القلب الهواء إلى جميع أنحاء الجسم».\n   الإجابة النموذجية: يضخ القلب الدم إلى جميع أنحاء الجسم.\n2. [مستوى التطبيق] صوّب العبارة: «يحمل الدم ثاني أكسيد الكربون من الرئتين».\n   الإجابة النموذجية: يحمل الدم ثاني أكسيد الكربون إلى الرئتين لطرده.\n3. [مستوى الاستدلال] في أي جزء يتم مزج الطعام بالعصارة الهضمية؟\n   الإجابة النموذجية: في المعدة.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما اسم الفضلات التي تخرج من الكليتين؟\n   الإجابة النموذجية: البول.\n2. [مستوى التطبيق] كيف يؤثر لعب مباراة كرة قدم في عمل الرئتين؟\n   الإجابة النموذجية: يزيد معدل التنفس للحصول على مزيد من الأكسجين.\n3. [مستوى الاستدلال] كيف يتأكد الدماغ من أن الرئتين تقومان بعملهما؟\n   الإجابة النموذجية: يتحكم في التنفس فيرسل الرسائل عبر الأعصاب لتستمر عملية التنفس.", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العضو المسؤول عن التحكم؟\n   الإجابة النموذجية: الدماغ.\n2. [مستوى التطبيق] ماذا يوضح معدل النبض؟\n   الإجابة النموذجية: مدى سرعة دقات القلب.\n3. [مستوى الاستدلال] رتب: يُدفع الطعام إلى المعدة، يُمضغ في الفم، يُفتت في الأمعاء، يُمزج بالعصارة.\n   الإجابة النموذجية: يُمضغ في الفم ← يُدفع إلى المعدة ← يُمزج بالعصارة في المعدة ← يُفتت في الأمعاء.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغاز الذي نطرحه خارج الرئتين؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n2. [مستوى التطبيق] أكمل: الدماغ والأعصاب تشكل الجهاز ____.\n   الإجابة النموذجية: العصبي.\n3. [مستوى الاستدلال] بيّن بمثال كيف يتعاون جهازان من أجهزة الجسم.\n   الإجابة النموذجية: الجهاز التنفسي يأخذ الأكسجين والجهاز الدوري ينقله بالدم إلى أجزاء الجسم (تقبل أمثلة صحيحة أخرى).", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\nللطالب: مراجعة كتاب الطالب ص 18–31 وحل السؤالين 5 و6 ص 33 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة إجابات الابن ومناقشة الأخطاء معه.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nللطالب: إكمال ورقة العمل 1-8 (كتاب النشاط ص 62) ومراجعة الوحدة الأولى كاملة. لولي الأمر: يُرجى الاطلاع على خريطة الأجهزة التي أعدّها الابن ومراجعتها معه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=8"]}, {"id": "2-1", "title": "السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 34–35 | كتاب النشاط ص 24 | دليل المعلم ص 48–49", "n": 2, "per": [{"h": {"lesson": "2-1 السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 34 | دليل المعلم ص 48–49", "num": "الحصة الأولى من 2", "focus": "الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)"}, "f": ["1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا (5 دقائق)\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم (20 دقيقة)\nمخرج تعليمي آخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات (15 دقيقة)", "1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا. ← تذكر\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم. ← فهم\nالمخرج الآخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات. ← فهم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- السبورة التقليدية", "- الموطن الطبيعي\n- العلاقة الغذائية\n- السلسلة الغذائية\n- الآفات\n- السهم «تتغذى عليه»", "يذكّر المعلم بما درسه الطلبة في الصف الرابع عن المواطن الطبيعية، ويسأل: أين يعيش الضب؟ وأين تعيش السمكة؟ وماذا يأكل كل منهما؟ (5 دقائق)", "1. مزرعة محمد في صحار: يعرض المعلم صورة المزرعة ص 34 ويناقش: النباتات (ذرة، سبانخ، يقطين) والحيوانات والآفات (اليرقات، ثاقبة الذرة)، والطلبة يحددون الكائنات والعلاقات الغذائية بينها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. كتابة السلسلة الغذائية: يشرح المعلم معنى السهم «يتغذى عليه» بمثال: السبانخ ← اليرقة، ويصحح اتجاه السهم، والطلبة يكتبون سلسلتين من المزرعة على السبورة الصغيرة ويصفون كل واحدة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تحدّث: الآفات ومكافحتها: يناقش المعلم كيف تأكل الطيور اليرقات والسحالي ثاقبة الذرة فتحمي المحصول، والطلبة يكملون سلسلة من ثلاث حلقات: ذرة ← ثاقبة الذرة ← سحلية (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد موطنًا محليًا لنشاط الحصة القادمة، والطلبة يجيبون ويختارون موطنًا قرب المدرسة أو المنزل (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالموطن الطبيعي؟\n   الإجابة النموذجية: المكان الذي تعيش فيه الكائنات الحية في البيئة.\n2. [مستوى التطبيق] ماذا يعني السهم في السلسلة الغذائية: سبانخ ← يرقة؟\n   الإجابة النموذجية: أن اليرقة تتغذى على السبانخ.\n3. [مستوى الاستدلال] لماذا يفرح المزارع بوجود السحالي في مزرعته؟\n   الإجابة النموذجية: لأنها تأكل الحشرة ثاقبة الذرة فتقلل الضرر على المحصول.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اكتب سلسلة غذائية من مزرعة محمد.\n   الإجابة النموذجية: مثل: ورقة سبانخ ← يرقة ← طائر، أو ذرة ← حشرة ثاقبة الذرة ← سحلية.\n2. [مستوى التطبيق] ما الآفة؟ أعط مثالًا.\n   الإجابة النموذجية: كائن يضر بالمزروعات، مثل اليرقات أو الحشرة ثاقبة الذرة.\n3. [مستوى الاستدلال] ماذا يحدث لمحصول الذرة لو اختفت السحالي من المزرعة؟ ولماذا؟\n   الإجابة النموذجية: قد يتضرر أكثر لأن أعداد ثاقبة الذرة ستزداد دون من يأكلها.", "للطالب: قراءة كتاب الطالب ص 34، وملاحظة النباتات والحيوانات في حديقة المنزل أو الحي. لولي الأمر: يُرجى مرافقة الابن عند زيارة حديقة أو مزرعة لملاحظة الكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}, {"h": {"lesson": "2-1 السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 35 | كتاب النشاط ص 24 | دليل المعلم ص 48–49", "num": "الحصة الثانية من 2", "focus": "استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)"}, "f": ["1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي (15 دقيقة)\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها (10 دقائق)\nمخرج تعليمي آخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح) (15 دقيقة)", "1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي. ← تطبيق\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها. ← تطبيق\nالمخرج الآخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح). ← تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- أخرى: حديقة المدرسة، عدسات مكبرة، دفتر ملاحظات", "- الملاحظة\n- الموطن الطبيعي\n- السلسلة الغذائية\n- الاعتماد المتبادل", "يذكّر المعلم بقواعد السلامة والرفق بالكائنات، ويوزع المهام: مسجّل، باحث تحت الأوراق، مراقب للطيور، رسّام. (5 دقائق)", "1. نشاط 2-1 في حديقة المدرسة: يرافق المجموعات ويوجه الملاحظة تحت الأوراق والشجيرات وفي الأشجار، والطلبة يسجلون قائمة النباتات والحيوانات (حشرات، طيور) والعلاقات الغذائية الملاحظة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رسم السلاسل: يعود المعلم بالطلبة إلى الصف ويوجه حل الأسئلة 1–4 ص 35، والطلبة يرسمون ثلاث سلاسل غذائية من ملاحظاتهم وسلسلتين من مزرعة محمد (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. مشاركة واعتماد متبادل: يناقش المعلم السؤال 3: الشجرة مأوى للطيور، الأزهار توفر حبوب اللقاح للنحل، والطلبة يعرضون سلاسلهم ويقترحون أمثلة على الاعتماد المتبادل (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – موطن وادي شاب: تتخيل المجموعات موطنًا طبيعيًا في وادٍ عماني، وتكون سلسلة غذائية من كائناته الحية، وتعرضها بأسهم على اللوح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] سمِّ ثلاثة نباتات وثلاثة حيوانات لاحظتها.\n   الإجابة النموذجية: تعتمد على الموطن، مثل: عشب، شجرة نيم، مانجو؛ نملة، عصفور، فراشة.\n2. [مستوى التطبيق] ارسم سلسلة غذائية من ملاحظاتك.\n   الإجابة النموذجية: مثل: عشب ← جرادة ← طائر (أي سلسلة صحيحة تبدأ بنبات).\n3. [مستوى الاستدلال] كيف توفر شجرة المانجو أكثر من الغذاء للحيوانات؟\n   الإجابة النموذجية: توفر مكانًا للطيور لبناء أعشاشها وظلًا ومأوى للحشرات.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أين بحثت عن الحشرات؟ ولماذا هناك؟\n   الإجابة النموذجية: تحت الأوراق الميتة والشجيرات؛ لأنها أماكن رطبة ومظللة توفر الغذاء والمأوى.\n2. [مستوى التطبيق] بماذا تبدأ السلاسل الغذائية التي رسمتها؟\n   الإجابة النموذجية: بنبات.\n3. [مستوى الاستدلال] كيف تعتمد الأزهار على النحل؟\n   الإجابة النموذجية: ينقل النحل حبوب اللقاح بين الأزهار فيساعد على تكوين البذور.", "للطالب: حل تمرين 2-1 في كتاب النشاط ص 24 واجبًا منزليًا، وإكمال رسم السلاسل في الدفتر. لولي الأمر: يُرجى متابعة الواجب وتشجيع الابن على الرفق بالكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}], "comb": ["الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا (5 دقائق)\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم (20 دقيقة)\nمخرج تعليمي آخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات (15 دقيقة)\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي (15 دقيقة)\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها (10 دقائق)\nمخرج تعليمي آخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح) (15 دقيقة)", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا. ← تذكر\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم. ← فهم\nالمخرج الآخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات. ← فهم\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي. ← تطبيق\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها. ← تطبيق\nالمخرج الآخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح). ← تحليل", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- السبورة التقليدية\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- الكتاب\n- الأقلام\n- أخرى: حديقة المدرسة، عدسات مكبرة، دفتر ملاحظات", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- الموطن الطبيعي\n- العلاقة الغذائية\n- السلسلة الغذائية\n- الآفات\n- السهم «تتغذى عليه»\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- الملاحظة\n- الموطن الطبيعي\n- السلسلة الغذائية\n- الاعتماد المتبادل", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nيذكّر المعلم بما درسه الطلبة في الصف الرابع عن المواطن الطبيعية، ويسأل: أين يعيش الضب؟ وأين تعيش السمكة؟ وماذا يأكل كل منهما؟ (5 دقائق)\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nيذكّر المعلم بقواعد السلامة والرفق بالكائنات، ويوزع المهام: مسجّل، باحث تحت الأوراق، مراقب للطيور، رسّام. (5 دقائق)", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد) — زمن الحصة 40 دقيقة\n\n1. مزرعة محمد في صحار: يعرض المعلم صورة المزرعة ص 34 ويناقش: النباتات (ذرة، سبانخ، يقطين) والحيوانات والآفات (اليرقات، ثاقبة الذرة)، والطلبة يحددون الكائنات والعلاقات الغذائية بينها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. كتابة السلسلة الغذائية: يشرح المعلم معنى السهم «يتغذى عليه» بمثال: السبانخ ← اليرقة، ويصحح اتجاه السهم، والطلبة يكتبون سلسلتين من المزرعة على السبورة الصغيرة ويصفون كل واحدة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تحدّث: الآفات ومكافحتها: يناقش المعلم كيف تأكل الطيور اليرقات والسحالي ثاقبة الذرة فتحمي المحصول، والطلبة يكملون سلسلة من ثلاث حلقات: ذرة ← ثاقبة الذرة ← سحلية (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد موطنًا محليًا لنشاط الحصة القادمة، والطلبة يجيبون ويختارون موطنًا قرب المدرسة أو المنزل (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1) — زمن الحصة 40 دقيقة\n\n1. نشاط 2-1 في حديقة المدرسة: يرافق المجموعات ويوجه الملاحظة تحت الأوراق والشجيرات وفي الأشجار، والطلبة يسجلون قائمة النباتات والحيوانات (حشرات، طيور) والعلاقات الغذائية الملاحظة (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. رسم السلاسل: يعود المعلم بالطلبة إلى الصف ويوجه حل الأسئلة 1–4 ص 35، والطلبة يرسمون ثلاث سلاسل غذائية من ملاحظاتهم وسلسلتين من مزرعة محمد (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. مشاركة واعتماد متبادل: يناقش المعلم السؤال 3: الشجرة مأوى للطيور، الأزهار توفر حبوب اللقاح للنحل، والطلبة يعرضون سلاسلهم ويقترحون أمثلة على الاعتماد المتبادل (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – موطن وادي شاب: تتخيل المجموعات موطنًا طبيعيًا في وادٍ عماني، وتكون سلسلة غذائية من كائناته الحية، وتعرضها بأسهم على اللوح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالموطن الطبيعي؟\n   الإجابة النموذجية: المكان الذي تعيش فيه الكائنات الحية في البيئة.\n2. [مستوى التطبيق] ماذا يعني السهم في السلسلة الغذائية: سبانخ ← يرقة؟\n   الإجابة النموذجية: أن اليرقة تتغذى على السبانخ.\n3. [مستوى الاستدلال] لماذا يفرح المزارع بوجود السحالي في مزرعته؟\n   الإجابة النموذجية: لأنها تأكل الحشرة ثاقبة الذرة فتقلل الضرر على المحصول.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] سمِّ ثلاثة نباتات وثلاثة حيوانات لاحظتها.\n   الإجابة النموذجية: تعتمد على الموطن، مثل: عشب، شجرة نيم، مانجو؛ نملة، عصفور، فراشة.\n2. [مستوى التطبيق] ارسم سلسلة غذائية من ملاحظاتك.\n   الإجابة النموذجية: مثل: عشب ← جرادة ← طائر (أي سلسلة صحيحة تبدأ بنبات).\n3. [مستوى الاستدلال] كيف توفر شجرة المانجو أكثر من الغذاء للحيوانات؟\n   الإجابة النموذجية: توفر مكانًا للطيور لبناء أعشاشها وظلًا ومأوى للحشرات.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اكتب سلسلة غذائية من مزرعة محمد.\n   الإجابة النموذجية: مثل: ورقة سبانخ ← يرقة ← طائر، أو ذرة ← حشرة ثاقبة الذرة ← سحلية.\n2. [مستوى التطبيق] ما الآفة؟ أعط مثالًا.\n   الإجابة النموذجية: كائن يضر بالمزروعات، مثل اليرقات أو الحشرة ثاقبة الذرة.\n3. [مستوى الاستدلال] ماذا يحدث لمحصول الذرة لو اختفت السحالي من المزرعة؟ ولماذا؟\n   الإجابة النموذجية: قد يتضرر أكثر لأن أعداد ثاقبة الذرة ستزداد دون من يأكلها.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أين بحثت عن الحشرات؟ ولماذا هناك؟\n   الإجابة النموذجية: تحت الأوراق الميتة والشجيرات؛ لأنها أماكن رطبة ومظللة توفر الغذاء والمأوى.\n2. [مستوى التطبيق] بماذا تبدأ السلاسل الغذائية التي رسمتها؟\n   الإجابة النموذجية: بنبات.\n3. [مستوى الاستدلال] كيف تعتمد الأزهار على النحل؟\n   الإجابة النموذجية: ينقل النحل حبوب اللقاح بين الأزهار فيساعد على تكوين البذور.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nللطالب: قراءة كتاب الطالب ص 34، وملاحظة النباتات والحيوانات في حديقة المنزل أو الحي. لولي الأمر: يُرجى مرافقة الابن عند زيارة حديقة أو مزرعة لملاحظة الكائنات الحية.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nللطالب: حل تمرين 2-1 في كتاب النشاط ص 24 واجبًا منزليًا، وإكمال رسم السلاسل في الدفتر. لولي الأمر: يُرجى متابعة الواجب وتشجيع الابن على الرفق بالكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}, {"id": "2-2", "title": "السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 36–37 | كتاب النشاط ص 25–26 | دليل المعلم ص 49–51", "n": 3, "per": [{"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 36 | دليل المعلم ص 49–50", "num": "الحصة الأولى من 3", "focus": "النباتات كائنات منتجة والحيوانات كائنات مستهلكة"}, "f": ["1. يعرّف الكائن المنتج والكائن المستهلك (20 دقيقة)\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات (5 دقائق)\nمخرج تعليمي آخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة (15 دقيقة)", "1. يعرّف الكائن المنتج والكائن المستهلك. ← تذكر\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات. ← فهم\nالمخرج الآخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة. ← تطبيق", "- العصف الذهني\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- صورة توضيحية", "- الكائن المنتج\n- الكائن المستهلك\n- الطاقة\n- السلسلة الغذائية", "يسأل المعلم: ماذا أكلت خلال الـ24 ساعة الماضية؟ ويكتب قائمة على السبورة، ثم يسأل: أيها من النباتات أو مصدره نبات؟ (5 دقائق)", "1. تتبع الطعام إلى النبات: يسأل المعلم عن الأطعمة الحيوانية: الدجاجة ماذا تأكل؟ الخروف ماذا يأكل؟ ويقود إلى أن كل غذاء يعود إلى النبات، والطلبة يكملون سلاسل: ذرة ← دجاجة ← إنسان (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المنتج والمستهلك: يقدم المعلم المفهومين من ص 36 ويطرح: ماذا لو لم توجد النباتات؟ والطلبة يحددون المنتج والمستهلك في السلسلتين ص 36 (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 1 ص 36: يوجه المعلم ترتيب: سبانخ – طائر – يرقة؛ إنسان – عشب – خروف، والطلبة يرتبون ويرسمون الأسهم (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ: النباتات لا تعتمد على الإنسان، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تسمى النباتات كائنات منتجة؟\n   الإجابة النموذجية: لأنها تصنع غذاءها بنفسها.\n2. [مستوى التطبيق] في السلسلة: بذور الذرة ← دجاجة ← إنسان، حدد المنتج والمستهلكات.\n   الإجابة النموذجية: المنتج: بذور الذرة. المستهلكات: الدجاجة والإنسان.\n3. [مستوى الاستدلال] ماذا يحدث للحيوانات لو اختفت كل النباتات؟ ولماذا؟\n   الإجابة النموذجية: تموت في النهاية؛ لأن آكلات النباتات لن تجد غذاء، ثم الحيوانات التي تأكلها.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: إنسان – عشب – خروف.\n   الإجابة النموذجية: عشب ← خروف ← إنسان.\n2. [مستوى التطبيق] بماذا تبدأ كل سلسلة غذائية؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n3. [مستوى الاستدلال] هل يعتمد الإنسان على النبات أم النبات على الإنسان؟ وضح.\n   الإجابة النموذجية: الإنسان يعتمد على النبات في غذائه، أما النبات فيصنع غذاءه بنفسه.", "للطالب: قراءة كتاب الطالب ص 36 وكتابة سلسلتين غذائيتين من طعام العائلة. لولي الأمر: يُرجى مناقشة الابن في مصادر طعام وجبة العشاء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 37 | دليل المعلم ص 50–51", "num": "الحصة الثانية من 3", "focus": "كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات"}, "f": ["1. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون (15 دقيقة)\n2. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية (10 دقائق)", "1. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون. ← تذكر\n2. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس. ← تطبيق\nالمخرج الآخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: أصص زرع، شتلات فاصوليا مُعدة مسبقًا، ملصقات", "- صنع الغذاء\n- ضوء الشمس\n- ثاني أكسيد الكربون\n- الأكسجين\n- العامل المؤثر", "يعرض المعلم نبتتين: إحداهما ذابلة صفراء والأخرى خضراء نضرة، ويسأل: ماذا تتوقع أن تكون الذابلة قد افتقدت؟ (5 دقائق)", "1. كيف تصنع النباتات الغذاء؟: يشرح المعلم ص 37: في الأوراق، بالطاقة من الشمس، من الماء وثاني أكسيد الكربون، ينتج سكر وأكسجين يُطلق في الهواء؛ وتمتص الجذور المغذيات، والطلبة يرسمون مخططًا للورقة: مدخلات ومخرجات (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التخطيط لنشاط 2-2: يوجه المجموعات للتخطيط: زوج في الضوء وآخر في الظلام، وزوج يُروى وآخر لا يُروى، مع تثبيت باقي العوامل، والطلبة يحددون العامل المتغير والثوابت ويكتبون التنبؤ ويلصقون الملصقات على الأصص (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تحدّث: الأكسجين: يناقش المعلم: ما الغاز الذي نتنفسه؟ ومن يعيد إنتاجه؟ والطلبة يستنتجون التوازن بين النباتات والحيوانات في الأكسجين وثاني أكسيد الكربون (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد مسؤولية متابعة الأصص، والطلبة يجيبون ويتقاسمون مهام المتابعة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين تصنع النباتات غذاءها؟\n   الإجابة النموذجية: في أوراقها.\n2. [مستوى التطبيق] ما الغاز الذي تأخذه النباتات من الهواء لصنع الغذاء؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n3. [مستوى الاستدلال] في استقصاء الضوء، ما العامل الذي سنغيّره وما العوامل التي نثبّتها؟\n   الإجابة النموذجية: نغير الضوء (ضوء/ظلام)، ونثبت كمية الماء ونوع النبات والتربة والأصيص.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا ينتج النبات عند صنع غذائه؟\n   الإجابة النموذجية: السكر والأكسجين.\n2. [مستوى التطبيق] تنبأ: ماذا سيحدث للنبتة التي لا تُروى؟\n   الإجابة النموذجية: ستذبل وقد تموت لأنها لا تستطيع صنع الغذاء دون ماء.\n3. [مستوى الاستدلال] لماذا نستخدم نبتتين متشابهتين في كل استقصاء؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فيكون الفرق ناتجًا عن العامل المتغير وحده.", "للطالب: متابعة الأصص يوميًا وتسجيل الملاحظات (الطول ولون الأوراق) في جدول. لولي الأمر: يُرجى تشجيع الابن على زراعة بذرة في المنزل ومتابعة نموها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 37 | كتاب النشاط ص 25–26 | دليل المعلم ص 50–51", "num": "الحصة الثالثة من 3", "focus": "نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية"}, "f": ["1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته (10 دقائق)\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء (10 دقائق)\nمخرج تعليمي آخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة (20 دقيقة)", "1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته. ← تقييم\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء. ← تحليل\nالمخرج الآخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلات الاستقصاء المعدّة مسبقًا (ضوء/ظلام، مروية/غير مروية)", "- النتائج\n- التفسير\n- الدليل\n- الكائن المنتج\n- الكائن المستهلك", "يضع المعلم أمام الطلبة أصص الاستقصاء التي أعدّها مسبقًا (منذ أسبوع)، ويطلب منهم وصف الفرق دون لمسها. (5 دقائق)", "1. تحليل النتائج (أسئلة نشاط 2-2): يوجه المعلم الإجابة عن الأسئلة 1–3: العامل المؤثر، التنبؤ، الدليل، والطلبة يقارنون: نبتة الظلام صفراء لا تنمو، والمحرومة من الماء ذابلة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التفسير العلمي: يربط المعلم النتائج بصنع الغذاء: دون ضوء أو ماء لا يصنع النبات غذاءه، والطلبة يكتبون تفسيرًا لكل نتيجة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-2 في كتاب النشاط: يوجه المعلم حل تمرين 2-2 (ص 25–26): حاجات النبات وتحديد المنتج والمستهلكات وترتيب سلسلة، والطلبة يحلون فرديًا ثم يصححون مع المعلم (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – سلسلة تبدأ بالسمر: تكوّن الأزواج سلاسل غذائية تبدأ بنباتات عمانية كالسمر والغاف ثم الحيوانات المستهلكة، وتحدد المنتج والمستهلكين (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما العامل المؤثر في الاستقصاء الأول؟ وفي الثاني؟\n   الإجابة النموذجية: الأول: الماء. الثاني: ضوء الشمس.\n2. [مستوى التطبيق] صف النبتة التي وُضعت في الظلام.\n   الإجابة النموذجية: لم تنمُ جيدًا وتحولت أوراقها إلى اللون الأصفر.\n3. [مستوى الاستدلال] هل تدعم النتائج تنبؤك؟ ووضح السبب علميًا.\n   الإجابة النموذجية: نعم؛ لأن النبات يحتاج إلى الضوء والماء لصنع غذائه، فلما حُرم أحدهما ضعف نموه.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: أسد – شجرة – حمار وحشي.\n   الإجابة النموذجية: شجرة ← حمار وحشي ← أسد.\n2. [مستوى التطبيق] لماذا ذبلت النبتة غير المروية؟\n   الإجابة النموذجية: لأنها لم تحصل على الماء الذي تحتاجه لصنع الغذاء والبقاء.\n3. [مستوى الاستدلال] اقترح استقصاءً لمعرفة هل يحتاج النبات إلى الهواء.\n   الإجابة النموذجية: نضع نبتة في وعاء محكم دون هواء وأخرى في الهواء مع تثبيت الماء والضوء ونقارن النمو.", "للطالب: إكمال تمرين 2-2 (كتاب النشاط ص 25–26) ومراجعة ص 36–37. لولي الأمر: يُرجى مناقشة الابن في أهمية النباتات لحياة الإنسان والحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}], "comb": ["الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n1. يعرّف الكائن المنتج والكائن المستهلك (20 دقيقة)\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات (5 دقائق)\nمخرج تعليمي آخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة (15 دقيقة)\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n1. يذكر ما تحتاجه النبا مسبقًا، ملصقات\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلات الاستقصاء المعدّة مسبقًا (ضوء/ظلام، مروية/غير مروية)", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n- الكائن المنتج\n- الكائن المستهلك\n- الطاقة\n- السلسلة الغذائية\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n- صنع الغذاء\n- ضوء الشمس\n- ثاني أكسيد الكربون\n- الأكسجين\n- العامل المؤثر\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- النتائج\n- التفسير\n- الدليل\n- الكائن المنتج\n- الكائن المستهلك", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nيسأل المعلم: ماذا أكلت خلال الـ24 ساعة الماضية؟ ويكتب قائمة على السبورة، ثم يسأل: أيها من النباتات أو مصدره نبات؟ (5 دقائق)\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\nيعرض المعلم نبتتين: إحداهما ذابلة صفراء والأخرى خضراء نضرة، ويسأل: ماذا تتوقع أن تكون الذابلة قد افتقدت؟ (5 دقائق)\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nيضع المعلم أمام الطلبة أصص الاستقصاء التي أعدّها مسبقًا (منذ أسبوع)، ويطلب منهم وصف الفرق دون لمسها. (5 دقائق)", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة — زمن الحصة 40 دقيقة\n\n1. تتبع الطعام إلى النبات: يسأل المعلم عن الأطعمة الحيوانية: الدجاجة ماذا تأكل؟ الخروف ماذا يأكل؟ ويقود إلى أن كل غذاء يعود إلى النبات، والطلبة يكملون سلاسل: ذرة ← دجاجة ← إنسان (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. المنتج والمستهلك: يقدم المعلم المفهومين من ص 36 ويطرح: ماذا لو لم توجد النباتات؟ والطلبة يحددون المنتج والمستهلك في السلسلتين ص 36 (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 1 ص 36: يوجه المعلم ترتيب: سبانخ – طائر – يرقة؛ إنسان – عشب – خروف، والطلبة يرتبون ويرسمون الأسهم (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ: النباتات لا تعتمد على الإنسان، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات — زمن الحصة 40 دقيقة\n\n1. كيف تصنع النباتات الغذاء؟: يشرح المعلم ص 37: في الأوراق، بالطاقة من الشمس، من الماء وثاني أكسيد الكربون، ينتج سكر وأكسجين يُطلق في الهواء؛ وتمتص الجذور المغذيات، والطلبة يرسمون مخططًا للورقة: مدخلات ومخرجات (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. التخطيط لنشاط 2-2: يوجه المجموعات للتخطيط: زوج في الضوء وآخر في الظلام، وزوج يُروى وآخر لا يُروى، مع تثبيت باقي العوامل، والطلبة يحددون العامل المتغير والثوابت ويكتبون التنبؤ ويلصقون الملصقات على الأصص (9 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. تحدّث: الأكسجين: يناقش المعلم: ما الغاز الذي نتنفسه؟ ومن يعيد إنتاجه؟ والطلبة يستنتجون التوازن بين النباتات والحيوانات في الأكسجين وثاني أكسيد الكربون (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحدد مسؤولية متابعة الأصص، والطلبة يجيبون ويتقاسمون مهام المتابعة (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية — زمن الحصة 40 دقيقة\n\n1. تحليل النتائج (أسئلة نشاط 2-2): يوجه المعلم الإجابة عن الأسئلة 1–3: العامل المؤثر، التنبؤ، الدليل، والطلبة يقارنون: نبتة الظلام صفراء لا تنمو، والمحرومة من الماء ذابلة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التفسير العلمي: يربط المعلم النتائج بصنع الغذاء: دون ضوء أو ماء لا يصنع النبات غذاءه، والطلبة يكتبون تفسيرًا لكل نتيجة (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. تمرين 2-2 في كتاب النشاط: يوجه المعلم حل تمرين 2-2 (ص 25–26): حاجات النبات وتحديد المنتج والمستهلكات وترتيب سلسلة، والطلبة يحلون فرديًا ثم يصححون مع المعلم (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n5. غلق الدرس – سلسلة تبدأ بالسمر: تكوّن الأزواج سلاسل غذائية تبدأ بنباتات عمانية كالسمر والغاف ثم الحيوانات المستهلكة، وتحدد المنتج والمستهلكين (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تسمى النباتات كائنات منتجة؟\n   الإجابة النموذجية: لأنها تصنع غذاءها بنفسها.\n2. [مستوى التطبيق] في السلسلة: بذور الذرة ← دجاجة ← إنسان، حدد المنتج والمستهلكات.\n   الإجابة النموذجية: المنتج: بذور الذرة. المستهلكات: الدجاجة والإنسان.\n3. [مستوى الاستدلال] ماذا يحدث للحيوانات لو اختفت كل النباتات؟ ولماذا؟\n   الإجابة النموذجية: تموت في النهاية؛ لأن آكلات النباتات لن تجد غذاء، ثم الحيوانات التي تأكلها.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين تصنع النباتات غذاءها؟\n   الإجابة النموذجية: في أوراقها.\n2. [مستوى التطبيق] ما الغاز الذي تأخذه النباتات من الهواء لصنع الغذاء؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n3. [مستوى الاستدلال] في استقصاء الضوء، ما العامل الذي سنغيّره وما العوامل التي نثبّتها؟\n   الإجابة النموذجية: نغير الضوء (ضوء/ظلام)، ونثبت كمية الماء ونوع النبات والتربة والأصيص.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما العامل المؤثر في الاستقصاء الأول؟ وفي الثاني؟\n   الإجابة النموذجية: الأول: الماء. الثاني: ضوء الشمس.\n2. [مستوى التطبيق] صف النبتة التي وُضعت في الظلام.\n   الإجابة النموذجية: لم تنمُ جيدًا وتحولت أوراقها إلى اللون الأصفر.\n3. [مستوى الاستدلال] هل تدعم النتائج تنبؤك؟ ووضح السبب علميًا.\n   الإجابة النموذجية: نعم؛ لأن النبات يحتاج إلى الضوء والماء لصنع غذائه، فلما حُرم أحدهما ضعف نموه.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: إنسان – عشب – خروف.\n   الإجابة النموذجية: عشب ← خروف ← إنسان.\n2. [مستوى التطبيق] بماذا تبدأ كل سلسلة غذائية؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n3. [مستوى الاستدلال] هل يعتمد الإنسان على النبات أم النبات على الإنسان؟ وضح.\n   الإجابة النموذجية: الإنسان يعتمد على النبات في غذائه، أما النبات فيصنع غذاءه بنفسه.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا ينتج النبات عند صنع غذائه؟\n   الإجابة النموذجية: السكر والأكسجين.\n2. [مستوى التطبيق] تنبأ: ماذا سيحدث للنبتة التي لا تُروى؟\n   الإجابة النموذجية: ستذبل وقد تموت لأنها لا تستطيع صنع الغذاء دون ماء.\n3. [مستوى الاستدلال] لماذا نستخدم نبتتين متشابهتين في كل استقصاء؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فيكون الفرق ناتجًا عن العامل المتغير وحده.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: أسد – شجرة – حمار وحشي.\n   الإجابة النموذجية: شجرة ← حمار وحشي ← أسد.\n2. [مستوى التطبيق] لماذا ذبلت النبتة غير المروية؟\n   الإجابة النموذجية: لأنها لم تحصل على الماء الذي تحتاجه لصنع الغذاء والبقاء.\n3. [مستوى الاستدلال] اقترح استقصاءً لمعرفة هل يحتاج النبات إلى الهواء.\n   الإجابة النموذجية: نضع نبتة في وعاء محكم دون هواء وأخرى في الهواء مع تثبيت الماء والضوء ونقارن النمو.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nللطالب: قراءة كتاب الطالب ص 36 وكتابة سلسلتين غذائيتين من طعام العائلة. لولي الأمر: يُرجى مناقشة الابن في مصادر طعام وجبة العشاء.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\nللطالب: متابعة الأصص يوميًا وتسجيل الملاحظات (الطول ولون الأوراق) في جدول. لولي الأمر: يُرجى تشجيع الابن على زراعة بذرة في المنزل ومتابعة نموها.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nللطالب: إكمال تمرين 2-2 (كتاب النشاط ص 25–26) ومراجعة ص 36–37. لولي الأمر: يُرجى مناقشة الابن في أهمية النباتات لحياة الإنسان والحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"id": "2-3", "title": "الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38–39 | كتاب النشاط ص 27–28، 63 | دليل المعلم ص 51–54", "n": 5, "per": [{"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38 | دليل المعلم ص 51–53", "num": "الحصة الأولى من 5", "focus": "المفترس والفريسة"}, "f": ["1. يعرّف المفترس والفريسة (5 دقائق)\n2. يميّز المفترس من الفريسة في أمثلة مصورة (20 دقيقة)\nمخرج تعليمي آخر: يصف بعض طرق المفترسات في اصطياد فرائسها (15 دقيقة)", "1. يعرّف المفترس والفريسة. ← تذكر\n2. يميّز المفترس من الفريسة في أمثلة مصورة. ← فهم\nالمخرج الآخر: يصف بعض طرق المفترسات في اصطياد فرائسها. ← فهم", "- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- المفترس\n- الفريسة\n- الكائن المستهلك\n- الحيوانات آكلة النباتات", "يعرض المعلم صور حيوانات مختلطة، ويسأل: أي هذه الحيوانات يأكل حيوانًا آخر؟ وأيها يُؤكل؟ (5 دقائق)", "1. المصطلحات والأمثلة: يقدم المعلم المفترس والفريسة بأمثلة ص 38: البومة والفأر، الثعبان، الضفدع والحشرات، والطلبة يكتبون التعريفين ويضيفون أمثلة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. لعبة «مفترس أو فريسة؟»: يعرض المعلم بطاقات حيوانات تباعًا، ومنها ما يكون مفترسًا وفريسة معًا (السحلية)، والطلبة يرفعون بطاقة (مفترس/فريسة/كلاهما) ويبررون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. طرق الافتراس: يناقش المعلم: السم لدى بعض الثعابين، الابتلاع، الصيد ليلًا للبومة، والطلبة يرسمون حيوانًا مفترسًا ويكتبون طريقة صيده (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالمفترس؟\n   الإجابة النموذجية: حيوان مستهلك يصطاد الحيوانات الأخرى ويتغذى عليها.\n2. [مستوى التطبيق] في الزوج (البومة، الفأر)، من الفريسة؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] لماذا يمكن أن تكون السحلية مفترسًا وفريسة في الوقت نفسه؟\n   الإجابة النموذجية: لأنها تأكل الجراد فتكون مفترسًا، ويأكلها الصقر فتكون فريسة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفريسة؟\n   الإجابة النموذجية: الحيوان الذي تصطاده الحيوانات المفترسة وتتغذى عليه.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من بيئتك.\n   الإجابة النموذجية: مثل: القط والفأر، أو الطائر والجرادة (تقبل الأمثلة الصحيحة).\n3. [مستوى الاستدلال] هل كل المستهلكات مفترسات؟ وضح بمثال.\n   الإجابة النموذجية: لا؛ فبعضها يتغذى على النباتات فقط مثل الخروف والجمل.", "للطالب: قراءة كتاب الطالب ص 38 وكتابة ثلاثة أزواج (مفترس – فريسة). لولي الأمر: يُرجى مشاهدة مقطع وثائقي قصير عن الحياة البرية مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38–39 | دليل المعلم ص 52–53", "num": "الحصة الثانية من 5", "focus": "سلاسل غذائية بها أكثر من مفترس"}, "f": ["1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته (20 دقيقة)\n2. يحدد النمط المشترك في السلاسل الغذائية (10 دقائق)\nمخرج تعليمي آخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس (10 دقائق)", "1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته. ← تطبيق\n2. يحدد النمط المشترك في السلاسل الغذائية. ← تحليل\nالمخرج الآخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس. ← تحليل", "- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: بطاقات كائنات حية وخيوط لبناء سلاسل معلّقة", "- سلسلة غذائية\n- المفترس الأعلى\n- النمط\n- الكائن المنتج", "يكتب المعلم على السبورة: «نباتات ← جراد ← سحلية ← صقر» ويسأل: كم مفترسًا في هذه السلسلة؟ (5 دقائق)", "1. السؤال 1 ص 39: يوجه المعلم الربط بين المفترسات الخمسة وفرائسها في الشكل، والطلبة يصلون بين كل مفترس وفريسته (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. سلاسل معلّقة: يوزع المعلم بطاقات كائنات على المجموعات لبناء سلاسل معلّقة بالخيوط تبدأ بالمنتج، والطلبة يبنون سلسلتين ويحددون المنتج والفريسة والمفترس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. السؤالان 3 و4: النمط: يقود المعلم المقارنة بين سلاسل المجموعات، والطلبة يستنتجون النمط: منتج ← فريسة (آكل نبات) ← مفترس (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] بماذا يجب أن تبدأ أي سلسلة غذائية ترسمها؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n2. [مستوى التطبيق] في السلسلة: عشب ← جرادة ← سحلية ← صقر، ما الفريسة الأولى؟\n   الإجابة النموذجية: الجرادة.\n3. [مستوى الاستدلال] ما النمط الذي تسلكه جميع السلاسل التي رسمتموها؟\n   الإجابة النموذجية: تبدأ بمنتج يتغذى عليه مستهلك (فريسة) ثم يأكله مفترس.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ارسم سلسلة غذائية بها مفترسان.\n   الإجابة النموذجية: مثل: نبات ← جراد ← سحلية ← صقر.\n2. [مستوى التطبيق] أي كائن في سلسلتك لا يأكله غيره؟\n   الإجابة النموذجية: المفترس الأعلى (مثل الصقر).\n3. [مستوى الاستدلال] لماذا لا تكون السلاسل الغذائية طويلة جدًا عادة؟\n   الإجابة النموذجية: لأن الطاقة تقل في كل حلقة فلا تكفي حلقات كثيرة (تقبل الإجابة المبسطة).", "للطالب: رسم سلسلة غذائية من موطنه المحلي بها مفترس وفريسته (السؤال 2 ص 39). لولي الأمر: يُرجى مساعدة الابن في معرفة أسماء حيوانات منطقته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | دليل المعلم ص 53", "num": "الحصة الثالثة من 5", "focus": "أعداد المفترسات والفرائس وتأثير اختلال السلسلة"}, "f": ["1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات (15 دقيقة)\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية (10 دقائق)\nمخرج تعليمي آخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه (15 دقيقة)", "1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات. ← تحليل\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية. ← تطبيق\nالمخرج الآخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه. ← تقييم", "- التعلم المبني على اللعب\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: بطاقات ملوّنة لمحاكاة أعداد المنتجات والفرائس والمفترسات", "- أعداد الكائنات\n- التوازن\n- الآثار المترتبة\n- التنبؤ", "يوزع المعلم 20 بطاقة خضراء (نباتات) و6 صفراء (آكلات نبات) وبطاقة حمراء واحدة (مفترس)، ويسأل: لماذا تتوقع هذه الأعداد؟ (5 دقائق)", "1. محاكاة الهرم الغذائي: يدير المعلم جولات: كل آكل نبات يحتاج 3 نباتات، والمفترس يحتاج آكلي نبات ليبقى، والطلبة يجرون الجولات ويسجلون من بقي ومن هلك (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. ماذا لو؟: يطرح المعلم مواقف: اختفاء المفترس؛ اختفاء العشب؛ زيادة الجراد، والطلبة يتنبؤون بالنتائج في ثنائيات ويعرضونها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تصحيح المفاهيم الخاطئة: يوضح المعلم أن المفترس يأكل بعض الكائنات لا كلها، وأن الفرائس أكثر عددًا، والطلبة يكتبون عبارتين صحيحتين في الدفتر (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أيهما أكثر عددًا في الموطن عادة: الفرائس أم المفترسات؟\n   الإجابة النموذجية: الفرائس.\n2. [مستوى التطبيق] ماذا يحدث لأعداد الجراد إذا اختفت السحالي؟\n   الإجابة النموذجية: تزداد أعداد الجراد.\n3. [مستوى الاستدلال] ثم ماذا يحدث للنباتات بعد زيادة الجراد؟ وما أثر ذلك على الجراد نفسه لاحقًا؟\n   الإجابة النموذجية: تقل النباتات لأن الجراد يأكلها، ثم يقل الجراد لنقص الغذاء.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج الموطن إلى نباتات كثيرة؟\n   الإجابة النموذجية: لأنها غذاء لعدد كبير من آكلات النباتات التي تعتمد عليها السلسلة كلها.\n2. [مستوى التطبيق] صحح العبارة: «الأسد يأكل كل الحيوانات الموجودة أسفل منه في السلسلة».\n   الإجابة النموذجية: الأسد يأكل بعض الحيوانات فقط وليس كلها.\n3. [مستوى الاستدلال] ماذا يحدث للنباتات إذا ماتت كل المفترسات فجأة؟ وضح بالتسلسل.\n   الإجابة النموذجية: تزداد آكلات النباتات فتأكل النباتات بكثرة حتى تقل، ثم تموت كثير من الحيوانات جوعًا." بة يصححون بالقلم الأخضر (تقييم ذاتي) (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر كائنين منتجين في السافانا.\n   الإجابة النموذجية: شجرة الأكاسيا والحشائش.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من التمرين.\n   الإجابة النموذجية: الأسد وغزال الإمبالا (أو الحمار الوحشي).\n3. [مستوى الاستدلال] اكتب سلسلة من أربع حلقات من التمرين.\n   الإجابة النموذجية: حشائش ← حمار وحشي ← ضبع ← أسد.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أكمل: النباتات هي الكائنات الوحيدة التي تصنع ____ بنفسها.\n   الإجابة النموذجية: الغذاء.\n2. [مستوى التطبيق] ما الغاز الناتج عندما تصنع النباتات غذاءها؟\n   الإجابة النموذجية: الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعدّ الحمار الوحشي كائنًا مستهلكًا؟\n   الإجابة النموذجية: لأنه لا يصنع غذاءه بل يتغذى على العشب.", "للطالب: حل تمرين 2-3 في كتاب النشاط ص 27–28 واجبًا منزليًا إن لم يكتمل. لولي الأمر: يُرجى تصحيح الواجب مع الابن وتشجيعه على تقييم عمله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | كتاب النشاط ص 63 | دليل المعلم ص 53–54", "num": "الحصة الخامسة من 5", "focus": "النبات آكل الحشرات ومراجعة الكائنات المستهلكة"}, "f": ["1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط (10 دقائق)\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة (15 دقيقة)\nمخرج تعليمي آخر: يقيّم ملصقات زملائه وفق معايير محددة (15 دقيقة)", "1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط. ← تحليل\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه وفق معايير محددة. ← تقييم", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: أوراق ملصقات كبيرة", "- النبات آكل الحشرات\n- المغذيات\n- التربة الفقيرة\n- المنتج والمستهلك", "يعرض المعلم مقطعًا قصيرًا لنبات صائد الذباب وهو يُطبق على ذبابة، ويسأل: هل هذا نبات أم حيوان مفترس؟ (5 دقائق)", "1. سؤال التحدي ص 39: يشرح المعلم: ينمو في تربة فقيرة المغذيات، يصنع السكر من ضوء الشمس كغيره، ويأخذ المغذيات من الحشرات؛ أمثلة: نبات الإبريق والدروسيرا، والطلبة يناقشون: هل هو منتج أم مستهلك؟ ولماذا لا يلائم النمط؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ملصق السلسلة المحلية: يحدد المعلم معايير الملصق: سلسلة من 3–4 حلقات من البيئة العُمانية، تسميات، ألوان، عنوان، وتصمم المجموعات الملصق وتحدد المنتج والفريسة والمفترس (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. جولة المعرض: يدير المعلم جولة تقييم الأقران بالمعايير، والطلبة يقيّمون ملصقات زملائهم ويقدمون ملاحظة (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. غلق الدرس – مفترس وفريسة في ظفار: تمثل المجموعات علاقات مفترس وفريسة في بيئة عمانية كالنمر العربي في جبال ظفار، وتتحدث عن حمايته من الانقراض (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يصطاد النبات آكل الحشرات الذباب؟\n   الإجابة النموذجية: ليحصل على المغذيات من أجسامها لأن تربته فقيرة بالمغذيات.\n2. [مستوى التطبيق] هل يصنع النبات آكل الحشرات السكر بنفسه؟\n   الإجابة النموذجية: نعم، يصنعه من ضوء الشمس مثل النباتات الأخرى.\n3. [مستوى الاستدلال] لماذا يُعد هذا النبات مثالًا «غير ملائم للنمط»؟\n   الإجابة النموذجية: لأن النمط المعتاد أن الحيوان يأكل النبات، أما هنا فالنبات يصطاد الحيوان.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر اسم نبات آكل للحشرات.\n   الإجابة النموذجية: نبات الإبريق أو الدروسيرا أو صائد الذباب.\n2. [مستوى التطبيق] في ملصقك، حدد المنتج والمفترس الأعلى.\n   الإجابة النموذجية: تعتمد على الملصق، مثل: عشب (منتج) وصقر (مفترس أعلى).\n3. [مستوى الاستدلال] صمم سؤالًا لزملائك عن السلاسل الغذائية مع إجابته.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها الصحيحة.", "للطالب: حل ورقة العمل 2-3 (كتاب النشاط ص 63) إن لم تكتمل، ومراجعة ص 38–39. لولي الأمر: يُرجى الاطلاع على الملصق الذي صممه الابن وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}], "comb": ["الحصة 1: المفترس والفريسة\n1. يعرّف المفترس والفريسة (5 دقائق)\n2. يميّز المفترس من الفريسة في أمثلة مصورة (20 دقيقة)\nمخرج تعليمي آخر: يصف بعض طرق المفترسات في اصطياد فرائسها (15 دقيقة)\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته (20 دقيقة)\n2. يحدد النمط المشترك في السلاسل الغذائية (10 دقائق)\nمخرج تعليمي آخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس (10 دقائق)\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات (15 دقيقة)\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية (10 دقائق)\nمخرج تعليمي آخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه (15 دقيقة)\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا (15 دقيقة)\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا (15 دقيقة)\nمخرج تعليمي آخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة (10 دقائق)\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط (10 دقائق)\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة (15 دقيقة)\nمخرج تعليمي آخر: يقيّم ملصقات زملائه وفق معايير محددة (15 دقيقة)", "الحصة 1: المفترس والفريسة\n1. يعرّف المفترس والفريسة. ← تذكر\n2. يميّز المفترس من الفريسة في أمثلة مصورة. ← فهم\nالمخرج الآخر: يصف بعض طرق المفترسات في اصطياد فرائسها. ← فهم\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1
