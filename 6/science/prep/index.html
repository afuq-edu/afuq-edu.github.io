م أن النبض موجة سببها ضغط الدم المندفع من القلب، ويبيّن مواضعه: المعصم وجانب العنق، وعدم استخدام الإبهام، والطلبة يتحسسون النبض في المعصم والعنق (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. نشاط 1-3: قياس النبض: ينظم مجموعات (4–5)، ويقيس نبضه ونبض متطوع على السبورة لتوضيح الاختلاف، والطلبة يعدّون نبضاتهم في دقيقة ثلاث مرات ويسجلون في جدول ويقارنون مع زملائهم (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. حساب المتوسط ومناقشة الأسئلة: يوضح المعلم حساب المتوسط (جمع القياسات ÷ عددها) ويناقش الأسئلة 1–3 ص 23، والطلبة يحسبون متوسطهم ويفسرون اختلاف القياسات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. كتابة التنبؤ: يطرح المعلم السؤال: ماذا سيحدث لنبضك بعد الجري دقيقة؟ ويطلب تنبؤًا مكتوبًا مع تبرير، والطلبة يكتبون تنبؤاتهم ومبرراتهم (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تنفيذ الاستقصاء: يوجّه المعلم قياس النبض في الراحة ثم الجري في المكان دقيقة ثم القياس مباشرة، مع مراعاة السلامة، والطلبة يقيسون ويسجلون في جدول «قبل/بعد التمرين» (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. ورقة العمل 1-3ب: التمثيل بالأعمدة: يشرح المعلم معايير رسم الأعمدة: عنوان، محاور، أعمدة بعرض واحد وارتفاع صحيح، والطلبة يمثلون بيانات المجموعة بالأعمدة باستخدام المسطرة (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الاستنتاج والتقويم: يسأل المعلم: هل تدعم نتائجك تنبؤك؟ ولماذا يزيد النبض؟ والطلبة يكتبون استنتاجًا ويجيبون عن التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 2: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة — زمن الحصة 40 دقيقة\n1. تمرين 1-3: تحليل بيانات مجموعة: يوجّه المعلم حل تمرين 1-3 (كتاب النشاط ص 18): حساب المتوسط وتحديد النتيجة الشاذة (نبض أحمد 110)، والطلبة يحسبون المتوسط ويفسرون سبب النتيجة الشاذة (قيس أثناء الرياضة) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 1-3أ أو 1-3ج (حسب المستوى): يوزّع المعلم 1-3أ (مقارنة دقات قلوب الحيوانات) للمستوى المرتفع و1-3ج (تمثيل خطي) للبقية مع الدعم، والطلبة يرتبون الكائنات ويستخرجون النمط، أو يرسمون التمثيل الخطي ويقرؤونه (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. عرض الاستنتاجات: يقود المعلم مناقشة: الكائنات الكبيرة دقات قلبها أبطأ؛ ولماذا نعيد القياس عند نتيجة شاذة، وتعرض المجموعات استنتاجاتها وتتنبأ بنبض الحصان وذبابة الفيل (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – نبض بعد الرزحة: يقيس الأطفال نبضهم قبل أداء حركة رقصة شعبية عمانية كالرزحة وبعدها، ويقارنون القراءات ويفسرون زيادة النبض (5 دقائق)\nالاستراتيجيات: التعلم بالاستقصاء.", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يمكنك أن تشعر بنبضك بسهولة؟\n   الإجابة النموذجية: في المعصم وعلى جانبي العنق.\n2. [مستوى التطبيق] لماذا لا نستخدم الإبهام لقياس النبض؟\n   الإجابة النموذجية: لأن للإبهام نبضه الخاص فيختلط بنبض الشخص المقيس.\n3. [مستوى الاستدلال] قاس طالب نبضه: 88، 92، 90. احسب المتوسط، ولماذا اختلفت القياسات؟\n   الإجابة النموذجية: المتوسط = (88+92+90)÷3 = 90 نبضة/دقيقة؛ تختلف لتغيّر النشاط أو القلق أو أخطاء العدّ.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما العامل الذي غيّرناه في هذا الاستقصاء؟\n   الإجابة النموذجية: ممارسة الرياضة (النشاط البدني).\n5. [مستوى التطبيق] ماذا حدث لمعدل النبض بعد التمرين؟\n   الإجابة النموذجية: ازداد معدل النبض.\n6. [مستوى الاستدلال] هل تدعم بياناتك تنبؤك؟ استشهد برقمين من جدولك.\n   الإجابة النموذجية: نعم إذا كان النبض بعد التمرين أعلى من قبله (مثل 90 قبل و130 بعد)، ويُقبل التبرير بالأرقام.\n\nالحصة 2: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] في بيانات مجموعة كانت أغلب القيم قرب 90 وقيمة واحدة 110. ماذا نسمي هذه القيمة؟\n   الإجابة النموذجية: نتيجة لا تلائم النمط (نتيجة شاذة).\n2. [مستوى التطبيق] ما النمط بين حجم الحيوان وسرعة دقات قلبه؟\n   الإجابة النموذجية: كلما كان الحيوان أصغر كانت دقات قلبه أسرع.\n3. [مستوى الاستدلال] كيف نتصرف عند ظهور نتيجة لا تلائم النمط؟\n   الإجابة النموذجية: نفحص طريقة القياس ونعيده للتأكد من عدم وجود خطأ ونبحث عن سبب مختلف للظروف.", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين دقات القلب والنبض؟\n   الإجابة النموذجية: دقات القلب انقباض عضلة القلب لضخ الدم، والنبض هو الضغط الناتج عن اندفاع الدم في الأوعية ونشعر به في المعصم والعنق.\n2. [مستوى التطبيق] كم يبلغ تقريبًا معدل نبض طفل في حالة الراحة؟\n   الإجابة النموذجية: نحو 90 نبضة في الدقيقة.\n3. [مستوى الاستدلال] لماذا نكرر قياس النبض أكثر من مرة؟\n   الإجابة النموذجية: لنحصل على نتائج أكثر موثوقية ونكتشف الأخطاء ونحسب المتوسط.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] لماذا يزداد معدل النبض أثناء الرياضة؟\n   الإجابة النموذجية: لأن العضلات تحتاج مزيدًا من الغذاء والأكسجين فيضخ القلب الدم بسرعة أكبر.\n5. [مستوى التطبيق] اذكر معيارين لرسم تمثيل بياني بالأعمدة صحيح.\n   الإجابة النموذجية: عنوان مناسب، أعمدة متساوية العرض بارتفاعات صحيحة وتسميات واضحة.\n6. [مستوى الاستدلال] اقترح عاملًا آخر قد يغيّر معدل النبض وكيف تختبره.\n   الإجابة النموذجية: مثل القلق أو العمر أو المرض؛ نقيس النبض لأشخاص في حالتين مختلفتين مع تثبيت بقية العوامل.\n\nالحصة 2: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] أيهما دقات قلبه أسرع: الحوت الأزرق أم طائر الطنان؟\n   الإجابة النموذجية: طائر الطنان.\n2. [مستوى التطبيق] تنبأ: هل دقات قلب الحصان أسرع أم أبطأ من دقات قلب القطة؟ ولماذا؟\n   الإجابة النموذجية: أبطأ؛ لأن الحصان أكبر حجمًا والكائنات الكبيرة دقات قلبها أبطأ.\n3. [مستوى الاستدلال] لماذا تنخفض دقات قلب الخفاش كثيرًا أثناء السبات؟\n   الإجابة النموذجية: لأن عملياته الحيوية تبطؤ ويحتاج قليلًا جدًا من الغذاء والأكسجين وهو غير نشط.", "الحصة 1: الفرق بين دقات القلب والنبض وقياس معدل النبض\nللطالب: قياس النبض في المنزل بعد الغداء وقبل النوم وتسجيل النتائج لمقارنتها في الحصة القادمة (كتاب الطالب ص 22). لولي الأمر: يُرجى مساعدة الابن في توقيت الدقيقة أثناء القياس.\nللطالب: إكمال ورقة العمل 1-3ب (كتاب النشاط ص 55) إن لم تكتمل، ومراجعة ص 23. لولي الأمر: يُرجى تشجيع الابن على ممارسة الرياضة يوميًا وقياس نبضه قبلها وبعدها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3\n\nالحصة 2: تحليل بيانات النبض: الأنماط والنتائج غير الملائمة\nللطالب: إكمال ورقة العمل التي بدأها (1-3أ ص 53–54 أو 1-3ج ص 56) ومراجعة ما تعلمه في ص 23. لولي الأمر: يُرجى مناقشة الابن في سبب ارتفاع النبض عند الركض أو الخوف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=3"]}, {"id": "1-4", "title": "الرئتان والتنفس", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 24–25 | كتاب النشاط ص 19، 57–58 | دليل المعلم ص 32–34", "n": 2, "per": [{"h": {"lesson": "1-4 الرئتان والتنفس", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 24–25 | دليل المعلم ص 32–34", "num": "الحصة الأولى من 2", "focus": "الشهيق والزفير ومسار الهواء إلى الرئتين"}, "f": ["1. يصف ما يحدث للصدر والرئتين أثناء الشهيق والزفير (15 دقيقة)\n2. يتتبع مسار الهواء من الأنف أو الفم عبر القصبة الهوائية إلى الرئتين (10 دقائق)\nمخرج تعليمي آخر: يوضح أننا نأخذ الأكسجين في الشهيق ونتخلص من ثاني أكسيد الكربون في الزفير (15 دقيقة)", "1. يصف ما يحدث للصدر والرئتين أثناء الشهيق والزفير. ← فهم\n2. يتتبع مسار الهواء من الأنف أو الفم عبر القصبة الهوائية إلى الرئتين. ← تذكر\nالمخرج الآخر: يوضح أننا نأخذ الأكسجين في الشهيق ونتخلص من ثاني أكسيد الكربون في الزفير. ← فهم", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: بالون لكل طالب", "- الرئتان\n- الشهيق\n- الزفير\n- القصبة الهوائية\n- الحجاب الحاجز", "يسأل المعلم: ما الشيء الذي تفعله 15–20 مرة في الدقيقة دون أن تفكر فيه؟ ويستمع للإجابات حتى يصل إلى «التنفس». (5 دقائق)", "1. نشاط 1-4: استقصاء التنفس: يوضح المعلم وضع اليدين على القفص الصدري، ويطلب شهيقًا عميقًا ثم زفيرًا، ثم نفخ بالون (بالون لكل طالب دون مشاركة)، والطلبة يصفون اتساع الصدر وانكماشه، ويلاحظون انتفاخ البالون بهواء الزفير (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مسار الهواء: يعرض المعلم نموذجًا/مقطعًا للجهاز التنفسي وشكل ص 25، ويتتبع: الأنف/الفم ← القصبة الهوائية ← الرئتان، ودور الحجاب الحاجز، والطلبة يرسمون مخططًا سهميًا لمسار الهواء ويكتبون أسماء الأجزاء (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أسئلة الكتاب 1–3: يناقش المعلم الأسئلة 1–3 ص 24 ويصحح المفهوم الخاطئ: الرئتان إسفنجيتان وليستا كيسين مجوفين، والطلبة يجيبون ويناقشون الفرق بين البالون والرئة (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث لحجم الصدر عند الشهيق؟\n   الإجابة النموذجية: يكبر لأن الرئتين تمتلئان بالهواء.\n2. [مستوى التطبيق] رتب مسار الهواء: الرئتان، الأنف، القصبة الهوائية.\n   الإجابة النموذجية: الأنف ← القصبة الهوائية ← الرئتان.\n3. [مستوى الاستدلال] لماذا لا يُعدّ البالون تمثيلًا دقيقًا تمامًا للرئة؟\n   الإجابة النموذجية: لأن الرئة ليست كيسًا مجوفًا بل نسيج إسفنجي من حويصلات هوائية صغيرة كثيرة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغاز الذي نحصل عليه في الشهيق؟\n   الإجابة النموذجية: الأكسجين.\n2. [مستوى التطبيق] اشرح كيف نفخت البالون.\n   الإجابة النموذجية: أخرجت هواء الزفير من رئتيّ فدخل البالون فزاد حجمه وانتفخ.\n3. [مستوى الاستدلال] ماذا يحدث للأكسجين بعد دخوله الرئتين؟\n   الإجابة النموذجية: ينتقل إلى الدم فيحمله إلى القلب ثم إلى باقي أجزاء الجسم.", "للطالب: قراءة كتاب الطالب ص 24–25 ورسم مسار الهواء في الدفتر. لولي الأمر: يُرجى توعية الابن بأضرار التدخين على الرئتين ومراعاة من يعاني من الربو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=4"]}, {"h": {"lesson": "1-4 الرئتان والتنفس", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثاني (13–17/9/2026)", "pages": "كتاب الطالب ص 24–25 | كتاب النشاط ص 19، 57–58 | دليل المعلم ص 33–34", "num": "الحصة الثانية من 2", "focus": "معدل التنفس وأثر ممارسة الرياضة عليه"}, "f": ["1. يقيس معدل التنفس قبل التمرين وبعده ويسجل النتائج (15 دقيقة)\n2. يفسر زيادة معدل التنفس عند ممارسة الرياضة (10 دقائق)\nمخرج تعليمي آخر: يقترح عاملًا آخر يؤثر في معدل التنفس مثل اللياقة البدنية (15 دقيقة)", "1. يقيس معدل التنفس قبل التمرين وبعده ويسجل النتائج. ← تطبيق\n2. يفسر زيادة معدل التنفس عند ممارسة الرياضة. ← فهم\nالمخرج الآخر: يقترح عاملًا آخر يؤثر في معدل التنفس مثل اللياقة البدنية. ← تحليل", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- الأقلام\n- السبورة التقليدية\n- أخرى: ساعة إيقاف، ورقة العمل 1-4", "- معدل التنفس\n- التمثيل الخطي\n- اللياقة البدنية\n- تبادل الغازات", "يطلب المعلم من الطلبة تذكّر ما حدث لنبضهم بعد الجري، ويسأل: هل يتغير تنفسنا أيضًا؟ كيف يمكن أن نقيس ذلك؟ (5 دقائق)", "1. ورقة العمل 1-4: استقصاء معدل التنفس: ينظم ثنائيات، ويوجه عدّ مرات التنفس في الدقيقة بمراقبة صعود الصدر وهبوطه، قبل التمرين وبعده وعلى فترات، والطلبة يقيسون ويسجلون النتائج في جدول (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التمثيل الخطي: يوجه المعلم رسم التمثيل الخطي لمعدل التنفس مع الزمن ويقدم الدعم للمتعثرين بالتعاون مع زملائهم، والطلبة يرسمون ويحددون أعلى وأدنى معدل (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 1-4 والسؤال 4: يوجه المعلم تمرين 1-4 (كتاب النشاط ص 19: رسم الرئتين ومسار الهواء) ومناقشة السؤال 4 ص 24، والطلبة يرسمون ويكتبون الأسماء ويفسرون سرعة التنفس (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – أنفاس الجبل الأخضر: تتتبع المجموعات مسار الهواء من الأنف إلى الرئتين، وتناقش لماذا يشعر الناس بانتعاش في هواء الجبل الأخضر النقي، وأهمية حماية الهواء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] كيف تعدّ أنفاس زميلك في الدقيقة؟\n   الإجابة النموذجية: بمراقبة صعود صدره وهبوطه وعدّ المرات خلال دقيقة بساعة إيقاف.\n2. [مستوى التطبيق] متى كان معدل التنفس في أعلى مستوى في جدولك؟\n   الإجابة النموذجية: بعد التمرين مباشرة (والإجابة تعتمد على بيانات الطالب).\n3. [مستوى الاستدلال] لماذا لا يزيد معدل تنفس الرياضي كثيرًا عند التمرين مقارنة بغيره؟\n   ال تشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: بالون لكل طالب\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- الكتاب\n- الأقلام\n- السبورة التقليدية\n- أخرى: ساعة إيقاف، ورقة العمل 1-4", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- الرئتان\n- الشهيق\n- الزفير\n- القصبة الهوائية\n- الحجاب الحاجز\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- معدل التنفس\n- التمثيل الخطي\n- اللياقة البدنية\n- تبادل الغازات", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nيسأل المعلم: ما الشيء الذي تفعله 15–20 مرة في الدقيقة دون أن تفكر فيه؟ ويستمع للإجابات حتى يصل إلى «التنفس». (5 دقائق)\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nيطلب المعلم من الطلبة تذكّر ما حدث لنبضهم بعد الجري، ويسأل: هل يتغير تنفسنا أيضًا؟ كيف يمكن أن نقيس ذلك؟ (5 دقائق)", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين — زمن الحصة 40 دقيقة\n\n1. نشاط 1-4: استقصاء التنفس: يوضح المعلم وضع اليدين على القفص الصدري، ويطلب شهيقًا عميقًا ثم زفيرًا، ثم نفخ بالون (بالون لكل طالب دون مشاركة)، والطلبة يصفون اتساع الصدر وانكماشه، ويلاحظون انتفاخ البالون بهواء الزفير (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مسار الهواء: يعرض المعلم نموذجًا/مقطعًا للجهاز التنفسي وشكل ص 25، ويتتبع: الأنف/الفم ← القصبة الهوائية ← الرئتان، ودور الحجاب الحاجز، والطلبة يرسمون مخططًا سهميًا لمسار الهواء ويكتبون أسماء الأجزاء (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أسئلة الكتاب 1–3: يناقش المعلم الأسئلة 1–3 ص 24 ويصحح المفهوم الخاطئ: الرئتان إسفنجيتان وليستا كيسين مجوفين، والطلبة يجيبون ويناقشون الفرق بين البالون والرئة (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 1-4: استقصاء معدل التنفس: ينظم ثنائيات، ويوجه عدّ مرات التنفس في الدقيقة بمراقبة صعود الصدر وهبوطه، قبل التمرين وبعده وعلى فترات، والطلبة يقيسون ويسجلون النتائج في جدول (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التمثيل الخطي: يوجه المعلم رسم التمثيل الخطي لمعدل التنفس مع الزمن ويقدم الدعم للمتعثرين بالتعاون مع زملائهم، والطلبة يرسمون ويحددون أعلى وأدنى معدل (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 1-4 والسؤال 4: يوجه المعلم تمرين 1-4 (كتاب النشاط ص 19: رسم الرئتين ومسار الهواء) ومناقشة السؤال 4 ص 24، والطلبة يرسمون ويكتبون الأسماء ويفسرون سرعة التنفس (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – أنفاس الجبل الأخضر: تتتبع المجموعات مسار الهواء من الأنف إلى الرئتين، وتناقش لماذا يشعر الناس بانتعاش في هواء الجبل الأخضر النقي، وأهمية حماية الهواء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث لحجم الصدر عند الشهيق؟\n   الإجابة النموذجية: يكبر لأن الرئتين تمتلئان بالهواء.\n2. [مستوى التطبيق] رتب مسار الهواء: الرئتان، الأنف، القصبة الهوائية.\n   الإجابة النموذجية: الأنف ← القصبة الهوائية ← الرئتان.\n3. [مستوى الاستدلال] لماذا لا يُعدّ البالون تمثيلًا دقيقًا تمامًا للرئة؟\n   الإجابة النموذجية: لأن الرئة ليست كيسًا مجوفًا بل نسيج إسفنجي من حويصلات هوائية صغيرة كثيرة.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] كيف تعدّ أنفاس زميلك في الدقيقة؟\n   الإجابة النموذجية: بمراقبة صعود صدره وهبوطه وعدّ المرات خلال دقيقة بساعة إيقاف.\n2. [مستوى التطبيق] متى كان معدل التنفس في أعلى مستوى في جدولك؟\n   الإجابة النموذجية: بعد التمرين مباشرة (والإجابة تعتمد على بيانات الطالب).\n3. [مستوى الاستدلال] لماذا لا يزيد معدل تنفس الرياضي كثيرًا عند التمرين مقارنة بغيره؟\n   الإجابة النموذجية: لأن قلبه ورئتيه أكثر كفاءة في إيصال الأكسجين إلى العضلات فيحتاج أنفاسًا أقل.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغاز الذي نحصل عليه في الشهيق؟\n   الإجابة النموذجية: الأكسجين.\n2. [مستوى التطبيق] اشرح كيف نفخت البالون.\n   الإجابة النموذجية: أخرجت هواء الزفير من رئتيّ فدخل البالون فزاد حجمه وانتفخ.\n3. [مستوى الاستدلال] ماذا يحدث للأكسجين بعد دخوله الرئتين؟\n   الإجابة النموذجية: ينتقل إلى الدم فيحمله إلى القلب ثم إلى باقي أجزاء الجسم.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نتنفس أسرع عند ممارسة الرياضة؟\n   الإجابة النموذجية: لأن الجسم يحتاج إلى مزيد من الأكسجين للعضلات.\n2. [مستوى التطبيق] ما الجهاز الذي يتعاون مع الجهاز التنفسي لإيصال الأكسجين؟\n   الإجابة النموذجية: الجهاز الدوري.\n3. [مستوى الاستدلال] صمّم طريقة لمقارنة معدل التنفس لدى شخصين مختلفين في اللياقة بشكل عادل.\n   الإجابة النموذجية: يمارسان التمرين نفسه للمدة نفسها، ويقاس تنفسهما بالطريقة نفسها قبل التمرين وبعده مباشرة.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nللطالب: قراءة كتاب الطالب ص 24–25 ورسم مسار الهواء في الدفتر. لولي الأمر: يُرجى توعية الابن بأضرار التدخين على الرئتين ومراعاة من يعاني من الربو.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nللطالب: حل تمرين 1-4 (كتاب النشاط ص 19) وإكمال ورقة العمل 1-4 (ص 57–58). لولي الأمر: يُرجى تشجيع الابن على ممارسة نشاط بدني منتظم للمحافظة على لياقة القلب والرئتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=4"]}, {"id": "1-5", "title": "الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | كتاب النشاط ص 20، 47، 59 | دليل المعلم ص 34–37", "n": 2, "per": [{"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | دليل المعلم ص 34–36", "num": "الحصة الأولى من 3", "focus": "حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية"}, "f": ["1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه (5 دقائق)\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها (5 دقائق)\n3. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته (10 دقائق)\n4. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة (5 دقائق)\n\nمخرج تعليمي آخر:\nيقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم (10 دقائق)\nيميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال (5 دقائق)", "1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه. ← فهم\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها. ← تذكر\n3. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته. ← فهم\n4. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة. ← إبداع\nالمخرج الآخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم. ← فهم\nالمخرج الآخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال. ← تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- العصف الذهني\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم المبني على المشاريع", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: بكرة خيط بطول 7 أمتار\n- نماذج مجسمة\n- أخرى: بطاقات ورقة المصادر 1-5، أنابيب وزجاجات وأكياس بلاستيكية لصنع النموذج", "- الهضم\n- الجهاز الهضمي\n- المريء\n- المعدة\n- الأمعاء\n- الفم\n- العصارة الهضمية\n- الأمعاء الدقيقة\n- الأمعاء الغليظة", "يسأل المعلم: ماذا أكلت اليوم؟ ولماذا نأكل؟ ثم: هل يستطيع الجسم استخدام قطعة الخبز كما هي؟ (5 دقائق)", "1. رحلة الطعام: يعرض المعلم الشكل ص 27 ويشرح: المضغ واللعاب في الفم، المريء، المعدة والعصارة الهضمية، الأمعاء، الإخراج، والطلبة يتتبعون الرحلة بأصابعهم على الشكل ويكتبون الترتيب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. طول الأمعاء الدقيقة: يفرد المعلم خيطًا بطول 7 أمتار تقريبًا في الصف ثم يطويه، ويسأل: كيف تتسع له البطن؟ والطلبة يقيسون بخطواتهم ويستنتجون أن الأمعاء مطوية (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. ملخص مصوّر: يطلب المعلم رسم مخطط سهمي لمسار الطعام، ويقدم الاختصار المساعد للمتعثرين (فم – مريء – معدة – أمعاء)، والطلبة يرسمون المخطط ويضيفون اسمًا لكل جزء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة مطابقة البطاقات: يوزّع المعلم بطاقات ورقة المصادر 1-5 (كتاب النشاط ص 47): صور الأجزاء وأسماؤها ووظائفها مع بطاقات مضلِّلة، وتطابق المجموعات الصورة والاسم والوظيفة، ثم تتحقق مجموعة أخرى (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. بناء نموذج الجهاز الهضمي: يوجّه المجموعات لصنع نموذج من زجاجة (معدة) وأنبوب (مريء) وأنبوب طويل ملفوف (أمعاء)، والطلبة يبنون النموذج ويعلّقون بطاقة وظيفة على كل جزء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. أسئلة الكتاب وتمرين 1-5: يناقش المعلم الأسئلة 1–5 ص 26 ويوجه تمرين 1-5 (كتاب النشاط ص 20)، والطلبة يجيبون ويرتبون الوظائف ترتيبًا صحيحًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج جسمنا إلى الطعام؟\n   الإجابة النموذجية: للنمو والحصول على الطاقة ليعمل بصورة جيدة.\n2. [مستوى التطبيق] ما الجزء الذي يدفع الطعام من الفم إلى المعدة؟\n   الإجابة النموذجية: المريء.\n3. [مستوى الاستدلال] لماذا يجب هضم الطعام قبل أن يستفيد منه الجسم؟\n   الإجابة النموذجية: لأن الجسم لا يستطيع استخدام الطعام بحالته، فيجب تفتيته إلى جزيئات صغيرة يمكن نقلها في الدم.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما وظيفة المعدة؟\n   الإجابة النموذجية: تمزج الطعام بالعصارة الهضمية فيصبح سائلًا سميكًا يشبه العصيدة.\n5. [مستوى التطبيق] ماذا يحدث للطعام داخل الأمعاء الدقيقة؟\n   الإجابة النموذجية: يُفتت إلى جزيئات أصغر تنتقل إلى الدم.\n6. [مستوى الاستدلال] بماذا يرتبط المريء؟ وبماذا ترتبط القصبة الهوائية؟\n   الإجابة النموذجية: المريء يرتبط بالمعدة، والقصبة الهوائية ترتبط بالرئتين.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتّب: الأمعاء – الفم – المعدة – المريء.\n   الإجابة النموذجية: الفم ← المريء ← المعدة ← الأمعاء.\n2. [مستوى التطبيق] ما العضوان الرئيسيان في هضم الطعام؟\n   الإجابة النموذجية: المعدة والأمعاء.\n3. [مستوى الاستدلال] لماذا تكون الأمعاء الدقيقة مطوية داخل البطن؟\n   الإجابة النموذجية: لأن طولها كبير (نحو 7 أمتار عند البالغ) فتُطوى لتتسع لها البطن.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما دور الأسنان في الهضم؟\n   الإجابة النموذجية: تمضغ الطعام وتفتته إلى قطع صغيرة يسهل ابتلاعها.\n5. [مستوى التطبيق] كيف يصل الطعام المهضوم إلى أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الدم.\n6. [مستوى الاستدلال] أي أجزاء نموذجك يمثل المعدة؟ وما الذي ينقص النموذج ليشبه الجهاز الحقيقي؟\n   الإجابة النموذجية: الزجاجة؛ ينقصه مثلًا العصارة الهضمية وحركة العضلات (تقبل الإجابات المنطقية).", "للطالب: قراءة كتاب الطالب ص 26–27 وكتابة ما أكله في يوم كامل. لولي الأمر: يُرجى تشجيع الابن على مضغ الطعام جيدًا وتناول وجبات متوازنة.\nللطالب: حل تمرين 1-5 في كتاب النشاط ص 20 واجبًا منزليًا، ومراجعة ص 27. لولي الأمر: يُرجى تشجيع الابن على شرب الماء وتناول الأطعمة الغنية بالألياف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 27 | كتاب النشاط ص 59 | دليل المعلم ص 36–37", "num": "الحصة الثالثة من 3", "focus": "استقصاء: يبدأ هضم النشا في الفم"}, "f": ["1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان (15 دقيقة)\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم (5 دقائق)\n\nمخرج تعليمي آخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا (20 دقيقة)", "1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان. ← تطبيق\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم. ← تحليل\nالمخرج الآخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا. ← تقييم", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: ورقة العمل 1-5، خبز، نشا الذرة، محلول اليود، قطارة، طبقان", "- النشا\n- اختبار النشا\n- محلول اليود\n- اللعاب\n- الاستنتاج", "يعرض المعلم نشا الذرة ويضيف إليه قطرة يود فيتحول إلى أزرق داكن، ويسأل: ماذا يعني هذا اللون؟ هل يوجد نشا في الخبز؟ (5 دقائق)", "1. اختبار الخبز (ورقة العمل 1-5): يوزع المعلم على المجموعات قطعة خبز في طبق وقطارة يود، والطلبة يضيفون قطرة يود ويلاحظون اللون الأزرق الداكن: يوجد نشا (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أثر المضغ: يطلب المعلم من كل طالب مضغ قطعة خبز نظيفة غير مخصصة للاختبار نحو دقيقة، ويعرض نتيجة عينة مُعدّة مسبقًا لخبز مُعرَّض للعاب، والطلبة يلاحظون تحول الطعم إلى حلو، ويقارنون عدم تغير لون اليود في العينة المعالجة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستنتاج والعادات الصحية: يقود المعلم الاستنتاج: النشا يُهضم في الفم ويتحول إلى سكر؛ ويناقش الألياف والماء والرياضة، والطلبة يكتبون الاستنتاج في ورقة العمل ويقترحون عادات صحية (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – رحلة صحن الهريس: تتتبع المجموعات رحلة لقمة من طبق الهريس العماني في القناة الهضمية بالترتيب، ويمثل كل طفل عضوًا منها (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما لون محلول اليود عند وجود النشا؟\n   الإجابة النموذجية: أزرق داكن.\n2. [مستوى التطبيق] لماذا أصبح طعم الخبز حلوًا بعد المضغ؟\n   الإجابة النموذجية: لأن اللعاب يبدأ هضم النشا فيحوّل جزءًا منه إلى سكر.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق أي مادة في المختبر؟\n   الإجابة النموذجية: لأن بعض المواد مثل اليود ضارة، والسلامة تقتضي عدم تذوق أو ابتلاع المواد المستخدمة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نستنتج من عدم تغير لون اليود في عينة الخبز الممضوغ جيدًا؟\n   الإجابة النموذجية: أن النشا هُضم (تحول إلى سكر) في الفم.\n2. [مستوى التطبيق] ما المادة في الفم التي تساعد على بدء الهضم؟\n   الإجابة النموذجية: اللعاب (العصارة الهضمية في اللعاب).\n3. [مستوى الاستدلال] اقترح ثلاث عادات تساعد جهازك الهضمي.\n   الإجابة النموذجية: مضغ الطعام جيدًا، شرب الماء، تناول الألياف كالفواكه والخضراوات، وممارسة الرياضة.", "للطالب: إكمال إجابات ورقة العمل 1-5 (كتاب النشاط ص 59) ومراجعة الدرس كاملًا. لولي الأمر: يُرجى مساعدة الابن على اختيار أطعمة صحية والإقلال من المشروبات الغازية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}], "comb": ["الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1.  الذرة، محلول اليود، قطارة، طبقان", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- الهضم\n- الجهاز الهضمي\n- المريء\n- المعدة\n- الأمعاء\n- الفم\n- العصارة الهضمية\n- الأمعاء الدقيقة\n- الأمعاء الغليظة\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n- النشا\n- اختبار النشا\n- محلول اليود\n- اللعاب\n- الاستنتاج", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nيسأل المعلم: ماذا أكلت اليوم؟ ولماذا نأكل؟ ثم: هل يستطيع الجسم استخدام قطعة الخبز كما هي؟ (5 دقائق)\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\nيعرض المعلم نشا الذرة ويضيف إليه قطرة يود فيتحول إلى أزرق داكن، ويسأل: ماذا يعني هذا اللون؟ هل يوجد نشا في الخبز؟ (5 دقائق)", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية — زمن الحصة 40 دقيقة\n1. رحلة الطعام: يعرض المعلم الشكل ص 27 ويشرح: المضغ واللعاب في الفم، المريء، المعدة والعصارة الهضمية، الأمعاء، الإخراج، والطلبة يتتبعون الرحلة بأصابعهم على الشكل ويكتبون الترتيب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. طول الأمعاء الدقيقة: يفرد المعلم خيطًا بطول 7 أمتار تقريبًا في الصف ثم يطويه، ويسأل: كيف تتسع له البطن؟ والطلبة يقيسون بخطواتهم ويستنتجون أن الأمعاء مطوية (3 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. ملخص مصوّر: يطلب المعلم رسم مخطط سهمي لمسار الطعام، ويقدم الاختصار المساعد للمتعثرين (فم – مريء – معدة – أمعاء)، والطلبة يرسمون المخطط ويضيفون اسمًا لكل جزء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة مطابقة البطاقات: يوزّع المعلم بطاقات ورقة المصادر 1-5 (كتاب النشاط ص 47): صور الأجزاء وأسماؤها ووظائفها مع بطاقات مضلِّلة، وتطابق المجموعات الصورة والاسم والوظيفة، ثم تتحقق مجموعة أخرى (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. بناء نموذج الجهاز الهضمي: يوجّه المجموعات لصنع نموذج من زجاجة (معدة) وأنبوب (مريء) وأنبوب طويل ملفوف (أمعاء)، والطلبة يبنون النموذج ويعلّقون بطاقة وظيفة على كل جزء (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. أسئلة الكتاب وتمرين 1-5: يناقش المعلم الأسئلة 1–5 ص 26 ويوجه تمرين 1-5 (كتاب النشاط ص 20)، والطلبة يجيبون ويرتبون الوظائف ترتيبًا صحيحًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم — زمن الحصة 40 دقيقة\n1. اختبار الخبز (ورقة العمل 1-5): يوزع المعلم على المجموعات قطعة خبز في طبق وقطارة يود، والطلبة يضيفون قطرة يود ويلاحظون اللون الأزرق الداكن: يوجد نشا (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أثر المضغ: يطلب المعلم من كل طالب مضغ قطعة خبز نظيفة غير مخصصة للاختبار نحو دقيقة، ويعرض نتيجة عينة مُعدّة مسبقًا لخبز مُعرَّض للعاب، والطلبة يلاحظون تحول الطعم إلى حلو، ويقارنون عدم تغير لون اليود في العينة المعالجة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الاستنتاج والعادات الصحية: يقود المعلم الاستنتاج: النشا يُهضم في الفم ويتحول إلى سكر؛ ويناقش الألياف والماء والرياضة، والطلبة يكتبون الاستنتاج في ورقة العمل ويقترحون عادات صحية (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – رحلة صحن الهريس: تتتبع المجموعات رحلة لقمة من طبق الهريس العماني في القناة الهضمية بالترتيب، ويمثل كل طفل عضوًا منها (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا يحتاج جسمنا إلى الطعام؟\n   الإجابة النموذجية: للنمو والحصول على الطاقة ليعمل بصورة جيدة.\n2. [مستوى التطبيق] ما الجزء الذي يدفع الطعام من الفم إلى المعدة؟\n   الإجابة النموذجية: المريء.\n3. [مستوى الاستدلال] لماذا يجب هضم الطعام قبل أن يستفيد منه الجسم؟\n   الإجابة النموذجية: لأن الجسم لا يستطيع استخدام الطعام بحالته، فيجب تفتيته إلى جزيئات صغيرة يمكن نقلها في الدم.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما وظيفة المعدة؟\n   الإجابة النموذجية: تمزج الطعام بالعصارة الهضمية فيصبح سائلًا سميكًا يشبه العصيدة.\n5. [مستوى التطبيق] ماذا يحدث للطعام داخل الأمعاء الدقيقة؟\n   الإجابة النموذجية: يُفتت إلى جزيئات أصغر تنتقل إلى الدم.\n6. [مستوى الاستدلال] بماذا يرتبط المريء؟ وبماذا ترتبط القصبة الهوائية؟\n   الإجابة النموذجية: المريء يرتبط بالمعدة، والقصبة الهوائية ترتبط بالرئتين.\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما لون محلول اليود عند وجود النشا؟\n   الإجابة النموذجية: أزرق داكن.\n2. [مستوى التطبيق] لماذا أصبح طعم الخبز حلوًا بعد المضغ؟\n   الإجابة النموذجية: لأن اللعاب يبدأ هضم النشا فيحوّل جزءًا منه إلى سكر.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق أي مادة في المختبر؟\n   الإجابة النموذجية: لأن بعض المواد مثل اليود ضارة، والسلامة تقتضي عدم تذوق أو ابتلاع المواد المستخدمة.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتّب: الأمعاء – الفم – المعدة – المريء.\n   الإجابة النموذجية: الفم ← المريء ← المعدة ← الأمعاء.\n2. [مستوى التطبيق] ما العضوان الرئيسيان في هضم الطعام؟\n   الإجابة النموذجية: المعدة والأمعاء.\n3. [مستوى الاستدلال] لماذا تكون الأمعاء الدقيقة مطوية داخل البطن؟\n   الإجابة النموذجية: لأن طولها كبير (نحو 7 أمتار عند البالغ) فتُطوى لتتسع لها البطن.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما دور الأسنان في الهضم؟\n   الإجابة النموذجية: تمضغ الطعام وتفتته إلى قطع صغيرة يسهل ابتلاعها.\n5. [مستوى التطبيق] كيف يصل الطعام المهضوم إلى أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الدم.\n6. [مستوى الاستدلال] أي أجزاء نموذجك يمثل المعدة؟ وما الذي ينقص النموذج ليشبه الجهاز الحقيقي؟\n   الإجابة النموذجية: الزجاجة؛ ينقصه مثلًا العصارة الهضمية وحركة العضلات (تقبل الإجابات المنطقية).\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا نستنتج من عدم تغير لون اليود في عينة الخبز الممضوغ جيدًا؟\n   الإجابة النموذجية: أن النشا هُضم (تحول إلى سكر) في الفم.\n2. [مستوى التطبيق] ما المادة في الفم التي تساعد على بدء الهضم؟\n   الإجابة النموذجية: اللعاب (العصارة الهضمية في اللعاب).\n3. [مستوى الاستدلال] اقترح ثلاث عادات تساعد جهازك الهضمي.\n   الإجابة النموذجية: مضغ الطعام جيدًا، شرب الماء، تناول الألياف كالفواكه والخضراوات، وممارسة الرياضة.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nللطالب: قراءة كتاب الطالب ص 26–27 وكتابة ما أكله في يوم كامل. لولي الأمر: يُرجى تشجيع الابن على مضغ الطعام جيدًا وتناول وجبات متوازنة.\nللطالب: حل تمرين 1-5 في كتاب النشاط ص 20 واجبًا منزليًا، ومراجعة ص 27. لولي الأمر: يُرجى تشجيع الابن على شرب الماء وتناول الأطعمة الغنية بالألياف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\nللطالب: إكمال إجابات ورقة العمل 1-5 (كتاب النشاط ص 59) ومراجعة الدرس كاملًا. لولي الأمر: يُرجى مساعدة الابن على اختيار أطعمة صحية والإقلال من المشروبات الغازية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"id": "1-6", "title": "ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 28–29 | كتاب النشاط ص 21، 60 | دليل المعلم ص 37–38", "n": 2, "per": [{"h": {"lesson": "1-6 ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 28–29 | دليل المعلم ص 37–38", "num": "الحصة الأولى من 2", "focus": "الكليتان: موقعهما وشكلهما ووظيفة الإخراج"}, "f": ["1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما (10 دقائق)\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول (10 دقائق)\nمخرج تعليمي آخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج (20 دقيقة)", "1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما. ← تذكر\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول. ← فهم\nالمخرج الآخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج. ← تطبيق", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: وعاء كبير، مخبار مدرج، ماء، حبة فاصوليا للتشبيه", "- الكليتان\n- الإخراج\n- البول\n- الفضلات\n- تنقية الدم", "يسأل المعلم: ماذا يحدث عندما تشرب كمية كبيرة من الماء؟ لماذا تحتاج إلى دورة المياه؟ من المسؤول عن ذلك في جسمك؟ (5 دقائق)", "1. تحديد موقع الكليتين: يوضح المعلم الطريقة ص 28: اليدان على الوركين والإبهامان على الظهر ثم التحريك للأعلى حتى الضلوع؛ ويعرض حبة فاصوليا للتشبيه، والطلبة يحددون موقع الكليتين على أجسامهم ويصفون الشكل والحجم (بحجم فأرة الحاسوب) (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. وظيفة الإخراج: يشرح المعلم: يمر الدم عبر الكليتين نحو 40 مرة يوميًا لتنقيته ويُنتج نحو لتر من البول؛ ويصحح المفهوم الخاطئ أن ماء البول يأتي مباشرة مما نشربه، والطلبة يرسمون مخططًا: دم بفضلات ← الكليتان ← دم نقي + بول (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 1-6: كم يبلغ اللتر؟: يوجه المجموعات لسكب ما يقدرونه لترًا في وعاء ثم قياسه بالمخبار المدرج وجمع القياسات، والطلبة يقدّرون ويقيسون ويسجلون الفرق بين التقدير والقياس (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين توجد الكليتان؟\n   الإجابة النموذجية: في الجزء الخلفي من الجسم، أسفل الضلوع قليلًا.\n2. [مستوى التطبيق] ما اسم السائل الذي تخرج فيه الفضلات من الكليتين؟\n   الإجابة النموذجية: البول.\n3. [مستوى الاستدلال] من أين يأتي الماء الموجود في البول؟\n   الإجابة النموذجية: من الدم؛ إذ يمر الماء من الجهاز الهضمي إلى الدم ثم تأخذ الكليتان الماء الزائد منه.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العملية الرئيسية التي تقوم بها الكليتان؟\n   الإجابة النموذجية: الإخراج.\n2. [مستوى التطبيق] صف شكل الكليتين وحجمهما.\n   الإجابة النموذجية: زوج من الأعضاء على شكل حبة الفاصوليا، بحجم فأرة الحاسوب تقريبًا لدى البالغ.\n3. [مستوى الاستدلال] كيف تحققت من تقديرك لكمية لتر الماء؟\n   الإجابة النموذجية: بقياس الماء بالمخبار المدرج وجمع القياسات ومقارنتها بلتر.", "للطالب: قراءة كتاب الطالب ص 28 وحل تمرين 1-6 في كتاب النشاط ص 21 واجبًا منزليًا. لولي الأمر: يُرجى تذكير الابن بشرب كمية كافية من الماء يوميًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}, {"h": {"lesson": "1-6 ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 29 | كتاب النشاط ص 21، 60 | دليل المعلم ص 38", "num": "الحصة الثانية من 2", "focus": "صحة الكليتين وأهمية شرب الماء"}, "f": ["1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل (10 دقائق)\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد (10 دقائق)\nمخرج تعليمي آخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها (20 دقيقة)", "1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل. ← تذكر\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد. ← تحليل\nالمخرج الآخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها. ← تقييم", "- فكّر – زاوج – شارك\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقة العمل 1-6", "- غسيل الكلى\n- زراعة الكلى\n- التعرق\n- السوائل\n- المرض", "يسأل المعلم: ماذا يحدث لجسمك في يوم حار جدًا؟ ويكتب الأفكار على السبورة حتى يصل إلى «التعرق». (5 دقائق)", "1. عندما تتوقف الكليتان: يشرح المعلم ص 29: إزالة كلية والعيش بواحدة سليمة، غسيل الكلى (ساعات لعدة أيام أسبوعيًا)، زراعة الكلى، والطلبة يطرحون أسئلة ويجيبون عن السؤالين 3 و4 ص 29 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تحدّث عن: الطقس الحار: يقود المعلم نقاش «فكر – زاوج – شارك»: إذا فقدنا ماءً بالتعرق، فماذا يبقى لتكوين البول؟ والطلبة يستنتجون أن البول يقل في الطقس الحار (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. ورقة العمل 1-6: من أين تحصل على السوائل؟: يوجه المعلم إعداد قائمة بالسوائل خلال 24 ساعة وكمياتها، والأطعمة الرطبة، والطلبة يحسبون ما يشربون ويقيّمون: هل يكفي؟ (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – ماء الجحلة والكليتين: تناقش الأزواج دور الكليتين في تنقية الدم وأهمية شرب الماء الكافي في صيف عمان الحار، وتتذكر الجحلة الفخارية لتبريد الماء (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بغسيل الكلى؟\n   الإجابة النموذجية: استخدام جهاز يقوم بعمل الكليتين لتصفية الدم وتنظيفه.\n2. [مستوى التطبيق] لماذا يستطيع الإنسان العيش بكلية واحدة؟\n   الإجابة النموذجية: لأن الكلية الواحدة السليمة تستطيع القيام بعمل التنقية الكافي للجسم.\n3. [مستوى الاستدلال] اذكر أطعمة تزود الجسم بالسوائل إلى جانب المشروبات.\n   الإجابة النموذجية: الفواكه والخضراوات والأرز المطبوخ والمعكرونة واللحوم والأسماك.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أشياء يمكن للأطباء القيام بها عند توقف الكليتين.\n   الإجابة النموذجية: استئصال الكلية التالفة، غسيل الكلى، زراعة كلية.\n2. [مستوى التطبيق] لماذا يفرز الجسم كمية بول أقل في الطقس الحار؟\n   الإجابة النموذجية: لأنه يفقد كمية أكبر من الماء بالتعرق فيبقى ماء زائد أقل لتكوين البول.\n3. [مستوى الاستدلال] اقترح ثلاث نصائح للمحافظة على صحة الكليتين.\n   الإجابة النموذجية: شرب كمية كافية من الماء، التقليل من الملح، عدم حبس البول، والفحص عند الشعور بالألم (تقبل الإجابات المنطقية).", "للطالب: إكمال ورقة العمل 1-6 (كتاب النشاط ص 60) بتسجيل السوائل التي يشربها خلال يوم. لولي الأمر: يُرجى مساعدة الابن في تسجيل كميات السوائل بدقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}], "comb": ["الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما (10 دقائق)\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول (10 دقائق)\nمخرج تعليمي آخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج (20 دقيقة)\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل (10 دقائق)\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد (10 دقائق)\nمخرج تعليمي آخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها (20 دقيقة)", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما. ← تذكر\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد ات ← الكليتان ← دم نقي + بول (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. نشاط 1-6: كم يبلغ اللتر؟: يوجه المجموعات لسكب ما يقدرونه لترًا في وعاء ثم قياسه بالمخبار المدرج وجمع القياسات، والطلبة يقدّرون ويقيسون ويسجلون الفرق بين التقدير والقياس (9 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء — زمن الحصة 40 دقيقة\n\n1. عندما تتوقف الكليتان: يشرح المعلم ص 29: إزالة كلية والعيش بواحدة سليمة، غسيل الكلى (ساعات لعدة أيام أسبوعيًا)، زراعة الكلى، والطلبة يطرحون أسئلة ويجيبون عن السؤالين 3 و4 ص 29 (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تحدّث عن: الطقس الحار: يقود المعلم نقاش «فكر – زاوج – شارك»: إذا فقدنا ماءً بالتعرق، فماذا يبقى لتكوين البول؟ والطلبة يستنتجون أن البول يقل في الطقس الحار (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. ورقة العمل 1-6: من أين تحصل على السوائل؟: يوجه المعلم إعداد قائمة بالسوائل خلال 24 ساعة وكمياتها، والأطعمة الرطبة، والطلبة يحسبون ما يشربون ويقيّمون: هل يكفي؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. غلق الدرس – ماء الجحلة والكليتين: تناقش الأزواج دور الكليتين في تنقية الدم وأهمية شرب الماء الكافي في صيف عمان الحار، وتتذكر الجحلة الفخارية لتبريد الماء (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين توجد الكليتان؟\n   الإجابة النموذجية: في الجزء الخلفي من الجسم، أسفل الضلوع قليلًا.\n2. [مستوى التطبيق] ما اسم السائل الذي تخرج فيه الفضلات من الكليتين؟\n   الإجابة النموذجية: البول.\n3. [مستوى الاستدلال] من أين يأتي الماء الموجود في البول؟\n   الإجابة النموذجية: من الدم؛ إذ يمر الماء من الجهاز الهضمي إلى الدم ثم تأخذ الكليتان الماء الزائد منه.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بغسيل الكلى؟\n   الإجابة النموذجية: استخدام جهاز يقوم بعمل الكليتين لتصفية الدم وتنظيفه.\n2. [مستوى التطبيق] لماذا يستطيع الإنسان العيش بكلية واحدة؟\n   الإجابة النموذجية: لأن الكلية الواحدة السليمة تستطيع القيام بعمل التنقية الكافي للجسم.\n3. [مستوى الاستدلال] اذكر أطعمة تزود الجسم بالسوائل إلى جانب المشروبات.\n   الإجابة النموذجية: الفواكه والخضراوات والأرز المطبوخ والمعكرونة واللحوم والأسماك.", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العملية الرئيسية التي تقوم بها الكليتان؟\n   الإجابة النموذجية: الإخراج.\n2. [مستوى التطبيق] صف شكل الكليتين وحجمهما.\n   الإجابة النموذجية: زوج من الأعضاء على شكل حبة الفاصوليا، بحجم فأرة الحاسوب تقريبًا لدى البالغ.\n3. [مستوى الاستدلال] كيف تحققت من تقديرك لكمية لتر الماء؟\n   الإجابة النموذجية: بقياس الماء بالمخبار المدرج وجمع القياسات ومقارنتها بلتر.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أشياء يمكن للأطباء القيام بها عند توقف الكليتين.\n   الإجابة النموذجية: استئصال الكلية التالفة، غسيل الكلى، زراعة كلية.\n2. [مستوى التطبيق] لماذا يفرز الجسم كمية بول أقل في الطقس الحار؟\n   الإجابة النموذجية: لأنه يفقد كمية أكبر من الماء بالتعرق فيبقى ماء زائد أقل لتكوين البول.\n3. [مستوى الاستدلال] اقترح ثلاث نصائح للمحافظة على صحة الكليتين.\n   الإجابة النموذجية: شرب كمية كافية من الماء، التقليل من الملح، عدم حبس البول، والفحص عند الشعور بالألم (تقبل الإجابات المنطقية).", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nللطالب: قراءة كتاب الطالب ص 28 وحل تمرين 1-6 في كتاب النشاط ص 21 واجبًا منزليًا. لولي الأمر: يُرجى تذكير الابن بشرب كمية كافية من الماء يوميًا.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nللطالب: إكمال ورقة العمل 1-6 (كتاب النشاط ص 60) بتسجيل السوائل التي يشربها خلال يوم. لولي الأمر: يُرجى مساعدة الابن في تسجيل كميات السوائل بدقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}, {"id": "1-7", "title": "ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 22، 61 | دليل المعلم ص 38–41", "n": 2, "per": [{"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | دليل المعلم ص 38–41", "num": "الحصة الأولى من 3", "focus": "الدماغ وحمايته والجهاز العصبي"}, "f": ["1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته (5 دقائق)\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي (10 دقائق)\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ (10 دقائق)\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه (5 دقائق)\n\nمخرج تعليمي آخر:\nيفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر (5 دقائق)\nيشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية (5 دقائق)", "1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته. ← تذكر\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي. ← فهم\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ. ← تذكر\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه. ← فهم\nالمخرج الآخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر. ← تحليل\nالمخرج الآخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية. ← تطبيق", "- التعلم بالاكتشاف\n- لعب الأدوار والمحاكاة\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: أكياس محكمة الغلق بها عصيدة باردة، خيوط لتمثيل الأعصاب، مطبوعات لرسم مبسط للدماغ، أقلام تلوين، صحيفة ومربع ورق صغير\n- صورة توضيحية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- الدماغ\n- الجمجمة\n- الأعصاب\n- الجهاز العصبي\n- الرسائل العصبية\n- المخ\n- المخيخ\n- جذع الدماغ\n- التوازن\n- الوظائف الحيوية", "يمرر المعلم أكياس عصيدة باردة محكمة الغلق، ويطلب وصف ملمسها، ثم يسأل: أي أعضاء الجسم تعتقد أنه يشبه هذه المادة؟ (5 دقائق)", "1. الدماغ وحمايته: يشرح المعلم ص 30: الدماغ رخو رمادي مجعد داخل الجمجمة، حجمه بحجم قبضتين، وحجمه لا يحدد الذكاء، والطلبة يضمّون قبضتيهم لتقدير الحجم ويكتبون وصف الدماغ (4 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\n2. لعبة الرسالة العصبية: يكوّن المعلم سلسلة طلاب (أعصاب) بين «الدماغ» و«اليد»، ويرسل رسالة بلمس الكتف، والطلبة يمررون الرسالة بأسرع ما يمكن ويقيسون الزمن، ثم يناقشون موقف عبور الشارع (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. الأسئلة 1–2 ص 31: يناقش المعلم: كيف يُحمى الدماغ؟ لماذا حمايته مهمة؟ كيف يرسل الرسائل؟ والطلبة يجيبون كتابيًا ثم يتشاركون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أجزاء الدماغ الثلاثة: يعرض المعلم نموذجًا/ملصقًا ويشرح: المخ (تفكير وحواس وذاكرة ولغة)، المخيخ (حركة وتوازن)، جذع الدماغ (تنفس ودقات قلب وحرارة الجسم والهضم)، والطلبة يلوّنون الرسم: المخ أصفر، المخيخ أحمر، جذع الدماغ أزرق، ويكتبون وظيفتين لكل جزء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تمرين 1-7: يوجه المعلم حل تمرين 1-7 (كتاب النشاط ص 22)، والطلبة يحلون فرديًا ثم يتبادلون التصحيح (تقييم الأقران) (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. السؤال 3 والتحدي: يناقش المعلم السؤال 3 ص 31 (المكالمة الهاتفية) وسؤال التحدي (ارتجاج المخ)، والطلبة يكتبون خطوات المكالمة وما يقوم به الدماغ في كل خطوة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يوجد الدماغ؟ وما الذي يحميه؟\n   الإجابة النموذجية: داخل الرأس، وتحميه الجمجمة.\n2. [مستوى التطبيق] ما مكونات الجهاز العصبي؟\n   الإجابة النموذجية: الدماغ والأعصاب.\n3. [مستوى الاستدلال] لماذا يجب أن تنتقل الرسائل من الدماغ وإليه بسرعة كبيرة؟\n   الإجابة النموذجية: ليستجيب الجسم فورًا للخطر، مثل الابتعاد عن سيارة مسرعة.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما الجزء المسؤول عن التوازن؟\n   الإجابة النموذجية: المخيخ.\n5. [مستوى التطبيق] اذكر وظيفتين لجذع الدماغ.\n   الإجابة النموذجية: التحكم في التنفس ودقات القلب (وكذلك حرارة الجسم والهضم).\n6. [مستوى الاستدلال] ما المقصود بارتجاج المخ؟\n   الإجابة النموذجية: تلف يلحق بالدماغ عادة بسبب ضربة قوية على الرأس، قد يسبب فقدان الوعي أو صداعًا شديدًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] كيف يتصل الدماغ ببقية أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الأعصاب.\n2. [مستوى التطبيق] لماذا تُعد إصابات الدماغ خطيرة؟\n   الإجابة النموذجية: لأنه يتحكم في كل ما نقوم به ولا يستطيع عادة إصلاح نفسه.\n3. [مستوى الاستدلال] هل الإنسان ذو الدماغ الأكبر أذكى بالضرورة؟ وضح.\n   الإجابة النموذجية: لا؛ حجم الدماغ لا يرتبط بالذكاء، فدماغ أينشتاين كان أصغر قليلًا من المتوسط.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] أي أجزاء الدماغ أكبرها؟ وما وظيفته؟\n   الإجابة النموذجية: المخ؛ يتحكم في التفكير والحواس والذاكرة واللغة.\n5. [مستوى التطبيق] ما الجزء الذي يعمل حتى ونحن نائمون للحفاظ على التنفس؟\n   الإجابة النموذجية: جذع الدماغ.\n6. [مستوى الاستدلال] اشرح دور الدماغ عند رنين الهاتف والرد على صديق.\n   الإجابة النموذجية: يسمعك الرنين وصوت الصديق، ويحرك يدك لالتقاط الهاتف، ويمكّنك من الرؤية والكلام والفهم.", "للطالب: قراءة كتاب الطالب ص 30–31، والتفكير في سؤال: هل يعمل الدماغ أثناء النوم؟ لولي الأمر: يُرجى التأكيد على ارتداء الخوذة عند ركوب الدراجة لحماية الرأس.\nللطالب: حل تمرين 1-7 (كتاب النشاط ص 22) إن لم يكتمل، ومراجعة أجزاء الدماغ ووظائفها. لولي الأمر: يُرجى الحرص على نوم الابن ساعات كافية لصحة الدماغ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 61 | دليل المعلم ص 40–41", "num": "الحصة الثالثة من 3", "focus": "مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)"}, "f": ["1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات (15 دقيقة)\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط (5 دقائق)\n\nمخرج تعليمي آخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر (20 دقيقة)", "1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات. ← تحليل\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط. ← تحليل\nالمخرج الآخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر. ← تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورقة العمل 1-7، آلة حاسبة", "- كتلة الجسم\n- كتلة الدماغ\n- النمط\n- النتيجة غير الملائمة للنمط\n- الغرام والكيلوغرام", "يعرض المعلم صورتي فيل وإنسان ويسأل: أيهما دماغه أثقل؟ وأيهما أذكى؟ هل يعني الدماغ الأثقل ذكاءً أكبر؟ (5 دقائق)", "1. قراءة الجدول والوحدات: يقرأ المعلم جدول ورقة العمل 1-7 (كتاب النشاط ص 61) وينبّه أن كتل الدماغ بالغرام والجسم بالكيلوغرام، والطلبة يحوّلون بعض القيم بمساعدة المعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 1-7: الترتيب والنمط: يتابع المجموعات أثناء الترتيب ويطرح أسئلة موجهة، والطلبة يرتبون الكائنات حسب الكتلتين، ويصفون النمط (تزداد كتلة الدماغ بزيادة كتلة الجسم)، ويحددون البابون غير الملائم (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التحدي ومناقشة الذكاء: يطرح المعلم التحدي: أي كائن دماغه أكبر نسبة إلى كتلة جسمه؟ ويوضح طريقة القسمة، والطلبة يحسبون للمستوى الاستدلال ويستنتجون أنه الإنسان (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – دماغ الملاح: تتحدث المجموعات عن دور الدماغ في التفكير واتخاذ القرار، بمثال ملاح عماني يقود سفينته بين النجوم والأمواج، وأهمية حماية الرأس (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الكائن ذو أكبر كتلة دماغ في الجدول؟\n   الإجابة النموذجية: الفيل.\n2. [مستوى التطبيق] صف النمط بين كتلة الجسم وكتلة الدماغ.\n   الإجابة النموذجية: كلما زادت كتلة الجسم زادت كتلة الدماغ.\n3. [مستوى الاستدلال] لماذا لا يلائم البابون النمط؟\n   الإجابة النموذجية: لأن ترتيبه في كتلة الدماغ يختلف عن ترتيبه في كتلة الجسم، فدماغه أثقل من دماغ كائن أثقل منه جسمًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الوحدة التي قيست بها كتلة الدماغ في الجدول؟\n   الإجابة النموذجية: الغرام.\n2. [مستوى التطبيق] كيف نعرف الكائن الذي يملك أكبر دماغ نسبةً إلى جسمه؟\n   الإجابة النموذجية: بقسمة كتلة الدماغ على كتلة الجسم لكل كائن ومقارنة النتائج.\n3. [مستوى الاستدلال] هل تتفق مع العبارة: «الكائن ذو الدماغ الأثقل هو الأذكى»؟ علّل.\n   الإجابة النموذجية: لا؛ فالفيل دماغه أثقل من الإنسان، والإنسان أذكى، والذكاء لا يرتبط بحجم الدماغ وحده.", "للطالب: إكمال ورقة العمل 1-7 (كتاب النشاط ص 61) والاستعداد لمراجعة الوحدة الأولى. لولي الأمر: يُرجى مراجعة أعضاء الجسم ووظائفها مع الابن استعدادًا لحصص «تحقق من تقدمك».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}], "comb": ["الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته (5 دقائق)\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي (10 دقائق)\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ (10 دقائق)\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه (5 دقائق)\n\nمخرج تعليمي آخر:\nيفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر (5 دقائق)\nيشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية (5 دقائق)\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات (15 دقيقة)\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط (5 دقائق)\n\nمخرج تعليمي آخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر (20 دقيقة)", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته. ← تذكر\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي. ← فهم\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ. ← تذكر\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه. ← فهم\nالمخرج الآخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر. ← تحليل\nالمخرج الآخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية. ← تطبيق\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات. ← تحليل\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط. ← تحليل\nالمخرج الآخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر. ← تقييم", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- التعلم بالاكتشاف\n- لعب الأدوار والمحاكاة\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: أكياس محكمة الغلق بها عصيدة باردة، خيوط لتمثيل الأعصاب، مطبوعات لرسم مبسط للدماغ، أقلام تلوين، صحيفة ومربع ورق صغير\n- صورة توضيحية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورقة العمل 1-7، آلة حاسبة", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- الدماغ\n- الجمجمة\n- الأعصاب\n- الجهاز العصبي\n- الرسائل العصبية\n- المخ\n- المخيخ\n- جذع الدماغ\n- التوازن\n- الوظائف الحيوية\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- كتلة الجسم\n- كتلة الدماغ\n- النمط\n- النتيجة غير الملائمة للنمط\n- الغرام والكيلوغرام", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nيمرر المعلم أكياس عصيدة باردة محكمة الغلق، ويطلب وصف ملمسها، ثم يسأل: أي أعضاء الجسم تعتقد أنه يشبه هذه المادة؟ (5 دقائق)\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nيعرض المعلم صورتي فيل وإنسان ويسأل: أيهما دماغه أثقل؟ وأيهما أذكى؟ هل يعني الدماغ الأثقل ذكاءً أكبر؟ (5 دقائق)", "الحصة 1: الدماغ وحمايته والجهاز العصبي — زمن الحصة 40 دقيقة\n1. الدماغ وحمايته: يشرح المعلم ص 30: الدماغ رخو رمادي مجعد داخل الجمجمة، حجمه بحجم قبضتين، وحجمه لا يحدد الذكاء، والطلبة يضمّون قبضتيهم لتقدير الحجم ويكتبون وصف الدماغ (4 دقائق)\nالاستراتيجيات: لعب الأدوار والمحاكاة.\n\n2. لعبة الرسالة العصبية: يكوّن المعلم سلسلة طلاب (أعصاب) بين «الدماغ» و«اليد»، ويرسل رسالة بلمس الكتف، والطلبة يمررون الرسالة بأسرع ما يمكن ويقيسون الزمن، ثم يناقشون موقف عبور الشارع (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. الأسئلة 1–2 ص 31: يناقش المعلم: كيف يُحمى الدماغ؟ لماذا حمايته مهمة؟ كيف يرسل الرسائل؟ والطلبة يجيبون كتابيًا ثم يتشاركون (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. أجزاء الدماغ الثلاثة: يعرض المعلم نموذجًا/ملصقًا ويشرح: المخ (تفكير وحواس وذاكرة ولغة)، المخيخ (حركة وتوازن)، جذع الدماغ (تنفس ودقات قلب وحرارة الجسم والهضم)، والطلبة يلوّنون الرسم: المخ أصفر، المخيخ أحمر، جذع الدماغ أزرق، ويكتبون وظيفتين لكل جزء (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تمرين 1-7: يوجه المعلم حل تمرين 1-7 (كتاب النشاط ص 22)، والطلبة يحلون فرديًا ثم يتبادلون التصحيح (تقييم الأقران) (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. السؤال 3 والتحدي: يناقش المعلم السؤال 3 ص 31 (المكالمة الهاتفية) وسؤال التحدي (ارتجاج المخ)، والطلبة يكتبون خطوات المكالمة وما يقوم به الدماغ في كل خطوة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات) — زمن الحصة 40 دقيقة\n1. قراءة الجدول والوحدات: يقرأ المعلم جدول ورقة العمل 1-7 (كتاب النشاط ص 61) وينبّه أن كتل الدماغ بالغرام والجسم بالكيلوغرام، والطلبة يحوّلون بعض القيم بمساعدة المعلم (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 1-7: الترتيب والنمط: يتابع المجموعات أثناء الترتيب ويطرح أسئلة موجهة، والطلبة يرتبون الكائنات حسب الكتلتين، ويصفون النمط (تزداد كتلة الدماغ بزيادة كتلة الجسم)، ويحددون البابون غير الملائم (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التحدي ومناقشة الذكاء: يطرح المعلم التحدي: أي كائن دماغه أكبر نسبة إلى كتلة جسمه؟ ويوضح طريقة القسمة، والطلبة يحسبون للمستوى الاستدلال ويستنتجون أنه الإنسان (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويصحح المفهوم الخاطئ، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – دماغ الملاح: تتحدث المجموعات عن دور الدماغ في التفكير واتخاذ القرار، بمثال ملاح عماني يقود سفينته بين النجوم والأمواج، وأهمية حماية الرأس (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أين يوجد الدماغ؟ وما الذي يحميه؟\n   الإجابة النموذجية: داخل الرأس، وتحميه الجمجمة.\n2. [مستوى التطبيق] ما مكونات الجهاز العصبي؟\n   الإجابة النموذجية: الدماغ والأعصاب.\n3. [مستوى الاستدلال] لماذا يجب أن تنتقل الرسائل من الدماغ وإليه بسرعة كبيرة؟\n   الإجابة النموذجية: ليستجيب الجسم فورًا للخطر، مثل الابتعاد عن سيارة مسرعة.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما الجزء المسؤول عن التوازن؟\n   الإجابة النموذجية: المخيخ.\n5. [مستوى التطبيق] اذكر وظيفتين لجذع الدماغ.\n   الإجابة النموذجية: التحكم في التنفس ودقات القلب (وكذلك حرارة الجسم والهضم).\n6. [مستوى الاستدلال] ما المقصود بارتجاج المخ؟\n   الإجابة النموذجية: تلف يلحق بالدماغ عادة بسبب ضربة قوية على الرأس، قد يسبب فقدان الوعي أو صداعًا شديدًا.\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الكائن ذو أكبر كتلة دماغ في الجدول؟\n   الإجابة النموذجية: الفيل.\n2. [مستوى التطبيق] صف النمط بين كتلة الجسم وكتلة الدماغ.\n   الإجابة النموذجية: كلما زادت كتلة الجسم زادت كتلة الدماغ.\n3. [مستوى الاستدلال] لماذا لا يلائم البابون النمط؟\n   الإجابة النموذجية: لأن ترتيبه في كتلة الدماغ يختلف عن ترتيبه في كتلة الجسم، فدماغه أثقل من دماغ كائن أثقل منه جسمًا.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] كيف يتصل الدماغ ببقية أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الأعصاب.\n2. [مستوى التطبيق] لماذا تُعد إصابات الدماغ خطيرة؟\n   الإجابة النموذجية: لأنه يتحكم في كل ما نقوم به ولا يستطيع عادة إصلاح نفسه.\n3. [مستوى الاستدلال] هل الإنسان ذو الدماغ الأكبر أذكى بالضرورة؟ وضح.\n   الإجابة النموذجية: لا؛ حجم الدماغ لا يرتبط بالذكاء، فدماغ أينشتاين كان أصغر قليلًا من المتوسط.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] أي أجزاء الدماغ أكبرها؟ وما وظيفته؟\n   الإجابة النموذجية: المخ؛ يتحكم في التفكير والحواس والذاكرة واللغة.\n5. [مستوى التطبيق] ما الجزء الذي يعمل حتى ونحن نائمون للحفاظ على التنفس؟\n   الإجابة النموذجية: جذع الدماغ.\n6. [مستوى الاستدلال] اشرح دور الدماغ عند رنين الهاتف والرد على صديق.\n   الإجابة النموذجية: يسمعك الرنين وصوت الصديق، ويحرك يدك لالتقاط الهاتف، ويمكّنك من الرؤية والكلام والفهم.\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الوحدة التي قيست بها كتلة الدماغ في الجدول؟\n   الإجابة النموذجية: الغرام.\n2. [مستوى التطبيق] كيف نعرف الكائن الذي يملك أكبر دماغ نسبةً إلى جسمه؟\n   الإجابة النموذجية: بقسمة كتلة الدماغ على كتلة الجسم لكل كائن ومقارنة النتائج.\n3. [مستوى الاستدلال] هل تتفق مع العبارة: «الكائن ذو الدماغ الأثقل هو الأذكى»؟ علّل.\n   الإجابة النموذجية: لا؛ فالفيل دماغه أثقل من الإنسان، والإنسان أذكى، والذكاء لا يرتبط بحجم الدماغ وحده.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nللطالب: قراءة كتاب الطالب ص 30–31، والتفكير في سؤال: هل يعمل الدماغ أثناء النوم؟ لولي الأمر: يُرجى التأكيد على ارتداء الخوذة عند ركوب الدراجة لحماية الرأس.\nللطالب: حل تمرين 1-7 (كتاب النشاط ص 22) إن لم يكتمل، ومراجعة أجزاء الدماغ ووظائفها. لولي الأمر: يُرجى الحرص على نوم الابن ساعات كافية لصحة الدماغ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nللطالب: إكمال ورقة العمل 1-7 (كتاب النشاط ص 61) والاستعداد لمراجعة الوحدة الأولى. لولي الأمر: يُرجى مراجعة أعضاء الجسم ووظائفها مع الابن استعدادًا لحصص «تحقق من تقدمك».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"id": "1-8", "title": "تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 32–33 | كتاب النشاط ص 23، 62 | دليل المعلم ص 41–43", "n": 2, "per": [{"h": {"lesson": "1-8 تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "ا ين».\n   الإجابة النموذجية: يحمل الدم ثاني أكسيد الكربون إلى الرئتين لطرده.\n3. [مستوى الاستدلال] في أي جزء يتم مزج الطعام بالعصارة الهضمية؟\n   الإجابة النموذجية: في المعدة.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما اسم الفضلات التي تخرج من الكليتين؟\n   الإجابة النموذجية: البول.\n2. [مستوى التطبيق] كيف يؤثر لعب مباراة كرة قدم في عمل الرئتين؟\n   الإجابة النموذجية: يزيد معدل التنفس للحصول على مزيد من الأكسجين.\n3. [مستوى الاستدلال] كيف يتأكد الدماغ من أن الرئتين تقومان بعملهما؟\n   الإجابة النموذجية: يتحكم في التنفس فيرسل الرسائل عبر الأعصاب لتستمر عملية التنفس.", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما العضو المسؤول عن التحكم؟\n   الإجابة النموذجية: الدماغ.\n2. [مستوى التطبيق] ماذا يوضح معدل النبض؟\n   الإجابة النموذجية: مدى سرعة دقات القلب.\n3. [مستوى الاستدلال] رتب: يُدفع الطعام إلى المعدة، يُمضغ في الفم، يُفتت في الأمعاء، يُمزج بالعصارة.\n   الإجابة النموذجية: يُمضغ في الفم ← يُدفع إلى المعدة ← يُمزج بالعصارة في المعدة ← يُفتت في الأمعاء.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغاز الذي نطرحه خارج الرئتين؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n2. [مستوى التطبيق] أكمل: الدماغ والأعصاب تشكل الجهاز ____.\n   الإجابة النموذجية: العصبي.\n3. [مستوى الاستدلال] بيّن بمثال كيف يتعاون جهازان من أجهزة الجسم.\n   الإجابة النموذجية: الجهاز التنفسي يأخذ الأكسجين والجهاز الدوري ينقله بالدم إلى أجزاء الجسم (تقبل أمثلة صحيحة أخرى).", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\nللطالب: مراجعة كتاب الطالب ص 18–31 وحل السؤالين 5 و6 ص 33 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة إجابات الابن ومناقشة الأخطاء معه.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nللطالب: إكمال ورقة العمل 1-8 (كتاب النشاط ص 62) ومراجعة الوحدة الأولى كاملة. لولي الأمر: يُرجى الاطلاع على خريطة الأجهزة التي أعدّها الابن ومراجعتها معه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي
