الشهيق والزفير ومسار الهواء إلى الرئتين\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- التعلم الذاتي\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: بالون لكل طالب\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- الكتاب\n- الأقلام\n- السبورة التقليدية\n- أخرى: ساعة إيقاف، ورقة العمل 1-4", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n- الرئتان\n- الشهيق\n- الزفير\n- القصبة الهوائية\n- الحجاب الحاجز\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n- معدل التنفس\n- التمثيل الخطي\n- اللياقة البدنية\n- تبادل الغازات", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nيسأل المعلم: ما الشيء الذي تفعله 15–20 مرة في الدقيقة دون أن تفكر فيه؟ ويستمع للإجابات حتى يصل إلى «التنفس».\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nيطلب المعلم من الطلبة تذكّر ما حدث لنبضهم بعد الجري، ويسأل: هل يتغير تنفسنا أيضًا؟ كيف يمكن أن نقيس ذلك؟", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n1) التهيئة: لغز التنفس (4 دقائق: 0–4)\n   المعلم: يطرح اللغز ويقدم مفردات الدرس.\n   الطالب: يجيبون ويحاولون عدّ أنفاسهم بصمت.\n2) نشاط 1-4: استقصاء التنفس (12 دقائق: 4–16)\n   المعلم: يوضح وضع اليدين على القفص الصدري، ويطلب شهيقًا عميقًا ثم زفيرًا، ثم نفخ بالون (بالون لكل طالب دون مشاركة).\n   الطالب: يصفون اتساع الصدر وانكماشه، ويلاحظون انتفاخ البالون بهواء الزفير.\n3) مسار الهواء (10 دقائق: 16–26)\n   المعلم: يعرض نموذجًا/مقطعًا للجهاز التنفسي وشكل ص 25، ويتتبع: الأنف/الفم ← القصبة الهوائية ← الرئتان، ودور الحجاب الحاجز.\n   الطالب: يرسمون مخططًا سهميًا لمسار الهواء ويكتبون أسماء الأجزاء.\n4) أسئلة الكتاب 1–3 (8 دقائق: 26–34)\n   المعلم: يناقش الأسئلة 1–3 ص 24 ويصحح المفهوم الخاطئ: الرئتان إسفنجيتان وليستا كيسين مجوفين.\n   الطالب: يجيبون ويناقشون الفرق بين البالون والرئة.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n1) التهيئة: ربط بالنبض (4 دقائق: 0–4)\n   المعلم: يربط بين النبض والتنفس ويطلب تنبؤًا.\n   الطالب: يكتبون تنبؤًا بأثر الرياضة على التنفس.\n2) ورقة العمل 1-4: استقصاء معدل التنفس (14 دقائق: 4–18)\n   المعلم: ينظم ثنائيات، ويوجه عدّ مرات التنفس في الدقيقة بمراقبة صعود الصدر وهبوطه، قبل التمرين وبعده وعلى فترات.\n   الطالب: يقيسون ويسجلون النتائج في جدول.\n3) التمثيل الخطي (8 دقائق: 18–26)\n   المعلم: يوجه رسم التمثيل الخطي لمعدل التنفس مع الزمن ويقدم الدعم للمتعثرين بالتعاون مع زملائهم.\n   الطالب: يرسمون ويحددون أعلى وأدنى معدل.\n4) تمرين 1-4 والسؤال 4 (9 دقائق: 26–35)\n   المعلم: يوجه تمرين 1-4 (كتاب النشاط ص 19: رسم الرئتين ومسار الهواء) ومناقشة السؤال 4 ص 24.\n   الطالب: يرسمون ويكتبون الأسماء ويفسرون سرعة التنفس.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n1. [مستوى المعرفة] ماذا يحدث لحجم الصدر عند الشهيق؟\n   الإجابة النموذجية: يكبر لأن الرئتين تمتلئان بالهواء.\n2. [مستوى التطبيق] رتب مسار الهواء: الرئتان، الأنف، القصبة الهوائية.\n   الإجابة النموذجية: الأنف ← القصبة الهوائية ← الرئتان.\n3. [مستوى الاستدلال] لماذا لا يُعدّ البالون تمثيلًا دقيقًا تمامًا للرئة؟\n   الإجابة النموذجية: لأن الرئة ليست كيسًا مجوفًا بل نسيج إسفنجي من حويصلات هوائية صغيرة كثيرة.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n1. [مستوى المعرفة] كيف تعدّ أنفاس زميلك في الدقيقة؟\n   الإجابة النموذجية: بمراقبة صعود صدره وهبوطه وعدّ المرات خلال دقيقة بساعة إيقاف.\n2. [مستوى التطبيق] متى كان معدل التنفس في أعلى مستوى في جدولك؟\n   الإجابة النموذجية: بعد التمرين مباشرة (والإجابة تعتمد على بيانات الطالب).\n3. [مستوى الاستدلال] لماذا لا يزيد معدل تنفس الرياضي كثيرًا عند التمرين مقارنة بغيره؟\n   الإجابة النموذجية: لأن قلبه ورئتيه أكثر كفاءة في إيصال الأكسجين إلى العضلات فيحتاج أنفاسًا أقل.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\n1. [مستوى المعرفة] ما الغاز الذي نحصل عليه في الشهيق؟\n   الإجابة النموذجية: الأكسجين.\n2. [مستوى التطبيق] اشرح كيف نفخت البالون.\n   الإجابة النموذجية: أخرجت هواء الزفير من رئتيّ فدخل البالون فزاد حجمه وانتفخ.\n3. [مستوى الاستدلال] ماذا يحدث للأكسجين بعد دخوله الرئتين؟\n   الإجابة النموذجية: ينتقل إلى الدم فيحمله إلى القلب ثم إلى باقي أجزاء الجسم.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\n1. [مستوى المعرفة] لماذا نتنفس أسرع عند ممارسة الرياضة؟\n   الإجابة النموذجية: لأن الجسم يحتاج إلى مزيد من الأكسجين للعضلات.\n2. [مستوى التطبيق] ما الجهاز الذي يتعاون مع الجهاز التنفسي لإيصال الأكسجين؟\n   الإجابة النموذجية: الجهاز الدوري.\n3. [مستوى الاستدلال] صمّم طريقة لمقارنة معدل التنفس لدى شخصين مختلفين في اللياقة بشكل عادل.\n   الإجابة النموذجية: يمارسان التمرين نفسه للمدة نفسها، ويقاس تنفسهما بالطريقة نفسها قبل التمرين وبعده مباشرة.", "الحصة 1: الشهيق والزفير ومسار الهواء إلى الرئتين\nللطالب: قراءة كتاب الطالب ص 24–25 ورسم مسار الهواء في الدفتر. لولي الأمر: يُرجى توعية الابن بأضرار التدخين على الرئتين ومراعاة من يعاني من الربو.\n\nالحصة 2: معدل التنفس وأثر ممارسة الرياضة عليه\nللطالب: حل تمرين 1-4 (كتاب النشاط ص 19) وإكمال ورقة العمل 1-4 (ص 57–58). لولي الأمر: يُرجى تشجيع الابن على ممارسة نشاط بدني منتظم للمحافظة على لياقة القلب والرئتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=4"]}, {"id": "1-5", "title": "الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | كتاب النشاط ص 20، 47، 59 | دليل المعلم ص 34–37", "n": 2, "per": [{"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 26–27 | دليل المعلم ص 34–36", "num": "الحصة الأولى من 3", "focus": "حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية"}, "f": ["1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه.\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها.\n3. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته.\n4. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة.\n\nمخرج تعليمي آخر:\nيقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم.\nيميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال.", "1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه. ← فهم\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها. ← تذكر\n3. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته. ← فهم\n4. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة. ← إبداع\nالمخرج الآخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم. ← فهم\nالمخرج الآخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال. ← تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- العصف الذهني\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم المبني على المشاريع", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: بكرة خيط بطول 7 أمتار\n- نماذج مجسمة\n- أخرى: بطاقات ورقة المصادر 1-5، أنابيب وزجاجات وأكياس بلاستيكية لصنع النموذج", "- الهضم\n- الجهاز الهضمي\n- المريء\n- المعدة\n- الأمعاء\n- الفم\n- العصارة الهضمية\n- الأمعاء الدقيقة\n- الأمعاء الغليظة", "يسأل المعلم: ماذا أكلت اليوم؟ ولماذا نأكل؟ ثم: هل يستطيع الجسم استخدام قطعة الخبز كما هي؟", "1) التهيئة: لماذا نأكل؟ (1 دقيقة: 0–1)\n   المعلم: يجمع إجابات الطلبة ويقودهم إلى أن الطعام للنمو والطاقة.\n   الطالب: يشاركون ويستنتجون الحاجة إلى تفتيت الطعام.\n2) رحلة الطعام (3 دقائق: 1–4)\n   المعلم: يعرض الشكل ص 27 ويشرح: المضغ واللعاب في الفم، المريء، المعدة والعصارة الهضمية، الأمعاء، الإخراج.\n   الطالب: يتتبعون الرحلة بأصابعهم على الشكل ويكتبون الترتيب.\n3) طول الأمعاء الدقيقة (2 دقيقتان: 4–6)\n   المعلم: يفرد خيطًا بطول 7 أمتار تقريبًا في الصف ثم يطويه، ويسأل: كيف تتسع له البطن؟\n   الطالب: يقيسون بخطواتهم ويستنتجون أن الأمعاء مطوية.\n4) ملخص مصوّر (2 دقيقتان: 6–8)\n   المعلم: يطلب رسم مخطط سهمي لمسار الطعام، ويقدم الاختصار المساعد للمتعثرين (فم – مريء – معدة – أمعاء).\n   الطالب: يرسمون المخطط ويضيفون اسمًا لكل جزء.\n5) الختام والتقويم (2 دقيقتان: 8–10)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) لعبة مطابقة البطاقات (3 دقائق: 20–23)\n   المعلم: يوزّع بطاقات ورقة المصادر 1-5 (كتاب النشاط ص 47): صور الأجزاء وأسماؤها ووظائفها مع بطاقات مضلِّلة.\n   الطالب: تطابق المجموعات الصورة والاسم والوظيفة، ثم تتحقق مجموعة أخرى.\n8) بناء نموذج الجهاز الهضمي (4 دقائق: 23–27)\n   المعلم: يوجّه المجموعات لصنع نموذج من زجاجة (معدة) وأنبوب (مريء) وأنبوب طويل ملفوف (أمعاء).\n   الطالب: يبنون النموذج ويعلّقون بطاقة وظيفة على كل جزء.\n9) أسئلة الكتاب وتمرين 1-5 (2 دقيقتان: 27–29)\n   المعلم: يناقش الأسئلة 1–5 ص 26 ويوجه تمرين 1-5 (كتاب النشاط ص 20).\n   الطالب: يجيبون ويرتبون الوظائف ترتيبًا صحيحًا.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] لماذا يحتاج جسمنا إلى الطعام؟\n   الإجابة النموذجية: للنمو والحصول على الطاقة ليعمل بصورة جيدة.\n2. [مستوى التطبيق] ما الجزء الذي يدفع الطعام من الفم إلى المعدة؟\n   الإجابة النموذجية: المريء.\n3. [مستوى الاستدلال] لماذا يجب هضم الطعام قبل أن يستفيد منه الجسم؟\n   الإجابة النموذجية: لأن الجسم لا يستطيع استخدام الطعام بحالته، فيجب تفتيته إلى جزيئات صغيرة يمكن نقلها في الدم.\n\n4. [مستوى المعرفة] ما وظيفة المعدة؟\n   الإجابة النموذجية: تمزج الطعام بالعصارة الهضمية فيصبح سائلًا سميكًا يشبه العصيدة.\n5. [مستوى التطبيق] ماذا يحدث للطعام داخل الأمعاء الدقيقة؟\n   الإجابة النموذجية: يُفتت إلى جزيئات أصغر تنتقل إلى الدم.\n6. [مستوى الاستدلال] بماذا يرتبط المريء؟ وبماذا ترتبط القصبة الهوائية؟\n   الإجابة النموذجية: المريء يرتبط بالمعدة، والقصبة الهوائية ترتبط بالرئتين.", "1. [مستوى المعرفة] رتّب: الأمعاء – الفم – المعدة – المريء.\n   الإجابة النموذجية: الفم ← المريء ← المعدة ← الأمعاء.\n2. [مستوى التطبيق] ما العضوان الرئيسيان في هضم الطعام؟\n   الإجابة النموذجية: المعدة والأمعاء.\n3. [مستوى الاستدلال] لماذا تكون الأمعاء الدقيقة مطوية داخل البطن؟\n   الإجابة النموذجية: لأن طولها كبير (نحو 7 أمتار عند البالغ) فتُطوى لتتسع لها البطن.\n\n4. [مستوى المعرفة] ما دور الأسنان في الهضم؟\n   الإجابة النموذجية: تمضغ الطعام وتفتته إلى قطع صغيرة يسهل ابتلاعها.\n5. [مستوى التطبيق] كيف يصل الطعام المهضوم إلى أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الدم.\n6. [مستوى الاستدلال] أي أجزاء نموذجك يمثل المعدة؟ وما الذي ينقص النموذج ليشبه الجهاز الحقيقي؟\n   الإجابة النموذجية: الزجاجة؛ ينقصه مثلًا العصارة الهضمية وحركة العضلات (تقبل الإجابات المنطقية).", "للطالب: قراءة كتاب الطالب ص 26–27 وكتابة ما أكله في يوم كامل. لولي الأمر: يُرجى تشجيع الابن على مضغ الطعام جيدًا وتناول وجبات متوازنة.\nللطالب: حل تمرين 1-5 في كتاب النشاط ص 20 واجبًا منزليًا، ومراجعة ص 27. لولي الأمر: يُرجى تشجيع الابن على شرب الماء وتناول الأطعمة الغنية بالألياف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"h": {"lesson": "1-5 الجهاز الهضمي", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 27 | كتاب النشاط ص 59 | دليل المعلم ص 36–37", "num": "الحصة الثالثة من 3", "focus": "استقصاء: يبدأ هضم النشا في الفم"}, "f": ["1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان.\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم.\n\nمخرج تعليمي آخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا.", "1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان. ← تطبيق\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم. ← تحليل\nالمخرج الآخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا. ← تقييم", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: ورقة العمل 1-5، خبز، نشا الذرة، محلول اليود، قطارة، طبقان", "- النشا\n- اختبار النشا\n- محلول اليود\n- اللعاب\n- الاستنتاج", "يعرض المعلم نشا الذرة ويضيف إليه قطرة يود فيتحول إلى أزرق داكن، ويسأل: ماذا يعني هذا اللون؟ هل يوجد نشا في الخبز؟", "1) التهيئة: اختبار النشا (3 دقائق: 0–3)\n   المعلم: يعرض اختبار النشا على نشا الذرة ويؤكد قواعد السلامة (لا تذوق لليود، تجنب البقع).\n   الطالب: يلاحظون تغير اللون ويكتبون قاعدة الاختبار.\n2) اختبار الخبز (ورقة العمل 1-5) (5 دقائق: 3–8)\n   المعلم: يوزع على المجموعات قطعة خبز في طبق وقطارة يود.\n   الطالب: يضيفون قطرة يود ويلاحظون اللون الأزرق الداكن: يوجد نشا.\n3) أثر المضغ (5 دقائق: 8–13)\n   المعلم: يطلب من كل طالب مضغ قطعة خبز نظيفة غير مخصصة للاختبار نحو دقيقة، ويعرض نتيجة عينة مُعدّة مسبقًا لخبز مُعرَّض للعاب.\n   الطالب: يلاحظون تحول الطعم إلى حلو، ويقارنون عدم تغير لون اليود في العينة المعالجة.\n4) الاستنتاج والعادات الصحية (4 دقائق: 13–17)\n   المعلم: يقود الاستنتاج: النشا يُهضم في الفم ويتحول إلى سكر؛ ويناقش الألياف والماء والرياضة.\n   الطالب: يكتبون الاستنتاج في ورقة العمل ويقترحون عادات صحية.\n5) الختام والتقويم (3 دقائق: 17–20)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ما لون محلول اليود عند وجود النشا؟\n   الإجابة النموذجية: أزرق داكن.\n2. [مستوى التطبيق] لماذا أصبح طعم الخبز حلوًا بعد المضغ؟\n   الإجابة النموذجية: لأن اللعاب يبدأ هضم النشا فيحوّل جزءًا منه إلى سكر.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق أي مادة في المختبر؟\n   الإجابة النموذجية: لأن بعض المواد مثل اليود ضارة، والسلامة تقتضي عدم تذوق أو ابتلاع المواد المستخدمة.", "1. [مستوى المعرفة] ماذا نستنتج من عدم تغير لون اليود في عينة الخبز الممضوغ جيدًا؟\n   الإجابة النموذجية: أن النشا هُضم (تحول إلى سكر) في الفم.\n2. [مستوى التطبيق] ما المادة في الفم التي تساعد على بدء الهضم؟\n   الإجابة النموذجية: اللعاب (العصارة الهضمية في اللعاب).\n3. [مستوى الاستدلال] اقترح ثلاث عادات تساعد جهازك الهضمي.\n   الإجابة النموذجية: مضغ الطعام جيدًا، شرب الماء، تناول الألياف كالفواكه والخضراوات، وممارسة الرياضة.", "للطالب: إكمال إجابات ورقة العمل 1-5 (كتاب النشاط ص 59) ومراجعة الدرس كاملًا. لولي الأمر: يُرجى مساعدة الابن على اختيار أطعمة صحية والإقلال من المشروبات الغازية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}], "comb": ["الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه.\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها.\n3. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته.\n4. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة.\n\nمخرج تعليمي آخر:\nيقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم.\nيميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال.\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان.\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم.\n\nمخرج تعليمي آخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1. يوضح سبب حاجة الجسم إلى الطعام وضرورة هضمه. ← فهم\n2. يرتب أجزاء القناة الهضمية حسب مرور الطعام فيها. ← تذكر\n3. يربط كل جزء من أجزاء الجهاز الهضمي بوظيفته. ← فهم\n4. يبني نموذجًا بسيطًا للجهاز الهضمي من مواد بسيطة. ← إبداع\nالمخرج الآخر: يقدّر طول الأمعاء الدقيقة ويفسر طيّها داخل الجسم. ← فهم\nالمخرج الآخر: يميّز بين المريء والقصبة الهوائية من حيث الوظيفة والاتصال. ← تحليل\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n1. يجري اختبار النشا في الخبز باستخدام محلول اليود بأمان. ← تطبيق\n2. يستنتج من النتائج أن هضم النشا يبدأ في الفم. ← تحليل\nالمخرج الآخر: يقترح عادات غذائية تساعد الجهاز الهضمي على العمل جيدًا. ← تقييم", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- العصف الذهني\n- التعلم المبني على اللعب\n- التعلم التعاوني\n- التعلم المبني على المشاريع\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: بكرة خيط بطول 7 أمتار\n- نماذج مجسمة\n- أخرى: بطاقات ورقة المصادر 1-5، أنابيب وزجاجات وأكياس بلاستيكية لصنع النموذج\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n- الكتاب\n- السبورة التقليدية\n- أخرى: ورقة العمل 1-5، خبز، نشا الذرة، محلول اليود، قطارة، طبقان", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n- الهضم\n- الجهاز الهضمي\n- المريء\n- المعدة\n- الأمعاء\n- الفم\n- العصارة الهضمية\n- الأمعاء الدقيقة\n- الأمعاء الغليظة\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n- النشا\n- اختبار النشا\n- محلول اليود\n- اللعاب\n- الاستنتاج", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nيسأل المعلم: ماذا أكلت اليوم؟ ولماذا نأكل؟ ثم: هل يستطيع الجسم استخدام قطعة الخبز كما هي؟\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\nيعرض المعلم نشا الذرة ويضيف إليه قطرة يود فيتحول إلى أزرق داكن، ويسأل: ماذا يعني هذا اللون؟ هل يوجد نشا في الخبز؟", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1) التهيئة: لماذا نأكل؟ (1 دقيقة: 0–1)\n   المعلم: يجمع إجابات الطلبة ويقودهم إلى أن الطعام للنمو والطاقة.\n   الطالب: يشاركون ويستنتجون الحاجة إلى تفتيت الطعام.\n2) رحلة الطعام (3 دقائق: 1–4)\n   المعلم: يعرض الشكل ص 27 ويشرح: المضغ واللعاب في الفم، المريء، المعدة والعصارة الهضمية، الأمعاء، الإخراج.\n   الطالب: يتتبعون الرحلة بأصابعهم على الشكل ويكتبون الترتيب.\n3) طول الأمعاء الدقيقة (2 دقيقتان: 4–6)\n   المعلم: يفرد خيطًا بطول 7 أمتار تقريبًا في الصف ثم يطويه، ويسأل: كيف تتسع له البطن؟\n   الطالب: يقيسون بخطواتهم ويستنتجون أن الأمعاء مطوية.\n4) ملخص مصوّر (2 دقيقتان: 6–8)\n   المعلم: يطلب رسم مخطط سهمي لمسار الطعام، ويقدم الاختصار المساعد للمتعثرين (فم – مريء – معدة – أمعاء).\n   الطالب: يرسمون المخطط ويضيفون اسمًا لكل جزء.\n5) الختام والتقويم (2 دقيقتان: 8–10)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) لعبة مطابقة البطاقات (3 دقائق: 20–23)\n   المعلم: يوزّع بطاقات ورقة المصادر 1-5 (كتاب النشاط ص 47): صور الأجزاء وأسماؤها ووظائفها مع بطاقات مضلِّلة.\n   الطالب: تطابق المجموعات الصورة والاسم والوظيفة، ثم تتحقق مجموعة أخرى.\n8) بناء نموذج الجهاز الهضمي (4 دقائق: 23–27)\n   المعلم: يوجّه المجموعات لصنع نموذج من زجاجة (معدة) وأنبوب (مريء) وأنبوب طويل ملفوف (أمعاء).\n   الطالب: يبنون النموذج ويعلّقون بطاقة وظيفة على كل جزء.\n9) أسئلة الكتاب وتمرين 1-5 (2 دقيقتان: 27–29)\n   المعلم: يناقش الأسئلة 1–5 ص 26 ويوجه تمرين 1-5 (كتاب النشاط ص 20).\n   الطالب: يجيبون ويرتبون الوظائف ترتيبًا صحيحًا.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n1) التهيئة: اختبار النشا (3 دقائق: 0–3)\n   المعلم: يعرض اختبار النشا على نشا الذرة ويؤكد قواعد السلامة (لا تذوق لليود، تجنب البقع).\n   الطالب: يلاحظون تغير اللون ويكتبون قاعدة الاختبار.\n2) اختبار الخبز (ورقة العمل 1-5) (5 دقائق: 3–8)\n   المعلم: يوزع على المجموعات قطعة خبز في طبق وقطارة يود.\n   الطالب: يضيفون قطرة يود ويلاحظون اللون الأزرق الداكن: يوجد نشا.\n3) أثر المضغ (5 دقائق: 8–13)\n   المعلم: يطلب من كل طالب مضغ قطعة خبز نظيفة غير مخصصة للاختبار نحو دقيقة، ويعرض نتيجة عينة مُعدّة مسبقًا لخبز مُعرَّض للعاب.\n   الطالب: يلاحظون تحول الطعم إلى حلو، ويقارنون عدم تغير لون اليود في العينة المعالجة.\n4) الاستنتاج والعادات الصحية (4 دقائق: 13–17)\n   المعلم: يقود الاستنتاج: النشا يُهضم في الفم ويتحول إلى سكر؛ ويناقش الألياف والماء والرياضة.\n   الطالب: يكتبون الاستنتاج في ورقة العمل ويقترحون عادات صحية.\n5) الختام والتقويم (3 دقائق: 17–20)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1. [مستوى المعرفة] لماذا يحتاج جسمنا إلى الطعام؟\n   الإجابة النموذجية: للنمو والحصول على الطاقة ليعمل بصورة جيدة.\n2. [مستوى التطبيق] ما الجزء الذي يدفع الطعام من الفم إلى المعدة؟\n   الإجابة النموذجية: المريء.\n3. [مستوى الاستدلال] لماذا يجب هضم الطعام قبل أن يستفيد منه الجسم؟\n   الإجابة النموذجية: لأن الجسم لا يستطيع استخدام الطعام بحالته، فيجب تفتيته إلى جزيئات صغيرة يمكن نقلها في الدم.\n\n4. [مستوى المعرفة] ما وظيفة المعدة؟\n   الإجابة النموذجية: تمزج الطعام بالعصارة الهضمية فيصبح سائلًا سميكًا يشبه العصيدة.\n5. [مستوى التطبيق] ماذا يحدث للطعام داخل الأمعاء الدقيقة؟\n   الإجابة النموذجية: يُفتت إلى جزيئات أصغر تنتقل إلى الدم.\n6. [مستوى الاستدلال] بماذا يرتبط المريء؟ وبماذا ترتبط القصبة الهوائية؟\n   الإجابة النموذجية: المريء يرتبط بالمعدة، والقصبة الهوائية ترتبط بالرئتين.\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n1. [مستوى المعرفة] ما لون محلول اليود عند وجود النشا؟\n   الإجابة النموذجية: أزرق داكن.\n2. [مستوى التطبيق] لماذا أصبح طعم الخبز حلوًا بعد المضغ؟\n   الإجابة النموذجية: لأن اللعاب يبدأ هضم النشا فيحوّل جزءًا منه إلى سكر.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق أي مادة في المختبر؟\n   الإجابة النموذجية: لأن بعض المواد مثل اليود ضارة، والسلامة تقتضي عدم تذوق أو ابتلاع المواد المستخدمة.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\n1. [مستوى المعرفة] رتّب: الأمعاء – الفم – المعدة – المريء.\n   الإجابة النموذجية: الفم ← المريء ← المعدة ← الأمعاء.\n2. [مستوى التطبيق] ما العضوان الرئيسيان في هضم الطعام؟\n   الإجابة النموذجية: المعدة والأمعاء.\n3. [مستوى الاستدلال] لماذا تكون الأمعاء الدقيقة مطوية داخل البطن؟\n   الإجابة النموذجية: لأن طولها كبير (نحو 7 أمتار عند البالغ) فتُطوى لتتسع لها البطن.\n\n4. [مستوى المعرفة] ما دور الأسنان في الهضم؟\n   الإجابة النموذجية: تمضغ الطعام وتفتته إلى قطع صغيرة يسهل ابتلاعها.\n5. [مستوى التطبيق] كيف يصل الطعام المهضوم إلى أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الدم.\n6. [مستوى الاستدلال] أي أجزاء نموذجك يمثل المعدة؟ وما الذي ينقص النموذج ليشبه الجهاز الحقيقي؟\n   الإجابة النموذجية: الزجاجة؛ ينقصه مثلًا العصارة الهضمية وحركة العضلات (تقبل الإجابات المنطقية).\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\n1. [مستوى المعرفة] ماذا نستنتج من عدم تغير لون اليود في عينة الخبز الممضوغ جيدًا؟\n   الإجابة النموذجية: أن النشا هُضم (تحول إلى سكر) في الفم.\n2. [مستوى التطبيق] ما المادة في الفم التي تساعد على بدء الهضم؟\n   الإجابة النموذجية: اللعاب (العصارة الهضمية في اللعاب).\n3. [مستوى الاستدلال] اقترح ثلاث عادات تساعد جهازك الهضمي.\n   الإجابة النموذجية: مضغ الطعام جيدًا، شرب الماء، تناول الألياف كالفواكه والخضراوات، وممارسة الرياضة.", "الحصة 1: حاجتنا إلى الطعام ومسار الطعام في القناة الهضمية\nللطالب: قراءة كتاب الطالب ص 26–27 وكتابة ما أكله في يوم كامل. لولي الأمر: يُرجى تشجيع الابن على مضغ الطعام جيدًا وتناول وجبات متوازنة.\nللطالب: حل تمرين 1-5 في كتاب النشاط ص 20 واجبًا منزليًا، ومراجعة ص 27. لولي الأمر: يُرجى تشجيع الابن على شرب الماء وتناول الأطعمة الغنية بالألياف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5\n\nالحصة 2: استقصاء: يبدأ هضم النشا في الفم\nللطالب: إكمال إجابات ورقة العمل 1-5 (كتاب النشاط ص 59) ومراجعة الدرس كاملًا. لولي الأمر: يُرجى مساعدة الابن على اختيار أطعمة صحية والإقلال من المشروبات الغازية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=5"]}, {"id": "1-6", "title": "ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 28–29 | كتاب النشاط ص 21، 60 | دليل المعلم ص 37–38", "n": 2, "per": [{"h": {"lesson": "1-6 ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 28–29 | دليل المعلم ص 37–38", "num": "الحصة الأولى من 2", "focus": "الكليتان: موقعهما وشكلهما ووظيفة الإخراج"}, "f": ["1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما.\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول.\nمخرج تعليمي آخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج.", "1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما. ← تذكر\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول. ← فهم\nالمخرج الآخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج. ← تطبيق", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: وعاء كبير، مخبار مدرج، ماء، حبة فاصوليا للتشبيه", "- الكليتان\n- الإخراج\n- البول\n- الفضلات\n- تنقية الدم", "يسأل المعلم: ماذا يحدث عندما تشرب كمية كبيرة من الماء؟ لماذا تحتاج إلى دورة المياه؟ من المسؤول عن ذلك في جسمك؟", "1) التهيئة: إلى أين يذهب الماء؟ (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقدم مفردات الدرس.\n   الطالب: يجيبون ويتوقعون دور الكليتين.\n2) تحديد موقع الكليتين (8 دقائق: 5–13)\n   المعلم: يوضح الطريقة ص 28: اليدان على الوركين والإبهامان على الظهر ثم التحريك للأعلى حتى الضلوع؛ ويعرض حبة فاصوليا للتشبيه.\n   الطالب: يحددون موقع الكليتين على أجسامهم ويصفون الشكل والحجم (بحجم فأرة الحاسوب).\n3) وظيفة الإخراج (9 دقائق: 13–22)\n   المعلم: يشرح: يمر الدم عبر الكليتين نحو 40 مرة يوميًا لتنقيته ويُنتج نحو لتر من البول؛ ويصحح المفهوم الخاطئ أن ماء البول يأتي مباشرة مما نشربه.\n   الطالب: يرسمون مخططًا: دم بفضلات ← الكليتان ← دم نقي + بول.\n4) نشاط 1-6: كم يبلغ اللتر؟ (12 دقائق: 22–34)\n   المعلم: يوجه المجموعات لسكب ما يقدرونه لترًا في وعاء ثم قياسه بالمخبار المدرج وجمع القياسات.\n   الطالب: يقدّرون ويقيسون ويسجلون الفرق بين التقدير والقياس.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] أين توجد الكليتان؟\n   الإجابة النموذجية: في الجزء الخلفي من الجسم، أسفل الضلوع قليلًا.\n2. [مستوى التطبيق] ما اسم السائل الذي تخرج فيه الفضلات من الكليتين؟\n   الإجابة النموذجية: البول.\n3. [مستوى الاستدلال] من أين يأتي الماء الموجود في البول؟\n   الإجابة النموذجية: من الدم؛ إذ يمر الماء من الجهاز الهضمي إلى الدم ثم تأخذ الكليتان الماء الزائد منه.", "1. [مستوى المعرفة] ما العملية الرئيسية التي تقوم بها الكليتان؟\n   الإجابة النموذجية: الإخراج.\n2. [مستوى التطبيق] صف شكل الكليتين وحجمهما.\n   الإجابة النموذجية: زوج من الأعضاء على شكل حبة الفاصوليا، بحجم فأرة الحاسوب تقريبًا لدى البالغ.\n3. [مستوى الاستدلال] كيف تحققت من تقديرك لكمية لتر الماء؟\n   الإجابة النموذجية: بقياس الماء بالمخبار المدرج وجمع القياسات ومقارنتها بلتر.", "للطالب: قراءة كتاب الطالب ص 28 وحل تمرين 1-6 في كتاب النشاط ص 21 واجبًا منزليًا. لولي الأمر: يُرجى تذكير الابن بشرب كمية كافية من الماء يوميًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}, {"h": {"lesson": "1-6 ما وظيفة الكليتين؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الثالث (20–24/9/2026)", "pages": "كتاب الطالب ص 29 | كتاب النشاط ص 21، 60 | دليل المعلم ص 38", "num": "الحصة الثانية من 2", "focus": "صحة الكليتين وأهمية شرب الماء"}, "f": ["1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل.\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد.\nمخرج تعليمي آخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها.", "1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل. ← تذكر\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد. ← تحليل\nالمخرج الآخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها. ← تقييم", "- فكّر – زاوج – شارك\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقة العمل 1-6", "- غسيل الكلى\n- زراعة الكلى\n- التعرق\n- السوائل\n- المرض", "يسأل المعلم: ماذا يحدث لجسمك في يوم حار جدًا؟ ويكتب الأفكار على السبورة حتى يصل إلى «التعرق».", "1) التهيئة: يوم حار (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويجمع الأفكار.\n   الطالب: يذكرون التعرق والعطش.\n2) عندما تتوقف الكليتان (10 دقائق: 5–15)\n   المعلم: يشرح ص 29: إزالة كلية والعيش بواحدة سليمة، غسيل الكلى (ساعات لعدة أيام أسبوعيًا)، زراعة الكلى.\n   الطالب: يطرحون أسئلة ويجيبون عن السؤالين 3 و4 ص 29.\n3) تحدّث عن: الطقس الحار (9 دقائق: 15–24)\n   المعلم: يقود نقاش «فكر – زاوج – شارك»: إذا فقدنا ماءً بالتعرق، فماذا يبقى لتكوين البول؟\n   الطالب: يستنتجون أن البول يقل في الطقس الحار.\n4) ورقة العمل 1-6: من أين تحصل على السوائل؟ (11 دقائق: 24–35)\n   المعلم: يوجه إعداد قائمة بالسوائل خلال 24 ساعة وكمياتها، والأطعمة الرطبة.\n   الطالب: يحسبون ما يشربون ويقيّمون: هل يكفي؟\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المقصود بغسيل الكلى؟\n   الإجابة النموذجية: استخدام جهاز يقوم بعمل الكليتين لتصفية الدم وتنظيفه.\n2. [مستوى التطبيق] لماذا يستطيع الإنسان العيش بكلية واحدة؟\n   الإجابة النموذجية: لأن الكلية الواحدة السليمة تستطيع القيام بعمل التنقية الكافي للجسم.\n3. [مستوى الاستدلال] اذكر أطعمة تزود الجسم بالسوائل إلى جانب المشروبات.\n   الإجابة النموذجية: الفواكه والخضراوات والأرز المطبوخ والمعكرونة واللحوم والأسماك.", "1. [مستوى المعرفة] اذكر ثلاثة أشياء يمكن للأطباء القيام بها عند توقف الكليتين.\n   الإجابة النموذجية: استئصال الكلية التالفة، غسيل الكلى، زراعة كلية.\n2. [مستوى التطبيق] لماذا يفرز الجسم كمية بول أقل في الطقس الحار؟\n   الإجابة النموذجية: لأنه يفقد كمية أكبر من الماء بالتعرق فيبقى ماء زائد أقل لتكوين البول.\n3. [مستوى الاستدلال] اقترح ثلاث نصائح للمحافظة على صحة الكليتين.\n   الإجابة النموذجية: شرب كمية كافية من الماء، التقليل من الملح، عدم حبس البول، والفحص عند الشعور بالألم (تقبل الإجابات المنطقية).", "للطالب: إكمال ورقة العمل 1-6 (كتاب النشاط ص 60) بتسجيل السوائل التي يشربها خلال يوم. لولي الأمر: يُرجى مساعدة الابن في تسجيل كميات السوائل بدقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}], "comb": ["الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما.\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول.\nمخرج تعليمي آخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل.\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد.\nمخرج تعليمي آخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها.", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1. يحدّد موقع الكليتين في الجسم ويصف شكلهما وحجمهما. ← تذكر\n2. يشرح أن الكليتين تنقيان الدم من الفضلات والماء الزائد وتخرجانها على شكل بول. ← فهم\nالمخرج الآخر: يقدّر حجم لتر من الماء ويتحقق من تقديره بالمخبار المدرج. ← تطبيق\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n1. يذكر ما يمكن للأطباء فعله عند توقف الكليتين عن العمل. ← تذكر\n2. يفسر قلة كمية البول في الطقس الحار مقارنة بالطقس البارد. ← تحليل\nالمخرج الآخر: يقيّم كمية السوائل التي يتناولها يوميًا ويقترح تحسينها. ← تقييم", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n- فكّر – زاوج – شارك\n- التعلم الذاتي\n- التعلم المبني على حل المشكلات", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: وعاء كبير، مخبار مدرج، ماء، حبة فاصوليا للتشبيه\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ورقة العمل 1-6", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n- الكليتان\n- الإخراج\n- البول\n- الفضلات\n- تنقية الدم\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n- غسيل الكلى\n- زراعة الكلى\n- التعرق\n- السوائل\n- المرض", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nيسأل المعلم: ماذا يحدث عندما تشرب كمية كبيرة من الماء؟ لماذا تحتاج إلى دورة المياه؟ من المسؤول عن ذلك في جسمك؟\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nيسأل المعلم: ماذا يحدث لجسمك في يوم حار جدًا؟ ويكتب الأفكار على السبورة حتى يصل إلى «التعرق».", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1) التهيئة: إلى أين يذهب الماء؟ (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقدم مفردات الدرس.\n   الطالب: يجيبون ويتوقعون دور الكليتين.\n2) تحديد موقع الكليتين (8 دقائق: 5–13)\n   المعلم: يوضح الطريقة ص 28: اليدان على الوركين والإبهامان على الظهر ثم التحريك للأعلى حتى الضلوع؛ ويعرض حبة فاصوليا للتشبيه.\n   الطالب: يحددون موقع الكليتين على أجسامهم ويصفون الشكل والحجم (بحجم فأرة الحاسوب).\n3) وظيفة الإخراج (9 دقائق: 13–22)\n   المعلم: يشرح: يمر الدم عبر الكليتين نحو 40 مرة يوميًا لتنقيته ويُنتج نحو لتر من البول؛ ويصحح المفهوم الخاطئ أن ماء البول يأتي مباشرة مما نشربه.\n   الطالب: يرسمون مخططًا: دم بفضلات ← الكليتان ← دم نقي + بول.\n4) نشاط 1-6: كم يبلغ اللتر؟ (12 دقائق: 22–34)\n   المعلم: يوجه المجموعات لسكب ما يقدرونه لترًا في وعاء ثم قياسه بالمخبار المدرج وجمع القياسات.\n   الطالب: يقدّرون ويقيسون ويسجلون الفرق بين التقدير والقياس.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n1) التهيئة: يوم حار (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويجمع الأفكار.\n   الطالب: يذكرون التعرق والعطش.\n2) عندما تتوقف الكليتان (10 دقائق: 5–15)\n   المعلم: يشرح ص 29: إزالة كلية والعيش بواحدة سليمة، غسيل الكلى (ساعات لعدة أيام أسبوعيًا)، زراعة الكلى.\n   الطالب: يطرحون أسئلة ويجيبون عن السؤالين 3 و4 ص 29.\n3) تحدّث عن: الطقس الحار (9 دقائق: 15–24)\n   المعلم: يقود نقاش «فكر – زاوج – شارك»: إذا فقدنا ماءً بالتعرق، فماذا يبقى لتكوين البول؟\n   الطالب: يستنتجون أن البول يقل في الطقس الحار.\n4) ورقة العمل 1-6: من أين تحصل على السوائل؟ (11 دقائق: 24–35)\n   المعلم: يوجه إعداد قائمة بالسوائل خلال 24 ساعة وكمياتها، والأطعمة الرطبة.\n   الطالب: يحسبون ما يشربون ويقيّمون: هل يكفي؟\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1. [مستوى المعرفة] أين توجد الكليتان؟\n   الإجابة النموذجية: في الجزء الخلفي من الجسم، أسفل الضلوع قليلًا.\n2. [مستوى التطبيق] ما اسم السائل الذي تخرج فيه الفضلات من الكليتين؟\n   الإجابة النموذجية: البول.\n3. [مستوى الاستدلال] من أين يأتي الماء الموجود في البول؟\n   الإجابة النموذجية: من الدم؛ إذ يمر الماء من الجهاز الهضمي إلى الدم ثم تأخذ الكليتان الماء الزائد منه.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n1. [مستوى المعرفة] ما المقصود بغسيل الكلى؟\n   الإجابة النموذجية: استخدام جهاز يقوم بعمل الكليتين لتصفية الدم وتنظيفه.\n2. [مستوى التطبيق] لماذا يستطيع الإنسان العيش بكلية واحدة؟\n   الإجابة النموذجية: لأن الكلية الواحدة السليمة تستطيع القيام بعمل التنقية الكافي للجسم.\n3. [مستوى الاستدلال] اذكر أطعمة تزود الجسم بالسوائل إلى جانب المشروبات.\n   الإجابة النموذجية: الفواكه والخضراوات والأرز المطبوخ والمعكرونة واللحوم والأسماك.", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\n1. [مستوى المعرفة] ما العملية الرئيسية التي تقوم بها الكليتان؟\n   الإجابة النموذجية: الإخراج.\n2. [مستوى التطبيق] صف شكل الكليتين وحجمهما.\n   الإجابة النموذجية: زوج من الأعضاء على شكل حبة الفاصوليا، بحجم فأرة الحاسوب تقريبًا لدى البالغ.\n3. [مستوى الاستدلال] كيف تحققت من تقديرك لكمية لتر الماء؟\n   الإجابة النموذجية: بقياس الماء بالمخبار المدرج وجمع القياسات ومقارنتها بلتر.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\n1. [مستوى المعرفة] اذكر ثلاثة أشياء يمكن للأطباء القيام بها عند توقف الكليتين.\n   الإجابة النموذجية: استئصال الكلية التالفة، غسيل الكلى، زراعة كلية.\n2. [مستوى التطبيق] لماذا يفرز الجسم كمية بول أقل في الطقس الحار؟\n   الإجابة النموذجية: لأنه يفقد كمية أكبر من الماء بالتعرق فيبقى ماء زائد أقل لتكوين البول.\n3. [مستوى الاستدلال] اقترح ثلاث نصائح للمحافظة على صحة الكليتين.\n   الإجابة النموذجية: شرب كمية كافية من الماء، التقليل من الملح، عدم حبس البول، والفحص عند الشعور بالألم (تقبل الإجابات المنطقية).", "الحصة 1: الكليتان: موقعهما وشكلهما ووظيفة الإخراج\nللطالب: قراءة كتاب الطالب ص 28 وحل تمرين 1-6 في كتاب النشاط ص 21 واجبًا منزليًا. لولي الأمر: يُرجى تذكير الابن بشرب كمية كافية من الماء يوميًا.\n\nالحصة 2: صحة الكليتين وأهمية شرب الماء\nللطالب: إكمال ورقة العمل 1-6 (كتاب النشاط ص 60) بتسجيل السوائل التي يشربها خلال يوم. لولي الأمر: يُرجى مساعدة الابن في تسجيل كميات السوائل بدقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=6"]}, {"id": "1-7", "title": "ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 22، 61 | دليل المعلم ص 38–41", "n": 2, "per": [{"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | دليل المعلم ص 38–41", "num": "الحصة الأولى من 3", "focus": "الدماغ وحمايته والجهاز العصبي"}, "f": ["1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته.\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي.\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ.\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه.\n\nمخرج تعليمي آخر:\nيفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر.\nيشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية.", "1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته. ← تذكر\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي. ← فهم\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ. ← تذكر\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه. ← فهم\nالمخرج الآخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر. ← تحليل\nالمخرج الآخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية. ← تطبيق", "- التعلم بالاكتشاف\n- لعب الأدوار والمحاكاة\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: أكياس محكمة الغلق بها عصيدة باردة، خيوط لتمثيل الأعصاب، مطبوعات لرسم مبسط للدماغ، أقلام تلوين، صحيفة ومربع ورق صغير\n- صورة توضيحية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- الدماغ\n- الجمجمة\n- الأعصاب\n- الجهاز العصبي\n- الرسائل العصبية\n- المخ\n- المخيخ\n- جذع الدماغ\n- التوازن\n- الوظائف الحيوية", "يمرر المعلم أكياس عصيدة باردة محكمة الغلق، ويطلب وصف ملمسها، ثم يسأل: أي أعضاء الجسم تعتقد أنه يشبه هذه المادة؟", "1) التهيئة: كيس العصيدة (1 دقيقة: 0–1)\n   المعلم: يمرر الأكياس ويطرح السؤال.\n   الطالب: يصفون الملمس الرخو ويتوقعون أنه الدماغ.\n2) الدماغ وحمايته (3 دقائق: 1–4)\n   المعلم: يشرح ص 30: الدماغ رخو رمادي مجعد داخل الجمجمة، حجمه بحجم قبضتين، وحجمه لا يحدد الذكاء.\n   الطالب: يضمّون قبضتيهم لتقدير الحجم ويكتبون وصف الدماغ.\n3) لعبة الرسالة العصبية (3 دقائق: 4–7)\n   المعلم: يكوّن سلسلة طلاب (أعصاب) بين «الدماغ» و«اليد»، ويرسل رسالة بلمس الكتف.\n   الطالب: يمررون الرسالة بأسرع ما يمكن ويقيسون الزمن، ثم يناقشون موقف عبور الشارع.\n4) الأسئلة 1–2 ص 31 (3 دقائق: 7–10)\n   المعلم: يناقش: كيف يُحمى الدماغ؟ لماذا حمايته مهمة؟ كيف يرسل الرسائل؟\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n5) الختام والتقويم (2 دقيقتان: 10–12)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) أجزاء الدماغ الثلاثة (3 دقائق: 22–25)\n   المعلم: يعرض نموذجًا/ملصقًا ويشرح: المخ (تفكير وحواس وذاكرة ولغة)، المخيخ (حركة وتوازن)، جذع الدماغ (تنفس ودقات قلب وحرارة الجسم والهضم).\n   الطالب: يلوّنون الرسم: المخ أصفر، المخيخ أحمر، جذع الدماغ أزرق، ويكتبون وظيفتين لكل جزء.\n8) تمرين 1-7 (2 دقيقتان: 25–27)\n   المعلم: يوجه حل تمرين 1-7 (كتاب النشاط ص 22).\n   الطالب: يحلون فرديًا ثم يتبادلون التصحيح (تقييم الأقران).\n9) السؤال 3 والتحدي (2 دقيقتان: 27–29)\n   المعلم: يناقش السؤال 3 ص 31 (المكالمة الهاتفية) وسؤال التحدي (ارتجاج المخ).\n   الطالب: يكتبون خطوات المكالمة وما يقوم به الدماغ في كل خطوة.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-7).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] أين يوجد الدماغ؟ وما الذي يحميه؟\n   الإجابة النموذجية: داخل الرأس، وتحميه الجمجمة.\n2. [مستوى التطبيق] ما مكونات الجهاز العصبي؟\n   الإجابة النموذجية: الدماغ والأعصاب.\n3. [مستوى الاستدلال] لماذا يجب أن تنتقل الرسائل من الدماغ وإليه بسرعة كبيرة؟\n   الإجابة النموذجية: ليستجيب الجسم فورًا للخطر، مثل الابتعاد عن سيارة مسرعة.\n\n4. [مستوى المعرفة] ما الجزء المسؤول عن التوازن؟\n   الإجابة النموذجية: المخيخ.\n5. [مستوى التطبيق] اذكر وظيفتين لجذع الدماغ.\n   الإجابة النموذجية: التحكم في التنفس ودقات القلب (وكذلك حرارة الجسم والهضم).\n6. [مستوى الاستدلال] ما المقصود بارتجاج المخ؟\n   الإجابة النموذجية: تلف يلحق بالدماغ عادة بسبب ضربة قوية على الرأس، قد يسبب فقدان الوعي أو صداعًا شديدًا.", "1. [مستوى المعرفة] كيف يتصل الدماغ ببقية أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الأعصاب.\n2. [مستوى التطبيق] لماذا تُعد إصابات الدماغ خطيرة؟\n   الإجابة النموذجية: لأنه يتحكم في كل ما نقوم به ولا يستطيع عادة إصلاح نفسه.\n3. [مستوى الاستدلال] هل الإنسان ذو الدماغ الأكبر أذكى بالضرورة؟ وضح.\n   الإجابة النموذجية: لا؛ حجم الدماغ لا يرتبط بالذكاء، فدماغ أينشتاين كان أصغر قليلًا من المتوسط.\n\n4. [مستوى المعرفة] أي أجزاء الدماغ أكبرها؟ وما وظيفته؟\n   الإجابة النموذجية: المخ؛ يتحكم في التفكير والحواس والذاكرة واللغة.\n5. [مستوى التطبيق] ما الجزء الذي يعمل حتى ونحن نائمون للحفاظ على التنفس؟\n   الإجابة النموذجية: جذع الدماغ.\n6. [مستوى الاستدلال] اشرح دور الدماغ عند رنين الهاتف والرد على صديق.\n   الإجابة النموذجية: يسمعك الرنين وصوت الصديق، ويحرك يدك لالتقاط الهاتف، ويمكّنك من الرؤية والكلام والفهم.", "للطالب: قراءة كتاب الطالب ص 30–31، والتفكير في سؤال: هل يعمل الدماغ أثناء النوم؟ لولي الأمر: يُرجى التأكيد على ارتداء الخوذة عند ركوب الدراجة لحماية الرأس.\nللطالب: حل تمرين 1-7 (كتاب النشاط ص 22) إن لم يكتمل، ومراجعة أجزاء الدماغ ووظائفها. لولي الأمر: يُرجى الحرص على نوم الابن ساعات كافية لصحة الدماغ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"h": {"lesson": "1-7 ما وظيفة الدماغ؟", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 30–31 | كتاب النشاط ص 61 | دليل المعلم ص 40–41", "num": "الحصة الثالثة من 3", "focus": "مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)"}, "f": ["1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات.\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط.\n\nمخرج تعليمي آخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر.", "1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات. ← تحليل\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط. ← تحليل\nالمخرج الآخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر. ← تقييم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورقة العمل 1-7، آلة حاسبة", "- كتلة الجسم\n- كتلة الدماغ\n- النمط\n- النتيجة غير الملائمة للنمط\n- الغرام والكيلوغرام", "يعرض المعلم صورتي فيل وإنسان ويسأل: أيهما دماغه أثقل؟ وأيهما أذكى؟ هل يعني الدماغ الأثقل ذكاءً أكبر؟", "1) التهيئة: الفيل والإنسان (3 دقائق: 0–3)\n   المعلم: يطرح السؤال ويسجل التوقعات.\n   الطالب: يتوقعون ويبررون.\n2) قراءة الجدول والوحدات (3 دقائق: 3–6)\n   المعلم: يقرأ جدول ورقة العمل 1-7 (كتاب النشاط ص 61) وينبّه أن كتل الدماغ بالغرام والجسم بالكيلوغرام.\n   الطالب: يحوّلون بعض القيم بمساعدة المعلم.\n3) ورقة العمل 1-7: الترتيب والنمط (7 دقائق: 6–13)\n   المعلم: يتابع المجموعات أثناء الترتيب ويطرح أسئلة موجهة.\n   الطالب: يرتبون الكائنات حسب الكتلتين، ويصفون النمط (تزداد كتلة الدماغ بزيادة كتلة الجسم)، ويحددون البابون غير الملائم.\n4) التحدي ومناقشة الذكاء (4 دقائق: 13–17)\n   المعلم: يطرح التحدي: أي كائن دماغه أكبر نسبة إلى كتلة جسمه؟ ويوضح طريقة القسمة.\n   الطالب: يحسبون للمستوى الاستدلال ويستنتجون أنه الإنسان.\n5) الختام والتقويم (3 دقائق: 17–20)\n   المعلم: يطرح التقويم الختامي ويصحح المفهوم الخاطئ.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ما الكائن ذو أكبر كتلة دماغ في الجدول؟\n   الإجابة النموذجية: الفيل.\n2. [مستوى التطبيق] صف النمط بين كتلة الجسم وكتلة الدماغ.\n   الإجابة النموذجية: كلما زادت كتلة الجسم زادت كتلة الدماغ.\n3. [مستوى الاستدلال] لماذا لا يلائم البابون النمط؟\n   الإجابة النموذجية: لأن ترتيبه في كتلة الدماغ يختلف عن ترتيبه في كتلة الجسم، فدماغه أثقل من دماغ كائن أثقل منه جسمًا.", "1. [مستوى المعرفة] ما الوحدة التي قيست بها كتلة الدماغ في الجدول؟\n   الإجابة النموذجية: الغرام.\n2. [مستوى التطبيق] كيف نعرف الكائن الذي يملك أكبر دماغ نسبةً إلى جسمه؟\n   الإجابة النموذجية: بقسمة كتلة الدماغ على كتلة الجسم لكل كائن ومقارنة النتائج.\n3. [مستوى الاستدلال] هل تتفق مع العبارة: «الكائن ذو الدماغ الأثقل هو الأذكى»؟ علّل.\n   الإجابة النموذجية: لا؛ فالفيل دماغه أثقل من الإنسان، والإنسان أذكى، والذكاء لا يرتبط بحجم الدماغ وحده.", "للطالب: إكمال ورقة العمل 1-7 (كتاب النشاط ص 61) والاستعداد لمراجعة الوحدة الأولى. لولي الأمر: يُرجى مراجعة أعضاء الجسم ووظائفها مع الابن استعدادًا لحصص «تحقق من تقدمك».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}], "comb": ["الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته.\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي.\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ.\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه.\n\nمخرج تعليمي آخر:\nيفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر.\nيشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية.\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات.\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط.\n\nمخرج تعليمي آخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. يصف الدماغ ويحدد موقعه ودور الجمجمة في حمايته. ← تذكر\n2. يوضح أن الدماغ يرسل الرسائل ويستقبلها عبر الأعصاب مكوّنًا معها الجهاز العصبي. ← فهم\n3. يسمّي أجزاء الدماغ الرئيسية: المخ، المخيخ، جذع الدماغ. ← تذكر\n4. يربط كل جزء من أجزاء الدماغ بوظيفتين من وظائفه. ← فهم\nالمخرج الآخر: يفسر أهمية سرعة انتقال الرسائل العصبية في مواقف الخطر. ← تحليل\nالمخرج الآخر: يشرح كيف يمكّن الدماغ الإنسان من إجراء مكالمة هاتفية. ← تطبيق\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. يرتب الكائنات الحية حسب كتلة الجسم وكتلة الدماغ من جدول بيانات. ← تحليل\n2. يحدد النمط في البيانات والكائن الذي لا يلائم النمط. ← تحليل\nالمخرج الآخر: يقيّم صحة الاعتقاد بأن الدماغ الأكبر يعني ذكاءً أكبر. ← تقييم", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- التعلم بالاكتشاف\n- لعب الأدوار والمحاكاة\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم التشاركي", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: أكياس محكمة الغلق بها عصيدة باردة، خيوط لتمثيل الأعصاب، مطبوعات لرسم مبسط للدماغ، أقلام تلوين، صحيفة ومربع ورق صغير\n- صورة توضيحية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: ورقة العمل 1-7، آلة حاسبة", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n- الدماغ\n- الجمجمة\n- الأعصاب\n- الجهاز العصبي\n- الرسائل العصبية\n- المخ\n- المخيخ\n- جذع الدماغ\n- التوازن\n- الوظائف الحيوية\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n- كتلة الجسم\n- كتلة الدماغ\n- النمط\n- النتيجة غير الملائمة للنمط\n- الغرام والكيلوغرام", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nيمرر المعلم أكياس عصيدة باردة محكمة الغلق، ويطلب وصف ملمسها، ثم يسأل: أي أعضاء الجسم تعتقد أنه يشبه هذه المادة؟\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nيعرض المعلم صورتي فيل وإنسان ويسأل: أيهما دماغه أثقل؟ وأيهما أذكى؟ هل يعني الدماغ الأثقل ذكاءً أكبر؟", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n1) التهيئة: كيس العصيدة (1 دقيقة: 0–1)\n   المعلم: يمرر الأكياس ويطرح السؤال.\n   الطالب: يصفون الملمس الرخو ويتوقعون أنه الدماغ.\n2) الدماغ وحمايته (3 دقائق: 1–4)\n   المعلم: يشرح ص 30: الدماغ رخو رمادي مجعد داخل الجمجمة، حجمه بحجم قبضتين، وحجمه لا يحدد الذكاء.\n   الطالب: يضمّون قبضتيهم لتقدير الحجم ويكتبون وصف الدماغ.\n3) لعبة الرسالة العصبية (3 دقائق: 4–7)\n   المعلم: يكوّن سلسلة طلاب (أعصاب) بين «الدماغ» و«اليد»، ويرسل رسالة بلمس الكتف.\n   الطالب: يمررون الرسالة بأسرع ما يمكن ويقيسون الزمن، ثم يناقشون موقف عبور الشارع.\n4) الأسئلة 1–2 ص 31 (3 دقائق: 7–10)\n   المعلم: يناقش: كيف يُحمى الدماغ؟ لماذا حمايته مهمة؟ كيف يرسل الرسائل؟\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n5) الختام والتقويم (2 دقيقتان: 10–12)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) أجزاء الدماغ الثلاثة (3 دقائق: 22–25)\n   المعلم: يعرض نموذجًا/ملصقًا ويشرح: المخ (تفكير وحواس وذاكرة ولغة)، المخيخ (حركة وتوازن)، جذع الدماغ (تنفس ودقات قلب وحرارة الجسم والهضم).\n   الطالب: يلوّنون الرسم: المخ أصفر، المخيخ أحمر، جذع الدماغ أزرق، ويكتبون وظيفتين لكل جزء.\n8) تمرين 1-7 (2 دقيقتان: 25–27)\n   المعلم: يوجه حل تمرين 1-7 (كتاب النشاط ص 22).\n   الطالب: يحلون فرديًا ثم يتبادلون التصحيح (تقييم الأقران).\n9) السؤال 3 والتحدي (2 دقيقتان: 27–29)\n   المعلم: يناقش السؤال 3 ص 31 (المكالمة الهاتفية) وسؤال التحدي (ارتجاج المخ).\n   الطالب: يكتبون خطوات المكالمة وما يقوم به الدماغ في كل خطوة.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-7).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1) التهيئة: الفيل والإنسان (3 دقائق: 0–3)\n   المعلم: يطرح السؤال ويسجل التوقعات.\n   الطالب: يتوقعون ويبررون.\n2) قراءة الجدول والوحدات (3 دقائق: 3–6)\n   المعلم: يقرأ جدول ورقة العمل 1-7 (كتاب النشاط ص 61) وينبّه أن كتل الدماغ بالغرام والجسم بالكيلوغرام.\n   الطالب: يحوّلون بعض القيم بمساعدة المعلم.\n3) ورقة العمل 1-7: الترتيب والنمط (7 دقائق: 6–13)\n   المعلم: يتابع المجموعات أثناء الترتيب ويطرح أسئلة موجهة.\n   الطالب: يرتبون الكائنات حسب الكتلتين، ويصفون النمط (تزداد كتلة الدماغ بزيادة كتلة الجسم)، ويحددون البابون غير الملائم.\n4) التحدي ومناقشة الذكاء (4 دقائق: 13–17)\n   المعلم: يطرح التحدي: أي كائن دماغه أكبر نسبة إلى كتلة جسمه؟ ويوضح طريقة القسمة.\n   الطالب: يحسبون للمستوى الاستدلال ويستنتجون أنه الإنسان.\n5) الختام والتقويم (3 دقائق: 17–20)\n   المعلم: يطرح التقويم الختامي ويصحح المفهوم الخاطئ.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. [مستوى المعرفة] أين يوجد الدماغ؟ وما الذي يحميه؟\n   الإجابة النموذجية: داخل الرأس، وتحميه الجمجمة.\n2. [مستوى التطبيق] ما مكونات الجهاز العصبي؟\n   الإجابة النموذجية: الدماغ والأعصاب.\n3. [مستوى الاستدلال] لماذا يجب أن تنتقل الرسائل من الدماغ وإليه بسرعة كبيرة؟\n   الإجابة النموذجية: ليستجيب الجسم فورًا للخطر، مثل الابتعاد عن سيارة مسرعة.\n\n4. [مستوى المعرفة] ما الجزء المسؤول عن التوازن؟\n   الإجابة النموذجية: المخيخ.\n5. [مستوى التطبيق] اذكر وظيفتين لجذع الدماغ.\n   الإجابة النموذجية: التحكم في التنفس ودقات القلب (وكذلك حرارة الجسم والهضم).\n6. [مستوى الاستدلال] ما المقصود بارتجاج المخ؟\n   الإجابة النموذجية: تلف يلحق بالدماغ عادة بسبب ضربة قوية على الرأس، قد يسبب فقدان الوعي أو صداعًا شديدًا.\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. [مستوى المعرفة] ما الكائن ذو أكبر كتلة دماغ في الجدول؟\n   الإجابة النموذجية: الفيل.\n2. [مستوى التطبيق] صف النمط بين كتلة الجسم وكتلة الدماغ.\n   الإجابة النموذجية: كلما زادت كتلة الجسم زادت كتلة الدماغ.\n3. [مستوى الاستدلال] لماذا لا يلائم البابون النمط؟\n   الإجابة النموذجية: لأن ترتيبه في كتلة الدماغ يختلف عن ترتيبه في كتلة الجسم، فدماغه أثقل من دماغ كائن أثقل منه جسمًا.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\n1. [مستوى المعرفة] كيف يتصل الدماغ ببقية أجزاء الجسم؟\n   الإجابة النموذجية: عن طريق الأعصاب.\n2. [مستوى التطبيق] لماذا تُعد إصابات الدماغ خطيرة؟\n   الإجابة النموذجية: لأنه يتحكم في كل ما نقوم به ولا يستطيع عادة إصلاح نفسه.\n3. [مستوى الاستدلال] هل الإنسان ذو الدماغ الأكبر أذكى بالضرورة؟ وضح.\n   الإجابة النموذجية: لا؛ حجم الدماغ لا يرتبط بالذكاء، فدماغ أينشتاين كان أصغر قليلًا من المتوسط.\n\n4. [مستوى المعرفة] أي أجزاء الدماغ أكبرها؟ وما وظيفته؟\n   الإجابة النموذجية: المخ؛ يتحكم في التفكير والحواس والذاكرة واللغة.\n5. [مستوى التطبيق] ما الجزء الذي يعمل حتى ونحن نائمون للحفاظ على التنفس؟\n   الإجابة النموذجية: جذع الدماغ.\n6. [مستوى الاستدلال] اشرح دور الدماغ عند رنين الهاتف والرد على صديق.\n   الإجابة النموذجية: يسمعك الرنين وصوت الصديق، ويحرك يدك لالتقاط الهاتف، ويمكّنك من الرؤية والكلام والفهم.\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\n1. [مستوى المعرفة] ما الوحدة التي قيست بها كتلة الدماغ في الجدول؟\n   الإجابة النموذجية: الغرام.\n2. [مستوى التطبيق] كيف نعرف الكائن الذي يملك أكبر دماغ نسبةً إلى جسمه؟\n   الإجابة النموذجية: بقسمة كتلة الدماغ على كتلة الجسم لكل كائن ومقارنة النتائج.\n3. [مستوى الاستدلال] هل تتفق مع العبارة: «الكائن ذو الدماغ الأثقل هو الأذكى»؟ علّل.\n   الإجابة النموذجية: لا؛ فالفيل دماغه أثقل من الإنسان، والإنسان أذكى، والذكاء لا يرتبط بحجم الدماغ وحده.", "الحصة 1: الدماغ وحمايته والجهاز العصبي\nللطالب: قراءة كتاب الطالب ص 30–31، والتفكير في سؤال: هل يعمل الدماغ أثناء النوم؟ لولي الأمر: يُرجى التأكيد على ارتداء الخوذة عند ركوب الدراجة لحماية الرأس.\nللطالب: حل تمرين 1-7 (كتاب النشاط ص 22) إن لم يكتمل، ومراجعة أجزاء الدماغ ووظائفها. لولي الأمر: يُرجى الحرص على نوم الابن ساعات كافية لصحة الدماغ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7\n\nالحصة 2: مقارنة كتل الدماغ في الكائنات الحية (تحليل بيانات)\nللطالب: إكمال ورقة العمل 1-7 (كتاب النشاط ص 61) والاستعداد لمراجعة الوحدة الأولى. لولي الأمر: يُرجى مراجعة أعضاء الجسم ووظائفها مع الابن استعدادًا لحصص «تحقق من تقدمك».\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=7"]}, {"id": "1-8", "title": "تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 32–33 | كتاب النشاط ص 23، 62 | دليل المعلم ص 41–43", "n": 2, "per": [{"h": {"lesson": "1-8 تحقق من تقدمك", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الرابع (27/9–1/10/2026)", "pages": "كتاب الطالب ص 32 | دليل المعلم ص 41–43", "num": "الحصة الأولى من 2", "focus": "مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي"}, "f": ["1. يربط كل عضو من أعضاء الجسم بوظيفته الرئيسية.\n2. يصحح العبارات الخاطئة المتعلقة بالقلب والنبض والدم.\nمخرج تعليمي آخر: يرتب مراحل عملية الهضم ترتيبًا صحيحًا.", "1. يربط كل عضو من أعضاء الجسم بوظيفته الرئيسية. ← تذكر\n2. يصحح العبارات الخاطئة المتعلقة بالقلب والنبض والدم. ← فهم\nالمخرج الآخر: يرتب مراحل عملية الهضم ترتيبًا صحيحًا. ← تطبيق", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- الأقلام", "- الوظيفة\n- الدورة الدموية\n- النبض\n- الهضم\n- المريء", "يلعب المعلم «من أنا؟»: يقرأ وصفًا مثل «أنا عضلة لا تتعب، أضخ الدم» ويخمن الطلبة العضو.", "1) التهيئة: من أنا؟ (5 دقائق: 0–5)\n   المعلم: يقرأ أوصافًا لأعضاء مختلفة.\n   الطالب: يخمنون العضو بسرعة.\n2) السؤال 1: ال ه حل السؤال 5 (أ–ح) والسؤال 6 ص 33 ويناقش الحماية والوظائف وأثر كرة القدم على التنفس.\n   الطالب: يجيبون فرديًا ثم يناقشون في ثنائيات.\n3) المراجعة اللغوية (8 دقائق: 15–23)\n   المعلم: يوجه حل «المراجعة اللغوية» في كتاب النشاط ص 23.\n   الطالب: يكملون الجمل بالمصطلحات الصحيحة.\n4) ورقة العمل 1-8 وخريطة الأجهزة (12 دقائق: 23–35)\n   المعلم: يوزع ورقة العمل 1-8 (ص 62) ثم يطلب خريطة مفاهيمية للأجهزة الخمسة وأعضائها ووظائفها.\n   الطالب: يكملون الورقة ويرسمون الخريطة في مجموعات ويعرضونها.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-8).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\n1. [مستوى المعرفة] صوّب العبارة: «يضخ القلب الهواء إلى جميع أنحاء الجسم».\n   الإجابة النموذجية: يضخ القلب الدم إلى جميع أنحاء الجسم.\n2. [مستوى التطبيق] صوّب العبارة: «يحمل الدم ثاني أكسيد الكربون من الرئتين».\n   الإجابة النموذجية: يحمل الدم ثاني أكسيد الكربون إلى الرئتين لطرده.\n3. [مستوى الاستدلال] في أي جزء يتم مزج الطعام بالعصارة الهضمية؟\n   الإجابة النموذجية: في المعدة.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\n1. [مستوى المعرفة] ما اسم الفضلات التي تخرج من الكليتين؟\n   الإجابة النموذجية: البول.\n2. [مستوى التطبيق] كيف يؤثر لعب مباراة كرة قدم في عمل الرئتين؟\n   الإجابة النموذجية: يزيد معدل التنفس للحصول على مزيد من الأكسجين.\n3. [مستوى الاستدلال] كيف يتأكد الدماغ من أن الرئتين تقومان بعملهما؟\n   الإجابة النموذجية: يتحكم في التنفس فيرسل الرسائل عبر الأعصاب لتستمر عملية التنفس.", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\n1. [مستوى المعرفة] ما العضو المسؤول عن التحكم؟\n   الإجابة النموذجية: الدماغ.\n2. [مستوى التطبيق] ماذا يوضح معدل النبض؟\n   الإجابة النموذجية: مدى سرعة دقات القلب.\n3. [مستوى الاستدلال] رتب: يُدفع الطعام إلى المعدة، يُمضغ في الفم، يُفتت في الأمعاء، يُمزج بالعصارة.\n   الإجابة النموذجية: يُمضغ في الفم ← يُدفع إلى المعدة ← يُمزج بالعصارة في المعدة ← يُفتت في الأمعاء.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\n1. [مستوى المعرفة] ما الغاز الذي نطرحه خارج الرئتين؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n2. [مستوى التطبيق] أكمل: الدماغ والأعصاب تشكل الجهاز ____.\n   الإجابة النموذجية: العصبي.\n3. [مستوى الاستدلال] بيّن بمثال كيف يتعاون جهازان من أجهزة الجسم.\n   الإجابة النموذجية: الجهاز التنفسي يأخذ الأكسجين والجهاز الدوري ينقله بالدم إلى أجزاء الجسم (تقبل أمثلة صحيحة أخرى).", "الحصة 1: مراجعة الأعضاء ووظائفها والجهاز الدوري والهضمي\nللطالب: مراجعة كتاب الطالب ص 18–31 وحل السؤالين 5 و6 ص 33 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة إجابات الابن ومناقشة الأخطاء معه.\n\nالحصة 2: مراجعة شاملة: الأعضاء والأجهزة والمصطلحات\nللطالب: إكمال ورقة العمل 1-8 (كتاب النشاط ص 62) ومراجعة الوحدة الأولى كاملة. لولي الأمر: يُرجى الاطلاع على خريطة الأجهزة التي أعدّها الابن ومراجعتها معه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=8"]}, {"id": "2-1", "title": "السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 34–35 | كتاب النشاط ص 24 | دليل المعلم ص 48–49", "n": 2, "per": [{"h": {"lesson": "2-1 السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 34 | دليل المعلم ص 48–49", "num": "الحصة الأولى من 2", "focus": "الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)"}, "f": ["1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا.\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم.\nمخرج تعليمي آخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات.", "1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا. ← تذكر\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم. ← فهم\nالمخرج الآخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات. ← فهم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- السبورة التقليدية", "- الموطن الطبيعي\n- العلاقة الغذائية\n- السلسلة الغذائية\n- الآفات\n- السهم «تتغذى عليه»", "يذكّر المعلم بما درسه الطلبة في الصف الرابع عن المواطن الطبيعية، ويسأل: أين يعيش الضب؟ وأين تعيش السمكة؟ وماذا يأكل كل منهما؟", "1) التهيئة: أين تعيش؟ (5 دقائق: 0–5)\n   المعلم: يطرح أسئلة عن مواطن مألوفة في عُمان.\n   الطالب: يذكرون حيوانات ومواطنها وغذاءها.\n2) مزرعة محمد في صحار (10 دقائق: 5–15)\n   المعلم: يعرض صورة المزرعة ص 34 ويناقش: النباتات (ذرة، سبانخ، يقطين) والحيوانات والآفات (اليرقات، ثاقبة الذرة).\n   الطالب: يحددون الكائنات والعلاقات الغذائية بينها.\n3) كتابة السلسلة الغذائية (10 دقائق: 15–25)\n   المعلم: يشرح معنى السهم «يتغذى عليه» بمثال: السبانخ ← اليرقة، ويصحح اتجاه السهم.\n   الطالب: يكتبون سلسلتين من المزرعة على السبورة الصغيرة ويصفون كل واحدة.\n4) تحدّث: الآفات ومكافحتها (9 دقائق: 25–34)\n   المعلم: يناقش كيف تأكل الطيور اليرقات والسحالي ثاقبة الذرة فتحمي المحصول.\n   الطالب: يكملون سلسلة من ثلاث حلقات: ذرة ← ثاقبة الذرة ← سحلية.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي ويحدد موطنًا محليًا لنشاط الحصة القادمة.\n   الطالب: يجيبون ويختارون موطنًا قرب المدرسة أو المنزل.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المقصود بالموطن الطبيعي؟\n   الإجابة النموذجية: المكان الذي تعيش فيه الكائنات الحية في البيئة.\n2. [مستوى التطبيق] ماذا يعني السهم في السلسلة الغذائية: سبانخ ← يرقة؟\n   الإجابة النموذجية: أن اليرقة تتغذى على السبانخ.\n3. [مستوى الاستدلال] لماذا يفرح المزارع بوجود السحالي في مزرعته؟\n   الإجابة النموذجية: لأنها تأكل الحشرة ثاقبة الذرة فتقلل الضرر على المحصول.", "1. [مستوى المعرفة] اكتب سلسلة غذائية من مزرعة محمد.\n   الإجابة النموذجية: مثل: ورقة سبانخ ← يرقة ← طائر، أو ذرة ← حشرة ثاقبة الذرة ← سحلية.\n2. [مستوى التطبيق] ما الآفة؟ أعط مثالًا.\n   الإجابة النموذجية: كائن يضر بالمزروعات، مثل اليرقات أو الحشرة ثاقبة الذرة.\n3. [مستوى الاستدلال] ماذا يحدث لمحصول الذرة لو اختفت السحالي من المزرعة؟ ولماذا؟\n   الإجابة النموذجية: قد يتضرر أكثر لأن أعداد ثاقبة الذرة ستزداد دون من يأكلها.", "للطالب: قراءة كتاب الطالب ص 34، وملاحظة النباتات والحيوانات في حديقة المنزل أو الحي. لولي الأمر: يُرجى مرافقة الابن عند زيارة حديقة أو مزرعة لملاحظة الكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}, {"h": {"lesson": "2-1 السلاسل الغذائية في الموطن الطبيعي المحلي", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 35 | كتاب النشاط ص 24 | دليل المعلم ص 48–49", "num": "الحصة الثانية من 2", "focus": "استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)"}, "f": ["1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي.\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها.\nمخرج تعليمي آخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح).", "1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي. ← تطبيق\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها. ← تطبيق\nالمخرج الآخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح). ← تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- أخرى: حديقة المدرسة، عدسات مكبرة، دفتر ملاحظات", "- الملاحظة\n- الموطن الطبيعي\n- السلسلة الغذائية\n- الاعتماد المتبادل", "يذكّر المعلم بقواعد السلامة والرفق بالكائنات، ويوزع المهام: مسجّل، باحث تحت الأوراق، مراقب للطيور، رسّام.", "1) التهيئة والسلامة (5 دقائق: 0–5)\n   المعلم: يشرح خطوات نشاط 2-1 ص 35 والأدوار وقواعد السلامة والبقاء ضمن الحدود.\n   الطالب: يستلمون أدوارهم وأدواتهم.\n2) نشاط 2-1 في حديقة المدرسة (15 دقائق: 5–20)\n   المعلم: يرافق المجموعات ويوجه الملاحظة تحت الأوراق والشجيرات وفي الأشجار.\n   الطالب: يسجلون قائمة النباتات والحيوانات (حشرات، طيور) والعلاقات الغذائية الملاحظة.\n3) رسم السلاسل (10 دقائق: 20–30)\n   المعلم: يعود بالطلبة إلى الصف ويوجه حل الأسئلة 1–4 ص 35.\n   الطالب: يرسمون ثلاث سلاسل غذائية من ملاحظاتهم وسلسلتين من مزرعة محمد.\n4) مشاركة واع
