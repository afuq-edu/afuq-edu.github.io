هل يمكنني إرجاع الورقة كما كانت؟ ثم يحرق قطعة داخل صندوق الرمل ويعيد السؤال.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nيعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nيسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nيعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1) التهيئة: حالات المادة (5 دقائق: 0–5)\n   المعلم: يراجع الحالات الثلاث بأمثلة من الصف الخامس.\n   الطالب: يذكرون الماء: ثلج، ماء، بخار.\n2) نشاط 3-1: ملاحظة تغيرات الثلج (12 دقائق: 5–17)\n   المعلم: يوزع مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54.\n   الطالب: يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب.\n3) هل يمكن عكسه؟ (8 دقائق: 17–25)\n   المعلم: يسأل: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس».\n   الطالب: يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء.\n4) تصحيح المفاهيم (10 دقائق: 25–35)\n   المعلم: يوضح أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر).\n   الطالب: يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير).\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: التغيرات غير القابلة للعكس\n1) التهيئة: ورقة ممزقة وورقة محترقة (6 دقائق: 0–6)\n   المعلم: ينفذ العرض في صندوق الرمل بأمان.\n   الطالب: يقارنون: الممزقة يمكن لصقها، المحترقة لا.\n2) مفهوم التغير غير القابل للعكس (10 دقائق: 6–16)\n   المعلم: يشرح ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب.\n   الطالب: يكتبون التعريفين في جدول مقارنة.\n3) لعبة «قابل أم غير قابل؟» (12 دقائق: 16–28)\n   المعلم: يعرض بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد.\n   الطالب: يصنفون البطاقات ويبررون في ثنائيات.\n4) الأسئلة 1–3 ص 55 (7 دقائق: 28–35)\n   المعلم: يوجه سؤال الجلي والبيض المسلوق.\n   الطالب: يجيبون ويرسمون مخططًا سهميًا للجلي.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1) التهيئة: الشمعة القصيرة (5 دقائق: 0–5)\n   المعلم: يعرض الشمعتين ويجمع التوقعات.\n   الطالب: يقترحون: انصهر، احترق، تبخر.\n2) ورقة العمل 3-1 (الجزء الأول): عرض الشمعة (13 دقائق: 5–18)\n   المعلم: يشعل الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد.\n   الطالب: يسجلون الملاحظات في جدول ورقة العمل (ص 72).\n3) التحليل (10 دقائق: 18–28)\n   المعلم: يناقش: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة.\n   الطالب: يصنفون كل ملاحظة ويعللون.\n4) السلامة مع اللهب (7 دقائق: 28–35)\n   المعلم: يناقش قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة.\n   الطالب: يكتبون ثلاث قواعد سلامة.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1) التهيئة: من المطبخ (5 دقائق: 0–5)\n   المعلم: يعرض المادتين ويطلب تنبؤًا.\n   الطالب: يتنبؤون بما سيحدث.\n2) ورقة العمل 3-1 (الجزء الثاني) (12 دقائق: 5–17)\n   المعلم: يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس.\n   الطالب: يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟\n3) عرض الجص (8 دقائق: 17–25)\n   المعلم: يخلط الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج.\n   الطالب: يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص.\n4) فيزيائي أم كيميائي؟ (10 دقائق: 25–35)\n   المعلم: يشرح: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة).\n   الطالب: يصنفون أمثلة الدرس في جدول.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1) التهيئة: بركان (4 دقائق: 0–4)\n   المعلم: يعرض المقطع ويطرح السؤال.\n   الطالب: يقترحون الخل والبيكربونات.\n2) نموذج البركان (تكامل مع الفنون والمهارات الحياتية) (14 دقائق: 4–18)\n   المعلم: يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام.\n   الطالب: ينفذون الثوران ويصفون التغير ويصنفونه.\n3) تمرين 3-1 في كتاب النشاط (10 دقائق: 18–28)\n   المعلم: يوجه حل التمرين (ص 37) مع دعم المتعثرين.\n   الطالب: يقارنون التغيرات ويحلون فرديًا.\n4) تحدّث عن: إعادة تدوير الزجاج (7 دقائق: 28–35)\n   المعلم: يشرح: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟\n   الطالب: يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).\n\nالحصة 2: التغيرات غير القابلة للعكس\n1. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n2. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n3. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.\n\nالحصة 2: التغيرات غير القابلة للعكس\n1. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n2. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n3. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nللطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\n\nالحصة 2: التغيرات غير القابلة للعكس\nللطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nللطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nللطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nللطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"id": "3-2", "title": "خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38، 74 | دليل المعلم ص 74–77", "n": 5, "per": [{"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56 | دليل المعلم ص 74–76", "num": "الحصة الأولى من 5", "focus": "ما المخلوط؟ صنع مخاليط من مواد صلبة"}, "f": ["1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي.\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها.\nمخرج تعليمي آخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها.", "1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون", "- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي", "يعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة.", "1) التهيئة: كيس الفاصوليا (5 دقائق: 0–5)\n   المعلم: يعرض الكيس ويدوّن أمثلة الطلبة.\n   الطالب: يذكرون: السلطة، الحلوى، البهارات...\n2) تعريف المخلوط (8 دقائق: 5–13)\n   المعلم: يشرح ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون.\n   الطالب: يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء.\n3) نشاط 3-2أ: صنع المخاليط (15 دقائق: 13–28)\n   المعلم: يوزع المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب.\n   الطالب: يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟\n4) المناقشة (7 دقائق: 28–35)\n   المعلم: يقود الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل.\n   الطالب: يقارنون المخاليط: أيها يسهل رؤية مكوناته؟\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويحفظ المخاليط للحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.", "1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.", "للطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | دليل المعلم ص 75–76", "num": "الحصة الثانية من 5", "focus": "فصل المخاليط بالفرز والغربلة"}, "f": ["1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة.\n2. يختار الأدوات المناسبة لفصل كل مخلوط.\nمخرج تعليمي آخر: يربط حجم الجزيئات بطريقة الفصل المناسبة.", "1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n2. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل", "- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط", "- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات", "يسأل المعلم: كيف تفصل الأم الماء عن الأرز المطبوخ؟ وكيف يلتقط من لا يحب الزبيب حباته من مخلوط الفول السوداني؟", "1) التهيئة: من المطبخ (5 دقائق: 0–5)\n   المعلم: يطرح السؤالين ويقدم المصطلحين: الفرز والغربلة.\n   الطالب: يجيبون: المصفاة، الالتقاط باليد.\n2) طرق الفصل (8 دقائق: 5–13)\n   المعلم: يشرح ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة.\n   الطالب: يكملون جدول: الطريقة – متى نستخدمها – مثال.\n3) نشاط 3-2ب: فصل مخاليط الحصة السابقة (15 دقائق: 13–28)\n   المعلم: يحدد الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ.\n   الطالب: يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة.\n4) مناقشة السؤالين 1 و2 (7 دقائق: 28–35)\n   المعلم: يسأل: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟\n   الطالب: يذكرون الملح والرمل ويتوقعون السبب.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n3. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.", "1. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n2. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n3. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.", "للطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | كتاب النشاط ص 74 | دليل المعلم ص 76–77", "num": "الحصة الثالثة من 5", "focus": "الفصل بالمغناطيس (ورقة العمل 3-2)"}, "f": ["1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس.\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها.\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة.", "1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2", "- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل", "يسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟", "1) التهيئة: الدبابيس الضائعة (5 دقائق: 0–5)\n   المعلم: يطرح التحدي ويذكّر بالمواد المغناطيسية من الصف الرابع.\n   الطالب: يقترحون المغناطيس.\n2) السلامة (5 دقائق: 5–10)\n   المعلم: ينبه: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل.\n   الطالب: يستمعون ويكررون قواعد السلامة.\n3) ورقة العمل 3-2: فصل المخاليط (15 دقائق: 10–25)\n   المعلم: يوزع المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز.\n   الطالب: يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74).\n4) تحدّث عن: الخردة وتصحيح مفهوم (10 دقائق: 25–35)\n   المعلم: يوضح أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة.\n   الطالب: يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.", "1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.", "للطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | دليل المعلم ص 75–76", "num": "الحصة الرابعة من 5", "focus": "مقارنة طرق الفصل والتنبؤ بأفضلها"}, "f": ["1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس.\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره.\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله.", "1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر", "- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- طرق الفصل\n- التبخير\n- التنبؤ\n- الاختيار المعلل", "يعرض المعلم مخلوط الملح والرمل الذي لم يُفصل في الحصة السابقة، ويسأل: تذكروا الصف الرابع.. كيف استعدنا الملح من الماء؟", "1) التهيئة: لغز الملح والرمل (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويستمع للأفكار.\n   الطالب: يتذكرون التبخير.\n2) حل اللغز (فكرة) (10 دقائق: 5–15)\n   المعلم: يشرح الفكرة: نضيف الماء فيذوب الملح، نفصل الرمل، ثم نبخر الماء فيبقى الملح (ستدرس تفصيلًا لاحقًا).\n   الطالب: يرسمون مخططًا لخطوات الفصل.\n3) السؤال 3 ص 57: اختر وعلّل (12 دقائق: 15–27)\n   المعلم: يوجه التنبؤ بأفضل طريقة لفصل: الفول السوداني والفاصوليا، الملح وفتات الخبز، البازلاء والدقيق.\n   الطالب: يقترحون الطريقة ويعللون في ثنائيات ثم يعرضون.\n4) جدول المقارنة (8 دقائق: 27–35)\n   المعلم: يقود بناء جدول: الطريقة – المبدأ – مثال – متى لا تنجح.\n   الطالب: يكملون الجدول في الدفتر.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما أفضل طريقة لفصل الفول السوداني عن الفاصوليا؟\n   الإجابة النموذجية: الفرز؛ لأن الحبات كبيرة يسهل التقاطها.\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الملح عن فتات الخبز؟\n   الإجابة النموذجية: الغربلة إذا كان الفتات أكبر من حبيبات الملح.\n3. [مستوى الاستدلال] متى لا ينجح الفرز في الفصل؟\n   الإجابة النموذجية: عندما تكون الجزيئات صغيرة جدًا أو متشابهة يصعب التقاطها.", "1. [مستوى المعرفة] ما الطريقة التي تفصل الملح عن الماء؟\n   الإجابة النموذجية: التبخير.\n2. [مستوى التطبيق] لماذا لا نستخدم المغناطيس لفصل الملح عن الرمل؟\n   الإجابة النموذجية: لأنهما ليسا مادتين مغناطيسيتين.\n3. [مستوى الاستدلال] رتب خطوات فصل الملح عن الرمل.\n   الإجابة النموذجية: إضافة الماء وتحريكه ليذوب الملح، فصل الرمل، ثم تبخير الماء ليبقى الملح.", "للطالب: حل تمرين 3-2 في كتاب النشاط ص 38 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في طرق فصل يستخدمها في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38 | دليل المعلم ص 76–77", "num": "الحصة الخامسة من 5", "focus": "تحدي الفصل: تصميم خطة لفصل مخلوط معقد"}, "f": ["1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة.\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات.\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق.", "1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة. ← إبداع\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات. ← تقييم\nالمخرج الآخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق. ← فهم", "- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مخلوط من فاصوليا وأرز ودقيق ودبابيس، غربال، مغناطيس، أطباق", "- خطة الفصل\n- التسلسل\n- التقييم\n- الغربلة", "يعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟", "1) التهيئة: كيس الكنز (4 دقائق: 0–4)\n   المعلم: يعرض المخلوط ويطرح التحدي.\n   الطالب: يتحمسون ويقترحون أفكارًا أولية.\n2) التخطيط (8 دقائق: 4–12)\n   المعلم: يطلب خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة.\n   الطالب: يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق.\n3) التنفيذ (13 دقائق: 12–25)\n   المعلم: يتابع السلامة والدقة ويحسب الوقت.\n   الطالب: ينفذون الخطة ويسجلون نجاح كل خطوة.\n4) التقييم والتحسين (6 دقائق: 25–31)\n   المعلم: يدير مقارنة بين خطط المجموعات.\n   الطالب: يقيّمون خطتهم ويقترحون تحسينًا.\n5) القمح والدقيق (4 دقائق: 31–35)\n   المعلم: يشرح باختصار فصل القشور عن الحبوب بالغربلة.\n   الطالب: يربطون الفكرة بطرق الفصل.\n6) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "للطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}], "comb": ["الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي.\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها.\nمخرج تعليمي آخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة.\n2. يختار الأدوات المناسبة لفصل كل مخلوط.\nمخرج تعليمي آخر: يربط حجم الجزيئات بطريقة الفصل المناسبة.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس.\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها.\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس.\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره.\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة.\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات.\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n2. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة. ← إبداع\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات. ← تقييم\nالمخرج الآخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق. ← فهم", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n- التعلم التعاوني\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n- الكتاب\n- صورة توضيحية\n- أخرى: مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- الكتاب\n- صورة توضيحية\n- أخرى: مخلوط من فاصوليا وأرز ودقيق ودبابيس، غربال، مغناطيس، أطباق", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n- طرق الفصل\n- التبخير\n- التنبؤ\n- الاختيار المعلل\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- خطة الفصل\n- التسلسل\n- التقييم\n- الغربلة", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nيعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\nيسأل المعلم: كيف تفصل الأم الماء عن الأرز المطبوخ؟ وكيف يلتقط من لا يحب الزبيب حباته من مخلوط الفول السوداني؟\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\nيسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\nيعرض المعلم مخلوط الملح والرمل الذي لم يُفصل في الحصة السابقة، ويسأل: تذكروا الصف الرابع.. كيف استعدنا الملح من الماء؟\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nيعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1) التهيئة: كيس الفاصوليا (5 دقائق: 0–5)\n   المعلم: يعرض الكيس ويدوّن أمثلة الطلبة.\n   الطالب: يذكرون: السلطة، الحلوى، البهارات...\n2) تعريف المخلوط (8 دقائق: 5–13)\n   المعلم: يشرح ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون.\n   الطالب: يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء.\n3) نشاط 3-2أ: صنع المخاليط (15 دقائق: 13–28)\n   المعلم: يوزع المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب.\n   الطالب: يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟\n4) المناقشة (7 دقائق: 28–35)\n   المعلم: يقود الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل.\n   الطالب: يقارنون المخاليط: أيها يسهل رؤية مكوناته؟\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويحفظ المخاليط للحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1) التهيئة: من المطبخ (5 دقائق: 0–5)\n   المعلم: يطرح السؤالين ويقدم المصطلحين: الفرز والغربلة.\n   الطالب: يجيبون: المصفاة، الالتقاط باليد.\n2) طرق الفصل (8 دقائق: 5–13)\n   المعلم: يشرح ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة.\n   الطالب: يكملون جدول: الطريقة – متى نستخدمها – مثال.\n3) نشاط 3-2ب: فصل مخاليط الحصة السابقة (15 دقائق: 13–28)\n   المعلم: يحدد الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ.\n   الطالب: يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة.\n4) مناقشة السؤالين 1 و2 (7 دقائق: 28–35)\n   المعلم: يسأل: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟\n   الطالب: يذكرون الملح والرمل ويتوقعون السبب.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1) التهيئة: الدبابيس الضائعة (5 دقائق: 0–5)\n   المعلم: يطرح التحدي ويذكّر بالمواد المغناطيسية من الصف الرابع.\n   الطالب: يقترحون المغناطيس.\n2) السلامة (5 دقائق: 5–10)\n   المعلم: ينبه: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل.\n   الطالب: يستمعون ويكررون قواعد السلامة.\n3) ورقة العمل 3-2: فصل المخاليط (15 دقائق: 10–25)\n   المعلم: يوزع المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز.\n   الطالب: يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74).\n4) تحدّث عن: الخردة وتصحيح مفهوم (10 دقائق: 25–35)\n   المعلم: يوضح أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة.\n   الطالب: يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1) التهيئة: لغز الملح والرمل (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويستمع للأفكار.\n   الطالب: يتذكرون التبخير.\n2) حل اللغز (فكرة) (10 دقائق: 5–15)\n   المعلم: يشرح الفكرة: نضيف الماء فيذوب الملح، نفصل الرمل، ثم نبخر الماء فيبقى الملح (ستدرس تفصيلًا لاحقًا).\n   الطالب: يرسمون مخططًا لخطوات الفصل.\n3) السؤال 3 ص 57: اختر وعلّل (12 دقائق: 15–27)\n   المعلم: يوجه التنبؤ بأفضل طريقة لفصل: الفول السوداني والفاصوليا، الملح وفتات الخبز، البازلاء والدقيق.\n   الطالب: يقترحون الطريقة ويعللون في ثنائيات ثم يعرضون.\n4) جدول المقارنة (8 دقائق: 27–35)\n   المعلم: يقود بناء جدول: الطريقة – المبدأ – مثال – متى لا تنجح.\n   الطالب: يكملون الجدول في الدفتر.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1) التهيئة: كيس الكنز (4 دقائق: 0–4)\n   المعلم: يعرض المخلوط ويطرح التحدي.\n   الطالب: يتحمسون ويقترحون أفكارًا أولية.\n2) التخطيط (8 دقائق: 4–12)\n   المعلم: يطلب خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة.\n   الطالب: يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق.\n3) التنفيذ (13 دقائق: 12–25)\n   المعلم: يتابع السلامة والدقة ويحسب الوقت.\n   الطالب: ينفذون الخطة ويسجلون نجاح كل خطوة.\n4) التقييم والتحسين (6 دقائق: 25–31)\n   المعلم: يدير مقارنة بين خطط المجموعات.\n   الطالب: يقيّمون خطتهم ويقترحون تحسينًا.\n5) القمح والدقيق (4 دقائق: 31–35)\n   المعلم: يشرح باختصار فصل القشور عن الحبوب بالغربلة.\n   الطالب: يربطون الفكرة بطرق الفصل.\n6) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n3. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. [مستوى المعرفة] ما أفضل طريقة لفصل الفول السوداني عن الفاصوليا؟\n   الإجابة النموذجية: الفرز؛ لأن الحبات كبيرة يسهل التقاطها.\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الملح عن فتات الخبز؟\n   الإجابة النموذجية: الغربلة إذا كان الفتات أكبر من حبيبات الملح.\n3. [مستوى الاستدلال] متى لا ينجح الفرز في الفصل؟\n   الإجابة النموذجية: عندما تكون الجزيئات صغيرة جدًا أو متشابهة يصعب التقاطها.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n2. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n3. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. [مستوى المعرفة] ما الطريقة التي تفصل الملح عن الماء؟\n   الإجابة النموذجية: التبخير.\n2. [مستوى التطبيق] لماذا لا نستخدم المغناطيس لفصل الملح عن الرمل؟\n   الإجابة النموذجية: لأنهما ليسا مادتين مغناطيسيتين.\n3. [مستوى الاستدلال] رتب خطوات فصل الملح عن الرمل.\n   الإجابة النموذجية: إضافة الماء وتحريكه ليذوب الملح، فصل الرمل، ثم تبخير الماء ليبقى الملح.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nللطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\nللطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\nللطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\nللطالب: حل تمرين 3-2 في كتاب النشاط ص 38 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في طرق فصل يستخدمها في المنزل.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nللطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"id": "3-3", "title": "المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39، 75 | دليل المعلم ص 77–80", "n": 5, "per": [{"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58 | دليل المعلم ص 77–78", "num": "الحصة الأولى من 5", "focus": "ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان"}, "f": ["1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة.\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول.\nمخرج تعليمي آخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء.", "1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة. ← تذكر\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول. ← تطبيق\nالمخرج الآخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء. ← فهم", "- التعلم بالاكتشاف\n- العصف الذهني\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ماء ساخن، حبيبات قهوة، سكر، رمل، كأس زجاجية", "- الذوبان\n- قابل للذوبان\n- غير قابل للذوبان\n- الجزيئات", "يضيف المعلم ماءً ساخنًا إلى ملعقة من حبيبات القهوة أمام الطلبة ويسأل: أين ذهبت الحبيبات؟ هل اختفت؟", "1) التهيئة: القهوة المختفية (5 دقائق: 0–5)\n   المعلم: ينفذ العرض ويطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) مفهوم الذوبان (10 دقائق: 5–15)\n   المعلم: يشرح ص 58: السكر يذوب فهو قابل للذوبان، والرمل لا يذوب فهو غير قابل؛ والجزيئات الصغيرة تنتشر في الماء.\n   الطالب: يكتبون التعريفين ويرسمون جزيئات تنتشر.\n3) عصف ذهني: ماذا يذوب؟ (10 دقائق: 15–25)\n   المعلم: يطلب اقتراح مواد تذوب وأخرى لا تذوب ويدونها على السبورة.\n   الطالب: يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق.\n4) جدول التنبؤات (10 دقائق: 25–35)\n   المعلم: يرسم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم.\n   الطالب: يملؤون عمود التنبؤ استعدادًا للاستقصاء.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.", "1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.", "للطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | دليل المعلم ص 78–79", "num": "الحصة الثانية من 5", "focus": "استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟"}, "f": ["1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية.\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته.\nمخرج تعليمي آخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته.", "1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية. ← تطبيق\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته. ← تحليل\nالمخرج الآخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته. ← تقييم", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: مخبار مدرج، كؤوس، ملعقة صغيرة، ملح، دقيق، رمل، بلورات برمنجنات البوتاسيوم، ملقط", "- المحلول\n- المخلوط الشفاف\n- المخلوط الضبابي\n- الملاحظة\n- الاستنتاج", "يعرض المعلم كأسين: ماء صافٍ مذاب فيه ملح، وماء ممزوج بالدقيق، ويسأل: في أي الكأسين ذابت المادة؟ كيف عرفت؟", "1) التهيئة: الكأسان (5 دقائق: 0–5)\n   المعلم: يعرض الكأسين ويطرح السؤال.\n   الطالب: يقارنون الشفافية.\n2) السلامة (5 دقائق: 5–10)\n   المعلم: ينبه: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس.\n   الطالب: يكررون قواعد السلامة.\n3) نشاط 3-3: التنفيذ (15 دقائق: 10–25)\n   المعلم: يوجه وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها.\n   الطالب: ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان.\n4) التسجيل والاستنتاج (10 دقائق: 25–35)\n   المعلم: يوجه إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ.\n   الطالب: يكملون الجدول ويحددون صحة تنبؤاتهم.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n2. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n3. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.", "1. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n2. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n3. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.", "للطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 59 | دليل المعلم ص 78–80", "num": "الحصة الثالثة من 5", "focus": "المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟"}, "f": ["1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو).\n2. يعرّف المخلوط المعلّق ويميزه من المحلول.\nمخرج تعليمي آخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء.", "1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو). ← فهم\n2. يعرّف المخلوط المعلّق ويميزه من المحلول. ← فهم\nالمخرج الآخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء. ← تحليل", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كؤوس استقصاء الحصة السابقة أو كؤوس معدة جديدًا", "- المخلوط المعلّق\n- الترسب\n- الطفو\n- الاختبار العادل", "يعيد المعلم عرض كؤوس الاستقصاء بعد تركها، ويسأل: ماذا تغير في كأس الدقيق وكأس الرمل؟", "1) التهيئة: بعد خمس دقائق (5 دقائق: 0–5)\n   المعلم: يعرض الكؤوس ويطرح السؤال.\n   الطالب: يلاحظون ترسب الرمل والدقيق في القاع.\n2) الأسئلة 1–4 ص 59 (10 دقائق: 5–15)\n   المعلم: يوجه: ماذا حدث في المخلوط الضبابي والشفاف؟ ولماذا بعد خمس دقائق؟ ولماذا الكميات المتساوية؟\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n3) المخلوط المعلّق (10 دقائق: 15–25)\n   المعلم: يشرح: المواد غير الذائبة تبقى مرئية، وبعضها يستقر في القاع وبعضها يطفو؛ ويقارن بالمحلول.\n   الطالب: يكملون جدول مقارنة: المحلول – المعلّق (الشفافية، الرؤية، الترسب).\n4) تحدّث عن: قطع السكر (10 دقائق: 25–35)\n   المعلم: يناقش لماذا تذوب قطع السكر أبطأ من الحبيبات.\n   الطالب: يستنتجون أن الحبيبات الخارجية تذوب أولًا.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ماذا حدث للرمل بعد ترك المخلوط خمس دقائق؟\n   الإجابة النموذجية: استقر في قاع الكأس.\n2. [مستوى التطبيق] ما المخلوط المعلّق؟\n   الإجابة النموذجية: مخلوط من مادة صلبة غير قابلة للذوبان في سائل تبقى فيه مرئية.\n3. [مستوى الاستدلال] لماذا يجب استخدام الكمية نفسها من الماء والمادة الصلبة في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة صحيحة بين المواد.", "1. [مستوى المعرفة] هل يمكنك رؤية المادة الصلبة في المحلول؟\n   الإجابة النموذجية: لا؛ لأنها ذابت تمامًا.\n2. [مستوى التطبيق] اذكر مادة تطفو على سطح الماء دون أن تذوب.\n   الإجابة النموذجية: الفلفل المطحون أو بودرة التلك.\n3. [مستوى الاستدلال] لماذا تذوب قطعة السكر أبطأ من الحبيبات؟\n   الإجابة النموذجية: لأن الحبيبات الداخلية لا تتصل بالماء حتى تذوب الخارجية أولًا.", "للطالب: كتابة جدول المقارنة بين المحلول والمخلوط المعلّق في الدفتر. لولي الأمر: يُرجى ملاحظة عصير البرتقال الطازج مع الابن بعد تركه قليلًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 59 | كتاب النشاط ص 75 | دليل المعلم ص 79", "num": "الحصة الرابعة من 5", "focus": "ملاحظة المخاليط ورسمها (ورقة العمل 3-3)"}, "f": ["1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه.\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة.\nمخرج تعليمي آخر: يقارن بين المواد الطافية والمستقرة في القاع.", "1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه. ← تطبيق\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة. ← تحليل\nالمخرج الآخر: يقارن بين المواد الطافية والمستقرة في القاع. ← تحليل", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- الأقلام\n- أخرى: مخاليط معدة: ملح وماء، مسحوق شراب بارد، برمنجنات وماء، فلفل وماء، طباشير أو تلك وماء؛ ورقة العمل 3-3", "- المحلول\n- المخلوط المعلّق\n- الطفو\n- الاستقرار في القاع", "يرفع المعلم كأس فلفل مطحون في الماء ويسأل: هل ذاب الفلفل؟ لماذا بقي على السطح؟", "1) التهيئة: الفلفل العائم (4 دقائق: 0–4)\n   المعلم: يطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) ورقة العمل 3-3: الملاحظة والرسم (16 دقائق: 4–20)\n   المعلم: يجهز المخاليط الخمسة (ملعقة صغيرة في 100 mL ماء) ويخبر بمكوناتها.\n   الطالب: يحركون كل مخلوط ويلاحظونه ويرسمونه ويصفونه في الورقة (ص 75).\n3) التصنيف وجدول الدعم (10 دقائق: 20–30)\n   المعلم: يوجه التصنيف ويقدم جدولًا للمتعثرين: هل تذوب؟ كيف يبدو؟ هل ترى المادة؟ هل تستقر أم تطفو؟\n   الطالب: يصنفون: الملح والشراب محلولان؛ الفلفل والتلك يطفوان؛ الطباشير يستقر.\n4) مراجعة جماعية (5 دقائق: 30–35)\n   المعلم: يعرض الإجابات ويصحح.\n   الطالب: يصححون أعمالهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.", "1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.", "للطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39 | دليل المعلم ص 79–80", "num": "الحصة الخامسة من 5", "focus": "تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)"}, "f": ["1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها.\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية.\nمخرج تعليمي آخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة.", "1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها. ← تحليل\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية. ← فهم\nالمخرج الآخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة. ← فهم", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ماء مذاب فيه سكر للعرض، تمرين 3-3", "- المادة الذائبة\n- التغير الفيزيائي\n- شفاف\n- ضبابي\n- مُعلّق", "يذيب المعلم ملعقة سكر في كوب ماء نظيف ويسأل: السكر اختفى، فهل ما زال موجودًا؟ كيف نتأكد؟ (يتذوق المعلم أو متطوع بأمان لأن السكر غذاء).", "1) التهيئة: السكر الخفي (5 دقائق: 0–5)\n   المعلم: ينفذ العرض ويؤكد قاعدة: لا نتذوق إلا ما هو آمن وبإذن المعلم.\n   الطالب: يستنتجون أن الطعم الحلو دليل على وجود السكر.\n2) الذوبان تغير فيزيائي (8 دقائق: 5–13)\n   المعلم: يشرح أن جزيئات السكر لم تتغير ولم تتفاعل مع الماء، ويمكن استعادتها بالتبخير.\n   الطالب: يكتبون جملة: الذوبان تغير فيزيائي قابل للعكس.\n3) تمرين 3-3 في كتاب النشاط (12 دقائق: 13–25)\n   المعلم: يوجه حل التمرين (ص 39).\n   الطالب: يحلون فرديًا ويتحققون مع زميل.\n4) لعبة الكلمات (10 دقائق: 25–35)\n   المعلم: يقرأ تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج.\n   الطالب: يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "للطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}], "comb": ["الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة.\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول.\nمخرج تعليمي آخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية.\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته.\nمخرج تعليمي آخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو).\n2. يعرّف المخلوط المعلّق ويميزه من المحلول.\nمخرج تعليمي آخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه.\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة.\nمخرج تعليمي آخر: يقارن بين المواد الطافية والمستقرة في القاع.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها.\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية.\nمخرج تعليمي آخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة. ← تذكر\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول. ← تطبيق\nالمخرج الآخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء. ← فهم\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية. ← تطبيق\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته. ← تحليل\nالمخرج الآخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته. ← تقييم\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو). ← فهم\n2. يعرّف المخلوط المعلّق ويميزه من المحلول. ← فهم\nالمخرج الآخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء. ← تحليل\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه. ← تطبيق\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة. ← تحليل\nالمخرج الآخر: يقارن بين المواد الطافية والمستقرة في القاع. ← تحليل\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها. ← تحليل\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية. ← فهم\nالمخرج الآخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة. ← فهم", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n- التعلم بالاكتشاف\n- العصف الذهني\n- فكّر – زاوج – شارك\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم الذاتي\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n- التعلم المبني على اللعب\n- التعلم الذاتي\n- التعلم التعاوني", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ماء ساخن، حبيبات قهوة، سكر، رمل، كأس زجاجية\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n- الكتاب\n- السبورة التقليدية\n- أخرى: مخبار مدرج، كؤوس، ملعقة صغيرة، ملح، دقيق، رمل، بلورات برمنجنات البوتاسيوم، ملقط\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كؤوس استقصاء الحصة السابقة أو كؤوس معدة جديدًا\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n- الكتاب\n- الأقلام\n- أخرى: مخاليط معدة: ملح وماء، مسحوق شراب بارد، برمنجنات وماء، فلفل وماء، طباشير أو تلك وماء؛ ورقة العمل 3-3\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ماء مذاب فيه سكر للعرض، تمرين 3-3", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n- الذوبان\n- قابل للذوبان\n- غير قابل للذوبان\n- الجزيئات\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n- المحلول\n- المخلوط الشفاف\n- المخلوط الضبابي\n- الملاحظة\n- الاستنتاج\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n- المخلوط المعلّق\n- الترسب\n- الطفو\n- الاختبار العادل\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n- المحلول\n- المخلوط المعلّق\n- الطفو\n- الاستقرار في القاع\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n- المادة الذائبة\n- التغير الفيزيائي\n- شفاف\n- ضبابي\n- مُعلّق", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nيضيف المعلم ماءً ساخنًا إلى ملعقة من حبيبات القهوة أمام الطلبة ويسأل: أين ذهبت الحبيبات؟ هل اختفت؟\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\nيعرض المعلم كأسين: ماء صافٍ مذاب فيه ملح، وماء ممزوج بالدقيق، ويسأل: في أي الكأسين ذابت المادة؟ كيف عرفت؟\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nيعيد المعلم عرض كؤوس الاستقصاء بعد تركها، ويسأل: ماذا تغير في كأس الدقيق وكأس الرمل؟\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nيرفع المعلم كأس فلفل مطحون في الماء ويسأل: هل ذاب الفلفل؟ لماذا بقي على السطح؟\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nيذيب المعلم ملعقة سكر في كوب ماء نظيف ويسأل: السكر اختفى، فهل ما زال موجودًا؟ كيف نتأكد؟ (يتذوق المعلم أو متطوع بأمان لأن السكر غذاء).", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1) التهيئة: القهوة المختفية (5 دقائق: 0–5)\n   المعلم: ينفذ العرض ويطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) مفهوم الذوبان (10 دقائق: 5–15)\n   المعلم: يشرح ص 58: السكر يذوب فهو قابل للذوبان، والرمل لا يذوب فهو غير قابل؛ والجزيئات الصغيرة تنتشر في الماء.\n   الطالب: يكتبون التعريفين ويرسمون جزيئات تنتشر.\n3) عصف ذهني: ماذا يذوب؟ (10 دقائق: 15–25)\n   المعلم: يطلب اقتراح مواد تذوب وأخرى لا تذوب ويدونها على السبورة.\n   الطالب: يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق.\n4) جدول التنبؤات (10 دقائق: 25–35)\n   المعلم: يرسم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم.\n   الطالب: يملؤون عمود التنبؤ استعدادًا للاستقصاء.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1) التهيئة: الكأسان (5 دقائق: 0–5)\n   المعلم: يعرض الكأسين ويطرح السؤال.\n   الطالب: يقارنون الشفافية.\n2) السلامة (5 دقائق: 5–10)\n   المعلم: ينبه: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس.\n   الطالب: يكررون قواعد السلامة.\n3) نشاط 3-3: التنفيذ (15 دقائق: 10–25)\n   المعلم: يوجه وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها.\n   الطالب: ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان.\n4) التسجيل والاستنتاج (10 دقائق: 25–35)\n   المعلم: يوجه إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ.\n   الطالب: يكملون الجدول ويحددون صحة تنبؤاتهم.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1) التهيئة: بعد خمس دقائق (5 دقائق: 0–5)\n   المعلم: يعرض الكؤوس ويطرح السؤال.\n   الطالب: يلاحظون ترسب الرمل والدقيق في القاع.\n2) الأسئلة 1–4 ص 59 (10 دقائق: 5–15)\n   المعلم: يوجه: ماذا حدث في المخلوط الضبابي والشفاف؟ ولماذا بعد خمس دقائق؟ ولماذا الكميات المتساوية؟\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n3) المخلوط المعلّق (10 دقائق: 15–25)\n   المعلم: يشرح: المواد غير الذائبة تبقى مرئية، وبعضها يستقر في القاع وبعضها يطفو؛ ويقارن بالمحلول.\n   الطالب: يكملون جدول مقارنة: المحلول – المعلّق (الشفافية، الرؤية، الترسب).\n4) تحدّث عن: قطع السكر (10 دقائق: 25–35)\n   المعلم: يناقش لماذا تذوب قطع السكر أبطأ من الحبيبات.\n   الطالب: يستنتجون أن الحبيبات الخارجية تذوب أولًا.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1) التهيئة: الفلفل العائم (4 دقائق: 0–4)\n   المعلم: يطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) ورقة العمل 3-3: الملاحظة والرسم (16 دقائق: 4–20)\n   المعلم: يجهز المخاليط الخمسة (ملعقة صغيرة في 100 mL ماء) ويخبر بمكوناتها.\n   الطالب: يحركون كل مخلوط ويلاحظونه ويرسمونه ويصفونه في الورقة (ص 75).\n3) التصنيف وجدول الدعم (10 دقائق: 20–30)\n   المعلم: يوجه التصنيف ويقدم جدولًا للمتعثرين: هل تذوب؟ كيف يبدو؟ هل ترى المادة؟ هل تستقر أم تطفو؟\n   الطالب: يصنفون: الملح والشراب محلولان؛ الفلفل والتلك يطفوان؛ الطباشير يستقر.\n4) مراجعة جماعية (5 دقائق: 30–35)\n   المعلم: يعرض الإجابات ويصحح.\n   الطالب: يصححون أعمالهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1) التهيئة: السكر الخفي (5 دقائق: 0–5)\n   المعلم: ينفذ العرض ويؤكد قاعدة: لا نتذوق إلا ما هو آمن وبإذن المعلم.\n   الطالب: يستنتجون أن الطعم الحلو دليل على وجود السكر.\n2) الذوبان تغير فيزيائي (8 دقائق: 5–13)\n   المعلم: يشرح أن جزيئات السكر لم تتغير ولم تتفاعل مع الماء، ويمكن استعادتها بالتبخير.\n   الطالب: يكتبون جملة: الذوبان تغير فيزيائي قابل للعكس.\n3) تمرين 3-3 في كتاب النشاط (12 دقائق: 13–25)\n   المعلم: يوجه حل التمرين (ص 39).\n   الطالب: يحلون فرديًا ويتحققون مع زميل.\n4) لعبة الكلمات (10 دقائق: 25–35)\n   المعلم: يقرأ تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج.\n   الطالب: يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n2. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n3. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. [مستوى المعرفة] ماذا حدث للرمل بعد ترك المخلوط خمس دقائق؟\n   الإجابة النموذجية: استقر في قاع الكأس.\n2. [مستوى التطبيق] ما المخلوط المعلّق؟\n   الإجابة النموذجية: مخلوط من مادة صلبة غير قابلة للذوبان في سائل تبقى فيه مرئية.\n3. [مستوى الاستدلال] لماذا يجب استخدام الكمية نفسها من الماء والمادة الصلبة في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة صحيحة بين المواد.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n2. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n3. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. [مستوى المعرفة] هل يمكنك رؤية المادة الصلبة في المحلول؟\n   الإجابة النموذجية: لا؛ لأنها ذابت تمامًا.\n2. [مستوى التطبيق] اذكر مادة تطفو على سطح الماء دون أن تذوب.\n   الإجابة النموذجية: الفلفل المطحون أو بودرة التلك.\n3. [مستوى الاستدلال] لماذا تذوب قطعة السكر أبطأ من الحبيبات؟\n   الإجابة النموذجية: لأن الحبيبات الداخلية لا تتصل بالماء حتى تذوب الخارجية أولًا.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nللطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\nللطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nللطالب: كتابة جدول المقارنة بين المحلول والمخلوط المعلّق في الدفتر. لولي الأمر: يُرجى ملاحظة عصير البرتقال الطازج مع الابن بعد تركه قليلًا.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nللطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nللطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"id": "3-4", "title": "فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60–61 | كتاب النشاط ص 40 | دليل المعلم ص 80–82", "n": 2, "per": [{"h": {"lesson": "3-4 فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60 | دليل المعلم ص 80–82", "num": "الحصة الأولى من 2", "focus": "ما الترشيح؟ المرشحات في الحياة والطبيعة"}, "f": ["1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل.\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة.\nمخرج تعليمي آخر: يناقش هل الماء المرشّح بالرمل صالح للشرب.", "1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل. ← تذكر\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة. ← فهم\nالمخرج الآخر: يناقش هل الماء المرشّح بالرمل صالح للشرب. ← تقييم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة", "-
