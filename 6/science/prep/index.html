n- أخرى: تمرين 2-9 في كتاب النشاط\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أكياس قمامة كبيرة، قفازات مطاطية، كمامات، دفتر ملاحظات", "الحصة 1: الحفاظ على الماء والطاقة\n- الماء العذب\n- ترشيد الاستهلاك\n- الطاقة\n- المصابيح الموفرة\n- الطاقة الشمسية\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- فرز القمامة\n- جدول الإحصاء\n- التمثيل بالأعمدة\n- الحملة التوعوية", "الحصة 1: الحفاظ على الماء والطاقة\nيعرض المعلم صنبورًا يقطر (أو مقطعًا) ويسأل: كم لترًا يضيع من صنبور يقطر طوال اليوم؟ هل يهمنا ذلك في بلد قليل الأمطار؟\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nيسأل المعلم: ما أكثر أنواع القمامة التي تتوقع أن تجدها في فناء المدرسة؟ ويسجل التنبؤات على السبورة.", "الحصة 1: الحفاظ على الماء والطاقة\n1) التهيئة: الصنبور المتسرب (5 دقائق: 0–5)\n   المعلم: يعرض الموقف ويطرح الأسئلة.\n   الطالب: يقدرون ويناقشون.\n2) الحفاظ على الماء (10 دقائق: 5–15)\n   المعلم: يناقش ص 50: الاستحمام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد.\n   الطالب: يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان.\n3) الحفاظ على الطاقة (10 دقائق: 15–25)\n   المعلم: يناقش: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية.\n   الطالب: يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف.\n4) تمرين 2-9: سجلي الأسبوعي (10 دقائق: 25–35)\n   المعلم: يوجه تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع.\n   الطالب: يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1) التهيئة والتنبؤ والسلامة (4 دقائق: 0–4)\n   المعلم: يسجل التنبؤات ويؤكد السلامة: قفازات وكمامات، الحذر من الزجاج المكسور وعدم لمس الإبر.\n   الطالب: يتنبؤون ويرتدون أدوات الوقاية.\n2) نشاط 2-9: الجمع والتسجيل (14 دقائق: 4–18)\n   المعلم: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل.\n   الطالب: يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام.\n3) التمثيل والمقارنة (10 دقائق: 18–28)\n   المعلم: يوجه جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2).\n   الطالب: يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا.\n4) تخطيط الحملة (السؤال 3) (7 دقائق: 28–35)\n   المعلم: يناقش «تحدّث عن» ص 51 ويطلب خطة حملة.\n   الطالب: يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-9).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: الحفاظ على الماء والطاقة\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1. [مستوى المعرفة] ما أكثر أنواع القمامة التي جمعتها مجموعتك؟\n   الإجابة النموذجية: غالبًا البلاستيك أو الورق (تعتمد على النتائج).\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستدلال بعدد العلامات.\n3. [مستوى الاستدلال] لماذا يُعد البلاستيك من أخطر أنواع القمامة؟\n   الإجابة النموذجية: لأنه لا يتحلل بسهولة ويبقى طويلًا وقد تختنق به الحيوانات.", "الحصة 1: الحفاظ على الماء والطاقة\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1. [مستوى المعرفة] لماذا نرتدي القفازات والكمامات عند جمع القمامة؟\n   الإجابة النموذجية: لحماية أنفسنا من الجراثيم والأدوات الحادة.\n2. [مستوى التطبيق] ما فائدة تمثيل نتائج الفرز بالأعمدة؟\n   الإجابة النموذجية: لمقارنة أنواع القمامة بسهولة ومعرفة النوع الأكثر شيوعًا.\n3. [مستوى الاستدلال] اقترح فكرتين لحملة منع رمي القمامة في مدرستك.\n   الإجابة النموذجية: وضع صناديق قرب المقصف، ملصقات توعوية، مسابقة الفصل الأنظف (تقبل الأفكار المنطقية).", "الحصة 1: الحفاظ على الماء والطاقة\nللطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nللطالب: إعداد ملصق للحملة التوعوية لوضعه في المدرسة، ومراجعة الوحدة الثانية. لولي الأمر: يُرجى تشجيع الابن على عدم رمي المخلفات في الأماكن العامة والقدوة في ذلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"id": "2-10", "title": "تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | كتاب النشاط ص 36 | دليل المعلم ص 64", "n": 2, "per": [{"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | دليل المعلم ص 64", "num": "الحصة الأولى من 3", "focus": "مراجعة المفردات والسلاسل الغذائية في صورة موطن"}, "f": ["1. يطابق مصطلحات الوحدة بمعانيها الصحيحة.\n2. يحدد مصدر الطاقة والمنتجات والمستهلكات والمفترس والفريسة في صورة موطن.\n3. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح.\n4. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع.\n\nمخرج تعليمي آخر:\nيتنبأ بأثر اختفاء الحشرات أو غياب الشمس على الموطن.\nيقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة.", "1. يطابق مصطلحات الوحدة بمعانيها الصحيحة. ← تذكر\n2. يحدد مصدر الطاقة والمنتجات والمستهلكات والمفترس والفريسة في صورة موطن. ← تطبيق\n3. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح. ← تطبيق\n4. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع. ← فهم\nالمخرج الآخر: يتنبأ بأثر اختفاء الحشرات أو غياب الشمس على الموطن. ← تحليل\nالمخرج الآخر: يقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة. ← تطبيق", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- فكّر – زاوج – شارك\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- السبورة التقليدية", "- الموطن الطبيعي\n- المغذيات\n- الاحتباس الحراري\n- مصدر الطاقة\n- ترتيب السلسلة\n- إزالة الغابات\n- الأمطار الحمضية\n- إعادة التدوير", "يعرض المعلم لعبة «كلمة وتعريف»: يقرأ تعريفًا ويرفع الطلبة البطاقة التي تحمل المصطلح المناسب.", "1) التهيئة: كلمة وتعريف (1 دقيقة: 0–1)\n   المعلم: يقرأ تعريفات مصطلحات الوحدة.\n   الطالب: يرفعون البطاقة الصحيحة.\n2) السؤال 1: المطابقة (2 دقيقتان: 1–3)\n   المعلم: يوجه حل السؤال 1 ص 52.\n   الطالب: يطابقون المصطلحات بمعانيها ويصححون.\n3) السؤال 2: صورة الموطن (3 دقائق: 3–6)\n   المعلم: يعرض الصورة ص 52 على السبورة الذكية.\n   الطالب: يحددون مصدر الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته.\n4) السؤال 3: ماذا لو؟ (3 دقائق: 6–9)\n   المعلم: يدير نقاش: اختفاء الحشرات، توقف الشمس عن السطوع.\n   الطالب: يتنبؤون بالآثار ويكتبونها.\n5) الختام: مسابقة المجموعات (1 دقيقة: 9–10)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n7) السؤال 4: الترتيب الصحيح (3 دقائق: 20–23)\n   المعلم: يوجه ترتيب السلاسل الأربع ص 53.\n   الطالب: يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس...\n8) السؤال 5 و6 (3 دقائق: 23–26)\n   المعلم: يوجه اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع.\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n9) السؤال 7: أعد التدوير (3 دقائق: 26–29)\n   المعلم: يعرض صور الأشياء في السؤال 7.\n   الطالب: يقترحون طرق إعادة الاستخدام والتدوير لكل منها.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.\n\n4. [مستوى المعرفة] رتب: نورس – عوالق – سمكة.\n   الإجابة النموذجية: عوالق ← سمكة ← نورس.\n5. [مستوى التطبيق] رتب: قرش – عوالق – سمك صغير – فقمة.\n   الإجابة النموذجية: عوالق ← سمك صغير ← فقمة ← قرش.\n6. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد تركيزه في الهواء ويحبس الحرارة.", "1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.\n\n4. [مستوى المعرفة] رتب: صقر – بذور – سحلية – خنفساء.\n   الإجابة النموذجية: بذور ← خنفساء ← سحلية ← صقر.\n5. [مستوى التطبيق] كيف يمكن أن تتسبب الأمطار الحمضية في قتل الضفادع؟\n   الإجابة النموذجية: تجعل ماء البحيرات حمضيًا فيضر بالضفادع وغذائها.\n6. [مستوى الاستدلال] اقترح طريقة لإعادة استخدام الزجاجات البلاستيكية.\n   الإجابة النموذجية: كأصص للزراعة أو لتخزين الأغراض أو صنع أدوات مفيدة.", "للطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\nللطالب: حل «المراجعة اللغوية» في كتاب النشاط ص 36 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى متابعة الابن في المراجعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: نيها ويصححون.\n3) السؤال 2: صورة الموطن (3 دقائق: 3–6)\n   المعلم: يعرض الصورة ص 52 على السبورة الذكية.\n   الطالب: يحددون مصدر الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته.\n4) السؤال 3: ماذا لو؟ (3 دقائق: 6–9)\n   المعلم: يدير نقاش: اختفاء الحشرات، توقف الشمس عن السطوع.\n   الطالب: يتنبؤون بالآثار ويكتبونها.\n5) الختام: مسابقة المجموعات (1 دقيقة: 9–10)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n7) السؤال 4: الترتيب الصحيح (3 دقائق: 20–23)\n   المعلم: يوجه ترتيب السلاسل الأربع ص 53.\n   الطالب: يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس...\n8) السؤال 5 و6 (3 دقائق: 23–26)\n   المعلم: يوجه اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع.\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n9) السؤال 7: أعد التدوير (3 دقائق: 26–29)\n   المعلم: يعرض صور الأشياء في السؤال 7.\n   الطالب: يقترحون طرق إعادة الاستخدام والتدوير لكل منها.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n1) التهيئة: كلمة مرتبطة (3 دقائق: 0–3)\n   المعلم: يدير إضافة الكلمات حول العنوان.\n   الطالب: يضيفون مصطلحات الوحدة.\n2) المراجعة اللغوية (5 دقائق: 3–8)\n   المعلم: يوجه حل المراجعة اللغوية (كتاب النشاط ص 36) ويصحح جماعيًا.\n   الطالب: يكملون الجمل ويصححون.\n3) الخريطة المفاهيمية (6 دقائق: 8–14)\n   المعلم: يقسم الوحدة إلى فروع: السلاسل الغذائية، المواطن، آثار الإنسان، الاعتناء بالبيئة.\n   الطالب: ترسم كل مجموعة فرعًا ثم تُجمع الفروع في خريطة واحدة.\n4) سؤال من صنعي (3 دقائق: 14–17)\n   المعلم: يطلب من كل طالب كتابة سؤال وإجابته.\n   الطالب: يتبادلون الأسئلة ويجيبون.\n5) الختام: مسابقة المجموعات (3 دقائق: 17–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-10).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\n1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.\n\n4. [مستوى المعرفة] رتب: نورس – عوالق – سمكة.\n   الإجابة النموذجية: عوالق ← سمكة ← نورس.\n5. [مستوى التطبيق] رتب: قرش – عوالق – سمك صغير – فقمة.\n   الإجابة النموذجية: عوالق ← سمك صغير ← فقمة ← قرش.\n6. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد تركيزه في الهواء ويحبس الحرارة.\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n1. [مستوى المعرفة] أكمل: الحيوانات التي تتغذى عليها المفترسات تسمى ____.\n   الإجابة النموذجية: فرائس.\n2. [مستوى التطبيق] ما العلاقة بين فرعي «آثار الإنسان» و«الاعتناء بالبيئة» في الخريطة؟\n   الإجابة النموذجية: الاعتناء بالبيئة يقلل الآثار السلبية للإنسان مثل التلوث وإزالة الغابات.\n3. [مستوى الاستدلال] اربط بين إزالة الغابات والسلاسل الغذائية.\n   الإجابة النموذجية: تدمر إزالة الغابات المواطن فتختفي المنتجات وتنهار السلاسل الغذائية فيها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\n1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.\n\n4. [مستوى المعرفة] رتب: صقر – بذور – سحلية – خنفساء.\n   الإجابة النموذجية: بذور ← خنفساء ← سحلية ← صقر.\n5. [مستوى التطبيق] كيف يمكن أن تتسبب الأمطار الحمضية في قتل الضفادع؟\n   الإجابة النموذجية: تجعل ماء البحيرات حمضيًا فيضر بالضفادع وغذائها.\n6. [مستوى الاستدلال] اقترح طريقة لإعادة استخدام الزجاجات البلاستيكية.\n   الإجابة النموذجية: كأصص للزراعة أو لتخزين الأغراض أو صنع أدوات مفيدة.\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n1. [مستوى المعرفة] ما المصطلح: «التخلص من النفايات بمعالجتها لتصبح منتجًا جديدًا»؟\n   الإجابة النموذجية: إعادة التدوير.\n2. [مستوى التطبيق] اذكر أثرين سلبيين للإنسان على البيئة وطريقتين للعناية بها.\n   الإجابة النموذجية: السلبي: التلوث وإزالة الغابات؛ العناية: إعادة التدوير وترشيد الطاقة.\n3. [مستوى الاستدلال] اكتب سؤالًا عن الوحدة وأجب عنه.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nللطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\nللطالب: حل «المراجعة اللغوية» في كتاب النشاط ص 36 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى متابعة الابن في المراجعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nللطالب: مراجعة الوحدة الثانية كاملة باستخدام الخريطة المفاهيمية. لولي الأمر: يُرجى الاطلاع على الخريطة ومراجعة الوحدة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"id": "3-1", "title": "التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37، 72–73 | دليل المعلم ص 71–75", "n": 4, "per": [{"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54 | دليل المعلم ص 71–73", "num": "الحصة الأولى من 5", "focus": "التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء"}, "f": ["1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد.\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة.\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة.\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل.\n\nمخرج تعليمي آخر:\nيمثل التغير القابل للعكس بمخطط سهمي في اتجاهين.\nيستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة.", "1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد. ← فهم\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة. ← تطبيق\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة. ← فهم\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل. ← تطبيق\nالمخرج الآخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين. ← تطبيق\nالمخرج الآخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة. ← تحليل", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- العرض العملي\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكعبات ثلج، أطباق، ساعة إيقاف، ورقة، مقص، صندوق رمل، عود ثقاب (للمعلم فقط)", "- حالات المادة\n- الانصهار\n- التجمد\n- التغير القابل للعكس\n- الحرارة\n- التغير غير القابل للعكس\n- الاحتراق\n- الكربون\n- مادة جديدة", "يراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟", "1) التهيئة: حالات المادة (1 دقيقة: 0–1)\n   المعلم: يراجع الحالات الثلاث بأمثلة من الصف الخامس.\n   الطالب: يذكرون الماء: ثلج، ماء، بخار.\n2) نشاط 3-1: ملاحظة تغيرات الثلج (3 دقائق: 1–4)\n   المعلم: يوزع مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54.\n   الطالب: يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب.\n3) هل يمكن عكسه؟ (2 دقيقتان: 4–6)\n   المعلم: يسأل: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس».\n   الطالب: يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء.\n4) تصحيح المفاهيم (3 دقائق: 6–9)\n   المعلم: يوضح أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر).\n   الطالب: يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير).\n5) الختام والتقويم (1 دقيقة: 9–10)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 11 دقيقة)\n7) مفهوم التغير غير القابل للعكس (3 دقائق: 21–24)\n   المعلم: يشرح ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب.\n   الطالب: يكتبون التعريفين في جدول مقارنة.\n8) لعبة «قابل أم غير قابل؟» (3 دقائق: 24–27)\n   المعلم: يعرض بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد.\n   الطالب: يصنفون البطاقات ويبررون في ثنائيات.\n9) الأسئلة 1–3 ص 55 (2 دقيقتان: 27–29)\n   المعلم: يوجه سؤال الجلي والبيض المسلوق.\n   الطالب: يجيبون ويرسمون مخططًا سهميًا للجلي.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).\n\n4. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n5. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n6. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.", "1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.\n\n4. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n5. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n6. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.", "للطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\nللطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 72 | دليل المعلم ص 73", "num": "الحصة الثالثة من 5", "focus": "احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا"}, "f": ["1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة.\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة.\n\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة.", "1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة. ← تطبيق\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة. ← تحليل\nالمخرج الآخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة. ← تحليل", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: شمعة، حامل أو طبق، ملعقة معدنية، أعواد ثقاب، ورقة العمل 3-1", "- انصهار الشمع\n- احتراق الفتيل\n- الدخان\n- الملاحظة العلمية", "يعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟", "1) التهيئة: الشمعة القصيرة (3 دقائق: 0–3)\n   المعلم: يعرض الشمعتين ويجمع التوقعات.\n   الطالب: يقترحون: انصهر، احترق، تبخر.\n2) ورقة العمل 3-1 (الجزء الأول): عرض الشمعة (7 دقائق: 3–10)\n   المعلم: يشعل الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد.\n   الطالب: يسجلون الملاحظات في جدول ورقة العمل (ص 72).\n3) التحليل (5 دقائق: 10–15)\n   المعلم: يناقش: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة.\n   الطالب: يصنفون كل ملاحظة ويعللون.\n4) السلامة مع اللهب (3 دقائق: 15–18)\n   المعلم: يناقش قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة.\n   الطالب: يكتبون ثلاث قواعد سلامة.\n5) الختام والتقويم (2 دقيقتان: 18–20)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.", "1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.", "للطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 73 | دليل المعلم ص 73–74", "num": "الحصة الرابعة من 5", "focus": "تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص"}, "f": ["1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز).\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة.\n\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم.", "1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز). ← تحليل\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة. ← فهم\nالمخرج الآخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: بيكربونات الصوديوم، خل، كأس زجاجية، ملعقة صغيرة، جص، ماء، أكواب، ورقة العمل 3-1", "- التغير الفيزيائي\n- التغير الكيميائي\n- التفاعل\n- الفقاعات\n- الجص", "يسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم.", "1) التهيئة: من المطبخ (3 دقائق: 0–3)\n   المعلم: يعرض المادتين ويطلب تنبؤًا.\n   الطالب: يتنبؤون بما سيحدث.\n2) ورقة العمل 3-1 (الجزء الثاني) (6 دقائق: 3–9)\n   المعلم: يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس.\n   الطالب: يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟\n3) عرض الجص (4 دقائق: 9–13)\n   المعلم: يخلط الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج.\n   الطالب: يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص.\n4) فيزيائي أم كيميائي؟ (5 دقائق: 13–18)\n   المعلم: يشرح: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة).\n   الطالب: يصنفون أمثلة الدرس في جدول.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.", "1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.", "للطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37 | دليل المعلم ص 73–75", "num": "الحصة الخامسة من 5", "focus": "تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج"}, "f": ["1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر.\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي.\n\nمخرج تعليمي آخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها.", "1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر. ← تطبيق\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي. ← تحليل\nالمخرج الآخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها. ← تحليل", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: نموذج بركان من العجين أو الورق، بيكربونات الصوديوم، خل، ألوان طعام، تمرين 3-1", "- النموذج\n- الثوران\n- إعادة تدوير الزجاج\n- الانصهار", "يعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟", "1) التهيئة: بركان (2 دقيقتان: 0–2)\n   المعلم: يعرض المقطع ويطرح السؤال.\n   الطالب: يقترحون الخل والبيكربونات.\n2) نموذج البركان (تكامل مع الفنون والمهارات الحياتية) (7 دقائق: 2–9)\n   المعلم: يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام.\n   الطالب: ينفذون الثوران ويصفون التغير ويصنفونه.\n3) تمرين 3-1 في كتاب النشاط (5 دقائق: 9–14)\n   المعلم: يوجه حل التمرين (ص 37) مع دعم المتعثرين.\n   الطالب: يقارنون التغيرات ويحلون فرديًا.\n4) تحدّث عن: إعادة تدوير الزجاج (4 دقائق: 14–18)\n   المعلم: يشرح: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟\n   الطالب: يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "للطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}], "comb": ["الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد.\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة.\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة.\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل.\n\nمخرج تعليمي آخر:\nيمثل التغير القابل للعكس بمخطط سهمي في اتجاهين.\nيستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة.\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة.\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة.\n\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة.\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز).\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة.\n\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر.\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي.\n\nمخرج تعليمي آخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد. ← فهم\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة. ← تطبيق\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة. ← فهم\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل. ← تطبيق\nالمخرج الآخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين. ← تطبيق\nالمخرج الآخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة. ← تحليل\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث ن من العجين أو الورق، بيكربونات الصوديوم، خل، ألوان طعام، تمرين 3-1", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n- حالات المادة\n- الانصهار\n- التجمد\n- التغير القابل للعكس\n- الحرارة\n- التغير غير القابل للعكس\n- الاحتراق\n- الكربون\n- مادة جديدة\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n- انصهار الشمع\n- احتراق الفتيل\n- الدخان\n- الملاحظة العلمية\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n- التغير الفيزيائي\n- التغير الكيميائي\n- التفاعل\n- الفقاعات\n- الجص\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n- النموذج\n- الثوران\n- إعادة تدوير الزجاج\n- الانصهار", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nيراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nيعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nيسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nيعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1) التهيئة: حالات المادة (1 دقيقة: 0–1)\n   المعلم: يراجع الحالات الثلاث بأمثلة من الصف الخامس.\n   الطالب: يذكرون الماء: ثلج، ماء، بخار.\n2) نشاط 3-1: ملاحظة تغيرات الثلج (3 دقائق: 1–4)\n   المعلم: يوزع مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54.\n   الطالب: يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب.\n3) هل يمكن عكسه؟ (2 دقيقتان: 4–6)\n   المعلم: يسأل: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس».\n   الطالب: يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء.\n4) تصحيح المفاهيم (3 دقائق: 6–9)\n   المعلم: يوضح أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر).\n   الطالب: يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير).\n5) الختام والتقويم (1 دقيقة: 9–10)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 11 دقيقة)\n7) مفهوم التغير غير القابل للعكس (3 دقائق: 21–24)\n   المعلم: يشرح ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب.\n   الطالب: يكتبون التعريفين في جدول مقارنة.\n8) لعبة «قابل أم غير قابل؟» (3 دقائق: 24–27)\n   المعلم: يعرض بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد.\n   الطالب: يصنفون البطاقات ويبررون في ثنائيات.\n9) الأسئلة 1–3 ص 55 (2 دقيقتان: 27–29)\n   المعلم: يوجه سؤال الجلي والبيض المسلوق.\n   الطالب: يجيبون ويرسمون مخططًا سهميًا للجلي.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1) التهيئة: الشمعة القصيرة (3 دقائق: 0–3)\n   المعلم: يعرض الشمعتين ويجمع التوقعات.\n   الطالب: يقترحون: انصهر، احترق، تبخر.\n2) ورقة العمل 3-1 (الجزء الأول): عرض الشمعة (7 دقائق: 3–10)\n   المعلم: يشعل الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد.\n   الطالب: يسجلون الملاحظات في جدول ورقة العمل (ص 72).\n3) التحليل (5 دقائق: 10–15)\n   المعلم: يناقش: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة.\n   الطالب: يصنفون كل ملاحظة ويعللون.\n4) السلامة مع اللهب (3 دقائق: 15–18)\n   المعلم: يناقش قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة.\n   الطالب: يكتبون ثلاث قواعد سلامة.\n5) الختام والتقويم (2 دقيقتان: 18–20)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 20 دقيقة)\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1) التهيئة: من المطبخ (3 دقائق: 0–3)\n   المعلم: يعرض المادتين ويطلب تنبؤًا.\n   الطالب: يتنبؤون بما سيحدث.\n2) ورقة العمل 3-1 (الجزء الثاني) (6 دقائق: 3–9)\n   المعلم: يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس.\n   الطالب: يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟\n3) عرض الجص (4 دقائق: 9–13)\n   المعلم: يخلط الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج.\n   الطالب: يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص.\n4) فيزيائي أم كيميائي؟ (5 دقائق: 13–18)\n   المعلم: يشرح: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة).\n   الطالب: يصنفون أمثلة الدرس في جدول.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1) التهيئة: بركان (2 دقيقتان: 0–2)\n   المعلم: يعرض المقطع ويطرح السؤال.\n   الطالب: يقترحون الخل والبيكربونات.\n2) نموذج البركان (تكامل مع الفنون والمهارات الحياتية) (7 دقائق: 2–9)\n   المعلم: يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام.\n   الطالب: ينفذون الثوران ويصفون التغير ويصنفونه.\n3) تمرين 3-1 في كتاب النشاط (5 دقائق: 9–14)\n   المعلم: يوجه حل التمرين (ص 37) مع دعم المتعثرين.\n   الطالب: يقارنون التغيرات ويحلون فرديًا.\n4) تحدّث عن: إعادة تدوير الزجاج (4 دقائق: 14–18)\n   المعلم: يشرح: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟\n   الطالب: يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).\n\n4. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n5. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n6. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.\n\n4. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n5. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n6. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nللطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\nللطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nللطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nللطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nللطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"id": "3-2", "title": "خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38، 74 | دليل المعلم ص 74–77", "n": 4, "per": [{"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56 | دليل المعلم ص 74–76", "num": "الحصة الأولى من 5", "focus": "ما المخلوط؟ صنع مخاليط من مواد صلبة"}, "f": ["1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي.\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها.\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة.\n4. يختار الأدوات المناسبة لفصل كل مخلوط.\n\nمخرج تعليمي آخر:\nيوضح أن الهواء مخلوط من غازات رغم أننا لا نراها.\nيربط حجم الجزيئات بطريقة الفصل المناسبة.", "1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n4. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون، مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط\n- صورة توضيحية", "- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي\n- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات", "يعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة.", "1) التهيئة: كيس الفاصوليا (1 دقيقة: 0–1)\n   المعلم: يعرض الكيس ويدوّن أمثلة الطلبة.\n   الطالب: يذكرون: السلطة، الحلوى، البهارات...\n2) تعريف المخلوط (2 دقيقتان: 1–3)\n   المعلم: يشرح ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون.\n   الطالب: يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء.\n3) نشاط 3-2أ: صنع المخاليط (4 دقائق: 3–7)\n   المعلم: يوزع المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب.\n   الطالب: يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟\n4) المناقشة (2 دقيقتان: 7–9)\n   المعلم: يقود الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل.\n   الطالب: يقارنون المخاليط: أيها يسهل رؤية مكوناته؟\n5) الختام والتقويم (1 دقيقة: 9–10)\n   المعلم: يطرح التقويم الختامي ويحفظ المخاليط للحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 11 دقيقة)\n7) طرق الفصل (2 دقيقتان: 21–23)\n   المعلم: يشرح ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة.\n   الطالب: يكملون جدول: الطريقة – متى نستخدمها – مثال.\n8) نشاط 3-2ب: فصل مخاليط الحصة السابقة (4 دقائق: 23–27)\n   المعلم: يحدد الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ.\n   الطالب: يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة.\n9) مناقشة السؤالين 1 و2 (2 دقيقتان: 27–29)\n   المعلم: يسأل: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟\n   الطالب: يذكرون الملح والرمل ويتوقعون السبب.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.\n\n4. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n5. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n6. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.", "1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.\n\n4. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n5. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n6. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.", "للطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\nللطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | كتاب النشاط ص 74 | دليل المعلم ص 76–77", "num": "الحصة الثالثة من 5", "focus": "الفصل بالمغناطيس (ورقة العمل 3-2)"}, "f": ["1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس.\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها.\n\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة.", "1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2", "- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل", "يسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟", "1) التهيئة: الدبابيس الضائعة (3 دقائق: 0–3)\n   المعلم: يطرح التحدي ويذكّر بالمواد المغناطيسية من الصف الرابع.\n   الطالب: يقترحون المغناطيس.\n2) السلامة (3 دقائق: 3–6)\n   المعلم: ينبه: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل.\n   الطالب: يستمعون ويكررون قواعد السلامة.\n3) ورقة العمل 3-2: فصل المخاليط (7 دقائق: 6–13)\n   المعلم: يوزع المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز.\n   الطالب: يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74).\n4) تحدّث عن: الخردة وتصحيح مفهوم (5 دقائق: 13–18)\n   المعلم: يوضح أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة.\n   الطالب: يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.", "1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.", "للطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n🎮 رابط ألعاب ونشاط الدرس التفاع \n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها.\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة.\n4. يختار الأدوات المناسبة لفصل كل مخلوط.\n\nمخرج تعليمي آخر:\nيوضح أن الهواء مخلوط من غازات رغم أننا لا نراها.\nيربط حجم الجزيئات بطريقة الفصل المناسبة.\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس.\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها.\n\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة.\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس.\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره.\n\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله.\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة.\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات.\n\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n4. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريق قط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\nيعرض المعلم مخلوط الملح والرمل الذي لم يُفصل في الحصة السابقة، ويسأل: تذكروا الصف الرابع.. كيف استعدنا الملح من الماء؟\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nيعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1) التهيئة: كيس الفاصوليا (1 دقيقة: 0–1)\n   المعلم: يعرض الكيس ويدوّن أمثلة الطلبة.\n   الطالب: يذكرون: السلطة، الحلوى، البهارات...\n2) تعريف المخلوط (2 دقيقتان: 1–3)\n   المعلم: يشرح ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون.\n   الطالب: يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء.\n3) نشاط 3-2أ: صنع المخاليط (4 دقائق: 3–7)\n   المعلم: يوزع المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب.\n   الطالب: يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟\n4) المناقشة (2 دقيقتان: 7–9)\n   المعلم: يقود الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل.\n   الطالب: يقارنون المخاليط: أيها يسهل رؤية مكوناته؟\n5) الختام والتقويم (1 دقيقة: 9–10)\n   المعلم: يطرح التقويم الختامي ويحفظ المخاليط للحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 11 دقيقة)\n7) طرق الفصل (2 دقيقتان: 21–23)\n   المعلم: يشرح ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة.\n   الطالب: يكملون جدول: الطريقة – متى نستخدمها – مثال.\n8) نشاط 3-2ب: فصل مخاليط الحصة السابقة (4 دقائق: 23–27)\n   المعلم: يحدد الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ.\n   الطالب: يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة.\n9) مناقشة السؤالين 1 و2 (2 دقيقتان: 27–29)\n   المعلم: يسأل: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟\n   الطالب: يذكرون الملح والرمل ويتوقعون السبب.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1) التهيئة: الدبابيس الضائعة (3 دقائق: 0–3)\n   المعلم: يطرح التحدي ويذكّر بالمواد المغناطيسية من الصف الرابع.\n   الطالب: يقترحون المغناطيس.\n2) السلامة (3 دقائق: 3–6)\n   المعلم: ينبه: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل.\n   الطالب: يستمعون ويكررون قواعد السلامة.\n3) ورقة العمل 3-2: فصل المخاليط (7 دقائق: 6–13)\n   المعلم: يوزع المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز.\n   الطالب: يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74).\n4) تحدّث عن: الخردة وتصحيح مفهوم (5 دقائق: 13–18)\n   المعلم: يوضح أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة.\n   الطالب: يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1) التهيئة: لغز الملح والرمل (3 دقائق: 0–3)\n   المعلم: يطرح السؤال ويستمع للأفكار.\n   الطالب: يتذكرون التبخير.\n2) حل اللغز (فكرة) (5 دقائق: 3–8)\n   المعلم: يشرح الفكرة: نضيف الماء فيذوب الملح، نفصل الرمل، ثم نبخر الماء فيبقى الملح (ستدرس تفصيلًا لاحقًا).\n   الطالب: يرسمون مخططًا لخطوات الفصل.\n3) السؤال 3 ص 57: اختر وعلّل (6 دقائق: 8–14)\n   المعلم: يوجه التنبؤ بأفضل طريقة لفصل: الفول السوداني والفاصوليا، الملح وفتات الخبز، البازلاء والدقيق.\n   الطالب: يقترحون الطريقة ويعللون في ثنائيات ثم يعرضون.\n4) جدول المقارنة (4 دقائق: 14–18)\n   المعلم: يقود بناء جدول: الطريقة – المبدأ – مثال – متى لا تنجح.\n   الطالب: يكملون الجدول في الدفتر.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1) التهيئة: كيس الكنز (2 دقيقتان: 0–2)\n   المعلم: يعرض المخلوط ويطرح التحدي.\n   الطالب: يتحمسون ويقترحون أفكارًا أولية.\n2) التخطيط (4 دقائق: 2–6)\n   المعلم: يطلب خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة.\n   الطالب: يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق.\n3) التنفيذ (7 دقائق: 6–13)\n   المعلم: يتابع السلامة والدقة ويحسب الوقت.\n   الطالب: ينفذون الخطة ويسجلون نجاح كل خطوة.\n4) التقييم والتحسين (3 دقائق: 13–16)\n   المعلم: يدير مقارنة بين خطط المجموعات.\n   الطالب: يقيّمون خطتهم ويقترحون تحسينًا.\n5) القمح والدقيق (2 دقيقتان: 16–18)\n   المعلم: يشرح باختصار فصل القشور عن الحبوب بالغربلة.\n   الطالب: يربطون الفكرة بطرق الفصل.\n6) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.\n\n4. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n5. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n6. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. [مستوى المعرفة] ما أفضل طريقة لفصل الفول السوداني عن الفاصوليا؟\n   الإجابة النموذجية: الفرز؛ لأن الحبات كبيرة يسهل التقاطها.\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الملح عن فتات الخبز؟\n   الإجابة النموذجية: الغربلة إذا كان الفتات أكبر من حبيبات الملح.\n3. [مستوى الاستدلال] متى لا ينجح الفرز في الفصل؟\n   الإجابة النموذجية: عندما تكون الجزيئات صغيرة جدًا أو متشابهة يصعب التقاطها.\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.\n\n4. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n5. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n6. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. [مستوى المعرفة] ما الطريقة التي تفصل الملح عن الماء؟\n   الإجابة النموذجية: التبخير.\n2. [مستوى التطبيق] لماذا لا نستخدم المغناطيس لفصل الملح عن الرمل؟\n   الإجابة النموذجية: لأنهما ليسا مادتين مغناطيسيتين.\n3. [مستوى الاستدلال] رتب خطوات فصل الملح عن الرمل.\n   الإجابة النموذجية: إضافة الماء وتحريكه ليذوب الملح، فصل الرمل، ثم تبخير الماء ليبقى الملح.\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nللطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\nللطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\nللطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\nللطالب: حل تمرين 3-2 في كتاب النشاط ص 38 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في طرق فصل يستخدمها في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nللطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"id": "3-3", "title": "المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39، 75 | دليل المعلم ص 77–80", "n": 4, "per": [{"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58 | دليل المعلم ص 77–78", "num": "الحصة الأولى من 5", "focus": "ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان"}, "f": ["1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة.\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول.\n3. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية.\n4. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته.\n\nمخرج تعليمي آخر:\nيوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء.\nيحدد ما إذا كانت ملاحظاته تدعم تنبؤاته.", "1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة. ← تذكر\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول. ← تطبيق\n3. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية. ← تطبيق\n4. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته. ← تحليل\nالمخرج الآخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء. ← فهم\nالمخرج الآخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته. ← تقييم", "- التعلم بالاكتشاف\n- العصف الذهني\n- فكّر – زاوج – شارك\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ماء ساخن، حبيبات قهوة، سكر، رمل، كأس زجاجية، مخبار مدرج، كؤوس، ملعقة صغيرة، ملح، دقيق، بلورات برمنجنات البوتاسيوم، ملقط", "- الذوبان\n- قابل للذوبان\n- غير قابل للذوبان\n- الجزيئات\n- المحلول\n- المخلوط الشفاف\n- المخلوط الضبابي\n- الملاحظة\n- الاستنتاج", "يضيف المعلم ماءً ساخنًا إلى ملعقة من حبيبات القهوة أمام الطلبة ويسأل: أين ذهبت الحبيبات؟ هل اختفت؟", "1) التهيئة: القهوة المختفية (1 دقيقة: 0–1)\n   المعلم: ينفذ العرض ويطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) مفهوم الذوبان (3 دقائق: 1–4)\n   المعلم: يشرح ص 58: السكر يذوب فهو قابل للذوبان، والرمل لا يذوب فهو غير قابل؛ والجزيئات الصغيرة تنتشر في الماء.\n   الطالب: يكتبون التعريفين ويرسمون جزيئات تنتشر.\n3) عصف ذهني: ماذا يذوب؟ (3 دقائق: 4–7)\n   المعلم: يطلب اقتراح مواد تذوب وأخرى لا تذوب ويدونها على السبورة.\n   الطالب: يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق.\n4) جدول التنبؤات (3 دقائق: 7–10)\n   المعلم: يرسم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم.\n   الطالب: يملؤون عمود التنبؤ استعدادًا للاستقصاء.\n5) الختام والتقويم (1 دقيقة: 10–11)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) السلامة (1 دقيقة: 21–22)\n   المعلم: ينبه: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس.\n   الطالب: يكررون قواعد السلامة.\n8) نشاط 3-3: التنفيذ (4 دقائق: 22–26)\n   المعلم: يوجه وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها.\n   الطالب: ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان.\n9) التسجيل والاستنتاج (3 دقائق: 26–29)\n   المعلم: يوجه إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ.\n   الطالب: يكملون الجدول ويحددون صحة تنبؤاتهم.\n10) الختام والتقويم (1 دقيقة: 29–30)\n   المعلم: يطرح التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.\n\n4. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n5. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n6. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.", "1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.\n\n4. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n5. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n6. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.", "للطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\nللطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 59 | دليل المعلم ص 78–80", "num": "الحصة الثالثة من 5", "focus": "المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟"}, "f": ["1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو).\n2. يعرّف المخلوط المعلّق ويميزه من المحلول.\n\nمخرج تعليمي آخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء.", "1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو). ← فهم\n2. يعرّف المخلوط المعلّق ويميزه من المحلول. ← فهم\nالمخرج الآخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء. ← تحليل", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كؤوس استقصاء الحصة السابقة أو كؤوس معدة جديدًا", "- المخلوط المعلّق\n- الترسب\n- الطفو\n- الاختبار العادل", "يعيد المعلم عرض كؤوس الاستقصاء بعد تركها، ويسأل: ماذا تغير في كأس الدقيق وكأس الرمل؟", "1) التهيئة: بعد خمس دقائق (3 دقائق: 0–3)\n   المعلم: يعرض الكؤوس ويطرح السؤال.\n   الطالب: يلاحظون ترسب الرمل والدقيق في القاع.\n2) الأسئلة 1–4 ص 59 (5 دقائق: 3–8)\n   المعلم: يوجه: ماذا حدث في المخلوط الضبابي والشفاف؟ ولماذا بعد خمس دقائق؟ ولماذا الكميات المتساوية؟\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n3) المخلوط المعلّق (5 دقائق: 8–13)\n   المعلم: يشرح: المواد غير الذائبة تبقى مرئية، وبعضها يستقر في القاع وبعضها يطفو؛ ويقارن بالمحلول.\n   الطالب: يكملون جدول مقارنة: المحلول – المعلّق (الشفافية، الرؤية، الترسب).\n4) تحدّث عن: قطع السكر (5 دقائق: 13–18)\n   المعلم: يناقش لماذا تذوب قطع السكر أبطأ من الحبيبات.\n   الطالب: يستنتجون أن الحبيبات الخارجية تذوب أولًا.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ماذا حدث للرمل بعد ترك المخلوط خمس دقائق؟\n   الإجابة النموذجية: استقر في قاع الكأس.\n2. [مستوى التطبيق] ما المخلوط المعلّق؟\n   الإجابة النموذجية: مخلوط من مادة صلبة غير قابلة للذوبان في سائل تبقى فيه مرئية.\n3. [مستوى الاستدلال] لماذا يجب استخدام الكمية نفسها من الماء والمادة الصلبة في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة صحيحة بين المواد.", "1. [مستوى المعرفة] هل يمكنك رؤية المادة الصلبة في المحلول؟\n   الإجابة النموذجية: لا؛ لأنها ذابت تمامًا.\n2. [مستوى التطبيق] اذكر مادة تطفو على سطح الماء دون أن تذوب.\n   الإجابة النموذجية: الفلفل المطحون أو بودرة التلك.\n3. [مستوى الاستدلال] لماذا تذوب قطعة السكر أبطأ من الحبيبات؟\n   الإجابة النموذجية: لأن الحبيبات الداخلية لا تتصل بالماء حتى تذوب الخارجية أولًا.", "للطالب: كتابة جدول المقارنة بين المحلول والمخلوط المعلّق في الدفتر. لولي الأمر: يُرجى ملاحظة عصير البرتقال الطازج مع الابن بعد تركه قليلًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 59 | كتاب النشاط ص 75 | دليل المعلم ص 79", "num": "الحصة الرابعة من 5", "focus": "ملاحظة المخاليط ورسمها (ورقة العمل 3-3)"}, "f": ["1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه.\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة.\n\nمخرج تعليمي آخر: يقارن بين المواد الطافية والمستقرة في القاع.", "1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه. ← تطبيق\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة. ← تحليل\nالمخرج الآخر: يقارن بين المواد الطافية والمستقرة في القاع. ← تحليل", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- الأقلام\n- أخرى: مخاليط معدة: ملح وماء، مسحوق شراب بارد، برمنجنات وماء، فلفل وماء، طباشير أو تلك وماء؛ ورقة العمل 3-3", "- المحلول\n- المخلوط المعلّق\n- الطفو\n- الاستقرار في القاع", "يرفع المعلم كأس فلفل مطحون في الماء ويسأل: هل ذاب الفلفل؟ لماذا بقي على السطح؟", "1) التهيئة: الفلفل العائم (2 دقيقتان: 0–2)\n   المعلم: يطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) ورقة العمل 3-3: الملاحظة والرسم (8 دقائق: 2–10)\n   المعلم: يجهز المخاليط الخمسة (ملعقة صغيرة في 100 mL ماء) ويخبر بمكوناتها.\n   الطالب: يحركون كل مخلوط ويلاحظونه ويرسمونه ويصفونه في الورقة (ص 75).\n3) التصنيف وجدول الدعم (5 دقائق: 10–15)\n   المعلم: يوجه التصنيف ويقدم جدولًا للمتعثرين: هل تذوب؟ كيف يبدو؟ هل ترى المادة؟ هل تستقر أم تطفو؟\n   الطالب: يصنفون: الملح والشراب محلولان؛ الفلفل والتلك يطفوان؛ الطباشير يستقر.\n4) مراجعة جماعية (3 دقائق: 15–18)\n   المعلم: يعرض الإجابات ويصحح.\n   الطالب: يصححون أعمالهم.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.", "1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.", "للطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39 | دليل المعلم ص 79–80", "num": "الحصة الخامسة من 5", "focus": "تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)"}, "f": ["1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها.\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية.\n\nمخرج تعليمي آخر: يوضح أن الذوبان تغير فيزيائي لا ت
