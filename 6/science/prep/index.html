ون: أوراق الشتلة المسقية بالليمون ذابلة/صفراء وساقها ضعيفة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أثر الأمطار الحمضية على البيئة: يشرح المعلم ص 47: تزيل الأحماض المغذيات من التربة، تضعف النباتات وتتساقط أوراقها، وتتضرر الأشجار والبحيرات وحيواناتها، والطلبة يكملون مخطط أثر: تربة ← نبات ← حيوانات (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تمرين 2-7: يوجه المعلم حل تمرين 2-7 (ص 33) عن موطن الماء العذب، والطلبة يرسمون السلاسل ويجيبون عن أسئلة الفهم (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مطر نظيف لبلادي: تشرح الأزواج كيف تتكون الأمطار الحمضية، وتقترح طرقًا لحماية مزارع عمان وقلاعها الحجرية من أضرارها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان المسببان للأمطار الحمضية؟\n   الإجابة النموذجية: أكاسيد الكبريت وأكاسيد النيتروجين.\n2. [مستوى التطبيق] ماذا حدث للطباشير عند سكب الخل عليه؟\n   الإجابة النموذجية: ظهرت رغوة وتآكل جزء منه.\n3. [مستوى الاستدلال] لماذا استخدمنا الخل لتمثيل الأمطار الحمضية؟\n   الإجابة النموذجية: لأن الخل حمض ضعيف يشبه الأمطار الحمضية.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صف أوراق الشتلة التي رُويت بعصير الليمون.\n   الإجابة النموذجية: ذابلة أو مصفرة أو بنية وقد تتساقط.\n2. [مستوى التطبيق] هل تدعم النتائج تنبؤك؟ وضح.\n   الإجابة النموذجية: نعم، توقعنا أن الحمض يضر بالنبتة وظهر عليها الضرر.\n3. [مستوى الاستدلال] كيف تضعف الأمطار الحمضية النباتات؟\n   الإجابة النموذجية: تزيل جزءًا من المغذيات من التربة فيضعف النبات ويبطؤ نموه.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما مصدر الغازات المسببة للأمطار الحمضية؟\n   الإجابة النموذجية: حرق الفحم والنفط والغاز الطبيعي.\n2. [مستوى التطبيق] أي أنواع الحجارة يتضرر أكثر بالأمطار الحمضية؟\n   الإجابة النموذجية: الحجر الجيري والرخام.\n3. [مستوى الاستدلال] اقترح طريقتين لحماية المباني التاريخية من الأمطار الحمضية.\n   الإجابة النموذجية: تقليل حرق الوقود، طلاء الأسطح بمواد واقية، استخدام الطاقة النظيفة.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يُعد هذا اختبارًا عادلًا؟\n   الإجابة النموذجية: لأن الشتلتين متشابهتان ووضعتا في الظروف نفسها، والفرق الوحيد نوع السائل.\n2. [مستوى التطبيق] كيف تؤثر الأمطار الحمضية على حيوانات البحيرات؟\n   الإجابة النموذجية: تجعل الماء حمضيًا فتضر الأسماك والضفادع وقد تقتلها.\n3. [مستوى الاستدلال] فسّر كيف يمكن أن تتسبب الأمطار الحمضية في موت الضفادع.\n   الإجابة النموذجية: تجعل ماء البحيرة حمضيًا فيضر بالضفادع وبيضها، وتموت الحشرات التي تتغذى عليها.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nللطالب: كتابة تقرير من صفحة واحدة عن أضرار الأمطار الحمضية على المباني (السؤال 4 ص 47). المعلم يُعد شتلتين للنشاط 2-7 قبل الحصة القادمة بثلاثة أيام. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور لمبانٍ تأثرت بالأمطار الحمضية.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nللطالب: حل تمرين 2-7 في كتاب النشاط ص 33 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في أهمية تقليل استخدام الوقود لحماية البيئة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}, {"id": "2-8", "title": "إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 48–49 | كتاب النشاط ص 34، 70–71 | دليل المعلم ص 60–62", "n": 3, "per": [{"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 48 | دليل المعلم ص 60–62", "num": "الحصة الأولى من 3", "focus": "مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير"}, "f": ["1. يوضح المقصود بمرادم النفايات وإعادة التدوير (10 دقائق)\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها (15 دقيقة)\nمخرج تعليمي آخر: يقترح طرقًا لاستخدام كمية أقل من الورق (15 دقيقة)", "1. يوضح المقصود بمرادم النفايات وإعادة التدوير. ← فهم\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها. ← تطبيق\nالمخرج الآخر: يقترح طرقًا لاستخدام كمية أقل من الورق. ← تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: نفايات نظيفة متنوعة على ورق جرائد: ورق، كرتون، كيس، زجاجة بلاستيكية وزجاجية، علبة، قشور خضار", "- التخلص من النفايات\n- مرادم النفايات\n- إعادة التدوير\n- إعادة الاستخدام\n- التقليل", "يفرغ المعلم كيس نفايات نظيفة على ورق الجرائد ويرفع كل قطعة ويسأل: هل يمكن تقليل استخدامها؟ أو إعادة استخدامها؟ أو تدويرها؟ (5 دقائق)", "1. إلى أين تذهب نفاياتنا؟: يشرح المعلم ص 48: مرادم النفايات أكوام ضخمة بعيدة عن السكان تغطى بالتربة، ويعرض فكرة «مدينة المخلفات» في القاهرة، والطلبة يكتبون مشكلات المرادم (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. فرز وتصنيف: يوزع المعلم على المجموعات قطعًا ويرسم جدولًا: تقليل – إعادة استخدام – إعادة تدوير، والطلبة يصنفون القطع ويعللون (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. السؤال 1 ص 49: ورق أقل: يطرح المعلم السؤال ويجمع الأفكار، والطلبة يقترحون: الكتابة على الوجهين، الكتب الإلكترونية، المناديل القماشية (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإعادة التدوير؟\n   الإجابة النموذجية: معالجة الأشياء بدل رميها لتصبح منتجًا جديدًا يمكن استخدامه.\n2. [مستوى التطبيق] ما مرادم النفايات؟\n   الإجابة النموذجية: أكوام ضخمة من القمامة في أماكن بعيدة عن السكان تغطى بالتربة لاحقًا.\n3. [مستوى الاستدلال] ما الفرق بين إعادة الاستخدام وإعادة التدوير؟ أعطِ مثالًا.\n   الإجابة النموذجية: إعادة الاستخدام: استعمال الشيء مرة أخرى كما هو (علبة كحامل أقلام)؛ التدوير: معالجته لصنع منتج جديد (صهر العلب لصنع علب جديدة).", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين يمكن إعادة تدويرهما.\n   الإجابة النموذجية: الورق، البلاستيك، الزجاج، العلب المعدنية.\n2. [مستوى التطبيق] اقترح طريقتين لاستخدام ورق أقل.\n   الإجابة النموذجية: الكتابة على وجهي الورقة، استخدام الأجهزة الإلكترونية، المناديل القماشية.\n3. [مستوى الاستدلال] لماذا يُعد تقليل النفايات أفضل من إعادة تدويرها؟\n   الإجابة النموذجية: لأنه يمنع إنتاج النفايات أصلًا ويوفر الطاقة والمواد المستخدمة في التدوير.", "للطالب: قراءة كتاب الطالب ص 48 وعدّ أكياس النفايات التي تخرجها الأسرة أسبوعيًا. لولي الأمر: يُرجى تخصيص سلة لفرز المواد القابلة للتدوير في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 49 | كتاب النشاط ص 34، 70 | دليل المعلم ص 61–62", "num": "الحصة الثانية من 3", "focus": "إعادة الاستخدام عمليًا وحملة التوعية"}, "f": ["1. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة (20 دقيقة)\n2. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير (5 دقائق)\nمخرج تعليمي آخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها (15 دقيقة)", "1. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة. ← تطبيق\n2. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها. ← تقييم", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: علب معدنية وأوعية بلاستيكية نظيفة، أوراق ملونة، ورقة العمل 2-8أ", "- إعادة الاستخدام\n- الحملة التوعوية\n- المنتجات المغلفة", "يعرض المعلم علبة معدنية فارغة ويتحدى المجموعات: اقترحوا ثلاثة استخدامات جديدة لها خلال دقيقة! (5 دقائق)", "1. ورقة العمل 2-8أ: إعادة استخدام العلب: يوزع المعلم ورقة العمل (كتاب النشاط ص 70) ويتابع التنفيذ مع مراعاة سلامة حواف العلب، والطلبة يصنعون حامل أقلام أو أصيص زرع من العلب والأوعية (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 2-8: يوجه المعلم إكمال جدول تمرين 2-8 (ص 34)، والطلبة يحددون لكل عنصر طريقة إعادة الاستخدام أو التدوير (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. ملصق الحملة (السؤال 4 ص 49): يحدد المعلم معايير الملصق: رسالة واضحة، صورة جاذبة، عبارة قصيرة، والطلبة يصممون الملصق ويعلقونه، ويقيّمون ملصقات زملائهم (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اقترح طريقة لإعادة استخدام الأوعية البلاستيكية.\n   الإجابة النموذجية: لتخزين الأدوات أو زراعة النباتات أو حفظ الطعام.\n2. [مستوى التطبيق] أي المواد في تمرين 2-8 يمكن تحويلها إلى سماد؟\n   الإجابة النموذجية: قشور الفواكه والخضراوات ومخلفات الحدائق.\n3. [مستوى الاستدلال] ما الذي يجعل الملصق التوعوي ناجحًا؟\n   الإجابة النموذجية: رسالة واضحة قصيرة، صورة جاذبة، ألوان مناسبة، ودعوة لفعل محدد.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما فائدة إعادة الاستخدام للبيئة؟\n   الإجابة النموذجية: تقلل النفايات وتحافظ على المواد الطبيعية.\n2. [مستوى التطبيق] اكتب شعارًا قصيرًا لحملة إعادة التدوير.\n   الإجابة النموذجية: مثل: «لا ترمِ.. أعد التدوير!» (تقبل الشعارات المناسبة).\n3. [مستوى الاستدلال] كيف يمكنك وأسرتك إعادة التدوير في المنزل؟\n   الإجابة النموذجية: فرز النفايات، جمع العلب والورق في سلال خاصة، إعادة استخدام الأكياس والأوعية.", "للطالب: حل تمرين 2-8 في كتاب النشاط ص 34 وإكمال الملصق، وإعداد قائمة بالمنتجات المغلفة القابلة للتدوير من البقالة. لولي الأمر: يُرجى اصطحاب الابن إلى البقالة وتشجيعه على إعداد القائمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 49 | كتاب النشاط ص 71 | دليل المعلم ص 61–62", "num": "الحصة الثالثة من 3", "focus": "صناعة السماد العضوي واستقصاء تحلل النفايات"}, "f": ["1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة (15 دقيقة)\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل (10 دقائق)\nمخرج تعليمي آخر: يفسر أهمية السماد العضوي لنمو النباتات (15 دقيقة)", "1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة. ← فهم\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل. ← تطبيق\nالمخرج الآخر: يفسر أهمية السماد العضوي لنمو النباتات. ← فهم", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: كيس بلاستيكي كبير، قشور خضراوات وفواكه وبيض، أعشاب وأوراق، ماء، مجرفة، ورقة العمل 2-8ب", "- السماد العضوي\n- التحلل\n- القابل للتحلل الحيوي\n- خصوبة التربة", "يعرض المعلم كيسًا من السماد العضوي الجاهز ويطلب من الطلبة ملاحظة لونه وملمسه ورائحته، ويسأل: من ماذا صُنع؟ (5 دقائق)", "1. نشاط 2-8: تجربة عرض لصنع السماد: يجمع المعلم القشور والأعشاب في الكيس ويضيف الماء باعتدال ويربطه ويضعه في مكان دافئ، والطلبة يشاركون في الإضافة ويسجلون الخطوات وينتبهون لعدم إضافة الطعام المطبوخ أو اللحوم (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. ورقة العمل 2-8ب: مردم نفايات مصغر: يشرح المعلم الاستقصاء: حفرتان، الأولى بقشور وورق والثانية بعلبة وعبوة بلاستيكية؛ الفحص بعد أسبوعين ثم شهرين، والطلبة يكتبون تنبؤاتهم في ورقة العمل (ص 71) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة السؤال 3 والتحدي: يناقش المعلم: ما أهمية السماد؟ ولماذا يبقى البلاستيك طويلًا في المرادم؟ والطلبة يستنتجون أن البلاستيك لا يتحلل بسهولة ويضر الحيوانات (4 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – فرز نفايات مدرستي: تتنافس المجموعات في تصنيف بطاقات نفايات إلى ما يعاد تدويره وما يذهب إلى المرادم، وتقترح منتجًا مفيدًا يعاد تصنيعه في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المواد المناسبة لصنع السماد العضوي؟\n   الإجابة النموذجية: قشور الخضراوات والفواكه والبيض، والحشائش والأوراق المتساقطة.\n2. [مستوى التطبيق] لماذا لا نضع الطعام المطبوخ أو اللحوم في كيس السماد؟\n   الإجابة النموذجية: لأنها تتعفن بروائح كريهة وتجذب الحشرات والحيوانات.\n3. [مستوى الاستدلال] أي الحفرتين تتوقع أن تتغير محتوياتها أكثر؟ ولماذا؟\n   الإجابة النموذجية: حفرة القشور والورق؛ لأنها مواد قابلة للتحلل، أما العلبة والبلاستيك فلا تتحلل بسهولة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] متى يكون السماد جاهزًا؟\n   الإجابة النموذجية: عندما يصبح غامق اللون طري القوام بعد بضعة أسابيع.\n2. [مستوى التطبيق] ما أهمية السماد العضوي للنباتات؟\n   الإجابة النموذجية: يزيد خصوبة التربة بالمغذيات فتنمو النباتات بشكل أفضل.\n3. [مستوى الاستدلال] لماذا تُعد الأكياس البلاستيكية خطرًا على الحيوانات؟\n   الإجابة النموذجية: لأنها لا تتحلل وقد تختنق بها الحيوانات أو تبتلعها.", "للطالب: تنفيذ استقصاء ورقة العمل 2-8ب في المنزل بمساعدة الأسرة (كتاب النشاط ص 71)، ومراجعة ص 48–49. لولي الأمر: يُرجى مساعدة الابن في حفر الحفرتين واختيار مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}], "comb": ["الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1. يوضح المقصود بمرادم النفايات وإعادة التدوير (10 دقائق)\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها (15 دقيقة)\nمخرج تعليمي آخر: يقترح طرقًا لاستخدام كمية أقل من الورق (15 دقيقة)\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n1. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة (20 دقيقة)\n2. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير (5 دقائق)\nمخرج تعليمي آخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها (15 دقيقة)\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة (15 دقيقة)\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل (10 دقائق)\nمخرج تعليمي آخر: يفسر أهمية السماد العضوي لنمو النباتات (15 دقيقة)", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1. يوضح المقصود بمرادم النفايات وإعادة التدوير. ← فهم\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها. ← تطبيق\nالمخرج الآخر: يقترح طرقًا لاستخدام كمية أقل من الورق. ← تطبيق\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n1. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة. ← تطبيق\n2. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها. ← تقييم\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة. ← فهم\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل. ← تطبيق\nالمخرج الآخر: يفسر أهمية السماد العضوي لنمو النباتات. ← فهم", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: نفايات نظيفة متنوعة على ورق جرائد: ورق، كرتون، كيس، زجاجة بلاستيكية وزجاجية، علبة، قشور خضار\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: علب معدنية وأوعية بلاستيكية نظيفة، أوراق ملونة، ورقة العمل 2-8أ\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n- الكتاب\n- صورة توضيحية\n- أخرى: كيس بلاستيكي كبير، قشور خضراوات وفواكه وبيض، أعشاب وأوراق، ماء، مجرفة، ورقة العمل 2-8ب", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n- التخلص من النفايات\n- مرادم النفايات\n- إعادة التدوير\n- إعادة الاستخدام\n- التقليل\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n- إعادة الاستخدام\n- الحملة التوعوية\n- المنتجات المغلفة\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n- السماد العضوي\n- التحلل\n- القابل للتحلل الحيوي\n- خصوبة التربة", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nيفرغ المعلم كيس نفايات نظيفة على ورق الجرائد ويرفع كل قطعة ويسأل: هل يمكن تقليل استخدامها؟ أو إعادة استخدامها؟ أو تدويرها؟ (5 دقائق)\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\nيعرض المعلم علبة معدنية فارغة ويتحدى المجموعات: اقترحوا ثلاثة استخدامات جديدة لها خلال دقيقة! (5 دقائق)\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\nيعرض المعلم كيسًا من السماد العضوي الجاهز ويطلب من الطلبة ملاحظة لونه وملمسه ورائحته، ويسأل: من ماذا صُنع؟ (5 دقائق)", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير — زمن الحصة 40 دقيقة\n\n1. إلى أين تذهب نفاياتنا؟: يشرح المعلم ص 48: مرادم النفايات أكوام ضخمة بعيدة عن السكان تغطى بالتربة، ويعرض فكرة «مدينة المخلفات» في القاهرة، والطلبة يكتبون مشكلات المرادم (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. فرز وتصنيف: يوزع المعلم على المجموعات قطعًا ويرسم جدولًا: تقليل – إعادة استخدام – إعادة تدوير، والطلبة يصنفون القطع ويعللون (9 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. السؤال 1 ص 49: ورق أقل: يطرح المعلم السؤال ويجمع الأفكار، والطلبة يقترحون: الكتابة على الوجهين، الكتب الإلكترونية، المناديل القماشية (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 2-8أ: إعادة استخدام العلب: يوزع المعلم ورقة العمل (كتاب النشاط ص 70) ويتابع التنفيذ مع مراعاة سلامة حواف العلب، والطلبة يصنعون حامل أقلام أو أصيص زرع من العلب والأوعية (8 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. تمرين 2-8: يوجه المعلم إكمال جدول تمرين 2-8 (ص 34)، والطلبة يحددون لكل عنصر طريقة إعادة الاستخدام أو التدوير (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. ملصق الحملة (السؤال 4 ص 49): يحدد المعلم معايير الملصق: رسالة واضحة، صورة جاذبة، عبارة قصيرة، والطلبة يصممون الملصق ويعلقونه، ويقيّمون ملصقات زملائهم (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات — زمن الحصة 40 دقيقة\n\n1. نشاط 2-8: تجربة عرض لصنع السماد: يجمع المعلم القشور والأعشاب في الكيس ويضيف الماء باعتدال ويربطه ويضعه في مكان دافئ، والطلبة يشاركون في الإضافة ويسجلون الخطوات وينتبهون لعدم إضافة الطعام المطبوخ أو اللحوم (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. ورقة العمل 2-8ب: مردم نفايات مصغر: يشرح المعلم الاستقصاء: حفرتان، الأولى بقشور وورق والثانية بعلبة وعبوة بلاستيكية؛ الفحص بعد أسبوعين ثم شهرين، والطلبة يكتبون تنبؤاتهم في ورقة العمل (ص 71) (6 دقائق)\nالاستراتيجيات: العرض العملي.\n\n3. مناقشة السؤال 3 والتحدي: يناقش المعلم: ما أهمية السماد؟ ولماذا يبقى البلاستيك طويلًا في المرادم؟ والطلبة يستنتجون أن البلاستيك لا يتحلل بسهولة ويضر الحيوانات (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – فرز نفايات مدرستي: تتنافس المجموعات في تصنيف بطاقات نفايات إلى ما يعاد تدويره وما يذهب إلى المرادم، وتقترح منتجًا مفيدًا يعاد تصنيعه في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإعادة التدوير؟\n   الإجابة النموذجية: معالجة الأشياء بدل رميها لتصبح منتجًا جديدًا يمكن استخدامه.\n2. [مستوى التطبيق] ما مرادم النفايات؟\n   الإجابة النموذجية: أكوام ضخمة من القمامة في أماكن بعيدة عن السكان تغطى بالتربة لاحقًا.\n3. [مستوى الاستدلال] ما الفرق بين إعادة الاستخدام وإعادة التدوير؟ أعطِ مثالًا.\n   الإجابة النموذجية: إعادة الاستخدام: استعمال الشيء مرة أخرى كما هو (علبة كحامل أقلام)؛ التدوير: معالجته لصنع منتج جديد (صهر العلب لصنع علب جديدة).\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اقترح طريقة لإعادة استخدام الأوعية البلاستيكية.\n   الإجابة النموذجية: لتخزين الأدوات أو زراعة النباتات أو حفظ الطعام.\n2. [مستوى التطبيق] أي المواد في تمرين 2-8 يمكن تحويلها إلى سماد؟\n   الإجابة النموذجية: قشور الفواكه والخضراوات ومخلفات الحدائق.\n3. [مستوى الاستدلال] ما الذي يجعل الملصق التوعوي ناجحًا؟\n   الإجابة النموذجية: رسالة واضحة قصيرة، صورة جاذبة، ألوان مناسبة، ودعوة لفعل محدد.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المواد المناسبة لصنع السماد العضوي؟\n   الإجابة النموذجية: قشور الخضراوات والفواكه والبيض، والحشائش والأوراق المتساقطة.\n2. [مستوى التطبيق] لماذا لا نضع الطعام المطبوخ أو اللحوم في كيس السماد؟\n   الإجابة النموذجية: لأنها تتعفن بروائح كريهة وتجذب الحشرات والحيوانات.\n3. [مستوى الاستدلال] أي الحفرتين تتوقع أن تتغير محتوياتها أكثر؟ ولماذا؟\n   الإجابة النموذجية: حفرة القشور والورق؛ لأنها مواد قابلة للتحلل، أما العلبة والبلاستيك فلا تتحلل بسهولة.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين يمكن إعادة تدويرهما.\n   الإجابة النموذجية: الورق، البلاستيك، الزجاج، العلب المعدنية.\n2. [مستوى التطبيق] اقترح طريقتين لاستخدام ورق أقل.\n   الإجابة النموذجية: الكتابة على وجهي الورقة، استخدام الأجهزة الإلكترونية، المناديل القماشية.\n3. [مستوى الاستدلال] لماذا يُعد تقليل النفايات أفضل من إعادة تدويرها؟\n   الإجابة النموذجية: لأنه يمنع إنتاج النفايات أصلًا ويوفر الطاقة والمواد المستخدمة في التدوير.\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما فائدة إعادة الاستخدام للبيئة؟\n   الإجابة النموذجية: تقلل النفايات وتحافظ على المواد الطبيعية.\n2. [مستوى التطبيق] اكتب شعارًا قصيرًا لحملة إعادة التدوير.\n   الإجابة النموذجية: مثل: «لا ترمِ.. أعد التدوير!» (تقبل الشعارات المناسبة).\n3. [مستوى الاستدلال] كيف يمكنك وأسرتك إعادة التدوير في المنزل؟\n   الإجابة النموذجية: فرز النفايات، جمع العلب والورق في سلال خاصة، إعادة استخدام الأكياس والأوعية.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] متى يكون السماد جاهزًا؟\n   الإجابة النموذجية: عندما يصبح غامق اللون طري القوام بعد بضعة أسابيع.\n2. [مستوى التطبيق] ما أهمية السماد العضوي للنباتات؟\n   الإجابة النموذجية: يزيد خصوبة التربة بالمغذيات فتنمو النباتات بشكل أفضل.\n3. [مستوى الاستدلال] لماذا تُعد الأكياس البلاستيكية خطرًا على الحيوانات؟\n   الإجابة النموذجية: لأنها لا تتحلل وقد تختنق بها الحيوانات أو تبتلعها.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nللطالب: قراءة كتاب الطالب ص 48 وعدّ أكياس النفايات التي تخرجها الأسرة أسبوعيًا. لولي الأمر: يُرجى تخصيص سلة لفرز المواد القابلة للتدوير في المنزل.\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\nللطالب: حل تمرين 2-8 في كتاب النشاط ص 34 وإكمال الملصق، وإعداد قائمة بالمنتجات المغلفة القابلة للتدوير من البقالة. لولي الأمر: يُرجى اصطحاب الابن إلى البقالة وتشجيعه على إعداد القائمة.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\nللطالب: تنفيذ استقصاء ورقة العمل 2-8ب في المنزل بمساعدة الأسرة (كتاب النشاط ص 71)، ومراجعة ص 48–49. لولي الأمر: يُرجى مساعدة الابن في حفر الحفرتين واختيار مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"id": "2-9", "title": "الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 50–51 | كتاب النشاط ص 35 | دليل المعلم ص 62–64", "n": 2, "per": [{"h": {"lesson": "2-9 الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 50 | كتاب النشاط ص 35 | دليل المعلم ص 62–63", "num": "الحصة الأولى من 2", "focus": "الحفاظ على الماء والطاقة"}, "f": ["1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة (20 دقيقة)\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء (5 دقائق)\nمخرج تعليمي آخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه (15 دقيقة)", "1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة. ← تذكر\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء. ← فهم\nالمخرج الآخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه. ← تقييم", "- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: تمرين 2-9 في كتاب النشاط", "- الماء العذب\n- ترشيد الاستهلاك\n- الطاقة\n- المصابيح الموفرة\n- الطاقة الشمسية", "يعرض المعلم صنبورًا يقطر (أو مقطعًا) ويسأل: كم لترًا يضيع من صنبور يقطر طوال اليوم؟ هل يهمنا ذلك في بلد قليل الأمطار؟ (5 دقائق)", "1. الحفاظ على الماء: يناقش المعلم ص 50: الاستحمام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد، والطلبة يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الحفاظ على الطاقة: يناقش المعلم: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية، والطلبة يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-9: سجلي الأسبوعي: يوجه المعلم تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع، والطلبة يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.", "للطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"h": {"lesson": "2-9 الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 51 | دليل المعلم ص 63–64", "num": "الحصة الثانية من 2", "focus": "فرز القمامة وحملة لمنع رميها (نشاط 2-9)"}, "f": ["1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان (15 دقيقة)\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات (10 دقائق)\nمخرج تعليمي آخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة (15 دقيقة)", "1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان. ← تطبيق\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات. ← تحليل\nالمخرج الآخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة. ← إبداع", "- الاستقصاء العلمي\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أكياس قمامة كبيرة، قفازات مطاطية، كمامات، دفتر ملاحظات", "- فرز القمامة\n- جدول الإحصاء\n- التمثيل بالأعمدة\n- الحملة التوعوية", "يسأل المعلم: ما أكثر أنواع القمامة التي تتوقع أن تجدها في فناء المدرسة؟ ويسجل التنبؤات على السبورة. (5 دقائق)", "1. نشاط 2-9: الجمع والتسجيل: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل، والطلبة يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التمثيل والمقارنة: يوجه المعلم جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2)، والطلبة يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تخطيط الحملة (السؤال 3): يناقش المعلم «تحدّث عن» ص 51 ويطلب خطة حملة، والطلبة يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – سفراء البيئة العمانية: تتقمص المجموعات دور سفراء البيئة، فتقدم كل مجموعة نصيحتين للحفاظ على الماء والطاقة في البيت والمدرسة، ضمن أهداف رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أكثر أنواع القمامة التي جمعتها مجموعتك؟\n   الإجابة النموذجية: غالبًا البلاستيك أو الورق (تعتمد على النتائج).\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستدلال بعدد العلامات.\n3. [مستوى الاستدلال] لماذا يُعد البلاستيك من أخطر أنواع القمامة؟\n   الإجابة النموذجية: لأنه لا يتحلل بسهولة ويبقى طويلًا وقد تختنق به الحيوانات.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نرتدي القفازات والكمامات عند جمع القمامة؟\n   الإجابة النموذجية: لحماية أنفسنا من الجراثيم والأدوات الحادة.\n2. [مستوى التطبيق] ما فائدة تمثيل نتائج الفرز بالأعمدة؟\n   الإجابة النموذجية: لمقارنة أنواع القمامة بسهولة ومعرفة النوع الأكثر شيوعًا.\n3. [مستوى الاستدلال] اقترح فكرتين لحملة منع رمي القمامة في مدرستك.\n   الإجابة النموذجية: وضع صناديق قرب المقصف، ملصقات توعوية، مسابقة الفصل الأنظف (تقبل الأفكار المنطقية).", "للطالب: إعداد ملصق للحملة التوعوية لوضعه في المدرسة، ومراجعة الوحدة الثانية. لولي الأمر: يُرجى تشجيع الابن على عدم رمي المخلفات في الأماكن العامة والقدوة في ذلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}], "comb": ["الحصة 1: الحفاظ على الماء والطاقة\n1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة (20 دقيقة)\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء (5 دقائق)\nمخرج تعليمي آخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه (15 دقيقة)\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان (15 دقيقة)\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات (10 دقائق)\nمخرج تعليمي آخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة (15 دقيقة)", "الحصة 1: الحفاظ على الماء والطاقة\n1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة. ← تذكر\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء. ← فهم\nالمخرج الآخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه. ← تقييم\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان. ← تطبيق\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات. ← تحليل\nالمخرج الآخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة. ← إبداع", "الحصة 1: الحفاظ على الماء والطاقة\n- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "الحصة 1: الحفاظ على الماء والطاقة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: تمرين 2-9 في كتاب النشاط\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أكياس قمامة كبيرة، قفازات مطاطية، كمامات، دفتر ملاحظات", "الحصة 1: الحفاظ على الماء والطاقة\n- الماء العذب\n- ترشيد الاستهلاك\n- الطاقة\n- المصابيح الموفرة\n- الطاقة الشمسية\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\n- فرز القمامة\n- جدول الإحصاء\n- التمثيل بالأعمدة\n- الحملة التوعوية", "الحصة 1: الحفاظ على الماء والطاقة\nيعرض المعلم صنبورًا يقطر (أو مقطعًا) ويسأل: كم لترًا يضيع من صنبور يقطر طوال اليوم؟ هل يهمنا ذلك في بلد قليل الأمطار؟ (5 دقائق)\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nيسأل المعلم: ما أكثر أنواع القمامة التي تتوقع أن تجدها في فناء المدرسة؟ ويسجل التنبؤات على السبورة. (5 دقائق)", "الحصة 1: الحفاظ على الماء والطاقة — زمن الحصة 40 دقيقة\n\n1. الحفاظ على الماء: يناقش المعلم ص 50: الاستحمام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد، والطلبة يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الحفاظ على الطاقة: يناقش المعلم: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية، والطلبة يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-9: سجلي الأسبوعي: يوجه المعلم تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع، والطلبة يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9) — زمن الحصة 40 دقيقة\n\n1. نشاط 2-9: الجمع والتسجيل: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل، والطلبة يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التمثيل والمقارنة: يوجه المعلم جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2)، والطلبة يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تخطيط الحملة (السؤال 3): يناقش المعلم «تحدّث عن» ص 51 ويطلب خطة حملة، والطلبة يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – سفراء البيئة العمانية: تتقمص المجموعات دور سفراء البيئة، فتقدم كل مجموعة نصيحتين للحفاظ على الماء والطاقة في البيت والمدرسة، ضمن أهداف رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: الحفاظ على الماء والطاقة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أكثر أنواع القمامة التي جمعتها مجموعتك؟\n   الإجابة النموذجية: غالبًا البلاستيك أو الورق (تعتمد على النتائج).\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستدلال بعدد العلامات.\n3. [مستوى الاستدلال] لماذا يُعد البلاستيك من أخطر أنواع القمامة؟\n   الإجابة النموذجية: لأنه لا يتحلل بسهولة ويبقى طويلًا وقد تختنق به الحيوانات.", "الحصة 1: الحفاظ على الماء والطاقة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نرتدي القفازات والكمامات عند جمع القمامة؟\n   الإجابة النموذجية: لحماية أنفسنا من الجراثيم والأدوات الحادة.\n2. [مستوى التطبيق] ما فائدة تمثيل نتائج الفرز بالأعمدة؟\n   الإجابة النموذجية: لمقارنة أنواع القمامة بسهولة ومعرفة النوع الأكثر شيوعًا.\n3. [مستوى الاستدلال] اقترح فكرتين لحملة منع رمي القمامة في مدرستك.\n   الإجابة النموذجية: وضع صناديق قرب المقصف، ملصقات توعوية، مسابقة الفصل الأنظف (تقبل الأفكار المنطقية).", "الحصة 1: الحفاظ على الماء والطاقة\nللطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nللطالب: إعداد ملصق للحملة التوعوية لوضعه في المدرسة، ومراجعة الوحدة الثانية. لولي الأمر: يُرجى تشجيع الابن على عدم رمي المخلفات في الأماكن العامة والقدوة في ذلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"id": "2-10", "title": "تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | كتاب النشاط ص 36 | دليل المعلم ص 64", "n": 3, "per": [{"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | دليل المعلم ص 64", "num": "الحصة الأولى من 3", "focus": "مراجعة المفردات والسلاسل الغذائية في صورة موطن"}, "f": ["1. يطابق مصطلحات الوحدة بمعانيها الصحيحة (10 دقائق)\n2. يحدد مصدر الطاقة والمنتجات والمستهلكات والمفترس والفريسة في صورة موطن (15 دقيقة)\nمخرج تعليمي آخر: يتنبأ بأثر اختفاء الحشرات أو غياب الشمس على الموطن (15 دقيقة)", "1. يطابق مصطلحات الوحدة بمعانيها الصحيحة. ← تذكر\n2. يحدد مصدر الطاقة والمنتجات والمستهلكات والمفترس والفريسة في صورة موطن. ← تطبيق\nالمخرج الآخر: يتنبأ بأثر اختفاء الحشرات أو غياب الشمس على الموطن. ← تحليل", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- الموطن الطبيعي\n- المغذيات\n- الاحتباس الحراري\n- مصدر الطاقة", "يعرض المعلم لعبة «كلمة وتعريف»: يقرأ تعريفًا ويرفع الطلبة البطاقة التي تحمل المصطلح المناسب. (5 دقائق)", "1. السؤال 1: المطابقة: يوجه المعلم حل السؤال 1 ص 52، والطلبة يطابقون المصطلحات بمعانيها ويصححون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السؤال 2: صورة الموطن: يعرض المعلم الصورة ص 52 على السبورة الذكية، والطلبة يحددون مصدر الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته (8 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 3: ماذا لو؟: يدير المعلم نقاش: اختفاء الحشرات، توقف الشمس عن السطوع، والطلبة يتنبؤون بالآثار ويكتبونها (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.", "للطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 53 | دليل المعلم ص 64", "num": "الحصة الثانية من 3", "focus": "مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة"}, "f": ["1. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح (15 دقيقة)\n2. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع (10 دقائق)\nمخرج تعليمي آخر: يقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة (15 دقيقة)", "1. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح. ← تطبيق\n2. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع. ← فهم\nالمخرج الآخر: يقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة. ← تطبيق", "- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- ترتيب السلسلة\n- إزالة الغابات\n- الأمطار الحمضية\n- إعادة التدوير", "يكتب المعلم سلسلة مقلوبة: «صقر ← سحلية ← خنفساء ← بذور» ويسأل: ما الخطأ هنا؟ (5 دقائق)", "1. السؤال 4: الترتيب الصحيح: يوجه المعلم ترتيب السلاسل الأربع ص 53، والطلبة يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة لب من كل طالب إضافة كلمة مرتبطة خلال دقيقتين. (5 دقائق)", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن — زمن الحصة 40 دقيقة\n\n1. السؤال 1: المطابقة: يوجه المعلم حل السؤال 1 ص 52، والطلبة يطابقون المصطلحات بمعانيها ويصححون (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السؤال 2: صورة الموطن: يعرض المعلم الصورة ص 52 على السبورة الذكية، والطلبة يحددون مصدر الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته (8 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 3: ماذا لو؟: يدير المعلم نقاش: اختفاء الحشرات، توقف الشمس عن السطوع، والطلبة يتنبؤون بالآثار ويكتبونها (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة — زمن الحصة 40 دقيقة\n\n1. السؤال 4: الترتيب الصحيح: يوجه المعلم ترتيب السلاسل الأربع ص 53، والطلبة يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. السؤال 5 و6: يوجه المعلم اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع، والطلبة يجيبون كتابيًا ثم يتشاركون (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. السؤال 7: أعد التدوير: يعرض المعلم صور الأشياء في السؤال 7، والطلبة يقترحون طرق إعادة الاستخدام والتدوير لكل منها (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة — زمن الحصة 40 دقيقة\n\n1. المراجعة اللغوية: يوجه المعلم حل المراجعة اللغوية (كتاب النشاط ص 36) ويصحح جماعيًا، والطلبة يكملون الجمل ويصححون (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. الخريطة المفاهيمية: يقسم المعلم الوحدة إلى فروع: السلاسل الغذائية، المواطن، آثار الإنسان، الاعتناء بالبيئة، وترسم كل مجموعة فرعًا ثم تُجمع الفروع في خريطة واحدة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. سؤال من صنعي: يطلب المعلم من كل طالب كتابة سؤال وإجابته، والطلبة يتبادلون الأسئلة ويجيبون (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. غلق الدرس – مراجعة بلغة الوطن: تتسابق المجموعات في مطابقة مصطلحات الوحدة وتحديد المنتج ومصدر الطاقة في سلسلة غذائية لموطن عماني يعرضه المعلم (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] رتب: نورس – عوالق – سمكة.\n   الإجابة النموذجية: عوالق ← سمكة ← نورس.\n2. [مستوى التطبيق] رتب: قرش – عوالق – سمك صغير – فقمة.\n   الإجابة النموذجية: عوالق ← سمك صغير ← فقمة ← قرش.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد تركيزه في الهواء ويحبس الحرارة.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أكمل: الحيوانات التي تتغذى عليها المفترسات تسمى ____.\n   الإجابة النموذجية: فرائس.\n2. [مستوى التطبيق] ما العلاقة بين فرعي «آثار الإنسان» و«الاعتناء بالبيئة» في الخريطة؟\n   الإجابة النموذجية: الاعتناء بالبيئة يقلل الآثار السلبية للإنسان مثل التلوث وإزالة الغابات.\n3. [مستوى الاستدلال] اربط بين إزالة الغابات والسلاسل الغذائية.\n   الإجابة النموذجية: تدمر إزالة الغابات المواطن فتختفي المنتجات وتنهار السلاسل الغذائية فيها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] رتب: صقر – بذور – سحلية – خنفساء.\n   الإجابة النموذجية: بذور ← خنفساء ← سحلية ← صقر.\n2. [مستوى التطبيق] كيف يمكن أن تتسبب الأمطار الحمضية في قتل الضفادع؟\n   الإجابة النموذجية: تجعل ماء البحيرات حمضيًا فيضر بالضفادع وغذائها.\n3. [مستوى الاستدلال] اقترح طريقة لإعادة استخدام الزجاجات البلاستيكية.\n   الإجابة النموذجية: كأصص للزراعة أو لتخزين الأغراض أو صنع أدوات مفيدة.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المصطلح: «التخلص من النفايات بمعالجتها لتصبح منتجًا جديدًا»؟\n   الإجابة النموذجية: إعادة التدوير.\n2. [مستوى التطبيق] اذكر أثرين سلبيين للإنسان على البيئة وطريقتين للعناية بها.\n   الإجابة النموذجية: السلبي: التلوث وإزالة الغابات؛ العناية: إعادة التدوير وترشيد الطاقة.\n3. [مستوى الاستدلال] اكتب سؤالًا عن الوحدة وأجب عنه.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nللطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\n\nالحصة 2: مراجعة: ترتيب السلاسل وآثار الإنسان على البيئة\nللطالب: حل «المراجعة اللغوية» في كتاب النشاط ص 36 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى متابعة الابن في المراجعة.\n\nالحصة 3: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nللطالب: مراجعة الوحدة الثانية كاملة باستخدام الخريطة المفاهيمية. لولي الأمر: يُرجى الاطلاع على الخريطة ومراجعة الوحدة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"id": "3-1", "title": "التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37، 72–73 | دليل المعلم ص 71–75", "n": 5, "per": [{"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54 | دليل المعلم ص 71–73", "num": "الحصة الأولى من 5", "focus": "التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء"}, "f": ["1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد (15 دقيقة)\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة (5 دقائق)\nمخرج تعليمي آخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين (20 دقيقة)", "1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد. ← فهم\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة. ← تطبيق\nالمخرج الآخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكعبات ثلج، أطباق، ساعة إيقاف", "- حالات المادة\n- الانصهار\n- التجمد\n- التغير القابل للعكس\n- الحرارة", "يراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟ (5 دقائق)", "1. نشاط 3-1: ملاحظة تغيرات الثلج: يوزع المعلم مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54، والطلبة يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. هل يمكن عكسه؟: يسأل المعلم: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس»، والطلبة يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصحيح المفاهيم: يوضح المعلم أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر)، والطلبة يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير) (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.", "للطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | دليل المعلم ص 72–73", "num": "الحصة الثانية من 5", "focus": "التغيرات غير القابلة للعكس"}, "f": ["1. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة (5 دقائق)\n2. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل (15 دقيقة)\nمخرج تعليمي آخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة (20 دقيقة)", "1. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة. ← فهم\n2. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل. ← تطبيق\nالمخرج الآخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة. ← تحليل", "- العرض العملي\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورقة، مقص، صندوق رمل، عود ثقاب (للمعلم فقط)", "- التغير غير القابل للعكس\n- الاحتراق\n- it": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 72 | دليل المعلم ص 73", "num": "الحصة الثالثة من 5", "focus": "احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا"}, "f": ["1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة (15 دقيقة)\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة (10 دقائق)\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة (15 دقيقة)", "1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة. ← تطبيق\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة. ← تحليل\nالمخرج الآخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة. ← تحليل", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: شمعة، حامل أو طبق، ملعقة معدنية، أعواد ثقاب، ورقة العمل 3-1", "- انصهار الشمع\n- احتراق الفتيل\n- الدخان\n- الملاحظة العلمية", "يعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟ (5 دقائق)", "1. ورقة العمل 3-1 (الجزء الأول): عرض الشمعة: يشعل المعلم الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد، والطلبة يسجلون الملاحظات في جدول ورقة العمل (ص 72) (9 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. التحليل: يناقش المعلم: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة، والطلبة يصنفون كل ملاحظة ويعللون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. السلامة مع اللهب: يناقش المعلم قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة، والطلبة يكتبون ثلاث قواعد سلامة (5 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.", "للطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 73 | دليل المعلم ص 73–74", "num": "الحصة الرابعة من 5", "focus": "تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص"}, "f": ["1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز) (15 دقيقة)\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة (15 دقيقة)\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم (10 دقائق)", "1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز). ← تحليل\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة. ← فهم\nالمخرج الآخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: بيكربونات الصوديوم، خل، كأس زجاجية، ملعقة صغيرة، جص، ماء، أكواب، ورقة العمل 3-1", "- التغير الفيزيائي\n- التغير الكيميائي\n- التفاعل\n- الفقاعات\n- الجص", "يسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم. (5 دقائق)", "1. ورقة العمل 3-1 (الجزء الثاني): يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس، والطلبة يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض الجص: يخلط المعلم الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج، والطلبة يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. فيزيائي أم كيميائي؟: يشرح المعلم: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة)، والطلبة يصنفون أمثلة الدرس في جدول (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.", "للطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37 | دليل المعلم ص 73–75", "num": "الحصة الخامسة من 5", "focus": "تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج"}, "f": ["1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر (15 دقيقة)\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي (10 دقائق)\nمخرج تعليمي آخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها (15 دقيقة)", "1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر. ← تطبيق\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي. ← تحليل\nالمخرج الآخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها. ← تحليل", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: نموذج بركان من العجين أو الورق، بيكربونات الصوديوم، خل، ألوان طعام، تمرين 3-1", "- النموذج\n- الثوران\n- إعادة تدوير الزجاج\n- الانصهار", "يعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟ (5 دقائق)", "1. نموذج البركان (تكامل مع الفنون والمهارات الحياتية): يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام، والطلبة ينفذون الثوران ويصفون التغير ويصنفونه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 3-1 في كتاب النشاط: يوجه المعلم حل التمرين (ص 37) مع دعم المتعثرين، والطلبة يقارنون التغيرات ويحلون فرديًا (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تحدّث عن: إعادة تدوير الزجاج: يشرح المعلم: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟ والطلبة يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – ثلج وسمن وخبز: تصنف المجموعات تغيرات في المطبخ العماني إلى قابلة للعكس كانصهار السمن، وغير قابلة كخبز الرقاق، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "للطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}], "comb": ["الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد (15 دقيقة)\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة (5 دقائق)\nمخرج تعليمي آخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين (20 دقيقة)\n\nالحصة 2: التغيرات غير القابلة للعكس\n1. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة (5 دقائق)\n2. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل (15 دقيقة)\nمخرج تعليمي آخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة (20 دقيقة)\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. يسجل ملاحظات د
