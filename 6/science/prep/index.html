 تدوير الزجاج\n1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر. ← تطبيق\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي. ← تحليل\nالمخرج الآخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها. ← تحليل", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2: التغيرات غير القابلة للعكس\n- العرض العملي\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم المبني على اللعب", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكعبات ثلج، أطباق، ساعة إيقاف\n\nالحصة 2: التغيرات غير القابلة للعكس\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورقة، مقص، صندوق رمل، عود ثقاب (للمعلم فقط)\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n- الكتاب\n- السبورة التقليدية\n- أخرى: شمعة، حامل أو طبق، ملعقة معدنية، أعواد ثقاب، ورقة العمل 3-1\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n- الكتاب\n- السبورة التقليدية\n- أخرى: بيكربونات الصوديوم، خل، كأس زجاجية، ملعقة صغيرة، جص، ماء، أكواب، ورقة العمل 3-1\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n- الكتاب\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: نموذج بركان من العجين أو الورق، بيكربونات الصوديوم، خل، ألوان طعام، تمرين 3-1", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n- حالات المادة\n- الانصهار\n- التجمد\n- التغير القابل للعكس\n- الحرارة\n\nالحصة 2: التغيرات غير القابلة للعكس\n- التغير غير القابل للعكس\n- الاحتراق\n- الكربون\n- مادة جديدة\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n- انصهار الشمع\n- احتراق الفتيل\n- الدخان\n- الملاحظة العلمية\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n- التغير الفيزيائي\n- التغير الكيميائي\n- التفاعل\n- الفقاعات\n- الجص\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n- النموذج\n- الثوران\n- إعادة تدوير الزجاج\n- الانصهار", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nيراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟ (5 دقائق)\n\nالحصة 2: التغيرات غير القابلة للعكس\nيمزق المعلم ورقة إلى قطع ويسأل: هل يمكنني إرجاع الورقة كما كانت؟ ثم يحرق قطعة داخل صندوق الرمل ويعيد السؤال. (5 دقائق)\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nيعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟ (5 دقائق)\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nيسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم. (5 دقائق)\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nيعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟ (5 دقائق)", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء — زمن الحصة 40 دقيقة\n\n1. نشاط 3-1: ملاحظة تغيرات الثلج: يوزع المعلم مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54، والطلبة يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. هل يمكن عكسه؟: يسأل المعلم: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس»، والطلبة يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصحيح المفاهيم: يوضح المعلم أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر)، والطلبة يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير) (7 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 2: التغيرات غير القابلة للعكس — زمن الحصة 40 دقيقة\n\n1. مفهوم التغير غير القابل للعكس: يشرح المعلم ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب، والطلبة يكتبون التعريفين في جدول مقارنة (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. لعبة «قابل أم غير قابل؟»: يعرض المعلم بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد، والطلبة يصنفون البطاقات ويبررون في ثنائيات (9 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. الأسئلة 1–3 ص 55: يوجه المعلم سؤال الجلي والبيض المسلوق، والطلبة يجيبون ويرسمون مخططًا سهميًا للجلي (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 3-1 (الجزء الأول): عرض الشمعة: يشعل المعلم الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد، والطلبة يسجلون الملاحظات في جدول ورقة العمل (ص 72) (9 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. التحليل: يناقش المعلم: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة، والطلبة يصنفون كل ملاحظة ويعللون (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. السلامة مع اللهب: يناقش المعلم قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة، والطلبة يكتبون ثلاث قواعد سلامة (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 3-1 (الجزء الثاني): يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس، والطلبة يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض الجص: يخلط المعلم الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج، والطلبة يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص (6 دقائق)\nالاستراتيجيات: العرض العملي.\n\n3. فيزيائي أم كيميائي؟: يشرح المعلم: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة)، والطلبة يصنفون أمثلة الدرس في جدول (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج — زمن الحصة 40 دقيقة\n\n1. نموذج البركان (تكامل مع الفنون والمهارات الحياتية): يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام، والطلبة ينفذون الثوران ويصفون التغير ويصنفونه (8 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. تمرين 3-1 في كتاب النشاط: يوجه المعلم حل التمرين (ص 37) مع دعم المتعثرين، والطلبة يقارنون التغيرات ويحلون فرديًا (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تحدّث عن: إعادة تدوير الزجاج: يشرح المعلم: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟ والطلبة يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: العرض العملي.\n\n5. غلق الدرس – ثلج وسمن وخبز: تصنف المجموعات تغيرات في المطبخ العماني إلى قابلة للعكس كانصهار السمن، وغير قابلة كخبز الرقاق، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).\n\nالحصة 2: التغيرات غير القابلة للعكس\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n2. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n3. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.\n\nالحصة 2: التغيرات غير القابلة للعكس\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n2. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n3. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nللطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\n\nالحصة 2: التغيرات غير القابلة للعكس\nللطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n\nالحصة 3: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nللطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n\nالحصة 4: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nللطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n\nالحصة 5: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nللطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"id": "3-2", "title": "خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38، 74 | دليل المعلم ص 74–77", "n": 5, "per": [{"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56 | دليل المعلم ص 74–76", "num": "الحصة الأولى من 5", "focus": "ما المخلوط؟ صنع مخاليط من مواد صلبة"}, "f": ["1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي (10 دقائق)\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها (20 دقيقة)\nمخرج تعليمي آخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها (10 دقائق)", "1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون", "- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي", "يعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة. (5 دقائق)", "1. تعريف المخلوط: يشرح المعلم ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون، والطلبة يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 3-2أ: صنع المخاليط: يوزع المعلم المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب، والطلبة يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟ (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقود المعلم الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل، والطلبة يقارنون المخاليط: أيها يسهل رؤية مكوناته؟ (5 دقائق)\nالاستراتيجيات: المناقشة.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحفظ المخاليط للحصة القادمة، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.", "للطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | دليل المعلم ص 75–76", "num": "الحصة الثانية من 5", "focus": "فصل المخاليط بالفرز والغربلة"}, "f": ["1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة (10 دقائق)\n2. يختار الأدوات المناسبة لفصل كل مخلوط (15 دقيقة)\nمخرج تعليمي آخر: يربط حجم الجزيئات بطريقة الفصل المناسبة (15 دقيقة)", "1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n2. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل", "- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط", "- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات", "يسأل المعلم: كيف تفصل الأم الماء عن الأرز المطبوخ؟ وكيف يلتقط من لا يحب الزبيب حباته من مخلوط الفول السوداني؟ (5 دقائق)", "1. طرق الفصل: يشرح المعلم ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة، والطلبة يكملون جدول: الطريقة – متى نستخدمها – مثال (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. نشاط 3-2ب: فصل مخاليط الحصة السابقة: يحدد المعلم الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ، والطلبة يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة السؤالين 1 و2: يسأل المعلم: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟ والطلبة يذكرون الملح والرمل ويتوقعون السبب (5 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n3. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n2. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n3. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.", "للطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | كتاب النشاط ص 74 | دليل المعلم ص 76–77", "num": "الحصة الثالثة من 5", "focus": "الفصل بالمغناطيس (ورقة العمل 3-2)"}, "f": ["1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس (10 دقائق)\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها (15 دقيقة)\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة (15 دقيقة)", "1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2", "- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل", "يسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟ (5 دقائق)", "1. السلامة: ينبه المعلم: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل، والطلبة يستمعون ويكررون قواعد السلامة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ورقة العمل 3-2: فصل المخاليط: يوزع المعلم المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز، والطلبة يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74) (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحدّث عن: الخردة وتصحيح مفهوم: يوضح المعلم أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة، والطلبة يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.", "للطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | دليل المعلم ص 75–76", "num": "الحصة الرابعة من 5", "focus": "مقارنة طرق الفصل والتنبؤ بأفضلها"}, "f": ["1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس (10 دقائق)\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره (15 دقيقة)\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله (15 دقيقة)", "1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر", "- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "- طرق الفصل\n- التبخير\n- التنبؤ\n- الاختيار المعلل", "يعرض المعلم مخلوط الملح والرمل الذي لم يُفصل في الحصة السابقة، ويسأل: تذكروا الصف الرابع.. كيف استعدنا الملح من الماء؟ (5 دقائق)", "1. حل اللغز (فكرة): يشرح المعلم الفكرة: نضيف الماء فيذوب الملح، نفصل الرمل، ثم نبخر الماء فيبقى الملح (ستدرس تفصيلًا لاحقًا)، والطلبة يرسمون مخططًا لخطوات الفصل (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. السؤال 3 ص 57: اختر وعلّل: يوجه المعلم التنبؤ بأفضل طريقة لفصل: الفول السوداني والفاصوليا، الملح وفتات الخبز، البازلاء والدقيق، والطلبة يقترحون الطريقة ويعللون في ثنائيات ثم يعرضون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. جدول المقارنة: يقود المعلم بناء جدول: الطريقة – المبدأ – مثال – متى لا تنجح، والطلبة يكملون الجدول في الدفتر (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أفضل طريقة لفصل الفول السوداني عن الفاصوليا؟\n   الإجابة النموذجية: الفرز؛ لأن الحبات كبيرة يسهل التقاطها.\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الملح عن فتات الخبز؟\n   الإجابة النموذجية: الغربلة إذا كان الفتات أكبر من حبيبات الملح.\n3. [مستوى الاستدلال] متى لا ينجح الفرز في الفصل؟\n   الإجابة النموذجية: عندما تكون الجزيئات صغيرة جدًا أو متشابهة يصعب التقاطها.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة التي تفصل الملح عن الماء؟\n   الإجابة النموذجية: التبخير.\n2. [مستوى التطبيق] لماذا لا نستخدم المغناطيس لفصل الملح عن الرمل؟\n   الإجابة النموذجية: لأنهما ليسا مادتين مغناطيسيتين.\n3. [مستوى الاستدلال] رتب خطوات فصل الملح عن الرمل.\n   الإجابة النموذجية: إضافة الماء وتحريكه ليذوب الملح، فصل الرمل، ثم تبخير الماء ليبقى الملح.", "للطالب: حل تمرين 3-2 في كتاب النشاط ص 38 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في طرق فصل يستخدمها في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38 | دليل المعلم ص 76–77", "num": "الحصة الخامسة من 5", "focus": "تحدي الفصل: تصميم خطة لفصل مخلوط معقد"}, "f": ["1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة (10 دقائق)\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات (15 دقيقة)\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق (15 دقيقة)", "1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة. ← إبداع\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات. ← تقييم\nالمخرج الآخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق. ← فهم", "- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مخلوط من فاصوليا وأرز ودقيق ودبابيس، غربال، مغناطيس، أطباق", "- خطة الفصل\n- التسلسل\n- التقييم\n- الغربلة", "يعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟ (5 دقائق)", "1. التخطيط: يطلب المعلم خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة، والطلبة يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التنفيذ: يتابع المعلم السلامة والدقة ويحسب الوقت، والطلبة ينفذون الخطة ويسجلون نجاح كل خطوة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التقييم والتحسين: يدير المعلم مقارنة بين خطط المجموعات، والطلبة يقيّمون خطتهم ويقترحون تحسينًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. القمح والدقيق: يشرح المعلم باختصار فصل القشور عن الحبوب بالغربلة، والطلبة يربطون الفكرة بطرق الفصل (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – فصل حبوب السوق: تقترح المجموعات طرقًا لفصل مخلوط من حبوب ومواد صلبة يباع في السوق الشعبي، كالغربلة والانتقاء، وتعرض الطريقة الأنسب (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "للطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}], "comb": ["الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي (10 دقائق)\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها (20 دقيقة)\nمخرج تعليمي آخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها (10 دقائق)\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة (10 دقائق)\n2. يختار الأدوات المناسبة لفصل كل مخلوط (15 دقيقة)\nمخرج تعليمي آخر: يربط حجم الجزيئات بطريقة الفصل المناسبة (15 دقيقة)\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس (10 دقائق)\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها (15 دقيقة)\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة (15 دقيقة)\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس (10 دقائق)\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره (15 دقيقة)\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله (15 دقيقة)\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة (10 دقائق)\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات (15 دقيقة)\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق (15 دقيقة)", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n1. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n2. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة. ← إبداع\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات. ← تقييم\nالمخرج الآخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق. ← فهم", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n- التعلم التعاوني\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n- الكتاب\n- صورة توضيحية\n- أخرى: مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- الكتاب\n- صورة توضيحية\n- أخرى: مخلوط من فاصوليا وأرز ودقيق ودبابيس، غربال، مغناطيس، أطباق", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\n- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\n- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\n- طرق الفصل\n- التبخير\n- التنبؤ\n- الاختيار المعلل\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- خطة الفصل\n- التسلسل\n- التقييم\n- الغربلة", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nيعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة. (5 دقائق)\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\nيسأل المعلم: كيف تفصل الأم الماء عن الأرز المطبوخ؟ وكيف يلتقط من لا يحب الزبيب حباته من مخلوط الفول السوداني؟ (5 دقائق)\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\nيسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟ (5 دقائق)\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\nيعرض المعلم مخلوط الملح والرمل الذي لم يُفصل في الحصة السابقة، ويسأل: تذكروا الصف الرابع.. كيف استعدنا الملح من الماء؟ (5 دقائق)\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nيعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟ (5 دقائق)", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة — زمن الحصة 40 دقيقة\n\n1. تعريف المخلوط: يشرح المعلم ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون، والطلبة يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 3-2أ: صنع المخاليط: يوزع المعلم المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب، والطلبة يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟ (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقود المعلم الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل، والطلبة يقارنون المخاليط: أيها يسهل رؤية مكوناته؟ (5 دقائق)\nالاستراتيجيات: المناقشة.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويحفظ المخاليط للحصة القادمة، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة — زمن الحصة 40 دقيقة\n\n1. طرق الفصل: يشرح المعلم ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة، والطلبة يكملون جدول: الطريقة – متى نستخدمها – مثال (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. نشاط 3-2ب: فصل مخاليط الحصة السابقة: يحدد المعلم الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ، والطلبة يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. مناقشة السؤالين 1 و2: يسأل المعلم: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟ والطلبة يذكرون الملح والرمل ويتوقعون السبب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2) — زمن الحصة 40 دقيقة\n\n1. السلامة: ينبه المعلم: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل، والطلبة يستمعون ويكررون قواعد السلامة (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. ورقة العمل 3-2: فصل المخاليط: يوزع المعلم المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز، والطلبة يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74) (11 دقيقة)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. تحدّث عن: الخردة وتصحيح مفهوم: يوضح المعلم أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة، والطلبة يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها — زمن الحصة 40 دقيقة\n\n1. حل اللغز (فكرة): يشرح المعلم الفكرة: نضيف الماء فيذوب الملح، نفصل الرمل، ثم نبخر الماء فيبقى الملح (ستدرس تفصيلًا لاحقًا)، والطلبة يرسمون مخططًا لخطوات الفصل (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. السؤال 3 ص 57: اختر وعلّل: يوجه المعلم التنبؤ بأفضل طريقة لفصل: الفول السوداني والفاصوليا، الملح وفتات الخبز، البازلاء والدقيق، والطلبة يقترحون الطريقة ويعللون في ثنائيات ثم يعرضون (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. جدول المقارنة: يقود المعلم بناء جدول: الطريقة – المبدأ – مثال – متى لا تنجح، والطلبة يكملون الجدول في الدفتر (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد — زمن الحصة 40 دقيقة\n\n1. التخطيط: يطلب المعلم خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة، والطلبة يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. التنفيذ: يتابع المعلم السلامة والدقة ويحسب الوقت، والطلبة ينفذون الخطة ويسجلون نجاح كل خطوة (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. التقييم والتحسين: يدير المعلم مقارنة بين خطط المجموعات، والطلبة يقيّمون خطتهم ويقترحون تحسينًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. القمح والدقيق: يشرح المعلم باختصار فصل القشور عن الحبوب بالغربلة، والطلبة يربطون الفكرة بطرق الفصل (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. غلق الدرس – فصل حبوب السوق: تقترح المجموعات طرقًا لفصل مخلوط من حبوب ومواد صلبة يباع في السوق الشعبي، كالغربلة والانتقاء، وتعرض الطريقة الأنسب (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n3. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أفضل طريقة لفصل الفول السوداني عن الفاصوليا؟\n   الإجابة النموذجية: الفرز؛ لأن الحبات كبيرة يسهل التقاطها.\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الملح عن فتات الخبز؟\n   الإجابة النموذجية: الغربلة إذا كان الفتات أكبر من حبيبات الملح.\n3. [مستوى الاستدلال] متى لا ينجح الفرز في الفصل؟\n   الإجابة النموذجية: عندما تكون الجزيئات صغيرة جدًا أو متشابهة يصعب التقاطها.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n2. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n3. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة التي تفصل الملح عن الماء؟\n   الإجابة النموذجية: التبخير.\n2. [مستوى التطبيق] لماذا لا نستخدم المغناطيس لفصل الملح عن الرمل؟\n   الإجابة النموذجية: لأنهما ليسا مادتين مغناطيسيتين.\n3. [مستوى الاستدلال] رتب خطوات فصل الملح عن الرمل.\n   الإجابة النموذجية: إضافة الماء وتحريكه ليذوب الملح، فصل الرمل، ثم تبخير الماء ليبقى الملح.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nللطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\n\nالحصة 2: فصل المخاليط بالفرز والغربلة\nللطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n\nالحصة 3: الفصل بالمغناطيس (ورقة العمل 3-2)\nللطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n\nالحصة 4: مقارنة طرق الفصل والتنبؤ بأفضلها\nللطالب: حل تمرين 3-2 في كتاب النشاط ص 38 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في طرق فصل يستخدمها في المنزل.\n\nالحصة 5: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nللطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"id": "3-3", "title": "المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39، 75 | دليل المعلم ص 77–80", "n": 5, "per": [{"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58 | دليل المعلم ص 77–78", "num": "الحصة الأولى من 5", "focus": "ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان"}, "f": ["1. يعرّف المادة القا .\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.", "للطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | دليل المعلم ص 78–79", "num": "الحصة الثانية من 5", "focus": "استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟"}, "f": ["1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية (10 دقائق)\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته (15 دقيقة)\nمخرج تعليمي آخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته (15 دقيقة)", "1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية. ← تطبيق\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته. ← تحليل\nالمخرج الآخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته. ← تقييم", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: مخبار مدرج، كؤوس، ملعقة صغيرة، ملح، دقيق، رمل، بلورات برمنجنات البوتاسيوم، ملقط", "- المحلول\n- المخلوط الشفاف\n- المخلوط الضبابي\n- الملاحظة\n- الاستنتاج", "يعرض المعلم كأسين: ماء صافٍ مذاب فيه ملح، وماء ممزوج بالدقيق، ويسأل: في أي الكأسين ذابت المادة؟ كيف عرفت؟ (5 دقائق)", "1. السلامة: ينبه المعلم: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس، والطلبة يكررون قواعد السلامة (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. نشاط 3-3: التنفيذ: يوجه المعلم وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة و ب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.", "للطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39 | دليل المعلم ص 79–80", "num": "الحصة الخامسة من 5", "focus": "تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)"}, "f": ["1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها (5 دقائق)\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية (15 دقيقة)\nمخرج تعليمي آخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة (20 دقيقة)", "1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها. ← تحليل\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية. ← فهم\nالمخرج الآخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة. ← فهم", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ماء مذاب فيه سكر للعرض، تمرين 3-3", "- المادة الذائبة\n- التغير الفيزيائي\n- شفاف\n- ضبابي\n- مُعلّق", "يذيب المعلم ملعقة سكر في كوب ماء نظيف ويسأل: السكر اختفى، فهل ما زال موجودًا؟ كيف نتأكد؟ (يتذوق المعلم أو متطوع بأمان لأن السكر غذاء). (5 دقائق)", "1. الذوبان تغير فيزيائي: يشرح المعلم أن جزيئات السكر لم تتغير ولم تتفاعل مع الماء، ويمكن استعادتها بالتبخير، والطلبة يكتبون جملة: الذوبان تغير فيزيائي قابل للعكس (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. تمرين 3-3 في كتاب النشاط: يوجه المعلم حل التمرين (ص 39)، والطلبة يحلون فرديًا ويتحققون مع زميل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة الكلمات: يقرأ المعلم تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج، والطلبة يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – سكر في القهوة: تصنف الأزواج مواد من الضيافة العمانية إلى ذائبة كالسكر والزعفران وغير ذائبة كالبن المطحون، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "للطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}], "comb": ["الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة (15 دقيقة)\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول (10 دقائق)\nمخرج تعليمي آخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء (15 دقيقة)\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية (10 دقائق)\n2. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته (15 دقيقة)\nمخرج تعليمي آخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته (15 دقيقة)\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو) (15 دقيقة)\n2. يعرّف المخلوط المعلّق ويميزه من المحلول (10 دقائق)\nمخرج تعليمي آخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء (15 دقيقة)\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. يلاحظ خمسة مخاليط مختلفة ويصف كل منها ويرسمه (15 دقيقة)\n2. يصنف المخاليط إلى محاليل ومخاليط معلّقة (15 دقيقة)\nمخرج تعليمي آخر: يقارن بين المواد الطافية والمستقرة في القاع (10 دقائق)\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. يستدل على وجود المادة الذائبة في المحلول رغم عدم رؤيتها (5 دقائق)\n2. يستخدم مصطلحات الذوبان بدقة في جمل علمية (15 دقيقة)\nمخرج تعليمي آخر: يوضح أن الذوبان تغير فيزيائي لا تتكون فيه مادة جديدة (20 دقيقة)", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة. ← تذكر\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول. ← تطبيق\nالمخرج الآخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء. ← فهم\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n1. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية. ← تطبيق\n2. يقارن بين المخا : ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n- الكتاب\n- الأقلام\n- أخرى: مخاليط معدة: ملح وماء، مسحوق شراب بارد، برمنجنات وماء، فلفل وماء، طباشير أو تلك وماء؛ ورقة العمل 3-3\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n- الكتاب\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: ماء مذاب فيه سكر للعرض، تمرين 3-3", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n- الذوبان\n- قابل للذوبان\n- غير قابل للذوبان\n- الجزيئات\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\n- المحلول\n- المخلوط الشفاف\n- المخلوط الضبابي\n- الملاحظة\n- الاستنتاج\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n- المخلوط المعلّق\n- الترسب\n- الطفو\n- الاختبار العادل\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n- المحلول\n- المخلوط المعلّق\n- الطفو\n- الاستقرار في القاع\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n- المادة الذائبة\n- التغير الفيزيائي\n- شفاف\n- ضبابي\n- مُعلّق", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nيضيف المعلم ماءً ساخنًا إلى ملعقة من حبيبات القهوة أمام الطلبة ويسأل: أين ذهبت الحبيبات؟ هل اختفت؟ (5 دقائق)\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\nيعرض المعلم كأسين: ماء صافٍ مذاب فيه ملح، وماء ممزوج بالدقيق، ويسأل: في أي الكأسين ذابت المادة؟ كيف عرفت؟ (5 دقائق)\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nيعيد المعلم عرض كؤوس الاستقصاء بعد تركها، ويسأل: ماذا تغير في كأس الدقيق وكأس الرمل؟ (5 دقائق)\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nيرفع المعلم كأس فلفل مطحون في الماء ويسأل: هل ذاب الفلفل؟ لماذا بقي على السطح؟ (5 دقائق)\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nيذيب المعلم ملعقة سكر في كوب ماء نظيف ويسأل: السكر اختفى، فهل ما زال موجودًا؟ كيف نتأكد؟ (يتذوق المعلم أو متطوع بأمان لأن السكر غذاء). (5 دقائق)", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان — زمن الحصة 40 دقيقة\n\n1. مفهوم الذوبان: يشرح المعلم ص 58: السكر يذوب فهو قابل للذوبان، والرمل لا يذوب فهو غير قابل؛ والجزيئات الصغيرة تنتشر في الماء، والطلبة يكتبون التعريفين ويرسمون جزيئات تنتشر (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. عصف ذهني: ماذا يذوب؟: يطلب المعلم اقتراح مواد تذوب وأخرى لا تذوب ويدونها على السبورة، والطلبة يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. جدول التنبؤات: يرسم المعلم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم، والطلبة يملؤون عمود التنبؤ استعدادًا للاستقصاء (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟ — زمن الحصة 40 دقيقة\n\n1. السلامة: ينبه المعلم: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس، والطلبة يكررون قواعد السلامة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. نشاط 3-3: التنفيذ: يوجه المعلم وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها، والطلبة ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان (11 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. التسجيل والاستنتاج: يوجه المعلم إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ، والطلبة يكملون الجدول ويحددون صحة تنبؤاتهم (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟ — زمن الحصة 40 دقيقة\n\n1. الأسئلة 1–4 ص 59: يوجه المعلم: ماذا حدث في المخلوط الضبابي والشفاف؟ ولماذا بعد خمس دقائق؟ ولماذا الكميات المتساوية؟ والطلبة يجيبون كتابيًا ثم يتشاركون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. المخلوط المعلّق: يشرح المعلم: المواد غير الذائبة تبقى مرئية، وبعضها يستقر في القاع وبعضها يطفو؛ ويقارن بالمحلول، والطلبة يكملون جدول مقارنة: المحلول – المعلّق (الشفافية، الرؤية، الترسب) (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تحدّث عن: قطع السكر: يناقش المعلم لماذا تذوب قطع السكر أبطأ من الحبيبات، والطلبة يستنتجون أن الحبيبات الخارجية تذوب أولًا (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3) — زمن الحصة 40 دقيقة\n\n1. ورقة العمل 3-3: الملاحظة والرسم: يجهز المعلم المخاليط الخمسة (ملعقة صغيرة في 100 mL ماء) ويخبر بمكوناتها، والطلبة يحركون كل مخلوط ويلاحظونه ويرسمونه ويصفونه في الورقة (ص 75) (11 دقيقة)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. التصنيف وجدول الدعم: يوجه المعلم التصنيف ويقدم جدولًا للمتعثرين: هل تذوب؟ كيف يبدو؟ هل ترى المادة؟ هل تستقر أم تطفو؟ والطلبة يصنفون: الملح والشراب محلولان؛ الفلفل والتلك يطفوان؛ الطباشير يستقر (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n3. مراجعة جماعية: يعرض المعلم الإجابات ويصحح، والطلبة يصححون أعمالهم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3) — زمن الحصة 40 دقيقة\n\n1. الذوبان تغير فيزيائي: يشرح المعلم أن جزيئات السكر لم تتغير ولم تتفاعل مع الماء، ويمكن استعادتها بالتبخير، والطلبة يكتبون جملة: الذوبان تغير فيزيائي قابل للعكس (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. تمرين 3-3 في كتاب النشاط: يوجه المعلم حل التمرين (ص 39)، والطلبة يحلون فرديًا ويتحققون مع زميل (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. لعبة الكلمات: يقرأ المعلم تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج، والطلبة يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – سكر في القهوة: تصنف الأزواج مواد من الضيافة العمانية إلى ذائبة كالسكر والزعفران وغير ذائبة كالبن المطحون، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n2. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n3. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث للرمل بعد ترك المخلوط خمس دقائق؟\n   الإجابة النموذجية: استقر في قاع الكأس.\n2. [مستوى التطبيق] ما المخلوط المعلّق؟\n   الإجابة النموذجية: مخلوط من مادة صلبة غير قابلة للذوبان في سائل تبقى فيه مرئية.\n3. [مستوى الاستدلال] لماذا يجب استخدام الكمية نفسها من الماء والمادة الصلبة في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة صحيحة بين المواد.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n2. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n3. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] هل يمكنك رؤية المادة الصلبة في المحلول؟\n   الإجابة النموذجية: لا؛ لأنها ذابت تمامًا.\n2. [مستوى التطبيق] اذكر مادة تطفو على سطح الماء دون أن تذوب.\n   الإجابة النموذجية: الفلفل المطحون أو بودرة التلك.\n3. [مستوى الاستدلال] لماذا تذوب قطعة السكر أبطأ من الحبيبات؟\n   الإجابة النموذجية: لأن الحبيبات الداخلية لا تتصل بالماء حتى تذوب الخارجية أولًا.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nللطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\n\nالحصة 2: استقصاء الذوبان (نشاط 3-3): شفاف أم ضبابي؟\nللطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n\nالحصة 3: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nللطالب: كتابة جدول المقارنة بين المحلول والمخلوط المعلّق في الدفتر. لولي الأمر: يُرجى ملاحظة عصير البرتقال الطازج مع الابن بعد تركه قليلًا.\n\nالحصة 4: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nللطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n\nالحصة 5: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nللطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"id": "3-4", "title": "فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60–61 | كتاب النشاط ص 40 | دليل المعلم ص 80–82", "n": 2, "per": [{"h": {"lesson": "3-4 فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60 | دليل المعلم ص 80–82", "num": "الحصة الأولى من 2", "focus": "ما الترشيح؟ المرشحات في الحياة والطبيعة"}, "f": ["1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل (5 دقائق)\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة (15 دقيقة)\nمخرج تعليمي آخر: يناقش هل الماء المرشّح بالرمل صالح للشرب (20 دقيقة)", "1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل. ← تذكر\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة. ← فهم\nالمخرج الآخر: يناقش هل الماء المرشّح بالرمل صالح للشرب. ← تقييم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: كمامة، ورقة ترشيح القهوة، نموذج مرشح رملي: حصى ورمل خشن ورمل ناعم", "- الترشيح\n- المرشح\n- ورقة الترشيح\n- المرشح الرملي\n- الأراضي الرطبة", "يعرض المعلم كمامة طبية ويسأل: لماذا يرتدي الطبيب الكمامة؟ ماذا تحجز؟ وماذا تسمح بمروره؟ (5 دقائق)", "1. المرشح مثل الغربال: يشرح المعلم ص 60: ثقوب دقيقة تسمح بمرور السائل والجزيئات الصغيرة جدًا وتمنع الكبيرة؛ مثال القهوة، والطلبة يرسمون ورقة ترشيح بثقوب ويوضحون ما يمر وما يُحجز (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. المرشح الرملي: يعرض المعلم نموذجًا: الحصى يحجز الكبيرة، الرمل الخشن الأصغر، الرمل الناعم الدقيقة؛ ويذكر الأراضي الرطبة والفلامنجو، والطلبة يلاحظون الماء العكر يصبح أصفى (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. هل هو صالح للشرب؟: يناقش المعلم: الرمل لا يحجز الجراثيم، لذا يُغلى الماء أو يُعقم، والطلبة يكتبون خطوتين لجعل الماء آمنًا للشرب (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الترشيح؟\n   الإجابة النموذجية: طريقة لفصل المخاليط المكونة من مادة صلبة غير قابلة للذوبان ومادة سائلة.\n2. [مستوى التطبيق] ماذا تحجز ورقة الترشيح في وعاء القهوة؟\n   الإجابة النموذجية: حبيبات القهوة الصلبة.\n3. [مستوى الاستدلال] لماذا لا يكون الماء المرشّح بالرمل آمنًا للشرب دائمًا؟\n   الإجابة النموذجية: لأن الرمل لا يستطيع حجز الجراثيم الصغيرة جدًا.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الذي يمر عبر ثقوب المرشح؟\n   الإجابة النموذجية: السائل والمواد الذائبة فيه والجزيئات الصغيرة جدًا.\n2. [مستوى التطبيق] كيف يُرشح طائر الفلامنجو طعامه؟\n   الإجابة النموذجية: بمرشحات في منقاره تلتقط الطحالب والأسماك الصغيرة من الماء.\n3. [مستوى الاستدلال] كيف نجعل الماء آمنًا للشرب بعد ترشيحه؟\n   الإجابة النموذجية: بغليه أو معالجته بمادة معقمة.", "للطالب: قراءة كتاب الطالب ص 60 والبحث عن مرشح في المنزل (مصفاة الشاي، فلتر الماء). لولي الأمر: يُرجى مناقشة الابن في طرق تنقية ماء الشرب في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=22"]}, {"h": {"lesson": "3-4 فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 61 | كتاب النشاط ص 40 | دليل المعلم ص 81–82", "num": "الحصة الثانية من 2", "focus": "فصل المخاليط بالترشيح (نشاط 3-4)"}, "f": ["1. يجهز ورقة ترشيح ويستخدم القمع لفصل الطباشير والدقيق عن الماء (15 دقيقة)\n2. يفسر لماذا لا يفصل الترشيح المواد الذائبة (10 دقائق)\nمخرج تعليمي آخر: يتنبأ بنتيجة ترشيح مخلوط ويعلل تنبؤه (15 دقيقة)", "1. يجهز ورقة ترشيح ويستخدم القمع لفصل الطباشير والدقيق عن الماء. ← تطبيق\n2. يفسر لماذا لا يفصل الترشيح المواد الذائبة. ← تحليل\nالمخرج الآخر: يتنبأ بنتيجة ترشيح مخلوط ويعلل تنبؤه. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالنمذجة", "- الكتاب\n- أخرى: ورق ترشيح، قمع، كؤوس، مخبار مدرج، طباشير مسحوق، دقيق، ملح، ماء، أكياس شاي", "- ورقة الترشيح\n- قمع الترشيح\n- الراشح\n- المواد الذائبة\n- التبخير", "يرفع المعلم كيس شاي ويسأل (تحدّث عن): كيف يترك كيس الشاي لونه ونكهته في الماء بينما يحتجز أوراقه؟ (5 دقائق)", "1. طي ورقة الترشيح: يعرض المعلم خطوات الطي: نصفان ثم نصفان، فتح المخروط، ترطيب الورقة ووضعها في القمع، والطلبة يطوون الورقة ويجهزون القمع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. نشاط 3-4: الترشيح: يوجه المعلم خلط ملعقة صغيرة من الطباشير في 100 mL ماء وت لماء المرشّح بالرمل آمنًا للشرب دائمًا؟\n   الإجابة النموذجية: لأن الرمل لا يستطيع حجز الجراثيم الصغيرة جدًا.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الذي مر عبر ورقة الترشيح إلى الكأس؟\n   الإجابة النموذجية: الماء.\n2. [مستوى التطبيق] لماذا بقي الطباشير على ورقة الترشيح؟\n   الإجابة النموذجية: لأن جزيئاته أكبر من ثقوب الورقة ولا يذوب في الماء.\n3. [مستوى الاستدلال] تنبأ: هل يمكن فصل الملح عن الماء بالترشيح؟ علّل.\n   الإجابة النموذجية: لا؛ لأن الملح ذائب وجزيئاته صغيرة جدًا تمر عبر ثقوب الورقة.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الذي يمر عبر ثقوب المرشح؟\n   الإجابة النموذجية: السائل والمواد الذائبة فيه والجزيئات الصغيرة جدًا.\n2. [مستوى التطبيق] كيف يُرشح طائر الفلامنجو طعامه؟\n   الإجابة النموذجية: بمرشحات في منقاره تلتقط الطحالب والأسماك الصغيرة من الماء.\n3. [مستوى الاستدلال] كيف نجعل الماء آمنًا للشرب بعد ترشيحه؟\n   الإجابة النموذجية: بغليه أو معالجته بمادة معقمة.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نرطب ورقة الترشيح قبل وضعها في القمع؟\n   الإجابة النموذجية: لتلتصق بالقمع وتُسرّع عملية الترشيح.\n2. [مستوى التطبيق] ما الطريقة المناسبة لفصل الملح الذائب عن الماء؟\n   الإجابة النموذجية: التبخير.\n3. [مستوى الاستدلال] صف خطوات فصل مخلوط من الرمل والملح والماء.\n   الإجابة النموذجية: نرشح المخلوط ليبقى الرمل على الورقة، ثم نبخر الراشح فيبقى الملح.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nللطالب: قراءة كتاب الطالب ص 60 والبحث عن مرشح في المنزل (مصفاة الشاي، فلتر الماء). لولي الأمر: يُرجى مناقشة الابن في طرق تنقية ماء الشرب في المنزل.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nللطالب: حل تمرين 3-4 في كتاب النشاط ص 40 واجبًا منزليًا ومراجعة ص 60–61. لولي الأمر: يُرجى مساعدة الابن في تجربة ترشيح ماء مع تراب بمنديل ورقي في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=22"]}, {"id": "3-5", "title": "المحاليل",
