على السبورة.\n   الطالب: يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق.\n4) جدول التنبؤات (3 دقائق: 7–10)\n   المعلم: يرسم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم.\n   الطالب: يملؤون عمود التنبؤ استعدادًا للاستقصاء.\n5) الختام والتقويم (1 دقيقة: 10–11)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) السلامة (1 دقيقة: 21–22)\n   المعلم: ينبه: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس.\n   الطالب: يكررون قواعد السلامة.\n8) نشاط 3-3: التنفيذ (4 دقائق: 22–26)\n   المعلم: يوجه وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها.\n   الطالب: ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان.\n9) التسجيل والاستنتاج (3 دقائق: 26–29)\n   المعلم: يوجه إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ.\n   الطالب: يكملون الجدول ويحددون صحة تنبؤاتهم.\n10) الختام والتقويم (1 دقيقة: 29–30)\n   المعلم: يطرح التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1) التهيئة: بعد خمس دقائق (3 دقائق: 0–3)\n   المعلم: يعرض الكؤوس ويطرح السؤال.\n   الطالب: يلاحظون ترسب الرمل والدقيق في القاع.\n2) الأسئلة 1–4 ص 59 (5 دقائق: 3–8)\n   المعلم: يوجه: ماذا حدث في المخلوط الضبابي والشفاف؟ ولماذا بعد خمس دقائق؟ ولماذا الكميات المتساوية؟\n   الطالب: يجيبون كتابيًا ثم يتشاركون.\n3) المخلوط المعلّق (5 دقائق: 8–13)\n   المعلم: يشرح: المواد غير الذائبة تبقى مرئية، وبعضها يستقر في القاع وبعضها يطفو؛ ويقارن بالمحلول.\n   الطالب: يكملون جدول مقارنة: المحلول – المعلّق (الشفافية، الرؤية، الترسب).\n4) تحدّث عن: قطع السكر (5 دقائق: 13–18)\n   المعلم: يناقش لماذا تذوب قطع السكر أبطأ من الحبيبات.\n   الطالب: يستنتجون أن الحبيبات الخارجية تذوب أولًا.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1) التهيئة: الفلفل العائم (2 دقيقتان: 0–2)\n   المعلم: يطرح السؤال.\n   الطالب: يصفون ويتوقعون.\n2) ورقة العمل 3-3: الملاحظة والرسم (8 دقائق: 2–10)\n   المعلم: يجهز المخاليط الخمسة (ملعقة صغيرة في 100 mL ماء) ويخبر بمكوناتها.\n   الطالب: يحركون كل مخلوط ويلاحظونه ويرسمونه ويصفونه في الورقة (ص 75).\n3) التصنيف وجدول الدعم (5 دقائق: 10–15)\n   المعلم: يوجه التصنيف ويقدم جدولًا للمتعثرين: هل تذوب؟ كيف يبدو؟ هل ترى المادة؟ هل تستقر أم تطفو؟\n   الطالب: يصنفون: الملح والشراب محلولان؛ الفلفل والتلك يطفوان؛ الطباشير يستقر.\n4) مراجعة جماعية (3 دقائق: 15–18)\n   المعلم: يعرض الإجابات ويصحح.\n   الطالب: يصححون أعمالهم.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1) التهيئة: السكر الخفي (3 دقائق: 0–3)\n   المعلم: ينفذ العرض ويؤكد قاعدة: لا نتذوق إلا ما هو آمن وبإذن المعلم.\n   الطالب: يستنتجون أن الطعم الحلو دليل على وجود السكر.\n2) الذوبان تغير فيزيائي (4 دقائق: 3–7)\n   المعلم: يشرح أن جزيئات السكر لم تتغير ولم تتفاعل مع الماء، ويمكن استعادتها بالتبخير.\n   الطالب: يكتبون جملة: الذوبان تغير فيزيائي قابل للعكس.\n3) تمرين 3-3 في كتاب النشاط (6 دقائق: 7–13)\n   المعلم: يوجه حل التمرين (ص 39).\n   الطالب: يحلون فرديًا ويتحققون مع زميل.\n4) لعبة الكلمات (5 دقائق: 13–18)\n   المعلم: يقرأ تعريفات: قابل للذوبان، غير قابل، معلّق، يذوب، شفاف، ضبابي، استنتاج.\n   الطالب: يكتبون الكلمة المناسبة ويصححون ذاتيًا من عشر درجات.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.\n\n4. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n5. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n6. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. [مستوى المعرفة] ماذا حدث للرمل بعد ترك المخلوط خمس دقائق؟\n   الإجابة النموذجية: استقر في قاع الكأس.\n2. [مستوى التطبيق] ما المخلوط المعلّق؟\n   الإجابة النموذجية: مخلوط من مادة صلبة غير قابلة للذوبان في سائل تبقى فيه مرئية.\n3. [مستوى الاستدلال] لماذا يجب استخدام الكمية نفسها من الماء والمادة الصلبة في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا وتكون المقارنة صحيحة بين المواد.\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. [مستوى المعرفة] هل مسحوق الشراب البارد قابل للذوبان؟\n   الإجابة النموذجية: نعم، يذوب ويكوّن محلولًا.\n2. [مستوى التطبيق] أين يستقر الطباشير في الماء؟\n   الإجابة النموذجية: في قاع الكأس.\n3. [مستوى الاستدلال] لماذا يُعد مخلوط الفلفل والماء مخلوطًا معلّقًا؟\n   الإجابة النموذجية: لأن الفلفل لا يذوب ويبقى مرئيًا طافيًا على السطح.\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. [مستوى المعرفة] ما الدليل على وجود السكر في الماء رغم عدم رؤيته؟\n   الإجابة النموذجية: طعم الماء الحلو.\n2. [مستوى التطبيق] هل يتكون عند ذوبان السكر مادة جديدة؟\n   الإجابة النموذجية: لا؛ يبقى السكر سكرًا لكنه تفتت إلى جزيئات صغيرة جدًا.\n3. [مستوى الاستدلال] كيف تستعيد السكر من محلوله؟\n   الإجابة النموذجية: بتبخير الماء فيبقى السكر.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\n1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.\n\n4. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n5. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n6. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\n1. [مستوى المعرفة] هل يمكنك رؤية المادة الصلبة في المحلول؟\n   الإجابة النموذجية: لا؛ لأنها ذابت تمامًا.\n2. [مستوى التطبيق] اذكر مادة تطفو على سطح الماء دون أن تذوب.\n   الإجابة النموذجية: الفلفل المطحون أو بودرة التلك.\n3. [مستوى الاستدلال] لماذا تذوب قطعة السكر أبطأ من الحبيبات؟\n   الإجابة النموذجية: لأن الحبيبات الداخلية لا تتصل بالماء حتى تذوب الخارجية أولًا.\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\n1. [مستوى المعرفة] صنف: الملح في الماء.\n   الإجابة النموذجية: محلول.\n2. [مستوى التطبيق] اذكر مخلوطين معلّقين من ورقة العمل.\n   الإجابة النموذجية: الفلفل والماء، الطباشير أو التلك والماء.\n3. [مستوى الاستدلال] اقترح طريقة لفصل الطباشير عن الماء.\n   الإجابة النموذجية: الترشيح أو ترك الطباشير يترسب ثم سكب الماء بحذر.\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\n1. [مستوى المعرفة] ما معنى «ضبابي»؟\n   الإجابة النموذجية: مخلوط غير صافٍ لا يمكن الرؤية من خلاله بوضوح.\n2. [مستوى التطبيق] لماذا لا نرى المادة الصلبة بعد ذوبانها؟\n   الإجابة النموذجية: لأنها تتحلل إلى جزيئات صغيرة جدًا لا تُرى بالعين المجردة.\n3. [مستوى الاستدلال] لماذا يجب ألا نتذوق محلول برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها مادة ضارة؛ والتذوق في المختبر غير آمن إلا للمواد الغذائية وبإذن المعلم.", "الحصة 1: ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان\nللطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\nللطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21\n\nالحصة 2: المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟\nللطالب: كتابة جدول المقارنة بين المحلول والمخلوط المعلّق في الدفتر. لولي الأمر: يُرجى ملاحظة عصير البرتقال الطازج مع الابن بعد تركه قليلًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21\n\nالحصة 3: ملاحظة المخاليط ورسمها (ورقة العمل 3-3)\nللطالب: إكمال رسوم ورقة العمل 3-3 (كتاب النشاط ص 75). لولي الأمر: يُرجى سؤال الابن عن الفرق بين المحلول والمخلوط المعلّق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21\n\nالحصة 4: تطبيق ومراجعة: المادة الذائبة ما زالت موجودة (تمرين 3-3)\nللطالب: حل تمرين 3-3 في كتاب النشاط ص 39 إن لم يكتمل، ومراجعة ص 58–59. لولي الأمر: يُرجى مراجعة مصطلحات الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"id": "3-4", "title": "فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60–61 | كتاب النشاط ص 40 | دليل المعلم ص 80–82", "n": 2, "per": [{"h": {"lesson": "3-4 فصل المواد غير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 60 | دليل المعلم ص 80–82", "num": "الحصة الأولى من 2", "focus": "ما الترشيح؟ المرشحات في الحياة والطبيعة"}, "f": ["1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل.\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة.\nمخرج تعليمي آخر: يناقش هل الماء المرشّح بالرمل صالح للشرب.", "1. يعرّف الترشيح بأنه طريقة لفصل مادة صلبة غير قابلة للذوبان عن سائل. ← تذكر\n2. يوضح كيف يعمل المرشح مثل الغربال بثقوب دقيقة. ← فهم\nالمخرج الآخر: يناقش هل الماء المرشّح بالرمل صالح للشرب. ← تقييم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: كمامة، ورقة ترشيح القهوة، نموذج مرشح رملي: حصى ورمل خشن ورمل ناعم", "- الترشيح\n- المرشح\n- ورقة الترشيح\n- المرشح الرملي\n- الأراضي الرطبة", "يعرض المعلم كمامة طبية ويسأل: لماذا يرتدي الطبيب الكمامة؟ ماذا تحجز؟ وماذا تسمح بمروره؟", "1) التهيئة: الكمامة (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقدم مفهوم الترشيح.\n   الطالب: يستنتجون أنها تحجز الجراثيم وتسمح بمرور الهواء.\n2) المرشح مثل الغربال (10 دقائق: 5–15)\n   المعلم: يشرح ص 60: ثقوب دقيقة تسمح بمرور السائل والجزيئات الصغيرة جدًا وتمنع الكبيرة؛ مثال القهوة.\n   الطالب: يرسمون ورقة ترشيح بثقوب ويوضحون ما يمر وما يُحجز.\n3) المرشح الرملي (10 دقائق: 15–25)\n   المعلم: يعرض نموذجًا: الحصى يحجز الكبيرة، الرمل الخشن الأصغر، الرمل الناعم الدقيقة؛ ويذكر الأراضي الرطبة والفلامنجو.\n   الطالب: يلاحظون الماء العكر يصبح أصفى.\n4) هل هو صالح للشرب؟ (10 دقائق: 25–35)\n   المعلم: يناقش: الرمل لا يحجز الجراثيم، لذا يُغلى الماء أو يُعقم.\n   الطالب: يكتبون خطوتين لجعل الماء آمنًا للشرب.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الترشيح؟\n   الإجابة النموذجية: طريقة لفصل المخاليط المكونة من مادة صلبة غير قابلة للذوبان ومادة سائلة.\n2. [مستوى التطبيق] ماذا تحجز ورقة الترشيح في وعاء القهوة؟\n   الإجابة النموذجية: حبيبات القهوة الصلبة.\n3. [مستوى الاستدلال] لماذا لا يكون الماء المرشّح بالرمل آمنًا للشرب دائمًا؟\n   الإجابة النموذجية: لأن الرمل لا يستطيع حجز الجراثيم الصغيرة جدًا.", "1. [مستوى المعرفة] ما الذي يمر عبر ثقوب المرشح؟\n   الإجابة النموذجية: السائل والمواد الذائبة فيه والجزيئات الصغيرة جدًا.\n2. [مستوى التطبيق] كيف يُرشح طائر الفلامنجو طعامه؟\n   الإجابة النموذجية: لشرب؟ (10 دقائق: 25–35)\n   المعلم: يناقش: الرمل لا يحجز الجراثيم، لذا يُغلى الماء أو يُعقم.\n   الطالب: يكتبون خطوتين لجعل الماء آمنًا للشرب.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n1) التهيئة: كيس الشاي (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويربطه بالترشيح.\n   الطالب: يفسرون: الأوراق كبيرة والمواد الذائبة تمر.\n2) طي ورقة الترشيح (6 دقائق: 5–11)\n   المعلم: يعرض خطوات الطي: نصفان ثم نصفان، فتح المخروط، ترطيب الورقة ووضعها في القمع.\n   الطالب: يطوون الورقة ويجهزون القمع.\n3) نشاط 3-4: الترشيح (14 دقائق: 11–25)\n   المعلم: يوجه خلط ملعقة صغيرة من الطباشير في 100 mL ماء وترشيحه، ثم الدقيق.\n   الطالب: يرشحون ويلاحظون: يمر الماء صافيًا ويبقى الطباشير على الورقة.\n4) الأسئلة 1–4 ص 61 وتمرين 3-4 (10 دقائق: 25–35)\n   المعلم: يناقش: ماذا مر؟ ماذا بقي؟ هل يفصل الترشيح الملح عن الماء؟ ويوجه تمرين 3-4 (ص 40) عن تنقية الماء.\n   الطالب: يجيبون ويستنتجون أن المواد الذائبة تمر عبر الورقة وتحتاج للتبخير.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\n1. [مستوى المعرفة] ما الترشيح؟\n   الإجابة النموذجية: طريقة لفصل المخاليط المكونة من مادة صلبة غير قابلة للذوبان ومادة سائلة.\n2. [مستوى التطبيق] ماذا تحجز ورقة الترشيح في وعاء القهوة؟\n   الإجابة النموذجية: حبيبات القهوة الصلبة.\n3. [مستوى الاستدلال] لماذا لا يكون الماء المرشّح بالرمل آمنًا للشرب دائمًا؟\n   الإجابة النموذجية: لأن الرمل لا يستطيع حجز الجراثيم الصغيرة جدًا.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n1. [مستوى المعرفة] ما الذي مر عبر ورقة الترشيح إلى الكأس؟\n   الإجابة النموذجية: الماء.\n2. [مستوى التطبيق] لماذا بقي الطباشير على ورقة الترشيح؟\n   الإجابة النموذجية: لأن جزيئاته أكبر من ثقوب الورقة ولا يذوب في الماء.\n3. [مستوى الاستدلال] تنبأ: هل يمكن فصل الملح عن الماء بالترشيح؟ علّل.\n   الإجابة النموذجية: لا؛ لأن الملح ذائب وجزيئاته صغيرة جدًا تمر عبر ثقوب الورقة.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\n1. [مستوى المعرفة] ما الذي يمر عبر ثقوب المرشح؟\n   الإجابة النموذجية: السائل والمواد الذائبة فيه والجزيئات الصغيرة جدًا.\n2. [مستوى التطبيق] كيف يُرشح طائر الفلامنجو طعامه؟\n   الإجابة النموذجية: بمرشحات في منقاره تلتقط الطحالب والأسماك الصغيرة من الماء.\n3. [مستوى الاستدلال] كيف نجعل الماء آمنًا للشرب بعد ترشيحه؟\n   الإجابة النموذجية: بغليه أو معالجته بمادة معقمة.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n1. [مستوى المعرفة] لماذا نرطب ورقة الترشيح قبل وضعها في القمع؟\n   الإجابة النموذجية: لتلتصق بالقمع وتُسرّع عملية الترشيح.\n2. [مستوى التطبيق] ما الطريقة المناسبة لفصل الملح الذائب عن الماء؟\n   الإجابة النموذجية: التبخير.\n3. [مستوى الاستدلال] صف خطوات فصل مخلوط من الرمل والملح والماء.\n   الإجابة النموذجية: نرشح المخلوط ليبقى الرمل على الورقة، ثم نبخر الراشح فيبقى الملح.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nللطالب: قراءة كتاب الطالب ص 60 والبحث عن مرشح في المنزل (مصفاة الشاي، فلتر الماء). لولي الأمر: يُرجى مناقشة الابن في طرق تنقية ماء الشرب في المنزل.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nللطالب: حل تمرين 3-4 في كتاب النشاط ص 40 واجبًا منزليًا ومراجعة ص 60–61. لولي الأمر: يُرجى مساعدة الابن في تجربة ترشيح ماء مع تراب بمنديل ورقي في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=22"]}, {"id": "3-5", "title": "المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62–63 | كتاب النشاط ص 41، 76–78 | دليل المعلم ص 82–86", "n": 2, "per": [{"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62 | دليل المعلم ص 82–84", "num": "الحصة الأولى من 3", "focus": "المحلول: المادة المذابة والمادة المذيبة"}, "f": ["1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة.\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا.\n3. يميز بين المخلوط والمادة النقية بأمثلة.\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات.\n\nمخرج تعليمي آخر:\nيمثل تكوّن المحلول بنموذج الجزيئات.\nيحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل.", "1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة. ← فهم\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا. ← تطبيق\n3. يميز بين المخلوط والمادة النقية بأمثلة. ← فهم\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات. ← تحليل\nالمخرج الآخر: يمثل تكوّن المحلول بنموذج الجزيئات. ← تطبيق\nالمخرج الآخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل. ← تقييم", "- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف، ورقة العمل 3-5أ، عصير برتقال طازج", "- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات\n- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء", "يعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟", "1) التهيئة: ماء البحر (1 دقيقة: 0–1)\n   المعلم: يطرح السؤال ويقود إلى أن ماء البحر محلول.\n   الطالب: يجيبون: الطعم المالح، الملح المتبقي بعد التبخر.\n2) المذاب والمذيب (3 دقائق: 1–4)\n   المعلم: يشرح ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب.\n   الطالب: يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء.\n3) نشاط 3-5: تحضير محلول (4 دقائق: 4–8)\n   المعلم: يوجه وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق.\n   الطالب: يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب.\n4) المحلول المتجانس (2 دقيقتان: 8–10)\n   المعلم: يقدم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه.\n   الطالب: يصفون محلولهم باستخدام المصطلح.\n5) الختام والتقويم (1 دقيقة: 10–11)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) المواد النقية والمخاليط (3 دقائق: 21–24)\n   المعلم: يشرح ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط.\n   الطالب: يصنفون أمثلة في جدول.\n8) الأسئلة 1–5 ص 63: خطة استقصاء (3 دقائق: 24–27)\n   المعلم: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟\n   الطالب: يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى.\n9) ورقة العمل 3-5أ وتحدّث عن (2 دقيقتان: 27–29)\n   المعلم: يوجه بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال.\n   الطالب: يجيبون ويستنتجون أن العصير مخلوط.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.\n\n4. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n5. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n6. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.", "1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.\n\n4. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n5. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n6. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.", "للطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\nللطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62–63 | كتاب النشاط ص 41، 78 | دليل المعلم ص 84–86", "num": "الحصة الثالثة من 3", "focus": "كم من السكر يذوب في الشاي؟ المحلول المشبع"}, "f": ["1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي.\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي.\n\nمخرج تعليمي آخر: يعرّف المحلول المشبع.", "1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "يسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟", "1) التهيئة: سكر بلا نهاية؟ (3 دقائق: 0–3)\n   المعلم: يطرح السؤال ويطلب تنبؤًا رقميًا.\n   الطالب: يسجلون تنبؤاتهم في ورقة العمل 3-5ب.\n2) السلامة (3 دقائق: 3–6)\n   المعلم: ينبه: المعلم وحده يصب الماء الساخن.\n   الطالب: يكررون القاعدة.\n3) ورقة العمل 3-5ب: الاستقصاء (7 دقائق: 6–13)\n   المعلم: يصب 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب.\n   الطالب: يعدّون الملاعق ويزنون السكر ويسجلون.\n4) المحلول المشبع والتنبؤ (5 دقائق: 13–18)\n   المعلم: يعرّف المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب.\n   الطالب: يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "للطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}], "comb": ["الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة.\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا.\n3. يميز بين المخلوط والمادة النقية بأمثلة.\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات.\n\nمخرج تعليمي آخر:\nيمثل تكوّن المحلول بنموذج الجزيئات.\nيحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل.\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي.\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي.\n\nمخرج تعليمي آخر: يعرّف المحلول المشبع.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة. ← فهم\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا. ← تطبيق\n3. يميز بين المخلوط والمادة النقية بأمثلة. ← فهم\n4. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات. ← تحليل\nالمخرج الآخر: يمثل تكوّن المحلول بنموذج الجزيئات. ← تطبيق\nالمخرج الآخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل. ← تقييم\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف، ورقة العمل 3-5أ، عصير برتقال طازج\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات\n- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nيعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\nيسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1) التهيئة: ماء البحر (1 دقيقة: 0–1)\n   المعلم: يطرح السؤال ويقود إلى أن ماء البحر محلول.\n   الطالب: يجيبون: الطعم المالح، الملح المتبقي بعد التبخر.\n2) المذاب والمذيب (3 دقائق: 1–4)\n   المعلم: يشرح ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب.\n   الطالب: يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء.\n3) نشاط 3-5: تحضير محلول (4 دقائق: 4–8)\n   المعلم: يوجه وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق.\n   الطالب: يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب.\n4) المحلول المتجانس (2 دقيقتان: 8–10)\n   المعلم: يقدم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه.\n   الطالب: يصفون محلولهم باستخدام المصطلح.\n5) الختام والتقويم (1 دقيقة: 10–11)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 10 دقائق)\n7) المواد النقية والمخاليط (3 دقائق: 21–24)\n   المعلم: يشرح ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط.\n   الطالب: يصنفون أمثلة في جدول.\n8) الأسئلة 1–5 ص 63: خطة استقصاء (3 دقائق: 24–27)\n   المعلم: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟\n   الطالب: يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى.\n9) ورقة العمل 3-5أ وتحدّث عن (2 دقيقتان: 27–29)\n   المعلم: يوجه بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال.\n   الطالب: يجيبون ويستنتجون أن العصير مخلوط.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1) التهيئة: سكر بلا نهاية؟ (3 دقائق: 0–3)\n   المعلم: يطرح السؤال ويطلب تنبؤًا رقميًا.\n   الطالب: يسجلون تنبؤاتهم في ورقة العمل 3-5ب.\n2) السلامة (3 دقائق: 3–6)\n   المعلم: ينبه: المعلم وحده يصب الماء الساخن.\n   الطالب: يكررون القاعدة.\n3) ورقة العمل 3-5ب: الاستقصاء (7 دقائق: 6–13)\n   المعلم: يصب 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب.\n   الطالب: يعدّون الملاعق ويزنون السكر ويسجلون.\n4) المحلول المشبع والتنبؤ (5 دقائق: 13–18)\n   المعلم: يعرّف المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب.\n   الطالب: يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.\n\n4. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n5. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n6. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.\n\n4. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n5. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n6. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nللطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\nللطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23\n\nالحصة 2: كم من السكر يذوب في الشاي؟ المحلول المشبع\nللطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"id": "3-6", "title": "كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 86–90", "n": 2, "per": [{"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64 | دليل المعلم ص 86–88", "num": "الحصة الأولى من 3", "focus": "التحريك يزيد سرعة الذوبان"}, "f": ["1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع.\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع.\n3. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل.\n4. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات.\n\nمخرج تعليمي آخر:\nيحدد ما إذا كان اختبار التحريك اختبارًا عادلًا.\nيستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة.", "1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\n3. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n4. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم", "- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة، سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف\n- السبورة التقليدية", "- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات\n- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج", "يعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟", "1) التهيئة: شاي محمد (1 دقيقة: 0–1)\n   المعلم: يطرح الأسئلة.\n   الطالب: يقترحون التحريك.\n2) تجربة عرض: كأسان (3 دقائق: 1–4)\n   المعلم: يصب الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط.\n   الطالب: يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت.\n3) التفسير بالجزيئات (3 دقائق: 4–7)\n   المعلم: يشرح ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع.\n   الطالب: يرسمون نموذجين: دون تحريك ومع تحريك.\n4) هل كان الاختبار عادلًا؟ (2 دقيقتان: 7–9)\n   المعلم: يسأل عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة.\n   الطالب: يكتبون الثوابت ويستنتجون.\n5) الختام والتقويم (1 دقيقة: 9–10)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 11 دقيقة)\n7) السلامة والأدوات (1 دقيقة: 21–22)\n   المعلم: يؤكد استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم.\n   الطالب: يتعرفون على قراءة مقياس الحرارة.\n8) نشاط 3-6 (4 دقائق: 22–26)\n   المعلم: يوجه وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ.\n   الطالب: يقيسون الزمن ويسجلون في جدول.\n9) الأسئلة 1–3 ص 65 (3 دقائق: 26–29)\n   المعلم: يناقش: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات.\n   الطالب: يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.\n\n4. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n5. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n6. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.", "1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.\n\n4. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n5. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n6. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.", "للطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\nللطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 88–89", "num": "الحصة الثالثة من 3", "focus": "تفسير الرسوم البيانية للذوبان والعوامل المؤثرة"}, "f": ["1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة.\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج.\n\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب.", "1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "يعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: قاف\n- السبورة التقليدية\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "الحصة 1: التحريك يزيد سرعة الذوبان\n- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات\n- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "الحصة 1: التحريك يزيد سرعة الذوبان\nيعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nيعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟", "الحصة 1: التحريك يزيد سرعة الذوبان\n1) التهيئة: شاي محمد (1 دقيقة: 0–1)\n   المعلم: يطرح الأسئلة.\n   الطالب: يقترحون التحريك.\n2) تجربة عرض: كأسان (3 دقائق: 1–4)\n   المعلم: يصب الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط.\n   الطالب: يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت.\n3) التفسير بالجزيئات (3 دقائق: 4–7)\n   المعلم: يشرح ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع.\n   الطالب: يرسمون نموذجين: دون تحريك ومع تحريك.\n4) هل كان الاختبار عادلًا؟ (2 دقيقتان: 7–9)\n   المعلم: يسأل عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة.\n   الطالب: يكتبون الثوابت ويستنتجون.\n5) الختام والتقويم (1 دقيقة: 9–10)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 11 دقيقة)\n7) السلامة والأدوات (1 دقيقة: 21–22)\n   المعلم: يؤكد استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم.\n   الطالب: يتعرفون على قراءة مقياس الحرارة.\n8) نشاط 3-6 (4 دقائق: 22–26)\n   المعلم: يوجه وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ.\n   الطالب: يقيسون الزمن ويسجلون في جدول.\n9) الأسئلة 1–3 ص 65 (3 دقائق: 26–29)\n   المعلم: يناقش: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات.\n   الطالب: يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1) التهيئة: رسم بلا عنوان (3 دقائق: 0–3)\n   المعلم: يعرض الرسم ويناقش عناصر التمثيل البياني.\n   الطالب: يذكرون: العنوان، أسماء المحاور، الوحدات.\n2) أوراق العمل حسب المستوى (7 دقائق: 3–10)\n   المعلم: يوزع 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم.\n   الطالب: يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع.\n3) تمرين 3-6 (4 دقائق: 10–14)\n   المعلم: يوجه تمرين 3-6 (ص 42) عن العوامل والاختبار العادل لدعم المتعثرين.\n   الطالب: يحلون فرديًا.\n4) تصحيح مفهوم (4 دقائق: 14–18)\n   المعلم: يوضح الفرق بين سرعة الذوبان وكمية المادة الذائبة، ويلخص العاملين: التحريك ودرجة الحرارة.\n   الطالب: يكملون خريطة: عوامل تسرّع الذوبان.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.\n\n4. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n5. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n6. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. [مستوى المعرفة] من التمثيل البياني: عند أي درجة حرارة استغرق السكر أقصر زمن؟\n   الإجابة النموذجية: عند أعلى درجة حرارة في التمثيل.\n2. [مستوى التطبيق] صف النمط: كلما زادت درجة الحرارة...\n   الإجابة النموذجية: قل زمن الذوبان (أي ذاب السكر أسرع).\n3. [مستوى الاستدلال] ما الفرق بين «يذوب أسرع» و«يذوب أكثر»؟\n   الإجابة النموذجية: الأول يتعلق بسرعة ذوبان الكمية نفسها، والثاني بكمية المادة التي يمكن أن تذوب.", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.\n\n4. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n5. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n6. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. [مستوى المعرفة] اذكر عاملين يجعلان المادة تذوب أسرع.\n   الإجابة النموذجية: التحريك ورفع درجة الحرارة.\n2. [مستوى التطبيق] لماذا يُفضل التمثيل الخطي عند قياس الزمن عند عدة درجات حرارة؟\n   الإجابة النموذجية: لأنه يوضح التغير المستمر ويسمح بقراءة قيم بين القياسات.\n3. [مستوى الاستدلال] لماذا لا تُغسل الملابس عادة بدرجات حرارة عالية جدًا؟\n   الإجابة النموذجية: لأن الحرارة المرتفعة قد تتلف الأقمشة أو تسبب تقلصها.", "الحصة 1: التحريك يزيد سرعة الذوبان\nللطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\nللطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24\n\nالحصة 2: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nللطالب: إكمال ورقة العمل 3-6ج (كتاب النشاط ص 82–83) واجبًا منزليًا وحل تمرين 3-6 (ص 42). لولي الأمر: يُرجى مساعدة الابن في رسم التمثيل البياني بالمسطرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"id": "3-7", "title": "كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66–67 | كتاب النشاط ص 43، 84–85 | دليل المعلم ص 90–92", "n": 2, "per": [{"h": {"lesson": "3-7 كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66 | دليل المعلم ص 90–91", "num": "الحصة الأولى من 2", "focus": "حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء"}, "f": ["1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية.\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان.\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة.", "1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية. ← فهم\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان. ← تطبيق\nالمخرج الآخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة. ← تحليل", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورق A4، مقص، مسطرة، قطعة سكر وحبيبات سكر ومسحوق سكر", "- حجم الحبيبات\n- مساحة السطح\n- التخطيط\n- العامل المتغير\n- العوامل الثابتة", "يعرض المعلم قطعة سكر وملعقة حبيبات سكر ومسحوق سكر، ويسأل: أيها تتوقع أن يذوب أولًا في الماء؟ ولماذا؟", "1) التهيئة: ثلاثة أشكال للسكر (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويسجل التنبؤات.\n   الطالب: يتنبؤون ويبررون.\n2) نشاط الحواف (مساحة الس sel.onchange=()=>{li=+sel.value;pi=0;render();};
$('mSep').onclick=()=>{mode='sep';render();};
$('mComb').onclick=()=>{mode='comb';render();};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
  const L=D[li];
  $('mSep').classList.toggle('on',mode==='sep');$('mComb').classList.toggle('on',mode==='comb');
  $('status').textContent=mode==='sep'?`أنت الآن في الوضع المنفصل: نموذج لكل حصة (الحصة ${pi+1} من ${L.n})`:`أنت الآن في الوضع المدمج: نموذج واحد للدرس يضم حصصه الـ${L.n}`;
  const tabs=$('tabs');tabs.innerHTML='';
  if(mode==='sep'){L.per.forEach((p,i)=>{const b=document.createElement('button');b.textContent='الحصة '+(i+1);if(i===pi)b.className='on';b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  let info='';
  if(mode==='sep'){const h=L.per[pi].h;
    info=`<div><b>الدرس:</b> ${esc(h.lesson)}</div><div><b>${esc(h.num)}</b></div><div><b>الوحدة:</b> ${esc(h.unit)}</div><div><b>${esc(h.week)}</b></div><div class="full"><b>الصفحات:</b> ${esc(h.pages)}</div><div class="full"><b>محور الحصة:</b> ${esc(h.focus)}</div>`;
  }else{
    info=`<div><b>الدرس:</b> ${esc(L.id+' '+L.title)}</div><div><b>عدد الحصص:</b> ${L.n}</div><div><b>الوحدة:</b> ${esc(L.unit)}</div><div><b>${esc(L.week)}</b></div><div class="full"><b>محاور الحصص:</b> ${L.per.map((p,i)=>'('+(i+1)+') '+esc(p.h.focus)).join(' · ')}</div>`;
  }
  $('info').innerHTML=info;
  const texts=mode==='sep'?L.per[pi].f:L.comb;
  const c=$('cards');c.innerHTML='';
  FIELDS.forEach((nm,i)=>{const p=PAL[i%5];
    const d=document.createElement('div');d.className='card';d.style.borderColor=p[2];
    d.innerHTML=`<div class="h" style="background:${p[0]};color:${p[1]}"><span class="t"><span class="n" style="border-color:${p[2]}">${i+1}</span>${nm}</span><button class="copy">نسخ</button></div><pre></pre><div class="hint">لم يسمح المتصفح بالنسخ التلقائي: تم تحديد النص، اضغط نسخ من قائمة الجهاز أو Ctrl+C.</div>`;
    d.querySelector('pre').textContent=texts[i];
    d.querySelector('.copy').onclick=ev=>copyText(texts[i],ev.currentTarget,d);
    c.appendChild(d);});
}
function selectPre(card){const pre=card.querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=window.getSelection();s.removeAllRanges();s.addRange(r);card.querySelector('.hint').classList.add('on');}
function done(btn){btn.textContent='تم النسخ ✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('ok');},1800);}
function legacy(t){try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}}
function copyText(t,btn,card){
  card.querySelector('.hint').classList.remove('on');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>done(btn)).catch(()=>{legacy(t)?done(btn):selectPre(card);});}
  else{legacy(t)?done(btn):selectPre(card);}
}
render();
</script>
<script src="/assets/qlink.js" defer></script>
</body>
</html>
