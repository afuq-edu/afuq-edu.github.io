مام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد، والطلبة يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الحفاظ على الطاقة: يناقش المعلم: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية، والطلبة يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-9: سجلي الأسبوعي: يوجه المعلم تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع، والطلبة يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9) — زمن الحصة 40 دقيقة\n\n1. نشاط 2-9: الجمع والتسجيل: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل، والطلبة يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. التمثيل والمقارنة: يوجه المعلم جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2)، والطلبة يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا (6 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تخطيط الحملة (السؤال 3): يناقش المعلم «تحدّث عن» ص 51 ويطلب خطة حملة، والطلبة يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n5. غلق الدرس – سفراء البيئة العمانية: تتقمص المجموعات دور سفراء البيئة، فتقدم كل مجموعة نصيحتين للحفاظ على الماء والطاقة في البيت والمدرسة، ضمن أهداف رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: الحفاظ على الماء والطاقة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أكثر أنواع القمامة التي جمعتها مجموعتك؟\n   الإجابة النموذجية: غالبًا البلاستيك أو الورق (تعتمد على النتائج).\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستدلال بعدد العلامات.\n3. [مستوى الاستدلال] لماذا يُعد البلاستيك من أخطر أنواع القمامة؟\n   الإجابة النموذجية: لأنه لا يتحلل بسهولة ويبقى طويلًا وقد تختنق به الحيوانات.", "الحصة 1: الحفاظ على الماء والطاقة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نرتدي القفازات والكمامات عند جمع القمامة؟\n   الإجابة النموذجية: لحماية أنفسنا من الجراثيم والأدوات الحادة.\n2. [مستوى التطبيق] ما فائدة تمثيل نتائج الفرز بالأعمدة؟\n   الإجابة النموذجية: لمقارنة أنواع القمامة بسهولة ومعرفة النوع الأكثر شيوعًا.\n3. [مستوى الاستدلال] اقترح فكرتين لحملة منع رمي القمامة في مدرستك.\n   الإجابة النموذجية: وضع صناديق قرب المقصف، ملصقات توعوية، مسابقة الفصل الأنظف (تقبل الأفكار المنطقية).", "الحصة 1: الحفاظ على الماء والطاقة\nللطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n\nالحصة 2: فرز القمامة وحملة لمنع رميها (نشاط 2-9)\nللطالب: إعداد ملصق للحملة التوعوية لوضعه في المدرسة، ومراجعة الوحدة الثانية. لولي الأمر: يُرجى تشجيع الابن على عدم رمي المخلفات في الأماكن العامة والقدوة في ذلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"id": "2-10", "title": "تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | كتاب النشاط ص 36 | دليل المعلم ص 64", "n": 2, "per": [{"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | دليل المعلم ص 64", "num": "الحصة الأولى من 3", "focus": "مراجعة المفردات والسلاسل الغذائية في صورة موطن"}, "f": ["1. يطابق مصطلحات الوحدة بمعانيها الصحيحة (5 دقائق)\n2. يحدد مصدر الطاقة والمنتجات والمستهلكات والمفترس والفريسة في صورة موطن (10 دقائق)\n3. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح (10 دقائق)\n4. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع (5 دقائق)\n\nمخرج تعليمي آخر:\nيتنبأ بأثر اختفاء الحشرات أو غياب الشمس على الموطن (5 دقائق)\nيقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة (5 دقائق)", "1. يطابق مصطلحات الوحدة بمعانيها الصحيحة. ← تذكر\n2. يحدد مصدر الطاقة والمنتجات والمستهلكات والمفترس والفريسة في صورة موطن. ← تطبيق\n3. يرتب الكائنات في سلاسل غذائية بالترتيب الصحيح. ← تطبيق\n4. يوضح كيف تسهم إزالة الغابات في الاحتباس الحراري وكيف تقتل الأمطار الحمضية الضفادع. ← فهم\nالمخرج الآخر: يتنبأ بأثر اختفاء الحشرات أو غياب الشمس على الموطن. ← تحليل\nالمخرج الآخر: يقترح طرقًا لإعادة تدوير أو إعادة استخدام أشياء مختلفة. ← تطبيق", "- التعلم المبني على اللعب\n- التعلم الذاتي\n- فكّر – زاوج – شارك\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- السبورة التقليدية", "- الموطن الطبيعي\n- المغذيات\n- الاحتباس الحراري\n- مصدر الطاقة\n- ترتيب السلسلة\n- إزالة الغابات\n- الأمطار الحمضية\n- إعادة التدوير", "يعرض المعلم لعبة «كلمة وتعريف»: يقرأ تعريفًا ويرفع الطلبة البطاقة التي تحمل المصطلح المناسب. (5 دقائق)", "1. السؤال 1: المطابقة: يوجه المعلم حل السؤال 1 ص 52، والطلبة يطابقون المصطلحات بمعانيها ويصححون (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السؤال 2: صورة الموطن: يعرض المعلم الصورة ص 52 على السبورة الذكية، والطلبة يحددون مصدر الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 3: ماذا لو؟: يدير المعلم نقاش: اختفاء الحشرات، توقف الشمس عن السطوع، والطلبة يتنبؤون بالآثار ويكتبونها (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. السؤال 4: الترتيب الصحيح: يوجه المعلم ترتيب السلاسل الأربع ص 53، والطلبة يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. السؤال 5 و6: يوجه المعلم اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع، والطلبة يجيبون كتابيًا ثم يتشاركون (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. السؤال 7: أعد التدوير: يعرض المعلم صور الأشياء في السؤال 7، والطلبة يقترحون طرق إعادة الاستخدام والتدوير لكل منها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] رتب: نورس – عوالق – سمكة.\n   الإجابة النموذجية: عوالق ← سمكة ← نورس.\n5. [مستوى التطبيق] رتب: قرش – عوالق – سمك صغير – فقمة.\n   الإجابة النموذجية: عوالق ← سمك صغير ← فقمة ← قرش.\n6. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد تركيزه في الهواء ويحبس الحرارة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] رتب: صقر – بذور – سحلية – خنفساء.\n   الإجابة النموذجية: بذور ← خنفساء ← سحلية ← صقر.\n5. [مستوى التطبيق] كيف يمكن أن تتسبب الأمطار الحمضية في قتل الضفادع؟\n   الإجابة النموذجية: تجعل ماء البحيرات حمضيًا فيضر بالضفادع وغذائها.\n6. [مستوى الاستدلال] اقترح طريقة لإعادة استخدام الزجاجات البلاستيكية.\n   الإجابة النموذجية: كأصص للزراعة أو لتخزين الأغراض أو صنع أدوات مفيدة.", "للطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\nللطالب: حل «المراجعة اللغوية» في كتاب النشاط ص 36 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى متابعة الابن في المراجعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"h": {"lesson": "2-10 تحقق من تقدمك", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 52–53 | كتاب النشاط ص 36 | دليل المعلم ص 64", "num": "الحصة الثالثة من 3", "focus": "المراجعة اللغوية والخريطة المفاهيمية للوحدة"}, "f": ["1. يستخدم المصطلحات العلمية للوحدة الثانية بدقة في جمل (10 دقائق)\n2. ينظم مفاهيم الوحدة في خريطة مفاهيمية مترابطة (15 دقيقة)\n\nمخرج تعليمي آخر: يصمم سؤال تقويم عن الوحدة ويجيب عنه (15 دقيقة)", "1. يستخدم المصطلحات العلمية للوحدة الثانية بدقة في جمل. ← فهم\n2. ينظم مفاهيم الوحدة في خريطة مفاهيمية مترابطة. ← إبداع\nالمخرج الآخر: يصمم سؤال تقويم عن الوحدة ويجيب عنه. ← إبداع", "- الخرائط الذهنية والمفاهيمية\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على اللعب", "- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق كبيرة للخرائط المفاهيمية", "- السلسلة الغذائية\n- المنتج\n- المستهلك\n- التلوث\n- الاعتناء بالبيئة", "يكتب المعلم في منتصف السبورة «الكائنات الحية في البيئة» ويطلب من كل طالب إضافة كلمة مرتبطة خلال دقيقتين. (5 دقائق)", "1. المراجعة اللغوية: يوجه المعلم حل المراجعة اللغوية (كتاب النشاط ص 36) ويصحح جماعيًا، والطلبة يكملون الجمل ويصححون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الخريطة المفاهيمية: يقسم المعلم الوحدة إلى فروع: السلاسل الغذائية، المواطن، آثار الإنسان، الاعتناء بالبيئة، وترسم كل مجموعة فرعًا ثم تُجمع الفروع في خريطة واحدة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. سؤال من صنعي: يطلب المعلم من كل طالب كتابة سؤال وإجابته، والطلبة يتبادلون الأسئلة ويجيبون (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n5. غلق الدرس – مراجعة بلغة الوطن: تتسابق المجموعات في مطابقة مصطلحات الوحدة وتحديد المنتج ومصدر الطاقة في سلسلة غذائية لموطن عماني يعرضه المعلم (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أكمل: الحيوانات التي تتغذى عليها المفترسات تسمى ____.\n   الإجابة النموذجية: فرائس.\n2. [مستوى التطبيق] ما العلاقة بين فرعي «آثار الإنسان» و«الاعتناء بالبيئة» في الخريطة؟\n   الإجابة النموذجية: الاعتناء بالبيئة يقلل الآثار السلبية للإنسان مثل التلوث وإزالة الغابات.\n3. [مستوى الاستدلال] اربط بين إزالة الغابات والسلاسل الغذائية.\n   الإجابة النموذجية: تدمر إزالة الغابات المواطن فتختفي المنتجات وتنهار السلاسل الغذائية فيها.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المصطلح: «التخلص من النفايات بمعالجتها لتصبح منتجًا جديدًا»؟\n   الإجابة النموذجية: إعادة التدوير.\n2. [مستوى التطبيق] اذكر أثرين سلبيين للإنسان على البيئة وطريقتين للعناية بها.\n   الإجابة النموذجية: السلبي: التلوث وإزالة الغابات؛ العناية: إعادة التدوير وترشيد الطاقة.\n3. [مستوى الاستدلال] اكتب سؤالًا عن الوحدة وأجب عنه.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها. م المبني على اللعب", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- السبورة التقليدية\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق كبيرة للخرائط المفاهيمية", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\n- الموطن الطبيعي\n- المغذيات\n- الاحتباس الحراري\n- مصدر الطاقة\n- ترتيب السلسلة\n- إزالة الغابات\n- الأمطار الحمضية\n- إعادة التدوير\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\n- السلسلة الغذائية\n- المنتج\n- المستهلك\n- التلوث\n- الاعتناء بالبيئة", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nيعرض المعلم لعبة «كلمة وتعريف»: يقرأ تعريفًا ويرفع الطلبة البطاقة التي تحمل المصطلح المناسب. (5 دقائق)\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nيكتب المعلم في منتصف السبورة «الكائنات الحية في البيئة» ويطلب من كل طالب إضافة كلمة مرتبطة خلال دقيقتين. (5 دقائق)", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن — زمن الحصة 40 دقيقة\n1. السؤال 1: المطابقة: يوجه المعلم حل السؤال 1 ص 52، والطلبة يطابقون المصطلحات بمعانيها ويصححون (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. السؤال 2: صورة الموطن: يعرض المعلم الصورة ص 52 على السبورة الذكية، والطلبة يحددون مصدر الطاقة، منتجين، أربعة مستهلكين، مفترسًا وفريسته (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. السؤال 3: ماذا لو؟: يدير المعلم نقاش: اختفاء الحشرات، توقف الشمس عن السطوع، والطلبة يتنبؤون بالآثار ويكتبونها (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. السؤال 4: الترتيب الصحيح: يوجه المعلم ترتيب السلاسل الأربع ص 53، والطلبة يرتبون: عشب ← ثور بري ← أسد؛ عوالق ← سمكة ← نورس (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. السؤال 5 و6: يوجه المعلم اختيار ثلاثة مفترسات وفرائسها، وشرح إزالة الغابات والاحتباس الحراري والأمطار الحمضية والضفادع، والطلبة يجيبون كتابيًا ثم يتشاركون (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. السؤال 7: أعد التدوير: يعرض المعلم صور الأشياء في السؤال 7، والطلبة يقترحون طرق إعادة الاستخدام والتدوير لكل منها (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة — زمن الحصة 40 دقيقة\n1. المراجعة اللغوية: يوجه المعلم حل المراجعة اللغوية (كتاب النشاط ص 36) ويصحح جماعيًا، والطلبة يكملون الجمل ويصححون (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الخريطة المفاهيمية: يقسم المعلم الوحدة إلى فروع: السلاسل الغذائية، المواطن، آثار الإنسان، الاعتناء بالبيئة، وترسم كل مجموعة فرعًا ثم تُجمع الفروع في خريطة واحدة (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. سؤال من صنعي: يطلب المعلم من كل طالب كتابة سؤال وإجابته، والطلبة يتبادلون الأسئلة ويجيبون (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n5. غلق الدرس – مراجعة بلغة الوطن: تتسابق المجموعات في مطابقة مصطلحات الوحدة وتحديد المنتج ومصدر الطاقة في سلسلة غذائية لموطن عماني يعرضه المعلم (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما معنى «الموطن الطبيعي»؟\n   الإجابة النموذجية: مكان تعيش فيه الكائنات الحية معًا.\n2. [مستوى التطبيق] ما مصدر الطاقة في أي موطن؟\n   الإجابة النموذجية: الشمس.\n3. [مستوى الاستدلال] ماذا يحدث إذا توقفت الشمس عن السطوع فترة طويلة؟\n   الإجابة النموذجية: لا تستطيع النباتات صنع الغذاء فتموت، ثم تموت الحيوانات التي تعتمد عليها.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] رتب: نورس – عوالق – سمكة.\n   الإجابة النموذجية: عوالق ← سمكة ← نورس.\n5. [مستوى التطبيق] رتب: قرش – عوالق – سمك صغير – فقمة.\n   الإجابة النموذجية: عوالق ← سمك صغير ← فقمة ← قرش.\n6. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد تركيزه في الهواء ويحبس الحرارة.\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] أكمل: الحيوانات التي تتغذى عليها المفترسات تسمى ____.\n   الإجابة النموذجية: فرائس.\n2. [مستوى التطبيق] ما العلاقة بين فرعي «آثار الإنسان» و«الاعتناء بالبيئة» في الخريطة؟\n   الإجابة النموذجية: الاعتناء بالبيئة يقلل الآثار السلبية للإنسان مثل التلوث وإزالة الغابات.\n3. [مستوى الاستدلال] اربط بين إزالة الغابات والسلاسل الغذائية.\n   الإجابة النموذجية: تدمر إزالة الغابات المواطن فتختفي المنتجات وتنهار السلاسل الغذائية فيها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما «المغذي»؟\n   الإجابة النموذجية: مسمى آخر للمواد الغذائية.\n2. [مستوى التطبيق] ماذا يحدث للطيور التي تأكل الحشرات إذا اختفت الحشرات؟\n   الإجابة النموذجية: تقل أعدادها أو تموت لنقص الغذاء.\n3. [مستوى الاستدلال] ما التغير في درجة الحرارة الناتج عن غازات الغلاف الجوي؟\n   الإجابة النموذجية: الاحتباس الحراري.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] رتب: صقر – بذور – سحلية – خنفساء.\n   الإجابة النموذجية: بذور ← خنفساء ← سحلية ← صقر.\n5. [مستوى التطبيق] كيف يمكن أن تتسبب الأمطار الحمضية في قتل الضفادع؟\n   الإجابة النموذجية: تجعل ماء البحيرات حمضيًا فيضر بالضفادع وغذائها.\n6. [مستوى الاستدلال] اقترح طريقة لإعادة استخدام الزجاجات البلاستيكية.\n   الإجابة النموذجية: كأصص للزراعة أو لتخزين الأغراض أو صنع أدوات مفيدة.\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المصطلح: «التخلص من النفايات بمعالجتها لتصبح منتجًا جديدًا»؟\n   الإجابة النموذجية: إعادة التدوير.\n2. [مستوى التطبيق] اذكر أثرين سلبيين للإنسان على البيئة وطريقتين للعناية بها.\n   الإجابة النموذجية: السلبي: التلوث وإزالة الغابات؛ العناية: إعادة التدوير وترشيد الطاقة.\n3. [مستوى الاستدلال] اكتب سؤالًا عن الوحدة وأجب عنه.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها.", "الحصة 1: مراجعة المفردات والسلاسل الغذائية في صورة موطن\nللطالب: مراجعة كتاب الطالب ص 34–51 وحل السؤال 4 ص 53 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى مراجعة مفردات الوحدة مع الابن.\nللطالب: حل «المراجعة اللغوية» في كتاب النشاط ص 36 تمهيدًا للحصة القادمة. لولي الأمر: يُرجى متابعة الابن في المراجعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18\n\nالحصة 2: المراجعة اللغوية والخريطة المفاهيمية للوحدة\nللطالب: مراجعة الوحدة الثانية كاملة باستخدام الخريطة المفاهيمية. لولي الأمر: يُرجى الاطلاع على الخريطة ومراجعة الوحدة مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=18"]}, {"id": "3-1", "title": "التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37، 72–73 | دليل المعلم ص 71–75", "n": 4, "per": [{"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54 | دليل المعلم ص 71–73", "num": "الحصة الأولى من 5", "focus": "التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء"}, "f": ["1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد (5 دقائق)\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة (5 دقائق)\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة (5 دقائق)\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل (5 دقائق)\n\nمخرج تعليمي آخر:\nيمثل التغير القابل للعكس بمخطط سهمي في اتجاهين (10 دقائق)\nيستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة (10 دقائق)", "1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد. ← فهم\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة. ← تطبيق\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة. ← فهم\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل. ← تطبيق\nالمخرج الآخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين. ← تطبيق\nالمخرج الآخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة. ← تحليل", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- العرض العملي\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مكعبات ثلج، أطباق، ساعة إيقاف، ورقة، مقص، صندوق رمل، عود ثقاب (للمعلم فقط)", "- حالات المادة\n- الانصهار\n- التجمد\n- التغير القابل للعكس\n- الحرارة\n- التغير غير القابل للعكس\n- الاحتراق\n- الكربون\n- مادة جديدة", "يراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟ (5 دقائق)", "1. نشاط 3-1: ملاحظة تغيرات الثلج: يوزع المعلم مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54، والطلبة يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. هل يمكن عكسه؟: يسأل المعلم: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس»، والطلبة يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصحيح المفاهيم: يوضح المعلم أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر)، والطلبة يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير) (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. مفهوم التغير غير القابل للعكس: يشرح المعلم ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب، والطلبة يكتبون التعريفين في جدول مقارنة (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. لعبة «قابل أم غير قابل؟»: يعرض المعلم بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد، والطلبة يصنفون البطاقات ويبررون في ثنائيات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الأسئلة 1–3 ص 55: يوجه المعلم سؤال الجلي والبيض المسلوق، والطلبة يجيبون ويرسمون مخططًا سهميًا للجلي (3 دقائق)\nالاستراتيجيات: العرض العملي.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: فكّر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n5. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n6. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n5. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n6. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.", "للطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\nللطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 72 | دليل المعلم ص 73", "num": "الحصة الثالثة من 5", "focus": "احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا"}, "f": ["1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة (15 دقيقة)\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة (10 دقائق)\n\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة (15 دقيقة)", "1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة. ← تطبيق\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة. ← تحليل\nالمخرج الآخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة. ← تحليل", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: شمعة، حامل أو طبق، ملعقة معدنية، أعواد ثقاب، ورقة العمل 3-1", "- انصهار الشمع\n- احتراق الفتيل\n- الدخان\n- الملاحظة العلمية", "يعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟ (5 دقائق)", "1. ورقة العمل 3-1 (الجزء الأول): عرض الشمعة: يشعل المعلم الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد، والطلبة يسجلون الملاحظات في جدول ورقة العمل (ص 72) (9 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. التحليل: يناقش المعلم: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة، والطلبة يصنفون كل ملاحظة ويعللون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. السلامة مع اللهب: يناقش المعلم قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة، والطلبة يكتبون ثلاث قواعد سلامة (5 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.", "للطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 55 | كتاب النشاط ص 73 | دليل المعلم ص 73–74", "num": "الحصة الرابعة من 5", "focus": "تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص"}, "f": ["1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز) (15 دقيقة)\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة (15 دقيقة)\n\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم (10 دقائق)", "1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز). ← تحليل\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة. ← فهم\nالمخرج الآخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: بيكربونات الصوديوم، خل، كأس زجاجية، ملعقة صغيرة، جص، ماء، أكواب، ورقة العمل 3-1", "- التغير الفيزيائي\n- التغير الكيميائي\n- التفاعل\n- الفقاعات\n- الجص", "يسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم. (5 دقائق)", "1. ورقة العمل 3-1 (الجزء الثاني): يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس، والطلبة يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض الجص: يخلط المعلم الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج، والطلبة يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. فيزيائي أم كيميائي؟: يشرح المعلم: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة)، والطلبة يصنفون أمثلة الدرس في جدول (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.", "للطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"h": {"lesson": "3-1 التغيرات القابلة للعكس والتغيرات غير القابلة للعكس", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الحادي عشر (15–19/11/2026)", "pages": "كتاب الطالب ص 54–55 | كتاب النشاط ص 37 | دليل المعلم ص 73–75", "num": "الحصة الخامسة من 5", "focus": "تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج"}, "f": ["1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر (15 دقيقة)\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي (10 دقائق)\n\nمخرج تعليمي آخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها (15 دقيقة)", "1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر. ← تطبيق\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي. ← تحليل\nالمخرج الآخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها. ← تحليل", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- الوسائل المتعددة (سمعية - بصرية)\n- صورة توضيحية\n- أخرى: نموذج بركان من العجين أو الورق، بيكربونات الصوديوم، خل، ألوان طعام، تمرين 3-1", "- النموذج\n- الثوران\n- إعادة تدوير الزجاج\n- الانصهار", "يعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟ (5 دقائق)", "1. نموذج البركان (تكامل مع الفنون والمهارات الحياتية): يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام، والطلبة ينفذون الثوران ويصفون التغير ويصنفونه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 3-1 في كتاب النشاط: يوجه المعلم حل التمرين (ص 37) مع دعم المتعثرين، والطلبة يقارنون التغيرات ويحلون فرديًا (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تحدّث عن: إعادة تدوير الزجاج: يشرح المعلم: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟ والطلبة يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – ثلج وسمن وخبز: تصنف المجموعات تغيرات في المطبخ العماني إلى قابلة للعكس كانصهار السمن، وغير قابلة كخبز الرقاق، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "للطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}], "comb": ["الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد (5 دقائق)\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة (5 دقائق)\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة (5 دقائق)\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل (5 دقائق)\n\nمخرج تعليمي آخر:\nيمثل التغير القابل للعكس بمخطط سهمي في اتجاهين (10 دقائق)\nيستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة (10 دقائق)\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة (15 دقيقة)\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة (10 دقائق)\n\nمخرج تعليمي آخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة (15 دقيقة)\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز) (15 دقيقة)\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة (15 دقيقة)\n\nمخرج تعليمي آخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم (10 دقائق)\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر (15 دقيقة)\n2. يقارن بين التغيرات القابلة وغير القابلة للعكس في تمرين تطبيقي (10 دقائق)\n\nمخرج تعليمي آخر: يشرح خطوات إعادة تدوير الزجاج وأنواع التغيرات فيها (15 دقيقة)", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\n1. يصف تغير الثلج من الحالة الصلبة إلى السائلة عند التسخين وعودته عند التبريد. ← فهم\n2. يحدد الحرارة عاملًا يسبب تغير حالة المادة. ← تطبيق\n3. يميز بين التغيرات القابلة للعكس والتغيرات غير القابلة للعكس بأمثلة. ← فهم\n4. يصنف تغيرات يومية إلى قابلة أو غير قابلة للعكس مع التعليل. ← تطبيق\nالمخرج الآخر: يمثل التغير القابل للعكس بمخطط سهمي في اتجاهين. ← تطبيق\nالمخرج الآخر: يستنتج أن بعض التغيرات غير القابلة للعكس ينتج عنها مادة جديدة. ← تحليل\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\n1. يسجل ملاحظات دقيقة عن التغيرات التي تحدث للشمعة المشتعلة. ← تطبيق\n2. يحدد التغير القابل للعكس والتغير غير القابل للعكس في احتراق الشمعة. ← تحليل\nالمخرج الآخر: يستدل على تكوّن مادة جديدة من أثر الدخان على الملعقة. ← تحليل\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\n1. يلاحظ تفاعل بيكربونات الصوديوم مع الخل ويستنتج تكوّن مادة جديدة (غاز). ← تحليل\n2. يميز بين التغير الفيزيائي والتغير الكيميائي بأمثلة مبسطة. ← فهم\nالمخرج الآخر: يبحث عن اسم الغاز المتكوّن في تفاعل الخل وبيكربونات الصوديوم. ← تطبيق\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\n1. يطبق مفهوم التغير غير القابل للعكس في نموذج بركان ثائر. ← تطبيق\n2. يق تدوير الزجاج\n- الانصهار", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nيراجع المعلم حالات المادة الثلاث بسؤال: ما الشيء الذي يمكن أن تراه صلبًا وسائلًا وغازًا في يوم واحد؟ (5 دقائق)\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nيعرض المعلم شمعة جديدة وأخرى قصيرة محترقة ويسأل: أين ذهب جزء الشمعة الناقص؟ (5 دقائق)\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nيسأل المعلم: هل يمكن أن نصنع مادة جديدة بخلط مادتين من المطبخ؟ ويعرض علبتي خل وبيكربونات صوديوم. (5 دقائق)\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nيعرض المعلم مقطعًا قصيرًا لبركان ثائر ويسأل: هل يمكن أن نصنع بركانًا في الصف؟ ما المواد التي تعلمناها وتصلح لذلك؟ (5 دقائق)", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء — زمن الحصة 40 دقيقة\n1. نشاط 3-1: ملاحظة تغيرات الثلج: يوزع المعلم مكعبات الثلج في أطباق في مكان دافئ أو مشمس خمس دقائق ويطرح أسئلة ص 54، والطلبة يلاحظون الانصهار ويسجلون التغير كل دقيقة ويحددون السبب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. هل يمكن عكسه؟: يسأل المعلم: ماذا يحدث للماء إذا أعدناه إلى الثلاجة؟ ويقدم مصطلح «قابل للعكس»، والطلبة يتنبؤون بالتجمد ويرسمون مخططًا: ثلج ⇄ ماء (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تصحيح المفاهيم: يوضح المعلم أن الثلج والماء حالتان للمادة نفسها، وأن التسخين لا يعني دائمًا الاحتراق (المعادن تنصهر)، والطلبة يذكرون أمثلة أخرى لتغيرات قابلة للعكس (انصهار الشوكولاتة، تجمد العصير) (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. مفهوم التغير غير القابل للعكس: يشرح المعلم ص 55: بعض المواد عند تسخينها لا تعود، وقد تتكون مادة جديدة مثل الكربون الأسود من عود الثقاب، والطلبة يكتبون التعريفين في جدول مقارنة (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. لعبة «قابل أم غير قابل؟»: يعرض المعلم بطاقات: طهي البيض، تجمد الماء، احتراق الخشب، انصهار الشمع، خبز الكعك، صدأ الحديد، والطلبة يصنفون البطاقات ويبررون في ثنائيات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الأسئلة 1–3 ص 55: يوجه المعلم سؤال الجلي والبيض المسلوق، والطلبة يجيبون ويرسمون مخططًا سهميًا للجلي (3 دقائق)\nالاستراتيجيات: العرض العملي.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا — زمن الحصة 40 دقيقة\n1. ورقة العمل 3-1 (الجزء الأول): عرض الشمعة: يشعل المعلم الشمعة بأمان ويوجه الملاحظة: انصهار الشمع وسيلانه، اسوداد الفتيل، الدخان؛ ويضع ملعقة فوق اللهب ثم يتركها تبرد، والطلبة يسجلون الملاحظات في جدول ورقة العمل (ص 72) (9 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. التحليل: يناقش المعلم: قطرات الشمع تتجمد (قابل للعكس)، الفتيل والشمع المحترق (غير قابل)، الطبقة السوداء دليل مادة جديدة، والطلبة يصنفون كل ملاحظة ويعللون (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. السلامة مع اللهب: يناقش المعلم قواعد السلامة: البعد عن الستائر، عدم ترك الشمعة دون مراقبة، والطلبة يكتبون ثلاث قواعد سلامة (5 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص — زمن الحصة 40 دقيقة\n1. ورقة العمل 3-1 (الجزء الثاني): يوجه المجموعات لوضع ملعقتين من البيكربونات ثم الكمية نفسها من الخل في كأس، والطلبة يلاحظون الفقاعات والرغوة ويجيبون: هل تغيرت المادتان؟ هل تكونت مادة جديدة؟ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض الجص: يخلط المعلم الجص بالماء (يضيف الجص إلى الماء) ويسمح للطلبة بلمس الكوب من الخارج، والطلبة يلاحظون الدفء والتماسك وعدم إمكانية إرجاع الجص (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. فيزيائي أم كيميائي؟: يشرح المعلم: الفيزيائي يغير الشكل أو الحالة والمادة نفسها، الكيميائي ينتج مادة جديدة؛ وبعض التغيرات الكيميائية مرغوبة (الكعك) وأخرى غير مرغوبة (صدأ الدراجة)، والطلبة يصنفون أمثلة الدرس في جدول (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج — زمن الحصة 40 دقيقة\n1. نموذج البركان (تكامل مع الفنون والمهارات الحياتية): يوجه المجموعات لتشكيل النموذج حول كأس صغيرة ثم إضافة البيكربونات والخل وألوان الطعام، والطلبة ينفذون الثوران ويصفون التغير ويصنفونه (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تمرين 3-1 في كتاب النشاط: يوجه المعلم حل التمرين (ص 37) مع دعم المتعثرين، والطلبة يقارنون التغيرات ويحلون فرديًا (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تحدّث عن: إعادة تدوير الزجاج: يشرح المعلم: يُسحق الزجاج ويُصهر ثم يُسكب في قوالب؛ ويسأل: هل يكوّن مادة جديدة؟ والطلبة يستنتجون أن صهر الزجاج تغير في الحالة يمكن عكسه بالتبريد (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – ثلج وسمن وخبز: تصنف المجموعات تغيرات في المطبخ العماني إلى قابلة للعكس كانصهار السمن، وغير قابلة كخبز الرقاق، وتعلل التصنيف (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا حدث للثلج بعد خمس دقائق في المكان الدافئ؟\n   الإجابة النموذجية: انصهر وتحول إلى ماء سائل.\n2. [مستوى التطبيق] ما سبب تغير حالة الثلج؟\n   الإجابة النموذجية: الحرارة.\n3. [مستوى الاستدلال] هل الثلج والماء مادتان مختلفتان؟ وضح.\n   الإجابة النموذجية: لا؛ هما حالتان مختلفتان للمادة نفسها (الماء).\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما الذي يتكون عند إشعال عود الثقاب؟\n   الإجابة النموذجية: مادة سوداء تسمى الكربون.\n5. [مستوى التطبيق] صنّف: سلق البيض.\n   الإجابة النموذجية: تغير غير قابل للعكس؛ لأن البيض المسلوق لا يعود نيئًا.\n6. [مستوى الاستدلال] هل يمكن إعادة الجلي المتماسك إلى الحالة السائلة؟ وضح.\n   الإجابة النموذجية: نعم بالتسخين؛ فتماسكه بالتبريد تغير قابل للعكس.\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت على الشمع حول الفتيل؟\n   الإجابة النموذجية: ينصهر ويسيل ثم يتجمد على جانب الشمعة.\n2. [مستوى التطبيق] هل انصهار الشمع تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: نعم؛ لأن الشمع المنصهر يتجمد مرة أخرى عند تبريده.\n3. [مستوى الاستدلال] ما الدليل على تكوّن مادة جديدة عند احتراق الشمعة؟\n   الإجابة النموذجية: الطبقة السوداء التي تركها الدخان على الملعقة، وتحول الفتيل إلى اللون الأسود.\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا لاحظت عند إضافة الخل إلى بيكربونات الصوديوم؟\n   الإجابة النموذجية: تكونت فقاعات ورغوة.\n2. [مستوى التطبيق] ما الدليل على حدوث تغير كيميائي عند خلط الجص بالماء؟\n   الإجابة النموذجية: ارتفاع الحرارة وتماسك الجص وعدم إمكانية إرجاعه، أي تكوّن مادة جديدة.\n3. [مستوى الاستدلال] ما اسم الغاز الذي تكوّن في تفاعل الخل والبيكربونات؟\n   الإجابة النموذجية: غاز ثاني أكسيد الكربون.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] هل ثوران البركان في النموذج تغير قابل للعكس؟ لماذا؟\n   الإجابة النموذجية: لا؛ لأن الخل والبيكربونات تفاعلا وكوّنا مادة جديدة.\n2. [مستوى التطبيق] صنّف: انصهار الزجاج عند التدوير.\n   الإجابة النموذجية: قابل للعكس؛ لأنه يتجمد مرة أخرى عند التبريد.\n3. [مستوى الاستدلال] ما الخطوات الرئيسية لإعادة تدوير الزجاج؟\n   الإجابة النموذجية: جمعه، سحقه، صهره، صبه في قوالب لصنع منتجات جديدة.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ماذا يحدث للماء إذا وُضع في الثلاجة (المجمد)؟\n   الإجابة النموذجية: يتجمد ويتحول إلى ثلج صلب.\n2. [مستوى التطبيق] لماذا يُعد انصهار الثلج تغيرًا قابلًا للعكس؟\n   الإجابة النموذجية: لأنه يمكن إعادة الماء إلى حالة الثلج بالتبريد.\n3. [مستوى الاستدلال] اذكر مثالًا من مطبخك لتغير قابل للعكس.\n   الإجابة النموذجية: انصهار الزبدة ثم تجمدها، أو تجمد العصير ثم ذوبانه.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما التغير غير القابل للعكس؟\n   الإجابة النموذجية: تغير لا يمكن إعادة المادة بعده إلى حالتها السابقة.\n5. [مستوى التطبيق] اذكر مثالين لتغيرات غير قابلة للعكس.\n   الإجابة النموذجية: احتراق الورق أو الخشب، وطهي البيض أو خبز الكعك.\n6. [مستوى الاستدلال] هل يُنتج سلق البيض مادة جديدة؟ علّل.\n   الإجابة النموذجية: نعم؛ تتغير صفات بياض البيض وصفاره ولا يمكن إرجاعهما.\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا تقصر الشمعة كلما احترقت؟\n   الإجابة النموذجية: لأن الشمع يحترق ويُستهلك فيتحول إلى مواد جديدة كالغازات والدخان.\n2. [مستوى التطبيق] اذكر تغيرًا قابلًا للعكس وآخر غير قابل في الشمعة.\n   الإجابة النموذجية: قابل: انصهار الشمع. غير قابل: احتراق الفتيل والشمع.\n3. [مستوى الاستدلال] لماذا وضعنا الملعقة فوق اللهب؟\n   الإجابة النموذجية: لنكشف الدخان غير المرئي بسهولة؛ إذ يترك طبقة سوداء على الملعقة.\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفرق بين التغير الفيزيائي والكيميائي؟\n   الإجابة النموذجية: الفيزيائي يغير شكل المادة أو حالتها دون مادة جديدة، والكيميائي ينتج مادة جديدة.\n2. [مستوى التطبيق] أعط مثالًا لتغير كيميائي غير مرغوب فيه.\n   الإجابة النموذجية: صدأ الحديد في الدراجة.\n3. [مستوى الاستدلال] لماذا لا نسكب الجص في المغسلة؟\n   الإجابة النموذجية: لأنه يتماسك ويسبب انسداد المصرف.\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر تغيرًا قابلًا للعكس وآخر غير قابل للعكس.\n   الإجابة النموذجية: قابل: انصهار الثلج. غير قابل: احتراق الورق.\n2. [مستوى التطبيق] ما الذي يجعل الفقاعات تخرج من البركان؟\n   الإجابة النموذجية: الغاز (ثاني أكسيد الكربون) المتكون من تفاعل الخل والبيكربونات.\n3. [مستوى الاستدلال] اقترح تحسينًا لنموذج بركانك ليكون أكثر شبهًا بالبركان الحقيقي.\n   الإجابة النموذجية: تقبل المقترحات مثل إضافة لون أحمر للحمم أو شكل مخروطي أدق.", "الحصة 1: التغيرات القابلة للعكس: انصهار الثلج وتجمد الماء\nللطالب: قراءة كتاب الطالب ص 54، وتجربة تجميد قليل من العصير وإذابته في المنزل. لولي الأمر: يُرجى مساعدة الابن في التجربة المنزلية البسيطة.\nللطالب: كتابة خمسة تغيرات يلاحظها في المطبخ وتصنيفها، وحل الأسئلة 1–3 ص 55. لولي الأمر: يُرجى مراقبة الابن وعدم السماح له باستخدام النار وحده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19\n\nالحصة 2: احتراق الشمعة: تغيرات قابلة وغير قابلة للعكس معًا\nللطالب: إكمال إجابات الجزء الأول من ورقة العمل 3-1 (كتاب النشاط ص 72). لولي الأمر: يُرجى التأكيد على الابن عدم إشعال الشموع أو أعواد الثقاب دون إشراف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19\n\nالحصة 3: تكوّن مواد جديدة: بيكربونات الصوديوم والخل والجص\nللطالب: إكمال الجزء الثاني من ورقة العمل 3-1 (ص 73) والبحث عن اسم الغاز المتكون. لولي الأمر: يُرجى إشراك الابن في خبز الكعك وملاحظة التغيرات غير القابلة للعكس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19\n\nالحصة 4: تطبيق: نموذج البركان وتمرين 3-1 وإعادة تدوير الزجاج\nللطالب: حل تمرين 3-1 في كتاب النشاط ص 37 إن لم يكتمل، ومراجعة ص 54–55. لولي الأمر: يُرجى تشجيع الابن على فرز الزجاجات الفارغة لإعادة التدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=19"]}, {"id": "3-2", "title": "خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38، 74 | دليل المعلم ص 74–77", "n": 4, "per": [{"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56 | دليل المعلم ص 74–76", "num": "الحصة الأولى من 5", "focus": "ما المخلوط؟ صنع مخاليط من مواد صلبة"}, "f": ["1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي (5 دقائق)\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها (10 دقائق)\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة (5 دقائق)\n4. يختار الأدوات المناسبة لفصل كل مخلوط (10 دقائق)\n\nمخرج تعليمي آخر:\nيوضح أن الهواء مخلوط من غازات رغم أننا لا نراها (5 دقائق)\nيربط حجم الجزيئات بطريقة الفصل المناسبة (5 دقائق)", "1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n4. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون، مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط\n- صورة توضيحية", "- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي\n- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات", "يعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة. (5 دقائق)", "1. تعريف المخلوط: يشرح المعلم ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون، والطلبة يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 3-2أ: صنع المخاليط: يوزع المعلم المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب، والطلبة يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقود المعلم الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل، والطلبة يقارنون المخاليط: أيها يسهل رؤية مكوناته؟ (3 دقائق)\nالاستراتيجيات: المناقشة.\n\n4. طرق الفصل: يشرح المعلم ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة، والطلبة يكملون جدول: الطريقة – متى نستخدمها – مثال (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. نشاط 3-2ب: فصل مخاليط الحصة السابقة: يحدد المعلم الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ، والطلبة يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مناقشة السؤالين 1 و2: يسأل المعلم: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟ والطلبة يذكرون الملح والرمل ويتوقعون السبب (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (1 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n5. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n6. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n5. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n6. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.", "للطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\nللطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | كتاب النشاط ص 74 | دليل المعلم ص 76–77", "num": "الحصة الثالثة من 5", "focus": "الفصل بالمغناطيس (ورقة العمل 3-2)"}, "f": ["1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس (10 دقائق)\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها (15 دقيقة)\n\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة (15 دقيقة)", "1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2", "- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل", "يسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟ (5 دقائق)", "1. السلامة: ينبه المعلم: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل، والطلبة يستمعون ويكررون قواعد السلامة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ورقة العمل 3-2: فصل المخاليط: يوزع المعلم المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز، والطلبة يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74) (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحدّث عن: الخردة وتصحيح مفهوم: يوضح المعلم أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة، والطلبة يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.", "للطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 57 | دليل المعلم ص 75–76", "num": "الحصة الرابعة من 5", "focus": "مقارنة طرق الفصل والتنبؤ بأفضلها"}, "f": ["1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس (10 دقائق)\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره (15 دقيقة)\n\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله (15 دقيقة)", "1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر", "- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- , {"h": {"lesson": "3-2 خلط المواد الصلبة وفصلها", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثاني عشر (22–26/11/2026)", "pages": "كتاب الطالب ص 56–57 | كتاب النشاط ص 38 | دليل المعلم ص 76–77", "num": "الحصة الخامسة من 5", "focus": "تحدي الفصل: تصميم خطة لفصل مخلوط معقد"}, "f": ["1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة (10 دقائق)\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات (15 دقيقة)\n\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق (15 دقيقة)", "1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة. ← إبداع\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات. ← تقييم\nالمخرج الآخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق. ← فهم", "- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: مخلوط من فاصوليا وأرز ودقيق ودبابيس، غربال، مغناطيس، أطباق", "- خطة الفصل\n- التسلسل\n- التقييم\n- الغربلة", "يعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟ (5 دقائق)", "1. التخطيط: يطلب المعلم خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة، والطلبة يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التنفيذ: يتابع المعلم السلامة والدقة ويحسب الوقت، والطلبة ينفذون الخطة ويسجلون نجاح كل خطوة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التقييم والتحسين: يدير المعلم مقارنة بين خطط المجموعات، والطلبة يقيّمون خطتهم ويقترحون تحسينًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. القمح والدقيق: يشرح المعلم باختصار فصل القشور عن الحبوب بالغربلة، والطلبة يربطون الفكرة بطرق الفصل (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – فصل حبوب السوق: تقترح المجموعات طرقًا لفصل مخلوط من حبوب ومواد صلبة يباع في السوق الشعبي، كالغربلة والانتقاء، وتعرض الطريقة الأنسب (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "للطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}], "comb": ["الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي (5 دقائق)\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها (10 دقائق)\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة (5 دقائق)\n4. يختار الأدوات المناسبة لفصل كل مخلوط (10 دقائق)\n\nمخرج تعليمي آخر:\nيوضح أن الهواء مخلوط من غازات رغم أننا لا نراها (5 دقائق)\nيربط حجم الجزيئات بطريقة الفصل المناسبة (5 دقائق)\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس (10 دقائق)\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها (15 دقيقة)\n\nمخرج تعليمي آخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة (15 دقيقة)\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس (10 دقائق)\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره (15 دقيقة)\n\nمخرج تعليمي آخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله (15 دقيقة)\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة (10 دقائق)\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات (15 دقيقة)\n\nمخرج تعليمي آخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق (15 دقيقة)", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n1. يعرّف المخلوط بأنه مادتان أو أكثر تمتزجان دون تفاعل كيميائي. ← تذكر\n2. يصنع مخاليط من مواد صلبة ويلاحظ أن المواد لا تتغير عند خلطها. ← تطبيق\n3. يفصل مخاليط صلبة بطريقتي الفرز والغربلة. ← تطبيق\n4. يختار الأدوات المناسبة لفصل كل مخلوط. ← تطبيق\nالمخرج الآخر: يوضح أن الهواء مخلوط من غازات رغم أننا لا نراها. ← فهم\nالمخرج الآخر: يربط حجم الجزيئات بطريقة الفصل المناسبة. ← تحليل\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n1. يفصل برادة الحديد أو الدبابيس عن الرمل باستخدام المغناطيس. ← تطبيق\n2. يفسر سبب نجاح المغناطيس في فصل بعض المخاليط دون غيرها. ← فهم\nالمخرج الآخر: يوضح كيف تُستخدم المغانط في أماكن تجميع الخردة. ← تطبيق\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n1. يقارن بين طرق الفصل: الفرز والغربلة والمغناطيس. ← تحليل\n2. يتنبأ بأفضل طريقة لفصل مخاليط جديدة ويعلل اختياره. ← تطبيق\nالمخرج الآخر: يتذكر التبخير طريقةً لفصل الملح عن محلوله. ← تذكر\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n1. يصمم خطة متسلسلة لفصل مخلوط من أربع مواد باستخدام أكثر من طريقة. ← إبداع\n2. ينفذ خطته ويقيّم نجاحها ويقترح تحسينات. ← تقييم\nالمخرج الآخر: يشرح كيف تُستخدم الغربلة لفصل القشور عن حبوب القمح عند صنع الدقيق. ← فهم", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n- التعلم التعاوني\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التعاوني", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- الكتاب\n- السبورة الذكية\n- أخرى: علب زجاجية، ملاعق، أرز، دقيق، ملح، رمل، سكر، أوراق شاي، فاصوليا، خرز ملون، مخاليط الحصة السابقة، كؤوس، إناء عميق، غربال، مصفاة، ملاقط\n- صورة توضيحية\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n- الكتاب\n- صورة توضيحية\n- أخرى: مغناطيس، برادة حديد أو دبابيس، رمل، فول، أرز، دقيق، غربال، كؤوس، ورقة العمل 3-2\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- الكتاب\n- صورة توضيحية\n- أخرى: مخلوط من فاصوليا وأرز ودقيق ودبابيس، غربال، مغناطيس، أطباق", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\n- المخلوط\n- المكونات\n- المواد الصلبة\n- التفاعل الكيميائي\n- الفرز\n- الغربلة\n- الغربال\n- حجم الجزيئات\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\n- المغناطيس\n- المواد المغناطيسية\n- الحديد\n- الفولاذ\n- الفصل\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\n- طرق الفصل\n- التبخير\n- التنبؤ\n- الاختيار المعلل\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\n- خطة الفصل\n- التسلسل\n- التقييم\n- الغربلة", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nيعرض المعلم كيسًا من حبوب الفاصوليا المتنوعة ويسأل: لماذا يُسمى هذا مخلوطًا؟ ثم يطلب أمثلة لمخاليط من الحياة. (5 دقائق)\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\nيسقط المعلم بعض الدبابيس في الرمل ويسأل: كيف نستخرجها بسرعة دون أن نؤذي أصابعنا؟ (5 دقائق)\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\nيعرض المعلم مخلوط الملح والرمل الذي لم يُفصل في الحصة السابقة، ويسأل: تذكروا الصف الرابع.. كيف استعدنا الملح من الماء؟ (5 دقائق)\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nيعرض المعلم «كيس الكنز»: مخلوط من فاصوليا وأرز ودقيق ودبابيس، ويقول: من يستطيع فصل الكنز كاملًا بأقل الخطوات؟ (5 دقائق)", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة — زمن الحصة 40 دقيقة\n1. تعريف المخلوط: يشرح المعلم ص 56: مادتان أو أكثر تمتزجان دون تفاعل كيميائي ومن السهل فصلهما، والهواء مخلوط من النيتروجين والأكسجين وثاني أكسيد الكربون، والطلبة يكتبون التعريف ويصححون المفهوم الخاطئ عن الهواء (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نشاط 3-2أ: صنع المخاليط: يوزع المعلم المواد (20 g من كل مادة، ونحو 15 حبة من الفاصوليا والخرز) ويوجه التقليب، والطلبة يصنعون: أرز ودقيق، ملح ورمل، شاي وسكر، فاصوليا وخرز؛ ويجيبون: هل ترى المواد؟ هل تغيرت؟ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. يقود المعلم الاستنتاج: لا تتغير حالة المواد في المخلوط ولم تتفاعل، والطلبة يقارنون المخاليط: أيها يسهل رؤية مكوناته؟ (3 دقائق)\nالاستراتيجيات: المناقشة.\n\n4. طرق الفصل: يشرح المعلم ص 57: الفرز للجزيئات الكبيرة المرئية، والغربلة لفصل الكبيرة عن الصغيرة أو الصلب عن السائل، ومثال المزارع وفصل الحصى عن التربة، والطلبة يكملون جدول: الطريقة – متى نستخدمها – مثال (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. نشاط 3-2ب: فصل مخاليط الحصة السابقة: يحدد المعلم الأدوات لكل مجموعة ويناقش اختياراتها قبل التنفيذ، والطلبة يختارون الطريقة لكل مخلوط وينفذون الفصل ويسجلون النتيجة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مناقشة السؤالين 1 و2: يسأل المعلم: هل هناك مخلوط لم تستطيعوا فصله؟ ولماذا؟ والطلبة يذكرون الملح والرمل ويتوقعون السبب (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (1 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2) — زمن الحصة 40 دقيقة\n1. السلامة: ينبه المعلم: لا تلمسوا البرادة ولا تلتقطوا الدبابيس بأيديكم، واغسلوا أيديكم بعد العمل، والطلبة يستمعون ويكررون قواعد السلامة (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. ورقة العمل 3-2: فصل المخاليط: يوزع المعلم المواد ويناقش الطريقة قبل التنفيذ: رمل وبرادة، فول ودقيق، فول وأرز، والطلبة يختارون الطريقة وينفذون: المغناطيس للبرادة، الغربال أو الفرز للباقي، ويسجلون في الورقة (ص 74) (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحدّث عن: الخردة وتصحيح مفهوم: يوضح المعلم أن المغناطيس يجذب الحديد والفولاذ فقط لا كل الفلزات، ويناقش استخدامه في أماكن الخردة، والطلبة يختبرون علبة ألومنيوم وأخرى من الفولاذ ويقارنون (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها — زمن الحصة 40 دقيقة\n1. حل اللغز (فكرة): يشرح المعلم الفكرة: نضيف الماء فيذوب الملح، نفصل الرمل، ثم نبخر الماء فيبقى الملح (ستدرس تفصيلًا لاحقًا)، والطلبة يرسمون مخططًا لخطوات الفصل (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. السؤال 3 ص 57: اختر وعلّل: يوجه المعلم التنبؤ بأفضل طريقة لفصل: الفول السوداني والفاصوليا، الملح وفتات الخبز، البازلاء والدقيق، والطلبة يقترحون الطريقة ويعللون في ثنائيات ثم يعرضون (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. جدول المقارنة: يقود المعلم بناء جدول: الطريقة – المبدأ – مثال – متى لا تنجح، والطلبة يكملون الجدول في الدفتر (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد — زمن الحصة 40 دقيقة\n1. التخطيط: يطلب المعلم خطة مكتوبة متسلسلة بالأدوات قبل التنفيذ، ويراجعها مع كل مجموعة، والطلبة يكتبون: المغناطيس للدبابيس، الفرز للفاصوليا، الغربال للأرز والدقيق (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التنفيذ: يتابع المعلم السلامة والدقة ويحسب الوقت، والطلبة ينفذون الخطة ويسجلون نجاح كل خطوة (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التقييم والتحسين: يدير المعلم مقارنة بين خطط المجموعات، والطلبة يقيّمون خطتهم ويقترحون تحسينًا (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. القمح والدقيق: يشرح المعلم باختصار فصل القشور عن الحبوب بالغربلة، والطلبة يربطون الفكرة بطرق الفصل (3 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – فصل حبوب السوق: تقترح المجموعات طرقًا لفصل مخلوط من حبوب ومواد صلبة يباع في السوق الشعبي، كالغربلة والانتقاء، وتعرض الطريقة الأنسب (5 دقائق)\nالاستراتيجيات: حل المشكلات.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المخلوط؟\n   الإجابة النموذجية: مادتان أو أكثر تمتزجان مع بعضهما دون تفاعل كيميائي.\n2. [مستوى التطبيق] هل تغيرت حالة الأرز والدقيق بعد خلطهما؟\n   الإجابة النموذجية: لا؛ بقيا صلبين كما هما.\n3. [مستوى الاستدلال] لماذا يُعد الهواء مخلوطًا رغم أننا لا نرى مكوناته؟\n   الإجابة النموذجية: لأنه يتكون من عدة غازات ممتزجة دون تفاعل: النيتروجين والأكسجين وثاني أكسيد الكربون.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما أفضل طريقة لفصل حبات الفاصوليا عن الخرز؟\n   الإجابة النموذجية: الفرز (الالتقاط باليد).\n5. [مستوى التطبيق] ما أفضل طريقة لفصل الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربلة؛ يمر الدقيق من ثقوب الغربال ويبقى الأرز.\n6. [مستوى الاستدلال] لماذا لم تنجح الغربلة في فصل الملح عن الرمل؟\n   الإجابة النموذجية: لأن حبيباتهما متقاربة الحجم فتمران معًا من ثقوب الغربال.\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة الأنسب لفصل برادة الحديد عن الرمل؟\n   الإجابة النموذجية: استخدام المغناطيس.\n2. [مستوى التطبيق] هل يجذب المغناطيس علبة ألومنيوم؟\n   الإجابة النموذجية: لا؛ المغناطيس يجذب الحديد والفولاذ وليس كل الفلزات.\n3. [مستوى الاستدلال] لماذا لا يصلح المغناطيس لفصل الفول عن الأرز؟\n   الإجابة النموذجية: لأن الفول والأرز ليسا مادتين مغناطيسيتين.\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أفضل طريقة لفصل الفول السوداني عن الفاصوليا؟\n   الإجابة النموذجية: الفرز؛ لأن الحبات كبيرة يسهل التقاطها.\n2. [مستوى التطبيق] ما أفضل طريقة لفصل الملح عن فتات الخبز؟\n   الإجابة النموذجية: الغربلة إذا كان الفتات أكبر من حبيبات الملح.\n3. [مستوى الاستدلال] متى لا ينجح الفرز في الفصل؟\n   الإجابة النموذجية: عندما تكون الجزيئات صغيرة جدًا أو متشابهة يصعب التقاطها.\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] بأي خطوة بدأت مجموعتك؟ ولماذا؟\n   الإجابة النموذجية: بالمغناطيس لإزالة الدبابيس أولًا حفاظًا على السلامة (تقبل الإجابات المعللة).\n2. [مستوى التطبيق] ما الأداة التي فصلت الأرز عن الدقيق؟\n   الإجابة النموذجية: الغربال.\n3. [مستوى الاستدلال] اقترح تحسينًا يقلل زمن الفصل.\n   الإجابة النموذجية: تقبل المقترحات المنطقية مثل استخدام الغربال قبل الفرز.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مثالين لمخاليط من مواد صلبة.\n   الإجابة النموذجية: الملح والرمل، الأرز والدقيق (أو الفاصوليا والخرز).\n2. [مستوى التطبيق] في أي المخاليط يصعب رؤية المكونات منفصلة؟\n   الإجابة النموذجية: الملح والرمل (حبيبات صغيرة متشابهة اللون).\n3. [مستوى الاستدلال] هل صنع المخلوط تغير قابل للعكس؟ علّل.\n   الإجابة النموذجية: نعم؛ لأن المواد لم تتغير ويمكن فصلها مرة أخرى.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما الغربلة؟\n   الإجابة النموذجية: طريقة لفصل الجزيئات الكبيرة عن الصغيرة (أو الصلب عن السائل) بالغربال.\n5. [مستوى التطبيق] متى نستخدم الفرز؟\n   الإجابة النموذجية: عندما تكون الجزيئات كبيرة ويسهل رؤيتها والتقاطها.\n6. [مستوى الاستدلال] ما طريقة الفصل الأنسب لحبيبات البازلاء والدقيق؟ ولماذا؟\n   الإجابة النموذجية: الغربلة؛ لأن الدقيق ناعم يمر من الثقوب والبازلاء كبيرة تبقى.\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين ينجذبان إلى المغناطيس.\n   الإجابة النموذجية: الحديد والفولاذ.\n2. [مستوى التطبيق] كيف تُفصل قطع الحديد عن المعادن الأخرى في أماكن تجميع الخردة؟\n   الإجابة النموذجية: باستخدام مغناطيس كبير يجذب الحديد.\n3. [مستوى الاستدلال] لماذا يجب عدم لمس برادة الحديد؟\n   الإجابة النموذجية: لأن لها حوافًا حادة قد تسبب إصابات خصوصًا للعينين.\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الطريقة التي تفصل الملح عن الماء؟\n   الإجابة النموذجية: التبخير.\n2. [مستوى التطبيق] لماذا لا نستخدم المغناطيس لفصل الملح عن الرمل؟\n   الإجابة النموذجية: لأنهما ليسا مادتين مغناطيسيتين.\n3. [مستوى الاستدلال] رتب خطوات فصل الملح عن الرمل.\n   الإجابة النموذجية: إضافة الماء وتحريكه ليذوب الملح، فصل الرمل، ثم تبخير الماء ليبقى الملح.\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاث طرق لفصل المخاليط الصلبة.\n   الإجابة النموذجية: الفرز والغربلة والمغناطيس.\n2. [مستوى التطبيق] لماذا يُعد التخطيط مهمًا قبل الفصل؟\n   الإجابة النموذجية: لاختيار الأدوات المناسبة وترتيب الخطوات بأمان وفعالية.\n3. [مستوى الاستدلال] صمم خطة لفصل مخلوط من الرمل والحصى وبرادة الحديد.\n   الإجابة النموذجية: المغناطيس لبرادة الحديد، ثم الغربال لفصل الحصى عن الرمل.", "الحصة 1: ما المخلوط؟ صنع مخاليط من مواد صلبة\nللطالب: قراءة كتاب الطالب ص 56 والبحث عن ثلاثة مخاليط في المنزل. لولي الأمر: يُرجى مساعدة الابن في التعرف على مخاليط المطبخ.\nللطالب: مراجعة ص 57 والإجابة عن السؤال 3 في الدفتر. لولي الأمر: يُرجى إشراك الابن في تنقية الأرز أو غربلة الطحين في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20\n\nالحصة 2: الفصل بالمغناطيس (ورقة العمل 3-2)\nللطالب: إكمال ورقة العمل 3-2 (كتاب النشاط ص 74). لولي الأمر: يُرجى مساعدة الابن في اختبار أي الأدوات المنزلية تنجذب إلى مغناطيس الثلاجة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20\n\nالحصة 3: مقارنة طرق الفصل والتنبؤ بأفضلها\nللطالب: حل تمرين 3-2 في كتاب النشاط ص 38 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في طرق فصل يستخدمها في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20\n\nالحصة 4: تحدي الفصل: تصميم خطة لفصل مخلوط معقد\nللطالب: إكمال تمرين 3-2 (كتاب النشاط ص 38) ومراجعة ص 56–57. لولي الأمر: يُرجى تشجيع الابن على شرح خطة الفصل التي نفذها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=20"]}, {"id": "3-3", "title": "المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58–59 | كتاب النشاط ص 39، 75 | دليل المعلم ص 77–80", "n": 4, "per": [{"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 58 | دليل المعلم ص 77–78", "num": "الحصة الأولى من 5", "focus": "ما الذوبان؟ المواد القابلة للذوبان وغير القابلة للذوبان"}, "f": ["1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة (10 دقائق)\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول (5 دقائق)\n3. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية (5 دقائق)\n4. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته (10 دقائق)\n\nمخرج تعليمي آخر:\nيوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء (5 دقائق)\nيحدد ما إذا كانت ملاحظاته تدعم تنبؤاته (5 دقائق)", "1. يعرّف المادة القابلة للذوبان والمادة غير القابلة للذوبان بأمثلة. ← تذكر\n2. يتنبأ بالمواد الصلبة التي تذوب في الماء ويسجل تنبؤاته في جدول. ← تطبيق\n3. ينفذ استقصاءً لمعرفة المواد القابلة للذوبان وغير القابلة للذوبان باستخدام كميات متساوية. ← تطبيق\n4. يقارن بين المخاليط الشفافة والضبابية ويسجل ملاحظاته واستنتاجاته. ← تحليل\nالمخرج الآخر: يوضح أن جزيئات المادة الذائبة تنتشر بين جزيئات الماء. ← فهم\nالمخرج الآخر: يحدد ما إذا كانت ملاحظاته تدعم تنبؤاته. ← تقييم", "- التعلم بالاكتشاف\n- العصف الذهني\n- فكّر – زاوج – شارك\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: ماء ساخن، حبيبات قهوة، سكر، رمل، كأس زجاجية، مخبار مدرج، كؤوس، ملعقة صغيرة، ملح، دقيق، بلورات برمنجنات البوتاسيوم، ملقط", "- الذوبان\n- قابل للذوبان\n- غير قابل للذوبان\n- الجزيئات\n- المحلول\n- المخلوط الشفاف\n- المخلوط الضبابي\n- الملاحظة\n- الاستنتاج", "يضيف المعلم ماءً ساخنًا إلى ملعقة من حبيبات القهوة أمام الطلبة ويسأل: أين ذهبت الحبيبات؟ هل اختفت؟ (5 دقائق)", "1. مفهوم الذوبان: يشرح المعلم ص 58: السكر يذوب فهو قابل للذوبان، والرمل لا يذوب فهو غير قابل؛ والجزيئات الصغيرة تنتشر في الماء، والطلبة يكتبون التعريفين ويرسمون جزيئات تنتشر (4 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. عصف ذهني: ماذا يذوب؟: يطلب المعلم اقتراح مواد تذوب وأخرى لا تذوب ويدونها على السبورة، والطلبة يقترحون: ملح، عصير مسحوق؛ رمل، حصى، دقيق (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. جدول التنبؤات: يرسم المعلم جدول ص 58 (المادة – التنبؤ – الملاحظة – الاستنتاج) للملح والدقيق والرمل وبرمنجنات البوتاسيوم، والطلبة يملؤون عمود التنبؤ استعدادًا للاستقصاء (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. السلامة: ينبه المعلم: برمنجنات البوتاسيوم ضارة، تُنقل بالملقط ولا تُلمس ولا تُتذوق، وغسل اليدين عند اللمس، والطلبة يكررون قواعد السلامة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. نشاط 3-3: التنفيذ: يوجه المعلم وضع 100 mL ماء في كل كأس وإضافة ملعقة صغيرة من كل مادة وتحريكها، والطلبة ينفذون ويلاحظون: الملح والبرمنجنات تذوبان (شفاف/ملون)، الدقيق والرمل لا يذوبان (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n6. التسجيل والاستنتاج: يوجه المعلم إكمال أعمدة الملاحظة والاستنتاج ومقارنتها بالتنبؤ، والطلبة يكملون الجدول ويحددون صحة تنبؤاتهم (4 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام والتقويم: يطرح المعلم التقويم الختامي ويترك الكؤوس خمس دقائق لمتابعتها في الحصة القادمة، والطلبة يجيبون فرديًا (1 دقيقة)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ماذا نسمي المادة التي تذوب في السائل؟\n   الإجابة النموذجية: مادة قابلة للذوبان.\n2. [مستوى التطبيق] أعطِ مثالًا لمادة غير قابلة للذوبان في الماء.\n   الإجابة النموذجية: الرمل.\n3. [مستوى الاستدلال] هل اختفت القهوة عندما ذابت؟ وضح.\n   الإجابة النموذجية: لا؛ تفتتت إلى جزيئات صغيرة جدًا انتشرت في الماء ولا تزال موجودة.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] لماذا نضع 100 mL ماء في كل كأس؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فتكون كمية الماء متساوية.\n5. [مستوى التطبيق] صف مخلوط الدقيق والماء.\n   الإجابة النموذجية: ضبابي ويمكن رؤية حبيبات الدقيق.\n6. [مستوى الاستدلال] لماذا تحول لون الماء إلى البنفسجي مع برمنجنات البوتاسيوم؟\n   الإجابة النموذجية: لأنها ذابت وانتشرت جزيئاتها الملونة في الماء.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] هل السكر قابل للذوبان في الماء؟\n   الإجابة النموذجية: نعم.\n2. [مستوى التطبيق] تنبأ: هل يذوب الدقيق في الماء؟\n   الإجابة النموذجية: لا، يتوزع في الماء ويبقى مرئيًا (غير قابل للذوبان).\n3. [مستوى الاستدلال] كيف تثبت أن الملح الذائب في الماء ما زال موجودًا؟\n   الإجابة النموذجية: بتذوق محلول الملح (آمن) فيكون طعمه مالحًا، أو بتبخير الماء فيبقى الملح.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما المواد التي ذابت في الماء في استقصائك؟\n   الإجابة النموذجية: الملح وبرمنجنات البوتاسيوم.\n5. [مستوى التطبيق] كيف عرفت أن الرمل لم يذب؟\n   الإجابة النموذجية: لأنه بقي مرئيًا واستقر في قاع الكأس.\n6. [مستوى الاستدلال] هل كانت تنبؤاتك صحيحة؟ استشهد بمادة واحدة.\n   الإجابة النموذجية: تعتمد على تنبؤ الطالب مع الاستشهاد بالملاحظة.", "للطالب: قراءة كتاب الطالب ص 58، وتجربة إذابة السكر والملح في كوب ماء بالمنزل. لولي الأمر: يُرجى الإشراف على التجربة المنزلية وعدم استخدام مواد غير غذائية.\nللطالب: مراجعة جدول الملاحظات ومراجعة ص 58. لولي الأمر: يُرجى سؤال الابن عن المواد التي ذابت ولم تذب في تجربته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=21"]}, {"h": {"lesson": "3-3 المواد القابلة للذوبان وغير القابلة للذوبان", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الثالث عشر (29/11–3/12/2026)", "pages": "كتاب الطالب ص 59 | دليل المعلم ص 78–80", "num": "الحصة الثالثة من 5", "focus": "المخلوط المعلّق: ماذا يحدث بعد خمس دقائق؟"}, "f": ["1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو) (15 دقيقة)\n2. يعرّف المخلوط المعلّق ويميزه من المحلول (10 دقائق)\n\nمخرج تعليمي آخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء (15 دقيقة)", "1. يصف ما يحدث للمواد غير القابلة للذوبان عند ترك المخلوط (تستقر أو تطفو). ← فهم\n2. يعرّف المخلوط المعلّق ويميزه من المحلول. ← فهم\nالمخرج الآخر: يفسر أهمية استخدام الكميات نفسها من الماء والمواد الصلبة في الاستقصاء. ← تحليل", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n-
