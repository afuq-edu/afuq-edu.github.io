موذجية: الفأر.\n3. [مستوى الاستدلال] ارسم سلسلة صحراوية تنتهي بالسحلية.\n   الإجابة النموذجية: نباتات صحراوية ← جرادة/نملة ← عنكبوت ← سحلية.", "1. [مستوى المعرفة] اذكر حيوانًا صحراويًا يتغذى على النباتات.\n   الإجابة النموذجية: الظبي أو النملة أو الخنفساء أو اليرقة.\n2. [مستوى التطبيق] ما المفترس الأعلى في السلسلة: نباتات ← خنفساء ← فأر ← بومة؟\n   الإجابة النموذجية: البومة.\n3. [مستوى الاستدلال] لماذا تكون أعداد الكائنات في الصحراء أقل منها في الغابة الاستوائية؟\n   الإجابة النموذجية: لقلة الماء والنباتات المنتجة فلا يكفي الغذاء لأعداد كبيرة.", "للطالب: إكمال تمرين 2-4 في كتاب النشاط ص 29–30 واجبًا منزليًا. لولي الأمر: يُرجى الحديث مع الابن عن حيوانات الصحراء العُمانية مثل المها العربية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40–41 | كتاب النشاط ص 29–30 | دليل المعلم ص 54–55", "num": "الحصة الخامسة من 5", "focus": "مشروع مقارنة المواطن: لوحة السلاسل الغذائية"}, "f": ["1. يقارن بين المواطن الطبيعية من حيث المنتجات والمستهلكات والمفترسات.\n2. يصمم لوحة تعرض سلسلة غذائية من موطن محدد بدقة علمية.\nمخرج تعليمي آخر: يعرض مشروعه بلغة علمية واضحة ويقيم مشاريع زملائه.", "1. يقارن بين المواطن الطبيعية من حيث المنتجات والمستهلكات والمفترسات. ← تحليل\n2. يصمم لوحة تعرض سلسلة غذائية من موطن محدد بدقة علمية. ← إبداع\nالمخرج الآخر: يعرض مشروعه بلغة علمية واضحة ويقيم مشاريع زملائه. ← تقييم", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- صورة توضيحية\n- الأقلام\n- جهاز الحاسب\n- أخرى: أوراق كبيرة، صور مطبوعة، صمغ", "- الموطن\n- المقارنة\n- السلسلة الغذائية\n- المنتج\n- المفترس الأعلى", "يعرض المعلم «بطاقات المواطن» (سافانا، محيط، صحراء، غابة استوائية) مقلوبة، وتسحب كل مجموعة بطاقة تحدد موطن مشروعها.", "1) التهيئة: سحب البطاقات (4 دقائق: 0–4)\n   المعلم: يدير السحب ويعرض معايير اللوحة.\n   الطالب: تسحب كل مجموعة موطنها.\n2) تصميم اللوحة (18 دقائق: 4–22)\n   المعلم: يتابع المجموعات: صورة الموطن، مناخه، سلسلة من 3–4 حلقات، تحديد المنتج والفريسة والمفترس.\n   الطالب: يصممون اللوحة ويوزعون المهام.\n3) العرض والمقارنة (10 دقائق: 22–32)\n   المعلم: يدير عرضًا سريعًا (دقيقتان لكل مجموعة) ويكتب جدول مقارنة على السبورة.\n   الطالب: يعرضون ويكملون جدول المقارنة.\n4) تقييم الأقران (3 دقائق: 32–35)\n   المعلم: يوزع بطاقة تقييم بسيطة (الدقة، الوضوح، التنظيم).\n   الطالب: يقيّمون لوحات زملائهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المنتج في موطن مجموعتك؟\n   الإجابة النموذجية: تعتمد على الموطن: عشب/أشجار، عوالق، نباتات صحراوية...\n2. [مستوى التطبيق] ما وجه الشبه بين جميع السلاسل المعروضة؟\n   الإجابة النموذجية: كلها تبدأ بكائن منتج.\n3. [مستوى الاستدلال] ما وجه الاختلاف الرئيسي بين سلاسل المحيط والسافانا؟\n   الإجابة النموذجية: نوع المنتجات والحيوانات المختلف تبعًا لاختلاف الموطن.", "1. [مستوى المعرفة] اذكر موطنين ومنتجًا في كل منهما.\n   الإجابة النموذجية: السافانا: العشب؛ المحيط: العوالق (أو الصحراء: النباتات الصحراوية).\n2. [مستوى التطبيق] لماذا تختلف السلاسل الغذائية من موطن لآخر؟\n   الإجابة النموذجية: لأن المواطن المختلفة تضم نباتات وحيوانات مختلفة.\n3. [مستوى الاستدلال] اقترح تحسينًا للوحة إحدى المجموعات مع التعليل.\n   الإجابة النموذجية: تقبل المقترحات المعللة مثل إضافة سهم صحيح أو مفترس أعلى أو عنوان.", "للطالب: مراجعة كتاب الطالب ص 40–41 والاستعداد لدرس إزالة الغابات. لولي الأمر: يُرجى مساعدة الابن على جمع معلومات عن غابات العالم وأهميتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}], "comb": ["الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط.\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن.\nمخرج تعليمي آخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية.\n\nالحصة 2: السلاسل الغذائية في السافانا\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا.\n2. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة.\nمخرج تعليمي آخر: يتنبأ بأثر موت المفترسات في السافانا.\n\nالحصة 3: السلاسل الغذائية في المحيط\n1. يوضح أن العوالق والطحالب هي المنتجات في المحيط.\n2. يرسم سلاسل غذائية بحرية بها مفترس واحد وأخرى بها مفترسان.\nمخرج تعليمي آخر: يقارن بين الكائنات المنتجة في السافانا والمحيط.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n1. يحلل السلاسل الغذائية في موطن الصحراء ويرسمها.\n2. يذكر مصادر الماء للنباتات في الصحراء.\nمخرج تعليمي آخر: يطبق مفهومي المفترس والفريسة على حيوانات الصحراء.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n1. يقارن بين المواطن الطبيعية من حيث المنتجات والمستهلكات والمفترسات.\n2. يصمم لوحة تعرض سلسلة غذائية من موطن محدد بدقة علمية.\nمخرج تعليمي آخر: يعرض مشروعه بلغة علمية واضحة ويقيم مشاريع زملائه.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط. ← تذكر\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن. ← فهم\nالمخرج الآخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية. ← تطبيق\n\nالحصة 2: السلاسل الغذائية في السافانا\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا. ← فهم\n2. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة. ← تطبيق\nالمخرج الآخر: يتنبأ بأثر موت المفترسات في السافانا. ← تحليل\n\nالحصة 3: السلاسل الغذائية في المحيط\n1. يوضح أن العوالق والطحالب هي المنتجات في المحيط. ← فهم\n2. يرسم سلاسل غذائية بحرية بها مفترس واحد وأخرى بها مفترسان. ← تطبيق\nالمخرج الآخر: يقارن بين الكائنات المنتجة في السافانا والمحيط. ← تحليل\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n1. يحلل السلاسل الغذائية في موطن الصحراء ويرسمها. ← تحليل\n2. يذكر مصادر الماء للنباتات في الصحراء. ← تذكر\nالمخرج الآخر: يطبق مفهومي المفترس والفريسة على حيوانات الصحراء. ← تطبيق\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n1. يقارن بين المواطن الطبيعية من حيث المنتجات والمستهلكات والمفترسات. ← تحليل\n2. يصمم لوحة تعرض سلسلة غذائية من موطن محدد بدقة علمية. ← إبداع\nالمخرج الآخر: يعرض مشروعه بلغة علمية واضحة ويقيم مشاريع زملائه. ← تقييم", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- الخرائط الذهنية والمفاهيمية\n\nالحصة 2: السلاسل الغذائية في السافانا\n- التعلم التعاوني\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب\n\nالحصة 3: السلاسل الغذائية في المحيط\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم بالنمذجة\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية\n\nالحصة 2: السلاسل الغذائية في السافانا\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 3: السلاسل الغذائية في المحيط\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-4 في كتاب النشاط\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n- الكتاب\n- صورة توضيحية\n- الأقلام\n- جهاز الحاسب\n- أخرى: أوراق كبيرة، صور مطبوعة، صمغ", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n- الموطن الطبيعي\n- المناخ\n- الغابة الاستوائية\n- الصحراء\n- السافانا\n\nالحصة 2: السلاسل الغذائية في السافانا\n- السافانا\n- آكلات الأعشاب\n- الثور البري\n- الزرافة\n- المفترس\n\nالحصة 3: السلاسل الغذائية في المحيط\n- المحيط\n- العوالق\n- الطحالب\n- السردين\n- النورس\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n- الصحراء\n- الضباب الموسمي\n- قطرات الندى\n- القط الرملي\n- الصقر\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n- الموطن\n- المقارنة\n- السلسلة الغذائية\n- المنتج\n- المفترس الأعلى", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nيعرض المعلم أربع صور: صحراء، تحت سطح الماء، سهول قطبية، غابة؛ ويسأل: هل تنمو النباتات نفسها في كل هذه الأماكن؟\n\nالحصة 2: السلاسل الغذائية في السافانا\nيُسمع المعلم الطلبة صوت زئير أسد، ويسأل: أين يعيش؟ وماذا يأكل؟ ومن يأكل الطعام الذي يأكله الأسد؟\n\nالحصة 3: السلاسل الغذائية في المحيط\nيسأل المعلم: يغطي الماء نحو ثلاثة أرباع سطح الأرض. ماذا تأكل الأسماك في وسط المحيط بعيدًا عن النباتات الكبيرة؟\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nيسأل المعلم: كيف تحصل نباتات الصحراء على الماء والأمطار قليلة؟ ويعرض صورة لضباب ظفار الموسمي.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nيعرض المعلم «بطاقات المواطن» (سافانا، محيط، صحراء، غابة استوائية) مقلوبة، وتسحب كل مجموعة بطاقة تحدد موطن مشروعها.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n1) التهيئة: أربع صور (5 دقائق: 0–5)\n   المعلم: يعرض الصور ويطرح السؤال.\n   الطالب: يقارنون ويقترحون أسباب الاختلاف.\n2) المناخ والموطن (10 دقائق: 5–15)\n   المعلم: يشرح ص 40: المناخ الحار الرطب للغابات الاستوائية، الحار الجاف للصحراء، الحار مع أمطار صيفية للسافانا.\n   الطالب: يملؤون جدولًا: الموطن – المناخ – نباتات – حيوانات.\n3) رحلة على الكرة الأرضية (10 دقائق: 15–25)\n   المعلم: يحدد على المجسم مواقع الغابات الاستوائية والصحاري والسافانا في إفريقيا.\n   الطالب: يحددون موقع عُمان ونوع موطنها الغالب.\n4) مواطن عُمانية (10 دقائق: 25–35)\n   المعلم: يقود مناقشة: الجبال، السواحل، الصحراء، الأفلاج.\n   الطالب: يذكرون كائنات من كل موطن عماني.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: السلاسل الغذائية في السافانا\n1) التهيئة: زئير الأسد (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقود إلى السافانا.\n   الطالب: يجيبون ويتوقعون غذاء الأسد.\n2) سلاسل السافانا ص 40 (12 دقائق: 5–17)\n   المعلم: يناقش الأسئلة في الكتاب: المنتجات، المستهلكات، المفترسات وفرائسها، ماذا يأكل كل حيوان.\n   الطالب: يحددون في الصورة ويكتبون في جدول.\n3) السؤال 2 ص 41 (10 دقائق: 17–27)\n   المعلم: يوجه: ثلاثة حيوانات تأكل النباتات فقط، وسلسلتان بهما مفترس وفريسة.\n   الطالب: يكتبون: الزرافة تأكل أوراق الأشجار، الثور البري والحمار الوحشي العشب؛ ويرسمون السلاسل.\n4) تحدّث عن: موت المفترسات (8 دقائق: 27–35)\n   المعلم: يطرح سؤال «تحدّث عن» ص 41.\n   الطالب: يتنبؤون بالتسلسل: زيادة آكلات العشب، نقص العشب، مجاعة.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: السلاسل الغذائية في المحيط\n1) التهيئة: غذاء الأسماك (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويستمع للتوقعات.\n   الطالب: يقترحون أفكارهم.\n2) العوالق (10 دقائق: 5–15)\n   المعلم: يشرح ص 41: العوالق كائنات صغيرة جدًا، منها نباتات منتجة وطحالب؛ ويعرض صورة مجهرية.\n   الطالب: يكتبون: العوالق والطحالب منتجات المحيط.\n3) السؤال 3 ص 41 (12 دقائق: 15–27)\n   المعلم: يوجه رسم سلسلتين بمفترس واحد وسلسلتين بمفترسين.\n   الطالب: يرسمون: عوالق ← أسماك صغيرة ← نورس؛ عوالق ← سردين ← سمكة كبيرة ← إنسان.\n4) السؤال 1: المقارنة (8 دقائق: 27–35)\n   المعلم: يوجه مقارنة المنتجات في السافانا والمحيط في جدول.\n   الطالب: يكملون الجدول: السافانا: عشب وأشجار؛ المحيط: عوالق وطحالب.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n1) التهيئة: ماء الصحراء (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويعرض الصورة.\n   الطالب: يقترحون: الندى، الضباب، الجذور العميقة.\n2) تمرين 2-4 (ص 29–30) (15 دقائق: 5–20)\n   المعلم: يوجه الحل: المنتجات (أعشاب ونباتات صحراوية)، مصادر الماء، آكلات النبات، المفترسات وفرائسها.\n   الطالب: يحلون فرديًا: القط الرملي يأكل الفأر، السحلية تأكل العنكبوت، الصقر يأكل السحلية.\n3) رسم سلسلة صحراوية (8 دقائق: 20–28)\n   المعلم: يطلب سلسلة من أربع حلقات.\n   الطالب: يرسمون: نباتات صحراوية ← خنفساء ← فأر ← بومة.\n4) التصحيح بالأقران (7 دقائق: 28–35)\n   المعلم: يعرض الإجابات النموذجية.\n   الطالب: يتبادلون الكتب ويصححون.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n1) التهيئة: سحب البطاقات (4 دقائق: 0–4)\n   المعلم: يدير السحب ويعرض معايير اللوحة.\n   الطالب: تسحب كل مجموعة موطنها.\n2) تصميم اللوحة (18 دقائق: 4–22)\n   المعلم: يتابع المجموعات: صورة الموطن، مناخه، سلسلة من 3–4 حلقات، تحديد المنتج والفريسة والمفترس.\n   الطالب: يصممون اللوحة ويوزعون المهام.\n3) العرض والمقارنة (10 دقائق: 22–32)\n   المعلم: يدير عرضًا سريعًا (دقيقتان لكل مجموعة) ويكتب جدول مقارنة على السبورة.\n   الطالب: يعرضون ويكملون جدول المقارنة.\n4) تقييم الأقران (3 دقائق: 32–35)\n   المعلم: يوزع بطاقة تقييم بسيطة (الدقة، الوضوح، التنظيم).\n   الطالب: يقيّمون لوحات زملائهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n1. [مستوى المعرفة] لماذا توجد مواطن طبيعية عديدة على الأرض؟\n   الإجابة النموذجية: بسبب تعدد المناخات مما يؤدي إلى وجود نباتات مختلفة.\n2. [مستوى التطبيق] ما مناخ الغابة الاستوائية؟\n   الإجابة النموذجية: حار رطب.\n3. [مستوى الاستدلال] لماذا تختلف حيوانات الصحراء عن حيوانات الغابة الاستوائية؟\n   الإجابة النموذجية: لأن النباتات المختلفة تجذب حيوانات مختلفة، والمناخ يحدد الكائنات القادرة على العيش.\n\nالحصة 2: السلاسل الغذائية في السافانا\n1. [مستوى المعرفة] ما الكائنات المنتجة في السافانا؟\n   الإجابة النموذجية: العشب والأشجار.\n2. [مستوى التطبيق] ماذا تأكل الزرافة؟\n   الإجابة النموذجية: أوراق الأشجار.\n3. [مستوى الاستدلال] ارسم سلسلة غذائية تنتهي بالأسد.\n   الإجابة النموذجية: العشب ← الحمار الوحشي ← الأسد (أو أوراق الأشجار ← الزرافة ← الأسد).\n\nالحصة 3: السلاسل الغذائية في المحيط\n1. [مستوى المعرفة] ما المقصود بالعوالق؟\n   الإجابة النموذجية: كائنات حية صغيرة جدًا يصعب رؤيتها بالعين المجردة تعيش في الماء.\n2. [مستوى التطبيق] ما المنتج في السلسلة: عوالق ← سمكة صغيرة ← نورس؟\n   الإجابة النموذجية: العوالق.\n3. [مستوى الاستدلال] قارن بين المنتجات في السافانا والمحيط.\n   الإجابة النموذجية: في السافانا العشب والأشجار، وفي المحيط العوالق والطحالب.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n1. [مستوى المعرفة] اذكر مصدرين للماء في الصحراء.\n   الإجابة النموذجية: الأمطار القليلة والضباب الموسمي وقطرات الندى.\n2. [مستوى التطبيق] ما فريسة القط الرملي؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] ارسم سلسلة صحراوية تنتهي بالسحلية.\n   الإجابة النموذجية: نباتات صحراوية ← جرادة/نملة ← عنكبوت ← سحلية.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n1. [مستوى المعرفة] ما المنتج في موطن مجموعتك؟\n   الإجابة النموذجية: تعتمد على الموطن: عشب/أشجار، عوالق، نباتات صحراوية...\n2. [مستوى التطبيق] ما وجه الشبه بين جميع السلاسل المعروضة؟\n   الإجابة النموذجية: كلها تبدأ بكائن منتج.\n3. [مستوى الاستدلال] ما وجه الاختلاف الرئيسي بين سلاسل المحيط والسافانا؟\n   الإجابة النموذجية: نوع المنتجات والحيوانات المختلف تبعًا لاختلاف الموطن.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\n1. [مستوى المعرفة] اذكر موطنين طبيعيين مختلفين.\n   الإجابة النموذجية: مثل: الصحراء والمحيط (أو السافانا والغابة الاستوائية).\n2. [مستوى التطبيق] ما نوع الموطن الغالب في عُمان؟\n   الإجابة النموذجية: الصحراوي، مع مواطن جبلية وساحلية.\n3. [مستوى الاستدلال] توقع: أي الموطنين فيه تنوع نباتي أكبر، الغابة الاستوائية أم الصحراء؟ ولماذا؟\n   الإجابة النموذجية: الغابة الاستوائية؛ لوفرة الماء والحرارة المناسبة لنمو نباتات كثيرة.\n\nالحصة 2: السلاسل الغذائية في السافانا\n1. [مستوى المعرفة] اذكر مفترسين من السافانا.\n   الإجابة النموذجية: الأسد والفهد (أو النمر والضبع).\n2. [مستوى التطبيق] ما الحيوانات التي تتغذى على الحيوانات الميتة؟\n   الإجابة النموذجية: النسور.\n3. [مستوى الاستدلال] ماذا سيحدث للعشب إذا ماتت فجأة كل المفترسات؟\n   الإجابة النموذجية: سيقل كثيرًا لأن أعداد آكلات العشب ستزداد وتأكله.\n\nالحصة 3: السلاسل الغذائية في المحيط\n1. [مستوى المعرفة] ارسم سلسلة غذائية بحرية تنتهي بالإنسان.\n   الإجابة النموذجية: عوالق ← قشريات ← إنسان (أو عوالق ← سردين ← إنسان).\n2. [مستوى التطبيق] لماذا تُعد المواطن البحرية مهمة جدًا؟\n   الإجابة النموذجية: لأنها تغطي نحو ثلاثة أرباع سطح الأرض وتضم أنواعًا كثيرة من الكائنات.\n3. [مستوى الاستدلال] ماذا تتوقع أن يحدث للأسماك إذا قلّت العوالق بسبب التلوث؟\n   الإجابة النموذجية: تقل أعداد الأسماك الصغيرة ثم الأسماك الكبيرة والطيور التي تتغذى عليها.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\n1. [مستوى المعرفة] اذكر حيوانًا صحراويًا يتغذى على النباتات.\n   الإجابة النموذجية: الظبي أو النملة أو الخنفساء أو اليرقة.\n2. [مستوى التطبيق] ما المفترس الأعلى في السلسلة: نباتات ← خنفساء ← فأر ← بومة؟\n   الإجابة النموذجية: البومة.\n3. [مستوى الاستدلال] لماذا تكون أعداد الكائنات في الصحراء أقل منها في الغابة الاستوائية؟\n   الإجابة النموذجية: لقلة الماء والنباتات المنتجة فلا يكفي الغذاء لأعداد كبيرة.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n1. [مستوى المعرفة] اذكر موطنين ومنتجًا في كل منهما.\n   الإجابة النموذجية: السافانا: العشب؛ المحيط: العوالق (أو الصحراء: النباتات الصحراوية).\n2. [مستوى التطبيق] لماذا تختلف السلاسل الغذائية من موطن لآخر؟\n   الإجابة النموذجية: لأن المواطن المختلفة تضم نباتات وحيوانات مختلفة.\n3. [مستوى الاستدلال] اقترح تحسينًا للوحة إحدى المجموعات مع التعليل.\n   الإجابة النموذجية: تقبل المقترحات المعللة مثل إضافة سهم صحيح أو مفترس أعلى أو عنوان.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nللطالب: قراءة كتاب الطالب ص 40 وجمع صور لثلاثة مواطن مختلفة. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور للمواطن الطبيعية في عُمان.\n\nالحصة 2: السلاسل الغذائية في السافانا\nللطالب: رسم سلسلتين غذائيتين من السافانا في الدفتر ومراجعة ص 40–41. لولي الأمر: يُرجى مناقشة الابن في سبب وجود المفترسات الكبيرة في أقفاص بحدائق الحيوان.\n\nالحصة 3: السلاسل الغذائية في المحيط\nللطالب: كتابة سلسلتين غذائيتين بحريتين من بحر عُمان. لولي الأمر: يُرجى توعية الابن بعدم رمي المخلفات على الشواطئ.\n\nالحصة 4: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nللطالب: إكمال تمرين 2-4 في كتاب النشاط ص 29–30 واجبًا منزليًا. لولي الأمر: يُرجى الحديث مع الابن عن حيوانات الصحراء العُمانية مثل المها العربية.\n\nالحصة 5: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nللطالب: مراجعة كتاب الطالب ص 40–41 والاستعداد لدرس إزالة الغابات. لولي الأمر: يُرجى مساعدة الابن على جمع معلومات عن غابات العالم وأهميتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"id": "2-5", "title": "إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 42–43 | كتاب النشاط ص 31، 64–66 | دليل المعلم ص 54–57", "n": 2, "per": [{"h": {"lesson": "2-5 إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 42–43 | دليل المعلم ص 55–56", "num": "الحصة الأولى من 2", "focus": "أسباب إزالة الغابات وآثارها السلبية"}, "f": ["1. يذكر أسباب إزالة الغابات.\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء.\nمخرج تعليمي آخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري.", "1. يذكر أسباب إزالة الغابات. ← تذكر\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء. ← فهم\nالمخرج الآخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري. ← تحليل", "- التعلم بالاكتشاف\n- الخرائط الذهنية والمفاهيمية\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية", "- إزالة الغابات\n- الاحتباس الحراري\n- غازات الدفيئة\n- السماد العضوي\n- خصوبة التربة", "يعرض المعلم عبارة: «تُقطع من الغابات المطيرة مساحة ملعب كرة قدم كل ثانية!» ويسأل: لماذا يقطع الناس الأشجار؟", "1) التهيئة: ملعب كل ثانية (5 دقائق: 0–5)\n   المعلم: يعرض العبارة ويجمع الأسباب المقترحة.\n   الطالب: يقترحون أسبابًا.\n2) أين الغابات الاستوائية؟ (8 دقائق: 5–13)\n   المعلم: يحدد على المجسم: الأمازون، الكونغو، إندونيسيا.\n   الطالب: يحددون المواقع ويقارنونها بموقع عُمان.\n3) الأسباب والآثار (10 دقائق: 13–23)\n   المعلم: يشرح ص 42: الخشب للأثاث والوقود، إخلاء الأرض للزراعة والسكن والصناعة؛ الآثار: فقر التربة، اختفاء الأنواع، زيادة ثاني أكسيد الكربون.\n   الطالب: يكملون خريطة مفاهيمية: أسباب ← إزالة الغابات ← آثار.\n4) غازات الدفيئة والاحتباس الحراري (10 دقائق: 23–33)\n   المعلم: يشرح بتشبيه البيت الزجاجي كيف تحبس الغازات الحرارة، ودور الأشجار في امتصاص ثاني أكسيد الكربون.\n   الطالب: يجيبون عن السؤالين 1 و4 ص 43.\n5) الختام والتقويم (7 دقائق: 33–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] اذكر ثلاثة أسباب لإزالة الغابات.\n   الإجابة النموذجية: جمع الخشب لصناعة الأثاث، أو لحرقه، وإخلاء الأرض للزراعة أو السكن أو الصناعة.\n2. [مستوى التطبيق] ماذا يحدث للتربة بعد إزالة الغابة؟\n   الإجابة النموذجية: تصبح غير خصبة لعدم وجود أوراق متحللة تصنع السماد العضوي.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد في الهواء ويحبس الحرارة.", "1. [مستوى المعرفة] ما المقصود بإزالة الغابات؟\n   الإجابة النموذجية: قطع أشجار الغابات وتدميرها بواسطة الإنسان.\n2. [مستوى التطبيق] ماذا سيحدث لثاني أكسيد الكربون والأكسجين في الهواء إذا دُمرت كل الغابات؟\n   الإجابة النموذجية: سيزداد ثاني أكسيد الكربون ويقل الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعد شراء الأثاث الخشبي المستعمل طريقة جيدة للحفاظ على الغابات؟\n   الإجابة النموذجية: لأنه إعادة استخدام للخشب فلا نحتاج إلى قطع أشجار جديدة.", "للطالب: حل تمرين 2-5 في كتاب النشاط ص 31 (آراء حول إزالة الغابات) واجبًا منزليًا. لولي الأمر: يُرجى المشاركة مع الابن في زراعة شجرة أو الاعتناء بنبتة في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}, {"h": {"lesson": "2-5 إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "wee ", "1. [مستوى المعرفة] لماذا تُسمى الغابات رئة الأرض؟\n   الإجابة النموذجية: لأنها تمتص ثاني أكسيد الكربون وتنتج الأكسجين الذي تحتاجه الكائنات.\n2. [مستوى التطبيق] ما الذي قامت به وانجاري ماثاي؟\n   الإجابة النموذجية: شجعت النساء على زراعة الأشجار في كينيا فزرعن ملايين الأشجار، ونالت جائزة نوبل للسلام.\n3. [مستوى الاستدلال] صنّف: «مزارع قهوة» و«طبيبة»، من المؤيد ومن المعارض لإزالة الغابات؟ وعلل.\n   الإجابة النموذجية: مزارع القهوة مؤيد (يحتاج أرضًا للزراعة)، والطبيبة معارضة (الغابات مصدر للأدوية).", "1. [مستوى المعرفة] اذكر فائدتين للغابات.\n   الإجابة النموذجية: إنتاج الأكسجين وامتصاص ثاني أكسيد الكربون، ومواطن للكائنات، ومصدر للأدوية.\n2. [مستوى التطبيق] ما الجائزة العُمانية العالمية التي تُمنح لجهود حماية البيئة؟\n   الإجابة النموذجية: جائزة السلطان قابوس لحماية البيئة.\n3. [مستوى الاستدلال] اقترح ثلاث طرق يمكن لأسرتك المساهمة بها في حماية الغابات.\n   الإجابة النموذجية: زراعة الأشجار، شراء أثاث مستعمل، تقليل استهلاك الورق وإعادة تدويره.", "للطالب: إكمال ورقة العمل المختارة (ص 64–66) والمشاركة في زراعة شجرة (نشاط 2-5) إن أمكن. لولي الأمر: يُرجى المشاركة مع الابن في يوم الشجرة وتشجيعه على الزراعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}], "comb": ["الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1. يذكر أسباب إزالة الغابات.\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء.\nمخرج تعليمي آخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن).\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة.\nمخرج تعليمي آخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1. يذكر أسباب إزالة الغابات. ← تذكر\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء. ← فهم\nالمخرج الآخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري. ← تحليل\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن). ← فهم\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة. ← فهم\nالمخرج الآخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا. ← تقييم", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n- التعلم بالاكتشاف\n- الخرائط الذهنية والمفاهيمية\n- فكّر – زاوج – شارك\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n- التعلم التشاركي\n- التعلم التعاوني\n- التعلم الذاتي\n- الخرائط الذهنية والمفاهيمية", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: أوراق العمل 2-5أ و2-5ب و2-5ج", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n- إزالة الغابات\n- الاحتباس الحراري\n- غازات الدفيئة\n- السماد العضوي\n- خصوبة التربة\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n- رئة الأرض\n- التنوع الحيوي\n- جائزة السلطان قابوس لحماية البيئة\n- زراعة الأشجار", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nيعرض المعلم عبارة: «تُقطع من الغابات المطيرة مساحة ملعب كرة قدم كل ثانية!» ويسأل: لماذا يقطع الناس الأشجار؟\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nيطرح المعلم سؤال «تحدّث عن» ص 43: لماذا تُسمى الغابات «رئة كوكب الأرض»؟ ويربطه بعمل الرئتين.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1) التهيئة: ملعب كل ثانية (5 دقائق: 0–5)\n   المعلم: يعرض العبارة ويجمع الأسباب المقترحة.\n   الطالب: يقترحون أسبابًا.\n2) أين الغابات الاستوائية؟ (8 دقائق: 5–13)\n   المعلم: يحدد على المجسم: الأمازون، الكونغو، إندونيسيا.\n   الطالب: يحددون المواقع ويقارنونها بموقع عُمان.\n3) الأسباب والآثار (10 دقائق: 13–23)\n   المعلم: يشرح ص 42: الخشب للأثاث والوقود، إخلاء الأرض للزراعة والسكن والصناعة؛ الآثار: فقر التربة، اختفاء الأنواع، زيادة ثاني أكسيد الكربون.\n   الطالب: يكملون خريطة مفاهيمية: أسباب ← إزالة الغابات ← آثار.\n4) غازات الدفيئة والاحتباس الحراري (10 دقائق: 23–33)\n   المعلم: يشرح بتشبيه البيت الزجاجي كيف تحبس الغازات الحرارة، ودور الأشجار في امتصاص ثاني أكسيد الكربون.\n   الطالب: يجيبون عن السؤالين 1 و4 ص 43.\n5) الختام والتقويم (7 دقائق: 33–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1) التهيئة: رئة الأرض (5 دقائق: 0–5)\n   المعلم: يقود المقارنة: الرئتان تأخذان الأكسجين، والأشجار تمتص ثاني أكسيد الكربون وتنتج الأكسجين.\n   الطالب: يفسرون التسمية.\n2) لماذا الغابات مهمة؟ (8 دقائق: 5–13)\n   المعلم: يعرض معلومات ص 43: آلاف الأنواع، أدوية من النباتات، الأكسجين.\n   الطالب: يكتبون ثلاثة أسباب لأهمية الغابات.\n3) أوراق العمل حسب المستوى (14 دقائق: 13–27)\n   المعلم: يوزع: 2-5أ (وانجاري ماثاي) للمستوى المرتفع، 2-5ب (جائزة السلطان قابوس) للدعم، 2-5ج (خرائط مفاهيمية) للجميع.\n   الطالب: يقرؤون ويجيبون ويكملون الخريطة المفاهيمية.\n4) تمرين 2-5: مؤيد أم معارض؟ (8 دقائق: 27–35)\n   المعلم: يناقش تصنيف الآراء في تمرين 2-5 (ص 31) ونشاط زراعة شجرة.\n   الطالب: يصنفون الآراء ويبدون رأيًا معللًا.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1. [مستوى المعرفة] اذكر ثلاثة أسباب لإزالة الغابات.\n   الإجابة النموذجية: جمع الخشب لصناعة الأثاث، أو لحرقه، وإخلاء الأرض للزراعة أو السكن أو الصناعة.\n2. [مستوى التطبيق] ماذا يحدث للتربة بعد إزالة الغابة؟\n   الإجابة النموذجية: تصبح غير خصبة لعدم وجود أوراق متحللة تصنع السماد العضوي.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد في الهواء ويحبس الحرارة.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1. [مستوى المعرفة] لماذا تُسمى الغابات رئة الأرض؟\n   الإجابة النموذجية: لأنها تمتص ثاني أكسيد الكربون وتنتج الأكسجين الذي تحتاجه الكائنات.\n2. [مستوى التطبيق] ما الذي قامت به وانجاري ماثاي؟\n   الإجابة النموذجية: شجعت النساء على زراعة الأشجار في كينيا فزرعن ملايين الأشجار، ونالت جائزة نوبل للسلام.\n3. [مستوى الاستدلال] صنّف: «مزارع قهوة» و«طبيبة»، من المؤيد ومن المعارض لإزالة الغابات؟ وعلل.\n   الإجابة النموذجية: مزارع القهوة مؤيد (يحتاج أرضًا للزراعة)، والطبيبة معارضة (الغابات مصدر للأدوية).", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\n1. [مستوى المعرفة] ما المقصود بإزالة الغابات؟\n   الإجابة النموذجية: قطع أشجار الغابات وتدميرها بواسطة الإنسان.\n2. [مستوى التطبيق] ماذا سيحدث لثاني أكسيد الكربون والأكسجين في الهواء إذا دُمرت كل الغابات؟\n   الإجابة النموذجية: سيزداد ثاني أكسيد الكربون ويقل الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعد شراء الأثاث الخشبي المستعمل طريقة جيدة للحفاظ على الغابات؟\n   الإجابة النموذجية: لأنه إعادة استخدام للخشب فلا نحتاج إلى قطع أشجار جديدة.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\n1. [مستوى المعرفة] اذكر فائدتين للغابات.\n   الإجابة النموذجية: إنتاج الأكسجين وامتصاص ثاني أكسيد الكربون، ومواطن للكائنات، ومصدر للأدوية.\n2. [مستوى التطبيق] ما الجائزة العُمانية العالمية التي تُمنح لجهود حماية البيئة؟\n   الإجابة النموذجية: جائزة السلطان قابوس لحماية البيئة.\n3. [مستوى الاستدلال] اقترح ثلاث طرق يمكن لأسرتك المساهمة بها في حماية الغابات.\n   الإجابة النموذجية: زراعة الأشجار، شراء أثاث مستعمل، تقليل استهلاك الورق وإعادة تدويره.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nللطالب: حل تمرين 2-5 في كتاب النشاط ص 31 (آراء حول إزالة الغابات) واجبًا منزليًا. لولي الأمر: يُرجى المشاركة مع الابن في زراعة شجرة أو الاعتناء بنبتة في المنزل.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nللطالب: إكمال ورقة العمل المختارة (ص 64–66) والمشاركة في زراعة شجرة (نشاط 2-5) إن أمكن. لولي الأمر: يُرجى المشاركة مع الابن في يوم الشجرة وتشجيعه على الزراعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}, {"id": "2-6", "title": "تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 44–45 | كتاب النشاط ص 32، 67–68 | دليل المعلم ص 57–59", "n": 3, "per": [{"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 44 | دليل المعلم ص 57–59", "num": "الحصة الأولى من 3", "focus": "مكونات الغلاف الجوي وملوثات الهواء ومصادرها"}, "f": ["1. يذكر الغازات الأساسية المكونة للغلاف الجوي.\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة.\nمخرج تعليمي آخر: يقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء.", "1. يذكر الغازات الأساسية المكونة للغلاف الجوي. ← تذكر\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة. ← فهم\nالمخرج الآخر: يقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء. ← تحليل", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- الغلاف الجوي\n- تلوث الهواء\n- أول أكسيد الكربون\n- ثاني أكسيد الكبريت\n- الالتهاب الشعبي\n- الربو", "يسأل المعلم: هل تعتقد أن الهواء في منطقتنا نقي؟ متى ترى دخانًا أو تشم رائحة عوادم؟ ويعرض صورة لضباب دخاني فوق مدينة.", "1) التهيئة: هواؤنا (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويعرض الصورة.\n   الطالب: يذكرون مصادر دخان في بيئتهم.\n2) مكونات الهواء والملوثات (10 دقائق: 5–15)\n   المعلم: يشرح ص 44: النيتروجين والأكسجين وقليل من ثاني أكسيد الكربون وبخار الماء؛ أول أكسيد الكربون من العوادم، أكاسيد الكبريت من المصانع ومحطات الكهرباء.\n   الطالب: يكملون جدول: الملوث – مصدره – ضرره.\n3) أضرار التلوث (10 دقائق: 15–25)\n   المعلم: يناقش آثاره على النباتات والحيوانات وصحة الإنسان (الالتهاب الشعبي، الربو) مع مراعاة الطلبة المصابين بالربو.\n   الطالب: يكتبون ثلاثة أضرار ويجيبون عن «تحدّث عن» ص 45.\n4) مصادر الطاقة (10 دقائق: 25–35)\n   المعلم: يقارن: الفحم والنفط تلوث، والرياح والشمس والماء لا تلوث لكنها أكثر تكلفة لبعض الدول؛ ويذكر محطات الطاقة الشمسية في عُمان.\n   الطالب: يصنفون مصادر الطاقة في عمودين.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الغازان الأساسيان في الغلاف الجوي؟\n   الإجابة النموذجية: النيتروجين والأكسجين.\n2. [مستوى التطبيق] ما مصدر غاز أول أكسيد الكربون السام؟\n   الإجابة النموذجية: عوادم السيارات والدراجات النارية.\n3. [مستوى الاستدلال] لماذا تلوث السيارات الجديدة أقل من القديمة؟\n   الإجابة النموذجية: لأنها مزودة بجهاز يحول غازات العادم الضارة إلى ثاني أكسيد الكربون.", "1. [مستوى المعرفة] اذكر مرضين يصيبان الإنسان في المناطق الملوثة.\n   الإجابة النموذجية: الالتهاب الشعبي والربو.\n2. [مستوى التطبيق] أي مصادر الطاقة لا تلوث الهواء؟\n   الإجابة النموذجية: طاقة الرياح والطاقة الشمسية والطاقة المائية.\n3. [مستوى الاستدلال] اقترح طريقتين لتقليل تلوث الهواء في المدن.\n   الإجابة النموذجية: استخدام وسائل النقل العام، الطاقة الشمسية، زراعة الأشجار، صيانة السيارات (تقبل المقترحات المنطقية).", "للطالب: قراءة كتاب الطالب ص 44 وملاحظة مصادر تلوث الهواء في الحي. لولي الأمر: يُرجى تجنب تشغيل السيارة دون حاجة قرب المنزل والمدرسة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 45 | كتاب النشاط ص 67 | دليل المعلم ص 58–59", "num": "الحصة الثانية من 3", "focus": "التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)"}, "f": ["1. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة.\n2. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية.\nمخرج تعليمي آخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا.", "1. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة. ← تطبيق\n2. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية. ← تحليل\nالمخرج الآخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا. ← تقييم", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة التقليدية\n- أخرى: شرائح زجاجية، فازلين، قلم تخطيط، شريط لاصق، عدسة مكبرة، ورقة العمل 2-6أ", "- جزيئات الغبار\n- التنبؤ\n- الاختبار العادل\n- العينة", "يمرر المعلم إصبعه على سطح نافذة مغبرة ويسأل: من أين جاء هذا الغبار؟ وهل يتساوى الغبار في كل مكان؟", "1) التهيئة: إصبع مغبر (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقدم فكرة قياس الغبار.\n   الطالب: يتوقعون أماكن أكثر غبارًا.\n2) تجهيز الشرائح (12 دقائق: 5–17)\n   المعلم: يوضح الخطوات ص 45: ترقيم 5 شرائح، رسم مربع 2 cm × 2 cm، دهن الفازلين.\n   الطالب: يجهزون الشرائح بعناية في مجموعات.\n3) اختيار المواقع والتنبؤ (10 دقائق: 17–27)\n   المعلم: يناقش اختيار مواقع لا تتحرك فيها الشرائح (أعمدة، نوافذ، جذوع أشجار) قرب طريق وفي مكان هادئ.\n   الطالب: يختارون 5 مواقع ويكتبون تنبؤاتهم مع الأسباب في جدول ورقة العمل 2-6أ.\n4) وضع الشرائح (8 دقائق: 27–35)\n   المعلم: يرافق المجموعات لتثبيت الشرائح في فناء المدرسة.\n   الطالب: يثبتون الشرائح ويسجلون مواقعها.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] لماذا ندهن الشرائح بالفازلين؟\n   الإجابة النموذجية: لكي تلتصق بها جزيئات الغبار الموجودة في الهواء.\n2. [مستوى التطبيق] لماذا نرسم مربعًا بالمساحة نفسها على كل شريحة؟\n   الإجابة النموذجية: لنقارن عدد الجزيئات في المساحة نفسها فيكون الاختبار عادلًا.\n3. [مستوى الاستدلال] أي المواقع تتنبأ أنه سيكون أكثر تلوثًا؟ ولماذا؟\n   الإجابة النموذجية: قرب الطريق المزدحم أو مصنع؛ بسبب العوادم والغبار المتطاير.", "1. [مستوى المعرفة] كم يومًا تُترك الشرائح؟\n   الإجابة النموذجية: أسبوعًا.\n2. [مستوى التطبيق] ما الأداة التي سنستخدمها لفحص الشرائح؟\n   الإجابة النموذجية: العدسة المكبرة.\n3. [مستوى الاستدلال] هل يقيس هذا النشاط كل أنواع تلوث الهواء؟ وضح.\n   الإجابة النموذجية: لا؛ يقيس جزيئات الغبار فقط، أما الغازات فجزيئاتها صغيرة جدًا لا تُرى ولا تُعد.", "للطالب: تسجيل التنبؤات في ورقة العمل 2-6أ (كتاب النشاط ص 67) والعودة إلى الشرائح بعد أسبوع. تُستخدم في الحصة القادمة شرائح جهزها المعلم مسبقًا. لولي الأمر: يُرجى تشجيع الابن على متابعة استقصائه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 45 | كتاب النشاط ص 32، 67–68 | دليل المعلم ص 58–59", "num": "الحصة الثالثة من 3", "focus": "تحليل نتائج الغبار وتمثيلها بالأعمدة"}, "f": ["1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة.\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط.\nمخرج تعليمي آخر: يكتب نشرة معلومات عن تلوث الماء أو التربة.", "1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة. ← تطبيق\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط. ← تقييم\nالمخرج الآخر: يكتب نشرة معلومات عن تلوث الماء أو التربة. ← إبداع", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شرائح معدة مسبقًا، عدسات مكبرة، ورقتا العمل 2-6أ و2-6ب", "- التمثيل البياني بالأعمدة\n- النمط\n- الدليل\n- تلوث الماء\n- تلوث التربة", "يعرض المعلم شريحتين معدتين مسبقًا (إحداهما من قرب الطريق) ويسأل: أي الشريحتين من قرب الشارع؟ كيف عرفت؟", "1) التهيئة: أي الشريحتين؟ (5 دقائق: 0–5)\n   المعلم: يعرض الشريحتين ويطرح السؤال.\n   الطالب: يقارنون ويتوقعون.\n2) العدّ والتسجيل (10 دقائق: 5–15)\n   المعلم: يوزع الشرائح المعدة ويوضح طريقة تقدير العدد داخل المربع.\n   الطالب: يعدون الجزيئات بالعدسة ويسجلونها في ورقة العمل 2-6أ.\n3) ورقة العمل 2-6ب والأسئلة 1–3 (10 دقائق: 15–25)\n   المعلم: يوجه التمثيل بالأعمدة ومقارنة النتائج بين المجموعات.\n   الطالب: يرسمون الأعمدة ويحددون الموقع الأكثر تلوثًا ويقارنونه بتنبؤاتهم.\n4) تمرين 2-6 والسؤال 4 (10 دقائق: 25–35)\n   المعلم: يوجه تحليل بيانات تلوث المدن الكبرى (تمرين 2-6 ص 32)، ويوزع مهمة نشرة معلومات عن تلوث الماء أو التربة.\n   الطالب: يحللون البيانات ويخططون للنشرة.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الموقع الذي ظهرت فيه أكبر كمية من الغبار؟ ولماذا؟\n   الإجابة النموذجية: غالبًا قرب ا ت الغبار في الهواء (نشاط 2-6)\n1. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة. ← تطبيق\n2. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية. ← تحليل\nالمخرج الآخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا. ← تقييم\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة. ← تطبيق\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط. ← تقييم\nالمخرج الآخر: يكتب نشرة معلومات عن تلوث الماء أو التربة. ← إبداع", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الخرائط الذهنية والمفاهيمية\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على المشاريع", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n- الكتاب\n- السبورة التقليدية\n- أخرى: شرائح زجاجية، فازلين، قلم تخطيط، شريط لاصق، عدسة مكبرة، ورقة العمل 2-6أ\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شرائح معدة مسبقًا، عدسات مكبرة، ورقتا العمل 2-6أ و2-6ب", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n- الغلاف الجوي\n- تلوث الهواء\n- أول أكسيد الكربون\n- ثاني أكسيد الكبريت\n- الالتهاب الشعبي\n- الربو\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n- جزيئات الغبار\n- التنبؤ\n- الاختبار العادل\n- العينة\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n- التمثيل البياني بالأعمدة\n- النمط\n- الدليل\n- تلوث الماء\n- تلوث التربة", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nيسأل المعلم: هل تعتقد أن الهواء في منطقتنا نقي؟ متى ترى دخانًا أو تشم رائحة عوادم؟ ويعرض صورة لضباب دخاني فوق مدينة.\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\nيمرر المعلم إصبعه على سطح نافذة مغبرة ويسأل: من أين جاء هذا الغبار؟ وهل يتساوى الغبار في كل مكان؟\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\nيعرض المعلم شريحتين معدتين مسبقًا (إحداهما من قرب الطريق) ويسأل: أي الشريحتين من قرب الشارع؟ كيف عرفت؟", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n1) التهيئة: هواؤنا (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويعرض الصورة.\n   الطالب: يذكرون مصادر دخان في بيئتهم.\n2) مكونات الهواء والملوثات (10 دقائق: 5–15)\n   المعلم: يشرح ص 44: النيتروجين والأكسجين وقليل من ثاني أكسيد الكربون وبخار الماء؛ أول أكسيد الكربون من العوادم، أكاسيد الكبريت من المصانع ومحطات الكهرباء.\n   الطالب: يكملون جدول: الملوث – مصدره – ضرره.\n3) أضرار التلوث (10 دقائق: 15–25)\n   المعلم: يناقش آثاره على النباتات والحيوانات وصحة الإنسان (الالتهاب الشعبي، الربو) مع مراعاة الطلبة المصابين بالربو.\n   الطالب: يكتبون ثلاثة أضرار ويجيبون عن «تحدّث عن» ص 45.\n4) مصادر الطاقة (10 دقائق: 25–35)\n   المعلم: يقارن: الفحم والنفط تلوث، والرياح والشمس والماء لا تلوث لكنها أكثر تكلفة لبعض الدول؛ ويذكر محطات الطاقة الشمسية في عُمان.\n   الطالب: يصنفون مصادر الطاقة في عمودين.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n1) التهيئة: إصبع مغبر (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقدم فكرة قياس الغبار.\n   الطالب: يتوقعون أماكن أكثر غبارًا.\n2) تجهيز الشرائح (12 دقائق: 5–17)\n   المعلم: يوضح الخطوات ص 45: ترقيم 5 شرائح، رسم مربع 2 cm × 2 cm، دهن الفازلين.\n   الطالب: يجهزون الشرائح بعناية في مجموعات.\n3) اختيار المواقع والتنبؤ (10 دقائق: 17–27)\n   المعلم: يناقش اختيار مواقع لا تتحرك فيها الشرائح (أعمدة، نوافذ، جذوع أشجار) قرب طريق وفي مكان هادئ.\n   الطالب: يختارون 5 مواقع ويكتبون تنبؤاتهم مع الأسباب في جدول ورقة العمل 2-6أ.\n4) وضع الشرائح (8 دقائق: 27–35)\n   المعلم: يرافق المجموعات لتثبيت الشرائح في فناء المدرسة.\n   الطالب: يثبتون الشرائح ويسجلون مواقعها.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n1) التهيئة: أي الشريحتين؟ (5 دقائق: 0–5)\n   المعلم: يعرض الشريحتين ويطرح السؤال.\n   الطالب: يقارنون ويتوقعون.\n2) العدّ والتسجيل (10 دقائق: 5–15)\n   المعلم: يوزع الشرائح المعدة ويوضح طريقة تقدير العدد داخل المربع.\n   الطالب: يعدون الجزيئات بالعدسة ويسجلونها في ورقة العمل 2-6أ.\n3) ورقة العمل 2-6ب والأسئلة 1–3 (10 دقائق: 15–25)\n   المعلم: يوجه التمثيل بالأعمدة ومقارنة النتائج بين المجموعات.\n   الطالب: يرسمون الأعمدة ويحددون الموقع الأكثر تلوثًا ويقارنونه بتنبؤاتهم.\n4) تمرين 2-6 والسؤال 4 (10 دقائق: 25–35)\n   المعلم: يوجه تحليل بيانات تلوث المدن الكبرى (تمرين 2-6 ص 32)، ويوزع مهمة نشرة معلومات عن تلوث الماء أو التربة.\n   الطالب: يحللون البيانات ويخططون للنشرة.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n1. [مستوى المعرفة] ما الغازان الأساسيان في الغلاف الجوي؟\n   الإجابة النموذجية: النيتروجين والأكسجين.\n2. [مستوى التطبيق] ما مصدر غاز أول أكسيد الكربون السام؟\n   الإجابة النموذجية: عوادم السيارات والدراجات النارية.\n3. [مستوى الاستدلال] لماذا تلوث السيارات الجديدة أقل من القديمة؟\n   الإجابة النموذجية: لأنها مزودة بجهاز يحول غازات العادم الضارة إلى ثاني أكسيد الكربون.\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n1. [مستوى المعرفة] لماذا ندهن الشرائح بالفازلين؟\n   الإجابة النموذجية: لكي تلتصق بها جزيئات الغبار الموجودة في الهواء.\n2. [مستوى التطبيق] لماذا نرسم مربعًا بالمساحة نفسها على كل شريحة؟\n   الإجابة النموذجية: لنقارن عدد الجزيئات في المساحة نفسها فيكون الاختبار عادلًا.\n3. [مستوى الاستدلال] أي المواقع تتنبأ أنه سيكون أكثر تلوثًا؟ ولماذا؟\n   الإجابة النموذجية: قرب الطريق المزدحم أو مصنع؛ بسبب العوادم والغبار المتطاير.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n1. [مستوى المعرفة] ما الموقع الذي ظهرت فيه أكبر كمية من الغبار؟ ولماذا؟\n   الإجابة النموذجية: غالبًا قرب الطريق المزدحم بسبب حركة السيارات وعوادمها.\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستشهاد بعدد الجزيئات في المواقع.\n3. [مستوى الاستدلال] اقترح سببًا لموقع لم يطابق النمط المتوقع.\n   الإجابة النموذجية: الرياح، أو المطر، أو لمس الشريحة، أو خطأ في العدّ.", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n1. [مستوى المعرفة] اذكر مرضين يصيبان الإنسان في المناطق الملوثة.\n   الإجابة النموذجية: الالتهاب الشعبي والربو.\n2. [مستوى التطبيق] أي مصادر الطاقة لا تلوث الهواء؟\n   الإجابة النموذجية: طاقة الرياح والطاقة الشمسية والطاقة المائية.\n3. [مستوى الاستدلال] اقترح طريقتين لتقليل تلوث الهواء في المدن.\n   الإجابة النموذجية: استخدام وسائل النقل العام، الطاقة الشمسية، زراعة الأشجار، صيانة السيارات (تقبل المقترحات المنطقية).\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\n1. [مستوى المعرفة] كم يومًا تُترك الشرائح؟\n   الإجابة النموذجية: أسبوعًا.\n2. [مستوى التطبيق] ما الأداة التي سنستخدمها لفحص الشرائح؟\n   الإجابة النموذجية: العدسة المكبرة.\n3. [مستوى الاستدلال] هل يقيس هذا النشاط كل أنواع تلوث الهواء؟ وضح.\n   الإجابة النموذجية: لا؛ يقيس جزيئات الغبار فقط، أما الغازات فجزيئاتها صغيرة جدًا لا تُرى ولا تُعد.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\n1. [مستوى المعرفة] ما الفائدة من تمثيل النتائج بالأعمدة؟\n   الإجابة النموذجية: تسهيل المقارنة بين المواقع ورؤية النمط بسرعة.\n2. [مستوى التطبيق] لماذا نقارن نتائجنا مع نتائج المجموعات الأخرى؟\n   الإجابة النموذجية: للتأكد من النمط وزيادة موثوقية النتائج.\n3. [مستوى الاستدلال] اكتب فكرتين لنشرة توعوية عن تلوث الماء.\n   الإجابة النموذجية: عدم رمي النفايات في البحر والأودية، وعدم صب الزيوت في المصارف (تقبل الأفكار الصحيحة).", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nللطالب: قراءة كتاب الطالب ص 44 وملاحظة مصادر تلوث الهواء في الحي. لولي الأمر: يُرجى تجنب تشغيل السيارة دون حاجة قرب المنزل والمدرسة.\n\nالحصة 2: التخطيط لقياس جزيئات الغبار في الهواء (نشاط 2-6)\nللطالب: تسجيل التنبؤات في ورقة العمل 2-6أ (كتاب النشاط ص 67) والعودة إلى الشرائح بعد أسبوع. تُستخدم في الحصة القادمة شرائح جهزها المعلم مسبقًا. لولي الأمر: يُرجى تشجيع الابن على متابعة استقصائه.\n\nالحصة 3: تحليل نتائج الغبار وتمثيلها بالأعمدة\nللطالب: حل تمرين 2-6 (كتاب النشاط ص 32)، وإكمال نشرة المعلومات عن تلوث الماء أو التربة لعرضها. لولي الأمر: يُرجى مساعدة الابن في جمع صور ومعلومات للنشرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"id": "2-7", "title": "الأمطار الحمضية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 46–47 | كتاب النشاط ص 33، 69 | دليل المعلم ص 59–60", "n": 2, "per": [{"h": {"lesson": "2-7 الأمطار الحمضية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 46–47 | كتاب النشاط ص 69 | دليل المعلم ص 59–60", "num": "الحصة الأولى من 2", "focus": "تكوّن الأمطار الحمضية وأثرها على المباني الحجرية"}, "f": ["1. يشرح كيف تتكون الأمطار الحمضية من غازات الوقود المحترق.\n2. يستنتج من تجربة عرض أثر الحمض على الحجر الجيري.\nمخرج تعليمي آخر: يكتب تقريرًا قصيرًا عن أضرار الأمطار الحمضية على المباني.", "1. يشرح كيف تتكون الأمطار الحمضية من غازات الوقود المحترق. ← فهم\n2. يستنتج من تجربة عرض أثر الحمض على الحجر الجيري. ← تحليل\nالمخرج الآخر: يكتب تقريرًا قصيرًا عن أضرار الأمطار الحمضية على المباني. ← إبداع", "- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: خل، حجر جيري أو طباشير، طبق، ورقة العمل 2-7", "- الأمطار الحمضية\n- أكاسيد الكبريت\n- أكاسيد النيتروجين\n- الحجر الجيري\n- الحمض", "يعرض المعلم قطعة طباشير ويسأل: ماذا تتوقع أن يحدث إذا سكبنا عليها خلًا؟ ثم يصبّ الخل أمام الطلبة.", "1) التهيئة: تجربة العرض (6 دقائق: 0–6)\n   المعلم: يسكب الخل على الطباشير/الحجر الجيري بعد جمع التنبؤات.\n   الطالب: يلاحظون الرغوة وتآكل الحجر ويقارنون بالتنبؤ.\n2) كيف تتكون الأمطار الحمضية؟ (12 دقائق: 6–18)\n   المعلم: يشرح بالشكل ص 46: حرق الفحم والنفط والغاز ← أكاسيد الكبريت والنيتروجين ← تتفاعل مع بخار الماء ← أحماض ← أمطار حمضية.\n   الطالب: يرسمون مخططًا سهميًا للتكوّن.\n3) الأثر على المباني (10 دقائق: 18–28)\n   المعلم: يربط التجربة بالمباني والتماثيل الحجرية والخرسانة، ويعرض صور الأضرار.\n   الطالب: يجيبون عن «تحدّث عن» ص 47.\n4) ورقة العمل 2-7 أو التقرير (8 دقائق: 28–36)\n   المعلم: يوزع ورقة العمل 2-7 (دراسة حالة) للمستوى المرتفع، ويوجه البقية لكتابة فقرة مدعومة بصور.\n   الطالب: يقرؤون ويجيبون أو يكتبون الفقرة.\n5) الختام والتقويم (4 دقائق: 36–40)\n   المعلم: يطرح التقويم الختامي ويطمئن الطلبة أن الأمطار الحمضية لا تذيب الجلد.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الغازان المسببان للأمطار الحمضية؟\n   الإجابة النموذجية: أكاسيد الكبريت وأكاسيد النيتروجين.\n2. [مستوى التطبيق] ماذا حدث للطباشير عند سكب الخل عليه؟\n   الإجابة النموذجية: ظهرت رغوة وتآكل جزء منه.\n3. [مستوى الاستدلال] لماذا استخدمنا الخل لتمثيل الأمطار الحمضية؟\n   الإجابة النموذجية: لأن الخل حمض ضعيف يشبه الأمطار الحمضية.", "1. [مستوى المعرفة] ما مصدر الغازات المسببة للأمطار الحمضية؟\n   الإجابة النموذجية: حرق الفحم والنفط والغاز الطبيعي.\n2. [مستوى التطبيق] أي أنواع الحجارة يتضرر أكثر بالأمطار الحمضية؟\n   الإجابة النموذجية: الحجر الجيري والرخام.\n3. [مستوى الاستدلال] اقترح طريقتين لحماية المباني التاريخية من الأمطار الحمضية.\n   الإجابة النموذجية: تقليل حرق الوقود، طلاء الأسطح بمواد واقية، استخدام الطاقة النظيفة.", "للطالب: كتابة تقرير من صفحة واحدة عن أضرار الأمطار الحمضية على المباني (السؤال 4 ص 47). المعلم يُعد شتلتين للنشاط 2-7 قبل الحصة القادمة بثلاثة أيام. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور لمبانٍ تأثرت بالأمطار الحمضية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}, {"h": {"lesson": "2-7 الأمطار الحمضية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 46–47 | كتاب النشاط ص 33 | دليل المعلم ص 59–60", "num": "الحصة الثانية من 2", "focus": "أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)"}, "f": ["1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون.\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية.\nمخرج تعليمي آخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية.", "1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون. ← تحليل\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية. ← فهم\nالمخرج الآخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلتان: الأولى تُروى بماء الصنبور والثانية بعصير الليمون منذ ثلاثة أيام", "- المغذيات\n- التربة\n- البحيرات\n- المقارنة\n- الدليل", "يضع المعلم الشتلتين أمام الطلبة دون إخبارهم بأيهما سُقيت بالليمون، ويطلب منهم التخمين وتبريره.", "1) التهيئة: أي الشتلتين؟ (5 دقائق: 0–5)\n   المعلم: يعرض الشتلتين ويجمع التخمينات.\n   الطالب: يخمنون ويعللون.\n2) نشاط 2-7: المقارنة (12 دقائق: 5–17)\n   المعلم: يوجه الملاحظة الدقيقة للأوراق والسيقان والإجابة عن الأسئلة 1–3 ص 47.\n   الطالب: يسجلون: أوراق الشتلة المسقية بالليمون ذابلة/صفراء وساقها ضعيفة.\n3) أثر الأمطار الحمضية على البيئة (8 دقائق: 17–25)\n   المعلم: يشرح ص 47: تزيل الأحماض المغذيات من التربة، تضعف النباتات وتتساقط أوراقها، وتتضرر الأشجار والبحيرات وحيواناتها.\n   الطالب: يكملون مخطط أثر: تربة ← نبات ← حيوانات.\n4) تمرين 2-7 (10 دقائق: 25–35)\n   المعلم: يوجه حل تمرين 2-7 (ص 33) عن موطن الماء العذب.\n   الطالب: يرسمون السلاسل ويجيبون عن أسئلة الفهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-7).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] صف أوراق الشتلة التي رُويت بعصير الليمون.\n   الإجابة النموذجية: ذابلة أو مصفرة أو بنية وقد تتساقط.\n2. [مستوى التطبيق] هل تدعم النتائج تنبؤك؟ وضح.\n   الإجابة النموذجية: نعم، توقعنا أن الحمض يضر بالنبتة وظهر عليها الضرر.\n3. [مستوى الاستدلال] كيف تضعف الأمطار الحمضية النباتات؟\n   الإجابة النموذجية: تزيل جزءًا من المغذيات من التربة فيضعف النبات ويبطؤ نموه.", "1. [مستوى المعرفة] لماذا يُعد هذا اختبارًا عادلًا؟\n   الإجابة النموذجية: لأن الشتلتين متشابهتان ووضعتا في الظروف نفسها، والفرق الوحيد نوع السائل.\n2. [مستوى التطبيق] كيف تؤثر الأمطار الحمضية على حيوانات البحيرات؟\n   الإجابة النموذجية: تجعل الماء حمضيًا فتضر الأسماك والضفادع وقد تقتلها.\n3. [مستوى الاستدلال] فسّر كيف يمكن أن تتسبب الأمطار الحمضية في موت الضفادع.\n   الإجابة النموذجية: تجعل ماء البحيرة حمضيًا فيضر بالضفادع وبيضها، وتموت الحشرات التي تتغذى عليها.", "للطالب: حل تمرين 2-7 في كتاب النشاط ص 33 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في أهمية تقليل استخدام الوقود لحماية البيئة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}], "comb": ["الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1. يشرح كيف تتكون الأمطار الحمضية من غازات الوقود المحترق.\n2. يستنتج من تجربة عرض أثر الحمض على الحجر الجيري.\nمخرج تعليمي آخر: يكتب تقريرًا قصيرًا عن أضرار الأمطار الحمضية على المباني.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون.\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية.\nمخرج تعليمي آخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1. يشرح كيف تتكون الأمطار الحمضية من غازات الوقود المحترق. ← فهم\n2. يستنتج من تجربة عرض أثر الحمض على الحجر الجيري. ← تحليل\nالمخرج الآخر: يكتب تقريرًا قصيرًا عن أضرار الأمطار الحمضية على المباني. ← إبداع\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون. ← تحليل\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية. ← فهم\nالمخرج الآخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية. ← تطبيق", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: خل، حجر جيري أو طباشير، طبق، ورقة العمل 2-7\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلتان: الأولى تُروى بماء الصنبور والثانية بعصير الليمون منذ ثلاثة أيام", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n- الأمطار الحمضية\n- أكاسيد الكبريت\n- أكاسيد النيتروجين\n- الحجر الجيري\n- الحمض\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n- المغذيات\n- التربة\n- البحيرات\n- المقارنة\n- الدليل", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nيعرض المعلم قطعة طباشير ويسأل: ماذا تتوقع أن يحدث إذا سكبنا عليها خلًا؟ ثم يصبّ الخل أمام الطلبة.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nيضع المعلم الشتلتين أمام الطلبة دون إخبارهم بأيهما سُقيت بالليمون، ويطلب منهم التخمين وتبريره.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1) التهيئة: تجربة العرض (6 دقائق: 0–6)\n   المعلم: يسكب الخل على الطباشير/الحجر الجيري بعد جمع التنبؤات.\n   الطالب: يلاحظون الرغوة وتآكل الحجر ويقارنون بالتنبؤ.\n2) كيف تتكون الأمطار الحمضية؟ (12 دقائق: 6–18)\n   المعلم: يشرح بالشكل ص 46: حرق الفحم والنفط والغاز ← أكاسيد الكبريت والنيتروجين ← تتفاعل مع بخار الماء ← أحماض ← أمطار حمضية.\n   الطالب: يرسمون مخططًا سهميًا للتكوّن.\n3) الأثر على المباني (10 دقائق: 18–28)\n   المعلم: يربط التجربة بالمباني والتماثيل الحجرية والخرسانة، ويعرض صور الأضرار.\n   الطالب: يجيبون عن «تحدّث عن» ص 47.\n4) ورقة العمل 2-7 أو التقرير (8 دقائق: 28–36)\n   المعلم: يوزع ورقة العمل 2-7 (دراسة حالة) للمستوى المرتفع، ويوجه البقية لكتابة فقرة مدعومة بصور.\n   الطالب: يقرؤون ويجيبون أو يكتبون الفقرة.\n5) الختام والتقويم (4 دقائق: 36–40)\n   المعلم: يطرح التقويم الختامي ويطمئن الطلبة أن الأمطار الحمضية لا تذيب الجلد.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1) التهيئة: أي الشتلتين؟ (5 دقائق: 0–5)\n   المعلم: يعرض الشتلتين ويجمع التخمينات.\n   الطالب: يخمنون ويعللون.\n2) نشاط 2-7: المقارنة (12 دقائق: 5–17)\n   المعلم: يوجه الملاحظة الدقيقة للأوراق والسيقان والإجابة عن الأسئلة 1–3 ص 47.\n   الطالب: يسجلون: أوراق الشتلة المسقية بالليمون ذابلة/صفراء وساقها ضعيفة.\n3) أثر الأمطار الحمضية على البيئة (8 دقائق: 17–25)\n   المعلم: يشرح ص 47: تزيل الأحماض المغذيات من التربة، تضعف النباتات وتتساقط أوراقها، وتتضرر الأشجار والبحيرات وحيواناتها.\n   الطالب: يكملون مخطط أثر: تربة ← نبات ← حيوانات.\n4) تمرين 2-7 (10 دقائق: 25–35)\n   المعلم: يوجه حل تمرين 2-7 (ص 33) عن موطن الماء العذب.\n   الطالب: يرسمون السلاسل ويجيبون عن أسئلة الفهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-7).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1. [مستوى المعرفة] ما الغازان المسببان للأمطار الحمضية؟\n   الإجابة النموذجية: أكاسيد الكبريت وأكاسيد النيتروجين.\n2. [مستوى التطبيق] ماذا حدث للطباشير عند سكب الخل عليه؟\n   الإجابة النموذجية: ظهرت رغوة وتآكل جزء منه.\n3. [مستوى الاستدلال] لماذا استخدمنا الخل لتمثيل الأمطار الحمضية؟\n   الإجابة النموذجية: لأن الخل حمض ضعيف يشبه الأمطار الحمضية.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1. [مستوى المعرفة] صف أوراق الشتلة التي رُويت بعصير الليمون.\n   الإجابة النموذجية: ذابلة أو مصفرة أو بنية وقد تتساقط.\n2. [مستوى التطبيق] هل تدعم النتائج تنبؤك؟ وضح.\n   الإجابة النموذجية: نعم، توقعنا أن الحمض يضر بالنبتة وظهر عليها الضرر.\n3. [مستوى الاستدلال] كيف تضعف الأمطار الحمضية النباتات؟\n   الإجابة النموذجية: تزيل جزءًا من المغذيات من التربة فيضعف النبات ويبطؤ نموه.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1. [مستوى المعرفة] ما مصدر الغازات المسببة للأمطار الحمضية؟\n   الإجابة النموذجية: حرق الفحم والنفط والغاز الطبيعي.\n2. [مستوى التطبيق] أي أنواع الحجارة يتضرر أكثر بالأمطار الحمضية؟\n   الإجابة النموذجية: الحجر الجيري والرخام.\n3. [مستوى الاستدلال] اقترح طريقتين لحماية المباني التاريخية من الأمطار الحمضية.\n   الإجابة النموذجية: تقليل حرق الوقود، طلاء الأسطح بمواد واقية، استخدام الطاقة النظيفة.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1. [مستوى المعرفة] لماذا يُعد هذا اختبارًا عادلًا؟\n   الإجابة النموذجية: لأن الشتلتين متشابهتان ووضعتا في الظروف نفسها، والفرق الوحيد نوع السائل.\n2. [مستوى التطبيق] كيف تؤثر الأمطار الحمضية على حيوانات البحيرات؟\n   الإجابة النموذجية: تجعل الماء حمضيًا فتضر الأسماك والضفادع وقد تقتلها.\n3. [مستوى الاستدلال] فسّر كيف يمكن أن تتسبب الأمطار الحمضية في موت الضفادع.\n   الإجابة النموذجية: تجعل ماء البحيرة حمضيًا فيضر بالضفادع وبيضها، وتموت الحشرات التي تتغذى عليها.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nللطالب: كتابة تقرير من صفحة واحدة عن أضرار الأمطار الحمضية على المباني (السؤال 4 ص 47). المعلم يُعد شتلتين للنشاط 2-7 قبل الحصة القادمة بثلاثة أيام. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور لمبانٍ تأثرت بالأمطار الحمضية.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nللطالب: حل تمرين 2-7 في كتاب النشاط ص 33 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في أهمية تقليل استخدام الوقود لحماية البيئة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}, {"id": "2-8", "title": "إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 48–49 | كتاب النشاط ص 34، 70–71 | دليل المعلم ص 60–62", "n": 3, "per": [{"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 48 | دليل المعلم ص 60–62", "num": "الحصة الأولى من 3", "focus": "مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير"}, "f": ["1. يوضح المقصود بمرادم النفايات وإعادة التدوير.\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها.\nمخرج تعليمي آخر: يقترح طرقًا لاستخدام كمية أقل من الورق.", "1. يوضح المقصود بمرادم النفايات وإعادة التدوير. ← فهم\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها. ← تطبيق\nالمخرج الآخر: يقترح طرقًا لاستخدام كمية أقل من الورق. ← تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: نفايات نظيفة متنوعة على ورق جرائد: ورق، كرتون، كيس، زجاجة بلاستيكية وزجاجية، علبة، قشور خضار", "- التخلص من النفايات\n- مرادم النفايات\n- إعادة التدوير\n- إعادة الاستخدام\n- التقليل", "يفرغ المعلم كيس نفايات نظيفة على ورق الجرائد ويرفع كل قطعة ويسأل: هل يمكن تقليل استخدامها؟ أو إعادة استخدامها؟ أو تدويرها؟", "1) التهيئة: كيس النفايات (6 دقائق: 0–6)\n   المعلم: يرفع القطع تباعًا ويطرح الأسئلة الثلاثة.\n   الطالب: يقترحون مصير كل قطعة.\n2) إلى أين تذهب نفاياتنا؟ (10 دقائق: 6–16)\n   المعلم: يشرح ص 48: مرادم النفايات أكوام ضخمة بعيدة عن السكان تغطى بالتربة، ويعرض فكرة «مدينة المخلفات» في القاهرة.\n   الطالب: يكتبون مشكلات المرادم.\n3) فرز وتصنيف (12 دقائق: 16–28)\n   المعلم: يوزع على المجموعات قطعًا ويرسم جدولًا: تقليل – إعادة استخدام – إعادة تدوير.\n   الطالب: يصنفون القطع ويعللون.\n4) السؤال 1 ص 49: ورق أقل (7 دقائق: 28–35)\n   المعلم: يطرح السؤال ويجمع الأفكار.\n   الطالب: يقترحون: الكتابة على الوجهين، الكتب الإلكترونية، المناديل القماشية.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المقصود بإعادة التدوير؟\n   الإجابة النموذجية: معالجة الأشياء بدل رميها لتصبح منتجًا جديدًا يمكن استخدامه.\n2. [مستوى التطبيق] ما مرادم النفايات؟\n   الإجابة النموذجية: أكوام ضخمة من القمامة في أماكن بعيدة عن السكان تغطى بالتربة لاحقًا.\n3. [مستوى الاستدلال] ما الفرق بين إعادة الاستخدام وإعادة التدوير؟ أعطِ مثالًا.\n   الإجابة النموذجية: إعادة الاستخدام: استعمال الشيء مرة أخرى كما هو (علبة كحامل أقلام)؛ التدوير: معالجته لصنع منتج جديد (صهر العلب لصنع علب جديدة).", "1. [مستوى المعرفة] اذكر مادتين يمكن إعادة تدويرهما.\n   الإجابة النموذجية: الورق، البلاستيك، الزجاج، العلب المعدنية.\n2. [مستوى التطبيق] اقترح طريقتين لاستخدام ورق أقل.\n   الإجابة النموذجية: الكتابة على وجهي الورقة، استخدام الأجهزة الإلكترونية، المناديل القماشية.\n3. [مستوى الاستدلال] لماذا يُعد تقليل النفايات أفضل من إعادة تدويرها؟\n   الإجابة النموذجية: لأنه يمنع إنتاج النفايات أصلًا ويوفر الطاقة والمواد المستخدمة في التدوير.", "للطالب: قراءة كتاب الطالب ص 48 وعدّ أكياس النفايات التي تخرجها الأسرة أسبوعيًا. لولي الأمر: يُرجى تخصيص سلة لفرز المواد القابلة للتدوير في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 49 | كتاب النشاط ص 34، 70 | دليل المعلم ص 61–62", "num": "الحصة الثانية من 3", "focus": "إعادة الاستخدام عمليًا وحملة التوعية"}, "f": ["1. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة.\n2. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير.\nمخرج تعليمي آخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها.", "1. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة. ← تطبيق\n2. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها. ← تقييم", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: علب معدنية وأوعية بلاستيكية نظيفة، أوراق ملونة، ورقة العمل 2-8أ", "- إعادة الاستخدام\n- الحملة التوعوية\n- المنتجات المغلفة", "يعرض المعلم علبة معدنية فارغة ويتحدى المجموعات: اقترحوا ثلاثة استخدامات جديدة لها خلال دقيقة!", "1) التهيئة: تحدي العلبة (4 دقائق: 0–4)\n   المعلم: يطرح التحدي ويسجل الأفكار.\n   الطالب: يقترحون استخدامات.\n2) ورقة العمل 2-8أ: إعادة استخدام العلب (12 دقائق: 4–16)\n   المعلم: يوزع ورقة العمل (كتاب النشاط ص 70) ويتابع التنفيذ مع مراعاة سلامة حواف العلب.\n   الطالب: يصنعون حامل أقلام أو أصيص زرع من العلب والأوعية.\n3) تمرين 2-8 (9 دقائق: 16–25)\n   المعلم: يوجه إكمال جدول تمرين 2-8 (ص 34).\n   الطالب: يحددون لكل عنصر طريقة إعادة الاستخدام أو التدوير.\n4) ملصق الحملة (السؤال 4 ص 49) (10 دقائق: 25–35)\n   المعلم: يحدد معايير الملصق: رسالة واضحة، صورة جاذبة، عبارة قصيرة.\n   الطالب: يصممون الملصق ويعلقونه، ويقيّمون ملصقات زملائهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-8).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] اقترح طريقة لإعادة استخدام الأوعية البلاستيكية.\n   الإجابة النموذجية: لتخزين الأدوات أو زراعة النباتات أو حفظ الطعام.\n2. [مستوى التطبيق] أي المواد في تمرين 2-8 يمكن تحويلها إلى سماد؟\n   الإجابة النموذجية: قشور الفواكه والخضراوات ومخلفات الحدائق.\n3. [مستوى الاستدلال] ما الذي يجعل الملصق التوعوي ناجحًا؟\n   الإجابة النموذجية: رسالة واضحة قصيرة، صورة جاذبة، ألوان مناسبة، ودعوة لفعل محدد.", "1. [مستوى المعرفة] ما فائدة إعادة الاستخدام للبيئة؟\n   الإجابة النموذجية: تقلل النفايات وتحافظ على المواد الطبيعية.\n2. [مستوى التطبيق] اكتب شعارًا قصيرًا لحملة إعادة التدوير.\n   الإجابة النموذجية: مثل: «لا ترمِ.. أعد التدوير!» (تقبل الشعارات المناسبة).\n3. [مستوى الاستدلال] كيف يمكنك وأسرتك إعادة التدوير في المنزل؟\n   الإجابة النموذجية: فرز النفايات، جمع العلب والورق في سلال خاصة، إعادة استخدام الأكياس والأوعية.", "للطالب: حل تمرين 2-8 في كتاب النشاط ص 34 وإكمال الملصق، وإعداد قائمة بالمنتجات المغلفة القابلة للتدوير من البقالة. لولي الأمر: يُرجى اصطحاب الابن إلى البقالة وتشجيعه على إعداد القائمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 49 | كتاب النشاط ص 71 | دليل المعلم ص 61–62", "num": "الحصة الثالثة من 3", "focus": "صناعة السماد العضوي واستقصاء تحلل النفايات"}, "f": ["1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة.\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل.\nمخرج تعليمي آخر: يفسر أهمية السماد العضوي لنمو النباتات.", "1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة. ← فهم\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل. ← تطبيق\nالمخرج الآخر: يفسر أهمية السماد العضوي لنمو النباتات. ← فهم", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: كيس بلاستيكي كبير، قشور خضراوات وفواكه وبيض، أعشاب وأوراق، ماء، مجرفة، ورقة العمل 2-8ب", "- السماد العضوي\n- التحلل\n- القابل للتحلل الحيوي\n- خصوبة التربة", "يعرض المعلم كيسًا من السماد العضوي الجاهز ويطلب من الطلبة ملاحظة لونه وملمسه ورائحته، ويسأل: من ماذا صُنع؟", "1) التهيئة: سماد جاهز (5 دقائق: 0–5)\n   المعلم: يعرض السماد ويطرح السؤال.\n   الطالب: يصفون ويخمنون مكوناته.\n2) نشاط 2-8: تجربة عرض لصنع السماد (12 دقائق: 5–17)\n   المعلم: يجمع القشور والأعشاب في الكيس ويضيف الماء باعتدال ويربطه ويضعه في مكان دافئ.\n   الطالب: يشاركون في الإضافة ويسجلون الخطوات وينتبهون لعدم إضافة الطعام المطبوخ أو اللحوم.\n3) ورقة العمل 2-8ب: مردم نفايات مصغر (10 دقائق: 17–27)\n   المعلم: يشرح الاستقصاء: حفرتان، الأولى بقشور وورق والثانية بعلبة وعبوة بلاستيكية؛ الفحص بعد أسبوعين ثم شهرين.\n   الطالب: يكتبون تنبؤاتهم في ورقة العمل (ص 71).\n4) مناقشة السؤال 3 والتحدي (8 دقائق: 27–35)\n   المعلم: يناقش: ما أهمية السماد؟ ولماذا يبقى البلاستيك طويلًا في المرادم؟\n   الطالب: يستنتجون أن البلاستيك لا يتحلل بسهولة ويضر الحيوانات.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-8).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المواد المناسبة لصنع السماد العضوي؟\n   الإجابة النموذجية تخدامها؟ أو إعادة استخدامها؟ أو تدويرها؟\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\nيعرض المعلم علبة معدنية فارغة ويتحدى المجموعات: اقترحوا ثلاثة استخدامات جديدة لها خلال دقيقة!\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\nيعرض المعلم كيسًا من السماد العضوي الجاهز ويطلب من الطلبة ملاحظة لونه وملمسه ورائحته، ويسأل: من ماذا صُنع؟", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1) التهيئة: كيس النفايات (6 دقائق: 0–6)\n   المعلم: يرفع القطع تباعًا ويطرح الأسئلة الثلاثة.\n   الطالب: يقترحون مصير كل قطعة.\n2) إلى أين تذهب نفاياتنا؟ (10 دقائق: 6–16)\n   المعلم: يشرح ص 48: مرادم النفايات أكوام ضخمة بعيدة عن السكان تغطى بالتربة، ويعرض فكرة «مدينة المخلفات» في القاهرة.\n   الطالب: يكتبون مشكلات المرادم.\n3) فرز وتصنيف (12 دقائق: 16–28)\n   المعلم: يوزع على المجموعات قطعًا ويرسم جدولًا: تقليل – إعادة استخدام – إعادة تدوير.\n   الطالب: يصنفون القطع ويعللون.\n4) السؤال 1 ص 49: ورق أقل (7 دقائق: 28–35)\n   المعلم: يطرح السؤال ويجمع الأفكار.\n   الطالب: يقترحون: الكتابة على الوجهين، الكتب الإلكترونية، المناديل القماشية.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n1) التهيئة: تحدي العلبة (4 دقائق: 0–4)\n   المعلم: يطرح التحدي ويسجل الأفكار.\n   الطالب: يقترحون استخدامات.\n2) ورقة العمل 2-8أ: إعادة استخدام العلب (12 دقائق: 4–16)\n   المعلم: يوزع ورقة العمل (كتاب النشاط ص 70) ويتابع التنفيذ مع مراعاة سلامة حواف العلب.\n   الطالب: يصنعون حامل أقلام أو أصيص زرع من العلب والأوعية.\n3) تمرين 2-8 (9 دقائق: 16–25)\n   المعلم: يوجه إكمال جدول تمرين 2-8 (ص 34).\n   الطالب: يحددون لكل عنصر طريقة إعادة الاستخدام أو التدوير.\n4) ملصق الحملة (السؤال 4 ص 49) (10 دقائق: 25–35)\n   المعلم: يحدد معايير الملصق: رسالة واضحة، صورة جاذبة، عبارة قصيرة.\n   الطالب: يصممون الملصق ويعلقونه، ويقيّمون ملصقات زملائهم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-8).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n1) التهيئة: سماد جاهز (5 دقائق: 0–5)\n   المعلم: يعرض السماد ويطرح السؤال.\n   الطالب: يصفون ويخمنون مكوناته.\n2) نشاط 2-8: تجربة عرض لصنع السماد (12 دقائق: 5–17)\n   المعلم: يجمع القشور والأعشاب في الكيس ويضيف الماء باعتدال ويربطه ويضعه في مكان دافئ.\n   الطالب: يشاركون في الإضافة ويسجلون الخطوات وينتبهون لعدم إضافة الطعام المطبوخ أو اللحوم.\n3) ورقة العمل 2-8ب: مردم نفايات مصغر (10 دقائق: 17–27)\n   المعلم: يشرح الاستقصاء: حفرتان، الأولى بقشور وورق والثانية بعلبة وعبوة بلاستيكية؛ الفحص بعد أسبوعين ثم شهرين.\n   الطالب: يكتبون تنبؤاتهم في ورقة العمل (ص 71).\n4) مناقشة السؤال 3 والتحدي (8 دقائق: 27–35)\n   المعلم: يناقش: ما أهمية السماد؟ ولماذا يبقى البلاستيك طويلًا في المرادم؟\n   الطالب: يستنتجون أن البلاستيك لا يتحلل بسهولة ويضر الحيوانات.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-8).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1. [مستوى المعرفة] ما المقصود بإعادة التدوير؟\n   الإجابة النموذجية: معالجة الأشياء بدل رميها لتصبح منتجًا جديدًا يمكن استخدامه.\n2. [مستوى التطبيق] ما مرادم النفايات؟\n   الإجابة النموذجية: أكوام ضخمة من القمامة في أماكن بعيدة عن السكان تغطى بالتربة لاحقًا.\n3. [مستوى الاستدلال] ما الفرق بين إعادة الاستخدام وإعادة التدوير؟ أعطِ مثالًا.\n   الإجابة النموذجية: إعادة الاستخدام: استعمال الشيء مرة أخرى كما هو (علبة كحامل أقلام)؛ التدوير: معالجته لصنع منتج جديد (صهر العلب لصنع علب جديدة).\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n1. [مستوى المعرفة] اقترح طريقة لإعادة استخدام الأوعية البلاستيكية.\n   الإجابة النموذجية: لتخزين الأدوات أو زراعة النباتات أو حفظ الطعام.\n2. [مستوى التطبيق] أي المواد في تمرين 2-8 يمكن تحويلها إلى سماد؟\n   الإجابة النموذجية: قشور الفواكه والخضراوات ومخلفات الحدائق.\n3. [مستوى الاستدلال] ما الذي يجعل الملصق التوعوي ناجحًا؟\n   الإجابة النموذجية: رسالة واضحة قصيرة، صورة جاذبة، ألوان مناسبة، ودعوة لفعل محدد.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n1. [مستوى المعرفة] ما المواد المناسبة لصنع السماد العضوي؟\n   الإجابة النموذجية: قشور الخضراوات والفواكه والبيض، والحشائش والأوراق المتساقطة.\n2. [مستوى التطبيق] لماذا لا نضع الطعام المطبوخ أو اللحوم في كيس السماد؟\n   الإجابة النموذجية: لأنها تتعفن بروائح كريهة وتجذب الحشرات والحيوانات.\n3. [مستوى الاستدلال] أي الحفرتين تتوقع أن تتغير محتوياتها أكثر؟ ولماذا؟\n   الإجابة النموذجية: حفرة القشور والورق؛ لأنها مواد قابلة للتحلل، أما العلبة والبلاستيك فلا تتحلل بسهولة.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1. [مستوى المعرفة] اذكر مادتين يمكن إعادة تدويرهما.\n   الإجابة النموذجية: الورق، البلاستيك، الزجاج، العلب المعدنية.\n2. [مستوى التطبيق] اقترح طريقتين لاستخدام ورق أقل.\n   الإجابة النموذجية: الكتابة على وجهي الورقة، استخدام الأجهزة الإلكترونية، المناديل القماشية.\n3. [مستوى الاستدلال] لماذا يُعد تقليل النفايات أفضل من إعادة تدويرها؟\n   الإجابة النموذجية: لأنه يمنع إنتاج النفايات أصلًا ويوفر الطاقة والمواد المستخدمة في التدوير.\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\n1. [مستوى المعرفة] ما فائدة إعادة الاستخدام للبيئة؟\n   الإجابة النموذجية: تقلل النفايات وتحافظ على المواد الطبيعية.\n2. [مستوى التطبيق] اكتب شعارًا قصيرًا لحملة إعادة التدوير.\n   الإجابة النموذجية: مثل: «لا ترمِ.. أعد التدوير!» (تقبل الشعارات المناسبة).\n3. [مستوى الاستدلال] كيف يمكنك وأسرتك إعادة التدوير في المنزل؟\n   الإجابة النموذجية: فرز النفايات، جمع العلب والورق في سلال خاصة، إعادة استخدام الأكياس والأوعية.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\n1. [مستوى المعرفة] متى يكون السماد جاهزًا؟\n   الإجابة النموذجية: عندما يصبح غامق اللون طري القوام بعد بضعة أسابيع.\n2. [مستوى التطبيق] ما أهمية السماد العضوي للنباتات؟\n   الإجابة النموذجية: يزيد خصوبة التربة بالمغذيات فتنمو النباتات بشكل أفضل.\n3. [مستوى الاستدلال] لماذا تُعد الأكياس البلاستيكية خطرًا على الحيوانات؟\n   الإجابة النموذجية: لأنها لا تتحلل وقد تختنق بها الحيوانات أو تبتلعها.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nللطالب: قراءة كتاب الطالب ص 48 وعدّ أكياس النفايات التي تخرجها الأسرة أسبوعيًا. لولي الأمر: يُرجى تخصيص سلة لفرز المواد القابلة للتدوير في المنزل.\n\nالحصة 2: إعادة الاستخدام عمليًا وحملة التوعية\nللطالب: حل تمرين 2-8 في كتاب النشاط ص 34 وإكمال الملصق، وإعداد قائمة بالمنتجات المغلفة القابلة للتدوير من البقالة. لولي الأمر: يُرجى اصطحاب الابن إلى البقالة وتشجيعه على إعداد القائمة.\n\nالحصة 3: صناعة السماد العضوي واستقصاء تحلل النفايات\nللطالب: تنفيذ استقصاء ورقة العمل 2-8ب في المنزل بمساعدة الأسرة (كتاب النشاط ص 71)، ومراجعة ص 48–49. لولي الأمر: يُرجى مساعدة الابن في حفر الحفرتين واختيار مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"id": "2-9", "title": "الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 50–51 | كتاب النشاط ص 35 | دليل المعلم ص 62–64", "n": 2, "per": [{"h": {"lesson": "2-9 الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 50 | كتاب النشاط ص 35 | دليل المعلم ص 62–63", "num": "الحصة الأولى من 2", "focus": "الحفاظ على الماء والطاقة"}, "f": ["1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة.\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء.\nمخرج تعليمي آخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه.", "1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة. ← تذكر\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء. ← فهم\nالمخرج الآخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه. ← تقييم", "- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: تمرين 2-9 في كتاب النشاط", "- الماء العذب\n- ترشيد الاستهلاك\n- الطاقة\n- المصابيح الموفرة\n- الطاقة الشمسية", "يعرض المعلم صنبورًا يقطر (أو مقطعًا) ويسأل: كم لترًا يضيع من صنبور يقطر طوال اليوم؟ هل يهمنا ذلك في بلد قليل الأمطار؟", "1) التهيئة: الصنبور المتسرب (5 دقائق: 0–5)\n   المعلم: يعرض الموقف ويطرح الأسئلة.\n   الطالب: يقدرون ويناقشون.\n2) الحفاظ على الماء (10 دقائق: 5–15)\n   المعلم: يناقش ص 50: الاستحمام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد.\n   الطالب: يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان.\n3) الحفاظ على الطاقة (10 دقائق: 15–25)\n   المعلم: يناقش: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية.\n   الطالب: يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف.\n4) تمرين 2-9: سجلي الأسبوعي (10 دقائق: 25–35)\n   المعلم: يوجه تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع.\n   الطالب: يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.", "1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.", "للطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"h": {"lesson": "2-9 الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 51 | دليل المعلم ص 63–64", "num": "الحصة الثانية من 2", "focus": "فرز القمامة وحملة لمنع رميها (نشاط 2-9)"}, "f": ["1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان.\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات.\nمخرج تعليمي آخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة.", "1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان. ← تطبيق\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات. ← تحليل\nالمخرج الآخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة. ← إبداع", "- الاستقصاء العلمي\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أكياس قمامة كبيرة، قفازات مطاطية، كمامات، دفتر ملاحظات", "- فرز القمامة\n- جدول الإحصاء\n- التمثيل بالأعمدة\n- الحملة التوعوية", "يسأل المعلم: ما أكثر أنواع القمامة التي تتوقع أن تجدها في فناء المدرسة؟ ويسجل التنبؤات على السبورة.", "1) التهيئة والتنبؤ والسلامة (4 دقائق: 0–4)\n   المعلم: يسجل التنبؤات ويؤكد السلامة: قفازات وكمامات، الحذر من الزجاج المكسور وعدم لمس الإبر.\n   الطالب: يتنبؤون ويرتدون أدوات الوقاية.\n2) نشاط 2-9: الجمع والتسجيل (14 دقائق: 4–18)\n   المعلم: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل.\n   الطالب: يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام.\n3) التمثيل والمقارنة (10 دقائق: 18–28)\n   المعلم: يوجه جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2).\n   الطالب: يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا.\n4) تخطيط الحملة (السؤال 3) (7 دقائق: 28–35)\n   المعلم: يناقش «تحدّث عن» ص 51 ويطلب خطة حملة.\n   الطالب: يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على م
