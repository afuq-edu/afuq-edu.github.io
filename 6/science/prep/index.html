ترشيح (نشاط 3-4)\n1) التهيئة: كيس الشاي (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويربطه بالترشيح.\n   الطالب: يفسرون: الأوراق كبيرة والمواد الذائبة تمر.\n2) طي ورقة الترشيح (6 دقائق: 5–11)\n   المعلم: يعرض خطوات الطي: نصفان ثم نصفان، فتح المخروط، ترطيب الورقة ووضعها في القمع.\n   الطالب: يطوون الورقة ويجهزون القمع.\n3) نشاط 3-4: الترشيح (14 دقائق: 11–25)\n   المعلم: يوجه خلط ملعقة صغيرة من الطباشير في 100 mL ماء وترشيحه، ثم الدقيق.\n   الطالب: يرشحون ويلاحظون: يمر الماء صافيًا ويبقى الطباشير على الورقة.\n4) الأسئلة 1–4 ص 61 وتمرين 3-4 (10 دقائق: 25–35)\n   المعلم: يناقش: ماذا مر؟ ماذا بقي؟ هل يفصل الترشيح الملح عن الماء؟ ويوجه تمرين 3-4 (ص 40) عن تنقية الماء.\n   الطالب: يجيبون ويستنتجون أن المواد الذائبة تمر عبر الورقة وتحتاج للتبخير.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\n1. [مستوى المعرفة] ما الترشيح؟\n   الإجابة النموذجية: طريقة لفصل المخاليط المكونة من مادة صلبة غير قابلة للذوبان ومادة سائلة.\n2. [مستوى التطبيق] ماذا تحجز ورقة الترشيح في وعاء القهوة؟\n   الإجابة النموذجية: حبيبات القهوة الصلبة.\n3. [مستوى الاستدلال] لماذا لا يكون الماء المرشّح بالرمل آمنًا للشرب دائمًا؟\n   الإجابة النموذجية: لأن الرمل لا يستطيع حجز الجراثيم الصغيرة جدًا.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n1. [مستوى المعرفة] ما الذي مر عبر ورقة الترشيح إلى الكأس؟\n   الإجابة النموذجية: الماء.\n2. [مستوى التطبيق] لماذا بقي الطباشير على ورقة الترشيح؟\n   الإجابة النموذجية: لأن جزيئاته أكبر من ثقوب الورقة ولا يذوب في الماء.\n3. [مستوى الاستدلال] تنبأ: هل يمكن فصل الملح عن الماء بالترشيح؟ علّل.\n   الإجابة النموذجية: لا؛ لأن الملح ذائب وجزيئاته صغيرة جدًا تمر عبر ثقوب الورقة.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\n1. [مستوى المعرفة] ما الذي يمر عبر ثقوب المرشح؟\n   الإجابة النموذجية: السائل والمواد الذائبة فيه والجزيئات الصغيرة جدًا.\n2. [مستوى التطبيق] كيف يُرشح طائر الفلامنجو طعامه؟\n   الإجابة النموذجية: بمرشحات في منقاره تلتقط الطحالب والأسماك الصغيرة من الماء.\n3. [مستوى الاستدلال] كيف نجعل الماء آمنًا للشرب بعد ترشيحه؟\n   الإجابة النموذجية: بغليه أو معالجته بمادة معقمة.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\n1. [مستوى المعرفة] لماذا نرطب ورقة الترشيح قبل وضعها في القمع؟\n   الإجابة النموذجية: لتلتصق بالقمع وتُسرّع عملية الترشيح.\n2. [مستوى التطبيق] ما الطريقة المناسبة لفصل الملح الذائب عن الماء؟\n   الإجابة النموذجية: التبخير.\n3. [مستوى الاستدلال] صف خطوات فصل مخلوط من الرمل والملح والماء.\n   الإجابة النموذجية: نرشح المخلوط ليبقى الرمل على الورقة، ثم نبخر الراشح فيبقى الملح.", "الحصة 1: ما الترشيح؟ المرشحات في الحياة والطبيعة\nللطالب: قراءة كتاب الطالب ص 60 والبحث عن مرشح في المنزل (مصفاة الشاي، فلتر الماء). لولي الأمر: يُرجى مناقشة الابن في طرق تنقية ماء الشرب في المنزل.\n\nالحصة 2: فصل المخاليط بالترشيح (نشاط 3-4)\nللطالب: حل تمرين 3-4 في كتاب النشاط ص 40 واجبًا منزليًا ومراجعة ص 60–61. لولي الأمر: يُرجى مساعدة الابن في تجربة ترشيح ماء مع تراب بمنديل ورقي في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=22"]}, {"id": "3-5", "title": "المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62–63 | كتاب النشاط ص 41، 76–78 | دليل المعلم ص 82–86", "n": 3, "per": [{"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62 | دليل المعلم ص 82–84", "num": "الحصة الأولى من 3", "focus": "المحلول: المادة المذابة والمادة المذيبة"}, "f": ["1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة.\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا.\nمخرج تعليمي آخر: يمثل تكوّن المحلول بنموذج الجزيئات.", "1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة. ← فهم\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا. ← تطبيق\nالمخرج الآخر: يمثل تكوّن المحلول بنموذج الجزيئات. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف", "- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات", "يعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟", "1) التهيئة: ماء البحر (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويقود إلى أن ماء البحر محلول.\n   الطالب: يجيبون: الطعم المالح، الملح المتبقي بعد التبخر.\n2) المذاب والمذيب (10 دقائق: 5–15)\n   المعلم: يشرح ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب.\n   الطالب: يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء.\n3) نشاط 3-5: تحضير محلول (14 دقائق: 15–29)\n   المعلم: يوجه وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق.\n   الطالب: يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب.\n4) المحلول المتجانس (6 دقائق: 29–35)\n   المعلم: يقدم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه.\n   الطالب: يصفون محلولهم باستخدام المصطلح.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.", "1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.", "للطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 63 | كتاب النشاط ص 76–77 | دليل المعلم ص 84–86", "num": "الحصة الثانية من 3", "focus": "المخاليط والمواد النقية: هل المحلول مادة نقية؟"}, "f": ["1. يميز بين المخلوط والمادة النقية بأمثلة.\n2. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات.\nمخرج تعليمي آخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل.", "1. يميز بين المخلوط والمادة النقية بأمثلة. ← فهم\n2. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات. ← تحليل\nالمخرج الآخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل. ← تقييم", "- التعلم المبني على حل المشكلات\n- الاستقصاء العلمي\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورقة العمل 3-5أ، عصير برتقال طازج", "- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء", "يعرض المعلم ملعقة سكر وعلبة مسحوق شراب بارد ويسأل: أيهما مادة نقية؟ وأيهما مخلوط؟", "1) التهيئة: سكر أم مسحوق؟ (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويقرأ مكونات علبة المسحوق.\n   الطالب: يستنتجون أن السكر نقي والمسحوق مخلوط.\n2) المواد النقية والمخاليط (10 دقائق: 5–15)\n   المعلم: يشرح ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط.\n   الطالب: يصنفون أمثلة في جدول.\n3) الأسئلة 1–5 ص 63: خطة استقصاء (12 دقائق: 15–27)\n   المعلم: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟\n   الطالب: يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى.\n4) ورقة العمل 3-5أ وتحدّث عن (8 دقائق: 27–35)\n   المعلم: يوجه بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال.\n   الطالب: يجيبون ويستنتجون أن العصير مخلوط.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n2. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n3. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.", "1. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n2. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n3. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.", "للطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"h": {"lesson": "3-5 المحاليل", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الرابع عشر (6–10/12/2026)", "pages": "كتاب الطالب ص 62–63 | كتاب النشاط ص 41، 78 | دليل المعلم ص 84–86", "num": "الحصة الثالثة من 3", "focus": "كم من السكر يذوب في الشاي؟ المحلول المشبع"}, "f": ["1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي.\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي.\nمخرج تعليمي آخر: يعرّف المحلول المشبع.", "1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "يسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟", "1) التهيئة: سكر بلا نهاية؟ (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويطلب تنبؤًا رقميًا.\n   الطالب: يسجلون تنبؤاتهم في ورقة العمل 3-5ب.\n2) السلامة (5 دقائق: 5–10)\n   المعلم: ينبه: المعلم وحده يصب الماء الساخن.\n   الطالب: يكررون القاعدة.\n3) ورقة العمل 3-5ب: الاستقصاء (15 دقائق: 10–25)\n   المعلم: يصب 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب.\n   الطالب: يعدّون الملاعق ويزنون السكر ويسجلون.\n4) المحلول المشبع والتنبؤ (10 دقائق: 25–35)\n   المعلم: يعرّف المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب.\n   الطالب: يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "للطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}], "comb": ["الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة.\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا.\nمخرج تعليمي آخر: يمثل تكوّن المحلول بنموذج الجزيئات.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n1. يميز بين المخلوط والمادة النقية بأمثلة.\n2. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات.\nمخرج تعليمي آخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي.\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي.\nمخرج تعليمي آخر: يعرّف المحلول المشبع.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. يعرّف المحلول ويحدد فيه المادة المذابة والمادة المذيبة. ← فهم\n2. يحضّر محلولًا من مسحوق شراب بارد ويصف كيف يصبح متجانسًا. ← تطبيق\nالمخرج الآخر: يمثل تكوّن المحلول بنموذج الجزيئات. ← تطبيق\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n1. يميز بين المخلوط والمادة النقية بأمثلة. ← فهم\n2. يخطط لاستقصاء يحدد هل المحلول مخلوط أم مادة نقية، ويختار الأدلة والأدوات. ← تحليل\nالمخرج الآخر: يحدد هل عصير البرتقال مخلوط أم محلول أم مادة نقية ويعلل. ← تقييم\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. يستقصي كمية السكر التي تذوب في كمية محددة من الشاي. ← تطبيق\n2. يستخدم النتائج للتنبؤ بكمية السكر التي تذوب في كمية أكبر من الشاي. ← تحليل\nالمخرج الآخر: يعرّف المحلول المشبع. ← فهم", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الاستقصاء العلمي\n- التعلم بالنمذجة\n- التعلم التعاوني\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n- التعلم المبني على حل المشكلات\n- الاستقصاء العلمي\n- فكّر – زاوج – شارك\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الاستقصاء العلمي\n- التعلم المبني على حل المشكلات\n- التعلم التعاوني", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: مسحوق شراب بارد، كأس، ملعقة، مخبار مدرج، ساعة إيقاف\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورقة العمل 3-5أ، عصير برتقال طازج\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، أكياس شاي، ماء ساخن يصبه المعلم، ميزان إلكتروني، كأس مدرجة، ملعقة، ورقة العمل 3-5ب، تمرين 3-5", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n- المحلول\n- المادة المذابة\n- المادة المذيبة\n- متجانس\n- نموذج الجزيئات\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n- المادة النقية\n- المخلوط\n- الحديد والفولاذ\n- الأكسجين والهواء\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n- المحلول المشبع\n- الكمية\n- التنبؤ\n- الميزان", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nيعرض المعلم صورة ماء البحر ويسأل: هل ترى الملح في ماء البحر؟ كيف نعرف أنه موجود؟\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\nيعرض المعلم ملعقة سكر وعلبة مسحوق شراب بارد ويسأل: أيهما مادة نقية؟ وأيهما مخلوط؟\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\nيسأل المعلم: إذا ظللت تضيف السكر إلى كوب الشاي، هل سيذوب كله؟ متى يتوقف؟", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1) التهيئة: ماء البحر (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويقود إلى أن ماء البحر محلول.\n   الطالب: يجيبون: الطعم المالح، الملح المتبقي بعد التبخر.\n2) المذاب والمذيب (10 دقائق: 5–15)\n   المعلم: يشرح ص 62 ويرسم نموذج الجزيئات: جزيئات المذاب تنتشر بالتساوي بين جزيئات المذيب.\n   الطالب: يحددون المذاب والمذيب في أمثلة: سكر في شاي، ملح في ماء.\n3) نشاط 3-5: تحضير محلول (14 دقائق: 15–29)\n   المعلم: يوجه وضع 100 mL ماء وإضافة ملعقة مسحوق شراب دون تحريك ثم الملاحظة بعد خمس دقائق.\n   الطالب: يرسمون ما يحدث حول المسحوق، ويحددون المذاب والمذيب.\n4) المحلول المتجانس (6 دقائق: 29–35)\n   المعلم: يقدم مصطلح «متجانس»: يبدو المحلول بالشكل نفسه في جميع أجزائه.\n   الطالب: يصفون محلولهم باستخدام المصطلح.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n1) التهيئة: سكر أم مسحوق؟ (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويقرأ مكونات علبة المسحوق.\n   الطالب: يستنتجون أن السكر نقي والمسحوق مخلوط.\n2) المواد النقية والمخاليط (10 دقائق: 5–15)\n   المعلم: يشرح ص 63 ويناقش أمثلة: الحديد نقي/الفولاذ مخلوط، الأكسجين نقي/الهواء مخلوط، الملح نقي/ماء البحر مخلوط.\n   الطالب: يصنفون أمثلة في جدول.\n3) الأسئلة 1–5 ص 63: خطة استقصاء (12 دقائق: 15–27)\n   المعلم: يوجه المجموعات للتخطيط: هل المحلول مادة نقية؟ ما الأدلة؟ كيف نتأكد من كفايتها؟ ما الأدوات؟ كيف نجعله عادلًا؟\n   الطالب: يكتبون خطة مختصرة: تبخير الماء وملاحظة ما يتبقى.\n4) ورقة العمل 3-5أ وتحدّث عن (8 دقائق: 27–35)\n   المعلم: يوجه بدء ورقة العمل 3-5أ (ص 76–77) ويناقش عصير البرتقال.\n   الطالب: يجيبون ويستنتجون أن العصير مخلوط.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1) التهيئة: سكر بلا نهاية؟ (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويطلب تنبؤًا رقميًا.\n   الطالب: يسجلون تنبؤاتهم في ورقة العمل 3-5ب.\n2) السلامة (5 دقائق: 5–10)\n   المعلم: ينبه: المعلم وحده يصب الماء الساخن.\n   الطالب: يكررون القاعدة.\n3) ورقة العمل 3-5ب: الاستقصاء (15 دقائق: 10–25)\n   المعلم: يصب 100 mL من الشاي لكل مجموعة ويوجه الإضافة بالملعقة والتحريك حتى يبقى سكر لا يذوب.\n   الطالب: يعدّون الملاعق ويزنون السكر ويسجلون.\n4) المحلول المشبع والتنبؤ (10 دقائق: 25–35)\n   المعلم: يعرّف المحلول المشبع، ويطلب حساب كمية السكر الذائبة في 250 mL بالتناسب.\n   الطالب: يتنبؤون: إذا ذاب 125 g في 100 mL فإن نحو 312 g تذوب في 250 mL.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-5).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. [مستوى المعرفة] في محلول السكر والشاي، ما المادة المذابة؟\n   الإجابة النموذجية: السكر.\n2. [مستوى التطبيق] ما المادة المذيبة في ماء البحر؟\n   الإجابة النموذجية: الماء.\n3. [مستوى الاستدلال] لماذا يبدو المحلول متجانسًا؟\n   الإجابة النموذجية: لأن جزيئات المادة المذابة انتشرت بالتساوي بين جزيئات المذيب.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n1. [مستوى المعرفة] هل الهواء مادة نقية؟ وضح.\n   الإجابة النموذجية: لا؛ هو مخلوط من غازات مختلفة.\n2. [مستوى التطبيق] هل المحلول مادة نقية أم مخلوط؟\n   الإجابة النموذجية: مخلوط؛ لأنه يتكون من مادتين: مذاب ومذيب.\n3. [مستوى الاستدلال] ما الدليل الذي تجمعه لتثبت أن ماء البحر مخلوط؟\n   الإجابة النموذجية: نبخر الماء فيتبقى الملح، أي أنه كان يحتوي مادتين.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. [مستوى المعرفة] ما المحلول المشبع؟\n   الإجابة النموذجية: محلول لا تذوب فيه كمية إضافية من المادة المذابة.\n2. [مستوى التطبيق] كيف عرفت أن الشاي أصبح مشبعًا بالسكر؟\n   الإجابة النموذجية: عندما بقي سكر في القاع لا يذوب رغم التحريك.\n3. [مستوى الاستدلال] إذا ذاب 125 g من السكر في 100 mL، فكم يذوب تقريبًا في 250 mL؟\n   الإجابة النموذجية: نحو 312 g (125 × 2.5).", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\n1. [مستوى المعرفة] ما المحلول؟\n   الإجابة النموذجية: مخلوط يتكون من مادة مذابة ذائبة في مادة مذيبة.\n2. [مستوى التطبيق] ماذا شاهدت حول مسحوق الشراب في الماء؟\n   الإجابة النموذجية: انتشر اللون تدريجيًا حول المسحوق في الماء.\n3. [مستوى الاستدلال] ارسم نموذجًا بالدوائر لمحلول الملح في الماء.\n   الإجابة النموذجية: دوائر صغيرة (الملح) موزعة بالتساوي بين دوائر الماء.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\n1. [مستوى المعرفة] مم تتكون المادة النقية؟\n   الإجابة النموذجية: من جزيئات تلك المادة فقط.\n2. [مستوى التطبيق] أيهما يسهل فصله: المخلوط أم المادة النقية؟\n   الإجابة النموذجية: المخلوط.\n3. [مستوى الاستدلال] هل عصير البرتقال الطازج مادة نقية؟ علّل.\n   الإجابة النموذجية: لا؛ هو مخلوط فيه مواد معلّقة تترسب ومواد ذائبة كالسكر.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\n1. [مستوى المعرفة] لماذا لا يصب الطلبة الماء الساخن بأنفسهم؟\n   الإجابة النموذجية: حفاظًا على سلامتهم من الحروق.\n2. [مستوى التطبيق] ما الأداة التي قسنا بها كتلة السكر؟\n   الإجابة النموذجية: الميزان الإلكتروني.\n3. [مستوى الاستدلال] اقترح طريقة لجعل استقصائك عادلًا عند المقارنة بين مجموعتين.\n   الإجابة النموذجية: استخدام الكمية نفسها من الشاي بدرجة الحرارة نفسها والسكر نفسه وطريقة التحريك نفسها.", "الحصة 1: المحلول: المادة المذابة والمادة المذيبة\nللطالب: قراءة كتاب الطالب ص 62 وكتابة ثلاثة محاليل من المطبخ مع تحديد المذاب والمذيب. لولي الأمر: يُرجى مساعدة الابن في أمثلة المحاليل المنزلية.\n\nالحصة 2: المخاليط والمواد النقية: هل المحلول مادة نقية؟\nللطالب: إكمال ورقة العمل 3-5أ (كتاب النشاط ص 76–77) واجبًا منزليًا. لولي الأمر: يُرجى ترك كوب عصير طازج مع الابن لملاحظة انفصال طبقاته.\n\nالحصة 3: كم من السكر يذوب في الشاي؟ المحلول المشبع\nللطالب: حل تمرين 3-5 في كتاب النشاط ص 41 ومراجعة ص 62–63. لولي الأمر: يُرجى توعية الابن بالإقلال من السكر في المشروبات لصحته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=23"]}, {"id": "3-6", "title": "كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 86–90", "n": 3, "per": [{"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64 | دليل المعلم ص 86–88", "num": "الحصة الأولى من 3", "focus": "التحريك يزيد سرعة الذوبان"}, "f": ["1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع.\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع.\nمخرج تعليمي آخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا.", "1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم", "- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة", "- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات", "يعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟", "1) التهيئة: شاي محمد (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة.\n   الطالب: يقترحون التحريك.\n2) تجربة عرض: كأسان (12 دقائق: 5–17)\n   المعلم: يصب الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط.\n   الطالب: يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت.\n3) التفسير بالجزيئات (10 دقائق: 17–27)\n   المعلم: يشرح ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع.\n   الطالب: يرسمون نموذجين: دون تحريك ومع تحريك.\n4) هل كان الاختبار عادلًا؟ (8 دقائق: 27–35)\n   المعلم: يسأل عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة.\n   الطالب: يكتبون الثوابت ويستنتجون.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.", "1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.", "للطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 65 | دليل المعلم ص 87–89", "num": "الحصة الثانية من 3", "focus": "درجة الحرارة وسرعة الذوبان (نشاط 3-6)"}, "f": ["1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل.\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات.\nمخرج تعليمي آخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة.", "1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف", "- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف، ملعقة، مخبار مدرج", "- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج", "يسأل المعلم: لماذا نصنع الشاي والقهوة بالماء الساخن؟ هل جربت صنع الشاي بماء من الثلاجة؟", "1) التهيئة والتنبؤ (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويطلب تنبؤًا مكتوبًا.\n   الطالب: يكتبون تنبؤاتهم.\n2) السلامة والأدوات (5 دقائق: 5–10)\n   المعلم: يؤكد استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم.\n   الطالب: يتعرفون على قراءة مقياس الحرارة.\n3) نشاط 3-6 (15 دقائق: 10–25)\n   المعلم: يوجه وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ.\n   الطالب: يقيسون الزمن ويسجلون في جدول.\n4) الأسئلة 1–3 ص 65 (10 دقائق: 25–35)\n   المعلم: يناقش: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات.\n   الطالب: يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n2. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n3. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.", "1. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n2. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n3. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.", "للطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"h": {"lesson": "3-6 كيف نجعل المواد الصلبة تذوب أسرع؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 64–65 | كتاب النشاط ص 42، 79–83 | دليل المعلم ص 88–89", "num": "الحصة الثالثة من 3", "focus": "تفسير الرسوم البيانية للذوبان والعوامل المؤثرة"}, "f": ["1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة.\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج.\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب.", "1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "يعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟", "1) التهيئة: رسم بلا عنوان (5 دقائق: 0–5)\n   المعلم: يعرض الرسم ويناقش عناصر التمثيل البياني.\n   الطالب: يذكرون: العنوان، أسماء المحاور، الوحدات.\n2) أوراق العمل حسب المستوى (14 دقائق: 5–19)\n   المعلم: يوزع 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم.\n   الطالب: يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع.\n3) تمرين 3-6 (8 دقائق: 19–27)\n   المعلم: يوجه تمرين 3-6 (ص 42) عن العوامل والاختبار العادل لدعم المتعثرين.\n   الطالب: يحلون فرديًا.\n4) تصحيح مفهوم (8 دقائق: 27–35)\n   المعلم: يوضح الفرق بين سرعة الذوبان وكمية المادة الذائبة، ويلخص العاملين: التحريك ودرجة الحرارة.\n   الطالب: يكملون خريطة: عوامل تسرّع الذوبان.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] من التمثيل البياني: عند أي درجة حرارة استغرق السكر أقصر زمن؟\n   الإجابة النموذجية: عند أعلى درجة حرارة في التمثيل.\n2. [مستوى التطبيق] صف النمط: كلما زادت درجة الحرارة...\n   الإجابة النموذجية: قل زمن الذوبان (أي ذاب السكر أسرع).\n3. [مستوى الاستدلال] ما الفرق بين «يذوب أسرع» و«يذوب أكثر»؟\n   الإجابة النموذجية: الأول يتعلق بسرعة ذوبان الكمية نفسها، والثاني بكمية المادة التي يمكن أن تذوب.", "1. [مستوى المعرفة] اذكر عاملين يجعلان المادة تذوب أسرع.\n   الإجابة النموذجية: التحريك ورفع درجة الحرارة.\n2. [مستوى التطبيق] لماذا يُفضل التمثيل الخطي عند قياس الزمن عند عدة درجات حرارة؟\n   الإجابة النموذجية: لأنه يوضح التغير المستمر ويسمح بقراءة قيم بين القياسات.\n3. [مستوى الاستدلال] لماذا لا تُغسل الملابس عادة بدرجات حرارة عالية جدًا؟\n   الإجابة النموذجية: لأن الحرارة المرتفعة قد تتلف الأقمشة أو تسبب تقلصها.", "للطالب: إكمال ورقة العمل 3-6ج (كتاب النشاط ص 82–83) واجبًا منزليًا وحل تمرين 3-6 (ص 42). لولي الأمر: يُرجى مساعدة الابن في رسم التمثيل البياني بالمسطرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}], "comb": ["الحصة 1: التحريك يزيد سرعة الذوبان\n1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع.\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع.\nمخرج تعليمي آخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل.\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات.\nمخرج تعليمي آخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة.\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج.\nمخرج تعليمي آخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب.", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. يوضح أن التحريك يجعل المادة المذابة تذوب أسرع. ← فهم\n2. يفسر أثر التحريك بانتشار جزيئات المذاب بين جزيئات المذيب أسرع. ← تحليل\nالمخرج الآخر: يحدد ما إذا كان اختبار التحريك اختبارًا عادلًا. ← تقييم\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1. يقارن زمن ذوبان السكر في الماء الساخن والبارد في اختبار عادل. ← تطبيق\n2. يفسر ذوبان المواد أسرع في الماء الساخن بحركة الجزيئات. ← تحليل\nالمخرج الآخر: يستنتج أن بعض المواد كالملح لا تتأثر كثيرًا بدرجة الحرارة. ← تقييم\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. يفسر تمثيلًا بيانيًا يوضح زمن الذوبان عند درجات حرارة مختلفة. ← تحليل\n2. يرسم تمثيلًا بيانيًا خطيًا ويحدد النمط في النتائج. ← تطبيق\nالمخرج الآخر: يميز بين جعل المادة تذوب أسرع وجعل كمية أكبر منها تذوب. ← تحليل", "الحصة 1: التحريك يزيد سرعة الذوبان\n- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم بالاكتشاف\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "الحصة 1: التحريك يزيد سرعة الذوبان\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: كأسان، مخبار مدرج، بلورات برمنجنات البوتاسيوم (للمعلم)، ملعقة\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n- الكتاب\n- السبورة التقليدية\n- أخرى: سكر، كؤوس، ماء بارد، ماء دافئ (نحو 50°C يصبه المعلم)، مقياس حرارة كحولي، ساعة إيقاف، ملعقة، مخبار مدرج\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- الكتاب\n- الأقلام\n- السبورة الذكية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: أوراق العمل 3-6أ و3-6ب و3-6ج، تمرين 3-6، مساطر", "الحصة 1: التحريك يزيد سرعة الذوبان\n- معدل الذوبان\n- التحريك\n- الاختبار العادل\n- الجزيئات\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n- درجة الحرارة\n- مقياس الحرارة\n- الطاقة الحركية\n- الاستنتاج\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n- التمثيل الخطي\n- النمط\n- معدل الذوبان\n- العوامل المؤثرة", "الحصة 1: التحريك يزيد سرعة الذوبان\nيعرض المعلم صورة محمد مع جدته ص 64 ويسأل: لماذا كان طعم الشاي مرًا رغم وضع السكر؟ كيف يجعله أحلى دون سكر إضافي؟\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\nيسأل المعلم: لماذا نصنع الشاي والقهوة بالماء الساخن؟ هل جربت صنع الشاي بماء من الثلاجة؟\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nيعرض المعلم تمثيلًا بيانيًا بلا عنوان ويسأل: ماذا ينقص هذا الرسم؟ وماذا يمكن أن نفهم منه؟", "الحصة 1: التحريك يزيد سرعة الذوبان\n1) التهيئة: شاي محمد (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة.\n   الطالب: يقترحون التحريك.\n2) تجربة عرض: كأسان (12 دقائق: 5–17)\n   المعلم: يصب الكمية نفسها من الماء في كأسين ويضيف البلورات نفسها ويحرك إحداهما فقط.\n   الطالب: يلاحظون أي الكأسين ذابت فيها البلورات أسرع ويحددون العامل المتغير والثوابت.\n3) التفسير بالجزيئات (10 دقائق: 17–27)\n   المعلم: يشرح ص 64: التحريك يجعل جزيئات المذاب تتصل بالمذيب وتنتشر في الفراغات أسرع.\n   الطالب: يرسمون نموذجين: دون تحريك ومع تحريك.\n4) هل كان الاختبار عادلًا؟ (8 دقائق: 27–35)\n   المعلم: يسأل عن الثوابت: كمية الماء، كمية البلورات، درجة الحرارة.\n   الطالب: يكتبون الثوابت ويستنتجون.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1) التهيئة والتنبؤ (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويطلب تنبؤًا مكتوبًا.\n   الطالب: يكتبون تنبؤاتهم.\n2) السلامة والأدوات (5 دقائق: 5–10)\n   المعلم: يؤكد استخدام مقياس الحرارة الكحولي وماء «تتحمله اليد» يصبه المعلم.\n   الطالب: يتعرفون على قراءة مقياس الحرارة.\n3) نشاط 3-6 (15 دقائق: 10–25)\n   المعلم: يوجه وضع 100 mL ماء بارد وإضافة ملعقة سكر مع التحريك نفسه وحساب الزمن، ثم التكرار بالماء الدافئ.\n   الطالب: يقيسون الزمن ويسجلون في جدول.\n4) الأسئلة 1–3 ص 65 (10 دقائق: 25–35)\n   المعلم: يناقش: أين ذاب أسرع؟ هل الاختبار عادل؟ ما الاستنتاج؟ ويشرح حركة الجزيئات.\n   الطالب: يكتبون الاستنتاج: يذوب السكر أسرع في الماء الساخن.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1) التهيئة: رسم بلا عنوان (5 دقائق: 0–5)\n   المعلم: يعرض الرسم ويناقش عناصر التمثيل البياني.\n   الطالب: يذكرون: العنوان، أسماء المحاور، الوحدات.\n2) أوراق العمل حسب المستوى (14 دقائق: 5–19)\n   المعلم: يوزع 3-6أ (تفسير تمثيل) للجميع، و3-6ج (تمثيل خطي لنتائج ريم) للمتوسطين، و3-6ب (مسحوق الغسيل) للمتقدمين بإشراف المعلم.\n   الطالب: يحلون الورقة ويحددون درجة الحرارة التي يذوب عندها السكر أسرع.\n3) تمرين 3-6 (8 دقائق: 19–27)\n   المعلم: يوجه تمرين 3-6 (ص 42) عن العوامل والاختبار العادل لدعم المتعثرين.\n   الطالب: يحلون فرديًا.\n4) تصحيح مفهوم (8 دقائق: 27–35)\n   المعلم: يوضح الفرق بين سرعة الذوبان وكمية المادة الذائبة، ويلخص العاملين: التحريك ودرجة الحرارة.\n   الطالب: يكملون خريطة: عوامل تسرّع الذوبان.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-6).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. [مستوى المعرفة] في أي الكأسين ذابت البلورات أسرع؟\n   الإجابة النموذجية: في الكأس التي حُركت.\n2. [مستوى التطبيق] ما العامل الذي غيّرناه في التجربة؟\n   الإجابة النموذجية: التحريك.\n3. [مستوى الاستدلال] لماذا يسرّع التحريك الذوبان؟\n   الإجابة النموذجية: لأنه يجعل جزيئات المادة المذابة تنتشر بين جزيئات المذيب على نحو أسرع.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1. [مستوى المعرفة] في أي كأس ذاب السكر أسرع؟\n   الإجابة النموذجية: في كأس الماء الساخن.\n2. [مستوى التطبيق] كيف تتأكد أن اختبارك عادل؟\n   الإجابة النموذجية: باستخدام الكمية نفسها من الماء والسكر والتحريك نفسه، وتغيير درجة الحرارة فقط.\n3. [مستوى الاستدلال] لماذا يذوب السكر أسرع في الماء الساخن؟\n   الإجابة النموذجية: لأن جزيئات الماء الساخن تتحرك أسرع فتنتشر جزيئات السكر بينها بسهولة.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. [مستوى المعرفة] من التمثيل البياني: عند أي درجة حرارة استغرق السكر أقصر زمن؟\n   الإجابة النموذجية: عند أعلى درجة حرارة في التمثيل.\n2. [مستوى التطبيق] صف النمط: كلما زادت درجة الحرارة...\n   الإجابة النموذجية: قل زمن الذوبان (أي ذاب السكر أسرع).\n3. [مستوى الاستدلال] ما الفرق بين «يذوب أسرع» و«يذوب أكثر»؟\n   الإجابة النموذجية: الأول يتعلق بسرعة ذوبان الكمية نفسها، والثاني بكمية المادة التي يمكن أن تذوب.", "الحصة 1: التحريك يزيد سرعة الذوبان\n1. [مستوى المعرفة] ماذا نقصد بمعدل الذوبان؟\n   الإجابة النموذجية: سرعة ذوبان المادة المذابة في المذيب.\n2. [مستوى التطبيق] اذكر عاملين ثبتناهما في التجربة.\n   الإجابة النموذجية: كمية الماء وكمية البلورات (ودرجة الحرارة).\n3. [مستوى الاستدلال] كيف يجعل محمد الشاي أحلى دون إضافة سكر؟\n   الإجابة النموذجية: بتحريكه ليذوب السكر الموجود أسرع.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\n1. [مستوى المعرفة] ما العامل المتغير في نشاط 3-6؟\n   الإجابة النموذجية: درجة حرارة الماء.\n2. [مستوى التطبيق] لماذا نستخدم مقياس الحرارة الكحولي لا الزئبقي؟\n   الإجابة النموذجية: لأن الزئبق سام إذا انكسر المقياس.\n3. [مستوى الاستدلال] هل تذوب جميع المواد أسرع في الماء الساخن؟ وضح.\n   الإجابة النموذجية: معظمها نعم، لكن الملح يذوب بسرعة متقاربة في الساخن والبارد.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\n1. [مستوى المعرفة] اذكر عاملين يجعلان المادة تذوب أسرع.\n   الإجابة النموذجية: التحريك ورفع درجة الحرارة.\n2. [مستوى التطبيق] لماذا يُفضل التمثيل الخطي عند قياس الزمن عند عدة درجات حرارة؟\n   الإجابة النموذجية: لأنه يوضح التغير المستمر ويسمح بقراءة قيم بين القياسات.\n3. [مستوى الاستدلال] لماذا لا تُغسل الملابس عادة بدرجات حرارة عالية جدًا؟\n   الإجابة النموذجية: لأن الحرارة المرتفعة قد تتلف الأقمشة أو تسبب تقلصها.", "الحصة 1: التحريك يزيد سرعة الذوبان\nللطالب: قراءة كتاب الطالب ص 64 وتجربة إذابة السكر مع التحريك ودونه في المنزل. لولي الأمر: يُرجى الإشراف على التجربة باستخدام ماء غير ساخن.\n\nالحصة 2: درجة الحرارة وسرعة الذوبان (نشاط 3-6)\nللطالب: مراجعة ص 65 وكتابة استنتاج النشاط في الدفتر. لولي الأمر: يُرجى الحرص على سلامة الابن عند التعامل مع الماء الساخن.\n\nالحصة 3: تفسير الرسوم البيانية للذوبان والعوامل المؤثرة\nللطالب: إكمال ورقة العمل 3-6ج (كتاب النشاط ص 82–83) واجبًا منزليًا وحل تمرين 3-6 (ص 42). لولي الأمر: يُرجى مساعدة الابن في رسم التمثيل البياني بالمسطرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=24"]}, {"id": "3-7", "title": "كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66–67 | كتاب النشاط ص 43، 84–85 | دليل المعلم ص 90–92", "n": 2, "per": [{"h": {"lesson": "3-7 كيف يؤثر حجم الحبيبات في الذوبان؟", "unit": "الوحدة الثالثة: تغيرات المادة", "week": "الأسبوع الخامس عشر (13–17/12/2026)", "pages": "كتاب الطالب ص 66 | دليل المعلم ص 90–91", "num": "الحصة الأولى من 2", "focus": "حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء"}, "f": ["1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية.\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان.\nمخرج تعليمي آخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة.", "1. يستنتج أن تقسيم المادة إلى أجزاء أصغر يزيد مساحة سطحها الكلية. ← فهم\n2. يخطط لاستقصاء عادل يختبر أثر حجم الحبيبات في سرعة الذوبان. ← تطبيق\nالمخرج الآخر: يحدد العامل المتغير والعوامل الثابتة والأدوات اللازمة. ← تحليل", "- التعلم بالاكتشاف\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: ورق A4، مقص، مسطرة، قطعة سكر وحبيبات سكر ومسحوق سكر", "- حجم الحبيبات\n- مساحة السطح\n- التخطيط\n- العامل المتغير\n- العوامل الثابتة", "يعرض المعلم قطعة سكر وملعقة حبيبات سكر ومسحوق سكر، ويسأل: أيها تتوقع أن يذوب أولًا في الماء؟ ولماذا؟", "1) التهيئة: ثلاثة أشكال للسكر (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويسجل التنبؤات.\n   الطالب: يتنبؤون ويبررون.\n2) نشاط الحواف (مساحة السطح) (12 دقائق: 5–17)\n   المعلم: يوجه قياس محيط ورقة A4، ثم قصها إلى أربع قطع وجمع محيطاتها، ثم القص مجددًا.\n   الطالب: يقيسون ويقارنون ويستنتجون: كلما صغرت القطع زاد طول الحواف الكلي.\n3) الربط بالذوبان (8 دقائق: 17–25)\n   المعلم: يشرح ص 67: الحبيبات الصغيرة لها مساحة سطح أكبر تتصل بالمذيب فتذوب أسرع.\n   الطالب: يكتبون الاستنتاج ويطبقونه على السكر.\n4) التخطيط لنشاط 3-7 (10 دقائق: 25–35)\n   المعلم: يوجه التخطيط: التنبؤ، المواد والأدوات، العامل المتغير، الثوابت، طريقة الاختبار العادل، جدول النتائج.\n   الطالب: تكتب كل مجموعة خطتها.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويراجع الخطط.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ماذا حدث لطول الحواف الكلي عندما قصصت الورقة إلى قطع أصغر؟\n   الإجابة النموذجية: ازداد.\n2. [مستوى التطبيق] ما العامل المتغير في استقصاء حجم الحبيبات؟\n   الإجابة النموذجية: حجم حبيبات المادة المذابة.\n3. [مستوى الاستدلال] اذكر ثلاثة عوامل يجب تثبيتها.\n   الإجابة النموذجية: كمية الماء ودرجة حرارته، وكتلة السكر، وطريقة التحريك.", "1. [مستوى المعرفة] أيهما يذوب أسرع: قطعة السكر أم مسحوق السكر؟\n   الإجابة النموذجية: مسحوق السكر.\n2. [مستوى التطبيق] لماذا تذوب الحبيبات الصغيرة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها الكلية أكبر فتتصل بالمذيب أكثر.\n3. [مستوى الاستدلال] ما الأداة التي تقيس بها زمن الذوبان؟\n   الإجابة النموذجية: ساعة الإيقاف.", "للطالب: مراجعة خطة الاستقصاء وإحضار أنواع مختلفة من السكر أو الملح إن أمكن. تتصل بالمذيب فتذوب أسرع.\n   الطالب: يكتبون الاستنتاج ويطبقونه على السكر.\n4) التخطيط لنشاط 3-7 (10 دقائق: 25–35)\n   المعلم: يوجه التخطيط: التنبؤ، المواد والأدوات، العامل المتغير، الثوابت، طريقة الاختبار العادل، جدول النتائج.\n   الطالب: تكتب كل مجموعة خطتها.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويراجع الخطط.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\n1) التهيئة: مراجعة الخطة (4 دقائق: 0–4)\n   المعلم: يراجع الخطط سريعًا.\n   الطالب: يذكرون الثوابت.\n2) نشاط 3-7: التنفيذ (14 دقائق: 4–18)\n   المعلم: يتابع المجموعات المتفاوتة القدرات وتبادل الأدوار في حساب الزمن والتحريك.\n   الطالب: يقيسون زمن ذوبان كل حجم ويسجلونه في جدول.\n3) التمثيل والأسئلة 1–4 ص 67 (7 دقائق: 18–25)\n   المعلم: يوجه التمثيل بالأعمدة ومناقشة: هل تدعم النتائج التنبؤ؟ ما الاستنتاج؟ كيف تتأكد منه؟ تنبأ بالمسحوق الناعم.\n   الطالب: يرسمون ويجيبون.\n4) ورقة العمل 3-7 أو تمرين 3-7 (10 دقائق: 25–35)\n   المعلم: يوزع ورقة العمل 3-7 (مقارنة مرام وشمس، ص 84–85) أو تمرين 3-7 (ص 43)، ويناقش سؤال الأقراص الفوارة.\n   الطالب: يحلون ويربطون بالهضم في الوحدة الأولى.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 3-7).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء\n1. [مستوى المعرفة] ماذا حدث لطول الحواف الكلي عندما قصصت الورقة إلى قطع أصغر؟\n   الإجابة النموذجية: ازداد.\n2. [مستوى التطبيق] ما العامل المتغير في استقصاء حجم الحبيبات؟\n   الإجابة النموذجية: حجم حبيبات المادة المذابة.\n3. [مستوى الاستدلال] اذكر ثلاثة عوامل يجب تثبيتها.\n   الإجابة النموذجية: كمية الماء ودرجة حرارته، وكتلة السكر، وطريقة التحريك.\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\n1. [مستوى المعرفة] أي الحبيبات استغرقت أقل زمن للذوبان؟\n   الإجابة النموذجية: الحبيبات الأصغر.\n2. [مستوى التطبيق] ما الاستنتاج من نتائج الاستقصاء؟\n   الإجابة النموذجية: كلما صغر حجم الحبيبات ذابت أسرع.\n3. [مستوى الاستدلال] كيف تتأكد من صحة استنتاجك؟\n   الإجابة النموذجية: بتكرار الاستقصاء ومقارنة النتائج مع المجموعات الأخرى.", "الحصة 1: حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء\n1. [مستوى المعرفة] أيهما يذوب أسرع: قطعة السكر أم مسحوق السكر؟\n   الإجابة النموذجية: مسحوق السكر.\n2. [مستوى التطبيق] لماذا تذوب الحبيبات الصغيرة أسرع؟\n   الإجابة النموذجية: لأن مساحة سطحها الكلية أكبر فتتصل بالمذيب أكثر.\n3. [مستوى الاستدلال] ما الأداة التي تقيس بها زمن الذوبان؟\n   الإجابة النموذجية: ساعة الإيقاف.\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\n1. [مستوى المعرفة] تنبأ: كيف يتغير زمن الذوبان عند استخدام مسحوق ناعم؟\n   الإجابة النموذجية: يقل الزمن فيذوب أسرع.\n2. [مستوى التطبيق] لماذا تُذاب بعض الأدوية مثل الأقراص الفوارة قبل تناولها؟\n   الإجابة النموذجية: لأنها حبيبات صغيرة ذائبة يمتصها الجسم إلى الدم بسرعة أكبر.\n3. [مستوى الاستدلال] اذكر ثلاثة عوامل تزيد سرعة الذوبان.\n   الإجابة النموذجية: التحريك، رفع درجة الحرارة، تصغير حجم الحبيبات.", "الحصة 1: حجم الحبيبات ومساحة السطح والتخطيط لاستقصاء\nللطالب: مراجعة خطة الاستقصاء وإحضار أنواع مختلفة من السكر أو الملح إن أمكن. لولي الأمر: يُرجى مساعدة الابن في توفير المواد البسيطة للاستقصاء.\n\nالحصة 2: تنفيذ استقصاء حجم الحبيبات وتحليل النتائج\nللطالب: إكمال ورقة العمل 3-7 (كتاب النشاط ص 84–85) وتمرين 3-7 (ص 43)، ومراجعة الوحدة الثالثة. لولي الأمر: يُرجى مراجعة عوامل سرعة الذوبان مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=25"]}],[{"id": "1-1", "title": "أعضاء الجسم", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 18–19 | كتاب النشاط ص 16، 49 | دليل المعلم ص 24–26", "n": 2, "per": [{"h": {"lesson": "1-1 أعضاء الجسم", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 18–19 | دليل المعلم ص 24–26", "num": "الحصة الأولى من 2", "focus": "أعضاء الجسم الرئيسية: أسماؤها ومواقعها"}, "f": ["1. يسمّي أعضاء الجسم الرئيسية: الدماغ، القلب، الرئتين، الكليتين، المعدة، الأمعاء، الكبد.\n2. يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان.\nمخرج تعليمي آخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء.", "1. يسمّي أعضاء الجسم الرئيسية: الدماغ، القلب، الرئتين، الكليتين، المعدة، الأمعاء، الكبد. ← تذكر\n2. يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان. ← فهم\nالمخرج الآخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء. ← فهم", "- التعلم التعاوني\n- التعلم بالاكتشاف\n- العصف الذهني\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الأقلام\n- أخرى: ورق مقوى وورق أبيض وأقلام تلوين ومقص وغراء لنشاط 1-1", "- أعضاء الجسم\n- أجهزة الجسم\n- الدماغ\n- القلب\n- الرئتان\n- الكبد", "يطرح المعلم تشبيه الجسم بالمدينة: ماذا تحتاج المدينة لتعمل؟ (طاقة، نقل، مياه، تخلّص من الفضلات، إدارة). يعقد جلسة عصف ذهني قصيرة عن أعضاء الجسم التي تقوم بأعمال مشابهة، ويسجّل الأفكار في خريطة ذهنية على السبورة.", "1) التهيئة: الجسم مدينة (5 دقائق: 0–5)\n   المعلم: يعرض تشبيه المدينة ويسأل عن احتياجاتها ويدوّن الأفكار في خريطة ذهنية.\n   الطالب: يقترحون احتياجات المدينة ويربطونها بأعضاء يعرفونها.\n2) استكشاف صورة الأعضاء (10 دقائق: 5–15)\n   المعلم: يعرض صورة أعضاء الجسم في كتاب الطالب ص 18 على السبورة الذكية، ويقدّم مصطلح «العضو» و«الجهاز».\n   الطالب: يقرؤون أسماء الأعضاء ويشيرون إلى موقع كل عضو على أجسامهم.\n3) نشاط 1-1 (الجزء الأول): مخطط الجسم (15 دقائق: 15–30)\n   المعلم: يوزّع المجموعات (4–5 طلاب) ويوجّه رسم محيط جسم زميل على الورق المقوى، ورسم الأعضاء بحجم تقريبي مناسب.\n   الطالب: يرسمون محيط الجسم ثم يرسمون الأعضاء ويكتبون أسماءها ويلوّنونها.\n4) مناقشة المواقع (6 دقائق: 30–36)\n   المعلم: يسأل: أي الأعضاء في الرأس؟ في الصدر؟ في البطن؟ ويصحّح الأخطاء.\n   الطالب: يجيبون مستعينين بالصورة ومخطط مجموعتهم.\n5) الختام والتقويم (4 دقائق: 36–40)\n   المعلم: يطرح أسئلة التقويم الختامي شفهيًا.\n   الطالب: يجيبون فرديًا ويحتفظون بالمخطط لاستكماله في الحصة القادمة.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] أشر إلى موقع القلب والرئتين في الصورة، وسمِّ كلًّا منهما.\n   الإجابة النموذجية: القلب في الصدر بين الرئتين مائلًا لليسار، والرئتان في الصدر على جانبيه.\n2. [مستوى التطبيق] ما العضو الموجود في الرأس؟ وما الأعضاء الموجودة في البطن؟\n   الإجابة النموذجية: الرأس: الدماغ. البطن: المعدة والأمعاء والكبد والكليتان (في الجزء الخلفي).\n3. [مستوى الاستدلال] لماذا نقول إن أعضاء الجسم «تعمل معًا»؟\n   الإجابة النموذجية: لأن كل عضو يؤدي جزءًا من عمل أكبر، وتتعاون الأعضاء لتكوّن أجهزة تؤدي وظائف الحياة.", "1. [مستوى المعرفة] اذكر ثلاثة من أعضاء الجسم الرئيسية.\n   الإجابة النموذجية: مثل: الدماغ، القلب، الرئتان (أو الكليتان، المعدة، الأمعاء، الكبد).\n2. [مستوى التطبيق] صنّف الأعضاء الآتية حسب موقعها (رأس/صدر/بطن): القلب، المعدة، الدماغ، الأمعاء.\n   الإجابة النموذجية: رأس: الدماغ. صدر: القلب. بطن: المعدة والأمعاء.\n3. [مستوى الاستدلال] أيّ الأعضاء الرئيسية يوجد في الجسم على هيئة زوج؟ وما الفائدة المحتملة من ذلك؟\n   الإجابة النموذجية: الرئتان والكليتان؛ وجود عضوين يزيد كفاءة العمل ويمكن للجسم أن يعمل بعضو واحد سليم عند الضرورة.", "للطالب: قراءة كتاب الطالب ص 18 وحفظ أسماء الأعضاء ومواقعها، وإحضار المخطط غير المكتمل. لولي الأمر: يُرجى مساعدة الابن على الإشارة إلى مواقع الأعضاء على جسمه وتسميتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=1"]}, {"h": {"lesson": "1-1 أعضاء الجسم", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 18–19 | كتاب النشاط ص 16، 49 | دليل المعلم ص 24–26", "num": "الحصة الثانية من 2", "focus": "وظائف الأعضاء الرئيسية وحمايتها"}, "f": ["1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية.\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة.\nمخرج تعليمي آخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية.", "1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية. ← فهم\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة. ← تطبيق\nالمخرج الآخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية. ← فهم", "- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: مخططات المجموعات وغراء ومقص", "- وظيفة العضو\n- الهضم\n- الإخراج\n- التنفس\n- الجمجمة\n- الضلوع", "يعرض المعلم بطاقات أسماء الأعضاء، ويطلب من كل طالب أن يخمّن «أفضل تنبؤ» لوظيفة عضو واحد، ثم يقارن التخمينات بعد الحصة.", "1) التهيئة: أفضل تنبؤ (5 دقائق: 0–5)\n   المعلم: يرفع بطاقة عضو ويطلب تنبؤًا بوظيفته، ويدوّن التنبؤات جانبًا.\n   الطالب: يتنبؤون بوظائف الأعضاء ويبرّرون.\n2) نشاط 1-1 (الجزء الثاني): إكمال المخطط (10 دقائق: 5–15)\n   المعلم: يتابع المجموعات أثناء قصّ الأعضاء ولصقها مستعينين بالصورة ص 18.\n   الطالب: يلصقون الأعضاء في مواضعها ويكتبون بجانب كل عضو وظيفته.\n3) وظائف الأعضاء (8 دقائق: 15–23)\n   المعلم: يناقش وظيفة كل عضو: الدماغ تحكّم وتفكير، القلب ضخ الدم، الرئتان تنفس، الكليتان إخراج، المعدة والأمعاء هضم، الكبد تخزين الطاقة والتخلص من المواد السامة.\n   الطالب: يقارنون تنبؤاتهم بالوظائف الصحيحة ويصحّحون.\n4) أسئلة النشاط 1-1 وتمرين 1-1 (7 دقائق: 23–30)\n   المعلم: يوجّه حل أسئلة النشاط ص 19 وتمرين 1-1 في كتاب النشاط ص 16 (لدعم المتعثرين).\n   الطالب: يجيبون فرديًا ثم يتحققون مع زميل.\n5) تحدّث عن: الحماية (5 دقائق: 30–35)\n   المعلم: يسأل: كيف تتم حماية أعضاء الجسم؟ ويذكّر بدراسة الصف الرابع.\n   الطالب: يذكرون أن الجمجمة تحمي الدماغ والضلوع تحمي القلب والرئتين.\n6) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] صِل العضو بوظيفته: القلب – الرئتان – الكليتان.\n   الإجابة النموذجية: القلب: ضخ الدم. الرئتان: التنفس. الكليتان: الإخراج (التخلص من الفضلات).\n2. [مستوى التطبيق] ما وظيفة الكبد كما وردت في كتاب الطالب؟\n   الإجابة النموذجية: تخزين الطاقة وتخليص الجسم من المواد السامة.\n3. [مستوى الاستدلال] لماذا يحتاج الدماغ إلى حماية قوية أكثر من غيره؟\n   الإجابة النموذجية: لأنه يتحكم في جميع وظائف الجسم، وإصابته قد تعطّل عمل الجسم كله، فتحميه الجمجمة الصلبة.", "1. [مستوى المعرفة] ما العضو المسؤول عن الهضم؟\n   الإجابة النموذجية: المعدة والأمعاء.\n2. [مستوى التطبيق] كيف تحمي الضلوع أعضاء الصدر؟\n   الإجابة النموذجية: تشكّل قفصًا عظميًا يحيط بالقلب والرئتين فيحميهما من الصدمات.\n3. [مستوى الاستدلال] لو تعطلت الكليتان، ما المشكلة التي ستواجه الجسم؟\n   الإجابة النموذجية: تتراكم الفضلات والماء الزائد في الدم فيتضرر الجسم.", "للطالب: حل ورقة العمل 1-1 (كتاب النشاط ص 49) وتمرين 1-1 (ص 16) واجبًا منزليًا، ومراجعة ص 19. لولي الأمر: يُرجى متابعة حل الواجب ومناقشة الابن في وظيفة كل عضو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=1"]}], "comb": ["الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n1. يسمّي أعضاء الجسم الرئيسية: الدماغ، القلب، الرئتين، الكليتين، المعدة، الأمعاء، الكبد.\n2. يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان.\nمخرج تعليمي آخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية.\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة.\nمخرج تعليمي آخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n1. يسمّي أعضاء الجسم الرئيسية: الدماغ، القلب، الرئتين، الكليتين، المعدة، الأمعاء، الكبد. ← تذكر\n2. يحدّد مواقع أعضاء الجسم الرئيسية على مخطط لجسم الإنسان. ← فهم\nالمخرج الآخر: يستنتج أن أعضاء الجسم تعمل معًا لتشكّل أجهزة تبقينا أحياء. ← فهم\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n1. يصف الوظيفة الأساسية لكل عضو من أعضاء الجسم الرئيسية. ← فهم\n2. يُكمل مخطط الجسم بلصق الأعضاء في مواضعها الصحيحة. ← تطبيق\nالمخرج الآخر: يوضّح دور الهيكل العظمي (الجمجمة والضلوع) في حماية الأعضاء الحيوية. ← فهم", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- العصف الذهني\n- الخرائط الذهنية والمفاهيمية\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على اللعب\n- فكّر – زاوج – شارك", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الأقلام\n- أخرى: ورق مقوى وورق أبيض وأقلام تلوين ومقص وغراء لنشاط 1-1\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: مخططات المجموعات وغراء ومقص", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n- أعضاء الجسم\n- أجهزة الجسم\n- الدماغ\n- القلب\n- الرئتان\n- الكبد\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n- وظيفة العضو\n- الهضم\n- الإخراج\n- التنفس\n- الجمجمة\n- الضلوع", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nيطرح المعلم تشبيه الجسم بالمدينة: ماذا تحتاج المدينة لتعمل؟ (طاقة، نقل، مياه، تخلّص من الفضلات، إدارة). يعقد جلسة عصف ذهني قصيرة عن أعضاء الجسم التي تقوم بأعمال مشابهة، ويسجّل الأفكار في خريطة ذهنية على السبورة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nيعرض المعلم بطاقات أسماء الأعضاء، ويطلب من كل طالب أن يخمّن «أفضل تنبؤ» لوظيفة عضو واحد، ثم يقارن التخمينات بعد الحصة.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n1) التهيئة: الجسم مدينة (5 دقائق: 0–5)\n   المعلم: يعرض تشبيه المدينة ويسأل عن احتياجاتها ويدوّن الأفكار في خريطة ذهنية.\n   الطالب: يقترحون احتياجات المدينة ويربطونها بأعضاء يعرفونها.\n2) استكشاف صورة الأعضاء (10 دقائق: 5–15)\n   المعلم: يعرض صورة أعضاء الجسم في كتاب الطالب ص 18 على السبورة الذكية، ويقدّم مصطلح «العضو» و«الجهاز».\n   الطالب: يقرؤون أسماء الأعضاء ويشيرون إلى موقع كل عضو على أجسامهم.\n3) نشاط 1-1 (الجزء الأول): مخطط الجسم (15 دقائق: 15–30)\n   المعلم: يوزّع المجموعات (4–5 طلاب) ويوجّه رسم محيط جسم زميل على الورق المقوى، ورسم الأعضاء بحجم تقريبي مناسب.\n   الطالب: يرسمون محيط الجسم ثم يرسمون الأعضاء ويكتبون أسماءها ويلوّنونها.\n4) مناقشة المواقع (6 دقائق: 30–36)\n   المعلم: يسأل: أي الأعضاء في الرأس؟ في الصدر؟ في البطن؟ ويصحّح الأخطاء.\n   الطالب: يجيبون مستعينين بالصورة ومخطط مجموعتهم.\n5) الختام والتقويم (4 دقائق: 36–40)\n   المعلم: يطرح أسئلة التقويم الختامي شفهيًا.\n   الطالب: يجيبون فرديًا ويحتفظون بالمخطط لاستكماله في الحصة القادمة.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n1) التهيئة: أفضل تنبؤ (5 دقائق: 0–5)\n   المعلم: يرفع بطاقة عضو ويطلب تنبؤًا بوظيفته، ويدوّن التنبؤات جانبًا.\n   الطالب: يتنبؤون بوظائف الأعضاء ويبرّرون.\n2) نشاط 1-1 (الجزء الثاني): إكمال المخطط (10 دقائق: 5–15)\n   المعلم: يتابع المجموعات أثناء قصّ الأعضاء ولصقها مستعينين بالصورة ص 18.\n   الطالب: يلصقون الأعضاء في مواضعها ويكتبون بجانب كل عضو وظيفته.\n3) وظائف الأعضاء (8 دقائق: 15–23)\n   المعلم: يناقش وظيفة كل عضو: الدماغ تحكّم وتفكير، القلب ضخ الدم، الرئتان تنفس، الكليتان إخراج، المعدة والأمعاء هضم، الكبد تخزين الطاقة والتخلص من المواد السامة.\n   الطالب: يقارنون تنبؤاتهم بالوظائف الصحيحة ويصحّحون.\n4) أسئلة النشاط 1-1 وتمرين 1-1 (7 دقائق: 23–30)\n   المعلم: يوجّه حل أسئلة النشاط ص 19 وتمرين 1-1 في كتاب النشاط ص 16 (لدعم المتعثرين).\n   الطالب: يجيبون فرديًا ثم يتحققون مع زميل.\n5) تحدّث عن: الحماية (5 دقائق: 30–35)\n   المعلم: يسأل: كيف تتم حماية أعضاء الجسم؟ ويذكّر بدراسة الصف الرابع.\n   الطالب: يذكرون أن الجمجمة تحمي الدماغ والضلوع تحمي القلب والرئتين.\n6) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n1. [مستوى المعرفة] أشر إلى موقع القلب والرئتين في الصورة، وسمِّ كلًّا منهما.\n   الإجابة النموذجية: القلب في الصدر بين الرئتين مائلًا لليسار، والرئتان في الصدر على جانبيه.\n2. [مستوى التطبيق] ما العضو الموجود في الرأس؟ وما الأعضاء الموجودة في البطن؟\n   الإجابة النموذجية: الرأس: الدماغ. البطن: المعدة والأمعاء والكبد والكليتان (في الجزء الخلفي).\n3. [مستوى الاستدلال] لماذا نقول إن أعضاء الجسم «تعمل معًا»؟\n   الإجابة النموذجية: لأن كل عضو يؤدي جزءًا من عمل أكبر، وتتعاون الأعضاء لتكوّن أجهزة تؤدي وظائف الحياة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n1. [مستوى المعرفة] صِل العضو بوظيفته: القلب – الرئتان – الكليتان.\n   الإجابة النموذجية: القلب: ضخ الدم. الرئتان: التنفس. الكليتان: الإخراج (التخلص من الفضلات).\n2. [مستوى التطبيق] ما وظيفة الكبد كما وردت في كتاب الطالب؟\n   الإجابة النموذجية: تخزين الطاقة وتخليص الجسم من المواد السامة.\n3. [مستوى الاستدلال] لماذا يحتاج الدماغ إلى حماية قوية أكثر من غيره؟\n   الإجابة النموذجية: لأنه يتحكم في جميع وظائف الجسم، وإصابته قد تعطّل عمل الجسم كله، فتحميه الجمجمة الصلبة.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\n1. [مستوى المعرفة] اذكر ثلاثة من أعضاء الجسم الرئيسية.\n   الإجابة النموذجية: مثل: الدماغ، القلب، الرئتان (أو الكليتان، المعدة، الأمعاء، الكبد).\n2. [مستوى التطبيق] صنّف الأعضاء الآتية حسب موقعها (رأس/صدر/بطن): القلب، المعدة، الدماغ، الأمعاء.\n   الإجابة النموذجية: رأس: الدماغ. صدر: القلب. بطن: المعدة والأمعاء.\n3. [مستوى الاستدلال] أيّ الأعضاء الرئيسية يوجد في الجسم على هيئة زوج؟ وما الفائدة المحتملة من ذلك؟\n   الإجابة النموذجية: الرئتان والكليتان؛ وجود عضوين يزيد كفاءة العمل ويمكن للجسم أن يعمل بعضو واحد سليم عند الضرورة.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\n1. [مستوى المعرفة] ما العضو المسؤول عن الهضم؟\n   الإجابة النموذجية: المعدة والأمعاء.\n2. [مستوى التطبيق] كيف تحمي الضلوع أعضاء الصدر؟\n   الإجابة النموذجية: تشكّل قفصًا عظميًا يحيط بالقلب والرئتين فيحميهما من الصدمات.\n3. [مستوى الاستدلال] لو تعطلت الكليتان، ما المشكلة التي ستواجه الجسم؟\n   الإجابة النموذجية: تتراكم الفضلات والماء الزائد في الدم فيتضرر الجسم.", "الحصة 1: أعضاء الجسم الرئيسية: أسماؤها ومواقعها\nللطالب: قراءة كتاب الطالب ص 18 وحفظ أسماء الأعضاء ومواقعها، وإحضار المخطط غير المكتمل. لولي الأمر: يُرجى مساعدة الابن على الإشارة إلى مواقع الأعضاء على جسمه وتسميتها.\n\nالحصة 2: وظائف الأعضاء الرئيسية وحمايتها\nللطالب: حل ورقة العمل 1-1 (كتاب النشاط ص 49) وتمرين 1-1 (ص 16) واجبًا منزليًا، ومراجعة ص 19. لولي الأمر: يُرجى متابعة حل الواجب ومناقشة الابن في وظيفة كل عضو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=1"]}, {"id": "1-2", "title": "القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 17، 50–52 | دليل المعلم ص 26–28", "n": 2, "per": [{"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20 | دليل المعلم ص 26–28", "num": "الحصة الأولى من 3", "focus": "القلب: موقعه وحجمه وعمله كمضخة"}, "f": ["1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد.\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم.\n3. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية.\n4. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم.\n\nمخرج تعليمي آخر:\nيمثّل عمل القلب باستخدام نموذج مضخة بسيط.\nيفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم.", "1. يحدّد موقع القلب في الصدر ويقدّر حجمه بقبضة اليد. ← تذكر\n2. يصف القلب بأنه عضلة تنقبض لتضخ الدم إلى جميع أجزاء الجسم. ← فهم\n3. يسمّي مكونات الجهاز الدوري: القلب، الدم، الأوعية الدموية. ← تذكر\n4. يتتبع مسار الدم من القلب إلى الرئتين ثم إلى بقية الجسم. ← فهم\nالمخرج الآخر: يمثّل عمل القلب باستخدام نموذج مضخة بسيط. ← تطبيق\nالمخرج الآخر: يفسّر سبب ضخ الدم إلى الرئتين قبل ذهابه إلى بقية الجسم. ← تحليل", "- التعلم بالاكتشاف\n- التعلم بالنمذجة\n- فكّر – زاوج – شارك\n- لعب الأدوار والمحاكاة\n- التعلم المبني على اللعب\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: أنبوب كرتوني (بكرة مناديل) وعبوة بلاستيكية مرنة مملوءة بالماء\n- صورة توضيحية\n- أخرى: كرات حمراء وزرقاء وأوعية فارغة وطباشير لرسم مخطط الدورة على الأرض", "- القلب\n- عضلة القلب\n- الانقباض والانبساط\n- دقات القلب\n- الدم\n- الجهاز الدوري\n- الدورة الدموية\n- الأوعية الدموية\n- الأكسجين\n- ثاني أكسيد الكربون", "يطلب المعلم من الطلبة رسم القلب كما يتخيلونه، ثم يسأل: هل يشبه قلوب بطاقات المعايدة؟ وما الذي يفعله القلب حقًا؟", "1) التهيئة: ارسم قلبك (1 دقيقة: 0–1)\n   المعلم: يطلب رسمًا سريعًا للقلب ويعرض بعض الرسوم ويطرح السؤال المحفّز.\n   الطالب: يرسمون ويعبّرون عن تصوّراتهم.\n2) الاستماع إلى القلب (2 دقيقتان: 1–3)\n   المعلم: ينظّم الطلبة ثنائيات لاستخدام أنبوب الكرتون للاستماع إلى صدر الزميل.\n   الطالب: يستمعون ويصفون الصوت ويتوقعون مصدره.\n3) عرض بنية القلب (3 دقائق: 3–6)\n   المعلم: يعرض مقطعًا مرئيًا/صورة للقلب ص 20، ويوضح موقعه في الصدر يسارًا وحمايته بالضلوع وحجمه بحجم القبضة.\n   الطالب: يضمّون قبضاتهم لتقدير الحجم ويحددون الموقع على أجسامهم.\n4) نموذج المضخة (3 دقائق: 6–9)\n   المعلم: يضغط عبوة بلاستيكية مملوءة بالماء ذات فوهة ضيقة ليحاكي انقباض القلب.\n   الطالب: يلاحظون اندفاع الماء ويربطونه بضخ الدم عند انقباض عضلة القلب.\n5) التلخيص والتقويم (2 دقيقتان: 9–11)\n   المعلم: يقود تلخيص «القلب عضلة تضخ الدم» ويطرح التقويم الختامي.\n   الطالب: يكتبون ملخصًا من جملتين ويجيبون عن الأسئلة.\n(مجموع الزمن: 10 دقائق)\n7) جانبا القلب والأوعية (3 دقائق: 21–24)\n   المعلم: يشرح بالصورة ص 20–21: الجانب الأيسر يضخ الدم المحمّل بالأكسجين للجسم، والأيمن يضخ الدم إلى الرئتين؛ والدم يحمل الغذاء والأكسجين والفضلات.\n   الطالب: يلوّنون مخططًا بسيطًا: الأحمر للدم المؤكسج والأزرق لغير المؤكسج.\n8) محاكاة الدورة الدموية (3 دقائق: 24–27)\n   المعلم: يرسم دائرتين على الأرض (الرئتان – القلب – بقية الجسم) ويوزّع الأدوار.\n   الطالب: يحملون الكرات الحمراء (أكسجين) من الرئتين إلى الجسم والزرقاء (ثاني أكسيد الكربون) من الجسم إلى الرئتين مرورًا بالقلب.\n9) أسئلة الكتاب وتمرين 1-2 (2 دقيقتان: 27–29)\n   المعلم: يناقش الأسئلة 1–3 ص 21 ويوجّه تمرين 1-2 في كتاب النشاط ص 17.\n   الطالب: يجيبون كتابيًا ويتبادلون التصحيح.\n10) الختام: مسابقة المجموعات (1 دقيقة: 29–30)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 10 دقائق)", "1. [مستوى المعرفة] أين يقع القلب؟ وما الذي يحميه؟\n   الإجابة النموذجية: في الصدر مائلًا إلى اليسار، وتحميه الضلوع.\n2. [مستوى التطبيق] ما الذي يمثّله الضغط على العبوة في النموذج؟\n   الإجابة النموذجية: انقباض عضلة القلب الذي يدفع الدم بقوة.\n3. [مستوى الاستدلال] لماذا يُعدّ القلب عضلة «فريدة»؟\n   الإجابة النموذجية: لأنه ينقبض وينبسط من تلقاء نفسه باستمرار طوال حياة الإنسان دون توقف.\n\n4. [مستوى المعرفة] ما مكونات الجهاز الدوري؟\n   الإجابة النموذجية: القلب والدم والأوعية الدموية.\n5. [مستوى التطبيق] ماذا يحمل الدم إلى أجزاء الجسم؟ وماذا يحمل منها؟\n   الإجابة النموذجية: يحمل الغذاء والأكسجين إليها، ويحمل الفضلات (مثل ثاني أكسيد الكربون) منها.\n6. [مستوى الاستدلال] لماذا يضخ القلب الدم إلى الرئتين قبل ضخه إلى أنحاء الجسم؟\n   الإجابة النموذجية: ليأخذ الدم الأكسجين من الرئتين ويتخلص من ثاني أكسيد الكربون، ثم يُضخ محمّلًا بالأكسجين إلى الجسم.", "1. [مستوى المعرفة] ما وظيفة القلب؟\n   الإجابة النموذجية: ضخ الدم إلى جميع أجزاء الجسم.\n2. [مستوى التطبيق] ما سبب الصوت الذي سمعته عبر الأنبوب؟\n   الإجابة النموذجية: دقات القلب الناتجة عن انقباض عضلته أثناء ضخ الدم.\n3. [مستوى الاستدلال] اقترح طريقة أخرى لتمثيل عمل القلب بأدوات بسيطة.\n   الإجابة النموذجية: مثل الضغط على بالون مملوء بالماء متصل بأنبوب، أو كرة مطاطية تضخ الماء.\n\n4. [مستوى المعرفة] أي جانبي القلب يضخ الدم المحمّل بالأكسجين إلى الجسم؟\n   الإجابة النموذجية: الجانب الأيسر.\n5. [مستوى التطبيق] رتّب مسار الدم: بقية الجسم – الرئتان – القلب (مرتين).\n   الإجابة النموذجية: بقية الجسم ← القلب ← الرئتان ← القلب ← بقية الجسم.\n6. [مستوى الاستدلال] لو انسدّ وعاء دموي يغذي عضلة القلب، ماذا تتوقع أن يحدث؟\n   الإجابة النموذجية: لا تصل الأكسجين والغذاء إلى عضلة القلب فتتضرر وقد تحدث نوبة قلبية.", "للطالب: قراءة كتاب الطالب ص 20، والاستماع لدقات القلب في المنزل بأنبوب كرتوني. لولي الأمر: يُرجى مشاركة الابن في التجربة ومناقشته في أهمية القلب.\nللطالب: حل تمرين 1-2 في كتاب النشاط ص 17 واجبًا منزليًا ومراجعة ص 20–21. لولي الأمر: يُرجى مناقشة الابن في أهمية الرياضة والغذاء الصحي لسلامة القلب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=2"]}, {"h": {"lesson": "1-2 القلب", "unit": "الوحدة الأولى: جسم الإنسان", "week": "الأسبوع الأول (6–10/9/2026)", "pages": "كتاب الطالب ص 20–21 | كتاب النشاط ص 50–52 | دليل المعلم ص 27–28", "num": "الحصة الثالثة من 3", "focus": "كيف عرف العلماء عمل القلب؟ ابن النفيس وويليام هارفي"}, "f": ["1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى.\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة.\n\nمخرج تعليمي آخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج.", "1. يصف إسهام العالم ابن النفيس في اكتشاف الدورة الدموية الصغرى. ← فهم\n2. يوضح كيف جمع ويليام هارفي الأدلة بالملاحظة والقياس والتجربة. ← تحليل\nالمخرج الآخر: يقيّم أهمية تكرار التجارب للتأكد من صحة النتائج. ← تقييم", "- التعلم التشاركي\n- التعلم الذاتي\n- التعلم التعاوني\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: ورقتا العمل 1-2أ و1-2ب في كتاب النشاط", "- الدورة الدموية الصغرى\n- الدليل العلمي\n- الملاحظة\n- التجربة\n- الأوعية الدموية", "يعرض المعلم معتقدًا قديمًا: «الكبد يصنع دمًا جديدًا كل مرة، والجسم يستهلك الدم»، ويسأل: كيف يمكن أن نتأكد أن هذه الفكرة خاطئة؟", "1) التهيئة: فكرة قديمة (3 دقائق: 0–3)\n   المعلم: يعرض المعتقد القديم ويستمع لاقتراحات التحقق.\n   الطالب: يقترحون طرقًا لجمع الأدلة.\n2) ورقة العمل 1-2أ: ابن النفيس (6 دقائق: 3–9)\n   المعلم: يوزّع المجموعات لقراءة ورقة العمل 1-2أ (كتاب النشاط ص 50) ويطرح أسئلة موجّهة.\n   الطالب: يقرؤون ويجيبون: ماذا كان يُعتقد؟ وما الذي اكتشفه ابن النفيس عن الرئتين؟\n3) ورقة العمل 1-2ب: ويليام هارفي (6 دقائق: 9–15)\n   المعلم: يوجّه قراءة ورقة العمل 1-2ب (ص 51–52) ويبرز: ملاحظة مضخات الماء، والتجارب المتكررة، وحساب كمية الدم.\n   الطالب: يجيبون عن أسئلة الورقة ويحددون الأدلة التي استخدمها هارفي.\n4) مقارنة ومناقشة (3 دقائق: 15–18)\n   المعلم: يقود مقارنة بين الإسهامين في جدول على السبورة، ويطرح سؤال التحدي عن النوبة القلبية.\n   الطالب: يكملون الجدول ويعرضون إجاباتهم.\n5) الختام: مسابقة المجموعات (2 دقيقتان: 18–20)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 1-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 20 دقيقة)", "1. [مستوى المعرفة] ماذا كان يُعتقد قديمًا عن مصدر الدم؟\n   الإجابة النموذجية: أن الدم يتولّد في الكبد ثم ينتقل إلى القلب فيسري في الأوعية إلى الأعضاء.\n2. [مستوى التطبيق] ما الذي يحدث للدم في الرئتين بحسب اكتشاف ابن النفيس؟\n   الإجابة النموذجية
