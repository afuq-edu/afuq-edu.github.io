", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. يعرّف الموطن الطبيعي بأنه المكان الذي تعيش فيه الكائنات الحية معًا. ← تذكر\n2. يمثّل العلاقة الغذائية بين كائنين بسلسلة غذائية باستخدام السهم. ← فهم\nالمخرج الآخر: يوضح كيف تساعد بعض الحيوانات في مكافحة الآفات. ← فهم\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. يجري ملاحظات متنوعة للنباتات والحيوانات في موطن طبيعي محلي. ← تطبيق\n2. يرسم ثلاث سلاسل غذائية تمثل العلاقات الغذائية التي لاحظها. ← تطبيق\nالمخرج الآخر: يشرح طرقًا أخرى تعتمد فيها النباتات والحيوانات على بعضها (المأوى، التلقيح). ← تحليل", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- التعلم بالنمذجة\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- الاستقصاء العلمي\n- التعلم المبني على المشاريع", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- السبورة التقليدية\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- الكتاب\n- الأقلام\n- أخرى: حديقة المدرسة، عدسات مكبرة، دفتر ملاحظات", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n- الموطن الطبيعي\n- العلاقة الغذائية\n- السلسلة الغذائية\n- الآفات\n- السهم «تتغذى عليه»\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n- الملاحظة\n- الموطن الطبيعي\n- السلسلة الغذائية\n- الاعتماد المتبادل", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nيذكّر المعلم بما درسه الطلبة في الصف الرابع عن المواطن الطبيعية، ويسأل: أين يعيش الضب؟ وأين تعيش السمكة؟ وماذا يأكل كل منهما؟\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nيذكّر المعلم بقواعد السلامة والرفق بالكائنات، ويوزع المهام: مسجّل، باحث تحت الأوراق، مراقب للطيور، رسّام.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1) التهيئة: أين تعيش؟ (5 دقائق: 0–5)\n   المعلم: يطرح أسئلة عن مواطن مألوفة في عُمان.\n   الطالب: يذكرون حيوانات ومواطنها وغذاءها.\n2) مزرعة محمد في صحار (10 دقائق: 5–15)\n   المعلم: يعرض صورة المزرعة ص 34 ويناقش: النباتات (ذرة، سبانخ، يقطين) والحيوانات والآفات (اليرقات، ثاقبة الذرة).\n   الطالب: يحددون الكائنات والعلاقات الغذائية بينها.\n3) كتابة السلسلة الغذائية (10 دقائق: 15–25)\n   المعلم: يشرح معنى السهم «يتغذى عليه» بمثال: السبانخ ← اليرقة، ويصحح اتجاه السهم.\n   الطالب: يكتبون سلسلتين من المزرعة على السبورة الصغيرة ويصفون كل واحدة.\n4) تحدّث: الآفات ومكافحتها (9 دقائق: 25–34)\n   المعلم: يناقش كيف تأكل الطيور اليرقات والسحالي ثاقبة الذرة فتحمي المحصول.\n   الطالب: يكملون سلسلة من ثلاث حلقات: ذرة ← ثاقبة الذرة ← سحلية.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي ويحدد موطنًا محليًا لنشاط الحصة القادمة.\n   الطالب: يجيبون ويختارون موطنًا قرب المدرسة أو المنزل.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1) التهيئة والسلامة (5 دقائق: 0–5)\n   المعلم: يشرح خطوات نشاط 2-1 ص 35 والأدوار وقواعد السلامة والبقاء ضمن الحدود.\n   الطالب: يستلمون أدوارهم وأدواتهم.\n2) نشاط 2-1 في حديقة المدرسة (15 دقائق: 5–20)\n   المعلم: يرافق المجموعات ويوجه الملاحظة تحت الأوراق والشجيرات وفي الأشجار.\n   الطالب: يسجلون قائمة النباتات والحيوانات (حشرات، طيور) والعلاقات الغذائية الملاحظة.\n3) رسم السلاسل (10 دقائق: 20–30)\n   المعلم: يعود بالطلبة إلى الصف ويوجه حل الأسئلة 1–4 ص 35.\n   الطالب: يرسمون ثلاث سلاسل غذائية من ملاحظاتهم وسلسلتين من مزرعة محمد.\n4) مشاركة واعتماد متبادل (5 دقائق: 30–35)\n   المعلم: يناقش السؤال 3: الشجرة مأوى للطيور، الأزهار توفر حبوب اللقاح للنحل.\n   الطالب: يعرضون سلاسلهم ويقترحون أمثلة على الاعتماد المتبادل.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-1).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. [مستوى المعرفة] ما المقصود بالموطن الطبيعي؟\n   الإجابة النموذجية: المكان الذي تعيش فيه الكائنات الحية في البيئة.\n2. [مستوى التطبيق] ماذا يعني السهم في السلسلة الغذائية: سبانخ ← يرقة؟\n   الإجابة النموذجية: أن اليرقة تتغذى على السبانخ.\n3. [مستوى الاستدلال] لماذا يفرح المزارع بوجود السحالي في مزرعته؟\n   الإجابة النموذجية: لأنها تأكل الحشرة ثاقبة الذرة فتقلل الضرر على المحصول.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. [مستوى المعرفة] سمِّ ثلاثة نباتات وثلاثة حيوانات لاحظتها.\n   الإجابة النموذجية: تعتمد على الموطن، مثل: عشب، شجرة نيم، مانجو؛ نملة، عصفور، فراشة.\n2. [مستوى التطبيق] ارسم سلسلة غذائية من ملاحظاتك.\n   الإجابة النموذجية: مثل: عشب ← جرادة ← طائر (أي سلسلة صحيحة تبدأ بنبات).\n3. [مستوى الاستدلال] كيف توفر شجرة المانجو أكثر من الغذاء للحيوانات؟\n   الإجابة النموذجية: توفر مكانًا للطيور لبناء أعشاشها وظلًا ومأوى للحشرات.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\n1. [مستوى المعرفة] اكتب سلسلة غذائية من مزرعة محمد.\n   الإجابة النموذجية: مثل: ورقة سبانخ ← يرقة ← طائر، أو ذرة ← حشرة ثاقبة الذرة ← سحلية.\n2. [مستوى التطبيق] ما الآفة؟ أعط مثالًا.\n   الإجابة النموذجية: كائن يضر بالمزروعات، مثل اليرقات أو الحشرة ثاقبة الذرة.\n3. [مستوى الاستدلال] ماذا يحدث لمحصول الذرة لو اختفت السحالي من المزرعة؟ ولماذا؟\n   الإجابة النموذجية: قد يتضرر أكثر لأن أعداد ثاقبة الذرة ستزداد دون من يأكلها.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\n1. [مستوى المعرفة] أين بحثت عن الحشرات؟ ولماذا هناك؟\n   الإجابة النموذجية: تحت الأوراق الميتة والشجيرات؛ لأنها أماكن رطبة ومظللة توفر الغذاء والمأوى.\n2. [مستوى التطبيق] بماذا تبدأ السلاسل الغذائية التي رسمتها؟\n   الإجابة النموذجية: بنبات.\n3. [مستوى الاستدلال] كيف تعتمد الأزهار على النحل؟\n   الإجابة النموذجية: ينقل النحل حبوب اللقاح بين الأزهار فيساعد على تكوين البذور.", "الحصة 1: الموطن الطبيعي والعلاقات الغذائية (مزرعة محمد)\nللطالب: قراءة كتاب الطالب ص 34، وملاحظة النباتات والحيوانات في حديقة المنزل أو الحي. لولي الأمر: يُرجى مرافقة الابن عند زيارة حديقة أو مزرعة لملاحظة الكائنات الحية.\n\nالحصة 2: استكشاف موطن طبيعي محلي ورسم سلاسله الغذائية (نشاط 2-1)\nللطالب: حل تمرين 2-1 في كتاب النشاط ص 24 واجبًا منزليًا، وإكمال رسم السلاسل في الدفتر. لولي الأمر: يُرجى متابعة الواجب وتشجيع الابن على الرفق بالكائنات الحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=9"]}, {"id": "2-2", "title": "السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 36–37 | كتاب النشاط ص 25–26 | دليل المعلم ص 49–51", "n": 3, "per": [{"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 36 | دليل المعلم ص 49–50", "num": "الحصة الأولى من 3", "focus": "النباتات كائنات منتجة والحيوانات كائنات مستهلكة"}, "f": ["1. يعرّف الكائن المنتج والكائن المستهلك.\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات.\nمخرج تعليمي آخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة.", "1. يعرّف الكائن المنتج والكائن المستهلك. ← تذكر\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات. ← فهم\nالمخرج الآخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة. ← تطبيق", "- العصف الذهني\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- صورة توضيحية", "- الكائن المنتج\n- الكائن المستهلك\n- الطاقة\n- السلسلة الغذائية", "يسأل المعلم: ماذا أكلت خلال الـ24 ساعة الماضية؟ ويكتب قائمة على السبورة، ثم يسأل: أيها من النباتات أو مصدره نبات؟", "1) التهيئة: قائمة الطعام (5 دقائق: 0–5)\n   المعلم: يكتب أطعمة الطلبة ويصنفها معهم.\n   الطالب: يحددون مصدر كل طعام.\n2) تتبع الطعام إلى النبات (10 دقائق: 5–15)\n   المعلم: يسأل عن الأطعمة الحيوانية: الدجاجة ماذا تأكل؟ الخروف ماذا يأكل؟ ويقود إلى أن كل غذاء يعود إلى النبات.\n   الطالب: يكملون سلاسل: ذرة ← دجاجة ← إنسان.\n3) المنتج والمستهلك (10 دقائق: 15–25)\n   المعلم: يقدم المفهومين من ص 36 ويطرح: ماذا لو لم توجد النباتات؟\n   الطالب: يحددون المنتج والمستهلك في السلسلتين ص 36.\n4) السؤال 1 ص 36 (9 دقائق: 25–34)\n   المعلم: يوجه ترتيب: سبانخ – طائر – يرقة؛ إنسان – عشب – خروف.\n   الطالب: يرتبون ويرسمون الأسهم.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي ويصحح المفهوم الخاطئ: النباتات لا تعتمد على الإنسان.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] لماذا تسمى النباتات كائنات منتجة؟\n   الإجابة النموذجية: لأنها تصنع غذاءها بنفسها.\n2. [مستوى التطبيق] في السلسلة: بذور الذرة ← دجاجة ← إنسان، حدد المنتج والمستهلكات.\n   الإجابة النموذجية: المنتج: بذور الذرة. المستهلكات: الدجاجة والإنسان.\n3. [مستوى الاستدلال] ماذا يحدث للحيوانات لو اختفت كل النباتات؟ ولماذا؟\n   الإجابة النموذجية: تموت في النهاية؛ لأن آكلات النباتات لن تجد غذاء، ثم الحيوانات التي تأكلها.", "1. [مستوى المعرفة] رتب: إنسان – عشب – خروف.\n   الإجابة النموذجية: عشب ← خروف ← إنسان.\n2. [مستوى التطبيق] بماذا تبدأ كل سلسلة غذائية؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n3. [مستوى الاستدلال] هل يعتمد الإنسان على النبات أم النبات على الإنسان؟ وضح.\n   الإجابة النموذجية: الإنسان يعتمد على النبات في غذائه، أما النبات فيصنع غذاءه بنفسه.", "للطالب: قراءة كتاب الطالب ص 36 وكتابة سلسلتين غذائيتين من طعام العائلة. لولي الأمر: يُرجى مناقشة الابن في مصادر طعام وجبة العشاء.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 37 | دليل المعلم ص 50–51", "num": "الحصة الثانية من 3", "focus": "كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات"}, "f": ["1. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون.\n2. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس.\nمخرج تعليمي آخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية.", "1. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون. ← تذكر\n2. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس. ← تطبيق\nالمخرج الآخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: أصص زرع، شتلات فاصوليا مُعدة مسبقًا، ملصقات", "- صنع الغذاء\n- ضوء الشمس\n- ثاني أكسيد الكربون\n- الأكسجين\n- العامل المؤثر", "يعرض المعلم نبتتين: إحداهما ذابلة صفراء والأخرى خضراء نضرة، ويسأل: ماذا تتوقع أن تكون الذابلة قد افتقدت؟", "1) التهيئة: نبتتان (5 دقائق: 0–5)\n   المعلم: يعرض النبتتين ويجمع التوقعات.\n   الطالب: يقترحون: الماء، الضوء، التربة.\n2) كيف تصنع النباتات الغذاء؟ (10 دقائق: 5–15)\n   المعلم: يشرح ص 37: في الأوراق، بالطاقة من الشمس، من الماء وثاني أكسيد الكربون، ينتج سكر وأكسجين يُطلق في الهواء؛ وتمتص الجذور المغذيات.\n   الطالب: يرسمون مخططًا للورقة: مدخلات ومخرجات.\n3) التخطيط لنشاط 2-2 (13 دقائق: 15–28)\n   المعلم: يوجه المجموعات للتخطيط: زوج في الضوء وآخر في الظلام، وزوج يُروى وآخر لا يُروى، مع تثبيت باقي العوامل.\n   الطالب: يحددون العامل المتغير والثوابت ويكتبون التنبؤ ويلصقون الملصقات على الأصص.\n4) تحدّث: الأكسجين (7 دقائق: 28–35)\n   المعلم: يناقش: ما الغاز الذي نتنفسه؟ ومن يعيد إنتاجه؟\n   الطالب: يستنتجون التوازن بين النباتات والحيوانات في الأكسجين وثاني أكسيد الكربون.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويحدد مسؤولية متابعة الأصص.\n   الطالب: يجيبون ويتقاسمون مهام المتابعة.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] أين تصنع النباتات غذاءها؟\n   الإجابة النموذجية: في أوراقها.\n2. [مستوى التطبيق] ما الغاز الذي تأخذه النباتات من الهواء لصنع الغذاء؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n3. [مستوى الاستدلال] في استقصاء الضوء، ما العامل الذي سنغيّره وما العوامل التي نثبّتها؟\n   الإجابة النموذجية: نغير الضوء (ضوء/ظلام)، ونثبت كمية الماء ونوع النبات والتربة والأصيص.", "1. [مستوى المعرفة] ماذا ينتج النبات عند صنع غذائه؟\n   الإجابة النموذجية: السكر والأكسجين.\n2. [مستوى التطبيق] تنبأ: ماذا سيحدث للنبتة التي لا تُروى؟\n   الإجابة النموذجية: ستذبل وقد تموت لأنها لا تستطيع صنع الغذاء دون ماء.\n3. [مستوى الاستدلال] لماذا نستخدم نبتتين متشابهتين في كل استقصاء؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فيكون الفرق ناتجًا عن العامل المتغير وحده.", "للطالب: متابعة الأصص يوميًا وتسجيل الملاحظات (الطول ولون الأوراق) في جدول. لولي الأمر: يُرجى تشجيع الابن على زراعة بذرة في المنزل ومتابعة نموها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"h": {"lesson": "2-2 السلاسل الغذائية تبدأ بالنباتات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الخامس (4–8/10/2026)", "pages": "كتاب الطالب ص 37 | كتاب النشاط ص 25–26 | دليل المعلم ص 50–51", "num": "الحصة الثالثة من 3", "focus": "نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية"}, "f": ["1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته.\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء.\nمخرج تعليمي آخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة.", "1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته. ← تقييم\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء. ← تحليل\nالمخرج الآخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة. ← تطبيق", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلات الاستقصاء المعدّة مسبقًا (ضوء/ظلام، مروية/غير مروية)", "- النتائج\n- التفسير\n- الدليل\n- الكائن المنتج\n- الكائن المستهلك", "يضع المعلم أمام الطلبة أصص الاستقصاء التي أعدّها مسبقًا (منذ أسبوع)، ويطلب منهم وصف الفرق دون لمسها.", "1) التهيئة: ماذا تغيّر؟ (5 دقائق: 0–5)\n   المعلم: يعرض الأصص المعدّة مسبقًا ويطلب الوصف.\n   الطالب: يصفون لون الأوراق وطول الساق والذبول.\n2) تحليل النتائج (أسئلة نشاط 2-2) (12 دقائق: 5–17)\n   المعلم: يوجه الإجابة عن الأسئلة 1–3: العامل المؤثر، التنبؤ، الدليل.\n   الطالب: يقارنون: نبتة الظلام صفراء لا تنمو، والمحرومة من الماء ذابلة.\n3) التفسير العلمي (8 دقائق: 17–25)\n   المعلم: يربط النتائج بصنع الغذاء: دون ضوء أو ماء لا يصنع النبات غذاءه.\n   الطالب: يكتبون تفسيرًا لكل نتيجة.\n4) تمرين 2-2 في كتاب النشاط (10 دقائق: 25–35)\n   المعلم: يوجه حل تمرين 2-2 (ص 25–26): حاجات النبات وتحديد المنتج والمستهلكات وترتيب سلسلة.\n   الطالب: يحلون فرديًا ثم يصححون مع المعلم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما العامل المؤثر في الاستقصاء الأول؟ وفي الثاني؟\n   الإجابة النموذجية: الأول: الماء. الثاني: ضوء الشمس.\n2. [مستوى التطبيق] صف النبتة التي وُضعت في الظلام.\n   الإجابة النموذجية: لم تنمُ جيدًا وتحولت أوراقها إلى اللون الأصفر.\n3. [مستوى الاستدلال] هل تدعم النتائج تنبؤك؟ ووضح السبب علميًا.\n   الإجابة النموذجية: نعم؛ لأن النبات يحتاج إلى الضوء والماء لصنع غذائه، فلما حُرم أحدهما ضعف نموه.", "1. [مستوى المعرفة] رتب: أسد – شجرة – حمار وحشي.\n   الإجابة النموذجية: شجرة ← حمار وحشي ← أسد.\n2. [مستوى التطبيق] لماذا ذبلت النبتة غير المروية؟\n   الإجابة النموذجية: لأنها لم تحصل على الماء الذي تحتاجه لصنع الغذاء والبقاء.\n3. [مستوى الاستدلال] اقترح استقصاءً لمعرفة هل يحتاج النبات إلى الهواء.\n   الإجابة النموذجية: نضع نبتة في وعاء محكم دون هواء وأخرى في الهواء مع تثبيت الماء والضوء ونقارن النمو.", "للطالب: إكمال تمرين 2-2 (كتاب النشاط ص 25–26) ومراجعة ص 36–37. لولي الأمر: يُرجى مناقشة الابن في أهمية النباتات لحياة الإنسان والحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}], "comb": ["الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n1. يعرّف الكائن المنتج والكائن المستهلك.\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات.\nمخرج تعليمي آخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n1. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون.\n2. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس.\nمخرج تعليمي آخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته.\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء.\nمخرج تعليمي آخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n1. يعرّف الكائن المنتج والكائن المستهلك. ← تذكر\n2. يستنتج أن جميع السلاسل الغذائية تبدأ بنبات. ← فهم\nالمخرج الآخر: يرتب كائنات معطاة لتكوين سلسلة غذائية صحيحة. ← تطبيق\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n1. يذكر ما تحتاجه النباتات لصنع الغذاء: ضوء الشمس والماء وثاني أكسيد الكربون. ← تذكر\n2. يخطط لاستقصاءين لإثبات حاجة النبات إلى الماء وضوء الشمس. ← تطبيق\nالمخرج الآخر: يتنبأ بنتائج الاستقصاء بناءً على معرفته العلمية. ← تطبيق\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n1. يقارن نتائج النباتات في الاستقصاءين ويحدد ما إذا كانت تدعم تنبؤاته. ← تقييم\n2. يقترح تفسيرات للنتائج بالاعتماد على حاجات النبات لصنع الغذاء. ← تحليل\nالمخرج الآخر: يطبق مفهومي المنتج والمستهلك على سلاسل غذائية جديدة. ← تطبيق", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n- العصف الذهني\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- صورة توضيحية\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: أصص زرع، شتلات فاصوليا مُعدة مسبقًا، ملصقات\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلات الاستقصاء المعدّة مسبقًا (ضوء/ظلام، مروية/غير مروية)", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n- الكائن المنتج\n- الكائن المستهلك\n- الطاقة\n- السلسلة الغذائية\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n- صنع الغذاء\n- ضوء الشمس\n- ثاني أكسيد الكربون\n- الأكسجين\n- العامل المؤثر\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n- النتائج\n- التفسير\n- الدليل\n- الكائن المنتج\n- الكائن المستهلك", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nيسأل المعلم: ماذا أكلت خلال الـ24 ساعة الماضية؟ ويكتب قائمة على السبورة، ثم يسأل: أيها من النباتات أو مصدره نبات؟\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\nيعرض المعلم نبتتين: إحداهما ذابلة صفراء والأخرى خضراء نضرة، ويسأل: ماذا تتوقع أن تكون الذابلة قد افتقدت؟\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nيضع المعلم أمام الطلبة أصص الاستقصاء التي أعدّها مسبقًا (منذ أسبوع)، ويطلب منهم وصف الفرق دون لمسها.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n1) التهيئة: قائمة الطعام (5 دقائق: 0–5)\n   المعلم: يكتب أطعمة الطلبة ويصنفها معهم.\n   الطالب: يحددون مصدر كل طعام.\n2) تتبع الطعام إلى النبات (10 دقائق: 5–15)\n   المعلم: يسأل عن الأطعمة الحيوانية: الدجاجة ماذا تأكل؟ الخروف ماذا يأكل؟ ويقود إلى أن كل غذاء يعود إلى النبات.\n   الطالب: يكملون سلاسل: ذرة ← دجاجة ← إنسان.\n3) المنتج والمستهلك (10 دقائق: 15–25)\n   المعلم: يقدم المفهومين من ص 36 ويطرح: ماذا لو لم توجد النباتات؟\n   الطالب: يحددون المنتج والمستهلك في السلسلتين ص 36.\n4) السؤال 1 ص 36 (9 دقائق: 25–34)\n   المعلم: يوجه ترتيب: سبانخ – طائر – يرقة؛ إنسان – عشب – خروف.\n   الطالب: يرتبون ويرسمون الأسهم.\n5) الختام والتقويم (6 دقائق: 34–40)\n   المعلم: يطرح التقويم الختامي ويصحح المفهوم الخاطئ: النباتات لا تعتمد على الإنسان.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n1) التهيئة: نبتتان (5 دقائق: 0–5)\n   المعلم: يعرض النبتتين ويجمع التوقعات.\n   الطالب: يقترحون: الماء، الضوء، التربة.\n2) كيف تصنع النباتات الغذاء؟ (10 دقائق: 5–15)\n   المعلم: يشرح ص 37: في الأوراق، بالطاقة من الشمس، من الماء وثاني أكسيد الكربون، ينتج سكر وأكسجين يُطلق في الهواء؛ وتمتص الجذور المغذيات.\n   الطالب: يرسمون مخططًا للورقة: مدخلات ومخرجات.\n3) التخطيط لنشاط 2-2 (13 دقائق: 15–28)\n   المعلم: يوجه المجموعات للتخطيط: زوج في الضوء وآخر في الظلام، وزوج يُروى وآخر لا يُروى، مع تثبيت باقي العوامل.\n   الطالب: يحددون العامل المتغير والثوابت ويكتبون التنبؤ ويلصقون الملصقات على الأصص.\n4) تحدّث: الأكسجين (7 دقائق: 28–35)\n   المعلم: يناقش: ما الغاز الذي نتنفسه؟ ومن يعيد إنتاجه؟\n   الطالب: يستنتجون التوازن بين النباتات والحيوانات في الأكسجين وثاني أكسيد الكربون.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي ويحدد مسؤولية متابعة الأصص.\n   الطالب: يجيبون ويتقاسمون مهام المتابعة.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n1) التهيئة: ماذا تغيّر؟ (5 دقائق: 0–5)\n   المعلم: يعرض الأصص المعدّة مسبقًا ويطلب الوصف.\n   الطالب: يصفون لون الأوراق وطول الساق والذبول.\n2) تحليل النتائج (أسئلة نشاط 2-2) (12 دقائق: 5–17)\n   المعلم: يوجه الإجابة عن الأسئلة 1–3: العامل المؤثر، التنبؤ، الدليل.\n   الطالب: يقارنون: نبتة الظلام صفراء لا تنمو، والمحرومة من الماء ذابلة.\n3) التفسير العلمي (8 دقائق: 17–25)\n   المعلم: يربط النتائج بصنع الغذاء: دون ضوء أو ماء لا يصنع النبات غذاءه.\n   الطالب: يكتبون تفسيرًا لكل نتيجة.\n4) تمرين 2-2 في كتاب النشاط (10 دقائق: 25–35)\n   المعلم: يوجه حل تمرين 2-2 (ص 25–26): حاجات النبات وتحديد المنتج والمستهلكات وترتيب سلسلة.\n   الطالب: يحلون فرديًا ثم يصححون مع المعلم.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-2).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n1. [مستوى المعرفة] لماذا تسمى النباتات كائنات منتجة؟\n   الإجابة النموذجية: لأنها تصنع غذاءها بنفسها.\n2. [مستوى التطبيق] في السلسلة: بذور الذرة ← دجاجة ← إنسان، حدد المنتج والمستهلكات.\n   الإجابة النموذجية: المنتج: بذور الذرة. المستهلكات: الدجاجة والإنسان.\n3. [مستوى الاستدلال] ماذا يحدث للحيوانات لو اختفت كل النباتات؟ ولماذا؟\n   الإجابة النموذجية: تموت في النهاية؛ لأن آكلات النباتات لن تجد غذاء، ثم الحيوانات التي تأكلها.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n1. [مستوى المعرفة] أين تصنع النباتات غذاءها؟\n   الإجابة النموذجية: في أوراقها.\n2. [مستوى التطبيق] ما الغاز الذي تأخذه النباتات من الهواء لصنع الغذاء؟\n   الإجابة النموذجية: ثاني أكسيد الكربون.\n3. [مستوى الاستدلال] في استقصاء الضوء، ما العامل الذي سنغيّره وما العوامل التي نثبّتها؟\n   الإجابة النموذجية: نغير الضوء (ضوء/ظلام)، ونثبت كمية الماء ونوع النبات والتربة والأصيص.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n1. [مستوى المعرفة] ما العامل المؤثر في الاستقصاء الأول؟ وفي الثاني؟\n   الإجابة النموذجية: الأول: الماء. الثاني: ضوء الشمس.\n2. [مستوى التطبيق] صف النبتة التي وُضعت في الظلام.\n   الإجابة النموذجية: لم تنمُ جيدًا وتحولت أوراقها إلى اللون الأصفر.\n3. [مستوى الاستدلال] هل تدعم النتائج تنبؤك؟ ووضح السبب علميًا.\n   الإجابة النموذجية: نعم؛ لأن النبات يحتاج إلى الضوء والماء لصنع غذائه، فلما حُرم أحدهما ضعف نموه.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\n1. [مستوى المعرفة] رتب: إنسان – عشب – خروف.\n   الإجابة النموذجية: عشب ← خروف ← إنسان.\n2. [مستوى التطبيق] بماذا تبدأ كل سلسلة غذائية؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n3. [مستوى الاستدلال] هل يعتمد الإنسان على النبات أم النبات على الإنسان؟ وضح.\n   الإجابة النموذجية: الإنسان يعتمد على النبات في غذائه، أما النبات فيصنع غذاءه بنفسه.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\n1. [مستوى المعرفة] ماذا ينتج النبات عند صنع غذائه؟\n   الإجابة النموذجية: السكر والأكسجين.\n2. [مستوى التطبيق] تنبأ: ماذا سيحدث للنبتة التي لا تُروى؟\n   الإجابة النموذجية: ستذبل وقد تموت لأنها لا تستطيع صنع الغذاء دون ماء.\n3. [مستوى الاستدلال] لماذا نستخدم نبتتين متشابهتين في كل استقصاء؟\n   الإجابة النموذجية: ليكون الاختبار عادلًا فيكون الفرق ناتجًا عن العامل المتغير وحده.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\n1. [مستوى المعرفة] رتب: أسد – شجرة – حمار وحشي.\n   الإجابة النموذجية: شجرة ← حمار وحشي ← أسد.\n2. [مستوى التطبيق] لماذا ذبلت النبتة غير المروية؟\n   الإجابة النموذجية: لأنها لم تحصل على الماء الذي تحتاجه لصنع الغذاء والبقاء.\n3. [مستوى الاستدلال] اقترح استقصاءً لمعرفة هل يحتاج النبات إلى الهواء.\n   الإجابة النموذجية: نضع نبتة في وعاء محكم دون هواء وأخرى في الهواء مع تثبيت الماء والضوء ونقارن النمو.", "الحصة 1: النباتات كائنات منتجة والحيوانات كائنات مستهلكة\nللطالب: قراءة كتاب الطالب ص 36 وكتابة سلسلتين غذائيتين من طعام العائلة. لولي الأمر: يُرجى مناقشة الابن في مصادر طعام وجبة العشاء.\n\nالحصة 2: كيف تصنع النباتات الغذاء؟ والتخطيط لاستقصاء حاجات النبات\nللطالب: متابعة الأصص يوميًا وتسجيل الملاحظات (الطول ولون الأوراق) في جدول. لولي الأمر: يُرجى تشجيع الابن على زراعة بذرة في المنزل ومتابعة نموها.\n\nالحصة 3: نتائج استقصاء حاجات النبات وتطبيقات السلاسل الغذائية\nللطالب: إكمال تمرين 2-2 (كتاب النشاط ص 25–26) ومراجعة ص 36–37. لولي الأمر: يُرجى مناقشة الابن في أهمية النباتات لحياة الإنسان والحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=10"]}, {"id": "2-3", "title": "الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38–39 | كتاب النشاط ص 27–28، 63 | دليل المعلم ص 51–54", "n": 5, "per": [{"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38 | دليل المعلم ص 51–53", "num": "الحصة الأولى من 5", "focus": "المفترس والفريسة"}, "f": ["1. يعرّف المفترس والفريسة.\n2. يميّز المفترس من الفريسة في أمثلة مصورة.\nمخرج تعليمي آخر: يصف بعض طرق المفترسات في اصطياد فرائسها.", "1. يعرّف المفترس والفريسة. ← تذكر\n2. يميّز المفترس من الفريسة في أمثلة مصورة. ← فهم\nالمخرج الآخر: يصف بعض طرق المفترسات في اصطياد فرائسها. ← فهم", "- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- المفترس\n- الفريسة\n- الكائن المستهلك\n- الحيوانات آكلة النباتات", "يعرض المعلم صور حيوانات مختلطة، ويسأل: أي هذه الحيوانات يأكل حيوانًا آخر؟ وأيها يُؤكل؟", "1) التهيئة: من يأكل من؟ (5 دقائق: 0–5)\n   المعلم: يعرض الصور ويطرح السؤال.\n   الطالب: يصنفون الحيوانات إلى «يأكل» و«يُؤكل».\n2) المصطلحات والأمثلة (10 دقائق: 5–15)\n   المعلم: يقدم المفترس والفريسة بأمثلة ص 38: البومة والفأر، الثعبان، الضفدع والحشرات.\n   الطالب: يكتبون التعريفين ويضيفون أمثلة.\n3) لعبة «مفترس أو فريسة؟» (12 دقائق: 15–27)\n   المعلم: يعرض بطاقات حيوانات تباعًا، ومنها ما يكون مفترسًا وفريسة معًا (السحلية).\n   الطالب: يرفعون بطاقة (مفترس/فريسة/كلاهما) ويبررون.\n4) طرق الافتراس (8 دقائق: 27–35)\n   المعلم: يناقش: السم لدى بعض الثعابين، الابتلاع، الصيد ليلًا للبومة.\n   الطالب: يرسمون حيوانًا مفترسًا ويكتبون طريقة صيده.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المقصود بالمفترس؟\n   الإجابة النموذجية: حيوان مستهلك يصطاد الحيوانات الأخرى ويتغذى عليها.\n2. [مستوى التطبيق] في الزوج (البومة، الفأر)، من الفريسة؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] لماذا يمكن أن تكون السحلية مفترسًا وفريسة في الوقت نفسه؟\n   الإجابة النموذجية: لأنها تأكل الجراد فتكون مفترسًا، ويأكلها الصقر فتكون فريسة.", "1. [مستوى المعرفة] ما الفريسة؟\n   الإجابة النموذجية: الحيوان الذي تصطاده الحيوانات المفترسة وتتغذى عليه.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من بيئتك.\n   الإجابة النموذجية: مثل: القط والفأر، أو الطائر والجرادة (تقبل الأمثلة الصحيحة).\n3. [مستوى الاستدلال] هل كل المستهلكات مفترسات؟ وضح بمثال.\n   الإجابة النموذجية: لا؛ فبعضها يتغذى على النباتات فقط مثل الخروف والجمل.", "للطالب: قراءة كتاب الطالب ص 38 وكتابة ثلاثة أزواج (مفترس – فريسة). لولي الأمر: يُرجى مشاهدة مقطع وثائقي قصير عن الحياة البرية مع الابن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 38–39 | دليل المعلم ص 52–53", "num": "الحصة الثانية من 5", "focus": "سلاسل غذائية بها أكثر من مفترس"}, "f": ["1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته.\n2. يحدد النمط المشترك في السلاسل الغذائية.\nمخرج تعليمي آخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس.", "1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته. ← تطبيق\n2. يحدد النمط المشترك في السلاسل الغذائية. ← تحليل\nالمخرج الآخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس. ← تحليل", "- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: بطاقات كائنات حية وخيوط لبناء سلاسل معلّقة", "- سلسلة غذائية\n- المفترس الأعلى\n- النمط\n- الكائن المنتج", "يكتب المعلم على السبورة: «نباتات ← جراد ← سحلية ← صقر» ويسأل: كم مفترسًا في هذه السلسلة؟", "1) التهيئة: عدّ المفترسات (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويناقش الإجابات.\n   الطالب: يحددون السحلية والصقر مفترسين.\n2) السؤال 1 ص 39 (10 دقائق: 5–15)\n   المعلم: يوجه الربط بين المفترسات الخمسة وفرائسها في الشكل.\n   الطالب: يصلون بين كل مفترس وفريسته.\n3) سلاسل معلّقة (12 دقائق: 15–27)\n   المعلم: يوزع بطاقات كائنات على المجموعات لبناء سلاسل معلّقة بالخيوط تبدأ بالمنتج.\n   الطالب: يبنون سلسلتين ويحددون المنتج والفريسة والمفترس.\n4) السؤالان 3 و4: النمط (8 دقائق: 27–35)\n   المعلم: يقود المقارنة بين سلاسل المجموعات.\n   الطالب: يستنتجون النمط: منتج ← فريسة (آكل نبات) ← مفترس.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] بماذا يجب أن تبدأ أي سلسلة غذائية ترسمها؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n2. [مستوى التطبيق] في السلسلة: عشب ← جرادة ← سحلية ← صقر، ما الفريسة الأولى؟\n   الإجابة النموذجية: الجرادة.\n3. [مستوى الاستدلال] ما النمط الذي تسلكه جميع السلاسل التي رسمتموها؟\n   الإجابة النموذجية: تبدأ بمنتج يتغذى عليه مستهلك (فريسة) ثم يأكله مفترس.", "1. [مستوى المعرفة] ارسم سلسلة غذائية بها مفترسان.\n   الإجابة النموذجية: مثل: نبات ← جراد ← سحلية ← صقر.\n2. [مستوى التطبيق] أي كائن في سلسلتك لا يأكله غيره؟\n   الإجابة النموذجية: المفترس الأعلى (مثل الصقر).\n3. [مستوى الاستدلال] لماذا لا تكون السلاسل الغذائية طويلة جدًا عادة؟\n   الإجابة النموذجية: لأن الطاقة تقل في كل حلقة فلا تكفي حلقات كثيرة (تقبل الإجابة المبسطة).", "للطالب: رسم سلسلة غذائية من موطنه المحلي بها مفترس وفريسته (السؤال 2 ص 39). لولي الأمر: يُرجى مساعدة الابن في معرفة أسماء حيوانات منطقته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | دليل المعلم ص 53", "num": "الحصة الثالثة من 5", "focus": "أعداد المفترسات والفرائس وتأثير اختلال السلسلة"}, "f": ["1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات.\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية.\nمخرج تعليمي آخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه.", "1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات. ← تحليل\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية. ← تطبيق\nالمخرج الآخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه. ← تقييم", "- التعلم المبني على اللعب\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: بطاقات ملوّنة لمحاكاة أعداد المنتجات والفرائس والمفترسات", "- أعداد الكائنات\n- التوازن\n- الآثار المترتبة\n- التنبؤ", "يوزع المعلم 20 بطاقة خضراء (نباتات) و6 صفراء (آكلات نبات) وبطاقة حمراء واحدة (مفترس)، ويسأل: لماذا تتوقع هذه الأعداد؟", "1) التهيئة: لعبة الأعداد (5 دقائق: 0–5)\n   المعلم: يوزع البطاقات ويطرح السؤال.\n   الطالب: يتوقعون سبب الاختلاف في الأعداد.\n2) محاكاة الهرم الغذائي (12 دقائق: 5–17)\n   المعلم: يدير جولات: كل آكل نبات يحتاج 3 نباتات، والمفترس يحتاج آكلي نبات ليبقى.\n   الطالب: يجرون الجولات ويسجلون من بقي ومن هلك.\n3) ماذا لو؟ (10 دقائق: 17–27)\n   المعلم: يطرح مواقف: اختفاء المفترس؛ اختفاء العشب؛ زيادة الجراد.\n   الطالب: يتنبؤون بالنتائج في ثنائيات ويعرضونها.\n4) تصحيح المفاهيم الخاطئة (8 دقائق: 27–35)\n   المعلم: يوضح أن المفترس يأكل بعض الكائنات لا كلها، وأن الفرائس أكثر عددًا.\n   الطالب: يكتبون عبارتين صحيحتين في الدفتر.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] أيهما أكثر عددًا في الموطن عادة: الفرائس أم المفترسات؟\n   الإجابة النموذجية: الفرائس.\n2. [مستوى التطبيق] ماذا يحدث لأعداد الجراد إذا اختفت السحالي؟\n   الإجابة النموذجية: تزداد أعداد الجراد.\n3. [مستوى الاستدلال] ثم ماذا يحدث للنباتات بعد زيادة الجراد؟ وما أثر ذلك على الجراد نفسه لاحقًا؟\n   الإجابة النموذجية: تقل النباتات لأن الجراد يأكلها، ثم يقل الجراد لنقص الغذاء.", "1. [مستوى المعرفة] لماذا يحتاج الموطن إلى نباتات كثيرة؟\n   الإجابة النموذجية: لأنها غذاء لعدد كبير من آكلات النباتات التي تعتمد عليها السلسلة كلها.\n2. [مستوى التطبيق] صحح العبارة: «الأسد يأكل كل الحيوانات الموجودة أسفل منه في السلسلة».\n   الإجابة النموذجية: الأسد يأكل بعض الحيوانات فقط وليس كلها.\n3. [مستوى الاستدلال] ماذا يحدث للنباتات إذا ماتت كل المفترسات فجأة؟ وضح بالتسلسل.\n   الإجابة النموذجية: تزداد آكلات النباتات فتأكل النباتات بكثرة حتى تقل، ثم تموت كثير من الحيوانات جوعًا.", "للطالب: التفكير في سؤال: ماذا يحدث لو اختفى النحل من الحدائق؟ وكتابة الإجابة في الدفتر. لولي الأمر: يُرجى مناقشة الابن في أهمية عدم الصيد الجائر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | كتاب النشاط ص 27–28، 63 | دليل المعلم ص 53–54", "num": "الحصة الرابعة من 5", "focus": "تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)"}, "f": ["1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا.\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا.\nمخرج تعليمي آخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة.", "1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا. ← تطبيق\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا. ← تطبيق\nالمخرج الآخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة. ← فهم", "- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-3 وورقة العمل 2-3 في كتاب النشاط", "- السافانا\n- شجرة الأكاسيا\n- غزال الإمبالا\n- الحمار الوحشي\n- الضبع", "يعرض المعلم صورة للسافانا ويسأل: ما أول كائن تراه في هذه الصورة يصنع غذاءه بنفسه؟", "1) التهيئة: صورة السافانا (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويعرض الكائنات.\n   الطالب: يحددون العشب والأشجار.\n2) تمرين 2-3 (كتاب النشاط ص 27–28) (15 دقائق: 5–20)\n   المعلم: يوجه الحل: المنتجات (الأكاسيا، الحشائش)، آكلات النبات (الإمبالا، النمل الأبيض، البابون، الحمار الوحشي)، المفترسات (الأسد، الضبع، النمر)، ورسم السلاسل.\n   الطالب: يحلون فرديًا ثم يقارنون مع زميل.\n3) ورقة العمل 2-3 (ص 63) (10 دقائق: 20–30)\n   المعلم: يوجه إكمال الفراغات بالمصطلحات، مع دعم المتعثرين.\n   الطالب: يكملون النص عن المنتجات والمستهلكات والمفترس والفريسة.\n4) التصحيح الجماعي (5 دقائق: 30–35)\n   المعلم: يعرض الإجابات ويناقش السلسلة الأطول: حشائش ← حمار وحشي ← ضبع ← أسد.\n   الطالب: يصححون بالقلم الأخضر (تقييم ذاتي).\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] اذكر كائنين منتجين في السافانا.\n   الإجابة النموذجية: شجرة الأكاسيا والحشائش.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من التمرين.\n   الإجابة النموذجية: الأسد وغزال الإمبالا (أو الحمار الوحشي).\n3. [مستوى الاستدلال] اكتب سلسلة من أربع حلقات من التمرين.\n   الإجابة النموذجية: حشائش ← حمار وحشي ← ضبع ← أسد.", "1. [مستوى المعرفة] أكمل: النباتات هي الكائنات الوحيدة التي تصنع ____ بنفسها.\n   الإجابة النموذجية: الغذاء.\n2. [مستوى التطبيق] ما الغاز الناتج عندما تصنع النباتات غذاءها؟\n   الإجابة النموذجية: الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعدّ الحمار الوحشي كائنًا مستهلكًا؟\n   الإجابة النموذجية: لأنه لا يصنع غذاءه بل يتغذى على العشب.", "للطالب: حل تمرين 2-3 في كتاب النشاط ص 27–28 واجبًا منزليًا إن لم يكتمل. لولي الأمر: يُرجى تصحيح الواجب مع الابن وتشجيعه على تقييم عمله.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"h": {"lesson": "2-3 الكائنات الحية المستهلكة في السلاسل الغذائية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السادس (11–15/10/2026)", "pages": "كتاب الطالب ص 39 | كتاب النشاط ص 63 | دليل المعلم ص 53–54", "num": "الحصة الخامسة من 5", "focus": "النبات آكل الحشرات ومراجعة الكائنات المستهلكة"}, "f": ["1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط.\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة.\nمخرج تعليمي آخر: يقيّم ملصقات زملائه وفق معايير محددة.", "1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط. ← تحليل\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه وفق معايير محددة. ← تقييم", "- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: أوراق ملصقات كبيرة", "- النبات آكل الحشرات\n- المغذيات\n- التربة الفقيرة\n- المنتج والمستهلك", "يعرض المعلم مقطعًا قصيرًا لنبات صائد الذباب وهو يُطبق على ذبابة، ويسأل: هل هذا نبات أم حيوان مفترس؟", "1) التهيئة: نبات يصطاد! (5 دقائق: 0–5)\n   المعلم: يعرض المقطع ويطرح السؤال.\n   الطالب: يعبّرون عن دهشتهم ويتوقعون السبب.\n2) سؤال التحدي ص 39 (10 دقائق: 5–15)\n   المعلم: يشرح: ينمو في تربة فقيرة المغذيات، يصنع السكر من ضوء الشمس كغيره، ويأخذ المغذيات من الحشرات؛ أمثلة: نبات الإبريق والدروسيرا.\n   الطالب: يناقشون: هل هو منتج أم مستهلك؟ ولماذا لا يلائم النمط؟\n3) ملصق السلسلة المحلية (15 دقائق: 15–30)\n   المعلم: يحدد معايير الملصق: سلسلة من 3–4 حلقات من البيئة العُمانية، تسميات، ألوان، عنوان.\n   الطالب: تصمم المجموعات الملصق وتحدد المنتج والفريسة والمفترس.\n4) جولة المعرض (5 دقائق: 30–35)\n   المعلم: يدير جولة تقييم الأقران بالمعايير.\n   الطالب: يقيّمون ملصقات زملائهم ويقدمون ملاحظة.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] لماذا يصطاد النبات آكل الحشرات الذباب؟\n   الإجابة النموذجية: ليحصل على المغذيات من أجسامها لأن تربته فقيرة بالمغذيات.\n2. [مستوى التطبيق] هل يصنع النبات آكل الحشرات السكر بنفسه؟\n   الإجابة النموذجية: نعم، يصنعه من ضوء الشمس مثل النباتات الأخرى.\n3. [مستوى الاستدلال] لماذا يُعد هذا النبات مثالًا «غير ملائم للنمط»؟\n   الإجابة النموذجية: لأن النمط المعتاد أن الحيوان يأكل النبات، أما هنا فالنبات يصطاد الحيوان.", "1. [مستوى المعرفة] اذكر اسم نبات آكل للحشرات.\n   الإجابة النموذجية: نبات الإبريق أو الدروسيرا أو صائد الذباب.\n2. [مستوى التطبيق] في ملصقك، حدد المنتج والمفترس الأعلى.\n   الإجابة النموذجية: تعتمد على الملصق، مثل: عشب (منتج) وصقر (مفترس أعلى).\n3. [مستوى الاستدلال] صمم سؤالًا لزملائك عن السلاسل الغذائية مع إجابته.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها الصحيحة.", "للطالب: حل ورقة العمل 2-3 (كتاب النشاط ص 63) إن لم تكتمل، ومراجعة ص 38–39. لولي الأمر: يُرجى الاطلاع على الملصق الذي صممه الابن وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}], "comb": ["الحصة 1: المفترس والفريسة\n1. يعرّف المفترس والفريسة.\n2. يميّز المفترس من الفريسة في أمثلة مصورة.\nمخرج تعليمي آخر: يصف بعض طرق المفترسات في اصطياد فرائسها.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته.\n2. يحدد النمط المشترك في السلاسل الغذائية.\nمخرج تعليمي آخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس.\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات.\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية.\nمخرج تعليمي آخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا.\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا.\nمخرج تعليمي آخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط.\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة.\nمخرج تعليمي آخر: يقيّم ملصقات زملائه وفق معايير محددة.", "الحصة 1: المفترس والفريسة\n1. يعرّف المفترس والفريسة. ← تذكر\n2. يميّز المفترس من الفريسة في أمثلة مصورة. ← فهم\nالمخرج الآخر: يصف بعض طرق المفترسات في اصطياد فرائسها. ← فهم\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1. يرسم سلسلة غذائية تبدأ بكائن منتج وتتضمن مفترسًا وفريسته. ← تطبيق\n2. يحدد النمط المشترك في السلاسل الغذائية. ← تحليل\nالمخرج الآخر: يحدد موقع المفترس الأعلى في سلسلة بها أكثر من مفترس. ← تحليل\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. يستنتج أن أعداد الفرائس في الموطن أكبر من أعداد المفترسات. ← تحليل\n2. يتنبأ بأثر اختفاء أحد الكائنات على باقي السلسلة الغذائية. ← تطبيق\nالمخرج الآخر: يصحح المفهوم الخاطئ بأن المفترس يأكل كل الكائنات الأدنى منه. ← تقييم\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. يحدد الكائنات المنتجة والمستهلكة والمفترسة في موطن السافانا. ← تطبيق\n2. يكوّن سلاسل غذائية صحيحة من بيانات موطن السافانا. ← تطبيق\nالمخرج الآخر: يكمل نصًا علميًا عن الكائنات المستهلكة بالمصطلحات الصحيحة. ← فهم\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. يفسر سبب اصطياد النبات آكل الحشرات للحشرات بوصفه حالة لا تلائم النمط. ← تحليل\n2. يصمم ملصقًا لسلسلة غذائية من بيئته يوضح فيه المنتج والمفترس والفريسة. ← إبداع\nالمخرج الآخر: يقيّم ملصقات زملائه وفق معايير محددة. ← تقييم", "الحصة 1: المفترس والفريسة\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n- التعلم التعاوني\n- التعلم بالنمذجة\n- التعلم التشاركي\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- التعلم المبني على اللعب\n- التعلم المبني على حل المشكلات\n- فكّر – زاوج – شارك\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- التعلم الذاتي\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي\n- التعلم المبني على حل المشكلات", "الحصة 1: المفترس والفريسة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n- الكتاب\n- السبورة الذكية\n- الأقلام\n- أخرى: بطاقات كائنات حية وخيوط لبناء سلاسل معلّقة\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: بطاقات ملوّنة لمحاكاة أعداد المنتجات والفرائس والمفترسات\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: تمرين 2-3 وورقة العمل 2-3 في كتاب النشاط\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- الأقلام\n- أخرى: أوراق ملصقات كبيرة", "الحصة 1: المفترس والفريسة\n- المفترس\n- الفريسة\n- الكائن المستهلك\n- الحيوانات آكلة النباتات\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n- سلسلة غذائية\n- المفترس الأعلى\n- النمط\n- الكائن المنتج\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n- أعداد الكائنات\n- التوازن\n- الآثار المترتبة\n- التنبؤ\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n- السافانا\n- شجرة الأكاسيا\n- غزال الإمبالا\n- الحمار الوحشي\n- الضبع\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n- النبات آكل الحشرات\n- المغذيات\n- التربة الفقيرة\n- المنتج والمستهلك", "الحصة 1: المفترس والفريسة\nيعرض المعلم صور حيوانات مختلطة، ويسأل: أي هذه الحيوانات يأكل حيوانًا آخر؟ وأيها يُؤكل؟\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\nيكتب المعلم على السبورة: «نباتات ← جراد ← سحلية ← صقر» ويسأل: كم مفترسًا في هذه السلسلة؟\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nيوزع المعلم 20 بطاقة خضراء (نباتات) و6 صفراء (آكلات نبات) وبطاقة حمراء واحدة (مفترس)، ويسأل: لماذا تتوقع هذه الأعداد؟\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nيعرض المعلم صورة للسافانا ويسأل: ما أول كائن تراه في هذه الصورة يصنع غذاءه بنفسه؟\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nيعرض المعلم مقطعًا قصيرًا لنبات صائد الذباب وهو يُطبق على ذبابة، ويسأل: هل هذا نبات أم حيوان مفترس؟", "الحصة 1: المفترس والفريسة\n1) التهيئة: من يأكل من؟ (5 دقائق: 0–5)\n   المعلم: يعرض الصور ويطرح السؤال.\n   الطالب: يصنفون الحيوانات إلى «يأكل» و«يُؤكل».\n2) المصطلحات والأمثلة (10 دقائق: 5–15)\n   المعلم: يقدم المفترس والفريسة بأمثلة ص 38: البومة والفأر، الثعبان، الضفدع والحشرات.\n   الطالب: يكتبون التعريفين ويضيفون أمثلة.\n3) لعبة «مفترس أو فريسة؟» (12 دقائق: 15–27)\n   المعلم: يعرض بطاقات حيوانات تباعًا، ومنها ما يكون مفترسًا وفريسة معًا (السحلية).\n   الطالب: يرفعون بطاقة (مفترس/فريسة/كلاهما) ويبررون.\n4) طرق الافتراس (8 دقائق: 27–35)\n   المعلم: يناقش: السم لدى بعض الثعابين، الابتلاع، الصيد ليلًا للبومة.\n   الطالب: يرسمون حيوانًا مفترسًا ويكتبون طريقة صيده.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1) التهيئة: عدّ المفترسات (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويناقش الإجابات.\n   الطالب: يحددون السحلية والصقر مفترسين.\n2) السؤال 1 ص 39 (10 دقائق: 5–15)\n   المعلم: يوجه الربط بين المفترسات الخمسة وفرائسها في الشكل.\n   الطالب: يصلون بين كل مفترس وفريسته.\n3) سلاسل معلّقة (12 دقائق: 15–27)\n   المعلم: يوزع بطاقات كائنات على المجموعات لبناء سلاسل معلّقة بالخيوط تبدأ بالمنتج.\n   الطالب: يبنون سلسلتين ويحددون المنتج والفريسة والمفترس.\n4) السؤالان 3 و4: النمط (8 دقائق: 27–35)\n   المعلم: يقود المقارنة بين سلاسل المجموعات.\n   الطالب: يستنتجون النمط: منتج ← فريسة (آكل نبات) ← مفترس.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1) التهيئة: لعبة الأعداد (5 دقائق: 0–5)\n   المعلم: يوزع البطاقات ويطرح السؤال.\n   الطالب: يتوقعون سبب الاختلاف في الأعداد.\n2) محاكاة الهرم الغذائي (12 دقائق: 5–17)\n   المعلم: يدير جولات: كل آكل نبات يحتاج 3 نباتات، والمفترس يحتاج آكلي نبات ليبقى.\n   الطالب: يجرون الجولات ويسجلون من بقي ومن هلك.\n3) ماذا لو؟ (10 دقائق: 17–27)\n   المعلم: يطرح مواقف: اختفاء المفترس؛ اختفاء العشب؛ زيادة الجراد.\n   الطالب: يتنبؤون بالنتائج في ثنائيات ويعرضونها.\n4) تصحيح المفاهيم الخاطئة (8 دقائق: 27–35)\n   المعلم: يوضح أن المفترس يأكل بعض الكائنات لا كلها، وأن الفرائس أكثر عددًا.\n   الطالب: يكتبون عبارتين صحيحتين في الدفتر.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1) التهيئة: صورة السافانا (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويعرض الكائنات.\n   الطالب: يحددون العشب والأشجار.\n2) تمرين 2-3 (كتاب النشاط ص 27–28) (15 دقائق: 5–20)\n   المعلم: يوجه الحل: المنتجات (الأكاسيا، الحشائش)، آكلات النبات (الإمبالا، النمل الأبيض، البابون، الحمار الوحشي)، المفترسات (الأسد، الضبع، النمر)، ورسم السلاسل.\n   الطالب: يحلون فرديًا ثم يقارنون مع زميل.\n3) ورقة العمل 2-3 (ص 63) (10 دقائق: 20–30)\n   المعلم: يوجه إكمال الفراغات بالمصطلحات، مع دعم المتعثرين.\n   الطالب: يكملون النص عن المنتجات والمستهلكات والمفترس والفريسة.\n4) التصحيح الجماعي (5 دقائق: 30–35)\n   المعلم: يعرض الإجابات ويناقش السلسلة الأطول: حشائش ← حمار وحشي ← ضبع ← أسد.\n   الطالب: يصححون بالقلم الأخضر (تقييم ذاتي).\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1) التهيئة: نبات يصطاد! (5 دقائق: 0–5)\n   المعلم: يعرض المقطع ويطرح السؤال.\n   الطالب: يعبّرون عن دهشتهم ويتوقعون السبب.\n2) سؤال التحدي ص 39 (10 دقائق: 5–15)\n   المعلم: يشرح: ينمو في تربة فقيرة المغذيات، يصنع السكر من ضوء الشمس كغيره، ويأخذ المغذيات من الحشرات؛ أمثلة: نبات الإبريق والدروسيرا.\n   الطالب: يناقشون: هل هو منتج أم مستهلك؟ ولماذا لا يلائم النمط؟\n3) ملصق السلسلة المحلية (15 دقائق: 15–30)\n   المعلم: يحدد معايير الملصق: سلسلة من 3–4 حلقات من البيئة العُمانية، تسميات، ألوان، عنوان.\n   الطالب: تصمم المجموعات الملصق وتحدد المنتج والفريسة والمفترس.\n4) جولة المعرض (5 دقائق: 30–35)\n   المعلم: يدير جولة تقييم الأقران بالمعايير.\n   الطالب: يقيّمون ملصقات زملائهم ويقدمون ملاحظة.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-3).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "الحصة 1: المفترس والفريسة\n1. [مستوى المعرفة] ما المقصود بالمفترس؟\n   الإجابة النموذجية: حيوان مستهلك يصطاد الحيوانات الأخرى ويتغذى عليها.\n2. [مستوى التطبيق] في الزوج (البومة، الفأر)، من الفريسة؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] لماذا يمكن أن تكون السحلية مفترسًا وفريسة في الوقت نفسه؟\n   الإجابة النموذجية: لأنها تأكل الجراد فتكون مفترسًا، ويأكلها الصقر فتكون فريسة.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1. [مستوى المعرفة] بماذا يجب أن تبدأ أي سلسلة غذائية ترسمها؟\n   الإجابة النموذجية: بكائن منتج (نبات).\n2. [مستوى التطبيق] في السلسلة: عشب ← جرادة ← سحلية ← صقر، ما الفريسة الأولى؟\n   الإجابة النموذجية: الجرادة.\n3. [مستوى الاستدلال] ما النمط الذي تسلكه جميع السلاسل التي رسمتموها؟\n   الإجابة النموذجية: تبدأ بمنتج يتغذى عليه مستهلك (فريسة) ثم يأكله مفترس.\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. [مستوى المعرفة] أيهما أكثر عددًا في الموطن عادة: الفرائس أم المفترسات؟\n   الإجابة النموذجية: الفرائس.\n2. [مستوى التطبيق] ماذا يحدث لأعداد الجراد إذا اختفت السحالي؟\n   الإجابة النموذجية: تزداد أعداد الجراد.\n3. [مستوى الاستدلال] ثم ماذا يحدث للنباتات بعد زيادة الجراد؟ وما أثر ذلك على الجراد نفسه لاحقًا؟\n   الإجابة النموذجية: تقل النباتات لأن الجراد يأكلها، ثم يقل الجراد لنقص الغذاء.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. [مستوى المعرفة] اذكر كائنين منتجين في السافانا.\n   الإجابة النموذجية: شجرة الأكاسيا والحشائش.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من التمرين.\n   الإجابة النموذجية: الأسد وغزال الإمبالا (أو الحمار الوحشي).\n3. [مستوى الاستدلال] اكتب سلسلة من أربع حلقات من التمرين.\n   الإجابة النموذجية: حشائش ← حمار وحشي ← ضبع ← أسد.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. [مستوى المعرفة] لماذا يصطاد النبات آكل الحشرات الذباب؟\n   الإجابة النموذجية: ليحصل على المغذيات من أجسامها لأن تربته فقيرة بالمغذيات.\n2. [مستوى التطبيق] هل يصنع النبات آكل الحشرات السكر بنفسه؟\n   الإجابة النموذجية: نعم، يصنعه من ضوء الشمس مثل النباتات الأخرى.\n3. [مستوى الاستدلال] لماذا يُعد هذا النبات مثالًا «غير ملائم للنمط»؟\n   الإجابة النموذجية: لأن النمط المعتاد أن الحيوان يأكل النبات، أما هنا فالنبات يصطاد الحيوان.", "الحصة 1: المفترس والفريسة\n1. [مستوى المعرفة] ما الفريسة؟\n   الإجابة النموذجية: الحيوان الذي تصطاده الحيوانات المفترسة وتتغذى عليه.\n2. [مستوى التطبيق] اذكر مفترسًا وفريسته من بيئتك.\n   الإجابة النموذجية: مثل: القط والفأر، أو الطائر والجرادة (تقبل الأمثلة الصحيحة).\n3. [مستوى الاستدلال] هل كل المستهلكات مفترسات؟ وضح بمثال.\n   الإجابة النموذجية: لا؛ فبعضها يتغذى على النباتات فقط مثل الخروف والجمل.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\n1. [مستوى المعرفة] ارسم سلسلة غذائية بها مفترسان.\n   الإجابة النموذجية: مثل: نبات ← جراد ← سحلية ← صقر.\n2. [مستوى التطبيق] أي كائن في سلسلتك لا يأكله غيره؟\n   الإجابة النموذجية: المفترس الأعلى (مثل الصقر).\n3. [مستوى الاستدلال] لماذا لا تكون السلاسل الغذائية طويلة جدًا عادة؟\n   الإجابة النموذجية: لأن الطاقة تقل في كل حلقة فلا تكفي حلقات كثيرة (تقبل الإجابة المبسطة).\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\n1. [مستوى المعرفة] لماذا يحتاج الموطن إلى نباتات كثيرة؟\n   الإجابة النموذجية: لأنها غذاء لعدد كبير من آكلات النباتات التي تعتمد عليها السلسلة كلها.\n2. [مستوى التطبيق] صحح العبارة: «الأسد يأكل كل الحيوانات الموجودة أسفل منه في السلسلة».\n   الإجابة النموذجية: الأسد يأكل بعض الحيوانات فقط وليس كلها.\n3. [مستوى الاستدلال] ماذا يحدث للنباتات إذا ماتت كل المفترسات فجأة؟ وضح بالتسلسل.\n   الإجابة النموذجية: تزداد آكلات النباتات فتأكل النباتات بكثرة حتى تقل، ثم تموت كثير من الحيوانات جوعًا.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\n1. [مستوى المعرفة] أكمل: النباتات هي الكائنات الوحيدة التي تصنع ____ بنفسها.\n   الإجابة النموذجية: الغذاء.\n2. [مستوى التطبيق] ما الغاز الناتج عندما تصنع النباتات غذاءها؟\n   الإجابة النموذجية: الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعدّ الحمار الوحشي كائنًا مستهلكًا؟\n   الإجابة النموذجية: لأنه لا يصنع غذاءه بل يتغذى على العشب.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\n1. [مستوى المعرفة] اذكر اسم نبات آكل للحشرات.\n   الإجابة النموذجية: نبات الإبريق أو الدروسيرا أو صائد الذباب.\n2. [مستوى التطبيق] في ملصقك، حدد المنتج والمفترس الأعلى.\n   الإجابة النموذجية: تعتمد على الملصق، مثل: عشب (منتج) وصقر (مفترس أعلى).\n3. [مستوى الاستدلال] صمم سؤالًا لزملائك عن السلاسل الغذائية مع إجابته.\n   الإجابة النموذجية: تقبل الأسئلة الصحيحة علميًا مع إجاباتها الصحيحة.", "الحصة 1: المفترس والفريسة\nللطالب: قراءة كتاب الطالب ص 38 وكتابة ثلاثة أزواج (مفترس – فريسة). لولي الأمر: يُرجى مشاهدة مقطع وثائقي قصير عن الحياة البرية مع الابن.\n\nالحصة 2: سلاسل غذائية بها أكثر من مفترس\nللطالب: رسم سلسلة غذائية من موطنه المحلي بها مفترس وفريسته (السؤال 2 ص 39). لولي الأمر: يُرجى مساعدة الابن في معرفة أسماء حيوانات منطقته.\n\nالحصة 3: أعداد المفترسات والفرائس وتأثير اختلال السلسلة\nللطالب: التفكير في سؤال: ماذا يحدث لو اختفى النحل من الحدائق؟ وكتابة الإجابة في الدفتر. لولي الأمر: يُرجى مناقشة الابن في أهمية عدم الصيد الجائر.\n\nالحصة 4: تطبيق: سلاسل غذائية في السافانا (تمرين 2-3 وورقة العمل 2-3)\nللطالب: حل تمرين 2-3 في كتاب النشاط ص 27–28 واجبًا منزليًا إن لم يكتمل. لولي الأمر: يُرجى تصحيح الواجب مع الابن وتشجيعه على تقييم عمله.\n\nالحصة 5: النبات آكل الحشرات ومراجعة الكائنات المستهلكة\nللطالب: حل ورقة العمل 2-3 (كتاب النشاط ص 63) إن لم تكتمل، ومراجعة ص 38–39. لولي الأمر: يُرجى الاطلاع على الملصق الذي صممه الابن وتشجيعه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=11"]}, {"id": "2-4", "title": "السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40–41 | كتاب النشاط ص 29–30 | دليل المعلم ص 53–55", "n": 5, "per": [{"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40 | دليل المعلم ص 54", "num": "الحصة الأولى من 5", "focus": "تنوع المواطن الطبيعية على كوكب الأرض"}, "f": ["1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط.\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن.\nمخرج تعليمي آخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية.", "1. يذكر أمثلة لمواطن طبيعية مختلفة: الغابة الاستوائية، الصحراء، السافانا، المحيط. ← تذكر\n2. يفسر اختلاف النباتات والحيوانات باختلاف مناخ المواطن. ← فهم\nالمخرج الآخر: يحدد مواقع بعض المواطن على مجسم الكرة الأرضية. ← تطبيق", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية", "- الموطن الطبيعي\n- المناخ\n- الغابة الاستوائية\n- الصحراء\n- السافانا", "يعرض المعلم أربع صور: صحراء، تحت سطح الماء، سهول قطبية، غابة؛ ويسأل: هل تنمو النباتات نفسها في كل هذه الأماكن؟", "1) التهيئة: أربع صور (5 دقائق: 0–5)\n   المعلم: يعرض الصور ويطرح السؤال.\n   الطالب: يقارنون ويقترحون أسباب الاختلاف.\n2) المناخ والموطن (10 دقائق: 5–15)\n   المعلم: يشرح ص 40: المناخ الحار الرطب للغابات الاستوائية، الحار الجاف للصحراء، الحار مع أمطار صيفية للسافانا.\n   الطالب: يملؤون جدولًا: الموطن – المناخ – نباتات – حيوانات.\n3) رحلة على الكرة الأرضية (10 دقائق: 15–25)\n   المعلم: يحدد على المجسم مواقع الغابات الاستوائية والصحاري والسافانا في إفريقيا.\n   الطالب: يحددون موقع عُمان ونوع موطنها الغالب.\n4) مواطن عُمانية (10 دقائق: 25–35)\n   المعلم: يقود مناقشة: الجبال، السواحل، الصحراء، الأفلاج.\n   الطالب: يذكرون كائنات من كل موطن عماني.\n5) الختام والتقويم (5 دقائق: 35–40)\n   المعلم: يطرح التقويم الختامي.\n   الطالب: يجيبون فرديًا.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] لماذا توجد مواطن طبيعية عديدة على الأرض؟\n   الإجابة النموذجية: بسبب تعدد المناخات مما يؤدي إلى وجود نباتات مختلفة.\n2. [مستوى التطبيق] ما مناخ الغابة الاستوائية؟\n   الإجابة النموذجية: حار رطب.\n3. [مستوى الاستدلال] لماذا تختلف حيوانات الصحراء عن حيوانات الغابة الاستوائية؟\n   الإجابة النموذجية: لأن النباتات المختلفة تجذب حيوانات مختلفة، والمناخ يحدد الكائنات القادرة على العيش.", "1. [مستوى المعرفة] اذكر موطنين طبيعيين مختلفين.\n   الإجابة النموذجية: مثل: الصحراء والمحيط (أو السافانا والغابة الاستوائية).\n2. [مستوى التطبيق] ما نوع الموطن الغالب في عُمان؟\n   الإجابة النموذجية: الصحراوي، مع مواطن جبلية وساحلية.\n3. [مستوى الاستدلال] توقع: أي الموطنين فيه تنوع نباتي أكبر، الغابة الاستوائية أم الصحراء؟ ولماذا؟\n   الإجابة النموذجية: الغابة الاستوائية؛ لوفرة الماء والحرارة المناسبة لنمو نباتات كثيرة.", "للطالب: قراءة كتاب الطالب ص 40 وجمع صور لثلاثة مواطن مختلفة. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور للمواطن الطبيعية في عُمان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 40–41 | دليل المعلم ص 54–55", "num": "الحصة الثانية من 5", "focus": "السلاسل الغذائية في السافانا"}, "f": ["1. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا.\n2. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة.\nمخرج تعليمي آخر: يتنبأ بأثر موت المفترسات في السافانا.", "1. يحدد الكائنات المنتجة والمستهلكة والمفترسة وفرائسها في السافانا. ← فهم\n2. يرسم سلسلتين غذائيتين في السافانا تربط بين مفترس وفريسة. ← تطبيق\nالمخرج الآخر: يتنبأ بأثر موت المفترسات في السافانا. ← تحليل", "- التعلم التعاوني\n- فكّر – زاوج – شارك\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- السافانا\n- آكلات الأعشاب\n- الثور البري\n- الزرافة\n- المفترس", "يُسمع المعلم الطلبة صوت زئير أسد، ويسأل: أين يعيش؟ وماذا يأكل؟ ومن يأكل الطعام الذي يأكله الأسد؟", "1) التهيئة: زئير الأسد (5 دقائق: 0–5)\n   المعلم: يطرح الأسئلة ويقود إلى السافانا.\n   الطالب: يجيبون ويتوقعون غذاء الأسد.\n2) سلاسل السافانا ص 40 (12 دقائق: 5–17)\n   المعلم: يناقش الأسئلة في الكتاب: المنتجات، المستهلكات، المفترسات وفرائسها، ماذا يأكل كل حيوان.\n   الطالب: يحددون في الصورة ويكتبون في جدول.\n3) السؤال 2 ص 41 (10 دقائق: 17–27)\n   المعلم: يوجه: ثلاثة حيوانات تأكل النباتات فقط، وسلسلتان بهما مفترس وفريسة.\n   الطالب: يكتبون: الزرافة تأكل أوراق الأشجار، الثور البري والحمار الوحشي العشب؛ ويرسمون السلاسل.\n4) تحدّث عن: موت المفترسات (8 دقائق: 27–35)\n   المعلم: يطرح سؤال «تحدّث عن» ص 41.\n   الطالب: يتنبؤون بالتسلسل: زيادة آكلات العشب، نقص العشب، مجاعة.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما الكائنات المنتجة في السافانا؟\n   الإجابة النموذجية: العشب والأشجار.\n2. [مستوى التطبيق] ماذا تأكل الزرافة؟\n   الإجابة النموذجية: أوراق الأشجار.\n3. [مستوى الاستدلال] ارسم سلسلة غذائية تنتهي بالأسد.\n   الإجابة النموذجية: العشب ← الحمار الوحشي ← الأسد (أو أوراق الأشجار ← الزرافة ← الأسد).", "1. [مستوى المعرفة] اذكر مفترسين من السافانا.\n   الإجابة النموذجية: الأسد والفهد (أو النمر والضبع).\n2. [مستوى التطبيق] ما الحيوانات التي تتغذى على الحيوانات الميتة؟\n   الإجابة النموذجية: النسور.\n3. [مستوى الاستدلال] ماذا سيحدث للعشب إذا ماتت فجأة كل المفترسات؟\n   الإجابة النموذجية: سيقل كثيرًا لأن أعداد آكلات العشب ستزداد وتأكله.", "للطالب: رسم سلسلتين غذائيتين من السافانا في الدفتر ومراجعة ص 40–41. لولي الأمر: يُرجى مناقشة الابن في سبب وجود المفترسات الكبيرة في أقفاص بحدائق الحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن الطبيعية المختلفة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع السابع (18–22/10/2026)", "pages": "كتاب الطالب ص 41 | دليل المعلم ص 54–55", "num": "الحصة الثالثة من 5", "focus": "السلاسل الغذائية في المحيط"}, "f": ["1. يوضح أن العوالق والطحالب هي المنتجات في المحيط.\n2. يرسم سلاسل غذائية بحرية بها مفترس واحد وأخرى بها مفترسان.\nمخرج تعليمي آخر: يقارن بين الكائنات المنتجة في السافانا والمحيط.", "1. يوضح أن العوالق والطحالب هي المنتجات في المحيط. ← فهم\n2. يرسم سلاسل غذائية بحرية بها مفترس واحد وأخرى بها مفترسان. ← تطبيق\nالمخرج الآخر: يقارن بين الكائنات المنتجة في السافانا والمحيط. ← تحليل", "- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم بالنمذجة", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)", "- المحيط\n- العوالق\n- الطحالب\n- السردين\n- النورس", "يسأل المعلم: يغطي الماء نحو ثلاثة أرباع سطح الأرض. ماذا تأكل الأسماك في وسط المحيط بعيدًا عن النباتات الكبيرة؟", "1) التهيئة: غذاء الأسماك (5 دقائق: 0–5)\n   المعلم: يطرح السؤال ويستمع للتوقعات.\n   الطالب: يقترحون أفكارهم.\n2) العوالق (10 دقائق: 5–15)\n   المعلم: يشرح ص 41: العوالق كائنات صغيرة جدًا، منها نباتات منتجة وطحالب؛ ويعرض صورة مجهرية.\n   الطالب: يكتبون: العوالق والطحالب منتجات المحيط.\n3) السؤال 3 ص 41 (12 دقائق: 15–27)\n   المعلم: يوجه رسم سلسلتين بمفترس واحد وسلسلتين بمفترسين.\n   الطالب: يرسمون: عوالق ← أسماك صغيرة ← نورس؛ عوالق ← سردين ← سمكة كبيرة ← إنسان.\n4) السؤال 1: المقارنة (8 دقائق: 27–35)\n   المعلم: يوجه مقارنة المنتجات في السافانا والمحيط في جدول.\n   الطالب: يكملون الجدول: السافانا: عشب وأشجار؛ المحيط: عوالق وطحالب.\n5) الختام: مسابقة المجموعات (5 دقائق: 35–40)\n   المعلم: يشغّل ملف مسابقة المجموعات على محور الحصة، ويعلن الفائز بكل سؤال (درس 2-4).\n   الطالب: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط.\n(مجموع الزمن: 40 دقيقة)", "1. [مستوى المعرفة] ما المقصود بالعوالق؟\n   الإجابة النموذجية: كائنات حية صغيرة جدًا يصعب رؤيتها بالعين المجردة تعيش في الماء.\n2. [مستوى التطبيق] ما المنتج في السلسلة: عوالق ← سمكة صغيرة ← نورس؟\n   الإجابة النموذجية: العوالق.\n3. [مستوى الاستدلال] قارن بين المنتجات في السافانا والمحيط.\n   الإجابة النموذجية: في السافانا العشب والأشجار، وفي المحيط العوالق والطحالب.", "1. [مستوى المعرفة] ارسم سلسلة غذائية بحرية تنتهي بالإنسان.\n   الإجابة النموذجية: عوالق ← قشريات ← إنسان (أو عوالق ← سردين ← إنسان).\n2. [مستوى التطبيق] لماذا تُعد المواطن البحرية مهمة جدًا؟\n   الإجابة النموذجية: لأنها تغطي نحو ثلاثة أرباع سطح الأرض وتضم أنواعًا كثيرة من الكائنات.\n3. [مستوى الاستدلال] ماذا تتوقع أن يحدث للأسماك إذا قلّت العوالق بسبب التلوث؟\n   الإجابة النموذجية: تقل أعداد الأسماك الصغيرة ثم الأسماك الكبيرة والطيور التي تتغذى عليها.", "للطالب: كتابة سلسلتين غذائيتين بحريتين من بحر عُمان. لولي الأمر: يُرجى توعية الابن بعدم رمي المخلفات على الشواطئ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"h": {"lesson": "2-4 السلاسل الغذائية في المواطن
