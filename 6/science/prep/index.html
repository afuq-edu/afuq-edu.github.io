ي موطن الصحراء (تمرين 2-4)\n- الصحراء\n- الضباب الموسمي\n- قطرات الندى\n- القط الرملي\n- الصقر\n\nالحصة 4: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\n- الموطن\n- المقارنة\n- السلسلة الغذائية\n- المنتج\n- المفترس الأعلى", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nيعرض المعلم أربع صور: صحراء، تحت سطح الماء، سهول قطبية، غابة؛ ويسأل: هل تنمو النباتات نفسها في كل هذه الأماكن؟ (5 دقائق)\n\nالحصة 2: السلاسل الغذائية في المحيط\nيسأل المعلم: يغطي الماء نحو ثلاثة أرباع سطح الأرض. ماذا تأكل الأسماك في وسط المحيط بعيدًا عن النباتات الكبيرة؟ (5 دقائق)\n\nالحصة 3: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nيسأل المعلم: كيف تحصل نباتات الصحراء على الماء والأمطار قليلة؟ ويعرض صورة لضباب ظفار الموسمي. (5 دقائق)\n\nالحصة 4: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nيعرض المعلم «بطاقات المواطن» (سافانا، محيط، صحراء، غابة استوائية) مقلوبة، وتسحب كل مجموعة بطاقة تحدد موطن مشروعها. (5 دقائق)", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض — زمن الحصة 40 دقيقة\n1. المناخ والموطن: يشرح المعلم ص 40: المناخ الحار الرطب للغابات الاستوائية، الحار الجاف للصحراء، الحار مع أمطار صيفية للسافانا، والطلبة يملؤون جدولًا: الموطن – المناخ – نباتات – حيوانات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رحلة على الكرة الأرضية: يحدد المعلم على المجسم مواقع الغابات الاستوائية والصحاري والسافانا في إفريقيا، والطلبة يحددون موقع عُمان ونوع موطنها الغالب (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مواطن عُمانية: يقود المعلم مناقشة: الجبال، السواحل، الصحراء، الأفلاج، والطلبة يذكرون كائنات من كل موطن عماني (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. سلاسل السافانا ص 40: يناقش المعلم الأسئلة في الكتاب: المنتجات، المستهلكات، المفترسات وفرائسها، ماذا يأكل كل حيوان، والطلبة يحددون في الصورة ويكتبون في جدول (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n5. السؤال 2 ص 41: يوجه المعلم: ثلاثة حيوانات تأكل النباتات فقط، وسلسلتان بهما مفترس وفريسة، والطلبة يكتبون: الزرافة تأكل أوراق الأشجار، الثور البري والحمار الوحشي العشب؛ ويرسمون السلاسل (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تحدّث عن: موت المفترسات: يطرح المعلم سؤال «تحدّث عن» ص 41، والطلبة يتنبؤون بالتسلسل: زيادة آكلات العشب، نقص العشب، مجاعة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\nالحصة 2: السلاسل الغذائية في المحيط — زمن الحصة 40 دقيقة\n1. العوالق: يشرح المعلم ص 41: العوالق كائنات صغيرة جدًا، منها نباتات منتجة وطحالب؛ ويعرض صورة مجهرية، والطلبة يكتبون: العوالق والطحالب منتجات المحيط (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. السؤال 3 ص 41: يوجه المعلم رسم سلسلتين بمفترس واحد وسلسلتين بمفترسين، والطلبة يرسمون: عوالق ← أسماك صغيرة ← نورس؛ عوالق ← سردين ← سمكة كبيرة ← إنسان (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. السؤال 1: المقارنة: يوجه المعلم مقارنة المنتجات في السافانا والمحيط في جدول، والطلبة يكملون الجدول: السافانا: عشب وأشجار؛ المحيط: عوالق وطحالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\nالحصة 3: سلاسل غذائية في موطن الصحراء (تمرين 2-4) — زمن الحصة 40 دقيقة\n1. تمرين 2-4 (ص 29–30): يوجه المعلم الحل: المنتجات (أعشاب ونباتات صحراوية)، مصادر الماء، آكلات النبات، المفترسات وفرائسها، والطلبة يحلون فرديًا: القط الرملي يأكل الفأر، السحلية تأكل العنكبوت، الصقر يأكل السحلية (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. رسم سلسلة صحراوية: يطلب المعلم سلسلة من أربع حلقات، والطلبة يرسمون: نباتات صحراوية ← خنفساء ← فأر ← بومة (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. التصحيح بالأقران: يعرض المعلم الإجابات النموذجية، والطلبة يتبادلون الكتب ويصححون (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 4: مشروع مقارنة المواطن: لوحة السلاسل الغذائية — زمن الحصة 40 دقيقة\n1. تصميم اللوحة: يتابع المجموعات: صورة الموطن، مناخه، سلسلة من 3–4 حلقات، تحديد المنتج والفريسة والمفترس، والطلبة يصممون اللوحة ويوزعون المهام (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. العرض والمقارنة: يدير المعلم عرضًا سريعًا (دقيقتان لكل مجموعة) ويكتب جدول مقارنة على السبورة، والطلبة يعرضون ويكملون جدول المقارنة (6 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. تقييم الأقران: يوزع المعلم بطاقة تقييم بسيطة (الدقة، الوضوح، التنظيم)، والطلبة يقيّمون لوحات زملائهم (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – سلاسل من مواطن عمان: تكون كل مجموعة سلسلة غذائية لموطن عماني مختلف: البحر، الصحراء، الجبل، وتقارن بين السلاسل في عرض سريع (5 دقائق)\nالاستراتيجيات: المحطات.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا توجد مواطن طبيعية عديدة على الأرض؟\n   الإجابة النموذجية: بسبب تعدد المناخات مما يؤدي إلى وجود نباتات مختلفة.\n2. [مستوى التطبيق] ما مناخ الغابة الاستوائية؟\n   الإجابة النموذجية: حار رطب.\n3. [مستوى الاستدلال] لماذا تختلف حيوانات الصحراء عن حيوانات الغابة الاستوائية؟\n   الإجابة النموذجية: لأن النباتات المختلفة تجذب حيوانات مختلفة، والمناخ يحدد الكائنات القادرة على العيش.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] ما الكائنات المنتجة في السافانا؟\n   الإجابة النموذجية: العشب والأشجار.\n5. [مستوى التطبيق] ماذا تأكل الزرافة؟\n   الإجابة النموذجية: أوراق الأشجار.\n6. [مستوى الاستدلال] ارسم سلسلة غذائية تنتهي بالأسد.\n   الإجابة النموذجية: العشب ← الحمار الوحشي ← الأسد (أو أوراق الأشجار ← الزرافة ← الأسد).\n\nالحصة 2: السلاسل الغذائية في المحيط\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بالعوالق؟\n   الإجابة النموذجية: كائنات حية صغيرة جدًا يصعب رؤيتها بالعين المجردة تعيش في الماء.\n2. [مستوى التطبيق] ما المنتج في السلسلة: عوالق ← سمكة صغيرة ← نورس؟\n   الإجابة النموذجية: العوالق.\n3. [مستوى الاستدلال] قارن بين المنتجات في السافانا والمحيط.\n   الإجابة النموذجية: في السافانا العشب والأشجار، وفي المحيط العوالق والطحالب.\n\nالحصة 3: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر مصدرين للماء في الصحراء.\n   الإجابة النموذجية: الأمطار القليلة والضباب الموسمي وقطرات الندى.\n2. [مستوى التطبيق] ما فريسة القط الرملي؟\n   الإجابة النموذجية: الفأر.\n3. [مستوى الاستدلال] ارسم سلسلة صحراوية تنتهي بالسحلية.\n   الإجابة النموذجية: نباتات صحراوية ← جرادة/نملة ← عنكبوت ← سحلية.\n\nالحصة 4: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المنتج في موطن مجموعتك؟\n   الإجابة النموذجية: تعتمد على الموطن: عشب/أشجار، عوالق، نباتات صحراوية...\n2. [مستوى التطبيق] ما وجه الشبه بين جميع السلاسل المعروضة؟\n   الإجابة النموذجية: كلها تبدأ بكائن منتج.\n3. [مستوى الاستدلال] ما وجه الاختلاف الرئيسي بين سلاسل المحيط والسافانا؟\n   الإجابة النموذجية: نوع المنتجات والحيوانات المختلف تبعًا لاختلاف الموطن.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين طبيعيين مختلفين.\n   الإجابة النموذجية: مثل: الصحراء والمحيط (أو السافانا والغابة الاستوائية).\n2. [مستوى التطبيق] ما نوع الموطن الغالب في عُمان؟\n   الإجابة النموذجية: الصحراوي، مع مواطن جبلية وساحلية.\n3. [مستوى الاستدلال] توقع: أي الموطنين فيه تنوع نباتي أكبر، الغابة الاستوائية أم الصحراء؟ ولماذا؟\n   الإجابة النموذجية: الغابة الاستوائية؛ لوفرة الماء والحرارة المناسبة لنمو نباتات كثيرة.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] اذكر مفترسين من السافانا.\n   الإجابة النموذجية: الأسد والفهد (أو النمر والضبع).\n5. [مستوى التطبيق] ما الحيوانات التي تتغذى على الحيوانات الميتة؟\n   الإجابة النموذجية: النسور.\n6. [مستوى الاستدلال] ماذا سيحدث للعشب إذا ماتت فجأة كل المفترسات؟\n   الإجابة النموذجية: سيقل كثيرًا لأن أعداد آكلات العشب ستزداد وتأكله.\n\nالحصة 2: السلاسل الغذائية في المحيط\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ارسم سلسلة غذائية بحرية تنتهي بالإنسان.\n   الإجابة النموذجية: عوالق ← قشريات ← إنسان (أو عوالق ← سردين ← إنسان).\n2. [مستوى التطبيق] لماذا تُعد المواطن البحرية مهمة جدًا؟\n   الإجابة النموذجية: لأنها تغطي نحو ثلاثة أرباع سطح الأرض وتضم أنواعًا كثيرة من الكائنات.\n3. [مستوى الاستدلال] ماذا تتوقع أن يحدث للأسماك إذا قلّت العوالق بسبب التلوث؟\n   الإجابة النموذجية: تقل أعداد الأسماك الصغيرة ثم الأسماك الكبيرة والطيور التي تتغذى عليها.\n\nالحصة 3: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر حيوانًا صحراويًا يتغذى على النباتات.\n   الإجابة النموذجية: الظبي أو النملة أو الخنفساء أو اليرقة.\n2. [مستوى التطبيق] ما المفترس الأعلى في السلسلة: نباتات ← خنفساء ← فأر ← بومة؟\n   الإجابة النموذجية: البومة.\n3. [مستوى الاستدلال] لماذا تكون أعداد الكائنات في الصحراء أقل منها في الغابة الاستوائية؟\n   الإجابة النموذجية: لقلة الماء والنباتات المنتجة فلا يكفي الغذاء لأعداد كبيرة.\n\nالحصة 4: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر موطنين ومنتجًا في كل منهما.\n   الإجابة النموذجية: السافانا: العشب؛ المحيط: العوالق (أو الصحراء: النباتات الصحراوية).\n2. [مستوى التطبيق] لماذا تختلف السلاسل الغذائية من موطن لآخر؟\n   الإجابة النموذجية: لأن المواطن المختلفة تضم نباتات وحيوانات مختلفة.\n3. [مستوى الاستدلال] اقترح تحسينًا للوحة إحدى المجموعات مع التعليل.\n   الإجابة النموذجية: تقبل المقترحات المعللة مثل إضافة سهم صحيح أو مفترس أعلى أو عنوان.", "الحصة 1: تنوع المواطن الطبيعية على كوكب الأرض\nللطالب: قراءة كتاب الطالب ص 40 وجمع صور لثلاثة مواطن مختلفة. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور للمواطن الطبيعية في عُمان.\nللطالب: رسم سلسلتين غذائيتين من السافانا في الدفتر ومراجعة ص 40–41. لولي الأمر: يُرجى مناقشة الابن في سبب وجود المفترسات الكبيرة في أقفاص بحدائق الحيوان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12\n\nالحصة 2: السلاسل الغذائية في المحيط\nللطالب: كتابة سلسلتين غذائيتين بحريتين من بحر عُمان. لولي الأمر: يُرجى توعية الابن بعدم رمي المخلفات على الشواطئ.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12\n\nالحصة 3: سلاسل غذائية في موطن الصحراء (تمرين 2-4)\nللطالب: إكمال تمرين 2-4 في كتاب النشاط ص 29–30 واجبًا منزليًا. لولي الأمر: يُرجى الحديث مع الابن عن حيوانات الصحراء العُمانية مثل المها العربية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12\n\nالحصة 4: مشروع مقارنة المواطن: لوحة السلاسل الغذائية\nللطالب: مراجعة كتاب الطالب ص 40–41 والاستعداد لدرس إزالة الغابات. لولي الأمر: يُرجى مساعدة الابن على جمع معلومات عن غابات العالم وأهميتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=12"]}, {"id": "2-5", "title": "إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 42–43 | كتاب النشاط ص 31، 64–66 | دليل المعلم ص 54–57", "n": 2, "per": [{"h": {"lesson": "2-5 إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 42–43 | دليل المعلم ص 55–56", "num": "الحصة الأولى من 2", "focus": "أسباب إزالة الغابات وآثارها السلبية"}, "f": ["1. يذكر أسباب إزالة الغابات (10 دقائق)\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء (15 دقيقة)\nمخرج تعليمي آخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري (15 دقيقة)", "1. يذكر أسباب إزالة الغابات. ← تذكر\n2. يشرح الآثار السلبية لإزالة الغابات على التربة والكائنات الحية والهواء. ← فهم\nالمخرج الآخر: يوضح العلاقة بين إزالة الغابات والاحتباس الحراري. ← تحليل", "- التعلم بالاكتشاف\n- الخرائط الذهنية والمفاهيمية\n- فكّر – زاوج – شارك", "- الكتاب\n- السبورة الذكية\n- الوسائل المتعددة (سمعية - بصرية)\n- نماذج مجسمة\n- أخرى: مجسم الكرة الأرضية", "- إزالة الغابات\n- الاحتباس الحراري\n- غازات الدفيئة\n- السماد العضوي\n- خصوبة التربة", "يعرض المعلم عبارة: «تُقطع من الغابات المطيرة مساحة ملعب كرة قدم كل ثانية!» ويسأل: لماذا يقطع الناس الأشجار؟ (5 دقائق)", "1. أين الغابات الاستوائية؟: يحدد المعلم على المجسم: الأمازون، الكونغو، إندونيسيا، والطلبة يحددون المواقع ويقارنونها بموقع عُمان (6 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n2. الأسباب والآثار: يشرح المعلم ص 42: الخشب للأثاث والوقود، إخلاء الأرض للزراعة والسكن والصناعة؛ الآثار: فقر التربة، اختفاء الأنواع، زيادة ثاني أكسيد الكربون، والطلبة يكملون خريطة مفاهيمية: أسباب ← إزالة الغابات ← آثار (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. غازات الدفيئة والاحتباس الحراري: يشرح المعلم بتشبيه البيت الزجاجي كيف تحبس الغازات الحرارة، ودور الأشجار في امتصاص ثاني أكسيد الكربون، والطلبة يجيبون عن السؤالين 1 و4 ص 43 (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أسباب لإزالة الغابات.\n   الإجابة النموذجية: جمع الخشب لصناعة الأثاث، أو لحرقه، وإخلاء الأرض للزراعة أو السكن أو الصناعة.\n2. [مستوى التطبيق] ماذا يحدث للتربة بعد إزالة الغابة؟\n   الإجابة النموذجية: تصبح غير خصبة لعدم وجود أوراق متحللة تصنع السماد العضوي.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد في الهواء ويحبس الحرارة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإزالة الغابات؟\n   الإجابة النموذجية: قطع أشجار الغابات وتدميرها بواسطة الإنسان.\n2. [مستوى التطبيق] ماذا سيحدث لثاني أكسيد الكربون والأكسجين في الهواء إذا دُمرت كل الغابات؟\n   الإجابة النموذجية: سيزداد ثاني أكسيد الكربون ويقل الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعد شراء الأثاث الخشبي المستعمل طريقة جيدة للحفاظ على الغابات؟\n   الإجابة النموذجية: لأنه إعادة استخدام للخشب فلا نحتاج إلى قطع أشجار جديدة.", "للطالب: حل تمرين 2-5 في كتاب النشاط ص 31 (آراء حول إزالة الغابات) واجبًا منزليًا. لولي الأمر: يُرجى المشاركة مع الابن في زراعة شجرة أو الاعتناء بنبتة في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}, {"h": {"lesson": "2-5 إزالة الغابات", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 43 | كتاب النشاط ص 31، 64–66 | دليل المعلم ص 56–57", "num": "الحصة الثانية من 2", "focus": "أهمية الغابات وجهود حمايتها"}, "f": ["1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن) (10 دقائق)\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة (15 دقيقة)\nمخرج تعليمي آخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا (15 دقيقة)", "1. يوضح أهمية الغابات للكائنات الحية والإنسان (الأدوية، الأكسجين، المواطن). ← فهم\n2. يصف جهودًا عالمية ومحلية لحماية البيئة مثل جائزة السلطان قابوس لحماية البيئة. ← فهم\nالمخرج الآخر: يميز الآراء المؤيدة والمعارضة لإزالة الغابات ويبدي رأيًا معللًا. ← تقييم", "- التعلم التشاركي\n- التعلم التعاوني\n- التعلم الذاتي\n- الخرائط الذهنية والمفاهيمية", "- الكتاب\n- السبورة الذكية\n- عروض تقديمية\n- أخرى: أوراق العمل 2-5أ و2-5ب و2-5ج", "- رئة الأرض\n- التنوع الحيوي\n- جائزة السلطان قابوس لحماية البيئة\n- زراعة الأشجار", "يطرح المعلم سؤال «تحدّث عن» ص 43: لماذا تُسمى الغابات «رئة كوكب الأرض»؟ ويربطه بعمل الرئتين. (5 دقائق)", "1. لماذا الغابات مهمة؟: يعرض المعلم معلومات ص 43: آلاف الأنواع، أدوية من النباتات، الأكسجين، والطلبة يكتبون ثلاثة أسباب لأهمية الغابات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. أوراق العمل حسب المستوى: يوزع المعلم: 2-5أ (وانجاري ماثاي) للمستوى المرتفع، 2-5ب (جائزة السلطان قابوس) للدعم، 2-5ج (خرائط مفاهيمية) للجميع، والطلبة يقرؤون ويجيبون ويكملون الخريطة المفاهيمية (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-5: مؤيد أم معارض؟: يناقش المعلم تصنيف الآراء في تمرين 2-5 (ص 31) ونشاط زراعة شجرة، والطلبة يصنفون الآراء ويبدون رأيًا معللًا (5 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – أشجار عمان أمانة: تناقش المجموعات أثر قطع الأشجار في عمان كالغاف والسمر على الحيوانات والتربة، وتقترح حملة تشجير مدرسية بشعار (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\n1. [مستوى الم  المعلم بتشبيه البيت الزجاجي كيف تحبس الغازات الحرارة، ودور الأشجار في امتصاص ثاني أكسيد الكربون، والطلبة يجيبون عن السؤالين 1 و4 ص 43 (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: أهمية الغابات وجهود حمايتها — زمن الحصة 40 دقيقة\n\n1. لماذا الغابات مهمة؟: يعرض المعلم معلومات ص 43: آلاف الأنواع، أدوية من النباتات، الأكسجين، والطلبة يكتبون ثلاثة أسباب لأهمية الغابات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أوراق العمل حسب المستوى: يوزع المعلم: 2-5أ (وانجاري ماثاي) للمستوى المرتفع، 2-5ب (جائزة السلطان قابوس) للدعم، 2-5ج (خرائط مفاهيمية) للجميع، والطلبة يقرؤون ويجيبون ويكملون الخريطة المفاهيمية (8 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. تمرين 2-5: مؤيد أم معارض؟: يناقش المعلم تصنيف الآراء في تمرين 2-5 (ص 31) ونشاط زراعة شجرة، والطلبة يصنفون الآراء ويبدون رأيًا معللًا (5 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n5. غلق الدرس – أشجار عمان أمانة: تناقش المجموعات أثر قطع الأشجار في عمان كالغاف والسمر على الحيوانات والتربة، وتقترح حملة تشجير مدرسية بشعار (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر ثلاثة أسباب لإزالة الغابات.\n   الإجابة النموذجية: جمع الخشب لصناعة الأثاث، أو لحرقه، وإخلاء الأرض للزراعة أو السكن أو الصناعة.\n2. [مستوى التطبيق] ماذا يحدث للتربة بعد إزالة الغابة؟\n   الإجابة النموذجية: تصبح غير خصبة لعدم وجود أوراق متحللة تصنع السماد العضوي.\n3. [مستوى الاستدلال] كيف تسهم إزالة الغابات في الاحتباس الحراري؟\n   الإجابة النموذجية: تقل الأشجار التي تمتص ثاني أكسيد الكربون فيزداد في الهواء ويحبس الحرارة.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] لماذا تُسمى الغابات رئة الأرض؟\n   الإجابة النموذجية: لأنها تمتص ثاني أكسيد الكربون وتنتج الأكسجين الذي تحتاجه الكائنات.\n2. [مستوى التطبيق] ما الذي قامت به وانجاري ماثاي؟\n   الإجابة النموذجية: شجعت النساء على زراعة الأشجار في كينيا فزرعن ملايين الأشجار، ونالت جائزة نوبل للسلام.\n3. [مستوى الاستدلال] صنّف: «مزارع قهوة» و«طبيبة»، من المؤيد ومن المعارض لإزالة الغابات؟ وعلل.\n   الإجابة النموذجية: مزارع القهوة مؤيد (يحتاج أرضًا للزراعة)، والطبيبة معارضة (الغابات مصدر للأدوية).", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإزالة الغابات؟\n   الإجابة النموذجية: قطع أشجار الغابات وتدميرها بواسطة الإنسان.\n2. [مستوى التطبيق] ماذا سيحدث لثاني أكسيد الكربون والأكسجين في الهواء إذا دُمرت كل الغابات؟\n   الإجابة النموذجية: سيزداد ثاني أكسيد الكربون ويقل الأكسجين.\n3. [مستوى الاستدلال] لماذا يُعد شراء الأثاث الخشبي المستعمل طريقة جيدة للحفاظ على الغابات؟\n   الإجابة النموذجية: لأنه إعادة استخدام للخشب فلا نحتاج إلى قطع أشجار جديدة.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر فائدتين للغابات.\n   الإجابة النموذجية: إنتاج الأكسجين وامتصاص ثاني أكسيد الكربون، ومواطن للكائنات، ومصدر للأدوية.\n2. [مستوى التطبيق] ما الجائزة العُمانية العالمية التي تُمنح لجهود حماية البيئة؟\n   الإجابة النموذجية: جائزة السلطان قابوس لحماية البيئة.\n3. [مستوى الاستدلال] اقترح ثلاث طرق يمكن لأسرتك المساهمة بها في حماية الغابات.\n   الإجابة النموذجية: زراعة الأشجار، شراء أثاث مستعمل، تقليل استهلاك الورق وإعادة تدويره.", "الحصة 1: أسباب إزالة الغابات وآثارها السلبية\nللطالب: حل تمرين 2-5 في كتاب النشاط ص 31 (آراء حول إزالة الغابات) واجبًا منزليًا. لولي الأمر: يُرجى المشاركة مع الابن في زراعة شجرة أو الاعتناء بنبتة في المنزل.\n\nالحصة 2: أهمية الغابات وجهود حمايتها\nللطالب: إكمال ورقة العمل المختارة (ص 64–66) والمشاركة في زراعة شجرة (نشاط 2-5) إن أمكن. لولي الأمر: يُرجى المشاركة مع الابن في يوم الشجرة وتشجيعه على الزراعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=13"]}, {"id": "2-6", "title": "تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 44–45 | كتاب النشاط ص 32، 67–68 | دليل المعلم ص 57–59", "n": 2, "per": [{"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 44 | دليل المعلم ص 57–59", "num": "الحصة الأولى من 3", "focus": "مكونات الغلاف الجوي وملوثات الهواء ومصادرها"}, "f": ["1. يذكر الغازات الأساسية المكونة للغلاف الجوي (5 دقائق)\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة (5 دقائق)\n3. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة (5 دقائق)\n4. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية (5 دقائق)\n\nمخرج تعليمي آخر:\nيقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء (10 دقائق)\nيختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا (10 دقائق)", "1. يذكر الغازات الأساسية المكونة للغلاف الجوي. ← تذكر\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة. ← فهم\n3. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة. ← تطبيق\n4. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية. ← تحليل\nالمخرج الآخر: يقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء. ← تحليل\nالمخرج الآخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا. ← تقييم", "- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n- الخرائط الذهنية والمفاهيمية\n- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- السبورة التقليدية\n- أخرى: شرائح زجاجية، فازلين، قلم تخطيط، شريط لاصق، عدسة مكبرة، ورقة العمل 2-6أ", "- الغلاف الجوي\n- تلوث الهواء\n- أول أكسيد الكربون\n- ثاني أكسيد الكبريت\n- الالتهاب الشعبي\n- الربو\n- جزيئات الغبار\n- التنبؤ\n- الاختبار العادل\n- العينة", "يسأل المعلم: هل تعتقد أن الهواء في منطقتنا نقي؟ متى ترى دخانًا أو تشم رائحة عوادم؟ ويعرض صورة لضباب دخاني فوق مدينة. (5 دقائق)", "1. مكونات الهواء والملوثات: يشرح المعلم ص 44: النيتروجين والأكسجين وقليل من ثاني أكسيد الكربون وبخار الماء؛ أول أكسيد الكربون من العوادم، أكاسيد الكبريت من المصانع ومحطات الكهرباء، والطلبة يكملون جدول: الملوث – مصدره – ضرره (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n2. أضرار التلوث: يناقش المعلم آثاره على النباتات والحيوانات وصحة الإنسان (الالتهاب الشعبي، الربو) مع مراعاة الطلبة المصابين بالربو، والطلبة يكتبون ثلاثة أضرار ويجيبون عن «تحدّث عن» ص 45 (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مصادر الطاقة: يقارن المعلم: الفحم والنفط تلوث، والرياح والشمس والماء لا تلوث لكنها أكثر تكلفة لبعض الدول؛ ويذكر محطات الطاقة الشمسية في عُمان، والطلبة يصنفون مصادر الطاقة في عمودين (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تجهيز الشرائح: يوضح المعلم الخطوات ص 45: ترقيم 5 شرائح، رسم مربع 2 cm × 2 cm، دهن الفازلين، والطلبة يجهزون الشرائح بعناية في مجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. اختيار المواقع والتنبؤ: يناقش المعلم اختيار مواقع لا تتحرك فيها الشرائح (أعمدة، نوافذ، جذوع أشجار) قرب طريق وفي مكان هادئ، والطلبة يختارون 5 مواقع ويكتبون تنبؤاتهم مع الأسباب في جدول ورقة العمل 2-6أ (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. وضع الشرائح: يرافق المجموعات لتثبيت الشرائح في فناء المدرسة، والطلبة يثبتون الشرائح ويسجلون مواقعها (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان الأساسيان في الغلاف الجوي؟\n   الإجابة النموذجية: النيتروجين والأكسجين.\n2. [مستوى التطبيق] ما مصدر غاز أول أكسيد الكربون السام؟\n   الإجابة النموذجية: عوادم السيارات والدراجات النارية.\n3. [مستوى الاستدلال] لماذا تلوث السيارات الجديدة أقل من القديمة؟\n   الإجابة النموذجية: لأنها مزودة بجهاز يحول غازات العادم الضارة إلى ثاني أكسيد الكربون.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] لماذا ندهن الشرائح بالفازلين؟\n   الإجابة النموذجية: لكي تلتصق بها جزيئات الغبار الموجودة في الهواء.\n5. [مستوى التطبيق] لماذا نرسم مربعًا بالمساحة نفسها على كل شريحة؟\n   الإجابة النموذجية: لنقارن عدد الجزيئات في المساحة نفسها فيكون الاختبار عادلًا.\n6. [مستوى الاستدلال] أي المواقع تتنبأ أنه سيكون أكثر تلوثًا؟ ولماذا؟\n   الإجابة النموذجية: قرب الطريق المزدحم أو مصنع؛ بسبب العوادم والغبار المتطاير.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مرضين يصيبان الإنسان في المناطق الملوثة.\n   الإجابة النموذجية: الالتهاب الشعبي والربو.\n2. [مستوى التطبيق] أي مصادر الطاقة لا تلوث الهواء؟\n   الإجابة النموذجية: طاقة الرياح والطاقة الشمسية والطاقة المائية.\n3. [مستوى الاستدلال] اقترح طريقتين لتقليل تلوث الهواء في المدن.\n   الإجابة النموذجية: استخدام وسائل النقل العام، الطاقة الشمسية، زراعة الأشجار، صيانة السيارات (تقبل المقترحات المنطقية).\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] كم يومًا تُترك الشرائح؟\n   الإجابة النموذجية: أسبوعًا.\n5. [مستوى التطبيق] ما الأداة التي سنستخدمها لفحص الشرائح؟\n   الإجابة النموذجية: العدسة المكبرة.\n6. [مستوى الاستدلال] هل يقيس هذا النشاط كل أنواع تلوث الهواء؟ وضح.\n   الإجابة النموذجية: لا؛ يقيس جزيئات الغبار فقط، أما الغازات فجزيئاتها صغيرة جدًا لا تُرى ولا تُعد.", "للطالب: قراءة كتاب الطالب ص 44 وملاحظة مصادر تلوث الهواء في الحي. لولي الأمر: يُرجى تجنب تشغيل السيارة دون حاجة قرب المنزل والمدرسة.\nللطالب: تسجيل التنبؤات في ورقة العمل 2-6أ (كتاب النشاط ص 67) والعودة إلى الشرائح بعد أسبوع. تُستخدم في الحصة القادمة شرائح جهزها المعلم مسبقًا. لولي الأمر: يُرجى تشجيع الابن على متابعة استقصائه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"h": {"lesson": "2-6 تلوث الهواء", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع الثامن (25–29/10/2026)", "pages": "كتاب الطالب ص 45 | كتاب النشاط ص 32، 67–68 | دليل المعلم ص 58–59", "num": "الحصة الثالثة من 3", "focus": "تحليل نتائج الغبار وتمثيلها بالأعمدة"}, "f": ["1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة (15 دقيقة)\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط (5 دقائق)\n\nمخرج تعليمي آخر: يكتب نشرة معلومات عن تلوث الماء أو التربة (20 دقيقة)", "1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة. ← تطبيق\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط. ← تقييم\nالمخرج الآخر: يكتب نشرة معلومات عن تلوث الماء أو التربة. ← إبداع", "- الاستقصاء العلمي\n- التعلم التعاوني\n- التعلم الذاتي\n- التعلم المبني على المشاريع", "- الكتاب\n- الأقلام\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شرائح معدة مسبقًا، عدسات مكبرة، ورقتا العمل 2-6أ و2-6ب", "- التمثيل البياني بالأعمدة\n- النمط\n- الدليل\n- تلوث الماء\n- تلوث التربة", "يعرض المعلم شريحتين معدتين مسبقًا (إحداهما من قرب الطريق) ويسأل: أي الشريحتين من قرب الشارع؟ كيف عرفت؟ (5 دقائق)", "1. العدّ والتسجيل: يوزع المعلم الشرائح المعدة ويوضح طريقة تقدير العدد داخل المربع، والطلبة يعدون الجزيئات بالعدسة ويسجلونها في ورقة العمل 2-6أ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 2-6ب والأسئلة 1–3: يوجه المعلم التمثيل بالأعمدة ومقارنة النتائج بين المجموعات، والطلبة يرسمون الأعمدة ويحددون الموقع الأكثر تلوثًا ويقارنونه بتنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-6 والسؤال 4: يوجه المعلم تحليل بيانات تلوث المدن الكبرى (تمرين 2-6 ص 32)، ويوزع مهمة نشرة معلومات عن تلوث الماء أو التربة، والطلبة يحللون البيانات ويخططون للنشرة (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – هواء مسقط النقي: تقترح المجموعات طرقًا للحد من تلوث الهواء في المدن العمانية، كالمشاركة في السيارات واستخدام الطاقة الشمسية، وتصوغ شعارًا (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الموقع الذي ظهرت فيه أكبر كمية من الغبار؟ ولماذا؟\n   الإجابة النموذجية: غالبًا قرب الطريق المزدحم بسبب حركة السيارات وعوادمها.\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستشهاد بعدد الجزيئات في المواقع.\n3. [مستوى الاستدلال] اقترح سببًا لموقع لم يطابق النمط المتوقع.\n   الإجابة النموذجية: الرياح، أو المطر، أو لمس الشريحة، أو خطأ في العدّ.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفائدة من تمثيل النتائج بالأعمدة؟\n   الإجابة النموذجية: تسهيل المقارنة بين المواقع ورؤية النمط بسرعة.\n2. [مستوى التطبيق] لماذا نقارن نتائجنا مع نتائج المجموعات الأخرى؟\n   الإجابة النموذجية: للتأكد من النمط وزيادة موثوقية النتائج.\n3. [مستوى الاستدلال] اكتب فكرتين لنشرة توعوية عن تلوث الماء.\n   الإجابة النموذجية: عدم رمي النفايات في البحر والأودية، وعدم صب الزيوت في المصارف (تقبل الأفكار الصحيحة).", "للطالب: حل تمرين 2-6 (كتاب النشاط ص 32)، وإكمال نشرة المعلومات عن تلوث الماء أو التربة لعرضها. لولي الأمر: يُرجى مساعدة الابن في جمع صور ومعلومات للنشرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}], "comb": ["الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n1. يذكر الغازات الأساسية المكونة للغلاف الجوي (5 دقائق)\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة (5 دقائق)\n3. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة (5 دقائق)\n4. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية (5 دقائق)\n\nمخرج تعليمي آخر:\nيقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء (10 دقائق)\nيختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا (10 دقائق)\n\nالحصة 2: تحليل نتائج الغبار وتمثيلها بالأعمدة\n1. يعد جزيئات الغبار على الشرائح ويمثل النتائج بالأعمدة (15 دقيقة)\n2. يحدد ما إذا كانت النتائج تدعم تنبؤاته ويفسر المواقع غير الملائمة للنمط (5 دقائق)\n\nمخرج تعليمي آخر: يكتب نشرة معلومات عن تلوث الماء أو التربة (20 دقيقة)", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\n1. يذكر الغازات الأساسية المكونة للغلاف الجوي. ← تذكر\n2. يصف مصادر تلوث الهواء وآثاره على صحة الإنسان والبيئة. ← فهم\n3. يجهز شرائح لقياس جزيئات الغبار باتباع خطوات النشاط بدقة. ← تطبيق\n4. يتنبأ بالمواقع الأكثر تلوثًا ويعلل تنبؤاته بالمعرفة العلمية. ← تحليل\nالمخرج الآخر: يقارن بين مصادر الطاقة الملوثة وغير الملوثة للهواء. ← تحليل\nالمخرج الآخر: يختار مواقع مناسبة لوضع الشرائح تضمن اختبارًا عادلًا. ← تقييم\n\nالحصة 2: تحليل نتائج الغبار وتمثيلها بالأعمدة\n1. يعد جزيئات ا رار التلوث: يناقش المعلم آثاره على النباتات والحيوانات وصحة الإنسان (الالتهاب الشعبي، الربو) مع مراعاة الطلبة المصابين بالربو، والطلبة يكتبون ثلاثة أضرار ويجيبون عن «تحدّث عن» ص 45 (4 دقائق)\nالاستراتيجيات: الخرائط الذهنية والمفاهيمية.\n\n3. مصادر الطاقة: يقارن المعلم: الفحم والنفط تلوث، والرياح والشمس والماء لا تلوث لكنها أكثر تكلفة لبعض الدول؛ ويذكر محطات الطاقة الشمسية في عُمان، والطلبة يصنفون مصادر الطاقة في عمودين (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تجهيز الشرائح: يوضح المعلم الخطوات ص 45: ترقيم 5 شرائح، رسم مربع 2 cm × 2 cm، دهن الفازلين، والطلبة يجهزون الشرائح بعناية في مجموعات (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. اختيار المواقع والتنبؤ: يناقش المعلم اختيار مواقع لا تتحرك فيها الشرائح (أعمدة، نوافذ، جذوع أشجار) قرب طريق وفي مكان هادئ، والطلبة يختارون 5 مواقع ويكتبون تنبؤاتهم مع الأسباب في جدول ورقة العمل 2-6أ (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. وضع الشرائح: يرافق المجموعات لتثبيت الشرائح في فناء المدرسة، والطلبة يثبتون الشرائح ويسجلون مواقعها (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n7. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: تحليل نتائج الغبار وتمثيلها بالأعمدة — زمن الحصة 40 دقيقة\n1. العدّ والتسجيل: يوزع المعلم الشرائح المعدة ويوضح طريقة تقدير العدد داخل المربع، والطلبة يعدون الجزيئات بالعدسة ويسجلونها في ورقة العمل 2-6أ (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. ورقة العمل 2-6ب والأسئلة 1–3: يوجه المعلم التمثيل بالأعمدة ومقارنة النتائج بين المجموعات، والطلبة يرسمون الأعمدة ويحددون الموقع الأكثر تلوثًا ويقارنونه بتنبؤاتهم (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-6 والسؤال 4: يوجه المعلم تحليل بيانات تلوث المدن الكبرى (تمرين 2-6 ص 32)، ويوزع مهمة نشرة معلومات عن تلوث الماء أو التربة، والطلبة يحللون البيانات ويخططون للنشرة (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – هواء مسقط النقي: تقترح المجموعات طرقًا للحد من تلوث الهواء في المدن العمانية، كالمشاركة في السيارات واستخدام الطاقة الشمسية، وتصوغ شعارًا (5 دقائق)\nالاستراتيجيات: العصف الذهني.", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان الأساسيان في الغلاف الجوي؟\n   الإجابة النموذجية: النيتروجين والأكسجين.\n2. [مستوى التطبيق] ما مصدر غاز أول أكسيد الكربون السام؟\n   الإجابة النموذجية: عوادم السيارات والدراجات النارية.\n3. [مستوى الاستدلال] لماذا تلوث السيارات الجديدة أقل من القديمة؟\n   الإجابة النموذجية: لأنها مزودة بجهاز يحول غازات العادم الضارة إلى ثاني أكسيد الكربون.\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] لماذا ندهن الشرائح بالفازلين؟\n   الإجابة النموذجية: لكي تلتصق بها جزيئات الغبار الموجودة في الهواء.\n5. [مستوى التطبيق] لماذا نرسم مربعًا بالمساحة نفسها على كل شريحة؟\n   الإجابة النموذجية: لنقارن عدد الجزيئات في المساحة نفسها فيكون الاختبار عادلًا.\n6. [مستوى الاستدلال] أي المواقع تتنبأ أنه سيكون أكثر تلوثًا؟ ولماذا؟\n   الإجابة النموذجية: قرب الطريق المزدحم أو مصنع؛ بسبب العوادم والغبار المتطاير.\n\nالحصة 2: تحليل نتائج الغبار وتمثيلها بالأعمدة\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الموقع الذي ظهرت فيه أكبر كمية من الغبار؟ ولماذا؟\n   الإجابة النموذجية: غالبًا قرب الطريق المزدحم بسبب حركة السيارات وعوادمها.\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستشهاد بعدد الجزيئات في المواقع.\n3. [مستوى الاستدلال] اقترح سببًا لموقع لم يطابق النمط المتوقع.\n   الإجابة النموذجية: الرياح، أو المطر، أو لمس الشريحة، أو خطأ في العدّ.", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مرضين يصيبان الإنسان في المناطق الملوثة.\n   الإجابة النموذجية: الالتهاب الشعبي والربو.\n2. [مستوى التطبيق] أي مصادر الطاقة لا تلوث الهواء؟\n   الإجابة النموذجية: طاقة الرياح والطاقة الشمسية والطاقة المائية.\n3. [مستوى الاستدلال] اقترح طريقتين لتقليل تلوث الهواء في المدن.\n   الإجابة النموذجية: استخدام وسائل النقل العام، الطاقة الشمسية، زراعة الأشجار، صيانة السيارات (تقبل المقترحات المنطقية).\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] كم يومًا تُترك الشرائح؟\n   الإجابة النموذجية: أسبوعًا.\n5. [مستوى التطبيق] ما الأداة التي سنستخدمها لفحص الشرائح؟\n   الإجابة النموذجية: العدسة المكبرة.\n6. [مستوى الاستدلال] هل يقيس هذا النشاط كل أنواع تلوث الهواء؟ وضح.\n   الإجابة النموذجية: لا؛ يقيس جزيئات الغبار فقط، أما الغازات فجزيئاتها صغيرة جدًا لا تُرى ولا تُعد.\n\nالحصة 2: تحليل نتائج الغبار وتمثيلها بالأعمدة\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما الفائدة من تمثيل النتائج بالأعمدة؟\n   الإجابة النموذجية: تسهيل المقارنة بين المواقع ورؤية النمط بسرعة.\n2. [مستوى التطبيق] لماذا نقارن نتائجنا مع نتائج المجموعات الأخرى؟\n   الإجابة النموذجية: للتأكد من النمط وزيادة موثوقية النتائج.\n3. [مستوى الاستدلال] اكتب فكرتين لنشرة توعوية عن تلوث الماء.\n   الإجابة النموذجية: عدم رمي النفايات في البحر والأودية، وعدم صب الزيوت في المصارف (تقبل الأفكار الصحيحة).", "الحصة 1: مكونات الغلاف الجوي وملوثات الهواء ومصادرها\nللطالب: قراءة كتاب الطالب ص 44 وملاحظة مصادر تلوث الهواء في الحي. لولي الأمر: يُرجى تجنب تشغيل السيارة دون حاجة قرب المنزل والمدرسة.\nللطالب: تسجيل التنبؤات في ورقة العمل 2-6أ (كتاب النشاط ص 67) والعودة إلى الشرائح بعد أسبوع. تُستخدم في الحصة القادمة شرائح جهزها المعلم مسبقًا. لولي الأمر: يُرجى تشجيع الابن على متابعة استقصائه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14\n\nالحصة 2: تحليل نتائج الغبار وتمثيلها بالأعمدة\nللطالب: حل تمرين 2-6 (كتاب النشاط ص 32)، وإكمال نشرة المعلومات عن تلوث الماء أو التربة لعرضها. لولي الأمر: يُرجى مساعدة الابن في جمع صور ومعلومات للنشرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=14"]}, {"id": "2-7", "title": "الأمطار الحمضية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 46–47 | كتاب النشاط ص 33، 69 | دليل المعلم ص 59–60", "n": 2, "per": [{"h": {"les يتروجين.\n2. [مستوى التطبيق] ماذا حدث للطباشير عند سكب الخل عليه؟\n   الإجابة النموذجية: ظهرت رغوة وتآكل جزء منه.\n3. [مستوى الاستدلال] لماذا استخدمنا الخل لتمثيل الأمطار الحمضية؟\n   الإجابة النموذجية: لأن الخل حمض ضعيف يشبه الأمطار الحمضية.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما مصدر الغازات المسببة للأمطار الحمضية؟\n   الإجابة النموذجية: حرق الفحم والنفط والغاز الطبيعي.\n2. [مستوى التطبيق] أي أنواع الحجارة يتضرر أكثر بالأمطار الحمضية؟\n   الإجابة النموذجية: الحجر الجيري والرخام.\n3. [مستوى الاستدلال] اقترح طريقتين لحماية المباني التاريخية من الأمطار الحمضية.\n   الإجابة النموذجية: تقليل حرق الوقود، طلاء الأسطح بمواد واقية، استخدام الطاقة النظيفة.", "للطالب: كتابة تقرير من صفحة واحدة عن أضرار الأمطار الحمضية على المباني (السؤال 4 ص 47). المعلم يُعد شتلتين للنشاط 2-7 قبل الحصة القادمة بثلاثة أيام. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور لمبانٍ تأثرت بالأمطار الحمضية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}, {"h": {"lesson": "2-7 الأمطار الحمضية", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 46–47 | كتاب النشاط ص 33 | دليل المعلم ص 59–60", "num": "الحصة الثانية من 2", "focus": "أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)"}, "f": ["1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون (10 دقائق)\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية (10 دقائق)\nمخرج تعليمي آخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية (20 دقيقة)", "1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون. ← تحليل\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية. ← فهم\nالمخرج الآخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية. ← تطبيق", "- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلتان: الأولى تُروى بماء الصنبور والثانية بعصير الليمون منذ ثلاثة ذى عليها.", "للطالب: حل تمرين 2-7 في كتاب النشاط ص 33 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في أهمية تقليل استخدام الوقود لحماية البيئة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}], "comb": ["الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1. يشرح كيف تتكون الأمطار الحمضية من غازات الوقود المحترق (15 دقيقة)\n2. يستنتج من تجربة عرض أثر الحمض على الحجر الجيري (10 دقائق)\nمخرج تعليمي آخر: يكتب تقريرًا قصيرًا عن أضرار الأمطار الحمضية على المباني (15 دقيقة)\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون (10 دقائق)\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية (10 دقائق)\nمخرج تعليمي آخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية (20 دقيقة)", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n1. يشرح كيف تتكون الأمطار الحمضية من غازات الوقود المحترق. ← فهم\n2. يستنتج من تجربة عرض أثر الحمض على الحجر الجيري. ← تحليل\nالمخرج الآخر: يكتب تقريرًا قصيرًا عن أضرار الأمطار الحمضية على المباني. ← إبداع\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n1. يقارن بين نبتة رُويت بماء الصنبور وأخرى رُويت بعصير الليمون. ← تحليل\n2. يفسر أثر الأمطار الحمضية على النباتات والحيوانات المائية. ← فهم\nالمخرج الآخر: يطبق فهمه على سلاسل غذائية في موطن ماء عذب متأثر بالأمطار الحمضية. ← تطبيق", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n- العرض العملي\n- التعلم بالاكتشاف\n- فكّر – زاوج – شارك\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n- الاستقصاء العلمي\n- التعلم بالاكتشاف\n- التعلم التعاوني", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: خل، حجر جيري أو طباشير، طبق، ورقة العمل 2-7\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n- الكتاب\n- صورة توضيحية\n- برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n- أخرى: شتلتان: الأولى تُروى بماء الصنبور والثانية بعصير الليمون منذ ثلاثة أيام", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\n- الأمطار الحمضية\n- أكاسيد الكبريت\n- أكاسيد النيتروجين\n- الحجر الجيري\n- الحمض\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\n- المغذيات\n- التربة\n- البحيرات\n- المقارنة\n- الدليل", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nيعرض المعلم قطعة طباشير ويسأل: ماذا تتوقع أن يحدث إذا سكبنا عليها خلًا؟ ثم يصبّ الخل أمام الطلبة. (5 دقائق)\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nيضع المعلم الشتلتين أمام الطلبة دون إخبارهم بأيهما سُقيت بالليمون، ويطلب منهم التخمين وتبريره. (5 دقائق)", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية — زمن الحصة 40 دقيقة\n\n1. كيف تتكون الأمطار الحمضية؟: يشرح المعلم بالشكل ص 46: حرق الفحم والنفط والغاز ← أكاسيد الكبريت والنيتروجين ← تتفاعل مع بخار الماء ← أحماض ← أمطار حمضية، والطلبة يرسمون مخططًا سهميًا للتكوّن (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الأثر على المباني: يربط المعلم التجربة بالمباني والتماثيل الحجرية والخرسانة، ويعرض صور الأضرار، والطلبة يجيبون عن «تحدّث عن» ص 47 (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. ورقة العمل 2-7 أو التقرير: يوزع المعلم ورقة العمل 2-7 (دراسة حالة) للمستوى المرتفع، ويوجه البقية لكتابة فقرة مدعومة بصور، والطلبة يقرؤون ويجيبون أو يكتبون الفقرة (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي ويطمئن الطلبة أن الأمطار الحمضية لا تذيب الجلد، والطلبة يجيبون فرديًا (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7) — زمن الحصة 40 دقيقة\n\n1. نشاط 2-7: المقارنة: يوجه المعلم الملاحظة الدقيقة للأوراق والسيقان والإجابة عن الأسئلة 1–3 ص 47، والطلبة يسجلون: أوراق الشتلة المسقية بالليمون ذابلة/صفراء وساقها ضعيفة (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. أثر الأمطار الحمضية على البيئة: يشرح المعلم ص 47: تزيل الأحماض المغذيات من التربة، تضعف النباتات وتتساقط أوراقها، وتتضرر الأشجار والبحيرات وحيواناتها، والطلبة يكملون مخطط أثر: تربة ← نبات ← حيوانات (4 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n3. تمرين 2-7: يوجه المعلم حل تمرين 2-7 (ص 33) عن موطن الماء العذب، والطلبة يرسمون السلاسل ويجيبون عن أسئلة الفهم (6 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. غلق الدرس – مطر نظيف لبلادي: تشرح الأزواج كيف تتكون الأمطار الحمضية، وتقترح طرقًا لحماية مزارع عمان وقلاعها الحجرية من أضرارها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما الغازان المسببان للأمطار الحمضية؟\n   الإجابة النموذجية: أكاسيد الكبريت وأكاسيد النيتروجين.\n2. [مستوى التطبيق] ماذا حدث للطباشير عند سكب الخل عليه؟\n   الإجابة النموذجية: ظهرت رغوة وتآكل جزء منه.\n3. [مستوى الاستدلال] لماذا استخدمنا الخل لتمثيل الأمطار الحمضية؟\n   الإجابة النموذجية: لأن الخل حمض ضعيف يشبه الأمطار الحمضية.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] صف أوراق الشتلة التي رُويت بعصير الليمون.\n   الإجابة النموذجية: ذابلة أو مصفرة أو بنية وقد تتساقط.\n2. [مستوى التطبيق] هل تدعم النتائج تنبؤك؟ وضح.\n   الإجابة النموذجية: نعم، توقعنا أن الحمض يضر بالنبتة وظهر عليها الضرر.\n3. [مستوى الاستدلال] كيف تضعف الأمطار الحمضية النباتات؟\n   الإجابة النموذجية: تزيل جزءًا من المغذيات من التربة فيضعف النبات ويبطؤ نموه.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] ما مصدر الغازات المسببة للأمطار الحمضية؟\n   الإجابة النموذجية: حرق الفحم والنفط والغاز الطبيعي.\n2. [مستوى التطبيق] أي أنواع الحجارة يتضرر أكثر بالأمطار الحمضية؟\n   الإجابة النموذجية: الحجر الجيري والرخام.\n3. [مستوى الاستدلال] اقترح طريقتين لحماية المباني التاريخية من الأمطار الحمضية.\n   الإجابة النموذجية: تقليل حرق الوقود، طلاء الأسطح بمواد واقية، استخدام الطاقة النظيفة.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا يُعد هذا اختبارًا عادلًا؟\n   الإجابة النموذجية: لأن الشتلتين متشابهتان ووضعتا في الظروف نفسها، والفرق الوحيد نوع السائل.\n2. [مستوى التطبيق] كيف تؤثر الأمطار الحمضية على حيوانات البحيرات؟\n   الإجابة النموذجية: تجعل الماء حمضيًا فتضر الأسماك والضفادع وقد تقتلها.\n3. [مستوى الاستدلال] فسّر كيف يمكن أن تتسبب الأمطار الحمضية في موت الضفادع.\n   الإجابة النموذجية: تجعل ماء البحيرة حمضيًا فيضر بالضفادع وبيضها، وتموت الحشرات التي تتغذى عليها.", "الحصة 1: تكوّن الأمطار الحمضية وأثرها على المباني الحجرية\nللطالب: كتابة تقرير من صفحة واحدة عن أضرار الأمطار الحمضية على المباني (السؤال 4 ص 47). المعلم يُعد شتلتين للنشاط 2-7 قبل الحصة القادمة بثلاثة أيام. لولي الأمر: يُرجى مساعدة الابن في البحث عن صور لمبانٍ تأثرت بالأمطار الحمضية.\n\nالحصة 2: أثر الأمطار الحمضية على النباتات والبيئة (نشاط 2-7)\nللطالب: حل تمرين 2-7 في كتاب النشاط ص 33 واجبًا منزليًا. لولي الأمر: يُرجى مناقشة الابن في أهمية تقليل استخدام الوقود لحماية البيئة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=15"]}, {"id": "2-8", "title": "إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 48–49 | كتاب النشاط ص 34، 70–71 | دليل المعلم ص 60–62", "n": 2, "per": [{"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 48 | دليل المعلم ص 60–62", "num": "الحصة الأولى من 3", "focus": "مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير"}, "f": ["1. يوضح المقصود بمرادم النفايات وإعادة التدوير (5 دقائق)\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها (10 دقائق)\n3. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة (10 دقائق)\n4. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير (5 دقائق)\n\nمخرج تعليمي آخر:\nيقترح طرقًا لاستخدام كمية أقل من الورق (5 دقائق)\nيقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها (5 دقائق)", "1. يوضح المقصود بمرادم النفايات وإعادة التدوير. ← فهم\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها. ← تطبيق\n3. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة. ← تطبيق\n4. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير. ← إبداع\nالمخرج الآخر: يقترح طرقًا لاستخدام كمية أقل من الورق. ← تطبيق\nالمخرج الآخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها. ← تقييم", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: نفايات نظيفة متنوعة على ورق جرائد: ورق، كرتون، كيس، زجاجة بلاستيكية وزجاجية، علبة، قشور خضار، علب معدنية وأوعية بلاستيكية نظيفة، أوراق ملونة، ورقة العمل 2-8أ\n- الأقلام\n- الوسائل الاجتماعية", "- التخلص من النفايات\n- مرادم النفايات\n- إعادة التدوير\n- إعادة الاستخدام\n- التقليل\n- الحملة التوعوية\n- المنتجات المغلفة", "يفرغ المعلم كيس نفايات نظيفة على ورق الجرائد ويرفع كل قطعة ويسأل: هل يمكن تقليل استخدامها؟ أو إعادة استخدامها؟ أو تدويرها؟ (5 دقائق)", "1. إلى أين تذهب نفاياتنا؟: يشرح المعلم ص 48: مرادم النفايات أكوام ضخمة بعيدة عن السكان تغطى بالتربة، ويعرض فكرة «مدينة المخلفات» في القاهرة، والطلبة يكتبون مشكلات المرادم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. فرز وتصنيف: يوزع المعلم على المجموعات قطعًا ويرسم جدولًا: تقليل – إعادة استخدام – إعادة تدوير، والطلبة يصنفون القطع ويعللون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. السؤال 1 ص 49: ورق أقل: يطرح المعلم السؤال ويجمع الأفكار، والطلبة يقترحون: الكتابة على الوجهين، الكتب الإلكترونية، المناديل القماشية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. ورقة العمل 2-8أ: إعادة استخدام العلب: يوزع المعلم ورقة العمل (كتاب النشاط ص 70) ويتابع التنفيذ مع مراعاة سلامة حواف العلب، والطلبة يصنعون حامل أقلام أو أصيص زرع من العلب والأوعية (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تمرين 2-8: يوجه المعلم إكمال جدول تمرين 2-8 (ص 34)، والطلبة يحددون لكل عنصر طريقة إعادة الاستخدام أو التدوير (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. ملصق الحملة (السؤال 4 ص 49): يحدد المعلم معايير الملصق: رسالة واضحة، صورة جاذبة، عبارة قصيرة، والطلبة يصممون الملصق ويعلقونه، ويقيّمون ملصقات زملائهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإعادة التدوير؟\n   الإجابة النموذجية: معالجة الأشياء بدل رميها لتصبح منتجًا جديدًا يمكن استخدامه.\n2. [مستوى التطبيق] ما مرادم النفايات؟\n   الإجابة النموذجية: أكوام ضخمة من القمامة في أماكن بعيدة عن السكان تغطى بالتربة لاحقًا.\n3. [مستوى الاستدلال] ما الفرق بين إعادة الاستخدام وإعادة التدوير؟ أعطِ مثالًا.\n   الإجابة النموذجية: إعادة الاستخدام: استعمال الشيء مرة أخرى كما هو (علبة كحامل أقلام)؛ التدوير: معالجته لصنع منتج جديد (صهر العلب لصنع علب جديدة).\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] اقترح طريقة لإعادة استخدام الأوعية البلاستيكية.\n   الإجابة النموذجية: لتخزين الأدوات أو زراعة النباتات أو حفظ الطعام.\n5. [مستوى التطبيق] أي المواد في تمرين 2-8 يمكن تحويلها إلى سماد؟\n   الإجابة النموذجية: قشور الفواكه والخضراوات ومخلفات الحدائق.\n6. [مستوى الاستدلال] ما الذي يجعل الملصق التوعوي ناجحًا؟\n   الإجابة النموذجية: رسالة واضحة قصيرة، صورة جاذبة، ألوان مناسبة، ودعوة لفعل محدد.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين يمكن إعادة تدويرهما.\n   الإجابة النموذجية: الورق، البلاستيك، الزجاج، العلب المعدنية.\n2. [مستوى التطبيق] اقترح طريقتين لاستخدام ورق أقل.\n   الإجابة النموذجية: الكتابة على وجهي الورقة، استخدام الأجهزة الإلكترونية، المناديل القماشية.\n3. [مستوى الاستدلال] لماذا يُعد تقليل النفايات أفضل من إعادة تدويرها؟\n   الإجابة النموذجية: لأنه يمنع إنتاج النفايات أصلًا ويوفر الطاقة والمواد المستخدمة في التدوير.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما فائدة إعادة الاستخدام للبيئة؟\n   الإجابة النموذجية: تقلل النفايات وتحافظ على المواد الطبيعية.\n5. [مستوى التطبيق] اكتب شعارًا قصيرًا لحملة إعادة التدوير.\n   الإجابة النموذجية: مثل: «لا ترمِ.. أعد التدوير!» (تقبل الشعارات المناسبة).\n6. [مستوى الاستدلال] كيف يمكنك وأسرتك إعادة التدوير في المنزل؟\n   الإجابة النموذجية: فرز النفايات، جمع العلب والورق في سلال خاصة، إعادة استخدام الأكياس والأوعية.", "للطالب: قراءة كتاب الطالب ص 48 وعدّ أكياس النفايات التي تخرجها الأسرة أسبوعيًا. لولي الأمر: يُرجى تخصيص سلة لفرز المواد القابلة للتدوير في المنزل.\nللطالب: حل تمرين 2-8 في كتاب النشاط ص 34 وإكمال الملصق، وإعداد قائمة بالمنتجات المغلفة القابلة للتدوير من البقالة. لولي الأمر: يُرجى اصطحاب الابن إلى البقالة وتشجيعه على إعداد القائمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"h": {"lesson": "2-8 إعادة التدوير", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع التاسع (1–5/11/2026)", "pages": "كتاب الطالب ص 49 | كتاب النشاط ص 71 | دليل المعلم ص 61–62", "num": "الحصة الثالثة من 3", "focus": "صناعة السماد العضوي واستقصاء تحلل النفايات"}, "f": ["1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة (15 دقيقة)\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل (10 دقائق)\n\nمخرج تعليمي آخر: يفسر أهمية السماد العضوي لنمو النباتات (15 دقيقة)", "1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة. ← فهم\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل. ← تطبيق\nالمخرج الآخر: يفسر أهمية السماد العضوي لنمو النباتات. ← فهم", "- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "- الكتاب\n- صورة توضيحية\n- أخرى: كيس بلاستيكي كبير، قشور خضراوات وفواكه وبيض، أعشاب وأوراق، ماء، مجرفة، ورقة العمل 2-8ب", "- السماد العضوي\n- التحلل\n- القابل للتحلل الحيوي\n- خصوبة التربة", "يعرض المعلم كيسًا من السماد العضوي الجاهز ويطلب من الطلبة ملاحظة لونه وملمسه ورائحته، ويسأل: من ماذا صُنع؟ (5 دقائق)", "1. نشاط 2-8: تجربة عرض لصنع السماد: يجمع المعلم القشور والأعشاب في الكيس ويضيف الماء باعتدال ويربطه ويضعه في مكان دافئ، والطلبة يشاركون في الإضافة ويسجلون الخطوات وينتبهون لعدم إضافة الطعام المطبوخ أو اللحوم (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. ورقة العمل 2-8ب: مردم نفايات مصغر: يشرح المعلم الاستقصاء: حفرتان، الأولى بقشور وورق والثانية بعلبة وعبوة بلاستيكية؛ الفحص بعد أسبوعين ثم شهرين، والطلبة يكتبون تنبؤاتهم في ورقة العمل (ص 71) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة السؤال 3 والتحدي: يناقش المعلم: ما أهمية السماد؟ ولماذا يبقى البلاستيك طويلًا في المرادم؟ والطلبة يستنتجون أن البلاستيك لا يتحلل بسهولة ويضر الحيوانات (4 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – فرز نفايات مدرستي: تتنافس المجموعات في تصنيف بطاقات نفايات إلى ما يعاد تدويره وما يذهب إلى المرادم، وتقترح منتجًا مفيدًا يعاد تصنيعه في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المواد المناسبة لصنع السماد العضوي؟\n   الإجابة النموذجية: قشور الخضراوات والفواكه والبيض، والحشائش والأوراق المتساقطة.\n2. [مستوى التطبيق] لماذا لا نضع الطعام المطبوخ أو اللحوم في كيس السماد؟\n   الإجابة النموذجية: لأنها تتعفن بروائح كريهة وتجذب الحشرات والحيوانات.\n3. [مستوى الاستدلال] أي الحفرتين تتوقع أن تتغير محتوياتها أكثر؟ ولماذا؟\n   الإجابة النموذجية: حفرة القشور والورق؛ لأنها مواد قابلة للتحلل، أما العلبة والبلاستيك فلا تتحلل بسهولة.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] متى يكون السماد جاهزًا؟\n   الإجابة النموذجية: عندما يصبح غامق اللون طري القوام بعد بضعة أسابيع.\n2. [مستوى التطبيق] ما أهمية السماد العضوي للنباتات؟\n   الإجابة النموذجية: يزيد خصوبة التربة بالمغذيات فتنمو النباتات بشكل أفضل.\n3. [مستوى الاستدلال] لماذا تُعد الأكياس البلاستيكية خطرًا على الحيوانات؟\n   الإجابة النموذجية: لأنها لا تتحلل وقد تختنق بها الحيوانات أو تبتلعها.", "للطالب: تنفيذ استقصاء ورقة العمل 2-8ب في المنزل بمساعدة الأسرة (كتاب النشاط ص 71)، ومراجعة ص 48–49. لولي الأمر: يُرجى مساعدة الابن في حفر الحفرتين واختيار مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}], "comb": ["الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1. يوضح المقصود بمرادم النفايات وإعادة التدوير (5 دقائق)\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها (10 دقائق)\n3. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة (10 دقائق)\n4. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير (5 دقائق)\n\nمخرج تعليمي آخر:\nيقترح طرقًا لاستخدام كمية أقل من الورق (5 دقائق)\nيقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها (5 دقائق)\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\n1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة (15 دقيقة)\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل (10 دقائق)\n\nمخرج تعليمي آخر: يفسر أهمية السماد العضوي لنمو النباتات (15 دقيقة)", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n1. يوضح المقصود بمرادم النفايات وإعادة التدوير. ← فهم\n2. يصنف مواد النفايات حسب إمكانية تقليلها أو إعادة استخدامها أو تدويرها. ← تطبيق\n3. يحدد كيف يمكن إعادة استخدام أو تدوير عناصر مختلفة من القمامة. ← تطبيق\n4. يصمم منتجًا أو ملصقًا يشجع على إعادة التدوير. ← إبداع\nالمخرج الآخر: يقترح طرقًا لاستخدام كمية أقل من الورق. ← تطبيق\nالمخرج الآخر: يقيّم ملصقات زملائه من حيث جاذبيتها ووضوح رسالتها. ← تقييم\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\n1. يصف خطوات صناعة السماد العضوي من مخلفات المطبخ والحديقة. ← فهم\n2. يتنبأ بالمواد التي تتحلل في التربة والتي لا تتحلل. ← تطبيق\nالمخرج الآخر: يفسر أهمية السماد العضوي لنمو النباتات. ← فهم", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم المبني على حل المشكلات\n- التعلم المبني على المشاريع\n- التعلم التشاركي\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\n- العرض العملي\n- الاستقصاء العلمي\n- التعلم التعاوني", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- أخرى: نفايات نظيفة متنوعة على ورق جرائد: ورق، كرتون، كيس، زجاجة بلاستيكية وزجاجية، علبة، قشور خضار، علب معدنية وأوعية بلاستيكية نظيفة، أوراق ملونة، ورقة العمل 2-8أ\n- الأقلام\n- الوسائل الاجتماعية\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\n- الكتاب\n- صورة توضيحية\n- أخرى: كيس بلاستيكي كبير، قشور خضراوات وفواكه وبيض، أعشاب وأوراق، ماء، مجرفة، ورقة العمل 2-8ب", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\n- التخلص من النفايات\n- مرادم النفايات\n- إعادة التدوير\n- إعادة الاستخدام\n- التقليل\n- الحملة التوعوية\n- المنتجات المغلفة\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\n- السماد العضوي\n- التحلل\n- القابل للتحلل الحيوي\n- خصوبة التربة", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nيفرغ المعلم كيس نفايات نظيفة على ورق الجرائد ويرفع كل قطعة ويسأل: هل يمكن تقليل استخدامها؟ أو إعادة استخدامها؟ أو تدويرها؟ (5 دقائق)\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\nيعرض المعلم كيسًا من السماد العضوي الجاهز ويطلب من الطلبة ملاحظة لونه وملمسه ورائحته، ويسأل: من ماذا صُنع؟ (5 دقائق)", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير — زمن الحصة 40 دقيقة\n1. إلى أين تذهب نفاياتنا؟: يشرح المعلم ص 48: مرادم النفايات أكوام ضخمة بعيدة عن السكان تغطى بالتربة، ويعرض فكرة «مدينة المخلفات» في القاهرة، والطلبة يكتبون مشكلات المرادم (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. فرز وتصنيف: يوزع المعلم على المجموعات قطعًا ويرسم جدولًا: تقليل – إعادة استخدام – إعادة تدوير، والطلبة يصنفون القطع ويعللون (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. السؤال 1 ص 49: ورق أقل: يطرح المعلم السؤال ويجمع الأفكار، والطلبة يقترحون: الكتابة على الوجهين، الكتب الإلكترونية، المناديل القماشية (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. ورقة العمل 2-8أ: إعادة استخدام العلب: يوزع المعلم ورقة العمل (كتاب النشاط ص 70) ويتابع التنفيذ مع مراعاة سلامة حواف العلب، والطلبة يصنعون حامل أقلام أو أصيص زرع من العلب والأوعية (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تمرين 2-8: يوجه المعلم إكمال جدول تمرين 2-8 (ص 34)، والطلبة يحددون لكل عنصر طريقة إعادة الاستخدام أو التدوير (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n6. ملصق الحملة (السؤال 4 ص 49): يحدد المعلم معايير الملصق: رسالة واضحة، صورة جاذبة، عبارة قصيرة، والطلبة يصممون الملصق ويعلقونه، ويقيّمون ملصقات زملائهم (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات — زمن الحصة 40 دقيقة\n1. نشاط 2-8: تجربة عرض لصنع السماد: يجمع المعلم القشور والأعشاب في الكيس ويضيف الماء باعتدال ويربطه ويضعه في مكان دافئ، والطلبة يشاركون في الإضافة ويسجلون الخطوات وينتبهون لعدم إضافة الطعام المطبوخ أو اللحوم (7 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n2. ورقة العمل 2-8ب: مردم نفايات مصغر: يشرح المعلم الاستقصاء: حفرتان، الأولى بقشور وورق والثانية بعلبة وعبوة بلاستيكية؛ الفحص بعد أسبوعين ثم شهرين، والطلبة يكتبون تنبؤاتهم في ورقة العمل (ص 71) (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مناقشة السؤال 3 والتحدي: يناقش المعلم: ما أهمية السماد؟ ولماذا يبقى البلاستيك طويلًا في المرادم؟ والطلبة يستنتجون أن البلاستيك لا يتحلل بسهولة ويضر الحيوانات (4 دقائق)\nالاستراتيجيات: العرض العملي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (3 دقائق)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – فرز نفايات مدرستي: تتنافس المجموعات في تصنيف بطاقات نفايات إلى ما يعاد تدويره وما يذهب إلى المرادم، وتقترح منتجًا مفيدًا يعاد تصنيعه في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المقصود بإعادة التدوير؟\n   الإجابة النموذجية: معالجة الأشياء بدل رميها لتصبح منتجًا جديدًا يمكن استخدامه.\n2. [مستوى التطبيق] ما مرادم النفايات؟\n   الإجابة النموذجية: أكوام ضخمة من القمامة في أماكن بعيدة عن السكان تغطى بالتربة لاحقًا.\n3. [مستوى الاستدلال] ما الفرق بين إعادة الاستخدام وإعادة التدوير؟ أعطِ مثالًا.\n   الإجابة النموذجية: إعادة الاستخدام: استعمال الشيء مرة أخرى كما هو (علبة كحامل أقلام)؛ التدوير: معالجته لصنع منتج جديد (صهر العلب لصنع علب جديدة).\n\nتفريد التعليم (5 دقائق):\n4. [مستوى المعرفة] اقترح طريقة لإعادة استخدام الأوعية البلاستيكية.\n   الإجابة النموذجية: لتخزين الأدوات أو زراعة النباتات أو حفظ الطعام.\n5. [مستوى التطبيق] أي المواد في تمرين 2-8 يمكن تحويلها إلى سماد؟\n   الإجابة النموذجية: قشور الفواكه والخضراوات ومخلفات الحدائق.\n6. [مستوى الاستدلال] ما الذي يجعل الملصق التوعوي ناجحًا؟\n   الإجابة النموذجية: رسالة واضحة قصيرة، صورة جاذبة، ألوان مناسبة، ودعوة لفعل محدد.\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\nتفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما المواد المناسبة لصنع السماد العضوي؟\n   الإجابة النموذجية: قشور الخضراوات والفواكه والبيض، والحشائش والأوراق المتساقطة.\n2. [مستوى التطبيق] لماذا لا نضع الطعام المطبوخ أو اللحوم في كيس السماد؟\n   الإجابة النموذجية: لأنها تتعفن بروائح كريهة وتجذب الحشرات والحيوانات.\n3. [مستوى الاستدلال] أي الحفرتين تتوقع أن تتغير محتوياتها أكثر؟ ولماذا؟\n   الإجابة النموذجية: حفرة القشور والورق؛ لأنها مواد قابلة للتحلل، أما العلبة والبلاستيك فلا تتحلل بسهولة.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر مادتين يمكن إعادة تدويرهما.\n   الإجابة النموذجية: الورق، البلاستيك، الزجاج، العلب المعدنية.\n2. [مستوى التطبيق] اقترح طريقتين لاستخدام ورق أقل.\n   الإجابة النموذجية: الكتابة على وجهي الورقة، استخدام الأجهزة الإلكترونية، المناديل القماشية.\n3. [مستوى الاستدلال] لماذا يُعد تقليل النفايات أفضل من إعادة تدويرها؟\n   الإجابة النموذجية: لأنه يمنع إنتاج النفايات أصلًا ويوفر الطاقة والمواد المستخدمة في التدوير.\n\nأسئلة التقويم الختامي (5 دقائق):\n4. [مستوى المعرفة] ما فائدة إعادة الاستخدام للبيئة؟\n   الإجابة النموذجية: تقلل النفايات وتحافظ على المواد الطبيعية.\n5. [مستوى التطبيق] اكتب شعارًا قصيرًا لحملة إعادة التدوير.\n   الإجابة النموذجية: مثل: «لا ترمِ.. أعد التدوير!» (تقبل الشعارات المناسبة).\n6. [مستوى الاستدلال] كيف يمكنك وأسرتك إعادة التدوير في المنزل؟\n   الإجابة النموذجية: فرز النفايات، جمع العلب والورق في سلال خاصة، إعادة استخدام الأكياس والأوعية.\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\nأسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] متى يكون السماد جاهزًا؟\n   الإجابة النموذجية: عندما يصبح غامق اللون طري القوام بعد بضعة أسابيع.\n2. [مستوى التطبيق] ما أهمية السماد العضوي للنباتات؟\n   الإجابة النموذجية: يزيد خصوبة التربة بالمغذيات فتنمو النباتات بشكل أفضل.\n3. [مستوى الاستدلال] لماذا تُعد الأكياس البلاستيكية خطرًا على الحيوانات؟\n   الإجابة النموذجية: لأنها لا تتحلل وقد تختنق بها الحيوانات أو تبتلعها.", "الحصة 1: مشكلة النفايات: التقليل وإعادة الاستخدام وإعادة التدوير\nللطالب: قراءة كتاب الطالب ص 48 وعدّ أكياس النفايات التي تخرجها الأسرة أسبوعيًا. لولي الأمر: يُرجى تخصيص سلة لفرز المواد القابلة للتدوير في المنزل.\nللطالب: حل تمرين 2-8 في كتاب النشاط ص 34 وإكمال الملصق، وإعداد قائمة بالمنتجات المغلفة القابلة للتدوير من البقالة. لولي الأمر: يُرجى اصطحاب الابن إلى البقالة وتشجيعه على إعداد القائمة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16\n\nالحصة 2: صناعة السماد العضوي واستقصاء تحلل النفايات\nللطالب: تنفيذ استقصاء ورقة العمل 2-8ب في المنزل بمساعدة الأسرة (كتاب النشاط ص 71)، ومراجعة ص 48–49. لولي الأمر: يُرجى مساعدة الابن في حفر الحفرتين واختيار مكان آمن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=16"]}, {"id": "2-9", "title": "الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 50–51 | كتاب النشاط ص 35 | دليل المعلم ص 62–64", "n": 2, "per": [{"h": {"lesson": "2-9 الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 50 | كتاب النشاط ص 35 | دليل المعلم ص 62–63", "num": "الحصة الأولى من 2", "focus": "الحفاظ على الماء والطاقة"}, "f": ["1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة (20 دقيقة)\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء (5 دقائق)\nمخرج تعليمي آخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه (15 دقيقة)", "1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة. ← تذكر\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء. ← فهم\nالمخرج الآخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه. ← تقييم", "- فكّر – زاوج – شارك\n- التعلم المبني على حل المشكلات\n- التعلم الذاتي", "- الكتاب\n- السبورة الذكية\n- صورة توضيحية\n- الوسائل المتعددة (سمعية - بصرية)\n- أخرى: تمرين 2-9 في كتاب النشاط", "- الماء العذب\n- ترشيد الاستهلاك\n- الطاقة\n- المصابيح الموفرة\n- الطاقة الشمسية", "يعرض المعلم صنبورًا يقطر (أو مقطعًا) ويسأل: كم لترًا يضيع من صنبور يقطر طوال اليوم؟ هل يهمنا ذلك في بلد قليل الأمطار؟ (5 دقائق)", "1. الحفاظ على الماء: يناقش المعلم ص 50: الاستحمام بالرشاش، إصلاح التسرب، جمع مياه الأمطار، ويذكر أن نسبة الماء العذب ثابتة والتلوث يزداد، والطلبة يضيفون أفكارًا: ري الحدائق ليلًا، غلق الصنبور عند تنظيف الأسنان (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. الحفاظ على الطاقة: يناقش المعلم: إطفاء الأجهزة، المصابيح الموفرة، المشي والدراجة، المصابيح الشمسية، والطلبة يصممون بطاقة «نصائح لتوفير الطاقة» لغرفة الصف (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تمرين 2-9: سجلي الأسبوعي: يوجه المعلم تمرين 2-9 (ص 35) للتفكير في استخدام الموارد خلال الأسبوع، والطلبة يقيّمون عاداتهم ويكتبون ثلاث خطوات للتحسين (7 دقائق)\nالاستراتيجيات: فكّر – زاوج – شارك.\n\n4. الختام والتقويم: يطرح المعلم التقويم الختامي، والطلبة يجيبون فرديًا (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الماء في المنزل.\n   الإجابة النموذجية: الاستحمام بالرشاش بدل الحوض، وإصلاح تسرب الصنابير.\n2. [مستوى التطبيق] لماذا يجب ألا نسرف في استهلاك الماء؟\n   الإجابة النموذجية: لأن الماء العذب محدود والتلوث يزداد مع الوقت.\n3. [مستوى الاستدلال] لماذا تُعد المصابيح الشمسية في الحدائق خيارًا جيدًا؟\n   الإجابة النموذجية: لأنها أقل كلفة وصديقة للبيئة ولا تستهلك كهرباء من الوقود.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] اذكر طريقتين لتوفير الطاقة.\n   الإجابة النموذجية: إطفاء الأجهزة غير المستخدمة، واستخدام مصابيح موفرة للطاقة.\n2. [مستوى التطبيق] كيف يساعد المشي بدل السيارة البيئة؟\n   الإجابة النموذجية: يقلل استهلاك الوقود وتلوث الهواء.\n3. [مستوى الاستدلال] ضع خطة من ثلاث خطوات لتقليل استهلاك أسرتك للماء والكهرباء.\n   الإجابة النموذجية: تقبل الخطط المنطقية، مثل: غلق الصنبور، إطفاء الإنارة، ضبط المكيف على درجة معتدلة.", "للطالب: إكمال تمرين 2-9 (كتاب النشاط ص 35) ومتابعة خطة التوفير أسبوعًا. لولي الأمر: يُرجى دعم خطة الابن لتوفير الماء والكهرباء في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}, {"h": {"lesson": "2-9 الاعتناء بالبيئة", "unit": "الوحدة الثانية: الكائنات الحية في البيئة", "week": "الأسبوع العاشر (8–12/11/2026)", "pages": "كتاب الطالب ص 51 | دليل المعلم ص 63–64", "num": "الحصة الثانية من 2", "focus": "فرز القمامة وحملة لمنع رميها (نشاط 2-9)"}, "f": ["1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان (15 دقيقة)\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات (10 دقائق)\nمخرج تعليمي آخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة (15 دقيقة)", "1. يجمع القمامة ويفرزها ويسجل أنواعها في جدول بأمان. ← تطبيق\n2. يمثل نتائج الفرز بالأعمدة ويقارن الأنماط بين المجموعات. ← تحليل\nالمخرج الآخر: يخطط لحملة توعوية لمنع رمي القمامة في الأماكن العامة. ← إبداع", "- الاستقصاء العلمي\n- التعلم المبني على المشاريع\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- الأقلام\n- الوسائل الاجتماعية\n- أخرى: أكياس قمامة كبيرة، قفازات مطاطية، كمامات، دفتر ملاحظات", "- فرز القمامة\n- جدول الإحصاء\n- التمثيل بالأعمدة\n- الحملة التوعوية", "يسأل المعلم: ما أكثر أنواع القمامة التي تتوقع أن تجدها في فناء المدرسة؟ ويسجل التنبؤات على السبورة. (5 دقائق)", "1. نشاط 2-9: الجمع والتسجيل: يرافق المجموعات في منطقة آمنة محددة، ويوجه تبادل الأدوار بين الجمع والتسجيل، والطلبة يجمعون القمامة ويضعون علامة في عمود النوع: بلاستيك، ورق، معدن، زجاج، خشب، طعام (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. التمثيل والمقارنة: يوجه المعلم جمع العلامات ورسم الأعمدة، ومقارنة الأنماط بين المجموعات (السؤالان 1 و2)، والطلبة يرسمون الأعمدة ويحددون النوع الأكثر شيوعًا (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تخطيط الحملة (السؤال 3): يناقش المعلم «تحدّث عن» ص 51 ويطلب خطة حملة، والطلبة يقترحون صناديق في أماكن الطعام وملصقات وإذاعة مدرسية (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. الختام: تتناوب المجموعات على الإجابة بسرعة ودقة، وتتابع ترتيبها على المخطط (2 دقيقتان)\nالاستراتيجيات: الاستقصاء العلمي.\n\n5. غلق الدرس – سفراء البيئة العمانية: تتقمص المجموعات دور سفراء البيئة، فتقدم كل مجموعة نصيحتين للحفاظ على الماء والطاقة في البيت والمدرسة، ضمن أهداف رؤية عمان 2040 (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\n1. [مستوى المعرفة] ما أكثر أنواع القمامة التي جمعتها مجموعتك؟\n   الإجابة النموذجية: غالبًا البلاستيك أو الورق (تعتمد على النتائج).\n2. [مستوى التطبيق] هل تدعم نتائجك تنبؤك؟\n   الإجابة النموذجية: نعم/لا مع الاستدلال بعدد العلامات.\n3. [مستوى الاستدلال] لماذا يُعد البلاستيك من أخطر أنواع القمامة؟\n   الإجابة النموذجية: لأنه لا يتحلل بسهولة ويبقى طويلًا وقد تختنق به الحيوانات.", "أسئلة التقويم الختامي (5 دقائق):\n1. [مستوى المعرفة] لماذا نرتدي القفازات والكمامات عند جمع القمامة؟\n   الإجابة النموذجية: لحماية أنفسنا من الجراثيم والأدوات الحادة.\n2. [مستوى التطبيق] ما فائدة تمثيل نتائج الفرز بالأعمدة؟\n   الإجابة النموذجية: لمقارنة أنواع القمامة بسهولة ومعرفة النوع الأكثر شيوعًا.\n3. [مستوى الاستدلال] اقترح فكرتين لحملة منع رمي القمامة في مدرستك.\n   الإجابة النموذجية: وضع صناديق قرب المقصف، ملصقات توعوية، مسابقة الفصل الأنظف (تقبل الأفكار المنطقية).", "للطالب: إعداد ملصق للحملة التوعوية لوضعه في المدرسة، ومراجعة الوحدة الثانية. لولي الأمر: يُرجى تشجيع الابن على عدم رمي المخلفات في الأماكن العامة والقدوة في ذلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/science/?l=17"]}], "comb": ["الحصة 1: الحفاظ على الماء والطاقة\n1. يذكر طرقًا للحفاظ على الماء والطاقة في المنزل والمدرسة (20 دقيقة)\n2. يفسر أهمية ترشيد استهلاك الماء العذب والكهرباء (5 دقائق)\nمخرج تعليمي آخر: يقيّم استخدامه لموارد البيئة خلال أسبوع ويضع خطة لتحسينه (15 دقيقة)\n\nالح
