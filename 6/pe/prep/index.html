num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم اللياقة البدنية وأهميتها وعناصرها (5 دقائق)\n2. يميز عنصر التوافق وتمريناته (5 دقائق)\n3. يؤدي تمرينات حرة وبالأدوات (سلم الرشاقة، الكرات) لتنمية التوافق (10 دقائق)\n4. يميز عنصري القوة العضلية والسرعة وأنواع السرعة (10 دقائق)\n5. يؤدي تمرينات حرة وبالكرة الطبية لتنمية القوة العضلية، وتمرينات لتنمية السرعة (5 دقائق)\n6. يقدر أهمية التمرينات للمحافظة على الصحة (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: كرات\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: كرات طبية\n- أخرى: حواجز\n- أخرى: ساعة إيقاف", "المفاهيم": "- اللياقة البدنية\n- التوافق\n- الدمج الحركي\n- الجهاز العصبي العضلي\n- القوة العضلية\n- السرعة\n- السرعة الانتقالية\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "يطلب المعلم من الطلبة التصفيق مرتين خلفًا ومرة أمامًا أسفل الركبة أثناء الوثب ويسأل: ما العنصر الذي نحتاجه؟ ويراجع مفهوم اللياقة (ص 35-36).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يراجع المعلم مفهوم اللياقة وأهميتها (كفاءة الأجهزة، الوزن المثالي، القوام)، ويشرح التوافق وأمثلته (خطوات الوثب الثلاثي، التصويبة السلمية، ضرب الكرة بالرأس)، ويؤدي النماذج ص 36-37: (وقوف فتحًا. الذراعان جانبًا) ضم الرجلين مع رفع الذراعين، التصفيق مع الوثب، الجري في سلم الرشاقة أمامًا وخلفًا، الجري بوضع قدم خارج المربع، رمي الكرة عاليًا والتصفيق ومسكها، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوافق: سلم الرشاقة (نمط الرجوع)، الكرات (رمي وتصفيق ومسك)، التصفيق مع الوثب، تنطيط كرتين، مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: أي مجموعة تكمل نمط السلم المركب بأقل أخطاء، ويتسابق الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يشرح المعلم القوة العضلية (الوقاية من الإصابات وتحسين القوام) ونماذجها ص 39: (انبطاح) رفع الصدر والذراعين والرجلين والثبات، (انبطاح مائل) ثني الذراعين، دفع يد الزميل، (وقوف. مسك الكرة الطبية) الوثب للأمام، رمي الكرة الطبية للأمام؛ ثم السرعة وأنواعها (انتقالية، حركية، رد فعل) ونماذجها ص 41: العدو 20 م من أوضاع مختلفة، الجري برفع الركبتين، تعدية الحواجز، ويقلد الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات: الكرة الطبية (رمي للأمام)، انبطاح مائل، رد الفعل (الانطلاق بالإشارة من الجلوس)، عدو 20 م، مع التبديل، ويؤدي الطالب ويبدل (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يقارن الطلبة زمن رد الفعل للإشارة الصوتية والبصرية ويستنتجون الفرق، ويجرب الطالب ويستنتج (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – تناغم فرقة الرزحة: يحكي المعلم أن فن الرزحة العماني يحتاج إلى توافق بين الحركة والإيقاع، فتؤدي المجموعات تمرين التوافق على سلم الرشاقة مع تصفيق موحد (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما اللياقة البدنية؟\nالإجابة: كفاءة الفرد على أداء أنشطته دون إجهاد.\nس2 (مستوى التطبيق): ما التوافق؟\nالإجابة: دمج أكثر من حركة لأجزاء مختلفة من الجسم في وقت واحد.\nس3 (مستوى الاستدلال): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: التصويبة السلمية أو ضرب الكرة بالرأس.\n\nس4 (مستوى المعرفة): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس5 (مستوى التطبيق): اذكر أنواع السرعة.\nالإجابة: الانتقالية والحركية ورد الفعل.\nس6 (مستوى الاستدلال): اذكر تمرينًا للقوة بالكرة الطبية.\nالإجابة: رمي الكرة الطبية للأمام لأبعد مسافة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ رمي الكرة عاليًا والتصفيق مرتين ومسكها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة القلب والرئتين.\nس3 (مستوى الاستدلال): لماذا يرتبط التوافق بالجهازين العصبي والعضلي؟\nالإجابة: لأن الدماغ يوجه العضلات لأداء الحركات معًا بتوقيت دقيق.\n\nس4 (مستوى المعرفة): أدِّ الانطلاق بالإشارة من الجلوس وعدو 10 م.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما العنصر الذي يحتاجه رامي الجلة أكثر؟\nالإجابة: القوة العضلية.\nس6 (مستوى الاستدلال): كيف تساعد القوة العضلية في الوقاية من الإصابات؟\nالإجابة: العضلات القوية تحمي المفاصل وتثبتها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التوافق بالكرة (رمي وتصفيق ومسك) يوميًا (دليل المعلم ص 36-37).\nإرشاد لولي الأمر: شجع طالبك على تمرين الانبطاح المائل يوميًا بعدد مناسب (دليل المعلم ص 39-41).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مفهوم اللياقة البدنية وأهميتها وعناصرها (5 دقائق)\n2. يميز عنصر التوافق وتمريناته (5 دقائق)\n3. يؤدي تمرينات حرة وبالأدوات (سلم الرشاقة، الكرات) لتنمية التوافق (10 دقائق)\n4. يميز عنصري القوة العضلية والسرعة وأنواع السرعة (10 دقائق)\n5. يؤدي تمرينات حرة وبالكرة الطبية لتنمية القوة العضلية، وتمرينات لتنمية السرعة (5 دقائق)\n6. يقدر أهمية التمرينات للمحافظة على الصحة (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: سلم الرشاقة\n- أخرى: كرات\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: كرات طبية\n- أخرى: حواجز\n- أخرى: ساعة إيقاف", "المفاهيم": "الحصة 1:\n- اللياقة البدنية\n- التوافق\n- الدمج الحركي\n- الجهاز العصبي العضلي\n- القوة العضلية\n- السرعة\n- السرعة الانتقالية\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيطلب المعلم من الطلبة التصفيق مرتين خلفًا ومرة أمامًا أسفل الركبة أثناء الوثب ويسأل: ما العنصر الذي نحتاجه؟ ويراجع مفهوم اللياقة (ص 35-36).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يراجع المعلم مفهوم اللياقة وأهميتها (كفاءة الأجهزة، الوزن المثالي، القوام)، ويشرح التوافق وأمثلته (خطوات الوثب الثلاثي، التصويبة السلمية، ضرب الكرة بالرأس)، ويؤدي النماذج ص 36-37: (وقوف فتحًا. الذراعان جانبًا) ضم الرجلين مع رفع الذراعين، التصفيق مع الوثب، الجري في سلم الرشاقة أمامًا وخلفًا، الجري بوضع قدم خارج المربع، رمي الكرة عاليًا والتصفيق ومسكها، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوافق: سلم الرشاقة (نمط الرجوع)، الكرات (رمي وتصفيق ومسك)، التصفيق مع الوثب، تنطيط كرتين، مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: أي مجموعة تكمل نمط السلم المركب بأقل أخطاء، ويتسابق الطالب (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يشرح المعلم القوة العضلية (الوقاية من الإصابات وتحسين القوام) ونماذجها ص 39: (انبطاح) رفع الصدر والذراعين والرجلين والثبات، (انبطاح مائل) ثني الذراعين، دفع يد الزميل، (وقوف. مسك الكرة الطبية) الوثب للأمام، رمي الكرة الطبية للأمام؛ ثم السرعة وأنواعها (انتقالية، حركية، رد فعل) ونماذجها ص 41: العدو 20 م من أوضاع مختلفة، الجري برفع الركبتين، تعدية الحواجز، ويقلد الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات: الكرة الطبية (رمي للأمام)، انبطاح مائل، رد الفعل (الانطلاق بالإشارة من الجلوس)، عدو 20 م، مع التبديل، ويؤدي الطالب ويبدل (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. يقارن الطلبة زمن رد الفعل للإشارة الصوتية والبصرية ويستنتجون الفرق، ويجرب الطالب ويستنتج (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – تناغم فرقة الرزحة: يحكي المعلم أن فن الرزحة العماني يحتاج إلى توافق بين الحركة والإيقاع، فتؤدي المجموعات تمرين التوافق على سلم الرشاقة مع تصفيق موحد (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما اللياقة البدنية؟\nالإجابة: كفاءة الفرد على أداء أنشطته دون إجهاد.\nس2 (مستوى التطبيق): ما التوافق؟\nالإجابة: دمج أكثر من حركة لأجزاء مختلفة من الجسم في وقت واحد.\nس3 (مستوى الاستدلال): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: التصويبة السلمية أو ضرب الكرة بالرأس.\n\nس4 (مستوى المعرفة): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس5 (مستوى التطبيق): اذكر أنواع السرعة.\nالإجابة: الانتقالية والحركية ورد الفعل.\nس6 (مستوى الاستدلال): اذكر تمرينًا للقوة بالكرة الطبية.\nالإجابة: رمي الكرة الطبية للأمام لأبعد مسافة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ رمي الكرة عاليًا والتصفيق مرتين ومسكها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة القلب والرئتين.\nس3 (مستوى الاستدلال): لماذا يرتبط التوافق بالجهازين العصبي والعضلي؟\nالإجابة: لأن الدماغ يوجه العضلات لأداء الحركات معًا بتوقيت دقيق.\n\nس4 (مستوى المعرفة): أدِّ الانطلاق بالإشارة من الجلوس وعدو 10 م.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما العنصر الذي يحتاجه رامي الجلة أكثر؟\nالإجابة: القوة العضلية.\nس6 (مستوى الاستدلال): كيف تساعد القوة العضلية في الوقاية من الإصابات؟\nالإجابة: العضلات القوية تحمي المفاصل وتثبتها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات التوافق بالكرة (رمي وتصفيق ومسك) يوميًا (دليل المعلم ص 36-37).\nإرشاد لولي الأمر: شجع طالبك على تمرين الانبطاح المائل يوميًا بعدد مناسب (دليل المعلم ص 39-41).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=2"}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "اللياقة البدنية", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 48-56", "n": 1, "periods": [{"focus": "تصميم مسارات الموانع بالأدوات والأجهزة + نماذج مسارات الموانع والمنافسات", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع وأدواتها وأجهزتها (5 دقائق)\n2. يؤدي حركات تخطي الموانع (تسلق، زحف، وثب، توازن، مروق) بأمان (10 دقائق)\n3. يصمم مع مجموعته مسار موانع قصيرًا (10 دقائق)\n4. يؤدي نماذج مسارات الموانع بالتتابع (5 دقائق)\n5. يوظف الحركات والمهارات في منافسات الموانع (5 دقائق)\n6. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات طبية\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: سلم التسلق\n- أخرى: أقماع", "المفاهيم": "- تمرينات الموانع\n- المانع\n- التصميم\n- الأمان\n- مسار الموانع\n- التتابع\n- المنافسة\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأدوات ويسأل: كيف نصمم مسار موانع ينمي القوة والتوافق والسرعة؟ (ص 48-50).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج التخطي: التسلق والنزول، الزحف أسفل الحاجز، الوثب فوق الحبال، المشي على المقعد، المروق داخل الصندوق، الجري في السلم، مع الأمان، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تصمم كل مجموعة بأدوار (مصمم، منفذ، مراقب أمان) مسارًا من خمسة موانع وترسمه وتنفذه، ويصمم الطالب وينفذ (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تجرب كل مجموعة مسار المجموعة الأخرى، ويجرب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. مجموعات تؤدي النموذجين الثالث والرابع بالتتابع مرتين ويصحح القائد، ويؤدي الطالب ويصحح (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. منافسة بين المجموعات بالزمن والأداء الصحيح (ص 55)، ويتسابق الطالب (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: أي مانع احتاج إلى القوة وأيها إلى التوافق؟ ليستنتج الطلبة علاقة الموانع بعناصر اللياقة، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة وتعبير، ويؤدي الطالب التهدئة ويعبر (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – مخيم الكشافة العماني: تصمم كل مجموعة مسار موانع قصيرًا لمخيم كشفي في صحراء عمان من تسلق وزحف ووثب وتوازن، وتشرح قاعدة أمان لكل مانع (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر ثلاث حركات لتخطي الموانع.\nالإجابة: التسلق، الزحف، الوثب.\nس2 (مستوى التطبيق): ما دور مراقب الأمان؟\nالإجابة: التأكد من ثبات الأدوات والهبوط الآمن.\nس3 (مستوى الاستدلال): ما عناصر اللياقة التي ينميها جمباز الموانع؟\nالإجابة: القوة والسرعة والتوافق والرشاقة.\n\nس4 (مستوى المعرفة): أي مانع يحتاج إلى القوة العضلية؟\nالإجابة: التسلق.\nس5 (مستوى التطبيق): أي مانع يحتاج إلى التوافق؟\nالإجابة: سلم الرشاقة.\nس6 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر الموانع الخمسة في مسار مجموعتك وحركة كل منها.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): أدِّ مسار المجموعة الأخرى.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): اقترح تعديلًا لزيادة صعوبة مسار مجموعتك.\nالإجابة: مثل: زيادة ارتفاع الحاجز.\n\nس4 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.\nس6 (مستوى الاستدلال): اقترح مانعًا ينمي السرعة.\nالإجابة: عدو 10 م بين قمعين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تصميم مسار موانع منزلي آمن (دليل المعلم ص 48-52).\nإرشاد لولي الأمر: شجع طالبك على تسجيل زمنه في مسار موانع آمن ومحاولة تحسينه (دليل المعلم ص 53-55).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع وأدواتها وأجهزتها (5 دقائق)\n2. يؤدي حركات تخطي الموانع (تسلق، زحف، وثب، توازن، مروق) بأمان (10 دقائق)\n3. يصمم مع مجموعته مسار موانع قصيرًا (10 دقائق)\n4. يؤدي نماذج مسارات الموانع بالتتابع (5 دقائق)\n5. يوظف الحركات والمهارات في منافسات الموانع (5 دقائق)\n6. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات طبية\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة المعرفة): أي مانع يحتاج إلى القوة العضلية؟\nالإجابة: التسلق.\nس5 (مستوى التطبيق): أي مانع يحتاج إلى التوافق؟\nالإجابة: سلم الرشاقة.\nس6 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر الموانع الخمسة في مسار مجموعتك وحركة كل منها.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): أدِّ مسار المجموعة الأخرى.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): اقترح تعديلًا لزيادة صعوبة مسار مجموعتك.\nالإجابة: مثل: زيادة ارتفاع الحاجز.\n\nس4 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.\nس6 (مستوى الاستدلال): اقترح مانعًا ينمي السرعة.\nالإجابة: عدو 10 م بين قمعين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تصميم مسار موانع منزلي آمن (دليل المعلم ص 48-52).\nإرشاد لولي الأمر: شجع طالبك على تسجيل زمنه في مسار موانع آمن ومحاولة تحسينه (دليل المعلم ص 53-55).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=3"}}, {"title": "سباق العدو (30-60) م من البدء المنخفض", "unit": "ألعاب القوى", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 60-68", "n": 1, "periods": [{"focus": "مراحل سباق العدو والبدء المنخفض (خذ مكانك، استعد، انطلق) + تدريبات سباق العدو ومنافساته", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء سباق العدو (30-60) م ومراحله الفنية (10 دقائق)\n2. يؤدي البدء المنخفض بأقسامه الثلاثة (5 دقائق)\n3. يحدد القواعد القانونية للسباق (البدء المنخفض، الحارة، الانطلاق بعد الإشارة) (5 دقائق)\n4. يؤدي التمرينات التمهيدية والتدريبات التعليمية لسباق العدو (5 دقائق)\n5. يؤدي سباق العدو 30-60 م من البدء المنخفض بتطبيق القواعد (10 دقائق)\n6. يستمتع بمشاركة زملائه سباق العدو ويحدد هدفًا لتحسين زمنه (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: أعلام", "المفاهيم": "- البدء المنخفض\n- الحارة\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- خط النهاية\n- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة عدائي 100 م عند البدء ويسأل: لماذا يبدؤون من هذا الوضع؟ ويقدم السباق ومراحله (ص 61-62).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء: جري، رفع الركبتين، لمس الرجلين خلفًا، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: خذ مكانك (الأصابع قوس قبل الخط، ركبة الرجل الخلفية على الأرض، النظر للأسفل)، استعد (رفع الحوض والركبة)، انطلق (دفع الأرض بالقدمين وميل الجذع)، ثم الدفع وتزايد السرعة والسرعة القصوى، مع القواعد، ويقلد كل قسم بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أزواج: يعطي أحدهما الأوامر الثلاثة ويراقب أخطاء زميله (لمس الخط، الانطلاق المبكر) ثم يتبادلان، ثم عدو 20 م، ويتدرب الطالب ويراقب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (رد الفعل): انطلاق بإشارات مختلفة من البدء المنخفض 10 م، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم التدريبات ص 64-66: العدو المتزايد السرعة 30 م، العدو من البدء المنخفض 20 م بالإشارة، الجري بخطوات واسعة ثم سريعة، مع التركيز على حركة الذراعين، ويقلد الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. مجموعات بميقاتي (ساعة إيقاف) ومسجل: يعدو كل طالب 50 م من البدء المنخفض ويسجل زمنه، ويعدو الطالب ويسجل لزميله (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. سباق العدو بين المجموعات بالتصفيات والنهائي مع حكام من الطلبة (ص 67)، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتحديد هدف شخصي لتحسين الزمن خلال أسبوع، ويؤدي الطالب التهدئة ويحدد هدفًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – حكام سباق العدو: يحصل كل طالب على رقم، ويسأل المعلم عن قاعدة في سباق العدو أو قسم من البدء المنخفض، ويجيب صاحب الرقم ك لتعلم المبني على اللعب.\n\n8. تهدئة وتحديد هدف شخصي لتحسين الزمن خلال أسبوع، ويؤدي الطالب التهدئة ويحدد هدفًا (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – حكام سباق العدو: يحصل كل طالب على رقم، ويسأل المعلم عن قاعدة في سباق العدو أو قسم من البدء المنخفض، ويجيب صاحب الرقم كأنه حكم في بطولة تشارك فيها عمان (3 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما أقسام البدء المنخفض؟\nالإجابة: خذ مكانك، استعد، انطلق.\nس2 (مستوى التطبيق): متى ينتهي احتساب زمن السباق؟\nالإجابة: بمرور جذع العداء خط النهاية.\nس3 (مستوى الاستدلال): اذكر قاعدة من قواعد السباق.\nالإجابة: الجري في الحارة المخصصة.\n\nس4 (مستوى المعرفة): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وبالتبادل بقوة.\nس5 (مستوى التطبيق): ما دور الميقاتي؟\nالإجابة: تسجيل زمن العداء.\nس6 (مستوى الاستدلال): ما العنصر الأساسي في سباق العدو؟\nالإجابة: السرعة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ البدء المنخفض بأقسامه الثلاثة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما مراحل سباق العدو؟\nالإجابة: البدء المنخفض، الدفع وتزايد السرعة، السرعة القصوى.\nس3 (مستوى الاستدلال): زميلك ينطلق قبل الإشارة، ما القرار؟\nالإجابة: بداية خاطئة.\n\nس4 (مستوى المعرفة): ما زمنك في 50 م وما هدفك بعد أسبوع؟\nالإجابة: يذكر.\nس5 (مستوى التطبيق): اذكر تدريبين لتطوير السرعة.\nالإجابة: العدو المتزايد السرعة والجري برفع الركبتين.\nس6 (مستوى الاستدلال): كيف تنظم مجموعتك سباق عدو بأدوار؟\nالإجابة: ميقاتي ومسجل وحكم بداية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التدرب على أوامر البدء الثلاثة في مكان آمن (دليل المعلم ص 61-63).\nإرشاد لولي الأمر: شجع طالبك على تدريبات السرعة خلال أسبوع ومقارنة زمنه، والبحث عن قصة نجاح أحد أبطال سباقات الجري (التعلم الذاتي، دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=4"}}, {"title": "الوثب العالي بالطريقة الظهرية من الاقتراب (3-5) خطوات", "unit": "ألعاب القوى", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 69-76", "n": 1, "periods": [{"focus": "المراحل الفنية للوثب العالي الظهري والتمرينات التمهيدية + التدريبات التعليمية ومسابقة الوثب العالي الظهري", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء الوثب العالي بالطريقة الظهرية ومراحله الفنية (5 دقائق)\n2. يؤدي التمرينات التمهيدية (تبادل الخطو والحجل، الوثب للجانبين، الحجل مع رفع الركبة) (10 دقائق)\n3. يميز بين الوثب بالطريقة المقصية والطريقة الظهرية (5 دقائق)\n4. يؤدي التدريبات التعليمية (الوثب المقصي من الاقتراب المستقيم، الاقتراب المنحني والدوران، الارتقاء الظهري من الوقوف ثم من الصندوق) (10 دقائق)\n5. يؤدي الوثب العالي بالطريقة الظهرية من اقتراب 3-5 خطوات بتطبيق القواعد (5 دقائق)\n6. يشارك زملاءه في تنظيم المسابقة بأدوار (حكم، مسجل) (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: حبل مطاطي\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: صندوق مقسم\n- أخرى: استمارات تسجيل", "المفاهيم": "- الوثب العالي\n- الطريقة الظهرية\n- الاقتراب المنحني\n- الارتقاء\n- العارضة\n- الارتقاء الظهري\n- الدوران\n- المسابقة\n- المحاولات\n- الارتفاع", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة وثب عالٍ ظهري ويسأل: لماذا هذه الطريقة الأكثر استخدامًا؟ ويقدم المراحل (ص 70-71).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل (اقتراب 3-5 خطوات في مسار منحنٍ، ارتقاء بالقدم البعيدة والدوران لمقابلة العارضة بالظهر، طيران بتقوس الظهر، هبوط على الكتفين والظهر) ويؤدي التمرينات التمهيدية ص 72-73: الجري مع رفع العقبين، تبادل فتح وضم الرجلين مع التقدم، الحجل مع رفع ركبة الرجل الحرة، الوثب للجانبين، تبادل الخطو والحجل، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التمرينات التمهيدية بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة: من يحجل مع رفع الركبة أعلى عند لمس كرة معلقة، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم التدريبات: الوثب المقصي من اقتراب مستقيم، الجري في مسار منحنٍ بالأقماع، الوثب بقدم واحدة مع الدوران ربع ثم نصف لفة، الارتقاء الظهري من الوقوف ثم من الصندوق على الحبل المطاطي والهبوط على المرتبة، ويقلد الطالب بالتدرج (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. مجموعات في محطتين (الاقتراب والدوران، الارتقاء من الصندوق) ثم وثبة كاملة من 3-5 خطوات على ارتفاع منخفض ويراقب القائد، ويتدرب الطالب (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. مسجل) على ارتفاعات متدرجة (ص 75)، ويتسابق الطالب ويحكم (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – عارضة الطموح: تتبادل المجموعات أفكارًا: كيف يشبه رفع عارضة الوثب العالي رفع طموح عمان في رؤية 2040، ثم تذكر مرحلة فنية من الوثب الظهري تقابل كل فكرة (3 دقائق)\nالاستراتيجيات: العصف الذهني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما مراحل الوثب العالي الظهري؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (مستوى التطبيق): كم خطوة اقتراب في مسابقة الصف السادس؟\nالإجابة: 3-5 خطوات.\nس3 (مستوى الاستدلال): على أي جزء نهبط؟\nالإجابة: على الكتفين والظهر.\n\nس4 (مستوى المعرفة): بأي قدم نرتقي؟\nالإجابة: بالقدم البعيدة عن العارضة.\nس5 (مستوى التطبيق): كم محاولة لكل ارتفاع؟\nالإجابة: ثلاث محاولات.\nس6 (مستوى الاستدلال): لماذا نستخدم الحبل المطاطي أولًا؟\nالإجابة: للأمان والتدرج.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تبادل الخطو والحجل 10 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): لماذا الطريقة الظهرية أكثر استخدامًا؟\nالإجابة: لانسيابية الحركة والاقتصاد في الجهد.\nس3 (مستوى الاستدلال): ما الفرق بين المقصية والظهرية؟\nالإجابة: المقصية تتعدى العارضة بالرجلين واحدة تلو الأخرى، والظهرية بالظهر.\n\nس4 (مستوى المعرفة): أدِّ الوثب الظهري من 3-5 خطوات على ارتفاع مناسب.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): متى تحتسب المحاولة فاشلة؟\nالإجابة: عند إسقاط العارضة أو الارتقاء بالقدمين.\nس6 (مستوى الاستدلال): ما دورك في تنظيم المسابقة؟\nالإجابة: يذكر (حكم أو مسجل).", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الحجل مع رفع الركبة والتقوس خلفًا بأمان (دليل المعلم ص 72-73).\nإرشاد لولي الأمر: شجع طالبك على تحديد هدف لتحسين ارتفاعه خلال أسبوع والبحث عن قصة بطل في الوثب (التعلم الذاتي، دليل المعلم ص 75).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=5"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء الوثب العالي بالطريقة الظهرية ومراحله الفنية (5 دقائق)\n2. يؤدي التمرينات التمهيدية (تبادل الخطو والحجل، الوثب للجانبين، الحجل مع رفع الركبة) (10 دقائق)\n3. يميز بين الوثب بالطريقة المقصية والطريقة الظهرية (5 دقائق)\n4. يؤدي التدريبات التعليمية (الوثب المقصي من الاقتراب المستقيم، الاقتراب المنحني والدوران، الارتقاء الظهري من الوقوف ثم من الصندوق) (10 دقائق)\n5. يؤدي الوثب العالي بالطريقة الظهرية من اقتراب 3-5 خطوات بتطبيق القواعد (5 دقائق)\n6. يشارك زملاءه في تنظيم المسابقة بأدوار (حكم، مسجل) (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: حبل مطاطي\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: صندوق مقسم\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- الوثب العالي\n- الطريقة الظهرية\n- الاقتراب المنحني\n- الارتقاء\n- العارضة\n- الارتقاء الظهري\n- الدوران\n- المسابقة\n- المحاولات\n- الارتفاع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة وثب عالٍ ظهري ويسأل: لماذا هذه الطريقة الأكثر استخدامًا؟ ويقدم المراحل (ص 70-71).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل (ا أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "- دفع الكرة الطبية\n- الاستعداد\n- الدفع\n- دائرة الرمي\n- مقطع الرمي\n- المسابقة\n- القواعد القانونية\n- المحاولة\n- المسافة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة رامي الجلة ويسأل: هل يرمي الجلة أم يدفعها؟ ويقدم المسابقة (ص 78-79).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء: دوران الذراعين، دفع يد الزميل، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل: الاستعداد (حمل الكرة على أصابع اليد عند الرقبة، الوقوف مواجهًا مقطع الرمي بالجانب داخل دائرة قطرها 2 م)، الدفع (ثني الركبتين ومدهما مع لف الجذع ومد الذراع ودفع الكرة بيد واحدة للأمام وللأعلى)، ويؤدي التمرينات التمهيدية ص 80: تبادل دفع الزميل، رمي ولقف الكرة من أمام الجسم، تحريك الكرة على شكل 8، دفع الكرة لأعلى بالأصابع، رمي الكرة من الجانب للأمام، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التمرينات التمهيدية بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: دفع الكرة 500 جم لأبعد مسافة من الوقوف، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم التدريبات التعليمية ص 81-82: الدفع من الوقوف، الدفع مع لف الجذع، الدفع مع ثني ومد الركبتين، الدفع الكامل من داخل الدائرة، ويقلد الطالب (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. مجموعات: 3 محاولات لكل طالب، يقيس القائس ويسجل المسجل ويراقب الحكم القواعد، ويدفع الطالب ويحكم ويقيس (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة وتحديد هدف شخصي، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – دفع أم رمي في الحرف: يصنف كل زوج حركات من الحياة العمانية إلى دفع أو رمي، كدفع القارب إلى البحر ورمي شبكة الصيد ودفع الرحى، ثم يشاركان الصف بالتعليل (3 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): أين توضع الكرة الطبية في الاستعداد؟\nالإجابة: على أصابع اليد عند الرقبة.\nس2 (مستوى التطبيق): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع من الكتف دون مرجحة الذراع خلفًا، والرمي بالمرجحة.\nس3 (مستوى الاستدلال): كم قطر دائرة الرمي؟\nالإجابة: 2 م.\n\nس4 (مستوى المعرفة): كم محاولة لكل طالب؟\nالإجابة: ثلاث محاولات.\nس5 (مستوى التطبيق): ماذا يحدث لو خرج الطالب من الدائرة أثناء الأداء؟\nالإجابة: تحتسب المحاولة خاطئة.\nس6 (مستوى الاستدلال): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الكرة إلى حدود الدائرة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ دفع الكرة الطبية من الوقوف.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما مرحلتا دفع الكرة الطبية؟\nالإجابة: الاستعداد والدفع.\nس3 (مستوى الاستدلال): اذكر تمرينين تمهيديين.\nالإجابة: تحريك الكرة على شكل 8 ودفع الكرة لأعلى بالأصابع.\n\nس4 (مستوى المعرفة): أدِّ دفع الكرة الطبية من داخل الدائرة بتطبيق القواعد.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): ما القاعدة التي راقبها الحكم؟\nالإجابة: الدفع بيد واحدة وعدم الخروج من الدائرة.\nس6 (مستوى الاستدلال): كيف يفوز الفريق؟\nالإجابة: بمجموع المسافات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل لتمرين الدفع بأمان (دليل المعلم ص 78-80).\nإرشاد لولي الأمر: شجع طالبك على البحث عن قصة بطل في مسابقات الرمي (التعلم الذاتي، دليل المعلم ص 83) ومراجعة مهارات الوحدتين قبل الاختبار العملي (1).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. كرة الأسئلة: يرمي المعلم كرة صغيرة إلى طالب فيجيب عن سؤال من الدرس مثل «كم قطر دائرة الرمي»، ثم يرميها إلى زميل ويسأله سؤالًا آخر (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب (10 دقائق)\n2. يؤدي دفع الكرة الطبية (500 جم - 1 كجم) من داخل الدائرة بالمراحل الصحيحة (5 دقائق)\n3. يطبق القواعد القانونية (الدفع بيد واحدة، عدم الخروج من الدائرة، سقوط الكرة داخل المقطع، 3 محاولات) (5 دقائق)\n4. يشارك زملاءه في تنظيم المسابقة بأدوار (5 دقائق)", "المستوى المعرفي": "الح "periods": [{"focus": "اختبار عملي في عناصر اللياقة البدنية وتمرينات الموانع + اختبار عملي في ألعاب القوى (العدو، الوثب العالي، دفع الكرة الطبية)", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي تمرينات التوافق والقوة والسرعة بالطريقة الصحيحة (5 دقائق)\n2. يؤدي مسار موانع بالحركات الصحيحة (10 دقائق)\n3. يقارن نتائجه بمستواه السابق (5 دقائق)\n4. يؤدي البدء المنخفض وسباق العدو 30 م بالقواعد (10 دقائق)\n5. يؤدي الوثب العالي الظهري من 3-5 خطوات (5 دقائق)\n6. يؤدي دفع الكرة الطبية من داخل الدائرة بالقواعد (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: ساعة إيقاف\n- أخرى: حواجز\n- أخرى: مراتب\n- أخرى: استمارة تقويم الأداء\n- أخرى: مكعبات البدء\n- أخرى: جهاز الوثب العالي\n- أخرى: شريط قياس", "المفاهيم": "- الاختبار العملي\n- التوافق\n- القوة العضلية\n- السرعة\n- العدو\n- الوثب العالي\n- دفع الكرة الطبية", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار ومعاييره.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار فردي: محطة 1 نمط مركب في سلم الرشاقة + رمي الكرة والتصفيق ومسكها 10 مرات، محطة 2 انبطاح مائل ثني الذراعين (العدد في 30 ثانية) + رمي الكرة الطبية للأمام، محطة 3 عدو 20 م بالزمن + مسار موانع قصير؛ ويرصد المعلم، ويؤدي الطالب عند دوره ويتدرب مستقلًا (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية، ويلعب الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. اختبار فردي: محطة 1 البدء المنخفض وعدو 30 م بالزمن، محطة 2 الوثب العالي الظهري (3 محاولات)، محطة 3 دفع الكرة الطبية (3 محاولات) + سؤال قواعد؛ ويرصد المعلم، ويؤدي الطالب عند دوره ويتدرب مستقلًا (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. سباق ختامي قصير، ويلعب الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تهدئة، ويؤدي الطالب الت
