بك على مراجعة قواعد كرة القدم للصغار (دليل المعلم ص 89-91) استعدادًا للأسبوع القادم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=7"}}, {"title": "لعبة كرة القدم للصغار", "unit": "الألعاب الحركية (1)", "week": "الثامن – التاسع", "date": "25-29/10/2026 إلى 1-5/11/2026", "pages": "دليل المعلم ص 89-99", "n": 4, "periods": [{"focus": "القواعد القانونية والجري بالكرة مع الدوران (بوجه القدم الخارجي والداخلي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، التبديل) (10 دقائق)\n2. يؤدي الجري بالكرة مع الدوران 180 درجة بوجه القدم الخارجي والداخلي (20 دقيقة)\n3. يميز متى يستخدم الدوران بالكرة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم للصغار\n- الجري بالكرة\n- الدوران بالكرة\n- وجه القدم الخارجي\n- وجه القدم الداخلي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم قواعد كرة القدم للصغار من الصف الخامس ويسأل: كيف نغير اتجاهنا بالكرة للتخلص من المنافس؟ (ص 91-92).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة مع تمرينات الإحساس (تنطيط بالقدم والفخذ)، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الجري بالكرة ثم وضع القدم أسفل الكرة وخلفها واللف 180 درجة ودفعها بوجه القدم الخارجي، ثم بوجه القدم الداخلي، ثم الدوران بوضع القدم أعلى الكرة وإرجاعها للخلف، فتطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 96: قطارات، الجري بالكرة ثم الدوران حول القمع والتمرير للتالي، ثم الجري بالكرة في مسار 8 بوجه القدم الخارجي والداخلي، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الاستدارة): ينادي المعلم نوع الدوران فيؤديه الطلبة أثناء الجري بالكرة، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس2 (مستوى التطبيق): اذكر طريقتين للدوران بالكرة.\nالإجابة: بوجه القدم الخارجي وبوضع القدم أعلى الكرة وإرجاعها.\nس3 (مستوى الاستدلال): متى نستخدم الدوران بالكرة؟\nالإجابة: لتغيير الاتجاه والتخلص من المنافس أو الوصول لوضع التمرير.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الجري بالكرة مع الدوران بوجه القدم الخارجي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الدوران بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي يدفع الكرة بالجزء الخارجي، والداخلي بالجزء الداخلي.\nس3 (مستوى الاستدلال): أدِّ الجري بالكرة في مسار 8.\nالإجابة: يؤديه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري بالكرة والدوران حول عوائق في مكان آمن (دليل المعلم ص 91-96).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}, {"focus": "التمرير بوجه القدم الداخلي", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتمرير بوجه القدم الداخلي ومتى يستخدم (10 دقائق)\n2. يؤدي التمرير بوجه القدم الداخلي للمسافات المتوسطة والطويلة (20 دقيقة)\n3. يختار نوع التمرير المناسب للمسافة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التمرير\n- وجه القدم الداخلي\n- قدم الارتكاز\n- الكرات العرضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمرير بباطن القدم ويسأل: كيف نمرر لمسافة طويلة أو كرة عرضية؟ (ص 93).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وللخلف قليلًا، أرجحة الرجل الراكلة للخلف ثم للأمام مع لف القدم للخارج، ركل الكرة بوجه القدم الداخلي ومتابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 4 ص 96: قطارات متقابلة بينها 15 م، يمرر الطالب في المنتصف للأول ليركلها بوجه القدم الداخلي للقطار المقابل، ثم تمرير عرضي من الجانب، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة التمرير الطويل بين قمعين من 15 م، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة والطويلة والكرات العرضية.\nس2 (مستوى التطبيق): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وللخلف قليلًا.\nس3 (مستوى الاستدلال): ما الفرق بين التمرير بباطن القدم وبوجه القدم الداخلي؟\nالإجابة: الباطن للدقة القصيرة، والداخلي للمسافة.", "التقويم الختامي": "س1 (مستوى المعرفة): مرر الكرة بوجه القدم الداخلي لزميل على بعد 15 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة عرضية من الجناح إلى منطقة الجزاء، أي تمرير تختار؟\nالإجابة: بوجه القدم الداخلي.\nس3 (مستوى الاستدلال): لماذا نلف القدم للخارج قبل الركل؟\nالإجابة: ليلامس وجه القدم الداخلي الكرة بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التمرير الطويل نحو هدف في مكان آمن (دليل المعلم ص 93-96).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}, {"focus": "السيطرة على الكرة (بأعلى الفخذ ووجه القدم الأمامي)", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف طرق السيطرة على الكرات العالية (10 دقائق)\n2. يؤدي استلام الكرة بأعلى الفخذ وبوجه القدم الأمامي (20 دقيقة)\n3. يختار جزء الجسم المناسب للسيطرة حسب ارتفاع الكرة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع", "المفاهيم": "- السيطرة على الكرة\n- أعلى الفخذ\n- وجه القدم الأمامي\n- الامتصاص", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم كرة عالية لطالب ويسأل: بأي جزء نسيطر عليها قبل أن تسقط؟ (ص 93-94).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاستلام بأعلى الفخذ (رفع الفخذ لمقابلة الكرة وسحبه لحظة الملامسة لتسقط أمام القدم)، والاستلام بوجه القدم الأمامي (رفع القدم ومد المشط وسحبه للأسفل لحظة الملامسة)، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 1 و5 ص 96-97: صفان متقابلان تبادل رمي الكرة واستلامها بالفخذ أو بوجه القدم الأمامي، ثم الجري بالكرة حول الدائرة والدوران، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (السيطرة ثم التمرير): مجموعات تمرر الكرة عالية ويجب السيطرة قبل التمرير، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ماذا نفعل بالفخذ لحظة ملامسة الكرة؟\nالإجابة: نسحبه للأسفل لامتصاص قوتها.\nس2 (مستوى التطبيق): متى نستخدم وجه القدم الأمامي في الاستلام؟\nالإجابة: للكرات التي تصل إلى مستوى القدم من الأعلى.\nس3 (مستوى الاستدلال): اذكر أجزاء الجسم التي نسيطر بها على الكرة.\nالإجابة: الصدر وأعلى الفخذ ووجه القدم.", "التقويم الختامي": "س1 (مستوى المعرفة): استلم الكرة العالية بأعلى الفخذ ثم مررها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الصدر، بأي جزء تسيطر عليها؟\nالإجابة: بالصدر.\nس3 (مستوى الاستدلال): لماذا نسحب القدم لحظة الملامسة؟\nالإجابة: حتى لا ترتد الكرة بعيدًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالفخذ (دليل المعلم ص 93-97).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}, {"focus": "محطات مهارات كرة القدم للصغار ومباريات مصغرة", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي الدوران بالكرة والتمرير بوجه القدم الداخلي والسيطرة في محطات (15 دقيقة)\n2. يوظف المهارات ويطبق القواعد في مباراة مصغرة (15 دقيقة)\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "- المحطات\n- المباراة المصغرة\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الثلاث ويعرض المحطات ثم تنظيم المباريات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 98: الدوران بالكرة حول الأقماع، التمرير بوجه القدم الداخلي نحو هدف، السيطرة بالفخذ والقدم، الجري بالكرة في مسار 8، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات مصغرة ص 99: فرق من 5 لاعبين، 5 دقائق لكل مباراة، بحكام من الطلبة، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى استخدمتم الدوران بالكرة في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – صافرة الأخلاق: يقوم طالب بدور الحكم ويشرح قاعدة التبديل أو احتساب الهدف لموقف تمثله مجموعته، ويربط ذلك بالأخلاق العمانية في الملعب كاحترام الحكم والمنافس (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الدوران بالكرة والتمرير بوجه القدم الداخلي.\nس2 (مستوى التطبيق): متى استخدمت السيطرة بالفخذ في المباراة؟\nالإجابة: عند استقبال كرة عالية.\nس3 (مستوى الاستدلال): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (مستوى التطبيق): ما المهارة التي ساعدتك أكثر في المباراة؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تصرفت عند الخسارة؟\nالإجابة: صافحت الفريق الآخر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة جزء من مباراة وتسجيل عدد التمريرات والتصويبات (التعلم الذاتي، دليل المعلم ص 99)، ومراجعة قواعد كرة السلة للصغار (ص 100-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، التبديل) (10 دقائق)\n2. يؤدي الجري بالكرة مع الدوران 180 درجة بوجه القدم الخارجي والداخلي (20 دقيقة)\n3. يميز متى يستخدم الدوران بالكرة (10 دقائق)\n\nالحصة 2:\n1. يتعرف النقاط الفنية للتمرير بوجه القدم الداخلي ومتى يستخدم (10 دقائق)\n2. يؤدي التمرير بوجه القدم الداخلي للمسافات المتوسطة والطويلة (20 دقيقة)\n3. يختار نوع التمرير المناسب للمسافة (10 دقائق)\n\nالحصة 3:\n1. يتعرف طرق السيطرة على الكرات العالية (10 دقائق)\n2. يؤدي استلام الكرة بأعلى الفخذ وبوجه القدم الأمامي (20 دقيقة)\n3. يختار جزء الجسم المناسب للسيطرة حسب ارتفاع الكرة (10 دقائق)\n\nالحصة 4:\n1. يؤدي الدوران بالكرة والتمرير بوجه القدم الداخلي والسيطرة في محطات (15 دقيقة)\n2. يوظف المهارات ويطبق القواعد في مباراة مصغرة (15 دقيقة)\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة القدم للصغار\n- الجري بالكرة\n- الدوران بالكرة\n- وجه القدم الخارجي\n- وجه القدم الداخلي\n\nالحصة 2:\n- التمرير\n- وجه القدم الداخلي\n- قدم الارتكاز\n- الكرات العرضية\n\nالحصة 3:\n- السيطرة على الكرة\n- أعلى الفخذ\n- وجه القدم الأمامي\n- الامتصاص\n\nالحصة 4:\n- المحطات\n- المباراة المصغرة\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد كرة القدم للصغار من الصف الخامس ويسأل: كيف نغير اتجاهنا بالكرة للتخلص من المنافس؟ (ص 91-92).\n\nالحصة 2:\nيراجع المعلم التمرير بباطن القدم ويسأل: كيف نمرر لمسافة طويلة أو كرة عرضية؟ (ص 93).\n\nالحصة 3:\nيرمي المعلم كرة عالية لطالب ويسأل: بأي جزء نسيطر عليها قبل أن تسقط؟ (ص 93-94).\n\nالحصة 4:\nيراجع المعلم المهارات الثلاث ويعرض المحطات ثم تنظيم المباريات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة مع تمرينات الإحساس (تنطيط بالقدم والفخذ)، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الجري بالكرة ثم وضع القدم أسفل الكرة وخلفها واللف 180 درجة ودفعها بوجه القدم الخارجي، ثم بوجه القدم الداخلي، ثم الدوران بوضع القدم أعلى الكرة وإرجاعها للخلف، فتطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 96: قطارات، الجري بالكرة ثم الدوران حول القمع والتمرير للتالي، ثم الجري بالكرة في مسار 8 بوجه القدم الخارجي والداخلي، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الاستدارة): ينادي المعلم نوع الدوران فيؤديه الطلبة أثناء الجري بالكرة، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وللخلف قليلًا، أرجحة الرجل الراكلة للخلف ثم للأمام مع لف القدم للخارج، ركل الكرة بوجه القدم الداخلي ومتابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 4 ص 96: قطارات متقابلة بينها 15 م، يمرر الطالب في المنتصف للأول ليركلها بوجه القدم الداخلي للقطار المقابل، ثم تمرير عرضي من الجانب، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة التمرير الطويل بين قمعين من 15 م، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاستلام بأعلى الفخذ (رفع الفخذ لمقابلة الكرة وسحبه لحظة الملامسة لتسقط أمام القدم)، والاستلام بوجه القدم الأمامي (رفع القدم ومد المشط وسحبه للأسفل لحظة الملامسة)، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 1 و5 ص 96-97: صفان متقابلان تبادل رمي الكرة واستلامها بالفخذ أو بوجه القدم الأمامي، ثم الجري بالكرة حول الدائرة والدوران، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (السيطرة ثم التمرير): مجموعات تمرر الكرة عالية ويجب السيطرة قبل التمرير، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 98: الدوران بالكرة حول الأقماع، التمرير بوجه القدم الداخلي نحو هدف، السيطرة بالفخذ والقدم، الجري بالكرة في مسار 8، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات مصغرة ص 99: فرق من 5 لاعبين، 5 دقائق لكل مباراة، بحكام من الطلبة، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى استخدمتم الدوران بالكرة في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – صافرة الأخلاق: يقوم طالب بدور الحكم ويشرح قاعدة التبديل أو احتساب الهدف لموقف تمثله مجموعته، ويربط ذلك بالأخلاق العمانية في الملعب كاحترام الحكم والمنافس (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس2 (مستوى التطبيق): اذكر طريقتين للدوران بالكرة.\nالإجابة: بوجه القدم الخارجي وبوضع القدم أعلى الكرة وإرجاعها.\nس3 (مستوى الاستدلال): متى نستخدم الدوران بالكرة؟\nالإجابة: لتغيير الاتجاه والتخلص من المنافس أو الوصول لوضع التمرير.\n\nالحصة 2:\nس1 (مستوى المعرفة): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة والطويلة والكرات العرضية.\nس2 (مستوى التطبيق): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وللخلف قليلًا.\nس3 (مستوى الاستدلال): ما الفرق بين التمرير بباطن القدم وبوجه القدم الداخلي؟\nالإجابة: الباطن للدقة القصيرة، والداخلي للمسافة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ماذا نفعل بالفخذ لحظة ملامسة الكرة؟\nالإجابة: نسحبه للأسفل لامتصاص قوتها.\nس2 (مستوى التطبيق): متى نستخدم وجه القدم الأمامي في الاستلام؟\nالإجابة: للكرات التي تصل إلى مستوى القدم من الأعلى.\nس3 (مستوى الاستدلال): اذكر أجزاء الجسم التي نسيطر بها على الكرة.\nالإجابة: الصدر وأعلى الفخذ ووجه القدم.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الدوران بالكرة والتمرير بوجه القدم الداخلي.\nس2 (مستوى التطبيق): متى استخدمت السيطرة بالفخذ في المباراة؟\nالإجابة: عند استقبال كرة عالية.\nس3 (مستوى الاستدلال): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الجري بالكرة مع الدوران بوجه القدم الخارجي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الدوران بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي يدفع الكرة بالجزء الخارجي، والداخلي بالجزء الداخلي.\nس3 (مستوى الاستدلال): أدِّ الجري بالكرة في مسار 8.\nالإجابة: يؤديه.\n\nالحصة 2:\nس1 (مستوى المعرفة): مرر الكرة بوجه القدم الداخلي لزميل على بعد 15 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة عرضية من الجناح إلى منطقة الجزاء، أي تمرير تختار؟\nالإجابة: بوجه القدم الداخلي.\nس3 (مستوى الاستدلال): لماذا نلف القدم للخارج قبل الركل؟\nالإجابة: ليلامس وجه القدم الداخلي الكرة بشكل صحيح.\n\nالحصة 3:\nس1 (مستوى المعرفة): استلم الكرة العالية بأعلى الفخذ ثم مررها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الصدر، بأي جزء تسيطر عليها؟\nالإجابة: بالصدر.\nس3 (مستوى الاستدلال): لماذا نسحب القدم لحظة الملامسة؟\nالإجابة: حتى لا ترتد الكرة بعيدًا.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (مستوى التطبيق): ما المهارة التي ساعدتك أكثر في المباراة؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف تصرفت عند الخسارة؟\nالإجابة: صافحت الفريق الآخر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري بالكرة والدوران حول عوائق في مكان آمن (دليل المعلم ص 91-96).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التمرير الطويل نحو هدف في مكان آمن (دليل المعلم ص 93-96).\n\nالحصة 3:\nإرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالفخذ (دليل المعلم ص 93-97).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة جزء من مباراة وتسجيل عدد التمريرات والتصويبات (التعلم الذاتي، دليل المعلم ص 99)، ومراجعة قواعد كرة السلة للصغار (ص 100-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}, {"title": "لعبة كرة السلة للصغار", "unit": "الألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 100-113", "n": 6, "periods": [{"focus": "القواعد القانونية والتمريرة المرتدة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، الفترات، النقاط) (15 دقيقة)\n2. يؤدي التمريرة المرتدة واستلامها (15 دقيقة)\n3. يميز متى تستخدم التمريرة المرتدة (منافس طويل، بعد الخداع) (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة للصغار\n- التمريرة المرتدة\n- نقطة الارتداد\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم قواعد كرة السلة للصغار ويقف طالب طويل أمام ممرر ويسأل: كيف نمرر من تحت ذراعيه؟ (ص 101-104).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج ص 104: وقوف والركبتان منثنيتان، مسك الكرة قريبة من الصدر والمرفقان للأسفل، مد الذراعين ودفع الكرة إلى الأرض عند ثلثي المسافة لترتد إلى مستوى خصر الزميل، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: صفان متقابلان تبادل التمريرة المرتدة مع علامة لنقطة الارتداد، ثم ثلاثيات بمدافع في المنتصف يرفع ذراعيه، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (10 تمريرات مرتدة) بين مجموعتين، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): أين ترتد الكرة في التمريرة المرتدة؟\nالإجابة: عند ثلثي المسافة إلى الزميل.\nس2 (مستوى التطبيق): متى نستخدم التمريرة المرتدة؟\nالإجابة: عند وجود منافس طويل القامة أو بعد الخداع.\nس3 (مستوى الاستدلال): إلى أي مستوى تصل الكرة للزميل؟\nالإجابة: مستوى الخصر.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التمريرة المرتدة لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كم لاعبًا في فريق كرة السلة للصغار داخل الملعب؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس3 (مستوى الاستدلال): ما الفرق بين التمريرة الصدرية والمرتدة؟\nالإجابة: الصدرية مباشرة في الهواء، والمرتدة عبر الأرض.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على التمريرة المرتدة على الحائط (دليل المعلم ص 101-104).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "التمرير من فوق الرأس", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرير من فوق الرأس ومتى يستخدم (10 دقائق)\n2. يؤدي التمرير من فوق الرأس بتحريك الرسغين ومتابعة الحركة (15 دقيقة)\n3. يختار نوع التمريرة حسب موقف المدافع (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع", "المفاهيم": "- التمرير من فوق الرأس\n- الرسغ\n- المدافع القصير\n- المسافة المتوسطة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرة المرتدة ويقف مدافع قصير بين طالبين ويسأل: أي تمريرة الآن؟ (ص 105).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة، رفع الكرة عاليًا فوق الرأس، رمي الكرة بتحريك الرسغين مع مد الذراعين للأمام ومتابعة الحركة، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. ثلاثيات (ممرر، مدافع، مستلم): يختار الممرر المرتدة أو من فوق الرأس حسب طول المدافع ووضع ذراعيه، مع التبديل، ويتدرب الطالب ويختار (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كرة الملك) بالتمريرتين فقط، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير.\nس2 (مستوى التطبيق): ما الذي يعطي الكرة سرعتها في هذه التمريرة؟\nالإجابة: تحريك الرسغين ومد الذراعين.\nس3 (مستوى الاستدلال): المدافع طويل ويرفع ذراعيه، أي تمريرة تختار؟\nالإجابة: المرتدة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر ثلاث تمريرات تعلمتها في كرة السلة للصغار.\nالإجابة: الصدرية والمرتدة ومن فوق الرأس.\nس3 (مستوى الاستدلال): لماذا نتابع الحركة باليدين بعد التمرير؟\nالإجابة: للدقة والقوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "حركات القدمين (الارتكاز)", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف الارتكاز واستخداماته (حماية الكرة، تغيير الاتجاه، أخذ وضع التصويب) (10 دقائق)\n2. يؤدي الارتكاز الأمامي والخلفي مع ثبات قدم الارتكاز (20 دقيقة)\n3. يطبق قاعدة قدم الارتكاز ويميز مخالفة المشي بالكرة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- الارتكاز\n- قدم الارتكاز\n- الارتكاز الأمامي\n- الارتكاز الخلفي\n- المشي بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرات ويمسك الكرة ويحرك قدميه ويسأل: هل هذا قانوني؟ ويقدم الارتكاز (ص 105).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاحتفاظ بقدم ملامسة للأرض (قدم الارتكاز) وتحريك القدم الأخرى للأمام (ارتكاز أمامي) أو للخلف (ارتكاز خلفي) مع حماية الكرة بالجسم، ثم تطبيق موجه داخل الأطواق، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: قطاران متقابلان، استلام الكرة ثم الارتكاز الأمامي والخلفي بقدم الارتكاز داخل الطوق ثم التمرير، ثم مع مدافع يحاول لمس الكرة، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (التمثال): عند الصافرة يثبت الطالب قدم ارتكازه ويحمي الكرة من زميله 5 ثوانٍ، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم التي تبقى ملامسة للأرض ولا تتحرك.\nس2 (مستوى التطبيق): ما استخدامات الارتكاز؟\nالإجابة: حماية الكرة وتغيير الاتجاه وأخذ وضع التصويب.\nس3 (مستوى الاستدلال): ما المخالفة عند رفع قدم الارتكاز؟\nالإجابة: المشي بالكرة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الارتكاز الأمامي والخلفي داخل الطوق.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف تحمي الكرة من المدافع بالارتكاز؟\nالإجابة: أدير جسمي بين الكرة والمدافع مع ثبات قدم الارتكاز.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز الأمامي والخلفي؟\nالإجابة: الأمامي تتحرك القدم الحرة للأمام والخلفي للخلف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على الارتكاز مع ثبات قدم واحدة (دليل المعلم ص 105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "التصويبة السلمية", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (10 دقائق)\n2. يؤدي التصويبة السلمية بخطوتين وارتقاء وتصويب على اللوحة (20 دقيقة)\n3. يميز الأخطاء الشائعة ويصححها (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الارتكاز ويسأل: كيف نصوب من قرب السلة بعد المحاورة؟ ويعرض النقاط الفنية (ص 106).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع ركبة اليمنى بزاوية قائمة، الكرة على أصابع اليد اليمنى مسنودة بالأخرى، التصويب عند أعلى نقطة على اللوحة والهبوط على القدمين، ثم تطبيق موجه بالخطوات داخل الأطواق دون كرة ثم بالكرة، ويقلد الطالب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. قطارات التصويبة السلمية من الجانب الأيمن ثم الأيسر بعد المحاورة، ويعد القائد الإصابات ويصحح الأخطاء (ثلاث خطوات، عدم رفع الركبة)، ويتدرب الطالب ويصحح (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة التصويبة السلمية بين المجموعات، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كم خطوة قبل الارتقاء؟\nالإجابة: خطوتان.\nس2 (مستوى التطبيق): أي ركبة نرفع عند التصويب باليمنى؟\nالإجابة: الركبة اليمنى.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: للتصويب من المسافات القصيرة بعد المحاورة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التصويبة السلمية من الجانب الأيمن.\nالإجابة: يؤديها.\nس2 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات، ما الخطأ؟\nالإجابة: مخالفة المشي بالكرة.\nس3 (مستوى الاستدلال): لماذا نصوب على اللوحة؟\nالإجابة: لأن الكرة ترتد منها إلى السلة بدقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة (دليل المعلم ص 106).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "محطات مهارات كرة السلة للصغار ومنافساتها", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز والتصويبة السلمية في محطات (20 دقيقة)\n2. يوظف المهارات في منافسات (10 دقائق)\n3. يتعاون مع مجموعته ويلتزم بالقواعد (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- المحطات\n- التمرير\n- الارتكاز\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الأربع ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 110: التمريرة المرتدة مع مدافع، التمرير من فوق الرأس لمسافة 6 م، الارتكاز داخل الطوق ثم التمرير، المحاورة والتصويبة السلمية، مع التبديل، ويؤدي الطالب ويبدل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 111: تتابع تمرير ثم محاورة وتصويبة سلمية في 3 دقائق والأكثر نقاطًا تفوز، ويتسابق الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا فشلت بعض التصويبات؟ ليستنتج الطلبة أهمية الخطوتين والارتقاء الصحيح، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المرتدة مع مدافع والتصويبة السلمية.\nس2 (مستوى التطبيق): ما ترتيب منافسة القطار؟\nالإجابة: تمرير متتابع ثم محاورة ثم تصويبة سلمية.\nس3 (مستوى الاستدلال): ما سبب فشل التصويبة السلمية غالبًا؟\nالإجابة: خطوات زائدة أو عدم رفع الركبة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الارتكاز ثم التمريرة المرتدة.\nالإجابة: يؤديهما.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف (دليل المعلم ص 110-111).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "مباريات كرة السلة للصغار وتطبيق القواعد", "num": 6, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية في مباراة كرة سلة للصغار (15 دقيقة)\n2. يوظف المهارات الأساسية أثناء المباراة (15 دقيقة)\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المباراة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد (الفترات، التنطيط المزدوج، المشي بالكرة، النقاط) ويقسم الفرق ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يخطط كل فريق توزيع لاعبيه وأدوارهم، ويخطط الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات ص 112-113: مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل، ميقاتي)، ويلعب الطالب ويحكم (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط تقويمي ص 113: متى تستخدم التمريرة المرتدة والارتكاز في المباراة؟ ليستنتج الطلبة، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – مرتدة من مسندم إلى ظفار: يقف الطلبة في صف يمثل خريطة عمان من مسندم إلى ظفار، ويمررون الكرة تمريرة مرتدة، ويذكر كل مستلم اسم محافظة حتى تصل الكرة إلى ظفار (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كم فترة في مباراة كرة السلة للصغار؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس2 (مستوى التطبيق): متى نستخدم الارتكاز في المباراة؟\nالإجابة: لحماية الكرة أو أخذ وضع التصويب.\nس3 (مستوى الاستدلال): ما دور الميقاتي؟\nالإجابة: ضبط زمن الفترات.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس2 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويبة السلمية.\nس3 (مستوى الاستدلال): كيف تصرفت مع قرار حكم لم يعجبك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة كرة سلة وتحليل التمريرات (التعلم الذاتي، دليل المعلم ص 113)، ومراجعة قواعد الريشة الطائرة (ص 114-116).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، الفترات، النقاط) (15 دقيقة)\n2. يؤدي التمريرة المرتدة واستلامها (15 دقيقة)\n3. يميز متى تستخدم التمريرة المرتدة (منافس طويل، بعد الخداع) (10 دقائق)\n\nالحصة 2:\n1. يتعرف التمرير من فوق الرأس ومتى يستخدم (10 دقائق)\n2. يؤدي التمرير من فوق الرأس بتحريك الرسغين ومتابعة الحركة (15 دقيقة)\n3. يختار نوع التمريرة حسب موقف المدافع (15 دقيقة)\n\nالحصة 3:\n1. يتعرف الارتكاز واستخداماته (حماية الكرة، تغيير الاتجاه، أخذ وضع التصويب) (10 دقائق)\n2. يؤدي الارتكاز الأمامي والخلفي مع ثبات قدم الارتكاز (20 دقيقة)\n3. يطبق قاعدة قدم الارتكاز ويميز مخالفة المشي بالكرة (10 دقائق)\n\nالحصة 4:\n1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (10 دقائق)\n2. يؤدي التصويبة السلمية بخطوتين وارتقاء وتصويب على اللوحة (20 دقيقة)\n3. يميز الأخطاء الشائعة ويصححها (10 دقائق)\n\nالحصة 5:\n1. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز والتصويبة السلمية في محطات (20 دقيقة)\n2. يوظف المهارات في منافسات (10 دقائق)\n3. يتعاون مع مجموعته ويلتزم بالقواعد (10 دقائق)\n\nالحصة 6:\n1. يطبق القواعد القانونية في مباراة كرة سلة للصغار (15 دقيقة)\n2. يوظف المهارات الأساسية أثناء المباراة (15 دقيقة)\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 6:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 5:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 6:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة السلة للصغار\n- التمريرة المرتدة\n- نقطة الارتداد\n- القواعد القانونية\n\nالحصة 2:\n- التمرير من فوق الرأس\n- الرسغ\n- المدافع القصير\n- المسافة المتوسطة\n\nالحصة 3:\n- الارتكاز\n- قدم الارتكاز\n- الارتكاز الأمامي\n- الارتكاز الخلفي\n- المشي بالكرة\n\nالحصة 4:\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n\nالحصة 5:\n- المحطات\n- التمرير\n- الارتكاز\n- التصويب\n- المنافسة\n\nالحصة 6:\n- المباراة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد كرة السلة للصغار ويقف طالب طويل أمام ممرر ويسأل: كيف نمرر من تحت ذراعيه؟ (ص 101-104).\n\nالحصة 2:\nيراجع المعلم التمريرة المرتدة ويقف مدافع قصير بين طالبين ويسأل: أي تمريرة الآن؟ (ص 105).\n\nالحصة 3:\nيراجع المعلم التمريرات ويمسك الكرة ويحرك قدميه ويسأل: هل هذا قانوني؟ ويقدم الارتكاز (ص 105).\n\nالحصة 4:\nيراجع المعلم الارتكاز ويسأل: كيف نصوب من قرب السلة بعد المحاورة؟ ويعرض النقاط الفنية (ص 106).\n\nالحصة 5:\nيراجع المعلم المهارات الأربع ويعرض المحطات.\n\nالحصة 6:\nيراجع المعلم القواعد (الفترات، التنطيط المزدوج، المشي بالكرة، النقاط) ويقسم الفرق ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج ص 104: وقوف والركبتان منثنيتان، مسك الكرة قريبة من الصدر والمرفقان للأسفل، مد الذراعين ودفع الكرة إلى الأرض عند ثلثي المسافة لترتد إلى مستوى خصر الزميل، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: صفان متقابلان تبادل التمريرة المرتدة مع علامة لنقطة الارتداد، ثم ثلاثيات بمدافع في المنتصف يرفع ذراعيه، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (10 تمريرات مرتدة) بين مجموعتين، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة، رفع الكرة عاليًا فوق الرأس، رمي الكرة بتحريك الرسغين مع مد الذراعين للأمام ومتابعة الحركة، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. ثلاثيات (ممرر، مدافع، مستلم): يختار الممرر المرتدة أو من فوق الرأس حسب طول المدافع ووضع ذراعيه، مع التبديل، ويتدرب الطالب ويختار (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كرة الملك) بالتمريرتين فقط، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاحتفاظ بقدم ملامسة للأرض (قدم الارتكاز) وتحريك القدم الأخرى للأمام (ارتكاز أمامي) أو للخلف (ارتكاز خلفي) مع حماية الكرة بالجسم، ثم تطبيق موجه داخل الأطواق، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: قطاران متقابلان، استلام الكرة ثم الارتكاز الأمامي والخلفي بقدم الارتكاز داخل الطوق ثم التمرير، ثم مع مدافع يحاول لمس الكرة، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (التمثال): عند الصافرة يثبت الطالب قدم ارتكازه ويحمي الكرة من زميله 5 ثوانٍ، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع ركبة اليمنى بزاوية قائمة، الكرة على أصابع اليد اليمنى مسنودة بالأخرى، التصويب عند أعلى نقطة على اللوحة والهبوط على القدمين، ثم تطبيق موجه بالخطوات داخل الأطواق دون كرة ثم بالكرة، ويقلد الطالب بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. قطارات التصويبة السلمية من الجانب الأيمن ثم الأيسر بعد المحاورة، ويعد القائد الإصابات ويصحح الأخطاء (ثلاث خطوات، عدم رفع الركبة)، ويتدرب الطالب ويصحح (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة التصويبة السلمية بين المجموعات، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 5 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 110: التمريرة المرتدة مع مدافع، التمرير من فوق الرأس لمسافة 6 م، الارتكاز داخل الطوق ثم التمرير، المحاورة والتصويبة السلمية، مع التبديل، ويؤدي الطالب ويبدل (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 111: تتابع تمرير ثم محاورة وتصويبة سلمية في 3 دقائق والأكثر نقاطًا تفوز، ويتسابق الطالب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا فشلت بعض التصويبات؟ ليستنتج الطلبة أهمية الخطوتين والارتقاء الصحيح، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 6 — زمن الحصة 40 دقيقة\n\n1. إحماء بالكرة، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يخطط كل فريق توزيع لاعبيه وأدوارهم، ويخطط الطالب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات ص 112-113: مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل، ميقاتي)، ويلعب الطالب ويحكم (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. نشاط تقويمي ص 113: متى تستخدم التمريرة المرتدة والارتكاز في المباراة؟ ليستنتج الطلبة، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – مرتدة من مسندم إلى ظفار: يقف الطلبة في صف يمثل خريطة عمان من مسندم إلى ظفار، ويمررون الكرة تمريرة مرتدة، ويذكر كل مستلم اسم محافظة حتى تصل الكرة إلى ظفار (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): أين ترتد الكرة في التمريرة المرتدة؟\nالإجابة: عند ثلثي المسافة إلى الزميل.\nس2 (مستوى التطبيق): متى نستخدم التمريرة المرتدة؟\nالإجابة: عند وجود منافس طويل القامة أو بعد الخداع.\nس3 (مستوى الاستدلال): إلى أي مستوى تصل الكرة للزميل؟\nالإجابة: مستوى الخصر.\n\nالحصة 2:\nس1 (مستوى المعرفة): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير.\nس2 (مستوى التطبيق): ما الذي يعطي الكرة سرعتها في هذه التمريرة؟\nالإجابة: تحريك الرسغين ومد الذراعين.\nس3 (مستوى الاستدلال): المدافع طويل ويرفع ذراعيه، أي تمريرة تختار؟\nالإجابة: المرتدة.\n\nالحصة 3:\nس1 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم التي تبقى ملامسة للأرض ولا تتحرك.\nس2 (مستوى التطبيق): ما استخدامات الارتكاز؟\nالإجابة: حماية الكرة وتغيير الاتجاه وأخذ وضع التصويب.\nس3 (مستوى الاستدلال): ما المخالفة عند رفع قدم الارتكاز؟\nالإجابة: المشي بالكرة.\n\nالحصة 4:\nس1 (مستوى المعرفة): كم خطوة قبل الارتقاء؟\nالإجابة: خطوتان.\nس2 (مستوى التطبيق): أي ركبة نرفع عند التصويب باليمنى؟\nالإجابة: الركبة اليمنى.\nس3 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: للتصويب من المسافات القصيرة بعد المحاورة.\n\nالحصة 5:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المرتدة مع مدافع والتصويبة السلمية.\nس2 (مستوى التطبيق): ما ترتيب منافسة القطار؟\nالإجابة: تمرير متتابع ثم محاورة ثم تصويبة سلمية.\nس3 (مستوى الاستدلال): ما سبب فشل التصويبة السلمية غالبًا؟\nالإجابة: خطوات زائدة أو عدم رفع الركبة.\n\nالحصة 6:\nس1 (مستوى المعرفة): كم فترة في مباراة كرة السلة للصغار؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس2 (مستوى التطبيق): متى نستخدم الارتكاز في المباراة؟\nالإجابة: لحماية الكرة أو أخذ وضع التصويب.\nس3 (مستوى الاستدلال): ما دور الميقاتي؟\nالإجابة: ضبط زمن الفترات.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ التمريرة المرتدة لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كم لاعبًا في فريق كرة السلة للصغار داخل الملعب؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس3 (مستوى الاستدلال): ما الفرق بين التمريرة الصدرية والمرتدة؟\nالإجابة: الصدرية مباشرة في الهواء، والمرتدة عبر الأرض.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر ثلاث تمريرات تعلمتها في كرة السلة للصغار.\nالإجابة: الصدرية والمرتدة ومن فوق الرأس.\nس3 (مستوى الاستدلال): لماذا نتابع الحركة باليدين بعد التمرير؟\nالإجابة: للدقة والقوة.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ الارتكاز الأمامي والخلفي داخل الطوق.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف تحمي الكرة من المدافع بالارتكاز؟\nالإجابة: أدير جسمي بين الكرة والمدافع مع ثبات قدم الارتكاز.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز الأمامي والخلفي؟\nالإجابة: الأمامي تتحرك القدم الحرة للأمام والخلفي للخلف.\n\nالحصة 4:\nس1 (مستوى المعرفة): أدِّ التصويبة السلمية من الجانب الأيمن.\nالإجابة: يؤديها.\nس2 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات، ما الخطأ؟\nالإجابة: مخالفة المشي بالكرة.\nس3 (مستوى الاستدلال): لماذا نصوب على اللوحة؟\nالإجابة: لأن الكرة ترتد منها إلى السلة بدقة.\n\nالحصة 5:\nس1 (مستوى المعرفة): أدِّ الارتكاز ثم التمريرة المرتدة.\nالإجابة: يؤديهما.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nالحصة 6:\nس1 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس2 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويبة السلمية.\nس3 (مستوى الاستدلال): كيف تصرفت مع قرار حكم لم يعجبك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طالبك على التمريرة المرتدة على الحائط (دليل المعلم ص 101-104).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105).\n\nالحصة 3:\nإرشاد لولي الأمر: تدرب مع طالبك على الارتكاز مع ثبات قدم واحدة (دليل المعلم ص 105).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة (دليل المعلم ص 106).\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف (دليل المعلم ص 110-111).\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة كرة سلة وتحليل التمريرات (التعلم الذاتي، دليل المعلم ص 113)، ومراجعة قواعد الريشة الطائرة (ص 114-116).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"title": "لعبة الريشة الطائرة", "unit": "الألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 114-125", "n": 4, "periods": [{"focus": "القواعد القانونية وقبضة المضرب والإرسال بوجه المضرب الأمامي", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية للريشة الطائرة (الملعب، الإرسال، النقاط) (10 دقائق)\n2. يؤدي قبضة المضرب (مسكة V) والإرسال بوجه المضرب الأمامي نحو مناطق محددة (20 دقيقة)\n3. يقدر أهمية الإرسال الدقيق في بدء اللعب (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أطواق\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- الريشة الطائرة\n- قبضة المضرب (V)\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد ومسكة V من الصف الخامس ويسأل: كيف يبدأ اللعب؟ ويعرض الإرسال (ص 117-118).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء: جري، خطو جانبي، تحريك الرسغين، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة، مسك المضرب باليد المعاكسة للقدم المتقدمة بمسكة V، مسك الريشة بأصابع اليد الأخرى وإسقاطها على الوجه الأمامي للمضرب مع أرجحته للخلف ثم للأمام لضربها أسفل الخصر نحو المنافس، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 121: الإرسال نحو الأطواق في الملعب المقابل ويعد القائد الإصابات، ثم الإرسال فوق الحبل للزميل، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة الإرسال نحو المناطق بين مجموعتين، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف نمسك المضرب؟\nالإجابة: بمسكة V (الإبهام والسبابة حرف V على المقبض).\nس2 (مستوى التطبيق): بأي يد نمسك المضرب بالنسبة للقدم المتقدمة؟\nالإجابة: باليد المعاكسة.\nس3 (مستوى الاستدلال): أين تضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الإرسال بوجه المضرب الأمامي نحو الطوق 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد الإرسال.\nالإجابة: من منطقة الإرسال وأسفل الخصر.\nس3 (مستوى الاستدلال): لماذا يهم الإرسال الدقيق؟\nالإجابة: لإرباك المنافس وإحراز النقاط.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف في المنزل (دليل المعلم ص 117-118).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}, {"focus": "ضرب الريشة بوجه المضرب الخلفي", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للضرب بوجه المضرب الخلفي ومتى يستخدم (10 دقائق)\n2. يؤدي ضرب الريشة بوجه المضرب الخلفي من مستويات مختلفة (20 دقيقة)\n3. يميز بين الضرب بوجه المضرب الأمامي والخلفي (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أقماع", "المفاهيم": "- وجه المضرب الخلفي\n- ظهر اليد\n- المرجحة\n- الريشة القادمة للجهة المعاكسة", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الريشة إلى الجهة المعاكسة لليد الضاربة ويسأل: كيف نضربها دون تغيير اليد؟ (ص 118).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك المضرب والنظر إلى الريشة، رفع المضرب عاليًا مع مواجهة ظهر اليد للريشة، مرجحة المضرب وضرب الريشة بوجهه الخلفي وتوجيهها، ثم تطبيق موجه بريشة مرمية، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 121-122: رمي الريشة للزميل جهة ظهر اليد وضربها بوجه المضرب الخلفي نحوه، ثم تبادل الضرب بالوجهين الأمامي والخلفي دون شبكة، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أمامي أم خلفي): ينادي المعلم ويرمي الريشة فيضربها الطالب بالوجه الصحيح، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): متى نستخدم وجه المضرب الخلفي؟\nالإجابة: للريشة القادمة أمام الجسم أو باتجاه الجهة المعاكسة لليد الضاربة.\nس2 (مستوى التطبيق): ما وضع ظهر اليد عند الضرب الخلفي؟\nالإجابة: يواجه الريشة.\nس3 (مستوى الاستدلال): ما الفرق بين الضربتين؟\nالإجابة: الأمامية من جهة راحة اليد والخلفية من جهة ظهر اليد.", "التقويم الختامي": "س1 (مستوى المعرفة): اضرب الريشة القادمة جهة ظهر يدك بوجه المضرب الخلفي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): الريشة قادمة إلى يمينك وأنت أيمن، أي وجه تستخدم؟\nالإجابة: الأمامي.\nس3 (مستوى الاستدلال): لماذا نرفع المضرب عاليًا قبل الضرب؟\nالإجابة: لإعطاء المرجحة قوة ومدى.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالوجهين (دليل المعلم ص 118-122).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}, {"focus": "حركات القدمين (التحرك للجانبين) والمحطات", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي حركات القدمين للجانبين بالخطو والطعن لضرب الريشة (25 دقيقة)\n2. يربط حركة الرجلين بأرجحة الذراع الضاربة (5 دقائق)\n3. يؤدي مهارات الريشة في محطات متكاملة (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شبكة أو حبل", "المفاهيم": "- حركات القدمين\n- الطعن للجانب\n- التوافق\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الريشة بعيدًا إلى جانب طالب ويسأل: كيف يصل إليها بسرعة ويعود؟ (ص 119).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء مع الطعن للجانبين، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة باتجاه الريشة، ثني ركبة الرجل القريبة والطعن للجانب، توافق حركة الرجلين مع أرجحة الذراع الضاربة، والذراع الحرة للتوازن، ثم العودة إلى المنتصف، فتطبيق موجه، ويقلد الطالب ويطبق (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات ص 123: الإرسال نحو المربعات، الضرب بالوجه الخلفي، التحرك للجانبين لضرب ريشة مرمية، تبادل الضرب دون سقوط، مع التبديل، ويؤدي الطالب ويبدل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الركنان): رمي الريشة إلى الركنين والتحرك لضربها ثم العودة للمنتصف، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف نتحرك لريشة قادمة إلى الجانب؟\nالإجابة: بخطوة أو عدة خطوات جانبية والطعن بالرجل القريبة.\nس2 (مستوى التطبيق): لماذا نحرك الذراع الحرة؟\nالإجابة: لحفظ توازن الجسم.\nس3 (مستوى الاستدلال): لماذا نعود للمنتصف بعد الضرب؟\nالإجابة: للاستعداد للريشة التالية.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الطعن للجانب وضرب الريشة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات والضرب الخلفي.\nس3 (مستوى الاستدلال): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب بتوازن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التحرك للجانبين لضرب ريشة يرميها زميل (دليل المعلم ص 119-123).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}, {"focus": "مباريات الريشة الطائرة وتطبيق القواعد", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية للريشة الطائرة في مباريات فردية وزوجية (20 دقيقة)\n2. يوظف الإرسال والضرب بالوجهين وحركات القدمين في المباراة (10 دقائق)\n3. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "- المباراة\n- احتساب النقاط\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد (الإرسال، النقاط، خروج الريشة) وينظم المباريات ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تدريب تبادل الضرب في أزواج فوق الشبكة مع العد، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات ص 124-125: مباريات فردية وزوجية حتى 7 نقاط بحكام من الطلبة، ويلعب الطالب ويحكم (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى خسرتم النقاط؟ ليستنتج الطلبة أهمية العودة للمنتصف والإرسال الدقيق، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – إرسال إلى معالم مسقط: يحدد المعلم مناطق في ملعب الريشة تحمل أسماء معالم مثل جامع السلطان قابوس الأكبر ودار الأوبرا السلطانية وقلعة الجلالي، ويرسل الأزواج نحوها لجمع النقاط (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): متى تحتسب النقطة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها بعد ضربه.\nس2 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.\nس3 (مستوى الاستدلال): ما الفرق بين المباراة الفردية والزوجية؟\nالإجابة: الفردية لاعب ضد لاعب والزوجية اثنان ضد اثنين.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الإرسال أسفل الخصر.\nس2 (مستوى التطبيق): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة ريشة طائرة وتسجيل عدد الإرسالات (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية للريشة الطائرة (الملعب، الإرسال، النقاط) (10 دقائق)\n2. يؤدي قبضة المضرب (مسكة V) والإرسال بوجه المضرب الأمامي نحو مناطق محددة (20 دقيقة)\n3. يقدر أهمية الإرسال الدقيق في بدء اللعب (10 دقائق)\n\nالحصة 2:\n1. يتعرف النقاط الفنية للضرب بوجه المضرب الخلفي ومتى يستخدم (10 دقائق)\n2. يؤدي ضرب الريشة بوجه المضرب الخلفي من مستويات مختلفة (20 دقيقة)\n3. يميز بين الضرب بوجه المضرب الأمامي والخلفي (10 دقائق)\n\nالحصة 3:\n1. يؤدي حركات القدمين للجانبين بالخطو والطعن لضرب الريشة (25 دقيقة)\n2. يربط حركة الرجلين بأرجحة الذراع الضاربة (5 دقائق)\n3. يؤدي مهارات الريشة في محطات متكاملة (10 دقائق)\n\nالحصة 4:\n1. يطبق القواعد القانونية للريشة الطائرة في مباريات فردية وزوجية (20 دقيقة)\n2. يوظف الإرسال والضرب بالوجهين وحركات القدمين في المباراة (10 دقائق)\n3. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أطواق\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شبكة أو حبل\n\nالحصة 4:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الريشة الطائرة\n- قبضة المضرب (V)\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال\n\nالحصة 2:\n- وجه المضرب الخلفي\n- ظهر اليد\n- المرجحة\n- الريشة القادمة للجهة المعاكسة\n\nالحصة 3:\n- حركات القدمين\n- الطعن للجانب\n- التوافق\n- المحطات\n\nالحصة 4:\n- المباراة\n- احتساب النقاط\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم القواعد ومسكة V من الصف الخامس ويسأل: كيف يبدأ اللعب؟ ويعرض الإرسال (ص 117-118).\n\nالحصة 2:\nيرمي المعلم الريشة إلى الجهة المعاكسة لليد الضاربة ويسأل: كيف نضربها دون تغيير اليد؟ (ص 118).\n\nالحصة 3:\nيرمي المعلم الريشة بعيدًا إلى جانب طالب ويسأل: كيف يصل إليها بسرعة ويعود؟ (ص 119).\n\nالحصة 4:\nيراجع المعلم القواعد (الإرسال، النقاط، خروج الريشة) وينظم المباريات ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء: جري، خطو جانبي، تحريك الرسغين، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة، مسك المضرب باليد المعاكسة للقدم المتقدمة بمسكة V، مسك الريشة بأصابع اليد الأخرى وإسقاطها على الوجه الأمامي للمضرب مع أرجحته للخلف ثم للأمام لضربها أسفل الخصر نحو المنافس، ثم تطبيق موجه، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 121: الإرسال نحو الأطواق في الملعب المقابل ويعد القائد الإصابات، ثم الإرسال فوق الحبل للزميل، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة الإرسال نحو المناطق بين مجموعتين، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: مسك المضرب والنظر إلى الريشة، رفع المضرب عاليًا مع مواجهة ظهر اليد للريشة، مرجحة المضرب وضرب الريشة بوجهه الخلفي وتوجيهها، ثم تطبيق موجه بريشة مرمية، ويقلد الطالب ويطبق (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 121-122: رمي الريشة للزميل جهة ظهر اليد وضربها بوجه المضرب الخلفي نحوه، ثم تبادل الضرب بالوجهين الأمامي والخلفي دون شبكة، ويتدرب الطالب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (أمامي أم خلفي): ينادي المعلم ويرمي الريشة فيضربها الطالب بالوجه الصحيح، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء مع الطعن للجانبين، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة باتجاه الريشة، ثني ركبة الرجل القريبة والطعن للجانب، توافق حركة الرجلين مع أرجحة الذراع الضاربة، والذراع الحرة للتوازن، ثم العودة إلى المنتصف، فتطبيق موجه، ويقلد الطالب ويطبق (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات ص 123: الإرسال نحو المربعات، الضرب بالوجه الخلفي، التحرك للجانبين لضرب ريشة مرمية، تبادل الضرب دون سقوط، مع التبديل، ويؤدي الطالب ويبدل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الركنان): رمي الريشة إلى الركنين والتحرك لضربها ثم العودة للمنتصف، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تدريب تبادل الضرب في أزواج فوق الشبكة مع العد، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. مباريات ص 124-125: مباريات فردية وزوجية حتى 7 نقاط بحكام من الطلبة، ويلعب الطالب ويحكم (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: متى خسرتم النقاط؟ ليستنتج الطلبة أهمية العودة للمنتصف والإرسال الدقيق، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – إرسال إلى معالم مسقط: يحدد المعلم مناطق في ملعب الريشة تحمل أسماء معالم مثل جامع السلطان قابوس الأكبر ودار الأوبرا السلطانية وقلعة الجلالي، ويرسل الأزواج نحوها لجمع النقاط (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): كيف نمسك المضرب؟\nالإجابة: بمسكة V (الإبهام والسبابة حرف V على المقبض).\nس2 (مستوى التطبيق): بأي يد نمسك المضرب بالنسبة للقدم المتقدمة؟\nالإجابة: باليد المعاكسة.\nس3 (مستوى الاستدلال): أين تضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\n\nالحصة 2:\nس1 (مستوى المعرفة): متى نستخدم وجه المضرب الخلفي؟\nالإجابة: للريشة القادمة أمام الجسم أو باتجاه الجهة المعاكسة لليد الضاربة.\nس2 (مستوى التطبيق): ما وضع ظهر اليد عند الضرب الخلفي؟\nالإجابة: يواجه الريشة.\nس3 (مستوى الاستدلال): ما الفرق بين الضربتين؟\nالإجابة: الأمامية من جهة راحة اليد والخلفية من جهة ظهر اليد.\n\nالحصة 3:\nس1 (مستوى المعرفة): كيف نتحرك لريشة قادمة إلى الجانب؟\nالإجابة: بخطوة أو عدة خطوات جانبية والطعن بالرجل القريبة.\nس2 (مستوى التطبيق): لماذا نحرك الذراع الحرة؟\nالإجابة: لحفظ توازن الجسم.\nس3 (مستوى الاستدلال): لماذا نعود للمنتصف بعد الضرب؟\nالإجابة: للاستعداد للريشة التالية.\n\nالحصة 4:\nس1 (مستوى المعرفة): متى تحتسب النقطة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها بعد ضربه.\nس2 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.\nس3 (مستوى الاستدلال): ما الفرق بين المباراة الفردية والزوجية؟\nالإجابة: الفردية لاعب ضد لاعب والزوجية اثنان ضد اثنين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الإرسال بوجه المضرب الأمامي نحو الطوق 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد الإرسال.\nالإجابة: من منطقة الإرسال وأسفل الخصر.\nس3 (مستوى الاستدلال): لماذا يهم الإرسال الدقيق؟\nالإجابة: لإرباك المنافس وإحراز النقاط.\n\nالحصة 2:\nس1 (مستوى المعرفة): اضرب الريشة القادمة جهة ظهر يدك بوجه المضرب الخلفي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): الريشة قادمة إلى يمينك وأنت أيمن، أي وجه تستخدم؟\nالإجابة: الأمامي.\nس3 (مستوى الاستدلال): لماذا نرفع المضرب عاليًا قبل الضرب؟\nالإجابة: لإعطاء المرجحة قوة ومدى.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ الطعن للجانب وضرب الريشة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات والضرب الخلفي.\nس3 (مستوى الاستدلال): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب بتوازن.\n\nالحصة 4:\nس1 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الإرسال أسفل الخصر.\nس2 (مستوى التطبيق): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف في المنزل (دليل المعلم ص 117-118).\n\nالحصة 2:\nإرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالوجهين (دليل المعلم ص 118-122).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التحرك للجانبين لضرب ريشة يرميها زميل (دليل المعلم ص 119-123).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة ريشة طائرة وتسجيل عدد الإرسالات (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 89-125 (الألعاب الحركية 1)", "n": 2, "periods": [{"focus": "اختبار عملي في مهارات كرة القدم للصغار وكرة السلة للصغار", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الجري بالكرة مع الدوران والتمرير بوجه القدم الداخلي والسيطرة بالفخذ (20 دقيقة)\n2. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز (10 دقائق)\n3. يؤدي التصويبة السلمية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- الاختبار العملي\n- كرة القدم للصغار\n- كرة السلة للصغار", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار ومعاييره.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة  إلى تطويرها، ويحدد الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – الإحماء يحمي أبطالنا: يحصل كل طالب في المجموعة على رقم، ويسأل المعلم عن مرحلة من الإحماء أو إصابة يقي منها، ويجيب صاحب الرقم، ويذكّر بأن الرياضيين العمانيين يبدؤون بالإحماء دائمًا (3 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): لماذا نبدأ الحصة بالإعداد البدني؟\nالإجابة: لرفع حرارة العضلات والاستعداد ومنع الإصابة.\nس2 (مستوى التطبيق): اذكر تمرينًا للجذع.\nالإجابة: لف الجذع.\nس3 (مستوى الاستدلال): ما ترتيب الإحماء؟\nالإجابة: من الخفيف إلى الأقوى.\n\nس4 (مستوى المعرفة): ما تسلسل الوثب الثلاثي؟\nالإجابة: حجلة، خطوة، وثبة.\nس5 (مستوى التطبيق): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس6 (مستوى الاستدلال): من أي مستوى تؤدى التمريرة الصدرية؟\nالإجابة: من الصدر.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاث قواعد للأمن والسلامة.\nالإجابة: الاستجابة للصافرة، الإحماء، الحذاء الرياضي.\nس2 (مستوى التطبيق): أدِّ تمرينًا للرجلين بالعد الثماني.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك عرض الإحماء؟\nالإجابة: يعد القائد ونؤدي معًا.\n\nس4 (مستوى المعرفة): أدِّ الوثب الطويل من الاقتراب.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): أدِّ التمريرة الصدرية ثم التصويب من الثبات.\nالإجابة: يؤديهما.\nس6 (مستوى الاستدلال): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك نماذج الإعداد البدني في دليل المعلم.\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها، ومراجعة مفهوم اللياقة البدنية (دليل المعلم ص 34-35).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=1"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتذكر قواعد الأمن والسلامة ومراحل الإحماء (5 دقائق)\n2. يؤدي تمرينات إعداد بدني عام بالعد (10 دقائق)\n3. يقدر أهمية الإعداد البدني في الوقاية من الإصابات (5 دقائق)\n4.
