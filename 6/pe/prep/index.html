ات الاختبار.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار فردي: محطة 1 نمط مركب في سلم الرشاقة + رمي الكرة والتصفيق ومسكها 10 مرات، محطة 2 انبطاح مائل ثني الذراعين (العدد في 30 ثانية) + رمي الكرة الطبية للأمام، محطة 3 عدو 20 م بالزمن + مسار موانع قصير؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة ختامية.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (25 دقائق):\n- الاستراتيجية: التعلم الذاتي\n- المعلم: اختبار فردي: محطة 1 البدء المنخفض وعدو 30 م بالزمن، محطة 2 الوثب العالي الظهري (3 محاولات)، محطة 3 دفع الكرة الطبية (3 محاولات) + سؤال قواعد؛ ويرصد المعلم.\n- الطالب: يؤدي عند دوره ويتدرب مستقلًا.\n\nالنشاط 3 (4 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق ختامي قصير.\n- الطالب: يلعب.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما العنصر الذي يقيسه ثني الذراعين؟\nالإجابة: القوة العضلية.\nس2 (المستوى المتوقع): ما العنصر الذي يقيسه عدو 20 م؟\nالإجابة: السرعة.\nس3 (المستوى المتقدم): ما العنصر الذي يقيسه سلم الرشاقة؟\nالإجابة: التوافق (والرشاقة).\n\nالحصة 2:\nس1 (مستوى الدعم): ما أقسام البدء المنخفض؟\nالإجابة: خذ مكانك، استعد، انطلق.\nس2 (المستوى المتوقع): بأي قدم نرتقي في الوثب العالي الظهري؟\nالإجابة: بالقدم البعيدة عن العارضة.\nس3 (المستوى المتقدم): هل يجوز رمي الكرة الطبية في المسابقة؟\nالإجابة: لا، تدفع بيد واحدة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر تمرينًا لكل عنصر من العناصر الثلاثة.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أدِّ مسار الموانع.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): أي العناصر تحتاج إلى تطوير وكيف؟\nالإجابة: يذكر وخطة.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب العالي الظهري.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ دفع الكرة الطبية.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): أي المسابقات أتقنتها أكثر ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: راجع مع طالبك مهارات ألعاب القوى قبل الحصة الثانية من الاختبار.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على مراجعة قواعد كرة القدم للصغار (دليل المعلم ص 89-91) استعدادًا للأسبوع القادم."}}, {"title": "لعبة كرة القدم للصغار", "unit": "الألعاب الحركية (1)", "week": "الثامن – التاسع", "date": "25-29/10/2026 إلى 1-5/11/2026", "pages": "دليل المعلم ص 89-99", "n": 4, "periods": [{"focus": "القواعد القانونية والجري بالكرة مع الدوران (بوجه القدم الخارجي والداخلي)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، التبديل).\n2. يؤدي الجري بالكرة مع الدوران 180 درجة بوجه القدم الخارجي والداخلي.\n3. يميز متى يستخدم الدوران بالكرة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم للصغار\n- الجري بالكرة\n- الدوران بالكرة\n- وجه القدم الخارجي\n- وجه القدم الداخلي", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم قواعد كرة القدم للصغار من الصف الخامس ويسأل: كيف نغير اتجاهنا بالكرة للتخلص من المنافس؟ (ص 91-92).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة مع تمرينات الإحساس (تنطيط بالقدم والفخذ).\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الجري بالكرة ثم وضع القدم أسفل الكرة وخلفها واللف 180 درجة ودفعها بوجه القدم الخارجي، ثم بوجه القدم الداخلي، ثم الدوران بوضع القدم أعلى الكرة وإرجاعها للخلف، فتطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 3 ص 96: قطارات، الجري بالكرة ثم الدوران حول القمع والتمرير للتالي، ثم الجري بالكرة في مسار 8 بوجه القدم الخارجي والداخلي.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الاستدارة): ينادي المعلم نوع الدوران فيؤديه الطلبة أثناء الجري بالكرة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس2 (المستوى المتوقع): اذكر طريقتين للدوران بالكرة.\nالإجابة: بوجه القدم الخارجي وبوضع القدم أعلى الكرة وإرجاعها.\nس3 (المستوى المتقدم): متى نستخدم الدوران بالكرة؟\nالإجابة: لتغيير الاتجاه والتخلص من المنافس أو الوصول لوضع التمرير.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الجري بالكرة مع الدوران بوجه القدم الخارجي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين الدوران بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي يدفع الكرة بالجزء الخارجي، والداخلي بالجزء الداخلي.\nس3 (المستوى المتقدم): أدِّ الجري بالكرة في مسار 8.\nالإجابة: يؤديه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري بالكرة والدوران حول عوائق في مكان آمن (دليل المعلم ص 91-96)."}}, {"focus": "التمرير بوجه القدم الداخلي", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتمرير بوجه القدم الداخلي ومتى يستخدم.\n2. يؤدي التمرير بوجه القدم الداخلي للمسافات المتوسطة والطويلة.\n3. يختار نوع التمرير المناسب للمسافة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التمرير\n- وجه القدم الداخلي\n- قدم الارتكاز\n- الكرات العرضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمرير بباطن القدم ويسأل: كيف نمرر لمسافة طويلة أو كرة عرضية؟ (ص 93).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وللخلف قليلًا، أرجحة الرجل الراكلة للخلف ثم للأمام مع لف القدم للخارج، ركل الكرة بوجه القدم الداخلي ومتابعة الحركة، ثم تطبيق موجه من الثبات.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 4 ص 96: قطارات متقابلة بينها 15 م، يمرر الطالب في المنتصف للأول ليركلها بوجه القدم الداخلي للقطار المقابل، ثم تمرير عرضي من الجانب.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التمرير الطويل بين قمعين من 15 م.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة والطويلة والكرات العرضية.\nس2 (المستوى المتوقع): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وللخلف قليلًا.\nس3 (المستوى المتقدم): ما الفرق بين التمرير بباطن القدم وبوجه القدم الداخلي؟\nالإجابة: الباطن للدقة القصيرة، والداخلي للمسافة.", "التقويم الختامي": "س1 (مستوى الدعم): مرر الكرة بوجه القدم الداخلي لزميل على بعد 15 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة عرضية من الجناح إلى منطقة الجزاء، أي تمرير تختار؟\nالإجابة: بوجه القدم الداخلي.\nس3 (المستوى المتقدم): لماذا نلف القدم للخارج قبل الركل؟\nالإجابة: ليلامس وجه القدم الداخلي الكرة بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التمرير الطويل نحو هدف في مكان آمن (دليل المعلم ص 93-96)."}}, {"focus": "السيطرة على الكرة (بأعلى الفخذ ووجه القدم الأمامي)", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف طرق السيطرة على الكرات العالية.\n2. يؤدي استلام الكرة بأعلى الفخذ وبوجه القدم الأمامي.\n3. يختار جزء الجسم المناسب للسيطرة حسب ارتفاع الكرة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع", "المفاهيم": "- السيطرة على الكرة\n- أعلى الفخذ\n- وجه القدم الأمامي\n- الامتصاص", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم كرة عالية لطالب ويسأل: بأي جزء نسيطر عليها قبل أن تسقط؟ (ص 93-94).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاستلام بأعلى الفخذ (رفع الفخذ لمقابلة الكرة وسحبه لحظة الملامسة لتسقط أمام القدم)، والاستلام بوجه القدم الأمامي (رفع القدم ومد المشط وسحبه للأسفل لحظة الملامسة)، ثم تطبيق موجه برمي الكرة باليدين.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 1 و5 ص 96-97: صفان متقابلان تبادل رمي الكرة واستلامها بالفخذ أو بوجه القدم الأمامي، ثم الجري بالكرة حول الدائرة والدوران.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (السيطرة ثم التمرير): مجموعات تمرر الكرة عالية ويجب السيطرة قبل التمرير.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ماذا نفعل بالفخذ لحظة ملامسة الكرة؟\nالإجابة: نسحبه للأسفل لامتصاص قوتها.\nس2 (المستوى المتوقع): متى نستخدم وجه القدم الأمامي في الاستلام؟\nالإجابة: للكرات التي تصل إلى مستوى القدم من الأعلى.\nس3 (المستوى المتقدم): اذكر أجزاء الجسم التي نسيطر بها على الكرة.\nالإجابة: الصدر وأعلى الفخذ ووجه القدم.", "التقويم الختامي": "س1 (مستوى الدعم): استلم الكرة العالية بأعلى الفخذ ثم مررها.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة قادمة في مستوى الصدر، بأي جزء تسيطر عليها؟\nالإجابة: بالصدر.\nس3 (المستوى المتقدم): لماذا نسحب القدم لحظة الملامسة؟\nالإجابة: حتى لا ترتد الكرة بعيدًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالفخذ (دليل المعلم ص 93-97)."}}, {"focus": "محطات مهارات كرة القدم للصغار ومباريات مصغرة", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي الدوران بالكرة والتمرير بوجه القدم الداخلي والسيطرة في محطات.\n2. يوظف المهارات ويطبق القواعد في مباراة مصغرة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "- المحطات\n- المباراة المصغرة\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الثلاث ويعرض المحطات ثم تنظيم المباريات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 98: الدوران بالكرة حول الأقماع، التمرير بوجه القدم الداخلي نحو هدف، السيطرة بالفخذ والقدم، الجري بالكرة في مسار 8، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات مصغرة ص 99: فرق من 5 لاعبين، 5 دقائق لكل مباراة، بحكام من الطلبة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى استخدمتم الدوران بالكرة في المباراة؟ ليستنتج الطلبة توظيف المهارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الدوران بالكرة والتمرير بوجه القدم الداخلي.\nس2 (المستوى المتوقع): متى استخدمت السيطرة بالفخذ في المباراة؟\nالإجابة: عند استقبال كرة عالية.\nس3 (المستوى المتقدم): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (المستوى المتوقع): ما المهارة التي ساعدتك أكثر في المباراة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عند الخسارة؟\nالإجابة: صافحت الفريق الآخر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة جزء من مباراة وتسجيل عدد التمريرات والتصويبات (التعلم الذاتي، دليل المعلم ص 99)، ومراجعة قواعد كرة السلة للصغار (ص 100-103)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، التبديل).\n2. يؤدي الجري بالكرة مع الدوران 180 درجة بوجه القدم الخارجي والداخلي.\n3. يميز متى يستخدم الدوران بالكرة.\n\nالحصة 2:\n1. يتعرف النقاط الفنية للتمرير بوجه القدم الداخلي ومتى يستخدم.\n2. يؤدي التمرير بوجه القدم الداخلي للمسافات المتوسطة والطويلة.\n3. يختار نوع التمرير المناسب للمسافة.\n\nالحصة 3:\n1. يتعرف طرق السيطرة على الكرات العالية.\n2. يؤدي استلام الكرة بأعلى الفخذ وبوجه القدم الأمامي.\n3. يختار جزء الجسم المناسب للسيطرة حسب ارتفاع الكرة.\n\nالحصة 4:\n1. يؤدي الدوران بالكرة والتمرير بوجه القدم الداخلي والسيطرة في محطات.\n2. يوظف المهارات ويطبق القواعد في مباراة مصغرة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة القدم للصغار\n- الجري بالكرة\n- الدوران بالكرة\n- وجه القدم الخارجي\n- وجه القدم الداخلي\n\nالحصة 2:\n- التمرير\n- وجه القدم الداخلي\n- قدم الارتكاز\n- الكرات العرضية\n\nالحصة 3:\n- السيطرة على الكرة\n- أعلى الفخذ\n- وجه القدم الأمامي\n- الامتصاص\n\nالحصة 4:\n- المحطات\n- المباراة المصغرة\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد كرة القدم للصغار من الصف الخامس ويسأل: كيف نغير اتجاهنا بالكرة للتخلص من المنافس؟ (ص 91-92).\n\nالحصة 2:\nيراجع المعلم التمرير بباطن القدم ويسأل: كيف نمرر لمسافة طويلة أو كرة عرضية؟ (ص 93).\n\nالحصة 3:\nيرمي المعلم كرة عالية لطالب ويسأل: بأي جزء نسيطر عليها قبل أن تسقط؟ (ص 93-94).\n\nالحصة 4:\nيراجع المعلم المهارات الثلاث ويعرض المحطات ثم تنظيم المباريات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة مع تمرينات الإحساس (تنطيط بالقدم والفخذ).\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الجري بالكرة ثم وضع القدم أسفل الكرة وخلفها واللف 180 درجة ودفعها بوجه القدم الخارجي، ثم بوجه القدم الداخلي، ثم الدوران بوضع القدم أعلى الكرة وإرجاعها للخلف، فتطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 3 ص 96: قطارات، الجري بالكرة ثم الدوران حول القمع والتمرير للتالي، ثم الجري بالكرة في مسار 8 بوجه القدم الخارجي والداخلي.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الاستدارة): ينادي المعلم نوع الدوران فيؤديه الطلبة أثناء الجري بالكرة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وللخلف قليلًا، أرجحة الرجل الراكلة للخلف ثم للأمام مع لف القدم للخارج، ركل الكرة بوجه القدم الداخلي ومتابعة الحركة، ثم تطبيق موجه من الثبات.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب 4 ص 96: قطارات متقابلة بينها 15 م، يمرر الطالب في المنتصف للأول ليركلها بوجه القدم الداخلي للقطار المقابل، ثم تمرير عرضي من الجانب.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التمرير الطويل بين قمعين من 15 م.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاستلام بأعلى الفخذ (رفع الفخذ لمقابلة الكرة وسحبه لحظة الملامسة لتسقط أمام القدم)، والاستلام بوجه القدم الأمامي (رفع القدم ومد المشط وسحبه للأسفل لحظة الملامسة)، ثم تطبيق موجه برمي الكرة باليدين.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات 1 و5 ص 96-97: صفان متقابلان تبادل رمي الكرة واستلامها بالفخذ أو بوجه القدم الأمامي، ثم الجري بالكرة حول الدائرة والدوران.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (السيطرة ثم التمرير): مجموعات تمرر الكرة عالية ويجب السيطرة قبل التمرير.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 98: الدوران بالكرة حول الأقماع، التمرير بوجه القدم الداخلي نحو هدف، السيطرة بالفخذ والقدم، الجري بالكرة في مسار 8، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات مصغرة ص 99: فرق من 5 لاعبين، 5 دقائق لكل مباراة، بحكام من الطلبة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى استخدمتم الدوران بالكرة في المباراة؟ ليستنتج الطلبة توظيف المهارات.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس2 (المستوى المتوقع): اذكر طريقتين للدوران بالكرة.\nالإجابة: بوجه القدم الخارجي وبوضع القدم أعلى الكرة وإرجاعها.\nس3 (المستوى المتقدم): متى نستخدم الدوران بالكرة؟\nالإجابة: لتغيير الاتجاه والتخلص من المنافس أو الوصول لوضع التمرير.\n\nالحصة 2:\nس1 (مستوى الدعم): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة والطويلة والكرات العرضية.\nس2 (المستوى المتوقع): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وللخلف قليلًا.\nس3 (المستوى المتقدم): ما الفرق بين التمرير بباطن القدم وبوجه القدم الداخلي؟\nالإجابة: الباطن للدقة القصيرة، والداخلي للمسافة.\n\nالحصة 3:\nس1 (مستوى الدعم): ماذا نفعل بالفخذ لحظة ملامسة الكرة؟\nالإجابة: نسحبه للأسفل لامتصاص قوتها.\nس2 (المستوى المتوقع): متى نستخدم وجه القدم الأمامي في الاستلام؟\nالإجابة: للكرات التي تصل إلى مستوى القدم من الأعلى.\nس3 (المستوى المتقدم): اذكر أجزاء الجسم التي نسيطر بها على الكرة.\nالإجابة: الصدر وأعلى الفخذ ووجه القدم.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: الدوران بالكرة والتمرير بوجه القدم الداخلي.\nس2 (المستوى المتوقع): متى استخدمت السيطرة بالفخذ في المباراة؟\nالإجابة: عند استقبال كرة عالية.\nس3 (المستوى المتقدم): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الجري بالكرة مع الدوران بوجه القدم الخارجي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما الفرق بين الدوران بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي يدفع الكرة بالجزء الخارجي، والداخلي بالجزء الداخلي.\nس3 (المستوى المتقدم): أدِّ الجري بالكرة في مسار 8.\nالإجابة: يؤديه.\n\nالحصة 2:\nس1 (مستوى الدعم): مرر الكرة بوجه القدم الداخلي لزميل على بعد 15 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة عرضية من الجناح إلى منطقة الجزاء، أي تمرير تختار؟\nالإجابة: بوجه القدم الداخلي.\nس3 (المستوى المتقدم): لماذا نلف القدم للخارج قبل الركل؟\nالإجابة: ليلامس وجه القدم الداخلي الكرة بشكل صحيح.\n\nالحصة 3:\nس1 (مستوى الدعم): استلم الكرة العالية بأعلى الفخذ ثم مررها.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كرة قادمة في مستوى الصدر، بأي جزء تسيطر عليها؟\nالإجابة: بالصدر.\nس3 (المستوى المتقدم): لماذا نسحب القدم لحظة الملامسة؟\nالإجابة: حتى لا ترتد الكرة بعيدًا.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس2 (المستوى المتوقع): ما المهارة التي ساعدتك أكثر في المباراة؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف تصرفت عند الخسارة؟\nالإجابة: صافحت الفريق الآخر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري بالكرة والدوران حول عوائق في مكان آمن (دليل المعلم ص 91-96).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التمرير الطويل نحو هدف في مكان آمن (دليل المعلم ص 93-96).\n\nالحصة 3:\nإرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالفخذ (دليل المعلم ص 93-97).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة جزء من مباراة وتسجيل عدد التمريرات والتصويبات (التعلم الذاتي، دليل المعلم ص 99)، ومراجعة قواعد كرة السلة للصغار (ص 100-103)."}}, {"title": "لعبة كرة السلة للصغار", "unit": "الألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 100-113", "n": 6, "periods": [{"focus": "القواعد القانونية والتمريرة المرتدة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، الفترات، النقاط).\n2. يؤدي التمريرة المرتدة واستلامها.\n3. يميز متى تستخدم التمريرة المرتدة (منافس طويل، بعد الخداع).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة للصغار\n- التمريرة المرتدة\n- نقطة الارتداد\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم قواعد كرة السلة للصغار ويقف طالب طويل أمام ممرر ويسأل: كيف نمرر من تحت ذراعيه؟ (ص 101-104).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 104: وقوف والركبتان منثنيتان، مسك الكرة قريبة من الصدر والمرفقان للأسفل، مد الذراعين ودفع الكرة إلى الأرض عند ثلثي المسافة لترتد إلى مستوى خصر الزميل، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: صفان متقابلان تبادل التمريرة المرتدة مع علامة لنقطة الارتداد، ثم ثلاثيات بمدافع في المنتصف يرفع ذراعيه.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (10 تمريرات مرتدة) بين مجموعتين.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): أين ترتد الكرة في التمريرة المرتدة؟\nالإجابة: عند ثلثي المسافة إلى الزميل.\nس2 (المستوى المتوقع): متى نستخدم التمريرة المرتدة؟\nالإجابة: عند وجود منافس طويل القامة أو بعد الخداع.\nس3 (المستوى المتقدم): إلى أي مستوى تصل الكرة للزميل؟\nالإجابة: مستوى الخصر.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمريرة المرتدة لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كم لاعبًا في فريق كرة السلة للصغار داخل الملعب؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس3 (المستوى المتقدم): ما الفرق بين التمريرة الصدرية والمرتدة؟\nالإجابة: الصدرية مباشرة في الهواء، والمرتدة عبر الأرض.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على التمريرة المرتدة على الحائط (دليل المعلم ص 101-104)."}}, {"focus": "التمرير من فوق الرأس", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف التمرير من فوق الرأس ومتى يستخدم.\n2. يؤدي التمرير من فوق الرأس بتحريك الرسغين ومتابعة الحركة.\n3. يختار نوع التمريرة حسب موقف المدافع.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع", "المفاهيم": "- التمرير من فوق الرأس\n- الرسغ\n- المدافع القصير\n- المسافة المتوسطة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرة المرتدة ويقف مدافع قصير بين طالبين ويسأل: أي تمريرة الآن؟ (ص 105).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم متقدمة، رفع الكرة عاليًا فوق الرأس، رمي الكرة بتحريك الرسغين مع مد الذراعين للأمام ومتابعة الحركة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: ثلاثيات (ممرر، مدافع، مستلم): يختار الممرر المرتدة أو من فوق الرأس حسب طول المدافع ووضع ذراعيه، مع التبديل.\n- الطالب: يتدرب ويختار.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك) بالتمريرتين فقط.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير.\nس2 (المستوى المتوقع): ما الذي يعطي الكرة سرعتها في هذه التمريرة؟\nالإجابة: تحريك الرسغين ومد الذراعين.\nس3 (المستوى المتقدم): المدافع طويل ويرفع ذراعيه، أي تمريرة تختار؟\nالإجابة: المرتدة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر ثلاث تمريرات تعلمتها في كرة السلة للصغار.\nالإجابة: الصدرية والمرتدة ومن فوق الرأس.\nس3 (المستوى المتقدم): لماذا نتابع الحركة باليدين بعد التمرير؟\nالإجابة: للدقة والقوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105)."}}, {"focus": "حركات القدمين (الارتكاز)", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف الارتكاز واستخداماته (حماية الكرة، تغيير الاتجاه، أخذ وضع التصويب).\n2. يؤدي الارتكاز الأمامي والخلفي مع ثبات قدم الارتكاز.\n3. يطبق قاعدة قدم الارتكاز ويميز مخالفة المشي بالكرة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- الارتكاز\n- قدم الارتكاز\n- الارتكاز الأمامي\n- الارتكاز الخلفي\n- المشي بالكرة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرات ويمسك الكرة ويحرك قدميه ويسأل: هل هذا قانوني؟ ويقدم الارتكاز (ص 105).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاحتفاظ بقدم ملامسة للأرض (قدم الارتكاز) وتحريك القدم الأخرى للأمام (ارتكاز أمامي) أو للخلف (ارتكاز خلفي) مع حماية الكرة بالجسم، ثم تطبيق موجه داخل الأطواق.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: قطاران متقابلان، استلام الكرة ثم الارتكاز الأمامي والخلفي بقدم الارتكاز داخل الطوق ثم التمرير، ثم مع مدافع يحاول لمس الكرة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (التمثال): عند الصافرة يثبت الطالب قدم ارتكازه ويحمي الكرة من زميله 5 ثوانٍ.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما قدم الارتكاز؟\nالإجابة: القدم التي تبقى ملامسة للأرض ولا تتحرك.\nس2 (المستوى المتوقع): ما استخدامات الارتكاز؟\nالإجابة: حماية الكرة وتغيير الاتجاه وأخذ وضع التصويب.\nس3 (المستوى المتقدم): ما المخالفة عند رفع قدم الارتكاز؟\nالإجابة: المشي بالكرة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الارتكاز الأمامي والخلفي داخل الطوق.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف تحمي الكرة من المدافع بالارتكاز؟\nالإجابة: أدير جسمي بين الكرة والمدافع مع ثبات قدم الارتكاز.\nس3 (المستوى المتقدم): ما الفرق بين الارتكاز الأمامي والخلفي؟\nالإجابة: الأمامي تتحرك القدم الحرة للأمام والخلفي للخلف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على الارتكاز مع ثبات قدم واحدة (دليل المعلم ص 105)."}}, {"focus": "التصويبة السلمية", "num": 4, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم.\n2. يؤدي التصويبة السلمية بخطوتين وارتقاء وتصويب على اللوحة.\n3. يميز الأخطاء الشائعة ويصححها.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الارتكاز ويسأل: كيف نصوب من قرب السلة بعد المحاورة؟ ويعرض النقاط الفنية (ص 106).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع ركبة اليمنى بزاوية قائمة، الكرة على أصابع اليد اليمنى مسنودة بالأخرى، التصويب عند أعلى نقطة على اللوحة والهبوط على القدمين، ثم تطبيق موجه بالخطوات داخل الأطواق دون كرة ثم بالكرة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: قطارات التصويبة السلمية من الجانب الأيمن ثم الأيسر بعد المحاورة، ويعد القائد الإصابات ويصحح الأخطاء (ثلاث خطوات، عدم رفع الركبة).\n- الطالب: يتدرب ويصحح.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويبة السلمية بين المجموعات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كم خطوة قبل الارتقاء؟\nالإجابة: خطوتان.\nس2 (المستوى المتوقع): أي ركبة نرفع عند التصويب باليمنى؟\nالإجابة: الركبة اليمنى.\nس3 (المستوى المتقدم): متى نستخدم التصويبة السلمية؟\nالإجابة: للتصويب من المسافات القصيرة بعد المحاورة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ التصويبة السلمية من الجانب الأيمن.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): زميلك يأخذ ثلاث خطوات، ما الخطأ؟\nالإجابة: مخالفة المشي بالكرة.\nس3 (المستوى المتقدم): لماذا نصوب على اللوحة؟\nالإجابة: لأن الكرة ترتد منها إلى السلة بدقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة (دليل المعلم ص 106)."}}, {"focus": "محطات مهارات كرة السلة للصغار ومنافساتها", "num": 5, "fields": {"المخرجات التعليمية": "1. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز والتصويبة السلمية في محطات.\n2. يوظف المهارات في منافسات.\n3. يتعاون مع مجموعته ويلتزم بالقواعد.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أطواق\n- أخرى: أقماع", "المفاهيم": "- المحطات\n- التمرير\n- الارتكاز\n- التصويب\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الأربع ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 110: التمريرة المرتدة مع مدافع، التمرير من فوق الرأس لمسافة 6 م، الارتكاز داخل الطوق ثم التمرير، المحاورة والتصويبة السلمية، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 111: تتابع تمرير ثم محاورة وتصويبة سلمية في 3 دقائق والأكثر نقاطًا تفوز.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا فشلت بعض التصويبات؟ ليستنتج الطلبة أهمية الخطوتين والارتقاء الصحيح.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المرتدة مع مدافع والتصويبة السلمية.\nس2 (المستوى المتوقع): ما ترتيب منافسة القطار؟\nالإجابة: تمرير متتابع ثم محاورة ثم تصويبة سلمية.\nس3 (المستوى المتقدم): ما سبب فشل التصويبة السلمية غالبًا؟\nالإجابة: خطوات زائدة أو عدم رفع الركبة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الارتكاز ثم التمريرة المرتدة.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف (دليل المعلم ص 110-111)."}}, {"focus": "مباريات كرة السلة للصغار وتطبيق القواعد", "num": 6, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية في مباراة كرة سلة للصغار.\n2. يوظف المهارات الأساسية أثناء المباراة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المباراة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد (الفترات، التنطيط المزدوج، المشي بالكرة، النقاط) ويقسم الفرق ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يخطط كل فريق توزيع لاعبيه وأدوارهم.\n- الطالب: يخطط.\n\nالنشاط 3 (19 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 112-113: مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل، ميقاتي).\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط تقويمي ص 113: متى تستخدم التمريرة المرتدة والارتكاز في المباراة؟ ليستنتج الطلبة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): كم فترة في مباراة كرة السلة للصغار؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس2 (المستوى المتوقع): متى نستخدم الارتكاز في المباراة؟\nالإجابة: لحماية الكرة أو أخذ وضع التصويب.\nس3 (المستوى المتقدم): ما دور الميقاتي؟\nالإجابة: ضبط زمن الفترات.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويبة السلمية.\nس3 (المستوى المتقدم): كيف تصرفت مع قرار حكم لم يعجبك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة كرة سلة وتحليل التمريرات (التعلم الذاتي، دليل المعلم ص 113)، ومراجعة قواعد الريشة الطائرة (ص 114-116)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، الفترات، النقاط).\n2. يؤدي التمريرة المرتدة واستلامها.\n3. يميز متى تستخدم التمريرة المرتدة (منافس طويل، بعد الخداع).\n\nالحصة 2:\n1. يتعرف التمرير من فوق الرأس ومتى يستخدم.\n2. يؤدي التمرير من فوق الرأس بتحريك الرسغين ومتابعة الحركة.\n3. يختار نوع التمريرة حسب موقف المدافع.\n\nالحصة 3:\n1. يتعرف الارتكاز واستخداماته (حماية الكرة، تغيير الاتجاه، أخذ وضع التصويب).\n2. يؤدي الارتكاز الأمامي والخلفي مع ثبات قدم الارتكاز.\n3. يطبق قاعدة قدم الارتكاز ويميز مخالفة المشي بالكرة.\n\nالحصة 4:\n1. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم.\n2. يؤدي التصويبة السلمية بخطوتين وارتقاء وتصويب على اللوحة.\n3. يميز الأخطاء الشائعة ويصححها.\n\nالحصة 5:\n1. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز والتصويبة السلمية في محطات.\n2. يوظف المهارات في منافسات.\n3. يتعاون مع مجموعته ويلتزم بالقواعد.\n\nالحصة 6:\n1. يطبق القواعد القانونية في مباراة كرة سلة للصغار.\n2. يوظف المهارات الأساسية أثناء المباراة.\n3. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 5:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 6:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 5:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف\n\nالحصة 6:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 4:\n- أخرى: كرات سلة\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 5:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أطواق\n- أخرى: أقماع\n\nالحصة 6:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة السلة للصغار\n- التمريرة المرتدة\n- نقطة الارتداد\n- القواعد القانونية\n\nالحصة 2:\n- التمرير من فوق الرأس\n- الرسغ\n- المدافع القصير\n- المسافة المتوسطة\n\nالحصة 3:\n- الارتكاز\n- قدم الارتكاز\n- الارتكاز الأمامي\n- الارتكاز الخلفي\n- المشي بالكرة\n\nالحصة 4:\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n\nالحصة 5:\n- المحطات\n- التمرير\n- الارتكاز\n- التصويب\n- المنافسة\n\nالحصة 6:\n- المباراة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد كرة السلة للصغار ويقف طالب طويل أمام ممرر ويسأل: كيف نمرر من تحت ذراعيه؟ (ص 101-104).\n\nالحصة 2:\nيراجع المعلم التمريرة المرتدة ويقف مدافع قصير بين طالبين ويسأل: أي تمريرة الآن؟ (ص 105).\n\nالحصة 3:\nيراجع المعلم التمريرات ويمسك الكرة ويحرك قدميه ويسأل: هل هذا قانوني؟ ويقدم الارتكاز (ص 105).\n\nالحصة 4:\nيراجع المعلم الارتكاز ويسأل: كيف نصوب من قرب السلة بعد المحاورة؟ ويعرض النقاط الفنية (ص 106).\n\nالحصة 5:\nيراجع المعلم المهارات الأربع ويعرض المحطات.\n\nالحصة 6:\nيراجع المعلم القواعد (الفترات، التنطيط المزدوج، المشي بالكرة، النقاط) ويقسم الفرق ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج ص 104: وقوف والركبتان منثنيتان، مسك الكرة قريبة من الصدر والمرفقان للأسفل، مد الذراعين ودفع الكرة إلى الأرض عند ثلثي المسافة لترتد إلى مستوى خصر الزميل، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: صفان متقابلان تبادل التمريرة المرتدة مع علامة لنقطة الارتداد، ثم ثلاثيات بمدافع في المنتصف يرفع ذراعيه.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (10 تمريرات مرتدة) بين مجموعتين.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم متقدمة، رفع الكرة عاليًا فوق الرأس، رمي الكرة بتحريك الرسغين مع مد الذراعين للأمام ومتابعة الحركة، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: ثلاثيات (ممرر، مدافع، مستلم): يختار الممرر المرتدة أو من فوق الرأس حسب طول المدافع ووضع ذراعيه، مع التبديل.\n- الطالب: يتدرب ويختار.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (كرة الملك) بالتمريرتين فقط.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: الاحتفاظ بقدم ملامسة للأرض (قدم الارتكاز) وتحريك القدم الأخرى للأمام (ارتكاز أمامي) أو للخلف (ارتكاز خلفي) مع حماية الكرة بالجسم، ثم تطبيق موجه داخل الأطواق.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات: قطاران متقابلان، استلام الكرة ثم الارتكاز الأمامي والخلفي بقدم الارتكاز داخل الطوق ثم التمرير، ثم مع مدافع يحاول لمس الكرة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (التمثال): عند الصافرة يثبت الطالب قدم ارتكازه ويحمي الكرة من زميله 5 ثوانٍ.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع ركبة اليمنى بزاوية قائمة، الكرة على أصابع اليد اليمنى مسنودة بالأخرى، التصويب عند أعلى نقطة على اللوحة والهبوط على القدمين، ثم تطبيق موجه بالخطوات داخل الأطواق دون كرة ثم بالكرة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: قطارات التصويبة السلمية من الجانب الأيمن ثم الأيسر بعد المحاورة، ويعد القائد الإصابات ويصحح الأخطاء (ثلاث خطوات، عدم رفع الركبة).\n- الطالب: يتدرب ويصحح.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة التصويبة السلمية بين المجموعات.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 5:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (16 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 110: التمريرة المرتدة مع مدافع، التمرير من فوق الرأس لمسافة 6 م، الارتكاز داخل الطوق ثم التمرير، المحاورة والتصويبة السلمية، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 3 (9 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة ص 111: تتابع تمرير ثم محاورة وتصويبة سلمية في 3 دقائق والأكثر نقاطًا تفوز.\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: لماذا فشلت بعض التصويبات؟ ليستنتج الطلبة أهمية الخطوتين والارتقاء الصحيح.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 6:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالكرة.\n- الطالب: يقلد.\n\nالنشاط 2 (6 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: يخطط كل فريق توزيع لاعبيه وأدوارهم.\n- الطالب: يخطط.\n\nالنشاط 3 (19 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 112-113: مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل، ميقاتي).\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: نشاط تقويمي ص 113: متى تستخدم التمريرة المرتدة والارتكاز في المباراة؟ ليستنتج الطلبة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): أين ترتد الكرة في التمريرة المرتدة؟\nالإجابة: عند ثلثي المسافة إلى الزميل.\nس2 (المستوى المتوقع): متى نستخدم التمريرة المرتدة؟\nالإجابة: عند وجود منافس طويل القامة أو بعد الخداع.\nس3 (المستوى المتقدم): إلى أي مستوى تصل الكرة للزميل؟\nالإجابة: مستوى الخصر.\n\nالحصة 2:\nس1 (مستوى الدعم): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير.\nس2 (المستوى المتوقع): ما الذي يعطي الكرة سرعتها في هذه التمريرة؟\nالإجابة: تحريك الرسغين ومد الذراعين.\nس3 (المستوى المتقدم): المدافع طويل ويرفع ذراعيه، أي تمريرة تختار؟\nالإجابة: المرتدة.\n\nالحصة 3:\nس1 (مستوى الدعم): ما قدم الارتكاز؟\nالإجابة: القدم التي تبقى ملامسة للأرض ولا تتحرك.\nس2 (المستوى المتوقع): ما استخدامات الارتكاز؟\nالإجابة: حماية الكرة وتغيير الاتجاه وأخذ وضع التصويب.\nس3 (المستوى المتقدم): ما المخالفة عند رفع قدم الارتكاز؟\nالإجابة: المشي بالكرة.\n\nالحصة 4:\nس1 (مستوى الدعم): كم خطوة قبل الارتقاء؟\nالإجابة: خطوتان.\nس2 (المستوى المتوقع): أي ركبة نرفع عند التصويب باليمنى؟\nالإجابة: الركبة اليمنى.\nس3 (المستوى المتقدم): متى نستخدم التصويبة السلمية؟\nالإجابة: للتصويب من المسافات القصيرة بعد المحاورة.\n\nالحصة 5:\nس1 (مستوى الدعم): اذكر محطتين من محطات اليوم.\nالإجابة: المرتدة مع مدافع والتصويبة السلمية.\nس2 (المستوى المتوقع): ما ترتيب منافسة القطار؟\nالإجابة: تمرير متتابع ثم محاورة ثم تصويبة سلمية.\nس3 (المستوى المتقدم): ما سبب فشل التصويبة السلمية غالبًا؟\nالإجابة: خطوات زائدة أو عدم رفع الركبة.\n\nالحصة 6:\nس1 (مستوى الدعم): كم فترة في مباراة كرة السلة للصغار؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس2 (المستوى المتوقع): متى نستخدم الارتكاز في المباراة؟\nالإجابة: لحماية الكرة أو أخذ وضع التصويب.\nس3 (المستوى المتقدم): ما دور الميقاتي؟\nالإجابة: ضبط زمن الفترات.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ التمريرة المرتدة لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كم لاعبًا في فريق كرة السلة للصغار داخل الملعب؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس3 (المستوى المتقدم): ما الفرق بين التمريرة الصدرية والمرتدة؟\nالإجابة: الصدرية مباشرة في الهواء، والمرتدة عبر الأرض.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر ثلاث تمريرات تعلمتها في كرة السلة للصغار.\nالإجابة: الصدرية والمرتدة ومن فوق الرأس.\nس3 (المستوى المتقدم): لماذا نتابع الحركة باليدين بعد التمرير؟\nالإجابة: للدقة والقوة.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الارتكاز الأمامي والخلفي داخل الطوق.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف تحمي الكرة من المدافع بالارتكاز؟\nالإجابة: أدير جسمي بين الكرة والمدافع مع ثبات قدم الارتكاز.\nس3 (المستوى المتقدم): ما الفرق بين الارتكاز الأمامي والخلفي؟\nالإجابة: الأمامي تتحرك القدم الحرة للأمام والخلفي للخلف.\n\nالحصة 4:\nس1 (مستوى الدعم): أدِّ التصويبة السلمية من الجانب الأيمن.\nالإجابة: يؤديها.\nس2 (المستوى المتوقع): زميلك يأخذ ثلاث خطوات، ما الخطأ؟\nالإجابة: مخالفة المشي بالكرة.\nس3 (المستوى المتقدم): لماذا نصوب على اللوحة؟\nالإجابة: لأن الكرة ترتد منها إلى السلة بدقة.\n\nالحصة 5:\nس1 (مستوى الدعم): أدِّ الارتكاز ثم التمريرة المرتدة.\nالإجابة: يؤديهما.\nس2 (المستوى المتوقع): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nالحصة 6:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويبة السلمية.\nس3 (المستوى المتقدم): كيف تصرفت مع قرار حكم لم يعجبك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طالبك على التمريرة المرتدة على الحائط (دليل المعلم ص 101-104).\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105).\n\nالحصة 3:\nإرشاد لولي الأمر: تدرب مع طالبك على الارتكاز مع ثبات قدم واحدة (دليل المعلم ص 105).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة (دليل المعلم ص 106).\n\nالحصة 5:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف (دليل المعلم ص 110-111).\n\nالحصة 6:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة كرة سلة وتحليل التمريرات (التعلم الذاتي، دليل المعلم ص 113)، ومراجعة قواعد الريشة الطائرة (ص 114-116)."}}, {"title": "لعبة الريشة الطائرة", "unit": "الألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 114-125", "n": 4, "periods": [{"focus": "القواعد القانونية وقبضة المضرب والإرسال بوجه المضرب الأمامي", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية للريشة الطائرة (الملعب، الإرسال، النقاط).\n2. يؤدي قبضة المضرب (مسكة V) والإرسال بوجه المضرب الأمامي نحو مناطق محددة.\n3. يقدر أهمية الإرسال الدقيق في بدء اللعب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أطواق\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- الريشة الطائرة\n- قبضة المضرب (V)\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد ومسكة V من الصف الخامس ويسأل: كيف يبدأ اللعب؟ ويعرض الإرسال (ص 117-118).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: جري، خطو جانبي، تحريك الرسغين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم متقدمة، مسك المضرب باليد المعاكسة للقدم المتقدمة بمسكة V، مسك الريشة بأصابع اليد الأخرى وإسقاطها على الوجه الأمامي للمضرب مع أرجحته للخلف ثم للأمام لضربها أسفل الخصر نحو المنافس، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 121: الإرسال نحو الأطواق في الملعب المقابل ويعد القائد الإصابات، ثم الإرسال فوق الحبل للزميل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة الإرسال نحو المناطق بين مجموعتين.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نمسك المضرب؟\nالإجابة: بمسكة V (الإبهام والسبابة حرف V على المقبض).\nس2 (المستوى المتوقع): بأي يد نمسك المضرب بالنسبة للقدم المتقدمة؟\nالإجابة: باليد المعاكسة.\nس3 (المستوى المتقدم): أين تضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الإرسال بوجه المضرب الأمامي نحو الطوق 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر قاعدة من قواعد الإرسال.\nالإجابة: من منطقة الإرسال وأسفل الخصر.\nس3 (المستوى المتقدم): لماذا يهم الإرسال الدقيق؟\nالإجابة: لإرباك المنافس وإحراز النقاط.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف في المنزل (دليل المعلم ص 117-118)."}}, {"focus": "ضرب الريشة بوجه المضرب الخلفي", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف النقاط الفنية للضرب بوجه المضرب الخلفي ومتى يستخدم.\n2. يؤدي ضرب الريشة بوجه المضرب الخلفي من مستويات مختلفة.\n3. يميز بين الضرب بوجه المضرب الأمامي والخلفي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أقماع", "المفاهيم": "- وجه المضرب الخلفي\n- ظهر اليد\n- المرجحة\n- الريشة القادمة للجهة المعاكسة", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الريشة إلى الجهة المعاكسة لليد الضاربة ويسأل: كيف نضربها دون تغيير اليد؟ (ص 118).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك المضرب والنظر إلى الريشة، رفع المضرب عاليًا مع مواجهة ظهر اليد للريشة، مرجحة المضرب وضرب الريشة بوجهه الخلفي وتوجيهها، ثم تطبيق موجه بريشة مرمية.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 121-122: رمي الريشة للزميل جهة ظهر اليد وضربها بوجه المضرب الخلفي نحوه، ثم تبادل الضرب بالوجهين الأمامي والخلفي دون شبكة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أمامي أم خلفي): ينادي المعلم ويرمي الريشة فيضربها الطالب بالوجه الصحيح.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): متى نستخدم وجه المضرب الخلفي؟\nالإجابة: للريشة القادمة أمام الجسم أو باتجاه الجهة المعاكسة لليد الضاربة.\nس2 (المستوى المتوقع): ما وضع ظهر اليد عند الضرب الخلفي؟\nالإجابة: يواجه الريشة.\nس3 (المستوى المتقدم): ما الفرق بين الضربتين؟\nالإجابة: الأمامية من جهة راحة اليد والخلفية من جهة ظهر اليد.", "التقويم الختامي": "س1 (مستوى الدعم): اضرب الريشة القادمة جهة ظهر يدك بوجه المضرب الخلفي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): الريشة قادمة إلى يمينك وأنت أيمن، أي وجه تستخدم؟\nالإجابة: الأمامي.\nس3 (المستوى المتقدم): لماذا نرفع المضرب عاليًا قبل الضرب؟\nالإجابة: لإعطاء المرجحة قوة ومدى.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالوجهين (دليل المعلم ص 118-122)."}}, {"focus": "حركات القدمين (التحرك للجانبين) والمحطات", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي حركات القدمين للجانبين بالخطو والطعن لضرب الريشة.\n2. يربط حركة الرجلين بأرجحة الذراع الضاربة.\n3. يؤدي مهارات الريشة في محطات متكاملة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شبكة أو حبل", "المفاهيم": "- حركات القدمين\n- الطعن للجانب\n- التوافق\n- المحطات", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الريشة بعيدًا إلى جانب طالب ويسأل: كيف يصل إليها بسرعة ويعود؟ (ص 119).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء مع الطعن للجانبين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم متقدمة باتجاه الريشة، ثني ركبة الرجل القريبة والطعن للجانب، توافق حركة الرجلين مع أرجحة الذراع الضاربة، والذراع الحرة للتوازن، ثم العودة إلى المنتصف، فتطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 123: الإرسال نحو المربعات، الضرب بالوجه الخلفي، التحرك للجانبين لضرب ريشة مرمية، تبادل الضرب دون سقوط، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الركنان): رمي الريشة إلى الركنين والتحرك لضربها ثم العودة للمنتصف.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): كيف نتحرك لريشة قادمة إلى الجانب؟\nالإجابة: بخطوة أو عدة خطوات جانبية والطعن بالرجل القريبة.\nس2 (المستوى المتوقع): لماذا نحرك الذراع الحرة؟\nالإجابة: لحفظ توازن الجسم.\nس3 (المستوى المتقدم): لماذا نعود للمنتصف بعد الضرب؟\nالإجابة: للاستعداد للريشة التالية.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الطعن للجانب وضرب الريشة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات والضرب الخلفي.\nس3 (المستوى المتقدم): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب بتوازن.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التحرك للجانبين لضرب ريشة يرميها زميل (دليل المعلم ص 119-123)."}}, {"focus": "مباريات الريشة الطائرة وتطبيق القواعد", "num": 4, "fields": {"المخرجات التعليمية": "1. يطبق القواعد القانونية للريشة الطائرة في مباريات فردية وزوجية.\n2. يوظف الإرسال والضرب بالوجهين وحركات القدمين في المباراة.\n3. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "- المباراة\n- احتساب النقاط\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد (الإرسال، النقاط، خروج الريشة) وينظم المباريات ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب تبادل الضرب في أزواج فوق الشبكة مع العد.\n- الطالب: يتدرب.\n\nالنشاط 3 (17 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 124-125: مباريات فردية وزوجية حتى 7 نقاط بحكام من الطلبة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى خسرتم النقاط؟ ليستنتج الطلبة أهمية العودة للمنتصف والإرسال الدقيق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "س1 (مستوى الدعم): متى تحتسب النقطة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها بعد ضربه.\nس2 (المستوى المتوقع): ما دور الحكم؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.\nس3 (المستوى المتقدم): ما الفرق بين المباراة الفردية والزوجية؟\nالإجابة: الفردية لاعب ضد لاعب والزوجية اثنان ضد اثنين.", "التقويم الختامي": "س1 (مستوى الدعم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الإرسال أسفل الخصر.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة ريشة طائرة وتسجيل عدد الإرسالات (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية للريشة الطائرة (الملعب، الإرسال، النقاط).\n2. يؤدي قبضة المضرب (مسكة V) والإرسال بوجه المضرب الأمامي نحو مناطق محددة.\n3. يقدر أهمية الإرسال الدقيق في بدء اللعب.\n\nالحصة 2:\n1. يتعرف النقاط الفنية للضرب بوجه المضرب الخلفي ومتى يستخدم.\n2. يؤدي ضرب الريشة بوجه المضرب الخلفي من مستويات مختلفة.\n3. يميز بين الضرب بوجه المضرب الأمامي والخلفي.\n\nالحصة 3:\n1. يؤدي حركات القدمين للجانبين بالخطو والطعن لضرب الريشة.\n2. يربط حركة الرجلين بأرجحة الذراع الضاربة.\n3. يؤدي مهارات الريشة في محطات متكاملة.\n\nالحصة 4:\n1. يطبق القواعد القانونية للريشة الطائرة في مباريات فردية وزوجية.\n2. يوظف الإرسال والضرب بالوجهين وحركات القدمين في المباراة.\n3. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أطواق\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أقماع\n\nالحصة 3:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شبكة أو حبل\n\nالحصة 4:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة\n- أخرى: أقماع\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الريشة الطائرة\n- قبضة المضرب (V)\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال\n\nالحصة 2:\n- وجه المضرب الخلفي\n- ظهر اليد\n- المرجحة\n- الريشة القادمة للجهة المعاكسة\n\nالحصة 3:\n- حركات القدمين\n- الطعن للجانب\n- التوافق\n- المحطات\n\nالحصة 4:\n- المباراة\n- احتساب النقاط\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم القواعد ومسكة V من الصف الخامس ويسأل: كيف يبدأ اللعب؟ ويعرض الإرسال (ص 117-118).\n\nالحصة 2:\nيرمي المعلم الريشة إلى الجهة المعاكسة لليد الضاربة ويسأل: كيف نضربها دون تغيير اليد؟ (ص 118).\n\nالحصة 3:\nيرمي المعلم الريشة بعيدًا إلى جانب طالب ويسأل: كيف يصل إليها بسرعة ويعود؟ (ص 119).\n\nالحصة 4:\nيراجع المعلم القواعد (الإرسال، النقاط، خروج الريشة) وينظم المباريات ويعين حكامًا.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: جري، خطو جانبي، تحريك الرسغين.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم متقدمة، مسك المضرب باليد المعاكسة للقدم المتقدمة بمسكة V، مسك الريشة بأصابع اليد الأخرى وإسقاطها على الوجه الأمامي للمضرب مع أرجحته للخلف ثم للأمام لضربها أسفل الخصر نحو المنافس، ثم تطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 121: الإرسال نحو الأطواق في الملعب المقابل ويعد القائد الإصابات، ثم الإرسال فوق الحبل للزميل.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة الإرسال نحو المناطق بين مجموعتين.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: مسك المضرب والنظر إلى الريشة، رفع المضرب عاليًا مع مواجهة ظهر اليد للريشة، مرجحة المضرب وضرب الريشة بوجهه الخلفي وتوجيهها، ثم تطبيق موجه بريشة مرمية.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريبات ص 121-122: رمي الريشة للزميل جهة ظهر اليد وضربها بوجه المضرب الخلفي نحوه، ثم تبادل الضرب بالوجهين الأمامي والخلفي دون شبكة.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (أمامي أم خلفي): ينادي المعلم ويرمي الريشة فيضربها الطالب بالوجه الصحيح.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 3:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء مع الطعن للجانبين.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: قدم متقدمة باتجاه الريشة، ثني ركبة الرجل القريبة والطعن للجانب، توافق حركة الرجلين مع أرجحة الذراع الضاربة، والذراع الحرة للتوازن، ثم العودة إلى المنتصف، فتطبيق موجه.\n- الطالب: يقلد ويطبق.\n\nالنشاط 3 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات ص 123: الإرسال نحو المربعات، الضرب بالوجه الخلفي، التحرك للجانبين لضرب ريشة مرمية، تبادل الضرب دون سقوط، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (الركنان): رمي الريشة إلى الركنين والتحرك لضربها ثم العودة للمنتصف.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 4:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (8 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: تدريب تبادل الضرب في أزواج فوق الشبكة مع العد.\n- الطالب: يتدرب.\n\nالنشاط 3 (17 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مباريات ص 124-125: مباريات فردية وزوجية حتى 7 نقاط بحكام من الطلبة.\n- الطالب: يلعب ويحكم.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: متى خسرتم النقاط؟ ليستنتج الطلبة أهمية العودة للمنتصف والإرسال الدقيق.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة ومصافحة.\n- الطالب: يؤدي التهدئة ويصافح.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): كيف نمسك المضرب؟\nالإجابة: بمسكة V (الإبهام والسبابة حرف V على المقبض).\nس2 (المستوى المتوقع): بأي يد نمسك المضرب بالنسبة للقدم المتقدمة؟\nالإجابة: باليد المعاكسة.\nس3 (المستوى المتقدم): أين تضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\n\nالحصة 2:\nس1 (مستوى الدعم): متى نستخدم وجه المضرب الخلفي؟\nالإجابة: للريشة القادمة أمام الجسم أو باتجاه الجهة المعاكسة لليد الضاربة.\nس2 (المستوى المتوقع): ما وضع ظهر اليد عند الضرب الخلفي؟\nالإجابة: يواجه الريشة.\nس3 (المستوى المتقدم): ما الفرق بين الضربتين؟\nالإجابة: الأمامية من جهة راحة اليد والخلفية من جهة ظهر اليد.\n\nالحصة 3:\nس1 (مستوى الدعم): كيف نتحرك لريشة قادمة إلى الجانب؟\nالإجابة: بخطوة أو عدة خطوات جانبية والطعن بالرجل القريبة.\nس2 (المستوى المتوقع): لماذا نحرك الذراع الحرة؟\nالإجابة: لحفظ توازن الجسم.\nس3 (المستوى المتقدم): لماذا نعود للمنتصف بعد الضرب؟\nالإجابة: للاستعداد للريشة التالية.\n\nالحصة 4:\nس1 (مستوى الدعم): متى تحتسب النقطة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها بعد ضربه.\nس2 (المستوى المتوقع): ما دور الحكم؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.\nس3 (المستوى المتقدم): ما الفرق بين المباراة الفردية والزوجية؟\nالإجابة: الفردية لاعب ضد لاعب والزوجية اثنان ضد اثنين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ الإرسال بوجه المضرب الأمامي نحو الطوق 5 مرات.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر قاعدة من قواعد الإرسال.\nالإجابة: من منطقة الإرسال وأسفل الخصر.\nس3 (المستوى المتقدم): لماذا يهم الإرسال الدقيق؟\nالإجابة: لإرباك المنافس وإحراز النقاط.\n\nالحصة 2:\nس1 (مستوى الدعم): اضرب الريشة القادمة جهة ظهر يدك بوجه المضرب الخلفي.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): الريشة قادمة إلى يمينك وأنت أيمن، أي وجه تستخدم؟\nالإجابة: الأمامي.\nس3 (المستوى المتقدم): لماذا نرفع المضرب عاليًا قبل الضرب؟\nالإجابة: لإعطاء المرجحة قوة ومدى.\n\nالحصة 3:\nس1 (مستوى الدعم): أدِّ الطعن للجانب وضرب الريشة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات والضرب الخلفي.\nس3 (المستوى المتقدم): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب بتوازن.\n\nالحصة 4:\nس1 (مستوى الدعم): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الإرسال أسفل الخصر.\nس2 (المستوى المتوقع): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس3 (المستوى المتقدم): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف في المنزل (دليل المعلم ص 117-118).\n\nالحصة 2:\nإرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالوجهين (دليل المعلم ص 118-122).\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التحرك للجانبين لضرب ريشة يرميها زميل (دليل المعلم ص 119-123).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة ريشة طائرة وتسجيل عدد الإرسالات (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار."}}, const FIELDS = ["المخرجات التعليمية", "المستوى المعرفي", "الاستراتيجيات", "المصادر التعليمية", "المفاهيم", "التهيئة / التمهيد / التعلم القبلي", "إجراءات سير الدرس / الأنشطة التدريسية", "التقويم التكويني", "التقويم الختامي", "ملاحظات ضمن خطة الدراسة الأسبوعية"];
const GNOTE = "حصتان أسبوعيًا (مدارس الفترة الواحدة) وفق النشرة التوجيهية 2026/2027م؛ في وحدة الألعاب الحركية (1) اختير: كرة القدم للصغار (4 حصص) + كرة السلة للصغار (6 حصص) + الريشة الطائرة (4 حصص) = 14 حصة.";
let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
render();
