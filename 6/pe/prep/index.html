لرياضي.\nس2 (المستوى المتوقع): أدِّ تمرينًا للرجلين بالعد الثماني.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): كيف تنظم مجموعتك عرض الإحماء؟\nالإجابة: يعد القائد ونؤدي معًا.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الوثب الطويل من الاقتراب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): أدِّ التمريرة الصدرية ثم التصويب من الثبات.\nالإجابة: يؤديهما.\nس3 (المستوى المتقدم): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك نماذج الإعداد البدني في دليل المعلم.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها، ومراجعة مفهوم اللياقة البدنية (دليل المعلم ص 34-35)."}}, {"title": "تمرينات لتنمية عناصر اللياقة البدنية", "unit": "اللياقة البدنية", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 34-47", "n": 2, "periods": [{"focus": "مفهوم اللياقة البدنية وتمرينات تنمية التوافق", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم اللياقة البدنية وأهميتها وعناصرها.\n2. يميز عنصر التوافق وتمريناته.\n3. يؤدي تمرينات حرة وبالأدوات (سلم الرشاقة، الكرات) لتنمية التوافق.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: كرات\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- اللياقة البدنية\n- التوافق\n- الدمج الحركي\n- الجهاز العصبي العضلي", "التهيئة / التمهيد / التعلم القبلي": "يطلب المعلم من الطلبة التصفيق مرتين خلفًا ومرة أمامًا أسفل الركبة أثناء الوثب ويسأل: ما العنصر الذي نحتاجه؟ ويراجع مفهوم اللياقة (ص 35-36).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يراجع المعلم مفهوم اللياقة وأهميتها (كفاءة الأجهزة، الوزن المثالي، القوام)، ويشرح التوافق وأمثلته (خطوات الوثب الثلاثي، التصويبة السلمية، ضرب الكرة بالرأس)، ويؤدي النماذج ص 36-37: (وقوف فتحًا. الذراعان جانبًا) ضم الرجلين مع رفع الذراعين، التصفيق مع الوثب، الجري في سلم الرشاقة أمامًا وخلفًا، الجري بوضع قدم خارج المربع، رمي الكرة عاليًا والتصفيق ومسكها.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التوافق: سلم الرشاقة (نمط الرجوع)، الكرات (رمي وتصفيق ومسك)، التصفيق مع الوثب، تنطيط كرتين، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: أي مجموعة تكمل نمط السلم المركب بأقل أخطاء.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما اللياقة البدنية؟\nالإجابة: كفاءة الفرد على أداء أنشطته دون إجهاد.\nس2 (المستوى المتوقع): ما التوافق؟\nالإجابة: دمج أكثر من حركة لأجزاء مختلفة من الجسم في وقت واحد.\nس3 (المستوى المتقدم): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: التصويبة السلمية أو ضرب الكرة بالرأس.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ رمي الكرة عاليًا والتصفيق مرتين ومسكها.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة القلب والرئتين.\nس3 (المستوى المتقدم): لماذا يرتبط التوافق بالجهازين العصبي والعضلي؟\nالإجابة: لأن الدماغ يوجه العضلات لأداء الحركات معًا بتوقيت دقيق.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التوافق بالكرة (رمي وتصفيق ومسك) يوميًا (دليل المعلم ص 36-37)."}}, {"focus": "تمرينات تنمية القوة العضلية والسرعة", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز عنصري القوة العضلية والسرعة وأنواع السرعة.\n2. يؤدي تمرينات حرة وبالكرة الطبية لتنمية القوة العضلية، وتمرينات لتنمية السرعة.\n3. يقدر أهمية التمرينات للمحافظة على الصحة.", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: حواجز\n- أخرى: ساعة إيقاف", "المفاهيم": "- القوة العضلية\n- السرعة\n- السرعة الانتقالية\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التوافق ويسأل: ما الذي يمكّن العداء من الانطلاق بسرعة؟ ويقدم القوة العضلية والسرعة (ص 39-41).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القوة العضلية (الوقاية من الإصابات وتحسين القوام) ونماذجها ص 39: (انبطاح) رفع الصدر والذراعين والرجلين والثبات، (انبطاح مائل) ثني الذراعين، دفع يد الزميل، (وقوف. مسك الكرة الطبية) الوثب للأمام، رمي الكرة الطبية للأمام؛ ثم السرعة وأنواعها (انتقالية، حركية، رد فعل) ونماذجها ص 41: العدو 20 م من أوضاع مختلفة، الجري برفع الركبتين، تعدية الحواجز.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: الكرة الطبية (رمي للأمام)، انبطاح مائل، رد الفعل (الانطلاق بالإشارة من الجلوس)، عدو 20 م، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة زمن رد الفعل للإشارة الصوتية والبصرية ويستنتجون الفرق.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (المستوى المتوقع): اذكر أنواع السرعة.\nالإجابة: الانتقالية والحركية ورد الفعل.\nس3 (المستوى المتقدم): اذكر تمرينًا للقوة بالكرة الطبية.\nالإجابة: رمي الكرة الطبية للأمام لأبعد مسافة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الانطلاق بالإشارة من الجلوس وعدو 10 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما العنصر الذي يحتاجه رامي الجلة أكثر؟\nالإجابة: القوة العضلية.\nس3 (المستوى المتقدم): كيف تساعد القوة العضلية في الوقاية من الإصابات؟\nالإجابة: العضلات القوية تحمي المفاصل وتثبتها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرين الانبطاح المائل يوميًا بعدد مناسب (دليل المعلم ص 39-41)."}}], "combined": {"المخرجات التعلي  التوافق: سلم الرشاقة (نمط الرجوع)، الكرات (رمي وتصفيق ومسك)، التصفيق مع الوثب، تنطيط كرتين، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة: أي مجموعة تكمل نمط السلم المركب بأقل أخطاء.\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم القوة العضلية (الوقاية من الإصابات وتحسين القوام) ونماذجها ص 39: (انبطاح) رفع الصدر والذراعين والرجلين والثبات، (انبطاح مائل) ثني الذراعين، دفع يد الزميل، (وقوف. مسك الكرة الطبية) الوثب للأمام، رمي الكرة الطبية للأمام؛ ثم السرعة وأنواعها (انتقالية، حركية، رد فعل) ونماذجها ص 41: العدو 20 م من أوضاع مختلفة، الجري برفع الركبتين، تعدية الحواجز.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات: الكرة الطبية (رمي للأمام)، انبطاح مائل، رد الفعل (الانطلاق بالإشارة من الجلوس)، عدو 20 م، مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يقارن الطلبة زمن رد الفعل للإشارة الصوتية والبصرية ويستنتجون الفرق.\n- الطالب: يجرب ويستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما اللياقة البدنية؟\nالإجابة: كفاءة الفرد على أداء أنشطته دون إجهاد.\nس2 (المستوى المتوقع): ما التوافق؟\nالإجابة: دمج أكثر من حركة لأجزاء مختلفة من الجسم في وقت واحد.\nس3 (المستوى المتقدم): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: التصويبة السلمية أو ضرب الكرة بالرأس.\n\nالحصة 2:\nس1 (مستوى الدعم): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (المستوى المتوقع): اذكر أنواع السرعة.\nالإجابة: الانتقالية والحركية ورد الفعل.\nس3 (المستوى المتقدم): اذكر تمرينًا للقوة بالكرة الطبية.\nالإجابة: رمي الكرة الطبية للأمام لأبعد مسافة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): أدِّ رمي الكرة عاليًا والتصفيق مرتين ومسكها.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة القلب والرئتين.\nس3 (المستوى المتقدم): لماذا يرتبط التوافق بالجهازين العصبي والعضلي؟\nالإجابة: لأن الدماغ يوجه العضلات لأداء الحركات معًا بتوقيت دقيق.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ الانطلاق بالإشارة من الجلوس وعدو 10 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما العنصر الذي يحتاجه رامي الجلة أكثر؟\nالإجابة: القوة العضلية.\nس3 (المستوى المتقدم): كيف تساعد القوة العضلية في الوقاية من الإصابات؟\nالإجابة: العضلات القوية تحمي المفاصل وتثبتها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات التوافق بالكرة (رمي وتصفيق ومسك) يوميًا (دليل المعلم ص 36-37).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تمرين الانبطاح المائل يوميًا بعدد مناسب (دليل المعلم ص 39-41)."}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "اللياقة البدنية", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 48-56", "n": 2, "periods": [{"focus": "تصميم مسارات الموانع بالأدوات والأجهزة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع وأدواتها وأجهزتها.\n2. يؤدي حركات تخطي الموانع (تسلق، زحف، وثب، توازن، مروق) بأمان.\n3. يصمم مع مجموعته مسار موانع قصيرًا.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات طبية\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: سلم التسلق", "المفاهيم": "- تمرينات الموانع\n- المانع\n- التصميم\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأدوات ويسأل: كيف نصمم مسار موانع ينمي القوة والتوافق والسرعة؟ (ص 48-50).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: ال ماذج ص 53-54.", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (14 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات تؤدي النموذجين الثالث والرابع بالتتابع مرتين ويصحح القائد.\n- الطالب: يؤدي ويصحح.\n\nالنشاط 3 (11 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: منافسة بين المجموعات بالزمن والأداء الصحيح (ص 55).\n- الطالب: يتسابق.\n\nالنشاط 4 (4 دقائق):\n- الاستراتيجية: التعلم بالاكتشاف\n- المعلم: يسأل المعلم: أي مانع احتاج إلى القوة وأيها إلى التوافق؟ ليستنتج الطلبة علاقة الموانع بعناصر اللياقة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "س1 (مستوى الدعم): أي مانع يحتاج إلى القوة العضلية؟\nالإجابة: التسلق.\nس2 (المستوى المتوقع): أي مانع يحتاج إلى التوافق؟\nالإجابة: سلم الرشاقة.\nس3 (المستوى المتقدم): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.\nس3 (المستوى المتقدم): اقترح مانعًا ينمي السرعة.\nالإجابة: عدو 10 م بين قمعين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل زمنه في مسار موانع آمن ومحاولة تحسينه (دليل المعلم ص 53-55)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع وأدواتها وأجهزتها.\n2. يؤدي حركات تخطي الموانع (تسلق، زحف، وثب، توازن، مروق) بأمان.\n3. يصمم مع مجموعته مسار موانع قصيرًا.\n\nالحصة 2:\n1. يؤدي نماذج مسارات الموانع بالتتابع.\n2. يوظف الحركات والمهارات في منافسات الموانع.\n3. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعل  القوة وأيها إلى التوافق؟ ليستنتج الطلبة علاقة الموانع بعناصر اللياقة.\n- الطالب: يستنتج.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتعبير.\n- الطالب: يؤدي التهدئة ويعبر.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): اذكر ثلاث حركات لتخطي الموانع.\nالإجابة: التسلق، الزحف، الوثب.\nس2 (المستوى المتوقع): ما دور مراقب الأمان؟\nالإجابة: التأكد من ثبات الأدوات والهبوط الآمن.\nس3 (المستوى المتقدم): ما عناصر اللياقة التي ينميها جمباز الموانع؟\nالإجابة: القوة والسرعة والتوافق والرشاقة.\n\nالحصة 2:\nس1 (مستوى الدعم): أي مانع يحتاج إلى القوة العضلية؟\nالإجابة: التسلق.\nس2 (المستوى المتوقع): أي مانع يحتاج إلى التوافق؟\nالإجابة: سلم الرشاقة.\nس3 (المستوى المتقدم): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى الدعم): اذكر الموانع الخمسة في مسار مجموعتك وحركة كل منها.\nالإجابة: يذكر.\nس2 (المستوى المتوقع): أدِّ مسار المجموعة الأخرى.\nالإجابة: يؤديه.\nس3 (المستوى المتقدم): اقترح تعديلًا لزيادة صعوبة مسار مجموعتك.\nالإجابة: مثل: زيادة ارتفاع الحاجز.\n\nالحصة 2:\nس1 (مستوى الدعم): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.\nس3 (المستوى المتقدم): اقترح مانعًا ينمي السرعة.\nالإجابة: عدو 10 م بين قمعين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تصميم مسار موانع منزلي آمن (دليل المعلم ص 48-52).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تسجيل زمنه في مسار موانع آمن ومحاولة تحسينه (دليل المعلم ص 53-55)."}}, {"title": "سباق العدو (30-60) م من البدء المنخفض", "unit": "ألعاب القوى", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 60-68", "n": 2, "periods": [{"focus": "مراحل سباق العدو والبدء المنخفض (خذ مكانك، استعد، انطلق)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء سباق العدو (30-60) م ومراحله الفنية.\n2. يؤدي البدء المنخفض بأقسامه الثلاثة.\n3. يحدد القواعد القانونية للسباق (البدء المنخفض، الحارة، الانطلاق بعد الإشارة).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- البدء المنخفض\n- الحارة\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- خط النهاية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة عدائي 100 م عند البدء ويسأل: لماذا يبدؤون من هذا الوضع؟ ويقدم السباق ومراحله (ص 61-62).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء: جري، رفع الركبتين، لمس الرجلين خلفًا.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم النموذج: خذ مكانك (الأصابع قوس قبل الخط، ركبة الرجل الخلفية على الأرض، النظر للأسفل)، استعد (رفع الحوض والركبة)، انطلق (دفع الأرض بالقدمين وميل الجذع)، ثم الدفع وتزايد السرعة والسرعة القصوى، مع القواعد.\n- الطالب: يقلد كل قسم بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: أزواج: يعطي أحدهما الأوامر الثلاثة ويراقب أخطاء زميله (لمس الخط، الانطلاق المبكر) ثم يتبادلان، ثم عدو 20 م.\n- الطالب: يتدرب ويراقب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة (رد الفعل): انطلاق بإشارات مختلفة من البدء المنخفض 10 م.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما أقسام البدء المنخفض؟\nالإجابة: خذ مكانك، استعد، انطلق.\nس2 (المستوى المتوقع): متى ينتهي احتساب زمن السباق؟\nالإجابة: بمرور جذع العداء خط النهاية.\nس3 (المستوى المتقدم): اذكر قاعدة من قواعد السباق.\nالإجابة: الجري في الحارة المخصصة.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ البدء المنخفض بأقسامه الثلاثة.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): ما مراحل سباق العدو؟\nالإجابة: البدء المنخفض، الدفع وتزايد السرعة، السرعة القصوى.\nس3 (المستوى المتقدم): زميلك ينطلق قبل الإشارة، ما القرار؟\nالإجابة: بداية خاطئة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على أوامر البدء الثلاثة في مكان آمن (دليل المعلم ص 61-63)."}}, {"focus": "تدريبات سباق العدو ومنافساته", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي التمرينات التمهيدية والتدريبات التعليمية لسباق العدو.\n2. يؤدي سباق العدو 30-60 م من البدء المنخفض بتطبيق القواعد.\n3. يستمتع بمشاركة زملائه سباق العدو ويحدد هدفًا لتحسين زمنه.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: أعلام", "المفاهيم": "- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم البدء المنخفض ويسأل: كيف نحافظ على السرعة القصوى حتى النهاية؟", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء خاص بالعدو.\n- الطالب: يقلد.\n\nالنشاط 2 (10 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات ص 64-66: العدو المتزايد السرعة 30 م، العدو من البدء المنخفض 20 م بالإشارة، الجري بخطوات واسعة ثم سريعة، مع التركيز على حركة الذراعين.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات بميقاتي (ساعة إيقاف) ومسجل: يعدو كل طالب 50 م من البدء المنخفض ويسجل زمنه.\n- الطالب: يعدو ويسجل لزميله.\n\nالنشاط 4 (7 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: سباق العدو بين المجموعات بالتصفيات والنهائي مع حكام من الطلبة (ص 67).\n- الطالب: يتسابق.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة وتحديد هدف شخصي لتحسين الزمن خلال أسبوع.\n- الطالب: يؤدي التهدئة ويحدد هدفًا.", "التقويم التكويني": "س1 (مستوى الدعم): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وبالتبادل بقوة.\nس2 (المستوى المتوقع): ما دور الميقاتي؟\nالإجابة: تسجيل زمن العداء.\nس3 (المستوى المتقدم): ما العنصر الأساسي في سباق العدو؟\nالإجابة: السرعة.", "التقويم الختام م القبلي": "يعرض المعلم صورة وثب عالٍ ظهري ويسأل: لماذا هذه الطريقة الأكثر استخدامًا؟ ويقدم المراحل (ص 70-71).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المراحل (اقتراب 3-5 خطوات في مسار منحنٍ، ارتقاء بالقدم البعيدة والدوران لمقابلة العارضة بالظهر، طيران بتقوس الظهر، هبوط على الكتفين والظهر) ويؤدي التمرينات التمهيدية ص 72-73: الجري مع رفع العقبين، تبادل فتح وضم الرجلين مع التقدم، الحجل مع رفع ركبة الرجل الحرة، الوثب للجانبين، تبادل الخطو والحجل.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التمرينات التمهيدية بأربع مجموعات مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة: من يحجل مع رفع الركبة أعلى عند لمس كرة معلقة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): ما مراحل الوثب العالي الظهري؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (المستوى المتوقع): كم خطوة اقتراب في مسابقة الصف السادس؟\nالإجابة: 3-5 خطوات.\nس3 (المستوى المتقدم): على أي جزء نهبط؟\nالإجابة: على الكتفين والظهر.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ تبادل الخطو والحجل 10 م.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): لماذا الطريقة الظهرية أكثر استخدامًا؟\nالإجابة: لانسيابية الحركة والاقتصاد في الجهد.\nس3 (المستوى المتقدم): ما الفرق بين المقصية والظهرية؟\nالإجابة: المقصية تتعدى العارضة بالرجلين واحدة تلو الأخرى، والظهرية بالظهر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات الحجل مع رفع الركبة والتقوس خلفًا بأمان (دليل المعلم ص 72-73)."}}, {"focus": "التدريبات التعليمية ومسابقة الوثب العالي الظهري", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي التدريبات التعليمية (الوثب المقصي من الاقتراب المستقيم، الاقتراب المنحني والدوران، الارتقاء الظهري من الوقوف ثم من الصندوق).\n2. يؤدي الوثب العالي بالطريقة الظهرية من اقتراب 3-5 خطوات بتطبيق القواعد.\n3. يشارك زملاءه في تنظيم المسابقة بأدوار (حكم، مسجل).", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: حبل مطاطي\n- أخرى: صندوق مقسم\n- أخرى: أقماع\n- أخرى: استمارات تسجيل", "المفاهيم": "- الارتقاء الظهري\n- الدوران\n- المسابقة\n- المحاولات\n- الارتفاع", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المراحل ويعرض التدريبات التعليمية (ص 73-74) وقواعد المسابقة (3 محاولات لكل ارتفاع).", "إجراءات سير الدرس / الأنشطة التدريسية": "النشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالتمرينات التمهيدية.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات: الوثب المقصي من اقتراب مستقيم، الجري في مسار منحنٍ بالأقماع، الوثب بقدم واحدة مع الدوران ربع ثم نصف لفة، الارتقاء الظهري من الوقوف ثم من الصندوق على الحبل المطاطي والهبوط على المرتبة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات في محطتين (الاقتراب والدوران، الارتقاء من الصندوق) ثم وثبة كاملة من 3-5 خطوات على ارتفاع منخفض ويراقب القائد.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة مصغرة بأدوار (حكم يرفع العلم، مسجل) على ارتفاعات متدرجة (ص 75).\n- الطالب: يتسابق ويحكم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "س1 (مستوى الدعم): بأي قدم نرتقي؟\nالإجابة: بالقدم البعيدة عن العارضة.\nس2 (المستوى المتوقع): كم محاولة لكل ارتفاع؟\nالإجابة: ثلاث محاولات.\nس3 (المستوى المتقدم): لماذا نستخدم الحبل المطاطي أولًا؟\nالإجابة: للأمان والتدرج.", "التقويم الختامي": "س1 (مستوى الدعم): أدِّ الوثب الظهري من 3-5 خطوات على ارتفاع مناسب.\nالإجابة: يؤديه.\nس2 (المستوى المتوقع): متى تحتسب المحاولة فاشلة؟\nالإجابة: عند إسقاط العارضة أو الارتقاء بالقدمين.\nس3 (المستوى المتقدم): ما دورك في تنظيم المسابقة؟\nالإجابة: يذكر (حكم أو مسجل).", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تحديد هدف لتحسين ارتفاعه خلال أسبوع والبحث عن قصة بطل في الوثب (التعلم الذاتي، دليل المعلم ص 75)."}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء الوثب العالي بالطريقة الظهرية ومراحله الفنية.\n2. يؤدي التمرينات التمهيدية (تبادل الخطو والحجل، الوثب للجانبين، الحجل مع رفع الركبة).\n3. يميز بين الوثب بالطريقة المقصية والطريقة الظهرية.\n\nالحصة 2:\n1. يؤدي التدريبات التعليمية (الوثب المقصي من الاقتراب المستقيم، الاقتراب المنحني والدوران، الارتقاء الظهري من الوقوف ثم من الصندوق).\n2. يؤدي الوثب العالي بالطريقة الظهرية من اقتراب 3-5 خطوات بتطبيق القواعد.\n3. يشارك زملاءه في تنظيم المسابقة بأدوار (حكم، مسجل).", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: حبل مطاطي\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: حبل مطاطي\n- أخرى: صندوق مقسم\n- أخرى: أقماع\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- الوثب العالي\n- الطريقة الظهرية\n- الاقتراب المنحني\n- الارتقاء\n- العارضة\n\nالحصة 2:\n- الارتقاء الظهري\n- الدوران\n- المسابقة\n- المحاولات\n- الارتفاع", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة وثب عالٍ ظهري ويسأل: لماذا هذه الطريقة الأكثر استخدامًا؟ ويقدم المراحل (ص 70-71).\n\nالحصة 2:\nيراجع المعلم المراحل ويعرض التدريبات التعليمية (ص 73-74) وقواعد المسابقة (3 محاولات لكل ارتفاع).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يشرح المعلم المراحل (اقتراب 3-5 خطوات في مسار منحنٍ، ارتقاء بالقدم البعيدة والدوران لمقابلة العارضة بالظهر، طيران بتقوس الظهر، هبوط على الكتفين والظهر) ويؤدي التمرينات التمهيدية ص 72-73: الجري مع رفع العقبين، تبادل فتح وضم الرجلين مع التقدم، الحجل مع رفع ركبة الرجل الحرة، الوثب للجانبين، تبادل الخطو والحجل.\n- الطالب: يقلد.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: محطات التمرينات التمهيدية بأربع مجموعات مع التبديل.\n- الطالب: يؤدي ويبدل.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: لعبة: من يحجل مع رفع الركبة أعلى عند لمس كرة معلقة.\n- الطالب: يلعب.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.\n\nالحصة 2:\nالنشاط 1 (7 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: إحماء بالتمرينات التمهيدية.\n- الطالب: يقلد.\n\nالنشاط 2 (12 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: يؤدي المعلم التدريبات: الوثب المقصي من اقتراب مستقيم، الجري في مسار منحنٍ بالأقماع، الوثب بقدم واحدة مع الدوران ربع ثم نصف لفة، الارتقاء الظهري من الوقوف ثم من الصندوق على الحبل المطاطي والهبوط على المرتبة.\n- الطالب: يقلد بالتدرج.\n\nالنشاط 3 (12 دقائق):\n- الاستراتيجية: التعلم التعاوني\n- المعلم: مجموعات في محطتين (الاقتراب والدوران، الارتقاء من الصندوق) ثم وثبة كاملة من 3-5 خطوات على ارتفاع منخفض ويراقب القائد.\n- الطالب: يتدرب.\n\nالنشاط 4 (5 دقائق):\n- الاستراتيجية: التعلم المبني على اللعب\n- المعلم: مسابقة مصغرة بأدوار (حكم يرفع العلم، مسجل) على ارتفاعات متدرجة (ص 75).\n- الطالب: يتسابق ويحكم.\n\nالنشاط 5 (4 دقائق):\n- الاستراتيجية: التعلم بالنمذجة\n- المعلم: تهدئة.\n- الطالب: يؤدي التهدئة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى الدعم): ما مراحل الوثب العالي الظهري؟\nالإجابة: الاقتراب، الارتقاء، الطيران، الهبوط.\nس2 (المستوى المتوقع): كم خطوة اقتراب في مسابقة الصف السادس؟\nالإجابة: 3-5 خطوات.\nس3 (المستوى المتقدم): على أي جزء نهبط؟\nالإجابة: على الكتفين والظهر.\n\nالحصة 2:\nس1 (مست
