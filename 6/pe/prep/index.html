ستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة القدم للصغار\n- الجري بالكرة\n- الدوران بالكرة\n- وجه القدم الخارجي\n- وجه القدم الداخلي\n- التمرير\n- قدم الارتكاز\n- الكرات العرضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم قواعد كرة القدم للصغار من الصف الخامس ويسأل: كيف نغير اتجاهنا بالكرة للتخلص من المنافس؟ (ص 91-92).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة مع تمرينات الإحساس (تنطيط بالقدم والفخذ)، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الجري بالكرة ثم وضع القدم أسفل الكرة وخلفها واللف 180 درجة ودفعها بوجه القدم الخارجي، ثم بوجه القدم الداخلي، ثم الدوران بوضع القدم أعلى الكرة وإرجاعها للخلف، فتطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 96: قطارات، الجري بالكرة ثم الدوران حول القمع والتمرير للتالي، ثم الجري بالكرة في مسار 8 بوجه القدم الخارجي والداخلي، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الاستدارة): ينادي المعلم نوع الدوران فيؤديه الطلبة أثناء الجري بالكرة، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وللخلف قليلًا، أرجحة الرجل الراكلة للخلف ثم للأمام مع لف القدم للخارج، ركل الكرة بوجه القدم الداخلي ومتابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريب 4 ص 96: قطارات متقابلة بينها 15 م، يمرر الطالب في المنتصف للأول ليركلها بوجه القدم الداخلي للقطار المقابل، ثم تمرير عرضي من الجانب، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التمرير الطويل بين قمعين من 15 م، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس2 (مستوى التطبيق): اذكر طريقتين للدوران بالكرة.\nالإجابة: بوجه القدم الخارجي وبوضع القدم أعلى الكرة وإرجاعها.\nس3 (مستوى الاستدلال): متى نستخدم الدوران بالكرة؟\nالإجابة: لتغيير الاتجاه والتخلص من المنافس أو الوصول لوضع التمرير.\n\nس4 (مستوى المعرفة): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة والطويلة والكرات العرضية.\nس5 (مستوى التطبيق): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وللخلف قليلًا.\nس6 (مستوى الاستدلال): ما الفرق بين التمرير بباطن القدم وبوجه القدم الداخلي؟\nالإجابة: الباطن للدقة القصيرة، والداخلي للمسافة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الجري بالكرة مع الدوران بوجه القدم الخارجي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الدوران بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي يدفع الكرة بالجزء الخارجي، والداخلي بالجزء الداخلي.\nس3 (مستوى الاستدلال): أدِّ الجري بالكرة في مسار 8.\nالإجابة: يؤديه.\n\nس4 (مستوى المعرفة): مرر الكرة بوجه القدم الداخلي لزميل على بعد 15 م.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): كرة عرضية من الجناح إلى منطقة الجزاء، أي تمرير تختار؟\nالإجابة: بوجه القدم الداخلي.\nس6 (مستوى الاستدلال): لماذا نلف القدم للخارج قبل الركل؟\nالإجابة: ليلامس وجه القدم الداخلي الكرة بشكل صحيح.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الجري بالكرة والدوران حول عوائق في مكان آمن (دليل المعلم ص 91-96).\nإرشاد لولي الأمر: شجع طالبك على التمرير الطويل نحو هدف في مكان آمن (دليل المعلم ص 93-96).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}, {"focus": "السيطرة على الكرة (بأعلى الفخذ ووجه القدم الأمامي) + محطات مهارات كرة القدم للصغار ومباريات مصغرة", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف طرق السيطرة على الكرات العالية (5 دقائق)\n2. يؤدي استلام الكرة بأعلى الفخذ وبوجه القدم الأمامي (10 دقائق)\n3. يختار جزء الجسم المناسب للسيطرة حسب ارتفاع الكرة (5 دقائق)\n4. يؤدي الدوران بالكرة والتمرير بوجه القدم الداخلي والسيطرة في محطات (10 دقائق)\n5. يوظف المهارات ويطبق القواعد في مباراة مصغرة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "- السيطرة على الكرة\n- أعلى الفخذ\n- وجه القدم الأمامي\n- الامتصاص\n- المحطات\n- المباراة المصغرة\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم كرة عالية لطالب ويسأل: بأي جزء نسيطر عليها قبل أن تسقط؟ (ص 93-94).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاستلام بأعلى الفخذ (رفع الفخذ لمقابلة الكرة وسحبه لحظة الملامسة لتسقط أمام القدم)، والاستلام بوجه القدم الأمامي (رفع القدم ومد المشط وسحبه للأسفل لحظة الملامسة)، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 1 و5 ص 96-97: صفان متقابلان تبادل رمي الكرة واستلامها بالفخذ أو بوجه القدم الأمامي، ثم الجري بالكرة حول الدائرة والدوران، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (السيطرة ثم التمرير): مجموعات تمرر الكرة عالية ويجب السيطرة قبل التمرير، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محطات ص 98: الدوران بالكرة حول الأقماع، التمرير بوجه القدم الداخلي نحو هدف، السيطرة بالفخذ والقدم، الجري بالكرة في مسار 8، مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات مصغرة ص 99: فرق من 5 لاعبين، 5 دقائق لكل مباراة، بحكام من الطلبة، ويلعب الطالب ويحكم (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى استخدمتم الدوران بالكرة في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – صافرة الأخلاق: يقوم طالب بدور الحكم ويشرح قاعدة التبديل أو احتساب الهدف لموقف تمثله مجموعته، ويربط ذلك بالأخلاق العمانية في الملعب كاحترام الحكم والمنافس (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ماذا نفعل بالفخذ لحظة ملامسة الكرة؟\nالإجابة: نسحبه للأسفل لامتصاص قوتها.\nس2 (مستوى التطبيق): متى نستخدم وجه القدم الأمامي في الاستلام؟\nالإجابة: للكرات التي تصل إلى مستوى القدم من الأعلى.\nس3 (مستوى الاستدلال): اذكر أجزاء الجسم التي نسيطر بها على الكرة.\nالإجابة: الصدر وأعلى الفخذ ووجه القدم.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الدوران بالكرة والتمرير بوجه القدم الداخلي.\nس5 (مستوى التطبيق): متى استخدمت السيطرة بالفخذ في المباراة؟\nالإجابة: عند استقبال كرة عالية.\nس6 (مستوى الاستدلال): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.", "التقويم الختامي": "س1 (مستوى المعرفة): استلم الكرة العالية بأعلى الفخذ ثم مررها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الصدر، بأي جزء تسيطر عليها؟\nالإجابة: بالصدر.\nس3 (مستوى الاستدلال): لماذا نسحب القدم لحظة الملامسة؟\nالإجابة: حتى لا ترتد الكرة بعيدًا.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس5 (مستوى التطبيق): ما المهارة التي ساعدتك أكثر في المباراة؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عند الخسارة؟\nالإجابة: صافحت الفريق الآخر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالفخذ (دليل المعلم ص 93-97).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة جزء من مباراة وتسجيل عدد التمريرات والتصويبات (التعلم الذاتي، دليل المعلم ص 99)، ومراجعة قواعد كرة السلة للصغار (ص 100-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية لكرة القدم للصغار (الملعب، الكرة، التبديل) (5 دقائق)\n2. يؤدي الجري بالكرة مع الدوران 180 درجة بوجه القدم الخارجي والداخلي (10 دقائق)\n3. يميز متى يستخدم الدوران بالكرة (5 دقائق)\n4. يتعرف النقاط الفنية للتمرير بوجه القدم الداخلي ومتى يستخدم (5 دقائق)\n5. يؤدي التمرير بوجه القدم الداخلي للمسافات المتوسطة والطويلة (10 دقائق)\n6. يختار نوع التمرير المناسب للمسافة (5 دقائق)\n\nالحصة 2:\n1. يتعرف طرق السيطرة على الكرات العالية (5 دقائق)\n2. يؤدي استلام الكرة بأعلى الفخذ وبوجه القدم الأمامي (10 دقائق)\n3. يختار جزء الجسم المناسب للسيطرة حسب ارتفاع الكرة (5 دقائق)\n4. يؤدي الدوران بالكرة والتمرير بوجه القدم الداخلي والسيطرة في محطات (10 دقائق)\n5. يوظف المهارات ويطبق القواعد في مباراة مصغرة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات قدم مقاس 4\n- أخرى: أقماع\n- أخرى: مرامٍ صغيرة\n- أخرى: صدريات ملونة", "المفاهيم": "الحصة 1:\n- كرة القدم للصغار\n- الجري بالكرة\n- الدوران بالكرة\n- وجه القدم الخارجي\n- وجه القدم الداخلي\n- التمرير\n- قدم الارتكاز\n- الكرات العرضية\n\nالحصة 2:\n- السيطرة على الكرة\n- أعلى الفخذ\n- وجه القدم الأمامي\n- الامتصاص\n- المحطات\n- المباراة المصغرة\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد كرة القدم للصغار من الصف الخامس ويسأل: كيف نغير اتجاهنا بالكرة للتخلص من المنافس؟ (ص 91-92).\n\nالحصة 2:\nيرمي المعلم كرة عالية لطالب ويسأل: بأي جزء نسيطر عليها قبل أن تسقط؟ (ص 93-94).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة مع تمرينات الإحساس (تنطيط بالقدم والفخذ)، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الجري بالكرة ثم وضع القدم أسفل الكرة وخلفها واللف 180 درجة ودفعها بوجه القدم الخارجي، ثم بوجه القدم الداخلي، ثم الدوران بوضع القدم أعلى الكرة وإرجاعها للخلف، فتطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب 3 ص 96: قطارات، الجري بالكرة ثم الدوران حول القمع والتمرير للتالي، ثم الجري بالكرة في مسار 8 بوجه القدم الخارجي والداخلي، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الاستدارة): ينادي المعلم نوع الدوران فيؤديه الطلبة أثناء الجري بالكرة، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: قدم الارتكاز بجانب الكرة وللخلف قليلًا، أرجحة الرجل الراكلة للخلف ثم للأمام مع لف القدم للخارج، ركل الكرة بوجه القدم الداخلي ومتابعة الحركة، ثم تطبيق موجه من الثبات، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريب 4 ص 96: قطارات متقابلة بينها 15 م، يمرر الطالب في المنتصف للأول ليركلها بوجه القدم الداخلي للقطار المقابل، ثم تمرير عرضي من الجانب، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التمرير الطويل بين قمعين من 15 م، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاستلام بأعلى الفخذ (رفع الفخذ لمقابلة الكرة وسحبه لحظة الملامسة لتسقط أمام القدم)، والاستلام بوجه القدم الأمامي (رفع القدم ومد المشط وسحبه للأسفل لحظة الملامسة)، ثم تطبيق موجه برمي الكرة باليدين، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات 1 و5 ص 96-97: صفان متقابلان تبادل رمي الكرة واستلامها بالفخذ أو بوجه القدم الأمامي، ثم الجري بالكرة حول الدائرة والدوران، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (السيطرة ثم التمرير): مجموعات تمرر الكرة عالية ويجب السيطرة قبل التمرير، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. محطات ص 98: الدوران بالكرة حول الأقماع، التمرير بوجه القدم الداخلي نحو هدف، السيطرة بالفخذ والقدم، الجري بالكرة في مسار 8، مع التبديل، ويؤدي الطالب ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات مصغرة ص 99: فرق من 5 لاعبين، 5 دقائق لكل مباراة، بحكام من الطلبة، ويلعب الطالب ويحكم (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى استخدمتم الدوران بالكرة في المباراة؟ ليستنتج الطلبة توظيف المهارات، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (1 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – صافرة الأخلاق: يقوم طالب بدور الحكم ويشرح قاعدة التبديل أو احتساب الهدف لموقف تمثله مجموعته، ويربط ذلك بالأخلاق العمانية في الملعب كاحترام الحكم والمنافس (3 دقائق)\nالاستراتيجيات: لعب الأدوار.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما مقاس كرة القدم للصغار؟\nالإجابة: مقاس 4.\nس2 (مستوى التطبيق): اذكر طريقتين للدوران بالكرة.\nالإجابة: بوجه القدم الخارجي وبوضع القدم أعلى الكرة وإرجاعها.\nس3 (مستوى الاستدلال): متى نستخدم الدوران بالكرة؟\nالإجابة: لتغيير الاتجاه والتخلص من المنافس أو الوصول لوضع التمرير.\n\nس4 (مستوى المعرفة): متى نستخدم التمرير بوجه القدم الداخلي؟\nالإجابة: للمسافات المتوسطة والطويلة والكرات العرضية.\nس5 (مستوى التطبيق): أين تكون قدم الارتكاز؟\nالإجابة: بجانب الكرة وللخلف قليلًا.\nس6 (مستوى الاستدلال): ما الفرق بين التمرير بباطن القدم وبوجه القدم الداخلي؟\nالإجابة: الباطن للدقة القصيرة، والداخلي للمسافة.\n\nالحصة 2:\nتفريد التعليم:\nس1 (مستوى المعرفة): ماذا نفعل بالفخذ لحظة ملامسة الكرة؟\nالإجابة: نسحبه للأسفل لامتصاص قوتها.\nس2 (مستوى التطبيق): متى نستخدم وجه القدم الأمامي في الاستلام؟\nالإجابة: للكرات التي تصل إلى مستوى القدم من الأعلى.\nس3 (مستوى الاستدلال): اذكر أجزاء الجسم التي نسيطر بها على الكرة.\nالإجابة: الصدر وأعلى الفخذ ووجه القدم.\n\nس4 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: الدوران بالكرة والتمرير بوجه القدم الداخلي.\nس5 (مستوى التطبيق): متى استخدمت السيطرة بالفخذ في المباراة؟\nالإجابة: عند استقبال كرة عالية.\nس6 (مستوى الاستدلال): ما دور الحكم الصغير؟\nالإجابة: تطبيق القواعد واحتساب الأهداف.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الجري بالكرة مع الدوران بوجه القدم الخارجي.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما الفرق بين الدوران بوجه القدم الخارجي والداخلي؟\nالإجابة: الخارجي يدفع الكرة بالجزء الخارجي، والداخلي بالجزء الداخلي.\nس3 (مستوى الاستدلال): أدِّ الجري بالكرة في مسار 8.\nالإجابة: يؤديه.\n\nس4 (مستوى المعرفة): مرر الكرة بوجه القدم الداخلي لزميل على بعد 15 م.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): كرة عرضية من الجناح إلى منطقة الجزاء، أي تمرير تختار؟\nالإجابة: بوجه القدم الداخلي.\nس6 (مستوى الاستدلال): لماذا نلف القدم للخارج قبل الركل؟\nالإجابة: ليلامس وجه القدم الداخلي الكرة بشكل صحيح.\n\nالحصة 2:\nس1 (مستوى المعرفة): استلم الكرة العالية بأعلى الفخذ ثم مررها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كرة قادمة في مستوى الصدر، بأي جزء تسيطر عليها؟\nالإجابة: بالصدر.\nس3 (مستوى الاستدلال): لماذا نسحب القدم لحظة الملامسة؟\nالإجابة: حتى لا ترتد الكرة بعيدًا.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الركلة الجانبية عند خروج الكرة.\nس5 (مستوى التطبيق): ما المهارة التي ساعدتك أكثر في المباراة؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف تصرفت عند الخسارة؟\nالإجابة: صافحت الفريق الآخر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الجري بالكرة والدوران حول عوائق في مكان آمن (دليل المعلم ص 91-96).\nإرشاد لولي الأمر: شجع طالبك على التمرير الطويل نحو هدف في مكان آمن (دليل المعلم ص 93-96).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طالبك على رمي الكرة عالية واستلامها بالفخذ (دليل المعلم ص 93-97).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة جزء من مباراة وتسجيل عدد التمريرات والتصويبات (التعلم الذاتي، دليل المعلم ص 99)، ومراجعة قواعد كرة السلة للصغار (ص 100-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=8"}}, {"title": "لعبة كرة السلة للصغار", "unit": "الألعاب الحركية (1)", "week": "العاشر – الثاني عشر", "date": "8-12/11/2026 إلى 22-26/11/2026", "pages": "دليل المعلم ص 100-113", "n": 3, "periods": [{"focus": "القواعد القانونية والتمريرة المرتدة + التمرير من فوق الرأس", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، الفترات، النقاط) (10 دقائق)\n2. يؤدي التمريرة المرتدة واستلامها (10 دقائق)\n3. يميز متى تستخدم التمريرة المرتدة (منافس طويل، بعد الخداع) (5 دقائق)\n4. يتعرف التمرير من فوق الرأس ومتى يستخدم (5 دقائق)\n5. يؤدي التمرير من فوق الرأس بتحريك الرسغين ومتابعة الحركة (5 دقائق)\n6. يختار نوع التمريرة حسب موقف المدافع (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- كرة السلة للصغار\n- التمريرة المرتدة\n- نقطة الارتداد\n- القواعد القانونية\n- التمرير من فوق الرأس\n- الرسغ\n- المدافع القصير\n- المسافة المتوسطة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم قواعد كرة السلة للصغار ويقف طالب طويل أمام ممرر ويسأل: كيف نمرر من تحت ذراعيه؟ (ص 101-104).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج ص 104: وقوف والركبتان منثنيتان، مسك الكرة قريبة من الصدر والمرفقان للأسفل، مد الذراعين ودفع الكرة إلى الأرض عند ثلثي المسافة لترتد إلى مستوى خصر الزميل، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: صفان متقابلان تبادل التمريرة المرتدة مع علامة لنقطة الارتداد، ثم ثلاثيات بمدافع في المنتصف يرفع ذراعيه، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (10 تمريرات مرتدة) بين مجموعتين، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: قدم متقدمة، رفع الكرة عاليًا فوق الرأس، رمي الكرة بتحريك الرسغين مع مد الذراعين للأمام ومتابعة الحركة، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. ثلاثيات (ممرر، مدافع، مستلم): يختار الممرر المرتدة أو من فوق الرأس حسب طول المدافع ووضع ذراعيه، مع التبديل، ويتدرب الطالب ويختار (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (كرة الملك) بالتمريرتين فقط، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): أين ترتد الكرة في التمريرة المرتدة؟\nالإجابة: عند ثلثي المسافة إلى الزميل.\nس2 (مستوى التطبيق): متى نستخدم التمريرة المرتدة؟\nالإجابة: عند وجود منافس طويل القامة أو بعد الخداع.\nس3 (مستوى الاستدلال): إلى أي مستوى تصل الكرة للزميل؟\nالإجابة: مستوى الخصر.\n\nس4 (مستوى المعرفة): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير.\nس5 (مستوى التطبيق): ما الذي يعطي الكرة سرعتها في هذه التمريرة؟\nالإجابة: تحريك الرسغين ومد الذراعين.\nس6 (مستوى الاستدلال): المدافع طويل ويرفع ذراعيه، أي تمريرة تختار؟\nالإجابة: المرتدة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ التمريرة المرتدة لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كم لاعبًا في فريق كرة السلة للصغار داخل الملعب؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس3 (مستوى الاستدلال): ما الفرق بين التمريرة الصدرية والمرتدة؟\nالإجابة: الصدرية مباشرة في الهواء، والمرتدة عبر الأرض.\n\nس4 (مستوى المعرفة): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): اذكر ثلاث تمريرات تعلمتها في كرة السلة للصغار.\nالإجابة: الصدرية والمرتدة ومن فوق الرأس.\nس6 (مستوى الاستدلال): لماذا نتابع الحركة باليدين بعد التمرير؟\nالإجابة: للدقة والقوة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على التمريرة المرتدة على الحائط (دليل المعلم ص 101-104).\nإرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "حركات القدمين (الارتكاز) + التصويبة السلمية", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف الارتكاز واستخداماته (حماية الكرة، تغيير الاتجاه، أخذ وضع التصويب) (5 دقائق)\n2. يؤدي الارتكاز الأمامي والخلفي مع ثبات قدم الارتكاز (10 دقائق)\n3. يطبق قاعدة قدم الارتكاز ويميز مخالفة المشي بالكرة (5 دقائق)\n4. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (5 دقائق)\n5. يؤدي التصويبة السلمية بخطوتين وارتقاء وتصويب على اللوحة (10 دقائق)\n6. يميز الأخطاء الشائعة ويصححها (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلة\n- صورة توضيحية", "المفاهيم": "- الارتكاز\n- قدم الارتكاز\n- الارتكاز الأمامي\n- الارتكاز الخلفي\n- المشي بالكرة\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التمريرات ويمسك الكرة ويحرك قدميه ويسأل: هل هذا قانوني؟ ويقدم الارتكاز (ص 105).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاحتفاظ بقدم ملامسة للأرض (قدم الارتكاز) وتحريك القدم الأخرى للأمام (ارتكاز أمامي) أو للخلف (ارتكاز خلفي) مع حماية الكرة بالجسم، ثم تطبيق موجه داخل الأطواق، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: قطاران متقابلان، استلام الكرة ثم الارتكاز الأمامي والخلفي بقدم الارتكاز داخل الطوق ثم التمرير، ثم مع مدافع يحاول لمس الكرة، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (التمثال): عند الصافرة يثبت الطالب قدم ارتكازه ويحمي الكرة من زميله 5 ثوانٍ، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع ركبة اليمنى بزاوية قائمة، الكرة على أصابع اليد اليمنى مسنودة بالأخرى، التصويب عند أعلى نقطة على اللوحة والهبوط على القدمين، ثم تطبيق موجه بالخطوات داخل الأطواق دون كرة ثم بالكرة، ويقلد الطالب بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. قطارات التصويبة السلمية من الجانب الأيمن ثم الأيسر بعد المحاورة، ويعد القائد الإصابات ويصحح الأخطاء (ثلاث خطوات، عدم رفع الركبة)، ويتدرب الطالب ويصحح (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويبة السلمية بين المجموعات، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم التي تبقى ملامسة للأرض ولا تتحرك.\nس2 (مستوى التطبيق): ما استخدامات الارتكاز؟\nالإجابة: حماية الكرة وتغيير الاتجاه وأخذ وضع التصويب.\nس3 (مستوى الاستدلال): ما المخالفة عند رفع قدم الارتكاز؟\nالإجابة: المشي بالكرة.\n\nس4 (مستوى المعرفة): كم خطوة قبل الارتقاء؟\nالإجابة: خطوتان.\nس5 (مستوى التطبيق): أي ركبة نرفع عند التصويب باليمنى؟\nالإجابة: الركبة اليمنى.\nس6 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: للتصويب من المسافات القصيرة بعد المحاورة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الارتكاز الأمامي والخلفي داخل الطوق.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف تحمي الكرة من المدافع بالارتكاز؟\nالإجابة: أدير جسمي بين الكرة والمدافع مع ثبات قدم الارتكاز.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز الأمامي والخلفي؟\nالإجابة: الأمامي تتحرك القدم الحرة للأمام والخلفي للخلف.\n\nس4 (مستوى المعرفة): أدِّ التصويبة السلمية من الجانب الأيمن.\nالإجابة: يؤديها.\nس5 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات، ما الخطأ؟\nالإجابة: مخالفة المشي بالكرة.\nس6 (مستوى الاستدلال): لماذا نصوب على اللوحة؟\nالإجابة: لأن الكرة ترتد منها إلى السلة بدقة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طالبك على الارتكاز مع ثبات قدم واحدة (دليل المعلم ص 105).\nإرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة (دليل المعلم ص 106).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"focus": "محطات مهارات كرة السلة للصغار ومنافساتها + مباريات كرة السلة للصغار وتطبيق القواعد", "num": 3, "fields": {"المخرجات التعليمية": "1. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز والتصويبة السلمية في محطات (10 دقائق)\n2. يوظف المهارات في منافسات (5 دقائق)\n3. يتعاون مع مجموعته ويلتزم بالقواعد (5 دقائق)\n4. يطبق القواعد القانونية في مباراة كرة سلة للصغار (10 دقائق)\n5. يوظف المهارات الأساسية أثناء المباراة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "- المحطات\n- التمرير\n- الارتكاز\n- التصويب\n- المنافسة\n- المباراة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المهارات الأربع ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 110: التمريرة المرتدة مع مدافع، التمرير من فوق الرأس لمسافة 6 م، الارتكاز داخل الطوق ثم التمرير، المحاورة والتصويبة السلمية، مع التبديل، ويؤدي الطالب ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 111: تتابع تمرير ثم محاورة وتصويبة سلمية في 3 دقائق والأكثر نقاطًا تفوز، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا فشلت بعض التصويبات؟ ليستنتج الطلبة أهمية الخطوتين والارتقاء الصحيح، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. يخطط كل فريق توزيع لاعبيه وأدوارهم، ويخطط الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 112-113: مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل، ميقاتي)، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. نشاط تقويمي ص 113: متى تستخدم التمريرة المرتدة والارتكاز في المباراة؟ ليستنتج الطلبة، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – مرتدة من مسندم إلى ظفار: يقف الطلبة في صف يمثل خريطة عمان من مسندم إلى ظفار، ويمررون الكرة تمريرة مرتدة، ويذكر كل مستلم اسم محافظة حتى تصل الكرة إلى ظفار (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المرتدة مع مدافع والتصويبة السلمية.\nس2 (مستوى التطبيق): ما ترتيب منافسة القطار؟\nالإجابة: تمرير متتابع ثم محاورة ثم تصويبة سلمية.\nس3 (مستوى الاستدلال): ما سبب فشل التصويبة السلمية غالبًا؟\nالإجابة: خطوات زائدة أو عدم رفع الركبة.\n\nس4 (مستوى المعرفة): كم فترة في مباراة كرة السلة للصغار؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس5 (مستوى التطبيق): متى نستخدم الارتكاز في المباراة؟\nالإجابة: لحماية الكرة أو أخذ وضع التصويب.\nس6 (مستوى الاستدلال): ما دور الميقاتي؟\nالإجابة: ضبط زمن الفترات.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الارتكاز ثم التمريرة المرتدة.\nالإجابة: يؤديهما.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس5 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويبة السلمية.\nس6 (مستوى الاستدلال): كيف تصرفت مع قرار حكم لم يعجبك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف (دليل المعلم ص 110-111).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة كرة سلة وتحليل التمريرات (التعلم الذاتي، دليل المعلم ص 113)، ومراجعة قواعد الريشة الطائرة (ص 114-116).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية لكرة السلة للصغار (عدد اللاعبين، الفترات، النقاط) (10 دقائق)\n2. يؤدي التمريرة المرتدة واستلامها (10 دقائق)\n3. يميز متى تستخدم التمريرة المرتدة (منافس طويل، بعد الخداع) (5 دقائق)\n4. يتعرف التمرير من فوق الرأس ومتى يستخدم (5 دقائق)\n5. يؤدي التمرير من فوق الرأس بتحريك الرسغين ومتابعة الحركة (5 دقائق)\n6. يختار نوع التمريرة حسب موقف المدافع (5 دقائق)\n\nالحصة 2:\n1. يتعرف الارتكاز واستخداماته (حماية الكرة، تغيير الاتجاه، أخذ وضع التصويب) (5 دقائق)\n2. يؤدي الارتكاز الأمامي والخلفي مع ثبات قدم الارتكاز (10 دقائق)\n3. يطبق قاعدة قدم الارتكاز ويميز مخالفة المشي بالكرة (5 دقائق)\n4. يتعرف النقاط الفنية للتصويبة السلمية ومتى تستخدم (5 دقائق)\n5. يؤدي التصويبة السلمية بخطوتين وارتقاء وتصويب على اللوحة (10 دقائق)\n6. يميز الأخطاء الشائعة ويصححها (5 دقائق)\n\nالحصة 3:\n1. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز والتصويبة السلمية في محطات (10 دقائق)\n2. يوظف المهارات في منافسات (5 دقائق)\n3. يتعاون مع مجموعته ويلتزم بالقواعد (5 دقائق)\n4. يطبق القواعد القانونية في مباراة كرة سلة للصغار (10 دقائق)\n5. يوظف المهارات الأساسية أثناء المباراة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة اللعبة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تحليل\n\nالحصة 3:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: كرات سلة\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلة\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: كرات سلة\n- أخرى: سلال\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: صدريات ملونة\n- أخرى: صافرة", "المفاهيم": "الحصة 1:\n- كرة السلة للصغار\n- التمريرة المرتدة\n- نقطة الارتداد\n- القواعد القانونية\n- التمرير من فوق الرأس\n- الرسغ\n- المدافع القصير\n- المسافة المتوسطة\n\nالحصة 2:\n- الارتكاز\n- قدم الارتكاز\n- الارتكاز الأمامي\n- الارتكاز الخلفي\n- المشي بالكرة\n- التصويبة السلمية\n- الخطوتان\n- الارتقاء\n- اللوحة\n\nالحصة 3:\n- المحطات\n- التمرير\n- الارتكاز\n- التصويب\n- المنافسة\n- المباراة\n- القواعد القانونية\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم قواعد كرة السلة للصغار ويقف طالب طويل أمام ممرر ويسأل: كيف نمرر من تحت ذراعيه؟ (ص 101-104).\n\nالحصة 2:\nيراجع المعلم التمريرات ويمسك الكرة ويحرك قدميه ويسأل: هل هذا قانوني؟ ويقدم الارتكاز (ص 105).\n\nالحصة 3:\nيراجع المعلم المهارات الأربع ويعرض المحطات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج ص 104: وقوف والركبتان منثنيتان، مسك الكرة قريبة من الصدر والمرفقان للأسفل، مد الذراعين ودفع الكرة إلى الأرض عند ثلثي المسافة لترتد إلى مستوى خصر الزميل، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: صفان متقابلان تبادل التمريرة المرتدة مع علامة لنقطة الارتداد، ثم ثلاثيات بمدافع في المنتصف يرفع ذراعيه، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (10 تمريرات مرتدة) بين مجموعتين، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: قدم متقدمة، رفع الكرة عاليًا فوق الرأس، رمي الكرة بتحريك الرسغين مع مد الذراعين للأمام ومتابعة الحركة، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. ثلاثيات (ممرر، مدافع، مستلم): يختار الممرر المرتدة أو من فوق الرأس حسب طول المدافع ووضع ذراعيه، مع التبديل، ويتدرب الطالب ويختار (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (كرة الملك) بالتمريرتين فقط، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: الاحتفاظ بقدم ملامسة للأرض (قدم الارتكاز) وتحريك القدم الأخرى للأمام (ارتكاز أمامي) أو للخلف (ارتكاز خلفي) مع حماية الكرة بالجسم، ثم تطبيق موجه داخل الأطواق، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات: قطاران متقابلان، استلام الكرة ثم الارتكاز الأمامي والخلفي بقدم الارتكاز داخل الطوق ثم التمرير، ثم مع مدافع يحاول لمس الكرة، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (التمثال): عند الصافرة يثبت الطالب قدم ارتكازه ويحمي الكرة من زميله 5 ثوانٍ، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: مسك الكرة بعد التنطيط، خطوة باليمنى ثم باليسرى، الارتقاء مع رفع ركبة اليمنى بزاوية قائمة، الكرة على أصابع اليد اليمنى مسنودة بالأخرى، التصويب عند أعلى نقطة على اللوحة والهبوط على القدمين، ثم تطبيق موجه بالخطوات داخل الأطواق دون كرة ثم بالكرة، ويقلد الطالب بالتدرج (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. قطارات التصويبة السلمية من الجانب الأيمن ثم الأيسر بعد المحاورة، ويعد القائد الإصابات ويصحح الأخطاء (ثلاث خطوات، عدم رفع الركبة)، ويتدرب الطالب ويصحح (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. منافسة التصويبة السلمية بين المجموعات، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات ص 110: التمريرة المرتدة مع مدافع، التمرير من فوق الرأس لمسافة 6 م، الارتكاز داخل الطوق ثم التمرير، المحاورة والتصويبة السلمية، مع التبديل، ويؤدي الطالب ويبدل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 111: تتابع تمرير ثم محاورة وتصويبة سلمية في 3 دقائق والأكثر نقاطًا تفوز، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا فشلت بعض التصويبات؟ ليستنتج الطلبة أهمية الخطوتين والارتقاء الصحيح، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. يخطط كل فريق توزيع لاعبيه وأدوارهم، ويخطط الطالب (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 112-113: مباريات قصيرة بالتبادل مع حكام من الطلبة (حكم، مسجل، ميقاتي)، ويلعب الطالب ويحكم (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. نشاط تقويمي ص 113: متى تستخدم التمريرة المرتدة والارتكاز في المباراة؟ ليستنتج الطلبة، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – مرتدة من مسندم إلى ظفار: يقف الطلبة في صف يمثل خريطة عمان من مسندم إلى ظفار، ويمررون الكرة تمريرة مرتدة، ويذكر كل مستلم اسم محافظة حتى تصل الكرة إلى ظفار (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): أين ترتد الكرة في التمريرة المرتدة؟\nالإجابة: عند ثلثي المسافة إلى الزميل.\nس2 (مستوى التطبيق): متى نستخدم التمريرة المرتدة؟\nالإجابة: عند وجود منافس طويل القامة أو بعد الخداع.\nس3 (مستوى الاستدلال): إلى أي مستوى تصل الكرة للزميل؟\nالإجابة: مستوى الخصر.\n\nس4 (مستوى المعرفة): متى نستخدم التمرير من فوق الرأس؟\nالإجابة: للمسافات المتوسطة أو عند وجود مدافع قصير.\nس5 (مستوى التطبيق): ما الذي يعطي الكرة سرعتها في هذه التمريرة؟\nالإجابة: تحريك الرسغين ومد الذراعين.\nس6 (مستوى الاستدلال): المدافع طويل ويرفع ذراعيه، أي تمريرة تختار؟\nالإجابة: المرتدة.\n\nالحصة 2:\nتفريد التعليم:\nس1 (مستوى المعرفة): ما قدم الارتكاز؟\nالإجابة: القدم التي تبقى ملامسة للأرض ولا تتحرك.\nس2 (مستوى التطبيق): ما استخدامات الارتكاز؟\nالإجابة: حماية الكرة وتغيير الاتجاه وأخذ وضع التصويب.\nس3 (مستوى الاستدلال): ما المخالفة عند رفع قدم الارتكاز؟\nالإجابة: المشي بالكرة.\n\nس4 (مستوى المعرفة): كم خطوة قبل الارتقاء؟\nالإجابة: خطوتان.\nس5 (مستوى التطبيق): أي ركبة نرفع عند التصويب باليمنى؟\nالإجابة: الركبة اليمنى.\nس6 (مستوى الاستدلال): متى نستخدم التصويبة السلمية؟\nالإجابة: للتصويب من المسافات القصيرة بعد المحاورة.\n\nالحصة 3:\nتفريد التعليم:\nس1 (مستوى المعرفة): اذكر محطتين من محطات اليوم.\nالإجابة: المرتدة مع مدافع والتصويبة السلمية.\nس2 (مستوى التطبيق): ما ترتيب منافسة القطار؟\nالإجابة: تمرير متتابع ثم محاورة ثم تصويبة سلمية.\nس3 (مستوى الاستدلال): ما سبب فشل التصويبة السلمية غالبًا؟\nالإجابة: خطوات زائدة أو عدم رفع الركبة.\n\nس4 (مستوى المعرفة): كم فترة في مباراة كرة السلة للصغار؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس5 (مستوى التطبيق): متى نستخدم الارتكاز في المباراة؟\nالإجابة: لحماية الكرة أو أخذ وضع التصويب.\nس6 (مستوى الاستدلال): ما دور الميقاتي؟\nالإجابة: ضبط زمن الفترات.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ التمريرة المرتدة لزميلك مع وجود مدافع.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كم لاعبًا في فريق كرة السلة للصغار داخل الملعب؟\nالإجابة: يذكر وفق قواعد الدليل (ص 102).\nس3 (مستوى الاستدلال): ما الفرق بين التمريرة الصدرية والمرتدة؟\nالإجابة: الصدرية مباشرة في الهواء، والمرتدة عبر الأرض.\n\nس4 (مستوى المعرفة): أدِّ التمرير من فوق الرأس لزميلك.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): اذكر ثلاث تمريرات تعلمتها في كرة السلة للصغار.\nالإجابة: الصدرية والمرتدة ومن فوق الرأس.\nس6 (مستوى الاستدلال): لماذا نتابع الحركة باليدين بعد التمرير؟\nالإجابة: للدقة والقوة.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الارتكاز الأمامي والخلفي داخل الطوق.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف تحمي الكرة من المدافع بالارتكاز؟\nالإجابة: أدير جسمي بين الكرة والمدافع مع ثبات قدم الارتكاز.\nس3 (مستوى الاستدلال): ما الفرق بين الارتكاز الأمامي والخلفي؟\nالإجابة: الأمامي تتحرك القدم الحرة للأمام والخلفي للخلف.\n\nس4 (مستوى المعرفة): أدِّ التصويبة السلمية من الجانب الأيمن.\nالإجابة: يؤديها.\nس5 (مستوى التطبيق): زميلك يأخذ ثلاث خطوات، ما الخطأ؟\nالإجابة: مخالفة المشي بالكرة.\nس6 (مستوى الاستدلال): لماذا نصوب على اللوحة؟\nالإجابة: لأن الكرة ترتد منها إلى السلة بدقة.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ الارتكاز ثم التمريرة المرتدة.\nالإجابة: يؤديهما.\nس2 (مستوى التطبيق): ما المهارة التي تحتاج إلى تدريب أكثر؟\nالإجابة: يذكر.\nس3 (مستوى الاستدلال): كيف ساعدت مجموعتك؟\nالإجابة: يذكر.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها اليوم.\nالإجابة: مثل: عدم التنطيط المزدوج.\nس5 (مستوى التطبيق): ما المهارة التي أحرزت بها نقاطًا؟\nالإجابة: التصويبة السلمية.\nس6 (مستوى الاستدلال): كيف تصرفت مع قرار حكم لم يعجبك؟\nالإجابة: احترمته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طالبك على التمريرة المرتدة على الحائط (دليل المعلم ص 101-104).\nإرشاد لولي الأمر: تدرب مع طالبك على التمرير من فوق الرأس مع وجود مدافع (دليل المعلم ص 105).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9\n\nالحصة 2:\nإرشاد لولي الأمر: تدرب مع طالبك على الارتكاز مع ثبات قدم واحدة (دليل المعلم ص 105).\nإرشاد لولي الأمر: شجع طالبك على تدريب الخطوتين والارتقاء دون كرة (دليل المعلم ص 106).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9\n\nالحصة 3:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة الأضعف (دليل المعلم ص 110-111).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة كرة سلة وتحليل التمريرات (التعلم الذاتي، دليل المعلم ص 113)، ومراجعة قواعد الريشة الطائرة (ص 114-116).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=9"}}, {"title": "لعبة الريشة الطائرة", "unit": "الألعاب الحركية (1)", "week": "الثالث عشر – الرابع عشر", "date": "29/11-3/12/2026 إلى 6-10/12/2026", "pages": "دليل المعلم ص 114-125", "n": 2, "periods": [{"focus": "القواعد القانونية وقبضة المضرب والإرسال بوجه المضرب الأمامي + ضرب الريشة بوجه المضرب الخلفي", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف القواعد القانونية للريشة الطائرة (الملعب، الإرسال، النقاط) (5 دقائق)\n2. يؤدي قبضة المضرب (مسكة V) والإرسال بوجه المضرب الأمامي نحو مناطق محددة (10 دقائق)\n3. يقدر أهمية الإرسال الدقيق في بدء اللعب (5 دقائق)\n4. يتعرف النقاط الفنية للضرب بوجه المضرب الخلفي ومتى يستخدم (5 دقائق)\n5. يؤدي ضرب الريشة بوجه المضرب الخلفي من مستويات مختلفة (10 دقائق)\n6. يميز بين الضرب بوجه المضرب الأمامي والخلفي (5 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أطواق\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: أقماع", "المفاهيم": "- الريشة الطائرة\n- قبضة المضرب (V)\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال\n- وجه المضرب الخلفي\n- ظهر اليد\n- المرجحة\n- الريشة القادمة للجهة المعاكسة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم القواعد ومسكة V من الصف الخامس ويسأل: كيف يبدأ اللعب؟ ويعرض الإرسال (ص 117-118).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء: جري، خطو جانبي، تحريك الرسغين، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة، مسك المضرب باليد المعاكسة للقدم المتقدمة بمسكة V، مسك الريشة بأصابع اليد الأخرى وإسقاطها على الوجه الأمامي للمضرب مع أرجحته للخلف ثم للأمام لضربها أسفل الخصر نحو المنافس، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 121: الإرسال نحو الأطواق في الملعب المقابل ويعد القائد الإصابات، ثم الإرسال فوق الحبل للزميل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة الإرسال نحو المناطق بين مجموعتين، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: مسك المضرب والنظر إلى الريشة، رفع المضرب عاليًا مع مواجهة ظهر اليد للريشة، مرجحة المضرب وضرب الريشة بوجهه الخلفي وتوجيهها، ثم تطبيق موجه بريشة مرمية، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات ص 121-122: رمي الريشة للزميل جهة ظهر اليد وضربها بوجه المضرب الخلفي نحوه، ثم تبادل الضرب بالوجهين الأمامي والخلفي دون شبكة، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (أمامي أم خلفي): ينادي المعلم ويرمي الريشة فيضربها الطالب بالوجه الصحيح، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف نمسك المضرب؟\nالإجابة: بمسكة V (الإبهام والسبابة حرف V على المقبض).\nس2 (مستوى التطبيق): بأي يد نمسك المضرب بالنسبة للقدم المتقدمة؟\nالإجابة: باليد المعاكسة.\nس3 (مستوى الاستدلال): أين تضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\n\nس4 (مستوى المعرفة): متى نستخدم وجه المضرب الخلفي؟\nالإجابة: للريشة القادمة أمام الجسم أو باتجاه الجهة المعاكسة لليد الضاربة.\nس5 (مستوى التطبيق): ما وضع ظهر اليد عند الضرب الخلفي؟\nالإجابة: يواجه الريشة.\nس6 (مستوى الاستدلال): ما الفرق بين الضربتين؟\nالإجابة: الأمامية من جهة راحة اليد والخلفية من جهة ظهر اليد.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الإرسال بوجه المضرب الأمامي نحو الطوق 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد الإرسال.\nالإجابة: من منطقة الإرسال وأسفل الخصر.\nس3 (مستوى الاستدلال): لماذا يهم الإرسال الدقيق؟\nالإجابة: لإرباك المنافس وإحراز النقاط.\n\nس4 (مستوى المعرفة): اضرب الريشة القادمة جهة ظهر يدك بوجه المضرب الخلفي.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): الريشة قادمة إلى يمينك وأنت أيمن، أي وجه تستخدم؟\nالإجابة: الأمامي.\nس6 (مستوى الاستدلال): لماذا نرفع المضرب عاليًا قبل الضرب؟\nالإجابة: لإعطاء المرجحة قوة ومدى.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف في المنزل (دليل المعلم ص 117-118).\nإرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالوجهين (دليل المعلم ص 118-122).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}, {"focus": "حركات القدمين (التحرك للجانبين) والمحطات + مباريات الريشة الطائرة وتطبيق القواعد", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي حركات القدمين للجانبين بالخطو والطعن لضرب الريشة (10 دقائق)\n2. يربط حركة الرجلين بأرجحة الذراع الضاربة (5 دقائق)\n3. يؤدي مهارات الريشة في محطات متكاملة (5 دقائق)\n4. يطبق القواعد القانونية للريشة الطائرة في مباريات فردية وزوجية (10 دقائق)\n5. يوظف الإرسال والضرب بالوجهين وحركات القدمين في المباراة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شبكة أو حبل\n- أخرى: شبكة\n- أخرى: شريط لاصق", "المفاهيم": "- حركات القدمين\n- الطعن للجانب\n- التوافق\n- المحطات\n- المباراة\n- احتساب النقاط\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الريشة بعيدًا إلى جانب طالب ويسأل: كيف يصل إليها بسرعة ويعود؟ (ص 119).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء مع الطعن للجانبين، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة باتجاه الريشة، ثني ركبة الرجل القريبة والطعن للجانب، توافق حركة الرجلين مع أرجحة الذراع الضاربة، والذراع الحرة للتوازن، ثم العودة إلى المنتصف، فتطبيق موجه، ويقلد الطالب ويطبق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات ص 123: الإرسال نحو المربعات، الضرب بالوجه الخلفي، التحرك للجانبين لضرب ريشة مرمية، تبادل الضرب دون سقوط، مع التبديل، ويؤدي الطالب ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الركنان): رمي الريشة إلى الركنين والتحرك لضربها ثم العودة للمنتصف، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تدريب تبادل الضرب في أزواج فوق الشبكة مع العد، ويتدرب الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 124-125: مباريات فردية وزوجية حتى 7 نقاط بحكام من الطلبة، ويلعب الطالب ويحكم (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى خسرتم النقاط؟ ليستنتج الطلبة أهمية العودة للمنتصف والإرسال الدقيق، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – إرسال إلى معالم مسقط: يحدد المعلم مناطق في ملعب الريشة تحمل أسماء معالم مثل جامع السلطان قابوس الأكبر ودار الأوبرا السلطانية وقلعة الجلالي، ويرسل الأزواج نحوها لجمع النقاط (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف نتحرك لريشة قادمة إلى الجانب؟\nالإجابة: بخطوة أو عدة خطوات جانبية والطعن بالرجل القريبة.\nس2 (مستوى التطبيق): لماذا نحرك الذراع الحرة؟\nالإجابة: لحفظ توازن الجسم.\nس3 (مستوى الاستدلال): لماذا نعود للمنتصف بعد الضرب؟\nالإجابة: للاستعداد للريشة التالية.\n\nس4 (مستوى المعرفة): متى تحتسب النقطة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها بعد ضربه.\nس5 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.\nس6 (مستوى الاستدلال): ما الفرق بين المباراة الفردية والزوجية؟\nالإجابة: الفردية لاعب ضد لاعب والزوجية اثنان ضد اثنين.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الطعن للجانب وضرب الريشة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات والضرب الخلفي.\nس3 (مستوى الاستدلال): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب بتوازن.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الإرسال أسفل الخصر.\nس5 (مستوى التطبيق): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التحرك للجانبين لضرب ريشة يرميها زميل (دليل المعلم ص 119-123).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة ريشة طائرة وتسجيل عدد الإرسالات (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف القواعد القانونية للريشة الطائرة (الملعب، الإرسال، النقاط) (5 دقائق)\n2. يؤدي قبضة المضرب (مسكة V) والإرسال بوجه المضرب الأمامي نحو مناطق محددة (10 دقائق)\n3. يقدر أهمية الإرسال الدقيق في بدء اللعب (5 دقائق)\n4. يتعرف النقاط الفنية للضرب بوجه المضرب الخلفي ومتى يستخدم (5 دقائق)\n5. يؤدي ضرب الريشة بوجه المضرب الخلفي من مستويات مختلفة (10 دقائق)\n6. يميز بين الضرب بوجه المضرب الأمامي والخلفي (5 دقائق)\n\nالحصة 2:\n1. يؤدي حركات القدمين للجانبين بالخطو والطعن لضرب الريشة (10 دقائق)\n2. يربط حركة الرجلين بأرجحة الذراع الضاربة (5 دقائق)\n3. يؤدي مهارات الريشة في محطات متكاملة (5 دقائق)\n4. يطبق القواعد القانونية للريشة الطائرة في مباريات فردية وزوجية (10 دقائق)\n5. يوظف الإرسال والضرب بالوجهين وحركات القدمين في المباراة (5 دقائق)\n6. يستمتع بمشاركة زملائه ممارسة الريشة الطائرة بروح رياضية (5 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة أو حبل\n- أخرى: أطواق\n- صورة توضيحية\n- جهاز عرض البيانات\n- أخرى: أقماع\n\nالحصة 2:\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: شبكة أو حبل\n- أخرى: شبكة\n- أخرى: شريط لاصق", "المفاهيم": "الحصة 1:\n- الريشة الطائرة\n- قبضة المضرب (V)\n- الإرسال\n- وجه المضرب الأمامي\n- منطقة الإرسال\n- وجه المضرب الخلفي\n- ظهر اليد\n- المرجحة\n- الريشة القادمة للجهة المعاكسة\n\nالحصة 2:\n- حركات القدمين\n- الطعن للجانب\n- التوافق\n- المحطات\n- المباراة\n- احتساب النقاط\n- التحكيم\n- الروح الرياضية", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيراجع المعلم القواعد ومسكة V من الصف الخامس ويسأل: كيف يبدأ اللعب؟ ويعرض الإرسال (ص 117-118).\n\nالحصة 2:\nيرمي المعلم الريشة بعيدًا إلى جانب طالب ويسأل: كيف يصل إليها بسرعة ويعود؟ (ص 119).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء: جري، خطو جانبي، تحريك الرسغين، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة، مسك المضرب باليد المعاكسة للقدم المتقدمة بمسكة V، مسك الريشة بأصابع اليد الأخرى وإسقاطها على الوجه الأمامي للمضرب مع أرجحته للخلف ثم للأمام لضربها أسفل الخصر نحو المنافس، ثم تطبيق موجه، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريبات ص 121: الإرسال نحو الأطواق في الملعب المقابل ويعد القائد الإصابات، ثم الإرسال فوق الحبل للزميل، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة الإرسال نحو المناطق بين مجموعتين، ويتسابق الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم النموذج: مسك المضرب والنظر إلى الريشة، رفع المضرب عاليًا مع مواجهة ظهر اليد للريشة، مرجحة المضرب وضرب الريشة بوجهه الخلفي وتوجيهها، ثم تطبيق موجه بريشة مرمية، ويقلد الطالب ويطبق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريبات ص 121-122: رمي الريشة للزميل جهة ظهر اليد وضربها بوجه المضرب الخلفي نحوه، ثم تبادل الضرب بالوجهين الأمامي والخلفي دون شبكة، ويتدرب الطالب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة (أمامي أم خلفي): ينادي المعلم ويرمي الريشة فيضربها الطالب بالوجه الصحيح، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n1. إحماء مع الطعن للجانبين، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: قدم متقدمة باتجاه الريشة، ثني ركبة الرجل القريبة والطعن للجانب، توافق حركة الرجلين مع أرجحة الذراع الضاربة، والذراع الحرة للتوازن، ثم العودة إلى المنتصف، فتطبيق موجه، ويقلد الطالب ويطبق (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات ص 123: الإرسال نحو المربعات، الضرب بالوجه الخلفي، التحرك للجانبين لضرب ريشة مرمية، تبادل الضرب دون سقوط، مع التبديل، ويؤدي الطالب ويبدل (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (الركنان): رمي الريشة إلى الركنين والتحرك لضربها ثم العودة للمنتصف، ويلعب الطالب (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تدريب تبادل الضرب في أزواج فوق الشبكة مع العد، ويتدرب الطالب (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. مباريات ص 124-125: مباريات فردية وزوجية حتى 7 نقاط بحكام من الطلبة، ويلعب الطالب ويحكم (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يسأل المعلم: متى خسرتم النقاط؟ ليستنتج الطلبة أهمية العودة للمنتصف والإرسال الدقيق، ويستنتج الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. تهدئة ومصافحة، ويؤدي الطالب التهدئة ويصافح (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. غلق الدرس (نشاط ممتع مع المواطنة) – إرسال إلى معالم مسقط: يحدد المعلم مناطق في ملعب الريشة تحمل أسماء معالم مثل جامع السلطان قابوس الأكبر ودار الأوبرا السلطانية وقلعة الجلالي، ويرسل الأزواج نحوها لجمع النقاط (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "التقويم التكويني": "الحصة 1:\nتفريد التعليم:\nس1 (مستوى المعرفة): كيف نمسك المضرب؟\nالإجابة: بمسكة V (الإبهام والسبابة حرف V على المقبض).\nس2 (مستوى التطبيق): بأي يد نمسك المضرب بالنسبة للقدم المتقدمة؟\nالإجابة: باليد المعاكسة.\nس3 (مستوى الاستدلال): أين تضرب الريشة في الإرسال؟\nالإجابة: أسفل الخصر.\n\nس4 (مستوى المعرفة): متى نستخدم وجه المضرب الخلفي؟\nالإجابة: للريشة القادمة أمام الجسم أو باتجاه الجهة المعاكسة لليد الضاربة.\nس5 (مستوى التطبيق): ما وضع ظهر اليد عند الضرب الخلفي؟\nالإجابة: يواجه الريشة.\nس6 (مستوى الاستدلال): ما الفرق بين الضربتين؟\nالإجابة: الأمامية من جهة راحة اليد والخلفية من جهة ظهر اليد.\n\nالحصة 2:\nتفريد التعليم:\nس1 (مستوى المعرفة): كيف نتحرك لريشة قادمة إلى الجانب؟\nالإجابة: بخطوة أو عدة خطوات جانبية والطعن بالرجل القريبة.\nس2 (مستوى التطبيق): لماذا نحرك الذراع الحرة؟\nالإجابة: لحفظ توازن الجسم.\nس3 (مستوى الاستدلال): لماذا نعود للمنتصف بعد الضرب؟\nالإجابة: للاستعداد للريشة التالية.\n\nس4 (مستوى المعرفة): متى تحتسب النقطة؟\nالإجابة: عند سقوط الريشة في ملعب المنافس أو خروجها بعد ضربه.\nس5 (مستوى التطبيق): ما دور الحكم؟\nالإجابة: احتساب النقاط ومراقبة الإرسال.\nس6 (مستوى الاستدلال): ما الفرق بين المباراة الفردية والزوجية؟\nالإجابة: الفردية لاعب ضد لاعب والزوجية اثنان ضد اثنين.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ الإرسال بوجه المضرب الأمامي نحو الطوق 5 مرات.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد الإرسال.\nالإجابة: من منطقة الإرسال وأسفل الخصر.\nس3 (مستوى الاستدلال): لماذا يهم الإرسال الدقيق؟\nالإجابة: لإرباك المنافس وإحراز النقاط.\n\nس4 (مستوى المعرفة): اضرب الريشة القادمة جهة ظهر يدك بوجه المضرب الخلفي.\nالإجابة: يؤديه.\nس5 (مستوى التطبيق): الريشة قادمة إلى يمينك وأنت أيمن، أي وجه تستخدم؟\nالإجابة: الأمامي.\nس6 (مستوى الاستدلال): لماذا نرفع المضرب عاليًا قبل الضرب؟\nالإجابة: لإعطاء المرجحة قوة ومدى.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الطعن للجانب وضرب الريشة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: الإرسال نحو المربعات والضرب الخلفي.\nس3 (مستوى الاستدلال): كيف تساعد حركات القدمين على دقة الضرب؟\nالإجابة: تجعلني أصل للريشة في الوقت المناسب بتوازن.\n\nس4 (مستوى المعرفة): اذكر قاعدة طبقتها في المباراة.\nالإجابة: مثل: الإرسال أسفل الخصر.\nس5 (مستوى التطبيق): ما المهارة التي أحرزت بها أكثر النقاط؟\nالإجابة: يذكر.\nس6 (مستوى الاستدلال): كيف شعرت في المباراة ولماذا؟\nالإجابة: يعبر.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على الإرسال نحو هدف في المنزل (دليل المعلم ص 117-118).\nإرشاد لولي الأمر: تبادل مع طالبك ضرب الريشة بالوجهين (دليل المعلم ص 118-122).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التحرك للجانبين لضرب ريشة يرميها زميل (دليل المعلم ص 119-123).\nإرشاد لولي الأمر: شجع طالبك على مشاهدة مباراة ريشة طائرة وتسجيل عدد الإرسالات (التعلم الذاتي، دليل المعلم ص 125) ومراجعة مهارات الألعاب الثلاث قبل الاختبار.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=10"}}, {"title": "الاختبار العملي (2)", "unit": "تقويم", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 89-125 (الألعاب الحركية 1)", "n": 1, "periods": [{"focus": "اختبار عملي في مهارات كرة القدم للصغار وكرة السلة للصغار + اختبار عملي في مهارات الريشة الطائرة وتطبيق القواعد", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الجري بالكرة مع الدوران والتمرير بوجه القدم الداخلي والسيطرة بالفخذ (10 دقائق)\n2. يؤدي التمريرة المرتدة والتمرير من فوق الرأس والارتكاز (5 دقائق)\n3. يؤدي التصويبة السلمية (5 دقائق)\n4. يؤدي الإرسال بوجه المضرب الأمامي نحو هدف (10 دقائق)\n5. يؤدي الضرب بوجه المضرب الخلفي مع حركات القدمين (5 دقائق)\n6. يطبق القواعد القانونية للألعاب الثلاث في مواقف لعب (5 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات قدم\n- أخرى: كرات سلة\n- أخرى: أقماع\n- أخرى: سلة\n- أخرى: أطواق\n- أخرى: استمارة تقويم الأداء\n- أخرى: مضارب ريشة\n- أخرى: ريش طائرة\n- أخرى: شبكة", "المفاهيم": "- الاختبار العملي\n- كرة القدم للصغار\n- كرة السلة للصغار\n- الإرسال\n- الضرب الخلفي\n- القواعد القانونية", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات الاختبار ومعاييره.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بالكرة، ويقلد الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اختبار فردي: محطة 1 الجري بالكرة والدوران حول القمع ثم التمرير بوجه القدم الداخلي + السيطرة بالفخذ، محطة 2 التمريرة المرتدة ومن فوق الرأس 5 مرات لكل منهما + الارتكاز داخل الطوق، محطة 3 التصويبة السلمية 5 محاولات؛ ويرصد المعلم، ويؤدي الطالب عند دوره ويتدرب مستقلًا (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية، ويلعب الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. اختبار فردي: محطة 1 الإرسال نحو الطوق 5 محاولات، محطة 2 ضرب 5 ريشات مرمية جهة ظهر اليد بالوجه الخلفي مع التحرك للجانب، محطة 3 أسئلة قواعد وموقف لعب قصير؛ ويرصد المعلم، ويؤدي الطالب عند دوره ويتدرب مستقلًا (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. لعبة ختامية، ويلعب الطالب (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. تهدئة وتعزيز وإعلان الإجازة، ويؤدي الطالب التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. غلق الدرس (نشاط ممتع مع المواطنة) – كأس الخليج المصغر: تنظم المجموعات بطولة مصغرة سريعة بمهارات الاختبار، ويتذكر الطلبة فوز منتخب عمان بكأس الخليج، ويحيي الفريق الفائز منافسه ب let mode='sep', li=0, pi=0;
const sel=document.getElementById('lesson');
DATA.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+L.title+' ('+L.n+(L.n==1?' حصة':L.n==2?' حصتان':' حصص')+')';sel.appendChild(o);});
document.getElementById('gnote').textContent=GNOTE;
function setMode(m){mode=m;document.getElementById('mSep').classList.toggle('on',m=='sep');document.getElementById('mComb').classList.toggle('on',m=='comb');render();}
function pickLesson(){li=+sel.value;pi=0;render();}
function render(){
  const L=DATA[li];
  document.getElementById('state').textContent = mode=='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة، اختر الحصة ثم انسخ كل بند على حدة.' : 'أنت الآن في الوضع المدمج: نموذج واحد للدرس، وكل بند يضم حصص الدرس معًا بعناوين الحصة 1، الحصة 2…';
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  if(mode=='sep'){L.periods.forEach((p,i)=>{const b=document.createElement('button');b.className='tab'+(i==pi?' on':'');b.textContent='الحصة '+(i+1)+' من '+L.n;b.onclick=()=>{pi=i;render();};tabs.appendChild(b);});}
  const m=document.getElementById('meta');
  const focus = mode=='sep' ? L.periods[pi].focus : L.periods.map((p,i)=>'الحصة '+(i+1)+': '+p.focus).join(' | ');
  m.innerHTML='<div><b>الدرس:</b> '+esc(L.title)+'</div><div><b>الوحدة:</b> '+esc(L.unit)+'</div><div><b>الأسبوع والتاريخ:</b> '+esc(L.week)+' – '+esc(L.date)+'</div><div><b>المرجع:</b> '+esc(L.pages)+'</div><div><b>'+(mode=='sep'?'رقم الحصة:':'عدد الحصص:')+'</b> '+(mode=='sep'?(pi+1)+' من '+L.n:L.n)+'</div><div style="grid-column:1/-1"><b>محور الحصة:</b> '+esc(focus)+'</div>';
  const fields = mode=='sep' ? L.periods[pi].fields : L.combined;
  const c=document.getElementById('cards');c.innerHTML='';
  FIELDS.forEach((f,i)=>{
    const d=document.createElement('div');d.className='card';
    const txt=fields[f];
    d.innerHTML='<div class="hd"><h3>'+(i+1)+'. '+esc(f)+'</h3><button class="copy">نسخ</button></div><pre class="txt">'+esc(txt)+'</pre><div class="fb">تعذّر الوصول إلى الحافظة؛ حدّد النص أدناه وانسخه يدويًا (Ctrl+C):<textarea readonly></textarea></div>';
    const btn=d.querySelector('.copy');btn.onclick=()=>doCopy(btn,txt,d);
    c.appendChild(d);
  });
  window.scrollTo({top:document.getElementById('cards').offsetTop-80,behavior:'smooth'});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function doCopy(btn,txt,card){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){ try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);ok=document.execCommand('copy');document.body.removeChild(ta);}catch(e){} }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done');},1800);}
  else{const fb=card.querySelector('.fb');fb.style.display='block';const ta=fb.querySelector('textarea');ta.value=txt;ta.focus();ta.select();}
}
