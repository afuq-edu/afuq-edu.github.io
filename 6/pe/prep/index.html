\n\nالحصة 2:\n- المراجعة\n- الوثب\n- الرمي\n- التمرير", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرحب المعلم بالطلبة ويسأل: ما مراحل الإحماء الصحيح؟ ويعرض بطاقات التمرينات.\n\nالحصة 2:\nيسأل المعلم: ما المهارات التي تعلمتموها في الصف الخامس؟ ويطلب نماذج.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. لعبة إحماء (الصياد والصقور) ثم (النداء على التشكيل)، ويلعب الطالب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. يؤدي المعلم نماذج الإعداد البدني: جري متدرج، دوران الذراعين، لف الجذع، الطعن، انبطاح مائل ثني الذراعين، رفع الجذع من الرقود، بالعد الثماني، ويقلد الطالب بالعد (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بقائد تبني إحماءً كاملًا من البطاقات وتعرضه، والطلبة يتعاون ويعرض (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: ماذا تغير في النبض والتنفس؟ ليستنتج الطلبة استعداد الجسم للجهد، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وإطالة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. محطات مراجعة: الوثب الطويل من الاقتراب، رمي الرمح البلاستيكي، التمرير بباطن القدم والاستلام، التمريرة الصدرية والتصويب من الثبات، مع التبديل، ويؤدي الطالب ويبدل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. لعبة (كرة الملك)، ويلعب الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يحدد كل طالب مهارة يحتاج إلى تطويرها، ويحدد الطالب (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – الإحماء يحمي أبطالنا: يحصل كل طالب في المجموعة على رقم، ويسأل المعلم عن مرحلة من الإحماء أو إصابة يقي منها، ويجيب صاحب الرقم، ويذكّر بأن الرياضيين العمانيين يبدؤون بالإحماء دائمًا (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): لماذا نبدأ الحصة بالإعداد البدني؟\nالإجابة: لرفع حرارة العضلات والاستعداد ومنع الإصابة.\nس2 (مستوى التطبيق): اذكر تمرينًا للجذع.\nالإجابة: لف الجذع.\nس3 (مستوى الاستدلال): ما ترتيب الإحماء؟\nالإجابة: من الخفيف إلى الأقوى.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما تسلسل الوثب الثلاثي؟\nالإجابة: حجلة، خطوة، وثبة.\nس2 (مستوى التطبيق): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس3 (مستوى الاستدلال): من أي مستوى تؤدى التمريرة الصدرية؟\nالإجابة: من الصدر.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر ثلاث قواعد للأمن والسلامة.\nالإجابة: الاستجابة للصافرة، الإحماء، الحذاء الرياضي.\nس2 (مستوى التطبيق): أدِّ تمرينًا للرجلين بالعد الثماني.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك عرض الإحماء؟\nالإجابة: يعد القائد ونؤدي معًا.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الوثب الطويل من الاقتراب.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): أدِّ التمريرة الصدرية ثم التصويب من الثبات.\nالإجابة: يؤديهما.\nس3 (مستوى الاستدلال): ما المهارة التي ستطورها ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طالبك نماذج الإعداد البدني في دليل المعلم.\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على التدرب على المهارة التي اختارها، ومراجعة مفهوم اللياقة البدنية (دليل المعلم ص 34-35).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=1"}}, {"title": "تمرينات لتنمية عناصر اللياقة البدنية", "unit": "اللياقة البدنية", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 34-47", "n": 2, "periods": [{"focus": "مفهوم اللياقة البدنية وتمرينات تنمية التوافق", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مفهوم اللياقة البدنية وأهميتها وعناصرها (10 دقائق)\n2. يميز عنصر التوافق وتمريناته (10 دقائق)\n3. يؤدي تمرينات حرة وبالأدوات (سلم الرشاقة، الكرات) لتنمية التوافق (20 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: كرات\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- اللياقة البدنية\n- التوافق\n- الدمج الحركي\n- الجهاز العصبي العضلي", "التهيئة / التمهيد / التعلم القبلي": "يطلب المعلم من الطلبة التصفيق مرتين خلفًا ومرة أمامًا أسفل الركبة أثناء الوثب ويسأل: ما العنصر الذي نحتاجه؟ ويراجع مفهوم اللياقة (ص 35-36).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يراجع المعلم مفهوم اللياقة وأهميتها (كفاءة الأجهزة، الوزن المثالي، القوام)، ويشرح التوافق وأمثلته (خطوات الوثب الثلاثي، التصويبة السلمية، ضرب الكرة بالرأس)، ويؤدي النماذج ص 36-37: (وقوف فتحًا. الذراعان جانبًا) ضم الرجلين مع رفع الذراعين، التصفيق مع الوثب، الجري في سلم الرشاقة أمامًا وخلفًا، الجري بوضع قدم خارج المربع، رمي الكرة عاليًا والتصفيق ومسكها، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوافق: سلم الرشاقة (نمط الرجوع)، الكرات (رمي وتصفيق ومسك)، التصفيق مع الوثب، تنطيط كرتين، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: أي مجموعة تكمل نمط السلم المركب بأقل أخطاء، ويتسابق الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما اللياقة البدنية؟\nالإجابة: كفاءة الفرد على أداء أنشطته دون إجهاد.\nس2 (مستوى التطبيق): ما التوافق؟\nالإجابة: دمج أكثر من حركة لأجزاء مختلفة من الجسم في وقت واحد.\nس3 (مستوى الاستدلال): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: التصويبة السلمية أو ضرب الكرة بالرأس.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ رمي الكرة عاليًا والتصفيق مرتين ومسكها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة القلب والرئتين.\nس3 (مستوى الاستدلال): لماذا يرتبط التوافق بالجهازين العصبي والعضلي؟\nالإجابة: لأن الدماغ يوجه العضلات لأداء الحركات معًا بتوقيت دقيق.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تمرينات التوافق بالكرة (رمي وتصفيق ومسك) يوميًا (دليل المعلم ص 36-37).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=2"}}, {"focus": "تمرينات تنمية القوة العضلية والسرعة", "num": 2, "fields": {"المخرجات التعليمية": "1. يميز عنصري القوة العضلية والسرعة وأنواع السرعة (15 دقيقة)\n2. يؤدي تمرينات حرة وبالكرة الطبية لتنمية القوة العضلية، وتمرينات لتنمية السرعة (15 دقيقة)\n3. يقدر أهمية التمرينات للمحافظة على الصحة (10 دقائق)", "المستوى المعرفي": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: كرات طبية\n- أخرى: أقماع\n- أخرى: حواجز\n- أخرى: ساعة إيقاف", "المفاهيم": "- القوة العضلية\n- السرعة\n- السرعة الانتقالية\n- سرعة رد الفعل", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم التوافق ويسأل: ما الذي يمكّن العداء من الانطلاق بسرعة؟ ويقدم القوة العضلية والسرعة (ص 39-41).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القوة العضلية (الوقاية من الإصابات وتحسين القوام) ونماذجها ص 39: (انبطاح) رفع الصدر والذراعين والرجلين والثبات، (انبطاح مائل) ثني الذراعين، دفع يد الزميل، (وقوف. مسك الكرة الطبية) الوثب للأمام، رمي الكرة الطبية للأمام؛ ثم السرعة وأنواعها (انتقالية، حركية، رد فعل) ونماذجها ص 41: العدو 20 م من أوضاع مختلفة، الجري برفع الركبتين، تعدية الحواجز، ويقلد الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات: الكرة الطبية (رمي للأمام)، انبطاح مائل، رد الفعل (الانطلاق بالإشارة من الجلوس)، عدو 20 م، مع التبديل، ويؤدي الطالب ويبدل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يقارن الطلبة زمن رد الفعل للإشارة الصوتية والبصرية ويستنتجون الفرق، ويجرب الطالب ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تناغم فرقة الرزحة: يحكي المعلم أن فن الرزحة العماني يحتاج إلى توافق بين الحركة والإيقاع، فتؤدي المجموعات تمرين التوافق على سلم الرشاقة مع تصفيق موحد (5 دقائق)\nالاستراتيجيات: التعلم تعلم القبلي": "الحصة 1:\nيطلب المعلم من الطلبة التصفيق مرتين خلفًا ومرة أمامًا أسفل الركبة أثناء الوثب ويسأل: ما العنصر الذي نحتاجه؟ ويراجع مفهوم اللياقة (ص 35-36).\n\nالحصة 2:\nيراجع المعلم التوافق ويسأل: ما الذي يمكّن العداء من الانطلاق بسرعة؟ ويقدم القوة العضلية والسرعة (ص 39-41).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يراجع المعلم مفهوم اللياقة وأهميتها (كفاءة الأجهزة، الوزن المثالي، القوام)، ويشرح التوافق وأمثلته (خطوات الوثب الثلاثي، التصويبة السلمية، ضرب الكرة بالرأس)، ويؤدي النماذج ص 36-37: (وقوف فتحًا. الذراعان جانبًا) ضم الرجلين مع رفع الذراعين، التصفيق مع الوثب، الجري في سلم الرشاقة أمامًا وخلفًا، الجري بوضع قدم خارج المربع، رمي الكرة عاليًا والتصفيق ومسكها، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التوافق: سلم الرشاقة (نمط الرجوع)، الكرات (رمي وتصفيق ومسك)، التصفيق مع الوثب، تنطيط كرتين، مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: أي مجموعة تكمل نمط السلم المركب بأقل أخطاء، ويتسابق الطالب (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم القوة العضلية (الوقاية من الإصابات وتحسين القوام) ونماذجها ص 39: (انبطاح) رفع الصدر والذراعين والرجلين والثبات، (انبطاح مائل) ثني الذراعين، دفع يد الزميل، (وقوف. مسك الكرة الطبية) الوثب للأمام، رمي الكرة الطبية للأمام؛ ثم السرعة وأنواعها (انتقالية، حركية، رد فعل) ونماذجها ص 41: العدو 20 م من أوضاع مختلفة، الجري برفع الركبتين، تعدية الحواجز، ويقلد الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات: الكرة الطبية (رمي للأمام)، انبطاح مائل، رد الفعل (الانطلاق بالإشارة من الجلوس)، عدو 20 م، مع التبديل، ويؤدي الطالب ويبدل (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يقارن الطلبة زمن رد الفعل للإشارة الصوتية والبصرية ويستنتجون الفرق، ويجرب الطالب ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – تناغم فرقة الرزحة: يحكي المعلم أن فن الرزحة العماني يحتاج إلى توافق بين الحركة والإيقاع، فتؤدي المجموعات تمرين التوافق على سلم الرشاقة مع تصفيق موحد (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): ما اللياقة البدنية؟\nالإجابة: كفاءة الفرد على أداء أنشطته دون إجهاد.\nس2 (مستوى التطبيق): ما التوافق؟\nالإجابة: دمج أكثر من حركة لأجزاء مختلفة من الجسم في وقت واحد.\nس3 (مستوى الاستدلال): اذكر مهارة تحتاج إلى التوافق.\nالإجابة: التصويبة السلمية أو ضرب الكرة بالرأس.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما القوة العضلية؟\nالإجابة: قدرة العضلة على التغلب على مقاومة.\nس2 (مستوى التطبيق): اذكر أنواع السرعة.\nالإجابة: الانتقالية والحركية ورد الفعل.\nس3 (مستوى الاستدلال): اذكر تمرينًا للقوة بالكرة الطبية.\nالإجابة: رمي الكرة الطبية للأمام لأبعد مسافة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ رمي الكرة عاليًا والتصفيق مرتين ومسكها.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): اذكر فائدتين للياقة البدنية.\nالإجابة: تحسين القوام ورفع كفاءة القلب والرئتين.\nس3 (مستوى الاستدلال): لماذا يرتبط التوافق بالجهازين العصبي والعضلي؟\nالإجابة: لأن الدماغ يوجه العضلات لأداء الحركات معًا بتوقيت دقيق.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الانطلاق بالإشارة من الجلوس وعدو 10 م.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما العنصر الذي يحتاجه رامي الجلة أكثر؟\nالإجابة: القوة العضلية.\nس3 (مستوى الاستدلال): كيف تساعد القوة العضلية في الوقاية من الإصابات؟\nالإجابة: العضلات القوية تحمي المفاصل وتثبتها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تمرينات التوافق بالكرة (رمي وتصفيق ومسك) يوميًا (دليل المعلم ص 36-37).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تمرين الانبطاح المائل يوميًا بعدد مناسب (دليل المعلم ص 39-41).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=2"}}, {"title": "تمرينات الموانع (جمباز الموانع)", "unit": "اللياقة البدنية", "week": "الثالث", "date": "20-24/9/2026", "pages": "دليل المعلم ص 48-56", "n": 2, "periods": [{"focus": "تصميم مسارات الموانع بالأدوات والأجهزة", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف تمرينات الموانع وأدواتها وأجهزتها (10 دقائق)\n2. يؤدي حركات تخطي الموانع (تسلق، زحف، وثب، توازن، مروق) بأمان (15 دقيقة)\n3. يصمم مع مجموعته مسار موانع قصيرًا (15 دقيقة)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات طبية\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: سلم التسلق", "المفاهيم": "- تمرينات الموانع\n- المانع\n- التصميم\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم الأدوات ويسأل: كيف نصمم مسار موانع ينمي القوة والتوافق والسرعة؟ (ص 48-50).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج التخطي: التسلق والنزول، الزحف أسفل الحاجز، الوثب فوق الحبال، المشي على المقعد، المروق داخل الصندوق، الجري في السلم، مع الأمان، ويقلد الطالب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تصمم كل مجموعة بأدوار (مصمم، منفذ، مراقب أمان) مسارًا من خمسة موانع وترسمه وتنفذه، ويصمم الطالب وينفذ (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تجرب كل مجموعة مسار المجموعة الأخرى، ويجرب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): اذكر ثلاث حركات لتخطي الموانع.\nالإجابة: التسلق، الزحف، الوثب.\nس2 (مستوى التطبيق): ما دور مراقب الأمان؟\nالإجابة: التأكد من ثبات الأدوات والهبوط الآمن.\nس3 (مستوى الاستدلال): ما عناصر اللياقة التي ينميها جمباز الموانع؟\nالإجابة: القوة والسرعة والتوافق والرشاقة.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر الموانع الخمسة في مسار مجموعتك وحركة كل منها.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): أدِّ مسار المجموعة الأخرى.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): اقترح تعديلًا لزيادة صعوبة مسار مجموعتك.\nالإجابة: مثل: زيادة ارتفاع الحاجز.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تصميم مسار موانع منزلي آمن (دليل المعلم ص 48-52).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=3"}}, {"focus": "نماذج مسارات الموانع والمنافسات", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي نماذج مسارات الموانع بالتتابع (15 دقيقة)\n2. يوظف الحركات والمهارات في منافسات الموانع (15 دقيقة)\n3. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "- مسار الموانع\n- التتابع\n- المنافسة\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم حركات الموانع ويعرض النماذج ص 53-54.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. مجموعات تؤدي النموذجين الثالث والرابع بالتتابع مرتين ويصحح القائد، ويؤدي الطالب ويصحح (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة بين المجموعات بالزمن والأداء الصحيح (ص 55)، ويتسابق الطالب (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: أي مانع احتاج إلى القوة وأيها إلى التوافق؟ ليستنتج الطلبة علاقة الموانع بعناصر اللياقة، ويستنتج الطالب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي الطالب التهدئة ويعبر (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – مخيم الكشافة العماني: تصمم كل مجموعة مسار موانع قصيرًا لمخيم كشفي في صحراء عمان من تسلق وزحف ووثب وتوازن، وتشرح قاعدة أمان لكل مانع (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): أي مانع يحتاج إلى القوة العضلية؟\nالإجابة: التسلق.\nس2 (مستوى التطبيق): أي مانع يحتاج إلى التوافق؟\nالإجابة: سلم الرشاقة.\nس3 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.\nس3 (مستوى الاستدلال): اقترح مانعًا ينمي السرعة.\nالإجابة: عدو 10 م بين قمعين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تسجيل زمنه في مسار موانع آمن ومحاولة تحسينه (دليل المعلم ص 53-55).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=3"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف تمرينات الموانع وأدواتها وأجهزتها (10 دقائق)\n2. يؤدي حركات تخطي الموانع (تسلق، زحف، وثب، توازن، مروق) بأمان (15 دقيقة)\n3. يصمم مع مجموعته مسار موانع قصيرًا (15 دقيقة)\n\nالحصة 2:\n1. يؤدي نماذج مسارات الموانع بالتتابع (15 دقيقة)\n2. يوظف الحركات والمهارات في منافسات الموانع (15 دقيقة)\n3. يشعر بالثقة في النفس ويستمتع بمشاركة زملائه (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: كرات طبية\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: سلم التسلق\n\nالحصة 2:\n- أخرى: مقاعد سويدية\n- أخرى: صندوق مقسم\n- أخرى: حبال\n- أخرى: أطواق\n- أخرى: حواجز\n- أخرى: سلم الرشاقة\n- أخرى: مراتب\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- تمرينات الموانع\n- المانع\n- التصميم\n- الأمان\n\nالحصة 2:\n- مسار الموانع\n- التتابع\n- المنافسة\n- الثقة بالنفس", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض الحصة 2:\nس1 (مستوى المعرفة): أي مانع يحتاج إلى القوة العضلية؟\nالإجابة: التسلق.\nس2 (مستوى التطبيق): أي مانع يحتاج إلى التوافق؟\nالإجابة: سلم الرشاقة.\nس3 (مستوى الاستدلال): كيف تحسب النقاط؟\nالإجابة: للأداء الصحيح والزمن.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر الموانع الخمسة في مسار مجموعتك وحركة كل منها.\nالإجابة: يذكر.\nس2 (مستوى التطبيق): أدِّ مسار المجموعة الأخرى.\nالإجابة: يؤديه.\nس3 (مستوى الاستدلال): اقترح تعديلًا لزيادة صعوبة مسار مجموعتك.\nالإجابة: مثل: زيادة ارتفاع الحاجز.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ المسار كاملًا.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): كيف شعرت بعد إنهاء المسار؟\nالإجابة: يعبر عن الثقة.\nس3 (مستوى الاستدلال): اقترح مانعًا ينمي السرعة.\nالإجابة: عدو 10 م بين قمعين.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على تصميم مسار موانع منزلي آمن (دليل المعلم ص 48-52).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تسجيل زمنه في مسار موانع آمن ومحاولة تحسينه (دليل المعلم ص 53-55).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=3"}}, {"title": "سباق العدو (30-60) م من البدء المنخفض", "unit": "ألعاب القوى", "week": "الرابع", "date": "27/9-1/10/2026", "pages": "دليل المعلم ص 60-68", "n": 2, "periods": [{"focus": "مراحل سباق العدو والبدء المنخفض (خذ مكانك، استعد، انطلق)", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء سباق العدو (30-60) م ومراحله الفنية (15 دقيقة)\n2. يؤدي البدء المنخفض بأقسامه الثلاثة (15 دقيقة)\n3. يحدد القواعد القانونية للسباق (البدء المنخفض، الحارة، الانطلاق بعد الإشارة) (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- البدء المنخفض\n- الحارة\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- خط النهاية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صورة عدائي 100 م عند البدء ويسأل: لماذا يبدؤون من هذا الوضع؟ ويقدم السباق ومراحله (ص 61-62).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء: جري، رفع الركبتين، لمس الرجلين خلفًا، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: خذ مكانك (الأصابع قوس قبل الخط، ركبة الرجل الخلفية على الأرض، النظر للأسفل)، استعد (رفع الحوض والركبة)، انطلق (دفع الأرض بالقدمين وميل الجذع)، ثم الدفع وتزايد السرعة والسرعة القصوى، مع القواعد، ويقلد كل قسم بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أزواج: يعطي أحدهما الأوامر الثلاثة ويراقب أخطاء زميله (لمس الخط، الانطلاق المبكر) ثم يتبادلان، ثم عدو 20 م، ويتدرب الطالب ويراقب (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (رد الفعل): انطلاق بإشارات مختلفة من البدء المنخفض 10 م، ويلعب الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): ما أقسام البدء المنخفض؟\nالإجابة: خذ مكانك، استعد، انطلق.\nس2 (مستوى التطبيق): متى ينتهي احتساب زمن السباق؟\nالإجابة: بمرور جذع العداء خط النهاية.\nس3 (مستوى الاستدلال): اذكر قاعدة من قواعد السباق.\nالإجابة: الجري في الحارة المخصصة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ البدء المنخفض بأقسامه الثلاثة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما مراحل سباق العدو؟\nالإجابة: البدء المنخفض، الدفع وتزايد السرعة، السرعة القصوى.\nس3 (مستوى الاستدلال): زميلك ينطلق قبل الإشارة، ما القرار؟\nالإجابة: بداية خاطئة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على التدرب على أوامر البدء الثلاثة في مكان آمن (دليل المعلم ص 61-63).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=4"}}, {"focus": "تدريبات سباق العدو ومنافساته", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي التمرينات التمهيدية والتدريبات التعليمية لسباق العدو (10 دقائق)\n2. يؤدي سباق العدو 30-60 م من البدء المنخفض بتطبيق القواعد (20 دقيقة)\n3. يستمتع بمشاركة زملائه سباق العدو ويحدد هدفًا لتحسين زمنه (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: أعلام", "المفاهيم": "- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم البدء المنخفض ويسأل: كيف نحافظ على السرعة القصوى حتى النهاية؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء خاص بالعدو، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات ص 64-66: العدو المتزايد السرعة 30 م، العدو من البدء المنخفض 20 م بالإشارة، الجري بخطوات واسعة ثم سريعة، مع التركيز على حركة الذراعين، ويقلد الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بميقاتي (ساعة إيقاف) ومسجل: يعدو كل طالب 50 م من البدء المنخفض ويسجل زمنه، ويعدو الطالب ويسجل لزميله (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. سباق العدو بين المجموعات بالتصفيات والنهائي مع حكام من الطلبة (ص 67)، ويتسابق الطالب (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتحديد هدف شخصي لتحسين الزمن خلال أسبوع، ويؤدي الطالب التهدئة ويحدد هدفًا (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – حكام سباق العدو: يحصل كل طالب على رقم، ويسأل المعلم عن قاعدة في سباق العدو أو قسم من البدء المنخفض، ويجيب صاحب الرقم كأنه حكم في بطولة تشارك فيها عمان (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وبالتبادل بقوة.\nس2 (مستوى التطبيق): ما دور الميقاتي؟\nالإجابة: تسجيل زمن العداء.\nس3 (مستوى الاستدلال): ما العنصر الأساسي في سباق العدو؟\nالإجابة: السرعة.", "التقويم الختامي": "س1 (مستوى المعرفة): ما زمنك في 50 م وما هدفك بعد أسبوع؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): اذكر تدريبين لتطوير السرعة.\nالإجابة: العدو المتزايد السرعة والجري برفع الركبتين.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك سباق عدو بأدوار؟\nالإجابة: ميقاتي ومسجل وحكم بداية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على تدريبات السرعة خلال أسبوع ومقارنة زمنه، والبحث عن قصة نجاح أحد أبطال سباقات الجري (التعلم الذاتي، دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=4"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء سباق العدو (30-60) م ومراحله الفنية (15 دقيقة)\n2. يؤدي البدء المنخفض بأقسامه الثلاثة (15 دقيقة)\n3. يحدد القواعد القانونية للسباق (البدء المنخفض، الحارة، الانطلاق بعد الإشارة) (10 دقائق)\n\nالحصة 2:\n1. يؤدي التمرينات التمهيدية والتدريبات التعليمية لسباق العدو (10 دقائق)\n2. يؤدي سباق العدو 30-60 م من البدء المنخفض بتطبيق القواعد (20 دقيقة)\n3. يستمتع بمشاركة زملائه سباق العدو ويحدد هدفًا لتحسين زمنه (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: شريط لاصق\n- أخرى: ساعة إيقاف\n- صورة توضيحية\n- جهاز عرض البيانات\n\nالحصة 2:\n- أخرى: مكعبات البدء\n- أخرى: أقماع\n- أخرى: ساعات إيقاف\n- أخرى: استمارات تسجيل\n- أخرى: أعلام", "المفاهيم": "الحصة 1:\n- البدء المنخفض\n- الحارة\n- الدفع وتزايد السرعة\n- السرعة القصوى\n- خط النهاية\n\nالحصة 2:\n- تردد الخطوة\n- طول الخطوة\n- الميقاتي\n- الزمن", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة عدائي 100 م عند البدء ويسأل: لماذا يبدؤون من هذا الوضع؟ ويقدم السباق ومراحله (ص 61-62).\n\nالحصة 2:\nيراجع المعلم البدء المنخفض ويسأل: كيف نحافظ على السرعة القصوى حتى النهاية؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء: جري، رفع الركبتين، لمس الرجلين خلفًا، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج: خذ مكانك (الأصابع قوس قبل ال وبالتبادل بقوة.\nس2 (مستوى التطبيق): ما دور الميقاتي؟\nالإجابة: تسجيل زمن العداء.\nس3 (مستوى الاستدلال): ما العنصر الأساسي في سباق العدو؟\nالإجابة: السرعة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ البدء المنخفض بأقسامه الثلاثة.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما مراحل سباق العدو؟\nالإجابة: البدء المنخفض، الدفع وتزايد السرعة، السرعة القصوى.\nس3 (مستوى الاستدلال): زميلك ينطلق قبل الإشارة، ما القرار؟\nالإجابة: بداية خاطئة.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما زمنك في 50 م وما هدفك بعد أسبوع؟\nالإجابة: يذكر.\nس2 (مستوى التطبيق): اذكر تدريبين لتطوير السرعة.\nالإجابة: العدو المتزايد السرعة والجري برفع الركبتين.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك سباق عدو بأدوار؟\nالإجابة: ميقاتي ومسجل وحكم بداية.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طالبك على التدرب على أوامر البدء الثلاثة في مكان آمن (دليل المعلم ص 61-63).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على تدريبات السرعة خلال أسبوع ومقارنة زمنه، والبحث عن قصة نجاح أحد أبطال سباقات الجري (التعلم الذاتي، دليل المعلم ص 67).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=4"}}, {"title": "الوثب العالي بالطريقة الظهرية من الاقتراب (3-5) خطوات", "unit": "ألعاب القوى", "week": "الخامس", "date": "4-8/10/2026", "pages": "دليل المعلم ص 69-76", "n": 2, "periods": [{"focus": "المراحل الفنية للوثب العالي الظهري والتمرينات التمهيدية", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف طريقة أداء الوثب العالي بالطريقة الظهرية ومراحله الفنية (10 دقائق)\n2. يؤدي التمرينات التمهيدية (تبادل الخطو والحجل، الوثب للجانبين، الحجل مع رفع الركبة) (20 دقيقة)\n3. يميز بين الوثب بالطريقة المقصية والطريقة الظهرية (10 دقائق)", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: جهاز الوثب العالي\n- أخرى: مراتب الوثب العالي\n- أخرى: حبل مطاطي\n- أخرى: أقماع\n- صورة توضيحية\n- جهاز عرض البيانات", "المفاهيم": "- الوثب العالي\n- الطر  الكرة لأعلى بالأصابع.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل لتمرين الدفع بأمان (دليل المعلم ص 78-80).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=6"}}, {"focus": "مسابقة دفع الكرة الطبية والقواعد القانونية", "num": 2, "fields": {"المخرجات التعليمية": "1. يؤدي دفع الكرة الطبية (500 جم - 1 كجم) من داخل الدائرة بالمراحل الصحيحة (15 دقيقة)\n2. يطبق القواعد القانونية (الدفع بيد واحدة، عدم الخروج من الدائرة، سقوط الكرة داخل المقطع، 3 محاولات) (15 دقيقة)\n3. يشارك زملاءه في تنظيم المسابقة بأدوار (10 دقائق)", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات طبية 500 جم و1 كجم\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "- المسابقة\n- القواعد القانونية\n- المحاولة\n- المسافة", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم المراحل ويعرض القواعد (ص 79) ويوزع الأدوار (حكم، قائس، مسجل).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات التعليمية ص 81-82: الدفع من الوقوف، الدفع مع لف الجذع، الدفع مع ثني ومد الركبتين، الدفع الكامل من داخل الدائرة، ويقلد الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات: 3 محاولات لكل طالب، يقيس القائس ويسجل المسجل ويراقب الحكم القواعد، ويدفع الطالب ويحكم ويقيس (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع الطلبة بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتحديد هدف شخصي، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – دفع أم رمي في الحرف: يصنف كل زوج حركات من الحياة العمانية إلى دفع أو رمي، كدفع القارب إلى البحر ورمي شبكة الصيد ودفع الرحى، ثم يشاركان الصف بالتعليل (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "التقويم التكويني": "تفريد التعليم:\nس1 (مستوى المعرفة): كم محاولة لكل طالب؟\nالإجابة: ثلاث محاولات.\nس2 (مستوى التطبيق): ماذا يحدث لو خرج الطالب من الدائرة أثناء الأداء؟\nالإجابة: تحتسب المحاولة خاطئة.\nس3 (مستوى الاستدلال): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الكرة إلى حدود الدائرة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ دفع الكرة الطبية من داخل الدائرة بتطبيق القواعد.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما القاعدة التي راقبها الحكم؟\nالإجابة: الدفع بيد واحدة وعدم الخروج من الدائرة.\nس3 (مستوى الاستدلال): كيف يفوز الفريق؟\nالإجابة: بمجموع المسافات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طالبك على البحث عن قصة بطل في مسابقات الرمي (التعلم الذاتي، دليل المعلم ص 83) ومراجعة مهارات الوحدتين قبل الاختبار العملي (1).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=6"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف طريقة أداء مسابقة دفع الكرة الطبية ومراحلها (الاستعداد، الدفع) (20 دقيقة)\n2. يؤدي التمرينات التمهيدية لدفع الكرة الطبية (10 دقائق)\n3. يميز بين الدفع والرمي (10 دقائق)\n\nالحصة 2:\n1. يؤدي دفع الكرة الطبية (500 جم - 1 كجم) من داخل الدائرة بالمراحل الصحيحة (20 دقيقة)\n2. يطبق القواعد القانونية (الدفع بيد واحدة، عدم الخروج من الدائرة، سقوط الكرة داخل المقطع، 3 محاولات) (10 دقائق)\n3. يشارك زملاءه في تنظيم المسابقة بأدوار (10 دقائق)", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\n\nالحصة 2:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات طبية 500 جم و1 كجم\n- أخرى: أقماع\n- أخرى: شريط قياس\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: كرات طبية 500 جم و1 كجم\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: استمارات تسجيل", "المفاهيم": "الحصة 1:\n- دفع الكرة الطبية\n- الاستعداد\n- الدفع\n- دائرة الرمي\n- مقطع الرمي\n\nالحصة 2:\n- المسابقة\n- القواعد القانونية\n- المحاولة\n- المسافة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة رامي الجلة ويسأل: هل يرمي الجلة أم يدفعها؟ ويقدم المسابقة (ص 78-79).\n\nالحصة 2:\nيراجع المعلم المراحل ويعرض القواعد (ص 79) ويوزع الأدوار (حكم، قائس، مسجل).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء: دوران الذراعين، دفع يد الزميل، ويقلد الطالب (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم المراحل: الاستعداد (حمل الكرة على أصابع اليد عند الرقبة، الوقوف مواجهًا مقطع الرمي بالجانب داخل دائرة قطرها 2 م)، الدفع (ثني الركبتين ومدهما مع لف الجذع ومد الذراع ودفع الكرة بيد واحدة للأمام وللأعلى)، ويؤدي التمرينات التمهيدية ص 80: تبادل دفع الزميل، رمي ولقف الكرة من أمام الجسم، تحريك الكرة على شكل 8، دفع الكرة لأعلى بالأصابع، رمي الكرة من الجانب للأمام، ويقلد الطالب (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. محطات التمرينات التمهيدية بأربع مجموعات مع التبديل، ويؤدي الطالب ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. منافسة: دفع الكرة 500 جم لأبعد مسافة من الوقوف، ويتسابق الطالب (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي الطالب التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء، ويقلد الطالب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم التدريبات التعليمية ص 81-82: الدفع من الوقوف، الدفع مع لف الجذع، الدفع مع ثني ومد الركبتين، الدفع الكامل من داخل الدائرة، ويقلد الطالب (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات: 3 محاولات لكل طالب، يقيس القائس ويسجل المسجل ويراقب الحكم القواعد، ويدفع الطالب ويحكم ويقيس (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. ثلاث كلمات: يكتب كل طالب ثلاث كلمات تلخّص دفع الكرة الطبية (500 جم - 1 كجم)، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تهدئة وتحديد هدف شخصي، ويؤدي الطالب التهدئة (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. غلق الدرس (نشاط ممتع مع المواطنة) – دفع أم رمي في الحرف: يصنف كل زوج حركات من الحياة العمانية إلى دفع أو رمي، كدفع القارب إلى البحر ورمي شبكة الصيد ودفع الرحى، ثم يشاركان الصف بالتعليل (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "التقويم التكويني": "تفريد التعليم:\nالحصة 1:\nس1 (مستوى المعرفة): أين توضع الكرة الطبية في الاستعداد؟\nالإجابة: على أصابع اليد عند الرقبة.\nس2 (مستوى التطبيق): ما الفرق بين الدفع والرمي؟\nالإجابة: الدفع بمد الذراع من الكتف دون مرجحة الذراع خلفًا، والرمي بالمرجحة.\nس3 (مستوى الاستدلال): كم قطر دائرة الرمي؟\nالإجابة: 2 م.\n\nالحصة 2:\nس1 (مستوى المعرفة): كم محاولة لكل طالب؟\nالإجابة: ثلاث محاولات.\nس2 (مستوى التطبيق): ماذا يحدث لو خرج الطالب من الدائرة أثناء الأداء؟\nالإجابة: تحتسب المحاولة خاطئة.\nس3 (مستوى الاستدلال): من أين تقاس المسافة؟\nالإجابة: من مكان سقوط الكرة إلى حدود الدائرة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ دفع الكرة الطبية من الوقوف.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما مرحلتا دفع الكرة الطبية؟\nالإجابة: الاستعداد والدفع.\nس3 (مستوى الاستدلال): اذكر تمرينين تمهيديين.\nالإجابة: تحريك الكرة على شكل 8 ودفع الكرة لأعلى بالأصابع.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ دفع الكرة الطبية من داخل الدائرة بتطبيق القواعد.\nالإجابة: يؤديه.\nس2 (مستوى التطبيق): ما القاعدة التي راقبها الحكم؟\nالإجابة: الدفع بيد واحدة وعدم الخروج من الدائرة.\nس3 (مستوى الاستدلال): كيف يفوز الفريق؟\nالإجابة: بمجموع المسافات.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: يمكن استخدام كرة مملوءة بالرمل لتمرين الدفع بأمان (دليل المعلم ص 78-80).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طالبك على البحث عن قصة بطل في مسابقات الرمي (التعلم الذاتي، دليل المعلم ص 83) ومراجعة مهارات الوحدتين قبل الاختبار العملي (1).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/pe/?l=6"}}, {"title": "الاختبار العملي (1)", "unit": "تقويم", "week": "السابع", "date": "18-22/10/2026", "pages": "دليل المعلم ص 34-84 (اللياقة البدنية وألعاب القوى)", "n": 2, "periods": [{"focus": "اختبار عملي في عناصر اللياقة البدنية وتمرينات الموانع", "num": 1, "fields": {"المخرجات التعليمية": "1. ي
