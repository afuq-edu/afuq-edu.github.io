زلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 38, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول", "k": 1, "n": 3, "wi": 3, "wn": 7, "pages": "147-151", "f": [["عنوان الدرس", "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول"], ["نواتج التعلم", "1. يفرق بين الفعل المبني للمعلوم والفعل المبني للمجهول (5 دقائق)\n2. يتعرف سبب حذف الفاعل وقيام غيره مقامه (15 دقيقة)\n3. يستخرج الأفعال المبنية للمجهول من نص (منارة عمانية) (20 دقيقة)"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص147-149\nبطاقات أفعال\nجهاز عرض"], ["التهيئة (5 دقائق)", "- موقف: (كُسِرَ زجاجُ النافذة)\n- سؤال: من كسره؟ لماذا لم يذكر؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: أمثلة من نص منارة عمانية: (افتُتح الجامع رسميًا)، (كُتبت الآيات القرآنية)، (استُعمل الحجر الأبيض)؛ مقارنة: افتتح السلطانُ الجامعَ ← افتُتح الجامعُ؛ استنتاج المفهوم (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. التصنيف: تصنيف أفعال في عمودين: معلوم (فاعله مذكور) ومجهول (فاعله محذوف)؛ أسباب حذف الفاعل: الجهل به، العلم به، الخوف عليه أو منه، الإيجاز (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: كل طالب يكتب فعلًا مبنيًا للمجهول من حياة المدرسة: (فُتحت الأبواب) (3 دقائق)\nالاستراتيجيات: فكر."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفعل المبني للمعلوم؟\nالإجابة النموذجية: فعل ذُكر فاعله في الجملة\n2) (تطبيق) ما الفعل المبني للمجهول؟\nالإجابة النموذجية: فعل حُذف فاعله وأُقيم غيره مقامه وتغيرت صورته\n3) (استدلال) حدد الفعل المبني للمجهول: (كُتبت الآياتُ بخط الثلث).\nالإجابة النموذجية: كُتبت"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنف: (بنى العمانيون السفنَ) / (بُنيت السفنُ).\nالإجابة النموذجية: الأول مبني للمعلوم، والثاني مبني للمجهول\n2) (تطبيق) اذكر سببين لحذف الفاعل.\nالإجابة النموذجية: الجهل به، أو العلم به (أو: الإيجاز، الخوف عليه أو منه)\n3) (استدلال) استخرج من نص منارة عمانية فعلًا مبنيًا للمجهول.\nالإجابة النموذجية: مثل: افتُتح، كُتبت، استُعمل، حُفر"], ["الواجب المنزلي", "استخرج خمسة أفعال مبنية للمجهول من نص قرأته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=21"]]}, {"no": 39, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول", "k": 2, "n": 3, "wi": 4, "wn": 7, "pages": "147-151", "f": [["عنوان الدرس", "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول"], ["نواتج التعلم", "1. يصوغ الفعل الماضي المبني للمجهول صياغة صحيحة (15 دقيقة)\n2. يصوغ الفعل المضارع المبني للمجهول (15 دقيقة)\n3. يضبط الفعل عند تحويله ضبطًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "النمذجة\nالدقيقة الواحدة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص149-150\nجدول تحويل\nالسبورة"], ["التهيئة (5 دقائق)", "الدقيقة الواحدة: اكتب أكبر عدد من الأفعال الماضية في دقيقة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الماضي: قاعدة الماضي: يُضم أوله ويُكسر ما قبل آخره: كَتَبَ ← كُتِبَ، فَتَحَ ← فُتِحَ؛ الماضي المبدوء بهمزة وصل أو تاء زائدة: يُضم أوله وثالثه: استعمل ← اُستُعمِل، تعلّم ← تُعُلِّم (10 دقائق)\nالاستراتيجيات: النمذجة.\n\n2. المضارع: قاعدة المضارع: يُضم أوله ويُفتح ما قبل آخره: يَكتُب ← يُكتَب، يَفتح ← يُفتَح، يُكرِم ← يُكرَم؛ تحويل جمل جماعيًا مع الضبط (10 دقائق)\nالاستراتيجيات: الدقيقة الواحدة.\n\n3. الغلق: سباق تحويل بين المجموعات على السبورة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حوّل (فَتَحَ) إلى مبني للمجهول.\nالإجابة النموذجية: فُتِحَ\n2) (تطبيق) حوّل (يَبني) إلى مبني للمجهول.\nالإجابة النموذجية: يُبنى\n3) (استدلال) ما التغيير الذي يطرأ على الماضي عند بنائه للمجهول؟\nالإجابة النموذجية: يُضم أوله ويُكسر ما قبل آخره"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اضبط: (حُفِر اسمُ الجامع على الواجهة).\nالإجابة النموذجية: حُفِرَ اسمُ الجامعِ على الواجهةِ\n2) (تطبيق) حوّل (يرسمُ الطالبُ اللوحةَ) إلى المجهول.\nالإجابة النموذجية: تُرسَمُ اللوحةُ\n3) (استدلال) حوّل (استقبل) إلى المجهول مع الضبط.\nالإجابة النموذجية: اُستُقبِلَ"], ["الواجب المنزلي", "حوّل عشرة أفعال من الكتاب إلى المبني للمجهول مع الضبط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=21"]]}, {"no": 40, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "147-151", "f": [["عنوان الدرس", "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول"], ["نواتج التعلم", "1. يحوّل جملًا من المبني للمعلوم إلى المبني للمجهول مع ملاحظة التغيرات (15 دقيقة)\n2. يصوغ أمثلة على الجمل المبنية للمعلوم والمجهول (15 دقيقة)\n3. يصحح أخطاء الضبط في الأفعال المحوّلة (10 دقائق)"], ["الاستراتيجيات", "فكر - زاوج - شارك\nعربة القطار\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص150-151\nبطاقات جمل\nأوراق عمل"], ["التهيئة (5 دقائق)", "عربة القطار: كل عربة فيها جملة مبنية للمعلوم يحولها الطالب ويمرر العربة"], ["إجراءات التنفيذ (23 دقيقة)", "1. التحويل: خطوات: حذف الفاعل، تغيير صورة الفعل، رفع المفعول به وجعله في مكان الفاعل؛ مثال: نقلَ البحارةُ البضائعَ ← نُقِلَت البضائعُ؛ ملاحظة تأنيث الفعل إذا كان ما بعده مؤنثًا (10 دقائق)\nالاستراتيجيات: فكر.\n\n2. الصياغة: كل زوج يكتب ثلاث جمل عن الوطن ويحولها؛ تبادل الأوراق والتصحيح؛ حل تدريبات الكتاب (8 دقائق)\nالاستراتيجيات: زاوج.\n\n3. غلق الدرس – من بنى القلاع؟: يحول كل زوج جملًا عن معالم عمانية من المبني للمعلوم إلى المبني للمجهول، مثل «بنى العمانيون القلاعَ» إلى «بُنيت القلاعُ»، ويناقش سبب حذف الفاعل (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حوّل: (صنع الوستادُ السفينةَ).\nالإجابة النموذجية: صُنِعَت السفينةُ\n2) (تطبيق) لماذا قلنا (صُنِعَت) لا (صُنِعَ)؟\nالإجابة النموذجية: لأن الذي حل محل الفاعل (السفينة) مؤنث\n3) (استدلال) صحح الضبط: (يَحفَظُ القرآنُ في الصدور).\nالإجابة النموذجية: يُحفَظُ القرآنُ في الصدور"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حوّل: (يزورُ السياحُ الجامعَ).\nالإجابة النموذجية: يُزارُ الجامعُ\n2) (تطبيق) اكتب جملة مبنية للمجهول عن وطنك.\nالإجابة النموذجية: مثل: تُرفَعُ راية عمان في المناسبات الوطنية\n3) (استدلال) حوّل (أُكرِمَ الضيفُ) إلى المبني للمعلوم بفاعل مناسب.\nالإجابة النموذجية: أكرمَ الأبُ الضيفَ"], ["الواجب المنزلي", "حل التدريبات المتبقية في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=21"]]}, {"no": 41, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: الهمزة المتوسطة على ألف", "k": 1, "n": 1, "wi": 6, "wn": 7, "pages": "152-155", "f": [["عنوان الدرس", "الأنشطة الإملائية: الهمزة المتوسطة على ألف"], ["نواتج التعلم", "1. يتعرّف الهمزة المتوسطة (15 دقيقة)\n2. يستنتج قاعدة كتابة الهمزة المتوسطة على الألف (5 دقائق)\n3. يكتب كلمات فيها همزة متوسطة على ألف كتابة صحيحة (20 دقيقة)"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتعلم التعاوني\nالقصة"], ["مصادر التعلم", "كتاب الطالب ص152-155\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "- عرض كلمات: سأل، رأس، مأذنة، يتأمل\n- سؤال: ما الحرف المشترك؟ وأين موقعه؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستنتاج: الهمزة المتوسطة تقع وسط الكلمة؛ قاعدة: ننظر إلى حركة الهمزة وحركة ما قبلها ونكتبها على الحرف المناسب لأقوى الحركتين (الكسرة ثم الضمة ثم الفتحة ثم السكون)؛ تُكتب على ألف إذا كانت مفتوحة وما قبلها مفتوح (سَأَل) أو ساكن صحيح (يَسْأَل)، أو ساكنة وما قبلها مفتوح (رَأْس) (10 دقائق)\nالاستراتيجيات: الاستقصاء الموجه.\n\n2. التطبيق: تحليل كلمات من نص منارة عمانية: مآذن، تأصّل؛ تصنيف بطاقات: سبب كتابتها على الألف؛ إملاء كلمات قصيرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – همزات على ألف عمانية: تتسابق المجموعات في جمع كلمات فيها همزة متوسطة على ألف ترتبط بعمان، مثل «رأس الحد» و«مأكولات عمانية» و«سأزور نزوى»، وتعلل كتابة كل منها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الهمزة المتوسطة؟\nالإجابة النموذجية: الهمزة التي تقع في وسط الكلمة\n2) (تطبيق) علل كتابة الهمزة على ألف في (رَأْس).\nالإجابة النموذجية: لأنها ساكنة وما قبلها مفتوح، والفتحة أقوى من السكون فتكتب على ما يناسب الفتحة (الألف)\n3) (استدلال) علل كتابتها على ألف في (سَأَلَ).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها مفتوح"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الهمزة في: (ي_مل، ف_ر، م_ذنة).\nالإجابة النموذجية: يأمل، فأر، مأذنة\n2) (تطبيق) لماذا لا نكتب الهمزة على ألف في (سُئِل)؟\nالإجابة النموذجية: لأنها مكسورة والكسرة أقوى فتكتب على نبرة (ياء)\n3) (استدلال) اكتب جملة فيها ثلاث كلمات بها همزة متوسطة على ألف.\nالإجابة النموذجية: مثل: سأل أحمدُ رأيَ المعلم في مسألة"], ["الواجب المنزلي", "اجمع عشر كلمات من نصوص الكتاب فيها همزة متوسطة على ألف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=22"]]}, {"no": 42, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "خط الرقعة: (ف، ق)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "156", "f": [["عنوان الدرس", "خط الرقعة: (ف، ق)"], ["نواتج التعلم", "1. يرسم حرفي الفاء والقاف مجردين بخط الرقعة (15 دقيقة)\n2. يكتب الحرفين في أول الكلمة ووسطها وآخرها (15 دقيقة)\n3. يكتب جملة بخط الرقعة مراعيًا قواعد الرسم (10 دقائق)"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص156\nأقلام مشطوفة\nأوراق ملاحظات"], ["التهيئة (5 دقائق)", "مقارنة الفاء والقاف المتطرفتين بخطي النسخ والرقعة"], ["إجراءات التنفيذ (23 دقيقة)", "1. النمذجة: الفاء المجردة: رأس صغير وجسم ممتد على السطر، والقاف المجردة: رأس وذيل مقوس ينزل تحت السطر؛ في الرقعة تكتب نقطتا القاف شرطة صغيرة؛ أمثلة: فجر، سفينة، صف، قلم، نقطة، شوق (10 دقائق)\nالاستراتيجيات: ورق الملاحظات.\n\n2. المحاكاة في الكتاب والتصويب بورق الملاحظات؛ كتابة جملة الكتاب (8 دقائق)\nالاستراتيجيات: النمذجة والمحاكاة.\n\n3. غلق الدرس – أفلاج وقلاع بالرقعة: تكتب المجموعات بخط الرقعة كلمات عمانية فيها الفاء والقاف في مواضع مختلفة، مثل «فلج» و«قلعة» و«الفخار» و«سوق» و«الخريف»، ثم تعرضها للتقييم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أي الحرفين ينزل ذيله تحت السطر في الرقعة؟\nالإجابة النموذجية: القاف المتطرفة\n2) (تطبيق) كيف تكتب نقطتا القاف في الرقعة؟\nالإجابة النموذجية: شرطة صغيرة متصلة\n3) (استدلال) اكتب (سفينة) بخط الرقعة.\nالإجابة النموذجية: تقويم: الفاء المتوسطة رأس صغير على السطر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الفاء والقاف مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب: (فرح، طريق) بخط الرقعة.\nالإجابة النموذجية: تقويم موضع الحرفين\n3) (استدلال) اكتب جملة: (في الاتحاد قوة) بالرقعة.\nالإجابة النموذجية: تقويم التناسق والمسافات"], ["الواجب المنزلي", "أكمل التدريب في الكتاب وكراسة الخط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=23"]]}, {"no": 43, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف مكان", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "157-159", "f": [["عنوان الدرس", "التعبير: وصف مكان"], ["نواتج التعلم", "1. يتعرّف قواعد وعناصر وصف المكان (15 دقيقة)\n2. يميز الوصف الخارجي من الوصف الداخلي للمكان (5 دقائق)\n3. يجمع مفردات وتعابير وصفية لمكان عماني (20 دقيقة)"], ["الاستراتيجيات", "التخيل الموجه\nالعصف الذهني\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص157-159\nصور لأماكن عمانية (قلعة، سوق، شاطئ)\nجهاز عرض"], ["التهيئة (5 دقائق)", "تخيل موجه: أغمض عينيك… أنت أمام بوابة قلعة قديمة… ماذا ترى؟ ماذا تسمع؟ ماذا تشم؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. العناصر والقواعد: عناصر وصف المكان: الموقع، الشكل الخارجي، المكونات الداخلية، الألوان والأصوات والروائح، الأشخاص، الأثر في النفس؛ قاعدة الترتيب: من الكل إلى الجزء أو من الخارج إلى الداخل؛ روابط مكانية: أمام، خلف، على يمين، في وسط (10 دقائق)\nالاستراتيجيات: التخيل الموجه.\n\n2. جمع المفردات: كل مجموعة تختار صورة مكان وتجمع عشر مفردات وتعابير تصفه؛ عرض بنك المفردات على السبورة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. الغلق: كل مجموعة تختار أجمل تعبير في بنك المفردات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر ثلاثة عناصر لوصف المكان.\nالإجابة النموذجية: الموقع، والشكل الخارجي، والمكونات الداخلية (أو: الألوان، الأصوات، الأثر في النفس)\n2) (تطبيق) ما الفرق بين الوصف الخارجي والداخلي؟\nالإجابة النموذجية: الخارجي يصف شكل المكان من الخارج، والداخلي يصف محتوياته من الداخل\n3) (استدلال) اذكر ثلاثة روابط مكانية.\nالإجابة النموذجية: أمام، وخلف، وفي وسط"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب وصف قلعة: (الغرف – الموقع – الأسوار – شعوري).\nالإجابة النموذجية: الموقع، الأسوار، الغرف، شعوري\n2) (تطبيق) اكتب جملة تصف رائحة مكان.\nالإجابة النموذجية: مثل: تفوح في سوق مطرح رائحة البخور واللبان\n3) (استدلال) لماذا نذكر أثر المكان في النفس؟\nالإجابة النموذجية: ليشعر القارئ بالمكان ويتفاعل معه لا أن يعرف أوصافه فقط"], ["الواجب المنزلي", "اختر مكانًا عمانيًا واكتب عشر مفردات تصفه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=24"]]}, {"no": 44, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف مكان", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "157-159", "f": [["عنوان الدرس", "التعبير: وصف مكان"], ["نواتج التعلم", "1. يكتب مقطعًا وصفيًا لمكان وصفًا داخليًا وخارجيًا (15 دقيقة)\n2. يوظف الروابط اللفظية والصور الجمالية (15 دقيقة)\n3. يستخدم علامات الترقيم استخدامًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص159\nقائمة تقويم\nبنك المفردات من الحصة السابقة"], ["التهيئة (5 دقائق)", "قراءة وصف قصير نموذجي لمكان عماني وتحديد ما فيه من عناصر"], ["إجراءات التنفيذ (23 دقيقة)", "1. التخطيط والكتابة: مخطط: فقرة للموقع والشكل الخارجي، فقرة للداخل، فقرة للمشاعر؛ كتابة المسودة مع توظيف بنك المفردات (10 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n2. المراجعة: مراجعة بقائمة: العناصر، الترتيب، الروابط، الصور، الترقيم؛ تبادل بين الزملاء واقتراح تحسين؛ قراءة نماذج (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – من الخارج والداخل: تختار كل مجموعة مكانًا عمانيًا كقلعة أو سوق تقليدي، فيصف نصفها مظهره الخارجي ونصفها الآخر داخله بمفردات وصفية، ثم تدمج الوصفين في فقرة شفوية (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أكمل بوصف خارجي: يقف حصن ............\nالإجابة النموذجية: مثل: يقف حصن جبرين شامخًا بأسواره الطينية العالية وأبراجه المستديرة\n2) (تطبيق) أكمل بوصف داخلي: وفي داخل الحصن ............\nالإجابة النموذجية: مثل: غرف واسعة بسقوف خشبية مزخرفة وممرات ضيقة ودرج حجري\n3) (استدلال) استخرج من وصف زميلك صورة جمالية.\nالإجابة النموذجية: تقبل الإجابة الصحيحة من النص المقروء"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث جمل تصف بها ساحة مدرستك.\nالإجابة النموذجية: وصف مرتب فيه روابط مكانية وألفاظ حسية\n2) (تطبيق) صحح الترقيم: (في السوق، محلات للبخور والفضة والحلوى،)\nالإجابة النموذجية: في السوق محلات للبخور والفضة والحلوى.\n3) (استدلال) اقترح عنوانًا جذابًا لنصك الوصفي.\nالإجابة النموذجية: عنوان قصير معبّر عن المكان"], ["الواجب المنزلي", "بيّض النص الوصفي في دفتر التعبير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=24"]]}, {"no": 45, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثاني: جنة عمان", "k": 1, "n": 3, "wi": 3, "wn": 7, "pages": "59-63", "f": [["عنوان الدرس", "الدرس الثاني: جنة عمان"], ["نواتج التعلم", "1. يقرأ النص الشعري قراءة جهرية معبرة مع صحة الضبط (15 دقيقة)\n2. يتعرف الشاعر خالد بن مهنا البطاشي (15 دقيقة)\n3. يحدد العلاقة بين عنوان النص ومضمونه (10 دقائق)"], ["الاستراتيجيات", "التخيل الموجه\nاكشف أوراقك\nالإلقاء النموذجي"], ["مصادر التعلم", "كتاب الطالب ص59-60\nمقطع صوتي لإلقاء القصيدة\nخريطة سلطنة عمان\nصور لصلالة في الخريف"], ["التهيئة (5 دقائق)", "- تخيل موجه: نسيم بارد، رذاذ، جبال خضراء، رائحة اللبان\n- سؤال: أين أنت الآن؟\n- تحديد ظفار على الخريطة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإلقاء: إلقاء نموذجي أو الاستماع للتسجيل؛ إلقاء الطلبة مع مراعاة الوزن وصحة الضبط؛ التعريف بالشاعر: شاعر وفقيه وقاضٍ عماني (10 دقائق)\nالاستراتيجيات: التخيل الموجه.\n\n2. العنوان والمضمون: سؤال: لماذا سمى الشاعر ظفار جنة عمان؟؛ اكشف أوراقك: بطاقة مفردات (الروض، تباهي، يبارى، جلنار) تحلها المجموعات ثم تكشف إجاباتها (10 دقائق)\nالاستراتيجيات: اكشف أوراقك.\n\n3. الغلق: إلقاء جماعي للأبيات الثلاثة الأولى (3 دقائق)\nالاستراتيجيات: الإلقاء النموذجي."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) من شاعر النص؟\nالإجابة النموذجية: خالد بن مهنا البطاشي، شاعر وفقيه وقاضٍ عماني\n2) (تطبيق) ما علاقة العنوان بمضمون النص؟\nالإجابة النموذجية: النص يصف جمال ظفار وصلالة حتى جعلها الشاعر جنة عمان\n3) (استدلال) ما معنى (الروض)؟\nالإجابة النموذجية: الأرض المخضرة بالنبات والزهر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (يبارى)؟\nالإجابة النموذجية: ينافَس\n2) (تطبيق) ما المدينة التي خصها الشاعر بالوصف؟\nالإجابة النموذجية: صلالة\n3) (استدلال) اقرأ الأبيات التي تحفظها من (1-6) قراءة معبرة.\nالإجابة النموذجية: إلقاء سليم معبر مع صحة الضبط"], ["الواجب المنزلي", "احفظ الأبيات (1-6).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=25"]]}, {"no": 46, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثاني: جنة عمان", "k": 2, "n": 3, "wi": 4, "wn": 7, "pages": "59-63", "f": [["عنوان الدرس", "الدرس الثاني: جنة عمان"], ["نواتج التعلم", "1. يستخرج الفكرة العامة والوحدات المعنوية للنص (5 دقائق)\n2. يبين مظاهر جمال محافظة ظفار كما صورها الشاعر (15 دقيقة)\n3. يصنف ألفاظ النص في الحقل المعجمي للطبيعة (20 دقيقة)"], ["الاستراتيجيات", "ثلاثة أسئلة + واحد\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص60-62\nبطاقات أسئلة\nالموسوعة العمانية (المجلد السادس)"], ["التهيئة (5 دقائق)", "تسميع بعض الأبيات المحفوظة"], ["إجراءات التنفيذ (23 دقيقة)", "1. ثلاثة أسئلة + واحد: سؤال 1: مظاهر الطبيعة التي تغنى بها الشاعر؛ سؤال 2: صف صلالة ومظاهر الجمال فيها؛ سؤال 3: ماذا أضاف باني عمان لسمات المكان؟؛ السؤال العام: الوحدات المعنوية الثلاث (10 دقائق)\nالاستراتيجيات: ثلاثة أسئلة + واحد.\n\n2. الوحدات والحقل المعجمي: الأبيات 1-3: إعجاب الشاعر بظفار وأيامه القصار فيها؛ 4-6: جمال صلالة؛ 7-10: فضل جلالة السلطان قابوس على عمان؛ استخراج ألفاظ الطبيعة: الروض، الأزهار، الماء، حدائق، ورد، جلنار (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: ورقة خروج: أجمل صفة لظفار في رأيي هي (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: التغني بجمال ظفار وصلالة وفضل باني عمان عليها\n2) (تطبيق) اذكر مظهرين من مظاهر الطبيعة في ظفار كما في النص.\nالإجابة النموذجية: الرياض المليئة بالأزهار المشرقة، والهواء الصافي كصفو الماء\n3) (استدلال) ما الوحدة المعنوية للأبيات (7-10)؟\nالإجابة النموذجية: فضل جلالة السلطان قابوس -طيب الله ثراه- على عمان وازدهارها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من النص ثلاث كلمات من حقل الطبيعة.\nالإجابة النموذجية: الروض، الأزهار، حدائق (أو: ورد، جلنار، الماء)\n2) (تطبيق) بمَ قارن الشاعر جمال ظفار بمكان مشهور؟\nالإجابة النموذجية: قارنها بربى لبنان وفضّل ظفار عليها\n3) (استدلال) لماذا ختم الشاعر قصيدته بذكر السلطان قابوس؟\nالإجابة النموذجية: لأن نهضة البلاد وازدهارها من صنعه فأراد أن يشكره ويفخر به"], ["الواجب المنزلي", "ابحث في الموسوعة العمانية عن ثلاث معلومات عن صلالة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=25"]]}, {"no": 47, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثاني: جنة عمان", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "59-63", "f": [["عنوان الدرس", "الدرس الثاني: جنة عمان"], ["نواتج التعلم", "1. يناقش الصور الجمالية في النص وأثرها في المعنى (15 دقيقة)\n2. يلخص السمات العامة للنص الشعري (15 دقيقة)\n3. يستنبط القيم المستفادة من النص (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالحوار والمناقشة\nالمشروع المصغر"], ["مصادر التعلم", "كتاب الطالب ص62-63\nخامات من البيئة وأوراق ملونة\nجهاز عرض"], ["التهيئة (5 دقائق)", "عرض صورة لأزهار الجلنار (زهر الرمان) وسؤال: كيف استعملها الشاعر في الصورة؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الصور الجمالية: تشبيه هواء ظفار بصفو الماء في لطفه؛ تصوير الروضات تفاخر جنة الخلد؛ تصوير الورد يعانق الجلنار؛ تصوير القصور (الأشجار العظيمة أو الجبال) تكاد تساير الفلك؛ أثرها: تقريب الجمال وإثارة الإعجاب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. السمات والقيم: السمات: الوزن والقافية الموحدة (الراء الممدودة)، العاطفة الوطنية، الألفاظ الموحية من الطبيعة، الصور الكثيرة؛ القيم: حب الوطن، الاعتزاز بجماله، الوفاء لقادته، المحافظة على المعالم السياحية (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. غلق الدرس – جنة في كل محافظة: تختار كل مجموعة بيتًا من قصيدة «جنة عمان» وتربطه بمشهد عماني يشبهه، كخريف ظفار أو مدرجات الجبل الأخضر أو أخوار مسندم، ثم تلقي البيت وتشرح الربط (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) وضّح الصورة في تشبيه الهواء بصفو الماء.\nالإجابة النموذجية: شبه لطف هواء ظفار ونقاءه بالماء الصافي، فيوحي بالرقة والانتعاش\n2) (تطبيق) ما العاطفة المسيطرة على الشاعر؟\nالإجابة النموذجية: الإعجاب بجمال ظفار والحب للوطن والفخر به\n3) (استدلال) استخرج قيمة من النص.\nالإجابة النموذجية: حب الوطن والاعتزاز بجماله (أو: الوفاء لقادته)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر سمتين للنص الشعري.\nالإجابة النموذجية: الوزن والقافية الموحدة، والصور الجمالية المستمدة من الطبيعة\n2) (تطبيق) ما الحرف الذي انتهت به الأبيات (الروي)؟\nالإجابة النموذجية: الراء\n3) (استدلال) صمم بالتعاون مع مجموعتك إعلانًا سياحيًا قصيرًا لصلالة.\nالإجابة النموذجية: إعلان قصير بعبارة جذابة يذكر مظهرين من جمالها"], ["الواجب المنزلي", "اكتب فقرة نثرية من خمسة أسطر تصف صلالة في الخريف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=25"]]}, {"no": 48, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: نائب الفاعل", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "160-164", "f": [["عنوان الدرس", "الأنشطة النحوية: نائب الفاعل"], ["نواتج التعلم", "1. يتعرّف مفهوم نائب الفاعل (5 دقائق)\n2. يحدد نائب الفاعل في الجمل المبنية للمجهول (25 دقيقة)\n3. يتعرف حكمه الإعرابي (مرفوع) (10 دقائق)"], ["الاستراتيجيات", "القصة\nأقطاب المغناطيس\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص160-162\nبطاقات حمراء وزرقاء\nجهاز عرض"], ["التهيئة (5 دقائق)", "- قصة قصيرة: الفاعل اعتذر عن الحضور فناب عنه المفعول به وحمل علامته (الضمة)\n- سؤال: ماذا نسمي من ينوب عن غيره؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: أمثلة: نُقِلَ المصابُ إلى المستشفى، كُتِبَت الرسالةُ، يُحتَرَمُ المعلمُ؛ تحديد الاسم المرفوع بعد الفعل المبني للمجهول؛ استنتاج: نائب الفاعل اسم مرفوع يأتي بعد الفعل المبني للمجهول ويحل محل الفاعل المحذوف (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. التحديد: أقطاب المغناطيس: فعل مبني للمجهول ونائب فاعله؛ استخراج نائب الفاعل من فقرة الكتاب (10 دقائق)\nالاستراتيجيات: أقطاب المغناطيس.\n\n3. الغلق: كل طالب يكوّن جملة فيها نائب فاعل عن مدرسته (3 دقائق)\nالاستراتيجيات: فكر."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما نائب الفاعل؟\nالإجابة النموذجية: اسم مرفوع يأتي بعد الفعل المبني للمجهول ويحل محل الفاعل المحذوف\n2) (تطبيق) حدد نائب الفاعل: (افتُتِحَ الجامعُ عام 2001م).\nالإجابة النموذجية: الجامعُ\n3) (استدلال) ما أصل نائب الفاعل في الغالب؟\nالإجابة النموذجية: المفعول به في الجملة المبنية للمعلوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حدد نائب الفاعل: (تُزرَعُ الأشجارُ في الربيع).\nالإجابة النموذجية: الأشجارُ\n2) (تطبيق) ما حكم نائب الفاعل الإعرابي؟\nالإجابة النموذجية: مرفوع\n3) (استدلال) استخرج نائب الفاعل من جملة من نص (منارة عمانية).\nالإجابة النموذجية: مثل: كُتبت الآياتُ ← الآياتُ نائب فاعل"], ["الواجب المنزلي", "استخرج خمسة نواب فاعل من نصوص الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=26"]]}, {"no": 49, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: نائب الفاعل", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "160-164", "f": [["عنوان الدرس", "الأنشطة النحوية: نائب الفاعل"], ["نواتج التعلم", "1. يعرب نائب الفاعل إعرابًا صحيحًا بعلاماته المختلفة (15 دقيقة)\n2. يحوّل جملًا مبنية للمعلوم إلى المجهول ويحدد نائب الفاعل (15 دقيقة)\n3. يصوغ أمثلة تطبيقية على الجملة المبنية للمجهول (10 دقائق)"], ["الاستراتيجيات", "شطيرة الإعراب\nالتعلم التعاوني\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص162-164\nأوراق شطيرة الإعراب\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال سريع: حوّل (حفظَ الطالبُ القصيدةَ) إلى المجهول وحدد نائب الفاعل"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإعراب: نماذج: (كُرِّمَ المتفوقون): نائب فاعل مرفوع بالواو؛ (سُمِعَت النقراتُ): مرفوع بالضمة؛ (يُكرَّمُ الفائزان): مرفوع بالألف؛ شطيرة الإعراب لكل نموذج (10 دقائق)\nالاستراتيجيات: شطيرة الإعراب.\n\n2. التطبيق: تحويل جمل الكتاب وتحديد نائب الفاعل وإعرابه؛ كل مجموعة تصوغ ثلاث جمل عن الوطن مبنية للمجهول؛ تبادل وتصحيح (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – أخبار مدرستي بالمجهول: تصوغ كل مجموعة عناوين أخبار مدرسية عن أعمال وطنية بالفعل المبني للمجهول، مثل «زُرعت النخيلُ في ساحة المدرسة»، وتحدد مجموعة أخرى نائب الفاعل وعلامة رفعه (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أعرب (المتفوقون) في: (كُرِّمَ المتفوقون).\nالإجابة النموذجية: نائب فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم\n2) (تطبيق) حوّل: (رفعَ الطلابُ العلمَ) وحدد نائب الفاعل.\nالإجابة النموذجية: رُفِعَ العلمُ، والعلمُ نائب فاعل\n3) (استدلال) أعرب (الفائزان) في: (يُكرَّمُ الفائزان).\nالإجابة النموذجية: نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب: (سُمِعَت النقراتُ).\nالإجابة النموذجية: سمعت: فعل ماض مبني للمجهول والتاء للتأنيث، النقرات: نائب فاعل مرفوع بالضمة\n2) (تطبيق) صغ جملة مبنية للمجهول نائب فاعلها جمع مؤنث سالم.\nالإجابة النموذجية: مثل: نُظِّمت المسابقاتُ في المدرسة\n3) (استدلال) ميّز الفاعل من نائب الفاعل: (حضرَ الضيوفُ) / (أُكرِمَ الضيوفُ).\nالإجابة النموذجية: الأولى: الضيوف فاعل، الثانية: الضيوف نائب فاعل"], ["الواجب المنزلي", "حل تدريبات الكتاب المتبقية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=26"]]}, {"no": 50, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "165-166", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)"], ["نواتج التعلم", "1. يذكر مواضع كتابة الهمزة المتوسطة على الألف (15 دقيقة)\n2. يعلل كتابة الهمزة على الألف في كلمات معطاة (15 دقيقة)\n3. يكتب الهمزة المتوسطة على الألف كتابة صحيحة (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nبطاقات التصنيف\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص165-166\nبطاقات كلمات ناقصة الهمزة\nالسبورة"], ["التهيئة (5 دقائق)", "الدقيقة الواحدة: اكتب أكبر عدد من الكلمات فيها همزة متوسطة على ألف"], ["إجراءات التنفيذ (23 دقيقة)", "1. المراجعة: مراجعة قاعدة الحركات (الكسرة، الضمة، الفتحة، السكون)؛ المواضع: مفتوحة بعد فتح (سَأَل)، مفتوحة بعد ساكن صحيح (يَسْأَل)، ساكنة بعد فتح (يَأْخُذ) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التطبيق: حل التدريب الأول والثاني في الكتاب؛ بطاقات كلمات ناقصة الهمزة تكملها المجموعات مع التعليل (10 دقائق)\nالاستراتيجيات: بطاقات التصنيف.\n\n3. الغلق: تصحيح جماعي وتعزيز (3 دقائق)\nالاستراتيجيات: الدقيقة الواحدة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) علل كتابة الهمزة على ألف في (يَأْمُل).\nالإجابة النموذجية: لأنها ساكنة وما قبلها مفتوح فتكتب على الألف\n2) (تطبيق) علل كتابتها على ألف في (مَسْأَلة).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها ساكن صحيح فتكتب على الألف\n3) (استدلال) اكتب الهمزة: (ر_ي، ت_مل).\nالإجابة النموذجية: رأي، تأمل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث كلمات تختلف فيها أسباب كتابة الهمزة على ألف.\nالإجابة النموذجية: مثل: سأل (فتح بعد فتح)، يسأل (فتح بعد سكون)، رأس (سكون بعد فتح)\n2) (تطبيق) صحح: (يئخذ، فئر).\nالإجابة النموذجية: يأخذ، فأر\n3) (استدلال) اكتب جملة عن الوطن فيها كلمتان بهمزة متوسطة على ألف.\nالإجابة النموذجية: مثل: نتأمل جمال بلادنا ونسأل الله أن يحفظها"], ["الواجب المنزلي", "حل تدريبات الكتاب المتبقية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=27"]]}, {"no": 51, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "165-166", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)"], ["نواتج التعلم", "1. يوظف كلمات فيها همزة متوسطة على الألف في جمل من إنشائه (15 دقيقة)\n2. يميز الهمزة المتوسطة على ألف من الهمزة على غيرها (15 دقيقة)\n3. يكتب فقرة إملائية قصيرة دون أخطاء في الهمزة (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالإملاء المنظور\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص166\nفقرة قصيرة على جهاز العرض\nدفاتر الإملاء"], ["التهيئة (5 دقائق)", "لعبة: المعلم ينطق كلمة والطالب يرفع بطاقة (ألف / واو / ياء) حسب كتابة همزتها"], ["إجراءات التنفيذ (23 دقيقة)", "1. التمييز: كلمات متنوعة: سأل، سُئل، يؤمن، رأس، بئر، مؤذن؛ تصنيف حسب كرسي الهمزة مع التعليل (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الإملاء المنظور: عرض فقرة قصيرة دقيقة ثم إخفاؤها وكتابتها؛ تصحيح ذاتي؛ توظيف الكلمات في جمل (8 دقائق)\nالاستراتيجيات: الإملاء المنظور.\n\n3. غلق الدرس – اسأل جدك: يكتب كل زوج سؤالين يوجههما إلى الجد عن الحياة العمانية قديمًا، يتضمنان همزة متوسطة على ألف، مثل «ماذا كنتم تأكلون في السفر؟»، ثم يعلل زوج آخر كتابة الهمزة (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) صنف الهمزة: (مُؤذّن).\nالإجابة النموذجية: على واو لأنها مفتوحة وما قبلها مضموم والضمة أقوى\n2) (تطبيق) صنف الهمزة: (يَأْكُل).\nالإجابة النموذجية: على ألف لأنها ساكنة وما قبلها مفتوح\n3) (استدلال) اكتب كلمة همزتها على ألف وأخرى على نبرة.\nالإجابة النموذجية: مثل: سأل / سُئِل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) وظف كلمة (تأمّل) في جملة.\nالإجابة النموذجية: مثل: تأمّلت النجوم في ليلة صافية\n2) (تطبيق) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم دقة الكتابة\n3) (استدلال) ما القاعدة العامة لكتابة الهمزة المتوسطة؟\nالإجابة النموذجية: تُكتب على ما يناسب أقوى الحركتين: حركتها وحركة ما قبلها"], ["الواجب المنزلي", "اكتب خمس جمل تتضمن كلمات بهمزة متوسطة على ألف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=27"]]}, {"no": 52, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "خط الرقعة: (ك، ن)", "k": 1, "n": 1, "wi": 3, "wn": 7, "pages": "167", "f": [["عنوان الدرس", "خط الرقعة: (ك، ن)"], ["نواتج التعلم", "1. يرسم حرفي الكاف والنون مجردين بخط الرقعة (15 دقيقة)\n2. يكتب الحرفين في مواضعهما المختلفة (15 دقيقة)\n3. يكتب جملة بالرقعة مراعيًا قواعد الرسم (10 دقائق)"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص167\nأقلام مشطوفة\nأوراق ملاحظات"], ["التهيئة (5 دقائق)", "- كتابة الكاف بالنسخ وبالرقعة\n- سؤال: ما الذي يميز الكاف في الرقعة؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. النمذجة: الكاف في الرقعة تكتب بلا همزة صغيرة في داخلها وتُرسم بشكل مائل مستقيم؛ الكاف المتطرفة لها شكل خاص؛ النون المجردة تنزل تحت السطر قليلًا ونقطتها فوقها؛ أمثلة: كتاب، مكتبة، ملك، نهر، سنة، وطن (10 دقائق)\nالاستراتيجيات: ورق الملاحظات.\n\n2. المحاكاة في الكتاب والتصويب؛ كتابة جملة الكتاب (8 دقائق)\nالاستراتيجيات: النمذجة والمحاكاة.\n\n3. غلق الدرس – النخلة والكرم: تكتب كل مجموعة بخط الرقعة عبارة قيمية عمانية فيها الكاف والنون، مثل «الكرم من شيم أهل عمان» أو «النخلة كنز عماني»، ثم تقيم المجموعات العبارات (5 دقائق)\nالاستراتيجيات: المعرض الجوال."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) هل تُكتب الهمزة الصغيرة داخل الكاف في الرقعة؟\nالإجابة النموذجية: لا تُكتب\n2) (تطبيق) هل تنزل النون المتطرفة عن خط القاعدة؟\nالإجابة النموذجية: نعم، ينزل جزؤها السفلي تحت السطر قليلًا\n3) (استدلال) اكتب (مكتبة) بالرقعة.\nالإجابة النموذجية: تقويم عملي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الكاف والنون مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب: (كنز، وطن) بالرقعة.\nالإجابة النموذجية: تقويم الموضعين\n3) (استدلال) اكتب: (حب الوطن من الإيمان) بالرقعة.\nالإجابة النموذجية: تقويم التناسق والمسافات"], ["الواجب المنزلي", "أكمل كراسة الخط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=28"]]}, {"no": 53, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف مشاعر", "k": 1, "n": 2, "wi": 4, "wn": 7, "pages": "168-170", "f": [["عنوان الدرس", "التعبير: وصف مشاعر"], ["نواتج التعلم", "1. يفرق بين وصف المشاعر وسرد الأحداث (5 دقائق)\n2. يتعرف أساليب التعبير عن المشاعر (الألفاظ الدالة، التشبيه، أثر المشاعر في الجسد) (25 دقيقة)\n3. يجمع مفردات المشاعر المختلفة (10 دقائق)"], ["الاستراتيجيات", "العصف الذهني\nتمثيل الأدوار\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص168-170\nبطاقات وجوه تعبيرية\nجهاز عرض"], ["التهيئة (5 دقائق)", "تمثيل صامت لمشاعر (فرح، خوف، حزن، فخر) ويخمّن الطلبة الشعور"], ["إجراءات التنفيذ (23 دقيقة)", "1. الأساليب: التعبير عن الشعور بالتسمية (شعرت بالفخر)، وبأثره في الجسد (خفق قلبي، ارتجفت يداي)، وبالتشبيه (طرت فرحًا كالعصفور)، وبالأفعال (قفزت، صرخت)؛ أمثلة من نص (النقرات الثلاث) ونص (في انتظار شانتي): الفرح والقلق عند الإبحار (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. بنك المشاعر: جدول: الشعور، ألفاظه، أثره الجسدي، تشبيه مناسب؛ كل مجموعة تكمل صفًا لشعور مختلف (10 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n3. الغلق: كل طالب يكتب كلمة تعبر عن شعوره اليوم ويضعها في لوحة المشاعر (3 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر أسلوبين للتعبير عن الشعور.\nالإجابة النموذجية: ذكر أثره في الجسد، والتشبيه\n2) (تطبيق) عبّر عن الخوف بأثره في الجسد.\nالإجابة النموذجية: مثل: تسارعت دقات قلبي وارتجفت أطرافي\n3) (استدلال) ما المشاعر المختلطة عند إبحار شانتي في النص؟\nالإجابة النموذجية: فرح البحارة ببدء الإبحار وقلق المودعين على أحبائهم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب تشبيهًا يعبر عن الفخر.\nالإجابة النموذجية: مثل: وقفت شامخًا كالجبل حين رفرف علم بلادي\n2) (تطبيق) صنف: (خرجنا إلى الشاطئ) / (غمرني شعور بالسكينة).\nالإجابة النموذجية: الأولى سرد، والثانية وصف شعور\n3) (استدلال) لماذا يهتم الكاتب بوصف المشاعر في القصة؟\nالإجابة النموذجية: ليشارك القارئ الشخصيات أحاسيسها فيتأثر بالنص"], ["الواجب المنزلي", "اجمع عشر عبارات تصف مشاعر من نصوص الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=29"]]}, {"no": 54, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف مشاعر", "k": 2, "n": 2, "wi": 5, "wn": 7, "pages": "168-170", "f": [["عنوان الدرس", "التعبير: وصف مشاعر"], ["نواتج التعلم", "1. يكتب مقطعًا وصفيًا لمشاعره ضمن نص سردي (15 دقيقة)\n2. يوظف الروابط والأساليب المناسبة للنص الوصفي السردي (15 دقيقة)\n3. يستخدم علامات الترقيم استخدامًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص170\nقائمة تقويم\nبنك المشاعر"], ["التهيئة (5 دقائق)", "- موقف: يوم الاحتفال بالعيد الوطني في المدرسة\n- سؤال: بماذا شعرت؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. التخطيط والكتابة: سرد الموقف بإيجاز: متى، أين، ماذا حدث؛ وصف المشاعر عند كل لحظة بالأساليب المدروسة؛ كتابة المسودة (10 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n2. المراجعة: فكر زاوج شارك: يقرأ الطالب نصه لزميله ويقترح الزميل إضافة وصف؛ مراجعة بقائمة: السرد، وصف المشاعر، الروابط، الترقيم (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – مشاعر تحت العلم: يصف كل زوج مشاعره لحظة رفع العلم العماني في طابور الصباح أو في احتفال العيد الوطني، مستخدمًا ألفاظًا دالة وتشبيهًا وأثر الشعور في الجسد، ثم يشاركها الصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أكمل بوصف شعور: حين سمعت النشيد الوطني ..........\nالإجابة النموذجية: مثل: سرت في جسدي قشعريرة فخر وامتلأت عيناي بدموع الفرح\n2) (تطبيق) ما الرابط المناسب للانتقال بين لحظتين؟\nالإجابة النموذجية: مثل: وما إن... حتى، ثم، وفي تلك اللحظة\n3) (استدلال) أين تضع علامة التعجب في وصف المشاعر؟\nالإجابة النموذجية: بعد الجمل التي تعبر عن انفعال قوي مثل: ما أجمل تلك اللحظة!"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث جمل تصف فيها شعورك يوم نجاحك.\nالإجابة النموذجية: جمل تجمع السرد ووصف الشعور بأسلوبين على الأقل\n2) (تطبيق) حوّل الجملة إلى وصف شعور: (فزت بالمسابقة).\nالإجابة النموذجية: مثل: فزت بالمسابقة فطار قلبي فرحًا ولم أصدق أذني\n3) (استدلال) قيّم نص زميلك بذكر أجمل وصف فيه.\nالإجابة النموذجية: تقبل الإجابات المحددة"], ["الواجب المنزلي", "بيّض النص في دفتر التعبير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=29"]]}, {"no": 55, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "القراءة الحرة: المحور الثاني", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "73-75", "f": [["عنوان الدرس", "القراءة الحرة: المحور الثاني"], ["نواتج التعلم", "1. يقرأ كتابًا عن الوطن أو التراث العماني قراءة فاحصة (5 دقائق)\n2. يعرّف بالكتاب وفق بطاقة القراءة (15 دقيقة)\n3. يلخص الكتاب ويصمم له خريطة ذهنية (20 دقيقة)"], ["الاستراتيجيات", "العرض الشفهي\nالخريطة الذهنية\nالتعلم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص73-75\nكتب عن عمان من مركز مصادر التعلم\nالفاكس كام"], ["التهيئة (5 دقائق)", "- عرض أغلفة كتب عن عمان وتراثها\n- كل طالب يختار كتابًا"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة الفاحصة: قراءة فردية مع تسجيل الأفكار المهمة؛ تعبئة بطاقة الكتاب (10 دقائق)\nالاستراتيجيات: العرض الشفهي.\n\n2. الخريطة الذهنية: تصميم خريطة: العنوان في الوسط والأفكار حوله؛ تبادل الخرائط بين الزملاء (10 دقائق)\nالاستراتيجيات: الخريطة الذهنية.\n\n3. الغلق: عرض خريطتين ذهنيتين (3 دقائق)\nالاستراتيجيات: التعلم الذاتي."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الموضوع العام للكتاب الذي اخترته؟\nالإجابة النموذجية: تقبل الإجابات المرتبطة بالكتاب\n2) (تطبيق) اذكر مؤلف الكتاب ودار نشره إن وجدت.\nالإجابة النموذجية: من غلاف الكتاب\n3) (استدلال) ما الفكرة التي لفتت انتباهك؟ ولماذا؟\nالإجابة النموذجية: إجابة معللة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث أفكار رئيسة من الكتاب.\nالإجابة النموذجية: أفكار مختصرة من الكتاب\n2) (تطبيق) ما علاقة كتابك بمحور الوطن؟\nالإجابة النموذجية: يتحدث عن مكان أو تراث أو شخصية عمانية (تقبل الإجابات المناسبة)\n3) (استدلال) صمم خريطة ذهنية لكتابك.\nالإجابة النموذجية: خريطة واضحة تضم العنوان والأفكار الرئيسة"], ["الواجب المنزلي", "أكمل قراءة الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=30"]]}, {"no": 56, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "القراءة الحرة: المحور الثاني", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "73-75", "f": [["عنوان الدرس", "القراءة الحرة: المحور الثاني"], ["نواتج التعلم", "1. يعرض ملخص الكتاب المقروء شفهيًا في زمن محدد (15 دقيقة)\n2. يجيب عن أسئلة الزملاء حول الكتاب (15 دقيقة)\n3. يقيّم عروض زملائه وفق معايير محددة (10 دقائق)"], ["الاستراتيجيات", "العرض الشفهي\nالكرسي الساخن\nالتقويم التبادلي"], ["مصادر التعلم", "بطاقات الكتب المكتملة\nالفاكس كام\nبطاقة معايير العرض"], ["التهيئة (5 دقائق)", "تذكير بمعايير العرض الجيد: الصوت الواضح، الترتيب، الوقت، التواصل البصري"], ["إجراءات التنفيذ (23 دقيقة)", "1. العروض: عرض الطلبة ملخصاتهم (دقيقتان لكل عرض)؛ عرض الخرائط الذهنية بالفاكس كام (10 دقائق)\nالاستراتيجيات: العرض الشفهي.\n\n2. الأسئلة والتقويم: الكرسي الساخن: أسئلة الزملاء للعارض؛ تقويم تبادلي بالمعايير؛ اختيار (كتاب الأسبوع) (8 دقائق)\nالاستراتيجيات: الكرسي الساخن.\n\n3. غلق الدرس – خريطة كتاب تراثي: تبني كل مجموعة خريطة ذهنية سريعة لكتاب قرأه أحد أعضائها عن الوطن أو التراث العماني، وتضيف فرعًا يبين ما تعلمته منه عن هويتها (5 دقائق)\nالاستراتيجيات: الخرائط الذهنية."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما معايير العرض الشفهي الجيد؟\nالإجابة النموذجية: وضوح الصوت، وترتيب الأفكار، والالتزام بالوقت، والتواصل البصري\n2) (تطبيق) ما السؤال الذي وجهته لزميلك عن كتابه؟\nالإجابة النموذجية: سؤال مرتبط بالكتاب المعروض\n3) (استدلال) اذكر كتابًا عرضه زميلك وتود قراءته.\nالإجابة النموذجية: إجابة مع تعليل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) قدم ملخص كتابك في دقيقتين.\nالإجابة النموذجية: عرض منظم يغطي الموضوع والأفكار والرأي\n2) (تطبيق) قيّم عرض زميل بمعيارين.\nالإجابة النموذجية: ذكر معيارين متحققين أو ناقصين\n3) (استدلال) لماذا نتبادل الكتب بعد القراءة؟\nالإجابة النموذجية: لتعميم الفائدة وتشجيع القراءة"], ["الواجب المنزلي", "اقرأ الكتاب الذي اخترته من عرض زميلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=30"]]}, {"no": 57, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثالث: في انتظار شانتي", "k": 1, "n": 3, "wi": 1, "wn": 7, "pages": "64-72", "f": [["عنوان الدرس", "الدرس الثالث: في انتظار شانتي"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية بطلاقة (5 دقائق)\n2. ينطق الأعلام والأماكن العمانية نطقًا صحيحًا (محوت، غبة حشيش، بر الحكمان، خور البطح) (25 دقيقة)\n3. يتعرف الكاتب يونس الأخزمي ونوع النص (10 دقائق)"], ["الاستراتيجيات", "الدقيقة الواحدة\nالقراءة النموذجية والمحاكاة\nمسابقة قارئ اليوم"], ["مصادر التعلم", "كتاب الطالب ص64-66\nخريطة عمان والعالم لتتبع الرحلة\nصور لسفن عمانية"], ["التهيئة (5 دقائق)", "- الدقيقة الواحدة: عدد أسماء السفن العمانية التي تعرفها\n- عرض صور لسفن (الغنجة، البغلة، البوم)\n- أسئلة اكتشف النص"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة النموذجية: قراءة نموذجية مع إبراز نطق الأعلام؛ تتبع المسار على الخريطة: محوت ← صور ← جوا في الهند؛ تدريب على نطق: الوستاد، النوخذة، الصواري، تكوير (10 دقائق)\nالاستراتيجيات: الدقيقة الواحدة.\n\n2. قراءات: قراءة فقرات متتابعة، تصويب فوري (10 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة.\n\n3. الغلق: تتبع جماعي لرحلة مبخوت البرية على الخريطة (3 دقائق)\nالاستراتيجيات: مسابقة قارئ اليوم."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) من أي شاطئ أبحرت السفينة شانتي؟\nالإجابة النموذجية: من شواطئ محوت\n2) (تطبيق) إلى أين كانت متجهة؟\nالإجابة النموذجية: إلى مدينة صور ثم إلى مدينة جوا على السواحل الهندية\n3) (استدلال) من صنع السفينة؟\nالإجابة النموذجية: الوستاد منصور"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟\nالإجابة النموذجية: يونس الأخزمي، قاص وروائي عماني\n2) (تطبيق) ما نوع السفينة شانتي؟\nالإجابة النموذجية: غنجة مصنوعة من خشب الساج المجلوب من الهند\n3) (استدلال) اقرأ الفقرة الأولى قراءة معبرة.\nالإجابة النموذجية: قراءة سليمة بطلاقة"], ["الواجب المنزلي", "تدرّب على قراءة النص واكتب أسماء الأماكن الواردة فيه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=31"]]}, {"no": 58, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثالث: في انتظار شانتي", "k": 2, "n": 3, "wi": 2, "wn": 7, "pages": "64-72", "f": [["عنوان الدرس", "الدرس الثالث: في انتظار شانتي"], ["نواتج التعلم", "1. يستنبط الفكرة العامة والأفكار الجزئية (15 دقيقة)\n2. يحلل دلالات الألفاظ ويجرد الكلمات من أحرف الزيادة (5 دقائق)\n3. يصنف ألفاظ النص إلى حقلي البحر والصحراء (20 دقيقة)"], ["الاستراتيجيات", "برنامج سحابة الكلمات\nالتعلم التعاوني\nالقراءة الصامتة الموجهة"], ["مصادر التعلم", "كتاب الطالب ص67-68\nسحابة كلمات مطبوعة\nجدول تصنيف"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع تحديد المفردات الجديدة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الأفكار والمفردات: الفكرة العامة: إبحار السفينة العمانية شانتي ورحلة صاحبها مبخوت برًا لاستقبالها في صور؛ سحابة الكلمات: البحث عن معاني (الوستاد: المشرف على العمل وصانع السفينة، تكوير: إنزال السفينة في البحر، السعن: وعاء من جلد لحفظ الماء، تنوس: تتمايل)؛ تجريد: غنجة ← غنج، البحارة ← بحر (10 دقائق)\nالاستراتيجيات: برنامج سحابة الكلمات.\n\n2. الحقول المعجمية: تصنيف: البحر (شواطئ، الأزرق المالح، الغنجة، ساحل، البياح، البحارة، ترسو، النوارس، الصواري، نوخذة، هواري) والصحراء (التلال، الهضاب، الأودية، الناقة، قافلة، الخب) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: عرض جدول التصنيف الأدق (3 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: إبحار السفينة العمانية شانتي ورحلة صاحبها مبخوت برًا إلى صور لاستقبالها\n2) (تطبيق) ما معنى (تكوير السفينة)؟\nالإجابة النموذجية: إنزالها إلى البحر\n3) (استدلال) صنف: (النوخذة، القافلة).\nالإجابة النموذجية: النوخذة: البحر، القافلة: الصحراء"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما معنى (السعن)؟\nالإجابة النموذجية: وعاء من جلد الحيوان لحفظ الماء\n2) (تطبيق) جرد (تتقاذف) من أحرف الزيادة.\nالإجابة النموذجية: قذف\n3) (استدلال) ما الفكرة الجزئية للفقرة التي تصف مبخوتًا؟\nالإجابة النموذجية: خبرة مبخوت الواسعة بالبحر ورحلاته الكثيرة رغم كبر سنه اليوم"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=31"]]}, {"no": 59, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثالث: في انتظار شانتي", "k": 3, "n": 3, "wi": 3, "wn": 7, "pages": "64-72", "f": [["عنوان الدرس", "الدرس الثالث: في انتظار شانتي"], ["نواتج التعلم", "1. يقارن بين الرحلة عبر البحر والرحلة عبر الصحراء (15 دقيقة)\n2. يصف شخصية مبخوت من خلال النص (15 دقيقة)\n3. يستنتج القيم الإيجابية التي يدعو إليها النص (10 دقائق)"], ["الاستراتيجيات", "شريط الأسئلة\nالقصة المصورة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص68-72\nشريط أسئلة ورقي\nرسم قصة مصورة فارغة الحوار"], ["التهيئة (5 دقائق)", "قراءة صامتة سريعة خمس دقائق"], ["إجراءات التنفيذ (23 دقيقة)", "1. التحليل: شريط الأسئلة: الزمان والمكان والشخصية الرئيسة والحدث في الفقرة الأولى؛ المقارنة: رحلة السفينة بحرًا بالبحارة المهرة / رحلة مبخوت برًا على ناقته عفراء عبر القرى؛ صفات مبخوت: خبير بالبحر، فخور بسفينته، كريم يدعو الناس، صبور رغم كبر سنه (10 دقائق)\nالاستراتيجيات: شريط الأسئلة.\n\n2. القيم والقصة المصورة: القيم: الاعتزاز بأمجاد عمان البحرية، الكرم، الصبر، المثابرة؛ القصة المصورة: حوار بين مبخوت ومعاونيه يبين فخره بسفينته (8 دقائق)\nالاستراتيجيات: القصة المصورة.\n\n3. غلق الدرس – دعوة إلى سواحل عمان: تكتب كل مجموعة دعوة سياحية من جملتين لأحد الأماكن العمانية الواردة في النص (محوت، غبة حشيش، بر الحكمان، خور البطح)، ثم يقرؤها ممثلها بطلاقة كأنه مذيع (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) لماذا فضل مبخوت الرحلة البرية؟\nالإجابة النموذجية: ليمر بالقرى ويدعو أهلها لمشاركته الاحتفال بتكوير السفينة في صور، كما اعتاد\n2) (تطبيق) اذكر صفتين لمبخوت.\nالإجابة النموذجية: خبير بأمور البحر، وفخور بسفينته (أو: كريم، صبور)\n3) (استدلال) ما المدة التي استغرقتها رحلة مبخوت إلى صور؟\nالإجابة النموذجية: ثلاثة أيام، وصل صبيحة اليوم الثالث"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) قارن بين الرحلتين من حيث الوسيلة.\nالإجابة النموذجية: رحلة بحرية بالسفينة شانتي ورحلة برية على الناقة عفراء\n2) (تطبيق) استخرج قيمة من النص.\nالإجابة النموذجية: الاعتزاز بأمجاد عمان في صناعة السفن (أو: الكرم، الصبر)\n3) (استدلال) لماذا وصف مبخوت السفينة بأنها أكبر من مجرد خشبة؟\nالإجابة النموذجية: لأنها فخر صناعة السفن العمانية ورمز لتاريخ عمان البحري"], ["الواجب المنزلي", "حل أنشطة (أحلل النص) المتبقية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=31"]]}, {"no": 60, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: تطبيقات (المبني للمجهول ونائب الفاعل)", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "171-172", "f": [["عنوان الدرس", "الأنشطة النحوية: تطبيقات (المبني للمجهول ونائب الفاعل)"], ["نواتج التعلم", "1. يستخرج الفعل المبني للمعلوم والمبني للمجهول ونائب الفاعل (15 دقيقة)\n2. يعرب نائب الفاعل إعرابًا صحيحًا (15 دقيقة)\n3. يحوّل الأفعال المبنية للمعلوم إلى المجهول مع الضبط وتغيير ما يلزم (10 دقائق)"], ["الاستراتيجيات", "من أنا؟\nالتعلم التعاوني\nورقة واحدة وقلم واحد"], ["مصادر التعلم", "كتاب الطالب ص171-172\nبطاقات (من أنا؟)\nأوراق عمل"], ["التهيئة (5 دقائق)", "- من أنا؟: أنا فعل ضُم أولي وكُسر ما قبل آخري فمن أنا؟\n- أنا اسم مرفوع نبت مكان الفاعل فمن أنا؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستخراج: فقرة من نص (في انتظار شانتي) تُحوّل أفعالها: صنعها الوستاد ← صُنعت؛ استخراج الأفعال وتصنيفها؛ تحديد نائب الفاعل (10 دقائق)\nالاستراتيجيات: من أنا؟.\n\n2. الإعراب والتحويل: ورقة واحدة وقلم واحد: إعراب ثلاث جمل بالتناوب؛ تحويل جمل التدريب مع الضبط (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – صناعة السفن بالمجهول: يقدم المعلم جملًا عن صناعة السفن في صور، مثل «صنع النجارُ السفينةَ»، فتحولها المجموعات إلى المبني للمجهول مع ضبط نائب الفاعل، وتتسابق في إعرابه (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) استخرج الفعل المبني للمجهول ونائب الفاعل: (رُبطت السفينةُ بحبالٍ من ألياف جوز الهند).\nالإجابة النموذجية: رُبطت، والسفينةُ نائب فاعل\n2) (تطبيق) حوّل: (يصنعُ العمانيون السفنَ).\nالإجابة النموذجية: تُصنَعُ السفنُ\n3) (استدلال) أعرب (السفنُ) في الجملة المحولة.\nالإجابة النموذجية: نائب فاعل مرفوع بالضمة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حوّل وأعرب نائب الفاعل: (استقبل الأهالي السفينةَ).\nالإجابة النموذجية: اُستُقبِلَت السفينةُ، السفينة: نائب فاعل مرفوع بالضمة\n2) (تطبيق) صنف: (أبحرت شانتي) / (أُنزلت شانتي).\nالإجابة النموذجية: الأول مبني للمعلوم، والثاني مبني للمجهول\n3) (استدلال) اكتب جملة مبنية للمجهول نائب فاعلها مثنى.\nالإجابة النموذجية: مثل: كُرِّمَ الفائزان في المسابقة"], ["الواجب المنزلي", "أكمل تدريبات التطبيقات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=32"]]}, {"no": 61, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على ألف)", "k": 1, "n": 1, "wi": 5, "wn": 7, "pages": "173", "f": [["عنوان الدرس", "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على ألف)"], ["نواتج التعلم", "1. يكتب فقرة مسموعة كتابة صحيحة (15 دقيقة)\n2. يكتب كلمات الهمزة المتوسطة على ألف كتابة صحيحة (15 دقيقة)\n3. يصحح أخطاءه ذاتيًا ويعلل الصواب (10 دقائق)"], ["الاستراتيجيات", "جامع الألماس\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص173\nفقرة إملائية من إعداد المعلم\nجهاز الفاكس كام"], ["التهيئة (5 دقائق)", "مراجعة سريعة لقاعدة الهمزة المتوسطة على ألف بثلاثة أمثلة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإملاء: قراءة الفقرة كاملة؛ إملاؤها جملًا قصيرة مع التكرار مرتين؛ مراعاة النطق الواضح للهمزات (10 دقائق)\nالاستراتيجيات: جامع الألماس.\n\n2. التصحيح: قراءة أخيرة للمراجعة؛ عرض الفقرة الصحيحة وتصحيح ذاتي؛ تعليل كتابة كل همزة في الفقرة؛ جامع الألماس للمتميزين (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – إملاء من الواحة: يملي قائد كل مجموعة جملة عن الزراعة في الواحات العمانية تتضمن كلمات بهمزة متوسطة على ألف، ثم يصحح الأعضاء ويتحاورون في قيمة الأمانة في الاختبار (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) علل كتابة الهمزة في (يتأمّل).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها ساكن، والفتحة أقوى، فتكتب على ألف\n2) (تطبيق) ماذا تفعل إذا شككت في كرسي الهمزة؟\nالإجابة النموذجية: أقارن حركتها بحركة ما قبلها وأختار ما يناسب الأقوى\n3) (استدلال) اكتب جملة مملاة صحيحة.\nالإجابة النموذجية: تقويم كتابة الجملة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم بحسب الدقة\n2) (تطبيق) صحح الكلمات التي أخطأت فيها مع التعليل.\nالإجابة النموذجية: تصويب مع تعليل القاعدة\n3) (استدلال) اكتب ثلاث كلمات من الفقرة فيها همزة متوسطة على ألف.\nالإجابة النموذجية: من كلمات الفقرة المملاة"], ["الواجب المنزلي", "اكتب الفقرة صحيحة مرتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=33"]]}, {"no": 62, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف رحلة", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "174-178", "f": [["عنوان الدرس", "التعبير: وصف رحلة"], ["نواتج التعلم", "1. يتعرّف عناصر وصف الرحلة (الشخوص، الأمكنة، المشاهد، الأحداث) (15 دقيقة)\n2. يخطط لنص يصف رحلة إلى مكان عماني (15 دقيقة)\n3. يوظف الروابط الزمانية والمكانية (10 دقائق)"], ["الاستراتيجيات", "العصف الذهني\nالخريطة الذهنية\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص174-178\nخريطة سلطنة عمان\nصور لرحلات"], ["التهيئة (5 دقائق)", "- سؤال: إلى أين كانت آخر رحلة لك؟ ماذا رأيت؟\n- ربط برحلة مبخوت في درس شانتي"], ["إجراءات التنفيذ (23 دقيقة)", "1. عناصر وصف الرحلة: قبل الرحلة: الاستعداد والمشاعر؛ الطريق: المشاهد والأماكن؛ الوصول: وصف المكان والأحداث؛ العودة: الانطباع؛ الشخوص المرافقون؛ روابط: في صباح، وبعد ساعة، وعلى جانبي الطريق (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. التخطيط: خريطة ذهنية لرحلة يختارها الطالب؛ كل عنصر بثلاث جمل مفتاحية؛ عرض مخططات بعض الطلبة (10 دقائق)\nالاستراتيجيات: الخريطة الذهنية.\n\n3. الغلق: عرض مخطط متميز (3 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر عناصر وصف الرحلة.\nالإجابة النموذجية: الشخوص، والأمكنة، والمشاهد، والأحداث\n2) (تطبيق) ما المرحلة التي يصف فيها الكاتب مشاعره قبل الرحلة؟\nالإجابة النموذجية: مرحلة الاستعداد في المقدمة\n3) (استدلال) اذكر رابطين زمانيين ورابطين مكانيين.\nالإجابة النموذجية: زماني: في الصباح، بعد ذلك، مكاني: على جانبي الطريق، أمامنا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (الوصول – الاستعداد – العودة – الطريق).\nالإجابة النموذجية: الاستعداد، الطريق، الوصول، العودة\n2) (تطبيق) من رحلة مبخوت: اذكر مكانين مر بهما.\nالإجابة النموذجية: الغضن، شنة، رأس الرويس، قرون، رأس الحد (أي اثنين)\n3) (استدلال) اكتب جملة تصف مشهدًا على الطريق.\nالإجابة النموذجية: مثل: امتدت على جانبي الطريق جبال شاهقة تتخللها واحات نخيل خضراء"], ["الواجب المنزلي", "أكمل المخطط بالجمل المفتاحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=34"]]}, {"no": 63, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف رحلة", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "174-178", "f": [["عنوان الدرس", "التعبير: وصف رحلة"], ["نواتج التعلم", "1. يكتب نصًا وصفيًا سرديًا متكاملًا لرحلة (15 دقيقة)\n2. يصف الشخوص والأمكنة والمشاهد والأحداث بلغة سليمة (15 دقيقة)\n3. يستخدم علامات الترقيم استخدامًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص178\nالمخطط السابق\nقائمة تقويم"], ["التهيئة (5 دقائق)", "قراءة مقدمة نموذجية لوصف رحلة وتحديد عناصرها"], ["إجراءات التنفيذ (23 دقيقة)", "1. الكتابة: كتابة النص اعتمادًا على المخطط: مقدمة، الطريق، الوصول، العودة؛ توظيف الوصف الحسي والمشاعر (10 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n2. المراجعة: تقويم ذاتي ثم تبادلي بقائمة: العناصر، الترتيب، الوصف، الروابط، الترقيم، سلامة اللغة؛ تحسين المسودة (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – رحلة إلى جبل شمس: تخطط كل مجموعة لنص يصف رحلة إلى جبل شمس أو رمال الشرقية، تحدد فيه الشخوص والمشاهد والأحداث، وتوظف روابط زمانية ومكانية، ثم تعرض بدايته (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أكمل بمقدمة: في صباح يوم الجمعة ..........\nالإجابة النموذجية: مثل: استيقظنا باكرًا وحزمنا أمتعتنا استعدادًا لرحلتنا إلى الجبل الأخضر والفرحة تملأ قلوبنا\n2) (تطبيق) صف المكان عند الوصول في جملة.\nالإجابة النموذجية: جملة وصفية فيها لون أو صوت أو رائحة\n3) (استدلال) ما علامة الترقيم بعد عبارة التعجب (ما أروع المنظر)؟\nالإجابة النموذجية: علامة التعجب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب خاتمة لنص الرحلة.\nالإجابة النموذجية: خاتمة تعبر عن الانطباع والرغبة في العودة\n2) (تطبيق) حدد في نصك رابطين وصورة جمالية.\nالإجابة النموذجية: تحديد صحيح من نص الطالب\n3) (استدلال) قيّم نص زميلك بمعيارين.\nالإجابة النموذجية: تقويم محدد بالمعايير"], ["الواجب المنزلي", "بيّض نص وصف الرحلة في دفتر التعبير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=34"]]}, {"no": 64, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الاستماع: بوابة عمان", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "77-78", "f": [["عنوان الدرس", "الاستماع: بوابة عمان"], ["نواتج التعلم", "1. يستمع إلى النص مراعيًا آداب الاستماع (5 دقائق)\n2. يستخلص الفكرة العامة ويتعرف خدمات مطار مسقط الدولي ومرافقه (25 دقيقة)\n3. يذكر التوجيهات الواردة في النص المسموع (10 دقائق)"], ["الاستراتيجيات", "العصف الذهني\nعلبة الكعك\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص77-78\nمقطع صوتي لنص الاستماع\nصورة كبيرة لمطار مسقط الدولي\nورق ملون على شكل كعكات وعلب"], ["التهيئة (5 دقائق)", "- عرض صورة المطار\n- سؤالان: ماذا تشاهد؟ اذكر أسماء المطارات في سلطنة عمان"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستماع الأول والثاني: آداب الاستماع وقراءة الأسئلة دقيقتين؛ الاستماع الأول للفكرة العامة؛ الاستماع الثاني لرصد المرافق والخدمات الإلكترونية وعدد المسافرين والتوجيهات (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. علبة الكعك: كل مجموعة تكتب التوجيهات الثلاثة على ثلاث كعكات وعدد المسافرين على الرابعة وتضعها في العلبة خلال خمس دقائق؛ حل أسئلة الكتاب: تمييز الأفكار التي يمكن استنتاجها (8 دقائق)\nالاستراتيجيات: علبة الكعك.\n\n3. غلق الدرس – مرحبًا بكم في عمان: يمثل كل زوج مشهدًا في مطار مسقط الدولي بين موظف عماني وسائح قادم، يرحب فيه الموظف بالضيف ويقدم له توجيهات من النص، ويقترح عليه معلمًا عمانيًا يزوره (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص المسموع؟\nالإجابة النموذجية: التعريف بمطار مسقط الدولي ومرافقه وخدماته بوصفه بوابة عمان إلى العالم\n2) (تطبيق) اذكر ثلاثًا من مرافق المطار.\nالإجابة النموذجية: صالات الانتظار، والأسواق الحرة، والمطاعم (وما ورد في النص من مرافق أخرى)\n3) (استدلال) لماذا يعد النص ذا نمط توجيهي؟\nالإجابة النموذجية: لأنه يتضمن إرشادات للمسافرين حول إجراءات السفر واستخدام الخدمات"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم مسافرًا يستوعب المطار سنويًا كما ورد في النص؟\nالإجابة النموذجية: نحو عشرين مليون مسافر سنويًا (بحسب النص المسموع)\n2) (تطبيق) ميّز فكرة يمكن استنتاجها: (يقدم المطار خدمات إلكترونية لتسهيل إجراءات السفر).\nالإجابة النموذجية: فكرة صحيحة يمكن استنتاجها من النص\n3) (استدلال) اكتب تقريرًا مبسطًا من أربعة أسطر عن مطار مسقط الدولي.\nالإجابة النموذجية: تقرير يذكر الموقع والمرافق والخدمات والطاقة الاستيعابية بلغة سليمة"], ["الواجب المنزلي", "اكتب ثلاثة توجيهات تقدمها لمسافر يسافر أول مرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=35"]]}, {"no": 65, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التحدث: مناقشة نص مقروء (اللغز)", "k": 1, "n": 2, "wi": 2, "wn": 7, "pages": "79-80", "f": [["عنوان الدرس", "التحدث: مناقشة نص مقروء (اللغز)"], ["نواتج التعلم", "1. يقرأ نص اللغز ويصف أدوات التجربة (15 دقيقة)\n2. يطرح أسئلة حول اللغز ويناقشها مع زملائه (15 دقيقة)\n3. يتحدث بلغة فصيحة منظمة مستعملًا المهارات المساندة (10 دقائق)"], ["الاستراتيجيات", "كرات الثلج\nالشريك الموسمي\nالعرض العملي"], ["مصادر التعلم", "كتاب الطالب ص79\nكأس ماء وملح وثلاث بيضات\nجهاز عرض"], ["التهيئة (5 دقائق)", "- لغز على السبورة: استخرج أسماء أربعة حيوانات من كلمة (قرنبيط)\n- الوصول إلى فكرة الألغاز العلمية"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة والتجربة: قراءة نص اللغز دقيقتين تنفيذ التجربة أمام؛ ملاحظة: الأولى غرقت، والثانية في المنتصف، والثالثة طفا جزء منها، والطالب: كأس ماء حتى ثلثيه وملعقة ملح وثلاث بيضات (10 دقائق)\nالاستراتيجيات: كرات الثلج.\n\n2. الشريك الموسمي: يختار كل طالب شريكًا بموسم (صيف، شتاء...) ويعدان معًا أسئلة عن الأدوات والملاحظات؛ عرض الأسئلة شفهيًا وتبادل الإجابات (10 دقائق)\nالاستراتيجيات: الشريك الموسمي.\n\n3. الغلق: كرات الثلج: كل طالب يكتب سؤالًا على ورقة ويكورها ويرميها لزميل يجيب عنها (3 دقائق)\nالاستراتيجيات: العرض العملي."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) عدد أدوات التجربة.\nالإجابة النموذجية: كأس فيه ماء حتى ثلثيه، وملعقة ملح، وثلاث بيضات متشابهة\n2) (تطبيق) ماذا حدث للبيضة الأولى؟\nالإجابة النموذجية: غرقت ونزلت إلى قعر الكأس\n3) (استدلال) صغ سؤالًا عن اللغز تطرحه على زميلك.\nالإجابة النموذجية: مثل: لماذا لم تتصرف البيضات الثلاث بالطريقة نفسها مع أنها متشابهة؟"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف ما حدث للبيضة الثالثة.\nالإجابة النموذجية: طفا جزء منها فوق سطح الماء\n2) (تطبيق) ما الذي أذابه الرجل في الماء؟\nالإجابة النموذجية: ملعقة من الملح\n3) (استدلال) تحدث في دقيقة عن ملاحظاتك على التجربة بلغة فصيحة.\nالإجابة النموذجية: حديث منظم: الأدوات، الخطوات، الملاحظات"], ["الواجب المنزلي", "فكّر في سبب اختلاف البيضات واكتب توقعك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=36"]]}, {"no": 66, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التحدث: مناقشة نص مقروء (اللغز)", "k": 2, "n": 2, "wi": 3, "wn": 7, "pages": "79-80", "f": [["عنوان الدرس", "التحدث: مناقشة نص مقروء (اللغز)"], ["نواتج التعلم", "1. يربط بين التجربة والحقائق العلمية المستنتجة (15 دقيقة)\n2. يعرض حل اللغز منظمًا أمام زملائه (5 دقائق)\n3. يتحدث عن طرق علمية أخرى لفحص البيض (20 دقيقة)"], ["الاستراتيجيات", "الشريك الموسمي\nالعرض الشفهي\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص80\nأدوات التجربة\nجهاز عرض"], ["التهيئة (5 دقائق)", "- استرجاع ملاحظات التجربة\n- عرض التوقعات التي كتبها الطلبة"], ["إجراءات التنفيذ (23 دقيقة)", "1. حل اللغز: البيضة الطازجة أثقل لصغر الفراغ الهوائي داخلها فتغرق؛ البيضة الأقل طزاجة يكبر فراغها الهوائي فتبقى في المنتصف؛ البيضة القديمة يكبر فراغها كثيرًا فتطفو؛ الملح يزيد كثافة الماء فيوضح الفروق (10 دقائق)\nالاستراتيجيات: الشريك الموسمي.\n\n2. العرض والتوسع: كل شريكين يعرضان الحل وفق الترتيب (أ، ب، ج)؛ التحدث عن طرق أخرى: رج البيضة وسماع صوت داخلها، فحصها أمام ضوء قوي، كسرها وملاحظة تماسك صفارها وبياضها (8 دقائق)\nالاستراتيجيات: العرض الشفهي.\n\n3. غلق الدرس – لغز من البيئة العمانية: تؤلف كل مجموعة لغزًا علميًا قصيرًا عن ظاهرة من البيئة العمانية، كجريان ماء الفلج أو برودة الماء في الجحلة الفخارية، وتطرحه على مجموعة أخرى لتفسيره (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) لماذا غرقت البيضة الأولى؟\nالإجابة النموذجية: لأنها طازجة ثقيلة وفراغها الهوائي صغير\n2) (تطبيق) لماذا بقيت الثانية في منتصف الكأس؟\nالإجابة النموذجية: لأنها أقل طزاجة، ففراغها الهوائي أكبر قليلًا\n3) (استدلال) لماذا طفت الثالثة؟\nالإجابة النموذجية: لأنها قديمة كبر فراغها الهوائي فأصبحت أخف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما فائدة إذابة الملح في الماء؟\nالإجابة النموذجية: يزيد كثافة الماء فيساعد على إظهار الفرق بين البيضات\n2) (تطبيق) اذكر طريقة أخرى لفحص البيض.\nالإجابة النموذجية: فحصها أمام ضوء قوي، أو كسرها وملاحظة تماسك صفارها\n3) (استدلال) اعرض حلك للغز في دقيقة بلغة فصيحة.\nالإجابة النموذجية: عرض منظم يربط كل ملاحظة بسببها"], ["الواجب المنزلي", "اكتب الحل العلمي للغز في خمسة أسطر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=36"]]}, {"no": 67, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 1, "n": 4, "wi": 4, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية بطلاقة (5 دقائق)\n2. ينطق الأعلام والتواريخ نطقًا صحيحًا (عباس بن فرناس، الأخوان رايت، أورفيل، ويلبور) (25 دقيقة)\n3. يتعرف الكاتب عبد الفتاح خطاب ونوع النص (علمي) (10 دقائق)"], ["الاستراتيجيات", "مسرح العرائس\nالقراءة النموذجية والمحاكاة\nمسابقة القارئ المتألق"], ["مصادر التعلم", "كتاب الطالب ص81-84\nصور لوسائل النقل قديمًا وحديثًا\nجهاز عرض"], ["التهيئة (5 دقائق)", "- سؤال الكتاب: هل تحب مراقبة الطيور وهي تحلق؟ هل تحلم بالطيران مثلها؟\n- مشهد قصير بالعرائس بين عباس بن فرناس وصاحبه"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة النموذجية: قراءة نموذجية مع إبراز العناوين الفرعية (البدايات، الحلم، الأخوان الشريكان، التجارب العديدة، الحلم يتحقق)؛ نطق التواريخ: 1878، 1899، 1902، 1903، 1905 (10 دقائق)\nالاستراتيجيات: مسرح العرائس.\n\n2. قراءات: قراءة كل طالب فقرة تحت عنوان فرعي، تصويب الأخطاء (10 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة.\n\n3. الغلق: سؤال للتفكير: ما الحلم الذي تريد تحقيقه؟ (3 دقائق)\nالاستراتيجيات: مسابقة القارئ المتألق."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) من العربي الذي حاول الطيران؟\nالإجابة النموذجية: عباس بن فرناس الأندلسي\n2) (تطبيق) من أول من صنع طائرة قادرة على الطيران؟\nالإجابة النموذجية: الأخوان (رايت) الأمريكيان\n3) (استدلال) ما اللعبة التي أحضرها الوالد للمنزل؟\nالإجابة النموذجية: حوّامة خشبية صغيرة ترتفع في الهواء إذا شُدّ رباطها المطاطي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم عنوانًا فرعيًا في النص؟ وما فائدتها؟\nالإجابة النموذجية: خمسة، وتنظم أفكار النص العلمي وتسهل فهمه\n2) (تطبيق) من كاتب النص؟\nالإجابة النموذجية: عبد الفتاح خطاب، من كتاب (قصة الطيران)\n3) (استدلال) اقرأ فقرة (الحلم يتحقق) قراءة معبرة.\nالإجابة النموذجية: قراءة سليمة"], ["الواجب المنزلي", "تدرّب على قراءة النص واكتب التواريخ الواردة فيه بالحروف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 68, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 2, "n": 4, "wi": 5, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يناقش المفردات الجديدة من حيث المفرد والجمع والمرادف والمضاد (15 دقيقة)\n2. يصنف المفردات إلى معجم الطيران (5 دقائق)\n3. يقسم الدرس إلى أفكاره الجزئية (20 دقيقة)"], ["الاستراتيجيات", "شجرة الذاكرة\nخارطة المفاهيم\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص85-86\nمجسم شجرة\nقصاصات ورقية"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع تحديد المفردات الجديدة"], ["إجراءات التنفيذ (23 دقيقة)", "1. المفردات: تكوين كلمات من (ح ل م): حلم، حِلْم، حليم، حُلُم؛ كلمة بمعنى المبتكر في الفقرة الأولى: المخترع؛ اشطب ما لا ينتمي لمعجم الطيران: غواصة، قاطرة، زورق؛ مرادفات: يراوده، ينال، معاناة (10 دقائق)\nالاستراتيجيات: شجرة الذاكرة.\n\n2. الأفكار الجزئية: شجرة الذاكرة: جذعها الفكرة العامة وأغصانها الأفكار: محاولات الإنسان القديمة، لعبة الحوامة وبداية الحلم، تعاون الأخوين ودراسة مشكلة التحكم، التجارب والإخفاق، تحقق الحلم (10 دقائق)\nالاستراتيجيات: خارطة المفاهيم.\n\n3. الغلق: عرض شجرة الذاكرة المكتملة (3 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: قصة تحقيق حلم الإنسان بالطيران على يد الأخوين رايت\n2) (تطبيق) استخرج كلمة بمعنى (المبتكر).\nالإجابة النموذجية: المخترع\n3) (استدلال) أي الكلمات لا تنتمي لمعجم الطيران: (حوامة، قاطرة، التحليق)؟\nالإجابة النموذجية: قاطرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كوّن كلمتين من الحروف (ح ل م) بمعنيين مختلفين.\nالإجابة النموذجية: حُلْم (ما يراه النائم) وحِلْم (الأناة وضبط النفس)\n2) (تطبيق) ما الفكرة الجزئية لفقرة (الأخوان الشريكان)؟\nالإجابة النموذجية: تعاون الأخوين وتوصلهما إلى أن مشكلة الطيران الأساسية هي التحكم\n3) (استدلال) ضع (يراوده) في جملة.\nالإجابة النموذجية: مثل: يراودني حلم أن أصبح طبيبًا"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 69, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 3, "n": 4, "wi": 6, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يبين مراحل اختراع الطائرة بترتيب زمني (15 دقيقة)\n2. يوضح المنهج العلمي الذي اتبعه الأخوان رايت (5 دقائق)\n3. يحدد مشكلات التحكم الثلاث وحلولها (20 دقيقة)"], ["الاستراتيجيات", "منظم معرفي (حل المشكلات)\nخط الزمن\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص83-87\nمنظم حل المشكلات\nالسبورة التفاعلية"], ["التهيئة (5 دقائق)", "سؤال: لماذا فشلت محاولات كثيرة قبل الأخوين رايت؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. المراحل: خط زمني: 1878 لعبة الحوامة، الطائرات الورقية ونظرية الأجنحة المقوسة، 1899 نجاح تجربة التحكم بالأسلاك، ثلاث سنوات من التجارب على الطائرات الشراعية، 1902 طائرة شراعية بمحرك بخاري نحو 300 كغ، 1903 قيادة الطائرة، 1905 طيران أكثر من نصف ساعة (10 دقائق)\nالاستراتيجيات: منظم معرفي (حل المشكلات).\n\n2. المنهج العلمي: منظم حل المشكلات: المشكلة (التحكم)، الملاحظة (مراقبة الطيور تحني جناحًا لأعلى وآخر لأسفل)، الفرضية، التجربة، التسجيل والتصوير، التعديل، النتيجة؛ حركات التحكم الثلاث: التحايل، التأرجح، الانعراج (10 دقائق)\nالاستراتيجيات: خط الزمن.\n\n3. الغلق: كل مجموعة تلخص المنهج العلمي في ثلاث كلمات (3 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما نظرية أورفيل الأولى في الطيران؟\nالإجابة النموذجية: الأجنحة المقوسة أفضل من الأجنحة المسطحة\n2) (تطبيق) ما العقبة الأساسية أمام الطيران كما رأى الأخوان؟\nالإجابة النموذجية: مشكلة التحكم في الطائرة\n3) (استدلال) ماذا لاحظ الأخوان عند مراقبة الطيور؟\nالإجابة النموذجية: أنها تدور في الهواء بحني جناح إلى الأعلى والآخر إلى الأسفل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (طائرة تطير نصف ساعة – لعبة الحوامة – نجاح تجربة التحكم – طائرة شراعية بمحرك).\nالإجابة النموذجية: لعبة الحوامة، نجاح تجربة التحكم، طائرة شراعية بمحرك، طائرة تطير نصف ساعة\n2) (تطبيق) ما المقصود بحركة (الانعراج)؟\nالإجابة النموذجية: توجيه الطائرة إلى اليمين أو إلى اليسار\n3) (استدلال) اذكر خطوتين من المنهج العلمي الذي اتبعه الأخوان.\nالإجابة النموذجية: الملاحظة (مراقبة الطيور)، والتجربة مع تسجيل الملاحظات وتصويرها والتعديل"], ["الواجب المنزلي", "ارسم خطًا زمنيًا لمراحل اختراع الطائرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 70, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 4, "n": 4, "wi": 7, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يحدد خصائص النص العلمي (15 دقيقة)\n2. يستخلص القيم الإيجابية من الدرس (15 دقيقة)\n3. يبدي رأيه في موقف ويلبور حين أصابه اليأس (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالحوار والمناقشة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص87-89\nبطاقات خصائص النص\nالسبورة"], ["التهيئة (5 دقائق)", "- قراءة قول ويلبور: (أعتقد أن البشر لن يستطيعوا الطيران ولو بعد ألف عام)\n- سؤال: هل نال اليأس من الأخوين؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. خصائص النص العلمي: الحقائق والمعلومات الدقيقة، التواريخ والأرقام، المصطلحات العلمية (التحايل، التأرجح، الانعراج)، اللغة الواضحة المباشرة، العناوين الفرعية، التسلسل المنطقي (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. القيم: الصبر والمثابرة، التعاون، عدم اليأس، التفكير العلمي، الاستفادة من الطبيعة؛ حل بقية أسئلة الكتاب (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. غلق الدرس – طيارو عمان الصغار: تتخيل كل مجموعة اختراعًا عمانيًا للطيران يكمل حلم عباس بن فرناس والأخوين رايت، كطائرة مسيّرة لرصد مزارع النخيل أو للإنقاذ في الجبال، وتعرضه في دقيقة (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر خاصيتين للنص العلمي.\nالإجابة النموذجية: الحقائق الدقيقة والتواريخ، والمصطلحات العلمية\n2) (تطبيق) استخرج مصطلحًا علميًا من النص.\nالإجابة النموذجية: التحايل، أو التأرجح، أو الانعراج\n3) (استدلال) ما القيمة المستفادة من استعادة الأخوين الأمل بعد الإحباط؟\nالإجابة النموذجية: المثابرة وعدم اليأس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل النص أدبي أم علمي؟ وما الدليل؟\nالإجابة النموذجية: علمي، لاعتماده على الحقائق والتواريخ والمصطلحات واللغة المباشرة\n2) (تطبيق) ما رأيك في عبارة ويلبور عند الإحباط؟\nالإجابة النموذجية: تقبل الآراء المعللة، كأنها لحظة ضعف طبيعية تجاوزها بالإصرار\n3) (استدلال) كيف تستفيد من قصة الأخوين في دراستك؟\nالإجابة النموذجية: بالمثابرة والتعاون وتحويل الفشل إلى تجربة نتعلم منها"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 71, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية: اللازم والمتعدي", "k": 1, "n": 3, "wi": 1, "wn": 7, "pages": "181-184", "f": [["عنوان الدرس", "الأنشطة النحوية: اللازم والمتعدي"], ["نواتج التعلم", "1. يتذكر أركان الجملة الفعلية (15 دقيقة)\n2. يتعرف الفعل اللازم والفعل المتعدي (15 دقيقة)\n3. يميز بينهما في الجمل (10 دقائق)"], ["الاستراتيجيات", "القصة\nفكر - زاوج - شارك\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص181-183\nبطاقات أفعال\nجهاز عرض"], ["التهيئة (5 دقائق)", "- جملتان: (طار الطائرُ) و(صنع الأخوانِ طائرةً)\n- سؤال: أي الجملتين احتاجت إلى كلمة بعد الفاعل لتكتمل؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: أركان الجملة الفعلية: فعل وفاعل؛ الفعل اللازم: يكتفي بفاعله ولا يحتاج إلى مفعول به (نجح، جلس، طار)؛ الفعل المتعدي: يحتاج إلى مفعول به ليتم معناه (صنع، كتب، راقب)؛ أمثلة من نص حلم الطيران (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. التمييز: تصنيف بطاقات أفعال في عمودين؛ اختبار: هل يصح أن نسأل (ماذا؟) بعد الفعل والفاعل؟ (10 دقائق)\nالاستراتيجيات: فكر.\n\n3. الغلق: الدقيقة الواحدة: أكبر عدد من الأفعال المتعدية في دقيقة (3 دقائق)\nالاستراتيجيات: زاوج."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفعل اللازم؟\nالإجابة النموذجية: فعل يكتفي بفاعله ولا يحتاج إلى مفعول به\n2) (تطبيق) ما الفعل المتعدي؟\nالإجابة النموذجية: فعل لا يكتفي بفاعله بل يحتاج إلى مفعول به ليتم معناه\n3) (استدلال) صنف: (راقبَ الأخوانِ الطيورَ).\nالإجابة النموذجية: راقب: فعل متعدٍّ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنف: (نجحت التجربةُ).\nالإجابة النموذجية: نجح: فعل لازم\n2) (تطبيق) هات فعلين لازمين.\nالإجابة النموذجية: مثل: جلس، نام (أو: ذهب، فرح)\n3) (استدلال) كيف تختبر الفعل أهو لازم أم متعدٍّ؟\nالإجابة النموذجية: أسأل بعد الفعل وفاعله: ماذا؟ فإن احتاج الجواب إلى مفعول به فهو متعدٍّ"], ["الواجب المنزلي", "استخرج خمسة أفعال لازمة وخمسة متعدية من نص (وتحقق الحلم بالطيران).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=38"]]}, {"no": 72, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية: اللازم والمتعدي", "k": 2, "n": 3, "wi": 2, "wn": 7, "pages": "181-184", "f": [["عنوان الدرس", "الأنشطة النحوية: اللازم والمتعدي"], ["نواتج التعلم", "1. يستخرج الفعل اللازم والفعل المتعدي من فقرة الكتاب (25 دقيقة)\n2. يعرب الجمل الفعلية إعرابًا صحيحًا (5 دقائق)\n3. يستنتج قاعدة الدرس (10 دقائق)"], ["الاستراتيجيات", "شطيرة الإعراب\nالتعلم التعاوني\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص183-184\nأوراق عمل\nالسبورة"], ["التهيئة (5 دقائق)", "مراجعة سريعة: صنّف خمسة أفعال يقرؤها المعلم"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإعراب: (طارت الطائرةُ): طارت فعل ماض والتاء للتأنيث، الطائرة فاعل مرفوع؛ (صنع الأخوانِ طائرةً): الأخوان فاعل مرفوع بالألف، طائرةً مفعول به منصوب بالفتحة؛ شطيرة الإعراب (10 دقائق)\nالاستراتيجيات: شطيرة الإعراب.\n\n2. القاعدة: استنتاج القاعدة وكتابتها في خريطة مفاهيم: الفعل ← لازم (يكتفي بالفاعل) / متعدٍّ (يحتاج إلى مفعول به)؛ استخراج الأفعال من فقرة الكتاب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: عرض خريطة المفاهيم (3 دقائق)\nالاستراتيجيات: خرائط المفاهيم."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أعرب (التجاربَ) في: (أجرى الأخوانِ التجاربَ).\nالإجابة النموذجية: مفعول به منصوب وعلامة نصبه الفتحة\n2) (تطبيق) ما نوع الفعل (أجرى)؟\nالإجابة النموذجية: متعدٍّ\n3) (استدلال) أعرب (الأخوانِ).\nالإجابة النموذجية: فاعل مرفوع وعلامة رفعه الألف لأنه مثنى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من: (حلم أورفيل بالطيران، وصنع طائرات ورقية) فعلًا لازمًا وفعلًا متعديًا.\nالإجابة النموذجية: حلم: لازم، صنع: متعدٍّ\n2) (تطبيق) أعرب: (نجحَ المخترعُ).\nالإجابة النموذجية: نجح فعل ماض مبني على الفتح، المخترع فاعل مرفوع بالضمة\n3) (استدلال) اكتب القاعدة في جملتين.\nالإجابة النموذجية: الفعل اللازم يكتفي بفاعله، والمتعدي يحتاج إلى مفعول به ليتم معناه"], ["الواجب المنزلي", "أعرب ثلاث جمل من التدريبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=38"]]}, {"no": 73, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية: اللازم والمتعدي", "k": 3, "n": 3, "wi": 3, "wn": 7, "pages": "181-184", "f": [["عنوان الدرس", "الأنشطة النحوية: اللازم والمتعدي"], ["نواتج التعلم", "1. يحوّل جملًا من اللازم إلى المتعدي بإضافة مفعول مناسب أو العكس بتغيير الفعل (5 دقائق)\n2. يصوغ فقرة تحوي أفعالًا لازمة ومتعدية (15 دقيقة)\n3. يصحح أخطاء تصنيف الأفعال (20 دقيقة)"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم التبادلي\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص184\nأوراق كتابة\nبطاقات تصحيح"], ["التهيئة (5 دقائق)", "لعبة: المعلم يذكر فعلًا والطالب يكمله بجملة صحيحة"], ["إجراءات التنفيذ (23 دقيقة)", "1. التوظيف: كتابة فقرة من أربع جمل عن مخترع تحبه فيها فعلان لازمان وفعلان متعديان؛ وضع خط تحت الأفعال وتصنيفها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التصحيح: تبادل الفقرات وتصحيح التصنيف؛ حل تدريبات الكتاب المتبقية (8 دقائق)\nالاستراتيجيات: التقويم التبادلي.\n\n3. غلق الدرس – أفعال الصياد العماني: تكتب كل مجموعة أفعالًا من يوم صياد عماني، مثل «أبحرَ» و«رمى الشبكةَ» و«عادَ» و«باعَ السمكَ»، وتصنفها إلى لازمة ومتعدية في سباق زمني مع تحديد المفعول به (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أكمل بمفعول به: (اخترع ماركوني .......).\nالإجابة النموذجية: جهازًا لاسلكيًا\n2) (تطبيق) هل يصح: (جلس الطالبُ الكرسيَّ)؟ ولماذا؟\nالإجابة النموذجية: لا يصح، لأن جلس لازم لا يحتاج إلى مفعول به، والصواب: جلس الطالب على الكرسي\n3) (استدلال) صحح التصنيف: (فرح) فعل متعدٍّ.\nالإجابة النموذجية: فرح فعل لازم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب جملتين عن العلم: إحداهما فعلها لازم والأخرى متعدٍّ.\nالإجابة النموذجية: مثل: تقدّم العلمُ / ينفعُ العلمُ الناسَ\n2) (تطبيق) استخرج من فقرة زميلك فعلًا متعديًا ومفعوله.\nالإجابة النموذجية: تقبل الإجابة الصحيحة\n3) (استدلال) ما الفرق بين (رجع المسافرُ) و(أرجع المسافرُ الكتابَ)؟\nالإجابة النموذجية: الأول فعل لازم، والثاني متعدٍّ نصب مفعولًا به"], ["الواجب المنزلي", "اكتب فقرة من خمسة أسطر عن اختراع تحبه فيها أفعال لازمة ومتعدية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=38"]]}, {"no": 74, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الإملائية: الهمزة المتوسطة على الواو", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "185-187", "f": [["عنوان الدرس", "الأنشطة الإملائية: الهمزة المتوسطة على الواو"], ["نواتج التعلم", "1. يذكر مواضع كتابة الهمزة المتوسطة على الواو (15 دقيقة)\n2. يعلل كتابة الهمزة على الواو (15 دقيقة)\n3. يكتب كلمات فيها همزة متوسطة على واو كتابة صحيحة (10 دقائق)"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتعلم التعاوني\nبطاقات التصنيف"], ["مصادر التعلم", "كتاب الطالب ص185-187\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "- عرض كلمات: مؤمن، يؤدي، سُؤال، رؤوس\n- سؤال: على أي حرف كتبت الهمزة؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستنتاج: مواضع الهمزة المتوسطة على الواو: مضمومة بعد فتح (يقرَؤُون، تفاؤُل)، مضمومة بعد ضم (رُؤُوس)، مضمومة بعد سكون (التشاؤُم)، مفتوحة بعد ضم (مُؤَذّن، سُؤَال)، ساكنة بعد ضم (مُؤْمن، يُؤْدي)؛ القاعدة: الضمة أقوى من الفتحة والسكون (10 دقائق)\nالاستراتيجيات: الاستقصاء الموجه.\n\n2. التطبيق: تصنيف بطاقات حسب الموضع مع التعليل؛ إملاء كلمات قصيرة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – مؤسسات وطني: تجمع المجموعات كلمات فيها همزة متوسطة على واو ترتبط بالوطن، مثل «مؤسسة» و«مسؤول» و«يؤدي الواجب»، وتؤلف بها جملة عن خدمة عمان، وتعلل كتابة الهمزة (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) علل كتابة الهمزة على واو في (مُؤْمن).\nالإجابة النموذجية: لأنها ساكنة وما قبلها مضموم، والضمة أقوى فتكتب على واو\n2) (تطبيق) علل كتابتها على واو في (سُؤَال).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها مضموم والضمة أقوى\n3) (استدلال) اكتب الهمزة: (ي_دي، ر_وس).\nالإجابة النموذجية: يؤدي، رؤوس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث كلمات همزتها متوسطة على واو.\nالإجابة النموذجية: مثل: فؤاد، لؤلؤة، مسؤول\n2) (تطبيق) صحح: (مأمن بمعنى المؤمن، سئال).\nالإجابة النموذجية: مؤمن، سؤال\n3) (استدلال) اكتب جملة فيها كلمتان بهمزة متوسطة على واو.\nالإجابة النموذجية: مثل: يؤدي المؤمن صلاته في وقتها"], ["الواجب المنزلي", "اجمع عشر كلمات بهمزة متوسطة على واو من الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=39"]]}, {"no": 75, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "خط الرقعة: (م، هـ)", "k": 1, "n": 1, "wi": 5, "wn": 7, "pages": "188", "f": [["عنوان الدرس", "خط الرقعة: (م، هـ)"], ["نواتج التعلم", "1. يرسم حرفي الميم والهاء مجردين بخط الرقعة (5 دقائق)\n2. يكتب الحرفين في أول الكلمة ووسطها وآخرها (25 دقيقة)\n3. يكتب جملة بالرقعة مراعيًا قواعد الرسم (10 دقائق)"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص188\nأقلام مشطوفة\nأوراق ملاحظات"], ["التهيئة (5 دقائق)", "مقارنة أشكال الهاء الأربعة في النسخ مع الرقعة"], ["إجراءات التنفيذ (23 دقيقة)", "1. النمذجة: الميم المتطرفة رأس صغير مطموس وذيل قصير ينزل تحت السطر؛ الهاء في أول الكلمة (هدف) ووسطها (فهم) وآخرها متصلة ومنفصلة (وجهه، وجه)؛ أمثلة: مسجد، علم، مهندس، وطنه (10 دقائق)\nالاستراتيجيات: ورق الملاحظات.\n\n2. المحاكاة في الكتاب والتصويب بورق الملاحظات؛ كتابة جملة الكتاب (8 دقائق)\nالاستراتيجيات: النمذجة والمحاكاة.\n\n
