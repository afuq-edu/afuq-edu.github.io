wi": 4, "wn": 7, "pages": "59-63", "f": [["عنوان الدرس", "الدرس الثاني: جنة عمان"], ["نواتج التعلم", "1. يستخرج الفكرة العامة والوحدات المعنوية للنص\n2. يبين مظاهر جمال محافظة ظفار كما صورها الشاعر\n3. يصنف ألفاظ النص في الحقل المعجمي للطبيعة"], ["الاستراتيجيات", "ثلاثة أسئلة + واحد\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص60-62\nبطاقات أسئلة\nالموسوعة العمانية (المجلد السادس)"], ["التهيئة (5 دقائق)", "تسميع بعض الأبيات المحفوظة"], ["إجراءات التنفيذ (20 دقيقة)", "ثلاثة أسئلة + واحد (10 دقائق):\n- سؤال 1: مظاهر الطبيعة التي تغنى بها الشاعر\n- سؤال 2: صف صلالة ومظاهر الجمال فيها\n- سؤال 3: ماذا أضاف باني عمان لسمات المكان؟\n- السؤال العام: الوحدات المعنوية الثلاث\n\nالوحدات والحقل المعجمي (10 دقائق):\n- الأبيات 1-3: إعجاب الشاعر بظفار وأيامه القصار فيها\n- 4-6: جمال صلالة\n- 7-10: فضل جلالة السلطان قابوس على عمان\n- استخراج ألفاظ الطبيعة: الروض، الأزهار، الماء، حدائق، ورد، جلنار"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: التغني بجمال ظفار وصلالة وفضل باني عمان عليها\n2) (تطبيق) اذكر مظهرين من مظاهر الطبيعة في ظفار كما في النص.\nالإجابة النموذجية: الرياض المليئة بالأزهار المشرقة، والهواء الصافي كصفو الماء\n3) (استدلال) ما الوحدة المعنوية للأبيات (7-10)؟\nالإجابة النموذجية: فضل جلالة السلطان قابوس -طيب الله ثراه- على عمان وازدهارها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من النص ثلاث كلمات من حقل الطبيعة.\nالإجابة النموذجية: الروض، الأزهار، حدائق (أو: ورد، جلنار، الماء)\n2) (تطبيق) بمَ قارن الشاعر جمال ظفار بمكان مشهور؟\nالإجابة النموذجية: قارنها بربى لبنان وفضّل ظفار عليها\n3) (استدلال) لماذا ختم الشاعر قصيدته بذكر السلطان قابوس؟\nالإجابة النموذجية: لأن نهضة البلاد وازدهارها من صنعه فأراد أن يشكره ويفخر به"], ["الغلق (3 دقائق)", "ورقة خروج: أجمل صفة لظفار في رأيي هي..."], ["الواجب المنزلي", "ابحث في الموسوعة العمانية عن ثلاث معلومات عن صلالة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=25"]]}, {"no": 47, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثاني: جنة عمان", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "59-63", "f": [["عنوان الدرس", "الدرس الثاني: جنة عمان"], ["نواتج التعلم", "1. يناقش الصور الجمالية في النص وأثرها في المعنى\n2. يلخص السمات العامة للنص الشعري\n3. يستنبط القيم المستفادة من النص"], ["الاستراتيجيات", "التعلم التعاوني\nالحوار والمناقشة\nالمشروع المصغر"], ["مصادر التعلم", "كتاب الطالب ص62-63\nخامات من البيئة وأوراق ملونة\nجهاز عرض"], ["التهيئة (5 دقائق)", "عرض صورة لأزهار الجلنار (زهر الرمان) وسؤال: كيف استعملها الشاعر في الصورة؟"], ["إجراءات التنفيذ (20 دقيقة)", "الصور الجمالية (10 دقائق):\n- تشبيه هواء ظفار بصفو الماء في لطفه\n- تصوير الروضات تفاخر جنة الخلد\n- تصوير الورد يعانق الجلنار\n- تصوير القصور (الأشجار العظيمة أو الجبال) تكاد تساير الفلك\n- أثرها: تقريب الجمال وإثارة الإعجاب\n\nالسمات والقيم (10 دقائق):\n- السمات: الوزن والقافية الموحدة (الراء الممدودة)، العاطفة الوطنية، الألفاظ الموحية من الطبيعة، الصور الكثيرة\n- القيم: حب الوطن، الاعتزاز بجماله، الوفاء لقادته، المحافظة على المعالم السياحية"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) وضّح الصورة في تشبيه الهواء بصفو الماء.\nالإجابة النموذجية: شبه لطف هواء ظفار ونقاءه بالماء الصافي، فيوحي بالرقة والانتعاش\n2) (تطبيق) ما العاطفة المسيطرة على الشاعر؟\nالإجابة النموذجية: الإعجاب بجمال ظفار والحب للوطن والفخر به\n3) (استدلال) استخرج قيمة من النص.\nالإجابة النموذجية: حب الوطن والاعتزاز بجماله (أو: الوفاء لقادته)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر سمتين للنص الشعري.\nالإجابة النموذجية: الوزن والقافية الموحدة، والصور الجمالية المستمدة من الطبيعة\n2) (تطبيق) ما الحرف الذي انتهت به الأبيات (الروي)؟\nالإجابة النموذجية: الراء\n3) (استدلال) صمم بالتعاون مع مجموعتك إعلانًا سياحيًا قصيرًا لصلالة.\nالإجابة النموذجية: إعلان قصير بعبارة جذابة يذكر مظهرين من جمالها"], ["الغلق (3 دقائق)", "عرض أعمال المجموعات (إعلان، لوحة، فقرة نثرية) وتعزيزها"], ["الواجب المنزلي", "اكتب فقرة نثرية من خمسة أسطر تصف صلالة في الخريف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=25"]]}, {"no": 48, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: نائب الفاعل", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "160-164", "f": [["عنوان الدرس", "الأنشطة النحوية: نائب الفاعل"], ["نواتج التعلم", "1. يتعرّف مفهوم نائب الفاعل\n2. يحدد نائب الفاعل في الجمل المبنية للمجهول\n3. يتعرف حكمه الإعرابي (مرفوع)"], ["الاستراتيجيات", "القصة\nأقطاب المغناطيس\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص160-162\nبطاقات حمراء وزرقاء\nجهاز عرض"], ["التهيئة (5 دقائق)", "- قصة قصيرة: الفاعل اعتذر عن الحضور فناب عنه المفعول به وحمل علامته (الضمة)\n- سؤال: ماذا نسمي من ينوب عن غيره؟"], ["إجراءات التنفيذ (20 دقيقة)", "الاستكشاف (10 دقائق):\n- أمثلة: نُقِلَ المصابُ إلى المستشفى، كُتِبَت الرسالةُ، يُحتَرَمُ المعلمُ\n- تحديد الاسم المرفوع بعد الفعل المبني للمجهول\n- استنتاج: نائب الفاعل اسم مرفوع يأتي بعد الفعل المبني للمجهول ويحل محل الفاعل المحذوف\n\nالتحديد (10 دقائق):\n- أقطاب المغناطيس: فعل مبني للمجهول ونائب فاعله\n- استخراج نائب الفاعل من فقرة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما نائب الفاعل؟\nالإجابة النموذجية: اسم مرفوع يأتي بعد الفعل المبني للمجهول ويحل محل الفاعل المحذوف\n2) (تطبيق) حدد نائب الفاعل: (افتُتِحَ الجامعُ عام 2001م).\nالإجابة النموذجية: الجامعُ\n3) (استدلال) ما أصل نائب الفاعل في الغالب؟\nالإجابة النموذجية: المفعول به في الجملة المبنية للمعلوم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حدد نائب الفاعل: (تُزرَعُ الأشجارُ في الربيع).\nالإجابة النموذجية: الأشجارُ\n2) (تطبيق) ما حكم نائب الفاعل الإعرابي؟\nالإجابة النموذجية: مرفوع\n3) (استدلال) استخرج نائب الفاعل من جملة من نص (منارة عمانية).\nالإجابة النموذجية: مثل: كُتبت الآياتُ ← الآياتُ نائب فاعل"], ["الغلق (3 دقائق)", "كل طالب يكوّن جملة فيها نائب فاعل عن مدرسته"], ["الواجب المنزلي", "استخرج خمسة نواب فاعل من نصوص الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=26"]]}, {"no": 49, "w": 7, "wl": "السابع", "date": "18-22 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: نائب الفاعل", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "160-164", "f": [["عنوان الدرس", "الأنشطة النحوية: نائب الفاعل"], ["نواتج التعلم", "1. يعرب نائب الفاعل إعرابًا صحيحًا بعلاماته المختلفة\n2. يحوّل جملًا مبنية للمعلوم إلى المجهول ويحدد نائب الفاعل\n3. يصوغ أمثلة تطبيقية على الجملة المبنية للمجهول"], ["الاستراتيجيات", "شطيرة الإعراب\nالتعلم التعاوني\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص162-164\nأوراق شطيرة الإعراب\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال سريع: حوّل (حفظَ الطالبُ القصيدةَ) إلى المجهول وحدد نائب الفاعل"], ["إجراءات التنفيذ (20 دقيقة)", "الإعراب (10 دقائق):\n- نماذج: (كُرِّمَ المتفوقون): نائب فاعل مرفوع بالواو\n- (سُمِعَت النقراتُ): مرفوع بالضمة\n- (يُكرَّمُ الفائزان): مرفوع بالألف\n- شطيرة الإعراب لكل نموذج\n\nالتطبيق (10 دقائق):\n- تحويل جمل الكتاب وتحديد نائب الفاعل وإعرابه\n- كل مجموعة تصوغ ثلاث جمل عن الوطن مبنية للمجهول\n- تبادل وتصحيح"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أعرب (المتفوقون) في: (كُرِّمَ المتفوقون).\nالإجابة النموذجية: نائب فاعل مرفوع وعلامة رفعه الواو لأنه جمع مذكر سالم\n2) (تطبيق) حوّل: (رفعَ الطلابُ العلمَ) وحدد نائب الفاعل.\nالإجابة النموذجية: رُفِعَ العلمُ، والعلمُ نائب فاعل\n3) (استدلال) أعرب (الفائزان) في: (يُكرَّمُ الفائزان).\nالإجابة النموذجية: نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب: (سُمِعَت النقراتُ).\nالإجابة النموذجية: سمعت: فعل ماض مبني للمجهول والتاء للتأنيث، النقرات: نائب فاعل مرفوع بالضمة\n2) (تطبيق) صغ جملة مبنية للمجهول نائب فاعلها جمع مؤنث سالم.\nالإجابة النموذجية: مثل: نُظِّمت المسابقاتُ في المدرسة\n3) (استدلال) ميّز الفاعل من نائب الفاعل: (حضرَ الضيوفُ) / (أُكرِمَ الضيوفُ).\nالإجابة النموذجية: الأولى: الضيوف فاعل، الثانية: الضيوف نائب فاعل"], ["الغلق (3 دقائق)", "تلخيص القاعدة: الفعل المبني للمجهول + نائب فاعل مرفوع"], ["الواجب المنزلي", "حل تدريبات الكتاب المتبقية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=26"]]}, {"no": 50, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "165-166", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)"], ["نواتج التعلم", "1. يذكر مواضع كتابة الهمزة المتوسطة على الألف\n2. يعلل كتابة الهمزة على الألف في كلمات معطاة\n3. يكتب الهمزة المتوسطة على الألف كتابة صحيحة"], ["الاستراتيجيات", "التعلم التعاوني\nبطاقات التصنيف\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص165-166\nبطاقات كلمات ناقصة الهمزة\nالسبورة"], ["التهيئة (5 دقائق)", "الدقيقة الواحدة: اكتب أكبر عدد من الكلمات فيها همزة متوسطة على ألف"], ["إجراءات التنفيذ (20 دقيقة)", "المراجعة (10 دقائق):\n- مراجعة قاعدة الحركات (الكسرة، الضمة، الفتحة، السكون)\n- المواضع: مفتوحة بعد فتح (سَأَل)، مفتوحة بعد ساكن صحيح (يَسْأَل)، ساكنة بعد فتح (يَأْخُذ)\n\nالتطبيق (10 دقائق):\n- حل التدريب الأول والثاني في الكتاب\n- بطاقات كلمات ناقصة الهمزة تكملها المجموعات مع التعليل"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) علل كتابة الهمزة على ألف في (يَأْمُل).\nالإجابة النموذجية: لأنها ساكنة وما قبلها مفتوح فتكتب على الألف\n2) (تطبيق) علل كتابتها على ألف في (مَسْأَلة).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها ساكن صحيح فتكتب على الألف\n3) (استدلال) اكتب الهمزة: (ر_ي، ت_مل).\nالإجابة النموذجية: رأي، تأمل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث كلمات تختلف فيها أسباب كتابة الهمزة على ألف.\nالإجابة النموذجية: مثل: سأل (فتح بعد فتح)، يسأل (فتح بعد سكون)، رأس (سكون بعد فتح)\n2) (تطبيق) صحح: (يئخذ، فئر).\nالإجابة النموذجية: يأخذ، فأر\n3) (استدلال) اكتب جملة عن الوطن فيها كلمتان بهمزة متوسطة على ألف.\nالإجابة النموذجية: مثل: نتأمل جمال بلادنا ونسأل الله أن يحفظها"], ["الغلق (3 دقائق)", "تصحيح جماعي وتعزيز"], ["الواجب المنزلي", "حل تدريبات الكتاب المتبقية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=27"]]}, {"no": 51, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "165-166", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على ألف)"], ["نواتج التعلم", "1. يوظف كلمات فيها همزة متوسطة على الألف في جمل من إنشائه\n2. يميز الهمزة المتوسطة على ألف من الهمزة على غيرها\n3. يكتب فقرة إملائية قصيرة دون أخطاء في الهمزة"], ["الاستراتيجيات", "التعلم التعاوني\nالإملاء المنظور\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص166\nفقرة قصيرة على جهاز العرض\nدفاتر الإملاء"], ["التهيئة (5 دقائق)", "لعبة: المعلم ينطق كلمة والطالب يرفع بطاقة (ألف / واو / ياء) حسب كتابة همزتها"], ["إجراءات التنفيذ (20 دقيقة)", "التمييز (10 دقائق):\n- كلمات متنوعة: سأل، سُئل، يؤمن، رأس، بئر، مؤذن\n- تصنيف حسب كرسي الهمزة مع التعليل\n\nالإملاء المنظور (10 دقائق):\n- عرض فقرة قصيرة دقيقة ثم إخفاؤها وكتابتها\n- تصحيح ذاتي\n- توظيف الكلمات في جمل"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) صنف الهمزة: (مُؤذّن).\nالإجابة النموذجية: على واو لأنها مفتوحة وما قبلها مضموم والضمة أقوى\n2) (تطبيق) صنف الهمزة: (يَأْكُل).\nالإجابة النموذجية: على ألف لأنها ساكنة وما قبلها مفتوح\n3) (استدلال) اكتب كلمة همزتها على ألف وأخرى على نبرة.\nالإجابة النموذجية: مثل: سأل / سُئِل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) وظف كلمة (تأمّل) في جملة.\nالإجابة النموذجية: مثل: تأمّلت النجوم في ليلة صافية\n2) (تطبيق) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم دقة الكتابة\n3) (استدلال) ما القاعدة العامة لكتابة الهمزة المتوسطة؟\nالإجابة النموذجية: تُكتب على ما يناسب أقوى الحركتين: حركتها وحركة ما قبلها"], ["الغلق (3 دقائق)", "عرض الأخطاء الشائعة وتصويبها"], ["الواجب المنزلي", "اكتب خمس جمل تتضمن كلمات بهمزة متوسطة على ألف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=27"]]}, {"no": 52, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "خط الرقعة: (ك، ن)", "k": 1, "n": 1, "wi": 3, "wn": 7, "pages": "167", "f": [["عنوان الدرس", "خط الرقعة: (ك، ن)"], ["نواتج ا , "الأساليب (10 دقائق):\n- التعبير عن الشعور بالتسمية (شعرت بالفخر)، وبأثره في الجسد (خفق قلبي، ارتجفت يداي)، وبالتشبيه (طرت فرحًا كالعصفور)، وبالأفعال (قفزت، صرخت)\n- أمثلة من نص (النقرات الثلاث) ونص (في انتظار شانتي): الفرح والقلق عند الإبحار\n\nبنك المشاعر (10 دقائق):\n- جدول: الشعور، ألفاظه، أثره الجسدي، تشبيه مناسب\n- كل مجموعة تكمل صفًا لشعور مختلف"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر أسلوبين للتعبير عن الشعور.\nالإجابة النموذجية: ذكر أثره في الجسد، والتشبيه\n2) (تطبيق) عبّر عن الخوف بأثره في الجسد.\nالإجابة النموذجية: مثل: تسارعت دقات قلبي وارتجفت أطرافي\n3) (استدلال) ما المشاعر المختلطة عند إبحار شانتي في النص؟\nالإجابة النموذجية: فرح البحارة ببدء الإبحار وقلق المودعين على أحبائهم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب تشبيهًا يعبر عن الفخر.\nالإجابة النموذجية: مثل: وقفت شامخًا كالجبل حين رفرف علم بلادي\n2) (تطبيق) صنف: (خرجنا إلى الشاطئ) / (غمرني شعور بالسكينة).\nالإجابة النموذجية: الأولى سرد، والثانية وصف شعور\n3) (استدلال) لماذا يهتم الكاتب بوصف المشاعر في القصة؟\nالإجابة النموذجية: ليشارك القارئ الشخصيات أحاسيسها فيتأثر بالنص"], ["الغلق (3 دقائق)", "كل طالب يكتب كلمة تعبر عن شعوره اليوم ويضعها في لوحة المشاعر"], ["الواجب المنزلي", "اجمع عشر عبارات تصف مشاعر من نصوص الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=29"]]}, {"no": 54, "w": 8, "wl": "الثامن", "date": "25-29 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف مشاعر", "k": 2, "n": 2, "wi": 5, "wn": 7, "pages": "168-170", "f": [["عنوان الدرس", "التعبير: وصف مشاعر"], ["نواتج التعلم", "1. يكتب مقطعًا وصفيًا لمشاعره ضمن نص سردي\n2. يوظف الروابط والأساليب المناسبة للنص الوصفي السردي\n3. يستخدم علامات الترقيم استخدامًا صحيحًا"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص170\nقائمة تقويم\nبنك المشاعر"], ["التهيئة (5 دقائق)", "- موقف: يوم الاحتفال بالعيد الوطني في المدرسة\n- سؤال: بماذا شعرت؟"], ["إجراءات التنفيذ (20 دقيقة)", "التخطيط والكتابة (10 دقا  النموذجية: إجابة مع تعليل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) قدم ملخص كتابك في دقيقتين.\nالإجابة النموذجية: عرض منظم يغطي الموضوع والأفكار والرأي\n2) (تطبيق) قيّم عرض زميل بمعيارين.\nالإجابة النموذجية: ذكر معيارين متحققين أو ناقصين\n3) (استدلال) لماذا نتبادل الكتب بعد القراءة؟\nالإجابة النموذجية: لتعميم الفائدة وتشجيع القراءة"], ["الغلق (3 دقائق)", "إعلان كتاب الأسبوع وحث على الاستمرار في القراءة"], ["الواجب المنزلي", "اقرأ الكتاب الذي اخترته من عرض زميلك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=30"]]}, {"no": 57, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الثالث: في انتظار شانتي", "k": 1, "n": 3, "wi": 1, "wn": 7, "pages": "64-72", "f": [["عنوان الدرس", "الدرس الثالث: في انتظار شانتي"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية بطلاقة\n2. ينطق الأعلام والأماكن العمانية نطقًا صحيحًا (محوت، غبة حشيش، بر الحكمان، خور البطح)\n3. يتعرف الكاتب يونس الأخزمي ونوع النص"], ["الاستراتيجيات", "الدقيقة الواحدة\nالقراءة النموذجية والمحاكاة\nمسابقة قارئ اليوم"], ["مصادر التعلم", "كتاب الطالب ص64-66\nخريطة عمان والعالم لتتبع الرحلة\nصور لسفن عمانية"], ["التهيئة (5 دقائق)", "- الدقيقة الواحدة: عدد أسماء السفن العمانية التي تعرفها\n- عرض صور لسفن (الغنجة، البغلة، البوم)\n- أسئلة اكتشف النص"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة النموذجية (10 دقائق):\n- قراءة نموذجية مع إبراز نطق الأعلام\n- تتبع المسار على الخريطة: محوت ← صور ← جوا في الهند\n- تدريب على نطق: الوستاد، النوخذة، الصواري، تكوير\n\nقراءات الطلبة (10 دقائق):\n- قراءة فقرات متتابعة\n- مسابقة قارئ اليوم\n- تصويب فوري"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من أي شاطئ أبحرت السفينة شانتي؟\nالإجابة النموذجية: من شواطئ محوت\n2) (تطبيق) إلى أين كانت متجهة؟\nالإجابة النموذجية: إلى مدينة صور ثم إلى مدينة جوا على السواحل الهندية\n3) (استدلال) من صنع السفينة؟\nالإجابة النموذجية: الوستاد منصور"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟\nالإجابة النموذجية: يونس الأخزمي، قاص وروائي عماني\n2) (ت لى الناقة عفراء\n2) (تطبيق) استخرج قيمة من النص.\nالإجابة النموذجية: الاعتزاز بأمجاد عمان في صناعة السفن (أو: الكرم، الصبر)\n3) (استدلال) لماذا وصف مبخوت السفينة بأنها أكبر من مجرد خشبة؟\nالإجابة النموذجية: لأنها فخر صناعة السفن العمانية ورمز لتاريخ عمان البحري"], ["الغلق (3 دقائق)", "عرض حوارات القصة المصورة لمجموعتين"], ["الواجب المنزلي", "حل أنشطة (أحلل النص) المتبقية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=31"]]}, {"no": 60, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: تطبيقات (المبني للمجهول ونائب الفاعل)", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "171-172", "f": [["عنوان الدرس", "الأنشطة النحوية: تطبيقات (المبني للمجهول ونائب الفاعل)"], ["نواتج التعلم", "1. يستخرج الفعل المبني للمعلوم والمبني للمجهول ونائب الفاعل\n2. يعرب نائب الفاعل إعرابًا صحيحًا\n3. يحوّل الأفعال المبنية للمعلوم إلى المجهول مع الضبط وتغيير ما يلزم"], ["الاستراتيجيات", "من أنا؟\nالتعلم التعاوني\nورقة واحدة وقلم واحد"], ["مصادر التعلم", "كتاب الطالب ص171-172\nبطاقات (من أنا؟)\nأوراق عمل"], ["التهيئة (5 دقائق)", "- من أنا؟: أنا فعل ضُم أولي وكُسر ما قبل آخري فمن أنا؟\n- أنا اسم مرفوع نبت مكان الفاعل فمن أنا؟"], ["إجراءات التنفيذ (20 دقيقة)", "الاستخراج (10 دقائق):\n- فقرة من نص (في انتظار شانتي) تُحوّل أفعالها: صنعها الوستاد ← صُنعت\n- استخراج الأفعال وتصنيفها\n- تحديد نائب الفاعل\n\nالإعراب والتحويل (10 دقائق):\n- ورقة واحدة وقلم واحد: إعراب ثلاث جمل بالتناوب\n- تحويل جمل التدريب مع الضبط"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج الفعل المبني للمجهول ونائب الفاعل: (رُبطت السفينةُ بحبالٍ من ألياف جوز الهند).\nالإجابة النموذجية: رُبطت، والسفينةُ نائب فاعل\n2) (تطبيق) حوّل: (يصنعُ العمانيون السفنَ).\nالإجابة النموذجية: تُصنَعُ السفنُ\n3) (استدلال) أعرب (السفنُ) في الجملة المحولة.\nالإجابة النموذجية: نائب فاعل مرفوع بالضمة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حوّل وأعرب نائب الفاعل: (استقبل الأهالي السفينةَ).\nالإجابة النموذجية: اُستُقبِلَت السفينةُ، السفينة: نائب فاعل مرفوع بالضمة\n2) (تطبيق) صنف: (أبحرت شانتي) / (أُنزلت شانتي).\nالإجابة النموذجية: الأول مبني للمعلوم، والثاني مبني للمجهول\n3) (استدلال) اكتب جملة مبنية للمجهول نائب فاعلها مثنى.\nالإجابة النموذجية: مثل: كُرِّمَ الفائزان في المسابقة"], ["الغلق (3 دقائق)", "مراجعة القاعدة بخريطة مختصرة"], ["الواجب المنزلي", "أكمل تدريبات التطبيقات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=32"]]}, {"no": 61, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على ألف)", "k": 1, "n": 1, "wi": 5, "wn": 7, "pages": "173", "f": [["عنوان الدرس", "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على ألف)"], ["نواتج التعلم", "1. يكتب فقرة مسموعة كتابة صحيحة\n2. يكتب كلمات الهمزة المتوسطة على ألف كتابة صحيحة\n3. يصحح أخطاءه ذاتيًا ويعلل الصواب"], ["الاستراتيجيات", "جامع الألماس\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص173\nفقرة إملائية من إعداد المعلم\nجهاز الفاكس كام"], ["التهيئة (5 دقائق)", "مراجعة سريعة لقاعدة الهمزة المتوسطة على ألف بثلاثة أمثلة"], ["إجراءات التنفيذ (20 دقيقة)", "الإملاء (10 دقائق):\n- قراءة الفقرة كاملة\n- إملاؤها جملًا قصيرة مع التكرار مرتين\n- مراعاة النطق الواضح للهمزات\n\nالتصحيح (10 دقائق):\n- قراءة أخيرة للمراجعة\n- عرض الفقرة الصحيحة وتصحيح ذاتي\n- تعليل كتابة كل همزة في الفقرة\n- جامع الألماس للمتميزين"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) علل كتابة الهمزة في (يتأمّل).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها ساكن، والفتحة أقوى، فتكتب على ألف\n2) (تطبيق) ماذا تفعل إذا شككت في كرسي الهمزة؟\nالإجابة النموذجية: أقارن حركتها بحركة ما قبلها وأختار ما يناسب الأقوى\n3) (استدلال) اكتب جملة مملاة صحيحة.\nالإجابة النموذجية: تقويم كتابة الجملة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم بحسب الدقة\n2) (تطبيق) صحح الكلمات التي أخطأت فيها مع التعليل.\nالإجابة النموذجية: تصويب مع تعليل القاعدة\n3) (استدلال) اكتب ثلاث كلمات من الفقرة فيها همزة متوسطة على ألف.\nالإجابة النموذجية: من كلمات الفقرة المملاة"], ["الغلق (3 دقائق)", "- إعلان جامع الألماس\n- معالجة الخطأ الأكثر شيوعًا"], ["الواجب المنزلي", "اكتب الفقرة صحيحة مرتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=33"]]}, {"no": 62, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف رحلة", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "174-178", "f": [["عنوان الدرس", "التعبير: وصف رحلة"], ["نواتج التعلم", "1. يتعرّف عناصر وصف الرحلة (الشخوص، الأمكنة، المشاهد، الأحداث)\n2. يخطط لنص يصف رحلة إلى مكان عماني\n3. يوظف الروابط الزمانية والمكانية"], ["الاستراتيجيات", "العصف الذهني\nالخريطة الذهنية\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص174-178\nخريطة سلطنة عمان\nصور لرحلات"], ["التهيئة (5 دقائق)", "- سؤال: إلى أين كانت آخر رحلة لك؟ ماذا رأيت؟\n- ربط برحلة مبخوت في درس شانتي"], ["إجراءات التنفيذ (20 دقيقة)", "عناصر وصف الرحلة (10 دقائق):\n- قبل الرحلة: الاستعداد والمشاعر\n- الطريق: المشاهد والأماكن\n- الوصول: وصف المكان والأحداث\n- العودة: الانطباع\n- الشخوص المرافقون\n- روابط: في صباح، وبعد ساعة، وعلى جانبي الطريق\n\nالتخطيط (10 دقائق):\n- خريطة ذهنية لرحلة يختارها الطالب\n- كل عنصر بثلاث جمل مفتاحية\n- عرض مخططات بعض الطلبة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر عناصر وصف الرحلة.\nالإجابة النموذجية: الشخوص، والأمكنة، والمشاهد، والأحداث\n2) (تطبيق) ما المرحلة التي يصف فيها الكاتب مشاعره قبل الرحلة؟\nالإجابة النموذجية: مرحلة الاستعداد في المقدمة\n3) (استدلال) اذكر رابطين زمانيين ورابطين مكانيين.\nالإجابة النموذجية: زماني: في الصباح، بعد ذلك، مكاني: على جانبي الطريق، أمامنا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (الوصول – الاستعداد – العودة – الطريق).\nالإجابة النموذجية: الاستعداد، الطريق، الوصول، العودة\n2) (تطبيق) من رحلة مبخوت: اذكر مكانين مر بهما.\nالإجابة النموذجية: الغضن، شنة، رأس الرويس، قرون، رأس الحد (أي اثنين)\n3) (استدلال) اكتب جملة تصف مشهدًا على الطريق.\nالإجابة النموذجية: مثل: امتدت على جانبي الطريق جبال شاهقة تتخللها واحات نخيل خضراء"], ["الغلق (3 دقائق)", "عرض مخطط متميز"], ["الواجب المنزلي", "أكمل المخطط بالجمل المفتاحية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=34"]]}, {"no": 63, "w": 9, "wl": "التاسع", "date": "1-5 نوفمبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التعبير: وصف رحلة", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "174-178", "f": [["عنوان الدرس", "التعبير: وصف رحلة"], ["نواتج التعلم", "1. يكتب نصًا وصفيًا سرديًا متكاملًا لرحلة\n2. يصف الشخوص والأمكنة والمشاهد والأحداث بلغة سليمة\n3. يستخدم علامات الترقيم استخدامًا صحيحًا"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص178\nالمخطط السابق\nقائمة تقويم"], ["التهيئة (5 دقائق)", "قراءة مقدمة نموذجية لوصف رحلة وتحديد عناصرها"], ["إجراءات التنفيذ (20 دقيقة)", "الكتابة (10 دقائق):\n- كتابة النص اعتمادًا على المخطط: مقدمة، الطريق، الوصول، العودة\n- توظيف الوصف الحسي والمشاعر\n\nالمراجعة (10 دقائق):\n- تقويم ذاتي ثم تبادلي بقائمة: العناصر، الترتيب، الوصف، الروابط، الترقيم، سلامة اللغة\n- تحسين المسودة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل بمقدمة: في صباح يوم الجمعة ..........\nالإجابة النموذجية: مثل: استيقظنا باكرًا وحزمنا أمتعتنا استعدادًا لرحلتنا إلى الجبل الأخضر والفرحة تملأ قلوبنا\n2) (تطبيق) صف المكان عند الوصول في جملة.\nالإجابة النموذجية: جملة وصفية فيها لون أو صوت أو رائحة\n3) (استدلال) ما علامة الترقيم بعد عبارة التعجب (ما أروع المنظر)؟\nالإجابة النموذجية: علامة التعجب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب خاتمة لنص الرحلة.\nالإجابة النموذجية: خاتمة تعبر عن الانطباع والرغبة في العودة\n2) (تطبيق) حدد في نصك رابطين وصورة جمالية.\nالإجابة النموذجية: تحديد صحيح من نص الطالب\n3) (استدلال) قيّم نص زميلك بمعيارين.\nالإجابة النموذجية: تقويم محدد بالمعايير"], ["الغلق (3 دقائق)", "قراءة نص متميز وتعزيزه"], ["الواجب المنزلي", "بيّض نص وصف الرحلة في دفتر التعبير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=34"]]}, {"no": 64, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الاستماع: بوابة عمان", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "77-78", "f": [["عنوان الدرس", "الاستماع: بوابة عمان"], ["نواتج التعلم", "1. يستمع إلى النص مراعيًا آداب الاستماع\n2. يستخلص الفكرة العامة ويتعرف خدمات مطار مسقط الدولي ومرافقه\n3. يذكر التوجيهات الواردة في النص المسموع"], ["الاستراتيجيات", "العصف الذهني\nعلبة الكعك\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص77-78\nمقطع صوتي لنص الاستماع\nصورة كبيرة لمطار مسقط الدولي\nورق ملون على شكل كعكات وعلب"], ["التهيئة (5 دقائق)", "- عرض صورة المطار\n- سؤالان: ماذا تشاهد؟ اذكر أسماء المطارات في سلطنة عمان"], ["إجراءات التنفيذ (20 دقيقة)", "الاستماع الأول والثاني (10 دقائق):\n- آداب الاستماع وقراءة الأسئلة دقيقتين\n- الاستماع الأول للفكرة العامة\n- الاستماع الثاني لرصد المرافق والخدمات الإلكترونية وعدد المسافرين والتوجيهات\n\nعلبة الكعك (10 دقائق):\n- كل مجموعة تكتب التوجيهات الثلاثة على ثلاث كعكات وعدد المسافرين على الرابعة وتضعها في العلبة خلال خمس دقائق\n- حل أسئلة الكتاب: تمييز الأفكار التي يمكن استنتاجها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفكرة العامة للنص المسموع؟\nالإجابة النموذجية: التعريف بمطار مسقط الدولي ومرافقه وخدماته بوصفه بوابة عمان إلى العالم\n2) (تطبيق) اذكر ثلاثًا من مرافق المطار.\nالإجابة النموذجية: صالات الانتظار، والأسواق الحرة، والمطاعم (وما ورد في النص من مرافق أخرى)\n3) (استدلال) لماذا يعد النص ذا نمط توجيهي؟\nالإجابة النموذجية: لأنه يتضمن إرشادات للمسافرين حول إجراءات السفر واستخدام الخدمات"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم مسافرًا يستوعب المطار سنويًا كما ورد في النص؟\nالإجابة النموذجية: نحو عشرين مليون مسافر سنويًا (بحسب النص المسموع)\n2) (تطبيق) ميّز فكرة يمكن استنتاجها: (يقدم المطار خدمات إلكترونية لتسهيل إجراءات السفر).\nالإجابة النموذجية: فكرة صحيحة يمكن استنتاجها من النص\n3) (استدلال) اكتب تقريرًا مبسطًا من أربعة أسطر عن مطار مسقط الدولي.\nالإجابة النموذجية: تقرير يذكر الموقع والمرافق والخدمات والطاقة الاستيعابية بلغة سليمة"], ["الغلق (3 دقائق)", "- عرض تقارير المجموعات\n- عبارة ختامية: المطار منجز حضاري يربط عمان بالعالم"], ["الواجب المنزلي", "اكتب ثلاثة توجيهات تقدمها لمسافر يسافر أول مرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=35"]]}, {"no": 65, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التحدث: مناقشة نص مقروء (اللغز)", "k": 1, "n": 2, "wi": 2, "wn": 7, "pages": "79-80", "f": [["عنوان الدرس", "التحدث: مناقشة نص مقروء (اللغز)"], ["نواتج التعلم", "1. يقرأ نص اللغز ويصف أدوات التجربة\n2. يطرح أسئلة حول اللغز ويناقشها مع زملائه\n3. يتحدث بلغة فصيحة منظمة مستعملًا المهارات المساندة"], ["الاستراتيجيات", "كرات الثلج\nالشريك الموسمي\nالعرض العملي"], ["مصادر التعلم", "كتاب الطالب ص79\nكأس ماء وملح وثلاث بيضات\nجهاز عرض"], ["التهيئة (5 دقائق)", "- لغز على السبورة: استخرج أسماء أربعة حيوانات من كلمة (قرنبيط)\n- الوصول إلى فكرة الألغاز العلمية"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة والتجربة (10 دقائق):\n- قراءة نص اللغز دقيقتين\n- تنفيذ التجربة أمام الطلبة: كأس ماء حتى ثلثيه وملعقة ملح وثلاث بيضات\n- ملاحظة: الأولى غرقت، والثانية في المنتصف، والثالثة طفا جزء منها\n\nالشريك الموسمي (10 دقائق):\n- يختار كل طالب شريكًا بموسم (صيف، شتاء...) ويعدان معًا أسئلة عن الأدوات والملاحظات\n- عرض الأسئلة شفهيًا وتبادل الإجابات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) عدد أدوات التجربة.\nالإجابة النموذجية: كأس فيه ماء حتى ثلثيه، وملعقة ملح، وثلاث بيضات متشابهة\n2) (تطبيق) ماذا حدث للبيضة الأولى؟\nالإجابة النموذجية: غرقت ونزلت إلى قعر الكأس\n3) (استدلال) صغ سؤالًا عن اللغز تطرحه على زميلك.\nالإجابة النموذجية: مثل: لماذا لم تتصرف البيضات الثلاث بالطريقة نفسها مع أنها متشابهة؟"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف ما حدث للبيضة الثالثة.\nالإجابة النموذجية: طفا جزء منها فوق سطح الماء\n2) (تطبيق) ما الذي أذابه الرجل في الماء؟\nالإجابة النموذجية: ملعقة من الملح\n3) (استدلال) تحدث في دقيقة عن ملاحظاتك على التجربة بلغة فصيحة.\nالإجابة النموذجية: حديث منظم: الأدوات، الخطوات، الملاحظات"], ["الغلق (3 دقائق)", "كرات الثلج: كل طالب يكتب سؤالًا على ورقة ويكورها ويرميها لزميل يجيب عنها"], ["الواجب المنزلي", "فكّر في سبب اختلاف البيضات واكتب توقعك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=36"]]}, {"no": 66, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التحدث: مناقشة نص مقروء (اللغز)", "k": 2, "n": 2, "wi": 3, "wn": 7, "pages": "79-80", "f": [["عنوان الدرس", "التحدث: مناقشة نص مقروء (اللغز)"], ["نواتج التعلم", "1. يربط بين التجربة والحقائق العلمية المستنتجة\n2. يعرض حل اللغز منظمًا أمام زملائه\n3. يتحدث عن طرق علمية أخرى لفحص البيض"], ["الاستراتيجيات", "الشريك الموسمي\nالعرض الشفهي\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص80\nأدوات التجربة\nجهاز عرض"], ["التهيئة (5 دقائق)", "- استرجاع ملاحظات التجربة\n- عرض التوقعات التي كتبها الطلبة"], ["إجراءات التنفيذ (20 دقيقة)", "حل اللغز (10 دقائق):\n- البيضة الطازجة أثقل لصغر الفراغ الهوائي داخلها فتغرق\n- البيضة الأقل طزاجة يكبر فراغها الهوائي فتبقى في المنتصف\n- البيضة القديمة يكبر فراغها كثيرًا فتطفو\n- الملح يزيد كثافة الماء فيوضح الفروق\n\nالعرض والتوسع (10 دقائق):\n- كل شريكين يعرضان الحل وفق الترتيب (أ، ب، ج)\n- التحدث عن طرق أخرى: رج البيضة وسماع صوت داخلها، فحصها أمام ضوء قوي، كسرها وملاحظة تماسك صفارها وبياضها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا غرقت البيضة الأولى؟\nالإجابة النموذجية: لأنها طازجة ثقيلة وفراغها الهوائي صغير\n2) (تطبيق) لماذا بقيت الثانية في منتصف الكأس؟\nالإجابة النموذجية: لأنها أقل طزاجة، ففراغها الهوائي أكبر قليلًا\n3) (استدلال) لماذا طفت الثالثة؟\nالإجابة النموذجية: لأنها قديمة كبر فراغها الهوائي فأصبحت أخف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما فائدة إذابة الملح في الماء؟\nالإجابة النموذجية: يزيد كثافة الماء فيساعد على إظهار الفرق بين البيضات\n2) (تطبيق) اذكر طريقة أخرى لفحص البيض.\nالإجابة النموذجية: فحصها أمام ضوء قوي، أو كسرها وملاحظة تماسك صفارها\n3) (استدلال) اعرض حلك للغز في دقيقة بلغة فصيحة.\nالإجابة النموذجية: عرض منظم يربط كل ملاحظة بسببها"], ["الغلق (3 دقائق)", "تصويت على أوضح عرض"], ["الواجب المنزلي", "اكتب الحل العلمي للغز في خمسة أسطر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=36"]]}, {"no": 67, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 1, "n": 4, "wi": 4, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية بطلاقة\n2. ينطق الأعلام والتواريخ نطقًا صحيحًا (عباس بن فرناس، الأخوان رايت، أورفيل، ويلبور)\n3. يتعرف الكاتب عبد الفتاح خطاب ونوع النص (علمي)"], ["الاستراتيجيات", "مسرح العرائس\nالقراءة النموذجية والمحاكاة\nمسابقة القارئ المتألق"], ["مصادر التعلم", "كتاب الطالب ص81-84\nصور لوسائل النقل قديمًا وحديثًا\nجهاز عرض"], ["التهيئة (5 دقائق)", "- سؤال الكتاب: هل تحب مراقبة الطيور وهي تحلق؟ هل تحلم بالطيران مثلها؟\n- مشهد قصير بالعرائس بين عباس بن فرناس وصاحبه"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة النموذجية (10 دقائق):\n- قراءة نموذجية مع إبراز العناوين الفرعية (البدايات، الحلم، الأخوان الشريكان، التجارب العديدة، الحلم يتحقق)\n- نطق التواريخ: 1878، 1899، 1902، 1903، 1905\n\nقراءات الطلبة (10 دقائق):\n- قراءة كل طالب فقرة تحت عنوان فرعي\n- تصويب الأخطاء\n- مسابقة القارئ المتألق"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من العربي الذي حاول الطيران؟\nالإجابة النموذجية: عباس بن فرناس الأندلسي\n2) (تطبيق) من أول من صنع طائرة قادرة على الطيران؟\nالإجابة النموذجية: الأخوان (رايت) الأمريكيان\n3) (استدلال) ما اللعبة التي أحضرها الوالد للمنزل؟\nالإجابة النموذجية: حوّامة خشبية صغيرة ترتفع في الهواء إذا شُدّ رباطها المطاطي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم عنوانًا فرعيًا في النص؟ وما فائدتها؟\nالإجابة النموذجية: خمسة، وتنظم أفكار النص العلمي وتسهل فهمه\n2) (تطبيق) من كاتب النص؟\nالإجابة النموذجية: عبد الفتاح خطاب، من كتاب (قصة الطيران)\n3) (استدلال) اقرأ فقرة (الحلم يتحقق) قراءة معبرة.\nالإجابة النموذجية: قراءة سليمة"], ["الغلق (3 دقائق)", "سؤال للتفكير: ما الحلم الذي تريد تحقيقه؟"], ["الواجب المنزلي", "تدرّب على قراءة النص واكتب التواريخ الواردة فيه بالحروف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 68, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 2, "n": 4, "wi": 5, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يناقش المفردات الجديدة من حيث المفرد والجمع والمرادف والمضاد\n2. يصنف المفردات إلى معجم الطيران\n3. يقسم الدرس إلى أفكاره الجزئية"], ["الاستراتيجيات", "شجرة الذاكرة\nخارطة المفاهيم\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص85-86\nمجسم شجرة\nقصاصات ورقية"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع تحديد المفردات الجديدة"], ["إجراءات التنفيذ (20 دقيقة)", "المفردات (10 دقائق):\n- تكوين كلمات من (ح ل م): حلم، حِلْم، حليم، حُلُم\n- كلمة بمعنى المبتكر في الفقرة الأولى: المخترع\n- اشطب ما لا ينتمي لمعجم الطيران: غواصة، قاطرة، زورق\n- مرادفات: يراوده، ينال، معاناة\n\nالأفكار الجزئية (10 دقائق):\nشجرة الذاكرة: جذعها الفكرة العامة وأغصانها الأفكار: محاولات الإنسان القديمة، لعبة الحوامة وبداية الحلم، تعاون الأخوين ودراسة مشكلة التحكم، التجارب والإخفاق، تحقق الحلم"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: قصة تحقيق حلم الإنسان بالطيران على يد الأخوين رايت\n2) (تطبيق) استخرج كلمة بمعنى (المبتكر).\nالإجابة النموذجية: المخترع\n3) (استدلال) أي الكلمات لا تنتمي لمعجم الطيران: (حوامة، قاطرة، التحليق)؟\nالإجابة النموذجية: قاطرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كوّن كلمتين من الحروف (ح ل م) بمعنيين مختلفين.\nالإجابة النموذجية: حُلْم (ما يراه النائم) وحِلْم (الأناة وضبط النفس)\n2) (تطبيق) ما الفكرة الجزئية لفقرة (الأخوان الشريكان)؟\nالإجابة النموذجية: تعاون الأخوين وتوصلهما إلى أن مشكلة الطيران الأساسية هي التحكم\n3) (استدلال) ضع (يراوده) في جملة.\nالإجابة النموذجية: مثل: يراودني حلم أن أصبح طبيبًا"], ["الغلق (3 دقائق)", "عرض شجرة الذاكرة المكتملة"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 69, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 3, "n": 4, "wi": 6, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يبين مراحل اختراع الطائرة بترتيب زمني\n2. يوضح المنهج العلمي الذي اتبعه الأخوان رايت\n3. يحدد مشكلات التحكم الثلاث وحلولها"], ["الاستراتيجيات", "منظم معرفي (حل المشكلات)\nخط الزمن\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص83-87\nمنظم حل المشكلات\nالسبورة التفاعلية"], ["التهيئة (5 دقائق)", "سؤال: لماذا فشلت محاولات كثيرة قبل الأخوين رايت؟"], ["إجراءات التنفيذ (20 دقيقة)", "المراحل (10 دقائق):\nخط زمني: 1878 لعبة الحوامة، الطائرات الورقية ونظرية الأجنحة المقوسة، 1899 نجاح تجربة التحكم بالأسلاك، ثلاث سنوات من التجارب على الطائرات الشراعية، 1902 طائرة شراعية بمحرك بخاري نحو 300 كغ، 1903 قيادة الطائرة، 1905 طيران أكثر من نصف ساعة\n\nالمنهج العلمي (10 دقائق):\n- منظم حل المشكلات: المشكلة (التحكم)، الملاحظة (مراقبة الطيور تحني جناحًا لأعلى وآخر لأسفل)، الفرضية، التجربة، التسجيل والتصوير، التعديل، النتيجة\n- حركات التحكم الثلاث: التحايل، التأرجح، الانعراج"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما نظرية أورفيل الأولى في الطيران؟\nالإجابة النموذجية: الأجنحة المقوسة أفضل من الأجنحة المسطحة\n2) (تطبيق) ما العقبة الأساسية أمام الطيران كما رأى الأخوان؟\nالإجابة النموذجية: مشكلة التحكم في الطائرة\n3) (استدلال) ماذا لاحظ الأخوان عند مراقبة الطيور؟\nالإجابة النموذجية: أنها تدور في الهواء بحني جناح إلى الأعلى والآخر إلى الأسفل"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (طائرة تطير نصف ساعة – لعبة الحوامة – نجاح تجربة التحكم – طائرة شراعية بمحرك).\nالإجابة النموذجية: لعبة الحوامة، نجاح تجربة التحكم، طائرة شراعية بمحرك، طائرة تطير نصف ساعة\n2) (تطبيق) ما المقصود بحركة (الانعراج)؟\nالإجابة النموذجية: توجيه الطائرة إلى اليمين أو إلى اليسار\n3) (استدلال) اذكر خطوتين من المنهج العلمي الذي اتبعه الأخوان.\nالإجابة النموذجية: الملاحظة (مراقبة الطيور)، والتجربة مع تسجيل الملاحظات وتصويرها والتعديل"], ["الغلق (3 دقائق)", "كل مجموعة تلخص المنهج العلمي في ثلاث كلمات"], ["الواجب المنزلي", "ارسم خطًا زمنيًا لمراحل اختراع الطائرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=37"]]}, {"no": 70, "w": 10, "wl": "العاشر", "date": "8-12 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الأول: وتحقق الحلم بالطيران", "k": 4, "n": 4, "wi": 7, "wn": 7, "pages": "81-89", "f": [["عنوان الدرس", "الدرس الأول: وتحقق الحلم بالطيران"], ["نواتج التعلم", "1. يحدد خصائص النص العلمي\n2. يستخلص القيم الإيجابية من الدرس\n3. يبدي رأيه في موقف ويلبور حين أصابه اليأس"], ["الاستراتيجيات", "التعلم التعاوني\nالحوار والمناقشة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص87-89\nبطاقات خصائص النص\nالسبورة"], ["التهيئة (5 دقائق)", "- قراءة قول ويلبور: (أعتقد أن البشر لن يستطيعوا الطيران ولو بعد ألف عام)\n- سؤال: هل نال اليأس من الأخوين؟"], ["إجراءات التنفيذ (20 دقيقة)", "خصائص النص العلمي (10 دقائق):\nالحقائق والمعلومات الدقيقة، التواريخ والأرقام، المصطلحات العلمية (التحايل، التأرجح، الانعراج)، اللغة الواضحة المباشرة، العناوين الفرعية، التسلسل المنطقي\n\nالقيم (10 دقائق):\n- الصبر والمثابرة، التعاون، عدم اليأس، التفكير العلمي، الاستفادة من الطبيعة\n- حل بقية أسئلة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر خاصيتين للنص العلمي.\nالإجابة النموذجية: الحقائق الدقيقة والتواريخ، والمصطلحات العلمية\n2) (تطبيق) استخرج مصطلحًا علميًا من النص.\nالإجابة النموذجية: التحايل، أو التأرجح، أو الانعراج\n3) (استدلال) ما القيمة المستفادة من استعادة الأخوين الأمل بعد الإحباط؟\nالإجابة النموذجية: المثابرة وعدم اليأس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هل النص أدبي أم علمي؟ وما الدليل؟\nالإجابة النموذجية: علمي، لاعتماده على الحقائق والتواريخ والمصطلحات واللغة المباشرة\n2) (تطبيق) ما رأيك في عبارة ويلبور عند الإحباط؟\nالإجابة النموذجية: تقبل الآراء المعللة، كأنها لحظة ضعف طبيعية تجاوزها بالإصرار\n3) (استدلال) كيف تستفيد من قصة الأخوين في دراستك؟\nالإجابة النموذجية: بالمثابرة والتعاون وتحويل الفشل إلى تجربة نتعلم منها"], ["الغلق (3 دقائق)", "عبارة الدرس: الفشل خطوة في طريق النجاح"], ["الواجب المنزلي", "حل بقية أنشطة الدرس."]]}, {"no": 71, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية: اللازم والمتعدي", "k": 1, "n": 3, "wi": 1, "wn": 7, "pages": "181-184", "f": [["عنوان الدرس", "الأنشطة النحوية: اللازم والمتعدي"], ["نواتج التعلم", "1. يتذكر أركان الجملة الفعلية\n2. يتعرف الفعل اللازم والفعل المتعدي\n3. يميز بينهما في الجمل"], ["الاستراتيجيات", "القصة\nفكر - زاوج - شارك\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص181-183\nبطاقات أفعال\nجهاز عرض"], ["التهيئة (5 دقائق)", "- جملتان: (طار الطائرُ) و(صنع الأخوانِ طائرةً)\n- سؤال: أي الجملتين احتاجت إلى كلمة بعد الفاعل لتكتمل؟"], ["إجراءات التنفيذ (20 دقيقة)", "الاستكشاف (10 دقائق):\n- أركان الجملة الفعلية: فعل وفاعل\n- الفعل اللازم: يكتفي بفاعله ولا يحتاج إلى مفعول به (نجح، جلس، طار)\n- الفعل المتعدي: يحتاج إلى مفعول به ليتم معناه (صنع، كتب، راقب)\n- أمثلة من نص حلم الطيران\n\nالتمييز (10 دقائق):\n- تصنيف بطاقات أفعال في عمودين\n- اختبار: هل يصح أن نسأل (ماذا؟) بعد الفعل والفاعل؟"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفعل اللازم؟\nالإجابة النموذجية: فعل يكتفي بفاعله ولا يحتاج إلى مفعول به\n2) (تطبيق) ما الفعل المتعدي؟\nالإجابة النموذجية: فعل لا يكتفي بفاعله بل يحتاج إلى مفعول به ليتم معناه\n3) (استدلال) صنف: (راقبَ الأخوانِ الطيورَ).\nالإجابة النموذجية: راقب: فعل متعدٍّ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنف: (نجحت التجربةُ).\nالإجابة النموذجية: نجح: فعل لازم\n2) (تطبيق) هات فعلين لازمين.\nالإجابة النموذجية: مثل: جلس، نام (أو: ذهب، فرح)\n3) (استدلال) كيف تختبر الفعل أهو لازم أم متعدٍّ؟\nالإجابة النموذجية: أسأل بعد الفعل وفاعله: ماذا؟ فإن احتاج الجواب إلى مفعول به فهو متعدٍّ"], ["الغلق (3 دقائق)", "الدقيقة الواحدة: أكبر عدد من الأفعال المتعدية في دقيقة"], ["الواجب المنزلي", "استخرج خمسة أفعال لازمة وخمسة متعدية من نص (وتحقق الحلم بالطيران).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=38"]]}, {"no": 72, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية: اللازم والمتعدي", "k": 2, "n": 3, "wi": 2, "wn": 7, "pages": "181-184", "f": [["عنوان الدرس", "الأنشطة النحوية: اللازم والمتعدي"], ["نواتج التعلم", "1. يستخرج الفعل اللازم والفعل المتعدي من فقرة الكتاب\n2. يعرب الجمل الفعلية إعرابًا صحيحًا\n3. يستنتج قاعدة الدرس"], ["الاستراتيجيات", "شطيرة الإعراب\nالتعلم التعاوني\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص183-184\nأوراق عمل\nالسبورة"], ["التهيئة (5 دقائق)", "مراجعة سريعة: صنّف خمسة أفعال يقرؤها المعلم"], ["إجراءات التنفيذ (20 دقيقة)", "الإعراب (10 دقائق):\n- (طارت الطائرةُ): طارت فعل ماض والتاء للتأنيث، الطائرة فاعل مرفوع\n- (صنع الأخوانِ طائرةً): الأخوان فاعل مرفوع بالألف، طائرةً مفعول به منصوب بالفتحة\n- شطيرة الإعراب\n\nالقاعدة (10 دقائق):\n- استنتاج القاعدة وكتابتها في خريطة مفاهيم: الفعل ← لازم (يكتفي بالفاعل) / متعدٍّ (يحتاج إلى مفعول به)\n- استخراج الأفعال من فقرة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أعرب (التجاربَ) في: (أجرى الأخوانِ التجاربَ).\nالإجابة النموذجية: مفعول به منصوب وعلامة نصبه الفتحة\n2) (تطبيق) ما نوع الفعل (أجرى)؟\nالإجابة النموذجية: متعدٍّ\n3) (استدلال) أعرب (الأخوانِ).\nالإجابة النموذجية: فاعل مرفوع وعلامة رفعه الألف لأنه مثنى"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من: (حلم أورفيل بالطيران، وصنع طائرات ورقية) فعلًا لازمًا وفعلًا متعديًا.\nالإجابة النموذجية: حلم: لازم، صنع: متعدٍّ\n2) (تطبيق) أعرب: (نجحَ المخترعُ).\nالإجابة النموذجية: نجح فعل ماض مبني على الفتح، المخترع فاعل مرفوع بالضمة\n3) (استدلال) اكتب القاعدة في جملتين.\nالإجابة النموذجية: الفعل اللازم يكتفي بفاعله، والمتعدي يحتاج إلى مفعول به ليتم معناه"], ["الغلق (3 دقائق)", "عرض خريطة المفاهيم"], ["الواجب المنزلي", "أعرب ثلاث جمل من التدريبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=38"]]}, {"no": 73, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية: اللازم والمتعدي", "k": 3, "n": 3, "wi": 3, "wn": 7, "pages": "181-184", "f": [["عنوان الدرس", "الأنشطة النحوية: اللازم والمتعدي"], ["نواتج التعلم", "1. يحوّل جملًا من اللازم إلى المتعدي بإضافة مفعول مناسب أو العكس بتغيير الفعل\n2. يصوغ فقرة تحوي أفعالًا لازمة ومتعدية\n3. يصحح أخطاء تصنيف الأفعال"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم التبادلي\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص184\nأوراق كتابة\nبطاقات تصحيح"], ["التهيئة (5 دقائق)", "لعبة: المعلم يذكر فعلًا والطالب يكمله بجملة صحيحة"], ["إجراءات التنفيذ (20 دقيقة)", "التوظيف (10 دقائق):\n- كتابة فقرة من أربع جمل عن مخترع تحبه فيها فعلان لازمان وفعلان متعديان\n- وضع خط تحت الأفعال وتصنيفها\n\nالتصحيح (10 دقائق):\n- تبادل الفقرات وتصحيح التصنيف\n- حل تدريبات الكتاب المتبقية"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أكمل بمفعول به: (اخترع ماركوني .......).\nالإجابة النموذجية: جهازًا لاسلكيًا\n2) (تطبيق) هل يصح: (جلس الطالبُ الكرسيَّ)؟ ولماذا؟\nالإجابة النموذجية: لا يصح، لأن جلس لازم لا يحتاج إلى مفعول به، والصواب: جلس الطالب على الكرسي\n3) (استدلال) صحح التصنيف: (فرح) فعل متعدٍّ.\nالإجابة النموذجية: فرح فعل لازم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب جملتين عن العلم: إحداهما فعلها لازم والأخرى متعدٍّ.\nالإجابة النموذجية: مثل: تقدّم العلمُ / ينفعُ العلمُ الناسَ\n2) (تطبيق) استخرج من فقرة زميلك فعلًا متعديًا ومفعوله.\nالإجابة النموذجية: تقبل الإجابة الصحيحة\n3) (استدلال) ما الفرق بين (رجع المسافرُ) و(أرجع المسافرُ الكتابَ)؟\nالإجابة النموذجية: الأول فعل لازم، والثاني متعدٍّ نصب مفعولًا به"], ["الغلق (3 دقائق)", "قراءة فقرتين متميزتين"], ["الواجب المنزلي", "اكتب فقرة من خمسة أسطر عن اختراع تحبه فيها أفعال لازمة ومتعدية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=38"]]}, {"no": 74, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الإملائية: الهمزة المتوسطة على الواو", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "185-187", "f": [["عنوان الدرس", "الأنشطة الإملائية: الهمزة المتوسطة على الواو"], ["نواتج التعلم", "1. يذكر مواضع كتابة الهمزة المتوسطة على الواو\n2. يعلل كتابة الهمزة على الواو\n3. يكتب كلمات فيها همزة متوسطة على واو كتابة صحيحة"], ["الاستراتيجيات", "الاستقصاء الموجه\nالتعلم التعاوني\nبطاقات التصنيف"], ["مصادر التعلم", "كتاب الطالب ص185-187\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "- عرض كلمات: مؤمن، يؤدي، سُؤال، رؤوس\n- سؤال: على أي حرف كتبت الهمزة؟"], ["إجراءات التنفيذ (20 دقيقة)", "الاستنتاج (10 دقائق):\n- مواضع الهمزة المتوسطة على الواو: مضمومة بعد فتح (يقرَؤُون، تفاؤُل)، مضمومة بعد ضم (رُؤُوس)، مضمومة بعد سكون (التشاؤُم)، مفتوحة بعد ضم (مُؤَذّن، سُؤَال)، ساكنة بعد ضم (مُؤْمن، يُؤْدي)\n- القاعدة: الضمة أقوى من الفتحة والسكون\n\nالتطبيق (10 دقائق):\n- تصنيف بطاقات حسب الموضع مع التعليل\n- إملاء كلمات قصيرة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) علل كتابة الهمزة على واو في (مُؤْمن).\nالإجابة النموذجية: لأنها ساكنة وما قبلها مضموم، والضمة أقوى فتكتب على واو\n2) (تطبيق) علل كتابتها على واو في (سُؤَال).\nالإجابة النموذجية: لأنها مفتوحة وما قبلها مضموم والضمة أقوى\n3) (استدلال) اكتب الهمزة: (ي_دي، ر_وس).\nالإجابة النموذجية: يؤدي، رؤوس"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب ثلاث كلمات همزتها متوسطة على واو.\nالإجابة النموذجية: مثل: فؤاد، لؤلؤة، مسؤول\n2) (تطبيق) صحح: (مأمن بمعنى المؤمن، سئال).\nالإجابة النموذجية: مؤمن، سؤال\n3) (استدلال) اكتب جملة فيها كلمتان بهمزة متوسطة على واو.\nالإجابة النموذجية: مثل: يؤدي المؤمن صلاته في وقتها"], ["الغلق (3 دقائق)", "ورقة خروج: كلمة جديدة بهمزة على واو مع تعليلها"], ["الواجب المنزلي", "اجمع عشر كلمات بهمزة متوسطة على واو من الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=39"]]}, {"no": 75, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "خط الرقعة: (م، هـ)", "k": 1, "n": 1, "wi": 5, "wn": 7, "pages": "188", "f": [["عنوان الدرس", "خط الرقعة: (م، هـ)"], ["نواتج التعلم", "1. يرسم حرفي الميم والهاء مجردين بخط الرقعة\n2. يكتب الحرفين في أول الكلمة ووسطها وآخرها\n3. يكتب جملة بالرقعة مراعيًا قواعد الرسم"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص188\nأقلام مشطوفة\nأوراق ملاحظات"], ["التهيئة (5 دقائق)", "مقارنة أشكال الهاء الأربعة في النسخ مع الرقعة"], ["إجراءات التنفيذ (20 دقيقة)", "النمذجة (10 دقائق):\n- الميم المتطرفة رأس صغير مطموس وذيل قصير ينزل تحت السطر\n- الهاء في أول الكلمة (هدف) ووسطها (فهم) وآخرها متصلة ومنفصلة (وجهه، وجه)\n- أمثلة: مسجد، علم، مهندس، وطنه\n\nالمحاكاة (10 دقائق):\n- المحاكاة في الكتاب والتصويب بورق الملاحظات\n- كتابة جملة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) هل ينزل ذيل الميم المتطرفة تحت السطر؟\nالإجابة النموذجية: نعم، ينزل ذيلها تحت خط القاعدة\n2) (تطبيق) كم شكلًا للهاء حسب موضعها؟\nالإجابة النموذجية: أربعة: أول الكلمة، ووسطها، وآخرها متصلة، وآخرها منفصلة\n3) (استدلال) اكتب (فهم) بالرقعة.\nالإجابة النموذجية: تقويم عملي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الميم والهاء مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب: (مهندس، وجهه).\nالإجابة النموذجية: تقويم المواضع\n3) (استدلال) اكتب: (من جد وجد) بالرقعة.\nالإجابة النموذجية: تقويم التناسق"], ["الغلق (3 دقائق)", "عرض نماذج متميزة"], ["الواجب المنزلي", "أكمل كراسة الخط."]]}, {"no": 76, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة نص تفسيري", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "189-192", "f": [["عنوان الدرس", "التعبير: كتابة نص تفسيري"], ["نواتج التعلم", "1. يعدد مواصفات النص التفسيري العلمي\n2. يجمع المعلومات والحقائق عن حلم الطيران ويرتبها منطقيًا\n3. يتعرف أدوات الربط المناسبة للنص التفسيري"], ["الاستراتيجيات", "خارطة المفاهيم\nالتعلم التعاوني\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص189-192\nنص (وتحقق الحلم بالطيران)\nجهاز عرض"], ["التهيئة (5 دقائق)", "- سؤال: كيف تطير الطائرة؟\n- الوصول إلى أن النص التفسيري يجيب عن (كيف؟ ولماذا؟)"], ["إجراءات التنفيذ (20 دقيقة)", "المواصفات (10 دقائق):\nالنص التفسيري العلمي: يشرح ظاهرة أو اختراعًا بحقائق ومعلومات، لغته واضحة دقيقة، يستعمل المصطلحات، مرتب منطقيًا (مقدمة، شرح بالتسلسل، خاتمة)، أدوات الربط: لأن، لذلك، بسبب، ونتيجة لذلك، أولًا، ثم\n\nجمع المعلومات (10 دقائق):\n- كل مجموعة تستخرج حقائق من الدرس: محاولات الإنسان، الأجنحة المقوسة، مشكلة التحكم، الحركات الثلاث، التجارب\n- ترتيبها منطقيًا في مخطط"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما النص التفسيري العلمي؟\nالإجابة النموذجية: نص يشرح ظاهرة أو اختراعًا بالحقائق والمعلومات العلمية مرتبة منطقيًا\n2) (تطبيق) اذكر أداتي ربط للسبب والنتيجة.\nالإجابة النموذجية: لأن، ونتيجة لذلك (أو: بسبب، لذلك)\n3) (استدلال) ما الفرق بين النص التفسيري والنص الوصفي؟\nالإجابة النموذجية: التفسيري يشرح كيف ولماذا يحدث الشيء، والوصفي يصور شكله وصفاته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب منطقيًا: (التجارب – مراقبة الطيور – تحديد مشكلة التحكم – الطيران الناجح).\nالإجابة النموذجية: تحديد مشكلة التحكم، مراقبة الطيور، التجارب، الطيران الناجح\n2) (تطبيق) اكتب جملة تفسيرية تستعمل فيها (لأن).\nالإجابة النموذجية: مثل: تطفو البيضة القديمة لأن فراغها الهوائي كبير\n3) (استدلال) استخرج حقيقتين علميتين من الدرس.\nالإجابة النموذجية: الأجنحة المقوسة أفضل من المسطحة، والتحكم يكون بثلاث حركات"], ["الغلق (3 دقائق)", "عرض مخططات المجموعات"], ["الواجب المنزلي", "أكمل المخطط بالحقائق المرتبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=41"]]}, {"no": 77, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة نص تفسيري", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "189-192", "f": [["عنوان الدرس", "التعبير: كتابة نص تفسيري"], ["نواتج التعلم", "1. يكتب مقطعًا تفسيريًا علميًا عن حلم الطيران وتطوره\n2. يوظف الروابط اللفظية والأساليب المناسبة للنص التفسيري\n3. يستعمل علامات الترقيم استعمالًا صحيحًا"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص192\nالمخطط السابق\nقائمة تقويم"], ["التهيئة (5 دقائق)", "قراءة مقطع ت قائق):\n- القفل والمفتاح: القفل كلمة والمفتاح معناها: المنال (الحصول)، افترّ ثغره (ابتسم)، أسارير (خطوط الوجه)، خافتة (ضعيفة)\n- الأفكار: ثقة ماركوني بنفسه، الاستعداد للتجربة، لحظات الانتظار والقلق، سماع النقرات، النجاح التاريخي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) كم كان عمر ماركوني حين أجرى تجربته؟\nالإجابة النموذجية: سبعًا وعشرين سنة\n2) (تطبيق) ما معنى (افترّ ثغره عن ابتسامة)؟\nالإجابة النموذجية: ابتسم ابتسامة ظهرت معها أسنانه\n3) (استدلال) ما الفكرة العامة للنص؟\nالإجابة النموذجية: نجاح ماركوني في إرسال أول رسالة لاسلكية عبر المحيط الأطلسي بفضل ثقته وعزيمته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما مضاد (خافتة)؟\nالإجابة النموذجية: واضحة أو عالية\n2) (تطبيق) أين اختار ماركوني مكان الإرسال؟ وأين الاستقبال؟\nالإجابة النموذجية: الإرسال على ساحل قرية في إنجلترا، والاستقبال على الساحل الأمريكي في الضفة الأخرى من الأطلسي\n3) (استدلال) ما الفكرة الجزئية لفقرة (مضت دقائق شبيهة بالسنوات)؟\nالإجابة النموذجية: قلق ماركوني وترقبه نتيجة التجربة"], ["الغلق (3 دقائق)", "قارئ الحصة يقرأ لحظة سماع النقرات"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=42"]]}, {"no": 79, "w": 12, "wl": "الثاني عشر", "date": "22-24 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثاني: النقرات الثلاث", "k": 2, "n": 3, "wi": 2, "wn": 3, "pages": "90-98", "f": [["عنوان الدرس", "الدرس الثاني: النقرات الثلاث"], ["نواتج التعلم", "1. يحدد أركان أول مراسلة لاسلكية في تاريخ البشرية\n2. يقارن بين حال ماركوني قبل سماع النقرات وبعده\n3. يوضح أهمية الثقة بالنفس وتحديد الأهداف والتخطيط لها"], ["الاستراتيجيات", "أصابع الكف\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص94-96\nمجسم كف\nجدول مقارنة"], ["التهيئة (5 دقائق)", "سؤال: ماذا كان يقول العلماء عن ماركوني؟ وكيف تعامل مع شكوكهم؟"], ["إجراءات التنفيذ (20 دقيقة)", "أركان المراسلة (10 دقائق):\nأصابع الكف: المرسل (محطة الإرسال في إنجلترا)، المستقبل (ماركوني وجهازه على الساحل الأمريكي)، الرسالة (ثلاث نقرات متفق عليها)، الوسيلة (الجهاز اللاسلكي مع السلك الممتد إلى طائرة ورقية)، الشهود (جماعة من العلماء)\n\nالمقارنة والقيم (10 دقائق):\n- قبل: قلق واضطراب وترقب ومشاعر خوف\n- بعد: انبساط الأسارير والابتسام والفرح\n- القيم: الثقة بالنفس، العزيمة، تحديد الهدف، التخطيط، الصبر"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الرسالة التي أرسلت في التجربة؟\nالإجابة النموذجية: ثلاث نقرات متفق عليها\n2) (تطبيق) بمَ اتصل جهاز ماركوني للاستقبال؟\nالإجابة النموذجية: بسلك امتد عبر نافذة المختبر إلى طائرة ورقية تتأرجح في الجو\n3) (استدلال) صف حال ماركوني قبل سماع النقرات.\nالإجابة النموذجية: قلق مضطرب يصغي بكل قوته والخوف يملأ قلبه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف حاله بعد سماعها.\nالإجابة النموذجية: انبسطت أسارير وجهه وابتسم وعبّر عن فرحه لمساعده\n2) (تطبيق) كيف تعامل ماركوني مع شكوك العلماء؟\nالإجابة النموذجية: لم يقم لها وزنًا وباشر تجاربه بثقة وعزيمة\n3) (استدلال) ما أهمية تحديد الهدف والتخطيط كما يظهر في النص؟\nالإجابة النموذجية: أعد ماركوني كل شيء لنجاح تجربته فتحقق هدفه"], ["الغلق (3 دقائق)", "كل طالب يكتب هدفًا له وخطوة لتحقيقه"], ["الواجب المنزلي", "اكتب مقارنة في جدول بين حال ماركوني قبل النقرات وبعدها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=42"]]}, {"no": 80, "w": 12, "wl": "الثاني عشر", "date": "22-24 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثاني: النقرات الثلاث", "k": 3, "n": 3, "wi": 3, "wn": 3, "pages": "90-98", "f": [["عنوان الدرس", "الدرس الثاني: النقرات الثلاث"], ["نواتج التعلم", "1. يوضح أثر اختراع ماركوني في عالمنا المعاصر\n2. يستخلص القيم الإيجابية من الدرس\n3. يحل أنشطة الكتاب المتبقية"], ["الاستراتيجيات", "بساط الريح\nأعواد المثلجات\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص96-98\nصور لأجهزة اتصال حديثة\nبطاقات"], ["التهيئة (5 دقائق)", "- عرض صور: مذياع، هاتف محمول، قمر صناعي\n- سؤال: ما علاقتها بالنقرات الثلاث؟"], ["إجراءات التنفيذ (20 دقيقة)", "أثر الاختراع (10 دقائق):\n- الاتصال اللاسلكي أساس المذياع والهواتف المحمولة والإنترنت اللاسلكي وأنظمة الملاحة والإنقا رفًا زيد في (اجتمع)؟ وما هي؟\nالإجابة النموذجية: حرفان: همزة الوصل والتاء\n3) (استدلال) صنف الزيادة في (استعمل).\nالإجابة النموذجية: مزيد بثلاثة أحرف (الهمزة والسين والتاء)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حلل (تعلّم): الأصل والزائد.\nالإجابة النموذجية: الأصل (ع ل م)، والزائد التاء وتضعيف اللام (حرفان)\n2) (تطبيق) اكتب فعلًا مزيدًا بحرف وآخر بحرفين.\nالإجابة النموذجية: مثل: أنقذ / انطلق\n3) (استدلال) اكتب القاعدة في جملتين.\nالإجابة النموذجية: المجرد كل حروفه أصلية، والمزيد زيد على أصله حرف أو حرفان أو ثلاثة"], ["الغلق (3 دقائق)", "عرض خريطة المفاهيم"], ["الواجب المنزلي", "حل تدريبات الكتاب."]]}, {"no": 83, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الصرفية: المجرد والمزيد", "k": 3, "n": 3, "wi": 3, "wn": 5, "pages": "193-197", "f": [["عنوان الدرس", "الأنشطة الصرفية: المجرد والمزيد"], ["نواتج التعلم", "1. يحوّل الأفعال المجردة إلى أفعال مزيدة\n2. يلاحظ أثر الزيادة في المعنى\n3. يوظف أفعالًا مجردة ومزيدة في جمل"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم التبادلي\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص196-197\nبطاقات أفعال مجردة\nأوراق عمل"], ["التهيئة (5 دقائق)", "الدقيقة الواحدة: كوّن أكبر عدد من الأفعال المزيدة من (علم)"], ["إجراءات التنفيذ (20 دقيقة)", "التحويل (10 دقائق):\n- علم ← أعلم، علّم، تعلّم، استعلم\n- خرج ← أخرج، خرّج، استخرج\n- ملاحظة: الزيادة تغيّر المعنى (تعلّم غير علّم)\n\nالتوظيف (10 دقائق):\n- كل مجموعة تكتب جملتين لكل فعل مزيد\n- تبادل وتصحيح\n- حل تدريبات الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) حوّل (كسر) إلى مزيد بحرف.\nالإجابة النموذجية: كسّر (بتضعيف السين)\n2) (تطبيق) ما الفرق في المعنى بين (علم) و(تعلّم)؟\nالإجابة النموذجية: علم: عرف، وتعلّم: اكتسب العلم بالجهد والتدرج\n3) (استدلال) حوّل (خرج) إلى مزيد بثلاثة أحرف.\nالإجابة النموذجية: استخرج"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب جملة فيها فعل مزيد بحرفين.\nالإجابة النموذجية: مثل: انطلقت الطائرة في السماء\n2) (تطبيق) حوّل (فهم) إلى مزيد وضعه في جملة.\nالإجابة النموذجية: مثل: تفاهم الأخوان على حل المشكلة\n3) (استدلال) صنف أفعال الجملة: (استطاع ماركوني أن يرسل رسالة).\nالإجابة النموذجية: استطاع: مزيد بثلاثة، يرسل: مزيد بحرف (أرسل)"], ["الغلق (3 دقائق)", "مراجعة سريعة لأنواع الزيادة"], ["الواجب المنزلي", "حوّل خمسة أفعال مجردة إلى مزيدة واستعملها في جمل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=43"]]}, {"no": 84, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على الواو)", "k": 1, "n": 1, "wi": 4, "wn": 5, "pages": "198-199", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على الواو)"], ["نواتج التعلم", "1. يذكر مواضع كتابة الهمزة المتوسطة على الواو\n2. يميز بين مواضع كتابة الهمزة المتوسطة على الألف ومواضعها على الواو\n3. يكتب الهمزة المتوسطة كتابة صحيحة في فقرة"], ["الاستراتيجيات", "التعلم التعاوني\nبطاقات التصنيف\nالإملاء المنظور"], ["مصادر التعلم", "كتاب الطالب ص198-199\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "- بطاقتان كبيرتان (ألف) و(واو)\n- المعلم يقرأ كلمة ويرفع الطلبة البطاقة المناسبة"], ["إجراءات التنفيذ (20 دقيقة)", "المقارنة (10 دقائق):\n- جدول: على ألف (سأل، رأس، يسأل) / على واو (مؤمن، سؤال، يقرؤون)\n- التعليل بقاعدة الحركة الأقوى\n\nالتطبيق (10 دقائق):\n- حل تدريبات الكتاب\n- إملاء منظور لفقرة قصيرة\n- تصحيح ذاتي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) علل كتابة الهمزة في (تفاؤُل).\nالإجابة النموذجية: لأنها مضمومة وما قبلها مفتوح، والضمة أقوى فتكتب على واو\n2) (تطبيق) ميّز: (رأْس) و(رُؤوس).\nالإجابة النموذجية: الأولى على ألف (ساكنة بعد فتح)، والثانية على واو (مضمومة بعد ضم)\n3) (استدلال) اكتب الهمزة: (م_تمر، ي_خذ).\nالإجابة النموذجية: مؤتمر، يأخذ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنف حسب كرسي الهمزة: (فأر، مؤذن، مسألة، لؤلؤة).\nالإجابة النموذجية: على ألف: فأر، مسألة / على واو: مؤذن، لؤلؤة\n2) (تطبيق) اكتب الفقرة المملاة صحيحة.\nالإجابة النموذجية: تقويم الدقة\n3) (استدلال) لماذا كتبت الهمزة على واو في (يُؤَدّي)؟\nالإ  النموذجية والمحاكاة\nمسابقات القراءة"], ["مصادر التعلم", "كتاب الطالب ص99-101\nمقطع مرئي عن استخدامات الروبوت\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض مقطع قصير عن الروبوت\n- أو الانطلاق من حديث الرجل الذي سقى الكلب فشكر الله له\n- أسئلة اكتشف النص"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة النموذجية (10 دقائق):\n- قراءة نموذجية تبرز الفكاهة في المواقف\n- تدريب على نطق: الإلكترونية، الائتمانية، الاصطناعي، المرهفة\n\nقراءات الطلبة (10 دقائق):\n- قراءة فقرات متتابعة\n- مسابقة قارئ اليوم\n- تصويب فوري"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الذي كان الأبناء يحلمون به؟\nالإجابة النموذجية: اقتناء كلب صغير يلاعبهم وينبح إذا اقترب اللصوص\n2) (تطبيق) ما اسم الكلب الإلكتروني؟\nالإجابة النموذجية: بيبو\n3) (استدلال) كيف اشترى الأب الكلب؟\nالإجابة النموذجية: عبر أحد مواقع التجارة الإلكترونية ودفع ثمنه ببطاقته الائتمانية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟ وما مصدره؟\nالإجابة النموذجية: محمد المخزنجي، مجلة العربي الصغير\n2) (تطبيق) كم استغرق وصول الكلب؟\nالإجابة النموذجية: أقل من ثلاثة أسابيع، وصل في طرد بريدي\n3) (استدلال) اقرأ الفقرة التي تصف أخطاء بيبو قراءة معبرة.\nالإجابة النموذجية: قراءة تراعي الحوار والنبرة"], ["الغلق (3 دقائق)", "سؤال تشويقي: لماذا سمي الدرس (قريب... غريب)؟"], ["الواجب المنزلي", "تدرّب على قراءة النص.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=47"]]}, {"no": 89, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثالث: قريب... غريب", "k": 2, "n": 4, "wi": 4, "wn": 7, "pages": "99-106", "f": [["عنوان الدرس", "الدرس الثالث: قريب... غريب"], ["نواتج التعلم", "1. يجرد المفردات من أحرف الزيادة وصولًا إلى الجذر المعجمي\n2. يوضح الفكرة العامة والأفكار الجزئية\n3. يبين أسباب رفض الأب وجود كلب في البيت"], ["الاستراتيجيات", "معنى الكلمة\nالتعلم التعاوني\nالقراءة الصامتة الموجهة"], ["مصادر التعلم", "كتاب الطالب ص101-103\nبطاقات (معنى الكلمة)\nالسبورة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع تحديد المفردات"], ["إجراءا  ["التهيئة (5 دقائق)", "- بطاقات صور (روبوت، دماغ، كلب، هاتف)\n- سؤال: رتبها حسب قدرتها على التفكير"], ["إجراءات التنفيذ (20 دقيقة)", "القيم (10 دقائق):\nالرفق بالحيوان، الإبداع العلمي، الحكمة في اتخاذ القرار (موقف الأب)، الاعتدال في التعامل مع التقنية، تقدير نعمة العقل والحواس\n\nالأنشطة (10 دقائق):\n- حل بقية أسئلة الكتاب\n- نقاش: عنوان الدرس ودلالته على المفارقة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج قيمة من موقف الأب.\nالإجابة النموذجية: الحكمة والحرص على صحة أبنائه والرفق بالحيوان\n2) (تطبيق) ما دلالة عنوان الدرس؟\nالإجابة النموذجية: يلخص المفارقة: القريب يُرى غريبًا، فيبين عجز الآلة عن التمييز\n3) (استدلال) لماذا تحولت الأعجوبة إلى نكتة؟\nالإجابة النموذجية: لأن أخطاءها في التعرف على الناس صارت مثار ضحك الأولاد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي تتعلمه عن العقل البشري من النص؟\nالإجابة النموذجية: العقل البشري وحواس الكائن الحي أدق من الآلة في التمييز والفهم\n2) (تطبيق) اذكر قيمة علمية من النص.\nالإجابة النموذجية: الإبداع في الاختراع مع إدراك حدوده\n3) (استدلال) اقترح عنوانًا آخر للدرس.\nالإجابة النموذجية: عنوان مناسب معبر مثل: الأعجوبة الحائرة"], ["الغلق (3 دقائق)", "عبارة الدرس: الآلة صنعها العقل، والعقل نعمة من الله"], ["الواجب المنزلي", "حل بقية أنشطة الدرس."]]}, {"no": 92, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية والصرفية: تطبيقات (اللازم والمتعدي والمجرد والمزيد)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "204-205", "f": [["عنوان الدرس", "الأنشطة النحوية والصرفية: تطبيقات (اللازم والمتعدي والمجرد والمزيد)"], ["نواتج التعلم", "1. يستخرج الفعل المتعدي واللازم والمجرد والمزيد\n2. يحول الفعل المجرد إلى مزيد والمتعدي إلى لازم\n3. يعرب الكلمات ويضبطها ضبطًا صحيحًا"], ["الاستراتيجيات", "التعلم التعاوني\nورقة واحدة وقلم واحد\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص204-205\nجدول تحليل\nأوراق عمل"], ["التهيئة (5 دقائق)", "- جملة: (استخرج العالمُ الحقيقةَ)\n- سؤال: ماذا تعرف عن هذا الفعل؟ (مزيد بثلاثة، متعدٍّ)"], ["إجراءات التنفيذ (20 دقيقة)", "التحليل (10 دقائق):\n- جدول لكل فعل: لازم/متعدٍّ، مجرد/مزيد، الحروف الزائدة\n- أفعال من نص (قريب... غريب): يحلم، اشترى، وصل، يتعرف، يردد\n\nالإعراب والتحويل (10 دقائق):\n- ورقة واحدة وقلم واحد: إعراب جمل التدريب\n- تحويل: خرج (لازم) ← أخرج الكتابَ (متعدٍّ)\n- ضبط الكلمات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) حلل الفعل (وصل).\nالإجابة النموذجية: لازم مجرد\n2) (تطبيق) حلل الفعل (اشترى).\nالإجابة النموذجية: متعدٍّ مزيد بحرفين (الهمزة والتاء)\n3) (استدلال) أعرب (الكلبَ) في: (اشترى الأبُ الكلبَ).\nالإجابة النموذجية: مفعول به منصوب بالفتحة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حوّل (فرح) اللازم إلى فعل متعدٍّ مزيد في جملة.\nالإجابة النموذجية: أفرحَ النجاحُ الطالبَ\n2) (تطبيق) حلل (يتعرّف).\nالإجابة النموذجية: مزيد بحرفين (التاء وتضعيف الراء)، يتعدى بحرف الجر غالبًا\n3) (استدلال) اضبط: (ردد بيبو كلمة غريب).\nالإجابة النموذجية: ردّدَ بيبو كلمةَ غريبٍ"], ["الغلق (3 دقائق)", "مراجعة خريطة مفاهيم المحور"], ["الواجب المنزلي", "أكمل التدريبات."]]}, {"no": 93, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على الواو)", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "206", "f": [["عنوان الدرس", "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على الواو)"], ["نواتج التعلم", "1. يكتب فقرة مسموعة كتابة صحيحة\n2. يكتب الهمزة المتوسطة على الواو والألف كتابة صحيحة\n3. يصحح أخطاءه ويعلل الصواب"], ["الاستراتيجيات", "جامع الألماس\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص206\nفقرة إملائية من إعداد المعلم\nجهاز الفاكس كام"], ["التهيئة (5 دقائق)", "مراجعة قاعدة الحركة الأقوى بأمثلة على الواو والألف"], ["إجراءات التنفيذ (20 دقيقة)", "الإملاء (10 دقائق):\n- قراءة الفقرة كاملة\n- إملاؤها جملًا قصيرة مع التكرار\n- مراعاة النطق الواضح للهمزات\n\nالتصحيح (10 دقائق):\n- عرض الفقرة الصحيحة\n- تصحيح ذاتي مع التعليل\n- جامع الألماس للمتميزين"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) علل كتابة الهمزة في (يؤمن).\nالإجابة النموذجية: ساكنة بعد ضم، والضمة أقوى، فتكتب على و const $=s=>document.querySelector(s);
let mode='sep',idx=0;
try{const s=JSON.parse(localStorage.getItem('noor6_اللغة العربية')||'{}');if(s.mode)mode=s.mode;if(s.idx!=null)idx=s.idx;}catch(e){}
const fw=$('#fw'),fl=$('#fl');
fw.innerHTML='<option value="">كل الأسابيع</option>'+[...new Set(D.map(p=>p.w))].map(w=>{const p=D.find(x=>x.w==w);return `<option value="${w}">الأسبوع ${p.wl} (${p.date})</option>`}).join('');
function fillLessons(){const w=fw.value;const ls=[...new Set(D.filter(p=>!w||p.w==w).map(p=>p.title))];const cur=fl.value;fl.innerHTML='<option value="">كل الدروس</option>'+ls.map(l=>`<option>${esc(l)}</option>`).join('');if(ls.includes(cur))fl.value=cur;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const UTH=/[\u0600-\u06FF]*[\u0656-\u065E\u0670\u0671\u06D6-\u06ED][\u0600-\u06FF]*/g;
function fmt(s){return esc(s).split(/(﴿[^﴾]+﴾)/).map(p=>p.startsWith('﴿')?'<span class="qr">'+p+'</span>':p.replace(UTH,w=>'<span class="qr">'+w+'</span>')).join('')}
function list(){return D.filter(p=>(!fw.value||p.w==fw.value)&&(!fl.value||p.title==fl.value))}
function card(p){return `<article class="card"><div class="ch"><div><h2>${esc(p.title)}</h2><div class="m">الأسبوع ${p.wl} (${p.date}) | ${esc(p.unit)} | الصفحات ${esc(p.pages)}</div></div><span class="badge">الحصة ${p.k} من ${p.n} | رقم ${p.no}</span></div>${p.f.map((f,i)=>`<div class="fld"><div class="k">${f[0]}</div><div class="v">${fmt(f[1])}</div><button class="cp" data-n="${p.no}" data-i="${i}" aria-label="نسخ ${f[0]}">نسخ</button></div>`).join('')}</article>`}
function save(){try{localStorage.setItem('noor6_اللغة العربية',JSON.stringify({mode,idx}))}catch(e){}}
function render(){const L=list();const app=$('#app');$('#m1').classList.toggle('on',mode=='sep');$('#m2').classList.toggle('on',mode=='all');
 if(!L.length){app.innerHTML='<div class="empty">لا توجد حصص تطابق الاختيار. غيّر الأسبوع أو الدرس.</div>';return}
 if(mode=='all'){app.innerHTML=L.map(card).join('');}
 else{if(idx>=L.length)idx=0;const p=L[idx];app.innerHTML=`<div class="nav"><button id="pv" ${idx==0?'disabled':''}>الحصة السابقة</button><span class="pos">${idx+1} من ${L.length}</span><button id="nx" ${idx==L.length-1?'disabled':''}>الحصة التالية</button></div>`+card(p);
  $('#pv').onclick=()=>{idx--;render()};$('#nx').onclick=()=>{idx++;render()};}
 save();}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const p=D.find(x=>x.no==b.dataset.n);const ok=await copyText(p.f[b.dataset.i][1]);b.textContent=ok?'تم النسخ':'تعذّر النسخ';b.classList.toggle('ok',ok);setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1400)});
fw.onchange=()=>{fillLessons();idx=0;render()};fl.onchange=()=>{idx=0;render()};
$('#m1').onclick=()=>{mode='sep';render()};$('#m2').onclick=()=>{mode='all';render()};
document.addEventListener('keydown',e=>{if(mode!='sep'||e.target.tagName=='SELECT')return;const L=list();if(e.key=='ArrowLeft'&&idx<L.length-1){idx++;render()}if(e.key=='ArrowRight'&&idx>0){idx--;render()}});
fillLessons();render();
