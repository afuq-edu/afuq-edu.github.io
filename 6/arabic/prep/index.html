<script>
const D=[{"no": 1, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الاستماع: قسمة إيثار", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "18-19", "f": [["عنوان الدرس", "الاستماع: قسمة إيثار"], ["نواتج التعلم", "1. يستمع إلى نص (قسمة إيثار) مراعيًا آداب الاستماع\n2. يستخلص الفكرة العامة للنص المسموع وأحداثه مرتبة\n3. يحكم على تصرف الأخوين ويبدي رأيه في القسمة مع التعليل"], ["الاستراتيجيات", "تمثيل الأدوار\nاخفض يدك\nربطة الحذاء\nالكرسي الساخن"], ["مصادر التعلم", "كتاب الطالب ص18-19\nمقطع صوتي لنص الاستماع\nجهاز عرض\nمجسم كف اليد (أوراق ملونة)"], ["التهيئة (5 دقائق)", "- مشهد تمثيلي صامت قصير يعبّر عن الأنانية ورفض مساعدة الآخر\n- سؤال: ما الصفة التي ظهرت؟ وما ضدها؟ للوصول إلى قيمة الإيثار وعنوان الدرس"], ["إجراءات التنفيذ (20 دقيقة)", "الاستماع الأول والثاني (10 دقائق):\n- تذكير بآداب الاستماع وقراءة الأسئلة صامتة دقيقتين\n- الاستماع الأول للفكرة العامة\n- الاستماع الثاني ومناقشة المفردات (كنف، قرّت أعينهما، جنح الظلام، المنية، الرخاء) بربطة الحذاء\n\nالاستماع الثالث وحل الأسئلة (10 دقائق):\n- مناقشة عناصر القصة بمجسم كف اليد (المكان والزمان، الشخصيات، الحدث، المشكلة، الحل)\n- حل أسئلة الكتاب: أفراد الأسرة، علاقة الوالدين بالأبناء، ترتيب الأحداث، حجة كل أخ"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ممّن تتكون الأسرة في النص؟\nالإجابة النموذجية: من الوالدين والأخوين، ثم تزوّج الأخ الأكبر فأصبحت زوجته من الأسرة\n2) (تطبيق) لماذا رأى الأخ الأكبر أن القسمة المتساوية غير عادلة؟\nالإجابة النموذجية: لأن أخاه ما زال أعزب ويحتاج أن يدّخر ليتزوج\n3) (استدلال) ما المثل الذي يلخّص مغزى القصة؟ وما معناه؟\nالإجابة النموذجية: «الأخ زينة لأخيه في الرخاء وسلاح له عند البلاء»، أي أن الأخ سند أخيه في السعة والشدة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتّب: (وفاة الوالدين – القسمة بالتساوي – نقل الرزم ليلًا – لقاء الأخوين في الحقل)\nالإجابة النموذجية: وفاة الوالدين، ثم القسمة بالتساوي، ثم نقل الرزم ليلًا، ثم لقاء الأخوين في الحقل\n2) (تطبيق) ما الفكرة العامة للنص؟\nالإجابة النموذجية: الإيثار بين الإخوة يقوّي المحبة ويحفظ الأسرة\n3) (استدلال) اقترح مشروعًا مشتركًا يحقق هدف الأخوين معًا.\nالإجابة النموذجية: مثل: أن يزرعا قطعة أرض إضافية معًا يُخصّص ريعها لزواج الأصغر ومصاريف الأكبر (تقبل الإجابات المعللة)"], ["الغلق (3 دقائق)", "- الكرسي الساخن: طالب من كل مجموعة يجيب عن أسئلة سريعة من المجموعات الأخرى عن القصة\n- عبارة ختامية: الإيثار تقديم حاجة غيرك على حاجتك"], ["الواجب المنزلي", "اكتب ثلاثة أسطر عن موقف إيثار رأيته في أسرتك أو مدرستك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=1"]]}, {"no": 2, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التحدث: قراءة شعار", "k": 1, "n": 2, "wi": 2, "wn": 7, "pages": "20-21", "f": [["عنوان الدرس", "التحدث: قراءة شعار"], ["نواتج التعلم", "1. يتعرّف أنواع الشعارات ووظيفتها\n2. يصف صورة الشعار من حيث الخريطة والأغصان واللون\n3. يعلل اختيار عناصر الشعار ودلالتها على الأعمال الخيرية"], ["الاستراتيجيات", "الصور الملونة\nلعبة الأحجية (البازل)\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص20\nجهاز عرض\nصور ملونة لشعارات مؤسسات عمانية\nبطاقات بازل للشعار"], ["التهيئة (5 دقائق)", "- لعبة البازل: تجميع قطع صورة الشعار في المجموعات\n- سؤال: أين نرى الشعارات؟ ولماذا تصمّمها المؤسسات؟"], ["إجراءات التنفيذ (20 دقيقة)", "تأمّل الصورة (10 دقائق):\n- عرض الشعار مكبّرًا وتأمله دقيقة\n- نقاش محاور (الصورة): سبب وضع خريطة سلطنة عمان، دلالة الأغصان الممتدة المفتوحة، الشجرة التي ترمز إليها الأغصان\n\nالتحدث المنظّم (10 دقائق):\n- كل مجموعة تحضّر حديثًا قصيرًا عن عنصر واحد\n- التدرب على تنظيم الأفكار: مقدمة، وصف، دلالة، رأي\n- استعمال إشارات اليد وتعبيرات الوجه"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا وُضعت خريطة سلطنة عمان في الشعار؟\nالإجابة النموذجية: لأن الشعار يمثل جهة عمانية وعملها يشمل الوطن كله\n2) (تطبيق) إلامَ ترمز الأغصان المفتوحة الممتدة؟\nالإجابة النموذجية: إلى العطاء والامتداد والنمو وإيصال الخير إلى الناس\n3) (استدلال) لماذا غلب اللون الأخضر على الشعار؟\nالإجابة النموذجية: لأنه لون الخير والنماء والحياة والسلام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما وظيفة الشعار لأي مؤسسة؟\nالإجابة النموذجية: يعرّف بها ويختصر رسالتها في رمز سهل التذكر\n2) (تطبيق) لماذا تبدو صورة الشعار بسيطة قليلة الخطوط والألوان؟\nالإجابة النموذجية: ليسهل تذكره وتمييزه وطباعته في أي حجم\n3) (استدلال) اقترح عنصرًا تضيفه إلى الشعار مع التعليل.\nالإجابة النموذجية: مثل: يدان متصافحتان تعبيرًا عن التعاون (تقبل الإجابات المعللة)"], ["الغلق (3 دقائق)", "- كل مجموعة تقول جملة واحدة تلخص رسالة الشعار\n- تمهيد للحصة القادمة: وصف الكتابة في الشعار"], ["الواجب المنزلي", "اجمع صورة شعار مؤسسة عمانية واكتب ثلاث دلالات لعناصره.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=2"]]}, {"no": 3, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التحدث: قراءة شعار", "k": 2, "n": 2, "wi": 3, "wn": 7, "pages": "20-21", "f": [["عنوان الدرس", "التحدث: قراءة شعار"], ["نواتج التعلم", "1. يصف كتابة الشعار من حيث الخط والحجم واللون\n2. يقارن بين الكتابة وصورة الشعار\n3. يتحدث بلغة فصيحة عن تعبير الشعار عن الأعمال الخيرية"], ["الاستراتيجيات", "التصميم والتشكيل\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص21\nجهاز عرض\nأوراق رسم وألوان لكل مجموعة\nأنموذج شعار"], ["التهيئة (5 دقائق)", "عرض شعارين مختلفين وسؤال: أيهما أوضح كتابة؟ ولماذا؟"], ["إجراءات التنفيذ (20 دقيقة)", "وصف الكتابة والمقارنة (10 دقائق):\n- مناقشة الخط ونوعه والحجم واللون\n- المقارنة بين حجم الكتابة وحجم الصورة ولونيهما\n- ربط الشعار بالأعمال الخيرية\n\nالتصميم والتحدث (10 دقائق):\n- كل مجموعة تصمم شعارًا لعمل خيري مدرسي\n- ممثل كل مجموعة يتحدث دقيقتين عن شعارها: عناصره ودلالاته\n- تقويم الحديث بمعايير: الفصاحة، التنظيم، الوضوح"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) صف الكتابة في الشعار من حيث الحجم.\nالإجابة النموذجية: الكتابة أصغر من الصورة لتكون الصورة هي العنصر الأبرز\n2) (تطبيق) قارن بين لون الكتابة ولون الصورة.\nالإجابة النموذجية: تتناسق ألوانهما ويغلب الأخضر ليتوحد الشعار بصريًا\n3) (استدلال) كيف يعبّر الشعار عن الأعمال الخيرية؟\nالإجابة النموذجية: بالأغصان الممتدة التي توحي بالعطاء وبالخريطة التي تدل على شموله الوطن"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر نوعين من الشعارات.\nالإجابة النموذجية: شعارات المؤسسات، وشعارات المناسبات والحملات\n2) (تطبيق) ما شروط التحدث الجيد أمام الزملاء؟\nالإجابة النموذجية: الفصاحة، وتنظيم الأفكار، ووضوح الصوت، واستعمال إشارات اليد وتعبيرات الوجه\n3) (استدلال) انقد شعار مجموعة أخرى بذكر ميزة واقتراح تحسين.\nالإجابة النموذجية: تقبل الإجابات التي تذكر ميزة واضحة واقتراحًا معللًا"], ["الغلق (3 دقائق)", "معرض سريع لشعارات المجموعات وتصويت على أوضحها رسالة"], ["الواجب المنزلي", "صمّم شعارًا لأسرتك واكتب تحته سطرين عن دلالته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=2"]]}, {"no": 4, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 1, "n": 4, "wi": 4, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية سليمة معبّرة مراعيًا علامات الترقيم\n2. يتعرّف الكاتب عادل الكلباني ونوع النص (سيرة ذاتية)\n3. ينطق الكلمات الجديدة نطقًا صحيحًا (اللومي، الجحال، البرغام، البيذامة)"], ["الاستراتيجيات", "النصف والنصف الآخر\nأعواد المثلجات\nالقراءة النموذجية والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص22-25\nصور لأدوات تراثية (الجحلة، البرغام)\nجهاز عرض"], ["التهيئة (5 دقائق)", "- سؤال: اذكر حدثًا من طفولتك ما زال عالقًا في ذاكرتك\n- الإجابة عن أسئلة (اكتشف النص) والتعريف بالكاتب"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة النموذجية (10 دقائق):\n- تذكير بأهداف القراءة الجهرية (المخارج، الترقيم، الطلاقة، الضبط)\n- قراءة نموذجية من المعلم\n- تدريب على نطق المفردات التراثية مع صورها\n\nقراءات الطلبة (10 دقائق):\n- قراءة الطلبة فقرات متتابعة بدءًا بالمجيدين\n- تصويب الأخطاء فور وقوعها\n- اختيار قارئ الحصة بأعواد المثلجات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الشراب الذي كانت الجدة تصنعه في الصيف؟\nالإجابة النموذجية: عصير الليمون الذي يسمونه (حار بارد)\n2) (تطبيق) ما معنى (الجحال)؟\nالإجابة النموذجية: جرار للماء، مفردها جحلة\n3) (استدلال) لماذا قرأتَ عبارة «أوه سعووود، أوه عبووود» بنبرة مختلفة؟\nالإجابة النموذجية: لأنها نداء النساء على أطفالهن، فتقرأ بنبرة النداء المرتفعة الممدودة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟ وما المصدر؟\nالإجابة النموذجية: عادل الكلباني، كتاب (مقنيات وطن وطفولة)\n2) (تطبيق) ما الوقت الذي كانت النساء ينادين فيه أطفالهن؟ ولماذا؟\nالإجابة النموذجية: وقت الغسق عند المغيب، خوفًا عليهم من حشرات الظلام\n3) (استدلال) اقرأ الفقرة الأولى قراءة معبرة، ثم بيّن موضعين لعلامات الترقيم وأثرهما في قراءتك.\nالإجابة النموذجية: قراءة سليمة، مع بيان الوقف عند الفاصلة والنقطة وتغيّر النبرة عند علامة التعجب أو التنصيص"], ["الغلق (3 دقائق)", "- قارئ الحصة يقرأ أجمل فقرة في رأيه\n- ذكر سبب اختياره لها"], ["الواجب المنزلي", "تدرّب على قراءة النص قراءة جهرية واستخرج ثلاث كلمات تراثية وابحث عن معانيها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 5, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 2, "n": 4, "wi": 5, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يستنتج الفكرة العامة للنص\n2. يحدد الأفكار الجزئية لفقرات النص\n3. يحلل المفردات الجديدة في سياقها (ثروتي اللغوية)"], ["الاستراتيجيات", "القراءة الصامتة الموجهة\nالنصف والنصف الآخر\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص22-26\nبطاقات بيض مفقوس (كلمة/معنى)\nالسبورة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع وضع خط تحت المفردات غير الواضحة"], ["إجراءات التنفيذ (20 دقيقة)", "الفكرة العامة والأفكار الجزئية (10 دقائق):\n- أسئلة عامة توصل إلى الفكرة العامة: ذكريات الطفولة في القرية وحياتها الاجتماعية\n- تقسيم النص: الجدة وعصير الصيف، المساء والليل في القرية، السبلة تحت شجرة البيذام، خميس وشجرته\n\nثروتي اللغوية (10 دقائق):\n- استراتيجية البيض المفقوس: نصف البيضة كلمة والنصف الآخر معناها\n- التعويض عن الكلمات بين القوسين (تصنع، قبالة، تتوغل، تغمر)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: صور من ذكريات طفولة الكاتب في قريته وحياة أهلها الاجتماعية\n2) (تطبيق) ما معنى (قبالة)؟\nالإجابة النموذجية: مقابل أو أمام\n3) (استدلال) ما الفكرة الجزئية للفقرة التي تتحدث عن السبلة؟\nالإجابة النموذجية: اجتماع أهل القرية في السبلة للتشاور وحل مشكلاتهم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من النص كلمة بمعنى (ينزل ويدخل عميقًا).\nالإجابة النموذجية: تتوغل\n2) (تطبيق) ضع كلمة (يتحلّق) في جملة من إنشائك.\nالإجابة النموذجية: مثل: يتحلّق الطلبة حول معلمهم ليستمعوا إلى القصة\n3) (استدلال) لماذا شبّه الكاتب الليل بقط أسود يزحف؟\nالإجابة النموذجية: ليصوّر قدوم الظلام بطيئًا خفيًا وهو يغطي الأمكنة شيئًا فشيئًا"], ["الغلق (3 دقائق)", "كل مجموعة تكتب فكرة جزئية على بطاقة وترتب البطاقات على السبورة حسب تسلسل النص"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية) في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 6, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 3, "n": 4, "wi": 6, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يصف مظاهر الحياة الاجتماعية في القرية العمانية كما صوّرها النص\n2. يبيّن الدور الإيجابي للسبلة في المجتمع العماني\n3. يحلل مواقف شخصيات النص (الجدة، خميس) بالقبعات الست"], ["الاستراتيجيات", "القبعات الست\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص26-28\nبطاقات القبعات الملونة\nمقطع مرئي عن السبلة العمانية"], ["التهيئة (5 دقائق)", "عرض مقطع قصير عن السبلة العمانية وسؤال: ماذا يحدث في السبلة؟"], ["إجراءات التنفيذ (20 دقيقة)", "القبعات الست (10 دقائق):\n- البيضاء: متى تصنع الجدة العصير؟ ولماذا تصرخ النساء وقت الغسق؟\n- الحمراء: موقف الصغار من بيذامة خميس، وشعور الكاتب مبتسمًا باكيًا\n- السوداء: الألفاظ السلبية في وصف الليل\n- الصفراء: دور السبلة الإيجابي\n- الزرقاء: كيف تتعامل مع قوانين خميس؟\n\nعرض المجموعات (10 دقائق):\n- تعرض كل مجموعة إجابتها\n- المعلم يدوّن مظاهر الحياة الاجتماعية: التعاون، التشاور، الأمان، الترابط"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما دور السبلة في القرية؟\nالإجابة النموذجية: مكان يجتمع فيه الأهالي للتشاور وإيجاد الحلول لمشكلات القرية بهدوء ورأي رزين\n2) (تطبيق) كيف كان الأهالي يُدعَون إلى السبلة؟\nالإجابة النموذجية: بالنفخ في بوق يسمونه البرغام\n3) (استدلال) ماذا كان خميس يسمح للأطفال به؟ وماذا يمنعهم؟\nالإجابة النموذجية: يسمح بأخذ ما يسقط على الأرض من الثمار، ويمنعهم من الاقتراب من الشجرة وصعودها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مظهرين من مظاهر الحياة الاجتماعية في القرية.\nالإجابة النموذجية: التشاور في السبلة، ونداء الأمهات على الأطفال خوفًا عليهم\n2) (تطبيق) بماذا تفسر ابتسام الكاتب ودمعته عندما يمر بالمكان اليوم؟\nالإجابة النموذجية: يبتسم لجمال الذكريات ويبكي حنينًا إلى زمن الطفولة الذي مضى\n3) (استدلال) هل كان خميس محقًا في منع الأطفال من صعود الشجرة؟ علّل.\nالإجابة النموذجية: نعم، لأنه يحمي الشجرة من الكسر ويحمي الأطفال من السقوط، وقد أباح لهم ما سقط منها (تقبل الآراء المعللة)"], ["الغلق (3 دقائق)", "- جملة ختامية: ذكريات الطفولة تبث في النفس الإحساس بقيمة الحياة\n- كل طالب يكتب كلمة تصف قريته أو حيّه"], ["الواجب المنزلي", "اكتب فقرة قصيرة تصف فيها مكانًا يجتمع فيه أهل حيّك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 7, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 4, "n": 4, "wi": 7, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يستنبط خصائص السيرة الذاتية من النص\n2. يستخلص القيم الإيجابية التي تضمنها النص\n3. يحاكي أسلوب الكاتب في وصف مشهد من طفولته"], ["الاستراتيجيات", "أعواد المثلجات\nالكرسي الساخن\nالمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص28-31\nبطاقات ملونة لخصائص السيرة\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال بأعواد المثلجات: بأي ضمير يتحدث الكاتب؟ عن أي زمن؟"], ["إجراءات التنفيذ (20 دقيقة)", "خصائص السيرة الذاتية (10 دقائق):\n- أسئلة بالهمزة: أيقوم النص على الحوار أم السرد؟ أالأحداث واقعية أم خيالية؟ أالزمن ماضٍ أم حاضر؟ أالضمير للمتكلم أم للغائب؟\n- تدوين الخصائص في بطاقات ملونة على السبورة\n\nالقيم والمحاكاة (10 دقائق):\n- استخلاص القيم: الترابط الأسري، احترام الكبير، التشاور، المحافظة على الممتلكات\n- محاكاة جملة الكاتب في التشبيه: كعصافير صغيرة، كطاووس يفرد جناحيه"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر خاصيتين من خصائص السيرة الذاتية.\nالإجابة النموذجية: السرد بضمير المتكلم، وأحداث واقعية من حياة الكاتب في زمن ماضٍ\n2) (تطبيق) استخرج قيمة إيجابية من النص.\nالإجابة النموذجية: التشاور في حل المشكلات، أو احترام ممتلكات الآخرين، أو الترابط الأسري\n3) (استدلال) حاكِ: (نتابعها بأعيننا كعصافير صغيرة).\nالإجابة النموذجية: مثل: نترقب عودته من السفر كزهور تنتظر المطر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما نوع النص؟ وما الدليل؟\nالإجابة النموذجية: سيرة ذاتية، لأن الكاتب يروي أحداثًا واقعية عاشها بضمير المتكلم\n2) (تطبيق) ما القيمة التي تتعلمها من موقف أهل القرية في السبلة؟\nالإجابة النموذجية: أهمية الشورى والحوار الهادئ في حل المشكلات\n3) (استدلال) اكتب جملتين تصف فيهما مشهدًا من طفولتك بأسلوب السيرة الذاتية.\nالإجابة النموذجية: نص قصير بضمير المتكلم عن حدث واقعي ماضٍ مع وصف حسي (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "الكرسي الساخن: طالب يجيب عن أسئلة سريعة من مستويات مختلفة ويقدم ملخصًا للدرس"], ["الواجب المنزلي", "حل بقية أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 8, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: المضاف إليه", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "113-118", "f": [["عنوان الدرس", "الأنشطة النحوية: المضاف إليه"], ["نواتج التعلم", "1. يتعرّف تركيب الإضافة (المضاف والمضاف إليه)\n2. يميّز المضاف من المضاف إليه في الجمل\n3. يستنتج أن المضاف إليه مجرور دائمًا"], ["الاستراتيجيات", "القصة المصورة\nأقطاب المغناطيس\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص113-115\nجهاز عرض لعرض القصة\nبطاقات زرقاء وحمراء"], ["التهيئة (5 دقائق)", "- قصة مصورة: حروف الجر في بيت المجرورات يطرق بابها (المضاف والمضاف إليه) يطلبان الانضمام\n- سؤال: كيف يكون اسم مجرورًا دون حرف جر؟"], ["إجراءات التنفيذ (20 دقيقة)", "الاستكشاف (10 دقائق):\n- قراءة أمثلة الكتاب من نص (صور من قريتي): شجرة اللومي، أهل القرية، صوت المؤذن\n- ملاحظة الكلمة الثانية: اسم مجرور جاء بعد اسم ليكمل معناه\n- استنتاج تعريف المضاف إليه\n\nالتمييز (10 دقائق):\n- أقطاب المغناطيس: بطاقة زرقاء للمضاف وحمراء للمضاف إليه ويجذب الطلبة الأزواج الصحيحة\n- فكر زاوج شارك: استخراج تراكيب الإضافة من فقرة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما المضاف إليه؟\nالإجابة النموذجية: اسم مجرور يأتي بعد اسم آخر ليكمل معناه ويخصّصه\n2) (تطبيق) حدّد المضاف والمضاف إليه: (صوتُ المؤذنِ).\nالإجابة النموذجية: صوت: مضاف، المؤذن: مضاف إليه مجرور\n3) (استدلال) هل يُنوّن المضاف؟ علّل من الأمثلة.\nالإجابة النموذجية: لا يُنوَّن المضاف، نقول: كتابُ الطالبِ لا كتابٌ الطالبِ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج تركيب إضافة من: (يجتمع أهلُ القريةِ في السبلة).\nالإجابة النموذجية: أهلُ القريةِ\n2) (تطبيق) كوّن تركيب إضافة من (حديقة – المدرسة) في جملة.\nالإجابة النموذجية: مثل: زرعنا حديقةَ المدرسةِ بالأزهار\n3) (استدلال) ما حكم المضاف إليه الإعرابي؟\nالإجابة النموذجية: مجرور دائمًا"], ["الغلق (3 دقائق)", "ورقة خروج: كل طالب يكتب تركيبَي إضافة من بيئة الصف"], ["الواجب المنزلي", "استخرج خمسة تراكيب إضافة من نص (مدرستي الأولى).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=4"]]}, {"no": 9, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: المضاف إليه", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "113-118", "f": [["عنوان الدرس", "الأنشطة النحوية: المضاف إليه"], ["نواتج التعلم", "1. يعرب المضاف والمضاف إليه إعرابًا صحيحًا\n2. يميز علامة جر المضاف إليه (الكسرة، الياء في المثنى وجمع المذكر)\n3. يوظف المضاف إليه في جمل وفقرة قصيرة"], ["الاستراتيجيات", "شطيرة الإعراب\nوقّع لي\nالخرائط المعرفية"], ["مصادر التعلم", "كتاب الطالب ص115-118\nأوراق ملونة لشطيرة الإعراب\nالسبورة"], ["التهيئة (5 دقائق)", "لعبة (وقّع لي): يتجول الطلبة ويجمعون توقيع زميل يذكر تركيب إضافة صحيحًا"], ["إجراءات التنفيذ (20 دقيقة)", "الإعراب (10 دقائق):\n- نموذج إعراب: (ساحةُ المدرسةِ واسعةٌ): ساحة مبتدأ مرفوع وهو مضاف، المدرسة مضاف إليه مجرور بالكسرة\n- شطيرة الإعراب: طبقة للكلمة وطبقة لموقعها وطبقة لعلامتها\n- أمثلة: كتابا الطالبين، معلمو المدرسة\n\nالتطبيق (10 دقائق):\n- حل تدريبات الكتاب\n- خريطة معرفية للمضاف إليه: تعريفه، حكمه، علامات جره، أمثلة\n- توظيف في فقرة من ثلاث جمل عن الأسرة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أعرب (المدرسةِ) في: ساحةُ المدرسةِ واسعة.\nالإجابة النموذجية: مضاف إليه مجرور وعلامة جره الكسرة الظاهرة\n2) (تطبيق) ما علامة جر المضاف إليه في (حقيبةُ المعلمَيْنِ)؟\nالإجابة النموذجية: الياء لأنه مثنى\n3) (استدلال) لماذا حُذفت النون من (معلمو) في (معلمو المدرسة)؟\nالإجابة النموذجية: لأن جمع المذكر السالم أضيف فتحذف نونه عند الإضافة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب ما تحته خط: (قرأتُ كتابَ الأدبِ). كتابَ: ...\nالإجابة النموذجية: مفعول به منصوب وعلامة نصبه الفتحة وهو مضاف\n2) (تطبيق) اجعل (القرية) مضافًا إليه في جملة.\nالإجابة النموذجية: مثل: أحبُّ هدوءَ القريةِ\n3) (استدلال) اكتب جملتين تشتملان على مضاف إليه مثنى وجمع مذكر سالم.\nالإجابة النموذجية: مثل: صافحتُ والدَي الطالبين، واستمعتُ إلى نصائحِ المعلمين"], ["الغلق (3 دقائق)", "كل مجموعة تعرض شطيرة إعراب لجملة اختارتها"], ["الواجب المنزلي", "حل تدريبات الكتاب المتبقية في درس المضاف إليه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=4"]]}, {"no": 10, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة الإملائية: علامة الحذف والقوسان الهلاليان", "k": 1, "n": 1, "wi": 3, "wn": 7, "pages": "119-122", "f": [["عنوان الدرس", "الأنشطة الإملائية: علامة الحذف والقوسان الهلاليان"], ["نواتج التعلم", "1. يتعرّف شكل علامة الحذف (...) والقوسين الهلاليين ( )\n2. يذكر مواضع استعمال كل منهما\n3. يضعهما في مواضعهما الصحيحة في جمل"], ["الاستراتيجيات", "مسرح الدمى\nعربة القطار\nمن أنا؟"], ["مصادر التعلم", "كتاب الطالب ص119-122\nدمى\nبطاقات ممغنطة لعلامات الترقيم"], ["التهيئة (5 دقائق)", "مسرح الدمى: طالبان في طريقهما إلى مدينة الترقيم لحضور حفل تعريف بعلامة الحذف والقوسين"], ["إجراءات التنفيذ (20 دقيقة)", "الاستكشاف (10 دقائق):\n- قراءة أمثلة الكتاب ومنها البرغام والجحال بين قوسين في نص (صور من قريتي)\n- استنتاج مواضع علامة الحذف: الكلام المحذوف أو المقتبس جزء منه، أو ما يُستحيا من ذكره\n- مواضع القوسين: الشرح والتفسير، والكلمة الدخيلة أو التوضيحية، والأرقام والإحالات\n\nالتطبيق (10 دقائق):\n- لعبة (من أنا؟): بطاقة تصف موضعًا ويحدد الطلبة العلامة\n- عربة القطار: كل عربة جملة ناقصة العلامة يكملها الطلبة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما شكل علامة الحذف؟\nالإجابة النموذجية: ثلاث نقاط أفقية متتابعة (...)\n2) (تطبيق) متى نستعمل القوسين الهلاليين؟\nالإجابة النموذجية: لحصر الكلمات المفسّرة أو الشارحة أو التوضيحية في الكلام\n3) (استدلال) ضع العلامة المناسبة: كان يحمل في حقيبته كتبًا وأقلامًا وأدوات\nالإجابة النموذجية: كان يحمل في حقيبته كتبًا وأقلامًا وأدوات... (علامة الحذف لأن الكلام محذوف منه بقية)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ضع القوسين في مكانهما: تقف الجدة قبالة شجرة اللومي الليمون.\nالإجابة النموذجية: تقف الجدة قبالة شجرة اللومي (الليمون)\n2) (تطبيق) ميّز موضع العلامة في: (قال الشاعر: هي الأخلاق تنبت كالنبات...).\nالإجابة النموذجية: علامة حذف لاقتباس جزء من القول\n3) (استدلال) اكتب جملة تحتاج إلى القوسين وأخرى تحتاج إلى علامة الحذف.\nالإجابة النموذجية: مثل: زرنا (السبلة) أي مجلس القرية. / في السوق فواكه كثيرة: تفاح وموز وبرتقال..."], ["الغلق (3 دقائق)", "كل طالب يرسم العلامتين على بطاقة ويكتب تحت كل علامة موضعًا واحدًا"], ["الواجب المنزلي", "استخرج من كتاب القراءة مثالين للقوسين ومثالًا لعلامة الحذف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=5"]]}, {"no": 11, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "خط الرقعة: (ط، ظ)", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "123", "f": [["عنوان الدرس", "خط الرقعة: (ط، ظ)"], ["نواتج التعلم", "1. يرسم حرفي الطاء والظاء مجرّدين بخط الرقعة رسمًا صحيحًا\n2. يكتب الحرفين في أول الكلمة ووسطها وآخرها\n3. يكتب جملة بخط الرقعة مراعيًا تناسق الحروف وخط القاعدة"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص123\nأقلام ذات رأس مشطوف\nأوراق ملاحظات لاصقة\nمقطع مرئي لرسم حرف الطاء بالرقعة"], ["التهيئة (5 دقائق)", "- تذكير بخط القاعدة وما يرتكز عليه من الحروف\n- مقارنة الطاء والظاء بخط النسخ وبخط الرقعة على السبورة المقسمة ثلاثة أقسام"], ["إجراءات التنفيذ (20 دقيقة)", "النمذجة (10 دقائق):\n- المعلم يكتب الطاء والظاء مجردين أمام الطلبة ببطء موضحًا اتجاه القلم ومكان الألف القائمة\n- ثم الحرفين متصلين: طيب، يحفظ، خط، لفظ\n- ملاحظة أن الحرفين يرتكزان على خط القاعدة\n\nالمحاكاة (10 دقائق):\n- الطلبة يحاكون في الكتاب السطر تلو السطر\n- ورق الملاحظات: المعلم يكتب ملاحظة تصويب على ورقة لاصقة بجانب الخطأ\n- كتابة جملة الكتاب بخط الرقعة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) هل يرتكز حرف الطاء في الرقعة على خط القاعدة أم ينزل عنه؟\nالإجابة النموذجية: يرتكز على خط القاعدة\n2) (تطبيق) ما الفرق في الرسم بين الطاء والظاء؟\nالإجابة النموذجية: النقطة فوق الظاء فقط، والشكل واحد\n3) (استدلال) اكتب كلمة (حافظ) بخط الرقعة.\nالإجابة النموذجية: تقويم الرسم: اتصال الحروف صحيح، والظاء على خط القاعدة بقائم مائل قليلًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الطاء والظاء مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي حسب قواعد الرسم\n2) (تطبيق) اكتب كلمتين فيهما الطاء في الوسط والآخر.\nالإجابة النموذجية: مثل: مطر، شرط مكتوبتين بالرقعة\n3) (استدلال) اكتب جملة: (النظافة من الإيمان) بخط الرقعة.\nالإجابة النموذجية: تقويم: تناسق الحجم والمسافات وارتكاز الحروف على السطر"], ["الغلق (3 دقائق)", "- عرض أجمل خمس كراسات على السبورة\n- ثناء على الإتقان والنظافة"], ["الواجب المنزلي", "أكمل التدريب في الكتاب وكرر الجملة ثلاث مرات في كراسة الخط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=6"]]}, {"no": 12, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: تلخيص نص سردي", "k": 1, "n": 1, "wi": 5, "wn": 7, "pages": "124-126", "f": [["عنوان الدرس", "التعبير: تلخيص نص سردي"], ["نواتج التعلم", "1. يحدد الأفكار الرئيسة والأحداث المهمة في نص سردي\n2. يميز الجمل الأساسية من غير الأساسية ويحذف الأخيرة\n3. يعيد صياغة النص بإيجاز موظفًا أدوات الربط"], ["الاستراتيجيات", "محطات رحلة التلخيص\nالتعلم التعاوني\nلعبة شمس قمر"], ["مصادر التعلم", "كتاب الطالب ص124-126\nجهاز الفاكس كام\nبطاقات ممغنطة لأدوات الربط"], ["التهيئة (5 دقائق)", "لعبة (شمس قمر) بين فريقين بأسئلة: عرّف التلخيص، ما أدوات الربط؟ ما الهدف من الجمل غير الأساسية؟"], ["إجراءات التنفيذ (20 دقيقة)", "محطات التلخيص (10 دقائق):\n- المحطة 1: قراءة النص قراءة فاحصة\n- المحطة 2: تحديد الأحداث الرئيسة والشخصيات\n- المحطة 3: شطب الجمل الوصفية والتفصيلات غير الأساسية\n- المحطة 4: الربط بأدوات مثل: ثم، بعد ذلك، وأخيرًا، لذلك\n\nالتطبيق الجماعي (10 دقائق):\n- كل مجموعة تلخص فقرة من نص الكتاب في جملتين\n- جمع الملخصات في نص واحد متسلسل\n- قراءة الملخص النهائي وتقويمه بقائمة: الإيجاز، الترتيب، الربط، سلامة اللغة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما التلخيص؟\nالإجابة النموذجية: إعادة كتابة النص بإيجاز مع الاحتفاظ بأفكاره وأحداثه الرئيسة بلغة الملخِّص\n2) (تطبيق) بمَ تعرف الجملة غير الأساسية؟\nالإجابة النموذجية: تحمل وصفًا أو تفصيلًا أو تكرارًا ولا يختل الحدث بحذفها\n3) (استدلال) اذكر ثلاث أدوات ربط مناسبة للتلخيص.\nالإجابة النموذجية: ثم، بعد ذلك، وأخيرًا (أو: لذلك، في حين)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) لخّص قصة (قسمة إيثار) في ثلاث جمل.\nالإجابة النموذجية: عاش أخوان مع والديهما في ألفة، وبعد وفاتهما اقتسما المحصول بالتساوي، ثم نقل كل منهما رزمًا إلى أخيه ليلًا إيثارًا، حتى التقيا في الحقل فتعانقا\n2) (تطبيق) أيهما يُحذف عند التلخيص: (كان الجو باردًا والقمر ساطعًا) أم (نقل الأخ الرزم إلى حصة أخيه)؟\nالإجابة النموذجية: الأولى لأنها وصف غير أساسي\n3) (استدلال) لماذا يجب أن يكون الملخص بأسلوب الطالب لا بنسخ جمل النص؟\nالإجابة النموذجية: ليدل على فهمه للنص وقدرته على صياغة الأفكار بإيجاز"], ["الغلق (3 دقائق)", "كل مجموعة تقرأ ملخصها والمعلم يبرز أفضل استعمال لأدوات الربط"], ["الواجب المنزلي", "لخص قصة قرأتها حديثًا في خمسة أسطر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=7"]]}, {"no": 13, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثاني: مدرستي الأولى", "k": 1, "n": 4, "wi": 6, "wn": 7, "pages": "32-39", "f": [["عنوان الدرس", "الدرس الثاني: مدرستي الأولى"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية معبّرة عن المعنى\n2. يتعرّف الكاتب أحمد أمين وكتابه (حياتي)\n3. يلتزم بأهداف القراءة: المخارج، الترقيم، الطلاقة، الضبط"], ["الاستراتيجيات", "القراءة النموذجية والمحاكاة\nالعصف الذهني\nأعواد المثلجات"], ["مصادر التعلم", "كتاب الطالب ص32-35\nصورة لمدرسة وأخرى لبيت\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض صورتين: مدرسة وبيت\n- سؤال: أي المكانين تعلمت فيه أول دروسك؟ ولماذا؟\n- أسئلة (اكتشف النص)"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة النموذجية (10 دقائق):\n- تذكير بأهداف القراءة الجهرية\n- قراءة نموذجية من المعلم مع إبراز نبرة الحنين والاعتزاز\n- تحديد الكلمات الصعبة نطقًا: مولعًا، الأميرية، يقتني، صرامته\n\nقراءات الطلبة (10 دقائق):\n- قراءة فقرات متتابعة بدءًا بالمجيدين\n- تصويب فوري\n- التركيز على الوقف عند الفواصل في الجمل الطويلة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) لماذا سمّى الكاتب البيت (مدرستي الأولى)؟\nالإجابة النموذجية: لأنه تعلم فيه أهم دروسه في الحياة وتكوّنت فيه شخصيته\n2) (تطبيق) ما أكثر ما كان في البيت وأثمنه؟\nالإجابة النموذجية: الكتب\n3) (استدلال) في أي عام ولد الكاتب؟\nالإجابة النموذجية: سنة 1886م"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟ وما مصدره؟\nالإجابة النموذجية: أحمد أمين، من كتابه (حياتي)\n2) (تطبيق) ما طابع البيت كما وصفه الكاتب؟\nالإجابة النموذجية: البساطة والنظافة\n3) (استدلال) اقرأ الفقرة التي تصف الأب قراءة معبّرة.\nالإجابة النموذجية: قراءة تبرز الاحترام والهيبة مع مراعاة الوقف"], ["الغلق (3 دقائق)", "مسابقة قارئ اليوم بين ثلاثة طلبة بأعواد المثلجات"], ["الواجب المنزلي", "تدرّب على قراءة النص ], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية) في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=8"]]}, {"no": 15, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثاني: مدرستي الأولى", "k": 3, "n": 4, "wi": 1, "wn": 7, "pages": "32-39", "f": [["عنوان الدرس", "الدرس الثاني: مدرستي الأولى"], ["نواتج التعلم", "1. يستخرج صفات الأب والبيت والجدة من النص\n2. يبيّن دور الأب في تربية الأبناء\n3. يبدي رأيه في أسلوب الأب التربوي مع التعليل"], ["الاستراتيجيات", "أوجه المكعب\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص35-38\nمكعب كرتوني عليه أسئلة\nبطاقات ملونة"], ["التهيئة (5 دقائق)", "- سؤال: صف بيتك بكلمة واحدة\n- ربط بالبيت الذي وصفه الكاتب"], ["إجراءات التنفيذ (20 دقيقة)", "أوجه المكعب (10 دقائق):\n- قارن بين حجرة النوم والمجلس\n- صف الجدة\n- اربط بين التنشئة وشخصية الكاتب\n- كيف استفاد من شغف أبيه بالكتب؟\n- دلّل على الشعور الديني في البيت\n- تتبع مظاهر البساطة والنظافة\n\nالصفات والرأي (10 دقائق):\n- جدول: الأب (مولع بالكتب، مسؤول، حازم رحيم)، البيت (بسيط، نظيف، ديني)، الجدة (طيبة، متدينة، حسنة الحديث)\n- مناقشة: هل تؤيد صرامة الأب؟"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر صفتين للأب.\nالإجابة النموذجية: مولع بالكتب، وشديد الشعور بمسؤوليته عن تعليم أبنائه\n2) (تطبيق) دلّل على أن البيت كان يغمره الشعور الديني.\nالإجابة النموذجية: الأب يؤدي الصلوات في أوقاتها ويكثر من قراءة القرآن ويوقظ أبناءه للفجر ويصومون رمضان\n3) (استدلال) كيف استفاد الكاتب من مكتبة أبيه؟\nالإجابة النموذجية: استمتع بها وانتفع منها، واحتفظ بخيرها نواةً لمكتبته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما دور الأب في تعليم أبنائه؟\nالإجابة النموذجية: كان يعلمهم بنفسه ويشرف على تعليمهم في مدارسهم ويتعب في ذلك حتى وهو مريض\n2) (تطبيق) ما صفات الجدة؟\nالإجابة النموذجية: طيبة القلب متدينة يضيء وجهها، تحسن الحديث وتحكي القصص الشعبية\n3) (استدلال) ما رأيك في أسلوب الأب؟ علّل.\nالإجابة النموذجية: تقبل الآراء المعللة، مثل: أسلوب ناجح لأنه جمع الحزم والرحمة ة وكراهية التكلف\n3) (استدلال) برأيك أي النصين أقرب إلى حياتك؟ علّل.\nالإجابة النموذجية: تقبل الإجابات المعللة"], ["الغلق (3 دقائق)", "ورقة 4H: القلب (مشاعري تجاه الأب)، الرأس (فكرة سأطبقها)، الحرارة (جو البيت)، اليد (رسم مرفق من البيت)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=8"]]}, {"no": 17, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: أنواع الخبر", "k": 1, "n": 3, "wi": 3, "wn": 7, "pages": "127-131", "f": [["عنوان الدرس", "الأنشطة النحوية: أنواع الخبر"], ["نواتج التعلم", "1. يتذكر ركني الجملة الاسمية (المبتدأ والخبر)\n2. يتعرّف أنواع الخبر: مفرد، جملة، شبه جملة\n3. يمثل لكل نوع بمثال"], ["الاستراتيجيات", "K.W.L\nالقصة\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص127-129\nقصة قصيرة على جهاز العرض\nبطاقات K.W.L"], ["التهيئة (5 دقائق)", "- جدول K.W.L: ماذا أعرف عن المبتدأ والخبر؟ ماذا أريد أن أعرف؟\n- أمثلة: البنتُ جميلةٌ، البنتُ كالوردة، البنتُ داخلَ المنزل"], ["إجراءات التنفيذ (20 دقيقة)", "الاستكشاف (10 دقائق):\n- عرض أمثلة الكتاب وتحديد الخبر في كل جملة\n- ملاحظة أن الخبر قد يكون كلمة، أو جملة فعلية أو اسمية، أو جارًّا ومجرورًا أو ظرفًا\n- تسمية الأنواع\n\nالترسيخ (10 دقائق):\n- تصنيف جمل في جدول بثلاثة أعمدة\n- الدقيقة الواحدة: يذكر الطالب أكبر عدد من الأمثلة لنوع يحدده المعلم"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما أنواع الخبر؟\nالإجابة النموذجية: مفرد، وجملة (فعلية أو اسمية)، وشبه جملة (جار ومجرور أو ظرف)\n2) (تطبيق) حدد نوع الخبر: (الكتبُ في المكتبة).\nالإجابة النموذجية: شبه جملة (جار ومجرور)\n3) (استدلال) حدد نوع الخبر: (الأبُ يعلّمُ أبناءه).\nالإجابة النموذجية: جملة فعلية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هات مثالًا لخبر مفرد.\nالإجابة النموذجية: مثل: البيتُ نظيفٌ\n2) (تطبيق) هات مثالًا لخبر شبه جملة ظرفية.\nالإجابة النموذجية: مثل: السبلةُ قربَ المسجد\n3) (استدلال) صنف: (الجدةُ وجهُها مضيء).\nالإجابة النموذجية: خبر جملة اسمية"], ["الغلق (3 دقائق)", "إكمال عمود (ماذا تعلمت؟) في K.W.L"], ["الواجب المنزلي", "اكتب ست جمل اسمية: جملتين لكل نوع من أنواع الخبر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=9"]]}, {"no": 18, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: أنواع الخبر", "k": 2, "n": 3, "wi": 4, "wn": 7, "pages": "127-131", "f": [["عنوان الدرس", "الأنشطة النحوية: أنواع الخبر"], ["نواتج التعلم", "1. يعرب الخبر المفرد إعرابًا صحيحًا\n2. يعرب الخبر الجملة وشبه الجملة إعرابًا محليًا\n3. يميز الخبر الجملة من غيره في الجمل"], ["الاستراتيجيات", "مخطط السمكة\nالأيدي المتصافحة\nالنمذجة"], ["مصادر التعلم", "كتاب الطالب ص129-130\nبطاقات إعراب\nالسبورة"], ["التهيئة (5 دقائق)", "الأيدي المتصافحة: يتصافح زميلان ويذكر كل منهما جملة اسمية والآخر يحدد خبرها"], ["إجراءات التنفيذ (20 دقيقة)", "نماذج الإعراب (10 دقائق):\n- (البيتُ بسيطٌ): بسيط خبر مرفوع بالضمة\n- (الأبُ يقرأُ): الجملة الفعلية في محل رفع خبر\n- (المكتبةُ في المجلسِ): الجار والمجرور في محل رفع خبر\n- (الجدةُ حديثُها حسنٌ): الجملة الاسمية في محل رفع خبر\n\nالتدريب (10 دقائق):\n- مخطط السمكة: رأس السمكة المبتدأ والعظام أنواع الخبر بأمثلة\n- إعراب جمل الكتاب في مجموعات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أعرب (مشرقٌ) في: (وجهُ الجدةِ مشرقٌ).\nالإجابة النموذجية: خبر مرفوع وعلامة رفعه الضمة الظاهرة\n2) (تطبيق) ما محل جملة (يحبُّ الكتب) في: (أبي يحبُّ الكتب)؟\nالإجابة النموذجية: في محل رفع خبر للمبتدأ (أبي)\n3) (استدلال) أين خبر المبتدأ في: (المسجدُ بجانبِ السبلة)؟\nالإجابة النموذجية: شبه الجملة الظرفية (بجانب السبلة) في محل رفع خبر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب: (الطلابُ مجتهدون).\nالإجابة النموذجية: الطلاب: مبتدأ مرفوع بالضمة، مجتهدون: خبر مرفوع بالواو لأنه جمع مذكر سالم\n2) (تطبيق) حدد الخبر ونوعه: (الأمُّ ترعى أبناءها).\nالإجابة النموذجية: ترعى أبناءها: جملة فعلية في محل رفع خبر\n3) (استدلال) لماذا نقول عن الخبر الجملة إنه (في محل رفع)؟\nالإجابة النموذجية: لأن الجملة لا تظهر عليها علامة الإعراب بل تحل محل الاسم المرفوع"], ["الغلق (3 دقائق)", "- عرض مخطط السمكة لأفضل مجموعة\n- تلخيص القاعدة في جملتين"], ["الواجب المنزلي", "أعرب ثلاث جمل من تدريبات الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=9"]]}, {"no": 19, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: أنواع الخبر", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "127-131", "f": [["عنوان الدرس", "الأنشطة النحوية: أنواع الخبر"], ["نواتج التعلم", "1. يحوّل الخبر من نوع إلى آخر\n2. يوظف أنواع الخبر في فقرة عن الأسرة\n3. يصحح أخطاء في تحديد الخبر وإعرابه"], ["الاستراتيجيات", "اتصل بإجابتك\nالتعلم التعاوني\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص130-131\nبطاقات (اتصل بإجابتك)\nأوراق عمل"], ["التهيئة (5 دقائق)", "اتصل بإجابتك: بطاقة سؤال يقابلها طالب يحمل بطاقة إجابتها"], ["إجراءات التنفيذ (20 دقيقة)", "التحويل (10 دقائق):\n- (البيتُ نظيفٌ) ← البيتُ ينظّفُه أهلُه ← البيتُ في نظافة\n- تحويل خبر جملة فعلية إلى مفرد والعكس\n- مناقشة التغيير في المعنى\n\nالتوظيف (10 دقائق):\n- كل مجموعة تكتب فقرة من خمس جمل عن أسرتها تشتمل على الأنواع الثلاثة\n- تبادل الفقرات بين المجموعات لتحديد الأخبار وأنواعها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) حوّل الخبر إلى جملة فعلية: (الطفلُ نائمٌ).\nالإجابة النموذجية: الطفلُ ينامُ\n2) (تطبيق) حوّل الخبر إلى شبه جملة: (الكتابُ موجودٌ).\nالإجابة النموذجية: الكتابُ على المكتب\n3) (استدلال) صحّح: الخبر في (الأبُ في البيت) هو (الأب).\nالإجابة النموذجية: الخبر شبه الجملة (في البيت)، و(الأب) مبتدأ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب جملة خبرها جملة اسمية.\nالإجابة النموذجية: مثل: أخي صوتُه جميل\n2) (تطبيق) حدد أنواع الخبر في: (أمي حنونٌ، وأبي يعمل، وجدتي عندنا).\nالإجابة النموذجية: حنون: مفرد، يعمل: جملة فعلية، عندنا: شبه جملة ظرفية\n3) (استدلال) اكتب فقرة من ثلاث جمل عن مدرستك تتنوع فيها أنواع الخبر.\nالإجابة النموذجية: فقرة صحيحة تشتمل على الأنواع الثلاثة"], ["الغلق (3 دقائق)", "- قراءة فقرة مجموعة متميزة\n- تثبيت القاعدة"], ["الواجب المنزلي", "حل التدريبات المتبقية في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=9"]]}, {"no": 20, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة الإملائية: تطبيقات (علامة الحذف والقوسان الهلاليان)", "k": 1, "n": 1, "wi": 6, "wn": 7, "pages": "132-133", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (علامة الحذف والقوسان الهلاليان)"], ["نواتج التعلم", "1. يذكر مواضع علامة الحذف والقوسين الهلاليين\n2. يضع العلامتين في أماكنهما في نص تطبيقي\n3. يوظف العلامتين في فقرة من إنشائه"], ["الاستراتيجيات", "الأحجية (البازل)\nبتلات الزهرة\nقلم واحد ورقة واحدة"], ["مصادر التعلم", "كتاب الطالب ص132-133\nمجسم زهرة وبتلات\nبطاقات ممغنطة"], ["التهيئة (5 دقائق)", "بازل علامات الترقيم: تجميع العلامة وقراءة السؤال المكتوب خلفها والإجابة عنه"], ["إجراءات التنفيذ (20 دقيقة)", "بتلات الزهرة (10 دقائق):\n- قلب الزهرة عليه العلامة، والبتلات مواضعها\n- يكمل الطلبة الزهرة بالبتلات المناسبة\n- حل السؤال الأول في الكتاب على السبورة التفاعلية\n\nالتطبيق (10 دقائق):\n- قلم واحد ورقة واحدة: تتناوب المجموعة على ورقة واحدة لوضع العلامات في النص التطبيقي\n- تصحيح جماعي"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر موضعين لعلامة الحذف.\nالإجابة النموذجية: الكلام المحذوف أو المقتبس جزء منه، وما يُستحيا من ذكره أو يُستغنى عنه\n2) (تطبيق) اذكر موضعين للقوسين.\nالإجابة النموذجية: الكلمات المفسرة أو الشارحة، والأرقام والإحالات داخل النص\n3) (استدلال) ضع العلامة: سافر (مبخوت) إلى صور ومعه جوهر وغاسي\nالإجابة النموذجية: سافر مبخوت إلى صور ومعه جوهر وغاسي... أو مع القوسين عند التفسير"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ضع القوسين: صنعها الوستاد المشرف على العمل منصور.\nالإجابة النموذجية: صنعها الوستاد (المشرف على العمل) منصور\n2) (تطبيق) صحح الخطأ: (في حديقتنا أشجار كثيرة: ليمون (ونخيل) ورمان).\nالإجابة النموذجية: في حديقتنا أشجار كثيرة: ليمون ونخيل ورمان... (لا موضع للقوسين هنا)\n3) (استدلال) اكتب فقرة من ثلاثة أسطر عن رحلة توظف فيها العلامتين.\nالإجابة النموذجية: فقرة تتضمن القوسين للتفسير وعلامة الحذف للتعداد المحذوف"], ["الغلق (3 دقائق)", "كل مجموعة تقرأ فقرتها وتشير إلى موضع كل علامة"], ["الواجب المنزلي", "استخرج من جريدة أو مجلة جملة فيها قوسان وأخرى فيها علامة حذف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=10"]]}, {"no": 21, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "خط الرقعة: (ع، غ)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "134", "f": [["عنوان الدرس", "خط الرقعة: (ع، غ)"], ["نواتج التعلم", "1. يرسم حرفي العين والغين مجردين بخط الرقعة\n2. يكتب الحرفين في مواضعهما المختلفة في الكلمة\n3. يكتب جملة بخط الرقعة مراعيًا قواعد رسم الحروف"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص134\nأقلام مشطوفة الرأس\nأوراق ملاحظات لاصقة\nالسبورة المقسمة ثلاثة أقسام"], ["التهيئة (5 دقائق)", "- كتابة العين بالنسخ ثم بالرقعة ومقارنة الشكلين\n- سؤال: أين يختلف ذيل العين المتطرفة؟"], ["إجراءات التنفيذ (20 دقيقة)", "النمذجة (10 دقائق):\n- رسم العين المجردة: رأس صغير ثم ذيل ينزل تحت السطر\n- العين في أول الكلمة (علم)، وسطها (يعمل)، آخرها (سمع، ربيع)\n- الغين مثل العين مع نقطة فوق الرأس\n\nالمحاكاة (10 دقائق):\n- محاكاة الطلبة في الكتاب\n- تصويب بورق الملاحظات\n- كتابة جملة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) هل ينزل ذيل العين المتطرفة المنفصلة عن خط القاعدة؟\nالإجابة النموذجية: نعم، ينزل تحت خط القاعدة\n2) (تطبيق) ما الفرق بين العين والغين في الرسم؟\nالإجابة النموذجية: نقطة فوق الغين فقط\n3) (استدلال) اكتب (يعمل) بخط الرقعة.\nالإجابة النموذجية: تقويم عملي: العين المتوسطة صغيرة الرأس على السطر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب العين والغين مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب كلمتين: (غيم – بلاغ) بخط الرقعة.\nالإجابة النموذجية: تقويم موضع الغين في الأول والآخر\n3) (استدلال) اكتب جملة: (العلم نور) بخط الرقعة.\nالإجابة النموذجية: تقويم التناسق والمسافات"], ["الغلق (3 دقائق)", "- عرض نماذج متقنة\n- تذكير بالجلسة الصحيحة"], ["الواجب المنزلي", "أكمل صفحة الخط وكرر الجملة ثلاث مرات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=11"]]}, {"no": 22, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: الوصف", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "135-136", "f": [["عنوان الدرس", "التعبير: الوصف"], ["نواتج التعلم", "1. يفرّق بين الوصف والسرد\n2. يتعرّف عناصر وصف الشخصية والمكان والمشاعر\n3. يكتب مقطعًا وصفيًا قصيرًا لشخصية من أسرته"], ["الاستراتيجيات", "العصف الذهني\nالتعلم التعاوني\nالنمذجة"], ["مصادر التعلم", "كتاب الطالب ص135-136\nصور شخصيات ومشاهد\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض جملتين: (دخلت جدتي البيت) و(جدتي امرأة وقورة وجهها مضيء)\n- سؤال: أيهما يروي حدثًا وأيهما يصف؟"], ["إجراءات التنفيذ (20 دقيقة)", "الوصف والسرد (10 دقائق):\n- السرد يروي أحداثًا متتابعة في زمن، والوصف يرسم صورة للشيء بتفاصيله\n- عناصر وصف الشخصية: الملامح الخارجية، الصفات الداخلية، الحركات والأقوال\n- أمثلة من نص (مدرستي الأولى): وصف الجدة\n\nالنموذج والتدريب (10 دقائق):\n- نموذج وصفي يكتبه المعلم مع الطلبة لشخصية الأب\n- مجموعات تصف شخصية من صورة\n- استعمال الصفات والتشبيهات وحواس النظر والسمع"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفرق بين السرد والوصف؟\nالإجابة النموذجية: السرد يحكي أحداثًا متتابعة، والوصف يصور الشيء ويبيّن صفاته وتفاصيله\n2) (تطبيق) اذكر عنصرين لوصف الشخصية.\nالإجابة النموذجية: الملامح الخارجية، والصفات الداخلية (الخُلقية)\n3) (استدلال) استخرج من نص (مدرستي الأولى) جملة وصفية.\nالإجابة النموذجية: مثل: كان طابع البيت البساطة والنظافة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف ملامح جدك أو جدتك في جملتين.\nالإجابة النموذجية: جملتان فيهما صفات حسية مثل: وجه مضيء، صوت هادئ\n2) (تطبيق) اكتب جملة تصف فيها مشاعر الفرح باستعمال تشبيه.\nالإجابة النموذجية: مثل: طار قلبي فرحًا كعصفور خرج من قفصه\n3) (استدلال) هل الجملة (جلس أبي ثم قرأ الكتاب) وصف أم سرد؟\nالإجابة النموذجية: سرد لأنها تحكي أحداثًا متتابعة"], ["الغلق (3 دقائق)", "قراءة ثلاثة مقاطع وصفية متميزة"], ["الواجب المنزلي", "اكتب مقطعًا وصفيًا من خمسة أسطر عن شخصية تحبها في أسرتك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=12"]]}, {"no": 23, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: الوصف", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "135-136", "f": [["عنوان الدرس", "التعبير: الوصف"], ["نواتج التعلم", "1. يصف البيت والأسرة وصفًا متكاملًا\n2. يوظف الروابط اللفظية والأساليب الوصفية\n3. يستعمل علامات الترقيم استعمالًا صحيحًا"], ["الاستراتيجيات", "التعلم التعاوني\nالكتابة الموجهة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص136\nقائمة تقويم ذاتي\nأوراق كتابة"], ["التهيئة (5 دقائق)", "- سؤال: ما أول شيء يراه الضيف عند دخول بيتكم؟\n- ترتيب الوصف من الخارج إلى الداخل"], ["إجراءات التنفيذ (20 دقيقة)", "التخطيط (10 دقائق):\n- خريطة وصفية: البيت (الموقع، الشكل، الغرف، الألوان، الروائح) والأسرة (الأفراد، الصفات، الجو العام)\n- روابط: في مقدمة البيت، وإلى جانبه، وفي وسطه\n\nالكتابة والتقويم (10 دقائق):\n- كتابة فقرة وصفية عن البيت والأسرة\n- تقويم ذاتي بقائمة: الترتيب، الحواس، الروابط، الترقيم، سلامة اللغة\n- تبادل وتصحيح بين الزملاء"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر رابطين يناسبان وصف المكان.\nالإجابة النموذجية: في مقدمة، وإلى جانب (أو: في وسط، وخلف)\n2) (تطبيق) لماذا نستعمل الحواس في الوصف؟\nالإجابة النموذجية: لنجعل القارئ يرى ويسمع ويشم الصورة كأنه يعيشها\n3) (استدلال) أكمل بوصف مناسب: مجلس بيتنا ................\nالإجابة النموذجية: مثل: واسع هادئ تزينه سجادة حمراء وتفوح فيه رائحة البخور"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتّب عناصر وصف البيت: الغرف – الموقع – الجو العام – الشكل الخارجي.\nالإجابة النموذجية: الموقع، الشكل الخارجي، الغرف، الجو العام\n2) (تطبيق) صحح علامة الترقيم: (بيتنا جميل، وكبير.)\nالإجابة النموذجية: بيتنا جميل وكبير. (لا حاجة إلى الفاصلة قبل واو العطف بين صفتين متلازمتين)\n3) (استدلال) اكتب جملة تصف فيها الجو العام في بيتكم في المساء.\nالإجابة النموذجية: جملة وصفية مناسبة فيها صفة حسية وصفة شعورية"], ["الغلق (3 دقائق)", "قراءة فقرة متميزة وتحديد ما فيها من روابط وصور"], ["الواجب المنزلي", "بيّض الفقرة الوصفية في دفتر التعبير بعد تصويبها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=12"]]}, {"no": 24, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثالث: مدرسة الأخلاق", "k": 1, "n": 3, "wi": 3, "wn": 7, "pages": "40-43", "f": [["عنوان الدرس", "الدرس الثالث: مدرسة الأخلاق"], ["نواتج التعلم", "1. يلقي الأبيات إلقاءً معبرًا مع صحة الضبط\n2. يتعرف الشاعر معروف الرصافي\n3. يحدد الجذر المعجمي لبعض المفردات (أخلاق، مكرمات، اتساق، مدرسة، إسلام)"], ["الاستراتيجيات", "تمثيل الأدوار\nربطة الحذاء\nالإلقاء النموذجي"], ["مصادر التعلم", "كتاب الطالب ص40-41\nتسجيل صوتي لإلقاء القصيدة\nجهاز عرض"], ["التهيئة (5 دقائق)", "- مشهدان صامتان: أم منشغلة بالهاتف عن طفلها، وأم ترعى أبناءها وتتابع دروسهم\n- سؤال: أي الطفلين سيكون أحسن خلقًا؟ ولماذا؟"], ["إجراءات التنفيذ (20 دقيقة)", "الإلقاء (10 دقائق):\n- إلقاء نموذجي معبّر للقصيدة\n- إلقاء الطلبة بيتًا بيتًا مع ضبط أواخر الكلمات ومراعاة القافية (التاء المكسورة)\n- تحديد المفردات غير الواضحة\n\nالجذر المعجمي (10 دقائق):\n- ربطة الحذاء: الكلمة في طرف وجذرها في الطرف الآخر: أخلاق (خ ل ق)، مكرمات (ك ر م)، اتساق (و س ق)، مدرسة (د ر س)، إسلام (س ل م)\n- تكليف بالبحث عن الشاعر"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) من شاعر النص؟\nالإجابة النموذجية: معروف الرصافي، شاعر عراقي\n2) (تطبيق) ما الجذر المعجمي لكلمة (مكرمات)؟\nالإجابة النموذجية: ك ر م\n3) (استدلال) أكمل البيت: «هي الأخلاق تنبت كالنبات ...»\nالإجابة النموذجية: إذا سقيت بماء المكرمات"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما جذر (اتساق)؟\nالإجابة النموذجية: و س ق\n2) (تطبيق) اقرأ البيت الخامس قراءة معبرة.\nالإجابة النموذجية: (ولم أرَ للخلائق من محلٍّ يهذّبها كحضن الأمّهاتِ) بضبط صحيح\n3) (استدلال) ما الحرف الذي انتهت به أبيات القصيدة (الروي)؟\nالإجابة النموذجية: التاء المكسورة"], ["الغلق (3 دقائق)", "- إلقاء جماعي للأبيات الأربعة الأولى\n- تذكير بحفظ النص كاملًا"], ["الواجب المنزلي", "احفظ الأبيات الأربعة الأولى وابحث عن معلومات عن الشاعر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=13"]]}, {"no": 25, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثالث: مدرسة الأخلاق", "k": 2, "n": 3, "wi": 4, "wn": 7, "pages": "40-43", "f": [["عنوان الدرس", "الدرس الثالث: مدرسة الأخلاق"], ["نواتج التعلم", "1. يستنتج الفكرة العامة للقصيدة ووحدتيها الفكريتين\n2. يوضح أهمية تعليم الأمهات وأثره في الأبناء\n3. يشرح الصور الجمالية في الأبيات"], ["الاستراتيجيات", "فكر - زاوج - شارك\nالحوار والمناقشة\nماسح الشفرة الخطية"], ["مصادر التعلم", "كتاب الطالب ص41-42\nبطاقات ملونة للوحدات الفكرية\nالسبورة"], ["التهيئة (5 دقائق)", "عرض ما جمعه الطلبة عن الشاعر معروف الرصافي"], ["إجراءات التنفيذ (20 دقيقة)", "الوحدات الفكرية (10 دقائق):\n- فكر زاوج شارك: قسّم الأبيات إلى وحدات\n- الأبيات 1-4: أهمية غرس الأخلاق في تنشئة الأبناء\n- الأبيات 5-9: أخلاق الأبناء انعكاس لأخلاق أمهاتهم وأهمية تعليم المرأة\n\nالصور الجمالية (10 دقائق):\n- تشبيه الأخلاق بالنبات الذي ينمو إذا سُقي بماء المكرمات\n- تشبيه حضن الأم بالمدرسة\n- تشبيه سموّ الأخلاق باتساق أنابيب القناة\n- أثر الصور في توضيح المعنى"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفكرة العامة للقصيدة؟\nالإجابة النموذجية: دور الأم المتعلمة الخلوقة في تربية أبناء ذوي أخلاق حسنة\n2) (تطبيق) بمَ شبّه الشاعر الأخلاق في البيت الأول؟\nالإجابة النموذجية: بالنبات الذي ينمو إذا سُقي بماء المكرمات\n3) (استدلال) ما الوحدة الفكرية للأبيات (5-9)؟\nالإجابة النموذجية: أخلاق الأبناء انعكاس لأخلاق أمهاتهم، ولذا يجب تعليم المرأة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اشرح: (فحضن الأم مدرسة تسامت).\nالإجابة النموذجية: شبه حضن الأم بالمدرسة الراقية لأنها تعلم أبناءها وتربيهم\n2) (تطبيق) لماذا استنكر الشاعر أن نظن بالأبناء خيرًا إذا نشؤوا في حضن الجاهلات؟\nالإجابة النموذجية: لأن الأم الجاهلة لا تستطيع أن تغرس فيهم العلم والأخلاق الحسنة\n3) (استدلال) بمَ استدل الشاعر في البيت الأخير على وجوب تعليم المرأة؟\nالإجابة النموذجية: بأن العلم في الإسلام فريضة على الأبناء والبنات جميعًا"], ["الغلق (3 دقائق)", "كل طالب يكتب جملة: أمي مدرستي لأنها ..."], ["الواجب المنزلي", "احفظ القصيدة كاملة."]]}, {"no": 26, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثالث: مدرسة الأخلاق", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "40-43", "f": [["عنوان الدرس", "الدرس الثالث: مدرسة الأخلاق"], ["نواتج التعلم", "1. يبيّن صفات الأم المثالية من خلال الأبيات\n2. يستخلص القيم الإيجابية من القصيدة\n3. يحدد السمات العامة للنص الشعري"], ["الاستراتيجيات", "الهدية المتنقلة\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص42-43\nصندوق أسئلة وهدايا رمزية\nأنشودة عن الأم"], ["التهيئة (5 دقائق)", "تسميع أبيات من القصيدة من عدد من الطلبة"], ["إجراءات التنفيذ (20 دقيقة)", "الأم المثالية والقيم (10 دقائق):\n- صفات الأم المثالية: متعلمة، خلوقة، قريبة من أبنائها، تهذب أخلاقهم\n- القيم: بر الأم، طلب العلم للبنين والبنات، التمسك بالأخلاق\n\nسمات النص الشعري (10 دقائق):\n- الوزن والقافية الموحدة\n- الصور الجمالية والتشبيه\n- العاطفة الصادقة\n- الاستفهام للتعجب والإنكار في البيتين الأخيرين\n- حل أسئلة الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر صفتين للأم المثالية من القصيدة.\nالإجابة النموذجية: متعلمة، وتهذب أخلاق أبنائها وتحسن تربيتهم\n2) (تطبيق) استخرج قيمة من البيت الأخير.\nالإجابة النموذجية: العلم فريضة على الذكر والأنثى\n3) (استدلال) ما الأسلوب في: (فكيف نظن بالأبناء خيرًا...؟) وما غرضه؟\nالإجابة النموذجية: استفهام غرضه الإنكار والتعجب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر سمتين للنص الشعري.\nالإجابة النموذجية: الوزن والقافية الموحدة، والصور الجمالية\n2) (تطبيق) ما العاطفة المسيطرة على الشاعر؟\nالإجابة النموذجية: الحرص على الأخلاق والدعوة إلى تعليم المرأة\n3) (استدلال) أبدِ رأيك: هل يكفي تعليم الأم وحده لتربية الأبناء؟ علّل.\nالإجابة النموذجية: تقبل الآراء المعللة، كأن دور الأب والمدرسة مكمل لدورها"], ["الغلق (3 دقائق)", "الهدية المتنقلة: يتداول الطلبة صندوق الأسئلة مع الأنشودة ويجيب من يقف عنده الصندوق"], ["الواجب المنزلي", "ابحث عن قصيدة أخرى تتحدث عن الأم واكتب منها بيتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=13"]]}, {"no": 27, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: تطبيقات (المضاف إليه وأنواع الخبر)", "k": 1, "n": 1, "wi": 6, "wn": 7, "pages": "137-138", "f": [["عنوان الدرس", "الأنشطة النحوية: تطبيقات (المضاف إليه وأنواع الخبر)"], ["نواتج التعلم", "1. يستخرج المضاف والمضاف إليه وأنواع الخبر من نص\n2. يعرب المضاف إليه والخبر بأنواعه إعرابًا صحيحًا\n3. يوظفهما في جمل صحيحة"], ["الاستراتيجيات", "من أنا؟\nورقة واحدة وقلم واحد\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص137-138\nبطاقات (من أنا؟)\nأوراق عمل"], ["التهيئة (5 دقائق)", "- لعبة (من أنا؟): أنا اسم مجرور بعد اسم أكمل معناه، فمن أنا؟ (المضاف إليه)\n- أنا جار ومجرور أخبرت عن المبتدأ، فمن أنا؟ (خبر شبه جملة)"], ["إجراءات التنفيذ (20 دقيقة)", "الاستخراج (10 دقائق):\n- قراءة فقرة الكتاب واستخراج تراكيب الإضافة والأخبار وتصنيفها في جدول\n- خريطة مفاهيم تجمع الدرسين\n\nالإعراب والتوظيف (10 دقائق):\n- ورقة واحدة وقلم واحد: إعراب جمل التدريب بالتناوب داخل المجموعة\n- كتابة جملتين تجمعان المضاف إليه وخبرًا شبه جملة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) استخرج المضاف إليه والخبر: (مكتبةُ أبي في المجلس).\nالإجابة النموذجية: أبي: مضاف إليه، في المجلس: خبر شبه جملة\n2) (تطبيق) ما نوع الخبر في: (الأخلاقُ تنبتُ كالنبات)؟\nالإجابة النموذجية: جملة فعلية\n3) (استدلال) أعرب (الأمهات) في: (حضنُ الأمهاتِ مدرسة).\nالإجابة النموذجية: مضاف إليه مجرور وعلامة جره الكسرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب: (بيتُ الكاتبِ بسيطٌ).\nالإجابة النموذجية: بيت: مبتدأ مرفوع وهو مضاف، الكاتب: مضاف إليه مجرور بالكسرة، بسيط: خبر مرفوع بالضمة\n2) (تطبيق) اكتب جملة خبرها شبه جملة وفيها مضاف إليه.\nالإجابة النموذجية: مثل: كتبُ أبي في الدولاب\n3) (استدلال) صحح: (معلمون المدرسة مخلصون).\nالإجابة النموذجية: معلمو المدرسة مخلصون (حذف النون للإضافة)"], ["الغلق (3 دقائق)", "مراجعة سريعة لخريطة المفاهيم"], ["الواجب المنزلي", "أكمل تدريبات التطبيقات في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=14"]]}, {"no": 28, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة الإملائية: إملاء اختباري (علامة الحذف والقوسان الهلاليان)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "139", "f": [["عنوان الدرس", "الأنشطة الإملائية: إملاء اختباري (علامة الحذف والقوسان الهلاليان)"], ["نواتج التعلم", "1. يكتب فقرة مسموعة كتابة صحيحة\n2. يوظف علامة الحذف والقوسين وعلامات الترقيم المدروسة في مواضعها\n3. يصحح أخطاءه ذاتيًا"], ["الاستراتيجيات", "جامع الألماس\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص139\nفقرة إملائية من إعداد المعلم\nجهاز الفاكس كام"], ["التهيئة (5 دقائق)", "- تذكير بالجلسة الصحيحة ونظافة الدفتر\n- مراجعة سريعة لمواضع علامة الحذف والقوسين"], ["إجراءات التنفيذ (20 دقيقة)", "الإملاء (10 دقائق):\n- قراءة المعلم الفقرة كاملة قراءة واضحة\n- إملاؤها جملًا قصيرة مع تكرار كل جملة مرتين\n- ذكر علامات الترقيم ضمنيًا بنبرة الصوت دون التصريح بها\n\nالتصحيح (10 دقائق):\n- قراءة أخيرة للمراجعة\n- عرض الفقرة الصحيحة على الفاكس كام\n- تصحيح ذاتي وتلوين الأخطاء\n- جامع الألماس: جائزة لمن لا يخطئ في العلامات"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ماذا تفعل عندما تشك في علامة الترقيم المناسبة؟\nالإجابة النموذجية: أتذكر وظيفة الجملة: تفسير فأضع القوسين، أو حذف فأضع علامة الحذف\n2) (تطبيق) اكتب جملة مملاة: (كانت الجدة تصنع (حار بارد) لنا...).\nالإجابة النموذجية: كتابة صحيحة بقوسين وعلامة حذف في موضعيهما\n3) (استدلال) ما العلامة التي تأتي بعد (مثل) عند التعداد المحذوف بعضه؟\nالإجابة النموذجية: علامة الحذف في نهاية التعداد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم بحسب صحة الكتابة والعلامات\n2) (تطبيق) صحح الأخطاء التي وقعت فيها.\nالإجابة النموذجية: تصويب ذاتي في الدفتر\n3) (استدلال) اكتب كلمتين أخطأت فيهما ثلاث مرات.\nالإجابة النموذجية: تقويم عملي"], ["الغلق (3 دقائق)", "- إعلان (جامع الألماس)\n- تحديد خطأين شائعين ومعالجتهما"], ["الواجب المنزلي", "اكتب الفقرة كاملة صحيحة في دفترك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=15"]]}, {"no": 29, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: السرد والوصف", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "140-144", "f": [["عنوان الدرس", "التعبير: السرد والوصف"], ["نواتج التعلم", "1. يكتب نصًا سرديًا عن العيد يتضمن مقاطع وصفية\n2. يصف الشخصيات والمكان والمشاهد والمشاعر ضمن السرد\n3. يوظف الروابط الزمنية وعلامات الترقيم توظيفًا صحيحًا"], ["الاستراتيجيات", "العصف الذهني\nالكتابة الموجهة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص140-144\nصور لمظاهر العيد في عمان\nأوراق تخطيط"], ["التهيئة (5 دقائق)", "عصف ذهني: كلمات تتذكرها عن صباح العيد في بلدتك (العيدية، الهبطة، الشواء، الملابس الجديدة)"], ["إجراءات التنفيذ (20 دقيقة)", "التخطيط (10 دقائق):\n- هيكل النص: مقدمة (استعداد الأسرة)، عرض (صباح العيد، الصلاة، الزيارات، الألعاب)، خاتمة (مشاعر نهاية اليوم)\n- تحديد مواضع الوصف داخل السرد: وصف المكان، الأشخاص، المشاعر\n- روابط زمنية: في الصباح الباكر، بعد الصلاة، وعند الظهيرة\n\nالكتابة (10 دقائق):\n- كتابة المسودة في الدفتر\n- مراجعة ذاتية بقائمة: تسلسل الأحداث، تنوع الوصف، الروابط، الترقيم\n- قراءة نماذج والتعليق عليها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفرق بين جملة سردية وأخرى وصفية في نص عن العيد؟\nالإجابة النموذجية: السردية تحكي حدثًا (خرجنا إلى المصلى)، والوصفية تصور (كان المصلى مزدانًا بالثياب البيضاء)\n2) (تطبيق) اذكر ثلاثة روابط زمنية تناسب نص العيد.\nالإجابة النموذجية: في الصباح الباكر، بعد ذلك، وعند المساء\n3) (استدلال) صف مشهد الأطفال وهم يأخذون العيدية في جملة.\nالإجابة النموذجية: مثل: تتلألأ عيون الأطفال فرحًا وهم يمدون أيديهم الصغيرة لأخذ العيدية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (الخاتمة – صباح العيد – الاستعداد – الزيارات).\nالإجابة النموذجية: الاستعداد، صباح العيد، الزيارات، الخاتمة\n2) (تطبيق) اكتب جملة تجمع السرد والوصف.\nالإجابة النموذجية: مثل: لبست ثوبي الأبيض الجديد الذي تفوح منه رائحة العود وخرجت مع أبي\n3) (استدلال) ما دور الوصف داخل النص السردي؟\nالإجابة النموذجية: يجعل الأحداث حية ويقرّب المشاهد والمشاعر من القارئ"], ["الغلق (3 دقائق)", "- قراءة مقدمتين متميزتين\n- تذكير بإكمال النص"], ["الواجب المنزلي", "أكمل كتابة النص السردي عن العيد وبيّضه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=16"]]}, {"no": 30, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "القراءة الحرة: المحور الأول", "k": 1, "n": 1, "wi": 2, "wn": 7, "pages": "44-46", "f": [["عنوان الدرس", "القراءة الحرة: المحور الأول"], ["نواتج التعلم", "1. يبيّن أهمية القراءة في تطوير الشخصية\n2. يقرأ كتابًا مختارًا قراءة فاحصة ويلخصه وفق بطاقة الكتاب\n3. يعرض ملخص الكتاب شفهيًا أمام زملائه"], ["الاستراتيجيات", "العرض الشفهي\nالخريطة الذهنية\nالتعلم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص44-46 (بطاقة القراءة)\nكتب متنوعة من مركز مصادر التعلم\nالفاكس كام"], ["التهيئة (5 دقائق)", "- عرض مقطع قصير عن أهمية المكتبات\n- سؤال: ما آخر كتاب قرأته؟"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة (10 دقائق):\n- توزيع الكتب أو اختيار الطلبة لكتبهم\n- قراءة فاحصة فردية\n- تعبئة البطاقة: اسم الكتاب، المؤلف، الموضوع، الشخصيات أو الأفكار، أعجبني، رأيي\n\nالتلخيص والعرض (10 دقائق):\n- تصميم خريطة ذهنية للكتاب\n- عرض طالب من كل مجموعة ملخصه في دقيقتين\n- تشجيع الأسئلة من الزملاء"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما أهمية القراءة الحرة؟\nالإجابة النموذجية: توسع المدارك والمعارف وتنمي اللغة والشخصية\n2) (تطبيق) ما العناصر الأساسية في بطاقة التعريف بالكتاب؟\nالإجابة النموذجية: اسم الكتاب ومؤلفه وموضوعه وأهم أفكاره ورأي القارئ فيه\n3) (استدلال) ما الفرق بين القراءة الحرة والقراءة الصفية؟\nالإجابة النموذجية: الحرة يختار فيها القارئ ما يناسب ميوله، والصفية محددة بالمنهج"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) لخص الكتاب الذي قرأته في ثلاث جمل.\nالإجابة النموذجية: تلخيص يحدد الموضوع وأهم فكرتين\n2) (تطبيق) اذكر فكرة استفدتها من الكتاب.\nالإجابة النموذجية: تقبل الإجابات المرتبطة بالكتاب المقروء\n3) (استدلال) انصح زميلك بقراءة كتابك أو بعدمها مع التعليل.\nالإجابة النموذجية: رأي معلل يذكر ميزة أو ملاحظة"], ["الغلق (3 دقائق)", "شكر الطلبة وحثهم على زيارة مركز مصادر التعلم أسبوعيًا"], ["الواجب المنزلي", "أكمل قراءة الكتاب وأكمل البطاقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=17"]]}, {"no": 31, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الاستماع: كهف مجلس الجن", "k": 1, "n": 1, "wi": 3, "wn": 7, "pages": "48-49", "f": [["عنوان الدرس", "الاستماع: كهف مجلس الجن"], ["نواتج التعلم", "1. يستمع إلى النص مراعيًا آداب الاستماع\n2. يستخلص المعلومات الرئيسة عن كهف مجلس الجن (الموقع، الاكتشاف، الفتحات)\n3. يقدّر المزارات الطبيعية في السلطنة وواجبه نحوها"], ["الاستراتيجيات", "فك الشفرة\nأقطاب المغناطيس\nقطرات المطر\nملخص العمودين"], ["مصادر التعلم", "كتاب الطالب ص48-49\nمقطع صوتي لنص الاستماع\nمجسم زهرة وقطرات مطر\nمقطع مرئي عن الكهف"], ["التهيئة (5 دقائق)", "فك الشفرة: رموز تقابلها حروف يجمعها الطلبة لتكوين عنوان الدرس"], ["إجراءات التنفيذ (20 دقيقة)", "الاستماع الأول والثاني (10 دقائق):\n- تهيئة البيئة الصفية وآداب الاستماع\n- الاستماع الأول للفكرة العامة\n- الاستماع الثاني ومناقشة المفردات بأقطاب المغناطيس: بغية (رغبة وطلب)، الوعرة (الصعبة)، هالني (أدهشني وأفزعني)، مستودع\n\nالاستماع الثالث (10 دقائق):\n- قطرات المطر: الموقع، كيفية الاكتشاف، أول من هبط، سبب الهبوط، عدد الفتحات\n- حل أسئلة الكتاب وتعبئة الجدول"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) أين يقع كهف مجلس الجن؟\nالإجابة النموذجية: في هضبة سلماة قرب قرية فنس بولاية قريات في محافظة مسقط\n2) (تطبيق) كيف اكتُشف الكهف؟\nالإجابة النموذجية: اكتُشف بالصدفة أثناء البحث عن احتياطات مائية جوفية في الصخور الكربونية\n3) (استدلال) كم عدد فتحات الكهف؟\nالإجابة النموذجية: ثلاث فتحات"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من أول من هبط داخل الكهف؟ ومتى؟\nالإجابة النموذجية: دون ديفيسون عام 1983م\n2) (تطبيق) لماذا كان الطريق إلى الكهف شاقًا؟\nالإجابة النموذجية: لأن الدروب وعرة، واحتاجوا إلى المشي ساعات طويلة والنزول بالحبال\n3) (استدلال) اقترح خدمتين يمكن تقديمها للترويج للكهف سياحيًا.\nالإجابة النموذجية: مثل: لوحات إرشادية ومرشدين مدرّبين، وطرق آمنة ومركز معلومات (تقبل الإجابات المناسبة)"], ["الغلق (3 دقائق)", "ملخص العمودين: عمود لأفكار النص وعمود (ماذا استفدت؟)"], ["الواجب المنزلي", "اكتب أربعة أسطر عن مزار طبيعي في ولايتك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=18"]]}, {"no": 32, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التحدث: قراءة صورة", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "50-51", "f": [["عنوان الدرس", "التحدث: قراءة صورة"], ["نواتج التعلم", "1. يتعرّف أنواع الصور ويحدد نوع صورة (عرضة الخيل)\n2. يصف المشهد وعناصره وألوانه وزاوية التقاطه\n3. يتحدث عن عناصر الهوية العمانية في الصورة بلغة فصيحة"], ["الاستراتيجيات", "العصف الذهني\nلعبة البازل\nH4"], ["مصادر التعلم", "كتاب الطالب ص50-51\nجهاز عرض للصورة مكبرة\nقطع بازل للصورة"], ["التهيئة (5 دقائق)", "- لعبة البازل لتجميع صورة (عرضة الخيل)\n- سؤال: ماذا يحدث في هذا المشهد؟"], ["إجراءات التنفيذ (20 دقيقة)", "الوصف المنظم (10 دقائق):\n- نوع الصورة (فوتوغرافية، تشكيلية، إعلانية، كاريكاتورية)\n- الألوان الظاهرة\n- المشهد الذي تمثله\n- زاوية وقوف المصور وأثرها\n- عناصر الحركة في الصورة الثابتة\n\nالتحدث (10 دقائق):\n- عناصر الهوية العمانية: الخيل العربية، الزي العماني، الخنجر، الفرسان، الجمهور\n- كل مجموعة تقدم حديثًا منظمًا لدقيقتين: مقدمة، وصف، رأي\n- تقويم الأداء بمعايير الفصاحة والتنظيم ولغة الجسد"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما نوع صورة (عرضة الخيل)؟\nالإجابة النموذجية: صورة فوتوغرافية\n2) (تطبيق) أين تبدو عناصر الحركة في الصورة رغم ثباتها؟\nالإجابة النموذجية: في انطلاق الخيل وارتفاع قوائمها وتطاير الغبار وحركة الفرسان\n3) (استدلال) اذكر عنصرين من عناصر الهوية العمانية في الصورة.\nالإجابة النموذجية: الزي العماني للفرسان، والخيل العربية الأصيلة (أو: الخنجر، العمامة)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف ألوان الصورة في جملتين.\nالإجابة النموذجية: وصف مناسب للألوان الظاهرة كبياض الثياب ولون الخيل والرمل والسماء\n2) (تطبيق) ما أثر زاوية التقاط الصورة في المشهد؟\nالإجابة النموذجية: تبرز سرعة الخيل وقوتها وتجعل المشاهد يشعر بالحركة\n3) (استدلال) تحدث في دقيقة عن رأيك في المحافظة على عرضة الخيل.\nالإجابة النموذجية: حديث فصيح منظم يبين قيمتها التراثية ووجوب المحافظة عليها"], ["الغلق (3 دقائق)", "H4: أكتب شعوري تجاه المشهد، وفكرة أعجبتني، وأرسم عنصرًا من الصورة"], ["الواجب المنزلي", "اكتب فقرة تصف فيها صورة لمناسبة وطنية عمانية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=19"]]}, {"no": 33, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 1, "n": 5, "wi": 5, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية سليمة مسترسلة مراعيًا علامات الترقيم\n2. ينطق الأعلام والأرقام والتواريخ نطقًا صحيحًا\n3. يتعرف نوع النص (سردي وصفي) وموضوعه"], ["الاستراتيجيات", "العصف الذهني\nالقراءة النموذجية والمحاكاة\nمسابقات القراءة"], ["مصادر التعلم", "كتاب الطالب ص52-54\nصور لجامع السلطان قابوس الأكبر مع صوت الأذان\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض صور لأشهر المساجد مصحوبة بصوت الأذان\n- نقاش: دور المسجد في تهذيب الأخلاق وتوطيد العلاقات\n- الوصول إلى العنوان"], ["إجراءات التنفيذ (20 دقيقة)", "القراءة النموذجية (10 دقائق):\n- قراءة نموذجية مع إبراز نطق التواريخ الهجرية والميلادية (1412هـ/1992م، 1415هـ/1995م، 2001م) والأرقام (1564، 330)\n- تدريب على نطق: الفسيفساء، المشربيات، الأرجواني، الأروقة\n\nقراءات الطلبة (10 دقائق):\n- قراءة الطلبة فقرات متتابعة\n- مسابقة القارئ المتألق\n- تصويب الأخطاء فور وقوعها"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) في أي عام صدرت التوجيهات السامية بإنشاء الجامع؟\nالإجابة النموذجية: عام 1412هـ (1992م)\n2) (تطبيق) متى افتُتح الجامع رسميًا؟\nالإجابة النموذجية: عام 2001م\n3) (استدلال) انطق كلمة (الفسيفساء) نطقًا صحيحًا واذكر معناها.\nالإجابة النموذجية: الفُسَيْفِساء: قطع صغيرة ملونة من الحجر أو الزجاج تُرصّ لتشكّل زخارف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم استمر البناء؟\nالإجابة النموذجية: ست سنوات متواصلة\n2) (تطبيق) ما خط كتابة الآيات القرآنية على أركان الجامع؟\nالإجابة النموذجية: خط الثلث\n3) (استدلال) اقرأ الفقرة الأخيرة قراءة جهرية معبرة.\nالإجابة النموذجية: قراءة سليمة تراعي الترقيم والضبط"], ["الغلق (3 دقائق)", "- قارئ الحصة يقرأ فقرة الحديقة\n- تمهيد للقراءة الصامتة"], ["الواجب المنزلي", "تدرّب على قراءة النص واكتب أرقام النص وتواريخه بالحروف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 34, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 2, "n": 5, "wi": 6, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يستنبط الفكرة العامة والأفكار الجزئية للنص\n2. يوضح دلالات المفردات في سياقاتها (أروقة، قباب، فوانيس، ينتابك)\n3. يحدد نوع الكلمة وجذرها الثلاثي"], ["الاستراتيجيات", "ملخصات العمودين\nالتعلم التعاوني\nالقراءة الصامتة الموجهة"], ["مصادر التعلم", "كتاب الطالب ص52-55\nأوراق ملخص العمودين\nبطاقات ممغنطة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق ووضع خط تحت المفردات الجديدة"], ["إجراءات التنفيذ (20 دقيقة)", "ثروتي اللغوية (10 دقائق):\n- إكمال النمط: أروقة جمع رواق (ممر خارجي محاط بأعمدة)، قباب جمع قبة، فوانيس جمع فانوس\n- تحديد نوع الكلمة وحروفها الأساسية: تبهرك (فعل مضارع: ب هـ ر)، المصقولة، مآذن، تبهج\n- معنى (ينتابك): يصيبك\n\nملخص العمودين (10 دقائق):\nتقسيم النص فقرات وتلخيص كل فقرة: التوجيهات السامية والهدف، مدة البناء والافتتاح، الانطباع الأول والآيات بخط الثلث، المآذن والقباب، الأبواب والحجارة، الأروقة والفوانيس، المكتبة، الحديقة"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: وصف جامع السلطان قابوس الأكبر وعمارته وأهدافه\n2) (تطبيق) ما مفرد (قباب)؟ وما معناه؟\nالإجابة النموذجية: قبة: بناء مستدير مقوس مجوف\n3) (استدلال) ما معنى (ينتابك)؟\nالإجابة النموذجية: يصيبك"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الحروف الأساسية لكلمة (مآذن)؟\nالإجابة النموذجية: أ ذ ن\n2) (تطبيق) لخص في جملة الفقرة الخاصة بالأروقة.\nالإجابة النموذجية: أروقة الجامع تمثل طرزًا معمارية لحضارات إسلامية مختلفة وتزينها فوانيس جميلة\n3) (استدلال) وظّف (تبهرك) في جملة من إنشائك.\nالإجابة النموذجية: مثل: تبهرك ألوان الحديقة في فصل الربيع"], ["الغلق (3 دقائق)", "عرض ملخصات العمودين وترتيب الأفكار الجزئية على السبورة"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية) في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 35, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 3, "n": 5, "wi": 7, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يبين الهدف من بناء الجامع كما ورد في النص\n2. يستدل على دقة تصميم الجامع من عناصره المعمارية\n3. يصف عناصر الجامع (المآذن، القبة، الأبواب، الأروقة) ودلالاتها"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص55-57\nصور تفصيلية للجامع\nورق A4"], ["التهيئة (5 دقائق)", "سؤال: لو زرت الجامع، ما أول شيء يلفت نظرك؟"], ["إجراءات التنفيذ (20 دقيقة)", "الهدف والتصميم (10 دقائق):\n- الهدف: ليس مكانًا للصلاة فقط، بل مركز للتفاعل مع روح الإسلام لا ينفصل فيه العلم عن العمل\n- دقة التصميم: الأحجار المصقولة يدويًا، الآيات بخط الثلث، المآذن الخمس، القبة ذات الغشاء المخرّم\n\nالخريطة (10 دقائق):\nخريطة مفاهيم لعناصر الجامع: المآذن (خمس ترمز إلى أركان الإسلام)، القبة (غشاء مخرم وطبقة فسيفساء ذهبية)، الأبواب (خشبية مزخرفة بمشربيات وزجاج ملون)، الحجارة (أبيض للمصلى وأرجواني لغيره)، الأروقة (330 فانوسًا)، المكتبة (نحو 20 ألف مجلد)"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) ما الهدف من بناء الجامع؟\nالإجابة النموذجية: أن يكون مركزًا للتفاعل مع روح الإسلام لا للصلاة فقط، لا ينفصل فيه العلم عن العمل\n2) (تطبيق) إلامَ ترمز المآذن الخمس؟\nالإجابة النموذجية: إلى أركان الإسلام الخمسة\n3) (استدلال) لماذا استُعمل حجران مختلفا اللون؟\nالإجابة النموذجية: الأبيض لحرم الصلاة والأرجواني لغيره ليُعطي تمايزًا جميلًا بين أماكن العبادة والأروقة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم مجلدًا تضم مكتبة الجامع تقريبًا؟\nالإجابة النموذجية: نحو عشرين ألف مجلد\n2) (تطبيق) من أين يتأصل طراز الشرفات التي تزين جدران المصلى؟\nالإجابة النموذجية: من عمارة القلاع العمانية\n3) (استدلال) دلّل على أن الجامع أعطى المكان بعدًا ثقافيًا.\nالإجابة النموذجية: أروقته متحف فني لحضارات إسلامية مختلفة، وفيه مكتبة كبيرة في شتى العلوم"], ["الغلق (3 دقائق)", "كل مجموعة تكتب جملة تبدأ بـ: جامع السلطان قابوس رمز لـ..."], ["الواجب المنزلي", "صمم بطاقة تعريفية بالجامع لزائر أجنبي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 36, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 4, "n": 5, "wi": 1, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يحدد خصائص النص السردي الوصفي\n2. يحاكي أساليب الوصف الواردة في النص\n3. يميز الجمل السردية من الوصفية في النص"], ["الاستراتيجيات", "التعلم التعاوني\nالمحاكاة\nتصنيف البطاقات"], ["مصادر التعلم", "كتاب الطالب ص56-58\nقصاصات ورقية لخصائص النص\nصندوق"], ["التهيئة (5 دقائق)", "- قراءة صامتة خمس دقائق\n- سؤال: هل يحكي النص قصة أم يصف مكانًا؟ أم كليهما؟"], ["إجراءات التنفيذ (20 دقيقة)", "الخصائص (10 دقائق):\n- الخصائص: سرد تاريخ إنشاء الجامع بتسلسل زمني، ووصف دقيق لعناصره المعمارية، واستعمال الأرقام والتواريخ، والألفاظ الحسية (تبهرك، تريح النظر)، والجمل الاسمية الوصفية\n- تصنيف جمل النص: سردية/وصفية\n\nالمحاكاة (10 دقائق):\n- محاكاة: (ما إن يتراءى الجامع أمام ناظريك حتى ينتابك إحساس...)\n- محاكاة: (لتشكل لوحة جمالية تريح النظر وتبهج النفس)\n- كتابة جملتين عن مكان في المدرسة بالأسلوب نفسه"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) اذكر خاصيتين من خصائص النص السردي الوصفي.\nالإجابة النموذجية: التسلسل الزمني للأحداث، والوصف الدقيق للمكان بتفا "], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اضبط: (حُفِر اسمُ الجامع على الواجهة).\nالإجابة النموذجية: حُفِرَ اسمُ الجامعِ على الواجهةِ\n2) (تطبيق) حوّل (يرسمُ الطالبُ اللوحةَ) إلى المجهول.\nالإجابة النموذجية: تُرسَمُ اللوحةُ\n3) (استدلال) حوّل (استقبل) إلى المجهول مع الضبط.\nالإجابة النموذجية: اُستُقبِلَ"], ["الغلق (3 دقائق)", "سباق تحويل بين المجموعات على السبورة"], ["الواجب المنزلي", "حوّل عشرة أفعال من الكتاب إلى المبني للمجهول مع الضبط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=21"]]}, {"no": 40, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "147-151", "f": [["عنوان الدرس", "الأنشطة النحوية: المبني للمعلوم والمبني للمجهول"], ["نواتج التعلم", "1. يحوّل جملًا من المبني للمعلوم إلى المبني للمجهول مع ملاحظة التغيرات\n2. يصوغ أمثلة على الجمل المبنية للمعلوم والمجهول\n3. يصحح أخطاء الضبط في الأفعال المحوّلة"], ["الاستراتيجيات", "فكر - زاوج - شارك\nعربة القطار\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص150-151\nبطاقات جمل\nأوراق عمل"], ["التهيئة (5 دقائق)", "عربة القطار: كل عربة فيها جملة مبنية للمعلوم يحولها الطالب ويمرر العربة"], ["إجراءات التنفيذ (20 دقيقة)", "التحويل (10 دقائق):\n- خطوات: حذف الفاعل، تغيير صورة الفعل، رفع المفعول به وجعله في مكان الفاعل\n- مثال: نقلَ البحارةُ البضائعَ ← نُقِلَت البضائعُ\n- ملاحظة تأنيث الفعل إذا كان ما بعده مؤنثًا\n\nالصياغة (10 دقائق):\n- كل زوج يكتب ثلاث جمل عن الوطن ويحولها\n- تبادل الأوراق والتصحيح\n- حل تدريبات الكتاب"], ["التقويم التكويني (5 دقائق)", "1) (معرفة) حوّل: (صنع الوستادُ السفينةَ).\nالإجابة النموذجية: صُنِعَت السفينةُ\n2) (تطبيق) لماذا قلنا (صُنِعَت) لا (صُنِعَ)؟\nالإجابة النموذجية: لأن الذي حل محل الفاعل (السفينة) مؤنث\n3) (استدلال) صحح الضبط: (يَحفَظُ القرآنُ في الصدور).\nالإجابة النموذجية: يُحفَظُ القرآنُ في الصدور"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حوّل: (يزورُ السياحُ الجامعَ).\nالإجابة النموذجية: يُزا
