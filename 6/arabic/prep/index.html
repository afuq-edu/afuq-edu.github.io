لاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) لماذا وُضعت خريطة سلطنة عمان في الشعار؟\nالإجابة النموذجية: لأن الشعار يمثل جهة عمانية وعملها يشمل الوطن كله\n2) (تطبيق) إلامَ ترمز الأغصان المفتوحة الممتدة؟\nالإجابة النموذجية: إلى العطاء والامتداد والنمو وإيصال الخير إلى الناس\n3) (استدلال) لماذا غلب اللون الأخضر على الشعار؟\nالإجابة النموذجية: لأنه لون الخير والنماء والحياة والسلام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما وظيفة الشعار لأي مؤسسة؟\nالإجابة النموذجية: يعرّف بها ويختصر رسالتها في رمز سهل التذكر\n2) (تطبيق) لماذا تبدو صورة الشعار بسيطة قليلة الخطوط والألوان؟\nالإجابة النموذجية: ليسهل تذكره وتمييزه وطباعته في أي حجم\n3) (استدلال) اقترح عنصرًا تضيفه إلى الشعار مع التعليل.\nالإجابة النموذجية: مثل: يدان متصافحتان تعبيرًا عن التعاون (تقبل الإجابات المعللة)"], ["الواجب المنزلي", "اجمع صورة شعار مؤسسة عمانية واكتب ثلاث دلالات لعناصره.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=2"]]}, {"no": 3, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التحدث: قراءة شعار", "k": 2, "n": 2, "wi": 3, "wn": 7, "pages": "20-21", "f": [["عنوان الدرس", "التحدث: قراءة شعار"], ["نواتج التعلم", "1. يصف كتابة الشعار من حيث الخط والحجم واللون (15 دقيقة)\n2. يقارن بين الكتابة وصورة الشعار (5 دقائق)\n3. يتحدث بلغة فصيحة عن تعبير الشعار عن الأعمال الخيرية (20 دقيقة)"], ["الاستراتيجيات", "التصميم والتشكيل\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص21\nجهاز عرض\nأوراق رسم وألوان لكل مجموعة\nأنموذج شعار"], ["التهيئة (5 دقائق)", "عرض شعارين مختلفين وسؤال: أيهما أوضح كتابة؟ ولماذا؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. وصف الكتابة والمقارنة: مناقشة الخط ونوعه والحجم واللون؛ المقارنة بين حجم الكتابة وحجم الصورة ولونيهما؛ ربط الشعار بالأعمال الخيرية (10 دقائق)\nالاستراتيجيات: التصميم والتشكيل.\n\n2. التصميم والتحدث: كل مجموعة تصمم شعارًا لعمل خيري مدرسي؛ ممثل كل مجموعة يتحدث دقيقتين عن شعارها: عناصره ودلالاته؛ تقويم الحديث بمعايير: الفصاحة، التنظيم، الوضوح (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – شعار حملة خيرية: تصمم كل مجموعة بالكلمات شعارًا لحملة خيرية عمانية متخيلة، تختار له خريطة عمان أو النخلة أو ألوان العلم، وتعلل دلالة كل عنصر على العمل الخيري (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) صف الكتابة في الشعار من حيث الحجم.\nالإجابة النموذجية: الكتابة أصغر من الصورة لتكون الصورة هي العنصر الأبرز\n2) (تطبيق) قارن بين لون الكتابة ولون الصورة.\nالإجابة النموذجية: تتناسق ألوانهما ويغلب الأخضر ليتوحد الشعار بصريًا\n3) (استدلال) كيف يعبّر الشعار عن الأعمال الخيرية؟\nالإجابة النموذجية: بالأغصان الممتدة التي توحي بالعطاء وبالخريطة التي تدل على شموله الوطن"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر نوعين من الشعارات.\nالإجابة النموذجية: شعارات المؤسسات، وشعارات المناسبات والحملات\n2) (تطبيق) ما شروط التحدث الجيد أمام الزملاء؟\nالإجابة النموذجية: الفصاحة، وتنظيم الأفكار، ووضوح الصوت، واستعمال إشارات اليد وتعبيرات الوجه\n3) (استدلال) انقد شعار مجموعة أخرى بذكر ميزة واقتراح تحسين.\nالإجابة النموذجية: تقبل الإجابات التي تذكر ميزة واضحة واقتراحًا معللًا"], ["الواجب المنزلي", "صمّم شعارًا لأسرتك واكتب تحته سطرين عن دلالته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=2"]]}, {"no": 4, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 1, "n": 4, "wi": 4, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية سليمة معبّرة مراعيًا علامات الترقيم (15 دقيقة)\n2. يتعرّف الكاتب عادل الكلباني ونوع النص (سيرة ذاتية) (15 دقيقة)\n3. ينطق الكلمات الجديدة نطقًا صحيحًا (اللومي، الجحال، البرغام، البيذامة) (10 دقائق)"], ["الاستراتيجيات", "النصف والنصف الآخر\nأعواد المثلجات\nالقراءة النموذجية والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص22-25\nصور لأدوات تراثية (الجحلة، البرغام)\nجهاز عرض"], ["التهيئة (5 دقائق)", "- سؤال: اذكر حدثًا من طفولتك ما زال عالقًا في ذاكرتك\n- الإجابة عن أسئلة (اكتشف النص) والتعريف بالكاتب"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة النموذجية: تذكير بأهداف القراءة الجهرية (المخارج، الترقيم، الطلاقة، الضبط)؛ قراءة نموذجية من المعلم؛ تدريب على نطق المفردات التراثية مع صورها (10 دقائق)\nالاستراتيجيات: النصف والنصف الآخر.\n\n2. قراءات: قراءة الطلبة فقرات متتابعة بدءًا بالمجيدين؛ تصويب الأخطاء فور وقوعها؛ اختيار قارئ الحصة بأعواد المثلجات (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n3. الغلق: قارئ الحصة يقرأ أجمل فقرة في رأيه، ذكر سبب اختياره لها (3 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الشراب الذي كانت الجدة تصنعه في الصيف؟\nالإجابة النموذجية: عصير الليمون الذي يسمونه (حار بارد)\n2) (تطبيق) ما معنى (الجحال)؟\nالإجابة النموذجية: جرار للماء، مفردها جحلة\n3) (استدلال) لماذا قرأتَ عبارة «أوه سعووود، أوه عبووود» بنبرة مختلفة؟\nالإجابة النموذجية: لأنها نداء النساء على أطفالهن، فتقرأ بنبرة النداء المرتفعة الممدودة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟ وما المصدر؟\nالإجابة النموذجية: عادل الكلباني، كتاب (مقنيات وطن وطفولة)\n2) (تطبيق) ما الوقت الذي كانت النساء ينادين فيه أطفالهن؟ ولماذا؟\nالإجابة النموذجية: وقت الغسق عند المغيب، خوفًا عليهم من حشرات الظلام\n3) (استدلال) اقرأ الفقرة الأولى قراءة معبرة، ثم بيّن موضعين لعلامات الترقيم وأثرهما في قراءتك.\nالإجابة النموذجية: قراءة سليمة، مع بيان الوقف عند الفاصلة والنقطة وتغيّر النبرة عند علامة التعجب أو التنصيص"], ["الواجب المنزلي", "تدرّب على قراءة النص قراءة جهرية واستخرج ثلاث كلمات تراثية وابحث عن معانيها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 5, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 2, "n": 4, "wi": 5, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يستنتج الفكرة العامة للنص (5 دقائق)\n2. يحدد الأفكار الجزئية لفقرات النص (15 دقيقة)\n3. يحلل المفردات الجديدة في سياقها (ثروتي اللغوية) (20 دقيقة)"], ["الاستراتيجيات", "القراءة الصامتة الموجهة\nالنصف والنصف الآخر\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص22-26\nبطاقات بيض مفقوس (كلمة/معنى)\nالسبورة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع وضع خط تحت المفردات غير الواضحة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الفكرة العامة والأفكار الجزئية: أسئلة عامة توصل إلى الفكرة العامة: ذكريات الطفولة في القرية وحياتها الاجتماعية؛ تقسيم النص: الجدة وعصير الصيف، المساء والليل في القرية، السبلة تحت شجرة البيذام، خميس وشجرته (10 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة.\n\n2. ثروتي اللغوية: استراتيجية البيض المفقوس: نصف البيضة كلمة والنصف الآخر معناها؛ التعويض عن الكلمات بين القوسين (تصنع، قبالة، تتوغل، تغمر) (10 دقائق)\nالاستراتيجيات: النصف والنصف الآخر.\n\n3. الغلق: كل مجموعة تكتب فكرة جزئية على بطاقة وترتب البطاقات على السبورة حسب تسلسل النص (3 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: صور من ذكريات طفولة الكاتب في قريته وحياة أهلها الاجتماعية\n2) (تطبيق) ما معنى (قبالة)؟\nالإجابة النموذجية: مقابل أو أمام\n3) (استدلال) ما الفكرة الجزئية للفقرة التي تتحدث عن السبلة؟\nالإجابة النموذجية: اجتماع أهل القرية في السبلة للتشاور وحل مشكلاتهم"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج من النص كلمة بمعنى (ينزل ويدخل عميقًا).\nالإجابة النموذجية: تتوغل\n2) (تطبيق) ضع كلمة (يتحلّق) في جملة من إنشائك.\nالإجابة النموذجية: مثل: يتحلّق الطلبة حول معلمهم ليستمعوا إلى القصة\n3) (استدلال) لماذا شبّه الكاتب الليل بقط أسود يزحف؟\nالإجابة النموذجية: ليصوّر قدوم الظلام بطيئًا خفيًا وهو يغطي الأمكنة شيئًا فشيئًا"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية) في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 6, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 3, "n": 4, "wi": 6, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يصف مظاهر الحياة الاجتماعية في القرية العمانية كما صوّرها النص (15 دقيقة)\n2. يبيّن الدور الإيجابي للسبلة في المجتمع العماني (5 دقائق)\n3. يحلل مواقف شخصيات النص (الجدة، خميس) بالقبعات الست (20 دقيقة)"], ["الاستراتيجيات", "القبعات الست\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص26-28\nبطاقات القبعات الملونة\nمقطع مرئي عن السبلة العمانية"], ["التهيئة (5 دقائق)", "عرض مقطع قصير عن السبلة العمانية وسؤال: ماذا يحدث في السبلة؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. القبعات الست: البيضاء: متى تصنع الجدة العصير؟ ولماذا تصرخ النساء وقت الغسق؟؛ الحمراء: موقف الصغار من بيذامة خميس، وشعور الكاتب مبتسمًا باكيًا؛ السوداء: الألفاظ السلبية في وصف الليل؛ الصفراء: دور السبلة الإيجابي؛ الزرقاء: كيف تتعامل مع قوانين خميس؟ (10 دقائق)\nالاستراتيجيات: القبعات الست.\n\n2. عرض: تعرض كل مجموعة إجابتها؛ المعلم يدوّن مظاهر الحياة الاجتماعية: التعاون، التشاور، الأمان، الترابط (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: جملة ختامية: ذكريات الطفولة تبث في النفس الإحساس بقيمة الحياة، كل طالب يكتب كلمة تصف قريته أو حيّه (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما دور السبلة في القرية؟\nالإجابة النموذجية: مكان يجتمع فيه الأهالي للتشاور وإيجاد الحلول لمشكلات القرية بهدوء ورأي رزين\n2) (تطبيق) كيف كان الأهالي يُدعَون إلى السبلة؟\nالإجابة النموذجية: بالنفخ في بوق يسمونه البرغام\n3) (استدلال) ماذا كان خميس يسمح للأطفال به؟ وماذا يمنعهم؟\nالإجابة النموذجية: يسمح بأخذ ما يسقط على الأرض من الثمار، ويمنعهم من الاقتراب من الشجرة وصعودها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر مظهرين من مظاهر الحياة الاجتماعية في القرية.\nالإجابة النموذجية: التشاور في السبلة، ونداء الأمهات على الأطفال خوفًا عليهم\n2) (تطبيق) بماذا تفسر ابتسام الكاتب ودمعته عندما يمر بالمكان اليوم؟\nالإجابة النموذجية: يبتسم لجمال الذكريات ويبكي حنينًا إلى زمن الطفولة الذي مضى\n3) (استدلال) هل كان خميس محقًا في منع الأطفال من صعود الشجرة؟ علّل.\nالإجابة النموذجية: نعم، لأنه يحمي الشجرة من الكسر ويحمي الأطفال من السقوط، وقد أباح لهم ما سقط منها (تقبل الآراء المعللة)"], ["الواجب المنزلي", "اكتب فقرة قصيرة تصف فيها مكانًا يجتمع فيه أهل حيّك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 7, "w": 1, "wl": "الأول", "date": "6-10 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الأول: صور من قريتي", "k": 4, "n": 4, "wi": 7, "wn": 7, "pages": "22-31", "f": [["عنوان الدرس", "الدرس الأول: صور من قريتي"], ["نواتج التعلم", "1. يستنبط خصائص السيرة الذاتية من النص (15 دقيقة)\n2. يستخلص القيم الإيجابية التي تضمنها النص (15 دقيقة)\n3. يحاكي أسلوب الكاتب في وصف مشهد من طفولته (10 دقائق)"], ["الاستراتيجيات", "أعواد المثلجات\nالكرسي الساخن\nالمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص28-31\nبطاقات ملونة لخصائص السيرة\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال بأعواد المثلجات: بأي ضمير يتحدث الكاتب؟ عن أي زمن؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. خصائص السيرة الذاتية: أسئلة بالهمزة: أيقوم النص على الحوار أم السرد؟ أالأحداث واقعية أم خيالية؟ أالزمن ماضٍ أم حاضر؟ أالضمير للمتكلم أم للغائب؟؛ تدوين الخصائص في بطاقات ملونة على السبورة (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n2. القيم والمحاكاة: استخلاص القيم: الترابط الأسري، احترام الكبير، التشاور، المحافظة على الممتلكات؛ محاكاة جملة الكاتب في التشبيه: كعصافير صغيرة، كطاووس يفرد جناحيه (8 دقائق)\nالاستراتيجيات: الكرسي الساخن.\n\n3. غلق الدرس – متحف قريتي الصغير: تختار كل مجموعة كلمة تراثية من النص مثل «الجحال» أو «اللومي»، وتشرح استعمالها في البيت العماني قديمًا كما ورد في السيرة، ثم تقترح مجموعة أخرى ما يقابلها اليوم (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر خاصيتين من خصائص السيرة الذاتية.\nالإجابة النموذجية: السرد بضمير المتكلم، وأحداث واقعية من حياة الكاتب في زمن ماضٍ\n2) (تطبيق) استخرج قيمة إيجابية من النص.\nالإجابة النموذجية: التشاور في حل المشكلات، أو احترام ممتلكات الآخرين، أو الترابط الأسري\n3) (استدلال) حاكِ: (نتابعها بأعيننا كعصافير صغيرة).\nالإجابة النموذجية: مثل: نترقب عودته من السفر كزهور تنتظر المطر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما نوع النص؟ وما الدليل؟\nالإجابة النموذجية: سيرة ذاتية، لأن الكاتب يروي أحداثًا واقعية عاشها بضمير المتكلم\n2) (تطبيق) ما القيمة التي تتعلمها من موقف أهل القرية في السبلة؟\nالإجابة النموذجية: أهمية الشورى والحوار الهادئ في حل المشكلات\n3) (استدلال) اكتب جملتين تصف فيهما مشهدًا من طفولتك بأسلوب السيرة الذاتية.\nالإجابة النموذجية: نص قصير بضمير المتكلم عن حدث واقعي ماضٍ مع وصف حسي (تقبل الإجابات المناسبة)"], ["الواجب المنزلي", "حل بقية أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=3"]]}, {"no": 8, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: المضاف إليه", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "113-118", "f": [["عنوان الدرس", "الأنشطة النحوية: المضاف إليه"], ["نواتج التعلم", "1. يتعرّف تركيب الإضافة (المضاف والمضاف إليه) (15 دقيقة)\n2. يميّز المضاف من المضاف إليه في الجمل (5 دقائق)\n3. يستنتج أن المضاف إليه مجرور دائمًا (20 دقيقة)"], ["الاستراتيجيات", "القصة المصورة\nأقطاب المغناطيس\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص113-115\nجهاز عرض لعرض القصة\nبطاقات زرقاء وحمراء"], ["التهيئة (5 دقائق)", "- قصة مصورة: حروف الجر في بيت المجرورات يطرق بابها (المضاف والمضاف إليه) يطلبان الانضمام\n- سؤال: كيف يكون اسم مجرورًا دون حرف جر؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: قراءة أمثلة الكتاب من نص (صور من قريتي): شجرة اللومي، أهل القرية، صوت المؤذن؛ ملاحظة الكلمة الثانية: اسم مجرور جاء بعد اسم ليكمل معناه؛ استنتاج تعريف المضاف إليه (10 دقائق)\nالاستراتيجيات: القصة المصورة.\n\n2. التمييز: أقطاب المغناطيس: بطاقة زرقاء للمضاف وحمراء للمضاف إليه ويجذب الطلبة الأزواج الصحيحة؛ فكر زاوج شارك: استخراج تراكيب الإضافة من فقرة (10 دقائق)\nالاستراتيجيات: أقطاب المغناطيس.\n\n3. الغلق: ورقة خروج: كل طالب يكتب تركيبَي إضافة من بيئة الصف (3 دقائق)\nالاستراتيجيات: فكر."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما المضاف إليه؟\nالإجابة النموذجية: اسم مجرور يأتي بعد اسم آخر ليكمل معناه ويخصّصه\n2) (تطبيق) حدّد المضاف والمضاف إليه: (صوتُ المؤذنِ).\nالإجابة النموذجية: صوت: مضاف، المؤذن: مضاف إليه مجرور\n3) (استدلال) هل يُنوّن المضاف؟ علّل من الأمثلة.\nالإجابة النموذجية: لا يُنوَّن المضاف، نقول: كتابُ الطالبِ لا كتابٌ الطالبِ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) استخرج تركيب إضافة من: (يجتمع أهلُ القريةِ في السبلة).\nالإجابة النموذجية: أهلُ القريةِ\n2) (تطبيق) كوّن تركيب إضافة من (حديقة – المدرسة) في جملة.\nالإجابة النموذجية: مثل: زرعنا حديقةَ المدرسةِ بالأزهار\n3) (استدلال) ما حكم المضاف إليه الإعرابي؟\nالإجابة النموذجية: مجرور دائمًا"], ["الواجب المنزلي", "استخرج خمسة تراكيب إضافة من نص (مدرستي الأولى).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=4"]]}, {"no": 9, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: المضاف إليه", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "113-118", "f": [["عنوان الدرس", "الأنشطة النحوية: المضاف إليه"], ["نواتج التعلم", "1. يعرب المضاف والمضاف إليه إعرابًا صحيحًا (5 دقائق)\n2. يميز علامة جر المضاف إليه (الكسرة، الياء في المثنى وجمع المذكر) (15 دقيقة)\n3. يوظف المضاف إليه في جمل وفقرة قصيرة (20 دقيقة)"], ["الاستراتيجيات", "شطيرة الإعراب\nوقّع لي\nالخرائط المعرفية"], ["مصادر التعلم", "كتاب الطالب ص115-118\nأوراق ملونة لشطيرة الإعراب\nالسبورة"], ["التهيئة (5 دقائق)", "لعبة (وقّع لي): يتجول الطلبة ويجمعون توقيع زميل يذكر تركيب إضافة صحيحًا"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإعراب: نموذج إعراب: (ساحةُ المدرسةِ واسعةٌ): ساحة مبتدأ مرفوع وهو مضاف، المدرسة مضاف إليه مجرور بالكسرة؛ شطيرة الإعراب: طبقة للكلمة وطبقة لموقعها وطبقة لعلامتها؛ أمثلة: كتابا الطالبين، معلمو المدرسة (10 دقائق)\nالاستراتيجيات: شطيرة الإعراب.\n\n2. التطبيق: حل تدريبات الكتاب؛ خريطة معرفية للمضاف إليه: تعريفه، حكمه، علامات جره، أمثلة؛ توظيف في فقرة من ثلاث جمل عن الأسرة (8 دقائق)\nالاستراتيجيات: وقّع لي.\n\n3. غلق الدرس – إضافات من تراثنا: تتسابق المجموعات في تكوين تراكيب إضافية من التراث العماني، مثل «صناعةُ الفخارِ» و«نخيلُ الواحةِ» و«خنجرُ الجدِّ»، وتضبط المضاف إليه، وتنال نقطة عن كل تركيب صحيح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أعرب (المدرسةِ) في: ساحةُ المدرسةِ واسعة.\nالإجابة النموذجية: مضاف إليه مجرور وعلامة جره الكسرة الظاهرة\n2) (تطبيق) ما علامة جر المضاف إليه في (حقيبةُ المعلمَيْنِ)؟\nالإجابة النموذجية: الياء لأنه مثنى\n3) (استدلال) لماذا حُذفت النون من (معلمو) في (معلمو المدرسة)؟\nالإجابة النموذجية: لأن جمع المذكر السالم أضيف فتحذف نونه عند الإضافة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب ما تحته خط: (قرأتُ كتابَ الأدبِ). كتابَ: ...\nالإجابة النموذجية: مفعول به منصوب وعلامة نصبه الفتحة وهو مضاف\n2) (تطبيق) اجعل (القرية) مضافًا إليه في جملة.\nالإجابة النموذجية: مثل: أحبُّ هدوءَ القريةِ\n3) (استدلال) اكتب جملتين تشتملان على مضاف إليه مثنى وجمع مذكر سالم.\nالإجابة النموذجية: مثل: صافحتُ والدَي الطالبين، واستمعتُ إلى نصائحِ المعلمين"], ["الواجب المنزلي", "حل تدريبات الكتاب المتبقية في درس المضاف إليه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=4"]]}, {"no": 10, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة الإملائية: علامة الحذف والقوسان الهلاليان", "k": 1, "n": 1, "wi": 3, "wn": 7, "pages": "119-122", "f": [["عنوان الدرس", "الأنشطة الإملائية: علامة الحذف والقوسان الهلاليان"], ["نواتج التعلم", "1. يتعرّف شكل علامة الحذف (...) والقوسين الهلاليين ( ) (15 دقيقة)\n2. يذكر مواضع استعمال كل منهما (15 دقيقة)\n3. يضعهما في مواضعهما الصحيحة في جمل (10 دقائق)"], ["الاستراتيجيات", "مسرح الدمى\nعربة القطار\nمن أنا؟"], ["مصادر التعلم", "كتاب الطالب ص119-122\nدمى\nبطاقات ممغنطة لعلامات الترقيم"], ["التهيئة (5 دقائق)", "مسرح الدمى: طالبان في طريقهما إلى مدينة الترقيم لحضور حفل تعريف بعلامة الحذف والقوسين"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: قراءة أمثلة الكتاب ومنها البرغام والجحال بين قوسين في نص (صور من قريتي)؛ استنتاج مواضع علامة الحذف: الكلام المحذوف أو المقتبس جزء منه، أو ما يُستحيا من ذكره؛ مواضع القوسين: الشرح والتفسير، والكلمة الدخيلة أو التوضيحية، والأرقام والإحالات (10 دقائق)\nالاستراتيجيات: مسرح الدمى.\n\n2. التطبيق: لعبة (من أنا؟): بطاقة تصف موضعًا ويحدد الطلبة العلامة؛ عربة القطار: كل عربة جملة ناقصة العلامة يكملها الطلبة (8 دقائق)\nالاستراتيجيات: عربة القطار.\n\n3. غلق الدرس – أكمل جملة الحرف: يكتب المعلم جملة عن الحرف العمانية تنتهي بعلامة الحذف (الفخار، والنسيج...)، فتكمل كل مجموعة المحذوف، وتضيف بين قوسين اسم ولاية تشتهر بإحدى الحرف مثل (بهلا) (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما شكل علامة الحذف؟\nالإجابة النموذجية: ثلاث نقاط أفقية متتابعة (...)\n2) (تطبيق) متى نستعمل القوسين الهلاليين؟\nالإجابة النموذجية: لحصر الكلمات المفسّرة أو الشارحة أو التوضيحية في الكلام\n3) (استدلال) ضع العلامة المناسبة: كان يحمل في حقيبته كتبًا وأقلامًا وأدوات\nالإجابة النموذجية: كان يحمل في حقيبته كتبًا وأقلامًا وأدوات... (علامة الحذف لأن الكلام محذوف منه بقية)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ضع القوسين في مكانهما: تقف الجدة قبالة شجرة اللومي الليمون.\nالإجابة النموذجية: تقف الجدة قبالة شجرة اللومي (الليمون)\n2) (تطبيق) ميّز موضع العلامة في: (قال الشاعر: هي الأخلاق تنبت كالنبات...).\nالإجابة النموذجية: علامة حذف لاقتباس جزء من القول\n3) (استدلال) اكتب جملة تحتاج إلى القوسين وأخرى تحتاج إلى علامة الحذف.\nالإجابة النموذجية: مثل: زرنا (السبلة) أي مجلس القرية. / في السوق فواكه كثيرة: تفاح وموز وبرتقال..."], ["الواجب المنزلي", "استخرج من كتاب القراءة مثالين للقوسين ومثالًا لعلامة الحذف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=5"]]}, {"no": 11, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "خط الرقعة: (ط، ظ)", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "123", "f": [["عنوان الدرس", "خط الرقعة: (ط، ظ)"], ["نواتج التعلم", "1. يرسم حرفي الطاء والظاء مجرّدين بخط الرقعة رسمًا صحيحًا (15 دقيقة)\n2. يكتب الحرفين في أول الكلمة ووسطها وآخرها (5 دقائق)\n3. يكتب جملة بخط الرقعة مراعيًا تناسق الحروف وخط القاعدة (20 دقيقة)"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص123\nأقلام ذات رأس مشطوف\nأوراق ملاحظات لاصقة\nمقطع مرئي لرسم حرف الطاء بالرقعة"], ["التهيئة (5 دقائق)", "- تذكير بخط القاعدة وما يرتكز عليه من الحروف\n- مقارنة الطاء والظاء بخط النسخ وبخط الرقعة على السبورة المقسمة ثلاثة أقسام"], ["إجراءات التنفيذ (23 دقيقة)", "1. النمذجة: المعلم يكتب الطاء والظاء مجردين أمام الطلبة ببطء موضحًا اتجاه القلم ومكان الألف القائمة؛ ثم الحرفين متصلين: طيب، يحفظ، خط، لفظ؛ ملاحظة أن الحرفين يرتكزان على خط القاعدة (10 دقائق)\nالاستراتيجيات: ورق الملاحظات.\n\n2. المحاكاة: الطلبة يحاكون في الكتاب السطر تلو السطر؛ ورق الملاحظات: المعلم يكتب ملاحظة تصويب على ورقة لاصقة بجانب الخطأ؛ كتابة جملة الكتاب بخط الرقعة (8 دقائق)\nالاستراتيجيات: النمذجة والمحاكاة.\n\n3. غلق الدرس – ظفار بخط الرقعة: تكتب المجموعات بخط الرقعة كلمات عمانية فيها الطاء أو الظاء في مواضع مختلفة، مثل «ظفار» و«الباطنة» و«مسقط» و«الظاهرة»، ثم تتبادل التقييم وفق قواعد الرسم (5 دقائق)\nالاستراتيجيات: المعرض الجوال."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) هل يرتكز حرف الطاء في الرقعة على خط القاعدة أم ينزل عنه؟\nالإجابة النموذجية: يرتكز على خط القاعدة\n2) (تطبيق) ما الفرق في الرسم بين الطاء والظاء؟\nالإجابة النموذجية: النقطة فوق الظاء فقط، والشكل واحد\n3) (استدلال) اكتب كلمة (حافظ) بخط الرقعة.\nالإجابة النموذجية: تقويم الرسم: اتصال الحروف صحيح، والظاء على خط القاعدة بقائم مائل قليلًا"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الطاء والظاء مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي حسب قواعد الرسم\n2) (تطبيق) اكتب كلمتين فيهما الطاء في الوسط والآخر.\nالإجابة النموذجية: مثل: مطر، شرط مكتوبتين بالرقعة\n3) (استدلال) اكتب جملة: (النظافة من الإيمان) بخط الرقعة.\nالإجابة النموذجية: تقويم: تناسق الحجم والمسافات وارتكاز الحروف على السطر"], ["الواجب المنزلي", "أكمل التدريب في الكتاب وكرر الجملة ثلاث مرات في كراسة الخط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=6"]]}, {"no": 12, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: تلخيص نص سردي", "k": 1, "n": 1, "wi": 5, "wn": 7, "pages": "124-126", "f": [["عنوان الدرس", "التعبير: تلخيص نص سردي"], ["نواتج التعلم", "1. يحدد الأفكار الرئيسة والأحداث المهمة في نص سردي (5 دقائق)\n2. يميز الجمل الأساسية من غير الأساسية ويحذف الأخيرة (25 دقيقة)\n3. يعيد صياغة النص بإيجاز موظفًا أدوات الربط (10 دقائق)"], ["الاستراتيجيات", "محطات رحلة التلخيص\nالتعلم التعاوني\nلعبة شمس قمر"], ["مصادر التعلم", "كتاب الطالب ص124-126\nجهاز الفاكس كام\nبطاقات ممغنطة لأدوات الربط"], ["التهيئة (5 دقائق)", "لعبة (شمس قمر) بين فريقين بأسئلة: عرّف التلخيص، ما أدوات الربط؟ ما الهدف من الجمل غير الأساسية؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. محطات التلخيص: المحطة 1: قراءة النص قراءة فاحصة؛ المحطة 2: تحديد الأحداث الرئيسة والشخصيات؛ المحطة 3: شطب الجمل الوصفية والتفصيلات غير الأساسية؛ المحطة 4: الربط بأدوات مثل: ثم، بعد ذلك، وأخيرًا، لذلك (10 دقائق)\nالاستراتيجيات: محطات رحلة التلخيص.\n\n2. التطبيق الجماعي: كل مجموعة تلخص فقرة من نص الكتاب في جملتين؛ جمع الملخصات في نص واحد متسلسل؛ قراءة الملخص النهائي وتقويمه بقائمة: الإيجاز، الترتيب، الربط، سلامة اللغة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – حكاية الفلج في سطرين: يروي المعلم حكاية قصيرة عن أهل قرية عمانية تعاونوا في إصلاح فلجهم، فيلخصها كل زوج في جملتين موظفًا أدوات الربط، ويستخرج قيمة التعاون منها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما التلخيص؟\nالإجابة النموذجية: إعادة كتابة النص بإيجاز مع الاحتفاظ بأفكاره وأحداثه الرئيسة بلغة الملخِّص\n2) (تطبيق) بمَ تعرف الجملة غير الأساسية؟\nالإجابة النموذجية: تحمل وصفًا أو تفصيلًا أو تكرارًا ولا يختل الحدث بحذفها\n3) (استدلال) اذكر ثلاث أدوات ربط مناسبة للتلخيص.\nالإجابة النموذجية: ثم، بعد ذلك، وأخيرًا (أو: لذلك، في حين)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) لخّص قصة (قسمة إيثار) في ثلاث جمل.\nالإجابة النموذجية: عاش أخوان مع والديهما في ألفة، وبعد وفاتهما اقتسما المحصول بالتساوي، ثم نقل كل منهما رزمًا إلى أخيه ليلًا إيثارًا، حتى التقيا في الحقل فتعانقا\n2) (تطبيق) أيهما يُحذف عند التلخيص: (كان الجو باردًا والقمر ساطعًا) أم (نقل الأخ الرزم إلى حصة أخيه)؟\nالإجابة النموذجية: الأولى لأنها وصف غير أساسي\n3) (استدلال) لماذا يجب أن يكون الملخص بأسلوب الطالب لا بنسخ جمل النص؟\nالإجابة النموذجية: ليدل على فهمه للنص وقدرته على صياغة الأفكار بإيجاز"], ["الواجب المنزلي", "لخص قصة قرأتها حديثًا في خمسة أسطر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=7"]]}, {"no": 13, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثاني: مدرستي الأولى", "k": 1, "n": 4, "wi": 6, "wn": 7, "pages": "32-39", "f": [["عنوان الدرس", "الدرس الثاني: مدرستي الأولى"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية معبّرة عن المعنى (15 دقيقة)\n2. يتعرّف الكاتب أحمد أمين وكتابه (حياتي) (15 دقيقة)\n3. يلتزم بأهداف القراءة: المخارج، الترقيم، الطلاقة، الضبط (10 دقائق)"], ["الاستراتيجيات", "القراءة النموذجية والمحاكاة\nالعصف الذهني\nأعواد المثلجات"], ["مصادر التعلم", "كتاب الطالب ص32-35\nصورة لمدرسة وأخرى لبيت\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض صورتين: مدرسة وبيت\n- سؤال: أي المكانين تعلمت فيه أول دروسك؟ ولماذا؟\n- أسئلة (اكتشف النص)"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة النموذجية: تذكير بأهداف القراءة الجهرية؛ قراءة نموذجية من المعلم مع إبراز نبرة الحنين والاعتزاز؛ تحديد الكلمات الصعبة نطقًا: مولعًا، الأميرية، يقتني، صرامته (10 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة.\n\n2. قراءات: قراءة فقرات متتابعة بدءًا بالمجيدين؛ تصويب فوري؛ التركيز على الوقف عند الفواصل في الجمل الطويلة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. أكمل الفكرة: يبدأ المعلم جملة عن الثاني: مدرستي الأولى، ويكملها الطلبة بالتناوب حتى يكتمل ملخص الحصة على السبورة (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) لماذا سمّى الكاتب البيت (مدرستي الأولى)؟\nالإجابة النموذجية: لأنه تعلم فيه أهم دروسه في الحياة وتكوّنت فيه شخصيته\n2) (تطبيق) ما أكثر ما كان في البيت وأثمنه؟\nالإجابة النموذجية: الكتب\n3) (استدلال) في أي عام ولد الكاتب؟\nالإجابة النموذجية: سنة 1886م"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟ وما مصدره؟\nالإجابة النموذجية: أحمد أمين، من كتابه (حياتي)\n2) (تطبيق) ما طابع البيت كما وصفه الكاتب؟\nالإجابة النموذجية: البساطة والنظافة\n3) (استدلال) اقرأ الفقرة التي تصف الأب قراءة معبّرة.\nالإجابة النموذجية: قراءة تبرز الاحترام والهيبة مع مراعاة الوقف"], ["الواجب المنزلي", "تدرّب على قراءة النص واستخرج ثلاث كلمات تدل على البساطة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=8"]]}, {"no": 14, "w": 2, "wl": "الثاني", "date": "13-17 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثاني: مدرستي الأولى", "k": 2, "n": 4, "wi": 7, "wn": 7, "pages": "32-39", "f": [["عنوان الدرس", "الدرس الثاني: مدرستي الأولى"], ["نواتج التعلم", "1. يستنبط الفكرة العامة والأفكار الجزئية للنص (15 دقيقة)\n2. يحلل المفردات الجديدة ويوظفها في جمل (5 دقائق)\n3. يرتب المفردات حسب الحرف الأول هجائيًا (20 دقيقة)"], ["الاستراتيجيات", "سكامبر (إعادة الترتيب)\nربطة الحذاء\nالقراءة الصامتة الموجهة"], ["مصادر التعلم", "كتاب الطالب ص32-37\nبطاقات ملونة للمفردات\nصورة حذاء بأربطة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع وضع خط تحت المفردات غير الواضحة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الأفكار: الفكرة العامة: أثر البيت والأب في تنشئة الكاتب وتكوين شخصيته؛ الأفكار الجزئية: وصف البيت وأثاثه البسيط، الكتب ومكتبة الأب، رعاية الأب وصرامته، الجدة وحكاياتها، الجو الديني، أثر البيت في شخصية الكاتب (10 دقائق)\nالاستراتيجيات: سكامبر (إعادة الترتيب).\n\n2. ثروتي اللغوية: سكامبر: ترتيب المفردات المبعثرة هجائيًا؛ ربطة الحذاء: ربط الكلمة بمرادفها (مولعًا: محبًا بشدة، يقتني: يشتري ويحتفظ، صرامة: شدة وحزم، يأبه: يهتم) (10 دقائق)\nالاستراتيجيات: ربطة الحذاء.\n\n3. الغلق: كل طالب يكتب كلمة جديدة تعلمها ويضعها في جملة شفهية (3 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: أثر البيت ورعاية الأب في تكوين شخصية الكاتب\n2) (تطبيق) ما معنى (مولعًا بالكتب)؟\nالإجابة النموذجية: شديد الحب لها\n3) (استدلال) وظّف كلمة (يقتني) في جملة.\nالإجابة النموذجية: مثل: يقتني أبي الكتب النافعة ليقرأها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتّب هجائيًا: صرامة، إفراط، مولع، حجرة.\nالإجابة النموذجية: إفراط، حجرة، صرامة، مولع\n2) (تطبيق) ما الفكرة الجزئية للفقرة التي تتحدث عن الجدة؟\nالإجابة النموذجية: الجدة الطيبة وحكاياتها الشعبية الممتعة\n3) (استدلال) بماذا تفسر قول الكاتب إن الأب (يخفي رحمته ويظهر صرامته)؟\nالإجابة النموذجية: كان رحيمًا في قلبه لكنه يظهر الحزم ليربي أبناءه على الجد والانضباط"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية) في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=8"]]}, {"no": 15, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثاني: مدرستي الأولى", "k": 3, "n": 4, "wi": 1, "wn": 7, "pages": "32-39", "f": [["عنوان الدرس", "الدرس الثاني: مدرستي الأولى"], ["نواتج التعلم", "1. يستخرج صفات الأب والبيت والجدة من النص (25 دقيقة)\n2. يبيّن دور الأب في تربية الأبناء (5 دقائق)\n3. يبدي رأيه في أسلوب الأب التربوي مع التعليل (10 دقائق)"], ["الاستراتيجيات", "أوجه المكعب\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص35-38\nمكعب كرتوني عليه أسئلة\nبطاقات ملونة"], ["التهيئة (5 دقائق)", "- سؤال: صف بيتك بكلمة واحدة\n- ربط بالبيت الذي وصفه الكاتب"], ["إجراءات التنفيذ (23 دقيقة)", "1. أوجه المكعب: قارن بين حجرة النوم والمجلس؛ صف الجدة؛ اربط بين التنشئة وشخصية الكاتب؛ كيف استفاد من شغف أبيه بالكتب؟؛ دلّل على الشعور الديني في البيت؛ تتبع مظاهر البساطة والنظافة (10 دقائق)\nالاستراتيجيات: أوجه المكعب.\n\n2. الصفات والرأي: جدول: الأب (مولع بالكتب، مسؤول، حازم رحيم)، البيت (بسيط، نظيف، ديني)، الجدة (طيبة، متدينة، حسنة الحديث)؛ مناقشة: هل تؤيد صرامة الأب؟ (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: كل مجموعة تكتب أهم صفة تعلمتها من الأب على بطاقة وتلصقها في لوحة الصف (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر صفتين للأب.\nالإجابة النموذجية: مولع بالكتب، وشديد الشعور بمسؤوليته عن تعليم أبنائه\n2) (تطبيق) دلّل على أن البيت كان يغمره الشعور الديني.\nالإجابة النموذجية: الأب يؤدي الصلوات في أوقاتها ويكثر من قراءة القرآن ويوقظ أبناءه للفجر ويصومون رمضان\n3) (استدلال) كيف استفاد الكاتب من مكتبة أبيه؟\nالإجابة النموذجية: استمتع بها وانتفع منها، واحتفظ بخيرها نواةً لمكتبته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما دور الأب في تعليم أبنائه؟\nالإجابة النموذجية: كان يعلمهم بنفسه ويشرف على تعليمهم في مدارسهم ويتعب في ذلك حتى وهو مريض\n2) (تطبيق) ما صفات الجدة؟\nالإجابة النموذجية: طيبة القلب متدينة يضيء وجهها، تحسن الحديث وتحكي القصص الشعبية\n3) (استدلال) ما رأيك في أسلوب الأب؟ علّل.\nالإجابة النموذجية: تقبل الآراء المعللة، مثل: أسلوب ناجح لأنه جمع الحزم والرحمة فأنشأ ابنًا جادًا متدينًا"], ["الواجب المنزلي", "اكتب خمسة أسطر عن أثر أحد أفراد أسرتك في شخصيتك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=8"]]}, {"no": 16, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثاني: مدرستي الأولى", "k": 4, "n": 4, "wi": 2, "wn": 7, "pages": "32-39", "f": [["عنوان الدرس", "الدرس الثاني: مدرستي الأولى"], ["نواتج التعلم", "1. يحلل السيرة الذاتية إلى خصائصها الأساسية (15 دقيقة)\n2. يستخلص القيم الإيجابية من النص (15 دقيقة)\n3. يقارن بين نصّي (صور من قريتي) و(مدرستي الأولى) في الأسلوب والأفكار (10 دقائق)"], ["الاستراتيجيات", "4H (القلب، الحرارة، الرأس، اليد)\nفكر - زاوج - شارك\nالمقارنة بالجدول"], ["مصادر التعلم", "كتاب الطالب ص37-39\nورقة نشاط 4H\nالسبورة"], ["التهيئة (5 دقائق)", "قراءة صامتة سريعة مع استذكار الأفكار السابقة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الخصائص والقيم: خصائص السيرة في النص: ضمير المتكلم، أحداث واقعية، زمن ماضٍ، تأمل في الأثر؛ القيم: حب العلم والقراءة، المسؤولية، الأمانة الأسرية، البساطة، التدين (10 دقائق)\nالاستراتيجيات: 4H (القلب.\n\n2. المقارنة: جدول مقارنة: الموضوع (القرية والمجتمع / البيت والأسرة)، الأسلوب (وصفي حسي تراثي / سردي تأملي)، ضمير المتكلم في الاثنين، المكان والزمان؛ فكر زاوج شارك لتعبئة الجدول (8 دقائق)\nالاستراتيجيات: الحرارة.\n\n3. غلق الدرس – من الكتاتيب إلى اليوم: يقارن كل زوج بين مدرسة أحمد أمين الأولى ومدارس تعليم القرآن التي تعلم فيها الأجداد في عمان، ثم يذكر ميزة واحدة للتعليم اليوم يعتز بها (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر خاصيتين من خصائص السيرة الذاتية في النص.\nالإجابة النموذجية: الحديث بضمير المتكلم، وسرد وقائع حقيقية من حياة الكاتب\n2) (تطبيق) استخرج قيمتين من النص.\nالإجابة النموذجية: حب القراءة والعلم، والبساطة في العيش\n3) (استدلال) ما وجه الشبه بين النصين؟\nالإجابة النموذجية: كلاهما سيرة ذاتية بضمير المتكلم عن ذكريات الطفولة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما وجه الاختلاف بين النصين في الموضوع؟\nالإجابة النموذجية: الأول عن حياة القرية والمجتمع، والثاني عن البيت والأسرة وأثرهما في الكاتب\n2) (تطبيق) ما أثر البيت في شخصية الكاتب كما ذكر؟\nالإجابة النموذجية: الجد والصبر على العمل والإيمان الراسخ والبساطة وكراهية التكلف\n3) (استدلال) برأيك أي النصين أقرب إلى حياتك؟ علّل.\nالإجابة النموذجية: تقبل الإجابات المعللة"], ["الواجب المنزلي", "حل بقية أنشطة الدرس في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=8"]]}, {"no": 17, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: أنواع الخبر", "k": 1, "n": 3, "wi": 3, "wn": 7, "pages": "127-131", "f": [["عنوان الدرس", "الأنشطة النحوية: أنواع الخبر"], ["نواتج التعلم", "1. يتذكر ركني الجملة الاسمية (المبتدأ والخبر) (15 دقيقة)\n2. يتعرّف أنواع الخبر: مفرد، جملة، شبه جملة (15 دقيقة)\n3. يمثل لكل نوع بمثال (10 دقائق)"], ["الاستراتيجيات", "K.W.L\nالقصة\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص127-129\nقصة قصيرة على جهاز العرض\nبطاقات K.W.L"], ["التهيئة (5 دقائق)", "- جدول K.W.L: ماذا أعرف عن المبتدأ والخبر؟ ماذا أريد أن أعرف؟\n- أمثلة: البنتُ جميلةٌ، البنتُ كالوردة، البنتُ داخلَ المنزل"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: عرض أمثلة الكتاب وتحديد الخبر في كل جملة؛ ملاحظة أن الخبر قد يكون كلمة، أو جملة فعلية أو اسمية، أو جارًّا ومجرورًا أو ظرفًا؛ تسمية الأنواع (10 دقائق)\nالاستراتيجيات: K.W.L.\n\n2. الترسيخ: تصنيف جمل في جدول بثلاثة أعمدة؛ الدقيقة الواحدة: يذكر الطالب أكبر عدد من الأمثلة لنوع يحدده المعلم (10 دقائق)\nالاستراتيجيات: القصة.\n\n3. الغلق: إكمال عمود (ماذا تعلمت؟) في K.W.L (3 دقائق)\nالاستراتيجيات: الدقيقة الواحدة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما أنواع الخبر؟\nالإجابة النموذجية: مفرد، وجملة (فعلية أو اسمية)، وشبه جملة (جار ومجرور أو ظرف)\n2) (تطبيق) حدد نوع الخبر: (الكتبُ في المكتبة).\nالإجابة النموذجية: شبه جملة (جار ومجرور)\n3) (استدلال) حدد نوع الخبر: (الأبُ يعلّمُ أبناءه).\nالإجابة النموذجية: جملة فعلية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) هات مثالًا لخبر مفرد.\nالإجابة النموذجية: مثل: البيتُ نظيفٌ\n2) (تطبيق) هات مثالًا لخبر شبه جملة ظرفية.\nالإجابة النموذجية: مثل: السبلةُ قربَ المسجد\n3) (استدلال) صنف: (الجدةُ وجهُها مضيء).\nالإجابة النموذجية: خبر جملة اسمية"], ["الواجب المنزلي", "اكتب ست جمل اسمية: جملتين لكل نوع من أنواع الخبر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=9"]]}, {"no": 18, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: أنواع الخبر", "k": 2, "n": 3, "wi": 4, "wn": 7, "pages": "127-131", "f": [["عنوان الدرس", "الأنشطة النحوية: أنواع الخبر"], ["نواتج التعلم", "1. يعرب الخبر المفرد إعرابًا صحيحًا (15 دقيقة)\n2. يعرب الخبر الجملة وشبه الجملة إعرابًا محليًا (5 دقائق)\n3. يميز الخبر الجملة من غيره في الجمل (20 دقيقة)"], ["الاستراتيجيات", "مخطط السمكة\nالأيدي المتصافحة\nالنمذجة"], ["مصادر التعلم", "كتاب الطالب ص129-130\nبطاقات إعراب\nالسبورة"], ["التهيئة (5 دقائق)", "الأيدي المتصافحة: يتصافح زميلان ويذكر كل منهما جملة اسمية والآخر يحدد خبرها"], ["إجراءات التنفيذ (23 دقيقة)", "1. نماذج الإعراب: (البيتُ بسيطٌ): بسيط خبر مرفوع بالضمة؛ (الأبُ يقرأُ): الجملة الفعلية في محل رفع خبر؛ (المكتبةُ في المجلسِ): الجار والمجرور في محل رفع خبر؛ (الجدةُ حديثُها حسنٌ): الجملة الاسمية في محل رفع خبر (10 دقائق)\nالاستراتيجيات: مخطط السمكة.\n\n2. التدريب: مخطط السمكة: رأس السمكة المبتدأ والعظام أنواع الخبر بأمثلة؛ إعراب جمل الكتاب في مجموعات (10 دقائق)\nالاستراتيجيات: الأيدي المتصافحة.\n\n3. الغلق: عرض مخطط السمكة لأفضل مجموعة، تلخيص القاعدة في جملتين (3 دقائق)\nالاستراتيجيات: النمذجة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أعرب (مشرقٌ) في: (وجهُ الجدةِ مشرقٌ).\nالإجابة النموذجية: خبر مرفوع وعلامة رفعه الضمة الظاهرة\n2) (تطبيق) ما محل جملة (يحبُّ الكتب) في: (أبي يحبُّ الكتب)؟\nالإجابة النموذجية: في محل رفع خبر للمبتدأ (أبي)\n3) (استدلال) أين خبر المبتدأ في: (المسجدُ بجانبِ السبلة)؟\nالإجابة النموذجية: شبه الجملة الظرفية (بجانب السبلة) في محل رفع خبر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب: (الطلابُ مجتهدون).\nالإجابة النموذجية: الطلاب: مبتدأ مرفوع بالضمة، مجتهدون: خبر مرفوع بالواو لأنه جمع مذكر سالم\n2) (تطبيق) حدد الخبر ونوعه: (الأمُّ ترعى أبناءها).\nالإجابة النموذجية: ترعى أبناءها: جملة فعلية في محل رفع خبر\n3) (استدلال) لماذا نقول عن الخبر الجملة إنه (في محل رفع)؟\nالإجابة النموذجية: لأن الجملة لا تظهر عليها علامة الإعراب بل تحل محل الاسم المرفوع"], ["الواجب المنزلي", "أعرب ثلاث جمل من تدريبات الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=9"]]}, {"no": 19, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: أنواع الخبر", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "127-131", "f": [["عنوان الدرس", "الأنشطة النحوية: أنواع الخبر"], ["نواتج التعلم", "1. يحوّل الخبر من نوع إلى آخر (15 دقيقة)\n2. يوظف أنواع الخبر في فقرة عن الأسرة (15 دقيقة)\n3. يصحح أخطاء في تحديد الخبر وإعرابه (10 دقائق)"], ["الاستراتيجيات", "اتصل بإجابتك\nالتعلم التعاوني\nفكر - زاوج - شارك"], ["مصادر التعلم", "كتاب الطالب ص130-131\nبطاقات (اتصل بإجابتك)\nأوراق عمل"], ["التهيئة (5 دقائق)", "اتصل بإجابتك: بطاقة سؤال يقابلها طالب يحمل بطاقة إجابتها"], ["إجراءات التنفيذ (23 دقيقة)", "1. التحويل: (البيتُ نظيفٌ) ← البيتُ ينظّفُه أهلُه ← البيتُ في نظافة؛ تحويل خبر جملة فعلية إلى مفرد والعكس؛ مناقشة التغيير في المعنى (10 دقائق)\nالاستراتيجيات: اتصل بإجابتك.\n\n2. التوظيف: كل مجموعة تكتب فقرة من خمس جمل عن أسرتها تشتمل على الأنواع الثلاثة؛ تبادل الفقرات بين المجموعات لتحديد الأخبار وأنواعها (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – ثلاثة أخبار عن عمان: تكتب كل مجموعة ثلاث جمل اسمية عن عمان: خبرها مفرد «عمانُ جميلةٌ»، وجملة «النخيلُ يزيّن الواحات»، وشبه جملة «اللبانُ في ظفار»، وتتحدى مجموعة أخرى تحديد الأنواع (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حوّل الخبر إلى جملة فعلية: (الطفلُ نائمٌ).\nالإجابة النموذجية: الطفلُ ينامُ\n2) (تطبيق) حوّل الخبر إلى شبه جملة: (الكتابُ موجودٌ).\nالإجابة النموذجية: الكتابُ على المكتب\n3) (استدلال) صحّح: الخبر في (الأبُ في البيت) هو (الأب).\nالإجابة النموذجية: الخبر شبه الجملة (في البيت)، و(الأب) مبتدأ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب جملة خبرها جملة اسمية.\nالإجابة النموذجية: مثل: أخي صوتُه جميل\n2) (تطبيق) حدد أنواع الخبر في: (أمي حنونٌ، وأبي يعمل، وجدتي عندنا).\nالإجابة النموذجية: حنون: مفرد، يعمل: جملة فعلية، عندنا: شبه جملة ظرفية\n3) (استدلال) اكتب فقرة من ثلاث جمل عن مدرستك تتنوع فيها أنواع الخبر.\nالإجابة النموذجية: فقرة صحيحة تشتمل على الأنواع الثلاثة"], ["الواجب المنزلي", "حل التدريبات المتبقية في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=9"]]}, {"no": 20, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة الإملائية: تطبيقات (علامة الحذف والقوسان الهلاليان)", "k": 1, "n": 1, "wi": 6, "wn": 7, "pages": "132-133", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (علامة الحذف والقوسان الهلاليان)"], ["نواتج التعلم", "1. يذكر مواضع علامة الحذف والقوسين الهلاليين (15 دقيقة)\n2. يضع العلامتين في أماكنهما في نص تطبيقي (15 دقيقة)\n3. يوظف العلامتين في فقرة من إنشائه (10 دقائق)"], ["الاستراتيجيات", "الأحجية (البازل)\nبتلات الزهرة\nقلم واحد ورقة واحدة"], ["مصادر التعلم", "كتاب الطالب ص132-133\nمجسم زهرة وبتلات\nبطاقات ممغنطة"], ["التهيئة (5 دقائق)", "بازل علامات الترقيم: تجميع العلامة وقراءة السؤال المكتوب خلفها والإجابة عنه"], ["إجراءات التنفيذ (23 دقيقة)", "1. بتلات الزهرة: قلب الزهرة عليه العلامة، والبتلات مواضعها؛ يكمل الطلبة الزهرة بالبتلات المناسبة؛ حل السؤال الأول في الكتاب على السبورة التفاعلية (10 دقائق)\nالاستراتيجيات: الأحجية (البازل).\n\n2. التطبيق: قلم واحد ورقة واحدة: تتناوب المجموعة على ورقة واحدة لوضع العلامات في النص التطبيقي؛ تصحيح جماعي (8 دقائق)\nالاستراتيجيات: بتلات الزهرة.\n\n3. غلق الدرس – دليل سياحي مختصر: يكتب كل زوج فقرة من جملتين لدليل سياحي عن محافظة عمانية، يضع فيها اسم الولاية بين قوسين وعلامة الحذف بعد تعداد معالمها، ثم يدققها زوج آخر (5 دقائق)\nالاستراتيجيات: تقييم الأقران."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر موضعين لعلامة الحذف.\nالإجابة النموذجية: الكلام المحذوف أو المقتبس جزء منه، وما يُستحيا من ذكره أو يُستغنى عنه\n2) (تطبيق) اذكر موضعين للقوسين.\nالإجابة النموذجية: الكلمات المفسرة أو الشارحة، والأرقام والإحالات داخل النص\n3) (استدلال) ضع العلامة: سافر (مبخوت) إلى صور ومعه جوهر وغاسي\nالإجابة النموذجية: سافر مبخوت إلى صور ومعه جوهر وغاسي... أو مع القوسين عند التفسير"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ضع القوسين: صنعها الوستاد المشرف على العمل منصور.\nالإجابة النموذجية: صنعها الوستاد (المشرف على العمل) منصور\n2) (تطبيق) صحح الخطأ: (في حديقتنا أشجار كثيرة: ليمون (ونخيل) ورمان).\nالإجابة النموذجية: في حديقتنا أشجار كثيرة: ليمون ونخيل ورمان... (لا موضع للقوسين هنا)\n3) (استدلال) اكتب فقرة من ثلاثة أسطر عن رحلة توظف فيها العلامتين.\nالإجابة النموذجية: فقرة تتضمن القوسين للتفسير وعلامة الحذف للتعداد المحذوف"], ["الواجب المنزلي", "استخرج من جريدة أو مجلة جملة فيها قوسان وأخرى فيها علامة حذف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=10"]]}, {"no": 21, "w": 3, "wl": "الثالث", "date": "20-24 سبتمبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "خط الرقعة: (ع، غ)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "134", "f": [["عنوان الدرس", "خط الرقعة: (ع، غ)"], ["نواتج التعلم", "1. يرسم حرفي العين والغين مجردين بخط الرقعة (15 دقيقة)\n2. يكتب الحرفين في مواضعهما المختلفة في الكلمة (15 دقيقة)\n3. يكتب جملة بخط الرقعة مراعيًا قواعد رسم الحروف (10 دقائق)"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص134\nأقلام مشطوفة الرأس\nأوراق ملاحظات لاصقة\nالسبورة المقسمة ثلاثة أقسام"], ["التهيئة (5 دقائق)", "- كتابة العين بالنسخ ثم بالرقعة ومقارنة الشكلين\n- سؤال: أين يختلف ذيل العين المتطرفة؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. النمذجة: رسم العين المجردة: رأس صغير ثم ذيل ينزل تحت السطر؛ العين في أول الكلمة (علم)، وسطها (يعمل)، آخرها (سمع، ربيع)؛ الغين مثل العين مع نقطة فوق الرأس (10 دقائق)\nالاستراتيجيات: ورق الملاحظات.\n\n2. المحاكاة: محاكاة الطلبة في الكتاب؛ تصويب بورق الملاحظات؛ كتابة جملة الكتاب (8 دقائق)\nالاستراتيجيات: النمذجة والمحاكاة.\n\n3. غلق الدرس – عُمان غالية: تكتب المجموعات بخط الرقعة عبارة وطنية فيها العين والغين في مواضع مختلفة، مثل «عُمان غالية على الجميع»، ثم تتجول بين الأعمال وتختار أدقها رسمًا (5 دقائق)\nالاستراتيجيات: المعرض الجوال."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) هل ينزل ذيل العين المتطرفة المنفصلة عن خط القاعدة؟\nالإجابة النموذجية: نعم، ينزل تحت خط القاعدة\n2) (تطبيق) ما الفرق بين العين والغين في الرسم؟\nالإجابة النموذجية: نقطة فوق الغين فقط\n3) (استدلال) اكتب (يعمل) بخط الرقعة.\nالإجابة النموذجية: تقويم عملي: العين المتوسطة صغيرة الرأس على السطر"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب العين والغين مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب كلمتين: (غيم – بلاغ) بخط الرقعة.\nالإجابة النموذجية: تقويم موضع الغين في الأول والآخر\n3) (استدلال) اكتب جملة: (العلم نور) بخط الرقعة.\nالإجابة النموذجية: تقويم التناسق والمسافات"], ["الواجب المنزلي", "أكمل صفحة الخط وكرر الجملة ثلاث مرات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=11"]]}, {"no": 22, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: الوصف", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "135-136", "f": [["عنوان الدرس", "التعبير: الوصف"], ["نواتج التعلم", "1. يفرّق بين الوصف والسرد (5 دقائق)\n2. يتعرّف عناصر وصف الشخصية والمكان والمشاعر (25 دقيقة)\n3. يكتب مقطعًا وصفيًا قصيرًا لشخصية من أسرته (10 دقائق)"], ["الاستراتيجيات", "العصف الذهني\nالتعلم التعاوني\nالنمذجة"], ["مصادر التعلم", "كتاب الطالب ص135-136\nصور شخصيات ومشاهد\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض جملتين: (دخلت جدتي البيت) و(جدتي امرأة وقورة وجهها مضيء)\n- سؤال: أيهما يروي حدثًا وأيهما يصف؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الوصف والسرد: السرد يروي أحداثًا متتابعة في زمن، والوصف يرسم صورة للشيء بتفاصيله؛ عناصر وصف الشخصية: الملامح الخارجية، الصفات الداخلية، الحركات والأقوال؛ أمثلة من نص (مدرستي الأولى): وصف الجدة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. النموذج والتدريب: نموذج وصفي يكتبه المعلم مع الطلبة لشخصية الأب؛ مجموعات تصف شخصية من صورة؛ استعمال الصفات والتشبيهات وحواس النظر والسمع (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: قراءة ثلاثة مقاطع وصفية متميزة (3 دقائق)\nالاستراتيجيات: النمذجة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفرق بين السرد والوصف؟\nالإجابة النموذجية: السرد يحكي أحداثًا متتابعة، والوصف يصور الشيء ويبيّن صفاته وتفاصيله\n2) (تطبيق) اذكر عنصرين لوصف الشخصية.\nالإجابة النموذجية: الملامح الخارجية، والصفات الداخلية (الخُلقية)\n3) (استدلال) استخرج من نص (مدرستي الأولى) جملة وصفية.\nالإجابة النموذجية: مثل: كان طابع البيت البساطة والنظافة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف ملامح جدك أو جدتك في جملتين.\nالإجابة النموذجية: جملتان فيهما صفات حسية مثل: وجه مضيء، صوت هادئ\n2) (تطبيق) اكتب جملة تصف فيها مشاعر الفرح باستعمال تشبيه.\nالإجابة النموذجية: مثل: طار قلبي فرحًا كعصفور خرج من قفصه\n3) (استدلال) هل الجملة (جلس أبي ثم قرأ الكتاب) وصف أم سرد؟\nالإجابة النموذجية: سرد لأنها تحكي أحداثًا متتابعة"], ["الواجب المنزلي", "اكتب مقطعًا وصفيًا من خمسة أسطر عن شخصية تحبها في أسرتك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=12"]]}, {"no": 23, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: الوصف", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "135-136", "f": [["عنوان الدرس", "التعبير: الوصف"], ["نواتج التعلم", "1. يصف البيت والأسرة وصفًا متكاملًا (25 دقيقة)\n2. يوظف الروابط اللفظية والأساليب الوصفية (5 دقائق)\n3. يستعمل علامات الترقيم استعمالًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالكتابة الموجهة\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص136\nقائمة تقويم ذاتي\nأوراق كتابة"], ["التهيئة (5 دقائق)", "- سؤال: ما أول شيء يراه الضيف عند دخول بيتكم؟\n- ترتيب الوصف من الخارج إلى الداخل"], ["إجراءات التنفيذ (23 دقيقة)", "1. التخطيط: خريطة وصفية: البيت (الموقع، الشكل، الغرف، الألوان، الروائح) والأسرة (الأفراد، الصفات، الجو العام)؛ روابط: في مقدمة البيت، وإلى جانبه، وفي وسطه (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الكتابة والتقويم: كتابة فقرة وصفية عن البيت والأسرة؛ تقويم ذاتي بقائمة: الترتيب، الحواس، الروابط، الترقيم، سلامة اللغة؛ تبادل وتصحيح بين الزملاء (8 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n3. غلق الدرس – جدتي العمانية: يصف كل طالب لزميله في جملتين شخصية من أسرته الكبيرة كالجد أو الجدة، مبرزًا ملامحها ومشاعرها وعادة عمانية تحافظ عليها، ثم يعرض الزوج أجمل وصف (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر رابطين يناسبان وصف المكان.\nالإجابة النموذجية: في مقدمة، وإلى جانب (أو: في وسط، وخلف)\n2) (تطبيق) لماذا نستعمل الحواس في الوصف؟\nالإجابة النموذجية: لنجعل القارئ يرى ويسمع ويشم الصورة كأنه يعيشها\n3) (استدلال) أكمل بوصف مناسب: مجلس بيتنا ................\nالإجابة النموذجية: مثل: واسع هادئ تزينه سجادة حمراء وتفوح فيه رائحة البخور"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتّب عناصر وصف البيت: الغرف – الموقع – الجو العام – الشكل الخارجي.\nالإجابة النموذجية: الموقع، الشكل الخارجي، الغرف، الجو العام\n2) (تطبيق) صحح علامة الترقيم: (بيتنا جميل، وكبير.)\nالإجابة النموذجية: بيتنا جميل وكبير. (لا حاجة إلى الفاصلة قبل واو العطف بين صفتين متلازمتين)\n3) (استدلال) اكتب جملة تصف فيها الجو العام في بيتكم في المساء.\nالإجابة النموذجية: جملة وصفية مناسبة فيها صفة حسية وصفة شعورية"], ["الواجب المنزلي", "بيّض الفقرة الوصفية في دفتر التعبير بعد تصويبها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=12"]]}, {"no": 24, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثالث: مدرسة الأخلاق", "k": 1, "n": 3, "wi": 3, "wn": 7, "pages": "40-43", "f": [["عنوان الدرس", "الدرس الثالث: مدرسة الأخلاق"], ["نواتج التعلم", "1. يلقي الأبيات إلقاءً معبرًا مع صحة الضبط (15 دقيقة)\n2. يتعرف الشاعر معروف الرصافي (5 دقائق)\n3. يحدد الجذر المعجمي لبعض المفردات (أخلاق، مكرمات، اتساق، مدرسة، إسلام) (20 دقيقة)"], ["الاستراتيجيات", "تمثيل الأدوار\nربطة الحذاء\nالإلقاء النموذجي"], ["مصادر التعلم", "كتاب الطالب ص40-41\nتسجيل صوتي لإلقاء القصيدة\nجهاز عرض"], ["التهيئة (5 دقائق)", "- مشهدان صامتان: أم منشغلة بالهاتف عن طفلها، وأم ترعى أبناءها وتتابع دروسهم\n- سؤال: أي الطفلين سيكون أحسن خلقًا؟ ولماذا؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإلقاء: إلقاء نموذجي معبّر للقصيدة؛ إلقاء الطلبة بيتًا بيتًا مع ضبط أواخر الكلمات ومراعاة القافية (التاء المكسورة)؛ تحديد المفردات غير الواضحة (10 دقائق)\nالاستراتيجيات: تمثيل الأدوار.\n\n2. الجذر المعجمي: ربطة الحذاء: الكلمة في طرف وجذرها في الطرف الآخر: أخلاق (خ ل ق)، مكرمات (ك ر م)، اتساق (و س ق)، مدرسة (د ر س)، إسلام (س ل م)؛ تكليف بالبحث عن الشاعر (10 دقائق)\nالاستراتيجيات: ربطة الحذاء.\n\n3. الغلق: إلقاء جماعي للأبيات الأربعة الأولى، تذكير بحفظ النص كاملًا (3 دقائق)\nالاستراتيجيات: الإلقاء النموذجي."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) من شاعر النص؟\nالإجابة النموذجية: معروف الرصافي، شاعر عراقي\n2) (تطبيق) ما الجذر المعجمي لكلمة (مكرمات)؟\nالإجابة النموذجية: ك ر م\n3) (استدلال) أكمل البيت: «هي الأخلاق تنبت كالنبات ...»\nالإجابة النموذجية: إذا سقيت بماء المكرمات"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما جذر (اتساق)؟\nالإجابة النموذجية: و س ق\n2) (تطبيق) اقرأ البيت الخامس قراءة معبرة.\nالإجابة النموذجية: (ولم أرَ للخلائق من محلٍّ يهذّبها كحضن الأمّهاتِ) بضبط صحيح\n3) (استدلال) ما الحرف الذي انتهت به أبيات القصيدة (الروي)؟\nالإجابة النموذجية: التاء المكسورة"], ["الواجب المنزلي", "احفظ الأبيات الأربعة الأولى وابحث عن معلومات عن الشاعر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=13"]]}, {"no": 25, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثالث: مدرسة الأخلاق", "k": 2, "n": 3, "wi": 4, "wn": 7, "pages": "40-43", "f": [["عنوان الدرس", "الدرس الثالث: مدرسة الأخلاق"], ["نواتج التعلم", "1. يستنتج الفكرة العامة للقصيدة ووحدتيها الفكريتين (5 دقائق)\n2. يوضح أهمية تعليم الأمهات وأثره في الأبناء (15 دقيقة)\n3. يشرح الصور الجمالية في الأبيات (20 دقيقة)"], ["الاستراتيجيات", "فكر - زاوج - شارك\nالحوار والمناقشة\nماسح الشفرة الخطية"], ["مصادر التعلم", "كتاب الطالب ص41-42\nبطاقات ملونة للوحدات الفكرية\nالسبورة"], ["التهيئة (5 دقائق)", "عرض ما جمعه الطلبة عن الشاعر معروف الرصافي"], ["إجراءات التنفيذ (23 دقيقة)", "1. الوحدات الفكرية: فكر زاوج شارك: قسّم الأبيات إلى وحدات؛ الأبيات 1-4: أهمية غرس الأخلاق في تنشئة الأبناء؛ الأبيات 5-9: أخلاق الأبناء انعكاس لأخلاق أمهاتهم وأهمية تعليم المرأة (10 دقائق)\nالاستراتيجيات: فكر.\n\n2. الصور الجمالية: تشبيه الأخلاق بالنبات الذي ينمو إذا سُقي بماء المكرمات؛ تشبيه حضن الأم بالمدرسة؛ تشبيه سموّ الأخلاق باتساق أنابيب القناة؛ أثر الصور في توضيح المعنى (10 دقائق)\nالاستراتيجيات: زاوج.\n\n3. الغلق: كل طالب يكتب جملة: أمي مدرستي لأنها  (3 دقائق)\nالاستراتيجيات: شارك."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للقصيدة؟\nالإجابة النموذجية: دور الأم المتعلمة الخلوقة في تربية أبناء ذوي أخلاق حسنة\n2) (تطبيق) بمَ شبّه الشاعر الأخلاق في البيت الأول؟\nالإجابة النموذجية: بالنبات الذي ينمو إذا سُقي بماء المكرمات\n3) (استدلال) ما الوحدة الفكرية للأبيات (5-9)؟\nالإجابة النموذجية: أخلاق الأبناء انعكاس لأخلاق أمهاتهم، ولذا يجب تعليم المرأة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اشرح: (فحضن الأم مدرسة تسامت).\nالإجابة النموذجية: شبه حضن الأم بالمدرسة الراقية لأنها تعلم أبناءها وتربيهم\n2) (تطبيق) لماذا استنكر الشاعر أن نظن بالأبناء خيرًا إذا نشؤوا في حضن الجاهلات؟\nالإجابة النموذجية: لأن الأم الجاهلة لا تستطيع أن تغرس فيهم العلم والأخلاق الحسنة\n3) (استدلال) بمَ استدل الشاعر في البيت الأخير على وجوب تعليم المرأة؟\nالإجابة النموذجية: بأن العلم في الإسلام فريضة على الأبناء والبنات جميعًا"], ["الواجب المنزلي", "احفظ القصيدة كاملة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=13"]]}, {"no": 26, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الدرس الثالث: مدرسة الأخلاق", "k": 3, "n": 3, "wi": 5, "wn": 7, "pages": "40-43", "f": [["عنوان الدرس", "الدرس الثالث: مدرسة الأخلاق"], ["نواتج التعلم", "1. يبيّن صفات الأم المثالية من خلال الأبيات (15 دقيقة)\n2. يستخلص القيم الإيجابية من القصيدة (5 دقائق)\n3. يحدد السمات العامة للنص الشعري (20 دقيقة)"], ["الاستراتيجيات", "الهدية المتنقلة\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص42-43\nصندوق أسئلة وهدايا رمزية\nأنشودة عن الأم"], ["التهيئة (5 دقائق)", "تسميع أبيات من القصيدة من عدد من الطلبة"], ["إجراءات التنفيذ (23 دقيقة)", "1. الأم المثالية والقيم: صفات الأم المثالية: متعلمة، خلوقة، قريبة من أبنائها، تهذب أخلاقهم؛ القيم: بر الأم، طلب العلم للبنين والبنات، التمسك بالأخلاق (10 دقائق)\nالاستراتيجيات: الهدية المتنقلة.\n\n2. سمات النص الشعري: الوزن والقافية الموحدة؛ الصور الجمالية والتشبيه؛ العاطفة الصادقة؛ الاستفهام للتعجب والإنكار في البيتين الأخيرين؛ حل أسئلة الكتاب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – مكارم أهل عمان: تختار كل مجموعة خلقًا من أبيات الرصافي، وتربطه بخلق عُرف به العمانيون كالتسامح والكرم، وتحدد الجذر المعجمي لكلمة من البيت، ثم تعرض ذلك في دقيقة (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر صفتين للأم المثالية من القصيدة.\nالإجابة النموذجية: متعلمة، وتهذب أخلاق أبنائها وتحسن تربيتهم\n2) (تطبيق) استخرج قيمة من البيت الأخير.\nالإجابة النموذجية: العلم فريضة على الذكر والأنثى\n3) (استدلال) ما الأسلوب في: (فكيف نظن بالأبناء خيرًا...؟) وما غرضه؟\nالإجابة النموذجية: استفهام غرضه الإنكار والتعجب"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اذكر سمتين للنص الشعري.\nالإجابة النموذجية: الوزن والقافية الموحدة، والصور الجمالية\n2) (تطبيق) ما العاطفة المسيطرة على الشاعر؟\nالإجابة النموذجية: الحرص على الأخلاق والدعوة إلى تعليم المرأة\n3) (استدلال) أبدِ رأيك: هل يكفي تعليم الأم وحده لتربية الأبناء؟ علّل.\nالإجابة النموذجية: تقبل الآراء المعللة، كأن دور الأب والمدرسة مكمل لدورها"], ["الواجب المنزلي", "ابحث عن قصيدة أخرى تتحدث عن الأم واكتب منها بيتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=13"]]}, {"no": 27, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة النحوية: تطبيقات (المضاف إليه وأنواع الخبر)", "k": 1, "n": 1, "wi": 6, "wn": 7, "pages": "137-138", "f": [["عنوان الدرس", "الأنشطة النحوية: تطبيقات (المضاف إليه وأنواع الخبر)"], ["نواتج التعلم", "1. يستخرج المضاف والمضاف إليه وأنواع الخبر من نص (15 دقيقة)\n2. يعرب المضاف إليه والخبر بأنواعه إعرابًا صحيحًا (15 دقيقة)\n3. يوظفهما في جمل صحيحة (10 دقائق)"], ["الاستراتيجيات", "من أنا؟\nورقة واحدة وقلم واحد\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص137-138\nبطاقات (من أنا؟)\nأوراق عمل"], ["التهيئة (5 دقائق)", "- لعبة (من أنا؟): أنا اسم مجرور بعد اسم أكمل معناه، فمن أنا؟ (المضاف إليه)\n- أنا جار ومجرور أخبرت عن المبتدأ، فمن أنا؟ (خبر شبه جملة)"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستخراج: قراءة فقرة الكتاب واستخراج تراكيب الإضافة والأخبار وتصنيفها في جدول؛ خريطة مفاهيم تجمع الدرسين (10 دقائق)\nالاستراتيجيات: من أنا؟.\n\n2. الإعراب والتوظيف: ورقة واحدة وقلم واحد: إعراب جمل التدريب بالتناوب داخل المجموعة؛ كتابة جملتين تجمعان المضاف إليه وخبرًا شبه جملة (8 دقائق)\nالاستراتيجيات: ورقة واحدة وقلم واحد.\n\n3. غلق الدرس – آداب المجلس العماني: تكتب كل مجموعة جملتين عن آداب المجلس العماني فيهما مضاف إليه وخبر من نوع مختلف، مثل «قهوةُ الضيفِ جاهزةٌ» و«احترامُ الكبيرِ في قلوبنا»، ثم تعربهما مجموعة أخرى (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) استخرج المضاف إليه والخبر: (مكتبةُ أبي في المجلس).\nالإجابة النموذجية: أبي: مضاف إليه، في المجلس: خبر شبه جملة\n2) (تطبيق) ما نوع الخبر في: (الأخلاقُ تنبتُ كالنبات)؟\nالإجابة النموذجية: جملة فعلية\n3) (استدلال) أعرب (الأمهات) في: (حضنُ الأمهاتِ مدرسة).\nالإجابة النموذجية: مضاف إليه مجرور وعلامة جره الكسرة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) أعرب: (بيتُ الكاتبِ بسيطٌ).\nالإجابة النموذجية: بيت: مبتدأ مرفوع وهو مضاف، الكاتب: مضاف إليه مجرور بالكسرة، بسيط: خبر مرفوع بالضمة\n2) (تطبيق) اكتب جملة خبرها شبه جملة وفيها مضاف إليه.\nالإجابة النموذجية: مثل: كتبُ أبي في الدولاب\n3) (استدلال) صحح: (معلمون المدرسة مخلصون).\nالإجابة النموذجية: معلمو المدرسة مخلصون (حذف النون للإضافة)"], ["الواجب المنزلي", "أكمل تدريبات التطبيقات في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=14"]]}, {"no": 28, "w": 4, "wl": "الرابع", "date": "27 سبتمبر - 1 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "الأنشطة الإملائية: إملاء اختباري (علامة الحذف والقوسان الهلاليان)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "139", "f": [["عنوان الدرس", "الأنشطة الإملائية: إملاء اختباري (علامة الحذف والقوسان الهلاليان)"], ["نواتج التعلم", "1. يكتب فقرة مسموعة كتابة صحيحة (15 دقيقة)\n2. يوظف علامة الحذف والقوسين وعلامات الترقيم المدروسة في مواضعها (15 دقيقة)\n3. يصحح أخطاءه ذاتيًا (10 دقائق)"], ["الاستراتيجيات", "جامع الألماس\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص139\nفقرة إملائية من إعداد المعلم\nجهاز الفاكس كام"], ["التهيئة (5 دقائق)", "- تذكير بالجلسة الصحيحة ونظافة الدفتر\n- مراجعة سريعة لمواضع علامة الحذف والقوسين"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإملاء: قراءة المعلم الفقرة كاملة قراءة واضحة؛ إملاؤها جملًا قصيرة مع تكرار كل جملة مرتين؛ ذكر علامات الترقيم ضمنيًا بنبرة الصوت دون التصريح بها (10 دقائق)\nالاستراتيجيات: جامع الألماس.\n\n2. التصحيح: قراءة أخيرة للمراجعة؛ عرض الفقرة الصحيحة على الفاكس كام؛ تصحيح ذاتي وتلوين الأخطاء؛ جامع الألماس: جائزة لمن لا يخطئ في العلامات (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – إملاء العيد: يملي طالب على زميله جملة عن تقاليد العيد في عمان كزيارة الأهل وتقديم الحلوى، تتضمن علامة حذف وقوسين، ثم يتبادلان الأدوار والتصحيح (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ماذا تفعل عندما تشك في علامة الترقيم المناسبة؟\nالإجابة النموذجية: أتذكر وظيفة الجملة: تفسير فأضع القوسين، أو حذف فأضع علامة الحذف\n2) (تطبيق) اكتب جملة مملاة: (كانت الجدة تصنع (حار بارد) لنا...).\nالإجابة النموذجية: كتابة صحيحة بقوسين وعلامة حذف في موضعيهما\n3) (استدلال) ما العلامة التي تأتي بعد (مثل) عند التعداد المحذوف بعضه؟\nالإجابة النموذجية: علامة الحذف في نهاية التعداد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم بحسب صحة الكتابة والعلامات\n2) (تطبيق) صحح الأخطاء التي وقعت فيها.\nالإجابة النموذجية: تصويب ذاتي في الدفتر\n3) (استدلال) اكتب كلمتين أخطأت فيهما ثلاث مرات.\nالإجابة النموذجية: تقويم عملي"], ["الواجب المنزلي", "اكتب الفقرة كاملة صحيحة في دفترك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=15"]]}, {"no": 29, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "التعبير: السرد والوصف", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "140-144", "f": [["عنوان الدرس", "التعبير: السرد والوصف"], ["نواتج التعلم", "1. يكتب نصًا سرديًا عن العيد يتضمن مقاطع وصفية (5 دقائق)\n2. يصف الشخصيات والمكان والمشاهد والمشاعر ضمن السرد (15 دقيقة)\n3. يوظف الروابط الزمنية وعلامات الترقيم توظيفًا صحيحًا (20 دقيقة)"], ["الاستراتيجيات", "العصف الذهني\nالكتابة الموجهة\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص140-144\nصور لمظاهر العيد في عمان\nأوراق تخطيط"], ["التهيئة (5 دقائق)", "عصف ذهني: كلمات تتذكرها عن صباح العيد في بلدتك (العيدية، الهبطة، الشواء، الملابس الجديدة)"], ["إجراءات التنفيذ (23 دقيقة)", "1. التخطيط: هيكل النص: مقدمة (استعداد الأسرة)، عرض (صباح العيد، الصلاة، الزيارات، الألعاب)، خاتمة (مشاعر نهاية اليوم)؛ تحديد مواضع الوصف داخل السرد: وصف المكان، الأشخاص، المشاعر؛ روابط زمنية: في الصباح الباكر، بعد الصلاة، وعند الظهيرة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. الكتابة: كتابة المسودة في الدفتر؛ مراجعة ذاتية بقائمة: تسلسل الأحداث، تنوع الوصف، الروابط، الترقيم؛ قراءة نماذج والتعليق عليها (8 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n3. غلق الدرس – صباح العيد في حارتنا: تبني كل مجموعة مشهدًا سرديًا وصفيًا عن صباح العيد في حارة عمانية: الزي العماني الجديد، والقهوة والحلوى، وزيارة الكبار، ويضيف كل عضو جملة برابط زمني (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفرق بين جملة سردية وأخرى وصفية في نص عن العيد؟\nالإجابة النموذجية: السردية تحكي حدثًا (خرجنا إلى المصلى)، والوصفية تصور (كان المصلى مزدانًا بالثياب البيضاء)\n2) (تطبيق) اذكر ثلاثة روابط زمنية تناسب نص العيد.\nالإجابة النموذجية: في الصباح الباكر، بعد ذلك، وعند المساء\n3) (استدلال) صف مشهد الأطفال وهم يأخذون العيدية في جملة.\nالإجابة النموذجية: مثل: تتلألأ عيون الأطفال فرحًا وهم يمدون أيديهم الصغيرة لأخذ العيدية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (الخاتمة – صباح العيد – الاستعداد – الزيارات).\nالإجابة النموذجية: الاستعداد، صباح العيد، الزيارات، الخاتمة\n2) (تطبيق) اكتب جملة تجمع السرد والوصف.\nالإجابة النموذجية: مثل: لبست ثوبي الأبيض الجديد الذي تفوح منه رائحة العود وخرجت مع أبي\n3) (استدلال) ما دور الوصف داخل النص السردي؟\nالإجابة النموذجية: يجعل الأحداث حية ويقرّب المشاهد والمشاعر من القارئ"], ["الواجب المنزلي", "أكمل كتابة النص السردي عن العيد وبيّضه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=16"]]}, {"no": 30, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الأول: الأسرة والمجتمع", "title": "القراءة الحرة: المحور الأول", "k": 1, "n": 1, "wi": 2, "wn": 7, "pages": "44-46", "f": [["عنوان الدرس", "القراءة الحرة: المحور الأول"], ["نواتج التعلم", "1. يبيّن أهمية القراءة في تطوير الشخصية (5 دقائق)\n2. يقرأ كتابًا مختارًا قراءة فاحصة ويلخصه وفق بطاقة الكتاب (15 دقيقة)\n3. يعرض ملخص الكتاب شفهيًا أمام زملائه (20 دقيقة)"], ["الاستراتيجيات", "العرض الشفهي\nالخريطة الذهنية\nالتعلم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص44-46 (بطاقة القراءة)\nكتب متنوعة من مركز مصادر التعلم\nالفاكس كام"], ["التهيئة (5 دقائق)", "- عرض مقطع قصير عن أهمية المكتبات\n- سؤال: ما آخر كتاب قرأته؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة: توزيع الكتب أو اختيار الطلبة لكتبهم؛ قراءة فاحصة فردية؛ تعبئة البطاقة: اسم الكتاب، المؤلف، الموضوع، الشخصيات أو الأفكار، أعجبني، رأيي (10 دقائق)\nالاستراتيجيات: العرض الشفهي.\n\n2. التلخيص والعرض: تصميم خريطة ذهنية للكتاب؛ عرض طالب من كل مجموعة ملخصه في دقيقتين؛ تشجيع الأسئلة من الزملاء (8 دقائق)\nالاستراتيجيات: الخريطة الذهنية.\n\n3. غلق الدرس – كتاب أتمنى قراءته: تقترح كل مجموعة عنوان كتاب تتمنى أن يُكتب عن الأسرة العمانية وقيمها، وتكتب له سطرًا تعريفيًا جذابًا على نمط بطاقة الكتاب، ثم يختار الصف أجمل عنوان (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما أهمية القراءة الحرة؟\nالإجابة النموذجية: توسع المدارك والمعارف وتنمي اللغة والشخصية\n2) (تطبيق) ما العناصر الأساسية في بطاقة التعريف بالكتاب؟\nالإجابة النموذجية: اسم الكتاب ومؤلفه وموضوعه وأهم أفكاره ورأي القارئ فيه\n3) (استدلال) ما الفرق بين القراءة الحرة والقراءة الصفية؟\nالإجابة النموذجية: الحرة يختار فيها القارئ ما يناسب ميوله، والصفية محددة بالمنهج"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) لخص الكتاب الذي قرأته في ثلاث جمل.\nالإجابة النموذجية: تلخيص يحدد الموضوع وأهم فكرتين\n2) (تطبيق) اذكر فكرة استفدتها من الكتاب.\nالإجابة النموذجية: تقبل الإجابات المرتبطة بالكتاب المقروء\n3) (استدلال) انصح زميلك بقراءة كتابك أو بعدمها مع التعليل.\nالإجابة النموذجية: رأي معلل يذكر ميزة أو ملاحظة"], ["الواجب المنزلي", "أكمل قراءة الكتاب وأكمل البطاقة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=17"]]}, {"no": 31, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الاستماع: كهف مجلس الجن", "k": 1, "n": 1, "wi": 3, "wn": 7, "pages": "48-49", "f": [["عنوان الدرس", "الاستماع: كهف مجلس الجن"], ["نواتج التعلم", "1. يستمع إلى النص مراعيًا آداب الاستماع (15 دقيقة)\n2. يستخلص المعلومات الرئيسة عن كهف مجلس الجن (الموقع، الاكتشاف، الفتحات) (15 دقيقة)\n3. يقدّر المزارات الطبيعية في السلطنة وواجبه نحوها (10 دقائق)"], ["الاستراتيجيات", "فك الشفرة\nأقطاب المغناطيس\nقطرات المطر\nملخص العمودين"], ["مصادر التعلم", "كتاب الطالب ص48-49\nمقطع صوتي لنص الاستماع\nمجسم زهرة وقطرات مطر\nمقطع مرئي عن الكهف"], ["التهيئة (5 دقائق)", "فك الشفرة: رموز تقابلها حروف يجمعها الطلبة لتكوين عنوان الدرس"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستماع الأول والثاني: تهيئة البيئة الصفية وآداب الاستماع؛ الاستماع الأول للفكرة العامة؛ الاستماع الثاني ومناقشة المفردات بأقطاب المغناطيس: بغية (رغبة وطلب)، الوعرة (الصعبة)، هالني (أدهشني وأفزعني)، مستودع (10 دقائق)\nالاستراتيجيات: فك الشفرة.\n\n2. الاستماع الثالث: قطرات المطر: الموقع، كيفية الاكتشاف، أول من هبط، سبب الهبوط، عدد الفتحات؛ حل أسئلة الكتاب وتعبئة الجدول (8 دقائق)\nالاستراتيجيات: أقطاب المغناطيس.\n\n3. غلق الدرس – حراس الكهوف العمانية: تتحاور المجموعات في واجبها نحو المزارات الطبيعية العمانية، ثم تصوغ كل مجموعة ثلاث قواعد لزائر كهف مجلس الجن تحافظ على نظافته وسلامة زواره (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) أين يقع كهف مجلس الجن؟\nالإجابة النموذجية: في هضبة سلماة قرب قرية فنس بولاية قريات في محافظة مسقط\n2) (تطبيق) كيف اكتُشف الكهف؟\nالإجابة النموذجية: اكتُشف بالصدفة أثناء البحث عن احتياطات مائية جوفية في الصخور الكربونية\n3) (استدلال) كم عدد فتحات الكهف؟\nالإجابة النموذجية: ثلاث فتحات"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من أول من هبط داخل الكهف؟ ومتى؟\nالإجابة النموذجية: دون ديفيسون عام 1983م\n2) (تطبيق) لماذا كان الطريق إلى الكهف شاقًا؟\nالإجابة النموذجية: لأن الدروب وعرة، واحتاجوا إلى المشي ساعات طويلة والنزول بالحبال\n3) (استدلال) اقترح خدمتين يمكن تقديمها للترويج للكهف سياحيًا.\nالإجابة النموذجية: مثل: لوحات إرشادية ومرشدين مدرّبين، وطرق آمنة ومركز معلومات (تقبل الإجابات المناسبة)"], ["الواجب المنزلي", "اكتب أربعة أسطر عن مزار طبيعي في ولايتك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=18"]]}, {"no": 32, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "التحدث: قراءة صورة", "k": 1, "n": 1, "wi": 4, "wn": 7, "pages": "50-51", "f": [["عنوان الدرس", "التحدث: قراءة صورة"], ["نواتج التعلم", "1. يتعرّف أنواع الصور ويحدد نوع صورة (عرضة الخيل) (5 دقائق)\n2. يصف المشهد وعناصره وألوانه وزاوية التقاطه (15 دقيقة)\n3. يتحدث عن عناصر الهوية العمانية في الصورة بلغة فصيحة (20 دقيقة)"], ["الاستراتيجيات", "العصف الذهني\nلعبة البازل\nH4"], ["مصادر التعلم", "كتاب الطالب ص50-51\nجهاز عرض للصورة مكبرة\nقطع بازل للصورة"], ["التهيئة (5 دقائق)", "- لعبة البازل لتجميع صورة (عرضة الخيل)\n- سؤال: ماذا يحدث في هذا المشهد؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الوصف المنظم: نوع الصورة (فوتوغرافية، تشكيلية، إعلانية، كاريكاتورية)؛ الألوان الظاهرة؛ المشهد الذي تمثله؛ زاوية وقوف المصور وأثرها؛ عناصر الحركة في الصورة الثابتة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. التحدث: عناصر الهوية العمانية: الخيل العربية، الزي العماني، الخنجر، الفرسان، الجمهور؛ كل مجموعة تقدم حديثًا منظمًا لدقيقتين: مقدمة، وصف، رأي؛ تقويم الأداء بمعايير الفصاحة والتنظيم ولغة الجسد (8 دقائق)\nالاستراتيجيات: لعبة البازل.\n\n3. غلق الدرس – عناصر الهوية في العرضة: يعدد كل زوج أكبر عدد من عناصر الهوية العمانية في مشهد عرضة الخيل، كالزي العماني والخنجر والمصر والخيل العربية، ويصف أحدها بلغة فصيحة، ويفوز الأكثر عناصر (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما نوع صورة (عرضة الخيل)؟\nالإجابة النموذجية: صورة فوتوغرافية\n2) (تطبيق) أين تبدو عناصر الحركة في الصورة رغم ثباتها؟\nالإجابة النموذجية: في انطلاق الخيل وارتفاع قوائمها وتطاير الغبار وحركة الفرسان\n3) (استدلال) اذكر عنصرين من عناصر الهوية العمانية في الصورة.\nالإجابة النموذجية: الزي العماني للفرسان، والخيل العربية الأصيلة (أو: الخنجر، العمامة)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف ألوان الصورة في جملتين.\nالإجابة النموذجية: وصف مناسب للألوان الظاهرة كبياض الثياب ولون الخيل والرمل والسماء\n2) (تطبيق) ما أثر زاوية التقاط الصورة في المشهد؟\nالإجابة النموذجية: تبرز سرعة الخيل وقوتها وتجعل المشاهد يشعر بالحركة\n3) (استدلال) تحدث في دقيقة عن رأيك في المحافظة على عرضة الخيل.\nالإجابة النموذجية: حديث فصيح منظم يبين قيمتها التراثية ووجوب المحافظة عليها"], ["الواجب المنزلي", "اكتب فقرة تصف فيها صورة لمناسبة وطنية عمانية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=19"]]}, {"no": 33, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 1, "n": 5, "wi": 5, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية سليمة مسترسلة مراعيًا علامات الترقيم (5 دقائق)\n2. ينطق الأعلام والأرقام والتواريخ نطقًا صحيحًا (25 دقيقة)\n3. يتعرف نوع النص (سردي وصفي) وموضوعه (10 دقائق)"], ["الاستراتيجيات", "العصف الذهني\nالقراءة النموذجية والمحاكاة\nمسابقات القراءة"], ["مصادر التعلم", "كتاب الطالب ص52-54\nصور لجامع السلطان قابوس الأكبر مع صوت الأذان\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض صور لأشهر المساجد مصحوبة بصوت الأذان\n- نقاش: دور المسجد في تهذيب الأخلاق وتوطيد العلاقات\n- الوصول إلى العنوان"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة النموذجية: قراءة نموذجية مع إبراز نطق التواريخ الهجرية والميلادية (1412هـ/1992م، 1415هـ/1995م، 2001م) والأرقام (1564، 330)؛ تدريب على نطق: الفسيفساء، المشربيات، الأرجواني، الأروقة (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. قراءات: قراءة الطلبة فقرات متتابعة، تصويب الأخطاء فور وقوعها (10 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة.\n\n3. الغلق: قارئ الحصة يقرأ فقرة الحديقة، تمهيد للقراءة الصامتة (3 دقائق)\nالاستراتيجيات: مسابقات القراءة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) في أي عام صدرت التوجيهات السامية بإنشاء الجامع؟\nالإجابة النموذجية: عام 1412هـ (1992م)\n2) (تطبيق) متى افتُتح الجامع رسميًا؟\nالإجابة النموذجية: عام 2001م\n3) (استدلال) انطق كلمة (الفسيفساء) نطقًا صحيحًا واذكر معناها.\nالإجابة النموذجية: الفُسَيْفِساء: قطع صغيرة ملونة من الحجر أو الزجاج تُرصّ لتشكّل زخارف"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم استمر البناء؟\nالإجابة النموذجية: ست سنوات متواصلة\n2) (تطبيق) ما خط كتابة الآيات القرآنية على أركان الجامع؟\nالإجابة النموذجية: خط الثلث\n3) (استدلال) اقرأ الفقرة الأخيرة قراءة جهرية معبرة.\nالإجابة النموذجية: قراءة سليمة تراعي الترقيم والضبط"], ["الواجب المنزلي", "تدرّب على قراءة النص واكتب أرقام النص وتواريخه بالحروف.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 34, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 2, "n": 5, "wi": 6, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يستنبط الفكرة العامة والأفكار الجزئية للنص (5 دقائق)\n2. يوضح دلالات المفردات في سياقاتها (أروقة، قباب، فوانيس، ينتابك) (25 دقيقة)\n3. يحدد نوع الكلمة وجذرها الثلاثي (10 دقائق)"], ["الاستراتيجيات", "ملخصات العمودين\nالتعلم التعاوني\nالقراءة الصامتة الموجهة"], ["مصادر التعلم", "كتاب الطالب ص52-55\nأوراق ملخص العمودين\nبطاقات ممغنطة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق ووضع خط تحت المفردات الجديدة"], ["إجراءات التنفيذ (23 دقيقة)", "1. ثروتي اللغوية: إكمال النمط: أروقة جمع رواق (ممر خارجي محاط بأعمدة)، قباب جمع قبة، فوانيس جمع فانوس؛ تحديد نوع الكلمة وحروفها الأساسية: تبهرك (فعل مضارع: ب هـ ر)، المصقولة، مآذن، تبهج؛ معنى (ينتابك): يصيبك (10 دقائق)\nالاستراتيجيات: ملخصات العمودين.\n\n2. ملخص العمودين: تقسيم النص فقرات وتلخيص كل فقرة: التوجيهات السامية والهدف، مدة البناء والافتتاح، الانطباع الأول والآيات بخط الثلث، المآذن والقباب، الأبواب والحجارة، الأروقة والفوانيس، المكتبة، الحديقة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: عرض ملخصات العمودين وترتيب الأفكار الجزئية على السبورة (3 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: وصف جامع السلطان قابوس الأكبر وعمارته وأهدافه\n2) (تطبيق) ما مفرد (قباب)؟ وما معناه؟\nالإجابة النموذجية: قبة: بناء مستدير مقوس مجوف\n3) (استدلال) ما معنى (ينتابك)؟\nالإجابة النموذجية: يصيبك"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الحروف الأساسية لكلمة (مآذن)؟\nالإجابة النموذجية: أ ذ ن\n2) (تطبيق) لخص في جملة الفقرة الخاصة بالأروقة.\nالإجابة النموذجية: أروقة الجامع تمثل طرزًا معمارية لحضارات إسلامية مختلفة وتزينها فوانيس جميلة\n3) (استدلال) وظّف (تبهرك) في جملة من إنشائك.\nالإجابة النموذجية: مثل: تبهرك ألوان الحديقة في فصل الربيع"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية) في الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 35, "w": 5, "wl": "الخامس", "date": "4-8 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 3, "n": 5, "wi": 7, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يبين الهدف من بناء الجامع كما ورد في النص (15 دقيقة)\n2. يستدل على دقة تصميم الجامع من عناصره المعمارية (5 دقائق)\n3. يصف عناصر الجامع (المآذن، القبة، الأبواب، الأروقة) ودلالاتها (20 دقيقة)"], ["الاستراتيجيات", "الحوار والمناقشة\nالتعلم التعاوني\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص55-57\nصور تفصيلية للجامع\nورق A4"], ["التهيئة (5 دقائق)", "سؤال: لو زرت الجامع، ما أول شيء يلفت نظرك؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الهدف والتصميم: الهدف: ليس مكانًا للصلاة فقط، بل مركز للتفاعل مع روح الإسلام لا ينفصل فيه العلم عن العمل؛ دقة التصميم: الأحجار المصقولة يدويًا، الآيات بخط الثلث، المآذن الخمس، القبة ذات الغشاء المخرّم (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. الخريطة: خريطة مفاهيم لعناصر الجامع: المآذن (خمس ترمز إلى أركان الإسلام)، القبة (غشاء مخرم وطبقة فسيفساء ذهبية)، الأبواب (خشبية مزخرفة بمشربيات وزجاج ملون)، الحجارة (أبيض للمصلى وأرجواني لغيره)، الأروقة (330 فانوسًا)، المكتبة (نحو 20 ألف مجلد) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: كل مجموعة تكتب جملة تبدأ بـ: جامع السلطان قابوس رمز لـ (3 دقائق)\nالاستراتيجيات: خرائط المفاهيم."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الهدف من بناء الجامع؟\nالإجابة النموذجية: أن يكون مركزًا للتفاعل مع روح الإسلام لا للصلاة فقط، لا ينفصل فيه العلم عن العمل\n2) (تطبيق) إلامَ ترمز المآذن الخمس؟\nالإجابة النموذجية: إلى أركان الإسلام الخمسة\n3) (استدلال) لماذا استُعمل حجران مختلفا اللون؟\nالإجابة النموذجية: الأبيض لحرم الصلاة والأرجواني لغيره ليُعطي تمايزًا جميلًا بين أماكن العبادة والأروقة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كم مجلدًا تضم مكتبة الجامع تقريبًا؟\nالإجابة النموذجية: نحو عشرين ألف مجلد\n2) (تطبيق) من أين يتأصل طراز الشرفات التي تزين جدران المصلى؟\nالإجابة النموذجية: من عمارة القلاع العمانية\n3) (استدلال) دلّل على أن الجامع أعطى المكان بعدًا ثقافيًا.\nالإجابة النموذجية: أروقته متحف فني لحضارات إسلامية مختلفة، وفيه مكتبة كبيرة في شتى العلوم"], ["الواجب المنزلي", "صمم بطاقة تعريفية بالجامع لزائر أجنبي.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 36, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 4, "n": 5, "wi": 1, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يحدد خصائص النص السردي الوصفي (5 دقائق)\n2. يحاكي أساليب الوصف الواردة في النص (15 دقيقة)\n3. يميز الجمل السردية من الوصفية في النص (20 دقيقة)"], ["الاستراتيجيات", "التعلم التعاوني\nالمحاكاة\nتصنيف البطاقات"], ["مصادر التعلم", "كتاب الطالب ص56-58\nقصاصات ورقية لخصائص النص\nصندوق"], ["التهيئة (5 دقائق)", "- قراءة صامتة خمس دقائق\n- سؤال: هل يحكي النص قصة أم يصف مكانًا؟ أم كليهما؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الخصائص: سرد تاريخ إنشاء الجامع بتسلسل زمني، ووصف دقيق لعناصره المعمارية، واستعمال الأرقام والتواريخ، والألفاظ الحسية (تبهرك، تريح النظر)، والجمل الاسمية الوصفية؛ تصنيف جمل النص: سردية/وصفية (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. المحاكاة: محاكاة: (ما إن يتراءى الجامع أمام ناظريك حتى ينتابك إحساس...)؛ محاكاة: (لتشكل لوحة جمالية تريح النظر وتبهج النفس)؛ كتابة جملتين عن مكان في المدرسة بالأسلوب نفسه (10 دقائق)\nالاستراتيجيات: المحاكاة.\n\n3. الغلق: نشاط القصاصات: كل مجموعة تختار خصائص النص الصحيحة وتشكلها على هيئة مئذنة (3 دقائق)\nالاستراتيجيات: تصنيف البطاقات."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر خاصيتين من خصائص النص السردي الوصفي.\nالإجابة النموذجية: التسلسل الزمني للأحداث، والوصف الدقيق للمكان بتفاصيله\n2) (تطبيق) صنّف: (وافتتح رسميًا عام 2001م).\nالإجابة النموذجية: جملة سردية\n3) (استدلال) صنّف: (تتوسطها بركة رخامية ومجرى مياه).\nالإجابة النموذجية: جملة وصفية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حاكِ: (ما إن ... حتى ...).\nالإجابة النموذجية: مثل: ما إن دخلت المكتبة حتى شعرت بالهدوء والسكينة\n2) (تطبيق) لماذا أكثر الكاتب من الأرقام والتواريخ؟\nالإجابة النموذجية: لتوثيق المعلومات وإظهار دقتها وعظمة المنجز\n3) (استدلال) حاكِ عبارة (تريح النظر وتبهج النفس) في وصف حديقة.\nالإجابة النموذجية: مثل: حديقة غنّاء تسرّ العين وتشرح الصدر"], ["الواجب المنزلي", "اكتب خمسة أسطر تصف فيها مسجد حيّكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=20"]]}, {"no": 37, "w": 6, "wl": "السادس", "date": "11-15 أكتوبر 2026م", "unit": "المحور الثاني: الوطن", "title": "الدرس الأول: منارة عمانية ترفع صوت التوحيد", "k": 5, "n": 5, "wi": 2, "wn": 7, "pages": "52-58", "f": [["عنوان الدرس", "الدرس الأول: منارة عمانية ترفع صوت التوحيد"], ["نواتج التعلم", "1. يستخلص القيم الإيجابية الواردة في الدرس (15 دقيقة)\n2. يحل أنشطة الكتاب المتبقية (15 دقيقة)\n3. يبدي رأيه في أهمية المساجد ودورها الحضاري (10 دقائق)"], ["الاستراتيجيات", "ترشيح القيم (القمع)\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص57-58\nقمع ورقي وقصاصات\nالسبورة"], ["التهيئة (5 دقائق)", "سؤال: ما الذي تعلمته من هذا النص غير المعلومات؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. ترشيح القيم: عصف ذهني بالقيم: الاعتزاز بالدين والوطن، تقدير الفنون الإسلامية، الحرص على العلم، المحافظة على المنجزات، احترام بيوت الله؛ ترشيحها وفق معايير في القمع (10 دقائق)\nالاستراتيجيات: ترشيح القيم (القمع).\n\n2. حل الأنشطة: حل أسئلة (أحلل النص) المتبقية؛ نقاش: كيف نحافظ على الجامع عند زيارته؟؛ ربط بآداب المسجد (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – مرشدون عند المنارة: يتقمص طالب من كل مجموعة دور مرشد يعرّف الزوار بالمعلم الوارد في النص، مستعملًا أعلامه وأرقامه بنطق صحيح، ويذكر آداب زيارة المساجد في عمان كالهدوء واللباس المحتشم (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) استخرج قيمتين من النص.\nالإجابة النموذجية: الاعتزاز بالدين والوطن، والمحافظة على المنجزات الحضارية\n2) (تطبيق) ما واجبنا عند زيارة الجامع؟\nالإجابة النموذجية: احترام المكان والتزام آدابه والمحافظة على نظافته وممتلكاته\n3) (استدلال) لماذا يعد الجامع منجزًا وطنيًا؟\nالإجابة النموذجية: لأنه صرح ديني وثقافي يعكس حضارة عمان واعتزازها بالإسلام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما دور المسجد في المجتمع؟\nالإجابة النموذجية: مكان للعبادة والعلم وتوطيد العلاقات بين الناس\n2) (تطبيق) برأيك، لماذا ضم الجامع مكتبة؟\nالإجابة النموذجية: لأن الإسلام يحث على العلم ولكي يكون الجامع مركزًا علميًا وثقافيًا\n3) (استدلال) اكتب رسالة قصيرة تشكر فيها من أسهم في بناء هذا الصرح.\nالإجابة النموذجية: رسالة قصيرة صحيحة اللغة تعبّر عن الشكر والاعتزاز"], ["الواجب المن
