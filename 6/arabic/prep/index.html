3. غلق الدرس – همم الشباب: تكتب المجموعات بخط الرقعة عبارة فيها الميم والهاء في مواضع مختلفة، مثل «همم الشباب تصنع مجد عمان»، ثم يقيم الزملاء دقة رسم الحرفين (5 دقائق)\nالاستراتيجيات: المعرض الجوال."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) هل ينزل ذيل الميم المتطرفة تحت السطر؟\nالإجابة النموذجية: نعم، ينزل ذيلها تحت خط القاعدة\n2) (تطبيق) كم شكلًا للهاء حسب موضعها؟\nالإجابة النموذجية: أربعة: أول الكلمة، ووسطها، وآخرها متصلة، وآخرها منفصلة\n3) (استدلال) اكتب (فهم) بالرقعة.\nالإجابة النموذجية: تقويم عملي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الميم والهاء مجردين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب: (مهندس، وجهه).\nالإجابة النموذجية: تقويم المواضع\n3) (استدلال) اكتب: (من جد وجد) بالرقعة.\nالإجابة النموذجية: تقويم التناسق"], ["الواجب المنزلي", "أكمل كراسة الخط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=40"]]}, {"no": 76, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة نص تفسيري", "k": 1, "n": 2, "wi": 6, "wn": 7, "pages": "189-192", "f": [["عنوان الدرس", "التعبير: كتابة نص تفسيري"], ["نواتج التعلم", "1. يعدد مواصفات النص التفسيري العلمي (15 دقيقة)\n2. يجمع المعلومات والحقائق عن حلم الطيران ويرتبها منطقيًا (15 دقيقة)\n3. يتعرف أدوات الربط المناسبة للنص التفسيري (10 دقائق)"], ["الاستراتيجيات", "خارطة المفاهيم\nالتعلم التعاوني\nالعصف الذهني"], ["مصادر التعلم", "كتاب الطالب ص189-192\nنص (وتحقق الحلم بالطيران)\nجهاز عرض"], ["التهيئة (5 دقائق)", "- سؤال: كيف تطير الطائرة؟\n- الوصول إلى أن النص التفسيري يجيب عن (كيف؟ ولماذا؟)"], ["إجراءات التنفيذ (23 دقيقة)", "1. المواصفات: النص التفسيري العلمي: يشرح ظاهرة أو اختراعًا بحقائق ومعلومات، لغته واضحة دقيقة، يستعمل المصطلحات، مرتب منطقيًا (مقدمة، شرح بالتسلسل، خاتمة)، أدوات الربط: لأن، لذلك، بسبب، ونتيجة لذلك، أولًا، ثم (10 دقائق)\nالاستراتيجيات: خارطة المفاهيم.\n\n2. جمع المعلومات: كل مجموعة تستخرج حقائق من الدرس: محاولات الإنسان، الأجنحة المقوسة، مشكلة التحكم، الحركات الثلاث، التجارب؛ ترتيبها منطقيًا في مخطط (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: عرض مخططات المجموعات (3 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما النص التفسيري العلمي؟\nالإجابة النموذجية: نص يشرح ظاهرة أو اختراعًا بالحقائق والمعلومات العلمية مرتبة منطقيًا\n2) (تطبيق) اذكر أداتي ربط للسبب والنتيجة.\nالإجابة النموذجية: لأن، ونتيجة لذلك (أو: بسبب، لذلك)\n3) (استدلال) ما الفرق بين النص التفسيري والنص الوصفي؟\nالإجابة النموذجية: التفسيري يشرح كيف ولماذا يحدث الشيء، والوصفي يصور شكله وصفاته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب منطقيًا: (التجارب – مراقبة الطيور – تحديد مشكلة التحكم – الطيران الناجح).\nالإجابة النموذجية: تحديد مشكلة التحكم، مراقبة الطيور، التجارب، الطيران الناجح\n2) (تطبيق) اكتب جملة تفسيرية تستعمل فيها (لأن).\nالإجابة النموذجية: مثل: تطفو البيضة القديمة لأن فراغها الهوائي كبير\n3) (استدلال) استخرج حقيقتين علميتين من الدرس.\nالإجابة النموذجية: الأجنحة المقوسة أفضل من المسطحة، والتحكم يكون بثلاث حركات"], ["الواجب المنزلي", "أكمل المخطط بالحقائق المرتبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=41"]]}, {"no": 77, "w": 11, "wl": "الحادي عشر", "date": "15-19 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة نص تفسيري", "k": 2, "n": 2, "wi": 7, "wn": 7, "pages": "189-192", "f": [["عنوان الدرس", "التعبير: كتابة نص تفسيري"], ["نواتج التعلم", "1. يكتب مقطعًا تفسيريًا علميًا عن حلم الطيران وتطوره (15 دقيقة)\n2. يوظف الروابط اللفظية والأساليب المناسبة للنص التفسيري (15 دقيقة)\n3. يستعمل علامات الترقيم استعمالًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتقويم التبادلي"], ["مصادر التعلم", "كتاب الطالب ص192\nالمخطط السابق\nقائمة تقويم"], ["التهيئة (5 دقائق)", "قراءة مقطع تفسيري نموذجي قصير وتحديد أجزائه"], ["إجراءات التنفيذ (23 دقيقة)", "1. الكتابة: مقدمة تطرح السؤال: كيف تحقق حلم الطيران؟؛ شرح متسلسل مع الروابط؛ خاتمة تبين أثر الطيران في حياتنا اليوم (10 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n2. المراجعة: تقويم بقائمة: الدقة العلمية، الترتيب المنطقي، الروابط، الترقيم، سلامة اللغة؛ تبادل وتصحيح (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – كيف يجري الفلج؟: تكتب كل مجموعة فقرة تفسيرية من ثلاث جمل تفسر جريان الماء في الفلج من منبعه إلى المزارع، مستخدمة أدوات ربط تفسيرية مثل «لأن» و«لذلك» و«ومن ثم» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اكتب مقدمة مناسبة للنص التفسيري.\nالإجابة النموذجية: مثل: حلم الإنسان بالطيران منذ آلاف السنين، فكيف تحقق هذا الحلم؟\n2) (تطبيق) وظف (ونتيجة لذلك) في جملة من موضوعك.\nالإجابة النموذجية: مثل: نجح الأخوان في التحكم بالطائرة، ونتيجة لذلك طارت أكثر من نصف ساعة\n3) (استدلال) ما علامة الترقيم بعد سؤال المقدمة؟\nالإجابة النموذجية: علامة الاستفهام"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب فقرة الشرح في خمس جمل مترابطة.\nالإجابة النموذجية: فقرة دقيقة مرتبة تستعمل روابط السبب والتتابع\n2) (تطبيق) اكتب خاتمة النص.\nالإجابة النموذجية: خاتمة تبين أثر الاختراع في حياتنا\n3) (استدلال) قيّم نص زميلك بمعيار الدقة العلمية.\nالإجابة النموذجية: تقويم محدد"], ["الواجب المنزلي", "بيّض النص التفسيري.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=41"]]}, {"no": 78, "w": 12, "wl": "الثاني عشر", "date": "22-24 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثاني: النقرات الثلاث", "k": 1, "n": 3, "wi": 1, "wn": 3, "pages": "90-98", "f": [["عنوان الدرس", "الدرس الثاني: النقرات الثلاث"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية معبرة عن المعنى (15 دقيقة)\n2. يفسر المفردات الجديدة من حيث المفرد والمرادف والمضاد (15 دقيقة)\n3. يستنتج الفكرة العامة ويقسم الدرس إلى أفكاره الجزئية (10 دقائق)"], ["الاستراتيجيات", "القفل والمفتاح\nأعواد المثلجات\nالقراءة النموذجية والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص90-94\nصورة جهاز لاسلكي\nبطاقات قفل ومفتاح"], ["التهيئة (5 دقائق)", "- صورة جهاز لاسلكي\n- سؤال: كيف كان الناس يرسلون الرسائل قديمًا؟ (الحمام الزاجل)\n- وكيف نرسلها اليوم؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة الجهرية: قراءة نموذجية مع إبراز لحظات الترقب والفرح؛ قراءات الطلبة؛ تمثيل حوار ماركوني ومساعده (10 دقائق)\nالاستراتيجيات: القفل والمفتاح.\n\n2. المفردات والأفكار: القفل والمفتاح: القفل كلمة والمفتاح معناها: المنال (الحصول)، افترّ ثغره (ابتسم)، أسارير (خطوط الوجه)، خافتة (ضعيفة)؛ الأفكار: ثقة ماركوني بنفسه، الاستعداد للتجربة، لحظات الانتظار والقلق، سماع النقرات، النجاح التاريخي (10 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n3. الغلق: قارئ الحصة يقرأ لحظة سماع النقرات (3 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) كم كان عمر ماركوني حين أجرى تجربته؟\nالإجابة النموذجية: سبعًا وعشرين سنة\n2) (تطبيق) ما معنى (افترّ ثغره عن ابتسامة)؟\nالإجابة النموذجية: ابتسم ابتسامة ظهرت معها أسنانه\n3) (استدلال) ما الفكرة العامة للنص؟\nالإجابة النموذجية: نجاح ماركوني في إرسال أول رسالة لاسلكية عبر المحيط الأطلسي بفضل ثقته وعزيمته"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما مضاد (خافتة)؟\nالإجابة النموذجية: واضحة أو عالية\n2) (تطبيق) أين اختار ماركوني مكان الإرسال؟ وأين الاستقبال؟\nالإجابة النموذجية: الإرسال على ساحل قرية في إنجلترا، والاستقبال على الساحل الأمريكي في الضفة الأخرى من الأطلسي\n3) (استدلال) ما الفكرة الجزئية لفقرة (مضت دقائق شبيهة بالسنوات)؟\nالإجابة النموذجية: قلق ماركوني وترقبه نتيجة التجربة"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=42"]]}, {"no": 79, "w": 12, "wl": "الثاني عشر", "date": "22-24 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثاني: النقرات الثلاث", "k": 2, "n": 3, "wi": 2, "wn": 3, "pages": "90-98", "f": [["عنوان الدرس", "الدرس الثاني: النقرات الثلاث"], ["نواتج التعلم", "1. يحدد أركان أول مراسلة لاسلكية في تاريخ البشرية (15 دقيقة)\n2. يقارن بين حال ماركوني قبل سماع النقرات وبعده (5 دقائق)\n3. يوضح أهمية الثقة بالنفس وتحديد الأهداف والتخطيط لها (20 دقيقة)"], ["الاستراتيجيات", "أصابع الكف\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص94-96\nمجسم كف\nجدول مقارنة"], ["التهيئة (5 دقائق)", "سؤال: ماذا كان يقول العلماء عن ماركوني؟ وكيف تعامل مع شكوكهم؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. أركان المراسلة: أصابع الكف: المرسل (محطة الإرسال في إنجلترا)، المستقبل (ماركوني وجهازه على الساحل الأمريكي)، الرسالة (ثلاث نقرات متفق عليها)، الوسيلة (الجهاز اللاسلكي مع السلك الممتد إلى طائرة ورقية)، الشهود (جماعة من العلماء) (10 دقائق)\nالاستراتيجيات: أصابع الكف.\n\n2. المقارنة والقيم: قبل: قلق واضطراب وترقب ومشاعر خوف؛ بعد: انبساط الأسارير والابتسام والفرح؛ القيم: الثقة بالنفس، العزيمة، تحديد الهدف، التخطيط، الصبر (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: كل طالب يكتب هدفًا له وخطوة لتحقيقه (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الرسالة التي أرسلت في التجربة؟\nالإجابة النموذجية: ثلاث نقرات متفق عليها\n2) (تطبيق) بمَ اتصل جهاز ماركوني للاستقبال؟\nالإجابة النموذجية: بسلك امتد عبر نافذة المختبر إلى طائرة ورقية تتأرجح في الجو\n3) (استدلال) صف حال ماركوني قبل سماع النقرات.\nالإجابة النموذجية: قلق مضطرب يصغي بكل قوته والخوف يملأ قلبه"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صف حاله بعد سماعها.\nالإجابة النموذجية: انبسطت أسارير وجهه وابتسم وعبّر عن فرحه لمساعده\n2) (تطبيق) كيف تعامل ماركوني مع شكوك العلماء؟\nالإجابة النموذجية: لم يقم لها وزنًا وباشر تجاربه بثقة وعزيمة\n3) (استدلال) ما أهمية تحديد الهدف والتخطيط كما يظهر في النص؟\nالإجابة النموذجية: أعد ماركوني كل شيء لنجاح تجربته فتحقق هدفه"], ["الواجب المنزلي", "اكتب مقارنة في جدول بين حال ماركوني قبل النقرات وبعدها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=42"]]}, {"no": 80, "w": 12, "wl": "الثاني عشر", "date": "22-24 نوفمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثاني: النقرات الثلاث", "k": 3, "n": 3, "wi": 3, "wn": 3, "pages": "90-98", "f": [["عنوان الدرس", "الدرس الثاني: النقرات الثلاث"], ["نواتج التعلم", "1. يوضح أثر اختراع ماركوني في عالمنا المعاصر (15 دقيقة)\n2. يستخلص القيم الإيجابية من الدرس (5 دقائق)\n3. يحل أنشطة الكتاب المتبقية (20 دقيقة)"], ["الاستراتيجيات", "بساط الريح\nأعواد المثلجات\nالتعلم التعاوني"], ["مصادر التعلم", "كتاب الطالب ص96-98\nصور لأجهزة اتصال حديثة\nبطاقات"], ["التهيئة (5 دقائق)", "- عرض صور: مذياع، هاتف محمول، قمر صناعي\n- سؤال: ما علاقتها بالنقرات الثلاث؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. أثر الاختراع: الاتصال اللاسلكي أساس المذياع والهواتف المحمولة والإنترنت اللاسلكي وأنظمة الملاحة والإنقاذ؛ بساط الريح: رحلة تخيلية إلى زمن لا اتصال فيه، كيف ستكون الحياة؟ (10 دقائق)\nالاستراتيجيات: بساط الريح.\n\n2. القيم والأنشطة: القيم: الثقة بالنفس، المثابرة، تقدير العلم والعلماء، الاتصال لخدمة البشرية؛ حل الأنشطة المتبقية بأعواد المثلجات (8 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n3. غلق الدرس – ثلاث خطوات لعمان 2040: تقسم المجموعات النص إلى أفكاره الجزئية، ثم تقترح على نمطه ثلاث خطوات يقدمها طالب عماني لخدمة رؤية عمان 2040، كالقراءة والابتكار والبحث العلمي (5 دقائق)\nالاستراتيجيات: العصف الذهني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اذكر جهازين حديثين يعتمدان على الاتصال اللاسلكي.\nالإجابة النموذجية: الهاتف المحمول، والمذياع (أو: شبكات الإنترنت اللاسلكي)\n2) (تطبيق) ما القيمة التي تعلمتها من ماركوني؟\nالإجابة النموذجية: الثقة بالنفس والعزيمة وعدم الالتفات لشكوك المحبطين\n3) (استدلال) لماذا يعد هذا الحدث تاريخيًا؟\nالإجابة النموذجية: لأنها أول رسالة لاسلكية تعبر المحيط الأطلسي في تاريخ البشرية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) كيف تتخيل الحياة لو لم يُخترع الاتصال اللاسلكي؟\nالإجابة النموذجية: إجابة معللة تذكر صعوبة الاتصال والإنقاذ والإعلام\n2) (تطبيق) اكتب رسالة شكر قصيرة لماركوني.\nالإجابة النموذجية: رسالة قصيرة تبين أثر اختراعه\n3) (استدلال) ما المقصود بقيمة تقدير العلماء؟\nالإجابة النموذجية: احترام جهودهم والاستفادة من علمهم والاقتداء بهم"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=42"]]}, {"no": 81, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الصرفية: المجرد والمزيد", "k": 1, "n": 3, "wi": 1, "wn": 5, "pages": "193-197", "f": [["عنوان الدرس", "الأنشطة الصرفية: المجرد والمزيد"], ["نواتج التعلم", "1. يتعرف معنى الفعل المجرد والفعل المزيد (15 دقيقة)\n2. يرجع الفعل إلى أصله ليحدد نوعه (15 دقيقة)\n3. يميز بين الفعل المجرد والمزيد (10 دقائق)"], ["الاستراتيجيات", "القصة\nالتعلم التعاوني\nبطاقات التصنيف"], ["مصادر التعلم", "كتاب الطالب ص193-195\nبطاقات أفعال\nالسبورة"], ["التهيئة (5 دقائق)", "- كلمتا (كتب، استكتب)\n- سؤال: ما الحروف المشتركة؟ وما الحروف التي زادت؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. الاستكشاف: المجرد: كل حروفه أصلية (كتب، فهم، درس)؛ المزيد: زيد على حروفه الأصلية حرف أو أكثر (أكرم، تعلّم، استخرج)؛ الطريقة: نرجع الفعل إلى الماضي المفرد الغائب ونحذف الحروف الزائدة (10 دقائق)\nالاستراتيجيات: القصة.\n\n2. التمييز: تصنيف بطاقات أفعال من نصوص المحور الثالث: طار (مجرد)، اخترع (مزيد)، راقب (مزيد)، صنع (مجرد)، استطاع (مزيد)؛ تحديد الحروف الأصلية (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: لعبة سريعة: مجرد أم مزيد؟ (3 دقائق)\nالاستراتيجيات: بطاقات التصنيف."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفعل المجرد؟\nالإجابة النموذجية: فعل جميع حروفه في الماضي أصلية\n2) (تطبيق) ما الفعل المزيد؟\nالإجابة النموذجية: فعل زيد على حروفه الأصلية حرف أو أكثر\n3) (استدلال) صنف (اخترع).\nالإجابة النموذجية: مزيد بحرفين (همزة الوصل والتاء)، وأصله (خ ر ع)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنف (فهم).\nالإجابة النموذجية: مجرد\n2) (تطبيق) ما الحروف الأصلية في (استخرج)؟\nالإجابة النموذجية: خ ر ج\n3) (استدلال) كيف تعرف الحروف الأصلية للفعل؟\nالإجابة النموذجية: بإرجاعه إلى الماضي المفرد الغائب وحذف ما يسقط في بعض التصاريف"], ["الواجب المنزلي", "استخرج خمسة أفعال مجردة وخمسة مزيدة من نص النقرات الثلاث.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=43"]]}, {"no": 82, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الصرفية: المجرد والمزيد", "k": 2, "n": 3, "wi": 2, "wn": 5, "pages": "193-197", "f": [["عنوان الدرس", "الأنشطة الصرفية: المجرد والمزيد"], ["نواتج التعلم", "1. يستخرج الفعل المزيد ويحدد نوع الزيادة (بحرف، بحرفين، بثلاثة) (25 دقيقة)\n2. يحدد الحروف الزائدة في الفعل (5 دقائق)\n3. يستنتج قاعدة الدرس (10 دقائق)"], ["الاستراتيجيات", "خرائط المفاهيم\nفكر - زاوج - شارك\nالجدول"], ["مصادر التعلم", "كتاب الطالب ص195-196\nجدول تحليل\nأوراق عمل"], ["التهيئة (5 دقائق)", "مراجعة: صنف خمسة أفعال بسرعة"], ["إجراءات التنفيذ (23 دقيقة)", "1. أنواع الزيادة: مزيد بحرف: أكرم، قدّم، قاتل؛ مزيد بحرفين: انطلق، اجتمع، تعلّم، تشارك؛ مزيد بثلاثة أحرف: استخرج، استعمل؛ تحليل كل فعل في جدول: الفعل، أصله، الحروف الزائدة، عددها (10 دقائق)\nالاستراتيجيات: خرائط المفاهيم.\n\n2. القاعدة: خريطة مفاهيم: الفعل ← مجرد / مزيد (بحرف، بحرفين، بثلاثة)؛ فكر زاوج شارك لتحليل أفعال الكتاب (10 دقائق)\nالاستراتيجيات: فكر.\n\n3. الغلق: عرض خريطة المفاهيم (3 دقائق)\nالاستراتيجيات: زاوج."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حدد الحرف الزائد في (أكرم).\nالإجابة النموذجية: الهمزة في أوله\n2) (تطبيق) كم حرفًا زيد في (اجتمع)؟ وما هي؟\nالإجابة النموذجية: حرفان: همزة الوصل والتاء\n3) (استدلال) صنف الزيادة في (استعمل).\nالإجابة النموذجية: مزيد بثلاثة أحرف (الهمزة والسين والتاء)"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حلل (تعلّم): الأصل والزائد.\nالإجابة النموذجية: الأصل (ع ل م)، والزائد التاء وتضعيف اللام (حرفان)\n2) (تطبيق) اكتب فعلًا مزيدًا بحرف وآخر بحرفين.\nالإجابة النموذجية: مثل: أنقذ / انطلق\n3) (استدلال) اكتب القاعدة في جملتين.\nالإجابة النموذجية: المجرد كل حروفه أصلية، والمزيد زيد على أصله حرف أو حرفان أو ثلاثة"], ["الواجب المنزلي", "حل تدريبات الكتاب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=43"]]}, {"no": 83, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الصرفية: المجرد والمزيد", "k": 3, "n": 3, "wi": 3, "wn": 5, "pages": "193-197", "f": [["عنوان الدرس", "الأنشطة الصرفية: المجرد والمزيد"], ["نواتج التعلم", "1. يحوّل الأفعال المجردة إلى أفعال مزيدة (5 دقائق)\n2. يلاحظ أثر الزيادة في المعنى (25 دقيقة)\n3. يوظف أفعالًا مجردة ومزيدة في جمل (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nالتقويم التبادلي\nالدقيقة الواحدة"], ["مصادر التعلم", "كتاب الطالب ص196-197\nبطاقات أفعال مجردة\nأوراق عمل"], ["التهيئة (5 دقائق)", "الدقيقة الواحدة: كوّن أكبر عدد من الأفعال المزيدة من (علم)"], ["إجراءات التنفيذ (23 دقيقة)", "1. التحويل: علم ← أعلم، علّم، تعلّم، استعلم؛ خرج ← أخرج، خرّج، استخرج؛ ملاحظة: الزيادة تغيّر المعنى (تعلّم غير علّم) (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التوظيف: كل مجموعة تكتب جملتين لكل فعل مزيد؛ تبادل وتصحيح؛ حل تدريبات الكتاب (8 دقائق)\nالاستراتيجيات: التقويم التبادلي.\n\n3. غلق الدرس – جذور من النخلة: تستخرج المجموعات أفعالًا من الزراعة العمانية، مثل «زرع» و«سقى» و«أثمر» و«اخضرّ»، وترجعها إلى أصولها لتصنفها إلى مجرد ومزيد، وتنال نقطة عن كل تصنيف صحيح (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حوّل (كسر) إلى مزيد بحرف.\nالإجابة النموذجية: كسّر (بتضعيف السين)\n2) (تطبيق) ما الفرق في المعنى بين (علم) و(تعلّم)؟\nالإجابة النموذجية: علم: عرف، وتعلّم: اكتسب العلم بالجهد والتدرج\n3) (استدلال) حوّل (خرج) إلى مزيد بثلاثة أحرف.\nالإجابة النموذجية: استخرج"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب جملة فيها فعل مزيد بحرفين.\nالإجابة النموذجية: مثل: انطلقت الطائرة في السماء\n2) (تطبيق) حوّل (فهم) إلى مزيد وضعه في جملة.\nالإجابة النموذجية: مثل: تفاهم الأخوان على حل المشكلة\n3) (استدلال) صنف أفعال الجملة: (استطاع ماركوني أن يرسل رسالة).\nالإجابة النموذجية: استطاع: مزيد بثلاثة، يرسل: مزيد بحرف (أرسل)"], ["الواجب المنزلي", "حوّل خمسة أفعال مجردة إلى مزيدة واستعملها في جمل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=43"]]}, {"no": 84, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على الواو)", "k": 1, "n": 1, "wi": 4, "wn": 5, "pages": "198-199", "f": [["عنوان الدرس", "الأنشطة الإملائية: تطبيقات (الهمزة المتوسطة على الواو)"], ["نواتج التعلم", "1. يذكر مواضع كتابة الهمزة المتوسطة على الواو (5 دقائق)\n2. يميز بين مواضع كتابة الهمزة المتوسطة على الألف ومواضعها على الواو (25 دقيقة)\n3. يكتب الهمزة المتوسطة كتابة صحيحة في فقرة (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nبطاقات التصنيف\nالإملاء المنظور"], ["مصادر التعلم", "كتاب الطالب ص198-199\nبطاقات كلمات\nالسبورة"], ["التهيئة (5 دقائق)", "- بطاقتان كبيرتان (ألف) و(واو)\n- المعلم يقرأ كلمة ويرفع الطلبة البطاقة المناسبة"], ["إجراءات التنفيذ (23 دقيقة)", "1. المقارنة: جدول: على ألف (سأل، رأس، يسأل) / على واو (مؤمن، سؤال، يقرؤون)؛ التعليل بقاعدة الحركة الأقوى (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التطبيق: حل تدريبات الكتاب؛ إملاء منظور لفقرة قصيرة؛ تصحيح ذاتي (8 دقائق)\nالاستراتيجيات: بطاقات التصنيف.\n\n3. غلق الدرس – مؤتمر صحفي صغير: يعقد كل زوج مؤتمرًا صحفيًا قصيرًا عن مبادرة بيئية عمانية، فيكتب سؤالين وجوابين يتضمنان همزة متوسطة على واو أو ألف، ويميز الزوج المجاور بينهما (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) علل كتابة الهمزة في (تفاؤُل).\nالإجابة النموذجية: لأنها مضمومة وما قبلها مفتوح، والضمة أقوى فتكتب على واو\n2) (تطبيق) ميّز: (رأْس) و(رُؤوس).\nالإجابة النموذجية: الأولى على ألف (ساكنة بعد فتح)، والثانية على واو (مضمومة بعد ضم)\n3) (استدلال) اكتب الهمزة: (م_تمر، ي_خذ).\nالإجابة النموذجية: مؤتمر، يأخذ"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) صنف حسب كرسي الهمزة: (فأر، مؤذن، مسألة، لؤلؤة).\nالإجابة النموذجية: على ألف: فأر، مسألة / على واو: مؤذن، لؤلؤة\n2) (تطبيق) اكتب الفقرة المملاة صحيحة.\nالإجابة النموذجية: تقويم الدقة\n3) (استدلال) لماذا كتبت الهمزة على واو في (يُؤَدّي)؟\nالإجابة النموذجية: لأنها مفتوحة وما قبلها مضموم، والضمة أقوى"], ["الواجب المنزلي", "حل بقية التدريبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=44"]]}, {"no": 85, "w": 13, "wl": "الثالث عشر", "date": "29 نوفمبر - 3 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "خط الرقعة: (ي، ى)", "k": 1, "n": 1, "wi": 5, "wn": 5, "pages": "200", "f": [["عنوان الدرس", "خط الرقعة: (ي، ى)"], ["نواتج التعلم", "1. يرسم حرفي الياء والألف المقصورة مجردين بخط الرقعة (15 دقيقة)\n2. يكتب الياء في مواضعها المختلفة والألف المقصورة في نهاية الكلمة (15 دقيقة)\n3. يكتب جملة بالرقعة مراعيًا قواعد الرسم (10 دقائق)"], ["الاستراتيجيات", "ورق الملاحظات\nالنمذجة والمحاكاة"], ["مصادر التعلم", "كتاب الطالب ص200\nأقلام مشطوفة\nأوراق ملاحظات"], ["التهيئة (5 دقائق)", "سؤال: ما الفرق بين (على) و(علي) في الكتابة والمعنى؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. النمذجة: الياء المتطرفة ذيلها يرتد إلى اليمين تحت السطر، ونقطتاها شرطة صغيرة؛ الياء في الأول والوسط سنّة صغيرة مع النقطتين؛ الألف المقصورة مثل الياء بلا نقط؛ أمثلة: يد، سيف، وادي، هدى، مستشفى (10 دقائق)\nالاستراتيجيات: ورق الملاحظات.\n\n2. المحاكاة في الكتاب والتصويب؛ كتابة جملة الكتاب (8 دقائق)\nالاستراتيجيات: النمذجة والمحاكاة.\n\n3. غلق الدرس – نزوى بيضة الإسلام: تكتب كل مجموعة بخط الرقعة عبارة فيها الياء والألف المقصورة، مثل «نزوى بيضة الإسلام» أو «عمان وطني»، ثم تعرض المجموعات كتاباتها ويقيمها الزملاء (5 دقائق)\nالاستراتيجيات: المعرض الجوال."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفرق في الرسم بين الياء والألف المقصورة؟\nالإجابة النموذجية: الياء منقوطة والألف المقصورة بلا نقط\n2) (تطبيق) كيف تكتب نقطتا الياء في الرقعة؟\nالإجابة النموذجية: شرطة صغيرة\n3) (استدلال) اكتب (هدى) بالرقعة.\nالإجابة النموذجية: تقويم عملي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الياء والألف المقصورة مجردتين ثلاث مرات.\nالإجابة النموذجية: تقويم عملي\n2) (تطبيق) اكتب: (سيف، مستشفى).\nالإجابة النموذجية: تقويم المواضع\n3) (استدلال) اكتب: (العلم يبني الأمم) بالرقعة.\nالإجابة النموذجية: تقويم التناسق"], ["الواجب المنزلي", "اكتب في كراسة الخط بيتًا من قصيدة (مدرسة الأخلاق) بخط الرقعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=45"]]}, {"no": 86, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة مقال عن شخصية علمية", "k": 1, "n": 2, "wi": 1, "wn": 7, "pages": "201-203", "f": [["عنوان الدرس", "التعبير: كتابة مقال عن شخصية علمية"], ["نواتج التعلم", "1. يتعرف مفهوم المقال العلمي وأنواعه وعناصره (15 دقيقة)\n2. يجمع معلومات عن شخصية علمية من مصادر موثوقة (15 دقيقة)\n3. ينظم المعلومات في مخطط (مقدمة، عرض، خاتمة) (10 دقائق)"], ["الاستراتيجيات", "العصف الذهني\nالتعلم التعاوني\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص201-203\nبطاقات معلومات عن علماء\nمركز مصادر التعلم"], ["التهيئة (5 دقائق)", "- عرض صور: ابن الهيثم، ماركوني، الأخوان رايت\n- سؤال: ماذا تعرف عن كل منهم؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. المفهوم: المقال: قطعة نثرية تعالج موضوعًا واحدًا بأفكار مترابطة؛ عناصره: عنوان، مقدمة، عرض، خاتمة؛ المقال عن شخصية علمية: النشأة، التعليم، الإنجازات، الصفات، الأثر (10 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. التخطيط: كل مجموعة تختار عالمًا وتجمع معلوماته في مخطط؛ التأكد من دقة المعلومات ومصادرها (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: عرض مخطط متميز (3 دقائق)\nالاستراتيجيات: خرائط المفاهيم."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما المقال؟\nالإجابة النموذجية: قطعة نثرية تعالج موضوعًا واحدًا بأفكار مترابطة لها مقدمة وعرض وخاتمة\n2) (تطبيق) اذكر عناصر المقال عن شخصية علمية.\nالإجابة النموذجية: النشأة، والتعليم، والإنجازات، والصفات، والأثر\n3) (استدلال) لماذا نتحقق من مصادر المعلومات؟\nالإجابة النموذجية: لضمان دقتها وصحتها"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب أجزاء المقال: (الخاتمة – العرض – العنوان – المقدمة).\nالإجابة النموذجية: العنوان، المقدمة، العرض، الخاتمة\n2) (تطبيق) اذكر إنجازًا لعالم درسته في المحور.\nالإجابة النموذجية: ماركوني: أول رسالة لاسلكية عبر الأطلسي (أو الأخوان رايت: أول طائرة)\n3) (استدلال) اكتب عنوانًا جذابًا لمقال عن عالم تختاره.\nالإجابة النموذجية: عنوان قصير معبر"], ["الواجب المنزلي", "اجمع معلومات عن العالم الذي اخترته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=46"]]}, {"no": 87, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة مقال عن شخصية علمية", "k": 2, "n": 2, "wi": 2, "wn": 7, "pages": "201-203", "f": [["عنوان الدرس", "التعبير: كتابة مقال عن شخصية علمية"], ["نواتج التعلم", "1. يكتب مقالًا وصفيًا عن شخصية علمية مستعينًا بالمعلومات المجموعة (15 دقيقة)\n2. يوظف الروابط والأساليب المناسبة للنص الوصفي العلمي (15 دقيقة)\n3. يستخدم علامات الترقيم استخدامًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتقويم التبادلي"], ["مصادر التعلم", "المخطط والمعلومات المجموعة\nقائمة تقويم\nدفاتر التعبير"], ["التهيئة (5 دقائق)", "قراءة مقدمة نموذجية لمقال عن عالم"], ["إجراءات التنفيذ (23 دقيقة)", "1. الكتابة: كتابة المقدمة (تعريف موجز وجذب القارئ)؛ العرض بفقرات متتابعة؛ الخاتمة (أثر العالم والدرس المستفاد) (10 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n2. المراجعة: تقويم بقائمة: دقة المعلومات، الترابط، الروابط، الترقيم، سلامة اللغة؛ تحسين المسودة (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – عالم عماني في مقال: تختار كل مجموعة شخصية علمية عمانية معروفة كالخليل بن أحمد الفراهيدي أو الملاح أحمد بن ماجد، وتنظم عنها مخططًا سريعًا (مقدمة، عرض، خاتمة) ثم تعرضه (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) اكتب مقدمة لمقالك.\nالإجابة النموذجية: مقدمة تعرّف بالعالم وتجذب القارئ\n2) (تطبيق) وظف رابطًا يدل على التتابع الزمني.\nالإجابة النموذجية: مثل: وبعد سنوات من البحث...\n3) (استدلال) أين تضع النقطتين الرأسيتين في مقالك؟\nالإجابة النموذجية: قبل التعداد أو القول المنقول"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب فقرة عن إنجازات العالم.\nالإجابة النموذجية: فقرة دقيقة مترابطة\n2) (تطبيق) اكتب خاتمة تبين أثره.\nالإجابة النموذجية: خاتمة مناسبة\n3) (استدلال) قيّم مقال زميلك بمعيارين.\nالإجابة النموذجية: تقويم محدد"], ["الواجب المنزلي", "بيّض المقال في دفتر التعبير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=46"]]}, {"no": 88, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثالث: قريب... غريب", "k": 1, "n": 4, "wi": 3, "wn": 7, "pages": "99-106", "f": [["عنوان الدرس", "الدرس الثالث: قريب... غريب"], ["نواتج التعلم", "1. يقرأ النص قراءة جهرية معبرة عن المعنى (15 دقيقة)\n2. ينوّع نبرة صوته في الحوار والنداء (قريب.. قريب، غريب.. غريب) (15 دقيقة)\n3. يتعرف كاتب النص محمد المخزنجي ومصدره (10 دقائق)"], ["الاستراتيجيات", "الكرسي الزائر\nالقراءة النموذجية والمحاكاة\nمسابقات القراءة"], ["مصادر التعلم", "كتاب الطالب ص99-101\nمقطع مرئي عن استخدامات الروبوت\nجهاز عرض"], ["التهيئة (5 دقائق)", "- عرض مقطع قصير عن الروبوت\n- أو الانطلاق من حديث الرجل الذي سقى الكلب فشكر الله له\n- أسئلة اكتشف النص"], ["إجراءات التنفيذ (23 دقيقة)", "1. القراءة النموذجية: قراءة نموذجية تبرز الفكاهة في المواقف؛ تدريب على نطق: الإلكترونية، الائتمانية، الاصطناعي، المرهفة (10 دقائق)\nالاستراتيجيات: الكرسي الزائر.\n\n2. قراءات: قراءة فقرات متتابعة، تصويب فوري (10 دقائق)\nالاستراتيجيات: القراءة النموذجية والمحاكاة.\n\n3. الغلق: سؤال تشويقي: لماذا سمي الدرس (قريب... غريب)؟ (3 دقائق)\nالاستراتيجيات: مسابقات القراءة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الذي كان الأبناء يحلمون به؟\nالإجابة النموذجية: اقتناء كلب صغير يلاعبهم وينبح إذا اقترب اللصوص\n2) (تطبيق) ما اسم الكلب الإلكتروني؟\nالإجابة النموذجية: بيبو\n3) (استدلال) كيف اشترى الأب الكلب؟\nالإجابة النموذجية: عبر أحد مواقع التجارة الإلكترونية ودفع ثمنه ببطاقته الائتمانية"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) من كاتب النص؟ وما مصدره؟\nالإجابة النموذجية: محمد المخزنجي، مجلة العربي الصغير\n2) (تطبيق) كم استغرق وصول الكلب؟\nالإجابة النموذجية: أقل من ثلاثة أسابيع، وصل في طرد بريدي\n3) (استدلال) اقرأ الفقرة التي تصف أخطاء بيبو قراءة معبرة.\nالإجابة النموذجية: قراءة تراعي الحوار والنبرة"], ["الواجب المنزلي", "تدرّب على قراءة النص.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=47"]]}, {"no": 89, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثالث: قريب... غريب", "k": 2, "n": 4, "wi": 4, "wn": 7, "pages": "99-106", "f": [["عنوان الدرس", "الدرس الثالث: قريب... غريب"], ["نواتج التعلم", "1. يجرد المفردات من أحرف الزيادة وصولًا إلى الجذر المعجمي (15 دقيقة)\n2. يوضح الفكرة العامة والأفكار الجزئية (5 دقائق)\n3. يبين أسباب رفض الأب وجود كلب في البيت (20 دقيقة)"], ["الاستراتيجيات", "معنى الكلمة\nالتعلم التعاوني\nالقراءة الصامتة الموجهة"], ["مصادر التعلم", "كتاب الطالب ص101-103\nبطاقات (معنى الكلمة)\nالسبورة"], ["التهيئة (5 دقائق)", "قراءة صامتة عشر دقائق مع تحديد المفردات"], ["إجراءات التنفيذ (23 دقيقة)", "1. المفردات: معنى الكلمة: بطاقة فيها الكلمة والجذر والمعنى وجملة؛ تجريد: مسليًا ← سلو، المدهشة ← دهش، المرهفة ← رهف، تنفرج ← فرج (10 دقائق)\nالاستراتيجيات: معنى الكلمة.\n\n2. الأفكار: الفكرة العامة: الكلب الإلكتروني الذكي يعجز عن التمييز كما يميز الكلب الحي؛ الأفكار: حلم الأبناء ورفض الأب، شراء الكلب الإلكتروني، مهمات بيبو المدهشة، أخطاء بيبو، تحوله إلى نكتة؛ أسباب الرفض: لا يحب حبس الحيوانات، الخوف من الأمراض، عدم وجود حديقة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: عرض بطاقات معنى الكلمة على السبورة (3 دقائق)\nالاستراتيجيات: القراءة الصامتة الموجهة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما الفكرة العامة للنص؟\nالإجابة النموذجية: الكلب الإلكتروني رغم ذكائه لا يغني عن قدرات الكائن الحي في التمييز\n2) (تطبيق) اذكر سببين لرفض الأب وجود كلب في البيت.\nالإجابة النموذجية: لا يحب حبس الحيوانات، ويحذر من الأمراض التي تنتقل منها (أو: لا حديقة في البيت)\n3) (استدلال) جرد (المدهشة) إلى جذرها.\nالإجابة النموذجية: د هـ ش"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما جذر (تنفرج)؟\nالإجابة النموذجية: ف ر ج\n2) (تطبيق) ما الفكرة الجزئية لفقرة (بدأ يغلط)؟\nالإجابة النموذجية: عجز بيبو عن التعرف على الأقارب إذا تغيرت هيئتهم\n3) (استدلال) ما معنى (حاسة السمع المرهفة)؟\nالإجابة النموذجية: حاسة السمع الدقيقة الحساسة"], ["الواجب المنزلي", "أجب عن أسئلة (ثروتي اللغوية).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=47"]]}, {"no": 90, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثالث: قريب... غريب", "k": 3, "n": 4, "wi": 5, "wn": 7, "pages": "99-106", "f": [["عنوان الدرس", "الدرس الثالث: قريب... غريب"], ["نواتج التعلم", "1. يصنف الأعمال التي يقوم بها الكلب بيبو (15 دقيقة)\n2. يناقش المشكلة التي ظهرت مع بيبو وسببها (15 دقيقة)\n3. يقارن بين الكلب الإلكتروني والكلب الحي (10 دقائق)"], ["الاستراتيجيات", "الكرسي الزائر\nالتعلم التعاوني\nجدول المقارنة"], ["مصادر التعلم", "كتاب الطالب ص103-105\nجدول مقارنة\nبطاقات"], ["التهيئة (5 دقائق)", "سؤال: لو كان عندك روبوت، ماذا تطلب منه أن يفعل؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. التصنيف والمشكلة: أعمال بيبو: اللعب (يركض خلف الكرة، يتقافز ويهز ذيله)، المهمات (التقاط الصور ونقلها للحاسوب، التعرف على الأقارب بصورهم، النباح والترديد)؛ المشكلة: يقول (غريب) للقريب إذا غيّر قميصه، لأنه يعتمد على صورة مخزنة فقط (10 دقائق)\nالاستراتيجيات: الكرسي الزائر.\n\n2. المقارنة: الكلب الحي: حاسة شم قوية تميز روائح الأشخاص، وسمع مرهف لدقات القلب؛ بيبو: ذاكرة صور فقط ويعجز عند تغير الهيئة؛ الكرسي الزائر: طالب يتقمص دور بيبو ويجيب عن أسئلة الزملاء (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. الغلق: الكرسي الزائر: بيبو يجيب عن سؤالين (3 دقائق)\nالاستراتيجيات: جدول المقارنة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) صنف عملًا من أعمال بيبو للعب وآخر للمهمات.\nالإجابة النموذجية: اللعب: الركض خلف الكرة، المهمات: التقاط الصور ونقلها إلى الحاسوب\n2) (تطبيق) ما المشكلة التي ظهرت مع بيبو؟\nالإجابة النموذجية: يخلط بين القريب والغريب فينبح على القريب إذا تغيرت هيئته\n3) (استدلال) ما سببها؟\nالإجابة النموذجية: يعتمد على الصور المخزنة في ذاكرته ولا يملك حاسة شم أو سمع كالكلب الحي"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الحاستان اللتان يتفوق بهما الكلب الحي على بيبو؟\nالإجابة النموذجية: الشم القوي والسمع المرهف\n2) (تطبيق) كيف استغل الأولاد عيب بيبو؟\nالإجابة النموذجية: غيروا ملابسهم ليفشل في التعرف عليهم، وأعاروا الزوار ملابس معروفة ليقول (قريب)\n3) (استدلال) هل ترى أن الذكاء الاصطناعي يغني عن الإنسان والكائنات الحية؟ علل.\nالإجابة النموذجية: تقبل الآراء المعللة، كأنه أداة مساعدة لا تملك حواس الكائن الحي وعقله"], ["الواجب المنزلي", "اقترح حلًا علميًا لمشكلة بيبو.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=47"]]}, {"no": 91, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الدرس الثالث: قريب... غريب", "k": 4, "n": 4, "wi": 6, "wn": 7, "pages": "99-106", "f": [["عنوان الدرس", "الدرس الثالث: قريب... غريب"], ["نواتج التعلم", "1. يستخلص القيم الإيجابية من الدرس (15 دقيقة)\n2. يوضح أهمية العقل البشري مقارنة بالتقانة الحديثة (5 دقائق)\n3. يحل أنشطة الكتاب المتبقية (20 دقيقة)"], ["الاستراتيجيات", "بيكس PECS (التواصل بالصور)\nالتعلم التعاوني\nالحوار والمناقشة"], ["مصادر التعلم", "كتاب الطالب ص105-106\nبطاقات صور\nالسبورة"], ["التهيئة (5 دقائق)", "- بطاقات صور (روبوت، دماغ، كلب، هاتف)\n- سؤال: رتبها حسب قدرتها على التفكير"], ["إجراءات التنفيذ (23 دقيقة)", "1. القيم: الرفق بالحيوان، الإبداع العلمي، الحكمة في اتخاذ القرار (موقف الأب)، الاعتدال في التعامل مع التقنية، تقدير نعمة العقل والحواس (10 دقائق)\nالاستراتيجيات: بيكس PECS (التواصل بالصور).\n\n2. الأنشطة: حل بقية أسئلة الكتاب؛ نقاش: عنوان الدرس ودلالته على المفارقة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق الدرس – قريب... ضيف عزيز: يؤدي كل زوج حوارًا بين صياد عماني وابنه يريان قاربًا يقترب، فيتناديان «قريب.. قريب!» و«غريب.. غريب!» بنبرات متنوعة، ويختمان بترحيب بالغريب على عادة العمانيين (5 دقائق)\nالاستراتيجيات: لعب الأدوار."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) استخرج قيمة من موقف الأب.\nالإجابة النموذجية: الحكمة والحرص على صحة أبنائه والرفق بالحيوان\n2) (تطبيق) ما دلالة عنوان الدرس؟\nالإجابة النموذجية: يلخص المفارقة: القريب يُرى غريبًا، فيبين عجز الآلة عن التمييز\n3) (استدلال) لماذا تحولت الأعجوبة إلى نكتة؟\nالإجابة النموذجية: لأن أخطاءها في التعرف على الناس صارت مثار ضحك الأولاد"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) ما الذي تتعلمه عن العقل البشري من النص؟\nالإجابة النموذجية: العقل البشري وحواس الكائن الحي أدق من الآلة في التمييز والفهم\n2) (تطبيق) اذكر قيمة علمية من النص.\nالإجابة النموذجية: الإبداع في الاختراع مع إدراك حدوده\n3) (استدلال) اقترح عنوانًا آخر للدرس.\nالإجابة النموذجية: عنوان مناسب معبر مثل: الأعجوبة الحائرة"], ["الواجب المنزلي", "حل بقية أنشطة الدرس.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=47"]]}, {"no": 92, "w": 14, "wl": "الرابع عشر", "date": "6-10 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة النحوية والصرفية: تطبيقات (اللازم والمتعدي والمجرد والمزيد)", "k": 1, "n": 1, "wi": 7, "wn": 7, "pages": "204-205", "f": [["عنوان الدرس", "الأنشطة النحوية والصرفية: تطبيقات (اللازم والمتعدي والمجرد والمزيد)"], ["نواتج التعلم", "1. يستخرج الفعل المتعدي واللازم والمجرد والمزيد (15 دقيقة)\n2. يحول الفعل المجرد إلى مزيد والمتعدي إلى لازم (15 دقيقة)\n3. يعرب الكلمات ويضبطها ضبطًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "التعلم التعاوني\nورقة واحدة وقلم واحد\nخرائط المفاهيم"], ["مصادر التعلم", "كتاب الطالب ص204-205\nجدول تحليل\nأوراق عمل"], ["التهيئة (5 دقائق)", "- جملة: (استخرج العالمُ الحقيقةَ)\n- سؤال: ماذا تعرف عن هذا الفعل؟ (مزيد بثلاثة، متعدٍّ)"], ["إجراءات التنفيذ (23 دقيقة)", "1. التحليل: جدول لكل فعل: لازم/متعدٍّ، مجرد/مزيد، الحروف الزائدة؛ أفعال من نص (قريب... غريب): يحلم، اشترى، وصل، يتعرف، يردد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الإعراب والتحويل: ورقة واحدة وقلم واحد: إعراب جمل التدريب؛ تحويل: خرج (لازم) ← أخرج الكتابَ (متعدٍّ)؛ ضبط الكلمات (8 دقائق)\nالاستراتيجيات: ورقة واحدة وقلم واحد.\n\n3. غلق الدرس – من الفرن إلى السوق: تكتب كل مجموعة جملة عن حرفة عمانية بفعل مجرد لازم، مثل «خرج الفخارُ من الفرن»، ثم تحوله إلى مزيد متعدٍّ «أخرج الحرفيُّ الفخارَ»، وتتبادل الجمل للإعراب (5 دقائق)\nالاستراتيجيات: الرؤوس المرقمة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حلل الفعل (وصل).\nالإجابة النموذجية: لازم مجرد\n2) (تطبيق) حلل الفعل (اشترى).\nالإجابة النموذجية: متعدٍّ مزيد بحرفين (الهمزة والتاء)\n3) (استدلال) أعرب (الكلبَ) في: (اشترى الأبُ الكلبَ).\nالإجابة النموذجية: مفعول به منصوب بالفتحة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) حوّل (فرح) اللازم إلى فعل متعدٍّ مزيد في جملة.\nالإجابة النموذجية: أفرحَ النجاحُ الطالبَ\n2) (تطبيق) حلل (يتعرّف).\nالإجابة النموذجية: مزيد بحرفين (التاء وتضعيف الراء)، يتعدى بحرف الجر غالبًا\n3) (استدلال) اضبط: (ردد بيبو كلمة غريب).\nالإجابة النموذجية: ردّدَ بيبو كلمةَ غريبٍ"], ["الواجب المنزلي", "أكمل التدريبات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=48"]]}, {"no": 93, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على الواو)", "k": 1, "n": 1, "wi": 1, "wn": 7, "pages": "206", "f": [["عنوان الدرس", "الأنشطة الإملائية: إملاء اختباري (الهمزة المتوسطة على الواو)"], ["نواتج التعلم", "1. يكتب فقرة مسموعة كتابة صحيحة (25 دقيقة)\n2. يكتب الهمزة المتوسطة على الواو والألف كتابة صحيحة (5 دقائق)\n3. يصحح أخطاءه ويعلل الصواب (10 دقائق)"], ["الاستراتيجيات", "جامع الألماس\nالتقويم الذاتي"], ["مصادر التعلم", "كتاب الطالب ص206\nفقرة إملائية من إعداد المعلم\nجهاز الفاكس كام"], ["التهيئة (5 دقائق)", "مراجعة قاعدة الحركة الأقوى بأمثلة على الواو والألف"], ["إجراءات التنفيذ (23 دقيقة)", "1. الإملاء: قراءة الفقرة كاملة؛ إملاؤها جملًا قصيرة مع التكرار؛ مراعاة النطق الواضح للهمزات (10 دقائق)\nالاستراتيجيات: جامع الألماس.\n\n2. التصحيح: عرض الفقرة الصحيحة؛ تصحيح ذاتي مع التعليل؛ جامع الألماس للمتميزين (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – إملاء المسؤولية: يملي كل طالب على زميله جملة عن المسؤولية الوطنية تتضمن همزة متوسطة على واو أو ألف، مثل «المؤمن يؤدي عمله بأمانة»، ثم يتبادلان التصحيح ويعللان الصواب (5 دقائق)\nالاستراتيجيات: تقييم الأقران."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) علل كتابة الهمزة في (يؤمن).\nالإجابة النموذجية: ساكنة بعد ضم، والضمة أقوى، فتكتب على واو\n2) (تطبيق) علل كتابة الهمزة في (يسأل).\nالإجابة النموذجية: مفتوحة بعد سكون، فتكتب على ألف\n3) (استدلال) اكتب جملة مملاة صحيحة.\nالإجابة النموذجية: تقويم الكتابة"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) اكتب الفقرة المملاة كتابة صحيحة.\nالإجابة النموذجية: تقويم الدقة\n2) (تطبيق) صحح أخطاءك مع التعليل.\nالإجابة النموذجية: تصويب مع ذكر القاعدة\n3) (استدلال) اكتب كلمتين همزتهما على واو من الفقرة.\nالإجابة النموذجية: من كلمات الفقرة"], ["الواجب المنزلي", "اكتب الفقرة صحيحة مرتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=49"]]}, {"no": 94, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة نص سردي يتضمن مقطعًا تفسيريًا", "k": 1, "n": 2, "wi": 2, "wn": 7, "pages": "207-209", "f": [["عنوان الدرس", "التعبير: كتابة نص سردي يتضمن مقطعًا تفسيريًا"], ["نواتج التعلم", "1. يجمع معلومات علمية تدعم فكرة نص سردي (5 دقائق)\n2. يرتب المعلومات والحقائق منطقيًا ويربطها بالفكرة الرئيسة (15 دقيقة)\n3. يعيد صياغة الحقائق الواردة في هامش الكتاب بأسلوبه (20 دقيقة)"], ["الاستراتيجيات", "التعلم التعاوني\nخرائط المفاهيم\nالنمذجة"], ["مصادر التعلم", "كتاب الطالب ص207-209\nهامش الحقائق في الكتاب\nجهاز عرض"], ["التهيئة (5 دقائق)", "- قراءة نص (اللغز) مثالًا: قصة يتخللها تفسير علمي لطفو البيض\n- سؤال: أين السرد؟ وأين التفسير؟"], ["إجراءات التنفيذ (23 دقيقة)", "1. البناء: نص سردي: شخصيات وأحداث وزمان ومكان؛ المقطع التفسيري: يوقف السرد ليشرح ظاهرة بحقائق علمية ثم يعود للأحداث؛ قراءة حقائق الهامش وإعادة صياغتها بأسلوب الطالب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التخطيط: كل طالب يخطط قصة قصيرة (مثلًا: رحلة إلى كهف، أو تجربة في المختبر) ويحدد موضع المقطع التفسيري والحقائق التي سيستعملها (10 دقائق)\nالاستراتيجيات: خرائط المفاهيم.\n\n3. الغلق: عرض مخطط متميز (3 دقائق)\nالاستراتيجيات: النمذجة."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) ما المقطع التفسيري داخل النص السردي؟\nالإجابة النموذجية: جزء يشرح ظاهرة علمية بحقائق ومعلومات ليدعم أحداث القصة\n2) (تطبيق) أعد صياغة حقيقة من الهامش بأسلوبك.\nالإجابة النموذجية: صياغة صحيحة تحافظ على المعنى العلمي\n3) (استدلال) ما الروابط المناسبة للمقطع التفسيري؟\nالإجابة النموذجية: لأن، لذلك، يعود السبب إلى، ونتيجة لذلك"], ["التقويم الختامي (7 دقائق)", "1) (معرفة) رتب: (العودة إلى الأحداث – المقطع التفسيري – بداية القصة – الحدث المثير).\nالإجابة النموذجية: بداية القصة، الحدث المثير، المقطع التفسيري، العودة إلى الأحداث\n2) (تطبيق) اكتب جملة تنتقل بها من السرد إلى التفسير.\nالإجابة النموذجية: مثل: تساءلت: لماذا يحدث ذلك؟ وعرفت أن السبب...\n3) (استدلال) لماذا نعيد صياغة الحقائق بأسلوبنا؟\nالإجابة النموذجية: لنثبت فهمها ولا ننسخها نسخًا"], ["الواجب المنزلي", "اكتب مسودة القصة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/6/arabic/?l=50"]]}, {"no": 95, "w": 15, "wl": "الخامس عشر", "date": "13-17 ديسمبر 2026م", "unit": "المحور الثالث: دنيا العلوم", "title": "التعبير: كتابة نص سردي يتضمن مقطعًا تفسيريًا", "k": 2, "n": 2, "wi": 3, "wn": 7, "pages": "207-209", "f": [["عنوان الدرس", "التعبير: كتابة نص سردي يتضمن مقطعًا تفسيريًا"], ["نواتج التعلم", "1. يكتب نصًا سرديًا متكاملًا يتضمن مقطعًا تفسيريًا علميًا (15 دقيقة)\n2. يوظف الروابط اللفظية والأساليب المناسبة (15 دقيقة)\n3. يستعمل علامات الترقيم المناسبة استعمالًا صحيحًا (10 دقائق)"], ["الاستراتيجيات", "الكتابة الموجهة\nالتقويم الذاتي\nالتقويم التبادلي"], ["مصادر التعلم", "المسودة\nقائمة تقويم\nدفاتر التعبير"], ["التهيئة (5 دقائق)", "تذكير بمعايير النص: سرد مشوق، تفسير دقيق، انتقال سلس"], ["إجراءات التنفيذ (23 دقيقة)", "1. الكتابة: تحسين المسودة وكتابة النص كاملًا؛ إدراج المقطع التفسيري في موضعه (10 دقائق)\nالاستراتيجيات: الكتابة الموجهة.\n\n2. المراجعة: تقويم بقائمة: عناصر السرد، دقة التفسير، الروابط، الترقيم، سلامة اللغة؛ تبادل وتصحيح؛ قراءة نماذج (8 دقائق)\nالاستراتيجيات: التقويم الذاتي.\n\n3. غلق الدرس – حكاية الخريف: تكتب كل مجموعة مقطعًا سرديًا قصيرًا عن أسرة تزور صلالة في موسم الخريف، وتضمّنه جملة تفسيرية بأسلوبها عن اخضرار الجبال بفعل الرذاذ والضباب (5 دقائق)\nالاستراتيجيات: التعلم التعاوني."], ["التقويم التكويني (5 دقائق)", "تفريد التعليم:\n1) (معرفة) حدد في const $=s=>document.querySelector(s);
let mode='sep',idx=0;
try{const s=JSON.parse(localStorage.getItem('noor6_اللغة العربية')||'{}');if(s.mode)mode=s.mode;if(s.idx!=null)idx=s.idx;}catch(e){}
const fw=$('#fw'),fl=$('#fl');
fw.innerHTML='<option value="">كل الأسابيع</option>'+[...new Set(D.map(p=>p.w))].map(w=>{const p=D.find(x=>x.w==w);return `<option value="${w}">الأسبوع ${p.wl} (${p.date})</option>`}).join('');
function fillLessons(){const w=fw.value;const ls=[...new Set(D.filter(p=>!w||p.w==w).map(p=>p.title))];const cur=fl.value;fl.innerHTML='<option value="">كل الدروس</option>'+ls.map(l=>`<option>${esc(l)}</option>`).join('');if(ls.includes(cur))fl.value=cur;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const UTH=/[\u0600-\u06FF]*[\u0656-\u065E\u0670\u0671\u06D6-\u06ED][\u0600-\u06FF]*/g;
function fmt(s){return esc(s).split(/(﴿[^﴾]+﴾)/).map(p=>p.startsWith('﴿')?'<span class="qr">'+p+'</span>':p.replace(UTH,w=>'<span class="qr">'+w+'</span>')).join('')}
function list(){return D.filter(p=>(!fw.value||p.w==fw.value)&&(!fl.value||p.title==fl.value))}
function card(p){return `<article class="card"><div class="ch"><div><h2>${esc(p.title)}</h2><div class="m">الأسبوع ${p.wl} (${p.date}) | ${esc(p.unit)} | الصفحات ${esc(p.pages)}</div></div><span class="badge">الحصة ${p.k} من ${p.n} | رقم ${p.no}</span></div>${p.f.map((f,i)=>`<div class="fld"><div class="k">${f[0]}</div><div class="v">${fmt(f[1])}</div><button class="cp" data-n="${p.no}" data-i="${i}" aria-label="نسخ ${f[0]}">نسخ</button></div>`).join('')}</article>`}
function save(){try{localStorage.setItem('noor6_اللغة العربية',JSON.stringify({mode,idx}))}catch(e){}}
function render(){const L=list();const app=$('#app');$('#m1').classList.toggle('on',mode=='sep');$('#m2').classList.toggle('on',mode=='all');
 if(!L.length){app.innerHTML='<div class="empty">لا توجد حصص تطابق الاختيار. غيّر الأسبوع أو الدرس.</div>';return}
 if(mode=='all'){app.innerHTML=L.map(card).join('');}
 else{if(idx>=L.length)idx=0;const p=L[idx];app.innerHTML=`<div class="nav"><button id="pv" ${idx==0?'disabled':''}>الحصة السابقة</button><span class="pos">${idx+1} من ${L.length}</span><button id="nx" ${idx==L.length-1?'disabled':''}>الحصة التالية</button></div>`+card(p);
  $('#pv').onclick=()=>{idx--;render()};$('#nx').onclick=()=>{idx++;render()};}
 save();}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const p=D.find(x=>x.no==b.dataset.n);const ok=await copyText(p.f[b.dataset.i][1]);b.textContent=ok?'تم النسخ':'تعذّر النسخ';b.classList.toggle('ok',ok);setTimeout(()=>{b.textContent='نسخ';b.classList.remove('ok')},1400)});
fw.onchange=()=>{fillLessons();idx=0;render()};fl.onchange=()=>{idx=0;render()};
$('#m1').onclick=()=>{mode='sep';render()};$('#m2').onclick=()=>{mode='all';render()};
document.addEventListener('keydown',e=>{if(mode!='sep'||e.target.tagName=='SELECT')return;const L=list();if(e.key=='ArrowLeft'&&idx<L.length-1){idx++;render()}if(e.key=='ArrowRight'&&idx>0){idx--;render()}});
fillLessons();render();
</script><script src="/assets/qlink.js" defer></script>
