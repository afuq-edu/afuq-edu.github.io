<title>مسابقات كاهوت - الدراسات الاجتماعية - الصف السادس</title>
<style>
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(/assets/f/a9cefdcae5467621.woff2) format('woff2');unicode-range:U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F;}
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(/assets/f/653bfd524aa46742.woff2) format('woff2');unicode-range:U+0000-00FF, U+2000-206F, U+2190-21FF, U+2713, U+20AC;}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(/assets/f/9e5c019d8d6e9acb.woff2) format('woff2');unicode-range:U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F;}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(/assets/f/ee160f53bfe85852.woff2) format('woff2');unicode-range:U+0000-00FF, U+2000-206F, U+2190-21FF, U+2713, U+20AC;}
@font-face{font-family:'Plex';font-weight:700;font-display:swap;src:url(/assets/f/27765dbaf24ff38f.woff2) format('woff2');unicode-range:U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F;}
@font-face{font-family:'Plex';font-weight:700;font-display:swap;src:url(/assets/f/9e002e656ff8bade.woff2) format('woff2');unicode-range:U+0000-00FF, U+2000-206F, U+2190-21FF, U+2713, U+20AC;}
:root{
  --bg:#edf3f5; --ink:#1f3442; --muted:#62747e; --card:#ffffff; --line:#d5e2e6;
  --teal:#2e7d7a; --teal-l:#e2f1ef; --ok:#3f9a63; --ok-l:#e3f4e9; --bad:#d06a5a; --bad-l:#fbe9e5; --gold:#d9a93f;
  --g0:#5db7ae; --g1:#ef9a80; --g2:#9d8bd6; --g3:#e0b64c; --g4:#6eaedc; --g5:#93be76;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Plex',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:
    radial-gradient(circle at 85% 10%, rgba(93,183,174,.13), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(239,154,128,.10), transparent 45%),
    repeating-linear-gradient(0deg, rgba(46,125,122,.045) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(46,125,122,.045) 0 1px, transparent 1px 64px);
  overflow-x:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #f0c36d;outline-offset:2px}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.2vw,28px)}
.screen.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1180px;margin:0 auto 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px}
.brand h1{margin:0;font-size:clamp(1.05rem,2vw,1.4rem);color:var(--teal)}
.brand p{margin:0;font-size:.85rem;color:var(--muted)}
.iconbtns{display:flex;gap:6px}
.ib{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;color:var(--teal);font-weight:600;font-size:.92rem}
.ib[aria-pressed="true"]{background:var(--teal-l)}
/* setup */
.setup{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.step h2{margin:0 0 10px;font-size:1.05rem;display:flex;align-items:center;gap:8px;color:#244b52}
.step h2 .num{width:26px;height:26px;border-radius:50%;background:var(--teal-l);color:var(--teal);display:grid;place-items:center;font-size:.9rem}
.unit{font-size:.82rem;color:var(--muted);margin:10px 0 5px;font-weight:600}
.unit:first-of-type{margin-top:0}
.lessons{display:grid;grid-template-columns:1fr;gap:6px}
.opt{border:1.5px solid var(--line);background:#fbfdfd;border-radius:12px;padding:8px 12px;text-align:right;color:var(--ink);transition:border-color .2s, background .2s}
.opt:hover{border-color:#a9cfcb}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l);font-weight:600}
.periods{display:grid;gap:6px;max-height:330px;overflow:auto;padding-left:2px}
.periods .opt small{display:block;color:var(--muted);font-size:.82rem;font-weight:500}
.empty{color:var(--muted);font-size:.92rem;padding:6px 0}
.counter{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.counter button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.2rem;color:var(--teal);font-weight:700}
.counter output{font-size:1.4rem;font-weight:700;min-width:28px;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.names label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;background:#fff}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.names input{border:0;font:inherit;width:100%;padding:4px 2px;color:var(--ink);background:transparent;outline:none}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:4px 16px;font-weight:600;color:var(--teal)}
.quick button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--teal)}
.range output{font-weight:700;font-size:1.2rem;min-width:30px;text-align:center}
.startrow{grid-column:1/-1;display:flex;justify-content:center;margin-top:4px;position:sticky;bottom:12px;z-index:3}
.start{border:0;background:var(--teal);color:#fff;font-weight:700;font-size:1.25rem;padding:12px 46px;border-radius:16px;box-shadow:0 6px 18px rgba(46,125,122,.25);transition:transform .15s, opacity .2s}
.start:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.start:not(:disabled):hover{transform:translateY(-2px)}
.hint{text-align:center;color:var(--muted);font-size:.88rem;margin-top:6px;grid-column:1/-1}
/* question */
.qwrap{max-width:1180px;margin:0 auto}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qcount{font-weight:700;color:var(--teal);background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 14px}
.turn{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.turn span{font-size:.88rem;color:var(--muted)}
.gchip{border:2px solid transparent;border-radius:20px;padding:4px 12px;background:#fff;font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:6px;opacity:.55;transition:all .2s}
.gchip.cur{opacity:1;box-shadow:0 3px 10px rgba(31,52,66,.12);transform:scale(1.05)}
.gchip:disabled{cursor:default}
.qgrid{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
.timer{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.timer svg{width:150px;height:150px;display:block;margin:0 auto}
.timer .ring-bg{fill:none;stroke:#e7eef1;stroke-width:10}
.timer .ring{fill:none;stroke:var(--teal);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke .4s}
.timer .ring.over{stroke:var(--gold)}
.timer .sec{font-size:42px;font-weight:700;fill:var(--ink)}
.timer .lbl{font-size:13px;fill:var(--muted)}
.pts{margin-top:6px;font-size:.95rem;color:var(--muted)}
.pts b{display:block;font-size:1.6rem;color:var(--ink)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.4vw,26px);min-height:300px}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pill{border-radius:20px;padding:2px 12px;font-size:.85rem;font-weight:600;background:var(--teal-l);color:var(--teal)}
.lvl{display:flex;gap:3px;align-items:center;font-size:.82rem;color:var(--muted)}
.lvl i{width:9px;height:9px;border-radius:50%;background:#d7e3e6;display:inline-block}
.lvl i.f{background:var(--gold)}
.qtext{font-size:clamp(1.25rem,2.6vw,2rem);font-weight:600;line-height:1.6;margin:4px 0 18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border:2px solid var(--line);background:#fbfdfd;border-radius:16px;padding:14px 16px;text-align:right;font-size:clamp(1rem,1.9vw,1.35rem);font-weight:600;color:var(--ink);display:flex;align-items:center;gap:10px;transition:transform .12s, border-color .2s, background .2s;min-height:64px}
.ans:hover:not(:disabled){border-color:#a9cfcb;transform:translateY(-2px)}
.ans .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1rem}
.ans:disabled{cursor:default}
.ans:disabled,.tile:disabled,.chip:disabled{color:var(--ink)}
.gain,.bar .plus{direction:ltr;unicode-bidi:isolate}
.ans.right{border-color:var(--ok);background:var(--ok-l)}
.ans.wrong{border-color:var(--bad);background:var(--bad-l)}
.ans.dim{opacity:.5}
.tf{grid-template-columns:1fr 1fr}
.tf .ans{justify-content:center;font-size:clamp(1.3rem,2.6vw,1.9rem);min-height:110px}
.sentence{font-size:clamp(1.25rem,2.6vw,2rem);font-weight:600;line-height:1.9;margin:4px 0 18px}
.slot{display:inline-block;min-width:150px;border-bottom:3px dashed #a9cfcb;margin:0 6px;text-align:center;color:var(--teal);padding:0 8px;transition:all .3s}
.slot.filled{border-bottom-style:solid;background:var(--teal-l);border-radius:8px 8px 0 0}
.slot.right{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.slot.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:2px solid var(--line);background:#fff;border-radius:30px;padding:10px 22px;font-weight:600;font-size:clamp(1rem,1.9vw,1.3rem);transition:transform .15s}
.chip:hover:not(:disabled){transform:translateY(-2px);border-color:#a9cfcb}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:var(--ok-l);opacity:1}
.chip.wrong{border-color:var(--bad);background:var(--bad-l);opacity:1}
.chip.dim{opacity:.4}
.ord{display:grid;gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:right;font-weight:600;font-size:clamp(1rem,1.8vw,1.25rem);display:flex;align-items:center;gap:10px;transition:all .2s}
.tile .o{flex:none;width:32px;height:32px;border-radius:50%;border:2px dashed #b8cfd3;display:grid;place-items:center;color:var(--teal);font-weight:700}
.tile.sel .o{border-style:solid;background:var(--teal);color:#fff;border-color:var(--teal)}
.tile.right{border-color:var(--ok);background:var(--ok-l)}
.tile.wrong{border-color:var(--bad);background:var(--bad-l)}
.ordtools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:.9rem}
.undo{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 14px;color:var(--teal);font-weight:600}
.feedback{margin-top:16px;border-radius:16px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feedback.on{display:flex;animation:fade .3s ease}
.feedback.ok{background:var(--ok-l);border:1.5px solid #b9e0c6}
.feedback.bad{background:var(--bad-l);border:1.5px solid #efc6bd}
.feedback .msg{font-size:1.1rem;font-weight:600}
.feedback .msg small{display:block;font-weight:500;color:var(--muted);font-size:.95rem}
.next{border:0;background:var(--teal);color:#fff;font-weight:700;border-radius:12px;padding:10px 22px;font-size:1.05rem}
.skip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 14px;color:var(--muted);font-weight:600;font-size:.9rem}
.qfoot{display:flex;justify-content:flex-start;margin-top:12px}
.gain{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:3rem;font-weight:700;color:var(--ok);pointer-events:none;opacity:0}
.gain.go{animation:gain 1.1s ease forwards}
@keyframes gain{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
/* results */
.rwrap{max-width:1000px;margin:0 auto;text-align:center}
.rwrap h2{margin:4px 0 2px;color:#244b52;font-size:clamp(1.2rem,2.4vw,1.7rem)}
.rwrap .sub{color:var(--muted);margin:0 0 10px}
.chart{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 14px 12px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2.4vw,30px);height:min(58vh,460px)}
.bar{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar .val{font-weight:700;font-size:clamp(1rem,2vw,1.4rem);margin-bottom:4px}
.bar .col{width:100%;border-radius:14px 14px 6px 6px;height:3%;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bar .rank{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.95rem;color:var(--ink);margin-bottom:4px}
.bar.win .rank{border-color:var(--gold);color:#9a7420}
.bar .nm{margin-top:8px;font-weight:600;font-size:clamp(.85rem,1.6vw,1.05rem);min-height:2.6em;line-height:1.3}
.bar.win .col{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--gold),0 10px 26px rgba(217,169,63,.35)}
.bar .plus{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;border-radius:14px;padding:1px 10px;font-weight:700;font-size:.92rem;opacity:0;transition:opacity .5s .9s}
.bar.win .plus{opacity:1}
.rfoot{margin-top:14px;display:flex;justify-content:center;gap:10px}
/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,20px);height:min(52vh,400px);margin:10px auto 0;max-width:760px}
.pod{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pod .who{font-weight:700;font-size:clamp(1rem,2.2vw,1.5rem);margin-bottom:2px}
.pod .sc{color:var(--muted);margin-bottom:6px;font-weight:600}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;color:#fff;font-size:clamp(1.6rem,4vw,2.8rem);font-weight:700}
.medal{font-size:2rem;line-height:1}
.rest{max-width:560px;margin:16px auto 0;display:grid;gap:6px}
.rest div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:600}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (max-width:860px){
  .setup{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
  .timer{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px}
  .timer svg{width:96px;height:96px;margin:0}
  .answers{grid-template-columns:1fr}
  .names{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="gain" id="gain"></div>

<!-- SETUP -->
<section class="screen on" id="sSetup">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fff" stroke="#2e7d7a" stroke-width="2"/><path d="M24 6 L28 24 L24 42 L20 24 Z" fill="#2e7d7a"/><path d="M6 24 L24 20 L42 24 L24 28 Z" fill="#ef9a80" opacity=".85"/><circle cx="24" cy="24" r="3" fill="#fff" stroke="#1f3442" stroke-width="1.5"/></svg>
      <div><h1>مسابقات كاهوت</h1><p>الدراسات الاجتماعية - الصف السادس - الفصل الدراسي الأول</p></div>
    </div>
    <div class="iconbtns"><button class="ib" data-mute aria-pressed="false">الصوت: يعمل</button><button class="ib" data-fs>ملء الشاشة</button></div>
  </div>
  <div class="setup">
    <div class="step">
      <h2><span class="num">1</span>اختر الدرس</h2>
      <div id="lessonList"></div>
    </div>
    <div style="display:grid;gap:14px;align-content:start">
      <div class="step">
        <h2><span class="num">2</span>اختر الحصة</h2>
        <div class="periods" id="periodList"><div class="empty">اختر الدرس أولًا لتظهر حصصه.</div></div>
      </div>
      <div class="step">
        <h2><span class="num">3</span>المجموعات</h2>
        <div class="counter"><button id="gMinus" aria-label="إنقاص">−</button><output id="gCount">4</output><button id="gPlus" aria-label="زيادة">+</button><span style="color:var(--muted);font-size:.9rem">من 2 إلى 6 مجموعات</span></div>
        <div class="names" id="names"></div>
      </div>
      <div class="step">
        <h2><span class="num">4</span>عدد الأسئلة</h2>
        <div class="quick" id="quick"></div>
        <div class="range"><input type="range" id="nq" min="1" max="20" value="10" aria-label="عدد الأسئلة"><output id="nqv">10</output></div>
      </div>
    </div>
    <div class="startrow"><button class="start" id="startBtn" disabled>ابدأ المسابقة</button></div>
    <div class="hint" id="hint">اختر الدرس والحصة لتبدأ.</div>
  </div>
</section>

<!-- QUESTION -->
<section class="screen" id="sQ">
  <div class="qwrap">
    <div class="qhead">
      <div class="qcount" id="qCount"></div>
      <div class="turn"><span>تجيب الآن:</span><div id="turnChips" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
      <div class="iconbtns"><button class="ib" data-mute aria-pressed="false">الصوت: يعمل</button><button class="ib" data-fs>ملء الشاشة</button></div>
    </div>
    <div class="qgrid">
      <aside class="timer">
        <svg viewBox="0 0 150 150" aria-hidden="true"><circle class="ring-bg" cx="75" cy="75" r="62"/><circle class="ring" id="ring" cx="75" cy="75" r="62"/><text class="sec" id="tSec" x="75" y="84" text-anchor="middle">30</text><text class="lbl" id="tLbl" x="75" y="108" text-anchor="middle">ثانية</text></svg>
        <div class="pts">النقاط الآن<b id="ptsNow">1000</b></div>
      </aside>
      <div>
        <div class="qcard">
          <div class="qmeta"><span class="pill" id="qType"></span><span class="lvl" id="qLvl"></span><span class="pill" id="qPer" style="background:#f6efe3;color:#8a6a33"></span></div>
          <div id="qBody"></div>
          <div class="feedback" id="fb"><div class="msg" id="fbMsg"></div><button class="next" id="toResults">عرض الترتيب</button></div>
        </div>
        <div class="qfoot"><button class="skip" id="skipBtn">إظهار الإجابة دون نقاط</button></div>
      </div>
    </div>
  </div>
</section>

<!-- RESULTS -->
<section class="screen" id="sR">
  <div class="rwrap">
    <h2 id="rTitle"></h2>
    <p class="sub" id="rSub"></p>
    <div class="chart" id="chart"></div>
    <div class="rfoot"><button class="next" id="nextQ">السؤال التالي</button></div>
  </div>
</section>

<!-- FINAL -->
<section class="screen" id="sF">
  <div class="rwrap">
    <h2>منصة التتويج</h2>
    <p class="sub" id="fSub"></p>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const COLORS = ['var(--g0)','var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)'];
const HEX = ['#5db7ae','#ef9a80','#9d8bd6','#e0b64c','#6eaedc','#93be76'];
const DEF_NAMES = ['الجبل الأخضر','صحار','مسندم','ظفار','الدقم','نزوى'];
const TYPE = {mc:'اختيار من متعدد', tf:'صواب أم خطأ', fill:'أكمل الفراغ', ord:'رتّب'};
const LVL = ['سهل','متوسط','متقدم'];
const S = {lesson:null, period:null, gCount:4, names:DEF_NAMES.slice(), nq:10, qs:[], i:0, scores:[], turn:0, answered:false, t0:0, raf:0, muted:false, overtimeRung:false, lastGain:0, lastWinner:-1};
const $ = id => document.getElementById(id);
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }

/* ---------- sound ---------- */
let AC = null;
function ac(){ if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, at, dur, type, vol){
  if (S.muted) return; const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.value = f;
  const t = c.currentTime + at; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SFX = {
  start(){ tone(440,0,.25,'sine',.08); tone(587.3,.14,.35,'sine',.08); },
  pick(){ tone(660,0,.12,'sine',.05); },
  correct(){ tone(523.3,0,.3,'sine',.1); tone(659.3,.1,.3,'sine',.1); tone(784,.2,.5,'sine',.1); },
  wrong(){ tone(329.6,0,.32,'triangle',.07); tone(261.6,.18,.45,'triangle',.06); },
  over(){ tone(698.5,0,.35,'sine',.05); },
  results(){ [392,493.9,587.3].forEach((f,i) => tone(f, i*.09, .6, 'sine', .06)); },
  final(){ [523.3,659.3,784,1046.5,784,1046.5].forEach((f,i) => tone(f, i*.15, .5, 'sine', .08)); }
};
function setMute(m){ S.muted = m; document.querySelectorAll('[data-mute]').forEach(b => { b.setAttribute('aria-pressed', m); b.textContent = m ? 'الصوت: مكتوم' : 'الصوت: يعمل'; }); }
document.querySelectorAll('[data-mute]').forEach(b => b.onclick = () => setMute(!S.muted));
document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
  if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function(){}).call(document.documentElement); }
  else if (document.exitFullscreen) document.exitFullscreen();
});

/* ---------- setup ---------- */
function renderLessons(){
  const box = $('lessonList'); box.innerHTML = ''; let last = '';
  let grid = null;
  D.lessons.forEach((L, i) => {
    if (L.unit !== last) { box.appendChild(el('div', 'unit', L.unit)); grid = el('div', 'lessons'); box.appendChild(grid); last = L.unit; }
    const b = el('button', 'opt', L.title); b.setAttribute('aria-pressed', S.lesson === i);
    b.onclick = () => { S.lesson = i; S.period = null; renderLessons(); renderPeriods(); validate(); SFX.pick(); };
    grid.appendChild(b);
  });
}
function renderPeriods(){
  const box = $('periodList'); box.innerHTML = '';
  if (S.lesson == null) { box.appendChild(el('div', 'empty', 'اختر الدرس أولًا لتظهر حصصه.')); return; }
  D.lessons[S.lesson].periods.forEach(P => {
    const b = el('button', 'opt'); b.setAttribute('aria-pressed', S.period === P.n);
    b.appendChild(document.createTextNode('الحصة ' + P.n)); b.appendChild(el('small', null, P.axis));
    b.onclick = () => { S.period = P.n; renderPeriods(); validate(); SFX.pick(); };
    box.appendChild(b);
  });
}
function renderNames(){
  $('gCount').textContent = S.gCount;
  const box = $('names'); box.innerHTML = '';
  for (let g = 0; g < S.gCount; g++) {
    const lab = el('label'); const d = el('span', 'dot'); d.style.background = HEX[g];
    const inp = el('input'); inp.value = S.names[g]; inp.maxLength = 22; inp.setAttribute('aria-label', 'اسم المجموعة ' + (g + 1));
    inp.oninput = () => { S.names[g] = inp.value; };
    lab.append(d, inp); box.appendChild(lab);
  }
}
$('gMinus').onclick = () => { if (S.gCount > 2) { S.gCount--; renderNames(); } };
$('gPlus').onclick = () => { if (S.gCount < 6) { S.gCount++; renderNames(); } };
function renderQuick(){
  const box = $('quick'); box.innerHTML = '';
  [5, 10, 15, 20].forEach(n => { const b = el('button', null, n + ' أسئلة'); if (n > 10) b.textContent = n + ' سؤالًا'; b.setAttribute('aria-pressed', S.nq === n); b.onclick = () => setNq(n); box.appendChild(b); });
}
function setNq(n){ S.nq = n; $('nq').value = n; $('nqv').textContent = n; renderQuick(); }
$('nq').oninput = e => setNq(+e.target.value);
function validate(){
  const ok = S.lesson != null && S.period != null;
  $('startBtn').disabled = !ok;
  $('hint').textContent = ok ? 'الأسئلة تبدأ بحصة «' + D.lessons[S.lesson].periods.find(p => p.n === S.period).axis + '» ثم تُكمَل من حصص الدرس الأخرى عند الحاجة، مرتبة من الأسهل إلى الأصعب.' : 'اختر الدرس والحصة لتبدأ.';
}
$('startBtn').onclick = () => startGame();

/* ---------- question selection ---------- */
function pickQuestions(){
  const L = D.lessons[S.lesson], p = S.period;
  const others = L.periods.map(x => x.n).filter(k => k !== p).sort((a, b) => {
    const ka = a > p ? 1 : 0, kb = b > p ? 1 : 0; if (ka !== kb) return ka - kb; return Math.abs(a - p) - Math.abs(b - p); });
  const pool = [];
  [p].concat(others).forEach(k => { pool.push(...shuffle(L.questions.filter(q => q.p === k)).sort((a, b) => a.lv - b.lv)); });
  return pool.slice(0, S.nq).map((q, i) => Object.assign({}, q, {_o: i})).sort((a, b) => a.lv - b.lv || a._o - b._o);
}
function startGame(){
  for (let g = 0; g < S.gCount; g++) if (!S.names[g] || !S.names[g].trim()) S.names[g] = 'المجموعة ' + (g + 1);
  S.qs = pickQuestions(); S.i = 0; S.scores = new Array(S.gCount).fill(0); ac(); SFX.start(); loadQ();
}

/* ---------- points & timer ---------- */
const RING = 2 * Math.PI * 62;
$('ring').style.strokeDasharray = RING;
function pointsAt(t){
  let p;
  if (t <= 30) p = 1000 - 500 * (t / 30);
  else if (t <= 60) p = 500 - 400 * ((t - 30) / 30);
  else p = 100;
  return Math.max(100, Math.round(p / 10) * 10);
}
function tick(){
  const t = (performance.now() - S.t0) / 1000;
  const ring = $('ring');
  if (t <= 30) {
    ring.classList.remove('over'); ring.style.strokeDashoffset = RING * (t / 30);
    $('tSec').textContent = Math.ceil(30 - t); $('tLbl').textContent = 'ثانية';
  } else {
    if (!S.overtimeRung) { S.overtimeRung = true; SFX.over(); }
    ring.classList.add('over'); ring.style.strokeDashoffset = RING * Math.max(0, 1 - Math.min(1, (t - 30) / 30));
    $('tSec').textContent = Math.floor(t - 30); $('tLbl').textContent = 'ثانية إضافية';
  }
  $('ptsNow').textContent = pointsAt(t);
  if (!S.answered) S.raf = requestAnimationFrame(tick);
}

/* ---------- question rendering ---------- */
function renderTurn(){
  const box = $('turnChips'); box.innerHTML = '';
  for (let g = 0; g < S.gCount; g++) {
    const b = el('button', 'gchip' + (g === S.turn ? ' cur' : ''));
    const d = el('span', 'dot'); d.style.background = HEX[g]; b.append(d, document.createTextNode(S.names[g]));
    b.style.borderColor = g === S.turn ? HEX[g] : 'transparent';
    b.title = 'اجعل هذه المجموعة تجيب عن السؤال';
    b.disabled = S.answered;
    b.onclick = () => { if (!S.answered) { S.turn = g; renderTurn(); } };
    box.appendChild(b);
  }
}
function loadQ(){
  const q = S.qs[S.i]; S.answered = false; S.overtimeRung = false; S.turn = S.i % S.gCount;
  $('qCount').textContent = 'السؤال ' + (S.i + 1) + ' من ' + S.qs.length;
  $('qType').textContent = TYPE[q.type];
  const lv = $('qLvl'); lv.innerHTML = ''; for (let k = 1; k <= 3; k++) lv.appendChild(el('i', k <= q.lv ? 'f' : null)); lv.appendChild(document.createTextNode(' ' + LVL[q.lv - 1]));
  $('qPer').textContent = 'الحصة ' + q.p;
  $('fb').className = 'feedback'; $('skipBtn').disabled = false;
  const body = $('qBody'); body.innerHTML = '';
  if (q.type === 'mc') {
    body.appendChild(el('div', 'qtext', q.q));
    const grid = el('div', 'answers');
    shuffle(q.opts.map((t, i) => ({t, i}))).forEach((o, k) => {
      const b = el('button', 'ans'); const key = el('span', 'k', ['أ','ب','ج','د'][k]); key.style.background = HEX[k];
      b.append(key, document.createTextNode(o.t)); b.dataset.ok = o.i === q.ans ? '1' : '0';
      b.onclick = () => answer(o.i === q.ans, b, grid); grid.appendChild(b);
    });
    body.appendChild(grid);
  } else if (q.type === 'tf') {
    body.appendChild(el('div', 'qtext', q.q));
    const grid = el('div', 'answers tf');
    [['صواب', true], ['خطأ', false]].forEach(([t, v]) => {
      const b = el('button', 'ans', t); b.dataset.ok = v === q.ans ? '1' : '0';
      b.onclick = () => answer(v === q.ans, b, grid); grid.appendChild(b);
    });
    body.appendChild(grid);
  } else if (q.type === 'fill') {
    const parts = q.q.split('___'); const s = el('div', 'sentence');
    s.appendChild(document.createTextNode(parts[0])); const slot = el('span', 'slot', '؟'); s.appendChild(slot); s.appendChild(document.createTextNode(parts[1] || ''));
    body.appendChild(s);
    const chips = el('div', 'chips');
    shuffle(q.opts.map((t, i) => ({t, i}))).forEach(o => {
      const c = el('button', 'chip', o.t); c.dataset.ok = o.i === 0 ? '1' : '0';
      c.onclick = () => { slot.textContent = o.t; slot.classList.add('filled'); c.classList.add('used'); answer(o.i === 0, c, chips, slot); };
      chips.appendChild(c);
    });
    body.appendChild(chips);
  } else if (q.type === 'ord') {
    body.appendChild(el('div', 'qtext', q.q));
    const list = el('div', 'ord'); const seq = [];
    let order = shuffle(q.items.map((t, i) => ({t, i})));
    while (order.every((o, k) => o.i === k)) order = shuffle(order);
    const tools = el('div', 'ordtools'); const info = el('span', null, 'اضغط العناصر بالترتيب الصحيح'); const undo = el('button', 'undo', 'تراجع');
    undo.onclick = () => { const last = seq.pop(); if (last) { last.el.classList.remove('sel'); last.el.querySelector('.o').textContent = ''; } };
    order.forEach(o => {
      const b = el('button', 'tile'); const num = el('span', 'o', ''); b.append(num, document.createTextNode(o.t)); b._i = o.i;
      b.onclick = () => {
        if (S.answered || b.classList.contains('sel')) return;
        seq.push({el: b, i: o.i}); b.classList.add('sel'); num.textContent = seq.length; SFX.pick();
        if (seq.length === q.items.length) {
          const ok = seq.every((s, k) => s.i === k);
          seq.forEach((s, k) => s.el.classList.add(s.i === k ? 'right' : 'wrong'));
          undo.disabled = true; answer(ok, null, list, null, q.items);
        }
      };
      list.appendChild(b);
    });
    tools.append(info, undo); body.append(list, tools);
  }
  renderTurn(); show('sQ');
  S.t0 = performance.now(); cancelAnimationFrame(S.raf); S.raf = requestAnimationFrame(tick);
}
function correctText(q){
  if (q.type === 'mc') return q.opts[q.ans];
  if (q.type === 'tf') return q.ans ? 'صواب' : 'خطأ';
  if (q.type === 'fill') return q.opts[0];
  if (q.type === 'ord') return q.items.join(' ثم ');
  return '';
}
function answer(ok, btn, container, slot, items){
  if (S.answered) return;
  S.answered = true; cancelAnimationFrame(S.raf);
  const t = (performance.now() - S.t0) / 1000; const q = S.qs[S.i];
  const pts = ok ? pointsAt(t) : 0;
  S.scores[S.turn] += pts; S.lastGain = pts; S.lastWinner = ok ? S.turn : -1;
  container.querySelectorAll('button').forEach(b => {
    b.disabled = true;
    if (q.type !== 'ord') { if (b.dataset.ok === '1') b.classList.add('right'); else if (b === btn) b.classList.add('wrong'); else b.classList.add('dim'); }
  });
  if (slot) slot.classList.add(ok ? 'right' : 'wrong');
  if (q.type === 'fill') { container.querySelectorAll('.chip').forEach(c => c.classList.remove('used')); if (!ok) { slot.textContent = q.opts[0]; slot.classList.remove('wrong'); slot.classList.add('right'); } }
  if (q.type === 'ord') {
    const tiles = [...container.querySelectorAll('.tile')];
    tiles.sort((a, b) => a._i - b._i).forEach((tl, k) => { tl.querySelector('.o').textContent = k + 1; tl.classList.remove('wrong'); tl.classList.add('right'); container.appendChild(tl); });
  }
  const fb = $('fb'); fb.className = 'feedback on ' + (ok ? 'ok' : 'bad');
  const m = $('fbMsg'); m.innerHTML = '';
  if (ok) { m.appendChild(document.createTextNode('إجابة صحيحة! +' + pts + ' نقطة لمجموعة ' + S.names[S.turn])); SFX.correct(); flyGain('+' + pts); }
  else { m.appendChild(document.createTextNode('إجابة غير صحيحة')); m.appendChild(el('small', null, 'الإجابة الصحيحة: ' + correctText(q))); SFX.wrong(); }
  $('skipBtn').disabled = true; renderTurn();
  $('toResults').textContent = 'عرض الترتيب'; $('toResults').focus();
}
function flyGain(t){ const g = $('gain'); g.textContent = t; g.classList.remove('go'); void g.offsetWidth; g.classList.add('go'); }
$('skipBtn').onclick = () => {
  if (S.answered) return; const q = S.qs[S.i];
  S.answered = true; cancelAnimationFrame(S.raf); S.lastGain = 0; S.lastWinner = -1;
  const body = $('qBody');
  body.querySelectorAll('button').forEach(b => { b.disabled = true; if (b.dataset.ok === '1') b.classList.add('right'); });
  if (q.type === 'fill') { const s = body.querySelector('.slot'); s.textContent = q.opts[0]; s.classList.add('right'); }
  if (q.type === 'ord') { const list = body.querySelector('.ord'); [...list.querySelectorAll('.tile')].sort((a, b) => a._i - b._i).forEach((tl, k) => { tl.querySelector('.o').textContent = k + 1; tl.classList.add('right'); list.appendChild(tl); }); }
  const fb = $('fb'); fb.className = 'feedback on bad'; const m = $('fbMsg'); m.innerHTML = '';
  m.appendChild(document.createTextNode('لم تُحتسب نقاط لهذا السؤال')); m.appendChild(el('small', null, 'الإجابة الصحيحة: ' + correctText(q)));
  $('skipBtn').disabled = true; renderTurn();
};

/* ---------- results ---------- */
function ranks(){
  const order = S.scores.map((s, g) => ({s, g})).sort((a, b) => b.s - a.s);
  const r = new Array(S.gCount); let prev = null, rank = 0;
  order.forEach((o, k) => { if (o.s !== prev) { rank = k + 1; prev = o.s; } r[o.g] = rank; });
  return {r, order};
}
$('toResults').onclick = () => {
  const last = S.i === S.qs.length - 1;
  $('rTitle').textContent = 'الترتيب بعد السؤال ' + (S.i + 1);
  $('rSub').textContent = S.lastWinner >= 0 ? 'فازت مجموعة ' + S.names[S.lastWinner] + ' بنقاط هذا السؤال' : 'لا نقاط في هذا السؤال';
  const {r} = ranks(); const max = Math.max(1, ...S.scores);
  const chart = $('chart'); chart.innerHTML = '';
  const bars = [];
  for (let g = 0; g < S.gCount; g++) {
    const b = el('div', 'bar' + (g === S.lastWinner ? ' win' : ''));
    const val = el('div', 'val', '0'); const col = el('div', 'col'); col.style.background = HEX[g];
    if (g === S.lastWinner) { const p = el('div', 'plus', '+' + S.lastGain); col.appendChild(p); }
    b.append(el('div', 'rank', r[g]), val, col, el('div', 'nm', S.names[g])); chart.appendChild(b); bars.push({col, val, s: S.scores[g]});
  }
  show('sR'); SFX.results();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bars.forEach(o => { o.col.style.height = Math.max(3, (o.s / max) * 82) + '%'; countUp(o.val, o.s); });
  }));
  $('nextQ').textContent = last ? 'منصة التتويج' : 'السؤال التالي';
  $('nextQ').focus();
};
function countUp(node, target){
  const t0 = performance.now(), dur = 1000;
  (function step(now){ const k = Math.min(1, (now - t0) / dur); node.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
}
$('nextQ').onclick = () => { if (S.i < S.qs.length - 1) { S.i++; loadQ(); } else finale(); };

/* ---------- final ---------- */
function finale(){
  const {r, order} = ranks();
  $('fSub').textContent = D.lessons[S.lesson].title + ' - ' + S.qs.length + ' أسئلة';
  const pod = $('podium'); pod.innerHTML = '';
  const top = order.slice(0, 3);
  const layout = top.length === 2 ? [top[0], top[1]] : [top[1], top[0], top[2]];
  const heights = {1: 88, 2: 66, 3: 48};
  const medals = {1: '🥇', 2: '🥈', 3: '🥉'};
  const blocks = [];
  layout.forEach(o => {
    const rank = r[o.g]; const p = el('div', 'pod');
    p.append(el('div', 'medal', medals[rank] || ''), el('div', 'who', S.names[o.g]), el('div', 'sc', o.s + ' نقطة'));
    const blk = el('div', 'blk', rank); blk.style.background = HEX[o.g]; p.appendChild(blk); pod.appendChild(p);
    blocks.push({blk, h: heights[rank] || 40});
  });
  const rest = $('rest'); rest.innerHTML = '';
  order.slice(3).forEach(o => { const d = el('div'); d.append(el('span', null, r[o.g] + '. ' + S.names[o.g]), el('span', null, o.s + ' نقطة')); rest.appendChild(d); });
  show('sF'); SFX.final();
  requestAnimationFrame(() => requestAnimationFrame(() => blocks.forEach(b => b.blk.style.height = b.h + '%')));
  confetti();
}
$('again').onclick = () => startGame();
$('newGame').onclick = () => { show('sSetup'); };

function confetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({length: 90}, () => ({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 1 + Math.random() * 1.6, vx: -.6 + Math.random() * 1.2, a: Math.random() * 6, va: -.05 + Math.random() * .1, col: HEX[Math.floor(Math.random() * 6)]}));
  const t0 = performance.now();
  (function f(now){
    const el2 = now - t0; x.clearRect(0, 0, c.width, c.height);
    const fade = el2 > 4200 ? Math.max(0, 1 - (el2 - 4200) / 1200) : 1;
    P.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin((p.y + p.a * 40) / 60) * .4; p.a += p.va;
      x.save(); x.globalAlpha = .85 * fade; x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (el2 < 5400 && $('sF').classList.contains('on')) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}

renderLessons(); renderNames(); renderQuick(); validate();
</script>
