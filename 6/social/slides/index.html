/* Layout concept: a sunny school "كرّاسة" — a 16:9 paper stage scaled to the screen, framed by a slim
   top bar (phase tracker) and a bottom control bar; home is a bright lesson shelf grouped by axis. */
:root{
  --bg:#EAF5FC;        /* sky wash */
  --paper:#FFFDF6;     /* copybook paper */
  --ink:#24264A;       /* navy ink */
  --ink-soft:#5B5E86;
  --line:#E6E0CF;      /* ruled line */
  --margin:#F2A0A0;    /* copybook margin */
  --sun:#FF9A1F;       /* التهيئة */
  --sky:#2C8BE0;       /* عرض الدرس */
  --leaf:#23A866;      /* الختام */
  --berry:#E5487A;
  --grape:#7B5CE0;
  --ok:#1FA463; --bad:#E0464E;
  --card:#FFFFFF;
  --shadow:0 10px 30px -12px rgba(36,38,74,.28);
  --f-display:"Baloo Bhaijaan 2","Tajawal","Segoe UI",system-ui,sans-serif;
  --f-text:"Noto Naskh Arabic","Amiri","Traditional Arabic","Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-display);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:var(--f-display);cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
mark.hl{background:linear-gradient(transparent 55%,#FFE27A 55%);color:inherit;padding:0 .08em;border-radius:3px}
.hidden{display:none!important}

/* ============ HOME ============ */
#home{min-height:100%;padding-inline:16px;padding-block:0 40px}
.h-hero{max-width:1180px;margin:0 auto;padding-block:34px 18px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.h-hero h1{font-size:clamp(46px,7vw,92px);line-height:1.35;margin:0;color:var(--ink);font-weight:800;letter-spacing:0}
.h-hero h1 span{color:var(--sun)}
.h-meta{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line)}
.h-lead{font-family:var(--f-text);font-size:18px;line-height:1.9;color:var(--ink-soft);max-width:60ch;margin:0}
.flow{display:grid;gap:10px;counter-reset:f}
.flow-step{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.flow-step b{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;color:#fff;font-size:24px}
.flow-step h3{margin:0;font-size:19px}
.flow-step p{margin:2px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.5}
.unit{max-width:1180px;margin:26px auto 0}
.unit-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:3px dashed var(--line);padding-bottom:8px;margin-bottom:16px}
.unit-h h2{margin:0;font-size:30px}
.unit-h small{font-size:15px;color:var(--ink-soft);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lcard{position:relative;text-align:right;border:0;padding:0;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;min-width:0}
.lcard:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 34px -14px rgba(36,38,74,.4)}
.lc-top{background:var(--c);color:#fff;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;overflow:hidden}
.lc-top::after{content:"";position:absolute;inset:auto -20px -38px auto;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.lc-emo{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.lc-kind{font-size:13px;font-weight:700;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:999px;white-space:nowrap}
.lc-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.lc-title{font-family:var(--f-text);font-size:22px;font-weight:700;line-height:1.5;margin:0}
.lc-info{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);font-weight:600}
.lc-bar{display:flex;height:8px;border-radius:9px;overflow:hidden;gap:2px}
.lc-bar i{display:block}
.lc-resume{font-size:13px;color:var(--leaf);font-weight:700}
.h-foot{max-width:1180px;margin:34px auto 0;font-size:14px;color:var(--ink-soft);line-height:1.9;background:var(--card);border-radius:18px;padding:14px 18px}
kbd{font-family:var(--f-display);background:var(--bg);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 7px;font-size:13px}
@media (max-width:820px){.h-hero{grid-template-columns:1fr}}

/* ============ DECK ============ */
#deck{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);box-shadow:0 2px 0 var(--line);z-index:5;min-width:0}
.tb-btn{border:0;background:var(--bg);border-radius:12px;min-width:42px;height:42px;font-size:20px;display:grid;place-items:center;padding:0 10px;font-weight:700;flex-shrink:0}
.tb-btn:hover{background:#dcecf8}
.tb-btn.on{background:var(--ink);color:#fff}
.tb-title{display:flex;flex-direction:column;min-width:0;flex:1}
.tb-title b{font-family:var(--f-text);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases{display:flex;gap:6px;flex-shrink:0}
.ph{border:0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;background:var(--bg);color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.ph.cur{background:var(--pc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.ph.done{color:var(--pc)}
.progress{height:6px;display:flex;gap:2px;background:var(--card);padding:0 12px 6px}
.progress i{flex:1;border-radius:4px;background:#E7EEF4;cursor:pointer;transition:background .2s}
.progress i.seen{background:var(--pc);opacity:.45}
.progress i.cur{background:var(--pc);opacity:1;transform:scaleY(1.6)}
#viewport{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--paper);border-radius:28px;box-shadow:0 30px 60px -30px rgba(36,38,74,.45);overflow:hidden}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -2px 0 var(--line);z-index:5}
.nav-main{display:flex;align-items:center;gap:10px}
.nav-arrow{border:0;height:50px;min-width:120px;border-radius:16px;font-size:20px;font-weight:800;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #0e0f2a}
.nav-arrow.prev{background:var(--bg);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.nav-arrow:active{transform:translateY(3px);box-shadow:none}
.counter{font-weight:800;font-size:17px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:760px){.phases .ph span{display:none}.nav-arrow{min-width:64px}.nav-arrow em{display:none}.tools .wide-only{display:none}#lessonSel{display:none}.tb-title small{display:none}}

/* drawers */
.drawer{position:absolute;z-index:20;background:var(--card);box-shadow:var(--shadow)}
#notes{left:12px;right:12px;bottom:12px;max-height:38%;overflow:auto;border-radius:20px;padding:14px 18px 16px;border-top:6px solid var(--sun)}
#notes h4{margin:0 0 6px;font-size:16px;color:var(--sun);display:flex;justify-content:space-between}
#notes p{margin:0;font-family:var(--f-text);font-size:19px;line-height:1.9}
#outline{top:0;bottom:0;right:0;width:min(400px,92vw);overflow:auto;padding:14px;border-radius:0 0 0 22px}
#outline h4{margin:4px 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.ol-ph{font-weight:800;color:#fff;background:var(--pc);border-radius:10px;padding:4px 12px;margin:12px 0 6px;font-size:15px}
.ol-it{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:right;padding:6px 8px;border-radius:10px}
.ol-it:hover{background:var(--bg)}
.ol-it.cur{background:#FFF3DD}
.ol-it span{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink-soft);font-size:14px}
.ol-it div{font-family:var(--f-text);font-size:15px;line-height:1.5;min-width:0}
.ol-it small{display:block;font-family:var(--f-display);color:var(--ink-soft);font-size:12px}
#score{top:10px;left:12px;border-radius:18px;padding:10px;display:flex;gap:10px}
.team{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;border-radius:14px;background:var(--bg);min-width:120px}
.team b{font-size:15px}
.team .pts{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.team .row{display:flex;gap:6px}
.team button{border:0;width:34px;height:30px;border-radius:9px;font-size:18px;font-weight:800;background:var(--card)}
#timerPop{top:10px;left:50%;transform:translateX(-50%);border-radius:18px;padding:10px 12px;display:flex;gap:6px;align-items:center}
#timerPop button{border:0;background:var(--bg);border-radius:10px;padding:6px 12px;font-weight:800;font-size:16px}
#timerChip{position:absolute;top:10px;right:12px;z-index:19;background:var(--ink);color:#fff;border-radius:16px;padding:6px 16px;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:var(--shadow);cursor:pointer}
#timerChip.low{background:var(--bad);animation:pulse 1s infinite}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:14px;font-size:16px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ============ SLIDE BASE (logical px, stage is scaled) ============ */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:34px 48px 30px;gap:18px;animation:slideIn .45s cubic-bezier(.2,.8,.2,1)}
.portrait .slide{padding:30px 34px}
@keyframes slideIn{from{opacity:.0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.s-head{display:flex;align-items:center;gap:16px;flex-shrink:0}
.s-head h2{margin:0;font-family:var(--f-text);font-size:48px;line-height:1.35;font-weight:700;text-wrap:balance}
.chip{flex-shrink:0;background:var(--pc);color:#fff;font-weight:800;font-size:22px;padding:6px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.s-body{flex:1;min-height:0;display:flex;gap:30px}
.portrait .s-body{flex-direction:column}
.fit{font-size:34px;min-height:0;overflow:hidden}
.col{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
.grow{flex:1}
.txt{font-family:var(--f-text)}
.btn{border:0;border-radius:16px;padding:10px 22px;font-size:24px;font-weight:800;background:var(--ink);color:#fff;box-shadow:0 5px 0 #0e0f2a;display:inline-flex;gap:10px;align-items:center;justify-content:center;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line),0 0 0 2px var(--line) inset}
.btn.sun{background:var(--sun);box-shadow:0 5px 0 #c86f00}
.btn.leaf{background:var(--leaf);box-shadow:0 5px 0 #157246}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 #1a5f9e}
.btn.berry{background:var(--berry);box-shadow:0 5px 0 #a72857}
.btn.sm{font-size:19px;padding:6px 14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.spk{border:0;background:#EAF4FD;color:var(--sky);width:48px;height:48px;border-radius:50%;font-size:24px;flex-shrink:0;display:inline-grid;place-items:center}
.spk:hover{background:#d4e9fb}
.spk.playing{background:var(--sky);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* visuals */
.pic{margin:0;position:relative;border-radius:22px;background:#fff;padding:10px;box-shadow:var(--shadow);transform:rotate(-1.2deg);display:flex;align-items:center;justify-content:center;min-height:0}
.pic img{display:block;max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}
.pic::before,.pic::after{content:"";position:absolute;width:90px;height:26px;background:rgba(255,214,102,.75);top:-10px}
.pic::before{right:20px;transform:rotate(8deg)}.pic::after{left:20px;transform:rotate(-8deg)}
.emo{font-size:120px;line-height:1.15;text-align:center;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(36,38,74,.08));letter-spacing:6px}
@keyframes bob{50%{transform:translateY(-10px)}}
.vis{flex:0 0 40%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;min-height:0}
.portrait .vis{flex:0 0 auto;max-height:34%}
.vis .pic{max-height:100%}

/* cover */
.t-cover{padding:0}
.cover{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:30px;padding:50px 64px;
  background:radial-gradient(circle at 12% 18%,#FFE7A8 0 70px,transparent 71px),radial-gradient(ellipse at 80% 8%,#fff 0 60px,transparent 61px),radial-gradient(ellipse at 70% 10%,#fff 0 46px,transparent 47px),linear-gradient(#CDEBFF,#F4FBFF 70%,var(--paper))}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(#9AD97C,#6CC25A);border-radius:50% 50% 0 0/40px 40px 0 0}
.portrait .cover{grid-template-columns:1fr;padding:40px}
.cover-text{display:flex;flex-direction:column;gap:16px;z-index:1}
.cv-unit{align-self:flex-start;background:var(--accent);color:#fff;font-weight:800;font-size:24px;padding:6px 20px;border-radius:999px}
.cv-kind{font-size:24px;font-weight:700;color:var(--ink-soft)}
.cover h1{margin:0;font-family:var(--f-text);font-size:82px;line-height:1.35;color:var(--ink);text-wrap:balance}
.cover p{margin:0;font-family:var(--f-text);font-size:30px;color:var(--ink-soft);line-height:1.6}
.cover .emo{font-size:76px;text-align:right}
.cover .pic{max-height:620px;z-index:1;transform:rotate(2deg)}
.cover .pic img{max-height:590px}

/* goals / summary */
.list{display:flex;flex-direction:column;gap:14px;list-style:none;margin:0;padding:0}
.li{display:flex;gap:18px;align-items:center;background:#fff;border-radius:20px;padding:14px 22px;box-shadow:0 3px 0 var(--line);font-family:var(--f-text);font-size:1em;line-height:1.6;transition:opacity .35s,transform .35s}
.li .num{flex-shrink:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:#fff;font-family:var(--f-display);font-weight:800;font-size:26px}
.li.dim{opacity:.28}
.li.now{box-shadow:0 0 0 4px var(--pc),0 8px 20px -8px rgba(0,0,0,.25)}

/* talk / reveal cards */
.qcards{display:flex;flex-direction:column;gap:16px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start}
.portrait .qgrid{grid-template-columns:1fr}
.qc{background:#fff;border-radius:22px;padding:12px 18px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.qc-q{display:flex;gap:14px;align-items:center;font-family:var(--f-text);font-weight:700;font-size:1em;line-height:1.6}
.qc-q .txt{flex:1}
.ans{font-family:var(--f-text);font-size:.9em;line-height:1.75;background:#ECFAF2;border-radius:14px;padding:10px 16px;border-inline-start:6px solid var(--leaf);animation:pop .35s}
.ans-btn{flex-shrink:0;align-self:center;border:0;white-space:nowrap;background:#FFF2D9;color:#A15A00;font-weight:800;font-size:20px;border-radius:12px;padding:6px 14px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* reading page */
.page{flex:1;min-width:0;background:repeating-linear-gradient(var(--paper) 0 calc(var(--lh) - 2px),var(--line) calc(var(--lh) - 2px) var(--lh));background-attachment:local;border-radius:22px;box-shadow:0 0 0 2px var(--line);padding:0 64px 0 30px;position:relative;overflow:auto}
.page::before{content:"";position:absolute;top:0;bottom:0;right:44px;width:3px;background:var(--margin);opacity:.7}
.page .para{font-family:var(--f-text);line-height:var(--lh);margin:0;padding:0 8px;border-radius:12px;cursor:pointer;transition:background .2s}
.page .para:hover{background:rgba(44,139,224,.06)}
.page .para.active{background:#FFF4CF}
.page mark.hl{cursor:pointer;background:linear-gradient(transparent 50%,#FFD95A 50%)}
.page.plain mark.hl{background:none}
.bubble{position:absolute;z-index:30;background:var(--ink);color:#fff;border-radius:18px;padding:12px 18px;font-family:var(--f-text);font-size:28px;line-height:1.6;max-width:520px;box-shadow:var(--shadow);animation:pop .25s}
.bubble b{color:#FFD95A}
.read-side{flex:0 0 33%;display:flex;flex-direction:column;gap:16px;min-height:0}
.read-side .pic{flex:1;min-height:0}

/* vocab flip cards */
.vgrid{display:grid;gap:18px;flex:1;min-height:0}
.vcard{perspective:1200px;cursor:pointer;min-height:0}
.vin{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.vcard.flip .vin{transform:rotateY(180deg)}
.vf,.vb{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;gap:6px}
.vf{background:#fff;box-shadow:0 5px 0 var(--line),0 0 0 2px var(--line) inset}
.vf .e{font-size:76px;line-height:1}
.vf .w{font-family:var(--f-text);font-weight:700;font-size:48px;line-height:1.5}
.vb{background:var(--pc);color:#fff;transform:rotateY(180deg)}
.vb .m{font-family:var(--f-text);font-weight:700;font-size:36px;line-height:1.5}
.vb .x{font-family:var(--f-text);font-size:25px;line-height:1.6;opacity:.95;background:rgba(255,255,255,.18);border-radius:12px;padding:4px 10px}

/* quiz */
.qwrap{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;background:#E4EAF0}
.dots i.cur{background:var(--pc);transform:scale(1.25)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}
.qbox{background:#fff;border-radius:26px;padding:22px 28px;box-shadow:0 5px 0 var(--line);display:flex;gap:20px;align-items:center;min-height:0}
.qtext{font-family:var(--f-text);font-weight:700;font-size:1.15em;line-height:1.6;flex:1}
.qbox .qe{font-size:80px}
.qbox .pic{max-height:260px;max-width:40%}
.qbox .pic img{max-height:230px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start}
.opt{border:0;border-radius:22px;padding:16px 22px;font-family:var(--f-text);font-weight:700;font-size:1em;line-height:1.5;color:#fff;display:flex;gap:16px;align-items:center;text-align:right;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .12s,opacity .2s;min-height:118px}
.opt .sh{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--f-display);font-size:24px}
.opt:hover{transform:translateY(-3px)}
.o0{background:#E5487A}.o1{background:#2C8BE0}.o2{background:#F0A010}.o3{background:#23A866}.o4{background:#7B5CE0}
.opt.wrong{opacity:.35;animation:shake .4s}
.opt.right{box-shadow:0 0 0 6px #fff,0 0 0 12px var(--ok);transform:scale(1.03)}
.opts.done .opt:not(.right){opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.why{font-family:var(--f-text);font-size:.85em;line-height:1.7;background:#ECFAF2;border-radius:16px;padding:10px 18px;border-inline-start:6px solid var(--ok);animation:pop .3s}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px}
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.result .big{font-size:120px;line-height:1}
.result h3{margin:0;font-size:56px}
.result p{margin:0;font-size:30px;color:var(--ink-soft)}

/* tf */
.tfrow{display:flex;gap:16px;align-items:center;background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.tfrow .s{flex:1;font-family:var(--f-text);font-weight:700;line-height:1.6}
.tfrow .why{font-size:.75em;margin-top:6px;padding:6px 12px}
.tfb{border:0;width:110px;height:70px;border-radius:16px;font-size:26px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tfb.t{background:var(--ok)}.tfb.f{background:var(--bad)}
.tfrow.ok{border-color:var(--ok);background:#F0FBF5}.tfrow.no{border-color:var(--bad);background:#FFF3F3}
.tfrow.ans .tfb{opacity:.3;pointer-events:none}.tfrow.ans .tfb.pick{opacity:1}

/* tiles: order / build / sort */
.tile{border:0;background:#fff;border-radius:18px;padding:12px 20px;font-family:var(--f-text);font-weight:700;font-size:1em;line-height:1.5;box-shadow:0 5px 0 var(--line),0 0 0 2px var(--line) inset;text-align:right;transition:transform .15s,opacity .2s;touch-action:none;user-select:none}
.tile:hover{transform:translateY(-3px)}
.tile.sel{box-shadow:0 0 0 4px var(--sky),0 8px 0 var(--line);transform:translateY(-6px)}
.tile.no{animation:shake .4s;box-shadow:0 0 0 4px var(--bad)}
.tile.used{opacity:.0;pointer-events:none}
.tile.dragging{z-index:40;position:relative;box-shadow:0 18px 30px -10px rgba(0,0,0,.35);transition:none}
.pool{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:flex-start}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;gap:14px;align-items:center;min-height:76px;border-radius:18px;border:3px dashed #CBD6E0;padding:6px 14px;font-family:var(--f-text);font-weight:700;line-height:1.5}
.slot .n{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:#E4EAF0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px}
.slot.fill{border-style:solid;border-color:var(--ok);background:#F0FBF5;animation:pop .3s}
.slot.fill .n{background:var(--ok);color:#fff}
.slots.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
.slots.row .slot{min-width:150px;justify-content:center}
.answerline{min-height:110px;border-radius:24px;background:#fff;box-shadow:0 0 0 3px var(--line) inset;display:flex;align-items:center;justify-content:center;font-family:var(--f-text);font-size:1.6em;font-weight:700;padding:8px 24px;letter-spacing:0}
.answerline.done{box-shadow:0 0 0 4px var(--ok) inset;background:#F0FBF5;color:#126b40}
.answerline .phd{color:#B8C3CE}
.buckets{display:grid;gap:18px;flex:1;min-height:0}
.bucket{border-radius:24px;background:var(--bc);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;border:4px solid transparent;transition:border-color .2s,transform .15s;cursor:pointer}
.bucket h4{margin:0;text-align:center;color:#fff;font-family:var(--f-text);font-size:30px;line-height:1.4}
.bucket .in{flex:1;background:rgba(255,255,255,.85);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow:auto}
.bucket .in span{background:#fff;border-radius:12px;padding:4px 12px;font-family:var(--f-text);font-weight:700;font-size:.8em;box-shadow:0 2px 0 var(--line);animation:pop .3s}
.bucket.hot{border-color:var(--ink);transform:scale(1.02)}
.bucket.no{animation:shake .4s;border-color:var(--bad)}

/* match */
.mwrap{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:120px;min-height:0}
.mcol{display:flex;flex-direction:column;gap:14px;justify-content:center}
.mi{border:0;background:#fff;border-radius:18px;padding:12px 18px;font-family:var(--f-text);font-weight:700;font-size:1em;line-height:1.5;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line) inset;text-align:right;display:flex;gap:12px;align-items:center;transition:transform .15s}
.mi.sel{box-shadow:0 0 0 4px var(--sky);transform:scale(1.03)}
.mi.no{animation:shake .4s;box-shadow:0 0 0 4px var(--bad)}
.mi.m{color:#fff;box-shadow:none}
.mi .b{flex-shrink:0;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-family:var(--f-display)}
.msvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.c0{background:#E5487A!important}.c1{background:#2C8BE0!important}.c2{background:#F0A010!important}.c3{background:#23A866!important}.c4{background:#7B5CE0!important}.c5{background:#0FA3B1!important}.c6{background:#D9622B!important}.c7{background:#5C6BC0!important}

/* fill */
.sent{font-family:var(--f-text);font-weight:700;font-size:1.35em;line-height:1.9;text-align:center;background:#fff;border-radius:26px;padding:26px;box-shadow:0 5px 0 var(--line)}
.blank{display:inline-block;min-width:200px;border-bottom:5px dashed var(--sky);color:var(--sky);margin:0 8px;padding:0 10px;text-align:center}
.blank.ok{border-bottom:5px solid var(--ok);color:var(--ok);background:#ECFAF2;border-radius:10px 10px 0 0;animation:pop .35s}

/* concept */
.rule{background:#FFF4CF;border-radius:22px;padding:16px 22px;font-family:var(--f-text);font-weight:700;line-height:1.7;border:3px solid #FFD25A;position:relative;animation:pop .35s}
.rule::before{content:"💡 القاعدة";display:block;font-family:var(--f-display);font-size:.7em;color:#A86F00;margin-bottom:4px}
.body-l{font-family:var(--f-text);line-height:1.8;margin:0}
.ex{display:flex;gap:14px;align-items:center;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 4px 0 var(--line);font-family:var(--f-text);font-weight:700;line-height:1.6;animation:pop .35s}
.ex .t{flex:1}
.ex .n{font-family:var(--f-display);font-size:.6em;background:#EAF4FD;color:var(--sky);border-radius:999px;padding:3px 12px;white-space:nowrap}
.ex.ghost{background:repeating-linear-gradient(45deg,#F5F8FB 0 12px,#fff 12px 24px);color:#9AA7B4;justify-content:center;cursor:pointer;box-shadow:0 0 0 2px #E4EAF0 inset;font-family:var(--f-display)}

/* trace */
.tr-wrap{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.tr-tabs{display:flex;gap:10px;flex-wrap:wrap}
.tr-tab{border:0;background:#fff;border-radius:14px;padding:6px 18px;font-family:var(--f-text);font-weight:700;font-size:30px;box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset}
.tr-tab.cur{background:var(--pc);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tr-board{flex:1;position:relative;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 0 0 3px var(--line) inset;min-height:0}
.tr-board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pens{display:flex;gap:8px;align-items:center}
.pen{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.pen.cur{box-shadow:0 0 0 4px var(--ink)}
.tip{background:#EAF4FD;border-radius:16px;padding:8px 16px;font-family:var(--f-text);font-size:24px;line-height:1.6;color:#1b5d99}

/* dictation */
.dgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-content:start}
.dcard{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--line);display:flex;gap:12px;align-items:center;min-height:118px}
.dcard .k{flex-shrink:0;width:46px;height:46px;border-radius:14px;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px}
.dcard .w{flex:1;font-family:var(--f-text);font-weight:700;font-size:34px;line-height:1.5;text-align:center}
.dcard .w.h{color:transparent;background:repeating-linear-gradient(90deg,#E4EAF0 0 18px,transparent 18px 26px);background-size:100% 6px;background-repeat:no-repeat;background-position:center 75%;cursor:pointer;user-select:none}

/* poem */
.verses{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;background:linear-gradient(90deg,transparent 49.7%,#F1E7CC 49.7% 50.3%,transparent 50.3%);border-radius:22px;padding:10px 20px;min-height:0}
.verse{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:6px 14px;border-radius:14px;cursor:pointer;font-family:var(--f-text);font-weight:700;line-height:1.8}
.verse:hover{background:rgba(44,139,224,.06)}
.verse.active{background:#FFF4CF}
.verse span:first-child{text-align:center}.verse span:last-child{text-align:center}
.portrait .verse{grid-template-columns:1fr;gap:0}
.hw{background:#E4EAF0;color:transparent;border-radius:10px;cursor:pointer}
.mem{display:flex;gap:8px;flex-wrap:wrap}
.mem button{border:0;border-radius:12px;padding:6px 14px;font-size:20px;font-weight:800;background:#fff;box-shadow:0 0 0 2px var(--line) inset}
.mem button.cur{background:var(--grape);color:#fff;box-shadow:none}

/* writing */
.task{background:#fff;border-radius:22px;padding:14px 20px;box-shadow:0 4px 0 var(--line);font-family:var(--f-text);font-weight:700;line-height:1.7;border-inline-start:8px solid var(--pc)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;font-family:var(--f-text);line-height:1.6;font-size:.85em;cursor:pointer}
.step i{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:3px solid #CBD6E0;display:grid;place-items:center;font-style:normal;font-size:22px;color:#fff}
.step.ok i{background:var(--ok);border-color:var(--ok)}
.step.ok span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank button{border:0;background:#F3EEFF;color:#4a2fb0;border-radius:12px;padding:4px 12px;font-family:var(--f-text);font-weight:700;font-size:.75em;line-height:1.5}
.model{background:repeating-linear-gradient(#fff 0 58px,#E6E0CF 58px 60px);border-radius:20px;padding:6px 24px;font-family:var(--f-text);line-height:60px;font-size:.85em;box-shadow:0 0 0 2px var(--line);white-space:pre-line;animation:pop .35s;overflow:auto}

/* exit / homework */
.faces{display:flex;gap:18px;justify-content:center}
.face{border:0;background:#fff;border-radius:22px;padding:10px 18px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:200px}
.face .e{font-size:64px;line-height:1.1}
.face small{font-size:20px;font-weight:700}
.face b{font-size:30px;font-variant-numeric:tabular-nums}
.note-pad{background:repeating-linear-gradient(#FFFEF8 0 64px,#E3DCC8 64px 66px);border-radius:22px;padding:12px 30px 12px 70px;position:relative;box-shadow:var(--shadow);flex:1}
.note-pad::before{content:"";position:absolute;top:0;bottom:0;left:46px;width:3px;background:var(--margin)}
.hw-it{display:flex;gap:14px;align-items:center;font-family:var(--f-text);font-weight:700;line-height:66px;cursor:pointer}
.hw-it i{flex-shrink:0;width:40px;height:40px;border-radius:10px;border:3px solid var(--pc);display:grid;place-items:center;font-style:normal;color:#fff;line-height:1}
.hw-it.ok i{background:var(--pc)}

/* ============ GAMES ============ */
.t-game{padding:24px 34px 24px}
.g-head{display:flex;align-items:center;gap:14px;flex-shrink:0}
.g-head h2{margin:0;font-family:var(--f-text);font-size:40px;line-height:1.35;flex:1}
.g-kind{background:var(--grape);color:#fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:22px}
.g-area{flex:1;position:relative;min-height:0;display:flex;gap:26px}
.portrait .g-area{flex-direction:column}
.g-panel{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center;min-width:0;min-height:0}
.g-panel .opts{grid-template-columns:1fr}
.g-panel .opt{min-height:78px}
/* mystery */
.mys{flex:0 0 46%;position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#FFF0C2,#D7F0FF);display:grid;place-items:center;box-shadow:var(--shadow)}
.portrait .mys{flex:0 0 42%}
.mys img{max-width:94%;max-height:94%;border-radius:16px}
.mys .emo{font-size:230px;animation:none}
.tiles{position:absolute;inset:0;display:grid;gap:6px;padding:6px}
.mt{border-radius:14px;display:grid;place-items:center;color:#fff;font-size:56px;font-weight:800;transition:transform .6s,opacity .6s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.mt.gone{transform:rotateY(90deg) scale(.6);opacity:0}
.banner{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:20px;padding:10px 30px;font-family:var(--f-text);font-size:44px;font-weight:700;white-space:nowrap;animation:pop .4s;z-index:3}
/* riddle */
.rid{flex:1;display:grid;grid-template-columns:340px 1fr;gap:30px;align-items:center}
.portrait .rid{grid-template-columns:1fr}
.rid-q{width:300px;height:300px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,#FF9A1F);display:grid;place-items:center;font-size:170px;color:#fff;font-weight:800;box-shadow:0 14px 0 #c86f00;transition:transform .5s}
.rid-q.open{transform:rotateY(360deg);background:radial-gradient(circle at 35% 30%,#fff,#D7F0FF);box-shadow:0 14px 0 #9cc9ea}
.clue{display:flex;gap:14px;align-items:center;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 4px 0 var(--line);font-family:var(--f-text);font-weight:700;font-size:34px;line-height:1.6;animation:pop .35s}
.clue i{font-style:normal;flex-shrink:0;width:46px;height:46px;border-radius:50%;background:var(--sun);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:24px}
/* balloons */
.sky{flex:1;position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(#8FD3FF,#E6F6FF);min-height:0}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,#fff 0 50px,transparent 51px),radial-gradient(ellipse at 26% 33%,#fff 0 40px,transparent 41px),radial-gradient(ellipse at 75% 18%,#fff 0 55px,transparent 56px),radial-gradient(ellipse at 81% 22%,#fff 0 38px,transparent 39px);opacity:.9}
.bq{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:12px 26px;font-family:var(--f-text);font-weight:700;font-size:38px;line-height:1.5;box-shadow:var(--shadow);z-index:5;text-align:center;max-width:90%}
.balloon{position:absolute;bottom:-260px;width:230px;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:rise linear infinite;z-index:2}
.balloon .bb{width:220px;height:250px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--f-text);font-weight:700;font-size:32px;line-height:1.35;padding:20px;box-shadow:inset -18px -14px 0 rgba(0,0,0,.12),inset 14px 14px 0 rgba(255,255,255,.25);animation:sway 3s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.balloon .str{width:2px;height:70px;background:#7a8a99}
.balloon.pop{animation:none!important;transform:scale(1.4);opacity:0;transition:transform .25s,opacity .25s}
.balloon.dead{opacity:.25;pointer-events:none}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-1150px)}}
@keyframes sway{50%{transform:rotate(5deg) translateX(10px)}}
.hud{display:flex;gap:12px;align-items:center}
.hud .pill{font-size:24px;padding:6px 18px}
/* memory */
.mgrid{flex:1;display:grid;gap:14px;min-height:0}
.mc{perspective:1000px;cursor:pointer;min-height:0}
.mc .vin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mc.open .vin{transform:rotateY(180deg)}
.mc .vf{background:linear-gradient(135deg,var(--grape),#A88BFF);color:#fff;font-size:54px;font-weight:800;box-shadow:0 5px 0 #4b2fb0}
.mc .vb{background:#fff;color:var(--ink);font-family:var(--f-text);font-weight:700;font-size:28px;line-height:1.4;box-shadow:0 5px 0 var(--line),0 0 0 3px var(--line) inset}
.mc.done .vb{background:#ECFAF2;box-shadow:0 0 0 4px var(--ok) inset}
.turn{display:flex;gap:10px}
.turn div{padding:6px 18px;border-radius:14px;font-weight:800;font-size:24px;background:#fff;box-shadow:0 0 0 2px var(--line) inset;font-variant-numeric:tabular-nums}
.turn div.cur{color:#fff;box-shadow:none}
.turn .A.cur{background:var(--sun)}.turn .B.cur{background:var(--sky)}
/* wheel */
.wheel-box{flex:0 0 46%;display:grid;place-items:center;position:relative}
.wheel-box svg{width:100%;height:100%;max-height:100%}
.wheel{transition:transform 4.2s cubic-bezier(.12,.75,.1,1);transform-origin:50% 50%}
.qcard{background:#fff;border-radius:26px;padding:22px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;animation:pop .35s}
.qcard .qn{font-weight:800;color:var(--grape);font-size:24px}
.qcard .qq{font-family:var(--f-text);font-weight:700;font-size:40px;line-height:1.6}
/* race */
.track{display:flex;flex-direction:column;gap:14px;background:#5C6770;border-radius:26px;padding:18px 20px;position:relative}
.lane{position:relative;height:110px;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.0) 60px 120px);border-bottom:4px dashed rgba(255,255,255,.5)}
.lane:last-child{border-bottom:0}
.car{position:absolute;top:50%;font-size:84px;line-height:1;transition:right .9s cubic-bezier(.3,1.4,.5,1);transform:translate(50%,-50%)}
.car .tag{position:absolute;top:-22px;right:50%;transform:translateX(50%);font-size:18px;font-weight:800;color:#fff;padding:0 10px;border-radius:8px;white-space:nowrap}
.flag{position:absolute;top:0;bottom:0;left:30px;width:26px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/26px 26px;border-radius:4px}
.marks{position:absolute;inset:0 0 0 0;display:flex;justify-content:space-between;padding:0 50px 0 80px;pointer-events:none}
.marks i{width:2px;background:rgba(255,255,255,.25)}
.tturn{font-weight:800;font-size:28px;color:#fff;border-radius:14px;padding:6px 18px;align-self:flex-start}
/* boxes */
.bgrid{flex:1;display:grid;gap:18px;min-height:0}
.box{border:0;border-radius:22px;background:linear-gradient(#FFB648,#FF8A1F);box-shadow:0 8px 0 #c86f00;position:relative;color:#fff;font-size:52px;font-weight:800;display:grid;place-items:center;overflow:hidden;transition:transform .15s}
.box::before{content:"";position:absolute;inset:0 calc(50% - 14px);background:#E5487A}
.box::after{content:"";position:absolute;inset:calc(38% - 12px) 0 auto;height:24px;background:#E5487A}
.box span{position:relative;z-index:1;background:rgba(255,255,255,.95);color:var(--ink);width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:40px}
.box:hover{transform:translateY(-4px) rotate(-2deg)}
.box.open{background:#E9EEF3;box-shadow:0 4px 0 #cfd8e1;pointer-events:none}
.box.open::before,.box.open::after{display:none}
.modal{position:absolute;inset:0;background:rgba(36,38,74,.45);display:grid;place-items:center;z-index:30;animation:fadeIn .2s}
.modal .qcard{width:min(1100px,90%)}
@keyframes fadeIn{from{opacity:0}}
.gain{position:absolute;font-size:80px;font-weight:800;color:var(--sun);animation:gain 1.2s forwards;z-index:40;pointer-events:none;text-shadow:0 4px 0 #fff}
@keyframes gain{to{transform:translateY(-140px);opacity:0}}
/* catch */
.field{flex:1;position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(#FFF6DE,#FFE9B8);min-height:0}
.fw{position:absolute;top:0;padding:10px 22px;border-radius:18px;background:#fff;font-family:var(--f-text);font-weight:700;font-size:36px;box-shadow:0 6px 0 var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.fw.ok{background:var(--ok);color:#fff;transform:scale(1.3);opacity:0;transition:all .35s}
.fw.no{background:var(--bad);color:#fff;transform:scale(.6);opacity:0;transition:all .35s}
.intro-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:30px;z-index:4}
.intro-card p{font-family:var(--f-text);font-weight:700;font-size:40px;line-height:1.6;margin:0;max-width:1000px}
.endcard{position:absolute;inset:0;background:rgba(255,253,246,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;text-align:center;padding:20px;animation:fadeIn .3s}
.endcard h3{margin:0;font-size:60px}
.endcard .words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1200px}
.endcard .words span{background:#ECFAF2;border-radius:12px;padding:4px 14px;font-family:var(--f-text);font-weight:700;font-size:30px}

/* end of lesson */
#endLesson{position:absolute;inset:0;z-index:25;display:grid;place-items:center;background:rgba(234,245,252,.92)}
#endLesson .card{background:var(--card);border-radius:30px;padding:30px 40px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:center;max-width:90%}
#endLesson h3{margin:0;font-size:40px}
#endLesson .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="home"></main>
<section id="deck" class="hidden" aria-label="عرض الدرس">
  <div class="topbar">
    <button class="tb-btn" id="homeBtn" title="قائمة الدروس" aria-label="قائمة الدروس">🏠</button>
    <div class="tb-title"><b id="tbTitle"></b><small id="tbSub"></small></div>
    <select id="lessonSel" class="tb-btn wide-only" aria-label="اختر الدرس" style="font-size:15px;max-width:210px;font-family:var(--f-text)"></select>
    <div class="phases" id="phases"></div>
  </div>
  <div class="progress" id="progress"></div>
  <div id="viewport">
    <div id="stage"></div>
    <aside id="notes" class="drawer hidden"></aside>
    <aside id="outline" class="drawer hidden"></aside>
    <aside id="score" class="drawer hidden"></aside>
    <div id="timerPop" class="drawer hidden"><b style="font-size:16px">⏱ مؤقّت:</b>
      <button data-m="0.5">٣٠ ث</button><button data-m="1">١ د</button><button data-m="2">٢ د</button><button data-m="3">٣ د</button><button data-m="5">٥ د</button><button id="timerStop">إيقاف</button></div>
    <div id="timerChip" class="hidden" title="اضغط للإيقاف"></div>
    <div id="endLesson" class="hidden"></div>
  </div>
  <button class="tb-btn" id="fsBtn" title="ملء الشاشة (F)">⛶</button>
  <div class="navbar">
    <div class="tools">
      <button class="tb-btn" id="notesBtn" title="ملاحظات المعلم (N)">📝</button>
      <button class="tb-btn" id="olBtn" title="فهرس الشرائح (O)">☰</button>
      <button class="tb-btn" id="scoreBtn" title="لوحة النقاط (S)">🏆</button>
      <button class="tb-btn wide-only" id="timerBtn" title="مؤقت">⏱</button>
      <button class="tb-btn wide-only" id="soundBtn" title="المؤثرات الصوتية">🔔</button>
    </div>
    <div class="nav-main">
      <button class="nav-arrow prev" id="prevBtn" aria-label="السابق">→ <em>السابق</em></button>
      <span class="counter" id="counter"></span>
      <button class="nav-arrow" id="nextBtn" aria-label="التالي"><em>التالي</em> ←</button>
    </div>
  </div>
</section>
<div id="toast" role="status"></div>
<canvas id="fx"></canvas>
<style>
#stage.ltr, #stage.ltr .slide{font-family:"Andika","Baloo Bhaijaan 2",system-ui,sans-serif}
#stage.ltr .s-head h2, #stage.ltr .cover h1{font-family:"Baloo Bhaijaan 2",system-ui,sans-serif}
/* minimal chrome per teacher: only Next/Previous + lesson picker */
#phases,.tools,.progress,#notesBtn,#olBtn,#scoreBtn,#timerBtn,#soundBtn{display:none!important}
.topbar{padding:6px 12px}.topbar .tb-title{flex:1;min-width:0}
#lessonSel{display:inline-block!important;max-width:46vw!important;font-size:16px!important}
.navbar{justify-content:center}.nav-main{gap:18px}
#fsBtn{position:fixed;left:10px;bottom:10px;z-index:9;display:inline-flex!important}
</style>
<script>const IMGS={};
const META={"title_html": "الدِّرَاسَاتُ <span>الاجتماعية</span>", "grade": "الصف السادس", "semester": "الفصل الدراسي الأول", "lead": "عروض تفاعلية لكل دروس الفصل الدراسي الأول: لعبة تهيئة، شرح بصور الكتاب، أسئلة تفاعلية بعد كل جزء، ولعبة ختامية.", "subject": "الدراسات الاجتماعية"};

function mcqEngine(qs, mount, opts = {}) {

  const dots = qDots(qs.length);
  const area = h("div", { class: "qwrap fit", style: { fontSize: opts.fs || "40px" } });

  const draw = () => {

    const q = qs[i];
    const qbox = h("div", { class: "qbox" }, spk(() => plain(q.q) + "، " + q.o.map(plain).join("، ")), T("qtext", q.q), q.img ? pic(q.img) : q.emo ? h("div", { class: "qe" }, q.emo) : null);
    const opsEl = h("div", { class: "opts", style: q.o.length === 3 && !App.portrait ? { gridTemplateColumns: "1fr 1fr 1fr" } : null });
    const foot = h("div", { class: "qfoot" });

      const b = h("button", { class: "opt o" + (k % 5) }, h("span", { class: "sh" }, SHAPES[k % 5]), h("span", { html: fmt(o) }));
      b.onclick = () => {

          if (tries === 1) score++; setDot(dots, i, tries === 1 ? "ok" : "bad");
          if (q.why) foot.before(T("why", "✔ " + q.why));
          foot.append(h("span"), i < qs.length - 1 ? h("button", { class: "btn leaf", onclick: nextQ }, "السؤال التالي ←") : h("button", { class: "btn leaf", onclick: finish }, "النتيجة 🏆"));
          refit(area);
        } else { b.classList.add("wrong"); SFX.bad(); }
      };
      opsEl.append(b);
    });
    area.append(qbox, opsEl, foot);
    requestAnimationFrame(() => autofit(area));
  };
  const nextQ = () => { i++; draw(); };

  App.stepper = () => { if (answered) { if (i < qs.length - 1) { nextQ(); return true; } if (area.querySelector(".result")) return false; finish(); return true; } return false; };
  draw();
}

  const field = h("div", { class: "field" });
  const scoreP = h("span", { class: "pill" }, "⭐ ٠");
  const words = shuffle([...(s.good || []).map(t => ({ t, g: 1 })), ...(s.bad || []).map(t => ({ t, g: 0 }))]);
  let score = 0, running = false, raf = 0, spawnT = 0, idx = 0, live = [], caught = [];
  const Wd = App.portrait ? 820 : 1500, Hd = App.portrait ? 1150 : 680;
  const intro = () => {
    field.innerHTML = "";
    field.append(h("div", { class: "intro-card" }, h("div", { style: { fontSize: "90px" } }, "🧺"), h("p", { html: fmt(s.prompt || "") }), h("button", { class: "btn sun", onclick: start }, "▶ ابدؤوا اللعب")));
  };
  const start = () => {
    field.innerHTML = ""; score = 0; idx = 0; live = []; caught = []; scoreP.textContent = "⭐ ٠"; running = true;
    field.append(h("div", { class: "bq", style: { fontSize: "28px", top: "10px" }, html: fmt(s.prompt || "") }));
    let last = performance.now(), acc = 1400;
    const loop = now => {
      if (!running) return; const dt = now - last; last = now; acc += dt;
      if (acc > 1500 && idx < words.length) { acc = 0; spawn(words[idx++]); }
      live.forEach(o => { o.y += o.v * dt / 1000; o.el.style.transform = `translateY(${o.y}px)`; if (o.y > Hd && !o.gone) { o.gone = true; o.el.remove(); } });
      live = live.filter(o => !o.gone);
      if (idx >= words.length && !live.length) { end(); return; }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  };
  const spawn = w => {
    const e = h("div", { class: "fw", html: fmt(w.t) });
    e.style.left = (40 + Math.random() * (Wd - 360)) + "px";
    const o = { el: e, y: 60, v: 95 + Math.random() * 40, gone: false };
    e.onpointerdown = ev => {
      ev.preventDefault(); if (o.hit) return; o.hit = true;
      if (w.g) { score++; caught.push(w.t); e.classList.add("ok"); SFX.ok(); } else { score = Math.max(0, score - 1); e.classList.add("no"); SFX.bad(); }
      scoreP.textContent = "⭐ " + AR(score); setTimeout(() => { o.gone = true; e.remove(); }, 350);
    };
    field.append(e); live.push(o);
  };
  const end = () => {
    running = false; cancelAnimationFrame(raf);
    field.append(h("div", { class: "endcard" }, h("h3", null, `النتيجة: ${AR(score)} ⭐`), h("p", { class: "txt", style: { fontSize: "30px", margin: 0 } }, "الكلمات الصحيحة:"),
      h("div", { class: "words" }, ...(s.good || []).map(t => h("span", { html: fmt(t) }))), h("button", { class: "btn soft", onclick: start }, "↺ العبوا مرّة أخرى")));
    if (score >= (s.good || []).length * .6) cheer();
  };
  addCleanup(() => { running = false; cancelAnimationFrame(raf); });
  el.append(gHead(s, scoreP), h("div", { class: "g-area" }, field));
  intro();
};

/* ===================== boot ===================== */
function boot() {
  TTS.init();
  renderHome();
  $("#homeBtn").onclick = closeDeck;
  $("#prevBtn").onclick = prev; $("#nextBtn").onclick = next;
  $("#notesBtn").onclick = toggleNotes;
  $("#olBtn").onclick = () => { const o = $("#outline"); if (o.classList.toggle("hidden")) return; renderOutline(); };
  $("#scoreBtn").onclick = () => { $("#score").classList.toggle("hidden"); $("#scoreBtn").classList.toggle("on", !$("#score").classList.contains("hidden")); };
  $("#timerBtn").onclick = () => $("#timerPop").classList.toggle("hidden");
  $$("#timerPop [data-m]").forEach(b => b.onclick = () => startTimer(+b.dataset.m));
  $("#timerStop").onclick = () => { stopTimer(); $("#timerPop").classList.add("hidden"); };
  $("#timerChip").onclick = stopTimer;
  const sb = $("#soundBtn"); const paintS = () => sb.textContent = SFX.on ? "🔔" : "🔕"; paintS();
  sb.onclick = () => { SFX.on = !SFX.on; store.set("sound", SFX.on); paintS(); if (!SFX.on) TTS.stop(); };
  $("#fsBtn").onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { }); else document.exitFullscreen(); } catch (e) { } };
  $("#lessonSel").onchange = e => openLesson(e.target.value, store.get("pos:" + e.target.value, 0));
  $("#stage").addEventListener("click", e => { if (bubbleEl && !e.target.closest("mark.hl") && !e.target.closest(".bubble")) closeBubble(); });
  addEventListener("resize", () => fitStage(false));
  addEventListener("keydown", e => {
    if (!App.L || e.target.matches("input,select,textarea")) return;
    const k = e.key;
    if (k === "ArrowLeft" || k === "PageDown" || k === " " || k === "Enter") { if (k === "Enter" && e.target.matches("button")) return; e.preventDefault(); next(); }
    else if (k === "ArrowRight" || k === "PageUp") { e.preventDefault(); prev(); }
    else if (k === "Home") go(0); else if (k === "End") go(App.L.slides.length - 1);
    else if (k === "n" || k === "N" || k === "ى") toggleNotes();
    else if (k === "o" || k === "O" || k === "خ") $("#olBtn").click();
    else if (k === "s" || k === "S" || k === "س") $("#scoreBtn").click();
    else if (k === "f" || k === "F" || k === "ب") $("#fsBtn").click();
    else if (k === "Escape") { ["#outline", "#timerPop"].forEach(x => $(x).classList.add("hidden")); closeBubble(); }
  });
  // swipe on touch screens
  let tx = null;
  $("#viewport").addEventListener("touchstart", e => { tx = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY, Date.now()] : null; }, { passive: true });
  $("#viewport").addEventListener("touchend", e => { if (!tx) return; const t = e.changedTouches[0], dx = t.clientX - tx[0], dy = t.clientY - tx[1]; if (Math.abs(dx) > 90 && Math.abs(dy) < 60 && Date.now() - tx[2] < 600 && !e.target.closest(".tr-board,.tile,.field,.sky")) { dx > 0 ? next() : prev(); } tx = null; });
  const hash = (location.hash || "").slice(1);
  if (hash && LESSONS.some(L => L.id === hash)) openLesson(hash, store.get("pos:" + hash, 0));
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

</script>
