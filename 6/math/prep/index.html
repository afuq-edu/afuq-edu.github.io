ملعب ويسأل عن أشكال وقياسات فيه.\nدور الطالب: يناقش الطلبة.\n\nالحصة ٧: مراجعة وتطبيقات: الضرب والقسمة\nدور المعلم: ينفذ المعلم «تحدي الدقيقة» بأسئلة ضرب وقسمة ذهنية.\nدور الطالب: يجيب الطلبة بسرعة.", "الحصة ١: الأعداد المربعة والمكعبة\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم متتالية ١، ٤، ٩، ١٦، ٢٥ ويسأل: ما القاعدة؟.\n  الطالب: يكتشف الطلبة مربعات الأعداد.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحدد الأعداد المربعة حتى ١٤٤ والأعداد المكعبة حتى ١٢٥؛ أستطيع أن أمثل الأعداد المربعة بأنماط نقاط.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم تمثيل المربعات بنقاط ومكعبات، والكتابة بالأس (٤²، ٢³).\n  الطالب: يمثل الطلبة الأعداد ويكتبونها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٧٧، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «جدول المضاعفات» لاكتشاف المربعات على القطر.\n  الطالب: يلوّن الطلبة الأعداد المربعة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الأعداد المربعة والمكعبة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: الأعداد المثلثية والمتتاليات الخاصة\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم نقاطًا مرتبة في مثلثات ويسأل: كم نقطة في المثلث التالي؟.\n  الطالب: يعد الطلبة ويتنبؤون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أتعرف على الأعداد المثلثية ويكمل متتاليتها؛ أستطيع أن أصف قاعدة متتاليات خاصة (المربعات، المثلثية).\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم متتالية الأعداد المثلثية (١، ٣، ٦، ١٠) وقاعدة الزيادة المتزايدة، ويقارن بالمربعات.\n  الطالب: يكمل الطلبة المتتاليات.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٧٧ وكتاب النشاط ١١-٢ ص٥٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقدم المعلم تحدي: مجموع عددين مثلثيين متتاليين؟.\n  الطالب: يكتشف الطلبة أنه عدد مربع.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الأعداد المثلثية والمتتاليات الخاصة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: تحري الأعداد الخاصة\n(٥ د) التهيئة:\n  المعلم: يكتب المعلم العدد ٣٦ ويسأل: ما كل ما تعرفه عنه؟.\n  الطالب: يذكر الطلبة خصائصه (مربع، زوجي، عوامله...).\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أصنف الأعداد وفق خصائصها (أولي، مربع، زوجي، مضاعف)؛ أستطيع أن أستقصي خصائص عدد معطى ويعرضها.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينفذ المعلم نشاط «تحري الأعداد» في مجموعات من أربعة: لكل مجموعة عدد تستقصي خصائصه.\n  الطالب: تستقصي المجموعات وتعد عرضًا.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تصنيف أعداد في مخطط كارول (أولي/غير أولي، مربع/غير مربع)، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يصنف الطلبة الأعداد.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: تعرض المجموعات نتائجها ويعلق الصف.\n  الطالب: يقيم الطلبة العروض.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «تحري الأعداد الخاصة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: مراجعة وتطبيقات: المضاعفات والعوامل والأعداد الأولية\n(٥ د) التهيئة:\n  المعلم: ينفذ المعلم «مراجعة سريعة» بأسئلة شفهية عن العوامل والمضاعفات.\n  الطالب: يجيب الطلبة على السبورات الصغيرة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أطبق مفاهيم المضاعفات والعوامل والأعداد الأولية في حل مسائل؛ أستطيع أن أقيّم مستوى إتقاني ويحدد ما يحتاج إلى تحسين.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقدم المعلم محطات مراجعة: محطة العوامل، محطة الأعداد الأولية، محطة المضاعفات المشتركة.\n  الطالب: تتنقل المجموعات بين المحطات.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٢-٣ب ص١٨–٢١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوزع المعلم ورقة تقييم ذاتي.\n  الطالب: يقيّم الطلبة أنفسهم.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مراجعة وتطبيقات: المضاعفات والعوامل والأعداد الأولية» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٥: مراجعة وتطبيقات: الأعداد العشرية والسالبة\n(٥ د) التهيئة:\n  المعلم: يطرح المعلم لغز: «عدد عشري بين ٢ و ٣، رقم الأجزاء من عشرة ضعف رقم الآحاد».\n  الطالب: يحل الطلبة اللغز.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل في العمليات على الأعداد العشرية؛ أستطيع أن أحل مسائل على الأعداد السالبة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقدم المعلم مسائل مراجعة متدرجة في الأعداد العشرية والسالبة.\n  الطالب: تحل المجموعات المسائل.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ١٣-١ب ص٦٤–٦٧، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «سباق المراجعة» بين الفرق.\n  الطالب: تتنافس الفرق.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مراجعة وتطبيقات: الأعداد العشرية والسالبة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٦: مراجعة وتطبيقات: القياس والهندسة\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم صورة لملعب ويسأل عن أشكال وقياسات فيه.\n  الطالب: يناقش الطلبة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل في الطول والوقت والمساحة والمحيط؛ أستطيع أن أطبق مفاهيم المضلعات والزوايا والتحويلات.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقدم المعلم محطات مراجعة: القياس، الوقت، المساحة، الهندسة.\n  الطالب: تتنقل المجموعات بين المحطات.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى مراجعة كتاب النشاط ٩-١ ص٤٧–٤٩ و ١٠-١ب ص٥٢–٥٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوزع المعلم ورقة تقييم ذاتي للهندسة والقياس.\n  الطالب: يقيم الطلبة أنفسهم.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مراجعة وتطبيقات: القياس والهندسة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٧: مراجعة وتطبيقات: الضرب والقسمة\n(٤ د) التهيئة:\n  المعلم: ينفذ المعلم «تحدي الدقيقة» بأسئلة ضرب وقسمة ذهنية.\n  الطالب: يجيب الطلبة بسرعة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل الضرب والقسمة الكتابية والذهنية؛ أستطيع أن أختار الطريقة المناسبة للحساب ويبرر.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقدم المعلم مسائل حياتية متعددة الخطوات تتطلب اختيار الطريقة.\n  الطالب: تحل المجموعات وتبرر.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ١٥-٣ب ص٧٩–٨٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقود المعلم تأملًا ختاميًا لما تعلمه الطلبة في الفصل.\n  الطالب: يكتب الطلبة أهم ما تعلموه.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «الأعداد الخاصة»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: الأعداد المربعة والمكعبة\n١) [مستوى الدعم] أيّ الأعداد الآتية عدد مربع: ١٧، ١٤، ١٦، ٢٠؟\n   الإجابة النموذجية: ١٦\n٢) [المستوى المتوقع] ما مكعب العدد ٣ (٣³)؟\n   الإجابة النموذجية: ٢٧\n٣) [المستوى المتقدم] أيّ الأعداد الآتية عدد مربع: ١٤٤، ١٤٥، ١٤٨، ١٤٢؟\n   الإجابة النموذجية: ١٤٤\n\nالحصة ٢: الأعداد المثلثية والمتتاليات الخاصة\n١) [مستوى الدعم] ما مربع العدد ٤ (٤²)؟\n   الإجابة النموذجية: ١٦\n٢) [المستوى المتوقع] ما مربع العدد ٨ (٨²)؟\n   الإجابة النموذجية: ٦٤\n٣) [المستوى المتقدم] متتالية حدها الأول ١٠ وقاعدتها «اطرح ٤». ما الحد السادس؟\n   الإجابة النموذجية: −١٠\n\nالحصة ٣: تحري الأعداد الخاصة\n١) [مستوى الدعم] أيّ الأعداد الآتية عدد مربع: ٩٨، ١٠١، ١٠٠، ١٠٤؟\n   الإجابة النموذجية: ١٠٠\n٢) [المستوى المتوقع] كم عددًا أوليًا يقع بين ١٠ و ٣٠؟\n   الإجابة النموذجية: ٦\n٣) [المستوى المتقدم] أيّ الأعداد الآتية من مضاعفات العدد ١٨: ١٣٥، ١٢٧، ١٢٦، ١٢٥؟\n   الإجابة النموذجية: ١٢٦\n\nالحصة ٤: مراجعة وتطبيقات: المضاعفات والعوامل والأعداد الأولية\n١) [مستوى الدعم] أيّ الأعداد الآتية من مضاعفات العدد ٦: ١٣، ١١، ١٥، ١٢؟\n   الإجابة النموذجية: ١٢\n٢) [المستوى المتوقع] كم عددًا أوليًا يقع بين ٨٠ و ١٠٠؟\n   الإجابة النموذجية: ٣\n٣) [المستوى المتقدم] أيّ الأعداد الآتية مضاعف مشترك للعددين ٤ و ١٥: ٢٤٠، ٢٤٤، ٢٨، ٢٢٥؟\n   الإجابة النموذجية: ٢٤٠\n\nالحصة ٥: مراجعة وتطبيقات: الأعداد العشرية والسالبة\n١) [مستوى الدعم] احسب: ٨٣٫٢ − ١٧٫١\n   الإجابة النمو const AR = d => String(d).replace(/[0-9]/g, c => '٠١٢٣٤٥٦٧٨٩'[c]);

function setMode(m){ mode = m; $('mSep').setAttribute('aria-pressed', m === 'sep'); $('mCom').setAttribute('aria-pressed', m === 'com'); render(); }
function render(){

    b.setAttribute('aria-selected', i === pk); b.textContent = 'الحصة ' + AR(i + 1) + ': ' + p.focus;

  $('info').innerHTML = '<div><b>الدرس:</b> ' + L.code + ' ' + L.title + '</div><div><b>الوحدة:</b> ' + L.unit + '</div><div><b>الأسبوع:</b> ' + L.week + ' (' + L.dates + ')</div>'
    + '<div><b>كتاب الطالب:</b> ص' + L.sb + '</div><div><b>دليل المعلم:</b> ص' + L.tb + '</div><div><b>كتاب النشاط:</b> ' + L.ab + '</div>'
    + (mode === 'sep' ? '<div class="focus">محور الحصة: ' + P.focus + ' — الحصة ' + AR(pk + 1) + ' من ' + AR(L.periods.length) + '</div>'
                      : '<div class="focus">محاور الحصص: ' + L.periods.map((p, i) => AR(i + 1) + ') ' + p.focus).join('  ') + '</div>');
  const texts = mode === 'sep' ? P.f : L.comb;
  const box = $('cards'); box.innerHTML = '';

    c.innerHTML = '<div class="top"><h2><span class="num">' + AR(i + 1) + '</span>' + name + '</h2><button type="button" class="copy">نسخ</button></div><pre class="txt"></pre><p class="hint">تعذّر النسخ التلقائي في هذا المتصفح؛ حُدّد النص، فانسخه يدويًا.</p>';
    c.querySelector('.txt').textContent = texts[i];

    box.appendChild(c);
  });
}
function done(btn){ btn.textContent = 'تم النسخ ✓'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'نسخ'; btn.classList.remove('done'); }, 1800); }
function fallback(text, btn, card){
  const t = $('buf'); t.value = text; t.style.display = 'block'; t.focus(); t.select(); t.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
  t.blur();
  if (ok) { done(btn); return; }
  const pre = card.querySelector('.txt'); const r = document.createRange(); r.selectNodeContents(pre);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  card.querySelector('.hint').classList.add('show');
}
function copy(text, btn, card){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => done(btn)).catch(() => fallback(text, btn, card));
  } else fallback(text, btn, card);
}
render();
</script>
</body>
