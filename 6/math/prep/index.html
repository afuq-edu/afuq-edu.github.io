header{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px 12px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 2px;color:var(--blue);font-weight:800}
.sub{color:var(--muted);font-size:.92rem}
.mode{display:flex;gap:0;margin:12px 0 6px;border:1.5px solid #b9d3ec;border-radius:12px;overflow:hidden;width:fit-content;background:#fff}
.mode button{font:inherit;font-weight:700;border:0;background:#fff;color:var(--blue);padding:9px 20px;cursor:pointer;font-size:1rem}
.mode button[aria-pressed="true"]{background:#dcebfa;color:#173e66}
.mode button:focus-visible,.tabs button:focus-visible,.copy:focus-visible,select:focus-visible{outline:3px solid #8fb8e3;outline-offset:2px}
.explain{font-size:.9rem;color:var(--muted);margin:4px 0}
.explain b{color:var(--ink)}
.status{margin-top:8px;background:var(--amber-t);border:1px solid #f0dfb5;color:var(--amber);border-radius:10px;padding:7px 12px;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px}
label.sel{font-weight:700;color:var(--blue)}
select{font:inherit;font-size:1rem;padding:8px 10px;border:1.5px solid #c9dcef;border-radius:10px;background:#fff;color:var(--ink);min-width:min(100%,420px)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{font:inherit;font-weight:700;border:1.5px solid #cfe0d1;background:#fff;color:var(--green);border-radius:20px;padding:5px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--green-t);border-color:#9cc59a}
.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0 12px;font-size:.93rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 16px}
.info b{color:#3d6a96}
.info .focus{grid-column:1/-1;color:var(--amber);font-weight:700}
main{padding:0 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line)}
.card:nth-child(3n+1) .top{background:var(--green-t);color:var(--green)}
.card:nth-child(3n+2) .top{background:var(--blue-t);color:var(--blue)}
.card:nth-child(3n) .top{background:var(--plum-t);color:var(--plum)}
.card h2{font-size:1.02rem;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;background:#fff;font-size:.85rem}
.copy{font:inherit;font-weight:700;border:1.5px solid currentColor;background:#fff;color:inherit;border-radius:9px;padding:4px 16px;cursor:pointer;min-width:112px;transition:background .2s}
.copy.done{background:#e3f4e1;color:#2f6b2c;border-color:#7fbf7b}
.txt{white-space:pre-wrap;margin:0;padding:10px 14px;font-family:inherit;font-size:.95rem;line-height:1.75;user-select:text}
.hint{display:none;margin:0 14px 10px;color:#9a4b14;font-size:.85rem}
.hint.show{display:block}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:10px}
@media (max-width:560px){.mode button{padding:8px 12px;font-size:.92rem}.copy{min-width:96px;padding:4px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA = [{"code": "١-١", "title": "القيمة المكانية", "unit": "١ نظام الأعداد (١)", "week": "الأول", "dates": "٦ – ١٠ سبتمبر ٢٠٢٦", "sb": "١٢–١٣", "tb": "٢٢–٢٣", "ab": "١-١ القيمة المكانية والترتيب والتقريب ص١٠–١٢", "periods": [{"focus": "قراءة الأعداد حتى المليون وكتابتها", "f": ["١. أن يقرأ الطالب الأعداد الكاملة حتى المليون قراءة صحيحة\n٢. أن يكتب الطالب الأعداد المعطاة بالكلمات بالأرقام في جدول القيمة المكانية\nمخرج تعليمي آخر: أن يتواصل الطالب رياضيًا فيشرح طريقته لزملائه مستخدمًا المفردات الصحيحة.", "المخرج ١: فهم\nالمخرج ٢: تطبيق", "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "- الكتاب\n- السبورة الذكية\n- أخرى: بطاقات الأرقام ٠–٩\n- أخرى: جدول القيمة المكانية", "المليون، جدول القيمة المكانية، المنزلة، الرقم، العدد", "دور المعلم: يعرض المعلم بطاقات أرقام ويطلب تكوين أكبر عدد من ٤ أرقام وأصغر عدد ثم قراءتهما.\nدور الطالب: يكوّن الطلبة الأعداد بالبطاقات ويقرأونها بصوت مسموع ويصححون لبعضهم.", "(٥ د) التهيئة:\n  المعلم: يعرض المعلم بطاقات أرقام ويطلب تكوين أكبر عدد من ٤ أرقام وأصغر عدد ثم قراءتهما.\n  الطالب: يكوّن الطلبة الأعداد بالبطاقات ويقرأونها بصوت مسموع ويصححون لبعضهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقرأ الأعداد الكاملة حتى المليون قراءة صحيحة؛ أستطيع أن أكتب الأعداد المعطاة بالكلمات بالأرقام في جدول القيمة المكانية.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يعرض المعلم جدول القيمة المكانية على السبورة الذكية حتى منزلة مئات الآلاف، ويكتب عددًا من ٦ أرقام ويقرؤه، ثم يضيف ١ إلى ٩٩٩ ٩٩٩ ليقدّم مفهوم المليون (١ ٠٠٠ ٠٠٠).\n  الطالب: يتابع الطلبة النمذجة ويقرأون أعدادًا من ٥ و ٦ أرقام يحددها المعلم، ويكتشفون أن المليون يساوي ألف ألف.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى فقرة «لنستكشف» ص١٢ ونشاط بطاقات الأرقام، ثم التمرين ١ بكتابة الأعداد المظللة بالكلمات، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمرين ١ (أ، ب) في كتاب الطالب ص١٢ ويقارنون إجاباتهم مع زملائهم.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفّذ المعلم نشاط «مطابقة الأعداد» بالبطاقات (العدد بالأرقام مع العدد بالكلمات) مع تبسيط البطاقات لمجموعة الدعم.\n  الطالب: يلتقط كل طالب بطاقتين متطابقتين ويقرأ العدد، ويتحقق زميله من صحة القراءة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قراءة الأعداد حتى المليون وكتابتها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة", "١) [مستوى الدعم] ما قيمة الرقم ٩ في العدد ٤٩٧ ٢٨١؟\n   الإجابة النموذجية: ٩٠ ٠٠٠\n٢) [المستوى المتوقع] ما قيمة الرقم ٢ في العدد ١٢٤ ٣٦٩؟\n   الإجابة النموذجية: ٢٠ ٠٠٠\n٣) [المستوى المتقدم] اكتب بالأرقام: ثلاثمائة وثمانية عشر ألفًا وثلاثمائة وتسعة وخمسون\n   الإجابة النموذجية: ٣١٨ ٣٥٩", "١) [مستوى الدعم] في أي منزلة يقع الرقم ٧ في العدد ١٩٧ ٥٨٤؟\n   الإجابة النموذجية: الآلاف\n٢) [المستوى المتوقع] اكتب بالأرقام: خمسمائة وأربعة عشر ألفًا وثلاثمائة وخمسة وسبعون\n   الإجابة النموذجية: ٥١٤ ٣٧٥\n٣) [المستوى المتقدم] ما العدد الذي يزيد بمقدار ١٠ ٠٠٠ على ٥٥٣ ٦٤٩؟\n   الإجابة النموذجية: ٥٦٣ ٦٤٩", "عزيزي الطالب/ولي الأمر: مراجعة «قراءة الأعداد حتى المليون وكتابتها» في كتاب الطالب ص١٢–١٣، والاستعانة بكتاب النشاط (١-١ القيمة المكانية والترتيب والتقريب ص١٠–١٢). المهمة المنزلية: تدرّب على قراءة أعداد من الصحف أو اللوحات الإعلانية وكتابتها في جدول القيمة المكانية."]}, {"focus": "قيمة الرقم بحسب منزلته في الأعداد الكاملة", "f": ["١. أن يحدد الطالب قيمة الرقم في العدد الكامل حتى المليون بحسب منزلته\n٢. أن يقارن الطالب بين قيمتي رقم مكرر في العدد الواحد\nمخرج تعليمي آخر: أن يتعاون الطالب مع أفراد مجموعته في إنجاز المهمة ويحترم آراءهم.", "المخرج ١: فهم\nالمخرج ٢: تحليل", "- التعلم بالاكتشاف\n- التعلم التعاوني\n- التعلم التشاركي", "- الكتاب\n- السبورة الذكية\n- السبورة التقليدية\n- أخرى: جدول القيمة المكانية", "القيمة المكانية، قيمة الرقم، المنزلة، الصيغة الممتدة", "دور المعلم: يكتب المعلم العدد ٤٤٤ ٤٤٤ ويسأل: هل للأرقام الأربع يف نقرأ سعر سلعة ٢٫٧٥ ريال؟ وما قيمة الرقم ٧ فيه؟.\nدور الطالب: يقترح الطلبة طرقًا للقراءة ويبررون إجاباتهم.\n\nالحصة ٤: تطبيقات وتدريبات القيمة المكانية\nدور المعلم: يطرح المعلم لغز: «أنا عدد من ٦ أرقام، رقم مئات الآلاف ٣، ورقم الآحاد ضعفه...».\nدور الطالب: يحاول الطلبة تحديد العدد بالحوار ويعرضون طرقهم.", "الحصة ١: قراءة الأعداد حتى المليون وكتابتها\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم بطاقات أرقام ويطلب تكوين أكبر عدد من ٤ أرقام وأصغر عدد ثم قراءتهما.\n  الطالب: يكوّن الطلبة الأعداد بالبطاقات ويقرأونها بصوت مسموع ويصححون لبعضهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقرأ الأعداد الكاملة حتى المليون قراءة صحيحة؛ أستطيع أن أكتب الأعداد المعطاة بالكلمات بالأرقام في جدول القيمة المكانية.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يعرض المعلم جدول القيمة المكانية على السبورة الذكية حتى منزلة مئات الآلاف، ويكتب عددًا من ٦ أرقام ويقرؤه، ثم يضيف ١ إلى ٩٩٩ ٩٩٩ ليقدّم مفهوم المليون (١ ٠٠٠ ٠٠٠).\n  الطالب: يتابع الطلبة النمذجة ويقرأون أعدادًا من ٥ و ٦ أرقام يحددها المعلم، ويكتشفون أن المليون يساوي ألف ألف.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى فقرة «لنستكشف» ص١٢ ونشاط بطاقات الأرقام، ثم التمرين ١ بكتابة الأعداد المظللة بالكلمات، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمرين ١ (أ، ب) في كتاب الطالب ص١٢ ويقارنون إجاباتهم مع زملائهم.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفّذ المعلم نشاط «مطابقة الأعداد» بالبطاقات (العدد بالأرقام مع العدد بالكلمات) مع تبسيط البطاقات لمجموعة الدعم.\n  الطالب: يلتقط كل طالب بطاقتين متطابقتين ويقرأ العدد، ويتحقق زميله من صحة القراءة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قراءة الأعداد حتى المليون وكتابتها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: قيمة الرقم بحسب منزلته في الأعداد الكاملة\n(٥ د) التهيئة:\n  المعلم: يكتب المعلم العدد ٤٤٤ ٤٤٤ ويسأل: هل للأرقام الأربعة القيمة نفسها؟.\n  الطالب: يناقش الطلبة السؤال في أزواج ويعللون إجاباتهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحدد قيمة الرقم في العدد الكامل حتى المليون بحسب منزلته؛ أستطيع أن أقارن بين قيمتي رقم مكرر في العدد الواحد.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم تحليل العدد ٥٢٤ ٧٦٩ في جدول القيمة المكانية وكتابته بالصيغة الممتدة، ويطرح: كم مرة تساوي قيمة الرقم ٤ الأول قيمة الرقم ٤ الأخير في ٤٠٤ ٠٤٠؟.\n  الطالب: يحلل الطلبة أعدادًا أخرى ويكتشفون أن كل منزلة تساوي ١٠ أمثال المنزلة التي على يمينها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى التمرين ٢ ص١٣ (قيمة الرقم المظلل) ويتابع الأداء فرديًا، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يجيب الطلبة عن أسئلة قيمة الرقم ويكتبون كل عدد بالصيغة الممتدة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوزع المعلم نشاط «ما قيمتي؟»: مجموعة الدعم بأعداد من ٤ أرقام، والمتقدمة بأعداد حتى المليون.\n  الطالب: تتنافس المجموعات في تحديد قيم الأرقام وتسجيل الإجابات على لوح صغير.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قيمة الرقم بحسب منزلته في الأعداد الكاملة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: القيمة المكانية للأعداد العشرية حتى منزلتين\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: كيف نقرأ سعر سلعة ٢٫٧٥ ريال؟ وما قيمة الرقم ٧ فيه؟.\n  الطالب: يقترح الطلبة طرقًا للقراءة ويبررون إجاباتهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحدد قيمة الرقم في الأعداد العشرية حتى منزلتين عشريتين؛ أستطيع أن أقرأ الأعداد العشرية قراءة صحيحة (مثل: واحد وثلاثة وعشرون من مائة).\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يمدّ المعلم جدول القيمة المكانية إلى منزلتي الأجزاء من عشرة والأجزاء من مائة، ويقرأ ١٫٢٣ «واحد وثلاثة وعشرون من مائة» موضحًا خطأ قراءتها «واحد وثلاثة وعشرون».\n  الطالب: يضع الطلبة أعدادًا عشرية في الجدول ويقرأونها ويحددون قيمة كل رقم.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة الأعداد العشرية في التمرين ١ ص١٢ (الصفوف السفلية من الجدول)، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يكتب الطلبة الأعداد العشرية بالكلمات وبالأرقام ويتحققون في أزواج.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «أكمل العدد»: يذكر قيمة رقم ويكوّن الطلبة عددًا عشريًا يحققها، مع بطاقات معينة للدعم.\n  الطالب: يتبادل الطلبة الأدوار في تكوين الأعداد العشرية وقراءتها.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «القيمة المكانية للأعداد العشرية حتى منزلتين» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تطبيقات وتدريبات القيمة المكانية\n(٤ د) التهيئة:\n  المعلم: يطرح المعلم لغز: «أنا عدد من ٦ أرقام، رقم مئات الآلاف ٣، ورقم الآحاد ضعفه...».\n  الطالب: يحاول الطلبة تحديد العدد بالحوار ويعرضون طرقهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل تتطلب تكوين أعداد وفق شروط على القيمة المكانية؛ أستطيع أن أكتشف العدد الذي يزيد أو ينقص بمقدار ١٠ أو ١٠٠ أو ١٠٠٠ أو ١٠ ٠٠٠.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقود المعلم نشاط «أكبر فرق»: تكوين عددين من ٤ أرقام من ٨ بطاقات وإيجاد أكبر فرق ممكن، ثم يناقش أثر وضع الأرقام الكبيرة في المنازل العليا.\n  الطالب: يجرّب الطلبة ترتيبات مختلفة في مجموعات ويسجلون أكبر فرق ويعللون.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ١-١ ص١٠–١١ (أسئلة القيمة المكانية)، ويطرح أسئلة  المعلم: يعرض المعلم مساحات ثلاث ولايات عُمانية بالكيلومتر المربع ويسأل: أيها أكبر؟ كيف عرفت؟.\nدور الطالب: يقارن الطلبة الأعداد ويشرحون أنهم يبدؤون من المنزلة العليا.\n\nالحصة ٢: تقدير موقع الأعداد على خط أعداد فارغ\nدور المعلم: يرسم المعلم خطًا من ٠ إلى ١٠٠ ويسأل عن موقع ٥٠ ثم ٢٥.\nدور الطالب: يحدد الطلبة الموقعين ويشرحون كيف استدلوا.\n\nالحصة ٣: تقريب الأعداد لأقرب ١٠ و ١٠٠ و ١٠٠٠\nدور المعلم: يسأل المعلم: حضر المباراة ٣٨ ٤٦٧ مشجعًا، كيف ينشر الخبر الرقم مقرّبًا؟.\nدور الطالب: يقترح الطلبة أعدادًا مقرّبة ويناقشون أيها أنسب.", "الحصة ١: مقارنة الأعداد وترتيبها باستخدام > و <\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم مساحات ثلاث ولايات عُمانية بالكيلومتر المربع ويسأل: أيها أكبر؟ كيف عرفت؟.\n  الطالب: يقارن الطلبة الأعداد ويشرحون أنهم يبدؤون من المنزلة العليا.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقارن بين عددين كاملين حتى المليون مستخدمًا الرمزين > و <؛ أستطيع أن أرتب مجموعة أعداد تصاعديًا وتنازليًا.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم المقارنة بالبدء من المنزلة الأعلى في جدول القيمة المكانية، ويكتب العبارة بالرمز المناسب، ثم يرتب ٤ أعداد متقاربة.\n  الطالب: يطبق الطلبة الطريقة على أعداد يكتبها المعلم ويقرأون العبارات «... أكبر من ...».\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين المقارنة والترتيب ص١٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يكتب الطلبة الرمز المناسب ويرتبون الأعداد ويتحققون في أزواج.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «طابور الأعداد»: يحمل ٥ طلاب بطاقات أعداد ويرتبهم الصف.\n  الطالب: يرتب الطلبة زملاءهم حسب الأعداد ويبررون كل نقل.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مقارنة الأعداد وترتيبها باستخدام > و <» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: تقدير موقع الأعداد على خط أعداد فارغ\n(٥ د) التهيئة:\n  المعلم: يرسم المعلم خطًا من ٠ إلى ١٠٠ ويسأل عن موقع ٥٠ ثم ٢٥.\n  الطالب: يحدد الطلبة الموقعين ويشرحون كيف استدلوا.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقدّر موقع أعداد من ٤ أرقام على خط أعداد فارغ من ٠ إلى ١٠ ٠٠٠؛ أستطيع أن أبرر تقديري بالاعتماد على نقطة المنتصف والعلامات.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يعرض المعلم ورقة خطوط الأعداد الفارغة من ٠ إلى ١٠ ٠٠٠، ويسأل: ما العدد في المنتصف؟ ثم يعلّم كل ١٠٠٠ ويطلب تقدير موقع ٤٠٠٦ و ٤٧٠٠ و ٤٨٠٠.\n  الطالب: يقدّر الطلبة المواقع على خطوط فارغة في دفاترهم ويقارنون تقديراتهم.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة خط الأعداد ص١٤–١٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يقدّر الطلبة الأعداد المحددة بالأسهم ويكتبونها.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «الدوّار وخط الأعداد»: يدوّر الطالب ٤ أرقام ويكوّن عددًا ويحدده على الخط، مع خطوط معلَّمة كل ١٠٠٠ للدعم.\n  الطالب: يتنافس الطلبة في أقرب تقدير للموقع الصحيح.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «تقدير موقع الأعداد على خط أعداد فارغ» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: تقريب الأعداد لأقرب ١٠ و ١٠٠ و ١٠٠٠\n(٤ د) التهيئة:\n  المعلم: يسأل المعلم: حضر المباراة ٣٨ ٤٦٧ مشجعًا، كيف ينشر الخبر الرقم مقرّبًا؟.\n  الطالب: يقترح الطلبة أعدادًا مقرّبة ويناقشون أيها أنسب.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقرّب الأعداد الكاملة إلى أقرب ١٠ أو ١٠٠ أو ١٠٠٠؛ أستطيع أن أستخدم التقريب لتقدير نواتج عمليات حسابية والتحقق منها.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يوضح المعلم قاعدة التقريب: ننظر إلى الرقم في المنزلة الأدنى مباشرة؛ إن كان أصغر من ٥ نقرّب إلى الأقل، وإن كان ٥ أو أكثر نقرّب إلى الأكبر، مع تمثيل ذلك على خط الأعداد.\n  الطالب: يقرّب الطلبة أعدادًا لأقرب ١٠ و ١٠٠ و ١٠٠٠ ويمثلون بعضها على خط الأعداد.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين التقريب ص١٥ وكتاب النشاط ص١٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويتحققون من نواتج التقريب في أزواج.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «التقريب إلى أعلى»: بطاقات أعداد وجدول بثلاثة أعمدة (١٠، ١٠٠، ١٠٠٠) مع أعداد من ٤ أرقام لمجموعة الدعم.\n  الطالب: تملأ المجموعات الجدول وتعرض إجاباتها.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «ترتيب ومقارنة وتقريب الأعداد»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: مقارنة الأعداد وترتيبها باستخدام > و <\n١) [مستوى الدعم] ضع الرمز المناسب (> أو <): ٩٦١ ٥٧٧ ○ ٩٦٥ ١٧٧\n   الإجابة النموذجية: <\n٢) [المستوى المتوقع] ما أصغر عدد بين: ٩١ ٨٩٤، ٩١ ٣٧٩، ٩١ ٥٥٩، ٩١ ٨٧٠؟\n   الإجابة النموذجية: ٩١ ٣٧٩\n٣) [المستوى المتقدم] ضع الرمز المناسب (> أو <): ٦١٠ ٩٣١ ○ ٦١٩ ٠٣١\n   الإجابة النموذجية: <\n\nالحصة ٢: تقدير موقع الأعداد على خط أعداد فارغ\n١) [مستوى الدعم] على خط أعداد يبدأ بـ ٠ وينتهي بـ ١٠ ٠٠٠، ما العدد الذي يقع في المنتصف؟\n   الإجابة النموذجية: ٥٠٠٠\n٢) [المستوى المتوقع] ما أصغر عدد بين: ٦٣ ٦٩١، ٦٣ ٧٤١، ٦٣ ٤١٣، ٦٣ ٩٥٠؟\n   الإجابة النموذجية: ٦٣ ٤١٣\n٣) [المستوى المتقدم] على خط أعداد يبدأ بـ ٠ وينتهي بـ ١٠٠ ٠٠٠، ما العدد الذي يقع في المنتصف؟\n   الإجابة النموذجية: ٥٠ ٠٠٠\n\nالحصة ٣: تقريب الأعداد لأقرب ١٠ و ١٠٠ و ١٠٠٠\n١) [مستوى الدعم] قرّب العدد ٧١٧ ٢٧٢ إلى أقرب مائة.\n   الإجابة النموذجية: ٧١٧ ٣٠٠\n٢) [المستوى المتوقع] قرّب العدد ١٧٣ ٢٥٢ إلى أقرب عشرة.\n   الإجابة النموذجية: ١ أستطيع أن أوجد جميع عوامل عدد حتى ١٠٠ باستخدام أزواج العوامل؛ أستطيع أن أميز العلاقة بين العوامل والمضاعفات.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم إيجاد عوامل ٣٦ بطريقة منظمة: نبدأ من ١ ونتوقف عندما تتكرر الأزواج، ويوضح أن ٦ تُكتب مرة واحدة.\n  الطالب: يوجد الطلبة عوامل ٢٤ و ٣٠ و ٤٨ بالطريقة نفسها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة العوامل ص١٦–١٧، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يكتب الطلبة أزواج العوامل ويتحققون بالضرب.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «المصفوفات»: يكوّن الطلبة بالمكعبات مستطيلات لعدد معطى، مع أعداد أصغر من ٢٠ للدعم.\n  الطالب: يسجل الطلبة أبعاد المستطيلات بوصفها أزواج عوامل.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «العوامل وأزواج العوامل» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: عدد العوامل وتصنيف الأعداد\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: أيهما له عوامل أكثر ٢٤ أم ٢٥؟ خمّن قبل الحساب.\n  الطالب: يخمّن الطلبة ثم يتحققون بإيجاد العوامل.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقارن بين الأعداد من حيث عدد عواملها؛ أستطيع أن أكتشف أن الأعداد المربعة لها عدد فردي من العوامل.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقود المعلم استقصاء: يوجد الطلبة عدد عوامل الأعداد من ١ إلى ٣٠ في جدول، ثم يناقش: ما الأعداد التي لها عدد فردي من العوامل؟.\n  الطالب: يعمل الطلبة في مجموعات على الجدول ويكتشفون أن ١، ٤، ٩، ١٦، ٢٥ أعداد مربعة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٢-١ ص١٣–١٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة تدريبات العوامل والمضاعفات ويصححون ذاتيًا.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «الألغاز»: «أنا عدد بين ٢٠ و ٣٠، لي ٦ عوامل، وأحدها ٧...» مع ألغاز أبسط للدعم.\n  الطالب: يحل الطلبة الألغاز ويكتب المتقدمون ألغازًا لزملائهم.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «عدد العوامل وتصنيف الأعداد» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تطبيقات المضاعفات والعوامل\n(٤ د) التهيئة:\n  المعلم: يعرض المعلم مسألة: «يُعبّأ التمر في علب من ٦ حبات، فهل يمكن تعبئة ٥٠ حبة دون بقية؟».\n  الطالب: يناقش الطلبة الحل ويربطونه بالمضاعفات.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل حياتية باستخدام المضاعفات والعوامل؛ أستطيع أن أبرر اختياري للعملية المناسبة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقدّم المعلم مسائل متدرجة (توزيع طلاب في مجموعات متساوية، تبليط أرضية) ويطلب تحديد هل المطلوب عامل أم مضاعف.\n  الطالب: تحل المجموعات المسائل وتعرض طريقة التفكير.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ص١٥ وأسئلة التفكير ص١٧، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة فرديًا ثم يتبادلون التصحيح.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يكلف المعلم كل طالب بتصميم ملصق يوضح عوامل عدد ومضاعفاته الخمسة الأولى، مع نموذج جاهز للدعم.\n  الطالب: يصمم الطلبة الملصقات ويعرضونها في معرض صفي سريع.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «المضاعفات والعوامل»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: المضاعفات وأنماطها\n١) [مستوى الدعم] أيّ الأعداد الآت زنين فردي وزوجي.\n  الطالب: تتنافس المجموعات في التصنيف الصحيح.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «تمييز الأعداد الفردية والزوجية» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: قواعد جمع الأعداد الفردية والزوجية وطرحها\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: ٣٧ + ٤٥ هل الناتج فردي أم زوجي؟ أجب دون حساب.\n  الطالب: يخمّن الطلبة ثم يتحققون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أستنتج قواعد ناتج جمع وطرح الأعداد الفردية والزوجية؛ أستطيع أن أتنبأ بنوع الناتج دون إجراء الحساب.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقود المعلم استقصاء بجدول: فردي+فردي، زوجي+زوجي، فردي+زوجي، ومثلها للطرح، ويطلب ٣ أمثلة لكل حالة ثم التعميم.\n  الطالب: يجرب الطلبة الأمثلة في مجموعات ويصوغون القواعد ويمثلونها بالمكعبات.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة القواعد ص١٨–١٩، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يطبق الطلبة القواعد ويعللون إجاباتهم.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقدّم المعلم تحدي «فيصل: جمعت ثلاثة أعداد فردية فكانت إجابتي ٤٠» هل يمكن ذلك؟ مع أعداد صغيرة للدعم.\n  الطالب: يناقش الطلبة العبارة ويثبتون خطأها.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قواعد جمع الأعداد الفردية والزوجية وطرحها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: قاعدة ضرب الأعداد الفردية والزوجية وتطبيقاتها\n(٤ د) التهيئة:\n  المعلم: يسأل المعلم: هل يمكن أن يكون حاصل ضرب عددين زوجيين فرديًا؟.\n  الطالب: يجرب الطلبة أمثلة ويبدون آراءهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أست يكتبون النواتج.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة الضرب ص٢١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويتحققون بالجدول.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «بطاقات صح أو خطأ» للضرب في ١٠ و ١٠٠ و ١٠٠٠.\n  الطالب: يقرر الطلبة في أزواج صحة العبارة ويصححون الخاطئة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الضرب في ١٠ و ١٠٠ و ١٠٠٠» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: القسمة على ١٠ و ١٠٠ و ١٠٠٠\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: وُزّع ٤٥٠٠ ريال على ١٠٠ أسرة بالتساوي، فكم نصيب الأسرة؟.\n  الطالب: يقدّر الطلبة الناتج ويشرحون طريقتهم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقسم أعدادًا كاملة على ١٠ و ١٠٠ و ١٠٠٠؛ أستطيع أن أربط القسمة على ١٠ بالضرب فيها بوصفهما عمليتين عكسيتين.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم القسمة بانتقال الأرقام إلى اليمين في جدول القيمة المكانية، ويرسم مخطط «آلة الضرب والقسمة» ×١٠ / ÷١٠.\n  الطالب: يطبق الطلبة على أعداد متنوعة ويتحققون بالعملية العكسية.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة القسمة ص٢٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويقارنون الإجابات.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يكلف المعلم المجموعات بإكمال «سلاسل الأعداد»: ٤٥ ٠٠٠ ÷ ١٠ ÷ ١٠ ...، مع سلاسل أقصر للدعم.\n  الطالب: تكمل المجموعات السلاسل وتعرضها.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «القسمة على ١٠ و ١٠٠ و ١٠٠٠» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\ لًّا خاطئًا: ٤٫٥ + ٢٫٣٥ = ٢٫٨٠ ويسأل: أين الخطأ؟.\nدور الطالب: يكتشف الطلبة خطأ المحاذاة.", "الحصة ١: أزواج الأعداد العشرية التي مجموعها ١ و ١٠\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم لغز المخطط العددي: أكمل الخطوط بحيث يكون مجموع كل خط ١.\n  الطالب: يناقش الطلبة طرق الحل والبدء بالخط المكتمل.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أوجد أزواج الأعداد العشرية التي مجموعها ١ أو ١٠؛ أستطيع أن أستخدم الأزواج العددية لتسهيل الجمع الذهني للأعداد العشرية.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم إيجاد المكمّل: ٠٫٣ + ٠٫٧ = ١، ٠٫٦٥ + ٠٫٣٥ = ١، ٣٫٦ + ٦٫٤ = ١٠، باستخدام خط الأعداد.\n  الطالب: يكمل الطلبة أزواجًا يكتبها المعلم ويفسرون طريقتهم.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٢٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة الأزواج العددية.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «جمع البطاقات»: يطابق الطلبة بطاقات مجموعها ١ أو ١٠، مع أجزاء من عشرة فقط للدعم.\n  الطالب: تتنافس الأزواج في جمع أكبر عدد من الأزواج الصحيحة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «أزواج الأعداد العشرية التي مجموعها ١ و ١٠» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: جمع الأعداد العشرية ذات المنازل المتساوية\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: قطع خالد ٢٫٦ كم صباحًا و ٣٫٨ كم مساءً، كم قطع تقريبًا؟.\n  الطالب: يقدّر الطلبة بالتقريب ثم يحسبون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أجمع أعدادًا عشرية لها المنازل العشرية نفسها؛ أستطيع أن أقدّر ناتج الجمع قبل الحساب للتحقق.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم الجمع الرأسي مع محاذاة الفاصلة العشرية والحمل، ويقارن بالجمع الذهني بالتجزئة.\n  الطالب: يحل الطلبة أمثلة على السبورات الصغيرة ويقارنون الناتج بالتقدير.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين الجمع ص٢٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويتحققون بالتقدير.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «المتسوق الصغير»: قائمة أسعار يختار منها الطالب سلعتين ويجمع، مع أسعار بمنزلة واحدة للدعم.\n  الطالب: يجمع الطلبة ويقارنون مع زملائهم.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «جمع الأعداد العشرية ذات المنازل المتساوية» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: جمع الأعداد العشرية مختلفة المنازل\n(٤ د) التهيئة:\n  المعلم: يعرض المعلم حلًّا خاطئًا: ٤٫٥ + ٢٫٣٥ = ٢٫٨٠ ويسأل: أين الخطأ؟.\n  الطالب: يكتشف الطلبة خطأ المحاذاة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أجمع أعدادًا عشرية مختلفة في عدد المنازل العشرية؛ أستطيع أن أكتشف الأخطاء الشائعة في محاذاة المنازل ويصححها.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يوضح المعلم إضافة الصفر لتوحيد المنازل (٤٫٥٠ + ٢٫٣٥) ويحل مسائل ثلاثية الحدود.\n  الطالب: يحل الطلبة أمثلة في أزواج ويشرح كل منهما خطوة.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين ص٢٦، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويصححون ذاتيًا.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يكلف المعلم المجموعات بنشاط «المصدر ٥» في كتاب النشاط ص١٠١، مع بطاقات إرشاد للدعم.\n  الطالب: تحل المجموعات النشاط وتعرض نتائجها.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «جمع الأع ١ كم = ١٠٠٠ م\n\nالحصة ٤: تطبيقات القياس والتحويل\nالمقارنة، الترتيب، القياس الدقيق", "الحصة ١: وحدات قياس الطول وأدواته\nدور المعلم: يطلب المعلم من المجموعات رسم «سحابة أفكار» عما تعرفه عن الطول وأدوات قياسه في دقيقتين.\nدور الطالب: تعرض المجموعات أفكارها بجانب ملصق قياس الطول.\n\nالحصة ٢: التحويل بين الوحدات الصغيرة (م، سم، ملم)\nدور المعلم: يسأل المعلم: طول قلمي ١٤٫٥ سم، كم مليمترًا؟.\nدور الطالب: يقترح الطلبة طريقة ويربطونها بالضرب في ١٠.\n\nالحصة ٣: التحويل بين الكيلومتر والمتر\nدور المعلم: يعرض المعلم خريطة لمسافات بين مدن عُمانية ويسأل: المسافة ٤٫٥ كم، كم مترًا؟.\nدور الطالب: يحسب الطلبة ويعللون.\n\nالحصة ٤: تطبيقات القياس والتحويل\nدور المعلم: يكتب المعلم: ١٫٢ م، ١١٥ سم، ١٢٥٠ ملم ويسأل: أيها الأطول؟.\nدور الطالب: يحوّل الطلبة إلى وحدة واحدة ثم يقارنون.", "الحصة ١: وحدات قياس الطول وأدواته\n(٥ د) التهيئة:\n  المعلم: يطلب المعلم من المجموعات رسم «سحابة أفكار» عما تعرفه عن الطول وأدوات قياسه في دقيقتين.\n  الطالب: تعرض المجموعات أفكارها بجانب ملصق قياس الطول.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحدد وحدات قياس الطول المترية (كم، م، سم، ملم) والأداة المناسبة لكل قياس؛ أستطيع أن أختار الوحدة المناسبة لقياس أطوال من البيئة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يعرض المعلم ملصق قياس الطول ويناقش العلاقات: ١ كم = ١٠٠٠ م، ١ م = ١٠٠ سم، ١ سم = ١٠ ملم، ويعرض أدوات قياس مختلفة (مسطرة، شريط، عجلة قياس).\n  الطالب: يقترح الطلبة الوحدة والأداة المناسبة لقياس: طول الصف، سمك الكتاب، المسافة إلى المدرسة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى فقرة الاستكشاف ص٣٠، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يجيب الطلبة عن أسئلة اختيار الوحدات.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «قِس وقدّر»: يقدّر الطلبة أطوال ٤ أشياء في الصف ثم يقيسونها، مع أشياء أقصر من متر للدعم.\n  الطالب: يسجل الطلبة التقدير والقياس الفعلي ويحسبون الفرق.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «وحدات قياس الطول وأدواته» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: التحويل بين الوحدات الصغيرة (م، سم، ملم)\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: طول قلمي ١٤٫٥ سم، كم مليمترًا؟.\n  الطالب: يقترح الطلبة طريقة ويربطونها بالضرب في ١٠.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحوّل بين المتر والسنتيمتر والمليمتر؛ أستطيع أن أفسر سبب الضرب عند التحويل من وحدة كبرى إلى صغرى.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم مخطط التحويل: من الكبرى إلى الصغرى نضرب، ومن الصغرى إلى الكبرى نقسم، مع أمثلة عشرية: ٢٫٣٥ م = ٢٣٥ سم.\n  الطالب: يحوّل الطلبة أطوالًا على السبورات الصغيرة ويشرحون.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين التحويل ص٣٠–٣١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويتحققون بالمخطط.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «تحويل الوحدة»: بطاقات أطوال متكافئة يطابقها الطلبة (١٫٥ م ↔ ١٥٠ سم ↔ ١٥٠٠ ملم).\n  الطالب: تتنافس الأزواج في المطابقة الصحيحة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «التحويل بين الوحدات الصغيرة (م، سم، ملم)» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: التحويل بين الكيلومتر والمتر\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم خريطة لمسافات بين مدن عُمانية ويسأل: المسافة ٤٫٥ كم، كم مترًا؟.\n  الطالب: يحسب الطلبة ويعللون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحوّل بين الكيلومتر والمتر بما في ذلك الأعداد العشرية؛ أستطيع أن أحل مسائل مسافات تتطلب التحويل.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم التحويل كم ↔ م بالضرب والقسمة على ١٠٠٠، مع مسائل: مسار جري ٢٤٠٠ م، كم كيلومترًا؟.\n  الطالب: يحل الطلبة مسائل المسافات في أزواج.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٣١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة ويقارنون.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «الدائرة»: يقف الطلبة في دائرة ويحوّل كل منهم الطول الذي يذكره سابقه إلى وحدة جديدة.\n  الطالب: يشارك الطلبة بالتناوب ويصحح الصف.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «التحويل بين الكيلومتر والمتر» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تطبيقات القياس والتحويل\n(٤ د) التهيئة:\n  المعلم: يكتب المعلم: ١٫٢ م، ١١٥ سم، ١٢٥٠ ملم ويسأل: أيها الأطول؟.\n  الطالب: يحوّل الطلبة إلى وحدة واحدة ثم يقارنون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقيس أطوالًا بدقة ويعبر عنها بوحدات مختلفة؛ أستطيع أن أقارن أطوالًا معطاة بوحدات مختلفة ويرتبها.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقدم المعلم نشاط «الأطوال اللازمة للتأمين على السيارات» من دليل المعلم: يحسب الطلبة أطوالًا ويقارنونها بالحدود المسموح بها.\n  الطالب: تحل المجموعات المهمة وتعرض النتائج.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٥-١ ص٣٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة القياس.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم تحدي «قياس الخطوط المنحنية» باستخدام الخيط والمسطرة، مع خطوط مستقيمة للدعم.\n  الطالب: يقيس الطلبة ويسجلون بالسنتيمتر والمليمتر.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة لى أقرب مليمتر\n(٥ د) التهيئة:\n  المعلم: يرسم المعلم خطًا ويطلب من طالبين قياسه بمسطرتين ويسأل: لماذا اختلفت القراءتان قليلًا؟.\n  الطالب: يناقش الطلبة مصادر الخطأ.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أرسم خطوطًا مستقيمة بطول محدد إلى أقرب مليمتر؛ أستطيع أن أوضح ممارسات الدقة في الرسم (قلم مدبب، البدء من الصفر).\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يوضح المعلم أهمية القلم المدبب وبدء القياس من علامة الصفر، ويطلب رسم خط طوله ٥٠ ملم ثم السؤال: كم سنتيمترًا؟.\n  الطالب: يرسم الطلبة الخطوط ويمررونها لزملائهم للتحقق.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين الرسم ص٣٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يرسم الطلبة الخطوط المطلوبة ويكتبون أطوالها.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «ارسم وتحقق»: يكتب الطالب طولًا ويرسمه زميله ثم يتحقق الأول.\n  الطالب: يتبادل الطلبة الأدوار ويسجلون الدقة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «رسم الخطوط بدقة إلى أقرب مليمتر» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: قياس الخطوط والتعبير عنها بالسنتيمتر والمليمتر\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم خطين ويسأل: أيهما أطول وبكم؟.\n  الطالب: يقدّر الطلبة ثم يقيسون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقيس أطوال خطوط ويعبر عنها بالسنتيمتر والمليمتر؛ أستطيع أن أحسب الفرق بين طولين بالمليمتر.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم قياس خط وكتابته بالصيغتين (٨٫٧ سم = ٨٧ ملم) وحساب الفرق بين خطين.\n  الطالب: يقيس الطلبة خطوطًا في ورقة عمل ويحسبون الفروق.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين القياس ص٣٣، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة التمارين ويقارنون القياسات.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «الحلزون»: يرسم الطلبة حلزونًا من قطع مستقيمة تزداد بمقدار ٥ ملم.\n  الطالب: يرسم الطلبة ويقيسون الطول الكلي.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قياس الخطوط والتعبير عنها بالسنتيمتر والمليمتر» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: تطبيقات رسم الخطوط وقياسها\n(٤ د) التهيئة:\n  المعلم: يطلب المعلم رسم مستطيل ٦٫٥ سم × ٣٫٢ سم دون أدوات إرشاد إضافية.\n  الطالب: يرسم الطلبة ويتبادلون الرسومات.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أرسم أشكالًا مستطيلة بأبعاد محددة بدقة؛ أستطيع أن أقيّم دقة رسمي ورسم زملائي.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقدم المعلم تحدي «تصميم بطاقة دعوة» بأبعاد محددة ويحدد معايير الدقة.\n  الطالب: ينفذ الطلبة التصميم ويقيسون أبعاده.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٥-١ ص٣٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة الرسم والقياس.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقود المعلم تقييم الأقران بقائمة رصد (الطول صحيح ± ١ ملم، الزوايا قائمة).\n  الطالب: يقيّم الطلبة رسومات زملائهم ويقدمون ملاحظات.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «رسم الخطوط»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: رسم الخطوط بدقة إلى أقرب مليمتر\n١) [مستوى الدعم] رسم أحمد خطين طولاهما ٣ سم و ٥٫١ سم. ما الفرق بي ٢٤ ساعة\nدور المعلم: يعرض المعلم ساعة عقارب على ٤:٢٥ ويسأل: كيف نكتبها رقميًا صباحًا؟ وبعد الظهر؟.\nدور الطالب: يكتب الطلبة ٠٤:٢٥ و ١٦:٢٥ ويتحققون.\n\nالحصة ٢: حساب الفترات الزمنية\nدور المعلم: يسأل المعلم: بدأت المباراة ١٦:٤٥ وانتهت ١٨:٢٠، كم استغرقت؟.\nدور الطالب: يقترح الطلبة طرقًا للحساب.\n\nالحصة ٣: قراءة الجداول الزمنية وتفسيرها\nدور المعلم: يعرض المعلم الجدول الزمني لشركة النقل الوطنية العمانية (مواصلات) ويسأل: متى تغادر أول حافلة؟.\nدور الطالب: يقرأ الطلبة الجدول ويجيبون.\n\nالحصة ٤: مسائل حياتية على الوقت والجداول الزمنية\nدور المعلم: يسأل المعلم: يجب أن تصل إلى مسقط قبل ١٤:٠٠ والرحلة ٢ ساعة و ٤٠ دقيقة، متى تغادر على الأكثر؟.\nدور الطالب: يناقش الطلبة الحل بالعد التنازلي.", "الحصة ١: قراءة الوقت بنظامي ١٢ و ٢٤ ساعة\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم ساعة عقارب على ٤:٢٥ ويسأل: كيف نكتبها رقميًا صباحًا؟ وبعد الظهر؟.\n  الطالب: يكتب الطلبة ٠٤:٢٥ و ١٦:٢٥ ويتحققون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقرأ الوقت على الساعات الرقمية وساعات العقارب؛ أستطيع أن أحوّل الوقت بين نظامي ١٢ ساعة و ٢٤ ساعة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم التحويل بإضافة ١٢ للأوقات بعد الظهر، ويوضح كتابة ٠٠:٠٠ لمنتصف الليل.\n  الطالب: يحوّل الطلبة أوقاتًا يعرضها المعلم ويقرأونها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٣٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة قراءة الوقت والتحويل.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «ترتيب الأوقات»: بطاقات أوقات بالنظامين يرتبها الطلبة من الأبكر إلى الأحدث.\n  الطالب: ترتب المجموعات البطاقات وتعلل.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قراءة الوقت بنظامي ١٢ و ٢٤ ساعة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: حساب الفترات الزمنية\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: بدأت المباراة ١٦:٤٥ وانتهت ١٨:٢٠، كم استغرقت؟.\n  الطالب: يقترح الطلبة طرقًا للحساب.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحسب الفترة الزمنية بين وقتين؛ أستطيع أن أستخدم خط الأعداد الزمني لحساب الفترات.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم القفز على خط الأعداد الزمني: من ١٦:٤٥ إلى ١٧:٠٠ (١٥ دقيقة) ثم إلى ١٨:٠٠ ثم إلى ١٨:٢٠.\n  الطالب: يحل الطلبة مسائل فترات زمنية بالطريقة نفسها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٣٤–٣٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحسب الطلبة الفترات الزمنية ويتحققون.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «سباق الوقت» الجماعية: بطاقات وقت بدء ومدة يحسب منها الطلبة وقت الانتهاء.\n  الطالب: تتنافس المجموعات في السرعة والدقة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «حساب الفترات الزمنية» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: قراءة الجداول الزمنية وتفسيرها\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم الجدول الزمني لشركة النقل الوطنية العمانية (مواصلات) ويسأل: متى تغادر أول حافلة؟.\n  الطالب: يقرأ الطلبة الجدول ويجيبون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقرأ جدولًا زمنيًا للمواصلات ويستخرج منه المعلومات؛ أستطيع أن أحسب مدة الرحلة بين محطتين من الجدول.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يطرح المعلم أسئلة متدرجة على الجدول: مدة الرحلة، أي حافلة تصل قبل وقت معين.\n  الطالب: تحل المجموعات الأسئلة وتعرض حلولها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة الجدول الزمني ص٣٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة فرديًا.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يكلف المعلم كل مجموعة بتصميم جدول زمني ليوم رحلة مدرسية، مع قالب جاهز للدعم.\n  الطالب: تصمم المجموعات الجداول وتطرح أسئلة عليها.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «قراءة الجداول الزمنية وتفسيرها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: مسائل حياتية على الوقت والجداول الزمنية\n(٤ د) التهيئة:\n  المعلم: يسأل المعلم: يجب أن تصل إلى مسقط قبل ١٤:٠٠ والرحلة ٢ ساعة و ٤٠ دقيقة، متى تغادر على الأكثر؟.\n  الطالب: يناقش الطلبة الحل بالعد التنازلي.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل متعددة الخطوات على الوقت؛ أستطيع أن أخطط لرحلة باستخدام جدول زمني.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقدم المعلم مهمة «خطط رحلتك»: جدول حافلات ومواعيد زيارة يختار منها الطلبة الرحلات المناسبة.\n  الطالب: تخطط المجموعات وتبرر اختياراتها.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين المراجعة ص٣٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «الجدول الزمني» بمستويات: جدول بسيط للدعم وجدول مع تحويلات للمتقدمين.\n  الطالب: يحل الطلبة الأسئلة ويتبادلون التحقق.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «الجداول الزمنية»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: قراءة الوقت بنظامي ١٢ و ٢٤ ساعة\n١) [مستوى الدعم] اكتب الوقت ١٥:٣٥ بنظام ١٢ ساعة.\n   الإج أسبوع، شهر، سنة)؛ أستطيع أن أحوّل بين وحدات الوقت في خطوتين.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يجمع المعلم القوائم في جدول للصف ويطلب حساب عدد الثواني في الساعة وعدد الساعات في الأسبوع بخطوتين.\n  الطالب: يحسب الطلبة ويكتبون خطوات الحل.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٣٦، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة تحويل وحدات الوقت.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «حقيقة الوقت»: بطاقات حقائق صحيحة وخاطئة عن الوقت.\n  الطالب: يقرر الطلبة الصحة ويصححون الخطأ.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «وحدات الوقت والعلاقات بينها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: قراءة التقويم وحساب المدد بالأيام\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم تقويم شهر أكتوبر ٢٠٢٦ ويسأل: ما اليوم الموافق ١٨ أكتوبر؟.\n  الطالب: يقرأ الطلبة التقويم ويجيبون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أستخدم التقويم لتحديد الأيام والتواريخ؛ أستطيع أن أحسب عدد الأيام بين تاريخين.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم حساب الأيام بين تاريخين (ضمن الشهر وعبر شهرين) وتذكر أعداد أيام الشهور بالعدّ على قبضة اليد.\n  الطالب: يحسب الطلبة المدد بين مناسبات يحددونها.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة التقويم ص٣٦–٣٧، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يكلف المعلم المجموعات بإيجاد عدد الأيام المتبقية حتى العيد الوطني (٢٠ نوفمبر).\n  الطالب: تحسب المجموعات وتعرض طرقها.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة ر النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم القاعدة ويطبقها على مستطيلات، ويحسب الطول المجهول من المساحة والعرض.\n  الطالب: يحسب الطلبة مساحات ويوجدون أبعادًا مجهولة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة المساحة ص٣٨–٣٩، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «التغطية»: تغطية شكل بمربعات ١ سم² مع مستطيلات أصغر للدعم وأشكال مركبة للمتقدمين.\n  الطالب: يحسب الطلبة المساحات ويقارنون.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مساحة المستطيل بالسنتيمتر المربع» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: مساحة الأشكال المركبة ومحيطها\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم مخطط غرفة على شكل L ويسأل: كيف نحسب مساحة البلاط اللازم؟.\n  الطالب: يقترح الطلبة طرق التقسيم.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحسب مساحة أشكال مركبة بتقسيمها إلى مستطيلات؛ أستطيع أن أحسب محيط الأشكال المركبة بإيجاد الأضلاع المجهولة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم طريقتين: التقسيم إلى مستطيلين، والمستطيل الكبير ناقص المقطوع، ويحسب المحيط.\n  الطالب: تحل المجموعات أشكالًا مركبة بالطريقتين وتقارن.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة الأشكال المركبة ص٣٩، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقدم المعلم نشاط «مساحة البساط» من دليل المعلم بمستويات متدرجة.\n  الطالب: يحسب الطلبة المساحات ويبررون.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مساحة الأشكال المركبة ومحيطها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تقدير مساحة الأشكال غير المنتظمة\n(٤ د) التهيئة:\n  المعلم: يعرض المعلم ورقة شجرة على شبكة مربعات ويسأل: كيف نقدّر مساحتها؟.\n  الطالب: يقترح الطلبة عدّ المربعات وأنصافها.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقدّر مساحة شكل غير منتظم بعد المربعات الكاملة والأجزاء؛ أستطيع أن أصمم نموذج منزل بأبعاد محسوبة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم القاعدة: عدّ المربعات الكاملة وكل مربعين جزئيين بمربع تقريبًا، ثم يكلّف المجموعات ببدء تصميم «نموذج المنزل» بحساب أبعاد الجدران.\n  الطالب: ينفذ الطلبة التقدير ويخططون النموذج.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى ورقة «مساحة الأشكال غير المنتظمة»، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يقدّر الطلبة المساحات ويقارنونها.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «مساحة الأرز»: تقدير مساحة كف اليد على ورق المربعات.\n  الطالب: يرسم الطلبة ويقدّرون ويقارنون مع زملائهم.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «المساحة والمحيط (١)»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: محيط المستطيلات والأشكال المستقيمة الخطوط\n١) [مستوى الدعم] مستطيل طوله ٣ سم وعرضه ٣ سم. ما مساحته؟\n   الإجابة النموذجية: ٩ سم²\n٢) [المستوى المتوقع] مستطيل طوله ١٣ سم وعرضه ٤ سم. ما محيطه؟\n   الإجابة النموذجية: ٣٤ سم\n٣) [المستوى المتقدم] مستطيل مساحته ٧٧ سم² وطوله ٧ سم. ما عرضه؟\n   الإجابة النموذجية: ١١ سم\n\nالحصة ٢: مساحة المستطيل بالسنتيمتر المربع\n١) [مستوى الدعم] مستطيل طوله ١٣ سم وعرضه ٥ سم. ما محي ئرة، مثلث، شكل مفتوح، سداسي) ويسأل: أيها مضلع؟.\n  الطالب: يصنف الطلبة ويعللون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أميز المضلعات من غيرها وفق خصائصها؛ أستطيع أن أسمي المضلعات بحسب عدد أضلاعها.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقرأ المعلم تعريف المضلع ويطلب إنشاء قائمة أسئلة للتحقق: ٣ أضلاع أو أكثر، مستقيمة، مغلق، لا تتقاطع.\n  الطالب: يطبق الطلبة القائمة على ورقة «تمييز المضلعات».\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٤٠، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة التمييز والتسمية.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «تخمين الشكل»: يصف طالب خصائص شكل ويخمّن الآخرون.\n  الطالب: يتبادل الطلبة الأدوار.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «المضلع وخصائصه» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: المضلعات الرباعية وخصائصها\n(٥ د) التهيئة:\n  المعلم: يعطي المعلم كل مجموعة حلقة خيط ويطلب تكوين مستطيل ثم مربع.\n  الطالب: تكوّن المجموعات الأشكال وتناقش الفرق.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أصف خصائص المضلعات الرباعية (المربع، المستطيل، المعين، متوازي الأضلاع، شبه المنحرف، الطائرة الورقية)؛ أستطيع أن أصنف المضلعات الرباعية وفق الأضلاع المتوازية والمتساوية.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يعرض المعلم ورقة المضلعات الرباعية ويبني جدول خصائص (أزواج الأضلاع المتوازية، الأضلاع المتساوية، الزوايا القائمة).\n  الطالب: يكمل الطلبة الجدول ويقارنون الأشكال.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٤١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة أسئلة الخصائص.\n  صورًا لمعالم (قلعة، خزان ماء، برج) ويسأل: ما المجسمات التي تراها؟.\nدور الطالب: يحدد الطلبة المجسمات.", "الحصة ١: الأوجه والحواف والرؤوس\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم مجسمات (مكعب، منشور ثلاثي، هرم رباعي، أسطوانة) ويسأل: ما اسم كل منها؟.\n  الطالب: يسمي الطلبة المجسمات ويصفونها.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحدد عدد الأوجه والحواف والرؤوس للمجسمات؛ أستطيع أن أصف المجسمات باستخدام المفردات الصحيحة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم عدّ الأوجه والحواف والرؤوس مع تعليم المعدود لتجنب التكرار، ويسجل في جدول.\n  الطالب: تعد المجموعات خصائص مجسمات وتكمل الجدول.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٤٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «كم عدد الأوجه؟» بمجسمات حقيقية للدعم وصور للمتقدمين.\n  الطالب: يعد الطلبة ويتحققون.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الأوجه والحواف والرؤوس» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: المقاطع العرضية للمجسمات\n(٥ د) التهيئة:\n  المعلم: يقطع المعلم خيارة أو قطعة صلصال أسطوانية ويسأل: ما شكل المقطع؟.\n  الطالب: يتوقع الطلبة الشكل ويتحققون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أتعرف على الشكل الثنائي الأبعاد الناتج عن قطع مجسم؛ أستطيع أن أتنبأ بالمقطع العرضي قبل القطع ويتحقق.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يعرض المعلم ملصق الأشكال ثلاثية الأبعاد ويطلب التنبؤ بمقاطع منشور ثلاثي ومكعب وهرم عند قطعها موازيًا للقاعدة.\n  الطالب: تقطع المجموعات نماذج صلصال وتسجل المقاطع.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة المقاطع ص٤٣، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٨-٢أ ص٣٩–٤٠.\n  الطالب: يحل الطلبة الأنشطة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «المقاطع العرضية للمجسمات» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: العلاقات بين خصائص المنشورات والأهرامات\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: للمنشور الثلاثي ٥ أوجه، فكم وجهًا للمنشور السداسي؟.\n  الطالب: يخمّن الطلبة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أكتشف العلاقة بين عدد أضلاع القاعدة وعدد الأوجه والحواف في المنشورات والأهرامات؛ أستطيع أن أتنبأ بخصائص منشور أو هرم لم أره.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقود المعلم استقصاء في جدول: قاعدة بـ ن أضلاع ← المنشور (ن + ٢ وجه، ٣ن حافة)، الهرم (ن + ١ وجه، ٢ن حافة).\n  الطالب: تكمل المجموعات الجدول وتستنتج الأنماط.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٨-٢ب ص٤١–٤٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقدّم المعلم تحديًا: «مجسم له ٧ أوجه و ١٥ حافة، ما هو؟» مع جدول مساعد للدعم.\n  الطالب: يحل الطلبة ويبررون.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «العلاقات بين خصائص المنشورات والأهرامات» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تطبيقات على المجسمات\n(٤ د) التهيئة:\n  المعلم: يعرض المعلم صورًا لمعالم (قلعة، خزان ماء، برج) ويسأل: ما المجسمات التي تراها؟.\n  الطالب: يحدد الطلبة المجسمات.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أصنف المجسمات وفق خصائصها؛ أستطيع أن أربط المجسمات بأشياء في البيئة العُمانية.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم تصنيف المجسمات في مخطط فن (له أوجه مستوية فقط / له سطح منحن).\n  الطالب: تصنف المجموعات بطاقات المجسمات.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة المراجعة ص٤٣، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «من أنا؟»: يصف طالب خصائص مجسم ويخمّن الفريق.\n  الطالب: تتنافس الفرق.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «خصائص الأشكال ثلاثية الأبعاد ومقاطعها العرضية»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: الأوجه والحواف والرؤوس\n١) [مستوى الدعم] كم وجهًا للهرم رباعي القاعدة؟\n   الإجابة النموذجية: ٥\n٢) [المستوى المتوقع] كم عدد أوجه المنشور السباعي؟\n   الإجابة النموذجية: ٩\n٣) [المستوى المتقدم] كم عدد أوجه الهرم السباعي القاعدة؟\n   الإجابة النموذجية: ٨\n\nالحصة ٢: المقاطع العرضية للمجسمات\n١) [مستوى الدعم] كم عدد رؤوس الهرم الثلاثي القاعدة؟\n   الإجابة النموذجية: ٤\n٢) [المستوى المتوقع] كم عدد رؤوس المنشور السداسي؟\n   الإجابة النموذجية: ١٢\n٣) [المستوى المتقدم] كم عدد أوجه الهرم الرباعي القاعدة؟\n   الإجابة النموذجية: ٥\n\nالحصة ٣: العلاقات بين خصائص المنشورات والأهرامات\n١) [مستوى الدعم] كم عدد أوجه المنشور الرباعي؟\n   الإجابة النموذجية: ٦\n٢) [المستوى المتوقع] كم عدد رؤوس الهرم السداسي القاعدة؟\n   الإجابة النموذجية: ٧\n٣) [المستوى المتقدم] كم حافة للهرم رباعي القاعدة؟\n   الإجابة النموذجية: ٨\n\nالحصة ٤: تطبيقات على المجسمات\n١) [مستوى ا ت بإكمال قطع أثاث نموذج المنزل من شبكات مصممة بأبعاد محددة.\n  الطالب: تصمم المجموعات الشبكات وتبني المجسمات.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ص٤٦ والمصدر ٣ ص٨٩، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأنشطة.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقود المعلم معرضًا للنماذج مع تقييم الأقران.\n  الطالب: يقيّم الطلبة النماذج وفق معايير الدقة.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «الشبكات»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: شبكات المكعب ومتوازي المستطيلات\n١) [مستوى الدعم] كم وجهًا في شبكة المكعب المفتوح (بلا غطاء)؟\n   الإجابة النموذجية: ٥\n٢) [المستوى المتوقع] ما المجسم الذي تتكون شبكته من ٦ مربعات متطابقة؟\n   الإجابة النموذجية: المكعب\n٣) [المستوى المتقدم] عند طي شبكة المكعب، كم مربعًا يلتقي عند كل رأس؟\n   الإجابة النموذجية: ٣\n\nالحصة ٢: شبكات المنشورات والأهرامات\n١) [مستوى الدعم] تتكون شبكة هرم قاعدته مثلث من القاعدة وعدد من المثلثات. كم مثلثًا فيها؟\n   الإجابة النموذجية: ٣\n٢) [المستوى المتوقع] كم عدد حواف المنشور الثماني؟\n   الإجابة النموذجية: ٢٤\n٣) [المستوى المتقدم] تتكون شبكة منشور قاعدته مضلع خماسي من قاعدتين وعدد من المستطيلات. كم مستطيلًا فيها؟\n   الإجابة النموذجية: ٥\n\nالحصة ٣: بناء المجسمات من شبكاتها\n١) [مستوى الدعم] تتكون شبكة منشور قاعدته مضلع رباعي من قاعدتين وعدد من المستطيلات. كم مستطيلًا فيها؟\n   الإجابة النموذجية: ٤\n٢) [المستوى المتوقع] تتكون شبكة منشور قاعدته مثلث من قاعدتين وعدد من المستطيلات. كم مستطيلًا فيها؟\n   الإجابة النموذجية: ٣\n٣) [المستوى المتقدم] تتكون شبكة هرم قاعدته مضلع سباعي من القاعدة وعدد من المثلثات. كم مثلثًا فيها؟\n   الإجابة النموذجية: ٧", "الحصة ١: شبكات المكعب ومتوازي المستطيلات\n١) [مستوى الدعم] تتكون شبكة هرم قاعدته مضلع سداس طلبة الثالثة ويقررون.", "الحصة ١: الزوايا على خط مستقيم\n(٥ د) التهيئة:\n  المعلم: يستخدم المعلم عصوين متريتين لتكوين زوايا ويسأل: كم درجة الاستدارة عند الزاوية القائمة؟ وعند الخط المستقيم؟.\n  الطالب: يجيب الطلبة ٩٠° و ١٨٠°.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أتذكر أن مجموع الزوايا على خط مستقيم ١٨٠°؛ أستطيع أن أحسب زاوية مجهولة على خط مستقيم.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم حساب الزاوية المجهولة: ١٨٠° − ٦٥° = ١١٥°، ويراجع أنواع الزوايا (حادة، قائمة، منفرجة).\n  الطالب: يحل الطلبة أمثلة على السبورات الصغيرة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٤٦، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «الزوايا الناقصة» ببطاقات زاوية وخط مستقيم.\n  الطالب: تتنافس الأزواج في إيجاد الزوايا.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الزوايا على خط مستقيم» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: اكتشاف مجموع زوايا المثلث\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: هل يمكن رسم مثلث فيه زاويتان قائمتان؟.\n  الطالب: يجرب الطلبة الرسم ويناقشون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقيس زوايا مثلثات بالمنقلة؛ أستطيع أن أستنتج أن مجموع زوايا المثلث ١٨٠°.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقود المعلم استقصاء: يقيس الطلبة زوايا ٣ مثلثات مختلفة بورقة «قياس الزوايا في المثلثات» ويجمعونها، ثم يقصّون زوايا مثلث ورقي ويضعونها على خط مستقيم.\n  الطالب: يستنتج الطلبة أن المجموع ١٨٠°.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٤٦–٤٧، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٩-١ ص٤٧ مع مثلثات مرسومة مسبقًا للدعم.\n  الطالب: يقيس الطلبة ويتحققون.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «اكتشاف مجموع زوايا المثلث» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: حساب الزاوية المجهولة في المثلث\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم مثلثًا زاويتاه ٥٠° و ٧٠° ويسأل: ما الثالثة؟.\n  الطالب: يحسب الطلبة ويشرحون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحسب الزاوية الثالثة في المثلث بمعلومية زاويتين؛ أستطيع أن أحسب زوايا المثلث متطابق الضلعين ومتطابق الأضلاع.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم حساب الزوايا المجهولة، ويوضح أن زاويتي القاعدة في متطابق الضلعين متساويتان وأن كل زاوية في متطابق الأضلاع ٦٠°.\n  الطالب: يحل الطلبة مسائل متدرجة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٤٧ وكتاب النشاط ص٤٨، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «أوجد بطاقات الزوايا الناقصة» بمستويات متدرجة.\n  الطالب: يحل الطلبة البطاقات ويتحققون.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «حساب الزاوية المجهولة في المثلث» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تصنيف المثلثات بحسب زواياها وتطبيقات\n(٤ د) التهيئة:\n  المعلم: يسأل المعلم: مثلث زاويتاه ٣٠° و ٤٥°، هل هو منفرج؟.\n  الطالب: يحسب الطلبة الثالثة ويقررون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أصنف المثلثات إلى حادة الزوايا وقائمة ومنفرجة؛ أستطيع أن أبرر استحالة بعض المثلثات بالاعتماد على مجموع الزوايا.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يقدّم المعلم بطاقات مثلثات (زاويتان معلومتان) يصنفها الطلبة بعد حساب الثالثة، ويطرح: هل يوجد مثلث زواياه ١٠٠° و ٩٠°؟.\n  الطالب: تصنف المجموعات وتبرر الحالات المستحيلة.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ٩-١ ص٤٩، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «مثلثات LOGO» على الحاسوب لرسم مثلثات بأوامر دوران.\n  الطالب: يرسم الطلبة المثلثات ويتحققون من الزوايا.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «الزوايا في المثلثات»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: الزوايا على خط مستقيم\n١) [مستوى الدعم] في مثلث زاويتان قياسهما ٤٩° و ٧٤°. ما قياس الزاوية الثالثة؟\n   الإجابة النموذجية: ٥٧°\n٢) [المستوى المتوقع] زاويتان على خط مستقيم، قياس إحداهما ١٤٤°. ما قياس الأخرى؟\n   الإجابة النموذجية: ٣٦°\n٣) [المستوى المتقدم] زاويتان على خط مستقيم، قياس إحداهما ٩٣°. ما قياس الأخرى؟\n   الإجابة النموذجية: ٨٧°\n\nالحصة ٢: اكتشاف مجموع زوايا المثلث\n١) [مستوى الدعم] في مثلث زاويتان قياسهما ٣٤° و ٥٦°. ما قياس الزاوية الثالثة؟\n   الإجابة النموذجية: ٩٠°\n٢) [المستوى المتوقع] في مثلث زاويتان قياسهما ٨٥° و ٦١°. ما قياس الزاوية الثالثة؟\n   الإجابة النموذجية: ٣٤°\n٣) [المستوى المتقدم] في مثلث زاويتان قياسهما ٤٠° و ٤١°. ما قياس الزاوية الثالثة؟\n   الإجابة النموذجية: ٩٩°\n\nالحصة ٣: حساب الزاوية المجهولة في المثلث\n١) [مستوى الدعم] في مثلث زاويتان قياسهما ٣٧° و ٧٧°. ما قياس الزاوية الثالثة؟\n   الإجابة النموذجي حقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: الانعكاس في المحورين الإحداثيين\n(٥ د) التهيئة:\n  المعلم: يحدد المعلم النقطة (٣، ٢) ويسأل عن صورتها في المحور الصادي.\n  الطالب: يتوقع الطلبة ويرسمون.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أوجد إحداثيات صورة نقطة بالانعكاس في المحور السيني أو الصادي؛ أستطيع أن أستنتج قاعدة تغير الإحداثيات عند الانعكاس.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: يقود المعلم جدول استقصاء لنقاط وصورها في المحورين ويستنتج: في السيني تتغير إشارة ص، وفي الصادي تتغير إشارة س.\n  الطالب: يكمل الطلبة الجدول ويصوغون القاعدة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٥٠–٥١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ١٠-١ب ص٥٢ مع شبكات معدة للدعم.\n  الطالب: يحل الطلبة الأنشطة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الانعكاس في المحورين الإحداثيين» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: انعكاس أشكال أضلاعها مائلة\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم انعكاسًا خاطئًا لمثلث مائل ويسأل: ما الخطأ؟.\n  الطالب: يكتشف الطلبة الخطأ.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أعكس أشكالًا أضلاعها غير موازية لخط المرآة؛ أستطيع أن أتحقق من صحة الانعكاس بالقياس أو الطي.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم انعكاس رأسًا رأسًا ثم التوصيل، ويستخدم ورق الشف للتحقق.\n  الطالب: يعكس الطلبة أشكالًا مائلة ويتحققون.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى تمارين ص٥١، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يرسم الطلبة الانعكاسات.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ص٥٣.\n  الطالب: يحل الطلبة الأنشطة.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «انعكاس أشكال أضلاعها مائلة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: تطبيقات الانعكاس\n(٤ د) التهيئة:\n  المعلم: يعرض المعلم صورًا لزخارف عُمانية متماثلة ويسأل: أين خطوط المرآة؟.\n  الطالب: يحدد الطلبة الخطوط.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أصمم نمطًا زخرفيًا باستخدام الانعكاس؛ أستطيع أن أحدد خط المرآة بين شكل وصورته.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: يكلف المعلم المجموعات بتصميم زخرفة بانعكاس شكل في خطين متعامدين.\n  الطالب: تصمم المجموعات الزخارف.\n(٨ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ص٥٤، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأنشطة.\n(٦ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يقود المعلم عرضًا للتصاميم مع تقييم الأقران.\n  الطالب: يقيّم الطلبة التصاميم.\n(١٠ د) الغلق والتقويم الختامي ومسابقة المجموعات:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ثم يدير مسابقة المجموعات على السبورة الذكية لختام درس «انعكاس الأشكال»، ويعلن المجموعة الفائزة ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي، ثم تتنافس المجموعات في المسابقة وتراجع الإجابات الخاطئة.\nالمجموع: ٤٠ دقيقة", "الحصة ١: الانعكاس في خط مرآة\n١) [مستوى الدعم] ما صورة النقطة (٢، ١) بالانعكاس في المحور الصادي؟\n   الإجابة النموذجية: (−٢، ١)\n٢) [المستوى المتوقع] ما صورة النقطة (٥، ٦) بالانعكاس في المحور السيني؟\n   الإجابة النموذجية: (٥، −٦)\n٣) [المستوى المتقدم] ما صورة النقطة (٣، ٧) بالانعكاس في المحور الصادي؟\n   الإجابة النموذجية: (−٣، ٧)\n\nالحصة ٢: الانعكاس في رأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم: ١٫٢٥ كغم = ١٢٥٠ غ، ٧٥٠ مل = ٠٫٧٥ لتر، ويبرز معنى «كيلو» و«ملّي».\n  الطالب: يحوّل الطلبة قياسات متنوعة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٦٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «مدونة القياسات»: يقيس الطلبة أشياء ويدونونها بوحدتين.\n  الطالب: يسجل الطلبة القياسات.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الأعداد العشرية في القياسات» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: مسائل النقود بالريال والبيسة\n(٥ د) التهيئة:\n  المعلم: يعرض المعلم قائمة أسعار مقصف المدرسة ويسأل: ماذا تشتري بـ ١ ريال؟.\n  الطالب: يقترح الطلبة مشتريات.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحل مسائل نقود بالريال العُماني والبيسة؛ أستطيع أن أحسب الباقي والمجموع في مواقف شراء.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم حساب المجموع والباقي بالأعداد العشرية ذات ثلاث منازل (٢٫٧٥٠ ريال).\n  الطالب: تحل المجموعات «المسائل الرياضية المتعلقة بالنقود».\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٦٢–٦٣، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعب أدوار «المتجر» بنقود ورقية تعليمية.\n  الطالب: يبيع الطلبة ويشترون ويحسبون الباقي.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مسائل النقود بالريال والبيسة» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، وي لميلاد وبعده ويسأل: كيف نمثل الأحداث قبل الميلاد؟.\n  الطالب: يقترح الطلبة استخدام أعداد سالبة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحدد الأعداد الموجبة والسالبة على خط الأعداد؛ أستطيع أن أربط الأعداد السالبة بمواقف حياتية (الحرارة، الخط الزمني).\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم خط الأعداد الأفقي والرأسي (مقياس الحرارة) ويحدد −٥ و ٣.\n  الطالب: يحدد الطلبة أعدادًا على خطوط أعداد.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٦٤ وكتاب النشاط ص٦٢، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: يكلف المعلم الطلبة برسم خط زمني لأحداث مهمة في حياتهم.\n  الطالب: يرسم الطلبة الخطوط الزمنية.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الأعداد السالبة على خط الأعداد» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٢: مقارنة الأعداد السالبة وترتيبها\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: أيهما أبرد −٨° أم −٣°؟.\n  الطالب: يناقش الطلبة ويستخدمون مقياس الحرارة.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أقارن بين الأعداد السالبة والموجبة ويرتبها؛ أستطيع أن أفسر لماذا −٨ أصغر من −٣.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم: العدد الأبعد يسارًا على خط الأعداد هو الأصغر، ويرتب أعدادًا مختلطة.\n  الطالب: يرتب الطلبة مجموعات أعداد.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى أسئلة ص٦٤–٦٥ وكتاب النشاط ص٦٣، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم لعبة «طابور الحرارة» ببطاقات درجات حرارة.\n  الطالب: يرتب الطلبة أنفسهم.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «مقارنة الأعداد السالبة وترتيبها» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٣: الفرق بين عددين أحدهما سالب\n(٥ د) التهيئة:\n  المعلم: يسأل المعلم: كانت الحرارة −٤° ليلًا و ٧° نهارًا، كم ارتفعت؟.\n  الطالب: يحسب الطلبة على خط الأعداد.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أحسب الفرق بين عدد سالب وعدد موجب باستخدام خط الأعداد؛ أستطيع أن أحل مسائل تغير درجات الحرارة.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٢ د) النشاط الرئيس:\n  المعلم: ينمذج المعلم العد عبر الصفر: من −٤ إلى ٠ (٤) ومن ٠ إلى ٧ (٧)، المجموع ١١.\n  الطالب: يحل الطلبة مسائل مشابهة.\n(٩ د) التطبيق الموجّه والتقويم التكويني:\n  المعلم: يوجّه المعلم الطلبة إلى كتاب النشاط ١٣-١ب ص٦٤–٦٥، ويطرح أسئلة التقويم التكويني أثناء التجوال.\n  الطالب: يحل الطلبة الأسئلة.\n(٧ د) نشاط تعاوني ومراعاة الفروق الفردية:\n  المعلم: ينفذ المعلم نشاط «إنشاء بطاقات لعبة الحلقة المغلقة» للفروق.\n  الطالب: يصمم الطلبة البطاقات ويلعبونها.\n(٥ د) الغلق والتقويم الختامي:\n  المعلم: يطرح المعلم أسئلة التقويم الختامي الثلاثة متدرجة (دعم، متوقع، متقدم)، ويلخص مع الطلبة أهم ما تعلموه في «الفرق بين عددين أحدهما سالب» ويوجّه إلى الواجب.\n  الطالب: يجيب الطلبة عن أسئلة التقويم الختامي فرديًا، ويقيّمون مدى تحقق معايير النجاح.\nالمجموع: ٤٠ دقيقة\n\nالحصة ٤: الأعداد العشرية والسالبة في المتتاليات\n(٤ د) التهيئة:\n  المعلم: يكتب المعلم: ٥، ٣، ١، ... ويسأل: ما الحدان التاليان؟.\n  الطالب: يكمل الطلبة −١، −٣.\n(٢ د) عرض المخرجات ومعايير النجاح:\n  المعلم: يعرض المعلم معايير النجاح: أستطيع أن أكمل متتاليات تعبر الصفر وتتضمن أعدادًا سالبة؛ أستطيع أن أحدد الأعداد العشرية السالبة على خط الأعداد.\n  الطالب: يقرأ الطلبة معايير النجاح ويحددون ما يعرفونه مسبقًا عن الموضوع.\n(١٠ د) النشاط الرئيس:\n  المعلم: ينمذج الم
