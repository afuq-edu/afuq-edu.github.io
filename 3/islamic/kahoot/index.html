:root{--ink:#2b3742;--mut:#6f7f8b;--line:#dfe7ee;--paper:#ffffff;--bg1:#f1f6ee;--bg2:#fbf7ee;--acc:#6f9a5a;--good:#5fae84;--bad:#e59a9a;--warn:#e9b872;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Baloo,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.screen{display:none;min-height:100vh;padding:clamp(12px,2.4vw,28px)}
.screen.on{display:flex;flex-direction:column;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:clamp(10px,2vh,20px)}
.ttl{font-weight:800;font-size:clamp(1.3rem,3vw,2.1rem);line-height:1.2}
.sub{color:var(--mut);font-size:clamp(.9rem,1.6vw,1.1rem)}
.icon{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.2vw,26px);box-shadow:0 10px 30px -18px rgba(60,90,120,.35)}
/* setup */
.setup{max-width:880px;width:100%;margin:0 auto;display:grid;gap:14px}
.step{display:grid;gap:8px}
.step>label,.step>.lab{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:10px}
.step .num{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--acc) 18%,#fff);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}
select,.txtin{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fbfdff;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 18px;font-weight:700;font-size:1.05rem;transition:.2s}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,#fff);color:var(--acc)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.names .nm{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;background:#fbfdff}
.names .dot{width:16px;height:16px;border-radius:50%;flex:none}
.names input{border:0;background:transparent;padding:8px 0;width:100%;font-size:1.05rem}
.names input:focus{outline:none}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;accent-color:var(--acc);height:28px}
.range output{min-width:54px;text-align:center;font-weight:800;font-size:1.5rem;color:var(--acc)}
.avail{color:var(--mut);font-size:.95rem}
.go{border:0;border-radius:18px;background:var(--acc);color:#fff;font-weight:800;font-size:1.35rem;padding:14px;letter-spacing:.3px;box-shadow:0 8px 20px -10px var(--acc);transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go:disabled{opacity:.5;cursor:not-allowed}
/* question */
.qwrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,20vw,240px);gap:clamp(12px,2vw,24px);align-items:start;max-width:1400px;width:100%;margin:0 auto}
.qcard{display:grid;gap:clamp(12px,2vh,20px)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border-radius:999px;padding:4px 14px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--mut)}
.turn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.gp{border-radius:999px;padding:6px 16px;border:2px solid transparent;font-weight:800;background:#fff;transition:.2s}
.gp.cur{color:#fff;transform:scale(1.04)}
.gp.pickable{border-color:var(--line)}
.qtext{font-size:clamp(1.5rem,3.3vw,2.6rem);font-weight:700;line-height:1.55;min-height:3em;display:flex;align-items:center}
.qtext .blank{display:inline-block;min-width:3.4em;border-bottom:3px dashed var(--acc);margin:0 .2em;color:transparent}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,16px)}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:20px;padding:clamp(12px,2vh,20px) 18px;font-size:clamp(1.15rem,2.3vw,1.8rem);font-weight:700;min-height:clamp(64px,10vh,96px);transition:transform .15s,border-color .2s,background .2s,opacity .3s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc)}
.opt .k{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;flex:none;color:#fff}
.opt:nth-child(1) .k{background:var(--g0)}.opt:nth-child(2) .k{background:var(--g1)}.opt:nth-child(3) .k{background:var(--g2)}.opt:nth-child(4) .k{background:var(--g3)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,#fff)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,#fff)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.side{display:grid;gap:14px;justify-items:center;position:sticky;top:20px}
.timer{position:relative;width:100%;aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{stroke:#e9eff4}
.timer .arc{stroke:var(--acc);stroke-linecap:round;transition:stroke .4s}
.timer.over .arc{stroke:var(--warn)}
.timer .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .s{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;line-height:1}
.timer .l{color:var(--mut);font-size:.95rem}
.pts{text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px;width:100%}
.pts b{display:block;font-size:1.7rem;color:var(--acc);line-height:1.1}
.pts span{color:var(--mut);font-size:.9rem}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;width:100%}
.feedback{min-height:1.6em;font-size:clamp(1.1rem,2vw,1.5rem);font-weight:800;text-align:center}
.feedback.good{color:var(--good)}.feedback.bad{color:#c97a7a}
/* results */
.res{max-width:1100px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}
.chart{position:relative;flex:1;min-height:clamp(260px,52vh,520px);margin-top:10px}
.col{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;transition:right .9s cubic-bezier(.3,.7,.2,1)}
.col .val{font-weight:800;font-size:clamp(1rem,2vw,1.4rem);margin-bottom:6px}
.col .gain{font-weight:800;color:var(--good);font-size:1rem;height:1.4em;opacity:0;transform:translateY(8px);transition:.5s .6s}
.col.win .gain{opacity:1;transform:none}
.col .b{width:100%;border-radius:16px 16px 6px 6px;height:0;transition:height 1.1s cubic-bezier(.25,.8,.25,1);position:relative}
.col.win .b{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--good),0 10px 26px -6px var(--good)}
.col .rk{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink)}
.col .nm{margin-top:8px;font-weight:800;font-size:clamp(.95rem,1.8vw,1.25rem);text-align:center;line-height:1.2}
.col .crown{height:1.6em;font-size:1.2rem;opacity:0;transition:.4s 1s}
.col.win .crown{opacity:1}
.nav{display:flex;justify-content:center;gap:10px;margin-top:16px}
.nav .go{min-width:260px}
/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px);flex:1;min-height:340px;margin-top:10px;position:relative;z-index:2}
.pod{display:flex;flex-direction:column;align-items:center;width:clamp(110px,22vw,240px)}
.pod .who{font-weight:800;font-size:clamp(1.1rem,2.4vw,1.7rem);text-align:center;opacity:0;transform:translateY(10px);transition:.6s}
.pod .sc{color:var(--mut);font-weight:700;opacity:0;transition:.6s}
.pod .blk{width:100%;border-radius:18px 18px 8px 8px;height:0;transition:height 1.2s cubic-bezier(.25,.8,.25,1);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-size:clamp(1.8rem,4vw,3rem);font-weight:800;color:#fff}
.podium.show .who,.podium.show .sc{opacity:1;transform:none}
.rest{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;position:relative;z-index:2}
.rest span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.confetti i{position:absolute;top:-30px;border-radius:50%;opacity:.75;animation:drift linear forwards}
@keyframes drift{to{transform:translate(var(--dx),110vh) rotate(260deg)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 16px;box-shadow:0 8px 22px -12px rgba(0,0,0,.3);display:none}
@media (max-width:760px){.qwrap{grid-template-columns:1fr}.side{position:static;grid-template-columns:120px 1fr;align-items:center;justify-items:stretch}.opts{grid-template-columns:1fr}.timer{width:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const L=DATA.lessons[S.L],pn=L.periods[S.P].n;
  const own=shuffle(L.q.filter(q=>q.p===pn)).sort((a,b)=>a.d-b.d);
  let chosen=own.slice(0,S.nq);
  if(chosen.length<S.nq){
    const rest=shuffle(L.q.filter(q=>q.p!==pn)).sort((a,b)=>Math.abs(a.p-pn)-Math.abs(b.p-pn)||a.d-b.d);
    chosen=chosen.concat(rest.slice(0,S.nq-chosen.length));
  }
  if(own.length>S.nq){ // keep a spread of levels from the chosen period
    const by=[1,2,3].map(d=>own.filter(q=>q.d===d));chosen=[];let i=0;
    while(chosen.length<S.nq){const b=by[i%3];if(b.length)chosen.push(b.shift());i++;if(i>300)break}
  }
  return chosen.sort((a,b)=>a.d-b.d);
}
/* ---------- game ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
$('#start').onclick=()=>{ac();startGame()};
$('#replay').onclick=()=>{clearConf();startGame()};
$('#again').onclick=()=>{clearConf();show('sSetup')};
$('#quit').onclick=()=>{if(confirm('إنهاء المسابقة وعرض النتيجة الحالية؟')){stopTimer();finish()}};
function startGame(){
  const names=S.names.slice(0,S.ng).map((n,i)=>(n||'').trim()||('المجموعة '+(i+1)));
  G={qs:pick(),i:-1,groups:names.map((n,i)=>({n,c:GCOL[i],s:0})),turn:-1,lastWin:-1,gain:0};
  $('#chart').innerHTML='';
  nextQ();
}
let tmr=null,t0=0,answered=false,active=-1;
function nextQ(){
  G.i++;if(G.i>=G.qs.length){finish();return}
  const q=G.qs[G.i];answered=false;
  $('#qNo').textContent='السؤال '+(G.i+1)+' من '+G.qs.length;
  const L=DATA.lessons[S.L];$('#qLesson').textContent=L.name+' — الحصة '+q.p;
  const qt=$('#qText');qt.innerHTML='';
  const parts=q.q.split(/\.{4,}|_{3,}/);
  parts.forEach((p,k)=>{qt.append(p);if(k<parts.length-1){const b=document.createElement('span');b.className='blank';b.textContent='—';qt.append(b)}});
  const opts=q.t==='tf'?['صواب','خطأ']:shuffle(q.o.slice());
  const box=$('#opts');box.innerHTML='';
  opts.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="k">'+(k+1)+'</span>';const s=document.createElement('span');s.textContent=o;b.append(s);b.dataset.v=o;b.onclick=()=>answer(b);box.append(b)});
  $('#fb').textContent='';$('#fb').className='feedback';
  resetTimer();
  if(S.mode==='rot'){G.turn=(G.turn+1)%G.groups.length;active=G.turn;renderTurn();enable(true);startTimer()}
  else{active=-1;renderTurn();enable(false)}
  show('sQ');
}
function renderTurn(){
  const t=$('#turn');t.innerHTML='';
  const lab=document.createElement('span');lab.textContent=S.mode==='rot'||active>=0?'دور المجموعة:':'اختر المجموعة التي ستجيب:';t.append(lab);
  G.groups.forEach((g,i)=>{
    if(S.mode==='rot'&&i!==active)return;
    const b=document.createElement('button');b.className='gp'+(i===active?' cur':'')+(S.mode==='pick'&&active<0?' pickable':'');b.textContent=g.n;
    if(i===active){b.style.background=g.c}else{b.style.color='var(--ink)';b.style.borderColor=g.c}
    if(S.mode==='pick'&&active<0){b.onclick=()=>{active=i;renderTurn();enable(true);startTimer()}}else{b.disabled=true;b.style.cursor='default'}
    t.append(b)});
}
function enable(on){document.querySelectorAll('#opts .opt').forEach(b=>b.disabled=!on)}
function pointsAt(sec){
  if(sec<=T)return Math.round(MAXP-(MAXP-HALF)*(sec/T));
  return Math.max(MINP,Math.round(HALF-(HALF-MINP)*((sec-T)/OVER)));
}
const CIRC=326.73;
function resetTimer(){stopTimer();$('#arc').style.strokeDashoffset=0;$('#timer').classList.remove('over');$('#tSec').textContent=T;$('#tLab').textContent='ثانية';$('#ptsNow').textContent=MAXP}
function startTimer(){t0=performance.now();let lastS=-1;
  const step=()=>{const sec=(performance.now()-t0)/1000;
    if(sec<=T){const rem=Math.ceil(T-sec);$('#tSec').textContent=rem;$('#arc').style.strokeDashoffset=CIRC*(sec/T);if(rem<=5&&rem!==lastS&&rem>0){SND.tick();lastS=rem}}
    else{$('#timer').classList.add('over');$('#tSec').textContent='+'+Math.floor(sec-T);$('#tLab').textContent='وقت إضافي';$('#arc').style.strokeDashoffset=CIRC*Math.min(1,(sec-T)/OVER)}
    $('#ptsNow').textContent=pointsAt(sec);
    tmr=requestAnimationFrame(step)};
  tmr=requestAnimationFrame(step)}
function stopTimer(){if(tmr)cancelAnimationFrame(tmr);tmr=null}
function answer(btn){
  if(answered||active<0)return;answered=true;stopTimer();
  const sec=(performance.now()-t0)/1000,q=G.qs[G.i];
  const ok=btn.dataset.v===q.a;
  document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('right');else if(b!==btn)b.classList.add('dim')});
  const g=G.groups[active];
  if(ok){const p=pointsAt(sec);g.s+=p;G.lastWin=active;G.gain=p;$('#fb').textContent='إجابة صحيحة! +'+p+' نقطة لمجموعة '+g.n;$('#fb').className='feedback good';SND.good()}
  else{btn.classList.add('wrong');G.lastWin=-1;G.gain=0;$('#fb').textContent='إجابة غير صحيحة — الإجابة الصحيحة: '+q.a;$('#fb').className='feedback bad';SND.bad()}
  setTimeout(results,ok?1500:2300);
}
$('#reveal').onclick=()=>{if(answered)return;answered=true;stopTimer();const q=G.qs[G.i];
  document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('right');else b.classList.add('dim')});
  G.lastWin=-1;G.gain=0;$('#fb').textContent='الإجابة الصحيحة: '+q.a;$('#fb').className='feedback';setTimeout(results,2000)};
document.addEventListener('keydown',e=>{if(!$('#sQ').classList.contains('on'))return;const k=parseInt(e.key,10);if(k>=1&&k<=4){const b=document.querySelectorAll('#opts .opt')[k-1];if(b&&!b.disabled)answer(b)}});
function ranked(){return G.groups.map((g,i)=>({...g,i})).sort((a,b)=>b.s-a.s||a.i-b.i)}
function results(){
  const last=G.i===G.qs.length-1;
  $('#rTitle').textContent='الترتيب بعد السؤال '+(G.i+1);
  $('#rSub').textContent=G.lastWin>=0?('فازت بالسؤال: '+G.groups[G.lastWin].n):'لم تُحتسب نقاط في هذا السؤال';
  $('#next').textContent=last?'النتيجة النهائية':'السؤال التالي';
  show('sR');drawChart();
}
function drawChart(){
  const ch=$('#chart');const n=G.groups.length;const W=ch.clientWidth||800;const gap=Math.max(10,W*0.03);const cw=Math.min(170,(W-gap*(n+1))/n);
  const max=Math.max(1,...G.groups.map(g=>g.s));const r=ranked();const rankOf={};r.forEach((g,k)=>rankOf[g.i]=k);
  let prev=G.prevOrder||G.groups.map((g,i)=>i);
  if(!ch.children.length||ch.children.length!==n){ch.innerHTML='';G.groups.forEach((g,i)=>{const c=document.createElement('div');c.className='col';c.dataset.i=i;
    c.innerHTML='<div class="crown">👑</div><div class="gain"></div><div class="val">0</div><div class="b"><span class="rk"></span></div><div class="nm"></div>';ch.append(c)});}
  const totalW=n*cw+(n-1)*gap,off=(W-totalW)/2;
  [...ch.children].forEach(c=>{const i=+c.dataset.i,g=G.groups[i];c.style.width=cw+'px';
    const pos=prev.indexOf(i);c.style.right=(off+pos*(cw+gap))+'px';
    c.querySelector('.nm').textContent=g.n;c.querySelector('.b').style.background=g.c;c.classList.toggle('win',i===G.lastWin);
    c.querySelector('.gain').textContent=i===G.lastWin?'+'+G.gain:'';
    const v=c.querySelector('.val');const from=+v.dataset.v||0;countUp(v,from,g.s);v.dataset.v=g.s;
    c.querySelector('.rk').textContent=rankOf[i]+1;
    const H=ch.clientHeight-90;requestAnimationFrame(()=>{c.querySelector('.b').style.height=Math.max(28,H*(g.s/max))+'px'});
  });
  SND.rise();
  const order=r.map(g=>g.i);
  setTimeout(()=>{[...ch.children].forEach(c=>{const i=+c.dataset.i;c.style.right=(off+order.indexOf(i)*(cw+gap))+'px'})},1150);
  G.prevOrder=order;
}
function countUp(el,a,b){const t=performance.now(),d=900;const f=()=>{const k=Math.min(1,(performance.now()-t)/d);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};f()}
$('#next').onclick=()=>{if(G.i>=G.qs.length-1)finish();else nextQ()};
window.addEventListener('resize',()=>{if($('#sR').classList.contains('on'))drawChart()});
function finish(){
  stopTimer();show('sF');
  const r=ranked();$('#fSub').textContent=DATA.lessons[S.L].name+' — '+G.qs.length+' سؤالًا';
  const pod=$('#podium');pod.className='podium';pod.innerHTML='';
  const slots=[1,0,2].filter(k=>k<r.length);const hs={0:'clamp(170px,34vh,300px)',1:'clamp(120px,24vh,220px)',2:'clamp(90px,17vh,160px)'};
  slots.forEach(k=>{const g=r[k];const d=document.createElement('div');d.className='pod';
    d.innerHTML='<div class="who"></div><div class="sc"></div><div class="blk"></div>';
    d.querySelector('.who').textContent=(k===0?'🏆 ':'')+g.n;d.querySelector('.sc').textContent=g.s+' نقطة';
    const blk=d.querySelector('.blk');blk.style.background=g.c;blk.textContent=k+1;pod.append(d);
    setTimeout(()=>{blk.style.height=hs[k]},120+(2-k)*350)});
  setTimeout(()=>pod.classList.add('show'),1300);
  const rest=$('#rest');rest.innerHTML='';r.slice(3).forEach((g,k)=>{const s=document.createElement('span');s.textContent=(k+4)+'. '+g.n+' — '+g.s;rest.append(s)});
  SND.win();confetti();
}
function confetti(){const c=$('#conf');c.innerHTML='';const cols=['#7fb7be','#f0b37e','#9fc58c','#b6a3dc','#ef9fae','#8eb1e6','#f3d88a'];
  for(let i=0;i<70;i++){const e=document.createElement('i');const s=6+Math.random()*10;e.style.width=e.style.height=s+'px';e.style.left=Math.random()*100+'vw';e.style.background=cols[i%cols.length];e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.animationDuration=(5+Math.random()*5)+'s';e.style.animationDelay=(Math.random()*2.5)+'s';c.append(e)}}
function clearConf(){$('#conf').innerHTML=''}
</script>
