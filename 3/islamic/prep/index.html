لم زمريًا وجماعيًا مع تصويب النطق، ويقوم التلميذ بالإنصات ثم الترديد بصوت واضح (14 دقيقة)\nالاستراتيجيات: العرض والمناقشة.\n\n4. الاستماع إلى تلاوة فردية من بعض الطلبة وتصويبها، ويقوم التلميذ بالتلاوة الفردية ومتابعة الزملاء (8 دقائق)\nالاستراتيجيات: الترديد الزمري.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 2: التلاوة والحفظ وتطبيق الغنة ومعاني المفردات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. عرض تلاوة الآيات (11–20) والترديد، والتنبيه على الغنة في ﴿ثُمَّ كَانَ مِنَ الَّذِينَ آمَنُوا﴾ بمقدار حركتين، ويقوم التلميذ بالترديد وتطبيق الغنة (10 دقائق)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n3. عنصر «أكتشف المعنى»: لعبة مطابقة بطاقات المفردات بمعانيها (كبد، النجدين، مسغبة، متربة، مؤصدة)، ويقوم التلميذ بالمطابقة والقراءة (12 دقيقة)\nالاستراتيجيات: المسابقات التنافسية.\n\n4. تسميع فردي لما حفظه الطلبة مع التصويب، والتلميذ: التسميع (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: المعنى الإجمالي والدروس المستفادة من سورة البلد — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: العرض والمناقشة.\n\n2. عنصر «أتدبر وأستنتج»: مناقشة المعنى الإجمالي للسورة مقطعًا مقطعًا، ويقوم التلميذ بالتدبر والاستنتاج (11 دقيقة)\nالاستراتيجيات: الترديد الزمري.\n\n3. تكليف المجموعات باستخراج صور الأعمال الصالحة (عتق الرقبة، إطعام اليتيم والمسكين، التواصي بالصبر والمرحمة) واقتراح تطبيق لكل منها اليوم، ويقوم التلميذ بالاستخراج والاقتراح (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. عنصر «علمتني سورة البلد» و«أختبر تعلمي»، والتلميذ: كتابة ما تعلموه وحل الأنشطة (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: فكر-زاوج-شارك.\n\nالحصة 4: تطبيقات «أختبر تعلمي» على سورة البلد ومسابقة الدرس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n2. توجيه الطلبة لحل أنشطة «أختبر تعلمي» فرديًا ثم مناقشتها، ويقوم التلميذ بالحل الفردي والمناقشة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يقوم التلميذ بالمنافسة والإجابة خلال الوقت (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. كتابة «عمل صالح من السورة سأفعله هذا الأسبوع» في بطاقة، ويقوم التلميذ بالكتابة والمشاركة (7 دقائق)\nالاستراتيجيات: العرض والمناقشة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: الترديد الزمري.", "الحصة 1: أتعرف السورة والتلاوة النموذجية والترديد\n1) [مستوى المعرفة] سورة البلد سورة:\nالإجابة النموذجية: مكية\n2) [مستوى التطبيق] عدد آيات سورة البلد:\nالإجابة النموذجية: عشرون آية\n3) [مستوى الاستدلال] سميت السورة بالبلد لأن الله أقسم فيها بـ:\nالإجابة النموذجية: البلد الحرام مكة\n\nالحصة 2: التلاوة والحفظ وتطبيق الغنة ومعاني المفردات\n1) [مستوى المعرفة] معنى (كبد) في ﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ﴾:\nالإجابة النموذجية: مشقة وتعب\n2) [مستوى التطبيق] معنى (النجدين):\nالإجابة النموذجية: طريقا الخير والشر\n3) [مستوى الاستدلال] صواب أم خطأ: الغنة صوت يخرج من الأنف.\nالإجابة النموذجية: صواب\n\nالحصة 3: المعنى الإجمالي والدروس المستفادة من سورة البلد\n1) [مستوى المعرفة] من نعم الله على الإنسان في السورة:\nالإجابة النموذجية: العينان واللسان والشفتان\n2) [مستوى التطبيق] من الأعمال الصالحة في السورة:\nالإجابة النموذجية: إطعام اليتيم والمسكين\n3) [مستوى الاستدلال] صواب أم خطأ: أصحاب الميمنة هم المؤمنون الذين يتواصون بالصبر والمرحمة.\nالإجابة النموذجية: صواب\n\nالحصة 4: تطبيقات «أختبر تعلمي» على سورة البلد ومسابقة الدرس\n1) [مستوى المعرفة] سورة البلد ترتيبها في المصحف:\nالإجابة النموذجية: التسعون\n2) [مستوى التطبيق] صواب أم خطأ: ﴿فَكُّ رَقَبَةٍ﴾ تعني إعتاق العبد وتحريره.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] ﴿يَتِيمًا ذَا مَقْرَبَةٍ﴾ تعني يتيمًا:\nالإجابة النموذجية: قريبًا في النسب\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم المصحف مع التلميذ على سورة البلد، ويعدّ معه آياتها العشرين، ويبيّن أن الله أقسم فيها بالبلد الحرام مكة، ثم يسأله: لماذا سميت السورة بالبلد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة تعريف بسورة البلد (اسمها، عدد آياتها 20، ترتيبها 90، مكية)، واستخراج مواضع الغنة من الآيات (1–10) وقراءتها.", "الحصة 1: أتعرف السورة والتلاوة النموذجية والترديد\n1) [مستوى المعرفة] ترتيب سورة البلد في المصحف:\nالإجابة النموذجية: التسعون\n2) [مستوى التطبيق] صواب أم خطأ: سورة البلد في الجزء الثلاثين.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من آداب التلاوة:\nالإجابة النموذجية: الإنصات والخشوع وحسن الجلسة\n\nالحصة 2: التلاوة والحفظ وتطبيق الغنة ومعاني المفردات\n1) [مستوى المعرفة] معنى (مسغبة):\nالإجابة النموذجية: مجاعة\n2) [مستوى التطبيق] الغنة في كلمة:\nالإجابة النموذجية: ثُمَّ\n3) [مستوى الاستدلال] معنى (مؤصدة):\nالإجابة النموذجية: مغلقة\n\nالحصة 3: المعنى الإجمالي والدروس المستفادة من سورة البلد\n1) [مستوى المعرفة] معنى ﴿وَتَوَاصَوْا بِالْمَرْحَمَةِ﴾:\nالإجابة النموذجية: أوصى بعضهم بعضًا بالرحمة\n2) [مستوى التطبيق] كيف أطبق ما تعلمته من السورة اليوم؟\nالإجابة النموذجية: أطعم محتاجًا أو أساعد يتيمًا\n3) [مستوى الاستدلال] صواب أم خطأ: الإنسان مخلوق في راحة دائمة بلا تعب.\nالإجابة النموذجية: خطأ\n\nالحصة 4: تطبيقات «أختبر تعلمي» على سورة البلد ومسابقة الدرس\n1) [مستوى المعرفة] الأعمال الصالحة في السورة تسمى:\nالإجابة النموذجية: اقتحام العقبة\n2) [مستوى التطبيق] صواب أم خطأ: نطبق الغنة في ﴿ثُمَّ﴾ بمقدار حركتين.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] عمل صالح من السورة أستطيع فعله:\nالإجابة النموذجية: إطعام محتاج", "الحصة 1: أتعرف السورة والتلاوة النموذجية والترديد\nإرشاد للطالب: ردد مع أسرتك الآيات (1–1 (5 دقائق)\nالاستراتيجيات: القصة.", "الحصة 1: قراءة حديث أركان الإيمان وفهم معانيه\n1) [مستوى المعرفة] عدد أركان الإيمان:\nالإجابة النموذجية: ستة\n2) [مستوى التطبيق] الركن الأول من أركان الإيمان:\nالإجابة النموذجية: الإيمان بالله\n3) [مستوى الاستدلال] صواب أم خطأ: من أركان الإيمان الإيمان بالملائكة.\nالإجابة النموذجية: صواب\n\nالحصة 2: حفظ الحديث وتوضيح مفهوم كل ركن\n1) [مستوى المعرفة] أكمل: الإيمان أن تؤمن بالله و......\nالإجابة النموذجية: ملائكته\n2) [مستوى التطبيق] صواب أم خطأ: الإيمان بالرسل يعني التصديق بأن الله أرسلهم لهداية الناس.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الإيمان باليوم الآخر يعني:\nالإجابة النموذجية: التصديق بيوم القيامة والحساب\n\nالحصة 3: مواقف تدل على الإيمان بكل ركن\n1) [مستوى المعرفة] أصبر عند المرض وأقول الحمد لله، فهذا يدل على الإيمان بـ:\nالإجابة النموذجية: القدر خيره وشره\n2) [مستوى التطبيق] أحرص على قراءة القرآن والعمل به، فهذا يدل على الإيمان بـ:\nالإجابة النموذجية: الكتب\n3) [مستوى الاستدلال] صواب أم خطأ: أتكلم بالخير لأن الملائكة تكتب أعمالي.\nالإجابة النموذجية: صواب\n\nالحصة 4: مراجعة درس أركان الإيمان ومسابقة المجموعات\n1) [مستوى المعرفة] الركن الذي يعني التصديق بالكتب السماوية:\nالإجابة النموذجية: الإيمان بالكتب\n2) [مستوى التطبيق] صواب أم خطأ: الإيمان بالكتب من أركان الإيمان.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أكمل: ...... ورسله واليوم الآخر\nالإجابة النموذجية: وكتبه\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم أركان الإيمان الستة على ست بطاقات ملونة، ويرددها مع التلميذ بترتيب الحديث ثم يخلطها ويرتبها معه، ثم يسأله: ما الركن الأول من أركان الإيمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد مخطط لأركان الإيمان الستة يكتبون تحت كل ركن جملة توضح معناه، والمقارنة بين أركان الإيمان وأركان الإسلام في العدد.", "الحصة 1: قراءة حديث أركان الإيمان وفهم معانيه\n1) [مستوى المعرفة] من أركان الإيمان:\nالإجابة النموذجية: الإيمان بالقدر خيره وشره\n2) [مستوى التطبيق] صواب أم خطأ: الإيمان باليوم الآخر من أركان الإيمان.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الكتب التي نؤمن بها:\nالإجابة النموذجية: الكتب التي  دقائق)\n\nالحصة 4: مراجعة درس آمنت بالله (1) ومسابقة المجموعات\nإعادة سرد قصة إبراهيم عليه السلام مع الملك بلسان أحد الطلبة. (الزمن: 4 دقائق)", "الحصة 1: دلائل وجود الله تعالى في الكون — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. قيادة الطلبة لاستنتاج أن لكل مصنوع صانعًا (القلم له صانع، فكيف بالكون؟)، ويقوم التلميذ بالاستنتاج بأمثلة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تكليف المجموعات باستخراج دلائل قدرة الله من صور الكتاب، ويقوم التلميذ بالاستخراج والعرض (12 دقيقة)\nالاستراتيجيات: التأمل.\n\n4. التأمل الصامت دقيقة في نعمة من نعم الله ثم التعبير عنها، ويقوم التلميذ بالتعبير بجملة شكر (8 دقائق)\nالاستراتيجيات: العرض والمناقشة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\nالحصة 2: قصة سيدنا إبراهيم عليه السلام مع الملك والإيمان بالله وحده — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: القصة.\n\n2. سرد قصة إبراهيم عليه السلام مع الملك كما وردت في القرآن الكريم ﴿فَإِنَّ اللَّهَ يَأْتِي بِالشَّمْسِ مِنَ الْمَشْرِقِ فَأْتِ بِهَا مِنَ الْمَغْرِبِ﴾، ويقوم التلميذ بالاستماع ثم إعادة سرد القصة (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. تمثيل الحوار بين إبراهيم عليه السلام والملك واستخلاص العبرة، ويقوم التلميذ بالتمثيل والاستنتاج (12 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. حل «أختبر تعلمي» ومناقشة الأسئلة المدرجة بعد القصة، والتلميذ: الحل (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\nالحصة 3: نشاط «أتأمل في خلق الله» — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. توجيه الطلبة لرصد ثلاثة مظاهر لقدرة الله، ويقوم التلميذ بالرصد والتدوين (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تكليف المجموعات بإنتاج لوحة «سبحان الخالق» بالرسم والجمل، والتلميذ: الإنتاج (13 دقيقة)\nالاستراتيجيات: التأمل.\n\n4. عرض اللوحات، والتلميذ: العرض (7 دقائق)\nالاستراتيجيات: العرض والمناقشة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\nالحصة 4: مراجعة درس آمنت بالله (1) ومسابقة المجموعات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: القصة.\n\n2. أسئلة مراجعة سريعة عن دلائل وجود الله وقصة إبراهيم عليه السلام، ويقوم التلميذ بالإجابة الشفهية (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص آمنت بالله (1)، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. حل «أختبر تعلمي» ومناقشة الإجابات، ويقوم التلميذ بالحل والتصويب (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.", "الحصة 1: دلائل وجود الله تعالى في الكون\n1) [مستوى المعرفة] من الأدلة على وجود الله:\nالإجابة النموذجية: خلق السماوات والأرض\n2) [مستوى التطبيق] صواب أم خطأ: كل مصنوع لا بد له من صانع.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الذي خلق الشمس والقمر:\nالإجابة النموذجية: الله تعالى\n\nالحصة 2: قصة سيدنا إبراهيم عليه السلام مع الملك والإيمان بالله وحده\n1) [مستوى المعرفة] النبي الذي حاور الملك عن قدرة الله:\nالإجابة النموذجية: إبراهيم عليه السلام\n2) [مستوى التطبيق] طلب إبراهيم من الملك أن يأتي بالشمس من:\nالإجابة النموذجية: المغرب\n3) [مستوى الاستدلال] صواب أم خطأ: عجز الملك عن الإتيان بالشمس من المغرب.\nالإجابة النموذجية: صواب\n\nالحصة 3: نشاط «أتأمل في خلق الله»\n1) [مستوى المعرفة] من مظاهر قدرة الله في بيئتنا العمانية:\nالإجابة النموذجية: الجبال والنخيل والبحر\n2) [مستوى التطبيق] صواب أم خطأ: نقول «سبحان الله» عند التأمل في خلقه.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الذي أنبت النخيل:\nالإجابة النموذجية: الله تعالى\n\nالحصة 4: مراجعة درس آمنت بالله (1) ومسابقة المجموعات\n1) [مستوى المعرفة] الدليل على وجود الله:\nالإجابة النموذجية: خلق الكون بنظام دقيق\n2) [مستوى التطبيق] صواب أم خطأ: عجز الملك أمام حجة إبراهيم عليه السلام.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] نؤمن بالله:\nالإجابة النموذجية: وحده لا شريك له\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ صورًا للشمس والقمر والسماء ومصنوعًا كالكرسي، ويبيّن أن كل مصنوع له صانع، ثم يسأله: من الذي خلق الشمس والقمر؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة سرد قصة سيدنا إبراهيم عليه السلام مع الملك بأسلوبهم، واستنتاج كيف تدل الشمس على أن الله وحده المتصرف في الكون.", "الحصة 1: دلائل وجود الله تعالى في الكون\n1) [مستوى المعرفة] نشكر الله على نعمه بـ:\nالإجابة النموذجية: طاعته واستعمال النعم في الخير\n2) [مستوى التطبيق] صواب أم خطأ: التأمل في الكون يزيد الإيمان.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أي جملة تدل على التفكر؟\nالإجابة النموذجية: سبحان الذي خلق النحلة وعلمها صنع العسل.\n\nالحصة 2: قصة سيدنا إبراهيم عليه السلام مع الملك والإيمان بالله وحده\n1) [مستوى المعرفة] نستنتج من القصة أن:\nالإجابة النموذجية: الله وحده المتصرف في الكون\n2) [مستوى التطبيق] صواب أم خطأ: دعا إبراهيم عليه السلام إلى عبادة الله وحده.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] كيف حاور إبراهيم الملك؟\nالإجابة النموذجية: بالحجة والدليل\n\nالحصة 3: نشاط «أتأمل في خلق الله»\n1) [مستوى المعرفة] نشكر الله على نعمة الماء بـ:\nالإجابة النموذجية: عدم الإسراف فيه\n2) [مستوى التطبيق] صواب أم خطأ: التأمل في خلق الله يقوي الإيمان.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أي جملة تأملية؟\nالإجابة النموذجية: سبحان من رفع الجبال وثبتها!\n\nالحصة 4: مراجعة درس آمنت بالله (1) ومسابقة المجموعات\n1) [مستوى المعرفة] الذي يأتي بالشمس من المشرق:\nالإجابة ال عل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n2. عنصر «أطبق أحكام التجويد»: التنبيه على الغنة في النون المشددة ﴿إِنَّ رَبَّكَ لَبِالْمِرْصَادِ﴾ بمقدار حركتين وترديدها، ويقوم التلميذ بالترديد وتطبيق الغنة (10 دقائق)\nالاستراتيجيات: القصة.\n\n3. عنصر «أكتشف المعنى»: مطابقة المفردات بمعانيها (حجر: عقل، جابوا الصخر: قطعوه، ذي الأوتاد: فرعون)، والتلميذ: المطابقة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. تسميع فردي مع التصويب، والتلميذ: التسميع (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: الترديد الزمري.\n\nالحصة 3: المعنى الإجمالي للآيات (1–14) والعبرة من الأقوام السابقة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: العرض والمناقشة.\n\n2. عرض مختصر لقصص عاد وثمود وفرعون كما في الآيات، ويقوم التلميذ بالاستماع والمتابعة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. فكر-زاوج-شارك: ما العبرة من ذكر هذه الأقوام؟ ويقوم التلميذ بالاستنتاج والمشاركة (12 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n4. حل «أختبر تعلمي»، والتلميذ: الحل (8 دقائق)\nالاستراتيجيات: القصة.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "الحصة 1: أتعرف سورة الفجر والتلاوة النموذجية للآيات (1–14)\n1) [مستوى المعرفة] سورة الفجر سورة:\nالإجابة النموذجية: مكية\n2) [مستوى التطبيق] عدد آيات سورة الفجر:\nالإجابة النموذجية: ثلاثون آية\n3) [مستوى الاستدلال] أقسم الله في بداية السورة بـ:\nالإجابة النموذجية: الفجر\n\nالحصة 2: التلاوة والحفظ وتطبيق الغنة في النون المشددة ومعاني المفردات\n1) [مستوى المعرفة] الغنة في كلمة:\nالإجابة النموذجية: إنَّ\n2) [مستوى التطبيق] معنى (لذي حجر):\nالإجابة النموذجية: لصاحب عقل\n3) [مستوى الاستدلال] صواب أم خطأ: نطبق الغنة في النون المشددة بمقدار حركتين.\nالإجابة النموذجية اوة والحفظ: سورة الفجر (الآيات 1–16)، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. تكريم المتقنين، والتلميذ: التهنئة (8 دقائق)\nالاستراتيجيات: التعلم بالأقران.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "الحصة 1: تلاوة وحفظ سورة الفجر: الآيات (1–5)\n1) [مستوى المعرفة] أكمل: ﴿وَالْفَجْرِ * وَلَيَالٍ ......﴾\nالإجابة النموذجية: عَشْرٍ\n2) [مستوى التطبيق] أكمل: ﴿وَالشَّفْعِ وَ......﴾\nالإجابة النموذجية: الْوَتْرِ\n3) [مستوى الاستدلال] صواب أم خطأ: سورة الفجر تبدأ بالقسم.\nالإجابة النموذجية: صواب\n\nالحصة 2: تلاوة وحفظ سورة الفجر: الآيات (6–10)\n1) [مستوى المعرفة] أكمل: ﴿أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ ......﴾\nالإجابة النموذجية: بِعَادٍ\n2) [مستوى التطبيق] أكمل: ﴿إِرَمَ ذَاتِ ......﴾\nالإجابة النموذجية: الْعِمَادِ\n3) [مستوى الاستدلال] صواب أم خطأ: في كلمة ﴿الْبِلَادِ﴾ مد طبيعي.\nالإجابة النموذجية: صواب\n\nالحصة 3: تلاوة وحفظ سورة الفجر: الآيات (11–14) وتطبيق الغنة\n1) [مستوى المعرفة] أكمل: ﴿الَّذِينَ طَغَوْا فِي ......﴾\nالإجابة النموذجية: الْبِلَادِ\n2) [مستوى التطبيق] أكمل: ﴿فَأَكْثَرُوا فِيهَا ......﴾\nالإجابة النموذجية: الْفَسَادَ\n3) [مستوى الاستدلال] صواب أم خطأ: في ﴿إِنَّ﴾ غنة.\nالإجابة النموذجية: صواب\n\nالحصة 4: تلاوة وحفظ سورة الفجر: الآيات (15–16)\n1) [مستوى المعرفة] أكمل: ﴿فَيَقُولُ رَبِّي ......﴾ بعد أن أكرمه ربه\nالإجابة النموذجية: أَكْرَمَنِ\n2) [مستوى التطبيق] صواب أم خطأ: في ﴿فَأَمَّا﴾ ميم مشددة فيها غنة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الآية (16) تتحدث عن الإنسان إذا:\nالإجابة النموذجية: ضُيّق عليه رزقه\n\nالحصة 5: مراجعة وتثبيت حفظ سورة الفجر: الآيات (1–8)\n1) [مستوى المعرفة] الآية الثانية في سورة الفجر:\nالإجابة النموذجية: وَلَيَالٍ عَشْرٍ\n2) [مستوى التطبيق] صواب أم خطأ: نثبت الحفظ بالمراجعة المستمرة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أكمل: ﴿الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي ......﴾\nالإجابة النموذجية: الْبِلَادِ\n\nالحصة 6: مراجعة وتثبيت ح ذ: الحل (10 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n3. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الأمر بالصلاة (حديث شريف)، ويبدأ المعلم بسؤال «الحديث موجه إلى:» (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. مناقشة الأخطاء الشائعة، والتلميذ: التصويب (8 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: العرض والمناقشة.", "الحصة 1: قراءة حديث الأمر بالصلاة وفهم معانيه\n1) [مستوى المعرفة] يؤمر الطفل بالصلاة وهو ابن:\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] معنى (مروا):\nالإجابة النموذجية: اطلبوا منهم ووجهوهم\n3) [مستوى الاستدلال] صواب أم خطأ: الحديث يحث الآباء على تعليم أبنائهم الصلاة.\nالإجابة النموذجية: صواب\n\nالحصة 2: الحكمة من التدرج في الأمر بالصلاة وحفظ الحديث\n1) [مستوى المعرفة] الحكمة من الفترة بين السابعة والعاشرة:\nالإجابة النموذجية: التعويد التدريجي على الصلاة\n2) [مستوى التطبيق] صواب أم خطأ: التدرج يساعد الطفل على حب الصلاة والالتزام بها.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] عدد السنوات بين الأمر بالصلاة والتأديب عليها:\nالإجابة النموذجية: ثلاث سنوات\n\nالحصة 3: تطبيق: جدول صلاتي الأسبوعي\n1) [مستوى المعرفة] عدد الصلوات التي أتابعها يوميًا في الجدول:\nالإجابة النموذجية: خمس\n2) [مستوى التطبيق] صواب أم خطأ: الجدول يساعدني على المحافظة على الصلاة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الصلاة التي غالبًا ما تكون في وقت المدرسة:\nالإجابة النموذجية: الظهر\n\nالحصة 4: أعلّم أخي الصغير الصلاة (تمثيل ونمذجة)\n1) [مستوى المعرفة] أعلّم أخي الصغير الصلاة بـ:\nالإجابة النموذجية: الرفق والقدوة\n2) [مستوى التطبيق] صواب أم خطأ: الوضوء قبل الصلاة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] نتجه في الصلاة إلى:\nالإجابة النموذجية: القبلة (الكعبة)\n\nالحصة 5: مسابقة حفظ حديث الأمر بالصلاة وشرحه\n1) [مستوى المعرفة] أكمل: مروا أولادكم ......\nالإجابة النموذجية: بالصلاة\n2) [مستوى التطبيق] صواب أم خطأ: يذكر الحديث سن العاشرة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الحديث موجه إلى:\nالإجابة النموذجية: الآباء والأمهات\n\nالحصة 6: مراجعة درس الأمر بالصلاة ومسابقة المجموعات\n1) [مستوى المعرفة] سن الأمر بالصلاة:\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] صواب أم خطأ: الصلاة عبادة يتعلمها الطفل مبكرًا.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الفترة بين الأمر والتأديب:\nالإجابة النموذجية: ثلاث سنوات\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ حديث الأمر بالصلاة جملةً جملة، ويكتب معه الرقم 7 ويربطه بعمر بدء الأمر بالصلاة، ويشرح معنى «مروا»، ثم يسأله: متى يؤمر الطفل بالصلاة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتفسير الحكمة من البدء بالصلاة في سن السابعة، وإعداد بطاقة نصيحة لأخ صغير يشجعونه فيها على الصلاة بأسلوب لطيف.", "الحصة 1: قراءة حديث الأمر بالصلاة وفهم معانيه\n1) [مستوى المعرفة] معنى (المضاجع):\nالإجابة النموذجية: أماكن النوم\n2) [مستوى التطبيق] صواب أم خطأ: الحديث موجه إلى الآباء والأمهات.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من يأمر الطفل بالصلاة؟\nالإجابة النموذجية: والداه\n\nالحصة 2: الحكمة من التدرج في الأمر بالصلاة وحفظ الحديث\n1) [مستوى المعرفة] أكمل: مُروا أولادكم بالصلاة وهم أبناء ......\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] صواب أم خطأ: نحفظ الحديث مع فهم معناه.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أي سلوك يدل على تطبيق الحديث؟\nالإجابة النموذجية: أحافظ على صلاتي وأشجع إخوتي\n\nالحصة 3: تطبيق: جدول صلاتي الأسبوعي\n1) [مستوى المعرفة] من يساعدني في متابعة جدول صلاتي؟\nالإجابة النموذجية: والداي\n2) [مستوى التطبيق] صواب أم خطأ: أؤخر الصلاة لأكمل اللعب.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] أي هدف مناسب في الجدول؟\nالإجابة النموذجية: أصلي الصلوات الخمس في وقتها هذا الأسبوع\n\nالحصة 4: أعلّم أخي الصغير الصلاة (تمثيل ونمذجة)\n1) [مستوى المعرفة] أول خطوات الاستعداد للصلاة:\nالإجابة النموذجية: الوضوء\n2) [مستوى التطبيق] صواب أم خطأ: القدوة الحسنة من أفضل طرق التعليم.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] إذا أخطأ أخي في الصلاة فإنني:\nالإجابة النموذجية: أصحح له بلطف\n\nالحصة 5: مسابقة حفظ حديث الأمر بالصلاة وشرحه\n1) [مستوى المعرفة] بماذا أمر الحديث مي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 4: مراجعة درس آمنت بالله (2) ومسابقة المجموعات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. أسئلة مراجعة سريعة عن مفهوم الإيمان وعلاقته بالعمل، ويقوم التلميذ بالإجابة وذكر الأمثلة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. بطاقة الخروج: يكتب كل تلميذ على بطاقة إجابة سؤال «صواب أم خطأ: الله قادر على كل شيء» وفكرة واحدة تعلّمها اليوم، ويسلّمها للمعلم قبل الخروج (13 دقيقة)\nالاستراتيجيات: التقويم البنائي.\n\n4. حل «أختبر تعلمي» وربط الإجابات بشجرة الأعمال الصالحة، ويقوم التلميذ بالحل والربط (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "الحصة 1: مفهوم الإيمان بالله تعالى ومظاهره\n1) [مستوى المعرفة] الإيمان بالله يعني:\nالإجابة النموذجية: التصديق بوجوده ووحدانيته والعمل بطاعته\n2) [مستوى التطبيق] صواب أم خطأ: الله قادر على كل شيء.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الآية ﴿كُن فَيَكُونُ﴾ تدل على:\nالإجابة النموذجية: عظيم قدرة الله\n\nالحصة 2: العلاقة بين الإيمان والعمل الصالح\n1) [مستوى المعرفة] من أعمال المؤمن:\nالإجابة النموذجية: الصدق والأمانة\n2) [مستوى التطبيق] صواب أم خطأ: الإيمان يظهر في سلوك الإنسان.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] وجد خالد محفظة في الساحة، تصرفه المؤمن:\nالإجابة النموذجية: يسلمها للمعلم ليردها لصاحبها\n\nالحصة 3: مشروع «شجرة أعمالي الصالحة»\n1) [مستوى المعرفة] صواب أم خطأ: العمل الصالح ثمرة الإيمان.\nالإجابة النموذجية: صواب\n2) [مستوى التطبيق] ورقة مناسبة للشجرة:\nالإجابة النموذجية: ساعدت جدتي في حمل أغراضها\n3) [مستوى الاستدلال] المداومة على العمل الصالح تعني:\nالإجابة النموذجية: الاستمرار عليه ولو كان قليلًا\n\nالحصة 4: مراجعة درس آمنت بالله (2) ومسابقة ة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. مناقشة دور السيدة خديجة: الإيمان المبكر، المساندة بالمال، الطمأنة، الصبر في الشدائد، ويقوم التلميذ بالإجابة والتوضيح (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. فكر-زاوج-شارك: كيف أقتدي بها في حياتي؟ ويقوم التلميذ بالاستنتاج والمشاركة (12 دقيقة)\nالاستراتيجيات: المسابقات التنافسية.\n\n4. حل «أختبر تعلمي» والعبارة الختامية على لسان مريم، ويقوم التلميذ بالحل والقراءة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: القصة.\n\nالحصة 3: مواقف من حياة السيدة خديجة رضي الله عنها (قصة مصورة) — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: العرض والمناقشة.\n\n2. توزيع مواقف (التجارة، الزواج، طمأنة النبي ﷺ، الذهاب إلى ورقة، الإنفاق في الدعوة)، ويقوم التلميذ بالقراءة والترتيب (10 دقائق)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n3. تكليف المجموعات برسم قصة مصورة قصيرة لموقف مع جملة قيمة، ويقوم التلميذ بالرسم والكتابة (13 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n4. عرض القصص المصورة، والتلميذ: العرض (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\nالحصة 4: مراجعة درس إسلام السيدة خديجة ومسابقة المجموعات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n2. أسئلة مراجعة سريعة عن إسلام السيدة خديجة ومواقفها، ويقوم التلميذ بالإجابة وإعادة السرد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن إسلام السيدة خديجة رضي الله عنها، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (1 تواصل مع الغرباء وعبر الأجهزة — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. عرض القصة بأسلوب تمثيل الأدوار ومناقشة المخاطر الواردة فيها، ويقوم التلميذ بالاستماع والتمثيل (11 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n3. مناقشة قوله تعالى ﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾ دليلًا على وجوب حماية النفس، والتلميذ: الاستنتاج (12 دقيقة)\nالاستراتيجيات: القصة.\n\n4. تصنيف مواقف إلى آمنة وخطرة، والتلميذ: التصنيف (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\nالحصة 2: التدابير الوقائية لحماية النفس — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n2. مناقشة التدابير: عدم مشاركة المعلومات، عدم الذهاب مع الغريب، إخبار الوالدين، الاستئذان قبل استخدام الأجهزة، ويقوم التلميذ بالإجابة والتوضيح (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. لعب أدوار لمواقف ورفض الطلب الخطر بثقة (لا، سأخبر أمي)، والتلميذ: التمثيل (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n4. كتابة «قواعد سلامتي» في بطاقة، والتلميذ: الكتابة (8 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\nالحصة 3: مشروع ملصق «أحمي نفسي» — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: لعب الأدوار.\n\n2. تحديد عناصر الملصق (عنوان، صورة، نصيحة قصيرة)، والتلميذ: التخطيط (10 دقائق)\nالاستراتيجيات: القصة.\n\n3. تصميم الملصقات في المجموعات، والتلميذ: التصميم (14 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. عرض الملصقات وتعليقها في ممر المدرسة، والتلميذ: العرض (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات — زمن الحصة 40 دقيقة\n\n1. التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. توجيه الطلبة لإكمال صفحة «ألخص معارفي»، والتلميذ: الإكمال (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. أكمل الفكرة: يبدأ المعلم جملة عن أحمي نفسي، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. استخلاص قيم الوحدة وكتابتها على السبورة، والتلميذ: المشاركة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "الحصة 1: مخاطر التواصل مع الغرباء وعبر الأجهزة\n1) [مستوى المعرفة] إذا طلب غريب عنوان بيتي عبر الجهاز فإنني:\nالإجابة النموذجية: أرفض وأخبر والديّ\n2) [مستوى التطبيق] صواب أم خطأ: حماية النفس واجب على المسلم.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الدليل على وجوب حماية النفس:\nالإجابة النموذجية: ﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾\n\nالحصة 2: التدابير الوقائية لحماية النفس\n1) [مستوى المعرفة] إذا عرض غريب توصيلي إلى البيت فإنني:\nالإجابة النموذجية: أرفض وأبتعد وأخبر والديّ\n2) [مستوى التطبيق] صواب أم خطأ: أخبر والديّ بأي موقف يزعجني.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من التدابير الوقائية:\nالإجابة النموذجية: الاستئذان قبل استخدام الإنترنت\n\nالحصة 3: مشروع ملصق «أحمي نفسي»\n1) [مستوى المعرفة] عناصر الملصق الإرشادي:\nالإجابة النموذجية: عنوان وصورة ونصيحة\n2) [مستوى التطبيق] صواب أم خطأ: الملصق الجيد واضح ومختصر.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] عبارة مناسبة للملصق:\nالإجابة النموذجية: لا تشارك معلوماتك مع الغرباء\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات\n1) [مستوى المعرفة] من قيم الوحدة الثانية:\nالإجابة النموذجية: المحافظة على الصلاة وحماية النفس\n2) [مستوى التطبيق] صواب أم خطأ: حماية النفس من مقاصد الإسلام.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من دروس الوحدة الثانية:\nالإجابة النموذجية: صلاة الجماعة\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ موقف غريب يطلب عنوان البيت عبر الجهاز، ويدرّبه على الرفض وإخبار والديه، ثم يسأله: ماذا تفعل إذا طلب غريب عنوان بيتك؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ملصق «قواعد حماية نفسي» يتضمن ثلاث قواعد للسلامة مع الغرباء وعبر الأجهزة، وتمثيل موقف يطبقون فيه إحداها.", "الحصة 1: مخاطر التواصل مع الغرباء وعبر الأجهزة\n1) [مستوى المعرفة] من المعلومات التي لا أشاركها مع الغرباء:\nالإجابة النموذجية: عنوان البيت ورقم الهاتف\n2) [مستوى التطبيق] صواب أم خطأ: أركب مع الغريب إذا أعطاني حلوى.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] إذا شعرت بالخوف من موقف فإنني:\nالإجابة النموذجية: أخبر شخصًا أثق به فورًا\n\nالحصة 2: التدابير الوقائية لحماية النفس\n1) [مستوى المعرفة] كلمة أقولها بثقة للطلب الخطر:\nالإجابة النموذجية: لا\n2) [مستوى التطبيق] صواب أم خطأ: أحتفظ بأسرار الغرباء ولا أخبر أحدًا.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] أي معلومة خاصة لا أشاركها؟\nالإجابة النموذجية: كلمة المرور\n\nالحصة 3: مشروع ملصق «أحمي نفسي»\n1) [مستوى المعرفة] هدف الملصق:\nالإجابة النموذجية: توعية الزملاء بحماية أنفسهم\n2) [مستوى التطبيق] صواب أم خطأ: نعلق الملصق في مكان يراه الجميع.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أي صورة تناسب ملصق السلامة؟\nالإجابة النموذجية: طفل يرفض الذهاب مع غريب\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات\n1) [مستوى المعرفة] العمر الذي يؤمر فيه الطفل بالصلاة:\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] صواب أم خطأ: السيدة خديجة أول من آمن بالنبي ﷺ.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] إذا طلب غريب صورتي عبر الهاتف فإنني:\nالإجابة النموذجية: أرفض وأخبر والديّ", "الحصة 1: مخاطر التواصل مع الغرباء وعبر الأجهزة\nإرشاد للطالب: اتفق مع أ ا التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. حل «أختبر تعلمي»، والتلميذ: الحل (8 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.", "الحصة 1: قراءة حديث كفالة اليتيم وفهم مفرداته\n1) [مستوى المعرفة] اليتيم هو:\nالإجابة النموذجية: من مات أبوه وهو صغير\n2) [مستوى التطبيق] كافل اليتيم:\nالإجابة النموذجية: من يرعاه وينفق عليه\n3) [مستوى الاستدلال] صواب أم خطأ: أشار النبي ﷺ بالسبابة والوسطى في الحديث.\nالإجابة النموذجية: صواب\n\nالحصة 2: مكانة كافل اليتيم وحفظ الحديث\n1) [مستوى المعرفة] نال كافل اليتيم مكانة عظيمة لأنه:\nالإجابة النموذجية: يرحم من فقد أباه ويرعاه\n2) [مستوى التطبيق] صواب أم خطأ: كافل اليتيم يكون مع النبي ﷺ في الجنة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أكمل: أنا وكافل اليتيم في ...... هكذا\nالإجابة النموذجية: الجنة\n\nالحصة 3: صور كفالة اليتيم\n1) [مستوى المعرفة] من صور كفالة اليتيم:\nالإجابة النموذجية: الإنفاق عليه ورعايته\n2) [مستوى التطبيق] صواب أم خطأ: الكلمة الطيبة لليتيم من صور الإحسان إليه.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] ما يستطيع الطالب تقديمه لزميله اليتيم:\nالإجابة النموذجية: مساعدته في دروسه ومشاركته اللعب\n\nالحصة 4: مبادرة صفية للإحسان ومراجعة الدرس ومسابقة المجموعات\n1) [مستوى المعرفة] اليتيم من فقد:\nالإجابة النموذجية: أباه وهو صغير\n2) [مستوى التطبيق] صواب أم خطأ: كفالة اليتيم من الأعمال التي تقرب من الجنة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من صور الكفالة:\nالإجابة النموذجية: التعليم والرعاية\n\n• نشاط علاجي (لمن لم يتقن): يردد المعلم مع التلميذ حديث كفالة اليتيم ويشير معه بالسبابة والوسطى كما في الحديث، ويشرح معنى اليتيم وكافله، ثم يسأله: من اليتيم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتفسير دلالة إشارة النبي ﷺ بالسبابة والوسطى على مكانة كافل اليتيم، واقتراح ثلاثة أعمال يحسنون بها إلى الأيتام.", "الحصة 1: قراءة حديث كفالة اليتيم وفهم مفرداته\n1) [مستوى المعرف وسه\n\nالحصة 2: ثمار العطاء وألخص معارفي في الوحدة الرابعة ومسابقة المجموعات\n1) [مستوى المعرفة] من ثمار العطاء:\nالإجابة النموذجية: رضا الله والمحبة بين الناس\n2) [مستوى التطبيق] صواب أم خطأ: العطاء سبب للفوز في الآخرة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من قيم الوحدة الرابعة:\nالإجابة النموذجية: الصبر والعطاء وذكر الله\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ أربع صور للعطاء (المال، الوقت، الجهد، الكلمة الطيبة)، ويمثّل معه الابتسامة كصورة للعطاء، ثم يسأله: ما العطاء؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد خطة «أسبوع العطاء» يختارون فيها صورة عطاء لكل يوم (مال، وقت، جهد، كلمة طيبة)، وذكر ثمرة العطاء على المجتمع.", "الحصة 1: العطاء: مفهومه وصوره\n1) [مستوى المعرفة] من صور العطاء بالمال:\nالإجابة النموذجية: التصدق على المحتاج\n2) [مستوى التطبيق] صواب أم خطأ: العطاء يقتصر على الأغنياء.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] عطاء أستطيع تقديمه في المدرسة:\nالإجابة النموذجية: مساعدة زميل في حمل أغراضه\n\nالحصة 2: ثمار العطاء وألخص معارفي في الوحدة الرابعة ومسابقة المجموعات\n1) [مستوى المعرفة] من دروس الوحدة الرابعة:\nالإجابة النموذجية: السنن الراتبة\n2) [مستوى التطبيق] صواب أم خطأ: سورة الغاشية من دروس الوحدة الرابعة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] صحابي نام في فراش النبي ﷺ ليلة الهجرة:\nالإجابة النموذجية: علي بن أبي طالب", "الحصة 1: العطاء: مفهومه وصوره\nإرشاد للطالب: قدم عطاء لأحد أفراد أسرتك هذا اليوم\nإرشاد لولي الأمر: شجع ابنك على العطاء في البيت.\n\nالحصة 2: ثمار العطاء وألخص معارفي في الوحدة الرابعة ومسابقة المجموعات\nإرشاد للطالب: أكمل «ألخص معارفي» مع أسرتك\nإرشاد لولي الأمر: راجع مع ابنك قيم الوحدة الرابعة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/islamic/?l=27"]}]});
function pc(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
const NAMES=['المخرجات التعليمية','المستوى المعرفي','الاستراتيجيات','المصادر التعليمية','المفاهيم','التهيئة / التمهيد / التعلم القبلي','إجراءات سير الدرس / الأنشطة التدريسية','التقويم التكويني','التقويم الختامي','ملاحظات ضمن خطة الدراسة الأسبوعية'];
let mode='sep', li=0, pi=0;
const $=s=>document.querySelector(s);
$('#ttl').textContent='نسخ حقول نور — '+DATA.subject+' — '+DATA.grade+' — '+DATA.term;
const lsel=$('#lsel');
DATA.lessons.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=L.name+' ('+pc(L.periods.length)+')';lsel.appendChild(o)});
lsel.onchange=()=>{li=+lsel.value;pi=0;render()};
$('#mSep').onclick=()=>{mode='sep';render()};
$('#mComb').onclick=()=>{mode='comb';render()};
function render(){
  const L=DATA.lessons[li];
  $('#mSep').setAttribute('aria-pressed',mode==='sep');$('#mComb').setAttribute('aria-pressed',mode==='comb');
  $('#status').textContent= mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد لكل درس يضم حصصه';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='sep'){
    tabs.style.display='flex';
    L.periods.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===pi);b.textContent='الحصة '+p.n;b.title=p.topic;b.onclick=()=>{pi=i;render()};tabs.appendChild(b)});
    const p=L.periods[pi];
    $('#ctx').innerHTML='';
    const c=$('#ctx');c.append(ctxLine('الدرس: ',L.name+' — الحصة '+p.n+' من '+L.periods.length));c.append(ctxLine('محور الحصة: ',p.topic));if(p.week)c.append(ctxLine('',p.week));
    cards(p.fields);
  }else{
    tabs.style.display='none';
    $('#ctx').innerHTML='';$('#ctx').append(ctxLine('الدرس: ',L.name+' — نموذج واحد يضم '+pc(L.periods.length)));
    cards(L.combined);
  }
}
function ctxLine(b,t){const d=document.createElement('div');if(b){const s=document.createElement('b');s.textContent=b;d.append(s)}d.append(t);return d}
function cards(fields){
  const m=$('#cards');m.innerHTML='';
  fields.forEach((txt,i)=>{
    const card=document.createElement('article');card.className='card';
    const h=document.createElement('h2');const t=document.createElement('span');
    const n=document.createElement('span');n.className='n';n.textContent=i+1;t.append(n,NAMES[i]);
    const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='نسخ';
    h.append(t,b);
    const body=document.createElement('div');body.className='txt';body.textContent=txt;
    const hint=document.createElement('div');hint.className='hint';hint.textContent='منع المتصفح النسخ التلقائي؛ النص محدد الآن، انسخه من قائمة الجهاز (نسخ).';
    b.onclick=()=>copy(txt,b,body,hint);
    card.append(h,body,hint);m.append(card);
  });
}
async function copy(txt,btn,body,hint){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    try{ok=document.execCommand('copy')}catch(e){ok=false}
    document.body.removeChild(ta);
  }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');hint.classList.remove('on');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1800);}
  else{const r=document.createRange();r.selectNodeContents(body);const s=getSelection();s.removeAllRanges();s.addRange(r);hint.classList.add('on');}
}
render();
</script>
