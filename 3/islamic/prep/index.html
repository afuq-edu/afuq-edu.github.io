لم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تلاوة نموذجية للآيات (6–10) مع التنبيه على المد الطبيعي في ﴿وَلِسَانًا﴾ ﴿وَهَدَيْنَاهُ﴾. — الطالب: الترديد ومد الحرف بمقدار حركتين.\n3) من الدقيقة 15 إلى 26: المعلم: الحفظ بالتكرار وربط الآيات بما سبق في مجموعات. — الطالب: التسميع المتصل (1–10).\n4) من الدقيقة 27 إلى 35: المعلم: تسميع فردي والتصحيح بالأقران. — الطالب: التسميع وتصحيح زميل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: تلاوة وحفظ سورة البلد: الآيات (11–16)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تلاوة نموذجية للآيات (11–16) والترديد الزمري. — الطالب: الترديد.\n3) من الدقيقة 15 إلى 26: المعلم: الحفظ بطريقة «الآية والآية التالية» في ثنائيات. — الطالب: التسميع الثنائي.\n4) من الدقيقة 27 إلى 35: المعلم: كتابة الآية ﴿فَكُّ رَقَبَةٍ﴾ وآية أخرى يختارها الطالب من حفظه. — الطالب: الكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: تلاوة وحفظ سورة البلد: الآيات (17–20) وتطبيق الغنة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تلاوة نموذجية للآيات (17–20) والتنبيه على الغنة في ﴿ثُمَّ﴾ و﴿مُّؤْصَدَةٌ﴾. — الطالب: الترديد وتطبيق الغنة.\n3) من الدقيقة 15 إلى 26: المعلم: الحفظ والتسميع في ثنائيات. — الطالب: التسميع.\n4) من الدقيقة 27 إلى 35: المعلم: لعبة «من أين الآية؟»: يتلو المعلم بداية آية ويكملها الطلبة. — الطالب: الإكمال.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: تسميع سورة البلد كاملة وتقويم التلاوة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة وي َيْنِ﴾:\nالإجابة النموذجية: فَلَا اقْتَحَمَ الْعَقَبَةَ", "الحصة 1: تلاوة وحفظ سورة البلد: الآيات (1–5)\n1) [مستوى المعرفة] أكمل: ﴿وَوَالِدٍ وَمَا ......﴾\nالإجابة النموذجية: وَلَدَ\n2) [مستوى التطبيق] صواب أم خطأ: نتلو القرآن ونحن نلعب.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] أكمل: ﴿أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ ......﴾\nالإجابة النموذجية: أَحَدٌ\n\nالحصة 2: تلاوة وحفظ سورة البلد: الآيات (6–10)\n1) [مستوى المعرفة] أكمل: ﴿وَهَدَيْنَاهُ ......﴾\nالإجابة النموذجية: النَّجْدَيْنِ\n2) [مستوى التطبيق] حروف المد:\nالإجابة النموذجية: الألف والواو والياء\n3) [مستوى الاستدلال] صواب أم خطأ: نصحح لزميلنا خطأه في التلاوة بأدب.\nالإجابة النموذجية: صواب\n\nالحصة 3: تلاوة وحفظ سورة البلد: الآيات (11–16)\n1) [مستوى المعرفة] أكمل: ﴿يَتِيمًا ذَا ......﴾\nالإجابة النموذجية: مَقْرَبَةٍ\n2) [مستوى التطبيق] أكمل: ﴿أَوْ مِسْكِينًا ذَا ......﴾\nالإجابة النموذجية: مَتْرَبَةٍ\n3) [مستوى الاستدلال] صواب أم خطأ: ﴿أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ﴾ آية من سورة البلد.\nالإجابة النموذجية: صواب\n\nالحصة 4: تلاوة وحفظ سورة البلد: الآيات (17–20) وتطبيق الغنة\n1) [مستوى المعرفة] أكمل: ﴿عَلَيْهِمْ نَارٌ ......﴾\nالإجابة النموذجية: مُّؤْصَدَةٌ\n2) [مستوى التطبيق] آخر آية في سورة البلد تنتهي بكلمة:\nالإجابة النموذجية: مُّؤْصَدَةٌ\n3) [مستوى الاستدلال] صواب أم خطأ: ﴿وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ﴾ من سورة البلد.\nالإجابة النموذجية: صواب\n\nالحصة 5: تسميع سورة البلد كاملة وتقويم التلاوة\n1) [مستوى المعرفة] الآية التي قبل ﴿فَكُّ رَقَبَةٍ﴾:\nالإجابة النموذجية: وَمَا أَدْرَاكَ مَا الْعَقَبَةُ\n2) [مستوى التطبيق] صواب أم خطأ: من معايير التلاوة صحة نطق الحروف.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أول آية في سورة البلد:\nالإجابة النموذجية: لَا أُقْسِمُ بِهَٰذَا الْبَلَدِ", "الحصة 1: تلاوة وحفظ سورة البلد: الآيات (1–5)\nإرشاد للطالب: سمّع الآيات (1–5) لأسرتك\nإرشاد لولي الأمر: استمع لتلاوة ابنك وصحح له بلطف.\n\nالحصة 2: تلاوة وحفظ سورة البلد: الآيات (6–10)\nإرشاد للطالب: سمّع الآيات (1–10) لأسرتك\nإرشاد لولي الأمر: سمّع لابنك وتابع المد الطبيعي.\n\nالحصة 3: ت : المعلم: عنصر «أتدبر وأستنتج»: مناقشة المعنى الإجمالي للسورة مقطعًا مقطعًا. — الطالب: التدبر والاستنتاج.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف المجموعات باستخراج صور الأعمال الصالحة (عتق الرقبة، إطعام اليتيم والمسكين، التواصي بالصبر والمرحمة) واقتراح تطبيق لكل منها اليوم. — الطالب: الاستخراج والاقتراح.\n4) من الدقيقة 28 إلى 35: المعلم: عنصر «علمتني سورة البلد» و«أختبر تعلمي». — الطالب: كتابة ما تعلموه وحل الأنشطة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: تطبيقات «أختبر تعلمي» على سورة البلد ومسابقة الدرس\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: توجيه الطلبة لحل أنشطة «أختبر تعلمي» فرديًا ثم مناقشتها. — الطالب: الحل الفردي والمناقشة.\n3) من الدقيقة 17 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس سورة البلد. — الطالب: المنافسة والإجابة خلال الوقت.\n4) من الدقيقة 29 إلى 35: المعلم: كتابة «عمل صالح من السورة سأفعله هذا الأسبوع» في بطاقة. — الطالب: الكتابة والمشاركة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أتعرف السورة والتلاوة النموذجية والترديد\n1) [مستوى المعرفة] سورة البلد سورة:\nالإجابة النموذجية: مكية\n2) [مستوى التطبيق] عدد آيات سورة البلد:\nالإجابة النموذجية: عشرون آية\n3) [مستوى الاستدلال] سميت السورة بالبلد لأن الله أقسم فيها بـ:\nالإجابة النموذجية: البلد الحرام مكة\n\nالحصة 2: التلاوة والحفظ وتطبيق الغنة ومعاني المفردات\n1) [مستوى المعرفة] معنى (كبد) في ﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ﴾:\nالإجابة النموذجية: مشقة وتعب\n2) [مستوى التطبيق] معنى (النجدين):\nالإجابة النموذجية: طريقا الخير والشر\n3) [مستوى الاستدلال] صواب أم خطأ: الغنة صوت يخرج من الأنف.\nالإجابة النموذجية: صواب\n\nالحصة 3: المعنى الإجمالي والدروس المستفادة من سورة البلد\n1) [مستوى المعرفة] من نعم الله على الإنسان في السورة:\nالإجابة النموذجية: العينان واللسان والشفتان\n2) [مستوى التطبيق] من الأعمال الصالحة في السورة:\nالإجابة النموذجية: إطعام اليتيم والمسكين\n3) [مستوى الاستدلال] صواب أم خطأ: أصحاب الميمنة هم المؤمنون الذين يتواصون بالصبر والمرحمة.\nالإجابة النموذجية: صواب\n\nالحصة 4: تطبيقات «أختبر تعلمي» على سورة البلد ومسابقة الدرس\n1) [مستوى المعرفة] سورة البلد ترتيبها في المصحف:\nالإجابة النموذجية: التسعون\n2) [مستوى التطبيق] صواب أم خطأ: ﴿فَكُّ رَقَبَةٍ﴾ تعني إعتاق العبد وتحريره.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] ﴿يَتِيمًا ذَا مَقْرَبَةٍ﴾ تعني يتيمًا:\nالإجابة النموذجية: قريبًا في النسب", "الحصة 1: أتعرف السورة والتلاوة النموذجية والترديد\n1) [مستوى المعرفة] ترتيب سورة البلد في المصحف:\nالإجابة النموذجية: التسعون\n2) [مستوى التطبيق] صواب أم خطأ: سورة البلد في الجزء الثلاثين.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من آداب التلاوة:\nالإجابة النموذجية: الإنصات والخشوع وحسن الجلسة\n\nالحصة 2: التلاوة والحفظ وتطبيق الغنة ومعاني المفردات\n1) [مستوى المعرفة] معنى (مسغبة):\nالإجابة النموذجية: مجاعة\n2) [مستوى التطبيق] الغنة في كلمة:\nالإجابة النموذجية: ثُمَّ\n3) [مستوى الاستدلال] معنى (مؤصدة):\nالإجابة النموذجية: مغلقة\n\nالحصة 3: المعنى الإجمالي والدروس المستفادة من سورة البلد\n1) [مستوى المعرفة] معنى ﴿وَتَوَاصَوْا بِالْمَرْحَمَةِ﴾:\nالإجابة النموذجية: أوصى بعضهم بعضًا بالرحمة\n2) [مستوى التطبيق] كيف أطبق ما تعلمته من السورة اليوم؟\nالإجابة النموذجية: أطعم محتاجًا أو أساعد يتيمًا\n3) [مستوى الاستدلال] صواب أم خطأ: الإنسان مخلوق في راحة دائمة بلا تعب.\nالإجابة النموذجية: خطأ\n\nالحصة 4: تطبيقات «أختبر تعلمي» على سورة البلد ومسابقة الدرس\n1) [مستوى المعرفة] الأعمال الصالحة في السورة تسمى:\nالإجابة النموذجية: اقتحام العقبة\n2) [مستوى التطبيق] صواب أم خطأ: نطبق الغنة في ﴿ثُمَّ﴾ بمقدار حركتين.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] عمل صالح من السورة أستطيع فعله:\nالإجابة النموذجية: إطعام محتاج", "الحصة 1: أتعرف السورة والتلاوة النموذجية والترديد\nإرشاد للطالب: ردد مع أسرتك الآيات (1–10) من سورة البلد\nإرشاد لولي الأمر: استمع لتلاوة ابنك وصوّب له بلطف.\n\nالحصة 2: التلاوة والحف التسميع الثنائي. — الطالب: التسميع.\n4) من الدقيقة 27 إلى 35: المعلم: كتابة الآية ﴿إِنَّ رَبَّكَ لَبِالْمِرْصَادِ﴾ وتلوين موضع الغنة. — الطالب: الكتابة والتلوين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: تلاوة وحفظ سورة الفجر: الآيات (15–16)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تلاوة نموذجية للآيتين (15–16) مع التنبيه على الغنة في ﴿فَأَمَّا﴾ و﴿وَأَمَّا﴾. — الطالب: الترديد.\n3) من الدقيقة 15 إلى 26: المعلم: الحفظ بالتكرار والتسميع الثنائي. — الطالب: التسميع.\n4) من الدقيقة 27 إلى 35: المعلم: تسميع متصل للآيات (1–16) في مجموعات. — الطالب: التسميع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: مراجعة وتثبيت حفظ سورة الفجر: الآيات (1–8)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: تسميع متناوب بين المجموعات للآيات (1–8). — الطالب: التسميع.\n3) من الدقيقة 16 إلى 27: المعلم: تصحيح الأقران وفق بطاقة المعايير. — الطالب: التصحيح والتقييم.\n4) من الدقيقة 28 إلى 35: المعلم: تحديد الآيات التي تحتاج مراجعة لكل طالب. — الطالب: التدوين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: مراجعة وتثبيت حفظ سورة الفجر: الآيات (9–16)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: تسميع متناوب للآيات (9–16) بين المجموعات. — الطالب: التسميع.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «اربط الآية بما بعدها» بالبطاقات. — الطالب: الترتيب.\n4) من الدقيقة 28 إلى 35: المعلم: تسميع فردي لمن يحتاج دعمًا. — الطالب: التسميع.\n5) من الدقيقة 36 إلى 40: التقوي ى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: فكر-زاوج-شارك: لماذا ثلاث سنوات بين الأمر والتأديب؟ (التعويد والتدرج). — الطالب: الاستنتاج.\n3) من الدقيقة 16 إلى 27: المعلم: التدرب على حفظ الحديث بالإخفاء التدريجي ومسابقة حفظ قصيرة. — الطالب: الحفظ والتسميع.\n4) من الدقيقة 28 إلى 35: المعلم: حل «أختبر تعلمي» (النشاط الثالث). — الطالب: الحل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: تطبيق: جدول صلاتي الأسبوعي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض نموذج جدول صلاة أسبوعي. — الطالب: الملاحظة.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بتصميم جداولهم وتزيينها. — الطالب: التصميم.\n4) من الدقيقة 28 إلى 35: المعلم: الاتفاق على متابعة الجدول مع الأسرة. — الطالب: كتابة اتفاق قصير.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: أعلّم أخي الصغير الصلاة (تمثيل ونمذجة)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة تعليم الصلاة بلطف وقدوة حسنة. — الطالب: الملاحظة.\n3) من الدقيقة 15 إلى 27: المعلم: لعب أدوار: أخ كبير يعلم أخاه ذا السبع سنوات الاستعداد للصلاة. — الطالب: التمثيل.\n4) من الدقيقة 28 إلى 35: المعلم: ترتيب خطوات الاستعداد للصلاة (الوضوء، الثياب الطاهرة، الاتجاه إلى القبلة). — الطالب: الترتيب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: مسابقة حفظ حديث الأمر بالصلاة وشرحه\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 17: المعلم: تنظيم مسابقة حفظ بين المجموعات. — الطالب: التسميع.\n3) من الدقيقة 18 إلى 27: المعلم: تكليف الطلبة بشرح الحديث بأسلوبهم في جملتين. — الطالب: الشرح.\n4) من الدقيقة 28 إلى 35: المعلم: تكريم الفائزين. — الطالب: التهنئة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: مراجعة درس الأمر بالصلاة ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: حل «أختبر تعلمي». — الطالب: الحل.\n3) من الدقيقة 15 إلى 27: المعلم: مسابقة المجموعات الإلكترونية للدرس. — الطالب: المنافسة.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة الأخطاء الشائعة. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: قراءة حديث الأمر بالصلاة وفهم معانيه\n1) [مستوى المعرفة] يؤمر الطفل بالصلاة وهو ابن:\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] معنى (مروا):\nالإجابة النموذجية: اطلبوا منهم ووجهوهم\n3) [مستوى الاستدلال] صواب أم خطأ: الحديث يحث الآباء على تعليم أبنائهم الصلاة.\nالإجابة النموذجية: صواب\n\nالحصة 2: الحكمة من التدرج في الأمر بالصلاة وحفظ الحديث\n1) [مستوى المعرفة] الحكمة من الفترة بين السابعة والعاشرة:\nالإجابة النموذجية: التعويد التدريجي على الصلاة\n2) [مستوى التطبيق] صواب أم خطأ: التدرج يساعد الطفل على حب الصلاة والالتزام بها.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] عدد السنوات بين الأمر بالصلاة والتأديب عليها:\nالإجابة النموذجية: ثلاث سنوات\n\nالحصة 3: تطبيق: جدول صلاتي الأسبوعي\n1) [مستوى المعرفة] عدد الصلوات التي أتابعها يوميًا في الجدول:\nالإجابة النموذجية: خمس\n2) [مستوى التطبيق] صواب أم خطأ: الجدول يساعدني على المحافظة على الصلاة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الصلاة التي غالبًا ما تكون في وقت المدرسة:\nالإجابة النموذجية: الظهر\n\nالحصة 4: أعلّم أخي الصغير الصلاة (تمثيل ونمذجة)\n1) [مستوى المعرفة] أعلّم أخي الصغير الصلاة بـ:\nالإجابة النموذجية: الرفق والقدوة\n2) [مستوى التطبيق] صواب أم خطأ: الوضوء قبل الصلاة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] نتجه في الصلاة إلى:\nالإجابة النموذجية: القبلة (الكعبة)\n\nالحصة 5: مسابقة حفظ حديث الأمر بالصلاة وشرحه\n1) [مستوى المعرفة] أكمل: مروا أولادكم ......\nالإجابة النموذجية: بالصلاة\n2) [مستوى التطبيق] صواب أم خطأ: يذكر الحديث سن العاشرة.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الحديث موجه إلى:\nالإجابة النموذجية: الآباء والأمهات\n\nالحصة 6: مراجعة درس الأمر بالصلاة ومسابقة المجموعات\n1) [مستوى المعرفة] سن الأمر بالصلاة:\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] صواب أم خطأ: الصلاة عبادة يتعلمها الطفل مبكرًا.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الفترة بين الأمر والتأديب:\nالإجابة النموذجية: ثلاث سنوات", "الحصة 1: قراءة حديث الأمر بالصلاة وفهم معانيه\n1) [مستوى المعرفة] معنى (المضاجع):\nالإجابة النموذجية: أماكن النوم\n2) [مستوى التطبيق] صواب أم خطأ: الحديث موجه إلى الآباء والأمهات.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من يأمر الطفل بالصلاة؟\nالإجابة النموذجية: والداه\n\nالحصة 2: الحكمة من التدرج في الأمر بالصلاة وحفظ الحديث\n1) [مستوى المعرفة] أكمل: مُروا أولادكم بالصلاة وهم أبناء ......\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] صواب أم خطأ: نحفظ الحديث مع فهم معناه.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أي سلوك يدل على تطبيق الحديث؟\nالإجابة النموذجية: أحافظ على صلاتي وأشجع إخوتي\n\nالحصة 3: تطبيق: جدول صلاتي الأسبوعي\n1) [مستوى المعرفة] من يساعدني في متابعة جدول صلاتي؟\nالإجابة النموذجية: والداي\n2) [مستوى التطبيق] صواب أم خطأ: أؤخر الصلاة لأكمل اللعب.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] أي هدف مناسب في الجدول؟\nالإجابة النموذجية: أصلي الصلوات الخمس في وقتها هذا الأسبوع\n\nالحصة 4: أعلّم أخي الصغير الصلاة (تمثيل ونمذجة)\n1) [مستوى المعرفة] أول خطوات الاستعداد للصلاة:\nالإجابة النموذجية: الوضوء\n2) [مستوى التطبيق] صواب أم خطأ: القدوة الحسنة من أفضل طرق التعليم.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] إذا أخطأ أخي في الصلاة فإنني:\nالإجابة النموذجية: أصحح له بلطف\n\nالحصة 5: مسابقة ح لإجابات.\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توجيه الطلبة لإكمال صفحة «ألخص معارفي». — الطالب: الإكمال.\n3) من الدقيقة 15 إلى 27: المعلم: مسابقة المجموعات الإلكترونية الشاملة لدرس أحمي نفسي والوحدة. — الطالب: المنافسة.\n4) من الدقيقة 28 إلى 35: المعلم: استخلاص قيم الوحدة وكتابتها على السبورة. — الطالب: المشاركة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: مخاطر التواصل مع الغرباء وعبر الأجهزة\n1) [مستوى المعرفة] إذا طلب غريب عنوان بيتي عبر الجهاز فإنني:\nالإجابة النموذجية: أرفض وأخبر والديّ\n2) [مستوى التطبيق] صواب أم خطأ: حماية النفس واجب على المسلم.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] الدليل على وجوب حماية النفس:\nالإجابة النموذجية: ﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾\n\nالحصة 2: التدابير الوقائية لحماية النفس\n1) [مستوى المعرفة] إذا عرض غريب توصيلي إلى البيت فإنني:\nالإجابة النموذجية: أرفض وأبتعد وأخبر والديّ\n2) [مستوى التطبيق] صواب أم خطأ: أخبر والديّ بأي موقف يزعجني.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من التدابير الوقائية:\nالإجابة النموذجية: الاستئذان قبل استخدام الإنترنت\n\nالحصة 3: مشروع ملصق «أحمي نفسي»\n1) [مستوى المعرفة] عناصر الملصق الإرشادي:\nالإجابة النموذجية: عنوان وصورة ونصيحة\n2) [مستوى التطبيق] صواب أم خطأ: الملصق الجيد واضح ومختصر.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] عبارة مناسبة للملصق:\nالإجابة النموذجية: لا تشارك معلوماتك مع الغرباء\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات\n1) [مستوى المعرفة] من قيم الوحدة الثانية:\nالإجابة النموذجية: المحافظة على الصلاة وحماية النفس\n2) [مستوى التطبيق] صواب أم خطأ: حماية النفس من مقاصد الإسلام.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] من دروس الوحدة الثانية:\nالإجابة النموذجية: صلاة الجماعة", "الحصة 1: مخاطر التواصل مع الغرباء وعبر الأجهزة\n1) [مستوى المعرفة] من المعلومات التي لا أشاركها مع الغرباء:\nالإجابة النموذجية: عنوان البيت ورقم الهاتف\n2) [مستوى التطبيق] صواب أم خطأ: أركب مع الغريب إذا أعطاني حلوى.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] إذا شعرت بالخوف من موقف فإنني:\nالإجابة النموذجية: أخبر شخصًا أثق به فورًا\n\nالحصة 2: التدابير الوقائية لحماية النفس\n1) [مستوى المعرفة] كلمة أقولها بثقة للطلب الخطر:\nالإجابة النموذجية: لا\n2) [مستوى التطبيق] صواب أم خطأ: أحتفظ بأسرار الغرباء ولا أخبر أحدًا.\nالإجابة النموذجية: خطأ\n3) [مستوى الاستدلال] أي معلومة خاصة لا أشاركها؟\nالإجابة النموذجية: كلمة المرور\n\nالحصة 3: مشروع ملصق «أحمي نفسي»\n1) [مستوى المعرفة] هدف الملصق:\nالإجابة النموذجية: توعية الزملاء بحماية أنفسهم\n2) [مستوى التطبيق] صواب أم خطأ: نعلق الملصق في مكان يراه الجميع.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] أي صورة تناسب ملصق السلامة؟\nالإجابة النموذجية: طفل يرفض الذهاب مع غريب\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات\n1) [مستوى المعرفة] العمر الذي يؤمر فيه الطفل بالصلاة:\nالإجابة النموذجية: سبع سنين\n2) [مستوى التطبيق] صواب أم خطأ: السيدة خديجة أول من آمن بالنبي ﷺ.\nالإجابة النموذجية: صواب\n3) [مستوى الاستدلال] إذا طلب غريب صورتي عبر الهاتف فإنني:\nالإجابة النموذجية: أرفض وأخبر والديّ", "الحصة 1: مخاطر التواصل مع الغرباء وعبر الأجهزة\nإرشاد للطالب: اتفق مع أسرتك على قواعد السلامة الشخصية\nإرشاد لولي الأمر: ناقش مع ابنك المواقف الخطرة وكيفية التصرف.\n\nالحصة 2: التدابير الوقائية لحماية النفس\nإرشاد للطالب: راجع مع أسرتك بطاقة «قواعد سلامتي»\nإرشاد لولي الأمر: ناقش ابنك في التصرف في المواقف الخطرة.\n\nالحصة 3: مشروع ملصق «أحمي نفسي»\nإرشاد للطالب: اصنع مع أسرتك ملصقًا صغيرًا للبيت\nإرشاد لولي الأمر: شارك ابنك في توعية إخوته.\n\nالحصة 4: ألخص معارفي في الوحدة الثانية ومسابقة المجموعات\nإرشاد للطالب: أكمل «ألخص معارفي» مع أسرتك\nإرشاد لولي الأمر: راجع مع ابنك قيم الوحدة الثانية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/islamic/?l=14"]}, {"id": "RF2", "name": "التلاوة والحفظ: سورة الفجر (الآيات 17–30)", "unit": "الوحدة الثالثة", "period function pc(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
const NAMES=['المخرجات التعليمية','المستوى المعرفي','الاستراتيجيات','المصادر التعليمية','المفاهيم','التهيئة / التمهيد / التعلم القبلي','إجراءات سير الدرس / الأنشطة التدريسية','التقويم التكويني','التقويم الختامي','ملاحظات ضمن خطة الدراسة الأسبوعية'];
let mode='sep', li=0, pi=0;
const $=s=>document.querySelector(s);
$('#ttl').textContent='نسخ حقول نور — '+DATA.subject+' — '+DATA.grade+' — '+DATA.term;
const lsel=$('#lsel');
DATA.lessons.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=L.name+' ('+pc(L.periods.length)+')';lsel.appendChild(o)});
lsel.onchange=()=>{li=+lsel.value;pi=0;render()};
$('#mSep').onclick=()=>{mode='sep';render()};
$('#mComb').onclick=()=>{mode='comb';render()};
function render(){
  const L=DATA.lessons[li];
  $('#mSep').setAttribute('aria-pressed',mode==='sep');$('#mComb').setAttribute('aria-pressed',mode==='comb');
  $('#status').textContent= mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد لكل درس يضم حصصه';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='sep'){
    tabs.style.display='flex';
    L.periods.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===pi);b.textContent='الحصة '+p.n;b.title=p.topic;b.onclick=()=>{pi=i;render()};tabs.appendChild(b)});
    const p=L.periods[pi];
    $('#ctx').innerHTML='';
    const c=$('#ctx');c.append(ctxLine('الدرس: ',L.name+' — الحصة '+p.n+' من '+L.periods.length));c.append(ctxLine('محور الحصة: ',p.topic));if(p.week)c.append(ctxLine('',p.week));
    cards(p.fields);
  }else{
    tabs.style.display='none';
    $('#ctx').innerHTML='';$('#ctx').append(ctxLine('الدرس: ',L.name+' — نموذج واحد يضم '+pc(L.periods.length)));
    cards(L.combined);
  }
}
function ctxLine(b,t){const d=document.createElement('div');if(b){const s=document.createElement('b');s.textContent=b;d.append(s)}d.append(t);return d}
function cards(fields){
  const m=$('#cards');m.innerHTML='';
  fields.forEach((txt,i)=>{
    const card=document.createElement('article');card.className='card';
    const h=document.createElement('h2');const t=document.createElement('span');
    const n=document.createElement('span');n.className='n';n.textContent=i+1;t.append(n,NAMES[i]);
    const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='نسخ';
    h.append(t,b);
    const body=document.createElement('div');body.className='txt';body.textContent=txt;
    const hint=document.createElement('div');hint.className='hint';hint.textContent='منع المتصفح النسخ التلقائي؛ النص محدد الآن، انسخه من قائمة الجهاز (نسخ).';
    b.onclick=()=>copy(txt,b,body,hint);
    card.append(h,body,hint);m.append(card);
  });
}
async function copy(txt,btn,body,hint){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    try{ok=document.execCommand('copy')}catch(e){ok=false}
    document.body.removeChild(ta);
  }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');hint.classList.remove('on');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1800);}
  else{const r=document.createRange();r.selectNodeContents(body);const s=getSelection();s.removeAllRanges();s.addRange(r);hint.classList.add('on');}
}
render();
