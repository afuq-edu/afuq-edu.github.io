:root{--acc:#4d6b3c;--tint:#f1f5ec;--tint2:#f7faf4;--line:#d6e2cc;--ink:#26343c;--mut:#62737c;--ok:#3f8a5f}
*{box-sizing:border-box}
body{margin:0;font-family:Plex,system-ui,sans-serif;color:var(--ink);background:#f7f9fa;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
header.top{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
header.top h1{margin:0;font-size:1.3rem;color:var(--acc);font-weight:600}
header.top p{margin:2px 0 0;color:var(--mut);font-size:.92rem}
.mode{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.switch{display:inline-flex;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.switch button{font:inherit;border:0;background:transparent;padding:7px 18px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600}
.switch button[aria-pressed="true"]{background:#fff;color:var(--acc);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.switch button:focus-visible,.btn:focus-visible,select:focus-visible,.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.explain{margin:10px 0 6px;font-size:.92rem;color:var(--mut)}
.explain div{display:flex;gap:6px}
.explain b{color:var(--ink);font-weight:600;white-space:nowrap}
.status{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--tint2);color:var(--acc);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:12px}
.pick label{font-weight:600;color:var(--mut)}
select{font:inherit;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);min-width:260px;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;cursor:pointer;color:var(--mut)}
.tabs button[aria-selected="true"]{background:var(--tint);color:var(--acc);font-weight:600;border-color:var(--acc)}
.ctx{margin:0 0 12px;color:var(--mut);font-size:.95rem}
.ctx b{color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card h2{margin:0;font-size:1rem;font-weight:600;color:var(--acc);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--tint2);border-bottom:1px solid var(--line)}
.card h2 span.n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center;font-size:.8rem;margin-inline-end:8px}
.txt{white-space:pre-wrap;padding:10px 16px 12px;font-size:.98rem}
.btn{font:inherit;font-weight:600;border:1px solid var(--acc);color:var(--acc);background:#fff;border-radius:9px;padding:4px 16px;cursor:pointer;flex:none;transition:background .2s,color .2s}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{font-size:.85rem;color:#a0612f;padding:0 16px 8px;display:none}
.hint.on{display:block}
@media (max-width:600px){select{min-width:0;width:100%}.wrap{padding:10px 8px 40px}.txt{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تلاوة نموذجية للآيات (11–14) مع التنبيه على الغنة في ﴿إِنَّ﴾. — الطالب: الترديد والتطبيق.\n3) من الدقيقة 15 إلى 26: المعلم: الحفظ والتسميع الثنائي. — الطالب: التسميع.\n4) من الدقيقة 27 إلى 35: المعلم: كتابة الآية ﴿إِنَّ رَبَّكَ لَبِالْمِرْصَادِ﴾ وتلوين موضع الغنة. — الطالب: الكتابة والتلوين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: تلاوة وحفظ سورة الفجر: الآيات (15–16)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تلاوة نموذجية للآيتين (15–16) مع التنبيه على الغنة في ﴿فَأَمَّا﴾ و﴿وَأَمَّا﴾. — الطالب: الترديد.\n3) من الدقيقة 15 إلى 26: المعلم: الحفظ بالتكرار والتسميع الثنائي. — الطالب: التسميع.\n4) من الدقيقة 27 إلى 35: المعلم: تسميع متصل للآيات (1–16) في مجموعات. — الطالب: التسميع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: مراجعة وتثبيت حفظ سورة الفجر: الآيات (1–8)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: تسميع متناوب بين المجموعات للآيات (1–8). — الطالب: التسميع.\n3) من الدقيقة 16 إلى 27: المعلم: تصحيح الأقران وفق بطاقة المعايير. — الطالب: التصحيح والتقييم.\n4) من الدقيقة 28 إلى 35: المعلم: تحديد الآيات التي تحتاج مراجعة لكل طالب. — الطالب: التدوين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: مراجعة وتثبيت حفظ سورة الفجر: الآيات (9–16)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: تسميع متناوب للآيات (9–16) بين المجموعات. — الطالب: التسميع.\n3) من الدقيقة 1 لختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: تطبيق: جدول صلاتي الأسبوعي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض نموذج جدول صلاة أسبوعي. — الطالب: الملاحظة.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بتصميم جداولهم وتزيينها. — الطالب: التصميم.\n4) من الدقيقة 28 إلى 35: المعلم: الاتفاق على متابعة الجدول مع الأسرة. — الطالب: كتابة اتفاق قصير.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: أعلّم أخي الصغير الصلاة (تمثيل ونمذجة)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة تعليم الصلاة بلطف وقدوة حسنة. — الطالب: الملاحظة.\n3) من الدقيقة 15 إلى 27: المعلم: لعب أدوار: أخ كبير يعلم أخاه ذا السبع سنوات الاستعداد للصلاة. — الطالب: التمثيل.\n4) من الدقيقة 28 إلى 35: المعلم: ترتيب خطوات الاستعداد للصلاة (الوضوء، الثياب الطاهرة، الاتجاه إلى القبلة). — الطالب: الترتيب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: مسابقة حفظ حديث الأمر بالصلاة وشرحه\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 17: المعلم: تنظيم مسابقة حفظ بين المجموعات. — الطالب: التسميع.\n3) من الدقيقة 18 إلى 27: المعلم: تكليف الطلبة بشرح الحديث بأسلوبهم في جملتين. — الطالب: الشرح.\n4) من الدقيقة 28 إلى 35: المعلم: تكريم الفائزين. — الطالب: التهنئة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: مراجعة درس الأمر بالصلاة ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهي function pc(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
const NAMES=['المخرجات التعليمية','المستوى المعرفي','الاستراتيجيات','المصادر التعليمية','المفاهيم','التهيئة / التمهيد / التعلم القبلي','إجراءات سير الدرس / الأنشطة التدريسية','التقويم التكويني','التقويم الختامي','ملاحظات ضمن خطة الدراسة الأسبوعية'];
let mode='sep', li=0, pi=0;
const $=s=>document.querySelector(s);
$('#ttl').textContent='نسخ حقول نور — '+DATA.subject+' — '+DATA.grade+' — '+DATA.term;
const lsel=$('#lsel');
DATA.lessons.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=L.name+' ('+pc(L.periods.length)+')';lsel.appendChild(o)});
lsel.onchange=()=>{li=+lsel.value;pi=0;render()};
$('#mSep').onclick=()=>{mode='sep';render()};
$('#mComb').onclick=()=>{mode='comb';render()};
function render(){
  const L=DATA.lessons[li];
  $('#mSep').setAttribute('aria-pressed',mode==='sep');$('#mComb').setAttribute('aria-pressed',mode==='comb');
  $('#status').textContent= mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد لكل درس يضم حصصه';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='sep'){
    tabs.style.display='flex';
    L.periods.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===pi);b.textContent='الحصة '+p.n;b.title=p.topic;b.onclick=()=>{pi=i;render()};tabs.appendChild(b)});
    const p=L.periods[pi];
    $('#ctx').innerHTML='';
    const c=$('#ctx');c.append(ctxLine('الدرس: ',L.name+' — الحصة '+p.n+' من '+L.periods.length));c.append(ctxLine('محور الحصة: ',p.topic));if(p.week)c.append(ctxLine('',p.week));
    cards(p.fields);
  }else{
    tabs.style.display='none';
    $('#ctx').innerHTML='';$('#ctx').append(ctxLine('الدرس: ',L.name+' — نموذج واحد يضم '+pc(L.periods.length)));
    cards(L.combined);
  }
}
function ctxLine(b,t){const d=document.createElement('div');if(b){const s=document.createElement('b');s.textContent=b;d.append(s)}d.append(t);return d}
function cards(fields){
  const m=$('#cards');m.innerHTML='';
  fields.forEach((txt,i)=>{
    const card=document.createElement('article');card.className='card';
    const h=document.createElement('h2');const t=document.createElement('span');
    const n=document.createElement('span');n.className='n';n.textContent=i+1;t.append(n,NAMES[i]);
    const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='نسخ';
    h.append(t,b);
    const body=document.createElement('div');body.className='txt';body.textContent=txt;
    const hint=document.createElement('div');hint.className='hint';hint.textContent='منع المتصفح النسخ التلقائي؛ النص محدد الآن، انسخه من قائمة الجهاز (نسخ).';
    b.onclick=()=>copy(txt,b,body,hint);
    card.append(h,body,hint);m.append(card);
  });
}
async function copy(txt,btn,body,hint){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    try{ok=document.execCommand('copy')}catch(e){ok=false}
    document.body.removeChild(ta);
  }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');hint.classList.remove('on');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1800);}
  else{const r=document.createRange();r.selectNodeContents(body);const s=getSelection();s.removeAllRanges();s.addRange(r);hint.classList.add('on');}
}
render();
