 إلى نطق اللام فيهما. (الزمن: 4 دقائق)\n\nالحصة 10: مراجعة علامات الترقيم\nقراءة جملة واحدة بثلاث نغمات (خبر، سؤال، تعجب) وسؤال الطلبة عن الفرق. (الزمن: 4 دقائق)\n\nالحصة 11: الإملاء المنظور وإعادة كتابة الفقرة الإملائية\nلعبة «الكلمة الطائرة»: عرض كلمة لثوانٍ ثم إخفاؤها ليكتبها الطلبة من الذاكرة. (الزمن: 4 دقائق)\n\nالحصة 12: مراجعة خط النسخ\nعرض لوحة خطية جميلة بخط النسخ وسؤال: ما الذي يجعل هذا الخط جميلًا؟ (الزمن: 4 دقائق)\n\nالحصة 13: التعبير: كتابة نهاية أخرى للحكاية\nسؤال تخيلي: ماذا لو لم يرَ الغراب الصياد؟ وجمع الأفكار بالعصف الذهني. (الزمن: 4 دقائق)\n\nالحصة 14: تقويم تشخيصي لمهارات المراجعة ومسابقة المجموعات\nاسترجاع سريع بالأسئلة الخاطفة عن شخصيات الحكاية وقيمتها. (الزمن: 4 دقائق)", "الحصة 1: التعارف وآداب الحديث والتحدث عن لوحة المحادثة\n1) من الدقيقة 1 إلى 5: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 6 إلى 15: المعلم: عرض لوحة المحادثة وترك فرصة لتأملها ثم طرح السؤال: ماذا تشاهدون؟ وبمَ تذكركم الصورة؟ — الطالب: تأمل اللوحة ووصف عناصرها بجمل تامة بالتناوب.\n3) من الدقيقة 16 إلى 27: المعلم: توزيع الطلبة في مجموعات ثلاثية وتكليف كل مجموعة باقتراح عنوان للوحة وذكر آية أو حديث يعبر عنها. — الطالب: التشاور في المجموعة وعرض العنوان المقترح والشاهد ومحاكاة حركة اللوحة عمليًا.\n4) من الدقيقة 28 إلى 35: المعلم: الاتفاق مع الطلبة على قواعد الحديث في الصف وتدوينها على السبورة. — الطالب: صياغة قاعدتين للحديث والاستماع ونسخهما في بطاقة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: القراءة الجهرية الأولى لحكاية الحمامة المطوقة والفكرة العامة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة نموذجية معبرة للحكاية مع عرض النص على السبورة الذكية وتوضيح معايير القراءة الجهرية. — الطالب: المتابعة الصامتة في الكتاب وتحديد الكلمات الصعبة.\n3) من الدقيقة 15 إلى 28: المعلم: تنظيم قراءات فردية متتابعة تبدأ بالمجيدين وتصويب الأخطاء بعد إكمال الجملة وتدوين الملحوظات. — الطالب: القراءة الجهرية بالتناوب ورصد الأخطاء القرائية للزملاء بلطف.\n4) من الدقيقة 29 إلى 35: المعلم: طرح سؤال: ما الحكاية في جملة واحدة؟ ومساعدة الطلبة على صياغة الفكرة العامة. — الطالب: اقتراح جمل للفكرة العامة واختيار أدقها.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الثانية وأسئلة المعنى الصريح\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: تكليف الطلبة بالقراءة الجهرية الثانية بطريقة الأقران مع استمارة معايير القراءة على السبورة. — الطالب: القراءة الثنائية وتقييم قراءة الزميل وفق المعايير.\n3) من الدقيقة 17 إلى 27: المعلم: توزيع بطاقات أحداث الحكاية مبعثرة على المجموعات بطريقة الرؤوس المرقمة. — الطالب: ترتيب البطاقات وفق تسلسل الحكاية وعرضها.\n4) من الدقيقة 28 إلى 35: المعلم: طرح أسئلة المستوى الأول من الكتاب وتدوين الإجابات الصحيحة على السبورة. — الطالب: الإجابة بالعودة إلى النص ونقل الإجابة إلى الكتاب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: المفردات والمعاني والأضداد في حكاية الحمامة المطوقة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض جمل من الحكاية تتضمن كلمات جديدة (الشرك، كمن، الخلاص) ومناقشة معانيها من السياق. — الطالب: استنتاج المعنى من السياق وكتابته في الكتاب.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «الأضداد المتطابقة»: بطاقات كلمات وأضدادها موزعة على الطلبة. — الطالب: البحث عن الزميل الذي يحمل ضد الكلمة وقراءة الزوج أمام الصف.\n4) من الدقيقة 28 إلى 35: المعلم: تكليف كل طالب بتوظيف كلمتين جديدتين في جملتين. — الطالب: كتابة الجملتين وقراءتهما.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: مستويات الفهم العليا والقيمة في حكاية الحمامة المطوقة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: طرح سؤال: ما القيمة الأساسية في الحكاية؟ وتطبيق «فكر-زاوج-شارك». — الطالب: التفكير فرديًا ثم المناقشة مع الزميل ثم المشاركة أمام الصف.\n3) من الدقيقة 16 إلى 27: المعلم: عرض موقف مشابه في الصف (ترتيب الصف) ومطالبة المجموعات بحل التحدي بالتعاون وربطه بالحكاية. — الطالب: تنفيذ التحدي جماعيًا وتحديد موضع القيمة في الحكاية.\n4) من الدقيقة 28 إلى 35: المعلم: سؤال: لو كنت إحدى الحمامات ماذا ستفعل؟ ولماذا؟ — الطالب: إبداء الرأي مع التعليل بجملة أو جملتين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: محاكاة أسلوب (بينما ... إذ) وإعادة سرد الحكاية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة الأسلوب بمثالين من الحياة المدرسية وتوضيح أن «إذ» تفاجئنا بحدث جديد. — الطالب: محاكاة الأسلوب شفهيًا ثم كتابة جملتين.\n3) من الدقيقة 15 إلى 27: المعلم: توزيع أقنعة الشخصيات (الغراب، المطوقة، الحمامات، الصياد) على المجموعات لتمثيل الحكاية. — الطالب: التمثيل وإعادة السرد بلسان الشخصيات.\n4) من الدقيقة 28 إلى 35: المعلم: تقييم السرد بمعايير بسيطة: الترتيب والوضوح والصوت. — الطالب: تقييم أداء المجموعات الأخرى وفق المعايير.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: مراجعة المفرد والمثنى والجمع\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض كلمات من الحكاية (حمامة، صيادان، الطيور) وقيادة الطلبة لاكتشاف علامات المثنى والجمع. — الطالب: الملاحظة والتصنيف في جدول ثلاثي.\n3) من الدقيقة 16 إلى 26: المعلم: لعبة «سلة الكلمات»: ثلاث سلال (مفرد، مثنى، جمع) وبطاقات كلمات. — الطالب: وضع البطاقة في السلة الصحيحة وتعليل الاختيار.\n4) من الدقيقة 27 إلى 35: المعلم: تكليف الطلبة بحل تدريب الكتاب ص 22 فرديًا ومتابعتهم. — الطالب: الحل الفردي ثم التصحيح الثنائي.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: وصف صورة بجملة مفيدة توظف المفرد والمثنى والجمع\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة وصف صورة بجملة مفيدة كمثال الكتاب (الطيور تأكل الحبوب). — الطالب: ملاحظة عناصر الجملة المفيدة.\n3) من الدقيقة 15 إلى 27: المعلم: عرض صور الكتاب وتكليف الطلبة بوصف كل صورة بجملة توظف الصيغة المطلوبة. — الطالب: الكتابة الفردية ثم القراءة على الزميل.\n4) من الدقيقة 28 إلى 35: المعلم: اختيار نماذج متميزة وعرضها على السبورة. — الطالب: تصويب الجمل وتجويدها جماعيًا.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: مراجعة التنوين واللام الشمسية واللام القمرية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة الفقرة ص 24 وتوجيه الطلبة لاكتشاف الكلمات المنونة والكلمات المبدوءة بـ(ال). — الطالب: القراءة وتلوين الكلمات وفق الظاهرة.\n3) من الدقيقة 16 إلى 26: المعلم: لعبة «ارفع البطاقة»: نطق كلمات ورفع بطاقة الشمس أو القمر أو التنوين. — الطالب: الاستماع ورفع البطاقة الصحيحة وتعليل الإجابة.\n4) من الدقيقة 27 إلى 35: المعلم: تكليف الطلبة بملء جدول الكتاب ومتابعتهم. — الطالب: ملء الجدول ذاتيًا ثم المقارنة مع الزميل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: مراجعة علامات الترقيم\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض مجسمات علامات الترقيم وربط كل علامة بموضعها بأمثلة من الحكاية. — الطالب: القراءة بتنغيم مناسب لكل علامة.\n3) من الدقيقة 15 إلى 26: المعلم: تكليف المجموعات بالبحث في الفقرة الأخيرة من الحكاية عن جمل فيها العلامات المطلوبة. — الطالب: البحث والكتابة في الكتاب ص 24.\n4) من الدقيقة 27 إلى 35: المعلم: لعبة «أكمل بالعلامة»: جمل بلا ترقيم على السبورة. — الطالب: الخروج للسبورة ووضع العلامة المناسبة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: الإملاء المنظور وإعادة كتابة الفقرة الإملائية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة الإملائية وقراءتها ومناقشة الكلمات ذات الظواهر الإملائية فيها ثم حجبها. — الطالب: القراءة والتهجي الشفهي للكلمات الصعبة.\n3) من الدقيقة 15 إلى 26: المعلم: إملاء الفقرة بتأنٍّ مع تكرار كل جملة مرتين. — الطالب: الكتابة في الكتاب ص 25 بخط واضح.\n4) من الدقيقة 27 إلى 35: المعلم: كشف الفقرة وتوجيه الطلبة للتصحيح الذاتي ثم التصحيح الثنائي. — الطالب: تصحيح الأخطاء وإعادة كتابة الكلمات الخطأ.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: مراجعة خط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف المطلوبة على سبورة مسطرة مع توضيح مواضعها من السطر. — الطالب: المتابعة ومحاكاة الحركة في الهواء.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بكتابة النموذج في الكتاب ص 26 والتجوال لتصويب مسك القلم. — الطالب: الكتابة بتأنٍّ مراعين الحجم والمسافات.\n4) من الدقيقة 28 إلى 35: المعلم: عرض نماذج متميزة ومنح لقب «الخطاط الصغير». — الطالب: المقارنة بالنموذج وتحسين حرف واحد.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: التعبير: كتابة نهاية أخرى للحكاية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: العصف الذهني لنهايات ممكنة وتدوينها على السبورة مع أدوات الربط (ثم، بعد ذلك، أخيرًا). — الطالب: اقتراح نهايات واختيار أنسبها.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف كل طالب بكتابة نهاية في ثلاث جمل مترابطة. — الطالب: الكتابة الفردية مع توظيف أداة ربط وعلامات الترقيم.\n4) من الدقيقة 28 إلى 35: المعلم: قراءة نماذج ومناقشة منطقيتها وترابطها. — الطالب: الاستماع وتقديم ملحوظة لطيفة للزميل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: تقويم تشخيصي لمهارات المراجعة ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: توزيع ورقة تشخيصية قصيرة (فهم، مفرد ومثنى وجمع، لام شمسية وقمرية، ترقيم). — الطالب: الإجابة الفردية.\n3) من الدقيقة 17 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية على السبورة الذكية لدرس المراجعة. — الطالب: المنافسة بالتناوب والإجابة خلال الوقت.\n4) من الدقيقة 29 إلى 35: المعلم: توجيه الطلبة لتلوين «شجرة مهاراتي» بما أتقنوه وما يحتاجونه. — الطالب: التقويم الذاتي وكتابة هدف للأسبوع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: التعارف وآداب الحديث والتحدث عن لوحة المحادثة\n1) [مستوى الدعم] من آداب الحديث في الصف أن ...... قبل الكلام.\nالإجابة النموذجية: أستأذن\n2) [المستوى المتوقع] صواب أم خطأ: الجملة التامة تعطي معنى مفهومًا للسامع.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] أي العناوين أنسب للوحة تعاون الطيور في الطيران معًا؟\nالإجابة النموذجية: يدٌ واحدة لا تصفق\n\nالحصة 2: القراءة الجهرية الأولى لحكاية الحمامة المطوقة وال يف الاسم والفعل والحرف في الحديث والكتابة\nرمي «مكعب الكلمات» (على أوجهه: اسم، فعل، حرف) وطلب كلمة من النوع الظاهر. (الزمن: 4 دقائق)\n\nالحصة 13: النمط الإملائي: التاء المربوطة والتاء المفتوحة والهاء (اكتشاف)\nنطق كلمات (مدرسة، بيت، وجه) بالوقف والوصل وسؤال: ماذا تلاحظون في الحرف الأخير؟ (الزمن: 4 دقائق)\n\nالحصة 14: النمط الإملائي: تدريبات التاء المربوطة والمفتوحة والهاء\nعرض لوحة «خلية النحل» الفارغة وسؤال: من يساعد النحلات في إكمال بناء الخلية؟ (الزمن: 4 دقائق)\n\nالحصة 15: الإملاء: الفقرة الإملائية المنظورة\nمراجعة سريعة: كتابة ثلاث كلمات على السبورة البيضاء الصغيرة (ة، ت، ه). (الزمن: 4 دقائق)\n\nالحصة 16: الخط: كتابة الحروف والكلمات بخط النسخ\nعرض مجموعة من أقلام الخط المختلفة ومن بينها قلم الخط العربي وسؤال: أيها يعطي خطًا أجمل؟ ولماذا؟ (الزمن: 4 دقائق)\n\nالحصة 17: التعبير: عنصر المكان في النص السردي\nسؤال: أين أنتم الآن؟ صفوا مكانكم بثلاث كلمات. (الزمن: 4 دقائق)\n\nالحصة 18: التعبير: إعادة كتابة نص سردي يحدد الإطار المكاني\nتكوين «سلة عبارات المكان» على السبورة: فوق، تحت، بجانب، في وسط، على يمين... (الزمن: 4 دقائق)\n\nالحصة 19: مراجعة درس التيمينة ومسابقة المجموعات\nعرض «خريطة الدرس» الفارغة على السبورة وملؤها شفهيًا بأقسام الدرس. (الزمن: 4 دقائق)", "الحصة 1: أشاهد وأتحدث: لوحة المحادثة والقرآن الكريم\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض لوحة المحادثة وطلب وصفها، ثم السؤال عن العناصر المكونة للقرآن الكريم (آيات، سور). — الطالب: وصف اللوحة بعبارات مترابطة (طالبان على الأقل لكل وصف).\n3) من الدقيقة 16 إلى 27: المعلم: مناقشة أسئلة «أشاهد وأتحدث»: لماذا نهتم بتعليم القرآن؟ ومن علّمك سورة تحفظها؟ — الطالب: التحدث عن التجربة الشخصية في تعلم القرآن.\n4) من الدقيقة 28 إلى 35: المعلم: دعوة متطوعين لتلاوة سورة يحفظونها مع التوجيه إلى آداب التلاوة. — الطالب: التلاوة والإنصات لتلاوة الزملاء.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: أتصفح: العنوان والصور والكاتبة والتوقع\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: شرح القراءة التصفحية (دقيقتان) وتوجيه الطلبة لتمرير العين سريعًا على العنوان والصور والحواشي. — الطالب: التصفح السريع ضمن الزمن المحدد.\n3) من الدقيقة 14 إلى 26: المعلم: مناقشة أسئلة «أتصفح»: ما في الصورة؟ عمل الرجل الكبير؟ زمن الأحداث؟ من الكاتبة؟ — الطالب: الإجابة اعتمادًا على الصور والحاشية.\n4) من الدقيقة 27 إلى 35: المعلم: تعريف مبسط بالكاتبة جوخة الحارثية وإنجازها، ومقارنة التوقعات الأولى بالمعلومات الجديدة. — الطالب: تعديل التوقعات وتدوين الفكرة الافتراضية عن النص.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الأولى لنص التيمينة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تذكير بمعايير القراءة الجهرية وقراءة نموذجية معبرة للنص مع عرضه على جهاز العرض. — الطالب: المتابعة بالإصبع وتحديد الكلمات الصعبة.\n3) من الدقيقة 15 إلى 29: المعلم: تنظيم القراءة الفردية بالتناوب بدءًا بالمجيدين وتصويب الأخطاء بعد تمام الجملة. — الطالب: القراءة الجهرية مراعين الضبط وعلامات الترقيم.\n4) من الدقيقة 30 إلى 35: المعلم: سؤال: ما الذي كان يشغل نورة؟ واستخلاص الفكرة العامة. — الطالب: صياغة الفكرة العامة بجملة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 17: المعلم: تنفيذ القراءة الثنائية مع استمارة معايير القراءة الجهرية على السبورة. — الطالب: القراءة بالتبادل وتقييم الزميل.\n3) من الدقيقة 18 إلى 27: المعلم: طرح أسئلة المستوى الأول ص 40 في أثناء القراءة وتدوين الإجابات الصحيحة. — الطالب: الإجابة بالعودة إلى النص ونقل الإجابات.\n4) من الدقيقة 28 إلى 35: المعلم: تكليف المجموعات بوصف مصحف نورة بكلمات من الفقرة الأولى. — الطالب: البحث في الفقرة وكتابة الصفات.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: المفردات والمعاني والأضداد في نص التيمينة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض العبارات المتضمنة كلمات (المهيب، أترابها) ومناقشة البدائل في الكتاب ص 41. — الطالب: اختيار المعنى الصحيح وتعليله من السياق.\n3) من الدقيقة 16 إلى 26: المعلم: لعبة الأضداد بالبطاقات لكلمات من الفقرة الأولى. — الطالب: مطابقة الكلمة بضدها وكتابتها في الكتاب ص 42.\n4) من الدقيقة 27 إلى 35: المعلم: بناء «جدار الكلمات» للدرس وتكليف كل مجموعة بجملة لكلمة. — الطالب: كتابة الجمل ولصقها على الجدار.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: المستوى الثاني: الاستنتاج والمقارنة بين المدرسة والكتّاب\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: رسم مخطط «فن» على السبورة وتوجيه المجموعات إلى المقارنة بين المدرسة والكتّاب. — الطالب: تعبئة المخطط بأوجه الشبه والاختلاف.\n3) من الدقيقة 17 إلى 27: المعلم: طرح سؤال: لماذا تبدو نورة متعلقة إلى هذا الحد بالتيمينة؟ بطريقة فكر-زاوج-شارك. — الطالب: الاستنتاج الفردي ثم الثنائي ثم المشاركة.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة أسئلة المستوى الثاني في الكتاب وتدوين الإجابات. — الطالب: الإجابة وكتابة الاستنتاج في الكتاب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: القراءة الجهرية الثالثة (تعدد القراءات) وأسئلة المستوى الثالث\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 17: المعلم: توزيع فقرات النص على المجموعات لتتدرب ثم تقرأ، وسحب أعواد المثلجات لاختيار القارئ. — الطالب: التدرب الجماعي ثم القراءة الفردية المعبرة.\n3) من الدقيقة 18 إلى 27: المعلم: طرح أسئلة المستوى الثالث: عنوان آخر للنص ونوعه. — الطالب: اقتراح العناوين والتصويت على أفضلها.\n4) من الدقيقة 28 إلى 35: المعلم: مسابقة قراءة سريعة بين المجموعات لجمل من النص. — الطالب: المنافسة في القراءة السليمة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: المستوى الرابع: الرأي والتجربة الشخصية في الاحتفال بختم القرآن\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: إتاحة الفرصة لسرد طريقة الاحتفال بختم القرآن في محيط الطلبة وتجاربهم. — الطالب: السرد بجمل مترابطة والاستماع للزملاء.\n3) من الدقيقة 17 إلى 27: المعلم: لعب أدوار: مقابلة صحفية مع «نورة» يطرح فيها الطلبة أسئلة عن شعورها. — الطالب: طرح أسئلة والإجابة على لسان نورة.\n4) من الدقيقة 28 إلى 35: المعلم: سؤال: هل تحب أن تكون مثل نورة؟ ولماذا؟ — الطالب: إبداء الرأي مع التعليل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: محاكاة الأسلوب: (وهي تسير جنبًا إلى جنب مع ...)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة الأسلوب بأمثلة: «وهو يمشي جنبًا إلى جنب مع أبيه». — الطالب: ترديد الأمثلة وملاحظة بنيتها.\n3) من الدقيقة 15 إلى 27: المعلم: عرض صور متنوعة وتكليف كل طالب بمحاكاة الأسلوب لكل صورة. — الطالب: كتابة جملتين في الكتاب ص 44.\n4) من الدقيقة 28 إلى 35: المعلم: قراءة الجمل وتصويبها جماعيًا. — الطالب: تحسين الجمل وقراءتها بصوت واضح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: النمط اللغوي: الاسم والفعل والحرف (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة فقرة الكتاب وقيادة الطلبة لاكتشاف الاسم (شخص أو شيء) والفعل (حدث بزمن) والحرف (لا يتم معناه إلا بغيره). — الطالب: القراءة الجهرية واستنتاج خصائص كل نوع.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «القطار الثلاثي»: ثلاث عربات (اسم، فعل، حرف) وبطاقات كلمات من النص. — الطالب: تحميل كل بطاقة في عربتها وتعليل الاختيار.\n4) من الدقيقة 28 إلى 35: المعلم: تكليف الطلبة بحل السؤال الأول في الكتاب ومناقشة الإجابات. — الطالب: الحل الفردي ثم التصحيح الجماعي.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: النمط اللغوي: تطبيقات على الاسم والفعل والحرف\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة إلى تدريب الربط ص 46 بين الكلمتين المتشابهتين في النوع. — الطالب: الربط فرديًا ثم المقارنة مع الزميل.\n3) من الدقيقة 16 إلى 27: المعلم: عرض صور تدريب ص 48 وتكليف المجموعات بإكمال الفراغ وتحديد النوع بطريقة الرؤوس المرقمة. — الطالب: إكمال الجمل وتحديد نوع الكلمة المضافة.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة الأخطاء الشائعة وتوضيحها بأمثلة. — الطالب: تصحيح الأخطاء في الكتاب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: توظيف الاسم والفعل والحرف في الحديث والكتابة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة بناء جملة من ثلاث بطاقات: فعل + اسم + حرف + اسم. — الطالب: ملاحظة ترتيب الكلمات في الجملة.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف المجموعات ببناء أطول جملة صحيحة من بطاقات الكلمات خلال وقت محدد. — الطالب: بناء الجمل وقراءتها وتحديد نوع كل كلمة.\n4) من الدقيقة 28 إلى 35: المعلم: تكليف كل طالب بكتابة جملتين عن الكتّاب توظفان الأنواع الثلاثة. — الطالب: الكتابة والقراءة على الزميل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: النمط الإملائي: التاء المربوطة والتاء المفتوحة والهاء (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض كلمات من النص ملونة الأواخر وقيادة الطلبة لاكتشاف قاعدة الوقف على كل نوع. — الطالب: النطق بالوقف والوصل واستنتاج الفرق.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «اسمعني ثم ارفع»: نطق كلمة ورفع مجسم (ـة، ت، ه) المناسب. — الطالب: الاستماع والتمييز ورفع المجسم الصحيح.\n4) من الدقيقة 28 إلى 35: المعلم: تصنيف كلمات من النص في جدول ثلاثي. — الطالب: ملء الجدول في الكتاب ص 49.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: النمط الإملائي: تدريبات التاء المربوطة والمفتوحة والهاء\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: تنفيذ نشاط خلية النحل ص 50 جماعيًا على السبورة. — الطالب: إضافة (ة، ت، ه) المناسبة لكل كلمة وقراءتها.\n3) من الدقيقة 16 إلى 27: المعلم: توجيه الطلبة لإكمال الجمل بالمفردات المعطاة (مهات، مياه، زرعت، الصلاة). — الطالب: إكمال الجمل فرديًا وقراءتها.\n4) من الدقيقة 28 إلى 35: المعلم: تصحيح ثنائي ومناقشة الأخطاء. — الطالب: تبادل الكتب والتصحيح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 15: الإملاء: الفقرة الإملائية المنظورة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة الإملائية وقراءتها ومناقشة كلماتها ثم حجبها. — الطالب: القراءة والتهجي الشفوي للكلمات الصعبة.\n3) من الدقيقة 15 إلى 27: المعلم: إملاء الفقرة بتأنٍّ مع مراعاة الوقف على الكلمات المنتهية بالأحرف الثلاثة. — الطالب: الكتابة في الكتاب ص 52.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الذاتي بعد كشف الفقرة ثم احتساب الأخطاء. — الطالب: التصحيح وإعادة كتابة الكلمات الخطأ ثلاث مرات.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 16: الخط: كتابة الحروف والكلمات بخط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف المقررة في مواضعها (أول، وسط، آخر الكلمة) على سبورة مسطرة. — الطالب: المتابعة والكتابة في الهواء ثم على السبورة الصغيرة.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بكتابة الحروف والكلمات والبيت الشعري في الكتاب ص 53. — الطالب: الكتابة بتأنٍّ مراعين الشكل والحجم.\n4) من الدقيقة 28 إلى 35: المعلم: تقييم النماذج بلطف ومنح لقب «الخطاط». — الطالب: المقارنة بالنموذج وتحسين كلمة واحدة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 17: التعبير: عنصر المكان في النص السردي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة فقرة دخول نورة إلى الكتّاب وتوجيه الطلبة لتخيل المكان وتحديد كلمات المكان. — الطالب: التخيل وتحديد كلمات المكان (يمين القاعة، اليسار، الوسط).\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بملء جدول الكتاب ص 54 (البنات، الأولاد، المعلم) ومكان كل منهم. — الطالب: تحديد مكان كل شخصية في الجدول.\n4) من الدقيقة 28 إلى 35: المعلم: رسم مخطط بسيط للكتّاب على السبورة وفق الوصف. — الطالب: رسم المخطط في الدفتر.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 18: التعبير: إعادة كتابة نص سردي يحدد الإطار المكاني\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة إعادة كتابة فقرة قصيرة مع إضافة عبارات مكانية. — الطالب: ملاحظة أثر عبارات المكان في وضوح الصورة.\n3) من الدقيقة 15 إلى 28: المعلم: تكليف الطلبة بكتابة فقرة عن يوم في الكتّاب أو المدرسة تحدد الإطار المكاني. — الطالب: الكتابة الفردية موظفين ثلاث عبارات مكانية.\n4) من الدقيقة 29 إلى 35: المعلم: مراجعة الأقران بقائمة تدقيق: هل حُدد المكان؟ هل الترقيم سليم؟ — الطالب: قراءة كتابة الزميل وتقديم ملحوظة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 19: مراجعة درس التيمينة ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: مراجعة سريعة بالبطاقات لمفردات الدرس وأنماطه. — الطالب: الإجابة السريعة بالتناوب.\n3) من الدقيقة 15 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس التيمينة. — الطالب: المنافسة واختيار الإجابة خلال الوقت.\n4) من الدقيقة 29 إلى 35: المعلم: مناقشة الأسئلة التي كثر فيها الخطأ. — الطالب: تصويب الفهم وتدوين ملحوظة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أشاهد وأتحدث: لوحة المحادثة والقرآن الكريم\n1) [مستوى الدعم] يتكون القرآن الكريم من:\nالإجابة النموذجية: سور وآيات\n2) [المستوى المتوقع] صواب أم خطأ: من آداب التلاوة الإنصات والهدوء.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] لماذا نهتم بتعليم القرآن الكريم؟\nالإجابة النموذجية: لأنه كلام الله وفيه هدايتنا\n\nالحصة 2: أتصفح: العنوان والصور والكاتبة والتوقع\n1) [مستوى الدعم] القراءة التصفحية تكون:\nالإجابة النموذجية: سريعة لأخذ فكرة عامة\n2) [المستوى المتوقع] كاتبة نص التيمينة:\nالإجابة النموذجية: جوخة الحارثية\n3) [المستوى المتقدم] من خلال الصورة نتوقع أن الرجل الكبير:\nالإجابة النموذجية: يعلّم الأطفال القرآن\n\nالحصة 3: القراءة الجهرية الأولى لنص التيمينة\n1) [مستوى الدعم] من الشخصية الرئيسة في النص؟\nالإجابة النموذجية: نورة\n2) [المستوى المتوقع] ناولت الأم نورة:\nالإجابة النموذجية: مصحفًا أخضر اللون\n3) [المستوى المتقدم] الفكرة العامة للنص:\nالإجابة النموذجية: فرحة نورة بتعلم القرآن واقتراب التيمينة\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) [مستوى الدعم] لون مصحف نورة:\nالإجابة النموذجية: أخضر\n2) [المستوى المتوقع] تدور أحداث النص حول:\nالإجابة النموذجية: قراءة القرآن الكريم في الكتّاب\n3) [المستوى المتقدم] أين جلس الصبيان في الكتّاب؟\nالإجابة النموذجية: على اليسار\n\nالحصة 5: المفردات والمعاني والأضداد في نص التيمينة\n1) [مستوى الدعم] معنى (أترابها):\nالإجابة النموذجية: صديقاتها اللاتي في مثل عمرها\n2) [المستوى المتوقع] معنى (المهيب) في «المصحف الأخضر المهيب»:\nالإجابة النموذجية: الذي يملأ النفس إجلالًا\n3) [المستوى المتقدم] ضد كلمة (الحزن):\nالإجابة النموذجية: الفرح\n\nالحصة 6: المستوى الثاني: الاستنتاج والمقارنة بين المدرسة والكتّاب\n1) [مستوى الدعم] تعلقت نورة بالتيمينة لأنها:\nالإجابة النموذجية: احتفال بختم القرآن تنتظره بشوق\n2) [المستوى المتوقع] صواب أم خطأ: يجلس الطلبة في الكتّاب في حلقات حول المعلم.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] من أوجه الشبه بين المدرسة والكتّاب:\nالإجابة النموذجية: كلاهما مكان للتعلم\n\nالحصة 7: القراءة الجهرية الثالثة (تعدد القراءات) وأسئلة المستوى الثالث\n1) [مستوى الدعم] نوع نص التيمينة:\nالإجابة النموذجية: قصصي\n2) [المستوى المتوقع] عنوان آخر مناسب للنص:\nالإجابة النموذجية: يوم ختم القرآن\n3) [المستوى المتقدم] صواب أم خطأ: في تعدد القراءات تقرأ كل مجموعة فقرة من النص.\nالإجابة النموذجية: صواب\n\nالحصة 8: المستوى الرابع: الرأي والتجربة الشخصية في الاحتفال بختم القرآن\n1) [مستوى الدعم] صواب أم خطأ: التيمينة من العادات العمانية المرتبطة بختم القرآن.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] أي صفة تناسب نورة؟\nالإجابة النموذجية: محبة للقرآن متشوقة لختمه\n3) [المستوى المتقدم] أي سؤال يتعلق بمضمون النص؟\nالإجابة النموذجية: كيف شعرت نورة بالمصحف الجديد؟\n\nالحصة 9: محاكاة الأسلوب: (وهي تسير جنبًا إلى جنب مع ...)\n1) [مستوى الدعم] أكمل المحاكاة: وهي تسير ...... مع صديقتها.\nالإجابة النموذجية: جنبًا إلى جنب\n2) [المستوى المتوقع] أي جملة حاكت الأسلوب؟\nالإجابة النموذجية: وهو يعمل جنبًا إلى جنب مع زملائه.\n3) [المستوى المتقدم] صواب أم خطأ: «جنبًا إلى جنب» تعني متجاورين معًا.\nالإجابة النموذجية: صواب\n\nالحصة 10: النمط اللغوي: الاسم والفعل والحرف (اكتشاف)\n1) [مستوى الدعم] كلمة (مصحف) نوعها:\nالإجابة النموذجية: اسم\n2) [المستوى المتوقع] كلمة (دخلت) نوعها:\nالإجابة النموذجية: فعل\n3) [المستوى المتقدم] كلمة (على) نوعها:\nالإجابة النموذجية: حرف\n\nالحصة 11: النمط اللغوي: تطبيقات على الاسم والفعل والحرف\n1) [مستوى الدعم] الكلمة المشابهة لكلمة (الغلاف) في النوع:\nالإجابة النموذجية: الكتاب\n2) [المستوى المتوقع] أكمل: ذهب الأطفال ...... الحديقة. والكلمة الناقصة نوعها حرف.\nالإجابة النموذجية: إلى\n3) [المستوى المتقدم] في جملة «الأطفال يلعبون في الحديقة» الفعل هو:\nالإجابة النموذجية: يلعبون\n\nالحصة 12: توظيف الاسم والفعل والحرف في الحديث والكتابة\n1) [مستوى الدعم] أي جملة تحتوي على اسم وفعل وحرف؟\nالإجابة النموذجية: جلست نورة في الكتّاب.\n2) [المستوى المتوقع] صواب أم خطأ: يمكن أن تتكون الجملة المفيدة من اسمين فقط.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] رتّب لتكون جملة: (المصحف - نورة - قرأت - من)\nالإجابة النموذجية: قرأت نورة من المصحف\n\nالحصة 13: النمط الإملائي: التاء المربوطة والتاء المفتوحة والهاء (اكتشاف)\n1) [مستوى الدعم] الحرف الأخير في كلمة (نورة):\nالإجابة النموذجية: تاء مربوطة\n2) [المستوى المتوقع] الحرف الأخير في كلمة (بيت):\nالإجابة النموذجية: تاء مفتوحة\n3) [المستوى المتقدم] نميز التاء المربوطة بأنها عند الوقف تُنطق:\nالإجابة النموذجية: هاءً\n\nالحصة 14: النمط الإملائي: تدريبات التاء المربوطة والمفتوحة والهاء\n1) [مستوى الدعم] أكمل: جلست الطالبـ...... في الصف.\nالإجابة النموذجية: ـة\n2) [المستوى المتوقع] أكمل: زرعـ...... أختي وردة.\nالإجابة النموذجية: ـت\n3) [المستوى المتقدم] أي كلمة صحيحة الكتابة؟\nالإجابة النموذجية: مياه\n\nالحصة 15: الإملاء: الفقرة الإملائية المنظورة\ ويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: أتصفح: التوقع من الصورة والعنوان\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: توجيه الطلبة للقراءة التصفحية للعنوان والصورة والحاشية خلال دقيقتين. — الطالب: التصفح السريع ضمن الزمن.\n3) من الدقيقة 14 إلى 26: المعلم: مناقشة أسئلة «أتصفح» ص 58: المكان، الزمان، نوع الحلوى، الكاتب، الكتاب. — الطالب: تسجيل التوقعات في الكتاب.\n4) من الدقيقة 27 إلى 35: المعلم: تدوين التوقعات على لوحة «توقعاتي» للعودة إليها بعد القراءة. — الطالب: كتابة التوقع الأهم على بطاقة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الأولى لنص «حلوى لأبي»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة نموذجية معبرة مع عرض النص على جهاز العرض وتوضيح أسماء الأماكن. — الطالب: المتابعة وتحديد أسماء الأماكن.\n3) من الدقيقة 15 إلى 29: المعلم: تنظيم القراءة الفردية بالتناوب وتصويب الأخطاء بعد إكمال الجملة. — الطالب: القراءة الجهرية مراعين الضبط.\n4) من الدقيقة 30 إلى 35: المعلم: مقارنة التوقعات بما ورد في النص واستخلاص الفكرة العامة. — الطالب: تأكيد التوقعات الصحيحة وتعديل غيرها.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: القراءة الثنائية مع استمارة معايير القراءة الجهرية. — الطالب: القراءة بالتبادل وتقييم الزميل.\n3) من الدقيقة 17 إلى 27: المعلم: توزيع بطاقات أحداث مبعثرة على المجموعات لترتيبها. — الطالب: الترتيب وعرض التسلسل.\n4) من الدقيقة 28 إلى 35: المعلم: طرح أسئلة المستوى الأول ص 63 في أثناء القراءة وتدوين الإجابات. — الطالب: الإجابة ونقلها إلى الكتاب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: المفردات والمعاني في نص «حلوى لأبي»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض العبارات المتضمنة الكلمات (ديس، رمقها) ومناقشة البدائل ص 64. — الطالب: اختيار المعنى الصحيح وتعليله بالسياق.\n3) من الدقيقة 16 إلى 26: المعلم: لعبة «ارسم الكلمة»: رسم سريع لمعنى كلمة ليخمنها الفريق الآخر. — الطالب: الرسم والتخمين.\n4) من الدقيقة 27 إلى 35: المعلم: تكليف الطلبة بكتابة جمل للمفردات الجديدة. — الطالب: كتابة جملتين وقراءتهما.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: المستوى الثاني: صفات الشخصيات ومشاعرها\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: طرح سؤال: كيف كان شعبان مع سعيد؟ وما الدليل؟ بطريقة فكر-زاوج-شارك. — الطالب: الاستنتاج مع الدليل من النص.\n3) من الدقيقة 17 إلى 27: المعلم: لعب أدوار للحوار بين سعيد وشعبان. — الطالب: التمثيل بنبرة تعبر عن المشاعر.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة أسئلة المستوى الثاني وتدوين الإجابات. — الطالب: الإجابة في الكتاب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: القراءة الجهرية الثالثة والمستوى الثالث: العنوان البديل وجدول الشخصيات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: توزيع فقرات النص على المجموعات للقراءة المتعددة. — الطالب: التدرب والقراءة المعبرة.\n3) من الدقيقة 17 إلى 27: المعلم: تكليف المجموعات بإكمال جدول الشخصيات ص 66 بالاستعانة بالنص. — الطالب: البحث في النص وتعبئة الجدول.\n4) من الدقيقة 28 إلى 35: المعلم: جمع العناوين المقترحة والتصويت على أفضلها. — الطالب: اقتراح عنوان وتعليل اختياره.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: المستوى الرابع: لو كنت مكان سعيد\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: طرح سؤال المستوى الرابع: لو كنت مكان سعيد، ما الهدية التي ستقدمها لأبيك؟ ولماذا؟ — الطالب: التفكير والإجابة بجملتين مع التعليل.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بتصميم بطاقة ترحيب للأب المسافر تتضمن جملة شكر. — الطالب: كتابة البطاقة وتزيينها.\n4) من الدقيقة 28 إلى 35: المعلم: دعوة متطوعين لقراءة فقرة أعجبتهم بصوت معبر وتعليل الإعجاب. — الطالب: القراءة والتعليل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: النمط اللغوي: الجملة الاسمية (اكتشاف المبتدأ والخبر)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض أمثلة من الدرس وقيادة الطلبة لاكتشاف أن الجملة الاسمية تبدأ باسم (مبتدأ) نخبر عنه (خبر). — الطالب: الملاحظة والاستنتاج.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «النصف الآخر»: بطاقات مبتدآت وأخبار يبحث كل طالب عن نصفه المكمل. — الطالب: البحث وتكوين جملة اسمية وقراءتها.\n4) من الدقيقة 28 إلى 35: المعلم: تحديد المبتدأ والخبر في جمل الكتاب ص 67. — الطالب: وضع خط تحت المبتدأ وخطين تحت الخبر.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: الجملة الاسمية: تطبيقات الربط والإكمال\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة لحل تدريب الربط ص 68 ومناقشة سبب كل ربط. — الطالب: الربط وكتابة الجمل.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف المجموعات بإكمال الجمل من الصندوق (ألوانها، تعطر المكان، لونها أخضر). — الطالب: الإكمال والقراءة بالتناوب.\n4) من الدقيقة 28 إلى 35: المعلم: عرض صورة وتكليف كل طالب بوصفها بجملتين اسميتين. — الطالب: الكتابة والقراءة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: النمط الإملائي: التنوين بأنواعه (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض جمل من النص تتضمن كلمات منونة وقيادة الطلبة لاكتشاف أنواع التنوين. — الطالب: القراءة وتلوين الكلمات المنونة.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «القفز على النوع»: ثلاث دوائر على الأرض لكل نوع تنوين وقراءة كلمات. — الطالب: القفز إلى الدائرة الصحيحة.\n4) من الدقيقة 28 إلى 35: المعلم: تدريب الكتاب ص 69 فرديًا. — الطالب: الحل والتصحيح الثنائي.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: التنوين: تدريبات الرسم الصحيح والإكمال\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة لاختيار الرسم الصحيح في جمل ص 70 مع التعليل. — الطالب: الاختيار والتعليل.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف المجموعات بإكمال الفراغ بكلمة (تمر) منونة وفق المطلوب بين القوسين. — الطالب: الإكمال وقراءة الجمل.\n4) من الدقيقة 28 إلى 35: المعلم: تصحيح جماعي على السبورة. — الطالب: المقارنة والتصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: الإملاء: الفقرة الإملائية المنظورة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة وقراءتها ومناقشة كلماتها المنونة ثم حجبها. — الطالب: التهجي الشفهي والتركيز على التنوين.\n3) من الدقيقة 15 إلى 27: المعلم: إملاء الفقرة بتأنٍّ. — الطالب: الكتابة في الكتاب ص 72 بخط واضح.\n4) من الدقيقة 28 إلى 35: المعلم: كشف الفقرة والتصحيح الذاتي وحساب الأخطاء. — الطالب: التصحيح وإعادة كتابة الكلمات الخطأ.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: الخط: كتابة الحروف والعبارة بخط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف (ب، ت، ث) في مواضعها وكلمات الكتاب (باب، ثابت) على سبورة مسطرة. — الطالب: الملاحظة والتتبع في الكتاب.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بكتابة الكلمات والعبارة بخط النسخ ص 73 والتجوال للتصويب. — الطالب: الكتابة بتأنٍّ مراعين الأحجام.\n4) من الدقيقة 28 إلى 35: المعلم: معرض صغير لأجمل الكتابات ومناقشة سبب جمالها. — الطالب: المقارنة وتحسين حرف واحد.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 15: التعبير: عنصر الزمان في النص السردي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة فقرة سردية وتوجيه الطلبة لتحديد كلمات الزمان (صباحًا، بعد العصر، يوم الخميس). — الطالب: تحديد العبارات ووضع خط تحتها.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «رتّب يومي»: بطاقات أحداث يوم مع عبارات زمانية. — الطالب: ترتيب الأحداث وفق الزمن وقراءتها.\n4) من الدقيقة 28 إلى 35: المعلم: تكوين بنك عبارات الزمان على السبورة. — الطالب: إضافة عبارات جديدة للبنك.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 16: التعبير: كتابة نص سردي يتضمن عبارات الزمان ومسابقة الدرس\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 12: المعلم: نمذجة كتابة بداية نص سردي: «في صباح يوم الجمعة، استيقظتُ مبكرًا...». — الطالب: الملاحظة وتحديد عبارة الزمان.\n3) من الدقيقة 13 إلى 25: المعلم: تكليف الطلبة بكتابة نص سردي من خمس جمل عن يوم عودة مسافر يتضمن ثلاث عبارات زمانية. — الطالب: الكتابة الفردية ثم مراجعة الزميل.\n4) من الدقيقة 26 إلى 35: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس حلوى لأبي. — الطالب: المنافسة والإجابة خلال الوقت.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أشاهد وأتحدث: سفر أحد أفراد الأسرة ومشاعر الانتظار\n1) [مستوى الدعم] صواب أم خطأ: نتحدث عن اللوحة بجمل مكتملة.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] لماذا يسافر بعض الآباء بعيدًا عن أسرهم؟\nالإجابة النموذجية: طلبًا للرزق والعمل\n3) [المستوى المتقدم] أي تصرف يُفرح الأب العائد من السفر؟\nالإجابة النموذجية: استقباله بالترحيب وهدية بسيطة\n\nالحصة 2: أتصفح: التوقع من الصورة والعنوان\n1) [مستوى الدعم] نستعين في التوقع قبل القراءة بـ:\nالإجابة النموذجية: العنوان والصورة\n2) [المستوى المتوقع] صواب أم خطأ: الحلوى العمانية تقدم في المناسبات وللضيوف.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] إذا ظهر في الصورة سوق قديم، فنتوقع أن المكان:\nالإجابة النموذجية: سوق شعبي\n\nالحصة 3: القراءة الجهرية الأولى لنص «حلوى لأبي»\n1) [مستوى الدعم] الشخصية الرئيسة في النص:\nالإجابة النموذجية: سعيد\n2) [المستوى المتوقع] من أين خرج سعيد؟\nالإجابة النموذجية: من سوق مطرح\n3) [المستوى المتقدم] الفكرة العامة للنص:\nالإجابة النموذجية: شوق سعيد إلى أبيه ورغبته في إسعاده بالحلوى\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) [مستوى الدعم] ماذا كان يعطي شعبان سعيدًا كلما مر به؟\nالإجابة النموذجية: ديس حلوى صغيرًا\n2) [المستوى المتوقع] صواب أم خطأ: تأمل سعيد طاحونة الهواء كعادته.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] أي حدث جاء أولًا؟\nالإجابة النموذجية: خروج سعيد من سوق مطرح\n\nالحصة 5: المفردات والمعاني في نص «حلوى لأبي»\n1) [مستوى الدعم] معنى (ديس) في النص:\nالإجابة النموذجية: إناء صغير توضع فيه الحلوى\n2) [المستوى المتوقع] معنى (رمقها):\nالإجابة النموذجية: نظر إليها\n3) [المستوى المتقدم] صواب أم خطأ: (الحارة) حي من أحياء البلدة.\nالإجابة النموذجية: صواب\n\nالحصة 6: المستوى الثاني: صفات الشخصيات ومشاعرها\n1) [مستوى الدعم] صفة شعبان المستنتجة من عطائه للحلوى:\nالإجابة النموذجية: الكرم\n2) [المستوى المتوقع] شعور سعيد تجاه أبيه:\nالإجابة النموذجية: الحب والشوق\n3) [المستوى المتقدم] صواب أم خطأ: الاستنتاج يعتمد على دليل من النص.\nالإجابة النموذجية: صواب\n\nالحصة 7: القراءة الجهرية الثالثة والمستوى الثالث: العنوان البديل وجدول الشخصيات\n1) [مستوى الدعم] عنوان آخر مناسب للنص:\nالإجابة النموذجية: هدية الشوق\n2) [المستوى المتوقع] من الأفعال التي قام بها شعبان:\nالإجابة النموذجية: نادى سعيدًا\n3) [المستوى المتقدم] صواب أم خطأ: العنوان البديل يجب أن يرتبط بمضمون النص.\nالإجابة النموذجية: صواب\n\nالحصة 8: المستوى الرابع: لو كنت مكان سعيد\n1) [مستوى الدعم] صواب أم خطأ: الهدية البسيطة تعبر عن الحب.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] أي هدية تناسب الأب العائد مع التعليل؟\nالإجابة النموذجية: بطاقة شكر لأنها تعبر عن حبي\n3) [المستوى المتقدم] نعلل إعجابنا بالفقرة بقولنا:\nالإجابة النموذجية: أعجبتني لأنها تصف شوق سعيد\n\nالحصة 9: النمط اللغوي: الجملة الاسمية (اكتشاف المبتدأ والخبر)\n1) [مستوى الدعم] الجملة الاسمية تبدأ بـ:\nالإجابة النموذجية: اسم\n2) [المستوى المتوقع] في جملة «السوق مزدحم» المبتدأ هو:\nالإجابة النموذجية: السوق\n3) [المستوى المتقدم] صواب أم خطأ: الخبر يكمل معنى المبتدأ.\nالإجابة النموذجية: صواب\n\nالحصة 10: الجملة الاسمية: تطبيقات الربط والإكمال\n1) [مستوى الدعم] اربط: القرآن الكريم ......\nالإجابة النموذجية: كلام الله\n2) [المستوى المتوقع] أكمل بالعنصر المناسب: الوردة ......\nالإجابة النموذجية: تعطر المكان\n3) [المستوى المتقدم] صواب أم خطأ: «المدرسة ساحتها نظيفة» جملة اسمية.\nالإجابة النموذجية: صواب\n\nالحصة 11: النمط الإملائي: التنوين بأنواعه (اكتشاف)\n1) [مستوى الدعم] التنوين صوت ...... نسمعه ول موذجية: خطأ\n3) [المستوى المتقدم] أي جملة تعبر عن الاشتياق؟\nالإجابة النموذجية: أنتظر عودة أبي بشوق كبير.\n\nالحصة 2: أتصفح: التوقع من الصورة والعنوان\n1) [مستوى الدعم] لماذا نكتب توقعاتنا قبل القراءة؟\nالإجابة النموذجية: لنقارنها بالنص بعد القراءة\n2) [المستوى المتوقع] صواب أم خطأ: القراءة التصفحية تستغرق وقتًا طويلًا.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] كلمة (حلوى) في العنوان نوعها:\nالإجابة النموذجية: اسم\n\nالحصة 3: القراءة الجهرية الأولى لنص «حلوى لأبي»\n1) [مستوى الدعم] صانع الحلوى في النص اسمه:\nالإجابة النموذجية: شعبان\n2) [المستوى المتوقع] صواب أم خطأ: كان أبو سعيد مسافرًا.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] لمن أراد سعيد الحلوى؟\nالإجابة النموذجية: لأبيه\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) [مستوى الدعم] ماذا كان شعبان يفعل حين حادثه سعيد؟\nالإجابة النموذجية: يقلب حلواه\n2) [المستوى المتوقع] صواب أم خطأ: ركض سعيد بما أوتي من قوة.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] من أخبر سعيدًا بموعد عودة أبيه؟\nالإجابة النموذجية: أمه\n\nالحصة 5: المفردات والمعاني في نص «حلوى لأبي»\n1) [مستوى الدعم] أي جملة وظفت (رمق) توظيفًا صحيحًا؟\nالإجابة النموذجية: رمق الطفل الطائرة في السماء.\n2) [المستوى المتوقع] ضد (سريعًا):\nالإجابة النموذجية: ببطء\n3) [المستوى المتقدم] صواب أم خطأ: طاحونة الهواء تدور بقوة الريح.\nالإجابة النموذجية: صواب\n\nالحصة 6: المستوى الثاني: صفات الشخصيات ومشاعرها\n1) [مستوى الدعم] عبارة «الرجل الطيب الذي لا يبخل عليه» تدل على أن شعبان:\nالإجابة النموذجية: كريم طيب\n2) [المستوى المتوقع] صواب أم خطأ: كان سعيد غير مهتم بعودة أبيه.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] لماذا ركض سعيد سريعًا؟\nالإجابة النموذجية: شوقًا لإنجاز ما يسعد أباه\n\nالحصة 7: القراءة الجهرية الثالثة والمستوى الثالث: العنوان البديل وجدول الشخصيات\n1) [مستوى الدعم] صفة تناسب سعيدًا:\nالإجابة النموذجية: محب لعائلته\n2) [المستوى المتوقع] صواب أم خطأ: في تعدد القراءات تتدرب المجموعة قبل القراءة.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] كلمة تعبر عن مشاعر سعيد:\nالإجابة النموذجية: الشوق\n\nالحصة 8: المستوى الرابع: لو كنت المعلم: التعريف بآداب استعارة الكتب ومعايير اختيار القصة المناسبة. — الطالب: تصفح القصص واختيار واحدة.\n3) من الدقيقة 14 إلى 28: المعلم: تخصيص وقت للقراءة الصامتة الحرة ومتابعة الطلبة. — الطالب: القراءة الصامتة لقصة مختارة.\n4) من الدقيقة 29 إلى 35: المعلم: توجيه الطلبة لتعبئة بطاقة التعريف بالقصة ص 55. — الطالب: تعبئة البطاقة من غلاف القصة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: بين رفوف مكتبتي: رأيي في القصة وسرد أحداثها\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توضيح طريقة التعبير عن الرأي (أعجبني... لأن / لم يعجبني... لأن). — الطالب: ملء جدول الرأي في الكتاب ص 55.\n3) من الدقيقة 15 إلى 28: المعلم: تنظيم «كرسي الراوي»: يجلس الطالب ويسرد أحداث قصته. — الطالب: السرد بترتيب والاستماع للزملاء وطرح سؤال.\n4) من الدقيقة 29 إلى 35: المعلم: مناقشة أجمل ما سمعوه واقتراح قصص للاستعارة. — الطالب: التصويت على قصة الأسبوع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: بين رفوف مكتبتي: قراءة حرة وجمع كلمات جديدة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 19: المعلم: تخصيص وقت للقراءة الصامتة الحرة ومتابعة الطلبة فرديًا. — الطالب: القراءة وتدوين الكلمات الجديدة.\n3) من الدقيقة 20 إلى 29: المعلم: توجيه الطلبة لاستنتاج معاني كلماتهم من السياق أو المعجم المصور. — الطالب: كتابة المعنى وجملة لكل كلمة.\n4) من الدقيقة 30 إلى 35: المعلم: جمع الكلمات في «شجرة الكلمات» الصفية. — الطالب: لصق البطاقات على الشجرة وقراءتها.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: بين رفوف مكتبتي: صنع قناع لشخصية أعجبتني\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توضيح خطوات صنع القناع وتوزيع الأدوات. — الطالب: اختيار الشخصية والتخطيط للقناع.\n3) من الدقيقة 15 إلى 28: المعلم: متابعة الطلبة أثناء صنع الأقنعة. — الطالب: صنع القناع وكتابة جملتين على لسان الشخصية.\n4) من الدقيقة 29 إلى 35: المعلم: تقديم عروض قصيرة بالأقنعة. — الطالب: التحدث بلسان الشخصية بثقة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: بين رفوف مكتبتي: خريطة القصة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 19: المعلم: تخصيص وقت للقراءة الحرة لقصة قصيرة. — الطالب: القراءة الصامتة.\n3) من الدقيقة 20 إلى 29: المعلم: توجيه الطلبة لملء خريطة القصة. — الطالب: تعبئة الخريطة.\n4) من الدقيقة 30 إلى 35: المعلم: عرض خريطتين متميزتين. — الطالب: الاستماع والمقارنة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: بين رفوف مكتبتي: أنا وقصتي (رسم مشهد)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توضيح المطلوب ومعايير الرسم والوصف. — الطالب: اختيار المشهد.\n3) من الدقيقة 15 إلى 29: المعلم: متابعة الطلبة أثناء الرسم والكتابة. — الطالب: الرسم وكتابة جملتين.\n4) من الدقيقة 30 إلى 35: المعلم: جولة معرض صغير بين الطاولات. — الطالب: التجول والتعليق اللطيف.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: بين رفوف مكتبتي: تبادل القصص وبطاقة توصية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توضيح عناصر بطاقة التوصية (العنوان، سبب التوصية، لمن تناسب). — الطا الزمن: 4 دقائق)\n\nالحصة 12: اللام الشمسية والقمرية: التصنيف وإكمال الفقرة\nتحدٍّ: اذكر كلمة بلام شمسية تبدأ بحرف (ن) وأخرى بلام قمرية تبدأ بحرف (ب). (الزمن: 4 دقائق)\n\nالحصة 13: الإملاء: الفقرة الإملائية المنظورة\nقراءة كلمات بلام شمسية بصوت المعلم ليكتبها الطلبة على السبورة الصغيرة. (الزمن: 4 دقائق)\n\nالحصة 14: الخط: كتابة الحروف والكلمات بخط النسخ\nلعبة «ارسم الحرف في الهواء» بإصبع اليد مع العد. (الزمن: 4 دقائق)\n\nالحصة 15: التعبير: المكان والزمان معًا في الفقرة\nلعبة «متى؟ أين؟»: يرفع الطلبة بطاقة «متى» أو «أين» عند سماع عبارة. (الزمن: 4 دقائق)\n\nالحصة 16: التعبير: كتابة نص قصير يصف احتفال المدرسة بالعيد الوطني\nعرض صور احتفال مدرسي بالعيد الوطني وسؤال: ماذا فعلنا في احتفال العام الماضي؟ (الزمن: 4 دقائق)\n\nالحصة 17: تحرير الكتابة وتحسينها بالتقويم الذاتي\nعرض جملة فيها خطأ إملائي وترقيمي وسؤال: من يكتشف الخطأين؟ (الزمن: 4 دقائق)\n\nالحصة 18: مراجعة درس «رفاق المجد» ومسابقة المجموعات\nإنشاد الأبيات جماعيًا للتهيئة. (الزمن: 4 دقائق)", "الحصة 1: أشاهد وأتحدث: علم عُمان والتعاون\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض لوحة المحادثة (مسرح دمى يدل على التعاون) ومناقشة عناصرها. — الطالب: وصف اللوحة بجمل مترابطة.\n3) من الدقيقة 16 إلى 27: المعلم: توجيه المجموعات للحديث عن معاني ألوان العلم ومواقف احترامه. — الطالب: التحدث وتسجيل الأفكار.\n4) من الدقيقة 28 إلى 35: المعلم: العصف الذهني: كيف يتعاون أبناء الوطن لرفعته؟ — الطالب: اقتراح صور التعاون.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: أتصفح: المقصود برفاق المجد ونوع النص\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: توجيه الطلبة لتصفح النص سريعًا وملاحظة شكله وصوره. — الطالب: التصفح وملاحظة الأبيات.\n3) من الدقيقة 14 إلى 26: المعلم: مناقشة أسئلة «أتصفح» ص 76: المقصود برفاق المجد، علاقة أطفال المدارس بصور الوظائف، نوع النص. — الطالب: الإجابة وتسجيل التوقعات.\n4) من الدقيقة 27 إلى 35: المعلم: مقارنة شكل النص الشعري بالنص القصصي في الدرسين السابقين. — الطالب: ذكر الفروق (أبيات، قافية، إيقاع).\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الأولى لنص «رفاق المجد»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: إلقاء نموذجي معبر للأبيات أو تشغيل تسجيلها مع إبراز الإيقاع. — الطالب: المتابعة والإنصات.\n3) من الدقيقة 15 إلى 29: المعلم: تنظيم القراءة الفردية بيتًا بيتًا وتصويب النطق والوقف. — الطالب: القراءة الجهرية مراعين الإيقاع.\n4) من الدقيقة 30 إلى 35: المعلم: استخلاص الفكرة العامة بسؤال: إلى ماذا ينادي العصفور؟ — الطالب: صياغة الفكرة العامة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: القراءة الثنائية بالمعايير ثم القراءة الجماعية. — الطالب: القراءة وتقييم الزميل.\n3) من الدقيقة 17 إلى 27: المعلم: طرح أسئلة المستوى الأول ص 79: على لسان من يتحدث الشاعر؟ ما الذي يدعو إليه؟ الشخصيات؟ — الطالب: البحث في الأبيات والإجابة.\n4) من الدقيقة 28 إلى 35: المعلم: استخراج أفعال الأمر التي وجهها الشاعر للرفاق. — الطالب: الاستخراج والكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: المفردات والمعاني في «رفاق المجد»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مناقشة معاني (العون، الجد، الندي، هيا) من سياق الأبيات. — الطالب: الاستنتاج وكتابة المعاني.\n3) من الدقيقة 16 إلى 26: المعلم: لعبة «زوج المرادفات»: بطاقات كلمات ومرادفاتها. — الطالب: المطابقة وقراءة الأزواج.\n4) من الدقيقة 27 إلى 35: المعلم: تكليف الطلبة بتوظيف كلمتين في جمل عن المدرسة. — الطالب: الكتابة والقراءة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: المستوى الثاني: العلاقة بين العنوان والمضمون وأدلة الأبيات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: تطبيق فكر-زاوج-شارك على سؤال العلاقة بين العنوان والمضمون. — الطالب: التفكير والمناقشة والمشاركة.\n3) من الدقيقة 17 إلى 27: المعلم: تكليف المجموعات بتحديد أرقام الأبيات الدالة على المعاني في الكتاب ص 81. — الطالب: البحث وكتابة رقم البيت.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة الإجابات وتدوين الصحيح على السبورة. — الطالب: التصحيح ونقل الإجابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: المستويان الثالث والرابع: عنوان آخر ورأيي وحلمي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: جمع العناوين المقترحة مع أسبابها والتصويت عليها. — الطالب: اقتراح العنوان والتعليل.\n3) من الدقيقة 15 إلى 27: المعلم: توزيع بطاقات «حلمي» ليكتب الطالب حلمه وثلاث خطوات لتحقيقه. — الطالب: الكتابة والمشاركة.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة الرأي في دعوات الشاعر. — الطالب: إبداء الرأي مع التعليل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: النمط اللغوي: المفرد والمثنى والجمع (اكتشاف من الأبيات)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة الأبيات وملاحظة الكلمات الملونة (العصفور، جناحان، رفاق) واستنتاج الصيغ. — الطالب: القراءة والتصنيف الشفهي.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «ألوان الصيغ»: بطاقة خضراء للمفرد وزرقاء للمثنى ووردية للجمع. — الطالب: رفع البطاقة المناسبة لكل كلمة تُقرأ.\n4) من الدقيقة 28 إلى 35: المعلم: تدريب الكتاب ص 84. — الطالب: الحل الفردي ثم المقارنة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: المفرد والمثنى والجمع: تطبيقات التلوين والتحويل\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة إلى نشاط الشبكة ص 86 وتلوين الصيغ (أخضر، أزرق، وردي). — الطالب: البحث والتلوين.\n3) من الدقيقة 16 إلى 27: المعلم: تحويل جمل من المفرد إلى المثنى والجمع على السبورة مع تغيير ما يلزم. — الطالب: التحويل الشفهي والكتابي.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الثنائي. — الطالب: تبادل الكتب والمراجعة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: المفرد والمثنى والجمع: أعضاء الإنسان في الآيات الكريمة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض الآيات في الكتاب ص 88 وقراءتها قراءة صحيحة. — الطالب: الاستماع والتلاوة.\n3) من الدقيقة 16 إلى 27: المعلم: توجيه الطلبة لوضع خط تحت أعضاء الإنسان وحواسه ثم تحويلها إلى المفرد. — الطالب: الاستخراج والتحويل في الكتاب.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة: كيف نشكر الله على نعمة الحواس؟ — الطالب: ذكر صور الشكر.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: النمط الإملائي: اللام الشمسية واللام القمرية (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة الأبيات ص 90 واكتشاف الكلمات بلام شمسية ولام قمرية. — الطالب: القراءة ووضع الخط.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «الشمس والقمر»: قسم الصف إلى فريقين، ينهض فريق الشمس عند سماع كلمة بلام شمسية. — الطالب: الاستماع والاستجابة.\n4) من الدقيقة 28 إلى 35: المعلم: تلخيص القاعدة: اللام الشمسية تكتب ولا تنطق ويشدد الحرف بعدها. — الطالب: صياغة القاعدة بأسلوبهم.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: اللام الشمسية والقمرية: التصنيف وإكمال الفقرة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة لتصنيف الكلمات في جدول الكتاب ص 91 كما في المثال. — الطالب: التصنيف الفردي.\n3) من الدقيقة 16 إلى 27: المعلم: عرض صور الفقرة ص 92 وإكمالها ثنائيًا بكلمات تحتوي على اللامين. — الطالب: الإكمال الثنائي وقراءة الفقرة.\n4) من الدقيقة 28 إلى 35: المعلم: تصحيح جماعي على السبورة الذكية. — الطالب: المقارنة والتصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: الإملاء: الفقرة الإملائية المنظورة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة وقراءتها ومناقشة الكلمات بلام شمسية التي لا تنطق لامها ثم حجبها. — الطالب: التهجي الشفهي.\n3) من الدقيقة 15 إلى 27: المعلم: إملاء الفقرة بتأنٍّ. — الطالب: الكتابة في الكتاب ص 94.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الذاتي ثم إعادة كتابة الفقرة سليمة. — الطالب: التصحيح وإعادة الكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: الخط: كتابة الحروف والكلمات بخط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف المقررة وكلمات النموذج على سبورة مسطرة. — الطالب: المتابعة والتتبع.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بالكتابة في الكتاب والتجوال لتصويب الجلسة والمسك. — الطالب: الكتابة بتأنٍّ.\n4) من الدقيقة 28 إلى 35: المعلم: تقييم ذاتي بمقارنة الكتابة بالنموذج. — الطالب: وضع نجمة على أجمل كلمة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 15: التعبير: المكان والزمان معًا في الفقرة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة فقرة الكتاب «في صباح يوم الخميس الماضي قصدت ميدان الاحتفال...» وتوجيه الطلبة لوضع خط تحت المكان وخطين تحت الزمان. — الطالب: القراءة والتحديد.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف المجموعات بإعادة ترتيب بطاقات عبارات مكانية وزمانية في جدول. — الطالب: التصنيف والعرض.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة أهمية المكان والزمان في وضوح النص. — الطالب: ذكر الفائدة بأسلوبهم.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 16: التعبير: كتابة نص قصير يصف احتفال المدرسة بالعيد الوطني\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: تحديد مراحل الاحتفال على السبورة (رفع العلم، ترديد النشيد، كلمة المدير...) مع عبارات المكان والزمان. — الطالب: ترتيب المراحل شفهيًا.\n3) من الدقيقة 15 إلى 28: المعلم: تكليف الطلبة بكتابة نص قصير (5–6 جمل) يصف الاحتفال في الثامن عشر من نوفمبر. — الطالب: الكتابة الفردية.\n4) من الدقيقة 29 إلى 35: المعلم: قراءة نماذج وتقديم تغذية راجعة. — الطالب: الاستماع والتحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 17: تحرير الكتابة وتحسينها بالتقويم الذاتي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توزيع قائمة تدقيق (المكان، الزمان، الترتيب، الترقيم، الإملاء). — الطالب: مراجعة النص ذاتيًا.\n3) من الدقيقة 15 إلى 27: المعلم: تنفيذ مراجعة الأقران وتبادل النصوص. — الطالب: قراءة نص الزميل وكتابة ملحوظتين.\n4) من الدقيقة 28 إلى 35: المعلم: تكليف الطلبة بإعادة كتابة النص المحسن. — الطالب: إعادة الكتابة بخط واضح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 18: مراجعة درس «رفاق المجد» ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: مراجعة سريعة بالأسئلة الخاطفة على أقسام الدرس. — الطالب: الإجابة بالتناوب.\n3) من الدقيقة 15 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس رفاق المجد. — الطالب: المنافسة والإجابة خلال الوقت.\n4) من الدقيقة 29 إلى 35: المعلم: تقويم ذاتي: ما المهارة التي أتقنتها؟ وما التي أحتاج إلى تدريب عليها؟ — الطالب: كتابة جملة تقويم ذاتي.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أشاهد وأتحدث: علم عُمان والتعاون\n1) [مستوى الدعم] ألوان علم سلطنة عُمان:\nالإجابة النموذجية: الأحمر والأبيض والأخضر\n2) [المستوى المتوقع] صواب أم خطأ: نقف احترامًا عند رفع العلم وأداء السلام السلطاني.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] كيف نسهم في رفعة الوطن ونحن صغار؟\nالإجابة النموذجية: بالجد في الدراسة والتعاون\n\nالحصة 2: أتصفح: المقصود برفاق المجد ونوع النص\n1) [مستوى الدعم] نوع نص «رفاق المجد»:\nالإجابة النموذجية: شعري\n2) [المستوى المتوقع] نعرف النص الشعري من:\nالإجابة النموذجية: أبياته وإيقاعه\n3) [المستوى المتقدم] صواب أم خطأ: رفاق المجد هم الأطفال الذين يجدّون لبناء مستقبلهم ووطنهم.\nالإجابة النموذجية: صواب\n\nالحصة 3: القراءة الجهرية الأولى لنص «رفاق المجد»\n1) [مستوى الدعم] من الذي نادى رفاق المجد في النص؟\nالإجابة النموذجية: العصفور\n2) [المستوى المتوقع] الفكرة العامة للنص:\nالإجابة النموذجية: دعوة الأطفال إلى الجد والتعاون لبناء المستقبل\n3) [المستوى المتقدم] صواب أم خطأ: نقرأ الشعر مراعين الإيقاع.\nالإجابة النموذجية: صواب\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) [مستوى الدعم] يتحدث الشاعر على لسان:\nالإجابة النموذجية: العصفور\n2) [المستوى المتوقع] من أفعال الأمر في النص:\nالإجابة النموذجية: ساعدوا\n3) [المستوى المتقدم] صواب أم خطأ: يدعو النص إلى التعاون ومساعدة الآخرين.\nالإجابة النموذجية: صواب\n\nالحصة 5: المفردات والمعاني في «رفاق المجد»\n1) [مستوى الدعم] مرادف (العون):\nالإجابة النموذجية: المساعدة\n2) [المستوى المتوقع] مرادف (الجد):\nالإجابة النموذجية: الاجتهاد\n3) [المستوى المتقدم] (هيا) كلمة تدل على:\nالإجابة النموذجية: الحث والدعوة\n\nالحصة 6: المستوى الثاني: العلاقة بين العنوان والمضمون وأدلة الأبيات\n1) [مستوى الدعم] العلاقة بين العنوان والمضمون:\nالإجابة النموذجية: النص ينادي الأطفال ليكونوا صناع مجد\n2) [المستوى المتوقع] صواب أم خطأ: نستدل على المعنى برقم البيت الذي ورد فيه.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] البيت الذي يدعو إلى المساعدة فيه كلمة:\nالإجابة النموذجية: ساعدوا\n\nالحصة 7: المستويان الثالث والرابع: عنوان آخر ورأيي وحلمي\n1) [مستوى الدعم] عنوان آخر مناسب للنص:\nالإجابة النموذجية: هيا نصنع المستقبل\n2) [المستوى المتوقع] صواب أم خطأ: نذكر سبب اختيارنا للعنوان البديل.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] أي خطوة تساعد على تحقيق الحلم؟\nالإجابة النموذجية: الاجتهاد في الدراسة يوميًا\n\nالحصة 8: النمط اللغوي: المفرد والمثنى والجمع (اكتشاف من الأبيات)\n1) [مستوى الدعم] كلمة (جناحان) تدل على:\nالإجابة النموذجية: المثنى\n2) [المستوى المتوقع] كلمة (رفاق) تدل على:\nالإجابة النموذجية: الجمع\n3) [المستوى المتقدم] مفرد (رفاق):\nالإجابة النموذجية: رفيق\n\nالحصة 9: المفرد والمثنى والجمع: تطبيقات التلوين والتحويل\n1) [مستوى الدعم] مثنى (طالب) في «حضر الطالب»:\nالإجابة النموذجية: الطالبان\n2) [المستوى المتوقع] جمع (طالب):\nالإجابة النموذجية: طلاب\n3) [المستوى المتقدم] صواب أم خطأ: «رأيت المعلمين» فيها مثنى.\nالإجابة النموذجية: صواب\n\nالحصة 10: المفرد والمثنى والجمع: أعضاء الإنسان في الآيات الكريمة\n1) [مستوى الدعم] مفرد (عينين):\nالإجابة النموذجية: عين\n2) [المستوى المتوقع] مفرد (أصابع):\nالإجابة النموذجية: إصبع\n3) [المستوى المتقدم] صواب أم خطأ: (شفتين) مثنى.\nالإجابة النموذجية: صواب\n\nالحصة 11: النمط الإملائي: اللام الشمسية واللام القمرية (اكتشاف)\n1) [مستوى الدعم] كلمة (الصبح) لامها:\nالإجابة النموذجية: شمسية\n2) [المستوى المتوقع] كلمة (العصفور) لامها:\nالإجابة النموذجية: قمرية\n3) [المستوى المتقدم] صواب أم خطأ: يأتي بعد اللام الشمسية حرف مشدد.\nالإجابة النموذجية: صواب\n\nالحصة 12: اللام الشمسية والقمرية: التصنيف وإكمال الفقرة\n1) [مستوى الدعم] كلمة (النهر) تصنف:\nالإجابة النموذجية: شمسية\n2) [المستوى المتوقع] كلمة (الطيور) تصنف:\nالإجابة النموذجية: شمسية\n3) [المستوى المتقدم] صواب أم خطأ: (الجميلة) كلمة بلام قمرية.\nالإجابة النموذجية: صواب\n\nالحصة 13: الإملاء: الفقرة الإملائية المنظورة\n1) [مستوى الدعم] الكتابة الصحيحة:\nالإجابة النموذجية: الشمس\n2) [المستوى المتوقع] صواب أم خطأ: نكتب اللام في (النجوم) رغم أنها لا تنطق.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] الكلمة الصحيحة:\nالإجابة النموذجية: السماء\n\nالحصة 14: الخط: كتابة الحروف والكلمات بخط النسخ\n1) [مستوى الدعم] صواب أم خطأ: الجلسة الصحيحة تساعد على جمال الخط.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] نكتب الحرف بخط النسخ ......\nالإجابة النموذجية: وفق النموذج\n3) [المستوى المتقدم] أي حرف ينتهي تحت السطر في آخر الكلمة؟\nالإجابة النموذجية: النون\n\nالحصة 15: التعبير: المكان والزمان معًا في الفقرة\n1) [مستوى الدعم] عبارة الزمان في الفقرة:\nالإجابة النموذجية: في صباح يوم الخميس الماضي\n2) [المستوى المتوقع] عبارة المكان في الفقرة:\nالإجابة النموذجية: ميدان الاحتفال\n3) [المستوى المتقدم] صواب أم خطأ: نضع خطين تحت الكلمات الدالة على الزمان.\nالإجابة النموذجية: صواب\n\nالحصة 16: التعبير: كتابة نص قصير يصف احتفال المدرسة بالعيد الوطني\n1) [مستوى الدعم] يحتفل العمانيون بالعيد الوطني في:\nالإجابة النموذجية: الثامن عشر من نوفمبر\n2) [المستوى المتوقع] أول مراحل الاحتفال المدرسي عادة:\nالإجابة النموذجية: رفع العلم\n3) [المستوى المتقدم] صواب أم خطأ: نرتب مراحل الاحتفال في النص حسب وقوعها.\nالإجابة النموذجية: صواب\n\nالحصة 17: تحرير الكتابة وتحسينها بالتقويم الذاتي\n1) [مستوى الدعم] صواب أم خطأ: مراجعة النص تكون بعد الانتهاء من كتابته.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] من عناصر قائمة التدقيق:\nالإجابة النموذجية: الترقيم والإملاء\n3) [المستوى المتقدم] إذا وجدت خطأ في نص زميلك فإنك:\nالإجابة النموذجية: تخبره بلطف وتقترح التصحيح\n\nالحصة 18: مراجعة درس «رفاق المجد» ومسابقة المجموعات\n1) [مستوى الدعم] نادى العصفور رفاق المجد بكلمة:\nالإجابة النموذجية: هيا\n2) [المستوى المتوقع] جمع (رفيق):\nالإجابة النموذجية: رفاق\n3) [المستوى المتقدم] كلمة (الشمس) لامها:\nالإجابة النموذجية: شمسية", "الحصة 1: أشاهد وأتحدث: علم عُمان والتعاون\n1) [مستوى الدعم] يرمز العلم إلى:\nالإجابة النموذجية: الوطن وعزته\n2) [المستوى المتوقع] صواب أم خطأ: التعاون يجعل العمل الصعب سهلًا.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] أي موقف يدل على احترام العلم؟\nالإجابة النموذجية: المحافظة عليه نظيفًا مرفوعًا\n\nالحصة 2: أتصفح: المقصود برفاق المجد ونوع النص\n1) [مستوى الدعم] تدل صور الوظائف في الدرس على:\nالإجابة النموذجية: أحلام الأطفال في المستقبل\n2) [المستوى المتوقع] صواب أم خطأ: النص الشعري يتكون من فقرات طويلة.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] كلمة (المجد) تعني:\nالإجابة النموذجية: الرفعة والعزة\n\nالحصة 3: القراءة الجهرية الأولى لنص «رفاق المجد»\n1) [مستوى الدعم] الكلمة التي تبدأ بها الأبيات:\nالإجابة النموذجية: زقزق\n2) [المستوى المتوقع] صواب أم خطأ: يدعو النص إلى التكاسل.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] يقصد العصفور برفاق المجد:\nالإجابة النموذجية: الأطفال المجتهدين\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) [مستوى الدعم] أمر الشاعر الرفاق بأن ......\nالإجابة النموذجية: يبكروا بالجد\n2) [المستوى المتوقع] صواب أم خطأ: «قدموا العون» دعوة إلى المساعدة.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] من الدعوات في النص:\nالإجابة النموذجية: تحقيق الحلم بالعمل\n\nالحصة 5: المفردات والمعاني في «رفاق المجد»\n1) [مستوى الدعم] صواب أم خطأ: الصبح الندي هو الصباح الذي تظهر فيه قطرات الندى.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] أي جملة وظفت (العون) توظيفًا صحيحًا؟\nالإجابة النموذجية: قدمت العون لجدي في حمل أغراضه.\n3) [المستوى المتقدم] ضد (الجد):\nالإجابة النموذجية: الكسل\n\nالحصة 6: المستوى الثاني: العلاقة بين العنوان والمضمون وأدلة الأبيات\n1) [مستوى الدعم] ترك التكاسل في تحقيق الأحلام يدل عليه قول الشاعر:\nالإجابة النموذجية: بكروا بالجد واسعوا\n2) [المستوى المتوقع] صواب أم خطأ: العنوان يلخص فكرة النص.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] لماذا يحتاج الحلم إلى عمل؟\nالإجابة النموذجية: لأن الأحلام لا تتحقق بالتمني وحده\n\nالحصة 7: المستويان الثالث والرابع: عنوان آخر ورأيي وحلمي\n1) [مستوى الدعم] أي رأي معلل؟\nالإجابة النموذجية: أؤيد الشاعر لأن التعاون يقوي المجتمع.\n2) [المستوى المتوقع] صواب أم خطأ: الحلم يتحقق دون عمل.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] أي هدف قريب يناسب طالبًا في الصف الثالث؟\nالإجابة النموذجية: أن أحفظ جدول الضرب هذا الشهر\n\nالحصة 8: النمط اللغوي: المفرد والمثنى والجمع (اكتشاف من الأبيات)\n1) [مستوى الدعم] صواب أم خطأ: نكون المثنى بزيادة (ان) أو (ين) على المفرد.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] مثنى (عصفور):\nالإجابة النموذجية: عصفوران\n3) [المستوى المتقدم] أي الكلمات جمع؟\nالإجابة النموذجية: الناس\n\nالحصة 9: المفرد والمثنى والجمع: تطبيقات التلوين والتحويل\n1) [مستوى الدعم] حوّل إلى الجمع: العامل نشيط.\nالإجابة النموذجية: العمال نشيطون\n2) [المستوى المتوقع] مثنى (شجرة) في «سقيت الشجرة»:\nالإجابة النموذجية: الشجرتين\n3) [المستوى المتقدم] صواب أم خطأ: «الأطفال» مفرد.\nالإجابة النموذجية: خطأ\n\nالحصة 10: المفرد والمثنى والجمع: أعضاء الإنسان في الآيات الكريمة\n1) [مستوى الدعم] مفرد (عظام):\nالإجابة النموذجية: عظم\n2) [المستوى المتوقع] جمع (أذن):\nالإجابة النموذجية: آذان\n3) [المستوى المتقدم] كيف نشكر الله على نعمة البصر؟\nالإجابة النموذجية: بالنظر إلى ما ينفع\n\nالحصة 11: النمط الإملائي: اللام الشمسية واللام القمرية (اكتشاف)\n1) [مستوى الدعم] كلمة (ا
