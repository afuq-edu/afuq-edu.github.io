«مخطط السمكة»: الرأس بداية، الجسم وسط، الذيل نهاية. (الزمن: 4 دقائق)\n\nالحصة 17: التعبير: كتابة نص سردي ببنية متكاملة\nسؤال: لو كنت بحارًا في رحلة جديدة، فما المشكلة التي قد تواجهها؟ (الزمن: 4 دقائق)\n\nالحصة 18: مراجعة درس السندباد ومسابقة المجموعات\nلعبة «البوصلة»: يدير المعلم سهمًا يشير إلى مجموعة تجيب عن سؤال سريع. (الزمن: 4 دقائق)", "الحصة 1: أشاهد وأتحدث: البحر وتاريخ عُمان البحري\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض لوحة المحادثة ومطالبة الطلبة بوصفها والحديث عن فوائد البحر. — الطالب: الوصف بجمل مترابطة.\n3) من الدقيقة 16 إلى 27: المعلم: مناقشة: لماذا اشتهر العمانيون بالملاحة؟ وتدوين الأفكار. — الطالب: ذكر ما يعرفونه من تاريخ عُمان البحري.\n4) من الدقيقة 28 إلى 35: المعلم: العصف الذهني: ما الذي يحتاجه البحار في رحلته؟ — الطالب: اقتراح الحاجات وتصنيفها.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: أتصفح: العنوان والصور والتوقع\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: توجيه الطلبة للقراءة التصفحية للعنوان والصور. — الطالب: التصفح السريع.\n3) من الدقيقة 14 إلى 26: المعلم: مناقشة أسئلة «أتصفح» وتسجيل التوقعات حول «الرحلة الثامنة». — الطالب: التوقع والتسجيل.\n4) من الدقيقة 27 إلى 35: المعلم: ربط التوقعات بعنوان المحور «علوم واكتشافات». — الطالب: مناقشة العلاقة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الأولى لنص «رحلة السندباد الثامنة»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة نموذجية معبرة مع عرض النص وإبراز مواضع التشويق. — الطالب: المتابعة وتحديد الكلمات الصعبة.\n3) من الدقيقة 15 إلى 29: المعلم: القراءة الفردية بالتناوب مع التصويب بعد إكمال الجملة. — الطالب: القراءة الجهرية.\n4) من الدقيقة 30 إلى 35: المعلم: مقارنة التوقعات بأحداث النص واستخلاص الفكرة العامة. — الطالب: صياغة الفكرة العامة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: القراءة الثنائية بمعايير القراءة. — الطالب: القراءة وتقييم الزميل.\n3) من الدقيقة 17 إلى 27: المعلم: طرح أسئلة المستوى الأول في أثناء القراءة. — الطالب: الإجابة من النص.\n4) من الدقيقة 28 إلى 35: المعلم: ترتيب بطاقات الأحداث في المجموعات. — الطالب: الترتيب والعرض.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: المفردات والمعاني في نص السندباد\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مناقشة معاني (قيد أنملة، هبات النسيم، الأشرعة، العذب) من السياق. — الطالب: الاستنتاج والكتابة.\n3) من الدقيقة 16 إلى 26: المعلم: لعبة «قاموس البحر» بين المجموعات. — الطالب: المطابقة بين الكلمة والصورة والمعنى.\n4) من الدقيقة 27 إلى 35: المعلم: توظيف ثلاث مفردات في جمل. — الطالب: الكتابة والقراءة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: المستوى الثاني: مشاعر البحارة وصفاتهم\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: فكر-زاوج-شارك: كيف شعر البحارة حين توقفت السفينة؟ وحين هبت الريح؟ — الطالب: الاستنتاج مع الدليل.\n3) من الدقيقة 17 إلى 27: المعلم: لعب أدوار لحوار بين بحارين في وقت الشدة. — الطالب: التمثيل والتعبير عن المشاعر.\n4) من الدقيقة 28 إلى 35: المعلم: استخلاص صفات البحارة وتدوينها. — الطالب: الكتابة مع الدليل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: القراءة الثالثة والمستوى الثالث: الأحداث الكبرى والعنوان البديل\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: توزيع فقرات النص على المجموعات للقراءة المتعددة. — الطالب: التدرب والقراءة.\n3) من الدقيقة 17 إلى 27: المعلم: تكليف المجموعات بتحديد ثلاثة أحداث كبرى في النص. — الطالب: التحديد والعرض.\n4) من الدقيقة 28 إلى 35: المعلم: اقتراح عناوين بديلة والتصويت عليها. — الطالب: الاقتراح والتعليل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: المستوى الرابع: لو كنت بحارًا على السفينة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: طرح سؤال المستوى الرابع: لو كنت أحد البحارة فكيف تتصرف حين نقص الطعام؟ — الطالب: التخيل والإجابة بجمل معللة.\n3) من الدقيقة 16 إلى 27: المعلم: تمثيل «اجتماع البحارة» لاتخاذ قرار في وقت الشدة. — الطالب: لعب الأدوار واتخاذ القرار بالتشاور.\n4) من الدقيقة 28 إلى 35: المعلم: إبداء الرأي في تصرف البحارة وكتابة جملتين. — الطالب: الكتابة والقراءة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: النمط اللغوي: الجملة الفعلية (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: رسم جدول (فعل، فاعل) واستخراج جمل فعلية من النص. — الطالب: الاستخراج والتصنيف.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «من فعل؟»: ذكر فعل ليذكر الطلبة فاعلًا مناسبًا. — الطالب: تكوين جمل فعلية شفهيًا.\n4) من الدقيقة 28 إلى 35: المعلم: التمييز بين الجملة الاسمية والفعلية في جمل الكتاب. — الطالب: التصنيف.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: الجملة الفعلية: تطبيقات تحديد الفعل والفاعل\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة لتدريبات الكتاب ص 35 في تحديد الفعل والفاعل. — الطالب: الحل الفردي.\n3) من الدقيقة 16 إلى 27: المعلم: إكمال جمل فعلية بالرؤوس المرقمة. — الطالب: الإكمال والقراءة.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الجماعي. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: توظيف الجملة الفعلية وتحويل الجملة الاسمية إلى فعلية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة التحويل: «البحارة صبروا» ← «صبر البحارة». — الطالب: ملاحظة التغيير.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف المجموعات بتحويل جمل ووصف صور الكتاب بجمل فعلية. — الطالب: التحويل والكتابة.\n4) من الدقيقة 28 إلى 35: المعلم: عرض الأعمال وتصويبها. — الطالب: القراءة والتحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: النمط الإملائي: الحروف التي تدخل على (ال) — اكتشاف\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض كلمات من النص (بالبحر، كالجبل، فالسفينة، والريح، للبحارة) لاكتشاف الظاهرة. — الطالب: القراءة والملاحظة.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «القطار»: عربة الحرف تلتصق بعربة الكلمة. — الطالب: تركيب الكلمات وقراءتها.\n4) من الدقيقة 28 إلى 35: المعلم: تدوين الملاحظات: نكتب الحرف متصلًا بـ(ال) دون حذف إلا مع اللام. — الطالب: الكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: دخول اللام على (ال): تدريبات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توضيح أن ألف (ال) تحذف عند دخول اللام عليها بالأمثلة. — الطالب: الملاحظة والتطبيق الشفهي.\n3) من الدقيقة 16 إلى 27: المعلم: توجيه الطلبة لتدريبات الكتاب ص 38. — الطالب: الإكمال فرديًا.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الثنائي. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: الإملاء: الفقرة الإملائية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة وقراءتها ومناقشة كلماتها ثم حجبها. — الطالب: التهجي الشفهي.\n3) من الدقيقة 15 إلى 27: المعلم: إملاء الفقرة بتأنٍّ. — الطالب: الكتابة في الكتاب ص 40.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الذاتي وإعادة كتابة الكلمات الخطأ. — الطالب: التصحيح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 15: الخط: «أحمد بن ماجد بحار عماني» بخط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف المقررة والعبارة على سبورة مسطرة. — الطالب: المتابعة والتتبع.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الطلبة بالكتابة في الكتاب والتجوال للتصويب. — الطالب: الكتابة بتأنٍّ.\n4) من الدقيقة 28 إلى 35: المعلم: معرض أجمل خط. — الطالب: المقارنة والتحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 16: التعبير: بنية النص السردي (البداية والوسط والنهاية)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: قراءة الأحداث الكبرى الثلاثة ص 42 وربطها ببنية النص. — الطالب: ربط كل حدث بموضعه.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف المجموعات بملء مخطط السمكة لنص السندباد. — الطالب: التعبئة والعرض.\n4) من الدقيقة 28 إلى 35: المعلم: تلخيص: في البداية نعرّف بالمكان والزمان والشخصيات، وفي الوسط المشكلة، وفي النهاية الحل. — الطالب: الصياغة بأسلوبهم.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 17: التعبير: كتابة نص سردي ببنية متكاملة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: نمذجة كتابة نص قصير ببداية ووسط ونهاية. — الطالب: الملاحظة.\n3) من الدقيقة 14 إلى 27: المعلم: تكليف الطلبة بكتابة نص عن رحلة بحرية تخيلية من 6 جمل. — الطالب: التخطيط بالمخطط ثم الكتابة.\n4) من الدقيقة 28 إلى 35: المعلم: مراجعة الأقران: هل للنص بداية ووسط ونهاية؟ — الطالب: التدقيق والتحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 18: مراجعة درس السندباد ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: مراجعة سريعة لأقسام الدرس. — الطالب: الإجابة.\n3) من الدقيقة 15 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس السندباد. — الطالب: المنافسة.\n4) من الدقيقة 29 إلى 35: المعلم: التقويم الذاتي لمهارات الدرس. — الطالب: تلوين المؤشرات.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أشاهد وأتحدث: البحر وتاريخ عُمان البحري\n1) [مستوى الدعم] من فوا ة والياء: تدريبات\nتحدي «أكمل الحرف» على السبورة: إل..، ف..، هد.. (الزمن: 4 دقائق)\n\nالحصة 11: الإملاء: الفقرة الإملائية\nإملاء سريع لثلاث كلمات (على، في، إلى) على السبورات الصغيرة. (الزمن: 4 دقائق)\n\nالحصة 12: الخط: كتابة الحروف والكلمات بخط النسخ\nعرض صور لأسماء أشخاص مكتوبة بخط النسخ وسؤال: أيها أجمل؟ ولماذا؟ (الزمن: 4 دقائق)\n\nالحصة 13: التعبير: بنية النص السردي (2) عن مشروع تدوير\nعرض منتج مدور (حامل أقلام من علبة) وسؤال: كيف صُنع؟ (الزمن: 4 دقائق)\n\nالحصة 14: التعبير: كتابة نص عن مشروع التدوير ومسابقة الدرس\nقراءة مخطط المشروع من الحصة السابقة. (الزمن: 4 دقائق)", "الحصة 1: أشاهد وأتحدث: القمامة والتدوير\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض لوحة المحادثة ومناقشة أسئلة «أشاهد وأتحدث»: الطريقة المعتادة للتخلص من القمامة. — الطالب: الوصف والإجابة.\n3) من الدقيقة 16 إلى 27: المعلم: العصف الذهني: ماذا تقترح كي يستفاد من هذه القمامة؟ — الطالب: اقتراح الأفكار وتصنيفها.\n4) من الدقيقة 28 إلى 35: المعلم: فرز المواد في الكيس إلى (ورق، بلاستيك، معدن، زجاج). — الطالب: الفرز العملي.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: أتصفح: ملامح الورقة والتوقع\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: القراءة التصفحية للعنوان والصور. — الطالب: التصفح.\n3) من الدقيقة 14 إلى 26: المعلم: مناقشة أسئلة «أتصفح»: ملامح الورقة في الصورة، توقع ما سيحدث لها. — الطالب: التوقع والتسجيل.\n4) من الدقيقة 27 إلى 35: المعلم: كتابة التوقعات على لوحة. — الطالب: المشاركة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الأولى لنص «قصة ورقة»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة نموذجية معبرة مع تغيير نبرة الشخصيات. — الطالب: المتابعة.\n3) من الدقيقة 15 إلى 29: المعلم: القراءة الفردية بالتناوب. — الطالب: القراءة الجهرية المعبرة.\n4) من الدقيقة 30 إلى 35: المعلم: استخلاص الفكرة العامة. — الطالب: الصياغة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: القراءة الثنائية بالمعايير. — الطالب: القراءة والتقييم.\n3) من الدقيقة 17 إلى 27: المعلم: أسئلة المستوى الأول ص 50 في أثناء القراءة. — الطالب: الإجابة من النص.\n4) من الدقيقة 28 إلى 35: المعلم: تكليف المجموعات بتحديد محطات رحلة الورقة على الخط. — الطالب: التحديد والرسم.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: المفردات والمستوى الثاني: مشاعر ورقة وتحولاتها\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مناقشة معاني كلمات (دهشة، كومة، الصفيح، مندهشة). — الطالب: الاستنتاج من السياق.\n3) من الدقيقة 16 إلى 27: المعلم: فكر-زاوج-شارك: كيف تغيرت مشاعر ورقة من البداية إلى النهاية؟ — الطالب: ربط المشاعر بالأحداث.\n4) من الدقيقة 28 إلى 35: المعلم: رسم «مقياس المشاعر» لورقة. — الطالب: الرسم والكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: المستويان الثالث والرابع: العبرة ورأيي في التدوير\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مناقشة العبرة: لا شيء بلا فائدة، والتدوير يحفظ البيئة. — الطالب: الاستخلاص.\n3) من الدقيقة 16 إلى 27: المعلم: حل مشكلة: صفنا تتراكم فيه الأوراق، ما الحل؟ — الطالب: اقتراح حلول وتعليلها.\n4) من الدقيقة 28 إلى 35: المعلم: اقتراح عناوين بديلة والتصويت. — الطالب: الاقتراح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: النمط اللغوي: الأعداد المركبة (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض جمل من النص وأمثلة (أحد عشر كتابًا، إحدى عشرة ورقة) واكتشاف أن العدد المركب من جزأين. — الطالب: القراءة والملاحظة.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «اسحب وعد»: سحب بطاقة عدد وبطاقة صورة وقراءة العدد مع المعدود. — الطالب: القراءة الصحيحة.\n4) من الدقيقة 28 إلى 35: المعلم: تدريب الكتاب ص 54. — الطالب: الحل الفردي.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: الأعداد المركبة: تطبيقات الكتابة والتوظيف\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: نمذجة كتابة الأعداد (13، 14، 18) مع معدود مذكر ومؤنث. — الطالب: المتابعة والترديد.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف المجموعات بإكمال جمل الكتاب بالعدد المناسب. — الطالب: الإكمال والقراءة.\n4) من الدقيقة 28 إلى 35: المعلم: تصحيح ثنائي. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: النمط الإملائي: الألف المقصورة والياء (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض كلمات من النص (على، إلى، مستشفى، في، الذي) لاكتشاف الفرق. — الطالب: النطق والملاحظة.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «نقطتان أم لا؟»: نطق كلمة ورفع مجسم (ى) أو (ي). — الطالب: الاستماع والاستجابة.\n4) من الدقيقة 28 إلى 35: المعلم: تصنيف الكلمات في جدول ص 57. — الطالب: التصنيف.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: الألف المقصورة والياء: تدريبات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة لتدريبات الكتاب ص 58. — الطالب: الإكمال الفردي.\n3) من الدقيقة 16 إلى 27: المعلم: تكليف الثنائيات بكتابة جمل عن التدوير بكلمات بالحرفين. — الطالب: الكتابة.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الجماعي. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: الإملاء: الفقرة الإملائية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة وقراءتها ومناقشة كلماتها ثم حجبها. — الطالب: التهجي الشفهي.\n3) من الدقيقة 15 إلى 27: المعلم: إملاء الفقرة بتأنٍّ. — الطالب: الكتابة في الكتاب ص 60.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الذاتي. — الطالب: التصحيح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: الخط: كتابة الحروف والكلمات بخط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف المقررة والكلمات على سبورة مسطرة. — الطالب: المتابعة.\n3) من الدقيقة 15 إلى 27: المعلم: الكتابة في الكتاب ص 61 مع التجوال للتصويب. — الطالب: الكتابة بتأنٍّ.\n4) من الدقيقة 28 إلى 35: المعلم: تقييم ذاتي بالمقارنة بالنموذج. — الطالب: التحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: التعبير: بنية النص السردي (2) عن مشروع تدوير\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة نموذج الكتاب ص 64 وتحديد أجزائه (البداية: الزمان والمكان والفكرة، الوسط: الخطوات، النهاية: النتيجة). — الطالب: التحديد.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف المجموعات بتخطيط مشروع تدوير صغير بمخطط البنية. — الطالب: التخطيط وتعبئة المخطط.\n4) من الدقيقة 28 إلى 35: المعلم: عرض المخططات ومناقشتها. — الطالب: العرض والتحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: التعبير: كتابة نص عن مشروع التدوير ومسابقة الدرس\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 17: المعلم: تكليف الطلبة بكتابة نص من ست جمل عن مشروعهم. — الطالب: الكتابة الفردية.\n3) من الدقيقة 18 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس قصة ورقة. — الطالب: المنافسة.\n4) من الدقيقة 29 إلى 35: المعلم: قراءة نماذج من النصوص. — الطالب: الاستماع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أشاهد وأتحدث: القمامة والتدوير\n1) [مستوى الدعم] إعادة التدوير تعني:\nالإجابة النموذجية: تحويل المواد المستعملة إلى منتجات جديدة\n2) [المستوى المتوقع] صواب أم خطأ: نفرز القمامة قبل تدويرها.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] أي فكرة تفيد البيئة؟\nالإجابة النموذجية: صنع حامل أقلام من علبة قديمة\n\nالحصة 2: أتصفح: ملامح الورقة والتوقع\n1) [مستوى الدعم] صواب أم خطأ: في القصة تتكلم «ورقة» كأنها إنسان.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] نستنتج ملامح الورقة من:\nالإجابة النموذجية: الصورة\n3) [المستوى المتقدم] عنوان الدرس:\nالإجابة النموذجية: قصة ورقة\n\nالحصة 3: القراءة الجهرية الأولى لنص «قصة ورقة»\n1) [مستوى الدعم] لماذا حزنت ورقة؟\nالإجابة النموذجية: لأن صاح  الطالب: المشاركة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: بين رفوف مكتبتي: خريطة القصة العلمية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 18: المعلم: القراءة الصامتة الحرة. — الطالب: القراءة.\n3) من الدقيقة 19 إلى 28: المعلم: تعبئة خريطة القصة. — الطالب: التعبئة.\n4) من الدقيقة 29 إلى 35: المعلم: تلخيص القصة في ثلاث جمل. — الطالب: التلخيص.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: بين رفوف مكتبتي: مقابلة مع شخصية قصصية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: توجيه الثنائيات لإعداد ثلاثة أسئلة لمقابلة شخصية من قصصهم. — الطالب: إعداد الأسئلة.\n3) من الدقيقة 15 إلى 27: المعلم: تنفيذ المقابلات أمام الصف. — الطالب: لعب دور المحاور والشخصية.\n4) من الدقيقة 28 إلى 35: المعلم: مناقشة أجمل الأسئلة وأذكاها. — الطالب: التصويت.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: بين رفوف مكتبتي: معرض «كتابي المفضل»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 17: المعلم: تكليف الطلبة بتصميم غلاف جديد لكتابهم المفضل. — الطالب: التصميم.\n3) من الدقيقة 18 إلى 27: المعلم: تنظيم معرض «كتابي المفضل» في الصف. — الطالب: العرض والشرح.\n4) من الدقيقة 28 إلى 35: المعلم: تصويت على أجمل غلاف. — الطالب: التصويت.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: بين رفوف مكتبتي: خطتي للقراءة في الإجازة\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة موعات بمقارنة الحاسوب بجهاز آخر من حيث الخدمات. — الطالب: المقارنة والعرض.\n4) من الدقيقة 28 إلى 35: المعلم: العصف الذهني: متى يكون استخدام الحاسوب مفيدًا؟ ومتى يضر؟ — الطالب: تصنيف الأفكار.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 2: أتصفح: بطاقة النص وشكله\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 13: المعلم: القراءة التصفحية للنص. — الطالب: التصفح.\n3) من الدقيقة 14 إلى 26: المعلم: تكليف الطلبة بملء بطاقة النص ص 66. — الطالب: التعبئة.\n4) من الدقيقة 27 إلى 35: المعلم: مقارنة نص «حاسوب» بنص «قصة ورقة» من حيث الشكل والنوع. — الطالب: المقارنة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 3: القراءة الجهرية الأولى للأبيات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: قراءة نموذجية معبرة للأبيات. — الطالب: المتابعة والإنصات.\n3) من الدقيقة 15 إلى 29: المعلم: القراءة الفردية بيتًا بيتًا مع التصويب. — الطالب: القراءة الجهرية.\n4) من الدقيقة 30 إلى 35: المعلم: استخلاص الفكرة العامة. — الطالب: الصياغة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 4: القراءة الجهرية الثانية وأسئلة المستوى الأول\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: القراءة الثنائية بالمعايير. — الطالب: القراءة والتقييم.\n3) من الدقيقة 17 إلى 27: المعلم: أسئلة المستوى الأول ص 69: فيم يستخدم الابن الحاسوب؟ كيف يطيع الأوامر؟ — الطالب: الإجابة من النص.\n4) من الدقيقة 28 إلى 35: المعلم: تدوين الإجابات ونقلها. — الطالب: الكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 5: المفردات والمعاني في نص «حاسوب»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مناقشة معاني المفردات الجديدة في الأبيات. — الطالب: الاستنتاج من السياق.\n3) من الدقيقة 16 إلى 26: المعلم: مطابقة صور أجزاء الحاسوب بأسمائها. — الطالب: المطابقة.\n4) من الدقيقة 27 إلى 35: المعلم: توظيف ثلاث مفردات في جمل. — الطالب: الكتابة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 6: المستوى الثاني: الاستنتاج والمقارنة بين الاستخدام المفيد والضار\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 16: المعلم: فكر-زاوج-شارك: ما مشاعر الابن؟ وما الدليل؟ — الطالب: الاستنتاج.\n3) من الدقيقة 17 إلى 27: المعلم: تصنيف بطاقات مواقف إلى مفيد وضار. — الطالب: التصنيف والتعليل.\n4) من الدقيقة 28 إلى 35: المعلم: صياغة «ميثاق الاستخدام الآمن» للصف. — الطالب: المشاركة بقاعدة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: المستويان الثالث والرابع: فوائد أخرى للحاسوب ورأيي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مناقشة فوائد أخرى للحاسوب في الطب والتعليم والتجارة. — الطالب: ذكر الفوائد.\n3) من الدقيقة 16 إلى 27: المعلم: سؤال الرأي: هل توافق الأب على شراء الحاسوب؟ ولماذا؟ — الطالب: إبداء الرأي.\n4) من الدقيقة 28 إلى 35: المعلم: اقتراح عناوين بديلة. — الطالب: الاقتراح والتعليل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 8: النمط اللغوي: أسماء الإشارة (اكتشاف)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: عرض أمثلة من النص والواقع لاكتشاف أسماء الإشارة واستعمالها. — الطالب: الملاحظة والترديد.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «أشر وقل»: يحمل الطالب أشياء ويستخدم اسم الإشارة المناسب. — الطالب: التطبيق العملي.\n4) من الدقيقة 28 إلى 35: المعلم: تدريب الكتاب ص 74. — الطالب: الحل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 9: أسماء الإشارة: تطبيقات وتوظيف\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة لإكمال جمل الكتاب ص 75. — الطالب: الإكمال الفردي.\n3) من الدقيقة 16 إلى 27: المعلم: عرض صور وتكليف الطلبة بكتابة جمل اسمية تبدأ باسم إشارة (هذا حصن منيع، هذه نخلة باسقة). — الطالب: الكتابة والقراءة.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الجماعي. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 10: مراجعة الجملة الفعلية في نص «حاسوب»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه المجموعات لاستخراج الجمل الفعلية من النص. — الطالب: الاستخراج.\n3) من الدقيقة 16 إلى 27: المعلم: تحديد الفعل والفاعل في كل جملة على السبورة. — الطالب: التحديد والعرض.\n4) من الدقيقة 28 إلى 35: المعلم: تحويل جملتين اسميتين من النص إلى فعليتين. — الطالب: التحويل.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 11: مراجعة المفرد والمثنى والجمع في نص «حاسوب»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: توجيه الطلبة للبحث في النص عن مفردات لإكمال الجدول ص 76. — الطالب: البحث والإكمال.\n3) من الدقيقة 16 إلى 27: المعلم: لعبة «ألوان الصيغ» بالبطاقات. — الطالب: الاستجابة بالبطاقة.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح. — الطالب: المراجعة.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 12: النمط الإملائي: مراجعة الحروف الداخلة على (ال)\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: مراجعة القواعد مع الأمثلة (بالحاسوب، كالحاسوب، فالحاسوب، والحاسوب، للحاسوب). — الطالب: الكتابة على السبورات الصغيرة.\n3) من الدقيقة 16 إلى 27: المعلم: تدريبات الكتاب ص 77. — الطالب: الحل الفردي.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الثنائي. — الطالب: التصويب.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 13: الإملاء: الفقرة الإملائية\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض الفقرة (يوم الجمعة في النزهة...) وقراءتها ومناقشتها ثم حجبها. — الطالب: التهجي الشفهي.\n3) من الدقيقة 15 إلى 27: المعلم: إملاء الفقرة بتأنٍّ. — الطالب: الكتابة في الكتاب ص 78.\n4) من الدقيقة 28 إلى 35: المعلم: التصحيح الذاتي. — الطالب: التصحيح.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 14: الخط: كتابة الحروف والكلمات بخط النسخ\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نمذجة كتابة الحروف المقررة والكلمات. — الطالب: المتابعة.\n3) من الدقيقة 15 إلى 27: المعلم: الكتابة في الكتاب ص 79. — الطالب: الكتابة بتأنٍّ.\n4) من الدقيقة 28 إلى 35: المعلم: معرض الخط. — الطالب: التقييم والتحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 15: التعبير: بنية النص السردي (3) — التخطيط لقصة «أريد حاسوبًا»\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: عرض المخطط ص 81 (البداية: طلب الطفل، الوسط: الحوار وفوائد الحاسوب، النهاية: موافقة الأب وفرحة الطفل). — الطالب: الملاحظة.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف الثنائيات بتعبئة المخطط بأفكارهم الخاصة. — الطالب: التخطيط.\n4) من الدقيقة 28 إلى 35: المعلم: عرض المخططات وتحسينها. — الطالب: التحسين.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 16: التعبير: كتابة النص السردي المتكامل\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 12: المعلم: تذكير بمعايير النص الجيد (البنية، الترقيم، الإملاء، أداة الربط). — الطالب: تدوين المعايير.\n3) من الدقيقة 13 إلى 28: المعلم: تكليف الطلبة بكتابة النص في سبع جمل على الأقل. — الطالب: الكتابة الفردية.\n4) من الدقيقة 29 إلى 35: المعلم: قراءة بعض النصوص. — الطالب: الاستماع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 17: تحرير النص وعرضه\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 15: المعلم: تنفيذ مراجعة الأقران بقائمة التدقيق. — الطالب: المراجعة وكتابة ملحوظتين.\n3) من الدقيقة 16 إلى 26: المعلم: إعادة كتابة النص المحسن. — الطالب: التحسين.\n4) من الدقيقة 27 إلى 35: المعلم: تنظيم «كرسي الكاتب» لعرض النصوص. — الطالب: العرض والاستماع.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 18: الاستخدام الآمن للحاسوب: حوار وملصق\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: حوار موجه حول قواعد السلامة الرقمية. — الطالب: الحوار وتدوين القواعد.\n3) من الدقيقة 15 إلى 27: المعلم: تكليف المجموعات بتصميم ملصق إرشادي (عنوان، صورة، نصيحة). — الطالب: التصميم.\n4) من الدقيقة 28 إلى 35: المعلم: عرض الملصقات وتعليقها. — الطالب: العرض.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 19: مراجعة درس «حاسوب» ومسابقة المجموعات\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: مراجعة سريعة لأقسام الدرس. — الطالب: الإجابة بالتناوب.\n3) من الدقيقة 15 إلى 28: المعلم: تنفيذ مسابقة المجموعات الإلكترونية لدرس حاسوب. — الطالب: المنافسة.\n4) من الدقيقة 29 إلى 35: المعلم: تقويم ذاتي للمهارات. — الطالب: تلوين المؤشرات.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: أشاهد وأتحدث: الحاسوب والأجهزة الذكية\n1) [مستوى الدعم] من فوائد الحاسوب:\nالإجابة النموذجية: البحث عن المعلومات والتعلم\n2) [المستوى المتوقع] صواب أم خطأ: الجلوس الطويل أمام الحاسوب يضر العينين.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] الاستخدام المعتدل للحاسوب يعني:\nالإجابة النموذجية: تحديد وقت مناسب للاستخدام\n\nالحصة 2: أتصفح: بطاقة النص وشكله\n1) [مستوى الدعم] نوع نص «حاسوب»:\nالإجابة النموذجية: نشيد شعري\n2) [المستوى المتوقع] صواب أم خطأ: النص الشعري يكتب أبياتًا.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] يختلف نص «حاسوب» عن «قصة ورقة» في:\nالإجابة النموذجية: كونه نصًا شعريًا\n\nالحصة 3: القراءة الجهرية الأولى للأبيات\n1) [مستوى الدعم] من يطلب الحاسوب في النص؟\nالإجابة النموذجية: الابن\n2) [المستوى المتوقع] الفكرة العامة:\nالإجابة النموذجية: رغبة الابن في حاسوب يستخدمه في  المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 14: المعلم: نص استماع قصير وأسئلته. — الطالب: الاستماع والإجابة.\n3) من الدقيقة 15 إلى 27: المعلم: قراءة جهرية لفقرات من نصوص الفصل. — الطالب: القراءة المعبرة.\n4) من الدقيقة 28 إلى 35: المعلم: التحدث دقيقة عن أحب درس. — الطالب: التحدث.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.\n\nالحصة 7: المسابقة الختامية للفصل وتقويم ذاتي\n1) من الدقيقة 1 إلى 4: التهيئة: يعرض المعلم نشاط التهيئة ويربطه بهدف الحصة، ويتفاعل الطلبة ويستحضرون تعلمهم السابق.\n2) من الدقيقة 5 إلى 19: المعلم: تنفيذ مسابقة المجموعات الإلكترونية الختامية. — الطالب: المنافسة.\n3) من الدقيقة 20 إلى 28: المعلم: كتابة رسالة قصيرة لنفسي: ماذا تعلمت؟ وماذا أريد في الفصل القادم؟ — الطالب: الكتابة.\n4) من الدقيقة 29 إلى 35: المعلم: تكريم المجموعات والطلبة المتميزين. — الطالب: الاحتفاء.\n5) من الدقيقة 36 إلى 40: التقويم الختامي: يطرح المعلم أسئلة التقويم الختامي الثلاثة وفق مستويات الطلبة، ويجيب الطلبة فرديًا ثم يناقشون الإجابات.", "الحصة 1: مراجعة شاملة: نصوص المحورين\n1) [مستوى الدعم] نورة شخصية في نص:\nالإجابة النموذجية: التيمينة\n2) [المستوى المتوقع] صواب أم خطأ: سعيد شخصية في نص «حلوى لأبي».\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] قيمة مشتركة بين «الحمامة المطوقة» و«رفاق المجد»:\nالإجابة النموذجية: التعاون\n\nالحصة 2: مراجعة شاملة: المفردات والأساليب\n1) [مستوى الدعم] معنى (أترابها):\nالإجابة النموذجية: من في مثل عمرها\n2) [المستوى المتوقع] معنى «لا تتقدم قيد أنملة»:\nالإجابة النموذجية: لا تتقدم أبدًا\n3) [المستوى المتقدم] صواب أم خطأ: معنى (رمقها) نظر إليها.\nالإجابة النموذجية: صواب\n\nالحصة 3: مراجعة شاملة: الأنماط اللغوية\n1) [مستوى الدعم] الجملة الاسمية:\nالإجابة النموذجية: البحر واسع.\n2) [المستوى المتوقع] مثنى (قلم):\nالإجابة النموذجية: قلمان\n3) [المستوى المتقدم] صواب أم خطأ: «هذه نخلة باسقة» صحيحة.\nالإجابة النموذجية: صواب\n\nالحصة 4: مراجعة شاملة: الظواهر الإملائية\n1) [مستوى الدعم] الكلمة الصحيحة:\nالإجابة النموذجية: مدرسة\n2) [المستوى المتوقع] الكلمة الصحيحة:\nالإجابة النموذجية: كتابًا\n3) [المستوى المتقدم] صواب أم خطأ: «للمدرسة» صحيحة.\nالإجابة النموذجية: صواب\n\nالحصة 5: مراجعة شاملة: التعبير الكتابي\n1) [مستوى الدعم] صواب أم خطأ: النص السردي يتضمن مكانًا وزمانًا وأحداثًا.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] بداية مناسبة:\nالإجابة النموذجية: في مساء يوم الخميس اجتمعت أسرتنا في الحديقة.\n3) [المستوى المتقدم] جزء المشكلة:\nالإجابة النموذجية: الوسط\n\nالحصة 6: مراجعة شاملة: الاستماع والتحدث والقراءة الجهرية\n1) [مستوى الدعم] صواب أم خطأ: آداب الاستماع تشمل الإنصات وعدم المقاطعة.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] القراءة المعبرة تراعي:\nالإجابة النموذجية: علامات الترقيم والتنغيم\n3) [المستوى المتقدم] عند التحدث أمام الزملاء:\nالإجابة النموذجية: أتحدث بصوت واضح وجمل تامة\n\nالحصة 7: المسابقة الختامية للفصل وتقويم ذاتي\n1) [مستوى الدعم] عنوان المحور الأول:\nالإجابة النموذجية: الحياة من حولي\n2) [المستوى المتوقع] صواب أم خطأ: «مجد القلم» نشيد المحور الثاني.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] الجملة الفعلية:\nالإجابة النموذجية: أبحرت السفينة.", "الحصة 1: مراجعة شاملة: نصوص المحورين\n1) [مستوى الدعم] النص الشعري في المحور الثاني:\nالإجابة النموذجية: حاسوب\n2) [المستوى المتوقع] صواب أم خطأ: «رحلة السندباد الثامنة» نص عن البحر.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] قيمة نص «قصة ورقة»:\nالإجابة النموذجية: الحفاظ على البيئة\n\nالحصة 2: مراجعة شاملة: المفردات والأساليب\n1) [مستوى الدعم] أكمل: بينما كنت أقرأ ...... سمعت صوت الجرس.\nالإجابة النموذجية: إذ\n2) [المستوى المتوقع] صواب أم خطأ: الماء العذب صالح للشرب.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] مرادف (العون):\nالإجابة النموذجية: المساعدة\n\nالحصة 3: مراجعة شاملة: الأنماط اللغوية\n1) [مستوى الدعم] أكمل: في الصف ...... طالبًا (14).\nالإجابة النموذجية: أربعة عشر\n2) [المستوى المتوقع] صواب أم خطأ: (على) اسم.\nالإجابة النموذجية: خطأ\n3) [المستوى المتقدم] الفاعل في «قرأت نورة السورة»:\nالإجابة النموذجية: نورة\n\nالحصة 4: مراجعة شاملة: الظواهر الإملائية\n1) [مستوى الدعم] الكلمة الصحيحة:\nالإجابة النموذجية: مستشفى\n2) [المستوى المتوقع] كلمة لامها شمسية:\nالإجابة النموذجية: الشمس\n3) [المستوى المتقدم] صواب أم خطأ: نكتب «لالبيت».\nالإجابة النموذجية: خطأ\n\nالحصة 5: مراجعة شاملة: التعبير الكتابي\n1) [مستوى الدعم] أداة ربط للنهاية:\nالإجابة النموذجية: وأخيرًا\n2) [المستوى المتوقع] صواب أم خطأ: نراجع النص بعد كتابته.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] من عناصر التدقيق:\nالإجابة النموذجية: الترقيم والإملاء والبنية\n\nالحصة 6: مراجعة شاملة: الاستماع والتحدث والقراءة الجهرية\n1) [مستوى الدعم] صواب أم خطأ: نغير نبرة الصوت مع علامة الاستفهام.\nالإجابة النموذجية: صواب\n2) [المستوى المتوقع] نعيد سرد النص المسموع:\nالإجابة النموذجية: بأسلوبنا مع الترتيب\n3) [المستوى المتقدم] أي حديث مترابط؟\nالإجابة النموذجية: أحببت درس السندباد لأنه علمني الصبر، ثم ...\n\nالحصة 7: المسابقة الختامية للفصل وتقويم ذاتي\n1) [مستوى الدعم] كاتبة نص التيمينة:\nالإجابة النموذجية: جوخة الحارثية\n2) [المستوى المتوقع] صواب أم خطأ: الإعلان الإرشادي يقدم نصيحة.\nالإجابة النموذجية: صواب\n3) [المستوى المتقدم] جمع (عصفور):\nالإجابة النموذجية: عصافير", "الحصة 1: مراجعة شاملة: نصوص المحورين\nإرشاد للطالب: راجع نصوص الفصل\nإرشاد لولي الأمر: ناقش مع ابنك أحب النصوص إليه.\n\nالحصة 2: مراجعة شاملة: المفردات والأساليب\nإرشاد للطالب: راجع قاموسك الخاص\nإرشاد لولي الأمر: اختبر ابنك في المفردات.\n\nالحصة 3: مراجعة شاملة: الأنماط اللغوية\nإرشاد للطالب: راجع الأنماط اللغوية في دفترك\nإرشاد لولي الأمر: راجع مع ابنك الأنماط.\n\nالحصة 4: مراجعة شاملة: الظواهر الإملائية\nإرشاد للطالب: صحح أخطاءك في دفتر الإملاء\nإرشاد لولي الأمر: أملِ على ابنك كلمات متنوعة.\n\nالحصة 5: مراجعة شاملة: التعبير الكتابي\nإرشاد للطالب: اكتب نصًا سرديًا عن الإجازة القادمة\nإرشاد لولي الأمر: اقرأ نص ابنك وامدحه.\n\nالحصة 6: مراجعة شاملة: الاستماع والتحدث والقراءة الجهرية\nإرشاد للطالب: اقرأ لأسرتك فقرة من نصك المفضل\nإرشاد لولي الأمر: استمع لقراءة ابنك وشجعه.\n\nالحصة 7: المسابقة الختامية للفصل وتقويم ذاتي\nإرشاد للطالب: شارك أسرتك رسالتك لنفسك\nإرشاد لولي الأمر: احتفِ بإنجازات ابنك في الفصل."]}]};
function pc(n){return n===1?'حصة واحدة':n===2?'حصتان':(n<=10?n+' حصص':n+' حصة')}
const NAMES=['المخرجات التعليمية','المستوى المعرفي','الاستراتيجيات','المصادر التعليمية','المفاهيم','التهيئة / التمهيد / التعلم القبلي','إجراءات سير الدرس / الأنشطة التدريسية','التقويم التكويني','التقويم الختامي','ملاحظات ضمن خطة الدراسة الأسبوعية'];
let mode='sep', li=0, pi=0;
const $=s=>document.querySelector(s);
$('#ttl').textContent='نسخ حقول نور — '+DATA.subject+' — '+DATA.grade+' — '+DATA.term;
const lsel=$('#lsel');
DATA.lessons.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=L.name+' ('+pc(L.periods.length)+')';lsel.appendChild(o)});
lsel.onchange=()=>{li=+lsel.value;pi=0;render()};
$('#mSep').onclick=()=>{mode='sep';render()};
$('#mComb').onclick=()=>{mode='comb';render()};
function render(){
  const L=DATA.lessons[li];
  $('#mSep').setAttribute('aria-pressed',mode==='sep');$('#mComb').setAttribute('aria-pressed',mode==='comb');
  $('#status').textContent= mode==='sep' ? 'أنت الآن في الوضع المنفصل: نموذج لكل حصة' : 'أنت الآن في الوضع المدمج: نموذج واحد لكل درس يضم حصصه';
  const tabs=$('#tabs');tabs.innerHTML='';
  if(mode==='sep'){
    tabs.style.display='flex';
    L.periods.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',i===pi);b.textContent='الحصة '+p.n;b.title=p.topic;b.onclick=()=>{pi=i;render()};tabs.appendChild(b)});
    const p=L.periods[pi];
    $('#ctx').innerHTML='';
    const c=$('#ctx');c.append(ctxLine('الدرس: ',L.name+' — الحصة '+p.n+' من '+L.periods.length));c.append(ctxLine('محور الحصة: ',p.topic));if(p.week)c.append(ctxLine('',p.week));
    cards(p.fields);
  }else{
    tabs.style.display='none';
    $('#ctx').innerHTML='';$('#ctx').append(ctxLine('الدرس: ',L.name+' — نموذج واحد يضم '+pc(L.periods.length)));
    cards(L.combined);
  }
}
function ctxLine(b,t){const d=document.createElement('div');if(b){const s=document.createElement('b');s.textContent=b;d.append(s)}d.append(t);return d}
function cards(fields){
  const m=$('#cards');m.innerHTML='';
  fields.forEach((txt,i)=>{
    const card=document.createElement('article');card.className='card';
    const h=document.createElement('h2');const t=document.createElement('span');
    const n=document.createElement('span');n.className='n';n.textContent=i+1;t.append(n,NAMES[i]);
    const b=document.createElement('button');b.className='btn';b.type='button';b.textContent='نسخ';
    h.append(t,b);
    const body=document.createElement('div');body.className='txt';body.textContent=txt;
    const hint=document.createElement('div');hint.className='hint';hint.textContent='منع المتصفح النسخ التلقائي؛ النص محدد الآن، انسخه من قائمة الجهاز (نسخ).';
    b.onclick=()=>copy(txt,b,body,hint);
    card.append(h,body,hint);m.append(card);
  });
}
async function copy(txt,btn,body,hint){
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);ok=true;} }catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    try{ok=document.execCommand('copy')}catch(e){ok=false}
    document.body.removeChild(ta);
  }
  if(ok){btn.textContent='تم النسخ ✓';btn.classList.add('done');hint.classList.remove('on');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1800);}
  else{const r=document.createRange();r.selectNodeContents(body);const s=getSelection();s.removeAllRanges();s.addRange(r);hint.classList.add('on');}
}
render();
</script>
