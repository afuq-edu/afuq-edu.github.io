ة نموذجية معبرة للحكاية مع عرض النص على السبورة الذكية وتوضيح معايير القراءة الجهرية، ويقوم التلميذ بالمتابعة الصامتة في الكتاب وتحديد الكلمات الصعبة (11 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. القراءات الفردية: تنظيم قراءات فردية متتابعة تبدأ بالمجيدين وتصويب الأخطاء بعد إكمال الجملة وتدوين الملحوظات، ويقوم التلميذ بالقراءة الجهرية بالتناوب ورصد الأخطاء القرائية للزملاء بلطف (16 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n3. معاني المفردات من السياق: عرض جمل من الحكاية تتضمن كلمات جديدة (الشرك، كمن، الخلاص) ومناقشة معانيها من السياق، والتلميذ: استنتاج المعنى من السياق وكتابته في الكتاب (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة الأضداد المتطابقة: لعبة «الأضداد المتطابقة»: بطاقات كلمات وأضدادها موزعة على الطلبة، ويقوم التلميذ بالبحث عن الزميل الذي يحمل ضد الكلمة وقراءة الزوج أمام الصف (14 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n5. توظيف المفردات الجديدة: تكليف كل طالب بتوظيف كلمتين جديدتين في جملتين، والتلميذ: كتابة الجملتين وقراءتهما (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. الفكرة العامة: طرح سؤال: ما الحكاية في جملة واحدة؟ ومساعدة الطلبة على صياغة الفكرة العامة، والتلميذ: اقتراح جمل للفكرة العامة واختيار أدقها (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n7. القراءة الجهرية الثانية بالأقران: تكليف الطلبة بالقراءة الجهرية الثانية بطريقة الأقران مع استمارة معايير القراءة على السبورة، ويقوم التلميذ بالقراءة الثنائية وتقييم قراءة الزميل وفق المعايير (14 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n8. أسئلة المستوى الأول: طرح أسئلة المستوى الأول من الكتاب وتدوين الإجابات الصحيحة على السبورة، ويقوم التلميذ بالإجابة بالعودة إلى النص ونقل الإجابة إلى الكتاب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n9. ترتيب أحداث الحكاية: توزيع بطاقات أحداث الحكاية مبعثرة على المجموعات بطريقة الرؤوس المرقمة، وترتيب البطاقات وفق تسلسل الحكاية وعرضها (13 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n10. استنتاج القيمة: طرح سؤال: ما القيمة الأساسية في الحكاية؟ وتطبيق «فكر-زاوج-شارك»، ويقوم التلميذ بالتفكير فرديًا ثم المناقشة مع الزميل ثم المشاركة أمام الصف (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n11. تحدي التعاون في الصف: عرض موقف مشابه في الصف (ترتيب الصف) ومطالبة المجموعات بحل التحدي بالتعاون وربطه بالحكاية، وتنفيذ التحدي جماعيًا وتحديد موضع القيمة في الحكاية (14 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n12. الرأي والتعليل: سؤال: لو كنت إحدى الحمامات ماذا ستفعل؟ ولماذا؟ والتلميذ: إبداء الرأي مع التعليل بجملة أو جملتين (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n13. غلق الدرس – سرب القراءة: تقرأ كل مجموعة جملة من الحكاية قراءة جهرية معبرة بصوت واحد كأنها سرب حمام يطير معًا، ثم يذكر الطلبة مثالًا للتعاون عند أهل عُمان كالفزعة أو التعاون في تنظيف الفلج، ويختارون عنوانًا له (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): وقعت الحمامات في ......\nالإجابة: شبكة الصياد\nس2 (مستوى التطبيق): ماذا فعلت كل حمامة بعد وقوعها في الشبكة؟\nالإجابة: بحثت عن الخلاص لنفسها\nس3 (مستوى الاستدلال): لماذا لم تنجُ الحمامات حين بحثت كل واحدة عن نفسها؟\nالإجابة: لأن الفرقة تضعفهن\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ آداب الحديث: رفع اليد والاستئذان ثم الكلام بجملة تامة عن صورة الطيور، ويكمل معه الجملة الناقصة؛ وللتحقق يسأله: ماذا تفعل قبل أن تتكلم في الصف؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح عنوانين جديدين للوحة تعاون الطيور في حكاية «الحمامة المطوقة» وتعليل كل منهما، ثم يذكرون موقفًا من حياتهم يصدق عليه «يدٌ واحدة لا تصفق».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: نثر الصياد الحب على الشبكة.\nالإجابة: صواب\nس2 (مستوى التطبيق): ضد كلمة (كثيفة):\nالإجابة: خفيفة\nس3 (مستوى الاستدلال): ماذا نسمي المطوقة لأنها وحّدت صاحباتها؟\nالإجابة: قائدة حكيمة", "إرشاد للطالب: اقرأ الحكاية ص 16–17 قراءة جهرية أمام أسرتك\nإرشاد للطالب: رتّب أحداث الحكاية شفهيًا لأحد أفراد أسرتك ص 18–19\nإرشاد للطالب: اكتب جملتين بكلمتي (الخلاص، كمن) في دفترك\nإرشاد للطالب: اذكر موقفًا تعاونت فيه مع أسرتك واكتبه في جملتين\nإرشاد لولي الأمر: استمع إلى قراءة ابنك وشجعه على مراعاة الضبط.\nإرشاد لولي الأمر: ناقش ابنك في ترتيب أحداث الحكاية.\nإرشاد لولي الأمر: ساعد ابنك على توظيف الكلمات الجديدة في حديثه اليومي.\nإرشاد لولي الأمر: شارك ابنك عملًا جماعيًا في البيت وتحدث معه عن قيمة التعاون.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=1"]}, {"k": "الأنماط اللغوية", "p": ["مراجعة المفرد والمثنى والجمع", "مراجعة علامات الترقيم", "تقويم تشخيصي لمهارات المراجعة ومسابقة المجموعات"], "w": "الأسبوع الأول – الأسبوع الثاني", "f": ["1. يميز بين المفرد والمثنى والجمع (15 دقيقة)\n2. يحول الكلمة من المفرد إلى المثنى والجمع (15 دقيقة)\n3. يتعرف مواضع النقطة والفاصلة والنقطتين وعلامتي الاستفهام والتعجب (15 دقيقة)\n4. يضع علامة الترقيم المناسبة في الجملة (5 دقائق)\n5. يجيب عن أسئلة تقيس مهارات القراءة والكتابة المراجَعة (15 دقيقة)\n6. يحدد مواطن قوته ومواطن حاجته في مهارات اللغة (10 دقائق)\nمخرج تعليمي آخر:\n- يتعاون مع زملائه في إنجاز النشاط (10 دقائق)\n- يقرأ الجمل بتنغيم يناسب علامة الترقيم (20 دقيقة)\n- يتنافس مع زملائه تنافسًا شريفًا (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تذكر\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تطبيق", "1. التعلم المبني على اللعب\n2. التعلم التعاوني\n3. التعلم بالاكتشاف\n4. التعلم بالنمذجة\n5. التعلم الذاتي\n6. المسابقات التنافسية", "1. الكتاب\n2. السبورة الذكية\n3. نماذج مجسمة\n4. بطاقات ملونة\n5. مجسمات علامات الترقيم\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. المفرد\n2. المثنى\n3. الجمع\n4. علامات الترقيم\n5. النقطة\n6. الفاصلة\n7. النقطتان\n8. الاستفهام\n9. التعجب\n10. التقويم الذاتي\n11. الفهم القرائي\n12. الظواهر الإملائية", "عرض حمامة واحدة ثم حمامتين ثم حمامات على السبورة الذكية وسؤال: كيف تغيرت الكلمة؟ (5 دقائق)", "1. اكتشاف علامات المثنى والجمع: عرض كلمات من الحكاية (حمامة، صيادان، الطيور) وقيادة الطلبة لاكتشاف علامات المثنى والجمع، ويقوم التلميذ بالملاحظة والتصنيف في جدول ثلاثي (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. لعبة سلة الكلمات: لعبة «سلة الكلمات»: ثلاث سلال (مفرد، مثنى، جمع) وبطاقات كلمات، والتلميذ: وضع البطاقة في السلة الصحيحة وتعليل الاختيار (13 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تدريب الكتاب: تكليف الطلبة بحل تدريب الكتاب ص 22 فرديًا ومتابعتهم، ويقوم التلميذ بالحل الفردي ثم التصحيح الثنائي (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. علامات الترقيم ومواضعها: عرض مجسمات علامات الترقيم وربط كل علامة بموضعها بأمثلة من الحكاية، ويقوم التلميذ بالقراءة بتنغيم مناسب لكل علامة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. البحث عن علامات الترقيم في الحكاية: تكليف المجموعات بالبحث في الفقرة الأخيرة من الحكاية عن جمل فيها العلامات المطلوبة، ويقوم التلميذ بالبحث والكتابة في الكتاب ص 24 (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة أكمل بالعلامة: لعبة «أكمل بالعلامة»: جمل بلا ترقيم على السبورة، ويقوم التلميذ بالخروج للسبورة ووضع العلامة المناسبة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. الورقة التشخيصية: توزيع ورقة تشخيصية قصيرة (فهم، مفرد ومثنى وجمع، لام شمسية وقمرية، ترقيم)، ويقوم التلميذ بالإجابة الفردية (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. مسابقة المجموعات: يقوم التلميذ بالمنافسة بالتناوب والإجابة خلال الوقت (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n9. شجرة مهاراتي: توجيه الطلبة لتلوين «شجرة مهاراتي» بما أتقنوه وما يحتاجونه، ويقوم التلميذ بالتقويم الذاتي وكتابة هدف للأسبوع (7 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n10. غلق الدرس – يدًا بيد كالحمامات: يتذكر الطلبة كيف نجت الحمامات بالتعاون، ثم تتحدث كل مجموعة عن مثال للتعاون في المجتمع العماني كالفزعة أو التعاون في تنظيف الفلج، وتقترح عنوانًا مناسبًا لمثالها (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كلمة (صيادان) تدل على:\nالإجابة: المثنى\nس2 (مستوى التطبيق): ما أجملَ الحمامات ......\nالإجابة: !\nس3 (مستوى الاستدلال): نضع النقطتين (:) بعد ......\nالإجابة: كلمة قال\n\n• نشاط علاجي (لمن لم يتقن): يمثّل المعلم مع التلميذ آداب الحديث: رفع اليد والاستئذان ثم الكلام بجملة تامة عن صورة الطيور، ويكمل معه الجملة الناقصة؛ وللتحقق يسأله: ماذا تفعل قبل أن تتكلم في الصف؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المت اتهم يصدق عليه «يدٌ واحدة لا تصفق».", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): نبدأ الجملة الأخيرة في النهاية بكلمة ......\nالإجابة: أخيرًا\nس2 (مستوى التطبيق): الجملة المفيدة هي التي ......\nالإجابة: تعطي معنى تامًا\nس3 (مستوى الاستدلال): ما الذي يجعل النهاية جميلة ومقنعة؟\nالإجابة: ارتباطها بالأحداث", "إرشاد للطالب: صف صورة من مجلة أو كتاب بجملتين مفيدتين\nإرشاد للطالب: اقرأ نهايتك على أسرتك واطلب منهم رأيهم\nإرشاد لولي الأمر: راجع مع ابنك جمله وشجعه على وضوح الخط.\nإرشاد لولي الأمر: ناقش ابنك في النهاية التي كتبها واطلب منه تعليل اختياره.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=1"]}]}, {"t": "الاستماع: حكايات حروفي الجميلة", "u": "المحور الأول: الحياة من حولي", "s": [{"k": "التحدث", "p": ["الاستماع إلى التمثيلية الإذاعية «حكايات حروفي الجميلة» وفهمها"], "w": "الأسبوع الثاني", "f": ["1. يستمع إلى التمثيلية الإذاعية بانتباه مراعيًا آداب الاستماع (10 دقائق)\n2. يجيب عن أسئلة تتعلق بالتمثيلية المسموعة (15 دقيقة)\n3. يبين أهمية تناول وجبة الإفطار الصحية (10 دقائق)\nمخرج تعليمي آخر: يتقبل النصح والإرشاد في اختيار غذائه (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: فهم\nالمخرج الآخر: تقييم", "1. التعلم المبني على حل المشكلات\n2. التعلم المبني على اللعب\n3. السؤال والجواب\n4. أعواد المثلجات", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. مذياع", "1. آداب الاستماع\n2. التمثيلية الإذاعية\n3. الغذاء الصحي\n4. وجبة الإفطار", "إحضار مذياع أو صورته وسؤال: ما هذا؟ ما البرامج التي نسمعها فيه؟ ثم الاتفاق على آداب الاستماع. (5 دقائق)", "1. ما قبل الاستماع: العنوان والتخمين: قراءة عنوان النص وطلب تخمين أفكاره كتابيًا وتوضيح خطوات الاستماع الثلاث، وتدوين التخمينات وقراءة أسئلة الكتاب قراءة صامتة (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. الاستماع والإجابة: تشغيل التمثيلية مرتين: استماع دون تدوين ثم استماع مع الإجابة بالقلم الرصاص، ومناقشة أسئلة التذكر، ويقوم التلميذ بالاستماع والتأشير على التخمينات التي وردت والإجابة عن الأسئلة (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. التصحيح وإعادة السرد: الاستماع الثالث للتصحيح ثم مناقشة القيم والسلوكيات وسحب أعواد المثلجات لإعادة السرد، وتصحيح الإجابات وإعادة سرد ما سمعوه بأسلوبهم (6 دقائق)\nالاستراتيجيات: أعواد المثلجات.\n\n4. غلق الدرس – مائدة الإفطار العمانية: تتسابق المجموعات في ذكر أطعمة إفطار صحي من المطبخ العماني كالتمر واللبن والخبز العماني، وكل مجموعة تقول جملة تامة تنصح فيها زميلًا لا يفطر، ويصفق الصف للنصيحة الأجمل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، السؤال والجواب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من آداب الاستماع:\nالإجابة: الجلوس بهدوء والإصغاء\nس2 (مستوى التطبيق): تتحدث التمثيلية عن أهمية:\nالإجابة: وجبة الإفطار الصحية\nس3 (مستوى الاستدلال): لماذا نهتم بوجبة الإفطار قبل المدرسة؟\nالإجابة: لأنها تمدنا بالطاقة للتعلم\n\n• نشاط علاجي (لمن لم يتقن): يعيد المعلم مقطعًا من تمثيلية «حكايات حروفي الجميلة» مع صور لوجبة إفطار صحية، ويطلب من التلميذ الجلوس بهدوء ورفع الصورة عند ذكرها؛ وللتحقق يسأله: عن أهمية أي وجبة تتحدث التمثيلية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم قائمة إفطار صحي لأسبوع، وتمثيل حوار إذاعي قصير يقنعون فيه زميلًا لا يفطر بأهمية وجبة الإفطار قبل المدرسة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): نوع النص الذي استمعنا إليه:\nالإجابة: تمثيلية إذاعية\nس2 (مستوى التطبيق): صواب أم خطأ: يكفي أن نتناول الحلوى في الإفطار.\nالإجابة: خطأ\nس3 (مستوى الاستدلال): أفضل تصرف عندما ينصحنا أحد بغذاء صحي:\nالإجابة: نشكره ونأخذ بنصيحته", "إرشاد للطالب: أعد سرد التمثيلية لأسرتك واقترح معهم إفطارًا صحيًا للغد\nإرشاد لولي الأمر: شارك ابنك إعداد إفطار صحي وحدثه عن فائدته.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=2"]}]}, {"t": "المستند البصري: قراءة إعلان إرشادي", "u": "المحور الأول: الحياة من حولي", "s": [{"k": "التحدث", "p": ["قراءة إعلان إرشادي عن وزن الحقيبة المدرسية"], "w": "الأسبوع الثاني", "f": ["1. يقرأ الإعلان الإرشادي قراءة صحيحة (10 دقائق)\n2. يستنتج مكونات الإعلان الإرشادي (5 دقائق)\n3. يتعرف الهدف من الإعلان الإرشادي ومواطن توظيفه (20 دقيقة)\nمخرج تعليمي آخر: يلتزم بحمل حقيبة لا يزيد وزنها على خمس وزنه (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج الآخر: تطبيق", "1. التعلم التعاوني\n2. التعلم بالاكتشاف\n3. السؤال والجواب\n4. العصف الذهني", "1. الكتاب\n2. صورة توضيحية\n3. السبورة الذكية\n4. ميزان وحقيبة مدرسية", "1. الإعلان الإرشادي\n2. العنوان\n3. الصورة\n4. النصيحة\n5. الحقيبة المدرسية", "وزن حقيبة أحد الطلبة بميزان صغير أمام الصف وسؤال: هل هذه الحقيبة مناسبة لصاحبها؟ (5 دقائق)", "1. قراءة الإعلان وتحديد مكوناته: عرض الإعلان على السبورة الذكية ومناقشة موضوعه ومكوناته (العنوان، الصورة، العبارة الإرشادية)، والتلميذ: قراءة الإعلان ووصف الحقيبة في الصورة وتحديد مكوناته (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. الهدف من الإعلان وأضرار الحقيبة الثقيلة: طرح أسئلة الكتاب عن الهدف من الإعلان وأضرار الحقيبة الثقيلة وتدوين الإجابات، ويقوم التلميذ بالإجابة شفهيًا ثم نقلها إلى الكتاب (8 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. تصميم إعلان إرشادي مبسط: البحث عن إعلانات إرشادية في المدرسة وتكليف المجموعات بتصميم إعلان قصير لموضوع يختارونه، والتلميذ: رسم إعلان مبسط بعنوان وصورة ونصيحة (6 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n4. غلق الدرس – معرض إعلاناتنا: تعرض كل مجموعة إعلانها المبسط في جولة سريعة ويختار الطلبة أوضحها، ثم يقترحون عنوان إعلان إرشادي يحث على المحافظة على نظافة مدارس عُمان وشوارعها ويقولونه بصوت واحد (5 دقائق)\nالاستراتيجيات: التعلم التعاوني، العصف الذهني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): موضوع الإعلان الإرشادي:\nالإجابة: وزن الحقيبة المدرسية\nس2 (مستوى التطبيق): يجب ألا يزيد وزن الحقيبة على ...... وزن الطالب\nالإجابة: خمس\nس3 (مستوى الاستدلال): الهدف من الإعلان الإرشادي:\nالإجابة: تقديم نصيحة للمحافظة على الصحة\n\n• نشاط علاجي (لمن لم يتقن): يزن المعلم مع التلميذ حقيبة مدرسية بميزان بسيط، ويقرأ معه جملة الإعلان عن ألا يزيد وزن الحقيبة على خمس وزن الطالب مع رسم يوضحها؛ وللتحقق يسأله: ما موضوع الإعلان الإرشادي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم إعلان إرشادي جديد عن موضوع صحي آخر (غسل اليدين أو شرب الماء) يضم العنوان والصورة والنصيحة، ثم يقارنون مكوناته بمكونات إعلان الحقيبة المدرسية.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): من مكونات الإعلان الإرشادي:\nالإجابة: العنوان والصورة والعبارة الإرشادية\nس2 (مستوى التطبيق): صواب أم خطأ: الحقيبة الثقيلة قد تسبب الإرهاق والأذى للظهر.\nالإجابة: صواب\nس3 (مستوى الاستدلال): إذا كان وزن طالب 30 كيلوجرامًا، فأقصى وزن مناسب لحقيبته:\nالإجابة: 6 كيلوجرامات", "إرشاد للطالب: رتّب حقيبتك وفق جدول الغد وتأكد من خفتها\nإرشاد لولي الأمر: ساعد ابنك على ترتيب حقيبته يوميًا بما يلزم فقط.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=3"]}]}, {"t": "الدرس القرائي الأول: التيمينة", "u": "المحور الأول: الحياة من حولي", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: لوحة المحادثة والقرآن الكريم"], "w": "الأسبوع الثاني", "f": ["1. يتحدث بطلاقة عن لوحة المحادثة بعبارات مترابطة (10 دقائق)\n2. يربط مضمون اللوحة بخبراته الشخصية في تعلم القرآن الكريم (15 دقيقة)\n3. يتلو سورة قصيرة يحفظها تلاوة صحيحة (10 دقائق)\nمخرج تعليمي آخر: يعتز بتعلم القرآن الكريم وتوقيره (5 دقائق)", "المخرج 1: تطبيق\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. العصف الذهني\n3. الحوار والمناقشة\n4. التنبؤ", "1. الكتاب\n2. صورة توضيحية\n3. السبورة الذكية\n4. جهاز عرض البيانات", "1. لوحة المحادثة\n2. القرآن الكريم\n3. السورة\n4. الآية", "الاستماع إلى تلاوة قصيرة مؤثرة وسؤال: ماذا نشعر حين نسمع القرآن الكريم؟ (5 دقائق)", "1. وصف لوحة المحادثة: عرض لوحة المحادثة وطلب وصفها، ثم السؤال عن العناصر المكونة للقرآن الكريم (آيات، سور)، والتلميذ: وصف اللوحة بعبارات مترابطة (طالبان على الأقل لكل وصف) (7 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n2. مناقشة أسئلة أشاهد وأتحدث: مناقشة أسئلة «أشاهد وأتحدث»: لماذا نهتم بتعليم القرآن؟ ومن علّمك سورة تحفظها؟ ويقوم التلميذ بالتحدث عن التجربة الشخصية في تعلم القرآن (8 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. تلاوة سورة محفوظة: دعوة متطوعين لتلاوة سورة يحفظونها مع التوجيه إلى آداب التلاوة، ويقوم التلميذ بالتلاوة والإنصات لتلاوة الزملاء (5 دقائق)\nالاستراتيجيات: التنبؤ.\n\n4. غلق الدرس – حلقة الكتّاب: يجلس الطلبة في يقة)\n4. يقرأ النص قراءة جهرية صحيحة معبرة (50 دقيقة)\n5. يحدد الفكرة العامة للنص (10 دقائق)\n6. يسترجع المعلومات الصريحة من النص (5 دقائق)\n7. يصف مصحف نورة بكلمات من النص (10 دقائق)\n8. يحدد معاني الكلمات الجديدة من السياق (15 دقيقة)\n9. يستخرج أضداد كلمات من الفقرة الأولى (10 دقائق)\n10. يوظف كلمات جديدة في جمل من إنشائه (5 دقائق)\n11. يستنتج سبب تعلق نورة بالتيمينة (15 دقيقة)\n12. يقارن بين التعليم في المدرسة والتعليم في الكتّاب (15 دقيقة)\n13. يقترح عنوانًا آخر للنص (10 دقائق)\n14. يحدد نوع النص (قصصي، معلوماتي، شعري) (10 دقائق)\n15. يبدي رأيه في شخصية نورة مع التعليل (10 دقائق)\n16. يسرد تجربة شخصية أو أسرية في الاحتفال بختم القرآن (15 دقيقة)\n17. يطرح أسئلة عن النص الذي قرأه (10 دقائق)\nمخرج تعليمي آخر:\n- يقدّر الأدباء العمانيين وإنجازاتهم (5 دقائق)\n- يحترم الدور في القراءة ويتابع قراءة زملائه (5 دقائق)\n- يقيّم قراءة زميله وفق معايير محددة (15 دقيقة)\n- يتعاون مع زملائه في بناء جدار الكلمات (10 دقائق)\n- يقدّر دور الكتاتيب في الحفاظ على تعليم القرآن في عُمان (10 دقائق)\n- يشارك بفاعلية في قراءة المجموعة (5 دقائق)\n- يعتز بالعادات العمانية الأصيلة (5 دقائق)", "المخرج 1: تحليل\nالمخرج 2: تذكر\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: فهم\nالمخرج 6: تذكر\nالمخرج 7: فهم\nالمخرج 8: فهم\nالمخرج 9: تذكر\nالمخرج 10: تطبيق\nالمخرج 11: تحليل\nالمخرج 12: تحليل\nالمخرج 13: إبداع\nالمخرج 14: تحليل\nالمخرج 15: تقييم\nالمخرج 16: تطبيق\nالمخرج 17: تحليل\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: تقييم\nالمخرج الآخر 6: تطبيق\nالمخرج الآخر 7: تقييم", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التنبؤ\n4. القراءة التصفحية\n5. التعلم بالنمذجة\n6. تعدد القراءات\n7. التعلم بالأقران\n8. الرؤوس المرقمة\n9. التعلم المبني على اللعب\n10. التصور البصري\n11. فكر-زاوج-شارك\n12. أعواد المثلجات\n13. المسابقات التنافسية\n14. لعب الأدوار\n15. الحوار والمناقشة", "1. الكتاب\n2. صورة توضيحية\n3. السبورة الذكية\n4. جهاز عرض البيانات\n5. استمارة معايير القراءة\n6. بطاقات جدار الكلمات\n7. السبورة التقليدية\n8. أعواد المثلجات", "1. القراءة التصفحية\n2. العنوان\n3. التوقع\n4. الكاتبة جوخة الحارثية\n5. القراءة الجهرية\n6. الكتّاب\n7. التيمينة\n8. المصحف\n9. المعنى الصريح\n10. القراءة الثنائية\n11. معايير القراءة\n12. المعنى\n13. السياق\n14. الضد\n15. المهيب\n16. أترابها\n17. الاستنتاج\n18. المقارنة\n19. المدرسة\n20. تعدد القراءات\n21. العنوان البديل\n22. نوع النص\n23. الرأي\n24. التعليل\n25. العادات والتقاليد\n26. التراث العماني", "كتابة كلمة «التيمينة» على السبورة وسؤال: ماذا تتوقعون أن تعني؟ وتدوين التوقعات. (5 دقائق)", "1. القراءة التصفحية: شرح القراءة التصفحية بإيجاز وتوجيه الطلبة لتمرير العين سريعًا على العنوان والصور والحواشي، ويقوم التلميذ بالتصفح السريع ضمن الزمن المحدد (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مناقشة أسئلة أتصفح: مناقشة أسئلة «أتصفح»: ما في الصورة؟ عمل الرجل الكبير؟ زمن الأحداث؟ من الكاتبة؟ ويقوم التلميذ بالإجابة اعتمادًا على الصور والحاشية (16 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n3. التعريف بالكاتبة وتعديل التوقعات: تعريف مبسط بالكاتبة جوخة الحارثية وإنجازها، ومقارنة التوقعات الأولى بالمعلومات الجديدة، وتعديل التوقعات وتدوين الفكرة الافتراضية عن النص (11 دقيقة)\nالاستراتيجيات: القراءة التصفحية.\n\n4. القراءة النموذجية: تذكير بمعايير القراءة الجهرية وقراءة نموذجية معبرة للنص مع عرضه على جهاز العرض، ويقوم التلميذ بالمتابعة بالإصبع وتحديد الكلمات الصعبة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. القراءات الفردية: تنظيم القراءة الفردية بالتناوب بدءًا بالمجيدين وتصويب الأخطاء بعد تمام الجملة، ويقوم التلميذ بالقراءة الجهرية مراعين الضبط وعلامات الترقيم (18 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n6. معاني المفردات من السياق: عرض العبارات المتضمنة كلمات (المهيب، أترابها) ومناقشة البدائل في الكتاب ص 41، والتلميذ: اختيار المعنى الصحيح وتعليله من السياق (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة الأضداد: لعبة الأضداد بالبطاقات لكلمات من الفقرة الأولى، والتلميذ: مطابقة الكلمة بضدها وكتابتها في الكتاب ص 42 (13 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n8. جدار الكلمات: بناء «جدار الكلمات» للدرس وتكليف كل مجموعة بجملة لكلمة، والتلميذ: كتابة الجمل ولصقها على الجدار (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. الفكرة العامة: سؤال: ما الذي كان يشغل نورة؟ واستخلاص الفكرة العامة، والتلميذ: صياغة الفكرة العامة بجملة (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. القراءة الثنائية بمعايير القراءة: تنفيذ القراءة الثنائية مع استمارة معايير القراءة الجهرية على السبورة، ويقوم التلميذ بالقراءة بالتبادل وتقييم الزميل (16 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n11. أسئلة المستوى الأول: طرح أسئلة المستوى الأول ص 40 في أثناء القراءة وتدوين الإجابات الصحيحة، ويقوم التلميذ بالإجابة بالعودة إلى النص ونقل الإجابات (12 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n12. وصف مصحف نورة: تكليف المجموعات بوصف مصحف نورة بكلمات من الفقرة الأولى، ويقوم التلميذ بالبحث في الفقرة وكتابة الصفات (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. المقارنة بين المدرسة والكتّاب: رسم مخطط «فن» على السبورة وتوجيه المجموعات إلى المقارنة بين المدرسة والكتّاب، وتعبئة المخطط بأوجه الشبه والاختلاف (15 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n14. استنتاج سبب تعلق نورة بالتيمينة: طرح سؤال: لماذا تبدو نورة متعلقة إلى هذا الحد بالتيمينة؟ بطريقة فكر-زاوج-شارك، ويقوم التلميذ بالاستنتاج الفردي ثم الثنائي ثم المشاركة (13 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n15. أسئلة المستوى الثاني: مناقشة أسئلة المستوى الثاني في الكتاب وتدوين الإجابات، ويقوم التلميذ بالإجابة وكتابة الاستنتاج في الكتاب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n16. تعدد القراءات: توزيع فقرات النص على المجموعات لتتدرب ثم تقرأ، وسحب أعواد المثلجات لاختيار القارئ، ويقوم التلميذ بالتدرب الجماعي ثم القراءة الفردية المعبرة (16 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n17. أسئلة المستوى الثالث: عنوان آخر ونوع النص: طرح أسئلة المستوى الثالث: عنوان آخر للنص ونوعه، والتلميذ: اقتراح العناوين والتصويت على أفضلها (12 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n18. مسابقة القراءة السليمة: يقوم التلميذ بالمنافسة في القراءة السليمة (9 دقائق)\nالاستراتيجيات: المسابقات التنافسية.\n\n19. سرد تجارب الاحتفال بختم القرآن: إتاحة الفرصة لسرد طريقة الاحتفال بختم القرآن في محيط الطلبة وتجاربهم، ويقوم التلميذ بالسرد بجمل مترابطة والاستماع للزملاء (15 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n20. مقابلة صحفية مع نورة: لعب أدوار: مقابلة صحفية مع «نورة» يطرح فيها الطلبة أسئلة عن شعورها، والتلميذ: طرح أسئلة والإجابة على لسان نورة (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. الرأي والتعليل: سؤال: هل تحب أن تكون مثل نورة؟ ولماذا؟ والتلميذ: إبداء الرأي مع التعليل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n22. غلق الدرس – موكب التيمينة القرائي: تتسابق المجموعات في قراءة جملة معبرة من النص تصف فرحة نورة، وتختار المجموعة الفائزة قارئًا يقرؤها أمام الصف، ثم يذكر الطلبة عادة عمانية أصيلة نعتز بها كالتيمينة ودور الكتاتيب في تعليم القرآن في عُمان (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية، الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): لون مصحف نورة:\nالإجابة: أخضر\nس2 (مستوى التطبيق): كاتبة نص التيمينة:\nالإجابة: جوخة الحارثية\nس3 (مستوى الاستدلال): من أوجه الشبه بين المدرسة والكتّاب:\nالإجابة: كلاهما مكان للتعلم\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم المصحف ويبين للتلميذ اسم السورة ورقم الآية، ثم يتلو معه سورة قصيرة يحفظها مثل سورة الإخلاص مع الإنصات والهدوء؛ وللتحقق يسأله: مم يتكون القرآن الكريم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة عن عادة التيمينة العمانية التي يُحتفى فيها بختم الطفل القرآن الكريم، يكتبون فيها ثلاثة من آداب التلاوة وسبب اهتمامنا بتعلم القرآن.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): إلى أين مضت نورة بمصحفها؟\nالإجابة: إلى الكتّاب\nس2 (مستوى التطبيق): أي جملة وظفت كلمة (أتراب) توظيفًا صحيحًا؟\nالإجابة: لعبت مع أترابي في الحي.\nس3 (مستوى الاستدلال): لماذا نحافظ على عادة التيمينة؟\nالإجابة: لأنها تشجع على حفظ القرآن", "إرشاد للطالب: اسأل أسرتك عن معنى «التيمينة» وعادات الاحتفال بها\nإرشاد للطالب: اقرأ نص التيمينة ص 36–39 قراءة جهرية\nإرشاد للطالب: أجب عن أسئلة المستوى الأول ص 40 بالعودة إلى النص\nإرشاد للطالب: أضف كلمتين جديدتين من الدرس إلى قاموسك الخاص\nإرشاد للطالب: اسأل أحد كبار أسرتك عن ذكرياته في الكتّاب\nإرشاد للطالب: اقرأ فقرة تحبها من النص بصوت معبر لأسرتك\nإرشاد للطالب: احكِ لأسرتك عن احتفال بختم القرآن حضرته أو سمعت عنه\nإرشاد لولي الأمر: حدّث ابنك عن عادة التيمينة وما تعرفه عنها.\nإرشاد لولي الأمر: تابع قراءة ابنك وصوّب أخطاءه بلطف.\nإرشاد لولي الأمر: راجع إجابات ابنك وتأكد من رجوعه إلى النص.\nإرشاد لولي الأمر: ساعد ابنك على استخدام كلمات الدرس الجديدة في حديثه.\nإرشاد لولي الأمر: حدّث ابنك عن الكتاتيب في عُمان قديمًا.\nإرشاد لولي الأمر: شجع ابنك على القراءة المعبرة واقتراح عناوين للقصص.\nإرشاد لولي الأمر: شارك ابنك ذكرياتك عن التيمينة أو احتفالات ختم القرآن.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=4"]}, {"k": "الأنماط اللغوية", "p": ["محاكاة الأسلوب: (وهي تسير جنبًا إلى جنب مع ...)", "النمط اللغوي: الاسم والفعل والحرف (اكتشاف)", "النمط اللغوي: تطبيقات على الاسم والفعل والحرف", "توظيف الاسم والفعل والحرف في الحديث والكتابة", "مراجعة درس التيمينة ومسابقة المجموعات"], "w": "الأسبوع الثالث – الأسبوع الرابع", "f": ["1. يحاكي أسلوب «وهي تسير جنبًا إلى جنب مع...» في جمل من إنشائه (15 دقيقة)\n2. يوظف أسلوب الحال الوصفي في وصف موقف (15 دقيقة)\n3. يميز بين الاسم والفعل والحرف (15 دقيقة)\n4. يصنف كلمات من النص إلى اسم وفعل وحرف (15 دقيقة)\n5. يربط بين الكلمات المتشابهة من حيث النوع (15 دقيقة)\n6. يكمل الفراغ بكلمة مناسبة ويحدد نوعها (15 دقيقة)\n7. يوظف الاسم والفعل والحرف في جمل يتحدث بها (15 دقيقة)\n8. يكتب جملًا مفيدة تتضمن الأنواع الثلاثة (10 دقائق)\n9. يسترجع أبرز معلومات نص التيمينة ومهاراته (10 دقائق)\n10. يطبق ما تعلمه في الأنماط اللغوية والإملائية (15 دقيقة)\nمخرج تعليمي آخر:\n- يحرص على سلامة الجملة وترابطها (10 دقائق)\n- يستمتع بالتعلم عبر اللعب الجماعي (10 دقائق)\n- يدقق في إجابته قبل تسليمها (10 دقائق)\n- يتعاون مع مجموعته في بناء الجمل (15 دقيقة)\n- يتنافس مع زملائه بروح رياضية (15 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج 7: تطبيق\nالمخرج 8: إبداع\nالمخرج 9: تذكر\nالمخرج 10: تطبيق\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: تطبيق", "1. التعلم بالنمذجة\n2. التعلم التعاوني\n3. التعلم الذاتي\n4. التعلم بالاكتشاف\n5. التعلم المبني على اللعب\n6. الرؤوس المرقمة\n7. المسابقات التنافسية", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. بطاقات الكلمات\n5. مكعب الكلمات\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. المحاكاة\n2. الأسلوب\n3. الوصف\n4. الاسم\n5. الفعل\n6. الحرف\n7. الكلمة\n8. التطبيق\n9. الجملة المفيدة\n10. الاسم والفعل والحرف\n11. التاء المربوطة والمفتوحة والهاء\n12. المكان", "عرض ثلاث كلمات من النص (تيمينة، دخل، في) وسؤال: ما الفرق بينها؟ (5 دقائق)", "1. نمذجة أسلوب (جنبًا إلى جنب): نمذجة الأسلوب بأمثلة: «وهو يمشي جنبًا إلى جنب مع أبيه»، وترديد الأمثلة وملاحظة بنيتها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. محاكاة الأسلوب بالصور: عرض صور متنوعة وتكليف كل طالب بمحاكاة الأسلوب لكل صورة، والتلميذ: كتابة جملتين في الكتاب ص 44 (17 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. تصويب جمل المحاكاة: قراءة الجمل وتصويبها جماعيًا، وتحسين الجمل وقراءتها بصوت واضح (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. اكتشاف الاسم والفعل والحرف: قراءة فقرة الكتاب وقيادة الطلبة لاكتشاف الاسم (شخص أو شيء) والفعل (حدث بزمن) والحرف (لا يتم معناه إلا بغيره)، ويقوم التلميذ بالقراءة الجهرية واستنتاج خصائص كل نوع (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. لعبة القطار الثلاثي: لعبة «القطار الثلاثي»: ثلاث عربات (اسم، فعل، حرف) وبطاقات كلمات من النص، وتحميل كل بطاقة في عربتها وتعليل الاختيار (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. حل السؤال الأول في الكتاب: تكليف الطلبة بحل السؤال الأول في الكتاب ومناقشة الإجابات، ويقوم التلميذ بالحل الفردي ثم التصحيح الجماعي (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. الربط بين الكلمات المتشابهة في النوع: توجيه الطلبة إلى تدريب الربط ص 46 بين الكلمتين المتشابهتين في النوع، ويقوم التلميذ بالربط فرديًا ثم المقارنة مع الزميل (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n8. إكمال الفراغ وتحديد النوع: عرض صور تدريب ص 48 وتكليف المجموعات بإكمال الفراغ وتحديد النوع بطريقة الرؤوس المرقمة، والتلميذ: إكمال الجمل وتحديد نوع الكلمة المضافة (15 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. مناقشة الأخطاء الشائعة: مناقشة الأخطاء الشائعة وتوضيحها بأمثلة، وتصحيح الأخطاء في الكتاب (9 دقائق)\nالاستراتيجيات: الرؤوس المرقمة.\n\n10. نمذجة بناء الجملة: نمذجة بناء جملة من ثلاث بطاقات: فعل + اسم + حرف + اسم، والتلميذ: ملاحظة ترتيب الكلمات في الجملة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. مسابقة أطول جملة صحيحة: تكليف المجموعات ببناء أطول جملة صحيحة من بطاقات الكلمات خلال وقت محدد، والتلميذ: بناء الجمل وقراءتها وتحديد نوع كل كلمة (16 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n12. كتابة جملتين عن الكتّاب: تكليف كل طالب بكتابة جملتين عن الكتّاب توظفان الأنواع الثلاثة، ويقوم التلميذ بالكتابة والقراءة على الزميل (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. مراجعة مفردات الدرس وأنماطه بالبطاقات: مراجعة سريعة بالبطاقات لمفردات الدرس وأنماطه، ويقوم التلميذ بالإجابة السريعة بالتناوب (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n14. مسابقة المجموعات: يقوم التلميذ بالمنافسة واختيار الإجابة خلال الوقت (13 دقيقة)\nالاستراتيجيات: المسابقات التنافسية.\n\n15. تصويب الأخطاء الشائعة: مناقشة الأسئلة التي كثر فيها الخطأ، وتصويب الفهم وتدوين ملحوظة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n16. غلق الدرس – فرحة التيمينة: يتحدث الطلبة في مجموعات عن عادة التيمينة العمانية للاحتفاء بالطفل الذي يختم القرآن الكريم، ويتخيلون كيف يهنئون زميلهم، ثم يقول كل طالب جملة عن فضل حفظ القرآن وتشجيع الأسرة (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): كلمة (مصحف) نوعها:\nالإجابة: اسم\nس2 (مستوى التطبيق): أكمل: ذهب الأطفال ...... الحديقة. والكلمة الناقصة نوعها حرف.\nالإجابة: إلى\nس3 (مستوى الاستدلال): رتّب لتكون جملة: (المصحف - نورة - قرأت - من)\nالإجابة: قرأت نورة من المصحف\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم المصحف ويبين للتلميذ اسم السورة ورقم الآية، ثم يتلو معه سورة قصيرة يحفظها مثل سورة الإخلاص مع الإنصات والهدوء؛ وللتحقق يسأله: مم يتكون القرآن الكريم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة عن عادة التيمينة العمانية التي يُحتفى فيها بختم الطفل القرآن الكريم، يكتبون فيها ثلاثة من آداب التلاوة وسبب اهتمامنا بتعلم القرآن.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: الفعل يدل على حدث مرتبط بزمن.\nالإجابة: صواب\nس2 (مستوى التطبيق): أكمل بفعل مناسب: ...... المعلم الدرس.\nالإجابة: شرح\nس3 (مستوى الاستدلال): أي جملة أجمل في الوصف؟\nالإجابة: وهي تسير جنبًا إلى جنب مع معلمها في مقدمة الجمع.", "إرشاد للطالب: اكتب جملتين تحاكي فيهما الأسلوب عن أحد أفراد أسرتك\nإرشاد للطالب: استخرج من النص ثلاثة أسماء وثلاثة أفعال وثلاثة حروف\nإرشاد للطالب: اكتب جملة فيها اسم وفعل وحرف ولوّن كل نوع بلون\nإرشاد للطالب: تحدث مع أسرتك بثلاث جمل عن يومك وحدد الأفعال فيها\nإرشاد للطالب: راجع درس التيمينة ص 33–54 واستعد لدرس جديد\nإرشاد لولي الأمر: شجع ابنك على استخدام الأساليب الجميلة في حديثه.\nإرشاد لولي الأمر: راجع مع ابنك تصنيف الكلمات واطلب منه أمثلة من البيت.\nإرشاد لولي الأمر: تابع ابنك في تلوين الكلمات وفق نوعها.\nإرشاد لولي الأمر: استمع لجمل ابنك وساعده على تحديد الأفعال.\nإرشاد لولي الأمر: ناقش مع ابنك ما تعلمه في درس التيمينة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=4"]}, {"k": "الإملاء", "p": ["النمط الإملائي: التاء المربوطة والتاء المفتوحة والهاء (اكتشاف)", "النمط الإملائي: تدريبات التاء المربوطة والمفتوحة والهاء", "الإملاء: الفقرة الإملائية المنظورة"], "w": "الأسبوع الثالث", "f": ["1. يميز بين التاء المربوطة والتاء المفتوحة والهاء نطقًا وكتابة (10 دقائق)\n2. يصنف كلمات من النص وفق نوع الحرف الأخير (25 دقيقة)\n3. يكمل الكلمات بالتاء المربوطة أو المفتوحة أو الهاء (15 دقيقة)\n4. يكمل الجمل بمفردات تنتهي بالأحرف الثلاثة (15 دقيقة)\n5. يكتب ما يملى عليه كتابة صحيحة (15 دقيقة)\n6. يوظف الظواهر الإملائية التي تعلمها في كتابته (15 دقيقة)\nمخرج تعليمي آخر:\n- ينطق آخر الكلمة نطقًا صحيحًا عند الوقف والوصل (5 دقائق)\n- يحرص على كتابة الكلمة كتابة صحيحة (10 دقائق)\n- يصحح أخطاءه ذاتيًا بدقة (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة", "1. الكتاب\n2. السبورة الذكية\n3. نماذج مجسمة\n4. مجسمات الحروف\n5. لوحة خلية النحل\n6. السبورة التقليدية\n7. الأقلام", "1. التاء المربوطة\n2. التاء المفتوحة\n3. الهاء\n4. الوقف\n5. الفقرة الإملائية", "نطق كلمات (مدرسة، بيت، وجه) بالوقف والوصل وسؤال: ماذا تلاحظون في الحرف الأخير؟ (5 دقائق)", "1. اكتشاف قاعدة الوقف على التاء والهاء: عرض كلمات من النص ملونة الأواخر وقيادة الطلبة لاكتشاف قاعدة الوقف على كل نوع، ويقوم التلميذ بالنطق بالوقف والوصل واستنتاج الفرق (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة اسمعني ثم ارفع: لعبة «اسمعني ثم ارفع»: نطق كلمة ورفع مجسم (ـة، ت، ه) المناسب، ويقوم التلميذ بالاستماع والتمييز ورفع المجسم الصحيح (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التصنيف في الجدول الثلاثي: تصنيف كلمات من النص في جدول ثلاثي، والتلميذ: ملء الجدول في الكتاب ص 49 (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نشاط خلية النحل: تنفيذ نشاط خلية النحل ص 50 جماعيًا على السبورة، والتلميذ: إضافة (ة، ت، ه) المناسبة لكل كلمة وقراءتها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. إكمال الجمل بالمفردات: توجيه الطلبة لإكمال الجمل بالمفردات المعطاة (مهات، مياه، زرعت، الصلاة)، والتلميذ: إكمال الجمل فرديًا وقراءتها (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n6. التصحيح الثنائي: تصحيح ثنائي ومناقشة الأخطاء، وتبادل الكتب والتصحيح (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. قراءة الفقرة الإملائية ومناقشتها: عرض الفقرة الإملائية وقراءتها ومناقشة كلماتها ثم حجبها، ويقوم التلميذ بالقراءة والتهجي الشفوي للكلمات الصعبة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. إملاء الفقرة: إملاء الفقرة بتأنٍّ مع مراعاة الوقف على الكلمات المنتهية بالأحرف الثلاثة، ويقوم التلميذ بالكتابة في الكتاب ص 52 (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. التصحيح الذاتي: التصحيح الذاتي بعد كشف الفقرة ثم احتساب الأخطاء، ويقوم التلميذ بالتصحيح وإعادة كتابة الكلمات الخطأ ثلاث مرات (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – سوق الكلما \n14. التعلم الذاتي\n15. الحوار والمناقشة", "1. الكتاب\n2. صورة توضيحية\n3. السبورة الذكية\n4. جهاز عرض البيانات\n5. بطاقات الأحداث\n6. بطاقات المفردات\n7. السبورة التقليدية\n8. أعواد المثلجات\n9. الأقلام\n10. بطاقات ملونة", "1. التوقع\n2. الصورة\n3. العنوان\n4. الحلوى العمانية\n5. القراءة الجهرية\n6. سوق مطرح\n7. صانع الحلوى\n8. المعنى الصريح\n9. ترتيب الأحداث\n10. الحارات\n11. ديس\n12. رمقها\n13. طاحونة الهواء\n14. الحارة\n15. الصفة\n16. الاستنتاج\n17. المشاعر\n18. العنوان البديل\n19. الشخصية\n20. الصفات\n21. الرأي\n22. التعليل\n23. الهدية\n24. بر الوالدين", "عرض صورة إناء حلوى عمانية وسؤال: متى نقدم الحلوى العمانية؟ (5 دقائق)", "1. القراءة التصفحية: توجيه الطلبة للقراءة التصفحية للعنوان والصورة والحاشية في زمن قصير، ويقوم التلميذ بالتصفح السريع ضمن الزمن (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مناقشة أسئلة أتصفح: مناقشة أسئلة «أتصفح» ص 58: المكان، الزمان، نوع الحلوى، الكاتب، الكتاب، وتسجيل التوقعات في الكتاب (16 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n3. لوحة توقعاتي: تدوين التوقعات على لوحة «توقعاتي» للعودة إليها بعد القراءة، والتلميذ: كتابة التوقع الأهم على بطاقة (11 دقيقة)\nالاستراتيجيات: القراءة التصفحية.\n\n4. القراءة النموذجية: قراءة نموذجية معبرة مع عرض النص على جهاز العرض وتوضيح أسماء الأماكن، ويقوم التلميذ بالمتابعة وتحديد أسماء الأماكن (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. القراءات الفردية: تنظيم القراءة الفردية بالتناوب وتصويب الأخطاء بعد إكمال الجملة، ويقوم التلميذ بالقراءة الجهرية مراعين الضبط (18 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n6. معاني المفردات من السياق: عرض العبارات المتضمنة الكلمات (ديس، رمقها) ومناقشة البدائل ص 64، والتلميذ: اختيار المعنى الصحيح وتعليله بالسياق (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة ارسم الكلمة: لعبة «ارسم الكلمة»: رسم سريع لمعنى كلمة ليخمنها الفريق الآخر، ويقوم التلميذ بالرسم والتخمين (13 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n8. توظيف المفردات في جمل: تكليف الطلبة بكتابة جمل للمفردات الجديدة، والتلميذ: كتابة جملتين وقراءتهما (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. مقارنة التوقعات والفكرة العامة: مقارنة التوقعات بما ورد في النص واستخلاص الفكرة العامة، وتأكيد التوقعات الصحيحة وتعديل غيرها (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. القراءة الثنائية بمعايير القراءة: القراءة الثنائية مع استمارة معايير القراءة الجهرية، ويقوم التلميذ بالقراءة بالتبادل وتقييم الزميل (15 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n11. أسئلة المستوى الأول: طرح أسئلة المستوى الأول ص 63 في أثناء القراءة وتدوين الإجابات، ويقوم التلميذ بالإجابة ونقلها إلى الكتاب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n12. ترتيب أحداث النص: توزيع بطاقات أحداث مبعثرة على المجموعات لترتيبها، ويقوم التلميذ بالترتيب وعرض التسلسل (13 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n13. استنتاج صفة شعبان بالدليل: طرح سؤال: كيف كان شعبان مع سعيد؟ وما الدليل؟ بطريقة فكر-زاوج-شارك، ويقوم التلميذ بالاستنتاج مع الدليل من النص (15 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n14. تمثيل الحوار بين سعيد وشعبان: لعب أدوار للحوار بين سعيد وشعبان، ويقوم التلميذ بالتمثيل بنبرة تعبر عن المشاعر (13 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n15. أسئلة المستوى الثاني: مناقشة أسئلة المستوى الثاني وتدوين الإجابات، ويقوم التلميذ بالإجابة في الكتاب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n16. تعدد القراءات: توزيع فقرات النص على المجموعات للقراءة المتعددة، ويقوم التلميذ بالتدرب والقراءة المعبرة (15 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n17. جدول الشخصيات: تكليف المجموعات بإكمال جدول الشخصيات ص 66 بالاستعانة بالنص، ويقوم التلميذ بالبحث في النص وتعبئة الجدول (13 دقيقة)\nالاستراتيجيات: أعواد المثلجات.\n\n18. العنوان البديل: جمع العناوين المقترحة والتصويت على أفضلها، والتلميذ: اقتراح عنوان وتعليل اختياره (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n19. لو كنت مكان سعيد: طرح سؤال المستوى الرابع: لو كنت مكان سعيد، ما الهدية التي ستقدمها لأبيك؟ ولماذا؟ ويقوم التلميذ بالتفكير والإجابة بجملتين مع التعليل (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n20. بطاقة ترحيب للأب المسافر: تكليف الطلبة بتصميم بطاقة ترحيب للأب المسافر تتضمن جملة شكر، والتلميذ: كتابة البطاقة وتزيينها (16 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. قراءة فقرة أعجبتني وتعليلها: دعوة متطوعين لقراءة فقرة أعجبتهم بصوت معبر وتعليل الإعجاب، ويقوم التلميذ بالقراءة والتعليل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n22. غلق الدرس – ديس الحلوى القرائي: يمرر الطلبة ديس حلوى فارغًا، ومن يستلمه يقرأ جملة معبرة من النص تصف شوق سعيد أو كرم شعبان، ثم يذكر الطلبة أن الحلوى العمانية رمز للكرم والضيافة في عُمان، ويقترحون مناسبة وطنية أو أسرية تقدم فيها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا كان يعطي شعبان سعيدًا كلما مر به؟\nالإجابة: ديس حلوى صغيرًا\nس2 (مستوى التطبيق): معنى (رمقها):\nالإجابة: نظر إليها\nس3 (مستوى الاستدلال): الفكرة العامة للنص:\nالإجابة: شوق سعيد إلى أبيه ورغبته في إسعاده بالحلوى\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم لوحة المحادثة ويساعد التلميذ على تكوين جملة مكتملة عنها بإكمال بدايتها: «يسافر الأب من أجل…»، ثم يعيدها كاملة؛ وللتحقق يسأله: لماذا يسافر بعض الآباء بعيدًا عن أسرهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة ترحيب بالأب العائد في نص «حلوى لأبي» يعبرون فيها عن مشاعرهم، ويقترحون هدية بسيطة كالحلوى العمانية ويعللون اختيارها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صانع الحلوى في النص اسمه:\nالإجابة: شعبان\nس2 (مستوى التطبيق): صواب أم خطأ: كان سعيد غير مهتم بعودة أبيه.\nالإجابة: خطأ\nس3 (مستوى الاستدلال): أي عبارة مناسبة لبطاقة الترحيب؟\nالإجابة: حمدًا لله على سلامتك يا أبي", "إرشاد للطالب: اسأل أسرتك عن مناسبات تقديم الحلوى العمانية\nإرشاد للطالب: اقرأ النص ص 59–62 قراءة جهرية معبرة\nإرشاد للطالب: رتّب أحداث النص لأسرتك شفهيًا\nإرشاد للطالب: اكتب جملتين بكلمتي (ديس، رمق)\nإرشاد للطالب: صف لأسرتك شخصية تحبها بثلاث صفات مع الدليل\nإرشاد للطالب: اقترح عنوانًا آخر للنص واكتب سبب اختيارك\nإرشاد للطالب: قدّم بطاقة الترحيب لأحد والديك\nإرشاد لولي الأمر: حدّث ابنك عن الحلوى العمانية وعادات الضيافة.\nإرشاد لولي الأمر: استمع لقراءة ابنك وناقشه في الفكرة العامة.\nإرشاد لولي الأمر: ناقش ابنك في تسلسل الأحداث.\nإرشاد لولي الأمر: حدّث ابنك عن كلمات تراثية عمانية ومعانيها.\nإرشاد لولي الأمر: ناقش ابنك في صفات الشخصيات التي يقرأ عنها.\nإرشاد لولي الأمر: ناقش ابنك في العنوان الذي اقترحه.\nإرشاد لولي الأمر: شجّع ابنك على التعبير عن مشاعره تجاهكم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=6"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: الجملة الاسمية (اكتشاف المبتدأ والخبر)", "الجملة الاسمية: تطبيقات الربط والإكمال"], "w": "الأسبوع الخامس", "f": ["1. يتعرف الجملة الاسمية وركنيها (25 دقيقة)\n2. يحدد المبتدأ والخبر في جمل من النص (10 دقائق)\n3. يربط بين ركني الجملة الاسمية لتكوين جمل صحيحة (10 دقائق)\n4. يكمل الجملة الاسمية بالعنصر المناسب (15 دقيقة)\n5. يوظف الجملة الاسمية في وصف صورة (10 دقائق)\nمخرج تعليمي آخر:\n- يستمتع بالتعلم من خلال اللعب (5 دقائق)\n- يتحرى الدقة في بناء الجملة (5 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. الرؤوس المرقمة", "1. الكتاب\n2. السبورة الذكية\n3. بطاقات المبتدأ والخبر\n4. صورة توضيحية", "1. الجملة الاسمية\n2. المبتدأ\n3. الخبر\n4. الإكمال", "عرض جملة «الحلوى لذيذة» وسؤال: بأي كلمة بدأت؟ وماذا أخبرتنا عنها؟ (5 دقائق)", "1. اكتشاف المبتدأ والخبر: عرض أمثلة من الدرس وقيادة الطلبة لاكتشاف أن الجملة الاسمية تبدأ باسم (مبتدأ) نخبر عنه (خبر)، ويقوم التلميذ بالملاحظة والاستنتاج (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة النصف الآخر: لعبة «النصف الآخر»: بطاقات مبتدآت وأخبار يبحث كل طالب عن نصفه المكمل، ويقوم التلميذ بالبحث وتكوين جملة اسمية وقراءتها (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تحديد المبتدأ والخبر في جمل الكتاب: تحديد المبتدأ والخبر في جمل الكتاب ص 67، والتلميذ: وضع خط تحت المبتدأ وخطين تحت الخبر (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تدريب الربط بين ركني الجملة: توجيه الطلبة لحل تدريب الربط ص 68 ومناقشة سبب كل ربط، ويقوم التلميذ بالربط وكتابة الجمل (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. إكمال الجمل من الصندوق: تكليف الم 5 دقائق)\n2. يحدد الكلمات المنونة في جمل من النص (15 دقيقة)\n3. يختار الرسم الإملائي الصحيح للكلمة المنونة (15 دقيقة)\n4. يكمل الفراغ بكلمة منونة وفق المطلوب (15 دقيقة)\n5. يكتب ما يملى عليه كتابة صحيحة (15 دقيقة)\n6. يوظف التنوين والتاء المربوطة في كتابته (15 دقيقة)\nمخرج تعليمي آخر:\n- ينطق التنوين نطقًا صحيحًا عند القراءة (20 دقيقة)\n- يدقق في كتابة الكلمات قبل التسليم (10 دقائق)\n- يتحمل مسؤولية تصويب أخطائه (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم بالنمذجة\n4. التعلم التعاوني\n5. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. نماذج مجسمة\n4. مجسمات علامات التنوين\n5. الأقلام\n6. السبورة التقليدية", "1. التنوين\n2. تنوين الضم\n3. تنوين الفتح\n4. تنوين الكسر\n5. الرسم الإملائي\n6. ألف تنوين الفتح\n7. الإملاء المنظور\n8. التصويب", "نطق كلمة (حلوى) بالتنوين الثلاثي في جمل والاستماع إلى صوت النون في الآخر. (5 دقائق)", "1. اكتشاف أنواع التنوين: عرض جمل من النص تتضمن كلمات منونة وقيادة الطلبة لاكتشاف أنواع التنوين، ويقوم التلميذ بالقراءة وتلوين الكلمات المنونة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة القفز على النوع: لعبة «القفز على النوع»: ثلاث دوائر على الأرض لكل نوع تنوين وقراءة كلمات، ويقوم التلميذ بالقفز إلى الدائرة الصحيحة (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تدريب الكتاب على التنوين: تدريب الكتاب ص 69 فرديًا، ويقوم التلميذ بالحل والتصحيح الثنائي (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. اختيار الرسم الصحيح للكلمة المنونة: توجيه الطلبة لاختيار الرسم الصحيح في جمل ص 70 مع التعليل، ويقوم التلميذ بالاختيار والتعليل (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. إكمال الفراغ بكلمة منونة: تكليف المجموعات بإكمال الفراغ بكلمة (تمر) منونة وفق المطلوب بين القوسين، ويقوم التلميذ بالإكمال وقراءة الجمل (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التصحيح الجماعي: تصحيح جماعي على السبورة، ويقوم التلميذ بالمقارنة والتصويب (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. قراءة الفقرة الإملائية ومناقشتها: عرض الفقرة وقراءتها ومناقشة كلماتها المنونة ثم حجبها، ويقوم التلميذ بالتهجي الشفهي والتركيز على التنوين (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. إملاء الفقرة: إملاء الفقرة بتأنٍّ، ويقوم التلميذ بالكتابة في الكتاب ص 72 بخط واضح (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. التصحيح الذاتي: كشف الفقرة والتصحيح الذاتي وحساب الأخطاء، ويقوم التلميذ بالتصحيح وإعادة كتابة الكلمات الخطأ (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – مجلس الضيافة العماني: تتسابق المجموعات في إكمال جمل عن الضيافة العمانية بكلمة (تمر) أو (قهوة) منونة وفق المطلوب، مثل: «قدّمنا للضيف ......»، وتكتبها على السبورة كتابة صحيحة، ثم يقول الطلبة جملة عن كرم أهل عُمان (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية، التعلم التعاوني.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): التنوين صوت ...... نسمعه ولا نكتبه.\nالإجابة: نون ساكنة\nس2 (مستوى التطبيق): الكلمة المنونة بالفتح:\nالإجابة: سوقًا\nس3 (مستوى الاستدلال): أكمل بتنوين الضم: في مجلسنا ...... وحلوى.\nالإجابة: تمرٌ\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم لوحة المحادثة ويساعد التلميذ على تكوين جملة مكتملة عنها بإكمال بدايتها: «يسافر الأب من أجل…»، ثم يعيدها كاملة؛ وللتحقق يسأله: لماذا يسافر بعض الآباء بعيدًا عن أسرهم؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة بطاقة ترحيب بالأب العائد في نص «حلوى لأبي» يعبرون فيها عن مشاعرهم، ويقترحون هدية بسيطة كالحلوى العمانية ويعللون اختيارها.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): الكلمة الصحيحة:\nالإجابة: مسرورًا\nس2 (مستوى التطبيق): أكمل بتنوين الكسر: يقدم أبي الحلوى مع ......\nالإجابة: تمرٍ\nس3 (مستوى الاستدلال): صواب أم خطأ: الكلمة التي تبدأ بـ(ال) لا تُنوّن.\nالإجابة: صواب", "إرشاد للطالب: استخرج من النص ثلاث كلمات منونة بأنواع مختلفة\nإرشاد للطالب: اكتب ثلاث جمل عن ضيافة الضيوف بكلمات منونة\nإرشاد للطالب: أعد كتابة الفقرة الإملائية ص 72 سليمة\nإرشاد لولي الأمر: ساعد ابنك على نطق التنوين في قراءته.\nإرشاد لولي الأمر: راجع مع ابنك كتابة التنوين بأنواعه.\nإرشاد لو ق)", "1. تصفح النص وملاحظة شكله: توجيه الطلبة لتصفح النص سريعًا وملاحظة شكله وصوره، ويقوم التلميذ بالتصفح وملاحظة الأبيات (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. مناقشة أسئلة أتصفح: مناقشة أسئلة «أتصفح» ص 76: المقصود برفاق المجد، علاقة أطفال المدارس بصور الوظائف، نوع النص، ويقوم التلميذ بالإجابة وتسجيل التوقعات (16 دقيقة)\nالاستراتيجيات: التنبؤ.\n\n3. المقارنة بين النص الشعري والقصصي: مقارنة شكل النص الشعري بالنص القصصي في الدرسين السابقين، والتلميذ: ذكر الفروق (أبيات، قافية، إيقاع) (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الإلقاء النموذجي: إلقاء نموذجي معبر للأبيات أو تشغيل تسجيلها مع إبراز الإيقاع، ويقوم التلميذ بالمتابعة والإنصات (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. القراءة الفردية بيتًا بيتًا: تنظيم القراءة الفردية بيتًا بيتًا وتصويب النطق والوقف، ويقوم التلميذ بالقراءة الجهرية مراعين الإيقاع (18 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n6. معاني المفردات من السياق: مناقشة معاني (العون، الجد، الندي، هيا) من سياق الأبيات، ويقوم التلميذ بالاستنتاج وكتابة المعاني (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n7. لعبة زوج المرادفات: لعبة «زوج المرادفات»: بطاقات كلمات ومرادفاتها، ويقوم التلميذ بالمطابقة وقراءة الأزواج (13 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n8. توظيف المفردات في جمل: تكليف الطلبة بتوظيف كلمتين في جمل عن المدرسة، ويقوم التلميذ بالكتابة والقراءة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. الفكرة العامة: استخلاص الفكرة العامة بسؤال: إلى ماذا ينادي العصفور؟ والتلميذ: صياغة الفكرة العامة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. القراءة الثنائية والجماعية: القراءة الثنائية بالمعايير ثم القراءة الجماعية، ويقوم التلميذ بالقراءة وتقييم الزميل (15 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n11. أسئلة المستوى الأول: طرح أسئلة المستوى الأول ص 79: على لسان من يتحدث الشاعر؟ ما الذي يدعو إليه؟ الشخصيات؟ ويقوم التلميذ بالبحث في الأبيات والإجابة (13 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n12. استخراج أفعال الأمر: استخراج أفعال الأمر التي وجهها الشاعر للرفاق، ويقوم التلميذ بالاستخراج والكتابة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. العلاقة بين العنوان والمضمون: تطبيق فكر-زاوج-شارك على سؤال العلاقة بين العنوان والمضمون، ويقوم التلميذ بالتفكير والمناقشة والمشاركة (15 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n14. أرقام الأبيات الدالة على المعاني: تكليف المجموعات بتحديد أرقام الأبيات الدالة على المعاني في الكتاب ص 81، ويقوم التلميذ بالبحث وكتابة رقم البيت (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n15. مناقشة الإجابات وتدوينها: مناقشة الإجابات وتدوين الصحيح على السبورة، ويقوم التلميذ بالتصحيح ونقل الإجابة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n16. العنوان البديل: جمع العناوين المقترحة مع أسبابها والتصويت عليها، والتلميذ: اقتراح العنوان والتعليل (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n17. بطاقات حلمي: توزيع بطاقات «حلمي» ليكتب الطالب حلمه وثلاث خطوات لتحقيقه، ويقوم التلميذ بالكتابة والمشاركة (16 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n18. الرأي في دعوات الشاعر: مناقشة الرأي في دعوات الشاعر، والتلميذ: إبداء الرأي مع التعليل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n19. غلق الدرس – عصافير المجد: تقف كل مجموعة كسرب عصافير وتقرأ بيتًا من النص قراءة معبرة مراعية الإيقاع، ثم يذكر كل طالب وظيفة يحلم بها يخدم بها عُمان ويقول: «أنا من رفاق المجد» (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، تعدد القراءات.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): يتحدث الشاعر على لسان:\nالإجابة: العصفور\nس2 (مستوى التطبيق): مرادف (الجد):\nالإجابة: الاجتهاد\nس3 (مستوى الاستدلال): البيت الذي يدعو إلى المساعدة فيه كلمة:\nالإجابة: ساعدوا\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم علم عُمان ويلوّن التلميذ رسمًا له بالأحمر والأبيض والأخضر، ويقف معه وقفة احترام وهو يقول جملة عن العلم؛ وللتحقق يسأله: ما ألوان علم سلطنة عُمان؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة ثلاثة أعمال يسهمون بها في رفعة الوطن وهم صغار، وتوضيح من هم «رفاق المجد» في رأيهم، ثم قراءة بيتين من النص مع مراعاة الإيقاع.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): تدل صور الوظائف في الدرس على:\nالإجابة: أحلام الأطفال في المستقبل\nس2 (مستوى التطبيق): أي جملة وظفت (العون) توظيفًا صحيحًا؟\nالإجابة: قدمت العون لجدي في حمل أغراضه.\nس3 (مستوى الاستدلال): لماذا يحتاج الحلم إلى عمل؟\nالإجابة: لأن الأحلام لا تتحقق بالتمني وحده", "إرشاد للطالب: اكتب الوظيفة التي تحلم بها وكيف ستخدم وطنك\nإرشاد للطالب: اقرأ الأبيات بصوت معبر أمام أسرتك\nإرشاد للطالب: استخرج أفعال الأمر من النص واكتبها في دفترك\nإرشاد للطالب: وظف كلمتي (العون، الجد) في جملتين\nإرشاد للطالب: اشرح لأسرتك العلاقة بين العنوان والأبيات\nإرشاد للطالب: علّق بطاقة حلمك في غرفتك وراجع خطواتها\nإرشاد لولي الأمر: حدّث ابنك عن أحلامه المستقبلية وشجعه.\nإرشاد لولي الأمر: استمع لقراءة ابنك وشجعه على مراعاة الإيقاع.\nإرشاد لولي الأمر: ناقش ابنك في الدعوات التي وردت في النص.\nإرشاد لولي الأمر: شجع ابنك على استخدام كلمات النص في حديثه.\nإرشاد لولي الأمر: ناقش ابنك في أهمية الجد لتحقيق الأحلام.\nإرشاد لولي الأمر: ساعد ابنك على تحقيق خطوات حلمه الصغيرة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=8"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: المفرد والمثنى والجمع (اكتشاف من الأبيات)", "المفرد والمثنى والجمع: تطبيقات التلوين والتحويل", "المفرد والمثنى والجمع: أعضاء الإنسان في الآيات الكريمة", "مراجعة درس «رفاق المجد» ومسابقة المجموعات"], "w": "الأسبوع السادس – الأسبوع السابع", "f": ["1. يتعرف المفرد والمثنى والجمع في الأبيات (25 دقيقة)\n2. يميز علامات المثنى (ان، ين) والجمع (5 دقائق)\n3. يستخرج من الشبكة كلمات ويصنفها مفردًا ومثنى وجمعًا (15 دقيقة)\n4. يحول الكلمة إلى المثنى والجمع في جمل (15 دقيقة)\n5. يستخرج أعضاء الإنسان وحواسه من آيات كريمة (25 دقيقة)\n6. يحول الكلمات المستخرجة إلى المفرد (5 دقائق)\n7. يسترجع معاني النص ودعواته (10 دقائق)\n8. يطبق المفرد والمثنى والجمع واللام الشمسية والقمرية (15 دقيقة)\nمخرج تعليمي آخر:\n- يعمل بروح الفريق في الاكتشاف (10 دقائق)\n- يدقق في كتابة صيغ الكلمات (10 دقائق)\n- يشكر الله على نعمة الحواس (10 دقائق)\n- يتنافس بروح رياضية مع زملائه (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج 7: تذكر\nالمخرج 8: تطبيق\nالمخرج الآخر 1: تطبيق\n ي", "عرض صور احتفال مدرسي بالعيد الوطني وسؤال: ماذا فعلنا في احتفال العام الماضي؟ (5 دقائق)", "1. تحديد المكان والزمان في فقرة الكتاب: قراءة فقرة الكتاب «في صباح يوم الخميس الماضي قصدت ميدان الاحتفال...» وتوجيه الطلبة لوضع خط تحت المكان وخطين تحت الزمان، ويقوم التلميذ بالقراءة والتحديد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. تصنيف بطاقات المكان والزمان: تكليف المجموعات بإعادة ترتيب بطاقات عبارات مكانية وزمانية في جدول، ويقوم التلميذ بالتصنيف والعرض (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. أهمية المكان والزمان في النص: مناقشة أهمية المكان والزمان في وضوح النص، والتلميذ: ذكر الفائدة بأسلوبهم (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تحديد مراحل الاحتفال: تحديد مراحل الاحتفال على السبورة (رفع العلم، ترديد النشيد، كلمة المدير...) مع عبارات المكان والزمان، وترتيب المراحل شفهيًا (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. كتابة نص عن الاحتفال بالعيد الوطني: تكليف الطلبة بكتابة نص قصير (5–6 جمل) يصف الاحتفال في الثامن عشر من نوفمبر، ويقوم التلميذ بالكتابة الفردية (15 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n6. قراءة النماذج والتغذية الراجعة: قراءة نماذج وتقديم تغذية راجعة، ويقوم التلميذ بالاستماع والتحسين (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. المراجعة الذاتية بقائمة التدقيق: توزيع قائمة تدقيق (المكان، الزمان، الترتيب، الترقيم، الإملاء)، والتلميذ: مراجعة النص ذاتيًا (11 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n8. مراجعة الأقران: تنفيذ مراجعة الأقران وتبادل النصوص، والتلميذ: قراءة نص الزميل وكتابة ملحوظتين (14 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n9. إعادة كتابة النص المحسن: تكليف الطلبة بإعادة كتابة النص المحسن، والتلميذ: إعادة الكتابة بخط واضح (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – متى وأين نحتفل؟: يرفع الطلبة بطاقة «متى» أو «أين» عند سماع عبارات من احتفال العيد الوطني (في الثامن عشر من نوفمبر، في ساحة المدرسة، بعد رفع العلم، أمام القلعة)، ثم تكتب كل مجموعة جملة واحدة تجمع مكانًا وزمانًا تعبر بها عن فرحتها بعيد وطنها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التعلم التعاوني.", "تفريد ا  شفهية عنه، ويقوم التلميذ بالاستماع والإجابة (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. التحدث عن موضوع من المحور: تكليف الطلبة بالتحدث حديثًا قصيرًا عن موضوع من المحور مع رصد الأداء، ويقوم التلميذ بالتحدث أمام المجموعة (8 دقائق)\nالاستراتيجيات: التأمل الذاتي.\n\n3. قائمة أقيم أدائي: توجيه الطلبة إلى قائمة «أقيم أدائي» ص 99 وتلوين المؤشرات، ويقوم التلميذ بالتلوين الذاتي بصدق (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – ميكروفون المحور: يمرر الطلبة ميكروفونًا رمزيًا، ومن يستلمه يتحدث بجملتين تامتين بصوت واضح عن أجمل ما استمع إليه في محور «الحياة من حولي»، ثم يذكر عادة عمانية أصيلة تعرّفها في المحور كالتيمينة أو الحلوى العمانية في الضيافة، ويصفق له زملاؤه (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب، التأمل الذاتي.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: التقويم الذاتي يعني أن أحكم على أدائي بصدق.\nالإجابة: صواب\nس2 (مستوى التطبيق): من مؤشرات الاستماع الجيد:\nالإجابة: الإجابة عن أسئلة النص المسموع\nس3 (مستوى الاستدلال): من مؤشرات التحدث الجيد:\nالإجابة: جمل تامة بصوت واضح\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم على التلميذ قائمة رصد مصورة لمؤشرات الاستماع والتحدث، ويستمع معه إلى نص قصير ثم يضع إشارة أمام كل مؤشر حققه؛ وللتحقق يسأله: ما علامة التحدث الجيد؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتقييم حديث زميل وفق قائمة الرصد بصدق، وكتابة نقطة قوة واقتراح للتحسين، ثم يضع كل منهم هدفًا لتحسين قراءته في المحور التالي.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): إذا وجدت مهارة لم أتقنها فإنني:\nالإجابة: أتدرب عليها وأطلب المساعدة\nس2 (مستوى التطبيق): صواب أم خطأ: أتحدث في موضوع واحد دون استطراد.\nالإجابة: صواب\nس3 (مستوى الاستدلال): الهدف من «أقيم أدائي»:\nالإجابة: معرفة ما أتقنته وما أحتاجه", "إرشاد للطالب: شارك أسرتك نتيجة تقويمك الذاتي\nإرشاد لولي الأمر: ادعم ابنك في المهارة التي يحتاجها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=9"]}, {"k": "القراءة", "p": ["أقيم أدائي: القراءة والفهم", "خطة تحسيني الشخصية ومسابقة المحور الأول"], "w": "الأسبوع الثامن ق.\nس2 (مستوى التطبيق): صواب أم خطأ: لا تحتاج الفقرة إلى علامات ترقيم.\nالإجابة: خطأ\nس3 (مستوى الاستدلال): نختم الفقرة بجملة:\nالإجابة: تلخص شعورنا أو النهاية", "إرشاد للطالب: اكتب فقرة عن نزهة أسرية تتضمن المكان والزمان\nإرشاد لولي الأمر: اقرأ فقرة ابنك وامدح جهده.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=9"]}]}, {"t": "مراجعة المحور الأول", "u": "المحور الأول: الحياة من حولي", "s": [{"k": "التحدث", "p": ["مراجعة الاستماع والمستند البصري"], "w": "الأسبوع التاسع", "f": ["1. يسترجع آداب الاستماع وخطواته (5 دقائق)\n2. يجيب عن أسئلة نص استماع ومستند بصري جديدين (25 دقيقة)\nمخرج تعليمي آخر:\n- يوظف آداب الاستماع في المواقف اليومية (10 دقائق)", "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "1. التعلم التعاوني\n2. التعلم المبني على اللعب\n3. السؤال والجواب", "1. الكتاب\n2. الوسائل المتعددة (سمعية - بصرية)\n3. السبورة الذكية\n4. صورة توضيحية", "1. آداب الاستماع\n2. الإعلان الإرشادي\n3. المستند البصري", "لعبة «الهمسة»: تمرير جملة همسًا عبر الصف ومقارنة نهايتها ببدايتها. (5 دقائق)", "1. الاستماع إلى نص جديد: تشغيل نص استماع قصير جديد وطرح أسئلته وفق خطوات الاستماع الثلاث، ويقوم التلميذ بالاستماع والإجابة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. قراءة إعلان إرشادي جديد: عرض إعلان إرشادي جديد عن السلامة ومناقشة مكوناته وهدفه، وتحديد المكونات والهدف (7 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. الخريطة الذهنية للمراجعة: تلخيص ما راجعوه في خريطة ذهنية، ويقوم التلميذ بالمشاركة في الخريطة (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. غلق الدرس – آداب السبلة: يمثّل الطلبة مجلسًا في السبلة العمانية: يتحدث طالب ويستمع الآخرون مطبقين آداب الاستماع، ثم يقيّم أفراد المجموعة التزامهم بالآداب ويقولون لماذا يحترم العمانيون المتحدث ولا يقاطعونه (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): خطوات الاستماع ثلاث: الاستماع الأول ثم الثاني ثم ......\nالإجابة: الثالث للتصحيح\nس2 (مستوى التطبيق): صواب أم خطأ: الإعلان الإرشادي يقدم نصيحة.\nالإجابة: صواب\nس3 (مستوى الاستدلال): موضو ني\n2. التعلم المبني على اللعب\n3. الرؤوس المرقمة\n4. لعب الأدوار\n5. السؤال والجواب\n6. التعلم بالنمذجة\n7. فكر-زاوج-شارك\n8. المسابقات التنافسية", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: بطاقات أسئلة\n4. صورة توضيحية\n5. الوسائل المتعددة (سمعية - بصرية)\n6. أخرى: بطاقات الكلمات", "1. الفهم القرائي\n2. الشخصيات\n3. القيم\n4. الأحداث\n5. الصفات\n6. المشاعر\n7. الدعوة\n8. الأمر\n9. المجد\n10. المفردة\n11. المرادف\n12. الضد", "لعبة «بينغو الكلمات» بمفردات المحور. (5 دقائق)", "1. القراءة الجهرية لنص التيمينة: قراءة جهرية سريعة للنص بالتناوب، والتلميذ: القراءة (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. أسئلة الفهم المتدرجة: طرح أسئلة متدرجة بطريقة الرؤوس المرقمة، ويقوم التلميذ بالإجابة الجماعية والفردية (14 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n3. القيم المستفادة: استخلاص القيم وكتابتها على السبورة، والتلميذ: ذكر القيم والأدلة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. القراءة الجهرية لنص حلوى لأبي: القراءة الجهرية المتناوبة لمقاطع النص، والتلميذ: القراءة (13 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n5. تمثيل الحوار: لعب أدوار الحوار بين سعيد وشعبان مع أسئلة استنتاج، ويقوم التلميذ بالتمثيل والإجابة (14 دقيقة)\nالاستراتيجيات: السؤال والجواب.\n\n6. التلخيص الكتابي: تلخيص النص في ثلاث جمل، والتلميذ: كتابة التلخيص (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. دعوات الشاعر في رفاق المجد: مناقشة دعوات الشاعر وأفعال الأمر، ويقوم التلميذ بالاستخراج والتوضيح (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. تطبيق الدعوات في يومي: فكر-زاوج-شارك: كيف أطبق دعوات الشاعر في يومي؟ ويقوم التلميذ بالتفكير والمشاركة (14 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n9. وعد رفيق المجد: كتابة «وعد رفيق المجد» في سطرين، والتلميذ: الكتابة (8 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. معجم المحور: مراجعة جدار الكلمات للمحور ومعانيها، ويقوم التلميذ بالقراءة والتوضيح (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «أي جملة وظفت (العون) صحيحًا» على السبورة، ويناقش المعلم الإجابات مع الصف (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n12. توظيف المفردات في فقرة: كتابة فقرة قصيرة توظف ثلاث مفردات، والتلميذ: الكتابة (8 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. غلق الدرس – عادات من بلادي: تتسابق المجموعات في مطابقة بطاقات عبارات بنصوصها (التيمينة، حلوى لأبي، رفاق المجد)، ثم تذكر كل مجموعة عادة عمانية وردت في النصوص كالتيمينة والحلوى العمانية وتقول كيف نحافظ عليها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الشخصية الرئيسة في نص التيمينة:\nالإجابة: نورة\nس2 (مستوى التطبيق): صواب أم خطأ: يدعو النص إلى التبكير والجد.\nالإجابة: صواب\nس3 (مستوى الاستدلال): مرادف (رمقها):\nالإجابة: نظر إليها\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم ثلاثة أسهم للاستماع الأول والثاني والثالث، ويستمع مع التلميذ إلى نص قصير ويحدد في كل مرة ما يفعله (فهم، تثبيت، تصحيح)؛ وللتحقق يسأله: ما خطوات الاستماع الثلاث؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يربط نصوص المحور الأول (التيمينة، حلوى لأبي، رفاق المجد، إعلان الحقيبة) بقيمها، ثم يصممون إعلانًا إرشاديًا قصيرًا عن إحدى هذه القيم.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ماذا أراد سعيد لأبيه؟\nالإجابة: الحلوى\nس2 (مستوى التطبيق): ضد (اليمين):\nالإجابة: اليسار\nس3 (مستوى الاستدلال): صواب أم خطأ: المعلم سرور كان يقف عند الباب.\nالإجابة: خطأ", "إرشاد للطالب: أعد قراءة نص التيمينة؛ لخص نص حلوى لأبي لأسرتك؛ اكتب وعدك كرفيق مجد وعلقه في غرفتك؛ راجع قاموسك الخاص بمفردات المحور.\nإرشاد لولي الأمر: ناقش مع ابنك قيم النص؛ استمع لتلخيص ابنك؛ ساعد ابنك على الوفاء بوعده؛ اختبر ابنك في معاني خمس مفردات.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=10"]}, {"k": "الأنماط اللغوية", "p": ["مراجعة الاسم والفعل والحرف والجملة الاسمية", "مراجعة المفرد والمثنى والجمع", "اختبار قصير ومسابقة المحور الأول"], "w": "الأسبوع التاسع", "f": ["1. يصنف الكلمات إلى اسم وفعل وحرف (15 دقيقة)\n2. يحدد المبتدأ والخبر في الجملة الاسمية (15 دقيقة)\n3. يحول الكلمات بين المفرد والمثنى والجمع (15 دقيقة)\n4. يوظف الصيغ في جمل صحيحة (15 دقيقة)\n5. يجيب عن أ  دون تدوين ثم استماع مع الإجابة وترتيب الخطوات، ويقوم التلميذ بالاستماع والإجابة وترتيب الخطوات بأرقام (9 دقائق)\nالاستراتيجيات: السؤال والجواب.\n\n3. الاستماع الثالث والتصحيح: الاستماع الثالث للتصحيح ومناقشة أهمية التجارب وكلمات الترتيب (أولًا، ثم، بعد ذلك، أخيرًا)، ويقوم التلميذ بالتصحيح وإعادة سرد الخطوات بالترتيب (6 دقائق)\nالاستراتيجيات: التصور البصري.\n\n4. غلق الدرس – فريق التجربة: تمثل كل مجموعة خطوات تجربة «ضوء في يدك» بالحركات مستخدمة كلمات الترتيب (أولًا، ثم، بعد ذلك، أخيرًا) ويخمن زملاؤها الخطوة، ثم تقول المجموعة كيف يخدم العلم والتجارب وطننا عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): قبل إجراء التجربة نحضر:\nالإجابة: الأدوات اللازمة\nس2 (مستوى التطبيق): نتبع خطوات التجربة:\nالإجابة: بالترتيب الذي سمعناه\nس3 (مستوى الاستدلال): لماذا نجري التجارب العلمية؟\nالإجابة: لنكتشف ونتعلم بأنفسنا\n\n• نشاط علاجي (لمن لم يتقن): يقرأ المعلم تعليمات تجربة «ضوء في يدك» مع بطاقات مصورة لكل خطوة، ويرتب التلميذ البطاقات مع زميل ثم ينفذان الخطوة الأولى؛ وللتحقق يسأله: ماذا نحضّر قبل إجراء التجربة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة تعليمات تجربة بسيطة جديدة (ظل اليد على الجدار بمصباح) بخطوات مرتبة، وتوضيح ما يحدث لو تغير ترتيب خطوة، مع مراعاة قواعد السلامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كلمة تدل على الخطوة الأخيرة:\nالإجابة: أخيرًا\nس2 (مستوى التطبيق): صواب أم خطأ: نلتزم الوقت المحدد في أثناء التجربة.\nالإجابة: صواب\nس3 (مستوى الاستدلال): إذا لم تنجح التجربة فإننا:\nالإجابة: نراجع الخطوات ونعيد المحاولة", "إرشاد للطالب: احكِ لأسرتك خطوات التجربة بالترتيب.\nإرشاد لولي الأمر: نفّذ مع ابنك تجربة بسيطة آمنة بإشرافك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=11"]}]}, {"t": "المستند البصري: قراءة شعار", "u": "المحور الثاني: علوم واكتشافات", "s": [{"k": "التحدث", "p": ["قراءة شعار الصيدلية"], "w": "الأسبوع العاشر", "f": ["1. يقرأ شعار الصيدلية ويصف عناصره (10 دقائق)\n2. يستنتج دلالة عناصر الشعار (15 دقيقة)\n3. يبين أهمية الشعا ستدلال): لو صممت شعارًا لمكتبة فأنسب رمز:\nالإجابة: كتاب مفتوح", "إرشاد للطالب: اجمع شعارين من بيئتك واكتب معناهما.\nإرشاد لولي الأمر: ساعد ابنك على ملاحظة الشعارات وفهم دلالاتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=12"]}]}, {"t": "الدرس القرائي الأول: رحلة السندباد الثامنة", "u": "المحور الثاني: علوم واكتشافات", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: البحر وتاريخ عُمان البحري"], "w": "الأسبوع العاشر", "f": ["1. يتحدث بطلاقة عن فوائد البحر (15 دقيقة)\n2. يربط لوحة المحادثة بتاريخ عُمان البحري (15 دقيقة)\nمخرج تعليمي آخر:\n- يعتز بتاريخ عُمان البحري (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تقييم", "1. التعلم التعاوني\n2. الحوار والمناقشة\n3. العصف الذهني", "1. الكتاب\n2. صورة توضيحية\n3. السبورة الذكية\n4. جهاز عرض البيانات", "1. البحر\n2. السفينة\n3. البحارة\n4. التاريخ البحري", "عرض صورة سفينة عمانية تقليدية وسؤال: إلى أين كانت هذه السفن تبحر؟ (5 دقائق)", "1. وصف لوحة المحادثة: عرض لوحة المحادثة ومطالبة الطلبة بوصفها والحديث عن فوائد البحر، ويقوم التلميذ بالوصف بجمل مترابطة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. العمانيون والملاحة: مناقشة: لماذا اشتهر العمانيون بالملاحة؟ وتدوين الأفكار، والتلميذ: ذكر ما يعرفونه من تاريخ عُمان البحري (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. حاجات البحار في رحلته: العصف الذهني: ما الذي يحتاجه البحار في رحلته؟ والتلميذ: اقتراح الحاجات وتصنيفها (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. غلق الدرس – طاقم السفينة العمانية: يقسّم المعلم الطلبة إلى طاقم سفينة عمانية تقليدية: ربان وبحارة ومراقب، ويتعاون كل طاقم في وصف رحلة بحرية قصيرة يذكر فيها فوائد البحر، اعتزازًا بتاريخ عمان البحري (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من فوائد البحر:\nالإجابة: الصيد والتجارة والنقل\nس2 (مستوى التطبيق): صواب أم خطأ: اشتهر العمانيون قديمًا بالملاحة البحرية.\nالإجابة: صواب\nس3 (مستوى الاستدلال): ما الذي يحتاجه البحار في رحلة طويلة؟\nالإجابة: الماء العذب والطعام\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا ل يجيات: أعواد المثلجات.\n\n18. العنوان البديل: اقتراح عناوين بديلة والتصويت عليها، ويقوم التلميذ بالاقتراح والتعليل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n19. سؤال المستوى الرابع: طرح سؤال المستوى الرابع: لو كنت أحد البحارة فكيف تتصرف حين نقص الطعام؟ ويقوم التلميذ بالتخيل والإجابة بجمل معللة (13 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n20. اجتماع البحارة: تمثيل «اجتماع البحارة» لاتخاذ قرار في وقت الشدة، والتلميذ: لعب الأدوار واتخاذ القرار بالتشاور (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n21. إبداء الرأي كتابة: إبداء الرأي في تصرف البحارة وكتابة جملتين، ويقوم التلميذ بالكتابة والقراءة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n22. غلق الدرس – سفينة الأسئلة: تسحب كل مجموعة بطاقة سؤال عن النص (حدث، مفردة، شعور)، وكلما أجابت تقدمت سفينتها خطوة على لوحة نحو ميناء صور، ثم تذكر المجموعة الفائزة صفة من صفات البحارة العمانيين تفخر بها (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): عنوان الدرس:\nالإجابة: رحلة السندباد الثامنة\nس2 (مستوى التطبيق): الماء العذب هو الماء:\nالإجابة: الصالح للشرب\nس3 (مستوى الاستدلال): أي رأي معلل؟\nالإجابة: أحسن البحارة لأنهم صبروا وتعاونوا.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا للبحر (صياد، سفينة تجارية، قارب نقل) ويسمّي مع التلميذ فائدة كل صورة، ثم يربطها برحلات السندباد البحري؛ وللتحقق يسأله: اذكر فائدة واحدة للبحر.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة بما يحتاجه السندباد في رحلة طويلة مرتبة حسب الأهمية مع التعليل، ثم يتخيلون رحلة تاسعة للسندباد ويكتبون بدايتها في جملتين.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): كانت السفينة في البداية:\nالإجابة: ساكنة لا تتحرك\nس2 (مستوى التطبيق): صواب أم خطأ: الصبر يساعد على تجاوز الشدائد.\nالإجابة: صواب\nس3 (مستوى الاستدلال): المحور الذي ينتمي إليه الدرس:\nالإجابة: علوم واكتشافات", "إرشاد للطالب: اكتب توقعاتك عن الرحلة الثامنة؛ اقرأ النص ص 23–26 قراءة جهرية؛ رتب أحداث النص لأسرتك؛ اكتب خمس كلمات بحرية ومعانيها؛ تحدث مع أسرتك عن موقف صبرت فيه؛ احكِ الأحداث الكبرى الثلاثة لأسرتك؛ احكِ لأسرتك كيف كنت ستتصرف لو كنت بحارًا.\nإرشاد لولي الأمر: ناقش ابنك في توقعاته؛ استمع لقراءة ابنك وشجعه؛ ناقش ابنك في أحداث الرحلة؛ حدّث ابنك عن أدوات السفن قديمًا؛ حدّث ابنك عن قيمة الصبر؛ ناقش ابنك في العنوان الذي اقترحه؛ حاور ابنك في الشجاعة والتعاون.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=13"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: الجملة الفعلية (اكتشاف)", "الجملة الفعلية: تطبيقات تحديد الفعل والفاعل", "توظيف الجملة الفعلية وتحويل الجملة الاسمية إلى فعلية", "مراجعة درس السندباد ومسابقة المجموعات"], "w": "الأسبوع العاشر – الأسبوع الحادي عشر", "f": ["1. يتعرف الجملة الفعلية وركنيها (الفعل والفاعل) (15 دقيقة)\n2. يميز الجملة الفعلية من الجملة الاسمية (20 دقيقة)\n3. يحدد الفعل والفاعل في جمل فعلية (25 دقيقة)\n4. يكمل الجملة الفعلية بفعل أو فاعل مناسب (5 دقائق)\n5. يحول الجملة الاسمية إلى جملة فعلية (15 دقيقة)\n6. يكتب جملًا فعلية يصف بها صورة (15 دقيقة)\n7. يسترجع أحداث النص ومفرداته (10 دقائق)\n8. يطبق الجملة الفعلية والحروف الداخلة على (ال) (15 دقيقة)\nمخرج تعليمي آخر:\n- يستمتع بالاكتشاف الجماعي (5 دقائق)\n- يتحرى الدقة في الإجابة (10 دقائق)\n- يحرص على سلامة الجملة (10 دقائق)\n- يتنافس بروح رياضية (15 دقيقة)", "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج 7: تذكر\nالمخرج 8: تطبيق\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تطبيق", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. الرؤوس المرقمة\n6. التعلم بالنمذجة\n7. المسابقات التنافسية", "1. الكتاب\n2. السبورة الذكية\n3. أخرى: جدول ملون\n4. الأقلام\n5. صورة توضيحية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot", "1. الجملة الفعلية\n2. الفعل\n3. الفاعل\n4. الإكمال\n5. التحويل\n6. الجملة الاسمية\n7. الحروف الداخلة على ال\n8. بنية النص", "عرض جملتين: «البحارة صبروا» و«صبر البحارة» وسؤال: بماذا بدأت كل جملة؟ (5 دقائق)", "1. جدول الفعل والفاعل: رسم جدول (فعل، فاعل) واستخراج جمل فعلية من النص، ويقوم التلميذ بالاستخراج والتصنيف (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة «من فعل؟»: ذكر فعل ليذكر الطلبة فاعلًا مناسبًا، وتكوين جمل فعلية شفهيًا (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التمييز بين الجملتين الاسمية والفعلية: التمييز بين الجملة الاسمية والفعلية في جمل الكتاب، والتلميذ: التصنيف (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تدريبات الكتاب: توجيه الطلبة لتدريبات الكتاب ص 35 في تحديد الفعل والفاعل، ويقوم التلميذ بالحل الفردي (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تطبيق شفهي وكتابي: إكمال جمل فعلية بالرؤوس المرقمة، ويقوم التلميذ بالإكمال والقراءة (15 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n6. المعالجة الجماعية للأخطاء: التصحيح الجماعي، والتلميذ: التصويب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نمذجة التحويل: «البحارة صبروا» ← «صبر البحارة»، والتلميذ: ملاحظة التغيير (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. تحويل الجمل ووصف الصور: تكليف المجموعات بتحويل جمل ووصف صور الكتاب بجمل فعلية، ويقوم التلميذ بالتحويل والكتابة (17 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n9. المشاركة والتغذية الراجعة: عرض الأعمال وتصويبها، ويقوم التلميذ بالقراءة والتحسين (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n10. مراجعة أقسام الدرس: مراجعة سريعة لأقسام الدرس، والتلميذ: الإجابة (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول الدرس، ويبدأ المعلم بسؤال «الفاعل في: صبر البحارة» (14 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n12. غلق الدرس – أفعال البحارة: يؤدي تلميذ من كل مجموعة حركة صامتة (يجدف، يرفع الشراع، يصطاد) فتقول مجموعته جملة فعلية تصفها وتحدد فعلها وفاعلها، ثم تختم كل مجموعة بجملة فعلية عن البحارة العمانيين أو أحمد بن ماجد (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الجملة الفعلية تبدأ بـ:\nالإجابة: فعل\nس2 (مستوى التطبيق): الفاعل في «صبر البحارة»:\nالإجابة: البحارة\nس3 (مستوى الاستدلال): أي جملة فعلية تصف صورة سفينة؟\nالإجابة: تشق السفينة الأمواج.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا للبحر (صياد، سفينة تجارية، قارب نقل) ويسمّي مع التلميذ فائدة كل صورة، ثم يربطها برحلات السندباد البحري؛ وللتحقق يسأله: اذكر فائدة واحدة للبحر.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد قائمة بما يحتاجه السندباد في رحلة طويلة مرتبة حسب الأهمية مع التعليل، ثم يتخيلون رحلة تاسعة للسندباد ويكتبون بدايتها في جملتين.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل بفعل: ...... الموج.\nالإجابة: ارتفع\nس2 (مستوى التطبيق): صواب أم خطأ: عند التحويل نبدأ بالفعل.\nالإجابة: صواب\nس3 (مستوى الاستدلال): صواب أم خطأ: الفاعل هو من قام بالفعل.\nالإجابة: صواب", "إرشاد للطالب: اكتب ثلاث جمل فعلية عن يومك؛ استخرج من النص ثلاث جمل فعلية وحدد الفعل والفاعل؛ صف صورة بحرية بثلاث جمل فعلية؛ راجع درس السندباد.\nإرشاد لولي الأمر: راجع مع ابنك الفعل والفاعل؛ راجع مع ابنك إجاباته؛ شجع ابنك على وصف الصور بجمل فعلية؛ تابع مراجعة ابنك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=13"]}, {"k": "الإملاء", "p": ["النمط الإملائي: الحروف التي تدخل على (ال) — اكتشاف", "دخول اللام على (ال): تدريبات", "الإملاء: الفقرة الإملائية"], "w": "الأسبوع الحادي عشر", "f": ["1. يتعرف الحروف التي تدخل على (ال) (ب، ك، ف، و، ل) (15 دقيقة)\n2. يكتب الكلمة المبدوءة بـ(ال) بعد دخول الحرف عليها (15 دقيقة)\n3. يكتب الكلمة بعد دخول اللام على (ال) كتابة صحيحة (للبحر) (15 دقيقة)\n4. يكمل الجمل بكلمات دخلت عليها الحروف (15 دقيقة)\n5. يكتب ما يملى عليه كتابة صحيحة (15 دقيقة)\n6. يوظف قاعدة الحروف الداخلة على (ال) في كتابته (15 دقيقة)\nمخرج تعليمي آخر:\n- يلاحظ الظواهر الإملائية في قراءاته (10 دقائق)\n- يدقق في كتابة الكلمات (10 دقائق)\n- يصحح أخطاءه ذاتيًا (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تحليل\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة", "1. الكتاب\n2. السبورة الذكية\n3. نماذج مجسمة\n4. أخرى: مجسمات الحروف\n5. الأقلام\n6. السبورة التقليدية", "1. (ال)\n2. حروف الجر\ شيد\n2. القلم\n3. العلم\n4. المدرسة\n5. القيم\n6. القراءة المعبرة\n7. الحفظ\n8. الإلقاء\n9. المعايير", "عرض قلم جميل وسؤال: ماذا يصنع القلم في حياتنا؟ (5 دقائق)", "1. الإلقاء النموذجي للنشيد: إلقاء النشيد بصوت معبر أو تشغيل التسجيل مرتين، ويقوم التلميذ بالإنصات والمتابعة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n2. الإنشاد الزمري والجماعي: ترديد النشيد زمريًا ثم جماعيًا، ويقوم التلميذ بالترديد بالإيقاع (16 دقيقة)\nالاستراتيجيات: التعلم بالإنشاد.\n\n3. التعريف بالشاعر: تعريف بالشاعر أحمد بن هلال العبري، وتدوين اسم الشاعر (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. معاني الأبيات: مناقشة معاني الأبيات وما يتذكره الشاعر عن قلمه الأول، ويقوم التلميذ بالشرح بأسلوبهم (13 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n5. القلم أساس الأمم: فكر-زاوج-شارك: لماذا كان القلم أساس الأمم؟ ويقوم التلميذ بالتفكير والمشاركة (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. جملة شكر للقلم: كتابة جملة شكر للقلم، ويقوم التلميذ بالكتابة والقراءة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. القراءة المعبرة للأبيات: قراءة الأبيات قراءة معبرة وتصويب النطق، ويقوم التلميذ بالقراءة الفردية (13 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. الحفظ في المجموعات: التدرب على الحفظ في مجموعات لا تتجاوز خمسة، ويقوم التلميذ بالتسميع الداخلي (15 دقيقة)\nالاستراتيجيات: التعلم بالإنشاد.\n\n9. الإنشاد من الذاكرة: تسميع المجموعات، ويقوم التلميذ بالإنشاد من الذاكرة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. مسابقة الإلقاء: تنظيم مسابقة الإلقاء وفق المعايير، ويقوم التلميذ بالإلقاء والتحكيم (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. تحدي الفريقين: يقسم المعلم الصف إلى فريقين ويطرح أسئلة شفهية من الدرس، منها: «من معايير الإلقاء:»، ويجيب الفريق صاحب الدور ويسجّل المعلم نقاطه على السبورة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n12. الاحتفاء بالمتميزين: إعلان الفائزين وتكريمهم، والتلميذ: التهنئة (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. غلق الدرس – قلمي يكتب لعمان: يكتب كل زوج جملة قصيرة عن عمان بأجمل خط، ثم ينشدان بيتًا من نشيد الشاعر أحمد بن هلال العبري، ويتحد حادثة ومناقشة أسئلة «أشاهد وأتحدث»: الطريقة المعتادة للتخلص من القمامة، ويقوم التلميذ بالوصف والإجابة (7 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n2. أفكار للاستفادة من القمامة: العصف الذهني: ماذا تقترح كي يستفاد من هذه القمامة؟ والتلميذ: اقتراح الأفكار وتصنيفها (8 دقائق)\nالاستراتيجيات: العصف الذهني.\n\n3. نشاط عملي: فرز المواد في الكيس إلى (ورق، بلاستيك، معدن، زجاج)، ويقوم التلميذ بالفرز العملي (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n4. غلق الدرس – حاويات الحي: تتسابق المجموعات في فرز صور مواد (ورق، بلاستيك، معدن، زجاج) إلى حاوياتها، ثم تتحدث كل مجموعة بجملتين عن فكرة تحافظ بها على نظافة حيها في عمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): إعادة التدوير تعني:\nالإجابة: تحويل المواد المستعملة إلى منتجات جديدة\nس2 (مستوى التطبيق): صواب أم خطأ: نفرز القمامة قبل تدويرها.\nالإجابة: صواب\nس3 (مستوى الاستدلال): أي فكرة تفيد البيئة؟\nالإجابة: صنع حامل أقلام من علبة قديمة\n\n• نشاط علاجي (لمن لم يتقن): يحضر المعلم علبة قديمة وورقًا مستعملًا، ويصنع مع التلميذ حامل أقلام بعد فرز القمامة إلى ورق وبلاستيك، مبينًا معنى إعادة التدوير؛ وللتحقق يسأله: ماذا تعني إعادة التدوير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رحلة ورقة جديدة على لسانها من الشجرة إلى إعادة التدوير في ثلاث جمل كما في «قصة ورقة»، ثم يقترحون مشروعًا صفيًا لإعادة استخدام القمامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): من المواد القابلة للتدوير:\nالإجابة: الورق والعلب المعدنية\nس2 (مستوى التطبيق): صواب أم خطأ: رمي القمامة في الطرقات يضر البيئة.\nالإجابة: صواب\nس3 (مستوى الاستدلال): نضع الورق المستعمل في:\nالإجابة: حاوية الورق", "إرشاد للطالب: افرز مع أسرتك قمامة يوم واحد.\nإرشاد لولي الأمر: شارك ابنك فرز المواد القابلة للتدوير.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=15"]}, {"k": "القراءة", "p": ["أتصفح: ملامح الورقة والتوقع", "القراءة الجهرية الأولى لنص «قصة ورقة»", "القراءة الجهرية الثانية وأسئلة المستوى الأول", "المفردات والمستوى الثاني: مشاعر ورقة و
