n\n3. لوحة التوقعات: كتابة التوقعات على لوحة، والتلميذ: المشاركة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. القراءة النموذجية: قراءة نموذجية معبرة مع تغيير نبرة الشخصيات، والتلميذ: المتابعة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. قراءة الطلبة: القراءة الفردية بالتناوب، ويقوم التلميذ بالقراءة الجهرية المعبرة (17 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n6. الفكرة العامة: استخلاص الفكرة العامة، والتلميذ: الصياغة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. قراءة الأزواج وتقييمها: القراءة الثنائية بالمعايير، ويقوم التلميذ بالقراءة والتقييم (14 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n8. الفهم الصريح: أسئلة المستوى الأول ص 50 في أثناء القراءة، ويقوم التلميذ بالإجابة من النص (13 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n9. محطات رحلة الورقة: تكليف المجموعات بتحديد محطات رحلة الورقة على الخط، ويقوم التلميذ بالتحديد والرسم (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. معاني المفردات: مناقشة معاني كلمات (دهشة، كومة، الصفيح، مندهشة)، ويقوم التلميذ بالاستنتاج من السياق (13 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n11. تغير مشاعر ورقة: فكر-زاوج-شارك: كيف تغيرت مشاعر ورقة من البداية إلى النهاية؟ والتلميذ: ربط المشاعر بالأحداث (14 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n12. مقياس المشاعر: رسم «مقياس المشاعر» لورقة، ويقوم التلميذ بالرسم والكتابة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. العبرة من القصة: مناقشة العبرة: لا شيء بلا فائدة، والتدوير يحفظ البيئة، والتلميذ: الاستخلاص (13 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n14. حل مشكلة الأوراق في الصف: حل مشكلة: صفنا تتراكم فيه الأوراق، ما الحل؟ والتلميذ: اقتراح حلول وتعليلها (14 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n15. العنوان البديل: اقتراح عناوين بديلة والتصويت، والتلميذ: الاقتراح (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n16. غلق الدرس – رحلة ورقة الحية: تمثل كل مجموعة محطة من محطات رحلة ورقة (الكراسة، القمامة، المصنع، الورقة الجديدة) بحركة وجملة من النص، ويخمن الزملاء المحطة، ثم تقترح المجموعة شعارًا قصيرًا لحملة «عمان نظيفة» (5 دقائق)\nالاستراتيجيات: لعب الأدوار.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: في القصة تتكلم «ورقة» كأنها إنسان.\nالإجابة: صواب\nس2 (مستوى التطبيق): صواب أم خطأ: كانت ورقة بيضاء في كراسة صاحبها.\nالإجابة: صواب\nس3 (مستوى الاستدلال): عنوان آخر مناسب:\nالإجابة: ورقة تعود من جديد\n\n• نشاط علاجي (لمن لم يتقن): يحضر المعلم علبة قديمة وورقًا مستعملًا، ويصنع مع التلميذ حامل أقلام بعد فرز القمامة إلى ورق وبلاستيك، مبينًا معنى إعادة التدوير؛ وللتحقق يسأله: ماذا تعني إعادة التدوير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رحلة ورقة جديدة على لسانها من الشجرة إلى إعادة التدوير في ثلاث جمل كما في «قصة ورقة»، ثم يقترحون مشروعًا صفيًا لإعادة استخدام القمامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: وجدت ورقة نفسها وسط علب وأكواب وزجاجات.\nالإجابة: صواب\nس2 (مستوى التطبيق): صواب أم خطأ: مشاعر ورقة لم تتغير أبدًا.\nالإجابة: خطأ\nس3 (مستوى الاستدلال): شعور الورقة كما يبدو في الصورة:\nالإجابة: الحزن", "إرشاد للطالب: اكتب توقعك لما سيحدث للورقة؛ اقرأ القصة بصوت معبر لأسرتك؛ ارسم محطات رحلة الورقة؛ احكِ لأسرتك كيف تغيرت مشاعر ورقة؛ اصنع مع أسرتك شيئًا مفيدًا من مواد مستعملة.\nإرشاد لولي الأمر: ناقش ابنك في توقعه؛ استمع لقراءة ابنك؛ ناقش مع ابنك الرحلة؛ ناقش ابنك في مشاعر الشخصيات؛ شارك ابنك مشروع تدوير صغيرًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=15"]}, {"k": "الأنماط اللغوية", "p": ["النمط اللغوي: الأعداد المركبة (اكتشاف)", "الأعداد المركبة: تطبيقات الكتابة والتوظيف"], "w": "الأسبوع الثالث عشر", "f": ["1. يتعرف الأعداد المركبة من أحد عشر إلى تسعة عشر (15 دقيقة)\n2. يقرأ الأعداد المركبة قراءة صحيحة مع المعدود (15 دقيقة)\n3. يكتب العدد المركب بالحروف كتابة صحيحة (5 دقائق)\n4. يوظف العدد المركب في جمل مع المعدود المذكر والمؤنث (25 دقيقة)\nمخرج تعليمي آخر:\n- يربط الأعداد بمواقف حياتية (10 دقائق)\n- يدقق في مطابقة العدد والمعدود (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي", "1. الكتاب\n2. السبورة الذكية\n3. نماذج مجسمة\n4. أخرى: بطاقات أعداد\n5. الأقلام", "1. العدد المركب\n2. المعدود\n3. المذكر\n4. المؤنث\n5. التذكير والتأنيث", "عد أوراق في كومة على المكتب جماعيًا حتى خمسة عشر. (5 دقائق)", "1. اكتشاف العدد المركب: عرض جمل من النص وأمثلة (أحد عشر كتابًا، إحدى عشرة ورقة) واكتشاف أن العدد المركب من جزأين، ويقوم التلميذ بالقراءة والملاحظة (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة «اسحب وعد»: سحب بطاقة عدد وبطاقة صورة وقراءة العدد مع المعدود، ويقوم التلميذ بالقراءة الصحيحة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التطبيق الفردي: تدريب الكتاب ص 54، ويقوم التلميذ بالحل الفردي (7 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. النمذجة: نمذجة كتابة الأعداد (13، 14، 18) مع معدود مذكر ومؤنث، ويقوم التلميذ بالمتابعة والترديد (11 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. إكمال جمل الكتاب: تكليف المجموعات بإكمال جمل الكتاب بالعدد المناسب، ويقوم التلميذ بالإكمال والقراءة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. التصحيح الثنائي: تصحيح ثنائي، والتلميذ: التصويب (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. غلق الدرس – عدّاد الوطن: يرفع المعلم بطاقة عدد (11–19) وصورة (نخلة، قلعة، سفينة)، فتتسابق المجموعات في قراءة العدد مع المعدود صحيحًا مثل «ثلاث عشرة نخلة»، ثم تكوّن الفائزة جملة بعدد مركب عن جمال عمان (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): العدد المركب يتكون من:\nالإجابة: جزأين\nس2 (مستوى التطبيق): نقرأ العدد 12 مع كلمة (كتاب):\nالإجابة: اثنا عشر كتابًا\nس3 (مستوى الاستدلال): صواب أم خطأ: «ثماني عشرة طالبة» صحيحة.\nالإجابة: صواب\n\n• نشاط علاجي (لمن لم يتقن): يحضر المعلم علبة قديمة وورقًا مستعملًا، ويصنع مع التلميذ حامل أقلام بعد فرز القمامة إلى ورق وبلاستيك، مبينًا معنى إعادة التدوير؛ وللتحقق يسأله: ماذا تعني إعادة التدوير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رحلة ورقة جديدة على لسانها من الشجرة إلى إعادة التدوير في ثلاث جمل كما في «قصة ورقة»، ثم يقترحون مشروعًا صفيًا لإعادة استخدام القمامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: في صفنا ...... طالبًا (19).\nالإجابة: تسعة عشر\nس2 (مستوى التطبيق): صواب أم خطأ: «خمسة عشر ورقة» صحيحة.\nالإجابة: خطأ\nس3 (مستوى الاستدلال): أي عدد مركب؟\nالإجابة: ثلاثة عشر", "إرشاد للطالب: اعدد أشياء في بيتك بين 11 و19 واكتبها بالكلمات؛ اكتب ثلاث جمل بأعداد مركبة عن أشياء في صفك.\nإرشاد لولي الأمر: ساعد ابنك على قراءة الأعداد المركبة؛ راجع مع ابنك كتابة الأعداد المركبة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=15"]}, {"k": "الإملاء", "p": ["النمط الإملائي: الألف المقصورة والياء (اكتشاف)", "الألف المقصورة والياء: تدريبات", "الإملاء: الفقرة الإملائية"], "w": "الأسبوع الثالث عشر", "f": ["1. يميز بين الألف المقصورة والياء في آخر الكلمة (5 دقائق)\n2. يصنف كلمات من النص وفق الحرف الأخير (25 دقيقة)\n3. يكمل الكلمات بالألف المقصورة أو الياء (15 دقيقة)\n4. يكتب جملًا تتضمن كلمات بالحرفين (15 دقيقة)\n5. يكتب ما يملى عليه كتابة صحيحة (15 دقيقة)\n6. يوظف الألف المقصورة والياء في كتابته (15 دقيقة)\nمخرج تعليمي آخر:\n- ينطق الكلمات نطقًا صحيحًا (10 دقائق)\n- يدقق في وضع النقاط (10 دقائق)\n- يصحح أخطاءه ذاتيًا (10 دقائق)", "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم\nالمخرج الآخر 3: تقييم", "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التعاوني\n4. التعلم الذاتي\n5. التعلم بالنمذجة", "1. الكتاب\n2. السبورة الذكية\n3. نماذج مجسمة\n4. أخرى: مجسمات (ى، ي)\n5. الأقلام\n6. السبورة التقليدية", "1. الألف المقصورة\n2. الياء\n3. النقاط\n4. الإملاء المنظور", "كتابة (على، في) وسؤال: ما الفرق بين الحرفين الأخيرين نطقًا وشكلًا؟ (5 دقائق)", "1. اكتشاف الفرق بين (ى) و(ي): عرض كلمات من النص (على، إلى، مستشفى، في، الذي) لاكتشاف الفرق، ويقوم التلميذ بالنطق والملاحظة (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة «نقطتان أم لا؟»: نطق كلمة ورفع مجسم (ى) أو (ي)، ويقوم التلميذ بالاستماع والاستجابة (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التطبيق في جدول: تصنيف الكلمات في جدول ص 57، والتلميذ: التصنيف (8 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. تدريبات الكتاب: توجيه الطلبة لتدريبات الكتاب ص 58، ويقوم التلميذ بالإكمال الفردي (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. جمل عن التدوير: تكليف الثنائيات بكتابة جمل عن التدوير بكلمات بالحرفين، والتلميذ: الكتابة (13 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. المعالجة الجماعية للأخطاء: التصحيح الجماعي، والتلميذ: التصويب (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n7. عرض الفقرة ومناقشتها: عرض الفقرة وقراءتها ومناقشة كلماتها ثم حجبها، ويقوم التلميذ بالتهجي الشفهي (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n8. الكتابة الإملائية: إملاء الفقرة بتأنٍّ، ويقوم التلميذ بالكتابة في الكتاب ص 60 (15 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n9. مراجعة الكتابة وتصويبها: التصحيح الذاتي، والتلميذ: التصحيح (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – نقطتان من عمان: ينطق المعلم كلمات من بيئة عمان (الحلوى، الوادي، المرسى، عماني، المستشفى) فترفع كل مجموعة مجسم (ى) أو (ي) بسرعة، ثم تكتب كلمة منها في جملة تعتز فيها بوطنها (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): الألف المقصورة تكتب:\nالإجابة: بلا نقاط\nس2 (مستوى التطبيق): أكمل: جلست فـ...... الصف.\nالإجابة: ـي\nس3 (مستوى الاستدلال): الكلمة الصحيحة:\nالإجابة: ألقى\n\n• نشاط علاجي (لمن لم يتقن): يحضر المعلم علبة قديمة وورقًا مستعملًا، ويصنع مع التلميذ حامل أقلام بعد فرز القمامة إلى ورق وبلاستيك، مبينًا معنى إعادة التدوير؛ وللتحقق يسأله: ماذا تعني إعادة التدوير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رحلة ورقة جديدة على لسانها من الشجرة إلى إعادة التدوير في ثلاث جمل كما في «قصة ورقة»، ثم يقترحون مشروعًا صفيًا لإعادة استخدام القمامة.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): الكلمة الصحيحة:\nالإجابة: هدى\nس2 (مستوى التطبيق): صواب أم خطأ: «إلى» تكتب بألف مقصورة.\nالإجابة: صواب\nس3 (مستوى الاستدلال): أي كلمة تنتهي بألف مقصورة؟\nالإجابة: مستشفى", "إرشاد للطالب: استخرج من النص كلمات تنتهي بألف مقصورة؛ اكتب خمس كلمات بألف مقصورة  https://afuq-edu.github.io/afuq/q/3/arabic/?l=15"]}]}, {"t": "بين رفوف مكتبتي (المحور الثاني)", "u": "المحور الثاني: علوم واكتشافات", "s": [{"k": "التحدث", "p": ["بين رفوف مكتبتي: مقابلة مع شخصية قصصية", "بين رفوف مكتبتي: معرض «كتابي المفضل»"], "w": "الأسبوع السادس عشر – الأسبوع السابع عشر", "f": ["1. يعد أسئلة لمقابلة شخصية من قصة قرأها (15 دقيقة)\n2. يجيب على لسان الشخصية إجابات منسجمة مع القصة (15 دقيقة)\n3. يعرض كتابه المفضل للفصل الدراسي مع أسباب تفضيله (15 دقيقة)\n4. يصمم غلافًا جديدًا لكتابه المفضل (15 دقيقة)\nمخرج تعليمي آخر:\n- يتحدث بثقة ويحترم المحاور (10 دقائق)\n- يحتفي بالقراءة ويشجع زملاءه عليها (10 دقائق)", "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تقييم", "1. التعلم التشاركي\n2. التعلم التعاوني\n3. لعب الأدوار\n4. التعلم المبني على المشاريع\n5. الحوار والمناقشة", "1. الكتاب\n2. أخرى: ميكروفون لعبة\n3. أخرى: أوراق وألوان وقصص الطلبة", "1. المقابلة\n2. الأسئلة\n3. الشخصية\n4. الكتاب المفضل\n5. الغلاف\n6. العرض", "تمثيل المعلم مقابلة قصيرة مع «ورقة» من قصة سابقة. (5 دقائق)", "1. إعداد أسئلة المقابلة: توجيه الثنائيات لإعداد ثلاثة أسئلة لمقابلة شخصية من قصصهم، والتلميذ: إعداد الأسئلة (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. لعب الأدوار: تنفيذ المقابلات أمام الصف، والتلميذ: لعب دور المحاور والشخصية (13 دقيقة)\nالاستراتيجيات: لعب الأدوار.\n\n3. تقييم الأسئلة: مناقشة أجمل الأسئلة وأذكاها، والتلميذ: التصويت (7 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. تصميم غلاف جديد: تكليف الطلبة بتصميم غلاف جديد لكتابهم المفضل، والتلميذ: التصميم (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n5. معرض «كتابي المفضل»: تنظيم معرض «كتابي المفضل» في الصف، ويقوم التلميذ بالعرض والشرح (10 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. التصويت على أجمل غلاف: تصويت على أجمل غلاف، والتلميذ: التصويت (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – مذيع المكتبة: يمسك كل تلميذ في مجموعته الميكروفون اللعبة ويقدم كتابه المفضل في نصف دقيقة بأسلوب مذيع، ثم تختار المجموعة شخصية عمانية مشهورة ميذ: الإعداد (17 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n8. التعبير عن الاستفادة رسمًا: التعبير عما استفادوه رسمًا في ورقة خارجية، ويقوم التلميذ بالرسم والكتابة (17 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n9. عرض الأعمال: عرض بعض الأعمال، والتلميذ: المشاركة (8 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n10. خريطة القصة: تعبئة خريطة القصة، والتلميذ: التعبئة (13 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n11. التلخيص: تلخيص القصة في ثلاث جمل، والتلميذ: التلخيص (10 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n12. عناصر خطة القراءة: توضيح عناصر الخطة (عنوان الكتاب، عدد الصفحات يوميًا، التاريخ)، وتعبئة الخطة (13 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n13. اقتراح الكتب: اقتراح كتب مناسبة من المكتبة الإلكترونية والورقية، والتلميذ: اختيار الكتب (12 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n14. عرض الخطط: مشاركة الخطط، والتلميذ: المشاركة (8 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n15. غلق الدرس – اكتشاف من أرض عمان: يعرّف كل طالب زملاءه بقصته العلمية، ثم تقترح المجموعة موضوعًا علميًا من بيئة عمان تحب القراءة عنه كالسلاحف البحرية أو الأفلاج أو أشجار اللبان، وتذكر سبب اختياره (5 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: القصة العلمية تنقل معلومات بأسلوب مشوق.\nالإجابة: صواب\nس2 (مستوى التطبيق): نعرف معنى الكلمة من:\nالإجابة: السياق أو المعجم\nس3 (مستوى الاستدلال): نختار كتب الإجازة:\nالإجابة: المناسبة لمستواي واهتمامي\n\n• نشاط علاجي (لمن لم يتقن): يختار المعلم مع التلميذ كتابًا علميًا مصورًا قصيرًا، ويقرأ معه صفحة واحدة ويستخرجان معلومة جديدة يكتبانها على بطاقة؛ وللتحقق يسأله: ما الذي يميز القصة العلمية؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «هل تعلم؟» تضم ثلاث معلومات جديدة من قصتهم العلمية مع عنوانها ومؤلفها، ثم يعرضونها ويقترحون سؤالًا علميًا يريدون البحث عن جوابه.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: القراءة العلمية تنمي حب الاكتشاف.\nالإجابة: صواب\nس2 (مستوى التطبيق): «في مختبر المدرسة» تدل على:\nالإجابة: المكان\nس3 (مستوى الاستدلال): من فوائد القراءة العلمية:\nالإجابة: زيادة المعرفة بالعالم", "إرشاد للطالب: اقرأ قصتك العلمية وأخبر أسرتك بمعلومة جديدة؛ أخبر أسرتك بمعلومة مدهشة قرأتها؛ راجع قائمة كلماتك الجديدة؛ لخص قصتك في ثلاث جمل لأسرتك؛ نفذ خطة القراءة في الإجازة.\nإرشاد لولي الأمر: شارك ابنك قراءة قصة علمية؛ شارك ابنك البحث عن معلومة علمية؛ اختبر ابنك في معاني كلماته الجديدة؛ ناقش ابنك في تلخيصه؛ تابع خطة القراءة مع ابنك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=16"]}]}, {"t": "الدرس القرائي الثالث: حاسوب", "u": "المحور الثاني: علوم واكتشافات", "s": [{"k": "التحدث", "p": ["أشاهد وأتحدث: الحاسوب والأجهزة الذكية", "الاستخدام الآمن للحاسوب: حوار وملصق"], "w": "الأسبوع الرابع عشر – الأسبوع الخامس عشر", "f": ["1. يتحدث بطلاقة عن لوحة المحادثة (15 دقيقة)\n2. يقارن بين جهازين من حيث الخدمات التي يقدمانها (15 دقيقة)\n3. يحاور زملاءه في قواعد الاستخدام الآمن للحاسوب (5 دقائق)\n4. يصمم ملصقًا إرشاديًا عن الاستخدام الآمن (15 دقيقة)\nمخرج تعليمي آخر:\n- يستخدم الأجهزة الإلكترونية باعتدال (10 دقائق)\n- يلتزم قواعد السلامة الرقمية (20 دقيقة)", "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: إبداع\nالمخرج الآخر 1: تطبيق\nالمخرج الآخر 2: تطبيق", "1. التعلم التعاوني\n2. الحوار والمناقشة\n3. العصف الذهني\n4. التعلم المبني على المشاريع", "1. الكتاب\n2. صورة توضيحية\n3. جهاز الحاسب\n4. السبورة الذكية\n5. أخرى: أوراق وألوان", "1. الحاسوب\n2. الجهاز اللوحي\n3. الاستخدام الآمن\n4. السلامة الرقمية\n5. الملصق\n6. الإعلان الإرشادي", "سؤال: كم تمضي من الوقت أمام جهاز الحاسوب في اليوم؟ (5 دقائق)", "1. وصف لوحة المحادثة: عرض لوحة المحادثة ومناقشة الموقف الوارد فيها، ويقوم التلميذ بالوصف والإجابة (11 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. المقارنة بين جهازين: تكليف المجموعات بمقارنة الحاسوب بجهاز آخر من حيث الخدمات، ويقوم التلميذ بالمقارنة والعرض (12 دقيقة)\nالاستراتيجيات: العصف الذهني.\n\n3. الاستخدام المفيد والضار: العصف الذهني: متى يكون استخدام الحاسوب مفيدًا؟ ومتى يضر؟ وتصنيف الأفكار (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. حوار السلامة الرقمية: حوار موجه حول قواعد السلامة الرقمية، ويقوم التلميذ بالحوار وتدوين القواعد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تصميم ملصق إرشادي: تكليف المجموعات بتصميم ملصق إرشادي (عنوان، صورة، نصيحة)، والتلميذ: التصميم (13 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n6. معرض الملصقات: عرض الملصقات وتعليقها، والتلميذ: العرض (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n7. غلق الدرس – الحاسوب دليلي إلى عمان: يقارن كل زوج بين الحاسوب وجهاز آخر في الخدمات، ثم يقترحان طريقة للاستفادة من الحاسوب في التعرف على معالم عمان وتاريخها، مع وضع قاعدة للاستخدام المعتدل (5 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من فوائد الحاسوب:\nالإجابة: البحث عن المعلومات والتعلم\nس2 (مستوى التطبيق): صواب أم خطأ: الجلوس الطويل أمام الحاسوب يضر العينين.\nالإجابة: صواب\nس3 (مستوى الاستدلال): مكونات الملصق الإرشادي:\nالإجابة: عنوان وصورة ونصيحة\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لاستخدامات الحاسوب (البحث، التعلم، الرسم) وصورة طفل يجلس أمامه طويلًا، ويفرز التلميذ الاستخدام المفيد من الضار؛ وللتحقق يسأله: اذكر فائدة واحدة للحاسوب.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يومي يحدد وقتًا معتدلًا لاستخدام الحاسوب، ثم يقارنون بين الحاسوب وجهاز آخر كالتلفاز من حيث الخدمات التي يقدمها كل منهما.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): عبارة مناسبة للملصق:\nالإجابة: استخدم الحاسوب بأمان واعتدال\nس2 (مستوى التطبيق): صواب أم خطأ: نتواصل مع الغرباء عبر الإنترنت دون علم الوالدين.\nالإجابة: خطأ\nس3 (مستوى الاستدلال): نحمي أعيننا عند استخدام الحاسوب بـ:\nالإجابة: أخذ استراحة والجلوس على بعد مناسب", "إرشاد للطالب: حدد مع أسرتك وقتًا يوميًا مناسبًا لاستخدام الأجهزة؛ علّق ملصقًا إرشاديًا قرب جهاز البيت.\nإرشاد لولي الأمر: اتفق مع ابنك على وقت محدد للأجهزة؛ راجع مع ابنك قواعد السلامة الرقمية.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=17"]}, {"k": "القراءة", "p": ["أتصفح: بطاقة النص وشكله", "القراءة الجهرية الأولى للأبيات", "القراءة الجهرية الثانية وأسئلة المستوى الأول", "المفردات والمعاني في نص «حاسوب»", "المستوى الثاني: الاستنتاج والمقارنة بين الاستخدام المفيد والضار", "المستويان الثالث والرابع: فوائد أخرى للحاسوب ورأيي"], "w": "الأسبوع الرابع عشر", "f": ["1. يملأ بطاقة النص (العنوان، الكاتب، النوع، الشكل) (25 دقيقة)\n2. يميز النص الشعري من شكله ويقارنه بنص سابق في المحور (10 دقائق)\n3. يقرأ الأبيات قراءة جهرية صحيحة مراعيًا الإيقاع (40 دقيقة)\n4. يستخلص الفكرة العامة للنص (10 دقائق)\n5. يسترجع ما يستخدم فيه الابن الحاسوب (5 دقائق)\n6. يوضح كيف ينفذ الحاسوب الأوامر (15 دقيقة)\n7. يحدد معاني المفردات التقنية والجديدة في النص (15 دقيقة)\n8. يوظف مفردات تقنية في جمل (20 دقيقة)\n9. يستنتج مشاعر الابن تجاه الحاسوب (15 دقيقة)\n10. يميز بين الاستخدام المفيد والضار للحاسوب (15 دقيقة)\n11. يذكر استخدامات وفوائد أخرى للحاسوب (10 دقائق)\n12. يبدي رأيه في طلب الابن مع التعليل (15 دقيقة)\n13. يقترح عنوانًا آخر للنص (10 دقائق)\nمخرج تعليمي آخر:\n- يبدي اهتمامًا بقراءة الشعر (5 دقائق)\n- ينصت لقراءة زملائه (5 دقائق)\n- يقيّم قراءة زميله (5 دقائق)\n- يستخدم المصطلحات التقنية العربية (5 دقائق)\n- يلتزم بقواعد الاستخدام الآمن (10 دقائق)\n- يوظف التقنية في التعلم بمسؤولية (5 دقائق)", "المخرج 1: تذكر\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تذكر\nالمخرج 6: فهم\nالمخرج 7: فهم\nالمخرج 8: تطبيق\nالمخرج 9: تحليل\nالمخرج 10: تحليل\nالمخرج 11: فهم\nالمخرج 12: تقييم\nالمخرج 13: إبداع\nالمخرج الآخر 1: تقييم\nالمخرج الآخر 2: تطبيق\nالمخرج الآخر 3: تقييم\nالمخرج الآخر 4: تطبيق\nالمخرج الآخر 5: تطبيق\nالمخرج الآخر 6: تطبيق", "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. القراءة التصفحية\n4. التعلم بالنمذجة\n5. تعدد القراءات\n6. التعلم بالأقران\n7. الرؤوس المرقمة\n8. التعلم المبني على اللعب\n9. التصور البصري\n10. التعلم المبني على حل المشكلات\n11. فكر-زاوج-شارك\n12. التعلم الذاتي\n13. الحوار والمناقشة", "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الوسائل المتعددة (سمعية - بصرية)\n5. جهاز الحاسب\n6. السبورة التقليدية", "1. النص الشعري\n2. الشكل\n3. البطاقة\n4. القراءة الجهرية\n5. الإيقاع\n6. البيت\n7. الأوامر\n8. الاستخدامات\n9. المعنى الصريح\n10. الشاشة\n11. لوحة المفاتيح\n12. الفأرة\n13. التطبيق\n14. الاستنتاج\n15. الاستخدام الآمن\n16. الوقت\n17. الفوائد\n18. الرأي\n19. العنوان البديل", "الاستماع إلى إيقاع الأبيات بالتصفيق دون كلمات. (5 دقائق)", "1. التصفح: القراءة التصفحية للنص، والتلميذ: التصفح (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. بطاقة النص: تكليف الطلبة بملء بطاقة النص ص 66، والتلميذ: التعبئة (16 دقيقة)\nالاستراتيجيات: القراءة التصفحية.\n\n3. المقارنة بقصة ورقة: مقارنة نص «حاسوب» بنص «قصة ورقة» من حيث الشكل والنوع، والتلميذ: المقارنة (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. القراءة النموذجية: قراءة نموذجية معبرة للأبيات، ويقوم التلميذ بالمتابعة والإنصات (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n5. قراءة الطلبة: القراءة الفردية بيتًا بيتًا مع التصويب، ويقوم التلميذ بالقراءة الجهرية (18 دقيقة)\nالاستراتيجيات: تعدد القراءات.\n\n6. الفكرة العامة: استخلاص الفكرة العامة، والتلميذ: الصياغة (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. قراءة الأزواج وتقييمها: القراءة الثنائية بالمعايير، ويقوم التلميذ بالقراءة والتقييم (15 دقيقة)\nالاستراتيجيات: التعلم بالأقران.\n\n8. الفهم الصريح: أسئلة المستوى الأول ص 69: فيم يستخدم الابن الحاسوب؟ كيف يطيع الأوامر؟ ويقوم التلميذ بالإجابة من النص (13 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n9. توثيق الإجابات: تدوين الإجابات ونقلها، والتلميذ: الكتابة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. معاني المفردات: مناقشة معاني المفردات الجديدة في الأبيات، ويقوم التلميذ بالاستنتاج من السياق (13 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n11. أجزاء الحاسوب: مطابقة صور أجزاء الحاسوب بأسمائها، والتلميذ: المطابقة (13 دقيقة)\nالاستراتيجيات: التصور البصري.\n\n12. توظيف المفردات: توظيف ثلاث مفردات في جمل، والتلميذ: الكتابة (10 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n13. مشاعر الابن: فكر-زاوج-شارك: ما مشاعر الابن؟ وما الدليل؟ والتلميذ: الاستنتاج (15 دقيقة)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n14. مفيد أم ضار؟: تصنيف بطاقات مواقف إلى مفيد وضار، ويقوم التلميذ بالتصنيف والتعليل (13 دقيقة)\nالاستراتيجيات: فكر-زاوج-شارك.\n\n15. ميثاق الاستخدام الآمن: صياغة «ميثاق الاستخدام الآمن» للصف، ويقوم التلميذ بالمشاركة بقاعدة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n16. فوائد أخرى للحاسوب: مناقشة فوائد أخرى للحاسوب في الطب والتعليم والتجارة، والتلميذ: ذكر الفوائد (13 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n17. رأيي في طلب الابن: سؤال الرأي: هل توافق الأب على شراء الحاسوب؟ ولماذا؟ والتلميذ: إبداء الرأي (15 دقيقة)\nالاستراتيجيات: الحوار والمناقشة.\n\n18. العنوان البديل: اقتراح عناوين بديلة، ويقوم التلميذ بالاقتراح والتعليل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n19. غلق الدرس – مهرجان الأبيات: تتنافس المجموعات في إنشاد أبيات «حاسوب» بإيقاع سليم وأداء معبر، ثم تقترح كل مجموعة استخدامًا مفيدًا للحاسوب في التعرف على معالم عمان وتاريخها (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): نوع نص «حاسوب»:\nالإجابة: نشيد شعري\nس2 (مستوى التطبيق): نكتب الحروف بـ:\nالإجابة: لوحة المفاتيح\nس3 (مستوى الاستدلال): صواب أم خطأ: يستخدم الحاسوب في التعليم.\nالإجابة: صواب\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لاستخدامات الحاسوب (البحث، التعلم، الرسم) وصورة طفل يجلس أمامه طويلًا، ويفرز التلميذ الاستخدام المفيد من الضار؛ وللتحقق يسأله: اذكر فائدة واحدة للحاسوب.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يومي يحدد وقتًا معتدلًا لاستخدام الحاسوب، ثم يقارنون بين الحاسوب وجهاز آخر كالتلفاز من حيث الخدمات التي يقدمها كل منهما.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): من يخاطب الابن في النص؟\nالإجابة: أباه\nس2 (مستوى التطبيق): صواب أم خطأ: نأخذ استراحة بعد مدة من الجلوس أمام الحاسوب.\nالإجابة: صواب\nس3 (مستوى الاستدلال): نعرف النص الشعري من:\nالإجابة: الأبيات والإيقاع", "إرشاد للطالب: املأ بطاقة لنص شعري آخر تحبه؛ اقرأ الأبيات بصوت معبر لأسرتك؛ أجب عن أسئلة المستوى الأول ص 69؛ سمّ أجزاء الحاسوب في بيتك بالعربية؛ اكتب مع أسرتك ثلاث قواعد للاستخدام الآمن؛ اسأل أسرتك عن استخدامهم للحاسوب في أعمالهم.\nإرشاد لولي الأمر: شارك ابنك قراءة قصيدة للأطفال؛ استمع لقراءة ابنك؛ راجع مع ابنك إجاباته؛ شجع ابنك على استخدام الكلمات التقنية العربية؛ ناقش م اء الإشارة\n15. الحروف الداخلة على ال\n16. بنية النص", "الإشارة إلى أشياء في الصف: «هذا قلم، هذه ممحاة» وسؤال: لماذا اختلف اسم الإشارة؟ (5 دقائق)", "1. اكتشاف أسماء الإشارة: عرض أمثلة من النص والواقع لاكتشاف أسماء الإشارة واستعمالها، ويقوم التلميذ بالملاحظة والترديد (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. لعبة «أشر وقل»: يحمل الطالب أشياء ويستخدم اسم الإشارة المناسب، ويقوم التلميذ بالتطبيق العملي (16 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. التطبيق الفردي: تدريب الكتاب ص 74، والتلميذ: الحل (9 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. إكمال جمل الكتاب: توجيه الطلبة لإكمال جمل الكتاب ص 75، ويقوم التلميذ بالإكمال الفردي (14 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n5. جمل تبدأ باسم إشارة: عرض صور وتكليف الطلبة بكتابة جمل اسمية تبدأ باسم إشارة (هذا حصن منيع، هذه نخلة باسقة)، ويقوم التلميذ بالكتابة والقراءة (16 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n6. المعالجة الجماعية للأخطاء: التصحيح الجماعي، والتلميذ: التصويب (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. استخراج الجمل الفعلية: توجيه المجموعات لاستخراج الجمل الفعلية من النص، والتلميذ: الاستخراج (14 دقيقة)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n8. التحليل على السبورة: تحديد الفعل والفاعل في كل جملة على السبورة، ويقوم التلميذ بالتحديد والعرض (16 دقيقة)\nالاستراتيجيات: الرؤوس المرقمة.\n\n9. تحويل الاسمية إلى فعلية: تحويل جملتين اسميتين من النص إلى فعليتين، والتلميذ: التحويل (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n10. جدول الصيغ الثلاث: توجيه الطلبة للبحث في النص عن مفردات لإكمال الجدول ص 76، ويقوم التلميذ بالبحث والإكمال (14 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n11. تطبيق باللعب: لعبة «ألوان الصيغ» بالبطاقات، ويقوم التلميذ بالاستجابة بالبطاقة (15 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n12. التصحيح والمراجعة: التصحيح، والتلميذ: المراجعة (9 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n13. مراجعة أقسام الدرس: مراجعة سريعة لأقسام الدرس، ويقوم التلميذ بالإجابة بالتناوب (11 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n14. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «أكمل: ...... تطبيقات مفيدة» على السبورة، ويناقش المعلم الإجابات مع الصف (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n15. غلق الدرس – هذا وطني: يشير تلميذ من كل مجموعة إلى صورة من عمان (حصن، نخلتان، قلاع) فتقول مجموعته جملة باسم الإشارة المناسب مثل «هذا حصن منيع، هاتان نخلتان باسقتان»، وتتسابق المجموعات في الصحة والسرعة (5 دقائق)\nالاستراتيجيات: المسابقات التنافسية.", "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): نشير إلى الحاسوب بـ:\nالإجابة: هذا\nس2 (مستوى التطبيق): الفاعل في «يطيع الحاسوب الأوامر»:\nالإجابة: الحاسوب\nس3 (مستوى الاستدلال): صواب أم خطأ: «هؤلاء طلاب مجتهدون» صحيحة.\nالإجابة: صواب\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لاستخدامات الحاسوب (البحث، التعلم، الرسم) وصورة طفل يجلس أمامه طويلًا، ويفرز التلميذ الاستخدام المفيد من الضار؛ وللتحقق يسأله: اذكر فائدة واحدة للحاسوب.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد جدول يومي يحدد وقتًا معتدلًا لاستخدام الحاسوب، ثم يقارنون بين الحاسوب وجهاز آخر كالتلفاز من حيث الخدمات التي يقدمها كل منهما.", "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: ...... تطبيقات مفيدة.\nالإجابة: هذه\nس2 (مستوى التطبيق): مثنى (شاشة):\nالإجابة: شاشتان\nس3 (مستوى الاستدلال): صواب أم خطأ: «هذان حاسوب» صحيحة.\nالإجابة: خطأ", "إرشاد للطالب: استخدم أسماء الإشارة لوصف خمسة أشياء في بيتك؛ اكتب ثلاث جمل تبدأ بأسماء إشارة مختلفة؛ استخرج جملتين فعليتين من قصة تقرؤها؛ اكتب خمس كلمات تقنية بالمفرد والمثنى والجمع؛ راجع درس حاسوب.\nإرشاد لولي الأمر: صحح لابنك استعمال أسماء الإشارة؛ راجع مع ابنك جمله؛ راجع مع ابنك الفعل والفاعل؛ شارك ابنك لعبة التحويل؛ تابع مراجعة ابنك.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/arabic/?l=17"]}, {"k": "الإملاء", "p": ["النمط الإملائي: مراجعة الحروف الداخلة على (ال)", "الإملاء: الفقرة الإملائية"], "w": "الأسبوع الخامس عشر", "f": ["1. يكتب الكلمات بعد دخول الحروف (ب، ك، ف، و، ل) على (ال) كتابة صحيحة (15 دقيقة)\n2. يميز حالة دخول اللام على (ال) (15 دقيقة)\n3. يكتب ما يملى عليه كتابة صحيحة (15 دقيقة)\n4. يوظف ظواهر المحور الإملائية في كتابته (
