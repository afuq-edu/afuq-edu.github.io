 أخرى: كرات\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية", "المفاهيم": "- الطلاقة الحركية\n- السيطرة على الكرة\n- الرمي واللقف\n- الدوران", "التهيئة / التمهيد / التعلم القبلي": "يرمي المعلم الكرة عاليًا ويدور ثم يلقفها ويسأل: كم حركة أديت؟ ويقدم مفهوم الطلاقة الحركية (ربط الحركات بانسيابية) ص 82-83.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم بالكرة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 83-84): رمي الكرة عاليًا والتصفيق واللقف، رمي ودوران ولقف، تمرير الكرة حول الخصر والركبتين، تنطيط ودوران ولقف، بالتدرج، ويقلد كل حركة بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (محطات الطلاقة الحركية بالكرات) ص 86: محطة الصف (رمي ولقف أثناء المشي 5 م)، محطة الانتشار الحر (تمرير الكرة حول الجسم داخل الطوق)، محطة القطار (الجري بالكرة والرمي والدوران عند القمع)، محطة التبادل مع الزميل، مع التبديل، ويؤدي التلميذ مهمة المحطة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كم مرة؟): من يرمي الكرة ويصفق أكبر عدد قبل اللقف، ويلعب التلميذ (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الطلاقة الحركية؟\nالإجابة: أداء عدة حركات مترابطة بانسيابية وسيطرة.\nس2 (مستوى التطبيق): اذكر حركة طلاقة بالكرة.\nالإجابة: رمي الكرة عاليًا والدوران ثم لقفها.\nس3 (مستوى الاستدلال): كيف نحافظ على الكرة عند الرمي والدوران؟\nالإجابة: نرميها عاليًا بشكل مستقيم وندور بسرعة وننظر إليها.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة عاليًا وصفق مرتين ثم القفها.\nالإجابة: يؤديها دون سقوط الكرة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الرمي واللقف أثناء المشي، وتمرير الكرة حول الجسم.\nس3 (مستوى الاستدلال): ماذا يحدث لو رمينا الكرة مائلة قبل الدوران؟\nالإجابة: تسقط بعيدًا ولا نستطيع لقفها.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على رمي الكرة عاليًا والتصفيق واللقف 10 مرات (دليل المعلم ص 83-86).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}, {"focus": "الطلاقة الحركية بالحبل (الوثب بالحبل الفردي وتدوير الحبل من أسفل)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف حركات الطلاقة الحركية بالحبل.\n2. يؤدي الوثب بالحبل الفردي بالمشطين وتدوير الحبل من أسفل.\n3. يحافظ على الإيقاع بين دوران الحبل والوثب.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: مراتب\n- صورة توضيحية", "المفاهيم": "- الوثب بالحبل\n- تدوير الحبل\n- الإيقاع\n- المشطان", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم حبل الوثب ويسأل: من جرب الوثب بالحبل؟ ويوضح طول الحبل المناسب (2.5-3 م) ص 84.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، وثب في المكان بالمشطين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 84-85): الوثب بالحبل الفردي (وقوف، مسك الحبل، الوثب بالمشطين مع تدوير الحبل أمامًا)، تدوير الحبل من أسفل (مسك طرفي الحبل بيد واحدة وتدويره دائرة على الأرض والوثب فوقه)، بالتدرج: الحبل دون وثب، ثم الوثب، ويقلد التلميذ بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ الوثب بالحبل بتدوير بطيء ثم سريع، وبالوثب العالي ثم المنخفض، ويكتشف أن الوثب المنخفض بالمشطين مع التدوير المنتظم يحفظ الإيقاع، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في أزواج: يعد أحدهما عدد وثبات زميله في 20 ثانية ويتبادلان، ثم يحاولان تحسين العدد، ويعد التلميذ ويحسن (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس2 (مستوى التطبيق): كيف نؤدي تدوير الحبل من أسفل؟\nالإجابة: نمسك طرفي الحبل بيد واحدة وندوره على الأرض ونثب فوقه.\nس3 (مستوى الاستدلال): لماذا يفضل الوثب المنخفض؟\nالإجابة: لأنه يحفظ الإيقاع ويقلل التعب.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الوثب بالحبل 10 مرات متتالية.\nالإجابة: يؤديها بالمشطين دون توقف.\nس2 (مستوى التطبيق): ما طول حبل الوثب الفردي المناسب؟\nالإجابة: من 2.5 إلى 3 أمتار.\nس3 (مستوى الاستدلال): كيف حسنت عدد وثباتك مع زميلك؟\nالإجابة: بتدوير منتظم ووثب منخفض.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: وفر لطفلك حبل وثب مناسبًا وشجعه على 3 دقائق يوميًا (دليل المعلم ص 84-85).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}, {"focus": "الطلاقة الحركية بسلم الرشاقة", "num": 3, "fields": {"المخرجات التعليمية": "1. يتعرف سلم الرشاقة وحركات الطلاقة فيه.\n2. يؤدي الجري بهبوط قدم داخل المربعات والخطو الجانبي والوثب في سلم الرشاقة.\n3. يميز بين أنماط الحركة في سلم الرشاقة.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- صورة توضيحية", "المفاهيم": "- سلم الرشاقة\n- الجري داخل المربعات\n- الخطو الجانبي\n- الوثب\n- الحجل", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم سلم الرشاقة ويسأل: كيف نتحرك داخل مربعاته؟ ويوضح رسم مربعات 30 سم عند عدم توفره (ص 85).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 85-86): الجري بهبوط قدم في كل مربع، الجري بهبوط القدمين في كل مربع، الخطو الجانبي داخل المربعات، الوثب بالقدمين من مربع لآخر، الحجل، مع رفع الركبتين وتحريك الذراعين، ويقلد كل نمط ببطء ثم بسرعة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ النمط نفسه بالنظر إلى القدمين ثم للأمام، وبسرعتين، ويكتشف أن النظر للأمام والإيقاع المنتظم أسرع وأدق، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. قطارات، كل تلميذ يؤدي النمط الذي يناديه المعلم عبر السلم والعودة بالجري، ويتسابق التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): اذكر حركتين في سلم الرشاقة.\nالإجابة: الجري بهبوط قدم في كل مربع، والخطو الجانبي.\nس2 (مستوى التطبيق): كم طول سلم الرشاقة تقريبًا؟\nالإجابة: 4 أمتار.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: لنحافظ على السرعة والاتزان وعدم التعثر.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه دون لمس الأطراف.\nس2 (مستوى التطبيق): ما الفرق بين الحجل والوثب في السلم؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (مستوى الاستدلال): ماذا نفعل إذا لم يتوفر سلم الرشاقة؟\nالإجابة: نرسم مربعات بطول 30 سم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك 8 مربعات بالطباشير ومارسا الجري والخطو الجانبي فيها (دليل المعلم ص 85-86).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}, {"focus": "محطات ومنافسات الطلاقة الحركية بالأدوات", "num": 4, "fields": {"المخرجات التعليمية": "1. يؤدي حركات الطلاقة بالكرة و أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة الحبل ومحطة الكرة.\nس3 (مستوى الاستدلال): كيف شعرت عندما أنهيت المسار دون أخطاء؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي (حبل، مربعات، كرة) (دليل المعلم ص 87-89).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الطلاقة الحركية بالأدوات وأهميتها.\n2. يؤدي حركات الطلاقة بالكرة (رمي عاليًا والدوران واللقف، تمرير الكرة حول الجسم).\n3. يحافظ على السيطرة على الكرة أثناء الحركة.\n\nالحصة 2:\n1. يتعرف حركات الطلاقة الحركية بالحبل.\n2. يؤدي الوثب بالحبل الفردي بالمشطين وتدوير الحبل من أسفل.\n3. يحافظ على الإيقاع بين دوران الحبل والوثب.\n\nالحصة 3:\n1. يتعرف سلم الرشاقة وحركات الطلاقة فيه.\n2. يؤدي الجري بهبوط قدم داخل المربعات والخطو الجانبي والوثب في سلم الرشاقة.\n3. يميز بين أنماط الحركة في سلم الرشاقة.\n\nالحصة 4:\n1. يؤدي حركات الطلاقة بالكرة والحبل وسلم الرشاقة في محطات متكاملة.\n2. يوظف الطلاقة الحركية في منافسات.\n3. يستمتع بمشاركة زملائه أنشطة الطلاقة الحركية.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 3:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\n\nالحصة 4:\nالمخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم التعاوني\n\nالحصة 3:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n\nالحصة 4:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n- التعلم بالاكتشاف", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات\n- أخرى: بالونات\n- أخرى: أقماع\n- أخرى: أطواق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: حبال وثب\n- أخرى: أقماع\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 3:\n- أخرى: سلم الرشاقة\n- أخرى: شريط لاصق\n- أخرى: أقماع\n- صورة توضيحية\n\nالحصة 4:\n- أخرى: كرات\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: أقماع\n- أخرى: أطواق", "المفاهيم": "الحصة 1:\n- الطلاقة الحركية\n- السيطرة على الكرة\n- الرمي واللقف\n- الدوران\n\nالحصة 2:\n- الوثب بالحبل\n- تدوير الحبل\n- الإيقاع\n- المشطان\n\nالحصة 3:\n- سلم الرشاقة\n- الجري داخل المربعات\n- الخطو الجانبي\n- الوثب\n- الحجل\n\nالحصة 4:\n- الطلاقة الحركية\n- المحطات\n- الانسيابية\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرمي المعلم الكرة عاليًا ويدور ثم يلقفها ويسأل: كم حركة أديت؟ ويقدم مفهوم الطلاقة الحركية (ربط الحركات بانسيابية) ص 82-83.\n\nالحصة 2:\nيعرض المعلم حبل الوثب ويسأل: من جرب الوثب بالحبل؟ ويوضح طول الحبل المناسب (2.5-3 م) ص 84.\n\nالحصة 3:\nيعرض المعلم سلم الرشاقة ويسأل: كيف نتحرك داخل مربعاته؟ ويوضح رسم مربعات 30 سم عند عدم توفره (ص 85).\n\nالحصة 4:\nيراجع المعلم الأدوات الثلاث ويسأل: ما حركة الطلاقة التي أحببتموها في كل أداة؟ ويعرض محطات اليوم.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم بالكرة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 83-84): رمي الكرة عاليًا والتصفيق واللقف، رمي ودوران ولقف، تمرير الكرة حول الخصر والركبتين، تنطيط ودوران ولقف، بالتدرج، ويقلد كل حركة بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 (محطات الطلاقة الحركية بالكرات) ص 86: محطة الصف (رمي ولقف أثناء المشي 5 م)، محطة الانتشار الحر (تمرير الكرة حول الجسم داخل الطوق)، محطة القطار (الجري بالكرة والرمي والدوران عند القمع)، محطة التبادل مع الزميل، مع التبديل، ويؤدي التلميذ مهمة المحطة (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. لعبة (كم مرة؟): من يرمي الكرة ويصفق أكبر عدد قبل اللقف، ويلعب التلميذ (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، وثب في المكان بالمشطين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 84-85): الوثب بالحبل الفردي (وقوف، مسك الحبل، الوثب بالمشطين مع تدوير الحبل أمامًا)، تدوير الحبل من أسفل (مسك طرفي الحبل بيد واحدة وتدويره دائرة على الأرض والوثب فوقه)، بالتدرج: الحبل دون وثب، ثم الوثب، ويقلد التلميذ بالتدرج (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ الوثب بالحبل بتدوير بطيء ثم سريع، وبالوثب العالي ثم المنخفض، ويكتشف أن الوثب المنخفض بالمشطين مع التدوير المنتظم يحفظ الإيقاع، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. في أزواج: يعد أحدهما عدد وثبات زميله في 20 ثانية ويتبادلان، ثم يحاولان تحسين العدد، ويعد التلميذ ويحسن (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 3 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النماذج (ص 85-86): الجري بهبوط قدم في كل مربع، الجري بهبوط القدمين في كل مربع، الخطو الجانبي داخل المربعات، الوثب بالقدمين من مربع لآخر، الحجل، مع رفع الركبتين وتحريك الذراعين، ويقلد كل نمط ببطء ثم بسرعة (12 دقيقة)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجرب التلميذ النمط نفسه بالنظر إلى القدمين ثم للأمام، وبسرعتين، ويكتشف أن النظر للأمام والإيقاع المنتظم أسرع وأدق، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. قطارات، كل تلميذ يؤدي النمط الذي يناديه المعلم عبر السلم والعودة بالجري، ويتسابق التلميذ بدقة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 4 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. نشاط 2 و3 ص 87-88: محطة الحبل (وثب 3 مرات بتدوير يمين ثم يسار)، محطة الكرة (رمي ودوران ولقف)، محطة سلم الرشاقة (نمط يختاره القائد)، محطة الكرة والسلم (الجري في السلم بالكرة)، بأربع مجموعات والتبديل، ويؤدي التلميذ ويبدل (14 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. منافسة ص 89: تتابع يجمع الأدوات الثلاث: وثب بالحبل 5 مرات، جري في سلم الرشاقة، رمي الكرة والدوران واللقف ثم العودة، ويتسابق التلميذ (11 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. يسأل المعلم: لماذا كانت بعض الفرق أسرع؟ ليستنتج التلاميذ أهمية الانسيابية في الانتقال بين الحركات، ويستنتج التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): ما الطلاقة الحركية؟\nالإجابة: أداء عدة حركات مترابطة بانسيابية وسيطرة.\nس2 (مستوى التطبيق): اذكر حركة طلاقة بالكرة.\nالإجابة: رمي الكرة عاليًا والدوران ثم لقفها.\nس3 (مستوى الاستدلال): كيف نحافظ على الكرة عند الرمي والدوران؟\nالإجابة: نرميها عاليًا بشكل مستقيم وندور بسرعة وننظر إليها.\n\nالحصة 2:\nس1 (مستوى المعرفة): بأي جزء من القدم نثب بالحبل؟\nالإجابة: بالمشطين.\nس2 (مستوى التطبيق): كيف نؤدي تدوير الحبل من أسفل؟\nالإجابة: نمسك طرفي الحبل بيد واحدة وندوره على الأرض ونثب فوقه.\nس3 (مستوى الاستدلال): لماذا يفضل الوثب المنخفض؟\nالإجابة: لأنه يحفظ الإيقاع ويقلل التعب.\n\nالحصة 3:\nس1 (مستوى المعرفة): اذكر حركتين في سلم الرشاقة.\nالإجابة: الجري بهبوط قدم في كل مربع، والخطو الجانبي.\nس2 (مستوى التطبيق): كم طول سلم الرشاقة تقريبًا؟\nالإجابة: 4 أمتار.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام أثناء الحركة في السلم؟\nالإجابة: لنحافظ على السرعة والاتزان وعدم التعثر.\n\nالحصة 4:\nس1 (مستوى المعرفة): في أي محطة استخدمنا أداتين معًا؟\nالإجابة: محطة الكرة والسلم.\nس2 (مستوى التطبيق): ما ترتيب حركات منافسة اليوم؟\nالإجابة: وثب بالحبل، جري في السلم، رمي الكرة والدوران واللقف.\nس3 (مستوى الاستدلال): ما الانسيابية؟\nالإجابة: الانتقال من حركة إلى أخرى دون توقف.\n\n• نشاط علاجي (لمن لم يتقن): يرمي المعلم مع التلميذ الكرة عاليًا قليلًا ويلقفانها دون دوران، ثم بنصف دورة، ثم بدورة كاملة، ثم يطلب منه تمرير الكرة حول جسمه ثلاث مرات.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بربط ثلاث حركات طلاقة بالكرة أو الحبل في جملة حركية واحدة منسابة، وأدائها أمام زملائهم دون فقد السيطرة على الأداة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارمِ الكرة عاليًا وصفق مرتين ثم القفها.\nالإجابة: يؤديها دون سقوط الكرة.\nس2 (مستوى التطبيق): اذكر محطتين من محطات الطلاقة بالكرات.\nالإجابة: الرمي واللقف أثناء المشي، وتمرير الكرة حول الجسم.\nس3 (مستوى الاستدلال): ماذا يحدث لو رمينا الكرة مائلة قبل الدوران؟\nالإجابة: تسقط بعيدًا ولا نستطيع لقفها.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الوثب بالحبل 10 مرات متتالية.\nالإجابة: يؤديها بالمشطين دون توقف.\nس2 (مستوى التطبيق): ما طول حبل الوثب الفردي المناسب؟\nالإجابة: من 2.5 إلى 3 أمتار.\nس3 (مستوى الاستدلال): كيف حسنت عدد وثباتك مع زميلك؟\nالإجابة: بتدوير منتظم ووثب منخفض.\n\nالحصة 3:\nس1 (مستوى المعرفة): أدِّ الجري بهبوط قدم في كل مربع عبر السلم.\nالإجابة: يؤديه دون لمس الأطراف.\nس2 (مستوى التطبيق): ما الفرق بين الحجل والوثب في السلم؟\nالإجابة: الحجل بقدم واحدة والوثب بالقدمين.\nس3 (مستوى الاستدلال): ماذا نفعل إذا لم يتوفر سلم الرشاقة؟\nالإجابة: نرسم مربعات بطول 30 سم.\n\nالحصة 4:\nس1 (مستوى المعرفة): أدِّ مسار المنافسة كاملًا.\nالإجابة: يؤديه بانسيابية.\nس2 (مستوى التطبيق): اذكر محطتين من محطات اليوم.\nالإجابة: محطة الحبل ومحطة الكرة.\nس3 (مستوى الاستدلال): كيف شعرت عندما أنهيت المسار دون أخطاء؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على رمي الكرة عاليًا والتصفيق واللقف 10 مرات (دليل المعلم ص 83-86).\n\nالحصة 2:\nإرشاد لولي الأمر: وفر لطفلك حبل وثب مناسبًا وشجعه على 3 دقائق يوميًا (دليل المعلم ص 84-85).\n\nالحصة 3:\nإرشاد لولي الأمر: ارسم مع طفلك 8 مربعات بالطباشير ومارسا الجري والخطو الجانبي فيها (دليل المعلم ص 85-86).\n\nالحصة 4:\nإرشاد لولي الأمر: شجع طفلك على مسار طلاقة منزلي (حبل، مربعات، كرة) (دليل المعلم ص 87-89).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=9"}}, {"title": "سباقات الجري", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثاني عشر", "date": "22-26/11/2026 (اليوم الوطني)", "pages": "دليل المعلم ص 94-103", "n": 2, "periods": [{"focus": "سباق تتابع العدو", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف سباقات الجري في ألعاب القوى للصغار وقواعد سباق تتابع العدو.\n2. يؤدي العدو السريع والتسليم بلمس يد الزميل في تتابع العدو.\n3. يطبق قواعد السباق (الانطلاق بعد اللمس، البقاء في المسار).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- أخرى: شريط لاصق\n- صورة توضيحية", "المفاهيم": "- العدو\n- التتابع المكوكي\n- المسار\n- التسليم\n- القاعدة القانونية", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور عدائين في سباق تتابع ويسأل: كيف يفوز الفريق؟ ويقدم ألعاب القوى للصغار (ص 94-95).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري خفيف، رفع الركبتين، جري مع تزايد السرعة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج العدو (الجري على المشطين، الذراعان منثنيتان وتتحركان بالتبادل، النظر للأمام) ونموذج التسليم المكوكي بلمس يد الزميل الواقف خلف الخط (ص 95-96)، ويقلد التلميذ العدو والتسليم (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 97: فرق متساوية في قطارات متقابلة على مسافة 20 م، يعدو الأول ويلمس يد الزميل المقابل فينطلق، حتى يعود الجميع، ويسجل القائد الأخطاء، ويؤدي التلميذ السباق ويلتزم بالقواعد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الكرسي الساخن: يجلس تلميذ متطوع أمام زملائه ويجيب عن أسئلتهم حول سباق تتابع العدو، ويبدأ المعلم بسؤال «متى ينطلق العداء التالي في تتابع العدو» (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): متى ينطلق العداء التالي في تتابع العدو؟\nالإجابة: بعد لمس يد زميله.\nس2 (مستوى التطبيق): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وتتحركان بالتبادل مع الرجلين.\nس3 (مستوى الاستدلال): ما الخطأ الذي يجعل الفريق يخسر؟\nالإجابة: الانطلاق قبل اللمس أو الخروج من المسار.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على التسليم بلمس اليد ببطء: يقف التلميذ في مساره ولا ينطلق إلا بعد اللمس، ثم يسأله: متى ينطلق العداء التالي في تتابع العدو؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق تتابع عدو لفريقين مع تحكيمه وفق القواعد (الانطلاق بعد اللمس، والبقاء في المسار)، وتحديد الأخطاء التي تُخسر الفريق.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر قاعدتين لسباق تتابع العدو.\nالإجابة: الانطلاق بعد اللمس، والبقاء في المسار.\nس2 (مستوى التطبيق): أدِّ العدو 20 م بالطريقة الصحيحة.\nالإجابة: يعدو على المشطين والنظر للأمام.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام في العدو ولا ننظر للزملاء؟\nالإجابة: للمحافظة على السرعة والاتجاه.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: شجع طفلك على جري قصير سريع مع العائلة بالتتابع في مكان آمن (دليل المعلم ص 95-97).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=10"}}, {"focus": "سباق الجري المتنوع (الفورميلا 1)", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف سباق الجري المتنوع وقواعده.\n2. يوظف الحركات الأساسية (العدو، الجري المتعرج، تعدية الحواجز، الدحرجة) في سباق واحد.\n3. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: أعلام ملونة\n- أخرى: مراتب\n- أخرى: عصي التتابع", "المفاهيم": "- الجري المتنوع\n- الفورميلا 1\n- تعدية الحواجز\n- الجري المتعرج", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم تتابع العدو ويسأل: ماذا لو وضعنا في مسار السباق حواجز وأعلامًا ومراتب؟ ويقدم سباق الفورميلا 1 (ص 96).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم يشمل الوثب فوق الحواجز والدحرجة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج مناطق المسار المنحني (40-50 م): دحرجة فوق المراتب، عدو، عدو متعرج بين الأعلام، جري بتعدية الحواجز، تسليم العصا، ويقلد كل منطقة (10 دقائق)\nالاستراتيجي اجز، الدحرجة) في سباق واحد.\n3. يشعر بالسعادة والرضا بمشاركته زملاءه سباقات الجري.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أعلام ملونة\n- أخرى: حلق مطاطية\n- أخرى: شريط لاصق\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: أعلام ملونة\n- أخرى: مراتب\n- أخرى: عصي التتابع", "المفاهيم": "الحصة 1:\n- العدو\n- التتابع المكوكي\n- المسار\n- التسليم\n- القاعدة القانونية\n\nالحصة 2:\n- الجري المتنوع\n- الفورميلا 1\n- تعدية الحواجز\n- الجري المتعرج", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور عدائين في سباق تتابع ويسأل: كيف يفوز الفريق؟ ويقدم ألعاب القوى للصغار (ص 94-95).\n\nالحصة 2:\nيراجع المعلم تتابع العدو ويسأل: ماذا لو وضعنا في مسار السباق حواجز وأعلامًا ومراتب؟ ويقدم سباق الفورميلا 1 (ص 96).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري خفيف، رفع الركبتين، جري مع تزايد السرعة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج العدو (الجري على المشطين، الذراعان منثنيتان وتتحركان بالتبادل، النظر للأمام) ونموذج التسليم المكوكي بلمس يد الزميل الواقف خلف الخط (ص 95-96)، ويقلد التلميذ العدو والتسليم (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 97: فرق متساوية في قطارات متقابلة على مسافة 20 م، يعدو الأول ويلمس يد الزميل المقابل فينطلق، حتى يعود الجميع، ويسجل القائد الأخطاء، ويؤدي التلميذ السباق ويلتزم بالقواعد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «كيف شعرت بمشاركة فريقك في السباق» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم يشمل الوثب فوق الحواجز والدحرجة، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج مناطق المسار المنحني (40-50 م): دحرجة فوق المراتب، عدو، عدو متعرج بين الأعلام، جري بتعدية الحواجز، تسليم العصا، ويقلد كل منطقة (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 و3 ص 98-100: فرق في قطارات، يؤدي كل تلميذ المسار كاملًا ويسلم العصا للتالي، ويراقب القائد تعدية الحواجز دون إسقاطها، ويؤدي التلميذ المسار ويسلم العصا (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 (السباق الرئيسي) ص 103: الفورميلا 1 بين الفرق وتحديد الفائز، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): متى ينطلق العداء التالي في تتابع العدو؟\nالإجابة: بعد لمس يد زميله.\nس2 (مستوى التطبيق): كيف تتحرك الذراعان أثناء العدو؟\nالإجابة: منثنيتان وتتحركان بالتبادل مع الرجلين.\nس3 (مستوى الاستدلال): ما الخطأ الذي يجعل الفريق يخسر؟\nالإجابة: الانطلاق قبل اللمس أو الخروج من المسار.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر مناطق مسار الفورميلا 1.\nالإجابة: الدحرجة، العدو، العدو المتعرج، تعدية الحواجز.\nس2 (مستوى التطبيق): ماذا نسلم للزميل في هذا السباق؟\nالإجابة: عصا التتابع.\nس3 (مستوى الاستدلال): ما الحركة التي نؤديها بين الأعلام؟\nالإجابة: الجري المتعرج.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على التسليم بلمس اليد ببطء: يقف التلميذ في مساره ولا ينطلق إلا بعد اللمس، ثم يسأله: متى ينطلق العداء التالي في تتابع العدو؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنظيم سباق تتابع عدو لفريقين مع تحكيمه وفق القواعد (الانطلاق بعد اللمس، والبقاء في المسار)، وتحديد الأخطاء التي تُخسر الفريق.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): اذكر قاعدتين لسباق تتابع العدو.\nالإجابة: الانطلاق بعد اللمس، والبقاء في المسار.\nس2 (مستوى التطبيق): أدِّ العدو 20 م بالطريقة الصحيحة.\nالإجابة: يعدو على المشطين والنظر للأمام.\nس3 (مستوى الاستدلال): لماذا ننظر للأمام في العدو ولا ننظر للزملاء؟\nالإجابة: للمحافظة على السرعة والاتجاه.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ مسار الفورميلا 1 كاملًا.\nالإجابة: يؤديه بالحركات الصحيحة.\nس2 (مستوى التطبيق): ما الحركات الأساسية التي تضمنها سباق اليوم؟\nالإجابة: الجري، الوثب (تعدية الحواجز)، الدحرجة، تغيير الاتجاه.\nس3 (مستوى الاستدلال): كيف شعرت بمشاركة فريقك في السباق؟\nالإجابة: يعبر عن الرضا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: شجع طفلك على جري قصير سريع مع العائلة بالتتابع في مكان آمن (دليل المعلم ص 95-97).\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طفلك مناطق سباق الفورميلا 1 وشجعه على الجري اليومي (دليل المعلم ص 96-103).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=10"}}, {"title": "الممارسات الصحية والمهرجانات الرياضية التعليمية", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الثالث عشر", "date": "29/11-3/12/2026 (يوم الأنشطة التربوية)", "pages": "دليل المعلم ص 18-23", "n": 2, "periods": [{"focus": "الممارسات الصحية: التنفس الصحيح أثناء الجري والراحة بعد الجهد", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف التنفس الصحيح أثناء الجري (الشهيق من الأنف والزفير من الفم).\n2. يميز علامات التعب التي تستدعي الراحة.\n3. يطبق المشي والتنفس العميق بعد الجري بدل التوقف المفاجئ.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب", "المصادر التعليمية": "- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: زجاجات ماء", "المفاهيم": "- التنفس\n- الشهيق والزفير\n- النبض\n- الراحة\n- التعب", "التهيئة / التمهيد / التعلم القبلي": "بعد جري قصير يسأل المعلم: كيف تتنفسون الآن؟ ويعرض صورة عداء يتنفس بانتظام.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم مع التنفس المنتظم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم بالنموذج: الشهيق من الأنف والزفير من الفم بإيقاع مع الخطوات، وعدم التوقف فجأة بعد الجري بل المشي والتنفس العميق، وعلامات التعب (دوار، ألم في الجنب) التي تستدعي الراحة (برنامج صحتي ص 23)، ويقلد التلميذ التنفس ويرتب البطاقات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. يجري التلاميذ 30 ثانية ثم يقيس كل تلميذ نبضه بيده على الصدر، ثم يمشي دقيقة ويقيس مرة أخرى، ويكتشف أثر المشي والتنفس في عودة النبض، ويجرب التلميذ ويستنتج (10 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (العداء الذكي): نداءات (اجرِ، امشِ وتنفس، استرح في الظل) ويستجيب التلاميذ، ويلعب التلميذ ويستجيب (9 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة بالتنفس العميق وشرب الماء، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين نأخذ الشهيق أثناء الجري؟\nالإجابة: من الأنف.\nس2 (مستوى التطبيق): لماذا لا نتوقف فجأة بعد الجري السريع؟\nالإجابة: حتى لا نشعر بالدوار، فنمشي ونتنفس بعمق.\nس3 (مستوى الاستدلال): اذكر علامة تعب تستدعي الراحة.\nالإجابة: الدوار أو ألم الجنب.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على الشهيق من الأنف والزفير من الفم أثناء جري خفيف، ثم المشي والتنفس العميق بعده، ثم يسأله: لماذا لا نتوقف فجأة بعد الجري السريع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «علامات التعب» (الدوار، وألم الجنب) وما نفعله عند كل علامة، وقيادة زملائهم في التهدئة بعد سباق المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): ماذا حدث لنبضك بعد المشي دقيقة؟\nالإجابة: انخفض وعاد إلى الهدوء.\nس2 (مستوى التطبيق): أرفع بطاقة طفل جلس فجأة بعد الجري، ما الأفضل له؟\nالإجابة: أن يمشي ويتنفس بعمق أولًا.\nس3 (مستوى الاستدلال): كيف تنظم تنفسك في سباق طويل؟\nالإجابة: شهيق من الأنف وزفير من الفم بإيقاع منتظم.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: علّم طفلك المشي والتنفس العميق بعد اللعب وعدم التوقف المفاجئ (برنامج صحتي، دليل المعلم ص 23).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=11"}}, {"focus": "المهرجان الرياضي التعليمي لألعاب القوى للصغار (سباقات الجري) والطلاقة الحركية", "num": 2, "fields": {"المخرجات التعليمية": "1. يوظف العدو والتتابع والجري المتنوع في أقسام المهرجان.\n2. يطبق قواعد السباقات والأمان.\n3. يتعاون مع مجموعته ويتقبل النتيجة بروح رياضية.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: حواجز منخفضة\n- أخرى: أعلام\n- أخرى: عصي التتابع\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: لوحة نقاط", "المفاهيم": "- المهرجان الرياضي التعليمي\n- سباقات الجري\n- التتابع\n- روح الفريق", "التهيئة / التمهيد / التعلم القبلي": "يعلن المعلم مهرجان (أجري) ويقسم التلاميذ أربع مجموعات بقادة ويعرض الأقسام.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء جماعي، ويؤدي التلميذ الإحماء (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. أربعة أقسام (6-7 دقائق لكل قسم): قسم تتابع العدو، قسم الفورميلا 1 المصغر، قسم سلم الرشاقة والحبل، قسم الجري المتعرج بين الأعلام بالكرة، مع تسجيل النقاط، ويؤدي التلميذ المهام مع مجموعته (26 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n3. سباق ختامي بين الفرق، ويتسابق التلميذ (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تهدئة بالمشي والتنفس وتكريم، ويؤدي التلميذ التهدئة ويهنئ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما القسم الذي استخدمنا فيه عصا التتابع؟\nالإجابة: قسم الفورميلا 1.\nس2 (مستوى التطبيق): كيف نسلم في تتابع العدو؟\nالإجابة: بلمس يد الزميل.\nس3 (مستوى الاستدلال): ماذا نفعل بعد كل قسم جري؟\nالإجابة: نمشي ونتنفس بعمق.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ على الشهيق من الأنف والزفير من الفم أثناء جري خفيف، ثم المشي والتنفس العميق بعده، ثم يسأله: لماذا لا نتوقف فجأة بعد الجري السريع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «علامات التعب» (الدوار، وألم الجنب) وما نفعله عند كل علامة، وقيادة زملائهم في التهدئة بعد سباق المهرجان.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر أقسام المهرجان الأربعة.\nالإجابة: تتابع العدو، الفورميلا 1، سلم الرشاقة والحبل، الجري المتعرج بالكرة.\nس2 (مستوى التطبيق): ما القاعدة التي راقبها الحكم الصغير في التتابع؟\nالإجابة: ال 04-105).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، وثب في المكان، ثني الركبتين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وثبة القرفصاء (ص 106): وقوف خلف الخط، ثني الركبتين بعمق ومرجحة الذراعين خلفًا، الدفع بالقدمين مع مرجحة الذراعين أمامًا عاليًا، الهبوط على القدمين بثني الركبتين، ونقطة القياس من مؤخرة القدم، ويقلد التلميذ بالتدرج (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 107: فرق في قطارات، يثب الأول من خلف الخط مرة واحدة لأبعد نقطة، ثم يثب الثاني من نقطة هبوط الأول وهكذا، وتقاس المسافة الكلية للفريق، ويؤدي التلميذ الوثبة ويتتابع (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. صح أم خطأ: يقرأ المعلم عبارات قصيرة عن الدرس، ويرفع التلاميذ بطاقة «صح» أو «خطأ» ويصحّحون العبارة الخاطئة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين تقاس وثبة الفريق التالي؟\nالإجابة: من نقطة هبوط التلميذ السابق.\nس2 (مستوى التطبيق): ماذا نفعل بالذراعين عند الوثب؟\nالإجابة: نمرجحهما خلفًا ثم أمامًا عاليًا.\nس3 (مستوى الاستدلال): كيف نهبط بعد وثبة القرفصاء؟\nالإجابة: على القدمين معًا بثني الركبتين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ وثبة القرفصاء للأمام من خلف الخط.\nالإجابة: يؤديها بمرجحة الذراعين والهبوط الآمن.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد المسابقة.\nالإجابة: الوثب من خلف الخط دون تجاوزه.\nس3 (مستوى الاستدلال): كيف يفوز الفريق في مسابقة وثبة القرفصاء؟\nالإجابة: بأكبر مسافة كلية لوثبات أفراده.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تدرب مع طفلك على وثبة القرفصاء ل n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ الوثب في المربعات المتقاطعة 10 ثوانٍ.\nالإجابة: يؤديه بالترتيب والإيقاع.\nس2 (مستوى التطبيق): أرفع صورة مسابقة وثب، ما اسمها؟\nالإجابة: وثبة القرفصاء أو المربعات المتقاطعة.\nس3 (مستوى الاستدلال): كيف شعرت في مسابقات الوثب؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ارسم مع طفلك مربعات متقاطعة بالطباشير ومارسا الوثب فيها (دليل المعلم ص 108-113).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=12"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الوثب في ألعاب القوى للصغار وقواعد وثبة القرفصاء.\n2. يؤدي وثبة القرفصاء للأمام بمرجحة الذراعين والهبوط على القدمين.\n3. يطبق قواعد المسابقة (الوثب من خلف الخط، تتابع الفريق).\n\nالحصة 2:\n1. يتعرف مسابقة المربعات المتقاطعة وقواعدها.\n2. يوظف الوثب بالقدمين في اتجاهات (أمام، خلف، جانب) داخل المربعات.\n3. يستمتع بمشاركة زملائه مسابقات الوثب.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: بطاقات مرقمة\n- أخرى: مراتب\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: شريط لاصق\n- أخرى: أطواق\n- أخرى: بالونات\n- أخرى: حبال\n- أخرى: مربعات الأرقام\n- أخرى: أقماع", "المفاهيم": "الحصة 1:\n- الوثب\n- وثبة القرفصاء\n- الارتقاء\n- الهبوط\n- خط الوثب\n\nالحصة 2:\n- المربعات المتقاطعة\n- الوثب في اتجاهات\n- الإيقاع\n- المنافسة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صورة لاعب الوثب الطويل ويسأل: من أين يبدأ الوثب وأين يهبط؟ ويقدم مسابقات الوثب للصغار (ص 104-105).\n\nالحصة 2:\nيراجع المعلم وثبة القرفصاء، ثم يرسم مربعات متقاطعة (شكل +) ويسأل: كيف نثب فيها بالترتيب؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، وثب في المكان، ثني الركبتين، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج وثبة القرفصاء (ص 106): وقوف خلف الخط، ثني الركبتين بعمق ومرجحة الذراعين خلفًا، الدفع بالقدمين مع مرجحة الذراعين أمامًا عاليًا، الهبوط على القدمين بثني الركبتين، ونقطة القياس من مؤخرة القدم، ويقلد التلميذ بالتدرج (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 107: فرق في قطارات، يثب الأول من خلف الخط مرة واحدة لأبعد نقطة، ثم يثب الثاني من نقطة هبوط الأول وهكذا، وتقاس المسافة الكلية للفريق، ويؤدي التلميذ الوثبة ويتتابع (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. ثلاث كلمات: يكتب كل تلميذ ثلاث كلمات تلخّص مسابقات الوثب، ويعرض بعضهم كلماتهم ويشرحون سبب اختيارها (7 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n5. تهدئة وإطالة الساقين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج المربعات المتقاطعة (ص 108): الوقوف في المربع الأوسط والوثب بالقدمين للأمام ثم العودة ثم للجانبين بالترتيب وبإيقاع، وعد الوثبات الصحيحة في 20 ثانية، ويقلد التلميذ بالترتيب (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 و3 ص 109-111: محطات الوثب: المربعات المتقاطعة، الوثب فوق الحبال، الوثب داخل الأطواق المتباعدة، وثبة القرفصاء على المرتبة، بأربع مجموعات والتبديل، ويؤدي التلميذ ويبدل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 ( الرئيسية) ص 113: ثبة القرفصاء بالتتابع بين الفرق، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): من أين تقاس وثبة الفريق التالي؟\nالإجابة: من نقطة هبوط التلميذ السابق.\nس2 (مستوى التطبيق): ماذا نفعل بالذراعين عند الوثب؟\nالإجابة: نمرجحهما خلفًا ثم أمامًا عاليًا.\nس3 (مستوى الاستدلال): كيف نهبط بعد وثبة القرفصاء؟\nالإجابة: على القدمين معًا بثني الركبتين.\n\nالحصة 2:\nس1 (مستوى المعرفة): من أين نبدأ في المربعات المتقاطعة؟\nالإجابة: من المربع الأوسط.\nس2 (مستوى التطبيق): ما ترتيب الوثب في المربعات؟\nالإجابة: أمام ثم عودة ثم الجانبان.\nس3 (مستوى الاستدلال): كيف نحسب النقاط في المربعات المتقاطعة؟\nالإجابة: بعدد الوثبات الصحيحة في الزمن المحدد.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ وثبة القرفصاء ببطء: مرجحة الذراعين خلفًا ثم أمامًا عاليًا، والوثب من خلف الخط، والهبوط على القدمين بثني الركبتين، ثم يطلب منه أداءها مرة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتنفيذ مسابقة وثب فريقية تقاس فيها وثبة كل تلميذ من نقطة هبوط السابق، وتسجيل المسافة الكلية، واقتراح طريقة لزيادتها.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ وثبة القرفصاء للأمام من خلف الخط.\nالإجابة: يؤديها بمرجحة الذراعين والهبوط الآمن.\nس2 (مستوى التطبيق): اذكر قاعدة من قواعد المسابقة.\nالإجابة: الوثب من خلف الخط دون تجاوزه.\nس3 (مستوى الاستدلال): كيف يفوز الفريق في مسابقة وثبة القرفصاء؟\nالإجابة: بأكبر مسافة كلية لوثبات أفراده.\n\nالحصة 2:\nس1 (مستوى المعرفة): أدِّ الوثب في المربعات المتقاطعة 10 ثوانٍ.\nالإجابة: يؤديه بالترتيب والإيقاع.\nس2 (مستوى التطبيق): أرفع صورة مسابقة وثب، ما اسمها؟\nالإجابة: وثبة القرفصاء أو المربعات المتقاطعة.\nس3 (مستوى الاستدلال): كيف شعرت في مسابقات الوثب؟\nالإجابة: يعبر عن سعادته.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تدرب مع طفلك على وثبة القرفصاء للأمام وقياس المسافة في مكان آمن (دليل المعلم ص 106-107).\n\nالحصة 2:\nإرشاد لولي الأمر: ارسم مع طفلك مربعات متقاطعة بالطباشير ومارسا الوثب فيها (دليل المعلم ص 108-113).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=12"}}, {"title": "مسابقات الرمي", "unit": "ألعاب القوى للصغار (أجري، أقفز، أرمي)", "week": "الخامس عشر", "date": "13-17/12/2026", "pages": "دليل المعلم ص 114-124", "n": 2, "periods": [{"focus": "مسابقة الرمي لإصابة هدف من فوق حاجز", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقات الرمي في ألعاب القوى للصغار وقواعد الرمي على الهدف.\n2. يؤدي رمي الكرة بيد واحدة من فوق الكتف لإصابة هدف من فوق حاجز.\n3. يطبق قواعد الرمي (من خلف خط الرمي، عدد المحاولات).", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: كرات صغيرة\n- أخرى: حواجز\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- صورة توضيحية", "المفاهيم": "- الرمي\n- الدقة\n- خط الرمي\n- الهدف\n- المحاولة", "التهيئة / التمهيد / التعلم القبلي": "يعرض المعلم صور مسابقات الرمي ويسأل: كيف نرمي بدقة نحو هدف؟ ويقدم مسابقة الرمي على الهدف (ص 114-115).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم: جري، دوران الذراعين، رمي الكرة لأعلى ولقفها، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بيد واحدة من فوق الكتف: قدم متقدمة عكس اليد الرامية، سحب الذراع خلفًا، الرمي مع نقل الثقل للأمام والنظر إلى الهدف (ص 115-116)، ويقلد التلميذ بالتدرج (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 117: فرق في قطارات خلف خط الرمي، حاجز بينها وبين الأهداف (أطواق وسلال)، لكل تلميذ محاولتان، وتحسب نقاط الإصابة للفريق، ويرمي التلميذ ويسجل القائد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. أكمل الفكرة: يبدأ المعلم جملة عن الدرس، ويكملها التلاميذ بالتناوب حتى يكتمل ملخص الحصة على السبورة (7 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n5. تهدئة وإطالة الذراعين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): أي قدم تتقدم عند الرمي باليد اليمنى؟\nالإجابة: القدم اليسرى.\nس2 (مستوى التطبيق): من أين نرمي في المسابقة؟\nالإجابة: من خلف خط الرمي.\nس3 (مستوى الاستدلال): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الكرة من فوق الحاجز لتصيب الطوق.\nالإجابة: يرمي بدقة من فوق الكتف.\nس2 (مستوى التطبيق): كيف يفوز الفريق في مسابقة الرمي على الهدف؟\nالإجابة: بأكبر عدد من الإصابات.\nس3 (مستوى الاستدلال): لماذا ننظر إلى الهدف لا إلى الكرة أثناء الرمي؟\nالإجابة: لتوجيه الرمية بدقة نحو الهدف.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: العب مع طفلك رمي كرة صغيرة فوق حبل لإصابة سلة (دليل المعلم ص 115-117).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=13"}}, {"focus": "مسابقة رمي الرمح للصغار لأبعد مسافة", "num": 2, "fields": {"المخرجات التعليمية": "1. يتعرف مسابقة رمي الرمح للصغار وقواعدها.\n2. يؤدي رمي الرمح البلاستيكي من اقتراب قصير لأبعد مسافة.\n3. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: رماح بلاستيكية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: مراتب", "المفاهيم": "- رمي الرمح\n- الاقتراب\n- منطقة الرمي\n- المسافة\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "يراجع المعلم الرمي على الهدف، ثم يعرض الرمح البلاستيكي ويسأل: كيف نمسكه؟ وما قواعد الأمان عند رميه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 116): مسك الرمح من المقبض فوق الكتف، اقتراب 5 م، سحب الذراع خلفًا ورمي الرمح للأمام عاليًا قبل خط الرمي، مع قواعد الأمان (الرمي بالإشارة فقط، عدم جمع الرماح قبل انتهاء الجميع)، ويقلد التلميذ بالتدرج دون رمح ثم بالرمح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 و3 ص 118-121: محطات الرمي: رمي الرمح لأبعد مسافة، الرمي على الهدف من فوق الحاجز، رمي الكرة من الاقتراب، بمجموعات وقائد يسجل المسافة بالشريط، ويرمي التلميذ ويسجل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 ( الرئيسية) ص 123: رمي الرمح للصغار بين الفرق، محاولتان لكل تلميذ، وتحسب أبعد محاولة، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس2 (مستوى التطبيق): كم مسافة الاقتراب قبل الرمي؟\nالإجابة: 5 أمتار.\nس3 (مستوى الاستدلال): اذكر قاعدة أمان في رمي الرمح.\nالإجابة: نرمي بإشارة المعلم فقط ولا نجمع الرماح قبل انتهاء الجميع.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.", "التقويم الختامي": "س1 (مستوى المعرفة): ارمِ الرمح من الاقتراب لأبعد مسافة.\nالإجابة: يرمي قبل خط الرمي داخل منطقة الرمي.\nس2 (مستوى التطبيق): أي المحاولتين تحتسب؟\nالإجابة: الأبعد.\nس3 (مستوى الاستدلال): كيف شعرت في مسابقات الرمي هذا الأسبوع؟\nالإجابة: يعبر عن الرضا والسعادة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، وشجعه على الرمي بأدوات خفيفة في مكان آمن (دليل المعلم ص 116-123).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=13"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف مسابقات الرمي في ألعاب القوى للصغار وقواعد الرمي على الهدف.\n2. يؤدي رمي الكرة بيد واحدة من فوق الكتف لإصابة هدف من فوق حاجز.\n3. يطبق قواعد الرمي (من خلف خط الرمي، عدد المحاولات).\n\nالحصة 2:\n1. يتعرف مسابقة رمي الرمح للصغار وقواعدها.\n2. يؤدي رمي الرمح البلاستيكي من اقتراب قصير لأبعد مسافة.\n3. يشعر بالسعادة والرضا بمشاركة زملائه مسابقات الرمي.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\n\nالحصة 2:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب\n\nالحصة 2:\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم المبني على اللعب", "المصادر التعليمية": "الحصة 1:\n- أخرى: كرات صغيرة\n- أخرى: حواجز\n- أخرى: أطواق\n- أخرى: أقماع\n- أخرى: سلال\n- صورة توضيحية\n\nالحصة 2:\n- أخرى: رماح بلاستيكية\n- أخرى: أقماع\n- أخرى: شريط قياس\n- أخرى: أعلام\n- أخرى: مراتب", "المفاهيم": "الحصة 1:\n- الرمي\n- الدقة\n- خط الرمي\n- الهدف\n- المحاولة\n\nالحصة 2:\n- رمي الرمح\n- الاقتراب\n- منطقة الرمي\n- المسافة\n- الأمان", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم صور مسابقات الرمي ويسأل: كيف نرمي بدقة نحو هدف؟ ويقدم مسابقة الرمي على الهدف (ص 114-115).\n\nالحصة 2:\nيراجع المعلم الرمي على الهدف، ثم يعرض الرمح البلاستيكي ويسأل: كيف نمسكه؟ وما قواعد الأمان عند رميه؟", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم: جري، دوران الذراعين، رمي الكرة لأعلى ولقفها، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نموذج الرمي بيد واحدة من فوق الكتف: قدم متقدمة عكس اليد الرامية، سحب الذراع خلفًا، الرمي مع نقل الثقل للأمام والنظر إلى الهدف (ص 115-116)، ويقلد التلميذ بالتدرج (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 1 ص 117: فرق في قطارات خلف خط الرمي، حاجز بينها وبين الأهداف (أطواق وسلال)، لكل تلميذ محاولتان، وتحسب نقاط الإصابة للفريق، ويرمي التلميذ ويسجل القائد (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. سباق السبورة: يتسابق ممثل من كل مجموعة لكتابة إجابة «كيف شعرت في مسابقات الرمي هذا الأسبوع» على السبورة، ويناقش المعلم الإجابات مع الصف (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وإطالة الذراعين، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم النموذج (ص 116): مسك الرمح من المقبض فوق الكتف، اقتراب 5 م، سحب الذراع خلفًا ورمي الرمح للأمام عاليًا قبل خط الرمي، مع قواعد الأمان (الرمي بالإشارة فقط، عدم جمع الرماح قبل انتهاء الجميع)، ويقلد التلميذ بالتدرج دون رمح ثم بالرمح (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. نشاط 2 و3 ص 118-121: محطات الرمي: رمي الرمح لأبعد مسافة، الرمي على الهدف من فوق الحاجز، رمي الكرة من الاقتراب، بمجموعات وقائد يسجل المسافة بالشريط، ويرمي التلميذ ويسجل (12 دقيقة)\nالاستراتيجيات: التعلم التعاوني.\n\n4. نشاط 4 ( الرئيسية) ص 123: رمي الرمح للصغار بين الفرق، محاولتان لكل تلميذ، وتحسب أبعد محاولة، ويتسابق التلميذ (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. تهدئة وتعبير، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): أي قدم تتقدم عند الرمي باليد اليمنى؟\nالإجابة: القدم اليسرى.\nس2 (مستوى التطبيق): من أين نرمي في المسابقة؟\nالإجابة: من خلف خط الرمي.\nس3 (مستوى الاستدلال): كم محاولة لكل تلميذ؟\nالإجابة: محاولتان.\n\nالحصة 2:\nس1 (مستوى المعرفة): من أين نمسك الرمح؟\nالإجابة: من المقبض.\nس2 (مستوى التطبيق): كم مسافة الاقتراب قبل الرمي؟\nالإجابة: 5 أمتار.\nس3 (مستوى الاستدلال): اذكر قاعدة أمان في رمي الرمح.\nالإجابة: نرمي بإشارة المعلم فقط ولا نجمع الرماح قبل انتهاء الجميع.\n\n• نشاط علاجي (لمن لم يتقن): يقف المعلم مع التلميذ قريبًا من هدف كبير، ويرميان كرة صغيرة بيد واحدة من فوق الكتف مع تقديم القدم المعاكسة، ثم يسأله: أي قدم تتقدم عند الرمي باليد اليمنى؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالرمي من فوق حاجز نحو أهداف على مسافات مختلفة بمحاولتين لكل هدف، وتسجيل النقاط، وتفسير دور القدم المتقدمة.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ارمِ الكرة من فوق الحاجز لتصيب الطوق.\nالإجابة: يرمي بدقة من فوق الكتف.\nس2 (مستوى التطبيق): كيف يفوز الفريق في مسابقة الرمي على الهدف؟\nالإجابة: بأكبر عدد من الإصابات.\nس3 (مستوى الاستدلال): لماذا ننظر إلى الهدف لا إلى الكرة أثناء الرمي؟\nالإجابة: لتوجيه الرمية بدقة نحو الهدف.\n\nالحصة 2:\nس1 (مستوى المعرفة): ارمِ الرمح من الاقتراب لأبعد مسافة.\nالإجابة: يرمي قبل خط الرمي داخل منطقة الرمي.\nس2 (مستوى التطبيق): أي المحاولتين تحتسب؟\nالإجابة: الأبعد.\nس3 (مستوى الاستدلال): كيف شعرت في مسابقات الرمي هذا الأسبوع؟\nالإجابة: يعبر عن الرضا والسعادة.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: العب مع طفلك رمي كرة صغيرة فوق حبل لإصابة سلة (دليل المعلم ص 115-117).\n\nالحصة 2:\nإرشاد لولي الأمر: ناقش مع طفلك قواعد الأمان في الرمي، وشجعه على الرمي بأدوات خفيفة في مكان آمن (دليل المعلم ص 116-123).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=13"}}, {"title": "قياس الأداء العملي", "unit": "تقويم الفصل الدراسي الأول", "week": "السادس عشر", "date": "20-24/12/2026", "pages": "دليل المعلم ص 64-124 (الوحدتان الثانية والثالثة)", "n": 2, "periods": [{"focus": "قياس أداء الاتزان والبراعة والطلاقة الحركية", "num": 1, "fields": {"المخرجات التعليمية": "1. يؤدي الميزان الأمامي والاتزان على المقعد السويدي.\n2. يؤدي حركات البراعة الحركية (الوثب بتلامس القدمين، دوران الطاحونة).\n3. يؤدي الوثب بالحبل والجري في سلم الرشاقة.", "المستوى المعرفي": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم الذاتي\n- التعلم المبني على اللعب", "المصادر التعليمية": "- أخرى: مقاعد سويدية\n- أخرى: مراتب\n- أخرى: حبال وثب\n- أخرى: سلم الرشاقة\n- أخرى: كرات\n- أخرى: استمارة تقويم الأداء", "المفاهيم": "- قياس الأداء\n- الاتزان\n- البراعة الحركية\n- الطلاقة الحركية", "التهيئة / التمهيد / التعلم القبلي": "يوضح المعلم محطات القياس ويطمئن التلاميذ ويذكر بالنقاط الفنية.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. قياس فردي في ثلاث محطات مع تدريب ذاتي لبقية المجموعات: محطة 1 الميزان الأمامي 5 ثوانٍ ثم المشي على المقعد والهبوط بثبات، محطة 2 الوثب بتلامس القدمين 3 مرات ودوران الطاحونة، محطة 3 الوثب بالحبل 10 مرات والجري في سلم الرشاقة؛ ويرصد المعلم في الاستمارة، ويؤدي التلميذ عند دوره ويتدرب مستقلًا (25 دقيقة)\nالاستراتيجيات: التعلم الذاتي.\n\n3. لعبة ختامية (تم مصادر التعليمية": "الحصة 1:\n- صورة توضيحية\n- أخرى: بطاقات مصورة\n- أخرى: أقماع\n- أخرى: كرات\n\nالحصة 2:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: حبال\n- أخرى: رماح بلاستيكية", "المفاهيم": "الحصة 1:\n- النشاط البدني\n- وقت الشاشة\n- اليوم النشط\n- الصحة\n\nالحصة 2:\n- النشاط الحر\n- القائد\n- الاختيار\n- الأمن والسلامة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيعرض المعلم بطاقتين (طفل يلعب في الحديقة، طفل أمام الشاشة ساعات) ويسأل: أي اليومين أفضل للجسم؟\n\nالحصة 2:\nيعرض المعلم الأدوات ويذكر الأنشطة المقترحة (ألعاب شعبية، منافسات، عروض) ويقول: اليوم تختار كل مجموعة (دليل المعلم ص 17).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يشرح المعلم فوائد النشاط اليومي (قلب أقوى، عضلات أقوى، نوم أفضل، مزاج أفضل) وضرر الجلوس الطويل أمام الشاشة، ونصيحة: ساعة حركة يوميًا (برنامج صحتي ص 23)، ويستمع التلميذ ويرتب البطاقات (10 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. لعبة (اليوم النشط): مسار بمحطات تمثل اليوم (مشي للمدرسة، لعب في الفسحة، رياضة عصرًا) يؤديه التلاميذ بالتتابع، ويلعب التلميذ (12 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. في مجموعات، تضع كل مجموعة خطة أسبوعية لنشاط بدني في العطلة (نشاط لكل يوم) وتعرضها، ويخطط التلميذ ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة ونصيحة، ويؤدي التلميذ التهدئة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\nالحصة 2 — زمن الحصة 40 دقيقة\n\n1. إحماء بنموذج المعلم، ويقلد التلميذ (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. تقسيم المجموعات بقائد وتحاور كل مجموعة لاختيار لعبة وإعداد أدواتها، ويحاور التلميذ ويختار (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تنفذ المجموعات ألعابها بإشراف المعلم مع تبديل القائد في المنتصف، ويلعب التلميذ ويلتزم ويتبادل القيادة (20 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. تعرض كل مجموعة لعبتها في دقيقة، ويعرض التلميذ (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تهدئة وتعبير عن أجمل حصة في الفصل، ويؤدي التلميذ التهدئة ويعبر (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "الحصة 1:\nس1 (مستوى المعرفة): اذكر فائدتين للنشاط البدني اليومي.\nالإجابة: قلب أقوى ونوم أفضل.\nس2 (مستوى التطبيق): كم ساعة حركة يوميًا ينصح بها للأطفال؟\nالإجابة: ساعة على الأقل.\nس3 (مستوى الاستدلال): ما ضرر الجلوس الطويل أمام الشاشة؟\nالإجابة: ضعف العضلات والقوام وتعب العين.\n\nالحصة 2:\nس1 (مستوى المعرفة): ما اللعبة التي اختارتها مجموعتك ولماذا؟\nالإجابة: يذكر ويعلل.\nس2 (مستوى التطبيق): ما دور القائد في النشاط الحر؟\nالإجابة: ينظم ويوزع الأدوار ويحرص على السلامة.\nس3 (مستوى الاستدلال): لماذا نبدل القائد؟\nالإجابة: ليجرب الجميع القيادة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا ليوم نشط وآخر خامل، ويفرزها مع التلميذ ويعدّان دقائق الحركة في كل يوم، ثم يسأله: كم ساعة حركة يوميًا ينصح بها للأطفال؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتخطيط جدول نشاط بدني يومي لأسبوع من العطلة لا يقل عن ساعة يوميًا، واختيار نشاط حر لمجموعتهم وقيادته بأمان.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): ما النشاط الذي خططت له ليوم السبت في العطلة؟\nالإجابة: يذكر نشاطًا.\nس2 (مستوى التطبيق): أرفع صورة طفل يلعب بالدراجة، أهو يوم نشط؟\nالإجابة: نعم.\nس3 (مستوى الاستدلال): اقترح طريقة لتقليل وقت الشاشة.\nالإجابة: تحديد وقت محدد واللعب خارج المنزل.\n\nالحصة 2:\nس1 (مستوى المعرفة): اذكر قاعدة سلامة التزمتم بها.\nالإجابة: مثل: عدم الدفع واستخدام الأدوات بحذر.\nس2 (مستوى التطبيق): ما المهارة من هذا الفصل التي استخدمتها في لعبتكم؟\nالإجابة: يذكر مهارة.\nس3 (مستوى الاستدلال): أي حصة أحببتها أكثر هذا الفصل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: ساعد طفلك على تنفيذ خطته الأسبوعية للنشاط البدني في العطلة (برنامج صحتي، دليل المعلم ص 23).\n\nالحصة 2:\nإرشاد لولي الأمر: شجع طفلك على الألعاب الشعبية والحركية مع الأصدقاء في العطلة ومراجعة مهارات الفصل الأول.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=15"}}],[{"title": "مراجعة (إعداد بدني)", "unit": "تمهيدية", "week": "الأول", "date": "6-10/9/2026", "pages": "دليل المعلم ص 13-23 (إرشادات المعلم، النشاط الحر، البرامج المنهجية)", "n": 1, "periods": [{"focus": "مراجعة قواعد الحصة والتشكيلات وتمرينات الإعداد البدني + مراجعة الحركات الأساسية ومهارات الكرة من الصف الثاني", "num": 1, "fields": {"المخرجات التعليمية": "1. يتذكر قواعد الأمن والسلامة والتشكيلات الرياضية.\n2. يؤدي تمرينات إعداد بدني للذراعين والجذع والرجلين بالعد.\n3. يقدر أهمية الإعداد البدني في بداية الحصة.\n4. يؤدي الخطو الجانبي وركضة الحصان وتبادل الخطو والحجل في مسار مراجعة.\n5. يؤدي التنطيط والمحاورة وضرب الكرة بالطريقة الصحيحة.\n6. يحدد المهارة التي يحتاج إلى تدريب أكثر.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم المبني على اللعب\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم الذاتي", "المصادر التعليمية": "- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: بطاقات التمرينات\n- أخرى: بالونات\n- أخرى: حبال", "المفاهيم": "- الإعداد البدني\n- التشكيلات\n- الإحماء\n- قواعد الحصة\n- الحركات الأساسية\n- التنطيط\n- المحاورة\n- ضرب الكرة", "التهيئة / التمهيد / التعلم القبلي": "يرحب المعلم بالتلاميذ ويسأل: ما التشكيلات التي تعرفونها؟ ولماذا نبدأ الحصة بالإحماء؟ ويعرض بطاقات التمرينات.", "إجراءات سير الدرس / الأنشطة التدريسية": "1. لعبة (النداء على التشكيل) بالجري والتجمع السريع في الصف والقطار والدائرة والمربع الناقص ضلعًا، ويستجيب التلميذ ويكوّن التشكيل (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. يؤدي المعلم نماذج الإعداد البدني: (وقوف فتحًا. الذراعان جانبًا) لف الجذع، (وقوف) تبادل رفع الركبتين، (انبطاح مائل) ثني الذراعين بسيط، بالعد الرباعي مع التفكير بصوت عالٍ عن الجزء العامل، ويقلد التلميذ بالعد ويسمي الجزء العامل (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. مجموعات بقائد تؤدي ثلاثة تمرينات من البطاقات (ذراعان، جذع، رجلان) وتعرضها، والتلاميذ يتعاون ويعرض (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. يسأل المعلم: ماذا شعرتم بعد الإحماء؟ ليستنتج التلاميذ سبب الإعداد البدني (دفء العضلات ومنع الإصابة)، ويستنتج التلميذ (2 دقيقتان)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. محطات مراجعة بأربع مجموعات: التنطيط المتعرج، المحاورة حول مدافع ثابت، ضرب البالون من أعلى ومن أسفل، اللف والدوران بالكرة، مع التبديل كل 4 دقائق، ويؤدي التلميذ ويبدل ويسجل القائد (10 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. لعبة (قطع الكرة) بالتنطيط داخل مربع، ويلعب التلميذ ويحافظ على كرته (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. يحدد كل تلميذ المهارة التي يحتاج إلى تدريب أكثر عليها ويخبر المعلم، ويحدد التلميذ ويعبر (2 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n8. تهدئة، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): لماذا نبدأ الحصة بالإعداد البدني؟\nالإجابة: لتسخين العضلات والمفاصل ومنع الإصابة.\nس2 (مستوى التطبيق): اذكر تمرينًا للجذع.\nالإجابة: لف الجذع من وضع الوقوف فتحًا.\nس3 (مستوى الاستدلال): ما التشكيل الذي يقف فيه المعلم في منتصف الضلع الناقص؟\nالإجابة: المربع الناقص ضلعًا.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرين لف الجذع من الوقوف فتحًا ببطء بالعد، ثم يقفان في تشكيل المربع الناقص ضلعًا بعلامات على الأرض، ثم يسأله: لماذا نبدأ الحصة بالإعداد البدني؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إعداد بدني قصير من ثلاثة تمرينات (للذراعين والجذع والرجلين) بالعد، ثم أداء الخطو الجانبي وركضة الحصان في مسار يحددونه.\n\nس4 (مستوى المعرفة): بأي جزء من اليد ننطط الكرة؟\nالإجابة: بالأصابع.\nس5 (مستوى التطبيق): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة، وثبة، خطوة.\nس6 (مستوى الاستدلال): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالساعدين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرين لف الجذع من الوقوف فتحًا ببطء بالعد، ثم يقفان في تشكيل المربع الناقص ضلعًا بعلامات على الأرض، ثم يسأله: لماذا نبدأ الحصة بالإعداد البدني؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إعداد بدني قصير من ثلاثة تمرينات (للذراعين والجذع والرجلين) بالعد، ثم أداء الخطو الجانبي وركضة الحصان في مسار يحددونه.", "التقويم الختامي": "س1 (مستوى المعرفة): أدِّ تمرينًا للرجلين بالعد الرباعي.\nالإجابة: تبادل رفع الركبتين بالعد.\nس2 (مستوى التطبيق): اذكر قاعدتين من قواعد الأمن والسلامة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك عرض التمرينات؟\nالإجابة: يعد القائد ويؤدي الجميع معًا بتوافق.\n\nس4 (مستوى المعرفة): حاور بالكرة حول قمعين.\nالإجابة: يحاور بتنطيط منخفض.\nس5 (مستوى التطبيق): اذكر محطتين من المراجعة.\nالإجابة: التنطيط المتعرج وضرب البالون.\nس6 (مستوى الاستدلال): ما المهارة التي ستتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم.\nإرشاد لولي الأمر: شجع طفلك على التدرب 10 دقائق يوميًا على المهارة التي اختارها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=1"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتذكر قواعد الأمن والسلامة والتشكيلات الرياضية.\n2. يؤدي تمرينات إعداد بدني للذراعين والجذع والرجلين بالعد.\n3. يقدر أهمية الإعداد البدني في بداية الحصة.\n4. يؤدي الخطو الجانبي وركضة الحصان وتبادل الخطو والحجل في مسار مراجعة.\n5. يؤدي التنطيط والمحاورة وضرب الكرة بالطريقة الصحيحة.\n6. يحدد المهارة التي يحتاج إلى تدريب أكثر.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم المبني على اللعب\n- التعلم بالنمذجة\n- التعلم التعاوني\n- التعلم بالاكتشاف\n- التعلم الذاتي", "المصادر التعليمية": "الحصة 1:\n- أخرى: أقماع\n- أخرى: أطواق\n- أخرى: كرات\n- أخرى: بطاقات التمرينات\n- أخرى: بالونات\n- أخرى: حبال", "المفاهيم": "الحصة 1:\n- الإعداد البدني\n- التشكيلات\n- الإحماء\n- قواعد الحصة\n- الحركات الأساسية\n- التنطيط\n- المحاورة\n- ضرب الكرة", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيرحب المعلم بالتلاميذ ويسأل: ما التشكيلات التي تعرفونها؟ ولماذا نبدأ الحصة بالإحماء؟ ويعرض بطاقات التمرينات.", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. لعبة (النداء على التشكيل) بالجري والتجمع السريع في الصف والقطار والدائرة والمربع الناقص ابة: بالأصابع.\nس5 (مستوى التطبيق): ما تسلسل ركضة الحصان؟\nالإجابة: خطوة، وثبة، خطوة.\nس6 (مستوى الاستدلال): بأي جزء نضرب الكرة من أسفل؟\nالإجابة: بالساعدين.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم مع التلميذ تمرين لف الجذع من الوقوف فتحًا ببطء بالعد، ثم يقفان في تشكيل المربع الناقص ضلعًا بعلامات على الأرض، ثم يسأله: لماذا نبدأ الحصة بالإعداد البدني؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقيادة إعداد بدني قصير من ثلاثة تمرينات (للذراعين والجذع والرجلين) بالعد، ثم أداء الخطو الجانبي وركضة الحصان في مسار يحددونه.", "التقويم الختامي": "الحصة 1:\nس1 (مستوى المعرفة): أدِّ تمرينًا للرجلين بالعد الرباعي.\nالإجابة: تبادل رفع الركبتين بالعد.\nس2 (مستوى التطبيق): اذكر قاعدتين من قواعد الأمن والسلامة.\nالإجابة: الاستجابة للصافرة، وعدم الدفع.\nس3 (مستوى الاستدلال): كيف تنظم مجموعتك عرض التمرينات؟\nالإجابة: يعد القائد ويؤدي الجميع معًا بتوافق.\n\nس4 (مستوى المعرفة): حاور بالكرة حول قمعين.\nالإجابة: يحاور بتنطيط منخفض.\nس5 (مستوى التطبيق): اذكر محطتين من المراجعة.\nالإجابة: التنطيط المتعرج وضرب البالون.\nس6 (مستوى الاستدلال): ما المهارة التي ستتدرب عليها في المنزل ولماذا؟\nالإجابة: يذكر ويعلل.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "الحصة 1:\nإرشاد لولي الأمر: تأكد من الزي الرياضي وزجاجة الماء، وراجع مع طفلك نماذج الإعداد البدني في دليل المعلم.\nإرشاد لولي الأمر: شجع طفلك على التدرب 10 دقائق يوميًا على المهارة التي اختارها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=1"}}, {"title": "الأوضاع المشتقة في التمرينات", "unit": "التمرينات (أتمرن بنظام)", "week": "الثاني", "date": "13-17/9/2026", "pages": "دليل المعلم ص 30-41", "n": 1, "periods": [{"focus": "الأوضاع المشتقة من الجلوس + الأوضاع المشتقة من الرقود", "num": 1, "fields": {"المخرجات التعليمية": "1. يتعرف الأوضاع المشتقة من الجلوس (جلوس طويل، جلوس فتحًا، جلوس تربيع، جلوس القرفصاء).\n2. يؤدي أوضاعًا مشتقة من الجلوس بدقة وتمرينًا بسيطًا من كل وضع.\n3. يميز بين الوضع الأساسي والوضع المشتق.\n4. يتعرف الأوضاع المشتقة من الرقود (رقود فتحًا، رقود على البطن، رقود الذراعان عاليًا).\n5. يؤدي تمرينات من الأوضاع المشتقة من الرقود بالعد.\n6. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "- أخرى: مراتب\n- أخرى: بطاقات مصورة\n- أخرى: كرات\n- صورة توضيحية\n- أخرى: أعلام ملونة", "المفاهيم": "- الوضع الأساسي\n- الوضع المشتق\n- الجلوس\n- الجذع\n- اللياقة البدنية\n- الرقود\n- القوام السليم\n- عضلات البطن والظهر", "التهيئة / التمهيد / التعلم القبلي": "يجلس المعلم جلوسًا طويلًا ثم يفتح رجليه ويسأل: ما الوضع الأساسي؟ وماذا تغير؟ ويراجع مفهوم الوضع المشتق (ص 30-31).", "إجراءات سير الدرس / الأنشطة التدريسية": "1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 31-33: (جلوس طويل)، (جلوس طويل فتحًا)، (جلوس تربيع. الذراعان عاليًا)، (جلوس القرفصاء)، (جلوس. الذراعان خلفًا استنادًا) مع النقاط الفنية (استقامة الظهر)، ثم تمرين من كل وضع بالعد (ثني الجذع أمامًا، لف الجذع)، ويقلد التلميذ ويؤدي التمرين بالعد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. بطاقة وضع الجلوس الأساسي لكل زوج؛ يبتكر الزوجان أربعة أوضاع مشتقة بتحريك الرجلين أو الذراعين أو الجذع، ويستنتج الصف القاعدة، ويبتكر التلميذ ويستنتج (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة (تمثال الجلوس): جري حر وعند نداء الوضع يجلس التلميذ في الوضع المشتق الصحيح على أقرب مرتبة، ويستجيب التلميذ بدقة (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. يؤدي المعلم نماذج ص 34-36: (رقود فتحًا)، (رقود. الذراعان عاليًا)، (رقود على البطن)، (رقود. ثني الركبتين)، مع تمرين من كل وضع (رفع الرجلين بالتبادل، رفع الجذع من الرقود على البطن) بالعد، ويقلد التلميذ ويؤدي التمرين بالعد (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. محطات الأوضاع المشتقة من الرقود والجلوس بأربع مجموعات: محطة رقود فتحًا (رفع الرجلين)، محطة رقود على البطن (رفع الذراعين والرجلين)، محطة جلوس طويل (مد الذراعين للقدمين)، محطة جلوس تربيع (لف الجذع)، مع التبديل، ويؤدي التلميذ تمرين المحطة ويبدل (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نشاط 5 ص 40: يرفع المعلم علمًا ملونًا يرمز لوضع أساسي، ويؤدي التلاميذ وضعًا مشتقًا منه من اختيارهم، ويستجيب التلميذ بوضع مشتق صحيح (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n8. تهدئة من الرقود والتنفس، ويؤدي التلميذ التهدئة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.", "التقويم التكويني": "س1 (مستوى المعرفة): ما الوضع الأساسي لوضع (جلوس طويل فتحًا)؟\nالإجابة: الجلوس.\nس2 (مستوى التطبيق): أدِّ وضع (جلوس القرفصاء).\nالإجابة: يجلس على المشطين والركبتان منثنيتان بالكامل.\nس3 (مستوى الاستدلال): كيف يكون الظهر في الجلوس الطويل؟\nالإجابة: مستقيمًا.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ أوضاع الجلوس المشتقة (الطويل، وفتحًا، والتربيع، والقرفصاء) ببطء مع صور مساعدة، ويؤديها معه، ثم ينادي «جلوس القرفصاء!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين أوضاع الجلوس المشتقة مع تمرين بسيط من كل وضع، وتحديد الوضع الأساسي لكل وضع مشتق.\n\nس4 (مستوى المعرفة): اذكر وضعين مشتقين من الرقود.\nالإجابة: رقود فتحًا، رقود على البطن.\nس5 (مستوى التطبيق): ما التمرين الذي أديناه من الرقود على البطن؟\nالإجابة: رفع الذراعين والرجلين (أو الجذع).\nس6 (مستوى الاستدلال): أي العضلات تعمل في رفع الرجلين من الرقود؟\nالإجابة: عضلات البطن.\n\n• نشاط علاجي (لمن لم يتقن): يؤدي المعلم أمام التلميذ أوضاع الجلوس المشتقة (الطويل، وفتحًا، والتربيع، والقرفصاء) ببطء مع صور مساعدة، ويؤديها معه، ثم ينادي «جلوس القرفصاء!» ليؤديه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بلعبة «النداء السريع» بين أوضاع الجلوس المشتقة مع تمرين بسيط من كل وضع، وتحديد الوضع الأساسي لكل وضع مشتق.", "التقويم الختامي": "س1 (مستوى المعرفة): اذكر ثلاثة أوضاع مشتقة من الجلوس.\nالإجابة: جلوس طويل، جلوس فتحًا، جلوس تربيع.\nس2 (مستوى التطبيق): أدِّ تمرين ثني الجذع أمامًا من الجلوس الطويل بالعد.\nالإجابة: يؤديه بالعد والركبتان مستقيمتان.\nس3 (مستوى الاستدلال): ابتكر وضعًا مشتقًا من الجلوس وسمِّه.\nالإجابة: مثل: جلوس طويل. الذراعان جانبًا.\n\nس4 (مستوى المعرفة): أدِّ وضع (رقود. ثني الركبتين) ثم تمرين رفع الجذع مرتين.\nالإجابة: يؤديه بطريقة صحيحة.\nس5 (مستوى التطبيق): أرفع علمًا يرمز للرقود، أدِّ وضعًا مشتقًا منه.\nالإجابة: يؤدي وضعًا مشتقًا من الرقود.\nس6 (مستوى الاستدلال): كيف تساعد تمرينات الرقود على القوام السليم؟\nالإجابة: تقوي عضلات البطن والظهر التي تحمل الجذع معتدلًا.", "ملاحظات ضمن خطة الدراسة الأسبوعية": "إرشاد لولي الأمر: راجع مع طفلك صور الأوضاع المشتقة من الجلوس في دليل المعلم ص 31-33 ومارسا تمرينًا من كل وضع.\nإرشاد لولي الأمر: مارس مع طفلك تمرينًا من الرقود (رفع الرجلين بالتبادل) 10 مرات يوميًا (دليل المعلم ص 34-40).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/pe/?l=2"}}], "combined": {"المخرجات التعليمية": "الحصة 1:\n1. يتعرف الأوضاع المشتقة من الجلوس (جلوس طويل، جلوس فتحًا، جلوس تربيع، جلوس القرفصاء).\n2. يؤدي أوضاعًا مشتقة من الجلوس بدقة وتمرينًا بسيطًا من كل وضع.\n3. يميز بين الوضع الأساسي والوضع المشتق.\n4. يتعرف الأوضاع المشتقة من الرقود (رقود فتحًا، رقود على البطن، رقود الذراعان عاليًا).\n5. يؤدي تمرينات من الأوضاع المشتقة من الرقود بالعد.\n6. يقدر أهمية التمرينات في المحافظة على الصحة والقوام السليم.", "المستوى المعرفي": "الحصة 1:\nالمخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تقييم", "الاستراتيجيات": "الحصة 1:\n- التعلم بالنمذجة\n- التعلم بالاكتشاف\n- التعلم المبني على اللعب\n- التعلم التعاوني", "المصادر التعليمية": "الحصة 1:\n- أخرى: مراتب\n- أخرى: بطاقات مصورة\n- أخرى: كرات\n- صورة توضيحية\n- أخرى: أعلام ملونة", "المفاهيم": "الحصة 1:\n- الوضع الأساسي\n- الوضع المشتق\n- الجلوس\n- الجذع\n- اللياقة البدنية\n- الرقود\n- القوام السليم\n- عضلات البطن والظهر", "التهيئة / التمهيد / التعلم القبلي": "الحصة 1:\nيجلس المعلم جلوسًا طويلًا ثم يفتح رجليه ويسأل: ما الوضع الأساسي؟ وماذا تغير؟ ويراجع مفهوم الوضع المشتق (ص 30-31).", "إجراءات سير الدرس / الأنشطة التدريسية": "الحصة 1 — زمن الحصة 40 دقيقة\n1. إحماء بنموذج المعلم، ويقلد التلميذ (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. يؤدي المعلم نماذج ص 31-33: (جلوس طويل)، (جلوس
